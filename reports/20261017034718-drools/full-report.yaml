      - number: '1.2'
        title: Capitalization and scale
        blocks:
          - type: paragraph
            body: >-
              The disclosed financing history has two pivotal events. Tracxn records a $60 million L Catterton
              private-equity round on June 20, 2023, but its stated $474 million post-money valuation conflicts with
              Financial Express's report that the same investment valued Drools at $600 million. In May 2025, Nestlé
              acquired a minority stake and said Drools would remain strategically and operationally independent. Nestlé
              also said no other terms would be disclosed, while Financial Express separately noted that the price and
              valuation at which Nestlé invested were unknown. Accordingly, the widely reported $1 billion valuation
              should be treated as a third-party valuation marker, not a disclosed transaction price. More recent
              operating indicators include SoJapan's report of ₹932.3 crore FY2025 revenue, up 28.7% year over year, and
              Tracxn's report of 4,195 employees as of April 30, 2026. Neither metric establishes current cash
              availability, profitability, or customer economics.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO013
              - CO015
