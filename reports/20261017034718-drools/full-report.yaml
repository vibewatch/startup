              - CE010
              - CE011
      - number: '5.3'
        title: Differentiation, controls, and open diligence points
        blocks:
          - type: paragraph
            body: >-
              The clearest product differentiation in the assigned pool is operational: independent coverage repeatedly
              describes Drools as locally manufactured, science-based, and more affordable for Indian pet parents, with
              domestic production helping it compete on price and distribution in a category long dominated by imports.
              That is a credible moat, but it is not the same as a deeply documented technology stack. The same public
              set does not disclose external safety certifications, plant audit results, recall history, product-level
              efficacy data, or post-investment R&D outputs in enough detail to underwrite quality assurance or
              formulation defensibility. For this chapter, the key risk is not software reliability; it is whether a
              large physical network can keep quality, inventory, and channel execution consistent while the brand
              expands.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Scaled physical delivery stack
            body: >-
              Six manufacturing units, 1.6 million square feet of warehousing, 40,000+ outlets, and 22-country exports
              make Drools look operationally mature for a consumer pet-food brand.
            calloutType: strength
            claimRefs:
