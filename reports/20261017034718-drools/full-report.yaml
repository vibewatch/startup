              - CM008
      - number: '2.3'
        title: Buyer segmentation, budget ownership, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The evidence points to a household-discretionary purchase with a trust overlay rather than an enterprise
              procurement sale. BusinessOutreach, Scribd, and startup coverage together show Drools spanning economy,
              core, premium, treat, supplement, and prescription-adjacent lines across dogs and cats, which implies
              multiple entry points into the same nutrition workflow. Adoption appears to move through omnichannel
              availability plus veterinary or science-based trust cues: broad general trade and ecommerce extend reach,
              while vet-backed formulations and premium sub-brands support trading up. Drools' own operating scale
              matters here because over 40,000 retail outlets, six manufacturing units, exports to 22 countries, and a
              large sales force make route-to-market a meaningful part of its market access thesis, not just a
              post-market-share detail.
            claimRefs:
              - CM009
              - CM010
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Conversion matters more than household count alone
            body: >-
              Public evidence suggests Drools benefits more from converting existing pet households into regular
              commercial feeding than from assuming rapid pet-ownership penetration by itself.
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM008
          - type: callout
            title: Public TAM math stays noisy
            body: >-
              The available numbers mix pet food, broader pet care, and company-estimate narratives, so valuation work
              should treat public market sizing as directional until segment and channel evidence is disclosed.
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The landscape is broader than one domestic peer set
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does not support a narrow "Drools versus one rival" framing. StartupIndiaX says Drools
              entered a market dominated by Pedigree and Mars PetCare, while India-Marketing says Indian pet food was
              long led by imports and that Drools won share on price and distribution. StartupWired then adds a second
              flank of local specialists—Wiggles, Heads Up For Tails, and Benny's Bowl—whose propositions emphasize
              wellness or gourmet experiences instead of matching Drools factory scale. Tracxn's comparator set still
              places Mars among Drools' benchmark peers, reinforcing that the relevant landscape spans global
              incumbents, local specialists, and adjacent pet-care entrants rather than a single domestic branded-food
              cohort.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP011
