    summary: >-
      The public record clusters Drools' top risks around disclosure opacity and scale execution rather than a verified
      enforcement event.
    data:
      columns:
        - label: Likelihood
          detail: 12-18 month underwriting horizon
        - label: Impact
          detail: Downside to valuation, control, or continuity if realized
        - label: Mitigation maturity
          detail: Only controls visible in assigned public evidence
        - label: Residual exposure
          detail: Exposure remaining after visible mitigations
      rows:
        - label: Undisclosed investment terms
          note: Minority stake is public; governance package is not.
          values:
            - label: Medium
            - label: High
            - label: Low
            - label: High
        - label: Manufacturing and quality-control scale
