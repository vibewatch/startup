      - number: '4.2'
        title: Cost structure and unit-economics visibility
        blocks:
          - type: paragraph
            body: >-
              Public operating-scale indicators suggest a business with meaningful manufacturing, warehousing, and
              channel-servicing costs. May 2025 reporting describes six manufacturing units, roughly 1.6 million square
              feet of warehousing, 650+ SKUs, and about 3,400 employees including 1,800 sales professionals.
              PetfoodIndustry, however, separately described three facilities with approximately 89,400 metric tons of
              annual capacity, creating a real reconciliation issue on the asset base. That discrepancy matters because
              it changes how an investor would think about capex, utilization, and fixed-cost leverage. The chapter pool
              does not disclose realized pricing, gross margin, contribution margin, customer acquisition cost, payback,
              or inventory turns, so the public record is much stronger on scale than on efficiency.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI013
