  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Scale and strategic validation are real, but undisclosed deal mechanics and limited profitability disclosure keep
      the recommendation at research-more.
    data:
      nodes:
        - id: n1
          label: 2023 valuation anchor
          summary: $60 million at a $600 million valuation set the last clearly disclosed benchmark.
          claimRefs:
            - CV002
        - id: n2
          label: 2025 strategic validation
          summary: Nestlé's minority investment supports relevance, but not a clean public price bridge.
          claimRefs:
            - CV001
            - CV003
            - CV013
        - id: n3
          label: Operating scale
          summary: FY2025 revenue, retail reach, exports, and manufacturing footprint indicate real commercial scale.
          claimRefs:
            - CV004
            - CV010
            - CV014
        - id: n4
          label: Profitability and competition risk
          summary: FY2024 net loss and competitive pressure limit confidence in premium underwriting.
          claimRefs:
            - CV006
            - CV012
        - id: n5
          label: Disclosure gap
          summary: Stake size, price mechanics, preferences, and governance rights remain undisclosed.
          claimRefs:
            - CV001
            - CV008
            - CV009
            - CV011
        - id: n6
          label: Recommendation
          summary: research-more / stretched / high risk until terms and audited economics are disclosed.
          claimRefs:
            - CV015
            - CV016
      edges:
        - from: n1
          to: n2
          label: step-up
          claimRefs:
            - CV002
            - CV003
        - from: n2
          to: n3
          label: needs scale support
          claimRefs:
            - CV003
            - CV004
        - from: n3
          to: n4
          label: offset by
          claimRefs:
            - CV004
            - CV006
        - from: n4
          to: n5
          label: worsened by
          claimRefs:
            - CV006
            - CV011
        - from: n5
          to: n6
          label: drives
          claimRefs:
            - CV015
            - CV016
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV006
      - CV011
      - CV015
      - CV016
