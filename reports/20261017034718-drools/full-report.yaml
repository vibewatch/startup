      - number: '3.2'
        title: Drools' strongest moat is operating breadth and replenishment reach
        blocks:
          - type: paragraph
            body: >-
              The most defensible differentiation in the retained pool is not luxury branding; it is breadth.
              BusinessLine and NewsBytes both say Drools reaches more than 40,000 retail outlets and exports to 22
              countries, while BusinessLine and Financial Express say it operates six manufacturing units and 650+ SKUs.
              StartupIndiaX and StartupWired describe a go-to-market mix that spans online, offline, and even
              veterinary-clinic channels, which matters because pet food is a replenishment category where shelf
              presence, assortment breadth, and repeat availability can matter more than a one-off feature lead. Against
              startup challengers, that footprint raises the bar for displacement and makes multi-homing more likely
              than full switching.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP010
