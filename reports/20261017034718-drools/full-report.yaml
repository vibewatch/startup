chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Drools operates as an Indian manufacturer of food and nutrition products for dogs and cats, with the
              company positioning its formulas around animal protein, veterinary input, and controlled manufacturing.
              Public sources do not agree on the starting date: Tracxn dates the company to 2009, while Financial
              Express, NewsBytes, SoJapan, and an independently uploaded business-model deck use 2010. The legal entity
              now associated with the brand, Drools Pet Food Private Limited, was incorporated in Chhattisgarh on
              September 10, 2018 and is shown as active. This distinction between brand origin and legal-entity
              incorporation should be retained rather than collapsed into one founding date. Operating scale is
              substantial for a private Indian pet-food business: 2025 reporting cited more than 40,000 retail outlets,
              exports to 22 countries, six manufacturing units, and 1.6 million square feet of warehousing. These
              figures establish reach, but they remain reported snapshots rather than audited measures of utilization or
              sell-through.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO011
              - CO012
