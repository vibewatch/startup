      - number: '3.3'
        title: Nestlé validates the category but keeps Purina in the frame
        blocks:
          - type: paragraph
            body: >-
              The minority investment does not erase incumbent overlap. Financial Express and BusinessLine both note
              that Nestlé already had pet-food activity in India via Purina before taking its stake, and Just-food adds
              global scale context by reporting SFr18.88bn of Nestlé petcare sales in 2024 plus ongoing Purina capacity
              expansion. At the same time, Financial Express, NewsBytes, and Just-food all report that Drools remains
              strategically and operationally independent. That combination points to coopetition: Nestlé has validated
              Drools and may help professionalize the category, but public evidence does not show that Purina has ceded
              premium-segment ambitions or that channel conflict has been contractually neutralized.
            claimRefs:
              - CP008
              - CP009
              - CP012
      - number: '3.4'
        title: Durability is strongest in reach and breadth, not yet in transparent pricing
        blocks:
          - type: paragraph
            body: >-
              The practical read-through is that Drools looks hardest to displace where buyers value availability,
              assortment, and domestic supply chain control. StartupWired's examples of Dogsee Chew and Supertails show
              that new capital is still flowing into adjacent pet-care models, and the same source says local
              challengers win attention through service-led or gourmet propositions rather than through comparable
              manufacturing scale. What the retained public pool does not provide is SKU-normalized list pricing,
              retailer terms, or promotional intensity for Drools against Pedigree, Purina, or local specialists. That
              keeps the moat thesis credible on reach and breadth, but only partially evidenced on unit economics, price
              elasticity, and premiumization resilience.
            claimRefs:
              - CP013
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The clearest moat is breadth, not bragged pricing
            body: >-
              The retained evidence is strongest on distribution, manufacturing, and assortment breadth. It is not
              strong enough to prove that Drools structurally wins on matched SKU pricing versus Pedigree, Purina, or
              specialist challengers, so the durable edge should be underwritten as reach and replenishment convenience
              first.
            calloutType: insight
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP014
          - type: callout
            title: Purina creates coopetition, not a clean white space
            body: >-
              Nestlé's investment validates the category and the company, but public evidence still shows Purina as an
              active benchmark in India and global petcare as a very large business for Nestlé. Without public
              governance or channel disclosures, investors cannot yet tell whether the relationship mostly reduces
              rivalry or sharpens it in premium segments.
            calloutType: risk
            claimRefs:
              - CP008
              - CP009
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports a consumer-goods revenue model rather than a recurring-software one.
              Multiple independent sources place Drools in more than 40,000 retail outlets in India and 22 export
              countries, while PetfoodIndustry adds that about 25% of revenue comes from online platforms. That mix
              points to revenue driven by physical product throughput across retail, export, and e-commerce channels.
              The strongest public top-line datapoint is a September 2026 SoJapan profile summarizing FY2025 revenue at
              ₹932.3 crore, up 28.7% year on year, while Tracxn independently bands FY2025 revenue between ₹500 crore
              and ₹1,000 crore and reports 29% one-year CAGR. The direction is clear, but the exact revenue base is
              still mediated through secondary summaries rather than a released audited income statement.
            claimRefs:
              - CI004
              - CI005
              - CI008
              - CI009
              - CI010
              - CI013
