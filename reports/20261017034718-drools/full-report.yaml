              - CO007
              - CO008
              - CO009
              - CO014
      - number: '1.3'
        title: Leadership, governance, and diligence posture
        blocks:
          - type: paragraph
            body: >-
              Fahim Sultan is consistently identified as the founder, while Tracxn also names Bahadur Ali as a
              co-founder and links the business to IB Group. The current legal-entity board is reported as Fahim Sultan
              Ali, Sultan Ali, and Danish Ali; the concentration of named directors around the founding group suggests
              meaningful key-person and family-control exposure, although the available evidence does not establish
              voting rights or committee independence. Danish Ali is described on the company profile as an independent
              board member, but no public board charter, committee structure, or Nestlé governance right was found in
              the assigned evidence. Investors therefore need the current cap table, shareholder agreement,
              reserved-matters schedule, board minutes, and succession plan before relying on the label of operational
              independence. The absence of disclosed Nestlé terms is itself the principal adverse finding in this
              chapter: it prevents confirmation of dilution, liquidation preferences, strategic rights, or whether the
              $1 billion headline is directly tied to the transaction.
            claimRefs:
              - CO002
              - CO003
              - CO008
              - CO009
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
              - CO014
      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Headline valuation is not a disclosed transaction price
            body: >-
              Nestlé disclosed a minority investment but no terms; Financial Express explicitly reported that the
              transaction valuation was unknown. Treat the $1 billion figure as a reported valuation marker pending the
              signed transaction documents.
            calloutType: risk
            claimRefs:
              - CO009
              - CO010
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what counts
        blocks:
          - type: paragraph
            body: >-
              The strongest public boundary for Drools is packaged pet nutrition sold through retail, veterinary,
              ecommerce, quick-commerce, and export channels, not the entire Indian pet-care economy. BusinessOutreach
              frames Drools as winning between low-quality local feed and imported premium brands, which makes
              status-quo substitutes visible and keeps the chapter from treating grooming, healthcare, accessories, or
              services as interchangeable spend. That matters because the published market numbers do not all describe
              the same pool: BusinessOutreach reports a pet-food lens, StartupIndiaX uses a broader pet-care lens, and
              IndianStartupNews repeats a company estimate for the sector. The chapter therefore keeps category size,
              adjacency, and Drools' own revenue as separate lenses instead of collapsing them into one inflated TAM
              headline.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM015
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM006
              - CM007
              - CM013
              - CM015
              - CM016
      - number: '2.2'
        title: Sizing lenses, growth drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The public category case is directionally attractive but still evidence-constrained. BusinessOutreach
              sizes Indian pet food at $0.87 billion in 2025, $0.98 billion in 2026, and $1.68 billion by 2031, while
              also noting that only 29% of owned dogs are fed commercial pet food daily and that quick-commerce pet-food
              coverage spans 42 cities. Those figures point to premiumization and distribution expansion as real growth
              drivers, but they also show that adoption is still conversion-led rather than saturated. StartupIndiaX and
              IndianStartupNews add broader sector growth narratives, yet those estimates are either based on wider
              pet-care definitions or on company estimates rather than disclosed methodology. Because public evidence
              does not isolate Drools' true pet-food-only SAM/SOM by channel and segment, this chapter treats the market
              as a set of bounded lenses rather than a precise bottom-up model.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM011
              - CM016
