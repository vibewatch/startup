      - number: '6.2'
        title: Adoption breadth is credible, though the metrics are mostly distribution proxies
        blocks:
          - type: paragraph
            body: >-
              Adoption proof is strongest where multiple independent sources repeat operational surfaces: a 30,000+ to
              40,000+ Indian retail network, exports to 22 countries, and a substantial field-sales organization. Those
              indicators support real commercial traction, but they are still proxies for customer activity rather than
              direct disclosure of active households, reorder rates, cohort retention, or sell-through. Public
              references to Amazon leadership and strong e-commerce positioning likewise indicate digital relevance, yet
              they remain unaudited company claims in the available evidence pack. Nestlé's stated decision to keep
              Drools strategically and operationally independent further suggests the current customer model should be
              read as continuity of an existing distribution engine, not as proof that integration-led cross-sell has
              already materialized.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU007
              - CU010
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU010
              - CU015
      - number: '6.3'
        title: Durability and concentration are the central diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The chapter's biggest weakness is not lack of growth signals but lack of durability disclosure. None of
              the retained sources provides NRR, GRR, churn, renewal rates, repeat-purchase cohorts, or a customer-count
              series that would let an investor separate distribution breadth from sticky recurring demand. Public
              customer proof is therefore mostly observational: outlets, export reach, channels, and investor or partner
              commentary. That leaves meaningful uncertainty around whether growth is led by repeat purchase, channel
              loading, or share gains in a fast-growing category. Likewise, concentration risk remains under-disclosed
              because the evidence pack does not break out revenue by channel, top account, export market, or
              marketplace. Even the more skeptical retained commentary frames competition and profitability pressure as
              open constraints on sustained customer expansion rather than settled strengths.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Wide reach is real even if exact customer counts are not
            body: >-
              The strongest public customer evidence is repeated channel breadth: multiple publishers cite a 30,000+ to
              40,000+ Indian retail network plus exports to 22 countries, which is much harder to fake than a single
              logo wall.
            calloutType: strength
            claimRefs:
              - CU003
              - CU004
          - type: callout
            title: The Nestlé deal supports continuity more than immediate channel integration
            body: >-
              Nestlé's official statement that Drools remains strategically and operationally independent suggests
              customer traction should still be attributed to Drools' existing go-to-market engine, not presumed
              synergies.
            calloutType: insight
            claimRefs:
              - CU002
          - type: callout
            title: Retention quality is still unproven in public
            body: >-
              None of the retained sources discloses customer-count cohorts, renewal rates, NRR, GRR, or concentration,
              so durability is still a diligence hole despite credible adoption proxies.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Transaction opacity is the clearest top-tier legal and governance risk
        blocks:
          - type: paragraph
            body: |-
              The strongest risk signal in the assigned evidence is not a disclosed lawsuit or regulator
              action; it is how little the public record reveals about the Nestlé transaction despite its
              importance to the valuation narrative. Nestlé's own announcement confirms only a minority
              stake, says the investment is financial, and says Drools will remain strategically and
              operationally independent. Multiple independent reports repeat that the stake size, valuation
              mechanics, and other terms were not disclosed. That leaves open questions about board rights,
              reserved matters, information rights, liquidation preferences, and use of proceeds. At a
              $1 billion post-money marker, this is a real underwriting constraint: the business may remain
              founder-led in practice, but investors still need to inspect definitive documents before
              treating the transaction as clean validation rather than partial, rights-heavy financing.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR013
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
