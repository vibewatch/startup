          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR003
              - CR007
              - CR009
              - CR011
              - CR013
              - CR015
              - CR016
      - number: '7.2'
        title: Scale creates execution, quality, and channel-management risk before margins are visible
        blocks:
          - type: paragraph
            body: |-
              Public materials consistently portray Drools as already operating at meaningful national
              scale: more than 40,000 retail outlets in India, exports to 22 countries, six manufacturing
              units, roughly 1.6 million square feet of warehousing, and about 3,400 employees. Those
              attributes show commercial reach, but they also imply operational complexity in ingredient
              procurement, plant quality control, inventory turns, distributor discipline, and cross-border
              compliance. The risk is magnified because the assigned public pack does not include retained
              regulator, recall, certification, or incident records that would let an investor test whether
              controls have kept pace with the footprint. In other words, scale is evidenced, but the
              public proof of process quality remains thin, so operational diligence has to focus on plant,
              QA, and channel data rather than brand narrative.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR014
      - number: '7.3'
        title: Capital-provider and partner dependencies are visible, but their downside mechanics are not
        blocks:
          - type: paragraph
            body: |-
              Drools now sits between two types of dependency that matter in a downside case: minority
              strategic investors and a multi-lender borrowing stack. Tracxn's fetched profile says the
              company has taken 36 loans and lists recent charges involving DBS, HDFC, Axis, Kotak, Bank of
              Baroda, and Federal Bank across 2024-2025. That does not prove distress, but it does suggest
              working-capital, capex, or trade-finance complexity that public articles do not unpack. At the
              same time, the company's 2023 L Catterton round and 2025 Nestlé investment provide external
              validation while creating expectations around sustained execution and distribution expansion.
              Without covenant documents, debt maturity detail, or a clean view of customer/channel
              concentration, investors cannot yet tell whether current scale is self-funding or increasingly
              dependent on external capital and partner alignment.
            claimRefs:
              - CR004
              - CR010
              - CR011
              - CR012
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR007
              - CR008
              - CR011
              - CR012
              - CR016
      - number: '7.4'
        title: The right kill criteria are documentation-based, not story-based
        blocks:
          - type: paragraph
            body: |-
              Because the largest public risk gaps are documentary, the next diligence step should be to
              move from press coverage to verifiable operating evidence. A constructive outcome would show
              that Nestlé's rights are financially motivated and non-blocking, debt is ordinary working
              capital rather than hidden stress, and plant quality controls are externally audited. A thesis
              break would look different: preference-heavy or control-heavy transaction documents, tight
              covenants against a still-lossmaking model, material channel concentration, or any recall,
              safety, or compliance exception that the current public pack does not surface. Until those
              documents are produced, Drools remains financeable but not fully underwritten on governance,
              resilience, or downside containment.
            claimRefs:
              - CR002
              - CR003
              - CR011
              - CR012
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-severity public risk
            body: >-
              The underwriting blocker is documentation opacity, not lack of demand proof: the Nestlé deal is confirmed,
              but stake size, governance rights, and broader economics remain undisclosed in the assigned public pack.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR016
          - type: callout
            title: Kill criteria before new capital
            body: >-
              Treat any control-heavy shareholder rights package, restrictive debt covenants, or unreported
              quality/compliance exception as a thesis break until diligence proves otherwise.
            calloutType: insight
            claimRefs:
              - CR011
              - CR012
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Public evidence supports a wait-for-terms recommendation, not a conviction buy
        blocks:
          - type: paragraph
            body: >-
              The public record shows two real positives for valuation: Drools has moved from a disclosed 2023 benchmark
              of $60 million at a $600 million valuation to a May 2025 unicorn claim tied to Nestlé's minority
              investment, and its operating scale appears meaningful, with FY2025 revenue reported at ₹932.3 crore plus
              broad retail and export reach. Those facts justify treating Drools as a serious late-stage consumer brand
              rather than an early narrative asset. But the same evidence base still does not disclose the Nestlé stake
              size, the price per share, any liquidation preference or governance rights, or whether secondary shares
              were part of the transaction. That means public evidence can support only a range around the unicorn
              threshold, not a premium above it. On that basis, the cleanest reader-facing stance is research-more with
              medium confidence, high risk, and a stretched valuation stance until management-level diligence closes the
              remaining pricing and structure gaps.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV011
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV011
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV011
              - CV015
              - CV016
      - number: '8.2'
        title: The valuation anchor improved materially, but the proof set is still incomplete
        blocks:
          - type: paragraph
            body: >-
              The clearest positive anchor is the disclosed progression from L Catterton's June 2023 $60 million
              minority round at a $600 million valuation to the 2025 unicorn claim after Nestlé took a minority stake.
              That step-up is not pure story inflation: independent sources also describe revenue growth from ₹714.90
              crore in FY2024 to ₹932.3 crore in FY2025, plus a broad distribution footprint. Even so, the available
              proof remains incomplete for underwriting. Financial Express explicitly says the valuation at which Nestlé
              bought in is unknown, while Entrackr and GlobalPETS both note that transaction details were not disclosed.
              Public evidence also flags financial quality questions rather than resolving them, because Entrackr says
              FY2024 ended with a net loss, and Startup Indiax highlights the same net-loss overhang alongside
              increasing competition. The result is a business whose scale looks credible, but whose price support is
              still weaker than the headline unicorn label suggests.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: Scenario framing should stay anchored to the disclosed unicorn threshold
        blocks:
          - type: paragraph
            body: >-
              Because the public record does not disclose exact transaction terms, the scenario frame has to stay
              qualitative and price-disciplined. A bull case exists if the FY2025 revenue base proves durable, Nestlé's
              involvement improves commercialization without extracting control, and margins or cash conversion turn out
              materially stronger than the public record suggests. A base case centers on the current public anchor: a
              company large enough to deserve serious attention, but not yet transparent enough to justify paying
              materially above the unicorn threshold. The bear case is easy to imagine from the same evidence: if
              investor rights are more senior than expected, if losses or working-capital pressure persist, or if
              competition compresses margins, then the apparent step-up from the 2023 round can prove more fragile than
              the headline suggests. That is why the recommendation stays price-sensitive rather than
              company-quality-sensitive.
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV008
              - CV011
              - CV012
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.4'
        title: The final diligence asks are mostly about valuation mechanics and downside protection
        blocks:
          - type: paragraph
            body: >-
              The highest-value next steps are not generic customer or market checks; they are valuation mechanics.
              Management should disclose the exact Nestlé stake percentage, whether the deal included a primary issuance
              or secondary liquidity, any liquidation preference or ratchet terms, and the current board and veto-right
              structure after the transaction. Audited FY2025 EBITDA, gross margin, working-capital intensity, and
              cash-generation detail are also necessary, because public sources currently prove scale more clearly than
              quality. The public cap-table picture is incomplete as well: Tracxn points to a complex ownership and
              borrowing structure, but not enough detail to judge dilution risk or financing seniority cleanly. Until
              those asks are answered, the thesis can justify continued tracking and relationship-building, yet not a
              fully underwritten buy call.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline matters more than brand quality
            body: >-
              Drools looks credible enough to keep in diligence, but the public file still cannot justify paying above
              the unicorn headline without knowing the Nestlé stake economics and downside protections.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV011
              - CV015
              - CV016
          - type: callout
            title: Opacity, not demand, is the main valuation blocker
            body: >-
              The biggest blocker is not whether Drools has commercial momentum; it is whether public investors can map
              that momentum into a clean cap table, margin profile, and downside case.
            calloutType: risk
            claimRefs:
              - CV004
              - CV006
              - CV008
              - CV015
