company:
  name: Drools
chapter:
  number: 4
  title: Financials
  summary: "Public evidence supports real distribution scale and revenue growth at Drools, but the underwriting picture is still constrained by undisclosed Nestle deal terms, missing realized-pricing and margin data, and inconsistent public descriptions of the operating footprint."
sections:
  - id: revenue-model-and-public-traction
    title: Revenue model and public traction
    body: >-
      The assigned evidence supports a consumer-goods revenue model rather than a
      recurring-software one. Multiple independent sources place Drools in more than
      40,000 retail outlets in India and 22 export countries, while PetfoodIndustry
      adds that about 25% of revenue comes from online platforms. That mix points to
      revenue driven by physical product throughput across retail, export, and
      e-commerce channels. The strongest public top-line datapoint is a September
      2026 SoJapan profile summarizing FY2025 revenue at ₹932.3 crore, up 28.7%
      year on year, while Tracxn independently bands FY2025 revenue between ₹500
      crore and ₹1,000 crore and reports 29% one-year CAGR. The direction is clear,
      but the exact revenue base is still mediated through secondary summaries rather
      than a released audited income statement.
    claimRefs: [CI004, CI005, CI008, CI009, CI010, CI013]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit-economics visibility
    body: >-
      Public operating-scale indicators suggest a business with meaningful
      manufacturing, warehousing, and channel-servicing costs. May 2025 reporting
      describes six manufacturing units, roughly 1.6 million square feet of
      warehousing, 650+ SKUs, and about 3,400 employees including 1,800 sales
      professionals. PetfoodIndustry, however, separately described three facilities
      with approximately 89,400 metric tons of annual capacity, creating a real
      reconciliation issue on the asset base. That discrepancy matters because it
      changes how an investor would think about capex, utilization, and fixed-cost
      leverage. The chapter pool does not disclose realized pricing, gross margin,
      contribution margin, customer acquisition cost, payback, or inventory turns,
      so the public record is much stronger on scale than on efficiency.
    claimRefs: [CI006, CI007, CI008, CI013, CI015, CI016]
    tableRefs: [TI002, TI003]
  - id: capital-adequacy-and-financing-dependency
    title: Capital adequacy and financing dependency
    body: >-
      The funding story is easier to describe than to underwrite. Nestlé S.A. took
      a minority stake in Drools and both Nestlé and independent reporting say the
      company will remain strategically and operationally independent, but the
      cheque size and exact stake percentage were not disclosed. That means the
      jump from the prior June 2023 L Catterton round to unicorn status is visible
      as an outcome, not as a transparent transaction multiple. Tracxn also lists
      paid-up capital of ₹310 crore, authorized capital of ₹311 crore, and 36 loans
      or charges, including large 2025 facilities from banks such as HDFC, DBS, and
      Axis. The implication is not distress by itself, but a financing structure
      where working capital and formal credit lines likely matter materially.
    claimRefs: [CI001, CI002, CI003, CI011, CI012, CI014, CI016]
  - id: verdict-and-diligence-blockers
    title: Financial verdict and diligence blockers
    body: >-
      Financially, Drools looks like a scaled branded-pet-food company with credible
      channel breadth and continued investor support, not a business whose public
      materials yet reveal clean software-style unit economics. The valuation signal
      from the Nestlé deal is directionally positive, but the missing stake size,
      missing cheque size, and absence of published margin or runway detail keep the
      capital-adequacy conclusion provisional. The most important next-step requests
      are audited FY2025 statements, channel and SKU gross-margin splits, inventory
      and receivables turns, debt schedule and covenants, and evidence that the
      manufacturing-footprint discrepancy is simply a definitional issue rather than
      a reporting inconsistency. Until those are disclosed, revenue quality is more
      visible than margin quality.
    claimRefs: [CI009, CI010, CI012, CI014, CI015, CI016]
