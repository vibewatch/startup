    rows:
      - ["Domestic retail distribution", "Packaged pet food sold through pet stores, general trade, and other retail outlets in India", "SKU / sell-through", "40,000+ retail outlets disclosed; exact channel revenue mix not public", "Scale is corroborated, realized pricing is not", "Provide FY2025 domestic retail revenue, gross margin, and retailer/distributor terms"]
      - ["Export distribution", "Distributor or channel sales into overseas markets", "Shipment / distributor order", "22 export countries disclosed; export revenue mix not public", "Geographic breadth is corroborated, economics are not", "Provide export revenue, transfer pricing, and country concentration"]
      - ["E-commerce marketplaces", "Online marketplace sales including Amazon and other digital channels", "Order / SKU", "PetfoodIndustry says about 25% of revenue comes from online platforms", "Single-source revenue-mix datapoint", "Provide platform mix, ad spend, returns, and contribution margin by channel"]
      - ["Prescription / premium diets", "Science-based, breed-specific, and prescription pet-food lines sold through retail and veterinary touchpoints", "Product line sale", "Product category is public; revenue contribution is not", "Portfolio breadth is corroborated, monetization split is not", "Provide revenue and gross margin by premium versus value portfolio"]
    notes: "Public evidence confirms channels and product breadth, but not revenue mix by stream; undisclosed values are left descriptive rather than estimated."
    claimRefs: [CI004, CI005, CI008, CI013, CI015]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer / channel
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - ["Core retail pet food", "Not publicly disclosed in assigned evidence", "List pricing not established; realized net pricing unknown", "No public visibility on trade discounts, distributor margins, or retailer rebates", "SI001, SI007"]
      - ["Export channel", "Not publicly disclosed in assigned evidence", "No public FOB/distributor pricing disclosed", "Country mix, distributor economics, and FX effects are unknown", "SI001, SI004, SI007"]
      - ["E-commerce", "Not publicly disclosed in assigned evidence", "Only online-mix share is public; realized ASP and promotion cadence are unknown", "Marketplace commissions, ad spend, and return rates are undisclosed", "SI001"]
      - ["Prescription / premium portfolio", "Not publicly disclosed in assigned evidence", "Category presence is public, realized premium capture is not", "Vet-clinic terms, bundle discounts, and repeat-purchase behavior are unknown", "SI001, SI007"]
    notes: "This table intentionally records disclosure limits: the assigned pool does not provide public list-price schedules or realized pricing."
    claimRefs: [CI008, CI013, CI015]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["FY2025 revenue", "₹932.3 crore summary (SoJapan); Tracxn bands ₹500 Cr to ₹1,000 Cr", "Medium", "Establishes scale but not audited precision", "Provide audited FY2025 revenue bridge and entity-level statements"]
      - ["FY2025 growth", "28.7% YoY (SoJapan) / 29% 1-year CAGR (Tracxn)", "Medium", "Growth direction is corroborated across two secondary summaries", "Provide audited monthly revenue and same-store/channel decomposition"]
      - ["Online revenue share", "About 25% of revenue from online platforms", "Medium", "Shows an e-commerce contribution that could affect gross-to-net and ad-spend economics", "Provide online gross margin, marketing spend, and repeat-purchase metrics"]
      - ["Manufacturing footprint", "3 facilities / ~89,400 MT capacity OR 6 manufacturing units", "Low", "Conflicting public descriptions change capacity and capex assumptions", "Reconcile plant count, owned versus leased sites, and nameplate utilization"]
      - ["Warehousing footprint", "About 1.6 million sq. ft.", "Medium", "Suggests meaningful logistics and working-capital complexity", "Provide leased versus owned split and occupancy/utilization data"]
      - ["Paid-up capital", "₹310 crore", "Medium", "Shows meaningful equity base but not current liquidity", "Provide latest cap table and post-Nestle fully diluted ownership"]
      - ["Registered loans / charges", "36 listed by Tracxn", "Medium", "Signals non-trivial formal borrowing and collateralization", "Provide debt schedule, maturities, covenants, and security package"]
      - ["Gross margin", null, "Low", "Core underwriting input for branded food economics is missing publicly", "Provide audited gross margin by channel and product family"]
      - ["CAC / payback", null, "Low", "Sales-efficiency underwriting is not possible without acquisition-cost and retention data", "Provide blended CAC, payback, repeat rates, and channel contribution margin"]
      - ["Cash runway", null, "Low", "Capital adequacy cannot be tested without current cash and burn or working-capital detail", "Provide cash balance, monthly burn or cash generation, and runway assumptions"]
    notes: "Null values mean the assigned public evidence does not disclose the metric directly; conflicting entries are preserved rather than normalized."
    claimRefs: [CI006, CI008, CI009, CI010, CI011, CI012, CI015, CI016]
