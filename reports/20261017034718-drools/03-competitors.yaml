      - ["Mars / Pedigree", "Branded packaged-food benchmark; specific India contract terms are not retained here", "Legacy imported-brand reference point", "No retained public India price cards in the assigned pool", "Hard to prove direct undercutting or premium gap from this evidence alone"]
      - ["Purina", "Branded mainstream-to-veterinary pet food benchmark; India list pricing not retained here", "Global petcare platform with Purina presence in India", "No retained India SKU prices or retailer discount data", "Competitive pressure is more visible in scale and trust than in disclosed public pricing"]
      - ["Local specialists", "D2C, wellness, or gourmet-led offers; contract model detail is not retained here", "Holistic services, gourmet meals, or premium niche experiences", "No retained public list-price or bundle normalization", "Threat is experiential specialization rather than a proven price match with Drools"]
    notes: >-
      The assigned pool does not retain matched public price cards across brands. This comparison therefore records packaging and sales-model
      positioning, and it explicitly preserves the pricing evidence gap instead of guessing at discounts.
