callouts:
  - calloutType: "insight"
    title: "The clearest moat is breadth, not bragged pricing"
    body: >-
      The retained evidence is strongest on distribution, manufacturing, and assortment breadth. It is not strong enough to prove that
      Drools structurally wins on matched SKU pricing versus Pedigree, Purina, or specialist challengers, so the durable edge should be
      underwritten as reach and replenishment convenience first.
    claimRefs: ["CP004", "CP005", "CP006", "CP014"]
  - calloutType: "risk"
    title: "Purina creates coopetition, not a clean white space"
    body: >-
      Nestlé's investment validates the category and the company, but public evidence still shows Purina as an active benchmark in India
      and global petcare as a very large business for Nestlé. Without public governance or channel disclosures, investors cannot yet tell
      whether the relationship mostly reduces rivalry or sharpens it in premium segments.
    claimRefs: ["CP008", "CP009", "CP012"]
