      - ["Trust / science posture", "Science-backed nutrition and veterinarian-linked claims recur across retained coverage", "Nestlé's global petcare scale and Purina portfolio indicate deep trust assets", "Assigned pool supports proposition narratives, not independent trust benchmarks", "Drools is credible, but the strongest trust benchmark is still the global incumbents' science platform"]
