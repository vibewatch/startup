companyProfile:
  summary: >-
    Aiven is a Helsinki-based managed open-source cloud data platform founded in 2016 that runs databases, messaging,
    and search services across AWS, GCP, and Azure for developers and enterprise data teams. The company pairs a
    permanent free tier with subscription managed services and a broad open-source product surface, but its current
    public financial visibility remains limited and key operating metrics such as ARR, cash, burn, margin, and customer
    count remain undisclosed or estimated.
