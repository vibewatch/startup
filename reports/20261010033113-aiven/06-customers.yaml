figures:
  - id: "FU001"
    title: "Aiven Customer Adoption and Expansion Journey"
    type: "journey-map"
    summary: "Adoption trajectory from open-source free-tier prototyping to enterprise multi-cloud production and consumption-driven expansion."
    data:
      nodes:
        - label: "1. Self-Service Evaluation & Free Tier"
          detail: "Developers deploy always-on Apache Kafka, PostgreSQL, MySQL, and OpenSearch without credit card or time limits to build prototypes."
          touchpoints:
            - "Self-service web console"
            - "Free tier clusters"
            - "Developer documentation"
        - label: "2. Workload Production Deployment"
          detail: "Teams graduate prototypes to paid managed clusters with automated patching, backup replication, and cross-cloud provisioning."
          touchpoints:
            - "Cloud marketplace checkout"
            - "Terraform provider"
            - "CLI tooling"
        - label: "3. Enterprise BYOC Migration"
          detail: "Enterprise security and platform teams adopt Bring Your Own Cloud (BYOC) to deploy data services inside customer AWS or GCP VPCs."
          touchpoints:
            - "Enterprise procurement"
            - "Architecture review"
            - "Customer VPC peering"
        - label: "4. Multi-Service Infrastructure Expansion"
          detail: "Accounts expand from single database instances into streaming pipelines and analytical engines (ClickHouse, Valkey, OpenSearch)."
          touchpoints:
            - "Data platform architecture"
            - "Solution architect advisory"
            - "Console service catalog"
        - label: "5. Strategic Key Account Scale"
          detail: "Dedicated Key Account Directors manage large multi-thousand-person enterprises targeting net-new ARR across multiple business units."
          touchpoints:
            - "Executive sponsor reviews"
            - "MEDDPICC quarterly reviews"
            - "Hyperscaler co-sell"
        - label: "6. Continuous Consumption & Multi-Cloud Drift"
          detail: "Usage-based revenue compounds as daily data streaming throughput scales, while platform engineers mitigate cloud lock-in."
          touchpoints:
            - "Consumption monitoring"
            - "Customer success engineering"
            - "Support runbooks"
    approximationNotes: "Journey stages reflect verified enterprise account management specifications, self-service free tier packaging, and published case studies."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU010"
callouts:
  - calloutType: "insight"
    title: "Consumption Economics and Key Account Concentration"
    body: "Aiven's commercial expansion in North America centers on its six largest strategic accounts, where revenue scales with infrastructure consumption rather than upfront multi-year software commitments. While this usage-based model creates compounding revenue from growing data streaming workloads, it exposes the business to workload volatility and platform optimization pressures from customer engineering teams."
    claimRefs:
      - "CU002"
      - "CU003"
  - calloutType: "risk"
    title: "Opaque Retention Metrics and Competitive Hyperscaler Pressures"
    body: "Despite targeting 100% gross retention and deploying Customer Success Engineers to de-escalate distributed systems issues, Aiven provides no audited Net Revenue Retention (NRR), Gross Revenue Retention (GRR), or customer logo churn rates. Furthermore, reliance on hyperscaler cloud infrastructure (AWS, GCP, Azure, OCI) leaves customer expansion dependent on partner co-sell programs while competing directly against native cloud database services."
    claimRefs:
      - "CU002"
      - "CU010"
      - "CU013"
      - "CU014"
