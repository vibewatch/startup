evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-governance-and-cap-table
    missingEvidence: Formal board of directors seat allocations, independent voting thresholds, and liquidation preference stacks.
    whyItMatters: >-
      Without board committee and voting right disclosure, investor control dynamics and liquidation seniority cannot be
      verified.
    diligencePath: Inspect certificate of incorporation, shareholder register, and primary financing transaction agreements.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: audited-financials-and-arr
    missingEvidence: Audited financial statements, precise ARR breakdown, gross margin waterfall, and cash burn rate.
    whyItMatters: >-
      Prevents independent validation of whether Aiven's revenue scale and growth trajectory support its stale $3.0B
      valuation mark.
    diligencePath: >-
      Obtain management-prepared audited profit-and-loss accounts, cash flow statements, and customer subscription
      metrics under NDA.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Audited financial breakdown of Aiven's annual recurring revenue (ARR), customer account count, and net revenue
      retention (NRR) across managed service categories.
    whyItMatters: >-
      Public revenue estimates diverge widely ($50M–$100M on LeadIQ vs ~$48.7M on GetLatka), making it impossible to
      compute Aiven's exact serviceable obtainable market (SOM) penetration without direct company disclosures.
    diligencePath: >-
      Request management disclosure of audited FY2025/2026 revenue, ARR by product engine (Kafka vs PostgreSQL vs
      ClickHouse), and enterprise customer expansion metrics.
    relatedQuestionRefs:
      - QM009
  - type: missing-source
    severity: material
    topic: hyperscaler-bundling-tco
    missingEvidence: >-
      Audited multi-year production TCO comparisons and private enterprise discounting concessions between Aiven and
      hyperscaler native data bundles (AWS RDS/MSK, Azure Database/Cosmos, GCP Cloud SQL).
    whyItMatters: >-
      Without verified contract concession terms and win/loss records against bundled cloud provider commits,
      underwriting Aiven's net revenue retention durability and gross margin defensibility against hyperscalers remains
      incomplete.
    diligencePath: >-
      Request audited customer cohort win/loss reports, average discount schedules against cloud list prices, and
      hyperscaler marketplace co-selling economics from Aiven management.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Current rate card, realized prices, discounts, credits, contract terms, and revenue mix.
    whyItMatters: Without realized pricing and mix, recurring revenue quality and pricing power cannot be assessed.
    diligencePath: Obtain the current SKU catalog and anonymized bookings-to-revenue bridge by customer segment.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross-margin waterfall, cloud costs, support costs, CAC, payback, NRR, GRR, churn, and customer concentration.
    whyItMatters: These inputs determine whether growth is durable and whether scale improves contribution margin.
    diligencePath: Review audited statements and monthly cohort economics by service, cloud, geography, and customer segment.
    relatedQuestionRefs:
      - QI003
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, monthly burn, runway, debt and credit obligations, planned uses, and next-round
      trigger.
    whyItMatters: Historical funding raised cannot establish present liquidity or financing dependency.
    diligencePath: Inspect bank statements, debt schedules, the board-approved operating plan, and downside runway scenarios.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: revenue-definition
    missingEvidence: A reconciled definition and period for revenue, ARR, run-rate revenue, and LTM revenue.
    whyItMatters: The public $100 million figure cannot support growth or valuation analysis without a consistent denominator.
    diligencePath: Reconcile audited revenue to ARR and contracted backlog for every month from May 2022 through the run date.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: sla-and-failover-specifications
    missingEvidence: >-
      Granular contract-level RTO/RPO metrics and multi-region active-active failover recovery benchmarks across Aiven's
      non-Kafka services.
    whyItMatters: >-
      Enterprise underwriters require audited multi-region failover times and data loss tolerances to validate
      mission-critical tier-1 availability claims.
    diligencePath: >-
      Request standard enterprise customer Master Service Agreements (MSAs), SOC 2 Type II audit reports, and disaster
      recovery tabletop test logs directly from Aiven technical sales.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention-and-churn
    missingEvidence: >-
      Audited cohort-based Net Revenue Retention (NRR), Gross Revenue Retention (GRR), customer logo churn rates, and
      contractual renewal histories.
    whyItMatters: >-
      Without audited retention and churn data, it is impossible to independently verify the durability of Aiven's
      consumption-based enterprise revenue or quantify workload expansion velocity.
    diligencePath: >-
      Request confidential management disclosures, customer cohort retention waterfalls, and audited enterprise renewal
      schedules under non-disclosure agreement.
    relatedQuestionRefs:
      - QU009
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Exact ARR breakdown and revenue contribution percentage across Aiven's 6 largest North American strategic
      accounts.
    whyItMatters: >-
      High customer concentration among top accounts creates downside risk if an enterprise client optimizes data
      streaming costs, insources open-source management, or migrates workloads to native cloud services.
    diligencePath: >-
      Review customer revenue concentration schedules in confidential data room and verify contract renewal terms for
      top 10 enterprise accounts.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU001
      - TU003
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials-and-gross-margins
    missingEvidence: Audited financial statements, gross margin waterfall by hyperscaler (AWS/GCP/Azure), and monthly cash burn rate.
    whyItMatters: >-
      Without audited unit economics, investors cannot determine whether Aiven's managed service markup covers
      underlying cloud hosting and SRE delivery costs.
    diligencePath: >-
      Request audited financial statements, cloud infrastructure bill of materials, and CFO-verified unit economics
      during formal dataroom diligence.
    relatedQuestionRefs:
      - QR008
  - type: stale
    severity: material
    topic: unverified-valuation-and-cap-table
    missingEvidence: Current verified 409A valuation, liquidation preference overhang, and secondary share transaction pricing.
    whyItMatters: >-
      The $3.0B Series D valuation established in May 2022 is over four years old and unverified in post-2022 normalized
      SaaS valuation multiples.
    diligencePath: Examine cap table share class seniority, recent secondary trade clears, and internal 409A appraisal reports.
    relatedQuestionRefs:
      - QR006
  - type: enumeration-incomplete
    severity: minor
    topic: TR001
    missingEvidence: >-
      Comprehensive listing of all local country data handling registrations, national cyber agency filings, and
      localized regulatory licenses across Asian and European operating entities.
    whyItMatters: >-
      Expansion into APAC (Singapore, Malaysia, Indonesia) and EU jurisdictions introduces local compliance and
      sovereign hosting mandates.
    diligencePath: >-
      Request legal counsel review of international corporate filings and localized regulatory compliance certificates
      across non-US subsidiaries.
    relatedQuestionRefs:
      - QR001
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: blocking
    topic: audited-financials
    missingEvidence: >-
      Audited financial statements, current cash balance, burn rate, and runway data are not disclosed in public filings
      or secondary intelligence.
    whyItMatters: >-
      Without audited financial performance and burn rates, assessing capital adequacy, solvency, and fair equity value
      is impossible.
    diligencePath: >-
      Request audited income statements, cash flow statements, and balance sheets under NDA directly from Aiven
      management.
    relatedQuestionRefs:
      - QV009
