chapter:
  number: 5
  title: "Product & Technology"
  summary: "Aiven delivers a managed open-source cloud data platform providing turnkey deployment of Apache Kafka, PostgreSQL, ClickHouse, and OpenSearch across multi-cloud environments. The architecture leverages dedicated virtual machine isolation, automated horizontal and vertical scaling, and declarative orchestration to abstract operational complexity, supported by a 2026 free tier and growing developer ecosystem tooling."
sections:
  - id: "core-platform-definition-and-portfolio"
    title: "Core Platform Definition and Managed Service Portfolio"
    body: "Aiven delivers an integrated cloud data platform designed to stream, store, and serve mission-critical application data using leading open-source software engines. Rather than building proprietary storage engines, Aiven packages and manages unmodified upstream open-source technologies including Apache Kafka for distributed event streaming, PostgreSQL and MySQL for relational data persistence, ClickHouse for high-throughput columnar analytics, and OpenSearch for distributed indexing and search. In 2026, Aiven expanded accessibility by introducing a permanent Free Tier that provides always-on instances of Apache Kafka, PostgreSQL, MySQL, and OpenSearch deployed on the same underlying infrastructure architecture as its paid enterprise tiers. This portfolio approach allows software engineering teams to provision, configure, and operate heterogeneous database topologies across AWS, Google Cloud Platform, Microsoft Azure, and DigitalOcean without managing low-level operating system patches, storage volumes, or clustering protocols."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
    tableRefs:
      - "TE001"
  - id: "developer-workflows-and-integrations"
    title: "Developer Workflows, Integration Surface, and Operations"
    body: "Developer and partner interactions with Aiven center on declarative automation and turnkey integration surfaces that remove operational friction from application lifecycles. Engineering teams deploy and manage services through an administrative web console, a command-line interface, direct REST APIs, and an official Terraform provider that enables infrastructure-as-code automation. Aiven also provides specialized OEM solution architecture programs to assist commercial software vendors in embedding managed open-source clusters into their SaaS offerings via APIs and client SDKs. Technical documentation is publicly maintained using a Docusaurus-based developer portal that offers architectural guidance, connection code samples, and API specifications. By automating cluster deployment, automated backups, and non-disruptive scaling, Aiven enables developers to focus on application business logic rather than routine database administration."
    claimRefs:
      - "CE001"
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE009"
      - "CE011"
    tableRefs:
      - "TE002"
  - id: "multi-cloud-architecture-and-scaling"
    title: "Multi-Cloud Operating Architecture, Isolation, and Elasticity"
    body: "Aiven's technical operating model is structured around dedicated virtual machine isolation, automated cluster lifecycle orchestration, and cross-cloud abstraction. Unlike multi-tenant container platforms that share compute kernels across organizations, each Aiven cluster deploys on isolated, single-tenant virtual machines in the customer's selected cloud provider and region, ensuring strict physical data isolation and predictable I/O performance. Elasticity is supported through both vertical scaling, which dynamically upgrades instance hardware specifications without service downtime, and horizontal scaling, which adds broker or replica nodes to distribute partition throughput. Independent performance benchmarks demonstrate that a five-node Aiven for Apache Kafka cluster can sustain throughput rates up to 535,000 messages per second under optimal conditions. To maintain platform reliability, Aiven employs its SOFT framework—prioritizing scalability, observability, fast recovery, and trustworthy execution—backed by real-time health telemetry dashboards and an enterprise uptime SLA of up to 99.99%."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE008"
      - "CE012"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "security-compliance-and-architectural-limits"
    title: "Enterprise Security, Compliance Standards, and Architectural Boundaries"
    body: "Enterprise governance and security controls on Aiven incorporate defense-in-depth measures designed to satisfy rigorous compliance frameworks. All network communication is secured with end-to-end TLS encryption in transit, paired with hardware-level disk encryption at rest and support for cloud-native VPC peering and PrivateLink networking. Administrative access is protected by SAML and Okta single sign-on integration, with compliance certifications spanning ISO 27001, SOC 2, HIPAA, and PCI-DSS. Despite these enterprise safeguards, diligence reveals an inherent architectural trade-off: Aiven functions strictly as an infrastructure hosting and data transport plane. Because Aiven does not provide a native serverless application runtime or co-located compute tier, development teams must provision, wire, and maintain external application services or microservices to execute domain business logic on streaming pipelines. Furthermore, because Aiven is hosted directly on third-party hyperscaler virtual machines, its operational cost and resilience remain fundamentally coupled to underlying public cloud availability zones and inter-region data egress fee structures."
    claimRefs:
      - "CE004"
      - "CE007"
      - "CE008"
      - "CE010"
      - "CE013"
      - "CE014"
