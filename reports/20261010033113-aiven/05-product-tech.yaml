callouts:
  - calloutType: "insight"
    title: "Architectural Trade-Off: Managed Infrastructure vs Application Runtime"
    body: "Aiven deliberately focuses on stabilizing and scaling the data transport and storage layer using dedicated virtual machines rather than embedding application-level business logic. While this design minimizes vendor lock-in and provides robust multi-cloud portability, developers must still architect and maintain external microservices or processing tiers to execute domain logic."
    claimRefs:
      - "CE004"
      - "CE012"
      - "CE013"
  - calloutType: "risk"
    title: "Hyperscaler Infrastructure Dependency and Egress Exposure"
    body: "Because Aiven provisions its managed services directly atop underlying hyper-scalers (AWS, GCP, Azure), its cost structure and SLA boundaries remain tethered to provider VM availability and cross-region egress charges. Platform customers face potential margin compression or architectural complexity when coordinating cross-cloud data replication."
    claimRefs:
      - "CE004"
      - "CE007"
      - "CE013"
