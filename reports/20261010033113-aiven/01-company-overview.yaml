chapter:
  number: 1
  title: "Company Overview"
  summary: "Aiven is a Helsinki-headquartered managed cloud data platform founded in 2016 that orchestrates open-source databases, event streaming, and analytics engines across AWS, GCP, and Azure. The company reached a $3.0B post-money valuation at its $210M Series D in May 2022, accumulating approximately $420M in total equity financing, but faces an unverified public valuation mark and undisclosed revenue and cash metrics as of 2026."
sections:
  - id: "corporate-identity-and-mission"
    title: "Corporate Identity, Foundation, and Operating Model"
    body: "Founded in 2016 by Oskari Saarenmaa, Hannu Valtonen, Heikki Nousiainen, and Mika Eloranta in Helsinki, Finland, Aiven provides a managed open-source cloud data infrastructure platform. The platform abstracts the deployment, operational management, maintenance, security hardening, and monitoring of major open-source data systems—such as Apache Kafka, PostgreSQL, OpenSearch, MySQL, Apache Cassandra, and M3—across leading hyperscale cloud providers including Amazon Web Services (AWS), Google Cloud Platform (GCP), and Microsoft Azure. Headquartered in Helsinki, Aiven maintains distributed hubs in Berlin, Boston, Paris, Sydney, Singapore, Toronto, and Amsterdam, serving commercial software developers and enterprise data engineering teams across more than 50 countries. The operating model relies on a fully managed cloud database-as-a-service (DBaaS) architecture, offering developer-tier accessibility through permanent free tiers for Apache Kafka and OpenSearch alongside consumption-based and contractual enterprise tiers. While the company's technical surface exhibits mature operational discipline, private financial governance leaves revenue waterfall, cash burn, and margin health opaque to external review."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership, Governance, and Key-Person Risk"
    body: "Aiven is led by co-founder and Chief Executive Officer Oskari Saarenmaa, supported by co-founders Hannu Valtonen, Heikki Nousiainen, and Mika Eloranta, who oversees technical operations. The executive leadership group has demonstrated consistent technical and open-source systems background, establishing an Open Source Program Office (OSPO) to contribute upstream maintenance to core projects like PostgreSQL and Apache Kafka. However, formal board composition, board committee authority, independent director voting rights, and liquidation preference stacks remain undisclosed in public registers. Key-person dependency centers heavily on Saarenmaa and the founding engineering core, who established the company's early multi-cloud orchestration IP. Independent operational reviews reflect high internal executive approval, yet the absence of external board disclosures limits governance visibility for secondary and institutional market participants."
    claimRefs:
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-scale"
    title: "Capitalization Structure, Scale Metrics, and Valuation Horizon"
    body: "Between 2017 and 2022, Aiven raised approximately $420M in aggregate equity capital across six financing rounds. Early rounds included a $1.0M Seed round in 2017 and an $8.9M Series A in May 2019 led by Earlybird Venture Capital, followed by a $40M Series B in February 2020 led by IVP. In March 2021, Aiven closed a $100M Series C led by Atomico at an $800M valuation, subsequently expanded in October 2021 with a $60M extension co-led by World Innovation Lab (WiL) and IVP that priced the company at a $2.0B post-money valuation. In May 2022, Aiven completed its $210M Series D led by Eurazeo, with participation from BlackRock-managed funds, IVP, Atomico, Earlybird, WiL, and Salesforce Ventures, establishing a $3.0B pre-money valuation. Since May 2022, no primary capital infusions have been finalized. Secondary market tracking platforms show third-party estimated annual recurring revenue (ARR) marks ranging from $48.7M to over $100M, while employee headcounts recorded across regulatory and professional directories register between 443 and 500 personnel. The multi-year absence of primary equity raises leaves Aiven's 2022 valuation benchmark unanchored to 2026 software market multiples, creating material valuation risk."
    claimRefs:
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
