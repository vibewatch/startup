    title: Aiven Corporate and Financing Milestone Timeline (2016–2026)
    type: timeline
    summary: >-
      Chronological progression of Aiven corporate founding, major venture funding tranches, global expansion, and cloud
      service tier releases.
    data:
      items:
        - label: Company Inception (2016)
          date: '2016-01-01'
          detail: >-
            Founded in Helsinki by Oskari Saarenmaa, Hannu Valtonen, Heikki Nousiainen, and Mika Eloranta to automate
            open-source cloud data infrastructure.
          tone: positive
        - label: Series A Capitalization ($8.9M)
          date: '2019-05-03'
          detail: Earlybird Venture Capital leads $8.9M Series A funding round to accelerate multi-cloud data services.
          tone: positive
        - label: Series B Scaling ($40M)
          date: '2020-02-05'
          detail: IVP leads $40M Series B equity financing to expand international sales and product development.
          tone: positive
        - label: Series C Unicorn Milestone ($100M)
          date: '2021-03-23'
          detail: Atomico leads $100M Series C round at an $800M valuation, introducing Salesforce Ventures and WiL.
          tone: positive
        - label: Series C Expansion & $2B Valuation ($60M)
          date: '2021-10-19'
          detail: WiL and IVP co-lead $60M Series C extension at a $2.0B valuation, launching Open Source Program Office.
          tone: positive
        - label: Series D & $3B Valuation ($210M)
          date: '2022-05-11'
          detail: Eurazeo and BlackRock lead $210M Series D financing, establishing a $3.0B pre-money valuation.
          tone: positive
        - label: Headcount & Scale Moderation
          date: '2025-11-01'
          detail: Workforce plateaus at approximately 449 employees, failing to meet the 2022 target of doubling headcount.
