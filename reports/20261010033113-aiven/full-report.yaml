      - number: '4.2'
        title: Traction signals are historical and definition-sensitive
        blocks:
          - type: paragraph
            body: >-
              The strongest public financial datapoint is not current. Multiples records $100 million as of the May 2022
              Series D but explicitly says funding-round figures may represent revenue, ARR, run-rate revenue, or LTM
              revenue; it should not be promoted into a clean 2026 ARR or GAAP-revenue figure. LeadIQ instead presents a
              broad $50 million to $100 million revenue range without a period or accounting definition. Earlier company
              statements provide direction rather than a durable baseline: Aiven said it tripled revenue run rate in
              2019 and roughly doubled it over seven months in 2021. These claims show historical momentum, but their
              age, changing denominator, and company-issued nature make them unsuitable for deriving current growth,
              retention, or sales efficiency.
            claimRefs:
              - CI004
              - CI006
              - CI009
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
