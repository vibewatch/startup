          down-round dilution
        - Secondary market activity on Forge Global and EquityZen shows limited liquidity and no matched trades
        - Official disclosure of audited revenue exceeding $200M with positive free cash flow
    notes: >-
      Evaluation of strategic positioning versus risk factors; changes in perspective depend on private diligence
      disclosures.
    claimRefs:
      - CV004
      - CV009
      - CV010
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Revenue & Growth Assumptions
      - Implied Valuation
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - ARR scales above $180M with >115% NRR and gross margins expanding above 65% via enterprise BYOC
        - $2.5B - $3.0B (14x-16x forward ARR)
        - Hyperscalers discounting native services to choke multi-cloud expansion
        - Low (15%)
      - - Base Case
        - ARR reaches $120M-$140M with growth slowing to 15-20% and gross margins around 55%
        - $1.2B - $1.5B (9x-11x forward ARR)
        - Continued margin compression and lengthening enterprise sales cycles
        - Moderate (55%)
      - - Bear Case
        - ARR stagnates below $110M under fierce price competition, forcing a down-round or recapitalization
        - $600M - $900M (5x-8x forward ARR)
        - Cash burn outstripping liquidity, triggering severe dilution or forced strategic sale
        - High (30%)
    notes: >-
      Scenario models project forward exit valuations against public SaaS peer multiple benchmarks; growth and margin
      inputs are unverified estimates.
    claimRefs:
      - CV001
      - CV005
      - CV011
      - CV012
figures:
