  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Structural overview of Aiven's managed data cloud architecture across six functional layers from multi-cloud
      hosting to developer interfaces.
    claimRefs:
      - CE004
      - CE005
      - CE008
      - CE009
      - CE011
      - CE012
    data:
      layers:
        - label: Developer Experience & Tooling Layer
          detail: Public Docusaurus-based developer docs, OEM integration SDKs, REST APIs, and Terraform provider.
        - label: Unified Management & Control Plane
          detail: >-
            Automated provisioning engine, health telemetry, and non-disruptive zero-downtime vertical and horizontal
            scaling.
        - label: Event Streaming & Processing Services
          detail: Managed Apache Kafka clusters with Kafka Connect integration and Apache Flink stream analytics.
        - label: Transactional & Analytical Storage Services
          detail: Managed Aiven for PostgreSQL, MySQL, ClickHouse column-store analytics, and OpenSearch search clusters.
        - label: Security & Enterprise Governance Boundary
          detail: End-to-end TLS encryption, ISO 27001/SOC 2/HIPAA compliance controls, and SAML/Okta identity integration.
        - label: Multi-Cloud Infrastructure Abstraction Layer
          detail: >-
            Dedicated isolated virtual machines deployed across AWS, Google Cloud Platform, Microsoft Azure, and
            DigitalOcean.
  - id: FU001
    title: Aiven Customer Adoption and Expansion Journey
    type: journey-map
    summary: >-
      Adoption trajectory from open-source free-tier prototyping to enterprise multi-cloud production and
      consumption-driven expansion.
    data:
      nodes:
        - label: 1. Self-Service Evaluation & Free Tier
          detail: >-
            Developers deploy always-on Apache Kafka, PostgreSQL, MySQL, and OpenSearch without credit card or time
            limits to build prototypes.
          touchpoints:
            - Self-service web console
            - Free tier clusters
            - Developer documentation
        - label: 2. Workload Production Deployment
          detail: >-
            Teams graduate prototypes to paid managed clusters with automated patching, backup replication, and
            cross-cloud provisioning.
          touchpoints:
            - Cloud marketplace checkout
            - Terraform provider
            - CLI tooling
        - label: 3. Enterprise BYOC Migration
          detail: >-
            Enterprise security and platform teams adopt Bring Your Own Cloud (BYOC) to deploy data services inside
            customer AWS or GCP VPCs.
          touchpoints:
            - Enterprise procurement
            - Architecture review
            - Customer VPC peering
        - label: 4. Multi-Service Infrastructure Expansion
          detail: >-
            Accounts expand from single database instances into streaming pipelines and analytical engines (ClickHouse,
            Valkey, OpenSearch).
          touchpoints:
            - Data platform architecture
            - Solution architect advisory
            - Console service catalog
        - label: 5. Strategic Key Account Scale
          detail: >-
            Dedicated Key Account Directors manage large multi-thousand-person enterprises targeting net-new ARR across
            multiple business units.
          touchpoints:
            - Executive sponsor reviews
            - MEDDPICC quarterly reviews
            - Hyperscaler co-sell
        - label: 6. Continuous Consumption & Multi-Cloud Drift
          detail: >-
            Usage-based revenue compounds as daily data streaming throughput scales, while platform engineers mitigate
            cloud lock-in.
          touchpoints:
            - Consumption monitoring
            - Customer success engineering
            - Support runbooks
    approximationNotes: >-
      Journey stages reflect verified enterprise account management specifications, self-service free tier packaging,
      and published case studies.
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU005
      - CU010
