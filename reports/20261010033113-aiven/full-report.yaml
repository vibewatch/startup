            title: Inside Sales Velocity Governs SMB Market Capture
            body: >-
              Aiven's commercial motion in North America targets companies under $250M in revenue with 30-to-60 day
              sales cycles and an average $25K ARR deal size. Rather than relying solely on enterprise procurement, the
              go-to-market engine converts self-service and product-led trial activations into committed contracts,
              reducing customer acquisition overhead.
            calloutType: insight
