  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Peer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Aiven operates within an expansive database and streaming infrastructure market characterized by intense
              competition across multiple peer archetypes. Independent industry intelligence identifies dozens of active
              competitors competing directly or adjacently with Aiven, ranging from established public database giants
              to specialized high-growth infrastructure providers. The competitive arena divides into three primary
              forces: hyperscaler native managed data services, independent specialized managed database vendors, and
              status-quo self-managed open-source deployments. While Aiven has achieved substantial commercial scale and
              private backing relative to boutique tooling vendors, it competes against market incumbents that possess
              vastly larger enterprise footprints and established global sales distribution networks.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
