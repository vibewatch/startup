  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Hierarchical market sizing layers for Aiven across global public cloud infrastructure, multi-cloud managed open
      source, and addressable high-velocity segments.
    data:
      items:
        - label: Global Public Cloud Infrastructure (Macro TAM)
          value: $200B+ Global Market
          detail: >-
            Total enterprise cloud infrastructure spend across compute, storage, and networking (e.g. IDC APAC data
            shows Australia reaching A$22.4B and NZ reaching NZ$5.1B by 2026).
          tone: neutral
          claimRefs:
            - CM003
        - label: Database & Streaming Cloud Software (Category TAM)
          value: $80B+ Category TAM
          detail: >-
            Total enterprise software spend allocated to relational databases, analytical data warehouses, operational
            caching, and real-time event streaming across public clouds.
          tone: neutral
          claimRefs:
            - CM001
        - label: Managed Open-Source Data Services (Serviceable SAM)
          value: $25B+ Managed Open Source
          detail: >-
            Commercial market segment where enterprises replace customer-managed open source (Kafka, Postgres,
            ClickHouse, OpenSearch) with fully managed cloud-native solutions.
          tone: opportunity
          claimRefs:
            - CM005
        - label: Multi-Cloud & Neutral Platform Segment (Core SAM)
          value: $8B–$10B Multi-Cloud SAM
          detail: >-
            Organizations prioritizing multi-cloud portability across AWS, GCP, and Azure with BYOC data sovereignty to
            avoid hyperscaler proprietary lock-in.
          tone: positive
          claimRefs:
            - CM010
        - label: High-Velocity SMB & Mid-Market Target (Realistic SOM)
          value: $1.5B–$2.5B Addressable SOM
          detail: >-
            Mid-market companies (<$250M revenue) and fast-growing startups adopting managed data platforms with
            $15K–$50K ACV contracts and 30–60 day sales cycles.
          tone: opportunity
          claimRefs:
            - CM006
            - CM008
        - label: Aiven Current Captured Footprint (Current Revenue Base)
          value: $50M–$100M Revenue Run-Rate
          detail: >-
            Estimated current annualized revenue capture and 2.2% category mindshare in streaming analytics, constrained
            by intense competition from hyperscalers and specialist providers.
          tone: risk
          claimRefs:
            - CM004
            - CM014
    approximationNotes: >-
      Macro TAM and category SAM figures are industry estimates constrained by IDC regional benchmarks and third-party
      sizing proxies; Aiven SOM reflects high-velocity SMB deal parameters ($25K ARR average) and public revenue
      estimates ($50M–$100M).
