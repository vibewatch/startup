      - number: '4.3'
        title: Cost structure and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Aiven's fully managed, multi-cloud delivery model points to cloud infrastructure and service operations as
              material cost drivers, but no public allocation of hosting, support, engineering, or sales costs was
              found. Gross margin, contribution margin, CAC, payback, NRR, GRR, churn, working capital, and capex are
              consequently unknown. Historical financing is better documented: Tracxn reports $421 million across six
              rounds and a $210 million Series D in May 2022, while Multiples reports $420 million and LeadIQ only about
              $210 million. The discrepancy reinforces that cumulative funding is not a current cash balance. Aiven's
              historical plans to use proceeds for hiring, product additions, and enterprise features describe intended
              deployment, not remaining liquidity, burn, runway, debt obligations, or the trigger for another round.
            claimRefs:
              - CI007
              - CI008
              - CI012
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              Revenue quality cannot be graded above provisional because the public record lacks a consistent current
              revenue definition, audited statements, customer retention, concentration, realized pricing, and margin
              data. The May 2022 $3 billion mark equated to 30.0 times the $100 million figure in Multiples, but both
              the numerator and denominator are historical and the denominator is definition-sensitive. EquityZen's
              description of existing shareholders selling through its funds signals a secondary-liquidity channel; it
              does not evidence cash entering Aiven. The core adverse finding is therefore evidentiary rather than a
              claim of insolvency: substantial historical fundraising does not establish present capital adequacy.
              Audited monthly revenue, cohort retention, gross-margin waterfall, cash, burn, runway, debt, and financing
              plans are required before underwriting growth quality, margin expansion, or financing dependency.
            claimRefs:
              - CI004
              - CI005
              - CI011
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding is not runway
            body: >-
              Public sources report roughly $420 million to $421 million raised historically, but no allocated source
              discloses current cash, burn, debt service, or runway. Treating cumulative funding as available liquidity
              would overstate capital adequacy.
            calloutType: risk
            claimRefs:
              - CI007
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Platform Definition and Managed Service Portfolio
        blocks:
          - type: paragraph
            body: >-
              Aiven delivers an integrated cloud data platform designed to stream, store, and serve mission-critical
              application data using leading open-source software engines. Rather than building proprietary storage
              engines, Aiven packages and manages unmodified upstream open-source technologies including Apache Kafka
              for distributed event streaming, PostgreSQL and MySQL for relational data persistence, ClickHouse for
              high-throughput columnar analytics, and OpenSearch for distributed indexing and search. In 2026, Aiven
              expanded accessibility by introducing a permanent Free Tier that provides always-on instances of Apache
              Kafka, PostgreSQL, MySQL, and OpenSearch deployed on the same underlying infrastructure architecture as
              its paid enterprise tiers. This portfolio approach allows software engineering teams to provision,
              configure, and operate heterogeneous database topologies across AWS, Google Cloud Platform, Microsoft
              Azure, and DigitalOcean without managing low-level operating system patches, storage volumes, or
              clustering protocols.
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
      - number: '5.2'
        title: Developer Workflows, Integration Surface, and Operations
        blocks:
          - type: paragraph
            body: >-
              Developer and partner interactions with Aiven center on declarative automation and turnkey integration
              surfaces that remove operational friction from application lifecycles. Engineering teams deploy and manage
              services through an administrative web console, a command-line interface, direct REST APIs, and an
              official Terraform provider that enables infrastructure-as-code automation. Aiven also provides
              specialized OEM solution architecture programs to assist commercial software vendors in embedding managed
              open-source clusters into their SaaS offerings via APIs and client SDKs. Technical documentation is
              publicly maintained using a Docusaurus-based developer portal that offers architectural guidance,
              connection code samples, and API specifications. By automating cluster deployment, automated backups, and
              non-disruptive scaling, Aiven enables developers to focus on application business logic rather than
              routine database administration.
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE007
              - CE009
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE006
              - CE007
              - CE013
      - number: '5.3'
        title: Multi-Cloud Operating Architecture, Isolation, and Elasticity
        blocks:
          - type: paragraph
            body: >-
              Aiven's technical operating model is structured around dedicated virtual machine isolation, automated
              cluster lifecycle orchestration, and cross-cloud abstraction. Unlike multi-tenant container platforms that
              share compute kernels across organizations, each Aiven cluster deploys on isolated, single-tenant virtual
              machines in the customer's selected cloud provider and region, ensuring strict physical data isolation and
              predictable I/O performance. Elasticity is supported through both vertical scaling, which dynamically
              upgrades instance hardware specifications without service downtime, and horizontal scaling, which adds
              broker or replica nodes to distribute partition throughput. Independent performance benchmarks demonstrate
              that a five-node Aiven for Apache Kafka cluster can sustain throughput rates up to 535,000 messages per
              second under optimal conditions. To maintain platform reliability, Aiven employs its SOFT
              framework—prioritizing scalability, observability, fast recovery, and trustworthy execution—backed by
              real-time health telemetry dashboards and an enterprise uptime SLA of up to 99.99%.
            claimRefs:
              - CE004
