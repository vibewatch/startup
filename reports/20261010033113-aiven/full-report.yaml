      - number: '1.2'
        title: Executive Leadership, Governance, and Key-Person Risk
        blocks:
          - type: paragraph
            body: >-
              Aiven is led by co-founder and Chief Executive Officer Oskari Saarenmaa, supported by co-founders Hannu
              Valtonen, Heikki Nousiainen, and Mika Eloranta, who oversees technical operations. The executive
              leadership group has demonstrated consistent technical and open-source systems background, establishing an
              Open Source Program Office (OSPO) to contribute upstream maintenance to core projects like PostgreSQL and
              Apache Kafka. However, formal board composition, board committee authority, independent director voting
              rights, and liquidation preference stacks remain undisclosed in public registers. Key-person dependency
              centers heavily on Saarenmaa and the founding engineering core, who established the company's early
              multi-cloud orchestration IP. Independent operational reviews reflect high internal executive approval,
              yet the absence of external board disclosures limits governance visibility for secondary and institutional
              market participants.
