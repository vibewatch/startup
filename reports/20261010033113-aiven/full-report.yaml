chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Founded in 2016 by Oskari Saarenmaa, Hannu Valtonen, Heikki Nousiainen, and Mika Eloranta in Helsinki,
              Finland, Aiven provides a managed open-source cloud data infrastructure platform. The platform abstracts
              the deployment, operational management, maintenance, security hardening, and monitoring of major
              open-source data systems—such as Apache Kafka, PostgreSQL, OpenSearch, MySQL, Apache Cassandra, and
              M3—across leading hyperscale cloud providers including Amazon Web Services (AWS), Google Cloud Platform
              (GCP), and Microsoft Azure. Headquartered in Helsinki, Aiven maintains distributed hubs in Berlin, Boston,
              Paris, Sydney, Singapore, Toronto, and Amsterdam, serving commercial software developers and enterprise
              data engineering teams across more than 50 countries. The operating model relies on a fully managed cloud
              database-as-a-service (DBaaS) architecture, offering developer-tier accessibility through permanent free
              tiers for Apache Kafka and OpenSearch alongside consumption-based and contractual enterprise tiers. While
              the company's technical surface exhibits mature operational discipline, private financial governance
              leaves revenue waterfall, cash burn, and margin health opaque to external review.
            claimRefs:
