            title: 内部销售速度主导 SMB 市场获取
            body: Aiven 在北美面向收入低于 $250M 的公司，销售周期为 30 至 60 天，平均订单规模为 $25K ARR。它不只依赖企业采购，还把自助服务和产品驱动试用激活转成签约合同，降低获客负担。
