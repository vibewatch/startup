  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 展示 Aiven 覆盖的分层市场规模：全球公有云基础设施、多云托管开源服务，以及可触达的高增长细分市场。
    data:
      items:
        - label: 全球公有云基础设施（宏观 TAM）
          value: $200B+ Global Market
          detail: 企业在计算、存储和网络上的云基础设施总支出（例如，IDC 亚太数据预计澳大利亚到 2026 年达到 A$22.4B，新西兰达到 NZ$5.1B）。
          tone: neutral
          claimRefs:
            - CM003
        - label: 数据库与流式云软件（品类 TAM）
          value: $80B+ Category TAM
          detail: 企业在公有云上用于关系型数据库、分析型数据仓库、运营缓存和实时事件流的全部软件支出。
          tone: neutral
          claimRefs:
            - CM001
        - label: 托管开源数据服务（可服务 SAM）
          value: $25B+ Managed Open Source
          detail: 企业用全托管云原生方案替代自管开源软件（Kafka、Postgres、ClickHouse、OpenSearch）的商业市场细分。
          tone: opportunity
          claimRefs:
            - CM005
        - label: 多云与中立平台细分（核心 SAM）
          value: $8B–$10B Multi-Cloud SAM
          detail: 重视 AWS、GCP 和 Azure 间多云可移植性，并以 BYOC 数据主权避免云超大规模厂商专有锁定的组织。
          tone: positive
          claimRefs:
            - CM010
        - label: 高增长 SMB 与中端市场目标（现实 SOM）
          value: $1.5B–$2.5B Addressable SOM
          detail: 采用托管数据平台的中端市场企业（收入 <$250M）和高速增长初创公司，合同 ACV 为 $15K–$50K，销售周期为 30–60 天。
          tone: opportunity
          claimRefs:
            - CM006
            - CM008
        - label: Aiven 当前已获取的市场足迹（当前收入基数）
          value: $50M–$100M Revenue Run-Rate
          detail: 估计当前年化收入规模，以及在流式分析领域 2.2% 的品类心智份额；该份额受云超大规模厂商和专业提供商的激烈竞争限制。
          tone: risk
          claimRefs:
            - CM004
            - CM014
    approximationNotes: 宏观 TAM 和品类 SAM 数字是行业估算，受 IDC 区域基准和第三方规模代理指标约束；Aiven SOM 反映高增长 SMB 的交易参数（平均 ARR $25K）和公开收入估算（$50M–$100M）。
