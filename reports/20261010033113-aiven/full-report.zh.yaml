      - number: '7.3'
        title: 财务模式、资本充足性与投资判断尽调
        blocks:
          - type: paragraph
            body: >-
              Aiven 在 2020 至 2022 年云基础设施繁荣期快速扩张，通过 2021 年 10 月 C 轮扩展轮累计融资 $210M，估值为 $2.0B；随后 2022 年 5 月 D 轮完成后，累计融资约
              $420M [CR010, CR011, CR012]。但自 2022 年以来，公司没有公布经审计的财务报表、净现金余额、现金烧钱率、毛利瀑布或收入留存指标，给机构投资者造成严重的投资判断不透明
              [CR013]。第三方估算显示，2025 年收入跑速在 $50M 至 $100M 之间，员工数约 201 至 500 人；因此，2022 年建立的 $3.0B 历史峰值估值相当于极高的 30x
              收入倍数，容易遭遇严重下轮重置 [CR011, CR012, CR014]。在毛利率未披露的情况下，直接的超大规模云基础设施批发成本和永久免费层开发者托管义务，可能压缩利润率并威胁现金自给自足 [CR015,
              CR016] 
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
