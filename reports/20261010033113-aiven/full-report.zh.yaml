  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义、范围边界与核心细分
        blocks:
          - type: paragraph
            body: >-
              Aiven
              位于云基础设施与托管式开源软件的交汇处，在公有云上提供自动化数据库即服务（DBaaS）、事件流和分析数据服务。公司的核心可服务市场涵盖由主流开源技术驱动的运营型和实时数据工作负载，最主要包括用于分布式流处理的
              Apache Kafka、用于事务持久化的 PostgreSQL 和 MySQL、用于高性能分析处理（OLAP）的 ClickHouse，以及用于搜索和日志的 OpenSearch。Aiven
              的商业价值在于消除运营维护负担，提供自动配置、零停机维护、自动备份与恢复和企业安全合规，同时保留纯开源 API 兼容性。这一边界明确将 Aiven
              与专有闭源数据库架构、集中式云数据仓库和通用计算托管区分开来。在这一范围内，可服务支出取决于客户是选择外包运营复杂性，还是在裸虚拟机或专有数据库软件上自行管理开源集群。
            claimRefs:
              - CM001
              - CM002
          - type: table
            tableRef: TM001
            claimRefs:
