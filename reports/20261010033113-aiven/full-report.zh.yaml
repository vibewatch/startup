      - number: '1.3'
        title: 资本结构、规模指标与估值期限
        blocks:
          - type: paragraph
            body: >-
              2017 至 2022 年间，Aiven 在六轮融资中累计募集约 $420M 股权资本。早期融资包括 2017 年的 $1.0M Seed 轮，以及 2019 年 5 月由 Earlybird Venture
              Capital 领投的 $8.9M Series A；随后是 2020 年 2 月由 IVP 领投的 $40M Series B。2021 年 3 月，Aiven 完成由 Atomico 领投的 $100M
              Series C，估值为 $800M；同年 10 月，World Innovation Lab（WiL）与 IVP 联合领投 $60M 扩展轮，公司投后估值达到 $2.0B。2022 年 5 月，Aiven
              完成由 Eurazeo 领投的 $210M Series D，BlackRock 管理基金、IVP、Atomico、Earlybird、WiL 和 Salesforce Ventures 参投，投前估值达到
              $3.0B。2022 年 5 月以来，没有新的一级资本注入完成。二级市场跟踪平台显示，第三方估算的年经常性收入（ARR）在 $48.7M 至超过 $100M 之间；监管和职业目录记录的员工数则在 443 至
              500 人之间。多年没有一级融资，使 Aiven 2022 年的估值基准无法与 2026 年软件市场倍数锚定，带来显著估值风险。
