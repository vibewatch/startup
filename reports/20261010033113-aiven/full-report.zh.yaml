        title: 核心平台定义与托管服务组合
        blocks:
          - type: paragraph
            body: >-
              Aiven 提供一体化云数据平台，使用主流开源软件引擎来流式处理、存储和服务关键应用数据。Aiven 不自行构建专有存储引擎，而是打包并管理未修改的上游开源技术，包括用于分布式事件流的 Apache
              Kafka、用于关系数据持久化的 PostgreSQL 和 MySQL、用于高吞吐列式分析的 ClickHouse，以及用于分布式索引和搜索的 OpenSearch。2026 年，Aiven 推出永久 Free
              Tier，提供长期运行的 Apache Kafka、PostgreSQL、MySQL 和 OpenSearch 实例，底层基础设施架构与付费企业层相同。通过这种产品组合，软件工程团队可以在 AWS、Google
              Cloud Platform、Microsoft Azure 和 DigitalOcean 上配置、设置并运营异构数据库拓扑，无需管理底层操作系统补丁、存储卷或集群协议。
