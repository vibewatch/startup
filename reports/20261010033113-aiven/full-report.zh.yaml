figures:
  - id: FO001
    title: Aiven 公司与融资里程碑时间线（2016–2026）
    type: timeline
    summary: 按时间梳理 Aiven 的公司成立、主要风险投资融资轮次、全球扩张和云服务层级发布。
    data:
      items:
        - label: 公司成立（2016）
          date: '2016-01-01'
          detail: Oskari Saarenmaa、Hannu Valtonen、Heikki Nousiainen 和 Mika Eloranta 在赫尔辛基创立公司，旨在自动化开源云数据基础设施。
          tone: positive
        - label: Series A 融资（$8.9M）
          date: '2019-05-03'
          detail: Earlybird Venture Capital 领投 $8.9M Series A 融资，用于加速多云数据服务。
          tone: positive
        - label: Series B 扩张（$40M）
          date: '2020-02-05'
          detail: IVP 领投 $40M Series B 股权融资，用于扩展国际销售和产品开发。
          tone: positive
        - label: Series C 独角兽里程碑（$100M）
          date: '2021-03-23'
          detail: Atomico 领投 $100M Series C 轮，估值 $800M，并引入 Salesforce Ventures 和 WiL。
          tone: positive
        - label: Series C 扩展与 $2B 估值（$60M）
          date: '2021-10-19'
          detail: WiL 和 IVP 联合领投 $60M Series C 扩展轮，估值 $2.0B，并启动开源项目办公室。
          tone: positive
        - label: Series D 与 $3B 估值（$210M）
          date: '2022-05-11'
          detail: Eurazeo 和 BlackRock 领投 $210M Series D 融资，建立 $3.0B 融资前估值。
          tone: positive
        - label: 员工数量与规模放缓
          date: '2025-11-01'
          detail: 员工规模稳定在约 449 人，未达到 2022 年将员工数翻倍的目标。
          tone: warning
        - label: 免费层与平台新增功能（2026）
          date: '2026-06-16'
          detail: 推出长期免费的 OpenSearch 和 Kafka 免费层，以及 Aiven Apps 运行时；在一级融资停滞期间维持开发者采用。
          tone: neutral
    approximationNotes: 日期来自官方新闻公告或监管登记时间戳；产品扩张里程碑来自公开平台发布。
