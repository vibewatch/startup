chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、成立背景与运营模式
        blocks:
          - type: paragraph
            body: >-
              Aiven 由 Oskari Saarenmaa、Hannu Valtonen、Heikki Nousiainen 和 Mika Eloranta 于 2016
              年在芬兰赫尔辛基创立，提供托管式开源云数据基础设施平台。平台将 Apache Kafka、PostgreSQL、OpenSearch、MySQL、Apache Cassandra 和 M3
              等主流开源数据系统的部署、运营管理、维护、安全加固和监控抽象出来，覆盖 Amazon Web Services（AWS）、Google Cloud Platform（GCP）和 Microsoft Azure
              等头部超大规模云厂商。Aiven 总部位于赫尔辛基，并在柏林、波士顿、巴黎、悉尼、新加坡、多伦多和阿姆斯特丹设有分布式运营中心，为 50
              多个国家的商业软件开发者和企业数据工程团队服务。其模式建立在全托管的云数据库即服务（DBaaS）架构上：Apache Kafka 和 OpenSearch
              提供永久免费层，企业客户则使用按量计费和合同制层级。公司的技术体系体现出成熟的运营纪律，但私有财务治理使收入瀑布、现金消耗和利润率状况对外仍不透明。
