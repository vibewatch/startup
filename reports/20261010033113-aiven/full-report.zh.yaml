    title: 有公开依据支持的收入模型桥接
    type: flow
    summary: 公开证据支持运营流程顺序，但不支持转化率、单位利润率或由此产生的现金生成。
    data:
      nodes:
        - id: free-entry
          label: 免费层入口
          detail: Kafka、PostgreSQL、MySQL 和 OpenSearch 长期开启，免信用卡且无时间限制。
        - id: production-adoption
          label: 生产环境采用
          detail: 转化率和激活门槛尚未公开披露。
        - id: paid-service
          label: 付费托管服务
          detail: 对外归类为订阅模式；当前套餐经济性不可得。
        - id: cloud-operations
          label: 云与服务交付
          detail: 底层云、工程和支持成本分配不可得。
        - id: gross-profit
          label: 毛利
          detail: 毛利率和服务层贡献利润率不可得。
        - id: cash-reinvestment
          label: 现金生成或融资需求
          detail: 现金、消耗、现金跑道和下一轮融资触发条件不可得。
    approximationNotes: 仅为概念性运营桥接；节点宽度和间距不代表价值或转化率。
    claimRefs:
      - CI001
      - CI002
      - CI015
      - CI016
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 展示 Aiven 托管数据云架构的结构，从多云托管到开发者接口共六个功能层。
    claimRefs:
      - CE004
      - CE005
      - CE008
      - CE009
      - CE011
      - CE012
    data:
      layers:
        - label: 开发者体验与工具层
          detail: 基于 Docusaurus 的公开开发者文档、OEM 集成 SDK、REST API 和 Terraform 提供商。
        - label: 统一管理与控制平面
          detail: 自动化配置引擎、健康遥测，以及不中断服务的纵向和横向扩展。
        - label: 事件流与处理服务
          detail: 托管 Apache Kafka 集群，集成 Kafka Connect 和 Apache Flink 流分析。
        - label: 事务与分析存储服务
          detail: 托管 Aiven for PostgreSQL、MySQL、ClickHouse 列式存储分析和 OpenSearch 搜索集群。
        - label: 安全与企业治理边界
          detail: 端到端 TLS 加密、ISO 27001/SOC 2/HIPAA 合规控制，以及 SAML/Okta 身份集成。
        - label: 多云基础设施抽象层
          detail: 在 AWS、Google Cloud Platform、Microsoft Azure 和 DigitalOcean 上部署的专用隔离虚拟机。
  - id: FU001
    title: Aiven 客户采用与扩张旅程
    type: journey-map
    summary: 从开源免费层原型验证走向企业多云生产环境，并随着用量增长持续扩张。
    data:
      nodes:
        - label: 1. 自助评估与免费层
          detail: 开发者无需信用卡、也不受时间限制，即可部署长期运行的 Apache Kafka、PostgreSQL、MySQL 和 OpenSearch 来构建原型。
          touchpoints:
            - Self-service web console
            - Free tier clusters
            - Developer documentation
        - label: 2. 工作负载生产部署
          detail: 团队将原型升级为付费托管集群，获得自动打补丁、备份复制和跨云配置能力。
          touchpoints:
            - Cloud marketplace checkout
            - Terraform provider
            - CLI tooling
        - label: 3. 企业 BYOC 迁移
          detail: 企业安全和平台团队采用 Bring Your Own Cloud（BYOC），把数据服务部署在客户的 AWS 或 GCP VPC 内。
          touchpoints:
            - Enterprise procurement
            - Architecture review
            - Customer VPC peering
        - label: 4. 多服务基础设施扩张
          detail: 账户从单一数据库实例扩展到流式管道和分析引擎（ClickHouse、Valkey、OpenSearch）。
          touchpoints:
            - Data platform architecture
            - Solution architect advisory
            - Console service catalog
        - label: 5. 战略大客户规模化
          detail: 专门的大客户总监管理数千人规模的大型企业，面向多个业务部门争取新增 ARR。
          touchpoints:
            - Executive sponsor reviews
            - MEDDPICC quarterly reviews
            - Hyperscaler co-sell
        - label: 6. 持续用量与多云迁移
          detail: 日常数据流吞吐量扩大，推动用量型收入复合增长；平台工程师则缓解云锁定。
          touchpoints:
            - Consumption monitoring
            - Customer success engineering
            - Support runbooks
    approximationNotes: 旅程阶段反映经过验证的企业账户管理规范、自助免费层包装和公开案例研究。
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU005
      - CU010
  - id: FR001
    title: Aiven 企业尽调风险矩阵
    type: matrix
    summary: 对照当前缓解成熟度，展示运营、财务和战略关键风险领域的剩余严重程度。
    data:
      columns:
        - 缓解成熟度低
        - 缓解成熟度中
        - 缓解成熟度高
      rows:
        - label: 财务透明度与估值重置
          values:
            - label: 未验证的 $3B 峰值估值
              tone: critical
            - label: 毛利率透明度不足
              tone: high
            - label: 历史 Series C/D 规模
              tone: medium
        - label: 云超大规模厂商平台集中度
          values:
            - label: 直接利润率挤压
              tone: critical
            - label: 多云可移植性开销
              tone: high
            - label: 多区域基础设施 SLA
              tone: low
        - label: 监管与跨境主权
          values:
            - label: 主权云强制要求
              tone: high
            - label: DORA 与 GDPR 合规开销
              tone: medium
            - label: ISO 27001 与 SOC 2 鉴证
              tone: low
        - label: 加密与 BYOK 管理
          values:
            - label: 客户 IAM 删除锁定
              tone: critical
            - label: KMS 作用域委派工具
              tone: medium
            - label: 端到端自动加密
              tone: low
        - label: 开源上游治理
          values:
            - label: 限制性许可证漂移
              tone: high
            - label: OSPO 上游代码贡献承诺
              tone: medium
            - label: 多引擎支持（Kafka/PG）
              tone: low
        - label: 开发者免费层单位经济性
          values:
            - label: 未变现的计算消耗
              tone: high
            - label: 永久配额限流
              tone: medium
            - label: 自助转化漏斗
              tone: low
    approximationNotes: 根据公开披露，评估关键尽调维度上的企业剩余风险定位。
    claimRefs:
      - CR003
      - CR005
      - CR006
      - CR008
      - CR010
      - CR013
      - CR014
      - CR015
  - id: FV001
    title: 建议逻辑流程
    type: flow
    summary: 从多云市场牵引力和竞争压力出发，推导至最终的避免投资建议。
    data:
      nodes:
        - id: scale-proof
          label: 多云产品组合牵引力
        - id: competitive-pressure
          label: 云超大规模厂商原生竞争
        - id: financial-opacity
          label: 财务透明度与资本缺口
        - id: valuation-disconnect
          label: 估值脱节（$3B 过时估值）
        - id: secondary-illiquidity
          label: 二级市场流动性不足
        - id: decision-outcome
          label: 最终建议：避免投资
      edges:
        - from: scale-proof
          to: competitive-pressure
        - from: competitive-pressure
          to: financial-opacity
        - from: financial-opacity
          to: valuation-disconnect
        - from: valuation-disconnect
          to: secondary-illiquidity
        - from: secondary-illiquidity
          to: decision-outcome
    approximationNotes: 将运营优势和风险因素映射到投资立场的定性分析流程。
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV008
      - CV013
