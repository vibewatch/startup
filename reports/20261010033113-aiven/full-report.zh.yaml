              - CM002
              - CM009
              - CM012
      - number: '2.2'
        title: 可服务市场规模、地域扩张与多云视角
        blocks:
          - type: paragraph
            body: >-
              评估 Aiven 的市场机会，先要把总体云基础设施增长拆成具体服务和交付模式。全球云采用仍在加速；例如 IDC 数据显示，澳大利亚公有云支出预计在 2026 年达到 A$22.4B，较 2022 年增长
              83%，新西兰支出预计同期翻倍至 NZ$5.1B。但云总支出只能作为宏观上限，不能直接代表 Aiven 的可服务机会。在流分析等专业类别中，第三方用户参与度指数显示，截至 2026 年底，Aiven
              的品类心智份额为 2.2%，与 IBM Streams 的 2.1% 几乎持平；这是一个高度分散的市场，95.7% 的活动分散在长尾方案中。Aiven 的独立收入估算在 $50M 至 $100M
              之间，说明早期增长势头可观，但也表明可服务可获得市场的渗透率仍处于个位数低位。Aiven 财务披露为私人性质，进一步限制了规模估算的精确度，因此必须把各层级透明拆开。
