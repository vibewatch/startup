      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 超大规模云的固有冲突与定价利润率挤压
            body: >-
              Aiven 的核心商业主张是在 AWS、Microsoft 和 Google 所拥有的基础设施上转售托管式开源软件，而这些厂商都在积极推广自己的原生一方替代方案（Amazon RDS/MSK、Azure
              Database、Google Cloud SQL）。多云中立虽是 Aiven 的主要营销护盾，但毛利率受到超大规模云批发计算和出口定价的结构性限制，公司容易受到平台利润率挤压。
            calloutType: risk
            claimRefs:
              - CR007
              - CR008
              - CR015
          - type: callout
            title: 后期投资判断的必要尽调前提
            body: >-
              无论采用何种估值基准投入资本，投资者都必须要求提供按超大规模云厂商拆分的未删节毛利率、净收入留存（NRR）cohort 和客户集中度披露。此外，还必须直接审查客户管理加密密钥（BYOK）事件日志和 SRE
              跨区域故障转移恢复演练，以验证运营韧性声明。
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR005
              - CR013
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 管理层建议与估值立场
        blocks:
          - type: paragraph
            body: >-
              对 Aiven 资本结构和商业增长势头的综合评估显示，公司最近一次确认的投后估值为 $3.0B，形成于 2022 年 5 月 D 轮，已严重脱离当前软件估值倍数。Aiven 虽已将多云托管开源数据平台扩展至全球
              90 个区域，但公开估算显示其历史年收入仅在 $50M 至 $100M 之间。在没有经审计数据确认当前增长或利润率轨迹的情况下，历史收入跑速对应的 25x 至 30x
              倍数难以支撑。因此，尽调建议避免按历史估值参与股权投资：估值昂贵，整体风险高；由于缺少公开申报，分析置信度为中等。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
              - CV008
              - CV013
