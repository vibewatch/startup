      - number: '3.4'
        title: 护城河持久性、切换成本与替代威胁
        blocks:
          - type: paragraph
            body: >-
              Aiven 的战略定位建立在客户对云无关基础设施的偏好，以及避免供应商锁定的需求之上。由于 Aiven 完全基于标准开源技术构建，其技术锁定天然低于 Snowflake 或 Cosmos DB
              等专有系统。但架构开放是一把双刃剑：较低的专有锁定减少了客户切换壁垒，使 Aiven 容易被超大规模云厂商或其他托管平台替代。Aiven 通过深度嵌入客户 DevOps 工作流、Terraform
              脚本和多服务事件 pipeline 来对冲这一弱点，即使底层存储引擎仍是开源的，也能形成运营切换成本。
            claimRefs:
              - CP006
              - CP011
              - CP012
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 超大规模云捆绑与利润率挤压
            body: Aiven 虽然能在 AWS、GCP 和 Azure 之间提供真正的多云灵活性，但超大规模云厂商以激进的企业折扣、捆绑云承诺和深度生态集成进行反击，使大型企业采用单云采购在经济上更有吸引力。
            calloutType: risk
            claimRefs:
              - CP013
              - CP014
