  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与合规治理
        blocks:
          - type: paragraph
            body: >-
              企业采用托管式云数据库基础设施，必须严格遵守国际数据治理框架、安全认证和主权监管要求 [CR001]。Aiven 在托管服务组合中维持 ISO 27001、SOC 2、HIPAA 和 PCI DSS
              等企业基线认证 [CR001, CR002]。为应对欧洲联盟 DORA 等日益收紧的数字运营韧性标准，以及 GDPR 下的跨境医疗数据处理要求，Aiven 在 AWS、GCP 和 Azure
              上推出由客户控制的自带密钥（BYOK）客户管理加密密钥能力 [CR003]。在该架构下，客户 KMS 持有根加密材料，向 Aiven 授予可撤销且有范围限制的加密和解密权限，但不允许导出
              [CR004]。不过，BYOK 虽可缓解法律上的数据主权和传票风险，客户安全团队意外撤销 IAM 授权或错误销毁密钥，仍会立即造成无法恢复的运营停机 [CR005]。此外，托管式开源平台仍会受到核心组件（如
              Apache Kafka、OpenSearch 和 PostgreSQL）的上游项目重新许可和商标限制影响，因此需要通过 Aiven 的 Open Source Program Office 持续贡献维护
              [CR006]。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
