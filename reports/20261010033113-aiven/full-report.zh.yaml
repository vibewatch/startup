      - number: '2.3'
        title: 买方画像、采购路径与商业速度
        blocks:
          - type: paragraph
            body: >-
              Aiven 在北美的主要商业动作面向年收入低于 $250M 的公司，结合内部销售执行与产品驱动增长（PLG）转化。在这一细分中，目标买方和技术决策者包括工程经理、平台负责人、DevOps
              经理和高级软件工程师；他们希望把零散的数据工具专业化，同时避免漫长的企业采购周期。内部客户经理的商业配额是每年完成 10 个新客户，平均每单 ARR 为 $25K（年度 ARR 配额 $300K），并依靠
              $1.4M 的合格销售线索池支撑 30 至 60 天的高速销售周期。销售人员按 MEDDPICC
              标准系统筛选机会，把用量激增、试用激活和自助扩展信号转化为正式年度承诺。对于大型企业客户，采用路径转向架构平台整合、多区域合规以及由集中式 IT 安全和采购团队管理的自带云（BYOC）基础设施部署。
            claimRefs:
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
