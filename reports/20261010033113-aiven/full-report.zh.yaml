      - number: '5.3'
        title: 多云运营架构、隔离与弹性
        blocks:
          - type: paragraph
            body: >-
              Aiven 的技术运营模式建立在专用虚拟机隔离、自动化集群生命周期编排和跨云抽象之上。不同于在组织之间共享计算内核的多租户容器平台，每个 Aiven
              集群都部署在客户所选云厂商和区域中的隔离单租户虚拟机上，确保严格的物理数据隔离和可预测的 I/O 性能。弹性同时由纵向扩展和横向扩展支持：前者在不中断服务的情况下动态升级实例硬件规格，后者增加 broker 或
              replica 节点以分散分区吞吐。独立性能基准显示，五节点 Aiven for Apache Kafka 集群在最佳条件下可维持每秒最高 535,000 条消息的吞吐率。为保持平台可靠性，Aiven 使用
              SOFT 框架，优先保障可扩展性、可观测性、快速恢复和可信执行，并以实时健康遥测面板及最高 99.99% 的企业 uptime SLA 为支撑。
