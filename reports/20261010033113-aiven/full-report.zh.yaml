  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与同业分层
        blocks:
          - type: paragraph
            body: >-
              Aiven 所处的数据库和流基础设施市场规模庞大，各类同业之间竞争激烈。独立行业情报显示，Aiven
              面临数十家直接或相邻竞争者，从成熟的上市数据库巨头到高速成长的专业基础设施提供商都有。竞争场景分为三股主要力量：超大规模云原生托管数据服务、独立专业托管数据库厂商，以及维持现状的自托管开源部署。相较于小众工具厂商，Aiven
              已具备较大的商业规模和私募支持，但仍要面对企业覆盖远大于自身、全球销售网络成熟的市场龙头。
