            body: >-
              Aiven 的企业治理和安全控制采用纵深防御措施，以满足严格的合规框架。所有网络通信均使用传输中的端到端 TLS 加密，同时提供静态硬件级磁盘加密，以及云原生 VPC peering 和 PrivateLink
              网络。管理访问由 SAML 和 Okta 单点登录集成保护，合规认证包括 ISO 27001、SOC 2、HIPAA 和 PCI-DSS。尽管具备这些企业级保障，尽调仍发现一个内在架构取舍：Aiven
