      - number: '2.4'
        title: 增长驱动、采用阻力与规模估算缺口
        blocks:
          - type: paragraph
            body: >-
              多云可移植性、开发者易用性和运营成本优化推动 Aiven 平台的采用。Aiven 可在 AWS、Google Cloud 和 Microsoft Azure 上顺畅部署，并提供主权云选项和 BYOC
              能力，避免被单一基础设施供应商锁定。OpenSearch、Kafka、PostgreSQL 和 MySQL 的永久免费层降低了评估门槛，让工程团队无需预付软件成本即可搭建生产架构原型。在分析工作负载中，Aiven
              for ClickHouse 提供动态磁盘调优和分层存储方案，相比传统预配容量，最高可将总拥有成本降低 30%。反过来，关键采用约束包括买方对托管服务相较 DIY
              托管溢价的性价比审查、对底层数据库调优能力受限的担忧，以及数据库迁移摩擦。此外，净收入留存（NRR）、客户数和毛利率瀑布均未公开，使关键的市场扩张问题无法验证。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
