        blocks:
          - type: paragraph
            body: >-
              Aiven 的运营模式根本上依赖于将分布式开源数据服务直接部署在底层公有云的计算、存储和网络层 [CR007]。公司提供保证 99.99% 可用性的服务等级协议（SLA），由 24/7/365
              的站点可靠性工程团队和内置跨区域自动故障转移机制提供支持 [CR001, CR007]。尽管拥有多区域高可用架构，Aiven 仍不可避免地依赖 Amazon Web Services、Google Cloud
              Platform 和 Microsoft Azure 的底层物理基础设施及控制平面稳定性 [CR008]。一旦超大规模云发生未缓解的多可用区故障、路由失败或大范围计算限流，无论 Aiven 内部 SRE
              工具如何运作，都会直接影响下游客户集群的可用性 [CR008]。此外，在数百个客户租户之间自动执行跨云迁移、持久卷快照、版本升级，以及 Kafka 和 PostgreSQL 有状态零停机维护，会持续带来执行风险
              [CR009]。
            claimRefs:
              - CR001
              - CR007
              - CR008
              - CR009
