callouts:
  - calloutType: "risk"
    title: "Hyperscaler Inherent Conflict and Pricing Margin Squeeze"
    body: "Aiven's fundamental business proposition relies on reselling managed open-source software running directly on infrastructure owned by AWS, Microsoft, and Google—all of whom market aggressive native first-party alternatives (Amazon RDS/MSK, Azure Database, Google Cloud SQL). While multi-cloud neutrality is Aiven's primary marketing shield, gross margins are structurally capped by hyperscaler wholesale compute and egress pricing, leaving Aiven vulnerable to platform margin compression."
    claimRefs:
      - "CR007"
      - "CR008"
      - "CR015"
  - calloutType: "recommendation"
    title: "Mandatory Diligence Prerequisites for Late-Stage Underwriting"
    body: "Before committing capital at any valuation benchmark, investors must require unredacted disclosures of gross margins broken down by hyperscaler, net revenue retention (NRR) cohorts, and customer concentration. Furthermore, direct technical review of customer-managed encryption key (BYOK) incident logs and SRE cross-region failover recovery drills is essential to validate operational resilience claims."
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR013"
      - "CR016"
