callouts:
  - calloutType: "risk"
    title: "Funding is not runway"
    body: >-
      Public sources report roughly $420 million to $421 million raised historically,
      but no allocated source discloses current cash, burn, debt service, or runway.
      Treating cumulative funding as available liquidity would overstate capital adequacy.
    claimRefs: ["CI007", "CI014"]
