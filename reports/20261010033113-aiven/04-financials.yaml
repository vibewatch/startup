      - ["Enterprise support or services", "Unknown", null, "Not supportable from allocated public evidence", "Services and support revenue, attach rate, and gross margin"]
      - ["Marketplace or channel revenue", "Unknown", null, "Not supportable from allocated public evidence", "Channel mix, marketplace fees, discounts, and revenue recognition"]
    notes: "Public-source snapshot as of 2026-10-10; null means no support in the allocated evidence, not zero revenue."
    claimRefs: ["CI001", "CI002", "CI003"]
  - id: "TI002"
    title: "Pricing and monetization evidence"
    columns: ["Offer or term", "Public evidence", "Price or unit", "Known limitation", "Underwriting request"]
    rows:
      - ["Free Tier", "Always-on access on paid-plan infrastructure", "$0 entry surface", "No conversion or usage economics disclosed", "Free-tier cohorts, utilization, support load, and conversion"]
      - ["Paid plans", "Homepage invites users to explore pricing plans", null, "Allocated page does not state plan prices or included usage", "Current rate card and SKU-level packaging"]
      - ["Realized pricing", null, null, "List-to-realized discount is unavailable", "Bookings detail with list price, discount, credits, and effective unit price"]
      - ["Contract structure", null, null, "Commitments, renewals, and consumption floors are unavailable", "Contract duration, minimum commits, renewals, and overage terms"]
    notes: "Only the free-tier terms are explicit in the reviewed homepage text; null fields are evidence gaps, not inferred commercial terms."
    claimRefs: ["CI002"]
  - id: "TI003"
    title: "Unit economics and capital-adequacy scorecard"
    columns: ["Metric", "Public value", "Confidence", "Why it matters", "Required evidence"]
    rows:
      - ["Revenue or ARR baseline", "$100M as of May 2022 in Multiples; metric may be revenue, ARR, run-rate, or LTM", "Low", "Definition and vintage prevent a current growth baseline", "Audited monthly revenue and ARR bridge through 2026"]
      - ["Alternative revenue indication", "$50M-$100M in LeadIQ; period unspecified", "Low", "Broad range does not reconcile the May 2022 datapoint", "Accounting-period and methodology reconciliation"]
      - ["Gross margin", null, "Unavailable", "Tests cloud pass-through and support efficiency", "Gross-margin waterfall by service and cloud"]
      - ["CAC and payback", null, "Unavailable", "Determines whether growth is capital efficient", "Sales and marketing spend, new ARR, CAC, and payback by segment"]
      - ["Retention and expansion", null, "Unavailable", "Separates durable recurring growth from replacement selling", "NRR, GRR, logo churn, expansion, and concentration cohorts"]
      - ["Current cash, burn, and runway", null, "Unavailable", "Determines financing dependency and next-round timing", "Bank cash, monthly burn, debt schedule, and board-approved plan"]
    notes: "Values preserve each source's label and period; funding raised is excluded from cash and runway because cumulative financing is not liquidity on hand."
    claimRefs: ["CI004", "CI006", "CI014", "CI016"]
