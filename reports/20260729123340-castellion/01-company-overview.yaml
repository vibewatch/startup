  name: Castellion
chapter:
  number: 1
  title: Company Overview
  summary: Castelion (reported here under the user-provided company name Castellion) is a Torrance-headquartered defense manufacturer founded in November 2022 by three former SpaceX executives to build affordable hypersonic strike weapons at industrial scale. Public evidence is strong on its founding story, funding chronology, Blackbeard program milestones, New Mexico manufacturing expansion, and Navy/Army traction, but materially weaker on exact headcount, revenue, customer concentration, and audited production economics. The strongest adverse context is community and environmental opposition around Project Ranger rather than corporate scandal, alongside the fact that the company remained primarily a government-funded development-stage supplier through the public record reviewed here.
sections:
- id: identity-mission-and-footprint
  title: Identity, mission, product scope, and footprint
  body: 'Castelion describes itself as a defense technology and manufacturing company built to restore America’s ability to field advanced strike systems quickly, affordably, and at scale. The company’s own launch materials say it was founded in November 2022 and came out of stealth in October 2023 with an explicit focus on rapid development and mass manufacturing of complex defense systems. The core product thesis is unusually consistent across the home page, stealth-exit announcement, Series A, and Series B materials: Castelion wants to make hypersonic and long-range strike weapons manufacturable in quantity rather than exquisite boutique systems produced in low volumes. Blackbeard is presented as the company’s first weapon system and the anchor for later Army, Navy, and maritime-launch milestones. Public facility evidence also shows a real, expanding physical footprint rather than a software-only shell. Castelion’s official materials place headquarters in Torrance, California, note a
    90,000-square-foot headquarters expansion in April 2025, and describe manufacturing operations in California, Texas, and New Mexico plus a Washington, D.C. office. The careers page corroborates a multi-site operating model with active recruiting in Torrance, Rio Rancho, Midland, Allen, and Washington, D.C., but it does not publish an exact employee count or org chart. That leaves the company’s identity and footprint well supported, while exact scale metrics remain under-disclosed.'
