  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee structure, investor rights, and founder ownership percentages.
    whyItMatters: Formal governance and control rights affect underwriting of founder dependence, downside protection, and strategic flexibility.
    diligencePath: Request a current board list, charter set, and cap-table summary under NDA.
    relatedQuestionRefs:
    - QO009
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: material
    topic: financial disclosure
    missingEvidence: Revenue, bookings, gross margin, and cash-burn disclosures.
    whyItMatters: Funding strength does not answer whether the business can convert contracts into healthy unit economics or self-sustaining production.
    diligencePath: Request management financial KPIs, audited statements or board materials, and funded backlog by contract.
    relatedQuestionRefs:
    - QO015
  - type: missing-source
    severity: material
    topic: headcount and customers
    missingEvidence: Canonical employee count, customer concentration, and named buying-agency breakdown.
    whyItMatters: Site growth and job projections do not reveal organizational capacity or concentration risk across government programs.
    diligencePath: Request an org-level headcount report and top-customer concentration schedule.
    relatedQuestionRefs:
    - QO016
    - QO017
    relatedTableRefs:
    - TO003
  - type: conflicting-data
    severity: minor
    topic: total capital and valuation
    missingEvidence: Company-confirmed cumulative capital and valuation table reconciling disclosed rounds with third-party valuation reports.
    whyItMatters: Different public sources round total funding differently and the company itself does not publish valuation in its Series B release.
    diligencePath: Request the company’s financing chronology with post-money values and any debt still outstanding.
    relatedQuestionRefs:
    - QO011
    - QO012
  - type: private-evidence-only
    severity: material
    topic: project ranger permitting
    missingEvidence: Published safety studies, environmental reviews, and water-use documentation for Project Ranger.
    whyItMatters: The manufacturing thesis depends on Project Ranger scaling smoothly, but community opposition and permitting friction could delay operations.
    diligencePath: Review county, city, and state permit filings plus any third-party safety and environmental studies.
    relatedQuestionRefs:
    - QO023
    - QO025
    relatedTableRefs:
    - TO004
