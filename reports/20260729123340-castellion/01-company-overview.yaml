- id: capital-formation-and-government-traction
  title: Capital formation, investor base, and government traction
  body: Capital formation is unusually well documented for a private defense manufacturer. Castelion exited stealth with $14.2 million of initial funding in October 2023, then announced a $100 million January 2025 financing composed of a $70 million Series A led by Lightspeed plus $30 million of Silicon Valley Bank venture debt. In December 2025 it raised a $350 million Series B led by Altimeter Capital and Lightspeed, with Andreessen Horowitz, Lavrock, General Catalyst, First In, Space VC, Cantos, BlueYard, Avenir, Champion Hill, and Interlagos participating. On a strictly disclosed basis that yields about $464.2 million of cumulative capital across seed, Series A, debt, and Series B. Independent reporting is directionally consistent, with Forbes saying the company had raised $450 million from investors and was valued at $2.8 billion after the Series B. Public contract traction is also substantial enough to matter in a company-overview chapter. Official materials state Castelion had active
    Navy, Air Force, and Army contracts by January 2025; later announcements show October 2025 Army and Navy integration awards, a February 2026 $49.998 million Navy contract, an April 2026 $105 million Navy contract, a May 2026 production framework agreement, and a June 2026 $23.4 million delivery order for 50 pre-production Blackbeard missiles. Forbes goes further and says the company had secured more than $100 million in military contracts by December 2025. The capital stack and government-customer path are therefore much clearer than revenue recognition, margin profile, or customer concentration.
