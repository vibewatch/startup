chapter:
  number: 2
  title: Market Analysis
summary: 'Castelion''s real operating market is narrower and more investable than a generic “defense tech” label: it sits inside precision-guided munitions, emerging hypersonic strike weapons, and the Pentagon''s new affordable-mass missile push. Third-party market reports bracket those layers at roughly $61.1 billion for the broader global missile market in 2024, $47.2 billion for global precision-guided munitions in 2026, and $6.56 billion for the global hypersonic-missile segment in 2026, while official U.S. demand signals are more concrete than abstract TAM: the Department of War is pursuing 10,000 low-cost cruise missiles, more than 12,000 Blackbeard missiles over five years, and a rising mix of low-cost munitions in the FY2027–FY2031 portfolio. The market tailwinds are real—rearmament, allied spending, acquisition reform, and industrial-base capital formation—but adoption still depends on appropriations durability, testing/qualification speed, and fragile supply chains for rare earths,
  motors, energetics, and advanced manufacturing inputs.'
sections:
- id: market-boundary-and-substitutes
  title: Market boundary, included spend, and substitutes
  body: 'Castelion should be underwritten against a tightly defined market boundary rather than a catch-all “defense AI” or “autonomy” narrative. Public company materials, Army fires doctrine pages, and Army budget reporting all place the business inside long-range precision fires and strike munitions, with Blackbeard framed as a low-cost hypersonic strike weapon that can fit Army and Navy launch concepts. Included spend therefore covers weapon design, flight testing, integration, launch compatibility work, energetics and propulsion, guidance and seekers, production tooling, and recurring munition procurement. It also includes the enabling industrial base—solid rocket motors, critical minerals, advanced manufacturing qualification, and surge-capacity investments—because those inputs are part of the buyer''s real purchase decision in a wartime-footing market. Excluded spend includes generic defense software, unrelated autonomous systems, and broad aerospace manufacturing categories that do
    not convert into precision-strike inventories. The nearest substitutes are existing high-end missiles and other long-range fires programs that deliver similar operational effects at higher cost or lower manufacturing throughput. CSIS, Breaking Defense, and the Department of War all point to the same structural thesis: the relevant competition is not whether militaries want strike systems at all, but which suppliers can deliver enough affordable magazine depth quickly enough to matter in a protracted conflict.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
