- id: TM004
  title: Growth drivers and adoption constraints
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for Castellion
  - Diligence ask
  rows:
  - - Pentagon shift toward a “high-low mix” and affordable mass
    - Growth driver
    - Current and rising through FY2031
    - Favors suppliers that can deliver enough missiles at much lower unit cost than exquisite incumbents
    - Map Blackbeard unit-cost targets versus relevant Army/Navy alternatives
  - - Explicit Blackbeard demand signal (500+/year minimum after validation; 12,000 over five years sought)
    - Growth driver
    - Near-term, contingent on validation
    - Creates unusually concrete pull for a startup manufacturer
    - Request terms, off-ramps, and appropriation dependencies under the framework
  - - Multi-year procurement and economic-order-quantity authorities
    - Growth driver
    - Current legislative / policy window
    - Improves supplier willingness to invest in lines and tooling
    - Check whether Castelion receives the same authority depth as large primes
  - - Allied rearmament and FMS growth
    - Growth driver
    - Current and medium-term
    - Can widen the market once U.S. qualification is complete
    - Request exportability and ITAR roadmap by subsystem
  - - Robotic automation and advanced-manufacturing qualification support
    - Growth driver
    - Current and medium-term
    - Supports faster, cheaper domestic output if part qualification is accepted
    - Review qualification path for 3D-printed or automated processes in Blackbeard production
  - - Long manufacturing lead times for key munitions (25-51 months in CSIS review)
    - Constraint
    - Current
    - Suggests demand does not automatically equal inventory; bottlenecks can delay revenue realization
    - Obtain component-level lead-time map for motors, seekers, electronics, energetics, and containers
  - - Compliance and contracting burden
    - Constraint
    - Current
    - Can slow onboarding of nontraditional suppliers and absorb management bandwidth
    - Assess cost-accounting, cybersecurity, quality, and earned-value burdens likely to emerge at scale
  - - Rare-earth and critical-mineral dependence on China
    - Constraint
    - Current but improving slowly
    - Threatens magnets, electronics, and thermal-component supply assurance
    - Identify China-exposed inputs and alternate domestic/allied suppliers
  - - Testing, qualification, and integration gates
    - Constraint
    - Current and persistent
    - Program-of-record conversion depends on surviving technical gates rather than just winning attention
    - Request schedule risk register for launcher, aircraft, and maritime integration milestones
  - - Factory siting and community/permitting friction
    - Constraint
    - Current and local
    - Scaled manufacturing can be delayed by local opposition or permitting gaps even with demand in hand
    - Review Project Ranger permits, safety studies, and contingency capacity outside New Mexico
  notes: Direction is qualitative relative to Castelion's adoption curve. Several “drivers” are only valuable if appropriations persist and technical validation is completed on schedule.
