- id: growth-drivers-and-adoption-constraints
  title: Growth drivers and adoption constraints
  body: The growth case rests on a converging set of official demand and industrial-policy signals. Global military spending continues to rise, NATO spending is still climbing, munitions obligations are materially above prior-decade levels, and Congress is explicitly backing multi-year procurement, robotic automation, and advanced-manufacturing qualification for munitions. The Pentagon and industry are also aligning on a “high-low mix” in which cheaper, faster-to-build weapons complement exquisite legacy systems. But the same sources also show why execution remains hard. CSIS says several critical munitions still require 25 to 51 months of manufacturing lead time; NDIA survey results show contracting-compliance burden rose sharply as a private-sector concern; and rare-earth processing remains structurally exposed to China even as public investment accelerates. Supply-chain bottlenecks, test-range throughput, qualification delays, and the need for durable appropriations can all slow adoption
    even when strategic appetite is obvious. For Castelion specifically, manufacturing-capacity expansion is a competitive asset only if the company can convert political demand signals into validated, budget-backed deliveries without being derailed by component scarcity, site friction, or changing program priorities.
