  - TM001
- id: sizing-lenses-and-budget-signals
  title: TAM, SAM, and procurement-demand lenses
  body: 'The top-down market can be triangulated, but the most decision-useful lens for Castelion is official procurement demand rather than a single research-firm TAM. Grand View Research sizes the broader global missile market at $61.05 billion in 2024, growing to $93.56 billion by 2030, while The Business Research Company sizes global precision-guided munitions at $47.21 billion in 2026 and Fortune Business Insights sizes the narrower hypersonic-missile segment at $6.56 billion in 2026. Those figures are directionally helpful but not directly additive because each source uses a different perimeter. A more proximate serviceable market emerges from budget and framework announcements: CSIS says the Pentagon is shifting from 49% low-cost munitions mix in FY2027 to more than 70% by FY2031, the Department of War announced a 10,000-unit low-cost cruise-missile initiative for 2027–2029, and both the Department and CSIS describe a path to buying more than 12,000 Blackbeard missiles over five years.
    In other words, Castelion''s addressable market is best understood as a slice of a very large missile-and-munitions economy that is being reweighted toward affordable, scalable, rapidly producible systems. That makes programmatic demand signals and unit-cost targets more important than any one global-industry CAGR.'
