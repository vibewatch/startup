tables:
- id: TM001
  title: Market definition and boundary
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Castellion
  rows:
  - - Precision-guided strike munitions
    - Guided missiles, launch integration, seekers, propulsion, warheads, software-in-the-loop test, recurring procurement
    - Generic defense software, ISR-only systems, unguided munitions
    - U.S. services, allied ministries of defense, appropriators
    - Primary outer market; Castelion competes on strike-effect delivery and cost curve
  - - Hypersonic strike weapons
    - Boost, airframe, thermal protection, guidance, validation, production tooling, recurring missile buys
    - Strategic nuclear systems and non-strike hypersonic science programs
    - Army, Navy, OSD / DoW, selected allies
    - Immediate product segment for Blackbeard and related launch concepts
  - - Affordable-mass missiles / “high-low mix” portfolios
    - Low-cost cruise or hypersonic missiles, containerized launch concepts, magazine-depth procurement
    - Exquisite boutique missiles purchased only in low volumes
    - DoW framework offices, service weapons executives
    - Fastest-moving adjacent segment and the clearest demand-shaping policy trend
  - - Industrial-base enablers
    - Solid rocket motors, rare earth magnets, energetics, additive manufacturing, robotics, surge-capacity capex
    - Civilian advanced manufacturing without defense qualification
    - Prime and sub-tier suppliers; government industrial-base funds
    - Critical enabling layer because supply-chain resilience affects whether procurement can scale
  - - Status-quo substitutes
    - Legacy long-range fires, incumbent missile families, slower prime-led development cycles
    - Non-kinetic tools that do not provide comparable strike effects
    - Army/Navy program offices using existing programs of record
    - Baseline alternative Castelion must displace on cost, speed, and volume rather than on existence of demand
  notes: Boundary intentionally excludes broad “defense tech” adjacency and focuses only on spend that can plausibly convert into Blackbeard-class program revenue or required production inputs.
