- id: TM003
  title: Buyer and segment map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Budget owner / workflow
  - Adoption trigger
  - Adoption path
  rows:
  - - Army long-range fires / HX3 path
    - Army modernization and PAE Fires
    - Army fires units and joint commanders
    - Army procurement appropriations
    - Requirement approval -> PAE Fires -> prototype demo -> HIMARS/CAML flight tests -> budget authority
    - Need for cheaper deep-strike capability with meaningful PrSM-like effects
    - Competitive prototyping and integration before any scaled buy
  - - Navy Blackbeard integration and strike demand
    - Naval aviation / strike program offices
    - Carrier air wing or maritime strike operators
    - Navy weapons accounts
    - Aircraft or launcher integration -> flight test -> certification -> contract order
    - Need for lower-cost, survivable strike inventory depth
    - Integration and validation gate production orders
  - - Department of War affordable-mass framework
    - DoW acquisition and R&E / A&S leadership
    - Joint Force
    - Department-level appropriations and service transitions
    - Framework agreement -> utility assessment -> firm-fixed-price production lots
    - Need to increase magazine depth quickly and cheaply
    - Top-down demand signal before full-rate procurement
  - - Allied / partner demand via FMS or co-production
    - Foreign ministries of defense with U.S. approval channels
    - Allied forces
    - Foreign military budgets and security-cooperation mechanisms
    - U.S. validation -> technology transfer / disclosure -> FMS or direct commercial path
    - Rearmament and interoperability with U.S. strike architectures
    - Secondary market after U.S. fielding reduces program risk
  - - Industrial-base host / site-enabler segment
    - State, local, and installation authorities enabling facilities
    - Production workforce and supply-base ecosystem
    - Private capital plus public incentives or lease structures
    - Permitting / land access -> factory buildout -> qualified output
    - Desire to onshore capacity and jobs for strategic manufacturing
    - Not an end customer, but a crucial adoption enabler for scaled supply
  notes: In this market the user is rarely the direct buyer, and the buyer is rarely the sole payer. Budget control sits with program offices, departmental acquisition leaders, Congress, and in some cases allied governments.
