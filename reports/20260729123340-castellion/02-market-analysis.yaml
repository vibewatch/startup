- id: buyer-map-and-adoption-path
  title: Buyer, user, payer, and adoption path
  body: 'The buyer map is concentrated and institution-heavy. For Army demand, the user is the fires force, but the budget owner spans Army modernization, the PAE Fires construct, and congressional appropriators. For Navy demand, the user is an operational aviation or strike community, while the payer is a Navy weapons account and the adoption path runs through integration, test, and certification milestones before true production. At the departmental level, the Department of War has become a direct market shaper through framework agreements that pre-negotiate price and create a long-term demand signal before full-rate procurement. Allies and partners represent a secondary but strategically important segment, because the same industrial investments can be amortized across foreign military sales, co-production, or other security-cooperation pathways once U.S. validation is complete. The practical adoption path is therefore not a commercial sales funnel but a gated defense-procurement sequence:
    requirement definition, prototype demonstration, integration with launchers or aircraft, developmental and operational testing, appropriation-backed contract authority, then serial production. That makes Castelion''s market less about brand awareness and more about surviving bureaucratic gates faster than incumbents while still meeting cost, reliability, and supply-chain requirements.'
