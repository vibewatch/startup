  - FR003
- id: people-mitigations-and-kill-criteria
  title: People / execution risk, mitigation maturity, and thesis-break triggers
  body: 'Execution risk at Castelion is partly founder risk and partly organizational-scaling risk. The company is still young, and public materials show a leadership-centric operating model combined with aggressive hiring across avionics, embedded software, propulsion, flight test, manufacturing, logistics, and safety. That is positive because the company knows what capabilities it needs; it is risky because multiple hard-to-hire functions must scale nearly in parallel. Mitigation maturity is mixed. Official materials show large capital support, public safety hiring, repeated tests, customer traction, and factory buildout, all of which reduce existential risk versus a paper-stage startup. Yet the residual risk remains high enough that investors should define thesis-break triggers in advance: material Project Ranger delay, failed conversion from prototype to larger procurement, evidence of serious safety or compliance breakdown, or a forced financing event without corresponding production
    progress. The right investment discipline is not to avoid the company because it has risk; it is to monitor a small set of operational and program gates that can quickly reveal whether the risk is compressing or compounding.'
