- id: dependency-customer-and-financial-risk
  title: Dependency, customer, and financial/model risk
  body: 'Dependency risk shows up in three forms: counterparties, programs, and capital. Counterparty dependence includes government sponsors, platform partners, site stakeholders, and specialized suppliers. Program dependence is even starker. Public monetized proof is concentrated in a small number of Navy and AFRL/Army pathways, so the investment case can change sharply if any one program pauses, slips, or fails to convert. Financial/model risk compounds the issue. Public evidence establishes significant funding and meaningful awards, but it still does not disclose recognized revenue, burn, cash on hand, or gross margin. That means investors cannot tell whether the company is marching toward self-funding production or toward another large financing event. Venture debt adds another layer of potential pressure. The company can likely manage these risks if production conversion happens quickly; if not, customer concentration, factory capex, and financing opacity can interact in ways that
    amplify downside. In this chapter, customer and financing risks should be treated as linked rather than separate: the speed of customer conversion determines the severity of capital risk.'
  claimRefs:
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  - CR028
  - CR029
  - CR030
