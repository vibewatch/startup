evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee structure, investor rights, and founder ownership percentages.
    whyItMatters: >-
      Formal governance and control rights affect underwriting of founder dependence, downside protection, and strategic
      flexibility.
    diligencePath: Request a current board list, charter set, and cap-table summary under NDA.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: financial disclosure
    missingEvidence: Revenue, bookings, gross margin, and cash-burn disclosures.
    whyItMatters: >-
      Funding strength does not answer whether the business can convert contracts into healthy unit economics or
      self-sustaining production.
    diligencePath: Request management financial KPIs, audited statements or board materials, and funded backlog by contract.
    relatedQuestionRefs:
      - QO015
  - type: missing-source
    severity: material
    topic: headcount and customers
    missingEvidence: Canonical employee count, customer concentration, and named buying-agency breakdown.
    whyItMatters: >-
      Site growth and job projections do not reveal organizational capacity or concentration risk across government
      programs.
    diligencePath: Request an org-level headcount report and top-customer concentration schedule.
    relatedQuestionRefs:
      - QO016
      - QO017
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: total capital and valuation
    missingEvidence: >-
      Company-confirmed cumulative capital and valuation table reconciling disclosed rounds with third-party valuation
      reports.
    whyItMatters: >-
      Different public sources round total funding differently and the company itself does not publish valuation in its
      Series B release.
    diligencePath: Request the company’s financing chronology with post-money values and any debt still outstanding.
    relatedQuestionRefs:
      - QO011
      - QO012
  - type: private-evidence-only
    severity: material
    topic: project ranger permitting
    missingEvidence: Published safety studies, environmental reviews, and water-use documentation for Project Ranger.
    whyItMatters: >-
      The manufacturing thesis depends on Project Ranger scaling smoothly, but community opposition and permitting
      friction could delay operations.
    diligencePath: Review county, city, and state permit filings plus any third-party safety and environmental studies.
    relatedQuestionRefs:
      - QO023
      - QO025
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: castelion-sam-som
    missingEvidence: >-
      A program-level public budget breakout showing how much of the affordable-hypersonic demand signal is actually
      allocated to Castelion versus competing lines or future options.
    whyItMatters: >-
      Without funded-line-item visibility, SAM/SOM remains directional rather than underwritten to exact revenue
      capture.
    diligencePath: >-
      Request service budget exhibits, funded backlog by program, and any internal bottoms-up production forecast under
      NDA.
    relatedQuestionRefs:
      - QM020
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Blackbeard unit cost, learning-curve assumptions, gross margin at scale, and supplier-cost waterfall.
    whyItMatters: >-
      The market thesis depends on being cheaper and faster than incumbents, but public sources do not disclose the
      actual economic proof points.
    diligencePath: >-
      Request should-cost model, target price evolution, and sensitivity analysis for key inputs such as motors,
      electronics, and energetics.
    relatedQuestionRefs:
      - QM024
      - QM025
  - type: missing-source
    severity: material
    topic: allied-demand-conversion
    missingEvidence: >-
      Named allied buyers, exportability limits, and actual FMS or direct-commercial-sales pipeline for Blackbeard-class
      systems.
    whyItMatters: >-
      Allied spending can expand the market materially, but there is no retained public evidence of a quantified
      near-term allied pipeline.
    diligencePath: Request export-control matrix, partner pipeline, and any foreign disclosure approvals in process.
    relatedQuestionRefs:
      - QM013
      - QM024
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: minor
    topic: capacity-friction
    missingEvidence: >-
      Complete Project Ranger permit package, safety studies, and contingency capacity plans if local frictions delay
      New Mexico output.
    whyItMatters: Market demand only converts if manufacturing sites can scale without interruption.
    diligencePath: Review county and state filings plus alternate-capacity planning for Texas and California sites.
    relatedQuestionRefs:
      - QM021
      - QM022
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: head-to-head-pricing
    missingEvidence: Vendor-specific realized pricing for Blackbeard versus PrSM, Barracuda, GHOST, Rusty Dagger, or Leidos LCCM.
    whyItMatters: >-
      Competitive underwriting depends on whether Castelion is truly cheaper on delivered mission effect, not just
      cheaper in rhetoric.
    diligencePath: Request proposal pricing, should-cost comparisons, and any government cost-comparison work under NDA.
    relatedQuestionRefs:
      - QP017
      - QP024
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: win-rates-and-pipeline
    missingEvidence: >-
      Actual competitive win/loss data, repeat-order rates, and buyer-by-buyer pipeline status versus incumbents and
      entrant peers.
    whyItMatters: A credible wedge is not yet the same thing as a durable moat or repeatable sales machine.
    diligencePath: Review internal CRM or program pipeline by agency, platform, and stage.
    relatedQuestionRefs:
      - QP019
      - QP024
  - type: missing-source
    severity: material
    topic: qualification-comparison
    missingEvidence: Comparable test/qualification maturity across Blackbeard and key entrant alternatives.
