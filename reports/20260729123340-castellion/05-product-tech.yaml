- id: architecture-and-manufacturing-stack
  title: Architecture, subsystems, and manufacturing stack
  body: 'Castelion''s technical architecture appears intentionally vertically integrated. Official timeline and funding releases say the company developed its own solid rocket motor production capability, first mixed propellant in 2023, first fired a 12-inch internal motor in 2023, produced its first flight computer in-house in 2024, and validated subsystems including solid rocket motors, control actuation systems, flight computers, seekers, thermal protection materials, and mission software across 20-plus 2025 development flights. Reporting around Blackbeard GL adds additional architectural detail: a two-stage solid-fueled design, modified munition-pod compatibility, and a seeker-based precision-strike concept intended to fit existing fires workflows at lower cost than exquisite alternatives. Manufacturing architecture is equally central to the product. Project Ranger is designed to produce solid rocket motors, run static tests, and complete final assembly across a 1,000-acre campus with
    21 planned buildings; official and local reporting frame it as the physical backbone for scaling Blackbeard from prototypes into thousands of missiles per year. Careers signals further support the vertical-integration thesis: open roles span avionics reliability, embedded software, radar algorithms, FPGA, flight computers, manufacturing engineering, tooling automation, propulsion, warhead design, logistics, and EHS. That breadth suggests the company is building a full-stack hardware organization rather than outsourcing core weapon-system functions.'
