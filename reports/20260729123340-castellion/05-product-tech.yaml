  title: Product & Technology
summary: Castelion's product is not a single missile SKU but an integrated strike-system stack built around Blackbeard, a long-range hypersonic weapon family being matured across air- and ground-launch pathways. Public evidence shows a vertically integrated technical model spanning solid rocket motor manufacture, flight computers, seekers, mission software, integration hardware, test infrastructure, and a dedicated 1,000-acre New Mexico production campus. The product workflow begins with government requirements and platform integration, then moves through internal component manufacture, static-fire and flight-test loops, and finally to operational prototype delivery. Differentiation rests on rapid iteration, in-house subsystem ownership, and manufacturing-for-scale rather than on exquisite single-round performance alone. Product maturity is meaningful—20+ developmental flights, Navy prototype contracts, June 2026 pre-production deliveries, and Army HX3/HIMARS plans—but still short of fully
  proven, broad operational deployment. Public trust and quality controls appear stronger in safety hiring and test discipline than in externally disclosed certifications, leaving material diligence gaps around formal quality systems, cyber assurance, and supplier redundancy.
sections:
- id: product-definition-and-workflow
  title: Product definition and customer workflow
  body: 'From a customer point of view, Castelion delivers an affordable-hypersonic strike capability rather than a standalone component. The product family centers on Blackbeard, which public sources describe as Castelion''s first weapon system and frame in multiple operational forms: an air-launched weapon for Navy and potentially other tactical aircraft, a ground-launched Blackbeard GL variant for Army HX3 and HIMARS-adjacent launchers, and a maritime-launch pathway demonstrated with Saronic. The workflow is therefore mission-driven. A government user or sponsor defines an operational need—cheap long-range precision strike against moving or hardened targets—then Castelion integrates the round onto a relevant platform, manufactures major subsystems internally, runs developmental test loops, and delivers early operational capability prototypes under government contract. Official releases show the sequence clearly: early SBIR work, propulsion maturation, internal flight-computer development,
    more than 20 developmental flight tests, Navy development awards, integration contracts for Army and Navy platforms, and a June 2026 delivery order for 50 pre-production Blackbeard rounds. Product delivery is inseparable from system integration and test support, so the buyer workflow includes launcher or aircraft compatibility, range safety, telemetry, and platform-specific software integration rather than a simple catalog purchase.'
