    layout: standard
    slug: investment-kpis
    title: 投资 KPI
    summary: 基于公开锚点估值的 Castelion 投委会式评分卡。
    approximationNotes: 分数是最新已知价格锚点下的 0-10 可投资性评分，不是绝对公司质量评分。
    data:
      items:
        - label: 市场机会
          score: 9
          detail: 需求和政策逻辑异常强。
        - label: 客户证据
          score: 7
          detail: 真实政府证据存在，但覆盖面有限。
        - label: 产品 / 护城河
          score: 8
          detail: 垂直整合加 Project Ranger 可能很关键。
        - label: 经济性可见度
          score: 3
          detail: 收入、利润率和资金跑道披露仍不足。
        - label: 融资韧性
          score: 6
          detail: 已融大额资本，但当前现金与债务细节仍属私下信息。
        - label: 执行风险
          score: 3
          detail: 工厂和转化风险仍高。
        - label: 估值支撑
          score: 4
          detail: 锚点说得通，但谈不上明显便宜。
        - label: 证据质量
          score: 5
          detail: 战略和证据较强，投资测算输入偏弱。
        - label: 退出就绪度
          score: 3
          detail: 仅凭公开证据看，尚未达到 IPO 就绪。
    claimRefs:
      - CV003
      - CV008
      - CV015
      - CV031
      - CV032
      - CV040
