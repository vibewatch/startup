              在传统厂商中，Lockheed Martin 是最清楚的 Army 侧基准，因为 PrSM 已是成熟、面向列装的远程精确打击项目；在 Milestone C 批准和作战使用后，Lockheed 明确正在扩张
              PrSM 产能。RTX 的 Tomahawk 和 Lockheed 的 LRASM 是不同产品，但很重要，因为它们定义了 Navy 和联合预算中已验证远程打击的样子。Northrop 和 L3Harris 并不是
              Blackbeard 的一对一镜像，但依然强大，因为推进、材料、发动机、航电和战斗部能力都可能卡住整个市场。在新进入者中，Leidos 已披露一条初始 3,000 枚 LCCM 路径；CoAspire
              正推动其增材制造 GHOST 导弹；Zone 5 借助 Rusty Dagger 传承和 350 多人团队；Anduril 用 Barracuda 证明更便宜的武器可以规模化制造；Ursa Major 则把
              HAVOC 定位为可负担的大规模高超音速，声称避开其他设计方法的一部分热管理和成本负担。因此，Castelion 的竞争一部分在技术能力，更同样取决于其具体产品能否落在价格、生产速度和生存能力之间的正确位置。
