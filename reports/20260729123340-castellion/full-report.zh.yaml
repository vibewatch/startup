  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              从客户视角看，Castelion 交付的是一种可负担高超音速打击能力，而不是独立组件。产品家族围绕 Blackbeard 展开；公开来源将其描述为 Castelion 的首个武器系统，并在多个作战形态中呈现：面向
              Navy 和潜在其他战术飞机的空射武器、面向 Army HX3 和 HIMARS 邻近发射器的陆射 Blackbeard GL 变体，以及与 Saronic
              演示过的海上发射路径。因此，工作流由任务驱动。政府用户或资助方定义作战需求——以低成本远程精确打击移动或加固目标——然后 Castelion
              将弹体集成到相关平台，内部制造主要子系统，跑发展性测试循环，并按政府合同交付早期作战能力原型。官方公告清楚显示了这一路径：早期 SBIR 工作、推进成熟、内部飞控计算机开发、超过 20 次发展性飞行测试、Navy
              开发奖项、Army 和 Navy 平台集成合同，以及 2026 年 6 月 50 枚预生产 Blackbeard
              弹体交付订单。产品交付离不开系统集成和测试支持，因此买方工作流包括发射器或飞机兼容性、靶场安全、遥测和平台特定软件集成，而不是简单目录采购。
