companyProfile:
  summary: >-
    Castellion 是一家美国防务科技公司，成立于 2022 年，目标是打造价格可负担、可大规模制造的高超音速打击系统。公开证据集中在其 Blackbeard 武器家族、快速测试与集成节奏，以及位于 New Mexico 的
    Project Ranger 制造园区。公司已从 AFRL 支持的早期工作推进到 Navy 开发合同，并在 2026 年 6 月获得预生产交付订单；但在财务和客户耐久性细节上，披露仍远少于投资人做精确定价所需。
