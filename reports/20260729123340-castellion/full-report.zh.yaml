      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              增长逻辑建立在一组正在汇聚的官方需求和产业政策信号上。全球军费继续上升，NATO 支出仍在增长，弹药义务显著高于过去十年水平，国会也明确支持弹药的多年采购、机器人自动化和先进制造认证。Pentagon
              与产业界还在围绕“high-low mix”对齐：更便宜、建造更快的武器补充精致的传统系统。但同一批来源也说明执行为什么仍然困难。CSIS 称，若干关键弹药仍需要 25 到 51 个月制造提前期；NDIA
              调查结果显示，合同合规负担作为私营部门担忧急剧上升；即使公共投资加速，稀土加工仍结构性暴露于中国。即便战略需求明显，供应链瓶颈、试验场吞吐、认证延迟和持续拨款需求都可能拖慢采用。对 Castelion
              而言，只有公司能把政治需求信号转成经过验证、预算支持的交付，并且不被零部件短缺、场地摩擦或项目优先级变化拖偏，制造产能扩张才是竞争资产。
