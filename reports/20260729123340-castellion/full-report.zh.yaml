            body: >-
              Castelion
              的运营逻辑很有力，也很残酷：公司必须证明快速迭代能变成可重复生产。公开来源显示，公司在垂直整合发动机、飞控计算机、任务软件和制造基础设施；同一组选择也把质量、良率和进度风险集中到公司内部。Project
              Ranger 计划在一个多建筑大型园区内生产发动机、做静态测试并完成总装，因此建设、公用工程、招聘、许可、安全验证或工艺认证任何一环延误，都可能拖慢整家公司。产品成熟度也仍处在过渡期。Blackbeard
              已经越过概念阶段并拿到预生产订单，但保留下来的公开证据没有披露生产良率、报废率、批次验收结果、货架寿命验证或现场可靠性。静态点火和飞行测试节奏是优势，也说明项目仍有相当部分依赖技术证明。落到执行层面，最大的运营风险不是公司没有计划；而是子系统成熟、工厂投产、供应商韧性和平台集成这几项相互依赖的计划，都必须在激进时间表上同时跑通。
