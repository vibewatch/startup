  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入流、变现逻辑与确认口径提醒
        blocks:
          - type: paragraph
            body: >-
              Castelion 的收入模型以政府项目为中心，应把它视作合同驱动的硬件商业化，而不是订阅软件或简单产品销售业务。公开证据指向四层变现：资助设计、测试和集成工作的研发合同；规模更大或带期权的 Navy
              开发合同；面向早期作战能力的预生产交付订单；以及如果 Blackbeard 通过测试和验证，未来进入多年生产采购的路径。公司自己的公告也支持这一顺序：融资与测试周期、集成里程碑和制造扩张相配，而不是与已披露收入
              KPI 相配。USAspending
              和公司公告给出合同金额，但不应把这些金额误认为已确认收入，因为防务合同可能包含期权、里程碑时间和交付物，收入会随时间转化，而不是在授标日一次性确认。最强的公开信号是，业务已远远超出纯 R&D
              概念资助；但公开记录仍没有揭示，已入账合同基础中到底有多少流入了利润表。
