      - number: '6.4'
        title: 扩张路径、采购摩擦与承保结论
        blocks:
          - type: paragraph
            body: >-
              从买方类型、作战域和项目阶段看，扩张都有可能，但每条路径都要穿过采购摩擦。Navy 扩张可能意味着预生产原型验证后进入更大批次。Army 扩张可能来自 HX3 和 CAML 测试把 Blackbeard GL
              转化为获得资金支持的火力项目。海上扩张可能发生在 Saronic 的 Marauder 演示为海军客户创造新的分布式发射概念之后。更长期看，AFRL 或其他 Air Force
              路径可能继续支持开发或转化工作。然而，非美国客户、出口客户或私营部门渠道的公开证据缺席。采购摩擦也是增长模型绕不开的一部分：靶场批准、测试成功、平台集成、期权行使、预算周期和多年授权，都会调节客户扩张。正确的承保视角因此是：Castelion
              的客户章节在具名美国防务验证上强，在重复推进信号上中等，在广泛多元化或已披露留存经济性上弱。公司有真实客户拉力，但还没有成熟防务主承包商那样的公开客户广度或队列披露。
