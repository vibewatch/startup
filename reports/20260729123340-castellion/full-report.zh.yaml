  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代品
        blocks:
          - type: paragraph
            body: >-
              评估 Castelion 时，应采用严格定义的市场边界，而不是笼统套上“defense AI”或“autonomy”叙事。公司公开材料、Army 火力条令页面和 Army
              预算报告，都把业务放在远程精确火力和打击弹药里；Blackbeard 被框定为低成本高超音速打击武器，可适配 Army 和 Navy
              的发射概念。因此，纳入支出包括武器设计、飞行测试、集成、发射兼容性工作、含能材料和推进、制导和导引头、生产工装，以及经常性弹药采购。它还包括支撑性工业基础——固体火箭发动机、关键矿物、先进制造认证和激增产能投资——因为在战时化市场里，这些投入是买方真实采购决策的一部分。排除支出包括通用防务软件、无关自主系统，以及无法转化为精确打击库存的宽泛航天制造类别。最近的替代品是现有高端导弹和其他远程火力项目，它们以更高成本或更低制造吞吐实现类似作战效果。CSIS、Breaking
              Defense 和 Department of War 都指向同一个结构性论点：真正的竞争不是军队是否需要打击系统，而是哪家供应商能足够快地交付足够多、足够可负担的弹药深度，在持久冲突中产生影响。
