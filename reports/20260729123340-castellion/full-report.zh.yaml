      - number: '8.2'
        title: 当前估值背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              公开融资锚点是 2025 年 $350M B 轮对应的约 $2.8B 估值；计入种子轮和 A 轮后，累计已披露资本约 $464.2M。这个锚点有参考价值，但本身不够。2026
              年，国防领域公开创投市场明显上移：Shield AI 以 $12.7B 融资，Anduril 以 $61B 融资，之后又有报道称 Anduril 可能在讨论 $100B
              估值。这些数字说明，只要国防平台有真实增长和项目证明，投资人愿意支付巨大溢价。Castelion
              比这些龙头便宜，但披露的规模证据也少得多。上市主承包商给出相反参照。Lockheed、Northrop、General Dynamics 和 Leidos
              的企业价值达数百亿美元，由公开市值、申报文件和经营历史支撑。与这些公司相比，Castelion
              当前私人估值锚点在绝对值上很小；但若按其仍未公开的自身经济性衡量，又非常大。因此入场纪律很关键。在生产转化、定价和利润率能见度提高之前，公司更应被当作押注国防工业转型的高上行、高波动期权，而不是已去风险的新一代主承包商。
