      - number: '4.3'
        title: 资本充足性、融资依赖与项目融资姿态
        blocks:
          - type: paragraph
            body: >-
              资本充足性是本章最清楚的“是，也不是”：是，Castelion 已筹集足够已披露资本，能建设真实设施并赢得有意义合同；不是，公开记录仍过于稀疏，无法精确显示账上现金、月度烧钱或跑道。Series A 和
              venture debt 明确用于加快测试、建设大规模生产设施和完成首次高超音速演示。Series B 明确绑定 Blackbeard 集成、Project Ranger 工装与爬坡，以及 2026
              年多军种测试。Project Ranger 本身是一项超过 $220 million 的私营投资，计划到 2026 年底建成 21 栋建筑，凸显模式的资产重量。Silicon Valley Bank 的
              venture debt 给资本栈增加了非股权义务；尽管地方激励和工业收入债结构可能缓和项目经济性，它们并不能替代经营现金生成。最审慎的解读是，资本获取仍具战略意义：即便 Series B
              之后，公司也可能仍要在广泛生产经济性被证明之前，同时为产品成熟、工厂建设、员工扩张和认证活动提供资金。
