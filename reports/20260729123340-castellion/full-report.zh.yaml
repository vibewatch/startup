      - number: '7.4'
        title: 人员 / 执行风险、缓释成熟度与投资论点破裂触发点
        blocks:
          - type: paragraph
            body: >-
              Castelion
              的执行风险，一部分是创始人风险，一部分是组织规模化风险。公司仍年轻，公开材料显示其运营模式以领导层为中心，同时在航电、嵌入式软件、推进、飞行测试、制造、物流和安全等方向激进招聘。这是好事，因为公司知道自己需要哪些能力；也是风险，因为多个难招职能几乎要并行扩张。缓释成熟度参差不齐。官方材料显示，公司有大额资本支持、公开安全岗位、反复测试、客户牵引和工厂建设；相较纸面阶段初创，这些都降低了生存风险。但残余风险仍高，投资人应提前定义投资论点破裂触发点：Project
              Ranger
              出现重大延误、原型无法转化为更大采购、出现严重安全或合规崩盘证据，或在没有匹配生产进展时被迫融资。正确的投资纪律，不是因为公司有风险就回避；而是盯住少数运营和项目关口，它们能快速显示风险是在收缩还是叠加。
