      - number: '2.2'
        title: TAM、SAM 与采购需求视角
        blocks:
          - type: paragraph
            body: >-
              自上而下的市场可以三角测算，但对 Castelion 最有决策价值的视角不是单一研究机构的 TAM，而是官方采购需求。Grand View Research 估算，全球导弹市场 2024 年为 $61.05
              billion，到 2030 年增长至 $93.56 billion；The Business Research Company 估算，全球精确制导弹药 2026 年为 $47.21
              billion；Fortune Business Insights 则估算，更窄的高超音速导弹细分市场 2026 年为 $6.56
              billion。这些数字方向上有用，但不能直接相加，因为各来源的边界不同。更贴近业务的可服务市场来自预算和框架公告：CSIS 称 Pentagon 正把 FY2027 低成本弹药组合占比从 49% 提升到
              FY2031 的超过 70%；Department of War 宣布 2027–2029 年 10,000 枚低成本巡航导弹计划；Department 和 CSIS 都描述了一条五年采购超过 12,000 枚
              Blackbeard 导弹的路径。换句话说，Castelion
              的可触达市场最好理解为庞大导弹与弹药经济中的一块份额，而这个经济正在向可负担、可扩展、可快速生产的系统重新加权。因此，项目化需求信号和单位成本目标，比任何一个全球行业 CAGR 更重要。
