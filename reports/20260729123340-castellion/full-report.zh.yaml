      - number: '8.4'
        title: 投资建议、退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              投资建议：跟踪 /
              继续研究，不是自动放弃，也不是盲目买入。信心为中等，因为战略论点很强，但估值证据不完整。风险评级高，因为接下来几个驱动价值的步骤——工厂就绪、客户转化、单位经济披露——仍未解决。估值立场要有纪律：如果私下尽调显示已签积压订单、收入转化和利润率轨迹强于外部来源所见，公开锚点可以合理；但仅凭公开证据，它并不明显便宜。退出准备度有限。公司叙事有吸引力，也有真实需求信号，但从披露角度看尚未达到
              IPO 准备状态；相比近期公开上市，它更适合被视为后期私募融资、战略合作或最终被主承包商收购的候选。最终尽调问题因此很具体：合同族收入转化、按批次的利润率、Project Ranger
              投产状态、当前现金和债务条款，以及海军和陆军项目从原型走向规模化采购的具体门槛。
