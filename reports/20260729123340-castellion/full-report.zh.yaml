            body: >-
              公开采用证据最好理解为从赞助 R&D 到集成工作、再到早期预生产交付的分步推进。AFRL/USAF 关系锚定漏斗左侧：about-us 时间线提到 2023 年首个 AFRL direct-to-Phase-2
              SBIR；独立 SBIR 和合同数据库则显示，一个面向低成本、高可制造性远程打击武器生产的 FOCUS Phase II 奖项。Navy 关系是采用曲线推进的最强证据。官方和监管记录显示，2026 年 2
              月获得原型开发奖项，2026 年 4 月行使期权使同一合同线超过 $100 million，2026 年 6 月又获得 50 枚预生产 Blackbeard 原型及容器交付订单。Army
              采用证据更早期一些，但仍有意义；Blackbeard GL 在 FY2026 规划和行业报道中，作为 CAML/HIMARS
              相关测试的候选弹药出现。结果是一条令人信服的公开故事：客户承诺正在增强，但它仍扎根于试点、原型和预生产，而不是广泛舰队部署，或多个机构披露的多年重复采购。
