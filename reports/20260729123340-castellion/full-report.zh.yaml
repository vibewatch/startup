        title: 财务结论、收入质量与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              财务结论：Castelion
              比典型早期防务初创公司资本更充足、合同验证更强，但对高置信收入或利润率承保来说仍过于不透明。收入质量看起来集中在美国政府开发和采购路径上，这对买方质量是正面，但对集中度、时间和拨款暴露是负面。最强的不利财务事实不是已披露的未达标或违约，而是投资人最需要的一组数字缺席：已确认收入、毛利率、营运资本需求、积压订单转化时间、烧钱和当前现金。合同热度与经济证明之间还存在细微的时间错配。公开来源显示真实合同金额和可信生产路线图，但外部报道在大额
              Series B 之后仍将公司描述为尚未进入全面规模化生产。除非管理层披露，或在 NDA
              下分享合同奖项如何转化为交付、利润率和现金，否则应把公司建模为一个有前景但仍依赖资本的制造项目，而不是迷你版、已去风险的防务主承包商。
