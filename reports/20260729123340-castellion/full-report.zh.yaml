      - number: '7.3'
        title: 依赖、客户与财务 / 模型风险
        blocks:
          - type: paragraph
            body: >-
              依赖风险有三种形态：交易对手、项目和资本。交易对手依赖包括政府资助方、平台伙伴、场地利益相关方和专业供应商。项目依赖更尖锐。公开、可货币化的证明集中在少数海军和 AFRL / 陆军
              路径上，任何一个项目暂停、延期或无法转化，投资逻辑都可能剧烈改变。财务 /
              模型风险又放大了问题。公开证据证明公司拿到可观融资和有意义的授奖，但仍未披露确认收入、烧钱速度、账上现金或毛利率。投资人因此看不清公司是在走向自我供血的生产，还是走向又一轮大型融资。风险债又增加一层潜在压力。如果生产转化很快，公司大概率能管理这些风险；否则，客户集中、工厂资本开支和融资不透明会相互作用，放大下行。在本章里，客户风险和融资风险应合并看待，而不是分开看：客户转化速度决定资本风险有多重。
