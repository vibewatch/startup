  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Castelion
              的投资论点很直接：公司用一套产品理念切入美国国防部最清晰的能力缺口之一——低成本规模、更快迭代、垂直整合、由工厂支撑的规模化——这与当前采购逻辑和战场逻辑一致。市场、产品和客户章节都指向同一结论。Blackbeard
              已经从概念走到反复测试、海军研发授奖和 2026 年 6 月预生产交付订单。Project Ranger
              给公司带来一项有形工业资产；如果顺利投产，它可能拓宽护城河。反论点同样清楚。公开证据仍未披露确认收入、利润率、积压订单转化、账上现金或全速生产订单。也就是说，当前锚定估值主要靠战略价值、技术动能和未来转化来支撑。投资人买的不只是一家公司，而是一串执行假设：海军路径放量、陆军路径转化、工厂爬坡、安全
              / 合规守住，利润率最终能支撑重资本开支。没有这条链，价格很快会显得偏贵。
