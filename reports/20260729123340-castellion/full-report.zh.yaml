      - number: '5.2'
        title: 架构、子系统与制造栈
        blocks:
          - type: paragraph
            body: >-
              Castelion 的技术架构看起来有意走垂直整合路线。官方时间线和融资公告称，公司开发了自有固体火箭发动机生产能力，2023 年首次混合推进剂，2023 年首次点火一台 12 英寸内部发动机，2024
              年内部生产首台飞控计算机，并在 2025 年 20 多次开发飞行中验证了固体火箭发动机、控制作动系统、飞控计算机、导引头、热防护材料和任务软件等子系统。围绕 Blackbeard GL
              的报道补充了架构细节：两级固体燃料设计、改装弹药舱兼容性，以及基于导引头的精确打击概念，意在以低于精品替代方案的成本适配既有火力工作流。制造架构同样是产品核心。Project Ranger
              被设计成一个能生产固体火箭发动机、开展静态测试并完成总装的体系，园区占地 1,000 英亩、规划 21 栋建筑；官方和地方报道都把它描述为 Blackbeard
              从原型扩展到每年数千枚导弹的物理骨架。招聘信号进一步支持垂直整合论点：开放岗位覆盖航电可靠性、嵌入式软件、雷达算法、FPGA、飞控计算机、制造工程、工装自动化、推进、战斗部设计、物流和
              EHS。这样的广度说明公司正在搭建全栈硬件组织，而不是外包核心武器系统功能。
