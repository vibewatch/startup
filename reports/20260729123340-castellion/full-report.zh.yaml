      - number: '5.3'
        title: 部署、集成、支持与路线图
        blocks:
          - type: paragraph
            body: >-
              部署以平台为中心，目前仍处于成熟阶段，而不是广泛服役阶段。公开证据显示三条主要集成路径。第一，Navy 在 2026 年 2 月和 4 月授予 Blackbeard
              合同，用于原型开发、飞行测试和早期作战能力，随后在 2026 年 6 月追加 50 枚预生产弹体及容器的交付订单。第二，Army 预算和行业报道显示，Blackbeard GL 计划用于 Project HX3
              和 CAML/HIMARS 邻近发射器，FY2026 有原型演示和最多 10 枚测试弹。第三，Castelion 与 Saronic 宣布首个同类海上高超音速发射能力，把 Blackbeard
              与自主水面舰艇平台结合。由这些来源推导出的路线图很直接：2026 年继续多军种集成，完成 Project Ranger
              建设，交付早期作战能力批次，并把成功测试结果转成更大的生产路径。不过，支持和可靠性只有部分可见。公司强调快速迭代、任务软件和高频测试；招聘页则显示正在明确招聘航电可靠性、系统集成、物流、库存和社区事务岗位。但公开材料没有披露外场可靠性率、货架寿命验证结果、平均故障间隔时间，或超出一般兼容性和制造爬坡主张的详细保障概念。
