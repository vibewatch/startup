            body: >-
              公开披露不均，使能力比较受到限制，但主要采购标准很清楚：射程和生存能力、发射平台兼容性、单位成本目标、生产就绪度，以及监管 / 客户信任。公开来源显示，Lockheed 的 PrSM 已适配 Army
              的发射器和正式项目逻辑，而 LRASM 与 Tomahawk
              位于已验证的远程打击架构内。相比之下，可负担规模进入者卖的是成本更低、制造更快的导弹，可能足以覆盖大类目标。定价证据不完整，却在战略上重要。Military Times 称 JASSM 单枚成本超过 $1.3
              million，而 Air Force 希望可负担规模导弹接近 $218,000；CSIS 保留了 Navy 可负担高超音速约 $300,000 的基准，对比 LRASM 约 $4.5
              million。Blackbeard
              的公开单价仍未披露，这本身就是竞争缺口：投资人能看见成本论点的方向，但尚未看见证明。分销也明显分化。传统厂商靠数十年客户信任、既有项目办公室和已验证供应链取胜；新进入者则通过更便宜、固定价格的批量方案和私募资本支持的产能扩张，让
