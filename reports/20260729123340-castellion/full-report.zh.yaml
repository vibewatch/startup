      - number: '1.4'
        title: 里程碑、规模主张与不利背景
        blocks:
          - type: paragraph
            body: >-
              Castelion 的里程碑节奏支持一个判断：它已不只是概念阶段初创公司，但公开记录仍要求投资人谨慎区分哪些已被证明、哪些尚未证明。官方材料显示，公司在 2023 年 5 月获得早期 AFRL SBIR
              奖项，2023 年完成内部火箭发动机点火，2024 年 3 月首次飞行，2024 年 10 月获得 Phase 3 奖项，2025 年 2 月完成首次 DoD 赞助飞行，2025 年 3 月入选 AFWERX
              STRATFI，2025 年 10 月获得 Army 和 Navy 集成合同，并在 2026 年连续获得 Navy 奖项。制造规模主张也迅速加速。Castelion 于 2025 年 11 月宣布 Project
              Ranger，随后在 2026 年 1 月于 Rio Rancho 一处 1,000 英亩园区破土，预计创造约 300 个高薪岗位，2026 年底前建成 21 栋建筑，最终每年生产数千枚 Blackbeard
              导弹。不过，公司最强的不利背景来自外部对扩产的担忧。地方报道和活动人士资料记录了居民围绕安全、用水、环境审查和透明度的持续反对，包括对爆炸半径建模、高氯酸铵使用以及未公布研究的担忧。Forbes
              还给出另一项尽调警示：截至 2025 年 12
              月，公司仍只有政府客户，并且仍处于演示和集成阶段，而非真正规模化生产。合起来看，证据支持公司是一家速度异常快、牵引真实的防务制造商，但还不是一家风险已充分释放、治理透明的生产型企业。
