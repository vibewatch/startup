      - number: '5.4'
        title: 差异化、信任、安全与质量控制
        blocks:
          - type: paragraph
            body: >-
              Castelion
              的差异化主张在官方和第三方材料中保持一致：更快的设计—测试—建造循环，更多内部子系统所有权，以及以生产为先的思路，目标是产出可负担规模，而不是精品高超音速。公司反复用硬件密集迭代、快速测试、垂直整合和规模制造来对比传统做法。这让产品故事有差异化，但也把执行风险集中到公司内部。信任和质量控制更多通过运营姿态可见，而不是通过外部认证治理可见。公开来源显示，Project
              Ranger 有 EHS Site Manager、Energetics Safety Manager、Flight Termination System engineering、政府 /
              社区事务等安全相关岗位；地方报道也记录了管理层说法，即静态点火测试将遵守地方法规，并按社区安全进行工程设计。不过，保留的公开记录没有显示 AS9100、ISO 9001、ISO 27001、SOC 2，或面向
              Blackbeard 指挥控制接口的已发布产品安全框架。对防务制造公司而言，缺席这些并不证明控制薄弱——许多细节可能并不公开——但它确实留下围绕供应商认证、网络韧性、质量逃逸和出口 /
              安全合规文件的尽调缺口。因此，投资人应把技术护城河视为可信且证据越来越多，但从质量保证或生产良率角度看，尚未完全去风险。
