      - number: '8.3'
        title: 牛市 / 基准 / 熊市情景与可比公司组
        blocks:
          - type: paragraph
            body: >-
              Castelion 的基准情景不是长成 Anduril 那么大；而是拿到足够多的可重复政府生产订单，在仍带有明显执行折扣的情况下，支撑相对上一次已知锚点的温和升值。牛市情景下，Project Ranger
              按时投产，海军扩大到原型之外，陆军地面发射路径完成转化，市场继续给可规模化国防制造支付高倍数；在这组假设下，即使从 $2.8B
              锚点出发也有可观上行。但熊市情景下，如果原型工作转化不够快、资本强度持续高企，或客户集中延续且看不到第二路径多元化，估值可能压缩到较低的战略制造区间或上市可比公司启发的区间。因此，可比公司选择必须同时覆盖私人国防科技赢家和上市国防承包商。私人可比公司说明，当投资人看到软件、自主性和平台杠杆时，叙事支撑的估值可以走多高。上市可比公司则给终局结果加上现实约束，因为它们显示了经过验证的国防现金流资产在公开市场值多少钱。Castelion
              位于这两极之间，但除非尽调提升证据质量，否则更靠近低端。
