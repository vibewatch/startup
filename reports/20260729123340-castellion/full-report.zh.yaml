      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方版图集中且机构属性重。对 Army 需求而言，用户是火力部队，但预算所有者横跨 Army 现代化、PAE Fires 架构和国会拨款方。对 Navy 需求而言，用户是作战航空或打击群体，付款方是 Navy
              武器账户；真正生产前，采用路径要穿过集成、测试和认证里程碑。在部门层面，Department of War
              已通过框架协议成为直接的市场塑造者：先谈好价格，并在全速率采购前制造长期需求信号。盟友和伙伴是次级但战略上重要的细分市场，因为美国验证完成后，同一套工业投资可以通过 foreign military
              sales、共同生产或其他安全合作路径摊销。实际采用路径因此不是商业销售漏斗，而是一串带门槛的防务采购流程：需求定义、原型演示、与发射器或飞机集成、发展性和作战测试、拨款支持的合同授权，然后才是连续生产。这让
              Castelion 的市场不太取决于品牌认知，而更取决于能否比传统厂商更快穿过官僚门槛，同时满足成本、可靠性和供应链要求。
