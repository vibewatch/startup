        title: 公开牵引、成本结构与单位经济性代理
        blocks:
          - type: paragraph
            body: >-
              公司有足够公开牵引来证明商业严肃性，但还不足以计算干净的单位经济模型。Forbes 报道称，截至 2025 年 12 月，Castelion 已获得超过 $100 million 军事合同，2026
              年公开奖项延续了这一轨迹。不过，成本结构显然很重：反复飞行测试、内部固体火箭发动机制造、导引头和任务软件开发、发射器与飞机集成，以及 1,000
              英亩生产园区，都意味着公司在确认稳定生产利润率前就要消耗大量资本。合同结构同样重要。2026 年 6 月交付订单覆盖 50 枚早期作战能力原型，以及 50
              个储运箱；这意味着即便最清楚的单枚数据点，也不能被视为干净的经常性导弹价格。最有用的公开经济对比因此来自相邻项目：接近 $218,000 的廉价巡航导弹、约 $300,000 的 Navy
              可负担高超音速目标价，以及 LRASM 约 $4.5 million 的成熟防区外导弹。Blackbeard 可能瞄准传统高端系统之下、最便宜巡航导弹层级之上的某个区间，但实际实现的经济性仍未披露。
