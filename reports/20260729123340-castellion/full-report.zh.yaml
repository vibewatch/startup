  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与许可风险
        blocks:
          - type: paragraph
            body: >-
              Castelion 所处的产品类别里，法律和监管风险与日常运营分不开。任何高超音速打击系统、配套技术数据和许多部件都会触及 ITAR
              以及更广泛的出口管制体系；即使还没有形成大规模出口，公司也要持续承担许可、数据处理、最终用户和技术安全义务。保留下来的公开记录还显示， Project Ranger
              另有一层监管压力。地方报道和社区信息显示，新墨西哥设施的静态点火和生产布局引发公众审视，噪音、安全和地方政府审批都不是抽象问题。更广泛地看，
              含能材料制造和测试环境还会带来工作场所安全义务，并可能触发化学工艺或风险管理框架。公开证据没有显示 Castelion 目前面临执法行动或诉讼，但也没有显示完整披露的合规架构。因此，正确的法律 /
              监管判断不是公司今天已经出事，而是公司处在多个高后果制度环境中，单次失误就可能拖慢项目、限制客户或实质改变估值。
