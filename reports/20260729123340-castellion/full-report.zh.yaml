        - 陆军、海军、OSD / DoW、部分盟友
        - Blackbeard 和配套发射概念的直接产品细分
      - - 低成本规模导弹 / “高低搭配”组合
        - 低成本巡航或高超音速导弹、集装箱化发射概念、弹药库深度采购
        - 只低量采购的高规格精品导弹
        - DoW 框架办公室、军种武器主管
        - 发展最快的邻近细分，也是塑造需求最清晰的政策趋势
