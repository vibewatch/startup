  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群细分与实际付款方
        blocks:
          - type: paragraph
            body: >-
              Castelion 的客户群应按政府买方、作战用户和战略伙伴细分，而不是按商业账户数量细分。公开记录中可见的付款实体几乎都是美国政府机构：U.S. Navy 通过多项 Blackbeard
              奖项和交付订单付款，Air Force Research Laboratory 通过 SBIR/FOCUS 合同付款，Army 或 Department of War 通过陆射和生产框架路径付款。作战用户似乎包括
              Navy 航空或海上打击群体、考虑 HIMARS/CAML 运用的 Army 远程火力组织，以及最终由 Saronic 集成路径启用的海上用户。Saronic
              等战略伙伴重要，因为它们扩大采用界面，但尚未成为清晰的终端付款方。地域同样集中：所有可信的保留客户验证都以美国为中心，盟友或出口路径仍只是前景，还没有证据。这一买方组合从信用角度质量很高，因为交易对手是政府机构；但它也很窄，因为几乎每个有意义的验证点都依赖美国防务需求和采购节奏。
