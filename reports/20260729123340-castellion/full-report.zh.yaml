  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局概览：传统主承包商、新进入者与替代选择
        blocks:
          - type: paragraph
            body: >-
              Castelion 面对的不是一组干净的同类公司。竞争格局包括供应链已验证、客户信任已建立的传统导弹主承包商；正在从 Department of War
              拿到框架协议的新一代可负担规模进入者；以及政府内部的现状选项——扩充既有项目，而不是给 Blackbeard 资金。美国官方采购页面显示，接触 Castelion 的同一批 Army 和部门买方，也在管理
              PrSM、远程火力、低成本巡航导弹和高超音速支撑子系统供应商。这意味着，买方评估 Blackbeard 时，通常是在不同深度打击效果实现方式之间选择，而不是在完全相同的导弹类型之间选择。Lockheed
              Martin 通过 PrSM 锚定传统 Army 侧；RTX 与 Lockheed 共同锚定 Tomahawk、LRASM 等更成熟的防区外选项；Northrop 和 L3Harris
              作为推进与子系统强者也很重要；Anduril、Leidos、CoAspire、Zone 5 和 Ursa Major
              则代表非传统阵营，卖点是可负担性、开放架构、增材制造和更快生产爬坡。正确问题因此是“谁能可信地赢得打击预算、测试带宽和生产余量？”，而不只是“还有谁说自己做高超音速”。
