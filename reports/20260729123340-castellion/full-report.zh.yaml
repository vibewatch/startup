    slug: recommendation-logic
    title: 建议逻辑
    summary: 公开证据链从战略需求与客户证据出发，经过风险和价格纪律，推导最终建议。
    data:
      nodes:
        - id: market
          label: 国防需求 + 低成本规模化逻辑
          detail: 战略需求巨大，政策信号也在支持
        - id: product
          label: Blackbeard + Project Ranger 证据
          detail: 产品动能真实，由工厂支撑的护城河叙事讲得通
        - id: customers
          label: 具名政府客户推进
          detail: Navy / AFRL / Army 路径可见
        - id: risks
          label: 执行 + 集中度 + 不透明
          detail: 工厂、转化、利润率和合规风险仍高
        - id: price
          label: $2.8B 公开锚点
          detail: 只有私下尽调补强经济性可见度时，才算合理
        - id: call
          label: 跟踪 / 继续研究
          detail: 不要只凭公开证据盲目出价
      edges:
        - from: market
          to: product
          label: 支撑品类重要性
        - from: product
          to: customers
          label: 促成采用证据
        - from: customers
          to: price
          label: 只能部分支撑溢价
        - from: risks
          to: price
          label: 要求折价 / 纪律
        - from: price
          to: call
          label: 决策结果
        - from: risks
          to: call
          label: 防止盲目买入
