      - number: '6.3'
        title: 耐久性、重复使用与集中度
        blocks:
          - type: paragraph
            body: >-
              耐久性信号好坏参半：客户质量高，公开重复接触存在，但长期留存数据基本缺席。最强的正面指标是同一个 Blackbeard 合同家族内 Navy
              的重复购买行为——开发资金、期权行使，随后是交付订单——这说明关系在推进，而不是停滞。AFRL 也比一次性科学项目更耐久，因为公开奖项记录延伸到 2027 年，并位于一个聚焦可制造远程打击武器的具名 SBIR
              主题内。不过，保留的公开来源没有披露
              NRR、GRR、客户数、流失、续约率、重新竞标胜率、满意度调查，甚至没有披露分部收入组合。对防务初创公司来说，这并不罕见，但这意味着耐久性只能从项目推进推断，而不是从队列衡量。集中度风险更明显。公开客户集合由少数几个美国政府关系主导；Navy
              似乎是唯一一个对外部投资人可见、在 2026 年有重复金额承诺的清晰具名客户。这种集中既带来上行，也带来下行：一个项目进入生产就可能改写公司，而一次采购暂停也可能显著压缩近期牵引。
