      - number: '1.3'
        title: 资本形成、投资人基础与政府牵引
        blocks:
          - type: paragraph
            body: >-
              对一家私营防务制造商来说，Castelion 的资本形成披露异常充分。2023 年 10 月，公司带着 $14.2 million 初始融资走出隐身期；2025 年 1 月又宣布 $100 million
              融资，其中 $70 million 为 Lightspeed 领投的 Series A，另有 $30 million 来自 Silicon Valley Bank 的 venture debt。2025 年 12
              月，公司完成 $350 million Series B，由 Altimeter Capital 和 Lightspeed 领投，Andreessen Horowitz、Lavrock、General
              Catalyst、First In、Space VC、Cantos、BlueYard、Avenir、Champion Hill 和 Interlagos 参投。仅按已披露口径计算，种子轮、Series A、债务和
              Series B 合计资本约 $464.2 million。独立报道方向一致，Forbes 称公司已从投资人处融资 $450 million，Series B 后估值为 $2.8
              billion。公开合同牵引也足以在公司概览章节中占据重要位置。官方材料称，截至 2025 年 1 月，Castelion 已有 Navy、Air Force 和 Army 活跃合同；后续公告显示，2025 年
              10 月获得 Army 和 Navy 集成合同，2026 年 2 月获得 $49.998 million Navy 合同，2026 年 4 月获得 $105 million Navy 合同，2026 年 5
              月签署生产框架协议，2026 年 6 月获得 50 枚预生产 Blackbeard 导弹的 $23.4 million 交付订单。Forbes 进一步称，截至 2025 年 12 月，公司已拿到超过 $100
              million 的军事合同。因此，资本栈和政府客户路径远比收入确认、利润率画像或客户集中度清晰。
