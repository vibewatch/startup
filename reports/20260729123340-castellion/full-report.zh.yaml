      - number: '1.2'
        title: 创始人、领导梯队与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人故事是 Castelion 最清楚的尽调锚点之一。官方领导层材料和独立报道都指向三位联合创始人：CEO Bryon Hargis、COO Sean Pitt 和 CFO Andrew Kreitz。三人均为
              SpaceX 前高管，于 2022 年末离职创办公司。Forbes 补充了有用背景：创业起点来自 Pentagon 对高超音速供应的不满，创始人决定把 SpaceX
              式垂直整合和快速迭代用于导弹生产。官方履历进一步强化创始人与市场的匹配度：Hargis 曾负责 SpaceX 国家安全卫星项目的销售、业务拓展和早期产品定义；Pitt 负责欧洲发射和载人航天销售；Kreitz
              负责发射预测、机密项目 FP&A，之后在 Goldman Sachs 做航天与防务投行。更广泛的已披露团队也重要，因为这是一家重制造公司。官方材料列出车辆工程、航电、制造和导引头开发的高级负责人，背景来自
              SpaceX、Raytheon 和 L3Harris，暗示公司围绕内部硬件执行搭建运营模式。治理透明度较弱。Castelion
              没有在本次审阅的公开材料中公布董事会名单、委员会结构、持股比例或投资人控制条款，因此投资人对创始人能力的把握可以更强，但对正式治理纪律或继任深度的把握要弱得多。
