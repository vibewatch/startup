chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命、产品范围与布局
        blocks:
          - type: paragraph
            body: >-
              Castelion 将自己定位为防务科技与制造公司，目标是恢复美国快速、低成本、规模化部署先进打击系统的能力。公司发布材料称，其成立于 2022 年 11 月，并于 2023 年 10
              月走出隐身期，明确聚焦复杂防务系统的快速开发和大规模制造。从官网、隐身期退出公告、Series A 到 Series B 材料，核心产品论点少见地一致：Castelion
              想把高超音速和远程打击武器做成可批量制造的产品，而不是低产量的精品系统。Blackbeard 被呈现为公司的首个武器系统，也是后续 Army、Navy
              和海上发射里程碑的锚点。公开设施证据也显示，公司有真实且扩张中的物理布局，而不是只有软件外壳。Castelion 官方材料将总部置于 California 的 Torrance，提到 2025 年 4
              月将总部扩至 90,000 平方英尺，并描述其在 California、Texas、New Mexico 有制造业务，另在 Washington, D.C.
              设办公室。招聘页印证了多站点运营模式：Torrance、Rio Rancho、Midland、Allen 和 Washington, D.C.
              均有活跃招聘，但没有公布精确员工数或组织图。因此，公司的身份和布局证据扎实，精确规模指标仍披露不足。
