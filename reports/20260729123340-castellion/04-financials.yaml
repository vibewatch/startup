- id: capital-adequacy-and-financing-dependency
  title: Capital adequacy, financing dependency, and project-finance posture
  body: 'Capital adequacy is the chapter''s clearest yes-and-no answer: yes, Castelion has raised enough disclosed capital to build real facilities and win meaningful contracts; no, the public record is still too sparse to show cash on hand, monthly burn, or runway with precision. Series A and venture debt were explicitly earmarked for faster testing, mass-production facilities, and the first hypersonic demonstration. Series B was explicitly tied to Blackbeard integration, Project Ranger tooling and ramp, and multiserve testing in 2026. Project Ranger itself is a more than $220 million private investment with 21 buildings planned by end-2026, which underscores just how asset-heavy the model is. Venture debt from Silicon Valley Bank adds non-equity obligations to the capital stack, and although local incentives and industrial-revenue-bond structures may soften project economics, they are not substitutes for operating cash generation. The most prudent reading is that capital access remains
    strategic: even after the Series B, the company is likely funding concurrent product maturation, factory buildout, workforce growth, and qualification campaigns before broad production economics are proven.'
