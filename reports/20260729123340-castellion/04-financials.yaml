- id: financial-verdict-and-diligence-blockers
  title: Financial verdict, revenue quality, and diligence blockers
  body: 'Financial verdict: Castelion looks better capitalized and more contract-validated than a typical early defense startup, but still too opaque for a high-confidence revenue or margin underwriting case. Revenue quality appears concentrated in U.S. government development and procurement pathways, which is positive for buyer quality but negative for concentration, timing, and appropriations exposure. The strongest adverse financial fact is not a disclosed miss or default; it is the absence of the numbers investors most need: recognized revenue, gross margin, working-capital needs, backlog conversion timing, burn, and current cash. There is also a subtle timing mismatch between contract excitement and economic proof. Public sources show real contract values and a credible production roadmap, yet outside reporting still framed the company as pre-full-scale-production even after the big Series B. Until management discloses or shares under NDA how contract awards convert into deliveries,
    margins, and cash, the business should be modeled as a promising but still capital-dependent manufacturing program rather than as a de-risked defense prime in miniature.'
