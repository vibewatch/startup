chapter:
  number: 4
  title: Financials
summary: Castelion's public financial profile is dominated by capital formation and contract signals rather than by disclosed revenue or margins. The company has about $464.2 million of disclosed cumulative capital across seed, Series A, venture debt, and Series B, while public contract evidence shows at least one $49.998 million Navy award, a $104.999 million option exercise on the same award, and a $23.4 million early-operational-capability delivery order for 50 pre-production Blackbeard missiles plus containers. That is enough to show meaningful government monetization potential, but not enough to underwrite recognized revenue, gross margin, burn, or runway with precision. The financial story is therefore one of heavy manufacturing and test capex, milestone- driven government revenue quality, and likely ongoing dependence on external capital until Blackbeard reaches repeatable production at scale.
sections:
- id: revenue-model-and-recognition
  title: Revenue streams, monetization logic, and recognition caveats
  body: 'Castelion''s revenue model is government-program centric and should be treated as contract-driven hardware commercialization rather than as subscription software or a simple product-sale business. Public evidence points to four monetization layers: research and development contracts that fund design, test, and integration work; larger development or option-bearing Navy awards; pre-production delivery orders for early operational capability; and a future pathway to multiyear production procurement if Blackbeard clears testing and validation. The company''s own releases support this sequence by pairing capital raises with test cycles, integration milestones, and manufacturing expansion rather than with disclosed revenue KPIs. USAspending and company releases provide contract values, but those values should not be mistaken for recognized revenue because defense awards can include options, milestone timing, and deliverables that convert into revenue over time rather than on award date.
    The strongest public signal is that the business has moved well beyond pure R&D concept funding, yet the public record still does not reveal how much of the booked award base has actually flowed through the income statement.'
  claimRefs:
