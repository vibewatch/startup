- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Recognized revenue by contract
    - Cannot distinguish awards from actual top-line realization
    - Request audited revenue bridge by contract and quarter
  - - Gross margin by missile / program phase
    - Cannot underwrite whether scale improves economics
    - Request standard-cost model and delivered gross margin by lot
  - - Cash on hand and monthly burn
    - Cannot compute runway or next-round timing
    - Request treasury snapshot and cash-flow forecast
  - - Working capital and inventory profile
    - Cannot assess how much cash is trapped before delivery
    - Request inventory turns, long-lead purchases, and milestone billing terms
  - - Funded backlog vs options
    - Cannot tell how much visible demand is firm vs aspirational
    - Request backlog schedule separating exercised options from target demand
  - - Debt terms and covenants
    - Cannot measure downside from venture debt
    - Request loan agreement summary and covenant headroom
  - - Customer concentration and payment timing
    - Government quality is high, but concentration may be extreme
    - Request revenue share by agency, program, and payment status
  - - Per-unit Blackbeard price ladder
    - Cannot benchmark economic moat versus cruise-missile substitutes
    - Request target price by lot and learning-curve assumptions
  notes: The biggest blocker is not lack of demand narrative but lack of revenue-conversion and margin data.
