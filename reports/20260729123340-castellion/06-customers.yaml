  title: Customers
summary: 'Castelion''s customer evidence is stronger than a typical 2022-founded defense startup''s, but it remains concentrated in U.S. government buyers and adjacent government-backed demonstration partners. The clearest named customer proof is the U.S. Navy, which progressed from a February 2026 Blackbeard development award to an April 2026 option exercise and a June 2026 delivery order for 50 pre-production prototypes. The Air Force / AFRL relationship is also meaningful: public SBIR and contract records show an AFRL-backed low-cost highly manufacturable long-range strike-weapon program dating to 2023. Army demand is visible through HX3 and CAML/HIMARS planning plus prior integration-contract claims, but public proof still looks more like funded development and prototyping than durable fielded-program adoption. Expansion pathways exist—additional Navy lots, Army ground-launch adoption, and maritime integration with Saronic—but retention and satisfaction data are almost completely undisclosed.
  The customer chapter therefore underwrites Castelion as having high-quality but highly concentrated customer proof, with real repeat-purchase signals from the Navy and real strategic sponsorship from AFRL/Army pathways, yet limited visibility into renewal durability, segment mix, and non-U.S. customer diversification.'
sections:
- id: customer-base-and-segmentation
  title: Customer base segmentation and who actually pays
  body: 'Castelion''s customer base should be segmented by government buyer, operational user, and strategic partner rather than by commercial-account count. The paying entities visible in public records are overwhelmingly U.S. government organizations: the U.S. Navy through multiple Blackbeard awards and delivery orders, the Air Force Research Laboratory through SBIR/FOCUS contracting, and the Army or Department of War through ground-launch and production-framework pathways. Operational users appear to include Navy aviation or naval-strike communities, Army long-range fires organizations contemplating HIMARS/CAML employment, and eventually maritime users enabled by the Saronic integration path. Strategic partners such as Saronic matter because they expand adoption surfaces without yet becoming clear end-payers. Geography is similarly concentrated: all credible retained customer proof is U.S.-centric, with allied or export pathways still prospective rather than evidenced. This is a high-quality
    buyer mix from a credit perspective because the counterparties are government agencies, but it is also a narrow one because nearly every meaningful proof point depends on U.S. defense demand and procurement timing.'
