- id: expansion-paths-and-underwriting-verdict
  title: Expansion paths, procurement friction, and underwriting verdict
  body: 'Expansion is plausible across buyer types, domains, and program stages, but every path runs through procurement friction. Navy expansion could mean larger lots after pre-production prototypes validate. Army expansion could come if HX3 and CAML testing convert Blackbeard GL into a funded fires program. Maritime expansion could occur if Saronic''s Marauder demonstration creates a new distributed-launch concept for naval customers. Longer term, AFRL or other Air Force pathways may continue to underwrite development or transition efforts. Yet public evidence for non-U.S. customers, export customers, or private-sector channels is absent. Procurement friction is also an unavoidable part of the growth model: range approval, test success, platform integration, option exercises, budget cycles, and multiyear authorization all mediate customer expansion. The correct underwriting view is therefore to treat Castelion''s customer chapter as strong on named U.S. defense proof, moderate on repeat-progression
    signals, and weak on broad diversification or disclosed retention economics. The company has real customer pull, but not yet the public customer breadth or cohort disclosure of a mature defense prime.'
