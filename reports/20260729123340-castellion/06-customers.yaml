- id: durability-repeat-usage-and-concentration
  title: Durability, repeat usage, and concentration
  body: 'The durability signal is mixed: customer quality is high, public repeat engagement exists, but long-horizon retention data is essentially absent. The strongest positive indicator is repeat Navy buying behavior inside one Blackbeard contract family—development funding, option exercise, and then a delivery order—which suggests the relationship is progressing instead of stalling. AFRL also looks more durable than a one-off science project because the public award record extends into 2027 and sits inside a named SBIR topic focused on manufacturable long-range strike weapons. However, none of the retained public sources disclose NRR, GRR, customer count, churn, renewal rates, recompete win rates, satisfaction surveys, or even a segment revenue mix. For defense startups, that is not unusual, but it means durability must be inferred from program progression rather than measured from cohorts. Concentration risk is the more obvious reality. The public customer set is dominated by a handful
    of U.S. government relationships, and the Navy appears to be the only clearly named customer with repeated 2026 monetary commitments visible to outside investors. That concentration raises both upside and downside: one program moving to production could transform the company, while one procurement pause could materially compress near-term traction.'
