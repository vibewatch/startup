- id: adoption-trajectory-and-named-proof
  title: Adoption trajectory and named customer proof
  body: 'Public adoption evidence is best interpreted as a stepwise progression from sponsored R&D to integration work to early pre-production delivery. The AFRL/USAF relationship anchors the left side of the funnel: the about-us timeline cites a first AFRL direct-to-Phase-2 SBIR in 2023, while independent SBIR and contract databases show a FOCUS Phase II award for low-cost highly manufacturable long-range strike weapon production. The Navy relationship is the strongest proof of advancement along the adoption curve. Official and regulatory records show a February 2026 award for prototype development, an April 2026 option exercise bringing the same contract line above $100 million, and a June 2026 delivery order for 50 pre-production Blackbeard prototypes plus containers. Army adoption proof is somewhat earlier-stage but still meaningful; Blackbeard GL appears in FY2026 planning and trade reporting as a candidate munition for CAML/HIMARS-related testing. The result is a convincing public
    story of growing customer commitment, but one that remains rooted in pilots, prototypes, and pre-production rather than in broad fleet deployment or multiyear repeat procurement disclosed across several agencies.'
