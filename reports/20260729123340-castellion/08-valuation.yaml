- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Project Ranger on time; Navy lots expand; Army GL converts; defense premium remains elevated
    - Upside from $2.8B anchor could be substantial because revenue quality and strategic scarcity both improve
    - Still exposed to safety and supply risks
    - Possible but requires multiple wins
  - - Base
    - Navy progresses gradually; Army remains optional; factory ramps with normal friction; no major compliance issue
    - Valuation should sit around or modestly above anchor until economics are disclosed
    - Execution and concentration risk keep multiple disciplined
    - Most plausible on current evidence
  - - Bear
    - Prototype conversion stalls; factory delay or cost overrun; financing needed before visible margin proof
    - Valuation can compress toward a lower strategic-manufacturing band and dilute prior investors
    - Customer concentration and capital intensity amplify downside
    - Material probability if milestones slip
