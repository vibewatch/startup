- id: valuation-context-and-entry-discipline
  title: Current valuation context and entry discipline
  body: 'The public financing anchor is a roughly $2.8 billion valuation around the 2025 $350 million Series B, with cumulative disclosed capital of about $464.2 million when seed and Series A financing are included. That anchor is informative but insufficient by itself. Public venture markets in defense moved materially higher in 2026: Shield AI raised at $12.7 billion, Anduril at $61 billion, and Anduril was later reported to be discussing a possible $100 billion mark. Those numbers demonstrate that investors will pay enormous premiums for defense platforms with real growth and program proof. Castelion is cheaper than those leaders, but it also offers far less disclosed scale evidence. Public primes tell the opposite story. Lockheed, Northrop, General Dynamics, and Leidos have tens of billions of enterprise worth supported by public market caps, filings, and operating histories. Castelion''s current private anchor is tiny versus those firms in absolute terms, but enormous when judged against
    its own still-private economics. Entry discipline therefore matters. Without better visibility into production conversion, pricing, and margins, the company should be underwritten more like a high-upside, high-volatility option on defense-industrial transformation than like a de-risked next-generation prime.'
