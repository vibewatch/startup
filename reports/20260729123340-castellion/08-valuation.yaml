- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: Selected private defense-tech and public defense-contractor references that illuminate the band between narrative-premium and cash-flow-backed valuation.
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Anduril
    - Private valuation and revenue signal
    - $61B Series H in May 2026; later reported talks around $100B; 2025 revenue $2.2B
    - Upper bound for defense-tech narrative plus scaling proof
    - Far larger scale and software/platform breadth than Castelion
  - - Shield AI
    - Private valuation
    - $12.7B post-money in March 2026
    - Closer-stage private defense-tech reference with real autonomy/customer proof
    - Still more software/autonomy-heavy and globally distributed than Castelion
  - - Lockheed Martin
    - Public market cap / filing-backed prime
    - $133.06B market cap in July 2026
    - Terminal-outcome reality check for proven defense cash flows
    - Too mature to price an early factory-ramp company directly
  - - Northrop Grumman
    - Public market cap / filing-backed prime
    - $77.34B market cap in July 2026
    - Relevant for missiles/hypersonics and prime-like defense exposure
    - Public market values include decades of execution evidence
  - - General Dynamics
    - Public market cap / filing-backed prime
    - $106.18B market cap in July 2026
    - Shows valuation of diversified defense manufacturing at scale
    - Not a hypersonic pure-play and far more diversified
  - - Leidos
    - Public market cap / filing-backed defense tech
    - $14.58B market cap in July 2026
    - Useful lower-bound reminder that proven defense tech can still trade below hot private marks
    - Business mix differs materially from weapon manufacturing startup
  notes: Comps are used to bound valuation logic, not to imply a single clean multiple.
