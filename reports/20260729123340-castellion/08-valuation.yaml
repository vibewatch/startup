company:
  name: Castellion
chapter:
  number: 8
  title: Valuation
summary: 'Castelion''s July/December 2025 financing context—roughly $2.8 billion valuation at a $350 million Series B after about $464.2 million of disclosed cumulative capital—sits in a plausible but still aggressive middle ground between public defense primes and the hottest private defense-tech winners. The case for owning the company is strong on market urgency, product ambition, government proof, and manufacturing differentiation. The case against paying up today is equally real: customer concentration, sparse revenue disclosure, uncertain margin structure, factory execution risk, and limited term transparency. Relative to Shield AI''s $12.7 billion 2026 valuation and Anduril''s $61 billion 2026 valuation, Castelion looks cheaper in absolute dollars but far earlier in disclosed scale proof. Relative to public primes such as Lockheed, Northrop, General Dynamics, and Leidos, Castelion commands a very large premium for growth, optionality, and narrative rather than for disclosed cash flow.
  My recommendation is therefore price-sensitive and evidence-sensitive: Track / research-more at the public July 2025 anchor unless entry terms materially improve or diligence reveals stronger revenue-conversion, margin, and production evidence than the public record currently supports.'
sections:
- id: thesis-and-anti-thesis
  title: Investment thesis and anti-thesis
  body: 'The investment thesis for Castelion is straightforward: the company is attacking one of the Pentagon''s clearest capability gaps with a product philosophy—affordable mass, faster iteration, vertical integration, and factory-backed scale—that aligns with current procurement and battlefield logic. Market, product, and customer chapters all support this. Blackbeard has moved from concept into repeated testing, Navy development awards, and a June 2026 pre-production delivery order. Project Ranger gives the business a tangible industrial asset that could widen the moat if it commissions successfully. The anti-thesis is equally clear. Public evidence still does not disclose recognized revenue, margin, backlog conversion, cash on hand, or a full-rate production win. That means the current anchor valuation is being justified mostly by strategic relevance, technical momentum, and future conversion. Investors are therefore paying not just for a company, but for a sequence of execution assumptions:
    the Navy path scales, the Army path converts, the factory ramps, safety/compliance stay intact, and margins eventually justify heavy capex. Without that chain, the price can look rich quickly.'
