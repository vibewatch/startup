      - number: '1.4'
        title: Milestones, scale claims, and adverse context
        blocks:
          - type: paragraph
            body: >-
              Castelion’s milestone cadence supports the view that this is more than a concept-stage startup, but the
              public record still requires caution on what has and has not been proven. Official materials show an early
              AFRL SBIR award in May 2023, in-house rocket-motor firing during 2023, a first flight in March 2024, a
              Phase 3 award in October 2024, a first DoD-sponsored flight in February 2025, AFWERX STRATFI selection in
              March 2025, October 2025 Army and Navy integration contracts, and a sequence of Navy awards during 2026.
              Manufacturing scale claims also accelerated rapidly. Castelion announced Project Ranger in November 2025,
              then broke ground in January 2026 on a 1,000-acre Rio Rancho campus expected to create roughly 300
              high-paying jobs, complete 21 buildings by end-2026, and eventually produce thousands of Blackbeard
              missiles annually. That said, the company’s strongest adverse context is external concern over that
              scale-up. Local reporting and activist sources document sustained resident opposition on safety, water,
              environmental review, and transparency grounds, including concern over blast-radius modeling,
              ammonium-perchlorate use, and the lack of published studies. Forbes adds a different diligence caution: as
              of December 2025 the company still had only government customers and remained in the demonstration and
              integration phase rather than true scaled production. Combined, the evidence supports an unusually
              fast-moving defense manufacturer with real traction, but not a fully de-risked, transparently governed
              production business.
