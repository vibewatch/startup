      - number: '8.4'
        title: Recommendation, exit readiness, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Recommendation: Track / research-more, not an automatic pass and not a blind buy. Confidence is medium
              because the strategic thesis is strong but the valuation evidence is incomplete. Risk rating is high
              because the next several value-driving steps—factory readiness, customer conversion, and unit economics
              disclosure—are unresolved. Valuation stance is disciplined: the public anchor can be rational if private
              diligence shows stronger booked backlog, revenue conversion, and margin trajectory than outside sources
              reveal, but it is not obviously cheap on public evidence alone. Exit readiness is limited. The company has
              a compelling narrative and real demand signals, yet it is not IPO-ready from a disclosure standpoint and
              is probably best viewed as a later-stage private financing, strategic partnership, or eventual
              prime-acquisition candidate rather than a near-term public listing. The final diligence asks are therefore
              specific: contract-family revenue conversion, margins by lot, Project Ranger commissioning status, current
              cash and debt terms, and the exact thresholds that move Navy and Army programs from prototype to scaled
              procurement.
            claimRefs:
              - CV031
