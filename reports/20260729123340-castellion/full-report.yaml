        title: Public traction, cost structure, and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              The company has enough public traction to establish commercial seriousness, but not enough to compute a
              clean unit-economics model. Forbes reported that Castelion had secured more than $100 million in military
              contracts by December 2025, and public 2026 awards extend that trajectory. Still, the cost structure is
              obviously heavy: repeated flight tests, in-house solid rocket motor manufacturing, seeker and mission
              software development, launcher and aircraft integration, and a 1,000-acre production campus all imply a
              business that consumes capital long before it can recognize steady production margins. Contract geometry
              also matters. The June 2026 delivery order covers 50 early-operational-capability prototypes plus 50
              storage and shipping containers, which means even the clearest per-unit datapoint cannot be treated as a
              clean recurring missile price. The most useful public economic comparison therefore comes from adjacent
              programs: cheap cruise missiles near $218,000, an affordable Navy hypersonic goal price around $300,000,
              and mature stand-off missiles like LRASM near $4.5 million. Blackbeard likely aims somewhere below legacy
              high-end systems and above the cheapest cruise-missile tiers, but the actual realized economics remain
              undisclosed.
