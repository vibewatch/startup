  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investment thesis for Castelion is straightforward: the company is attacking one of the Pentagon's
              clearest capability gaps with a product philosophy—affordable mass, faster iteration, vertical
              integration, and factory-backed scale—that aligns with current procurement and battlefield logic. Market,
              product, and customer chapters all support this. Blackbeard has moved from concept into repeated testing,
              Navy development awards, and a June 2026 pre-production delivery order. Project Ranger gives the business
              a tangible industrial asset that could widen the moat if it commissions successfully. The anti-thesis is
              equally clear. Public evidence still does not disclose recognized revenue, margin, backlog conversion,
              cash on hand, or a full-rate production win. That means the current anchor valuation is being justified
              mostly by strategic relevance, technical momentum, and future conversion. Investors are therefore paying
              not just for a company, but for a sequence of execution assumptions: the Navy path scales, the Army path
              converts, the factory ramps, safety/compliance stay intact, and margins eventually justify heavy capex.
              Without that chain, the price can look rich quickly.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
