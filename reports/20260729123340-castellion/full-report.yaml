      - number: '7.2'
        title: Operational, quality, and manufacturing risk
        blocks:
          - type: paragraph
            body: >-
              The operational thesis for Castelion is powerful but unforgiving: the company must prove that fast
              iteration can become repeatable production. Public sources show it is vertically integrating motors,
              flight computers, mission software, and manufacturing infrastructure, but those same choices concentrate
              quality, yield, and schedule risk inside the firm. Project Ranger is designed to produce motors, run
              static tests, and complete final assembly across a large multi-building campus, so delays in any of
              construction, utilities, hiring, permitting, safety validation, or process qualification can slow the
              entire company. Product maturity also remains transitional. Blackbeard has progressed beyond concept and
              into pre-production orders, but retained public evidence does not disclose production yields, scrap rates,
              lot acceptance results, shelf-life validation, or field reliability. Static-fire and flight-test cadence
              are strengths, yet they also reveal how much of the program still depends on technical proof. In practical
              terms, the biggest operational risk is not that the company has no plan; it is that several interdependent
              plans—subsystem maturity, factory commissioning, supplier robustness, and platform integration—must all
              work on an aggressive timeline.
            claimRefs:
              - CR011
              - CR012
              - CR013
