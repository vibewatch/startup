  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflow
        blocks:
          - type: paragraph
            body: >-
              From a customer point of view, Castelion delivers an affordable-hypersonic strike capability rather than a
              standalone component. The product family centers on Blackbeard, which public sources describe as
              Castelion's first weapon system and frame in multiple operational forms: an air-launched weapon for Navy
              and potentially other tactical aircraft, a ground-launched Blackbeard GL variant for Army HX3 and
              HIMARS-adjacent launchers, and a maritime-launch pathway demonstrated with Saronic. The workflow is
              therefore mission-driven. A government user or sponsor defines an operational need—cheap long-range
              precision strike against moving or hardened targets—then Castelion integrates the round onto a relevant
              platform, manufactures major subsystems internally, runs developmental test loops, and delivers early
              operational capability prototypes under government contract. Official releases show the sequence clearly:
              early SBIR work, propulsion maturation, internal flight-computer development, more than 20 developmental
              flight tests, Navy development awards, integration contracts for Army and Navy platforms, and a June 2026
              delivery order for 50 pre-production Blackbeard rounds. Product delivery is inseparable from system
              integration and test support, so the buyer workflow includes launcher or aircraft compatibility, range
              safety, telemetry, and platform-specific software integration rather than a simple catalog purchase.
