chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, product scope, and footprint
        blocks:
          - type: paragraph
            body: >-
              Castelion describes itself as a defense technology and manufacturing company built to restore America’s
              ability to field advanced strike systems quickly, affordably, and at scale. The company’s own launch
              materials say it was founded in November 2022 and came out of stealth in October 2023 with an explicit
              focus on rapid development and mass manufacturing of complex defense systems. The core product thesis is
              unusually consistent across the home page, stealth-exit announcement, Series A, and Series B materials:
              Castelion wants to make hypersonic and long-range strike weapons manufacturable in quantity rather than
              exquisite boutique systems produced in low volumes. Blackbeard is presented as the company’s first weapon
              system and the anchor for later Army, Navy, and maritime-launch milestones. Public facility evidence also
              shows a real, expanding physical footprint rather than a software-only shell. Castelion’s official
              materials place headquarters in Torrance, California, note a 90,000-square-foot headquarters expansion in
              April 2025, and describe manufacturing operations in California, Texas, and New Mexico plus a Washington,
              D.C. office. The careers page corroborates a multi-site operating model with active recruiting in
              Torrance, Rio Rancho, Midland, Allen, and Washington, D.C., but it does not publish an exact employee
              count or org chart. That leaves the company’s identity and footprint well supported, while exact scale
              metrics remain under-disclosed.
            claimRefs:
