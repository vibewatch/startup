            body: >-
              Castelion's customer base should be segmented by government buyer, operational user, and strategic partner
              rather than by commercial-account count. The paying entities visible in public records are overwhelmingly
              U.S. government organizations: the U.S. Navy through multiple Blackbeard awards and delivery orders, the
              Air Force Research Laboratory through SBIR/FOCUS contracting, and the Army or Department of War through
              ground-launch and production-framework pathways. Operational users appear to include Navy aviation or
              naval-strike communities, Army long-range fires organizations contemplating HIMARS/CAML employment, and
              eventually maritime users enabled by the Saronic integration path. Strategic partners such as Saronic
              matter because they expand adoption surfaces without yet becoming clear end-payers. Geography is similarly
              concentrated: all credible retained customer proof is U.S.-centric, with allied or export pathways still
              prospective rather than evidenced. This is a high-quality buyer mix from a credit perspective because the
              counterparties are government agencies, but it is also a narrow one because nearly every meaningful proof
              point depends on U.S. defense demand and procurement timing.
