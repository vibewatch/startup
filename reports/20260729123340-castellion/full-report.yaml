  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape overview: incumbents, entrants, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Castelion does not face one clean peer set. The competitive landscape includes incumbent missile primes
              with validated supply chains and installed customer trust; newer affordable-mass entrants now getting
              framework agreements from the Department of War; and status-quo internal government choices that expand
              existing programs instead of funding Blackbeard. Official U.S. procurement pages show that the same Army
              and departmental buyers touching Castelion also manage PrSM, long-range fires, low-cost cruise missiles,
              and hypersonic-enabling subsystem vendors. That means a buyer evaluating Blackbeard is often choosing
              among different ways to achieve deep-strike effects rather than among identical missile types. Lockheed
              Martin anchors the incumbent Army side via PrSM; RTX and Lockheed together anchor more mature standoff
              options like Tomahawk and LRASM; Northrop and L3Harris matter as propulsion and subsystem powerhouses; and
              Anduril, Leidos, CoAspire, Zone 5, and Ursa Major represent the nontraditional cohort selling
              affordability, open architecture, additive manufacturing, and faster production ramps. The right lens is
              therefore “who can credibly win strike budget, test bandwidth, and production headroom?” not just “who
              else says hypersonic.”
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
