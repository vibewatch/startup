  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Castelion should be underwritten against a tightly defined market boundary rather than a catch-all
              “defense AI” or “autonomy” narrative. Public company materials, Army fires doctrine pages, and Army budget
              reporting all place the business inside long-range precision fires and strike munitions, with Blackbeard
              framed as a low-cost hypersonic strike weapon that can fit Army and Navy launch concepts. Included spend
              therefore covers weapon design, flight testing, integration, launch compatibility work, energetics and
              propulsion, guidance and seekers, production tooling, and recurring munition procurement. It also includes
              the enabling industrial base—solid rocket motors, critical minerals, advanced manufacturing qualification,
              and surge-capacity investments—because those inputs are part of the buyer's real purchase decision in a
              wartime-footing market. Excluded spend includes generic defense software, unrelated autonomous systems,
              and broad aerospace manufacturing categories that do not convert into precision-strike inventories. The
              nearest substitutes are existing high-end missiles and other long-range fires programs that deliver
              similar operational effects at higher cost or lower manufacturing throughput. CSIS, Breaking Defense, and
              the Department of War all point to the same structural thesis: the relevant competition is not whether
              militaries want strike systems at all, but which suppliers can deliver enough affordable magazine depth
              quickly enough to matter in a protracted conflict.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
