      - number: '5.3'
        title: Deployment, integration, support, and roadmap
        blocks:
          - type: paragraph
            body: >-
              Deployment is platform-centric and remains in a maturation phase rather than in a broad fielded-service
              phase. Public evidence shows three main integration tracks. First, the Navy awarded February and April
              2026 Blackbeard contracts for prototype development, flight testing, and early operational capability,
              then followed with a June 2026 delivery order for 50 pre-production rounds plus containers. Second, Army
              budget and trade reporting show Blackbeard GL planned for Project HX3 and CAML/HIMARS-adjacent launchers,
              with prototype demonstrations and up to ten test rounds in FY2026. Third, Castelion and Saronic announced
              a first-of-its-kind maritime hypersonic launch capability combining Blackbeard with an autonomous
              surface-vessel platform. The roadmap implied by these sources is straightforward: continue multi-service
              integration in 2026, finish Project Ranger buildout, deliver early operational capability lots, and
              convert successful test outcomes into larger production pathways. Support and reliability, however, are
              only partly visible. The company emphasizes rapid iteration, mission software, and frequent testing, while
              careers pages show explicit hiring for avionics reliability, systems integration, logistics, inventory,
              and community affairs. Yet public materials do not disclose field reliability rates, shelf-life validation
              results, mean time between failures, or detailed sustainment concepts beyond general compatibility and
              manufacturing-ramp claims.
