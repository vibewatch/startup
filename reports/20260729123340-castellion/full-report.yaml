            claimRefs:
              - CV023
              - CV024
              - CV033
              - CV037
              - CV038
      - number: '8.3'
        title: Bull / base / bear scenarios and comparable set
        blocks:
          - type: paragraph
            body: >-
              The base case for Castelion is not that it becomes Anduril-sized; it is that it earns enough repeat
              government production to justify modest appreciation above the last known anchor while still carrying
              meaningful execution discounts. In the bull case, Project Ranger commissions on time, the Navy expands
              beyond prototypes, the Army ground-launch path converts, and the market continues paying premium multiples
              for scalable defense manufacturing; under that set of assumptions, substantial upside exists even from the
              $2.8 billion anchor. In the bear case, however, prototype work fails to convert fast enough, capital
              intensity stays high, or customer concentration persists without visible second-path diversification; then
              the valuation can compress toward a lower strategic-manufacturing or public-comp-inspired band. Comparable
              selection must therefore span both private defense-tech winners and public defense contractors. Private
              comps demonstrate how high narrative-supported values can go when investors see software, autonomy, and
              platform leverage. Public comps impose reality on terminal outcomes because they show what proven defense
              cash-flow franchises are worth in open markets. Castelion belongs somewhere between those poles—but closer
              to the lower end unless diligence upgrades evidence quality.
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
