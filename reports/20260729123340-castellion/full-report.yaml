      - number: '3.3'
        title: Capability, pricing, and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              Capability comparison is constrained by uneven public disclosure, but the main buying criteria are clear:
              range and survivability, launch-platform compatibility, unit-cost ambition, production readiness, and
              regulatory/customer trust. Public sources show Lockheed's PrSM already fits the Army's launcher and
              program-of-record logic, while LRASM and Tomahawk sit inside proven long-range strike architectures. In
              contrast, the affordable-mass entrants sell lower-cost, more rapidly manufacturable missiles that may be
              good enough for large classes of targets. Pricing evidence is partial but strategically important.
              Military Times says JASSM costs more than $1.3 million per round while the Air Force wants affordable mass
              missiles closer to $218,000, and CSIS preserves a Navy affordable hypersonic benchmark around $300,000
              versus roughly $4.5 million for LRASM. Blackbeard's public unit price is still undisclosed, which is
              itself a competitive gap: investors can see the direction of the cost thesis but not yet the proof.
              Distribution also diverges sharply. Incumbents win via decades of customer trust, existing program
              offices, and validated supply chains; entrants win by giving the Pentagon reasons to bet on cheaper,
              fixed-price volume and private-capital-backed capacity expansion.
