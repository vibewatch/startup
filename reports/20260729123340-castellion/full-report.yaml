  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - Project Ranger on time; Navy lots expand; Army GL converts; defense premium remains elevated
        - Upside from $2.8B anchor could be substantial because revenue quality and strategic scarcity both improve
        - Still exposed to safety and supply risks
        - Possible but requires multiple wins
      - - Base
        - >-
          Navy progresses gradually; Army remains optional; factory ramps with normal friction; no major compliance
          issue
        - Valuation should sit around or modestly above anchor until economics are disclosed
        - Execution and concentration risk keep multiple disciplined
        - Most plausible on current evidence
      - - Bear
        - Prototype conversion stalls; factory delay or cost overrun; financing needed before visible margin proof
        - Valuation can compress toward a lower strategic-manufacturing band and dilute prior investors
        - Customer concentration and capital intensity amplify downside
        - Material probability if milestones slip
    notes: Scenario logic is directional because core revenue and margin inputs remain private.
    claimRefs:
      - CV021
      - CV022
      - CV024
      - CV025
      - CV026
      - CV027
  - id: TV004
    title: Comparable valuation table
    enumerationScope:
      coverage: partial
      basis: >-
        Selected private defense-tech and public defense-contractor references that illuminate the band between
        narrative-premium and cash-flow-backed valuation.
    columns:
      - Comparable
      - Metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    rows:
      - - Anduril
        - Private valuation and revenue signal
        - $61B Series H in May 2026; later reported talks around $100B; 2025 revenue $2.2B
        - Upper bound for defense-tech narrative plus scaling proof
        - Far larger scale and software/platform breadth than Castelion
      - - Shield AI
        - Private valuation
        - $12.7B post-money in March 2026
        - Closer-stage private defense-tech reference with real autonomy/customer proof
        - Still more software/autonomy-heavy and globally distributed than Castelion
      - - Lockheed Martin
        - Public market cap / filing-backed prime
        - $133.06B market cap in July 2026
        - Terminal-outcome reality check for proven defense cash flows
        - Too mature to price an early factory-ramp company directly
      - - Northrop Grumman
        - Public market cap / filing-backed prime
        - $77.34B market cap in July 2026
        - Relevant for missiles/hypersonics and prime-like defense exposure
        - Public market values include decades of execution evidence
      - - General Dynamics
        - Public market cap / filing-backed prime
        - $106.18B market cap in July 2026
        - Shows valuation of diversified defense manufacturing at scale
        - Not a hypersonic pure-play and far more diversified
      - - Leidos
        - Public market cap / filing-backed defense tech
        - $14.58B market cap in July 2026
        - Useful lower-bound reminder that proven defense tech can still trade below hot private marks
        - Business mix differs materially from weapon manufacturing startup
    notes: Comps are used to bound valuation logic, not to imply a single clean multiple.
    claimRefs:
      - CV012
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Factory delay
        - Major Project Ranger readiness slip beyond planned production target
        - Undercuts scale-moat and conversion timing
        - Pause or reprice
      - - Customer conversion stall
        - No visible follow-on after current prototype / pre-production steps
        - Thesis shifts from scale-up to extended R&D
        - Reduce conviction materially
      - - Safety or compliance event
        - Any serious incident or material enforcement action
        - Raises discount rate and delays procurement confidence
        - Immediate re-underwrite
      - - Forced financing
        - Raise before clear conversion or margin proof
        - Signals capital dependence is worse than hoped
        - Demand stronger terms or step away
      - - Second path fails to emerge
        - Navy remains only monetized path for too long
        - Concentration discount should widen
        - Limit position size or wait
      - - Economics remain opaque
        - No margin / revenue-conversion disclosure in diligence
        - Price cannot be supported confidently
        - Stay in research-more bucket
    notes: Kill triggers are chosen for observability and direct transmission into valuation.
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Revenue conversion
        - Award-to-revenue bridge by program
        - Determines whether traction is accounting-real or mostly pipeline
        - Management + controller
      - - Gross margin by lot
        - Standard cost and expected margin curve
        - Core valuation driver for hardware scale-up
        - CFO + operations
      - - Current cash / burn / debt
        - Runway and covenant headroom
        - Determines financing pressure and dilution risk
        - CFO + lender materials
      - - Project Ranger commissioning
        - Spend-to-date, readiness, and yield milestones
        - Validates moat and timing assumptions
        - Operations + site leadership
      - - Program conversion gates
        - What exactly triggers Navy and Army expansion
        - Crucial for scenario probabilities
        - Business development + customer sponsor mapping
      - - Terms / preferences
        - Liquidation preferences, ratchets, or participating features
        - Entry discipline depends on actual security economics
        - Legal + financing docs
    notes: >-
      These asks are the shortest path to moving the valuation call from public inference to decision-grade
      underwriting.
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
