      - number: '5.4'
        title: Differentiation, trust, safety, and quality controls
        blocks:
          - type: paragraph
            body: >-
              Castelion's differentiation claim is consistent across official and third-party materials: faster
              design-test-build loops, more internal subsystem ownership, and a production-first mindset intended to
              yield affordable mass rather than boutique hypersonics. The company repeatedly contrasts itself with
              legacy approaches by stressing hardware-rich iteration, rapid testing, vertical integration, and scale
              manufacturing. That differentiates the product story, but it also concentrates execution risk inside the
              company. Trust and quality controls are visible more through operational posture than through externally
              certified governance. Public sources show safety-conscious roles such as EHS Site Manager, Energetics
              Safety Manager, Flight Termination System engineering, and government/community affairs for Project
              Ranger; local reporting also captures management claims that static-fire testing will comply with local
              ordinances and be engineered for neighborhood safety. Still, the retained public record does not show
              AS9100, ISO 9001, ISO 27001, SOC 2, or a published product-security framework for Blackbeard
              command-and-control interfaces. For a defense-manufacturing company, that absence does not prove weak
              controls—many details may be nonpublic—but it does create diligence gaps around supplier qualification,
              cyber resilience, quality escapes, and export/security compliance documentation. Investors should
              therefore treat the technical moat as plausible and increasingly evidenced, but not yet fully de-risked
              from a quality-assurance or production-yield standpoint.
