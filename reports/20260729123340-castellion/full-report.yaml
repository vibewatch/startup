      - number: '3.4'
        title: Moat durability, switching cost, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Castelion's moat is still more thesis than proof. The company appears differentiated on speed, vertical
              integration, and a Blackbeard-specific demand signal, but public evidence does not yet establish broad
              production superiority, sticky installed-base lock-in, or a fully defensible pricing advantage. By
              contrast, incumbents benefit from established qualification pathways, broader distribution power, and
              proven program status. At the same time, affordable-mass entrants are also benefiting from the Pentagon's
              new acquisition style, which means Castelion is not the only startup riding this policy shift. Adverse
              evidence matters: framework agreements are not guaranteed high-volume orders; actual buys remain
              contingent on testing, qualification, and congressional approval; and the same budget pressure pushing
              buyers toward Blackbeard may also push them toward cheaper cruise missiles or drone-based substitutes
              instead of hypersonics. The most realistic competitive verdict is that Castelion has a credible wedge, but
              it is competing in a market where multi-homing, incumbent retaliation, and substitute-budget leakage
              remain major risks.
