  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and permitting risk
        blocks:
          - type: paragraph
            body: >-
              Castelion operates in a product category where legal and regulatory risk is inseparable from normal
              operations. Any hypersonic strike system, associated technical data, and many of its components will
              interact with ITAR and broader export-control regimes, which means the company faces ongoing licensing,
              data-handling, end-user, and technology-security obligations even before it reaches large export volumes.
              The retained public record also shows a second regulatory layer at Project Ranger. Local reporting and
              community coverage indicate the New Mexico facility's static-fire and production footprint attracted
              public scrutiny, meaning noise, safety, and local-government approvals are not abstract issues. More
              broadly, energetic manufacturing and testing environments create obligations under workplace-safety and
              potentially chemical-process or risk-management frameworks. Public evidence does not show a current
              enforcement action or lawsuit against Castelion, but it also does not show a fully disclosed compliance
              architecture. The correct legal/regulatory posture is therefore not that the company is in trouble today,
              but that the company is operating inside several high-consequence regimes where a single misstep could
              delay programs, constrain customers, or alter valuation materially.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
