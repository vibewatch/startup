  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams, monetization logic, and recognition caveats
        blocks:
          - type: paragraph
            body: >-
              Castelion's revenue model is government-program centric and should be treated as contract-driven hardware
              commercialization rather than as subscription software or a simple product-sale business. Public evidence
              points to four monetization layers: research and development contracts that fund design, test, and
              integration work; larger development or option-bearing Navy awards; pre-production delivery orders for
              early operational capability; and a future pathway to multiyear production procurement if Blackbeard
              clears testing and validation. The company's own releases support this sequence by pairing capital raises
              with test cycles, integration milestones, and manufacturing expansion rather than with disclosed revenue
              KPIs. USAspending and company releases provide contract values, but those values should not be mistaken
              for recognized revenue because defense awards can include options, milestone timing, and deliverables that
              convert into revenue over time rather than on award date. The strongest public signal is that the business
              has moved well beyond pure R&D concept funding, yet the public record still does not reveal how much of
              the booked award base has actually flowed through the income statement.
