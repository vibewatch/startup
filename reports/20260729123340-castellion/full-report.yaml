companyProfile:
  summary: >-
    Castellion is a U.S. defense-technology company founded in 2022 to build affordable, mass-producible hypersonic
    strike systems. Public evidence centers on its Blackbeard weapon family, rapid test-and-integration cadence, and
    Project Ranger manufacturing campus in New Mexico. The company has progressed from AFRL-backed early work into Navy
    development awards and a June 2026 pre-production delivery order, but still discloses far less financial and
    customer-durability detail than investors would want for precision pricing.
  foundedDate: '2022-01-01'
  founders:
    - name: Bryon Hargis
      role: Co-founder / CEO
      background: Former SpaceX national-security business-development leader driving Castelion's affordable-mass strike thesis.
      claimRefs:
        - CO009
        - CO010
    - name: Sean Pitt
      role: Co-founder / COO
      background: >-
        Former SpaceX commercial and allied-defense sales leader supporting operational scale-up and customer
        development.
      claimRefs:
        - CO011
    - name: Andrew Kreitz
      role: Co-founder / CFO
      background: Former SpaceX FP&A and government-cost-proposal operator with aerospace-and-defense banking experience.
      claimRefs:
        - CO012
