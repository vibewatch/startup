      - number: '1.2'
        title: Founders, leadership bench, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The founder story is one of Castelion’s clearest diligence anchors. Official leadership materials and
              independent reporting align on three co-founders: chief executive Bryon Hargis, chief operating officer
              Sean Pitt, and chief financial officer Andrew Kreitz, all former SpaceX executives who left in late 2022
              to start the company. Forbes adds useful color by tracing the origin to Pentagon frustration over
              hypersonic supply and to the founders’ decision to apply SpaceX-style vertical integration and rapid
              iteration to missile production. Official biographies reinforce founder-market fit: Hargis previously led
              sales, business development, and early product definition for SpaceX national-security satellite programs;
              Pitt led European launch and human-spaceflight sales; and Kreitz handled launch forecasting,
              classified-program FP&A, and later aerospace-and-defense banking at Goldman Sachs. The broader disclosed
              bench also matters because this is a manufacturing-heavy company. Official materials name senior leaders
              for vehicle engineering, avionics, manufacturing, and seeker development with prior SpaceX, Raytheon, and
              L3Harris experience, implying an operating model built around in-house hardware execution. Governance
              transparency is weaker. Castelion does not publish a board roster, committee structure, ownership
              percentages, or investor control terms in the public materials reviewed here, so investors can underwrite
              founder competence more confidently than formal governance discipline or succession depth.
            claimRefs:
              - CO017
              - CO018
