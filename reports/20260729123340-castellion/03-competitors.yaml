- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Competitor / program
  - Price / contract model
  - Public packaging / capability signal
  - Unknowns
  - Implication
  rows:
  - - Castellion / Blackbeard
    - Framework floor after validation; unit price undisclosed
    - 500 minimum per year after validation; 12,000+ over five years sought
    - Actual unit price, realized margin, options, escalation clauses
    - Strategic story is strong but pricing proof is still hidden
  - - Air Force FAMM entrants
    - Target roughly USD 218k per missile in aggregate program context
    - 28,000 missiles over five years; up to 8,000 per year across vendors
    - Vendor-specific realized pricing and margin split
    - Cheap cruise missiles can absorb missions that would otherwise support higher-end weapons
  - - Leidos LCCM
    - Framework agreement; initial 3,000 disclosed
    - Ground launch first, maritime / air variants possible
    - Exact unit price and delivered range / performance tradeoffs
    - Shows credible competitor with public volume and self-funded development
  - - CoAspire / Zone 5 / Anduril LCCM entrants
    - Firm-fixed-price framework logic; specific prices mostly undisclosed
    - Thousands over three years; test-to-production sequencing
    - Realized per-vendor pricing, reliability, and attrition economics
    - Competition may be won on manufacturability and schedule more than brochure performance
  - - Incumbent standoff benchmarks
    - JASSM > USD 1.3M; LRASM roughly USD 4.5M in CSIS comparison
    - Mature strike capability and strong trust
    - Comparable public benchmark for Blackbeard not disclosed
    - Pricing umbrella creates room for entrants if they can prove “good enough” mission performance
  notes: Public pricing is mostly program-level or benchmark-level, not vendor-realized contract pricing. Unknowns are economically material rather than editorial gaps.
