  - - Blackbeard-specific demand signal
    - Framework agreements remain contingent on validation and appropriations
    - High
    - Request production trigger terms, cancellation rights, and funded backlog
  - - Hypersonic differentiation
    - Buyers may satisfy many targets with cheaper cruise missiles or drones
    - High
    - Map target sets that truly require hypersonic performance versus affordable substitutes
  - - Startup agility vs primes
    - Lockheed, RTX, Northrop, and L3Harris have superior trust, fielding history, and supply-chain depth
    - High
    - Assess where incumbents can respond on price, pace, or subsystem lockout
  - - Early Army/Navy traction
    - No public proof yet of broad switching cost or installed-base lock-in
    - Medium
    - Track repeat orders, win rates, and platform-specific requalification barriers over time
  notes: Risk framing reflects competitive durability rather than general company risk; threats are listed even when public evidence is incomplete because buyers can defect to substitutes without a clean head-to-head loss.
