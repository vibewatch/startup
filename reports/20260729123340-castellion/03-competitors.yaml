    - Validated customer trust, launcher fit, production history
    - Higher-cost / legacy-program posture can be slower to re-architect around affordable mass
  - - RTX / Raytheon (Tomahawk)
    - Incumbent prime
    - Public prime with mature naval strike franchise
    - Navy and joint long-range cruise strike
    - Mature fielded missile and deep customer relationships
    - Not the same low-cost, startup-speed thesis Blackbeard is selling
  - - Northrop Grumman + L3Harris
    - Incumbent subsystem / hypersonics enablers
    - Large established defense incumbents
    - Propulsion, materials, electronics, motors, warheads
    - Deep subsystem capability and production infrastructure
    - Often enable the market rather than present one clean direct-product analog
  - - Anduril / Leidos / CoAspire / Zone 5
    - Nontraditional affordable-mass entrants
    - Private-capital-backed or public-entrant set winning framework agreements
    - Low-cost cruise and containerized strike portfolios
    - Fixed-price, high-volume, open-architecture, rapid-ramp posture
    - Many programs are still contingent on testing and later production authority
  - - Ursa Major
    - Adjacent hypersonic entrant
    - Venture-backed propulsion and missile-system entrant
    - Affordable hypersonics / multi-domain launch
    - Affordability and modularity narrative close to Castelion's pitch
    - Still earlier in fielded-program maturity than large primes
  - - Status quo / internal government alternatives
    - Substitute
    - Existing programs and budget accounts
    - Any buyer solving deep strike without Blackbeard
    - No need to qualify a new startup at scale
    - Can crowd out Blackbeard without any competitor “winning” head-to-head
  notes: Scale is described qualitatively when public sources establish competitive posture but not a clean apples-to-apples funding or revenue figure.
