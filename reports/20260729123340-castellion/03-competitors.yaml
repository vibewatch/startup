  title: Competitors
summary: 'Castelion competes across three overlapping competitor classes: incumbent missile primes with programs of record (Lockheed, RTX, Northrop, L3Harris), nontraditional affordable-mass entrants now winning Pentagon frameworks (Anduril, Leidos, CoAspire, Zone 5, Ursa Major), and status-quo government solutions that can soak up the same budget without buying Blackbeard. The best evidence suggests Castelion''s edge is not sheer corporate scale but a specific product thesis—lower-cost hypersonic strike with vertical integration and faster manufacturing iteration—while the biggest competitive risk is that buyers may satisfy many target sets with cheaper cruise missiles or expanded incumbent programs before Blackbeard reaches broad production.'
sections:
- id: competitive-landscape-overview
  title: 'Landscape overview: incumbents, entrants, and substitutes'
  body: Castelion does not face one clean peer set. The competitive landscape includes incumbent missile primes with validated supply chains and installed customer trust; newer affordable-mass entrants now getting framework agreements from the Department of War; and status-quo internal government choices that expand existing programs instead of funding Blackbeard. Official U.S. procurement pages show that the same Army and departmental buyers touching Castelion also manage PrSM, long-range fires, low-cost cruise missiles, and hypersonic-enabling subsystem vendors. That means a buyer evaluating Blackbeard is often choosing among different ways to achieve deep-strike effects rather than among identical missile types. Lockheed Martin anchors the incumbent Army side via PrSM; RTX and Lockheed together anchor more mature standoff options like Tomahawk and LRASM; Northrop and L3Harris matter as propulsion and subsystem powerhouses; and Anduril, Leidos, CoAspire, Zone 5, and Ursa Major represent
    the nontraditional cohort selling affordability, open architecture, additive manufacturing, and faster production ramps. The right lens is therefore “who can credibly win strike budget, test bandwidth, and production headroom?” not just “who else says hypersonic.”
