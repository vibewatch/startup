- id: direct-competitor-profiles
  title: Direct competitor profiles by cluster
  body: Among incumbents, Lockheed Martin is the clearest Army-side benchmark because PrSM is already a mature, fielding-oriented long-range precision-strike program, and Lockheed is explicitly expanding PrSM production after Milestone C approval and operational use. RTX's Tomahawk and Lockheed's LRASM are different products but matter because they define what proven long-range strike looks like inside Navy and joint budgets. Northrop and L3Harris are not one-to-one Blackbeard mirrors, yet they are formidable because propulsion, materials, motors, avionics, and warhead capability can bottleneck the whole market. Among entrants, Leidos has already disclosed an initial 3,000-unit LCCM pathway; CoAspire is pushing its additively manufactured GHOST missile; Zone 5 is leveraging Rusty Dagger heritage and a 350-plus-person workforce; Anduril is using Barracuda to argue that cheaper weapons can be built in volume; and Ursa Major is positioning HAVOC as affordable mass hypersonics without some of
    the thermal and cost burdens of other design approaches. Castelion therefore competes partly on technical capability but equally on whether its specific product sits at the right point between price, production speed, and survivability.
