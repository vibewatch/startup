  topStrengths:
    - Market urgency, policy support, and affordable-mass procurement logic create a compelling strategic backdrop for Blackbeard.
    - Public customer proof is unusually strong for a young defense startup, including AFRL sponsorship and repeated 2026 Navy progression.
    - Project Ranger and vertical integration could create a real manufacturing moat if the company executes on time and at yield.
    - The company has already raised enough disclosed capital to build real facilities and sustain multi-service testing.
  topRisks:
    - Public evidence still lacks recognized revenue, gross margin, cash, runway, and cap-table-term detail needed for precision underwriting.
    - Customer concentration is high, with the Navy as the clearest named monetized path and limited disclosed diversification beyond prototype-stage alternatives.
    - Factory commissioning, production yield, safety/compliance, and program-conversion gates all have to work nearly in parallel.
    - Export-control, permitting, and energetic-process risk could create high-consequence delays even if the technical thesis remains intact.
    - A forced financing event before visible production conversion could materially weaken expected investor returns.
  unresolvedGaps:
    - Award-to-revenue conversion, backlog composition, and gross margin by lot or program
    - Current cash balance, burn, runway, debt terms, and any preference-stack overhang
    - Project Ranger commissioning, yield, supplier redundancy, and readiness milestones
    - Exact Navy and Army conversion gates from prototypes to scaled procurement
    - Customer breadth, retention, and any allied or export pipeline beyond public narrative
