companyProfile:
  summary: Castellion is a U.S. defense-technology company founded in 2022 to build affordable, mass-producible hypersonic strike systems. Public evidence centers on its Blackbeard weapon family, rapid test-and-integration cadence, and Project Ranger manufacturing campus in New Mexico. The company has progressed from AFRL-backed early work into Navy development awards and a June 2026 pre-production delivery order, but still discloses far less financial and customer-durability detail than investors would want for precision pricing.
  foundedDate: '2022-01-01'
  founders:
    - name: Bryon Hargis
      role: Co-founder / CEO
      background: Former SpaceX national-security business-development leader driving Castelion's affordable-mass strike thesis.
      claimRefs: [CO009, CO010]
    - name: Sean Pitt
      role: Co-founder / COO
      background: Former SpaceX commercial and allied-defense sales leader supporting operational scale-up and customer development.
      claimRefs: [CO011]
    - name: Andrew Kreitz
      role: Co-founder / CFO
      background: Former SpaceX FP&A and government-cost-proposal operator with aerospace-and-defense banking experience.
      claimRefs: [CO012]
  foundingLocation: USA
  headquarters: USA
  productSummary: Blackbeard hypersonic strike systems across air-, ground-, and potential maritime-launch pathways, supported by in-house subsystems and Project Ranger manufacturing infrastructure.
  customerFocus: U.S. defense organizations, especially Navy and AFRL/Army pathways, with future allied or maritime expansion potential but little public proof today.
  businessModel: Government-funded design, integration, testing, pre-production delivery orders, and eventual scaled production procurement for strike systems and munitions.
  stage: growth
  fundingStatus: Late-stage private defense manufacturer with a disclosed $350M Series B anchor around a $2.8B valuation after earlier seed, Series A, and venture debt capital.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO006, CO013, CE003, CU001, CV011]
summary:
  headline: 'Track: Castelion has credible strategic importance and real government traction, but public evidence still does not justify aggressive pricing without deeper diligence on economics, conversion, and factory execution.'
