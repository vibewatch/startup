  topStrengths:
    - 市场紧迫性、政策支持和可负担规模采购逻辑，为 Blackbeard 拼出了有吸引力的战略背景。
    - 对一家年轻防务初创公司，公开客户证据异常强，包括 AFRL 赞助和 2026 年 Navy 多次推进。
