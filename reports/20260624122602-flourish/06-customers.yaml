- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver / concentration risk
  - type
  - impact
  - diligence path
  rows:
  - - Interim models create first commercial surface before full Cortex AI
    - Expansion driver
    - Medium positive if a benchmarked interim product can create references and usage data
    - Request roadmap, first SKU, benchmark results, and target buyer list
  - - Unnamed chip-partner route becomes first monetization path
    - Concentration risk
    - High if first revenue depends on a single undisclosed partner or design win
    - Request partner identity, stage, conversion milestones, economics, and exclusivity terms
  - - No disclosed named customers today
    - Concentration risk
    - High because diversification cannot be demonstrated from public evidence
    - Request full customer / pilot roster with stage, ARR, and geography
  - - Power-constrained AI infrastructure market is large and motivated
    - Expansion driver
    - Medium to high if Flourish can prove materially lower energy or latency
    - Request buyer interviews with cloud, sovereign, and OEM prospects
  - - Procurement proof burden is likely long and technical
    - Concentration risk
    - High because enterprise or sovereign buyers will likely require benchmarking, security review, and integration proof
    - Request third-party benchmark pack, red-team results, and deployment architecture
  - - Adjacent vendors already expose packaging, pricing, and case studies
    - Concentration risk
    - Medium adverse because Flourish competes against easier-to-buy alternatives before it has a product
    - Request comparison of Flourish go-to-market assumptions versus Groq, BrainChip, and cloud-stack alternatives
  - - Land-and-expand from evaluation to production is possible but unproven
    - Expansion driver
    - Medium if Flourish copies a BrainChip-style evaluation-to-production path
    - Request pilot-to-production conversion assumptions and customer success plan
  notes: Risk rows distinguish between direct Flourish evidence and adjacent market structure. Impact ratings are analytical judgments based on public evidence, not company disclosures.
