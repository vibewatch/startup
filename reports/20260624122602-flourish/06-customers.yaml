- id: TU006
  title: Customer-proof evidence hierarchy and diligence asks
  columns:
  - proof layer
  - what adjacent vendors disclose
  - what Flourish discloses
  - why the gap matters
  - next diligence ask
  rows:
  - - Named accounts
    - Bell, Snap, Toyota, AES, Mercado Libre, ASICLAND
    - None publicly named
    - Without named accounts, reference quality is zero
    - Request customer / design-partner list with status
  - - Packaging / pricing
    - Groq production models and token pricing; Cerebras Free / Developer / Enterprise tiers
    - None publicly disclosed
    - Buyers cannot evaluate commercial surface or procurement fit
    - Request first product package, pricing logic, and contract form
  - - Measured outcomes
    - 4x speedups, 10,000 work-hours saved, 99% audit-cost reduction, millions in incremental revenue
    - None publicly disclosed
    - Outcome-free stories cannot establish ROI or urgency
    - Request benchmark pack and any pilot-result summaries
  - - Evaluation-to-production path
    - BrainChip describes evaluation licenses converting to production licenses
    - Unnamed chip conversation only
    - No public path from thesis to customer deployment is visible
    - Request milestone map from evaluation to deployment
  - - Retention / renewal proof
    - Mature vendors publish customer stories and sometimes production qualification claims
    - No retention metrics or renewal data
    - Durability cannot be underwritten
    - Request renewals, cohort tables, and customer-success model
