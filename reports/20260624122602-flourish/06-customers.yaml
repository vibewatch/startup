- id: retention-concentration-and-uncertainty
  title: Retention, concentration, and expansion remain investment-material unknowns
  body: 'Without named customer accounts, public contracts, or production references, Flourish’s retention and concentration profile cannot be underwritten from public evidence. There is no disclosed NRR, GRR, churn, renewal, or contract-duration data, and there is no public basis to distinguish between a future single-partner licensing business and a diversified multi-account infrastructure business. That matters because the only concrete near-term commercial hint is the unnamed chip-manufacturer discussion in Wired. If that route becomes the first revenue surface, concentration could be binary around one counterparty. If instead the company tries to sell hosted or enterprise infrastructure directly, the adjacent proxies suggest a long proof burden: benchmarking, pricing, security review, integration, and customer reference development all precede durable expansion. Adverse commentary on neuromorphic commercialization reinforces that caution, arguing that adoption can be slowed by high
    upfront costs, limited software maturity, and developer unfamiliarity. At the same time, the demand side is real: AWS, Google Cloud, and NVIDIA all market AI infrastructure around power, cost, and responsiveness, which supports the idea that a meaningful buyer problem exists if Flourish’s technical claims validate. The investment conclusion is therefore not that Flourish has weak customers; it is that public evidence still does not reveal whether it has any customers at all, and that uncertainty should be treated as a core diligence blocker rather than a temporary documentation gap.'
