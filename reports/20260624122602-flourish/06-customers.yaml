- id: TU001
  title: Customer segmentation table
  columns:
  - segment
  - buyer / user / payer
  - use case
  - scale / economic driver
  - revenue / strategic value
  - gap
  rows:
  - - Frontier-model labs / hyperscalers
    - 'Buyer: AI infra leaders; User: ML platform teams; Payer: compute / capex budgets'
    - Reduce power, latency, and infrastructure cost of model training or inference
    - Very large if a validated architecture lowers compute intensity at scale
    - Potentially highest-value segment because savings compound across large fleets
    - No named lab, cloud, or hyperscaler engagement disclosed
  - - Sovereign AI / data-center operators
    - 'Buyer: sovereign cloud or national AI operators; User: inference and platform ops; Payer: infrastructure programs'
    - Lower-power sovereign inference and domestic AI capacity
    - High where power availability constrains expansion
    - Would align with Bell/Groq-style sovereign AI procurement if Flourish becomes deployable
    - No sovereign or public-sector pilot disclosed for Flourish
  - - Semiconductor / OEM partner route
    - 'Buyer: chip or system OEM; User: silicon design and platform teams; Payer: NRE / licensing budgets'
    - Embed a Flourish-derived model or IP block onto silicon
    - Could provide earlier monetization than direct software sales
    - Most visible near-term path because Wired cites talks with a major chip manufacturer
    - Partner identity, scope, economics, and stage are undisclosed
  - - Enterprise / industrial edge AI
    - 'Buyer: enterprise innovation or operations leaders; User: robotics, autonomy, or edge-AI teams; Payer: operating budgets'
    - Use lower-power models for robotics, quality, autonomy, or on-device inference
    - Medium to high if Flourish can prove useful performance on commodity hardware
    - Adjacency exists in BrainChip and NVIDIA/Google customer stories
    - Flourish has no public product package, API, benchmark, or case study for this segment
  - - Research institutions / advanced labs
    - 'Buyer: research program leaders; User: neuroscientists and AI researchers; Payer: grant or lab budgets'
    - Early evaluation of connectomics-informed models or tooling
    - Strategically useful for validation but likely not the largest revenue source
    - Could create first reference accounts if Flourish exposes tools or interim models
    - No public design partner, academic pilot, or research-access program disclosed
  notes: Rows separate plausible future segments from proven current customers. Strategic value is inferred from adjacent infrastructure markets, not from disclosed Flourish revenue.
