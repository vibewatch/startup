      - number: '2.2'
        title: Market Sizing and Growth Trajectory
        blocks:
          - type: paragraph
            body: >-
              Three independent sizing lenses apply to Flourish at different time horizons. First, Precedence Research
              pegs the global neuromorphic computing market at $6.9B in 2024 growing to $47.3B by 2034 (21.23% CAGR),
              with North America at roughly 37% share. Second, Goldman Sachs forecasts global AI investment approaching
              $200B annually by 2025 and a potential 7% lift to global GDP over a decade if generative AI reaches
              adoption at historical rates. Third, and most structurally important for Flourish, Epoch AI documents that
              frontier training costs are growing 2.4x per year and power demand doubles annually — cost drivers that
              create a commercial ceiling for incumbent GPU-based scaling and an opening for efficiency-first
              architectures. The SemiAnalysis analysis of ChatGPT operating at $694K/day, and the projection that
              deploying an LLM at Google Search scale would consume $36B of operating income, illustrate why large
              deployers have an economic incentive to seek lower-cost inference alternatives. Market sizing for Flourish
              specifically cannot be derived at this stage: Flourish is pre-product, and no analyst firm has published a
              dedicated TAM for cortical-column AI systems. The figures below should be read as the upper-bound total
              addressable markets, not Flourish-specific estimates.
