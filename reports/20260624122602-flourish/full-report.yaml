    Flourish is a New York-based neuro-AI startup pursuing Cortex AI, a brain-inspired architecture intended to approach
    human-level intelligence with human-level efficiency. The company has assembled a high-credibility founding story
    around Thomas Reardon's Microsoft and CTRL-Labs track record, Rob Williams's Amazon operating background, and a June
