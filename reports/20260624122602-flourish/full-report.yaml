  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Flourish enters a competitive space defined by four arcs. First, neuromorphic hardware incumbents (Intel
              Loihi 2, IBM NorthPole and TrueNorth, BrainChip Akida Pico) validate the technical premise of
              brain-inspired computing but compete through custom silicon rather than software. Second, efficiency
              hardware specialists (Cerebras) compete for the same "wasteful transformers" narrative but pursue
              wafer-scale transistor density rather than biological architectural principles. Third, foundation model
              labs (Google DeepMind, Anthropic, Meta with Llama 3) are the practical near-term alternative for buyers
              who need deployable AI capacity today, defining the performance ceiling Flourish must credibly exceed.
              Fourth, publicly funded brain research programs (IARPA MICrONS, NIH BRAIN Initiative, Human Connectome
              Project, Allen Brain Atlas) are potential collaborators but also generate publicly available connectome
              data that reduces Flourish's proprietary information advantage. Numenta's HTM theory represents the
              closest historical precedent for a software-only brain-inspired AI approach and serves as a cautionary
              analogue for commercial traction risk. The absence of any competitor offering a software-only
              brain-inspired general-purpose model running on commodity hardware is Flourish's specific opportunity, but
              also its proof-of-concept burden. Flourish cannot claim uniqueness solely on concept; it must demonstrate
              benchmarked performance before incumbents replicate the approach.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
