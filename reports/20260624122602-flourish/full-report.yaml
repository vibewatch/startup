  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Boundary
        blocks:
          - type: paragraph
            body: >-
              Flourish straddles two distinct market constructs that must be kept separate for accurate sizing. The
              narrow construct is neuromorphic and brain-inspired computing hardware, a specialized silicon market in
              which chips mimic the parallel, event-driven signaling of biological neurons. The broad construct is
              efficient AI inference and training infrastructure, defined by any technology that reduces the compute,
              power, or data required to match or exceed current frontier model capability. Flourish is pursuing the
              narrow construct as its initial value proposition (a ≤50W cortical-column-inspired architecture) but its
              long-run ambition — human-level general intelligence — places it squarely in the broad construct.
              Status-quo substitutes include GPU clusters (NVIDIA H100/H200, AMD MI300), TPUs (Google), custom ASICs,
              and incremental algorithmic efficiency improvements. Adjacent spend includes sovereign AI compute
              programs, data-center power infrastructure, and continuous-learning edge AI. The addressable market
              boundary for Flourish shifts depending on product milestone: pre-chip it is effectively a research
              spinout, not a product company; post-chip it competes in inference hardware and potentially in AI model
              subscription services where power-per-task becomes a pricing lever.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM031
              - CM032
              - CM033
