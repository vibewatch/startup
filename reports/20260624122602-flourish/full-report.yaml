            body: >-
              Flourish is pre-revenue and pre-product, so its unit economics do not yet exist in a normal software
              sense. There is no disclosed ARR, no gross margin, no customer acquisition cost, no lifetime value, no
              payback period, and no sales-efficiency data. Public reporting also does not disclose burn rate, current
              cash balance, or runway. That means the core financial-health questions are not answered by company data
              but by diligence gaps and analogical estimation.


              The only defensible public estimate is directional: research-stage AI companies with 50 to 200 highly paid
              technical staff and heavy infrastructure usage often burn meaningfully before commercialization. Using
              public valuation-benchmark commentary as an analogy rather than a forecast, a burn range of roughly $5
              million to $15 million per month is plausible for a company at Flourish's ambition level, especially if
              compute, custom-chip work, legal, and recruitment all scale together. On that basis, a $500 million raise
              could imply something like three to seven years of runway, but the range is highly sensitive to headcount,
              compute intensity, and capital expenditure that Flourish has not disclosed.


              The practical implication is structural financing dependency. If the company does not achieve a
              commercially useful breakthrough inside that runway window, it will need a dilutive follow-on raise or a
              strategic rescue before revenue appears. Because no investor protections, information rights, or
              governance mechanics are public, outside observers cannot evaluate how resilient the capital structure is
              under delay.
