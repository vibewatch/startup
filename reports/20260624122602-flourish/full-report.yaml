        title: Funding History and Investor Map
        blocks:
          - type: paragraph
            body: >-
              The public financing story is unusually concentrated: multiple June 2026 reports describe Flourish closing
              roughly $500 million at a reported $2.5 billion valuation around 4 June 2026, with Jeff Bezos as the
              anchor investor. Wired reported that Bezos first committed about $50 million after reading a December 2025
              pitch memo and then nearly doubled that initial check; follow-on coverage rounded his final commitment to
              roughly $90 million to $100 million. The rest of the named syndicate consistently includes Lux Capital,
              GV, and Catalio, with some stories implying additional undisclosed backers. The terms behind that headline
              remain opaque. No Form D, cap table, debt package, board allocation, liquidation preference, or
              investor-rights summary was identified in retained public sources. That means the round is well
              corroborated as a public fact, but its control economics and even the exact legal basis for the reported
              valuation remain unresolved.
