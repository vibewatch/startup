      - number: '7.5'
        title: Mitigations, Monitoring Indicators, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Because the dominant risks are scientific and unverifiable from public evidence, the right investor
              posture is staged and monitoring-driven rather than conviction-at-entry. Mitigations are limited but real:
              the founders are hedging the long connectomics thesis with near-term models and a prospective
              chip-embedding partnership, the syndicate is credible, and the $500 million base buys multiple years of
              runway. The most important controls are monitorable triggers. An adviser- or peer-confirmed scientific
              dead end, failure to produce any independent efficiency benchmark within a defined window, failure to ship
              the near-term memory model, departure of Thomas Reardon, or non-participation by the anchor investor in a
              future round should each be treated as a thesis-break event. Competitive triggers — Groq, Cerebras, or IBM
              NorthPole extending efficiency leadership while Flourish remains pre-product, or compute scaling
              continuing to double every five to six months — should prompt reassessment of whether algorithm-layer
              efficiency can still capture value. The valuation is reported consistently at $2.5 billion across June
              2026 outlets, with some citing as high as $3.5 billion, but all trace to a single unaudited announcement,
              so any reliance on the mark is itself a monitored assumption. The Mitigation and Kill Criteria table
