      - number: '3.3'
        title: Foundation Model Incumbents and Research Programs
        blocks:
          - type: paragraph
            body: >-
              Foundation model incumbents operate at a scale and integration depth that Flourish must eventually
              displace or complement. Google DeepMind's GraphCast makes 10-day global weather forecasts with greater
              accuracy than ECMWF HRES in under one minute, and AlphaFold has predicted protein structures for over a
              million sequences, demonstrating that transformer-class techniques can solve scientific problems at
              superhuman capability. Alphabet disclosed continued heavy investment in AI research and infrastructure in
              its FY2025 annual report, representing the competitive capital context. Anthropic's Responsible Scaling
              Policy establishes AI Safety Level categories and signals that safety compliance is now a competitive
              requirement. Meta's Llama 3 family, including a 405-billion-parameter model released under Apache 2.0,
              sets a practical performance floor at near-zero marginal cost. Mistral 7B demonstrates efficiency gains
              achievable within the transformer paradigm through grouped-query and sliding-window attention, showing
              incumbents can improve efficiency without radical architecture change. Four publicly funded research
              programs are simultaneously building the science base Flourish depends on and potentially democratising
              it. IARPA MICrONS assembled the largest co-registered neurophysiological and neuroanatomical dataset from
              mammalian cortex, encompassing 100,000 neurons in a multi-petabyte open dataset. A mid-2019 proof
              demonstrated that a neurally informed algorithm outperformed the state of the art on visual-scene
              analysis. NIH BRAIN Initiative funds mapping of brain structure and function. The Human Connectome Project
              released large-scale brain connectivity datasets from hundreds of participants. The Allen Brain Atlas
              provides open neuroanatomical and transcriptomic data. These programs are credibility anchors for the
              brain-inspired thesis but also reduce Flourish's proprietary information edge. Published research on
              transformer inefficiency provides further structural context. Scaling data-constrained LMs shows that
              repeating training data beyond four epochs yields negligible loss improvement, suggesting the pure
              scale-up paradigm faces limits. ShortGPT demonstrates that many transformer layers are highly similar and
              functionally negligible, suggesting structural redundancy. Epoch AI data shows training compute has scaled
              roughly 10 times per year, reaching 10^24 to 10^25 FLOPs for frontier models.
