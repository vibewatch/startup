        title: 'Trust, safety, privacy, and compliance: pervasive gaps at pre-product stage'
        blocks:
          - type: paragraph
            body: >-
              Flourish has published no safety framework, privacy policy, data governance protocol, or compliance
              certification as of June 2026. This is consistent with the company's pre-product status but creates
              meaningful diligence gaps for any investor or future customer conducting technical or regulatory review.
              The connectomics research program involves handling biological brain tissue, which may raise bioethics
              oversight requirements depending on the source and handling protocols used; no institutional review board
              engagement or ethics policy has been disclosed. The company's AI models in development have no published
              alignment framework, no disclosed safety-testing methodology, and no responsible scaling policy analogous
              to those published by comparable AI labs such as Anthropic. There is no regulatory engagement visible in
              public evidence—no HIPAA, GDPR, FDA, or export-control filing related to Flourish's research or
              technology. Environmental impact is a separate but related gap: the AI training required to validate new
              architectures will itself carry a significant energy and carbon footprint even if the target deployment
              footprint is 20-50 watts. The training compute for frontier AI models grows at approximately 4-5× per
              year, and any architecture that requires validation against frontier tasks will encounter this cost. These
              gaps are not disqualifying at the current research stage, but they are material inputs to any
              commercialization plan and must be resolved before any regulated or enterprise deployment.
            claimRefs:
