      - number: '1.2'
        title: Leadership, Team, and Governance
        blocks:
          - type: paragraph
            body: >-
              Thomas Reardon is the central figure in the company story: he helped launch Internet Explorer at
              Microsoft, completed neuroscience training at Columbia, co-founded CTRL-Labs, and then spent years inside
              Meta Reality Labs after that company's acquisition. Rob Williams brings a different complement: public
              reporting identifies him as a former Amazon S-team executive who ran software products including Alexa and
              who helped carry the Bezos relationship into the financing process. Wired's June 2026 profile also
              describes Joshua T. Vogelstein as a cofounder-scientist, though the public narrative is most consistently
              anchored on Reardon and Williams. The advisory layer is unusually strong for such an early company: Greg
              Wayne keeps a 20 percent advisory role while also leading Project Astra at Google DeepMind, Benjamin Recht
              serves as an outside scientific adviser, and Jacob Vogelstein appears as both investor and adviser. Even
              with that depth, governance remains opaque: no public board roster, cap table, or succession framework has
              been disclosed.
