      - number: '7.2'
        title: Technology and Scientific Risk
        blocks:
          - type: paragraph
            body: >-
              Technology and scientific risk is the dominant driver of the Flourish risk profile and the hardest to
              retire. The company's core bet is that the cortical column is the canonical computational unit of the
              brain and that connectomics can extract a usable computational principle from it; neither proposition is
              settled in neuroscience. Adviser Ben Recht has publicly said he is not convinced the approach will work,
              and the developer community has challenged the brain-core-algorithm hypothesis as unscientific, likening
              neuron-for-neuron mimicry to a plane built with feathers and flappy wings. The supporting evidence is
              suggestive but thin: a fruit-fly network roughly ten times more efficient than a transformer, and the
              general argument that AI needs neuroscience. The adverse base rate is heavy. Decades of neuromorphic
              computing have produced research chips with limited commercial traction, and even IBM NorthPole's roughly
              25-fold efficiency gain is inference-only. Meanwhile AI training compute has grown about ten-billion-fold
              since 2010, doubling every five to six months, raising the risk that brute-force scaling makes
              algorithm-layer efficiency commercially irrelevant before Flourish ships. Because every efficiency claim
              is company-authored and unbenchmarked, residual technology risk is high. The risk heatmap plots these
              exposures by likelihood and impact.
