      - number: '7.3'
        title: Partner and Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              Flourish's external dependencies are few but concentrated, which raises rather than lowers risk. The most
              concrete near-term commercialization path runs through an undisclosed major chip manufacturer that Reardon
              says he is negotiating with to embed a near-term model on silicon; because neither the partner nor terms
              are public, this dependency cannot be diligenced and could collapse without warning. On the capital side,
              the syndicate is anchored by Jeff Bezos, who contributed roughly $100 million, with Lux Capital, GV
              (Alphabet), and the healthcare-focused Catalio Capital participating. That concentration means a future
              non-participation by Bezos would be a strong negative market signal, and the long seven-to-ten-year
              horizon makes Flourish unusually reliant on a small set of deep-tech investors continuing to fund a
              pre-revenue lab. The company also depends on scarce connectomics talent and specialized
              electron-microscopy equipment that had not even arrived at the time of on-site reporting. The Partner /
              Dependency Risk Register and the dependency map below enumerate these counterparties, their roles,
