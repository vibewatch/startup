  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetisation Strategy
        blocks:
          - type: paragraph
            body: >-
              Flourish's public revenue model is still hypothetical because the company remains in research mode. The
              official website presents Cortex AI as "brain-inspired algorithms for a new kind of AI," but it does not
              publish a product sheet, pricing page, customer logo, contract structure, or API documentation. WIRED's
              June 2026 reporting is explicit that Flourish has no commercial product yet, which means no current
              revenue stream can be observed or underwritten. The most credible future monetisation paths are therefore
              inferred from the product concept and surrounding reporting rather than disclosed by management.


              The likeliest primary path is B2B licensing of Cortex AI model weights, private deployments, or API access
              to enterprise and research customers that care about compute efficiency. A second possible path is
              hardware-linked revenue if reported talks with an unnamed chipmaker turn into co-development fees or
              royalties. A third possible path is licensing a narrower memory-management module if that subsystem proves
              independently useful before the full architecture is production ready. Research grants or paid
              partnerships could also emerge earlier than mainstream enterprise revenue, especially if Flourish pursues
              defense, academic, or public-sector work.


              Still, every pathway remains aspirational as of June 2026. No pricing, no go-to-market motion, no target
              gross margin, and no first-customer timeline have been disclosed. Reardon's own public framing of a
              roughly five-year breakthrough window and seven-to-ten-year horizon for major differentiation reinforces
              that the current $2.5 billion valuation is a team-and-thesis premium, not a discounted cash flow on proven
              commercial demand.
