chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Founding, and Mission
        blocks:
          - type: paragraph
            body: >-
              Flourish Inc. is a New York-based neuro-AI startup building Cortex AI, a program aimed at human-level
              intelligence with human-level efficiency. The company website is sparse but clear on two points: it is
              based in New York and it frames the mission as building human-level intelligence with human-level
              efficiency. Independent June 2026 reporting adds the more ambitious product language: Cortex AI is meant
              to match the computational capacity, learning efficiency, and power budget of the human brain, with a
              public target of roughly 20 to 50 watts and continuous learning rather than static post-training behavior.
              Public reporting is not perfectly aligned on the founding timeline, but the strongest secondary package
              points to Flourish being founded around 2024, with Bezos pitch activity accelerating in December 2025 and
              the company emerging publicly in June 2026. The latest public operating picture is still pre-product and
              pre-revenue: Flourish has no commercial launch, no disclosed customer revenue, and no public benchmark
              package proving that Cortex AI works outside the research thesis.
