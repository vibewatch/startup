      - number: '7.4'
        title: People, Execution, Timeline, and Financing Risk
        blocks:
          - type: paragraph
            body: >-
              People and execution risk compound the scientific uncertainty. Flourish is built around Thomas Reardon,
              who built Internet Explorer at Microsoft and founded CTRL-labs (sold to Meta for roughly $1 billion),
              supported by a team of only about 24 researchers as of March 2026 and senior advisers such as Greg Wayne
              who contribute part-time. This concentrates institutional knowledge in a handful of people. Execution risk
              is elevated because the company is entirely pre-product: there is no prototype, no benchmark, no published
              model, and no roadmap date, and even the near-term hippocampus-inspired memory model exists only as an
              aspiration. Timeline risk is explicit in the founders' own framing — roughly five years to a breakthrough
              and a seven-to-ten-year value horizon — which directly drives financing risk, since a $500 million base
              must fund a pre-revenue lab across that span without follow-on certainty. A scientific failure to extract
              a usable principle from cortical columns would cascade through missed milestones into impaired financing
              and a sharply lower valuation, a transmission path the risk-transmission map makes explicit. The People /
