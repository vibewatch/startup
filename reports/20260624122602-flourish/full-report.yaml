      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Regulation
        blocks:
          - type: paragraph
            body: >-
              The most powerful structural driver for efficient AI is the compute-cost wall. Epoch AI documents training
              compute growing 4.5x per year since 2010, training costs 2.4x per year since 2016, and frontier power
              demand doubling annually. These are not cyclical fluctuations; they are physics-constrained secular trends
              that will force buyers toward efficiency-first alternatives as absolute costs approach nine-figure
              territory per training run by 2027. The data-scarcity constraint reinforces this: Epoch AI estimates that
              high-quality internet text data is already largely exhausted as of 2024-2026, foreclosing the simplest
              path to continued scale-up. On the demand side, the EU AI Act (prohibitions in force since February 2025,
              with simplified enforcement agreed May 2026) and the Biden EO 14110 (October 2023) add regulatory friction
              for large-model operators, tilting marginal investment toward compliance-compliant alternatives and
              sovereign compute. Against these drivers sit four constraints: (1) neuromorphic chips have historically
              lacked on-chip learning; (2) the efficiency opportunity from algorithmic gains alone — Epoch AI documents
              halving compute requirements every 8 months — may narrow the commercial window for biological analogues;
              (3) Flourish carries scientific validation risk that no public benchmark has resolved; and (4) the capital
              intensity of tape-out partnerships and connectomics equipment narrows the field to well-capitalized
              entrants only.
            claimRefs:
