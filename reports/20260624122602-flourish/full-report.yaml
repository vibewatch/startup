      - number: '3.2'
        title: Neuromorphic Hardware Competitors
        blocks:
          - type: paragraph
            body: >-
              Four hardware companies validate the energy-efficiency thesis through custom silicon. Intel Loihi 2 is
              Intel's second-generation neuromorphic research chip, implementing spiking-neural-network inference at
              dramatically lower energy than GPU equivalents. A published benchmark demonstrates that an SSM S4D model
              running on Loihi 2 achieves 1000 times lower energy consumption, 75 times lower latency, and 75 times
              higher throughput than a recurrent implementation on Nvidia Jetson Orin Nano for token-by-token streaming.
              This validates the efficiency premise but is workload-narrow and hardware-locked. IBM NorthPole, announced
              in October 2023, demonstrates 25 times greater energy efficiency than 12 nanometre GPUs on the ResNet-50
              benchmark using a von-Neumann-free in-memory architecture. IBM chief researcher Dharmendra Modha confirmed
              NorthPole is inference-only and cannot run GPT-4-scale decoder language models. IBM TrueNorth, dating to
              2016, demonstrated 70 milliwatts for 1 million neurons and 256 million synapses and achieved deployment at
              over 30 universities and government laboratories. BrainChip's Akida Pico, launched in October 2024,
              targets ultra-low-power IoT and edge AI in the microwatt range and is commercially available. The
              strategic implication for Flourish is that hardware neuromorphic competitors validate the energy thesis
              but do not directly threaten a software-first approach targeting commodity hardware deployment. They are
              validation rather than substitutes.
            claimRefs:
              - CP006
