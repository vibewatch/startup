      - number: '1.4'
        title: Research Program, Milestones, and Open Risks
        blocks:
          - type: paragraph
            body: >-
              Flourish is not presenting itself as a finished product company; it is presenting itself as a research
              organization trying to discover a better architecture for AI. The public technical thesis centers on
              connectomics, cortical columns, continuous learning, and a hippocampus-inspired memory approach that could
              lower training-data requirements and run on far less power than current frontier systems. By end-March
              2026 the company had hired roughly two dozen neuroscientists and AI researchers and moved into a West SoHo
              office with lab space and a built-in data center, while multimillion-dollar microscopy equipment was still
              on order. That is enough to show serious intent, but not enough to remove the core risk: no retained
              public source identified a shipped product, a peer-reviewed Flourish paper, a named chip partner, or
              benchmark evidence proving the approach works. Even one of Flourish's own advisers, Benjamin Recht, has
              publicly said he is not convinced the mission will succeed.
