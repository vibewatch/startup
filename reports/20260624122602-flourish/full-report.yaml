  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Flourish operates ahead of any product, but the regulatory and legal perimeter around brain-inspired AI is
              already material. The EU AI Act (Regulation (EU) 2024/1689) is in force and would impose general-purpose
              and high-risk obligations on any Cortex AI system eventually deployed in Europe, while the voluntary NIST
              AI Risk Management Framework sets the de facto US expectation that enterprise and government buyers will
              demand. The U.S. Copyright Office has issued guidance leaving open questions about training data and
              AI-generated output that could constrain how Flourish trains and licenses models. Beyond AI-specific
              rules, the connectomics IP landscape is active: granted patents such as US20210248414A1 on automated
              mapping of features of interest signal freedom-to-operate risk for any commercial architecture derived
              from cell-level brain mapping. The most acute gap is governance: no IRB approval, bioethics board,
              biosafety protocol, or neural-data privacy analysis has been disclosed for the company's brain-tissue
              research, leaving a latent legal and reputational exposure that cannot be enumerated from public evidence
              alone. The Regulatory / Legal Risk Register below ranks these exposures by severity and records the
              diligence path for each.
            claimRefs:
              - CR025
              - CR026
              - CR027
              - CR028
              - CR029
