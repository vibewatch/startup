callouts:
- calloutType: risk
  title: Team-Thesis Valuation with No Revenue Anchor
  body: 'Flourish''s $2.5B valuation is entirely based on the founding team''s pedigree, Thomas Reardon''s CTRL-Labs exit, and the strategic urgency of energy-efficient AI. No discounted cash flow model is possible: there is no revenue, no product, no customer, no pricing, and no product roadmap. A Berkeley adviser directly quoted by WIRED stated that he is not convinced it is going to work. This is a high-risk research bet.'
  claimRefs:
  - CI006
  - CI024
  - CI025
  - CI026
  - CI027
  - CI036
- calloutType: insight
  title: Structural Financing Dependency
  body: Flourish's ability to execute is dependent on continued access to capital over a 5-10 year horizon. With $500M raised and no revenue path for at least several years, the company likely needs at least one additional financing round before commercialization. A breakthrough missed on the founder's timeline directly raises the probability of a re-raise at an adverse valuation moment.
  claimRefs:
  - CI018
  - CI019
  - CI028
  - CI037
  - CI038
