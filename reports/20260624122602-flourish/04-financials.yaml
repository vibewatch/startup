  evidenceGaps:
  - id: EG1
    type: private-evidence-only
    severity: critical
    topic: financial-health
    missingEvidence: Flourish's actual burn rate, cash balance, headcount, and operational budget
    whyItMatters: Determines true runway; if burn rate is $20M+/month, $500M funds only 25 months, which would be insufficient for the 5-year breakthrough timeline.
    diligencePath: Request audited cash position, monthly P&L, headcount breakdown, and compute spend from company CFO or counsel.
    relatedQuestionRefs:
    - QI003
    - QI008
  - id: EG2
    type: private-evidence-only
    severity: critical
    topic: capital-structure
    missingEvidence: Cap table with percentage ownership, board rights, anti-dilution provisions, and investor governance rights
    whyItMatters: Without a cap table, investors cannot assess dilution risk, founder incentives, or whether major investors have blocking rights that constrain future financing.
    diligencePath: Request standard venture data-room materials including cap table, investor rights agreement, and term sheet from the most recent round.
    relatedQuestionRefs:
    - QI002
    - QI011
  - id: EG3
    type: stale
    severity: high
    topic: investor-context
    missingEvidence: 2026 portfolio performance and risk-appetite signals from Lux Capital, GV, and Catalio for pre-revenue deep-tech positions
    whyItMatters: If key investors have had recent portfolio write-downs or fund-cycle pressure, follow-on capital commitment reliability may be lower than the current syndicate composition suggests.
    diligencePath: Review each firm's 2026 fund announcements, LP reports, and portfolio company news; ask each investor for follow-on commitment intent for Flourish.
