callouts:
  - calloutType: risk
    title: No validated prototype after founding in 2024
    body: >-
      Flourish was founded in 2024 and raised $500 million in June 2026 with no prototype, no published
      architecture, no benchmark results, and no commercial engagement. The gap between neuroscience
      research and deployable AI architecture is the company's single largest technical risk, and the
      timeline to first validated output—estimated at five years by co-founder Reardon—implies significant
      capital consumption before any commercial proof exists.
    claimRefs:
      - CE011
      - CE016
      - CE039
  - calloutType: strength
    title: Architecture-layer approach creates asymmetric upside if connectomics hypothesis validates
    body: >-
      If Flourish successfully extracts computationally useful principles from cortical column maps, the
      result would be an AI architecture that runs on commodity silicon at human-brain power levels. This
      is not incremental to existing approaches—it bypasses the GPU scaling race entirely. The fruit fly
      connectome finding (10× efficiency vs. transformer) suggests the underlying biological reference
      designs do encode meaningful efficiency gains, providing a plausible empirical motivation for the
      research direction.
    claimRefs:
      - CE003
      - CE005
      - CE006
      - CE032
  - calloutType: assumption
    title: Architecture-layer efficiency gain assumes connectomics-to-algorithm translation is tractable
    body: >-
      The entire Flourish thesis depends on a single assumption: that biological neural circuit maps can
      be translated into artificial intelligence architectures that run efficiently on silicon. This
      translation has no validated precedent at commercial AI scale. The fruit fly connectome result is
      encouraging but involves a 302-to-100,000-neuron system, orders of magnitude below the billions of
      parameters in frontier AI models.
    claimRefs:
      - CE004
      - CE005
      - CE010
      - CE039
