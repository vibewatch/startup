chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Flourish is a pre-product, pre-revenue research lab building Cortex AI, a brain-inspired AI architecture
    system targeting 20-50 watts of operation—roughly human-brain efficiency and an order of magnitude below
    a server-grade GPU. The company's core technical bet is connectomics: using in-house electron microscopes
    to map biological neural circuits at cellular resolution, then extracting computational principles from
    cortical columns to inform new AI architectures. No prototype, published model, patent, or safety
    framework exists as of June 2026. All product claims are company-stated and unverifiable from public
    evidence alone.
sections:
  - id: section-cortex-definition
    title: 'Cortex AI product definition: a brain-inspired architecture system at pre-product, pre-revenue stage'
    body: >-
      Flourish is building Cortex AI, which the company defines as the first synthetic intelligence system
      designed to match the computational capacity, learning efficiency, and power budget of the human brain.
      The product definition is deliberately architecture-level rather than application-level: Flourish is not
      building a chip, a chat interface, a model API, or enterprise software. It is developing the algorithmic
      layer that would sit above existing silicon hardware and enable AI to run at dramatically lower energy.
      As of June 2026, Cortex AI does not exist in any form available for external use. There is no product
      page, no API, no pricing, no pilot program, and no commercial engagement. The company is a deep
      research lab with approximately 24 neuroscientists and AI researchers on staff and a $500 million capital
      base to fund multi-year experimentation. The only tangible milestones disclosed are a company launch in
      June 2026 and a New York City office space with a built-in data center. Lab equipment including
      electron microscopes had not yet arrived at the time of Wired's on-site visit. In parallel with the
      foundational neuroscience research, Reardon disclosed that the team is developing near-term AI models
      as intermediate products, including a hippocampus-inspired memory mechanism intended to allow
      continuous learning without extensive retraining data, and that he is negotiating with a major chip
      manufacturer to embed one such model on silicon. These near-term paths represent hedged bets that the
      core connectomics thesis will take years to mature. The central risk for any product diligence is that
      every product claim is company-authored, and the gap between the research aspiration and a
      shippable product is not narrowed by any public technical milestone.
    claimRefs:
