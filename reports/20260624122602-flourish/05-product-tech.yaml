  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: Cortex AI technical architecture
      missingEvidence: >-
        No technical specification, architecture document, whitepaper, or published model
        describes how Flourish proposes to translate connectomics data into deployable AI
        architecture.
      whyItMatters: >-
        Without any technical proof, the architecture-layer efficiency claim cannot be
        evaluated; the entire investment thesis rests on unverifiable founder assertions.
      diligencePath: >-
        Request technical briefing from Flourish; ask for any internal architecture document,
        research paper in preparation, or benchmark result; evaluate against published neuromorphic
        benchmarks such as those from IBM TrueNorth or Intel Loihi.
      relatedQuestionRefs:
        - QE003
        - QE023
    - type: missing-source
      severity: material
      topic: chip manufacturer partnership identity and terms
      missingEvidence: >-
        The chip manufacturer Reardon is negotiating with has not been disclosed; no term
        sheet, LOI, or commercial term has been published.
      whyItMatters: >-
        The chip partnership is the most concrete near-term commercialization path; its
        absence from public evidence makes revenue timeline modeling impossible.
      diligencePath: >-
        Request partner disclosure under NDA; examine term sheet; assess whether
        semiconductor manufacturer can provide genuine distribution advantage.
      relatedQuestionRefs:
        - QE013
    - type: missing-source
      severity: blocking
      topic: bioethics and IRB oversight for connectomics research
      missingEvidence: >-
        No institutional review board engagement, ethics committee approval, or biosafety
        protocol has been disclosed for Flourish's brain tissue research program.
      whyItMatters: >-
        Research involving biological neural tissue typically requires IRB oversight;
        absence of any disclosure is a potential legal and reputational risk for investors
        and eventual enterprise customers.
      diligencePath: >-
        Request copies of any IRB approvals, ethics board memberships, or biosafety
        protocols; confirm tissue source (animal vs. human); verify compliance with
        applicable regulations.
      relatedQuestionRefs:
        - QE014
    - type: missing-source
      severity: material
      topic: AI safety and alignment framework
      missingEvidence: >-
        No safety testing protocol, responsible scaling policy, alignment specification,
        or data governance framework has been published for Flourish's AI models.
      whyItMatters: >-
        Enterprise and government customers will require safety documentation before
        any deployment; absence at this stage is a future compliance cost and reputational risk.
      diligencePath: >-
        Request draft safety policy; compare to Anthropic and OpenAI responsible scaling
        frameworks; assess whether the team includes safety-focused researchers.
      relatedQuestionRefs:
        - QE018
        - QE024
