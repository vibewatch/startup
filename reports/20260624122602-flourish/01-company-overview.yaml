    Archive.ph URL (SO004) and two HN threads (SO007, SO008) returned rate-limited or blocked responses (429/CAPTCHA). These sources are cited for community sentiment and secondary archival context only; all primary factual claims are backed by successfully fetched sources. Fetching was attempted via the fetch-url skill with STARTUP_FETCH_LOG_PATH exported; the access failures are documented in accessStatus fields as rate-limited.
