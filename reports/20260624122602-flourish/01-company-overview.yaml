    missingEvidence: |
      Individual investor check sizes, equity stakes, board seat allocations, liquidation preferences, and governance rights for all Flourish investors.
    whyItMatters: |
      Without cap table details, the actual control structure, economic incentives, and investor influence on long-term mission durability cannot be assessed.
    diligencePath: |
      Request investor summary from Flourish directly; review any SEC filings if company has filed a Form D (likely); request a cap table from company in due diligence.
