callouts:
- calloutType: risk
  title: Open-Source Replication Risk
  body: >-
    Even if Flourish achieves a brain-inspired algorithm breakthrough, the dominant AI publication
    and open-release norm, exemplified by Llama 3 (405B parameters, Apache 2.0) and Mistral 7B
    (Apache 2.0), means any architecture may be rapidly replicated by the community before Flourish
    can build a defensible commercial position. No disclosed patent strategy makes this risk acute.
  claimRefs:
  - CP017
  - CP035
- calloutType: insight
  title: White Space and Proof-of-Concept Burden
  body: >-
    Despite significant investment from Intel, IBM, and IARPA in neuromorphic hardware, and from
    Numenta in HTM theory, no competitor has demonstrated a software-only brain-inspired model
    that runs on commodity hardware and matches transformer performance on general-purpose benchmarks.
    This is Flourish's specific opportunity, but also its proof-of-concept burden. The absence of
    a proven prior art means the market will demand benchmarks, not just narrative.
  claimRefs:
  - CP005
  - CP038
  - CP037
