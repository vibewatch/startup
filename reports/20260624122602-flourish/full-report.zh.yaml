      - number: '7.2'
        title: 技术和科学风险
        blocks:
          - type: paragraph
            body: >-
              技术和科学风险主导 Flourish 的风险画像，也最难消除。公司的核心赌注是：皮质柱是大脑的标准计算单元，connectomics 能从中提取可用的计算原则；这两个命题在神经科学中都没有定论。顾问 Ben
              Recht 公开表示，他不确信这条路线会成功；开发者社区也质疑“脑核心算法”假说不科学，把逐神经元模仿类比为用羽毛和拍打翅膀造飞机。支撑证据有启发性但很薄：一个果蝇网络大约比 transformer
              高效十倍，以及 AI 需要神经科学的一般性论点。负面基准率很重。数十年的神经形态计算产出了商业牵引有限的研究芯片；即便 IBM NorthPole 约 25 倍的效率提升，也仅限推理。与此同时，AI 训练算力自
              2010 年以来增长约一百亿倍，每五到六个月翻倍，带来一个风险：在 Flourish 出货前，蛮力 scaling
              可能让算法层效率在商业上变得无关紧要。由于每个效率主张都由公司自行提出且未经基准测试，剩余技术风险很高。风险热力图按可能性和影响绘制这些敞口。
