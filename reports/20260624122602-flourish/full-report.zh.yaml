      - CR016
      - CR022
      - CR017
  - id: FR003
    title: 依赖图 — Flourish 关键外部依赖
    type: dag
    layout: wide
    summary: DAG 展示 Flourish 依赖的关键外部方和资源，暴露单一来源与集中度风险。
    data:
