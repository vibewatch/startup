      - number: '5.2'
        title: 架构与运营模式：连接组学、皮层柱，以及架构层效率赌局
        blocks:
          - type: paragraph
            body: >-
              Flourish 的技术路线以连接组学为基础——用电子显微镜逐细胞系统绘制生物神经连接——并把它作为 AI
              架构设计的主要输入。其假设是，大脑皮层的信息处理电路，尤其是皮层柱，编码了当前人工神经网络未能捕捉的缺失参考设计。皮层柱是贯穿哺乳动物皮层六层的垂直神经元束，被广泛视为大脑的标准计算单元。Flourish
              联合创始人 Joshua Vogelstein 最近共同署名研究，显示 Drosophila（果蝇）连接组运行其神经网络的效率是 transformer 架构的 10 倍；transformer
              是大型语言模型的骨架，这一发现直接推动了公司的研究方向。此前大规模连接组学工作，尤其是 IARPA 资助的 MICrONS
              项目，曾用电子显微镜成功绘制了完整一立方毫米小鼠视觉皮层，证明规模化技术可行。Flourish 正在用数百万美元级电子显微镜搭建内部连接组学能力，生成专有神经电路图，而不是依赖 Allen Brain Atlas
              或 Human Connectome Project 等项目的公开学术数据集。运营架构由四个阶段组成：神经组织成像、电路重建、算法提取和 AI 模型开发。关键在于，公司不走硅路线：Groq 和 Cerebras
              在芯片设计层优化 AI 效率；Flourish 押注，由真实生物电路启发的算法设计，可以在通用硬件上取得更大的效率提升。人脑约使用 20 瓦，而单块 NVIDIA H100 GPU 满载约 700
              瓦。Flourish 的 20-50 瓦目标，意味着相对 H100 基线提升 14-35 倍，但这一主张没有独立验证。架构层赌局在科学上合理，但尚未在商业 AI
              工作负载所需规模上得到证明；从连接组图谱转译为可部署架构，本身也是一个开放研究问题。
