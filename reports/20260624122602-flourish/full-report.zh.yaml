      - number: '4.2'
        title: 资本结构与投资人格局
        blocks:
          - type: paragraph
            body: >-
              Flourish 的资本结构在公开层面由一轮异常大的私募融资和极少量其他信息定义。多家独立媒体报道，公司在 2026 年 6 月以约 $2.5B 估值融资约 $500M。WIRED 和 Economic
              Times 都把 Jeff Bezos 描述为核心支持者；据称，随着财团成形，他的个人承诺从约 $50M 增至约 $100M。Lux Capital 被描述为领投方，GV 和 Catalio Capital
              也参投。这个组合重要，因为它把一家深科技风投、一家大型科技公司创投部门、一家偏神经科技和生命科学的投资人，以及一位愿意个人下注研究的亿万富翁创始人放在同一张表上。


              投资人匹配度与论点一致。Lux 公开将自己定位于前沿科学和工程。GV 长期投资软件、基础设施和 AI 企业。Catalio 的神经和生命科学取向，对一家核心叙事依赖神经科学可信度的类脑 AI
              初创公司异常相关。Bezos 带来信号能力和耐心资本，但也制造光环风险，因为即便商业证明缺席，他的参与也会放大估值动量。


              Thomas Reardon 此前 CTRL-Labs 以据报 $500M 到 $1B 退出给
              Facebook，是市场愿意容忍这里论点阶段溢价的最清晰公开理由。即便如此，公开记录没有披露持股比例、董事会席位、期权池规模、清算优先权或稀释轨迹。标题融资得到充分交叉印证；实际控制经济性仍不透明。
