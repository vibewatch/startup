  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险
        blocks:
          - type: paragraph
            body: >-
              Flourish 尚未推出任何产品，但受大脑启发 AI 周围的监管和法律边界已经很重要。EU AI Act（Regulation (EU) 2024/1689）已经生效，任何最终在欧洲部署的 Cortex AI
              系统都可能承担通用型和高风险义务；自愿性的 NIST AI Risk Management Framework 则设定了美国企业和政府买方实际会要求的事实标准。U.S. Copyright Office
              已发布指引，但训练数据和 AI 生成输出仍有未决问题，可能约束 Flourish 训练和授权模型的方式。AI 专门规则之外，connectomics IP 版图也很活跃：US20210248414A1
              这类关于自动映射感兴趣特征的授权专利，提示任何源自细胞级大脑映射的商业架构都存在自由实施风险。最尖锐的缺口是治理：公司没有披露任何 IRB
              批准、生物伦理委员会、生物安全协议或神经数据隐私分析，覆盖其脑组织研究；这留下了无法仅凭公开证据枚举的潜在法律和声誉敞口。下方监管 / 法律风险登记表按严重性排序这些敞口，并记录每项的尽调路径。
