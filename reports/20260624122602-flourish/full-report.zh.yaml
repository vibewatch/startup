      - number: '3.2'
        title: 神经形态硬件竞争对手
        blocks:
          - type: paragraph
            body: >-
              四家硬件公司通过定制硅验证能效论点。Intel Loihi 2 是 Intel 第二代神经形态研究芯片，实现了尖峰神经网络推理，能耗大幅低于 GPU 等效方案。一项已发表基准显示，在 Loihi 2 上运行的
              SSM S4D 模型，相比 Nvidia Jetson Orin Nano 上逐 token 流式处理的循环实现，能耗低 1000 倍、延迟低 75 倍、吞吐高 75
              倍。这验证了效率前提，但工作负载很窄且锁定硬件。IBM NorthPole 于 2023 年 10 月发布，使用无冯·诺依曼的内存内架构，在 ResNet-50 基准上比 12 纳米 GPU 能效高 25
              倍。IBM 首席研究员 Dharmendra Modha 确认，NorthPole 只做推理，不能运行 GPT-4 规模的 decoder 语言模型。IBM TrueNorth 可追溯至 2016 年，曾以 70
              毫瓦支持 100 万个神经元和 2.56 亿个突触，并部署到 30 多所大学和政府实验室。BrainChip 的 Akida Pico 于 2024 年 10 月推出，瞄准微瓦级超低功耗 IoT 和边缘
              AI，且已经商业可用。对 Flourish 的战略含义是，硬件神经形态竞争对手验证了能效论点，但不直接威胁以通用硬件部署为目标的软件优先路线。它们更像验证者，而非替代品。
