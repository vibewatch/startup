              - CM001
          - type: callout
            title: 品类商业化风险
            body: >-
              反向：神经形态芯片多次未能实现商业规模。IBM TrueNorth（2014）和 Intel Loihi 缺少片上学习；批评者称这条路「not going to pan out」。Flourish
              必须跨过这段历史模式，才能触达上文识别的买方分层。
