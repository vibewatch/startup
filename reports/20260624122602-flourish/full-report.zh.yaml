      - number: '2.4'
        title: 增长驱动、采用约束与监管
        blocks:
          - type: paragraph
            body: >-
              高效 AI 最强的结构性驱动是算力成本墙。Epoch AI 记录到，2010 年以来训练算力每年增长 4.5 倍，2016 年以来训练成本每年增长 2.4
              倍，前沿电力需求每年翻倍。这些不是周期波动，而是受物理约束的长期趋势；到 2027 年，单次训练绝对成本接近九位数时，买方会被迫转向效率优先的替代方案。数据稀缺约束进一步强化这一点：Epoch AI 估计，到
              2024-2026 年，高质量互联网文本数据基本已经耗尽，最简单的继续扩展路径被封死。需求侧，EU AI Act（禁令自 2025 年 2 月生效，2026 年 5 月同意简化执行）和 Biden EO
              14110（2023 年 10
              月）给大模型运营商增加监管摩擦，边际投资因此倾向更合规的替代方案和主权算力。与这些驱动相对的是四项约束：（1）神经形态芯片过去一直缺少片上学习；（2）单靠算法收益带来的效率机会——Epoch AI
              记录到算力需求每 8 个月减半——可能缩短生物类比方案的商业窗口；（3）Flourish 承担尚无公开基准解决的科学验证风险；（4）流片合作和连接组学设备资本强度高，使进入者只剩资金充足的团队。
