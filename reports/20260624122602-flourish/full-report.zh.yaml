    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 展示买方问题到生产扩张的可能路径，并标出 Flourish 仍缺少公开证明的环节。
    data:
      nodes:
        - label: 1. 买方痛点被识别
          detail: 云、主权和企业运营方在 AI 基础设施市场中，会围绕功耗、成本和延迟明确采购。
          tone: neutral
        - label: 2. Flourish 论点吸引关注
          detail: 以人类级智能、人类级效率为使命级承诺，足以激起战略好奇心。
          tone: neutral
        - label: 3. 需要评估界面
          detail: 买家通常会先看到模型、API、基准包或芯片评估路径，才会推进接触。
          tone: risk
        - label: 4. 试点或设计伙伴阶段
          detail: 邻近厂商会披露具名评估或早期部署关系；Flourish 尚未公开披露这类信息。
          tone: risk
        - label: 5. 生产部署
          detail: 代理案例显示，具名基础设施落地、客户引述或生产许可转化会成为证明。
          tone: positive
        - label: 6. 续约与扩张
          detail: 经得住时间的客户证明，需要可见结果、重复使用和多账户增长；Flourish 目前尚未披露。
          tone: risk
    approximationNotes: 该证明旅程模型由邻近基础设施厂商综合而来，并非 Flourish 报告的漏斗。
    claimRefs:
      - CU011
      - CU012
      - CU015
      - CU036
      - CU037
      - CU042
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 展示广泛的潜在买家类别，如何收缩到 Flourish 公开披露部署为零。
    data:
      items:
        - label: 从公开问题陈述推断的潜在买家类别
          value: 4
        - label: 管理层讨论过的公开商业化界面
          value: 2
        - label: 公开披露的具名伙伴讨论
          value: 1
        - label: 公开披露的具名试点或生产部署
          value: 0
        - label: 公开续约 / 留存证明点
          value: 0
    approximationNotes: 计数反映公开证据类别，而非内部管线指标。
    claimRefs:
