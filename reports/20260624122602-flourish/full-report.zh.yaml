  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立与使命
        blocks:
          - type: paragraph
            body: >-
              Flourish Inc. 是一家位于纽约的 neuro-AI 初创公司，正在构建 Cortex
              AI，目标是以人类级效率实现人类级智能。公司官网信息很少，但两点明确：公司位于纽约，并把使命表述为打造具有人类级效率的人类级智能。2026 年 6 月的独立报道补上了更具野心的产品表述：Cortex AI
              旨在匹配人脑的计算能力、学习效率和功耗预算，公开目标约为 20 到 50 瓦，并强调连续学习，而不是训练后静态运行。公开报道对创立时间并不完全一致，但最有力的二级材料指向 Flourish 约在 2024
              年成立，Bezos 相关路演活动在 2025 年 12 月加速，公司于 2026 年 6 月公开亮相。最新公开运营图景仍是无产品、无收入：Flourish 尚未商业发布，没有披露客户收入，也没有公开基准测试包证明
              Cortex AI 在研究论点之外可行。
