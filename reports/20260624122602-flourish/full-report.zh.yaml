      - number: '2.2'
        title: 市场规模与增长轨迹
        blocks:
          - type: paragraph
            body: >-
              Flourish 在不同时间尺度上适用三套独立测算视角。第一，Precedence Research 估算全球神经形态计算市场 2024 年为 $6.9B，到 2034 年增至 $47.3B（CAGR
              21.23%），北美约占 37%。第二，Goldman Sachs 预测，到 2025 年全球 AI 投资将接近每年 $200B；如果生成式 AI 以历史速度普及，十年内可能把全球 GDP 抬高
              7%。第三，也是对 Flourish 最具结构性意义的一点，Epoch AI 记录到前沿训练成本每年增长 2.4 倍，电力需求每年翻倍——这些成本驱动因素会为现有 GPU
              扩展设置商业天花板，也为效率优先架构打开窗口。SemiAnalysis 对 ChatGPT 每天 $694K 运营成本的分析，以及在 Google Search 规模部署 LLM 将消耗 $36B
              运营收入的预测，说明大型部署方为什么有经济动机寻找低成本推理替代方案。现阶段无法为 Flourish 单独推导市场规模：Flourish 尚无产品，也没有分析机构发布过皮层柱 AI 系统的专门
              TAM。下方数字应理解为可服务市场总量上限，而非 Flourish 专属估算。
