      - number: '3.3'
        title: 基础模型既有玩家与研究项目
        blocks:
          - type: paragraph
            body: >-
              基础模型既有玩家的规模和集成深度，是 Flourish 最终必须替代或补充的对象。Google DeepMind 的 GraphCast 可在一分钟内完成 10 天全球天气预报，准确性超过 ECMWF
              HRES；AlphaFold 已为超过一百万条序列预测蛋白质结构，证明 transformer 级技术能以超人能力解决科学问题。Alphabet 在 FY2025 年报中披露，仍在 AI
              研究和基础设施上重金投入，这构成竞争资本背景。Anthropic 的 Responsible Scaling Policy 建立 AI Safety Level 类别，表明安全合规现在已是竞争要求。Meta 的
              Llama 3 家族，包括一个以 Apache 2.0 发布的 4050 亿参数模型，把近零边际成本下的实用性能地板定了出来。Mistral 7B 通过 grouped-query 和
              sliding-window attention 展示了 transformer 范式内部也能获得效率提升，说明既有玩家不必彻底换架构也能提高效率。四个公共资助研究项目同时在构建 Flourish
              依赖的科学基础，也可能使其民主化。IARPA MICrONS 组装了来自哺乳动物皮层的最大共配准神经生理与神经解剖数据集，覆盖 100,000 个神经元，是一个多 PB 级开放数据集。2019
              年中期的一项证明显示，神经信息启发算法在视觉场景分析上超过当时最先进方法。NIH BRAIN Initiative 资助脑结构和功能图谱绘制。Human Connectome Project
              发布了来自数百名参与者的大规模脑连接数据集。Allen Brain Atlas 提供开放神经解剖和转录组数据。这些项目为类脑论点提供可信度锚点，也削弱 Flourish 的专有信息边际。关于
              transformer 低效的已发表研究进一步提供结构性背景。Scaling data-constrained LMs 显示，训练数据重复超过四个 epoch 后，loss
              改善微乎其微，暗示纯扩展范式面临边界。ShortGPT 显示，许多 transformer 层高度相似且功能上可忽略，说明结构冗余存在。Epoch AI 数据显示，训练算力约每年扩展 10 倍，前沿模型已达到
              10^24 到 10^25 FLOPs。
