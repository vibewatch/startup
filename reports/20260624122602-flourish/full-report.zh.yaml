  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >-
              Flourish 跨在两个必须分开测算的市场构造上。狭义构造是神经形态和类脑计算硬件，这是一个专用硅市场，芯片模拟生物神经元的并行、事件驱动信号。广义构造是高效 AI
              推理与训练基础设施，涵盖任何能降低算力、功耗或数据需求、同时匹配或超过当前前沿模型能力的技术。Flourish
              把狭义构造作为初始价值主张（≤50W、受皮层柱启发的架构），但长期野心——人类级通用智能——使它正落在广义构造里。现状替代品包括 GPU 集群（NVIDIA H100/H200、AMD
              MI300）、TPU（Google）、定制 ASIC，以及渐进式算法效率改进。相邻支出包括主权 AI 算力项目、数据中心电力基础设施，以及连续学习边缘 AI。Flourish
              的可服务市场边界取决于产品里程碑：芯片前，它本质上是研究衍生项目，不是产品公司；芯片后，它会在推理硬件中竞争，并且可能进入 AI 模型订阅服务，因为单任务功耗会变成定价杠杆。
