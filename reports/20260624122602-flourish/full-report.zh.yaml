  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、反论点和建议
        blocks:
          - type: paragraph
            body: >-
              Flourish 的投资论点形态很直接，不确定性却极端：如果源自生物学和 connectomics 的架构能把 AI 能源效率提升一个数量级，奖池就非常大；团队履历——打造 Internet
              Explorer、并以约 $1 billion 将 CTRL-labs 卖给 Meta 的 Thomas Reardon——加上由 Jeff Bezos 锚定、Lux、GV 和 Catalio
              参与的财团，使这笔赌注足够可信，可以按风险投资尺度定价。Scientific American 对大脑极低能耗的描述，捕捉了这个奖池的规模。反论点同样清楚：公司没有产品、没有收入，“脑核心算法”前提受到顾问
              Ben Recht 公开怀疑，也被开发者社区挑战；数十年的神经形态计算历史说明，这类效率提升走向商业现实有多慢。权衡之后，建议是继续研究，而不是买入：信心为中，风险评级为高。估值立场有支撑但依赖论点——$2.5
              billion 标记可由团队履历和 SSI 类比支撑，但完全建立在无法验证的主张之上。入场纪律应要求独立效率基准或明确里程碑先出现，再投入资本。建议摘要、正反论点表和建议逻辑图将这一推理形式化。
