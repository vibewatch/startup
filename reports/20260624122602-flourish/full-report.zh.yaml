  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Flourish 进入的竞争空间由四条弧线界定。第一，神经形态硬件既有玩家（Intel Loihi 2、IBM NorthPole 和 TrueNorth、BrainChip Akida
              Pico）验证了类脑计算的技术前提，但它们通过定制硅竞争，而非软件。第二，效率硬件专家（Cerebras）争夺同一个「浪费型
              transformers」叙事，但走的是晶圆级晶体管密度路线，而不是生物架构原则。第三，基础模型实验室（Google DeepMind、Anthropic、拥有 Llama 3 的 Meta）是近期需要可部署
              AI 能力买方的实际替代方案，也定义了 Flourish 必须可信超越的性能天花板。第四，公共资助的脑研究项目（IARPA MICrONS、NIH BRAIN Initiative、Human
              Connectome Project、Allen Brain Atlas）是潜在合作方，同时也产生公开可用的连接组数据，削弱 Flourish 的专有信息优势。Numenta 的 HTM 理论是纯软件类脑 AI
              路线最接近的历史先例，也为商业牵引风险提供警示性类比。目前没有竞争对手提供可在通用硬件上运行的纯软件类脑通用模型，这是 Flourish 的特定机会，也是它的概念验证负担。Flourish
              不能只凭概念声称独特；在既有玩家复刻方法之前，它必须展示经过基准测试的性能。
