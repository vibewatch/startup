      - number: '4.4'
        title: 财务判断与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              从财务看，Flourish 是一场纯论点驱动的下注。当前估值没有收入、利润率、合同或可见产品路线图支撑；它靠 Thomas Reardon 的声誉、他此前 CTRL-Labs 退出、降低 AI
              能耗的战略紧迫性，以及 Bezos 支持财团的信号效应支撑。Economic Times 直接捕捉了这一点，把估值描述为押注创始人专业能力，以及行业需要另一种答案来解决 AI 能源问题。


              这个叙事有真实战略逻辑，但下行也异常集中。WIRED 纳入 Berkeley 顾问 Ben Recht 的引语——他并不确信这会成功——是一个重要反向信号，因为它来自接近公司的可信技术声音。Hacker News
              讨论置信度较低，但方向相关：它把该论点与早期 connectionism 周期相比，那些周期从未产出稳定、可测试的核心算法。Numenta 作为神经科学启发 AI 公司长期未出现可比商业突破，也是另一个警示先例。


              决定性阻碍全是缺失的私有指标：烧钱速度、现金余额、产品时间表、股权表、董事会结构、合同管线、专利位置，以及任何经基准测试的效率增益证据。因此，本章无法有信心地估算投资人回报或承销资本充足性。正确结论不是机会不可能，而是公开财务表面太薄，最多只能支持一个研究阶段期权视角。
