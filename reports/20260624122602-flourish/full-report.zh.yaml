      - number: '5.4'
        title: 信任、安全、隐私与合规：无产品阶段的普遍缺口
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，Flourish
              没有发布安全框架、隐私政策、数据治理协议或合规认证。这与公司尚无产品的状态一致，但也给任何开展技术或监管审查的投资人和未来客户留下重要尽调缺口。连接组学研究项目涉及处理生物脑组织，视来源和处理协议而定，可能触发生物伦理监督要求；公司没有披露机构审查委员会参与或伦理政策。公司正在开发的
              AI 模型没有已发布 alignment 框架、未披露安全测试方法，也没有类似 Anthropic 等可比 AI 实验室发布的 responsible scaling
              policy。公开证据中看不到监管接触——没有与 Flourish 研究或技术有关的 HIPAA、GDPR、FDA 或出口管制备案。环境影响是另一个独立但相关的缺口：即便目标部署功耗是 20-50
              瓦，用于验证新架构的 AI 训练本身仍会带来显著能源和碳足迹。前沿 AI 模型训练算力约每年增长 4-5
              倍，任何需要在前沿任务上验证的架构都会遇到这项成本。这些缺口在当前研究阶段不构成直接否决，但它们是任何商业化计划的重要输入，必须在进入受监管或企业部署前解决。
