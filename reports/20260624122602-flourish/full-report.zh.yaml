        - 尚无产品、无收入；估值带有投机性
        - 在出现基准或里程碑前不要投入资本
      - - 信心
        - 中
        - 融资报道一致，但科学不可验证
        - 将结论视为暂定，并密切监测
      - - 风险评级
        - 高
        - 假设未经验证、7-10 年周期、仅有一次公告
        - 任何敞口都只应按创投期权定规模
      - - 估值立场
        - 有支撑（取决于论点）
        - 履历和 SSI 类比支撑价格；基本面不支撑
        - 要求入场纪律绑定效率基准
      - - 时间周期
        - 7-10 年
        - 创始人自己给出的突破和价值兑现框架
        - 为流动性不足和多轮稀释做准备
    notes: 所有评估都是针对一家尚无产品公司的分析师判断；估值来自 2026 年 6 月一次未经审计的公告。
