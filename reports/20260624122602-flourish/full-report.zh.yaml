          - type: paragraph
            body: >-
              近期退出准备度低：创始人自己给出五年突破时间线和七到十年价值周期，因此任何流动性事件都很远，并取决于科学进展，而不是商业牵引。这让持续监控成为核心纪律。论点破裂触发器包括：顾问或同行确认皮质柱原则走入科学死胡同；未能发布近期海马体启发模型；锚定投资人在未来轮次不参与；竞争对手取得效率突破；以及算力
              scaling 继续侵蚀算法层效率的价值。每一项都应促使评级转向熊市情景。监管敞口——尤其是已生效的 EU AI
              Act——会增加未来商业化和合规成本，一旦部署任何产品，可能削弱退出论点。最终尽调问题很具体：拿独立技术基准对照神经形态和 transformer
              基线；确认芯片制造商伙伴的身份和条款；取得脑组织研究的治理、IRB 和生物伦理证据；拿到完整 cap
              table，包括清算优先权栈和稀释路径。二级市场标记和任何未来折价轮定价应作为领先指标追踪。论点破裂和最终尽调问题表列出这些事项的阈值和负责人。
