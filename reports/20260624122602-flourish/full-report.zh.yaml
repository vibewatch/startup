              Flourish 并不把自己包装成一家成品公司；它把自己定位为研究机构，试图为 AI
              找到更好的架构。公开技术论点围绕连接组学、皮层柱、连续学习，以及一种受海马体启发的记忆方法展开；如果成立，训练数据需求可下降，功耗也会远低于当前前沿系统。到 2026 年 3
              月底，公司已招聘约二十多名神经科学家和 AI 研究人员，并迁入 West SoHo
              办公室，里面有实验室空间和内置数据中心；数百万美元级显微设备当时仍在订购中。这足以说明投入认真，但不足以消除核心风险：保留的公开来源没有发现已交付产品、经同行评审的 Flourish
