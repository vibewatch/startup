              Williams 展开。顾问层对一家如此早期的公司来说异常强：Greg Wayne 保留 20% 的顾问角色，同时在 Google DeepMind 领导 Project Astra；Benjamin Recht
              担任外部科学顾问；Jacob Vogelstein 既是投资人也是顾问。即便有这层厚度，治理仍不透明：公司没有披露公开董事会名单、股权表或继任框架。
