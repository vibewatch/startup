  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Cortex AI 产品定义：一家尚无产品、尚无收入公司的类脑架构系统
        blocks:
          - type: paragraph
            body: >-
              Flourish 正在构建 Cortex AI；公司将其定义为第一个合成智能系统，目标是匹配人脑的计算能力、学习效率和功耗预算。这个产品定义刻意停留在架构层，而非应用层：Flourish
              不是在做芯片、聊天界面、模型 API 或企业软件。它开发的是位于现有硅硬件之上的算法层，让 AI 能以大幅更低的能耗运行。截至 2026 年 6 月，Cortex AI
              没有任何可供外部使用的形态。没有产品页、没有 API、没有定价、没有试点项目，也没有商业接触。公司是一家深度研究实验室，约有 24 名神经科学家和 AI 研究人员，资本基础为
              $500M，用来支持多年实验。唯一披露的有形里程碑，是公司在 2026 年 6 月发布，以及纽约市一处带内置数据中心的办公空间。Wired
              到现场采访时，包括电子显微镜在内的实验设备尚未到位。与基础神经科学研究并行，Reardon 披露团队正在开发近期 AI
              模型作为中间产品，包括一个受海马体启发的记忆机制，旨在无需大量再训练数据也能支持连续学习；他还在与一家大型芯片制造商谈判，希望把其中一个模型嵌入硅中。这些近期路径是对核心连接组学论点需要多年成熟的一种对冲下注。任何产品尽调的中心风险在于，所有产品主张都来自公司自己，研究愿景与可交付产品之间的距离没有被任何公开技术里程碑缩短。
