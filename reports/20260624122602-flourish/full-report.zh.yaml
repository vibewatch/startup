              方法不适用；这个价格是押注科学结果的期权溢价。最诚实的表述是风险投资期权性，而不是从基本面承保的估值标记。公开证据既不确认也不反驳该价格：它确认老练投资人愿意支付这个价格，这有信息量，但不等于基本面支撑。在 7
              到 10 年周期和多轮未来融资中，入场投资人还应预期显著稀释和清算优先权悬顶，后者可能侵蚀普通股回报；CB Insights 2026 年分析也提示收入前 AI
