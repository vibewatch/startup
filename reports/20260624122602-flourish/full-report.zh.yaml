              Thomas Reardon 是公司故事的核心人物：他曾帮助 Microsoft 推出 Internet Explorer，在 Columbia 完成神经科学训练，共同创立
              CTRL-Labs，并在该公司被收购后进入 Meta Reality Labs 工作多年。Rob Williams 补上另一种能力：公开报道将他描述为前 Amazon S-team 高管，曾负责包括 Alexa
