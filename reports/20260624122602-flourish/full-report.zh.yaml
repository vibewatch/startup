      - number: '3.4'
        title: 护城河分析与差异化耐久性
        blocks:
          - type: paragraph
            body: >-
              Flourish 的护城河落在两项主张上：一支具备跨学科神经科学和工程深度、竞争对手难以快速复制的团队，以及以通用硬件为目标的纯软件类脑 AI 先发优势。两项主张都合理，但面临实质威胁。Thomas
              Reardon 的 CTRL-Labs 在 2019 年以据报 $500M 到 $1B 退出给 Facebook，构成正当的先验信誉；他的 Columbia 神经科学博士背景，加上 Rob Williams
              的工程深度，形成了创始团队案例。不过，Google DeepMind 雇有数十名神经科学家，并以远超 Flourish 总融资额的预算运行类脑研究项目。Numenta 的 HTM 理论是最直接先例，发展 15
              年以上后通过 Cortical.io 在 NLP 获得授权收入，但没有产出生产级通用 AI，这是一个真正的警示案例。WIRED 引述的一位 Berkeley
              顾问直说，他并不确信这会成功；考虑到该顾问的神经科学专长，这个信号应有权重。以 Apache 2.0 下的 Llama 3 和 Apache 2.0 下的 Mistral 7B 为代表的开源 AI
              规范意味着，一旦 Flourish 发表任何算法突破，社区可能快速复刻。IARPA MICrONS 公开发布连接组数据集，削弱 Flourish 原本可能声称的数据护城河。截至 2026 年 6
              月，Flourish 没有披露专利组合、待审专利申请或正式 IP 策略。未验证算法、未披露 IP 保护、竞争对手的开放科学规范，以及创始人估计 5
              年才能突破，合在一起意味着：护城河作为概念有吸引力，但在公司发展当前阶段，作为持久优势结构偏薄。
