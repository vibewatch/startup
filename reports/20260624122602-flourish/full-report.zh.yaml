            body: >-
              Flourish 2024 年创立，2026 年 6 月融资 $500M，但没有原型、没有已发布架构、没有基准结果，也没有商业接触。神经科学研究与可部署 AI 架构之间的距离，是公司最大的单一技术风险；联合创始人
              Reardon 估计首个已验证输出需要五年，意味着任何商业证明出现前都会消耗大量资本。
