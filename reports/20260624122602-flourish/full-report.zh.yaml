  - id: FV002
    title: 估值敏感性 — 估值标记的驱动因素
    type: bar
    layout: standard
    summary: 关键驱动因素对隐含估值指数（基准 = 100）的示意性敏感性；柱状图只显示方向性幅度。
    data:
      items:
        - label: 效率突破得到验证
          value: 600
        - label: 近期模型发布
          value: 140
        - label: 基准情景（入场估值标记）
          value: 100
        - label: 算力扩展侵蚀护城河
          value: 55
        - label: 科学停滞 / 下轮降估值
          value: 20
    approximationNotes: 指数值是分析师的示意性估计（基准 = 100），锚定 SSI 估值跃升和熊市情景的降估值，并非精确预测。
    claimRefs:
      - CV013
      - CV017
      - CV019
      - CV020
      - CV042
  - id: FV003
    title: 估值 / 回报区间 — 低 / 基准 / 高
    type: range
    layout: standard
    summary: 在熊市（低）、基准（中）和牛市（高）情景下，以十亿美元计的示意性估值区间。
    data:
      items:
        - label: 隐含估值（$B）
          low: 0.5
          mid: 2.5
          high: 15
        - label: 入场到退出倍数（x）
          low: 0.2
          mid: 1
          high: 6
        - label: 科学成功概率（%）
          low: 10
          mid: 30
          high: 55
    approximationNotes: 区间是分析师的示意性估计，锚定 SSI 可比公司和熊市情景的降估值；不是公司指引。
    claimRefs:
      - CV008
      - CV017
      - CV018
      - CV019
      - CV042
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: wide
    summary: 面向 IC 的 0-10 分评分，覆盖市场、证明、护城河、经济性、风险、估值和证据质量。
    data:
      items:
        - label: 市场规模 / 奖池
          value: 9
          note: 数量级 AI 效率提升对应非常大的奖池
        - label: 执行证明
          value: 2
          note: 产品前、无基准、无收入
        - label: 护城河 / 差异化
          value: 5
          note: 算法层路线不同，但尚未证实
        - label: 单位经济性
          value: 1
          note: 没有收入或成本数据
        - label: 风险画像
          value: 2
          note: 假设存在争议；7-10 年周期
        - label: 估值支撑
          value: 4
          note: 履历和 SSI 类比；缺乏基本面
        - label: 证据质量
          value: 3
          note: 单一未经审计公告；没有独立证明
    approximationNotes: 评分是分析师对产品前公司的 0-10 分判断。
    claimRefs:
      - CV036
      - CV005
      - CV016
      - CV031
      - CV023
