              可比公司集只能按阶段和创始人履历匹配，而不是按基本面匹配。Safe Superintelligence 是最接近的类比：一家产品前实验室，2024 年估值约 $5 billion，仅凭创始人履历，到 2025
              年走向 $30 billion，给出约六倍的合理牛市重估边界。在前沿实验室上限处，Anthropic 2026 年 5 月估值接近 $965 billion，xAI 2025 年 3 月估值接近 $80
              billion、收入约 $3.2 billion；但二者都有产品出货，Flourish 没有。芯片侧，Groq 以约 $500 million 收入支撑约 $2.8 billion 估值，公开交易的
              Cerebras 约 $510 million 收入和 $87 million 净利润（可通过 SEC EDGAR S-1 披露核验），展示了同等表面估值下，真实产品和收入应是什么样。IBM NorthPole
              证明受大脑启发的效率在狭窄推理中可实现，支撑非零牛市概率；神经形态计算缓慢的商业史则压住基准情景。转化为情景：牛市假设五年内出现可展示突破，并出现类似 SSI
              的估值上调；基准假设近期模型出货，价值大致守在入场附近；熊市假设科学停滞并发生陡峭折价轮。KPI 记分卡给市场规模和团队质量高分，但执行证明和经济性拉低综合评分；论点破裂和尽调表把分析转化为可监控触发器和问题。
