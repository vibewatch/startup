      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              Flourish 的买方图景分成两个时间队列。近期买方（1-3 年）以研究驱动为主：学术实验室、政府项目（DARPA、NIH、DOE），以及为探索性算力工作提供资金的超大规模云厂商 R&D
              部门。这些买方看科学严谨性、发表记录和顾问网络——Flourish 目前约二十多名神经科学家组成的团队和顾问名单，使它在这些维度表现不错。中期买方（3-7 年）则更商业化：推理基础设施运营商、边缘 AI
              设备制造商、半导体 IP 授权方，以及大规模部署 AI、面临电力成本天花板的企业软件公司。采用路径需要通过两道闸门：第一，经同行评审的演示，证明皮层柱架构在有边界任务上以小得多的功耗优于
              transformers；第二，在商业工艺节点上流片并达到量产良率。截至 2026 年 6 月，两道闸门都没有通过。付费意愿最高的是推理运营成本已按 SemiAnalysis
              超过初始训练投资的超大规模云厂商。近期买方的预算归属在 VP 级研究负责人和 CTO 办公室；中期买方还会加入 CFO 和采购审批，因为硅流片和长周期能源合同资本强度高。
