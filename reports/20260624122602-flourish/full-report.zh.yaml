  - id: FV001
    title: 建议逻辑 — 从证据到判断
    type: flow
    layout: wide
    summary: 流程图展示市场奖池、执行证明、科学风险和价格如何共同导向 research-more 建议。
    data:
      nodes:
        - id: rl1
          label: 巨大但未证实的效率奖池
        - id: rl2
          label: 执行证明薄弱（产品前、无收入）
        - id: rl3
          label: 高科学风险（假设存在争议）
        - id: rl4
          label: 投机性 $2.5B 价格（单次公告）
        - id: rl5
          label: 履历 + SSI 类比支撑价格
        - id: rl6
          label: 建议：research-more（中等信心，高风险）
        - id: rl7
          label: 入场取决于独立基准或里程碑
      edges:
        - from: rl1
          to: rl6
        - from: rl2
          to: rl6
        - from: rl3
          to: rl6
        - from: rl4
          to: rl6
        - from: rl5
          to: rl6
        - from: rl6
          to: rl7
    claimRefs:
