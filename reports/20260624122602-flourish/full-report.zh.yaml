  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 目标客户分层可以推断，但只能从 Flourish 想解决的问题反推
        blocks:
          - type: paragraph
            body: >-
              Flourish Inc. 不公开 ICP deck、产品目录或客户名单，因此要拆分它未来的客户，只能从公司使命和已经为低功耗 AI 付费的相邻市场交叉推断。官网称 Flourish
              在用人类级效率打造人类级智能；Wired 和 The Next Web 的报道则把它描述为一项受大脑启发的架构尝试，目标是在算法层降低 AI
              能耗，而不是卖一颗新芯片。这个定位至少指向四类可能买方。第一类是前沿模型实验室、hyperscaler 和托管推理运营商；用户团队是 ML 基础设施工程师，付款来自算力或平台预算。第二类是主权 AI
              或企业数据中心运营商，需要更低延迟、更低功耗和更好的大规模推理经济性。第三类是芯片或系统 OEM，前提是 Flourish 通过 IP 或模型嵌入商业化，而不是直接托管软件。第四类是工业或边缘 AI
              项目，前提是后续产品变成面向机器人、自主系统或设备端推理的低功耗模型栈。上述细分尚未在 Flourish 自身身上得到验证。它们来自 AWS、Google Cloud、NVIDIA
              以及相邻商业同行已经记录的采购痛点：成本、功耗和响应速度。关键尽调点在于，买方、用户和付款方很可能随市场进入路径而变，客户发现难度高于一句使命宣言所暗示的水平。
