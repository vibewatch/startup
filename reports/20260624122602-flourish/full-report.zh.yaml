            body: >-
              人才和执行风险会叠加科学不确定性。Flourish 围绕 Thomas Reardon 搭建；他曾在 Microsoft 打造 Internet Explorer，并创立 CTRL-labs（以约 $1
              billion 卖给 Meta）。截至 2026 年 3 月，公司只有约 24 名研究人员，高级顾问 Greg Wayne
              等人还只是兼职参与。这让机构知识集中在少数人手中。执行风险被拉高，因为公司完全处在产品前阶段：没有原型、没有基准、没有已发布模型，也没有路线图日期；就连近期受海马体启发的记忆模型也只是愿景。创始人自己的表述明确给出时间线风险——约五年取得突破，七到十年价值周期——这直接驱动融资风险，因为
              $500 million
              基础资金必须在没有后续融资确定性的情况下，支撑一家收入前实验室跨越这段时间。若科学上无法从皮质柱中提取可用原则，里程碑会随之错失，融资受损，估值大幅下调；风险传导图把这条路径明确呈现。人才 /
