        title: 伙伴和依赖风险
        blocks:
          - type: paragraph
            body: >-
              Flourish 的外部依赖不多但高度集中，这提高而不是降低了风险。最具体的近期商业化路径，要经过一家未披露的大型芯片制造商；Reardon
              称他正与对方谈判，把一个近期模型嵌入硅片。由于伙伴和条款都不公开，这项依赖无法尽调，也可能在没有预警时崩塌。资本侧，财团由 Jeff Bezos 锚定，他贡献了约 $100 million，Lux
              Capital、GV（Alphabet）和专注医疗健康的 Catalio Capital 参与。集中度意味着，若 Bezos 未来不跟投，会成为强烈负面市场信号；漫长的 7 到 10 年周期也让 Flourish
              异常依赖少数 deep-tech 投资人持续资助一家收入前实验室。公司还依赖稀缺的 connectomics 人才和专用电子显微设备，而现场报道时这些设备甚至尚未到位。下方伙伴 /
