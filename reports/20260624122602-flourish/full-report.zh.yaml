      - number: '4.3'
        title: 单位经济与财务健康
        blocks:
          - type: paragraph
            body: >-
              Flourish 尚无收入、尚无产品，因此在普通软件意义上的单位经济尚不存在。没有披露
              ARR、毛利率、获客成本、生命周期价值、回本周期或销售效率数据。公开报道也没有披露烧钱速度、当前现金余额或现金跑道。这意味着核心财务健康问题无法由公司数据回答，只能由尽调缺口和类比估算回答。


              唯一可辩护的公开估算是方向性的：拥有 50 到 200 名高薪技术人员、且重度使用基础设施的研究阶段 AI 公司，商业化前往往会显著烧钱。把公开估值基准评论作为类比而非预测，Flourish
              这种野心水平的公司月度烧钱约 $5M 到 $15M 是合理的，尤其是在算力、定制芯片工作、法律和招聘同步扩张时。按这个基础，$500M
              融资可能意味着大约三到七年现金跑道，但区间对人员规模、算力强度和资本开支高度敏感，而 Flourish 并未披露这些信息。


              实际含义是结构性融资依赖。如果公司不能在现金跑道窗口内实现具有商业用途的突破，在收入出现前就需要一轮稀释性后续融资或战略救援。由于投资人保护、信息权或治理机制均未公开，外部观察者无法评估延误时资本结构的韧性。
