  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现策略
        blocks:
          - type: paragraph
            body: >-
              Flourish 的公开收入模式仍是设想，因为公司还处在研究模式。官网把 Cortex AI 表述为「brain-inspired algorithms for a new kind of
              AI」，但没有发布产品页、价格页、客户 logo、合同结构或 API 文档。WIRED 2026 年 6 月报道明确指出，Flourish
              还没有商业产品，也就是说当前没有可观察或可承销的收入流。最可信的未来变现路径，只能从产品概念和周边报道推断，而非由管理层披露。


              最可能的主路径，是向重视算力效率的企业和研究客户提供 Cortex AI 模型权重、私有化部署或 API 访问的 B2B
              授权。第二条可能路径是硬件绑定收入：如果据报与一家未具名芯片厂商的谈判变成联合开发费或版税。第三条可能路径是，如果某个子系统在完整架构达到生产可用前先被证明独立有用，则授权一个更窄的记忆管理模块。研究资助或付费合作也可能早于主流企业收入出现，尤其是如果
              Flourish 追求国防、学术或公共部门工作。


              不过，截至 2026 年 6 月，所有路径仍是愿景。公司没有披露定价、上市动作、目标毛利率或首个客户时间表。Reardon 公开给出的约五年突破窗口，以及七到十年形成重大差异化的周期，进一步说明当前 $2.5B
              估值是团队和论点溢价，不是对已验证商业需求的贴现现金流。
