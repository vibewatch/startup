              没有具名客户账户、公开合同或生产引用，Flourish 的留存和集中度画像无法靠公开证据承保。公司没有披露
              NRR、GRR、流失、续约或合同期限数据，也没有公开依据可区分未来业务到底是单一伙伴授权，还是多账户分散的基础设施业务。这很重要，因为唯一具体的近期商业线索，是 Wired
              提到的未具名芯片制造商讨论。若这条路径成为第一块收入表面，集中度可能围绕一个交易对手呈二元化。若公司改为直接销售托管或企业基础设施，相邻代理又提示它要背很长的证明负担：基准测试、定价、安全审查、集成和客户引用建设，都排在可持续扩张之前。关于神经形态商业化的负面评论强化了这种谨慎，认为高前期成本、软件成熟度有限和开发者陌生度会拖慢采用。与此同时，需求侧真实存在：AWS、Google
              Cloud 和 NVIDIA 都围绕功耗、成本和响应速度营销 AI 基础设施，这支持了一个判断——若 Flourish 的技术主张得到验证，确实存在有意义的买方问题。因此，投资结论不是 Flourish
              客户弱，而是公开证据仍未揭示它是否有任何客户；这种不确定性应被视为核心尽调阻塞点，而不是一时的文档缺口。
