      - number: '7.5'
        title: 缓释、监控指标和终止标准
        blocks:
          - type: paragraph
            body: >-
              主导风险是科学性的，且无法从公开证据验证，因此正确的投资姿态应是分阶段、由监控驱动，而不是入场即确信。缓释有限但真实：创始人用近期模型和潜在芯片嵌入合作来对冲长期 connectomics
              命题，财团可信，$500 million 基础资金也能买来多年现金续航。最重要的控制项是可监控触发器。若顾问或同行确认科学死胡同、在设定窗口内未能产出任何独立效率基准、未能发布近期记忆模型、Thomas
              Reardon 离职，或锚定投资人在未来轮次不参与，都应视为论点破裂事件。竞争触发器——Groq、Cerebras 或 IBM NorthPole 在 Flourish 仍处产品前阶段时扩大效率领先，或算力
              scaling 继续每五到六个月翻倍——应促使重新评估算法层效率还能否捕获价值。2026 年 6 月多家媒体一致报道估值为 $2.5 billion，部分称最高 $3.5
              billion，但全部追溯到一份未经审计的公告，因此任何对该估值标记的依赖本身也是一个需监控的假设。缓释和终止标准表把每个顶级风险转化为可衡量触发器和行动含义。
