      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 继续研究，而不是买入：任何入场都应以独立效率基准为门槛
            body: >-
              Flourish 以 $2.5 billion 定价，押注一个有争议的科学假说；公司没有产品、没有收入，周期长达 7-10 年。估值只能由团队履历和 SSI
              的产品前类比支撑。纪律性姿态是继续研究，信心为中、风险评级为高；只有在独立效率基准或明确里程碑确认核心 thesis 后，才投入资本。
            calloutType: recommendation
            claimRefs:
              - CV014
              - CV016
              - CV025
              - CV040
          - type: callout
            title: 估值是风险投资期权性，不是基本面承保的标记
            body: >-
              因为没有收入，常规收入法或 DCF 方法不适用，所有可比对象都有很大局限。$2.5 billion 反映的是老练投资人在一轮未经审计融资中支付的价格；上行受 SSI
              估值上调约束，下行则取决于若科学停滞时可能出现的陡峭折价轮。
            calloutType: assumption
            claimRefs:
              - CV004
              - CV031
              - CV033
              - CV044
