  - id: FR001
    title: 风险热力图 — Flourish 风险组合的可能性与影响
    type: matrix
    layout: wide
    summary: 热力图按可能性（列）和影响（行）绘制 Flourish 的重大风险；右上角单元格最关键。
    data:
      columns:
        - label: 低
        - label: 中
        - label: 高
      rows:
        - label: 关键影响
          values:
            - ''
            - 效率目标无法达成
            - 科学路线走入死胡同（皮层柱）
        - label: 高影响
          values:
            - NIST AI RMF 带来买家摩擦
            - 算力扩展侵蚀护城河
            - 时间线 / 融资超支
        - label: 中等影响
          values:
            - 专利自由实施空间
            - 近期记忆模型延迟
            - 关键人才流失
    approximationNotes: 可能性与影响是定性分析师判断；这家产品前公司没有精算数据。
    claimRefs:
      - CR009
      - CR006
      - CR016
      - CR017
      - CR028
      - CR032
      - CR026
  - id: FR002
    title: 风险传导图 — Flourish 风险如何流向融资与估值
    type: dag
    layout: wide
    summary: DAG 展示科学与执行风险如何层层传导，导致里程碑落空、融资受损和估值压缩。
    data:
      nodes:
        - id: rt1
          label: 科学假设失败（皮层柱）
        - id: rt2
          label: 没有可用的效率架构
        - id: rt3
          label: 里程碑落空 / 无基准
        - id: rt4
          label: 后续融资受损
        - id: rt5
          label: 下轮融资降估值 / 估值压缩
        - id: rt6
          label: 关键人物离职（Reardon）
        - id: rt7
          label: 招聘与可信度受损
        - id: rt8
          label: 竞争对手扩大效率领先
      edges:
        - from: rt1
