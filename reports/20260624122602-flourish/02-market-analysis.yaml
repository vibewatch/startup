    - Neuromorphic and brain-inspired computing hardware
    - $6.9B (2024) → $47.3B (2034); Precedence Research; CAGR 21.23%
  - - Primary Market (broad)
    - Efficient AI inference and training infrastructure
    - No formal unified TAM; spans GPU alternatives, ASICs, model efficiency services
  - - Status-Quo Substitutes
    - NVIDIA GPU clusters, Google TPUs, AMD accelerators, custom ASICs
    - Dominant; ~95% of current AI compute runs on GPU/TPU architectures
  - - Adjacent Markets
    - Edge AI, sovereign compute, data-center power infrastructure, continuous-learning models
    - Adjacent addressable; not directly entered by Flourish as of June 2026
  - - Excluded Spend
    - General-purpose cloud IaaS, analytics software unrelated to AI training/inference
    - Too broad and already commoditized; not Flourish-relevant
  - - Key Verticals (near-term)
    - Research labs, DARPA/DOE programs, hyperscaler R&D
    - Pre-product buyers; evaluate on scientific track record and bench demonstrations
  - - Key Verticals (medium-term)
    - Inference infrastructure operators, semiconductor IP licensors, enterprise AI deployers
    - Commercial buyers; evaluate on cost-per-inference, power-per-task, production yield
  - - Technology Layer
    - Hardware (chip architecture), firmware/compiler stack, model architecture (Cortex AI)
    - Flourish targets all three layers; public evidence only at model/architecture layer
  notes: All sizing from Precedence Research unless noted; neuromorphic market boundary excludes general AI software; status-quo
    substitutes (GPU clusters) represent ~95% of current AI compute spend.
