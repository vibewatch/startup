  evidenceGaps:
  - id: gap-M001
    gapType: missing-source
    topic: flourish-specific-market-sizing
    description: No analyst has published a dedicated TAM or SOM for cortical-column AI architectures specifically; all sizing
      is extrapolated from adjacent neuromorphic hardware and AI infrastructure markets. This gap blocks definitive Flourish-specific
      SOM derivation.
    relatedQuestionRefs:
    - QM026
  - id: gap-M002
    gapType: private-evidence-only
    topic: chip-tape-out-competitive-economics
    description: The capital cost structure of Flourish's intended chip program — tape-out costs, foundry partner terms, process
      node compatibility — is not publicly disclosed. Blocks comparison with Intel Loihi and IBM TrueNorth R&D spend and assessment
      of capital adequacy.
    relatedQuestionRefs:
    - QM027
  - id: gap-M003
    gapType: stale
    topic: 2026-ai-investment-levels
    description: Goldman Sachs AI investment forecasts cite 2023 data; more current 2026 data on actual investment levels
      is not captured in retained sources. AI investment trajectory may have shifted following regulatory changes and market
      developments.
    relatedTableRefs:
    - TM002
  - id: gap-M004
    gapType: missing-source
    topic: algorithmic-efficiency-hardware-window-model
    description: No retained source provides a quantitative model comparing the rate of algorithmic-only efficiency gains
      with hardware-efficiency gains to determine whether software improvements will close Flourish's commercial window before
      chip readiness. This is the central competitive displacement risk and remains unmodeled in public literature.
    relatedQuestionRefs:
    - QM024
  - id: gap-M005
    gapType: private-evidence-only
    topic: current-hyperscaler-efficiency-contracts-2026
    description: Current hyperscaler procurement decisions and vendor evaluations for neuromorphic or efficiency-first AI
      chips in 2026 are not publicly disclosed, making buyer intent analysis speculative rather than evidence-based.
    relatedQuestionRefs:
    - QM028
