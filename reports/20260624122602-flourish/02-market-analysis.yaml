- id: buyer-and-segment-analysis
  title: Buyer Segmentation and Adoption Path
  body: 'The buyer landscape for Flourish divides into two temporal cohorts. Near-term buyers (1-3 year horizon) are research-driven:
    academic labs, government programs (DARPA, NIH, DOE), and the R&D arms of hyperscalers that fund exploratory compute work.
    These buyers evaluate on scientific rigor, publication record, and advisory networks — all areas where Flourish currently
    performs well given its team of roughly two dozen neuroscientists and its adviser roster. Medium-term buyers (3-7 year
    horizon) are commercial: inference infrastructure operators, edge AI device makers, semiconductor IP licensors, and enterprise
    software companies that deploy AI at scale and face power-cost ceilings. Adoption path requires two gateways: first, a
    peer-reviewed demonstration that cortical-column architectures outperform transformers on a bounded task at a fraction
    of the power; second, fabrication on a commercial process node at production yield. Neither gateway has been cleared as
    of June 2026. Willingness to pay is highest among hyperscalers whose inference operating costs already exceed initial
    training investment per SemiAnalysis. Budget ownership for near-term buyers lies with VP-level research heads and CTO
    offices; medium-term buyers add CFO and procurement sign-off given the capital intensity of silicon tape-outs and long-horizon
    energy contracts.'
  claimRefs:
  - CM004
  - CM017
  - CM030
  - CM031
  - CM038
