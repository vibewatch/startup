  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: Cortex AI technical architecture and benchmark
      missingEvidence: No prototype, benchmark, published model, or technical specification substantiates the 20-50 watt efficiency claim.
      whyItMatters: The entire technology and valuation thesis rests on unverifiable founder assertions; without a benchmark the central efficiency risk cannot be retired.
      diligencePath: Request an independent technical evaluation under NDA, including any internal benchmark against IBM NorthPole, Intel Loihi, or transformer baselines.
      relatedQuestionRefs:
        - QR030
    - type: missing-source
      severity: material
      topic: Regulatory / Legal Risk Register completeness and IRB/bioethics oversight
      missingEvidence: No IRB approval, bioethics board, biosafety protocol, or jurisdiction-specific compliance analysis for brain-tissue research has been disclosed.
      whyItMatters: Brain-tissue and neural-data work typically triggers ethics and privacy oversight; absence is a latent legal and reputational risk and leaves the regulatory register only partially enumerable.
      diligencePath: Request copies of any IRB approvals, ethics memberships, tissue-source documentation, and an EU AI Act / NIST AI RMF readiness assessment.
      relatedQuestionRefs:
        - QR025
      relatedTableRefs:
        - TR001
    - type: missing-source
      severity: material
      topic: undisclosed chip manufacturer partnership terms
      missingEvidence: The identity and commercial terms of the chip manufacturer Reardon is negotiating with are not public.
      whyItMatters: This is the most concrete near-term commercialization dependency, and its opacity makes revenue-timeline and dependency modeling impossible.
      diligencePath: Request the term sheet or LOI under NDA and assess whether the partner provides genuine distribution advantage.
