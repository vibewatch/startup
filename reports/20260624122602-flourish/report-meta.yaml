companyProfile:
  summary: "Flourish is a New York-based neuro-AI startup pursuing Cortex AI, a brain-inspired architecture intended to approach human-level intelligence with human-level efficiency. The company has assembled a high-credibility founding story around Thomas Reardon's Microsoft and CTRL-Labs track record, Rob Williams's Amazon operating background, and a June 2026 financing reportedly led by Jeff Bezos with Lux Capital, GV, and Catalio. However, Flourish remains a research organization rather than a commercial vendor: it has no disclosed product, no public customer roster, no reported revenue, and no public technical benchmark package, leaving underwriting dependent on team quality and thesis credibility rather than operating evidence."
  founders:
    - name: "Thomas Reardon"
      role: "Co-founder"
      background: "Started the Internet Explorer project at Microsoft, later co-founded CTRL-Labs and sold it to Meta after developing neural-interface technology with a neuroscience research bent."
      claimRefs: [CO009, CO010, CO011, CO013]
    - name: "Rob Williams"
      role: "Co-founder"
      background: "Former Amazon S-team executive tied to Alexa-era software operations and the early fundraising process that brought Jeff Bezos into the round."
      claimRefs: [CO014, CO022]
  foundingLocation: "New York City, New York, USA"
  headquarters: "New York City, New York, USA"
  productSummary: "Cortex AI is a research-stage, brain-inspired AI program that uses connectomics, cortical-column ideas, and low-power architecture goals to pursue much more energy-efficient intelligence than current frontier transformer systems."
  customerFocus: "Prospective future buyers appear to be frontier AI labs, hyperscalers, national labs, defense or public-sector research programs, and enterprises that would pay for lower-power model deployment if the architecture works."
  businessModel: "No live business model is commercialized yet; the most plausible future models are enterprise licensing, API access, or hardware-linked partnerships if Cortex AI proves commercially useful."
  stage: "Pre-product / pre-revenue research stage"
  fundingStatus: "Reported ~$500M financing around June 2026 at a reported ~$2.5B valuation, led by Jeff Bezos with Lux Capital, GV, and Catalio participating."
  disclosureProfile: "private-undisclosed"
  claimRefs: [CO001, CO004, CO007, CO008, CO014, CO022, CO023, CU007]

