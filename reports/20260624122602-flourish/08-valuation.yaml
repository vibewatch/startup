callouts:
  - calloutType: recommendation
    title: "Research-more, not buy: gate any entry on an independent efficiency benchmark"
    body: Flourish is priced at $2.5 billion on a contested scientific hypothesis with no product, no revenue, and a 7-10 year horizon. The valuation is supportable only by team pedigree and the SSI pre-product analogy. The disciplined posture is research-more with medium confidence and a high risk rating, committing capital only after an independent efficiency benchmark or a defined milestone confirms the core thesis.
    claimRefs:
      - CV014
      - CV016
      - CV025
      - CV040
  - calloutType: assumption
    title: The valuation is venture-optionality, not a fundamentally underwritten mark
    body: Because there is no revenue, conventional revenue or DCF methods do not apply and every comparable carries large limitations. The $2.5 billion figure reflects what sophisticated investors paid in a single unaudited round, bounded on the upside by the SSI step-up and on the downside by a steep down-round if the science stalls.
    claimRefs:
      - CV004
      - CV031
      - CV033
      - CV044
