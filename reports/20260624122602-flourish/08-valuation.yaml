  - id: s803
    title: Scenarios, Comparable Set, and Investment KPIs
    body: "The comparable set is necessarily stage- and pedigree-matched rather than fundamentals-matched. Safe Superintelligence is the closest analogue: a pre-product lab valued at roughly $5 billion in 2024 and stepping toward $30 billion by 2025 on founder pedigree alone, bounding a plausible bull-case revaluation of roughly six times. At the frontier-lab ceiling, Anthropic was valued near $965 billion in May 2026 and xAI near $80 billion in March 2025 with about $3.2 billion of revenue — but both ship products, unlike Flourish. On the chip side, Groq's roughly $2.8 billion valuation on about $500 million of revenue and publicly traded Cerebras's roughly $510 million revenue and $87 million net income (verifiable via SEC EDGAR S-1 disclosures) show what an actual product and revenue look like at a similar headline valuation. IBM NorthPole proves brain-inspired efficiency is achievable in narrow inference, supporting a non-zero bull probability, while neuromorphic computing's slow commercial history caps the base case. Translating this into scenarios: the bull case assumes a demonstrable breakthrough within five years and an SSI-like step-up; the base case assumes a near-term model ships and value holds near entry; the bear case assumes the science stalls and a steep down-round. The KPI scorecard scores market size and team quality highly while execution proof and economics drag the composite down, and the thesis-break and diligence tables convert the analysis into monitorable triggers and asks."
