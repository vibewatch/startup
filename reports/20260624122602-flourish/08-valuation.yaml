  - id: s804
    title: Exit Readiness, Thesis-Break Triggers, and Final Diligence Asks
    body: "Exit readiness is low in the near term: the founders themselves frame a five-year breakthrough timeline and a seven-to-ten-year value horizon, so any liquidity event is distant and contingent on scientific progress rather than commercial traction. That makes ongoing monitoring the core discipline. Thesis-break triggers include an adviser- or peer-confirmed scientific dead end on the cortical-column principle, failure to ship the near-term hippocampus-inspired model, non-participation by the anchor investor in a future round, a competitor efficiency breakthrough, and continued compute scaling that erodes the value of algorithm-layer efficiency. Each should prompt a re-rating toward the bear case. Regulatory exposure — notably the in-force EU AI Act — adds a future commercialization and compliance cost that could impair the exit thesis once any product is deployed. The final diligence asks are concrete: an independent technical benchmark against neuromorphic and transformer baselines; the identity and terms of the chip-manufacturer partnership; governance, IRB, and bioethics evidence for brain-tissue research; and the full cap table including the liquidation-preference stack and dilution path. Secondary-market marks and any future down-round pricing should be tracked as leading indicators. The thesis-break and final diligence-asks tables enumerate these items with thresholds and owners."
