  topStrengths:
    - Thomas Reardon 横跨浏览器、神经科学和神经接口商业化，创始人与市场匹配度少见地强；Rob Williams 则补上大规模运营可信度。
    - 公司瞄准 AI 的真实结构性痛点：算力和能耗强度可能卡住前沿模型的经济性和部署。
    - Bezos、Lux、GV 和 Catalio 组成的投资人阵容提供强外部背书，也可能给长期研究计划带来耐心资本。
  topRisks:
    - Flourish 没有披露产品、公开基准、客户或收入，投资逻辑几乎完全由论点驱动。
    - 从连接组学走向商业 AI 的路径尚未得到科学验证，所需时间可能超过资本基础或投资人耐心。
    - 更强 GPU、量化、更小模型和专用推理硬件等替代能效路径，可能在 Cortex AI 成熟前收窄经济差距。
    - 治理、股权结构条款、烧钱速度、现金跑道、芯片合作伙伴身份和真实创立时间线仍明显不透明。
  unresolvedGaps:
    - 还没有独立技术基准证明 Cortex AI 相比 transformer 基线能显著改善能耗、训练数据需求或学习效率。
    - 没有公开备案、股权结构表或 Form D 验证本轮精确结构、所有权、清算优先权，或传闻 $2.5B 估值的法律基础。
    - 没有公开客户、试点、设计伙伴、定价或 go-to-market 证据说明研究何时、如何转成商业收入。
    - 当前烧钱速度、现金余额、招聘节奏和任何芯片制造商合作状态仍未披露。
