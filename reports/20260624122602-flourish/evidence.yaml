evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: funding-and-investors
    missingEvidence: >
      Individual investor check sizes, equity stakes, board seat allocations, liquidation preferences, and governance
      rights for all Flourish investors.
    whyItMatters: >
      Without cap table details, the actual control structure, economic incentives, and investor influence on long-term
      mission durability cannot be assessed.
    diligencePath: >
      Request investor summary from Flourish directly; review any SEC filings if company has filed a Form D (likely);
      request a cap table from company in due diligence.
    relatedQuestionRefs:
      - QO002
      - QO009
      - QO021
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: product-and-technology
    missingEvidence: >
      Technical validation of Flourish's approach via peer-reviewed publications, preprints, benchmarks, or independent
      scientific assessment.
    whyItMatters: >
      No public scientific evidence supports or contradicts Flourish's core claims about cortical column algorithms;
      feasibility rests entirely on founder assertions and adviser credibility.
