      - number: '2.2'
        title: 市场规模测算框架与约束增长视角
        blocks:
          - type: paragraph
            body: >-
              测算 Sakana AI 的目标市场规模，需将庞杂的宏观估算逐层拆解为具备防御性、受现实条件制约的支出层级。尽管全球各行业在生成式 AI
              领域的总支出预测已突破数千亿美元，但日本本土主权企业级市场的实际落地机会受到严格本土化条件的制约。TAM / SAM / SOM
              多层测算框架清晰展示了这一市场边界的结构性收窄。最广泛的总可用市场（TAM）包含日本整体企业软件与数字化转型预算，代表技术现代化的宏观支出上限。在上述范畴内，可服务市场（SAM）局限于本土企业级 AI
              平台、垂直主权模型训练，以及出于数据驻留与国家安全考虑而排斥非受控境外模型 API 的私有云智能体部署。Sakana
              的可获取市场（SOM）进一步聚焦于高安全等级企业客户群体——主要是要求深度领域定制以及专属本地部署或主权云编排的头部金融机构、防务部门与本土大型工业财阀。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
