      - - 基准测试质量未能有效迁移至生产环境
        - 公司采用模型厂商自述的基准得分；独立评测指出长周期复现尚待验证。
        - 中
        - 高
        - 存在 Beta 测试与内部评估；尚无第三方独立复现。
        - 将规模推广与盲测客户工作负载、失效分母指标及第三方评估挂钩。
      - - 生产平台与安全执行落地滞后
        - 现有招聘岗位将 CI/CD、监控、扩缩容、安全及模型集成列为产品工程职责。
        - 中
        - 高
        - 仅体现人员招聘动向；管控覆盖范围与事故历史未披露。
        - 核查人员配备、值班覆盖、SLO、渗透测试、容灾恢复及事故登记表。
      - - 将账面资金能力误认为已披露的现金跑道
        - Sakana 宣布完成 $200 million Series B 轮融资并公布了资金用途，但在所保留来源中并未披露收入、毛利率、烧钱速度、现金跑道或现金余额。
        - 中
        - 高
        - 已完成大额融资；单体经济模型仍未披露。
        - 获取月度现金过渡表、已承诺支出、云基础设施付款义务、毛利率及下行融资预案。
    notes: $200 million 仅为公司自述的融资金额，并非 ARR、营业收入、可用现金或现金跑道。因事故、延迟、错误率及成本分布均未披露，运营维度的可能性评估均为定性性质。
    claimRefs:
