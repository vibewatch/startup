  - id: FM001
    title: 日本主权企业级 AI 目标市场规模分层
    type: pyramid
    summary: 展示从广泛的日本数字化转型支出到 Sakana AI 高安全性主权可获取市场的结构性筛选层级金字塔。
    data:
      items:
        - label: 宏观 IT 现代化与 DX（TAM）
          detail: 日本全行业企业级软件与数字化转型总体预算（$25B - $30B 宏观机遇）。
        - label: 主权 AI 与智能体平台（SAM）
          detail: 针对本地化、数据主权 LLM、多智能体编排及企业私有化部署的专门支出（$2.5B - $4.0B 可服务需求）。
        - label: 受监管 Tier-1 大型企业核心（SOM）
          detail: 日本主要巨型银行、国家防务机构及核心工业财阀的目标市场份额（$150M - $300M 可获取市场）。
        - label: 高毛利专用自主研发（SOM 核心）
          detail: 在战略合作伙伴（MUFG、Citi、ATLA、Mitsubishi Electric）内部专属部署，产生定制企业级 ARR（$30M - $60M 初始基数）。
        - label: 金融服务专用 AI 平台细分赛道
          detail: 面向日本一流银行机构的垂直领域智能体编排与合规 LLM 工具链可触达空间（$100M - $180M 目标细分市场）。
        - label: 自动化科研文献与前沿探索细分赛道
          detail: 用于自动化科研归纳与假设生成的企业专项研发工具支出（$50M - $100M 专用相邻市场需求）。
    approximationNotes: 市场规模测算数据系基于企业级软件基准推算的行业大类支出估算，并非 Sakana AI 经审计的营业收入数据。
