            title: 日本受监管行业的主权 AI 溢价
            body: >-
              Sakana AI 核心市场防御壁垒源于日本在体制上不愿将敏感企业与国家情报传输至美国超大规模云厂商的境外 API
              端点。借助将本土化日语模型（Namazu）与能够在性能与成本帕累托前沿寻优的灵活多智能体编排器（Fugu）结合，Sakana 撬动了西方通用基础模型厂商难以触及的企业预算。
