      - number: '3.3'
        title: 产品打包、定价与市场拓展阻力
        blocks:
          - type: paragraph
            body: >-
              对比不同 AI 架构的商业化路径，各方在合同架构、产品打包灵活性以及合规治理机制上存在明显差异。Sakana AI 采用混合市场拓展架构，涵盖多年期企业转型合作项目、通过 Marlin
              按点数计费的自主研究订阅，以及基于 Fugu 按 token 计量的编排 API 定价。在 Fugu Ultra 上，定价设定为每 100 万输入 tokens 收费 $5、每 100 万输出 tokens 收费
              $30；相较于 Claude Fable 5 这类前沿单模型（每 100 万 tokens 输入 $10、输出 $50），名义价格具备竞争力，但由于内部协调调度轮次与验证环节均计入计费使用量，实际产生了隐性
              token 放大效应。落地到企业端，Sakana AI 深度扎根 MUFG 和 SMBC Group
              等日本大型银行，联合开发授信评估工作流与专有隐性知识管道，筑起机构准入的防御性护城河。相反，其在日本境外的企业级拓展面临较大阻力：受制于 GDPR 及欧盟 AI 法规合规审查尚未完成，Fugu
              在欧盟与欧洲经济区（EEA）完全无法使用；同时，模型池的高度不透明性也限制了受监管机构对底层子模型具体调用路由的穿透审查。
