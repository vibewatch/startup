  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与服务定义
        blocks:
          - type: paragraph
            body: >
              Sakana AI
              将其商业产品与科研体系立足于受自然启发的群体智能，而非单纯堆砌参数搞单体模型规模扩张。公司并未在原生参数规模上与超大规模基础模型实验室硬碰硬，而是通过统一接口提供模块化、任务专精型的系统。旗舰产品 Sakana
              Fugu 是一套多模型 LLM 编排系统，充当认知路由器，能按预估任务复杂度，将输入的 prompt 动态分发到底层语言模型池中。与 Fugu 互补的是专精日本本土场景的模型和垂直领域智能体：Sakana
              Namazu 是一款针对日语语言细微语义深度微调、内置网络搜索与代码执行能力的基础模型；Sakana Marlin 专为耗时数小时的战略规划与并购（M&A）尽调打造，属于自主推理智能体；Sakana
              Translate 则是一款专属翻译与语体自适应引擎，适配日常口语、敬语以及日本商务正式文体。上述系统协同落地了 Sakana AI 的双轨战略：一方面探索开放式前沿 AI
              基础科研，另一方面为日本企业和主权级部署交付垂直领域的工作流。
