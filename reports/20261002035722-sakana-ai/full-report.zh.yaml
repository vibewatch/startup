              Research
              另外指出，公司业务融合了定制化企业部署、标准化打包产品以及政府合作项目。现有事实支撑了多元商业化模式，而非单纯的纯软件销售路径，但外部无法据此确认软件许可、按用量计费、专业服务、政府补贴或里程碑款项的具体收入结构。与
