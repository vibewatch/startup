        title: 图表与附注
        blocks:
          - type: callout
            title: 模型不透明度与合规边界
            body: >-
              尽管 Sakana AI 将 Fugu
              定位为能够防范单一厂商锁定风险的无摩擦多模型编排器，但其架构不透明性对企业风控主管而言宛如双刃剑。在强监管企业环境中，合规审查往往要求穿透审计，以明确敏感企业数据究竟流经了哪家底层基础模型。Fugu Ultra
              采用固定模型池，客户无法主动剔除特定模型；受制于 GDPR 及欧盟专属监管审查，该平台在欧盟与欧洲经济区（EEA）目前仍处于完全禁用状态。
            calloutType: risk
            claimRefs:
              - CP015
