          - type: callout
            title: 主权护城河对抗模型融合商品化
            body: >-
              随着 mergekit 等开源工具库令静态权重融合走向商品化，Sakana AI 长期构筑的竞争优势，已不再单靠专有融合算法，而是植根于与日本大型机构体系的深度业务交织。通过与 MUFG
              等大型银行及防卫装备厅（ATLA）等政府机构达成深度合作，Sakana 得以将机构特有的专有工作流沉淀为模型训练数据管线，形成通用全球 LLM 厂商难以轻易瓦解的客户切换成本。
