      - number: '5.2'
        title: 架构运营模式与 Fugu 编排引擎
        blocks:
          - type: paragraph
            body: >
              Sakana AI 技术栈的底层架构立足于群体智能与动态工作负载分发，而非单一模型推理。该运营模式的核心是 Sakana Fugu，在单一 API 端点后充当双层认知编排器。当 prompt 传入 Fugu
              时，经过训练的分类路由器可在毫秒级时间内评估 prompt 结构、语言复杂度、上下文长度及目标输出特征，无需运行耗时的完整探索性推理。路由器将常规总结、分类或事实检索分发给 Tier
              1——轻量且兼顾成本效益的快速通道；将高算力消耗的多步骤推理、歧义指令及复杂内容生成留给 Tier 2。Fugu
              本身也被训练为具备工具调用能力的大语言模型，能够在复杂多步工作流中调用底层智能体池，并递归调用自身实例。通过与 NVIDIA 进一步深化技术合作，Sakana AI 正将开源权重的 NVIDIA Nemotron
              系列模型整合进 Fugu 的专精智能体池，将加速计算基础设施与开源模型的工具调用及代码编写能力相结合。
