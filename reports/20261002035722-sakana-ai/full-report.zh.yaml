          modules:
            - 两级 Prompt 复杂度分类器
            - 动态任务分发器（Tier 1 快速通道 vs Tier 2 强能力通道）
            - 递归自调用与工作流协调器
        - label: 专用模型与智能体池
          detail: 由专有闭源模型与开源专用模型构成的异构资源池
          modules:
            - Sakana Namazu（集成 Web/代码工具的日语基础模型）
            - Sakana Marlin（自主策略研究智能体）
            - Sakana Translate（语气自适应三语翻译模型）
            - NVIDIA Nemotron（开源权重工具调用与编程专用模型）
        - label: 后训练与演化优化层
          detail: 受自然启发的演化算法与参数高效型模型融合机制
          modules:
            - 演化模型融合框架
            - Darwin Gödel Machine（DGM）自我进化架构
            - ShinkaEvolve 程序合成引擎
            - 行业垂直企业后训练流水线
        - label: 可观测性、评估与信任层
          detail: 生产环境遥测、基准跟踪与多智能体系统全链路可观测性
          modules:
            - Datadog 可观测性与安全监控集成
            - 自动化评估套件与基准测试跟踪
            - 企业级合规与安全护栏管控
        - label: 基础设施与计算平台层
          detail: 由加速硬件支撑的容器化推理与服务基础设施
          modules:
            - NVIDIA 加速计算 GPU 基础设施
            - Docker 容器化生产推理服务
            - 自动化 CI/CD 部署流水线
    approximationNotes: 分层架构划分反映了 Sakana AI 已公开技术简报、招聘说明及合作文档所呈现的系统架构组织。
    claimRefs:
      - CE002
      - CE006
      - CE008
      - CE010
      - CE012
      - CE014
  - id: FU001
    title: Sakana AI 企业客户导入与拓展旅程
    type: journey-map
    summary: 从开发者 API 评估逐步演进至深度嵌入主权企业工作流的多阶段跃迁路径。
    data:
      items:
        - label: 1. 开发者探索阶段
          description: 技术团队针对模型编排能力与成本效益，评估 Sakana Fugu API 及开源模型。
          touchpoints:
            - 兼容 OpenAI 的 Fugu API 试用（$20-$200/mo）
            - Namazu 日语模型评估
            - Hugging Face 及 GitHub 社区开源权重探索
        - label: 2. 战略任务测试阶段
          description: 企划与研究部门引入 Sakana Marlin，用于开展自主商业情报分析。
          touchpoints:
            - Sakana Marlin Pro/Team 订阅（150k-400k JPY/mo）
            - 跨数小时的自主研究报告生成
            - 管理层审阅与决策支持试点测试
        - label: 3. 企业联合共建阶段
          description: 应用工程团队直接对接客户业务专家，联合研发高可靠的定制工作流。
          touchpoints:
            - 与银行或防务领域专家开展需求研讨会
            - 实地环境联合系统评估
            - 安全、数据主权及合规性核验
        - label: 4. 全面规模化推广阶段
          description: 生产系统与客户自身 IT 基础设施以及 Google、Datadog 等生态伙伴平台深度打通。
          touchpoints:
            - 签订多年期企业级软件采购协议
            - 通过 Datadog 集成可观测性与合规治理能力
            - 在受监管企业核心业务中完成主权部署
        - label: 5. 集团生态扩散阶段
          description: 向企业集团成员单位、海外分支机构及相关公共部门机构全面辐射。
          touchpoints:
            - 跨子公司推广部署（例如 MUFG 旗下的银行与证券公司）
            - 依托战略资方的全球企业级市场扩张
            - 将一线反馈融入下一代主权模型的迭代训练
        - label: 6. 平台治理与续约阶段
          description: 长期评估主权 SLA 履约表现、模型精度基准，推进商业合同续约。
          touchpoints:
            - 年度软件合同续约与增购评审
            - 对比新一代前沿基础模型进行基准测试
            - 对主权合规性与运营效率指标开展全面审计
    approximationNotes: 客户旅程图基于已披露的开发者自助层级与定制化专属合作，对客户进阶路径进行概念化提炼。
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU005
      - CU006
      - CU009
      - CU011
  - id: FR001
    title: 残留风险定性热力图
    type: matrix
    summary: 治理与控制平面风险兼具极高的潜在冲击，且公开渠道缺乏成熟缓解措施的有效证据。
    data:
      columns:
        - label: 可能性
          detail: 基于公开证据的定性评估；并非定量概率模型测算结果。
        - label: 影响程度
          detail: 若风险成真对投资价值与客户业务带来的潜在后果。
        - label: 缓解措施成熟度
          detail: 对公开证据所载管控措施的评估，而非管理层内部未公开的控制体系。
      rows:
        - label: 路由与隐私缺乏透明度
          note: 主因在于多模型提供商隐式路由以及缺乏公开的合规佐证材料。
          values:
            - label: 中高
              tone: high
            - label: 高
              tone: critical
            - label: 低（基于公开证据）
              tone: high
        - label: 控制平面依赖
          note: 模型提供商多元化并不能消除对 Sakana 核心协调器的单点依赖。
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: critical
            - label: 中
              tone: warning
        - label: 基准迁移与可靠性
          note: 基准测试得分均由厂商自述，长期复现尚未完成。
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: critical
            - label: 公开证据较少
              tone: high
        - label: 现金跑道与单位经济模型
          note: 融资金额已披露，但烧钱速度、毛利率、营业收入与现金跑道均未披露。
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: critical
            - label: 公开证据较少
              tone: high
        - label: 敏感行业合规与安全保障
          note: 点名的金融与政府业务推高了安全保障需求，但尚未证实获得具体审批。
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: critical
            - label: 公开证据较少
              tone: high
        - label: 供应商政策漂移
          note: 协同中枢依赖不断演进的第三方与 Sakana 自有模型池。
          values:
            - label: 中
              tone: warning
            - label: 中高
              tone: high
            - label: 中
              tone: warning
    approximationNotes: 序数标签仅汇总截至 2026-10-02 有据可查的风险敞口与披露缺口；既非量化概率，亦非经审计的内控评级或事故预测。
    claimRefs:
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 本建议遵循从可观测规模信号到未决投资判断输入的逻辑链条。
    data:
      nodes:
        - id: proof
          label: 产品矩阵与点名合作机构
          detail: 公司口径的落地广度证据，非经审计的财务数据。
        - id: execution
          label: 招聘与活跃开发者生态
          detail: 反映当前执行力，但缺少公司总员工数这一分母。
        - id: financing
          label: 约 $2.6-2.7B 的估值参考
          detail: 最新公开融资背景，但轮次金额与累计总额存在冲突。
        - id: uncertainty
          label: 经营与安全条款缺失
          detail: 营业收入、毛利、留存、烧钱速度、股权结构表及优先权均无公开依据。
        - id: discipline
          label: 须核实经济模型与合作条款
          detail: 在定价前，须理顺融资数据并验证可复制的企业级价值。
        - id: decision
          label: 观察 / 继续研究
          detail: 高风险；估值立场偏高或尚未核实。
      edges:
        - from: proof
          to: execution
        - from: execution
          to: financing
        - from: financing
          to: uncertainty
        - from: uncertainty
          to: discipline
        - from: discipline
          to: decision
    approximationNotes: 本流程图为定性展示，不构成对发生概率、转化率、投资回报或公允价值的任何保证。
    claimRefs:
      - CV003
      - CV006
      - CV008
      - CV009
      - CV014
