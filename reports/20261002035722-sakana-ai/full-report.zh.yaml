  - id: TR003
    title: 合作伙伴与外部依赖风险登记表
    columns:
      - 依赖项
      - 对手方
      - 角色
      - 集中度证据
      - 失效场景
      - 严重程度
      - 缓解措施
      - 残留风险敞口
    rows:
      - - 底层前沿模型供应
        - 多家未披露的模型提供商
        - 编排资源池中的工作模型
        - 池内成员构成与流量分配份额均未公开。
        - 提供商退出、服务降级、价格上涨或政策限制。
        - 高
        - 可热插拔资源池与动态路由。
        - 在验证故障切换机制且证明覆盖合规提供商之前，风险为中高。
      - - 编排控制平面
        - Sakana AI
        - 路由选择、任务委派、结果验证、综合归纳与 API 抽象
        - 每笔 Fugu 请求均依赖 Sakana 的端点与协调器。
        - Sakana 服务中断、路由缺陷、恶意更新或合同终止。
        - 高
        - 兼容 OpenAI 的接口可降低客户端集成改造成本。
        - 若缺乏导出工具、代码托管/备用兜底路径及路由级可观测性，风险仍为高。
      - - 按产品层级划分的合规配置
        - Sakana AI 及其模型池
        - 智能体白名单或排除机制
        - 标准版 Fugu 支持排除特定模型；据评测报道，Ultra 版采用固定模型池。
        - 所需性能层级无法满足客户的准入供应商合规策略。
        - 高
        - 在合同条款允许的范围内，使用标准版 Fugu 或受限路由。
        - 对于兼具极致性能要求与严格提供商管控的工作负载，风险为高。
      - - 战略投资者与企业生态系统
        - MUFG 及其他已点名的投资方、合作伙伴与客户
        - 资本、渠道分发、产品协同与落地准入
        - 合作关系已公开点名，但收入与用量集中度未公开。
        - 失去单一核心锚点合作会削弱渠道分发、背书验证或后续融资信号。
        - 中高
        - 投资方背景多元，且业务延伸至金融、防务与制造领域。
        - 在客户级收入、续约率及商机集中度披露之前，仍属无法量化状态。
    notes: 本登记表严格区分已公开合作关系与量化集中度。投资者参与、业务合作及客户实际使用分属不同维度；公开来源并未提供收入分成、流量份额或续约条款。
    claimRefs:
      - CR002
      - CR007
      - CR013
      - CR015
  - id: TV001
    title: 投资建议汇总
    columns:
      - 决策项
      - 当前观点
      - 证据依据
      - 提升评估结论所需条件
    rows:
      - - 投资建议
        - 跟踪观察 / 继续研究
        - 产品与合作关系已有积极信号，但公开资料无法验证其经营经济效益与融资条款。
        - 经核实的合同收入、留存率、毛利率、集中度及安全条款。
      - - 置信度
        - 中低
        - 最新来自公司官方与第三方的 Series B 融资额及累计融资金额存在出入。
        - 能与银行对账单及股权结构表勾稽核对的融资进度明细表。
      - - 风险评级
        - 高
        - 商业化落地、产品验证、非公开安全条款及退出时机仍具重大不确定性。
        - 独立的第三方产品审计，以及强监管部署环境下可复制的持续续约记录。
      - - 估值立场
        - 偏高 / 未经证实
        - 最新公开参考估值约为 $2.6-2.7 billion，而 Sakana 特有的收入及毛利分母指标均无法获取。
        - 能支撑拟议完全稀释后入场估值对应风险投资回报的、经核实的经营计划。
      - - 入场纪律
        - 切勿仅凭公开标杆估值下注
        - 融资额并不等同于可用现金，且公开来源无法厘清清算优先权或潜在稀释压力。
        - 完整的股权结构表、清算优先偿付分配顺序、期权池、负债、现金余额、烧钱速度及现金跑道。
    notes: 截至 2026-10-02 的决策综合分析。公司与第三方独立来源所载融资金额存在矛盾；未推断任何公允价值区间、概率百分比或投资回报目标。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV014
      - CV016
  - id: TV002
    title: 投资逻辑与反向逻辑
    columns:
      - 立场
      - 核心论点
      - 当前证据
      - 改变观点的触发条件
    rows:
      - - 正向逻辑
        - 深耕日本本土的产品与部署广度有望构筑差异化的企业级竞争壁垒。
        - 公司列明了四款产品，并披露了与金融机构及公共部门机构的合作。
        - 经核实的续约数据、实际部署规模及客户自述的投资回报率（ROI）。
      - - 正向逻辑
        - 充裕资本与活跃的技术产出有望支撑其持续推进产品化。
        - 公司已指定将 Series B 资金用于研发与落地推广；目前人员招聘与开发者动态保持活跃。
        - 能证明招聘扩张与研发产出切实转化为毛利润的交付履约证据。
      - - 反向逻辑
        - 一级市场估值涨幅可能已超前于经跑通的实际经济效益。
        - 估值参考标杆从约 $1.4-1.5 billion 攀升至约 $2.6-2.7 billion，但公司并未披露任何 Sakana 专属的收入分母指标。
        - 经审计的收入、毛利率、留存率、待履约合同积压（backlog），以及与上述指标紧密挂钩的估值测算方法。
      - - 反向逻辑
        - 科研层面的曝光度未必能顺利转化为面向受监管大型企业的高可靠产品。
        - 关于 AI Scientist 的公开讨论指出了论文仅获 Workshop 级别录用、投递成果命中率有限，以及引文质量受质疑等问题。
        - 针对生产系统的独立第三方红队测试结果与客户验收证据。
    notes: 本表将可观测的市场信号与实质性投资判断严格区分；公司单方发布的产品及部署声明不被视作经第三方独立核实的客户凭证。
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV015
      - CV016
  - id: TV003
    title: 乐观、基准与悲观情景推演
    columns:
      - 情景
      - 核心假设
      - 估值与回报逻辑
      - 概率信号
      - 下行情景触发条件
    rows:
      - - 乐观情景
        - 已点名的企业与政府合作转化为可复制的规模化部署；产品质量经受住强监管场景考验；人员扩充有效支撑落地交付。
        - 唯有经验证的经济效益能展现可信的风投回报时，当前估值方可纳入考虑；现有数据无法支撑具体的绝对估值区间。
        - 已签约合同储备稳步增加、客户队列留存强劲、毛利率持续扩张，以及客户独立核实的 ROI。
        - 试点向生产环境转化受阻，或续约未达预期。
      - - 基准情景
        - 技术产出与合作拓展持续推进，但公开层面的经营效益仍不可得，融资数据差异依旧存在。
        - 仅将约 $2.6-2.7 billion 的融资估值作为背景参考；静待后续数据披露或争取保护性更强的入场交易结构。
        - 产品发布与项目部署不断推进，但始终缺乏经审计的单体经济模型。
        - 在缺乏更充分信息披露或商业化验证的情况下推进追加融资。
      - - 悲观情景
        - 商业化转化或独立质量验证不及预期，同时一级市场估值倍数普遍承压回落。
        - 估值需较最新一轮大幅折价，但现有证据不足以支撑具体的折价百分比或公允价值底线。
        - 续约疲软、出现负面质量评估结果、受监管行业部署延期，或融资条款恶化。
        - 质量故障、核心客户流失、降估值融资（down-round）条款落地或治理结构掣肘。
    notes: 情景概率与估值区间刻意保持定性判断，原因是收入、毛利率、留存率、现金烧钱速度、完全稀释后持股比例及清算条款均未公开披露。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV010
      - CV014
      - CV015
      - CV016
