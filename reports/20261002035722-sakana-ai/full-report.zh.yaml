  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与分类
        blocks:
          - type: paragraph
            body: >-
              Sakana AI 在 AI
              行业多条竞争赛道上同步展开布局，凭借进化式模型融合与基于机器学习的多智能体编排，与资本密集型的基础模型预训练实验室形成差异化区隔。宏观市场主要由垂直一体化行业巨头、前沿基础模型研发商、探索算力高效型架构的日本本土厂商，以及开源工具生态构成。传统前沿厂商如
              OpenAI 和 Anthropic 依托百亿美元级算力集群拓展超大规模稠密模型或混合专家（MoE）Transformer 架构，Sakana AI
              则将技术栈定位于生物启发、进化式参数组合与多智能体协同执行。在日本本土，软银（SoftBank）、乐天（Rakuten）、CyberAgent 和 Preferred Networks
              等大型财团依托政府补贴与专有数据壁垒推进主权 AI 项目，直接对企业 IT 支出与银行现代化升级预算形成结构性竞争。同时，mergekit 和 Optuna Hub 等开源社区工具复现了基础模型融合方法，倒逼
              Sakana AI 向上突围，由静态权重融合进阶至基于 Fugu 的动态学习型多模型编排，以及 Marlin 这类垂直自主战略研究智能体。
