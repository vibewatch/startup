  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范畴与支出分配
        blocks:
          - type: paragraph
            body: >-
              日本企业级 AI 市场在结构上分化为两极：全球前沿底层基础设施与契合本土垂直领域的软件应用。Sakana AI 的产品布局精准切入三大方向：主权级基础模型后训练、以 Sakana Fugu
              为代表的专有垂直多智能体编排，以及 Marlin 和 The AI Scientist
              这类垂直领域应用研究自动化工具。该市场边界明确涵盖日本银行业、制造业与防务领域的企业运营软件预算、垂直领域定制调优支出，以及政府主导的主权算力项目。相对地，其主动排除了商品化底层 GPU
              硬件采购、通用消费级聊天机器人订阅，以及西方通用云厂商的基础托管合同。该领域当前的主要替代方案，仍是传统人工专业服务、本土 IT
              巨头内部自建的系统集成，以及直接采购缺乏本地主权托管保障、未深入对齐日本本土文化与监管要求的西方通用基础模型 API。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
