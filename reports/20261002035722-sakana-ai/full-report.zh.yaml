    sections:
      - number: '1.1'
        title: 实体身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Sakana AI K.K. 自述是一家成立于 2023 年 7 月、总部位于东京的前沿 AI 研发公司。公司官方页面给出了东京都港区麻布台之丘的办公地址，并标注当前处于 B
              轮融资阶段。公司运营模式整合了四大职能：前沿研究、企业级应用、面向用户的产品以及综合运营。官方产品页面列出了 Sakana Fugu、Namazu、Marlin 和 Translate，Applied
              团队则表示其负责与日本金融机构及政府机构共同完成系统需求界定、搭建、评估与部署。现有证据表明，公司更倾向于混合模式，而非纯研究实验室或自助式软件厂商：自研成果向产品和定制交付输送，合作伙伴则提供系统集成和产业分销渠道。公开定价以及产品许可、专业服务和联合项目之间的收入结构目前暂无披露。
