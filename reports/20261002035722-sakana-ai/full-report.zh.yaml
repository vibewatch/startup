      - number: '3.2'
        title: 能力与基准测试差异化
        blocks:
          - type: paragraph
            body: >-
              Sakana AI 的核心技术竞争重心已由单纯追求参数规模，转向多智能体协同效率，以及在复杂软件工程、深度推理和特定日语领域任务中的基准测试稳定性。依托入选 ICLR 2026 的 TRINITY 与
              Conductor 论文成果，Sakana AI 借助 Fugu 编排架构将异构模型池封装于统一兼容 OpenAI 协议的 API
              端点之后。已公布的评测显示，在单模型屡屡受挫的多步骤执行基准测试中，其展现出一定竞争优势：在 SWE-Bench Pro 上，Fugu Ultra 获得 73.7 分，高于 Opus 4.8 的
              69.2、GPT-5.5 的 58.6 以及 Gemini 3.1 Pro 的 54.2。在 TerminalBench 2.1 测试中，Fugu Ultra 跑出 82.1 分，领先于 Opus 4.8 的
              74.6，并在 Humanity's Last Exam 上与 Opus 4.8 同样取得 50.0 分。在重构非线性散らし書き（chirashigaki）手稿中古典假名识读顺序等专有领域难题中，Fugu
              Ultra 相对专家标准答案的归一化编辑距离达到 0.80，显著优于仅取得 0.24 或无法输出有效语法的同业前沿模型。但需注意，上述基准测试数据均为厂商自述评测，采用 mini-swe-agent
              脚手架完成，独立第三方审计仍有待开展。
