      - "Downside trigger"
    rows:
      - ["Bull", "Named enterprise and government relationships convert into repeatable deployments; product quality holds in regulated use; hiring supports delivery.", "Current valuation could be considered only after verified economics demonstrate a credible venture return; no absolute range is supportable.", "Rising contracted backlog, strong cohort retention, expanding gross margin, and independent customer ROI.", "Pilot-to-production conversion or renewal misses."]
      - ["Base", "Technical output and relationships continue, but public operating economics remain unavailable and financing discrepancies persist.", "Use the roughly $2.6-2.7 billion financing mark as context only; wait for data or a more protective entry structure.", "Continued product releases and deployments without audited unit economics.", "A financing extension without improved disclosure or commercial proof."]
      - ["Bear", "Commercial conversion or independent quality validation disappoints while private-market multiples compress.", "A material discount to the latest round would be required, but the evidence does not support a precise percentage or fair-value floor.", "Weak renewals, adverse quality findings, delayed regulated deployment, or weaker financing terms.", "Quality failures, customer losses, down-round terms, or governance constraints."]
    notes: >-
