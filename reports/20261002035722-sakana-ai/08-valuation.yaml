      - ["Anti-thesis", "Private-market pricing may have moved faster than proven economics.", "The valuation reference rose from roughly $1.4-1.5 billion to roughly $2.6-2.7 billion while no Sakana-specific revenue denominator is disclosed.", "Audited revenue, gross margin, retention, backlog, and a valuation method tied to those metrics."]
      - ["Anti-thesis", "Research visibility may not translate into dependable regulated-enterprise products.", "Public discussion of AI Scientist highlighted workshop-level acceptance, limited success across submitted papers, and citation-quality concerns.", "Independent red-team and customer acceptance evidence for production systems."]
    notes: >-
