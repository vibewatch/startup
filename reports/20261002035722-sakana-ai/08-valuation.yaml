company:
  name: "Sakana AI"
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    Sakana AI has credible product, enterprise, research-output, and financing signals, but public
    evidence does not disclose the operating economics or security terms needed to underwrite the
    latest roughly $2.6-2.7 billion valuation reference. The recommendation is TRACK / RESEARCH
    MORE with a stretched, unverified valuation stance and high risk until financing reconciliation,
    contracted economics, retention, margins, and preference terms are verified.
sections:
  - id: "financing-and-entry-context"
    title: "Financing context and entry discipline"
    body: >-
      Public financing evidence establishes a high private-market reference point but not a
      defensible fair value. Sakana AI's updated Series B page says the round raised $200 million,
      produced an approximately $2.7 billion post-money valuation, and brought cumulative funding
      to about $412 million. TechCrunch's report from the original November 2025 announcement
      instead described a $135 million round, a $2.65 billion post-money valuation, and roughly
      $379 million raised in total. Market-data sources also disagree on cumulative funding. These
      differences may reflect extensions, currency conversion, or later strategic investment, but
      the retained evidence does not reconcile them. Funding raised is therefore not treated as
      cash available. Entry discipline should be based on a reconciled capitalization table,
      security terms, and verified operating metrics, not the headline valuation alone.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV012"
      - "CV013"
      - "CV014"
    tableRefs:
      - "TV001"
  - id: "thesis-and-anti-thesis"
    title: "Thesis and anti-thesis"
    body: >-
      The positive case rests on observable breadth rather than disclosed economics. Sakana AI
      presents four products and names work with major Japanese financial institutions and public
      agencies; its verified Hugging Face organization shows a substantial technical footprint,
      and a current product-engineering posting points to continued production investment. The
      Series B proceeds were designated for research, applied teams, defense and manufacturing
      expansion, and strategic activity. The anti-thesis is that valuation expansion has run ahead
      of independently verified commercialization. The retained sources provide no audited revenue,
      ARR, gross margin, retention, burn, or customer-concentration denominator. Public discussion
      of AI Scientist also raises quality and validation questions that matter because research
      visibility is not equivalent to durable enterprise value.
    claimRefs:
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV002"
  - id: "scenario-and-comparable-discipline"
    title: "Scenario and comparable discipline"
    body: >-
      A milestone method is more appropriate than a revenue multiple until Sakana AI discloses
      comparable operating data. Multiples.vc lists selected private software companies near 26
      times revenue and selected public references from below 1 times to nearly 20 times revenue,
      but the business models, growth, margins, and reporting bases are not shown as comparable to
      Sakana AI. Those observations are context, not an independent benchmark or a valuation
      formula. The bull case requires verified conversion of named relationships into repeatable,
      high-retention revenue. The base case preserves technical and relationship progress while
      withholding a price conclusion. The bear case combines commercialization slippage, external
      product-quality concerns, and private-market multiple compression. No probability percentage,
      return target, or absolute fair-value range is supportable from the assigned public evidence.
    claimRefs:
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV010"
      - "CV014"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV003"
  - id: "recommendation-and-exit-readiness"
    title: "Recommendation, exit readiness, and diligence"
    body: >-
      The decision is TRACK / RESEARCH MORE, with medium-low confidence, high risk, and a stretched
      or unverified valuation stance. This is not a negative judgment on technical quality; it is a
      refusal to underwrite an institutional entry price without operating and security-level
      evidence. The retained sources do not establish audited financials, a public-market timetable,
      secondary liquidity, preference seniority, or governance rights, so hold period and target
      return remain open diligence items. A move toward investment requires reconciled financing,
      cohort retention, gross margin, contracted backlog, customer concentration, cash burn, runway,
      and independent product-quality evidence. Thesis-break triggers are failed conversions or
      renewals among named relationships, quality evidence that blocks regulated deployment,
      continued financing-data inconsistency, or a new round that preserves the headline price
      without materially stronger economics.
    claimRefs:
      - "CV003"
      - "CV006"
      - "CV010"
      - "CV014"
      - "CV016"
    figureRefs:
      - "FV001"
