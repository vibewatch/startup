company:
  name: "Sakana AI"
chapter:
  number: 4
  title: "Financials"
  summary: "Sakana AI has moved beyond pure research into custom enterprise work and packaged products, but public pricing and accounting data remain too thin to underwrite revenue quality or unit economics. The latest disclosed financing provides substantial capital, yet funding raised is not evidence of cash available, burn, or runway."
sections:
  - id: "revenue-architecture"
    title: "Commercial architecture is visible, but revenue quality is not"
    body: >-
      Sakana AI now presents a portfolio spanning Fugu, Namazu, Marlin, and Translate, while its
      Applied team describes a hands-on path from pilot scoping through field deployment. Contrary
      Research separately characterizes the business as combining bespoke enterprise deployments,
      packaged products, and government work. This supports a multi-stream commercial model rather
      than a single pure-software motion, but it does not establish the mix of license, usage,
      services, grant, or milestone revenue. Named work with MUFG Bank, SMBC Group, Daiwa Securities
      Group, and public-sector bodies is evidence of implementation activity, not evidence of
      contract value, recognition policy, renewal, or margin. The central underwriting issue is
      therefore not whether commercialization exists; it is whether labor-intensive implementation
      can convert into repeatable, high-quality revenue.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
    tableRefs:
      - "TI001"
    figureRefs: []

  - id: "pricing-and-traction"
    title: "Reported monetization is not the same as realized pricing or ARR"
    body: >-
      The assigned public evidence contains no official list prices on Sakana AI's main product
      page. Contrary Research reports subscription-plus-usage packaging for Fugu and usage-based
      billing alongside monthly tiers for Marlin, but those descriptions are third-party reporting,
      not contracts or invoices. Public traction is equally fragile: Contrary labels a $30 million
      2025 revenue estimate as unverified, while UpMarket calls the same headline amount ARR and
      then calls it revenue in the supporting text. Revenue and ARR are not interchangeable, so
      neither label should be normalized into a recurring-revenue metric. Until management provides
      a revenue bridge by stream and period, the public $30 million figure is only a low-confidence
      top-line proxy and cannot support retention, sales-efficiency, or valuation-multiple analysis.
    claimRefs:
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
    tableRefs:
      - "TI002"
    figureRefs: []

  - id: "capital-and-cost-base"
    title: "Financing expands options without proving capital adequacy"
    body: >-
      TechCrunch, syndicated by Yahoo Finance, reported the November 2025 Series B close at
      approximately $135 million and a $2.65 billion post-money valuation. Sakana AI's April 2026
      update later described the round as $200 million and cumulative funding as $412 million,
      reflecting an expanded close rather than cash generation from operations. The company says
      proceeds will fund R&D, a larger Applied team, and strategic investments, partnerships, and
      M&A. Those uses imply continuing research, delivery, and hiring demands, and an August 2026
      product-engineering listing confirms ongoing recruitment, but no source in the assigned pool
      discloses payroll, compute spend, cash balance, debt, burn, or runway. Company Overview owns
      the full round chronology; for financial underwriting, the latest financing is a capital
      input whose remaining availability and obligations are unknown.
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI014"
    tableRefs:
      - "TI003"
    figureRefs: []

  - id: "margin-path-and-verdict"
    title: "The margin path depends on costs that public sources do not quantify"
    body: >-
      Fugu is described by Sakana AI as orchestrating leading external LLMs while optimizing the
      cost-performance frontier. That architecture can create a direct dependency on third-party
      inference pricing at the same time that the Applied model requires product and domain
      engineering. The public record does not show whether customers reimburse model usage, whether
      implementation labor is capitalized or expensed, or whether packaged-product margins offset
      custom-delivery costs. Sakana AI's private status and EquityZen's treatment of financial data
      as proprietary reinforce the disclosure gap; neither establishes poor economics, but neither
      permits a positive margin conclusion. The financial verdict is therefore evidence-limited:
      commercial routes and financing are visible, while realized price, recurring revenue,
      gross margin, sales efficiency, working capital, debt, cash burn, and runway remain diligence
      blockers.
    claimRefs:
      - "CI012"
      - "CI013"
      - "CI015"
      - "CI016"
    tableRefs: []
    figureRefs:
      - "FI001"

