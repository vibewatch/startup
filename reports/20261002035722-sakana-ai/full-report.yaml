      - number: '6.2'
        title: Adoption Trajectory, Named Enterprise Proof, and Partner Ecosystem
        blocks:
          - type: paragraph
            body: >-
              Enterprise adoption at Sakana AI is anchored by flagship Japanese financial institutions and public sector
              agencies that co-invested in its Series A and Series B rounds. In the banking and securities domain,
              Mitsubishi UFJ Financial Group (MUFG), SMBC Group, and Daiwa Securities Group serve as premier
              co-development and deployment partners, integrating generative models and custom AI into high-reliability
              financial workflows. In public administration and national security, Sakana AI collaborates directly with
              the Acquisition, Technology & Logistics Agency (ATLA), the Ministry of Defense, and the Ministry of
              Internal Affairs and Communications on sovereign intelligence applications. Commercial reach expanded
              further in 2026 through strategic platform alliances with Google and Datadog. Under its January 2026
              partnership, Google committed capital and technical alignment around Gemini and Gemma model families for
              mission-critical deployments, while Datadog established an enterprise observability collaboration aimed at
              monitoring production AI deployments across Japanese enterprises.
            claimRefs:
