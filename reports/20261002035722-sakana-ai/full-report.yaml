  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Underlying frontier-model supply
        - Multiple undisclosed model providers
        - Worker models in the orchestration pool
        - Pool membership and traffic shares are not public.
        - Provider withdrawal, degraded service, price increase, or policy restriction.
        - High
        - Swappable pool and dynamic routing.
        - Medium-high until tested failover and approved-provider coverage are demonstrated.
      - - Orchestration control plane
        - Sakana AI
        - Routing, delegation, verification, synthesis, and API abstraction
        - Every Fugu request depends on the Sakana endpoint and coordinator.
        - Sakana outage, routing defect, compromised update, or contractual termination.
        - High
        - OpenAI-compatible interface may ease client integration changes.
        - High without export tooling, escrow or fallback path, and route-level observability.
      - - Compliance configuration by product tier
        - Sakana AI and its model pool
        - Agent allowlisting or exclusion
        - Standard Fugu supports opt-outs; a review reports Ultra uses a fixed pool.
        - A required performance tier cannot meet a customer's approved-provider policy.
        - High
        - Use standard Fugu or a constrained route where contractual controls permit.
        - High for workloads requiring both maximum performance and strict provider controls.
      - - Strategic investor and enterprise ecosystem
        - MUFG and other named investors, partners, and customers
        - Capital, distribution, product collaboration, and deployment access
        - Named relationships are public, but revenue and usage concentration are not.
        - Loss of one anchor relationship weakens distribution, validation, or funding signaling.
        - Medium-high
        - Broad investor list and expansion across finance, defense, and manufacturing.
        - Unquantified until customer-level revenue, renewal, and pipeline concentration are disclosed.
    notes: >-
      This register distinguishes named relationships from quantified concentration. Investor participation,
      collaboration, and customer use are different denominators; the public sources do not provide revenue shares,
      traffic shares, or renewal terms.
    claimRefs:
      - CR002
      - CR007
      - CR013
      - CR015
  - id: TV001
    title: Recommendation summary
    columns:
      - Decision item
      - Current view
      - Evidence basis
      - What would improve the view
    rows:
      - - Recommendation
        - TRACK / RESEARCH MORE
        - >-
          Product and relationship signals exist, but operating economics and financing terms are not publicly
          verifiable.
        - Verified contracted revenue, retention, margins, concentration, and security terms.
      - - Confidence
        - Medium-low
        - The latest company and independent Series B amounts and cumulative-funding totals conflict.
        - A financing schedule reconciled to bank statements and the capitalization table.
      - - Risk rating
        - High
        - Commercialization, product validation, private-security terms, and exit timing remain material uncertainties.
        - Independent product audit plus repeatable renewals in regulated deployments.
      - - Valuation stance
        - Stretched / unverified
        - >-
          The latest public reference is roughly $2.6-2.7 billion, while Sakana-specific revenue and margin denominators
          are unavailable.
        - A verified operating plan that supports venture returns at the proposed fully diluted entry value.
      - - Entry discipline
        - Do not underwrite from headline valuation
        - >-
          Funding raised does not establish cash available, and no public source resolves preference or dilution
          overhang.
        - Full capitalization table, liquidation waterfall, option pool, debt, cash, burn, and runway.
    notes: >-
      Decision synthesis as of 2026-10-02. Financing amounts conflict across the company and independent sources; no
      fair-value range, probability percentage, or return target is inferred.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV014
      - CV016
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - Current evidence
      - What would change the view
    rows:
      - - Thesis
        - Japan-focused product and deployment breadth can become a differentiated enterprise position.
        - The company names four products and work with financial institutions and public-sector agencies.
        - Verified renewals, deployment scope, and customer-reported ROI.
      - - Thesis
        - Capital and active technical output may support continued productization.
        - >-
          The company earmarked Series B capital for R&D and applied expansion; current hiring and developer activity
          remain visible.
        - Delivery evidence showing that hiring and research output convert to gross profit.
      - - Anti-thesis
        - Private-market pricing may have moved faster than proven economics.
        - >-
          The valuation reference rose from roughly $1.4-1.5 billion to roughly $2.6-2.7 billion while no
          Sakana-specific revenue denominator is disclosed.
        - Audited revenue, gross margin, retention, backlog, and a valuation method tied to those metrics.
      - - Anti-thesis
        - Research visibility may not translate into dependable regulated-enterprise products.
        - >-
          Public discussion of AI Scientist highlighted workshop-level acceptance, limited success across submitted
          papers, and citation-quality concerns.
        - Independent red-team and customer acceptance evidence for production systems.
    notes: >-
      This table separates observable signals from underwriting conclusions; company-issued product and deployment
      statements are not treated as independent customer verification.
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV015
      - CV016
  - id: TV003
    title: Bull, base, and bear scenario framing
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          Named enterprise and government relationships convert into repeatable deployments; product quality holds in
          regulated use; hiring supports delivery.
        - >-
          Current valuation could be considered only after verified economics demonstrate a credible venture return; no
          absolute range is supportable.
        - Rising contracted backlog, strong cohort retention, expanding gross margin, and independent customer ROI.
        - Pilot-to-production conversion or renewal misses.
      - - Base
        - >-
          Technical output and relationships continue, but public operating economics remain unavailable and financing
          discrepancies persist.
        - >-
          Use the roughly $2.6-2.7 billion financing mark as context only; wait for data or a more protective entry
          structure.
        - Continued product releases and deployments without audited unit economics.
        - A financing extension without improved disclosure or commercial proof.
      - - Bear
        - Commercial conversion or independent quality validation disappoints while private-market multiples compress.
        - >-
          A material discount to the latest round would be required, but the evidence does not support a precise
          percentage or fair-value floor.
        - Weak renewals, adverse quality findings, delayed regulated deployment, or weaker financing terms.
        - Quality failures, customer losses, down-round terms, or governance constraints.
    notes: >-
      Scenario probabilities and valuation ranges are intentionally qualitative because revenue, margins, retention,
      cash burn, fully diluted ownership, and liquidation terms are not public.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV010
      - CV014
      - CV015
      - CV016
