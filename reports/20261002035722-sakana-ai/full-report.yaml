    sections:
      - number: '1.1'
        title: Identity and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Sakana AI K.K. describes itself as a Tokyo-based frontier AI research and development company founded in
              July 2023. The official company page gives an Azabudai Hills address in Minato-ku and identifies a current
              Series B stage. Its operating model joins four functions: frontier research, applied enterprise work,
              user-facing products, and corporate operations. Current company pages name Sakana Fugu, Namazu, Marlin,
              and Translate, while the applied team says it scopes, builds, evaluates, and deploys systems with Japanese
              financial institutions and public agencies. The evidence therefore supports a hybrid model rather than a
              pure research lab or self-serve software vendor: proprietary research feeds products and bespoke
              implementation, with partners supplying integration and industrial distribution. Public pricing and the
              revenue mix between product licenses, services, and joint projects remain unavailable.
