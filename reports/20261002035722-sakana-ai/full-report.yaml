  - id: FE001
    title: Sakana AI Product and Technical Architecture Stack
    type: stack
    summary: >-
      Modular technical architecture illustrating Sakana AI's six-layer stack from user interface through orchestration,
      agent models, optimization, and accelerated infrastructure.
    data:
      layers:
        - label: Application & Interface Layer
          detail: Unified entry point delivering Fugu API endpoints, Sakana Chat, and custom enterprise business solutions
          modules:
            - Unified Fugu API Gateway
            - Sakana Chat Web Application
            - Enterprise Custom Business Applications (MUFG, SMBC, ATLA)
        - label: Orchestration & Cognitive Routing Layer
          detail: Learned two-tier prompt router and recursive multi-agent workflow coordinator
          modules:
            - Two-Tier Prompt Difficulty Classifier
            - Dynamic Task Dispatcher (Tier 1 Fast Lane vs. Tier 2 Capable Lane)
            - Recursive Self-Invocation & Workflow Coordinator
        - label: Specialized Model & Agent Pool
          detail: Heterogeneous collection of proprietary and open specialized models
          modules:
            - Sakana Namazu (Japanese Foundation Model with Web/Code Tools)
            - Sakana Marlin (Autonomous Strategy Research Agent)
            - Sakana Translate (Tone-Adaptive Trilingual Translation)
            - NVIDIA Nemotron (Open-Weights Tool-Calling & Coding Specialist)
        - label: Post-Training & Evolutionary Optimization Layer
          detail: Nature-inspired evolutionary algorithms and parameter-efficient model fusion
          modules:
            - Evolutionary Model Merging Framework
            - Darwin Gödel Machine (DGM) Self-Improving Architectures
            - ShinkaEvolve Program Synthesis Engine
            - Domain-Specific Enterprise Post-Training Pipeline
        - label: Observability, Evaluation & Trust Layer
          detail: Production telemetry, benchmark tracking, and multi-agent system observability
          modules:
            - Datadog Observability & Security Monitoring Integration
            - Automated Evaluation Harnesses & Benchmark Tracking
            - Enterprise Compliance & Guardrail Controls
        - label: Infrastructure & Compute Platform Layer
          detail: Containerized serving infrastructure backed by accelerated hardware
          modules:
            - NVIDIA Accelerated Computing GPU Infrastructure
            - Docker Containerized Production Serving
