  - id: FR001
    title: Qualitative residual-risk heatmap
    type: matrix
    summary: >-
      Governance and control-plane risks combine high potential impact with limited public evidence of mature
      mitigations.
    data:
      columns:
        - label: Likelihood
          detail: Qualitative assessment from public evidence; not a modeled probability.
        - label: Impact
          detail: Potential investment and customer consequence if the risk materializes.
        - label: Mitigation maturity
          detail: Assessment of publicly evidenced controls, not management's private control set.
      rows:
        - label: Routing and privacy opacity
          note: Driven by hidden multi-provider routes and missing public compliance artifacts.
          values:
            - label: Medium-high
              tone: high
            - label: High
              tone: critical
            - label: Low-public-evidence
              tone: high
        - label: Control-plane dependency
          note: Provider diversification does not remove dependence on Sakana's coordinator.
          values:
            - label: Medium
              tone: warning
            - label: High
              tone: critical
            - label: Medium
              tone: warning
        - label: Benchmark transfer and reliability
          note: Baseline scores are provider-reported and long-horizon replication is pending.
          values:
            - label: Medium
              tone: warning
            - label: High
              tone: critical
            - label: Low-public-evidence
              tone: high
        - label: Financial runway and unit economics
          note: Funding raised is disclosed, while burn, margins, revenue, and runway are not.
          values:
            - label: Medium
              tone: warning
            - label: High
              tone: critical
            - label: Low-public-evidence
              tone: high
        - label: Sensitive-sector assurance
          note: Named finance and government work raises assurance needs without proving specific approvals.
          values:
            - label: Medium
              tone: warning
            - label: High
              tone: critical
            - label: Low-public-evidence
              tone: high
        - label: Provider-policy drift
          note: The coordinator depends on an evolving pool of third-party and Sakana models.
          values:
            - label: Medium
              tone: warning
            - label: Medium-high
              tone: high
            - label: Medium
              tone: warning
    approximationNotes: >-
      Ordinal labels summarize source-backed exposure and disclosure gaps as of 2026-10-02; they are not numeric
      probabilities, audited control ratings, or incident forecasts.
    claimRefs:
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: The recommendation follows evidence from observable scale signals through unresolved underwriting inputs.
    data:
      nodes:
        - id: proof
          label: Products and named institutional relationships
          detail: Company-issued evidence of deployment breadth, not verified economics.
        - id: execution
          label: Hiring and active developer footprint
          detail: Current execution signal without a complete company headcount denominator.
        - id: financing
          label: Roughly $2.6-2.7B valuation reference
          detail: Latest public financing context, with conflicting round and cumulative totals.
        - id: uncertainty
          label: Operating and security terms unavailable
          detail: No public revenue, margin, retention, burn, cap-table, or preference basis.
        - id: discipline
          label: Require verified economics and terms
          detail: Reconcile financing and prove repeatable enterprise value before pricing.
        - id: decision
          label: TRACK / RESEARCH MORE
          detail: High risk; valuation stance stretched or unverified.
      edges:
        - from: proof
          to: execution
        - from: execution
          to: financing
        - from: financing
          to: uncertainty
        - from: uncertainty
          to: discipline
        - from: discipline
          to: decision
    approximationNotes: The flow is qualitative and does not imply a probability, conversion rate, return, or fair value.
    claimRefs:
      - CV003
      - CV006
      - CV008
      - CV009
      - CV014
