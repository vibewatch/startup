      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Sovereign AI Premium in Regulated Japanese Industries
            body: >-
              Sakana AI's core market defensibility stems from Japan's structural reluctance to transmit sensitive
              corporate and national intelligence to offshore API endpoints operated by US hyperscalers. By pairing
              localized Japanese models (Namazu) with flexible multi-agent orchestrators (Fugu) that optimize the Pareto
              frontier of performance and cost, Sakana unlocks enterprise budgets that are otherwise inaccessible to
              standard Western foundation model vendors.
