  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape & Categorization
        blocks:
          - type: paragraph
            body: >-
              Sakana AI operates across multiple competitive vectors in the artificial intelligence landscape,
              differentiating itself from capital-intensive foundation model pre-training labs through evolutionary
              model merging and learned multi-agent orchestration. The broader market consists of vertically integrated
              incumbents, frontier foundation model developers, domestic Japanese players pursuing compute-efficient
              architectures, and open-source tooling ecosystems. While traditional frontier providers such as OpenAI and
              Anthropic scale massive dense or Mixture-of-Experts transformer architectures with multi-billion-dollar
              compute clusters, Sakana AI positions its technology stack around biological inspiration, evolutionary
              parameter combination, and coordinated agent execution. Within Japan, large domestic conglomerates
              including SoftBank, Rakuten, CyberAgent, and Preferred Networks pursue sovereign AI initiatives supported
              by domestic subsidies and proprietary data access, presenting structural competition for enterprise IT and
              banking modernization budgets. Simultaneously, open-source community utilities like mergekit and Optuna
              Hub replicate baseline model merging methodologies, forcing Sakana AI to move upmarket from static weight
              merging toward dynamic learned multi-model orchestration with Fugu and specialized autonomous strategic
              research agents like Marlin.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
