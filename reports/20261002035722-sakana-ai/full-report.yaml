      - number: '3.2'
        title: Capability & Benchmark Differentiation
        blocks:
          - type: paragraph
            body: >-
              The core technical battleground for Sakana AI has shifted from standalone parameter count toward
              multi-agent coordination efficiency and benchmark reliability across complex software engineering,
              reasoning, and domain-specific Japanese tasks. Through its Fugu orchestration architecture, grounded in
              the ICLR 2026 TRINITY and Conductor research papers, Sakana AI abstracts heterogeneous model pools behind
              a unified OpenAI-compatible endpoint. Published evaluations demonstrate competitive advantages on
              multi-step execution benchmarks where single models frequently fail: on SWE-Bench Pro, Fugu Ultra scored
              73.7 compared to Opus 4.8 at 69.2, GPT-5.5 at 58.6, and Gemini 3.1 Pro at 54.2. On TerminalBench 2.1, Fugu
              Ultra recorded 82.1 against Opus 4.8 at 74.6, while matching Opus 4.8 at 50.0 on Humanity's Last Exam.
              Furthermore, in specialized domain challenges such as reconstructing classical Japanese kana reading order
              from non-linear chirashigaki manuscripts, Fugu Ultra demonstrated a normalized edit distance of 0.80
              against expert ground truth, substantially outperforming competing frontier models that achieved 0.24 or
              failed to generate valid syntax. However, these benchmark results are vendor-published evaluations using
              mini-swe-agent scaffolding, and independent third-party audits remain pending.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
      - number: '3.3'
        title: Packaging, Pricing & Go-To-Market Friction
        blocks:
          - type: paragraph
            body: >-
              Commercialization across alternative AI architectures reveals stark differences in contract structure,
              packaging flexibility, and governance compliance. Sakana AI employs a hybrid go-to-market structure
              comprising multi-year enterprise transformation partnerships, credit-based autonomous research
              subscriptions via Marlin, and token-based orchestration API pricing for Fugu. For Fugu Ultra, token
              pricing is established at $5 per million input tokens and $30 per million output tokens, which appears
              competitive with standalone frontier models like Claude Fable 5 ($10 input and $50 output per million
              tokens) while introducing hidden token multipliers because internal coordinator turns and verification
              passes count toward total billable usage. In enterprise deployments, Sakana AI embeds with Japanese
              megabanks including MUFG and SMBC Group to co-develop credit assessment workflows and tacit knowledge
              pipelines, creating defensive institutional moats. Conversely, enterprise adoption outside Japan faces
              acute friction: Fugu is entirely unavailable in the EU and EEA due to pending GDPR and EU AI regulatory
              compliance, while strict model pool opacity prevents regulated institutions from inspecting exact
              sub-model routing paths.
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Model Opacity and Regulatory Compliance Boundaries
            body: >-
              While Sakana AI pitches Fugu as a friction-free multi-model orchestrator that mitigates single-vendor
              lock-in, its architectural opacity presents a double-edged sword for enterprise risk officers. In highly
              regulated corporate environments, compliance protocols often require granular audits proving which
              underlying foundation model ingested sensitive corporate data. Fugu Ultra's fixed pool prevents selective
              model opt-outs, and the platform remains completely blocked in the EU and EEA due to pending GDPR and
              EU-specific regulatory reviews.
            calloutType: risk
            claimRefs:
              - CP015
              - CP016
          - type: callout
            title: Sovereign Moats as a Counterweight to Commodity Merging
            body: >-
              As open-source libraries like mergekit commoditize static weight merging, Sakana AI's durable competitive
              advantage rests not on proprietary merging algorithms alone, but on institutional integration within
              Japan's corporate fabric. Deep enterprise alliances with megabanks like MUFG and government entities like
              ATLA allow Sakana to codify proprietary institutional workflows into training pipelines, creating
              switching costs that generic global LLM vendors cannot readily overcome.
            calloutType: insight
            claimRefs:
              - CP004
              - CP006
