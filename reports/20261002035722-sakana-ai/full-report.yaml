      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Structural Adoption Dynamics
        blocks:
          - type: paragraph
            body: >-
              Adoption of Sakana AI's platforms is concentrated among institutional buyers navigating severe demographic
              and regulatory pressures. In the commercial banking and financial services vertical, executive budget
              ownership resides primarily with Chief Digital Officers and heads of enterprise transformation at
              institutions such as MUFG, SMBC, and Citi. These buyers are motivated by operational efficiency gains,
              workflow automation in underwriting and risk analysis, and strict adherence to Financial Services Agency
              data sovereignty standards. In the public defense and government sector, procurement is controlled by
              agency leadership at the Ministry of Defense and the Acquisition, Technology & Logistics Agency (ATLA),
              where autonomous intelligence, sovereign cyber defense capabilities, and isolation from geopolitical
              supply shocks serve as non-negotiable procurement mandates. However, enterprise adoption faces meaningful
              headwinds: long institutional procurement cycles, complex integration into legacy mainframe architectures,
              high switching costs from incumbent system integrators, and persistent skepticism regarding autonomous
              agent hallucination rates in high-stakes operational environments.
