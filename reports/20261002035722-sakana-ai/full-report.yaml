  - id: FU001
    title: Sakana AI enterprise customer adoption and expansion journey
    type: journey-map
    summary: Multi-stage progression from developer API evaluation to embedded sovereign enterprise workflows.
    data:
      items:
        - label: 1. Developer Discovery
          description: Technical teams evaluate Sakana Fugu API and open-source models for model orchestration and cost efficiency.
          touchpoints:
            - OpenAI-compatible Fugu API trial ($20-$200/mo)
            - Namazu Japanese model evaluation
            - Hugging Face and GitHub community open-weight exploration
        - label: 2. Strategic Task Testing
          description: Corporate planning and research departments deploy Sakana Marlin for autonomous business intelligence.
          touchpoints:
            - Sakana Marlin Pro/Team subscription (150k-400k JPY/mo)
            - Multi-hour autonomous research generation
            - Executive review and decision-support pilot testing
        - label: 3. Enterprise Co-Design
          description: >-
            Applied team engages directly with client domain specialists to co-develop bespoke high-reliability
            workflows.
          touchpoints:
            - Scoping sessions with banking or defense domain experts
            - Joint system evaluation in field environments
            - Security, data sovereignty, and compliance verification
        - label: 4. Full-Scale Rollout
          description: >-
            Production implementation integrated with client IT infrastructure and partner platforms like Google and
            Datadog.
          touchpoints:
            - Multi-year enterprise software agreements
            - Observability and governance integration via Datadog
            - Sovereign deployment across regulated enterprise operations
        - label: 5. Ecosystem Expansion
          description: >-
            Expansion across corporate group affiliates, international subsidiaries, and adjacent public sector
            agencies.
          touchpoints:
            - Cross-subsidiary deployment (e.g. MUFG group banks and brokerages)
            - Global enterprise expansion supported by strategic backers
            - Feedback integration into next-generation sovereign models
        - label: 6. Platform Governance & Renewal
          description: >-
            Long-term evaluation of sovereign SLA performance, model accuracy benchmarks, and commercial contract
            renewals.
          touchpoints:
            - Annual software contract renewals and expansion reviews
            - Benchmarking against next-generation foundation model releases
            - Audit of sovereign compliance and operational efficiency metrics
