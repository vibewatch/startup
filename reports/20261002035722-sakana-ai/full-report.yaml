  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual risk view
        blocks:
          - type: paragraph
            body: >-
              The leading residual risk is governance opacity rather than a demonstrated compliance breach. Fugu can
              select, delegate to, and combine multiple models behind one endpoint, which may diversify model supply
              while making the route, subprocessors, intermediate data flows, and post-incident reconstruction harder
              for a customer to verify. Independent commentary identifies this trade-off explicitly, while Sakana
              describes model selection and synthesis as internal to the service. The second risk is dependency
              migration: a swappable pool can route around one unavailable provider, but the customer then depends on
              Sakana's coordinator, provider agreements, routing policy, and update discipline. Benchmark risk ranks
              next because competing-model scores are provider-reported and long-horizon replication remains pending.
              These rankings are qualitative and should be replaced with auditable routing, security, evaluation, and
              service-level evidence before a production-scale commitment.
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR007
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR016
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not establish the full legal perimeter. One independent review reports that Fugu was
              unavailable in the EU and EEA while Sakana aligned black-box routing with GDPR, but the assigned pool
              contains neither a regulator record nor Sakana terms, a data-processing agreement, a subprocessor list, or
              a certification register that confirms the present scope. That makes the restriction a reported current
              constraint, not a verified enforcement event. Compliance control also varies by product tier: Sakana says
              standard Fugu permits specific-agent opt-outs, while a review reports that Ultra's pool is fixed. The
              company's work with finance, defense, and Japanese government bodies raises the required assurance level,
              but those named relationships do not themselves prove authorization, certification, or production
              compliance. Legal diligence should therefore focus on route-level data residency, retention, IP
              allocation, audit rights, and incident notification.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR007
              - CR009
      - number: '7.3'
        title: Operational, reliability, and financial exposure
        blocks:
          - type: paragraph
            body: >-
              Learned orchestration adds failure surfaces beyond those of a single model: routing mistakes, correlated
              verification, recursive cost growth, latency, provider-policy drift, and difficulty reproducing the exact
              path that produced an answer. Sakana's release reports a beta with close to 500 early users and favorable
              testimonials, but those accounts are company-selected and do not disclose task denominators, failure
              rates, latency distributions, or independent audit methods. A product-engineering job listing calls out
              CI/CD, monitoring, scaling, and security as active responsibilities, which is a useful execution signal
              but not proof that controls are complete. The Series B announcement states $200 million raised and planned
              investment in research, applied deployment, partnerships, and M&A; it does not disclose cash available,
              revenue, accounting loss, cash burn, runway, gross margin, or working-capital needs. Funding raised must
              not be read as current liquidity.
            claimRefs:
              - CR006
              - CR008
              - CR010
              - CR011
              - CR012
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR008
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Dependencies, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The core mitigation is genuine pool substitutability, but it must be demonstrated under outage,
              policy-change, and data-residency scenarios rather than inferred from architecture claims. Procurement
              should require route logs, approved-provider allowlists, version pinning, cost and latency budgets,
              independent red-team results, and a tested export path from Sakana's endpoint. Named investors and
              collaborators include major financial, technology, and infrastructure groups, while the homepage names
              enterprise and government work; public evidence does not quantify revenue or usage concentration among
              them. Thesis-break triggers are therefore: inability to produce route-level audit evidence for regulated
              data; a material incident without timely customer reconstruction; replicated quality below a contracted
              baseline; sustained cost or latency outside agreed budgets; loss of a critical upstream model without a
              successful failover; or financing needs emerging before Sakana can disclose credible unit economics and
              runway.
            claimRefs:
              - CR007
              - CR013
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR007
              - CR013
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Gate production scale on auditability, not benchmark rank
            body: >-
              Require route-level data maps, approved-provider controls, independent workload tests, incident evidence,
              and financial runway before treating orchestration resilience as a de-risking feature.
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR005
              - CR011
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Public financing evidence establishes a high private-market reference point but not a defensible fair
              value. Sakana AI's updated Series B page says the round raised $200 million, produced an approximately
              $2.7 billion post-money valuation, and brought cumulative funding to about $412 million. TechCrunch's
              report from the original November 2025 announcement instead described a $135 million round, a $2.65
              billion post-money valuation, and roughly $379 million raised in total. Market-data sources also disagree
              on cumulative funding. These differences may reflect extensions, currency conversion, or later strategic
              investment, but the retained evidence does not reconcile them. Funding raised is therefore not treated as
              cash available. Entry discipline should be based on a reconciled capitalization table, security terms, and
              verified operating metrics, not the headline valuation alone.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV014
              - CV016
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case rests on observable breadth rather than disclosed economics. Sakana AI presents four
              products and names work with major Japanese financial institutions and public agencies; its verified
              Hugging Face organization shows a substantial technical footprint, and a current product-engineering
              posting points to continued production investment. The Series B proceeds were designated for research,
              applied teams, defense and manufacturing expansion, and strategic activity. The anti-thesis is that
              valuation expansion has run ahead of independently verified commercialization. The retained sources
              provide no audited revenue, ARR, gross margin, retention, burn, or customer-concentration denominator.
              Public discussion of AI Scientist also raises quality and validation questions that matter because
              research visibility is not equivalent to durable enterprise value.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV015
              - CV016
      - number: '8.3'
        title: Scenario and comparable discipline
        blocks:
          - type: paragraph
            body: >-
              A milestone method is more appropriate than a revenue multiple until Sakana AI discloses comparable
              operating data. Multiples.vc lists selected private software companies near 26 times revenue and selected
              public references from below 1 times to nearly 20 times revenue, but the business models, growth, margins,
              and reporting bases are not shown as comparable to Sakana AI. Those observations are context, not an
              independent benchmark or a valuation formula. The bull case requires verified conversion of named
              relationships into repeatable, high-retention revenue. The base case preserves technical and relationship
              progress while withholding a price conclusion. The bear case combines commercialization slippage, external
              product-quality concerns, and private-market multiple compression. No probability percentage, return
              target, or absolute fair-value range is supportable from the assigned public evidence.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV010
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV010
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Recommendation, exit readiness, and diligence
        blocks:
          - type: paragraph
            body: >-
              The decision is TRACK / RESEARCH MORE, with medium-low confidence, high risk, and a stretched or
              unverified valuation stance. This is not a negative judgment on technical quality; it is a refusal to
              underwrite an institutional entry price without operating and security-level evidence. The retained
              sources do not establish audited financials, a public-market timetable, secondary liquidity, preference
              seniority, or governance rights, so hold period and target return remain open diligence items. A move
              toward investment requires reconciled financing, cohort retention, gross margin, contracted backlog,
              customer concentration, cash burn, runway, and independent product-quality evidence. Thesis-break triggers
              are failed conversions or renewals among named relationships, quality evidence that blocks regulated
              deployment, continued financing-data inconsistency, or a new round that preserves the headline price
              without materially stronger economics.
            claimRefs:
              - CV003
              - CV006
              - CV010
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV006
              - CV008
              - CV009
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive decision
            body: >-
              Track the company, but do not underwrite the latest headline valuation until financing, operating
              economics, downside protections, and independent product quality are verified.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV014
              - CV016
