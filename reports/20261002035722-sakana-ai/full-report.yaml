      - number: '6.3'
        title: Retention Dynamics, Account Concentration, and Commercial Gaps
        blocks:
          - type: paragraph
            body: >-
              While Sakana AI demonstrates exceptional access to Japanese corporate leadership and state procurement
              channels, the durability and financial scale of its customer base remain difficult to audit independently.
              Unlike pure-play SaaS peers such as LayerX that report audited ARR and net retention rates, Sakana AI has
              not publicly disclosed annual recurring revenue, customer churn, gross revenue retention, or contract
              renewal rates. The company's heavy reliance on strategic corporate shareholders creates potential customer
              concentration risk, where initial production commitments may reflect strategic venture allocations rather
              than arm's-length commercial software demand. Furthermore, deep bespoke custom implementations require
              dedicated applied engineering personnel, creating delivery bottlenecks that could constrain rapid software
              margin expansion. As enterprise customers evaluate long-term deployment costs, Sakana AI must prove that
              its sovereign model orchestration can sustain high renewal rates against competing frontier model APIs.
            claimRefs:
              - CU003
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Equity-Customer Dual Alignment in Japanese Enterprise Diligence
            body: >-
              Sakana AI's core enterprise customer base is uniquely intertwined with its shareholder registry. Flagship
              clients including MUFG, Mitsubishi Electric, Datadog, and Google participated directly in the Series B
              financing. While this equity alignment accelerates initial access and enterprise pilot sponsorship, it
              obscures whether deployment volume reflects organic commercial software demand or subsidized strategic
              experimentation.
            calloutType: insight
            claimRefs:
              - CU005
              - CU007
              - CU009
              - CU011
              - CU015
          - type: callout
            title: Opaque Unit Economics and Absence of SaaS Retention Reporting
            body: >-
              Unlike standard B2B software vendors that benchmark customer durability through audited Net Revenue
              Retention (NRR) and Gross Revenue Retention (GRR), Sakana AI provides no public visibility into contract
              churn or customer expansion. Investors must treat reported commercialization progress as qualitative proof
              of enterprise interest rather than verified recurring software economics.
            calloutType: risk
            claimRefs:
