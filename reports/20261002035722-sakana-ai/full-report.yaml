  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Spend Allocation
        blocks:
          - type: paragraph
            body: >-
              The enterprise artificial intelligence landscape in Japan is structurally bifurcated between global
              frontier foundational infrastructure and domestic, domain-tailored software execution. Sakana AI
              specifically positions its product portfolio across sovereign foundational post-training, specialized
              multi-agent orchestration via systems like Sakana Fugu, and vertical applied research automation such as
              Marlin and The AI Scientist. This market boundary explicitly captures enterprise operational software
              budgets, specialized domain adaptation spend, and government-directed sovereign compute programs across
              Japan's banking, manufacturing, and defense establishments. Conversely, it deliberately excludes
              commoditized raw GPU hardware procurement, general-purpose consumer chatbot subscriptions, and generic
              Western cloud hosting contracts. The primary status-quo substitutes in this space remain manual human
              professional services, internal systems integration initiatives by domestic IT conglomerates, and direct
              procurement of generic Western foundation model APIs that lack local sovereign hosting guarantees or
              specialized Japanese cultural and regulatory alignment.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Market Sizing Frameworks and Constrained Growth Lenses
        blocks:
          - type: paragraph
            body: >-
              Evaluating the addressable market for Sakana AI requires dissecting broad macro estimates into defensible,
              constrained expenditure layers. While aggregate worldwide generative AI spending forecasts exceed several
              hundred billion dollars across all sectors, the realistic sovereign enterprise opportunity in Japan is
              governed by stringent localized constraints. A multi-lens TAM/SAM/SOM framework illustrates this
              structural narrowing. The broadest total addressable market comprises the overall Japanese enterprise
              software and digital transformation budget, which represents the macroeconomic ceiling for technology
              modernization. Within that boundary, the serviceable addressable market is restricted to domestic
              enterprise AI platforms, specialized sovereign model training, and private cloud agent deployments where
              data residency and national security considerations preclude unmanaged offshore model APIs. Finally,
              Sakana's serviceable obtainable market isolates high-security enterprise tiers—specifically tier-one
              financial institutions, defense agencies, and major domestic industrial conglomerates that require custom
              domain adaptation and dedicated on-premises or sovereign cloud orchestration.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
