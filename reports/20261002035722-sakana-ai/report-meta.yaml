companyProfile:
  summary: >-
    Sakana AI is a Tokyo-based frontier AI company founded in 2023. It pairs research on self-evolving and multi-model
    systems with applied enterprise work and products such as Fugu, Namazu, Marlin, and Translate. The company appears
    to monetize through a mix of product and custom implementation motions, but the public record does not disclose the
    revenue split, pricing, retention, or margin profile needed to underwrite its operating economics.
