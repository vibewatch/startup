company:
  name: "Sakana AI"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Sakana AI is a Tokyo-based AI company founded in 2023 by David Ha, Ren Ito, and Llion Jones. Its April 2026 Series B update reports a $2.7B post-money valuation and $412M of cumulative funding, but the assigned public evidence does not establish revenue, ARR, total customers, exact headcount, board rights, or current secondary-market pricing."
sections:
  - id: "identity-and-operating-model"
    title: "Identity and Operating Model"
    body: >-
      Sakana AI K.K. describes itself as a Tokyo-based frontier AI research and
      development company founded in July 2023. The official company page gives
      an Azabudai Hills address in Minato-ku and identifies a current Series B
      stage. Its operating model joins four functions: frontier research,
      applied enterprise work, user-facing products, and corporate operations.
      Current company pages name Sakana Fugu, Namazu, Marlin, and Translate,
      while the applied team says it scopes, builds, evaluates, and deploys
      systems with Japanese financial institutions and public agencies. The
      evidence therefore supports a hybrid model rather than a pure research
      lab or self-serve software vendor: proprietary research feeds products
      and bespoke implementation, with partners supplying integration and
      industrial distribution. Public pricing and the revenue mix between
      product licenses, services, and joint projects remain unavailable.
    claimRefs:
      - "CO001"
      - "CO004"
      - "CO012"
      - "CO013"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership and Governance"
    body: >-
      The founding team combines research, commercial, and institutional
      backgrounds. David Ha is CEO, Ren Ito is Chairman, and Llion Jones is CTO;
      independent company profiles corroborate the three founder names, while
      Sakana AI supplies the current role assignments. The official leadership
      page also names Jürgen Schmidhuber as Chief Scientific Advisor and Ai
      Fujiki as CFO, noting that Fujiki joined in July 2025 before her
      appointment. This coverage is meaningful but not a governance map. The
      assigned evidence does not establish board composition, investor
      observers, voting thresholds, ownership percentages, founder vesting, or
      succession plans. Consequently, key-person exposure is an analytical
      concern rather than a measured probability: the public narrative remains
      closely tied to the three founders' research reputation, institutional
      access, and technical direction, while formal checks and replacement
      capacity require private diligence.
    claimRefs:
      - "CO002"
      - "CO003"
      - "CO015"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-stakeholders"
    title: "Capitalization and Stakeholders"
    body: >-
      Sakana AI announced approximately $200M of Series A funding in September
      2024, led by NEA, Khosla Ventures, and Lux Capital. Its Series B
      announcement dated November 17, 2025 reports another $200M, or 32B yen;
      an April 9, 2026 update reports a 432B-yen ($2.7B) post-money valuation
      and 66B yen ($412M) of cumulative funding. Those figures are
      company-issued and should not be confused with cash currently available.
      A separate investment profile lists a $2B valuation for November 2025,
      while Forge reported limited market activity and no available price,
      funding, or post-money figure as of August 2025; the vintages and methods
      are not comparable enough to treat the entries as a current contradiction.
      The broad investor and partner roster can aid distribution, but economic
      ownership, control rights, liquidation preferences, and investment
      amounts by participant are not disclosed.
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO016"
    tableRefs:
      - "TO003"
  - id: "scale-milestones-and-evidence-limits"
    title: "Scale, Milestones, and Evidence Limits"
    body: >-
      Partner-issued evidence shows that the company is moving from research
      toward implementation, but it does not quantify operating scale. Citi
      announced an investment in February 2026 without stating its size.
      Sumitomo Corporation and SCSK announced a September 2026 alliance in which
      Sakana AI supplies model, solution, and product capabilities, SCSK
      supplies integration, security, and operations, and Sumitomo supplies
      industrial deployment reach. Sakana AI's own homepage names work with
      MUFG Bank, SMBC Group, Daiwa Securities Group, the Ministry of Defense,
      ATLA, and the Ministry of Internal Affairs and Communications; these are
      named relationships, not a disclosed customer denominator. Across the
      eight assigned sources, revenue, ARR, margins, cash burn, runway, exact
      headcount, and total customer count remain unverified. The dated timeline
      therefore emphasizes financing and announced partnerships rather than
      unsupported scale estimates.
    claimRefs:
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO014"
    figureRefs:
      - "FO001"
