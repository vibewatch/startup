callouts:
  - calloutType: "insight"
    title: "The Equity-Customer Dual Alignment in Japanese Enterprise Diligence"
    body: "Sakana AI's core enterprise customer base is uniquely intertwined with its shareholder registry. Flagship clients including MUFG, Mitsubishi Electric, Datadog, and Google participated directly in the Series B financing. While this equity alignment accelerates initial access and enterprise pilot sponsorship, it obscures whether deployment volume reflects organic commercial software demand or subsidized strategic experimentation."
    claimRefs:
      - "CU005"
      - "CU007"
      - "CU009"
      - "CU011"
      - "CU015"
  - calloutType: "risk"
    title: "Opaque Unit Economics and Absence of SaaS Retention Reporting"
    body: "Unlike standard B2B software vendors that benchmark customer durability through audited Net Revenue Retention (NRR) and Gross Revenue Retention (GRR), Sakana AI provides no public visibility into contract churn or customer expansion. Investors must treat reported commercialization progress as qualitative proof of enterprise interest rather than verified recurring software economics."
    claimRefs:
      - "CU003"
      - "CU013"
      - "CU014"
      - "CU016"
