callouts:
  - calloutType: "risk"
    title: "Model Opacity and Regulatory Compliance Boundaries"
    body: "While Sakana AI pitches Fugu as a friction-free multi-model orchestrator that mitigates single-vendor lock-in, its architectural opacity presents a double-edged sword for enterprise risk officers. In highly regulated corporate environments, compliance protocols often require granular audits proving which underlying foundation model ingested sensitive corporate data. Fugu Ultra's fixed pool prevents selective model opt-outs, and the platform remains completely blocked in the EU and EEA due to pending GDPR and EU-specific regulatory reviews."
    claimRefs:
      - "CP015"
      - "CP016"
  - calloutType: "insight"
    title: "Sovereign Moats as a Counterweight to Commodity Merging"
    body: "As open-source libraries like mergekit commoditize static weight merging, Sakana AI's durable competitive advantage rests not on proprietary merging algorithms alone, but on institutional integration within Japan's corporate fabric. Deep enterprise alliances with megabanks like MUFG and government entities like ATLA allow Sakana to codify proprietary institutional workflows into training pipelines, creating switching costs that generic global LLM vendors cannot readily overcome."
    claimRefs:
      - "CP004"
      - "CP006"
