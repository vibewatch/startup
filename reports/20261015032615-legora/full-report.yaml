        title: Exhibits
        blocks:
          - type: callout
            title: Legora's real market is a workflow budget, not a pure research budget
            body: >-
              The competitive set broadens as Legora automates more of the legal workflow: the buyer can compare it with
              Harvey for premium legal AI, with CoCounsel for trusted research, or with Bind and Ironclad when the pain
              point is contract throughput rather than lawyer productivity.
            calloutType: insight
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP010
              - CP012
              - CP015
          - type: callout
            title: Price opacity creates both tactical leverage and renewal risk
            body: >-
              Quote-only packaging helps Legora pressure Harvey in live deals, but the lack of public rate cards or seat
              minimums also makes budgeting and renewal outcomes harder for customers to underwrite.
            calloutType: risk
            claimRefs:
