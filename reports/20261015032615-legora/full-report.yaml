        title: Funding trajectory, operating scale, and milestones
        blocks:
          - type: paragraph
            body: >-
              The strongest public through-line is acceleration: ILTA's vendor profile aggregates six disclosed rounds
              from 2024 through October 2025, and Legora's own March 2026 release plus later Sacra and TVPI reporting
              show a steep jump to late-stage financing and broader market visibility in 2026. Operating scale also
