        - >-
          A flat or down-round outcome becomes possible because the valuation outran the disclosure quality needed for a
          clean underwrite.
        - Hidden preference overhang, slowing expansion, margin weakness, or crowded competition.
        - Triggered by weak cohort economics, concentrated customer wins, or adverse term-sheet details.
    notes: >-
      These are analytical scenarios, not probability-weighted valuation outputs; the public record does not disclose
      enough to support a precise DCF or revenue-multiple bridge.
    claimRefs:
      - CV005
      - CV006
      - CV008
      - CV010
      - CV011
      - CV014
      - CV016
