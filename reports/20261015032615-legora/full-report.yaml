  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape spans direct legal copilots, incumbents, and adjacent workflow substitutes
        blocks:
          - type: paragraph
            body: >-
              The retained evidence suggests buyers do not evaluate Legora against a single peer set. Direct competition
              comes from Harvey in enterprise legal AI and from CoCounsel or other incumbent research stacks where the
              decision is content trust and workflow fit rather than raw model novelty. A second lane is adjacent
              contract infrastructure, where Bind and Ironclad win when the buyer's problem is approvals, templates,
              e-signature, or renewals rather than lawyer productivity. A third lane is status-quo or low-cost
              substitution, including general AI and products marketed as open source, such as Eigent. That breadth
              matters because it widens the set of reasons a legal team can defer, multi-home, or segment spend rather
              than standardize on one premium copilot.
            claimRefs:
              - CP006
              - CP007
              - CP010
