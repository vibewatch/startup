  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports an enterprise pilot-to-expansion revenue motion with services-heavy activation and
      outcome-driven renewal.
    data:
      nodes:
        - id: need
          label: Enterprise legal workflow need
          note: Law firm or in-house legal team needs faster research, review, and drafting throughput.
        - id: pilot
          label: Pilot or matter-scoped deployment
          note: Initial rollout is usually tied to a team, matter, or workflow rather than self-serve signup.
        - id: contract
          label: Negotiated subscription contract
          note: Public evidence points to enterprise quotes and annual licensing rather than published list pricing.
        - id: rollout
          label: Integration and legal-engineering rollout
          note: Implementation includes workflow setup plus integrations across Word, email, research, and document systems.
        - id: outcomes
          label: Productivity and cost outcomes
          note: Case studies emphasize shorter review cycles, lower spend, and usable structured contract data.
        - id: expansion
          label: Renewal and expansion
          note: >-
            Positive outcomes support wider licenses and deeper in-house penetration, but public retention data is
            unavailable.
      edges:
        - from: need
          to: pilot
          label: Demo and scoped use case
        - from: pilot
          to: contract
          label: Paid enterprise agreement
        - from: contract
          to: rollout
          label: Configure workflows and integrations
        - from: rollout
          to: outcomes
          label: Adoption creates measurable ROI
        - from: outcomes
          to: expansion
          label: Reference value supports wider deployment
    approximationNotes: >-
      This flow describes the public commercial logic only; it does not infer conversion rates, margin percentages, or
      realized contract values.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI010
      - CI015
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence points to a six-layer operating stack from lawyer-facing surfaces down to connector governance and
      services.
    data:
      layers:
        - label: User surfaces
          detail: Lawyers interact through web, Word, Outlook, and mobile.
          modules:
            - label: Interfaces
              detail: Web workspace, Microsoft Word add-in, Outlook add-in, mobile
        - label: Specialist task modules
          detail: Productized legal tasks sit above the control plane.
          modules:
            - label: Modules
              detail: Tabular Review, Assistant / Research, Monitors, Portal
        - label: Orchestration layer
          detail: The aOS, Agent, and Workflows coordinate multi-step legal execution.
          outputs:
            - Drafting
            - Review
            - Research
            - Delivery
        - label: Knowledge layer
          detail: Firm-specific context informs outputs and review standards.
          modules:
            - label: Knowledge assets
              detail: Playbooks, precedent libraries, clause banks, client history, negotiated positions
        - label: External systems of record
          detail: Connectors pull from and write back to enterprise legal systems.
          modules:
            - label: Systems
              detail: SharePoint, iManage, NetDocuments, legal databases, email, matter systems
        - label: Governance and rollout
          detail: Permissions, ethical walls, audit logs, and Legal Engineers shape safe deployment.
          modules:
            - label: Controls
              detail: Per-request permissions, Intapp / iManage policy controls, audit logging
    claimRefs:
      - CE002
      - CE006
      - CE009
      - CE010
      - CE014
  - id: FU001
    title: Customer journey from pilot to rollout
    type: journey-map
    summary: >-
      Public evidence points to a consultative land-and-expand motion that begins with lawyer workflows and scales
      through embedded enablement rather than pure self-serve adoption.
    data:
      items:
        - label: High-stakes legal workflow triggers evaluation
          actor: 'Buyer: law-firm partner, GC, or legal-ops lead'
          phase: Discovery
          touchpoints:
            - Due diligence, drafting, review, and legal research are the most consistently described starting jobs.
          tone: neutral
        - label: Team-level pilot inside legal users' existing tools
          actor: 'User: lawyers and legal teams'
          phase: Pilot
          touchpoints:
            - >-
              Word add-ins, shared workspaces, and source-backed research let teams trial real matters without replacing
              legal oversight.
          tone: neutral
        - label: Legal Engineers configure workflows and knowledge
          actor: Implementation team + customer legal team
          phase: Enablement
          touchpoints:
            - >-
              Official and investor sources describe embedded Legal Engineers who tailor practice-area workflows,
              playbooks, and knowledge.
          tone: positive
        - label: Daily production usage expands across matters
          actor: Lawyers reviewing, drafting, and researching
          phase: Activation
          touchpoints:
            - >-
              Tooliverse and official sources tie adoption to recurring contract intake, diligence, and research
              workflows.
          tone: positive
        - label: Expansion moves across practice areas or in-house teams
          actor: Firm or enterprise legal leadership
          phase: Expansion
          touchpoints:
            - >-
              Bessemer and Sacra describe land-and-expand dynamics, including broader in-house mix and higher account
              penetration.
          tone: positive
        - label: Broad rollout still requires buyer diligence on fit and economics
          actor: CFO, GC, procurement
          phase: Underwriting
          touchpoints:
            - >-
              Public pricing remains opaque, and non-lawyer self-serve automation is not the strongest public fit
              signal.
          tone: warning
    approximationNotes: >-
      Synthesized from dated public descriptions of rollout steps; the sequence reflects repeated patterns in retained
      sources, not a disclosed vendor funnel with conversion rates.
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU010
      - CU011
      - CU014
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Public evidence points to high impact in regulation, deployment complexity, workflow-fit execution, and
      concentration-sensitive scaling.
    data:
      columns:
        - label: Regulatory / legal
          detail: Human-oversight and professional-liability constraints on agentic legal work.
        - label: Security / data handling
          detail: Architecture disclosure, residency, retention, and incident-response diligence.
        - label: Operational / delivery
          detail: Integration-heavy rollout and services-assisted implementation.
        - label: Partner / channel
          detail: Reliance on implementation partners and channel-led proof points.
        - label: GTM / workflow fit
          detail: Fit between law-firm productivity and in-house automation demand.
        - label: Financial / concentration
          detail: Rapid expansion, premium expectations, and opaque concentration metrics.
      rows:
        - label: Likelihood
          values:
            - label: Medium-high
              tone: warning
              detail: Scrutiny is already explicit in third-party risk commentary.
            - label: Medium
              tone: warning
              detail: Public control claims exist, but private diligence still carries heavy weight.
            - label: Medium-high
              tone: warning
              detail: Product breadth and integration depth raise execution burden.
            - label: Medium
              tone: neutral
              detail: Partner-led wins help, but they also show reliance on external delivery muscle.
            - label: High
              tone: warning
              detail: Competitor comparisons repeatedly attack the same workflow-fit gap.
            - label: Medium
              tone: neutral
              detail: Downside exists, but public burn and cohort data remain undisclosed.
        - label: Impact
          values:
            - label: High
              tone: warning
              detail: Regulatory limits could directly cap autonomous workflow adoption.
            - label: High
              tone: warning
              detail: Security-review failures would block expansion into the most regulated buyers.
            - label: High
              tone: warning
              detail: Failed enterprise rollouts would hit growth, margins, and references.
            - label: Medium-high
              tone: warning
              detail: Channel or partner fragility could slow repeatable in-house expansion.
            - label: High
              tone: warning
              detail: Losing the in-house buyer narrows Legora's expansion path.
            - label: Medium-high
              tone: warning
              detail: Concentration or scale inefficiency would pressure valuation support.
        - label: Mitigation maturity
          values:
            - label: Medium
              tone: neutral
              detail: Human oversight and compliance badges help, but legal precedent is still forming.
            - label: Medium-low
              tone: warning
              detail: Public trust signals are helpful, but detailed architecture evidence remains private.
            - label: Medium
              tone: neutral
              detail: Legal Engineers and partner workflows mitigate complexity case by case.
            - label: Medium-low
              tone: warning
              detail: Published case studies do not yet prove partner independence from delivery success.
            - label: Medium-low
              tone: warning
              detail: Public evidence does not yet prove repeatable self-serve in-house automation.
            - label: Medium-low
              tone: warning
              detail: Public metrics show momentum, but not enough to underwrite concentration resilience.
    claimRefs:
      - CR003
      - CR008
      - CR010
      - CR011
      - CR012
      - CR015
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Strong adoption and product ambition support interest, but valuation velocity and disclosure gaps keep the current
      recommendation at track.
    data:
      nodes:
        - label: Adoption proof
          detail: March 2026 sources cite 800 customers and tens of thousands of daily lawyer users.
        - label: ARR momentum
          detail: Sacra estimates ARR surpassed $200 million by September 2026 after doubling in under six months.
        - label: Workflow expansion
          detail: aOS and workflow tooling increase the scope of what Legora can sell into legal teams.
        - label: Valuation rerating
          detail: Public marks moved from $1.8 billion in October 2025 to roughly $5.55-$5.6 billion by spring 2026.
        - label: Underwrite gaps
          detail: Pricing, retention, margin, burn, and liquidation terms remain largely undisclosed in public evidence.
        - label: Recommendation
          detail: Keep tracking and diligencing, but require private KPI proof or a better entry price before investing.
      edges:
        - from: Adoption proof
          to: ARR momentum
          label: Supports premium growth narrative
        - from: ARR momentum
          to: Workflow expansion
          label: Funds broader product scope
        - from: Workflow expansion
          to: Valuation rerating
          label: Expands what the market can underwrite
        - from: Valuation rerating
          to: Underwrite gaps
          label: Prices in upside faster than disclosure improves
        - from: Underwrite gaps
          to: Recommendation
          label: Keeps call at track, not invest
    approximationNotes: >-
      The sequence shows analytical dependence rather than a quantified model, so edge labels explain logic instead of
      implied conversion rates.
    claimRefs:
      - CV003
      - CV008
      - CV012
      - CV013
      - CV016
