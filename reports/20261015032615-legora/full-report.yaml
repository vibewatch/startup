        title: Architecture emphasizes orchestration, knowledge reuse, and systems-of-record connectivity
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to an operating model with six practical layers: user-facing interfaces, specialist
              modules, an agent/orchestration layer, firm knowledge inputs, external systems-of-record, and governance
              plus implementation services. Official launch language repeatedly stresses jurisdiction-aware research,
              document understanding, and institutional knowledge such as playbooks, precedent libraries, clause banks,
              client history, and negotiated positions. Independent coverage adds that the product's day-to-day gravity
              remains Microsoft Word plus document-heavy workflows, while Workflows and the aOS narrative try to connect
              those point features into longer legal processes. The architecture is therefore best understood as
              workflow infrastructure on top of third-party repositories and enterprise software, not a stand-alone
              developer platform or proprietary-model story.
