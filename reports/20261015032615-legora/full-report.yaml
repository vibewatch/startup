      - number: '5.3'
        title: Governance posture is a selling point, but rollout maturity remains connector-dependent
        blocks:
          - type: paragraph
            body: >-
              Legora's trust story is unusually central to the product narrative. Third-party summaries cite per-request
              permission checks, ethical-wall integrations, audit logging, and certifications or control claims around
              ISO 27001, ISO 42001, SOC 2 Type II, and no model training on customer data. Those are relevant signals
              for legal buyers, but the evidence in this pool is still mostly vendor-described or partner-described
              rather than an independent technical audit of the full connector estate. The rollout also appears uneven:
              as of October 2026, the company described more than 30 integrations across nine categories, yet external
              reporting explicitly says availability varies by integration and some flows are phased. Combined with the
              absence of a public API and limited public technical documentation, that leaves diligence concentrated on
              deployment specifics, security review depth, and proof that the target connector set is generally
              available in the buyer's environment.
