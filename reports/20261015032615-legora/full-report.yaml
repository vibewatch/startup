  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to Legora monetizing as an enterprise B2B software vendor rather than a self-serve
              legal tool. Sacra describes a subscription SaaS model sold to law firms and in-house legal departments,
              while the official May 2026 product launch stresses deep integrations, embedded legal engineers, and
              workflow configuration inside customer environments. Review sources consistently say pricing is not
              published and is negotiated based on scope, seat count, and deployment breadth. That combination supports
              a recurring software revenue thesis, but it also means list pricing, discount rates, contract minimums,
              and services mix are still opaque to outside investors.
