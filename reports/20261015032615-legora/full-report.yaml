      - number: '4.3'
        title: Cost structure and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              The operating model appears more capital intensive than pure self-serve SaaS. The official launch
              describes a global legal-engineering layer, and partner deployments show meaningful human workflow design
              and data-validation work around the core product. That can improve implementation success and expansion,
              but it may also delay gross-margin convergence if services and onboarding remain material. On funding,
              Sacra, SetterVC, and AI Engineer all support the April 2026 Series D extension to $600 million at roughly
              a $5.6 billion post-money valuation, and third-party trackers place cumulative funding above $850 million.
              Even so, there is still no public cash balance, burn, debt, or runway disclosure, so capital adequacy can
              only be assessed as "well-funded but not underwritable from public evidence."
            claimRefs:
              - CI004
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Legora looks like a premium enterprise legal-AI platform with real demand, enterprise deployment
              complexity, and enough outside capital to keep investing aggressively, but the evidence is stronger on
              top-line momentum than on revenue quality or margin durability. The main underwriting risks are hidden
              pricing realization, unknown services share, absent retention data, and no public visibility into burn or
              cash runway. Competitive evidence also suggests some buyers may favor automation models that remove
              contracts from lawyer queues rather than copilots that make lawyers faster, which matters for long-run
              pricing power. The diligence burden should therefore shift from proving demand to proving repeatable unit
              economics.
            claimRefs:
              - CI013
              - CI014
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Demand is public; realized economics are not
            body: >-
              Public sources support strong demand, large enterprise contracts, and rapid adoption, but the external
              record still does not reveal how much of growth comes from software subscriptions versus enablement-heavy
              delivery.
            calloutType: insight
            claimRefs:
              - CI005
              - CI006
              - CI010
              - CI013
          - type: callout
            title: The main underwriting gap is not capital raised but cash efficiency
            body: >-
              The 2026 financing history reduces near-term solvency fear, yet the lack of public gross-margin, burn,
              CAC, and runway data means investors still cannot test whether current growth compounds efficiently or
              simply consumes large amounts of capital.
            calloutType: risk
            claimRefs:
              - CI011
              - CI012
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface is broadening from a copilot into a multi-surface legal workspace
        blocks:
          - type: paragraph
            body: >-
              Legora's current product surface is no longer just a chat-style legal copilot. Independent product
              writeups and company launch materials now describe a stack that includes Tabular Review for high-volume
              document sets, a Research/Assistant surface for cited legal queries, a Microsoft Word add-in for in-editor
              drafting and markup, Workflow orchestration for multi-step automations, and a newer aOS/Agent layer that
              frames the product as an end-to-end legal operating system rather than a single prompt box. That matters
              because the customer job Legora is selling is not generic model access; it is reducing lawyer
              context-switching across research, diligence, drafting, review, and delivery inside familiar legal tools
              and knowledge stores.
            claimRefs:
