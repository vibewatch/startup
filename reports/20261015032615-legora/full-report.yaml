  - id: FM001
    title: Constrained market-sizing pyramid
    type: pyramid
    summary: >-
      Public evidence narrows from a broad organizational universe to Legora's realized footprint, but does not
      establish arithmetic TAM, SAM, or SOM.
    data:
      nodes:
        - label: Broad organizational universe
          value: More than 50,000 law firms + 40,000 corporate legal departments
          detail: Sacra's global population lens lacks product-fit and budget filters.
        - label: Target buyer profile
          value: Mid-to-large law firms and enterprise in-house legal teams
          detail: No public count isolates this serviceable subset.
        - label: Workflow-fit wedge
          value: Research, review, drafting, monitoring, and agentic execution
          detail: Included spend is lawyer-centric rather than the whole legal stack.
        - label: May 2026 reported footprint
          value: '>800 / 16 countries versus >1,000 / 50+ markets'
          detail: Contemporaneous sources use unreconciled counts and geographies.
        - label: September 2026 realized footprint
          value: 2,100 organizations; 130,000 monthly lawyers; 80+ countries
          detail: Installed base and monthly users have different denominators.
        - label: Realized economics proxy
          value: Approximately $95,000 blended ACV
          detail: A vendor ACV estimate is not a category market-size estimate.
    approximationNotes: >-
      Layers are conceptual and not value-proportional. They do not form an arithmetic funnel, and no conversion rate or
      category CAGR is inferred.
    claimRefs:
      - CM001
      - CM002
