  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and current product scope
        blocks:
          - type: paragraph
            body: >-
              Legora is currently best evidenced as a Series D legal-software company selling a collaborative,
              increasingly agentic AI workspace into law firms and in-house legal teams. Across its official site, March
              2026 fundraising announcement, and product materials, the company consistently describes the platform as
              covering research, review, drafting, and workflow execution rather than a single narrow point solution.
              The public identity story is clear on the 2025 rebrand from Leya to Legora and on the 2026 move toward an
              “agentic operating system,” but the assigned pool does not independently lock an exact founding date or a
              formal headquarters statement. That makes the business model and current stage reusable as chapter ground
              truth, while exact legal-entity history and HQ should remain flagged as diligence gaps rather than assumed
              facts.
