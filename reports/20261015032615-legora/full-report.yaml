              - CM008
              - CM015
      - number: '2.4'
        title: Drivers, constraints, and contradictory estimates
        blocks:
          - type: paragraph
            body: |-
              Demand is supported by pressure to compress research and review time,
              connect AI output to authoritative and firm-owned knowledge, and keep work
              inside tools lawyers already use. The constraints are equally material.
              Competitor-issued and independent directory sources report quote-only
              pricing, a roughly $3,000 per-user annual starting point, and a 10-seat
              minimum, but those figures are not vendor-published and require direct
              confirmation. Implementation can require document-system integration,
              permissioning, playbooks, legal engineering, governance, and human review;
              consumption-based Agent Pro pricing also makes usage controls and project
              attribution part of the buyer's budget case. Public scale disclosures are
              not fully comparable: two May 2026 sources reported more than 800
              organizations across 16 countries and more than 1,000 organizations across
              50-plus markets, respectively. The difference may reflect date, geography,
              or customer-definition choices, so neither should be normalized away.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Realized adoption is measurable; category size is not
            body: >-
              Legora's installed base and estimated ACV support a meaningful enterprise wedge, but the current pool
              cannot translate those data into a defensible TAM without unsupported eligibility and penetration
              assumptions.
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM013
          - type: callout
            title: Implementation and pricing narrow the near-term serviceable market
            body: >-
              Reported seat minimums, quote-based pricing, knowledge integration, governance, and variable usage
              controls favor sophisticated buyers and delay a broad self-serve adoption path.
