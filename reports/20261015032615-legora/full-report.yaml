      - number: '4.2'
        title: Public traction and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              The revenue signal is directionally strong but uneven in precision. AI Engineer reports that Legora
              exceeded $100 million in ARR in April 2026, and Sacra later estimated ARR above $200 million by September
              2026, while also estimating blended ACV near $95,000. Axiom's partner case studies add a practical ROI
              lens, including a contract-review engagement that compressed review time from one year to five weeks and
              saved $477,000 versus a non-AI-enabled team. Those datapoints support willingness to pay and expansion
              potential, but they are not substitutes for disclosed retention, payback, sales cycle, or gross-margin
              data.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
