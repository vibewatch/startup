      - number: '3.3'
        title: Pricing opacity and distribution shape the buyer's switching calculus
        blocks:
          - type: paragraph
            body: >-
              Commercially, Legora still behaves like a premium enterprise product. Competitor comparisons say it does
              not publish rates or seat minimums, which means a buyer cannot model total cost until after a sales
              process and written quote. That contrasts sharply with adjacent substitutes like Bind or consumer-grade
              general AI, where list pricing is visible immediately and procurement friction is lower. The same opacity
              can work in Legora's favor when it enables aggressive deal-by-deal discounting against Harvey, but it also
              weakens budget certainty and raises renewal risk because there is no public anchor for future pricing. For
              a challenger expanding into the US, those commercial dynamics are almost as important as feature parity.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP015
      - number: '3.4'
        title: Durability depends on execution speed more than category exclusivity
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence for Legora's moat is not an uncontested category boundary but execution speed
              around a narrow legal workflow stack. The official product surfaces and third-party descriptions show a
              platform adding workflow orchestration, deeper research infrastructure, and embedded delivery support
              quickly enough to compress more of the legal team's day into one system. But the surrounding market is
              crowded: Harvey is scaling aggressively in elite US firms, incumbents keep their distribution and trust
              advantages, and adjacent CLM or open-source tools can strip out parts of the workload without matching
              Legora feature-for-feature. That means Legora's edge is likely durable only if it keeps shipping faster
              than incumbents while preserving clear superiority in high-stakes legal review and research use cases.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP009
              - CP011
              - CP012
              - CP013
              - CP014
