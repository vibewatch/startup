        title: Legora's buyer fit is broadening, but the strongest wedge is still specialist legal work
        blocks:
          - type: paragraph
            body: >-
              Legora's own 2026 launches show a product that is no longer just a drafting or research assistant. The
              platform is being positioned as an operating system spanning intake, research, drafting, review, and
              client delivery, with deeper legal-data and citator infrastructure underneath. That supports a broader
              buyer set than early law-firm point tools, and Sacra's account of in-house legal teams contributing more
              than 40% of new business suggests the company is already expanding beyond private-practice roots. Even so,
              competitor-authored comparisons consistently frame Legora as best aligned to law-firm-shaped work, while
              CoCounsel remains strongest where Westlaw-backed US research is decisive and Bind wins when the actual job
              is contract workflow automation instead of specialist legal reasoning.
