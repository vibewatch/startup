              2026 company language cites 800 customers, tens of thousands of daily lawyer users, and 400 team members;
              Axiom's October 2026 release says more than 100,000 professionals across 1,200 organizations; Sacra
              reports 130,000 monthly lawyers across 2,100 firms and legal teams. These signals are directionally
              consistent on rapid growth, but they are not numerically interchangeable. The same 2026 evidence also
              shows Legora widening from collaborative AI tooling into end-to-end workflow orchestration, while outside
              commentary still warns that the product is optimized for lawyer-led work rather than true business-user
              self-service.
