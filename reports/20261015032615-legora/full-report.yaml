            body: >-
              Max Junestrand is the only repeatedly named operating leader in the assigned evidence set, appearing as
              CEO and co-founder across product launches, funding announcements, and partner-led customer proof. That
              consistency suggests a founder-led go-to-market and raises ordinary key-person dependency questions for
              later diligence, especially because the same source set does not surface a board roster, broader executive
              bench, ownership percentages, or formal governance rights. Public investor visibility is stronger than
