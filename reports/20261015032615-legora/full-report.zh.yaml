              月的官方产品发布则强调深度集成、嵌入式法律工程师和客户环境内的工作流配置。评测来源一致称定价未公开，会根据范围、席位数量和部署广度协商。这一组合支持经常性软件收入的判断，但标价、折扣率、合同最低金额和服务收入占比对外部投资者仍不透明。
