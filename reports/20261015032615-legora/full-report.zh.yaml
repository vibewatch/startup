              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV008
              - CV012
              - CV013
              - CV016
      - number: '8.4'
        title: 退出准备度存在，但最终尽调仍需私有证据
        blocks:
          - type: paragraph
            body: >-
              单凭公开证据，Legora 看起来比脆弱公司更接近可退出状态：它吸引了大型投资者联合体，扩大了产品范围，也似乎正在赢得有意义的美国采用。尚未解决的问题才真正决定后期入场能否从这里继续复利：已报告的 ARR
              规模能否转化为持久的净留存和高质量利润率，表面客户增长是集中在少数旗舰账户还是广泛分布，以及融资结构是否包含会限制普通股上行空间的清算或控制权条款。在尽调回答这些问题前，稳妥做法是保持参与，但不要买在当前私人估值的顶部之上。
            claimRefs:
              - CV002
              - CV004
              - CV009
              - CV010
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 当前判断：跟踪，而不是投资判断
            body: 公开证据显示真实规模和品类势头，但约 $5.55-$5.6 billion 的估值已经假设了大部分上行空间，而定价、留存、利润率、烧钱和优先权数据仍属私有。
            calloutType: recommendation
            claimRefs:
              - CV001
