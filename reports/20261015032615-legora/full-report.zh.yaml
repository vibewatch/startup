chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段与当前产品范围
        blocks:
          - type: paragraph
            body: >-
              目前最有力的证据表明，Legora 是一家 D 轮法律软件公司，向律所和企业法务团队销售协作式、且越来越智能体化的 AI 工作空间。公司官网、2026 年 3
              月融资公告和产品材料一贯将平台描述为覆盖研究、审阅、起草及工作流执行，而非单一的窄点解决方案。公开身份叙事对 2025 年从 Leya 更名为 Legora，以及 2026
              年转向“智能体操作系统”都很清楚，但指定证据池无法独立锁定确切成立日期或正式总部声明。因此，商业模式和当前阶段可以作为本章事实基准复用；确切的法律实体沿革和总部则应继续标为尽调缺口，而不是当成事实。
