      - number: '3.4'
        title: 持久性更多取决于执行速度，而非品类独占
        blocks:
          - type: paragraph
            body: >-
              Legora
              护城河最有力的证据，不是无人争议的品类边界，而是围绕狭窄法律工作流栈的执行速度。官方产品界面和第三方描述显示，平台迅速加入工作流编排、更深的研究基础设施和嵌入式交付支持，把法务团队更多日常工作压缩进一个系统。但周边市场拥挤：Harvey
              正在美国顶级律所激进扩张，现有厂商保有分销和信任优势，相邻 CLM 或开源工具也能拆走部分工作负载而无需在每项功能上匹配
              Legora。因此，只有在保持发货速度领先现有厂商、同时在高风险法律审阅和研究场景保持明显优势时，Legora 的领先才可能持久。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP009
              - CP011
              - CP012
              - CP013
              - CP014
