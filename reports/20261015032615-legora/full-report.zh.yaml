            body: >-
              随着 Legora 自动化更多法律工作流，竞争集合也会扩大：买方可将其与 Harvey 的高端法律 AI、CoCounsel 的可信研究比较，也可在痛点是合同吞吐而非律师生产力时，与 Bind 和
