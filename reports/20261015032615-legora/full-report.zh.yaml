            body: 2026 年融资历史降低了近期偿付能力担忧，但由于公开资料没有毛利率、烧钱、CAC 和现金跑道数据，投资者仍无法检验当前增长是在高效复利，还是只是在消耗大量资本。
            calloutType: risk
            claimRefs:
              - CI011
