          label: 试点或按事项部署
          note: 初始推广通常绑定团队、事项或工作流，而不是自助注册。
        - id: contract
          label: 协商订阅合同
          note: 公开证据指向企业报价和年度许可，而非公布的目录价。
        - id: rollout
          label: 集成与法律工程推广
          note: 实施包括工作流搭建，以及与 Word、电子邮件、研究和文档系统的集成。
        - id: outcomes
          label: 生产力与成本结果
          note: 案例研究强调更短的审阅周期、更低的支出，以及可用的结构化合同数据。
        - id: expansion
          label: 续约与扩张
          note: 积极结果支持扩大许可范围并深入企业法务，但公开留存数据不可得。
      edges:
        - from: need
          to: pilot
          label: 演示与明确范围的用例
        - from: pilot
          to: contract
          label: 付费企业协议
        - from: contract
          to: rollout
          label: 配置工作流与集成
        - from: rollout
          to: outcomes
          label: 采用带来可量化 ROI
        - from: outcomes
          to: expansion
          label: 参考价值支持更广泛部署
    approximationNotes: 本流程只描述公开的商业逻辑；没有推断转化率、利润率百分比或已实现合同金额。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI010
      - CI015
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据指向一个六层运营栈，从面向律师的界面一直延伸到连接器治理和服务。
    data:
      layers:
        - label: 用户界面
          detail: 律师通过网页、Word、Outlook 和移动端操作。
          modules:
            - label: 界面
              detail: 网页工作区、Microsoft Word 插件、Outlook 插件、移动端
        - label: 专业任务模块
          detail: 产品化的法律任务位于控制平面之上。
          modules:
            - label: 模块
              detail: Tabular Review、Assistant / Research、Monitors、Portal
        - label: 编排层
          detail: aOS、Agent 和 Workflows 协调多步骤法律执行。
          outputs:
            - 起草
            - 审阅
            - 研究
            - 交付
        - label: 知识层
          detail: 律所专属背景信息影响输出和审阅标准。
          modules:
            - label: 知识资产
              detail: 操作手册、先例库、条款库、客户历史、协商立场
        - label: 外部记录系统
          detail: 连接器从企业法律系统提取数据，并写回其中。
          modules:
            - label: 系统
              detail: SharePoint、iManage、NetDocuments、法律数据库、电子邮件、事项系统
        - label: 治理与推广
          detail: 权限、隔离墙、审计日志和 Legal Engineers 共同塑造安全部署。
          modules:
            - label: 控制措施
              detail: 按请求设置权限、Intapp / iManage 政策控制、审计日志
    claimRefs:
      - CE002
      - CE006
      - CE009
      - CE010
      - CE014
  - id: FU001
    title: 从试点到推广的客户旅程
    type: journey-map
    summary: 公开证据指向一种咨询式的落地扩张路径：从律师工作流起步，靠嵌入式赋能扩张，而非纯自助采用。
    data:
      items:
        - label: 高风险法律工作流触发评估
          actor: 买家：律所合伙人、总法律顾问或法律运营负责人
          phase: 发现
          touchpoints:
            - 尽调、起草、审阅和法律研究，是来源描述最一致的起步任务。
          tone: neutral
        - label: 在法律用户现有工具中进行团队级试点
          actor: 用户：律师和法务团队
          phase: 试点
          touchpoints:
            - Word 插件、共享工作区和有来源支撑的研究，让团队能在不取代法律监督的情况下试做真实事项。
          tone: neutral
        - label: Legal Engineers 配置工作流与知识
          actor: 实施团队 + 客户法务团队
          phase: 赋能
          touchpoints:
            - 官方和投资者来源描述了嵌入客户团队的 Legal Engineers，他们会按执业领域定制工作流、操作手册和知识。
          tone: positive
        - label: 日常生产使用扩展到多个事项
          actor: 负责审阅、起草和研究的律师
          phase: 激活
          touchpoints:
            - Tooliverse 和官方来源将采用与持续进行的合同录入、尽调和研究工作流联系起来。
          tone: positive
        - label: 扩张跨越执业领域或企业法务团队
          actor: 律所或企业法务领导层
          phase: 扩张
          touchpoints:
            - Bessemer 和 Sacra 描述了落地扩张动力，包括企业法务占比扩大和账户渗透率提升。
          tone: positive
        - label: 全面推广仍需买家核查适配度与经济性
          actor: CFO、总法律顾问、采购
          phase: 投资评估
          touchpoints:
            - 公开定价仍不透明，面向非律师的自助自动化也不是公开资料中最强的适配信号。
          tone: warning
    approximationNotes: 根据有日期的公开推广描述综合而成；这一顺序反映保留来源中的重复模式，不是供应商披露的、带转化率的漏斗。
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU010
      - CU011
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 公开证据显示，监管、部署复杂度、工作流适配执行和对集中度敏感的扩张，都可能带来高影响。
    data:
      columns:
        - label: 监管／法律
          detail: 代理式法律工作受到人工监督和专业责任约束。
        - label: 安全／数据处理
          detail: 需尽调架构披露、数据驻留、留存和事件响应。
        - label: 运营／交付
          detail: 推广高度依赖集成，实施也需要服务支持。
        - label: 合作伙伴／渠道
          detail: 依赖实施伙伴和渠道主导的证明案例。
        - label: GTM／工作流适配
          detail: 律所生产力与企业法务自动化需求之间的适配度。
        - label: 财务／集中度
          detail: 快速扩张、溢价预期和不透明的集中度指标。
      rows:
        - label: 可能性
          values:
            - label: 中高
              tone: warning
              detail: 第三方风险评论已经明确提出审查压力。
            - label: 中
              tone: warning
              detail: 公开资料存在控制措施声明，但私下尽调仍很关键。
            - label: 中高
              tone: warning
              detail: 产品广度和集成深度提高了执行负担。
            - label: 中
              tone: neutral
              detail: 伙伴主导的赢单有帮助，但也显示其依赖外部交付能力。
            - label: 高
              tone: warning
              detail: 竞品比较反复攻击同一个工作流适配缺口。
            - label: 中
              tone: neutral
              detail: 存在下行空间，但公开现金消耗和队列数据仍未披露。
        - label: 影响
          values:
            - label: 高
              tone: warning
              detail: 监管限制可能直接压低自主工作流的采用率。
            - label: 高
              tone: warning
              detail: 安全审查失败会阻断向监管最严格买家的扩张。
            - label: 高
              tone: warning
              detail: 企业推广失败会打击增长、利润率和客户背书。
            - label: 中高
              tone: warning
              detail: 渠道或伙伴脆弱会拖慢可重复的企业法务扩张。
            - label: 高
              tone: warning
              detail: 失去企业法务买家会收窄 Legora 的扩张路径。
            - label: 中高
              tone: warning
              detail: 集中度或规模效率问题会给估值支撑带来压力。
        - label: 缓解成熟度
          values:
            - label: 中
              tone: neutral
              detail: 人工监督和合规认证有帮助，但法律先例仍在形成。
            - label: 中低
              tone: warning
              detail: 公开信任信号有帮助，但详细架构证据仍属私有。
            - label: 中
              tone: neutral
              detail: Legal Engineers 和伙伴工作流逐案缓解复杂度。
            - label: 中低
              tone: warning
              detail: 已发布案例研究尚未证明伙伴的交付成功不依赖外部支持。
            - label: 中低
              tone: warning
              detail: 公开证据尚未证明企业法务自助自动化可重复实现。
            - label: 中低
              tone: warning
              detail: 公开指标显示势头，但不足以评估集中度韧性。
    claimRefs:
      - CR003
      - CR008
      - CR010
      - CR011
      - CR012
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 强劲采用和产品抱负支持继续关注，但估值上涨速度和披露缺口使当前建议仍停留在跟踪。
    data:
      nodes:
        - label: 采用证明
          detail: 2026 年 3 月来源提到 800 个客户和数万名每日使用的律师。
        - label: ARR 势头
          detail: Sacra 估算，截至 2026 年 9 月，ARR 在不到六个月内翻倍并超过 $200 million。
        - label: 工作流扩张
          detail: aOS 和工作流工具扩大了 Legora 可以向法务团队销售的范围。
        - label: 估值重估
          detail: 公开估值从 2025 年 10 月的 $1.8 billion，升至 2026 年春季约 $5.55-$5.6 billion。
        - label: 投资评估缺口
          detail: 公开证据对定价、留存、利润率、现金消耗和清算条款大多没有披露。
        - label: 建议
          detail: 继续跟踪和尽调，但投资前必须拿到私有 KPI 证明，或等到更好的入场价格。
      edges:
        - from: Adoption proof
          to: ARR momentum
          label: 支撑溢价增长叙事
        - from: ARR momentum
          to: Workflow expansion
          label: 为更广产品范围提供资金
        - from: Workflow expansion
          to: Valuation rerating
          label: 扩大市场可评估的范围
        - from: Valuation rerating
          to: Underwrite gaps
          label: 上行空间计价速度快于披露改善
        - from: Underwrite gaps
          to: Recommendation
          label: 维持跟踪而非投资的判断
    approximationNotes: 这一顺序体现的是分析上的依赖关系，而不是量化模型；因此边标签解释逻辑，不代表隐含转化率。
    claimRefs:
      - CV003
      - CV008
      - CV012
      - CV013
      - CV016
