      - number: '2.4'
        title: 驱动因素、约束与相互矛盾的估算
        blocks:
          - type: paragraph
            body: |-
              需求来自压缩研究和审阅时间的压力、将 AI 输出连接到权威且由律所拥有的知识，
              以及让工作留在律师已经使用的工具中。约束同样明显。竞争对手发布的资料和独立目录
              来源称其采用询价制，起始价格约为每位用户每年 $3,000，最低购买 10 个席位，
              但这些数字并非供应商发布，仍需直接确认。实施可能需要文档系统集成、权限配置、
              作战手册、法律工程、治理和人工审阅；按用量计费的 Agent Pro 定价也让用量控制和项目
              归因成为买方预算论证的一部分。公开规模披露并不完全可比：两个 2026 年 5 月来源分别
              报告覆盖 16 个国家的逾 800 家组织，以及覆盖 50 多个市场的逾 1,000 家组织。
              差异可能来自日期、地域或客户定义，因此不能简单抹平。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM015
              - CM016
