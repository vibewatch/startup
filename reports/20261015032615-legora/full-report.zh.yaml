        blocks:
          - type: paragraph
            body: >-
              公开融资记录显示重估速度极快。Legora 2026 年 3 月宣布 D 轮融资 $550 million，估值 $5.55 billion；Sacra 后来描述 4 月扩展后融资额达到 $600
              million，投后估值 $5.6 billion。这一步很重要，因为 ILTA 的融资历史还指向 2025 年 10 月 $1.8 billion 的估值，意味着公司约在半年内把名义价值提高了三倍。如果 ARR
              和采用速度确如部分第三方描述，这一价格跃升可以理解；但投资判断问题在于，公开记录仍依赖估算和公司提供的里程碑，而非经审计的经济数据或已披露的交易条款。
