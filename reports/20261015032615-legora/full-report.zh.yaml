      - number: '4.3'
        title: 成本结构与资本充足性
        blocks:
          - type: paragraph
            body: >-
              与纯自助 SaaS
              相比，运营模式似乎更耗资本。官方发布描述了全球法律工程层，合作伙伴部署也显示核心产品周围存在大量人工工作流设计和数据验证。这能提高实施成功率和扩张，但若服务和上线导入仍占重要比重，也可能推迟毛利率收敛。融资方面，Sacra、SetterVC
              和 AI Engineer 都支持 2026 年 4 月 D 轮扩展至 $600 million、投后估值约 $5.6 billion；第三方追踪机构则将累计融资置于 $850
              million               以上。尽管如此，仍没有公开的现金余额、烧钱、债务或现金跑道披露，因此资本充足性只能评价为“资金充足，但无法依据公开证据形成投资判断”。
            claimRefs:
              - CI004
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: 财务结论与尽调障碍
        blocks:
          - type: paragraph
            body: >-
              Legora 看起来是一家拥有真实需求、企业部署复杂度和充足外部资本、能够继续激进投入的高端企业法律 AI              
              平台，但证据对营收增长势头的支持强于对收入质量或利润率持久性的支持。主要投资判断风险是实际定价实现情况不明、服务收入占比未知、缺少留存数据，以及烧钱或现金跑道没有公开可见性。竞争证据还表明，一些买方可能偏好把合同移出律师队列的自动化模式，而不是让律师更快的法律助手，这会影响长期定价权。因此，尽调重点应从证明需求转向证明可重复的单位经济性。
            claimRefs:
              - CI013
              - CI014
              - CI015
      - number: '4.5'
        title: 展示项
        blocks:
          - type: callout
            title: 需求公开可见，实现的经济性却不可见
            body: 公开来源支持强劲需求、大型企业合同和快速采用，但外部记录仍未揭示增长中有多少来自软件订阅，又有多少来自实施赋能较重的交付。
            calloutType: insight
