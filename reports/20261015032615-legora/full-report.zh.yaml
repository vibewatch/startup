  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争横跨直接法律助手、现有厂商和相邻工作流替代方案
        blocks:
          - type: paragraph
            body: >-
              保留的证据表明，买方不会把 Legora 放在单一竞品集合中评估。直接竞争来自企业法律 AI 领域的 Harvey，以及 CoCounsel
              等现有厂商的研究堆栈；此时决定因素是内容可信度和工作流适配，而非模型新颖度。第二条赛道是相邻合同基础设施：当买方要解决的是审批、模板、电子签名或续约，而非律师生产力时，Bind 和 Ironclad
              更占优势。第三条赛道是维持现状或低成本替代，包括通用 AI 和 Eigent 等以开源为卖点的产品。竞争范围之广很重要，因为它扩大了法务团队延后采购、多平台共用或分拆预算的理由，而不是统一采用一个高价法律助手。
