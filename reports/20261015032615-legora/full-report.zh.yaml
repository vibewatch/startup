        blocks:
          - type: paragraph
            body: >-
              Max Junestrand 是指定证据集中唯一被反复点名的运营负责人，在产品发布、融资公告及合作伙伴主导的客户案例中均以 CEO
              兼联合创始人身份出现。这种一致性说明公司可能由创始人主导市场进入，也带来后续尽调中的普通关键人物依赖问题；尤其是同一批来源没有披露董事会名单、更广泛的管理层梯队、持股比例或正式治理权利。公开投资者信息比治理信息更充分：Accel
