      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: |-
              独立目录资料显示，中大型律所的创新和知识管理负责人接近采购中心，
              而产品和公司材料确认律师是日常用户。各细分市场的付费方和最终预算
              负责人尚未公开披露；尽调不能悄悄用用户替代经济买方。
              最可信的采用路径是从表格化尽调、基于先例的起草、跨法域研究或
              监管监测等边界清晰的工作流开始，再通过 Word、Outlook 和文档管理
              集成扩展。企业法务是正在增长的第二个细分市场：Sacra 将 Legora
              2026 年第三季度截至目前逾 40% 的新业务归因于企业法务团队。
              这会扩大可服务市场，但也提高了证明细分市场实施成本和投入回报的要求。
