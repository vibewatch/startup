        blocks:
          - type: paragraph
            body: >-
              收入信号方向强劲，但精度参差。AI Engineer 报道 Legora 在 2026 年 4 月 ARR 超过 $100 million；Sacra 后来估算截至 2026 年 9 月 ARR 超过 $200
              million，混合 ACV 接近 $95,000。Axiom 的合作伙伴案例补充了实际 ROI 视角，其中一项合同审阅项目将审阅时间从一年压缩到五周，相比未启用 AI 的团队节省
              $477,000。这些数据支持付费意愿和扩张潜力，但不能替代已披露的留存率、回本期、销售周期或毛利数据。
