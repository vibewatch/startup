        title: 风险排序图景
        blocks:
          - type: paragraph
            body: >-
              Legora 最有力的公开证明是产品如今希望运行端到端法律工作流，而不只是孤立的起草或研究任务；但同一雄心也制造了本章排名最高的风险。监管敞口真实存在，因为 Legora
              自己的发布语言和第三方评论仍坚持由律师掌控，而 Sacra 明确警告，法律 AI
              正因准确性、偏见、职业责任和人工监督规则受到审视。运营上，产品似乎重集成、靠服务支持，而非即插即用；如果扩张速度超过实施能力，就可能拖慢企业上线并挤压利润率。商业上，证据显示 Legora
              正从律所生产力延伸到企业法务自动化，而竞争对手将无需有人指导每一步的自助式工作流自动化、投资组合可见性和数据处理架构塑造成真正的采购标准。投资案例的否决标准很直接：监管对自主法律工作流施加重大限制、大规模客户上线失败，或企业法务扩张因产品仍过于依赖律师指挥而停滞。
