  - id: TV003
    title: 乐观／基准／悲观情景表
    columns:
      - 情景
      - 假设
      - 估值／回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - Sacra 的 ARR 估算方向正确或偏保守，工作流扩张推高 ACV，且美国业务占比持续改善。
        - 如果 Legora 增长足够快，能够兑现溢价倍数并支撑强劲的战略退出或 IPO 路径，当前价格仍可能成立。
        - 法律 AI 估值倍数收缩，或尽管表面使用量增长，留存仍然疲弱。
        - 只有私下尽调验证留存、利润质量和席位广泛扩张后，这一情景才可信。
      - - 基准
        - ARR 增长很快，但公开证据夸大了可比性，定价能力仍有一部分未经验证。
        - 公司足以支持继续跟踪，但当前估值已经反映了公开证据所显示的大部分经营上行空间。
        - 对按当前估值入场的新投资者而言，入场价格风险大于执行风险。
        - 最符合当前公开资料。
      - - 悲观
        - 客户和使用指标的变现能力低于表面表现，公开市场倍数压力传导至后期私募估值。
        - 估值涨得快于清晰评估所需的披露质量，因此持平轮或下轮融资都可能发生。
        - 隐性优先权负担、扩张放缓、利润率疲弱或竞争拥挤。
        - 若队列经济性疲弱、客户赢单集中或条款清单细节不利，就会触发。
    notes: 这些是分析情景，不是按概率加权的估值输出；公开记录披露不足，无法支持精确 DCF 或收入倍数桥接。
    claimRefs:
