      - number: '1.3'
        title: 融资轨迹、运营规模与里程碑
        blocks:
          - type: paragraph
            body: >-
              公开材料最清晰的主线是加速增长：ILTA 的供应商档案汇总了 2024 年至 2025 年 10 月公开披露的六轮融资，Legora 自己的 2026 年 3 月公告以及后来的 Sacra 和 TVPI
              报道则显示，公司在 2026 年快速进入后期融资阶段并获得更广泛的市场关注。运营规模也在迅速上升，但读者应保留每个来源原有的口径和时间点。公司 2026 年 3 月官方表述为 800 家客户、数万名日活律师和
              400 名团队成员；Axiom 2026 年 10 月公告称覆盖 1,200 家组织中的逾 100,000 名专业人士；Sacra 报告每月有 130,000 名律师，覆盖 2,100
              家律所和法务团队。这些信号都指向快速增长，但数字不能互换。同一批 2026 年证据还显示，Legora 正从协作式 AI
              工具扩展到端到端工作流编排，而外部评论仍提醒，其产品更适合由律师主导的工作，而不是真正面向业务用户的自助服务。
