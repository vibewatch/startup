            title: 已实现的采用可衡量，品类规模却无法衡量
            body: Legora 的存量客户和估算 ACV 支撑一个有意义的企业切入口，但当前证据池无法在缺少未经支持的资格筛选和渗透率假设的情况下，将这些数据转化为可辩护的 TAM。
            calloutType: insight
