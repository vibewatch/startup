            body: >-
              商业问题在于，Legora 能否在律所和企业法务团队之间把品类势头转化为持久、高效的扩张，同时不撞上集中度或经营杠杆问题。Sacra
              报告了广泛规模、快速增长和大规模招聘计划，但也明确将客户集中度列为下行风险。与此同时，竞品比较认为产品仍针对律师参与式工作进行优化，而企业法务买方越来越希望工作流无需有人逐步指挥即可运行。第三方 KPI
