      - number: '8.2'
        title: 核心论点真实存在，但反论点主要关乎价格和证据深度
        blocks:
          - type: paragraph
            body: >-
              看多理由有实质支撑。              Legora 2026 年 3 月公告称，公司一年内员工从 40 人增至 400 人，800 家客户覆盖 50 多个市场，每天有数万名律师使用；Sacra 估算截至
              2026 年 9 月 ARR 超过 $200 million，美国成为最大收入市场。产品雄心也在 2026 年 5 月 aOS
              发布时从起草助手跨向更广泛的工作流操作系统叙事。反论点不是没有势头，而是公开档案仍无法让投资者检验这种势头有多持久。定价未披露，客户数分母在来源之间漂移，而最怀疑的独立观点称，出色的估值不等于成熟的生产履历。
            claimRefs:
              - CV003
              - CV004
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV008
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: 当前判断应对价格敏感，而不是对公司质量敏感
        blocks:
          - type: paragraph
            body: >-
              正确的视角不是 Legora 是否令人印象深刻，而是当前入场价在考虑执行、竞争和倍数压缩风险后是否仍留下足够上行空间。Forbes 明确将法律 AI
              融资描述为进入过去只属于规模大得多的软件企业的估值区间，并将私人市场热情与法律软件母公司的较弱公开市场交易表现对比。这是一个清晰警告：今天的私人估值已经计入了乐观情景的大部分。没有公开 NRR、毛利率、CAC
              效率、烧钱或股权结构表条款，估值工作只能回到入场纪律：继续跟踪公司，但在将兴趣转化为投资建议前，要求私有 KPI 确认或更好的价格。
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV010
              - CV011
              - CV014
              - CV016
