      - number: '3.3'
        title: 定价不透明度与分销方式决定买方的切换计算
        blocks:
          - type: paragraph
            body: >-
              从商业表现看，Legora 仍像一款高端企业产品。竞品比较称其不公布价格或席位最低数，因此买方要等销售流程结束并拿到书面报价后才能测算总成本。这与 Bind 或消费级通用 AI
              等相邻替代品形成鲜明对比，后者的标价立即可见，采购摩擦也更低。当这种不透明度让 Legora 能在与 Harvey
              的现场交易中逐单激进折扣时，它可能成为优势；但未来价格没有公开锚点，也会削弱预算确定性并提高续约风险。对于正进入美国市场的挑战者，这些商业动态几乎与功能对等同等重要。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP015
              - CP016
