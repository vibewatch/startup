  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: |-
              Legora 所处的相关市场是企业法律 AI 工作空间：
              律师和法务团队在既有文档、邮件、研究及案件系统中，
              用软件完成研究、审阅、起草和多步骤法律工作。
              这一边界包含替代或增强助理律师手工工作、法律研究跳转、
              大型文档审阅及零散法律点工具的支出。
              它不包括更宽泛的法律服务经济、通用生产力 AI、事务管理软件，
              以及主要任务是让日常协议避开律师的业务用户合同自动化。
              这个区分很重要：即使都使用 AI，以律师为中心的工作空间
              和以销售或采购为中心的合同平台，也有不同的用户、采用路径
              和预算逻辑。因此，Legora 争夺的是有价值的工作流基础设施切入口，
              而不是所有标注为法律科技的支出。
            claimRefs:
              - CM001
              - CM002
              - CM014
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM014
              - CM016
      - number: '2.2'
        title: 受证据约束的市场规模估算
        blocks:
          - type: paragraph
            body: |-
              指定证据池没有独立的品类收入估算，也没有明确的地域、
              纳入支出、方法和预测期，因此套用传统 TAM/SAM/SOM 会制造
              虚假的精确度。Sacra 反而给出了全球逾 50,000 家律所和
              40,000 个企业法务部门这一宽泛组织总量，但由于缺少企业规模、
              预算、安全和工作流适配度筛选，它不能作为可服务市场数量。
              已实现的采用更具体：截至 2026 年 9 月，Sacra 报告覆盖
              2,100 家律所和法务团队、每月 130,000 名律师及逾 80 个国家，
              并估算混合 ACV 约为 $95,000。这些指标显示商业深度，
              但如果假设每个组织都符合条件、合同金额相同且都会采用企业平台，
              就不能将其直接乘成 TAM。
            claimRefs:
              - CM005
