      - - 估值跃升
        - 公司估值从 2025 年 10 月的 $1.8 billion，升至 2026 年 3—4 月约 $5.55-$5.6 billion。
        - 更多经验证的 ARR、利润率和留存证据，才能更好地支撑重估。
      - - 竞争强度
        - 独立比较和竞品比较都将 Legora 放在拥挤的法律 AI 赛道中，且与 Harvey 存在明显重叠。
