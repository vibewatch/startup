    rows:
      - ["Current stage", "Series D; later extension reported after the original March 2026 round", "2026", "High", "No public cap table, liquidation preferences, or board-rights detail in the assigned pool"]
      - ["Product / business model", "Collaborative legal AI workspace expanding into agentic workflow execution for law firms and in-house teams", "2026", "High", "Product scope is clearer than pricing or monetization mechanics"]
      - ["ARR / revenue", "Sacra estimated ARR above $200M in Sep. 2026; public GAAP revenue is not disclosed here", "2026-09 to 2026-10", "Medium", "Need audited revenue, gross margin, burn, and cash balances"]
      - ["Customer scale", "800 customers (Mar. 2026 official), 1,200+ organizations (Oct. 2026 Axiom), 2,100 firms/legal teams (Sep. 2026 Sacra)", "2026", "Medium", "Denominators and dates differ, so the figures are directional rather than directly comparable"]
      - ["Headcount", "400 team members in Mar. 2026; Sacra later estimated 650 employees in Jun. 2026", "2026", "Medium", "No company-verified current headcount in the assigned pool"]
      - ["Footprint", "Teams/offices named across Stockholm, London, New York, Denver, Sydney, and Bengaluru; Houston and Chicago expansion announced for 2026", "2025-2026", "Medium", "Formal headquarters is not explicitly stated in the assigned pool"]
    notes: "Mixes company, partner, and independent sources; preserves each metric's original timing and denominator instead of normalizing them into one current snapshot."
    claimRefs: [CO001, CO003, CO004, CO006, CO007, CO008, CO009, CO010, CO011, CO014]
