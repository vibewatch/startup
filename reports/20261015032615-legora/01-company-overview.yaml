company:
  name: "Legora"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Legora is a fast-scaling legal AI vendor whose public evidence now centers on a March 2026 Series D, accelerating enterprise adoption, and a product shift toward agentic legal workflows. The assigned pool supports strong evidence on fundraising, product scope, and customer momentum, but it is notably thinner on audited operating metrics, board composition, and exact corporate identity details such as headquarters and founding date."
sections:
  - id: "identity-stage-and-product"
    title: "Identity, stage, and current product scope"
    body: |-
      Legora is currently best evidenced as a Series D legal-software company selling a collaborative, increasingly agentic AI workspace into law firms and in-house legal teams. Across its official site, March 2026 fundraising announcement, and product materials, the company consistently describes the platform as covering research, review, drafting, and workflow execution rather than a single narrow point solution. The public identity story is clear on the 2025 rebrand from Leya to Legora and on the 2026 move toward an “agentic operating system,” but the assigned pool does not independently lock an exact founding date or a formal headquarters statement. That makes the business model and current stage reusable as chapter ground truth, while exact legal-entity history and HQ should remain flagged as diligence gaps rather than assumed facts.
    claimRefs: [CO001, CO002, CO003, CO004, CO011, CO013]
    tableRefs: [TO001]
  - id: "leadership-stakeholders-and-governance"
    title: "Leadership, stakeholders, and governance visibility"
    body: |-
      Max Junestrand is the only repeatedly named operating leader in the assigned evidence set, appearing as CEO and co-founder across product launches, funding announcements, and partner-led customer proof. That consistency suggests a founder-led go-to-market and raises ordinary key-person dependency questions for later diligence, especially because the same source set does not surface a board roster, broader executive bench, ownership percentages, or formal governance rights. Public investor visibility is stronger than governance visibility: Accel is identified as lead investor in the March 2026 Series D, while Benchmark, Bessemer Venture Partners, General Catalyst, ICONIQ, Redpoint Ventures, and Y Combinator recur across later-round evidence. The result is enough public information to map likely economic stakeholders, but not enough to underwrite board control, secondary exposure, or succession depth.
    claimRefs: [CO003, CO005, CO013]
    tableRefs: [TO002, TO003]
  - id: "funding-scale-and-milestones"
    title: "Funding trajectory, operating scale, and milestones"
    body: |-
      The strongest public through-line is acceleration: ILTA's vendor profile aggregates six disclosed rounds from 2024 through October 2025, and Legora's own March 2026 release plus later Sacra and TVPI reporting show a steep jump to late-stage financing and broader market visibility in 2026. Operating scale also rises quickly, but readers should preserve each source's original denominator and timing. Official March 2026 company language cites 800 customers, tens of thousands of daily lawyer users, and 400 team members; Axiom's October 2026 release says more than 100,000 professionals across 1,200 organizations; Sacra reports 130,000 monthly lawyers across 2,100 firms and legal teams. These signals are directionally consistent on rapid growth, but they are not numerically interchangeable. The same 2026 evidence also shows Legora widening from collaborative AI tooling into end-to-end workflow orchestration, while outside commentary still warns that the product is optimized for lawyer-led work rather than true business-user self-service.
    claimRefs: [CO004, CO005, CO006, CO007, CO008, CO009, CO010, CO011, CO012, CO014, CO015, CO016]
    tableRefs: []
    figureRefs: [FO001]
tables:
