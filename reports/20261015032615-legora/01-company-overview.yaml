    notes: "The planned table is intentionally partial because the assigned pool repeatedly names only one operating leader; it should be read as a visibility map, not a complete org chart."
    enumerationScope:
      coverage: partial
      basis: "Assigned public sources from 2026 repeatedly identify Max Junestrand but do not enumerate the broader founder, executive, or board roster."
