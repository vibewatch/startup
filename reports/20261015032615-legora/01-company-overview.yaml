      - ["Accel", "Lead Series D investor", "Led the $550M March 2026 round, implying meaningful influence in the latest financing", "Confirm board seat, pro-rata rights, and governance protections"]
      - ["Benchmark", "Early and repeat investor", "Appears in the March 2026 investor list and earlier funding history", "Confirm ownership percentage and reserve capacity"]
      - ["Bessemer Venture Partners", "Repeat investor and performance narrator", "Named in the March 2026 round and later associated with public ARR commentary cited by TVPI", "Separate investor marketing from board-level information rights"]
      - ["ICONIQ / General Catalyst / Y Combinator", "Repeat backers across multiple rounds", "Persist from earlier rounds into later financing evidence, suggesting durable cap-table presence", "Request full cap table, secondary history, and any special terms"]
    notes: "This is a partial public stakeholder map built from named investors and executives in assigned sources; it is not a substitute for a cap table, board pack, or shareholder agreement."
