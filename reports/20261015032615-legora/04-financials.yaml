schemaVersion: report-v2
artifact: financials
slug: legora
runDate: 2026-10-15
company:
  name: Legora
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a fast-scaling enterprise subscription business with
    negotiated pricing, strong adoption signals, and a sizable 2026 capital base,
    but the underwriting picture is still incomplete because realized pricing,
    gross margin, CAC, burn, and cash balance remain undisclosed. The best public
    revenue datapoints are third-party estimates and company-reported milestones
    rather than audited financial statements, so conviction is materially lower on
    revenue quality and runway than on demand.
sections:
  - id: revenue-model-pricing
    title: Revenue model and pricing
    body: >-
      Public evidence points to Legora monetizing as an enterprise B2B software
      vendor rather than a self-serve legal tool. Sacra describes a subscription
      SaaS model sold to law firms and in-house legal departments, while the
      official May 2026 product launch stresses deep integrations, embedded legal
      engineers, and workflow configuration inside customer environments. Review
      sources consistently say pricing is not published and is negotiated based on
      scope, seat count, and deployment breadth. That combination supports a
      recurring software revenue thesis, but it also means list pricing, discount
      rates, contract minimums, and services mix are still opaque to outside
      investors.
    claimRefs: [CI001, CI002, CI003, CI004, CI015]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-efficiency
    title: Public traction and sales-efficiency proxies
    body: >-
      The revenue signal is directionally strong but uneven in precision. AI
      Engineer reports that Legora exceeded $100 million in ARR in April 2026,
      and Sacra later estimated ARR above $200 million by September 2026, while
      also estimating blended ACV near $95,000. Axiom's partner case studies add
      a practical ROI lens, including a contract-review engagement that compressed
      review time from one year to five weeks and saved $477,000 versus a
      non-AI-enabled team. Those datapoints support willingness to pay and
      expansion potential, but they are not substitutes for disclosed retention,
      payback, sales cycle, or gross-margin data.
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI010]
    tableRefs: [TI003]
  - id: cost-structure-capital
    title: Cost structure and capital adequacy
    body: >-
      The operating model appears more capital intensive than pure self-serve
      SaaS. The official launch describes a global legal-engineering layer, and
      partner deployments show meaningful human workflow design and data-validation
      work around the core product. That can improve implementation success and
      expansion, but it may also delay gross-margin convergence if services and
      onboarding remain material. On funding, Sacra, SetterVC, and AI Engineer all
      support the April 2026 Series D extension to $600 million at roughly a $5.6
      billion post-money valuation, and third-party trackers place cumulative
      funding above $850 million. Even so, there is still no public cash balance,
      burn, debt, or runway disclosure, so capital adequacy can only be assessed
      as "well-funded but not underwritable from public evidence."
    claimRefs: [CI004, CI011, CI012, CI013]
  - id: verdict-blockers
    title: Financial verdict and diligence blockers
    body: >-
      Legora looks like a premium enterprise legal-AI platform with real demand,
      enterprise deployment complexity, and enough outside capital to keep
      investing aggressively, but the evidence is stronger on top-line momentum
      than on revenue quality or margin durability. The main underwriting risks are
      hidden pricing realization, unknown services share, absent retention data,
      and no public visibility into burn or cash runway. Competitive evidence also
      suggests some buyers may favor automation models that remove contracts from
      lawyer queues rather than copilots that make lawyers faster, which matters
      for long-run pricing power. The diligence burden should therefore shift from
      proving demand to proving repeatable unit economics.
    claimRefs: [CI013, CI014, CI015]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value / status
      - Revenue quality
      - Diligence ask
    rows:
      - - Core platform subscription
        - Enterprise software subscription for legal research, review, drafting, and workflow orchestration
        - Firm or team license
        - Public sources support this as the core stream; realized pricing is undisclosed
        - Likely recurring if embedded, but renewals and retention are not public
        - Segment revenue by module, logo retention, and NRR/GRR
      - - Expansion modules and wider rollout
        - Land-and-expand from pilot matters into broader firm-wide or in-house deployments
        - Expanded seats or license scope
        - Sacra describes pilot-to-firm-wide expansion; attach rates are undisclosed
        - Can improve ACV, but expansion economics are not quantified publicly
        - Cohort expansion curves by customer segment and practice area
      - - Implementation and legal-engineering support
        - Workflow setup, customer enablement, integration, and matter-specific deployment support
        - Services or bundled enablement
        - Official materials describe embedded legal engineers, but no pricing split is public
        - Improves activation but may dilute gross margin if services are material
        - Services share of revenue, implementation hours, and gross margin by stream
      - - Partner-enabled delivery
        - Axiom-led AI-enabled legal service engagements that use Legora in delivery
        - Blended services plus software
        - Demonstrated commercially, but Legora's direct revenue share is undisclosed
        - Good proof of demand, weaker proof of standalone software economics
        - Partner resale terms, attach rate, and channel contribution
    notes: >-
      Public evidence is partial and mixes company, partner, analyst, and review
      sources; rows describe visible monetization paths, not audited revenue mix.
    enumerationScope:
      coverage: partial
      basis: Public evidence covers visible monetization mechanisms only, not a complete internal revenue ledger or segment mix.
    claimRefs: [CI001, CI003, CI004, CI009, CI010, CI015]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Element
      - Public evidence
      - List vs realized pricing
      - Current status
      - Underwriting implication
    rows:
      - - Public price card
        - No public price card located
        - Realized price unknown
        - Enterprise quote required
        - Prevents external benchmarking of seat economics
      - - Contract basis
        - Review sources describe annual contracts with per-seat or firm-wide licensing arrangements
        - Described, not contractually verified
        - Likely negotiated case by case
        - Need executed order forms to test ACV durability
      - - Pricing inputs
        - Pricing said to vary with firm size, seat count, and deployment scope
        - Discounting and minimums unknown
        - Opaque
        - No view into realized ASP, ramp discounts, or channel rebates
      - - Expansion path
        - Sacra describes pilot deployments expanding into wider licenses
        - Expansion pricing unknown
        - Supported directionally
        - Expansion-led growth thesis cannot be underwritten without cohort data
    notes: >-
      The table separates public pricing signals from realized economics; no row
      should be read as disclosed customer pricing.
    enumerationScope:
      coverage: partial
      basis: The table captures the public monetization evidence available as of the run date, which omits private contracts and discount schedules.
    claimRefs: [CI002, CI003, CI015]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - ARR
        - $100M milestone reported for April 2026; >$200M ARR estimated for September 2026
        - Medium
        - Establishes top-line momentum but not GAAP revenue quality
        - Monthly ARR bridge, recognized revenue, and deferred revenue
      - - Blended ACV
        - Roughly $95K estimated by Sacra
        - Medium
        - Helps test enterprise deal size and payback assumptions
        - ACV by segment, seat count, and initial vs expanded contract
      - - Gross margin
        - null
        - Low
        - Needed to separate software economics from services-heavy delivery
        - Gross margin by product and services attachment
      - - CAC / payback
        - null
        - Low
        - Needed to underwrite sustainable growth efficiency
        - CAC by channel, sales cycle, win rate, and payback period
      - - Burn / runway / cash
        - null
        - Low
        - Required to judge financing dependency after the 2026 fundraise
        - Cash balance, monthly burn, runway, debt, and hiring plan
    notes: >-
      Null values indicate public non-disclosure rather than zero; third-party ARR
      and ACV figures are estimates or company-reported milestones, not audited statements.
    enumerationScope:
      coverage: partial
      basis: Public sources reveal only selected top-line and ACV proxies, while core underwriting metrics remain private.
    claimRefs: [CI005, CI006, CI007, CI011, CI013]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports an enterprise pilot-to-expansion revenue motion
      with services-heavy activation and outcome-driven renewal.
    data:
      nodes:
        - id: need
          label: Enterprise legal workflow need
          note: Law firm or in-house legal team needs faster research, review, and drafting throughput.
        - id: pilot
          label: Pilot or matter-scoped deployment
          note: Initial rollout is usually tied to a team, matter, or workflow rather than self-serve signup.
        - id: contract
          label: Negotiated subscription contract
          note: Public evidence points to enterprise quotes and annual licensing rather than published list pricing.
        - id: rollout
          label: Integration and legal-engineering rollout
          note: Implementation includes workflow setup plus integrations across Word, email, research, and document systems.
        - id: outcomes
          label: Productivity and cost outcomes
          note: Case studies emphasize shorter review cycles, lower spend, and usable structured contract data.
        - id: expansion
          label: Renewal and expansion
          note: Positive outcomes support wider licenses and deeper in-house penetration, but public retention data is unavailable.
      edges:
        - from: need
          to: pilot
          label: Demo and scoped use case
        - from: pilot
          to: contract
          label: Paid enterprise agreement
        - from: contract
          to: rollout
          label: Configure workflows and integrations
        - from: rollout
          to: outcomes
          label: Adoption creates measurable ROI
        - from: outcomes
          to: expansion
          label: Reference value supports wider deployment
    approximationNotes: >-
      This flow describes the public commercial logic only; it does not infer
      conversion rates, margin percentages, or realized contract values.
    claimRefs: [CI001, CI002, CI003, CI004, CI010, CI015]
callouts:
  - calloutType: insight
    title: Demand is public; realized economics are not
    body: >-
      Public sources support strong demand, large enterprise contracts, and
      rapid adoption, but the external record still does not reveal how much of
      growth comes from software subscriptions versus enablement-heavy delivery.
    claimRefs: [CI005, CI006, CI010, CI013]
  - calloutType: risk
    title: The main underwriting gap is not capital raised but cash efficiency
    body: >-
      The 2026 financing history reduces near-term solvency fear, yet the lack
      of public gross-margin, burn, CAC, and runway data means investors still
      cannot test whether current growth compounds efficiently or simply consumes
      large amounts of capital.
    claimRefs: [CI011, CI012, CI013]
