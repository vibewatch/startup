company:
  name: "Legora"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Legora addresses enterprise legal-workflow spend rather than the whole legal
    software market, with a product centered on research, review, drafting, and
    agentic execution inside lawyers' existing systems. The assigned evidence
    shows substantial realized adoption but does not support a defensible
    category TAM/SAM/SOM, so this chapter uses buyer-universe, installed-base,
    pricing, and ACV lenses while preserving conflicting scale estimates.
sections:
  - id: "market-boundary"
    title: "Market boundary and substitutes"
    body: |-
      Legora's relevant market is the enterprise legal-AI workspace category:
      software used by lawyers and legal teams to research, review, draft, and
      execute multi-step legal work inside established document, email, research,
      and matter systems. This boundary includes spend that replaces or augments
      manual associate work, legal research hops, large-document review, and
      fragmented legal point tools. It excludes the much broader legal-services
      economy, general-purpose productivity AI, practice-management software, and
      business-user contract automation whose primary job is to keep routine
      agreements away from lawyers. The distinction is important because a
      lawyer-centric workspace and a sales- or procurement-centric contract
      platform have different users, adoption paths, and budget logic even when
      both use AI. Legora therefore competes for a valuable workflow-infrastructure
      wedge rather than every dollar labeled legal technology.
    claimRefs: ["CM001", "CM002", "CM014", "CM016"]
    tableRefs: ["TM001"]
  - id: "evidence-constrained-sizing"
    title: "Evidence-constrained sizing"
    body: |-
      The assigned pool contains no independent category-revenue estimate with
      explicit geography, included spend, methodology, and forecast period, so a
      conventional TAM/SAM/SOM would create false precision. Sacra instead offers
      a broad organizational universe of more than 50,000 law firms and 40,000
      corporate legal departments globally, but that population is not a
      serviceable-market count because it lacks firm-size, budget, security, and
      workflow-fit filters. Realized adoption is more concrete: Sacra reported
      2,100 firms and legal teams, 130,000 monthly lawyers, and more than 80
      countries as of September 2026, alongside an estimated blended ACV of
      roughly $95,000. These measures show commercial depth but cannot be
      multiplied into TAM without assuming that every organization is eligible,
      has the same contract value, and will adopt an enterprise platform.
    claimRefs: ["CM005", "CM006", "CM013"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001"]
  - id: "buyers-and-adoption"
    title: "Buyer, user, payer, and adoption path"
    body: |-
      Independent directory evidence places innovation and knowledge-management
      leaders at mid-to-large law firms near the buying center, while product and
      company evidence identifies lawyers as the daily users. The payer and final
      budget owner are not publicly disclosed by segment; diligence should not
      silently substitute the user for the economic buyer. Adoption is most
      credible when it starts with a bounded workflow such as tabular diligence,
      precedent-grounded drafting, cross-jurisdiction research, or regulatory
      monitoring, then expands through Word, Outlook, and document-management
      integrations. In-house legal is a growing second segment: Sacra attributed
      more than 40% of Legora's Q3 2026-to-date new business to in-house teams.
      That expansion broadens the serviceable market, but it also increases the
      need to prove segment-specific implementation cost and return on spend.
    claimRefs: ["CM002", "CM003", "CM004", "CM008", "CM009", "CM015"]
    tableRefs: ["TM003"]
  - id: "drivers-constraints-and-uncertainty"
    title: "Drivers, constraints, and contradictory estimates"
    body: |-
      Demand is supported by pressure to compress research and review time,
      connect AI output to authoritative and firm-owned knowledge, and keep work
      inside tools lawyers already use. The constraints are equally material.
      Competitor-issued and independent directory sources report quote-only
      pricing, a roughly $3,000 per-user annual starting point, and a 10-seat
      minimum, but those figures are not vendor-published and require direct
      confirmation. Implementation can require document-system integration,
      permissioning, playbooks, legal engineering, governance, and human review;
      consumption-based Agent Pro pricing also makes usage controls and project
      attribution part of the buyer's budget case. Public scale disclosures are
      not fully comparable: two May 2026 sources reported more than 800
      organizations across 16 countries and more than 1,000 organizations across
      50-plus markets, respectively. The difference may reflect date, geography,
      or customer-definition choices, so neither should be normalized away.
    claimRefs:
      ["CM007", "CM008", "CM009", "CM010", "CM011", "CM012", "CM015", "CM016"]
