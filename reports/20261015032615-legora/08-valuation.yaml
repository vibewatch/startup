  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Public sources do not disclose NRR, GRR, gross margin, CAC payback, burn, or cash runway.
      whyItMatters: Those metrics determine whether the current valuation is supported by durable economics rather than only top-line momentum.
      diligencePath: Request cohort retention, gross margin, burn, and sales-efficiency materials in management diligence.
      relatedQuestionRefs: [QV006, QV009]
    - type: missing-source
      severity: material
      topic: financing-terms
      missingEvidence: No public source in the assigned pool discloses liquidation preferences, seniority, board-control terms, or unusual investor protections from the 2026 financings.
      whyItMatters: Late-stage pricing can still disappoint common-equity returns if the preference stack or governance terms are unfavorable.
      diligencePath: Review the latest financing documents, cap table, and board consents under NDA before underwriting.
      relatedQuestionRefs: [QV007]
    - type: conflicting-data
      severity: minor
      topic: operating-scale
      missingEvidence: Public sources use inconsistent customer-count denominators and dates.
      whyItMatters: The valuation case is sensitive to whether growth is broad-based across customers or concentrated in a smaller set of large accounts.
      diligencePath: Ask management for a dated bridge across firms, legal teams, active users, and revenue concentration.
      relatedQuestionRefs: [QV004]
