schemaVersion: report-v2
artifact: valuation
slug: legora
runDate: 2026-10-15
company:
  name: Legora
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports staying engaged with Legora, but not underwriting the
    current price: the company has raised at a roughly $5.55-$5.6 billion valuation
    while the public record still leaves pricing, retention, margin, burn, and
    preference-stack questions unanswered. With only estimated ARR and non-comparable
    customer disclosures in the public domain, the valuation case is still more
    evidence-sensitive than price-supported.
sections:
  - id: financing-context
    title: Financing context implies a premium price before the public file is complete
    body: >-
      The public financing record shows a very fast repricing. Legora's March 2026
      Series D was announced at $550 million and a $5.55 billion valuation, and
      Sacra later described an April extension that brought the round to $600 million
      at a $5.6 billion post-money valuation. That step-up matters because ILTA's
      funding history also points to a $1.8 billion valuation in October 2025, so
      the business appears to have tripled in headline value inside roughly half a
      year. The price move is understandable if ARR and adoption are compounding at
      the pace some third parties describe, but the underwriting problem is that the
      public record still relies on estimates and company-supplied milestones rather
      than audited economics or disclosed deal terms.
    claimRefs: [CV001, CV005, CV007, CV008, CV013, CV016]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: The core thesis is real, but the anti-thesis is mostly about price and proof depth
    body: >-
      The bullish case has substance. Legora's March 2026 release described growth
      from 40 to 400 employees in a year plus daily usage by tens of thousands of
      lawyers across 800 customers in more than 50 markets, and Sacra estimated ARR
      above $200 million by September 2026 with the U.S. becoming the largest
      revenue market. Product ambition also moved beyond a drafting copilot into a
      broader workflow operating-system narrative with the May 2026 aOS launch.
      The anti-thesis is not that there is no momentum; it is that the public file
      still does not let an investor test how durable that momentum is. Pricing is
      undisclosed, customer-count denominators drift across sources, and the most
      skeptical independent framing says a stellar valuation is not the same thing
      as a mature production track record.
    claimRefs: [CV003, CV004, CV008, CV009, CV010, CV011, CV012, CV015]
    tableRefs: [TV002]
  - id: scenarios-and-entry-discipline
    title: The current call should stay price-sensitive rather than company-quality sensitive
    body: >-
      The right lens is not whether Legora is impressive; it is whether the current
      entry price still leaves enough upside after execution, competition, and
      multiple-compression risk. Forbes explicitly framed legal-AI fundraising as
      moving into valuation territory once reserved for much larger software
      businesses and contrasted private enthusiasm with weaker public market trading
      in legal-software parents. That is a clear warning that today's private mark
      already discounts a large part of the optimistic scenario. Without public NRR,
      gross margin, CAC efficiency, burn, or cap-table terms, the valuation work
      has to default to entry discipline: keep tracking the company, but require
      private KPI confirmation or a better price before converting interest into an
      invest recommendation.
    claimRefs: [CV005, CV006, CV008, CV010, CV011, CV014, CV016]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: diligence-asks
    title: Exit readiness exists, but final diligence still needs private proof
    body: >-
      On public evidence alone, Legora looks more exit-credible than fragile: it
      has recruited a large investor syndicate, broadened product scope, and
      appears to be winning meaningful U.S. adoption. The unresolved issues are the
      ones that actually determine whether a late-stage entry can compound from
      here: whether the reported ARR scale converts into durable net retention and
      margin quality, whether the apparent customer growth is concentrated in a few
      flagship accounts or broad-based, and whether the financing stack carries
      liquidation or control terms that cap common-equity upside. Until those are
      answered in diligence, the prudent posture is to stay engaged but not to pay
      through the top of the current private mark.
    claimRefs: [CV002, CV004, CV009, CV010, CV012, CV013, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: "Current call: track rather than underwrite"
    body: >-
      Public evidence shows real scale and category momentum, but the roughly
      $5.55-$5.6 billion valuation already assumes a large share of the upside
      while pricing, retention, margin, burn, and preference data remain private.
    claimRefs: [CV001, CV007, CV008, CV010, CV016]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - State
      - Recommendation
      - Confidence
      - Risk rating
      - Valuation stance
      - Decision implication
    rows:
      - ["Current public-evidence call", track, medium, high, expensive, "Stay engaged and diligencing, but do not underwrite the current mark without private KPI and term-sheet proof."]
      - ["Upgrade trigger", invest, medium, high, fair, "Only if private diligence confirms durable retention, healthy margins and burn, and clean liquidation terms at or below today's implied valuation."]
    notes: >-
      The second row is conditional rather than current fact; it shows what would
      have to become true for the recommendation to improve.
    claimRefs: [CV001, CV007, CV008, CV010, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Argument
      - What would change the view
    rows:
      - ["Scale proof", "Public sources describe rapid adoption and funding momentum across law firms and in-house teams.", "Private cohort data showing weak expansion or concentrated usage would weaken the thesis."]
      - ["Product breadth", "aOS plus workflows suggests Legora is trying to own more of the legal workflow than a single drafting tool.", "Evidence that customers only use narrow point features would reduce TAM expansion confidence."]
      - ["Pricing opacity", "Public pricing is undisclosed and even widely cited seat-level estimates are explicitly unverified.", "A clean pricing framework plus cohort retention and ACV data would improve confidence."]
      - ["Valuation step-up", "The company moved from a $1.8 billion valuation in October 2025 to roughly $5.55-$5.6 billion by March-April 2026.", "More verified ARR, margin, and retention evidence would better justify the rerating."]
      - ["Competitive intensity", "Independent and competitor comparisons both position Legora in a crowded legal-AI field with real Harvey overlap.", "Clear proof of superior win rates, lower churn, or differentiated workflow depth would strengthen the moat case."]
    notes: >-
      This table mixes company-supplied metrics, third-party estimates, and market
      commentary; each row should be read as a diligence lens rather than a model-ready fact.
    claimRefs: [CV003, CV008, CV010, CV011, CV012, CV014, CV015, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - ["Bull", "Sacra's ARR estimate is directionally right or conservative, workflow expansion lifts ACV, and the U.S. mix keeps improving.", "Today's price can still work if Legora compounds fast enough to earn into the premium multiple and supports a strong strategic or IPO path.", "Multiple compression in legal AI or weak retention despite headline usage growth.", "Plausible only if private diligence validates retention, margin quality, and broad seat expansion."]
      - ["Base", "ARR is growing quickly but public evidence overstates comparability and pricing power remains partly unverified.", "The company can justify continued tracking, but the current valuation already captures much of the operational upside visible in public evidence.", "Entry-price risk dominates execution risk for a new investor at today's mark.", "Best fit with current public file."]
      - ["Bear", "Customer and usage metrics prove less monetizable than they appear and public-market multiple pressure flows into late-stage private marks.", "A flat or down-round outcome becomes possible because the valuation outran the disclosure quality needed for a clean underwrite.", "Hidden preference overhang, slowing expansion, margin weakness, or crowded competition.", "Triggered by weak cohort economics, concentrated customer wins, or adverse term-sheet details."]
    notes: >-
      These are analytical scenarios, not probability-weighted valuation outputs;
      the public record does not disclose enough to support a precise DCF or revenue-multiple bridge.
    claimRefs: [CV005, CV006, CV008, CV010, CV011, CV014, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Strong adoption and product ambition support interest, but valuation velocity and disclosure gaps keep the current recommendation at track.
    data:
      nodes:
        - label: Adoption proof
          detail: March 2026 sources cite 800 customers and tens of thousands of daily lawyer users.
        - label: ARR momentum
          detail: Sacra estimates ARR surpassed $200 million by September 2026 after doubling in under six months.
        - label: Workflow expansion
          detail: aOS and workflow tooling increase the scope of what Legora can sell into legal teams.
        - label: Valuation rerating
          detail: Public marks moved from $1.8 billion in October 2025 to roughly $5.55-$5.6 billion by spring 2026.
        - label: Underwrite gaps
          detail: Pricing, retention, margin, burn, and liquidation terms remain largely undisclosed in public evidence.
        - label: Recommendation
          detail: Keep tracking and diligencing, but require private KPI proof or a better entry price before investing.
      edges:
        - from: Adoption proof
          to: ARR momentum
          label: Supports premium growth narrative
        - from: ARR momentum
          to: Workflow expansion
          label: Funds broader product scope
        - from: Workflow expansion
          to: Valuation rerating
          label: Expands what the market can underwrite
        - from: Valuation rerating
          to: Underwrite gaps
          label: Prices in upside faster than disclosure improves
        - from: Underwrite gaps
          to: Recommendation
          label: Keeps call at track, not invest
    approximationNotes: >-
      The sequence shows analytical dependence rather than a quantified model, so
      edge labels explain logic instead of implied conversion rates.
    claimRefs: [CV003, CV008, CV012, CV013, CV016]
