evidenceGaps:
  - type: missing-source
    severity: material
    topic: founding-and-governance
    missingEvidence: >-
      Primary-source confirmation of founding date, formal headquarters, cofounder roster, executive bench, and board
      composition.
    whyItMatters: >-
      Later chapters need stable identity and governance ground truth, and the assigned pool is much stronger on
      fundraising and traction than on corporate structure.
    diligencePath: >-
      Request a current leadership/board list, legal-entity summary, and formation history from management or a verified
      corporate registry extract.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: audited-operating-metrics
    missingEvidence: Audited revenue, gross margin, burn, cash runway, current headcount, and one consistent customer denominator.
    whyItMatters: >-
      Public sources here support momentum but do not give a finance-grade basis for underwriting unit economics or
      normalizing valuation multiples.
    diligencePath: >-
      Request board-approved KPI definitions plus monthly operating dashboards tying ARR, customer counts, and headcount
      to one reporting perimeter.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: cap-table-and-control
    missingEvidence: >-
      Ownership percentages, board seats, liquidation preferences, secondary sales, debt facilities, and any
      investor-specific governance rights.
    whyItMatters: >-
      Named investors alone do not show who controls the company, how dilution has evolved, or whether the latest
      financing changed incentives.
    diligencePath: >-
      Request the cap table, financing docs, shareholder agreements, and any side letters covering governance or
      economic preference terms.
    relatedQuestionRefs:
      - QO002
      - QO006
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: tam-sam-som
    missingEvidence: >-
      An independent category-size estimate with explicit geography, included spend, base year, forecast period,
      methodology, and CAGR.
    whyItMatters: >-
      Without those definitions, organizational counts and vendor ACV cannot be converted into a defensible TAM, SAM, or
      SOM.
    diligencePath: >-
      Obtain independent market research and management's bottom-up segmentation, then reconcile eligible accounts,
      expected ACV, and adoption assumptions.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: customer-scale
    missingEvidence: >-
      A dated reconciliation of the May 2026 customer counts, country or market definitions, and active-customer
      criteria.
    whyItMatters: Different denominators can distort penetration, growth, and serviceable-market conclusions.
    diligencePath: >-
      Request management's monthly customer bridge with definitions for firm, legal team, active account, country, and
      market.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-and-roi
    missingEvidence: >-
      Segment-level budget ownership, pilot conversion, implementation cost, payback period, retention, and expansion
      evidence.
    whyItMatters: >-
      Those measures determine whether adoption can extend beyond sophisticated enterprise buyers at acceptable
      economics.
    diligencePath: >-
      Request law-firm and in-house cohort data, contracts, implementation statements of work, renewal records, and
      buyer interviews.
    relatedQuestionRefs:
      - QM003
      - QM005
      - QM009
    relatedTableRefs:
      - TM003
  - type: access-blocked
    severity: minor
    topic: access-gap
    missingEvidence: Readable original text for the assigned Contrary Research company report.
    whyItMatters: The prefetched page returned only a privacy notice, so it cannot support any claim or quotation.
    diligencePath: Obtain authorized readable access in a future run or replace it with a separately allocated source.
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Actual seat minimums, realized contract values, renewal uplifts, and agent-credit usage for Legora and Harvey.
    whyItMatters: >-
      Without realized pricing and renewal data, the buyer cannot convert list-price opacity into a credible
      switching-cost or payback model.
    diligencePath: >-
      Request current proposals, historical renewal schedules, and at least three anonymized customer contracts from
      management or channel partners.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Churn, multihoming rates, migration case studies, and evidence on how often firms rip out competing legal AI once
      configured.
    whyItMatters: >-
      Durability depends on whether configured workflows and knowledge assets actually lock customers in or merely
      coexist with rival copilots.
    diligencePath: >-
      Ask for cohort retention, customer references that replaced a prior tool, and implementation case studies showing
      time-to-go-live and expansion paths.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP002
  - type: conflicting-data
    severity: minor
    topic: customer-footprint
    missingEvidence: A reconciled company definition for firms, legal teams, markets, countries, and monthly active professionals.
    whyItMatters: >-
      Conflicting footprint counts make it harder to judge whether distribution momentum is accelerating or whether
      public reporting is mixing different denominators.
    diligencePath: >-
      Ask management to define every public footprint KPI and reconcile the September 2026 official and third-party
      counts in one metric bridge.
    relatedQuestionRefs:
      - QP006
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Realized price per seat or per firm, discount schedules, minimum commits, and renewal uplift terms.
    whyItMatters: >-
      Public enterprise-quote messaging does not reveal whether top-line growth is driven by healthy realized pricing or
      aggressive discounting.
    diligencePath: Request three recent order forms by segment plus churned-customer pricing history and renewal uplift data.
    relatedQuestionRefs:
      - QI002
      - QI007
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Gross margin, CAC, payback, services attach rate, and cohort retention by customer segment.
    whyItMatters: These are the core metrics needed to underwrite durable software economics and margin expansion.
    diligencePath: >-
      Obtain board KPI packs or monthly operating metrics with product gross margin, sales efficiency, and retention
      cohorts.
    relatedQuestionRefs:
      - QI004
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: Current cash balance, monthly burn, debt obligations, and management runway plan after the 2026 financing.
    whyItMatters: >-
      Funding raised is not the same as cash available, so capital adequacy cannot be judged from valuation headlines
      alone.
    diligencePath: Request the latest balance sheet, monthly cash burn bridge, debt schedule, and hiring plan.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: enumeration-incomplete
    severity: minor
    topic: revenue-mix
    missingEvidence: Revenue split among subscription software, services, partner-led delivery, and expansion modules.
    whyItMatters: A mixed revenue base can change margin quality, valuation comparables, and the pace of operating leverage.
    diligencePath: Ask finance for segment revenue by stream for the last six quarters and the current contracted ARR bridge.
    relatedQuestionRefs:
      - QI001
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: architecture-proof
    missingEvidence: Public architecture detail on tenancy, model routing, data isolation, and connector write-back coverage by system.
    whyItMatters: Buyers cannot verify which integrations are production-grade versus roadmap-only without a deeper technical pack.
    diligencePath: >-
      Request a solution-architecture deck, tenant-isolation controls, and a dated connector capability matrix for the
      target stack.
    relatedQuestionRefs:
      - QE003
      - QE004
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: reliability-benchmarks
    missingEvidence: >-
      Independent uptime history, incident statistics, and external technical audit evidence for the connector and
      governance layer.
    whyItMatters: >-
      Legal workloads are confidentiality-sensitive and outage-sensitive, so vendor claims alone do not establish
      operational reliability.
    diligencePath: >-
      Request status history, customer references, SOC bridge materials, and security-review documentation tied to
      current connectors.
    relatedQuestionRefs:
      - QE004
      - QE005
  - type: stale
    severity: material
    topic: rollout-maturity
    missingEvidence: >-
      Current GA dates and connector directionality for SharePoint, Teams, Copilot, VDR, and CLM integrations in the
