  - type: missing-source
    severity: material
    topic: concentration-gap
    missingEvidence: Top-customer revenue share, top-10 customer concentration, channel mix, and partner-dependence metrics.
    whyItMatters: Rapid growth can still mask dependence on a small number of flagship accounts or go-to-market channels.
    diligencePath: Ask management for customer concentration tables, expansion by cohort, and channel-sourced bookings.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
