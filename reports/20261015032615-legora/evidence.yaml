      - QE006
      - QE008
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: Public disclosure of NRR, GRR, churn, renewal rates, average contract length, or cohort retention.
    whyItMatters: Adoption breadth does not prove customer durability or spending persistence.
    diligencePath: Request cohort retention, renewal, churn, and contract-length data in management diligence or the data room.
