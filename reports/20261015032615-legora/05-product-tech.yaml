  evidenceGaps:
    - type: missing-source
      severity: material
      topic: architecture-proof
      missingEvidence: Public architecture detail on tenancy, model routing, data isolation, and connector write-back coverage by system.
      whyItMatters: Buyers cannot verify which integrations are production-grade versus roadmap-only without a deeper technical pack.
      diligencePath: Request a solution-architecture deck, tenant-isolation controls, and a dated connector capability matrix for the target stack.
      relatedQuestionRefs: [QE003, QE004, QE008]
      relatedTableRefs: [TE003]
    - type: private-evidence-only
      severity: material
      topic: reliability-benchmarks
      missingEvidence: Independent uptime history, incident statistics, and external technical audit evidence for the connector and governance layer.
