    title: Product architecture map
    type: stack
    summary: Public evidence points to a six-layer operating stack from lawyer-facing surfaces down to connector governance and services.
    data:
      layers:
        - label: User surfaces
          detail: Lawyers interact through web, Word, Outlook, and mobile.
          modules:
            - label: Interfaces
              detail: Web workspace, Microsoft Word add-in, Outlook add-in, mobile
        - label: Specialist task modules
          detail: Productized legal tasks sit above the control plane.
          modules:
            - label: Modules
              detail: Tabular Review, Assistant / Research, Monitors, Portal
        - label: Orchestration layer
          detail: The aOS, Agent, and Workflows coordinate multi-step legal execution.
          outputs:
            - Drafting
            - Review
            - Research
            - Delivery
        - label: Knowledge layer
          detail: Firm-specific context informs outputs and review standards.
          modules:
            - label: Knowledge assets
              detail: Playbooks, precedent libraries, clause banks, client history, negotiated positions
        - label: External systems of record
          detail: Connectors pull from and write back to enterprise legal systems.
          modules:
            - label: Systems
              detail: SharePoint, iManage, NetDocuments, legal databases, email, matter systems
        - label: Governance and rollout
          detail: Permissions, ethical walls, audit logs, and Legal Engineers shape safe deployment.
          modules:
            - label: Controls
              detail: Per-request permissions, Intapp / iManage policy controls, audit logging
    claimRefs: [CE002, CE006, CE009, CE010, CE014]
