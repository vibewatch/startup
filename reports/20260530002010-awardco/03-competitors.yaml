  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: Amazon partnership exclusivity
      missingEvidence: "Commercial terms, exclusivity clause, and API governance framework of the Amazon Business partnership"
      whyItMatters: >-
        The durability of Awardco's primary moat depends on whether Amazon Business exclusivity with Awardco
        is contractually binding; if Achievers or other vendors can access the same catalog, the no-markup
        advantage is replicated and the moat narrows significantly.
      diligencePath: "Request Amazon Business partnership agreement as part of due diligence data room; ask Awardco leadership directly about exclusivity terms and renewal schedule"
      relatedQuestionRefs:
        - QP005
      relatedTableRefs:
        - TP004

    - type: private-evidence-only
      severity: material
      topic: Awardco churn and net revenue retention
      missingEvidence: "Verified net revenue retention (NRR) rate, gross logo churn, and expansion revenue data for Awardco"
      whyItMatters: >-
        In a market with increasing HCM bundling and SMB pricing competition, NRR is the key indicator of
        whether Awardco's switching costs are real or theoretical; low NRR would suggest customers are leaving
        despite the Amazon moat.
      diligencePath: "Request historical NRR, churn rates, and expansion revenue data from Awardco management in due diligence"
      relatedQuestionRefs:
        - QP009

    - type: missing-source
      severity: material
      topic: adverse legal and regulatory
      missingEvidence: "Any regulatory complaints, employment data privacy investigations, or legal filings involving Awardco"
      whyItMatters: >-
        Recognition platforms process substantial employee personal data and HR records; regulatory or privacy
        actions could affect enterprise procurement decisions and expand competitive risk surface area.
      diligencePath: "Search CCPA/GDPR enforcement databases, CFPB/FTC consumer complaint records, and legal dockets for Awardco Inc. and related entities"
      relatedQuestionRefs:
        - QP024

    - type: enumeration-incomplete
      severity: minor
      topic: competitor profile table
      missingEvidence: "Verified G2 ratings, NPS, enterprise win-loss data, and Achievers verified enterprise pricing tiers"
      whyItMatters: >-
        Quantitative customer satisfaction and competitive win-loss data would sharpen the feature matrix and
        moat durability assessment; verified Achievers pricing (currently third-party estimated only) would
        clarify the enterprise cost comparison.
      diligencePath: "Access G2 Business or Gartner Peer Insights enterprise tier for verified ratings; request Achievers RFP-stage pricing from a qualified enterprise buyer contact; request customer reference calls from Awardco including win-loss context"
      relatedQuestionRefs:
        - QP020
        - QP007
      relatedTableRefs:
        - TP001
