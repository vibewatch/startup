  - id: competitor-profiles
    title: Direct Competitor Profiles
    body: |
      Workhuman is the most formidable direct peer. Founded 25 years ago, the company has been consistently
      profitable for over a decade and operates a proprietary $1B global e-commerce rewards store—owned and
      operated end-to-end—through which 12M orders are placed annually. Its 8M global users across 180+ countries
      and estimated $345M in 2026 revenue place it ahead of Awardco on scale. Workhuman's "Human Intelligence" AI
      layer transforms recognition signals into workforce analytics that CHRO buyers find strategically valuable.
      Unlike Awardco's Amazon passthrough, Workhuman controls fulfillment, which enhances personalization but
      limits catalog breadth relative to Amazon's network. Total external funding is approximately $131.5M at a
      ~$1.2B valuation; profitability reduces dependence on further capital raises.

      Achievers holds a structurally differentiated position because of its April 2026 embedded integration with
      Workday HCM, making it the only recognition platform natively built into a major HCM suite at this scale.
      This integration uses AI-powered insights tied to employee performance data, supports rewards redemption in
      local currencies across 190 countries, and eliminates the standalone procurement step for Workday's 11,500+
      enterprise clients—65% of the Fortune 500. Achievers' pricing remains entirely quote-based, with third-party
      estimates of $1–4/user/month for enterprise deployments and a dedicated success manager included. As a
      standalone recognition tool outside the Workday context, Achievers is broadly feature-comparable to Awardco,
      but the Workday native module provides a distribution advantage that competitors cannot easily replicate.

      O.C. Tanner (Culture Cloud) is the traditional service-award incumbent, differentiated by deep milestone
      recognition—career anniversaries, promotions, retirements—and tangible symbolic awards. Its analytics depth
      is respected by enterprise HR teams for ROI attribution and participation tracking. However, O.C. Tanner is
      less suited for continuous daily peer-to-peer recognition and is event-driven by design, making it more
      complementary than competitive for high-frequency recognition use cases.

      Reward Gateway, acquired by Edenred for £1.15B in May 2023, bundles recognition with employee savings,
      wellbeing, and benefits programmes and benefits from Edenred's 1M corporate clients across 45 countries.
      Post-acquisition, the platform is actively rolling out in major European markets (Belgium, France, Germany,
      Italy, Romania, Spain). Integration complexity post-M&A may constrain product velocity in the near term.
      Bonusly, Nectar HR, and Motivosity serve the SMB-to-mid-market tier with lower price points ($2–5/user/month)
      but limited enterprise scale, global catalog depth, and AI capabilities. Bonusly remains independent as of
      mid-2026 with no confirmed acquisition, serving thousands of teams with peer-to-peer social recognition.
      Nectar HR offers Slack and Teams integrations and a swag store in its Premium tier. Motivosity includes a
      social community layer designed to reduce attrition.
