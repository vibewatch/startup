  - id: capability-pricing-comparison
    title: Capability and Pricing Comparison
    body: |
      Most enterprise recognition platforms—Awardco, Workhuman, Achievers, O.C. Tanner, and Reward Gateway—
      operate on custom, sales-led pricing with no published rate cards. Awardco's pay-per-active-user (PPAU)
      model charges only for employees who actually engage with the platform in a billing period, which buyers
      cite as favorable versus per-seat contracts. The SMB-tier alternatives Nectar HR ($2.75/user/month, $4K
      annual minimum) and Motivosity ($2–5/user/month, $3K annual minimum) offer published pricing, creating
      downward pressure on simple recognition tiers and making pricing opacity a liability for Awardco in SMB
      evaluation cycles.

      Awardco's central pricing differentiation is the dollar-for-dollar, no-markup rewards model powered by
      Amazon Business. Competitors that run proprietary reward marketplaces—Workhuman's owned $1B store,
      Achievers' 2,500+ brand marketplace—typically embed margin into goods or charge platform fees. Awardco
      claims this delivers a verifiable cost efficiency for buyers doing budget reconciliation. Third-party
      reviewers confirm this as a genuine buyer benefit, though independent benchmarks of the actual savings
      differential versus specific competitors have not been published. Awardco's PPAU structure also means
      that annual budget exposure scales with engagement rates, not headcount, which is structurally different
      from Nectar HR and Motivosity's per-seat minimums.

      Independent reviews from Capterra (4,616 verified reviews) and Software Advice consistently rate Awardco
      highly on ease of use and reward variety but surface recurring criticisms: post-implementation support
      response delays, occasional Amazon merchandise unavailability due to catalog eligibility rules, opaque
      pricing complexity at enterprise scale, and steeper-than-expected administrative setup for large
      organizations. ITQlick scores Awardco's pricing transparency 6/10, notes that comparable tiered platforms
      cost $3–6/user/month, and cautions that hidden implementation burden reduces competitive value for
      rigorous TCO buyers. These documented weaknesses are the primary leverage point for Nectar HR and
      Motivosity in SMB and mid-market evaluation cycles, and for Workhuman at the enterprise tier where
      multi-year contract predictability matters.
