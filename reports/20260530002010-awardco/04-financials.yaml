  - id: public-traction-growth
    title: Public Traction and Growth Metrics
    body: >-
      Awardco's publicly disclosed traction metrics are company-reported and
      derived from third-party estimates, not audited financials. The most
      specific data point is ARR of $75.2M in 2024 (reported via Latka, citing
      a founder interview), up from $43.4M in 2023—representing ~73% YoY growth.
      Extrapolating this growth at a conservatively declining rate, 2026 revenue
      is plausibly in the $95M–$120M range, though no 2026 figure has been
      disclosed. Third-party analytics firms Compworth and IncFact estimate
      2025–2026 revenue at approximately $106.6M.

      The company reports 3,000+ enterprise and mid-market customers (company
      press releases citing Fortune 500 clients including AT&T, Adobe, and Hertz)
      and 6 million+ active users across 163 countries. User count and customer
      count are not independently verified. The 2021-to-2024 CAGR implied by
      the ARR trajectory (~$25M in 2021 → $75.2M in 2024) is approximately
      44% per year, consistent with a well-retained SaaS customer base
      expanding via upsell and new logo acquisition.

      Awardco's headcount grew to approximately 636 employees by early 2026
      (per Tracxn and PitchBook estimates), up ~34% from 2024, a signal of
      continued investment in go-to-market and product expansion. No WARN
      Act filings or announced layoffs have been identified for 2026. Revenue
      per employee (~$178K) compares favorably to SaaS benchmarks, suggesting
      operational efficiency at this stage.
    claimRefs:
      - CI013
