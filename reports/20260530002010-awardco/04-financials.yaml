    figureRefs:
      - FI001

  - id: unit-economics-cost-structure
    title: Unit Economics and Cost Structure
    body: >-
      Awardco does not publicly disclose unit economics. Net revenue retention (NRR),
      customer acquisition cost (CAC), payback period, and gross margin are all
      private-company metrics not verified through any third-party source. Investor
      commentary at the Series B close describes "exceptional customer satisfaction"
      and "sustained high growth," which are consistent with above-market NRR, but no
      specific figure is cited.

      Awardco's cost structure mirrors high-margin B2B SaaS: the platform's primary
      expenses are software engineering, customer success, and go-to-market, with
      reward fulfillment handled entirely by Amazon's logistics at no incremental
      Awardco cost. This structure—platform fee revenue against predominantly
      people/infrastructure costs with no physical fulfillment overhead—is analogous
      to HR tech SaaS platforms that typically achieve gross margins of 70–85%.
      High Alpha's 2025 SaaS Benchmarks report documents a median HR tech gross
      margin of ~76%, with top-quartile providers at 80–85%. Awardco's zero-markup
      model eliminates a cost category (fulfillment margin) that some competitors
      carry, suggesting its gross margin may be at the higher end of this range,
      but this remains an estimate absent audited financials.

      Revenue per employee is estimated at approximately $178,000 in 2026, which is
      above median for B2B SaaS at this stage (OpenView 2025 benchmarks: ~$140–160K
      for Series B SaaS). This is consistent with a high-margin, low-COGS platform
      model but should be confirmed against disclosed financials.
