callouts:
  - calloutType: strength
    title: Cash-Flow Positive at Series B Close
    body: >-
      Awardco's management confirmed a cash-flow-positive business at the time of the
      $165M Series B close (March 2025), an unusual position for a company still growing
      ARR at ~73% YoY. This suggests disciplined unit economics and a self-sustaining
      revenue engine. The Series B appears to be an accelerant raise rather than a
      runway-extension raise, reducing capital concentration risk.
    claimRefs:
      - CI016
      - CI025

  - calloutType: risk
    title: Pricing Opacity Creates Competitive Friction and Lock-In Risk
    body: >-
      Awardco does not publish pricing; all contracts require a sales cycle for a custom
      quote. Multiple review and benchmarking platforms flag this as a negative for smaller
      buyers. ITQlick rates Awardco's pricing 5/10 due to high cost for smaller organizations.
      Customer reviews on Capterra and Gartner Peer Insights cite concerns about unexpected
      cost variations and insufficient price protection at renewal. Deep HRIS integration
      creates switching costs that may mask true competitive pricing pressure.
    claimRefs:
      - CI031
      - CI032
      - CI033

  - calloutType: risk
    title: Amazon Business Dependency Is a Single-Point Revenue Risk
    body: >-
      Awardco's zero-markup model is enabled by and dependent on Amazon Business. If Amazon
      restructured, terminated, or materially limited its Business API or partnership terms,
      Awardco would need to replace its reward fulfillment layer—the core product differentiator.
      No alternative fulfillment partner at comparable scale has been identified. This
      creates vendor concentration risk at the platform layer that should be assessed via
      due diligence on the partnership contract terms and exclusivity provisions.
    claimRefs:
      - CI019
      - CI032
      - CI038

  - calloutType: recommendation
    title: Five Blocking Diligence Items Before Underwriting
    body: >-
      Underwriting a growth equity or secondary investment in Awardco from public data alone
      is not feasible. Five data room items are blocking: (1) audited ARR and gross margin,
      (2) NRR cohort data, (3) CAC and payback by channel and segment, (4) monthly P&L
      and balance sheet confirming cash-flow-positive status, and (5) ARR concentration
      by top-10 customers and EMEA as share of total. These should be the initial data
      room checklist for any diligence process.
    claimRefs:
      - CI018
      - CI027
      - CI028
      - CI029
      - CI030

