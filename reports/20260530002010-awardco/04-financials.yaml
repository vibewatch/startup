      - TI004
    figureRefs:
      - FI004

  - id: financial-verdict-gaps
    title: Financial Verdict and Diligence Gaps
    body: >-
      Revenue quality assessment: Awardco's SaaS subscription model with no
      product-markup revenue has strong revenue quality characteristics—
      recurring, contractual, annually renewed, and not dependent on
      volatile transaction volumes. The zero-markup reward model removes
      a risk of margin compression from supply-chain or Amazon-pricing
      changes on the company's gross margin, but it does create a dependency
      on Amazon Business for fulfillment continuity (adverse flag: see
      evidence gap EG003).

      Margin path: The estimated gross margin range of 70–85% is consistent
      with high-quality SaaS, though the exact figure is unknown. Incremental
      margin expansion should be achievable as the platform scales, given
      low marginal cost of serving additional users. Operating margin is
      not determinable without burn data.

      Capital intensity: Low. Awardco is a software-only business with no
      physical inventory, manufacturing, or significant capex. Reward
      fulfillment capex is zero (Amazon owns the logistics). The primary
      capital use is headcount (R&D, sales, customer success) and
      cloud infrastructure.

      Diligence blockers: Without NRR, gross margin, CAC, payback period,
      and audited burn, underwriting a Series C or secondary investment
      cannot be completed from public data alone. The five specific gaps
      in table TI005 each represent a material data room requirement.
      The pricing opacity and Amazon-dependency concerns documented by
      review platforms (ITQlick, Vendr, SpendHound) are customer-facing
      financial risks that should be stress-tested in customer reference calls.
    claimRefs:
      - CI031
      - CI032
      - CI033
      - CI038
    tableRefs:
      - TI005

