  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: gross margin
      missingEvidence: >-
        Audited income statement showing gross revenue, COGS breakdown, and gross margin
        percentage for FY2023–FY2025.
      whyItMatters: >-
        Without audited gross margin, the quality and sustainability of Awardco's
        revenue cannot be confirmed; the zero-markup model implies high margins but
        an undisclosed services component could compress them.
      diligencePath: >-
        Request audited or reviewed financial statements from Awardco management in
        the virtual data room; confirm gross margin definition excludes reward spend.
      relatedQuestionRefs:
        - QI007
      relatedTableRefs:
        - TI003

    - type: private-evidence-only
      severity: blocking
      topic: unit economics
      missingEvidence: >-
        Net revenue retention (NRR) by quarter and customer cohort, broken out by
        SMB, mid-market, and enterprise segments.
      whyItMatters: >-
        NRR is the single most important metric for assessing product stickiness, upsell
        velocity, and long-term ARR compounding; without it, LTV modeling is impossible.
      diligencePath: >-
        Request quarterly NRR cohort data from data room; benchmark against 110–130%
        for comparable B2B SaaS HR tech platforms.
      relatedQuestionRefs:
        - QI014
      relatedTableRefs:
        - TI003

    - type: private-evidence-only
      severity: blocking
      topic: unit economics
      missingEvidence: >-
        Customer acquisition cost (CAC) by channel and segment, average sales cycle
        length, and sales and marketing spend as percentage of revenue.
      whyItMatters: >-
        CAC determines payback period and capital efficiency; without it, the fundraising
        pace required to sustain growth targets cannot be assessed.
      diligencePath: >-
        Request S&M expense schedule, channel-level CAC, and average sales cycle length
        by deal size from data room.
      relatedQuestionRefs:
        - QI023
      relatedTableRefs:
        - TI003

    - type: private-evidence-only
      severity: blocking
      topic: capital adequacy
      missingEvidence: >-
        Monthly P&L and balance sheet for the 12 months ending March 2026, confirming
        cash position, monthly net burn, and operating cash flow.
      whyItMatters: >-
        The cash-flow-positive characterization is company-stated and unverified; net
        burn cannot be calculated without income statement and balance sheet data.
      diligencePath: >-
        Request monthly management accounts and balance sheet from data room; reconcile
        to bank statement for cash position verification.
      relatedQuestionRefs:
        - QI004
      relatedTableRefs:
        - TI004

    - type: missing-source
      severity: material
      topic: Amazon Business dependency
      missingEvidence: >-
        The terms, exclusivity provisions, and renewal conditions of Awardco's partnership
        agreement with Amazon Business are not publicly available.
      whyItMatters: >-
        If Amazon Business can terminate or restructure the agreement, Awardco's core
        differentiator (zero-markup rewards, 300M+ catalog) and its cost structure
        advantage would be at risk; this is a single-point vendor dependency.
      diligencePath: >-
        Request Amazon Business partnership contract from data room; confirm exclusivity
        status, termination rights, and pricing terms.
      relatedQuestionRefs:
        - QI018

    - type: private-evidence-only
      severity: material
      topic: competitive pricing
      missingEvidence: >-
        No independent side-by-side pricing comparison between Awardco, Workhuman, and
        Achievers exists; all three companies use custom enterprise pricing with no
        published rate cards.
      whyItMatters: >-
        Without comparable pricing data, it is not possible to determine whether Awardco
        is priced at a premium, discount, or parity relative to its closest enterprise
        competitors; this limits competitive positioning analysis.
      diligencePath: >-
        Request customer reference calls with buyers who evaluated both Awardco and
        Workhuman or Achievers; obtain proposal-level pricing from each vendor for
        the same user count and feature scope.
      relatedQuestionRefs:
        - QI015

    - type: missing-source
      severity: material
      topic: pricing tiers
      missingEvidence: >-
        Awardco's official per-tier pricing schedule (Core, Plus, Pro) is not publicly
        disclosed; all available data is from third-party benchmarking platforms using
        anonymized deal data.
      whyItMatters: >-
        Without the official price architecture, the revenue mix between tiers and
        average upsell dynamics cannot be modeled; pricing tier structure is a key
        input to ARR growth forecasting.
      diligencePath: >-
        Request official pricing architecture, tier definitions, and price-per-user
        schedule from Awardco sales team or data room; confirm whether tier migration
        events are included in NRR expansion.
      relatedQuestionRefs:
        - QI019

    - type: private-evidence-only
      severity: material
      topic: legal regulatory
      missingEvidence: >-
        No publicly known regulatory, legal, or contractual risks affecting Awardco's
        financial model have been identified, but private litigation and regulatory
        exposure are not publicly searchable for a private company.
      whyItMatters: >-
        Undisclosed legal or regulatory actions could materially impact financial
        projections, particularly in areas of tax treatment of points programs,
        data privacy under GDPR/CCPA, or labor law compliance across 163 countries.
      diligencePath: >-
        Request litigation and regulatory disclosure schedule from data room; conduct
        lien search and PACER search for Awardco, Inc. entities.
      relatedQuestionRefs:
        - QI024

