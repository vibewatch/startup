      - FI003

  - id: capital-adequacy-financing
    title: Capital Adequacy and Financing
    body: >-
      Awardco's funding history is detailed in the Company Overview chapter.
      For capital adequacy analysis, the material current-state fact is that
      Awardco closed a $165M Series B in March 2025, confirmed by SEC Form D
      (Accession No. 0001799778-25-000006, filed 2025-07-08), bringing total
      disclosed funding to $235M across three rounds. The round was led by
      Sixth Street Growth with participation from Spectrum Equity, General
      Catalyst, and Ryan Smith (HXCO/Qualtrics).

      The company characterizes its business as cash-flow positive with
      "sustained high growth" as of the Series B close. If accurate, this
      implies the $165M raise was an accelerant rather than a survival
      raise—the intended uses are product innovation (AI features, HRIS
      integrations), international expansion (EMEA, London office), and
      headcount growth in engineering and customer success. No debt or
      project-finance obligations are publicly disclosed.

      Absent audited financials, estimated monthly burn cannot be verified.
      With ~636 employees and B2B SaaS cost norms (payroll 65–75% of burn,
      all-in cost per employee $150–$200K/year), an illustrative monthly
      burn range of $8M–$12M is directionally plausible—implying a
      13–21 month runway against the $165M raised, before accounting for
      ongoing revenue cash inflows. The cash-flow-positive characterization
      suggests operating cash burn may be materially lower than this
      illustrative gross spend, but the precise net burn is undisclosed.
      Round-by-round funding chronology should be referenced from the
      Company Overview chapter; this chapter mints only the claims
      required for current capital adequacy assessment.
    claimRefs:
      - CI021
      - CI022
      - CI023
      - CI024
