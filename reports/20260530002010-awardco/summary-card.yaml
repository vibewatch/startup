  topStrengths:
    - >-
      Exclusive Amazon Business partnership creates a differentiated zero-markup rewards catalog with 300M+ options that
      direct peers have not replicated at comparable scale.
    - >-
      Awardco paired 73% ARR growth in 2024 with cash-flow-positive operations, an unusual combination for a late-stage
      private SaaS company.
    - >-
      Reference traction is substantial: 3,000+ organizations, 6M+ users in 163 countries, Fortune 500 logos, and
      backing from Sixth Street Growth, Spectrum Equity, General Catalyst, and Ryan Smith.
  topRisks:
    - >-
      Amazon dependency is existential: if exclusivity terms weaken, fees rise, or Amazon enters recognition software
      directly, Awardco's clearest moat could erode quickly.
    - >-
      Core underwriting metrics remain private or weakly sourced: audited ARR, gross margin, NRR, CAC/payback, customer
      concentration, and the cap-table preference stack are not publicly disclosed.
    - >-
      At a >$1B valuation, entry price already discounts sustained hypergrowth despite a softer public SaaS multiple
      backdrop and bundling pressure from HCM suites and direct peers.
  unresolvedGaps:
    - Audited 2025-2026 financial statements including ARR, revenue, gross margin, burn/runway, and any debt facilities.
    - >-
      Customer retention and concentration metrics: NRR, GRR, logo churn, renewal rates, and top-10 customer share of
      ARR.
    - >-
      Full commercial terms of the Amazon Business exclusivity agreement, including renewal, termination, pricing/API
      economics, and change-of-control provisions.
    - >-
      Board composition, liquidation preferences, and anti-dilution terms from the Series A and Series B preferred
      stock.
