summary:
  headline: >
    Awardco appears to be a high-quality, capital-efficient HR-tech platform with a real product moat and meaningful
    scale, but the current >$1B valuation already assumes continued 30%+ growth that public data cannot fully verify.
  overallScore: 6.7
