chapter:
  number: 6
  title: Customers
  summary: >-
    Awardco serves 3,000+ organizations and 6 million+ active users across 163 countries as of May 2026,
    with a verified customer base spanning Fortune 500 enterprises (AT&T, Adobe, Pacific Life, Hertz),
    mid-market, and frontline-heavy verticals. Published case studies show concrete operational outcomes
    including a 7.6% eNPS lift at Hertz, 24.6% turnover reduction at 4Refuel, and a 209% increase in
    recognitions at Texas Roadhouse. G2 and Capterra each award 4.9/5 ratings with 99% plan-to-renew
    per McLean & Company. Key diligence gaps are the absence of published NRR, cohort retention, and
    logo-churn data, and an adverse critique noting Awardco's case studies emphasize process metrics
    over strategic business outcomes.

sections:
  - id: customer-base-segmentation
    title: Customer Base Segmentation
    body: >-
      Awardco's stated customer base as of May 2026 comprises 3,000+ organizations across 163 countries
      and 6 million+ active users. The platform is positioned at the intersection of enterprise and
      mid-market buyers, with the most common deploying organization running 1,001–5,000 employees,
      while meaningful adoption also extends into 10,000+ employee accounts. The Series B press release
      names AT&T, Adobe, Pacific Life, and Hertz as representative Fortune 500 clients. Bloomberry's
      independent active-customer tracker lists companies in medical equipment, advertising, hospitality,
      construction, aerospace, entertainment, manufacturing, and motor vehicles across North America,
      EMEA, Asia-Pacific, and India. Brandon Hall Group's qualitative assessment identifies healthcare
      systems, multi-location manufacturing, and retail/hospitality chains as Awardco's strongest
      vertical fits, primarily because of the platform's frontline-optimized features: text-based
      recognition, QR code cards, and screen displays for manufacturing floors. The EMEA segment is
      the most recent growth vector; a London office opened in 2024 and the Series B announcement
      explicitly cites rapid EMEA expansion. Buyers are HR and total-rewards teams; end-users are
      employee populations. Within enterprise deployments, buyers and payers can diverge: IT and
      procurement gatekeep system integrations while HR manages program design. G2 Spring 2026 Leader
      placements across Enterprise, Mid-Market, and Small Business confirm broad segment coverage.
      No geographic revenue breakdown has been publicly disclosed.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU022
      - CU027
      - CU032
      - CU036
      - CU044
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: named-customer-proof
    title: Named Customer Proof
    body: >-
      Awardco has published 48 case studies as of May 2026 catalogued by FeaturedCustomers, covering
      clients from food service, transportation, entertainment, finance, healthcare, and aerospace. Among
      these, five provide quantified, verifiable outcomes. Hertz, a 26,000-person enterprise spanning
      160 countries, achieved a 7.6% year-over-year eNPS increase, delivered 1,300 recognitions in a
      single day, and reached 80% of its deskless workforce through the platform integrated with
      Microsoft Teams and AwardCodes for offline recognition. 4Refuel, a North American on-site
      refueling company with 650+ frontline employees, achieved a 24.6% YoY reduction in turnover,
      an 84% monthly platform login rate, and a 55% improvement in Recordable Injury Frequency since
      2019. Crumbl, with 1,000+ franchises and 300+ corporate employees, reported 95% of recognition
      activity flowing through Slack, a 96% favorable score on mission and values alignment, and a 12%
      increase in employees who feel they have ample recognition opportunity. Dubai Airports achieved
      106% peer recognition growth YoY, a 41.4% increase in participation rate, and 90.5% log-in
      rate; Dubai Airports won the Gallup 2025 Exceptional Workplace Award during its Awardco
      deployment. Texas Roadhouse, with 600+ locations and 78,000 employees, was selected via a
      competitive RFP, logged 96,000 recognitions, and recorded a 209.2% average increase in annual
      recognitions. The Utah Jazz and Smith Entertainment Group use the platform to serve 5,600+
      season ticket members, achieving redemption rate improvement from 50% to 70–75%. Across all
      case studies, every quantified outcome metric originates from Awardco's own published pages
      and is unverified by any independent third party.
