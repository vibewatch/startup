  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: nrr-gap
      missingEvidence: >-
        Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and logo-churn rate by
        cohort vintage and customer segment.
      whyItMatters: >-
        Without NRR, the durability of Awardco's installed base and the quality of expansion
        revenue cannot be quantified; the 99% plan-to-renew survey metric cannot substitute
        for a contractual financial retention measure.
      diligencePath: >-
        Request quarterly NRR and GRR cohort data by segment (enterprise, mid-market) and vintage
        from the Awardco data room; benchmark against 110–130% SaaS HR-tech peer range.
      relatedQuestionRefs:
        - QU008
        - QU017
        - QU025
      relatedTableRefs:
        - TU004

    - type: missing-source
      severity: material
      topic: adverse-case-study-critique
      missingEvidence: >-
        Independent third-party verification of any customer outcome metric published in Awardco's
        case studies; the R&R Network critique highlights that no case study links recognition to
        financial outcomes.
      whyItMatters: >-
        All quantified customer outcomes in this chapter originate from Awardco's own publications.
        The absence of independent corroboration limits credibility and raises renewal risk for
        institutional buyers with ROI-based procurement.
      diligencePath: >-
        Request customer references willing to discuss retention and business outcome data; seek
        independent analyst assessments that include business-performance linkage analysis.
      relatedQuestionRefs:
        - QU013
        - QU014

    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: >-
        Revenue contribution from top-10 customers, revenue split by enterprise vs. mid-market
        vs. SMB, and geographic revenue breakdown.
      whyItMatters: >-
        Without top-customer concentration data, the risk that a single large account churning
        could materially impair ARR cannot be assessed.
      diligencePath: >-
        Request customer concentration table showing top-10 customer % of ARR from data room;
        cross-reference Bloomberry active-customer data for any recent churn signals.
      relatedQuestionRefs:
        - QU016
        - QU022
      relatedTableRefs:
        - TU005

    - type: private-evidence-only
      severity: material
      topic: emea-expansion
      missingEvidence: >-
        Number of EMEA customers, EMEA ARR, and pace of customer acquisition since the London
        office opened in 2024.
      whyItMatters: >-
        EMEA is cited in the Series B as a fast-growing segment, but no metric validates the
        claim; without data, EMEA cannot be valued as a growth driver.
      diligencePath: >-
        Request EMEA customer count, ARR, and year-over-year growth rate; assess London office
        headcount and pipeline size.
      relatedQuestionRefs:
        - QU021

    - type: enumeration-incomplete
      severity: minor
      topic: named-customers
      missingEvidence: >-
        Production deployment details and outcomes for most of the 3,000+ organizations Awardco
        serves; currently only 7 named customers have any public deployment information.
      whyItMatters: >-
        The published case study universe represents less than 2% of the stated customer base;
        named customer proof cannot be extrapolated to characterize the full portfolio.
      diligencePath: >-
        Request segmented list of top-50 customers by ARR with tenure and renewal history;
        cross-reference Bloomberry tracker for recent additions.
      relatedTableRefs:
        - TU003
      relatedQuestionRefs:
        - QU003

    - type: missing-source
      severity: minor
      topic: competitor-comparison
      missingEvidence: >-
        Independent head-to-head comparison of Awardco customer satisfaction scores and retention
        metrics against Workhuman, O.C. Tanner, and Achievers.
      whyItMatters: >-
        Without benchmarking Awardco's 4.9/5 G2 rating and 99% plan-to-renew against competitor
        profiles, relative competitive position on retention cannot be assessed.
      diligencePath: >-
        Obtain G2 and Gartner Peer Insights comparison reports for Workhuman, O.C. Tanner, and
        Achievers; ask Awardco for win/loss analysis and competitive retention data.
      relatedQuestionRefs:
        - QU021

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      TU003 Named Customer Proof Table includes coverage and source caveats in both the
      enumerationScope.basis and the table-level notes field; notes is populated with
      explicit provenance and limitation information.
  - dimension: figureType
    reason: >-
      The planned cohort figure type was substituted with a kpi figure (FU004) because Awardco
      does not disclose NRR, GRR, or retention time-series data in any public source; three of
      the four planned figure types are rendered (journey-map, funnel, matrix).
