callouts:
  - calloutType: strength
    title: Deep Enterprise Named-Customer Proof at Scale
    body: >-
      Awardco's published case studies span multiple Fortune 500 enterprises (Hertz, AT&T, Adobe)
      and quantified mid-market deployments (4Refuel, Crumbl, Texas Roadhouse) across diverse
      verticals. The 4Refuel turnover reduction (24.6% YoY) and RIF improvement (55%) are
      exceptionally concrete outcomes rarely seen in recognition-platform marketing.
    claimRefs:
      - CU004
      - CU017
      - CU038
      - CU003
  - calloutType: risk
    title: Absence of Financial Retention Metrics Is a Material Diligence Gap
    body: >-
      No NRR, GRR, or logo-churn data is publicly available. The 99% Plan-to-Renew survey signal
      is encouraging but is a user sentiment proxy, not a contractual financial metric. Without
      cohort data, evaluating the durability of the installed base is impossible from external
      sources alone.
    claimRefs:
      - CU030
      - CU031
      - CU025
  - calloutType: risk
    title: Case Study Outcomes Unverified and Process-Metric Focused
    body: >-
      Every quantified customer outcome published by Awardco originates from Awardco's own case
      study pages without third-party corroboration. The R&R Network has explicitly criticized
      the Hertz case study for focusing on process metrics rather than strategic financial outcomes.
      This creates a risk that enterprise buyers with ROI-based procurement may not renew without
      deeper outcome evidence.
    claimRefs:
      - CU028
      - CU029
      - CU042

