  - id: buyer-segmentation
    title: "Buyer, user, payer, and adoption path"
    body: >-
      The employee recognition and rewards buyer map is primarily HR-led but finance-validated and increasingly IT-
      reviewed. Awardco's typical buyer is an HR leader—VP of HR, CHRO, Director of People Operations, or Employee
      Experience Manager—who owns the recognition program budget and is evaluated on retention, engagement scores, and
      cultural cohesion. For enterprise accounts, the Economic Buyer is often at the CHRO or CPO level; Finance reviews
      program ROI, reward budget utilization, and per-employee spend; IT evaluates HRIS integration security, SSO
      compliance, and data governance. Users are employees across all segments; in many deployments managers are also
      power users who originate recognitions, while HR admins run administrative workflows.

      Mordor Intelligence's segmentation shows large enterprises holding 63.55% of the recognition platform market in
      2025, with SMEs growing fastest at a 13.23% CAGR through 2031. Fortune Business Insights reports a similar
      split, with large enterprises at 55.10% of the engagement software market in 2026. Awardco earns G2 Leader
      placements across Enterprise, Mid-Market, and Small Business segments, confirming multi-segment positioning, but
      the pricing evidence (enterprise tiers starting at USD 50,000–150,000 annually per Vendr) suggests enterprise
      and mid-market are the higher-value accounts.

      Adoption triggers vary by segment. For enterprise accounts, the trigger is often a failed legacy program (manual
      service awards, swag catalogs with high markups), a merger or acquisition that requires consolidating multiple
      recognition tools, or a retention crisis that prompts HR to justify recognition ROI to the CFO. For mid-market
      accounts, the trigger is more often growth-stage scaling—a company crossing 200–500 employees where manual
      recognition breaks down and distributed teams require a platform solution. SMB adoption is often driven by a
      single HR manager seeking a more professional alternative to ad hoc Amazon gift card emails or handwritten notes.

      The IRF's 2026 Industry Outlook confirms that 65% of North American programs expect growth in participant counts
      despite flat budgets, and 62% expect program technology budgets to increase. This is the most direct third-party
      evidence that the buyer base is expanding even under economic pressure. GoProfiles' State of HR 2026 survey found
      more than 80% of HR organizations prioritizing technology upgrades in 2026, with engagement and recognition among
      the highest-priority categories.
