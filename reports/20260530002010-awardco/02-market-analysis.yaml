callouts:
  - calloutType: strength
    title: Zero-markup Amazon catalog creates a durable buyer advantage
    body: >-
      Awardco's Amazon Business partnership, dating to 2017, gives it access to 300 million reward options with zero
      markups, customs fees, or import taxes across 135 countries. Competitors that charge 10–30% markups on reward
      items give budget-conscious HR buyers a direct financial incentive to move. This structural cost advantage
      compounds as reward budgets grow with headcount.
    claimRefs:
      - CM006
      - CM007
      - CM008

  - calloutType: risk
    title: Recognition platforms face a structural critique that software cannot fix disengagement
    body: >-
      Forbes columnist Aparna Rao's May 2026 analysis of Gallup's 2026 engagement findings argues that disengagement
      is a structural system failure, not a recognition deficit—and that platforms addressing symptoms without system
      redesign will not deliver durable ROI. If this framing gains traction with CFOs, budget allocation for
      standalone recognition tools will face intensified scrutiny, compressing growth in the exact market Awardco
      depends on.
    claimRefs:
      - CM041
      - CM042
      - CM043

  - calloutType: insight
    title: SAM cannot be isolated from public sources; internal ARR per user is the only path
    body: >-
      Public estimates range from USD 1.13 billion (platform software) to USD 23.7 billion (full system including
      hardware and services) for the 2026 market. Neither bound cleanly defines Awardco's SAM. The only rigorous
      path to SAM estimation is Awardco's disclosed ARR, customer count, and average contract value by segment,
      which would allow a bottom-up cross-check against Mordor's bottom-up platform estimate.
    claimRefs:
      - CM017
      - CM018
      - CM019
      - CM022

