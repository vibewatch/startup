chapter:
  number: 7
  title: Risks
  summary: >-
    Awardco's risk profile is dominated by three structural concerns: single-vendor dependency
    on Amazon Business for its entire rewards catalog and fulfillment, an active multi-month
    phishing campaign (Mimecast MCT03028) exploiting brand trust since May 2025, and expanding
    GDPR/CCPA 2026 regulatory obligations requiring mandatory cybersecurity audits and AI
    decision-making transparency. Secondary risks include Workday+Achievers' April 2026 native
    HCM integration threatening standalone positioning, Sonnenberg family key-person
    concentration across all three C-suite roles, and documented third-party prepaid card
    fulfillment failures. Security certifications (SOC2 Type II, ISO 27001, HIPAA, FedRAMP)
    are strong, no confirmed data breach or regulatory enforcement was identified, and the
    overall UpGuard security score of 91/100 indicates a well-managed external attack surface.

sections:
  - id: security-cyber-risk
    title: Security and Cyber Risk
    body: >-
      Awardco holds a broad array of security certifications including SOC2 Type II, ISO 27001,
      HIPAA, PCI, GDPR, CCPA/CPRA, FedRAMP, and CSA Star Level 1, as confirmed by the
      company's published security and compliance page and Nudge Security's independent
      vendor risk profile. UpGuard's continuous monitoring rates Awardco's external security
      posture at 91/100, and Site24x7 independently rates it at 94/100 (grade A) as of May
      2026. No publicly confirmed data breach or security incident involving Awardco has been
      identified in UpGuard's monitoring, Nudge Security assessments, or major news sources
      reviewed through May 30, 2026.

      The most acute documented cyber risk is a sophisticated brand impersonation and
      phishing campaign attributed by Mimecast's Threat Research team to threat operation
      MCT03028. Active since May 2025 and continuing into 2026, the campaign targets entire
      organizations by exploiting employees' universal expectation of legitimate Awardco
      reward notifications. The operation employs multi-stage redirect chains, QR code
      delivery, SMS distribution, and abuse of legitimate security services (AWS SES, Sophos,
      HubSpot, Google Sites) to evade detection. ANY.RUN's malware sandbox independently
      confirmed malicious phishing activity associated with awardco.com-spoofing domains.
      Guard.io placed Awardco among brands actively impersonated in Q1 2026. While Awardco's
      own platform is not compromised, brand phishing erodes end-user trust, can result in
      credential theft at client organizations, and may create reputational liability.
      Awardco's SOC operations center, incident response plan, and TLS 1.3/AES 256
      encryption mitigate breach impact, but no vendor can fully prevent third-party brand
      impersonation campaigns.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
