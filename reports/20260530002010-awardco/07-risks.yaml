callouts:
  - calloutType: risk
    title: "Amazon Dependency — Thesis-Break Risk"
    body: >-
      The Amazon Business partnership is both Awardco's greatest competitive moat and its
      most concentrated single-point-of-failure risk. Any unilateral Amazon action to
      restructure, restrict, or terminate the partnership would simultaneously eliminate the
      platform's primary differentiator and strand reward redemption for millions of active
      users. The March 2026 BSA Agent Policy introduces an explicit kill-switch provision.
      Diligence must confirm contract term, exclusivity provisions, and fallback catalog
      capacity.
    claimRefs:
      - CR017
      - CR021
      - CR022

  - calloutType: risk
    title: "2026 CCPA/GDPR Regulatory Uplift"
    body: >-
      CCPA 2026 regulations effective January 1, 2026 introduce new cybersecurity audit
      obligations, AI ADMT disclosure requirements, and multi-state enforcement sweeps.
      Awardco's AI recognition layer and 163-country PII processing footprint create material
      regulatory surface area. The cost of non-compliance is estimated at 5 to 10 times the
      cost of compliance for mid-sized companies, making proactive investment clearly
      preferable. Diligence should confirm Awardco's ADMT governance framework and 2026
      CCPA audit timeline.
    claimRefs:
      - CR009
      - CR013
      - CR015

  - calloutType: recommendation
    title: "Key Diligence Asks Before Close"
    body: >-
      (1) Amazon Business partnership contract: term, exclusivity provisions, change-control
      notice period, and API fallback capabilities. (2) CCPA 2026 audit plan and ADMT
      governance documentation for Awardco Intelligence. (3) Founder succession plan and
      key-person insurance. (4) Series B governance rights, preference stack, and Sixth
      Street instrument terms. (5) NRR, gross margin, and burn rate for FY2025 and FY2026.
    claimRefs:
      - CR022
      - CR034
      - CR038
      - CR049

