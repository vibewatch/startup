  - id: financial-governance-risk
    title: Financial and Governance Risk
    body: >-
      Awardco reported approximately $75.2M ARR in 2024 (73% YoY growth from $43.4M in
      2023) per LATKA data and raised $165M Series B in March 2025 at a $1B+ valuation.
      The company self-describes as cash-flow positive, but no audited financials, NRR, gross
      margin, CAC, or burn rate have been disclosed for FY2025 or FY2026, limiting independent
      assessment of capital adequacy and unit economics quality post-Series B. Revenue per
      employee, estimated at approximately $178K in 2026, is above median for B2B SaaS at
      this stage, consistent with a high-margin subscription model, but this is an estimated
      figure absent audited data.

      Investor governance risk arises from the $235M raised across General Catalyst (Series A
      lead), Spectrum Equity, and Sixth Street Growth (Series B). Governance rights, board
      composition, preference overhang, and liquidation provisions are not publicly disclosed.
      Sixth Street Growth is a credit-oriented growth investor whose instruments may carry
      structured terms that affect future financing flexibility or exit optionality. FedRAMP
      compliance opens US federal market access but introduces heightened annual
      authorization-to-operate maintenance costs. The combination of private-company opacity,
      undisclosed governance terms, and AI feature expansion into regulated ADMT territory
      creates a layered financial and compliance risk that warrants direct due diligence
      confirmation.
    claimRefs:
      - CR037
      - CR038
      - CR039
      - CR040
      - CR042
      - CR049
