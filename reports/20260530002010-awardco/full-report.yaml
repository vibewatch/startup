          detail: >-
            Enterprise SaaS B2B acquisition via direct sales, SDR outreach, and channel/partner referrals. Industry
            benchmarks for HR tech range $10K–$50K blended CAC at this stage; Awardco has not disclosed its figure.
        - label: 'Initial contract signed (ACV: ~$37K SMB / ~$201K enterprise)'
          detail: >-
            Annual contract value is the unit revenue per customer per year. Enterprise tier dominates ARR; SMB
            contracts provide breadth. Source: SpendHound anonymized deal benchmarks (not company-confirmed).
        - label: Annual gross margin per contract (~70–85% estimated)
          detail: >-
            High-margin SaaS platform with zero reward fulfillment COGS. Gross contribution per contract estimated at
            $26K–$170K for enterprise ACV at midpoint gross margin; exact figure requires audited disclosure.
        - label: 'Net Revenue Retention (NRR: not disclosed)'
          detail: >-
            Investor commentary implies above-market NRR through upsell and expansion. A 115–130% NRR assumption is
            consistent with top-quartile B2B SaaS but is unverified for Awardco specifically.
        - label: CAC payback period (estimated 12–24 months)
          detail: >-
            Estimated from ACV and gross margin benchmarks; not verified. A 18-month payback is typical for enterprise
            SaaS at this scale. Confirmation requires CAC disclosure.
      edges:
        - from: 'Customer acquisition (CAC: not disclosed)'
          to: 'Initial contract signed (ACV: ~$37K SMB / ~$201K enterprise)'
          label: Conversion to paid contract
        - from: 'Initial contract signed (ACV: ~$37K SMB / ~$201K enterprise)'
          to: Annual gross margin per contract (~70–85% estimated)
          label: Revenue recognition at contract close
        - from: Annual gross margin per contract (~70–85% estimated)
          to: CAC payback period (estimated 12–24 months)
          label: Time to recoup acquisition cost
        - from: Annual gross margin per contract (~70–85% estimated)
          to: 'Net Revenue Retention (NRR: not disclosed)'
