  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing
        blocks:
          - type: paragraph
            body: >-
              Awardco generates revenue almost exclusively through SaaS platform subscription fees charged to employer
              clients based on active user count, program configuration, and contract term. The company does not publish
              a price list; all contracts are custom-quoted. Pricing research aggregators document SMB annual contract
              values averaging approximately $37,251 and enterprise contract values averaging approximately $200,724,
              with the full range spanning roughly $12,000 to $250,000+ annually depending on user count and feature
              tier. ITQlick places starting per-user cost at $50/user/month for indicative purposes; Vendr's dataset
              corroborates that buyers who anchor to competitive benchmarks routinely achieve 15–30% discounts off
              initial proposals.

              Platform tiers are informally described as Core (basic milestone and service awards), Plus (spot
              recognition and automation), and Pro/Enterprise (full suite with global support, advanced HRIS
              integrations, and AI features). No free trial is offered; there is no free version. Pricing opacity is an
              identified friction in competitive evaluations—prospects must complete a sales cycle before receiving any
              cost indication.

              A critical structural feature is Awardco's zero-markup rewards model: employees redeem points against
              Amazon Business inventory at Amazon's native price, with no Awardco surcharge. This removes a historical
              industry-wide hidden-cost practice and is a stated competitive differentiator. Awardco monetizes the
              platform subscription only, not the reward spend itself. Reward budget spend is a separate line item
              funded directly by the employer client and is not recorded as Awardco revenue.
