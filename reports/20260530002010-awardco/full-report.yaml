      - number: '1.4'
        title: Scale and Operating Metrics
        blocks:
          - type: paragraph
            body: >-
              Awardco has grown to serve over 3,000 organizations globally, including Fortune 500 enterprises such as
              AT&T, Pacific Life, Adobe, and Hertz. As of the May 2025 Series B announcement, the platform reported over
              six million users across 163 countries and a marketplace of more than 300 million reward options. Hertz's
              deployment illustrates enterprise scale: the 26,000-person global workforce—80% deskless—uses Awardco for
              peer recognition, milestone tracking, and branded swag, achieving a 7.6% increase in employee Net Promoter
              Score (eNPS) year-over-year. Awardco's LinkedIn company profile listed 677 employees in May 2026,
              consistent with an estimated 34% growth in headcount during the prior twelve months. The company reports
              being cash-flow positive since founding and entering the Series B from a position of "sustained high
              growth"—a term Tanner Runia used in the announcement—though neither ARR, revenue run-rate, nor gross
              margin have been publicly disclosed. Capterra shows over 4,616 verified user reviews with an aggregate
              rating of 4.9 out of 5, and G2 named Awardco a Leader in Enterprise, Mid-Market, and Small Business
              segments across its Spring 2026 reports, awarding 23 designations. Expert review sites identify the
              platform's minimum annual fee at $2,500 but note that detailed pricing requires vendor engagement.
