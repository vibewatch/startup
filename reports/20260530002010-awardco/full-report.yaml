              Awardco's management confirmed a cash-flow-positive business at the time of the $165M Series B close
              (March 2025), an unusual position for a company still growing ARR at ~73% YoY. This suggests disciplined
              unit economics and a self-sustaining revenue engine. The Series B appears to be an accelerant raise rather
