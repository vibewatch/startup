      - number: '7.5'
        title: Operational and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              Awardco's headcount grew approximately 34% year-over-year to an estimated 629 to 677 employees as of early
              2026, a pace that introduces organizational scaling risks: culture dilution, process fragmentation,
              quality control in customer success, and onboarding execution quality. The company has tripled in size
              since its Series A in 2021 and is deploying $165M in Series B capital. At this growth velocity,
              operational discipline risks including mid-market versus enterprise segmentation clarity, geographic
              expansion execution into EMEA, and AI feature parity maintenance are material execution variables.

              Founder key-person concentration is the most acute people risk. Steve Sonnenberg (CEO), Mike Sonnenberg
              (CTO), and Tanner Runia (President) hold all three co-founder C-suite roles simultaneously with no
              publicly disclosed succession plan, non-compete arrangements, or key-person insurance. Departure of any
              founder, particularly Steve (external face) or Mike (technical architecture), would risk investor
              confidence, customer relationship continuity, and product roadmap execution. User reviews across Capterra,
              Software Advice, and Software Finder consistently identify reporting complexity, UI/UX inconsistencies,
              initial setup complexity, and unpredictable pricing as friction points that create churn risk and lengthen
              new enterprise deployment cycles. The third-party prepaid card fulfillment layer creates reputational
              spillover when fulfillment failures are attributed to Awardco rather than the card issuer.
            claimRefs:
              - CR030
              - CR031
              - CR032
              - CR033
