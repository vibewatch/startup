      - number: '8.4'
        title: Exit Readiness and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Awardco's exit readiness is moderate. The company has the scale ($100M+ ARR), institutional investor
              quality (Sixth Street, Spectrum Equity, General Catalyst), and brand recognition (3,000+ enterprise
              customers, Fortune 500 names) necessary to attract acquirers. Likely strategic acquirers include: (1) HCM
              platforms (Workday, SAP SuccessFactors, Oracle HCM) seeking to add recognition without building from
              scratch; (2) broader HR tech consolidators (ADP, Ceridian/Dayforce) scaling their employee experience
              stack; (3) incentive and reward marketplaces (Achievers' PE-backed buyer, Blackhawk Network) seeking
              platform scale. Financial sponsors could pursue a secondary transaction if growth remains above 25% and
              the company approaches Rule of 40 compliance. A stand-alone IPO is feasible but unlikely before 2027–2028
              given the depressed public SaaS environment and the lack of full financial disclosure infrastructure. The
              critical unresolved diligence items are: (1) audited financial statements confirming ARR, gross margin,
              and NRR — metrics that would anchor any valuation model; (2) the precise terms and duration of the Amazon
              Business exclusivity agreement and revenue-sharing mechanics; (3) cohort-level customer retention data to
              support or refute the implied NRR above 110%; (4) concentration: what percent of ARR comes from the top 10
              customers, and whether any single customer represents more than 5% of ARR; (5) cap table and preference
              stack, including any liquidation preferences, anti-dilution provisions, or special rights granted in
              Series B that would impair common equity returns in a sub-$1B exit. The valuation stance is STRETCHED: the
              business quality is high, but entry at or above $1B in a compressed-multiple environment requires evidence
              of sustained growth and undisclosed financial quality metrics to justify the premium.
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
