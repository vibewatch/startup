      - number: '7.3'
        title: Partner and Technology Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              Awardco's core value proposition—zero-markup access to 300M+ reward options in 180+ countries—is
              structurally dependent on its exclusive partnership with Amazon Business, initiated in 2017. This
              partnership underpins the platform's primary differentiator; if Amazon were to terminate or materially
              restructure the relationship, Awardco would lose its entire catalog advantage and would need to urgently
              develop alternative reward sourcing. No public evidence of contractual exclusivity protections, minimum
              commitment terms, or change-control provisions in the Awardco-Amazon partnership has been identified. The
              September 2024 announcement of enhanced Integrated Ordering API capabilities signals deepening
              integration, which simultaneously strengthens the offering and deepens the dependency.

              Amazon's 2026 SP-API policy changes introduce incremental risk: starting January 31, 2026, all third-party
              SP-API developers pay an annual $1,400 subscription fee, and from April 30, 2026, usage-based fees of
              $0.40 per 1,000 GET API calls apply. The BSA Agent Policy, effective March 4, 2026, requires all automated
              tools accessing Amazon Services to identify as agents and cease access immediately if Amazon demands it, a
              kill-switch provision with no preceding notice obligation. While these changes primarily target e-commerce
              SaaS developers, Awardco's Integrated Ordering API dependency means any tightening of Amazon's partner
              terms directly affects platform operations. Third-party prepaid card issuers (MyPrepaidCenter, Tango)
              handle non-Amazon reward fulfillment; user complaints on ComplaintsBoard and BBB document card activation
              failures, vanishing balances, and poor resolution experiences, creating customer satisfaction and
              reputational risk in non-Amazon reward redemption flows.
            claimRefs:
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
          - type: table
            tableRef: TR003
