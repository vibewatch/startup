              The company characterizes its business as cash-flow positive with "sustained high growth" as of the Series
              B close. If accurate, this implies the $165M raise was an accelerant rather than a survival raise—the
              intended uses are product innovation (AI features, HRIS integrations), international expansion (EMEA,
              London office), and headcount growth in engineering and customer success. No debt or project-finance
              obligations are publicly disclosed.

              Absent audited financials, estimated monthly burn cannot be verified. With ~636 employees and B2B SaaS
              cost norms (payroll 65–75% of burn, all-in cost per employee $150–$200K/year), an illustrative monthly
              burn range of $8M–$12M is directionally plausible—implying a 13–21 month runway against the $165M raised,
              before accounting for ongoing revenue cash inflows. The cash-flow-positive characterization suggests
              operating cash burn may be materially lower than this illustrative gross spend, but the precise net burn
              is undisclosed. Round-by-round funding chronology should be referenced from the Company Overview chapter;
