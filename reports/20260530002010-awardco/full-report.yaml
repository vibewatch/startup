  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: included and excluded spend'
        blocks:
          - type: paragraph
            body: >-
              Awardco's product and go-to-market materials frame the company as a culture engine spanning employee
              recognition, rewards, incentives, and engagement analytics. The included spend therefore covers software
              and services that sit directly on the employee reward and recognition workflow: peer-to-peer recognition
              programs, service and milestone award automation, top-down spot awards, performance-based incentives,
              lifestyle spending accounts (LSAs), and the reward catalog infrastructure (gift cards, merchandise,
              experiences) that fulfills those programs. Awardco's Amazon Business partnership and the platform's 300
              million reward options across 135 countries make catalog breadth a core part of the spend boundary.

              The excluded spend is equally important. Awardco does not compete with core HRIS, payroll processing, ERP,
              or standalone survey platforms, although it integrates with all of them. It is not a benefits
              administration system, a learning management platform, or a pure corporate travel management tool. The
              status-quo substitutes that Awardco displaces most directly are manual reward processes (gift card
              spreadsheets, manual service award orders, procurement-driven swag purchases), standalone recognition
              tools with narrow catalog options, and in some enterprise accounts, Workhuman or Achievers. Indirect
              substitutes include recognition features bundled inside Microsoft Viva, SAP SuccessFactors, or Workday,
              though Awardco positions itself as a deeper, more flexible partner rather than a generic HCM add-on.

              The clearest evidence of included spend is Awardco's own homepage claim of 3,000+ global customer
              organizations and the G2 Spring 2026 recognition across Employee Engagement, Employee Recognition, Rewards
              and Incentives, and Lifestyle Spending Accounts categories. Adjacencies include corporate gifting (a USD
              359 billion global market), but Awardco's SAM is the software and services layer, not the full face value
              of rewards spent. MarkWide Research sized the employee recognition and reward system market—hardware plus
              software combined—at USD 23.7 billion in 2026, while Mordor Intelligence sizes the platform software
              sub-segment at USD 1.13 billion in 2026, showing that the software monetization layer is roughly 5% of
              total program spend.
