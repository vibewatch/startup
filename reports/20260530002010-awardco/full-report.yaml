      - number: '1.5'
        title: Key Milestones and Strategic Events
        blocks:
          - type: paragraph
            body: >-
              Awardco's chronological record spans from its 2012 bootstrap founding through a series of financing,
              product, partnership, and adverse-adjacent events. The Amazon Business partnership, launched in 2017, is
              the single most consequential strategic event in the company's history: it provided Awardco with an
              exclusive differentiation vector— access to the world's largest consumer product catalog at zero
              markup—that competitors have struggled to replicate. The October 2021 Series A transformed Awardco from a
              largely unknown bootstrapped company into a near-unicorn HR SaaS firm. The May 2025 Series B crossed the
              $1 billion valuation threshold, expanding the company's brand, talent acquisition appeal, and global
              infrastructure ambitions. A significant adverse- adjacent event surfaced in August 2025 when cybersecurity
              firm Mimecast published research identifying a multi-month phishing campaign launched in May 2025 that
              impersonated Awardco's platform across email and QR codes, attributed to threat operation MCT03028. While
              the campaign reflects external actors and not Awardco's own conduct, it introduces brand-trust risk:
              employees at customer organizations may become wary of legitimate Awardco communications, and
              organizations may face liability for credential theft traced to Awardco-themed lures. On the product
              front, Awardco launched Awardco Intelligence—its AI motivation suite—on May 14, 2026, and received a
              Bronze Stevie Award for Product Innovation from the American Business Awards on May 15, 2026. The RCGNZ
              Summit, Awardco's flagship HR tech event, is scheduled for November 9–11, 2026, at Montage Deer Valley in
              Park City, Utah.
