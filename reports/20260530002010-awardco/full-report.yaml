      - number: '7.2'
        title: Regulatory and Privacy Risk
        blocks:
          - type: paragraph
            body: >-
              Awardco operates across 163 countries and processes employee personally identifiable information (PII) on
              behalf of 3,000+ employer clients, creating a multi-jurisdiction privacy compliance obligation. The CCPA
              2026 regulations, finalized September 23, 2025 and effective January 1, 2026 with no initial grace period,
              introduce mandatory cybersecurity audits, formal risk assessment protocols, and automated decision-making
              technology (ADMT) oversight—all relevant to Awardco's AI-powered recognition layer (Awardco Intelligence).
              As of March 2026, over 20 US states have comprehensive privacy laws, with Indiana, Kentucky, and Rhode
              Island joining in January 2026 and requiring Data Protection Impact Assessments for covered processing
              activities. California's DROP platform, effective August 1, 2026, requires covered data brokers to process
              deletion requests within 45 days. O'Melveny's 2026 privacy compliance checklist identifies AI training
              data use, automated decision-making transparency, and multi-state opt-out compliance as primary
              enforcement priorities.

              Awardco claims GDPR compliance and publishes mechanisms for Data Subject Access Requests (DSARs) including
              right-to-erasure, with a Data Processing Agreement available upon request. The company's security and
              compliance page confirms GDPR, CCPA/CPRA, and ISO 27001 certification. However, Awardco's AI recognition
              scoring features may require explicit ADMT disclosure documentation under 2026 CCPA rules, and the annual
              cybersecurity audit obligations for California-covered businesses come into effect on staggered timelines
              through 2030. GDPR non-compliance fines have exceeded 5.5 billion euros cumulatively through 2025;
              potential fines reach up to 4% of global annual turnover. The ongoing patchwork of US state privacy laws
              creates a compliance maintenance burden that scales with Awardco's geographic footprint and headcount
              growth.
            claimRefs:
              - CR009
              - CR010
