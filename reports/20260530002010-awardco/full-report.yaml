  - id: FI001
    title: Revenue Model Bridge
    type: flow
    layout: standard
    summary: >-
      How employer clients convert recognition budgets into Awardco platform fee revenue and gross profit, with Amazon
      Business handling reward fulfillment at zero markup.
    approximationNotes: >-
      This is a qualitative structural diagram. Node labels are directional; no specific dollar amounts are attributed
      because gross margin and COGS are undisclosed. Revenue figures in nodes are company-reported or estimated ranges,
      not audited.
    claimRefs:
      - CI001
      - CI002
      - CI019
      - CI016
      - CI038
    data:
      nodes:
        - label: Employer client signs annual SaaS contract
          detail: >-
            Contract value ranges $12K–$250K+ annually based on user count and tier. No free trial; no self-serve
            signup. Requires sales engagement and custom quote.
        - label: Platform subscription fee collected (Awardco revenue)
          detail: >-
            Annual platform fee is Awardco's primary revenue stream. SMB avg ~$37K; enterprise avg ~$201K per SpendHound
            benchmarks. Reward budget is separate and not recorded as Awardco revenue.
        - label: Employees earn and redeem recognition points
          detail: >-
            Employees redeem points via the Awardco platform against 300M+ Amazon Business products, gift cards, and
            experiences. Awardco charges zero markup on Amazon rewards; redemption is pass-through at Amazon's native
            price.
        - label: Amazon Business fulfills reward orders (zero markup)
          detail: >-
            Amazon Business handles inventory, logistics, and shipping globally. Awardco incurs no fulfillment COGS.
            Free shipping; no import fees for international orders in supported markets.
        - label: Gross profit generated from platform fee
          detail: >-
            Gross margin estimated 70–85% based on SaaS HR tech benchmarks (High Alpha 2025). Primary costs are
            engineering, customer success, and cloud infrastructure. Zero fulfillment overhead is the structural gross
            margin advantage.
      edges:
        - from: Employer client signs annual SaaS contract
          to: Platform subscription fee collected (Awardco revenue)
          label: Annual contract billing
        - from: Platform subscription fee collected (Awardco revenue)
          to: Employees earn and redeem recognition points
          label: Platform access and program activation
        - from: Employees earn and redeem recognition points
          to: Amazon Business fulfills reward orders (zero markup)
          label: Point redemption routed to Amazon
        - from: Platform subscription fee collected (Awardco revenue)
          to: Gross profit generated from platform fee
          label: Revenue minus platform COGS
  - id: FI002
    title: Unit Economics Bridge
    type: flow
    layout: standard
    summary: >-
      Qualitative unit economics chain from customer acquisition through LTV realization; most values are unavailable
      and flagged as diligence gaps.
    approximationNotes: >-
      All node values are qualitative or estimated from industry benchmarks; no company- disclosed CAC, NRR, LTV, or
      churn data exists. Ranges cited are SaaS HR tech comparables, not Awardco actuals. This diagram is intended to map
      the chain of required inputs, not to quantify outcomes.
    claimRefs:
