      - number: '1.3'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Awardco operated as a bootstrapped, cash-flow-positive business from its 2012 founding through October
              2021 without raising outside capital—a feat its lead Series A investor Paul Kwan of General Catalyst
              compared to the early growth trajectories of Atlassian and Qualtrics. The first institutional round was a
              $65 million Series A announced October 28, 2021, led by General Catalyst and angel investor Ryan Smith
              (Qualtrics co-founder, Utah Jazz majority owner, and partner at HXCO), valuing the company at over $900
              million—at the time the largest Series A in HR SaaS history. The company described the round as advancing
              its vision to become "the marketplace for the world's loyalty and incentive spend." The second and most
              recent round was a $165 million Series B closed and announced May 20, 2025, co-led by Sixth Street Growth
              and Spectrum Equity, with continued participation from General Catalyst and Ryan Smith, valuing Awardco at
              over $1 billion. The capital was designated to expand the engagement and performance platform, invest in
              AI capabilities, deepen HRIS integrations, and scale global infrastructure. Total known capital raised
              stands at approximately $235 million. Goodwin Law LLP (led by John Casnocha, Arman Carretta, and Christian
              Golden) served as legal counsel for Awardco in the Series B. No secondary transactions, convertible notes,
              debt facilities, or Series C pipeline disclosures have been identified in public sources; these represent
              open diligence paths.
