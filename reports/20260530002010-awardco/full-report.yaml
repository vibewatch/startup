      - number: '5.5'
        title: Differentiation, IP, and Competitive Moat
        blocks:
          - type: paragraph
            body: >-
              Awardco's primary competitive moat is contractual and network-based: it is the only employee recognition
              platform to hold a featured partner status with Amazon Business, a relationship formed in 2017 that grants
              access to Amazon's Integrated Ordering API and the full Amazon Business catalog at zero markup.
              Competitors cannot replicate this partnership without Amazon's consent, making it a durable barrier as
              long as the exclusivity holds. The platform also claims a proprietary Motivation Graph—a longitudinal
              behavioral dataset accumulated over a decade across thousands of organizations—that is intended to
              underpin the Awardco Intelligence AI roadmap. This dataset, if genuine, would constitute a meaningful data
              moat; however, its architecture, accuracy, and the degree to which it drives measurably better outcomes
              versus generic ML models has not been independently verified. Additional differentiation includes the dual
              mobile strategy (native app + PWA) that competitors lack; multi-currency, multi-country support across 135
              countries and 163 currencies; 1:1 point-to-dollar value with no redemption fees; and an open API with
              documented third-party integrations (Domo, ScreenCloud, Okta, Workday). The platform's architecture
              explicitly avoids becoming a system of record—it is designed to integrate with rather than displace HRIS
              vendors, reducing the sales barrier and the scope of competition with incumbents like Workday and SAP
              SuccessFactors.
