      - number: '5.6'
        title: Trust, Security, and Compliance
        blocks:
          - type: paragraph
            body: >-
              Awardco holds a SOC 2 Type II certification covering all five Trust Services Criteria: Security,
              Availability, Processing Integrity, Confidentiality, and Privacy. The certification attests to the
              operating effectiveness of controls over a multi-month audit period, not just their design, providing
              enterprise buyers with assurance on data handling practices. Data in transit is protected via TLS 1.2 and
              data at rest via AES 256-bit encryption. Authentication supports SSO (SAML 2.0, compatible with Okta,
              Azure AD, CyberArk, RSA SecurID), multi-factor authentication (MFA), and one-time passwords (OTP). A
              Security Operations Center provides 24/7 threat monitoring. Awardco's AI design principles explicitly
              state that the platform does not train on user-identifiable or client-specific organizational data,
              addressing a common enterprise concern about AI platforms ingesting sensitive employee information. The
              SOC 2 report is available to clients on request through the RFP process. Significant diligence gaps
              remain: uptime SLA and historical reliability metrics are not publicly published, data-residency options
              for GDPR-regulated EU customers are not documented on public surfaces, and there is no publicly visible
              security.txt, bug bounty program, or penetration test disclosure. The platform has not published any
              significant outage post-mortems, but absence of public disclosure does not confirm absence of incidents.
