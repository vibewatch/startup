      - number: '8.3'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              The bull case hinges on Awardco sustaining 40%+ ARR growth through 2027, crossing $200M ARR, maintaining
              cash-flow-positive operations, and pursuing an IPO or strategic sale at 8–10x forward ARR — producing a
              3–4x return on the $1B entry price (implied exit $3–4B). This scenario requires: (1) continued exclusive
              Amazon partnership, (2) successful EMEA expansion through the London office, (3) AI differentiation
              (Awardco Intelligence) driving upsell and NRR above 120%, and (4) no disruptive HCM bundling. The base
              case models 25–35% ARR growth per year through 2027, reaching $150–180M ARR by 2027, with an exit at 6–8x
              forward ARR producing a $1.2–2B outcome — effectively a 1.2–2x return on the $1B baseline, which is below
              typical private equity hurdle rates. This scenario is a watch-and-track position: the business compounds
              value but does not produce venture-level returns at today's price. The bear case models growth
              deceleration below 20% CAGR (consistent with a significant competitive displacement or Amazon partnership
              disruption), reaching only $100–120M ARR by 2027 with multiples compressing to 4–5x — implying an exit
              value of $500–700M and a meaningful loss of principal for investors who entered at $1B+. The primary
              transmission path is Amazon renegotiating partnership terms or entering the recognition software market
              directly, which would strip the core differentiation and force Awardco to compete on features and price
              alone against better-capitalized HCM bundlers. Sensitivity analysis on the ARR multiple shows that the
              entry price is only IRR-positive at 8–12% discount rate under the base case if Awardco sustains
              above-market growth for at least three years. This makes growth rate the single most important driver of
              valuation outcomes — more than margin improvement or geographic expansion.
            claimRefs:
              - CV020
