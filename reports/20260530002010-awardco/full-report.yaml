      - number: '1.2'
        title: Founders and Leadership Team
        blocks:
          - type: paragraph
            body: >-
              Awardco was co-founded by three individuals who continue to hold senior operational roles: Steve
              Sonnenberg (Co-Founder and CEO), Mike Sonnenberg (Co-Founder and CTO), and Tanner Runia (Co-Founder and
              President). Steve Sonnenberg, the public face of the company, has driven the vision of making employee
              recognition a strategic business function rather than a periodic HR courtesy. He has stated that
              "recognition has not changed in 100 years" and positioned Awardco as the transformative alternative. Mike
              Sonnenberg leads the engineering and product technology roadmap. Tanner Runia oversees day-to-day
              operations and has championed the Series B narrative around Awardco's cash-flow-positive model. The
              executive layer also includes Isaiah Bryson (COO) and John Richards (CFO), per third-party organizational
              data from Craft.co. The co-founder trio's continued presence in C-level roles signals founder-led
              stability but also introduces key-person concentration risk, particularly around Steve Sonnenberg, whose
              external representation and vision ownership are deeply embedded in customer and investor communications.
              No material leadership changes have been identified from public sources in the run-to-date period. The
              company has grown from effectively a bootstrapped operation to a 677-person organization—a 34% headcount
              increase in the prior year per aggregated estimates—which poses organizational scaling risk typical of
              fast-growing private-stage HRTech companies.
