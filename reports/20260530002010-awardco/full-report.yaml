      - number: '5.2'
        title: Platform Architecture and Integration Ecosystem
        blocks:
          - type: paragraph
            body: >-
              Awardco's technical architecture centers on a cloud-hosted SaaS platform with an integration layer that
              connects to Amazon Business via the Integrated Ordering API for real-time order placement and tracking. On
              the front-of-house side, employees interact through the web application, PWA, or native mobile apps;
              administrators manage programs, budgets, and reporting through an admin console. The platform bridges to
              enterprise systems via a documented REST API (available at api.awardco.com), a SAML 2.0 SSO layer
              compatible with Okta, Azure AD, CyberArk, and RSA SecurID, and a library of pre-built connectors covering
              major HRIS providers (Workday, BambooHR, SAP SuccessFactors, ADP), collaboration tools (Slack, Microsoft
              Teams), and analytics platforms (Domo). Awardco Connect handles custom integrations not covered by the
              standard library. The ScreenCloud connector demonstrates the developer-extensibility of the REST API:
              Awardco exposes a Custom Feed API endpoint at [company].awardco.com/settings/advanced?tab=apiSettings that
              refreshes recognition data every six minutes and supports metadata filtering so recognitions can be routed
              to specific office displays. Amazon Business integration has evolved since its 2017 inception from a basic
              catalog link to a full Integrated Ordering API implementation delivering real-time order and tracking
              synchronization, centralized spend transparency, and hands-free fulfillment. Integration depth with HRIS
              systems is a known differentiator: Awardco imports employee records, automates milestone awards on life
              events, and supports country-specific award redemption across 135 countries. The platform operates
              globally across 163 currencies with 50+ language support for recognition and UI experiences.
            claimRefs:
