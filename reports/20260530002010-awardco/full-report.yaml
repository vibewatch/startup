        title: Exhibits
        blocks:
          - type: callout
            title: Amazon Dependency — Thesis-Break Risk
            body: >-
              The Amazon Business partnership is both Awardco's greatest competitive moat and its most concentrated
              single-point-of-failure risk. Any unilateral Amazon action to restructure, restrict, or terminate the
              partnership would simultaneously eliminate the platform's primary differentiator and strand reward
              redemption for millions of active users. The March 2026 BSA Agent Policy introduces an explicit
              kill-switch provision. Diligence must confirm contract term, exclusivity provisions, and fallback catalog
              capacity.
