    summary: >-
      Scoring across market, proof, moat, economics, risk, valuation, and evidence quality dimensions; amber items
      require diligence resolution before a BUY call.
    data:
      items:
        - label: Market Opportunity
          value: 7 / 10
          detail: $1.1–1.3B platform software TAM growing 10–15% CAGR; large adjacent engagement/incentives market
          tone: positive
        - label: Product/Platform Proof
          value: 8 / 10
          detail: 3,000+ enterprise customers; 6M+ users; 163 countries; G2 Top 100; Capterra 4.9/5 average
          tone: positive
        - label: Competitive Moat
          value: 7 / 10
          detail: >-
            Exclusive Amazon Business integration since 2017; zero-markup model no peer replicates; strong but
            single-vendor concentration
          tone: positive
        - label: Financial Quality
          value: 5 / 10
          detail: Cash-flow positive and 73% ARR growth are exceptional; NRR, gross margin, CAC all undisclosed — evidence gap
          tone: warning
        - label: Valuation Discipline
          value: 5 / 10
          detail: >-
            9–13x ARR is stretched vs. 3.6x public median; justified only by growth persistence and NRR quality
            currently unverified
          tone: warning
        - label: Risk Profile
          value: 5 / 10
          detail: Amazon single-vendor dependency; HCM bundling pressure; pricing opacity; phishing brand risk
          tone: warning
        - label: Investor Quality
          value: 9 / 10
          detail: Sixth Street Growth ($100B+ AUM), Spectrum Equity (2B fund), General Catalyst, Ryan Smith (HXCO/Qualtrics)
          tone: positive
        - label: Evidence Quality
          value: 5 / 10
          detail: >-
            No audited financials; NRR/gross margin undisclosed; all financial claims based on self-reported or
            estimated data
          tone: warning
