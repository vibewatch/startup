      - number: '2.2'
        title: 'Sizing lenses: platform software, system spend, and engagement adjacency'
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports four distinct sizing lenses for the market Awardco participates in. The narrowest
              and most directly relevant is Mordor Intelligence's employee recognition and rewards platform market,
              which places the platform-software sub-segment at USD 1.01 billion in 2025 and USD 1.13 billion in 2026,
              growing to USD 1.84 billion by 2031 at a 10.24% CAGR. This is the most defensible TAM for Awardco's direct
              product offering because it bounds the estimate to SaaS and platform fees rather than total reward
              redemption spend.

              The second lens, Mordor Intelligence's employee engagement market, encompasses a broader functional scope
              including surveys, pulse tools, and analytics alongside recognition. Mordor sizes this at USD 1.10 billion
              in 2025 and USD 1.27 billion in 2026, growing to USD 2.58 billion by 2031 at a 15.28% CAGR. Fortune
              Business Insights, using a similar but not identical scope, sizes the employee engagement software market
              at USD 1.43 billion in 2026 and USD 4.47 billion by 2034 at a 15.30% CAGR. The gap between Mordor and
              Fortune Business Insights is material—USD 1.27 billion vs. USD 1.43 billion in 2026—because the two
              publishers use different inclusions for platform features and geographic footprint. Neither estimate can
              be treated as precise.

              The third lens is the broader employee recognition and reward system market that encompasses hardware
              (trophies, plaques), software platforms, and managed services but excludes the face value of rewards
              themselves. Business Research Insights sizes this at USD 21.46 billion in 2026 and USD 52.47 billion by
              2035 at a 9.4% CAGR. MarkWide Research arrives at a higher number—USD 23.7 billion in 2026 and USD 62.62
              billion by 2035 at an 11.4% CAGR. The divergence between USD 21.5 billion and USD 23.7 billion reflects
              methodology gaps around what counts as managed services versus internal program spend. The software-only
              sub-segment within this broader figure is the more relevant comparator for Awardco, but neither publisher
              isolates it cleanly.

              The fourth lens is the S&P Global / 451 Research estimate of the HR technology employee experience segment
              growing at a 10.2% CAGR through 2029, framed inside a USD 94 billion total HR technology market. S&P notes
              more than 160 vendors in employee experience alone, which sets the competitive fragmentation baseline.

              An honest SAM and SOM for Awardco cannot be estimated from public sources. Awardco's platform fee TAM is
              approximately USD 1.13 billion in 2026 (Mordor narrow), but the actual SAM for a mid-market- and
              enterprise- focused North American-heavy company with expansion globally is likely a fraction of the
              global platform total. No public source isolates Awardco's specific addressable share. The diligence path
              is internal ARR disclosure divided by implied ARPU across segments to back into a market share estimate.
