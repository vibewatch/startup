  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              员工认可与奖励平台市场在 2026 的规模为 $1.13B，预计到 2031 达到 $1.84B，CAGR 为 10.24%；增长由企业对可衡量参与度
              ROI、混合员工队伍覆盖，以及与人才留存指标直接挂钩的认可项目需求推动。大型企业约占 2026 需求的 63.55%，但 SMEs 增长更快，CAGR 为 13.23%。亚太是增长最快地区，预计到 2031 的
              CAGR 为 14.31%。在云端与本地部署的拆分中，混合部署增长最快，CAGR 为 13.42%；云端模式仍占 71.18% 份额。


              竞争格局分为六类。第一类是直接 SaaS 同行——Workhuman、Achievers、Bonusly 和 Vantage Circle——它们围绕功能广度、目录丰富度和企业分析竞争。第二类是既有服务奖专家
              O.C. Tanner（Culture Cloud），以深度象征性认可守住服务年限与里程碑细分。第三类是 Reward Gateway；它于 May 2023 被 Edenred 以 £1.15B 收购，并在
              Edenred 横跨 45 个国家、1M 企业客户的足迹内，把认可与福利、员工储蓄打包。第四类是 SMB 层进入者 Nectar HR（$2.75/user/month）和
              Motivosity（$2–5/user/month），在低端制造价格压力。第五类是 HCM 打包商，最重要的是 Workday 原生认可模块，由 Achievers 支撑并于 April 2026
              推出；这构成结构性整合威胁，因为 65% 已使用 Workday 的 Fortune 500 公司可能不再把认可单独拿出来做
              RFP。第六类是现状替代方案（表格、临时礼品卡、非正式表扬），仍在没有正式认可预算的账户中竞争。


              Awardco 位于直接 SaaS 同行集群，拥有最广奖励目录（300M+ Amazon Business 商品），并在 May 2025 完成 $165M Series B 后以 $1B+ 估值成为独角兽。其
              163 个国家 6M+ 用户和 3,000+ 企业客户包括 AT&T、Adobe、Pacific Life 和 Hertz。按规模看，最接近的竞争对手是 Workhuman；后者在 180+ 个国家拥有 8M
              用户、估计 2026 收入超过 $345M，并已盈利超过 10 年，在可信度和履约深度上具备 Awardco 尚未匹配的优势。
