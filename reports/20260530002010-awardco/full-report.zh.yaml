      - number: '5.3'
        title: AI 能力、近期发布与产品路线图
        blocks:
          - type: paragraph
            body: >-
              2025–2026 年最重要的产品动作是一轮三波扩张：原生移动应用发布（2025 年 12 月）、Awardco Engage 员工倾听模块（2026 年 1 月），以及 Awardco Intelligence
              AI 层（2026 年 5 月）。这些发布合在一起，说明平台有意从单点认可工具转向完整的面向员工敬业度套件。Awardco Engage 带来可定制调查模板（年度、脉搏、入职、离职）、以奖励提升参与率的激励、匿名
              / 保密反馈模式、覆盖移动应用、自助终端、Slack 和 Microsoft Teams 的多渠道触达，以及带情绪分析、基准对比和团队级报表的实时仪表盘。Engage
              规划扩展包括引导式行动计划、机器学习驱动建议和集成式结果追踪。Awardco Intelligence 于 2026 年 5 月发布，基于十多年平台行为数据推出一组 AI 能力：用于生成真实认可消息的
              Recognition Assistant、呈现认可健康快照的 Team Recognition Summary、汇总出行情绪的 Experiences Intelligence、支持上下文感知奖励发现的
              Suggested Search、50+ 语言本地化，以及挖掘员工独特性的 Themes & Summary。Awardco MCP Server（beta）让 HR 团队可通过外部 AI
              工具（ChatGPT、Claude、Copilot）用自然语言查询 Awardco 数据，且数据不会被摄入用于模型训练。长期 AI 路线图围绕 Motivation Graph
              展开——这是一个自研数据集，结合认可模式、奖励偏好、敬业度信号和行为趋势；未来能力包括 Awardco Assist（常驻 AI 分析师）、Program Autopilot、Smart
              Nudges、Predictive Intelligence 和 Intelligent Benchmarks。这些能力均为公司声称，架构细节层面尚未获得独立佐证。
