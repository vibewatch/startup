      - number: '3.3'
        title: 能力和定价对比
        blocks:
          - type: paragraph
            body: >
              多数企业级认可平台——Awardco、Workhuman、Achievers、O.C. Tanner 和 Reward Gateway——采用定制化、销售驱动定价，不公布价目表。Awardco
              的按活跃用户付费（PPAU）模式只对计费周期内实际使用平台的员工收费；买方认为这相较按席位合同更有利。SMB 层替代方案 Nectar HR（$2.75/user/month，$4K 年度最低消费）和
              Motivosity（$2–5/user/month，$3K 年度最低消费）公布价格，对简单认可层形成下行压力，也让定价不透明在 SMB 评估周期中成为 Awardco 的负担。


              Awardco 的核心定价差异化，是由 Amazon Business 支撑的按美元等价、无加价奖励模式。运营自有奖励市场的竞争对手——Workhuman 的自有 $1B 商店、Achievers 的
              2,500+ 品牌市场——通常会把利润嵌入商品，或收取平台费。Awardco
              声称这能为做预算对账的买方提供可验证的成本效率。第三方评论证实这是真实买方收益，但尚未发布相较具体竞争对手的实际节省差异独立基准。Awardco 的 PPAU 结构还意味着年度预算暴露随参与率而非员工数扩张，这与
              Nectar HR 和 Motivosity 的按席位最低消费在结构上不同。


              Capterra（4,616 条已验证评论）和 Software Advice 的独立评论持续给 Awardco 的易用性和奖励多样性打高分，但也暴露出反复出现的批评：实施后支持响应延迟、Amazon
              商品偶发因目录资格规则不可用、企业级定价复杂且不透明、大型组织的管理配置比预期更陡。ITQlick 给 Awardco 定价透明度 6/10，指出可比分层平台成本为
              $3–6/user/month，并警告隐藏实施负担会降低其对严谨 TCO 买方的竞争价值。这些已记录弱点，是 Nectar HR 和 Motivosity 在 SMB 与中型市场评估周期中的主要杠杆，也是
              Workhuman 在企业层的杠杆——那里多年合同可预测性更重要。
