  - id: FE001
    title: 产品架构图
    type: stack
    layout: standard
    summary: Awardco 的五层平台栈：从面向员工的渠道，到认可引擎和数据层，再到外部服务依赖。
    data:
      layers:
        - label: 员工触达渠道
          detail: >-
            Web App（浏览器，完整功能一致）；Progressive Web App（定制品牌、无需安装、始终最新）；原生 iOS 和 Android App（2025 年 12
            月，生物识别登录，支持一线员工）；Kiosk（本地领取）；Slack 和 MS Teams 机器人（工作流内认可）
        - label: 认可与敬业度引擎
          detail: >-
            同事认可（社交动态流、多接收人、徽章）；经理奖励（预算控制、审批流程）；自动化里程碑（HRIS 触发的周年、生日、入职）；Awardco Engage 调查（由奖励激励的脉冲、年度、离职调查）；Awardco
            Intelligence AI（Recognition Assistant、Team Summary、Suggested Search、MCP Server beta）
        - label: 奖励市场
          detail: >-
            Amazon Business 目录（300M+ 商品、零加价、免费配送、Integrated Ordering API）；礼品卡和体验（Priceline
            酒店、虚拟礼品卡、慈善捐赠）；自定义精选目录（管理员按项目定义产品选择）
        - label: 平台集成与 API
          detail: >-
            api.awardco.com 上的 REST API（密钥认证，GET 和 POST，Domo 与 ScreenCloud 使用）；SAML 2.0 SSO（Okta、Azure AD、CyberArk、RSA
            SecurID，支持 IdP 和 SP 发起）；HRIS 连接器（Workday、BambooHR、SAP SuccessFactors、ADP，双向数据同步）；Awardco Connect（标准库外的自定义集成）
        - label: 数据与智能层
          detail: >-
            Motivation Graph 自有数据集（跨组织行为数据、认可模式、奖励偏好、敬业度信号）；Analytics Engine（实时仪表盘、ROI 报告、情绪分析）；合规与安全（SOC 2 Type
            II、AES-256、TLS 1.2、24/7 SOC）
    approximationNotes: Awardco 未公开披露云托管供应商。层级顺序反映从产品文档和新闻稿推断的功能架构。
