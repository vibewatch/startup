      - number: '2.2'
        title: 规模测算视角：平台软件、系统支出和参与度相邻市场
        blocks:
          - type: paragraph
            body: >-
              公开证据支持四个不同的规模测算视角，来界定 Awardco 参与的市场。最窄、也最直接相关的是 Mordor Intelligence 的员工认可与奖励平台市场；该机构将平台软件子细分测算为 2025 的 USD
              1.01 billion、2026 的 USD 1.13 billion，并以 10.24% CAGR 增至 2031 的 USD 1.84 billion。对于 Awardco 的直接产品供给，这是最可防守的
              TAM，因为它把估计边界限定在 SaaS 和平台费，而不是总奖励兑换支出。

              第二个视角是 Mordor Intelligence 的员工参与度市场，范围更广，除认可外还包括调研、脉冲工具和分析。Mordor 将其测算为 2025 的 USD 1.10 billion、2026 的 USD
              1.27 billion，并以 15.28% CAGR 增至 2031 的 USD 2.58 billion。Fortune Business Insights
              使用相近但不完全相同的范围，将员工参与度软件市场测算为 2026 的 USD 1.43 billion、2034 的 USD 4.47 billion，CAGR 为 15.30%。Mordor 与 Fortune
              Business Insights 的差距很重要——2026 为 USD 1.27 billion vs. USD 1.43
              billion——因为两家发布方对平台功能和地域覆盖的纳入不同。两项估计都不能当成精确值。

              第三个视角是更宽的员工认可与奖励系统市场，涵盖硬件（奖杯、牌匾）、软件平台和托管服务，但不包括奖励本身的面值。Business Research Insights 将其测算为 2026 的 USD 21.46
              billion、2035 的 USD 52.47 billion，CAGR 为 9.4%。MarkWide Research 给出更高数字——2026 的 USD 23.7 billion、2035 的 USD
              62.62 billion，CAGR 为 11.4%。USD 21.5 billion 与 USD 23.7 billion 的差异，反映了托管服务和内部项目支出边界的口径缺口。这个更宽数字中的纯软件子细分才是
              Awardco 更相关的可比口径，但两家发布方都没有清晰拆出。

              第四个视角是 S&P Global / 451 Research 对 HR 技术中员工体验细分的估计：该细分到 2029 的 CAGR 为 10.2%，位于 USD 94 billion 总 HR
              技术市场内部。S&P 指出，仅员工体验就有超过 160 家供应商，这设定了竞争碎片化的基线。

              仅靠公开来源，无法诚实估算 Awardco 的 SAM 和 SOM。Awardco 的平台费 TAM 在 2026 约为 USD 1.13 billion（Mordor
              窄口径），但一家以北美为重心、覆盖中型市场和企业客户并向全球扩张的公司，其实际 SAM 很可能只是全球平台总量的一部分。没有公开来源能隔离出 Awardco 的具体可服务份额。尽调路径是披露内部
              ARR，再除以各细分隐含 ARPU，反推出市场份额估计。
