  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计财务
        - FY2023 和 FY2024 经审计损益表（P&L）、资产负债表和现金流量表
        - 确认 ARR、毛利率、经营杠杆，以及现金流为正说法基于 GAAP 还是调整后口径；锚定所有情景模型
        - 管理层资料室；通过领投方（Sixth Street、Spectrum Equity）索取
      - - 净留存率（NRR）
        - 至少连续 4 个季度的队列层级 NRR，并按客户分层（企业与中端市场）拆分
        - NRR 是私有 SaaS 估值最重要的单一驱动；未披露 NRR 让基准情景估值出现 50%+ 置信区间
        - 管理层披露；与资料室中客户层合同数据交叉核验
      - - Amazon Business 合同条款
        - 排他范围、API 访问费结构、收入分成（如有）、合同期限、续约条款和控制权变更条款
        - Amazon 合作是主要护城河；任何可被重新谈判或会到期的条款都代表重大估值风险
        - 直接审阅 Awardco–Amazon Business MSA 及任何修订；法律顾问审查例外条款
      - - 股权结构表和优先股堆叠
        - 完全稀释股权结构表，列明所有优先股类别、清算优先权、反稀释条款和员工股权池
        - Series A（$65M）和 Series B（$165M）的清算优先权可能在低于 $2B 的退出情景中吃掉大部分回报
        - 管理层或法律顾问披露；任何 Series B 尽调中的标准材料
      - - 前 10 大客户集中度
        - 前 10 和前 20 大客户 ARR 占总 ARR 比例，并标出任何超过 $5M ARR 的合同
        - 客户高度集中（前 5 大客户贡献 >20%）是下行触发器；Fortune 500 标识不能证明收入分散
        - 管理层披露；对照公开具名企业客户核验
    notes: 这些尽调问题是 Series B 阶段投资的标准事项，正常资料室流程中应可解决。目前公开来源均缺失。
