      - number: '8.4'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Awardco 的退出准备度中等。公司具备吸引收购方的规模（$100M+ ARR）、机构投资人质量（Sixth Street、Spectrum Equity、General
              Catalyst）和品牌认知（3,000+ 企业客户、Fortune 500 名单）。潜在战略收购方包括：（1）HCM 平台（Workday、SAP SuccessFactors、Oracle
              HCM），希望无需自建就补上认可能力；（2）更广义 HR tech 整合方（ADP、Ceridian/Dayforce），扩充员工体验栈；（3）激励和奖励市场平台（Achievers 的 PE
              支持买方、Blackhawk Network），寻求平台规模。如果增长维持在 25% 以上、公司接近 Rule of 40 达标，财务赞助方也可能推动老股交易。独立 IPO 可行，但在公开 SaaS
              环境低迷、完整财务披露基础设施尚未建立之前，2027–2028 年前概率不高。关键未解尽调项包括：（1）经审计财务报表，用于确认 ARR、毛利率和 NRR——这些指标会锚定所有估值模型；（2）Amazon
              Business 独家协议的精确条款、期限和收入分成机制；（3）队列级客户留存数据，用来支持或推翻 110% 以上的隐含 NRR；（4）集中度：前 10 大客户贡献多少 ARR，是否有单一客户贡献超过 5%
              ARR；（5）股权结构表和优先股堆叠，包括任何清算优先权、反稀释条款，或 Series B 中授予的特殊权利，这些条款会在低于 $1B 的退出中损害普通股回报。估值立场为偏高：业务质量高，但在倍数压缩环境下，以
              $1B 或更高价格入场，需要持续增长证据和未披露的财务质量指标来证明溢价合理。
            claimRefs:
