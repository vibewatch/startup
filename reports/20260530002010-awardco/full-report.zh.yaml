      - number: '1.2'
        title: 创始人和领导团队
        blocks:
          - type: paragraph
            body: >-
              Awardco 由三位至今仍担任高级运营职务的人士共同创立：Steve Sonnenberg（联合创始人兼 CEO）、Mike Sonnenberg（联合创始人兼 CTO）和 Tanner
              Runia（联合创始人兼总裁）。Steve Sonnenberg 是公司公众面孔，推动员工认可从周期性 HR 礼节变成战略性业务职能的愿景。他曾表示「员工认可已经 100 年没有变化」，并把 Awardco
              定位为变革性替代方案。Mike Sonnenberg 负责工程和产品技术路线图。Tanner Runia 监督日常运营，并主导 Series B 中围绕 Awardco 现金流为正模式的叙事。根据
              Craft.co 的第三方组织数据，高管层还包括 Isaiah Bryson（COO）和 John Richards（CFO）。三位联合创始人持续担任 C
              级高管，释放出创始人领导的稳定性，但也带来关键人物集中风险，尤其是 Steve
              Sonnenberg：他的外部代表性和愿景所有权深嵌在客户与投资者沟通中。公开来源在截至本报告的期间内未发现重大领导层变化。公司从近似自筹运营成长为 677 人组织；聚合估计显示过去一年员工数增长
              34%，这带来高速增长私有 HRTech 公司常见的组织扩张风险。
