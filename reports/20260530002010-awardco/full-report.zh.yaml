  - id: TV005
    title: 打破投资逻辑和否决触发器
    columns:
      - 触发器
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - Amazon 合作扰动
        - API 访问受限、排他性取消，或 Amazon 宣布竞争性认可产品
        - 消除主要护城河；Awardco 只能靠功能与 Workhuman 和 HCM 捆绑方竞争 → 收入放缓
        - 退出或减持；若护城河完全丧失，按 3–4x ARR 重新评估
      - - ARR 增长放缓
        - ARR 同比增长连续两个半年度低于 20%
        - 入场倍数（9–13x）在 <20% 增长下站不住脚；与成熟 SaaS 4–6x 相当 → 估值下调风险
        - 减仓；要求管理层给出重新加速计划
      - - 净留存率（NRR）低于 100%
        - 首次披露 NRR 低于 100%，表明客户净收缩
        - 违背高客户粘性投资逻辑；释放产品或竞争失败信号
        - 重估基本面；避免新增资金投入
      - - 下调估值轮或平轮
        - 下一次融资事件对 Awardco 的估值不高于 $1B
        - 显示内部人投资逻辑弱化；退出测算复杂化；可能触发反稀释条款
        - 审查股权结构表，评估优先股堆叠对普通股的影响；若非流动性溢价塌陷则退出
      - - HCM 原生认可功能免费化
        - Workday 或 SAP SuccessFactors 对现有客户以零增量成本捆绑认可功能
        - 消除存量客户中的新增机会；压缩独立解决方案 TAM → 倍数压缩
        - 每季度跟踪 Workday、SAP、Oracle 产品公告
    notes: 阈值为指示性；精确触发水平需要管理层披露 NRR、ARR 队列数据和合作合同条款。否决标准适用于新增资金配置，不适用于既有持仓。
