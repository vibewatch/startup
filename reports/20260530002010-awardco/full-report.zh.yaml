  - id: FI001
    title: 收入模型桥
    type: flow
    layout: standard
    summary: 雇主客户如何把认可预算转化为 Awardco 平台费收入和毛利润；Amazon Business 负责零加价履约奖励。
    approximationNotes: 这是定性的结构图。节点标签只表示方向；由于毛利率和 COGS 未披露，未归因具体金额。节点中的收入数字来自公司披露或估计区间，未经审计。
    claimRefs:
      - CI001
      - CI002
      - CI019
      - CI016
      - CI038
    data:
      nodes:
        - label: 雇主客户签署年度 SaaS 合同
          detail: 合同价值每年 $12K–$250K+，取决于用户数和套餐层级。没有免费试用，也没有自助注册；必须经过销售接洽和定制报价。
        - label: 收取平台订阅费（Awardco 收入）
          detail: 年度平台费是 Awardco 的主要收入流。SpendHound 基准显示，SMB 平均约 $37K，企业级平均约 $201K。奖励预算另算，不计入 Awardco 收入。
        - label: 员工赚取并兑换认可积分
          detail: 员工通过 Awardco 平台用积分兑换 300M+ Amazon Business 商品、礼品卡和体验。Awardco 对 Amazon 奖励零加价；兑换按 Amazon 原生价格穿透。
        - label: Amazon Business 履约奖励订单（零加价）
          detail: Amazon Business 在全球处理库存、物流和配送。Awardco 不承担履约 COGS。支持市场内国际订单免运费、无进口费。
        - label: 平台费产生毛利润
          detail: 按 SaaS HR tech 基准（High Alpha 2025）估算，毛利率为 70–85%。主要成本是工程、客户成功和云基础设施。零履约开销是结构性毛利优势。
      edges:
        - from: Employer client signs annual SaaS contract
          to: Platform subscription fee collected (Awardco revenue)
          label: 年度合同计费
        - from: Platform subscription fee collected (Awardco revenue)
          to: Employees earn and redeem recognition points
          label: 平台访问与项目激活
        - from: Employees earn and redeem recognition points
          to: Amazon Business fulfills reward orders (zero markup)
          label: 积分兑换流向 Amazon
        - from: Platform subscription fee collected (Awardco revenue)
          to: Gross profit generated from platform fee
          label: 收入减平台 COGS
  - id: FI002
    title: 单位经济性桥
    type: flow
    layout: standard
    summary: 从客户获取到 LTV 兑现的定性单位经济性链条；多数数值不可得，并被标为尽调缺口。
    approximationNotes: 所有节点数值都是定性描述或基于行业基准估算；公司未披露 CAC、NRR、LTV 或流失率数据。引用区间是 SaaS HR tech 可比公司，而非 Awardco 实际值。该图旨在梳理所需输入链条，不量化结果。
