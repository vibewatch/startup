  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：纳入与排除的支出
        blocks:
          - type: paragraph
            body: >-
              Awardco
              的产品和市场推广材料把公司定义为覆盖员工认可、奖励、激励和参与度分析的文化引擎。因此，纳入的支出覆盖直接位于员工奖励与认可工作流上的软件和服务：同事间认可项目、服务与里程碑奖励自动化、自上而下的即时奖励、基于绩效的激励、生活方式支出账户（LSAs），以及承接这些项目的奖励目录基础设施（礼品卡、商品、体验）。Awardco
              的 Amazon Business 合作和平台在 135 个国家提供 300 million 奖励选项，使目录广度成为支出边界的核心。

              排除的支出同样重要。Awardco 不与核心 HRIS、薪资处理、ERP 或独立调研平台竞争，尽管它会与这些系统集成。它不是福利管理系统、学习管理平台，也不是纯企业差旅管理工具。Awardco
              最直接替代的是现状流程：手工奖励流程（礼品卡表格、手工服务奖订单、采购驱动的周边采购）、目录选项狭窄的独立认可工具，以及部分企业账户中的 Workhuman 或 Achievers。间接替代包括
              Microsoft Viva、SAP SuccessFactors 或 Workday 内置的认可功能，但 Awardco 将自己定位为更深、更灵活的合作伙伴，而不是通用 HCM 附加模块。

              纳入支出最清晰的证据来自 Awardco 官网关于 3,000+ 家全球客户组织的声明，以及 G2 Spring 2026
              在员工参与度、员工认可、奖励与激励、生活方式支出账户类别中的认可。相邻市场包括企业礼赠（USD 359 billion 全球市场），但 Awardco 的 SAM
              是软件和服务层，而不是奖励支出的完整面值。MarkWide Research 将员工认可与奖励系统市场——硬件加软件合计——测算为 2026 的 USD 23.7 billion；Mordor
              Intelligence 将平台软件子细分测算为 2026 的 USD 1.13 billion，显示软件变现层约为总项目支出的 5%。
