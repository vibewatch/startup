      - number: '7.5'
        title: 运营与执行风险
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年初，Awardco 员工数同比约增长 34%，估计达到 629 至 677 人。这一速度引入组织扩张风险：文化稀释、流程碎片化、客户成功质量控制和入职执行质量。公司自 2021 年 Series
              A 以来规模已扩大三倍，并正在部署 $165M Series B 资本。在这样的增长速度下，运营纪律风险——包括中端市场与企业级分层是否清晰、进入 EMEA 的地理扩张执行、AI
              功能一致性维护——都是重要执行变量。

              创始人关键人集中是最尖锐的人才风险。Steve Sonnenberg（CEO）、Mike Sonnenberg（CTO）和 Tanner Runia（President）同时占据三位联合创始人 C-suite
              角色，且没有公开披露继任计划、竞业安排或关键人保险。任何创始人离开，尤其是 Steve（外部代表）或 Mike（技术架构），都会威胁投资者信心、客户关系连续性和产品路线图执行。Capterra、Software
              Advice 和 Software Finder 的用户评论一致指出，报表复杂、UI/UX
              不一致、初始设置复杂和价格不可预测是摩擦点，会带来流失风险并拉长新的企业部署周期。第三方预付卡履约层发生问题时，用户会把履约失败归因于 Awardco 而不是发卡方，从而造成声誉外溢。
