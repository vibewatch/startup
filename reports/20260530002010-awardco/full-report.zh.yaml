      - number: '5.2'
        title: 平台架构与集成生态
        blocks:
          - type: paragraph
            body: >-
              Awardco 的技术架构以云托管 SaaS 平台为核心，并通过集成层连接 Amazon Business 的 Integrated Ordering API，实现实时下单和追踪。员工侧通过网页应用、PWA
              或原生移动应用交互；管理员通过管理控制台管理项目、预算和报表。平台通过有文档的 REST API（api.awardco.com）、兼容 Okta、Azure AD、CyberArk 和 RSA SecurID
              的 SAML 2.0 SSO 层，以及覆盖主要 HRIS 供应商（Workday、BambooHR、SAP SuccessFactors、ADP）、协作工具（Slack、Microsoft
              Teams）和分析平台（Domo）的预置连接器，接入企业系统。标准库未覆盖的定制集成由 Awardco Connect 处理。ScreenCloud 连接器展示了 REST API 的开发者扩展性：Awardco
              在 [company].awardco.com/settings/advanced?tab=apiSettings 暴露 Custom Feed API
              端点，每六分钟刷新认可数据，并支持元数据过滤，把认可内容路由到特定办公室屏幕。Amazon Business 集成自 2017 年起，从基础目录链接演进为完整 Integrated Ordering
              API，实现实时订单和追踪同步、集中化支出透明度和免人工履约。与 HRIS 系统的集成深度是已知差异点：Awardco 导入员工记录，按生命周期事件自动发放里程碑奖励，并支持 135
              个国家的本地化奖励兑换。平台在全球支持 163 种货币，并为认可和 UI 体验提供 50+ 种语言支持。
