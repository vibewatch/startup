      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景取决于 Awardco 能否把 40%+ ARR 增速维持到 2027 年、突破 $200M ARR、保持现金流为正，并按 8–10x 前瞻 ARR 推进 IPO 或战略出售——相对 $1B 入场价拿到
              3–4x 回报（隐含退出估值 $3–4B）。这个情景需要四个条件：（1）Amazon 独家合作继续存在；（2）London 办公室顺利推动 EMEA 扩张；（3）AI 差异化（Awardco
              Intelligence）带动增购，并把 NRR 推到 120% 以上；（4）HCM 套件捆绑没有造成颠覆。基准情景假设 2027 年前 ARR 每年增长 25–35%，到 2027 年达到 $150–180M
              ARR，并以 6–8x 前瞻 ARR 退出，对应 $1.2–2B 结果——相当于 $1B 基线上的 1.2–2x
              回报，低于典型私募股权门槛。这是一个观察并跟踪的仓位：业务会复利增值，但按今天价格买入，无法产生风险投资级回报。悲观情景假设增长放缓到 20% CAGR 以下（与重大竞争替代或 Amazon 合作扰动一致），到
              2027 年 ARR 只有 $100–120M，倍数压缩到 4–5x——意味着退出价值 $500–700M，$1B+ 入场的投资人会显著亏损本金。主要传导路径是 Amazon
              重新谈判合作条款，或直接进入认可软件市场；一旦发生，核心差异化会被抽走，Awardco 只能靠功能和价格，单独对抗资本更充足的 HCM 捆绑商。对 ARR 倍数做敏感性分析后可以看到，基准情景下，只有
              Awardco 至少三年维持高于市场的增长，$1B 入场价在 8–12% 折现率下才具备正 IRR。因此，增长率是估值结果最重要的单一驱动，比利润率改善或地域扩张更关键。
