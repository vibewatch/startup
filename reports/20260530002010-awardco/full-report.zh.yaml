      - number: '7.3'
        title: 伙伴与技术依赖风险
        blocks:
          - type: paragraph
            body: >-
              Awardco 的核心价值主张——在 180+ 个国家零加价接入 300M+ 个奖励选项——结构性依赖其与 Amazon Business 于 2017 年启动的排他合作。该合作支撑平台主要差异点；若
              Amazon 终止或实质重组关系，Awardco 将失去完整目录优势，并必须紧急开发替代奖励采购渠道。目前未发现公开证据显示 Awardco-Amazon
              合作中存在合同排他性保护、最低承诺期限或变更控制条款。2024 年 9 月增强 Integrated Ordering API 能力的公告显示集成加深，这同时强化了产品，也加深了依赖。

              Amazon 2026 年 SP-API 政策变化带来增量风险：自 2026 年 1 月 31 日起，所有第三方 SP-API 开发者每年支付 $1,400 订阅费；自 2026 年 4 月 30 日起，每
              1,000 次 GET API 调用收取 $0.40 使用费。BSA Agent Policy 于 2026 年 3 月 4 日生效，要求所有访问 Amazon Services 的自动化工具表明自身为
              agents，并在 Amazon 要求时立即停止访问；这是一个没有提前通知义务的 kill-switch 条款。虽然这些变化主要针对电商 SaaS 开发者，Awardco 对 Integrated
              Ordering API 的依赖意味着 Amazon 伙伴条款任何收紧都会直接影响平台运营。第三方预付卡发行方（MyPrepaidCenter、Tango）处理非 Amazon
              奖励履约；ComplaintsBoard 和 BBB 上的用户投诉记录了卡激活失败、余额消失和解决体验差的问题，在非 Amazon 奖励兑换流程中带来客户满意度和声誉风险。
