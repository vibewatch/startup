      - number: '2.3'
        title: 买方、用户、付款方和采用路径
        blocks:
          - type: paragraph
            body: >-
              员工认可与奖励的买方图谱主要由 HR 牵头，但需要财务团队验证，且越来越多接受 IT 审核。Awardco 的典型买方是 HR 负责人——VP of HR、CHRO、Director of People
              Operations 或 Employee Experience Manager——他们掌握认可项目预算，并以留存、参与度分数和文化凝聚力来衡量。企业级账户中，经济买方通常在 CHRO 或 CPO
              层级；财务团队审查项目 ROI、奖励预算使用率和人均支出；IT 评估 HRIS 集成安全、SSO 合规和数据治理。用户覆盖所有细分中的员工；在许多部署中，经理也是发起认可的高频用户，而 HR
              管理员负责管理工作流。

              Mordor Intelligence 的细分显示，大型企业在 2025 占认可平台市场 63.55%，SMEs 到 2031 以 13.23% CAGR 增长最快。Fortune Business
              Insights 报告了类似结构，大型企业在 2026 占员工参与度软件市场 55.10%。Awardco 在企业、中型市场和小型企业细分均获得 G2 Leader 位置，证实其多细分定位；但定价证据（Vendr
              显示企业层级年费起步为 USD 50,000–150,000）表明企业和中型市场账户价值更高。

              采用触发因细分而异。企业账户的触发点通常是失败的传统项目（手工服务奖、高加价周边目录）、需要整合多套认可工具的并购，或促使 HR 向 CFO 证明认可 ROI
              的留存危机。中型市场账户更常见的触发点是增长阶段扩张——公司跨过 200–500 名员工后，手工认可开始失效，分布式团队需要平台解决方案。SMB 采用通常由一名 HR 经理推动，希望找到比临时 Amazon
              礼品卡邮件或手写便条更专业的替代方案。

              IRF 的 2026 Industry Outlook 证实，尽管预算持平，65% 的北美项目预计参与人数增长，62%
              预计项目技术预算增加。这是最直接的第三方证据，说明买方基础即使在经济压力下也在扩大。GoProfiles 的 State of HR 2026 调研发现，超过 80% 的 HR 组织在 2026
              优先考虑技术升级，其中参与度和认可属于最高优先级类别。
