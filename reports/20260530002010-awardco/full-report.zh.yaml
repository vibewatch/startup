      - number: '5.5'
        title: 差异化、知识产权与竞争护城河
        blocks:
          - type: paragraph
            body: >-
              Awardco 的主要竞争护城河来自合同和网络：它是唯一拥有 Amazon Business 特色合作伙伴身份的员工认可平台。该关系建立于 2017 年，使 Awardco 可接入 Amazon 的
              Integrated Ordering API 和完整 Amazon Business 目录，并做到零加价。竞争对手未经 Amazon 同意无法复制这一合作；只要排他性成立，这就是一道持久壁垒。平台还声称拥有自研
              Motivation Graph——一个跨数千家组织、沉淀十多年的纵向行为数据集，旨在支撑 Awardco Intelligence 的 AI
              路线图。若属实，该数据集会构成有意义的数据护城河；但其架构、准确性，以及相较通用 ML 模型能否带来可衡量更好结果，尚未独立验证。其他差异化包括竞争对手缺乏的双移动策略（原生应用 + PWA）；覆盖 135
              个国家和 163 种货币的多币种、多国家支持；1:1 积分兑美元且无兑换费；以及开放 API
              和有文档的第三方集成（Domo、ScreenCloud、Okta、Workday）。平台架构明确避免成为主记录系统——它设计成与 HRIS 供应商集成，而非取代它们，从而降低销售门槛，也缩小与
              Workday、SAP SuccessFactors 等既有厂商竞争的范围。
