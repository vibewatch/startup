      - number: '7.2'
        title: 监管与隐私风险
        blocks:
          - type: paragraph
            body: >-
              Awardco 在 163 个国家运营，并代表 3,000+ 家雇主客户处理员工个人身份信息（PII），因此承担多司法辖区隐私合规义务。CCPA 2026 规则于 2025 年 9 月 23 日定稿，2026 年
              1 月 1 日生效且初期没有宽限期，引入强制网络安全审计、正式风险评估协议和自动化决策技术（ADMT）监督；这些都与 Awardco 的 AI 驱动认可层（Awardco Intelligence）相关。截至
              2026 年 3 月，超过 20 个美国州已有综合隐私法；Indiana、Kentucky 和 Rhode Island 于 2026 年 1 月加入，并要求覆盖处理活动完成数据保护影响评估。California
              DROP 平台自 2026 年 8 月 1 日生效，要求覆盖范围内的数据经纪人在 45 天内处理删除请求。O'Melveny 的 2026 年隐私合规清单将 AI 训练数据使用、自动化决策透明度和多州
              opt-out 合规列为主要执法重点。

              Awardco 声称符合 GDPR，并发布数据主体访问请求（DSARs）机制，包括删除权；数据处理协议可按需提供。公司安全与合规页面确认 GDPR、CCPA/CPRA 和 ISO 27001
              认证。不过，Awardco 的 AI 认可评分功能可能需要根据 2026 CCPA 规则提供明确 ADMT 披露文件；面向 California 覆盖企业的年度网络安全审计义务也将按错峰时间线持续到 2030
              年。GDPR 不合规罚款截至 2025 年累计已超过 5.5 billion euros；潜在罚款最高可达全球年度营业额的 4%。美国各州隐私法仍在拼图式扩张，Awardco
              的地理足迹和员工数越大，合规维护负担越高。
