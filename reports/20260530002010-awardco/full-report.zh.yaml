        - 要求按渠道（入站、出站、渠道）提供混合 CAC、平均销售周期，以及 S&M 支出占收入比例
      - - 月度现金烧钱和资产负债表
        - 无法核验现金跑道或现金流为正的说法；无法评估对下一轮融资的依赖
        - 要求提供过去 12 个月月度 P&L 和资产负债表；确认经营性现金流 vs. 投资性现金流
      - - 收入拆分（SMB vs. 企业，按地区）
        - 无法评估集中度风险、合同组合或 EMEA 扩张的单位经济模型
        - 要求提供按客户细分划分的 ARR、前 10 大客户收入集中度，以及 EMEA 占总 ARR 比例
    notes: 所有缺口都是公开来源无法获得的私营公司指标。每个缺口都是投资承销中的阻塞性或重要尽调项。解决这些问题需要直接接触 Awardco 管理层并访问虚拟数据室。
