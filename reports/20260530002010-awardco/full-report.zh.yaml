      - number: '1.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 2012 以来现金流为正——HRTech 里少见的自筹纪律
            body: >-
              Awardco 在没有外部资本的情况下运营了 9 年，同时收入逐年增长；General Catalyst 的 Paul Kwan 将这种资本效率与 Atlassian 和 Qualtrics
              相比。这种纪律降低了新投资者的稀释风险，指向耐久的单位经济，也证明商业模式不靠补贴也能跑通。公司进入 Series B 时称自身拥有「持续高速增长和现金流为正的业务」。
            calloutType: strength
            claimRefs:
              - CO005
              - CO012
              - CO014
          - type: callout
            title: 品牌钓鱼活动——客户组织的安全风险
            body: >-
              从 May 2025 开始，网络安全公司 Mimecast 识别并跟踪了一场复杂、持续数月的钓鱼活动（MCT03028），该活动冒充 Awardco 通信以收割企业凭证。Awardco
              会与某一组织的所有员工沟通，而不只是 HR，因此攻击面异常大。客户面临间接暴露：员工凭证可能因看似合法的奖励通知而被盗。Awardco
              并不对这场活动直接负责，但品牌被利用暴露了一个风险：它在企业内部覆盖越广，越会影响客户下游安全态势。
            calloutType: risk
            claimRefs:
              - CO036
              - CO037
          - type: callout
            title: Amazon Business 独家性——竞争对手难以复制的供给侧护城河
            body: >-
              员工认可领域尚无竞争对手复制与 Amazon Business 等价的安排。该合作让 Awardco 以零加价接入数亿 SKU，在 180+ 个国家提供免费配送和实时跟踪；没有直接 Amazon
              关系的竞争对手，很难在结构上匹配这种终端用户价值主张。该合作建立于 2017，并在 2021 和 2024 两次深化；Awardco 将其描述为全球扩张战略的基础。
            calloutType: insight
            claimRefs:
