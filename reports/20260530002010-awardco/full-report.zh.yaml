      - number: '3.2'
        title: 直接竞争对手画像
        blocks:
          - type: paragraph
            body: >
              Workhuman 是最强的直接同行。公司创立于 25 年前，已经连续超过 10 年盈利，并运营一个自有自营的 $1B 全球电商奖励商店，每年处理 12M 订单。其全球 180+ 个国家 8M 用户和估计
              $345M 的 2026 收入，使其规模领先 Awardco。Workhuman 的「Human Intelligence」AI 层把认可信号转化为员工队伍分析，CHRO 买方会认为这具有战略价值。

              与 Awardco 的 Amazon 直通模式不同，Workhuman 控制履约，这增强了个性化，但相较 Amazon 网络限制了目录广度。外部累计融资约 $131.5M，估值约
              ~$1.2B；盈利能力降低了对后续融资的依赖。


              Achievers 拥有结构性差异化位置，因为它在 April 2026 与 Workday HCM 做了嵌入式集成，成为这个规模下唯一原生嵌入大型 HCM 套件的认可平台。该集成使用与员工绩效数据绑定的 AI
              驱动洞察，支持 190 个国家以本地货币兑换奖励，并为 Workday 的 11,500+ 企业客户——65% 的 Fortune 500——消除独立采购步骤。Achievers
              定价仍完全按报价，第三方估计企业部署为 $1–4/user/month，并包含专属客户成功经理。在 Workday 场景之外作为独立认可工具时，Achievers 与 Awardco 功能大体可比，但
              Workday 原生模块提供了竞争对手难以复制的分发优势。


              O.C. Tanner（Culture Cloud）是传统服务奖既有厂商，差异化来自深度里程碑认可——职业周年、晋升、退休——以及有形象征性奖品。企业 HR 团队认可其分析深度，可用于 ROI
              归因和参与度跟踪。不过，O.C. Tanner 不太适合连续、日常的同事间高频认可；其设计天然以事件驱动为主，因此对高频认可用例来说，更像补充而非正面竞争。


              Reward Gateway 于 May 2023 被 Edenred 以 £1.15B 收购，把认可与员工储蓄、身心健康和福利项目打包，并受益于 Edenred 在 45 个国家的 1M
              企业客户。收购后，平台正积极在欧洲主要市场（Belgium、France、Germany、Italy、Romania、Spain）推出。M&A 后的集成复杂度可能在短期限制产品速度。

              Bonusly、Nectar HR 和 Motivosity 服务 SMB 到中型市场层，价格更低（$2–5/user/month），但企业级规模、全球目录深度和 AI 能力有限。Bonusly 截至
              mid-2026 仍保持独立，未确认被收购，服务数千支团队，主打同事间社交认可。Nectar HR 提供 Slack 和 Teams 集成，并在 Premium 层级提供周边商店。Motivosity
              包含一个旨在降低流失的社交社区层。
