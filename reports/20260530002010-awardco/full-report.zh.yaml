      - number: '5.6'
        title: 信任、安全与合规
        blocks:
          - type: paragraph
            body: >-
              Awardco 持有 SOC 2 Type II 认证，覆盖五项 Trust Services Criteria：Security、Availability、Processing
              Integrity、Confidentiality 和 Privacy。该认证证明控制在数月审计期内有效运行，而不只是设计合格，为企业买家提供数据处理实践上的保证。传输中数据通过 TLS 1.2
              保护，静态数据采用 AES 256-bit 加密。认证支持 SSO（SAML 2.0，兼容 Okta、Azure AD、CyberArk、RSA
              SecurID）、多因素认证（MFA）和一次性密码（OTP）。Security Operations Center 提供 24/7 威胁监控。Awardco 的 AI
              设计原则明确称，平台不会用可识别用户或客户特定组织数据训练模型，回应了企业对 AI 平台摄入敏感员工信息的常见担忧。客户可在 RFP 流程中按需获取 SOC 2 报告。重大尽调缺口仍在：公开页面未发布正常运行时间
              SLA 和历史可靠性指标；面向受 GDPR 监管的 EU 客户的数据驻留选项未在公开材料中记录；也看不到公开的
              security.txt、漏洞赏金项目或渗透测试披露。平台未发布重大宕机复盘，但没有公开披露并不能证明没有事故。
