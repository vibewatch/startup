  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Awardco 的投资逻辑建立在四个相互强化的支柱上。第一，公司所在市场结构性渗透不足：员工认可软件在 Fortune 500 雇主中的平台级渗透率约为
              20%，绝大多数支出仍落在临时礼品卡、现金奖金和手工项目中。市场规模估算显示，平台软件子细分在 2026 年为 $1.1–1.3 billion，约以 10–15% CAGR
              增长；更广的敬业度类别则延伸了可服务边界。第二，Awardco 拥有可防守护城河：其自 2017 年起生效的 Amazon Business 排他集成，提供 300M+
              个零加价奖励选项，是竞争对手尚未在同等规模复制的成本优势。第三，以该阶段风险投资支持公司标准看，财务画像异常强：至少自 2021 年起现金流为正，2024 年 ARR 为 $75.2M（73%
              同比增长），2025 年估计 ARR 为 $100–121M。第四，机构质量较高：投资者 Sixth Street Growth 和 Spectrum Equity 与 General Catalyst、Ryan
              Smith（HXCO/Qualtrics）共同领投 Series B，且均在把公司估值标到 $1B 以上前完成了完整尽调。反向逻辑同样具体。Awardco 的 $1B+ 估值意味着最近 ARR 的
              9–13x；只有公司未来 2–3 年继续维持 30–50%+ ARR 增长，这一倍数才合理。这个门槛可达，但没有任何已披露财务数据确认。关键指标——净留存率、毛利率、CAC 回本和流失——全部未披露。对
              Amazon Business 的单一供应商依赖构成结构性集中风险：合作重新谈判、API 访问条款变化，或 Amazon 决定直接进入认可软件市场，都会实质削弱 Awardco 的核心差异化。来自 HCM
              原生模块（Workday、SAP SuccessFactors）的竞争形成结构性压力，并会随着这些平台加深认可功能而增强。最后，公开 SaaS 市场在 1Q26 大幅重估——SEG SaaS Index 的
              EV/TTM revenue 中位数降至 3.6x——压缩了任何近期流动性事件的退出倍数上限。
