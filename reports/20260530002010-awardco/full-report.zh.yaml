      - number: '4.2'
        title: 单位经济和成本结构
        blocks:
          - type: paragraph
            body: >-
              Awardco 不公开披露单位经济。净留存率（NRR）、获客成本（CAC）、回本周期和毛利率都是私有公司指标，尚未被任何第三方来源验证。Series B
              完成时的投资者评论提到「极高的客户满意度」和「持续高速增长」，这与高于市场的 NRR 相一致，但没有引用具体数字。

              Awardco 的成本结构类似高毛利 B2B SaaS：平台主要支出是软件工程、客户成功和销售与市场，奖励履约完全由 Amazon 物流处理，Awardco 不产生增量成本。这种结构——平台费收入对上以人员 /
              基础设施为主的成本，且没有实物履约开销——类似通常可实现 70–85% 毛利率的 HR 科技 SaaS 平台。High Alpha 的 2025 SaaS Benchmarks 报告记录了 HR
              科技毛利率中位数约 ~76%，前四分位供应商为 80–85%。Awardco
              的零加价模式消除了一项部分竞争对手承担的成本类别（履约利润），说明其毛利率可能位于该区间高端；但在缺少经审计财务的情况下，这仍只是估计。

              2026 每员工收入估计约 $178,000，高于这一阶段 B2B SaaS 的中位水平（OpenView 2025 基准：Series B SaaS 约 ~$140–160K）。这与高毛利、低 COGS
              平台模式一致，但应通过披露财务确认。
