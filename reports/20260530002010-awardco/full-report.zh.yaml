      - number: '1.3'
        title: 融资历史和资本结构
        blocks:
          - type: paragraph
            body: >-
              Awardco 从 2012 创立到 October 2021 一直以自筹资金、现金流为正方式运营，未引入外部资本；其 Series A 领投方 General Catalyst 的 Paul Kwan
              将这种表现与 Atlassian 和 Qualtrics 的早期增长路径相提并论。首轮机构融资是 October 28, 2021 公布的 $65 million Series A，由 General
              Catalyst 和天使投资人 Ryan Smith（Qualtrics 联合创始人、Utah Jazz 控股股东、HXCO 合伙人）领投，公司估值超过 $900 million——当时是 HR SaaS
              历史上规模最大的 Series A。公司称该轮融资将推进其成为「全球忠诚度和激励支出的市场」的愿景。第二轮、也是最近一轮融资是 May 20, 2025 完成并公布的 $165 million Series
              B，由 Sixth Street Growth 和 Spectrum Equity 共同领投，General Catalyst 和 Ryan Smith 继续参投，Awardco 估值超过 $1
              billion。资金用途包括扩展参与度和绩效平台、投入 AI 能力、深化 HRIS 集成，并扩大全球基础设施。已知累计融资约 $235 million。Goodwin Law LLP（由 John
              Casnocha、Arman Carretta 和 Christian Golden 牵头）担任 Awardco Series B 法律顾问。公开来源未发现老股交易、可转债、债务工具或 Series C
              管线披露；这些仍是待尽调路径。
