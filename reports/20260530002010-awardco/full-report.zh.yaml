              Awardco 未公开披露净留存率（NRR）、总留存率（GRR）、logo 流失或合同续约队列数据。公开来源中可用的主要留存信号来自第三方评论平台。McLean & Company's
              SoftwareReviews 平台显示 Plan to Renew 得分 99%、Likeliness to Recommend 92%、Net Emotional Footprint +97。Capterra
              截至 2025 年初记录 4,616 条已验证评论，综合评分 4.9/5。G2 2026 年初档案显示 6,000+ 条评论，综合评分 4.9/5。Gartner Peer Insights 显示总体情绪为
              "Favorable"，其中 2026 年 3 月一条 5/5 评论指出强敬业度，同时 2025 年 4 月一条 3/5 "Critical" 评论提到实施后支持不稳定。位于 Utah Lindon 的
              Awardco, Inc. BBB 档案在公开视图中未显示重大未解决投诉。各评论平台报告的用户摩擦点包括平台性能滞后、管理员学习曲线、小规模部署的定制化有限、缺少原生移动应用（仅有渐进式 Web 应用），以及因
              Amazon 库存约束导致的偶发奖励可用性缺口。缺少 NRR 队列数据是重大尽调缺口：没有它，99% 计划续约的调查信号无法转化为可与 SaaS 同业基准比较的财务留存指标。
