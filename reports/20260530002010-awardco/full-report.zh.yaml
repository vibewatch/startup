      - number: '1.5'
        title: 关键里程碑和战略事件
        blocks:
          - type: paragraph
            body: >-
              Awardco 的时间线从 2012 自筹创立开始，随后经历融资、产品、合作和邻近负面事件。2017 启动的 Amazon Business 合作，是公司历史上最重要的战略事件：它给 Awardco
              带来独家差异化抓手——以零加价接入全球最大消费品目录——竞争对手一直难以复制。October 2021 Series A 将 Awardco 从几乎无人知晓的自筹公司，推成接近独角兽的 HR SaaS
              公司。May 2025 Series B 跨过 $1 billion 估值门槛，扩大了公司的品牌、人才吸引力和全球基础设施雄心。August 2025 出现一项重要邻近负面事件：网络安全公司 Mimecast
              发布研究，识别出一场自 May 2025 发起、持续数月的钓鱼活动，该活动在邮件和 QR code 中冒充 Awardco 平台，被归因于威胁行动 MCT03028。虽然该活动来自外部行为者，并非 Awardco
              自身行为，但它引入品牌信任风险：客户组织员工可能开始警惕合法的 Awardco 沟通，组织也可能因 Awardco 主题诱饵导致凭证被盗而面临责任。产品方面，Awardco 于 May 14, 2026 推出
              AI 激励套件 Awardco Intelligence，并于 May 15, 2026 获得 American Business Awards 颁发的 Bronze Stevie Award for
              Product Innovation。Awardco 的旗舰 HR 技术活动 RCGNZ Summit 定于 November 9–11, 2026 在 Utah 州 Park City 的 Montage
              Deer Valley 举办。
