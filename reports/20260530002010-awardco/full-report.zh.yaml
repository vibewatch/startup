      - number: '4.5'
        title: 财务结论与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              收入质量评估：Awardco 的 SaaS 订阅模式没有商品加价收入，收入质量较强——经常性、合同化、年度续约，且不依赖波动较大的交易量。零加价奖励模式消除了供应链或 Amazon
              定价变化挤压公司毛利率的风险，但也让履约连续性依赖 Amazon Business（反向标记：见证据缺口 EG003）。

              毛利路径：估计 70–85% 的毛利率区间符合高质量 SaaS 特征，但确切数字未知。平台规模扩大后，服务新增用户的边际成本较低，增量毛利率应有扩张空间。没有烧钱数据，无法判断经营利润率。

              资本强度：低。Awardco 是纯软件业务，没有实体库存、制造或重大资本开支。奖励履约资本开支为零（物流由 Amazon 承担）。主要资金用途是员工数（研发、销售、客户成功）和云基础设施。

              尽调阻断项：缺少 NRR、毛利率、CAC、回本周期和经审计烧钱数据，仅凭公开数据无法完成 Series C 或老股投资判断。表 TI005
              中五项具体缺口均是重要数据室要求。评论平台（ITQlick、Vendr、SpendHound）记录的定价不透明和 Amazon 依赖问题，是面向客户的财务风险，应在客户访谈中做压力测试。
