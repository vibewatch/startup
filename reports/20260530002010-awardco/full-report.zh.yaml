chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份和商业模式
        blocks:
          - type: paragraph
            body: >-
              Awardco 是一家私有 HRTech 软件公司，注册地在 Utah 州 Lindon。公司由 Steve Sonnenberg 于 2012
              创立，搭建云端员工认可与奖励平台，让组织通过统一市场庆祝并激励员工。它的一句话商业模式是平台费，加上任意预算的认可项目，并对奖励零加价交付——这与通常对商品加价 20–40%
              的传统目录型供应商区分明显。平台覆盖同事间认可、服务周年里程碑、基于绩效的激励、生活方式支出账户、倾听与参与度模块（Awardco Engage），以及截至 May 2026 推出的 AI 层 Awardco
              Intelligence。Awardco 的公开使命是成为「全球最积极的平台，赋能各地人们识别善意、激励改善、奖励卓越」。公司总部位于 2080 W 400 N, Suite 200, Lindon, UT
              84042，并于 2024 在 London 开设办公室服务 EMEA 客户。Awardco 已完成 Series B 融资，现金流为正，并在 May 2025 估值超过 $1 billion
              后自称「独角兽」。该平台是唯一成为 Amazon Business 重点合作伙伴的员工认可解决方案，可提供数亿件奖励商品、免费配送且无隐藏费用。截至 May 2026，Awardco LinkedIn
              资料显示员工数为 677，服务 163 个国家的 3,000 多家组织。收入细节和 ARR 未公开；本章证据缺口部分列出了这些指标的尽调路径。
