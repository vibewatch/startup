      - number: '8.2'
        title: 当前估值背景与可比公司组
        blocks:
          - type: paragraph
            body: >-
              Awardco 目前估值为 $1.0B+，由 2025 年 5 月 Series B 确定；SEC Form D 文件（Accession No. 0001799778-25-000006，提交于
              2025-07-08）予以确认，领投方 Sixth Street Growth 和法律顾问 Goodwin Law 也相互印证。累计披露融资为 $235M，分三轮。以 $1B 为锚、估计 2025 年 ARR 为
              $100–121M 计算，隐含 ARR 倍数约为前瞻收入的 8–10x、历史收入的 13x（按 2024 年 $75.2M ARR）。资本效率比率（估值 / 累计融资）为
              4.25x，显示增长有资本纪律。Series B 价格较 Series A（2021）$900M 隐含估值小幅上行，说明投资人定价的是克制增长，而不是亢奋增长。最相关直接可比公司是 Workhuman，其估值
              $1.2B，ARR 约 $1.15–1.2B，隐含 ARR 倍数为 1x；这个倍数反映成熟竞争对手里，市场把盈利能力和规模放在增长之前。Awardco 的溢价倍数（9–13x）对比 Workhuman 的
              1x，说明市场愿意为增长率付费，而不只是为规模付费。Eqvista 数据库里的私有 SaaS 公司在 2025 年 Q1 的 ARR 倍数中位数为 16.1x，最高增长公司拿到上沿估值；Awardco 的
              9–13x 略低于中位数，考虑到 ARR 增长 73%，可以说偏保守。相对上市可比公司，Awardco 明显溢价：SEG SaaS Index 在 1Q26 的中位数为 3.6x，SaaS M&A 平均为
              6.3x。增长率能解释这部分溢价，但如果公开市场倍数持续低迷，退出窗口会被压缩。具体到 HR tech 垂直领域，Meridian Capital 2025 年 Q4 更新显示，员工敬业度 SaaS
              仍具韧性，M&A 买家优先看 AI 分析、留存和 HRIS 集成——Awardco 正在投入这三个方向。
