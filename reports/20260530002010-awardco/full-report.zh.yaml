            title: 用户负面反馈集中在定价不透明和支持质量
            body: >-
              来自 Capterra（4,616 条评论）、Software Advice 和 ITQlick 的独立评论记录了 Awardco 的反复批评：实施后支持响应延迟、Amazon
              商品可用性规则令人困惑、企业定价复杂且不透明、管理配置成本高于预期。ITQlick 给定价透明度 6/10，并指出可比平台成本为 $3–6/user/month——这把 Awardco
              框定为买方可能无法预先验证的潜在溢价。这些弱点给公开定价的竞争对手（Nectar HR、Motivosity）和履历更长的企业级替代方案（Workhuman）提供杠杆。Awardco 应投入定价透明度和售后支持
              SLA，压缩这块竞争暴露面。
