      - number: '4.4'
        title: 资本充足性与融资
        blocks:
          - type: paragraph
            body: >-
              Awardco 的融资历史已在公司概况章节详述。就资本充足性分析而言，当前最关键的事实是：Awardco 于 2025 年 3 月完成 $165M Series B 轮，SEC Form D（Accession
              No. 0001799778-25-000006，2025-07-08 申报）予以确认，使三轮公开披露融资总额达到 $235M。该轮由 Sixth Street Growth 领投，Spectrum
              Equity、General Catalyst 和 Ryan Smith（HXCO/Qualtrics） 参投。

              Series B 轮交割时，公司称业务现金流为正，并保持「持续高增长」。若属实，$165M 融资更像是加速资金，而非 求生资金；资金用途指向产品创新（AI 功能、HRIS
              集成）、国际扩张（EMEA、伦敦办公室），以及工程和客户成功团队扩员。公司未公开披露债务或项目融资义务。

              缺少经审计财务数据，月度烧钱速度无法验证。以约 636 名员工和 B2B SaaS 成本常态（薪酬占烧钱的 65–75%，单名员工全包成本 $150–$200K/年）测算，$8M–$12M
              的示意性月度烧钱区间方向上合理；若仅对照 $165M 融资，在计入持续收入现金流入前，现金跑道约为 13–21
              个月。公司称现金流为正，意味着实际经营性现金消耗可能显著低于上述示意性总支出，但精确净烧钱未披露。逐轮融资时间线应引用公司概况章节；本章只提取当前资本充足性评估所需的声明。
