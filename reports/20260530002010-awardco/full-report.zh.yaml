              Awardco 管理层确认，在 $165M Series B 轮交割时（2025 年 3 月）业务现金流为正；一家 ARR 仍以约 73%
              同比增长的公司能做到这一点并不常见。该状态指向有纪律的单位经济和可自我维持的收入引擎。Series B 轮看起来是加速融资，而非延长现金跑道融资，降低了资本集中风险。
