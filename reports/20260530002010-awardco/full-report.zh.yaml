  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式和定价
        blocks:
          - type: paragraph
            body: >-
              Awardco 几乎全部收入来自向雇主客户收取的 SaaS 平台订阅费，定价依据包括活跃用户数、项目配置和合同期限。公司不公布价目表，所有合同均为定制报价。定价研究聚合方记录的 SMB 年合同价值平均约
              $37,251，企业合同价值平均约 $200,724；完整区间大约从每年 $12,000 到 $250,000+，取决于用户数和功能层级。ITQlick 出于指示性目的将起始人均成本放在
              $50/user/month；Vendr 数据集也证实，以竞争基准做锚的买方通常能在初始报价上获得 15–30% 折扣。

              平台层级被非正式描述为 Core（基础里程碑和服务奖）、Plus（即时认可和自动化）、Pro/Enterprise（完整套件，含全球支持、高级 HRIS 集成和 AI
              功能）。不提供免费试用，也没有免费版本。定价不透明是竞争评估中的明确摩擦点——潜在客户必须完成销售周期，才会收到任何成本指示。

              Awardco 的关键结构性特征是零加价奖励模式：员工按 Amazon 原生价格用积分兑换 Amazon Business 库存，Awardco
              不加收费用。这移除了行业长期存在的隐藏成本做法，也是公司声称的竞争差异化。Awardco 只通过平台订阅变现，不从奖励支出本身变现。奖励预算支出由雇主客户直接出资，是单独项目，不计入 Awardco 收入。
