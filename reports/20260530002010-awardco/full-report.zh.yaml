      - number: '7.4'
        title: 竞争替代风险
        blocks:
          - type: paragraph
            body: >-
              2026 年最重要的竞争风险，是 4 月 16 日 Workday Recognition（由 Achievers 提供）上线；这是直接嵌入 Workday Human Capital
              Management（HCM）的原生认可与奖励解决方案。Workday 集成 Achievers 的认可引擎，在 Workday UX 内交付同伴认可、覆盖 190
              个国家的积分兑换，以及围绕贡献者识别和技能可见性的 AI 洞察，且不需要单独供应商合同。HR Brew 确认了 Workday 的逻辑：嵌入式认可减少供应商碎片化，并把认可预算证明为留存工具，而非独立 SaaS
              采购。这给 Awardco 带来捆绑蚕食风险：拥有 Workday HCM 合同的企业买家可能选择原生认可，而不是单独订阅 Awardco。

              UCToday 2026 年 HRTech 集成分析引用 Deloitte Global Human Capital Trends，记录 10 位业务领导者中有 7
              位优先追求通过集成平台获得速度与敏捷性，说明独立认可工具面临结构性逆风。Tracxn 识别该类别中 1,068 家活跃竞争对手，其中 163 家已融资，66 家已退出。认可功能向 HCM
              套件收敛（Workday+Achievers、Microsoft Viva）带来的平台捆绑风险，不同于直接功能竞争，可能压缩 Awardco 在大型企业账户中的总可用市场。Awardco 的 Amazon
              目录深度和零加价模式短期内仍是竞争护城河，但持续差异化需要证明原生 HCM 捆绑无法匹配的结果。
