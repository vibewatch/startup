              根据 LATKA 数据，Awardco 2024 年报告约 $75.2M ARR（较 2023 年 $43.4M 同比增长 73%），并于 2025 年 3 月以 $1B+ 估值完成 $165M Series
              B。公司自称现金流为正，但未披露 FY2025 或 FY2026 的经审计财务数据、NRR、毛利率、CAC 或烧钱速度，限制了外部对 Series B 后资本充足性和单位经济质量的独立评估。2026
              年估计人均收入约 $178K，高于该阶段 B2B SaaS 中位数，符合高毛利订阅模式，但在缺少经审计数据时仍只是估计数字。

              治理风险来自 General Catalyst（Series A 领投）、Spectrum Equity 和 Sixth Street Growth（Series B）累计投入的
              $235M。治理权、董事会组成、优先股堆叠和清算条款均未公开披露。Sixth Street Growth 是偏信用的成长投资者，其工具可能带有结构化条款，影响未来融资灵活性或退出可选项。FedRAMP
              合规打开美国联邦市场准入，但也带来更高的年度运营授权维护成本。私人公司不透明、未披露治理条款，以及 AI 功能扩张进入受监管 ADMT 领域，这几层叠加形成财务与合规风险，需要在直接尽调中确认。
