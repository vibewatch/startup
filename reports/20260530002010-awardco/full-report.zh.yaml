  - id: FV001
    title: 建议逻辑链
    type: flow
    layout: standard
    summary: Awardco 的规模、验证、护城河、经济性和风险因素如何导向 TRACK 建议，以及哪些条件会把结论推向 BUY 或 AVOID。
    data:
      nodes:
        - id: growth
          label: ARR 增长 73%（2024）
          detail: $43.4M → $75.2M；3 年 CAGR 约 44%；产品市场匹配的强证据
          tone: positive
        - id: cashflow
          label: 现金流为正
          detail: Series B 阶段有 VC 支持的 SaaS 中少见；经营杠杆信号强，但没有审计证明
          tone: positive
        - id: moat
          label: Amazon Business 独家护城河
          detail: 300M+ 选项；零加价；2017 年以来独家；同行无法直接复刻
          tone: positive
        - id: multiple
          label: 9–13x ARR 进入倍数
          detail: $1B+ 对应 2024 ARR $75M；高于上市公司中位数（3.6x），但低于私有高增长中位数（16x）
          tone: warning
        - id: missing
          label: NRR / 毛利率未披露
          detail: 关键估值驱动因素不可得；基准情景置信区间 ±50%
          tone: warning
        - id: risk
          label: Amazon 依赖风险
          detail: 单一供应商集中；任何 API 或排他性变化都会触发投资论点破裂
          tone: negative
        - id: recommendation
          label: TRACK（继续研究）
          detail: 业务质量强；进入价格敏感；BUY 前需补齐尽调
          tone: warning
      edges:
        - from: growth
          to: recommendation
          label: 支持判断，但不能覆盖价格顾虑
        - from: cashflow
          to: recommendation
          label: 降低下行风险；支撑基准情景
        - from: moat
          to: recommendation
          label: 主要牛市驱动因素
        - from: multiple
          to: recommendation
          label: 需要进入价格纪律
        - from: missing
          to: recommendation
          label: 只能给中等置信度
        - from: risk
          to: recommendation
          label: 一旦发生即触发下调
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV009
      - CV012
      - CV020
  - id: FV002
    title: EV / ARR 倍数基准与 Awardco 进入价格
    type: bar
    layout: standard
    summary: 对比上市 SaaS 中位数、SaaS M&A 平均、私有 SaaS 高增长中位数、Workhuman，以及 Awardco Series B 基于历史和前瞻 ARR 的隐含倍数。
    approximationNotes: >-
      上市 SaaS 中位数（3.6x）和 M&A 平均（6.3x）来自 SEG 2026 年 Q1 报告。私有 SaaS 高增长中位数（16x）来自 Eqvista 2025 年 Q1。Workhuman（约 1x）根据 Latka
      ARR 数据和 PitchBook 估值计算。Awardco 历史倍数（13x）= $1B / $75.2M 2024 ARR；前瞻倍数（9x）= $1B / ~$110M 2025E ARR。所有数值均为近似，未经审计。
    data:
      items:
        - label: 上市 SaaS 中位数（SEG 1Q26）
          value: 3.6
        - label: SaaS M&A 平均值（SEG 1Q26）
          value: 6.3
        - label: HR Tech SaaS 区间（Windsor Drake / Meridian）
          value: 6
        - label: 私有 SaaS 增长中位数（Eqvista Q1 2025）
          value: 16.1
        - label: Workhuman（直接可比，成熟期）
          value: 1
        - label: Awardco 前瞻 ARR 倍数（~9x）
          value: 9
        - label: Awardco 历史 ARR 倍数（~13x）
          value: 13
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV015
      - CV016
      - CV017
      - CV019
  - id: FV003
    title: Awardco 分情景估值与回报区间
    type: range
    layout: standard
    summary: 在三个情景下，由低（熊市）到高（牛市）的隐含企业价值，基于 2027E ARR 估计和各情景退出倍数。中点反映基准情景。
    approximationNotes: >-
      所有区间都是基于公开数据点（Latka 2024 ARR、Compworth/ZoomInfo 2025 估算）外推 ARR，并结合 SEG/Windsor Drake
      倍数基准得出的情景估算。没有可用的审计财务数据；不确定性区间很宽。
    data:
      items:
        - label: 熊市情景（2027E $100–120M ARR × 4–5x）
          low: 400
          mid: 550
          high: 700
          note: Amazon 中断或 CAGR <20% 会触发倍数压缩，落到上市公司等价水平
        - label: 基准情景（2027E $150–180M ARR × 6–8x）
          low: 900
          mid: 1350
          high: 1800
          note: 25–35% CAGR、Amazon 合作稳定，按 $1B 进入估值回报 1.0–1.8x
        - label: 牛市情景（2027E $200–220M ARR × 8–10x）
          low: 1600
          mid: 2250
          high: 3200
          note: 40%+ CAGR、NRR >120%、AI 加售，IPO 或战略出售时按前瞻 ARR 8–10x
        - label: 当前 Series B 锚点
          low: 1000
          mid: 1000
          high: 1000
          note: 2025 年 5 月新闻稿与 SEC Form D 披露的投后估值
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV023
      - CV026
      - CV027
  - id: FV004
    title: 投资 KPI — IC 可用评分
    type: kpi
    layout: wide
    summary: 围绕市场、验证、护城河、经济性、风险、估值和证据质量打分；琥珀色项目在给出 BUY 前需要尽调解决。
    data:
      items:
        - label: 市场机会
          value: 7 / 10
          detail: $1.1–1.3B 平台软件 TAM，CAGR 10–15%；相邻的敬业度 / 激励市场更大
          tone: positive
        - label: 产品 / 平台验证
          value: 8 / 10
          detail: 3,000+ 企业客户；6M+ 用户；163 个国家；G2 Top 100；Capterra 平均 4.9/5
          tone: positive
        - label: 竞争护城河
          value: 7 / 10
          detail: 2017 年以来独家 Amazon Business 集成；零加价模式同行无法复刻；优势强，但集中在单一供应商
          tone: positive
        - label: 财务质量
          value: 5 / 10
          detail: 现金流为正且 ARR 增长 73%，表现突出；NRR、毛利率、CAC 均未披露 — 证据缺口
          tone: warning
        - label: 估值纪律
          value: 5 / 10
          detail: 9–13x ARR 相比 3.6x 上市公司中位数偏高；只有增长持续且 NRR 质量过硬才可支撑，目前尚未验证
          tone: warning
        - label: 风险画像
          value: 5 / 10
          detail: Amazon 单一供应商依赖；HCM 捆绑压力；定价不透明；品牌钓鱼风险
          tone: warning
        - label: 投资人质量
          value: 9 / 10
          detail: Sixth Street Growth（$100B+ AUM）、Spectrum Equity（2B 基金）、General Catalyst、Ryan Smith（HXCO/Qualtrics）
          tone: positive
        - label: 证据质量
          value: 5 / 10
          detail: 无审计财务数据；NRR / 毛利率未披露；所有财务主张均基于自报或估算数据
          tone: warning
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV007
      - CV008
      - CV012
