            title: Amazon 依赖带来集中风险和库存敞口
            body: >-
              Awardco 的奖励目录完全依赖 Amazon Business 的库存、可用性和地理覆盖。区域性商品可能不可用或缺货，在 Amazon Business 覆盖深度不足的市场削弱员工体验。Amazon
              Business 合作一旦在合同、财务或战略层面恶化，Awardco 就必须从零重建奖励目录，并削弱其主要差异化。
