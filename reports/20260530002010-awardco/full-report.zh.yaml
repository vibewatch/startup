  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块架构
        blocks:
          - type: paragraph
            body: >-
              Awardco 是一套云端员工认可、奖励与敬业度平台，服务 3,000+ 家组织，覆盖 163 个国家、超过 6M
              用户。核心价值主张很直接：用一个统一数字平台替代碎片化、手工或目录式奖励项目，把认可、激励、里程碑、生活方式消费和敬业度调查放进员工每天已在使用的同一系统。平台以多租户 SaaS 交付，可通过网页浏览器、渐进式
              Web 应用（PWA）访问，并自 2025 年 12 月起提供原生 iOS 和 Android 移动应用。 Awardco
              模块覆盖员工认可全生命周期：点对点社交认可、经理驱动的奖励、自动化服务周年和生日项目、生活方式消费账户、与业务目标绑定的激励项目、全球奖励市场（由 Amazon Business 支撑），以及截至 2026 年的
              Awardco Engage（员工倾听和脉搏调查）与 Awardco Intelligence（AI 能力层）。平台按 Basic、Standard、Premium/Custom
              三档销售，每档解锁更多模块。价格未公开披露；客户必须申请演示以获取定制报价。平台宣称的使命，是成为补充任何 HRIS 的「面向员工的一线敬业度引擎」，而不是替代
              HRIS。这个定位反映出刻意的架构选择：Awardco 在既有 HR 基础设施之上提供认可、奖励和倾听层，依靠双向 HRIS 集成获取权威员工数据，而不是自建主记录系统。
