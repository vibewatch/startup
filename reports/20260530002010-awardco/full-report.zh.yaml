      - number: '6.5'
        title: 扩张与集中风险
        blocks:
          - type: paragraph
            body: >-
              Awardco 的扩张模型锚定先落地后扩张的动态：组织通常从单个认可项目起步，再在同一平台上扩展到多个项目。Utah Jazz 案例研究展示了跨受众扩张——同一平台先用于粉丝奖励，随后延伸到员工和 B2B
              伙伴认可。4Refuel 案例研究显示，10+ 个碎片化项目整合为一个项目，降低切换风险并提高单客户收入。Awardco Engage 和 Awardco Intelligence
              是相邻扩张方向，可在不获取新客户的情况下提升 ARPU 潜力。Brandon Hall Group 指出 Awardco 有意避免成为一体化 HR
              套件，降低了组合扩张风险，但也限制了单客户可触达收入总额。集中风险是结构性的：头部 Fortune 500 账户很可能贡献了不成比例的 ARR。Amazon Business
              排他合作给奖励履约带来单供应商依赖。SelectSoftwareReviews 指出只有 Amazon 配送商品可用；第三方市场卖家被排除。R&R Network 的负面评论显示，采用 ROI
              采购逻辑的企业买家可能要求比 Awardco 现有、聚焦流程指标的案例研究更深的结果证据。
