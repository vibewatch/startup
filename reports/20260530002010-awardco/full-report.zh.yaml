      - CI028
      - CI029
      - CI038
    data:
      nodes:
        - label: 客户获取（CAC：未披露）
          detail: 企业级 B2B SaaS 通过直销、SDR 外呼和渠道 / 合作伙伴推荐获客。行业 HR tech 基准显示，现阶段混合 CAC 为 $10K–$50K；Awardco 未披露自身数字。
        - label: 签署初始合同（ACV：SMB 约 $37K / 企业级约 $201K）
          detail: 年度合同价值就是每个客户每年的单位收入。企业级层级主导 ARR；SMB 合同提供覆盖广度。来源：SpendHound 匿名交易基准（未经公司确认）。
        - label: 每份合同年度毛利率（估计约 70–85%）
          detail: 高毛利 SaaS 平台，奖励履约 COGS 为零。按中位毛利率估算，企业级 ACV 每份合同毛贡献为 $26K–$170K；精确数字需要审计披露。
        - label: 净收入留存（NRR：未披露）
          detail: 投资人评论暗示，通过追加销售和扩张，NRR 高于市场。一项 115–130% 的 NRR 假设与顶四分位 B2B SaaS 一致，但尚未针对 Awardco 核验。
        - label: CAC 回收期（估计 12–24 个月）
          detail: 根据 ACV 和毛利率基准估算，未核验。18 个月回收期是这个规模企业级 SaaS 的典型水平。确认需要披露 CAC。
