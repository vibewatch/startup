              Awardco 公开披露的牵引力指标来自公司口径和第三方估算，并非经审计财务数据。最具体的数据点是 2024 年 年经常性收入（ARR）为 $75.2M（Latka 报道并引用创始人访谈），高于 2023 年的
              $43.4M，约合 73% 同比增长。若按保守递减的增速外推，2026 年收入合理区间可能在 $95M–$120M，但公司尚未披露 2026 年数字。第三方分析机构 Compworth 和 IncFact 估计
              2025–2026 年收入约为 $106.6M。

              公司称拥有 3,000+ 家企业和中端市场客户（公司新闻稿列举 AT&T、Adobe、Hertz 等 Fortune 500 客户），覆盖 163 个国家、6M+ 活跃用户。用户数和客户数尚未经过独立验证。ARR
              轨迹隐含的 2021–2024 年 CAGR（2021 年约 $25M → 2024 年 $75.2M）约为每年 44%，与一个留存较好、靠增购和 新客户获取扩张的 SaaS 客户底座相符。

              到 2026 年初，Awardco 员工数增至约 636 人（Tracxn 和 PitchBook 估算），较 2024 年增长约 34%，说明公司仍在投入商业化和产品扩张。2026 年未发现 WARN Act
              申报或已宣布裁员。人均收入（约 $178K）优于 SaaS 基准，说明该阶段运营效率较好。
