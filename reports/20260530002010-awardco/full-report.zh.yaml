      - number: '8.5'
        title: 附录材料
        blocks:
          - type: callout
            title: 观察 — 业务扎实，入场价偏高
            body: >-
              Awardco 是一家高质量公司：现金流为正、ARR 增长 73%、Amazon 独家护城河、顶级投资人，以及 3,000+ 企业客户。但 $1B+ 的 Series B 估值意味着 9–13x 历史
              ARR，而此时公开 SaaS 交易倍数为 3.6x，M&A 平均为 6.3x。要给出买入判断，需要满足四点：（1）NRR 高于 110%；（2）毛利率确认高于 75%；（3）Amazon
              合作合同条款已审阅且实质稳定；（4）前 10 大客户集中度低于 25%。在这些尽调项解决前，观察是合适立场。入场价格纪律——如果出现老股机会，目标价格低于 $1B——会实质改变风险调整后回报。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV012
              - CV013
              - CV030
          - type: callout
            title: Amazon 依赖是击穿投资逻辑的首要风险
            body: >-
              Awardco 的核心差异化——300M+ 零加价奖励选项——完全依赖独家 Amazon Business 合作能否延续。不同于软件功能或客户关系，如果 Amazon
              退出、重新谈判独家权，或直接进入认可软件领域，这条护城河无法重建。投资人在以超过 $500M 估值投入新资本前，应要求披露完整合作协议，包括独家范围、期限、API 访问费用和控制权变更条款。
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
              - CV031
          - type: callout
            title: 关键模型假设：ARR 外推
            body: >-
              本章所有情景估值都建立在外推之上：一个自行披露的 ARR 数据点（Latka / 创始人访谈显示 2024 年为 $75.2M），再加第三方对 2025 年的估计（Compworth/ZoomInfo 为
              $100–121M）。目前没有经审计财务报表。如果 ARR 被高估 10–20%（自行披露 SaaS 指标中很常见，因为递延收入或已承诺 ARR 口径可能不同），入场倍数会变成 10–16x
              历史收入，进一步进入偏高区间。这个假设应在任何投资决定前解决。
            calloutType: assumption
            claimRefs:
              - CV006
              - CV035
              - CV036
