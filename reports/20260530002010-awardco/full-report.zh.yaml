        title: 展示材料
        blocks:
          - type: callout
            title: Amazon Business 目录就是品类护城河
            body: >-
              Awardco 与 Amazon Business 的合作是其近期最可防守的竞争优势。300M+ 奖励商品无加价、无 Awardco 施加的履约费，带来目录广度和成本透明度；Workhuman
              的自有市场、Achievers 的品牌市场和 O.C. Tanner 的策展奖品目录都无法匹配。买方在采购中可以验证这条护城河，独立用户评论和分析师比较也确认它是真实差异化。
            calloutType: strength
