      - number: '1.4'
        title: 规模和运营指标
        blocks:
          - type: paragraph
            body: >-
              Awardco 已在全球服务超过 3,000 家组织，其中包括 AT&T、Pacific Life、Adobe 和 Hertz 等 Fortune 500 企业。May 2025 Series B
              公告显示，平台覆盖 163 个国家超过 600 万用户，奖励选项超过 3 亿个。Hertz 的部署体现了企业级规模：其 26,000 人全球员工队伍中 80% 为一线无桌面员工，使用 Awardco
              做同事认可、里程碑跟踪和品牌周边，员工净推荐值（eNPS）同比提升 7.6%。Awardco LinkedIn 公司资料在 May 2026 显示员工数为 677，与过去 12 个月员工数估计增长 34%
              相一致。公司称自创立以来一直现金流为正，并在进入 Series B 时处于「持续高速增长」状态——这是 Tanner Runia 在公告中的说法；但 ARR、收入运行率和毛利率均未公开。Capterra 显示超过
              4,616 条已验证用户评论，综合评分 4.9 / 5；G2 在 Spring 2026 报告中将 Awardco 评为企业、中型市场和小型企业细分的领导者，并授予 23 项称号。专家评测网站指出平台最低年费为
              $2,500，但详细报价需要与供应商沟通。
