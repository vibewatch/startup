  - id: FR003
    title: 依赖关系图 — 关键合作伙伴与平台依赖
    type: dag
    layout: wide
    summary: Awardco 平台的关键依赖关系，展示供应链、API、监管和资本依赖，以及风险流向。
    data:
      nodes:
        - id: awardco
          label: Awardco 平台
          detail: 核心 SaaS；677 名员工；163 个国家；现金流为正
          tone: positive
        - id: amazon_bus
          label: Amazon Business
          detail: 2017 年以来独家目录合作伙伴；300M+ 零加价奖励
          tone: risk
        - id: aws_api
          label: Amazon SP-API
          detail: 订购 / 履约 API；2026 年起每年 $1,400 费用，另加用量费
          tone: risk
        - id: prepaid
          label: 预付卡发行方
          detail: MyPrepaidCenter、Tango、Blackhawk；非 Amazon 奖励履约
          tone: warning
        - id: hris
          label: HRIS 集成伙伴
          detail: Workday、SAP、BambooHR、Slack、MS Teams；员工数据同步
          tone: neutral
        - id: cloud
          label: 云基础设施（AWS）
          detail: 平台托管与计算基础设施
          tone: neutral
        - id: investors
          label: 资本提供方
          detail: Sixth Street Growth、Spectrum Equity、General Catalyst；已融资 $235M
          tone: neutral
        - id: regulators
          label: 隐私监管机构
          detail: CPPA、FTC、EU DPAs；GDPR/CCPA 执法权
          tone: risk
      edges:
        - from: awardco
          to: amazon_bus
          label: 奖励目录与履约
        - from: amazon_bus
