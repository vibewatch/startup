  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 安全与网络风险
        blocks:
          - type: paragraph
            body: >-
              Awardco 持有广泛安全认证，包括 SOC2 Type II、ISO 27001、HIPAA、PCI、GDPR、CCPA/CPRA、FedRAMP 和 CSA Star Level
              1；公司发布的安全与合规页面以及 Nudge Security 的独立供应商风险档案均确认这一点。UpGuard 的连续监控将 Awardco 外部安全态势评为 91/100，Site24x7 截至 2026 年
              5 月独立给出 94/100（A 级）。截至 2026 年 5 月 30 日，UpGuard 监控、Nudge Security 评估或已审阅的主要新闻来源中，均未发现涉及 Awardco
              的公开确认数据泄露或安全事件。

              记录最明确的尖锐网络风险，是 Mimecast Threat Research 团队归因于威胁行动 MCT03028 的复杂品牌冒充和钓鱼活动。该活动自 2025 年 5 月起活跃并延续到 2026
              年，利用员工普遍预期 Awardco 奖励通知真实可信的心理，面向整个组织发起攻击。行动使用多阶段跳转链、二维码投递、SMS 分发，并滥用合法安全服务（AWS SES、Sophos、HubSpot、Google
              Sites）来规避检测。ANY.RUN 恶意软件沙箱独立确认了与 awardco.com 冒充域名相关的恶意钓鱼活动。Guard.io 将 Awardco 列为 2026 年 Q1 被积极冒充的品牌之一。虽然
              Awardco 自身平台未被攻破，品牌钓鱼仍会侵蚀终端用户信任，可能导致客户组织凭证被盗，并带来声誉责任。Awardco 的 SOC 运营中心、事件响应计划和 TLS 1.3/AES 256
              加密可缓解泄露影响，但任何供应商都无法完全阻止第三方品牌冒充活动。
