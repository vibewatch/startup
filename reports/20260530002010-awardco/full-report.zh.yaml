            body: >-
              Awardco 的 Amazon Business 排他合作伙伴身份建立于 2017 年，并在 2024 年 Integrated Ordering API 升级后得到强化，提供 300M+
              个零加价、免运费的奖励选项。没有竞争性认可平台拥有这一身份，形成了无法单靠内部产品开发复制的结构性优势。
