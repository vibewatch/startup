companyProfile:
  summary: >
    Awardco is a Lindon, Utah-based employee recognition and rewards software company founded in 2012
    by Steve Sonnenberg, Mike Sonnenberg, and Tanner Runia. The platform lets employers run peer
    recognition, service awards, incentives, lifestyle spending, and engagement programs while sourcing
    rewards through Amazon Business at zero markup. Public evidence indicates Awardco remained cash-flow
    positive while scaling to 3,000+ organizations, 6M+ users across 163 countries, and 300M+ reward
    options before raising a $165M Series B in 2025 that pushed valuation above $1B.
  foundedDate: "2012-01-01"
  founders:
    - name: "Steve Sonnenberg"
      role: "Co-Founder & CEO"
      background: "Public-facing co-founder who framed Awardco around modernizing legacy employee recognition and remains the core external voice of the business."
      claimRefs: [CO007]
    - name: "Mike Sonnenberg"
      role: "Co-Founder & CTO"
      background: "Co-founder responsible for platform architecture and engineering leadership as Awardco scaled its integrations and rewards marketplace."
