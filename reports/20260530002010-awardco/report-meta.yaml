      background: "Operational co-founder and president who has represented Awardco's growth, cash-flow-positive model, and expansion plans in financing communications."
      claimRefs: [CO009]
  foundingLocation: "Lindon, UT"
  headquarters: "Lindon, UT"
  productSummary: >
    SaaS platform for employee recognition, rewards, service anniversaries, incentives, lifestyle spending,
    surveys, and AI-assisted engagement analytics. The product's signature differentiator is its Amazon
    Business integration, which gives employers and employees access to 300M+ reward options with no markup.
  customerFocus: "Mid-market and enterprise employers running global recognition, engagement, and incentive programs across distributed workforces."
  businessModel: "B2B SaaS subscriptions priced by employee/user scale and program complexity; reward spend passes through to Amazon Business at native price rather than generating merchandise margin for Awardco."
  stage: "late-stage venture"
  fundingStatus: "$165M Series B (May 2025) led by Sixth Street Growth and Spectrum Equity at >$1B valuation; approximately $235M total disclosed funding including the 2021 $65M Series A."
