callouts:
  - calloutType: strength
    title: Amazon Business Exclusivity Is a Durable Competitive Barrier
    body: >-
      Awardco's exclusive Amazon Business partner status—established 2017 and reinforced with
      the 2024 Integrated Ordering API upgrade—provides 300M+ reward options at zero markup
      with free shipping. No competing recognition platform holds this designation, creating
      a structural advantage that cannot be replicated through organic product development alone.
    claimRefs:
      - CE023
      - CE005

  - calloutType: risk
    title: Amazon Dependency Creates Concentration Risk and Inventory Exposure
    body: >-
      Awardco's reward catalog depends entirely on Amazon Business's inventory, availability,
      and geographic coverage. Regional items can be unavailable or out of stock, degrading
      the employee experience in markets where Amazon Business does not operate at full depth.
      Any deterioration in the Amazon Business partnership—contractual, financial, or
      strategic—would require rebuilding the rewards catalog from scratch and undermine
      Awardco's primary differentiation.
    claimRefs:
      - CE036
      - CE023

  - calloutType: risk
    title: AI Roadmap Is Company-Claimed; Motivation Graph Evidence Is Thin
    body: >-
      Awardco Intelligence and the Motivation Graph are described entirely through company
      press releases and product pages with no independent technical validation. The claimed
      capabilities (Predictive Intelligence, Program Autopilot, Smart Nudges) remain on the
      roadmap without publicly disclosed timelines, and the architectural depth of the
      Motivation Graph dataset has not been independently verified.
    claimRefs:
      - CE024
      - CE009

  - calloutType: insight
    title: Dual Mobile Strategy Targets Deskless Workforce at Scale
    body: >-
      Awardco's November 2025 native app launch combined with its existing PWA gives it the
      most flexible mobile deployment of any recognition platform in the market. With 80%
      of the global workforce working away from desks, this dual strategy directly addresses
      a market gap in manufacturing, healthcare, logistics, and retail recognition programs.
    claimRefs:
      - CE012
      - CE013
      - CE026

