  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: standard
    summary: >-
      Maturity and evidence strength of Awardco's major capability areas across four
      dimensions: product availability, evidence quality, differentiation strength,
      and diligence risk.
    data:
      columns:
        - Product Status
        - Evidence Quality
        - Differentiation Strength
        - Diligence Risk
      rows:
        - label: Amazon Rewards Marketplace
          values:
            - GA / Mature (since 2017)
            - High — official pages + press releases + reviews
            - Very High — exclusive Amazon Business partner
            - Low — core product; well-documented
        - label: Recognition Engine (peer, manager, auto)
          values:
            - GA / Mature (since 2015)
            - High — official + multiple third-party reviews
            - Medium — many competitors offer similar features
            - Low — well-established; no technical red flags
        - label: HRIS and SSO Integrations
          values:
            - GA / Broad coverage
            - Medium — help center docs + Okta SAML guide; depth varies
            - Medium — standard for enterprise HRTech
            - Medium — integration depth for non-Tier 1 HRIS unverified
        - label: Awardco Engage (Employee Listening)
          values:
            - GA V1 — January 2026
            - Medium — press releases + tech news; no independent review yet
            - Medium — early entry; Qualtrics and Culture Amp are mature competitors
            - Medium — ML and action planning still in development
        - label: Awardco Intelligence (AI Layer)
          values:
            - Beta/GA Mix — May 2026
            - Low-Medium — official newsroom only; Motivation Graph unverified
            - High (claimed) — proprietary dataset; MCP Server novel integration
            - High — ambitious roadmap; no independent AI validation
        - label: Mobile App (iOS/Android + PWA)
          values:
            - GA — Dec 2025 native app; PWA from earlier
            - Medium — press release + PRNewswire; limited user reviews
            - High — dual native+PWA strategy unique in recognition market
            - Low-Medium — full web feature parity not documented
    approximationNotes: >-
      Maturity assessments are based on official release dates and third-party review availability
      as of May 30, 2026. "Evidence Quality" and "Differentiation Strength" are qualitative
      judgments by the analyst based on available sources.
    claimRefs:
      - CE001
      - CE006
      - CE009
      - CE012
      - CE015
      - CE016
      - CE021

