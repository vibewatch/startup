  - id: differentiation-and-ip
    title: Differentiation, IP, and Competitive Moat
    body: >-
      Awardco's primary competitive moat is contractual and network-based: it is the only
      employee recognition platform to hold a featured partner status with Amazon Business,
      a relationship formed in 2017 that grants access to Amazon's Integrated Ordering API
      and the full Amazon Business catalog at zero markup. Competitors cannot replicate this
      partnership without Amazon's consent, making it a durable barrier as long as the
      exclusivity holds. The platform also claims a proprietary Motivation Graph—a
      longitudinal behavioral dataset accumulated over a decade across thousands of
      organizations—that is intended to underpin the Awardco Intelligence AI roadmap.
      This dataset, if genuine, would constitute a meaningful data moat; however, its
      architecture, accuracy, and the degree to which it drives measurably better outcomes
      versus generic ML models has not been independently verified. Additional
      differentiation includes the dual mobile strategy (native app + PWA) that competitors
      lack; multi-currency, multi-country support across 135 countries and 163 currencies;
      1:1 point-to-dollar value with no redemption fees; and an open API with documented
      third-party integrations (Domo, ScreenCloud, Okta, Workday). The platform's
      architecture explicitly avoids becoming a system of record—it is designed to integrate
      with rather than displace HRIS vendors, reducing the sales barrier and the scope of
      competition with incumbents like Workday and SAP SuccessFactors.
    claimRefs:
      - CE023
      - CE024
      - CE025
      - CE026
    figureRefs:
      - FE004

  - id: trust-security-compliance
    title: Trust, Security, and Compliance
    body: >-
      Awardco holds a SOC 2 Type II certification covering all five Trust Services Criteria:
      Security, Availability, Processing Integrity, Confidentiality, and Privacy. The
      certification attests to the operating effectiveness of controls over a multi-month
      audit period, not just their design, providing enterprise buyers with assurance on
      data handling practices. Data in transit is protected via TLS 1.2 and data at rest
      via AES 256-bit encryption. Authentication supports SSO (SAML 2.0, compatible with
      Okta, Azure AD, CyberArk, RSA SecurID), multi-factor authentication (MFA), and
      one-time passwords (OTP). A Security Operations Center provides 24/7 threat monitoring.
      Awardco's AI design principles explicitly state that the platform does not train on
      user-identifiable or client-specific organizational data, addressing a common enterprise
      concern about AI platforms ingesting sensitive employee information. The SOC 2 report
      is available to clients on request through the RFP process. Significant diligence gaps
      remain: uptime SLA and historical reliability metrics are not publicly published,
      data-residency options for GDPR-regulated EU customers are not documented on public
      surfaces, and there is no publicly visible security.txt, bug bounty program, or
      penetration test disclosure. The platform has not published any significant outage
      post-mortems, but absence of public disclosure does not confirm absence of incidents.
    claimRefs:
      - CE015
      - CE016
      - CE027
