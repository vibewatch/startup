chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Awardco delivers a cloud-based employee recognition and rewards platform built around an
    exclusive Amazon Business API integration, a growing AI capability layer (Awardco Intelligence,
    launched May 2026), and a newly shipped employee listening module (Awardco Engage, January 2026).
    The platform is architecturally mature with SOC 2 Type II certification, AES-256 encryption,
    SAML 2.0 SSO, and a REST API ecosystem, though deep technical details (exact stack, uptime SLA,
    data-residency policies) remain undisclosed. Key differentiation rests on the exclusive
    Amazon Business partnership providing 300M+ zero-markup reward options and the proprietary
    Motivation Graph dataset that underpins the AI roadmap.

sections:
  - id: product-definition-and-modules
    title: Product Definition and Module Architecture
    body: >-
      Awardco is a cloud-based employee recognition, rewards, and engagement platform serving
      3,000+ organizations and six million-plus users across 163 countries. Its core value
      proposition is simple: replace fragmented, manual, or catalog-based reward programs with a
      unified digital platform that delivers recognition, incentives, milestones, lifestyle
      spending, and engagement surveys—all within one system employees already use daily. The
      platform is delivered as a multi-tenant SaaS application accessible via web browser, a
      Progressive Web App (PWA), and, since December 2025, native iOS and Android mobile apps.
      Awardco's modules span the full employee recognition lifecycle: peer-to-peer social
      recognition, manager-driven awards, automated service-anniversary and birthday programs,
      lifestyle spending accounts, incentive programs tied to business objectives, a global
      rewards marketplace (powered by Amazon Business), and, as of 2026, Awardco Engage
      (employee listening and pulse surveys) and Awardco Intelligence (an AI capabilities
      layer). The platform is sold in three tiers—Basic, Standard, and Premium/Custom—with
      each tier unlocking additional modules. Pricing is not publicly disclosed; customers must
      request a demo for custom quotes. The platform's stated mission is to serve as the
      "front-of-house engagement engine" that complements any HRIS rather than replacing it.
      This positioning reflects a deliberate architectural choice: Awardco provides the
      recognition, rewards, and listening layer on top of existing HR infrastructure, relying on
      bidirectional HRIS integrations for authoritative employee data rather than building its
      own system of record.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE014
      - CE037
    tableRefs:
      - TE001
    figureRefs:
      - FE001

  - id: platform-architecture-and-integrations
    title: Platform Architecture and Integration Ecosystem
    body: >-
      Awardco's technical architecture centers on a cloud-hosted SaaS platform with an integration
      layer that connects to Amazon Business via the Integrated Ordering API for real-time order
      placement and tracking. On the front-of-house side, employees interact through the web
      application, PWA, or native mobile apps; administrators manage programs, budgets, and
      reporting through an admin console. The platform bridges to enterprise systems via a
      documented REST API (available at api.awardco.com), a SAML 2.0 SSO layer compatible with
      Okta, Azure AD, CyberArk, and RSA SecurID, and a library of pre-built connectors covering
      major HRIS providers (Workday, BambooHR, SAP SuccessFactors, ADP), collaboration tools
      (Slack, Microsoft Teams), and analytics platforms (Domo). Awardco Connect handles custom
      integrations not covered by the standard library. The ScreenCloud connector demonstrates
      the developer-extensibility of the REST API: Awardco exposes a Custom Feed API endpoint
      at [company].awardco.com/settings/advanced?tab=apiSettings that refreshes recognition data
      every six minutes and supports metadata filtering so recognitions can be routed to
      specific office displays. Amazon Business integration has evolved since its 2017 inception
      from a basic catalog link to a full Integrated Ordering API implementation delivering
      real-time order and tracking synchronization, centralized spend transparency, and
      hands-free fulfillment. Integration depth with HRIS systems is a known differentiator:
      Awardco imports employee records, automates milestone awards on life events, and supports
      country-specific award redemption across 135 countries. The platform operates globally
      across 163 currencies with 50+ language support for recognition and UI experiences.
    claimRefs:
      - CE005
      - CE017
