  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing
      missingEvidence: >-
        Exact per-seat or per-module pricing, minimum annual contract value, and
        enterprise discount structures are not publicly available.
      whyItMatters: >-
        Without pricing data, it is impossible to assess competitive price positioning,
        CAC payback, or whether Awardco's list price has changed post-Series B.
      diligencePath: >-
        Request pricing from Awardco sales and cross-reference with reported minimum
        annual fee of $2,500 from expert review sites; obtain customer invoices if available.
      relatedQuestionRefs:
        - QE020

    - type: missing-source
      severity: material
      topic: cloud-infrastructure
      missingEvidence: >-
        Awardco's cloud hosting vendor(s), data center regions, and data-residency
        commitments for GDPR-regulated EU customers are not publicly documented.
      whyItMatters: >-
        Enterprise customers in the EU require contractual assurances on data residency;
        lack of documentation creates a sales barrier in European markets.
      diligencePath: >-
        Request Awardco's Data Processing Agreement (DPA) and sub-processor list; ask
        which cloud regions are used for data storage.
      relatedQuestionRefs:
        - QE005
        - QE025

    - type: missing-source
      severity: material
      topic: uptime-reliability
      missingEvidence: >-
        No public uptime SLA, status page, historical incident reports, or
        penetration test summary has been found for Awardco's platform.
      whyItMatters: >-
        Enterprise buyers require uptime guarantees; the absence of a public status page
        or SLA disclosure is unusual for a platform claiming 3,000+ enterprise customers.
      diligencePath: >-
        Request SLA documentation; ask for status page URL; review SOC 2 availability
        section in audit report; ask for penetration test executive summary.
      relatedQuestionRefs:
        - QE028

    - type: missing-source
      severity: minor
      topic: motivation-graph
      missingEvidence: >-
        No independent technical validation, dataset size disclosure, or third-party audit
        of the Motivation Graph dataset or Awardco Intelligence model quality has been
        published.
      whyItMatters: >-
        The Motivation Graph is presented as Awardco's primary AI moat; without independent
        verification, the claim is indistinguishable from marketing language.
      diligencePath: >-
        Request technical whitepaper or data sheet on Motivation Graph architecture;
        ask for benchmark results showing AI feature accuracy vs. baselines.
      relatedQuestionRefs:
        - QE019

    - type: enumeration-incomplete
      severity: minor
      topic: integrations
      missingEvidence: >-
        The full list of integration partners in Awardco's integration library is not
        publicly enumerated; only select named HRIS and collaboration tools are confirmed.
      whyItMatters: >-
        Integration breadth is a key enterprise buying criterion; incomplete enumeration
        makes competitive comparison with Workhuman or Achievers difficult.
      diligencePath: >-
        Request the full Awardco integration library list from the sales team; review
        awardco.com/platform/integrations for the complete filterable library.
      relatedQuestionRefs:
        - QE004

acknowledgedWarnings:
  - dimension: paywallRisk
    reason: >-
      Three sources (SE021, SE022, SE024) are js-only from awardco.my.site.com, a Salesforce
      Experience Cloud portal that requires JavaScript execution not supported by the fetch-url
      tool. These help-center articles are official Awardco documentation pages whose substance
      is independently corroborated by accessible sources (SE019, SE007, SE008). Total
      js-only share in this chapter is 3 of 25 sources (12%), well below the 30% report-level ceiling.
