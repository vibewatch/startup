figures:
  - id: FE001
    title: Product architecture map
    type: stack
    layout: standard
    summary: >-
      Awardco's five-layer platform stack, from employee-facing channels through the
      recognition engine and data layer to external service dependencies.
    data:
      layers:
        - label: Employee Channels
          detail: >-
            Web App (browser, full feature parity); Progressive Web App (custom branding, no install,
            always current); Native iOS and Android App (Dec 2025, biometric login, frontline support);
            Kiosk (on-premise collection); Slack and MS Teams bots (in-workflow recognition)
        - label: Recognition and Engagement Engine
          detail: >-
            Peer recognition (social feed, multi-recipient, badges); Manager awards (budget-controlled,
            approval workflows); Automated milestones (HRIS-triggered anniversaries, birthdays, onboarding);
            Awardco Engage surveys (award-incentivized pulse, annual, exit); Awardco Intelligence AI
            (Recognition Assistant, Team Summary, Suggested Search, MCP Server beta)
        - label: Rewards Marketplace
          detail: >-
            Amazon Business catalog (300M+ items, zero markup, free shipping, Integrated Ordering API);
            Gift cards and experiences (Priceline hotels, virtual gift cards, charity donations);
            Custom curated catalogs (admin-defined product selections per program)
        - label: Platform Integrations and API
          detail: >-
            REST API at api.awardco.com (key-authenticated, GET and POST, used by Domo and ScreenCloud);
            SAML 2.0 SSO (Okta, Azure AD, CyberArk, RSA SecurID, IdP- and SP-initiated);
            HRIS connectors (Workday, BambooHR, SAP SuccessFactors, ADP, bidirectional data sync);
            Awardco Connect (custom integrations not in standard library)
        - label: Data and Intelligence Layer
          detail: >-
            Motivation Graph proprietary dataset (cross-org behavioral data, recognition patterns,
            reward preferences, engagement signals); Analytics Engine (real-time dashboards, ROI reporting,
            sentiment analysis); Compliance and Security (SOC 2 Type II, AES-256, TLS 1.2, 24/7 SOC)
    approximationNotes: >-
      Cloud hosting vendor not publicly disclosed by Awardco. Layer ordering reflects
      functional architecture inferred from product documentation and press releases.
