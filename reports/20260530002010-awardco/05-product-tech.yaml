  - id: ai-capabilities-and-roadmap
    title: AI Capabilities, Recent Launches, and Product Roadmap
    body: >-
      The most significant product activity of 2025–2026 has been a three-wave expansion:
      the native mobile app launch (December 2025), the Awardco Engage employee listening
      module (January 2026), and the Awardco Intelligence AI layer (May 2026). Together these
      releases signal a deliberate platform pivot from a point recognition tool toward a
      comprehensive front-of-house engagement suite. Awardco Engage introduced customizable
      survey templates (annual, pulse, onboarding, exit), award-enabled participation incentives
      to boost response rates, anonymous/confidential feedback modes, multi-channel delivery
      across the mobile app, kiosks, Slack, and Microsoft Teams, and real-time dashboards with
      sentiment analysis, benchmarking, and team-level reporting. Planned expansions to Engage
      include guided action planning, machine-learning-powered recommendations, and integrated
      outcome tracking. Awardco Intelligence launched in May 2026 with a set of AI capabilities
      built on over a decade of platform behavior data: a Recognition Assistant for generating
      authentic recognition messages, a Team Recognition Summary for recognition health snapshots,
      Experiences Intelligence for traveler-sentiment summaries, Suggested Search for
      context-aware reward discovery, 50+ language localization, and Themes & Summary for surfacing
      what makes individual employees unique. An Awardco MCP Server (beta) enables HR teams to
      query Awardco data using external AI tools (ChatGPT, Claude, Copilot) via natural language
      without data being ingested for model training. The long-term AI roadmap centers on the
      Motivation Graph—a proprietary dataset combining recognition patterns, reward preferences,
      engagement signals, and behavioral trends—and future capabilities including Awardco Assist
      (an always-on AI analyst), Program Autopilot, Smart Nudges, Predictive Intelligence, and
      Intelligent Benchmarks. These capabilities are company-claimed and have not been
      independently corroborated at the level of architectural detail.
    claimRefs:
