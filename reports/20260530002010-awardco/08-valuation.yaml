  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: NRR and gross margin
      missingEvidence: "Audited net revenue retention rate, gross margin percentage, and customer acquisition cost payback period"
      whyItMatters: "These are the primary drivers of SaaS valuation; without them, the $1B entry price rests on growth rate alone with no margin-quality anchor"
      diligencePath: "Management data-room request; cross-check reported NRR against cohort revenue data in audit package"
      relatedQuestionRefs:
        - QV017
        - QV018

    - type: private-evidence-only
      severity: blocking
      topic: Amazon contract terms
      missingEvidence: "Full text or material terms of the Amazon Business exclusivity agreement including duration, renewal conditions, exclusivity scope, and API access fee structure"
      whyItMatters: "The Amazon partnership is Awardco's primary moat; any term enabling Amazon to reduce exclusivity or exit the arrangement would eliminate the core differentiation"
      diligencePath: "Direct review of Awardco–Amazon Business master services agreement and amendments; legal counsel to review change-of-control provisions"
      relatedQuestionRefs:
        - QV014

    - type: private-evidence-only
      severity: material
      topic: cap table and preference stack
      missingEvidence: "Fully diluted capitalization table including all preferred class terms, liquidation preferences, anti-dilution provisions, and employee equity pool"
      whyItMatters: "Liquidation preferences from $235M in raised capital could absorb a significant portion of exit proceeds in sub-$2B scenarios, materially impacting common equity return calculations"
      diligencePath: "Standard data-room disclosure; review with qualified M&A counsel"
      relatedQuestionRefs:
        - QV026

    - type: private-evidence-only
      severity: material
      topic: customer concentration
      missingEvidence: "Top-10 and top-20 customer ARR as a share of total ARR, with identification of any customers exceeding 5% of ARR"
      whyItMatters: "High customer concentration (>20% from top 5) in enterprise SaaS is a structural risk to ARR stability; public customer names do not confirm diversification"
      diligencePath: "Management disclosure; cross-reference with contract-level data in data room"
      relatedQuestionRefs:
        - QV003

    - type: enumeration-incomplete
      severity: minor
      topic: comparable HR tech M&A transactions
      missingEvidence: "Specific HR tech / employee recognition M&A transactions in 2025–2026 with disclosed revenue multiples"
      whyItMatters: "Transaction-level comp data (not index averages) would sharpen the exit multiple range and reduce the confidence interval on bear-to-bull valuation scenarios"
      diligencePath: "PitchBook or Capital IQ transaction search filtered to employee engagement SaaS, 2025–2026"
      relatedQuestionRefs:
        - QV028
        - QV016
      relatedTableRefs:
        - TV004

