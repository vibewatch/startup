callouts:
  - calloutType: recommendation
    title: TRACK — Strong Business, Stretched Entry Price
    body: >-
      Awardco is a high-quality business: cash-flow positive, 73% ARR growth, exclusive
      Amazon moat, tier-1 investors, and 3,000+ enterprise customers. But the $1B+ Series B
      valuation implies 9–13x trailing ARR at a time when public SaaS trades at 3.6x and
      M&A averages 6.3x. A BUY call requires: (1) NRR above 110%, (2) gross margin confirmed
      above 75%, (3) Amazon partnership contract terms reviewed and materially stable, and
      (4) top-10 customer concentration below 25%. Until these diligence items are resolved,
      TRACK is the appropriate stance. Price discipline at entry — targeting below $1B if a
      secondary opportunity arises — would shift the risk-adjusted return profile materially.
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV012
      - CV013
      - CV030

  - calloutType: risk
    title: Amazon Dependency Is the Primary Thesis-Break Risk
    body: >-
      Awardco's core differentiation — 300M+ reward options at zero markup — is entirely
      dependent on the continuation of its exclusive Amazon Business partnership. Unlike
      software features or customer relationships, this moat cannot be rebuilt if Amazon
      withdraws, renegotiates exclusivity, or enters the recognition software space directly.
      Investors should require disclosure of the full partnership agreement, including
      exclusivity scope, duration, API access fees, and change-of-control provisions, before
      completing any new capital commitment above $500M valuation.
    claimRefs:
      - CV009
      - CV010
      - CV031

  - calloutType: assumption
    title: "Key Model Assumption: ARR Extrapolation"
    body: >-
      All scenario valuations in this chapter are built on extrapolation from a single
      self-reported ARR data point ($75.2M in 2024 per Latka/founder interview) and
      third-party estimates for 2025 ($100–121M from Compworth/ZoomInfo). No audited
      financial statements are available. If the ARR figure is overstated by 10–20%
      (common in self-reported SaaS metrics that count deferred revenue or committed ARR
      differently), the entry multiple would be 10–16x trailing, further into the stretched
      territory. This assumption should be resolved before any investment decision.
    claimRefs:
      - CV006
      - CV035
      - CV036

