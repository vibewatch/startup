  - id: current-valuation-and-comparables
    title: Current Valuation Context and Comparable Set
    body: >-
      Awardco's current valuation is $1.0B+ as set in the May 2025 Series B, confirmed
      by the SEC Form D filing (Accession No. 0001799778-25-000006, filed 2025-07-08)
      and corroborated by the lead investor Sixth Street Growth and legal counsel Goodwin Law.
      Total capital raised stands at $235M across three disclosed rounds. At a $1B anchor
      and estimated 2025 ARR of $100–121M, the implied ARR multiple is approximately 8–10x
      forward and 13x trailing (on 2024 $75.2M ARR). The capital efficiency ratio (valuation
      / total raised) is 4.25x, a signal of capital-disciplined growth. The Series B price
      represents a modest step up from the $900M implied valuation at Series A (2021), which
      suggests investors priced disciplined rather than exuberant growth.
      The most relevant direct comparable is Workhuman, which carries a $1.2B valuation on
      approximately $1.15–1.2B ARR — an implied 1x ARR multiple that reflects the premium
      placed on profitability and scale over growth in a mature competitor. Awardco's premium
      multiple (9–13x) versus Workhuman's 1x illustrates the market's willingness to pay for
      growth rate, not just scale. Private SaaS companies in the Eqvista database were valued
      at a median of 16.1x ARR in Q1 2025, with the highest-growth companies commanding the
      upper end; Awardco's 9–13x sits just below that median, arguably conservative given 73%
      ARR growth. Against public comps, Awardco trades at a significant premium: the SEG SaaS
      Index median is 3.6x in 1Q26, and average SaaS M&A was 6.3x. The premium is justified
      by growth rate but creates a compressed exit window if public multiples stay depressed.
      For the HR tech vertical specifically, the Meridian Capital Q4 2025 update found continued
      resilience in employee engagement SaaS, with M&A buyers prioritizing AI analytics,
      retention, and HRIS integration — three categories where Awardco is actively investing.
