  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financials
      missingEvidence: >-
        Awardco's ARR, revenue run-rate, gross margin, net revenue retention, and
        unit economics are not publicly disclosed anywhere.
      whyItMatters: >-
        Without revenue and margin data, it is not possible to independently assess
        valuation multiples, sustainability of the cash-flow-positive claim, or
        customer payback period—all critical inputs for investment judgment.
      diligencePath: >-
        Request management accounts, last-twelve-month revenue, ARR schedule, and
        gross margin calculation under NDA in a formal data room process.
      relatedQuestionRefs:
        - QO012

    - type: private-evidence-only
      severity: material
      topic: cap-table
      missingEvidence: >-
        Full cap table, exact investor ownership percentages, liquidation preference
        stack, anti-dilution provisions, and board composition are not publicly available.
      whyItMatters: >-
        Cap table structure determines effective economic exposure for new investors
        and affects return analysis in exit scenarios.
      diligencePath: >-
        Obtain cap table, investor rights agreement, voting agreement, and board
        observer list from company legal counsel under NDA.
      relatedTableRefs:
        - TO003

    - type: missing-source
      severity: material
      topic: leadership
      missingEvidence: >-
        No public information on board composition, independent director identities,
        compensation structure, or depth of succession planning is available.
      whyItMatters: >-
        Key-person concentration risk around Steve Sonnenberg is unquantified without
        board-level governance evidence; board independence is unknown.
      diligencePath: >-
        Request board composition, director bios, committee charters, and any
        employment/non-compete agreements for co-founder executives.
      relatedQuestionRefs:
        - QO019
      relatedTableRefs:
        - TO002

    - type: private-evidence-only
      severity: minor
      topic: customers
      missingEvidence: >-
        Full customer list beyond the handful of named logo references is not publicly
        available; exact customer count (not just "3,000+") is not independently confirmed.
      whyItMatters: >-
        Customer concentration risk, churn, and NRR cannot be assessed without a more
        complete picture of the customer base.
      diligencePath: >-
        Request the full customer list, NRR, and logo churn cohort analysis under NDA.
      relatedTableRefs:
        - TO001

    - type: missing-source
      severity: minor
      topic: pricing
      missingEvidence: >-
        Detailed pricing tiers, per-seat fees, and contract terms are not publicly
        disclosed; only the $2,500 minimum annual fee is known from a review site.
      whyItMatters: >-
        Pricing opacity limits competitive benchmarking and unit economics analysis.
      diligencePath: >-
        Request standard commercial contract, pricing schedule, and MSA terms from
        Awardco sales process or directly under NDA.
      relatedQuestionRefs:
        - QO026

    - type: missing-source
      severity: minor
      topic: competitive-comparison
      missingEvidence: >-
        No independent third-party analysis comparing Awardco's zero-markup model
        to traditional catalog-based recognition vendors (e.g., Achievers, Workhuman,
        O.C. Tanner) on total cost of ownership, reward value retention, and breadth
        of catalog is publicly available.
      whyItMatters: >-
        Without direct comparative data, the strength of the zero-markup and Amazon
        integration differentiator relative to competitors cannot be quantified;
        affects market positioning judgment.
      diligencePath: >-
        Commission or locate independent HR analyst benchmarks (e.g., Forrester Wave,
        Gartner Magic Quadrant) covering employee recognition platforms; request
        competitive battle cards from Awardco under NDA.
      relatedQuestionRefs:
        - QO024

    - type: enumeration-incomplete
      severity: minor
      topic: milestones
      missingEvidence: >-
        Pre-Series-A internal operational milestones, early customer acquisition events,
        any seed or angel financing events, and internal product launches from 2012–2020
        are not documented in public sources and are absent from the Milestone table.
      whyItMatters: >-
        The milestone table may be missing early events that illuminate the company's
        initial growth trajectory, early product-market fit indicators, and any adverse
        or governance events before institutional investors arrived.
      diligencePath: >-
        Request a chronological company history document and board minutes from 2012
        through 2021 under NDA to populate the pre-Series-A portion of the milestone table.
      relatedTableRefs:
        - TO004

