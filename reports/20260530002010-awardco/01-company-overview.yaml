callouts:
  - calloutType: strength
    title: Cash-Flow Positive Since 2012 — Rare Bootstrap Discipline in HRTech
    body: >-
      Awardco operated without external capital for nine years while growing revenue
      annually, a capital-efficiency profile that General Catalyst's Paul Kwan compared
      to Atlassian and Qualtrics. This discipline reduces dilution risk for new investors,
      suggests durable unit economics, and demonstrates that the business model works
      without subsidy. The company entered its Series B describing itself as having
      "sustained high growth and a cash-flow-positive business."
    claimRefs:
      - CO005
      - CO012
      - CO014

  - calloutType: risk
    title: Brand Phishing Campaign — Organizational Security Risk for Customers
    body: >-
      Starting in May 2025, cybersecurity firm Mimecast identified and tracked a
      sophisticated multi-month phishing campaign (MCT03028) that impersonates Awardco
      communications to harvest enterprise credentials. Because Awardco communicates
      with all employees at a given organization—not just HR—the attack surface is
      unusually large. Customers face indirect exposure: employee credentials may be
      compromised through legitimate-appearing reward notifications. Awardco is not
      directly responsible for the campaign, but the brand exploitation reveals the
      risk that its wide enterprise reach creates for the downstream security posture
      of customers.
    claimRefs:
      - CO036
      - CO037

  - calloutType: insight
    title: Amazon Business Exclusivity — A Supply-Side Moat Competitors Cannot Easily Replicate
    body: >-
      No competitor in the employee recognition space has replicated an equivalent
      arrangement with Amazon Business. This partnership provides Awardco with access
      to hundreds of millions of SKUs at zero markup, free shipping in 180+ countries,
      and real-time tracking—an end-user value proposition that is structurally
      difficult for competitors to match without a direct Amazon relationship. The
      partnership, established in 2017, has been deepened twice (2021 and 2024) and
      is described by Awardco as foundational to its global expansion strategy.
    claimRefs:
      - CO006
      - CO025
      - CO031
      - CO046

