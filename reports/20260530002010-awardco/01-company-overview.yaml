company:
  name: Awardco
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Awardco is a cash-flow-positive employee recognition and rewards platform headquartered
    in Lindon, Utah, founded in 2012 by Steve Sonnenberg, Mike Sonnenberg, and Tanner Runia.
    It has raised approximately $235 million across two disclosed rounds (Series A $65M in
    October 2021; Series B $165M in May 2025), achieving unicorn status at over $1 billion
    valuation. Awardco serves 3,000+ organizations and six million-plus users across 163
    countries, distinguishing itself through an exclusive Amazon Business partnership offering
    300M+ reward options with zero markups. Phishing campaigns exploiting Awardco's brand
    represent the most prominent external risk surfaced in this review.

sections:
  - id: company-identity-and-model
    title: Company Identity and Business Model
    body: >-
      Awardco is a privately held HRTech software company incorporated in Lindon, Utah.
      Founded in 2012 by Steve Sonnenberg, the company builds a cloud-based employee
      recognition and rewards platform that enables organizations to celebrate and incentivize
      employees through a unified marketplace. Its one-line business model is a platform fee
      plus any-budget recognition programs delivered at zero markup on rewards—distinguishing
      it sharply from legacy catalog-based vendors that typically mark up merchandise 20–40%.
      The platform encompasses peer-to-peer recognition, service-anniversary milestones,
      performance-based incentives, lifestyle spending accounts, a listening-and-engagement
      module (Awardco Engage), and, as of May 2026, an AI-powered layer called Awardco
      Intelligence. Awardco's stated mission is to become "the world's most positive
      platform, empowering people everywhere to recognize the good, incentivize improvement,
      and reward greatness." The company is headquartered at 2080 W 400 N, Suite 200,
      Lindon, UT 84042, with a London office opened in 2024 to serve EMEA customers.
      Awardco holds Series B funding, is cash-flow positive, and describes itself as a
      "unicorn" after reaching a valuation above $1 billion in May 2025. The platform
      is the only employee recognition solution to be a featured partner with Amazon
      Business, providing access to hundreds of millions of reward items with free shipping
      and no hidden fees. As of May 2026, Awardco had 677 employees per its LinkedIn
      profile and served more than 3,000 organizations across 163 countries. Revenue
      details and ARR are not publicly disclosed; diligence paths for those metrics are
      identified in the evidence gaps section of this chapter.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
