- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Retro solution
  - Measurable benefit
  - Limitation
  rows:
  - - Disease-modifying Alzheimer's intervention
    - Mostly downstream plaque/tau or symptomatic approaches
    - RTR242 to restore lysosomal-autophagic function
    - Human-stage trial now includes exploratory autophagy / lysosomal biomarkers
    - No public human biomarker or efficacy outputs yet
  - - Autologous blood-stem-cell replacement
    - Matched-donor transplant or imperfect donor alternatives
    - iPSC-derived HSC workflow from patient cell to matched transplant product
    - Could reduce donor-match dependence if engraftment works clinically
    - Still partnership-backed translational vision rather than a public clinical program
  - - Brain immune-cell rejuvenation
    - Apheresis / systemic plasma interventions are hard to scale and indirect
    - iMG program aims at replacing dysfunctional microglia with younger counterparts
    - Potentially more targeted CNS mechanism than systemic plasma exchange
    - No public in-vivo efficacy or manufacturing package disclosed
  - - In-vivo tissue rejuvenation
    - Treat downstream tissue symptoms after degeneration is established
    - AAV-delivered reprogramming factors for OA and hearing loss
    - Could move from symptom management toward tissue-state modification
    - Vector, dose, durability, and oncogenic-risk controls are not public
  - - Reprogramming-factor discovery
    - Classical protein engineering and low-efficiency OSKM screens
    - GPT-4b micro plus Retro wet-lab screening to redesign key factors
    - More than 50-fold marker-expression uplift and faster pluripotency-marker appearance
    - Evidence is experimental and enabling, not a disclosed patient-facing product
  notes: This table focuses on user or patient workflows rather than scientific novelty alone. Benefits are limited to what the retained sources actually disclose; where outcomes are only mechanistic or preclinical, the limitation column states that explicitly.
