- id: platform-stack-manufacturing-and-developer-signal
  title: Platform stack, manufacturing, and practitioner signal
  body: 'What makes Retro’s product-tech story more credible than a pure branding exercise is the amount of disclosed platform plumbing around discovery and translation. The company is actively hiring for genomics, hematopoiesis, bioreactors, GMP operations, and quality functions, and those role descriptions are unusually concrete. They point to RNA-seq, ATAC-seq, single-cell assays, methylation profiling, automated protocol transfer, iPSC differentiation, bioreactor scale-up, environmental monitoring, electronic batch records, and CDMO/CRO quality oversight. The May 2026 blog also claims an in-house cGMP cell-therapy facility, and the MCRI partnership ties the iHSC program to external blood-stem-cell IP rather than to an entirely in-house scientific leap. Retro also shows a real, if limited, public developer and practitioner surface via GitHub. That surface should not be over-interpreted: much of it is forked scientific tooling rather than disclosed proprietary therapeutic software. Even
    so, public repos such as FlowKit, cNMF, and AMPLIFY are consistent with a computational biology organization working on cytometry, single-cell, and protein-model workflows. The public signal therefore supports a real platform organization with wet-lab, data, and manufacturing components, but not a fully transparent external product-docs surface.'
