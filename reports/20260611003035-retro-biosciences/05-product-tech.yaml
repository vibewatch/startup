  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: rtr242-data
    missingEvidence: Public release of Phase 1 biomarker, PK/PD, safety, or early efficacy outputs for RTR242.
    whyItMatters: Without any human readout, investors can only underwrite mechanism and trial design, not whether Retro’s autophagy thesis translates into measurable biological change in people.
    diligencePath: Request the latest clinical update deck, investigator brochure, biomarker plan, and any blinded or unblinded interim outputs from the Phase 1 program.
    relatedQuestionRefs:
    - QE023
  - type: private-evidence-only
    severity: material
    topic: cell-therapy-data
    missingEvidence: Preclinical efficacy, potency, engraftment, and manufacturability package for RTR888 and RTR890.
    whyItMatters: The cell-therapy programs are currently valued mostly through platform framing and partner signals; absent a concrete preclinical package, there is no clean basis for assigning therapeutic readiness.
    diligencePath: Request IND-enabling plans, potency assays, in-vivo efficacy data, release specifications, and manufacturing-yield history for each cell-therapy program.
    relatedQuestionRefs:
    - QE024
  - type: private-evidence-only
    severity: material
    topic: tissue-reprogramming-data
    missingEvidence: Vector design, payload composition, dose-ranging, durability, biodistribution, and tumorigenicity controls for the tissue-reprogramming program.
    whyItMatters: Gene-therapy reprogramming programs are unusually sensitive to delivery and safety design choices, so the current public description is too abstract to underwrite product risk.
    diligencePath: Request the latest nonclinical package, vector maps, promoter / payload design notes, dose-ranging studies, and any safety-monitoring framework for tissue reprogramming.
    relatedQuestionRefs:
    - QE025
