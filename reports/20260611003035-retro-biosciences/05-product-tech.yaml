    - Neurodegeneration patients; first framed around Alzheimer's disease
    - Phase 1 / human-stage
    - Oral small molecule intended to restore lysosomal-autophagic function
    - Only clearly human-stage Retro asset in the retained record
    - No public human biomarker or efficacy readout beyond trial design
  - - RTR888 (iMG)
    - CNS conditions / brain immune-cell replacement thesis
    - Preclinical disclosed program
    - iPSC-derived microglial progenitors; plasma-inspired and brain-immune rejuvenation framing
