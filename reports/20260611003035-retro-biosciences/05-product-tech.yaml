    - Operating capability
    - Genomics, automation, bioreactors, GMP, QMS, and external partner network
    - Supports multiple modalities rather than one single-asset bet
    - Throughput, release metrics, yields, and failure rates are not public
  notes: Status labels separate the sole human-stage asset (RTR242) from platform or preclinical programs. Rows combine official pipeline language with partner disclosures and hiring evidence; missing public preclinical packages are carried as diligence gaps rather than assumed solved.
