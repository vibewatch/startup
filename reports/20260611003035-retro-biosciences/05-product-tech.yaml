- id: trust-controls-roadmap-and-remaining-gaps
  title: Trust controls, roadmap, and remaining diligence gaps
  body: 'Retro’s trust and execution posture is strongest where there is an actual clinical or manufacturing workflow and weakest where the company is still asking outsiders to accept a biological leap on faith. For RTR242, the public record at least reaches the threshold of a real clinical product: official and third-party sources support a Phase 1 asset, and hiring pages describe analytical methods, stability plans, quality attributes, CAPAs, supplier qualification, and batch-review processes. But even there, the disclosed evidence stops short of public human biomarker or efficacy output. The disclosure is thinner still for the cell-therapy and gene-therapy programs. The public record does not provide preclinical efficacy packages for RTR888 or RTR890, and it does not disclose the payload design, dose, durability, or safety architecture for the tissue-reprogramming program. That means the roadmap can legitimately include multiple future first-in-human milestones in 2026 and 2027, yet the
    current investor view should remain conservative: Retro appears to have built serious translational infrastructure and a coherent portfolio map, but public proof of repeatable product performance still lags the ambition of the platform.'
