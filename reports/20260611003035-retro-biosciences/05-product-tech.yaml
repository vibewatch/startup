- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: Retro’s product architecture layers aging-mechanism theses into modality programs, then into discovery and translation infrastructure rather than exposing a classic software stack.
  data:
    layers:
    - label: Mechanism layer
      modules:
      - Partial cellular reprogramming
      - Autophagy enhancement
      - Plasma-inspired / microglia rejuvenation
      - Hematopoietic rejuvenation
      note: The retained public record consistently clusters Retro around aging mechanisms, not one disease franchise.
    - label: Modality / asset layer
      modules:
      - RTR242 small molecule
      - RTR888 iPSC-derived microglia
      - RTR890 iPSC-derived HSCs
      - AAV tissue reprogramming
      - AI-designed protein therapeutics / engineered factors
      note: Only RTR242 is explicitly human-stage; the others remain platform or preclinical on public evidence.
    - label: Discovery and measurement layer
      modules:
      - OpenAI GPT-4b micro collaboration
      - Retro wet-lab reprogramming screen
      - RNA-seq / ATAC-seq / single-cell assays
      - Methylation profiling
      - Flow cytometry
      note: This layer is where AI and genomics presently appear most directly evidenced.
    - label: Translation and operations layer
      modules:
      - Bioreactors
      - In-house cGMP cell-therapy facility
      - QMS / CAPA / batch review
      - CDMO / CRO oversight
      - MCRI iHSC partnership
      - Phase 1 biomarker readouts
      note: Translation evidence is strongest for RTR242 and the cell-therapy manufacturing build-out.
  approximationNotes: This stack is an analytical reconstruction from official pipeline pages, partner announcements, job descriptions, and the OpenAI collaboration page. Internal interfaces, decision rules, and asset handoffs are not publicly documented.
