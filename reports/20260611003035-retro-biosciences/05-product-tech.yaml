    - No public efficacy package, dose concept, or manufacturing detail
  - - RTR890 (iHSC)
    - Blood-disorder patients and transplant candidates
    - Preclinical disclosed program with translational partner
    - iPSC-derived hematopoietic stem cells for autologous transplant
    - Backed by exclusive MCRI-licensed blood stem-cell breakthrough
    - No disclosed in-human data or complete public CMC package
  - - Tissue reprogramming
    - Patients with osteoarthritis or age-related hearing loss
    - Preclinical platform program
    - AAV-delivered reprogramming factors for in-vivo rejuvenation
    - Directly targets age-related tissue degeneration rather than symptomatic control
    - Vector design, payload, safety, and durability remain undisclosed
  - - AI-designed protein therapeutics / engineered factors
    - Internal Retro discovery programs
    - Platform / discovery-stage
    - GPT-4b micro-guided engineering of reprogramming-related proteins
    - Real disclosed experimental gains in reprogramming markers and DNA-damage repair assays
    - No separately disclosed clinical asset, sequence package, or CMC path
