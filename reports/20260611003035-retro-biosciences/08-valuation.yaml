company:
  name: Retro Biosciences
chapter:
  number: 8
  title: Valuation
  summary: Retro's May 2026 $1.8 billion pre-money round is real, but public support for that price is still thin relative to what investors can actually verify. The company has genuine platform ambition and an on-time move into its first human study, yet it remains pre-efficacy, economically opaque, and expensive versus public longevity-biotech comps while still below the very top private reprogramming marks. The most supportable public-evidence call is research-more with medium confidence, high risk, and a stretched valuation stance until human data and financing details improve.
sections:
- id: round-anchor-and-public-proof
  title: Round Anchor and Public-Proof Gap
  body: 'Retro has now crossed the line from narrative-only startup to company with a real priced round and a real first-in-human asset, but those two facts should not be conflated. The official May 22, 2026 announcement fixes the headline at a $1.8 billion pre-money valuation and says RTR242 reached first-in-human dosing in 15 months, with more first-in-human milestones planned for 2026 and 2027. That is meaningful execution for an aging-biology platform. Independent coverage also suggests the first study has not yet shown dose-limiting toxicities. What the public file still does not show is what conventional valuation work usually starts from: round size, preferences, dilution, burn, revenue, human efficacy, or biomarker magnitude. Even before comparables, that makes the entry price easier to describe than to underwrite. Investors are being asked to pay for option value on future aging-biology proof, not for already disclosed economics or de-risked clinical data.'
