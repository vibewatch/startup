  title: Recommendation summary table
  columns:
  - Dimension
  - Current view
  - Why it lands there
  - Decision implication
  rows:
  - - Recommendation
    - Research-more
    - The round is real, but public underwriting evidence is still incomplete.
    - Do not treat the headline price as self-validating.
  - - Confidence
    - Medium
    - Sources are strong on financing signal and category context, weaker on economics and efficacy.
    - Enough proof to reject blind enthusiasm, not enough for precise fair value.
  - - Risk rating
    - High
    - The first human program is early and financing structure remains opaque.
    - Position sizing should assume meaningful downside variance.
  - - Valuation stance
    - Stretched
    - Retro prices well above public longevity comps while still lacking disclosed human efficacy or revenue anchors.
    - Upgrade only after data or price meaningfully improve.
  - - Best near-term re-rating path
    - Constructive August 2026 data plus clearer financing terms
    - That would narrow the gap between option value and evidence.
    - Could move stance toward fair, not automatically attractive.
  notes: This table summarizes the evidence-based call; it is not a substitute for a full term-sheet review or private-model diligence.
