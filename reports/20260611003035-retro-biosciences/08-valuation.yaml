- id: recommendation-and-diligence-path
  title: Recommendation and Diligence Path
  body: 'The most defensible current stance is research-more rather than pay up, with medium confidence, high risk, and a stretched valuation view. That is not a dismissal of Retro''s science. The company has crossed meaningful milestones, and the category still attracts elite capital. But the public evidence does not yet justify treating $1.8 billion as obviously fair, let alone attractive. A price-sensitive investor should demand a narrower gap between story and proof: exact financing economics, post-round runway, and especially first human biomarker and safety data strong enough to show Retro is de-risking faster than the average preclinical platform. If those points break positively, the stance can move toward fair. If they break negatively—or remain unavailable while the company still asks investors to anchor on private-longevity prestige—the current mark moves from stretched toward plainly expensive. Until those facts exist, discipline should come from waiting for evidence, patient data, and term-sheet reality, not from paying private-longevity scarcity premiums.'
