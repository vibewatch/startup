- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - RTR242 data fail to support mechanism
    - Safety weakens or biomarkers do not validate the autophagy thesis
    - The main near-term de-risking event would no longer justify a premium private mark.
    - Reset valuation expectations sharply or stop underwriting.
  - - Additional FIH milestones slip
    - 2026-2027 platform cadence misses the company's own timetable
    - Breadth flips from upside to diffusion risk.
    - Treat platform premium as unearned.
  - - Round economics are investor-protective
    - Preferences, ratchets, or heavy secondary make common-equity value much weaker than the headline suggests
    - Headline pre-money overstates true entry quality.
    - Re-price on common-equity reality, not press-release optics.
  - - Public aging-biotech rerating worsens
    - BioAge-like public comps compress further while private appetite narrows
    - Retro loses the benefit of category enthusiasm.
    - Use bear-case corridors, not private prestige comps.
  - - Validation remains too founder-concentrated
    - No broader arms-length syndicate or third-party proof appears after current round
    - The market-clearing signal remains ambiguous.
    - Keep recommendation at research-more or avoid.
  notes: These are the smallest set of monitorable conditions that would force an investor to change the valuation call rather than merely refine it.
