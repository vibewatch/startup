- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Clinical momentum
    - Retro reached first-in-human dosing unusually quickly for an aging-biology platform.
    - First-in-human dosing is not human efficacy, and early safety commentary is still thin proof.
    - Release a clearly positive biomarker and safety package.
  - - Platform breadth
    - The company has multiple programs plus manufacturing and research partnerships.
    - Breadth can also dilute focus when none of the programs has human efficacy yet.
    - Show that multiple programs are progressing on funded, timed paths.
  - - Private-peer context
    - NewLimit and Altos show that investors still pay for reprogramming platforms.
    - Public longevity comps show that narrative-rich aging stories can trade far below private marks.
    - Broaden arms-length syndication or disclose evidence that justifies the premium.
  - - Capital structure
    - Altman's willingness to fund long-horizon science reduces short-term financing pressure.
    - Single-benefactor concentration can mask true market-clearing price discipline.
    - Show a deeper investor base and ordinary-round economics.
  - - Category backdrop
    - Longevity still attracts major venture capital and strategic interest.
    - BCG and JPMorgan both describe a more selective market with less tolerance for generic preclinical pricing.
    - Demonstrate company-specific proof that rises above thematic enthusiasm.
  notes: The anti-thesis is not that Retro lacks ambition; it is that public evidence still lags the valuation being asked of new capital.
