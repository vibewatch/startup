- id: scenario-logic-and-kill-criteria
  title: Scenario Logic and Kill Criteria
  body: 'Scenario logic should remain milestone-driven, not spreadsheet-theater. The bull case requires more than a clean Phase 1 safety readout. Retro would need constructive biomarker evidence, credible timing on the next first-in-human milestones, and signs that the market continues to price it with NewLimit-like private optimism rather than BioAge-like public discipline. The base case is easier to believe: human safety remains acceptable, the company keeps scientific momentum, but economic opacity persists and the current round proves roughly full rather than cheap. The bear case does not require fraud or total scientific failure. It only requires weak human data, slippage, or financing terms that reveal the common-equity value is worse than the headline suggests. Because this chapter is about entry discipline, the most important artifacts are not upside stories but the triggers that would tell an investor to stop paying private-longevity premiums and revert to public-comp logic.'
