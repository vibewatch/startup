  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: round-economics
    missingEvidence: Exact round size, preference stack, dilution, and any secondary component for the May 2026 financing.
    whyItMatters: Without the actual economics, the $1.8 billion pre-money headline can overstate what new common-equity investors are really buying.
    diligencePath: Request executed term sheet, cap table, and financing memo from management.
    relatedQuestionRefs:
    - QV003
    - QV026
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: runway
    missingEvidence: Post-round burn, cash balance, and runway assumptions under the company's current operating plan.
    whyItMatters: Runway determines whether Retro can reach the next data catalyst without taking another financing on weaker terms.
    diligencePath: Obtain monthly cash-bridge, budget, and scenario runway model.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV006
  - type: stale
    severity: material
    topic: rtr242-readout
    missingEvidence: Detailed August 2026 biomarker, dose, and safety dataset for RTR242 rather than headline commentary alone.
    whyItMatters: The valuation stance is highly sensitive to whether the first human data merely look clean or actually start to validate mechanism and translatability.
    diligencePath: Revisit after data release; request slide deck, protocol, and investigator commentary.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV003
    - TV005
  - type: enumeration-incomplete
    severity: minor
    topic: comparable valuation table
    missingEvidence: A complete, directly comparable set of disclosed standalone longevity-platform valuations does not exist in public evidence, especially for captive platforms like Calico.
    whyItMatters: The chapter must mix private rounds, public comps, and strategic contexts, which increases interpretation risk in the comparable table.
    diligencePath: Expand the set when more private rounds disclose valuations or when additional public longevity-platform companies gain liquid market histories.
    relatedQuestionRefs:
    - QV025
    relatedTableRefs:
    - TV004
