- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Public anchor
  - Read-through for Retro
  - Limitation
  - Status
  rows:
  - - Altos Labs
    - $3B launch capital in 2022; elite rejuvenation-science bench
    - Shows the top end of capital intensity and ambition in cellular rejuvenation.
    - Committed capital is not the same as a current standalone valuation.
    - Private context
  - - NewLimit
    - $435M Series C and reported ~$3.1B valuation in June 2026
    - Closest disclosed private reprogramming comp showing investors still fund the category at scale.
    - Also pre-efficacy and not a clean revenue multiple comp.
    - Private
  - - BioAge Labs
    - ~$0.68-$0.70B June 2026 market cap plus 10-K and follow-on disclosure
    - Public aging-biotech benchmark with filings, trial progress, and cash disclosure.
    - Metabolic-aging program mix differs from Retro's platform focus.
    - Public
  - - Unity Biotechnology
    - ~$3.44M June 2026 market cap; going-concern language in latest 10-K
    - Adverse reminder that public aging-biotech value can collapse when execution and financing fail.
    - Distress comp, not a midpoint fair-value anchor.
    - Public adverse
  - - Calico / Alphabet Other Bets
    - Aging mission is visible, but no standalone valuation is disclosed
    - Useful only as strategic context for how deep-pocketed parents can fund long-duration aging research.
    - Not a transferable market-clearing price reference.
    - Strategic context
  notes: This enumeration mixes private rounds, public comps, and strategic context because no single disclosed comparable perfectly matches Retro's business model and stage.
  enumerationScope:
    coverage: partial
    basis: Rows cover the disclosed longevity references most relevant to Retro's 2026 price-setting debate rather than every aging-biotech company.
