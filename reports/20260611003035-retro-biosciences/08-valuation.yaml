- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Indicative valuation corridor
  - What must be true
  - Probability signal today
  rows:
  - - Bull
    - $2.5B-$3.5B
    - August 2026 data are constructive, next FIH milestones hold, and investors keep pricing Retro against the best private reprogramming comps.
    - Possible, but not yet supported by public human data.
  - - Base
    - $1.0B-$1.8B
    - Safety remains acceptable and platform progress continues, but efficacy and financing detail stay sparse.
    - Most consistent with the evidence currently available.
  - - Bear
    - $0.3B-$0.8B
    - Data disappoint, timing slips, or investors price Retro closer to public longevity comps and 2026 reset conditions.
    - Material enough that entry discipline matters now.
  - - Hard-reset reference
    - <$0.1B sector average, not Retro-specific
    - A full market reclassification toward generic preclinical pricing would be severe.
    - Useful as a warning from BCG, not as the central base case.
  notes: These ranges are valuation corridors built from milestone state, private-peer context, and public-market anchors; they are deliberately coarse to avoid false precision.
