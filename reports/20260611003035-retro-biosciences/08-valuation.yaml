- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Round size and terms
    - Exact cash closed, preference stack, dilution, and any secondary component are not public.
    - The headline valuation may overstate common-equity entry economics.
    - Request executed term sheet and updated cap table.
  - - Post-round burn and runway
    - No public source quantifies how long the new financing funds operations.
    - Runway determines whether Retro can reach the next proof point without forced financing.
    - CFO diligence pack with monthly burn bridge.
  - - RTR242 data package
    - Only high-level commentary exists; no public biomarker or dose-response detail is available.
    - This is the key event that could move the valuation stance toward fair.
    - Clinical update deck and trial protocol review.
  - - Program-level capital allocation
    - Public sources do not show how capital is split across autophagy, reprogramming, cell therapy, and AI efforts.
    - Platform breadth is valuable only if resourcing is disciplined.
    - Board materials or management operating plan.
  - - Syndicate breadth and external validation
    - Public evidence does not show how broad the new investor base is beyond the lead and continued Altman support.
    - Broader arms-length validation would improve confidence that the price is market-clearing.
    - Investor list, allocation memo, and partner reference calls.
  notes: Until these items are answered, the right posture is diligence discipline rather than accepting the current mark as fair value.
