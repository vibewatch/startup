  topStrengths:
    - >-
      Retro has unusually strong scientific ambition and capital backing for a longevity startup, including Sam Altman's
      initial $180 million and a 4P-led financing at a $1.8 billion pre-money valuation.
    - >-
      The company has progressed beyond concept-only status, with RTR242 in Phase 1 and visible investment in GMP,
      quality, automation, and translational infrastructure.
    - >-
      Retro is not a single-asset story: it has multiple aging-biology programs across autophagy, cell reprogramming,
      microglia, tissue reprogramming, and AI-assisted protein engineering.
  topRisks:
    - >-
      Public evidence still lacks human efficacy data, disclosed revenue, and detailed financing terms, making the
      current valuation hard to underwrite conventionally.
    - >-
      The company is attempting several technically difficult modalities in parallel, including cell therapy and gene
      therapy, each with heavy regulatory, CMC, and safety risk.
    - >-
      Capital and narrative concentration around Joe Betts-LaCroix and Sam Altman create key-person and
      market-validation risk if data or future syndication weaken.
    - >-
      Public customer and commercialization proof remain absent, so the current case is still a future-demand thesis
      rather than verified market traction.
  unresolvedGaps:
    - Exact May 2026 round size, syndicate composition, preferences, dilution, and post-round runway.
    - >-
      Human biomarker and safety detail from RTR242 beyond management commentary, plus any indication-specific efficacy
      signal.
    - Board composition, governance rights, and the extent of Sam Altman's continuing ownership and control.
    - >-
      Commercialization evidence for later programs, including named clinical-service partners, reimbursement path, and
      future therapeutic buyer adoption.
