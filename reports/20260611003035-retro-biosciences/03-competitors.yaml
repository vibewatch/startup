company:
  name: Retro Biosciences
chapter:
  number: 3
  title: Competitors
  summary: Retro sits in a crowded longevity field, but the retained evidence suggests its competitive set splits cleanly by modality and execution posture. Altos and NewLimit dominate disclosed capital, Life Biosciences is the closest human-stage cellular-reprogramming peer, Calico and Unity show how slow partnership-led or public-market routes can break down, and Retro's visible manufacturing and licensing partnerships give it a more concrete translational posture than most direct reprogramming rivals.
sections:
- id: landscape-and-classes
  title: 'Landscape: direct reprogramming peers sit beside capital-heavy incumbents and failed field precedents'
  body: 'The evidence does not support treating “longevity biotech” as one homogeneous peer set. Retro competes directly with cellular-reprogramming platforms such as Altos Labs, NewLimit, Life Biosciences, Turn Biotechnologies, and portions of Rejuvenate Bio, because all are trying to reset aged cell function rather than only treat one downstream symptom. But the buyer and investor also have substitute choices: Calico represents the long-horizon, partnership-led incumbent model; Unity Biotechnology represents the senolytic, public-market route that ultimately wound down; and conventional disease-specific programs remain a status-quo alternative whenever one narrow indication can reach the clinic faster than a broad rejuvenation thesis. Within that field, Retro is unusual because the retained public record shows both a multi-modality pipeline and a current human trial, while still leaning on venture capital, external manufacturing, and research licensing rather than marketed-product revenue.
    That combination makes the most relevant comparison set narrower than “all aging companies” but broader than “other stem-cell startups.”'
