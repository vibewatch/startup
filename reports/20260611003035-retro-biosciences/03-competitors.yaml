  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Realized launch-market pricing, manufacturing COGS, and partner economics for Retro and the main retained peers.
    whyItMatters: Without actual pricing or cost data, commercialization comparisons stay qualitative and can overstate platform durability.
    diligencePath: Request product-level budget models, COGS assumptions, and any signed partner economics from management.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: altos-disclosure
    missingEvidence: A public Altos lead-program page or trial-readiness disclosure that names assets, indications, and timelines.
    whyItMatters: Altos is one of the best-capitalized competitors, so sparse disclosure makes it hard to judge whether it is merely well funded or genuinely close to clinical execution.
    diligencePath: Collect recent Altos scientific talks, patent clusters, or management interviews that tie capital to named programs.
    relatedQuestionRefs:
    - QP025
  - type: missing-source
    severity: minor
    topic: turn-status
    missingEvidence: A current Turn Biotechnologies corporate-status disclosure or definitive asset-transfer announcement beyond LOI coverage.
    whyItMatters: Turn is a weaker threat than Altos or NewLimit, but uncertainty around the remaining asset base affects IP and talent-migration risk.
    diligencePath: Confirm corporate registry status, recent financing, or definitive acquisition documents before treating Turn as fully inactive.
    relatedQuestionRefs:
    - QP025
  - type: private-evidence-only
    severity: minor
    topic: rejuvenate-commercial-proof
    missingEvidence: Evidence on whether Rejuvenate's companion-animal posture has translated into paying customers, trials, or regulatory traction.
    whyItMatters: A real veterinary commercialization wedge would make Rejuvenate more relevant as a substitute execution model.
    diligencePath: Request current animal-health program milestones, partner contracts, and any revenue or pilot disclosures.
    relatedQuestionRefs:
    - QP019
