- id: TP001
  title: Competitor profile table
  columns:
  - competitor
  - category
  - scale / funding
  - target segment
  - differentiation
  - limitation
  rows:
  - - Altos Labs
    - Direct cellular-rejuvenation peer
    - $3B launch funding; valuation discussed externally above Retro
    - Broad cell rejuvenation and longevity therapeutics
    - Best-disclosed capital base and elite scientific brand
    - Public program details remain sparse and commercialization timing is opaque
  - - NewLimit
    - Direct epigenetic-reprogramming peer
    - $130M Series B and $435M Series C disclosed
    - Cell-type-specific epigenetic reprogramming with liver focus
    - Publicly claims prototype age-reversal medicine and near-term human-trial ambition
    - Still preclinical in retained public evidence; little pricing or product detail
  - - Life Biosciences
    - Direct human-stage reprogramming peer
    - $80M Series D in 2026
    - Partial epigenetic reprogramming for optic neuropathies and other age-linked disease
    - Closest disclosed human-stage reprogramming rival to Retro
    - Platform is narrower and more indication-specific than Retro's current map
  - - Calico
    - Incumbent/adjacent aging platform
    - Alphabet backing plus long AbbVie collaboration history
    - Aging biology discovery and partnered development
    - Large-parent backing and long research horizon
    - AbbVie partnership exit and layoffs show weak visible commercialization conversion
  - - Unity Biotechnology
    - Adjunct/cautionary senolytic peer
    - Former public-company route now in liquidation
    - Senolytic ophthalmology and neurology programs
    - Once offered a cleaner, narrower age-disease commercialization story
    - Official site says the company is no longer operating and dissolution has been approved
  - - Rejuvenate Bio
    - Adjacent gene-therapy longevity peer
    - Venture-backed plus 2026 crowdfunding push
    - Companion-animal and human gene therapies for age-related disease
    - Dual-market posture could create earlier animal-health proof points
    - Human programs remain earlier and public economics are sparse
  - - Turn Biotechnologies
    - Smaller reprogramming entrant / potential entrant
    - Asset-sale process rather than fresh financing dominates retained coverage
    - Cellular reprogramming and iPSC-related longevity assets
    - Relevant modality overlap with Retro's rejuvenation narrative
    - Strategic instability makes it a weaker near-term threat than better-capitalized peers
  notes: Rows compare the main retained ways a buyer or investor can back an aging-mechanism platform. Public pricing is largely absent, so scale/funding and posture rely on reviewed financing and corporate-status disclosures.
