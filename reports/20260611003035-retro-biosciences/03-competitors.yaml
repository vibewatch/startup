- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - mitigation / diligence ask
  rows:
  - - Retro is ahead because it is already clinical
    - Life is also human-stage, and Retro's trial today is autophagy rather than a reprogramming asset
    - high
    - Ask for program-by-program timeline, especially when Retro expects a direct reprogramming candidate to reach the clinic
  - - Retro's breadth across autophagy, cells, and reprogramming is a moat
    - Altos and NewLimit can offset narrower disclosure with much larger financing and talent attraction
    - high
    - Test whether breadth is producing faster milestone throughput rather than organizational sprawl
  - - Manufacturing and licensing partnerships give Retro a translation edge
    - Partners do not guarantee scalable CMC, yields, or healthy unit economics
    - medium
    - Request concrete GMP milestones, partner economics, and batch-readiness evidence
  - - Long-horizon incumbents validate the space
    - Calico and Unity show that capital and public-market access can still fail to create durable product momentum
    - high
    - Use those precedents to pressure-test Retro's financing assumptions and commercialization path
  - - Smaller entrants are not serious threats
    - Turn and similar entrants can still create IP or talent competition even if corporate status weakens
    - medium
    - Map which external assets or teams could be acquired by better-funded rivals
  - - Lack of public pricing is harmless at this stage
    - Opaque economics can hide poor CMC cost, weak partnering leverage, or long payback periods
    - high
    - Diligence should prioritize COGS, manufacturing assumptions, and any implied launch-market pricing
  notes: The register focuses on competitive durability rather than scientific promise alone. The most important underwriting risk is whether Retro can turn visible translational activity into durable execution before better-funded peers or narrower specialists do.
