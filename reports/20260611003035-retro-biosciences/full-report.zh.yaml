        title: 资产地图和阶段纪律
        blocks:
          - type: paragraph
            body: >-
              对 Retro 最重要的产品技术结论是，应把公司作为一个拥有单一临床楔子的多元化衰老生物学平台来承销，而不是认为它已经同等去风险化四大支柱。官方科学和管线页面持续展示四个具名项目族：HSC
              重编程、自噬增强、小胶质细胞疗法和组织重编程，管线页面还增加了 AI 设计蛋白疗法线。但成熟度分化很尖锐。RTR242 是唯一明确标注为 Phase 1 的资产，2026 年 5
              月公司博客也强调它已经完成首次人体给药。相比之下，RTR888、RTR890、组织重编程和 AI
              设计蛋白线披露为项目或平台努力，而不是有公开临床数据包的人体阶段药物。这一区分重要，因为公开记录确实支持模态的真实宽度，却不支持把这种宽度等同于治疗成熟度。投资人因此可以认可产品可选性和平台复用，同时仍把大部分临床就绪价值保留给自噬项目本身。
