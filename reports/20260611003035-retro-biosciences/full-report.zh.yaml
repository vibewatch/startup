  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界，以及 Retro 实际切入的销售对象
        blocks:
          - type: paragraph
            body: >-
              Retro 自身材料把公司定义为面向衰老和年龄相关疾病细胞驱动因素的疗法开发商，而不是消费者长寿、补充剂或健康服务公司。公开管线覆盖一款自噬小分子、iPSC 衍生小胶质细胞前体、iPSC 衍生造血干细胞、AAV
              递送组织重编程，以及 AI
              设计蛋白疗法。这意味着相关市场边界包括受监管处方疗法、细胞疗法制造和给药、基因疗法开发、专科临床交付，并最终包括围绕特定疾病项目的药企合作或对外授权。它不包括补充剂、纯诊断产品、医疗旅游、医美抗衰服务和直面消费者的「长寿诊所」。


              这一区分很重要，因为公开长寿市场报告常把处方生物制剂、营养补充剂、预防性健康产品和医美类别合并成一个头部数字。对 Retro
              来说，这种宽口径会夸大其凭受监管药物可合理捕获的支出部分。更可辩护的替代集合是按疾病划分的标准治疗：神经退行性疾病药物、移植和细胞疗法路径、血浆置换类似方案、骨科和听力损失干预，以及其他面向相同生物学或症状问题的专科疗法。因此，实际市场问题不是「长寿」是否足够大，而是
              Retro 每一种模态能否跨过疾病特定的临床、制造和报销门槛。
