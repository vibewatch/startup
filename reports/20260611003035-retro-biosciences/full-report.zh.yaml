        blocks:
          - type: paragraph
            body: >-
              Retro 能融资，但仅凭公开证据还无法承销。正向论据真实存在：公司有新的数十亿美元估值标记、有记录充分的 $180 million
              种子历史、有清晰运营规模信号，也有足够制造和质量建设，表明它试图把疗法推入临床，而不是停留在纯研究叙事。反向论据同样真实。独立报道仍把 Retro 定位为收入前、疗效前；2026 年 5 月估值远低于此前报道的
              $5 billion 目标；生物技术承销模型需要的标准财务输入没有一项公开，包括轮次募资额、收入组合、毛利率、现金余额、债务或合同现金义务。因此，投资人可以说 Retro
              拿得到资本，也有可信的科学运营足迹。但还不能说这些资本是否被高效转化、现有流动性还能维持多久，或者估值是否由经济性支撑，而不是由声望和承诺支撑。正确尽调姿态是把当前估值标记视为信心信号，而不是财务质量证明。
