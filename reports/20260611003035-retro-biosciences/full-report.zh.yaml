      - number: '8.4'
        title: 建议与尽调路径
        blocks:
          - type: paragraph
            body: >-
              目前最可辩护的立场是继续研究，而不是加价买入；信心为中，风险高，估值观点偏高。这不是否定 Retro 的科学。公司已经跨过有意义的里程碑，这个品类也仍能吸引顶级资本。但公开证据还不足以证明 $1.8
              billion 明显公允，更不用说有吸引力。价格敏感型投资人应要求故事和证明之间的差距收窄：精确融资经济条款、融资后现金跑道，尤其是足够强的首次人体生物标志物和安全性数据，证明 Retro
              的降风险速度快于普通临床前平台。如果这些点转向正面，立场可以向合理靠近。如果这些点转向负面，或在公司仍要求投资人锚定私人长寿声望时继续缺失，当前估值就会从偏高走向明显昂贵。在这些事实出现之前，纪律应来自等待证据、患者数据和条款清单现实，而不是为私人长寿稀缺性支付溢价。
