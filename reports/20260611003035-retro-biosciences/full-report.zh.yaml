      - number: '5.4'
        title: 信任控制、路线图和剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Retro 的信任和执行姿态在已有真实临床或制造工作流的地方最强，在仍要求外部相信生物学跃迁的地方最弱。对 RTR242 而言，公开记录至少达到了真实临床产品的门槛：官方和第三方来源支持它是 Phase 1
              资产，招聘页面描述了分析方法、稳定性计划、质量属性、CAPA、供应商资质和批次审核流程。但即便在这里，披露证据也止步于公开人体生物标志物或疗效输出之前。细胞疗法和基因疗法项目披露更薄。公开记录没有提供
              RTR888 或 RTR890 的临床前疗效数据包，也没有披露组织重编程项目的载荷设计、剂量、持久性或安全架构。这意味着路线图可以合理包含 2026 年和 2027
              年多个未来首次人体里程碑，但当前投资人视角仍应保守：Retro 似乎已经搭建了严肃的转化基础设施和连贯的组合地图，但可重复产品表现的公开证明仍落后于平台雄心。
