      - number: '3.3'
        title: 商业化姿态：价格基本缺席，所以竞争本质是融资、合作和转化基础设施
        blocks:
          - type: paragraph
            body: >-
              已审阅公开记录几乎没有提供 Retro、Altos、NewLimit、Life、Calico、Rejuvenate 或 Turn
              的可用疗法价格透明度。这不是电子表格少了一项细节，而是该品类今天竞争方式的核心事实。多数公司仍在出售融资和里程碑故事，而不是商业价格卡。在这种环境里，Retro 的差异点不是公开标价，而是可见的转化基础设施：与
              Multiply Labs 的 $85 million 制造合作、MCRI 血液干细胞授权交易，以及活跃的 GMP 和工艺开发招聘。Life 也显得运营上更具体，因为它披露了一轮与 ER-100 Phase 1
              执行绑定、已获足额认购的融资。Rejuvenate 兼具伴侣动物和人体的双重姿态，可能比纯人体同行更早形成商业证明；但保留来源仍强调管线建设和资本形成。Altos、NewLimit 和 Calico
              在某些方面都比 Retro 资金更充足，但保留证据在近期制造、定价或产品销售姿态上的公开细节，少于它们在科学雄心上的细节。
