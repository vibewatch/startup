  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接重编程同行旁边，还有资本密集型在位者和已经失败的领域先例
        blocks:
          - type: paragraph
            body: >-
              证据不支持把「长寿生物技术」视为同质化同业集合。Retro 直接竞争的是 Altos Labs、NewLimit、Life Biosciences、Turn Biotechnologies 以及
              Rejuvenate Bio 的部分业务等细胞重编程平台，因为它们都试图重置老化细胞功能，而不是只治疗一个下游症状。但买方和投资人也有替代选择：Calico 代表长期主义、合作驱动的在位者模式；Unity
              Biotechnology 代表最终关停的清除衰老细胞公开市场路径；只要某个窄适应症能比宽泛年轻化投资逻辑更快进入临床，传统疾病特定项目仍是现状替代方案。在这个领域内，Retro
              的特殊之处在于，保留的公开记录同时显示了多模态管线和当前人体试验，但它仍依赖风险资本、外部制造和研究授权，而不是已上市产品收入。这个组合使最相关比较集合窄于「所有衰老公司」，但宽于「其他干细胞创业公司」。
