            body: >-
              由于 Retro 没有披露客户数量，最好的公开采用替代指标是内部执行和就绪信号。官方称，公司在三年内推进到临床候选药物，在适应症选择后 15 个月内完成 RTR242 给药，建成内部 cGMP
              细胞疗法制造设施，并计划在 2026 年和 2027 年增加首次人体里程碑。团队页面称 Retro 超过 90 人，招聘页面则显示开放岗位覆盖计算生物学、HSC
              疗法、小胶质细胞疗法、运营和质量。招聘信息对客户尽调尤其重要，因为它揭示了 Retro 实际在为什么而建设：批次审核、供应商资质、CDMO
              监督、环境监测、电子批记录、生物反应器放大，以及两条活跃细胞疗法制造轨道。这些都是公司预期未来机构买方时有意义的就绪信号。它们不等于需求证明。已审阅来源没有披露入组转化、产品收入、已签商业分销或活跃医院采购。公开证据显示的是供给侧准备和项目推进，而不是活跃客户采用。除非管理层列出活跃临床站点、采购负责人、批次放行量和转化里程碑，否则这些就绪信号应被视为准备性基础设施，而不是经常性买方行为或商业拉力证据。
