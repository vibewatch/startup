      - number: '5.3'
        title: 平台栈、制造和实践者信号
        blocks:
          - type: paragraph
            body: >-
              Retro 的产品技术故事比纯品牌包装更可信，原因在于公司围绕发现和转化披露了大量平台管线。公司正在招聘基因组学、造血、生物反应器、GMP 运营和质量职能，岗位描述异常具体。它们指向
              RNA-seq、ATAC-seq、单细胞测定、甲基化分析、自动化方案转移、iPSC 分化、生物反应器放大、环境监测、电子批记录，以及 CDMO/CRO 质量监督。2026 年 5 月博客还声称建成内部 cGMP
              细胞疗法设施；MCRI 合作把 iHSC 项目绑定到外部血液干细胞 IP，而不是完全依赖内部科学跃迁。Retro 也通过 GitHub
              展示了真实但有限的公开开发者和实践者界面。这个界面不应被过度解读：其中很多是分叉的科学工具，而不是披露的自研治疗软件。即便如此，FlowKit、cNMF 和 AMPLIFY
              等公开代码库与一家从事流式细胞术、单细胞和蛋白模型工作流的计算生物学组织相一致。因此，公开信号支持它是一家具备湿实验室、数据和制造组件的真实平台组织，但不是拥有完全透明外部产品文档界面的公司。
