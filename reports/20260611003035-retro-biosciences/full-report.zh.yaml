      - number: '2.2'
        title: 需求真实存在，但规模测算受证据约束
        blocks:
          - type: paragraph
            body: >-
              底层需求信号并非推测。WHO 称，全球 60 岁及以上人口将从 2020 年的 1 billion 增至 2030 年的 1.4 billion 和 2050 年的 2.1 billion；WHO
              也强调听力损失、骨关节炎、糖尿病、COPD、抑郁和痴呆是老年常见疾病。WHO 的 Global Health Estimates
              基础设施明确按年龄、性别和病因追踪预期寿命、健康预期寿命、死亡率、发病率和疾病负担；这支持将衰老生物学视为疾病负担放大器，而不是单一孤立市场类别的战略逻辑。


              商业市场规模要模糊得多。HTF Market Intelligence 估计长寿疗法市场 2024 年为 $27.8B，2033 年增至 $84.6B；DataM Intelligence 则估计该市场 2023
              年为 $21.74B、2024 年为 $23.24B、2033 年为 $43.72B。这些报告有方向性价值，因为二者都按模态和年龄相关疾病应用切分市场，但它们不是 Retro 的干净 SAM。DataM
              把很大市场份额分给膳食补充剂；这与广义长寿消费支出有关，却不适合 Retro 的处方生物技术模式。正确读法是：公开分析报告提供外层 TAM 边界，而 Retro 真实 SAM/SOM
              仍未披露，因为公司没有公布多数项目的目标患者数量、定价假设或首批上市地域。
