      - number: '8.3'
        title: 情景逻辑与止损标准
        blocks:
          - type: paragraph
            body: >-
              情景逻辑应由里程碑驱动，而不是表格戏法驱动。乐观情景需要的不只是一份干净的 Phase 1 安全性读出。Retro 还需要积极的生物标志物证据、下一批首次人体里程碑的可信时间表，以及市场继续用 NewLimit
              式的私人乐观、而不是 BioAge
              式的公开市场纪律给它定价的迹象。基准情景更容易相信：人体安全性仍可接受，公司保持科学势头，但经济信息继续不透明，本轮价格大致充分而不是便宜。悲观情景不需要欺诈或科学完全失败。它只需要较弱的人体数据、进度滑坡，或融资条款显示普通股价值比标题暗示的更差。由于本章关注入场纪律，最重要的材料不是上行故事，而是能告诉投资人停止支付私人长寿溢价、回到公开可比公司逻辑的触发点。
