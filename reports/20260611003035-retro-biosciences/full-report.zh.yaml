      - number: '7.4'
        title: 缓释措施、监控指标与止损标准
        blocks:
          - type: paragraph
            body: >-
              Retro 并非没有风险意识。公司选择了针对具体疾病的项目，而不是硬走一条通用抗衰老审批路径；它已经为设施和质量体系建设融资；并且把最有野心的细胞治疗工作，配上了真实的外部 IP
              许可和可见的自动化伙伴。这些都是有意义的缓释因素。但这些因素还不足以压缩剩余风险。最重要、可监控的事件，是 RTR242
              第一次实质性人体更新：如果生物标志物和安全性数据只是平淡，临床故事仍会很窄；如果数据明确积极，风险会快速下降，因为主导资产开始真正为平台降风险。运营上要看的信号不是招聘帖，而是活系统证明：已放行批次、审计结果、检查准备度，以及外部
              CDMO 或 CRO 工作受控的证据。融资上，投资银团宽度和更清晰的信息披露，比又一个明星标题更重要。在这些具体里程碑到来之前，正确姿态是把 Retro
              视为资金已到位、但依赖仍很重的公司；它有几个可以从公开信息里监控的投资逻辑破裂触发点。
