        - 作为衰老生物学平台，Retro 进入首次人体给药的速度异常快。
        - 首次人体给药不是人体疗效，早期安全性表述仍是薄弱证据。
        - 发布明确积极的生物标志物和安全性数据包。
      - - 平台宽度
        - 公司有多个项目，也有制造和研究合作。
        - 在所有项目都还没有人体疗效时，宽度也可能稀释焦点。
        - 证明多个项目沿着有资金、有时间表的路径推进。
      - - 私有可比公司背景
        - NewLimit 和 Altos 显示，投资者仍愿意为重编程平台付费。
        - 公开长寿概念可比公司显示，叙事很强的衰老故事也可能远低于私募标记交易。
        - 扩大独立财团，或披露足以支撑溢价的证据。
      - - 资本结构
        - Altman 愿意资助长周期科学，降低了短期融资压力。
        - 单一资助人集中可能掩盖真实市场出清价格纪律。
        - 展示更深的投资者基础和普通轮次经济条款。
      - - 品类背景
        - 长寿赛道仍吸引主要风投和战略兴趣。
        - BCG 和 JPMorgan 都描述了一个更挑剔的市场，对泛化临床前定价容忍度更低。
        - 拿出公司特定证据，超过主题热情本身。
