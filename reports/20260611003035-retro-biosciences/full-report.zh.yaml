      - number: '1.3'
        title: 融资历史和资本结构
        blocks:
          - type: paragraph
            body: >
              Retro 的两个已验证资本锚点很强，其余融资图景则明显不完整。MIT Technology Review 报道称，Sam Altman 个人提供了启动 Retro 2021-2022 年建设的全部 $180
              million 初始资金，使公司从创立起就异常依赖单一资助人。2026 年 5 月 22 日，Retro 官方宣布下一轮融资首关完成，投前估值 $1.8 billion，由 4P Capital 领投；STAT
              独立确认了该估值。这两个事实足够扎实，可以作为后续估值工作的锚点。


              同样重要的是缺失项。公司没有披露 2026 年 5 月首关融资的绝对募资金额、除 4P Capital 外的其余投资方名单，或投后股权结构影响。一篇分析长文称，Altman 可能在同一窗口期前后又个人追加大约
              $180 million，使其累计个人资本超过 $200 million；但该跟投数字没有被本章抓取的一手来源或顶级来源独立证实。尽调中可验证的表述是：$180 million
              初始个人支持，加上一轮规模未披露、投前估值 $1.8 billion 的后续融资。
