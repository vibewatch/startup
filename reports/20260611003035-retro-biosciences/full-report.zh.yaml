chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、运营足迹和平台投资逻辑
        blocks:
          - type: paragraph
            body: >
              Retro Biosciences 是一家成立于 2021 年的长寿生物技术公司，明确使命是为人类寿命增加 10
              个健康年份。官方身份页面称，公司在开发针对衰老生物学驱动疾病的疗法，而不是单一症状产品。当前公开项目组合覆盖自噬增强、HSC 重编程、小胶质细胞疗法、组织重编程和 AI
              辅助蛋白工程；这些项目合在一起，更像多项目治疗平台，而不是单资产创业公司。


              运营足迹证据有混合信号，但方向清楚。Retro 公开招聘入口和原始职位页面地点标签显示，当前岗位位于 California 的 Redwood City；MIT Technology Review 2023
              年报道则把最初实验室建设定位在 San Francisco 附近的一座仓库。最稳妥的结论是：公司当前招聘足迹以 Bay Area 大范围内的 Redwood City
              为基础，而更早的启动报道把最初实验室足迹锚定在更靠近 San Francisco 的地点。公开商业指标仍未披露：已抓取的官方页面没有列出收入、客户、定价或部署。
