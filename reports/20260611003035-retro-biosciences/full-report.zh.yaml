            body: 两份可访问的公开市场报告对当前和 2033 年市场规模判断差异很大，其中一份还把膳食补充剂列为最大产品份额。因此，头部长寿市场规模不适合作为 Retro 的独立替代指标；Retro 已披露管线集中在受监管疗法。
