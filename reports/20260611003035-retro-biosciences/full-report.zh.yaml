      - number: '5.2'
        title: 各项目机制和支持性科学
        blocks:
          - type: paragraph
            body: >-
              Retro
              的产品投资逻辑异常依赖底层衰老机制是否足够可信，能否支撑多种模态。在这一点上，支持性科学方向上很强，但大多仍处于临床前。公司官方页面把自噬描述为细胞清理通路，把组织重编程描述为使用重编程因子的体内基因疗法，把小胶质细胞疗法描述为文献中血浆置换样效应的可扩展继任者。保留的技术文献大体支持这些选择。部分重编程文献展示了两层有用证据：第一，人类细胞工作提示，表观遗传年龄可以在体细胞身份完全丧失前下降；第二，小鼠研究显示，周期性
              OSKM 或 OSK
              表达可以在体内改善衰老表型、再生或视觉结果。自噬综述给出了一个生物学上连贯的理由，说明恢复溶酶体-自噬功能为何可能影响神经退行性疾病。血浆文献支持小鼠中血浆稀释或置换带来类似年轻化效应，包括降低神经炎症和改善认知；但它也强调方法学差异，以及过度解读这些模型的风险。净结果是，Retro
              的项目选择看起来有科学素养，但除 RTR242 外，多数支柱仍建立在公司尚未公开跨过的转化桥梁上。
