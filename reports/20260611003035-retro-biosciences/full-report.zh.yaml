        blocks:
          - type: paragraph
            body: >-
              最强的公开资本事实仍是种子资金。Retro 启动时获得 $180 million，MIT Technology Review 报道全部来自 Sam Altman。2026 年 5 月公告证明，公司如今已在 4P
              Capital 领投下按 $1.8 billion
              投前估值加入外部资本，但未披露轮次规模是一个重大分析缺口。这意味着投资人能看到估值动能，却无法衡量募资所得、稀释或现金跑道的真实延长幅度。与此同时，公司已经承担了明显昂贵的开发路径：一个 Phase 1
              小分子项目、内部 cGMP 细胞疗法设施、一项价值超过 US$35 million 的 MCRI 授权合作，以及一项最高价值 $85 million 的 Multiply Labs
              制造协议。这些事项显示雄心和能力建设，也强化了融资依赖，因为它们描述的是承诺和基础设施，而不是现金生成。下一个公开催化剂是预计 2026 年 8 月前后的 RTR242
              首个人体读数。实际看，这似乎是最可能影响未来融资讨论的清晰里程碑；但手头现金、债务和跑道仍未披露，所以资本充足性只能判断为方向上有支持，而非完全证明。
