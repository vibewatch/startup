      - number: '2.3'
        title: 买方、使用者、支付方和采用路径因模态明显不同
        blocks:
          - type: paragraph
            body: >-
              Retro 的公开管线意味着至少三条不同商业化通道。自噬项目路径最清楚：如果 RTR242
              持续推进，它可以走常规处方药渠道，由专科处方医生、医疗系统、处方集以及商业或公共支付方担任主要守门人。这仍然困难，但比商业化个性化细胞或基因疗法简单得多。相比之下，Retro 的 iPSC
              衍生小胶质细胞和造血干细胞项目意味着专科中心给药、cGMP 制造、冷链或受控物流，以及更密集的支付方审查。通过 AAV 递送因子进行组织重编程，则会面对基因疗法式上市路径，需要长期随访、专科给药和更重的 CMC
              审查。


              因此，Retro 的实际买方不是「长寿消费者」。未来买方更可能是专科医生、学术中心、移植或先进疗法站点、药企伙伴，以及愿意为特定疾病产品报销的保险方。AI
              设计蛋白处在价值链更早位置：在成为独立商业渠道前，它们可以提升发现生产率和合作价值。所有模态的采用顺序因此是：机制证明、适应症选择、IND
              支持数据包、早期临床信号、专科站点可扩展性，最后才是支付方支持的更广泛采用。Retro 的模态宽度带来多次射门机会，也意味着公司没有单一买方地图或销售动作。
            claimRefs:
