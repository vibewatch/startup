        - 近期最重要的去风险事件将不再能支撑私募溢价标记。
        - 大幅重置估值预期，或停止承销。
      - - 后续首次人体试验里程碑滑坡
        - 2026-2027 平台节奏错过公司自己的时间表
        - 宽度从上行空间变成扩散风险。
        - 将平台溢价视为尚未挣到。
      - - 融资经济条款保护投资者
        - 优先权、棘轮或大量老股转让让普通股价值远弱于头条显示
        - 头条投前估值高估了真实入场质量。
        - 按普通股现实重新定价，而不是按新闻稿观感定价。
      - - 公开衰老生物技术重估继续恶化
        - BioAge 式公开可比公司进一步压缩，同时私募偏好收窄
        - Retro 失去品类热情带来的好处。
        - 使用悲观情景区间，而不是私募声望可比公司。
      - - 验证仍过度集中在创始人身上
        - 当前轮次后，没有更广泛的独立财团或第三方证据出现
        - 市场出清信号仍然含混。
        - 维持继续研究建议，或回避。
    notes: 这些是最小一组可监测条件；它们会迫使投资者改变估值判断，而不是仅仅微调判断。
    claimRefs:
      - CV007
      - CV024
      - CV025
      - CV040
      - CV041
      - CV048
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 轮次规模和条款
        - 精确到账现金、优先权堆栈、稀释和任何老股转让部分均未公开。
        - 头条估值可能高估普通股入场经济性。
        - 要求提供已签署条款清单和更新后股权结构表。
      - - 融资后烧钱与跑道
        - 没有公开来源量化新融资能支撑运营多久。
        - 跑道决定 Retro 能否在被迫融资前到达下一个证据点。
        - CFO 尽调包，包含月度烧钱桥。
      - - RTR242 数据包
        - 只有高层表述；公开资料没有生物标志物或剂量反应细节。
        - 这是可能把估值立场推向公允的关键事件。
        - 临床更新材料和试验方案审阅。
      - - 项目级资本配置
        - 公开来源没有显示资本如何分配到自噬、重编程、细胞疗法和 AI 工作。
        - 只有资源配置有纪律，平台宽度才有价值。
        - 董事会材料或管理层运营计划。
      - - 财团广度和外部验证
        - 公开证据没有显示，除领投方和 Altman 持续支持外，新投资者基础有多广。
        - 更广泛的独立验证会提高信心，说明价格是市场出清价。
        - 投资者名单、分配备忘录和伙伴参考电话。
    notes: 在这些问题回答之前，正确姿态是保持尽调纪律，而不是接受当前标记为公允价值。
    claimRefs:
      - CV006
      - CV025
      - CV040
      - CV047
      - CV048
