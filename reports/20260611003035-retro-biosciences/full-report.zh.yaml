      - number: '1.2'
        title: 领导层、创始人和治理信号
        blocks:
          - type: paragraph
            body: >
              Joe Betts-LaCroix 是可见的创始人代表，也是公开决策节点。官方和第三方简历一致把他列为联合创始人兼 CEO，此前有 OQO 和 Vium 的风投支持退出经历，也曾在 Y Combinator
              任职。这一背景重要，因为 Retro 的模式结合了深科技融资、自动化导向执行，以及并行推进多项科学赌注的意愿。官方团队材料称团队超过 90 人，并列出 Sheng Ding、Jessica
              Sprueill、Alex Trapp、Peng Liu、Shirley Telebrico 等科学负责人；顾问名单则包括 Alejandro Ocampo 和 Vadim Gladyshev。


              创始人集中度既是资产，也是尽调风险。MIT Technology Review 报道称，Betts-LaCroix 围绕单一资助人资本基础搭建
              Retro，并描述了一种创始人控制异常强的运营风格。公开材料没有披露董事会构成、投资人席位或内部授权决策权。已抓取来源也无法完全厘清除 Betts-LaCroix 外谁应被视为正式联合创始人，不过第三方报道把
              Sheng Ding 与创始科学投资逻辑紧密相连，一份分析来源还提到 Matt Buckley。
