      - number: '7.2'
        title: 制造和运营执行风险
        blocks:
          - type: paragraph
            body: >-
              公开记录显示，Retro 确实有制造落地的意图；但同一批记录也说明，公司仍在搭建让科学野心可重复运转的运营纪律。管理层称，公司已经建成内部 cGMP
              细胞治疗制造设施，这一点重要。更强的线索来自招聘页面：公司仍在招聘能亲手负责 QMS、批次审核、QA 放行、偏差和 CAPA 流程、供应商与 CDMO
              资质认定、分析策略、稳定性、控制策略和检查准备的人。生物反应器岗位尤其说明问题，因为岗位描述的是定制系统，需要无菌组装、排查泄漏和传感器漂移、维护校准日志、更新 SOP，并用文档支撑 GMP
              转换。这不是一台已经成型的工业机器；而是一套还在加固的规模化系统。Multiply
              可以在自动化上帮忙，但它自己的交易材料也承认，仪器或工艺变化可能触发可比性工作和监管重新提交。对投资人而言，制造风险已经不再是概念风险，但仍是阶段相称的风险，而不是成熟体系的风险。
