  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型和变现状态
        blocks:
          - type: paragraph
            body: >-
              Retro 的公开财务画像很特殊：估值披露充分，收入却没有披露。官网和管线页面显示，公司拥有一个 Phase 1
              小分子项目和若干更早期细胞疗法与重编程资产，但没有获批产品、没有公开价格表，也没有披露商业收入。P05 的独立分析更进一步，明确把公司描述为收入前、疗效前；这与其余公开记录一致：2026 年 5
              月融资公告披露了估值、领投方和未来计划里程碑，但没有披露销售、产品收入或该轮本身的美元规模。可支持的结论是，Retro
              目前仍主要靠平台承诺和临床进展融资，而不是靠可观察变现。近期经济价值很可能必须来自未来授权、里程碑付款或最终产品上市，但这些路径在公开材料中仍是假设。这对早期临床生物技术公司很正常，却显著限制了承销，因为投资人今天无法用公开证据测试收入质量、经常性组合或定价权。
