  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资锚点与公开证明缺口
        blocks:
          - type: paragraph
            body: >-
              Retro 现在已经从纯叙事创业公司，跨到拥有真实定价轮和真实首次人体资产的公司；但这两个事实不应混为一谈。2026 年 5 月 22 日的官方公告把标题锚定在 $1.8 billion 投前估值，并称
              RTR242 用 15 个月达成首次人体给药，2026 年和 2027
              年还计划更多首次人体里程碑。对于一个衰老生物学平台，这是有意义的执行。独立报道也暗示，首项研究尚未显示剂量限制性毒性。公开档案仍没有给出传统估值工作通常首先需要的东西：融资规模、优先权、稀释、烧钱速度、收入、人体有效性，或生物标志物幅度。即便还没进入可比公司分析，这也让入场价格更容易被描述，而不是被承销。投资人被要求为未来衰老生物学证明的期权价值买单，而不是为已经披露的经济指标或已降风险的临床数据买单。
