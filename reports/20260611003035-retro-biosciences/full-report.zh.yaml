  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和临床路径风险
        blocks:
          - type: paragraph
            body: >-
              Retro 最大的公开风险在于，领先人体证据仍很窄，而更广泛平台雄心很宽。RTR242 确实处于 Phase 1，但 ANZCTR
              记录显示，这是一项健康志愿者安全性、耐受性和药代动力学研究，而不是阿尔茨海默病患者中的疗效研究。这一点重要，因为 Retro 更雄心勃勃的价值故事仍越过单一小分子项目，指向 iPSC
              衍生细胞疗法和体内基因疗法。FDA
              指南有帮助，但并不能让人安心：该机构自己的早期阶段和临床前材料明确把类别风险锚定在既往死亡、白血病、肿瘤形成、长期生物活性、免疫原性、生物分布不确定性，以及基因疗法产品的长期随访负担上。澳大利亚可以加快首次人体进入，但不能解决后续仍需要的疾病特异性疗效、已验证
              CMC 和持久安全性数据包。因此，近期问题不是 Retro 是否已经进入临床——它已经进入——而是首个人体数据包是否足够强，能降低类别层面风险，而不只是确认公司可以给人用药。
