      - number: '7.3'
        title: 合作伙伴、IP 与资本集中风险
        blocks:
          - type: paragraph
            body: >-
              Retro 的依赖关系异常清晰，而且其中几条是单线依赖。iHSC 平台锚定在 MCRI 的独家许可上，战略上看很强，但距离首次人体证明仍有多年。细胞治疗规模化也绑定 Multiply；Retro
              这笔交易被描述为其机器人系统的首个商业销售。OpenAI 合作抬高了叙事，但公开证据仍由合作方控制，且没有经过同行评议，因此它更多提高了可选性，而不是完成了尽调闭环。法律层面，Cooley 对 2026 年
              REGENXBIO 判决的分析是一个有用提醒：工程细胞构建物的专利适格性比以前更清楚，但还没顺到可以忽略摩擦。资本结构同样集中。Retro 确实完成了一轮真实的 $1.8 billion
              投前融资，但独立报道称，这个数字明显低于此前讨论过的 $5 billion 目标；更早的报道也明确指出，Sam Altman 个人提供了最初全部 $180 million
              种子资金。因此，公司看起来资金到位，但还没有像一个更分散的投资银团所暗示的那样，获得广泛验证。
