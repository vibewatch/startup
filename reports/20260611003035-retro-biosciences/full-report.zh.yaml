        title: 耐久性、未来买方路径和尽调缺口
        blocks:
          - type: paragraph
            body: >-
              未来买方路径直观，但仍是假设。若阿尔茨海默病项目最终产生疗效和报销支持，RTR242 会指向神经科医生、医疗服务系统和支付方。若 MCRI 衍生科学从小鼠数据转化为安全人体使用，iHSC
              项目会指向移植中心、医院和血液科专家。公开材料也让渠道所有权保持模糊：它们没有说明医院、支付方或未来药企伙伴中谁拥有预算权，什么采购流程会支配采用，或细胞疗法项目会按定制程序还是标准化产品报销。但今天这些渠道都没有公开采购、报销或分销证明。耐久性问题更尖锐：已审阅来源没有披露
              NRR、流失率、续约条款、合同期限、头部账户暴露或满意度指标。即便具名交易对方集合也足够窄，集中度风险值得关注——MCRI 对应核心 iHSC IP，Multiply 对应自动化放大，OpenAI
              对应一个显眼但仍未同行评审的 AI 故事。独立报道还增加了反向市场信号。P05 和 STAT 都把 Retro 描述为收入前、疗效前公司；据报道从 $5 billion 目标转向 $1.8 billion
              首关，说明投资人仍谨慎看待科学可信度能多快转化为商业牵引。尽调中，管理层不仅需要证明科学质量，还要证明每个项目究竟由谁购买、报销、制造并续约。
