      - number: '1.4'
        title: 里程碑、临床转折和执行足迹
        blocks:
          - type: paragraph
            body: >
              Retro 已经从隐身期长寿投资逻辑走向临床阶段的多项目平台，但证据仍支持「尚未证明疗效」判断，而不是已去风险的治疗故事。最清晰的执行里程碑是 RTR242：官方和第三方报道一致显示，这款口服自噬候选药物在
              2025 年进入首次人体 Phase 1，在 Adelaide 健康志愿者中开展随机、双盲、安慰剂对照研究。STAT 2026 年 5 月报道称，管理层尚未看到剂量限制性毒性，并预计 2026 年 8
              月前后获得初步数据。这是有意义的进展，但仍属于安全性阶段证据。


              平台其余部分更早期，也更具推测性。OpenAI 和 Retro 公开合作声称，体外重编程标志物表达提高超过 50 倍，DNA
              损伤修复也改善；但即便支持性分析报道也指出，这项工作尚未经过同行评审，也没有基于已释放序列被独立复现。细胞疗法方面，Murdoch Children's Research Institute 与 reNEW
              的合作更具体：交易对方描述了独家授权路径，以及一项价值超过 $35 million、面向自体血液干细胞疗法的合作。招聘信息进一步支持制造就绪度，公司在多个项目上招聘内部 GMP、质量、分析和生物反应器岗位。
