            body: >-
              公开证据对成本强度的支持远强于对单位经济的支持。Retro 当前招聘入口显示，团队超过 90 人，在 Redwood City 现场办公，并积极招聘 GMP
              运营、质量保证、生物反应器工程和细胞工艺制造岗位。这些岗位不是轻资产发现公司的典型特征。它们指向一家公司在湿实验室科学之上，同时承担实验室开销、制造就绪工作、质量系统和外部伙伴管理。公司还称已建成内部 cGMP
              细胞疗法制造设施；职位描述提到 CDMO、CRO、临床药品放行、批次审核和生产支持。用五个已发布薪资区间作为狭窄公开替代指标，得到的年基础工资底线约为 $12.4 million 至 $14.2
              million，也就是福利、设施、试剂、临床执行或伙伴支出之前每月约 $1.04 million 至 $1.19
              million。这不是真实烧钱速度，但足以显示当前估值建立在资本密集型运营模型之上。最关键的数据仍缺失：收入、毛利率、现金消耗、回本周期，以及按项目计算的资本效率。
