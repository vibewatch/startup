      - number: '2.4'
        title: 主要驱动因素是人口结构和科学进展；主要约束是监管、资本和可及性
        blocks:
          - type: paragraph
            body: >-
              Retro 受益于三条可信顺风。第一，人口结构和老年疾病负担构成结构性需求背景，不依赖消费者炒作。第二，公司已经证明自己能比许多长寿同行推进更快，在建设细胞疗法、组织重编程和 AI
              赋能蛋白能力的同时，让自噬项目进入首次人体。第三，AI 生物学工具如今在靶点识别、分子设计和多组学分析中已有实质用途，可以缩短平台型生物技术公司的发现周期。


              更难的事实是，瓶颈在下游。DataM 明确指出，主要监管机构并不把衰老本身认定为疾病，迫使赞助方围绕具体年龄相关适应症推进。NIH 和 FDA 材料把细胞和基因疗法描述为具有独特
              CMC、非临床和临床义务的额外监管产品。同行评审和行业来源描述了细胞疗法的高异议率、高生产成本、长交付周期、制造波动和个性化模态的市场准入挑战。BCG
              进一步认为，这些约束已经促使大型生物制药公司远离物流繁重的高度个性化药物。对 Retro
              而言，公司科学宽度有战略吸引力，但估值仍会绑定资本强度、疾病特定临床执行，以及把其中一个平台转化为商业上可现实上市路径的能力。
