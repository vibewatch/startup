  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 现在是交易对方，不是产品客户
        blocks:
          - type: paragraph
            body: >-
              Retro 的公开客户界面更适合描述为一组商业化助推者，而不是活跃疗法客户群。在已审阅官方页面中，Retro
              讨论的是开发疗法、管线资产和未来首次人体里程碑，但没有披露付费医院、支付方、诊所或药企客户。具名外部证据反而来自三类交易对方。MCRI 提供最清晰的授权证据：它公开称 Retro 签署了一项价值超过 US$35
              million 的血液干细胞 IP 研究和商业授权协议，并成为自体 iPSC 衍生造血干细胞疗法的独家被授权方。Multiply Labs 提供最清晰的采购证据：行业报道称 Retro 签署了一项最高价值 $85
              million 的商业和供应协议，GEN 把该交易描述为 Multiply 的首笔商业销售。OpenAI 提供最清晰的研究合作证据，但该证据是科学性的，而非商业性的。合在一起，这些关系说明可信机构愿意围绕
              IP、工具和研究与 Retro 交易。它们尚未显示处方需求、付费疗法使用量，或真实终端客户的重复购买。
