        title: 护城河耐久性和反向证据：领域失败说明资本本身不是护城河
        blocks:
          - type: paragraph
            body: >-
              Retro 最强的竞争论点不是没有对手，而是在若干同行原型显露压力之际，它把直接人体证据、多种衰老机制和可见转化伙伴组合到了一起。Unity
              的关停和解散文件是最清楚的警告：有吸引力的长寿投资逻辑仍可能走向清算。Calico 长达十年的 AbbVie 关系以裁员告终，是第二个警告：即便有 Alphabet
              背书，科学也可能难以把耐心资本和合作资本转化为持久商业动能。Turn 失败的资产出售过程从小公司端给出了同一教训。这些不是否定 Retro 的理由，而是要求按执行来承销它，而不是按头部估值来承销。Retro
              仍面对 Altos、NewLimit 等资本更厚的直接同行，以及 Life 这类更窄、临床阶段专科公司的严重替代风险。但领域证据提示，最耐久的护城河将来自把制造就绪、试验推进和伙伴准入更快转化为可重复产品执行。
