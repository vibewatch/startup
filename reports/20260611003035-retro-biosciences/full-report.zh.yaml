  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Retro 的产品架构不是经典软件栈，而是把衰老机制逻辑层层落到模态项目， 再接上发现和转化基础设施。
    data:
      layers:
        - label: 机制层
          modules:
            - 部分细胞重编程
            - 自噬增强
            - 血浆启发 / 小胶质细胞焕新
            - 造血焕新
          note: The retained public record consistently clusters Retro around aging mechanisms, not one disease franchise.
        - label: 模态 / 资产层
          modules:
            - RTR242 小分子
            - RTR888 iPSC 衍生小胶质细胞
            - RTR890 iPSC 衍生 HSC
            - AAV 组织重编程
            - AI 设计蛋白疗法 / 工程化因子
          note: Only RTR242 is explicitly human-stage; the others remain platform or preclinical on public evidence.
        - label: 发现和测量层
          modules:
            - OpenAI GPT-4b micro 合作
            - Retro 湿实验室重编程筛选
            - RNA-seq / ATAC-seq / 单细胞检测
            - 甲基化 profiling
            - 流式细胞术
          note: This layer is where AI and genomics presently appear most directly evidenced.
        - label: 转化和运营层
          modules:
            - 生物反应器
            - 内部 cGMP 细胞治疗设施
            - QMS / CAPA / 批次审查
            - CDMO / CRO 监督
            - MCRI iHSC 合作
            - Phase 1 生物标志物读数
          note: Translation evidence is strongest for RTR242 and the cell-therapy manufacturing build-out.
    approximationNotes: 这套栈是基于官方管线页、合作伙伴公告、职位描述和 OpenAI 合作页面重建出的分析框架。 内部接口、决策规则和资产交接并未公开记录。
