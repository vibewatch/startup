      - number: '8.2'
        title: 可比组合与下行证据
        blocks:
          - type: paragraph
            body: >-
              正确的可比集合会给出双向信号。乐观一面，Retro 并不是唯一一家在仍在搭建衰老平台时就背负很高私人估值的公司。Altos 启动时有 $3 billion 承诺资本，NewLimit 在 2026 年 6 月融资
              $435 million 后，据报道估值达到 $3.1 billion，并加速推进首个试验。这告诉投资人，这个品类仍能吸引重金。谨慎一面，公开市场远没有这么宽容。BioAge
              已经上市、处于临床阶段、有融资且完整提交监管文件，2026 年 6 月市值仍在约 $0.68 billion 至 $0.70 billion。Unity 是更严厉的警示：最新 10-K
              里有持续经营表述，市值只有几百万美元。更广泛的市场评论也强化同一点：2026 年资本更挑剔，BCG 称平均临床前估值已经较 2021 年峰值大幅塌缩。因此，Retro
              低于最泡沫化的私人重编程估值，但相对公开披露的衰老生物科技证据，仍然昂贵。
