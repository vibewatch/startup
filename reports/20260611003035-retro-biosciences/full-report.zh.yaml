      - number: '3.2'
        title: 模态和阶段：Life 是最接近的人体阶段重编程同行，Altos 和 NewLimit 资本充足但披露更少
        blocks:
          - type: paragraph
            body: >-
              Retro 的公开管线比多数同行更宽：自噬、iPSC 衍生小胶质细胞、诱导造血干细胞、组织重编程和 AI 设计蛋白疗法都出现在公司管线页面。这种宽度有竞争意义，因为保留的多数同行更窄。Life
              Biosciences 是部分表观遗传重编程领域最干净的直接可比对象，但它集中在视神经病变中的 ER-100，而不是 Retro 的跨平台地图。NewLimit
              也明确处在表观遗传重编程赛道，但其保留披露仍描述的是原型药物和明年进入人体试验的计划，而不是正在进行的研究。Altos 披露更弱：官网停留在细胞年轻化使命层面，报道则强调巨额融资和具体项目保密。Turn
              看起来更弱，外部报道聚焦资产交易而非临床进展。实际含义是，Retro 不是资金最充足的重编程创业公司，但它是少数披露了临床项目并拥有多个相邻平台赌注的公司之一。
