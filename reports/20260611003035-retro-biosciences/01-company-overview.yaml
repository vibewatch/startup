  evidenceGaps:
    - type: missing-source
      severity: material
      topic: leadership-disclosure
      missingEvidence: A company-published org chart or executive-bio page that identifies titles, reporting lines, and the formal founder set beyond Joe Betts-LaCroix.
      whyItMatters: Leadership concentration and succession assessment are weak when public sources name people without clearly defining roles or authority.
      diligencePath: Request the current executive org chart, board observer list, and bios for all named team-page leaders.
      relatedQuestionRefs: [QO004, QO023]
      relatedTableRefs: [TO002]
    - type: missing-source
      severity: minor
      topic: headquarters-disclosure
      missingEvidence: An official company address or headquarters statement on Retro's website or a current registry extract tied to the operating footprint.
      whyItMatters: Current sources support Redwood City hiring activity but do not cleanly reconcile operating, mailing, and early-launch Bay Area locations.
      diligencePath: Request current legal-entity addresses, lease summaries, and the address used for regulatory filings and major counterparties.
      relatedQuestionRefs: [QO005]
      relatedTableRefs: [TO001]
    - type: private-evidence-only
      severity: material
      topic: 2026-financing-disclosure
      missingEvidence: Definitive round size, investor syndicate, security type, post-money ownership, and documentary support for any additional Altman personal capital beyond the verified initial $180M.
      whyItMatters: Later valuation and dilution analysis cannot be done confidently without the actual round terms and the extent of continued founder-backer concentration.
      diligencePath: Request the financing deck, executed term sheet, updated cap table, and investor allocation schedule for the May 2026 round.
      relatedQuestionRefs: [QO011, QO014]
      relatedTableRefs: [TO003]
    - type: private-evidence-only
      severity: material
      topic: commercial-metrics
      missingEvidence: Revenue, ARR, customer count, commercial deployment metrics, and pricing or reimbursement evidence.
      whyItMatters: A company-overview chapter can anchor identity and capital without these metrics, but later market, financial, and valuation work is handicapped if no commercial base is visible.
      diligencePath: Request revenue bridge, booked versus recognized revenue, current customer list, pipeline summary, and cohort-level deployment metrics.
      relatedQuestionRefs: [QO022]
      relatedTableRefs: [TO001]
    - type: missing-source
      severity: material
      topic: ai-validation
      missingEvidence: Peer-reviewed publication, released protein sequences, or independent external replication of the GPT-4b micro reprogramming claims.
      whyItMatters: The OpenAI collaboration materially influences Retro's platform narrative, yet public evidence still stops at company-partner writeups and analytical commentary.
      diligencePath: Request manuscript status, underlying sequences, external validation data, and any freedom-to-operate analysis for AI-designed factors.
      relatedQuestionRefs: [QO020]
