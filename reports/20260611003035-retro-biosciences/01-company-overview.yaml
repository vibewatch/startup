callouts:
  - calloutType: strength
    title: Clinical transition is real, not purely narrative
    body: Retro is no longer only a longevity concept deck; RTR242 reached first-in-human Phase 1 in 2025, management reported no dose-limiting toxicities as of May 2026, and the company is openly hiring against clinical manufacturing, GMP, and analytical-quality workflows. That combination materially differentiates it from many still-preclinical longevity peers, even though efficacy remains unproven.
    claimRefs: [CO019, CO020, CO021, CO025, CO026, CO027]
  - calloutType: risk
    title: Capital concentration and valuation opacity remain material
    body: The verified capital story is unusually concentrated; Sam Altman personally funded the entire initial $180M launch and 4P Capital anchors the latest disclosed valuation event, yet the May 2026 round size, broader syndicate, and any additional Altman follow-on dollars remain undisclosed. This limits confidence in dilution, governance, and valuation interpretation.
    claimRefs: [CO012, CO013, CO014, CO015, CO036]
  - calloutType: risk
    title: Science narrative runs ahead of public validation
    body: OpenAI and Retro publicly claim dramatic in-vitro reprogramming gains, and analytical coverage sees genuine scientific ambition, but the relevant proteins and training data are not yet openly released or peer reviewed. As of the 2026 run date, the company still has human safety work underway and no public human efficacy result supporting the multi-billion valuation.
    claimRefs: [CO028, CO029, CO030, CO037, CO038, CO039]
