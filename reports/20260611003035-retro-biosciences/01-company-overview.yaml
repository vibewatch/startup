company:
  name: Retro Biosciences
chapter:
  number: 1
  title: Company Overview
  summary: Retro Biosciences is a 2021-founded longevity biotech led by Joe Betts-LaCroix, publicly centered on autophagy, cell therapy, and reprogramming programs aimed at adding 10 healthy years to human lifespan. Verified capital anchors are Sam Altman's $180 million sole initial backing and a May 22, 2026 financing initial close at a $1.8 billion pre-money valuation led by 4P Capital. The company has reached Phase 1 with RTR242 and announced Murdoch/OpenAI-linked milestones, but round size, full syndicate, governance details, and commercial metrics remain materially undisclosed.
sections:
  - id: identity-footprint-platform
    title: Identity, Operating Footprint, and Platform Thesis
    body: |
      Retro Biosciences is a longevity biotech founded in 2021 with the explicit mission of adding 10 healthy years to human lifespan. Official identity pages describe the company as developing therapies for diseases driven by the biology of aging rather than single symptomatic products. The current public program set spans autophagy enhancement, HSC reprogramming, microglia therapeutics, tissue reprogramming, and AI-assisted protein engineering, which together point to a multi-program therapeutics platform rather than a single-asset startup.

      The operating-footprint evidence is mixed but directionally clear. Retro's public careers surface and raw job-page location chips point to Redwood City, California for current openings, while MIT Technology Review's 2023 reporting described the initial lab buildout in a warehouse near San Francisco. The safest conclusion is that the present hiring footprint is Redwood City-based within the broader Bay Area, while older launch coverage anchored the earliest lab footprint nearer San Francisco. Public commercial metrics remain undisclosed: the fetched official pages do not name revenue, customers, pricing, or deployments.
    claimRefs: [CO001, CO002, CO003, CO004, CO007, CO009, CO010, CO011, CO040, CO042, CO043, CO044, CO047]
    tableRefs: [TO001]
    figureRefs: [FO002, FO003]
  - id: leadership-governance
    title: Leadership, Founders, and Governance Signals
    body: |
      Joe Betts-LaCroix is the visible founder figure and public decision node. Official and third-party bios consistently identify him as co-founder and CEO, with prior venture-backed exits at OQO and Vium plus time at Y Combinator. That background matters because Retro's model combines deep-tech fundraising, automation-minded execution, and a willingness to run multiple scientific bets in parallel. Official team material says the team is 90+ strong and names scientific leaders including Sheng Ding, Jessica Sprueill, Alex Trapp, Peng Liu, and Shirley Telebrico, while advisor listings include Alejandro Ocampo and Vadim Gladyshev.

      Founder concentration is both an asset and a diligence risk. MIT Technology Review reported that Betts-LaCroix built Retro around a single-benefactor capital base and described an unusually founder-controlled operating style. Public materials do not disclose board composition, investor seats, or internal delegated decision rights. Fetched sources also do not fully reconcile who should be treated as formal co-founders beyond Betts-LaCroix, though third-party reporting ties Sheng Ding closely to the founding scientific thesis and one analytical source also names Matt Buckley.
    claimRefs: [CO005, CO006, CO008, CO033, CO034, CO035, CO036, CO045]
    tableRefs: [TO002]
  - id: funding-capital-structure
    title: Funding History and Capital Structure
    body: |
      Retro's two verified capital anchors are strong and the rest of the financing picture is materially incomplete. MIT Technology Review reported that Sam Altman personally provided the entire $180 million initial funding that launched Retro's 2021-2022 buildout, making the company unusually dependent on a single benefactor from inception. On May 22, 2026, Retro officially announced the initial close of its next financing round at a $1.8 billion pre-money valuation led by 4P Capital, and STAT independently confirmed the valuation. Those two facts are solid enough to anchor later valuation work.

      What remains missing is equally important. The company did not disclose the absolute dollars raised in the May 2026 initial close, the rest of the investor list beyond 4P Capital, or the post-money cap-table implications. An analytical long-form profile reported that Altman may have personally added roughly another $180 million around the same window, which would take his cumulative personal capital above $200 million, but that follow-on figure is not independently corroborated by the primary or top-tier sources fetched for this chapter. For diligence purposes, the verified statement is $180 million initial personal backing plus a later $1.8 billion pre-money round with undisclosed size.
    claimRefs: [CO012, CO013, CO014, CO015, CO036, CO039]
    tableRefs: [TO003]
  - id: milestones-clinical-transition
    title: Milestones, Clinical Transition, and Execution Footprint
    body: |
      Retro has moved from a stealth longevity thesis into a clinical-stage, multi-program platform, but the evidence still supports a pre-efficacy judgment rather than a de-risked therapeutics story. The clearest execution milestone is RTR242: official and third-party reporting agree that the oral autophagy candidate entered first-in-human Phase 1 in 2025, with a randomized, double-blind, placebo-controlled study in healthy volunteers in Adelaide. STAT reported in May 2026 that management had not seen dose-limiting toxicities and expected initial data around August 2026. That is meaningful progress, but it remains safety-stage evidence.

      The rest of the platform is earlier and more speculative. OpenAI and Retro's published collaboration claims more than 50-fold higher reprogramming-marker expression plus improved DNA-damage repair in vitro, yet even supportive analytical coverage notes that the work is not yet peer-reviewed or independently reproduced from released sequences. On the cell-therapy side, the Murdoch Children's Research Institute and reNEW partnership is more concrete: the counterparties describe an exclusive-license path and a partnership worth over $35 million aimed at autologous blood stem cell therapies. Job postings further support manufacturing readiness, with in-house GMP, quality, analytical, and bioreactor roles across multiple programs.
    claimRefs: [CO016, CO017, CO018, CO019, CO020, CO021, CO022, CO023, CO024, CO025, CO026, CO027, CO028, CO029, CO030, CO031, CO032, CO037, CO038, CO041, CO046, CO048]
    tableRefs: [TO004]
    figureRefs: [FO001]
