  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retro-sam-som
    missingEvidence: Program-level target populations, launch geographies, pricing assumptions, and expected treatment settings for each lead asset.
    whyItMatters: Without those inputs, a clean public SAM or SOM for Retro cannot be calculated and any valuation narrative risks over-relying on broad longevity TAM rhetoric.
    diligencePath: Request management’s indication-by-indication patient-count, geography, pricing, and partnering assumptions plus the internal launch-prioritization model.
    relatedQuestionRefs:
    - QM022
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: retro-pricing
    missingEvidence: Public pricing or pharmacoeconomic assumptions for RTR242 and no company-specific price benchmarks for Retro’s future cell- or gene-therapy assets.
    whyItMatters: Pricing is required to turn disease burden or population counts into a usable commercial model, especially when modalities have very different reimbursement paths.
    diligencePath: Obtain internal target product profiles, willingness-to-pay work, payer research, and any analog pricing framework Retro uses by modality.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
    - TM003
  - type: conflicting-data
    severity: material
    topic: longevity-market-estimates
    missingEvidence: A methodology-clean public market study that separates prescription therapeutics from supplements, wellness, and aesthetic categories.
    whyItMatters: The current accessible analyst reports disagree on both current market size and 2033 forecast, and they appear to define the category differently.
    diligencePath: Commission or request a bottoms-up indication-by-indication market model aligned to Retro’s actual modalities instead of relying on generic longevity-market reports.
    relatedQuestionRefs:
    - QM002
    - QM025
    relatedTableRefs:
    - TM002
