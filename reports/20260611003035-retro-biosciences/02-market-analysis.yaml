- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Global aging demographics and older-age disease burden
    - driver
    - Structural / multi-decade
    - Supports durable demand for therapies that prevent or delay age-related disease
    - Verify which high-burden indications Retro prioritizes first and why
  - - Retro’s transition from first lab to first clinical candidate
    - driver
    - Near-term proof point
    - Shows unusually fast internal translation relative to many longevity peers
    - Request milestone-by-milestone cost, attrition, and decision rules across programs
  - - AI-enabled discovery concentrated in R&D
    - driver
    - Now
    - Can improve target identification, protein engineering, and biomarker work before clinical proof
    - Ask for measurable productivity deltas from Retro’s AI systems versus standard workflows
  - - Broader biotech financing recovery with early-stage divergence
    - mixed
    - 2025-2026
    - Large rounds remain possible, but capital is concentrating into fewer, higher-conviction assets
    - Test Retro’s financing runway assumptions by modality and capital budget
  - - Aging not recognized as a disease by major regulators
    - constraint
    - Persistent
    - Forces each asset into disease-specific endpoints and indication strategy
    - Ask for the regulatory path and target indication for each lead program
  - - CGT CMC complexity and manufacturing variability
    - constraint
    - Now through launch
    - Raises timelines, capex, and execution risk for cell and gene therapy programs
    - Review Retro’s in-house manufacturing readiness, comparability plans, and external redundancy
  - - Access and go-to-market friction for personalized / complex modalities
    - constraint
    - Launch phase
    - Can block adoption even after scientific success if logistics and payer math remain unattractive
    - Request a draft site-of-care and payer strategy for iPSC and AAV programs
  - - High development cost of advanced therapies
    - constraint
    - Now
    - Makes portfolio breadth expensive and can force prioritization or partnering before commercialization
    - Pressure-test whether Retro can self-fund multiple late-stage modalities or must partner early
  notes: 'The constraint rows combine regulator, peer-reviewed, consulting, and trade evidence because public sources converge on the same commercialization bottlenecks: indication specificity, CMC, cost, and access.'
