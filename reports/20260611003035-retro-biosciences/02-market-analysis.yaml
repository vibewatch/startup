- id: demand-and-sizing
  title: Demand is real, but sizing is evidence-constrained
  body: 'The underlying demand signal is not speculative. WHO says the global population aged 60 and over will rise from 1 billion in 2020 to 1.4 billion in 2030 and 2.1 billion in 2050, while WHO also highlights hearing loss, osteoarthritis, diabetes, COPD, depression, and dementia as common conditions in older age. WHO’s Global Health Estimates infrastructure explicitly tracks life expectancy, healthy life expectancy, mortality, morbidity, and disease burden by age, sex, and cause, which supports the strategic logic for treating aging biology as a disease-burden amplifier rather than a single isolated market category.


    Commercial market sizing is much less clean. HTF Market Intelligence puts the longevity therapeutics market at $27.8B in 2024 growing to $84.6B by 2033, while DataM Intelligence puts the market at $21.74B in 2023, $23.24B in 2024, and $43.72B by 2033. Those reports are directionally useful because both segment the space by modality and age-related disease application, but they are not clean SAMs for Retro. DataM gives a large share of the market to dietary supplements, which are commercially relevant to broad longevity spending but not to Retro’s prescription-biotech model. The right reading is that public analyst reports provide an outer TAM envelope, while Retro’s real SAM/SOM remains undisclosed because the company has not published target patient counts, pricing assumptions, or initial launch geographies for most programs.'
