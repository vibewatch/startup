chapter:
  number: 2
  title: Market Analysis
  summary: Retro Biosciences sits inside a real and expanding demand pool—WHO says 1 in 6 people globally will be age 60+ by 2030—but public “longevity therapeutics” TAMs are poor proxies for its actual addressable market because they bundle regulated therapeutics with supplements and wellness. Retro’s commercial path is better understood as a modality-by-modality push across small molecules, cell therapies, gene therapy, and AI-enabled protein discovery, with the strongest constraints coming from disease-specific regulation, CMC complexity, specialty-site adoption, and capital intensity rather than from top-of-funnel demand.
sections:
- id: market-boundary
  title: Market boundary and what Retro is actually selling into
  body: 'Retro’s own materials define the company as a therapeutics developer targeting the cellular drivers of aging and age-related disease, not as a consumer longevity, supplements, or wellness-services business. The public pipeline spans an autophagy small molecule, iPSC-derived microglial progenitors, iPSC-derived hematopoietic stem cells, AAV-delivered tissue reprogramming, and AI-designed protein therapeutics. That means the relevant market boundary includes regulated prescription therapeutics, cell-therapy manufacturing and administration, gene-therapy development, specialist clinical delivery, and eventually pharma partnering or out-licensing around disease-specific programs. It excludes supplements, diagnostics-only products, medical tourism, aesthetic anti-aging services, and direct-to-consumer “longevity clinics.”


    This distinction matters because public longevity-market reports often combine prescription biologics, nutraceuticals, preventive wellness products, and aesthetic categories into one headline figure. For Retro, that broad framing overstates the portion of spend it can plausibly capture with regulated medicines. The more defensible substitute set is disease-specific standard of care: neurodegeneration drugs, transplant and cell-therapy pathways, plasma exchange analogs, orthopedic and hearing-loss interventions, and other specialty therapeutics aimed at the same biological or symptomatic problems. The practical market question is therefore not whether “longevity” is large, but whether each Retro modality can clear disease-specific clinical, manufacturing, and reimbursement gates.'
