- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Primary buyer / payer
  - Relevance to Retro
  rows:
  - - Autophagy small-molecule therapeutics
    - Discovery, clinical development, GMP drug product, specialty prescribing, payer coverage for age-related disease indications
    - Supplements, OTC autophagy boosters, wellness subscriptions
    - Specialist prescribers, health systems, commercial/public payers
    - Retro’s most advanced public program; closest to a conventional pharma launch path
  - - Microglia cell therapy
    - iPSC manufacturing, release testing, specialty-site administration, CNS monitoring, reimbursement for advanced biologics
    - General brain-health supplements, digital therapeutics, non-regulated cognitive wellness
    - Specialty CNS centers, pharma partners, insurers / health systems
    - High-differentiation modality with heavy site-of-care and CMC burden
  - - Hematopoietic stem-cell rejuvenation
    - Autologous cell manufacturing, transplant-style administration, long-term follow-up, specialist hospital budgets
    - Generic transplant support services and non-curative supportive care products
    - Transplant centers, specialty hospitals, payers, strategic partners
    - Potentially transformative but among the most capital- and process-intensive programs
  - - Tissue reprogramming gene therapy
    - Vector manufacture, specialty delivery, biomarker follow-up, gene-therapy reimbursement infrastructure
    - Hearing aids, orthopedic devices, physical therapy, consumer anti-aging services
    - Specialty centers, payers, biopharma partners
    - Highest upside if it works, but also the heaviest regulatory and safety burden
  - - AI-designed protein therapeutics
    - Model-assisted discovery, protein engineering, preclinical biologics development, partnering economics
    - Pure software tools, AI infrastructure sold without therapeutics rights
    - Biopharma partners, internal R&D organizations, eventual specialty-therapy channels
    - Useful as a discovery amplifier and partnering wedge rather than a direct care-delivery market
