- id: manufacturing-and-operational-execution-risk
  title: Manufacturing and operational execution risk
  body: 'The public record shows real manufacturing intent, but it also shows that Retro is still assembling the operating discipline needed to make its scientific ambition repeatable. Management says it has already built an in-house cGMP cell-therapy manufacturing facility, and that matters. Yet the stronger read-through comes from the jobs pages: the company is still hiring for hands-on QMS ownership, batch review, QA release, deviation and CAPA workflows, supplier and CDMO qualification, analytical strategy, stability, control strategy, and inspection readiness. The bioreactor role is especially revealing because it describes custom systems that need sterile assembly, troubleshooting of leaks and sensor drift, calibration logs, SOP updates, and documentation to support a GMP transition. That is not a finished industrial machine; it is a scale-up system still being hardened. Multiply can help on automation, but even its own transaction materials admit that instrument or process changes
    can trigger comparability work and regulatory resubmissions. For investors, that means manufacturing risk is no longer conceptual, but it is still phase-appropriate rather than mature.'
