- id: partner-ip-and-capital-concentration-risk
  title: Partner, IP, and capital concentration risk
  body: Retro's dependencies are unusually visible, and several are single-threaded. The iHSC platform is anchored on an exclusive MCRI license that looks strategically strong but is still years away from first-human proof. Cell-therapy scale-up is also tied to Multiply, whose Retro deal was described as the first commercial sale of its robotic system. The OpenAI collaboration creates narrative lift, but the public evidence is still partner-controlled and not peer reviewed, which means it raises optionality more than it closes diligence. On the legal side, the Cooley analysis of the 2026 REGENXBIO decision is a useful reminder that patent eligibility for engineered-cell constructs is clearer than before but not frictionless enough to ignore. The capital structure is similarly concentrated. Retro did close a real $1.8 billion pre-money round, but independent coverage says that number came in well below a previously discussed $5 billion target, and earlier reporting makes clear that Sam Altman
    personally supplied the entire original $180 million seed. The company therefore looks funded, but still not broadly validated in the way a less concentrated syndicate would imply.
