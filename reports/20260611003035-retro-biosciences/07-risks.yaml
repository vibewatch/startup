- id: mitigations-monitoring-and-kill-criteria
  title: Mitigations, monitoring, and kill criteria
  body: 'Retro is not risk-unaware. The company has chosen disease-specific programs instead of trying to force a generic anti-aging approval path, it has already financed a facility and quality buildout, and it has paired its most ambitious cell-therapy work with a real external IP license and a visible automation partner. Those are meaningful mitigants. But they are not enough to compress residual exposure yet. The most important monitorable event is the first substantive RTR242 human update: if biomarker and safety data are merely bland, the clinical story stays narrow; if they are clearly constructive, risk moves down quickly because the lead asset begins doing real platform de-risking work. On operations, the signals to watch are not job postings but living-system proof: released batches, audit outcomes, inspection readiness, and evidence that external CDMO or CRO work is under control. On financing, syndicate breadth and cleaner disclosure matter more than another prestige headline.
    Until those specific milestones arrive, the right posture is to treat Retro as financed but still dependency-heavy, with several thesis-break triggers that can be monitored in public.'
