callouts:
- calloutType: risk
  title: The lead human study is real, but it is not yet a therapeutic proof event
  body: 'RTR242 has crossed into the clinic, yet the disclosed study remains a healthy-volunteer Phase 1 with safety, PK, and exploratory biomarker readouts. That makes August 2026 pivotal: the trial can meaningfully lower risk, but it cannot erase the wider platform burden unless the signal is unusually strong.'
