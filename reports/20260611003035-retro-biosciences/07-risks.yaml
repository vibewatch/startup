- calloutType: risk
  title: Quality hiring is a positive sign and an adverse sign at the same time
  body: The visible buildout of QMS, analytical quality, and bioreactor roles shows Retro understands where its operational risks live. It also shows those systems are still being assembled in public, which is different from having already demonstrated stable release, validation, and inspection performance.
  claimRefs:
