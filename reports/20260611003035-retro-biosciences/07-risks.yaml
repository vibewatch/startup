  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: regulatory-correspondence
    missingEvidence: Public IND correspondence, FDA meeting minutes, written questions, or agency feedback for RTR242 and the gene-therapy programs.
    whyItMatters: Without primary regulatory correspondence, investors cannot tell whether agency risk is already narrowing or merely being described optimistically by management.
    diligencePath: Request the pre-IND and other FDA interaction package, including briefing books, minutes, and agreed action items.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: blocking
    topic: manufacturing-metrics
    missingEvidence: Batch-release history, deviation rates, environmental monitoring trends, audit observations, and inspection outcomes for Retro's internal and external manufacturing network.
    whyItMatters: The public signal shows quality hiring and intent, but not whether the quality system is actually controlling risk in live operations.
    diligencePath: Request QMS dashboards, recent audit reports, batch-review samples, and any inspection or partner-audit findings.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: partner-contract-terms
    missingEvidence: Detailed economic, milestone, governance, quality-agreement, and termination terms for the MCRI, Multiply, and OpenAI relationships.
    whyItMatters: Headline partnership value says little about control, exit rights, exclusivity durability, or what happens if a partner slips.
    diligencePath: Review executed contracts, quality agreements, IP schedules, milestone maps, and steering-committee materials.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: Exact cash raised, liquidation preferences, dilution, any secondary component, investor rights, and post-round runway for the 2026 financing.
    whyItMatters: A headline pre-money valuation can materially overstate common-equity attractiveness if the underlying terms are investor-protective.
    diligencePath: Request the term sheet, cap table, investor rights documents, and post-close operating plan.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: material
    topic: peer-reviewed-ai-reprogramming
    missingEvidence: A peer-reviewed paper or released sequence package that allows independent benchmarking of the GPT-4b-derived reprogramming factors.
    whyItMatters: The collaboration is scientifically interesting, but without independent validation it remains a partner-controlled moat narrative rather than a de-risked platform asset.
    diligencePath: Request manuscript drafts, sequence disclosure terms, external replication data, and publication timeline.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR003
