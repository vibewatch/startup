company:
  name: Retro Biosciences
chapter:
  number: 7
  title: Risks
  summary: Retro's public-risk picture is high and unusually concentration-heavy. The near-term regulatory and financing story still rests on a healthy-volunteer Phase 1 readout for RTR242, while the more ambitious cell-therapy and gene-therapy programs remain subject to the familiar FDA burdens of tumorigenicity, off-target risk, long follow-up, and manufacturing comparability. Retro has real mitigants—capital, an in-house cGMP buildout, an exclusive MCRI license, and visible quality hiring—but the evidence still shows a company assembling control systems and partner dependencies rather than one that has already proven them.
sections:
- id: regulatory-and-clinical-path-risk
  title: Regulatory and clinical path risk
  body: 'Retro''s biggest public risk is that its lead human proof is still narrow while its broader platform ambitions are wide. RTR242 is genuinely in Phase 1, but the ANZCTR record shows a healthy-volunteer safety, tolerability, and pharmacokinetic study rather than an efficacy study in Alzheimer''s patients. That matters because Retro''s more ambitious value story still points beyond a single small-molecule program into iPSC-derived cell therapy and in vivo gene therapy. FDA guidance is helpful but not comforting here: the agency''s own early-phase and preclinical materials explicitly anchor class risk around prior deaths, leukemias, tumor formation, prolonged biological activity, immunogenicity, biodistribution uncertainty, and long-term follow-up burdens for gene-therapy products. Australia can speed first-human entry, but it does not solve the later need for disease-specific efficacy, validated CMC, and durable safety packages. So the near-term question is not whether Retro has entered
    the clinic—it has—but whether the first human data package will be strong enough to lower class-level risk rather than simply confirm that the company can dose people.'
