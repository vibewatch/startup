tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Current proof
  - Strategic value
  - Gap
  rows:
  - - Current R&D and IP counterparties
    - Retro is the buyer/licensee; Retro scientists are users; investor capital is the payer
    - MCRI licensing agreement and OpenAI collaboration
    - Validates that credible institutions will transact around Retro’s science before product launch
    - Still no end-customer therapeutic demand or revenue proof
  - - Manufacturing automation vendors
    - Retro is the buyer; manufacturing teams are users; Retro balance sheet is payer
    - Multiply Labs commercial and supply agreement
    - Shows willingness to spend on scale-up infrastructure for cell therapy
    - No disclosed throughput, reorder cadence, or cost-per-batch outcomes
  - - Future neurology channel for RTR242
    - Likely buyers are provider systems and payers; users are neurologists and Alzheimer’s patients
    - RTR242 Phase 1 plus Alzheimer’s positioning
    - Most concrete near-term commercial path if efficacy emerges
    - No efficacy, reimbursement, or commercial partner proof
  - - Future transplant and hematology centers for iHSC
    - Likely buyers are hospitals/transplant centers; users are hematologists and blood-disorder patients
    - MCRI-derived iHSC program and transplantation framing
    - Differentiated institutional cell-therapy path
    - No human data, site commitments, or payer proof
  - - Future regenerative or pharma partners
    - Likely buyers are specialty clinics or pharma partners; users are age-related disease patients
    - Microglia, tissue reprogramming, and AI-designed protein programs
    - Creates option value across multiple future channels
    - Entirely precommercial and mostly pre-first-human
  notes: Segments mix current counterparties with plausible future institutional buyers because Retro has no disclosed product customers today.
