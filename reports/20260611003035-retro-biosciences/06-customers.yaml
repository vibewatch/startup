    severity: material
    topic: named-counterparties
    missingEvidence: A complete list of named commercial, manufacturing, clinical, and research counterparties beyond the three publicly disclosed relationships.
    whyItMatters: The named-customer-proof table is necessarily partial, so the public picture may understate or overstate true breadth and concentration.
