  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: paying-customers
    missingEvidence: Signed account list or revenue schedule showing any paying hospital, payer, clinic, or pharma customer by program.
    whyItMatters: Without named paying accounts, the chapter can only assess scientific and operational readiness, not real therapeutic demand or durability.
    diligencePath: Request board materials or commercial pipeline docs listing active customers, pilots, or paid collaborations by asset.
    relatedQuestionRefs:
    - QU002
    - QU024
  - type: private-evidence-only
    severity: material
    topic: retention-economics
    missingEvidence: Renewal cadence, contract length, reorder data, NRR/GRR, churn, or satisfaction measures for any external counterparty.
    whyItMatters: The absence of retention data prevents any judgment on durability, repeat usage, or whether early counterparties deepen into multi-year relationships.
    diligencePath: Ask management for executed agreement terms, renewal dates, milestone-payment schedules, and any partner satisfaction or reorder dashboards.
    relatedQuestionRefs:
    - QU014
    - QU020
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: commercial-channel
    missingEvidence: Named procurement, reimbursement, distribution, CRO, CDMO, and clinical-site counterparties for RTR242 and each cell-therapy program.
    whyItMatters: Future buyer path depends on which institutions will prescribe, reimburse, manufacture, or run studies; public materials do not identify that chain.
    diligencePath: Request the program-by-program commercialization map, named site list, and counterparties under CDA if needed.
    relatedQuestionRefs:
    - QU012
