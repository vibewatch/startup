- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - RTR242 safety and biomarker success
    - Near-term buyer path depends heavily on one early clinical asset
    - If efficacy or tolerability disappoints, the clearest commercial route disappears
    - Review protocol, enrollment pace, biomarker plan, and readout timing
  - - MCRI-derived iHSC translation
    - Core blood-disorder thesis depends on licensed science and future clinical translation
    - Any delay in engraftment, manufacturing, or IP milestones can slow the cell-therapy path
    - Review license terms, milestone schedule, and translational package
  - - Multiply automation program
    - Scale and cost narrative depends on one named robotics implementation
    - If the platform underdelivers, manufacturing economics and timelines weaken
    - Review throughput targets, purchase obligations, and validation results
  - - OpenAI-enabled protein engineering
    - A prominent differentiator depends on internal results that remain lightly peer-reviewed
    - Scientific moat may be overstated versus commercial readiness
    - Request reproducibility package and publication plan
  - - Broad hiring and GMP build-out
    - Readiness spend can outpace demand proof in a pre-revenue company
    - Burn can rise before any customer revenue exists
    - Review budget, hiring plan, and milestones to first commercial counterparties
  notes: The main expansion opportunities are real, but every one still depends on future scientific and institutional conversion.
