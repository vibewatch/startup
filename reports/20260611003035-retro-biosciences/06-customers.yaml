company:
  name: Retro Biosciences
chapter:
  number: 6
  title: Customers
  summary: 'Retro remains precommercial: the reviewed evidence shows no disclosed paying product customers, no marketed therapies, and no public retention or concentration metrics. The strongest external proof is instead a set of named counterparties that validate capability—MCRI as IP licensor, Multiply Labs as manufacturing automation vendor, and OpenAI as research collaborator—plus hiring and GMP build-out that suggest Retro is preparing for future institutional buyers rather than serving them today. The customer case is therefore a future-buyer thesis, not present commercial traction, and the valuation gap from a reported $5 billion target to a $1.8 billion close reinforces that the market is still underwriting ambition more than demand.'
sections:
- id: current-counterparties-not-product-customers
  title: Current counterparties, not product customers
  body: 'Retro’s public customer surface is best described as a set of commercialization enablers rather than a live therapeutic customer base. Across the reviewed official pages, Retro talks about developing therapies, pipeline assets, and future first-in-human milestones, but it does not disclose paying hospitals, payers, clinics, or pharma customers. The named external proof instead comes from three counterparty types. MCRI provides the clearest licensing proof: it publicly says Retro signed a research and commercial licensing agreement worth over US$35 million for blood stem cell IP and became the exclusive licensee for autologous iPSC-derived hematopoietic stem cell therapies. Multiply Labs provides the clearest procurement proof: trade coverage says Retro signed a commercial and supply agreement worth up to $85 million, and GEN describes the deal as Multiply’s first commercial sale. OpenAI provides the clearest research-collaboration proof, but that proof is scientific rather than
    commercial. Collectively, these relationships show that credible institutions are willing to transact with Retro around IP, tooling, and research. They do not yet show prescription demand, paid therapeutic utilization, or repeat purchasing by real end customers.'
