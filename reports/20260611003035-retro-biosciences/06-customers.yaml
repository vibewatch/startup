  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Top-counterparty exposure, spend concentration, and dependency analysis across MCRI, OpenAI, Multiply, and any undisclosed external partners.
    whyItMatters: A small named proof set can create hidden concentration risk if one relationship anchors key IP, automation, or research differentiation.
    diligencePath: Request top-10 external dependency schedule by spend, milestone criticality, and replacement time.
