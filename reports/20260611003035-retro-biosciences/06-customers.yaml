- id: readiness-proxies-and-hiring-signal
  title: Commercialization readiness signals and adoption proxies
  body: 'Because Retro has no disclosed customer counts, the best public adoption proxies are internal execution and readiness signals. Officially, the company says it reached a clinical candidate in three years, dosed RTR242 within 15 months of indication selection, built an in-house cGMP cell therapy manufacturing facility, and plans additional first-in-human milestones in 2026 and 2027. The team page says Retro is 90+ people, while the careers page shows open roles spanning computational biology, HSC therapeutics, microglia therapeutics, operations, and quality. The job postings are especially important for customer diligence because they reveal what Retro is actually building for: batch review, supplier and vendor qualification, CDMO oversight, environmental monitoring, electronic batch records, bioreactor scale-up, and two active cell-therapy manufacturing tracks. Those are meaningful readiness signals for a company expecting future institutional buyers. They are not the same thing
    as demand proof. No reviewed source discloses enrollment conversion, product revenue, signed commercial distribution, or active hospital purchasing. The public evidence shows supply-side preparation and program progression, not live customer adoption. Until management names live clinical sites, procurement owners, batch-release volumes, and conversion milestones, these readiness signals should be treated as preparatory infrastructure rather than evidence of recurring buyer behavior or commercial pull.'
