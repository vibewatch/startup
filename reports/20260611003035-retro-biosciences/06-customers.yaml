- id: durability-future-buyer-path-and-gaps
  title: Durability, future buyer path, and diligence gaps
  body: 'The future buyer path is intuitive but still hypothetical. RTR242 points toward neurologists, provider systems, and payers if the Alzheimer’s program eventually produces efficacy and reimbursement support. The iHSC program points toward transplant centers, hospitals, and hematology specialists if the MCRI-derived science translates from mouse data into safe human use. Public materials also leave channel ownership vague: they do not show who at a hospital, payer, or future pharma partner would hold budget authority, what procurement process would govern adoption, or whether the cell-therapy programs would be reimbursed as bespoke procedures or standardized products. But none of those channels has public procurement, reimbursement, or distribution proof today. The durability problem is sharper: the reviewed sources do not disclose NRR, churn, renewal terms, contract length, top-account exposure, or satisfaction metrics. Even the named counterparty set is narrow enough that concentration
    risk matters—MCRI for core iHSC IP, Multiply for automation scale-up, and OpenAI for a prominent but still un-peer-reviewed AI story. Independent coverage also adds an adverse market signal. P05 and STAT both frame Retro as a pre-revenue, pre-efficacy company, and the reported move from a $5 billion target to a $1.8 billion close suggests investors remain cautious about how quickly scientific credibility can convert into commercial traction. For diligence, management needs to prove not just science quality but who will actually buy, reimburse, manufacture, and renew around each program.'
