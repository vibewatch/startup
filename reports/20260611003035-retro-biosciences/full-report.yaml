  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct reprogramming peers sit beside capital-heavy incumbents and failed field precedents'
        blocks:
          - type: paragraph
            body: >-
              The evidence does not support treating “longevity biotech” as one homogeneous peer set. Retro competes
              directly with cellular-reprogramming platforms such as Altos Labs, NewLimit, Life Biosciences, Turn
              Biotechnologies, and portions of Rejuvenate Bio, because all are trying to reset aged cell function rather
              than only treat one downstream symptom. But the buyer and investor also have substitute choices: Calico
              represents the long-horizon, partnership-led incumbent model; Unity Biotechnology represents the
              senolytic, public-market route that ultimately wound down; and conventional disease-specific programs
              remain a status-quo alternative whenever one narrow indication can reach the clinic faster than a broad
              rejuvenation thesis. Within that field, Retro is unusual because the retained public record shows both a
              multi-modality pipeline and a current human trial, while still leaning on venture capital, external
              manufacturing, and research licensing rather than marketed-product revenue. That combination makes the
              most relevant comparison set narrower than “all aging companies” but broader than “other stem-cell
              startups.”
