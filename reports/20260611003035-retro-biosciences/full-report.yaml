      - number: '1.2'
        title: Leadership, Founders, and Governance Signals
        blocks:
          - type: paragraph
            body: >
              Joe Betts-LaCroix is the visible founder figure and public decision node. Official and third-party bios
              consistently identify him as co-founder and CEO, with prior venture-backed exits at OQO and Vium plus time
              at Y Combinator. That background matters because Retro's model combines deep-tech fundraising,
              automation-minded execution, and a willingness to run multiple scientific bets in parallel. Official team
              material says the team is 90+ strong and names scientific leaders including Sheng Ding, Jessica Sprueill,
              Alex Trapp, Peng Liu, and Shirley Telebrico, while advisor listings include Alejandro Ocampo and Vadim
              Gladyshev.


              Founder concentration is both an asset and a diligence risk. MIT Technology Review reported that
              Betts-LaCroix built Retro around a single-benefactor capital base and described an unusually
              founder-controlled operating style. Public materials do not disclose board composition, investor seats, or
              internal delegated decision rights. Fetched sources also do not fully reconcile who should be treated as
              formal co-founders beyond Betts-LaCroix, though third-party reporting ties Sheng Ding closely to the
              founding scientific thesis and one analytical source also names Matt Buckley.
