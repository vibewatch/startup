  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what Retro is actually selling into
        blocks:
          - type: paragraph
            body: >-
              Retro’s own materials define the company as a therapeutics developer targeting the cellular drivers of
              aging and age-related disease, not as a consumer longevity, supplements, or wellness-services business.
              The public pipeline spans an autophagy small molecule, iPSC-derived microglial progenitors, iPSC-derived
              hematopoietic stem cells, AAV-delivered tissue reprogramming, and AI-designed protein therapeutics. That
              means the relevant market boundary includes regulated prescription therapeutics, cell-therapy
              manufacturing and administration, gene-therapy development, specialist clinical delivery, and eventually
              pharma partnering or out-licensing around disease-specific programs. It excludes supplements,
              diagnostics-only products, medical tourism, aesthetic anti-aging services, and direct-to-consumer
              “longevity clinics.”


              This distinction matters because public longevity-market reports often combine prescription biologics,
              nutraceuticals, preventive wellness products, and aesthetic categories into one headline figure. For
              Retro, that broad framing overstates the portion of spend it can plausibly capture with regulated
              medicines. The more defensible substitute set is disease-specific standard of care: neurodegeneration
              drugs, transplant and cell-therapy pathways, plasma exchange analogs, orthopedic and hearing-loss
              interventions, and other specialty therapeutics aimed at the same biological or symptomatic problems. The
              practical market question is therefore not whether “longevity” is large, but whether each Retro modality
              can clear disease-specific clinical, manufacturing, and reimbursement gates.
            claimRefs:
