  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Transmission to thesis
      - Action implication
    rows:
      - - RTR242 data fail to support mechanism
        - Safety weakens or biomarkers do not validate the autophagy thesis
        - The main near-term de-risking event would no longer justify a premium private mark.
        - Reset valuation expectations sharply or stop underwriting.
      - - Additional FIH milestones slip
        - 2026-2027 platform cadence misses the company's own timetable
        - Breadth flips from upside to diffusion risk.
        - Treat platform premium as unearned.
      - - Round economics are investor-protective
        - Preferences, ratchets, or heavy secondary make common-equity value much weaker than the headline suggests
        - Headline pre-money overstates true entry quality.
        - Re-price on common-equity reality, not press-release optics.
      - - Public aging-biotech rerating worsens
        - BioAge-like public comps compress further while private appetite narrows
        - Retro loses the benefit of category enthusiasm.
        - Use bear-case corridors, not private prestige comps.
      - - Validation remains too founder-concentrated
        - No broader arms-length syndicate or third-party proof appears after current round
        - The market-clearing signal remains ambiguous.
        - Keep recommendation at research-more or avoid.
    notes: >-
      These are the smallest set of monitorable conditions that would force an investor to change the valuation call
      rather than merely refine it.
    claimRefs:
      - CV007
      - CV024
      - CV025
      - CV040
      - CV041
      - CV048
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Round size and terms
        - Exact cash closed, preference stack, dilution, and any secondary component are not public.
        - The headline valuation may overstate common-equity entry economics.
        - Request executed term sheet and updated cap table.
      - - Post-round burn and runway
        - No public source quantifies how long the new financing funds operations.
        - Runway determines whether Retro can reach the next proof point without forced financing.
        - CFO diligence pack with monthly burn bridge.
      - - RTR242 data package
        - Only high-level commentary exists; no public biomarker or dose-response detail is available.
        - This is the key event that could move the valuation stance toward fair.
        - Clinical update deck and trial protocol review.
      - - Program-level capital allocation
        - Public sources do not show how capital is split across autophagy, reprogramming, cell therapy, and AI efforts.
        - Platform breadth is valuable only if resourcing is disciplined.
        - Board materials or management operating plan.
      - - Syndicate breadth and external validation
        - Public evidence does not show how broad the new investor base is beyond the lead and continued Altman support.
        - Broader arms-length validation would improve confidence that the price is market-clearing.
        - Investor list, allocation memo, and partner reference calls.
    notes: >-
      Until these items are answered, the right posture is diligence discipline rather than accepting the current mark
      as fair value.
    claimRefs:
      - CV006
      - CV025
      - CV040
      - CV047
      - CV048
