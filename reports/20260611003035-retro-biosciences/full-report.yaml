      - number: '1.4'
        title: Milestones, Clinical Transition, and Execution Footprint
        blocks:
          - type: paragraph
            body: >
              Retro has moved from a stealth longevity thesis into a clinical-stage, multi-program platform, but the
              evidence still supports a pre-efficacy judgment rather than a de-risked therapeutics story. The clearest
              execution milestone is RTR242: official and third-party reporting agree that the oral autophagy candidate
              entered first-in-human Phase 1 in 2025, with a randomized, double-blind, placebo-controlled study in
              healthy volunteers in Adelaide. STAT reported in May 2026 that management had not seen dose-limiting
              toxicities and expected initial data around August 2026. That is meaningful progress, but it remains
              safety-stage evidence.


              The rest of the platform is earlier and more speculative. OpenAI and Retro's published collaboration
              claims more than 50-fold higher reprogramming-marker expression plus improved DNA-damage repair in vitro,
              yet even supportive analytical coverage notes that the work is not yet peer-reviewed or independently
              reproduced from released sequences. On the cell-therapy side, the Murdoch Children's Research Institute
              and reNEW partnership is more concrete: the counterparties describe an exclusive-license path and a
              partnership worth over $35 million aimed at autologous blood stem cell therapies. Job postings further
              support manufacturing readiness, with in-house GMP, quality, analytical, and bioreactor roles across
              multiple programs.
