      - number: '3.3'
        title: >-
          Commercialization posture: price is mostly absent, so competition is really about financing, partnerships, and
          translation infrastructure
        blocks:
          - type: paragraph
            body: >-
              The reviewed public record offers almost no usable therapeutic price transparency across Retro, Altos,
              NewLimit, Life, Calico, Rejuvenate, or Turn. That is not a missing spreadsheet detail; it is a core fact
              about how the category competes today. Most of these companies are still selling a financing and milestone
              story rather than a commercial price card. Retro's differentiator in that environment is not public list
              price but visible translation infrastructure: an $85 million manufacturing partnership with Multiply Labs,
              an MCRI blood-stem-cell licensing deal, and active GMP and process-development hiring. Life also looks
              operationally concrete because it disclosed a fully subscribed financing tied to ER-100 Phase 1 execution.
              Rejuvenate has an interesting dual companion-animal plus human posture that may create earlier commercial
              proof than pure human-only peers, but the retained sources still emphasize pipeline building and capital
              formation. Altos, NewLimit, and Calico all look better funded than Retro in some respects, yet the
              retained evidence gives less public detail on near-term manufacturing, pricing, or product-sales posture
              than on scientific ambition.
