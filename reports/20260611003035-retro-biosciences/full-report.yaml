            body: >-
              Retro's public pipeline is broader than most peers: autophagy, iPSC-derived microglia, induced
              hematopoietic stem cells, tissue reprogramming, and AI-designed protein therapeutics all appear on the
              company pipeline page. That breadth matters competitively because most retained peers are narrower. Life
              Biosciences is the cleanest direct comparator in partial epigenetic reprogramming, but it is concentrated
              on ER-100 in optic neuropathies rather than Retro's cross-platform map. NewLimit is also squarely in
              epigenetic reprogramming, yet its retained disclosures still describe a prototype medicine and a plan to
              enter human trials next year rather than an active study. Altos is even more weakly disclosed: its
              official site stays at the level of cell rejuvenation mission, while coverage emphasizes enormous
              financing and secrecy around specific programs. Turn appears weaker still, with outside coverage focused
              on asset transactions rather than clinical progress. The practical implication is that Retro is not the
              best-funded reprogramming startup, but it is one of the few with a disclosed clinical program plus
              multiple adjacent platform bets.
