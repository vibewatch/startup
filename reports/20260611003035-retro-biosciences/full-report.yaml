  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and clinical path risk
        blocks:
          - type: paragraph
            body: >-
              Retro's biggest public risk is that its lead human proof is still narrow while its broader platform
              ambitions are wide. RTR242 is genuinely in Phase 1, but the ANZCTR record shows a healthy-volunteer
              safety, tolerability, and pharmacokinetic study rather than an efficacy study in Alzheimer's patients.
              That matters because Retro's more ambitious value story still points beyond a single small-molecule
              program into iPSC-derived cell therapy and in vivo gene therapy. FDA guidance is helpful but not
              comforting here: the agency's own early-phase and preclinical materials explicitly anchor class risk
              around prior deaths, leukemias, tumor formation, prolonged biological activity, immunogenicity,
              biodistribution uncertainty, and long-term follow-up burdens for gene-therapy products. Australia can
              speed first-human entry, but it does not solve the later need for disease-specific efficacy, validated
              CMC, and durable safety packages. So the near-term question is not whether Retro has entered the clinic—it
              has—but whether the first human data package will be strong enough to lower class-level risk rather than
              simply confirm that the company can dose people.
            claimRefs:
