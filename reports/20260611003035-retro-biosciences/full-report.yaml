  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Round Anchor and Public-Proof Gap
        blocks:
          - type: paragraph
            body: >-
              Retro has now crossed the line from narrative-only startup to company with a real priced round and a real
              first-in-human asset, but those two facts should not be conflated. The official May 22, 2026 announcement
              fixes the headline at a $1.8 billion pre-money valuation and says RTR242 reached first-in-human dosing in
              15 months, with more first-in-human milestones planned for 2026 and 2027. That is meaningful execution for
              an aging-biology platform. Independent coverage also suggests the first study has not yet shown
              dose-limiting toxicities. What the public file still does not show is what conventional valuation work
              usually starts from: round size, preferences, dilution, burn, revenue, human efficacy, or biomarker
              magnitude. Even before comparables, that makes the entry price easier to describe than to underwrite.
              Investors are being asked to pay for option value on future aging-biology proof, not for already disclosed
              economics or de-risked clinical data.
