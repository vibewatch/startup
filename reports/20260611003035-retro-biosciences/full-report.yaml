      - number: '8.2'
        title: Comparable Stack and Downside Evidence
        blocks:
          - type: paragraph
            body: >-
              The right comparison set cuts both ways. On the bullish side, Retro is not alone in carrying a very large
              private mark while still building an aging platform. Altos launched with $3 billion of committed capital,
              and NewLimit reached a reported $3.1 billion valuation in June 2026 after raising $435 million and
              accelerating toward its first trial. That tells investors the category can still attract serious money. On
              the cautionary side, the public market is far less forgiving. BioAge—already public, clinical-stage,
              financed, and fully filing—traded around a $0.68 to $0.70 billion market cap in June 2026. Unity sits as
              the harsher warning, with going-concern language in its latest 10-K and only a few million dollars of
              market value. Broader market commentary reinforces the same point: 2026 capital is selective, and BCG says
              average preclinical valuations have collapsed versus 2021 peaks. So Retro is below the frothiest private
              reprogramming marks, but still expensive versus disclosed public aging-biotech evidence.
