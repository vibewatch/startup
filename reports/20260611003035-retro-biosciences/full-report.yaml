        - Research-more
        - The round is real, but public underwriting evidence is still incomplete.
        - Do not treat the headline price as self-validating.
      - - Confidence
        - Medium
        - Sources are strong on financing signal and category context, weaker on economics and efficacy.
        - Enough proof to reject blind enthusiasm, not enough for precise fair value.
      - - Risk rating
        - High
        - The first human program is early and financing structure remains opaque.
        - Position sizing should assume meaningful downside variance.
      - - Valuation stance
        - Stretched
        - >-
