  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization status
        blocks:
          - type: paragraph
            body: >-
              Retro’s public financial profile is unusual because valuation is well disclosed while revenue is not. The
              official website and pipeline pages show a company with one Phase 1 small-molecule program and several
              earlier-stage cell therapy and reprogramming assets, but no approved products, no public price list, and
              no disclosed commercial revenue. Independent analysis from P05 goes further and explicitly describes the
              company as pre-revenue and pre-efficacy, which fits the rest of the public record: the May 2026 financing
              announcement disclosed valuation, investor leadership, and planned future milestones, but not sales,
              product revenue, or the dollar size of the round itself. The supportable conclusion is that Retro is still
              financed primarily on platform promise and clinical progress rather than on observable monetization.
              Near-term economic value would likely have to come from future licensing, milestones, or eventual product
              launches, but those pathways remain hypothetical in public materials. This is normal for an early clinical
              biotech, yet it materially limits underwriting because investors cannot test revenue quality, recurring
              mix, or pricing power from public evidence today.
