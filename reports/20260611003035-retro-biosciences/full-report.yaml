  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Asset map and stage discipline
        blocks:
          - type: paragraph
            body: >-
              The most important product-tech conclusion for Retro is that the company should be underwritten as a
              diversified aging-biology platform with one clinical wedge, not as a company that has already de-risked
              all four pillars equally. The official science and pipeline surfaces consistently show four named program
              families: HSC reprogramming, autophagy enhancement, microglia therapeutics, and tissue reprogramming, with
              an additional AI-designed protein therapeutics line on the pipeline page. But the maturity split is sharp.
              RTR242 is the only asset explicitly marked at Phase 1, and the May 2026 company blog reinforces that it
              already reached first-in-human dosing. By contrast, RTR888, RTR890, tissue reprogramming, and the
              AI-designed protein line are disclosed as programs or platform efforts rather than as human-stage
              medicines with public clinical packages. That distinction matters because the public record does support
              genuine breadth of modalities, yet it does not support treating that breadth as equivalent therapeutic
              maturity. Investors can therefore credit product optionality and platform reuse, while still reserving
              most clinical-readiness value for the autophagy program alone.
