            body: >-
              The strongest public capital fact remains the seed. Retro launched with $180 million, and MIT Technology
              Review reported that the full amount came from Sam Altman. The May 2026 announcement proves that the
              company has now added outside capital at a $1.8 billion pre-money valuation led by 4P Capital, but the
              absence of a disclosed round size is a major analytical gap. That means investors can observe valuation
              momentum without being able to measure proceeds, dilution, or the true extension of runway. Meanwhile, the
              company has taken on visibly expensive development paths: a Phase 1 small-molecule program, an in-house
              cGMP cell therapy facility, an MCRI licensing partnership worth over US$35 million, and a Multiply Labs
