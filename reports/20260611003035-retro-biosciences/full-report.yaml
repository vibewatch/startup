chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Operating Footprint, and Platform Thesis
        blocks:
          - type: paragraph
            body: >
              Retro Biosciences is a longevity biotech founded in 2021 with the explicit mission of adding 10 healthy
              years to human lifespan. Official identity pages describe the company as developing therapies for diseases
              driven by the biology of aging rather than single symptomatic products. The current public program set
              spans autophagy enhancement, HSC reprogramming, microglia therapeutics, tissue reprogramming, and
              AI-assisted protein engineering, which together point to a multi-program therapeutics platform rather than
              a single-asset startup.


              The operating-footprint evidence is mixed but directionally clear. Retro's public careers surface and raw
              job-page location chips point to Redwood City, California for current openings, while MIT Technology
              Review's 2023 reporting described the initial lab buildout in a warehouse near San Francisco. The safest
              conclusion is that the present hiring footprint is Redwood City-based within the broader Bay Area, while
              older launch coverage anchored the earliest lab footprint nearer San Francisco. Public commercial metrics
              remain undisclosed: the fetched official pages do not name revenue, customers, pricing, or deployments.
