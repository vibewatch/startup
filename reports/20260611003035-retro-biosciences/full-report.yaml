      - number: '1.3'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >
              Retro's two verified capital anchors are strong and the rest of the financing picture is materially
              incomplete. MIT Technology Review reported that Sam Altman personally provided the entire $180 million
              initial funding that launched Retro's 2021-2022 buildout, making the company unusually dependent on a
              single benefactor from inception. On May 22, 2026, Retro officially announced the initial close of its
              next financing round at a $1.8 billion pre-money valuation led by 4P Capital, and STAT independently
              confirmed the valuation. Those two facts are solid enough to anchor later valuation work.


              What remains missing is equally important. The company did not disclose the absolute dollars raised in the
              May 2026 initial close, the rest of the investor list beyond 4P Capital, or the post-money cap-table
              implications. An analytical long-form profile reported that Altman may have personally added roughly
              another $180 million around the same window, which would take his cumulative personal capital above $200
              million, but that follow-on figure is not independently corroborated by the primary or top-tier sources
              fetched for this chapter. For diligence purposes, the verified statement is $180 million initial personal
              backing plus a later $1.8 billion pre-money round with undisclosed size.
