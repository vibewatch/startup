      - number: '5.2'
        title: Mechanisms and supporting science by program
        blocks:
          - type: paragraph
            body: >-
              Retro’s product thesis is unusually dependent on whether the underlying aging mechanisms are credible
              enough to justify multiple modalities. On that score, the supporting science is directionally strong but
              mostly preclinical. The official company pages frame autophagy as a cellular cleanup pathway, tissue
              reprogramming as in-vivo gene therapy using reprogramming factors, and microglia therapeutics as a
              scalable successor to plasmapheresis-like effects observed in the literature. The retained technical
              literature broadly supports those choices. The partial-reprogramming literature shows two useful layers:
              first, human-cell work suggesting epigenetic age can fall before full loss of somatic identity, and
              second, mouse studies showing cyclic OSKM or OSK expression can improve aging phenotypes, regeneration, or
              vision outcomes in vivo. The autophagy review gives a biologically coherent rationale for why restoring
              lysosomal-autophagic function could matter in neurodegeneration. The plasma literature supports the
              existence of rejuvenation-like effects from plasma dilution or exchange in mice, including lower
              neuroinflammation and better cognition, but it also emphasizes methodological variability and the danger
              of over-reading these models. The net result is that Retro’s program selection looks scientifically
              literate, yet most pillars beyond RTR242 still rest on translational bridges the company has not publicly
              crossed.
