      - number: '3.4'
        title: 'Moat durability and adverse evidence: field failures show why capital alone is not a moat'
        blocks:
          - type: paragraph
            body: >-
              The strongest competitive argument for Retro is not that it has no rivals; it is that it combines direct
              human proof, multiple aging mechanisms, and visible translation partners at a moment when several peer
              archetypes are showing strain. Unity's wind-down and dissolution filings are the clearest warning that a
              compelling longevity thesis can still end in liquidation. Calico's decade-long AbbVie relationship ending
              with layoffs is a second warning: even Alphabet-backed science can struggle to convert patience and
              partnership capital into durable commercial momentum. Turn's failed asset-sale process points to the same
              lesson from the small-company end of the market. These are not reasons to dismiss Retro; they are reasons
              to underwrite it against execution rather than headline valuation. Retro still faces serious displacement
              risk from better-capitalized direct peers such as Altos and NewLimit and from narrower, clinical-stage
              specialists like Life. But the field evidence suggests the most durable moat will come from converting
              manufacturing readiness, trial progression, and partner access into repeatable product execution faster
              than rivals do.
