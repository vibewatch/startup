          anchors.
        - Upgrade only after data or price meaningfully improve.
      - - Best near-term re-rating path
        - Constructive August 2026 data plus clearer financing terms
        - That would narrow the gap between option value and evidence.
        - Could move stance toward fair, not automatically attractive.
    notes: >-
