      - number: '2.3'
        title: Buyer, user, payer, and adoption path vary sharply by modality
        blocks:
          - type: paragraph
            body: >-
              Retro’s public pipeline implies at least three distinct commercialization channels. The autophagy program
              is the cleanest path: if RTR242 continues to advance, it can move through a conventional prescription-drug
              channel where specialty prescribers, health systems, formularies, and commercial or public payers are the
              main gatekeepers. That is still difficult, but it is materially simpler than commercializing a
              personalized cell or gene therapy. By contrast, Retro’s iPSC-derived microglia and hematopoietic stem-cell
              programs imply specialty-center administration, cGMP manufacturing, cold-chain or controlled logistics,
              and more intensive payer review. Tissue reprogramming via AAV-delivered factors would face a gene-therapy
              style launch path with long follow-up, specialty administration, and heavier CMC scrutiny.


              This means Retro’s practical buyers are not “longevity consumers.” They are eventually specialty
              physicians, academic centers, transplant or advanced-therapy sites, pharma partners, and insurers willing
              to reimburse a disease-specific product. AI-designed proteins sit even earlier in the value chain: they
              can improve discovery productivity and partnering value before they become a standalone commercial
              channel. The adoption sequence across all modalities is therefore mechanism proof, indication selection,
              IND-enabling package, early clinical signal, specialist-site scalability, and only then broader
              payer-backed adoption. Retro’s modality breadth creates multiple shots on goal, but it also means there is
              no single buyer map or sales motion for the company.
