    {
      "id": "financial-verdict-and-blockers",
      "title": "Financial verdict and diligence blockers",
      "body": "Retro is financeable, but not yet underwritable from public evidence alone. The positive case is real: the company has a fresh multi-billion-dollar mark, a well-documented $180 million seed history, clear signs of operating scale, and enough manufacturing and quality buildout to show that it is trying to move therapies into the clinic rather than remain a pure research narrative. The adverse case is just as real. Independent coverage still frames Retro as pre-revenue and pre-efficacy; the May 2026 valuation came in far below a previously reported $5 billion aspiration; and none of the standard financial inputs for a biotech underwriting model are public, including round proceeds, revenue mix, gross margin, cash balance, debt, or contractual cash obligations. Investors can therefore say that Retro has access to capital and a credible scientific operating footprint. They cannot yet say whether that capital is being converted efficiently, how long current liquidity lasts, or whether the valuation is supported by economics rather than prestige and promise. The right diligence posture is to treat the current mark as a confidence signal, not as proof of financial quality.",
