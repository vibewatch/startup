    {
      "id": "capital-adequacy-and-financing-dependency",
      "title": "Capital adequacy and financing dependency",
      "body": "The strongest public capital fact remains the seed. Retro launched with $180 million, and MIT Technology Review reported that the full amount came from Sam Altman. The May 2026 announcement proves that the company has now added outside capital at a $1.8 billion pre-money valuation led by 4P Capital, but the absence of a disclosed round size is a major analytical gap. That means investors can observe valuation momentum without being able to measure proceeds, dilution, or the true extension of runway. Meanwhile, the company has taken on visibly expensive development paths: a Phase 1 small-molecule program, an in-house cGMP cell therapy facility, an MCRI licensing partnership worth over US$35 million, and a Multiply Labs manufacturing agreement valued at up to $85 million. Those items show ambition and capability buildout, but they also reinforce financing dependency because they describe commitments and infrastructure rather than cash generation. The next public catalyst is the first RTR242 human readout expected around August 2026. In practice, that looks like the clearest milestone that could affect future financing conversations, yet cash on hand, debt, and runway are still undisclosed, so capital adequacy can only be judged as directionally supported rather than fully proven.",
