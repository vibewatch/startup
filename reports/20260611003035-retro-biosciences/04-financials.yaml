      "id": "cost-structure-and-unit-economics",
      "title": "Cost structure and unit economics proxies",
      "body": "Public evidence is much stronger on cost intensity than on unit economics. Retro’s current hiring surfaces show a 90+ person team, on-site in Redwood City, with active recruiting across GMP operations, quality assurance, bioreactor engineering, and cell-process manufacturing. Those roles are not the signature of an asset-light discovery shop. They point to a company carrying laboratory overhead, manufacturing readiness work, quality systems, and external partner management on top of wet-lab science. The company also says it has built an in-house cGMP cell therapy manufacturing facility, while job descriptions reference CDMOs, CROs, clinical drug-product release, batch review, and production support. Using the five posted salary bands as a narrow public proxy yields an annual base-payroll floor of roughly $12.4 million to $14.2 million, or about $1.04 million to $1.19 million per month before benefits, facilities, reagents, clinical execution, or partner spend. That is not a true burn figure, but it is enough to show that the current valuation sits on a capital-intensive operating model. What remains missing is the data that matters most: revenue, gross margin, cash burn, payback period, and capital efficiency by program.",
