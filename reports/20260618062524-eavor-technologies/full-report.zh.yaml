companyProfile:
  summary: >-
    Eavor Technologies 是一家总部位于 Calgary 的地热公司，成立于 2017 年。公司开发的 Eavor-Loop 是闭环地热系统，用多分支井筒和封闭工质从岩石中通过热传导取热，而不是依赖传统水热开采。公司
    2023 年融资 C$239 million，2025 年获得 Canada Growth Fund 后续支持，并围绕德国 Geretsried 示范项目拼出大规模项目级债务与补助组合。截至 2026 年 6 月，Eavor 已在
    Geretsried 实现首次并网发电，也越来越多地把商业化叙事放到技术许可上；但公司仍未公开当前估值、收入、客户数量，也没有完整解释 John Redfern 到 Mark Fitzgerald 的领导层交接。
