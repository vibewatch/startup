    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与运营模式
        blocks:
          - type: paragraph
            body: >-
              Eavor Technologies 对外定位为一家总部位于 Calgary、2017 年在加拿大成立的私营地热技术公司。公司销售
              Eavor-Loop：一套闭环地热系统，让封闭工质在多分支井筒中循环，通过热传导取热，而不是抽采地下流体。公司官网、技术材料和 2026
              年新闻稿反复把该产品描述为可调度、可扩展，并适用于供热和发电。运营模式已不只是「建一个旗舰项目来证明概念」。到 2026 年 5 月，Eavor
              自己的技术更新称，业务正以技术许可方身份进入大规模商业化；这很关键，因为尽调视角要从项目所有权转向知识产权、伙伴执行，以及示范项目能否支撑更广泛采用。
