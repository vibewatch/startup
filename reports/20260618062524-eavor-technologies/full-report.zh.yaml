      - number: '5.4'
        title: 伙伴证明、融资与运营依赖
        blocks:
          - type: paragraph
            body: >-
              Eavor 的技术并不独立于伙伴；更适合把它理解为一个架在钻井、融资、监管和本地基础设施依赖之上的系统。SLB 提供第三方证据，证明先进测距和钻井服务在德国奏效。Chubu 和 OMV
              公开自称项目伙伴，European Commission 新闻稿也明确显示，Geretsried
              需要分层融资包，而不是简单风险股权。这很重要，因为它说明技术离开原型阶段前，已经必须通过贷款人、公共融资和产业伙伴审视。同时，同样的依赖也带来集中风险。市政供热基础设施、ORC 调试、并网、项目融资和伙伴
              know-how 都在关键路径上。任何一项滞后，产品都无法把热虹吸和热传导优势变现。因此，依赖图同时强化了证据组合的强度和商业化顺序的脆弱性。
