  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：以供热为先的基础设施，不是泛地热 TAM
        blocks:
          - type: paragraph
            body: >-
              Eavor 的市场应围绕公开证据实际支撑的任务来划边界：通过具体项目和伙伴主导部署，交付可调度地热热能与电力。供热端尤其具体。Geretsried 绑定本地供热 offtake，Hannover
              被描述为区域供热项目，Eavor Deutschland
              也明确把系统卖向德国的区域供热和工业场景。这意味着应纳入的支出包括市政供热脱碳、工业和商业直接用热、长期买方愿意为可靠性付费的稳定电力，以及与这些项目绑定的开发或许可合同。应排除的支出也要继续排除：浅层地源热泵、依赖天然含水层的传统水热项目，以及并非购买地热属性的宽泛可再生能源预算。结果是一个比「全球所有地热」更窄但更可辩护的市场框架，也让现状替代方案——区域供热改造、传统地热和其他稳定电力选项——从一开始就可见。
