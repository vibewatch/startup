            body: >-
              Geretsried 的客户耐久性，还不能像成熟 SaaS 或公用事业服务 franchise 那样分析，因为公开记录缺少底层合同和运营数据。已审阅来源没有披露热价、期限、续约触发、履约罚则、流失、NRR、GRR
              或满意度指标。这不意味着第一个客户关系弱；市政批准和本地低碳供热的战略价值，很可能提高粘性。但这也意味着，公开耐久性分析必须保持克制。供热端仍处于分阶段铺开，发电端只证明到并网输出，而不是客户特定商业历史。投资者应把
              Geretsried 的客户耐久性视为一个合理但仍未证明的商业护城河。最好的可见留存信号是，即使在产出和扩张复杂性遭遇负面评论后，项目仍继续获得伙伴、政策和管理层支持。
