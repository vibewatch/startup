      - number: '8.3'
        title: 情景分析与可比框架
        blocks:
          - type: paragraph
            body: >-
              Eavor 直接的私营可比公司很弱，因此正确方法是三角测量。Ormat 等上市地热公司有用，并不是因为它们的收入倍数可以直接照搬，而是因为它们展示了市场会给已经验证的地热现金流、治理和运营规模多少价值。Ormat
              2025 年接近 10 亿美元的收入基数和约 $7.75B 市值，说明成熟地热执行力能够承载的价值量级；同时也凸显 Eavor 距离那种成熟度还有多远。因此，更实用的是多头 / 基准 / 空头框架。多头情景假设
              Geretsried 成为可信参考电站，许可或后续部署落地，战略买家愿意为可调度地热 IP 和市场通道支付稀缺性溢价。基准情景假设 Eavor
              仍具战略价值，但只完成了部分去风险，估值体面却还达不到完整平台级。空头情景假设运营方切换拖慢进度、完工 capex
              上升，新资本条款对普通股的次级化程度高于当前公开故事所暗示的水平。每个情景下，可比公司的作用都是给叙事划边界，而不是替叙事定案。
