  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、反论点与建议
        blocks:
          - type: paragraph
            body: >-
              Eavor
              的多头逻辑很容易讲清楚。它占据了能源转型堆栈中稀缺的一块：可调度地热，背后有战略支持、公共融资支持，还有一个真实但并不完美的商业示范场。这种稀缺性重要，因为大型工业、公共事业和数据中心买家越来越想要清洁稳定电力，而不是只依赖间歇性供给。公司也有来自
              OMV、Chubu、Canada Growth Fund 和 Microsoft 相关生态活动的可见合作伙伴验证，已授权知识产权组合也在扩大。如果 Geretsried
              能成为可复制模板，而不是一次性救火项目，Eavor
              可能获得平台式估值逻辑，超过简单项目资产核算。反论点同样强。公开证据仍未显示一个完全完工、净输出强劲为正的商业资产；也没有披露当前投后估值，更没有揭示对新投资者最关键的优先级和稀释条款。2026 年 5
              月的运营方转向，把技术模糊性变成了融资模糊性。因此，当前最合适的建议是继续研究，而不是买入或回避。公司真实进展太多，不能简单否定；但披露出的经济性证据还不足以支撑对公允价值作出虚假的精确判断。
