      - number: '5.2'
        title: 架构、热虹吸物理与关键钻井工具
        blocks:
          - type: paragraph
            body: >-
              技术栈足够具体，可以作为真实架构尽调，而不是营销图。最底层是热岩；回路通过热传导从中取热，不开采地层流体。岩石中是一套密封多分支井系统，工质与周围地层隔离。Eavor
              认为，这种设计减少水处理，并避开与造渗策略相关的诱发地震风险。热虹吸主张很重要，因为它支撑低寄生负载叙事：如果密度差能驱动循环，电站就能避开其他地热设计承担的一部分泵送和维护负担。钻井栈同样核心。Geretsried
              需要长距离连接侧钻、主动磁测距来保持井眼对齐直到交汇，还需要 Rock-Pipe 式井筒隔离来让闭环可行。因此，架构强度取决于钻井执行；物理机制、地面电站和经济性都依赖精确、可重复的多分支完井。
