  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Eavor
              卖的不是软件功能，也不是泛泛的地热主张；它卖的是交付能源结果。保留来源一致把产品描述为一座闭环地热电站，可提供区域供热、电力或二者兼具；系统使用密封地下散热器，而不是开采型水热储层。在客户工作流中，市镇或公用事业先承诺热能或电力
              offtake，然后 Eavor 钻探并连接回路，调试 ORC 和区域供热接口，最后把热能和电力输出到本地基础设施。Geretsried
              重要，因为它把这套工作流从概念推进到可见公开示范项目：场址有市政供热合同、已完成 ORC
              电站，并已向德国电网输出第一度电。这组组合比实验室试点强得多，但仍集中在一个旗舰场址，而不是多元化装机基础。因此，工作流证明了产品意图和部分交付，同时留下长期运行和复制问题。
