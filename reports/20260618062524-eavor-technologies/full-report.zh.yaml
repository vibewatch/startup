      - number: '1.5'
        title: 负面推读与披露缺口
        blocks:
          - type: paragraph
            body: >-
              Eavor 最强的公开叙事，是 Geretsried 已证明核心技术，并为许可业务打下基础。最强的负面推读，则是项目仍不完整、成本仍太高，尚不足以支撑完整商业化模板。CleanTechnica 2026
              年的批评认为，早期发电输出远低于最初 Phase 1
              目标，转向许可看起来更像是远离项目风险所有权，而不是把一个完成的示范电站漂亮交接出去。这些文章是解释性判断，不是定论，但它们重要，因为攻击的是商业论点，而不只是技术论点。同样重要的是，公开披露在投资者下一步最需要的核心指标上仍很薄：估值、收入、客户数量、具体投资者控制权，以及
              CEO 更替的正式解释。于是，公司拥有异常丰富的项目级叙事，但最高层财务透明度仍有限。
