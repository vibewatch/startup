            body: >-
              公开护城河故事可信但不完整。Eavor
              拥有可申请专利的井筒和流体管理技术、技术会议产出、招聘活动，以及德国项目新闻触点；这些合在一起显示出一个活跃工程组织，而不是静态气候叙事。Rock-Pipe、AMR、长距离连接侧钻，以及 Geretsried
              不断增长的数据集，可能都会复利成比单一专利主张更难复制的 know-how。但同一组来源也说明，投资者不应夸大护城河。公开可靠性数据、资产群式 uptime 披露和完全透明的回路经济性仍然缺席；公司自己 2026
              年信息也承认，Geretsried 是为更深、更强下一代回路服务的学习平台。因此，路线图指向更强的第二代产品，而当前尽调负担仍集中在持续产出、单位经济性，以及从自有旗舰项目转向可许可、可重复架构。
