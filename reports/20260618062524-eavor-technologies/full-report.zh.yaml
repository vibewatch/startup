      - number: '7.4'
        title: 缓释因素、监测指标与终止标准
        blocks:
          - type: paragraph
            body: >-
              公开记录里确实有不少缓释因素，不应忽视。Eavor
              拥有大量合作伙伴验证、大规模公共融资包、近期专利授权、首次发电的独立确认，以及钻井效率改善的可信证据。这些因素说明，风险并不是“欺诈还是成功”的二元问题，而是一个围绕时间和可融资性的难题：还需要多少新增资本、工程工作和合作伙伴支持，才能把一个部分完成的首创资产变成可复制的商业模板。最有用的监测指标很直接，也能观察到：看净输出而不是总量里程碑话术；看有多少回路在实际贡献流量；看继任运营方是否被任命并拿到资金；看项目公司是否发布一份可对账的完整完工时间表；看新增资本条款是在维护股权故事，还是把股权进一步置于次级。主要破局事件也很清楚。如果
              Eavor
              无法锁定替代运营方、无法为剩余完工工作融资，或无法证明当前回路场能持续交付正净输出，那么以许可为主导的商业化叙事会明显削弱。反过来，如果它恢复稳定净输出，并补上运营方和资金缺口，剩余风险溢价应会明显压缩。
