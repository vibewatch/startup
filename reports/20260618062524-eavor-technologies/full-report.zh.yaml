      - number: '1.4'
        title: 商业里程碑与德国建设
        blocks:
          - type: paragraph
            body: >-
              决定性里程碑都发生在德国。2023 年，Eavor 把 Geretsried 从概念推进为首次商业规模现场作业；同时让 Chubu 进入项目公司，并与 enercity 签署 Hanover
              供热购买协议。独立来源和官方来源都认为，Geretsried 位于一个此前传统地热尝试失败的场址，因此成为高能见度测试：Eavor 所称闭环系统能否在高温但干燥的地质中运行。到 2025 年 12 月，Eavor
              已向德国电网输出第一度电。到 2026 年 3 月，Bavaria 地热观察者报道称，计划中的四个回路已有第一个在运行。与此同时，Eavor 自己 2026 年 5 月技术更新明确说，Loop #1
              在六对侧钻后停止，而不是原计划十二对，因为水力连通问题改变了执行模型并推高成本。这组组合——明确技术进展加上原始范围未完成——就是后续章节应视为事实基础的核心里程碑模式。
