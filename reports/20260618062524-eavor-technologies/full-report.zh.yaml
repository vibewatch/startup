      - number: '7.3'
        title: 合作伙伴、资本与组织依赖
        blocks:
          - type: paragraph
            body: >-
              Eavor 的融资历史显示，这家地热初创公司获得了异常强的战略支持；同时也凸显出它依赖的交易对手，其激励并不完全与少数股东一致。OMV 的持股和优先许可权、Chubu
              在项目公司中的角色、出口信贷支持的债务结构，以及 Canada Growth Fund 按里程碑投放的资本，共同解释了 Geretsried 为何能推进到今天。但这也意味着，商业化并不由 Eavor
              单独掌控。运营方切换是最清楚的例子：2026 年，公司公开把自己重新定位为技术提供商，开始寻找替代运营方，同时大幅削减员工。这个动作可能会简化 Eavor
              的商业模式，但也把最难的运营工作转给了一个尚未公开确定的第三方。交易对手问题还延伸到厂区之外：Geretsried
              市政部门和当地热网主体已经公开把基础设施铺开与分阶段地热交付绑定，因此延误现在也会给本地承购伙伴带来协同和声誉风险。融资集中度同样重要。Eavor
              仍依靠项目债务、补贴、战略投资者和有条件公共资本，而不是内部产生的现金流。如果 Geretsried
              释放出的混合信号让其中任何一类交易对手转向谨慎，公司可能会在强参考电站出现前，被迫放慢建设、接受更昂贵资本，或收窄许可策略。
