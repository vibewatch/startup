      - number: '4.3'
        title: 成本结构、毛利驱动因素与单位经济性可见度
        blocks:
          - type: paragraph
            body: >-
              Eavor 的成本结构明显偏资本开支。业务依赖深井钻探、多分支交汇、地面发电转换和伙伴密集执行，因此主要经济问题不是近期 SG&A
              杠杆，而是钻井学习收益能否把交付热能和电力的成本拉低到足以支撑可融资项目。Eavor 自己 2025 年回顾称，相比传统套管，侧钻速度快 50%，建井成本降低超过
              40%；方向上是利好。但公开单位经济性大多仍空白：没有每 MWh 现金成本，没有每 GJ
              交付热能成本，没有毛利披露，也没有营运资本图景。唯一稳健推论是，只有当钻井和完井经验能在未来回路、未来场址中重复，利润率才会改善。
