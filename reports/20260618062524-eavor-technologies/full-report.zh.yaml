      - number: '2.5'
        title: 约束、矛盾，以及硬性 SAM/SOM 仍卡在哪里
        blocks:
          - type: paragraph
            body: >-
              约束仍然实质存在。IEA 称，钻井密集型地热仍是资本开支重的行业，类别也仍处在融资「缺失中段」。Geretsried 还把项目特定怀疑注入每一个乐观市场主张。公开来源对运行时间相互冲突，2026
              年负面分析称当前发电输出远低于原始目标，只有一个回路在运行，经济性评估仍在继续。这些批评不会抹掉市场，但会改变市场形状。它们意味着，区域供热可能比纯发电项目更早商业化，Eavor
              的上市路径可能转向许可或伙伴主导执行，买方在采用关键基础设施前会要求进一步去风险。最重要的是，保留的公开来源没有披露已实现热价、电价或许可费。没有这些数字，正确结论不是市场很小，而是公开证据支持一个受约束、多视角的市场判断，但不支持精确公开
              SAM 或 SOM。
