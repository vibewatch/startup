      - number: '2.4'
        title: 驱动因素：政策拉动、能源安全与项目经济性改善
        blocks:
          - type: paragraph
            body: >-
              几股力量正把市场推向 Eavor 所在类别。德国摆脱化石供热、2022 年后天然气不安全，给本地可靠供热带来政治紧迫性。BBSR 2026
              年出版物显示，市政供热规划已不再停留在理论层面。同时，企业对清洁稳定电力的需求正在改善发电端叙事；IEA
              称，一些下一代地热项目如今拿到的合约价格，已显著高于风电或太阳能等价项目。项目经济性也是公司内部最主要顺风。Eavor 自己 2025 年和 2026
              年技术材料声称，侧钻更快、钻头单趟进尺更长、建井成本更低，区域供热经济性已经具备成本竞争力。融资信号也指向同一方向：CGF、OMV、银行和公共贷款机构都支持了首次商业化部署。市场结论不是该类别已经成熟，而是驱动因素组合已足够强，能在首创风险下继续吸引资本和交易对手。
