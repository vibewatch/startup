      - number: '5.3'
        title: Geretsried 部署成熟度与商业化证据
        blocks:
          - type: paragraph
            body: >-
              证据基础支持更细致的成熟度判断。正面来看，2025 年 12 月第一度电送入德国电网，公司和独立行业媒体都认同 Loop 1
              已连接并调试，技术更新和德国项目新闻页也都称钻井活动产出了一个可运行商业回路，并带来有意义的学习曲线收益。场址还拥有已完成 ORC 电站和市政区域供热整合计划，这些都是实物商业资产。不过，2026
              年负面报道说明，Geretsried 仍应被视为首创型示范资产，而不是已完成的规模化产品。ThinkGeoEnergy 和 CleanTechnica
              都提出同一个核心担忧：计划中的侧钻系统只有一部分作出了有意义贡献，批评发生时产出仍远低于头部设计，且可重复可融资性尚未公开证明。正确结论不是电站失败，而是商业化证据真实存在，但仍不完整。
