      - number: '7.2'
        title: Geretsried 执行与表现风险
        blocks:
          - type: paragraph
            body: >-
              Geretsried 仍是判断 Eavor
              的关键证据节点。官方口径确实可以指向首次发电、部分商业化运行、大规模钻井，以及清晰的学习曲线改善。但同一套公开记录也显示，按最初描述的商业几何形态看，该资产仍未完工。最重要的反向数据点来自 2026 年 5 月
              GEO ExPro 访谈：报道披露，目前只完成了一对注采井和六个回路，其中只有三到四个回路贡献了有意义的流量；当前总输出约 0.5 至 1.0 MWe，而电站自身消耗约 0.5
              MWe。这些披露并不能证明概念会永久失败，但足以说明，Eavor 尚未拿出一个完整规划回路场的、经过外部验证且干净的参考案例。结果就是典型 FOAK
              风险叠加：机械修复风险、完工预算不确定、净经济性验证推迟，以及最有利的经验教训可能仍要等到更深、更热的后续项目，模式才会变得可复制。因此，投资者应把官方里程碑公告视为真实进展，但不能把它当作持续运营证据的替代品。外部记录还显示，首次发电预期从
              2025 年上半年目标滑到 2025 年末启动，且仍取决于调试和审批；这更像一个运营上仍脆弱的项目，而不是已经充分去风险的资产。
