  - id: TV005
    title: 论点破坏与否决触发器表
    columns:
      - 触发器
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 没有获得资金的继任运营商
        - 没有公开运营商和融资包来完成 Geretsried
        - 削弱把里程碑电站变成可复制模板的能力
        - 不支付平台溢价。
      - - 净经济性偏弱或未披露
        - 部分运营后仍没有更强的净输出披露
        - Geretsried 仍是不完整证明，而不是可融资参考项目
        - 维持继续研究，或下调评级。
      - - 融资条款不利
        - 新轮次带有重优先级、救助特征或惩罚性稀释
        - 确认少数股权前面存在资本结构风险
        - 要求更深折价，或退出。
      - - 许可没有第三方拉动
        - 现有战略伙伴之外，没有具体付费部署 / 许可信号
        - 叙事溢价向纯资产估值衰减
        - 大幅降低上行假设。
    notes: 否决触发器聚焦那些会实质改变新投资者经济逻辑的事件，而不是一般宏观噪音。
