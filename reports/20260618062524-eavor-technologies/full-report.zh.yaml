            body: >-
              描述 Eavor 2026 年 GTM 动作，最贴切的说法是：伙伴主导的项目开发商，正在转向技术提供商经济性。OMV 协议给出优先许可条款、开发支持和国家级部署重点；Chubu
              则把该项目部分描述为通向未来日本应用学习的路径。这不等同于简单的公用事业销售商，也不是纯 IP 许可方，但确实意味着客户触达和部署都由伙伴居中。CAC、销售周期和 pipeline
              转化均未披露，因此有用的销售效率代理指标是新增战略伙伴、达成融资里程碑、钻井表现改善，以及这些里程碑能否转化为新项目路径。相比软件公司，这是一组更弱的披露，但对首创型基础设施很正常。
            claimRefs:
              - CI006
