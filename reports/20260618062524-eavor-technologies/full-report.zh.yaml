  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管姿态与核心技术风险
        blocks:
          - type: paragraph
            body: >-
              Eavor
              的核心主张是，密封闭环地热架构绕开了水热和重刺激地热系统附带的许多最难监管和地质约束。公司反复称，该系统避免水力压裂、产出卤水、依赖含水层和诱发地震；行业报道和欧洲公共融资材料也重复这一框架。这一定位重要，因为它解释了为什么投资者和公共资助机构愿意支持
              Geretsried 作为首个商业规模项目。历史许可也并非毫无摩擦：此前钻井令人失望后，Geretsried
              更大钻井平台的本地批准才落地，说明即便低地震风险设计，也仍继承场址特定执行和许可风险。不过，类别风险降低并不消除项目风险。法律和技术问题不再是概念能否被描述为低地震风险或低用水；而是建成系统能否按融资包隐含的规模和成本，持续交付热能与电力。近期专利授权增强了
              Eavor 对部分井筒合成和 Rock-Pipe 工艺专有性的主张，但许可业务只有在底层系统也能商业化重复时才站得住。换句话说，技术故事合理，但剩余风险在于从实验室和试点逻辑转译为可融资现场表现。
