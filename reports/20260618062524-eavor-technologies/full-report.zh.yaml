  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接同行、相邻玩家、在位者与替代方案
        blocks:
          - type: paragraph
            body: >-
              Eavor 周围的相关竞争集合，远不止「其他闭环初创公司」。直接先进地热同行包括 Fervo、Sage Geosystems、Quaise 和 GreenFire
              式改造系统，但从承销角度看，最重要的替代者是已经能在可融资合同下出售可靠热能和电力的成熟地热在位者。Fervo 是最清晰的直接执行基准，因为它已经把油气式钻井、大型具名项目和与 hyperscaler
              相关的商业牵引放在一起。Sage 竞争方式不同，强调压力地热储能加发电；Quaise 竞争的是更深、更热的超热地热论点，商业化更早期。Ormat 代表在位者基准：真实兆瓦、长期 PPA
              和运营电站群。因此，这个格局横跨直接同行、相邻实验模型、成熟地热运营商，以及更广义的清洁稳定电力现状。
