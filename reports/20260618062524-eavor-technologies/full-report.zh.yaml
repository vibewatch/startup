        blocks:
          - type: paragraph
            body: >-
              在本章审阅并保留的公开来源中，Eavor 没有披露已确认收入、ARR、客户数量或 run-rate。因此，本章必须把理论收入机制和实际财务证明拆开。可支撑的收入机制包括区域供热交付、发电、技术许可 /
              开发支持，以及非稀释性补助；其中只有最后一类目前明确有现金支持证据。EIB 称 Geretsried 已有本地供热商 offtake
              合同，但没有公开来源披露电价/热价条款、计费量或已实现客户收款。首次发电新闻稿有财务意义，因为它降低了技术可信度风险；但它仍不能证明变现质量。简言之，Eavor 有收入架构，但没有公开收入报表。
