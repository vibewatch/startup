      - number: '6.5'
        title: 商业化证据与未来 pipeline
        blocks:
          - type: paragraph
            body: >-
              Geretsried 的证明足以让 Eavor 具备商业相关性，但不足以证明广泛客户多元化。首次发电、一个正在履行的市政供热合同和 EU 支持融资，使 Eavor
              区别于尚无客户的地热概念。它们显示公司能赢得市政买方、走完公共批准、筹集项目债务，并实际交付电力。但同一语料也显示，前瞻叙事仍有多少依赖 pipeline，而不是当前客户基础。Hanover 在 Eavor
              Germany 材料中作为与 enercity 合作的重大后续需求机会出现，并有服务相当数量家庭的目标；但这是未来客户创造，不是当前多元化收入。Eavor 自身越来越多地把 Geretsried
              描述为更大规模铺开的蓝图和示范资产。战略上这说得通。但尽调也因此应询问接下来的两三个客户，而不只是第一个客户是否存在。截至报告生成日，最强商业证明仍是一个旗舰市政关系承载了过大的信号权重。
