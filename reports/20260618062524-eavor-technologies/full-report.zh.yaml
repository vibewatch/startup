      - number: '6.4'
        title: 集中风险与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              当前集中风险极高。公开需求证明围绕一个具名市政供热买方，以及未具名下游或电力交易对手。即便该地区最终终端需求很大，当前公开证据基础也没有显示今天有多元化的已签约客户、行业或地区在贡献收入。采购摩擦也异常高。不同于纯商用电力资产，Geretsried
              必须协调地下执行、ORC 就绪、市政批准和区域供热网络建设，客户价值主张才能完整实现。技术滑坡会直接传导到客户接入延误，因此延迟成本更高。2026
              年负面报道强化了这一点：如果早期实际产出低于头部设计，客户集中会更糟，因为单一示范项目承担了更重证明负担。因此，客户章节最终高度依赖一个市政合同和一个旗舰场址；这是有用证明，也是尖锐的单项目风险。
