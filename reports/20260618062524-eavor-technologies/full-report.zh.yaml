              更强，因为它们显示真实买方、治理流程和计划服务量。它们也揭示了采用预期如何落地：先是市政批准和网络建设，再到锚定建筑与区域供热主干用户，之后如果钻井进度和电站调试按计划推进，才扩展到更多家庭。发电端，2025 年
