        title: 已披露客户格局与分层
        blocks:
          - type: paragraph
            body: >-
              Eavor 的公开客户格局比技术叙事窄得多。保留语料中唯一明确具名的供热 offtake 交易对手，是 Stadtwerke Geretsried 旗下 Isar Loisach Naturwärme 子公司
              ILN。这很有意义，因为它把 Geretsried
              从泛泛示范场址变成获得市政批准的商业关系。但同一证据集也显示出披露限制。公开材料谈到城镇、地区，以及服务学校、企业、大型住宅区并最终覆盖更多家庭的区域供热网络，却没有发布逐场址接入用户名单。发电端，Eavor、POWER
              和 ThinkGeoEnergy 都确认已向德国电网输出第一度电，但已审阅来源都没有列出长期购电方。结果是，客户基础真实、由合同支撑、战略上重要，但最佳描述仍是一项市政锚定关系，加上部分披露的下游用户类别。
