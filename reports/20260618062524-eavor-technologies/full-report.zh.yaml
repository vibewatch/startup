      - number: '8.2'
        title: 融资背景与可观察估值锚点
        blocks:
          - type: paragraph
            body: >-
              Eavor 已经积累了足够多的可见资本，足以排除一个微不足道的估值；但披露仍不足以支撑一个干净的溢价标记。2023 年融资记录、OMV 披露的股权购买，以及 2025 年 Canada Growth Fund
              承诺合在一起说明，在完整商业验证出现前，成熟交易对手就愿意为这个平台投钱。OMV 的股权购买为 2023 年估值提供了一个粗略代理，落在数亿美元高位区间；更新的 CGF
              支持则表明，公共资本仍看到推动公司穿越商业化阶段的战略价值。Geretsried
              的债务和补贴组合也影响估值，因为它证明第三方资本已经围绕一个大型真实资产组织起来。不过，这些可观察锚点不能和普通股的干净公允价值标记混为一谈。公开记录仍缺少当前投后估值、优先权结构、CGF
              工具的精确条款，以及可对账的完工成本。因此，任何当前估值都必须被表述为基于锚点和情景搭建的区间，而不是单一数字。
