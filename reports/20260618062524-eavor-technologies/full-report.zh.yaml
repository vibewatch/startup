              财务结论偏混合且谨慎。Eavor
              为一个首创型地热平台拼出了异常强的战略和公共支持；这很重要，因为相对于没有支持的初创公司，它降低了融资风险。但收入质量仍未证明，因为已实现变现未披露，独立报道也质疑支撑后续资本所需的表现。利润率路径只有在钻井学习收益延续、且热能交付经济性主导最终价值栈时，才在概念上有吸引力。Ormat
