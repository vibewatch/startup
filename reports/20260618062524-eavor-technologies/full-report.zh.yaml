      - - OMV 2023 年对 Eavor 的战略持股
        - 战略性私募信号
        - €34M 换 6.5%
        - 提供真实的历史持股估值代理。
        - 旧标记和部分权利可能不同于未来轮次经济性。
      - - CGF 2025 年支持
        - 公共 / 战略资本
        - 最高约 C$138M 承诺
        - 确认公共资本仍看到战略商业化价值。
