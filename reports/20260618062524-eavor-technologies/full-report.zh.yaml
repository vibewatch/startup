        - 高
        - 完工、运营商交接和资本结构不透明仍是重大风险。
      - - 估值立场
        - 不明至合理
        - 可见资产和合作伙伴提供了底部支撑，但目前没有公开证据能干净支撑一个带溢价的后期估值标记。
      - - 改变判断的因素
        - 更强的净运营证明，加上融资透明度
        - 若完工计划能对账、条款更清楚、后续需求强劲，风险溢价会被压缩。
    notes: 本章建议对价格和证据都敏感。它不是说 Eavor 没有战略价值，而是说当前公开证据还不足以支撑一次干净的承销判断。
