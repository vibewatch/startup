      - number: '2.3'
        title: 买方、用户、付款方与采用流程
        blocks:
          - type: paragraph
            body: >-
              供热端的最终用户，是接入区域供热网络的家庭和企业，但他们不是基础设施买方。实际买方是市政公用事业、项目公司，以及公共或准公共供热系统运营方；卡口机构则是供热规划者、公用事业高管、银行和公共出资方。这解释了为什么采用路径比单纯技术销售慢：一个项目必须先过供热规划、选址、许可、锚定
              offtake 谈判、项目融资，最后才进入建设。发电端的可能付款方不同：看重长期合约下清洁稳定电力的公用事业和大型企业。Google、Microsoft 和 Nucor
              的需求聚合倡议重要，因为它释放出一个买方类别的信号：愿意把早期项目提前拉起来。OMV 和 Chubu 作为渠道重要，因为它们让 Eavor 从纯开发商变成一条由伙伴牵引、进入欧洲和日本的路径。
