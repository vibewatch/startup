      - number: '1.3'
        title: 资本结构、投资者基础与项目融资组合
        blocks:
          - type: paragraph
            body: >-
              Eavor 的资本故事靠战略能源伙伴和公共部门商业化资本支撑，而不是靠已披露运营指标。OMV 2023 年 6 月投资 €34 million，取得 6.5%
              股权，并获得若干欧洲市场的优先许可与开发权；这实际上启动了公司的 Series B 融资。之后公开来源对轮次总额说法不一：Eavor 自己的 2023 年回顾称 Series B 以 C$180 million
              关闭，转换和追加发行后 2023 年总资本达到 C$239 million；ThinkGeoEnergy 则报道了一轮 C$182 million 股权融资。后续资本来自 CGF，后者先在 2023 年承诺
              C$90 million，又在 2025 年追加最高约 C$138 million。在项目层面，Geretsried 还叠加了 €91.6 million Innovation Fund 补助，以及由
              EIB、JBIC、ING 和 Mizuho 牵头的约 €130 million 债务包。结果是一套很深、但结构复杂的投资者和贷款人组合，其经济权利大多仍未披露。
