    summary: 公开客户证据从广泛区域需求收窄到一个具名客户合约、一个并网发电里程碑，以及仍有限的下游用户披露。
    data:
      nodes:
        - label: 区域低碳供热和供电需求
        - label: 市政合约和公共融资包
        - label: 回路钻井和 ORC 投运
        - label: 首次并网输出电力
        - label: 分步连接供热用户
        - label: 后续城市管线
      edges:
        - from: Regional low-carbon heat and power demand
          to: Municipal contract and public-finance package
        - from: Municipal contract and public-finance package
          to: Loop drilling and ORC commissioning
        - from: Loop drilling and ORC commissioning
          to: First grid power export
        - from: First grid power export
          to: Stepwise heat-user connections
        - from: Stepwise heat-user connections
          to: Follow-on city pipeline
    claimRefs:
      - CU007
      - CU014
      - CU025
      - CU026
  - id: FU003
    title: 客户验证矩阵
    type: matrix
    summary: 该矩阵对保留语料中少数客户相关实体的公开验证质量打分；ILN 是最强的具名客户，其他多数行只构成部分验证。
    data:
      columns:
        - 具名交易对手强度（0-100）
        - 运营验证（0-100）
        - 留存可见度（0-100）
        - 披露完整度（0-100）
      rows:
        - label: ILN / Stadtwerke Geretsried
          values:
            - 95
            - 35
            - 25
            - 35
        - label: 德国并网输出路径
          values:
            - 10
            - 90
            - 15
            - 10
        - label: 锚定建筑 / 公共机构
          values:
            - 20
            - 10
            - 5
            - 15
        - label: 未来 Hanover 式城市伙伴
          values:
            - 40
            - 0
            - 0
            - 20
    claimRefs:
      - CU001
      - CU007
      - CU015
      - CU016
      - CU027
  - id: FR001
    title: 当前 Eavor 投资案例风险热力图
    type: matrix
    layout: wide
    summary: 最高剩余风险落在完工、净输出和依赖伙伴的融资上，而不是地热需求这个品类本身。
    data:
      columns:
        - 可能性
        - 剩余严重性
        - 主要驱动因素
        - 降低风险所需条件
      rows:
        - label: 回路场未完成
          values:
            - 高
            - 关键
            - 仅部分计划几何结构在运行
            - 完成更多回路，并公布稳定产出数据
        - label: 净输出偏弱
          values:
            - 高
            - 关键
            - 寄生负荷吸收了大部分总发电量
            - 展示持续正向净输出和供热交付
        - label: 运营商交接
          values:
            - 高
            - 高
            - 尚无具名替代运营商
            - 签署已获资金支持的运营商协议
        - label: 里程碑资本
          values:
            - 中高
            - 高
            - 完工仍依赖有条件外部资本
            - 完成无条件后续融资
        - label: 许可护城河不确定
          values:
            - 中
            - 中高
            - 专利组合可能窄于完整技术栈
            - 证明第三方愿意为许可经济性付费
    approximationNotes: 可能性和严重性是分析师基于已引用公开记录形成的判断，不是精算概率。
    claimRefs:
      - CR008
      - CR009
      - CR010
      - CR025
      - CR032
      - CR040
  - id: FR002
    title: 从 Geretsried 表现传导到企业风险的风险图
    type: dag
    layout: wide
    summary: Geretsried 表现不佳会同时影响融资、伙伴信心和许可经济性。
    data:
      nodes:
        - id: loops
          label: 回路不完整 / 偏弱
        - id: net
          label: 净输出偏弱
        - id: operator
          label: 寻找运营商
        - id: capital
          label: 有条件资本
        - id: reference
          label: 缺少可融资参考电站
        - id: licensing
          label: 许可议价力下降
        - id: followon
          label: 后续项目变慢
        - id: valuation
          label: 风险溢价更高
      edges:
        - from: loops
          to: net
        - from: net
          to: reference
        - from: operator
          to: reference
        - from: capital
          to: followon
        - from: reference
          to: licensing
        - from: reference
          to: followon
        - from: licensing
          to: valuation
        - from: followon
          to: valuation
    approximationNotes: 方向性连接展示公司、贷款方和反向评论来源反复提到的因果渠道。
    claimRefs:
      - CR009
      - CR010
      - CR021
      - CR031
      - CR032
      - CR036
  - id: FR003
    title: 完工和商业化依赖图
    type: dag
    layout: standard
    summary: 完工依赖资本、运营商能力和战略伙伴，这些因素都有一部分不在 Eavor 直接控制内。
    data:
      nodes:
        - id: eavor
          label: Eavor 技术所有者
        - id: operator
          label: 未来运营商
        - id: cgf
          label: Canada Growth Fund
        - id: omv
          label: OMV
        - id: chubu
          label: Chubu
        - id: debt
          label: 项目贷款方
        - id: project
          label: Geretsried 完工
        - id: followon
          label: 未来许可 / 部署
      edges:
        - from: eavor
          to: project
        - from: operator
          to: project
        - from: cgf
          to: project
        - from: debt
          to: project
        - from: omv
          to: followon
        - from: chubu
          to: project
        - from: project
          to: followon
    approximationNotes: 图示突出会实质影响完工时点和未来市场可信度的交易对手。
    claimRefs:
      - CR012
      - CR015
      - CR017
      - CR018
      - CR031
      - CR032
  - id: FV001
    title: 建议逻辑流
    type: flow
    layout: standard
    summary: 当前建议来自真实战略价值与披露不完整、商业验证不完整之间的冲突。
    data:
      nodes:
        - id: n1
          label: 战略资金 + 公共支持
        - id: n2
          label: 首批电力 / 部分运营
        - id: n3
          label: 资本结构不透明
        - id: n4
          label: 商业验证不完整
        - id: n5
          label: 继续研究
      edges:
        - from: n1
          to: n5
        - from: n2
          to: n5
        - from: n3
          to: n5
        - from: n4
          to: n5
    approximationNotes: 流程强调，为什么强叙事支持和真实里程碑仍不足以跨过方向性买入的承销门槛。
    claimRefs:
      - CV006
      - CV012
      - CV021
      - CV027
      - CV028
  - id: FV002
    title: 关键驱动因素估值敏感性（示意 EV 区间，US$M）
    type: bar
    layout: wide
    summary: 示意区间展示，Eavor 一旦从资产支持但模糊的状态走向可重复商业验证，估值框架会多快变化。
    data:
      items:
        - label: 资产支持底价 / 困境战略价值
          value: 500
        - label: 历史战略持股框架（折算粗略代理）
          value: 750
        - label: 基准情景：部分去风险 + 伙伴支持
          value: 1100
        - label: 上行情景：Geretsried 成为可复制模板
          value: 2000
        - label: 公开成熟地热参考框架（不可直接比较）
          value: 7750
    approximationNotes: 数值是示意性分析师区间，不是公司报告估值。Ormat 数据点只作为成熟行业参考，不是直接公允价值类比。
    claimRefs:
      - CV003
      - CV014
      - CV015
      - CV016
      - CV022
      - CV023
      - CV039
      - CV040
  - id: FV003
    title: 牛 / 基准 / 熊估值区间
    type: range
    layout: standard
    summary: 情景区间说明，下行取决于资产，上行取决于验证。
    data:
      items:
        - label: 熊市：运营商 / 融资拖累
          low: 450
          high: 800
        - label: 基准：战略支持，部分去风险
          low: 900
          high: 1400
        - label: 乐观情景：可复制授权平台
          low: 1800
          high: 2800
    approximationNotes: 区间来自已引用的公开锚点和情景逻辑，而非披露的内部模型。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV029
      - CV034
      - CV035
  - id: FV004
    title: 投资 KPI 快照
    type: kpi
    layout: wide
    summary: KPI 面板说明：Eavor 在战略选择权上得分高，但当前估值透明度偏弱。
    data:
      items:
        - label: 战略伙伴质量
          value: 8
        - label: 公共资金支持
          value: 8
        - label: 商业验证完整度
          value: 4
        - label: 估值透明度
          value: 2
        - label: 资本结构清晰度
          value: 2
        - label: 长期市场拉力
          value: 7
    approximationNotes: 评分是供 IC 讨论使用的 0-10 定性分析师评估，不是实测财务比率。
    claimRefs:
      - CV006
      - CV011
      - CV017
      - CV021
      - CV025
      - CV027
