            body: >-
              已审阅公开来源中可见的创始人组合是 John Redfern、Paul Cairns 和 Jeanine Vany。2025–2026 年公开材料也清楚显示，Eavor 在商业化最后一年发生最高领导层变化。CGF
              相关的 2025 年 6 月材料仍称 Redfern 为联合创始人兼 CEO，而 2025 年 12 月首次发电公告和 2026 年 6 月 TIME 发布则将 Mark Fitzgerald 列为
              President and CEO。Matt Toews 2026 年以联合创始人兼首席技术和运营官身份出现，Vany 则仍作为联合创始人和企业事务高管出现在外部报道中。德国相关材料又把 Daniel Mölk
              和 Marco Becker 列为当地子公司的公开运营负责人。未解决的问题是治理透明度：已审阅公开材料没有解释 CEO
              更替，没有列出完整董事会，也没有披露在从试点走向商业化的融资过程中，战略投资方之间的决策权如何分配。
