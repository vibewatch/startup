  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 当前投后估值
        - 近期轮次未披露定价
        - 没有它，所有估值工作都只是区间，不是标记
        - 要求提供董事会材料、交割文件或经核验的二级市场数据。
      - - CGF 融资条款
        - 折价、上限、到期日和介入权未披露
        - 这些条款直接影响稀释和下行保护
        - 获取已签署融资文件，并由律师审查。
      - - Geretsried 完工预算
        - 没有可对账的完工成本或有资金支撑的完工计划
        - 完工 capex 会立即改变估值和融资需求
        - 审查贷款方模型和独立工程师包。
      - - 清算优先权 / 治理权
        - 没有公开股权结构优先级信息
        - 不知道谁先拿钱，名义估值就没有意义
        - 承销入场价前，完成完整法律尽调。
      - - 独立运营数据
        - 没有第三方认证的净输出和供热历史
        - 商业证明质量决定 Eavor 应该按平台逻辑估值，还是按项目逻辑估值
        - 索取历史数据库和第三方工程师签署确认。
    notes: 这些是价值最高的尽调要求，因为每一项都能改变建议，不需要更多市场故事。
