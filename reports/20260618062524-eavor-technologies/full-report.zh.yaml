      - number: '2.2'
        title: 规模测算视角：资本流、已安装供热需求与可见项目楔子
        blocks:
          - type: paragraph
            body: >-
              单一公开 TAM 无法支撑 Eavor，因此本章改用三个规模测算视角。第一，资本流视角：IEA 称 2025 年下一代地热融资接近 USD 2.2 billion，传统地热发电融资接近 USD 5
              billion，地热供热投资超过 USD 11.5 billion。第二，已安装需求视角：欧洲已有约 17,000 个区域供热与制冷网络，服务 67 million
              人；德国市政供热规划铺开，也说明替代化石供热的工作流已在数千个市镇启动。第三，可见项目视角：Eavor 在 Geretsried 有本地供热 offtake，Hannover 也公开提出约占区域供热需求
              15-20% 的目标。这些都是实在的商业锚点。缺失的是从这些锚点通向公司级 SAM 或 SOM 的清晰公开桥梁，因为电价/热价数据、已实现产出经济性和铺开时间仍不完整或相互矛盾。
