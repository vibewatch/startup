      - number: '8.4'
        title: 入场纪律、终止触发与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              现在价值最高的尽调工作，不是再写一份宽泛市场备忘录，而是资本结构和运营验证。新投资者在承销任何对价格敏感的建议前，最重要的是四件事：当前投后估值、CGF
              工具的转换条款、完整商业范围的完工预算，以及排在新资金前面的清算优先权或治理权。没有这些，即使表面估值看起来有吸引力，也可能掩盖少数股东经济性很差的事实。关键终止触发也很实务，不是理论问题。如果 Eavor
              无法任命并资助继任运营方、无法把首次发电宣传与完整完工时间对上，或无法展示更强的净运营数据，折现率就应上升，估值区间也应向资产支持逻辑下移。如果它能补上这些缺口、发布更清晰的经济性，并把 Geretsried
              变成可复制的许可模板，那么今天的继续研究建议，未来刷新时可以合理转向方向性买入。眼下，入场纪律就是先要证据，再为最乐观故事付钱。
