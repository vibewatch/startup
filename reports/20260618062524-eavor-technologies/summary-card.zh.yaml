  topStrengths:
    - 稀缺的清洁稳定电力定位：Eavor 面向可调度地热热能和电力；战略买家越来越需要非间歇性脱碳方案，需求方向对它有利。
    - OMV、Canada Growth Fund、Chubu 等战略方和公共资本深度支持，降低了相较早期地热同行的可信度风险。
    - Geretsried 已不只是概念：2025 年 12 月首度向德国电网送电，并拼起了债务、补助和合作方资本，规模已具备意义。
    - 闭环架构避开了常规水热和 EGS 项目常见的水资源、渗透率和诱发地震问题。
  topRisks:
    - Geretsried 尚未作为完整且经济性透明的四环路标杆资产交付，商业化证明仍是部分证据，不是决定性证据。
    - 公开估值、收入、客户数和股权结构条款都未披露，少数股权尽调只能高度粗略。
    - John Redfern 交棒 Mark Fitzgerald，以及 2026 年 5 月的运营方调整，在最需要商业清晰度的阶段增加了治理和执行不确定性。
    - 闭环地热仍要面对钻井复杂度、完工成本风险，以及授权模式能否比项目延期更快扩张的不确定性。
    - 如果项目时间表继续滑坡，未来融资条款可能稀释普通股，或让新投资人处于次级位置。
  unresolvedGaps:
    - 当前 post-money 估值和清算优先权堆叠未披露。
    - 2025 或 2026 年没有找到公开收入、ARR、毛利率或现金跑道数据。
    - 全 Geretsried 范围的完工预算对账和稳态商业运营方案仍未公开。
    - 公开材料没有完整解释 CEO 交接，也没有说明战略投资者和项目贷款方持有哪些治理权。
    - 更广泛的客户管线、已签授权经济性，以及 Geretsried 之后可复制部署需求，仍只有部分证据支撑。
