  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: Realized heat tariff, power price, and any licensing-fee schedule for Geretsried, Hannover, or other active projects.
    whyItMatters: Without realized pricing the chapter cannot translate public market activity into a defendable company SAM or SOM.
    diligencePath: Request executed offtake economics, any public-filings disclosure, or lender material that states delivered heat and power pricing.
    relatedQuestionRefs:
    - QM023
    - QM025
    relatedTableRefs:
    - TM002
    - TM004
  - type: conflicting-data
    severity: material
    topic: timeline-risk
    missingEvidence: A reconciled operating schedule and loop-by-loop ramp plan that explains the 2026 versus 2028 public timelines.
    whyItMatters: Commercial timing affects market readiness, financing cadence, and whether current public demand signals can convert into near-term revenue.
    diligencePath: Obtain updated project schedule from Eavor, EIB, or lenders and reconcile it against the EU factsheet and 2026 commentary.
    relatedQuestionRefs:
    - QM019
    - QM025
    relatedTableRefs:
    - TM002
    - TM004
  - type: conflicting-data
    severity: material
    topic: adverse-performance
    missingEvidence: Independent operating data on gross and net output, parasitic load, and the number of fully productive loops at Geretsried.
    whyItMatters: Adoption assumptions change materially depending on whether Geretsried is a partial proof point or a weak commercial reference plant.
    diligencePath: Request operating data pack, independent engineer report, or lender technical-monitor updates.
    relatedQuestionRefs:
    - QM020
    - QM021
    relatedTableRefs:
    - TM004
  - type: missing-source
    severity: minor
    topic: scalability-claim
    missingEvidence: Independent evidence that Eavor economics remain attractive outside the current German heat context and beyond company-managed examples.
    whyItMatters: The company claims broad geology and geography applicability, but the public proof base is still concentrated in one German commercial project.
    diligencePath: Look for third-party case studies, non-Eavor partner disclosures, or additional commissioned projects outside Geretsried and Hannover.
