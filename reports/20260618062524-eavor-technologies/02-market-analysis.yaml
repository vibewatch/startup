- id: section-4
  title: 'Drivers: policy pull, energy security, and improving project economics'
  body: 'Several forces are pushing the market toward Eavor’s category. Germany’s move away from fossil heat and post-2022 gas insecurity creates political urgency for local, reliable heat. BBSR’s 2026 publication shows municipal heat planning is no longer theoretical. At the same time, corporate demand for clean firm power is improving the power-side narrative, and IEA says some next-generation geothermal projects are now achieving materially higher contract prices than wind or solar equivalents. Project economics are also the company’s main internal tailwind. Eavor’s own 2025 and 2026 technical materials claim faster laterals, longer bit runs, lower well-construction cost, and cost-competitive district-heating economics already. Financing signals point in the same direction: CGF, OMV, banks, and public lenders have all supported first-commercial deployment. The market takeaway is not that the category is mature; it is that the driver stack is now strong enough to keep capital and counterparties
    engaged despite first-of-a-kind risk.'
  claimRefs:
  - CM010
  - CM015
  - CM028
  - CM033
  - CM034
  - CM035
