chapter:
  number: 2
  title: Market Analysis
summary: Eavor’s market is real but narrower than a generic “global geothermal” story. The strongest public wedge is district-heating and other heat-first infrastructure in Europe—especially Germany—supported by a large installed district-energy base, active municipal heat planning, and public proof points in Geretsried and Hannover. Public evidence supports a multi-lens market thesis, but not a precise public SAM or SOM because tariffs, output economics, and project timing remain incomplete or contradictory.
sections:
- id: section-1
  title: 'Market boundary: heat-first infrastructure, not generic geothermal TAM'
  body: 'Eavor’s market should be bounded around the job its public evidence actually supports: delivering dispatchable geothermal heat and power through specific projects and partner-led deployments. The heat side is especially concrete. Geretsried is tied to a local heat offtake, Hannover is framed as a district-heating project, and Eavor Deutschland explicitly markets the system into district-heating and industrial settings in Germany. That means included spend is municipal heat decarbonization, industrial and commercial direct heat, firm power where long-term offtakers will pay for reliability, and development or licensing contracts tied to those projects. Excluded spend should stay excluded: shallow geo-exchange heat pumps, conventional hydrothermal-only projects that depend on natural aquifers, and broad renewable-energy budgets that are not buying geothermal attributes. The result is a narrower but more defensible market frame than “all geothermal everywhere,” and it makes the status-quo
    substitutes—district-heat retrofits, conventional geothermal, and other firm-power options—visible from the start.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM017
  - CM024
  - CM032
  - CM036
  tableRefs:
  - TM001
