  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - District-heating decarbonization
    - Heat-network conversion, geothermal heat supply, interconnection and offtake
    - Retail heating appliances and shallow geo-exchange retrofits
    - Municipal utility / heat company
    - Most concrete public wedge for Geretsried and Hannover
  - - Industrial and commercial direct heat
    - Process heat, campus heat, commercial heat contracts
    - Generic building-efficiency spend with no geothermal component
    - Industrial site operator / energy manager
    - Fits Eavor Deutschland positioning and heat-first economics
  - - Firm clean power
    - Utility PPAs, corporate offtakes, data-centre supply
    - Merchant power assumptions without contracted demand
    - Utility or large corporate offtaker
    - Relevant but less publicly proven than district heat
  - - Partner-led development / licensing
    - Preferred licensing, project development support, channel partnerships
    - Pure software or royalty-only TAM not tied to projects
    - OMV, Chubu, utilities, developers
    - Explains how Eavor may scale beyond self-developed projects
  - - Status-quo substitutes
    - Conventional geothermal, district-heat retrofits, other firm-power options
    - Non-energy adjacencies
    - Same buyer set as above
    - Shows Eavor competes against solved jobs, not only geothermal startups
  notes: This boundary deliberately excludes broad electrification or shallow-heat-pump spend unless the buyer is purchasing geothermal heat or power attributes from a project or partner channel.
