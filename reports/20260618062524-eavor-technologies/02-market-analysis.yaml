- id: section-2
  title: 'Sizing lenses: capital flows, installed heat demand, and visible project wedge'
  body: 'A single public TAM for Eavor is not supportable, so the chapter uses three sizing lenses instead. First, capital-flow lens: IEA says 2025 next-generation geothermal financing reached nearly USD 2.2 billion, conventional geothermal power funding nearly USD 5 billion, and geothermal heating investment over USD 11.5 billion. Second, installed-demand lens: Europe already has about 17,000 district-heating and cooling networks serving 67 million people, while Germany’s municipal heat-planning rollout shows that the workflow for replacing fossil heat is now active across thousands of municipalities. Third, visible project lens: Eavor has a local heat offtake in Geretsried and a public Hannover target of roughly 15-20% of district-heating demand. Those are real commercial anchors. What is missing is a clean public bridge from those anchors to company-level SAM or SOM, because tariff data, realized output economics, and rollout timing remain incomplete or contradictory.'
  claimRefs:
  - CM005
  - CM006
  - CM007
  - CM008
