  topStrengths:
    - >-
      Rare clean-firm-power positioning: Eavor targets dispatchable geothermal heat and power in a market where
      strategic buyers increasingly want non-intermittent decarbonization solutions.
    - >-
      Deep strategic and public-capital backing from OMV, Canada Growth Fund, Chubu, and other partners reduces
      credibility risk relative to earlier-stage geothermal peers.
    - >-
      Geretsried is no longer a concept-only story: first electricity reached the German grid in December 2025 and the
      project assembled debt, grant, and partner capital at meaningful scale.
    - >-
      Closed-loop architecture avoids some of the water, permeability, and induced-seismicity concerns that burden
      conventional hydrothermal and EGS projects.
  topRisks:
    - >-
      Geretsried has not yet emerged as a fully completed, transparently economic four-loop reference asset, so
      commercialization proof remains partial rather than decisive.
    - >-
      Public valuation, revenue, customer-count, and cap-table terms remain undisclosed, making minority-equity
      underwriting highly imprecise.
    - >-
      The transition from John Redfern to Mark Fitzgerald and the May 2026 operator pivot add governance and execution
      ambiguity at exactly the stage when commercial clarity matters most.
    - >-
      Closed-loop geothermal still faces drilling complexity, cost-to-complete risk, and uncertainty over whether the
      licensing model can scale faster than project setbacks.
    - >-
      Future financing could arrive on terms that dilute common equity or subordinate new investors if project timelines
      slip further.
  unresolvedGaps:
    - Current post-money valuation and liquidation-preference stack remain undisclosed.
    - No public revenue, ARR, gross margin, or cash-runway figures were located for 2025 or 2026.
    - >-
      A reconciled budget-to-complete and steady-state commercial operating plan for the full Geretsried scope are still
      not public.
    - >-
      Public materials do not fully explain the CEO transition or the governance rights held by strategic investors and
      project lenders.
    - >-
      Broader customer pipeline, signed licensing economics, and repeatable post-Geretsried deployment demand remain
      only partially evidenced.
