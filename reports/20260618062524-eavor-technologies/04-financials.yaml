- id: section-5
  title: Capital adequacy, financing dependency and timeline risk
  body: 'This section deliberately mints local Financials claims rather than depending on Company Overview chronology. The disclosed stack is substantial: $182 million Series B, OMV’s €34 million lead check, C$90 million initial CGF support, up to C$138 million additional CGF support, a €45 million EIB loan, a €91.6 million Innovation Fund grant, and a €130 million green-loan syndicate involving EIB, JBIC, ING, and Mizuho. But capital adequacy is still hard to underwrite because cash on hand and burn are not public, and because a meaningful portion of the latest Canadian capital is milestone-gated. Timeline risk compounds this: the CINEA factsheet lists operation in late 2028, later than earlier 2026 full-operation expectations. The implication is that Eavor remains financeable because public and strategic capital have de-risked it, not because operating cash flows have already taken over.'
  claimRefs:
