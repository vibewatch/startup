company:
  name: Eavor Technologies
chapter:
  number: 4
  title: Financials
  summary: Eavor’s public financial story in 2026 is a capital-stack story, not a revenue-disclosure story. The company has assembled a substantial mix of corporate equity, milestone-gated Canada Growth Fund capital, EU grants, and project finance for Geretsried, but public cash, burn, runway, realized tariffs, and customer billing remain undisclosed. The financial verdict is that revenue quality is still unproven, margin upside depends on drilling-cost improvements and heat-delivery economics, and capital adequacy now hinges on whether Geretsried performance can unlock milestone capital and future partner-backed deployments.
sections:
- id: section-1
  title: Revenue streams, pricing model and recognition issues
  body: Eavor does not disclose recognized revenue, ARR, customer count, or run-rate in any retained public source reviewed for this chapter. That means the chapter has to separate theoretical revenue mechanisms from actual financial proof. The supportable revenue mechanisms are district heat delivery, electricity generation, technology licensing / development support, and non-dilutive grants; only the last category is clearly evidenced as cash support today. EIB says Geretsried already has a local heat-provider offtake contract, but no public source discloses tariff terms, billing volumes, or realized customer receipts. The first-electricity press release is financially meaningful because it reduces technical credibility risk, yet it still does not prove monetization quality. In short, Eavor has a revenue architecture, but not a public revenue statement.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI038
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: section-2
  title: GTM motion and sales-efficiency proxies
  body: The best description of Eavor’s 2026 GTM motion is partner-led project developer shifting toward technology-provider economics. The OMV agreement offered preferred licensing terms, development support, and country-level deployment focus; Chubu frames the project partly as a route to future Japanese application learning. That is not the same thing as a simple utility seller or a pure IP licensor, but it does imply that customer access and deployment are mediated by partners. Because CAC, sales cycle, and pipeline conversion are undisclosed, the useful sales-efficiency proxies are strategic partners added, financing milestones achieved, drilling-performance improvements, and whether those milestones convert into new project pathways. This is a weaker disclosure set than a software business, but a normal one for first-of-a-kind infrastructure.
  claimRefs:
  - CI006
  - CI020
  - CI024
  - CI031
  - CI036
- id: section-3
  title: Cost structure, gross-margin drivers and unit-economics visibility
  body: 'Eavor’s cost structure is visibly capex-heavy. The business depends on deep drilling, multilateral intersections, surface power conversion, and partner-heavy execution, so the main economic question is not near-term SG&A leverage but whether drilling-learning gains can pull delivered heat and power costs down far enough to support bankable projects. Eavor’s own 2025 review claims 50% faster lateral drilling and more than 40% lower well-construction cost versus conventional casing, which is directionally positive. Yet public unit economics remain mostly unfilled: no cash cost per MWh, no cost per GJ heat delivered, no gross margin disclosure, and no working-capital picture. The only robust inference is that margins improve only if drilling and completion lessons are repeatable across future loops and future sites.'
  claimRefs:
  - CI024
  - CI025
  - CI030
  - CI037
  tableRefs:
  - TI003
  figureRefs:
  - FI002
- id: section-4
  title: Public traction proxies versus private-metric gaps
  body: 'The public traction proxies are real: first electricity, a stated 8.2 MW / 64 MW design intent, a signed local heat-provider offtake according to EIB, and a completed multilateral field that at least partially operates. But the private-metric gaps remain material and underwriting-critical. Public sources do not disclose customer billing, cash on hand, burn, runway, realized heat tariff, power tariff, or a project-level P&L. Worse, independent 2026 reporting argues that output is still far below design intent and that Eavor is stepping away from the operator role. That combination matters because it means public traction improved while commercial proof remained contested. The result is a chapter where the milestones are valuable, but the financial story still runs on missing metrics and conflicting evidence.'
  claimRefs:
  - CI003
  - CI004
  - CI017
  - CI018
  - CI019
