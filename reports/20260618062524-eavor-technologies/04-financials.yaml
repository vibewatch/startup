  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Cash on hand
    - Cannot underwrite runway or dilution risk
    - Request latest board pack or monthly treasury report.
  - - Monthly burn / capex spend
    - Cannot test capital efficiency
    - Request 2025–2026 actual vs budget by drilling, EPC, SG&A, and R&D.
  - - Heat tariff and billing start date
    - Cannot validate revenue quality
    - Obtain signed local heat-provider contract and first invoices.
  - - Net output by loop
    - Cannot reconcile technical milestone with economics
    - Request loop-by-loop gross, parasitic, and net output series.
  - - Operator-pivot economics
    - Cannot know whether future revenue shifts to licensing or lower-margin support
    - Request revised business-plan bridge from operator model to technology-provider model.
  - - Project-level debt covenants
    - Cannot gauge refinancing risk
    - Request financing memorandum and covenant package.
  notes: These missing metrics are not cosmetic; they are the specific blockers that keep Eavor from being underwritten like a mature geothermal operator today.
