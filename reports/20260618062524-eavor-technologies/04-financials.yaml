- id: section-6
  title: Financial verdict on revenue quality, margin path and diligence blockers
  body: 'The financial verdict is mixed-to-cautious. Eavor has assembled unusually strong strategic and public backing for a first-of-a-kind geothermal platform, and that matters because it lowers financing risk relative to an unsupported startup. But revenue quality is still unproven because realized monetization is not disclosed and independent reporting challenges the performance needed to justify later capital. The margin path is conceptually attractive only if drilling-learning gains continue and if heat-delivery economics dominate the eventual value stack. Mature geothermal filings from Ormat show what good geothermal revenue quality looks like: contracted output, fleet scale, and long-term PPAs. Eavor is not there yet. The critical diligence blockers are cash/burn/runway disclosure, loop-by-loop net output, the economics of the local heat contract, and whether operator-pivot economics strengthen or weaken future margin capture.'
  claimRefs:
  - CI019
  - CI028
  - CI029
  - CI033
  - CI034
  - CI035
  - CI038
  - CI041
  - CI044
  - CI045
