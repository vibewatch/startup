company:
  name: Eavor Technologies
chapter:
  number: 3
  title: Competitors
  summary: 'Eavor competes in 2026 against three different classes of alternatives: scaled next-generation geothermal developers led by Fervo, adjacent advanced-geothermal specialists such as Sage and Quaise, and mature geothermal incumbents led by Ormat. Eavor still has a differentiated closed-loop design and strong strategic partners, but its strongest moats are not yet customer lock-in or proven price leadership. Adverse 2026 reporting on Geretsried makes Fervo’s execution speed and Ormat’s contract maturity the more immediate competitive benchmarks.'
sections:
- id: section-1
  title: 'Landscape: direct peers, adjacents, incumbents and substitutes'
  body: 'The relevant competitive set around Eavor is much broader than "other closed-loop startups." Direct advanced-geothermal peers include Fervo, Sage Geosystems, Quaise, and GreenFire-style retrofit systems, but the most important substitute in underwriting terms is the mature geothermal incumbent that already sells dependable heat and power under bankable contracts. Fervo is the clearest direct execution benchmark because it already pairs oil-and-gas-style drilling with large, named projects and hyperscaler-linked commercial traction. Sage competes differently by emphasizing pressure-geothermal storage plus power, while Quaise competes on a deeper-and-hotter superhot-geothermal thesis that is earlier in commercialization. Ormat represents the incumbent benchmark: real megawatts, long-term PPAs, and operating fleets. The landscape therefore spans direct peers, adjacent experimental models, mature geothermal operators, and the broader clean-firm-power status quo.'
  claimRefs:
  - CP005
  - CP006
  - CP009
  - CP011
  - CP013
  - CP014
  - CP017
  - CP031
  tableRefs:
