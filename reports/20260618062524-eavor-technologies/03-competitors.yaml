  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Executed customer contracts or tariff disclosures for Eavor, Fervo, Sage, or Quaise.
    whyItMatters: Competitive pricing cannot be underwritten from marketing pages or project announcements alone.
    diligencePath: Request signed or redacted offtake / heat-supply agreements and project-level tariff assumptions.
    relatedQuestionRefs:
    - QP020
    relatedTableRefs:
    - TP003
  - type: conflicting-data
    severity: material
    topic: geretsried-repeatability
    missingEvidence: Independent loop-by-loop net output, remediation status, and remaining capital required at Geretsried.
    whyItMatters: Moat durability and commercial readiness hinge on repeatability, not a single company-written milestone statement.
    diligencePath: Obtain operator-level performance data and financing update from Eavor, OMV, and the project company.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: minor
    topic: peer-lcoe
    missingEvidence: A like-for-like public LCOE comparison across Eavor, Fervo, Sage, Quaise, and Ormat.
    whyItMatters: Without a comparable cost basis, capability comparison can overstate the commercial significance of technical novelty.
    diligencePath: Build a project-normalized benchmark from investor decks, utility filings, and project-finance memos when available.
    relatedQuestionRefs:
    - QP020
    relatedTableRefs:
    - TP003
