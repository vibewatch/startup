- id: section-4
  title: Switching cost, lock-in, distribution power and supply access
  body: 'The buyer-facing moat in geothermal is not just drilling IP. Real switching cost sits in heat-network interconnection, power-purchase structures, permitting, operating know-how, and who owns the customer conversation. On that dimension Eavor is still building. Its OMV and Chubu relationships are valuable because they substitute for missing direct distribution. But they also reveal a dependence on partner-led commercialization. Ormat’s long-duration PPAs illustrate the stronger incumbent position: it already converts geothermal reliability into contractual cash flow. Fervo is also ahead on visible commercial proof because Google publicly described the Nevada project as operational. Eavor may eventually own valuable data and delivery lessons, but today its distribution power is softer and more relationship-driven than the incumbent benchmark.'
  claimRefs:
  - CP008
  - CP015
  - CP023
  - CP024
  - CP032
  - CP033
  tableRefs:
  - TP004
  figureRefs:
  - FP003
- id: section-5
  title: Moat durability, displacement risk and adverse competitor evidence
  body: Adverse 2026 evidence matters because it tests whether Eavor’s moat is durable or just technically interesting. CleanTechnica and Geothermal Canada both argue that Geretsried’s current output, incomplete loop count, and operator pivot weaken the narrative that Eavor has already proven a repeatable commercial energy system. Those sources also imply that thermosiphon, ORC equipment, and directional drilling are not standalone moats when competitors can buy similar surface hardware and contract similar subsurface services. Eavor still has potentially valuable scar tissue, design data, Rock-Pipe know-how, and strategic relationships, so the moat is not zero. But the strongest displacement risks now come from Fervo if its project-delivery curve keeps improving and from incumbents such as Ormat if advanced-geothermal buyers decide proven contracts matter more than novel architecture. Near-term commoditization remains limited only because so few companies have any commercial advanced-geothermal
    reference asset at all.
  claimRefs:
  - CP025
