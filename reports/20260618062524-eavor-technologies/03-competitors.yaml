- id: section-2
  title: 'Profiles: scale, funding, market wedge and strategic direction'
  body: 'Eavor remains well funded relative to many geothermal startups, but its funding advantage is no longer unique in a market where Fervo has raised a substantially larger late-stage round for Cape Station. Eavor’s own commercial direction is still heat-plus-power through a closed-loop radiator model, helped by OMV and Chubu relationships that matter for European and Japanese deployment. Fervo is scaling a classic project-development story around Cape Station and Nevada with an explicit 24/7 clean-power pitch. Sage targets a different buyer problem by combining geothermal with long-duration storage and defense/data-center applications. Quaise is more of an option on future superhot geothermal than a 2026 bankable operating rival. Ormat is strategically different again: its value lies in operating fleets, contracted revenue, and a vertically integrated product-plus-power model that Eavor does not yet match.'
