- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Closed-loop IP and Rock-Pipe know-how
    - Competing geothermal models route around Eavor architecture
    - High
    - Request independent evidence on repeatable loop completion and long-run output.
  - - Partner-led access via OMV and Chubu
    - Distribution still depends on partners, not owned customer lock-in
    - Medium
    - Test whether licensing converts into exclusive customer channels or only soft introductions.
  - - Commercial first-mover narrative
    - Geretsried underperformance weakens reference-plant value
    - High
    - Get loop-by-loop net output, remediation plan, and capital required for completion.
  - - Oil-and-gas-style execution capability
    - Fervo and other drill-heavy rivals use similar supply chains
    - Medium
    - Separate unique Eavor data/chemistry from generic service-provider capabilities.
  - - Geology independence promise
    - Conventional geothermal and incumbents may remain cheaper where reservoirs are already proven
    - Medium
    - Model where Eavor beats Ormat-style conventional projects on delivered heat or power economics.
  - - Scarcity of advanced-geothermal reference plants
    - Commoditization risk stays low only until one rival proves stronger economics at scale
    - Medium
    - Track Fervo, Sage, and incumbent advanced-geothermal partnerships over the next 24 months.
  notes: Risk severity reflects competitive durability, not climate value. The adverse evidence in 2026 shifts diligence toward output repeatability and operator economics.
