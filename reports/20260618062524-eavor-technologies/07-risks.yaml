  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "Eavor’s current risk profile is dominated by incomplete commercial proof at Geretsried, an operator pivot that externalizes completion risk, and a capital stack still dependent on milestone-based public and partner funding. Official milestones show real financing depth and first-power progress, but independent and adverse sources indicate the full loop field, steady net output, and repeatable project economics remain unresolved, making execution and financing the most important near-term thesis-break variables."
  },
  "sections": [
    {
      "id": "regulatory-and-technical-positioning",
      "title": "Regulatory Posture and Core Technical Risk",
      "body": "Eavor’s core pitch is that a sealed closed-loop geothermal architecture sidesteps many of the hardest regulatory and geological constraints attached to hydrothermal and stimulation-heavy geothermal systems. The company repeatedly says the system avoids fracking, produced brine, aquifer dependence, and induced seismicity, and both trade coverage and European public-finance materials repeat that framing. That positioning matters because it is the basis for why investors and public-funding bodies were willing to support Geretsried as a first commercial-scale project. Historical permitting was not frictionless either: local approval for a larger Geretsried drilling pad came only after earlier wells disappointed, which shows that even a low-seismicity design still inherits site-specific execution and permitting risk. However, reduced category risk does not eliminate project risk. The legal and technical question is no longer whether the concept can be described as low-seismicity or low-water-use; it is whether the built system can deliver durable heat and power at the scale and cost implied by the financing package. Recent patent grants strengthen Eavor’s claim that parts of the wellbore synthesis and Rock-Pipe process are proprietary, but a licensing business only becomes defensible if the underlying system is also commercially repeatable. In other words, the technology story is plausible, but the residual risk sits in translation from laboratory and pilot logic to bankable field performance.",
