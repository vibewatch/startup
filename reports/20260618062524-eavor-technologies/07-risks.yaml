    {
      "id": "partner-capital-and-organization",
      "title": "Partner, Capital, and Organizational Dependency",
      "body": "Eavor’s financing history shows unusually strong strategic support for a geothermal startup, but it also highlights dependence on counterparties whose incentives are not fully aligned with minority investors. OMV’s stake and preferred licensing rights, Chubu’s role in the project company, the export-credit-supported debt stack, and Canada Growth Fund’s milestone-based capital all help explain why Geretsried reached this stage. They also mean that commercialization is not controlled by Eavor alone. The operator transition is the clearest example: in 2026 the company publicly repositioned itself as a technology provider and started searching for a replacement operator while also reducing headcount sharply. That move may simplify Eavor’s business model, but it simultaneously transfers the most operationally difficult work to a party not yet identified publicly. The counterparty problem also extends beyond the plant fence line: Geretsried’s municipality and local heat-network vehicle are already publicly tying infrastructure rollout to phased geothermal delivery, so delays now carry coordination and reputational risk for local offtake partners as well. Financing concentration matters too. Eavor still depends on project debt, grants, strategic investors, and conditional public capital rather than internally generated cash flow. If any of those counterparties become more cautious after the mixed Geretsried signal, the company could be forced into slower buildout, more expensive capital, or a narrower licensing strategy before a strong reference plant exists.",
