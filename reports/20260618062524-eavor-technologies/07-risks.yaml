    {
      "id": "mitigations-and-kill-criteria",
      "title": "Mitigations, Monitoring, and Kill Criteria",
      "body": "There are meaningful mitigations in the record, and they should not be ignored. Eavor has substantial partner validation, a large public-finance package, recent patent issuance, independent confirmation that first power occurred, and credible evidence of drilling productivity improvement. Those factors mean the risk case is not binary fraud-versus-success; it is a timing and bankability problem around how much additional capital, engineering, and partner support are required to turn a partial first-of-a-kind asset into a repeatable commercial template. The most useful monitoring indicators are straightforward and observable: net output rather than gross milestone language, the number of loops actively contributing flow, whether a successor operator is named and funded, whether the project company publishes a reconciled timeline for full completion, and whether additional capital arrives on terms that preserve rather than subordinate the equity story. The main thesis-break events are also clear. If Eavor cannot secure a replacement operator, cannot fund the remaining completion work, or cannot show sustained positive net delivery from the current loop field, then the licensing-led commercialization narrative weakens materially. Conversely, if it restores stable net output and closes the operator-and-funding gaps, the residual risk premium should compress meaningfully.",
