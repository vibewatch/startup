    {
      "id": "geretsried-execution-and-performance",
      "title": "Geretsried Execution and Performance Risk",
      "body": "Geretsried remains the decisive evidence node for Eavor. Official sources can legitimately point to first electricity, partial commercial operation, large-scale drilling, and clear learning-curve gains. Yet the same public record shows that the asset is still not complete relative to the originally described commercial geometry. The most material adverse data point is the May 2026 GEO ExPro interview, which reported that only one injector-producer pair with six loops had been completed, that only three to four loops were contributing meaningful flow, and that current gross output was roughly 0.5 to 1.0 MWe while the plant itself consumes around 0.5 MWe. Those disclosures do not prove the concept fails permanently, but they do show that Eavor has not yet produced a clean, externally validated reference case for the full planned loop field. The result is a classic FOAK risk stack: mechanical remediation risk, budget-to-complete uncertainty, delayed proof of net economics, and the possibility that the most favorable lessons learned still require deeper and hotter future projects before the model becomes repeatable. Investors should therefore treat official milestone announcements as real progress, but not as a substitute for sustained operating evidence. The external record also shows that first-power expectations slipped from a 1H 2025 target into a late-2025 startup still conditioned on commissioning and approvals, which is consistent with a project that remains operationally fragile rather than fully de-risked.",
