  foundingLocation: Calgary, Alberta, Canada
  headquarters: Calgary, Alberta, Canada
  productSummary: >-
    Eavor sells the Eavor-Loop, a closed-loop geothermal heat-and-power system formed by two
    vertical wells connected by multilateral laterals, with a contained working fluid circulating
    by thermosiphon to deliver direct heat or electricity while avoiding fracking and hydrothermal
    reservoir dependence.
  customerFocus: >-
    District-heating networks, utilities, industrial heat users, and strategic energy partners
    seeking clean firm heat and power; near-term commercialization is concentrated in European
    reference projects and licensing-led expansion.
  businessModel: >-
    Commercialization is shifting from sole project ownership toward technology licensing,
    strategic development partnerships, and project-level deployment where Eavor's drilling,
    design, and completion know-how can be monetized through follow-on projects.
  stage: "Late-stage private commercialization"
  fundingStatus: >-
