  evidenceGaps:
  - type: missing-source
    severity: material
    topic: undisclosed-metrics
    missingEvidence: A primary source that discloses valuation, revenue, customer count, and current consolidated headcount.
    whyItMatters: Those metrics are required for a clean snapshot of scale and capital efficiency and materially affect later valuation work.
    diligencePath: Request the latest board deck, financing memo, or management KPI pack and reconcile it to public financing announcements.
    relatedQuestionRefs:
    - QO024
    - QO025
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: leadership-transition
    missingEvidence: A company or board source explaining the timing, scope, and rationale of the CEO transition from Redfern to Fitzgerald and the current board roster.
    whyItMatters: Key-person and governance diligence depends on understanding whether the leadership change reflects succession planning, role separation, or a response to project execution.
    diligencePath: Request an executive-org chart, board list, and the announcement or board resolution covering the CEO transition.
    relatedQuestionRefs:
    - QO007
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: material
    topic: cap-table-rights
    missingEvidence: A current capitalization table showing exact investor ownership, board rights, and any performance-linked rights in the OMV, CGF, and project-finance packages.
    whyItMatters: The investor map can name public stakeholders, but not their exact control, dilution, or downside-protection rights.
    diligencePath: Request the latest cap table, shareholders agreement summary, and key financing term sheets.
    relatedQuestionRefs:
    - QO010
    - QO011
    - QO013
    - QO014
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-precision
    missingEvidence: Exact close dates, euro/CAD/USD currency treatment, and final drawdown status for each 2023–2025 financing step and each follow-on German project milestone.
    whyItMatters: The public chronology is directionally clear, but several amounts are reported at different aggregation levels and some follow-on milestones are described without exact dates.
    diligencePath: Request a financing timeline from finance plus the latest Geretsried and Hanover project schedules.
    relatedQuestionRefs:
    - QO012
    - QO015
    - QO016
    relatedTableRefs:
    - TO004
  - type: conflicting-data
    severity: material
    topic: Geretsried-commercial-readiness
    missingEvidence: Independent operating data on net electrical output, parasitic load, sustained heat delivery, and second-loop economics at Geretsried.
    whyItMatters: Company materials emphasize proof of concept and learning-curve progress, while adverse commentary argues the economics remain unresolved.
    diligencePath: Request plant operating reports, offtake data, and a third-party engineering review before underwriting licensing or project-scale assumptions.
