- id: commercial-milestones-and-german-buildout
  title: Commercial Milestones and German Buildout
  body: 'The decisive milestone sequence runs through Germany. Eavor spent 2023 turning Geretsried from a concept into a first commercial-scale field campaign, while also bringing Chubu into the project company and signing a Hanover heat purchase agreement with enercity. Independent and official sources agree that Geretsried sits on a previously unsuccessful conventional geothermal site, making it a high-visibility test of Eavor’s claim that closed-loop systems can work in hot-but-dry geology. By December 2025, Eavor delivered first electricity to the German grid. By March 2026, Bavarian geothermal observers were reporting that the first of four planned loops was operating. At the same time, Eavor’s own May 2026 technical update clarified that Loop #1 stopped after six lateral pairs instead of the originally planned twelve because hydraulic communication problems changed the execution model and raised cost. That combination—clear technical progress and incomplete original scope—is the core
    milestone pattern later chapters should treat as ground truth.'
