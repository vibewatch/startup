- id: adverse-readthrough-and-disclosure-gaps
  title: Adverse Readthrough and Disclosure Gaps
  body: 'Eavor’s strongest public story is that Geretsried proved the core technology and created a base for licensing. The strongest adverse readthrough is that the project is still too incomplete and too expensive to support a full-scale commercial template. CleanTechnica’s 2026 critiques argue that early electrical output remained far below the original Phase 1 ambition and that the pivot toward licensing looks more like a move away from project-risk ownership than a triumphant handoff of a finished reference plant. Those articles are interpretive, not dispositive, but they matter because they attack the commercial, not just technical, thesis. Just as important, public disclosure remains thin on the core metrics an investor would need next: valuation, revenue, customer count, exact investor control, and a formal explanation of the CEO transition. The result is a company with unusually rich project-level storytelling but still limited top-level financial transparency.'
