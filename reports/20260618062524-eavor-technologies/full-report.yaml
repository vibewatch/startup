      - number: '5.2'
        title: Architecture, thermosiphon physics, and critical drilling tools
        blocks:
          - type: paragraph
            body: >-
              The technology stack is specific enough to diligence as a real architecture rather than a marketing
              diagram. At the bottom is hot rock; the loop draws heat from it by conduction, not by producing formation
              fluids. Inside that rock sits a sealed multilateral well system whose working fluid is isolated from the
              surrounding formation. Eavor argues that this design reduces water handling and avoids the
              induced-seismicity profile associated with permeability-creation strategies. The thermosiphon claim is
              important because it underpins the low-parasitic-load story: if density differences can drive circulation,
              the plant avoids some pump and maintenance burden borne by other geothermal designs. The drilling stack is
              equally central. Geretsried required long connected laterals, active magnetic ranging to keep wells
              aligned until intersection, and Rock-Pipe-style wellbore isolation to make the closed loop viable. The
              architecture is therefore only as strong as its drilling execution, because the physics, surface plant,
              and economic case all depend on precise, repeatable multilateral completion.
            claimRefs:
