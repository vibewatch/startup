  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: heat-first infrastructure, not generic geothermal TAM'
        blocks:
          - type: paragraph
            body: >-
              Eavor’s market should be bounded around the job its public evidence actually supports: delivering
              dispatchable geothermal heat and power through specific projects and partner-led deployments. The heat
              side is especially concrete. Geretsried is tied to a local heat offtake, Hannover is framed as a
              district-heating project, and Eavor Deutschland explicitly markets the system into district-heating and
              industrial settings in Germany. That means included spend is municipal heat decarbonization, industrial
              and commercial direct heat, firm power where long-term offtakers will pay for reliability, and development
              or licensing contracts tied to those projects. Excluded spend should stay excluded: shallow geo-exchange
              heat pumps, conventional hydrothermal-only projects that depend on natural aquifers, and broad
              renewable-energy budgets that are not buying geothermal attributes. The result is a narrower but more
              defensible market frame than “all geothermal everywhere,” and it makes the status-quo
              substitutes—district-heat retrofits, conventional geothermal, and other firm-power options—visible from
              the start.
