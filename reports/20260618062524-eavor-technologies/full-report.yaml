  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, adjacents, incumbents and substitutes'
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set around Eavor is much broader than "other closed-loop startups." Direct
              advanced-geothermal peers include Fervo, Sage Geosystems, Quaise, and GreenFire-style retrofit systems,
              but the most important substitute in underwriting terms is the mature geothermal incumbent that already
              sells dependable heat and power under bankable contracts. Fervo is the clearest direct execution benchmark
              because it already pairs oil-and-gas-style drilling with large, named projects and hyperscaler-linked
              commercial traction. Sage competes differently by emphasizing pressure-geothermal storage plus power,
              while Quaise competes on a deeper-and-hotter superhot-geothermal thesis that is earlier in
              commercialization. Ormat represents the incumbent benchmark: real megawatts, long-term PPAs, and operating
              fleets. The landscape therefore spans direct peers, adjacent experimental models, mature geothermal
              operators, and the broader clean-firm-power status quo.
