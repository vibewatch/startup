          - type: paragraph
            body: >-
              Eavor’s core pitch is that a sealed closed-loop geothermal architecture sidesteps many of the hardest
              regulatory and geological constraints attached to hydrothermal and stimulation-heavy geothermal systems.
              The company repeatedly says the system avoids fracking, produced brine, aquifer dependence, and induced
              seismicity, and both trade coverage and European public-finance materials repeat that framing. That
              positioning matters because it is the basis for why investors and public-funding bodies were willing to
              support Geretsried as a first commercial-scale project. Historical permitting was not frictionless either:
              local approval for a larger Geretsried drilling pad came only after earlier wells disappointed, which
              shows that even a low-seismicity design still inherits site-specific execution and permitting risk.
              However, reduced category risk does not eliminate project risk. The legal and technical question is no
              longer whether the concept can be described as low-seismicity or low-water-use; it is whether the built
              system can deliver durable heat and power at the scale and cost implied by the financing package. Recent
              patent grants strengthen Eavor’s claim that parts of the wellbore synthesis and Rock-Pipe process are
              proprietary, but a licensing business only becomes defensible if the underlying system is also
              commercially repeatable. In other words, the technology story is plausible, but the residual risk sits in
              translation from laboratory and pilot logic to bankable field performance.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR020
              - CR025
              - CR026
              - CR037
