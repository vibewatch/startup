chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Eavor Technologies is publicly positioned as a Calgary-based, privately held geothermal technology company
              founded in Canada in 2017. The company markets Eavor-Loop as a closed-loop geothermal system that
              circulates a contained working fluid through multilateral wellbores to harvest heat by conduction rather
              than by producing subsurface fluids. Across its corporate website, technology materials, and 2026 press
              releases, Eavor repeatedly frames the product as dispatchable, scalable, and suitable for both heat and
              power applications. The operating model is no longer just “build a flagship project and prove the
              concept.” By May 2026, Eavor’s own technical update said the business is moving into large-scale
              commercialization as a technology licensor, which matters because it shifts the diligence lens from
              project ownership toward intellectual property, partner execution, and proof that the reference project
              can support broader adoption.
