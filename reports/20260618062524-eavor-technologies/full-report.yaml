              - CM032
          - type: callout
            title: Public SAM/SOM precision is still blocked
            body: >-
              Without realized tariffs, loop-level commercial output history, and a reconciled project schedule, public
              market sizing can only stay multi-lens and evidence-constrained.
            calloutType: risk
            claimRefs:
