  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Current post-money valuation
        - No disclosed pricing for recent rounds
        - Without it, all valuation work remains a range rather than a mark
        - Request board deck, closing docs, or verified secondary data.
      - - CGF financing terms
        - Discount, cap, maturity, and step-in rights undisclosed
        - These terms directly affect dilution and downside protection
        - Obtain executed financing documents and counsel review.
      - - Budget-to-complete Geretsried
        - No reconciled cost-to-complete or funded completion plan
        - Completion capex changes valuation and financing need immediately
        - Review lender model and independent engineer package.
      - - Liquidation preferences / governance rights
        - No public cap-table seniority information
        - Nominal valuation is meaningless without understanding who gets paid first
        - Run full legal diligence before underwriting entry price.
      - - Independent operating data
        - No third-party certified net-output and heat-delivery history
        - Commercial proof quality determines whether Eavor deserves platform versus project valuation logic
        - Request historian data and third-party engineer sign-off.
    notes: >-
      These are the highest-value diligence asks because each one can move the recommendation without requiring more
      market storytelling.
    claimRefs:
      - CV018
      - CV021
      - CV027
      - CV028
      - CV031
      - CV038
