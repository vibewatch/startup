      - number: '3.4'
        title: Switching cost, lock-in, distribution power and supply access
        blocks:
          - type: paragraph
            body: >-
              The buyer-facing moat in geothermal is not just drilling IP. Real switching cost sits in heat-network
              interconnection, power-purchase structures, permitting, operating know-how, and who owns the customer
              conversation. On that dimension Eavor is still building. Its OMV and Chubu relationships are valuable
