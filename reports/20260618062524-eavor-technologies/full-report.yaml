      - number: '3.3'
        title: Capability comparison and pricing evidence
        blocks:
          - type: paragraph
            body: >-
              Capability comparison can be grounded in public evidence, but pricing comparison cannot. Eavor can point
              to a first closed-loop commercial milestone, Geretsried drilling-performance gains, Rock-Pipe cost
              reduction claims, and partner-led licensing rights. Fervo can point to horizontal drilling, fiber-optic
              sensing, a working Google-linked project, and a large named Utah project. Sage can point to public
              storage-and-power positioning, while Quaise can point to a clearly differentiated superhot drilling
              thesis. Ormat’s capabilities are the least speculative because they show up in operating plants, PPAs, and
              portfolio scale. By contrast, no reviewed source discloses realized public customer pricing across the
              next-generation peer set, which means the pricing table is necessarily about contract model transparency
              and revenue maturity rather than apples-to-apples list prices.
