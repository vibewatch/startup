      - number: '8.3'
        title: Scenario Analysis and Comparable Framework
        blocks:
          - type: paragraph
            body: >-
              Direct private comparables for Eavor are weak, so the right methodology is triangulation. Public
              geothermal companies such as Ormat are useful not because their revenue multiples can be copied directly,
              but because they show how much value markets can place on proven geothermal cash flows, governance, and
              operating scale. Ormat’s 2025 revenue base near one billion dollars and market capitalization around $7.75
              billion show the magnitude of value that proven geothermal execution can support, but they simultaneously
              highlight how far Eavor remains from that maturity. A practical bull/base/bear framework is therefore
              better. The bull case assumes Geretsried becomes a credible reference plant, licensing or follow-on
              deployments materialize, and strategic buyers pay a scarcity premium for dispatchable geothermal IP and
              market access. The base case assumes Eavor remains strategically valuable but still partially de-risked,
              producing a valuation that is respectable yet not fully platform-grade. The bear case assumes operator
              transition drags, completion capex rises, and new capital arrives on terms that subordinate common equity
              to a greater degree than the current public story implies. Under each scenario, comparables are there to
              bound the narrative rather than settle it.
            claimRefs:
              - CV012
              - CV014
              - CV015
              - CV016
              - CV020
              - CV022
