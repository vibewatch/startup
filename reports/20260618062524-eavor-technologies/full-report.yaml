        title: Exhibits
        blocks:
          - type: callout
            title: The heat market is more legible than the power market
            body: >-
              The strongest public evidence is not a generic global power TAM; it is German and European heat
              infrastructure, offtake, and planning workflows that make district heat the clearer first wedge.
            calloutType: insight
            claimRefs:
              - CM012
