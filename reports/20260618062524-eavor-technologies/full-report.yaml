    title: Risk Heatmap for the Current Eavor Investment Case
    type: matrix
    layout: wide
    summary: >-
      The highest residual risk sits in completion, net output, and partner-dependent financing rather than
      category-level geothermal demand.
    data:
      columns:
        - Likelihood
        - Residual severity
        - Primary driver
        - What would reduce it
      rows:
