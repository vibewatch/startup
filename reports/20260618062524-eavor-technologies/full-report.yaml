            body: >-
              The public moat story is credible but incomplete. Eavor has patentable wellbore and fluid-management
              techniques, technical conference output, hiring activity, and Germany-specific project-news surfaces that
              together show a living engineering organization rather than a static climate narrative. Rock-Pipe, AMR,
              long connected laterals, and the growing data set from Geretsried all likely compound into know-how that
              is harder to copy than any single patent claim. Yet the same source set shows why investors should resist
              overstating the moat. Public reliability data, fleet-style uptime disclosure, and fully transparent loop
              economics are still absent, and the company's own 2026 messaging acknowledges that Geretsried is a
              learning platform for deeper and more powerful next-generation loops. The roadmap therefore points to a
