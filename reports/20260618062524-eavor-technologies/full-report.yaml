      - number: '2.3'
        title: Buyer, user, payer, and adoption workflow
        blocks:
          - type: paragraph
            body: >-
              On the heat side, the end users are households and businesses connected to district-heating networks, but
              they are not the infrastructure buyers. The practical buyers are municipal utilities, project companies,
              and public or quasi-public heat-system operators, while the gating institutions are heat planners, utility
              executives, banks, and public funders. That explains why the adoption path is slower than a simple
              technology sale: a project has to survive heat planning, siting, permitting, anchor-offtake negotiation,
              project finance, and only then construction. On the power side, the likely payer set is different:
              utilities and large corporates that value firm, clean electricity under long-term contracts. Google,
              Microsoft, and Nucor’s demand-aggregation initiative matters here because it signals a buyer class willing
              to pull early projects forward. OMV and Chubu matter as channels because they turn Eavor from a pure
              developer into a partner-led route into Europe and Japan.
