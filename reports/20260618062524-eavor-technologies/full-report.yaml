companyProfile:
  summary: >-
    Eavor Technologies is a Calgary-based geothermal company founded in 2017 that developed the Eavor-Loop, a
    closed-loop geothermal system using multilateral wellbores and a contained working fluid to harvest heat from rock
    via conduction rather than conventional hydrothermal production. The company raised C$239 million in 2023, added
    follow-on support from Canada Growth Fund in 2025, and assembled a large project-level debt and grant package around
    its Geretsried, Germany reference project. As of June 2026, Eavor has achieved first grid electricity at Geretsried
    and is increasingly framing commercialization around technology licensing, but it still does not publicly disclose
    current valuation, revenue, customer count, or a full explanation of the leadership transition from John Redfern to
    Mark Fitzgerald.
