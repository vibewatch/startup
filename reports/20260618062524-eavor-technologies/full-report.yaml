  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Eavor is not selling a software feature or a generic geothermal claim; it is selling a delivered energy
              outcome. The retained sources consistently frame the product as a closed-loop geothermal plant that can
              provide district heat, electricity, or both, using a sealed subsurface radiator rather than a produced
              hydrothermal reservoir. In the customer workflow, a municipality or utility first commits to a heat or
              power offtake, then Eavor drills and connects the loop, commissions the ORC and district-heating
              interfaces, and finally exports heat and electricity into local infrastructure. Geretsried matters because
              it moves this workflow from concept to a visible public reference project: the site has a municipal heat
              contract, a completed ORC plant, and first electricity exported to the German grid. That combination is
              materially stronger than a lab pilot, but it is still concentrated in one flagship site rather than a
              diversified installed base. The workflow therefore proves product intent and partial delivery, while
              leaving the long-run operating and replication questions open.
            claimRefs:
