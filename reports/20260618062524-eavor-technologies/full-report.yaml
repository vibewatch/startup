      - number: '8.2'
        title: Financing Context and Observable Valuation Anchors
        blocks:
          - type: paragraph
            body: >-
              Eavor has accumulated enough visible capital to rule out a trivial valuation, but not enough disclosure to
              justify a clean premium mark. The 2023 funding record, OMV’s disclosed stake purchase, and the 2025 Canada
              Growth Fund commitment together indicate that sophisticated counterparties were willing to fund the
              platform well before full commercial proof existed. OMV’s stake purchase provides a rough 2023 valuation
              proxy in the high-hundreds-of-millions range, while the newer CGF support suggests public capital still
              sees strategic value in pushing the company through commercialization. Geretsried’s debt-and-grant package
              also matters for valuation because it demonstrates that third-party capital has already been marshalled
              around a large real asset. Yet these observable anchors should not be confused with a clean fair-value
              mark for common equity. The public record still lacks the current post-money, the preference stack, the
              exact CGF instrument terms, and a reconciled cost-to-complete. That means any current valuation must be
              framed as a range built from anchors and scenarios, not a single number.
            claimRefs:
              - CV001
              - CV002
              - CV003
