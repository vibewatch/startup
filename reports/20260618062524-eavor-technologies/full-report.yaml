      - number: '2.5'
        title: Constraints, contradictions, and what still blocks a hard SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              The constraints are still material. IEA says drilling-heavy geothermal remains capex-intensive, and the
              category still sits in a financing “missing middle.” Geretsried also injects project-specific skepticism
              into every bullish market claim. Public sources conflict on operation timing, and adverse 2026 analyses
              argue current electrical output is far below original targets, with only one loop operating and economic
              evaluation still ongoing. Those critiques do not erase the market, but they do change its shape. They
              imply that district heat may commercialize earlier than power-only projects, that Eavor’s route to market
              may shift toward licensing or partner-led execution, and that buyers will demand de-risking before
              adopting critical infrastructure. Most importantly, no retained public source discloses realized heat
              tariffs, power prices, or licensing fees. Without those numbers, the right conclusion is not that the
              market is tiny; it is that public evidence supports a constrained, multi-lens market view but not a
              precise public SAM or SOM.
            claimRefs:
              - CM009
              - CM018
              - CM019
              - CM020
              - CM021
