      - number: '8.4'
        title: Entry Discipline, Kill Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The highest-value diligence work now is not another broad market memo; it is capital-structure and
              operating-proof work. Before a new investor underwrites any price-sensitive recommendation, four things
              matter most: current post-money valuation, conversion terms on the CGF instrument, budget-to-complete for
              full commercial scope, and liquidation preferences or governance rights sitting ahead of fresh capital.
              Without those, even a seemingly attractive headline valuation can mask poor minority economics. The key
              kill triggers are also practical rather than theoretical. If Eavor cannot name and fund a successor
              operator, cannot reconcile first-power publicity with full completion timing, or cannot show stronger net
              operating data, then the discount rate should rise and the valuation range should fall toward asset-backed
              logic. If it can close those gaps, publish clearer economics, and turn Geretsried into a repeatable
              licensing template, then today’s research-more recommendation could legitimately migrate toward a
              directional buy in a later refresh. For now, entry discipline means insisting on proof before paying for
              the most optimistic story.
            claimRefs:
              - CV013
