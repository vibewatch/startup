      - number: '1.3'
        title: Capitalization, Investor Base, and Project-Finance Stack
        blocks:
          - type: paragraph
            body: >-
              Eavor’s capitalization story is anchored by strategic energy partners and public-sector commercialization
              capital rather than by disclosed operating metrics. OMV’s June 2023 investment brought €34 million for a
              6.5% equity stake plus preferred licensing and development rights in several European markets, and it
              effectively kicked off the company’s Series B raise. Public sources then diverge on the exact round total:
              Eavor’s own 2023 retrospective says the Series B closed at C$180 million and that total 2023 capital
              reached C$239 million after conversions and additional issuance, while ThinkGeoEnergy reported a C$182
              million equity round. The follow-on capital came from CGF, which first committed C$90 million in 2023 and
              then added up to about C$138 million more in 2025. At the project level, Geretsried also layered in a
              €91.6 million Innovation Fund grant plus an approximately €130 million debt package led by EIB, JBIC, ING,
              and Mizuho. The result is a deep but structurally complex investor and lender stack whose economic rights
              remain mostly undisclosed.
