        title: Partner proof, financing, and operating dependencies
        blocks:
          - type: paragraph
            body: >-
              Eavor's technology is not independent of partners; it is best understood as a system that sits on top of
              drilling, financing, regulatory, and local-infrastructure dependencies. SLB provides third-party proof
              that advanced ranging and drilling services worked in Germany. Chubu and OMV publicly describe themselves
              as project partners, and the European Commission press release makes clear that Geretsried required a
              layered financing package rather than simple venture equity. That matters because it shows the technology
              has already had to clear lender, public-finance, and industrial-partner scrutiny to leave the prototype
              stage. At the same time, those same dependencies create concentration risk. Municipal heat infrastructure,
              ORC commissioning, grid interconnection, project finance, and partner know-how are all critical path
              items. If any one of them lags, the product cannot monetize its thermosiphon and conduction advantages.
              The dependency map therefore reinforces both the strength of the proof set and the fragility of the
