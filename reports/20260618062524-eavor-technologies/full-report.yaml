        - Access to sufficiently hot rock and drilling depth
        - Bad site characterization or lower-than-modeled heat transfer
      - - Closed-loop working fluid circuit
        - Moves heat in a sealed system
        - Wellbore integrity and thermosiphon behavior
        - Leaks, flow losses, or parasitic-load creep
      - - Multilateral well network
        - Creates long surface area for heat exchange
        - Accurate drilling and intersection of laterals
        - Incomplete lateral completion or weak flow contribution
      - - Eavor-Link AMR
        - Supports parallel drilling and intersection accuracy
        - Magnetic ranging hardware and subsurface telemetry
        - Misalignment would increase rig time and threaten loop closure
      - - Surface ORC power island
        - Converts heat to electricity
        - Commissioning, grid tie, and working-fluid handling
        - Surface-plant delays can bottleneck monetization
      - - District-heating export infrastructure
        - Moves heat from plant to users
        - Municipal utility build-out and approvals
        - Heat revenue can lag loop readiness
    notes: >-
      This table separates the loop physics from the commercialization dependencies. Most visible risks arise at the
      interfaces between drilling, loop integrity, and export infrastructure.
    claimRefs:
      - CE002
      - CE005
      - CE015
      - CE016
      - CE032
      - CE033
