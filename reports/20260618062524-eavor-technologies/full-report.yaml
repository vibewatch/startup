          - type: paragraph
            body: >-
              The founder set visible in reviewed public sources is John Redfern, Paul Cairns, and Jeanine Vany. Public
              2025–2026 materials also make clear that Eavor’s top leadership changed during the last year of
              commercialization. CGF-related June 2025 materials still name Redfern as co-founder and CEO, while the
              December 2025 first-electricity announcement and June 2026 TIME release identify Mark Fitzgerald as
              President and CEO. Matt Toews appears in 2026 as co-founder and chief technology and operating officer,
              while Vany remains a visible co-founder and corporate-affairs executive in outside reporting.
              Germany-specific materials add Daniel Mölk and Marco Becker as public operating leaders for the local
              subsidiary. The unresolved issue is governance transparency: none of the reviewed public materials
              explains the CEO transition, names the full board, or discloses decision rights among the strategic
              investors who helped finance the move from pilot to commercialization.
