  "chapter": {
    "number": 8,
    "title": "Valuation",
    "summary": "Public evidence supports a sizeable strategic and asset-backed valuation floor for Eavor, but it does not support a precise premium late-stage mark today. The most defensible current stance is research-more with medium confidence: there is too much strategic validation and capital already committed to call the company unattractive outright, yet too little disclosed operating and financing detail to underwrite a clean buy before Geretsried completion, operator transition, and capital-stack terms are clarified."
  },
  "sections": [
    {
      "id": "thesis-and-call",
      "title": "Investment Thesis, Anti-Thesis, and Recommendation",
      "body": "Eavor’s bull case is easy to state. It occupies a scarce part of the energy transition stack: dispatchable geothermal with strategic backing, public-finance support, and a real if imperfect commercial demonstration site. That scarcity matters because large industrial, utility, and data-center buyers increasingly want clean firm power rather than intermittent-only supply. The company also has visible partner validation from OMV, Chubu, Canada Growth Fund, and Microsoft-linked ecosystem activity, plus a widening package of granted intellectual property. If Geretsried becomes a repeatable template rather than a one-off rescue story, Eavor could command platform-style valuation logic that exceeds simple project-asset accounting. The anti-thesis is equally strong. Public evidence still does not show a fully completed, strongly net-positive commercial asset, does not disclose a current post-money valuation, and does not reveal the seniority or dilution terms that matter most to a new investor. The May 2026 operator pivot turned technical ambiguity into financing ambiguity. For that reason, the best current recommendation is research-more rather than buy or avoid. There is too much real progress to dismiss the company, but not enough disclosed economic proof to force false precision on fair value.",
