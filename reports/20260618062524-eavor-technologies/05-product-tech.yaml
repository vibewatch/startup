- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow / pain point
  - Eavor solution
  - Measurable benefit claimed publicly
  - Known limitation
  rows:
  - - Municipal heat decarbonization
    - Gas boilers and conventional district-heating fuels expose cities to carbon and fuel-price risk
    - Closed-loop geothermal heat sold into a municipal network
    - Local low-carbon baseload heat with stepwise expansion to regional users
    - Network build-out and drilling progress both gate monetization
  - - Dispatchable clean electricity
    - Firm clean power is hard to source from intermittent renewables alone
    - On-site ORC converts loop heat into grid power
    - First commercial closed-loop electricity exported to the German grid
    - Steady-state output versus design is not yet fully disclosed
  - - Hot-but-dry geothermal resource use
    - Conventional geothermal fails where permeability or water is missing
    - Conduction-based closed loop in hot rock
    - Potential to use geology previously unusable for hydrothermal production
    - Requires precise multilateral drilling and intersection at scale
  - - Future project licensing
    - Buyers want repeatable project templates instead of one-off geothermal experiments
    - Geretsried as reference plant plus licensor model
    - Learning-curve data and partner proof support replication story
    - Commercial terms for licensing are still private
  - - Public-sector energy security
    - Cities seek 24/7 local supply with lower imported-fuel dependence
    - Loop can deliver heat and power from one site
    - Baseload-capable local energy and lower water handling needs
    - Project finance and partner ecosystem remain heavy dependencies
  notes: Benefits are the public claims attached to Geretsried and to Eavor-Loop generally. Rows distinguish real workflow value from still-undisclosed commercial metrics.
