company:
  name: Eavor Technologies
chapter:
  number: 5
  title: Product & Technology
  summary: Eavor's product is a closed-loop geothermal system that sells district heat and electricity through a conduction-based subsurface loop, thermosiphon circulation, and a surface ORC power island. Geretsried now proves grid export and loop connectivity, but the same 2026 evidence set also shows that first-of-a-kind drilling complexity, incomplete lateral execution, and limited long-run performance disclosure still separate the reference plant from a broadly repeatable commercial product.
sections:
- id: product-definition
  title: Product definition and customer workflow
  body: 'Eavor is not selling a software feature or a generic geothermal claim; it is selling a delivered energy outcome. The retained sources consistently frame the product as a closed-loop geothermal plant that can provide district heat, electricity, or both, using a sealed subsurface radiator rather than a produced hydrothermal reservoir. In the customer workflow, a municipality or utility first commits to a heat or power offtake, then Eavor drills and connects the loop, commissions the ORC and district-heating interfaces, and finally exports heat and electricity into local infrastructure. Geretsried matters because it moves this workflow from concept to a visible public reference project: the site has a municipal heat contract, a completed ORC plant, and first electricity exported to the German grid. That combination is materially stronger than a lab pilot, but it is still concentrated in one flagship site rather than a diversified installed base. The workflow therefore proves product
    intent and partial delivery, while leaving the long-run operating and replication questions open.'
  claimRefs:
  - CE001
  - CE004
  - CE006
  - CE007
  - CE010
  - CE033
  tableRefs:
  - TE002
  figureRefs:
  - FE002
- id: architecture-and-physics
  title: Architecture, thermosiphon physics, and critical drilling tools
  body: 'The technology stack is specific enough to diligence as a real architecture rather than a marketing diagram. At the bottom is hot rock; the loop draws heat from it by conduction, not by producing formation fluids. Inside that rock sits a sealed multilateral well system whose working fluid is isolated from the surrounding formation. Eavor argues that this design reduces water handling and avoids the induced-seismicity profile associated with permeability-creation strategies. The thermosiphon claim is important because it underpins the low-parasitic-load story: if density differences can drive circulation, the plant avoids some pump and maintenance burden borne by other geothermal designs. The drilling stack is equally central. Geretsried required long connected laterals, active magnetic ranging to keep wells aligned until intersection, and Rock-Pipe-style wellbore isolation to make the closed loop viable. The architecture is therefore only as strong as its drilling execution, because
    the physics, surface plant, and economic case all depend on precise, repeatable multilateral completion.'
  claimRefs:
  - CE002
  - CE003
  - CE005
  - CE008
  - CE009
  - CE015
  - CE016
  - CE024
  tableRefs:
  - TE001
  - TE003
