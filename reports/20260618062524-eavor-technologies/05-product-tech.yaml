- id: partners-and-dependencies
  title: Partner proof, financing, and operating dependencies
  body: Eavor's technology is not independent of partners; it is best understood as a system that sits on top of drilling, financing, regulatory, and local-infrastructure dependencies. SLB provides third-party proof that advanced ranging and drilling services worked in Germany. Chubu and OMV publicly describe themselves as project partners, and the European Commission press release makes clear that Geretsried required a layered financing package rather than simple venture equity. That matters because it shows the technology has already had to clear lender, public-finance, and industrial-partner scrutiny to leave the prototype stage. At the same time, those same dependencies create concentration risk. Municipal heat infrastructure, ORC commissioning, grid interconnection, project finance, and partner know-how are all critical path items. If any one of them lags, the product cannot monetize its thermosiphon and conduction advantages. The dependency map therefore reinforces both the strength
    of the proof set and the fragility of the commercialization sequence.
  claimRefs:
  - CE017
  - CE018
  - CE019
  - CE020
  - CE021
  - CE032
  - CE033
  tableRefs:
  - TE004
  figureRefs:
  - FE003
- id: moat-roadmap-and-open-risks
  title: Moat, roadmap, and open technical risks
  body: The public moat story is credible but incomplete. Eavor has patentable wellbore and fluid-management techniques, technical conference output, hiring activity, and Germany-specific project-news surfaces that together show a living engineering organization rather than a static climate narrative. Rock-Pipe, AMR, long connected laterals, and the growing data set from Geretsried all likely compound into know-how that is harder to copy than any single patent claim. Yet the same source set shows why investors should resist overstating the moat. Public reliability data, fleet-style uptime disclosure, and fully transparent loop economics are still absent, and the company's own 2026 messaging acknowledges that Geretsried is a learning platform for deeper and more powerful next-generation loops. The roadmap therefore points to a stronger second-generation product, while the current diligence burden remains centered on sustained output, unit economics, and the transition from owned flagship
    project to licensable repeatable architecture.
  claimRefs:
  - CE018
  - CE021
  - CE022
  - CE023
  - CE025
