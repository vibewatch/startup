tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Eavor-Loop subsurface loop
    - Municipal and utility heat/power customers
    - Commercial reference plant operating at Geretsried
    - Closed-loop conduction design avoids hydrothermal fluid production
    - Long-run loop-by-loop uptime and sustained output are not publicly disclosed
  - - ORC surface power island
    - Electricity export customers / grid
    - Installed and commissioned at Geretsried
    - Turns geothermal heat into exportable electricity on site
    - No public quarterly net generation or parasitic-load history
  - - District-heating interface
    - Municipal utility / ILN
    - Contracted and staged for build-out
    - Direct-use heat monetization alongside power export
    - Actual heat-delivery volumes are not yet public
  - - Eavor-Link AMR
    - Eavor drilling and completion teams
    - Field-proven at Geretsried
    - Maintains alignment and supports final intersections without wireline
    - Repeatability across deeper or faster campaigns remains to be proven
  - - Rock-Pipe wellbore isolation
    - Eavor engineering / future licensees
    - Prototype and conference-proven; central to loop integrity
    - Helps isolate loop fluid from formation and support thermosiphon operation
    - No independent long-run leak-rate disclosure
  - - Project-news / visitor-center operating layer
    - Municipal stakeholders and future buyers
    - Active through 2026
    - Turns Geretsried into a living reference site for customers and partners
    - Referenceability is still concentrated in one location
  notes: Rows reflect the currently public Eavor product stack and reference-asset surfaces. Several rows are operationally real but still missing neutral performance disclosure.
