  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sustained-electric-output
    missingEvidence: Per-loop net electric output, parasitic load, and seasonal performance data after several quarters of operation.
    whyItMatters: Without multi-quarter operating data, investors cannot tell whether first power is the start of a durable plant or just a commissioning milestone.
    diligencePath: Request SCADA-level monthly generation, heat-delivery, and downtime records for Geretsried since first power.
    relatedQuestionRefs:
    - QE023
  - type: private-evidence-only
    severity: material
    topic: loop-unit-economics
    missingEvidence: Loop-by-loop capex, drilling days, maintenance assumptions, and modeled versus realized LCOE for Geretsried.
    whyItMatters: Geretsried is the economic reference case for any licensing story, yet public materials disclose improvements without revealing the post-learning-curve cost base.
    diligencePath: Request board or lender materials showing final Loop 1 capex, cost-per-lateral, and expected payback under current heat and power assumptions.
    relatedQuestionRefs:
    - QE025
  - type: missing-source
    severity: minor
    topic: independent-reliability-validation
    missingEvidence: Independent field validation of uptime, maintenance intervals, and thermosiphon performance after commercialization.
    whyItMatters: Most retained reliability claims still come from company or partner surfaces rather than neutral operational reporting.
    diligencePath: Seek independent operator interviews, insurer reports, or lender monitoring notes covering the first year of commercial operation.
    relatedQuestionRefs:
    - QE025
  - type: private-evidence-only
    severity: material
    topic: licensing-model
    missingEvidence: Commercial terms for how Eavor will license technology versus own and operate projects.
    whyItMatters: The May 2026 shift toward a licensor model changes margin profile, capital intensity, and partner dependence.
    diligencePath: Request current pipeline split between owned projects and licensed projects, plus sample commercial terms for future loops.
    relatedQuestionRefs:
    - QE015
