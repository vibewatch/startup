- id: geretsried-maturity
  title: Geretsried deployment maturity and commercialization evidence
  body: 'The evidence base supports a nuanced maturity view. On the positive side, first power reached the German grid in December 2025, the company and independent trade press agree that Loop 1 was connected and commissioned, and both the technical update and the German project-news page say the drilling campaign produced a working commercial loop with meaningful learning-curve gains. The site also has a completed ORC plant and municipal district-heating integration plan, which are tangible commercial artifacts. However, adverse coverage in 2026 shows why Geretsried should still be treated as a first-of-a-kind reference asset rather than as a finished scaled product. ThinkGeoEnergy and CleanTechnica both surface the same core concern: only part of the planned lateral system contributed meaningfully, output remained well below headline design at the time of critique, and repeatable bankability has not yet been demonstrated publicly. The right conclusion is not that the plant failed, but
    that commercialization evidence is real and still incomplete.'
  claimRefs:
  - CE010
  - CE011
  - CE013
  - CE014
  - CE027
  - CE028
  - CE029
  - CE035
  tableRefs:
  - TE005
