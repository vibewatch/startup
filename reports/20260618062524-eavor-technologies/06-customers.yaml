  rows:
  - - Municipal district-heating utility
    - ILN / Stadtwerke Geretsried as buyer and network operator
    - Anchor a local low-carbon heat network
    - Binding municipal contract for 81,200 MWh/a
    - First real named customer and reference account
    - Tariff, duration, and connected-customer count undisclosed
  - - Anchor buildings / public institutions
    - Schools, businesses, large residential areas as first users
    - Early district-heating demand backbone
    - Publicly described user categories; specific sites not named
    - Provides utilization before full household rollout
    - No site roster or signed customer list published
  - - Regional households and businesses
    - Future end users connected through ILN network
    - Town-wide and regional decarbonized heat
    - EU and company materials say thousands of households/businesses eventually served
    - Expands TAM from pilot account to civic infrastructure
    - Actual connected-customer count not disclosed
  - - Electricity offtake / grid route
    - German grid and any unnamed balancing or purchasing counterparties
    - Monetize ORC output from the loop
    - First grid export proven in Dec 2025; buyer identity not public
    - Critical second revenue leg beyond heat
    - Commercial route and counterparty quality remain opaque
  - - Future city utility partners
    - enercity / Hanover-style follow-on buyers
    - Replicate reference case into other district-heating systems
    - Visible only as pipeline and planning surface, not current revenue
    - Best path to diversify concentration away from Geretsried
    - No live second reference customer yet
  notes: Rows distinguish named contractual counterparties, partially disclosed end-user groups, and future pipeline segments. Public proof is strongest at the municipal-buyer layer.
