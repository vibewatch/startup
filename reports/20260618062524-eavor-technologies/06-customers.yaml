    - Geretsried remains the only strong public customer reference
    - High
    - Request current pipeline by city, stage, and buyer
  - - Convert first power into named electricity offtakes
    - Electricity counterparties are undisclosed
    - High
    - Request PPA, merchant, or balancing arrangements for Geretsried output
  - - Expand from anchor buildings to full town network
    - Heat adoption depends on municipal build-out and drilling timing
    - High
    - Request connection plan and first 10 committed buildings
  - - Use public-finance success to lower future CAC
    - Policy and lender support could be mistaken for customer diversification
    - Medium
    - Separate partner proof from end-customer proof in diligence
