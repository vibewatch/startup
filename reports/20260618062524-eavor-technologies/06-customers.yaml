artifact: customers
slug: eavor-technologies
runDate: '2026-06-18'
company:
  name: Eavor Technologies
chapter:
  number: 6
  title: Customers
  summary: 'Eavor has real customer proof in Geretsried, but it is narrow: a binding municipal heat contract with ILN/Stadtwerke Geretsried, first electricity exported to the German grid, and staged district-heating build-out aimed initially at anchor properties. The weak point is disclosure breadth. Public sources do not reveal actual delivered heat volumes, connected-customer counts, electricity counterparties, renewal metrics, or diversified production customers, so the commercialization story is still reference-asset-heavy and concentration-risk-heavy.'
sections:
- id: disclosed-customer-landscape
  title: Disclosed customer landscape and segmentation
  body: Eavor's public customer landscape is much narrower than its technology narrative. The only clearly named heat offtake counterparty in the retained corpus is ILN, the Isar Loisach Naturwärme subsidiary of Stadtwerke Geretsried. That is meaningful because it converts Geretsried from a generic demo site into a municipally approved commercial relationship. But the same evidence set also shows the limits of disclosure. Public materials talk about the town, the region, and the district-heating network serving schools, businesses, large residential areas, and eventually more households, yet they do not publish a site-by-site roster of connected users. On the electricity side, Eavor, POWER, and ThinkGeoEnergy all confirm first power to the German grid, but none of the reviewed sources names a long-term electricity purchaser. The result is a customer base that is real, contract-backed, and strategically important, but still best described as one municipal anchor relationship plus partially
    disclosed downstream user categories.
  claimRefs:
  - CU001
  - CU003
  - CU005
  - CU006
  - CU007
  - CU008
  - CU015
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: named-proof-and-adoption
  title: Named customer proof and adoption trajectory
  body: 'Named customer proof at Geretsried is strongest where public documents are most concrete: the March 2024 heat contract, the annual contracted heat volume, municipal board and council approval, and the staged rollout plan. Those facts are stronger than simple logo placement because they show a real buyer, governance process, and intended service volume. They also reveal how adoption is expected to work in practice. First come municipal approvals and network build-out, then anchor buildings and district-heating backbone users, then wider household adoption if drilling progress and plant commissioning stay on schedule. On the electricity side, December 2025 first power is the clearest production milestone, but it still does not reveal the commercial route for monetizing power. The trajectory therefore moves from signed municipal intent to partial operating proof, not from broad customer portfolio to mature repeat-revenue visibility. That distinction is central to judging what Geretsried
    proves today versus what still needs verification.'
  claimRefs:
  - CU002
  - CU003
  - CU004
  - CU007
  - CU009
  - CU010
  - CU014
  - CU029
  tableRefs:
  - TU002
  - TU003
  figureRefs:
  - FU002
- id: durability-and-retention
  title: Retention, durability, and what public disclosures do not show
  body: Customer durability at Geretsried cannot yet be analyzed the way one would analyze a mature SaaS or utility-services franchise because the public record lacks the underlying contract and operating data. No reviewed source discloses heat tariff, duration, renewal triggers, performance-penalty provisions, churn, NRR, GRR, or satisfaction metrics. That does not mean the first customer relationship is weak; municipal approval and the strategic value of local low-carbon heat likely increase stickiness. But it does mean that public durability analysis has to stay modest. The heat side is still in staged rollout, and the electricity side is proven only to the level of grid export rather than customer-specific commercial history. Investors should therefore treat Geretsried's customer durability as a plausible but still unproven commercial moat. The best visible retention signal is that the project continues to receive partner, policy, and management support even after adverse commentary
    on output and scaling complexity.
  claimRefs:
  - CU016
  - CU017
  - CU018
  - CU019
  - CU032
  - CU034
  tableRefs:
  - TU004
  figureRefs:
  - FU003
- id: concentration-and-friction
  title: Concentration risk and procurement friction
  body: 'Concentration risk is currently extreme. Public demand proof revolves around one named municipal heat buyer and unnamed downstream or electricity counterparties. Even if end-use demand in the region is ultimately large, the current public evidence base does not show a diversified set of contracted customers, sectors, or geographies producing revenue today. Procurement friction is also unusually high. Unlike a pure merchant-power asset, Geretsried has to coordinate subsurface execution, ORC readiness, municipal approvals, and district-heating network construction before the customer value proposition is fully realized. That raises the cost of delay because technical slippage feeds directly into customer onboarding slippage. Adverse 2026 coverage intensifies the point: if actual early output is below headline design, customer concentration gets worse because the single reference project carries even more burden. The customer chapter therefore ends up leaning heavily on one municipal
    contract and one flagship site, which is useful proof but also a sharp single-project risk.'
  claimRefs:
  - CU012
  - CU021
  - CU022
  - CU027
  - CU028
  - CU033
  tableRefs:
  - TU005
  - TU006
  figureRefs: []
- id: commercialization-boundary
  title: Commercialization evidence versus future pipeline
  body: Geretsried proves enough to make Eavor commercially relevant, but not enough to prove broad customer diversification. First power, a live municipal heat contract, and EU-backed financing distinguish Eavor from pre-customer geothermal concepts. They show the company can win a civic buyer, navigate public approvals, raise project debt, and physically deliver electricity. Yet the same corpus shows how much of the forward narrative still depends on pipeline rather than current customer base. Hanover appears in Eavor Germany materials as a major follow-on demand opportunity with enercity and a meaningful household-served ambition, but that is future customer creation rather than current diversified revenue. Eavor itself increasingly frames Geretsried as a blueprint and reference asset for larger rollout. That is strategically sensible. It also means diligence should ask for the next two or three customers, not just whether the first customer exists. As of the run date, the strongest commercial
    proof is still one flagship municipal relationship carrying outsized signaling weight.
  claimRefs:
  - CU023
  - CU024
  - CU025
  - CU026
  - CU031
  - CU035
  tableRefs: []
  figureRefs: []
