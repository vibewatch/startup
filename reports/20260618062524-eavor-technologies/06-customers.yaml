  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: actual-heat-delivery
    missingEvidence: Monthly heat delivered, connected buildings by stage, and actual customer counts for the Geretsried district-heating rollout.
    whyItMatters: Without delivered-heat and connected-customer data, the heat side remains contract proof rather than operating customer proof.
    diligencePath: Request ILN or Eavor monthly commissioning, connection, and delivered-MWh reports by customer segment.
    relatedQuestionRefs:
    - QU010
    - QU024
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: contract-durability
    missingEvidence: Heat contract duration, tariff, escalation, termination rights, and performance-penalty structure.
    whyItMatters: These terms determine how sticky the first customer relationship really is and how much downside exists if output or network timing slips.
    diligencePath: Request the signed heat-supply agreement or a term-sheet summary approved for diligence review.
    relatedQuestionRefs:
    - QU017
  - type: private-evidence-only
    severity: material
    topic: electricity-counterparty
    missingEvidence: Named electricity purchaser or market route, including whether power is sold merchant, via bilateral offtake, or via a utility arrangement.
    whyItMatters: Grid export alone does not reveal revenue quality, customer concentration, or contract durability on the electricity side.
    diligencePath: Request offtake or market-participation documentation for Geretsried electricity sales.
    relatedQuestionRefs:
    - QU009
    - QU024
  - type: conflicting-data
    severity: material
    topic: output-vs-design
    missingEvidence: Reconciled management explanation for the gap between design headline and adverse-reported early gross output.
    whyItMatters: Customer economics depend on what portion of the designed value stack is already achievable versus still in remediation.
    diligencePath: Request lender or operator performance updates reconciling Loop 1 design assumptions with actual measured output by lateral pair.
    relatedQuestionRefs:
    - QU022
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-enumeration
    missingEvidence: Named roster of connected buildings or electricity counterparties beyond ILN and broad user categories.
    whyItMatters: The public customer-proof table is necessarily partial because most downstream users remain undisclosed.
    diligencePath: Ask management for the first 10 connected or committed heat users and any named electricity counterparties.
    relatedQuestionRefs:
    - QU013
    - QU024
    relatedTableRefs:
    - TU003
