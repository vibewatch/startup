- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Exact 2025 revenue
    - Audited amount and monthly bridge
    - Controls every revenue-multiple argument
    - Management + auditor
  - - 2026 run-rate and forecast
    - Current trajectory and seasonality
    - Needed for base / bull framing
    - Management model
  - - Gross margin by line
    - Hardware vs software vs enterprise
    - Determines whether platform multiple is justified
    - Finance data room
  - - NRR / GRR / churn
    - Enterprise and wallet durability
    - Most important moat validator
    - Revenue operations / FP&A
  - - Enterprise ACV and top accounts
    - Contract quality and concentration
    - Required to value institutional optionality
    - Sales / customer success
  - - Cap table / preferences
    - Dilution and overhang
    - Entry discipline depends on true ownership economics
    - Legal + finance
  notes: Without these asks, a premium underwriting decision would rely on narrative more than evidence.
