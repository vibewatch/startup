- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue quality disappointment
    - Recurring mix far below expectation
    - Undercuts platform thesis and premium multiple
    - Re-rate toward hardware / custody discount
  - - Trust shock
    - New material breach or major backlash
    - Damages brand moat and conversion
    - Pause or downgrade
  - - Regulatory friction
    - Wallet / enterprise features constrained by policy
    - Limits service-layer upside
    - Cut growth and multiple assumptions
  - - Enterprise weakness
    - Shallow institutional deployment or concentration
    - Weakens second-leg growth story
    - Reduce premium to BitGo / custody references
  - - Public comp compression
    - Crypto infrastructure multiples fall further
    - Reduces IPO pricing window
    - Demand larger entry discount
  notes: These are monitorable thesis-break events, not hypothetical existential claims.
