- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What supports it
  - What would change the view
  rows:
  - - Ledger is more than a hardware-wallet vendor
    - Installed base, wallet app, recovery products, enterprise layer
    - Proof that recurring layers are immaterial would weaken this thesis
  - - Institutional optionality deserves a premium
    - 100+ institutions and named partner/customer proof
    - Weak enterprise ARR or shallow deployment depth would reduce the premium
  - - Security brand can compound into platform value
    - Self-custody demand, clear-signing, enterprise governance
    - Another major trust incident would sharply damage this view
  - - Public evidence is too incomplete for a premium multiple
    - Exact revenue, margins, NRR, cash, and concentration are missing
    - Audited data-room disclosure would materially improve confidence
  - - Category TAM limits pure-hardware upside
    - Dedicated hardware-wallet market remains sub-$1B in 2026
    - A demonstrated wallet / enterprise platform revenue mix would offset this constraint
  notes: The anti-thesis is fundamentally about evidence quality and monetization mix, not about lack of demand for secure custody.
