    - ~$1.41B-$1.5B in 2023
    - Hardest historical anchor
    - Stale relative to 2025-2026 operating scale
  - - BitGo
    - IPO valuation
    - ~$2.2B in Jan 2026
    - Closest custody / infrastructure public reference
    - More institution-focused and less consumer-device heavy
  - - Circle
    - Public market cap
    - ~$15B-$16B in Jul 2026
    - Shows market appetite for scaled crypto infrastructure
    - Stablecoin issuer economics differ materially
  - - Coinbase
    - Public market cap
    - ~$41.39B in Jul 2026
    - Upper-bound comp for scaled crypto platform exposure
    - Exchange liquidity and public disclosure are far deeper
  - - Kraken
    - Private valuation range
    - $15B-$20B in 2025-2026 reports
    - Shows private-market appetite for major crypto infrastructure names
    - Still private, broader exchange model, data quality uneven
  notes: Comparable set spans public and private references because no single perfect Ledger comp exists.
