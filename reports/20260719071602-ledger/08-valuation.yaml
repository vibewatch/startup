- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Revenue near upper triple-digit range; enterprise and wallet services scale credibly; market rewards platform narrative
    - Could justify $4B-$5B+
    - Execution and trust must hold
    - Possible but needs management proof
  - - Base
    - Revenue mid-band; hardware still large but recurring layers meaningful; public-market discount applied
    - Supports roughly $3B-$4B+
    - Missing margins and NRR keep discount in place
    - Most defensible from public evidence
  - - Bear
    - Revenue near low end; recurring mix overstated; trust or regulatory issues resurface
    - Suggests <$3B or delayed IPO
    - Multiple compression and brand risk
    - Cannot be dismissed from public data
  notes: Ranges are deliberately broad because exact revenue, margin, and retention data are unavailable.
