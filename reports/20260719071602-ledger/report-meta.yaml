companyProfile:
  summary: Ledger is a French digital-security company best known for hardware cryptocurrency wallets, but its current product and revenue story is broader than a device maker. Founded in 2014 in Paris, Ledger built a large installed base of consumer self-custody users around Nano, Flex, and Stax signers, then layered Ledger Wallet / Ledger Live, recovery products, and Ledger Enterprise institutional workflows on top. Public sources point to 7M+ devices sold, 100+ institutions, a 2023 private valuation around $1.41B, and 2025 revenue in the triple-digit millions. The business appears strategically significant, but core underwriting metrics such as exact revenue, gross margin, NRR, enterprise ACV, and cash burn remain private.
  foundedDate: "2014-01-01"
  founders:
    - name: Éric Larchevêque
      role: Co-founder
      background: Visible founding figure in Ledger’s early Paris-based hardware-wallet buildout and public history.
      claimRefs: []
    - name: Nicolas Bacca
      role: Co-founder / embedded-security leader
      background: Publicly associated with Ledger’s technical and embedded-security foundations.
      claimRefs: []
    - name: Pascal Gauthier
      role: Chairman and CEO
      background: Public operating face of Ledger’s scaling, institutional expansion, and IPO narrative.
      claimRefs: []
  foundingLocation: Paris, France
  headquarters: Paris, France
  productSummary: >-
    Ledger sells a layered self-custody stack: consumer hardware signers, Ledger Wallet software for buy/sell/swap/stake and portfolio management, optional recovery products, and Ledger Enterprise infrastructure for approvals, custody, stablecoins, staking, and trading-adjacent workflows.
  customerFocus: Retail self-custody users globally plus institutions that need governed digital-asset custody and operations.
  businessModel: Hybrid model combining hardware sales with wallet-service activity, recovery products, and enterprise contract revenue.
  stage: Series C private / IPO candidate
  fundingStatus: ~$575M total funding across seven rounds, including a 2021 Series C above $1.5B and a 2023 flat extension around $1.41B, with 2025-2026 reporting indicating a possible US IPO above $4B.
  disclosureProfile: private-undisclosed
  claimRefs: [CO026, CU011, CV001, CV006]

summary:
  headline: Ledger is strategically compelling and plausibly worth several billion dollars, but the public record still supports a track / research-more posture rather than an aggressive premium underwriting call.
  overallScore: 6.4
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: fair
  keyMetrics:
    valuationUsdM: 4000
    revenueRunRateUsdM: null
    arrUsdM: null
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 575.4
    customerCount: 7000000
    headcount: 700
  topStrengths:
    - Ledger’s installed base, brand, and product breadth are unusually strong for a self-custody company, with 7M+ devices sold and a full wallet / recovery / enterprise stack.
    - Public reporting indicates triple-digit-million revenue in 2025, suggesting the company has already reached meaningful scale before any IPO.
    - Ledger Enterprise provides a credible second growth engine through custody, approvals, stablecoins, staking, and trading-adjacent workflows.
    - The security architecture and clear-signing narrative create a differentiated product story versus pure software wallets and narrower custody peers.
    - Comparable crypto-infrastructure valuations (BitGo, Circle, Coinbase, Kraken) make a multi-billion-dollar outcome plausible rather than fanciful.
  topRisks:
    - Exact revenue, gross margin, NRR, enterprise ACV, and cash position are undisclosed, preventing high-confidence valuation underwriting.
    - A $4B+ target implies a large step-up from the 2023 private mark and could prove full if recurring revenue quality is weaker than the narrative suggests.
    - Brand trust is a real valuation variable because the 2020 data breach and Recover backlash show that security perception can move customer sentiment.
    - Ledger depends on surrounding software, app-store, partner, and enterprise-counterparty ecosystems in addition to its hardware root of trust.
    - Public crypto-infrastructure comps remain volatile, so multiple compression risk is real even if Ledger executes operationally.
  unresolvedGaps:
    - Audited 2025 revenue and 2026 run-rate, not just “triple-digit millions.”
    - Gross margin by hardware, software / wallet services, recovery, and enterprise lines.
    - NRR, GRR, churn, enterprise ACV, and top-customer concentration.
    - Cap-table / preference details and any overhang between the 2023 private mark and a potential IPO.
    - Quantified impact of trust events on conversion, churn, or expansion.

