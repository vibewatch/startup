evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-composition
    missingEvidence: A current board roster and post-2023 cap-table ownership percentages.
    whyItMatters: Governance concentration and investor control rights cannot be underwritten from public sources alone.
    diligencePath: Request the latest board deck, shareholder register, and post-money cap table from management.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A single reconciled employee count and office count across all official properties.
    whyItMatters: >-
      The company page, people page, and careers pages still show different scale numbers, which undermines KPI
      precision.
    diligencePath: Ask finance or HR for the latest headcount by office and refresh owned website copy accordingly.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
      - TO004
  - type: private-evidence-only
    severity: material
    topic: enterprise-revenue-mix
    missingEvidence: Revenue split between consumer devices, software attach, and Ledger Enterprise recurring revenue.
    whyItMatters: The chapter can confirm scale and product breadth but not segment economics or the quality of recurring revenue.
    diligencePath: Request segment revenue and gross-margin bridge for consumer hardware, Ledger Wallet services, and Enterprise.
    relatedQuestionRefs:
      - QO006
  - type: private-evidence-only
    severity: material
    topic: ipo-readiness
    missingEvidence: Draft IPO timeline, audit readiness, and banker mandate terms behind the reported 2026 U.S. listing exploration.
    whyItMatters: Public press confirms intent but not execution readiness or whether a private round remains the likelier path.
    diligencePath: >-
      Request banker presentation materials, audit status, and board minutes covering IPO versus private-financing
      options.
    relatedQuestionRefs:
      - QO019
  - type: private-evidence-only
    severity: minor
    topic: founding-history
    missingEvidence: A first-party founder chronology naming the full founding team and current roles of each original co-founder.
    whyItMatters: Public sources identify some founders but not the whole original team or equity outcomes with precision.
    diligencePath: Request an official founding-history memo or founder cap-table summary from Ledger communications or legal.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: market-estimates
    missingEvidence: >-
      A consistent third-party market model that isolates hardware-only revenue, institutional order value, and software
      attach for the same base year.
    whyItMatters: >-
      Current market reports disagree meaningfully on present size and future growth, which weakens TAM precision and
      valuation modeling.
    diligencePath: >-
      Request management’s internal TAM model and compare it against one banker-grade external market study with
      transparent methodology.
    relatedQuestionRefs:
      - QM024
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: ledger-sam
    missingEvidence: Ledger’s own installed-base segmentation, attach rates, and repeat-purchase curves by geography and product tier.
    whyItMatters: >-
      Without conversion and attach data, the report cannot turn category growth into a defendable Ledger-specific
      SAM/SOM forecast.
    diligencePath: >-
      Request cohort data for device sales, Wallet active users, enterprise pipeline, and service attach by region and
      product line.
    relatedQuestionRefs:
      - QM020
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: minor
    topic: institutional-pipeline
    missingEvidence: Pipeline and ACV data showing how many institutions move from evaluation to live deployment.
    whyItMatters: >-
      Enterprise demand is clearly rising, but the market chapter cannot quantify conversion or order-value durability
      from public evidence alone.
    diligencePath: Request enterprise pipeline funnel, contract values, and time-to-launch metrics from the Ledger Enterprise team.
    relatedQuestionRefs:
      - QM006
      - QM022
    relatedTableRefs:
      - TM003
  - type: stale
    severity: minor
    topic: forecast-refresh
    missingEvidence: A refreshed 2026-2027 market model after post-2025 theft and tokenization demand updates.
    whyItMatters: >-
      The category is moving quickly, so 2024-2025 market models may understate institutional wallet demand and software
      attach.
    diligencePath: Re-run the market-sizing work once 2026 year-end market reports and enterprise deployment data publish.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: competitive-win-loss
    missingEvidence: Recent win/loss data versus Trezor, MetaMask, Trust Wallet, BitGo, and Fireblocks by segment.
    whyItMatters: Public pages establish positioning but not whether Ledger is winning the most important commercial battles.
    diligencePath: >-
      Request last-twelve-month win/loss summaries and reasons-coded CRM data segmented by consumer and enterprise
      deals.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: Net revenue retention, device replacement cadence, and wallet-app attach rates by cohort.
    whyItMatters: Installed base only becomes a moat if users stay engaged and buy additional products or services over time.
    diligencePath: Request cohort retention and attach-rate data for device owners, Wallet MAUs, and Enterprise clients.
    relatedQuestionRefs:
      - QP023
      - QP024
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: minor
    topic: pricing
    missingEvidence: Current list-price ladder and gross-margin contribution by device and bundle.
    whyItMatters: Packaging tiers are visible publicly, but precise monetization and margin segmentation are not.
    diligencePath: Request current regional price book, discount policy, and product gross-margin bridge.
    relatedQuestionRefs:
      - QP017
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Exact contribution of hardware, wallet services, recovery products, and enterprise contracts to total revenue.
    whyItMatters: >-
      Ledger's strategic appeal depends on whether recurring and repeat-use revenue is becoming material relative to
      device sales.
    diligencePath: Request a revenue bridge by product line for 2023-2026 plus gross margin by line.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Latest cash balance, burn rate, debt facilities, and IPO-readiness forecast.
    whyItMatters: Without cash and burn data, the $4B+ IPO narrative cannot be separated from possible financing dependency.
    diligencePath: Request board materials or management accounts showing cash, burn, debt, and 12-month financing plan.
    relatedQuestionRefs:
      - QI022
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: minor
    topic: realized-pricing
    missingEvidence: Regional device price book, promotional discounts, and realized ASP by channel.
    whyItMatters: Public lineup visibility does not reveal actual hardware economics or promo pressure.
    diligencePath: Request current price book, channel discount policy, and quarterly sell-through by device family.
    relatedQuestionRefs:
      - QI017
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: operational-reliability
    missingEvidence: Hardware failure rates, wallet-app crash metrics, recovery success rates, and enterprise uptime / SLA performance.
    whyItMatters: >-
      Public launch evidence shows breadth, but not whether the system operates cleanly at scale across devices and
      workflows.
    diligencePath: Request QA dashboards, warranty / RMA rates, app stability metrics, support queues, and enterprise SLA reports.
    relatedQuestionRefs:
      - QE024
      - QE025
    relatedTableRefs:
      - TE004
      - TE005
  - type: private-evidence-only
    severity: material
    topic: distribution-dependency
    missingEvidence: App-review backlog, Ledger Manager release lead times, and third-party developer submission pass/fail statistics.
    whyItMatters: A single distribution path can become a bottleneck for ecosystem growth or incident response.
    diligencePath: Request app-submission funnel data, median approval times, and emergency-patch process documentation.
    relatedQuestionRefs:
      - QE018
      - QE019
      - QE025
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: minor
    topic: recovery-adoption
    missingEvidence: Recover subscriber counts, Recovery Key attach rate, and net sentiment by user segment after the backlash.
    whyItMatters: Recovery products are strategically important but also the most trust-sensitive part of the product roadmap.
    diligencePath: Request product analytics, churn, attach rates, and support ticket categories for recovery offerings.
    relatedQuestionRefs:
      - QE022
      - QE024
    relatedTableRefs:
      - TE001
      - TE004
  - type: private-evidence-only
    severity: material
    topic: retention-durability
    missingEvidence: NRR, GRR, gross churn, contract length, wallet MAU, and device replacement cadence.
    whyItMatters: Without these metrics, breadth cannot be converted into a durable revenue-quality conclusion.
    diligencePath: Request retention cohorts for enterprise accounts and wallet / device engagement cohorts for retail users.
    relatedQuestionRefs:
      - QU015
      - QU017
      - QU024
      - QU025
    relatedTableRefs:
