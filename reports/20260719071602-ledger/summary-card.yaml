  topStrengths:
    - >-
      Ledger’s installed base, brand, and product breadth are unusually strong for a self-custody company, with 7M+
      devices sold and a full wallet / recovery / enterprise stack.
    - >-
      Public reporting indicates triple-digit-million revenue in 2025, suggesting the company has already reached
      meaningful scale before any IPO.
    - >-
      Ledger Enterprise provides a credible second growth engine through custody, approvals, stablecoins, staking, and
      trading-adjacent workflows.
    - >-
      The security architecture and clear-signing narrative create a differentiated product story versus pure software
      wallets and narrower custody peers.
    - >-
      Comparable crypto-infrastructure valuations (BitGo, Circle, Coinbase, Kraken) make a multi-billion-dollar outcome
      plausible rather than fanciful.
  topRisks:
    - >-
      Exact revenue, gross margin, NRR, enterprise ACV, and cash position are undisclosed, preventing high-confidence
      valuation underwriting.
    - >-
      A $4B+ target implies a large step-up from the 2023 private mark and could prove full if recurring revenue quality
      is weaker than the narrative suggests.
    - >-
      Brand trust is a real valuation variable because the 2020 data breach and Recover backlash show that security
      perception can move customer sentiment.
    - >-
      Ledger depends on surrounding software, app-store, partner, and enterprise-counterparty ecosystems in addition to
      its hardware root of trust.
    - >-
      Public crypto-infrastructure comps remain volatile, so multiple compression risk is real even if Ledger executes
      operationally.
  unresolvedGaps:
    - Audited 2025 revenue and 2026 run-rate, not just “triple-digit millions.”
    - Gross margin by hardware, software / wallet services, recovery, and enterprise lines.
    - NRR, GRR, churn, enterprise ACV, and top-customer concentration.
    - Cap-table / preference details and any overhang between the 2023 private mark and a potential IPO.
    - Quantified impact of trust events on conversion, churn, or expansion.
