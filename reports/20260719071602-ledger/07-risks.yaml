- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Data-protection failure
    - New breach or regulator notice
    - Material customer-data incident or formal regulator action
    - Freeze growth assumptions and escalate legal diligence
  - - Trust backlash
    - Sustained customer complaints around security architecture
    - Evidence of conversion drop or elevated churn after a product change
    - Re-underwrite brand moat and attach assumptions
  - - Blind-signing / approval exploits
    - Material exploit tied to unreadable approvals
    - Confirmed exploit against Ledger-adjacent approval flow
    - Reduce product-trust premium and review engineering roadmap
  - - Enterprise dependency shock
    - Major partner / counterparty exits or failures
    - Loss of critical network nodes or repeated enterprise incidents
    - Lower enterprise expansion case
  - - Regulatory adjacency risk
    - Feature or workflow deemed regulated where unprepared
    - Need for licensing, service restrictions, or geo-blocking
    - Lower service-layer monetization expectations
  - - Execution failure
    - Incident response or support quality visibly degrades
    - Repeated public complaints or delayed fixes
    - Demand customer-support and security-ops remediation plan
  notes: Kill criteria are framed as observable triggers rather than deterministic outcomes; the point is early warning, not prediction.
