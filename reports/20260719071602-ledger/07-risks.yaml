company:
  name: Ledger
chapter:
  number: 7
  title: Risks
  summary: Ledger’s primary risks are not abstract crypto volatility; they are trust, operational security, regulatory adjacency, and dependency complexity in an adversarial market. The company has credible mitigations — Secure Element design, Ledger OS isolation, clear-signing, Donjon testing, documented recovery flows, and optional backup choices — but major residual exposures remain around customer-data trust, blind-signing / phishing, platform chokepoints, partner dependencies, and public-metric opacity. This is a manageable but continuously thesis-relevant risk stack.
sections:
- id: regulatory-and-legal-risks
  title: Regulatory and Legal Risks
  body: |-
    Ledger is not simply exposed to generic “crypto regulation.” Its risk surface sits in the overlap between hardware self-custody, wallet-linked services, enterprise infrastructure, and consumer trust obligations. MiCA matters because Europe is moving toward a more explicit rule set around crypto disclosures, market conduct, and operational accountability. Even where Ledger is not itself a traditional custodian or exchange, its Wallet and Enterprise layers increasingly touch regulated workflows and therefore regulatory expectations. On top of that, cross-border promotions and wallet-linked offers create legal complexity around terms, disclosures, eligibility, and consumer treatment.

    The 2020 customer-data breach adds a second legal dimension. Ledger says it fixed the issue immediately after a researcher report, but independent sources still show a meaningful set of personal data was exposed. For a company whose brand is fundamentally about security, privacy and data-handling failures carry more than ordinary legal cost: they become part of the commercial trust model. Public legal and regulatory evidence does not show an existential threat today, but it does show continuing exposure that must be actively managed.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR031
  tableRefs:
  - TR001
  figureRefs: []
- id: security-operational-and-trust-risks
  title: Security, Operational, and Trust Risks
  body: |-
    Ledger’s core operational reality is that it defends users in one of the most adversarial environments in consumer technology. Chainalysis and related reporting show that crypto theft, hacking, and physical-coercion risks remain elevated. That context helps demand, but it also makes any weakness more expensive. The 2020 breach remains relevant because exposed customer data can enable targeted phishing and coercion. The Recover backlash matters for a different reason: it showed that users do not just evaluate whether a feature is technically optional; they also evaluate whether it violates the philosophical boundary they believed the product embodied.

    Blind signing and transaction-manipulation risk remain especially important. Ledger’s clear-signing work is a serious mitigation, and the company has been public about that posture, but the problem is not fully solved whenever unsupported flows, weak metadata, or social engineering push users outside the clearest paths. Similarly, Recovery Key, Recover documentation, Donjon testing, and security-program materials all signal maturity, yet public sources still do not quantify hardware defect rates, exploit attempts, app crash rates, or support load. The security architecture is credible; the residual trust risk is still material.
