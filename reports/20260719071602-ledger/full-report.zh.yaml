      - number: '6.4'
        title: 信任与集中度风险
        blocks:
          - type: paragraph
            body: >-
              最大的客户质量风险是信任，而不是原始需求。Ledger 历史上的数据泄露暴露了包括姓名、电话号码和实体地址在内的客户信息， 在公司服务的这类安全敏感买方面前留下了持久伤痕。Recover
              争议是第二个、很不一样的信任问题：一些用户把这项可选便利服务解读为证据， 认为安全边界比他们相信的更松。两件事都重要，因为 Ledger 的客户群对品牌可信度和感知中的架构纯粹性异常敏感。


              集中度是另一个未解问题。公开资料证明了广度，但没有证明经济上的多元化。Ledger 可能拥有数百万设备买方和 100+ 家机构，
              但仍没有公开按地理、渠道、设备家族或大客户拆分的收入。这意味着客户章节可以支持正面的采用论点，却不能支持完整承销的持久性论点。 下一步尽调应索要活跃用户、续约和集中度数据，而不是更多具名客户。
