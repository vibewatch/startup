      - number: '2.4'
        title: 驱动因素、约束和监管
        blocks:
          - type: paragraph
            body: >-
              当前周期由三股增长驱动主导。第一，交易所失败和盗窃浪潮不断重新教会市场自托管的核心教训：用户不控制密钥， 就不控制资产。TechCrunch 的 FTX 后销售数据，以及 PYMNTS、Finance
              Magnates 和 CoinCentral 的 2025 年报道 都支持这一点。第二，监管清晰度让机构部署更容易被证明合理，尤其是在欧洲，MiCA 已经为加密资产服务提供商设置了
              共同框架。第三，新用例——稳定币支付、代币化资本市场和企业钱包服务——把市场从爱好者冷存储之外继续扩开。 约束也是真实的。助记词、上手摩擦，以及害怕犯下不可逆错误，仍会压低主流零售转化。更富裕的用户
              更在意人身安全顾虑和扳手攻击。机构面临的挑战不太是自托管是否重要，而是公司能否在不制造运营脆弱性的情况下， 落地治理、集成和策略控制。这些摩擦解释了为什么 Ledger 所在品类增长很快，却仍远未进入普遍采用。
