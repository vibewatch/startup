  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接硬件对手
        blocks:
          - type: paragraph
            body: >-
              Ledger 最清晰的直接竞争仍来自其他硬件优先的自托管设备，但这些对手背后的理念差异很大。Trezor 是最接近的 广义消费级对手，强烈押注开源透明。Coldcard 则相反：只支持
              Bitcoin、隔空运行，并且刻意不迎合主流便利性。 BitBox02 处在两端之间，设计更极简、也更便于审计；Foundation Passport 则主打高端 Bitcoin 主权叙事。
              相比这些对手，Ledger 的优势是广度：多层级设备、强移动配对、品牌化钱包应用，以及机构延展。劣势在于，主权优先
              用户常常更偏好可验证的开放性或更窄的范围，而不是集成便利。竞争问题因此不是谁有一个“最佳”钱包，而是哪种安全哲学 赢下哪个用户群。
