  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Ledger 并不只是暴露在泛泛的“加密监管”之下。它的风险面位于硬件自托管、钱包关联服务、企业基础设施和消费者信任义务的交汇处。 MiCA
              重要，是因为欧洲正围绕加密披露、市场行为和运营问责走向更明确的规则集。即使 Ledger 本身不是传统托管方或交易所， 它的 Wallet 和 Enterprise
              层也越来越触及受监管工作流，因此会触及监管预期。再往上，跨境推广和钱包关联优惠会在条款、 披露、资格和消费者待遇上制造法律复杂性。


              2020 年客户数据泄露增加了第二个法律维度。Ledger 称，研究人员报告后公司立即修复了问题，但独立来源仍显示一组有意义的个人数据被暴露。
              一家品牌根基就是安全的公司，隐私和数据处理失败带来的不只是普通法律成本：它们会变成商业信任模型的一部分。公开法律和监管证据今天没有显示 生存级威胁，但确实显示出必须主动管理的持续暴露。
