  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围与用户任务
        blocks:
          - type: paragraph
            body: >-
              Ledger 已不再只是 USB 硬件钱包业务。公司现在销售一套围绕安全控制数字资产这项任务组织起来的分层产品栈。最外层是消费级 签名设备：Nano S Plus 和 Nano X
              用于经典备份和移动友好的自托管，Flex 和 Stax 则通过更大的 E Ink 触屏支持更高频的安全交互。 这些设备周围是 Ledger Wallet / Ledger
              Live，负责投资组合管理、资产发现、发送 / 接收、买入、卖出、兑换、质押，以及连接 MetaMask、Phantom 等第三方钱包。再往外是由 Ledger Recover 和 Ledger Recovery
              Key 组成的恢复套件；Ledger Enterprise 则把栈延伸到机构的财资、审批、抵押品、稳定币和代币化市场工作流。


              这个工作流框架很重要，因为 Ledger 的差异化不在某一个盒子或芯片，而在设备上密钥隔离、应用内交易 UX、以及向恢复和机构运营扩展的
              组合体验。公开产品页反复把目录分为“经典备份签名设备”和“日用触屏签名设备”，这个概括很有用：Ledger 试图一脚留在保守冷存储， 另一脚踏进频率更高、软件含量更重的运营环境。
