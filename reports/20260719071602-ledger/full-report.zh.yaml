      - number: '4.3'
        title: 资本结构与 IPO 可选性
        blocks:
          - type: paragraph
            body: >-
              Ledger 的后期资本结构记录充分，尽管运营细节稀疏。Business Wire 报道称，公司 2021 年 6 月完成 $380M Series C， 估值超过
              $1.5B。公司当时称业务在快速增长且已盈利，投资人名单包括 10T 和一大批既有、新进支持者。2023 年 3 月， TechCrunch 报道公司又以不变的约 €1.3B / $1.41B 估值完成
              €100M（约 $108M）扩展融资；Crowdfund Insider 把同一事件描述为平轮而非降轮，这一点重要，因为它说明 Ledger 在严酷的加密熊市中仍能募集成长资本。


              The Company Check 的第三方数据库覆盖显示，Ledger 横跨 7 轮累计股权融资约 $575.4M，最近一轮为 $109M，2023 年 3 月估值为 $1.41B。更近的报道中，Crypto
              Briefing 称 Ledger 正在与 Goldman Sachs、Jefferies 和 Barclays 探索赴美 IPO， 目标估值超过 $4B；多家媒体还称 2025
              年营收达到数亿美元级，并为客户保护约 $100B 的 Bitcoin。如果这些运营规模报道方向正确， Ledger
              看起来并不缺资本；它更像是在判断公开市场是否愿意把一个硬件加安全的混合平台，显著重估到高于上次私人市场估值的水平。
