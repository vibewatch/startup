      - number: '7.2'
        title: 安全、运营和信任风险
        blocks:
          - type: paragraph
            body: >-
              Ledger 的核心运营现实是，它在消费科技中最具对抗性的环境之一保护用户。Chainalysis 和相关报道显示，加密盗窃、黑客攻击和人身胁迫风险
              仍然很高。这个背景会帮助需求，但也会放大任何弱点的成本。2020 年泄露仍然相关，因为暴露的客户数据可能被用于定向钓鱼和胁迫。Recover 反弹
              重要则是另一个原因：它说明用户评估的不只是某个功能在技术上是否可选；他们还会评估它是否违反了自己认为产品所代表的哲学边界。


              盲签和交易操纵风险仍然尤其重要。Ledger 的清晰签名工作是严肃缓释，公司也公开表达了这种姿态，但只要不受支持的流程、薄弱元数据或社交工程 把用户推离最清晰路径，这个问题就没有被完全解决。同样，Recovery
              Key、Recover 文档、Donjon 测试和安全计划材料都发出成熟信号， 但公开资料仍未量化硬件缺陷率、攻击尝试、应用崩溃率或支持负载。安全架构可信；剩余信任风险仍然重要。
