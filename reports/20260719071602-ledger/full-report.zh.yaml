            body: >-
              可见的产品差异越来越取决于包装形态和工作流适配。Ledger 现在把产品线分成经典备份设备和高端安全触屏日用设备， Nano S Plus 与 Nano X 覆盖摩擦更低的入口，Flex / Stax
              覆盖更高端的交互。Trezor 的新产品线用更现代的屏幕、 Bluetooth 和 EAL6+ 安全元件回应。Coldcard 则完全拒绝多链便利性，全力押注 Bitcoin 安全，用 QR、microSD 和
              NFC 完成签名。BitBox02 和 Passport 各自把强安全信号与更偏发烧友的用户体验结合起来。这意味着 Ledger 已不再身处一个可互换 USB
              棒的扁平市场；它竞争的是几个相互重叠的子细分，分别由开源信任、触屏 UX、移动便利性和 机构邻接性定义。
