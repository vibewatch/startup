      - CU026
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 公开客户证明在覆盖广度和具名机构引用上最强，在量化留存和结果深度上最弱。
    data:
      columns:
        - 广度证明
        - 具名证明
        - 结果具体度
        - 留存可见度
      rows:
        - label: 零售装机基数
          values:
            - 强
            - 低
            - 低
            - 低
        - label: 钱包应用触点
          values:
            - 中
            - 低
            - 低
            - 低
        - label: AllUnity
          values:
            - 低
            - 强
            - 中
            - 低
        - label: Chorus One
          values:
            - 低
            - 强
            - 中
            - 低
        - label: GlobalStake
          values:
            - 低
            - 中
            - 低
            - 低
    claimRefs:
      - CU022
      - CU023
      - CU024
      - CU034
      - CU035
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 当信任冲击叠加广泛客户暴露或平台瓶颈时，残余风险最高。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 残余严重度
      rows:
        - label: 数据保护泄露
          values:
            - 中
            - 高
            - 中
            - 高
        - label: 盲签 / 钓鱼损失
          values:
            - 高
            - 高
            - 中
            - 高
        - label: Recover 信任反弹
          values:
            - 中
            - 高
            - 中
            - 高
        - label: Ledger Manager 瓶颈
          values:
            - 中
            - 高
            - 中
            - 高
        - label: 合作伙伴 / 交易对手故障
          values:
            - 中
            - 中
            - 中等
            - 中
        - label: 监管相邻性
          values:
            - 中
            - 中高
            - 低至中
            - 中高
    claimRefs:
      - CR001
      - CR007
      - CR012
      - CR019
      - CR020
      - CR030
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 同一事件可能同时沿着信任、使用、企业销售、融资和估值传导。
    data:
      nodes:
        - id: T1
          label: 安全 / 隐私事件
        - id: T2
          label: 客户信任恶化
        - id: T3
          label: 转化 / 留存下降
        - id: T4
          label: 企业销售受阻
        - id: T5
          label: 收入与利润率承压
        - id: T6
          label: 融资 / IPO 时点风险
      edges:
        - from: T1
          to: T2
        - from: T2
          to: T3
        - from: T2
          to: T4
        - from: T3
          to: T5
        - from: T4
          to: T5
        - from: T5
          to: T6
    claimRefs:
      - CR007
      - CR017
      - CR029
      - CR030
      - CR039
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Ledger 的显性风险面把内部安全控制和外围一大圈硬件、软件、合作伙伴依赖绑在一起。
    data:
      nodes:
        - id: D1
          label: Secure Element 供应商
        - id: D2
          label: Ledger OS / Donjon
        - id: D3
          label: Ledger Manager
        - id: D4
          label: 钱包应用 / 应用商店
        - id: D5
          label: 服务合作伙伴
        - id: D6
          label: 企业交易对手
        - id: D7
          label: 监管机构 / 法律制度
      edges:
        - from: D1
          to: D2
        - from: D2
          to: D3
        - from: D3
          to: D4
        - from: D4
          to: D5
        - from: D5
          to: D6
        - from: D7
          to: D4
        - from: D7
          to: D6
    claimRefs:
      - CR002
      - CR018
      - CR019
      - CR020
      - CR021
      - CR031
      - CR036
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 投资判断取决于 Ledger 能否证明自己是平台级生意，而不只是高端硬件厂商。
    data:
      nodes:
        - id: R1
          label: 7M+ 安装基数
          note: 零售端规模已有证明
        - id: R2
          label: 钱包 + 恢复 + 企业可选性
          note: 可能拼出经常性更强、质量更高的收入层
        - id: R3
          label: 收入达三位数，但口径不精确
          note: 规模存在；收入质量披露仍不足
        - id: R4
          label: 可比公司支撑数十亿美元结果
          note: BitGo、Circle、Coinbase、Kraken 框定估值区间
        - id: R5
          label: 利润率 / NRR / 集中度证据缺口
          note: 高确信度承销的主要卡点
        - id: R6
          label: 观察 / 有条件看多
          note: 只有在折价或披露改善时才有吸引力
      edges:
        - from: R1
          to: R2
        - from: R2
          to: R3
        - from: R3
          to: R4
        - from: R4
          to: R5
        - from: R5
          to: R6
    claimRefs:
      - CV008
      - CV014
      - CV016
      - CV019
      - CV031
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 估值最大的摆动来自收入确认、经常性收入组合证明，以及上市可比公司估值压缩。
    data:
      items:
        - label: 收入确认接近三位数区间高端
          value: 2
        - label: 经常性收入组合 / 企业 ARR 证明强劲
          value: 2
        - label: 信任冲击或监管摩擦再现
          value: -2
        - label: 上市可比公司估值压缩持续
          value: -3
    approximationNotes: 数值是相对于 $4B 公开目标的方向性估值影响分数，以十亿美元计；分数来自情景表，而非管理层指引。
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV027
      - CV028
      - CV035
      - CV036
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 公开证据只能支撑较宽区间，因为精确收入和利润率输入仍未公开。
    data:
      items:
        - label: 悲观情景估值
          low: 1800
          mid: 2500
          high: 3000
          unit: M USD
          source: Low-end revenue, weak recurring proof, comp discount
        - label: 基准情景估值
          low: 3000
          mid: 3600
          high: 4200
          unit: M USD
          source: Mid-band revenue, some recurring proof, discount to Circle / Coinbase
        - label: 乐观情景估值
          low: 4200
          mid: 5000
          high: 6000
          unit: M USD
          source: Upper-band revenue, strong enterprise / wallet mix, supportive market
        - label: 当前公开目标
          low: 4000
          mid: 4250
          high: 5000
          unit: M USD
          source: IPO reports from Crypto Briefing / Blockonomi / Decrypt
    claimRefs:
      - CV004
      - CV023
      - CV025
      - CV026
      - CV027
      - CV040
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Ledger 在战略重要性和需求证明上得分不错，但公开财务完整度拖后腿。
    data:
      items:
        - label: 市场相关性
          value: 8/10
          note: 自托管和机构加密安全仍然重要
        - label: 客户证明
          value: 8/10
          note: 7M+ 台设备和 100+ 家机构有分量
        - label: 产品护城河
          value: 7/10
          note: 架构和生态宽度真实存在，但对信任敏感
        - label: 经济性可见度
          value: 3/10
          note: 缺少精确收入、利润率和 NRR
        - label: 风险画像
          value: 5/10
          note: 可管理，但始终影响投资逻辑
        - label: $4B 估值吸引力
          value: 5/10
          note: 可能合理，但并不明显便宜
        - label: 投资建议证据质量
          value: 4/10
          note: 足够观察，还不足以激进承销
    claimRefs:
      - CV007
      - CV008
      - CV015
      - CV031
      - CV033
      - CV040
