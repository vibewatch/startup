  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 支撑证据
      - 何种证据会改变判断
    rows:
      - - Ledger 不只是硬件钱包厂商
        - 装机基础、钱包应用、恢复产品、企业层
        - 如果证明经常性层贡献很小，投资逻辑会被削弱
      - - 机构业务可选性应享有溢价
        - 100+ 家机构和具名合作伙伴 / 客户证据
        - 企业 ARR 偏弱或部署深度不足，会压低溢价
      - - 安全品牌可复利成平台价值
        - 自托管需求、清晰签名、企业治理
        - 再发生重大信任事件会大幅伤害该判断
      - - 公开证据太不完整，难以支撑溢价倍数
        - 缺少准确收入、利润率、NRR、现金和集中度
        - 经审计的数据室披露会显著提升信心
      - - 品类 TAM 限制纯硬件上行空间
        - 2026 年专用硬件钱包市场仍低于 $1B
        - 如果钱包 / 企业平台收入结构得到证明，可抵消这一约束
    notes: 反向逻辑的核心是证据质量和变现结构，不是安全托管需求不足。
