      - number: '3.4'
        title: 护城河和风险评估
        blocks:
          - type: paragraph
            body: >-
              Ledger 公开可观察的护城河信号真实存在，但并不完整。最大的正面因素是装机基数、配套应用层、多层级硬件目录，以及 Ledger Enterprise
              作为机构第二曲线的存在。合在一起，这些资产可以制造切换成本，并把货币化从一次性设备销售拓宽出去。 最大的公开风险也很清楚。开源竞争对手在部分安全纯粹主义买方面前拥有更干净的叙事。MetaMask 和 Trust
              Wallet 拥有 软件分发和互动能力，在用户真正感到痛之前，可能让硬件转化缺乏动力。BitGo 和 Fireblocks 把机构战场推向控制和工作流深度， 单靠品牌资产不够。近期软件钱包安全事件确实强化了
              Ledger 的离线密钥论点，但不能证明 Ledger 更常赢单或用户留存更好。 公开数据仍缺少赢 / 输、NRR、流失和附着率证据，因此护城河论点仍是方向性正面，而不是已经完整承销。另一个更隐蔽的风险是节奏：
              软件钱包可以每周发新功能，硬件更新周期更慢，还要承担库存。如果 Ledger 不能在设备周期之间让应用层保持足够吸引力，
              它可能即使仍是抽屉里的安全金库，也会失去日常关系。这在战略上很危险，因为市场越来越奖励同时占有信任和习惯的供应商。 尽调最重要的未解商业问题是：当软件钱包用户积累到足够多资产、开始认真在意密钥隔离时，Ledger
              是否仍是默认升级路径。
