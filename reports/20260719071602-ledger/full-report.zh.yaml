      - number: '3.2'
        title: 软件和机构替代品
        blocks:
          - type: paragraph
            body: >-
              Ledger 还会从两个方向被分流，而这两类对手看起来都不像传统设备同行。在低摩擦一端，MetaMask 和 Trust Wallet
              可以让用户进入加密、DeFi、兑换和质押，而不要求一开始就购买硬件。这种分发力会延迟，甚至取代向硬件的转化， 除非安全冲击或财富积累制造紧迫感。另一端，BitGo 和 Fireblocks
              扩大了机构买方的比较范围，尤其是买方需要 稳定币、代币化或受监管财资工作流时。在这些场景里，买方比较的不是 Nano X 和 Trezor，而是整套控制栈、 策略引擎和运营模型。Ledger Enterprise
              有助于补上这个差距，但也意味着 Ledger 的护城河必须同时顶住 消费级应用便利性和企业基础设施规模。
