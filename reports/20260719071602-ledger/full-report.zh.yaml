  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与牵引力
        blocks:
          - type: paragraph
            body: >-
              Ledger 的财务故事最好理解为一种以硬件为锚、但不断叠加软件和服务货币化的混合模式。设备销售仍是第一笔经济事件： 数百万消费者已经购买 Ledger 硬件，公开已售设备区间现在大约在 700 万到 800
              万台。这个装机基数很重要，因为每台设备 也把用户导入 Ledger Wallet / Ledger Live；在那里，用户可以买入、卖出、兑换、质押、消费和管理投资组合， 留在 Ledger
              生态内，而不是把签名设备当成沉睡的金库。


              2021 年和 2023 年的公开报道都支持这个多元化论点。Ledger 在 2021 年 Series C 公告中称，来自 Ledger Live 的消费端 交易收入，以及来自 Ledger Vault
              的企业收入，已经在把业务从核心消费硬件之外分散开。TechCrunch 2023 年重复了这个框架， 指出 Ledger Live
              通过质押机会和第三方集成产生收入，同时硬件业务仍表现很好。这个组合很重要：Ledger 不是纯 SaaS 公司， 也不只是小工具供应商。它试图把安全硬件变成持久分发渠道，用来承载更高频的软件和服务货币化。
