      - number: '8.2'
        title: 估值框架与可比公司
        blocks:
          - type: paragraph
            body: >-
              单靠硬件钱包 TAM 无法支撑 $4B 估值。多份分析师报告仍把当前专用硬件钱包市场放在 2026 年约 $0.72B，这意味着 $4B 的 Ledger
              估值只有在投资人相信公司参与了一个大得多的平台机会时才说得通；这个机会横跨钱包服务、恢复和企业运营。这就是从品类 TAM 走向平台价值的概念桥。


              可比信号混杂，但有用。BitGo 的 $2.2B IPO 表明，托管基础设施即便消费端触达更窄，也可以拿到数十亿美元公开市场估值。 Circle 的 $15-$16B 公开市值和 Coinbase 的
              ~$41.39B 市值说明，当规模和披露足够强时，流动性强的加密平台可以交易到高得多的水平。 Kraken 报道中的 $15B-$20B 私人市场区间说明，私人资本仍在激进定价主要加密基础设施。因此，$4B 的
              Ledger IPO 会排在 BitGo 之上， 但远低于 Circle、Kraken 和 Coinbase。这个位置合理——但前提是 Ledger 的混合模式足够真实，值得拿平台溢价，而不只是硬件溢价。
