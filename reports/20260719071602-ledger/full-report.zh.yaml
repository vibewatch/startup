      - number: '5.2'
        title: 架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              Ledger 的公开开发者文档罕见地有用，因为它把架构讲得很明白。公司描述的是一个三段式系统：运行在 Secure Element 内部 BOLOS 上的设备应用、手机 /
              桌面端的钱包或宿主应用，以及处理链连接的网络浏览器或节点。安全设备被刻意收窄：它保存私钥、 派生地址、显示人类可读的交易细节，并生成签名。宿主应用承担更重的 UI 和网络工作。这种分离是产品的核心工程逻辑：
              关键操作留在防篡改环境中，芯片外的软件则可以更快迭代。


              Ledger OS / BOLOS 是这个模型的中心。Ledger 称，该操作系统会隔离应用，支持通过 Secure SDK 开发第三方应用，并驱动安全屏幕 以及用于设备真伪和固件 /
              应用安装的信任根校验。这套架构制造了真实技术护城河，也带来清晰依赖。Ledger Manager 是唯一的应用
              分发路径；钱包应用是主要用户界面，因此本身也是一个信任瓶颈；围绕兑换、质押和机构工作流的交易功能广度，很大一部分来自合作伙伴通道。 换句话说，Ledger
              的产品因边界而安全，但完整用户价值仍取决于周边软件和伙伴生态。
