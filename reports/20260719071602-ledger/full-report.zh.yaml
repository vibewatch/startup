      - number: '1.4'
        title: 里程碑、产品扩张与负面历史
        blocks:
          - type: paragraph
            body: >-
              运营时间线里既有强执行信号，也有一道持久的信任伤痕。积极的一面是，Ledger 2024 年初用 TRADELINK 拓宽企业栈，2024 年 5 月开始交付 Ledger Stax，并在 2024 年 8
              月把核心软件层重新介绍为 Ledger Wallet。这些产品节点说明，创立十年后，Ledger 仍在消费端和机构端持续发货。负面的一面是，2020 年
              电商和营销数据库泄露仍是公司公开历史中最重要的非基本面风险事件。公司披露和独立泄露追踪方都认为， 该事件暴露了约 100 万个电子邮箱地址，以及一部分更敏感的客户联系方式，但没有暴露私钥或钱包余额。
              这个区别在分析上很重要：泄露没有击穿 Ledger 核心设备安全模型，却实质损害了用户信任，并提高了客户 面临的钓鱼和人身安全风险。换句话说，Ledger 最大的公开事故不是密码学失败，而是一次留下长期品牌后果的
              数据治理失败。
