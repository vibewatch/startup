      - number: '8.3'
        title: 建议与风险调整视角
        blocks:
          - type: paragraph
            body: >-
              Ledger
              的乐观情景很能讲通：装机基数在品类里领先，安全品牌够强，从签名设备到应用再到恢复服务的用户旅程已经打成全栈，企业端早期覆盖面也在打开；加密安全周期仍然奖赏可信基础设施。悲观情景则卡在缺失的数字上：没有精确的
              2025 年收入，没有利润率结构，没有 NRR，没有现金余额，也没有披露客户集中度。这些缺口很关键，因为它们决定 $4B 的价格究竟是合理溢价，还是把平台可选性包装成的估值冒进。


              因此，公开资料下最站得住脚的判断是有条件正面 / 观察。Ledger 看起来值得继续深入，而不是能在没有价格纪律的情况下按口号式估值目标激进承销。如果价格明显低于
              $4B，或数据室证明经常性收入占比和利润率质量，投资逻辑会明显增强。若在缺少这些披露的情况下按完整 $4B+ 定价，立场就会从有吸引力转为合理至偏满。
            claimRefs:
