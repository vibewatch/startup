      - number: '7.4'
        title: 缓释措施与终止条件
        blocks:
          - type: paragraph
            body: >-
              Ledger 确实有可见缓释措施。它公开强调 Secure Element 隔离、Ledger OS 分离、清晰签名、反钓鱼教育、持续 Donjon 测试、
              成文恢复协议和可选备份设计。这些控制有意义，应该阻止审阅者把风险章节简化成泛泛的加密恐惧。但未解问题是经验性的： 这些控制是否跟得上一个在技术复杂度和社交工程压力上都在扩张的威胁环境？


              管理这种不确定性，最干净的方式是设置可衡量的终止条件。再次发生重大客户数据事件、签名流程漏洞、损害钱包或企业服务的监管行动、反复伙伴失败，
              或者有证据显示信任冲击正在压制转化，都将影响投资论点。因此，风险结论是平衡但严厉的：Ledger 的架构站得住，但运营环境足够严酷， 风险管理必须被当成核心产品功能，而不是支持功能。
