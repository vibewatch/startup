      - number: '1.3'
        title: 融资历史、投资方和当前规模信号
        blocks:
          - type: paragraph
            body: >-
              Ledger 的资本路径说明，公司早在 2025-2026 年 IPO 窗口前就已跻身独角兽，并在艰难得多的加密市场中 守住了估值。2021 年 6 月的 Series C 融资 $380M，估值超过
              $1.5B，由 10T Holdings 领投， Cathay Innovation、多支 Draper 相关基金、DCG、Korelya Capital 和 Wicklow Capital 等重磅机构
              参投。2023 年 3 月，Ledger 又以大约 €1.3B 的估值完成 €100M 平轮扩展，新投资方包括 True Global Ventures、VaynerFund 和 Digital Finance
              Group。运营上，公司在 FTX 之后的自托管浪潮中继续扩张： TechCrunch 报道称截至 2023 年 3 月已售出 600 万台设备，之前 9 个月新增 100 万台；当前公司页面则称 已售出超过
              700 万台设备，服务覆盖 180 个国家。公开披露在收入结构和董事会经济安排上仍然稀薄， 但足以证明 Ledger 是资本充足的全球品类领导者，而不是小众配件制造商。
