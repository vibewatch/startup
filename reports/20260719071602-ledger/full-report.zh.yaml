      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              正面论点很直接。Ledger 拥有全球知名的硬件品牌、庞大装机基数、向钱包服务和恢复产品扩张的可见路径、可信的机构平台，
              以及显示强投资人支持的资本历史。公开资料越来越多地把公司描述成比硬件钱包制造商更丰富的东西：一个带有交易、订阅、配件和
              企业软件层的安全平台。这个组合在战略上有吸引力，因为如果经常性层的扩张快过底层设备更新周期，它可以随时间改善收入质量。


              负面论点同样清楚：几乎所有能承销这种改善的指标都未公开。公开记录没有披露准确年收入、服务收入结构、毛利率、现金余额、 CAC、NRR、企业 ACV
              或现金消耗。即便头部营收数据也只有“数亿美元级”，方向有用，但对估值工作太粗。因此，Ledger 的财务画像 战略上正面，分析上不完整。$4B+ IPO
              叙事要被视作不只是合理的市场野心，就需要管理层先披露收入结构、利润率和留存。
