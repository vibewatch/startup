      - number: '6.3'
        title: 持久性与扩张
        blocks:
          - type: paragraph
            body: >-
              Ledger 的扩张逻辑是可见的，即使留存指标并不可见。零售用户可以从第一次硬件购买进入 Ledger Wallet 活动，再进入兑换、质押、
              跨链使用、恢复产品，并最终升级到高端设备。机构用户可以从托管进入审批、交易运营、质押、稳定币和更宽的财资流程。这些路径在战略上有吸引力， 因为它们意味着 Ledger
              可以随时间复合每个客户的价值，而不是只依赖一次性设备需求。


              当问题从扩张机会转向持久性证明时，公开记录就弱得多。没有披露 NRR、GRR、流失、续约率、合同期限、设备替换节奏或钱包 MAU。
              应用商店存在证明的是一个活入口，不是粘性。具名伙伴公告证明的是相关性，不是续约。因此，持久性论点合理，但仅靠公开数据还没有被实证承销。
