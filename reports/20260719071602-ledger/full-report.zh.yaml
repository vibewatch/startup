      - number: '5.4'
        title: 信任、安全与技术结论
        blocks:
          - type: paragraph
            body: >-
              当问题是“私钥应该放在哪里，最终批准应该在哪里发生”时，Ledger 的产品论点最强。公开答案是连贯的：放在 Secure Element 上， 由 Ledger OS 隔离，配合安全屏幕、PIN
              和物理确认签名。Recovery Key 把这种世界观延伸到离线备份配件，Recover 白皮书则显示， Ledger 知道自己需要把密码学和运营流程讲得比营销文案更细。


              信任画像仍不完全干净。Recover 反弹说明，即便是可选便利层，也可能被安全纯粹主义客户解读为违反早先假设。更广泛地看，公开材料仍缺少
              最硬的产品运营数字：硬件故障率、钱包应用崩溃指标、支持工单负载、成功恢复率、企业部署广度，以及独立量化审计结果。因此，技术结论是： 架构和产品广度正面，但运营证明不完整。Ledger
              看起来是严肃、成熟的硬件安全平台；剩余尽调要用数据而不是架构图来验证可靠性、 支持负担和生态瓶颈。
