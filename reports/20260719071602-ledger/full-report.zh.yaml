      - number: '2.2'
        title: 品类规模、增长和地理分布
        blocks:
          - type: paragraph
            body: >-
              公开市场报告方向一致，但数字并不完全相同。Mordor Intelligence 和 Research and Markets 都把 2026 年 专用硬件钱包品类放在约 $0.72B，但两者对 2031
              年终点的预测不同，范围大约在 $2.25B 到 $2.58B。 Strategic Market Research 从更低的 2024 年基数约 $370M 起步，到 2030 年达到约
              $1.52B。合在一起看， 关键结论不是某个神奇的 TAM 数字，而是硬件钱包今天仍是相对小的市场，却比许多相邻硬件品类增长快得多。 地理分布同样重要。Mordor 称北美贡献当前收入近
              39%；欧洲受益于更清晰的监管，亚太地区仍是 移动优先加密行为的主要增长前沿。因此，这个市场确实有规模潜力，但仍足够早，执行、品牌和软件附着比单纯铺货 更能改变份额。
