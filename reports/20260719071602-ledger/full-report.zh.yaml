      - number: '8.4'
        title: 最终尽调关口
        blocks:
          - type: paragraph
            body: >-
              最终估值只取决于少数关口；如果业务真像叙事那么强，管理层可以很快给出答案。精确的 2025 年收入和 2026 年收入运行率能告诉投资人，Ledger
              在「数亿美元」区间里到底落在哪里。分业务线毛利率决定它该按软件公司还是硬件公司处理。NRR、流失率、企业
              ACV、头部客户敞口，决定平台逻辑能否长期站住，还是只是业务面很宽。股权结构表和清算优先权细节，决定上一轮私募估值是低估还是高估了真实进入风险。


              这些事实披露前，正确姿态是看证据调整。否定 Ledger 的不是战略薄弱，而是公开经济性不完整。这个区别正是建议不是回避，而是有纪律地观察。
            claimRefs:
              - CV007
