      - number: '6.2'
        title: 采用情况和具名证明
        blocks:
          - type: paragraph
            body: >-
              采用故事在漏斗顶部最强。Ledger 公开已售设备区间从 2023 年的 6M+ 增至 2026 年报道中的 7M+；TechCrunch 还记录了 2022 年 6 月到 2023 年 2 月 FTX
              后自托管周期中 100 万台设备的爆发。这些是强有力的零售广度信号。钱包应用同样重要， 因为它说明客户关系并不在购买时结束；App Store 和 Google Play
              列表，以及围绕兑换、质押和跨链使用的公开功能文案， 都暗示着持续的软件关系。


              机构端的具名证明好于消费端。AllUnity 在 EURAU 托管栈中公开点名 Ledger Enterprise；Chorus One 在机构质押中点名 Ledger
              Enterprise；GlobalStake 也是质押基础设施中的一个公开合作。TRADELINK 的启动队列增加了更多具名客户，包括 Crypto.com、Bitstamp、Wintermute
              等，但公开证据仍然更多说明相关性，而不是合同规模或生产深度。这足以证明真实市场存在感； 还不足以证明留存质量或收入集中度。
