  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与当前背景
        blocks:
          - type: paragraph
            body: >-
              Ledger 的估值争论始于一个错位：公司清楚呈现出来的样子，和公开市场当前能够证明的东西，并不匹配。战略上，Ledger 看起来优于狭窄硬件供应商： 已售设备超过 7M 台、完整钱包应用层、恢复产品，以及拥有
              100+ 家机构和具名工作流伙伴的增长中机构业务。这些特征支撑了一种观点： Ledger 应该被作为混合安全平台估值，而不只是冷存储设备制造商。同时，最近的硬性私人市场估值仍是 2023 年约 $1.41B
              的平轮， 而 2025-2026 年报道已经把叙事推向可能 $4B+ 的赴美 IPO。


              披露周期不多，重估幅度却很大。公开报道有所帮助，补充了 2025 年营收达到数亿美元级、公司为客户保护约 $100B Bitcoin 等信息。
              但这些标题不足以消除不确定性，因为准确营收、利润率、留存和集中度仍未公开。因此，当前背景支持关注，不支持盲目信念。
