      - number: '4.2'
        title: 经常性收入层
        blocks:
          - type: paragraph
            body: >-
              今天最清晰的公开经常性收入线是 Ledger Recover。产品页直接披露机制：首月免费、自动按月续费，并通过 Coincover 设置国家资格 / 身份验证要求。Ledger 的技术白皮书公告更进一步，明确把
              Recover 标为可选付费订阅服务。Recover 特别利于尽调，因为这是少数既披露产品架构、又给出足够商业细节、足以推断出真实订阅业务的地方之一。


              Ledger Recovery Key 叠加了第二层货币化，但逻辑不同。它不是经常性软件，而是配件和附着率产品。Ledger 披露单把钥匙 定价 $39，三件装
              $99，同时又把它与新触屏设备免费捆绑，说明公司有意降低恢复焦虑，并扩大交易所用户和软件钱包用户的转化。 机构端的模式又不同。Ledger Enterprise、TRADELINK、移动审批应用和 TRON
              扩展都指向合约式工作流收入，而不是按设备销售或 按交易收费。事实上，TRADELINK 明确表示 Ledger 不会收取交易费，这意味着货币化更可能来自更宽的软件合约、平台纳入或企业扩张， 而不是直接交易价差。
