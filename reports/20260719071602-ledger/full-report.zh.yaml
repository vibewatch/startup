  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层
        blocks:
          - type: paragraph
            body: >-
              Ledger 的客户地图在结构上分成两端。一端是零售自托管用户：个人和家庭购买硬件签名设备，自己存储并批准数字资产交易。 在这个分层里，买方、用户和付款方通常是同一个人。另一端是使用 Ledger
              Enterprise 进行受治理托管和数字资产运营的机构； 买方是组织，最终用户分散在财资、运营、合规和审批角色中。这不是小差异。零售客户购买一个产品，常常通过应用自助完成；
              企业客户采用的是一套必须接入控制、审批和策略基础设施的工作流。


              公开资料持续支持这种两端划分。公司和招聘页面提到，设备已在全球 180 个国家售出数百万台。企业页面描述了全球 100+ 家机构， 其他工作流公告则指向稳定币、质押和结算用例。这让 Ledger
              相比许多钱包供应商显得特别：它同时横跨消费级和机构级自托管， 而不是只服务市场一端。
