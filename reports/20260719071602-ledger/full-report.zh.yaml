              Éric Larchevêque、Nicolas Bacca 和 Vanessa Fara Fara Rabesandratana 列为创始人之一。规模披露也需要辨析。当前公司页面写着 Ledger 有 700+
              名员工、8 个办公室，但其他仍在线的官方页面还显示 600+ 名员工、9 个办公室。地点页面仍给出一张 可信的当前办公室地图，以巴黎、Vierzon、Montpellier、伦敦、纽约、苏黎世、新加坡和
              Portland 为锚点；这与 Ledger 作为法国总部公司、同时具备实质国际商业触达的画像大体一致。
