  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 收入接近高三位数区间；企业和钱包服务可信放量；市场认可平台叙事
        - 可支撑 $4B-$5B+ 估值
        - 执行和信任必须守住
        - 有可能，但需要管理层举证
      - - 基准
        - 收入位于中档；硬件仍占大头，但经常性层已有意义；适用公开市场折价
        - 大致支撑 $3B-$4B+
        - 毛利率和 NRR 缺失，折价仍应保留
        - 公开证据下最站得住脚
      - - 悲观
        - 收入接近低端；经常性收入占比被高估；信任或监管问题再浮现
        - 指向 <$3B 或 IPO 延后
        - 倍数压缩和品牌风险
        - 公开数据无法排除
    notes: 区间有意设得很宽，因为缺少准确收入、利润率和留存数据。
