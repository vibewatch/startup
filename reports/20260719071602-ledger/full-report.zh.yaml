companyProfile:
  summary: >-
    Ledger 是一家法国数字安全公司，最出名的是硬件加密货币钱包，但现在的产品和收入故事已经不止设备制造。 Ledger 2014 年创立于巴黎，先围绕 Nano、Flex 和 Stax 签名设备搭起庞大的消费级自托管用户基础，
    再叠加 Ledger Wallet / Ledger Live、恢复产品和 Ledger Enterprise 机构工作流。公开资料显示， 公司已售出 7M+ 台设备，服务 100+ 家机构，2023 年私人市场估值约
    $1.41B，2025 年营收达到数亿美元级。 这家公司具备战略重要性，但准确营收、毛利率、NRR、企业 ACV 和现金消耗等核心承销指标仍未公开。
