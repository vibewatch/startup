      - number: '7.3'
        title: 依赖与执行风险
        blocks:
          - type: paragraph
            body: >-
              Secure Element 和 Ledger OS 只是系统中心，不是整个系统。Ledger Manager 是应用和固件的唯一分发路径。钱包应用依赖应用商店，
              也依赖广泛的服务商层来完成入金、兑换和质押。TRADELINK 和 Ledger Enterprise 依赖更宽的托管方、交易所、经纪商和交易对手网络。
              这意味着公司可以打造强安全核心，却仍在外围继承有意义的依赖风险。伙伴退出、司法辖区限制、审核延迟或工作流 bug，即便芯片本身仍然安全， 也会伤害客户。


              执行风险会进一步叠加。Ledger 的全球足迹和企业雄心要求工程、安全、支持、沟通、合规和客户成功之间有纪律地协同。Recover 事件证明，
              沟通本身可以成为风险放大器。移动审批和稳定币运营等企业工作流功能加深了价值主张，但也增加了人、运营和伙伴环节；任何失败都可能被客户看见。 因此，关键尽调问题不只是 Ledger
              架构是否强，而是组织能否在压力下持续稳定地运行这套架构。
