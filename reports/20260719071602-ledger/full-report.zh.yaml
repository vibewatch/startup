  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              Ledger 并不是面向“全部加密业务”销售，因此任何测算有意义之前，都必须先谨慎划定市场边界。相关市场从 安全自托管硬件，以及与其直接相连的软件和策略栈开始。它包括零售硬件设备、让这些设备可用的配套钱包体验，
              以及让机构在不把资产留在交易所的情况下保有控制权的机构密钥管理 / 治理基础设施。它不包括从未迁出平台的 纯交易所托管余额、留在托管应用里的投机性代币交易量，也不包括无关的区块链工具。这个框架很重要，因为更广义
              的加密钱包生态远大于专用硬件钱包细分市场：Datawallet 的广义钱包统计落在数百亿美元级，而专用硬件钱包分析师 到 2025-2026 年仍把该市场描述为低于 $1B。含义是，Ledger
              瞄准的是更窄但价值更高的一层；在这里， 安全、信任和流程控制比原始钱包 MAU 更重要。
