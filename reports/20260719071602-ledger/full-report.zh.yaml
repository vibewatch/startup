      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方分层并不均质。零售长期持有者购买硬件，是为了获得近似金库的冷存储；活跃多链用户购买硬件，是为了在继续使用 DeFi、质押和 NFT
              的同时降低日常签名风险；高净值用户关心财富保护和继承流程；机构则把问题视为受治理的财资 基础设施。在零售端，买方、用户和付款方通常是同一个人，因此采用路径更情绪化、也更受事件驱动：一次黑客攻击、
              交易所失败，或持仓快速升值，都会把用户推向自托管。在机构端，买方、用户和付款方分散在产品、财资、运营、合规和
              安全等利益相关方之间，因此采用路径更像企业软件采购，而不是消费电子购买。这个差异解释了为什么市场现在既能支撑 低价备份设备，也能支撑更丰富的日用触屏设备和策略强制执行的企业栈。因此，Ledger
              的市场最好理解为一架梯子： 先是软件或交易所，然后是硬件自托管；等余额和复杂度足以证明其必要性后，再进入多人治理。
