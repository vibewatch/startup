            body: >-
              尽调最该关注的 2024 年后变化，是资本市场可选性重新打开。Crypto Briefing、Decrypt、Blockonomi、 Finance Magnates 和 CoinCentral 在
              2025-2026 年的独立报道一致称，Ledger 正在评估赴美 IPO 或 私募融资，报道中的估值目标超过 $4B，Goldman Sachs、Jefferies 和 Barclays
              参与其中。同一批报道还转述 Pascal Gauthier 的说法：Ledger 2025 年营收达到数亿美元级，并为客户保护约 $100B 的 Bitcoin。 这些都不能替代
              S-1，市场时点也仍未解决，但它确实证明，Ledger 进入 2024 年后阶段时，估值叙事已经 远高于 2023 年平轮估值。后续章节的含义很清楚：Ledger 已不再只被当成钱包制造商来评判；公开市场
              似乎准备把它定价为兼具消费硬件和机构基础设施元素的规模化加密安全平台。
