    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与产品版图
        blocks:
          - type: paragraph
            body: >-
              Ledger 2014 年创立于巴黎，已经从硬件钱包专家长成更宽的数字资产安全平台。官方页面把公司 锚定在一个核心使命上：用离线设备、配套软件和机构基础设施层来保护数字价值。这个定位很关键， 因为 Ledger
              已不再只是单一产品的钱包供应商；现在的栈覆盖消费级签名设备、曾名 Ledger Live 的 Ledger Wallet 应用，以及面向机构的 Ledger Enterprise
              平台。产品覆盖面足够宽，可以支撑零售、 Web3 和财资式工作流，但底层论点始终不变：让私钥离开通用联网设备，同时让数字资产仍能日常使用。 公开材料也清楚表明，消费端产品线已从传统 Nano 系列扩展到
              Stax、Flex 等高端触屏设备，强化了一种 组合策略：既做大众市场备份设备，也做更高端的日用硬件。
