- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Driver / risk
  - What is visible publicly
  - Impact
  - Diligence path
  rows:
  - - Retail expansion
    - Wallet services, recovery, DeFi, cross-chain, upgrades
    - Can improve ARPU and repeat usage
    - Request attach rates and service revenue mix
  - - Enterprise expansion
    - Approvals, staking, stablecoins, trading ops
    - Can improve ACV and stickiness
    - Request module attach rates and ACV by customer type
  - - Retail concentration risk
    - Broad unit reach but unknown revenue concentration by geography or channel
    - Could hide localized dependence
    - Request revenue by region and channel
  - - Institutional concentration risk
    - 100+ institutions but few named proofs
    - A handful of large accounts could dominate value
    - Request top-10 customer revenue share
  - - Partner dependence
    - Public proof often arrives via partners and integrations
    - Partner loss could weaken adoption or credibility
    - Request partner-driven pipeline share
  - - Trust shocks
    - Breach history and Recover backlash
    - Can suppress conversion or upgrades among cautious users
    - Request conversion and churn analysis around incidents
  notes: The biggest customer-quality unknown is not whether Ledger has customers; it is whether repeat usage and expansion are diversified and durable.
