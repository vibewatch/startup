- id: adoption-and-named-proof
  title: Adoption and Named Proof
  body: |-
    The adoption story is strongest at the top of the funnel. Ledger’s public sold-device range has grown from 6M+ in 2023 to 7M+ by 2026 reporting, and TechCrunch recorded a 1 million-device burst between June 2022 and February 2023 during the post-FTX self-custody cycle. Those are powerful retail breadth signals. The wallet app also matters because it suggests the customer relationship does not end at purchase; App Store and Google Play listings, plus public feature copy around swaps, staking, and cross-chain use, imply a continuing software relationship.

    Named proof is better on the institutional side than the consumer side. AllUnity publicly names Ledger Enterprise in the EURAU custody stack; Chorus One names Ledger Enterprise in institutional staking; and GlobalStake is another public collaboration in staking infrastructure. TRADELINK’s launch cohort adds more logos, including Crypto.com, Bitstamp, Wintermute, and others, but public evidence still says more about relevance than about contract size or production depth. That is enough to prove real market presence; it is not enough to prove retention quality or revenue concentration.
