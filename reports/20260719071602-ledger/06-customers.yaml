- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Ledger serves both a retail journey and an enterprise journey, each with its own expansion loops.
  data:
    items:
    - label: 'Retail path: discover self-custody need, purchase signer, install Ledger Wallet, activate buy/swap/stake flows, and later add recovery or upgrade hardware'
    - label: 'Institutional path: evaluate Enterprise, deploy custody and approvals, add staking or stablecoin workflows, and expand into trading or settlement operations'
    - label: Retail buyer/user/payer is usually the same person, so setup friction immediately affects activation and expansion
    - label: Institutional buyer and user are split across teams, so approvals, policies, and integration depth matter more than simple device ownership
    - label: Trust events such as breach memory or Recover backlash can interrupt both journeys before expansion
