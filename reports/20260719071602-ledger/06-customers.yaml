company:
  name: Ledger
chapter:
  number: 6
  title: Customers
  summary: 'Ledger clearly serves two customer systems: global retail self-custody owners and institutions using Ledger Enterprise. Public evidence strongly supports breadth — 6M-7M+ devices, 180-country reach, and 100+ institutions — and there is enough named institutional proof to show genuine market relevance. The weakness is durability: NRR, churn, MAU, replacement cadence, contract length, and concentration are all private, while trust scars from the 2020 breach and Recover backlash still matter.'
sections:
- id: customer-segmentation
  title: Customer Segmentation
  body: |-
    Ledger’s customer map is structurally bifurcated. On one side are retail self-custody users: individuals and households buying hardware signers to store and approve digital-asset transactions themselves. In that segment, buyer, user, and payer are usually the same person. On the other side are institutions using Ledger Enterprise for governed custody and digital-asset operations, where the buyer is an organization and the end users are spread across treasury, operations, compliance, and approval roles. This is not a minor distinction. Retail customers buy a product and often self-serve through the app; enterprise customers adopt a workflow that must integrate with controls, approvals, and policy infrastructure.

    Public sources consistently support both sides of the split. Company and careers pages cite millions of devices sold globally across 180 countries. Enterprise pages describe 100+ institutions worldwide, while additional workflow announcements point to stablecoin, staking, and settlement use cases. That makes Ledger unusual relative to many wallet vendors: it straddles consumer and institutional self-custody rather than serving only one side of the market.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU011
  - CU032
  tableRefs:
