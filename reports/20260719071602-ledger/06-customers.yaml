    - 6M-7M+ devices; 180 countries
    - Brand and installed-base engine
    - No retention or replacement data
  - - Active mobile-first retail users
    - Same person / household
    - Daily approvals and wallet activity on phone
    - App-store and Google Play presence
    - Drives repeat engagement and service usage
    - No MAU or DAU disclosed
  - - Advanced DeFi / multi-wallet users
    - Sophisticated retail user
    - Third-party wallet connectivity, Uniswap, cross-chain swaps
    - Supported-assets and integration pages
    - High-frequency service usage
    - No segment mix disclosed
  - - Institutions / treasury teams
    - Enterprise buyer, multiple operators
    - Custody, approvals, settlements, staking, stablecoins
    - 100+ institutions worldwide
    - Higher-quality recurring revenue potential
    - No ACV or logo concentration data
  - - Partner-led institutional users
    - Partner organization with Ledger embedded
    - Stablecoin issuance, staking, trading operations
    - AllUnity / Chorus / GlobalStake / TRADELINK cohort
    - Important reference quality and distribution leverage
    - Production depth varies by announcement
  notes: Segments separate buyer/user/payer logic and show that Ledger straddles consumer and institutional worlds. Public data is broadest on retail scale and thinnest on institutional revenue quality.
