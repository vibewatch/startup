- id: durability-and-expansion
  title: Durability and Expansion
  body: |-
    Ledger’s expansion logic is visible even if its retention metrics are not. Retail users can move from a first hardware purchase into Ledger Wallet activity, then into swaps, staking, cross-chain usage, recovery products, and eventually premium-device upgrades. Institutional users can move from custody into approvals, trading operations, staking, stablecoins, and broader treasury flows. Those paths are strategically attractive because they suggest Ledger can compound value per customer over time rather than relying only on one-time device demand.

    The public record becomes much weaker when the question shifts from expansion opportunity to durability proof. There is no disclosed NRR, GRR, churn, renewal rate, contract length, device replacement cadence, or wallet MAU. App-store presence proves a live surface, not a sticky one. Named partner announcements prove relevance, not renewal. So the durability case is plausible but not empirically underwritten from public data alone.
  claimRefs:
  - CU020
  - CU021
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
