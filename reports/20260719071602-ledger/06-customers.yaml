- id: TU006
  title: Customer evidence gaps table
  columns:
  - Gap
  - Why it matters
  - Current public proxy
  - Exact ask
  rows:
  - - Retail active users
    - Unit sales do not equal active usage
    - App-store presence and product breadth
    - Wallet MAU / DAU / WAU by platform
  - - Enterprise renewal durability
    - Logo announcements do not equal recurring revenue quality
    - 100+ institutions claim plus named partners
    - NRR, GRR, and renewal rates
  - - Geographic revenue mix
    - Global countries reached does not show monetization concentration
    - 180-country distribution claim
    - Revenue by region and channel
  - - Named customer outcomes
    - Public references lack ROI or operational metrics
    - AllUnity / Chorus / GlobalStake proof
    - Case studies with volumes, uptime, or asset balances
  - - Upgrade / replacement cycle
    - Installed base may be old or dormant
    - New device launches and touchscreens
    - Replacement cadence by device family
  - - Incident-driven churn or conversion impact
    - Trust shocks may alter customer behavior
    - Breach and Recover backlash reporting
    - Cohort conversion / churn around trust events
  notes: These gaps are the reason the customer chapter can establish breadth but not durability with precision.
