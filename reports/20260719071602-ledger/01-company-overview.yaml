  - TO004
  figureRefs:
  - FO001
- id: ipo-optionality
  title: 2025-2026 IPO Optionality
  body: |-
    The most important post-2024 development for diligence is the re-opening of capital-markets optionality. Independent 2025-2026 coverage from Crypto Briefing, Decrypt, Blockonomi, Finance Magnates, and CoinCentral consistently reports that Ledger is evaluating either a U.S. IPO or a private round, with a reported valuation target above $4 billion and Goldman Sachs, Jefferies, and Barclays involved. The same coverage relays Pascal Gauthier’s claim that Ledger reached triple-digit-million revenue in 2025 and safeguards roughly $100 billion of Bitcoin for customers. None of that is a substitute for an S-1, and market timing remains unresolved, but it does establish that Ledger entered the post-2024 period with a valuation narrative far above the 2023 flat-round mark. For later chapters, the implication is clear: Ledger is no longer being judged only as a wallet manufacturer; public markets appear ready to price it as a scaled crypto-security platform with both consumer hardware and institutional infrastructure elements.
  claimRefs:
  - CO024
  - CO025
  - CO026
  - CO027
  - CO028
