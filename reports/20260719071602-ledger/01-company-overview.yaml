- id: milestones-and-adverse-history
  title: Milestones, Product Expansion, and Adverse History
  body: |-
    The operating timeline contains both strong execution markers and one enduring trust scar. On the positive side, Ledger broadened its enterprise stack with TRADELINK in early 2024, began shipping Ledger Stax in May 2024, and reintroduced its core software layer as Ledger Wallet in August 2024. Those product markers show that Ledger is still shipping across consumer and institutional surfaces a decade after founding. On the adverse side, the 2020 e-commerce and marketing database breach remains the single most important non-fundamental risk event in the company’s public history. Company disclosures and independent breach trackers agree that the incident exposed roughly one million email addresses and a subset of more sensitive customer contact data, but not private keys or wallet balances. That distinction matters analytically: the breach did not break Ledger’s core device-security model, yet it materially damaged user trust and increased phishing and physical-security risk for customers. In other words, Ledger’s biggest public incident was not a cryptographic failure; it was a data-governance failure with persistent brand consequences.
  claimRefs:
  - CO031
  - CO032
  - CO033
  - CO034
  - CO035
  - CO036
  - CO037
