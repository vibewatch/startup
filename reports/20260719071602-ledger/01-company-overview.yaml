company:
  name: Ledger
chapter:
  number: 1
  title: Company Overview
  summary: Ledger is a Paris-founded crypto-security platform that scaled from hardware wallets into a broader consumer-plus-institutional custody stack. Public evidence supports unicorn status since 2021, a flat but resilient 2023 extension round, 7M+ devices sold, and renewed 2025-2026 capital-markets optionality around a reported $4B+ U.S. IPO target, while a 2020 customer-data breach remains the defining adverse event in the company history.
sections:
- id: identity-business-model
  title: Identity, Mission, and Product Footprint
  body: |-
    Ledger was founded in Paris in 2014 and has grown from a hardware-wallet specialist into a broader digital-asset security platform. Official pages frame the company around one core mission: securing digital value through offline devices, companion software, and an institutional infrastructure layer. That positioning matters because Ledger is no longer just a one-product wallet vendor; the current stack spans consumer signers, the Ledger Wallet app formerly known as Ledger Live, and the Ledger Enterprise platform for institutions. The product surface is broad enough to support retail, Web3, and treasury-style workflows, but the underlying thesis remains constant: keep private keys off general-purpose internet-connected devices while still making digital assets usable day to day. Public materials also make clear that the consumer lineup has expanded beyond the legacy Nano range to include premium touchscreen devices such as Stax and Flex, reinforcing a strategy that mixes mass-market backup devices with higher-end daily-use hardware.
  claimRefs:
  - CO001
  - CO004
  - CO005
  - CO006
  - CO017
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: leadership-and-corporate-footprint
  title: Leadership, Founders, and Corporate Footprint
  body: |-
    Leadership evidence is stronger for the current operating chief than for the complete founding bench. Business Wire’s 2021 Series C release explicitly identified Pascal Gauthier as Chairman and CEO, while 2024 company posts show he still acts as Ledger’s main public voice on sensitive issues such as Recover and Stax shipping. Founder history is less cleanly documented first-party: the official people page says Ledger was launched by eight experts, while third-party company-profile data names Éric Larchevêque, Nicolas Bacca, and Vanessa Fara Fara Rabesandratana among the founders. Scale disclosures also need nuance. The current company page says Ledger has 700-plus employees across eight offices, but other live official pages still show 600-plus employees and nine offices. The locations page nonetheless gives a credible current office map anchored in Paris, Vierzon, Montpellier, London, New York, Zurich, Singapore, and Portland, which is directionally consistent with Ledger’s profile as a French-headquartered company with meaningful international go-to-market reach.
  claimRefs:
  - CO002
  - CO003
  - CO009
  - CO010
  - CO011
  - CO013
  - CO014
  - CO038
  tableRefs:
  - TO002
- id: capitalization-and-scale
  title: Funding History, Investors, and Current Scale Markers
  body: |-
    Ledger’s capital path shows a company that achieved unicorn status well before the 2025-2026 IPO window and then preserved that valuation through a much harder crypto market. The June 2021 Series C brought in $380 million at a valuation above $1.5 billion, backed by a heavyweight syndicate led by 10T Holdings and joined by Cathay Innovation, multiple Draper vehicles, DCG, Korelya Capital, and Wicklow Capital. In March 2023, Ledger added another €100 million in a flat extension round at roughly €1.3 billion, with new investors such as True Global Ventures, VaynerFund, and Digital Finance Group. Operationally, the company continued to scale through the post-FTX self-custody wave: TechCrunch reported six million devices sold by March 2023 and one million units sold in the prior nine months, while current company pages now cite more than seven million devices sold and service in 180 countries. Public disclosures remain thin on revenue mix and board economics, but they are sufficient to establish a well-capitalized global category leader rather than a niche accessory maker.
  claimRefs:
  - CO007
  - CO008
  - CO018
  - CO019
  - CO020
  - CO021
