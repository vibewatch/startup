  topStrengths:
    - 在自托管公司里，Ledger 的装机基础、品牌和产品宽度都很强：已售出 7M+ 台设备，并拥有完整的钱包 / 恢复 / 企业堆栈。
    - 公开报道显示 2025 年收入达到数亿美元，说明公司在任何 IPO 前已经具备有意义规模。
    - Ledger Enterprise 通过托管、审批、稳定币、staking 和交易邻近工作流，提供可信的第二增长引擎。
    - 安全架构和 clear-signing 叙事，让 Ledger 相比纯软件钱包和更窄的托管同行有差异化产品故事。
    - BitGo、Circle、Coinbase、Kraken 等 crypto-infrastructure 可比公司估值，让数十亿美元结果显得可能，而不是空想。
  topRisks:
    - 准确收入、毛利率、NRR、企业 ACV 和现金状况均未披露，无法高置信度承保估值。
    - $4B+ 目标意味着相对 2023 年私募标记有大幅上调；如果经常性收入质量弱于叙事，估值可能已经偏满。
    - 品牌信任是真正的估值变量：2020 年数据泄露和 Recover 反弹都说明，安全感知会移动客户情绪。
    - 除硬件信任根外，Ledger 还依赖周边软件、app-store、合作伙伴和企业对手方生态。
    - 公开 crypto-infrastructure 可比公司仍波动很大，即便 Ledger 运营执行到位，倍数压缩风险也真实存在。
  unresolvedGaps:
    - 经审计的 2025 年收入和 2026 年运行率，而不只是“数亿美元”。
    - 硬件、软件 / 钱包服务、恢复和企业业务线的毛利率拆分。
    - NRR、GRR、流失、企业 ACV 和最大客户集中度。
    - 股权结构 / 优先权细节，以及 2023 年私募标记与潜在 IPO 之间的任何悬置压力。
    - 信任事件对转化、流失或扩张的量化影响。
