  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-estimates
    missingEvidence: A consistent third-party market model that isolates hardware-only revenue, institutional order value, and software attach for the same base year.
    whyItMatters: Current market reports disagree meaningfully on present size and future growth, which weakens TAM precision and valuation modeling.
    diligencePath: Request management’s internal TAM model and compare it against one banker-grade external market study with transparent methodology.
    relatedQuestionRefs:
    - QM024
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: ledger-sam
    missingEvidence: Ledger’s own installed-base segmentation, attach rates, and repeat-purchase curves by geography and product tier.
    whyItMatters: Without conversion and attach data, the report cannot turn category growth into a defendable Ledger-specific SAM/SOM forecast.
    diligencePath: Request cohort data for device sales, Wallet active users, enterprise pipeline, and service attach by region and product line.
    relatedQuestionRefs:
    - QM020
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: minor
    topic: institutional-pipeline
    missingEvidence: Pipeline and ACV data showing how many institutions move from evaluation to live deployment.
    whyItMatters: Enterprise demand is clearly rising, but the market chapter cannot quantify conversion or order-value durability from public evidence alone.
    diligencePath: Request enterprise pipeline funnel, contract values, and time-to-launch metrics from the Ledger Enterprise team.
    relatedQuestionRefs:
    - QM006
    - QM022
    relatedTableRefs:
    - TM003
  - type: stale
    severity: minor
    topic: forecast-refresh
