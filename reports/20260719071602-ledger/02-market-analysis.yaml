chapter:
  number: 2
  title: Market Analysis
  summary: Ledger operates in a fast-growing but still sub-scale dedicated hardware-wallet market that sits inside a much larger crypto-wallet ecosystem. Demand is being pulled by self-custody awareness, theft-driven security fears, MiCA-era regulatory clarity, and growing institutional stablecoin/tokenization workflows, but precise Ledger-specific SAM and conversion rates remain underdocumented publicly.
sections:
- id: market-boundary
  title: Market Boundary and Substitutes
  body: |-
    Ledger does not sell into “all crypto” so the market boundary has to be drawn carefully before any sizing is useful. The relevant market begins with secure self-custody hardware and the software and policy stack directly attached to it. It includes retail hardware devices, the companion wallet experiences that make those devices usable, and institutional key-management / governance infrastructure for firms that want control without leaving assets on exchanges. It excludes pure exchange custody balances that never migrate off-platform, speculative token trading volume that stays inside custodial apps, and unrelated blockchain tooling. This framing matters because the broader crypto-wallet ecosystem is dramatically larger than the dedicated hardware-wallet segment: Datawallet’s broad wallet statistics land in the tens of billions of dollars, while dedicated hardware-wallet analysts still describe a sub-$1 billion market in 2025-2026. The implication is that Ledger is targeting a narrower but higher-value slice where security, trust, and process control matter more than raw wallet MAUs.
  claimRefs:
  - CM004
  - CM012
  - CM026
  - CM031
  - CM035
  - CM036
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: market-size-and-growth
  title: Category Size, Growth, and Geography
  body: |-
    Public market reports are directionally aligned but not numerically identical. Mordor Intelligence and Research and Markets both put the 2026 dedicated hardware-wallet category at roughly $0.72 billion, but they diverge on 2031 endpoints, with forecasts spanning roughly $2.25 billion to $2.58 billion. Strategic Market Research starts from a lower 2024 base of about $370 million and reaches about $1.52 billion by 2030. Taken together, the key takeaway is not a single magical TAM number; it is that hardware wallets are still a relatively small market today but are growing materially faster than many adjacent hardware categories. Geography matters as well. Mordor says North America contributes almost 39% of current revenue, while Europe benefits from clearer regulation and Asia-Pacific remains a major growth frontier for mobile-first crypto behavior. The market therefore has genuine scale potential, but it is still early enough that execution, branding, and software attach can move share more than brute-force saturation.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM009
  - CM010
  - CM039
  tableRefs:
  - TM002
  figureRefs:
