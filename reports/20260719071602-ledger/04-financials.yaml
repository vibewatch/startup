- id: capital-structure-and-ipo-optionality
  title: Capital Structure and IPO Optionality
  body: |-
    Ledger’s late-stage capitalization is well documented even though operating detail is sparse. Business Wire reported a $380 million Series C in June 2021 at a valuation above $1.5 billion. The company said at the time that it was rapidly growing and profitable, and the investor roster included 10T plus a deep group of existing and new backers. In March 2023, TechCrunch reported a further €100 million (~$108 million) extension at an unchanged ~€1.3 billion / $1.41 billion valuation; Crowdfund Insider described the same event as flat rather than down, which matters because it shows Ledger could still raise growth capital during a harsh crypto bear market.

    Third-party database coverage from The Company Check puts cumulative equity funding at roughly $575.4 million across seven rounds, listing the latest round at $109 million and the valuation at $1.41 billion as of March 2023. More recently, Crypto Briefing reported that Ledger is exploring a US IPO with Goldman Sachs, Jefferies, and Barclays at a target valuation above $4 billion, while multiple outlets said 2025 revenue reached triple-digit millions and roughly $100 billion of bitcoin was being safeguarded for customers. If those operating-scale reports are directionally right, Ledger does not look capital constrained; it looks like a company deciding whether public markets can re-rate a hybrid hardware-plus-security platform meaningfully above its last private mark.
