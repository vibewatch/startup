- id: recurring-revenue-layers
  title: Recurring Revenue Layers
  body: |-
    The cleanest publicly visible recurring line today is Ledger Recover. The product page exposes the mechanics directly: one month free, automatic monthly renewal, and country-eligibility / identity-verification requirements through Coincover. Ledger’s technical white-paper announcement goes further and explicitly labels Recover as an opt-in paid subscription service. That makes Recover unusually helpful for diligence because it is one of the few places where Ledger discloses not only product architecture but also enough commercial detail to infer a real subscription business.

    Ledger Recovery Key adds a second monetization layer with a different logic. It is not recurring software; it is an accessory and attach-rate product. Ledger disclosed list pricing of $39 for a single key and $99 for a three-pack while also bundling it free with new touchscreen devices, suggesting a deliberate effort to reduce recovery anxiety and widen conversion among exchange users and software-wallet users. On the institutional side, the pattern is different again. Ledger Enterprise, TRADELINK, the mobile approval app, and the TRON expansion all point to contract-style workflow revenue rather than per-device sales or per-trade tolls. In fact, TRADELINK explicitly says Ledger will not charge transaction fees, which implies that monetization likely comes through broader software contracts, platform inclusion, or enterprise expansion rather than direct trading spreads.
