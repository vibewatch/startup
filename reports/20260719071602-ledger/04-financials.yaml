company:
  name: Ledger
chapter:
  number: 4
  title: Financials
  summary: Ledger’s financial model has evolved from one-time hardware sales into a hybrid stack that now visibly includes wallet-service activity, Recover subscriptions, accessories, and enterprise contracts. Late-stage funding is well documented ($380M Series C in 2021; €100M extension in 2023; ~$575M cumulative funding), and 2025/2026 reporting points to triple-digit-million revenue plus a possible US IPO at $4B+. The strategic direction is attractive, but exact revenue mix, gross margin, NRR, CAC, burn, and cash remain undisclosed.
sections:
- id: revenue-model-and-traction
  title: Revenue Model and Traction
  body: |-
    Ledger’s financial story is best understood as a hybrid model anchored by hardware but increasingly layered with software and service monetization. The device sale is still the opening economic event: millions of consumers have bought Ledger hardware, and the public sold-device range now spans roughly 7 million to 8 million units. That installed base matters because every device also creates an on-ramp into Ledger Wallet / Ledger Live, where users can buy, sell, swap, stake, spend, and manage portfolios inside the Ledger ecosystem rather than treating the signer as a dormant vault.

    Public reporting from both 2021 and 2023 supports this diversification thesis. Ledger said in its 2021 Series C announcement that consumer transaction revenue from Ledger Live and enterprise revenue from Ledger Vault were already diversifying the business beyond core consumer hardware. TechCrunch repeated that framing in 2023, noting that Ledger Live generated revenue from staking opportunities and third-party integrations while the hardware business still performed very well. That combination is important: Ledger is not a pure SaaS business, but it is also not just a gadget vendor. It is trying to turn security hardware into a durable distribution channel for higher-frequency software and service monetization.
