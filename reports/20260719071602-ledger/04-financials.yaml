- id: TI001
  title: Revenue streams
  columns:
  - Revenue stream
  - Mechanism
  - Pricing visibility
  - Revenue quality
  - Public evidence
  rows:
  - - Hardware devices
    - One-time sale of Nano / Flex / Stax family through Ledger and retail channels
    - Partial — lineup public, most live prices not reliably captured in fetched text
    - Medium — transactional but high-volume and brand-building
    - 7M+ to 8M+ devices sold; multi-tier lineup
  - - Ledger Wallet / Ledger Live services
    - Buy, sell, swap, stake, earn, spend, and partner-service activity inside the wallet app
    - Low — no public revenue take-rate disclosed
    - Medium-to-high — repeat engagement and partner economics possible
    - App store copy and 2021/2023 reporting cite transaction, staking, and integration revenue
  - - Ledger Recover
    - Opt-in subscription for identity-linked backup and recovery
    - Moderate — free trial, auto-renewal, and monthly billing terms are public
    - High — recurring subscription line
    - Recover page and white paper describe optional paid subscription
  - - Ledger Recovery Key
    - Offline accessory / spare-key product attached to touchscreen devices
    - High — $39 single / $99 three-pack publicly disclosed
    - Low-to-medium — accessory revenue plus attach lift
    - Recovery Key launch post provides list pricing and bundling
  - - Ledger Enterprise platform
    - Institutional governance, treasury, stablecoin, and approval workflows under contract
    - Low — no list pricing disclosed
    - High — contract software / workflow revenue
    - Enterprise site, mobile-app page, and TRON post describe active client workflows
  - - TRADELINK
    - Institutional trading network embedded in Ledger Enterprise
    - Partial — zero transaction fees disclosed, but no contract price
    - Medium — relationship-expansion and platform stickiness
    - TRadelink launch says early access at no additional cost and no per-transaction fee
  notes: Public evidence supports six monetization surfaces, but exact revenue mix by line is undisclosed. TRADELINK is strategically meaningful even though direct monetization mechanics are not fully public.
