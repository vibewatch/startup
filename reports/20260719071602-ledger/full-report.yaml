      - number: '3.3'
        title: Feature and Packaging Battle
        blocks:
          - type: paragraph
            body: >-
              Visible product differentiation increasingly comes down to packaging and workflow fit. Ledger itself now
              segments the line between classic backup devices and premium secure-touchscreen daily-use devices, with
              Nano S Plus and Nano X covering lower-friction entry points and Flex / Stax covering higher-end
              interactions. Trezor’s newer lineup answers with more modern screens, Bluetooth, and EAL6+ secure
              elements. Coldcard competes by rejecting broad-chain convenience entirely and going all-in on Bitcoin
              security with QR, microSD, and NFC signing. BitBox02 and Passport each combine strong security signals
              with a more enthusiast-oriented user experience. This means Ledger no longer competes in a flat market of
              interchangeable USB sticks; it competes in several overlapping subsegments defined by open-source trust,
              touchscreen UX, mobile convenience, and institutional adjacency.
