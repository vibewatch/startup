      - number: '3.4'
        title: Moat and Risk Assessment
        blocks:
          - type: paragraph
            body: >-
              Ledger’s publicly observable moat indicators are real but incomplete. The biggest positives are the
              installed base, the companion app layer, the multi-tier hardware catalog, and the existence of Ledger
              Enterprise as an institutional second act. Together, those assets can create switching costs and broaden
              monetization beyond one-time device sales. The biggest public risks are also clear. Open-source
              competitors have a cleaner narrative with some security-purist buyers. MetaMask and Trust Wallet have
              software distribution and engagement power that can starve hardware conversion until users feel pain.
              BitGo and Fireblocks push the institutional battle into controls and workflow depth where brand equity
              alone is not enough. Recent software-wallet security incidents do strengthen Ledger’s offline-key thesis,
              but they do not prove that Ledger wins more often or retains users better. Public data still lacks
              win/loss, NRR, churn, or attach-rate evidence, so the moat case remains directionally positive rather than
              fully underwritten. One more subtle risk is pace: software wallets can ship features weekly while hardware
              refresh cycles are slower and inventory-bearing. If Ledger does not keep the app layer compelling enough
              between device cycles, it could lose the daily relationship even while remaining the secure vault in a
              drawer. That is strategically dangerous because the market increasingly rewards the vendor that owns both
              trust and habit. For diligence, the most important unresolved commercial question is whether Ledger
              remains the default upgrade path once software-wallet users accumulate enough assets to care deeply about
              key isolation.
