        title: Trust and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              The largest customer-quality risk is trust rather than raw demand. Ledger’s historical data breach exposed
              customer information including names, phone numbers, and physical addresses, creating a durable scar with
              exactly the kind of security-sensitive buyer that the company serves. The Recover controversy is a second,
              very different trust issue: some users read the optional convenience service as evidence that security
              boundaries were looser than they believed. Both events matter because Ledger’s customer base is unusually
              sensitive to brand credibility and perceived architectural purity.


              Concentration is the other unresolved issue. Public sources prove breadth, but not economic
              diversification. Ledger may have millions of unit buyers and 100+ institutions, yet there is still no
              public breakdown of revenue by geography, channel, device family, or top accounts. That means the customer
              chapter can support a positive adoption thesis, but not a fully underwritten durability thesis. The next
              diligence step is to request active-user, renewal, and concentration data rather than more logos.
