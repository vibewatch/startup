chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Product Footprint
        blocks:
          - type: paragraph
            body: >-
              Ledger was founded in Paris in 2014 and has grown from a hardware-wallet specialist into a broader
              digital-asset security platform. Official pages frame the company around one core mission: securing
              digital value through offline devices, companion software, and an institutional infrastructure layer. That
              positioning matters because Ledger is no longer just a one-product wallet vendor; the current stack spans
              consumer signers, the Ledger Wallet app formerly known as Ledger Live, and the Ledger Enterprise platform
              for institutions. The product surface is broad enough to support retail, Web3, and treasury-style
              workflows, but the underlying thesis remains constant: keep private keys off general-purpose
              internet-connected devices while still making digital assets usable day to day. Public materials also make
              clear that the consumer lineup has expanded beyond the legacy Nano range to include premium touchscreen
              devices such as Stax and Flex, reinforcing a strategy that mixes mass-market backup devices with
              higher-end daily-use hardware.
