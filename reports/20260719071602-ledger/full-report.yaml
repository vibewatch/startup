      - number: '5.4'
        title: Trust, Safety, and Technical Verdict
        blocks:
          - type: paragraph
            body: >-
              Ledger’s product thesis is strongest when the question is “where should the private key live and where
              should the final approval happen?” The public answer is coherent: on a Secure Element, under Ledger OS
              isolation, with a secure screen, a PIN, and physically confirmed signatures. Recovery Key extends that
              worldview to an offline backup accessory, and the Recover white paper shows that Ledger understands the
              need to document cryptographic and operational flows in more detail than marketing copy alone.


              The trust picture is still not perfectly clean. The Recover backlash showed that even an optional
              convenience layer can be interpreted by security-purist customers as a violation of earlier assumptions.
              More broadly, public materials still lack the hardest product-operations numbers: hardware failure rates,
              wallet-app crash metrics, support-ticket load, successful recovery rates, enterprise deployment breadth,
              and independent quantitative audit outcomes. The technical verdict is therefore positive on architecture
              and product breadth, but incomplete on operational proof. Ledger looks like a serious, mature
              hardware-security platform; the remaining diligence work is to verify reliability, support burden, and
              ecosystem bottlenecks with data rather than diagrams.
            claimRefs:
              - CE020
              - CE021
              - CE033
