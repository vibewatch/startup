      - number: '7.2'
        title: Security, Operational, and Trust Risks
        blocks:
          - type: paragraph
            body: >-
              Ledger’s core operational reality is that it defends users in one of the most adversarial environments in
              consumer technology. Chainalysis and related reporting show that crypto theft, hacking, and
              physical-coercion risks remain elevated. That context helps demand, but it also makes any weakness more
              expensive. The 2020 breach remains relevant because exposed customer data can enable targeted phishing and
              coercion. The Recover backlash matters for a different reason: it showed that users do not just evaluate
              whether a feature is technically optional; they also evaluate whether it violates the philosophical
              boundary they believed the product embodied.


              Blind signing and transaction-manipulation risk remain especially important. Ledger’s clear-signing work
              is a serious mitigation, and the company has been public about that posture, but the problem is not fully
              solved whenever unsupported flows, weak metadata, or social engineering push users outside the clearest
              paths. Similarly, Recovery Key, Recover documentation, Donjon testing, and security-program materials all
              signal maturity, yet public sources still do not quantify hardware defect rates, exploit attempts, app
              crash rates, or support load. The security architecture is credible; the residual trust risk is still
              material.
