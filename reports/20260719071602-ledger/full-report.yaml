      - number: '8.3'
        title: Recommendation and Risk-Adjusted View
        blocks:
          - type: paragraph
            body: >-
              The bull case for Ledger is strong in words: category-leading installed base, strong security brand, a
              full-stack user journey from signer to app to recovery, early enterprise breadth, and a crypto-security
              cycle that still rewards trusted infrastructure. The bear case is strong in numbers that are missing: no
              exact 2025 revenue, no margin structure, no NRR, no cash balance, and no disclosed concentration profile.
              Those missing facts matter because they determine whether a $4B price is a sensible premium or an
              overreach dressed up as platform optionality.


              The most defensible call from public sources is therefore conditional positive / track. Ledger looks like
              a company worth doing more work on, not a company that can be underwritten aggressively at a headline
              aspiration without price discipline. At or below a meaningful discount to $4B, or with a data room that
              proves recurring mix and margin quality, the case strengthens materially. At a full $4B+ without those
              disclosures, the stance shifts from attractive to fair-to-full.
            claimRefs:
