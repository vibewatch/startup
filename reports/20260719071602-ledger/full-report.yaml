      - number: '8.4'
        title: Final Diligence Gates
        blocks:
          - type: paragraph
            body: >-
              The valuation is ultimately gated by a small set of questions that management can answer quickly if the
              business is truly as strong as the narrative suggests. Exact 2025 revenue and 2026 run-rate tell investors
              where in the “triple-digit millions” band Ledger actually sits. Gross margin by line tells investors
              whether the business deserves software-like or hardware-like treatment. NRR, churn, enterprise ACV, and
              top-customer exposure tell investors whether the platform thesis is durable or simply broad. Cap-table and
              preference detail tell investors whether the last private mark understates or overstates real entry risk.


              Until those facts are disclosed, the right posture is evidence-sensitive. Ledger is not overruled by weak
              strategy; it is constrained by incomplete public economics. That distinction is exactly why the
              recommendation is not avoid, but track with discipline.
