      - number: '2.3'
        title: Buyer Segments and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Buyer segmentation is heterogeneous. Retail long-term holders buy hardware for vault-like cold storage;
              active multi-chain users buy it to reduce daily signing risk while still using DeFi, staking, and NFTs;
              high-net-worth users care about wealth protection and inheritance workflows; and institutions treat the
              problem as governed treasury infrastructure. In the retail segment, buyer, user, and payer are usually the
              same person, so the adoption path is emotional and event-driven: a hack, exchange failure, or rapid
              appreciation in holdings pushes users toward self-custody. In the institutional segment, buyer, user, and
              payer split across product, treasury, operations, compliance, and security stakeholders, so the adoption
              path looks more like enterprise software procurement than consumer electronics. That distinction explains
              why the market now supports both low-cost backup devices and richer daily-use touchscreens as well as
              policy-enforced enterprise stacks. Ledger’s market is therefore best understood as a ladder: software or
              exchange first, then hardware self-custody, then multi-person governance once balances and complexity
              justify it.
