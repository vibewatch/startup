      - number: '4.4'
        title: Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              The positive case is straightforward. Ledger has a globally recognized hardware brand, a massive installed
              base, visible product expansion into wallet services and recovery, a credible institutional platform, and
              a capital history that suggests strong investor support. Public sources increasingly describe the company
              as something richer than a hardware wallet maker: a security platform with transaction, subscription,
              accessory, and enterprise software layers. That mix is strategically attractive because it can improve
              revenue quality over time if the recurring layers scale faster than the underlying device refresh cycle.


              The negative case is equally clear: almost every metric needed to underwrite that improvement is private.
              The public record does not disclose exact annual revenue, service-revenue mix, gross margin, cash balance,
              CAC, NRR, enterprise ACV, or burn. Even the headline revenue data is only “triple-digit millions,” which
              is directionally useful but too imprecise for valuation work. As a result, Ledger’s financial profile is
              strategically positive but analytically incomplete. A premium underwriting case requires management
              disclosure on mix, margins, and retention before the $4B+ IPO narrative can be treated as more than
              plausible market ambition.
