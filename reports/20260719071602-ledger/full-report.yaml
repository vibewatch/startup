      - number: '1.3'
        title: Funding History, Investors, and Current Scale Markers
        blocks:
          - type: paragraph
            body: >-
              Ledger’s capital path shows a company that achieved unicorn status well before the 2025-2026 IPO window
              and then preserved that valuation through a much harder crypto market. The June 2021 Series C brought in
              $380 million at a valuation above $1.5 billion, backed by a heavyweight syndicate led by 10T Holdings and
              joined by Cathay Innovation, multiple Draper vehicles, DCG, Korelya Capital, and Wicklow Capital. In March
              2023, Ledger added another €100 million in a flat extension round at roughly €1.3 billion, with new
              investors such as True Global Ventures, VaynerFund, and Digital Finance Group. Operationally, the company
              continued to scale through the post-FTX self-custody wave: TechCrunch reported six million devices sold by
              March 2023 and one million units sold in the prior nine months, while current company pages now cite more
              than seven million devices sold and service in 180 countries. Public disclosures remain thin on revenue
              mix and board economics, but they are sufficient to establish a well-capitalized global category leader
              rather than a niche accessory maker.
