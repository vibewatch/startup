  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risks
        blocks:
          - type: paragraph
            body: >-
              Ledger is not simply exposed to generic “crypto regulation.” Its risk surface sits in the overlap between
              hardware self-custody, wallet-linked services, enterprise infrastructure, and consumer trust obligations.
              MiCA matters because Europe is moving toward a more explicit rule set around crypto disclosures, market
              conduct, and operational accountability. Even where Ledger is not itself a traditional custodian or
              exchange, its Wallet and Enterprise layers increasingly touch regulated workflows and therefore regulatory
              expectations. On top of that, cross-border promotions and wallet-linked offers create legal complexity
              around terms, disclosures, eligibility, and consumer treatment.


              The 2020 customer-data breach adds a second legal dimension. Ledger says it fixed the issue immediately
              after a researcher report, but independent sources still show a meaningful set of personal data was
              exposed. For a company whose brand is fundamentally about security, privacy and data-handling failures
              carry more than ordinary legal cost: they become part of the commercial trust model. Public legal and
              regulatory evidence does not show an existential threat today, but it does show continuing exposure that
              must be actively managed.
            claimRefs:
