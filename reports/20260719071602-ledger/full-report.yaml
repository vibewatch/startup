  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Ledger’s architecture separates key custody, transaction presentation, app UX, and network access into distinct
      layers.
    data:
      layers:
        - label: User / operator
          detail: >-
            Retail owners and institutional approvers initiate operations and must confirm intent on a device they
            control.
        - label: Secure device layer
          detail: >-
            Secure Element hardware, Ledger OS / BOLOS, and device apps hold keys, verify transaction details, and
            produce signatures.
        - label: Interaction layer
          detail: Secure screen, clear-signing, PIN checks, and recovery workflows mediate what the user actually approves.
        - label: Host software layer
          detail: >-
            Ledger Wallet, the enterprise mobile app, and Ledger Manager handle UI, updates, orchestration, and app
            distribution.
        - label: External service layer
          detail: >-
            Blockchain nodes, DeFi / staking partners, and institutional counterparties provide connectivity and
            execution beyond the device.
    claimRefs:
      - CE005
      - CE006
      - CE010
      - CE013
      - CE019
      - CE022
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: Shows the standard retail signing flow and where Ledger inserts security checks.
    data:
      nodes:
        - id: N1
          label: Open wallet app
          note: User opens Ledger Wallet on desktop or mobile
        - id: N2
          label: Build unsigned transaction
          note: Host app handles balances, fees, and UI composition
        - id: N3
          label: Send to signer
          note: Transaction forwarded over USB or Bluetooth
        - id: N4
          label: Review on secure screen
          note: Clear-signing and human-readable confirmation happen on device
        - id: N5
          label: Sign and broadcast
          note: Signature returns to host app which broadcasts to network
      edges:
        - from: N1
          to: N2
          label: Prepare action
        - from: N2
          to: N3
          label: Forward unsigned payload
        - from: N3
          to: N4
          label: Device review
        - from: N4
          to: N5
          label: Approve and submit
