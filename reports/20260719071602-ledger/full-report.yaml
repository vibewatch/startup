      - number: '8.2'
        title: Valuation Framework and Comparables
        blocks:
          - type: paragraph
            body: >-
              The hardware-wallet TAM by itself does not justify a $4B valuation. Multiple analyst reports still place
              the current dedicated hardware-wallet market near $0.72 billion in 2026, which means a $4B Ledger mark
              only makes sense if investors believe the company participates in a much larger platform opportunity
              spanning wallet services, recovery, and enterprise operations. That is the conceptual bridge from category
              TAM to platform value.


              Comparable signals are mixed but useful. BitGo’s $2.2B IPO shows custody infrastructure can clear a
              multi-billion-dollar public valuation with narrower consumer reach. Circle’s $15-$16B public market cap
              and Coinbase’s ~$41.39B market cap show how much higher liquid crypto platforms can trade when scale and
              disclosure are strong. Kraken’s reported $15B-$20B private range suggests private capital still prices
              major crypto infrastructure aggressively. A $4B Ledger IPO would therefore slot above BitGo but far below
              Circle, Kraken, and Coinbase. That positioning is plausible — but only if Ledger’s hybrid model is real
              enough to deserve a platform premium and not just a hardware premium.
            claimRefs:
              - CV011
              - CV012
              - CV013
