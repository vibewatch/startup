      - number: '7.3'
        title: Dependency and Execution Risks
        blocks:
          - type: paragraph
            body: >-
              The Secure Element and Ledger OS are only the center of the system, not the whole system. Ledger Manager
              is the sole distribution path for apps and firmware. The wallet app depends on app stores and a broad
              provider layer for on-ramps, swaps, and staking. TRADELINK and Enterprise depend on an even wider web of
              custodians, exchanges, brokers, and counterparties. That means the company can build a strong security
              core while still inheriting meaningful dependency risk at the perimeter. A partner exit, jurisdictional
              restriction, review delay, or workflow bug can hurt customers even if the chip itself remains secure.


              Execution risk compounds this. Ledger’s global footprint and enterprise ambitions require disciplined
              coordination across engineering, security, support, communications, compliance, and customer success. The
              Recover episode demonstrated that communication itself can be a risk multiplier. Enterprise workflow
              features such as mobile approvals and stablecoin operations deepen the value proposition, but they also
              increase the number of human, operational, and partner points where failure can become customer-visible.
              The key diligence question is therefore not only whether Ledger’s architecture is strong, but whether the
              organization can operate that architecture consistently under stress.
