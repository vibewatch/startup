companyProfile:
  summary: >-
    Ledger is a French digital-security company best known for hardware cryptocurrency wallets, but its current product
    and revenue story is broader than a device maker. Founded in 2014 in Paris, Ledger built a large installed base of
    consumer self-custody users around Nano, Flex, and Stax signers, then layered Ledger Wallet / Ledger Live, recovery
    products, and Ledger Enterprise institutional workflows on top. Public sources point to 7M+ devices sold, 100+
    institutions, a 2023 private valuation around $1.41B, and 2025 revenue in the triple-digit millions. The business
    appears strategically significant, but core underwriting metrics such as exact revenue, gross margin, NRR,
    enterprise ACV, and cash burn remain private.
