      - number: '3.2'
        title: Software and Institutional Substitutes
        blocks:
          - type: paragraph
            body: >-
              Ledger is also competed away from two sides that do not look like classic device peers. On the
              low-friction side, MetaMask and Trust Wallet can onboard users into crypto, DeFi, swaps, and staking
              without requiring a hardware purchase up front. That distribution power can delay or even displace
              conversion to hardware unless security shocks or wealth accumulation create urgency. On the other side,
              BitGo and Fireblocks expand the comparison set for institutions that want stablecoin, tokenization, or
              regulated treasury workflows. In those cases the buyer is not comparing Nano X to Trezor; the buyer is
              comparing entire control stacks, policy engines, and operational models. Ledger Enterprise helps close
              that gap, but it also means Ledger’s moat has to hold simultaneously against consumer-app convenience and
              enterprise infrastructure scale.
