            body: >-
              Leadership evidence is stronger for the current operating chief than for the complete founding bench.
              Business Wire’s 2021 Series C release explicitly identified Pascal Gauthier as Chairman and CEO, while
              2024 company posts show he still acts as Ledger’s main public voice on sensitive issues such as Recover
              and Stax shipping. Founder history is less cleanly documented first-party: the official people page says
              Ledger was launched by eight experts, while third-party company-profile data names Éric Larchevêque,
              Nicolas Bacca, and Vanessa Fara Fara Rabesandratana among the founders. Scale disclosures also need
              nuance. The current company page says Ledger has 700-plus employees across eight offices, but other live
              official pages still show 600-plus employees and nine offices. The locations page nonetheless gives a
              credible current office map anchored in Paris, Vierzon, Montpellier, London, New York, Zurich, Singapore,
              and Portland, which is directionally consistent with Ledger’s profile as a French-headquartered company
              with meaningful international go-to-market reach.
