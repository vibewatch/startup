  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Ledger does not sell into “all crypto” so the market boundary has to be drawn carefully before any sizing
              is useful. The relevant market begins with secure self-custody hardware and the software and policy stack
              directly attached to it. It includes retail hardware devices, the companion wallet experiences that make
              those devices usable, and institutional key-management / governance infrastructure for firms that want
              control without leaving assets on exchanges. It excludes pure exchange custody balances that never migrate
              off-platform, speculative token trading volume that stays inside custodial apps, and unrelated blockchain
              tooling. This framing matters because the broader crypto-wallet ecosystem is dramatically larger than the
              dedicated hardware-wallet segment: Datawallet’s broad wallet statistics land in the tens of billions of
              dollars, while dedicated hardware-wallet analysts still describe a sub-$1 billion market in 2025-2026. The
              implication is that Ledger is targeting a narrower but higher-value slice where security, trust, and
              process control matter more than raw wallet MAUs.
