      - number: '2.2'
        title: Category Size, Growth, and Geography
        blocks:
          - type: paragraph
            body: >-
              Public market reports are directionally aligned but not numerically identical. Mordor Intelligence and
              Research and Markets both put the 2026 dedicated hardware-wallet category at roughly $0.72 billion, but
              they diverge on 2031 endpoints, with forecasts spanning roughly $2.25 billion to $2.58 billion. Strategic
              Market Research starts from a lower 2024 base of about $370 million and reaches about $1.52 billion by
              2030. Taken together, the key takeaway is not a single magical TAM number; it is that hardware wallets are
              still a relatively small market today but are growing materially faster than many adjacent hardware
              categories. Geography matters as well. Mordor says North America contributes almost 39% of current
              revenue, while Europe benefits from clearer regulation and Asia-Pacific remains a major growth frontier
              for mobile-first crypto behavior. The market therefore has genuine scale potential, but it is still early
              enough that execution, branding, and software attach can move share more than brute-force saturation.
