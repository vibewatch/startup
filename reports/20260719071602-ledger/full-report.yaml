  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct Hardware Peers
        blocks:
          - type: paragraph
            body: >-
              Ledger’s clearest direct competition still comes from other hardware-first self-custody devices, but those
              peers cluster into very different philosophies. Trezor is the broadest like-for-like consumer rival and
              leans hard into open-source transparency. Coldcard is the opposite: Bitcoin-only, air-gapped, and
              intentionally hostile to mainstream convenience. BitBox02 sits between those poles with a more minimalist
              and audit-friendly design, while Foundation Passport pushes a premium Bitcoin-sovereignty pitch. Relative
              to those peers, Ledger’s advantage is breadth: multiple device tiers, strong mobile pairing, a branded
              wallet app, and an institutional extension. Its disadvantage is that sovereignty-first users often prefer
              verifiable openness or narrower scope to integrated convenience. The competitive question is therefore not
              who has one “best” wallet, but which security philosophy wins each user segment.
            claimRefs:
