      - number: '7.4'
        title: Mitigation and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Ledger does have visible mitigations. It publicly emphasizes Secure Element isolation, Ledger OS
              separation, clear-signing, phishing education, continuous Donjon testing, documented recovery protocols,
              and optional backup design. Those are meaningful controls and should stop a reviewer from reducing the
              risk chapter to generic crypto fear. But the unresolved question is empirical: are those controls keeping
              pace with a threat environment that is expanding in both technical sophistication and social-engineering
              pressure?


              The cleanest way to manage that uncertainty is through measurable kill criteria. Another material
              customer-data event, a signing-flow exploit, regulator action that impairs wallet or enterprise services,
              repeated partner failures, or evidence that trust shocks are suppressing conversion would all be
              thesis-relevant. The risk verdict is therefore balanced but stern: Ledger’s architecture is defensible,
              yet its operating environment is harsh enough that risk management must be treated as a core product
              function, not a support function.
