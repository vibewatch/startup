    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis and Current Context
        blocks:
          - type: paragraph
            body: >-
              Ledger’s valuation debate starts with a mismatch between what the company clearly is and what the public
              market can currently prove. Strategically, Ledger looks better than a narrow hardware vendor: more than 7
              million devices sold, a full wallet-app layer, recovery products, and a growing institutional business
              with 100+ institutions and named workflow partners. Those features support the argument that Ledger
              deserves to be valued as a hybrid security platform rather than just as a maker of cold-storage devices.
              At the same time, the most recent hard private mark remains the 2023 flat round at about $1.41 billion,
              while 2025-2026 reporting has moved the narrative to a possible $4B+ US IPO.


              That is a large re-rating in a short number of disclosure cycles. Public reporting helps by adding that
              2025 revenue reached triple-digit millions and that the firm safeguards roughly $100 billion of bitcoin
              for customers. But those headlines are not enough to eliminate uncertainty because exact revenue, margins,
              retention, and concentration remain private. The current context therefore supports interest, not blind
              conviction.
