- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Secure Element
    - Stores keys and runs Ledger OS / BOLOS
    - Chip supply and firmware integrity
    - Opaque hardware root is trusted but not fully inspectable by end users
  - - Ledger OS / BOLOS
    - App isolation, transaction verification, secure screen control
    - Internal OS engineering and secure element support
    - Security bug could affect many asset apps at once
  - - Device app / Secure SDK
    - Coin-specific signing logic on device
    - Developer tooling and app-review process
    - Third-party app quality and review latency matter
  - - Ledger Wallet / host app
    - GUI, transaction building, service integrations
    - Desktop/mobile app reliability and app-store distribution
    - Poor UX or app issues can damage product trust
  - - Ledger Manager
    - Distribution path for apps and firmware
    - Centralized Ledger-controlled release path
    - Single channel can bottleneck ecosystem velocity
  - - Partner integrations
    - On-ramps, swaps, staking, DeFi, stablecoins
    - Third-party providers and jurisdiction availability
    - Partner failure or delisting degrades feature breadth
  notes: This is a public architecture summary, not a formal threat model. The biggest visible technical trade-off is security isolation on device versus dependence on surrounding software and partner rails.
