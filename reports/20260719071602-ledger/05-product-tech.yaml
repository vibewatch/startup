chapter:
  number: 5
  title: Product & Technology
  summary: Ledger’s product stack now combines classic and premium hardware signers, a full wallet-app workflow, recovery products, and an expanding institutional platform. The core technical moat remains the Secure Element + Ledger OS / BOLOS architecture with on-device transaction verification, but the operating model also depends heavily on the host app, Ledger Manager distribution, and partner rails. Product breadth and launch cadence are strong; the biggest missing proof points are operational reliability, recovery outcomes, and ecosystem bottlenecks.
sections:
- id: product-surface
  title: Product Surface and User Jobs
  body: |-
    Ledger is no longer just a USB hardware wallet business. The company now sells a layered product stack organized around the job of secure digital-asset control. At the edge are the consumer signers: Nano S Plus and Nano X for classic backup and mobile-friendly self-custody, plus Flex and Stax for more frequent secure interaction through larger E Ink touchscreens. Around those devices sits Ledger Wallet / Ledger Live, which now handles portfolio management, asset discovery, send/receive, buy, sell, swap, stake, and connectivity to third-party wallets such as MetaMask and Phantom. Around that layer again sits a recovery suite composed of Ledger Recover and Ledger Recovery Key, while Ledger Enterprise extends the stack into treasury, approvals, collateral, stablecoins, and tokenized-market workflows for institutions.

    That workflow framing matters because Ledger’s differentiation is not any single box or chip. It is the combined experience of key isolation on device, transactional UX in the app, and workflow expansion into recovery and institutional operations. Public product pages repeatedly split the catalog between “classic backup signers” and “touchscreen signers for daily use,” which is a useful shorthand: Ledger is trying to keep one foot in conservative cold storage and another in a higher-frequency, more software-rich operating environment.
