figures:
- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: Ledger’s architecture separates key custody, transaction presentation, app UX, and network access into distinct layers.
  data:
    layers:
    - label: User / operator
      detail: Retail owners and institutional approvers initiate operations and must confirm intent on a device they control.
    - label: Secure device layer
      detail: Secure Element hardware, Ledger OS / BOLOS, and device apps hold keys, verify transaction details, and produce signatures.
    - label: Interaction layer
      detail: Secure screen, clear-signing, PIN checks, and recovery workflows mediate what the user actually approves.
    - label: Host software layer
      detail: Ledger Wallet, the enterprise mobile app, and Ledger Manager handle UI, updates, orchestration, and app distribution.
    - label: External service layer
      detail: Blockchain nodes, DeFi / staking partners, and institutional counterparties provide connectivity and execution beyond the device.
