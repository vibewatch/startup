- id: architecture-and-operating-model
  title: Architecture and Operating Model
  body: |-
    Ledger’s public developer documentation is unusually useful because it makes the architecture explicit. The company describes a three-part system: a device app running on BOLOS inside a Secure Element, a wallet or host app on phone/desktop, and a network explorer or node that handles chain connectivity. The secure device is intentionally narrow: it holds private keys, derives addresses, displays human-readable transaction details, and produces signatures. The host app does the heavier UI and network work. This separation is the core engineering logic of the product. It keeps key operations in the tamper-resistant environment while allowing faster software iteration outside the chip.

    Ledger OS / BOLOS is central to that model. Ledger says the operating system isolates applications from each other, supports third-party development through the Secure SDK, and drives the secure screen plus root-of-trust checks used for device genuineness and firmware/app installation. That architecture creates a real technical moat, but also clear dependencies. Ledger Manager is the single app-distribution path; the wallet app is the main user interface and therefore a trust bottleneck of its own; and partner rails provide much of the transactional feature breadth around swaps, staking, and institutional workflows. In other words, Ledger’s product is secure because of its boundaries, but its full user value still depends on surrounding software and partner ecosystems.
