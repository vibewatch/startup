company:
  name: Together AI
chapter:
  number: 4
  title: Financials
  summary: Together AI achieved $1.15 billion in annual bookings in mid-2026 driven by surging open-source inference demand, yet recognized ARR, gross margins, and GPU unit economics remain private diligence blockers.
sections:
  - id: revenue-streams-and-pricing
    title: Revenue Streams and Pricing Mechanics
    body: Together AI operates a multi-tier commercialization model spanning serverless inference APIs, dedicated compute capacity, and custom enterprise deployments. Under its self-serve serverless architecture, customers pay on a usage-based consumption basis measured in price per million tokens, with accounts requiring a prepaid balance that replenishes automatically as thresholds are reached. For production workloads demanding guaranteed throughput, Together AI contracts committed capacity with token-based pricing, reserved instance allocations, and a 99% uptime SLA. In enterprise scenarios, Together AI inks customized multi-million-dollar infrastructure contracts, exemplified by a $240 million partnership with IBM Cloud to deploy large-scale Nvidia Blackwell inference clusters. While list pricing provides clear per-token rates, realized revenue mix, contract discounting, and volume tiering are private data points requiring management disclosure.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: cost-structure-and-unit-economics
    title: Cost Structure and Unit Economics Analysis
    body: The fundamental unit economic equation in AI infrastructure centers on the spread between customer token pricing and the underlying compute, networking, and data center costs. Together AI claims its software optimizations—including FlashAttention and Together Kernel Collection—deliver up to 2x faster inference and 60% lower costs, enabling customers like Decagon to reduce inference costs sixfold. However, gross margins remain vulnerable to severe hardware capital intensity, datacenter colocation expenses, and volatile wholesale GPU capacity procurement. Third-party market analysts report that investors are pricing AI compute resellers as aggressively as frontier model labs, despite reseller margins being constrained by pass-through hardware depreciation and power overhead. True gross margin percentages, server-level power efficiency, and hardware payback periods are not publicly reported, presenting key diligence gaps for prospective underwriters.
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI009
    tableRefs:
      - TI003
  - id: capital-adequacy-and-financing
    title: Capital Adequacy, Financing Dependency, and Runway
    body: Following its $305 million Series B financing in early 2025 at a $3.3 billion valuation, Together AI raised an $800 million Series C equity round in July 2026 at an $8.3 billion post-money valuation led by Aramco Ventures. Total cumulative funding reached approximately $1.33 billion across five rounds. Crucially, in addition to direct equity financing, new strategic investors committed over 500 MW of compute capacity to be capitalized independently, significantly reducing Together AI's direct balance sheet debt burden for physical infrastructure. In the private secondary market, platforms like EquityZen facilitate liquidity transactions for existing shareholders and early employees, though company-level cash burn and runway are not disclosed. Prospective investors must evaluate whether annual bookings of $1.15 billion convert cleanly into recognized cash flow or whether sustained hyper-scale GPU deployments will require continuous equity dilution.
    claimRefs:
      - CI010
      - CI011
      - CI012
      - CI013
      - CI014
      - CI015
