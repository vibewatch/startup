callouts:
  - calloutType: "insight"
    title: "Market size remains evidence-constrained"
    body: "The broad AI-software forecast establishes context, while bookings, revenue, adoption, and capacity show company-level signals. None supplies the missing infrastructure-spend denominator needed for a defensible SAM or SOM, and bookings must not be treated as revenue."
    claimRefs:
      - "CM003"
      - "CM005"
      - "CM006"
      - "CM016"
  - calloutType: "risk"
    title: "Enterprise adoption can require negotiated scope"
    body: "The general terms reserve uptime and reliability commitments for order forms, assign third-party model compliance to the customer, and exclude sensitive financial and medical information. Regulated adoption therefore depends on workload selection and negotiated controls rather than product availability alone."
    claimRefs:
      - "CM013"
      - "CM014"
      - "CM015"
