company:
  name: "Together AI"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "Together AI addresses managed infrastructure for open-model inference, training, fine-tuning, and dedicated GPU capacity. The available evidence shows strong demand signals, but it does not support a defensible standalone TAM, SAM, or SOM: a broad $297 billion 2027 AI-software forecast, company bookings, recorded revenue, adoption indicators, and compute commitments use different periods, units, and denominators."
sections:
  - id: "market-boundary"
    title: "Market Boundary and Substitutes"
    body: "Together AI's relevant market is managed AI infrastructure rather than the whole generative-AI economy. Its product surface covers on-demand and committed inference, dedicated deployments, GPU clusters, storage, code sandboxes, fine-tuning, and training. The boundary therefore includes usage-based serving, reserved throughput, managed model customization, and dedicated compute capacity. It excludes application-layer SaaS, ownership of third-party model intellectual property, generic non-AI cloud workloads, and economic value created by customers after deployment. The practical substitutes are closed-model APIs, hyperscaler AI services, rented raw GPU capacity, and internally operated clusters. Those substitutes shift the buyer's trade-off among convenience, model choice, control, engineering burden, and capital commitment; they should not be added to Together AI's addressable spend without evidence that the same budget can migrate."
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM009"
      - "CM011"
    tableRefs:
      - "TM001"
  - id: "sizing-lenses"
    title: "Evidence-Constrained Sizing"
    body: "The allocated sources do not provide a clean TAM/SAM/SOM series, so the analysis uses separate lenses without treating them as nested values. TMCnet reports Gartner's forecast of about $297 billion in worldwide AI software spending by 2027, a broad ceiling that includes much more than model infrastructure. It also reports a Forrester finding that more than 60% of enterprises pursuing generative AI plan blended deployments, an adoption indicator rather than spend. At company level, Market Briefs describes more than $1.15 billion of annual bookings as signed contracts for future services, while Multiples records $100 million of revenue as of February 2025 and warns that its deal-linked figures may be run-rate, LTM, or ARR. These measures cannot be divided into one another to infer share. Capacity commitments of more than 500 MW, and an earlier company-reported 200 MW of secured power, indicate supply ambition but neither revenue nor demand."
    claimRefs:
      - "CM003"
      - "CM004"
      - "CM005"
      - "CM006"
      - "CM007"
      - "CM008"
      - "CM016"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyers-and-budget-path"
    title: "Buyer, User, Payer, and Adoption Path"
    body: "Packaging implies several buying motions rather than one homogeneous customer. AI-native product teams can begin with on-demand inference and migrate to committed throughput as usage becomes predictable. Enterprise platform teams can combine inference, fine-tuning, storage, and code execution while procurement or finance approves reserved capacity. Model builders and research teams are the natural users of training and GPU clusters, with infrastructure leadership controlling capacity budgets. Regulated teams face a more restrictive path: legal, security, and model-governance owners must evaluate data handling, third-party model terms, workload eligibility, and negotiated service commitments. SME Business Review frames managed AI cloud as an alternative to owning advanced hardware, but the assigned evidence does not disclose sales-cycle length, buyer-level budget amounts, or conversion rates by segment."
    claimRefs:
      - "CM004"
      - "CM009"
      - "CM010"
      - "CM011"
      - "CM013"
      - "CM014"
      - "CM015"
    tableRefs:
      - "TM003"
  - id: "drivers-and-constraints"
    title: "Growth Drivers and Adoption Constraints"
    body: "Demand is supported by open-model adoption, pressure to control inference economics, and a shift from experiments toward production infrastructure. Market Briefs says Together AI attributes a tripling of industry-wide open-source model usage over the preceding year to OpenRouter data; this remains a company-originated market claim even though independent outlets repeat it. The company also reported more than 450,000 developers, AI-native companies, and enterprises at its February 2025 financing, offering a historical adoption marker rather than a current customer count. Constraints are equally material. General terms make service quality, stability, uptime, and reliability subject to negotiated order forms, while the product page advertises a 99% uptime SLA specifically for committed inference. Customers also remain responsible for third-party model terms, and the standard terms prohibit financial, medical, and other sensitive personal data. These conditions can extend security and legal review, narrow eligible workloads, or require bespoke contracting."
    claimRefs:
      - "CM010"
      - "CM012"
      - "CM013"
      - "CM014"
      - "CM015"
