      - number: '3.3'
        title: Moat Durability, Switching Costs, and Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              Together AI benefits from low developer integration friction due to its OpenAI-compatible REST API,
              allowing engineering teams to switch base URLs in existing client code with minimal engineering overhead
              CP002, CP006. However, this compatibility cuts both ways by functioning as a two-sided gateway that
              diminishes switching costs and facilitates multi-homing across competing inference providers CP002, CP006.
              Moat durability is primarily anchored in proprietary research kernels, high-volume capacity reservations,
              and integrated developer tooling such as acquired sandbox execution environments CP008, CP009. Conversely,
              customer lock-in remains constrained by geographic and compliance boundaries: serverless GPU capacity
              remains concentrated in US data centers, creating deployment barriers for European buyers bound by strict
              GDPR data-residency mandates CP002. In addition, public review telemetry reflects developer friction
              around opaque dedicated cluster pricing and shared-tenancy queuing during peak traffic periods CP002,
              CP003.
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP008
              - CP009
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP010
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Token-to-Compute Economic Crossover
            body: >-
              While Together AI provides friction-free onboarding with an OpenAI-compatible API, its per-token pricing
              structure faces economic headwinds at scale CP003. When continuous inference exceeds 14 million daily
              output tokens on a 70B parameter model, the cumulative cost of serverless tokens outpaces bare-metal GPU
              rental, driving cost-conscious engineering teams toward dedicated compute CP003.
            calloutType: insight
            claimRefs:
              - CP003
          - type: callout
            title: Commoditization and Multi-Homing Vulnerability
            body: >-
              Drop-in OpenAI API compatibility significantly reduces onboarding friction but equally lowers switching
              costs for developers CP002, CP006. Because client libraries can redirect traffic via simple configuration
              changes, Together AI must continually rely on kernel-level execution speed advantages and competitive
              pricing to prevent workload migration to rival inference providers CP002, CP008.
            calloutType: risk
            claimRefs:
              - CP002
              - CP006
              - CP008
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Mechanics
        blocks:
          - type: paragraph
            body: >-
              Together AI operates a multi-tier commercialization model spanning serverless inference APIs, dedicated
              compute capacity, and custom enterprise deployments. Under its self-serve serverless architecture,
              customers pay on a usage-based consumption basis measured in price per million tokens, with accounts
              requiring a prepaid balance that replenishes automatically as thresholds are reached. For production
              workloads demanding guaranteed throughput, Together AI contracts committed capacity with token-based
              pricing, reserved instance allocations, and a 99% uptime SLA. In enterprise scenarios, Together AI inks
              customized multi-million-dollar infrastructure contracts, exemplified by a $240 million partnership with
              IBM Cloud to deploy large-scale Nvidia Blackwell inference clusters. While list pricing provides clear
              per-token rates, realized revenue mix, contract discounting, and volume tiering are private data points
              requiring management disclosure.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
