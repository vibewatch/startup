      - number: '3.2'
        title: Capability Differentiation and Pricing Dynamics
        blocks:
          - type: paragraph
            body: >-
              Together AI differentiates itself on open-source model execution speed by embedding foundational systems
              research, such as FlashAttention-3 and custom GPU kernels, into its serving stack CP008, CP009. These
              optimizations allow serverless endpoints to report up to 2x faster inference and significant latency
              improvements on popular open-weight checkpoints like Llama 3.3 70B CP008, CP009. However, comparative
              operational analysis reveals that per-token pricing models become economically disadvantageous under
              continuous production loads CP003. When factoring in standard prompt-to-completion ratios, dedicated
              bare-metal GPU instances on platforms like Spheron or Lambda Labs cross the economic efficiency frontier
              at approximately 14 million daily output tokens, above which serverless token fees exceed fixed daily
              compute costs CP003. Furthermore, enterprise comparisons highlight operational trade-offs: while Together
              AI offers managed fine-tuning with LoRA, it restricts raw checkpoint access, multi-node custom training
              loops, and BYO-GPU workflows CP002, CP003.
            claimRefs:
              - CP002
              - CP003
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP006
