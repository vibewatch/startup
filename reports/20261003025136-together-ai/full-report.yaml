        title: Exhibits
        blocks:
          - type: callout
            title: Market size remains evidence-constrained
            body: >-
              The broad AI-software forecast establishes context, while bookings, revenue, adoption, and capacity show
              company-level signals. None supplies the missing infrastructure-spend denominator needed for a defensible
              SAM or SOM, and bookings must not be treated as revenue.
            calloutType: insight
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM016
          - type: callout
            title: Enterprise adoption can require negotiated scope
            body: >-
              The general terms reserve uptime and reliability commitments for order forms, assign third-party model
              compliance to the customer, and exclude sensitive financial and medical information. Regulated adoption
              therefore depends on workload selection and negotiated controls rather than product availability alone.
            calloutType: risk
            claimRefs:
