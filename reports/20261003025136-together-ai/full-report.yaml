              - CE006
              - CE011
      - number: '5.2'
        title: Developer Workflows, Code Sandboxes and API Compatibility
        blocks:
          - type: paragraph
            body: >-
              Together AI emphasizes low-friction developer onboarding by providing drop-in OpenAI-compatible RESTful
              APIs and comprehensive Python and TypeScript SDKs, allowing engineering teams to migrate existing
              applications from closed proprietary vendors without refactoring application logic. Following the
              acquisition of CodeSandbox, Together AI integrated secure isolated microVM code execution sandboxes
              directly into its platform, enabling sub-second container resume and automated code interpretation for
              agentic AI applications and synthetic data generation. The platform operates a transparent hybrid
              commercial model: serverless inference and fine-tuning are billed per million tokens with separate input
              and output rates, batch processing receives a 50% discount, and dedicated single-tenant clusters are
              billed on a per-minute basis with tiered service levels from Build to Enterprise.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE006
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE008
              - CE012
      - number: '5.3'
        title: Hardware Scale, High-Performance Clusters and Systems Research
        blocks:
          - type: paragraph
            body: >-
              At the physical infrastructure layer, Together AI has secured 200 MW of power capacity across multiple
              North American data center facilities and is deploying high-density clusters of NVIDIA Blackwell
              accelerators, including HGX B200 systems and a 36,000 GB200 NVL72 GPU deployment co-built with Hypertec.
              The company's engineering moat is heavily anchored in fundamental systems research led by Chief Scientist
              Tri Dao and co-founders Percy Liang and Ce Zhang. Innovations such as the Together Kernel Collection,
              ThunderKittens CUDA optimization libraries, and state-space architectures like Mamba have enabled up to
              24% faster training operations and 90% performance gains over legacy infrastructure, powering rapid
              enterprise adoption among leading AI native companies including Cursor, Cognition, and Decagon.
            claimRefs:
              - CE003
              - CE005
              - CE007
              - CE011
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE005
              - CE007
              - CE010
              - CE014
      - number: '5.4'
        title: Enterprise Compliance, Service Reliability and Operational Gaps
        blocks:
          - type: paragraph
            body: >-
              To support enterprise production deployments, Together AI implements strict data privacy controls
              including Zero Data Retention (ZDR), ensuring that customer inputs and outputs are never stored, logged,
              or utilized for foundation model training. The platform supports single-tenant Virtual Private Cloud (VPC)
              deployments certified under SOC 2 Type II and HIPAA frameworks for regulated workloads. However,
              operational diligence reveals key governance caveats: standard terms of service disclaim all quality,
              stability, and uptime guarantees unless explicitly negotiated in enterprise order forms. Independent
              monitoring through late 2026 confirms continuous operational status without prolonged systemic outages,
              yet multi-region failover protocols and granular disaster recovery benchmarks remain undisclosed private
              data.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-Driven Inference Optimization Delivers Cost and Latency Moat
            body: >-
              Together AI leverages proprietary systems research, including FlashAttention-3 kernels, speculative
              decoding, and the Together Kernel Collection, to deliver 2x to 3x faster inference throughput than
              standard hyperscaler clouds. By translating academic breakthroughs directly into production
              infrastructure, the company provides substantial price-performance advantages for teams serving
              open-source foundation models at scale.
            calloutType: strength
            claimRefs:
              - CE001
              - CE003
              - CE011
          - type: callout
            title: Hardware Dependency and SLA Opacity in Mission-Critical Deployments
            body: >-
              Despite securing 200 MW of power and aggressive Blackwell GPU cluster commitments, Together AI remains
              heavily dependent on NVIDIA hardware allocations and data center co-location partners. Furthermore,
              standard service agreements explicitly disclaim uptime guarantees in the absence of customized enterprise
              contracts, creating operational risks for mission-critical production workloads.
            calloutType: risk
            claimRefs:
              - CE005
              - CE009
              - CE010
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and buying centers
        blocks:
          - type: paragraph
            body: >-
              Together AI appears to serve two related but economically distinct customer motions. Developers and
              machine-learning teams can begin with on-demand open-model inference and other self-service surfaces,
              while platform leaders and procurement teams can buy dedicated infrastructure, committed inference
              capacity, storage, training, and professional support. Third-party market data reports more than one
              million developers and thousands of paying customers in 2026, but it does not disclose how many accounts
              are active, how developers convert into paying organizations, or how revenue divides between usage and
              reserved capacity. Named customers span enterprise software, communications, food delivery, generative
              media, and AI-native applications, supporting breadth but not segment economics.
            claimRefs:
              - CU002
              - CU007
              - CU008
              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU002
              - CU007
              - CU012
              - CU013
              - CU014
      - number: '6.2'
        title: Adoption trajectory and reference quality
        blocks:
          - type: paragraph
            body: >-
              The available trajectory is directionally strong but mixes unlike measures. Together AI said it supported
              more than 450,000 developers in February 2025; a 2026 market-data page reports more than one million
              developers and thousands of paying customers; and 2026 reporting cites annual bookings above $1.15
              billion. These are developer, customer, and bookings measures with different periods and denominators, so
              they should not be collapsed into a conversion funnel or treated as recurring revenue. The strongest named
              outcome examples in the retained pool are secondary reports about Salesforce, Pika Labs, and Zomato.
              Official and independent sources also name customers without disclosing deployment scope, production
              status, contract value, or a customer-authored confirmation.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU013
              - CU014
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU013
              - CU014
      - number: '6.3'
        title: Durability, procurement, and expansion
        blocks:
          - type: paragraph
            body: >-
              Product breadth creates a plausible expansion path from serverless experimentation into dedicated
              endpoints, committed throughput, GPU clusters, fine-tuning, storage, and professional support. The public
              homepage advertises a 99% uptime SLA for committed inference capacity, but the May 2026 terms state that
              quality, stability, uptime, and reliability are not guaranteed unless an order form says otherwise. The
              same terms require an initial prepaid balance, permit automatic replenishment based on minimum or average
              monthly usage, and make most payment obligations non-cancelable and fees non-refundable. These provisions
              may aid revenue durability, yet they also raise budgeting and procurement friction; they are not evidence
              of renewal, satisfaction, or net revenue retention.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: What the public evidence does not establish
        blocks:
          - type: paragraph
            body: >-
              Customer scale is more credible than customer durability. The retained evidence does not disclose NRR,
              GRR, gross churn, renewal rates, contract lengths, cohort behavior, top-customer concentration, or the
              share of bookings tied to capacity reservations. Even commercial-scale indicators require care: GetLatka
              labels its $44 million 2024 revenue number as an estimate, while the 2026 bookings figure is a different
              metric and must not be treated as revenue or ARR. Independent reference quality is also uneven; one
              allocated company-profile page yielded only a legal-navigation shell in the prefetched text. Underwriting
              should therefore require customer-level invoices, cohort exports, renewal schedules, and direct reference
              calls rather than extrapolating retention from logos or developer registrations.
            claimRefs:
              - CU003
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial scale is visible across several indicators
            body: >-
              Developer reach, paying-customer references, named users, and 2026 bookings reporting all point toward
              meaningful adoption, although the measures are not directly comparable.
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU013
              - CU014
          - type: callout
            title: Retention and concentration remain underwriting blind spots
            body: >-
              No retained source discloses NRR, GRR, churn, renewal duration, customer cohorts, or top-customer
              exposure; logos and developer registrations cannot substitute for those data.
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Executive Risk Taxonomy and Residual Exposure
        blocks:
          - type: paragraph
            body: >-
              Evaluating Together AI requires separating headline valuation momentum from structural operating
              liabilities. In the wake of its $800 million Series C financing valuing the company at $8.3 billion,
              Together AI operates as an accelerated AI neocloud delivering inference and training endpoints for open
              foundation models. However, neocloud business models introduce pronounced operational leverage and capital
              expenditure risks compared to asset-light software providers. Operating high-performance GPU data centers
              entails enormous commitments for power capacity, cooling infrastructure, and specialized silicon.
              Procurement evaluations highlight that total cost of ownership risks often emerge from reserved GPU
              capacity commitments, storage egress, and premium SLA add-ons that can alter customer unit economics.
              Independent procurement benchmarks specifically identify that the absence of contractually enforceable SLA
              terms beyond marketing claims represents a core vendor risk for enterprise buyers. Together AI mitigates
              these customer-side concerns through research-driven kernel optimizations that claim 2x faster inference
              and up to 60% cost reductions, yet residual exposure remains substantial across commercial concentration,
              power procurement, and rapid model obsolescence.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR007
              - CR008
              - CR010
              - CR013
              - CR014
      - number: '7.2'
        title: Regulatory, Legal, and Intellectual Property Exposure
        blocks:
          - type: paragraph
            body: >-
              Together AI's legal and regulatory posture centers on copyright compliance for hosted third-party models,
              platform terms of service liability boundaries, and international capital relationships. Together AI
              serves and fine-tunes hundreds of open-source and third-party models, including DeepSeek, Llama, Nemotron,
              and Kimi. Under its commercial Terms of Service updated in May 2026, Together AI explicitly disclaims all
              warranties regarding service quality, stability, uptime, and reliability unless custom terms are
              negotiated in separate enterprise order forms. Furthermore, the terms explicitly state that all
              third-party models remain the intellectual property of their respective providers and that customers bear
              sole responsibility for complying with third-party model terms. Importantly, Together AI caps its
              aggregate third-party intellectual property indemnification obligations at $1,000,000 and excludes any
              claims arising from customer noncompliance with third-party model licenses. For privacy, Together AI
              provides an explicit Zero Data Retention control setting where user prompts and outputs are not retained
              or utilized for model training. Regulatory risks also surround sovereign capital participation: the
              company's $305 million Series B was co-led by Prosperity7 (Aramco's venture arm) and its Series C was led
              by Aramco Ventures, which introduces potential CFIUS scrutiny or geopolitical export-control compliance
              monitoring given tightening regulatory scrutiny over advanced compute transfers.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR014
      - number: '7.3'
        title: Operational, Supply Chain, and Counterparty Dependencies
        blocks:
          - type: paragraph
            body: >-
              Operationally, Together AI is bound to physical infrastructure counterparties and advanced semiconductor
              allocations. Deploying 36,000 NVIDIA GB200 NVL72 GPUs alongside Hypertec and securing 200 MW of data
              center power capacity exposes the firm to execution delays, data center grid interconnection bottlenecks,
              and hardware failure modes. Hardware concentration in Nvidia silicon creates direct supplier dependency:
              any delivery delay in Blackwell architectures or allocation shifts toward hyperscalers like AWS, Google
              Cloud, or Microsoft Azure directly impairs Together AI's capacity expansion. Counterparty risks are
              equally acute in customer concentration: while annual bookings are reported at $1.15 billion across
              thousands of customers, high-volume AI-native engineering tools such as Cursor, Cognition, and Decagon
              account for an outsized portion of inference workload volumes. If AI application leaders transition
              workloads to proprietary model clouds or build custom inference clusters, revenue churn could accelerate.
              Furthermore, intense competition from well-capitalized tech giants possessing captive power and fiber
              backbones limits Together AI's pricing power, heightening gross margin compression risks.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR013
              - CR015
      - number: '7.4'
        title: Mitigations, Monitoring Indicators, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              To mitigate counterparty and cost exposures, Together AI leverages proprietary systems software, such as
              the Together Kernel Collection, FlashAttention-3 integration, and its acquisition of CodeSandbox for
              secure agentic execution. These software layers decouple gross margins from commoditized hardware hosting
              by boosting hardware utilization by 24% to 90% across training and inference workloads. Nevertheless,
              investors must monitor definitive thesis-break triggers during ongoing diligence. First, any failure to
              achieve enforceable contract-backed enterprise SLAs on dedicated clusters would impede mission-critical
              enterprise production migrations. Second, regulatory restrictions on sovereign investment ties or compute
              sharing involving Middle Eastern entities could jeopardize capital access. Third, persistent GPU
              over-provisioning relative to net cash collections could lead to unmanageable cash burn if enterprise
              generative AI inference demand plateaus. Rigorous tracking of capacity utilization, customer retention,
              and power contract energization dates is required.
            claimRefs:
              - CR004
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital Intensity and Long-Term Commitments
            body: >-
              Together AI's business model requires substantial upfront capital commitments for power capacity and GPU
              clusters. Neocloud economics expose the company to cash flow vulnerabilities if enterprise token demand
              softens while fixed data center and hardware debt obligations persist.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
          - type: callout
            title: SLA Enforceability as Commercial Gate
            body: >-
              Procurement audits highlight that enterprise adoption for production AI workloads hinges on
              contract-backed SLAs rather than marketing uptime numbers. Together AI's standard disclaimer of
              reliability warranties necessitates bespoke enterprise contracting to win risk-sensitive deployments.
            calloutType: insight
            claimRefs:
              - CR003
              - CR007
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research more, with medium confidence and high underwriting risk. The latest round
              establishes an observable price of $8.3 billion post-money, not an independently verified intrinsic value.
              Dividing that price by the company-claimed annual-bookings figure produces a valuation-to-bookings ratio
              below roughly 7.2x, but bookings are neither revenue nor ARR and may include contracted demand that has
              not been recognized or collected. The price therefore cannot be evaluated with a conventional revenue
              multiple from the assigned public evidence. Entry should remain conditional on a bookings-to-revenue
              bridge, gross-margin and cash-burn history, customer retention and concentration, and the full financing
              waterfall. No target return, hold period, or defensible exit range is supportable until those inputs are
              disclosed.
            claimRefs:
              - CV001
              - CV003
              - CV011
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV011
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV013
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and financing structure
        blocks:
          - type: paragraph
            body: >-
              The thesis rests on production demand for open-model inference, a broad paying-customer base, and reported
              cost advantages that could support durable workload growth. The anti-thesis is equally material: the
              valuation rose about 2.5x from the prior round, disclosed operating scale is dominated by company claims,
              and the evidence does not establish conversion of bookings into recurring, high-margin revenue. More than
              500 MW of compute commitments are described as independently capitalized, which may reduce direct
              balance-sheet funding needs, but the economic obligations, take-or-pay exposure, ownership, and
              utilization risk are not disclosed. The financing history shows ample access to capital; it does not show
              cash available today or eliminate future dilution.
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV009
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
      - number: '8.3'
        title: Scenarios and comparable context
        blocks:
          - type: paragraph
            body: >-
              The scenario analysis is deliberately assumption-led rather than a false-precision valuation model. A bull
              case requires company-reported bookings and customer adoption to convert into retained revenue while
              efficiency advantages protect margins. A base case treats the current round as the only reliable price
              signal and waits for audited operating evidence. A bear case assumes multiple compression, weak bookings
              conversion, or underutilized compute commitments. Third-party comparison data are useful only as boundary
              markers: the cited private and public companies have different business models, capital intensity,
              maturity, and accounting, so their reported multiples cannot be applied mechanically. The historical 33.0x
              figure is tied to a February 2025 data point whose provider says may represent run-rate revenue or LTM
              revenue.
            claimRefs:
              - CV010
              - CV012
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV010
              - CV012
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The company has institutional investors, substantial recent financing, and a product surface that includes
              committed inference capacity, but those facts do not establish public-market readiness or a realizable
              exit. Contract language matters to revenue quality: the marketing page advertises a 99% uptime SLA for
              committed inference, while the terms say service quality, stability, uptime, and reliability are not
              guaranteed unless an order form provides otherwise. Diligence should sample executed enterprise orders,
              reconcile bookings to recognized revenue and cash collections, inspect cohort retention and gross margin
              by offering, and model compute commitments under utilization stress. Thesis-break triggers are sustained
              bookings-to-revenue slippage, deteriorating retention, negative contribution margin after compute costs,
              material take-or-pay exposure, or a financing waterfall that leaves common equity unable to earn the
              required return.
            claimRefs:
              - CV007
              - CV008
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Entry condition
            body: >-
              Advance only after the data room reconciles bookings to revenue and cash, demonstrates durable unit
              economics, and supplies a fully diluted preference waterfall sufficient to model investor proceeds.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV016
          - type: callout
            title: Denominator warning
            body: >-
              The sub-7.2x calculation uses company-claimed annual bookings; it must not be presented as a revenue or
              ARR multiple.
            calloutType: risk
            claimRefs:
              - CV003
              - CV011
