      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by open-model adoption, pressure to control inference economics, and a shift from
              experiments toward production infrastructure. Market Briefs says Together AI attributes a tripling of
              industry-wide open-source model usage over the preceding year to OpenRouter data; this remains a
              company-originated market claim even though independent outlets repeat it. The company also reported more
              than 450,000 developers, AI-native companies, and enterprises at its February 2025 financing, offering a
              historical adoption marker rather than a current customer count. Constraints are equally material. General
              terms make service quality, stability, uptime, and reliability subject to negotiated order forms, while
              the product page advertises a 99% uptime SLA specifically for committed inference. Customers also remain
              responsible for third-party model terms, and the standard terms prohibit financial, medical, and other
              sensitive personal data. These conditions can extend security and legal review, narrow eligible workloads,
              or require bespoke contracting.
            claimRefs:
              - CM010
              - CM012
              - CM013
              - CM014
              - CM015
