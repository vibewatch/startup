  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: AI Native Cloud Architecture and Foundation Model Catalog
        blocks:
          - type: paragraph
            body: >-
              Together AI positions itself as a specialized AI native cloud offering full-stack infrastructure for
              training, fine-tuning, and serving large-scale generative artificial intelligence models. Rather than
              training closed proprietary models, Together AI hosts over 200 open-source foundation models across text,
              image, audio, vision, code, and multimodal domains, including leading architectures such as Llama,
              DeepSeek-R1, Qwen, and Mixtral. The platform is architected around the proprietary Together Inference
              Engine, which incorporates FlashAttention-3 kernels, speculative decoding methods (such as Parcae and
              Medusa), and FP8 execution to deliver 2x to 3x higher inference throughput than traditional hyperscaler
              environments. Compute capacity is delivered through both serverless APIs and dedicated GPU clusters,
              allowing engineering teams to scale workloads dynamically without managing underlying cluster
              orchestration.
            claimRefs:
