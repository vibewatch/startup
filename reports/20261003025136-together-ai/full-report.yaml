      - number: '4.2'
        title: Cost Structure and Unit Economics Analysis
        blocks:
          - type: paragraph
            body: >-
              The fundamental unit economic equation in AI infrastructure centers on the spread between customer token
              pricing and the underlying compute, networking, and data center costs. Together AI claims its software
              optimizations—including FlashAttention and Together Kernel Collection—deliver up to 2x faster inference
              and 60% lower costs, enabling customers like Decagon to reduce inference costs sixfold. However, gross
              margins remain vulnerable to severe hardware capital intensity, datacenter colocation expenses, and
              volatile wholesale GPU capacity procurement. Third-party market analysts report that investors are pricing
              AI compute resellers as aggressively as frontier model labs, despite reseller margins being constrained by
              pass-through hardware depreciation and power overhead. True gross margin percentages, server-level power
              efficiency, and hardware payback periods are not publicly reported, presenting key diligence gaps for
              prospective underwriters.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI006
              - CI007
              - CI010
              - CI011
              - CI012
      - number: '4.3'
        title: Capital Adequacy, Financing Dependency, and Runway
        blocks:
          - type: paragraph
            body: >-
              Following its $305 million Series B financing in early 2025 at a $3.3 billion valuation, Together AI
              raised an $800 million Series C equity round in July 2026 at an $8.3 billion post-money valuation led by
              Aramco Ventures. Total cumulative funding reached approximately $1.33 billion across five rounds.
              Crucially, in addition to direct equity financing, new strategic investors committed over 500 MW of
              compute capacity to be capitalized independently, significantly reducing Together AI's direct balance
              sheet debt burden for physical infrastructure. In the private secondary market, platforms like EquityZen
              facilitate liquidity transactions for existing shareholders and early employees, though company-level cash
              burn and runway are not disclosed. Prospective investors must evaluate whether annual bookings of $1.15
              billion convert cleanly into recognized cash flow or whether sustained hyper-scale GPU deployments will
              require continuous equity dilution.
            claimRefs:
