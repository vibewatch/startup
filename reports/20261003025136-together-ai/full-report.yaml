        - Conversion, margin, capital-commitment, preference, and exit risks remain unquantified.
      - - Valuation stance
        - Price-sensitive and unproven
        - Treat $8.3B as the latest financing mark, not a supported intrinsic-value conclusion.
    notes: Assessment as of 2026-10-03; $8.3B is a post-money financing mark, while bookings are not revenue or ARR.
    claimRefs:
      - CV001
      - CV003
      - CV011
      - CV016
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - - Thesis
        - Annual bookings above $1.15B indicate substantial contracted demand if they convert to recognized revenue.
        - Audited bookings-to-revenue conversion and cash-collection cohorts would strengthen the case.
      - - Thesis
        - Thousands of paying customers and named AI-native users indicate production adoption.
        - Retention, expansion, and concentration data would determine the durability of that adoption.
      - - Anti-thesis
        - >-
          The latest valuation is about 2.5x the prior $3.3B mark, increasing execution required for an attractive
          return.
        - A lower entry price or verified growth with durable gross margin would reduce this concern.
      - - Anti-thesis
        - Compute commitments and contractual service terms leave utilization and obligation risk unresolved.
        - >-
          Contracts showing limited take-or-pay exposure and profitable committed-capacity utilization would improve the
          view.
    notes: >-
      Arguments distinguish company claims from independent reporting; changes in view require private diligence rather
      than additional inference.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV007
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation and return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Bookings convert into retained revenue; cost claims translate into durable margins; compute capacity fills
          economically.
        - >-
          Current price may be supportable, but no numeric exit range or target return is defensible without revenue,
          margin, ownership, and dilution data.
        - Execution, customer concentration, and aggressive sector pricing.
        - Positive only after audited conversion, retention, and unit-economics evidence.
      - - Base
        - >-
          Strong demand continues, but public evidence remains insufficient to separate bookings from recognized revenue
          or quantify cash needs.
        - Use $8.3B only as the latest post-money mark; defer a priced return case.
        - Multiple compression, future dilution, and capital intensity.
        - Research-more until the financing waterfall and operating data room are reviewed.
      - - Bear
        - Bookings conversion weakens, compute utilization trails commitments, or open-model economics compress.
        - >-
          Downside range is not quantifiable from public evidence; a down round or preference overhang could impair
          common-equity returns.
        - Underutilization, margin pressure, retention weakness, and unfavorable preferences.
        - Triggered by bookings-to-revenue slippage, negative contribution margin, or material take-or-pay exposure.
    notes: >-
      Scenario ranges are intentionally left unquantified because the assigned evidence lacks audited revenue, margins,
      cash burn, ownership, preference terms, and an exit timetable.
    claimRefs:
      - CV004
      - CV006
      - CV010
      - CV012
      - CV015
      - CV016
