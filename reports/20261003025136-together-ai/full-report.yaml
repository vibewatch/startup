            title: Independent 500 MW Capitalization Structure
            body: >-
              Together AI secured commitments for over 500 MW of compute capacity capitalized independently by Series C
              investors, providing a novel financing mechanism that offloads direct debt and hardware balance-sheet risk
              while securing critical compute scale.
            calloutType: insight
            claimRefs:
              - CI011
          - type: callout
            title: The Reseller Margin Trap in AI Neoclouds
            body: >-
              Market analysts caution that venture investors are pricing AI compute resellers as aggressively as
