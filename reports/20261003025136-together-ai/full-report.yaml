  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Structural Architecture
        blocks:
          - type: paragraph
            body: >-
              The competitive arena surrounding Together AI is organized into distinct operational tiers rather than a
              uniform market. Direct peers in the managed open-source inference segment, such as Fireworks AI, Baseten,
              and Lepton AI, focus on OpenAI-compatible API abstractions and fine-tuning pipelines CP001, CP002.
              Simultaneously, bare-metal compute aggregators and specialized neoclouds including Spheron, RunPod, and
              Lambda Labs target price-sensitive, high-throughput teams seeking direct GPU root access CP003, CP004.
              Python-first serverless compute platforms like Modal represent an adjacent infrastructure paradigm,
              offering elastic container orchestration without model-catalog constraints CP002, CP004. Hyperscalers
              (AWS, Azure, Google Cloud) remain incumbent platforms, while cross-border model gateways like AIWave
              provide specialized connectivity to Chinese model ecosystems CP005, CP006. Internal engineering teams
              building on raw clusters represent a pervasive status-quo substitute whenever proprietary data governance
              or custom CUDA requirements conflict with multi-tenant managed platforms CP003, CP007.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
