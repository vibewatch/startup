      - number: '2.3'
        title: Buyer, User, Payer, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Packaging implies several buying motions rather than one homogeneous customer. AI-native product teams can
              begin with on-demand inference and migrate to committed throughput as usage becomes predictable.
              Enterprise platform teams can combine inference, fine-tuning, storage, and code execution while
              procurement or finance approves reserved capacity. Model builders and research teams are the natural users
              of training and GPU clusters, with infrastructure leadership controlling capacity budgets. Regulated teams
              face a more restrictive path: legal, security, and model-governance owners must evaluate data handling,
              third-party model terms, workload eligibility, and negotiated service commitments. SME Business Review
              frames managed AI cloud as an alternative to owning advanced hardware, but the assigned evidence does not
              disclose sales-cycle length, buyer-level budget amounts, or conversion rates by segment.
            claimRefs:
              - CM004
