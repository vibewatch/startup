callouts:
  - calloutType: "insight"
    title: "The Token-to-Compute Economic Crossover"
    body: "While Together AI provides friction-free onboarding with an OpenAI-compatible API, its per-token pricing structure faces economic headwinds at scale CP003. When continuous inference exceeds 14 million daily output tokens on a 70B parameter model, the cumulative cost of serverless tokens outpaces bare-metal GPU rental, driving cost-conscious engineering teams toward dedicated compute CP003."
    claimRefs:
      - "CP003"
  - calloutType: "risk"
    title: "Commoditization and Multi-Homing Vulnerability"
    body: "Drop-in OpenAI API compatibility significantly reduces onboarding friction but equally lowers switching costs for developers CP002, CP006. Because client libraries can redirect traffic via simple configuration changes, Together AI must continually rely on kernel-level execution speed advantages and competitive pricing to prevent workload migration to rival inference providers CP002, CP008."
    claimRefs:
      - "CP002"
      - "CP006"
      - "CP008"
