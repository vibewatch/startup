chapter:
  number: 7
  title: "Risks"
  summary: "Together AI faces material operational, supplier, and financial risks rooted in massive GPU capital intensity, extreme hyperscaler competition, and dependence on third-party model licensing. While high-margin software optimizations and substantial Series C capitalization provide intermediate runway, residual exposure remains elevated across power procurement, customer concentration, and contractual liability caps."
sections:
  - id: "risk-overview"
    title: "Executive Risk Taxonomy and Residual Exposure"
    body: "Evaluating Together AI requires separating headline valuation momentum from structural operating liabilities. In the wake of its $800 million Series C financing valuing the company at $8.3 billion, Together AI operates as an accelerated AI neocloud delivering inference and training endpoints for open foundation models. However, neocloud business models introduce pronounced operational leverage and capital expenditure risks compared to asset-light software providers. Operating high-performance GPU data centers entails enormous commitments for power capacity, cooling infrastructure, and specialized silicon. Procurement evaluations highlight that total cost of ownership risks often emerge from reserved GPU capacity commitments, storage egress, and premium SLA add-ons that can alter customer unit economics. Independent procurement benchmarks specifically identify that the absence of contractually enforceable SLA terms beyond marketing claims represents a core vendor risk for enterprise buyers. Together AI mitigates these customer-side concerns through research-driven kernel optimizations that claim 2x faster inference and up to 60% cost reductions, yet residual exposure remains substantial across commercial concentration, power procurement, and rapid model obsolescence."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
    tableRefs:
      - "TR001"
    figureRefs:
      - "FR001"
  - id: "regulatory-legal-exposure"
    title: "Regulatory, Legal, and Intellectual Property Exposure"
    body: "Together AI's legal and regulatory posture centers on copyright compliance for hosted third-party models, platform terms of service liability boundaries, and international capital relationships. Together AI serves and fine-tunes hundreds of open-source and third-party models, including DeepSeek, Llama, Nemotron, and Kimi. Under its commercial Terms of Service updated in May 2026, Together AI explicitly disclaims all warranties regarding service quality, stability, uptime, and reliability unless custom terms are negotiated in separate enterprise order forms. Furthermore, the terms explicitly state that all third-party models remain the intellectual property of their respective providers and that customers bear sole responsibility for complying with third-party model terms. Importantly, Together AI caps its aggregate third-party intellectual property indemnification obligations at $1,000,000 and excludes any claims arising from customer noncompliance with third-party model licenses. For privacy, Together AI provides an explicit Zero Data Retention control setting where user prompts and outputs are not retained or utilized for model training. Regulatory risks also surround sovereign capital participation: the company's $305 million Series B was co-led by Prosperity7 (Aramco's venture arm) and its Series C was led by Aramco Ventures, which introduces potential CFIUS scrutiny or geopolitical export-control compliance monitoring given tightening regulatory scrutiny over advanced compute transfers."
    claimRefs:
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR012"
    tableRefs:
      - "TR002"
  - id: "operational-partner-exposure"
    title: "Operational, Supply Chain, and Counterparty Dependencies"
    body: "Operationally, Together AI is bound to physical infrastructure counterparties and advanced semiconductor allocations. Deploying 36,000 NVIDIA GB200 NVL72 GPUs alongside Hypertec and securing 200 MW of data center power capacity exposes the firm to execution delays, data center grid interconnection bottlenecks, and hardware failure modes. Hardware concentration in Nvidia silicon creates direct supplier dependency: any delivery delay in Blackwell architectures or allocation shifts toward hyperscalers like AWS, Google Cloud, or Microsoft Azure directly impairs Together AI's capacity expansion. Counterparty risks are equally acute in customer concentration: while annual bookings are reported at $1.15 billion across thousands of customers, high-volume AI-native engineering tools such as Cursor, Cognition, and Decagon account for an outsized portion of inference workload volumes. If AI application leaders transition workloads to proprietary model clouds or build custom inference clusters, revenue churn could accelerate. Furthermore, intense competition from well-capitalized tech giants possessing captive power and fiber backbones limits Together AI's pricing power, heightening gross margin compression risks."
    claimRefs:
      - "CR013"
      - "CR014"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR003"
  - id: "mitigations-diligence"
    title: "Mitigations, Monitoring Indicators, and Thesis-Break Triggers"
    body: "To mitigate counterparty and cost exposures, Together AI leverages proprietary systems software, such as the Together Kernel Collection, FlashAttention-3 integration, and its acquisition of CodeSandbox for secure agentic execution. These software layers decouple gross margins from commoditized hardware hosting by boosting hardware utilization by 24% to 90% across training and inference workloads. Nevertheless, investors must monitor definitive thesis-break triggers during ongoing diligence. First, any failure to achieve enforceable contract-backed enterprise SLAs on dedicated clusters would impede mission-critical enterprise production migrations. Second, regulatory restrictions on sovereign investment ties or compute sharing involving Middle Eastern entities could jeopardize capital access. Third, persistent GPU over-provisioning relative to net cash collections could lead to unmanageable cash burn if enterprise generative AI inference demand plateaus. Rigorous tracking of capacity utilization, customer retention, and power contract energization dates is required."
    claimRefs:
      - "CR004"
      - "CR014"
      - "CR015"
      - "CR016"
