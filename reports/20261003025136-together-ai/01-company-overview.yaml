callouts:
  - calloutType: "strength"
    title: "Frontier Systems Research as Capital and Hardware Defense"
    body: "Together AI's primary competitive advantage is rooted in systems efficiency breakthroughs led by co-founder Tri Dao (FlashAttention) and Ce Zhang. By achieving 2x to 3x faster inference and up to 90% faster pre-training via the Together Kernel Collection, Together AI extracts higher throughput per GPU than generic hyperscalers, partially offsetting the massive capital cost of advanced hardware."
    claimRefs:
      - "CO005"
      - "CO007"
  - calloutType: "risk"
    title: "Contractual Warranty Disclaimers and GPU Capital Intensity"
    body: "While Together AI serves over 1 million developers and prominent enterprises, standard Terms of Service expressly disclaim uptime, reliability, or quality guarantees without an enterprise order form and cap liability at trailing 12-month fees. Furthermore, massive forward capital commitments for power (200+ MW) and GPU clusters expose the company to significant utilization risks if open-source inference pricing compresses."
    claimRefs:
      - "CO013"
      - "CO016"
