chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in 2022 as Together Computer, Inc., Together AI has scaled into a leading full-stack AI native cloud provider delivering serverless and dedicated inference, fine-tuning, and compute clusters for open-source AI models. Backed by frontier systems research including FlashAttention, the company has raised over $1.3 billion—most recently securing an $800 million Series C in mid-2026 at an $8.3 billion post-money valuation—while building a multi-hundred-million-dollar ARR business amid intense cloud competition and significant GPU capital commitments."
sections:
  - id: "corporate-identity-and-mission"
    title: "Corporate Identity, Operating Structure, and Founding Mission"
    body: "Together AI, legally incorporated as Together Computer, Inc., is a Delaware corporation founded in 2022 and headquartered at 251 Rhode Island Street in San Francisco, California. The company was created to build an open, decentralized, and high-performance AI native cloud platform that enables developers, startups, and global enterprises to train, fine-tune, and serve open-source foundation models at scale. By combining purpose-built GPU infrastructure with frontier systems research, Together AI positions itself as a specialized alternative to hyperscale public clouds, addressing surging enterprise demand for open model deployment without the vendor lock-in or high latency of proprietary offerings.\n\nOperationally, Together AI maintains primary engineering and corporate hubs in San Francisco with international offices including Amsterdam in the Netherlands. Its operational footprint has scaled rapidly to support enterprise-grade service delivery, expanding from 38 employees in late 2023 to more than 400 personnel by mid-2026. The company provides programmatic APIs and managed interfaces spanning serverless inference across more than 200 open-source models, batch inference, dedicated container hosting, and large-scale GPU training clusters."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO001"
    figureRefs: []
  - id: "leadership-and-governance"
    title: "Leadership Architecture, Technical Founders, and Governance"
    body: "Together AI was co-founded by a consortium of prominent systems researchers and serial technology entrepreneurs: Vipul Ved Prakash (Chief Executive Officer), Ce Zhang (Chief Technology Officer), Chris Ré, Tri Dao (Chief Scientist), and Percy Liang. Chief Executive Prakash previously founded Cloudmark (acquired by Proofpoint) and held engineering leadership roles at Apple, bringing commercial scaling experience. The technical co-founders represent the forefront of academic and applied AI systems: Dr. Tri Dao pioneered FlashAttention and FlashAttention-3, architectures that dramatically reduce memory and computational overhead in transformer inference and training; Chris Ré is a MacArthur Fellow and Stanford computer science professor; Ce Zhang specializes in decentralized systems from ETH Zurich and University of Chicago; and Percy Liang directs the Stanford Center for Research on Foundation Models (CRFM).\n\nThe executive team has broadened beyond research into enterprise go-to-market execution, adding Charles Zedlewski as Chief Product Officer and Kai Mak as Chief Revenue Officer. Governance and board representation include key venture partners such as Bucky Moore from Kleiner Perkins, who joined the board following the company's Series A. While the technical founders provide an exceptional competitive moat in kernel design and systems efficiency, Together AI exhibits notable key-person dependency on its core research architects—especially Tri Dao and Ce Zhang—whose proprietary algorithmic optimizations drive the platform's claimed performance advantages."
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO002"
    figureRefs: []
  - id: "capitalization-and-stakeholders"
    title: "Capitalization Trajectory, Valuation Expansion, and Stakeholder Alignment"
    body: "Together AI's capital raising reflects extraordinary growth and institutional demand across six private financing rounds, lifting total capital raised to approximately $1.3 billion to $1.33 billion. Following an initial $4 million pre-seed in September 2022 and a $20 million Seed round led by Lux Capital in May 2023, the company completed a $102.5 million Series A led by Kleiner Perkins in November 2023 at a $500 million post-money valuation. Surging enterprise inference demand prompted a rapid $106 million Series A extension in March 2024 led by Salesforce Ventures at a $1.25 billion valuation, achieving unicorn status.\n\nIn February 2025, Together AI secured $305 million in Series B financing co-led by General Catalyst and Prosperity7 Ventures at a $3.3 billion valuation. Most recently, in July 2026, the company closed an $800 million Series C led by Aramco Ventures at an $8.3 billion post-money valuation, with participation from NVIDIA, Salesforce Ventures, Vista Equity Partners, Emergence Capital, and March Capital. Cumulative dilution across priced institutional rounds is estimated at approximately 40%, with substantial governance and strategic alignment across top venture capital firms, sovereign-affiliated funds, and technology partners such as NVIDIA. Proceeds from recent financings are primarily deployed into securing long-term power and GPU compute allocations, including 200 MW of power capacity, 500 MW of additional planned compute commitments, and deployments of NVIDIA Blackwell B200 and GB200 NVL72 clusters."
    claimRefs:
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
    tableRefs:
      - "TO003"
    figureRefs: []
  - id: "scale-milestones-and-commercial-risk"
    title: "Commercial Scale, Operational Milestones, and Contractual Terms"
    body: "Together AI's commercial traction has scaled in lockstep with generative AI adoption. Registered developers grew from 10,000 in mid-2023 to 45,000 by March 2024, surpassing 450,000 in early 2025 and exceeding 1 million developers by mid-2026. Commercial adoption extends across high-growth AI-native leaders—such as Cursor, Cognition, Decagon, Hedra, and Cartesia—as well as enterprise institutions including Salesforce, Zoom, and The Washington Post. Publicly reported annual run-rate revenue scaled from $4 million in late 2023 to $44 million in 2024, reaching $100 million ARR by early 2025 and reportedly surpassing $1.15 billion in annual bookings prior to its mid-2026 financing round.\n\nDespite this rapid growth, Together AI's standard commercial terms surface important customer risk considerations. The company's standard terms of service provide that services are delivered on an 'as is' and 'as available' basis with no express quality, stability, or uptime guarantees unless negotiated via custom order forms, and standard terms disclaim all implied warranties while capping aggregate liability to fees paid in the preceding 12 months. While enterprise agreements offer a 99% uptime SLA and committed GPU capacity, managing massive capital commitments for power and GPU hardware against usage-based or short-term enterprise contracts presents ongoing margin and utilization exposure."
    claimRefs:
      - "CO014"
      - "CO015"
      - "CO016"
    tableRefs: []
    figureRefs:
      - "FO001"
