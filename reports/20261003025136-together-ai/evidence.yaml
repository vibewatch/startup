evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: >-
      Audited financial statements verifying exact GAAP revenue, ARR composition, gross margin by product line, and net
      revenue retention (NRR).
    whyItMatters: >-
      Reported ARR ($100M at Series B) and bookings (>$1.15B) represent unaudited management claims or secondary
      estimates that cannot confirm true operating burn or customer churn.
    diligencePath: >-
      Request company financial data room, revenue recognition schedules, and independent audit reports during private
      diligence.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sam-som-gap
    missingEvidence: >-
      A direct market study defining open-model inference, fine-tuning, and dedicated AI-cloud spend by geography and
      year, with methodology and growth assumptions.
    whyItMatters: >-
      Without a segment-spend denominator, the broad AI-software forecast cannot be converted into Together AI's TAM or
      SAM.
    diligencePath: >-
      Obtain the underlying Gartner and Forrester research plus an independent AI-infrastructure market study, then
      reconcile definitions and excluded spend.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: revenue-definition
    missingEvidence: >-
      Audited revenue by product, geography, and customer cohort, plus a reconciliation of bookings, ARR, run-rate
      revenue, recognized revenue, and remaining performance obligations.
    whyItMatters: >-
      The disclosed bookings and recorded revenue use different periods and definitions, preventing a supportable
      company share or penetration calculation.
    diligencePath: >-
      Request audited financial statements, the bookings-to-revenue bridge, product revenue mix, contract duration,
      cancellation terms, and utilization against committed capacity.
    relatedQuestionRefs:
      - QM002
      - QM006
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Observed buyer-level budget ownership, sales-cycle length, proof-of-concept conversion, workload expansion, and
      retention data by customer segment.
    whyItMatters: >-
      Product packaging indicates plausible buyer paths but does not establish purchasing velocity, budget availability,
      or durable adoption.
    diligencePath: >-
      Review CRM cohort data and interview reference customers across AI-native, enterprise-platform, model-builder, and
      regulated segments.
    relatedQuestionRefs:
      - QM003
  - type: missing-source
    severity: material
    topic: enterprise-sla-and-uptime
    missingEvidence: >-
      Audited production uptime data, historical outage incident logs, and SLA breach penalty terms for Together AI
      dedicated enterprise clusters.
    whyItMatters: >-
      Enterprise buyers evaluating mission-critical workload migration require verified SLA performance metrics rather
      than uncommitted baseline terms.
    diligencePath: Request customer order form schedules, status-page SLA historical audit logs, and compliance addenda under NDA.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: gaap-revenue-and-margins
    missingEvidence: >-
      Audited financial statements detailing GAAP recognized revenue, gross margin percentage, compute hosting COGS, and
      operating expenses.
    whyItMatters: >-
      Reported annual bookings of $1.15 billion do not reveal recognized revenue, gross margin durability, or hardware
      depreciation drag.
    diligencePath: Request access to confidential data room for audited income statements and quarterly cohort margin schedules.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: >-
      Monthly cash burn, net working capital, cash on hand balance, and capital expenditure breakdown for GPU
      procurement.
    whyItMatters: >-
      Despite raising $800M in Series C equity, extreme compute capital requirements create potential ongoing financing
      dependency.
    diligencePath: Obtain current treasury reports, bank balance confirmations, and 24-month rolling cash flow forecast.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: sla-disaster-recovery
    missingEvidence: >-
      Audited multi-region failover architecture, disaster recovery Recovery Time Objectives (RTO), Recovery Point
      Objectives (RPO), and historical Mean Time to Recovery (MTTR) logs.
    whyItMatters: >-
      Enterprise mission-critical AI workloads require contractual assurance that service disruptions in one data center
      will not cause cascading production downtime.
    diligencePath: >-
      Request confidential SOC 2 Type II report, enterprise customer SLA addenda, and third-party penetration test
      executive summaries.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: hardware-delivery-timeline
    missingEvidence: >-
      Firm delivery schedules and operational energization dates for the announced 36,000 NVIDIA GB200 NVL72 GPU
      deployment with Hypertec.
    whyItMatters: >-
      Understanding the timeline of Blackwell GPU cluster deployment determines whether Together AI can sustain its
      inference speed advantage against hyperscalers.
    diligencePath: >-
      Interview data center operations leadership and review co-location lease agreements and equipment purchase orders
      under NDA.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      NRR, GRR, logo and revenue churn, renewal rates, contract length, cohort expansion, and customer-satisfaction data
      segmented by self-service and enterprise accounts.
    whyItMatters: Customer counts and bookings cannot establish durable recurring demand without renewal and cohort evidence.
    diligencePath: >-
      Obtain monthly customer and revenue cohorts, renewal schedules, churn bridges, and three direct customer reference
      calls covering both expansion and non-renewal cases.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: >-
      Top-one, top-five, and top-ten customer revenue and bookings shares, committed-capacity exposure, channel
      contribution, and remaining performance obligations.
    whyItMatters: >-
      A concentrated bookings base or long delivery horizon could make headline commercial scale less diversified and
      less convertible into recognized revenue.
    diligencePath: >-
      Review the customer-level revenue ledger, bookings-to-revenue waterfall, capacity commitments, cancellation
      rights, and channel-attributed pipeline.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: material
    topic: named-customers
    missingEvidence: >-
      A complete customer roster with deployment stage, production status, workload, contract value, outcome
      measurement, and customer-authored confirmation.
    whyItMatters: >-
      The retained named examples are a partial sample and cannot establish portfolio-wide production adoption or
      referenceability.
    diligencePath: >-
      Reconcile the CRM customer export to invoices and usage logs, then sample production, pilot, churned, and
      expansion accounts for direct reference checks.
    relatedQuestionRefs:
      - QU003
      - QU009
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Audited customer revenue concentration breakdown detailing percentage of revenue derived from top-5 enterprise
      customers.
    whyItMatters: >-
      High concentration in nascent AI startups creates extreme revenue volatility if anchor clients diversify or build
      private clusters.
    diligencePath: Request confidential customer revenue contribution schedule during management diligence sessions.
    relatedQuestionRefs:
      - QR004
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: power-contract-binding
    missingEvidence: >-
      Definitive utility power interconnection agreements and commercial energization schedules for the 200 MW capacity
      commitment.
    whyItMatters: Grid connection delays or power delivery failures would strand capital and postpone GPU cluster deployment.
    diligencePath: Review signed colocation power purchase agreements and local utility interconnection approvals.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: operating-economics
    missingEvidence: >-
      Audited revenue, an ARR and bookings reconciliation, gross margin by offering, cash burn, retention, and customer
      concentration.
    whyItMatters: >-
      These inputs determine whether reported bookings convert into durable cash-generating revenue and whether the
      current valuation can earn an acceptable return.
    diligencePath: >-
      Review audited financials, monthly bookings-to-revenue and cash-collection bridges, cohort retention, top-customer
      exposure, and contribution margin by product.
    relatedQuestionRefs:
      - QV003
      - QV010
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: >-
      Fully diluted capitalization, liquidation preferences, participation rights, debt, compute commitments, and
      investor ownership after the Series C.
    whyItMatters: >-
      Headline post-money valuation does not reveal dilution or the proceeds available to new common-equity investors in
      downside and exit cases.
    diligencePath: >-
      Obtain the charter, cap table, financing documents, debt schedule, compute-capacity contracts, and a
      management-approved distribution waterfall.
    relatedQuestionRefs:
      - QV009
      - QV010
  - type: missing-source
    severity: material
    topic: exit-readiness
    missingEvidence: >-
      A credible liquidity path, public-company control readiness, forecast horizon, and management or board exit
      timetable.
    whyItMatters: Without an exit window and ownership data, target return and hold-period analysis cannot be calculated.
    diligencePath: >-
      Interview the board and management, review the operating plan and governance readiness, and model IPO,
      strategic-sale, and secondary outcomes.
    relatedQuestionRefs:
      - QV008
