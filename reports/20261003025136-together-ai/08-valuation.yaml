        - id: economics-test
          label: "Economics test"
          detail: "Gross margin, burn, and utilization undisclosed"
        - id: ownership-test
          label: "Ownership test"
          detail: "Dilution and preference waterfall undisclosed"
        - id: recommendation
          label: "Recommendation"
          detail: "Research more; no priced target return"
    approximationNotes: "The flow is qualitative and does not imply conversion rates or a numeric valuation model."
    claimRefs: [CV001, CV006, CV013, CV016]
callouts:
  - calloutType: recommendation
    title: Entry condition
    body: >-
      Advance only after the data room reconciles bookings to revenue and cash, demonstrates
      durable unit economics, and supplies a fully diluted preference waterfall sufficient
      to model investor proceeds.
    claimRefs: [CV003, CV016]
  - calloutType: risk
    title: Denominator warning
    body: >-
      The sub-7.2x calculation uses company-claimed annual bookings; it must not be presented
      as a revenue or ARR multiple.
    claimRefs: [CV003, CV011]
