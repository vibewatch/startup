schemaVersion: "report-v2"
artifact: valuation
slug: together-ai
runDate: 2026-10-03
company:
  name: Together AI
chapter:
  number: 8
  title: Valuation
  summary: >-
    Together AI's July 2026 Series C set an $8.3 billion post-money valuation after an
    $800 million raise, supported by company-claimed annual bookings above $1.15 billion
    and thousands of paying customers. The evidence supports continued diligence rather
    than a priced recommendation because bookings are not revenue or ARR, current margins
    and cash consumption are undisclosed, and preference, ownership, and exit inputs are
    absent.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The recommendation is research more, with medium confidence and high underwriting
      risk. The latest round establishes an observable price of $8.3 billion post-money,
      not an independently verified intrinsic value. Dividing that price by the
      company-claimed annual-bookings figure produces a valuation-to-bookings ratio below
      roughly 7.2x, but bookings are neither revenue nor ARR and may include contracted
      demand that has not been recognized or collected. The price therefore cannot be
      evaluated with a conventional revenue multiple from the assigned public evidence.
      Entry should remain conditional on a bookings-to-revenue bridge, gross-margin and
      cash-burn history, customer retention and concentration, and the full financing
      waterfall. No target return, hold period, or defensible exit range is supportable
      until those inputs are disclosed.
    claimRefs: [CV001, CV003, CV011, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-financing-structure
    title: Thesis, anti-thesis, and financing structure
    body: >-
      The thesis rests on production demand for open-model inference, a broad paying-customer
      base, and reported cost advantages that could support durable workload growth. The
      anti-thesis is equally material: the valuation rose about 2.5x from the prior round,
      disclosed operating scale is dominated by company claims, and the evidence does not
      establish conversion of bookings into recurring, high-margin revenue. More than
      500 MW of compute commitments are described as independently capitalized, which may
      reduce direct balance-sheet funding needs, but the economic obligations, take-or-pay
      exposure, ownership, and utilization risk are not disclosed. The financing history
      shows ample access to capital; it does not show cash available today or eliminate
      future dilution.
    claimRefs: [CV002, CV004, CV005, CV006, CV009, CV013]
    tableRefs: [TV002]
  - id: scenarios-and-comparables
    title: Scenarios and comparable context
    body: >-
      The scenario analysis is deliberately assumption-led rather than a false-precision
      valuation model. A bull case requires company-reported bookings and customer adoption
      to convert into retained revenue while efficiency advantages protect margins. A base
      case treats the current round as the only reliable price signal and waits for audited
      operating evidence. A bear case assumes multiple compression, weak bookings conversion,
      or underutilized compute commitments. Third-party comparison data are useful only as
      boundary markers: the cited private and public companies have different business
      models, capital intensity, maturity, and accounting, so their reported multiples
      cannot be applied mechanically. The historical 33.0x figure is tied to a February
      2025 data point whose provider says may represent run-rate revenue or LTM revenue.
    claimRefs: [CV010, CV012, CV014, CV015]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness, diligence asks, and thesis-break triggers
    body: >-
      The company has institutional investors, substantial recent financing, and a product
      surface that includes committed inference capacity, but those facts do not establish
      public-market readiness or a realizable exit. Contract language matters to revenue
      quality: the marketing page advertises a 99% uptime SLA for committed inference,
      while the terms say service quality, stability, uptime, and reliability are not
      guaranteed unless an order form provides otherwise. Diligence should sample executed
      enterprise orders, reconcile bookings to recognized revenue and cash collections,
      inspect cohort retention and gross margin by offering, and model compute commitments
      under utilization stress. Thesis-break triggers are sustained bookings-to-revenue
      slippage, deteriorating retention, negative contribution margin after compute costs,
      material take-or-pay exposure, or a financing waterfall that leaves common equity
      unable to earn the required return.
    claimRefs: [CV007, CV008, CV016]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, "Research more", "Do not underwrite an entry price until private operating and financing evidence is reviewed."]
      - [Confidence, "Medium", "The round price is corroborated, but operating metrics are largely company-reported."]
      - [Risk rating, "High", "Conversion, margin, capital-commitment, preference, and exit risks remain unquantified."]
      - [Valuation stance, "Price-sensitive and unproven", "Treat $8.3B as the latest financing mark, not a supported intrinsic-value conclusion."]
    notes: "Assessment as of 2026-10-03; $8.3B is a post-money financing mark, while bookings are not revenue or ARR."
    claimRefs: [CV001, CV003, CV011, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Argument, What would change the view]
    rows:
      - ["Thesis", "Annual bookings above $1.15B indicate substantial contracted demand if they convert to recognized revenue.", "Audited bookings-to-revenue conversion and cash-collection cohorts would strengthen the case."]
      - ["Thesis", "Thousands of paying customers and named AI-native users indicate production adoption.", "Retention, expansion, and concentration data would determine the durability of that adoption."]
      - ["Anti-thesis", "The latest valuation is about 2.5x the prior $3.3B mark, increasing execution required for an attractive return.", "A lower entry price or verified growth with durable gross margin would reduce this concern."]
      - ["Anti-thesis", "Compute commitments and contractual service terms leave utilization and obligation risk unresolved.", "Contracts showing limited take-or-pay exposure and profitable committed-capacity utilization would improve the view."]
    notes: "Arguments distinguish company claims from independent reporting; changes in view require private diligence rather than additional inference."
    claimRefs: [CV002, CV003, CV004, CV005, CV007]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Explicit assumptions, Valuation and return logic, Key risks, Probability signal]
    rows:
      - ["Bull", "Bookings convert into retained revenue; cost claims translate into durable margins; compute capacity fills economically.", "Current price may be supportable, but no numeric exit range or target return is defensible without revenue, margin, ownership, and dilution data.", "Execution, customer concentration, and aggressive sector pricing.", "Positive only after audited conversion, retention, and unit-economics evidence."]
      - ["Base", "Strong demand continues, but public evidence remains insufficient to separate bookings from recognized revenue or quantify cash needs.", "Use $8.3B only as the latest post-money mark; defer a priced return case.", "Multiple compression, future dilution, and capital intensity.", "Research-more until the financing waterfall and operating data room are reviewed."]
      - ["Bear", "Bookings conversion weakens, compute utilization trails commitments, or open-model economics compress.", "Downside range is not quantifiable from public evidence; a down round or preference overhang could impair common-equity returns.", "Underutilization, margin pressure, retention weakness, and unfavorable preferences.", "Triggered by bookings-to-revenue slippage, negative contribution margin, or material take-or-pay exposure."]
    notes: "Scenario ranges are intentionally left unquantified because the assigned evidence lacks audited revenue, margins, cash burn, ownership, preference terms, and an exit timetable."
    claimRefs: [CV004, CV006, CV010, CV012, CV015, CV016]
