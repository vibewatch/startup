chapter:
  number: 5
  title: "Product & Technology"
  summary: "Together AI operates an AI-native cloud platform delivering serverless and dedicated inference, fine-tuning, and model hosting across more than 200 open-source AI models. The platform leverages proprietary systems research—including FlashAttention-3 kernels, the Together Kernel Collection, and speculative decoding—to achieve 2x to 3x inference acceleration over generic hyperscaler infrastructure, supported by 200 MW of power commitments and next-generation Blackwell GPU deployments."
sections:
  - id: "platform-architecture-model-catalog"
    title: "AI Native Cloud Architecture and Foundation Model Catalog"
    body: "Together AI positions itself as a specialized AI native cloud offering full-stack infrastructure for training, fine-tuning, and serving large-scale generative artificial intelligence models. Rather than training closed proprietary models, Together AI hosts over 200 open-source foundation models across text, image, audio, vision, code, and multimodal domains, including leading architectures such as Llama, DeepSeek-R1, Qwen, and Mixtral. The platform is architected around the proprietary Together Inference Engine, which incorporates FlashAttention-3 kernels, speculative decoding methods (such as Parcae and Medusa), and FP8 execution to deliver 2x to 3x higher inference throughput than traditional hyperscaler environments. Compute capacity is delivered through both serverless APIs and dedicated GPU clusters, allowing engineering teams to scale workloads dynamically without managing underlying cluster orchestration."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE006"
      - "CE011"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "developer-workflow-sandboxes"
    title: "Developer Workflows, Code Sandboxes and API Compatibility"
    body: "Together AI emphasizes low-friction developer onboarding by providing drop-in OpenAI-compatible RESTful APIs and comprehensive Python and TypeScript SDKs, allowing engineering teams to migrate existing applications from closed proprietary vendors without refactoring application logic. Following the acquisition of CodeSandbox, Together AI integrated secure isolated microVM code execution sandboxes directly into its platform, enabling sub-second container resume and automated code interpretation for agentic AI applications and synthetic data generation. The platform operates a transparent hybrid commercial model: serverless inference and fine-tuning are billed per million tokens with separate input and output rates, batch processing receives a 50% discount, and dedicated single-tenant clusters are billed on a per-minute basis with tiered service levels from Build to Enterprise."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE004"
      - "CE006"
      - "CE012"
    tableRefs:
      - "TE002"
  - id: "hardware-systems-research"
    title: "Hardware Scale, High-Performance Clusters and Systems Research"
    body: "At the physical infrastructure layer, Together AI has secured 200 MW of power capacity across multiple North American data center facilities and is deploying high-density clusters of NVIDIA Blackwell accelerators, including HGX B200 systems and a 36,000 GB200 NVL72 GPU deployment co-built with Hypertec. The company's engineering moat is heavily anchored in fundamental systems research led by Chief Scientist Tri Dao and co-founders Percy Liang and Ce Zhang. Innovations such as the Together Kernel Collection, ThunderKittens CUDA optimization libraries, and state-space architectures like Mamba have enabled up to 24% faster training operations and 90% performance gains over legacy infrastructure, powering rapid enterprise adoption among leading AI native companies including Cursor, Cognition, and Decagon."
    claimRefs:
      - "CE003"
      - "CE005"
      - "CE007"
      - "CE011"
      - "CE013"
    tableRefs:
      - "TE003"
  - id: "enterprise-security-reliability-governance"
    title: "Enterprise Compliance, Service Reliability and Operational Gaps"
    body: "To support enterprise production deployments, Together AI implements strict data privacy controls including Zero Data Retention (ZDR), ensuring that customer inputs and outputs are never stored, logged, or utilized for foundation model training. The platform supports single-tenant Virtual Private Cloud (VPC) deployments certified under SOC 2 Type II and HIPAA frameworks for regulated workloads. However, operational diligence reveals key governance caveats: standard terms of service disclaim all quality, stability, and uptime guarantees unless explicitly negotiated in enterprise order forms. Independent monitoring through late 2026 confirms continuous operational status without prolonged systemic outages, yet multi-region failover protocols and granular disaster recovery benchmarks remain undisclosed private data."
    claimRefs:
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE014"
