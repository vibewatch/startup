figures:
  - id: FU001
    title: Publicly visible customer journey and expansion surfaces
    type: journey-map
    summary: >-
      The public journey can progress from developer trial to reserved infrastructure and adjacent
      services, but renewal and realized expansion remain private.
    data:
      nodes:
        - label: Developer discovery
          detail: "Experiment with open models and on-demand inference."
          touchpoints: ["Serverless APIs", "Model catalog"]
        - label: Prepaid self-service
          detail: "Fund an initial balance and consume usage-priced services."
          touchpoints: ["Account", "Payment method", "API token"]
        - label: Production inference
          detail: "Move recurring application workloads onto managed inference."
          touchpoints: ["Batch inference", "Dedicated endpoints"]
        - label: Committed capacity
          detail: "Reserve throughput under an order form and advertised 99% SLA."
          touchpoints: ["Reserved throughput", "Enterprise order form"]
        - label: Broader workload expansion
          detail: "Add GPU clusters, fine-tuning, storage, or code sandboxes."
          touchpoints: ["Training", "Storage", "GPU clusters", "Code sandboxing"]
        - label: Renewal or review
          detail: "Public evidence does not reveal renewal, churn, or account expansion."
          touchpoints: ["Renewal schedule", "Reference call", "Cohort review"]
    approximationNotes: >-
      Conceptual path based on current public product and contract surfaces; it is not a measured
      funnel, and no conversion or retention rates are implied.
    claimRefs: [CU007, CU008, CU009, CU010, CU011, CU012]
callouts:
  - calloutType: strength
    title: Commercial scale is visible across several indicators
    body: >-
      Developer reach, paying-customer references, named users, and 2026 bookings reporting all
      point toward meaningful adoption, although the measures are not directly comparable.
    claimRefs: [CU001, CU002, CU003, CU013, CU014]
  - calloutType: risk
    title: Retention and concentration remain underwriting blind spots
    body: >-
      No retained source discloses NRR, GRR, churn, renewal duration, customer cohorts, or
      top-customer exposure; logos and developer registrations cannot substitute for those data.
    claimRefs: [CU009, CU010, CU011]
