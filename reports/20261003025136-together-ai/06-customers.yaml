company:
  name: Together AI
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence indicates a two-lane customer base spanning self-serve developers and larger
    AI-native or enterprise buyers, with third-party sources reporting more than one million
    developers, thousands of paying customers, and annual bookings above $1.15 billion in 2026.
    Named-user and outcome evidence exists, but retention, contract duration, expansion rates,
    and customer concentration remain undisclosed.
sections:
  - id: customer-base-and-buyers
    title: Customer base and buying centers
    body: >-
      Together AI appears to serve two related but economically distinct customer motions.
      Developers and machine-learning teams can begin with on-demand open-model inference and
      other self-service surfaces, while platform leaders and procurement teams can buy dedicated
      infrastructure, committed inference capacity, storage, training, and professional support.
      Third-party market data reports more than one million developers and thousands of paying
      customers in 2026, but it does not disclose how many accounts are active, how developers
      convert into paying organizations, or how revenue divides between usage and reserved
      capacity. Named customers span enterprise software, communications, food delivery,
      generative media, and AI-native applications, supporting breadth but not segment economics.
    claimRefs: [CU002, CU007, CU008, CU012, CU013, CU014]
    tableRefs: [TU001]
  - id: adoption-and-reference-proof
    title: Adoption trajectory and reference quality
    body: >-
      The available trajectory is directionally strong but mixes unlike measures. Together AI
      said it supported more than 450,000 developers in February 2025; a 2026 market-data page
      reports more than one million developers and thousands of paying customers; and 2026
      reporting cites annual bookings above $1.15 billion. These are developer, customer, and
      bookings measures with different periods and denominators, so they should not be collapsed
      into a conversion funnel or treated as recurring revenue. The strongest named outcome
      examples in the retained pool are secondary reports about Salesforce, Pika Labs, and
      Zomato. Official and independent sources also name customers without disclosing deployment
      scope, production status, contract value, or a customer-authored confirmation.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU013, CU014, CU015]
    tableRefs: [TU002, TU003]
  - id: durability-and-procurement
    title: Durability, procurement, and expansion
    body: >-
      Product breadth creates a plausible expansion path from serverless experimentation into
      dedicated endpoints, committed throughput, GPU clusters, fine-tuning, storage, and
      professional support. The public homepage advertises a 99% uptime SLA for committed
      inference capacity, but the May 2026 terms state that quality, stability, uptime, and
      reliability are not guaranteed unless an order form says otherwise. The same terms require
      an initial prepaid balance, permit automatic replenishment based on minimum or average
      monthly usage, and make most payment obligations non-cancelable and fees non-refundable.
      These provisions may aid revenue durability, yet they also raise budgeting and procurement
      friction; they are not evidence of renewal, satisfaction, or net revenue retention.
    claimRefs: [CU007, CU008, CU009, CU010, CU011, CU012]
    figureRefs: [FU001]
  - id: diligence-judgment
    title: What the public evidence does not establish
    body: >-
      Customer scale is more credible than customer durability. The retained evidence does not
      disclose NRR, GRR, gross churn, renewal rates, contract lengths, cohort behavior, top-customer
      concentration, or the share of bookings tied to capacity reservations. Even commercial-scale
      indicators require care: GetLatka labels its $44 million 2024 revenue number as an estimate,
      while the 2026 bookings figure is a different metric and must not be treated as revenue or
      ARR. Independent reference quality is also uneven; one allocated company-profile page
      yielded only a legal-navigation shell in the prefetched text. Underwriting should therefore
      require customer-level invoices, cohort exports, renewal schedules, and direct reference
      calls rather than extrapolating retention from logos or developer registrations.
    claimRefs: [CU003, CU015, CU016]
