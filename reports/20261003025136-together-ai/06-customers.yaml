        - "More than 1 million developers reported by Multiples in 2026"
        - "Usage-led acquisition and product discovery"
        - "Active-user, paid-conversion, and spend-cohort data are not disclosed"
      - - AI-native application companies
        - "CTO, VP Engineering, or AI platform lead; company payer"
        - "Production inference for software and agent applications"
        - "Cursor, Cognition, and Decagon named in 2026 reporting"
        - "Potential high-growth workload and expansion accounts"
        - "Workload size, production status, and contract values are undisclosed"
      - - Global enterprises
        - "Enterprise AI/platform team, procurement, and business-unit users"
        - "Managed inference, model shaping, and committed capacity"
        - "Salesforce, Zoom, SK Telecom, Zomato, and The Washington Post named officially"
        - "Potential reserved-capacity and professional-services revenue"
        - "Account concentration, renewal terms, and deployment breadth are undisclosed"
      - - Generative-media builders
