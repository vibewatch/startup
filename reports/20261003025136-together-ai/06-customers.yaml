  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: >-
        NRR, GRR, logo and revenue churn, renewal rates, contract length, cohort expansion, and
        customer-satisfaction data segmented by self-service and enterprise accounts.
      whyItMatters: >-
        Customer counts and bookings cannot establish durable recurring demand without renewal
        and cohort evidence.
      diligencePath: >-
        Obtain monthly customer and revenue cohorts, renewal schedules, churn bridges, and three
        direct customer reference calls covering both expansion and non-renewal cases.
      relatedQuestionRefs: [QU004]
    - type: private-evidence-only
      severity: material
      topic: concentration
      missingEvidence: >-
        Top-one, top-five, and top-ten customer revenue and bookings shares, committed-capacity
        exposure, channel contribution, and remaining performance obligations.
      whyItMatters: >-
        A concentrated bookings base or long delivery horizon could make headline commercial
        scale less diversified and less convertible into recognized revenue.
      diligencePath: >-
        Review the customer-level revenue ledger, bookings-to-revenue waterfall, capacity
        commitments, cancellation rights, and channel-attributed pipeline.
      relatedQuestionRefs: [QU005]
    - type: enumeration-incomplete
      severity: material
      topic: named-customers
      missingEvidence: >-
        A complete customer roster with deployment stage, production status, workload, contract
        value, outcome measurement, and customer-authored confirmation.
      whyItMatters: >-
        The retained named examples are a partial sample and cannot establish portfolio-wide
        production adoption or referenceability.
      diligencePath: >-
        Reconcile the CRM customer export to invoices and usage logs, then sample production,
        pilot, churned, and expansion accounts for direct reference checks.
      relatedQuestionRefs: [QU003, QU009]
      relatedTableRefs: [TU003]
