            body: >-
              相比客户留存韧性，庞大的客户规模更具可信度。既有公开证据并未披露
              NRR、GRR、总流失率、续约率、合同期限、客户队列留存、头部客户集中度，亦未说明算力预留占预订额的具体比例。即使是反映商业化体量的公开指标也需谨慎审视：GetLatka 将 2024 年 $44 million
