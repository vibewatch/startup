  - id: FE001
    title: 产品架构图
    type: stack
    summary: Together AI 全栈 AI 原生云平台从底层硬件到上层智能体运行时的六层架构全景图。
    data:
      layers:
        - label: 应用与智能体层
          detail: 面向开发者的 API 与智能体运行时环境
          modules:
            - 兼容 OpenAI 的 RESTful API 及 Python/TypeScript SDK
            - 集成 CodeSandbox 安全微虚拟机（MicroVM）运行时
            - 智能体合成数据生成框架
        - label: 模型目录与权重管理
          detail: 超过 200 款开源基础模型及领域专用模型
          modules:
            - 前沿大语言模型（Llama、DeepSeek-R1、Qwen、Nemotron）
            - 多模态与生成式多媒体模型（Cartesia Sonic、图像/视频）
            - 模型权重分片与高吞吐读取通道
        - label: 推理与优化引擎
          detail: 加速 Token 吞吐的专有软件层
          modules:
            - 具备动态请求批处理能力的 Together 推理引擎
            - 推测解码（Medusa、Parcae、分布感知强化学习）
            - FP8 量化与低比特权重表示
        - label: 算子与执行加速
          detail: 硬件级算子优化与系统级研究
          modules:
            - FlashAttention-3 低延迟注意力算子
            - Together 算子集合与 ThunderKittens CUDA 库
            - 自定义并行矩阵乘法算子
        - label: 集群编排与存储
          detail: 分布式计算管理与高性能文件系统
          modules:
            - 分布式训练与微调检查点（Checkpoint）管理器
            - 高性能 AI 原生对象存储与并行文件系统
            - 免出网流量费数据管道与节点自动恢复
        - label: 物理硬件与电力基础设施
          detail: 专用 GPU 算力集群与数据中心机房设施
          modules:
            - NVIDIA HGX B200 与 GB200 NVL72 GPU 集群
            - 高带宽互联与 InfiniBand 网络架构
            - 北美各设施合计 200 MW 电力承诺
    approximationNotes: 各架构层代表官方技术公告中所披露的功能性软件与基础设施抽象边界。
    claimRefs:
      - CE001
      - CE003
      - CE005
      - CE006
      - CE011
  - id: FU001
    title: 公开可见的客户旅程与扩张路径
    type: journey-map
    summary: 公开客户旅程可从开发者试用推进至预留基础设施及周边服务，但续约与实际业务扩张情况属于非公开数据。
    data:
      nodes:
        - label: 开发者探索
          detail: 试用开源模型并进行按需推理。
          touchpoints:
            - Serverless APIs
            - Model catalog
        - label: 预付费自助服务
          detail: 预充值初始余额并按用量消耗计费服务。
          touchpoints:
            - Account
            - Payment method
            - API token
        - label: 生产级推理
          detail: 将常规应用工作负载迁移至托管推理。
          touchpoints:
            - Batch inference
            - Dedicated endpoints
        - label: 承诺容量
          detail: 签订订购单锁定吞吐量并享受宣传的 99% SLA。
          touchpoints:
            - Reserved throughput
            - Enterprise order form
        - label: 更广泛的工作负载扩张
          detail: 扩购 GPU 集群、微调服务、存储或代码沙箱。
          touchpoints:
            - Training
            - Storage
            - GPU clusters
            - Code sandboxing
        - label: 续约或业务复盘
          detail: 公开证据未披露续约、客户流失或单一客户扩张情况。
          touchpoints:
