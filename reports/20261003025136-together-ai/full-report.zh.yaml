chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司主体、运营架构与创立使命
        blocks:
          - type: paragraph
            body: >-
              Together AI 法定注册主体为 Together Computer, Inc.，是一家于 2022 年在特拉华州注册、总部位于加利福尼亚州旧金山 Rhode Island 街 251
              号的公司。公司旨在搭建一套开放、去中心化且高性能的 AI 原生云平台，支持开发者、初创企业及全球大客户规模化训练、微调与部署开源基础模型。Together AI 将专用 GPU
              基础设施与前沿系统底层研究相结合，把自己定位为超大规模公有云的专业化替代方案，精准切入企业部署开源模型的激增需求，避开专有模型的供应商锁定与高延迟瓶颈。


              运营上，Together AI 以旧金山为主要工程与总部枢纽，并在荷兰阿姆斯特丹设有海外办公室。为支撑企业级服务交付，团队规模迅速扩张，员工数从 2023 年底的 38 人扩充至 2026 年中的 400
              余人。公司提供可编程 API 与托管界面，服务覆盖 200 多个开源模型的无服务器推理、批量推理、专有容器托管，以及大规模 GPU 训练集群。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO005
              - CO010
              - CO014
              - CO015
      - number: '1.2'
        title: 领导架构、技术联合创始人与公司治理
        blocks:
          - type: paragraph
            body: >-
              Together AI 由多位知名系统学者与连续科技创业者联手创立：Vipul Ved Prakash（首席执行官）、Ce Zhang（首席技术官）、Chris Ré、Tri Dao（首席科学家）与 Percy
              Liang。首席执行官 Prakash 曾创办 Cloudmark（后被 Proofpoint 收购），并在 Apple 担任工程领导职务，带来了商业化扩展经验。技术联合创始人代表了学术界与工业界 AI
              系统的前沿力量：Tri Dao 博士开创了 FlashAttention 与 FlashAttention-3 架构，大幅降低了 Transformer 推理与训练时的显存占用与计算开销；Chris Ré
              为麦克阿瑟天才奖得主、斯坦福大学计算机系教授；Ce Zhang 曾任教于苏黎世联邦理工学院与芝加哥大学，专攻去中心化系统；Percy Liang 则领导斯坦福基础模型研究中心（CRFM）。


              管理团队已由研发进一步拓展至企业级 GTM 落地，先后引入 Charles Zedlewski 担任首席产品官、Kai Mak 担任首席营收官。公司治理与董事会席位涵盖核心风险投资合伙人，例如 Kleiner
              Perkins 的 Bucky Moore 在 Series A 轮后加入董事会。技术联合创始团队在算子（kernel）设计和系统效率上构筑了卓越的竞争护城河，但 Together AI
              对核心研究架构师存在明显的关键人物依赖——尤其是 Tri Dao 与 Ce Zhang，两人的自研算法优化直接支撑着平台对外宣称的性能优势。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.3'
        title: 融资历程、估值跃升与股东利益协同
        blocks:
          - type: paragraph
            body: >-
              Together AI 历经六轮私募股权融资，累计筹资总额达约 $1.3 billion 至 $1.33 billion，印证了强劲的业务增长与机构资本认可。公司于 2022 年 9 月完成 $4 million
              Pre-Seed 轮；2023 年 5 月完成由 Lux Capital 领投的 $20 million Seed 轮；同年 11 月完成由 Kleiner Perkins 领投的 $102.5 million
              Series A 轮，投后估值 $500 million。受企业端模型推理需求激增驱动，公司于 2024 年 3 月迅速完成由 Salesforce Ventures 领投的 $106 million
              Series A 轮追加融资，估值跃升至 $1.25 billion，跻身独角兽行列。


              2025 年 2 月，Together AI 拿下由 General Catalyst 与 Prosperity7 Ventures 联合领投的 $305 million Series B 轮融资，估值达
              $3.3 billion。最新一轮融资落地于 2026 年 7 月，由 Aramco Ventures 领投 $800 million Series C 轮，投后估值达 $8.3 billion，跟投方包括
              NVIDIA、Salesforce Ventures、Vista Equity Partners、Emergence Capital 与 March Capital。据估计，各轮机构定价融资累计股权稀释比例约
              40%，且在顶级风投、主权背景基金与 NVIDIA 等技术盟友之间建立了深度的治理与战略协同。近期融资款项主要用于锁定长期电力与 GPU 算力指标，包括已锁定的 200 MW 电力容量、规划中的额外 500 MW
              算力承诺，以及 NVIDIA Blackwell B200 与 GB200 NVL72 集群部署。
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO010
