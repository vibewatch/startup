  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 核心风险矩阵与长尾敞口
        blocks:
          - type: paragraph
            body: >-
              评估 Together AI 必须将其亮眼的估值光环与深层的经营性负债区分开来。在完成 $800 million Series C 轮融资并斩获 $8.3 billion 估值之后，Together AI
              已经发展为面向开源基础模型提供推理与训练接口的新一代算力云。但与轻资产软件厂商相比，这类算力云模式伴随着显著的运营杠杆与资本开支风险。运营高性能 GPU
              数据中心需要对电力容量、冷却基础设施与专业芯片做出极其庞大的承诺。采购尽调显示，总拥有成本（TCO）风险往往源于预留 GPU 算力承诺、存储出站流量费用及溢价 SLA
              附加项，这些因素会显著改变客户的单体经济效益。独立采购评测特别指出，除营销口径外缺乏具有法律约束力的正式合同 SLA 条款，是企业采购方眼中的核心供应商风险。Together AI
              试图依靠自研算子优化来缓解客户顾虑（宣称可实现 2x 推理加速与最高 60% 的成本降低），但在客户集中度、电力供应保障以及模型快速迭代淘汰方面，公司的潜在风险敞口依然显著。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR007
              - CR008
              - CR010
              - CR013
              - CR014
      - number: '7.2'
        title: 监管合规、法务与知识产权风险
        blocks:
          - type: paragraph
            body: >-
              Together AI 面对的法律与监管核心集中在托管第三方模型的版权合规、平台服务条款的免责边界以及跨境资本关系。公司托管并微调包括 DeepSeek、Llama、Nemotron 与 Kimi
              在内的数百个开源及第三方模型。在 2026 年 5 月更新的商业服务条款中，Together AI
              明确免除关于服务质量、稳定性、正常运行时间及可靠性的全部担保，除非在独立企业订单中单独协商。此外，条款明确规定所有第三方模型仍属于其原权利人的知识产权，客户须独自承担遵守第三方模型条款的全部合规责任。尤为关键的是，Together
              AI 将针对第三方知识产权侵权的累计赔偿责任上限设定为
              $1,000,000，且明确免除因客户违规使用第三方模型许可而引发的任何索赔或权利主张。针对数据隐私保护，平台提供明确的零数据保留（ZDR）配置，承诺不留存用户 prompt
              与输出内容，亦不用于模型训练。主权资本参投也带来了监管风险：公司 $305 million Series B 轮由 Aramco 旗下风投机构 Prosperity7 联合领投，Series C 轮则由
              Aramco Ventures 领投；鉴于针对先进算力流转的地缘监管持续收紧，此举可能引发美国外国投资委员会（CFIUS）的国家安全审查或地缘政治出口管制重点合规监控。
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR014
      - number: '7.3'
        title: 运营交付、供应链与关键交易对手依赖
        blocks:
          - type: paragraph
            body: >-
              运营上，Together AI 深度受制于底层基础设施合作伙伴与先进半导体算力分配。与 Hypertec 合作部署 36,000 张 NVIDIA GB200 NVL72 GPU 并锁定 200 MW
              数据中心电力，使公司暴露于项目交付延期、电网并网审批瓶颈及硬件故障率等风险中。算力硬件高度集中于 Nvidia 芯片形成了直接的单一供应商依赖：Blackwell 架构交付的任何拖延，或供应配额向
              AWS、Google Cloud、Microsoft Azure 等巨头倾斜，都会直接阻碍 Together AI 的产能扩张。交易对手风险在客户集中度上同样突出：尽管报道称其数千家客户贡献了 $1.15
              billion 的年度预订额，但 Cursor、Cognition 与 Decagon 等高并发 AI 原生工程工具占用了极高比例的实际推理负载。一旦这些头部 AI
              应用厂商将工作负载迁往专有模型云或自建推理集群，收入流失可能骤然加剧。此外，坐拥自建电力与光纤骨干网的雄厚科技巨头激烈竞争，极大地限制了 Together AI 的定价权，加剧了毛利率承压风险。
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
