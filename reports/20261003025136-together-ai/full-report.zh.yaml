      - number: '2.2'
        title: 证据约束下的市场规模测算
        blocks:
          - type: paragraph
            body: >-
              既有证据材料并未提供成体系的 TAM / SAM / SOM 测算序列，因此本分析采用多维视角独立审视，而非将其视为层层嵌套的数值。TMCnet 援引 Gartner 预测称，到 2027 年全球 AI
              软件支出约达 $297 billion，但这属于极为宽泛的上限，涵盖了远超模型基础设施的各类范畴。报告同时引用 Forrester 调查指出，逾 60% 布局生成式 AI
              的企业计划采用混合部署模式，这属于渗透率指标而非支出规模。Market Briefs 将超 $1.15 billion 的年度预订额定义为未来服务的签约合同额；Multiples 记录了截至 2025 年 2
              月的 $100 million 营收，并提示其与交易挂钩的数据可能是收入运行率、过去 12 个月（LTM）收入或 ARR。这些指标口径各异，不可直接相除来推算市场份额。至于超过 500 MW
              的算力承诺以及此前公司披露已锁定的 200 MW 电力，仅代表供给端的扩张诉求，既不等同于营收，也不代表实际需求。
