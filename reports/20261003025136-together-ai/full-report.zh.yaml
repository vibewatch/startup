      - number: '8.2'
        title: 核心投资逻辑、反向逻辑与融资架构
        blocks:
          - type: paragraph
            body: >-
              核心投资逻辑建立在开源模型推理的生产级需求爆发、广泛的付费客户基础以及经报道的成本优势上，这些因素有望驱动长期工作负载增长。反向逻辑同样不可忽视：本轮估值较上一轮跃升约
              2.5x；公开披露的经营体量以公司单方宣称口径为主；现有证据无法证明预订额能有效转化为高毛利的经常性收入。尽管据称超 500 MW
              的算力承诺由第三方独立出资，或可减轻资产负债表的直接资金压力，但其深层的经济责任、兜底赔付（take-or-pay）敞口、资产归属权以及利用率风险均未公开。历史融资记录仅证明了其出色的吸金能力，既不代表账面现有可用现金充裕，亦无法排除未来的股权稀释风险。
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV009
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
      - number: '8.3'
        title: 情景推演与可比公司分析边界
        blocks:
          - type: paragraph
            body: >-
              情景推演刻意基于假设展开，而非构建虚假精度的估值模型。乐观情景假定公司自报的预订额与客户渗透顺利转化为留存收入，同时底层效率优势筑牢毛利护城河；基准情景仅将最新一轮融资视作唯一可信的价格信号，保持耐心等待经审计的实际运营证据；悲观情景则预设估值倍数大幅压缩、预订额转化乏力，或庞大的算力承诺面临严重空置。第三方可比数据仅能作为参考边界：被引用的非上市及上市公司在商业模式、资本密集度、成熟度以及会计准则上差异悬殊，其公开估值倍数不可机械套用。历史上的
              33.0x 倍数仅对应 2025 年 2 月的某项数据，且数据提供方指出该口径可能代表收入运行率或过去 12 个月（LTM）收入。
            claimRefs:
              - CV010
              - CV012
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV010
