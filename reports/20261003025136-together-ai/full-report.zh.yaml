            body: >-
              宽口径的 AI 软件行业预测仅提供了宏观背景，而预订额、营收、采纳量与算力规模仅反映了公司层面的微观信号。现有数据均无法提供推导可信 SAM 或 SOM
              所必需的基础设施支出分母，且决不能将预订额直接等同于实际营收。
            calloutType: insight
            claimRefs:
