      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 前沿系统研究化身资本与硬件护城河
            body: >-
              Together AI 的核心竞争优势源于联合创始人 Tri Dao（FlashAttention 开创者）与 Ce Zhang 带领的系统效率突破。依托 Together Kernel
              Collection，平台实现了 2x 至 3x 的推理加速以及最高 90% 的预训练加速，单卡 GPU 吞吐量优于通用超大规模云厂商，一定程度上抵消了先进硬件的高昂资本开支。
            calloutType: strength
            claimRefs:
              - CO005
              - CO007
          - type: callout
            title: 合同免责条款与 GPU 重资产投入的潜在张力
            body: >-
              尽管 Together AI 拥有超 100 万名开发者和知名企业客户，但其标准服务条款明确声明：未经定制企业订单确认，不对正常运行时间、可靠性或质量做任何担保，且将赔偿责任限制在过去 12
              个月收取的费用内。此外，公司在电力（200+ MW）与 GPU 集群上承担了巨额前期资本承诺，一旦开源模型推理价格承压，便将直面严峻的算力利用率风险。
            calloutType: risk
            claimRefs:
              - CO013
              - CO016
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品分析
        blocks:
          - type: paragraph
            body: >-
              Together AI 所属的相关市场是托管型 AI 基础设施，而非整套生成式 AI 生态。其产品矩阵涵盖按需与保供推理、专有部署、GPU
              集群、存储、代码沙箱、微调及训练。因此，该市场边界包含按量调用计费、预留吞吐量、托管型模型定制以及专有算力；明确排除应用层 SaaS、第三方模型知识产权所有权、通用非 AI
              云计算工作负载，以及客户部署后创造的衍生经济价值。现实中的替代品包括闭源模型 API、超大规模云厂商的 AI 服务、纯 GPU
              裸机租赁以及企业自建集群。这些替代方案改变了采购方在便利性、模型自主权、掌控力、工程负担与资本承诺之间的权衡取舍；在缺乏明确预算迁移证据的前提下，不应将上述替代支出直接计入 Together AI 的可触达市场。
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM009
