              - CO012
              - CO013
      - number: '1.4'
        title: 商业化体量、运营里程碑与合同条款分析
        blocks:
          - type: paragraph
            body: >-
              Together AI 的商业化步伐紧跟生成式 AI 的落地浪潮。注册开发者从 2023 年中的 10,000 名增至 2024 年 3 月的 45,000 名，2025 年初突破 450,000 名，至
              2026 年中已超 100 万名。付费客户既涵盖 Cursor、Cognition、Decagon、Hedra、Cartesia 等高成长 AI 原生头部公司，也包括 Salesforce、Zoom 与 The
              Washington Post 等传统企业。公开报道的年度收入运行率从 2023 年底的 $4 million 跃升至 2024 年的 $44 million，2025 年初达到 $100 million
              ARR；据报道，在 2026 年中融资轮次前其年度预订额已突破 $1.15 billion。


              尽管增长迅猛，Together AI 的标准商务条款暴露出关键的客户风险考量。公司标准服务条款明确按「现状」（as is）和「现有状态」（as
              available）交付服务，除非在定制订单中另行约定，否则不提供关于服务质量、稳定性或正常运行时间的明示保证，且免除全部默示担保，并将累计赔偿上限限制在前 12 个月支付的费用总额内。虽然大企业协议提供了
              99% 正常运行时间 SLA 与保供 GPU 算力，但用按量计费或短期企业合同去承接庞大的电力与 GPU 硬件资本承诺，将使公司持续承受利润率与利用率波动的风险敞口。
            claimRefs:
              - CO014
              - CO015
              - CO016
