  - id: FP001
    title: 竞争定位与基础设施抽象度矩阵
    type: quadrant
    summary: 从基础设施抽象度与运营控制权两个维度评估各类 AI 算力替代方案。
    data:
      points:
        - label: Together AI
          x: 7.5
          'y': 8.5
          note: 开发者抽象度高并配备全托管 API 目录；底层基础设施配置权限有限
        - label: Spheron
          x: 2
          'y': 2
          note: 直接提供裸金属算力；需用户自行搭建推理服务技术栈与集群编排
        - label: Modal
          x: 6
          'y': 6.5
          note: 弹性容器无服务器架构；以 Python 优先的工作流抽象提供深度代码灵活性
        - label: Baseten
          x: 7
          'y': 7.5
          note: 托管式模型推理基础设施；兼顾自定义部署打包与云端托管
        - label: AIWave
          x: 9
          'y': 9
          note: 纯 API 代理网关；完全无基础设施控制权，仅提供精选模型目录访问
        - label: Hyperscalers
          x: 4.5
          'y': 5
          note: 庞大的云生态系统，合规度高且具备强企业锁定效应；整体复杂度更高
      xAxis:
