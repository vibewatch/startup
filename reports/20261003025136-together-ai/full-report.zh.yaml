      - number: '8.4'
        title: 退出就绪度、尽调清单与逻辑破损触发条件
        blocks:
          - type: paragraph
            body: >-
              公司虽然坐拥知名机构背书、获得大额近期融资，且产品线覆盖了保供推理算力，但这些要素并不等同于已具备二级市场上市条件或可兑现的退出路径。合同文本细节直接决定收入质量：官网宣传保供推理具备 99% 正常运行时间
              SLA，但底层协议条款却明确指出除非订单另行规定，否则不对服务质量、稳定性、正常运行时间及可靠性提供任何保证。后续尽调应重点抽检已签署的大客户合同，核实预订额与已确认营收及现金回款的勾稽关系，分业务线审查客户队列留存率与毛利率，并在算力利用率承压的情景下测算算力支出敞口。核心逻辑破损的触发条件包括：预订额向营收转化出现持续滞后、客户留存显著恶化、扣除算力成本后边际贡献利润率为负、背负实质性兜底赔付（take-or-pay）敞口，或者严苛的清算优先权架构导致普通股无法获取基准预期回报。
            claimRefs:
              - CV007
              - CV008
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 入场前提条件
            body: 仅在数据室完成预订额与营收及现金流勾稽、验证了可持续的单体经济效益，并提供足以测算投资人回报的完全稀释清算优先权明细后，方可推进投资。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV016
          - type: callout
            title: 估值分母口径预警
            body: 低于 7.2x 的倍数是按公司单方宣称的年度预订额计算的；绝不能将其包装为营收或 ARR 倍数。
            calloutType: risk
            claimRefs:
              - CV003
              - CV011
