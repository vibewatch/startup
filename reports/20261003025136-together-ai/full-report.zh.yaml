      - number: '7.4'
        title: 风险对冲手段、监测指标与投资逻辑破损触发条件
        blocks:
          - type: paragraph
            body: >-
              为缓解交易对手与成本端风险，Together AI 积极发挥自研系统软件的杠杆效应，例如部署 Together Kernel Collection、整合 FlashAttention-3，以及收购
              CodeSandbox 以支持安全的智能体执行环境。这些软件层在训练与推理任务中将硬件利用率提升了 24% 至
              90%，使毛利空间一定程度上摆脱了同质化硬件托管的束缚。尽管如此，投资人在持续尽调中仍须密切追踪明确的逻辑破损触发条件：其一，若始终无法在专有集群上提供具法律约束力的企业级合同
              SLA，将阻断关键核心生产任务的迁移；其二，若监管部门对中东资本背景或算力共享施加限制，可能阻断后续资本渠道；其三，若企业级生成式 AI 推理需求陷入平台期，而 GPU
              硬件储备持续脱离实际净现金回款过度扩张，将导致难以承受的现金失血。因此，必须严密跟踪算力利用率、客户留存率以及电力合同的实际通电交付时间点。
            claimRefs:
              - CR004
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 资本密集度与长周期算力承诺风险
            body: >-
              Together AI 的商业模式需要在电力容量与 GPU 集群上做出巨额的前期资本承诺。新一代算力云的商业特征决定了，一旦企业端 token
              调用需求放缓，而数据中心固定成本与硬件债务刚性兑付持续存在，公司的现金流将面临脆弱冲击。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
          - type: callout
            title: SLA 法律约束力决定大客户落地节奏
            body: >-
              采购尽调表明，企业生产级 AI 负载的采纳取决于合同白纸黑字背书的正式 SLA，而非宣传口径中的正常运行时间指标。Together AI
              在标准条款中明确免除可靠性担保，意味着其必须经由繁重的定制合同谈判，才能撬动对风险高度敏感的企业级客户。
            calloutType: insight
            claimRefs:
              - CR003
              - CR007
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与估值纪律
        blocks:
          - type: paragraph
            body: >-
              本次投资建议为继续研究，置信度中，尽调承保风险高。最新一轮融资确立了投后 $8.3 billion 的可观测价格，但这并非经过独立验证的内在价值。若将该价格除以公司自述的年度预订额数据，得出的估值 /
              预订额倍数低于约 7.2x；但预订额既非营收亦非
              ARR，可能包含尚未确认履约或尚未回款的合同金额。因此，依据既有公开证据，无法套用传统收入乘数对其估值进行有效评估。入场前提应当明确绑定核心验证材料：预订额向营收转化的勾稽明细、历史毛利率与现金消耗记录、客户留存率与集中度，以及完整的融资优先清算回报瀑布流。在上述关键要素披露之前，无法测算任何具备说服力的目标回报率、持有期限或退出估值区间。
            claimRefs:
              - CV001
              - CV003
              - CV011
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV011
