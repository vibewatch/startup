  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与多层级生态架构
        blocks:
          - type: paragraph
            body: >-
              Together AI 的竞争生态分层清晰，并非同质化市场。在托管型开源推理赛道，Fireworks AI、Baseten 与 Lepton AI 等直接竞品主打兼容 OpenAI 的 API 封装及微调流水线
              CP001, CP002。裸机算力聚合商与专业新一代算力云（neoclouds，包括 Spheron、RunPod 与 Lambda Labs）则切入价格敏感、追求极致吞吐且需要 GPU root 权限的团队
              CP003, CP004。以 Python 为核心的无服务器算力平台（如 Modal）代表了另一种相邻的基础设施范式，提供弹性容器编排且不受预设模型目录限制 CP002,
