        - 转化、利润率、资本承诺、优先股及退出风险目前仍无法量化。
      - - 估值立场
        - 对价格敏感且未经证实
        - 将 $8.3B 视为最新融资估值标记，而非有充分支撑的内在价值结论。
    notes: 评估截至 2026-10-03；$8.3B 仅为投后融资标记，且订单额不等于收入或 ARR。
    claimRefs:
      - CV001
      - CV003
      - CV011
      - CV016
  - id: TV002
    title: 投资逻辑与反向逻辑
    columns:
      - 视角
      - 论点
      - 改变观点的条件
    rows:
      - - 投资逻辑
        - 若能转化为已确认收入，超过 $1.15B 的年度订单额显示出可观的合同需求。
        - 经审计的订单向收入转化率以及回款队列数据，将为这一逻辑提供更有力的支撑。
      - - 投资逻辑
        - 数千家付费客户与被点名的 AI 原生用户，表明其已进入生产级采用阶段。
        - 留存、扩张及客户集中度数据，将决定这种采用能否持久。
      - - 反向逻辑
        - 最新估值约为此前 $3.3B 标记的 2.5 倍，推高了实现理想回报所需的执行难度。
        - 较低的入场价格，或经证实的增长并伴随可持续毛利率，将缓解这一担忧。
      - - 反向逻辑
        - 算力采购承诺与合同服务条款，使得利用率与合同履约义务风险悬而未决。
        - 若合同显示照付不议（take-or-pay）敞口有限，且承诺产能利用率具备盈利性，将改善这一判断。
    notes: 论点严格区分公司口径与独立报道；改变观点需要非公开尽调证据，而非更多主观推断。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV007
  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 明确假设
      - 估值与回报逻辑
      - 核心风险
      - 概率信号
    rows:
      - - 乐观情景
        - 订单额顺利转化为留存收入；公司声称的成本优势转化为可持续的毛利率；算力产能在经济效益上得到充分消化。
        - 当前估值或许能得到支撑，但在缺乏收入、毛利率、持股比例及股权稀释数据的情况下，无法确定量化的退出区间或目标回报。
        - 业务执行、客户集中度以及行业激进的价格竞争。
        - 仅在获得经审计的转化率、留存率和单体经济模型证据后，方可转向乐观。
      - - 基准情景
        - 需求依然强劲，但公开证据仍不足以将订单额与已确认收入区分开来，也无法量化现金需求。
        - 仅将 $8.3B 视为最新投后标记；暂缓给出有定价的回报测算。
        - 估值倍数压缩、未来股权稀释以及高资本密集度。
        - 在审阅融资分配清算顺序（waterfall）及运营数据室之前，维持继续研究建议。
      - - 悲观情景
        - 订单转化疲软、算力利用率不及采购承诺，或开源模型经济性受压。
        - 根据公开证据无法量化下行空间；流血轮（down round）或优先股积压（preference overhang）可能损害普通股股东的回报。
        - 算力利用率不足、利润率承压、留存率下滑以及不利的优先股条款。
        - 若出现订单向收入转化下滑、边际贡献为负，或存在重大照付不议（take-or-pay）敞口，则可能触发该情景。
    notes: 情景区间特意保持未量化状态，因目前掌握的证据缺乏经审计的收入、毛利率、烧钱速度、股权结构、优先股条款以及明确的退出时间表。
    claimRefs:
      - CV004
      - CV006
      - CV010
      - CV012
      - CV015
      - CV016
figures:
  - id: FO001
    title: Together AI 公司与运营里程碑时间线
    type: timeline
    summary: 2022 年至 2026 年间公司创立、重大融资、基础设施部署及规模里程碑的发展轨迹。
    data:
      items:
        - label: 公司创立与 Pre-Seed 轮
          date: 2022-09
          details: Together Computer, Inc. 由 Vipul Ved Prakash、Ce Zhang、Chris Ré、Tri Dao 与 Percy Liang 创立；完成 $4M Pre-Seed 轮融资。
          tone: positive
        - label: Seed 轮融资与研发启动
          date: 2023-05
          details: 完成由 Lux Capital 领投的 $20M Seed 轮融资，推动去中心化 AI 研究及开源基础模型基础设施产品化。
          tone: positive
        - label: Series A 轮与董事会组建
          date: 2023-11
          details: 完成由 Kleiner Perkins 领投的 $102.5M Series A 轮融资，估值 $500M；该机构合伙人 Bucky Moore 加入董事会。
          tone: positive
        - label: Series A 轮追加融资独角兽轮
          date: 2024-03
          details: 完成由 Salesforce Ventures 领投的 $106M 融资，估值达 $1.25B；注册开发者突破 45,000 名。
          tone: positive
        - label: Series B 轮与 Blackwell GPU 部署
          date: 2025-02
          details: 完成由 General Catalyst 与 Prosperity7 联合领投的 $305M Series B 轮融资，估值 $3.3B；披露 $100M ARR 及 200 MW 电力储备。
          tone: positive
        - label: 收购 CodeSandbox
          date: 2025-02
          details: 收购 CodeSandbox，将安全代码解释与云端执行环境直接集成至 AI 智能体工作流中。
          tone: positive
        - label: 启动初创企业加速器
          date: 2025-10
          details: 推出 Together AI 初创企业加速器，提供最高 $50K 算力额度、前线驻场工程支持（forward-deployed engineering）以及 VC 资源对接。
          tone: positive
        - label: 服务条款更新与商业治理
          date: 2026-05
          details: 更新商业服务条款；设立零数据留存选项，同时保留标准的正常运行时间与质保免责声明。
          tone: neutral
        - label: $8.3B 估值完成 Series C 轮融资
          date: 2026-07
          details: 完成由 Aramco Ventures 领投的 $800M Series C 轮融资，估值 $8.3B；据报道年度订单额运行率突破 $1.15B。
          tone: positive
    approximationNotes: 时间线条目均代表已验证的公开融资公告、公司申报文件以及商业里程碑发布。
    claimRefs:
      - CO001
      - CO008
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO016
  - id: FM001
    title: 市场规模证据阶梯（非 TAM/SAM/SOM）
    type: pyramid
    summary: 通过六个不可直接横向对比的维度，从宏观市场背景逐步过渡到公司需求、实际采用及算力供给证据，不主观断言各层嵌套的市场份额。
    data:
      nodes:
        - id: broad-ai-software
          label: 全球 AI 软件支出预测
          value: 297
          unit: USD billions
          valueNote: About $297B in 2027; broad ceiling reported by TMCnet from Gartner
        - id: hybrid-intent
          label: 布局生成式 AI 的企业中计划混合部署的比例
          value: 60
          unit: percent
          valueNote: More than 60%; plotted at the stated lower bound
        - id: historical-developers
          label: 报道的开发者与机构覆盖规模
          value: 450000
          unit: developers, AI-native companies, and enterprises
          valueNote: More than 450,000 as of the February 2025 company announcement
        - id: annual-bookings
          label: 年度订单额
          value: 1.15
          unit: USD billions
          valueNote: More than $1.15B; signed future-service contracts, not revenue
        - id: recorded-revenue
          label: 确认入账收入
          value: 100
          unit: USD millions
          valueNote: February 2025; publisher says deal figures may be run-rate, LTM, or ARR
        - id: compute-commitments
          label: 专属算力采购承诺
          value: 500
