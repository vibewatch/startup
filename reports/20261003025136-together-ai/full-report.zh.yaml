              - CM005
              - CM006
              - CM016
          - type: callout
            title: 企业级规模化落地须依赖定制合同协商
            body: >-
              通用条款将正常运行时间与可靠性承诺留待独立订单另行敲定，把第三方模型合规责任推给客户，并明确排除敏感金融与医疗数据。因此，受监管行业的客户采纳主要取决于具体工作负载的筛选与定制合同把控，单凭产品本身的可用性无法促成规模化落地。
            calloutType: risk
            claimRefs:
