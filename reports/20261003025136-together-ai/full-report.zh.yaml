      - number: '2.3'
        title: 采购方、使用者、出资方与客户采纳路径
        blocks:
          - type: paragraph
            body: >-
              商业化封装形式表明客户群体多元，存在差异化的采购行为。AI
              原生产品团队往往从按需推理切入，在业务量可预期后逐步转向保供吞吐量；大型企业平台团队则综合采购推理、微调、存储与代码执行服务，由采购或财务部门审批预留算力额度；模型研发与科研团队是模型训练和 GPU
              集群的核心使用者，由基础设施负责人把控算力预算。强监管行业团队的采纳链路更为严苛：法务、安全和模型治理负责人必须审查数据处理流程、第三方模型协议、工作负载合规性及定制化服务承诺。SME Business
              Review 将托管型 AI 云视为替代重资产自购高端硬件的路径，但现有证据未披露销售周期长短、采购方具体预算体量或分客群转化率。
            claimRefs:
              - CM004
              - CM009
              - CM010
              - CM011
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
