      - number: '2.4'
        title: 增长驱动因素与客户采纳阻力
        blocks:
          - type: paragraph
            body: >-
              需求增长得益于开源模型普及、推理成本管控诉求，以及企业从概念验证向生产级基础设施迁移的趋势。Market Briefs 指出，Together AI 引用 OpenRouter
              数据称过去一年全行业开源模型使用量激增三倍（tripling）；即便有独立媒体转载，这依然属于公司单方面引用的市场口径。在 2025 年 2 月融资时，公司披露拥有超 450,000 名开发者、AI
              原生公司及企业客户，但此数据仅代表历史采纳标杆，不能当作现阶段客户规模。增长阻力同样明显：通用服务条款将服务质量、稳定性、正常运行时间及可靠性均交由定制订单约定，而产品官网仅针对保供推理宣传 99% 正常运行时间
              SLA。此外，客户须自行遵守第三方模型条款，且标准条款禁止处理金融、医疗等敏感个人数据。这些限制可能拉长安全与法务审查周期，收窄适用的工作负载范围，或迫使客户走向繁琐的定制合同谈判。
            claimRefs:
              - CM010
              - CM012
              - CM013
              - CM014
              - CM015
