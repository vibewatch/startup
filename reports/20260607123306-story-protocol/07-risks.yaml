callouts:
  - calloutType: risk
    title: "Token Security Classification — No Public Legal Opinion"
    body: "Story has not publicly disclosed an independent securities law counsel opinion on IP token classification. Given the SEC's broad application of the Howey test to staking yield-bearing tokens, this is a material gap that should be closed before institutional capital deployment."
    claimRefs:
      - CR038
      - CR007

  - calloutType: risk
    title: "PIL Enforceability Gap — Arbitration Not Adjudication"
    body: "The PIL resolves on-chain disputes through UMA arbitration, but cross-border royalty enforcement depends on local courts recognizing the PIL as an enforceable contract. No publicly confirmed court precedent exists. Investors should treat off-chain revenue enforcement as aspirational until a test case establishes precedent."
    claimRefs:
      - CR011
      - CR012
      - CR013

