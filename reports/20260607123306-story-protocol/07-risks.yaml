  - id: technical-security-operational-risk
    title: Technical, Security, and Operational Risk
    body: |-
      Protocol v1.3 received independent security audits from Halborn, FuzzingLabs, and Trust Security — three distinct audit firms covering the core smart contract suite. An Immunefi bug bounty program provides continuous researcher incentive for vulnerability discovery. These mitigations are meaningful relative to many early-stage protocols, but Story's royalty module propagates economic flows through recursive IP derivative graphs, a novel architecture distinct from conventional DeFi AMM or lending protocols. Deep or cyclically linked derivative chains may expose edge-case vulnerabilities not fully exercised in the v1.3 audit scope, particularly in state transitions involving large royalty trees or governance-controlled whitelisting of revenue tokens.

      Validator centralization is a structural early-stage risk for any post-launch L1. Story's CometBFT consensus with an initial validator set has undergone governance-driven recalibration through SIP-9 and SIP-10, but the current validator count, stake distribution by address, and geographic diversification have not been published in a form suitable for concentration analysis. A cartel controlling more than one-third of staked IP could stall block finality; controlling two-thirds enables block reordering. Smart contract upgrades are governance-controlled, which creates an upgrade-capture risk if quorum is achievable by a concentrated coalition.

      The broader DeFi ecosystem context — catalogued by rekt.news — shows ongoing exploitation patterns including supply-chain attacks on developer tools, admin-key compromises across multi-chain protocols, and permissionless signer authorization failures, all of which are relevant to Story's Cosmos SDK and EVM dual-stack architecture. Story's mainnet has approximately 16 months of production operation as of June 2026, limiting the reliability track record. Block explorer and API uptime commitments are not publicly documented.
