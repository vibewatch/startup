  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: regulatory
      missingEvidence: "An independent securities law counsel opinion on whether the IP token constitutes an investment contract under the Howey test, or whether the SEC has issued any informal guidance, no-action letter, or enforcement action relevant to Story's token structure."
      whyItMatters: "Without a securities law opinion, institutional investors cannot assess the regulatory risk floor; an adverse SEC finding could force exchange delistings and restrict US operations."
      diligencePath: "Engage top-tier securities counsel (e.g., Cooley, Perkins Coie) for a formal legal opinion; request from management any prior legal memos on token classification."
      relatedQuestionRefs:
        - QR030
      relatedTableRefs:
