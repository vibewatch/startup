  - id: mitigations-monitoring-criteria
    title: Mitigations, Monitoring Indicators, and Kill Criteria
    body: |-
      Story's mitigations are uneven across its top risks. Smart contract security is best-covered: three independent audits, an active Immunefi bug bounty, and a modular architecture that allows future audit scoping as the royalty graph grows. The UMA Dispute Module provides an on-chain deterrent to IP misuse. The Critics Guide blog demonstrates institutional awareness of the key criticisms and a willingness to address them. SIP-9 and SIP-10 governance proposals show the community can coordinate on substantive parameter changes.

      The weakest mitigation coverage is on regulatory and legal risk. Story's IP token utility framing reduces securities law risk but is not supported by public securities counsel opinion. The PIL has not been tested in court. The MiCA White Paper addresses EU compliance intent but without external audit confirmation. Financial opacity (undisclosed runway, treasury, revenue) means investors cannot independently assess capital adequacy.

      Key monitoring indicators include: on-chain IP asset registration count (should exceed 10,000 new registrations within 12 months post-mainnet); daily on-chain revenue recovery above $5,000 on DeFiLlama (the $0 reading as of early 2026 is a red flag); validator count and top-10 stake concentration via the block explorer; IP token unlock adherence to the revised August 2026 schedule; any SEC, CFTC, or EU regulatory enforcement action naming analogous utility tokens; and HarperCollins integration depth versus a press-only partnership. Thesis-break triggers include: any court ruling rejecting PIL as enforceable in a target jurisdiction; any smart contract exploit causing material loss; failure to announce a second major enterprise partner within 12 months; or any SEC Wells Notice on the IP token. Diligence asks: obtain independent securities law opinion on IP token classification; confirm validator set composition and governance quorum thresholds; review audited financials or treasury confirmation; obtain external IP counsel validation of the PIL's cross-jurisdictional enforceability.
