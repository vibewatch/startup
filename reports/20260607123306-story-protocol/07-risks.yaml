  - id: people-execution-risk
    title: People, Execution, and Governance Risk
    body: |-
      Story Protocol is founder-led, with Seung Yoon Lee as the primary external spokesperson and strategic representative. Lee's prior $440 million Radish exit establishes credibility, and he has demonstrated willingness to defend controversial decisions publicly (the token unlock delay). However, the board structure, investor control rights, and succession planning are not publicly documented. Engineering and technical leadership visibility is limited in public sources; the CTO function is not consistently disclosed, creating opacity around technical decision authority for a protocol whose core asset is its smart contract architecture.

      Story's PIL legal framework is a novel combination of blockchain smart contracts and conventional IP law, requiring specialized legal-technical expertise that is rare. Reliance on external IP counsel for PIL development introduces key-person advisory risk. Story's Critics Guide demonstrates sophisticated internal thinking about legal limitations, but external validation of the PIL by independent IP courts has not occurred. Business development for enterprise IP licensing involves long sales cycles and domain expertise; the HarperCollins deal demonstrates BD capacity but does not confirm a repeatable, scalable enterprise motion.

      The governance recalibrations documented in SIP-9 and SIP-10 — submitted January 2026 — show active community engagement, which is a positive governance indicator. However, both proposals involved substantive parameter changes (emissions rates, staking multipliers, threshold amounts) that suggest the initial tokenomics model was not fully validated before launch. Investors should assess whether future governance proposals could unilaterally alter economic parameters in ways adverse to their interests.
