company:
  name: Story Protocol
chapter:
  number: 7
  title: Risks
  summary: |-
    Story Protocol's risk stack is severity-led by the unresolved classification of the IP token under US securities law and the enforceability limits of the Programmable IP License, compounded by the February 2026 token-unlock delay triggered by $0 daily on-chain revenue at the time of announcement. Technical exposure from a novel IP-graph royalty architecture sits below three independent security audits, while governance recalibrations through SIP-9 and SIP-10 signal active in-production tuning. Ecosystem concentration — one dominant investor (a16z), one named enterprise partner (HarperCollins), and a single arbitration provider (UMA) — amplifies every other risk vector.

sections:
  - id: regulatory-legal-risk
    title: Regulatory and Legal Risk
    body: |-
      Story Protocol's most material regulatory exposure sits at the intersection of securities law, IP copyright rulemaking, and EU crypto-asset regulation — all simultaneously evolving. In the United States, the SEC has not issued formal guidance specifically classifying native layer-1 blockchain tokens, but has applied the Howey investment-contract test broadly to tokens generating staking yields. The IP token's utility functions — gas fees, staking, and on-chain governance — reduce but do not eliminate classification risk, and Story has not publicly surfaced an independent securities counsel opinion on the topic. The CFTC has separately asserted commodity jurisdiction over non-security digital assets, creating a bifurcated and uncertain regulatory landscape.

      The Programmable IP License (PIL) is the core legal instrument Story offers creators; however, it is an off-chain legal contract. The on-chain smart contract automates PIL terms within Story's blockchain but does not create court jurisdiction. Story explicitly acknowledges it cannot serve as a court and relies on UMA Protocol for on-chain arbitration. Off-chain enforcement depends on the PIL's governing jurisdiction as interpreted by local courts — a posture that has not been tested in any publicly reported court proceeding. Story's critics guide further acknowledges the system cannot immediately improve off-chain royalty reporting, which requires licensees' accounting integration.

      On AI training data, the US Copyright Office released a pre-publication version of Part 3 on generative AI training data in May 2025, with final publication pending as of June 2026. Its conclusions on training data licensing could directly validate or restrict Story's use case. The EU AI Act (published July 2024) introduces GPAI obligations under Article 53 requiring training data transparency, which may drive demand for Story's provenance infrastructure while also imposing compliance costs. EFF has warned that blockchain-based IP enforcement systems risk amplifying the suppressive effects that already exist in current IP law at scale, a critique directly relevant to Story's regulatory positioning. Story Foundation's MiCA White Paper signals EU crypto compliance awareness, but its adequacy under full EU enforcement has not been independently verified.
