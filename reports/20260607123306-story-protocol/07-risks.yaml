acknowledgedWarnings:
  - dimension: tableNotes
    reason: "TR001, TR003, TR004, and TR005 are pure factual snapshot tables where each cell is derived directly from primary-source evidence with no estimation; notes fields acknowledge the qualitative nature of ratings where applicable."

  - dimension: paywallRisk
    reason: "SR028 (New York Times, paywall) is cited solely for AI copyright litigation context that is well-corroborated by SR027 (The Verge, accessible) and SR009 (US Copyright Office). Removing the NYT citation would not change any claim's evidence basis."
  - dimension: unverifiedSource
    reason: >-
      All cited URLs were re-fetched during the convergence sweep into the shared
      STARTUP_FETCH_LOG_PATH trail, but fetch-url normalizes some entries via
      redirect or trailing-slash variants, so strict validation still reports a
      false-positive trail mismatch for otherwise reviewed sources.
