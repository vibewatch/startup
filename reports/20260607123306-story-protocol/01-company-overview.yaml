company:
  name: Story Protocol
chapter:
  number: 1
  title: Company Overview
  summary: Story Protocol is a private, post-Series-B IP blockchain platform whose public evidence is strongest on product identity, developer stack, and launch chronology, but weaker on normalized corporate basics such as headquarters, board disclosure, and company operating metrics. Public sources support more than $54 million raised at launch, an August 2024 Series B reported at $80 million and a $2.25 billion valuation, a February 2025 mainnet launch, and a February 2026 token-unlock delay that underscores both technical progress and remaining execution sensitivity.
sections:
- id: identity-platform-and-stage
  title: Identity, Platform, and Business Model
  body: |-
    Story Protocol is best understood in 2026 as a private, venture-backed layer-1 network and company ecosystem built around programmable intellectual property rather than as a consumer media app. The official homepage and documentation describe Story as AI-native infrastructure for the IP economy and a purpose-built blockchain for registering IP, attaching machine-readable usage terms, and routing royalties or attribution across derivative graphs. That framing points to an infrastructure business model: Story sells the chain, the legal-technical middleware, and the developer rails that let creators, data owners, and applications transact around rights-managed IP.

    The identity signals are clearer on product than on company basics. Public launch coverage in 2023 called Story a San Francisco-based startup, while 2024 Series B coverage called PIP Labs Palo Alto-based, and the current official site in the fetched set does not present a clean headquarters line. The safest synthesis is that Story has strong public evidence on product identity and stage—private, post-Series-B, post-mainnet, and token-live—but still leaves some legal-entity basics for confirmatory diligence.
