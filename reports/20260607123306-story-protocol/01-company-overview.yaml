  evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, committee map, investor-control terms, and the clean legal-entity headquarters address.
    whyItMatters: Leadership visibility without governance detail is not enough to underwrite control risk, board leverage, or key-person concentration.
    diligencePath: Request the latest board deck, cap table, investor rights summary, and the legal-entity chart directly from management or counsel.
    relatedQuestionRefs:
    - QO011
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: minor
    topic: founding
    missingEvidence: An official source stating the precise founding or incorporation date and the original legal domicile of Story or PIP Labs.
    whyItMatters: The timeline is directionally clear, but exact dating matters for refresh comparisons, legal filings, and founding-team history.
    diligencePath: Obtain incorporation documents, a Delaware or California entity extract, or an official company profile page that states the founding date.
    relatedQuestionRefs:
    - QO026
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Current revenue, ARR, headcount, and any audited or board-approved operating metric package.
    whyItMatters: Without company operating metrics it is impossible to judge whether technical momentum and capital raised are translating into an investable operating business.
    diligencePath: Request the current board deck or finance package with revenue, ARR, burn, runway, headcount, and hiring plans.
    relatedQuestionRefs:
    - QO018
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: customer-count
    missingEvidence: Current customer count, active enterprise accounts, and a named customer or partner concentration view.
    whyItMatters: Ecosystem pages and token metrics do not answer whether Story has repeatable enterprise or creator adoption at the company level.
    diligencePath: Request customer cohort data, reference accounts, and pipeline conversion metrics from go-to-market leadership.
    relatedQuestionRefs:
    - QO027
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: minor
    topic: funding-history
    missingEvidence: A reconciled financing table that explains why some sources report an $80 million Series B while database trackers show $71.9 million and how any smaller rounds are classified.
    whyItMatters: Funding totals and valuation history are core chapter-one facts that later valuation analysis will reuse, so unresolved discrepancies create avoidable drift.
    diligencePath: Request the company financing timeline or cap-table summary and reconcile it against database entries before building the valuation chapter.
    relatedQuestionRefs:
    - QO015
    - QO017
    relatedTableRefs:
    - TO001
    - TO003

