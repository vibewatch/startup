- id: funding-history-and-stakeholders
  title: Funding History, Valuation, and Stakeholders
  body: |-
    Story’s funding history is directionally clear but numerically imperfect. Official 2023 launch materials said the project came to market with more than $54 million led by a16z crypto, and independent Variety coverage corroborated both the amount and much of the investor roster. DefiLlama then decomposed the early financing into a $29.3 million seed, a $27.5 million Series A, and a later $5 million KOL round. By August 2024, ETCentric reported that PIP Labs raised $80 million at a $2.25 billion valuation led by a16z and Polychain, while DefiLlama recorded the same Series B at $71.9 million.

    That discrepancy is not fatal, but it matters. A press-based reading suggests at least $134 million of publicly disclosed capital before any smaller intermediate financings; a database-based reading lands near $133.7 million. Both point to a heavily venture-backed company with repeat support from a16z and continuing participation from investors such as Hashed and Samsung Next, but later-stage diligence should still reconcile the exact 2024 round gross proceeds, any secondary component, and the cap-table/control consequences of repeat investors.
