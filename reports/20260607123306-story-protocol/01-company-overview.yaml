- id: milestones-and-diligence-flags
  title: Milestones and Diligence Flags
  body: |-
    Story’s public chronology now has enough milestones to serve as later-chapter ground truth. Third-party data traces the earliest disclosed financing to 2023, official launch materials surfaced the project in September 2023, the 2024 Series B reset valuation sharply higher, mainnet went live in February 2025, the company published a technical roadmap days later, and by April 2025 it had produced a dedicated “Critic’s Guide” page addressing prominent objections around the project. In February 2026, Story then delayed locked insider and investor token unlocks by six months, from February 13 to August 13, a clear post-launch governance and market-structure decision.

    The main diligence flags are not hidden. First, the company itself acknowledges criticism and made a tokenomics change after launch, which implies the network still needed more time to build usage and absorb supply. Second, Story’s value proposition depends on off-chain legal enforceability in a domain where copyright, derivative-work, and AI-governance rules remain contested; EFF’s critique of overbroad IP enforcement and the EU AI Act backdrop make that a real execution variable. Third, public disclosure is still thin on board composition, revenue, headcount, and customer count. Story looks technically real and well capitalized, but still not fully normalized as a diligence-ready corporate disclosure surface.
