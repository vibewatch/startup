- id: mainnet-token-and-developer-footprint
  title: Mainnet, Token, and Developer Footprint
  body: |-
    The strongest evidence of operating maturity is technical and network-facing rather than corporate-metric-heavy. Story’s mainnet blog page shows a 2025-02-13 publication marker and references day-one rewards beginning that same date, while later company materials show a technical roadmap update, a live ecosystem page, a public staking dashboard, and a Storyscan explorer. Token-market aggregators and the official token pages confirm that $IP is live and used for gas, governance, staking, IP registration, licensing, and revenue-linked flows. GitHub sources go further: Story maintains separate consensus and execution clients, core and periphery contracts, plus TypeScript and Python SDKs for application builders.

    That combination makes Story more than a concept deck. Developers can register IP assets, attach PIL terms, mint licenses, claim royalties, raise disputes, and interact with mainnet or the Aeneid testnet through documented tooling. But the public footprint is still asymmetric. There is more visible evidence of chain, SDK, and token infrastructure than of company-level revenue, customer count, or headcount, so the technical build-out is ahead of conventional operating disclosure.
