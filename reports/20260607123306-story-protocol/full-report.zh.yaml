      - number: '7.2'
        title: 代币经济与财务风险
        blocks:
          - type: paragraph
            body: >-
              Story 在 2026 年 2 月决定延迟 IP token 解锁时间表，是迄今最尖锐的外部财务模型压力信号。CoinDesk 基于 DeFiLlama 数据报道，Story 的日链上收入在 2025 年 9
              月达到 $43,000 峰值，并在公告时为 $0。联合创始人 SY Lee 公开为延迟辩护，称近零链上收入不是 IP 链的正确指标，因为 gas
              费被有意压低，变现预计通过许可协议在线下累积。第一次主要团队和投资人代币解锁被推迟至 2026 年 8 月，在团队转向 AI 训练数据许可期间延长了锁定期。


              SIP-9 治理提案暴露出结构性排放超标：协议每年大约发行 25 million IP tokens，比 20 million 目标高 27%，原因是高于预期的出块量（每年约 13.14 million
              blocks，而设计值为 10.37 million）没有触发抵消性排放调整。SIP-9 将年排放降至 15.3 million，并把锁定质押乘数从 0.5x 降至 0.025x，使质押奖励大幅转向未锁定
              token 持有人。这些修正确实重新对齐了激励，但也引入自身风险：锁定质押奖励削减可能降低早期验证者运营者的长期网络参与度，整体排放削减也会压缩年化质押收益。


              Story 没有公开披露金库余额、运营跑道或收入拆分，投资人无法仅凭公开证据评估资本充足性。Grayscale 的 Story Trust 提供机构价格敞口，但也把 IP token
              价格表现连接到更广泛的赎回动态。相对其他 Series B 后的 L1 链，DeFiLlama 上的 TVL 仍然不高；代币解锁延迟本身也确认，采用水平低于原定解锁时间表所需门槛。
