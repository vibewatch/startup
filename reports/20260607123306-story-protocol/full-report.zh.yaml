  - id: FE001
    title: Story Protocol 产品架构栈
    type: stack
    layout: wide
    summary: |
      截至 2026 年 6 月，从共识到应用的六层架构，展示 Story 的 EVM 兼容 L1、Proof-of-Creativity 模块和开发者工具。
    data:
      layers:
        - label: 应用与生态
          modules:
            - IP Portal（story.foundation IP 市场）
            - Protocol Explorer / Storyscan 区块浏览器
            - 质押仪表盘 Staking Dashboard（staking.story.foundation）
            - Claude MCP 集成（Anthropic Model Context Protocol）
        - label: 开发者工具 / SDK
          modules:
            - TypeScript SDK 工具（storyprotocol/sdk — npm @story-protocol/core-sdk）
            - Python SDK 工具（storyprotocol/python-sdk）
            - 外围合约 / SPG（storyprotocol/protocol-periphery-v1）
        - label: Proof-of-Creativity 模块（Solidity）
          modules:
            - 许可模块（父子 IPA 关系；PIL 执行）
            - 版税模块（IP Royalty Vault；Royalty Tokens；祖先图路由）
            - 争议模块（UMA 预言机仲裁；5 个争议标签）
            - 分组模块（跨 IPA 集合的共享收入池）
            - 元数据模块（结构化链上 IP 元数据）
        - label: IP 注册表与身份
          modules:
            - IP Asset Registry（ERC-721 关联 IP 身份；部署 IP Accounts）
            - IP Accounts（ERC-6551 代币绑定账户；存储许可和版税）
            - IPGraph Precompile（用于祖先图遍历的有状态 EVM 预编译）
        - label: 执行层
          modules:
            - Story Geth 分叉（EVM 执行；go-ethereum 分叉；chain ID 1514 Homer 主网）
            - ABCI++ 适配器（通过 Engine ABI 将 EVM 状态桥接到 CometBFT）
        - label: 共识层
          modules:
            - CometBFT（BFT 共识；快速终局性；PIP Labs 的 Cosmos SDK 分叉）
            - 验证者集合（活跃质押者；通过 staking.story.foundation 管理）
    approximationNotes: |
      层级顺序反映架构依赖关系（底部 = 基础层）。模块列表基于截至 2026 年 6 月的官方 GitHub 仓库和文档。IP Vault 和 Confidential Data Rails 未纳入该栈，因为其生产层级位置尚未确认。
    claimRefs:
      - CE002
      - CE003
      - CE005
      - CE011
      - CE040
  - id: FE002
    title: IP 注册与许可工作流
    type: flow
    layout: standard
    summary: |
      端到端流程：创作者在 Story 主网上注册 IP，经过衍生许可，最终自动分配版税。
    data:
      nodes:
        - id: n1
          label: 创作者铸造 ERC-721 NFT
          detail: |
            创作者铸造或使用现有 ERC-721 NFT 来代表 IP 作品。在 Story 上，NFT 所有权等同于 IP 所有权。
          tone: neutral
        - id: n2
          label: 在 IP Asset Registry 注册 NFT
          detail: |
            调用 IP Asset Registry 会部署一个 IP Account 智能合约（ERC-6551），并由 ipId 地址唯一标识。
          tone: positive
        - id: n3
          label: 附加 PIL 许可条款
          detail: |
            所有者通过许可模块设置链上许可条款（商业使用、铸造费、署名要求、收入分成 %）。
          tone: positive
        - id: n4
          label: 被许可方铸造许可代币
          detail: |
            第三方支付铸造费，并获得一枚许可代币，按附加 PIL 条款取得使用该 IP 的权利。
          tone: neutral
        - id: n5
          label: 注册衍生 IPA（父子链接）
          detail: |
            被许可方把自己的衍生作品注册为新的 IPA，并链接到父级，继承版税堆栈义务。
          tone: neutral
        - id: n6
          label: 衍生作品产生收入
          detail: |
            该衍生作品以白名单代币（如 WIP）产生链上收入。
          tone: positive
        - id: n7
          label: 版税模块通过 IPGraph 路由收入
          detail: |
            IPGraph 预编译遍历 IPA 祖先树；版税模块按约定分成，将收入路由到每个祖先的 IP Royalty Vault。
          tone: positive
        - id: n8
          label: IP 持有人从 Royalty Vault 认领
          detail: |
            原始创作者和中间 IP 持有人通过 SDK 或 Protocol Explorer，从各自的 IP Royalty Vault 认领按比例分得的收入。
          tone: positive
      edges:
        - from: n1
          to: n2
          label: 注册
        - from: n2
          to: n3
          label: 附加条款
        - from: n3
          to: n4
          label: 许可已铸造
        - from: n4
          to: n5
          label: 衍生作品创建
        - from: n5
          to: n6
          label: 产生收入
        - from: n6
          to: n7
          label: 链上支付
        - from: n7
          to: n8
