      - number: '6.5'
        title: 集中度风险、采购摩擦、先落地再扩张逻辑与反向证据
        blocks:
          - type: paragraph
            body: >
              Story Protocol 面临三类不同的集中度风险。第一是生态应用集中度：链上 IP 注册中相当一部分可能来自 Ippy 吉祥物及其衍生品——这些资产由 Story Foundation 自己控制。如果
              Ippy 驱动的活动占链上注册多数，真实第三方采用就会显著低于头部数字暗示的水平。第二是投资人与开发者集中度：团队和投资人的代币锁定至 2026 年 8 月，a16z 领投 $80M Series
              B。生态补助依赖意味着应用开发者可能主要为获取补助激励而建设，而不是因为协议解决了一个立即可变现的痛点。第三是 AI 转向集中度：团队明确转向 AI 数据许可，使近端客户逻辑集中在尚未披露的企业交易上。

              相比传统 SaaS，采购摩擦更高：用户必须持有 $IP tokens、执行链上交易、管理加密钱包，并理解 Programmable IP License 法律框架。目标 AI
              客户也可以选择其他数据获取方式——网页抓取、直接许可、封闭数据集——这些方式不需要区块链基础设施；Story 的链上方案是否有足够差异化来抵消摩擦，仍不清楚。

              先落地再扩张逻辑要求：(1) 生态开发者构建应用 → (2) 这些应用吸引终端用户注册 IP → (3) AI 公司付费许可已注册 IP → (4) 版税流产生协议收入和创作者留存。步骤 1–2
              已有早期生态信号；步骤 3–4 仍停留在愿景。反向证据很重：$0 日收入、一次被描述为应对「使用滞后」的六个月代币解锁延迟，以及没有公开宣布的具名企业 AI 许可客户。
