            body: >
              团队明确的战略转向，把 Story 的客户逻辑推向权利清晰 AI 训练数据集的企业许可。如果判断正确，链上 gas 收入在结构上确实不是业务健康度的好代理。但截至 2026 年 6 月，没有企业 AI
