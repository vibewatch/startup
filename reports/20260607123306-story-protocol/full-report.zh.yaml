  - id: TV002
    title: 投资逻辑与反向逻辑
    columns:
      - 论点
      - 立场
      - 什么会改变判断
    rows:
      - - $80T 全球 IP 市场由碎片化的传统基础设施支撑，结构上错配 AI 时代速度
        - 投资逻辑
        - 现有机构（ASCAP、BMI、Getty、传统登记机构）成功适应 AI 时代 IP；市场份额没有转向链上替代方案
      - - 唯一为 IP 定制的 L1 区块链，结合法律集成的 PIL 框架；在链上 IP 领域有先发优势
        - 投资逻辑
        - Ethereum/Solana 生态通过 a16z 支持的竞争对手加入可信 IP 模块；PIL 框架在任何司法辖区都未获得执行
      - - 转向 AI 数据授权，瞄准付费意愿高的企业买方（AI 实验室），提供权利清晰的数据集
        - 投资逻辑
        - AI 实验室自建或收购数据授权基础设施；合成数据让人类贡献的数据在经济上失去价值
      - - 创始人 SY Lee 曾实现 $440M 退出（Radish Media，2021），证明其企业分销能力
        - 投资逻辑
        - 关键创始团队成员离职；或 Radish 退出无法迁移为 B2B IP 基础设施销售动作
      - - $142M 股权资本，加上 a16z 与 Polychain 背书，提供多年开发跑道
        - 投资逻辑
        - 烧钱速度超过 $20M/年；若没有新一轮融资或代币金库变现，跑道降至 18 个月以下
      - - 协议日收入 $0（DeFiLlama，2026 年 6 月）；2025 年 9 月 $43K 峰值后从未恢复
        - 反向逻辑
        - 独立链上数据证明企业合同贡献 >$5M ARR，从而确认 DeFiLlama 指标是错误代理
      - - 代币 FDV 约 $300M，较 $2.25B 股权标记折价 7.5×；市场没有验证股权价格
        - 反向逻辑
        - 二级股权交易价格达到或高于 $2.25B；或 FDV 因企业采用信号回升至 $1B 以上
      - - 可比链上 IP / 数据代币（Ocean $21.7M、Audius $21.3M）商业牵引力近零
        - 反向逻辑
        - Ocean 或 Audius 做到 $100M+ ARR，证明品类可行；或 Story Protocol 披露企业收入，脱离同业趋势
      - - $2.25B 股权估值从未官方披露——据 CNBC 来自匿名来源；没有公开财务依据
        - 反向逻辑
        - PIP Labs 发布经审计财务，或发布投资人级财务模型并用实际数据确认企业收入足以支撑该估值
      - - 代币解锁从 2026 年 2 月推迟到 8 月，由使用滞后和抛压担忧驱动——内部人不愿按当前代币价格释放供应
        - 反向逻辑
        - 2026 年 8 月解锁前代币价格回到 $2.00 以上，证明自然需求能承接新增供应
    notes: 投资逻辑与反向逻辑各行代表独立证据线索，不是预测。每个“什么会改变判断”栏都定义了一个可证伪触发器。
