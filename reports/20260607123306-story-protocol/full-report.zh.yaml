      - number: '7.5'
        title: 团队、执行与治理风险
        blocks:
          - type: paragraph
            body: >-
              Story Protocol 由创始人主导，Seung Yoon Lee 是主要外部发声人与战略代表。Lee 此前以 $440 million 退出
              Radish，建立了可信度；他也展现了公开捍卫争议决策的意愿（代币解锁延迟）。不过，董事会结构、投资人控制权和继任规划没有公开记录。公开资料中，工程和技术领导层能见度有限；CTO
              职能并不稳定披露，这让一个核心资产是智能合约架构的协议，在技术决策权上存在不透明。


              Story 的 PIL 法律框架把区块链智能合约与传统知识产权法组合在一起，需要罕见的法律-技术专长。PIL 开发依赖外部 IP 法律顾问，引入关键顾问风险。Story 的 Critics Guide
              展示了对法律限制的成熟内部思考，但 PIL 尚未得到独立 IP 法院的外部验证。企业 IP 许可业务开发销售周期长、领域专长要求高；HarperCollins 交易证明了 BD
              能力，但不能证明企业打法可重复、可扩展。


              SIP-9 和 SIP-10 记录的治理再校准——均在 2026 年 1
              月提交——显示社区参与活跃，这是正面治理指标。不过，两项提案都涉及实质性参数变化（排放率、质押乘数、阈值金额），说明初始代币经济模型在上线前没有得到充分验证。投资人应评估，未来治理提案是否可能单方面改变经济参数，并损害自身利益。
            claimRefs:
