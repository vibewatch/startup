      - 行动含义
    rows:
      - - 主网上线 24 个月后企业收入仍为零
        - 到 2027 年 2 月（主网上线后 24 个月）未披露 AI 数据授权 ARR
        - 核心收入转向 AI 授权失败；没有收入锚点时，$2.25B 股权估值无法维持
        - 退出或减记；不要按当前估值参与任何新一轮融资
      - - 2026 年 8 月解锁触发代币崩盘
        - $IP 价格在 2026 年 8 月解锁后 30 天内下跌 >50%
        - 内部人在弱需求中分发代币；信号更像退出压力，而不是长期信念
        - 降低持仓；要求召开紧急董事会；监测创始人进一步卖出
      - - 关键创始团队成员离职
        - SY Lee、Jason Levy 或 Jason Zhao 任一人在 18 个月内离职
        - 创始人信念信号断裂；机构支持方可能重新评估；产品路线图大概率受扰
        - 触发董事会权利复核；争取剩余创始人的锁定承诺
      - - 大型 AI 实验室自建或收购竞争性 IP 登记簿
        - OpenAI、Google DeepMind、Anthropic 或 Meta 宣布自有链上或 AI 原生 IP 登记簿产品
        - 最大潜在企业客户变成直接竞争对手；护城河被侵蚀；可触达市场收缩
        - 将乐观情景概率从 10–15% 重新评估至 <5%；仅建模人才收购情景
      - - 链上 IP 执行遭遇不利监管裁决
        - EU AI Act 执法行动或美国联邦法院裁决，直接否定基于区块链的 IP 授权具备法律可执行性
        - PIL 框架失去法律支撑；核心产品差异化被消除，退化为纯基础设施玩法
        - 立即重启尽调；寻求外部法律顾问对跨司法辖区 PIL 可执行性的意见
      - - 代币价格跌破 $0.05
        - $IP 现货价格连续 30+ 天低于 $0.05
        - 基金会金库耗尽至 <$5M；质押排放几乎失去价值；验证者安全性下降
        - 评估网络安全风险；探索股权资本能否填补金库缺口；考虑困境收购
    notes: 触发器定义为可证伪事件，不是概率评估。建议监测频率：代币价格每月一次，收入确认尝试每季度一次，监管扫描每半年一次。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
      - CV039
  - id: TV006
    title: 最终尽调资料请求
    columns:
      - 尽调线
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 企业收入
        - CFO 认证的 AI 数据授权 ARR，或 2025 年 2 月至 2026 年 6 月期间零收入确认
        - 没有收入数据，$2.25B 股权估值无法与任何公开估值信号对齐；所有情景都没有边界
        - PIP Labs CFO 或审计师；要求带实际数据的投资人级财务模型；取得标注总价值的已签数据授权合同
      - - 代币归属时间表
        - 团队、Series A 投资人、Series B 投资人和 KOL 轮的完整逐方代币归属时间表；按类别列出 2026 年 8 月准确解锁数量
        - 2026 年 8 月解锁是近期最大的供应冲击；没有逐方时间表，无法量化卖压规模
        - PIP Labs CFO 或法律顾问；与已发布的代币分配表交叉核对
      - - 资金跑道
        - 当前现金余额、月度运营烧钱速度，以及在多个 $IP 价格情景（$0.10、$0.30、$1.00）下的预计跑道
        - 烧钱速度和跑道决定股权资本能否撑到企业授权收入落地
        - 要求 CFO 认证的过去 12 个月 P&L；银行流水或经审计资产负债表；管理层提供情景分析
      - - 协议采用
        - 自主网上线以来（2025 年 2 月至 2026 年 6 月）的链上版税总额、许可铸造量和活跃 IP 持有人数量
        - 这些是协议采用的主要代理指标；缺失时无法判断授权模型是否创造经济价值
        - 通过 StoryScan 或直接向工程团队查询 Royalty Module 和 Licensing Module 事件日志；要求 StoryScan 分析报告
      - - 法律可执行性
        - 任何法律意见或法院先例，确认 PIL 支持的许可在至少一个主要司法辖区（美国、欧盟或英国）具有法律可执行性
        - PIL 框架是核心护城河；没有法律可执行性确认，区块链与法律之间的桥接仍停留在理论层面
        - 外部 IP 法律顾问就 PIL 可执行性出具意见；询问 AI Act 合规顾问；审阅现有执法行动或争议解决记录
      - - 竞争定位
        - 与前 10 大 AI 实验室或大型媒体公司的企业洽谈状态；确认 HarperCollins 和 Legendary/Goyer 交易经济性
        - 企业客户是乐观情景的关键开关；保密合作意向反映管线强弱
        - 管理层与具名企业合作伙伴的推荐访谈；要求已执行协议的脱敏条款
    notes: 尽调请求按优先级列出；第 1–3 项（收入、归属、跑道）会阻断任何新资本部署决策。第 4–6 项同样重要，但可在收到第 1–3 项之后推进。
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
