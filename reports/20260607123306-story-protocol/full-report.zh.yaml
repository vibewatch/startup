        - 公开且链上可见；授权条款链上可见
      - - Ocean Protocol
        - 数据所有者设置浮动 datatoken 价格；质押 / 策展费用
        - 访问时以 Datatokens 向数据所有者分发版税
        - 仅访问控制（无线下法律执行）
        - 每个 datatoken 链上公开定价
      - - Manifold
        - 免费部署智能合约；铸造需支付 Ethereum gas 费
        - 创作者按 ERC-2981 版税信号设置版税
        - 自愿版税；市场必须支持 ERC-2981
        - 链上公开；合约条款可见
      - - EIP-2981（标准）
        - 无平台费（开放标准）；仅 gas 成本
        - 按 royaltyInfo() 调用返回销售价的一定比例
        - 自愿执行；市场可选择不实现
        - 标准合约接口；无平台层
      - - Royalty Exchange（传统）
        - 版税权利在市场出售时收取佣金
        - 预先出售未来版税收入流
        - 合同执行；不可编程，非链上
        - 不透明；私下条款和谈判
      - - 现状（法律合同）
        - 律师费；逐笔交易起草；复杂授权通常 $10K–$100K+
        - 协商版税表；通过 PROs 或直接交易收取
        - 可由法院执行，但需要主动诉讼
        - 私下；非标准化；摩擦高
    notes: >
      Story Protocol 和 Ocean Protocol 的费用水平取决于 gas 价格和所有者设定的铸造费，都会动态变化。“现状”行代表通过律师和 PROs（ASCAP、BMI）完成的传统 IP
