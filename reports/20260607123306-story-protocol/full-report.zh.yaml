      - number: '2.3'
        title: 增长驱动、采用约束与反向信号
        blocks:
          - type: paragraph
            body: >-
              需求侧驱动真实存在，但还没有转化为链上商业规模收入。监管方面，EU AI Act 第 53 条要求 GPAI 提供商记录训练数据并遵守版权要求——这是硬法驱动，直接为 Story 的训练数据授权价值主张背书。AI
              版权诉讼持续涌现（音乐出版商、新闻机构、图库机构诉 AI labs），给 labs 带来声誉和法律压力，迫使其采购权利清晰的数据，而这正是 Story 宣传的供给。Goldman Sachs 对 $500
              billion 创作者经济的估计确认内容变现市场巨大且仍在增长。Grayscale 在 2025 年 7 月推出 Story Trust，让机构投资者获得 $IP 敞口，并引用「$80T intellectual
              property market」——即使这个头部数字缺乏方法论基础，它仍是机构合法性信号。

              约束同样重要。$IP token 曾达到 $14.78 的历史高点，截至 2026 年 6 月约较峰值低 97.9%（CoinGecko），反映市场情绪弱、网络使用稀疏。CoinDesk 2026 年 2
              月报道称，Story 因为「使用量滞后和抛售担忧升温」把团队及投资者代币解锁推迟到 2026 年 8 月——这是采用速度上的重要反向信号。Programmable IP License
              是链下法律文件，其可执行性取决于美国版权法下各司法辖区是否承认智能合约条款，法院尚未最终解决这一问题。EFF 认为 IP
              体系已经赋予权利人「对创新的否决权」，批评者则主张，区块链层增加了摩擦，却没有解决大规模权利清理的根本问题。此外，主流 IP
              所有人（音乐厂牌、电影公司、游戏发行商）没有加密钱包，把作品目录搬上链的切换成本很高；除非 Story 投入专门 onboarding 项目，并提供法币轨道和托管工具，否则近期 SAM
              会被限制在加密原生创作者和开发者驱动工作流中。
