            body: >
              在纯链上 IP / 数据授权维度，Ocean Protocol 是 Story 最接近的类比对象，但结构上不同。它用 ERC721 Data NFTs 表示数据所有权，用 ERC20 Datatokens
              作为访问控制权限，并通过 Compute-to-Data 在加密数据集上实现保护隐私的远程计算。截至研究日，其 OCEAN token 较历史高点约低 -94%，市值接近 $21.7M、FDV 为
              $29M，说明代币市场尚未按早期支持者的估值验证数据市场逻辑。Manifold 是一个不到 10 人的团队，在 Ethereum 上搭建 NFT 智能合约基础设施，由 a16z crypto 和
              Initialized Capital 支持；其产品支撑 Beeple、Jay-Z、SiA、Adidas、Fortune 和 Mercedes-AMG 的大型创作者发行。其使命表述——「AI
              和数字丰裕时代，创作主权必不可少」——在概念上与 Story Protocol 的理由重叠，但 Manifold 不提供有法律支持的链下许可框架，重点在铸造和分发，而不是授权注册表。Molecule
              Protocol 只专注于面向药物发现融资轮的生物医药 IP-NFT；这个垂直市场的买方、经济性和监管界面都不同于 Story Protocol 的创作者和 AI 训练数据重点。Metaplex 是 Solana
              主要 NFT / token 基础设施提供商，提供可投产的 NFT、同质化 token 和 AI 智能体注册表智能合约——但它不是 IP 授权平台，也局限于 Solana 生态。按 DeFiLlama
              数据，Story Protocol 自身已在四轮融资中获得约 $134M，投资人包括 a16z crypto、Polychain Capital、Hashed 和 Samsung
