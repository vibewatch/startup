      - number: '5.5'
        title: 差异化、技术风险与未决缺口
        blocks:
          - type: paragraph
            body: >-
              Story 的主要技术差异化包括三点：PIL 是有法律基础、机器可读的许可模板（目前仍是协议上唯一此类模板，尽管 License Template 抽象层允许未来新增）；IPGraph
              预编译让深层衍生树上的版税和许可计算能以 L1 成本完成；EVM 兼容性与 CometBFT finality 汇合，使 IP 交易既快又便宜，同时保留开发者熟悉度。Claude MCP 集成把差异化延伸到 AI
              智能体工作流，这是一个结构性高增长市场。


              主要技术风险同样不小。IPGraph 预编译是对 go-ethereum EVM 的新型定制扩展，没有 core Ethereum code 那种长期独立审查谱系；尽管 FuzzingLabs
              构建了专用工具，新预编译仍会积累定制攻击面。Cosmos SDK fork 必须由 PIP Labs 跟进上游安全补丁，形成单一团队维护依赖。支撑 Dispute Module 的 UMA oracle
              是第三方可用性和流动性依赖：停机或操纵可能让争议解决停摆或失真。PIL 在法院中对未同意方的法律可执行性，以及跨司法辖区有效性，仍未经过检验。最后，2026 年 2 月宣布延迟 $IP
              代币供应解锁，并称使用量低于预期，是一个反向信号：商业采用速度尚未追上技术交付。IP Vault 和 Confidential Data Rails 已在 2025 年宣布，但截至 2026 年 6
              月，其生产就绪度仍未得到公开确认，是下一阶段审查的未决尽调缺口。
            claimRefs:
              - CE023
              - CE024
              - CE029
              - CE039
              - CE040
      - number: '5.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 多机构、多方法的主网上线前安全计划
            body: >
              Story 进行了两轮正式审计，参与方包括专业机构（SlowMist、Fuzzland、Halborn、FuzzingLabs 及其定制 IPGraph 模糊测试器、Trust Security
              作为重复参与的独立审查方），之后又做了 $1M 公开审计竞赛（977 份提交，19 个高危问题已修复），并上线 $600K Immunefi 漏洞赏金。与多数可比 L1
              上线相比，这是一套明显更强的上线前安全姿态。
            calloutType: strength
            claimRefs:
              - CE016
              - CE017
              - CE018
          - type: callout
            title: PIL 法律可执行性与新型 IPGraph 预编译是结构性未验证风险
            body: >
              当前安全计划本身解决不了两个结构性风险。PIL 对未同意方没有经过法院检验的可执行性，链上协议惩罚也不是法律救济。IPGraph 预编译是定制 EVM 扩展，外部审查先例有限；FuzzingLabs
              的专用模糊测试器提供了强模糊测试覆盖，但不能替代有预编译经验机构的独立架构审查。两项风险都需要主动法律测试和持续外部安全投入，才能逐步收窄。
