  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反向逻辑与建议
        blocks:
          - type: paragraph
            body: >-
              Story Protocol 的投资逻辑建立在五个汇合的结构性押注上。第一，规模达 $80-trillion 的全球 IP
              市场——包括专利、版权、商标、商业秘密和许可流——仍由慢、贵且按司法辖区割裂的遗留基础设施服务；在 AI 时代的 IP 创建速度面前，这套基础设施明显不适配。第二，Story Protocol 是唯一专为 IP
              打造的 Layer 1 blockchain，并带有法律整合的 IP 许可框架（Programmable IP License），把链上执行与线下法律可执行性连接起来。第三，AI
              训练数据许可子板块是近端商业催化剂：创始人在 2026 年初把产品重心转向向 AI 开发者许可「不可抓取」的人类生成数据集；在这个市场里，权利清晰的溯源有结构性溢价。第四，团队具备机构可信度——a16z
              crypto（领投种子轮和 Series B）、Polychain Capital、Samsung Next、Hashed——且创始人 2021 年以 $440 million 退出 Radish
              Media，证明了企业分发能力。第五，Story Protocol 的 $142 million 股权资本化给了它一条同类链上 IP 对手难以匹配的开发跑道。

              反向逻辑同样有力。Story 的 Series B $2.25B 投后估值来自匿名消息源（「尚未公开」），当时并没有企业许可收入产生。截至本报告运行日，DeFiLlama 记录的日协议收入为 $0，低于 2025
              年 9 月 $43,000 峰值。$IP token 交易价格约 $0.30，隐含 FDV 约 $300M，比股权估值折价 7.5×，且较 2025 年 2 月历史高点下跌
              97.9%。创始人决定把团队和投资人代币解锁从 2026 年 2 月延至 8 月——理由是使用滞后和市场疲软——说明即便内部人士也不愿在解锁时接受代币市场的判决。可比链上 IP 和数据 tokens（Ocean
              Protocol、Audius）市值均约 $21M，意味着该类别可能被公开市场结构性低估；或者相反，市场已经正确衡量了商业机会。尚无任何企业许可合同披露了经常性、以法币计价的收入数字。

              对现有持有人，建议是有条件持有 / 观察。若要以 $2.25B 股权估值新进入，需要满足两者之一：(a) 独立确认企业 AI 数据许可收入超过 $5M ARR；或 (b) 有文件证明已与前十 AI lab
              或主要媒体公司签署一份企业数据许可合同。信心为中，风险评级为高，估值立场是证据不足：公开财务数据无法支撑这一股权估值。
