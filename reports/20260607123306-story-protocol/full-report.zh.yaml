      - number: '3.6'
        title: 图表
        blocks:
          - type: callout
            title: PIL 法律框架是 Story Protocol 最难商品化的护城河
            body: >
              Programmable IP License 是唯一公开文档化、具有法律支撑、并以可比规模映射到链上的链下许可模板。它由专业法律顾问参与设计，以美国版权法为基础，并参考 Creative
              Commons、Arweave 和 a16z 的授权先例。没有区块链竞争者——包括 Ocean Protocol、Manifold 或 Metaplex——做出等价物。这使 PIL 成为最难快速复制的护城河要素。
            calloutType: strength
            claimRefs:
              - CP011
              - CP012
              - CP032
              - CP048
          - type: callout
            title: 代币解锁延期和使用滞后是重要竞争反向信号
            body: >
              2026 年 2 月代币解锁延期——归因于使用量落后预期——提出了一个问题：Story 的法律到区块链桥梁是否已经获得有意义的商业速度。延期在最关键的竞争维度上发出负面信号：创作者和 AI 公司是否实际采用链上
              IP 注册与授权。Sound.xyz 在 2026 年 1 月关闭，说明 IP 上链平台如果网络效应建立不够快，也无法免于采用失败。
            calloutType: risk
            claimRefs:
              - CP007
              - CP022
              - CP037
              - CP040
          - type: callout
            title: 现状替代方案不需要平台采用，并具备法院可执行性
            body: >
              Story Protocol 面临的最持久竞争压力，不来自区块链同业，而来自 IP 所有人使用律师和 PROs 时没有切换成本。权利人通过传统律所注册 IP，可获得全球法院可执行的保护；Story
              Protocol 的 PIL 目前依赖美国版权法，并要求交易对手在链上交易。在 PIL 证明其具备多司法辖区可执行性之前，现状路径将保留结构性的法律确定性优势。
