  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Story Protocol 最重要的监管暴露，位于证券法、IP 版权规则制定和欧盟加密资产监管的交叉点，而三者都在同步演进。美国方面，SEC 尚未发布正式指引，专门界定原生 layer-1 区块链 tokens
              的属性，但已把 Howey 投资合同测试广泛用于产生质押收益的 tokens。IP token 的用途——gas 费、质押和链上治理——降低但没有消除分类风险；Story 也没有公开呈现独立证券律师意见。CFTC
              另行主张对非证券数字资产拥有商品管辖权，使监管格局呈现二元且不确定的状态。


              Programmable IP License（PIL）是 Story 提供给创作者的核心法律工具；但它是线下法律合同。链上智能合约在 Story 区块链内自动化 PIL 条款，却不会创造法院管辖权。Story
              明确承认自己不能充当法院，并依赖 UMA Protocol 进行链上仲裁。线下执行取决于本地法院如何解释 PIL 的适用司法辖区——这种安排尚未在任何公开报道的法院程序中接受检验。Story 的 critics
              guide 还承认，系统不能立即改善线下版税报告，因为这需要被许可方接入会计系统。


              AI 训练数据方面，美国版权局在 2025 年 5 月发布了生成式 AI 训练数据 Part 3 的预发布版本；截至 2026 年 6 月，最终发布仍待完成。其对训练数据许可的结论，可能直接验证或限制 Story
              的用例。EU AI Act（2024 年 7 月发布）在 Article 53 下引入 GPAI 义务，要求训练数据透明度；这可能推动对 Story 溯源基础设施的需求，也会带来合规成本。EFF
              警告称，基于区块链的 IP 执行系统可能放大现行知识产权法中已经存在的压制效应，这一批评与 Story 的监管定位直接有关。Story Foundation 的 MiCA White Paper
              显示其有欧盟加密合规意识，但在完整欧盟执法下是否足够，尚未得到独立验证。
