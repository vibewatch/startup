      - number: '6.2'
        title: 具名生态应用证据——合作伙伴证明与付费客户证明
        blocks:
          - type: paragraph
            body: >
              Story Protocol 在生态目录中公开列出超过 12 个已在主网上线的应用，覆盖 DeFi/IPFi、AI、消费和基础设施类别。最强的真实使用证据来自三个应用。

              Aria Protocol 是一个原生构建在 Story 上的 IP 现实世界资产（IPRWA）平台。其网站披露，通过 StakeStone 融资 $10.95M，将 48 个标志性 IP
              资产的部分权利代币化，预计年化收益率 5–8%，并吸引超过 4,300 名用户。Aria 的 $APL token 将持有人连接到标志性音乐 IP 的版税分配。Aria 是披露程度最高的生态应用，也为 Story
              的许可和版税模块面向外部用户在生产环境中运行，提供了最具体的证明。

              MyShell 是一个生成式 AI 智能体平台，累计用户超过 5M，活跃 AI 创作者 170K。它通过 Ritual AI 与 Story Protocol 合作，让创作者把 AI 模型托管在 Ritual
              上，并注册为 Story 的链上 IP Assets。这段关系是合作伙伴集成，不是直接企业客户合同；Story Protocol 是 MyShell 基础设施栈中的一层，MyShell 5M 用户中有多少主动使用
              Story Protocol 功能并未披露。

              PiperX 是一个 IPFi DEX，自称是「Story 上 $61T IP assets 的终极流动性层」，但截至 2026 年 6 月报告 $0 TVL。Numo AI（面向神经多样性用户）宣布 2026
              年 6 月上线。David Goyer 担任顾问，并宣布一个区块链原生科幻系列 IP 概念；这仍处在顾问 / 概念阶段，不是生产部署。

              所有具名生态应用更适合被归类为「生态合作伙伴证明」，而不是「传统付费企业客户证明」。收入通过基于 token 的 gas 费和自动版税分成流动，而不是基于合同的 SaaS 费用。Story Foundation
              控制初始 $IP 供应的 58.4%，用于生态和社区激励；早期应用开发很可能有相当部分由激励补贴。
