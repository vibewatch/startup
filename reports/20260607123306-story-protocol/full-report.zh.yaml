            title: 生态证明真实存在，但集中在依赖补助的应用
            body: >
              Story Protocol 通过 Aria Protocol（4,300+ 用户、融资 $10.95M）和 MyShell/Ritual AI 合作（合作伙伴层用户
              5M+）获得了真实生态牵引。但两者都是生态合作伙伴关系，不是企业客户合同。Story Foundation 控制 $IP 供应的 58.4%
              用于生态激励，带来实质风险：早期应用活动可能由补助补贴，而非有机变现驱动。尽调应明确区分生态激励驱动活动与有机、自我持续的客户牵引。
