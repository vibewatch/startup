      - number: '7.4'
        title: 生态、合作伙伴与采用风险
        blocks:
          - type: paragraph
            body: >-
              Story 的生态集中度，在资本和企业合作伙伴两个维度上形成复合依赖风险。a16z Crypto 领投 $29.3M Series A 和 $80M Series
              B，是占主导地位、利益最强绑定的投资方；但也因此成为单一主体中网络和治理影响力最集中的一方。企业侧，HarperCollins 是唯一公开具名的主要出版合作伙伴，也就成为 PIL 适用于传统 IP
              权利持有人的核心验证。HarperCollins 若不续约、转向竞争方案，或公开给出负面评价，都会抹掉最常被引用的企业证明点。


              Story 面对的是碎片化竞争格局：中心化 IP 许可平台（Getty Images、Shutterstock 的 AI 市场、素材音乐服务）无需链上基础设施即可服务既有许可市场；区块链相邻的 IP
              协议占据相邻设计空间；AI 公司也已经表现出意愿，通过直接数据交易谈判，或用诉讼抗辩版权主张，而不是支付链上许可费用。风险与其说是赢者通吃式竞争失败，不如说是慢速替代：IP 所有者和 AI
              公司选择更简单、更便宜或法律更清晰的方案。


              开发者侧信号混合。Story Protocol SDK 的 npm download data 证实有活跃开发者使用。Grayscale Story Trust 体现机构兴趣。不过，CoinDesk
              对代币解锁延迟的报道明确称低使用量是近因；DeFiLlama 在解锁延迟公告时显示的 $0 日收入，也确认链上商业活动没有以支撑原代币经济时间表所需的速度成形。Korea Times 和 CNBC 对
              Series B 的报道说明 Story 有广泛国际认知度，但认知度尚未转化为规模化采用指标。
