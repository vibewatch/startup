    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、平台与商业模式
        blocks:
          - type: paragraph
            body: >-
              到 2026 年，Story Protocol 更像是一家围绕可编程知识产权搭建的、风险资本支持的私有 layer-1 网络和公司生态，而不是一款消费者媒体应用。官网首页和文档把 Story 描述为面向 IP
              经济的 AI 原生基础设施，也是一条专用区块链，用来注册 IP、挂接机器可读的使用条款，并在衍生图谱中路由版税或归属。这一定义指向基础设施商业模式：Story
              出售的是链、法律与技术中间件，以及让创作者、数据所有者和应用围绕权利管理 IP 交易的开发者轨道。


              身份信号在产品上比在公司基本面上更清楚。2023 年的公开发布报道称 Story 是一家旧金山创业公司，2024 年 Series B 报道称 PIP Labs 位于 Palo
              Alto，而本次抓取到的官网页面没有给出明确总部信息。最稳妥的综合判断是：Story 在产品身份和阶段上有强公开证据——仍为私有公司、已完成 Series
              B、已上线主网且代币已流通——但一些法律实体基本信息仍需要确认性尽调。
