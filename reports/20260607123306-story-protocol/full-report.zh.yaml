  - id: TE002
    title: Story Protocol 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流（不用 Story）
      - Story 方案
      - 可衡量收益（声称）
      - 核心限制
    rows:
      - - 注册并保护 IP
        - 版权登记、法律顾问预付费、数周流程
        - 铸造 ERC-721 NFT → 在 IPA Registry 注册 → 附加 PIL 条款
        - 数分钟完成注册；基础许可条款不需要律师
        - PIL 的法院可执行性未经检验；不能替代正式版权登记
      - - 为衍生用途许可 IP
        - 谈判合同、起草许可、聘请律师
        - 被许可方从父 IPA 铸造许可代币（支付相应铸造费）；衍生关系记录上链
        - 自动归因并收取铸造费；链上记录透明
        - 版税堆叠层级可能推高成本；付款方必须使用白名单代币（如 WIP）
      - - 从衍生作品中领取收入
        - 追踪下游使用、手工开票、依赖 PROs
        - IP Royalty Vault 自动收款；权利人用 SDK 按比例领取
        - 无需开票即可程序化收款；可通过 WIP 代币与 DeFi 组合
        - 代币白名单由协议治理控制；仅限链上付款方
      - - 在链上争议 IP 侵权
        - DMCA 下架或诉讼；成本高、速度慢
        - 提交争议标签 → UMA oracle 仲裁 → 如获支持则施加链上处罚
        - 成本低于法律行动；结果在协议层执行
        - 没有已发布案例历史；依赖 UMA oracle；链上终局性是双刃剑
      - - 为 AI 训练数据许可 IP
        - 没有标准同意或归因机制；许可要么临时拼凑，要么缺失
        - 附加商业 PIL → AI 训练方铸造许可代币 → 收入产生后版税流转
        - 无需中介即可获得机器可读同意和链上收入归因
        - AI 模型是否实际使用获许可数据，无法在链上验证；执行力有限
      - - 构建 AI 智能体 IP 工作流
        - 手动 API 调用、定制集成、没有协议级可组合性
        - Claude MCP 集成让 LLM 智能体可通过自然语言指令处理 IP 交易
        - AI 智能体的 IP 操作几乎零摩擦；可与更广泛的智能体生态组合
        - Beta 集成；生产可靠性和边界案例表现尚未独立核验
    notes: |
      收益来自公司声称，或从官方文档和博客推断；未能看到带量化结果的独立案例研究。限制项来自证据审查和对抗性分析识别出的重大缺口。
