      - number: '3.3'
        title: 能力比较、GTM 分发与信任 / 监管姿态
        blocks:
          - type: paragraph
            body: >
              Story Protocol 最清晰的能力优势是 Programmable IP License（PIL）。这是一个以美国版权法（17 U.S.C.
              §101）为基础的链下法律文件，其条款映射到链上，因此智能合约无需逐一法律谈判，就能执行授权、版税和衍生条件。PIL 的设计参考了 Creative Commons、Arweave 自身授权工作、a16z
              的「Can’t Be Evil」许可套件，以及 Token-Bound NFT License 框架。接受评估的竞争者没有做出等价物：EIP-2981
              是最小化的版税信号标准，且明确自愿——市场如果忽略它，就不会转移版税；Ocean Protocol 的 Datatokens 管理数据访问，却没有链下法律执行力。Story 的版税模块使用谱系图：IP Asset
              3（IP Asset 2 的衍生作品，而 IP Asset 2 本身又是 IP Asset 1 的衍生作品）会自动向所有上游祖先支付叠加版税；一笔 100 IP token 收入事件，在 5%+10%
              的版税堆叠下，会有 15 IP token 流向祖先 vault。这个架构比简单点对点版税拆分更复杂，公开链上没有直接等价物。Manifold 和 Metaplex 都支持 ERC-2981 或类似的单 NFT
              版税信号，但不维护衍生谱系图。GTM 层面，Story 通过 TypeScript 和 Python SDK、列出集成的增长中生态页面，以及 Grayscale 2025 年推出的 Story Protocol
              trust 产品来争夺开发者采用；后者为传统金融提供敞口。European Union AI Act 关于训练数据透明度的条款（2026 年起生效）为来源基础设施提供监管顺风，尽管执行时间线仍不确定。Story
              的争议模块提供链上机制来标记侵权 IP——本报告保留来源集中，没有竞争平台提供等价的链上争议工作流。
