  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 协议产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Story Protocol 的核心产品是一套区块链基础设施平台，把静态知识产权转成可编程的链上资产。官方文档把 Story 描述为「专为知识产权打造的 layer-1 区块链」，让 IP
              注册、许可和版税归因像调用 API 一样简单。落到实践里，创作者或权利持有人先铸造一个 ERC-721 NFT 来代表作品，再把该 NFT 注册进 Story 的 IP Asset
              Registry（为资产部署一个智能合约 IP Account），并通过 Programmable IP License（PIL）挂上机器可读的使用条款。PIL 不是合成概念：它是 Story
              法务团队在专家顾问协助下创建、以美国版权法为基础的真实线下法律文件；商业使用、铸造费、衍生作品归因、收入分成比例等条款，都已经映射为 Solidity structs，供链上执行。


              注册后的 IP 资产具备可编程性：其他方可以铸造许可代币（支付所有者设定的铸造费）、创建与父资产相连的已注册衍生作品，并让版税自动沿祖先图路由。PIL 支持多种配置，包括非商业社交 remix
              和商业收入分成。白皮书把 Story 的可触达市场定义为「面向 IP 经济的 AI 原生基础设施」；Claude Model Context Protocol（MCP）集成让 LLM 智能体能用自然语言注册
              IP、铸造许可并认领版税，把这一定义落到了产品里。HarperCollins 已宣布合作，生态中的 AI
              与消费垂直应用（soloai、Verio、PiperX、ip.world、Mimboku）也说明，Story 同时瞄准传统 IP 所有者和 AI 原生创作者。协议内的 License Template
              抽象层允许未来加入 PIL 之外的法律-技术许可标准，不过目前主网上唯一启用的模板仍是 PIL。
