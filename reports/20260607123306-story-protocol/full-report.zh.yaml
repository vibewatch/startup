            title: 近零链上收入与代币解锁延迟是反向采用信号
            body: >
              Story Protocol 的日链上收入从 $43,000 峰值（2025 年 9 月）跌至 2026 年 2 月的 $0。创始团队随后把第一次主要团队 / 投资人代币解锁延后六个月（至 2026 年 8
              月），理由是需要「更多时间」来建设网络使用量。联合创始人把近零 gas 收入解释为低费率 IP 链的预期结果，但这个解释无法独立验证，也让投资人缺少清晰的收入代理指标。PiperX 等生态应用报告 $0
              TVL，也没有企业 AI 许可客户被公开点名。投资人应将其视为高严重度采用风险，并在下一次解锁事件前要求一套替代收入指标框架。
