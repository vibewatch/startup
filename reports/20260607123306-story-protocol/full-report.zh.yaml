      - number: '5.2'
        title: 模块图谱与技术架构
        blocks:
          - type: paragraph
            body: >-
              Story 的技术架构分成两套栈。网络层，PIP Labs 将 Story Network 做成一条改造过的 Cosmos SDK 链，用 CometBFT 承担拜占庭容错共识，用 fork 后的
              go-ethereum（Geth）客户端执行 EVM 交易。两层通过 Engine ABI 和定制 ABCI++ 适配器通信，把共识效率与 EVM 交易吞吐解耦——这套思路借鉴了 Ethereum
              权益证明后的执行 / 共识分离。定制的有状态预编译 IPGraph 让 EVM 能以边际成本在数秒内遍历 IP 祖先图；这在架构上很关键，因为 Royalty 和 Licensing Modules
              在日常链上操作中必须遍历多代衍生树。主网（Homer，chain ID 1514）的已部署合约地址发布在公开 protocol-core-v1 GitHub 仓库的
              deployment-1514.json；节点运营者需要 4 CPU cores、32 GB RAM、200 GB disk 和 10 MBit/s bandwidth。


              应用层，Proof-of-Creativity（PoC）协议包含六个核心 Solidity 模块：IP Asset Registry 和 IP Account 系统（使用 ERC-6551 token-bound
              accounts）、Licensing Module（链上许可条款下的父子 IPA 关系）、Royalty Module（每个 IPA 一个 IP Royalty Vault、Royalty
              Tokens，以及基于祖先图的收入路由）、Dispute Module（基于 UMA oracle 的仲裁，含五个标准争议标签）、Grouping Module（跨 IP 集合的共享收入池）以及 Metadata
              Module。Periphery 合约（storyprotocol/protocol-periphery-v1）把常见多步流程——铸造、注册、挂载——批成单笔交易，Multicall3
              合约也支持原生批处理。Royalty Module 中每个 Royalty Token 代表一个 IPA 总收入权益的 1%，可转给其他钱包，从而拼出可组合的收入分配。主网白名单支付代币包括 WIP（$IP
              Wrapped），新增代币由 RoyaltyModule.sol 合约管控。
