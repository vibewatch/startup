      - number: '5.3'
        title: 开发者栈、SDK 与集成通道
        blocks:
          - type: paragraph
            body: >-
              Story 提供多层开发者工具包，遮蔽链上 IP 操作的复杂度。TypeScript SDK（storyprotocol/sdk，npm @story-protocol/core-sdk）开放七个功能模块——IP
              Asset、License、Royalty、Dispute、Group、WIP 和 NFT Client——覆盖 Aeneid testnet（chain ID 1315）与 Story Homer
              mainnet（chain ID 1514）上的完整协议面。Python SDK（storyprotocol/python-sdk）为数据科学和 AI 工作流提供相同接口。Periphery
              合约（SPG，storyprotocol/protocol-periphery-v1）让开发者把 NFT 铸造、IP 注册、许可条款挂载、许可配置等多步操作打包成一次链上调用，降低 gas
              成本，也简化集成逻辑。Multicall3 合约同样支持原生批执行。


              落地证据较强：Story 的 Protocol Explorer 和 Storyscan block explorer 可以查看已注册 IP 资产和交易；staking.story.foundation
              的质押看板已经上线。Claude MCP 集成把 Story 协议接到 Anthropic 的 Model Context Protocol，让 LLM 智能体能用自然语言交易 IP——这对 AI
              训练数据许可用例是关键差异化。External Royalty Policy Guide 进一步增加灵活性，允许开发者部署内置祖先图模型之外的自定义版税合约逻辑。截至 2026 年中，Story
              生态目录列出了十多个已在主网上线的项目，覆盖
              AI（soloai、Mahojin）、消费（Mimboku）、DeFi/IPFI（Verio、Unleash、PiperX）和基础设施（Stargate、Color）等类别，并把 HarperCollins
              列为具名传统媒体合作伙伴。
