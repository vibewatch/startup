      - number: '6.3'
        title: 采用轨迹与链上指标
        blocks:
          - type: paragraph
            body: >
              Story Protocol 于 2025 年 2 月启动主网，并推出 $IP token；10 亿枚供应量初始解锁 25%，其中 58.4% 分配给生态、社区和基金会激励。链上采用指标呈现混合图景。

              正面看，Story 主页声称 Ippy 吉祥物 IP 资产已有 823,939 个衍生 remix；Ippy 是公司自有角色，配有开源 Programmable IP License，用来展示
              remix-版税机制。截至 2026 年 5 月，协议的 GitHub organization 有 53 个公开仓库，TypeScript SDK 累计 109 stars 和 71
              forks。已部署智能合约——包括 IP Asset Registry、Royalty Module、Dispute Module 和 Licensing
              Module——均以公开地址完成链上验证，说明协议栈已经达到生产级。

              负面看，CoinDesk 引用 DeFiLlama 称，日链上收入在 2025 年 9 月达到 $43,000 峰值，随后到 2026 年 2 月初降至 $0。Story 联合创始人 SY Lee 在 2026
              年 2 月的 CoinDesk 采访中承认 gas 收入近乎为零，并把它解释为符合 Story 低费率 IP 链的设计，同时主张预期变现发生在线下。团队和投资人代币解锁从 2026 年 2 月延后至 2026 年
              8 月；团队称需要「更多时间」来建设网络使用量，观察者将其解读为对弱采用信号和投资人抛售担忧的回应。

              Ippy remix 数是最常被引用的采用信号，但应谨慎看待：Ippy 是 Story Foundation 所有、按无许可开放许可播种的 IP，因此这是一个内部可控指标，而不是第三方采用指标。公开资料尚无对
              823,939 这一数字的独立审计。
