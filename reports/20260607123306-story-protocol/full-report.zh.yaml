  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、既有玩家、相邻玩家、替代方案和潜在进入者
        blocks:
          - type: paragraph
            body: >
              Story Protocol 的竞争空间覆盖五类玩家，各自起点优势差异很大。直接的区块链 IP 同业是最小也最弱的一类：Ocean Protocol 用 Data NFTs 和 Datatokens
              运营链上数据市场，但目标是数据 / AI 变现，而不是通用创意 IP；截至研究日，其 token 市值约 $21.7M、日成交量约 ~$30K，显示牵引力有限。Molecule Protocol
              面向药物发现研究人员，处理生物医药 IP-NFT，这是一个垂直小众市场，与 Story 的创作者和 AI 训练数据定位并不重叠。创作者工具同业更相邻：Manifold 提供 Ethereum NFT
              铸造基础设施，背后有 a16z 和 Initialized Capital，服务 Beeple、Jay-Z、Adidas、Mercedes-AMG 等品牌，使命是「AI
              时代的创作主权」——但没有法律支持的链下授权框架。Zora 提供基于 OP Stack 的 Layer 2，用于链上媒体创作和变现。Audius
              为艺术家提供去中心化音乐流媒体基础设施。现状既有玩家才是结构上最持久的竞争：Ethereum 自愿性的 EIP-2981 版税标准只需要市场采用，且没有执行机制；传统版税收取组织（ASCAP、BMI、RIAA
              关联方）和 Royalty Exchange 等私有市场不依赖区块链即可运营。基础设施平台 Protocol Labs（IPFS/Filecoin）和 Arweave
              提供永久存储层，更偏互补而非竞争。潜在进入者方面，如果链上 IP 注册被证明有商业价值，通用 L1/L2 生态——Solana 上的 Metaplex、Bitcoin 上的 Stacks——可以增加 IP
              模块。Sound.xyz 音乐 NFT 平台于 2026 年 1 月 16 日关闭，说明单一垂直创作者平台如果缺少更广泛 IP 基础设施效用，维持独立运营会很难。
