  - id: FI001
    title: 收入模型桥接——Story Protocol 的活动如何转化为收入
    type: flow
    layout: wide
    summary: 链上活动产生 gas 费（付给验证者），并触发版税流（IP 所有者到 IP 所有者）；在当前实现下，PIP Labs 不收取直接协议费。
    data:
      nodes:
        - id: user
          label: 创作者 / 被许可方 / AI 智能体
        - id: tx
          label: |-
            链上交易
            （IP 注册、许可铸造、版税支付）
        - id: gas
          label: |-
            Gas 费 → 验证者
            （SIP-009 后约 13.14M 区块 / 年）
        - id: minting_fee
          label: |-
            mintingFee → IP Royalty Vault
            （由 IP 所有者设定，不是协议设定）
        - id: royalty
          label: |-
            版税流 → 祖先金库
            （按 PIL 条款分配收入百分比）
        - id: pip_labs
          label: |-
            PIP Labs（公司）
            收入：$0 直接协议费
        - id: treasury
          label: |-
            基金会金库
            50M IP（按 $0.30 约 $15M）
        - id: validators
          label: |-
            验证者 / 质押者
            约 15.3M IP 年排放 + gas
      edges:
        - from: user
          to: tx
          label: 发起
        - from: tx
          to: gas
          label: 支付 gas
        - from: tx
          to: minting_fee
          label: 触发（若为商业许可）
        - from: tx
          to: royalty
          label: 触发（若产生收入）
        - from: gas
          to: validators
          label: 分配给
        - from: minting_fee
          to: pip_labs
          label: 绕过（不抽取）
        - from: treasury
          to: pip_labs
          label: 运营资金（代币销售）
    approximationNotes: Gas 费总收入未公开披露。基金会金库价值按 2026-06-07 $0.30/IP 现货价格计算。版税流总量未公开披露。
    claimRefs:
