  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - EU AI Act 第 53 条对 GPAI 提供方的版权合规要求
        - 驱动因素
        - 当前；EU AI Act 已于 2024 年 7 月生效，合规要求分阶段延至 2026 年
        - 硬法要求 AI 实验室记录并授权训练数据，直接拉动权利已清理的数据市场；Story 的 Licensing Module 可能成为合规基础设施层
        - 确认是否已有 GPAI 提供方正式采用 Story 或竞品链上方案；核实 PIL 是否满足欧盟 “权利保留”合规标准
      - - AI 版权诉讼潮（音乐出版商、新闻机构、图库机构诉 AI 实验室）
        - 驱动因素
        - 当前，并在 2026 年前加速
        - 诉讼风险抬高未授权训练数据成本，推动自愿授权；也验证 Story 所说的市场痛点
        - 跟踪诉讼结果；评估法院是否承认链上授权是有效的权利清理机制
      - - 创作者经济到 2027 年增长至约 $500B（Goldman Sachs）
        - 驱动因素
        - 中期，2023–2027 年
        - 创作者经济越大，受益于自动版税收取的 IP 所有者池越大，也抬高可变现总量
        - 核实创作者经济收入中有多少可由 Story 当前 PIL 覆盖；又有多少仍由平台控制、现有平台不会让出
      - - Grayscale Story Trust 面向机构推出（2025 年 7 月）
        - 驱动因素
        - 近期；产品已于 2025 年 7 月上线
        - 机构投资产品释放合法性信号；可能增加合格投资者对 $IP 的需求
        - 监测 AUM 和资金流入，判断机构兴趣会转化为网络使用，还是纯粹的代币投机
      - - $IP 代币价格暴跌（较 ATH -97.9%）且使用滞后（CoinDesk 2026 年 2 月）
        - 约束
        - 当前；截至运行日仍在持续
        - 代币价格疲弱会削弱开发者激励、验证者经济和创作者接受 $IP 作为版税货币的意愿；使用滞后也冲击网络效应投资逻辑
        - 要求提供链上使用指标（活跃钱包、每周登记 IP 资产、已处理版税支付），量化使用滞后是否改善
      - - 主流 IP 所有者采用加密 / 区块链的摩擦
        - 约束
        - 持续存在；没有专项接入投入，短期难以解决
        - 传统 IP 所有者（大型唱片公司、电影公司、出版社）没有加密钱包，也没有链上运营能力；问题解决前，Story 的 SAM 仍局限于加密原生用户
        - 评估 Story 是否有法币入口、白标工具（StoryKit）或托管方案，以降低非加密 IP 所有者的接入摩擦
      - - Programmable IP License（PIL）线下法律可执行性不确定
        - 约束
        - 重大；截至运行日尚无法院先例
        - PIL 的链上参数未必能在所有司法辖区执行；如果法院不承认智能合约 IP 条款，协议对商业用例的核心价值主张就会坍塌
        - 委托独立法律审查，评估 PIL 在美国版权法和主要欧盟司法辖区下的可执行性；向版权律师征询 17 U.S.C. 兼容性意见
      - - EFF 和公民社会反对扩大 IP 执法
        - 约束
        - 持续存在；IP 政策环境存在结构性张力
        - 如果基于区块链的 IP 执法以监管机构后来限制的方式扩大权利人权力，Story 模型将面临监管反弹；EFF 所谓 IP “偏离其目的太远”的立场，已经构成成熟的反向叙事
        - 监测 EFF、Access Now 和 Creative Commons 对区块链 IP 执法的立场；评估 PIL 默认条款是偏创作者友好，还是最大化权利人利益
      - - 摩擦更低的线下 IP 现有平台（Royalty Exchange、CCC、PROs）
        - 约束
        - 持续存在；现有平台有既有关系和法律认可
        - 创作者和 IP 买家可直接使用现有线下平台，无需加密工具；这些平台的商业模式和法律地位已经跑通，Story 必须拿出明确的成本或速度优势，才可能让用户切换
        - 对同类资产比较 Story 授权费用和结算时间与线下替代方案（例如 BMI 音乐同步授权 vs. 链上 PIL）
    notes: >-
      增长驱动因素真实存在，但性质偏监管，也就是说采用取决于外部合规压力，而不是自然需求拉动。约束大多是结构性的（加密摩擦、法律不确定性、代币经济），需要主动投入才能解决。承销问题在于，监管强制（EU AI
      Act）能否比结构性摩擦更快推动采用。
