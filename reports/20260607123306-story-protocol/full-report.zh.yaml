  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础——生态开发者、IP 权利持有人与 AI 数据消费者
        blocks:
          - type: paragraph
            body: >
              Story Protocol 不是一家传统 B2B 或 B2C SaaS 公司；它没有具名企业客户、已签合同，也没有披露经常性收入指标。主要参与者分为三个边界松散的群体。第一类是生态应用开发者，他们在 Story
              L1 上部署基于智能合约的产品，并使用 Proof-of-Creativity SDK 注册和许可 IP 资产。第二类是个人或机构 IP
              权利持有人——创作者、音乐人、数据集提供方、娱乐工作室和生物医学研究者——他们把 IP 注册到链上，以自动化许可和版税收取。第三类是 AI
              数据消费者——模型开发者和基础模型公司——他们需要权利清晰、法律归因明确的训练数据集，同时想避开定制许可协议的摩擦。

              Story 主页明确瞄准六个客户垂直：需要无法爬取且 IP 安全数据集的 physical AI 公司；推动无许可许可的数据提供方；将研究代币化并自动化版税的生物医学和专利场景；交易并再质押代币化 IP
              组合的机构基金；捕捉并变现病毒式粉丝时刻的品牌和娱乐公司；以及数秒内注册并变现 IP 的个人创作者。实践中，公开的生产环境使用证据主要集中在第一类——生态应用开发者；其他五个垂直仍处于早期，或主要由公司自称。

              买方-付款方模型也不同于传统软件：开发者用 $IP token 支付 gas 费；IP 权利持有人注册免费，但会自动与协议分成版税；AI 消费者预计在企业交易落地后通过链上许可协议付款。联合创始人 SY Lee
              在 2026 年 2 月表示，近乎为零的链上 gas 收入是「错误指标」，因为预期变现发生在线下许可协议中。截至本报告运行日，公开资料没有记录此类企业许可收入；Story 向 AI
              数据许可的战略转向，也把变现逻辑集中在尚未披露的交易上。
