  - id: FV002
    title: 估值敏感性 — 关键驱动因素对 FDV 和股权估值合理性的影响
    type: bar
    layout: standard
    summary: 展示代币价格、流通供给、企业 ARR、可比倍数和退出概率五个关键价值驱动因素变化时，隐含 FDV 如何移动，以及是否能缩小与 $2.25B 股权估值之间的缺口。
    data:
      series:
        - label: 代币价格情景
          points:
            - label: $0.05（悲观底部）
              value: 50
              unit: USD millions FDV
            - label: $0.30（当前）
              value: 300
              unit: USD millions FDV
            - label: $1.00（基准修复）
              value: 1000
              unit: USD millions FDV
            - label: $3.00（部分修复至 ATH）
              value: 3000
              unit: USD millions FDV
            - label: $7.39（50% ATH）
              value: 7390
              unit: USD millions FDV
        - label: 企业 ARR 倍数情景
          points:
            - label: ARR $0 / 无倍数
              value: 300
              unit: USD millions equity-supportable
            - label: ARR $5M × 50×（早期基础设施）
              value: 250
              unit: USD millions equity-supportable
            - label: ARR $20M × 80×（高增长基础设施）
              value: 1600
              unit: USD millions equity-supportable
            - label: ARR $50M × 50×（规模化基础设施）
              value: 2500
              unit: USD millions equity-supportable
            - label: ARR $80M × 30×（成熟基础设施）
              value: 2400
              unit: USD millions equity-supportable
    approximationNotes: >-
      FDV 按 $IP 价格 × 10 亿总供应量计算。企业 ARR 倍数为指示性，参考 2023–2024 年可比区块链基础设施轮次。当前 $IP 价格为 $0.30，截至 June 7,
      2026（CoinGecko）。$2.25B 股权估值以水平参考线显示——任一情景柱与 $2.25B 之间的差距，就是证据缺口。
    claimRefs:
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
  - id: FV003
    title: 估值 / 回报区间 — 乐观、基准和悲观结果
    type: range
    layout: standard
    summary: 展示三种情景下低位 / 基准 / 高位 FDV 区间，并计算相对于 $2.25B Series B 入场估值的隐含倍数。
    data:
      items:
        - label: FDV — 乐观情景
          low: 7000
          mid: 10000
          high: 15000
          unit: USD millions
          note: 低位 = 代币 $7 / FDV；中位 = $10 / FDV；高位 = $15 / FDV；假设 2029 年 ARR 超过 $20M
        - label: FDV — 基准情景
          low: 500
          mid: 900
          high: 1500
          unit: USD millions
          note: 低位 = 代币维持在 $0.50 附近；中位 = $0.90；高位 = $1.50；ARR 低于 $10M
        - label: FDV — 悲观情景
          low: 30
          mid: 70
          high: 100
          unit: USD millions
          note: 低位 = 代币接近 $0.03；中位 = $0.07；高位 = $0.10；使用量接近零
        - label: 股权回报倍数 — 乐观
          low: 1.1
          mid: 1.8
          high: 3
          unit: × entry (Series B $2.25B)
          note: 按乐观 FDV，并给予股权 1.5–2× 折价（基础设施溢价），持有 3–5 年
        - label: 股权回报倍数 — 基准
          low: 0.2
          mid: 0.5
          high: 0.7
          unit: × entry (Series B $2.25B)
          note: 持平到为负；3–5 年持有的时间价值损失显著
        - label: 股权回报倍数 — 悲观
          low: 0.05
          mid: 0.1
          high: 0.2
          unit: × entry (Series B $2.25B)
          note: 近乎全损；收购式招人或下轮融资，相比 Series B 估值折价 80–95%
        - label: 当前 FDV 与股权估值缺口
          low: 300
          mid: 300
          high: 2250
          unit: USD millions
          note: 低位 / 中位 = Jun 2026 FDV（$300M）；高位 = Series B 股权估值（$2.25B）；缺口 = 7.5×
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV015
      - CV016
  - id: FV004
    title: 投资 KPI — 六个维度的 IC 就绪评分
    type: kpi
    layout: compact
    summary: 投资委员会从市场、验证、护城河、经济性、风险和估值六个维度评分，并给出经置信度加权的最终综合分。评分为 1–5（1=弱，5=强），基于截至 June 7, 2026 可获得的公开证据。
    data:
      items:
        - label: 市场机会（TAM / 紧迫性）
          value: 4/5
          unit: IC score
        - label: 产品-市场匹配验证
          value: 1/5
          unit: IC score
        - label: 护城河 / 防御性
          value: 3/5
          unit: IC score
        - label: 单位经济性 / 收入
          value: 1/5
          unit: IC score
        - label: 风险调整后画像
          value: 2/5
          unit: IC score
        - label: 估值与证据匹配
          value: 1/5
          unit: IC score
        - label: 综合 IC 评分（加权）
          value: 2.0/5
          unit: IC score
        - label: 建议
          value: Conditional Hold / Watch
          unit: verdict
        - label: Series B 入场股权估值
          value: $2.25B (unconfirmed, anon-sourced)
          unit: USD
        - label: $IP 代币 FDV（Jun 2026）
          value: ~$300M
          unit: USD
        - label: 股权 / 代币错位
          value: 7.5×
          unit: ratio
        - label: 下一个关键事件
          value: August 2026 Token Unlock
          unit: event
    approximationNotes: >-
      IC 评分基于证据判断，不是模型输出。综合分权重为 60% 基本面（验证、经济性、护城河）和 40% 背景因素（市场、风险、估值）。所有代币指标截至 June 7, 2026（CoinGecko）。股权估值来自 CNBC 和
      ETCentric 披露的匿名消息源。
    claimRefs:
      - CV001
      - CV006
      - CV014
      - CV015
      - CV016
