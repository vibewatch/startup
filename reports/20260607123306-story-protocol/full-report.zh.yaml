  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、规模口径与 IP 资产类别
        blocks:
          - type: paragraph
            body: >-
              Story Protocol 的实际市场横跨三个重叠需求池。第一是 AI 训练数据授权：AI labs 和自主智能体目前大规模抓取互联网内容，却没有完成权利清理；EU AI Act 第 53 条现在要求通用 AI
              提供商维护训练数据版权合规政策，并发布训练内容摘要——这为授权数据市场创造了直接监管驱动。WIPO 已经围绕 AI 与 IP 举办 11 场专门对话，最近一次聚焦 AI
              时代所需的「透明度、同意和补偿」基础设施，说明监管需求信号是全球性的，并得到制度层面认可。第二个池子是创作者经济：Goldman Sachs Research 估计，到 2027 年创作者经济可能接近 $500
              billion；Story 把 Programmable IP License 定位为基础设施层，让创作者可以把衍生作品变现并自动收取版税。第三个池子是 IPFi——一个新兴类别，IP
              资产可以被碎片化、抵押、质押或在链上交易，类似 DeFi 改造金融资产的方式。

              Story 自己的叙事声称，全球所有知识产权合计存量价值构成了一个「$80 trillion IP 资产类别」，这是总可用上限。这个数字无法独立验证，公开记录中也没有
              CAGR、方法论或分析师背书；它更像市场认知叙事，而不是可用于承销的 TAM。代币市场约 $312 million 的完全稀释估值（CoinGecko，2026 年 6
              月）为当前概念验证规模提供了市场隐含下限。因此，实际承销边界应是：受监管强制或激励的 AI 训练数据授权；创作者经济中的版税和衍生变现；以及建立在协议之上的 IPFi 金融原语——同时明确排除传统专利授权、医药
              IP 交易和商标执法，因为 Story 在这些领域没有产品界面，既有中介也有深护城河。
