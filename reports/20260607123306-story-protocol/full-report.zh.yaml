      - number: '7.3'
        title: 技术、安全与运营风险
        blocks:
          - type: paragraph
            body: >-
              Protocol v1.3 获得 Halborn、FuzzingLabs 和 Trust Security 的独立安全审计，三家审计机构覆盖了核心智能合约套件。Immunefi
              漏洞赏金计划持续激励研究员发现漏洞。相对许多早期协议，这些缓释措施有意义；但 Story 的版税模块会通过递归 IP 衍生图传导经济流，是一种不同于传统 DeFi AMM
              或借贷协议的新架构。深层或循环连接的衍生链可能暴露 v1.3 审计范围未充分覆盖的边界漏洞，尤其是涉及大型版税树或治理控制收入代币白名单的状态转换。


              验证者中心化是任何上线后 L1 的结构性早期风险。Story 的 CometBFT 共识和初始验证者集合已经通过 SIP-9、SIP-10
              做过治理驱动的重新校准，但当前验证者数量、按地址划分的质押分布和地理多元化，尚未以适合集中度分析的形式发布。控制超过三分之一已质押 IP
              的卡特尔可以阻滞区块终局性；控制三分之二则可以重排区块。智能合约升级由治理控制，如果集中联盟能够达到法定票数，就会产生升级被俘获风险。


              rekt.news 记录的更广泛 DeFi 生态背景显示，开发者工具供应链攻击、多链协议管理员密钥泄露、无许可签名者授权失败等攻击模式仍在持续；这些都与 Story 的 Cosmos SDK 和 EVM
              双栈架构有关。截至 2026 年 6 月，Story 主网约有 16 个月生产运行时间，可靠性记录仍然有限。区块浏览器和 API 可用性承诺没有公开记录。
