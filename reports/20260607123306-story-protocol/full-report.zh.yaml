  - id: TE003
    title: Story Network 技术架构表
    columns:
      - 层 / 组件
      - 角色
      - 核心依赖
      - 风险
    rows:
      - - CometBFT 共识（piplabs/story）
        - BFT 终局性；~1-2s 出块时间目标
        - PIP Labs 维护的 Cosmos SDK 分叉
        - 与上游 Cosmos SDK 分化；所有维护和补丁决策均由 PIP Labs 负责
      - - Geth 执行客户端（piplabs/story-geth）
        - 执行 EVM 兼容交易；承载所有已部署合约
        - 上游 go-ethereum 分叉
        - 必须跟进上游 go-ethereum 安全补丁；分叉偏离会带来滞后风险
      - - ABCI++ 适配器
        - 把 EVM 执行状态桥接到 CometBFT；通过 Engine ABI 中继区块
        - story 客户端代码库中的自定义实现
        - 单一团队实现；主网 v1 之前外部审查脉络有限
      - - IPGraph 预编译
        - 位于 EVM 内的有状态预编译，以边际成本遍历 IP 祖先图
        - 对 go-ethereum 的自定义扩展；需要 Geth 与共识客户端保持一致
        - 新型预编译缺少外部审查先例；需要自定义模糊测试器补覆盖
      - - IP Asset Registry + IP Account（ERC-6551，资产账户层）
        - 核心 IP 身份层；为每个 IPA 部署智能合约账户（ipId）
        - ERC-6551 代币绑定账户标准
        - 更广生态的 ERC-6551 工具和钱包支持仍在成熟
      - - Proof-of-Creativity 智能合约（Solidity）
        - 核心协议逻辑：Licensing、Royalty、Dispute、Grouping、Metadata 模块
        - 部署在 Story Network L1；版税图查询依赖 IPGraph 预编译
        - 可升级代理架构要求谨慎治理升级密钥
      - - UMA 预言机（Dispute Module）
        - IP 争议解决的外部仲裁来源
        - UMA 协议可用性、流动性和治理
        - 存在预言机操纵风险；UMA 停机会卡住争议解决
      - - IP Royalty Vault（每个 IPA 一个）
        - 每项 IP 资产的收入托管和分配
        - 链上 Solidity 合约；由治理白名单控制的支付代币列表
        - 仅限白名单代币；代币治理是中心化控制点
      - - 外围合约 / SPG（protocol-periphery-v1）
        - 把多步工作流打包成单笔交易；也支持 Multicall3
        - 以上游 protocol-core-v1 为依赖
        - 核心层破坏性变更会要求外围重写；存在版本错位风险
      - - TypeScript SDK / Python SDK
        - 开发者 API 层，抽象封装直接合约调用
        - npm / PyPI 包注册表；story 客户端 RPC 端点
        - SDK 版本与链上状态可能错位；向后兼容承诺未见公开文档
    notes: >
      依赖与风险判断来自官方 GitHub 仓库（piplabs/story README、protocol-core-v1 README）、security-recap-mainnet 博客文章（通过 Wayback Machine
      取回）以及分析推断。风险严重度为分析判断；未找到独立架构审查或渗透测试结果。节点硬件要求来自 piplabs/story 仓库。
