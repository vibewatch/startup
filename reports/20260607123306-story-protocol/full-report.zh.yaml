      - number: '8.3'
        title: 退出准备度与最终尽调追问
        blocks:
          - type: paragraph
            body: >-
              对投资者而言，Story Protocol 最主要的退出路径是代币流动性——$IP 代币已上线 Coinbase、Binance、OKX、Bybit 和
              Gate，代币持有人可以进入二级市场。但团队和投资者的归属时间表要到 August 2026 才解锁，而代币价格较历史高点已下跌 97.9%；即使到了解锁时点，投资者从代币持仓获得的总回报也会显著低于
              Series B 定价时的预期。面向大型 AI 公司（OpenAI、Anthropic、Google DeepMind、Adobe 或大型媒体集团）的并购，是第二条路径：Story Protocol 的 IP
              登记基础设施、有法律支撑的 PIL 框架，以及 $142M 股权资金支持的研发，确实构成战略资产。公开市场退出（IPO 或直接上市）短期内并不可信：公司没有披露
              ARR，且按传统上市公司会计标准报告代币经济非常复杂。Grayscale 在 July 2025 推出 Grayscale Story Trust，提供了一种机构产品入口，但这并不构成股权持有人的流动性事件。

              五个会击穿投资逻辑、迫使重启尽调的触发项是：（1）主网再运行 12 个月后，企业授权收入仍被确认是零，（2）August 2026 代币解锁引发代币价格进一步下跌 >50%，（3）18
              个月内三位联合创始人中任何一位离开，（4）大型 AI 实验室选择自建竞争性的链上 IP 登记系统，而不是采用 Story Protocol，（5）主要司法辖区出现不利监管动作（EU AI Act 执法、直接点名
              Story 的美国版权诉讼）。

              最终尽调追问分成六条工作流：企业收入、代币经济、资本跑道、协议采用、法律可执行性和竞争动态。投资前决策至少需要拿到：（a）经审计或 CFO 认证的收入明细，用来确认或否认 AI 数据授权
              ARR；（b）按类别拆分的完整代币归属时间表；（c）PIP Labs 管理层提供的当前现金余额和月度烧钱速度。没有这些材料，不应做出投资决定。
