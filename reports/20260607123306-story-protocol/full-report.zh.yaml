  - id: TR005
    title: 缓释与终止标准表
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 代币证券属性认定
        - SEC 针对 IP 代币的正式调查、非正式问询或 Wells Notice
        - 任何公开执法行动，或媒体确认的非正式问询
        - 立即聘请证券法律顾问；评估交易所上币风险；准备法律抗辩
      - - PIL 可执行性
        - 目标司法辖区法院裁定 PIL 不是可执行许可
        - 单一负面裁决公开
        - 重做 PIL 法律包装；从该司法辖区撤出商业运营
      - - 智能合约漏洞利用
        - 链上资金损失、未经授权的版税抽走或未经授权的许可铸造
        - 任何确认导致 > $50K 损失或系统性版税错误的漏洞利用
        - 通过治理紧急暂停模块；重启前完成全面审计；公开披露
      - - 采用失败
        - 链上 IP 注册数和 DeFiLlama 每日活跃收入
        - 截至 2026 年 2 月（主网上线 12 个月后）累计 IP 注册少于 10,000
        - 转向企业门控访问模式；重新评估代币经济与解锁时间表
      - - 验证者中心化
        - 链上质押数据显示任一单一实体超过 IP 总质押量 33%
        - 区块浏览器数据确认集中度突破阈值
        - 提出紧急治理行动，重新分配质押或增加验证者
      - - 现金跑道耗尽
        - 董事会确认现金跑道不足 6 个月，且无已承诺后续资本
        - 公司私下披露或媒体报道财务困境
        - 紧急融资或立即削减运营成本；与投资者沟通
    notes: 触发阈值是分析师根据标准 Web3 风险实践提出的监测基准；Story Protocol 尚未公开采用这些具体阈值。终止标准是投资逻辑破裂点，不是协议关停条件。
