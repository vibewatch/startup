      - number: '6.4'
        title: 留存、耐久性与满意度——指标缺失、结构性缺口
        blocks:
          - type: paragraph
            body: >
              Story Protocol 没有发布，也没有披露任何传统客户留存指标：截至本报告运行日，公开资料没有 NRR、GRR、cohort churn、contract renewal rate 或
              satisfaction score 数据。对一条 L1 区块链来说，这种缺失在结构上并不意外：无许可加密网络里的留存通常用日活地址、交易量、TVL、费用收入等代理指标衡量，而截至 2026
              年初，这些指标都偏弱。

              日收入从 2025 年 9 月峰值 $43,000，在五个月内跌至 $0。Story 的活跃钱包数和日交易量没有以足够做队列分析的粒度独立发布。PiperX 截至 2026 年 6 月的 $0 TVL
              说明，IPFi 垂直尚未吸引有意义资本。Aria Protocol 的 4,300+ 用户是所有非协议应用中披露最高的用户数，但 Aria 的留存和每用户收入数据并不公开。

              对 IP 权利持有人来说，耐久性取决于 Programmable IP License 能否通过自动版税流形成足够的经济锁定。Royalty Module 会自动向父 IP
              持有人分配份额，但没有披露的版税支付量，现实粘性无法验证。Story Foundation 的 Critics Guide blog
              承认，线下版税收入无法由协议本身强制执行，形成结构性耐久性风险：如果预期许可价值的大头发生在线下，Story 的协议层可能永远无法把它捕获为链上收入。
