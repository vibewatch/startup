      - number: '2.2'
        title: 买方、用户与付费方分层
        blocks:
          - type: paragraph
            body: >-
              Story 的市场有三类主要买方，预算归属和采用触发点各不相同。第一类是 AI labs 和机器学习公司，预算所有者是法律、合规或数据采购团队，用户是 ML 研究员或数据工程师，触发点是 EU AI Act
              合规或规避诉讼风险。Story 白皮书明确把 AI-to-AI 授权作为核心用例：其 Agent TCP/IP 协议让自主 AI 智能体无需人工中介，就能谈判、授权和执行 IP 协议，并用 $IP token
              在链上结算版税。第二类是个人或工作室级创作者——数字艺术家、音乐人、作家和游戏开发者——他们希望作品被 remix
              或商业使用时，可以自动获得归属和版税。在这里，用户和付费方是同一个人；预算归属非正式（平台费从收入分成中吸收），采用触发点是面向用户的工具成熟，让链上注册像传统上传一样简单。Ippy NFT 在主网上的
              823,939 次再创作显示这一人群已有早期牵引力，但它代表的是单个展示资产，而不是广泛商业 IP 活动。第三类是 DeFi 和 IPFi 投资人及开发者，他们把 IP
              资产视为可编程金融原语——可碎片化、可质押、可抵押——预算归属在资金库分配或风险资本中。

              相邻玩家定义了买方采用 Story 前必须评估的替代方案。Ocean Protocol 提供 compute-to-data 和去中心化数据市场；Molecule.xyz 面向生物医药 IP-NFT；Zora 和
              Manifold 解决数字创作者工具，但没有授权层；Audius 以链上归属切入去中心化音乐流媒体；Royalty Exchange 则是音乐版税交易的链下既有玩家。EIP-2981 为 NFT 版税支付信息提供
              Ethereum 标准，但它是可选择加入且不强制执行。创作者从这些既有方案切换到 Story，成本同时来自技术（链上注册工作流）和法律（不熟悉 PIL 条款），这造成真实采用摩擦，也体现在当前牵引力数字中。
