  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入流与定价模型
        blocks:
          - type: paragraph
            body: >-
              Story Protocol 的链上收入模型与传统软件公司根本不同。$IP token 是网络原生货币，承担四个彼此相连的功能：所有区块链交易的 gas
              支付、治理参与、质押与验证，以及协议层授权和版税操作的结算货币。但 gas 收入的经济受益方是验证者 / 质押者集合，而不是 PIP Labs 这个公司实体。

              每一次链上操作都用 $IP 支付交易 gas 费：IP Asset 注册、license token 铸造、衍生 IP 注册、版税支付和争议提交。所有费用都流向验证者集合（通过源自 Cosmos SDK
              的共识层），而不是公司资金库。Coinbase、OKX、Bybit 和 Gate 上线 $IP 交易，截至运行日 24 小时成交量约为 $20.7 million。

              Royalty Module 支持 IP Assets 与其衍生作品之间的自动化收入分成。当 IP 所有人在 PIL 风格许可上设置 mintingFee 时，任何铸造该 license token
              的人都会把费用直接支付到 IP 所有人的 IP Royalty Vault，而不是协议资金库。收入通过智能合约点对点流转；协议不从版税中抽取费用。主网上的白名单支付 token 包括 WIP（Wrapped
              IP），确保版税流仍以协议原生资产计价。

              质押排放是一种准收入机制，奖励验证者和委托人，但也对流通供给造成通胀压力。治理提案 SIP-009（2026 年 1 月通过）之后，年排放从观察到的约 25.3 million IP / 年降至目标 15.315
              million IP / 年。按 2026 年 6 月 7 日约 $0.30 的 token 价格计算，这项排放相当于每年约 $4.6 million 价值分配给质押者——只是 ATH token
              价格（$14.78）下本可分配价值的一小部分。SIP-009 后，已解锁质押者的目标 APY 为 6–7%。

              PIP Labs 的直接收入没有公开披露。公司持有 5% Foundation 分配（50 million IP tokens）中的一部分，也大概率保留了四轮融资的股权资本。没有宣布任何授权、订阅或 SaaS
              收入。商业模式依赖基础设施：协议采用推动 token 需求，token 需求推高资金库价值，资金库再为持续开发提供资金。
