      - number: '8.2'
        title: 融资背景、估值情景与可比分析
        blocks:
          - type: paragraph
            body: >-
              PIP Labs 共完成四轮股权融资，规模约 $133–142 million：May 2023 的种子轮、September 2023 的 Series A（两轮合计宣布 $54M，由 a16z crypto
              领投，Polychain Capital、Samsung Next、Hashed 以及一长串战略个人投资者参投），以及 June 2024 的 $80 million Series B；该轮由 a16z
              crypto 和 Polychain Capital 领投，投后股权估值 $2.25 billion。$2.25B 这个数字从未由 PIP Labs 官方披露；按 CNBC 当时报道，它来自“匿名消息源”。截至
              June 2026，公司没有宣布新的股权融资。

              代币市场提供了实时公开估值参照，但必须谨慎解读。$IP 代币于 February 13, 2025 在主网上线，并在同月（February 2025）触及 $14.78 的历史高点，意味着峰值 FDV 约
              $14.78 billion——大约是同期股权估值的 6.6×。截至 June 7, 2026，代币交易价格约 ~$0.30，流通市值约 $108 million（360 million 枚代币流通），FDV 约
              ~$300 million。较历史高点下跌 97.9%，相对 Series B 股权估值折价 7.5×。股权估值与 FDV 脱节，并不自动证明估值过高：代币价格由投机资金流决定，不能直接代表 PIP Labs
              的股权价值。但缺口已经大到足以让人担心，下一次融资时股权估值锚是否还能守住。

              August 2026 的团队与投资者代币解锁，是下一个关键供给事件。原定 February 2026 的解锁在有记录的使用滞后和市场疲弱背景下延后六个月；联合创始人 SY Lee 明确把这次延后类比为
              Worldcoin 在 2024 延长投资者和团队锁仓的决定，称其是长期承诺信号，而不是困境信号。解锁一旦执行，流通供应量会超过当前 360
              million，并可能压低代币价格——除非期间出现企业收入证据，否则会进一步强化股权与代币估值的脱节。

              可比分析覆盖五类：链上 IP / 数据协议代币、创作者经济协议代币、相邻 L1、私募轮估值基准，以及代币市场周期对比。最令人警醒的直接可比是 Ocean Protocol（数据 / AI 授权区块链，市值约
              ~$21.7M，FDV 约 ~$29M，较历史高点下跌 94.4%）和 Audius（创作者经济音乐协议，市值约 ~$21.3M，FDV 约 ~$21.3M，较历史高点下跌
              99.7%）——二者峰值完全稀释估值都曾明显更高，但在公开市场里已收敛到近乎为零的商业牵引力。Stacks（Bitcoin 上带应用层的 L2，市值约 ~$342M）、Filecoin（与 IP /
              数据相邻的存储 L1，市值约 ~$595M，FDV 约 ~$1.48B）和 Worldcoin（身份 / 生物识别区块链，Lee 引用过其延长锁仓先例，市值约 ~$1.49B，FDV 约
              ~$4.4B）代表更高规模的可比，用来说明尚未产生有意义协议收入的基础设施代币，合理上限可能在哪里。没有任何代币可比的 FDV 接近 $2.25B 的股权估值锚。

              乐观、基准、悲观三种估值这样构建。乐观情景（10–15% 概率）假设 Story Protocol 到 2028–2029 成为 AI 训练数据集的权威登记层，取得 $20M+
              企业授权年经常性收入（ARR），代币价格恢复到历史高点的 50%（约 ~$7.39），FDV 进入 $7–15B 区间，从 Series B 估值锚支撑 3–7× 回报。基准情景（55–60%
              概率）假设协议逐步采用，AI 数据授权收入温和（ARR 低于 $10M），代币在 $0.50–$1.50 区间企稳，FDV 为 $500M–$1.5B，股权估值锚对应结果为持平到负收益。悲观情景（25–35%
              概率）假设使用量仍接近零，August 2026 解锁引发抛压，代币跌破 $0.10，FDV 跌破 $100M，公司最终走向人才收购，或以显著下调的股权估值完成降估值融资。
