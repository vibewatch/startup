      - number: '3.4'
        title: 切换成本、多平台并行与锁定动态
        blocks:
          - type: paragraph
            body: >
              Story Protocol 的切换成本集中在 IP 注册层和衍生关系图。一旦 IP 所有人在 Story 上注册 IP Asset，许可就会被铸造成 ERC721
              NFTs，并锚定在这条特定链和模块地址上；迁移到竞争平台需要重新注册，并失去来源历史。版税 vault 和谱系图形成实质锁定：下游被授权方持有指向 Story Royalty Module 的 ERC721
              license NFTs，多层衍生 IP 树的累计版税堆叠在其他链上没有可携带表示，除非重新执行。与之相对，多平台并行是可行的，因为 Story 原生
              token（IP）已在主要中心化和去中心化交易所上线，流动性可得；同时，Ethereum 上的 EIP-2981
              仍是零摩擦替代方案，许多创作者在简单场景中会更偏好它。对高价值交易来说，通过律师和私有合同完成的传统授权仍是现状路径，因为法律终局性（法院可执行性）比自动化更重要。Story 的 Royalty Token
              机制又增加了一层切换成本：IP 所有人可以把未来收入流作为链上 token 出售，这种「IPFi」形式把经济价值绑定到 Story 链上。质押机制也加深社区经济纠缠；SIP-010（2026 年 1
              月）提议把最低质押从 1024 IP 降至 32 IP，以支持散户参与。治理论坛活动（SIP-009，2026 年 1 月，把 token 排放从每年约 25M 降至
              15.3M）显示治理结构活跃且反应快，但也说明代币经济仍在变动；机构 IP 所有人评估长期平台稳定性时，这会削弱其对锁定效应的信心。
