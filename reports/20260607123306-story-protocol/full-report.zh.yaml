      - number: '4.3'
        title: 成本结构、单位经济与财务结论
        blocks:
          - type: paragraph
            body: >-
              作为区块链 L1 基础设施项目，Story Protocol 的成本结构结合了工程、安全、法律和验证者激励成本。工程成本覆盖核心 Story Network L1（piplabs/story 和
              piplabs/story-geth GitHub 仓库，两个独立维护的代码库，分别对应 Cosmos SDK 和 EVM 层）、Proof-of-Creativity Protocol
              智能合约（storyprotocol/protocol-core-v1 和 storyprotocol/protocol-periphery-v1）、多语言 SDK
              套件（TypeScript、Python），以及协议浏览器应用。法律成本包括 Programmable IP License（PIL）的持续维护和迭代，该许可由外部法律顾问（Ghaith Mahmood 和
              Heather Liu）开发。安全成本包括 Halborn Security、FuzzingLabs 和 Trust Security 对多个协议版本的正式审计，以及活跃的 Immunefi bug bounty
              项目。验证者激励成本嵌入 token 排放中，但 Foundation 仍需要资源来协调并支持最多 80 个活跃验证者（SIP-011 提议将其降至 21，以提高质押集中度和治理参与）。

              适用于去中心化 L1 协议的单位经济不同于 SaaS
              或市场平台基准。没有可披露、也没有传统意义上适用的获客成本（CAC）、客户终身价值（LTV）或毛利率。更相关的单位经济代理指标是每笔交易的成本与收入：链上每次操作的
              gas，被拆分为协议费（为零）与验证者收入。根据 SIP-010（质押门槛提案），质押操作费用从 1 IP 降至 0.1 IP，最低质押门槛从 1024 IP 降至 32
              IP——这些变化降低了参与摩擦，但也减少了每次质押事件的费用收入。约 13.14 million blocks / 年的出块率（高于设计的 10.37
              million）意味着网络有持续交易处理能力，但公开渠道没有披露聚合费用收入数字。

              财务结论偏谨慎。按传统标准，收入质量低：协议产生链上交易费，但全部流向验证者（不是 PIP Labs），且授权或版税交易没有抽取协议层费用。利润率结构不透明。相对于已披露收入，资本强度很高——项目需要超过
              $133 million 股权资本来建设和上线，token 资金库又因价格下跌严重受损。2026 年 8 月团队和投资者 token
              解锁是重大风险事件：如果出现显著卖压，代币计价资金库价值会进一步压缩，限制运营现金跑道。EFF 长期指出，IP 执法体系可能被武器化为「对创新和言论自由的否决权」；这对基于区块链的 IP
              协议尤其有力，因为链上执行是自动的——随着 Story 用户规模扩大，这一架构风险可能引发法律和监管逆风。三个关键尽调阻碍仍在：（1）未披露 P&L
              或烧钱速度，（2）未披露让公司实体受益的协议费或收入机制，（3）自 2025 年 2 月主网上线以来，没有展示来自主网运营的协议费收入。
