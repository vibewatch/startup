      - number: '5.4'
        title: 安全、信任与质量控制
        blocks:
          - type: paragraph
            body: >-
              Story 上线前的安全计划，对新 L1 来说系统性很强。团队做了两轮正式审计：第一轮面向 Proof-of-Creativity v1 智能合约，聘请 SlowMist、Fuzzland 和 Trust
              Security；第二轮发生在转向 L1 之后，覆盖 Cosmos SDK 修改、IPGraph 预编译和升级后的 PoC 合约，传统审计方是 Halborn，FuzzingLabs 提供定制 Cosmos 模块
              fuzzer 和专为预编译覆盖改造的 Echidna fork，Trust Security 则再次作为独立审计方参与。FuzzingLabs 的定制工具有明确技术动因：IPGraph
              预编译是有状态图遍历，现成模糊测试工具很难充分测试。


              主网上线前审计竞赛（2024 年 12 月 14 日 – 2025 年 1 月 17 日）覆盖四个仓库，最高奖金池 $1 million，收到 977 份提交，暴露 19 个高危、44 个中危和 51
              个低危问题——上线前均已修复。TGE 后，Immunefi 上的漏洞赏金计划为覆盖全协议栈的关键资金损失漏洞提供最高 $600,000 奖励。团队内部要求关键代码路径合并进主分支至少获得两次批准，并以 100%
              单元测试覆盖率为目标。TGE 后，Trust Security 以保留服务形式负责差分审计，一名专职内部 web3 安全研究员手工审查所有新功能。Ecosystem Auditor Program
              将安全覆盖延伸到 PiperX、UnleashProtocol、MetaPool、Verio、Color 和 StoryHunt 等选定网络项目。Story 还发布了 MiCA White Paper
              作为欧盟监管披露，并维护单独的治理安全博客系列。
