      - number: '4.2'
        title: 资本结构、代币经济与资本充足性
        blocks:
          - type: paragraph
            body: >-
              基于 DefiLlama 数据和新闻报道，PIP Labs 在四轮有记录融资中合计获得约 $133.7 million 股权融资。$29.3 million 种子轮于 2023 年 5 月完成，投资人包括
              a16z Crypto、Hashed、Samsung Next、Mirana Corp、Dao5、Two Small Fish Ventures、Berggruen Holdings 和 SLVC。$27.5
              million Series A 于 2023 年 9 月跟进，许多相同投资人继续参与，并新增 Endeavor、Insignia Venture Partners、AllianceDAO 和 Foresight
              Ventures。$5 million KOL（Key Opinion Leader）轮于 2024 年 3 月完成。Series B 公开宣布为 $80 million，由 a16z Crypto 和
              Polychain Capital 领投，于 2024 年中完成（DefiLlama 记录 2024 年 8 月为 $71.9 million；新闻报道引用公开宣布的 $80 million
              数字）。历史融资时间线属于第 1 章（公司概况）的范畴；本节关注从这一基础推导出的前瞻资本充足性。

              $IP token 对 Story 生态而言类似准资产负债表项目。总供应量上限为 1 billion tokens，截至 2026 年 6 月 7 日，约 360 million tokens（总量的
              36%）处于流通状态。2025 年 2 月 TGE 时，初始流通供应量约为 250 million tokens（25%）。从 25% 增至 36% 流通，反映了解锁事件和生态激励；但团队和投资人 token
              原计划在 2026 年 2 月开始解锁，PIP Labs 领导层因外界批评使用滞后和卖压担忧，把解锁推迟到 2026 年 8 月。CoinDesk 2026 年 2
              月报道明确引用「使用量滞后和抛售担忧」作为理由，Story 联合创始人在后续访谈中也承认项目需要「更多时间」。

              截至 2026 年 6 月 7 日的 token 市场指标，相比 2025 年 2 月上线水平出现严重回撤。$IP 历史高点 $14.78 记录于 2025 年 2 月，接近 TGE
              和主网上线时间。截至运行日，$IP 约以 $0.30 交易，较 ATH 下跌 97.9%。市值约 $108.6 million；完全稀释估值（FDV）约 $314.5 million——这意味着市场给已解锁
              token 和锁定 token 的定价几乎相同，也符合市场对 2026 年 8 月解锁悬顶的怀疑。

              没有私有披露，无法计算资本充足性。烧钱速度、账上现金或现金跑道都没有公布。总额层面，公司约融资 $133–142 million 股权资本；扣除三年运营成本（工程团队、PIL
              框架法律工作、安全审计、验证者激励、BD）后，现金跑道很可能明显短于初始股权金额所暗示的水平。Story Foundation 的 5% 分配（50 million tokens，按 $0.30
              计）按当前价格约代表 $15 million 代币计价资金库——只是 ATH 定价所暗示价值的一小部分。如果 token 价格在 2026 年 8 月解锁前持续低迷，这会造成显著资本充足性风险。
