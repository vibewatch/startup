      - number: '6.3'
        title: Adoption Trajectory and On-Chain Metrics
        blocks:
          - type: paragraph
            body: >
              Story Protocol launched its mainnet in February 2025 and debuted the $IP token with an initial 25% unlock
              of the 1-billion-token supply, with 58.4% allocated to ecosystem, community, and foundation incentives.
              On-chain adoption metrics present a mixed picture.

              On the positive side, Story's homepage claims 823,939 derivative remixes of the Ippy mascot IP asset—a
              company-owned character seeded with an open-source Programmable IP License to demonstrate the
              remix-royalty mechanism. The protocol's GitHub organization hosts 53 public repositories as of May 2026,
              with the TypeScript SDK accumulating 109 stars and 71 forks. The deployed smart contracts—including IP
              Asset Registry, Royalty Module, Dispute Module, and Licensing Module— are verified on-chain with public
              addresses, indicating a production-grade protocol stack.

              On the negative side, daily onchain revenue peaked at $43,000 in September 2025 and fell to $0 by early
              February 2026 per DeFiLlama as cited by CoinDesk. Story co-founder SY Lee acknowledged the near-zero gas
              revenue in a February 2026 CoinDesk interview, framing it as consistent with Story's low-fee IP chain
              design and arguing that expected monetization occurs off-chain. The team and investor token unlock was
              delayed from February 2026 to August 2026, with the team citing the need for "more time" to build network
              usage—a decision that observers interpreted as a response to weak adoption signals and investor dump
              fears.

              The Ippy remix count is the most-cited adoption signal but should be treated cautiously: Ippy is a Story
              Foundation-owned IP seeded under a permissionless open license, making it an internally controlled metric
              rather than a third-party adoption indicator. No independent audit of the 823,939 figure has been
