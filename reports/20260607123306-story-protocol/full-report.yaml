    title: Story Protocol On-Chain Daily Revenue — Adoption Trajectory Proxy
    type: bar
    layout: standard
    summary: >
      Daily onchain revenue peaked at $43,000 in September 2025 roughly seven months after the February 2025 mainnet
      launch, then collapsed to $0 by February 2026—a signal of weak post-launch adoption that prompted the team to
      delay token supply unlocks by six months.
    data:
      items:
        - label: Feb 2025 — Mainnet launch
