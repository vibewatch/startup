  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, adjacents, substitutes, and likely entrants'
        blocks:
          - type: paragraph
            body: >
              The competitive space for Story Protocol spans five distinct player classes with very different starting
              advantages. Direct blockchain IP peers are the smallest and weakest class: Ocean Protocol operates an
              on-chain data marketplace using Data NFTs and Datatokens but targets data/AI monetization rather than
              general creative IP, and its token market cap of roughly $21.7M and daily volume of ~$30K as of the
              research date signal limited traction. Molecule Protocol addresses biomedical IP-NFTs for drug-discovery
              researchers—a niche vertical that does not overlap with Story's creator and AI training data positioning.
              Creator-tool peers occupy more adjacent territory: Manifold provides Ethereum NFT minting infrastructure
              backed by a16z and Initialized Capital, powering brands including Beeple, Jay-Z, Adidas, and Mercedes-AMG,
              with a stated mission of "creative sovereignty in the age of AI"—but without a legally-backed off-chain
              licensing framework. Zora provides an OP Stack-based Layer 2 for on-chain media creation and monetization.
              Audius offers decentralized music streaming infrastructure for artists. The status- quo incumbents
              represent the most structurally durable competition: Ethereum's voluntary EIP-2981 royalty standard
              requires only marketplace adoption and carries no enforcement mechanism, while traditional royalty
              collection organizations (ASCAP, BMI, RIAA affiliates) and private marketplaces like Royalty Exchange
