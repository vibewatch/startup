      - number: '8.3'
        title: Exit Readiness and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Story Protocol's primary exit path for investors is token liquidity—the $IP token is listed on Coinbase,
              Binance, OKX, Bybit, and Gate, providing secondary-market access to token holders. However, the team and
              investor vesting schedules remain locked until August 2026, and the 97.9% token price decline from ATH
              means that even at unlock, aggregate investor returns from token holdings are materially impaired relative
              to expectations at Series B pricing. An M&A exit to a major AI company (OpenAI, Anthropic, Google
              DeepMind, Adobe, or a major media conglomerate) represents a secondary path: Story Protocol's IP registry
              infrastructure, legally-backed PIL framework, and $142M in equity-funded R&D represent genuine strategic
              assets. A public markets exit (IPO or direct listing) is not credibly accessible in the near term given
              the absence of disclosed ARR and the complexity of reporting token-based economics under traditional
              public company accounting standards. Grayscale's launch of the Grayscale Story Trust in July 2025
              represents a form of institutional product access but does not constitute a liquidity event for equity
              holders.

              The five thesis-break triggers that would force a diligence re-opening are: (1) enterprise licensing
              revenue confirmed at zero after 12 more months of mainnet operation, (2) the August 2026 token unlock
              triggering a further >50% token price decline, (3) loss of any of the three co-founders within 18 months,
              (4) a major AI lab building a competing on-chain IP registry rather than adopting Story Protocol, and (5)
              adverse regulatory action in a major jurisdiction (EU AI Act enforcement, U.S. copyright litigation
              directly naming Story).

              The final diligence asks are structured across six workstreams: enterprise revenue, token economics,
              capital runway, protocol adoption, legal enforceability, and competitive dynamics. A pre-investment
              decision should not be made without at minimum (a) audited or CFO-certified revenue schedule confirming or
              denying AI data licensing ARR, (b) full token vesting schedule by category, and (c) current cash balance
              and monthly burn rate from PIP Labs management.
