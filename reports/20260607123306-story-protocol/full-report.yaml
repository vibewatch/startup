  - id: FV002
    title: Valuation Sensitivity — Key Driver Impact on FDV and Equity Justification
    type: bar
    layout: standard
    summary: >-
      Shows how changes in five key value drivers (token price, circulating supply, enterprise ARR, comparable multiple,
      and probability of exit) shift the implied FDV and whether they close the gap to the $2.25B equity mark.
    data:
      series:
        - label: Token Price Scenarios
          points:
            - label: $0.05 (bear floor)
              value: 50
              unit: USD millions FDV
            - label: $0.30 (current)
              value: 300
              unit: USD millions FDV
            - label: $1.00 (base recovery)
              value: 1000
              unit: USD millions FDV
            - label: $3.00 (partial ATH recovery)
              value: 3000
              unit: USD millions FDV
            - label: $7.39 (50% ATH)
              value: 7390
              unit: USD millions FDV
        - label: Enterprise ARR Multiple Scenarios
          points:
            - label: ARR $0 / no multiple
              value: 300
              unit: USD millions equity-supportable
            - label: ARR $5M × 50× (early-stage infra)
              value: 250
              unit: USD millions equity-supportable
            - label: ARR $20M × 80× (fast-growth infra)
              value: 1600
              unit: USD millions equity-supportable
            - label: ARR $50M × 50× (scaled infra)
              value: 2500
              unit: USD millions equity-supportable
            - label: ARR $80M × 30× (mature infra)
              value: 2400
              unit: USD millions equity-supportable
    approximationNotes: >-
      FDV computed as $IP price × 1 billion total supply. Enterprise ARR multiples are indicative based on comparable
      blockchain infrastructure rounds (2023–2024). Current $IP price $0.30 as of June 7, 2026 (CoinGecko). $2.25B
      equity mark shown as horizontal reference — the gap between any scenario bar and $2.25B represents the evidence
      shortfall.
    claimRefs:
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
  - id: FV003
    title: Valuation / Return Range — Bull, Base, and Bear Outcomes
    type: range
    layout: standard
    summary: >-
      Illustrates the low/base/high FDV range for the three scenario cases and computes the implied multiple from the
      Series B entry mark of $2.25 billion.
    data:
      items:
        - label: FDV — Bull Case
          low: 7000
          mid: 10000
          high: 15000
          unit: USD millions
          note: Low = token at $7/FDV; Mid = $10/FDV; High = $15/FDV; assumes $20M+ ARR by 2029
        - label: FDV — Base Case
          low: 500
          mid: 900
          high: 1500
          unit: USD millions
          note: Low = token stays near $0.50; Mid = $0.90; High = $1.50; sub-$10M ARR
        - label: FDV — Bear Case
          low: 30
          mid: 70
          high: 100
          unit: USD millions
          note: Low = token near $0.03; Mid = $0.07; High = $0.10; usage near zero
        - label: Equity Return Multiple — Bull
          low: 1.1
          mid: 1.8
          high: 3
          unit: × entry (Series B $2.25B)
          note: Based on bull FDV at 1.5–2× equity discount (infra premium) over 3–5 year hold
        - label: Equity Return Multiple — Base
          low: 0.2
          mid: 0.5
          high: 0.7
          unit: × entry (Series B $2.25B)
          note: Flat to negative; significant time-value loss on 3–5 year hold
        - label: Equity Return Multiple — Bear
          low: 0.05
          mid: 0.1
          high: 0.2
          unit: × entry (Series B $2.25B)
          note: Near total loss; acqui-hire or down-round at 80–95% haircut to Series B mark
        - label: Current FDV vs Equity Mark Gap
          low: 300
          mid: 300
          high: 2250
          unit: USD millions
          note: Low/Mid = Jun 2026 FDV ($300M); High = Series B equity mark ($2.25B); gap = 7.5×
    claimRefs:
