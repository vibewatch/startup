            Peak $43K/day (Sep 2025)
        - id: moat
          label: |-
            Moat Signal
            Only purpose-built IP L1
            PIL legal-blockchain bridge
        - id: team
          label: |-
            Team Signal
            $440M Radish exit
            a16z + Polychain backing
        - id: fin
          label: |-
            Financial Context
            $2.25B equity (unconfirmed)
            FDV $300M (7.5× discount)
        - id: comps
          label: |-
            Comparable Context
            Ocean $21.7M MC
            Audius $21.3M MC
        - id: risk
          label: |-
            Key Risks
            Aug 2026 unlock overhang
            No enterprise revenue
            Token -97.9% from ATH
        - id: gate_bull
          label: |-
            Bull Gate
            ≥$5M ARR confirmed OR
            signed top-tier AI contract
        - id: gate_bear
          label: |-
            Bear Gate
            $0 revenue after Feb 2027
            Founder departure
            Token <$0.05
        - id: hold
          label: |-
            Recommendation
            Conditional Hold / Watch
            No new entry at $2.25B mark
        - id: invest
          label: |-
            Upgrade to Invest
            If bull gate cleared
        - id: exit
          label: |-
            Exit / Write-Down
            If bear gate triggered
      edges:
