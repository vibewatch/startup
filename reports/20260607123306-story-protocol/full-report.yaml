    title: Investment KPIs — IC-Ready Scoring Across Six Dimensions
    type: kpi
    layout: compact
    summary: >-
      Investment committee scoring across six dimensions—market, proof, moat, economics, risk, and valuation—with a
      final confidence-weighted composite. Scores are 1–5 (1=weak, 5=strong) based on public evidence available as of
      June 7, 2026.
    data:
      items:
        - label: Market Opportunity (TAM / Urgency)
          value: 4/5
          unit: IC score
        - label: Proof of Product-Market Fit
          value: 1/5
          unit: IC score
        - label: Moat / Defensibility
          value: 3/5
          unit: IC score
        - label: Unit Economics / Revenue
          value: 1/5
          unit: IC score
        - label: Risk-Adjusted Profile
          value: 2/5
          unit: IC score
        - label: Valuation vs. Evidence
          value: 1/5
          unit: IC score
        - label: Composite IC Score (weighted)
          value: 2.0/5
          unit: IC score
        - label: Recommendation
          value: Conditional Hold / Watch
          unit: verdict
        - label: Series B Entry Equity Mark
          value: $2.25B (unconfirmed, anon-sourced)
          unit: USD
        - label: $IP Token FDV (Jun 2026)
          value: ~$300M
          unit: USD
        - label: Equity/Token Dislocation
          value: 7.5×
          unit: ratio
        - label: Next Key Event
          value: August 2026 Token Unlock
          unit: event
    approximationNotes: >-
      IC scores are evidence-based assessments, not model outputs. Composite is weighted 60% fundamentals (proof,
      economics, moat) and 40% contextual (market, risk, valuation). All token metrics as of June 7, 2026 (CoinGecko).
      Equity mark is per anonymous sourcing reported by CNBC and ETCentric.
    claimRefs:
      - CV001
      - CV006
      - CV014
      - CV015
      - CV016
