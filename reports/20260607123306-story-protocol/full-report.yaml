      - number: '5.4'
        title: Security, Trust, and Quality Controls
        blocks:
          - type: paragraph
            body: |-
              Story's pre-launch security program was unusually systematic for a new L1. The team ran
              two rounds of formal audits: round one (targeting the Proof-of-Creativity v1 smart contracts)
              engaged SlowMist, Fuzzland, and Trust Security; round two (post-pivot to L1, covering the
              Cosmos SDK modifications, the IPGraph precompile, and the upgraded PoC contracts) engaged
              Halborn as the traditional auditing firm, FuzzingLabs with a custom Cosmos-module fuzzer
              and a bespoke Echidna fork for precompile coverage, and returning Trust Security as
              independent auditors. FuzzingLabs' custom tooling was technically motivated: the IPGraph
              precompile's stateful, graph-traversal nature cannot be adequately tested with off-the-shelf
              fuzzing tools.

              The pre-mainnet audit contest (December 14, 2024 – January 17, 2025) ran across four
              repositories with a $1 million maximum prize pool, received 977 submissions, and surfaced
              19 High-severity, 44 Medium-severity, and 51 Low-severity findings — all remediated before
              launch. The post-TGE bug bounty on Immunefi offers up to $600,000 for critical loss-of-funds
              exploits covering the full protocol stack. Internally, the team enforces a minimum two-approval
              policy for merging into the main branch on critical code paths and targets 100% unit test
              coverage. Post-TGE, Trust Security is on retainer for differential audits, and a dedicated
              in-house web3 security researcher manually reviews all new features. The Ecosystem Auditor
              Program extends security coverage to selected network projects including PiperX,
              UnleashProtocol, MetaPool, Verio, Color, and StoryHunt. Story has also published a
              MiCA White Paper as an EU regulatory disclosure and maintains a separate governance
              security blog series.
