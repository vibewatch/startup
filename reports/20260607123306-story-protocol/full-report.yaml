      - number: '5.2'
        title: Module Map and Technical Architecture
        blocks:
          - type: paragraph
            body: |-
              Story's technical architecture has two distinct stacks. At the network layer, PIP Labs
              built Story Network as a modified Cosmos SDK chain using CometBFT for Byzantine fault-tolerant
              consensus and a forked go-ethereum (Geth) client for EVM transaction execution. The two
              layers communicate via the Engine ABI and a custom ABCI++ adapter, decoupling consensus
              efficiency from EVM transaction throughput — an approach inspired by Ethereum's proof-of-stake
              execution/consensus split. A custom stateful precompile, the IPGraph, enables the EVM to
              traverse IP ancestry graphs in seconds at marginal cost, which is architecturally critical
              because the Royalty and Licensing Modules must walk multi-generation derivative trees
              during routine on-chain operations. Deployed contract addresses for the mainnet (Homer,
              chain ID 1514) are published in deployment-1514.json in the public protocol-core-v1
              GitHub repository; node operators need 4 CPU cores, 32 GB RAM, 200 GB disk, and 10 MBit/s
              bandwidth.

              At the application layer, the Proof-of-Creativity (PoC) protocol comprises six core Solidity
              modules: the IP Asset Registry and IP Account system (using ERC-6551 token-bound accounts),
              the Licensing Module (parent-child IPA relationships with on-chain license terms), the
              Royalty Module (IP Royalty Vault per IPA, Royalty Tokens, and ancestry-graph revenue
              routing), the Dispute Module (UMA oracle-based arbitration with five canonical dispute
              tags), the Grouping Module (shared revenue pools across IP collections), and the Metadata
              Module. Periphery contracts (storyprotocol/protocol-periphery-v1) batch common multi-step
              workflows — mint, register, attach — into single transactions, and the Multicall3 contract
              is supported for native batching. Royalty Tokens in the Royalty Module each represent 1%
              of an IPA's total revenue entitlement and can be transferred to other wallets, enabling
              composable revenue distribution. Whitelisted payment tokens on mainnet include WIP ($IP
              Wrapped), with additions governed by the RoyaltyModule.sol contract.
