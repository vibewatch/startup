  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base — Ecosystem Builders, IP Rightsholders, and AI Data Consumers
        blocks:
          - type: paragraph
            body: >
              Story Protocol does not operate a traditional B2B or B2C SaaS business with named enterprise clients,
              signed contracts, or disclosed recurring revenue metrics. Its primary participants are three loosely
              defined cohorts. First, ecosystem application developers who deploy smart-contract-based products on the
              Story L1 and use the Proof-of-Creativity SDK to register and license IP assets. Second, individual or
              institutional IP rightsholders—creators, musicians, dataset providers, entertainment studios, and
              biomedical researchers—who register their IP onchain to automate licensing and royalty collection. Third,
              AI data consumers—model developers and foundation-model companies—who seek rights-cleared, legally
              attributed datasets for training without the friction of bespoke licensing agreements.

              Story's homepage explicitly targets six customer verticals: AI companies needing uncrawlable, IP-safe
              datasets for physical AI; data providers enabling permissionless licensing; biomedicine and patents for
              tokenizing research and automating royalties; institutional funds for trading and restaking tokenized IP
              portfolios; brands and entertainment capturing and monetizing viral fan moments; and individual creators
              registering and monetizing IP in seconds. In practice, public evidence of production traction is
              concentrated in the first category—ecosystem app developers—while activity in the other five verticals
              remains nascent or company-claimed.

              The buyer-payer model differs from conventional software: developers pay gas fees in $IP tokens; IP
              rightsholders pay nothing to register but automatically share royalties with the protocol; AI consumers
              are expected to pay via on-chain licensing agreements once enterprise deals close. Co-founder SY Lee
              stated in February 2026 that near-zero onchain gas revenue is "the wrong metric" because the intended
              monetization occurs through off-chain licensing agreements. As of the run date, no such enterprise
              licensing revenues are publicly documented and Story's strategic pivot toward AI data licensing
              concentrates the monetization thesis on deals not yet disclosed.
            claimRefs:
