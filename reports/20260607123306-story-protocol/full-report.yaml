      - number: '2.3'
        title: Growth Drivers, Adoption Constraints, and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              The demand-side drivers are real but have not yet translated into commercial-scale revenue on-chain. On
              the regulatory side, EU AI Act Article 53 requires GPAI providers to document training data and comply
              with copyright—a hard-law driver that directly legitimizes Story's training-data licensing value
              proposition. The ongoing wave of AI copyright litigation (music publishers, news organizations, stock
              image agencies vs. AI labs) creates reputational and legal pressure on labs to source rights-cleared data,
              which is Story's advertised supply. Goldman Sachs' $500 billion creator economy estimate confirms that the
              content monetization market is large and growing. Grayscale launched a Story Trust in July 2025 to offer
              institutional investors exposure to $IP, citing the "$80T intellectual property market"—an institutional
              legitimacy signal even if the headline figure lacks methodological grounding.

              The constraints are equally material. The $IP token traded at an all-time high of $14.78 and was
              approximately 97.9% below that peak as of June 2026 (CoinGecko), reflecting weak market sentiment and
              sparse network usage. CoinDesk reported in February 2026 that Story delayed team-and-investor token
              unlocks to August 2026 because "usage lags and dump fears grow"—a meaningful adverse signal for adoption
              velocity. The Programmable IP License is a legal off-chain document and its enforceability depends on
              jurisdictional recognition of smart-contract terms under US copyright law, a question courts have not
              definitively resolved. The EFF argues the IP system already grants rights holders a "veto on innovation,"
              and critics contend that a blockchain layer adds friction without solving the fundamental problem of
              rights clearance at scale. Additionally, mainstream IP owners (music labels, film studios, game
              publishers) have no crypto wallets and face high switching costs to onboard catalogs on-chain, limiting
              near-term SAM to crypto-native creators and developer-driven workflows unless Story funds a dedicated
              onboarding program with fiat rails and custodial tooling.
