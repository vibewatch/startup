            body: |-
              Story provides a multi-layer developer toolkit that abstracts the complexity of on-chain
              IP operations. The TypeScript SDK (storyprotocol/sdk, npm @story-protocol/core-sdk) exposes
              seven functional modules — IP Asset, License, Royalty, Dispute, Group, WIP, and NFT Client
              — covering the complete protocol surface on both Aeneid testnet (chain ID 1315) and Story
              Homer mainnet (chain ID 1514). The Python SDK (storyprotocol/python-sdk) mirrors this
              interface for data-science and AI workflows. Periphery contracts (SPG, storyprotocol/
              protocol-periphery-v1) allow developers to bundle multi-step operations — NFT minting,
              IP registration, license term attachment, licensing configuration — into a single on-chain
              call, reducing gas costs and simplifying integration logic. The Multicall3 contract is
              also supported for native batch execution.

              Deployment evidence is strong: Story's Protocol Explorer and the Storyscan block explorer
              allow inspection of registered IP assets and transactions; the staking dashboard at
              staking.story.foundation is live. The Claude MCP integration bridges Story's protocol
              to Anthropic's Model Context Protocol, enabling LLM agents to transact IP via natural
