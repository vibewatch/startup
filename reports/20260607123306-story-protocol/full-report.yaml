              distributions from iconic music IP. Aria is the highest-disclosure ecosystem application and represents
              the most concrete proof of Story's licensing and royalty modules functioning in production for external
              users.

              MyShell, a generative AI agent platform with 5M+ total users and 170K active AI creators, partnered with
              Story Protocol via Ritual AI to allow its creators to host AI models on Ritual and register them as
              on-chain IP Assets on Story. The relationship is a partner integration, not a direct enterprise customer
              contract; Story Protocol is one layer in MyShell's infrastructure stack, and the fraction of MyShell's 5M
              users who actively interact with Story Protocol features is undisclosed.

              PiperX, an IPFi DEX, describes itself as an "ultimate liquidity layer for $61T IP assets on Story" but
