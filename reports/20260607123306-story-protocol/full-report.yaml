    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Platform, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Story Protocol is best understood in 2026 as a private, venture-backed layer-1 network and company
              ecosystem built around programmable intellectual property rather than as a consumer media app. The
              official homepage and documentation describe Story as AI-native infrastructure for the IP economy and a
              purpose-built blockchain for registering IP, attaching machine-readable usage terms, and routing royalties
              or attribution across derivative graphs. That framing points to an infrastructure business model: Story
              sells the chain, the legal-technical middleware, and the developer rails that let creators, data owners,
              and applications transact around rights-managed IP.


              The identity signals are clearer on product than on company basics. Public launch coverage in 2023 called
              Story a San Francisco-based startup, while 2024 Series B coverage called PIP Labs Palo Alto-based, and the
              current official site in the fetched set does not present a clean headquarters line. The safest synthesis
              is that Story has strong public evidence on product identity and stage—private, post-Series-B,
              post-mainnet, and token-live—but still leaves some legal-entity basics for confirmatory diligence.
