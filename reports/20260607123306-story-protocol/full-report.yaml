  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Investment Thesis
      - Action Implication
    rows:
      - - Enterprise revenue at zero after 24 months mainnet
        - No AI data licensing ARR disclosed by February 2027 (24 months post-mainnet)
        - Core revenue pivot to AI licensing fails; equity mark unsustainable at $2.25B without any revenue anchor
        - Exit or write-down; do not participate in any new round at current mark
      - - August 2026 unlock triggers token collapse
        - $IP price falls >50% within 30 days of August 2026 unlock
        - Insiders are distributing into weak demand; signals exit pressure rather than long-term conviction
        - Reduce position; request emergency board call; monitor for further founder selling
      - - Key man departure from founding team
        - Any of SY Lee, Jason Levy, or Jason Zhao departs within 18 months
        - Founder conviction signal breaks; institutional backers may reconsider; product roadmap disruption likely
        - Trigger board rights review; seek lock-up commitments for remaining founders
      - - Major AI lab builds or acquires competing IP registry
        - OpenAI, Google DeepMind, Anthropic, or Meta announces own on-chain or AI-native IP registry product
        - Largest potential enterprise customers become direct competitors; moat erodes; addressable market shrinks
        - Reassess bull-case probability from 10–15% to <5%; model acqui-hire scenarios only
      - - Adverse regulatory ruling on on-chain IP enforcement
        - >-
          EU AI Act enforcement action or U.S. federal court ruling directly invalidates blockchain-based IP licensing
          as legally enforceable
        - >-
          PIL framework loses legal backing; core product differentiation eliminated; reduces to pure infrastructure
          play
        - Immediate diligence re-opening; seek outside counsel opinion on cross-jurisdictional PIL enforceability
      - - Token price falls below $0.05
        - $IP spot price sustained below $0.05 for 30+ days
        - Foundation treasury depleted to <$5M; staking emissions become near-worthless; validator security degrades
        - >-
          Assess network security risks; explore whether equity capital can bridge treasury gap; consider distressed
          acquisition
    notes: >-
      Triggers are defined as falsifiable events, not probabilistic assessments. Monitoring frequency recommended:
      monthly for token price, quarterly for revenue confirmation attempts, semi-annually for regulatory scan.
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
      - CV039
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Workstream
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Enterprise Revenue
        - CFO-certified AI data licensing ARR or zero-revenue confirmation for the period February 2025 – June 2026
        - >-
          Without revenue data, the $2.25B equity mark cannot be reconciled with any public valuation signal; all
          scenarios are unbounded
        - >-
          PIP Labs CFO or auditor; request investor-grade financial model with actuals; signed data licensing contracts
          with aggregate value
      - - Token Vesting Schedule
        - >-
          Full per-party token vesting schedule for team, Series A investors, Series B investors, and KOL round; exact
          August 2026 unlock amounts by category
        - >-
          August 2026 unlock is the largest near-term supply shock; magnitude of sell pressure cannot be quantified
          without per-party schedules
        - PIP Labs CFO or legal counsel; cross-reference with published token distribution table
      - - Capital Runway
        - >-
          Current cash balance, monthly operating burn rate, and projected runway at multiple $IP price scenarios
          ($0.10, $0.30, $1.00)
        - >-
          Burn rate and runway determine whether equity capital can bridge the period until enterprise licensing revenue
          materializes
        - >-
          Request CFO-certified trailing-12-month P&L; bank statement or audited balance sheet; scenario analysis from
          management
      - - Protocol Adoption
        - >-
          Aggregate on-chain royalty volume, license minting volume, and active IP owner count since mainnet launch (Feb
          2025 – Jun 2026)
        - >-
          These are primary proxies for protocol adoption; absence makes it impossible to assess whether the licensing
          model creates economic value
        - >-
          Query Royalty Module and Licensing Module event logs via StoryScan or directly from engineering team; request
          StoryScan analytics report
      - - Legal Enforceability
        - >-
          Any legal opinion or court precedent confirming PIL-backed licenses are legally enforceable in at least one
          major jurisdiction (U.S., EU, or UK)
        - >-
          PIL framework is the core moat; without legal enforceability confirmation, the blockchain-legal bridge is
          theoretical
        - >-
          Outside IP counsel opinion on PIL enforceability; query AI Act compliance counsel; review any existing
          enforcement actions or dispute resolutions
      - - Competitive Positioning
        - >-
          Status of any enterprise discussions with top-10 AI labs or major media companies; confirmation of
          HarperCollins and Legendary/Goyer deal economics
        - >-
          Enterprise customers are the bull-case enabler; confidential partnership interest signals pipeline strength or
          weakness
        - Management reference calls with named enterprise partners; request redacted terms of any executed agreements
    notes: >-
      Diligence asks are listed in priority order; items 1–3 (revenue, vesting, runway) are blocking for any new capital
      deployment decision. Items 4–6 are material but can follow receipt of items 1–3.
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
