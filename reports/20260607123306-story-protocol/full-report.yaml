      - number: '3.4'
        title: Switching costs, multi-homing, and lock-in dynamics
        blocks:
          - type: paragraph
            body: >
              Story Protocol's switching costs are concentrated at the IP registration layer and in the derivative
              relationship graph. Once an IP owner registers an IP Asset on Story, licenses are minted as ERC721 NFTs
              anchored to that specific chain and module address; moving to a competing platform would require
              re-registration and loss of provenance history. The royalty vault and ancestry graph represent a material
              lock-in: downstream licensees hold ERC721 license NFTs pointing to Story's Royalty Module, and the
              cumulative royalty stack for a multi-level derivative IP tree has no portable representation on other
              chains without re-execution. Against this, multi- homing is plausible because Story's native token (IP) is
              listed on major centralized and decentralized exchanges, making liquidity available, and because EIP-2981
              on Ethereum remains a zero-friction alternative that many creators will prefer for simple cases.
              Traditional licensing via lawyers and private contracts remains the status-quo path for high-value deals
              where legal finality (court enforceability) matters more than automation. Story's Royalty Token mechanism
              creates an additional switching cost by allowing IP owners to sell future revenue streams as on-chain
              tokens—a form of "IPFi" that ties economic value to the Story chain. The staking mechanism, with minimum
              stake proposals dropping from 1024 IP to 32 IP (SIP-010, Jan 2026) to enable retail participation,
              increases community economic entanglement. The governance forum activity (SIP-009, Jan 2026, reducing
              token emissions from ~25M to 15.3M per year) suggests an active and responsive governance structure, but
              also signals that tokenomics are in flux, which can reduce lock-in confidence for institutional IP owners
              assessing long-term platform stability.
