  - id: FV001
    title: Recommendation Logic — From Evidence to Verdict
    type: flow
    layout: wide
    summary: >-
      Chains the key evidence threads (market opportunity, protocol proof, financials, competitive risk, valuation
      dislocation) through to the conditional hold/watch recommendation with defined gates for thesis confirmation or
      rejection.
    data:
      nodes:
        - id: market
          label: |-
            Market Opportunity
            $80T global IP market
            AI licensing catalyst
        - id: proof
          label: |-
            Protocol Proof
