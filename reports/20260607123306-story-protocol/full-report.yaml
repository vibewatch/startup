      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Story’s leadership story is founder-led, but the exact founder framing is not perfectly stable across
              sources. The 2023 launch press release and Variety both named Seung Yoon Lee, Jason Levy, and Jason Zhao
              as co-founders, while later secondary coverage often foregrounded only Lee and Zhao. The overlap matters
              more than the discrepancy: Lee is consistently the externally visible executive voice, launch materials
              tie him to Radish, and Zhao is repeatedly linked to DeepMind-related product work. Jason Levy appears
              prominently in the original launch materials because Story was initially pitched as a collaboration and
              rights layer for internet-native creative IP, not only as blockchain infrastructure.


              Functional coverage also looks deliberate. Launch materials named engineering, finance, growth, and design
              leaders with prior Flow, Harmony, Amazon, Radish, and Google backgrounds, which is useful
              founder-market-fit evidence for an IP protocol aimed at media, developers, and AI-linked workflows. The
              missing piece is governance. No fetched public source produced a current board roster, committee
              structure, or investor-control summary, so leadership visibility is good enough for team mapping but not
              yet sufficient for control diligence.
