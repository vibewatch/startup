      - number: '6.4'
        title: Retention, Durability, and Satisfaction — Absent Metrics, Structural Gaps
        blocks:
          - type: paragraph
            body: >
              Story Protocol does not publish—and has not disclosed—any traditional customer retention metrics: no NRR,
              GRR, cohort churn, contract renewal rate, or satisfaction score data is publicly available as of the run
              date. This absence is structurally expected for an L1 blockchain: retention in a permissionless crypto
              network is typically measured through proxy indicators such as daily active addresses, transaction volume,
              TVL, and fee revenue—all of which are weak as of early 2026.

              Daily revenue fell from $43,000 to $0 within five months of the September 2025 peak. Active wallet count
              and daily transaction volume on Story have not been independently published at granularity sufficient for
              cohort analysis. PiperX's $0 TVL as of June 2026 suggests the IPFi vertical has not attracted meaningful
              capital. Aria Protocol's 4,300+ users are the highest disclosed user count for any non-protocol
              application, but Aria's retention and revenue-per-user data are not public.

              For IP rightsholders, durability hinges on whether the Programmable IP License creates sufficient economic
              lock-in through automated royalty flows. The Royalty Module distributes shares to parent IP holders
              automatically, but without disclosed royalty payment volumes, real-world stickiness is unverifiable. The
              Story Foundation's Critics Guide blog acknowledges that off-chain royalty revenue cannot be enforced by
              the protocol itself, creating a structural durability risk: if the bulk of expected licensing value occurs
              off-chain, Story's protocol layer may never capture it as onchain revenue.
