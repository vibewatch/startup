      - number: '7.5'
        title: People, Execution, and Governance Risk
        blocks:
          - type: paragraph
            body: >-
              Story Protocol is founder-led, with Seung Yoon Lee as the primary external spokesperson and strategic
              representative. Lee's prior $440 million Radish exit establishes credibility, and he has demonstrated
              willingness to defend controversial decisions publicly (the token unlock delay). However, the board
              structure, investor control rights, and succession planning are not publicly documented. Engineering and
              technical leadership visibility is limited in public sources; the CTO function is not consistently
              disclosed, creating opacity around technical decision authority for a protocol whose core asset is its
              smart contract architecture.


              Story's PIL legal framework is a novel combination of blockchain smart contracts and conventional IP law,
              requiring specialized legal-technical expertise that is rare. Reliance on external IP counsel for PIL
              development introduces key-person advisory risk. Story's Critics Guide demonstrates sophisticated internal
              thinking about legal limitations, but external validation of the PIL by independent IP courts has not
              occurred. Business development for enterprise IP licensing involves long sales cycles and domain
              expertise; the HarperCollins deal demonstrates BD capacity but does not confirm a repeatable, scalable
              enterprise motion.


              The governance recalibrations documented in SIP-9 and SIP-10 — submitted January 2026 — show active
              community engagement, which is a positive governance indicator. However, both proposals involved
              substantive parameter changes (emissions rates, staking multipliers, threshold amounts) that suggest the
              initial tokenomics model was not fully validated before launch. Investors should assess whether future
              governance proposals could unilaterally alter economic parameters in ways adverse to their interests.
            claimRefs:
              - CR022
              - CR024
              - CR029
              - CR031
              - CR034
              - CR036
          - type: table
            tableRef: TR004
            claimRefs: []
      - number: '7.6'
        title: Mitigations, Monitoring Indicators, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Story's mitigations are uneven across its top risks. Smart contract security is best-covered: three
              independent audits, an active Immunefi bug bounty, and a modular architecture that allows future audit
              scoping as the royalty graph grows. The UMA Dispute Module provides an on-chain deterrent to IP misuse.
              The Critics Guide blog demonstrates institutional awareness of the key criticisms and a willingness to
              address them. SIP-9 and SIP-10 governance proposals show the community can coordinate on substantive
              parameter changes.


              The weakest mitigation coverage is on regulatory and legal risk. Story's IP token utility framing reduces
              securities law risk but is not supported by public securities counsel opinion. The PIL has not been tested
              in court. The MiCA White Paper addresses EU compliance intent but without external audit confirmation.
              Financial opacity (undisclosed runway, treasury, revenue) means investors cannot independently assess
              capital adequacy.


              Key monitoring indicators include: on-chain IP asset registration count (should exceed 10,000 new
              registrations within 12 months post-mainnet); daily on-chain revenue recovery above $5,000 on DeFiLlama
              (the $0 reading as of early 2026 is a red flag); validator count and top-10 stake concentration via the
              block explorer; IP token unlock adherence to the revised August 2026 schedule; any SEC, CFTC, or EU
              regulatory enforcement action naming analogous utility tokens; and HarperCollins integration depth versus
              a press-only partnership. Thesis-break triggers include: any court ruling rejecting PIL as enforceable in
              a target jurisdiction; any smart contract exploit causing material loss; failure to announce a second
              major enterprise partner within 12 months; or any SEC Wells Notice on the IP token. Diligence asks: obtain
              independent securities law opinion on IP token classification; confirm validator set composition and
              governance quorum thresholds; review audited financials or treasury confirmation; obtain external IP
              counsel validation of the PIL's cross-jurisdictional enforceability.
            claimRefs:
              - CR033
              - CR034
              - CR035
              - CR036
              - CR037
              - CR044
          - type: table
            tableRef: TR005
            claimRefs: []
      - number: '7.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Token Security Classification — No Public Legal Opinion
            body: >-
              Story has not publicly disclosed an independent securities law counsel opinion on IP token classification.
              Given the SEC's broad application of the Howey test to staking yield-bearing tokens, this is a material
              gap that should be closed before institutional capital deployment.
            calloutType: risk
            claimRefs:
              - CR038
              - CR007
          - type: callout
            title: PIL Enforceability Gap — Arbitration Not Adjudication
            body: >-
              The PIL resolves on-chain disputes through UMA arbitration, but cross-border royalty enforcement depends
              on local courts recognizing the PIL as an enforceable contract. No publicly confirmed court precedent
              exists. Investors should treat off-chain revenue enforcement as aspirational until a test case establishes
              precedent.
            calloutType: risk
            claimRefs:
              - CR011
              - CR012
              - CR013
          - type: callout
            title: Priority Diligence Asks for Investors
            body: >-
              Four diligence actions are blocking before committing capital: (1) independent securities law opinion on
              IP token classification, (2) audited financials or confirmed treasury runway, (3) external IP counsel
              validation of PIL cross-jurisdictional enforceability, and (4) validator set composition and governance
              quorum thresholds.
            calloutType: recommendation
            claimRefs:
