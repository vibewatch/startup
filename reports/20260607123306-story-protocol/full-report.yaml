              financial-model stress to date. CoinDesk reported that Story's daily on-chain revenue peaked at $43,000 in
              September 2025 and was at $0 at the time of the announcement, based on DeFiLlama data. Co-founder SY Lee
              publicly defended the delay, framing near-zero on-chain revenue as the wrong metric for an IP chain where
              gas fees are intentionally low and monetization is expected to accrue off-chain through licensing
              agreements. The first major team and investor token unlock was postponed to August 2026, extending the
              locked period while the team pivots toward AI training data licensing.


              The SIP-9 governance proposal exposed a structural emissions overshoot: the protocol was emitting
              approximately 25 million IP tokens per year — 27% above the 20 million target — because
              higher-than-anticipated block production (~13.14 million blocks per year vs. the designed 10.37 million)
              had not triggered an offsetting emissions adjustment. SIP-9 reduced annual emissions to 15.3 million and
              cut the locked staking multiplier from 0.5x to 0.025x, shifting staking rewards heavily toward unlocked
              token holders. These corrections realign incentives but introduce their own risks: the locked-staking
              reward reduction may reduce long-term network participation by early validator operators, and the overall
              emissions cut compresses annualized staking yields.


              Story has not publicly disclosed its treasury balance, operating runway, or revenue breakdown, making it
              impossible to assess capital adequacy from public evidence. Grayscale's Story Trust provides institutional
              price exposure but links IP token price performance to broader redemption dynamics. TVL remains modest on
              DeFiLlama relative to other post-Series-B L1 chains, and the token unlock delay itself confirms that
              adoption was below the threshold required for the original unlock schedule.
            claimRefs:
