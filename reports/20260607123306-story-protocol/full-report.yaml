  - id: FE002
    title: IP Registration and Licensing Workflow
    type: flow
    layout: standard
    summary: >
      End-to-end flow from creator IP registration through derivative licensing and automated royalty distribution on
      Story's mainnet.
    data:
      nodes:
        - id: n1
          label: Creator mints ERC-721 NFT
          detail: >
            Creator mints or uses existing ERC-721 NFT representing the IP work. NFT ownership equals IP ownership on
            Story.
          tone: neutral
        - id: n2
          label: Register NFT in IP Asset Registry
          detail: >
            Calling the IP Asset Registry deploys an IP Account smart contract (ERC-6551) uniquely identified by the
            ipId address.
          tone: positive
        - id: n3
          label: Attach PIL license terms
          detail: >
            Owner sets on-chain license terms (commercial use, minting fee, attribution requirement, revenue share %)
            via the Licensing Module.
          tone: positive
        - id: n4
          label: Licensee mints license token
          detail: >
            A third party pays the minting fee and receives a license token granting rights to use the IP per the
            attached PIL terms.
          tone: neutral
        - id: n5
          label: Derivative IPA registered (parent-child link)
          detail: >
            Licensee registers their derivative work as a new IPA linked to the parent, inheriting the royalty stack
            obligations.
          tone: neutral
        - id: n6
          label: Revenue generated by derivative
          detail: |
            The derivative work generates on-chain revenue in whitelisted tokens (e.g. WIP).
          tone: positive
        - id: n7
          label: Royalty Module routes revenue via IPGraph
          detail: >
            IPGraph precompile traverses the IPA ancestry tree; Royalty Module routes revenue to each ancestor's IP
            Royalty Vault per agreed split.
          tone: positive
        - id: n8
          label: IP holders claim from Royalty Vault
          detail: >
            Original creator and intermediate IP holders claim their proportional share from their IP Royalty Vault via
            the SDK or Protocol Explorer.
          tone: positive
      edges:
        - from: n1
          to: n2
          label: Register
        - from: n2
          to: n3
          label: Attach terms
        - from: n3
          to: n4
          label: License minted
        - from: n4
          to: n5
          label: Derivative created
        - from: n5
          to: n6
          label: Revenue generated
        - from: n6
          to: n7
          label: On-chain payment
        - from: n7
          to: n8
          label: Vault credited
    approximationNotes: >
      Flow represents the standard single-layer derivative use case from official Story docs. Multi-generation ancestry
      graphs follow the same pattern recursively. Dispute resolution is a parallel path not shown here. WIP ($IP
      Wrapped) is the primary whitelisted payment token.
    claimRefs:
      - CE001
      - CE004
      - CE007
      - CE008
      - CE032
