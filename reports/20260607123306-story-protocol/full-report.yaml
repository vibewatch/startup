      - number: '2.2'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Story's market has three primary buyer archetypes with distinct budget ownership and adoption triggers.
              The first is AI labs and machine learning companies, where the budget owner is the legal, compliance, or
              data-procurement team, the user is the ML researcher or data engineer, and the trigger is EU AI Act
              compliance or litigation risk avoidance. Story's whitepaper explicitly frames AI-to-AI licensing as a core
              use case: its Agent TCP/IP protocol enables autonomous AI agents to negotiate, license, and enforce IP
              agreements without human intermediaries, settling royalties on-chain in $IP tokens. The second archetype
              is the individual or studio-level creator—digital artists, musicians, writers, and game developers—who
              want automated attribution and royalties when their work is remixed or used commercially. Here the user
              and payer are the same person; budget ownership is informal (platform fees absorbed into revenue share),
              and the adoption trigger is the availability of user-facing tooling that makes on-chain registration as
              simple as a traditional upload. The Ippy NFT's 823,939 remixes on mainnet indicates early traction in this
              segment, though it represents a single showcased asset rather than broad commercial IP activity. The third
              archetype is DeFi and IPFi investors and developers, who treat IP assets as programmable financial
              primitives—fractionalizable, stakeable, and collateralizable—and whose budget ownership sits in treasury
              allocations or venture capital.

              Adjacent players define the substitutes buyers must assess before adopting Story. Ocean Protocol offers
              compute-to-data and decentralized data marketplaces; Molecule.xyz targets biomedical IP-NFTs; Zora and
              Manifold address digital creator tooling without a licensing layer; Audius competes in decentralized music
              streaming with on-chain attribution; and Royalty Exchange operates as an off-chain incumbent for music
              royalty trading. EIP-2981 provides an Ethereum standard for NFT royalty payment information but is opt-in
              and unenforced. The switching cost for a creator moving from these incumbents to Story is both technical
              (on-chain registration workflow) and legal (unfamiliarity with PIL terms), creating real adoption friction
              that current traction numbers reflect.
