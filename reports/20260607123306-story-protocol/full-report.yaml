  - id: FE001
    title: Story Protocol Product Architecture Stack
    type: stack
    layout: wide
    summary: >
      Six-layer architecture from consensus through applications, showing Story's EVM-compatible L1, Proof-of-Creativity
      modules, and developer tooling as of June 2026.
    data:
      layers:
        - label: Applications & Ecosystem
          modules:
            - IP Portal (story.foundation IP marketplace)
            - Protocol Explorer / Storyscan block explorer
            - Staking Dashboard (staking.story.foundation)
            - Claude MCP Integration (Anthropic Model Context Protocol)
        - label: Developer Tools / SDKs
          modules:
            - TypeScript SDK (storyprotocol/sdk — npm @story-protocol/core-sdk)
            - Python SDK (storyprotocol/python-sdk)
            - Periphery Contracts / SPG (storyprotocol/protocol-periphery-v1)
        - label: Proof-of-Creativity Modules (Solidity)
          modules:
            - Licensing Module (parent-child IPA relationships; PIL enforcement)
            - Royalty Module (IP Royalty Vault; Royalty Tokens; ancestry-graph routing)
            - Dispute Module (UMA oracle arbitration; 5 dispute tags)
            - Grouping Module (shared revenue pools across IPA collections)
            - Metadata Module (structured on-chain IP metadata)
        - label: IP Registry & Identity
          modules:
            - IP Asset Registry (ERC-721-linked IP identity; deploys IP Accounts)
            - IP Accounts (ERC-6551 token-bound accounts; stores licenses and royalties)
            - IPGraph Precompile (stateful EVM precompile for ancestry graph traversal)
        - label: Execution Layer
          modules:
            - Story Geth fork (EVM execution; go-ethereum fork; chain ID 1514 Homer mainnet)
            - ABCI++ Adapter (bridges EVM state to CometBFT via Engine ABI)
        - label: Consensus Layer
          modules:
            - CometBFT (BFT consensus; fast finality; Cosmos SDK fork by PIP Labs)
            - Validator Set (active stakers; managed via staking.story.foundation)
    approximationNotes: >
      Layer ordering reflects architectural dependency (bottom = foundational). Module list is based on official GitHub
      repositories and documentation as of June 2026. IP Vault and Confidential Data Rails are excluded from the stack
      because their production layer placement is unconfirmed.
