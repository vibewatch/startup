      - number: '4.2'
        title: Capital Structure, Token Economics, and Capital Adequacy
        blocks:
          - type: paragraph
            body: >-
              PIP Labs has raised a total of approximately $133.7 million in equity across four documented rounds, based
              on DefiLlama data and press coverage. The seed round of $29.3 million closed in May 2023 with a16z Crypto,
              Hashed, Samsung Next, Mirana Corp, Dao5, Two Small Fish Ventures, Berggruen Holdings, and SLVC as
              investors. The Series A of $27.5 million followed in September 2023 with many of the same investors plus
              Endeavor, Insignia Venture Partners, AllianceDAO, and Foresight Ventures. A KOL (Key Opinion Leader) round
              of $5 million closed in March 2024. The Series B, announced publicly at $80 million and led by a16z Crypto
              and Polychain Capital, closed in mid-2024 (DefiLlama records $71.9 million in August 2024; press reporting
              cited the announced $80 million figure). The Historical funding chronology is the domain of Chapter 1
              (Company Overview); this section focuses on the forward-looking capital adequacy derived from that base.

              The $IP token functions as a quasi-balance-sheet item for the Story ecosystem. The total supply is capped
              at 1 billion tokens, with approximately 360 million tokens (36% of total) in circulating supply as of June
              7, 2026. At the TGE in February 2025, initial circulating supply was approximately 250 million tokens
              (25%). The increase from 25% to 36% circulating represents unlock events and ecosystem incentives;
              however, team and investor tokens, originally scheduled to begin unlocking in February 2026, were delayed
              to August 2026 by PIP Labs leadership in response to public criticism about usage lag and concerns about
              sell pressure. The CoinDesk coverage in February 2026 explicitly cited "usage lags and dump fears" as the
              rationale, and a follow-up interview with the Story co-founder acknowledged the project needs "more time."

              Token market metrics as of June 7, 2026 represent a severe drawdown from the February 2025 launch levels.
              The $IP all-time high of $14.78 was recorded in February 2025 near the TGE and mainnet launch. As of the
              run date, $IP trades at approximately $0.30, a 97.9% decline from the ATH. Market capitalization stands at
              approximately $108.6 million; the fully diluted valuation (FDV) is approximately $314.5 million—implying
              that the market prices unlocked tokens at nearly the same level as locked ones, consistent with market
              skepticism about the unlock overhang scheduled for August 2026.

              Capital adequacy cannot be calculated without private disclosures. No burn rate, cash on hand, or runway
              figure has been published. At the gross level, approximately $133–142 million in equity was raised;
              subtracting three years of operational costs (engineering team, legal work on the PIL framework, security
              audits, validator incentives, BD) suggests runway is materially shorter than the initial equity suggested.
              The Story Foundation's 5% allocation (50 million tokens at $0.30 each) represents approximately $15
              million in token-denominated treasury at current prices—a fraction of what was implied at ATH pricing.
              This creates significant capital adequacy risk if token prices remain depressed through the August 2026
              unlock.
