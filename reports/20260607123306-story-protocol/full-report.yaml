  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Sizing Lenses, and the IP Asset Class
        blocks:
          - type: paragraph
            body: >-
              Story Protocol's operative market spans three overlapping demand pools. The first is AI training data
              licensing: AI labs and autonomous agents currently scrape internet content at scale without rights
              clearance, and the EU AI Act Article 53 now requires general-purpose AI providers to maintain copyright
              compliance policies for training data and publish a summary of training content—creating a direct
              regulatory driver for licensed data markets. WIPO has convened eleven sessions of its dedicated AI-and-IP
              Conversation, most recently on the infrastructure needed for "transparency, consent, and compensation" in
              the AI era, underscoring that the regulatory demand signal is global and institutionally recognized. The
              second pool is the creator economy: Goldman Sachs Research estimates the creator economy could approach
              $500 billion by 2027, and Story frames its Programmable IP License as the infrastructure layer enabling
              creators to monetize derivatives and collect royalties automatically. The third pool is IPFi—an emerging
              category where IP assets are fractionalized, collateralized, staked, or traded on-chain, analogous to how
              DeFi transformed financial assets.

              Story's own framing claims an "$80 trillion IP asset class" as the total addressable ceiling, citing the
              combined stock value of all intellectual property globally. This figure is not independently verifiable
              and has no CAGR, methodology, or analyst backing in the public record—it functions as a market-awareness
              framing rather than an underwriting-grade TAM. The token market's fully diluted valuation of approximately
              $312 million (CoinGecko, June 2026) provides a market-implied floor for the current proof-of-concept
              scale. The practical underwriting boundary should therefore be: AI training data licensing mandated or
              incentivized by regulation; creator-economy royalty and derivative monetization; and IPFi financial
              primitives built on top of the protocol—explicitly excluding traditional patent licensing, pharmaceutical
              IP transactions, and trademark enforcement, where Story has no product surface and where incumbent
              intermediaries hold deep moats.
