      - number: '6.5'
        title: Concentration Risk, Procurement Friction, Land-and-Expand Logic, and Adverse Evidence
        blocks:
          - type: paragraph
            body: >
              Story Protocol faces three distinct concentration risks. First, ecosystem application concentration: a
              substantial fraction of on-chain IP registrations may originate from the Ippy mascot and its
              derivatives—assets controlled by the Story Foundation itself. If Ippy-driven activity represents the
              majority of on-chain registrations, real third-party adoption is materially lower than headline numbers
              suggest. Second, investor and developer concentration: the team and investors control tokens locked
              through August 2026, with a16z leading the $80M Series B. Ecosystem grant dependency means application
              developers may be building primarily to capture grant incentives rather than because the protocol solves
              an immediately monetized pain point. Third, AI-pivot concentration: the team's stated shift toward AI data
              licensing concentrates the near-term customer thesis on enterprise deals that have not been disclosed.

              Procurement friction is high relative to traditional SaaS: users must hold $IP tokens, execute on-chain
              transactions, manage crypto wallets, and understand the Programmable IP License legal framework. Target AI
              customers have access to alternative data acquisition approaches—web scraping, direct licensing, closed
              datasets—that do not require blockchain infrastructure, and it is unclear whether Story's onchain approach
              offers sufficient differentiation to overcome that friction.

              The land-and-expand logic requires: (1) ecosystem developers build applications → (2) those apps attract
              end users who register IP → (3) AI companies pay to license registered IP → (4) royalty flows generate
              protocol revenue and creator retention. Steps 1–2 show early ecosystem signals; steps 3–4 remain
              aspirational. The adverse evidence is substantial: $0 daily revenue, a six-month token unlock delay
              described as addressing "usage lags," and no named enterprise AI licensing customers publicly announced.
