  - id: TE002
    title: Story Protocol Workflow / Use-Case Table
    columns:
      - User Job
      - Current Workflow (Without Story)
      - Story Solution
      - Measurable Benefit (Claimed)
      - Key Limitation
    rows:
      - - Register and protect IP
        - Copyright filing, legal retainer, weeks of process
        - Mint ERC-721 NFT → register in IPA Registry → attach PIL terms
        - Minutes to register; no lawyer required for basic licensing terms
        - PIL court-enforceability untested; does not replace formal copyright registration
      - - License IP for derivative use
        - Negotiate contracts, draft licenses, engage lawyers
        - Licensee mints license token from parent IPA (paying any minting fee); derivative link recorded on-chain
        - Automated attribution and minting fee collection; transparent on-chain record
        - Royalty stack depth can compound costs; payer must use whitelisted tokens (e.g. WIP)
      - - Claim revenue from derivative works
        - Track downstream usage, invoice manually, rely on PROs
        - IP Royalty Vault auto-collects; rights holders claim pro-rata share via SDK
        - Programmatic revenue without invoicing; composable with DeFi via WIP token
        - Token whitelist controlled by protocol governance; limited to on-chain payers
      - - Dispute IP infringement on-chain
        - DMCA takedown or litigation; expensive, slow
        - Submit dispute tag → UMA oracle arbitration → on-chain penalty applied if upheld
        - Lower cost than legal action; outcome enforced at protocol layer
        - No published case history; UMA oracle dependency; on-chain finality is double-edged
      - - License IP for AI training data
        - No standard consent or attribution rails; licensing ad hoc or absent
        - Attach commercial PIL → AI trainer mints license token → royalty flows on revenue generated
        - Machine-readable consent and on-chain revenue attribution without intermediaries
        - AI model's actual use of licensed data is not verifiable on-chain; enforcement limited
      - - Build AI-agent IP workflows
        - Manual API calls, custom integrations, no protocol-level composability
        - Claude MCP integration enables LLM agents to transact IP via natural-language instructions
        - Zero-friction IP operations for AI agents; composable with broader agent ecosystem
        - Beta integration; production reliability and edge-case behavior not independently verified
    notes: >
      Benefits are company-claimed or inferred from official documentation and blog posts; no independent case studies
      with quantified outcomes were available for review. Limitations reflect material gaps identified through evidence
      review and adversarial analysis.
