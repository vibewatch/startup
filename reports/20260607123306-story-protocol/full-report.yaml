      - number: '3.2'
        title: Competitor profiles, scale, and strategic direction
        blocks:
          - type: paragraph
            body: >
              Ocean Protocol is the closest analogue to Story on the pure on-chain IP/data licensing dimension but is
              structurally distinct. It uses ERC721 Data NFTs to represent data ownership and ERC20 Datatokens as
              access-control permissions, with Compute-to-Data enabling privacy-preserving remote computation on
              encrypted datasets. Its OCEAN token traded at approximately -94% below its all-time high as of the
              research date and commands a market cap near $21.7M with an FDV of $29M, indicating that the token market
              has not validated the data-marketplace thesis at the valuations of early backers. Manifold is a
              sub-10-person team building NFT smart contract infrastructure on Ethereum, backed by a16z crypto and
              Initialized Capital, and its products power major creator launches for Beeple, Jay-Z, SiA, Adidas,
              Fortune, and Mercedes-AMG. Its mission statement— "creative sovereignty is essential in the age of AI and
              digital abundance"—overlaps conceptually with Story Protocol's rationale, but Manifold does not offer a
              legally-backed off-chain license framework and focuses on minting and distribution rather than a licensing
              registry. Molecule Protocol focuses exclusively on biomedical IP-NFTs for drug-discovery funding rounds, a
              niche vertical with different buyers, economics, and regulatory surfaces from Story Protocol's creator and
              AI training data focus. Metaplex is Solana's primary NFT/token infrastructure provider, offering
              production-ready smart contracts for NFTs, fungible tokens, and an AI agent registry— but it is not an IP
              licensing platform and is limited to the Solana ecosystem. Story Protocol itself has raised approximately
              $134M across four rounds per DeFiLlama data, including a16z crypto, Polychain Capital, Hashed, and Samsung
