        - label: Sep 2025 — Peak daily revenue (DeFiLlama)
          value: 43000
        - label: Feb 2026 — Token unlock delay announced
          value: 0
    approximationNotes: >-
      Data points from CoinDesk (Feb 2026) citing DeFiLlama: peak ($43K, Sep 2025) and current ($0, Feb 2026) are
      verified; the mainnet launch (Feb 2025, $0) is inferred as the baseline. Intermediate months excluded due to
      unavailable granularity. Revenue represents daily onchain gas/fee revenue, not off-chain licensing.
