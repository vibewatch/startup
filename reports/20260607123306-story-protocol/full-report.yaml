      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory compulsion is the primary near-term driver
            body: >-
              EU AI Act Article 53 creates a hard-law obligation for GPAI providers to comply with copyright on training
              data and publish training data summaries. This regulatory trigger is more durable than organic creator
              adoption because it creates legal liability, not just opportunity. Story's biggest near-term customer
              prospect is any AI lab with EU market exposure that needs a documented, automated rights-clearance
              mechanism.
            calloutType: insight
            claimRefs:
              - CM001
              - CM007
              - CM049
          - type: callout
            title: Token price and usage lag are material adverse signals
            body: >-
              The $IP token's -97.9% drawdown from ATH and the February 2026 token unlock delay driven by usage lags are
              direct adverse signals for adoption velocity. Weak token economics reduce creator incentives to accept $IP
              as royalty currency and reduce developer incentives to build on Story. Underwriting should treat current
              usage data as a leading indicator and request on-chain activity metrics before relying on the
              network-effects thesis.
            calloutType: risk
            claimRefs:
              - CM028
              - CM030
              - CM031
              - CM032
              - CM033
          - type: callout
            title: The "$80 trillion" TAM is a marketing claim, not an underwriting figure
            body: >-
              Story's signature market claim—the "$80 trillion IP asset class"—has no third-party methodology, no CAGR,
              and conflates stock value of all global intellectual property with an addressable market for Story's
              specific infrastructure product. Grayscale restates it but adds no independent validation. Investors
              should anchor on Goldman Sachs' $500B creator economy estimate and the EU AI Act compliance demand as
              bounded, evidence-supported sizing inputs.
            calloutType: risk
            claimRefs:
              - CM003
