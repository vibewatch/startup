    title: Customer Segments and Adoption Surfaces
    type: journey-map
    layout: wide
    summary: >
      Story Protocol's customer journey starts with ecosystem developers building IP-native applications, then relies on those
      apps to attract IP rightsholders and end users, with AI enterprise licensing as the aspirational monetization endpoint.
    data:
      nodes:
        - label: Ecosystem Developers
          description: Build dApps using Story SDK; pay gas fees in $IP; supported by Foundation grants
        - label: IP Rightsholders / Creators
          description: Register IP onchain; set licensing terms via Programmable IP License; earn automated royalties
        - label: End Users / Fans
          description: Remix, license, and consume IP through ecosystem apps (Aria, MyShell, PiperX)
        - label: AI Data Consumers
          description: License rights-cleared human-generated datasets for model training (aspirational enterprise customers)
        - label: Institutional / RWA Investors
          description: Purchase IPRWA tokens (e.g. Aria $APL) linked to royalty-yielding iconic IP assets
        - label: DeFi / IPFi Participants
          description: Trade tokenized IP assets via IPFi DEXes; provide liquidity to IP asset pools
    approximationNotes: "Journey nodes are based on documented protocol design (Story Foundation whitepaper, docs) and observed ecosystem application behavior; enterprise AI licensing node is aspirational as of June 2026."
    claimRefs: [CU001, CU002, CU003, CU004, CU006]

