company:
  name: Story Protocol

chapter:
  number: 6
  title: Customers
  summary: >
    Story Protocol's "customers" are predominantly ecosystem application developers, IP rightsholders, and AI data consumers
    who build on or register into its L1 blockchain infrastructure—not traditional enterprise SaaS clients paying recurring fees.
    Named ecosystem partners include Aria Protocol (IP real-world assets, $10.95M raised, 4,300+ users), MyShell (5M+ end users
    via an AI agent platform partner), Ritual AI (AI model IP registration), and PiperX (IPFi DEX, $0 TVL). On-chain metrics
    reveal a steep adoption challenge: daily revenue peaked at $43,000 in September 2025 and fell to $0 by February 2026 per
    DeFiLlama, prompting a six-month token unlock delay. The team attributes near-zero gas revenue to an intentionally low-fee
    design and a strategic pivot toward off-chain enterprise AI data licensing—a thesis that remains unproven with zero named
    enterprise customers as of the run date. No NRR, GRR, or churn data is publicly available.

sections:
  - id: customer-base-segmentation
    title: "Customer Base — Ecosystem Builders, IP Rightsholders, and AI Data Consumers"
    body: >
      Story Protocol does not operate a traditional B2B or B2C SaaS business with named enterprise clients, signed contracts, or
      disclosed recurring revenue metrics. Its primary participants are three loosely defined cohorts. First, ecosystem application
      developers who deploy smart-contract-based products on the Story L1 and use the Proof-of-Creativity SDK to register and
      license IP assets. Second, individual or institutional IP rightsholders—creators, musicians, dataset providers, entertainment
      studios, and biomedical researchers—who register their IP onchain to automate licensing and royalty collection. Third, AI
      data consumers—model developers and foundation-model companies—who seek rights-cleared, legally attributed datasets for
      training without the friction of bespoke licensing agreements.

      Story's homepage explicitly targets six customer verticals: AI companies needing uncrawlable, IP-safe datasets for physical
      AI; data providers enabling permissionless licensing; biomedicine and patents for tokenizing research and automating
      royalties; institutional funds for trading and restaking tokenized IP portfolios; brands and entertainment capturing and
      monetizing viral fan moments; and individual creators registering and monetizing IP in seconds. In practice, public evidence
      of production traction is concentrated in the first category—ecosystem app developers—while activity in the other five
      verticals remains nascent or company-claimed.

      The buyer-payer model differs from conventional software: developers pay gas fees in $IP tokens; IP rightsholders pay nothing
      to register but automatically share royalties with the protocol; AI consumers are expected to pay via on-chain licensing
      agreements once enterprise deals close. Co-founder SY Lee stated in February 2026 that near-zero onchain gas revenue is
      "the wrong metric" because the intended monetization occurs through off-chain licensing agreements. As of the run date, no
      such enterprise licensing revenues are publicly documented and Story's strategic pivot toward AI data licensing concentrates
      the monetization thesis on deals not yet disclosed.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007]
    tableRefs: [TU001]
    figureRefs: [FU001]

  - id: named-ecosystem-partner-evidence
    title: "Named Ecosystem Application Evidence — Partner Proof vs. Paying-Customer Proof"
    body: >
      Story Protocol publicly lists more than 12 applications as live on mainnet in its ecosystem directory, spanning DeFi/IPFi,
      AI, consumer, and infrastructure categories. The strongest evidence of real usage comes from three applications.

      Aria Protocol is an IP real-world asset (IPRWA) platform built natively on Story. Its website reports raising $10.95M via
      StakeStone, tokenizing partial rights to 48 iconic IP assets with a projected 5–8% annualized yield, and attracting over
      4,300 users. Aria's $APL token links holders to royalty distributions from iconic music IP. Aria is the highest-disclosure
      ecosystem application and represents the most concrete proof of Story's licensing and royalty modules functioning in
      production for external users.

      MyShell, a generative AI agent platform with 5M+ total users and 170K active AI creators, partnered with Story Protocol
      via Ritual AI to allow its creators to host AI models on Ritual and register them as on-chain IP Assets on Story. The
      relationship is a partner integration, not a direct enterprise customer contract; Story Protocol is one layer in MyShell's
      infrastructure stack, and the fraction of MyShell's 5M users who actively interact with Story Protocol features is
      undisclosed.

      PiperX, an IPFi DEX, describes itself as an "ultimate liquidity layer for $61T IP assets on Story" but reports $0 TVL as
      of June 2026. Numo AI (targeting neurodivergent users) announced a June 2026 launch. David Goyer serves as an adviser and
      announced a blockchain-native sci-fi franchise concept; this is advisory/concept stage, not a production deployment.

      All named ecosystem applications are best characterized as "ecosystem partner proof" rather than "traditional paying
      enterprise customer proof." Revenue flows through token-based gas fees and automated royalty splits, not contract-based
      SaaS fees. Story Foundation controls 58.4% of initial $IP supply for ecosystem and community incentives, and much of the
      early application development is likely incentive-subsidized.
    claimRefs: [CU008, CU009, CU010, CU011, CU012, CU013, CU014, CU015, CU016, CU017, CU018, CU019, CU020]
    tableRefs: [TU003]
    figureRefs: [FU003]

  - id: adoption-trajectory-onchain-metrics
    title: "Adoption Trajectory and On-Chain Metrics"
    body: >
      Story Protocol launched its mainnet in February 2025 and debuted the $IP token with an initial 25% unlock of the
      1-billion-token supply, with 58.4% allocated to ecosystem, community, and foundation incentives. On-chain adoption metrics
      present a mixed picture.

      On the positive side, Story's homepage claims 823,939 derivative remixes of the Ippy mascot IP asset—a company-owned
      character seeded with an open-source Programmable IP License to demonstrate the remix-royalty mechanism. The protocol's
      GitHub organization hosts 53 public repositories as of May 2026, with the TypeScript SDK accumulating 109 stars and 71
      forks. The deployed smart contracts—including IP Asset Registry, Royalty Module, Dispute Module, and Licensing Module—
      are verified on-chain with public addresses, indicating a production-grade protocol stack.

      On the negative side, daily onchain revenue peaked at $43,000 in September 2025 and fell to $0 by early February 2026 per
      DeFiLlama as cited by CoinDesk. Story co-founder SY Lee acknowledged the near-zero gas revenue in a February 2026 CoinDesk
      interview, framing it as consistent with Story's low-fee IP chain design and arguing that expected monetization occurs
      off-chain. The team and investor token unlock was delayed from February 2026 to August 2026, with the team citing the need
      for "more time" to build network usage—a decision that observers interpreted as a response to weak adoption signals and
      investor dump fears.

      The Ippy remix count is the most-cited adoption signal but should be treated cautiously: Ippy is a Story Foundation-owned
      IP seeded under a permissionless open license, making it an internally controlled metric rather than a third-party adoption
      indicator. No independent audit of the 823,939 figure has been published.
    claimRefs: [CU021, CU022, CU023, CU024, CU025, CU026, CU027, CU028, CU029, CU030]
    tableRefs: [TU002]
    figureRefs: [FU002, FU004]

  - id: retention-durability-satisfaction
    title: "Retention, Durability, and Satisfaction — Absent Metrics, Structural Gaps"
    body: >
      Story Protocol does not publish—and has not disclosed—any traditional customer retention metrics: no NRR, GRR, cohort churn,
      contract renewal rate, or satisfaction score data is publicly available as of the run date. This absence is structurally
      expected for an L1 blockchain: retention in a permissionless crypto network is typically measured through proxy indicators
      such as daily active addresses, transaction volume, TVL, and fee revenue—all of which are weak as of early 2026.

      Daily revenue fell from $43,000 to $0 within five months of the September 2025 peak. Active wallet count and daily
      transaction volume on Story have not been independently published at granularity sufficient for cohort analysis. PiperX's
      $0 TVL as of June 2026 suggests the IPFi vertical has not attracted meaningful capital. Aria Protocol's 4,300+ users are
      the highest disclosed user count for any non-protocol application, but Aria's retention and revenue-per-user data are not
      public.

      For IP rightsholders, durability hinges on whether the Programmable IP License creates sufficient economic lock-in through
      automated royalty flows. The Royalty Module distributes shares to parent IP holders automatically, but without disclosed
      royalty payment volumes, real-world stickiness is unverifiable. The Story Foundation's Critics Guide blog acknowledges that
      off-chain royalty revenue cannot be enforced by the protocol itself, creating a structural durability risk: if the bulk of
      expected licensing value occurs off-chain, Story's protocol layer may never capture it as onchain revenue.
    claimRefs: [CU031, CU032, CU033, CU034, CU035, CU036]
    tableRefs: [TU004]

  - id: concentration-risk-adverse-evidence
    title: "Concentration Risk, Procurement Friction, Land-and-Expand Logic, and Adverse Evidence"
    body: >
      Story Protocol faces three distinct concentration risks. First, ecosystem application concentration: a substantial
      fraction of on-chain IP registrations may originate from the Ippy mascot and its derivatives—assets controlled by the
      Story Foundation itself. If Ippy-driven activity represents the majority of on-chain registrations, real third-party
      adoption is materially lower than headline numbers suggest. Second, investor and developer concentration: the team and
      investors control tokens locked through August 2026, with a16z leading the $80M Series B. Ecosystem grant dependency means
      application developers may be building primarily to capture grant incentives rather than because the protocol solves an
      immediately monetized pain point. Third, AI-pivot concentration: the team's stated shift toward AI data licensing
      concentrates the near-term customer thesis on enterprise deals that have not been disclosed.

      Procurement friction is high relative to traditional SaaS: users must hold $IP tokens, execute on-chain transactions,
      manage crypto wallets, and understand the Programmable IP License legal framework. Target AI customers have access to
      alternative data acquisition approaches—web scraping, direct licensing, closed datasets—that do not require blockchain
      infrastructure, and it is unclear whether Story's onchain approach offers sufficient differentiation to overcome that
      friction.

      The land-and-expand logic requires: (1) ecosystem developers build applications → (2) those apps attract end users who
      register IP → (3) AI companies pay to license registered IP → (4) royalty flows generate protocol revenue and creator
      retention. Steps 1–2 show early ecosystem signals; steps 3–4 remain aspirational. The adverse evidence is substantial:
      $0 daily revenue, a six-month token unlock delay described as addressing "usage lags," and no named enterprise AI
      licensing customers publicly announced.
    claimRefs: [CU037, CU038, CU039, CU040, CU041, CU042, CU043, CU044]
    tableRefs: [TU005]
    figureRefs: []

