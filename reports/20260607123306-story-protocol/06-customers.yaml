callouts:
  - calloutType: risk
    title: Near-Zero On-Chain Revenue and Token Unlock Delay Are Adverse Adoption Signals
    body: >
      Story Protocol's daily onchain revenue fell from a $43,000 peak (September 2025) to $0 by February 2026. The founding team
      responded by delaying the first major team/investor token unlock by six months (to August 2026), citing "more time" to build
      network usage. The co-founder frames near-zero gas revenue as expected for a low-fee IP chain, but this explanation is not
      independently verifiable and leaves investors without a clear revenue proxy metric. Ecosystem applications like PiperX report
      $0 TVL, and no enterprise AI licensing customer has been publicly named. Investors should treat this as a high-severity
      adoption risk and demand an alternative revenue metric framework before the next unlock event.
    claimRefs: [CU025, CU026, CU027, CU028, CU029, CU038, CU039, CU043]

  - calloutType: insight
    title: Ecosystem Proof Is Real but Concentrated in Grant-Dependent Applications
    body: >
      Story Protocol has genuine ecosystem traction through Aria Protocol (4,300+ users, $10.95M raised) and the MyShell/Ritual
      AI partnership (5M+ users at partner layer). However, both are ecosystem partner relationships, not enterprise customer
      contracts. The Story Foundation controls 58.4% of $IP supply for ecosystem incentives, creating a material risk that early
      application activity is grant-subsidized rather than organically monetized. Due diligence should distinguish sharply
      between ecosystem-incentive-driven activity and organic, self-sustaining customer traction.
    claimRefs: [CU008, CU009, CU010, CU011, CU012, CU036, CU037, CU041]

  - calloutType: assumption
    title: Off-Chain Enterprise AI Licensing Is the Core Monetization Thesis but Remains Unproven
    body: >
      The team's stated strategy pivots Story's customer thesis toward enterprise licensing of rights-cleared AI training datasets.
      If correct, onchain gas revenue is structurally a poor proxy for business health. However, as of June 2026, no enterprise
      AI licensing customers have been disclosed, no off-chain licensing volumes have been shared, and off-chain revenue cannot
