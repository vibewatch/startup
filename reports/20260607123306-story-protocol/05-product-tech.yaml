callouts:
  - calloutType: strength
    title: Multi-Firm, Multi-Methodology Pre-Mainnet Security Program
    body: >
      Story ran two formal audit rounds with specialist firms (SlowMist, Fuzzland, Halborn,
      FuzzingLabs with bespoke IPGraph fuzzer, Trust Security as repeat independent reviewers),
      followed by a $1M public audit contest (977 submissions, 19 High findings remediated),
      and a live $600K Immunefi bug bounty. This is a materially stronger pre-launch security
      posture than most comparable L1 launches.
    claimRefs:
      - CE016
      - CE017
      - CE018

  - calloutType: risk
    title: PIL Legal Enforceability and Novel IPGraph Precompile Are Structural Untested Risks
    body: >
      Two structural risks are not resolvable by the current security program alone. The PIL
      has no court-tested enforceability against non-consenting parties, and on-chain protocol
      penalties are not legal remedies. The IPGraph precompile is a custom EVM addition with
      limited external review precedent; FuzzingLabs' purpose-built fuzzer provides strong
      fuzz coverage but is not a substitute for independent architectural review by a firm
      with prior precompile experience. Both risks require proactive legal testing and
      continued external security investment to narrow.
    claimRefs:
      - CE005
      - CE006
      - CE039
      - CE040

