chapter:
  number: 5
  title: Product & Technology
  summary: >
    Story Protocol delivers a purpose-built layer-1 blockchain pairing EVM execution (Geth fork)
    with CometBFT consensus, atop which its Proof-of-Creativity smart contract suite provides
    programmable IP registration, licensing, royalty distribution, and on-chain dispute resolution.
    Developer evidence is strong: TypeScript and Python SDKs, periphery batching contracts, a
    public audit contest (977 submissions, $1M prize pool), and a $600K Immunefi bug bounty anchor
    its security posture. The novel IPGraph precompile, the PIL's untested legal enforceability,
    and a February 2026 token-unlock delay citing usage below expectations are the leading
    technical and commercial risk signals.

sections:
  - id: product-definition-and-customer-workflows
    title: Protocol Product Definition and Customer Workflows
    body: |-
      Story Protocol's core product is a blockchain infrastructure platform that transforms static
      intellectual property into programmable, on-chain assets. Official documentation describes
      Story as a "purpose-built layer-1 blockchain for intellectual property" that makes IP
      registration, licensing, and royalty attribution as simple as an API call. In practical
      terms, a creator or rights holder mints an ERC-721 NFT to represent their work, registers
      that NFT in Story's IP Asset Registry (which deploys a smart-contract IP Account for the
      asset), and attaches machine-readable usage terms via the Programmable IP License (PIL).
      The PIL is not a synthetic construct: it is a real off-chain legal document grounded in
      US copyright law, created by Story's legal team with expert counsel, whose terms — commercial
      use, minting fee, derivatives attribution, revenue share percentage — have been mapped to
      Solidity structs for on-chain enforcement.

      The resulting IP asset is programmable: other parties can mint license tokens (paying any
      minting fee set by the owner), create registered derivative works linked to the parent,
      and have royalties automatically routed through the ancestry graph. The PIL supports
      multiple flavors including non-commercial social remixing and commercial revenue-sharing
      configurations. The whitepaper frames Story's addressable market as "AI-native infrastructure
      for the IP economy," and the Claude Model Context Protocol (MCP) integration — enabling LLM
      agents to register IP, mint licenses, and claim royalties via natural language — demonstrates
      this framing in practice. HarperCollins' announced partnership and the ecosystem's AI and
      consumer verticals (soloai, Verio, PiperX, ip.world, Mimboku) confirm that Story is
      targeting both traditional IP owners and AI-native creators. The License Template abstraction
      within the protocol allows future legal-technical license standards beyond the PIL to be
      added, though PIL is currently the only active template on mainnet.
