        - Voluntary program; network-wide coverage of all ecosystem projects not guaranteed
      - - MiCA White Paper published
        - Disclosed (footer link on story.foundation)
        - EU regulatory disclosure requirement for crypto-asset issuers
        - Disclosure advisory only; not a regulatory approval or license
      - - PIL legal enforceability
        - Claimed (legal counsel-backed creation)
        - US copyright law-backed off-chain license with on-chain term mapping
        - No known court test of enforceability against a non-consenting party; cross-jurisdiction validity unverified
    notes: >
