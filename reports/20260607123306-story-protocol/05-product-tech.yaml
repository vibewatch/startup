  - id: differentiation-risks-and-open-gaps
    title: Differentiation, Technical Risks, and Open Gaps
    body: |-
      Story's primary technical differentiators are the PIL as a legally-grounded,
      machine-readable license template (currently the only such template on the protocol,
      though the License Template abstraction allows future additions), the IPGraph precompile
      enabling royalty and licensing calculations across deep derivative trees at L1 cost, and
      the convergence of EVM compatibility with CometBFT finality that enables fast cheap IP
      transactions while preserving developer familiarity. The Claude MCP integration extends
      differentiation into AI-agent workflows, a structurally high-growth market.

      The principal technical risks are substantial. The IPGraph precompile is a novel, custom
      addition to go-ethereum's EVM that lacks the extensive independent review lineage of core
      Ethereum code; although FuzzingLabs built purpose-specific tooling, novel precompiles
      accumulate bespoke attack surface. The Cosmos SDK fork must track upstream security patches
      from PIP Labs, creating a single-team maintenance dependency. The UMA oracle powering the
      Dispute Module is a third-party availability and liquidity dependency: downtime or
      manipulation could stall or corrupt dispute resolution. The PIL's legal enforceability
      against non-consenting parties in court — and its cross-jurisdiction validity — remains
      untested. Finally, the February 2026 announcement of a delayed $IP token supply unlock,
      citing usage below expectations, is an adverse signal that commercial adoption velocity
      has not yet matched technical delivery. IP Vault and Confidential Data Rails were announced
      in 2025 but their production readiness remains publicly unconfirmed as of June 2026,
      representing open diligence gaps for the next-stage review.
    claimRefs:
      - CE023
      - CE024
      - CE029
