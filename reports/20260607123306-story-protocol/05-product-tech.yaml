  - id: TE003
    title: Story Network Technical Architecture Table
    columns:
      - Layer / Component
      - Role
      - Key Dependency
      - Risk
    rows:
      - - CometBFT consensus (piplabs/story)
        - BFT finality; ~1-2s block time target
        - Cosmos SDK fork maintained by PIP Labs
        - Diverges from upstream Cosmos SDK; PIP Labs owns all maintenance and patch decisions
      - - Geth execution client (piplabs/story-geth)
        - EVM-compatible transaction execution; hosts all deployed contracts
        - Upstream go-ethereum fork
        - Must track upstream go-ethereum security patches; fork divergence creates lag risk
      - - ABCI++ adapter
        - Bridges EVM execution state to CometBFT; relays blocks via Engine ABI
        - Custom implementation in story client codebase
        - Single-team implementation; limited external review lineage prior to mainnet v1
      - - IPGraph precompile
        - Stateful in-EVM precompile for IP ancestry graph traversal at marginal cost
        - Custom addition to go-ethereum; requires Geth and consensus client alignment
        - Novel precompile with limited external review precedent; custom fuzzer required for coverage
      - - IP Asset Registry + IP Account (ERC-6551)
        - Core IP identity layer; deploys per-IPA smart contract accounts (ipId)
        - ERC-6551 token-bound account standard
        - ERC-6551 tooling and wallet support still maturing in broader ecosystem
      - - Proof-of-Creativity smart contracts (Solidity)
        - "Core protocol logic: Licensing, Royalty, Dispute, Grouping, Metadata modules"
        - Story Network L1 for deployment; IPGraph precompile for royalty graph queries
        - Upgradeable proxy architecture requires careful governance of upgrade keys
      - - UMA oracle (Dispute Module)
        - External arbitration source for IP dispute resolution
        - UMA protocol availability, liquidity, and governance
        - Oracle manipulation risk; UMA downtime stalls dispute resolution
      - - IP Royalty Vault (per-IPA)
        - Revenue custody and distribution for each IP asset
        - On-chain Solidity contract; governance-whitelisted payment token list
        - Restricted to whitelisted tokens; token governance is a centralization control point
      - - Periphery contracts / SPG (protocol-periphery-v1)
        - Batches multi-step workflows into single transactions; Multicall3 also supported
        - protocol-core-v1 as upstream dependency
        - Core breaking changes require periphery rewrites; version-skew risk
      - - TypeScript SDK / Python SDK
        - Developer API layer abstracting direct contract calls
        - npm / PyPI package registries; story client RPC endpoints
        - SDK version skew vs. chain state; backward-compatibility guarantees not publicly documented
    notes: >
      Dependency and risk assessments are derived from official GitHub repositories
      (piplabs/story README, protocol-core-v1 README), the security-recap-mainnet blog post
      (retrieved via Wayback Machine), and analytic inference. Risk severity is analytic judgment;
      no independent architecture review or penetration test result was available.
      Node hardware requirements from piplabs/story repository.
