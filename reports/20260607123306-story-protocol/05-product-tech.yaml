        - QE018

    - id: CE003
      statement: >
        Story's Proof-of-Creativity (PoC) protocol is a suite of Solidity smart contracts deployed
        natively on Story Network that enables on-chain IP registration, licensing, royalty
        distribution, dispute resolution, IP grouping, and metadata management.
      type: observed
      topic: architecture
      sourceRefs:
        - SE016
        - SE011
      confidence: medium
      freshness: current
