    - id: CE004
      statement: >
        Each IP asset on Story is represented by an ERC-721 NFT; registering the NFT in the
        IP Asset Registry deploys an IP Account (ERC-6551 token-bound smart contract) that
        serves as the IP asset's unique on-chain identity (ipId) and stores its associated
        licenses, royalties, and metadata.
