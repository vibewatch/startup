    - id: CE002
      statement: >
        Story Network decouples EVM execution (a go-ethereum/Geth fork) from consensus (CometBFT
        via a Cosmos SDK fork), connecting them via the Engine ABI and an ABCI++ adapter so that
        consensus throughput is not bottlenecked by EVM transaction execution.
      type: observed
      topic: architecture
      sourceRefs:
        - SE017
        - SE016
      confidence: medium
      freshness: current
      answersQuestionRefs:
