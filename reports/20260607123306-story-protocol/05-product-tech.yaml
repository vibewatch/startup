    - id: CE001
      statement: >
        Story Protocol is an IP infrastructure platform whose core product is a blockchain system
        for on-chain IP registration, licensing, and royalty automation targeting creators,
        AI developers, and traditional IP owners as primary workflow beneficiaries.
