  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - driver/constraint
      - direction
      - timing
      - implication
      - diligence ask
    rows:
      - - EU AI Act Article 53 copyright compliance mandate for GPAI providers
        - driver
        - Current; EU AI Act entered into force July 2024 with phased compliance through 2026
        - Hard-law requirement for AI labs to document and license training data creates a direct pull for rights-cleared data markets; Story's Licensing Module is a potential compliance infrastructure layer
        - Confirm whether any GPAI provider has formally adopted Story or a competing on-chain solution; verify PIL meets EU standard for "reservation of rights" compliance
      - - AI copyright litigation wave (music publishers, news organizations, stock image agencies vs. AI labs)
        - driver
        - Current and accelerating through 2026
        - Litigation risk increases the cost of unlicensed training data and incentivizes voluntary licensing; validates Story's stated market problem
        - Track litigation outcomes; assess whether courts recognize on-chain licensing as a valid rights clearance mechanism
      - - Creator economy growth to ~$500B by 2027 (Goldman Sachs)
        - driver
        - Medium-term 2023-2027
        - A larger creator economy expands the pool of IP owners who would benefit from automated royalty collection and increases total monetizable volume
        - Verify what fraction of creator economy revenue is addressable by Story's current PIL vs. platform-controlled monetization that incumbents will not cede
      - - Grayscale Story Trust institutional launch (July 2025)
        - driver
        - Near-term; product live as of July 2025
        - Institutional investment product provides a legitimacy signal; may increase demand for $IP from accredited investors
        - Monitor AUM and inflows to assess whether institutional interest translates into network usage or is purely token speculation
      - - $IP token price collapse (-97.9% from ATH) and usage lag (CoinDesk Feb 2026)
        - constraint
        - Current; ongoing through run date
        - Weak token price damages developer incentives, validator economics, and creator willingness to accept $IP as royalty currency; usage lag undermines network-effects thesis
        - Request on-chain usage metrics (active wallets, IP assets registered per week, royalty payments processed) to quantify whether the usage lag is improving
      - - Crypto/blockchain adoption friction for mainstream IP owners
        - constraint
        - Persistent; no near-term resolution without dedicated onboarding investment
        - Traditional IP owners (major music labels, film studios, publishers) have no crypto wallets and no on-chain operations; Story's SAM remains crypto-native until this is solved
        - Assess whether Story has a fiat-on-ramp, white-label tooling (StoryKit), or custodial solution that lowers onboarding friction for non-crypto IP owners
      - - Off-chain legal enforceability uncertainty for the Programmable IP License (PIL)
        - constraint
        - Material; no court precedent as of run date
        - PIL's on-chain parameters may not be enforceable in all jurisdictions; if a court declines to recognize smart-contract IP terms, the protocol's core value proposition collapses for commercial use cases
        - Commission independent legal review of PIL enforceability under US copyright law and relevant EU jurisdiction; seek opinion from copyright counsel on 17 U.S.C. compatibility
      - - EFF and civil-society opposition to expanded IP enforcement
        - constraint
        - Persistent; structural tension in IP policy environment
        - If blockchain-based IP enforcement extends rights-holder power in ways that regulators later restrict, Story's model faces regulatory backlash; EFF's position that IP "veers far from its purpose" is an established counter-narrative
        - Monitor EFF, Access Now, and Creative Commons positions on blockchain IP enforcement; assess whether PIL default terms are creator-friendly or rights-holder-maximizing
      - - Incumbent off-chain IP platforms with lower friction (Royalty Exchange, CCC, PROs)
        - constraint
        - Persistent; incumbents have established relationships and legal recognition
        - Creators and IP buyers can use existing off-chain platforms without crypto; incumbents have proven business models and legal standing; Story must offer a clear cost or speed advantage to win switching
        - Benchmark Story's licensing fee and settlement time vs. off-chain alternatives for the same asset type (e.g., music sync licensing via BMI vs. on-chain PIL)
    notes: >-
      Growth drivers are real but regulatory in character, meaning adoption depends on external compliance pressure
      rather than organic demand pull. Constraints are largely structural (crypto friction, legal uncertainty, token
      economics) and require active investment to address. The underwriting question is whether regulatory compulsion
      (EU AI Act) can drive adoption faster than structural friction discourages it.
