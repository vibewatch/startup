  evidenceGaps:
    - type: missing-source
      severity: material
      topic: independent SAM/SOM estimate for on-chain IP licensing infrastructure
      missingEvidence: >-
        No credible third-party analyst (Gartner, IDC, Messari, Delphi, Galaxy Digital) has published a serviceable
        addressable market or serviceable obtainable market estimate specifically for blockchain-native or programmable
        IP licensing infrastructure as of the June 2026 run date.
      whyItMatters: >-
        Without an independent SAM, the underwriting case rests entirely on bottom-up estimates from adjacent markets
        (creator economy, AI training data) and Story's own $80T ceiling claim—neither of which is a direct market
        sizing for Story's product. This makes TAM-to-revenue conversion speculative.
      diligencePath: >-
        Commission a bottom-up model combining AI training data budget estimates from AI lab disclosures with creator
        economy overlay; seek analyst reports from Messari or Delphi Digital on on-chain IP protocols; request
        Story management's own SAM estimate with methodology.
      relatedQuestionRefs:
        - QM001
        - QM021
      relatedTableRefs:
        - TM002
    - type: private-evidence-only
      severity: material
      topic: Story mainnet royalty payment volume and revenue generated for IP owners
      missingEvidence: >-
        Story Protocol does not publicly disclose the total value of royalty payments processed through the Royalty
        Module, the number of commercially licensed IP assets, or the revenue accrued to IP asset owners since
        mainnet launch in February 2025.
      whyItMatters: >-
        Without royalty volume data, it is impossible to assess whether the network is generating real economic
        value for IP owners or whether usage is limited to free and open-use IP assets with no commercial activity.
        This is the key leading indicator for Story's monetization thesis.
      diligencePath: >-
        Request on-chain royalty flow data from Story management; use Storyscan block explorer to estimate Royalty
        Module contract interactions; engage Dune Analytics or Nansen to query Story Protocol contract events for
        royalty payment volume.
      relatedQuestionRefs:
        - QM005
        - QM006
        - QM013
      relatedTableRefs:
        - TM003
    - type: missing-source
      severity: material
      topic: PIL off-chain legal enforceability under US copyright law
      missingEvidence: >-
        No court ruling, law review article, or published legal opinion has confirmed that Story's Programmable IP
        License constitutes a valid and enforceable copyright license under US law or under the laws of major EU
        jurisdictions as of the run date.
      whyItMatters: >-
        If PIL is not recognized as a valid copyright license off-chain, the core value proposition that on-chain
        agreements are legally binding collapses for commercial use cases. This is a binary risk for enterprise and
        AI lab buyer segments.
      diligencePath: >-
        Commission an independent copyright counsel opinion on PIL's enforceability under 17 U.S.C.; seek EU
        jurisdiction copyright counsel input on recognition; review any Story Foundation legal filings or formal
        opinions that may exist outside the public documentation.
