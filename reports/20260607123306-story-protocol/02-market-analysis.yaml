    rows:
      - - AI training data licensing
        - Rights-cleared dataset procurement; licensing fees paid by AI labs to content owners for training GPAI models; AI agent autonomous licensing via on-chain agreements
        - Compute costs, model weights storage, inference infrastructure, non-copyright data (government/public domain)
        - AI lab legal and procurement teams; ML engineers; autonomous AI agents
        - Core demand driver created by EU AI Act Art 53 and AI copyright litigation pressure; Story whitepaper frames this as a primary use case
      - - Creator economy IP monetization
        - On-chain royalty distribution from derivatives; licensing fees for commercial remixes; attribution and revenue share automation for digital art, music, and writing
        - Advertising revenue on social platforms; streaming subscription revenue not tied to IP licensing; traditional PRO (ASCAP/BMI) licensing handled off-chain
        - Individual creators; studios; gaming companies; content platforms
        - Goldman Sachs estimates ~$500B creator economy by 2027; Story's Royalty Module directly targets automated creator revenue share
      - - IPFi and on-chain IP financial primitives
        - IP asset fractionalization; IP-backed collateral in DeFi protocols; royalty-stream tokenization; IP staking and trading on secondary markets
        - Traditional IP securitization and royalty financing done off-chain; patent licensing revenue not relevant to Story's current product
        - DeFi developers; crypto funds; IPFi protocol builders; institutional token holders
        - Emerging category with no reliable market size estimate; Story whitepaper describes it as a new "IPFi" field analogous to DeFi
      - - Traditional IP licensing intermediaries (status-quo substitute)
        - Off-chain IP licensing managed by publishers, music labels, studios, and copyright clearinghouses; PRO licensing; sync licensing for film and TV
        - Story currently has no product for traditional offline IP licensing; no catalog onboarding tooling for non-crypto users
        - Media companies; publishers; entertainment studios; broadcasters
        - Primary substitute—incumbent intermediaries handle the majority of today's IP licensing volume but lack on-chain automation
      - - Patent and pharmaceutical IP licensing
        - Patent royalty streams; pharmaceutical licensing agreements; biotech IP-NFTs (Molecule.xyz niche)
        - Story's current PIL is designed for copyright-based creative IP, not patent claims; no product evidence of Story targeting pharma
        - R&D companies; pharma licensing teams; biotech investors
        - Adjacent but largely excluded from Story's near-term TAM; Molecule.xyz serves the biotech niche independently
      - - Adjacent blockchain creator platforms (competitive layer)
        - Platform fees and token economics of on-chain creator monetization tools such as Ocean Protocol, Zora, Manifold, and Audius
        - Story's monetizable surface is infrastructure licensing fees and $IP token utility, not platform advertising or streaming subscriptions
        - Crypto-native creators; NFT collectors; blockchain developer teams
        - Competitive displacement and partnership opportunity; validates broader on-chain creator market even when captured by non-Story platforms
    notes: >-
      The underwriting boundary should track AI training data licensing and creator royalty automation as the primary
      SAM, with IPFi as an emerging adjacency. Traditional patent/pharma licensing and incumbents' offline volumes are
      excluded from near-term SAM because Story has no product surface targeting those buyers.
