callouts:
  - calloutType: strength
    title: PIL legal framework is Story Protocol's non-commoditizable moat
    body: >
      The Programmable IP License is the only publicly documented legally-backed off-chain license
      template mapped on-chain at comparable scale. It was designed with specialized legal counsel,
      grounded in US copyright law, and draws on Creative Commons, Arweave, and a16z licensing
      precedents. No blockchain competitor—including Ocean Protocol, Manifold, or Metaplex—has
      produced an equivalent. This makes the PIL the hardest moat element to replicate quickly.
    claimRefs:
      - CP011
      - CP012
      - CP032
      - CP048

  - calloutType: risk
    title: Token unlock delay and usage lag are material adverse competitive signals
    body: >
      The February 2026 token unlock delay—attributed to usage lagging relative to expectations—
      raises the question of whether Story's legal-to-blockchain bridge has achieved meaningful
      commercial velocity. The delay creates a negative signal in exactly the competitive dimension
      that matters most: demonstrated creator and AI company adoption of on-chain IP registration
      and licensing. Sound.xyz's January 2026 shutdown shows that IP-on-blockchain platforms are
      not immune to adoption failure when network effects don't build fast enough.
    claimRefs:
      - CP007
      - CP022
      - CP037
      - CP040

  - calloutType: insight
    title: Status-quo alternatives require no platform adoption and carry court enforceability
    body: >
      The most durable competitive pressure on Story Protocol is not from blockchain peers but from
      the absence of switching costs for IP owners using lawyers and PROs. A rights holder who
      registers their IP via a traditional law firm receives court-enforceable protection globally;
      Story Protocol's PIL currently depends on US copyright law and requires the counterparty to
      transact on-chain. Until the PIL achieves demonstrated multi-jurisdiction enforceability,
      the status quo will retain a structural legal-certainty advantage.
    claimRefs:
      - CP020
      - CP027
      - CP028
      - CP042
      - CP043

