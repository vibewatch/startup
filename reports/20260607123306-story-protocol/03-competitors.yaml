  - id: capability-gtm-and-regulatory-posture
    title: Capability comparison, GTM distribution, and trust/regulatory posture
    body: >
      Story Protocol's clearest capability advantage is the Programmable IP License (PIL), an
      off-chain legal document grounded in US copyright law (17 U.S.C. §101) whose terms are mapped
      on-chain so smart contracts can enforce licensing, royalty, and derivative conditions without
      requiring individual legal negotiation. The PIL was designed after reviewing Creative Commons,
      Arweave's own licensing work, a16z's "Can't Be Evil" license suite, and the Token-Bound NFT
      License framework. No reviewed competitor has produced an equivalent: EIP-2981 is a minimal
      royalty signaling standard that is explicitly voluntary—a marketplace that ignores it transfers no
      royalties—and Ocean Protocol's Datatokens govern data access but carry no off-chain legal
      enforcement. Story's royalty module uses an ancestry graph in which IP Asset 3 (a derivative of
      IP Asset 2, which itself is a derivative of IP Asset 1) automatically pays a royalty stack to all
      upstream ancestors; a 100 IP token revenue event with a 5%+10% royalty stack flows 15 IP tokens to
      ancestor vaults. This architecture is more sophisticated than simple peer-to-peer royalty splits
      and has no direct public-chain equivalent. Manifold and Metaplex both support ERC-2981 or similar
      per-NFT royalty signals but do not maintain derivative ancestry graphs. On the GTM dimension,
      Story competes for developer adoption through TypeScript and Python SDKs, a growing ecosystem page
      listing integrations, and Grayscale's 2025 launch of a Story Protocol trust product providing
      traditional-finance exposure. The European Union's AI Act provisions on training-data transparency
      (effective from 2026) create a regulatory tailwind for provenance infrastructure, although
      enforcement timelines remain uncertain. Story's dispute module provides an on-chain mechanism for
      flagging infringing IP—no competing platform in the retained source set provides an equivalent
      on-chain dispute workflow.
