      - - "Comparable on-chain IP/data tokens (Ocean $21.7M, Audius $21.3M) at near-zero commercial traction"
        - Anti-Thesis
        - "Ocean or Audius achieve $100M+ ARR demonstrating category viability, or Story Protocol breaks from peer trend with disclosed enterprise revenue"
      - - "$2.25B equity valuation never officially disclosed — sourced anonymously per CNBC; no public financial basis"
