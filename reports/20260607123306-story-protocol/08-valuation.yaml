      - - "Founder SY Lee delivered $440M exit (Radish Media, 2021) demonstrating enterprise distribution capability"
        - Thesis
        - "Key man departure from founding team; or Radish exit does not translate to B2B IP infrastructure sales motion"
      - - "$142M equity capital and a16z + Polychain backing provide multi-year development runway"
