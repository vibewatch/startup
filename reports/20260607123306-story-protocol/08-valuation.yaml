      - Stance
      - What Would Change the View
    rows:
      - - "$80T global IP market with fragmented legacy infrastructure, structurally mis-priced for AI-era velocity"
        - Thesis
        - "Evidence that incumbents (ASCAP, BMI, Getty, traditional registries) successfully adapt to AI-era IP; no market share shift to on-chain alternatives"
