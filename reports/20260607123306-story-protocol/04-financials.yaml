        - Disclose aggregate daily/monthly gas fee revenue
      - - License Minting Fees (PIL)
        - IP owners set mintingFee per license; payer sends fee to IP Royalty Vault
        - Set by IP owner (any whitelisted token)
        - Permissioned; no aggregate figure available
        - Low — P2P between IP owner and licensee; no protocol cut
        - Provide aggregate minting fee volume since mainnet launch
      - - Royalty Module Flows
        - Automated revenue sharing via IP Royalty Vaults per derivative license terms
        - WIP (Wrapped IP) on mainnet; other whitelisted tokens permitted
        - Live; no aggregate royalty volume disclosed
        - Low — flows to IP owners; no protocol extraction
