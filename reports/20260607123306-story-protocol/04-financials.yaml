company:
  name: Story Protocol

chapter:
  number: 4
  title: Financials
  summary: >-
    Story Protocol (operated by PIP Labs) is a Layer-1 IP blockchain whose revenue model accrues gas fees and staking emissions to validators rather than to the corporate entity; PIP Labs holds no disclosed ARR, burn rate, or operating income. The project raised approximately $133–142 million in equity across four rounds through mid-2024, but the $IP token has declined 97.9% from its February 2025 all-time high of $14.78 to approximately $0.30 as of June 7, 2026, with team and investor tokens delayed from the original February unlock to August 2026 amid publicly documented usage lags and market pressure concerns. Capital adequacy depends entirely on treasury token holdings and the pace of equity deployment; absence of any disclosed protocol-level fee, burn figure, or revenue makes underwriting contingent on private disclosure.

sections:
  - id: revenue-streams-pricing
    title: Revenue Streams and Pricing Model
    body: >-
      Story Protocol's on-chain revenue model differs fundamentally from traditional software companies. The
      $IP token serves as the network's native currency for four distinct but interconnected functions: gas
      payment for all blockchain transactions, governance participation, staking and validation, and as the
      settlement currency for protocol-level licensing and royalty operations. However, the economic beneficiary
      of gas revenue is the validator/staker set, not PIP Labs as a corporation.

      Transaction gas fees are paid in $IP for every on-chain operation: IP Asset registration, license token
      minting, derivative IP registration, royalty payments, and dispute filings. All fees flow to the validator
      set (via the Cosmos SDK–derived consensus layer) and not to a corporate treasury. Coinbase, OKX, Bybit,
      and Gate list $IP for trading, with approximately $20.7 million in 24-hour trading volume as of the
      run date.

      The Royalty Module enables automated revenue sharing between IP Assets and their derivative works.
      When an IP owner sets a mintingFee on a PIL-flavored license, anyone minting that license token pays
      the fee directly into the IP owner's IP Royalty Vault—not to a protocol treasury. Revenue flows P2P
      through smart contracts; the protocol does not extract a fee from royalties. Whitelisted payment tokens
      on mainnet include WIP (Wrapped IP), ensuring royalty flows remain denominated in the protocol's
      native asset.

      Staking emissions represent a quasi-revenue mechanism that rewards validators and delegators but creates
      inflationary pressure on circulating supply. Following governance proposal SIP-009 (adopted January 2026),
      annual emissions were reduced from an observed rate of approximately 25.3 million IP per year to a target
      of 15.315 million IP per year. At the June 7, 2026 token price of approximately $0.30, this emission
      represents roughly $4.6 million per year in value distributed to stakers—a fraction of what would have
      been distributed at the ATH token price ($14.78). The targeted APY for unlocked stakers post-SIP-009
      is 6–7%.

      PIP Labs' direct revenue is not publicly disclosed. The company holds a share of the 5% Foundation
      allocation (50 million IP tokens) and presumably retains equity capital from the four funding rounds.
      No licensing, subscription, or SaaS revenue has been announced. The business model is infrastructure-
      reliant: protocol adoption drives token demand, which drives treasury value, which funds ongoing
      development.

