callouts:
  - calloutType: risk
    title: Token Unlock Overhang — August 2026 Risk Event
    body: >-
      Team and investor token unlock, originally scheduled for February 2026, was delayed to
      August 2026 after CoinDesk reported "usage lags and dump fears." As of June 7, 2026, the
      $IP token trades at $0.30 — 97.9% below its ATH — with 640 million tokens (64% of total
      supply) still locked. The August 2026 unlock event is a material risk: if significant
      sell pressure materializes, it will further impair the Foundation's token-denominated
      treasury and reduce the effective capital available to PIP Labs for operations.
    claimRefs:
      - CI017
      - CI020
      - CI022

  - calloutType: risk
    title: No Disclosed Protocol Fee — Direct Revenue Gap
    body: >-
      The current Royalty Module and Licensing Module implementations extract zero protocol fee
      from royalty flows or license transactions. All gas revenue accrues to validators. PIP Labs
      has no disclosed direct revenue mechanism from protocol usage. This creates a structural
      misalignment between protocol adoption and corporate financial sustainability, and makes
      equity underwriting entirely dependent on token price appreciation or a future governance
      decision to implement a protocol fee.
    claimRefs:
      - CI004
      - CI010
      - CI032

  - calloutType: insight
    title: SIP Governance Activity Signals Active Validator Ecosystem
    body: >-
      The Story Improvement Proposal (SIP) governance process has produced at least 11 formal
      proposals as of June 2026, including significant economic calibrations (SIP-009 on emissions,
      SIP-010 on staking thresholds, SIP-011 on validator set reduction). Broad validator
      participation (30+ validators commenting on SIP-009 and SIP-010) indicates a functioning
      governance system, but also highlights ongoing economic calibration risk — the network's
      monetary policy is not yet stable, which creates uncertainty about long-term staking APY
      and token supply dynamics.
    claimRefs:
      - CI006
      - CI028
      - CI038
      - CI039

