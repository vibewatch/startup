        - Provide current cash balance, monthly burn, and runway
    notes: >-
      Revenue quality assessed relative to the benefit accruing to PIP Labs as a corporate entity.
      On-chain fee revenue accrues entirely to network validators and stakers. All token values at
      current $IP price (~$0.30 as of 2026-06-07). Historical equity capital is not recurring revenue.
