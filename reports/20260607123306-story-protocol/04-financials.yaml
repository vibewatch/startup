        - $IP at current market price
        - "~$15M at $0.30/IP (Jun 2026); ~$740M at ATH"
        - Medium — token-denominated; impaired by 97.9% price decline
        - Confirm Foundation token vesting schedule and operational use plan
      - - Equity Capital (PIP Labs)
        - Four funding rounds from VCs; unallocated capital funds operations
        - USD
        - "~$133–142M raised cumulatively through mid-2024"
