        - $IP at 15.315M/year post-SIP-009
        - "~$4.6M/year at $0.30/IP (Jun 2026); was ~$226M/year at ATH"
        - Negative — inflationary; dilutes circulating supply
        - Confirm post-SIP-009 APY achieved vs. 6–7% target
