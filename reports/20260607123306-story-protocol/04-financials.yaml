  - id: TI005
    title: Public Financial Gaps — Private Metrics with No Public Evidence
    columns:
      - Missing Metric
      - Materiality
      - Why It Matters
      - Diligence Path
    rows:
      - - PIP Labs ARR or revenue
        - Blocking
        - No disclosed revenue makes equity valuation entirely model-dependent
        - Request audited financials or CFO-signed revenue schedule
      - - Monthly operating burn rate
        - Blocking
        - Cannot assess runway or financing dependency without burn
        - Request CFO-certified P&L for trailing 12 months
      - - Cash on hand (current)
        - Blocking
        - Without cash balance, cannot verify ability to operate to next milestone
        - Require bank statement or audited balance sheet
      - - Aggregate on-chain gas fee revenue
        - Material
        - Needed to assess whether L1 fee revenue could eventually fund operations
        - Pull from block explorer or request validator payout data
      - - Aggregate royalty/license minting volume
        - Material
        - Demonstrates whether protocol traction translates to economic activity
        - Query on-chain Royalty Module contract events since Feb 2025 launch
      - - Headcount and compensation structure
        - Material
        - Needed to estimate operating expense basis
        - Request organizational chart and total comp budget
      - - Token distribution for team and investors (exact)
        - Material
        - August 2026 unlock creates sell-pressure risk; exact per-party schedules needed
        - Request full vesting/unlock schedule by category and participant
      - - Next-round trigger
        - Material
        - Required to gauge financing dependency and negotiate terms
        - Ask management directly; confirm runway endpoint and next-raise plan
    notes: >-
      All gaps reflect information not publicly disclosed as of 2026-06-07. Severity reflects
      the impact on investment underwriting. Blocking gaps prevent issuance of a financial verdict
      with high confidence. Items require direct disclosure from PIP Labs management or its auditor.
    claimRefs:
