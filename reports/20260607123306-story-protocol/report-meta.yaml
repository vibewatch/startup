companyProfile:
  summary: >-
    Story Protocol is a private, post-Series-B company building a purpose-built IP blockchain that
    lets rights holders and developers register IP Assets, attach programmable license terms, track
    derivatives, and automate royalty flows across on-chain IP graphs. Public evidence shows a
    technically credible stack spanning a custom L1, smart-contract modules, SDKs, audits, and a
    live token, but the commercial case remains under-disclosed: no public ARR, headcount, named
    enterprise AI licensing customers, or current board/control picture are available as of the run
    date.
