  topStrengths:
    - >-
      Story appears to be the only purpose-built IP blockchain with a legally integrated Programmable IP License and a
      fuller IP-specific module stack than generic NFT or data marketplace peers.
    - >-
      Developer and security evidence is stronger than average for a private Web3 protocol, including open-source core
      repos, multiple SDKs, multiple audits, and an active bug bounty.
    - >-
      AI copyright disputes and emerging training-data compliance rules could create real demand for rights-cleared
      licensing infrastructure if Story converts ecosystem usage into enterprise licensing volume.
  topRisks:
    - >-
      No public ARR, revenue run rate, headcount, or named enterprise AI licensing customers exist, and daily protocol
      revenue fell to zero by early 2026.
    - >-
      The PIL and $IP token still face unresolved legal questions around enforceability and token classification across
      jurisdictions.
    - >-
      The reported $2.25 billion Series B mark sits far above the roughly $300 million token FDV on 2026-06-07, while
      the token unlock delay signaled usage lag and market fragility.
  unresolvedGaps:
    - Current enterprise licensing customers, contract value, ARR, and the actual corporate revenue capture mechanism.
    - Treasury composition, burn, runway, and how much operating funding depends on token holdings versus cash.
    - >-
      Current board/control rights, founder role split, and whether the three-founder launch framing still reflects
      current governance.
    - >-
      Independent legal analysis of PIL enforceability and token-classification exposure in the US and major non-US
      markets.
