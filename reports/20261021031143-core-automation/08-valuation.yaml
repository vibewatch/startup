callouts:
  - calloutType: recommendation
    title: Price discipline
    body: >-
      Treat the published $4.0B figure as a low-confidence reference. Require primary financing,
      capitalization, operating, customer, and benchmark evidence before setting a price or return target.
    claimRefs: [CV001, CV002, CV003, CV008, CV013, CV014]
  - calloutType: risk
    title: Thesis-break trigger
    body: >-
      Walk away if autonomous research gains cannot be reproduced, paid demand remains unverified,
      or financing preferences and compute obligations absorb the common-equity upside.
    claimRefs: [CV007, CV008, CV011, CV012, CV013]
