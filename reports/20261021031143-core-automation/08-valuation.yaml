      - [Risk rating, High, "Frontier-lab capital intensity combines with missing company revenue, margin, customer, burn, and runway data.", "Size no exposure from public evidence alone."]
      - [Valuation stance, "Unverified to stretched", "No public operating denominator supports the cited mark.", "Negotiate only after milestone and cap-table diligence establishes price support."]
    notes: >-
      Judgments are analytical conclusions from the retained public evidence; the table does
      not assert a verified financing close, target return, or independently confirmed $4.0B valuation.
    claimRefs: [CV001, CV008, CV011, CV012, CV013, CV014]
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Lens
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - [Talent, "Reported recruits have frontier-lab experience.", "Talent concentration is not evidence of proprietary output or commercialization.", "Verified retention plus attributable technical milestones."]
      - [Research model, "Automated experimentation could accelerate architecture discovery.", "The reported kernel result still required rare human expertise and substantial agent compute.", "Repeatable autonomous results across held-out tasks and hardware."]
      - [Demand, "AI spending growth creates a large opportunity surface.", "Gartner says near-term spending is infrastructure-heavy and enterprise adoption remains incremental.", "Named paid deployments with renewal and workload expansion."]
      - [Financing, "Capital interest could fund long-horizon research.", "Public sources do not reconcile the targeted round, reported filing, and estimated valuation.", "Primary financing documents, cap table, preference stack, and cash-use plan."]
    notes: >-
      Thesis rows separate company-specific signals from sector context; syndicated founder
      statements are treated as company claims, and market forecasts are not company revenue evidence.
    claimRefs: [CV002, CV003, CV005, CV006, CV007, CV009, CV010]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation and return logic
      - Probability signal
      - Downside trigger
    rows:
      - [Bull, "Autonomous research output becomes reproducible; paid deployments show retention; financing terms are clean.", "No numeric range is supportable yet; a premium could be revisited only after verified commercial and technical milestones.", "Strengthening only when primary metrics and contracts substantiate both capability and demand.", "Benchmarks fail to reproduce or pilots do not convert."]
      - [Base, "Research progress continues, but product, customer, and unit-economic proof remains limited.", "Defer range and target return; treat the $4.0B estimate as an unverified reference, not an entry anchor.", "Current public evidence is most consistent with continued diligence.", "A financing close embeds ownership or preference terms that impair ordinary equity."]
      - [Bear, "Automation remains expert-dependent while frontier-lab costs and sector multiples compress.", "Downside cannot be bounded without cash obligations and cap-table data; avoid valuation precision.", "Weakening if primary financing or operating evidence remains unavailable.", "Capital needs rise before repeatable capability or paid demand emerges."]
    notes: >-
      Scenario valuations are intentionally nonnumeric because retained sources do not provide
      verified revenue, margins, burn, runway, fully diluted ownership, or preference terms.
    claimRefs: [CV001, CV007, CV008, CV009, CV010, CV011, CV012, CV013, CV014]
