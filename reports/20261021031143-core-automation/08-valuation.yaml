company:
  name: Core Automation
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports a research-more recommendation, low confidence, high risk,
    and an unverified-to-stretched valuation stance rather than a numeric price target.
    A third-party $4.0 billion estimate and an indirect report of a filing to raise up to
    $500 million are not enough to offset absent operating metrics, customer economics,
    financing terms, or independently verified price discovery.
sections:
  - id: investment-judgment
    title: Investment judgment
    body: >-
      Core Automation presents a credible research thesis and an unusually strong talent
      signal, but public evidence does not yet establish a commercial asset that can be
      underwritten at the cited $4.0 billion estimate. Business Insider documented senior
      recruiting from Anthropic and Google DeepMind, while a syndicated Sequoia podcast
      describes a deliberate attempt to replace transformer-era constraints with continual
      learning and automated experimentation. Those signals support technical option value,
      not recurring revenue, customer retention, defensible margins, or liquidity. The
      appropriate recommendation is research-more with low confidence and high risk:
      diligence should test whether research velocity converts into proprietary capability
      and paid demand before treating talent density as valuation support.
    claimRefs: [CV005, CV006, CV007, CV008, CV014]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-and-entry-discipline
    title: Financing context and entry discipline
    body: >-
      The financing record is too inconsistent for a firm entry price. QuantLogix publishes
      a $4.0 billion estimate but labels its confidence low and its latest financing a
      targeted Series A, while AI Market Watch later reported, citing Axios, that the
      company filed to raise up to $500 million. An April article had stated that no round
      had been announced, which is useful chronology but not confirmation of a subsequent
      close. No retained source supplies a cap table, lead investor, liquidation preferences,
      debt, cash available, or a definitive post-money valuation. Entry discipline therefore
      requires primary financing documents and fully diluted ownership math; the public
      record cannot support a target return or dilution-adjusted ownership case.
    claimRefs: [CV001, CV002, CV003, CV004, CV008, CV013]
    tableRefs: [TV002]
  - id: scenarios-and-comparable-context
    title: Scenarios and comparable context
    body: >-
      Broad AI demand is real but cannot substitute for company-level proof. Gartner forecasts
      $2.59 trillion of worldwide AI spending in 2026, yet also says infrastructure will
      account for more than 45% and that enterprises still favor tactical, incremental
      initiatives. Frontier-lab reference points are equally cautionary: a Forbes contributor
      article reported very large OpenAI operating losses relative to revenue, and CNBC
      quoted Yann LeCun warning that lab economics require higher prices or lower costs.
      These references frame capital intensity and multiple-compression risk; they are not
      transaction comparables for Core Automation. Bull, base, and bear cases therefore use
      observable milestones, with numeric valuation ranges deferred until financing and
      operating data are available.
    claimRefs: [CV009, CV010, CV011, CV012, CV013, CV016]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness and thesis-break conditions
    body: >-
      QuantLogix reports that Core Automation remains private and has no public S-1, so an
      IPO timeline is not an evidence-backed source of near-term liquidity. The decisive
      diligence asks are a primary financing record, fully diluted capitalization, preference
      stack, cash and committed compute obligations, audited or management financials,
      customer contracts, retention, deployment economics, and reproducible technical
      benchmarks. The thesis strengthens only if those materials show a repeatable capability
      advantage and paid adoption without financing terms that consume common-equity upside.
      It breaks if claimed automation remains expert-dependent, customer evidence remains
      absent, or a financing process validates materially worse economics than the public
      $4.0 billion estimate implies.
    claimRefs: [CV007, CV008, CV013, CV014, CV015]
