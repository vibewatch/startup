  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: operating-metrics
      missingEvidence: >-
        Revenue, ARR, gross margin, burn, cash balance, runway, customer contracts,
        retention, and deployment-level unit economics.
      whyItMatters: >-
        These denominators are required to choose a valuation method, assess financing need,
        and distinguish research promise from a durable commercial asset.
      diligencePath: >-
        Obtain audited or management financials, bank statements, board-approved budget,
        customer contracts, cohort retention, and workload-level gross-margin schedules.
      relatedQuestionRefs: [QV004]
      relatedTableRefs: [TV001, TV003]
    - type: private-evidence-only
      severity: material
      topic: financing
      missingEvidence: >-
        Executed financing documents, fully diluted capitalization, investor identities,
        liquidation preferences, debt, compute commitments, and use-of-proceeds schedule.
      whyItMatters: >-
        A headline valuation cannot establish common-equity value or target return without
        ownership, seniority, dilution, and committed-capital terms.
      diligencePath: >-
        Review signed stock-purchase documents, charter, cap table, side letters, debt
        agreements, compute contracts, and post-financing cash reconciliation.
      relatedQuestionRefs: [QV010]
      relatedTableRefs: [TV001, TV002, TV003]
    - type: missing-source
      severity: material
      topic: financing
      missingEvidence: >-
        Primary SEC filing or issuer documentation that confirms the reported $500 million
        fundraising authorization and reconciles it with the $4.0 billion estimate.
      whyItMatters: >-
        Indirect reporting does not establish whether securities were sold, how much closed,
        or what valuation and terms investors accepted.
      diligencePath: >-
        Obtain the filing accession number and amendments, then reconcile securities sold,
        offering amount, dates, investors, and post-money ownership with company records.
      relatedQuestionRefs: [QV001, QV010]
      relatedTableRefs: [TV001, TV002]
