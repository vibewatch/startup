              - CI010
              - CI013
              - CI014
              - CI015
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              AI Market Watch reported that Core Automation filed with the SEC to raise up to $500 million, citing
              Axios. That is a financing target reported through a secondary tracker; it is not evidence that the amount
              was raised, that proceeds are unrestricted cash, or that capital remains available on the run date. No
              retained source supplies cash on hand, monthly net cash burn, runway, debt, project-finance obligations,
              planned use of funds, or a next-round trigger. Sector evidence reinforces why those distinctions matter:
              one lower-reputation analysis reported substantial OpenAI quarterly spending and losses, while TechCrunch
              reported more than $40 billion of Nvidia AI equity commitments in early 2026 and noted criticism of
              circular supplier-customer investment. These are context, not Core Automation estimates. Capital adequacy
              must be tested from bank balances, obligations, and a monthly operating plan.
            claimRefs:
              - CI003
              - CI010
              - CI011
              - CI014
      - number: '4.4'
        title: Financial verdict and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is research-stage and evidence-constrained. Core Automation may have a
              differentiated technical thesis and strong recruiting signal, but neither establishes a monetizable
              product, repeatable demand, attractive gross margin, or sufficient runway. The reported financing filing
              could support a large capital plan, yet the maximum sought cannot be treated as proceeds received.
              Underwriting should therefore avoid ARR, revenue-growth, CAC-payback, or gross-margin assumptions until
              management provides source documents. Priority requests are monthly revenue by customer and stream, signed
              contracts and pipeline, realized pricing, compute and payroll spend, gross-margin reconciliation, cash and
              debt schedules, and a 24-month hiring and compute plan. The key investability question is whether
              technical milestones can create a priced customer outcome before research costs and scarce talent require
              another financing event.
            claimRefs:
              - CI003
              - CI007
              - CI009
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
