              - CI012
      - number: '4.2'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              The most concrete company-specific cost signal is technical rather than accounting data. A
              founder-interview recap describes a human-plus-AI kernel effort that cost approximately $100,000 in agent
              compute over four weeks and achieved a reported 60x speedup for selected QR-decomposition shapes. The same
              recap describes an ambition to move from at least one architecture experiment per day toward 10 to 200 per
              day. Those figures are not company burn, cost of revenue, or a forecast, but they indicate that the
              operating model can consume meaningful compute before a sale occurs. Independent reporting also describes
              competition for senior AI talent, with salary, equity, compute access, and research autonomy used as
              recruiting levers. Without payroll, cloud commitments, owned infrastructure, or product delivery data,
              gross margin and contribution margin remain unavailable.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI013
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
