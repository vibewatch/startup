        title: Exhibits
        blocks:
          - type: callout
            title: Financing target is not liquidity
            body: >-
              The reported filing to raise up to $500 million should not be treated as funding raised, cash available,
              or runway. Obtain the primary filing, closing documents, bank evidence, and committed-spend schedule
              before assessing capital sufficiency.
            calloutType: risk
            claimRefs:
              - CI003
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: A research system, not yet a packaged product
        blocks:
          - type: paragraph
            body: >-
              Core Automation publicly frames its objective as building systems that optimize and automate work,
              beginning with research. Reporting on team statements narrows that objective to new learning algorithms,
              architectures beyond the current stack, and a replacement architecture that can learn at test time. The
              resulting "product" is therefore an internal research capability: an automated lab intended to discover,
              train, and evaluate adaptive models. That is materially different from a model API, application, or
              enterprise workflow sold to customers, none of which is established in the retained target-company
              evidence. An independent launch assessment also cautions that the automated-lab capability remains a
              vendor claim rather than an independently assessed result.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE012
              - CE015
          - type: table
            tableRef: TE001
            claimRefs:
              - CE003
              - CE006
              - CE007
              - CE008
              - CE009
              - CE013
              - CE016
      - number: '5.2'
        title: Architecture discovery depends on an automated systems stack
        blocks:
          - type: paragraph
            body: >-
              The founder-described operating model links five technical layers: continual-learning objectives,
              candidate architectures, joint optimization and training design, custom accelerator kernels, and rapid
              experiment orchestration. The thesis is coherent because novel architectures can require operations that
              standard hardware libraries do not optimize, making kernel work a prerequisite rather than an
              implementation detail. The strongest disclosed technical result is a reported 60-fold QR-kernel speedup
              over cuSOLVER for selected B200 problem shapes. It is not evidence of autonomous research: the account
              also says the effort used exceptional human expertise, about $100,000 of agent compute, and four weeks.
              The proposed flywheel therefore remains human-assisted at its demonstrated boundary.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
