chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating thesis
        blocks:
          - type: paragraph
            body: >-
              Core Automation presents itself as a small research lab whose objective is to build systems that optimize
              and automate work, beginning with research itself. Its public thesis is not a conventional
              application-layer product pitch: the company says the next step change will require learning algorithms
              beyond large-scale pretraining and reinforcement learning, architectures that scale better than
              transformers, and a lab designed around capable agents. A podcast summary attributes a related test-time
              continual-learning and automated-kernel agenda to founders Jerry Tworek and Rohan Anil. This makes the
              current business model best described as pre-commercial research rather than a verified software revenue
              model. The official site substantiates ambition and technical direction, not product readiness, benchmark
              superiority, customer adoption, or recurring revenue.
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO008
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
      - number: '1.2'
        title: Leadership depth, concentration, and governance
        blocks:
          - type: paragraph
            body: >-
              Independent reporting identifies Jerry Tworek as CEO and cofounder after serving as an OpenAI vice
              president, and identifies Rohan Anil as a cofounder after work at Anthropic and Google DeepMind. The same
              reporting names additional recruits spanning research, systems, and people functions, including Anmol
              Gulati, Joanne Jang, Ehsan Amid, Avery Lamp, Julia Villagra, and Sai Surya Duvvuri. This is unusually
              strong pedigree for such a young lab, but the strategy remains visibly founder-led: Tworek and Anil are
              the principal public articulators of the technical program. No retained source discloses board
              composition, voting rights, founder ownership, succession planning, or formal decision authorities.
              Underwriting should therefore separate demonstrated talent density from unverified governance resilience.
            claimRefs:
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO005
      - number: '1.3'
        title: Capital history and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              The financing record is material but not reconciled. AI Market Watch reports an approximately $100 million
              April 2026 seed at about a $1 billion valuation with Nvidia, Spark Capital, Accel, Scribble Ventures, and
              Threshold Ventures, then reports a roughly $432 million follow-on at about a $3.6 billion post-money
              valuation and roughly $532 million total raised. That same profile explicitly says the later financing was
              not yet confirmed by other named databases or a company announcement. A separate AI Market Watch news item
              says the company filed with the SEC to raise up to $500 million, citing Axios. Conversely, an April 25
              article said no round had been announced. These are reported financing signals, not verified cash
              balances, and they do not establish runway, ownership, board seats, liquidation preferences, or available
              capital.
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
