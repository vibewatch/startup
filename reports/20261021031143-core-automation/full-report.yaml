              - CE005
              - CE006
              - CE008
              - CE009
              - CE010
              - CE011
              - CE016
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE003
              - CE006
              - CE008
              - CE010
              - CE011
      - number: '5.3'
        title: Maturity is research-stage and deployment evidence is absent
        blocks:
          - type: paragraph
            body: >-
              Public maturity evidence is uneven. The founders describe ambitions to progress from at least one
              architecture experiment per day to ten or even two hundred, but the retained evidence does not show
              measured current throughput, an externally reproduced benchmark, a released model, an API, an integration,
              or a production deployment. Business Insider and its Yahoo syndication establish the launch thesis and
              specialist hiring, while TechJack characterizes the company as a signal to track rather than a capability
              to weight heavily. A separate business at coreautomation.io markets enterprise AI implementation services
              and must not be confused with the coreauto.com frontier lab; its detailed architecture and customer
              outcomes are evidence of a namesake collision, not Core Automation's product maturity.
            claimRefs:
              - CE009
              - CE012
              - CE013
              - CE014
              - CE015
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE005
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE016
      - number: '5.4'
        title: Trust, reliability, and governance are the decisive gaps
        blocks:
          - type: paragraph
            body: >-
              Continual learning creates a harder assurance problem than static model release because adaptation must
              preserve prior capabilities while incorporating new information. The independent survey retained here
              identifies forgetting and seamless knowledge integration as unresolved field-level challenges. Google
              supplies a useful competitor benchmark: it describes governance spanning initial research, development,
              post-launch monitoring, and remediation. This is not independent proof of best practice and says nothing
              about Core Automation's controls, but it makes the disclosure gap concrete. The target-specific retained
              sources disclose no security or privacy architecture, evaluation suite, model-change controls, incident
              process, certification, service level, or quality-management framework. Underwriting should therefore
              treat trust and operational readiness as unverified, not infer safety from the absence of a reported
              incident.
            claimRefs:
              - CE010
              - CE011
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The demonstrated boundary is still human-assisted
            body: >-
              The most concrete technical result is shape-specific and reportedly required scarce expert judgment,
              substantial agent compute, and four weeks; it does not establish autonomous kernel generation or a
              self-improving lab.
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base is prospective, not demonstrated
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not establish a paying external customer base. Royco describes Core Automation
              as having no public product, API, pricing, or customers as of mid-2026 and frames the near-term model as
              using automation inside the lab before commercialization. AngelsRound identifies AI infrastructure
              providers, enterprises, and eventually autonomous AI deployments as target customers, but its own traction
              description centers on the founding team and GPU commitments rather than users or contracts. The
              investable customer thesis is therefore a segmentation hypothesis: internal researchers are the only
              evidenced current users, while enterprise and infrastructure buyers remain prospective. Broad enterprise
              AI readiness supports a possible demand backdrop, but it does not prove demand for Core Automation
              specifically.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU010
              - CU011
              - CU012
              - CU013
              - CU016
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU010
              - CU011
              - CU012
              - CU013
              - CU016
      - number: '6.2'
        title: Internal technical use is the only measurable adoption surface
        blocks:
          - type: paragraph
            body: >-
              The best quantified use evidence is operational rather than commercial. A partner-hosted founder interview
              reports that a human-plus-AI search loop produced a 60x QR-kernel speedup over cuSOLVER for the specific
              problem shapes tested, with about $100,000 in agent compute over four weeks and expert human involvement.
              The same interview presents one architecture experiment per day, and eventually 10 to 200 per day, as
              goals rather than achieved throughput. These data indicate that Core Automation is actively applying
              automation to its own research process, but they provide no external account, location, renewal,
              utilization, or revenue denominator. Reported financing activity is evidence of capital availability, not
              customer adoption, and should not be substituted for commercial traction.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU006
              - CU007
              - CU013
      - number: '6.3'
        title: Named proof, retention, and concentration remain open
        blocks:
          - type: paragraph
            body: >-
              No successful prefetched source allocated to this chapter names an external production customer, pilot, or
              design partner. The source set also discloses no NRR, GRR, churn, renewal, contract-length,
              customer-count, satisfaction, or customer-concentration metric. That absence is a limitation of public
              evidence, not proof that no private discussions or deployments exist. It prevents assessment of reference
              quality, procurement friction, repeat use, expansion, or dependency on a small number of counterparties. A
              mature enterprise-AI comparator such as Glean had a reported $300 million of ARR by May 2026, but that
              benchmark is a maturity contrast only; it supplies no evidence about Core Automation's revenue or
              customers.
            claimRefs:
              - CU002
              - CU009
              - CU014
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU004
              - CU013
              - CU014
      - number: '6.4'
        title: Commercialization requires multiple unverified gates
        blocks:
          - type: paragraph
            body: >-
              The observable journey starts with Core Automation as its own user: research automation, kernel work, and
              faster experimentation are intended to improve the underlying technical system. External commercialization
              would then require a product boundary, pilot deployment, repeatable outcome measurement, paid conversion,
              renewal, and expansion. None of those external stages is publicly evidenced in the retained sources.
              Enterprise readiness is also uneven: the Blockchain Council reports widespread AI strategy ownership but
              far lower mature governance, implying that security, governance, integration, and procurement proof may
              become adoption gates even if the technical thesis succeeds. The figure separates observed internal use
              from the still-unverified customer conversion loop.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer diligence remains thesis-critical
            body: >-
              Treat internal technical activity as product-development evidence only. Underwriting external demand
              requires named references, deployment scope, paid status, outcomes, renewal behavior, and customer
              concentration directly from contracts or customer-side evidence.
            calloutType: risk
            claimRefs:
              - CU013
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and evidence boundary
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a high residual execution risk, not a finding of misconduct or technical failure.
              Sacra describes Core Automation as pre-revenue and pre-commercial as of May 2026, with costs concentrated
              in frontier research talent and compute, while the founders describe custom-kernel work that still
              required rare human expertise, four weeks, and substantial agent-compute expense. That combination puts
              architecture execution, financing continuity, and expert availability ahead of legal-event risk in the
              ranking. The assigned evidence pool contains no direct court docket, regulator order, security audit,
              incident history, customer contract, or supplier agreement; absence from this bounded pool is not proof
              that no such item exists. The matrix therefore scores evidence-backed exposure and marks control maturity
              as unverified where the underlying controls are private.
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR008
              - CR009
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR008
              - CR011
              - CR013
              - CR016
      - number: '7.2'
        title: Regulatory, legal, privacy, and IP exposure
        blocks:
          - type: paragraph
            body: >-
              The primary legal issue is readiness, not a documented enforcement event. NIST's voluntary AI Risk
              Management Framework provides a concrete governance baseline for trustworthiness across design,
              development, use, and evaluation. Gartner separately identifies emerging regulation, privacy,
              intellectual-property protection, and trust as adoption obstacles for generative AI systems. An AI Market
              Watch item reports an SEC filing to raise up to $500 million, but the assigned pool does not include the
              underlying filing, so its existence, issuer identity, amount, and terms require direct verification.
              Before investment, counsel should review corporate and financing filings, invention assignment,
              training-data rights, privacy controls, export controls, and any current or threatened disputes. These
              checks are particularly important if continuously learning systems ingest customer or proprietary data
              after deployment.
            claimRefs:
              - CR004
              - CR010
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR010
              - CR011
      - number: '7.3'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              The technical thesis contains a bootstrapping problem: the lab seeks to automate research, yet its
              founders say novel architectures depend on custom kernels that current coding tools cannot produce
              autonomously from scratch. Their reported competition result demonstrates potential acceleration but also
              required a rare expert, about $100,000 of agent-compute expense, and four weeks for the target workload.
              External evidence from Anthropic's automation experience illustrates the control challenge at scale:
              company-reported automated coding volume increased sharply, creating more review work, while VentureBeat
              highlights the possibility that undetected errors can compound across agent sessions. Core Automation has
              not publicly demonstrated its own secure-development lifecycle, evaluation gates, rollback process,
              incident response, or reliability record in the assigned pool. Those controls should be tested before
              treating experiment throughput as durable research productivity.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR013
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR007
              - CR008
              - CR009
              - CR013
              - CR014
      - number: '7.4'
        title: Partner, talent, capital, and commercialization dependencies
        blocks:
          - type: paragraph
            body: >-
              Core Automation depends on inputs it does not fully control: scarce systems researchers, specialized
              accelerators and cloud capacity, continued financing, and eventual enterprise adoption. Business Insider
              and its Yahoo Finance syndication document recruitment from Anthropic and Google DeepMind, confirming
              access to strong talent but also implying key-person and retention exposure. Sacra reports $100 million of
              confirmed primary financing as of May 2026; that is funding raised, not cash available, and no public burn
              or runway denominator is supplied. It also reported no public API, pricing page, signup flow, or
              commercial product at that time. Gartner's evidence that buyers face uneven returns, difficult
              integration, unpredictable costs, and data-quality problems makes the transition from internal lab tooling
              to external revenue a separate execution hurdle rather than an automatic extension of technical progress.
            claimRefs:
              - CR003
              - CR005
              - CR011
              - CR012
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR007
              - CR011
              - CR012
              - CR015
              - CR016
      - number: '7.5'
        title: Mitigations, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Mitigation should be milestone-based. Technical monitoring should track reproducible experiment
              throughput, expert hours per validated kernel, compute cost per accepted result, rollback frequency, and
              independent benchmark replication. Governance monitoring should require a NIST-aligned risk register,
              documented data lineage, security testing, human approval boundaries, incident reporting, and counsel
              review of privacy, IP, export-control, employment, and financing obligations. Financial monitoring should
              reconcile cash, committed compute, monthly burn, hiring obligations, financing proceeds, and runway;
              reported funding cannot substitute for this schedule. Thesis-break triggers are failure to reproduce the
              claimed systems gains, repeated control failures or material incidents, inability to secure compute or
              retain critical experts, financing that does not extend runway through a independently validated
              milestone, or continued absence of a credible commercialization path after technical proof. Missing
              evidence should pause underwriting rather than be converted into a favorable assumption.
            claimRefs:
              - CR003
              - CR008
              - CR010
              - CR011
              - CR012
              - CR014
              - CR015
              - CR016
      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Investment control
            body: >-
              Do not underwrite reported funding, elite hiring, or experiment throughput as proof of runway, product
              readiness, or control maturity. Require a primary financing reconciliation, reproducible technical
              milestones, and documented governance before increasing conviction.
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR005
              - CR008
              - CR010
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment judgment
        blocks:
          - type: paragraph
            body: >-
              Core Automation presents a credible research thesis and an unusually strong talent signal, but public
              evidence does not yet establish a commercial asset that can be underwritten at the cited $4.0 billion
              estimate. Business Insider documented senior recruiting from Anthropic and Google DeepMind, while a
              syndicated Sequoia podcast describes a deliberate attempt to replace transformer-era constraints with
              continual learning and automated experimentation. Those signals support technical option value, not
              recurring revenue, customer retention, defensible margins, or liquidity. The appropriate recommendation is
              research-more with low confidence and high risk: diligence should test whether research velocity converts
              into proprietary capability and paid demand before treating talent density as valuation support.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV008
              - CV011
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The financing record is too inconsistent for a firm entry price. QuantLogix publishes a $4.0 billion
              estimate but labels its confidence low and its latest financing a targeted Series A, while AI Market Watch
              later reported, citing Axios, that the company filed to raise up to $500 million. An April article had
              stated that no round had been announced, which is useful chronology but not confirmation of a subsequent
              close. No retained source supplies a cap table, lead investor, liquidation preferences, debt, cash
              available, or a definitive post-money valuation. Entry discipline therefore requires primary financing
              documents and fully diluted ownership math; the public record cannot support a target return or
              dilution-adjusted ownership case.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
      - number: '8.3'
        title: Scenarios and comparable context
        blocks:
          - type: paragraph
            body: >-
              Broad AI demand is real but cannot substitute for company-level proof. Gartner forecasts $2.59 trillion of
              worldwide AI spending in 2026, yet also says infrastructure will account for more than 45% and that
              enterprises still favor tactical, incremental initiatives. Frontier-lab reference points are equally
              cautionary: a Forbes contributor article reported very large OpenAI operating losses relative to revenue,
              and CNBC quoted Yann LeCun warning that lab economics require higher prices or lower costs. These
              references frame capital intensity and multiple-compression risk; they are not transaction comparables for
              Core Automation. Bull, base, and bear cases therefore use observable milestones, with numeric valuation
              ranges deferred until financing and operating data are available.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exit readiness and thesis-break conditions
        blocks:
          - type: paragraph
            body: >-
              QuantLogix reports that Core Automation remains private and has no public S-1, so an IPO timeline is not
              an evidence-backed source of near-term liquidity. The decisive diligence asks are a primary financing
              record, fully diluted capitalization, preference stack, cash and committed compute obligations, audited or
              management financials, customer contracts, retention, deployment economics, and reproducible technical
              benchmarks. The thesis strengthens only if those materials show a repeatable capability advantage and paid
              adoption without financing terms that consume common-equity upside. It breaks if claimed automation
              remains expert-dependent, customer evidence remains absent, or a financing process validates materially
              worse economics than the public $4.0 billion estimate implies.
            claimRefs:
              - CV007
              - CV008
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline
            body: >-
              Treat the published $4.0B figure as a low-confidence reference. Require primary financing, capitalization,
              operating, customer, and benchmark evidence before setting a price or return target.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV013
              - CV014
          - type: callout
            title: Thesis-break trigger
            body: >-
              Walk away if autonomous research gains cannot be reproduced, paid demand remains unverified, or financing
              preferences and compute obligations absorb the common-equity upside.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV011
              - CV012
              - CV013
