      - number: '1.4'
        title: Milestones and diligence implications
        blocks:
          - type: paragraph
            body: >-
              The public chronology moves quickly from a reported late-March formation to an April launch, senior-team
              recruiting, reported financing, a July founder interview, and an August report of an SEC fundraising
              filing. The most concrete operating milestone in the retained evidence is a founder-described GPU-kernel
              experiment: a human-plus-agent process reportedly achieved a 60x speedup for a selected QR workload after
              four weeks and about $100,000 of agent compute. That is a technical experiment, not evidence of an
              autonomous lab or commercial product. Skeptical launch coverage classified the story as single-source and
              advised waiting for a credible financing announcement. The investment case therefore rests on team quality
              and a differentiated research thesis while primary financing documents, commercialization evidence, and
              governance records remain diligence priorities.
