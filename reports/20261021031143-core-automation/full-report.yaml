  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: research automation, not the whole agent economy'
        blocks:
          - type: paragraph
            body: >-
              Core Automation's disclosed objective is to optimize and automate work beginning with research, while its
              founders frame continual learning and post-transformer architecture discovery as the technical route. That
              places the company first in frontier-model R&D infrastructure: experiment design, systems code, kernel
              work, evaluation, and model-learning loops used by highly technical research teams. The broader
              enterprise-agent market is an adjacency, not a defensible measure of Core's present addressable revenue.
              Scientific workflow products such as Claude Science show that research organizations can buy integrated AI
              workbenches, but they solve workflow orchestration with existing models rather than Core's stated
              architecture-replacement problem. Status-quo substitutes include internal research engineers, incumbent
              frontier-lab tooling, general coding agents, conventional training pipelines, and manual experiment
              review. The public record still describes Core as pre-product, with distribution channels undefined and no
              database signals for ARR or valuation; those absences prevent a buyer-based company TAM from being
              inferred.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM007
              - CM011
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM011
              - CM012
      - number: '2.2'
        title: Sizing lenses show demand, but not Core-specific capture
        blocks:
          - type: paragraph
            body: >-
              Axis Intelligence aggregates a 2026 global AI-agents market estimate of $10.9-$11.8 billion and a 43%-49%
              CAGR range through 2030, while also reporting Gartner's much larger $206.5 billion estimate for 2026
              AI-agent software spending. These figures should not be blended: the former is a market-research category
              range whose methodologies may include different mixes of software, infrastructure, and services, while the
              latter attributes a wider software-spending envelope to agent functionality. The same source cautions that
              long-range market estimates vary by two to four times because definitions differ. For underwriting Core,
              these numbers establish category momentum only. A company SAM requires an observable product unit, pricing
              basis, eligible buyer count, compute or services attach, and commercialization horizon. None is public.
              The evidence therefore supports a market-direction view, not a precise TAM/SAM/SOM or revenue-share
              forecast.
            claimRefs:
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM008
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM013
              - CM014
              - CM015
      - number: '2.3'
        title: Buyers, adoption path, and constraints
        blocks:
          - type: paragraph
            body: >-
              The most plausible initial economic buyer is a frontier-model or advanced-research leader who controls R&D
              and compute budgets; researchers and systems engineers would be the users. Adjacent scientific-workbench
              evidence expands the possible buyer set to pharmaceutical, academic, and institutional research teams, but
              does not establish that they would buy Core's undisclosed product. Enterprise adoption data reinforces a
              staged path: Axis aggregates 88% of organizations using AI in at least one function, 62% experimenting
              with agents, 23% scaling agents in one function, and fewer than 10% scaling across multiple functions.
              That widening-to-narrowing pattern is consistent with high interest but difficult production conversion.
              Only 21% are reported to have mature agent governance, and Gartner's forecast, as reproduced by Axis, says
              more than 40% of agentic projects will be canceled by the end of 2027 because of cost, unclear value, and
              weak controls. Core also faces a capital- and talent-intensive supply constraint: its founders described
              one optimized kernel effort as requiring four weeks, about $100,000 of AI compute, and rare expert
              judgment. Adoption therefore depends on measurable research throughput, reproducibility, security,
              infrastructure integration, and ROI proof rather than market enthusiasm alone.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM011
              - CM012
              - CM013
              - CM015
              - CM016
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: A large category does not establish Core's serviceable market
            body: >-
              Treat broad agent forecasts as demand context only. Underwriting needs a disclosed product, buyer, price,
              deployment model, and measured workflow outcome before a Core-specific SAM or SOM can be calculated.
            calloutType: risk
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM009
              - CM010
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant landscape is wider than a conventional software peer set. OpenAI, Anthropic, and Google
              DeepMind are incumbents, talent competitors, and the default suppliers of frontier models and coding
              agents. Thinking Machines Lab, Safe Superintelligence, and AMI Labs are adjacent research-lab entrants
              pursuing alternative paths beyond incumbent scaling. Internal research teams using frontier APIs, human
              systems specialists, and established GPU tooling remain the practical status quo. Glean is not a direct
              model-research peer, but its reported enterprise-AI scale shows the distribution and commercialization
              benchmark that an eventual workflow product would face. This is therefore a contest across research
              architecture, scarce talent, automation tooling, and eventual enterprise distribution rather than one
              settled product category.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP012
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP010
              - CP012
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP004
              - CP008
              - CP012
              - CP014
      - number: '3.2'
        title: Differentiation is an unproven research loop
        blocks:
          - type: paragraph
            body: >-
              Core Automation's proposed wedge is an integrated loop spanning architecture search, optimization, custom
              kernels, and automated experimentation. Founder interviews say current Claude, GPT, and Gemini systems
              could not autonomously solve the cited QR-kernel task, while a human-plus-agent search reportedly reached
              a 60x result after four weeks and about $100,000 of agent compute. That example both sharpens the
              differentiation and exposes the dependency: the company must automate expertise that its own evidence
              still describes as scarce and human-led. The stated ambition to move from one experiment per day toward
              10-200 is a target, not demonstrated throughput. Until repeatable benchmarks show autonomous gains, the
              moat is a research hypothesis rather than a verified capability advantage.
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP007
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP007
              - CP008
              - CP015
      - number: '3.3'
        title: Commercial, pricing, and distribution evidence
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not expose a Core Automation product package, contract model, realized price,
              named buyer, channel, compliance posture, or customer deployment. Accordingly, no defensible price
              comparison or switching-cost estimate is possible. The clearest commercial contrast is maturity:
              incumbents already supply the models and tools Core Automation used as the baseline in its kernel account,
              while Glean's third-party profile reports $300 million of ARR and substantial financing for an adjacent
              enterprise-AI business. An aggregator also reports that Core Automation filed to raise up to $500 million,
              but that is a financing target reported via Axios, not cash raised or commercial traction. Buyers could
              multi-home across APIs or continue internal build unless Core Automation delivers proprietary performance,
              deployability, and trust evidence.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP012
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP008
              - CP009
              - CP012
              - CP016
      - number: '3.4'
        title: Durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Durability depends on iteration speed turning into a reproducible architecture or systems advantage before
              capital-rich incumbents redirect resources. Core Automation's founders argue quarterly release pressure
              makes long-horizon work difficult inside large labs, but that is a timing advantage, not structural
              exclusion; the same incumbents control compute, model distribution, customer relationships, and much of
              the talent pool. Independent adverse evidence also questions whether durable value remains at the model
              layer as token pricing becomes more competitive and frontier economics remain capital intensive. The
              investable proof points are therefore autonomous research throughput, independently reproduced
              performance, proprietary data or kernels, and a commercial route that creates switching cost without
              requiring Core Automation to match incumbent balance sheets.
            claimRefs:
              - CP011
              - CP013
              - CP014
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The moat is not yet demonstrated
            body: >-
              The flagship kernel example still required rare human expertise, four weeks, and substantial agent
              compute; the evidence does not show autonomous or repeatable advantage.
            calloutType: risk
            claimRefs:
              - CP005
              - CP006
              - CP013
          - type: callout
            title: Underwrite milestones, not positioning
            body: >-
              Require independent benchmarks, autonomous experiment throughput, product and pricing disclosure, and
              named deployment evidence before assigning durable differentiation.
            calloutType: recommendation
            claimRefs:
              - CP008
              - CP009
              - CP013
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue evidence and monetization
        blocks:
          - type: paragraph
            body: >-
              Public reporting consistently frames Core Automation as a research lab pursuing automated AI research and
              alternatives to transformer architectures, not as a commercial product vendor with a disclosed price book.
              Across the retained launch coverage, founder-interview recap, and company-tracking page, there is no
              reported revenue, ARR, customer contract, realized price, usage-based tariff, or revenue-recognition
              policy. This absence does not prove that the company has no revenue; it means revenue quality cannot be
              assessed from the available public record. Plausible future mechanisms such as model access, API usage,
              enterprise licensing, or research tooling remain underwriting scenarios rather than established streams.
              Management materials should identify each actual stream, its unit of sale, contracted versus recognized
              revenue, discounts, concentration, and renewal terms before any recurring-revenue multiple is applied.
            claimRefs:
              - CI001
              - CI004
              - CI009
              - CI012
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI004
              - CI009
