      - ["Experiment cadence", "Target of 1 initially and eventually 10-200 per day", "Founders argue release cycles constrain long-shot work", "Unknown in retained evidence", "Organization-specific and unsupported"]
      - ["Commercial distribution", "No product or customer proof retained", "Established models, APIs, and coding tools", "Not established by retained evidence", "Existing internal users but no external distribution"]
      - ["Trust / regulatory posture", "No retained certification or governance evidence", "Not compared by the assigned pool", "Unknown in retained evidence", "Depends on buyer controls"]
    notes: >-
      Qualitative matrix based only on retained sources; unsupported cells are marked unknown,
      and founder assertions are not treated as independent benchmarks.
    claimRefs: [CP001, CP005, CP006, CP007, CP008, CP015]
  - id: TP003
