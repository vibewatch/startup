      - ["Internal build", "Buyer-specific labor, compute, and tooling cost", "Custom research workflow and vendor selection", "No comparable total-cost record", "Preserves control and multi-homing but requires scarce specialists"]
      - [Glean, "ARR disclosed by third party; customer pricing not disclosed", "Enterprise search and AI-assistant category", "Contract and discount structure unavailable", "Shows commercialization scale, not a like-for-like price"]
    notes: >-
      No retained source provides comparable list or realized pricing; ARR is not price, and
      financing is not cash available or customer demand.
    claimRefs: [CP005, CP008, CP009, CP012, CP016]
figures:
  - id: FP001
    title: Evidence-constrained competitive positioning
    type: quadrant
    summary: >-
      Ordinal analyst positioning separates architectural novelty from public commercial
      evidence; it is not a market-share or performance ranking.
    data:
      xAxis: "Architecture departure: 1 = incumbent/application stack; 5 = replacement-architecture thesis"
      yAxis: "Public commercial evidence: 1 = none in pool; 5 = scaled ARR/distribution evidence"
      points:
        - label: Core Automation
          x: 5
          y: 1
          detail: "Strong replacement-architecture thesis; no retained product, pricing, or customer evidence"
        - label: Frontier incumbents
          x: 2
          y: 5
          detail: "Existing models and tools with established distribution; grouped ordinally"
        - label: Thinking Machines Lab
          x: 4
          y: 2
          detail: "Alternative research entrant; limited commercial evidence in this pool"
        - label: Safe Superintelligence
          x: 4
          y: 2
          detail: "Purpose-built research lab; limited commercial evidence in this pool"
        - label: AMI Labs
          x: 4
          y: 2
          detail: "World-model research direction; limited commercial evidence in this pool"
        - label: Glean
          x: 1
          y: 5
          detail: "Application-layer enterprise AI with reported $300M ARR, not a direct architecture peer"
    approximationNotes: >-
      Scores are analyst-authored ordinal categories from cited qualitative evidence, not
      measured performance, market share, or valuation. Equal coordinates indicate
      insufficient evidence to distinguish adjacent labs.
    claimRefs: [CP004, CP008, CP012, CP014]
callouts:
  - calloutType: risk
    title: The moat is not yet demonstrated
    body: >-
      The flagship kernel example still required rare human expertise, four weeks, and
      substantial agent compute; the evidence does not show autonomous or repeatable advantage.
    claimRefs: [CP005, CP006, CP013]
  - calloutType: recommendation
    title: Underwrite milestones, not positioning
    body: >-
      Require independent benchmarks, autonomous experiment throughput, product and pricing
      disclosure, and named deployment evidence before assigning durable differentiation.
    claimRefs: [CP008, CP009, CP013, CP015]
