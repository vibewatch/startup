company:
  name: Core Automation
chapter:
  number: 3
  title: Competitors
  summary: >-
    Core Automation competes first for research talent, compute, and architectural
    breakthroughs rather than for a disclosed commercial category. Its automation-first,
    post-transformer thesis is differentiated from incumbent release cycles, but public
    evidence does not yet establish a product, pricing, customers, switching costs, or a
    durable distribution advantage.
sections:
  - id: competitive-landscape
    title: Competitive landscape and substitutes
    body: >-
      The relevant landscape is wider than a conventional software peer set. OpenAI,
      Anthropic, and Google DeepMind are incumbents, talent competitors, and the default
      suppliers of frontier models and coding agents. Thinking Machines Lab, Safe
      Superintelligence, and AMI Labs are adjacent research-lab entrants pursuing alternative
      paths beyond incumbent scaling. Internal research teams using frontier APIs, human
      systems specialists, and established GPU tooling remain the practical status quo.
      Glean is not a direct model-research peer, but its reported enterprise-AI scale shows
      the distribution and commercialization benchmark that an eventual workflow product
      would face. This is therefore a contest across research architecture, scarce talent,
      automation tooling, and eventual enterprise distribution rather than one settled
      product category.
    claimRefs: [CP002, CP003, CP004, CP005, CP012, CP016]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: differentiated-research-loop
    title: Differentiation is an unproven research loop
    body: >-
      Core Automation's proposed wedge is an integrated loop spanning architecture search,
      optimization, custom kernels, and automated experimentation. Founder interviews say
      current Claude, GPT, and Gemini systems could not autonomously solve the cited QR-kernel
      task, while a human-plus-agent search reportedly reached a 60x result after four weeks
      and about $100,000 of agent compute. That example both sharpens the differentiation and
      exposes the dependency: the company must automate expertise that its own evidence still
      describes as scarce and human-led. The stated ambition to move from one experiment per
      day toward 10-200 is a target, not demonstrated throughput. Until repeatable benchmarks
      show autonomous gains, the moat is a research hypothesis rather than a verified
      capability advantage.
    claimRefs: [CP001, CP005, CP006, CP007, CP013]
    tableRefs: [TP002]
  - id: commercial-and-distribution-comparison
    title: Commercial, pricing, and distribution evidence
    body: >-
      The retained evidence does not expose a Core Automation product package, contract
      model, realized price, named buyer, channel, compliance posture, or customer deployment.
      Accordingly, no defensible price comparison or switching-cost estimate is possible.
      The clearest commercial contrast is maturity: incumbents already supply the models and
      tools Core Automation used as the baseline in its kernel account, while Glean's
      third-party profile reports $300 million of ARR and substantial financing for an
      adjacent enterprise-AI business. An aggregator also reports that Core Automation filed
      to raise up to $500 million, but that is a financing target reported via Axios, not cash
      raised or commercial traction. Buyers could multi-home across APIs or continue internal
      build unless Core Automation delivers proprietary performance, deployability, and trust
      evidence.
    claimRefs: [CP008, CP009, CP010, CP012, CP015, CP016]
    tableRefs: [TP003]
  - id: durability-and-displacement-risk
    title: Durability and displacement risk
    body: >-
      Durability depends on iteration speed turning into a reproducible architecture or
      systems advantage before capital-rich incumbents redirect resources. Core Automation's
      founders argue quarterly release pressure makes long-horizon work difficult inside
      large labs, but that is a timing advantage, not structural exclusion; the same
      incumbents control compute, model distribution, customer relationships, and much of
      the talent pool. Independent adverse evidence also questions whether durable value
      remains at the model layer as token pricing becomes more competitive and frontier
      economics remain capital intensive. The investable proof points are therefore
      autonomous research throughput, independently reproduced performance, proprietary
      data or kernels, and a commercial route that creates switching cost without requiring
      Core Automation to match incumbent balance sheets.
    claimRefs: [CP011, CP013, CP014, CP016]
