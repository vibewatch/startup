  evidenceGaps:
    - type: missing-source
      severity: material
      topic: legal-verification
      missingEvidence: >-
        Direct corporate and securities filings, court dockets, regulator records,
        sanctions screening, export-control analysis, and management representations.
      whyItMatters: >-
        Secondary reporting cannot establish the financing terms or whether litigation,
        enforcement, sanctions, or licensing obligations exist.
      diligencePath: >-
        Obtain the filed documents and cap table, run counsel-led searches in relevant
        jurisdictions, and reconcile results with signed management representations.
      relatedQuestionRefs: [QR002, QR009]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: operational-controls
      missingEvidence: >-
        Secure-development lifecycle, model and code evaluation records, security tests,
        incident and outage history, rollback controls, data lineage, and audit reports.
      whyItMatters: >-
        Automated research and code generation can scale both output and undetected
        defects, while public evidence does not establish Core Automation's safeguards.
      diligencePath: >-
        Conduct technical and security diligence, sample experiment and code-review
        records, inspect incidents and remediation, and test approval and rollback gates.
      relatedQuestionRefs: [QR003, QR009]
    - type: private-evidence-only
      severity: material
      topic: financial-risk
      missingEvidence: >-
        Cash balance, monthly burn, committed compute, hiring obligations, financing
        proceeds, debt or preference terms, and milestone-based runway.
      whyItMatters: >-
        Funding raised is not cash available, and the public evidence cannot quantify how
        long the company can fund a compute- and talent-intensive research plan.
      diligencePath: >-
        Reconcile bank statements, financing documents, payroll and compute commitments,
        then model runway under base and downside technical schedules.
      relatedQuestionRefs: [QR005, QR010]
    - type: enumeration-incomplete
      severity: material
      topic: dependency-concentration
      missingEvidence: >-
        Supplier, cloud, hardware, investor, employment, customer, and design-partner
        agreements with concentration, termination, renewal, and change-of-control terms.
      whyItMatters: >-
        The public pool identifies dependency categories but cannot quantify concentration
        or the company's ability to replace a failed counterparty.
      diligencePath: >-
        Build a counterparty schedule from contracts and spend data, quantify each
        dependency, and test replacement time and cost under failure scenarios.
      relatedQuestionRefs: [QR004, QR007, QR008]
