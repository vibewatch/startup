callouts:
  - calloutType: recommendation
    title: Investment control
    body: >-
      Do not underwrite reported funding, elite hiring, or experiment throughput as proof
      of runway, product readiness, or control maturity. Require a primary financing
      reconciliation, reproducible technical milestones, and documented governance before
      increasing conviction.
    claimRefs: [CR003, CR005, CR008, CR010, CR015, CR016]
