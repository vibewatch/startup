      - Jurisdiction or scope
      - Evidence status
      - Likelihood
      - Severity
      - Mitigation and diligence path
      - Residual exposure
    rows:
      - - AI governance and trustworthiness controls
        - Product lifecycle; jurisdictions depend on deployment
        - NIST provides a voluntary framework; company implementation is not public
        - Medium
        - High
        - Map governance, evaluation, monitoring, and accountability controls to the NIST AI RMF
        - High until controls and evidence are reviewed
      - - Privacy, training-data, and intellectual-property rights
        - United States and any customer or data-source jurisdictions
        - Gartner identifies privacy, IP protection, trust, and emerging regulation as adoption obstacles
        - Medium
        - High
        - Review data provenance, licenses, invention assignment, privacy impact assessments, and customer terms
        - High because policies and rights are not in the assigned evidence
      - - Financing and securities filings
        - United States
        - Secondary report says an SEC filing sought up to $500 million; underlying filing is absent
        - Medium
        - High
        - Obtain and reconcile the filing, board approvals, offering terms, cap table, and cash proceeds
        - High until primary records reconcile the reported financing
      - - Litigation, enforcement, sanctions, and export controls
        - United States and compute, employee, and deployment locations
        - No direct docket, order, or sanctions record was allocated to this chapter
        - Unknown
        - High
        - Run counsel-led court, regulator, sanctions, and export-control searches and obtain management representations
        - Unquantified; absence of allocated evidence is not evidence of absence
    notes: >-
      Partial register based only on assigned prefetched evidence through 2026-10-21;
      likelihood and severity are analytical assessments tied to cited evidence and stated
      gaps, not legal conclusions.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly visible regulatory and legal exposure categories supported or left open
        by the assigned source pool as of the report run date.
    claimRefs: [CR004, CR010, CR011]
  - id: TR002
    title: Operational, quality, and security risk register
    columns:
      - Failure mode
      - Evidence
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure and monitor
    rows:
      - - Architecture or kernel automation does not bootstrap
        - Founders say current tools cannot solve the target kernel task from scratch
        - High
        - Critical
        - Unverified
        - High; track independently reproduced kernels, accepted experiments, and expert hours
      - - Experiment speed is mistaken for valid research output
        - Reported 60x result was workload-specific and used rare expertise plus substantial agent compute
        - Medium
        - High
        - Early evidence only
        - High; require reproducibility, baselines, error bars, and external replication
      - - Automated code volume overwhelms review and security controls
        - Anthropic-reported automation increased shipped code while creating more review work
        - Medium
        - High
        - Not public for Core Automation
        - High; monitor escaped defects, rollback rate, review latency, and vulnerability closure
      - - Compute or specialist capacity interrupts the research loop
        - Costs are reported as concentrated in compute and frontier talent
        - Medium
        - High
        - No public redundancy plan
        - High; review capacity contracts, alternatives, retention, and cost per validated result
    notes: >-
      Assessments synthesize company-attributed technical statements and independent
      reporting; Core Automation has not published the control metrics needed to validate
      mitigation maturity.
    claimRefs: [CR002, CR007, CR008, CR009, CR013, CR014]
  - id: TR003
    title: Partner, dependency, and financial risk register
    columns:
      - Dependency
      - Counterparty or role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Frontier research and systems talent
        - Founders and recruits from major AI labs
        - Named recruitment is visible; role coverage and retention terms are not
        - Departure or bottleneck among a small number of experts slows architecture work
        - Critical
        - Key-person mapping, succession, retention, documentation, and bus-factor targets
        - High
      - - Accelerators, cloud, and custom-kernel expertise
        - Hardware vendors, cloud providers, and rare systems specialists
        - Cost is reported as compute-heavy; supplier contracts are not public
        - Capacity, price, or expertise constraint prevents reproducible experimentation
        - High
        - Multi-provider capacity, spend caps, portable kernels, and contracted alternatives
        - High
      - - External financing
        - Existing and prospective investors
        - Reported financing is not a cash-balance or runway disclosure
        - Capital closes late or on terms that do not fund the next validated milestone
        - Critical
        - Board-approved runway plan, committed proceeds, downside budget, and milestone financing
        - High
      - - Enterprise commercialization
        - Future customers, integrators, and procurement teams
        - No public product or pricing was reported as of May 2026
        - Integration, data quality, cost, or governance friction prevents conversion to revenue
        - High
        - Design partners, paid pilots, integration controls, ROI baselines, and renewal evidence
        - High
    notes: >-
      Concentration cannot be quantified from the assigned evidence because supplier,
      customer, employment, financing, cash, burn, and runway schedules are private or
      unavailable.
    claimRefs: [CR002, CR003, CR005, CR007, CR011, CR012, CR015, CR016]
