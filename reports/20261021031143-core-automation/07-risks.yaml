schemaVersion: "report-v2"
artifact: risks
slug: core-automation
runDate: 2026-10-21
company:
  name: Core Automation
chapter:
  number: 7
  title: Risks
  summary: >-
    Core Automation's highest residual risk is execution: a pre-commercial, compute- and
    talent-intensive lab must automate a technically difficult research loop before
    capital, scarce expertise, or integration friction constrains progress. Public
    evidence does not establish the company's legal, security, incident, customer, or
    concentration posture, so those areas remain diligence requirements rather than
    evidence of either compliance or failure.
sections:
  - id: risk-ranking
    title: Risk ranking and evidence boundary
    body: >-
      The evidence supports a high residual execution risk, not a finding of misconduct
      or technical failure. Sacra describes Core Automation as pre-revenue and
      pre-commercial as of May 2026, with costs concentrated in frontier research talent
      and compute, while the founders describe custom-kernel work that still required
      rare human expertise, four weeks, and substantial agent-compute expense. That
      combination puts architecture execution, financing continuity, and expert
      availability ahead of legal-event risk in the ranking. The assigned evidence pool
      contains no direct court docket, regulator order, security audit, incident history,
      customer contract, or supplier agreement; absence from this bounded pool is not
      proof that no such item exists. The matrix therefore scores evidence-backed
      exposure and marks control maturity as unverified where the underlying controls
      are private.
    claimRefs: [CR001, CR002, CR007, CR008, CR009, CR016]
    figureRefs: [FR001]
  - id: regulatory-legal
    title: Regulatory, legal, privacy, and IP exposure
    body: >-
      The primary legal issue is readiness, not a documented enforcement event. NIST's
      voluntary AI Risk Management Framework provides a concrete governance baseline for
      trustworthiness across design, development, use, and evaluation. Gartner separately
      identifies emerging regulation, privacy, intellectual-property protection, and
      trust as adoption obstacles for generative AI systems. An AI Market Watch item
      reports an SEC filing to raise up to $500 million, but the assigned pool does not
      include the underlying filing, so its existence, issuer identity, amount, and terms
      require direct verification. Before investment, counsel should review corporate and
      financing filings, invention assignment, training-data rights, privacy controls,
      export controls, and any current or threatened disputes. These checks are
      particularly important if continuously learning systems ingest customer or
      proprietary data after deployment.
    claimRefs: [CR004, CR010, CR011]
    tableRefs: [TR001]
  - id: operational-technical
    title: Operational, quality, and security risk
    body: >-
      The technical thesis contains a bootstrapping problem: the lab seeks to automate
      research, yet its founders say novel architectures depend on custom kernels that
      current coding tools cannot produce autonomously from scratch. Their reported
      competition result demonstrates potential acceleration but also required a rare
      expert, about $100,000 of agent-compute expense, and four weeks for the target
      workload. External evidence from Anthropic's automation experience illustrates the
      control challenge at scale: company-reported automated coding volume increased
      sharply, creating more review work, while VentureBeat highlights the possibility
      that undetected errors can compound across agent sessions. Core Automation has not
      publicly demonstrated its own secure-development lifecycle, evaluation gates,
      rollback process, incident response, or reliability record in the assigned pool.
      Those controls should be tested before treating experiment throughput as durable
      research productivity.
    claimRefs: [CR007, CR008, CR009, CR013, CR014]
    tableRefs: [TR002]
  - id: dependencies-financial
    title: Partner, talent, capital, and commercialization dependencies
    body: >-
      Core Automation depends on inputs it does not fully control: scarce systems
      researchers, specialized accelerators and cloud capacity, continued financing, and
      eventual enterprise adoption. Business Insider and its Yahoo Finance syndication
      document recruitment from Anthropic and Google DeepMind, confirming access to
      strong talent but also implying key-person and retention exposure. Sacra reports
      $100 million of confirmed primary financing as of May 2026; that is funding raised,
      not cash available, and no public burn or runway denominator is supplied. It also
      reported no public API, pricing page, signup flow, or commercial product at that
      time. Gartner's evidence that buyers face uneven returns, difficult integration,
      unpredictable costs, and data-quality problems makes the transition from internal
      lab tooling to external revenue a separate execution hurdle rather than an automatic
      extension of technical progress.
    claimRefs: [CR003, CR005, CR011, CR012, CR015, CR016]
    tableRefs: [TR003]
  - id: mitigations-kill-criteria
    title: Mitigations, monitoring indicators, and thesis-break triggers
    body: >-
      Mitigation should be milestone-based. Technical monitoring should track reproducible
      experiment throughput, expert hours per validated kernel, compute cost per accepted
      result, rollback frequency, and independent benchmark replication. Governance
      monitoring should require a NIST-aligned risk register, documented data lineage,
      security testing, human approval boundaries, incident reporting, and counsel review
      of privacy, IP, export-control, employment, and financing obligations. Financial
      monitoring should reconcile cash, committed compute, monthly burn, hiring
      obligations, financing proceeds, and runway; reported funding cannot substitute for
      this schedule. Thesis-break triggers are failure to reproduce the claimed systems
      gains, repeated control failures or material incidents, inability to secure compute
      or retain critical experts, financing that does not extend runway through a
      independently validated milestone, or continued absence of a credible
      commercialization path after technical proof. Missing evidence should pause
      underwriting rather than be converted into a favorable assumption.
    claimRefs: [CR003, CR008, CR010, CR011, CR012, CR014, CR015, CR016]
