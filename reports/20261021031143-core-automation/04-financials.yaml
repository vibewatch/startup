    notes: >-
      No retained source establishes list or realized pricing; every unavailable field requires
      management documentation rather than an analyst estimate.
    claimRefs: [CI002, CI004, CI009, CI012]
  - id: TI003
    title: Unit economics and capital-readiness gaps
    columns:
      - Metric
      - Public value/status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Revenue or ARR, "Not disclosed", "Low", "Sets the scale and recurrence of demand", "Monthly recognized revenue, ARR bridge, and customer concentration"]
      - [Gross margin, "Not disclosed", "Low", "Tests whether compute and service costs scale economically", "Revenue-to-gross-profit reconciliation by stream"]
      - [CAC and payback, "Not disclosed", "Low", "Tests sales efficiency and financing needs", "Sales spend, cycle, conversion, and cohort payback"]
      - [Research compute, "One reported kernel effort used about $100,000 of AI-agent compute over four weeks", "Medium; project-specific company claim", "Shows experimentation can be material before commercialization", "Monthly training, inference, and experimentation spend by project"]
      - [Cash burn and runway, "Not disclosed", "Low", "Determines time available to reach technical and commercial milestones", "Cash balance, monthly net burn, committed spend, debt, and runway"]
    notes: >-
      Public values are not normalized unit economics; the kernel figure is a project-specific
      founder claim, while all other unavailable values remain explicit diligence gaps.
    claimRefs: [CI007, CI008, CI010, CI013, CI014, CI015]
