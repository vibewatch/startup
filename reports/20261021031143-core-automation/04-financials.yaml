artifact: financials
slug: core-automation
runDate: 2026-10-21
company:
  name: Core Automation
chapter:
  number: 4
  title: Financials
  summary: >-
    Core Automation is still financially underwritable from public evidence: the retained
    sources describe a research lab, costly technical experiments, elite hiring, and a reported
    filing to raise up to $500 million, but do not disclose revenue, pricing, customers, gross
    margin, cash, burn, or runway. The financial case therefore rests on future technical proof
    and financing access rather than demonstrated revenue quality or unit economics.
sections:
  - id: revenue-and-monetization
    title: Revenue evidence and monetization
    body: >-
      Public reporting consistently frames Core Automation as a research lab pursuing automated
      AI research and alternatives to transformer architectures, not as a commercial product
      vendor with a disclosed price book. Across the retained launch coverage, founder-interview
      recap, and company-tracking page, there is no reported revenue, ARR, customer contract,
      realized price, usage-based tariff, or revenue-recognition policy. This absence does not
      prove that the company has no revenue; it means revenue quality cannot be assessed from the
      available public record. Plausible future mechanisms such as model access, API usage,
      enterprise licensing, or research tooling remain underwriting scenarios rather than
      established streams. Management materials should identify each actual stream, its unit of
      sale, contracted versus recognized revenue, discounts, concentration, and renewal terms
      before any recurring-revenue multiple is applied.
    claimRefs: [CI001, CI004, CI009, CI012]
    tableRefs: [TI001, TI002]
  - id: costs-and-unit-economics
    title: Cost structure and unit economics
    body: >-
      The most concrete company-specific cost signal is technical rather than accounting data.
      A founder-interview recap describes a human-plus-AI kernel effort that cost approximately
      $100,000 in agent compute over four weeks and achieved a reported 60x speedup for selected
      QR-decomposition shapes. The same recap describes an ambition to move from at least one
      architecture experiment per day toward 10 to 200 per day. Those figures are not company
      burn, cost of revenue, or a forecast, but they indicate that the operating model can consume
      meaningful compute before a sale occurs. Independent reporting also describes competition
      for senior AI talent, with salary, equity, compute access, and research autonomy used as
      recruiting levers. Without payroll, cloud commitments, owned infrastructure, or product
      delivery data, gross margin and contribution margin remain unavailable.
    claimRefs: [CI005, CI006, CI007, CI008, CI013, CI015]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and financing dependency
    body: >-
      AI Market Watch reported that Core Automation filed with the SEC to raise up to $500
      million, citing Axios. That is a financing target reported through a secondary tracker; it
      is not evidence that the amount was raised, that proceeds are unrestricted cash, or that
      capital remains available on the run date. No retained source supplies cash on hand, monthly
      net cash burn, runway, debt, project-finance obligations, planned use of funds, or a
      next-round trigger. Sector evidence reinforces why those distinctions matter: one
      lower-reputation analysis reported substantial OpenAI quarterly spending and losses, while
      TechCrunch reported more than $40 billion of Nvidia AI equity commitments in early 2026 and
      noted criticism of circular supplier-customer investment. These are context, not Core
      Automation estimates. Capital adequacy must be tested from bank balances, obligations, and a
      monthly operating plan.
    claimRefs: [CI003, CI010, CI011, CI014]
  - id: verdict-and-diligence
    title: Financial verdict and diligence priorities
    body: >-
      The financial verdict is research-stage and evidence-constrained. Core Automation may have
      a differentiated technical thesis and strong recruiting signal, but neither establishes a
      monetizable product, repeatable demand, attractive gross margin, or sufficient runway. The
      reported financing filing could support a large capital plan, yet the maximum sought cannot
      be treated as proceeds received. Underwriting should therefore avoid ARR, revenue-growth,
      CAC-payback, or gross-margin assumptions until management provides source documents.
      Priority requests are monthly revenue by customer and stream, signed contracts and pipeline,
      realized pricing, compute and payroll spend, gross-margin reconciliation, cash and debt
      schedules, and a 24-month hiring and compute plan. The key investability question is whether
      technical milestones can create a priced customer outcome before research costs and scarce
      talent require another financing event.
    claimRefs: [CI003, CI007, CI009, CI012, CI013, CI014, CI015, CI016]
    figureRefs: [FI001]
