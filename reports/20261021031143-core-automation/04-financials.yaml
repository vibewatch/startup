callouts:
  - calloutType: risk
    title: Financing target is not liquidity
    body: >-
      The reported filing to raise up to $500 million should not be treated as funding raised,
      cash available, or runway. Obtain the primary filing, closing documents, bank evidence, and
      committed-spend schedule before assessing capital sufficiency.
    claimRefs: [CI003, CI014]
