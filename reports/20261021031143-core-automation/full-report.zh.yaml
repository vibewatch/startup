  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 竞争格局与替代方案
        blocks:
          - type: paragraph
            body: >-
              relevant 格局 is 更宽泛的 than 传统的 software 同业集合. OpenAI， Anthropic， 与 Google DeepMind are 现有巨头， 人才 competitors，
              与 default 供应商 的 前沿 模型 与 编程 智能体. Thinking Machines 实验室， Safe Superintelligence， 与 AMI Labs are 相邻的 研究-实验室
              进入者 pursuing alternative 路径 超越 现有巨头 规模化. 内部 研究 团队 使用 前沿 APIs， human 系统 专家， 与 既有的 GPU 工具链 仍是 实际的 状态 quo.
              Glean is 不 direct 模型-研究 peer， 但 its 据报道 企业-AI 扩展 显示 distribution 与 商业化 基准 that 最终 工作流 产品 would face. This
              is 因此 竞争 across 研究 架构， 稀缺的 人才， 自动化 工具链， 与 最终 企业 distribution 而不是 one 确定的 产品 category.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP012
