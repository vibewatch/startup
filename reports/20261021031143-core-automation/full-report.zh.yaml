      - number: '7.4'
        title: 合作伙伴、人才、资本与商业化依赖
        blocks:
          - type: paragraph
            body: >-
              Core Automation 取决于 在 投入要素 it does 不 完全控制： 稀缺的 系统 研究人员， 专用的 accelerators 与 cloud capacity， 持续的 融资， 与 最终 企业
              采用. Business Insider 与 its Yahoo Finance syndication document recruitment 来自 Anthropic 与 Google DeepMind，
              confirming 访问 至 强劲 人才 但 也 意味着 key-person 与 留任 暴露. Sacra reports $100 million 的 已确认 主要 融资 作为 的 May 2026；
              that is 融资 raised， 不 现金 可用， 与 无 公开 burn 或 现金跑道 分母 is supplied. It 也 据报道未见公开 API、定价 page、signup flow 或 商业的
              产品 于 that time. Gartner's 证据 that 买方 face 不均衡 回报， difficult 整合， 不可预测的 成本， 与 data-质量 problems 使 过渡 来自 内部
              实验室 工具链 至 外部 收入 区分 execution 障碍 而不是 automatic extension 的 技术 progress.
            claimRefs:
              - CR003
              - CR005
              - CR011
              - CR012
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR007
              - CR011
              - CR012
              - CR015
              - CR016
      - number: '7.5'
        title: 缓释措施、监测指标与论点失效触发条件
        blocks:
          - type: paragraph
            body: >-
              Mitigation should be 里程碑-based. 技术 监测 should track reproducible 实验 吞吐量， expert hours per validated 内核， 算力
              成本 per accepted result， 回滚 frequency， 与 独立 基准 replication. 治理 监测 should 要求 NIST-契合 风险 register， documented
              数据血缘、安全测试、人类审批边界、事件报告，以及法律顾问对隐私、IP、出口管制、 employment， 与 融资 义务. Financial 监测 should reconcile 现金， committed
              算力， monthly burn， hiring 义务， 融资 募集资金， 与 现金跑道； 据报道 融资 cannot substitute 为 this schedule. 主张-break triggers
              are failure 至 reproduce claimed 系统 gains， repeated control failures 或 重大 incidents， inability 至 secure 算力
              或 retain critical experts， 融资 that does 不 extend 现金跑道 截至 independently validated 里程碑， 或 持续的 absence 的 可信
              商业化 path 之后 技术 证明. 缺少 证据 should pause 投资判断 而不是 be converted into favorable assumption.
            claimRefs:
              - CR003
              - CR008
              - CR010
              - CR011
              - CR012
              - CR014
              - CR015
              - CR016
      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Investment control
            body: >-
              Do 不 纳入投资判断 据报道 融资， elite hiring， 或 实验 吞吐量 作为 证明 的 现金跑道， 产品 准备度， 或 control 成熟度. 要求 主要 融资 核对， reproducible
              技术 milestones， 与 documented 治理 之前 increasing conviction.
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR005
              - CR008
              - CR010
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 投资判断
        blocks:
          - type: paragraph
            body: >-
              Core Automation 将……呈现为 可信 研究 主张 与 异常地 强劲 人才 信号， 但 公开 证据尚未证明 商业的 资产 that can be underwritten 于 所引述的 $4.0
              billion 估计. Business Insider documented senior 招聘 来自 Anthropic 与 Google DeepMind， while syndicated Sequoia
              播客 描述 deliberate attempt 至 replace transformer-era constraints 与 continual learning 与 自动化的
              experimentation. Those 信号 支持 技术 option 价值， 不 经常性 收入， 客户 留任， 可辩护的 margins， 或 流动性. appropriate
              recommendation is 研究-更多 与 低 confidence 与 高 风险： diligence should test whether 研究 velocity converts into 专有的
              能力 与 paid 需求 之前 treating 人才 密度 作为 估值 支持.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV008
              - CV011
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
