              公开 报道 一贯地 frames Core Automation 作为 研究 实验室 pursuing 自动化的 AI 研究 与 alternatives 至 transformer 架构， 不 作为 商业的
              产品 供应商 与 披露 价格 book. Across retained 发布 覆盖， 创始人-访谈 recap， 与 公司-tracking page， there is 无 据报道 收入， ARR， 客户
              合同， 实际实现的 价格， usage-based tariff， 或 收入-recognition 政策. This absence does 不 prove that 公司 has 无 收入； it 意味着
