  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：研究自动化，而非整个智能体经济
        blocks:
          - type: paragraph
            body: >-
              Core Automation's 披露的目标 is 至 optimize 与 自动化 工作 从……开始 与 研究， while its 创始人 frame continual learning 与
              post-transformer 架构 发现 作为 技术 路径. That 将……置于 公司 第一 在 前沿-模型 R&D 基础设施： 实验 design， 系统 code， 内核 工作， 评估， 与
              模型-learning 循环 使用 由 highly 技术 研究 团队. 更广泛的 企业-智能体 市场 is 相邻市场， 不 可辩护的 measure 的 Core's present 可服务的 收入. 科学
              工作流产品，例如 Claude Science，显示研究组织可以买入集成式 AI 工作台，但它们解决的是工作流编排和现有模型 而不是 Core's 所述 架构-替代 问题. 状态-quo 替代方案 include
              内部 研究 engineers， 现有巨头 前沿-实验室 工具链， 通用的 编程 智能体， 传统的 training pipelines， 与 人工的 实验 审查. 公开 记录 仍 描述 Core 作为
              pre-产品， 与 分销渠道 未定义 与 无 database 信号 为 ARR 或 估值； those 缺失 阻止 buyer-based 公司 TAM 来自 being 推断.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM007
              - CM011
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
