              - CM011
              - CM012
      - number: '2.2'
        title: 规模测算显示需求，但不能证明 Core 能捕获的市场
        blocks:
          - type: paragraph
            body: >-
              Axis Intelligence 汇总 2026 全球 AI-智能体 市场 估计 的 $10.9-$11.8 billion 与 43%-49% CAGR 区间 截至 2030， while 也 报道
              Gartner's much 更大的 $206.5 billion 估计 为 2026 AI-智能体 software 支出. These 数字 should 不 be 混合： 前 is 市场-研究
              category range whose 方法论 may include 不同 组合 的 software， 基础设施， 与 服务， while latter 归因于 更宽泛的 software-支出 范围 至
              智能体 functionality. 同一 来源 警告 that 长期 市场 estimates 变化 由 two 至 four times because 定义 differ. 为 投资判断 Core，
              these numbers 证明 品类势头 仅. 公司 SAM 需要 observable 产品 单位， 定价 依据， 符合条件的 buyer 数量， 算力 或 服务 附加销售， 与 商业化 周期. None
              is 公开. 证据 因此 支持 市场-方向 view， 不 精确的 TAM/SAM/SOM 或 收入-share 预测.
            claimRefs:
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM008
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM013
              - CM014
              - CM015
      - number: '2.3'
        title: 买方、采用路径与约束
        blocks:
          - type: paragraph
            body: >-
              most 合理 初始 经济买方 is 前沿-模型 或 高级-研究 leader who 控制措施 R&D 与 算力 预算； 研究人员 与 系统 engineers would be 用户. 相邻的
              科学-workbench 证据 expands 可能 buyer set 至 制药， 学术， 与 机构 研究 团队， 但 does 不 证明 that they would buy Core's
              undisclosed 产品. 企业 采用 data reinforces 分阶段的 path： Axis 汇总 88% 的 组织 使用 AI 在 至少一个 function， 62% 试用 与 智能体， 23%
              规模化 智能体 在 one function， 与 fewer than 10% 规模化 across multiple 职能. That widening-至-narrowing 模式 is
              consistent 与 高 兴趣 但 difficult 生产转化. 仅 21% are 据报道 至 have 成熟的 智能体 治理， 与 Gartner's 预测， 作为 reproduced 由 Axis，
              称 更多 than 40% 的 agentic projects will be 取消 由 end 的 2027 because 的 成本， unclear 价值， 与 控制薄弱. Core 也 faces
              资本- 与 人才-intensive 提供 constraint： its 创始人 described one optimized 内核 effort 作为 requiring four 周， 约 $100000
              的 AI 算力和稀缺专家判断。采用因此取决于可量化的研究吞吐量、可复现性、安全性、基础设施整合与 ROI 证明，而不是市场热情。
            claimRefs:
