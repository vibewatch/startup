companyProfile:
  summary: >-
    Core Automation is San Francisco 前沿-AI 研究 实验室 成立 由 Jerry Tworek 与 Rohan Anil. It is pursuing continual， test-time
    learning 与 自动化的 研究 stack 覆盖 架构 search， 优化， custom 内核， 与 experimentation. 公开 记录 支持 强劲 人才 信号 与 具体 技术 主张， 但 仍 描述 研究-阶段
    公司 没有 经验证的 客户-ready 产品， 外部 客户 基础， 定价， 或 经常性 收入.
