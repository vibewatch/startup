      - number: '3.2'
        title: 差异化仍是未经验证的研究闭环
        blocks:
          - type: paragraph
            body: >-
              Core Automation's proposed 切入点 is 集成的 loop 覆盖 架构 search， 优化， custom 内核， 与 自动化的 experimentation. 创始人
              interviews say 当前 Claude， GPT， 与 Gemini 系统 could 不 autonomously solve 所引述的 QR-内核 task， while 人机协同搜索据报道在
              four 周后取得 60x 结果，投入约 $100000 的智能体算力。这一案例既强化了 differentiation 与 暴露 依赖： 公司 must 自动化 专业能力 that its own 证据 仍
              描述 作为 稀缺的 与 human-led. 所述 雄心 至 move 来自 one 实验 per day toward 10-200 is 目标， 不 已展示的 吞吐量. Until 可重复
              benchmarks 显示 自主的 gains， 护城河 is 研究 假设 而不是 经验证的 能力 advantage.
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP007
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP005
