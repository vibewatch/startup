              - CV009
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              融资记录相互矛盾，无法据此确定入场价格。QuantLogix 给出 $4.0 billion 估值，但将置信度标为低，最新融资也只标作拟议 Series A；AI Market Watch 后来援引 Axios
              报道，公司已提交文件，拟融资最高 $500 million。4
              月的一篇文章称当时尚未宣布融资轮次，这只能补充时间线，不能确认之后已经交割。留存来源均未提供股权结构表、领投方、清算优先权、债务、可用现金或明确的投后估值。因此，只有取得一手融资文件并按完全稀释口径测算持股，才能严守入场纪律；公开记录不足以支撑目标回报或经稀释调整的持股判断。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
      - number: '8.3'
        title: 情景与可比背景
        blocks:
          - type: paragraph
            body: >-
              Broad AI 需求 is real 但 cannot substitute 为 公司-level 证明. Gartner forecasts $2.59 trillion 的 worldwide AI 支出
              在 2026， 尚 也 称 基础设施 will account 为 更多 than 45% 与 that enterprises 仍 favor 战术性的， 增量的 initiatives. 前沿-实验室
              reference points are equally cautionary： Forbes contributor article 据报道 very 大型 OpenAI 运营 亏损 relative 至
              收入， 与 CNBC quoted Yann LeCun warning that 实验室 经济性 要求 higher prices 或 lower 成本. These references frame 资本
              intensity 与 multiple-compression 风险； they are 不 交易可比案例 为 Core Automation. 乐观， 基础， 与 悲观 cases 因此 使用
              observable milestones， 与 numeric 估值 ranges 推迟 until 融资 与 运营 data are 可用.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 退出准备度与论点失效条件
        blocks:
          - type: paragraph
            body: >-
              QuantLogix 报告称，Core Automation 仍是私营公司，也没有公开 S-1，因此没有证据支持以 IPO
              时间表作为近期流动性来源。尽调必须拿到一手融资记录、完全稀释后的股权结构、优先股堆叠、现金与已承诺的算力义务、审计或管理层财务数据、客户合同、留存数据、部署经济性以及可复现的技术基准。只有这些材料证明公司具备可重复的能力优势、已有付费采用，且融资条款不会吞噬普通股上行空间，投资论点才会增强。如果其声称的自动化仍依赖专家、客户证据仍然缺失，或融资流程证实实际经济性明显差于公开的
              $4.0 billion 估值所暗示的水平，投资论点就不成立。
            claimRefs:
              - CV007
              - CV008
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 价格 discipline
            body: >-
              Treat published $4.0B figure 作为 低-confidence reference. 要求 主要 融资， capitalization， 运营， 客户， 与 基准 证据 之前
              setting 价格 或 return 目标.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV013
              - CV014
          - type: callout
            title: 主张-break trigger
            body: 退出 if 自主的研究 gains cannot be reproduced，paid 需求仍是 unverified，或融资优先股堆叠与算力义务吞噬普通股上行空间。
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV011
              - CV012
              - CV013
