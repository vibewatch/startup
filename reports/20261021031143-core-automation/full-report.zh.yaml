  - id: TV003
    title: 乐观、基准和悲观情景
    columns:
      - 情景
      - 明确假设
      - 估值与回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 自主研究产出变得可复现；付费部署显示出留存；融资条款清晰。
        - 目前无法支持任何数值区间；只有在商业和技术 里程碑获核实后，才可重新考虑溢价。
        - 只有一手指标和合同同时证实能力与需求时，判断才会增强。
        - 基准结果无法复现，或试点未转化。
      - - 基准
        - 研究进展延续，但产品、客户和单位经济性证据仍有限。
        - 暂缓给出区间和目标回报；将 $4.0B 估算视为未经核实的参考，而非入场锚点。
        - 当前公开证据最支持继续尽调。
        - 融资完成时包含损害普通股权益的持股或优先权条款。
      - - 悲观
        - 自动化仍依赖专家，同时前沿实验室成本上升、行业倍数收缩。
        - 没有现金义务和股权表数据，无法界定下行；避免给出精确估值。
        - 若一手融资或经营证据仍不可得，判断转弱。
        - 在可复现能力或付费需求出现前，资本需求上升。
    notes: 情景估值刻意不使用数字，因为保留来源未提供经核实的收入、 利润率、消耗、跑道、完全摊薄持股或优先权条款。
