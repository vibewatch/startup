      - number: '3.4'
        title: 持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              持久性 取决于 在 iteration speed turning into reproducible 架构 或 系统 advantage 之前 资本-rich 现有巨头 重新调配 资源. Core
              Automation's 创始人 argue quarterly 发布 压力 使 long-周期 工作 difficult inside 大型 labs， 但 that is 时间优势， 不 结构性排除； 同一
              现有巨头掌握算力、模型分发、客户关系和更大的 人才池。独立反向证据也质疑，持久价值是否仍在 于 模型 layer 作为 token 定价 becomes 更多 competitive 与 前沿 经济性 仍是 资本
              intensive. 可投资的 验证点 are 因此 自主的 研究 吞吐量， 独立复现 性能、专有数据或内核，以及无需 Core Automation 匹配现有巨头资产负债表也能创造切换成本的商业路径。
              balance sheets.
            claimRefs:
              - CP011
              - CP013
              - CP014
              - CP016
