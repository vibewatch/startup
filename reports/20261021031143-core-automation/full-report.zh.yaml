            body: >-
              retained 证据 does 不 expose Core Automation 产品 产品包， 合同 模型， 实际实现的 价格， 具名买方， 渠道， compliance 状态， 或 客户 部署.
              因此无法做出有依据的价格比较或切换成本估计。最清晰的商业对比在成熟度：现有巨头已经提供 Core Automation tools Core Automation 使用 作为 baseline 在 its 内核
              account， while Glean's 第三方 资料页 reports $300 million 的 ARR 与 substantial 融资 为 相邻的 企业-AI 业务. aggregator 也
              reports that Core Automation filed 至 raise up 至 $500 million， 但 that is 融资 目标 据报道 via Axios， 不 现金 raised 或
              商业的 牵引力. 买方 could 多家采购 across APIs 或 continue 内部 构建 unless Core Automation 交付 专有的 performance， 可部署性， 与 信任
