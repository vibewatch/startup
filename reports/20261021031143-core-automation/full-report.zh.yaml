        blocks:
          - type: paragraph
            body: >-
              Core Automation 将……呈现为 自身 作为 小型 研究 实验室 whose 目标 is 至 构建 系统 that optimize 与 自动化 工作， 从……开始 与 研究 自身. Its 公开
              主张 is 不 传统的 应用层 产品 宣传主张： 公司 称 下一次跃迁 will 要求 学习算法 超越 大型-扩展 pretraining 与 强化学习， 架构 that 扩展 更好地 than
