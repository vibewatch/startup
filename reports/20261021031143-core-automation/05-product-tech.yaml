      - ["Optimization and training co-design", "Make deeper or unusual architectures trainable", "Optimizer, architecture, and training procedure compatibility", "Founder thesis lacks public ablation evidence"]
      - ["Kernel and runtime layer", "Execute novel operations efficiently on accelerators", "Expert kernel design, automated search, and hardware access", "Current proof remains expensive and human-dependent"]
      - ["Experiment orchestration", "Generate, run, compare, and learn from research experiments", "Reliable code generation, instrumentation, and decision rules", "Target throughput and decision quality are not publicly measured"]
      - ["Governance and release controls", "Test, monitor, and remediate changing system behavior", "Safety evaluation, privacy controls, incident response, and post-launch monitoring", "No target-company control framework is disclosed"]
    notes: >-
      This is an analytical decomposition of the founder-described research
      loop, not a disclosed production system diagram.
    claimRefs: [CE004, CE005, CE006, CE008, CE009, CE010, CE011, CE016]
