company:
  name: "Core Automation"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Core Automation addresses a narrow frontier-AI research-automation problem inside a much broader
    agent-software market. Third-party estimates indicate rapid category growth, but Core remains
    pre-product with no public pricing, customer, or deployment denominator, so a defensible
    company-specific SAM or SOM cannot yet be calculated.
sections:
  - id: "market-boundary"
    title: "Market boundary: research automation, not the whole agent economy"
    body: >-
      Core Automation's disclosed objective is to optimize and automate work beginning with research,
      while its founders frame continual learning and post-transformer architecture discovery as the
      technical route. That places the company first in frontier-model R&D infrastructure: experiment
      design, systems code, kernel work, evaluation, and model-learning loops used by highly technical
      research teams. The broader enterprise-agent market is an adjacency, not a defensible measure of
      Core's present addressable revenue. Scientific workflow products such as Claude Science show that
      research organizations can buy integrated AI workbenches, but they solve workflow orchestration
      with existing models rather than Core's stated architecture-replacement problem. Status-quo
      substitutes include internal research engineers, incumbent frontier-lab tooling, general coding
      agents, conventional training pipelines, and manual experiment review. The public record still
      describes Core as pre-product, with distribution channels undefined and no database signals for
      ARR or valuation; those absences prevent a buyer-based company TAM from being inferred.
    claimRefs: [CM001, CM002, CM003, CM006, CM007, CM011, CM012]
    tableRefs: [TM001]
  - id: "sizing-and-demand"
    title: "Sizing lenses show demand, but not Core-specific capture"
    body: >-
      Axis Intelligence aggregates a 2026 global AI-agents market estimate of $10.9-$11.8 billion and
      a 43%-49% CAGR range through 2030, while also reporting Gartner's much larger $206.5 billion
      estimate for 2026 AI-agent software spending. These figures should not be blended: the former is
      a market-research category range whose methodologies may include different mixes of software,
      infrastructure, and services, while the latter attributes a wider software-spending envelope to
      agent functionality. The same source cautions that long-range market estimates vary by two to
      four times because definitions differ. For underwriting Core, these numbers establish category
      momentum only. A company SAM requires an observable product unit, pricing basis, eligible buyer
      count, compute or services attach, and commercialization horizon. None is public. The evidence
      therefore supports a market-direction view, not a precise TAM/SAM/SOM or revenue-share forecast.
    claimRefs: [CM008, CM009, CM010]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: "buyers-and-adoption"
    title: "Buyers, adoption path, and constraints"
    body: >-
      The most plausible initial economic buyer is a frontier-model or advanced-research leader who
      controls R&D and compute budgets; researchers and systems engineers would be the users. Adjacent
      scientific-workbench evidence expands the possible buyer set to pharmaceutical, academic, and
      institutional research teams, but does not establish that they would buy Core's undisclosed
      product. Enterprise adoption data reinforces a staged path: Axis aggregates 88% of organizations
      using AI in at least one function, 62% experimenting with agents, 23% scaling agents in one
      function, and fewer than 10% scaling across multiple functions. That widening-to-narrowing pattern
      is consistent with high interest but difficult production conversion. Only 21% are reported to
      have mature agent governance, and Gartner's forecast, as reproduced by Axis, says more than 40%
      of agentic projects will be canceled by the end of 2027 because of cost, unclear value, and weak
      controls. Core also faces a capital- and talent-intensive supply constraint: its founders described
      one optimized kernel effort as requiring four weeks, about $100,000 of AI compute, and rare expert
      judgment. Adoption therefore depends on measurable research throughput, reproducibility, security,
      infrastructure integration, and ROI proof rather than market enthusiasm alone.
    claimRefs: [CM011, CM012, CM013, CM014, CM015, CM016]
    tableRefs: [TM003]
