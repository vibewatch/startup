    title: "A large category does not establish Core's serviceable market"
    body: >-
      Treat broad agent forecasts as demand context only. Underwriting needs a disclosed product,
      buyer, price, deployment model, and measured workflow outcome before a Core-specific SAM or SOM
      can be calculated.
