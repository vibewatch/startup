    notes: "Ranges and growth rates are reproduced with their original category labels; null means the assigned evidence cannot support a Core-specific amount, not zero market value."
    claimRefs: [CM003, CM008, CM009, CM010]
  - id: "TM003"
    title: "Segment, buyer, user, payer, and adoption map"
    columns:
      - "Segment"
      - "Economic buyer"
      - "Primary user"
      - "Payer or budget owner"
      - "Workflow"
      - "Adoption trigger"
    rows:
      - ["Frontier-model labs", "Head of research or CTO", "Research scientists and systems engineers", "Central R&D and compute budget", "Architecture experiments, kernels, evaluation, and iterative training", "Demonstrated throughput or capability gain per research dollar"]
      - ["Scientific research organizations", "Research-platform or informatics leader", "Computational scientists", "Enterprise, institute, or sponsored-project budget", "Database access, analysis, figures, citations, and reproducibility", "Validated time savings with data-control and reproducibility safeguards"]
      - ["Enterprise agent adopters", "CIO or business-function leader", "Knowledge workers and application teams", "Software and transformation budget", "Task automation across one or more functions", "Clear ROI, integration, governance, and risk controls"]
      - ["Core's first commercial cohort", "Unknown", "Unknown", "Unknown", "No public customer workflow is disclosed", "Named pilot, product scope, price, deployment model, and measurable outcome"]
    notes: "The first three rows are market inferences grounded in the cited workflow and adoption evidence; the final row preserves the company-specific evidence gap rather than assuming a buyer."
    claimRefs: [CM001, CM002, CM011, CM012, CM013, CM015, CM016]
