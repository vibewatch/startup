figures:
  - id: FU001
    title: Evidence-gated customer journey
    type: journey-map
    summary: >-
      The observed journey ends at internal technical use; every external customer stage remains
      an unverified diligence gate.
    data:
      nodes:
        - label: Research thesis
          status: Publicly described
          detail: Replace current architecture and automate the research process.
          touchpoints: [Founder interview, Public launch coverage]
        - label: Internal lab use
          status: Evidenced
          detail: Researchers use automated systems and search loops in the lab.
          touchpoints: [Research workflow, Systems engineering]
        - label: Technical prototype proof
          status: Company-reported
          detail: QR-kernel optimization produced a scoped 60x result with substantial compute and expert input.
          touchpoints: [Kernel benchmark, Expert review]
        - label: Repeatable product boundary
          status: Not evidenced
          detail: No public product, API, packaging, or pricing is available.
          touchpoints: [Product definition, Security and governance]
        - label: External pilot and paid conversion
          status: Not evidenced
          detail: No named pilot, design partner, or production customer appears in the retained evidence.
          touchpoints: [Procurement, Deployment, Outcome measurement]
        - label: Renewal and expansion
          status: Not evidenced
          detail: Retention, contract duration, expansion, and concentration metrics remain private or unavailable.
          touchpoints: [Renewal, Cross-sell, Referenceability]
    approximationNotes: >-
      Stages are evidence gates, not a measured funnel; sequence does not imply conversion rates,
      elapsed time, or probability of completion.
    claimRefs: [CU003, CU004, CU005, CU011, CU012, CU013, CU014, CU015]
callouts:
  - calloutType: risk
    title: Customer diligence remains thesis-critical
    body: >-
      Treat internal technical activity as product-development evidence only. Underwriting external
      demand requires named references, deployment scope, paid status, outcomes, renewal behavior,
      and customer concentration directly from contracts or customer-side evidence.
    claimRefs: [CU013, CU014, CU015]
