schemaVersion: "report-v2"
artifact: customers
slug: core-automation
runDate: 2026-10-21
company:
  name: Core Automation
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence still supports an internal-first research lab rather than a commercial
    customer base: Core Automation is the only evidenced current user, while named external
    customers, pilots, retention metrics, and concentration data remain undisclosed. The strongest
    adoption proof is an internal kernel-optimization result, not external production deployment.
sections:
  - id: customer-base
    title: Customer base is prospective, not demonstrated
    body: >-
      The retained evidence does not establish a paying external customer base. Royco describes
      Core Automation as having no public product, API, pricing, or customers as of mid-2026 and
      frames the near-term model as using automation inside the lab before commercialization.
      AngelsRound identifies AI infrastructure providers, enterprises, and eventually autonomous
      AI deployments as target customers, but its own traction description centers on the founding
      team and GPU commitments rather than users or contracts. The investable customer thesis is
      therefore a segmentation hypothesis: internal researchers are the only evidenced current
      users, while enterprise and infrastructure buyers remain prospective. Broad enterprise AI
      readiness supports a possible demand backdrop, but it does not prove demand for Core
      Automation specifically.
    claimRefs: [CU001, CU002, CU003, CU010, CU011, CU012, CU013, CU016]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Internal technical use is the only measurable adoption surface
    body: >-
      The best quantified use evidence is operational rather than commercial. A partner-hosted
      founder interview reports that a human-plus-AI search loop produced a 60x QR-kernel speedup
      over cuSOLVER for the specific problem shapes tested, with about $100,000 in agent compute
      over four weeks and expert human involvement. The same interview presents one architecture
      experiment per day, and eventually 10 to 200 per day, as goals rather than achieved
      throughput. These data indicate that Core Automation is actively applying automation to its
      own research process, but they provide no external account, location, renewal, utilization,
      or revenue denominator. Reported financing activity is evidence of capital availability, not
      customer adoption, and should not be substituted for commercial traction.
    claimRefs: [CU004, CU005, CU006, CU007, CU008, CU013]
    tableRefs: [TU002]
  - id: named-proof-and-durability
    title: Named proof, retention, and concentration remain open
    body: >-
      No successful prefetched source allocated to this chapter names an external production
      customer, pilot, or design partner. The source set also discloses no NRR, GRR, churn,
      renewal, contract-length, customer-count, satisfaction, or customer-concentration metric.
      That absence is a limitation of public evidence, not proof that no private discussions or
      deployments exist. It prevents assessment of reference quality, procurement friction,
      repeat use, expansion, or dependency on a small number of counterparties. A mature
      enterprise-AI comparator such as Glean had a reported $300 million of ARR by May 2026, but
      that benchmark is a maturity contrast only; it supplies no evidence about Core Automation's
      revenue or customers.
    claimRefs: [CU002, CU009, CU014, CU015]
    tableRefs: [TU003]
  - id: commercialization-journey
    title: Commercialization requires multiple unverified gates
    body: >-
      The observable journey starts with Core Automation as its own user: research automation,
      kernel work, and faster experimentation are intended to improve the underlying technical
      system. External commercialization would then require a product boundary, pilot deployment,
      repeatable outcome measurement, paid conversion, renewal, and expansion. None of those
      external stages is publicly evidenced in the retained sources. Enterprise readiness is also
      uneven: the Blockchain Council reports widespread AI strategy ownership but far lower mature
      governance, implying that security, governance, integration, and procurement proof may
      become adoption gates even if the technical thesis succeeds. The figure separates observed
      internal use from the still-unverified customer conversion loop.
    claimRefs: [CU003, CU004, CU005, CU011, CU012, CU013, CU014, CU015]
    figureRefs: [FU001]
