  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: customer-proof
      missingEvidence: Named external customers, pilots, design partners, deployment stage, paid status, and customer-side outcomes.
      whyItMatters: Without customer-side proof, internal technical progress cannot establish market adoption or reference quality.
      diligencePath: Request the customer and pilot roster, then verify deployment scope and outcomes directly with at least three counterparties.
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: adverse-customer-evidence
      missingEvidence: Customer complaints, failed pilots, blocked deployments, churn events, or an explicit confirmation that no external deployments exist.
      whyItMatters: Public silence cannot distinguish a clean record from the absence of a deployed customer population.
      diligencePath: Review support logs, incident records, lost-deal notes, pilot postmortems, and conduct independent customer reference calls.
      relatedQuestionRefs: [QU005]
    - type: private-evidence-only
      severity: material
      topic: retention-gap
      missingEvidence: NRR, GRR, logo churn, renewal timing, contract duration, expansion revenue, top-customer share, and channel dependence.
      whyItMatters: These metrics determine whether any future adoption is durable and whether revenue would be concentrated.
      diligencePath: Obtain the contract ledger and cohort schedules, reconcile them to invoices, and sample renewals and expansions with customer references.
      relatedQuestionRefs: [QU010]
