evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Board composition, founder ownership, voting rights, vesting, succession planning, investor rights, and complete
      leadership roster.
    whyItMatters: Founder concentration and investor protections determine control, continuity, and financing risk.
    diligencePath: >-
      Obtain the charter, bylaws, cap table, voting agreements, board minutes, employment agreements, and current
      organization chart from company counsel.
    relatedQuestionRefs:
      - QO002
      - QO003
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercialization
    missingEvidence: >-
      Audited revenue, ARR, customer or pilot roster, retention, pricing, headcount, cash balance, burn, committed
      compute, and runway.
    whyItMatters: Without commercial and liquidity evidence, valuation cannot be tied to traction or financing durability.
    diligencePath: >-
      Request management accounts, bank statements, payroll roster, customer contracts, pipeline export, compute
      commitments, and a board-approved operating plan.
    relatedQuestionRefs:
      - QO001
      - QO006
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      Primary SEC filing, executed financing documents, wire evidence, share counts, security terms, and authoritative
      closing dates for each reported round.
    whyItMatters: >-
      Reported values range from an unannounced round to approximately $532 million raised and a prospective $500
      million filing, which cannot all be treated as equivalent cash raised.
    diligencePath: >-
      Retrieve the filing directly from EDGAR and reconcile it to signed stock-purchase documents, capitalization
      records, bank receipts, and investor confirmations.
    relatedQuestionRefs:
      - QO004
      - QO005
      - QO007
      - QO008
      - QO009
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-evidence
    missingEvidence: Named customers or pilots, contract structure, price, deployment model, retention, and measured research outcomes.
    whyItMatters: >-
      Without a buyer and commercial denominator, Core-specific SAM, SOM, sales-cycle, and adoption-rate estimates would
      be invented.
    diligencePath: >-
      Request a customer and pilot schedule, anonymized contracts, pipeline stages, pricing sheets, deployment
      architecture, and outcome baselines from management.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
      - TM003
  - type: conflicting-data
    severity: material
    topic: market-methodology
    missingEvidence: Comparable market estimates using the same product scope, geography, buyer population, and revenue definition.
    whyItMatters: >-
      The available $10.9-$11.8 billion market range and $206.5 billion software-spending forecast measure different
      envelopes and cannot be combined.
    diligencePath: >-
      Obtain the underlying Gartner and market-research methodologies, normalize category inclusions, and rebuild a
      bottom-up buyer-based model.
    relatedQuestionRefs:
      - QM002
      - QM003
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: capital-and-scale
    missingEvidence: Complete primary filing text and financing terms for the August 2026 SEC filing reference.
    whyItMatters: >-
      Capital availability affects compute capacity, commercialization timing, and the feasible pace of frontier-model
      research.
    diligencePath: >-
      Retrieve the original SEC filing or issuer documentation and verify amount, securities, close status, investors,
      and intended use of proceeds.
    relatedQuestionRefs:
      - QM006
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Comparable price, unit, packaging, discount, contract, and realized customer terms for Core Automation.
    whyItMatters: >-
      Pricing and packaging determine whether an eventual offer competes with APIs, internal labor, research licensing,
      or enterprise software.
    diligencePath: >-
      Obtain the current product catalog, price book, sample order form, discount schedule, and three executed customer
      contracts.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: moat
    missingEvidence: Independent reproduction of architecture, kernel, and autonomous experiment-throughput results.
    whyItMatters: Founder-reported results do not establish a durable advantage over capital-rich incumbent labs.
    diligencePath: >-
      Commission a blinded technical benchmark and inspect experiment logs, compute budgets, baselines, and
      human-intervention records.
    relatedQuestionRefs:
      - QP006
      - QP007
  - type: private-evidence-only
    severity: material
    topic: trust
    missingEvidence: Security certifications, model governance, deployment controls, data rights, and regulatory posture.
    whyItMatters: Enterprise distribution and switching cost depend on trust controls as well as model performance.
    diligencePath: >-
      Review security architecture, audit reports, certification roadmap, data-processing terms, incident history, and
      model-risk controls.
    relatedQuestionRefs:
      - QP002
      - QP005
  - type: private-evidence-only
    severity: material
    topic: revenue-evidence
    missingEvidence: >-
      Customer-level revenue, ARR bridge, signed contracts, pricing, discounts, concentration, and revenue-recognition
      policy.
    whyItMatters: These records determine whether revenue exists, recurs, and converts into collectible cash.
    diligencePath: Obtain monthly ledger extracts, contract samples, invoices, collections, and the revenue-recognition memorandum.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI004
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, compute cost by workload, payroll, service-delivery cost, CAC, sales cycle, and payback data.
    whyItMatters: Without these inputs, neither contribution margin nor the cost to acquire and serve demand can be tested.
    diligencePath: Review monthly management accounts and reconcile revenue to compute, support, services, and sales expenses.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: financing
    missingEvidence: The primary SEC filing, financing terms, closing status, proceeds received, and investor commitments.
    whyItMatters: A reported filing ceiling is not evidence of completed funding or liquidity.
    diligencePath: Obtain the filing accession, subscription documents, cap table, wire confirmations, and board approvals.
    relatedQuestionRefs:
      - QI005
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Cash balance, monthly net burn, debt, committed compute and payroll spend, runway, use of funds, and next-round
      trigger.
    whyItMatters: These inputs determine whether technical milestones can be reached before another financing.
    diligencePath: Review bank statements, debt schedules, vendor commitments, and the board-approved 24-month operating plan.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: deployment-maturity
    missingEvidence: >-
      A released-product specification, API or integration documentation, deployment references, service levels, and
      measured production reliability.
