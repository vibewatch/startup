chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Digital Core Architecture
        blocks:
          - type: paragraph
            body: >-
              Founded in London in January 2014 by veteran corporate banker Anne Boden, Starling Bank was built to
              deliver a full-service alternative to legacy UK clearing banks using a modern, proprietary technology
              stack. Receiving its full UK banking licence from the Prudential Regulation Authority (PRA) and the
              Financial Conduct Authority (FCA) in July 2016, Starling launched mobile current accounts in May 2017
              without establishing physical retail branch locations. Instead, the bank operates nationwide digital
              banking services supported by regional administrative and engineering offices in London, Cardiff,
              Manchester, and Southampton. Starling offers personal, joint, teen, business, and multi-currency accounts,
              holding eligible customer deposits under Financial Services Compensation Scheme (FSCS) protection up to
              statutory limits. Rather than licensing legacy core banking platforms from external financial software
              vendors, Starling engineered its cloud-native core banking architecture entirely in-house. This
              architecture enables continuous deployment, real-time ledger settlement, integrated budgeting tools such
              as Spaces, and native mobile functionality. This engineering foundation supports high customer
              satisfaction and low operating cost ratios, positioning Starling as one of the earliest structurally
              profitable neobanks in the European fintech ecosystem.
            claimRefs:
              - CO001
              - CO002
              - CO009
              - CO012
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO005
