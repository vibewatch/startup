      - number: '2.2'
        title: Addressable Market Sizing across Banking and SaaS Verticals
        blocks:
          - type: paragraph
            body: >-
              Sizing Starling Bank requires evaluating two distinct market pools: the mature UK commercial and retail
              banking market and the high-growth international core banking software market. In banking, Starling held
              £12.1 billion in customer deposits at FY2025 year-end, comprising £6.4 billion in retail deposits and £5.7
              billion in SME balances across 4.6 million open accounts. The group expanded its customer base to 6.2
              million platform accounts in FY2026. Concurrently, Engine by Starling addresses global financial
              institutions modernizing legacy cores, generating £8.7 million in FY2025 and roughly £10.9 million in
              FY2026 with a reported committed pipeline of approximately £70 million in annual recurring revenue across
              enterprise clients.
