      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Customer adoption is segmented across three primary domestic user groups and an international enterprise
              buyer cohort. Retail users adopt Starling for intuitive mobile budgeting tools like Spaces, Bills Manager,
              and fee-free overseas card transactions. Sole traders and small businesses choose Starling for
              frictionless digital onboarding, zero monthly account fees, and integrated accounting workflows via the
              optional Business Toolkit with Xero, FreeAgent, and QuickBooks integrations, supporting over 400,000
              active SME core accounts. For Engine by Starling, the buyers are executive leadership teams and chief
              information officers at overseas commercial banks seeking proven, cloud-native core banking software
              without building a proprietary modern ledger from scratch.
