  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Monetization Model
        blocks:
          - type: paragraph
            body: >-
              Starling Bank operates a dual-engine commercial model spanning regulated consumer and business banking
              alongside enterprise core software licensing. The core banking division generates the vast majority of
              top-line revenue through net interest income (NII) earned on its lending portfolio and treasury
              investments, funded by low-cost customer deposits. Non-interest income is driven by card interchange from
              debit spending, account-related fees, and foreign exchange conversion fees of 0.4% on international
              transfers. In the financial year ending March 2026, group revenue stood at £887 million, declining 6% from
              £940 million in FY2025 as Bank of England benchmark rate reductions compressed deposit margins and
              interest earnings across the sector.


              The secondary growth vector is Engine by Starling, a cloud-native software-as-a-service (SaaS) platform
              that white-labels Starling's proprietary core banking operating system to external financial institutions
              globally. Engine reported approximately £10.9 million in trailing software revenue, reflecting roughly 25%
              year-on-year growth, and closed FY2026 with £70 million in committed annual recurring revenue (ARR).
              Enterprise licensing agreements, including a multi-year migration partnership with a Scotiabank
              subsidiary, provide high-margin recurring software revenues that do not encumber Starling's balance sheet
              or require capital reserves. List pricing for personal and business current accounts remains free of
              monthly maintenance charges, which anchors customer acquisition and preserves deposit stickiness, while
              enterprise monetization is achieved via transaction throughput, premium features, and Engine software
              contracts.
            claimRefs:
              - CI001
              - CI006
              - CI007
              - CI013
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI006
