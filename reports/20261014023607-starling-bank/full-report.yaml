      - number: '2.4'
        title: Growth Drivers, Regulatory Constraints, and Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              Starling's expansion is driven by strong operating leverage, generating £218.70 in average revenue per
              active customer (ARPAC) and £176.30 in unit contribution in FY2025, which underpinned £217.1 million in
              statutory pre-tax profit in FY2026. However, growth is constrained by significant regulatory and macro
              dependencies. In October 2024, the Financial Conduct Authority fined Starling £29 million for sanctions
              screening failures and high-risk customer onboarding breaches, proving that digital speed cannot bypass
              anti-money laundering controls. Furthermore, softening interest rates compress deposit margins,
              highlighting the strategic necessity of scaling Engine's capital-light software fees to offset cyclical
              net interest margin contractions.
            claimRefs:
