      Chronological trajectory of Starling Bank from founding in 2014 through licence receipt, pandemic lending,
      profitability, regulatory remediation, and Engine SaaS expansion.
    data:
      items:
        - date: 2014-01
          label: Foundation by Anne Boden
          detail: Anne Boden incorporates Starling Bank in London to build a branchless, cloud-native UK bank.
          tone: positive
          claimRefs:
            - CO001
        - date: 2016-07
          label: UK Banking Licence Authorized
          detail: >-
            Prudential Regulation Authority and Financial Conduct Authority grant full UK regulatory banking
            authorisation.
          tone: positive
          claimRefs:
            - CO002
        - date: 2017-05
          label: Mobile Current Account Launch
          detail: >-
            First mobile personal current account debuts in the UK with real-time push notifications and no foreign
            fees.
          tone: positive
          claimRefs:
            - CO002
        - date: 2020-05
          label: Pandemic SME Lending Participation
          detail: >-
            Participates in UK Government Bounce Back Loan Scheme, accelerating business deposit growth and lending
            book.
          tone: neutral
          claimRefs:
