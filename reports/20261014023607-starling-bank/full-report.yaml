      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Sustained Neobank Profitability and Core Banking Ownership
            body: >-
              Unlike European peers that pursued land-grab growth funded by successive venture rounds, Starling
              established operating profitability by FY2022 and posted £217.1M in pre-tax profit on £887.4M revenue in
              FY2026. Its decision to author its core banking engine internally rather than renting third-party legacy
              cores has yielded superior cost structures and created an exportable SaaS asset in Engine.
            calloutType: strength
            claimRefs:
              - CO007
              - CO008
          - type: callout
            title: Post-Fine Governance and Sanctions Compliance Burden
            body: >-
              The FCA's £29 million penalty in September 2024 underscored that rapid automated customer onboarding
              during the pandemic outpaced the bank's financial crime control framework. Remediating legacy screening
              weaknesses and navigating heightened supervisory scrutiny impose continuous operating overhead as Starling
              prepares for eventual public listing.
            calloutType: risk
            claimRefs:
              - CO010
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Core Service Definitions
        blocks:
          - type: paragraph
            body: >-
              Starling Bank operates as a regulated UK digital bank across personal, joint, business, and multi-currency
              current account categories, deliberately avoiding the physical real-estate costs of branch banking. The
              bank relies on digital-first mobile interfaces for deposit gathering and everyday account operations,
              pairing retail consumer accounts with high-engagement small and medium enterprise (SME) banking. By
              excluding proprietary brick-and-mortar branches, direct high-street retail mortgage advice, and unsecured
              credit cards from its balance sheet, Starling concentrates on operational software leverage, utilizing the
              Post Office network for cash access and third-party marketplace partners for auxiliary financial products.
