  - id: TE002
    title: Workflow / use-case table
    columns:
      - User Job
      - Current Legacy Workflow
      - Starling Solution
      - Measurable Benefit
      - Operational Limitation
    rows:
      - - Everyday personal cash management
        - Batch-processed overnight statements with delayed balance updates
        - Real-time transaction streaming and mobile push notifications via cloud ledger
        - Instant balance reconciliation and zero transaction fee international card spend
        - Mobile-app native with limited physical branch cash-in options
      - - SME bookkeeping and invoicing
        - Manual invoice creation and delayed bank reconciliation
        - Embedded invoicing tool with direct bi-directional Xero and FreeAgent sync
        - Eliminates external bookkeeping sync delays and reduces administrative overhead
        - Restricted to UK registered corporate entities and sole traders
      - - International currency transfers
        - High-street wire desks charging multi-day delays and opaque FX markups
        - In-app multi-currency balances (GBP, EUR, USD) with transparent 0.4% conversion fee
        - Fast payment execution across nearly 40 countries with no hidden fees
        - No speculative margin trading or complex hedging derivatives
      - - Institutional core modernisation
        - Multi-year on-premise mainframe legacy core replacements costing hundreds of millions
        - Cloud-native Engine SaaS banking platform with modular microservices
        - Drastic reduction in infrastructure operational expenditure and faster product release cycles
        - Requires multi-year migration commitment and client system adaptation
    notes: Workflow comparative mapping based on Starling feature specifications, published fee schedules, and neobank competitive assessments.
    claimRefs:
      - CE002
      - CE005
      - CE008
      - CE009
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / Component
      - Operational Role
      - Key Dependency
      - Identified Technical / Operational Risk
    rows:
      - - Mobile Client & API Gateway
        - Cross-platform mobile front-end, biometric auth, and REST customer interfaces
        - iOS and Android native platforms, TLS endpoints
        - Client app distribution dependencies and version fragmentation
      - - Core Banking Ledger (Engine)
        - Real-time event-driven transaction processing, account state, and balance management
        - Cloud infrastructure and distributed database clusters
        - Data consistency across distributed nodes under peak transactional volume
      - - Payment Scheme Gateway
        - Direct clearing integration with Faster Payments, BACS, and MasterCard
        - Bank of England settlement rails and card scheme connections
        - Scheme gateway availability and settlement liquidity buffer management
      - - Financial Crime & Compliance Engine
        - Automated AML transaction monitoring, PEP screening, and sanctions detection
        - OFSI Consolidated List feeds, CIFAS fraud databases
        - Screening database misconfiguration and legacy control remediation backlog
    notes: Architecture decomposition reflecting Starling proprietary technology stack, scheme interfaces, and regulatory enforcement disclosures.
    claimRefs:
      - CE006
      - CE010
      - CE011
      - CE012
