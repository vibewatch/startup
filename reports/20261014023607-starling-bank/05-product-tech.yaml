callouts:
  - calloutType: strength
    title: In-House Architecture and Core Software Commercialisation
    body: Building a proprietary cloud-native core banking engine rather than licensing legacy software enabled Starling to avoid third-party software licensing overhead, deliver real-time payment settlement, and create Engine by Starling as an exportable high-margin SaaS platform.
    claimRefs:
      - CE004
      - CE005
      - CE007
  - calloutType: risk
    title: Financial Crime Screening Deficiencies and Control Remediation Burden
    body: Starling's £28.96 million FCA penalty in September 2024 revealed that automated compliance controls lagged rapid customer growth, as sanctions filters failed to screen against the full OFSI Consolidated List and breached voluntary regulatory restrictions.
    claimRefs:
      - CE010
      - CE011
      - CE012
