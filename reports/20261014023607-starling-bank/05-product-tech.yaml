        - label: Core Banking & Ledger Engine
          detail: Proprietary real-time event-driven ledger, account state machines, and multi-currency balance processing.
        - label: Financial Crime & Risk Controls
          detail: Automated transaction monitoring, OFSI sanctions screening, PEP checks, and AI-powered anti-scam tooling.
        - label: Payments & Clearing Gateway
          detail: Direct connectivity to UK Faster Payments Scheme, BACS, SEPA, and MasterCard payment networks.
        - label: Cloud Infrastructure & Resilience
          detail: Containerized microservices hosted on AWS cloud infrastructure with automated multi-zone failover.
