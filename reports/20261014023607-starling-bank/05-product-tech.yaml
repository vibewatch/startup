company:
  name: Starling Bank
chapter:
  number: 5
  title: Product & Technology
  summary: Starling Bank pairs a cloud-native mobile banking product suite for UK retail and SME accounts with Banking-as-a-Service APIs and its Engine SaaS core banking platform, while actively remediating automated financial crime screening deficiencies cited in a £29m FCA fine.
sections:
  - id: product-portfolio
    title: Core Product Architecture and Customer Workflow Integration
    body: Starling Bank delivers a digital-first current account architecture serving UK retail consumers, joint account holders, teenagers, and small businesses entirely through native mobile applications. Built around automated financial management, the product environment features real-time transaction tracking, instant push notifications, and customizable virtual sub-accounts termed Spending Spaces that ring-fence funds for recurring obligations or discrete savings goals. For commercial users, Starling provides free business accounts for sole traders and limited companies, embedding operational financial workflows including native invoicing tools, real-time expense classification, and direct bi-directional synchronization with external accounting packages such as Xero and FreeAgent. In contrast to traditional clearing bank workflows characterized by batch-processed overnight settlements and branch-bound administration, Starling processes ledger updates and card authorizations continuously, while providing multi-currency balances in GBP, EUR, and USD alongside interest payments on credit balances.
    claimRefs:
      - CE001
      - CE002
      - CE008
    tableRefs:
      - TE001
  - id: workflow-baas-engine
    title: Commercial Workflows, BaaS Infrastructure, and the Engine SaaS Platform
    body: Beyond retail and business mobile applications, Starling has developed a dual-track enterprise infrastructure architecture comprising wholesale Banking-as-a-Service (BaaS) and international core banking software licensing. Under its BaaS offering, Starling exposes a single unified REST API that allows fintechs and enterprise partners to embed FSCS-protected sterling current accounts, payment rails, and debit cards directly into their own user experiences. Starling manages the underlying regulatory compliance overhead, scheme memberships, and Know Your Customer and Anti-Money Laundering verification, decoupling customer interface delivery from regulated balance-sheet operations. Concurrently, Starling has productized its internal technology stack through Engine by Starling, a proprietary cloud-native software-as-a-service platform that licenses the core banking engine to international financial institutions seeking to replace legacy core systems. Engine has secured multi-year commercial commitments, including a ten-year core modernization agreement with a Scotiabank subsidiary, converting internal banking infrastructure into a high-margin recurring software revenue model.
    claimRefs:
      - CE003
      - CE004
      - CE007
    tableRefs:
      - TE002
  - id: cloud-architecture-and-clearing
    title: Cloud Infrastructure, Real-Time Clearing Rails, and Operating Architecture
    body: Starling was engineered from inception on an in-house, cloud-native architecture designed to eliminate dependencies on legacy third-party mainframe providers. Its operational backbone combines containerized microservices hosted on public cloud infrastructure with an event-driven core banking ledger that maintains authoritative customer balances and multi-currency sub-ledgers. Rather than relying on intermediary clearing banks, Starling established direct technical connectivity with key UK and global payment schemes, including the Faster Payments Scheme for immediate domestic transfers, BACS for automated batch disbursements, and direct integration with MasterCard for debit processing and digital wallets including Apple Pay, Google Pay, and Samsung Pay. This decoupled microservices topology enables continuous software deployment and elastic horizontal scaling, allowing the bank to support more than 4 million customer accounts and £11 billion in deposits across distributed engineering hubs in London, Cardiff, Manchester, and Southampton without legacy technical debt.
    claimRefs:
      - CE005
      - CE006
      - CE009
    tableRefs:
      - TE003
    figureRefs:
      - FE001
  - id: compliance-controls-and-ai-roadmap
    title: Financial Crime Screening Deficiencies, Regulatory Remediation, and AI Innovation
    body: Starling's rapid balance-sheet and customer account expansion exposed material vulnerabilities in its automated financial crime and compliance infrastructure. In September 2024, the Financial Conduct Authority imposed a £28.96 million financial penalty on Starling for failing to establish and maintain adequate systems and controls under Principle 3. Specifically, regulatory investigations determined that following the implementation of its automated sanctions screening framework in 2017, the system screened customer names against only a fraction of the OFSI Consolidated List, while also breaching a September 2021 Voluntary Requirement by onboarding 54,359 accounts for 49,183 high-risk customers. In response, Starling executed an Economic Crime Enhancement Plan spanning 2023 to 2025, overhauling sanctions testing, back-office compliance staffing, and historical customer screening. In parallel with regulatory remediation, Starling restructured operations in 2026, eliminating 130 duplicate roles while expanding investment into artificial intelligence technologies, including an image-scanning anti-scam tool that analyzes marketplace listings to prevent consumer payment fraud.
    claimRefs:
      - CE010
      - CE011
      - CE012
      - CE013
      - CE014
