callouts:
  - calloutType: recommendation
    title: "Price discipline overrides company quality"
    body: >-
      Starling's current operating evidence is strong enough to justify continued diligence, but not strong enough to justify an equity price. A current arm's-length mark, complete preference terms, and verified Engine conversion economics are prerequisites for a buy-or-pass decision.
    claimRefs: [CV003, CV006, CV009, CV010, CV011, CV016]

