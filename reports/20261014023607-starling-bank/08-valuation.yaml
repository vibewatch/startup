  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - Thesis
        - "Profitable regulated-bank franchise"
        - "£217m FY2026 profit before tax and £12.7bn customer deposits"
        - "Sustained earnings deterioration or deposit contraction would weaken the thesis"
      - - Thesis
        - "Engine creates software optionality"
        - "£70m of committed ARR and company guidance toward £100m"
        - "Recognized ARR, margins, renewals, and successful migrations would strengthen the thesis"
      - - Anti-thesis
        - "Core earnings are not currently accelerating"
        - "Revenue fell from £940m to £887m and profit before tax fell from £223m to £217m"
        - "Renewed growth with stable capital and transparent revenue mix would reduce concern"
      - - Anti-thesis
        - "Control and competitive execution remain material"
        - "£29m FCA fine reported in 2024; independent review cites UK-only reach and fewer consumer features than Monzo"
        - "Documented remediation closure and durable customer engagement would reduce concern"
    notes: "The table separates company-reported operating metrics from independent regulatory and competitive commentary; Engine conversion economics remain unavailable."
    claimRefs: [CV002, CV003, CV004, CV005, CV006, CV012, CV014]

  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside or upside trigger
    rows:
      - - Bull
        - "Engine converts committed ARR into recognized high-quality recurring revenue while bank earnings stabilize"
        - "A premium to regulated-bank economics may be defensible, but no absolute range is supportable without a current transaction"
        - "Strengthening only after audited conversion and margin evidence"
        - "Successful migrations, renewals, stable deposits, and no new material control event"
      - - Base
        - "The bank remains profitable, Engine progresses gradually, and public listing timing stays open"
        - "Use a current priced security as the anchor and discount for preference, liquidity, and execution opacity"
        - "Mixed under current public evidence"
        - "Receipt of a clean cap table, recent secondary evidence, and audited FY2026 detail"
      - - Bear
        - "Revenue and profit continue declining, Engine conversion slips, or control remediation proves incomplete"
        - "Value could fall below the reported 2022 £2.5bn financing mark; the evidence does not support a precise floor"
        - "Deteriorating if earnings, capital surplus, or regulatory standing weaken"
        - "Another material enforcement event, deposit pressure, capital erosion, or failed Engine implementation"
    notes: "Scenarios are directional because current equity pricing, fully diluted ownership, security preferences, and comparable transaction adjustments are not public in the retained evidence."
    claimRefs: [CV002, CV003, CV005, CV006, CV009, CV010, CV011, CV012, CV016]

