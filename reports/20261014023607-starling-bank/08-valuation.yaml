company:
  name: Starling Bank

chapter:
  number: 8
  title: Valuation
  summary: >-
    Starling combines a profitable regulated bank with potentially valuable Engine software optionality, but public evidence does not establish a current equity price, preference stack, or sufficiently comparable transaction set. The appropriate stance is research-more with medium confidence, high risk, and an indeterminate valuation until current pricing and cap-table evidence are available.

sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The evidence supports a research-more recommendation rather than a priced investment decision. Starling's official FY2026 highlights show meaningful operating scale: 6.2 million group platform accounts, £12.7 billion of deposits, £887 million of revenue, and £217 million of profit before tax. Those figures demonstrate a functioning and profitable banking franchise, while £70 million of Engine committed ARR creates a second potential value driver. The counterweight is material. Revenue and profit both declined from the prior-year comparatives, a 2024 financial-crime-control fine remains relevant to governance and execution risk, and the latest clearly identified funding event in the retained evidence dates to 2022. Without a current primary or secondary equity mark and its security terms, neither a target return nor an investable valuation range is supportable.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV008, CV009, CV012, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]

  - id: thesis-and-antithesis
    title: Thesis and anti-thesis
    body: >-
      The thesis rests on a profitable deposit-funded bank and a capital-light software option. Deposits increased to £12.7 billion, the company reported capital surplus above £525 million as of May 2026, and Engine's £70 million of committed ARR indicates demand beyond Starling's own balance sheet. The anti-thesis is that the bank remains exposed to revenue cyclicality and regulated-bank execution while Engine has not yet supplied public contract-level conversion, margin, renewal, or implementation evidence. FY2026 revenue fell from £940 million to £887 million and profit before tax fell from £223 million to £217 million. Independent sources also flag UK-only reach, fewer consumer features than Monzo, and sector-wide difficulty sustaining challenger-bank economics. The case is therefore attractive as a diligence candidate, not yet as a price-insensitive investment.
    claimRefs: [CV002, CV003, CV004, CV005, CV006, CV012, CV013, CV014, CV015]
    tableRefs: [TV002]

  - id: financing-valuation-and-scenarios
    title: Financing context, valuation evidence, and scenarios
    body: >-
      Financing evidence is historical and inconsistent in denomination, so it should not be converted into a false current mark. Tracxn reports $1.01 billion raised across 11 rounds and identifies a $166 million Series D round on 21 April 2022. Netfigo separately describes a 2022 follow-on of £130 million at a £2.5 billion valuation. Axi discusses valuation options up to £4 billion but also reports that an IPO is not an immediate priority; that is prospective commentary, not a completed transaction. Scenario analysis must therefore use directional valuation logic. A bull case requires Engine contract conversion and stable bank earnings before any premium is justified. A base case requires a current priced security and a discount for preference opacity. A bear case places the equity below the 2022 reported mark if earnings, controls, or liquidity access deteriorate.
    claimRefs: [CV002, CV003, CV006, CV007, CV008, CV009, CV010, CV011, CV012]
    tableRefs: [TV003]

  - id: exit-readiness-and-final-diligence
    title: Exit readiness, diligence asks, and thesis-break triggers
    body: >-
      Public-listing optionality exists, but the retained evidence does not establish timing, venue, security structure, or shareholder liquidity. Before underwriting an entry, diligence should obtain the current fully diluted cap table, all preference and liquidation terms, recent secondary trades, regulatory capital disclosures, and audited reconciliation of the FY2026 highlights. Engine requires customer-level contracted ARR, implementation milestones, recognized revenue, gross margin, renewal rights, and concentration data. The investment thesis would weaken materially if revenue and profit continue to decline, Engine's committed ARR fails to convert into recognized recurring revenue, another serious control failure emerges, or capital surplus erodes. Conversely, a clean current transaction, transparent preferences, completed remediation evidence, and repeatable Engine economics could move the recommendation from research-more to a price-specific decision.
    claimRefs: [CV002, CV003, CV005, CV006, CV010, CV011, CV012, CV016]

