    title: "High Primary Account Status and SME Market Penetration"
    body: "Starling has achieved a 34.5% primary account ratio and captured over 400,000 small-business accounts, creating an unusually sticky, low-cost deposit foundation compared to consumer-only digital neobanks."
    claimRefs:
