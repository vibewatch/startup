companyProfile:
  summary: >-
    Starling Bank is a London-founded UK digital bank that combines consumer and SME banking with Engine, a cloud-native
    core-banking SaaS business. It publishes annual operating results, has scaled to millions of customer accounts and
    more than £12 billion of deposits, and remains under post-fine regulatory remediation while it evaluates
    public-market timing.
