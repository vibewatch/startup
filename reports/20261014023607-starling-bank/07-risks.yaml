callouts:
  - calloutType: "risk"
    title: "Regulatory Rehabilitation and Compliance Friction"
    body: "The FCA's £28.96m fine and the breach of customer onboarding restrictions demonstrate that hyper-growth compromised operational risk management. Until supervisory monitors confirm full remediation, compliance expenditures and regulatory scrutiny will impose friction on Starling's capital deployment and IPO preparations."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR004"
  - calloutType: "recommendation"
    title: "Monitoring Dual-Track Execution and Interest Sensitivity"
    body: "Investors should treat Starling's valuation as highly sensitive to Bank of England policy rate decisions and Engine enterprise delivery milestones. Due diligence must verify that client migration timetables for the core banking SaaS platform are progressing without implementation backlogs or cost overruns."
    claimRefs:
      - "CR009"
      - "CR010"
