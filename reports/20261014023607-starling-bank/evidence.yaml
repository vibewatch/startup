      - sanctions-compliance
      - challenger-bank-market
    keyQuote: >-
      Starling Bank, authorized by the FCA in July 2016, quickly grew by launching mobile banking services in May 2017.
      However, compliance issues soon arose. In 2017, failures in sanctions screening went undetected until a 2023
      internal review. Further concerns about financial crime controls emerged from an internal audit in 2018. By 2021,
      the FCA had raised serious concerns, specifically about anti-money laundering (AML) controls, and required the
      bank to address gaps that were becoming more significant with its rapid growth. Despite ongoing efforts to improve
      compliance, Starling continued facing challenges with its financial crime systems, particularly around sanctions
      screening, which led to external reviews in 2023, further warnings from the FCA and 29 mln GBP fine in September
      2024.
    canonical: SO009
