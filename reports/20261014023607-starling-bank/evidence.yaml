evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: secondary-market-equity-valuation
    missingEvidence: >-
      Audited secondary market transaction records or updated 409A / fair-value mark disclosures confirming current
      private equity valuation post-2022 Series D.
    whyItMatters: >-
      Starling's last disclosed priced equity round occurred in April 2022 (£2.42B valuation); subsequent market shifts
      and competitor re-ratings make public valuation comparisons uncertain.
    diligencePath: >-
      Review subsequent Shareholder Annual General Meeting disclosures, secondary trading transactions on private
      liquidity platforms, or prospective IPO registration filings.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: cap-table-ownership-breakdown
    missingEvidence: >-
      Exact percentage cap-table ownership breakdown for institutional investors (Harald McPike, Chrysalis, Fidelity,
      Railpen, QIA, Goldman Sachs) and employee equity pools.
    whyItMatters: Understanding voting control and minority shareholder protections ahead of any prospective public listing.
    diligencePath: >-
      Inspect latest Companies House CS01 (confirmation statement) and full shareholder registers filed with the
      registrar.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: engine-saas-market
    missingEvidence: >-
      Independent third-party market sizing, client-level contract economics, ARR churn rates, and implementation
      margins for the Engine by Starling SaaS platform.
    whyItMatters: >-
      Engine represents Starling's primary international growth engine and valuation re-rating opportunity from bank
      multiples to software multiples, but public revenue disclosures remain consolidated or reliant on company
      guidance.
    diligencePath: >-
      Request standalone financial statements for the Engine operating subsidiary, customer renewal cohorts, and
      Scotiabank implementation milestone delivery schedules.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Granular customer acquisition cost (CAC), channel payback horizons, and SME cohort retention schedules.
    whyItMatters: >-
      Essential for underwriting organic marketing efficiency and forward deposit growth as UK digital banking
      competition matures.
    diligencePath: Request confidential management data room materials detailing channel CAC and cohort retention curves.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Detailed audited breakdown of FY2026 CET1 capital ratio, risk-weighted asset composition, and loan loss
      provisioning.
    whyItMatters: >-
      Critical for evaluating stress-testing resilience and balance sheet capacity for expanding residential and BTL
      mortgage assets.
    diligencePath: Review full statutory accounts and Pillar 3 disclosures upon official Companies House submission.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: engine-saas-contracts
    missingEvidence: >-
      Audited client SLAs, contract durations, core-banking migration schedules, and SaaS unit margins for Engine by
      Starling deployments across international partner banks.
    whyItMatters: >-
      Engine represents Starling's primary global technology scaling mechanism and high-margin diversification, but
      public filings lack granular breakdown of recurring software licensing revenue vs professional implementation
      services.
    diligencePath: >-
      Request customer contract schedules, SaaS retention metrics (NDR/GRR), and technical integration milestone
      sign-offs for Engine partner deployments in management Q&A.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Public developer repository metrics, open-source SDK contributions, and public API performance
      telemetry/benchmarks for Starling's developer portal.
    whyItMatters: >-
      Because Starling operates as a regulated deposit-taking institution with proprietary cloud-native software rather
      than an open-source framework, external developer ecosystem signals are limited to BaaS documentation and
      practitioner reviews.
    diligencePath: >-
      Inspect sandbox API availability, third-party fintech developer reviews, and partner integration case studies
      during technical diligence.
  - type: private-evidence-only
    severity: material
    topic: engine-client-unit-economics
    missingEvidence: >-
      Granular breakdown of Engine SaaS annual recurring revenue per licensee, contract lengths, implementation
      backlogs, and customer churn rates.
    whyItMatters: >-
      While Starling reports £70m in committed ARR and a headline Scotiabank subsidiary contract, exact software margins
      and implementation timetables remain undisclosed to the public.
    diligencePath: >-
      Review confidential Engine commercial contracts, client SLAs, implementation milestone schedules, and licensee
      renewal covenants during management access.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-coverage
    missingEvidence: >-
      Comprehensive audit of all enterprise and corporate banking clients using Starling's Business Toolkit and
      international Engine core-banking deployments.
    whyItMatters: >-
      Public case studies highlight PwC, Softwire, IBM, and Scotiabank but omit confidential enterprise treasury
      customers and secondary regional bank pipeline members.
    diligencePath: >-
      Obtain vendor customer registry schedules and Engine pipeline conversion metrics through formal institutional
      diligence.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: regulatory-remediation-post-fine
    missingEvidence: >-
      Post-enforcement independent audit findings or formal regulatory clearance confirming that Starling has fully
      resolved its historical financial crime screening gaps and skilled person mandate.
    whyItMatters: >-
      Until the FCA or an appointed independent monitor confirms that remediation is complete, residual enforcement risk
      and restrictions on high-risk customer segments could constrain international licensing and IPO timelines.
    diligencePath: >-
      Request management's section 166 skilled person closeout letter, internal audit validation reports for
      AML/sanctions systems, and recent FCA supervisory correspondence.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: engine-saas-client-migration-metrics
    missingEvidence: >-
      Granular deployment timelines, contractually committed account migration milestones, and SLA penalties for
      Engine's enterprise banking partners.
    whyItMatters: >-
      Client delays or failed migrations on core banking transformations could result in revenue write-downs and damage
      Engine's reputation as a mission-critical SaaS platform.
    diligencePath: >-
      Inspect Engine client master services agreements, project delivery milestones for the Scotiabank deployment, and
      customer migration completion rates.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: >-
      Current fully diluted ownership, preference terms, liquidation rights, option dilution, and recent arm's-length
      secondary prices.
    whyItMatters: These terms determine the actual security economics and prevent a defensible entry valuation or target return.
    diligencePath: >-
      Request the latest cap table, shareholder agreement, financing documents, option schedule, and a transaction-level
      secondary-price history.
    relatedQuestionRefs:
      - QV008
    relatedTableRefs:
      - TV001
      - TV003
  - type: missing-source
    severity: material
    topic: engine
    missingEvidence: >-
      Engine contracted-to-recognized ARR conversion, customer concentration, implementation milestones, gross margin,
      renewals, and cancellation rights.
    whyItMatters: The software premium depends on durable recognized economics rather than committed pipeline alone.
    diligencePath: >-
      Obtain customer contracts, implementation schedules, revenue-recognition policy, cohort renewal data, and segment
      contribution margins.
    relatedQuestionRefs:
      - QV006
    relatedTableRefs:
      - TV002
      - TV003
  - type: missing-source
    severity: material
    topic: regulatory-remediation
    missingEvidence: Independent evidence that the control deficiencies associated with the 2024 FCA fine have been fully remediated.
    whyItMatters: Unresolved control weaknesses could impair growth, increase costs, delay an exit, or produce further enforcement.
    diligencePath: >-
      Request remediation closure evidence, board and regulator correspondence, internal-audit testing, and current
      sanctions-screening effectiveness metrics.
    relatedQuestionRefs:
      - QV004
      - QV007
    relatedTableRefs:
      - TV002
      - TV003
