  - calloutType: "strength"
    title: "Sustained Balance-Sheet Profitability and SaaS Platform Monetization"
    body: "Starling reported £217.1m in pre-tax profit on £887.4m revenue for the year to March 2026, marking five consecutive profitable years and outpacing consumer peers on profit margins through deposit discipline and Engine SaaS licensing."
    claimRefs:
      - "CP002"
      - "CP009"
  - calloutType: "risk"
    title: "Regulatory Compliance Failures and Financial Crime Oversight"
    body: "The FCA's £28.96m fine in September 2024 revealed significant historical weaknesses in Starling's automated sanctions screening and customer onboarding controls, requiring comprehensive compliance remediation."
    claimRefs:
      - "CP013"
      - "CP014"
