callouts:
  - calloutType: "strength"
    title: "Dual-Engine Model Provides Structural Margin Resilience"
    body: "Starling pairs a deposit-rich UK commercial banking franchise with Engine by Starling, an international SaaS platform. This hybrid model generates counter-cyclical software fees that cushion group earnings when central bank interest rate cuts reduce net interest margins on customer deposits."
    claimRefs:
      - "CM006"
      - "CM007"
      - "CM013"
  - calloutType: "risk"
    title: "Regulatory Sanctions Enforcement Highlights Scale Constraints"
    body: "The FCA's £29 million fine in 2024 for automated sanctions screening shortcomings and high-risk customer onboarding demonstrates that rapid digital growth must be matched by robust financial crime compliance systems to prevent severe regulatory penalties and reputational damage."
    claimRefs:
      - "CM014"
