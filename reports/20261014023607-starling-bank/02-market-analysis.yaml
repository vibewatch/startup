company:
  name: "Starling Bank"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "Starling Bank pairs a deposit-funded UK challenger bank with Engine by Starling, an exportable core banking SaaS platform. The group held £12.1 billion in customer deposits across 4.6 million open accounts in FY2025 and expanded to 6.2 million platform accounts and £217.1 million pre-tax profit in FY2026, while Engine built a reported £70 million ARR pipeline."
sections:
  - id: "market-boundary-definitions"
    title: "Market Boundary and Core Service Definitions"
    body: "Starling Bank operates as a regulated UK digital bank across personal, joint, business, and multi-currency current account categories, deliberately avoiding the physical real-estate costs of branch banking. The bank relies on digital-first mobile interfaces for deposit gathering and everyday account operations, pairing retail consumer accounts with high-engagement small and medium enterprise (SME) banking. By excluding proprietary brick-and-mortar branches, direct high-street retail mortgage advice, and unsecured credit cards from its balance sheet, Starling concentrates on operational software leverage, utilizing the Post Office network for cash access and third-party marketplace partners for auxiliary financial products."
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM005"
    tableRefs:
      - "TM001"
  - id: "addressable-market-sizing"
    title: "Addressable Market Sizing across Banking and SaaS Verticals"
    body: "Sizing Starling Bank requires evaluating two distinct market pools: the mature UK commercial and retail banking market and the high-growth international core banking software market. In banking, Starling held £12.1 billion in customer deposits at FY2025 year-end, comprising £6.4 billion in retail deposits and £5.7 billion in SME balances across 4.6 million open accounts. The group expanded its customer base to 6.2 million platform accounts in FY2026. Concurrently, Engine by Starling addresses global financial institutions modernizing legacy cores, generating £8.7 million in FY2025 and roughly £10.9 million in FY2026 with a reported committed pipeline of approximately £70 million in annual recurring revenue across enterprise clients."
    claimRefs:
      - "CM003"
      - "CM004"
      - "CM007"
      - "CM008"
      - "CM012"
      - "CM013"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyer-user-segmentation"
    title: "Buyer, User, and Payer Segmentation"
    body: "Customer adoption is segmented across three primary domestic user groups and an international enterprise buyer cohort. Retail users adopt Starling for intuitive mobile budgeting tools like Spaces, Bills Manager, and fee-free overseas card transactions. Sole traders and small businesses choose Starling for frictionless digital onboarding, zero monthly account fees, and integrated accounting workflows via the optional Business Toolkit with Xero, FreeAgent, and QuickBooks integrations, supporting over 400,000 active SME core accounts. For Engine by Starling, the buyers are executive leadership teams and chief information officers at overseas commercial banks seeking proven, cloud-native core banking software without building a proprietary modern ledger from scratch."
    claimRefs:
      - "CM006"
      - "CM009"
      - "CM010"
      - "CM011"
    tableRefs:
      - "TM003"
  - id: "growth-drivers-and-adoption-constraints"
    title: "Growth Drivers, Regulatory Constraints, and Diligence Risks"
    body: "Starling's expansion is driven by strong operating leverage, generating £218.70 in average revenue per active customer (ARPAC) and £176.30 in unit contribution in FY2025, which underpinned £217.1 million in statutory pre-tax profit in FY2026. However, growth is constrained by significant regulatory and macro dependencies. In October 2024, the Financial Conduct Authority fined Starling £29 million for sanctions screening failures and high-risk customer onboarding breaches, proving that digital speed cannot bypass anti-money laundering controls. Furthermore, softening interest rates compress deposit margins, highlighting the strategic necessity of scaling Engine's capital-light software fees to offset cyclical net interest margin contractions."
    claimRefs:
      - "CM012"
      - "CM013"
      - "CM014"
      - "CM015"
