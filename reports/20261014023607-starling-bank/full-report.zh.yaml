        title: 市场边界与核心服务定义
        blocks:
          - type: paragraph
            body: >-
              Starling Bank
              是受监管的英国数字银行，覆盖个人、联名、企业和多币种活期账户，刻意避开实体网点的不动产成本。银行依靠移动优先的数字界面吸收存款并处理日常账户业务，同时将零售个人账户与高参与度的中小企业银行业务结合起来。由于不持有自营实体网点、街边零售抵押贷款咨询和无担保信用卡，Starling
              把重点放在运营软件杠杆上，并利用 Post Office 网络提供现金服务、通过第三方市场合作伙伴补充金融产品。
