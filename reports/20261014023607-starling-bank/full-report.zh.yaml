  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与变现模式
        blocks:
          - type: paragraph
            body: >-
              Starling Bank
              采用双引擎商业模式，将受监管的消费及商业银行业务与企业核心软件授权结合。核心银行部门依靠低成本客户存款为贷款组合和国债投资提供资金，通过净利息收入（NII）贡献绝大部分收入；非利息收入来自借记消费
              interchange、账户费用，以及国际转账 0.4% 的外汇转换费。截至 2026 年 3 月的财年，集团收入 £887 million，受英国央行基准利率下调压缩存款息差和全行业利息收入影响，较
              FY2025 的 £940 million 下降 6%。


              第二增长引擎是 Engine by Starling：它是一套云原生软件即服务（SaaS）平台，将 Starling 自研核心银行操作系统以白标形式提供给全球金融机构。Engine 软件收入约 £10.9
              million，约同比增长 25%，并在 FY2026 末形成 £70 million 的已承诺年经常性收入（ARR）。包括与 Scotiabank
              子公司的多年迁移合作在内，企业授权协议带来高毛利经常性软件收入，不占用 Starling
              的资产负债表，也不要求资本准备金。个人和企业活期账户的标价仍免月度维护费，既支撑获客，也保持存款黏性；企业变现则靠交易吞吐量、增值功能和 Engine 软件合同实现。
            claimRefs:
              - CI001
              - CI006
              - CI007
              - CI013
