            body: >-
              Starling 从成立之初就采用内部打造的云原生架构，旨在摆脱对传统第三方主机供应商的依赖。其运营骨干由公共云上的容器化微服务和事件驱动的核心银行账本组成，后者维护权威客户余额及多币种子账本。Starling
              没有依赖中间清算银行，而是与英国及全球主要支付网络建立直接技术连接，包括支持即时国内转账的 Faster Payments Scheme、负责自动批量付款的 BACS，以及用于借记处理和 Apple
              Pay、Google Pay、Samsung Pay 等数字钱包的 MasterCard
