  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 英国挑战者银行格局与直接数字同行
        blocks:
          - type: paragraph
            body: >-
              过去十年，英国银行业经历了显著的数字化冲击。移动优先的挑战者银行瞄准零售和企业账户，而这些账户此前由传统清算机构主导。Starling Bank 主要面对两家大型消费新银行同行——Monzo Bank 和
              Revolut——以及 Allica Bank、Tide、OakNorth 等 SME 专业机构和传统高街清算银行。


              在直接消费数字银行中，Monzo 是 Starling 最接近的国内同行，两者的移动应用采用率和用户参与度最具可比性。Monzo 的英国客户超过 9
              million，依靠社交传播、预算储蓄罐和丰富的免费增值层级。相比之下，Starling 拥有超过 4 million
              个账户（含个人、联名和企业客户），历来更重视完整银行基础设施、法定盈利和日常账户实用性，而不是快速获取消费账户。Monzo 过去高度依赖 interchange 和零售订阅费，后来才扩大贷款账簿；Starling
              则较早取得完整英国银行授权，并扩展到资产负债表贷款。


              Revolut 是规模巨大的全球金融科技相邻同行，在全球拥有超过 45 million 名客户，并提供外汇、加密交易和跨境支付等多币种生活方式产品。但 Revolut
              走的是国际司法辖区多元化路线，Starling 则先专注英国监管边界，再通过 Engine by Starling
              将核心软件商业化到国际市场。此外，数字挑战者还面临成熟清算银行的结构性竞争，后者拥有占主导地位的网点网络、成熟的按揭贷款账簿和机构企业银行关系。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP012
      - number: '3.2'
        title: SME 银行护城河与 Engine by Starling 核心授权
        blocks:
          - type: paragraph
            body: >-
              Starling 的关键结构性差异在于其在中小企业银行业务中的市场份额和变现能力。消费新银行通常余额低、切换率高；Starling
              则建立了领先的数字商业银行，为个体户和有限公司提供专用账户及免费的核心交易银行服务。


              Starling 将商业银行业务直接接入 Xero、FreeAgent 和 QuickBooks 等云会计平台，并提供 Business Toolkit 等增值运营工具，用于自动开票、记账、VAT
              计算和税务估算。Monzo、Tide 等竞争者也开发了 SME 产品，但 Starling 在疫情时期政府贷款计划中的早期势头帮助其吸收了大量企业存款，形成低成本且黏性较高的资金基础。


              除资产负债表银行业务外，Starling 还凭借 Engine by Starling 与所有英国挑战者同行拉开差距。Engine 将 Starling 自研银行操作系统作为高毛利
              Software-as-a-Service（SaaS）产品授权给全球金融机构。Monzo 或 Revolut 只把软件用于内部运营，而 Starling 直接把自有知识产权变现，与 Thought
              Machine、Mambu、Temenos 等核心银行软件供应商竞争，同时降低收入对英国资产负债表和利率的敏感度。
            claimRefs:
              - CP002
              - CP006
              - CP008
              - CP009
              - CP010
              - CP011
