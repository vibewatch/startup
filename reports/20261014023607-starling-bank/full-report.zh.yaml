            body: >-
              与依靠连续风险投资轮次换取跑马圈地增长的欧洲同行不同，Starling 在 FY2022 已实现经营盈利，并在 FY2026 以 £887.4M 收入取得 £217.1M
              税前利润。公司选择内部开发核心银行引擎，而非租用第三方传统系统，带来了更优成本结构，也打造了可出口的 Engine SaaS 资产。
