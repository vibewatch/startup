            body: >-
              除零售和企业移动应用外，Starling 还建立了双轨企业基础设施架构，包括批发 Banking-as-a-Service（BaaS）和国际核心银行软件授权。在 BaaS 产品下，Starling 暴露统一
              REST API，让金融科技公司和企业合作伙伴把 FSCS 保护的英镑活期账户、支付通道和借记卡直接嵌入自身用户体验。Starling
              负责底层监管合规、支付网络会员资格，以及了解你的客户和反洗钱核验，从而把客户界面交付与受监管的资产负债表运营分开。同时，Starling 通过 Engine by Starling
              将内部技术栈产品化：这是一套自研云原生 SaaS 平台，向希望替换传统核心系统的国际金融机构授权核心银行引擎。Engine 已获得多年期商业承诺，包括与 Scotiabank
              子公司的十年核心现代化协议，把内部银行基础设施转化为高毛利经常性软件收入模式。
