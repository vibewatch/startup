              Spending Spaces，用于隔离周期性支出或独立储蓄目标。对商业用户，Starling 为个体户和有限公司提供免费企业账户，并嵌入原生开票、实时费用分类，以及与 Xero、FreeAgent
              等外部会计软件包的双向同步。不同于传统清算银行批量处理隔夜结算、依赖网点管理的流程，Starling 持续处理账本更新和卡片授权，同时提供 GBP、EUR、USD 多币种余额及信用余额利息。
