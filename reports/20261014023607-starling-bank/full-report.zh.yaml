chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与数字核心架构
        blocks:
          - type: paragraph
            body: >-
              Starling Bank 于 2014 年 1 月由资深企业银行家 Anne Boden 在伦敦创立，目标是用现代自研技术栈，为英国传统清算银行提供全能型替代方案。2016 年 7
              月取得审慎监管局（PRA）和金融行为监管局（FCA）颁发的完整英国银行牌照，2017 年 5
              月推出手机活期账户，但没有设立实体零售网点。相反，银行依靠覆盖全国的数字银行服务，并由伦敦、卡迪夫、曼彻斯特和南安普敦的区域行政及工程办公室提供支持。Starling
              提供个人、联名、青少年、企业和多币种账户，符合条件的客户存款由金融服务补偿计划（FSCS）在法定限额内提供保护。Starling
              没有向外部金融软件供应商购买传统核心银行平台，而是完全在内部打造云原生核心银行架构。该架构支持持续部署、实时账本结算、Spaces
              等内置预算工具，以及原生移动功能。这套工程基础带来了较高客户满意度和较低运营成本率，使 Starling 成为欧洲金融科技生态中最早实现结构性盈利的新银行之一。
            claimRefs:
              - CO001
              - CO002
              - CO009
              - CO012
