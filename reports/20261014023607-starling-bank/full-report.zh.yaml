      - number: '3.3'
        title: 能力、定价模式与监管合规韧性
        blocks:
          - type: paragraph
            body: >-
              对挑战者模式的能力和定价框架进行比较，可以看到明显分化。Starling 对个人客户坚持拆分且透明的定价理念：日常个人账户免费、境外刷卡不收外汇交易加价、海外 ATM 取现免费、活期账户余额有利息，并提供
              GBP、EUR、USD 多币种账户。相比之下，Monzo 和 Revolut 更强调 Monzo Plus/Premium、Revolut Plus/Premium/Metal/Ultra
              等分层付费订阅，以变现消费权益、旅行保险和生活方式功能。


              Starling 的监管姿态和信任基础建立在 PRA 授予的完整英国银行牌照之上，并接受 FCA 监管；通过 FSCS 为存款提供最高 £85,000 的保护。但合规执行风险限制了竞争韧性。2024 年 9
              月，FCA 因反洗钱（AML）控制和金融制裁筛查存在系统性缺陷，对 Starling 处以 £28.96 million 罚款。


              FCA 的罚款源于调查发现：Starling 为 49,183 名高风险客户开设了 54,359 个账户，违反自愿要求（VREQ），并且 2017 至 2023 年运行的自动制裁筛查只覆盖 OFSI
              Consolidated List 的一部分。这次监管执法表明，资产和账户快速增长可能超过风险管理系统的能力，迫使公司投入大量整改费用并分散管理层精力；同行也在日益严格的英国监管环境中面对同样问题。
