  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间顺序的 轨迹 的 Starling 银行 从 创立 在 2014 through licence receipt, pandemic lending, 盈利能力, 监管 整改, 、 Engine SaaS 扩张.
    data:
      items:
