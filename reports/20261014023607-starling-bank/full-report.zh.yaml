              的法定税前利润。但增长受到显著监管和宏观依赖的约束。2024 年 10 月，FCA 因制裁筛查失败和高风险客户开户违规，对 Starling 处以 £29 million
              罚款，证明数字速度无法绕过反洗钱控制。此外，利率走低会压缩存款息差，凸显扩大 Engine 轻资本软件费收入、对冲周期性净息差收缩的战略必要性。
