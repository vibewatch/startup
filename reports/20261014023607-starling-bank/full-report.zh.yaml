      - number: '4.3'
        title: 资本充足率、偿付能力与监管整改
        blocks:
          - type: paragraph
            body: >-
              Starling 拥有稳健的监管资本基础和资产负债表流动性，但历史合规疏漏招致了巨额罚款。截至 2026 年 5 月，银行披露监管资本盈余超过 £525 million，高于 2025 年的 £400
              million；总股本 £1,204.9 million，总资产 £16,639.9 million。FY2026 税后资本回报率（ROCE）为 24.9%，尽管略低于 FY2025 的
              26.7%，仍保持欧洲数字挑战者中的领先资本效率。


              尽管资产负债表偿付能力强，监管合规已成为关键尽调脆弱点。2024 年 9 月，FCA 因 Starling Bank 自 2017 年起在反洗钱（AML）和金融制裁筛查系统中存在严重缺陷，处以
              £28,959,426 罚款。2021 年 9 月至 2023 年 11 月期间，Starling 违反 VREQ，为 49,183 名高风险客户开设了 54,359
              个账户；自动筛查系统只检查了指定制裁名单的一部分。Starling 获得 30% 和解折扣，并大力投资控制整改和治理升级，但这次执法凸显内部合规基础设施落后于客户快速扩张。
            claimRefs:
              - CI009
              - CI010
              - CI011
      - number: '4.4'
        title: 财务尽调结论与投资判断缺口
        blocks:
          - type: paragraph
            body: >-
              从投资判断角度看，Starling Bank 是欧洲少数具备结构性盈利能力的数字银行之一，FY2026 税前利润 £217 million，连续五年实现净盈利。其盈利核心银行业务和不断扩大的 £70
              million Engine ARR 管线，使其明显区别于只依赖资产负债表扩张的同行。Engine 的高毛利 SaaS 画像带来显著上行期权，使未来盈利增长不再完全取决于英国国内资产负债表规模和信贷评估风险。


              但投资判断必须聚焦两项主要风险。第一，Starling 的收入仍主要来自净利息收入，因此盈利对英国央行基准利率路径高度敏感，FY2026 收入下降 6%
              已说明这一点。第二，私人指标披露仍不完整：公司没有公开披露细分获客成本（CAC）、渠道回本周期和 SME 队列留存安排，无法独立验证单位营销效率。前瞻性尽调需要验证罚款后的监管稳定性，并跟踪 Engine
              多年期合同的实施里程碑，然后才能把激进的估值扩张计入投资判断。
            claimRefs:
              - CI001
              - CI006
              - CI013
              - CI014
