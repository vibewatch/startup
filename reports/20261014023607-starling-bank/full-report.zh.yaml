      - number: '4.2'
        title: 单位经济性、经营杠杆与成本结构
        blocks:
          - type: paragraph
            body: >-
              Starling 的单位经济性显示出持续的经营纪律，核心是高效数字获客和低成本无网点运营模式。截至 FY2026 末，集团客户存款增至 £12.7 billion，分布在 6.2 million
              个平台账户中；FY2025 则为 £12.1 billion、5.3 million 个账户。用户账户平均存款余额达到 £4,241，体现出较高客户质量和较强商业银行参与度。但活跃用户平均收入（ARPAU）由
              FY2025 的 £302 降至 FY2026 的 £275，反映前述宏观利率压缩和新增账户稀释。


              FY2026，主账户关系占客户群的 34.5%，估计指每月贷记交易超过 £500 的账户。这一高比例主账户为运营流动性和刷卡消费提供持久基础；集团 FY2026 处理的交易总额为 £217
              billion。就成本结构而言，Starling 利用外部基础设施合作伙伴，包括 Digital Realty 的实体数据中心托管和 Post Office
              网络的线下现金存款服务。为在利率逆风中保护经营杠杆，管理层于 2026 年进行定向组织重组，关闭伦敦客户支持运营（150 个岗位），并削减约 130 个技术和银行岗位，以消除重复、加快 AI 部署。
