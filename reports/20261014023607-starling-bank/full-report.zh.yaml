  - id: FE001
    title: 产品架构图
    type: stack
    summary: 六层 architectural 堆栈 的 Starling 银行 从 客户 界面 至 regulated 结算 rails.
    data:
      layers:
        - label: 客户 Access & Presentation 层
          detail: Native iOS 、 Android 移动 银行 应用 配有 biometric 认证 、 push 提醒.
        - label: API Gateway & 集成 层
          detail: 公开 REST APIs 用于 BaaS partners, Open 银行 合规 界面, 、 开发者 沙盒.
        - label: Core 银行 & Ledger Engine
          detail: Proprietary real-time event-driven ledger, 账户 状态 machines, 、 multi-currency 余额 processing.
        - label: 财务 Crime & 风险 控制
          detail: 自动化 交易 monitoring, OFSI 制裁 筛查, PEP 检查, 、 AI-驱动的 anti-scam tooling.
        - label: 支付 & Clearing Gateway
          detail: Direct connectivity 至 UK Faster 支付 Scheme, BACS, SEPA, 、 MasterCard 支付 网络.
        - label: 云 基础设施 & Resilience
          detail: 容器化 microservices 托管 在 AWS 云 基础设施 配有 自动化 multi-zone 故障转移.
    approximationNotes: Architectural representation synthesized 从 Starling BaaS API 文档 、 监管 文件.
    claimRefs:
      - CE002
      - CE005
      - CE006
      - CE010
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: End-至-end 客户 、 机构 生命周期 从 移动 开户 至 multi-entity treasury 、 Engine SaaS 平台 采用.
    data:
      items:
        - label: 数字化 开户
          touchpoints:
            - App-基于 KYC/IDV identity verification
            - 即时 账户 opening 在 不足 10 分钟
            - 自动化 credit 、 制裁 筛查
        - label: Primary 账户 激活
          touchpoints:
            - Salary direct 存款 、 初始 企业 转账
            - Debit 卡 发卡 、 数字化 wallet 配置
            - Setup 的 支出 Spaces 、 自动化 储蓄 round-ups
        - label: Workflow 集成
          touchpoints:
            - Direct 集成 配有 Xero, FreeAgent, 或 QuickBooks
            - Multi-user 卡 permissions 、 企业 invoicing
            - 企业 Toolkit 订阅 用于 VAT 、 tax 管理
        - label: 存款 Accumulation & Lending
          touchpoints:
            - Overdraft line 激活 、 期限 lending 应用
            - Treasury 现金 配置 yielding 每日 interest
            - Multi-currency 账目 持有 EUR 、 USD balances
        - label: Marketplace Ecosystem Add-ons
          touchpoints:
            - 第三方 保险, 养老金, 、 专业 lending
            - Over 20 集成的 fintech marketplace partner 工具
            - API-driven 交易 webhook 、 statement 导出
        - label: 机构 & Engine 平台 许可
          touchpoints:
            - Core-银行 平台 许可 至 国际 institutions
            - 迁移 的 multi-million tenant 账户 bases 至 SaaS core
            - Multi-年 经常性 软件 contract 、 云 托管
