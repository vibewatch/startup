              Starling。个体户和小企业看重无摩擦数字开户、零月费账户，以及可选 Business Toolkit 与 Xero、FreeAgent、QuickBooks 的集成，支持超过 400,000 个活跃 SME
              核心账户。Engine by Starling 的买方则是海外商业银行的高管团队和首席信息官，他们希望获得经过验证的云原生核心银行软件，而不是从零搭建现代账本。
