callouts:
  - calloutType: "strength"
    title: "Sustained Neobank Profitability and Core Banking Ownership"
    body: "Unlike European peers that pursued land-grab growth funded by successive venture rounds, Starling established operating profitability by FY2022 and posted £217.1M in pre-tax profit on £887.4M revenue in FY2026. Its decision to author its core banking engine internally rather than renting third-party legacy cores has yielded superior cost structures and created an exportable SaaS asset in Engine."
    claimRefs:
      - "CO007"
      - "CO008"
  - calloutType: "risk"
    title: "Post-Fine Governance and Sanctions Compliance Burden"
    body: "The FCA's £29 million penalty in September 2024 underscored that rapid automated customer onboarding during the pandemic outpaced the bank's financial crime control framework. Remediating legacy screening weaknesses and navigating heightened supervisory scrutiny impose continuous operating overhead as Starling prepares for eventual public listing."
    claimRefs:
      - "CO010"
