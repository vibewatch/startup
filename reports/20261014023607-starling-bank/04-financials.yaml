  name: Starling Bank
chapter:
  number: 4
  title: Financials
  summary: Starling Bank generated £887m in revenue and £217m in pre-tax profit in FY2026, marking its fifth consecutive year of profitability. While retail and SME banking provide a resilient £12.7bn deposit base and 24.9% ROCE, revenue contracted 6% due to lower interest rates, and historical AML control failures resulted in a £28.96m FCA fine.
sections:
  - id: revenue-streams-and-pricing-model
    title: Revenue Streams and Monetization Model
    body: |-
      Starling Bank operates a dual-engine commercial model spanning regulated consumer and business banking alongside enterprise core software licensing. The core banking division generates the vast majority of top-line revenue through net interest income (NII) earned on its lending portfolio and treasury investments, funded by low-cost customer deposits. Non-interest income is driven by card interchange from debit spending, account-related fees, and foreign exchange conversion fees of 0.4% on international transfers. In the financial year ending March 2026, group revenue stood at £887 million, declining 6% from £940 million in FY2025 as Bank of England benchmark rate reductions compressed deposit margins and interest earnings across the sector.

      The secondary growth vector is Engine by Starling, a cloud-native software-as-a-service (SaaS) platform that white-labels Starling's proprietary core banking operating system to external financial institutions globally. Engine reported approximately £10.9 million in trailing software revenue, reflecting roughly 25% year-on-year growth, and closed FY2026 with £70 million in committed annual recurring revenue (ARR). Enterprise licensing agreements, including a multi-year migration partnership with a Scotiabank subsidiary, provide high-margin recurring software revenues that do not encumber Starling's balance sheet or require capital reserves. List pricing for personal and business current accounts remains free of monthly maintenance charges, which anchors customer acquisition and preserves deposit stickiness, while enterprise monetization is achieved via transaction throughput, premium features, and Engine software contracts.
    tableRefs:
      - TI001
      - TI002
    claimRefs:
      - CI001
      - CI006
      - CI007
      - CI013
  - id: unit-economics-and-cost-structure
    title: Unit Economics, Operating Leverage, and Cost Structure
    body: |-
      Starling's unit economics demonstrate sustained operating discipline, driven by efficient digital customer acquisition and a low-cost, branchless operational model. By the end of FY2026, total customer deposits expanded to £12.7 billion across 6.2 million group platform accounts, up from £12.1 billion across 5.3 million accounts in FY2025. The average deposit balance across user accounts reached £4,241, highlighting high customer quality and substantial business-banking engagement. However, average revenue per active user (ARPAU) contracted from £302 in FY2025 to £275 in FY2026, reflecting the aforementioned macro interest rate compression and dilution from newer accounts.

      Primary account relationships accounted for 34.5% of the customer base in FY2026, estimated as accounts processing more than £500 in monthly credit transactions. This high proportion of primary users provides an enduring base of operational liquidity and card spend, with £217 billion in total transaction value processed across the group in FY2026. On the cost structure side, Starling leverages external infrastructure partnerships, including Digital Realty for physical data center hosting and the Post Office network for in-person cash deposits. To protect operating leverage amidst rate headwinds, management executed targeted organizational restructuring in 2026, shuttering London customer support operations (150 roles) and cutting approximately 130 technology and banking positions to eliminate duplication and accelerate artificial intelligence deployment.
    tableRefs:
      - TI003
    figureRefs:
      - FI001
    claimRefs:
