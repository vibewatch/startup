- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Buy button and Buyer Protection
    - Usage may stay low if trust-sensitive buyers still go off-platform
    - Limits monetization and retention uplift
    - Request buy-button penetration by category and market
  - - Certified categories and stores
    - May concentrate economics in a few higher-value categories
    - Can improve ARPU but narrow breadth of monetization
    - Request GMV and repeat-rate split for phones, luxury, and autos
  - - CarouBiz and specialist merchants
    - Professional seller mix may still be small
    - Expansion case weaker if casual supply dominates
    - Request merchant-tier revenue mix and repeat listing cadence
  - - Singapore-led verification and trust regulation
    - Customer journey may be most advanced only in Singapore
    - Other markets may lag on trust product maturity
    - Request market-by-market trust-feature adoption
  - - Six-market main app footprint
    - Growth may depend on a limited set of mature markets
    - Geographic concentration can cap incremental growth
    - Request active users and revenue by market
  notes: For Carousell, concentration is more likely to appear through market and seller mix than through a handful of named accounts.
