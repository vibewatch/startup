company:
  name: Carousell
chapter:
  number: 6
  title: Customers
  summary: 'Carousell has clear evidence of mass-market adoption, multi-market reach, and a more structured trust-led customer journey than the old “classifieds app” label implies. Public sources support tens of millions of users, strong app-store ratings, 29 stores, and embedded review and trust systems for both casual and professional sellers. The weak spot is retention precision: public evidence says much less about cohorts, repeat rates, and seller mix than it does about scale and trust signals.'
sections:
- id: segments
  title: Customer segments and who uses Carousell
  body: 'Carousell''s customer base is not one monolithic group. Public evidence supports at least four distinct user types: casual consumers clearing unused items, bargain-seeking buyers, specialist or professional merchants, and business sellers using CarouBiz. Category breadth matters here because each segment behaves differently. Home services, property, autos, and luxury are not just different products; they involve different trust needs, transaction speeds, and monetization potential. The existence of Specialist Awards, verified business badges, and CarouBiz terms all show that Carousell is consciously nurturing more structured seller types alongside everyday peer-to-peer use. At the same time, app-store language and the core product still position the platform as something ordinary consumers can use with minimal friction. That mix of casual and professional participation is central to how Carousell scales supply without becoming a pure merchant marketplace. In practice, each segment
    likely responds to a different mix of price, trust, convenience, and speed.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU029
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption
  title: Adoption trajectory and visible growth signals
  body: The public package is much stronger on broad adoption than on exact growth mechanics. Carousell Group says it serves tens of millions of users across seven markets, while app-store surfaces speak of millions of people using the app to declutter, earn money, and source deals. The company does not currently publish a precise MAU figure in the reviewed sources, which limits trend precision, but it does provide several supporting adoption signals. These include 29 physical stores, strong category breadth, and an AI-led listing experience that Google Cloud says has already increased items listed by 20%. DealStreetAsia also reports more than 20% GMV uplift from stores and official trade-ins. That combination suggests the business is not just holding a large dormant user base; it is actively trying to increase transaction density, trust, and frequency through lower-friction listing and higher-trust offline touchpoints.
  claimRefs:
  - CU001
  - CU013
  - CU014
  - CU018
  - CU019
  - CU023
  - CU024
  - CU026
  - CU027
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: proof
  title: Customer proof, trust signals, and satisfaction evidence
  body: 'For a consumer marketplace, customer proof comes less from named enterprise logos and more from layered evidence about reviews, reputation signals, and actual transaction safeguards. Carousell''s review help pages show a real reciprocal review system where buyers and sellers score each other on transaction quality and can leave compliments that become visible profile assets. Specialist Awards and verified business badges add another layer of merchant proof, especially for higher-intent buyers. The trust stack is reinforced by public scam and verification metrics: 99.96% scam-free transactions in 2025, more than 93% of users not encountering a scammer, and large-scale enforcement against suspicious accounts. The important caveat is that external customer sentiment is not perfectly clean. App-store ratings are strong, but review-aggregation sites still surface cautionary signals about safety and support quality. The right conclusion is that Carousell has meaningful proof of customer
    activity and trust, but not frictionless satisfaction. That distinction is important because marketplace health depends on many small trust cues compounding into willingness to transact again.'
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU037
