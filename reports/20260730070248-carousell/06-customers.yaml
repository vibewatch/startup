  - - Luxury or certified-category users
    - Higher-trust buyers and consignors
    - Authenticated luxury and direct-sell workflows
    - Production
    - Authentication and confidence claims support premium categories
    - Outcome detail is stronger on trust than on frequency
  notes: For a marketplace, “named proof” is better interpreted as identifiable proof surfaces and merchant sets, not enterprise logo customers.
