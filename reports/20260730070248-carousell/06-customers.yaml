- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale signal
  - Revenue / strategic value
  - Gap
  rows:
  - - Casual consumers
    - Buyer and seller are often the same household user
    - Declutter, bargain hunt, local trades
    - Millions of app users across six main Carousell markets
    - Liquidity engine and brand reach
    - No exact share of GMV or revenue
  - - Trust-sensitive buyers
    - Buyers of phones, luxury, cars, and other higher-risk used goods
    - Need verification, safer payment, and delivery
    - Certified, Buyer Protection, stores, and direct-sell programs exist
    - Higher monetization and repeat-purchase potential
    - No category-specific repeat-rate disclosure
  - - Specialist merchants
    - Merchants recognized through Specialist Awards or verified business flows
    - Sell with reputation and service quality emphasis
    - Specialist Awards and verified business badges are public
    - Improves quality supply and customer confidence
    - Merchant count and GMV share unknown
  - - Business sellers
    - Businesses using CarouBiz subscriptions
    - Branding, operations, repeat listings
    - CarouBiz subscription terms are public
    - Potentially higher ARPU and repeat usage
    - Plan adoption and revenue contribution undisclosed
  notes: Segments are inferred from public product and policy surfaces rather than one explicit management segmentation chart.
