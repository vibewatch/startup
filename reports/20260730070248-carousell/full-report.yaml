  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What the product delivers now
        blocks:
          - type: paragraph
            body: >-
              Carousell no longer presents only a listing board where buyers and sellers chat and leave the rest
              offline. The visible product stack now includes listing creation, reviews, safe checkout, official
              delivery, trusted home services, CarouBiz merchant tooling, Carousell Certified, and direct Sell to
              Carousell flows for selected categories. That broadening matters because it changes the job Carousell is
              solving. In lower-risk categories, the app can still behave like a lightweight peer marketplace. In
              higher-risk categories such as phones, luxury bags, and cars, the product increasingly inserts itself into
              verification, payment protection, and sometimes the inventory intake path itself. LuxLexicon and other
              category moves reinforce that Carousell is assembling multiple product lines around the same trust-heavy
              secondhand workflow rather than remaining a generic classifieds front end. That widening product scope
              explains why category operations and trust features now matter as much as listing liquidity alone.
