  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory pressure is not hypothetical for Carousell; it is already shaping product requirements in
              Singapore. MHA has directly assessed the platform under the Online Criminal Harms Act framework and
              required stronger controls after abuse of verified accounts persisted. That alone elevates regulatory risk
              above a generic consumer-platform concern. Legal and policy complexity is also broadening as Carousell
              handles sensitive identity, payment, location, chat, and dispute data across multiple jurisdictions. The
              sanctions and AML policy suggests a separate layer of compliance overhead around geography and
              financial-crime screening. None of this means the company is uniquely non-compliant, but it does mean risk
              is cumulative: scam prevention, identity verification, privacy, and cross-border compliance all converge
              in one customer-facing product. Because regulators can tighten requirements faster than platforms can
              cheaply adapt, compliance cost and user friction are both material downside channels. The terms and
              prohibited-content rules also show that Carousell must police behavior, listings, and identity at a
              granular level, increasing policy-enforcement burden as transaction volume scales.
            claimRefs:
