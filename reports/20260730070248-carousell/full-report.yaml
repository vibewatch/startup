      - number: '7.3'
        title: Dependency, financial, and market-structure risk
        blocks:
          - type: paragraph
            body: >-
              Carousell depends on a complex external stack. Google Cloud sits inside AI, data, and compute workflows,
              while Cloudflare supports core traffic handling and attack mitigation. App stores, payment systems,
              delivery partners, and verification rails also mediate parts of the customer journey. That would be
              manageable in a benign market, but the external market is anything but benign. Regional e-commerce and
              social-commerce are now dominated by a handful of scaled platforms, with Shopee and TikTok Shop exerting
              particularly strong pull on demand formation and seller economics. For Carousell, this means risk is both
              partner and market-structure driven: a cloud or platform problem can hurt operations, while an intensified
              competitive environment can force higher trust spend, lower take-rate ambition, or slower path to net
              profitability. EBITDA positivity is real, but it does not remove the model risk created by competitive
              intensity and still-incomplete public unit economics. In other words, Carousell is not competing in a calm
              classifieds niche anymore; it is underwriting trust and transaction quality inside a much harsher regional
              commerce stack.
