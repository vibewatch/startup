  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape by competitor class
        blocks:
          - type: paragraph
            body: >-
              Carousell should be benchmarked against a competitor set defined by user jobs, not just by other Southeast
              Asian startups. The closest substitute for many casual sellers is Facebook Marketplace, which combines
              discovery and built-in identity. For more structured resale and higher-scale seller behavior, eBay and
              Mercari are more relevant comparators because they put more emphasis on trust, tools, and repeat listing
              behavior. Traditional classifieds players such as OLX, Quikr, OfferUp, Craigslist, and Wallapop remain
              useful benchmarks for the persistence of local-listing demand, even if they do not match Carousell market
              for market. Depop and similar vertical specialists matter in fashion-led resale, while offline dealers and
              local social groups remain status-quo alternatives. This classification matters because Carousell is not
              trying to beat all rivals the same way. It needs a different answer for casual local resale, a different
              answer for higher-ticket trusted transactions, and another for vertical merchant workflows.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP033
