      - number: '6.3'
        title: Customer proof, trust signals, and satisfaction evidence
        blocks:
          - type: paragraph
            body: >-
              For a consumer marketplace, customer proof comes less from named enterprise logos and more from layered
              evidence about reviews, reputation signals, and actual transaction safeguards. Carousell's review help
              pages show a real reciprocal review system where buyers and sellers score each other on transaction
              quality and can leave compliments that become visible profile assets. Specialist Awards and verified
              business badges add another layer of merchant proof, especially for higher-intent buyers. The trust stack
              is reinforced by public scam and verification metrics: 99.96% scam-free transactions in 2025, more than
              93% of users not encountering a scammer, and large-scale enforcement against suspicious accounts. The
              important caveat is that external customer sentiment is not perfectly clean. App-store ratings are strong,
              but review-aggregation sites still surface cautionary signals about safety and support quality. The right
              conclusion is that Carousell has meaningful proof of customer activity and trust, but not frictionless
              satisfaction. That distinction is important because marketplace health depends on many small trust cues
              compounding into willingness to transact again.
