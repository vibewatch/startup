      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Carousell's financial arc is better than the stale “loss-making classifieds unicorn” narrative, but it
              still falls short of clean public-company-style transparency. The platform now has evidence of revenue
              scale, a more credible mix shift toward trust-led recommerce, and early operating leverage from AI and
              infrastructure work. Against that, almost every precision metric an investor would want for pricing or
              downside protection is still missing: take rates, gross margin by stream, repeat-purchase cohorts, seller
              CAC, cash conversion, and up-to-date runway. Public app pricing shows that monetization exists, but not
              how durable or profitable it is. The correct diligence stance is therefore constructive but conditional.
              Carousell appears to be improving the quality of its economics, yet the data package remains too sparse
              for a high-confidence intrinsic value call without direct management disclosure. That distinction should
              matter in committee discussions and price discipline.
