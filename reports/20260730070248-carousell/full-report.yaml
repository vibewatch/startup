        title: Durability, expansion, and concentration risks
        blocks:
          - type: paragraph
            body: >-
              The durability question is where public evidence gets thinner. Carousell's likely land-and-expand path is
              not classic enterprise upsell but migrating users toward higher-trust and higher-monetization workflows:
              Buy button, certified categories, specialist merchants, Sell to Carousell, and stores. Those pathways can
              deepen engagement and raise revenue per active user, especially in phones, luxury, and autos. Customer
              concentration risk is also structurally different from enterprise software. Carousell is unlikely to
              depend on a handful of named accounts, but it can still be concentrated by geography, trust regulation,
              and seller mix. Singapore matters disproportionately because the most visible verification, Singpass, and
              anti-scam requirements are documented there. Most importantly, none of the reviewed public sources
              disclose actual retention, churn, cohort behavior, or professional-seller share. Investors therefore have
