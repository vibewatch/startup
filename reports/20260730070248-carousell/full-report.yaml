        title: Leadership, governance, and investor control points
        blocks:
          - type: paragraph
            body: >-
              The public record supports Siu Rui Quek as the central operating and narrative figure: he is repeatedly
              quoted as co-founder and CEO, he remains the spokesperson on funding, profitability, and IPO optionality,
              and the group's current transformation story is tied directly to his commentary. The named founding team
              in public databases includes Quek, Marcus Tan, and Lucas Ngoo, but disclosure on current executive depth
              is thinner than the strength of the brand might imply. The strongest newly visible non-founder leaders in
              2026 are Shing Tai Leung, the chief strategy officer quoted on data and AI, and Rajath Ramesh, the product
              and platform engineering leader in Google Cloud's case study. JJ Ang appears as CFO in FY24 results
              coverage. Governance visibility remains incomplete: official materials confirm Jason Cho joining the board
              in 2021, while Tracxn lists additional board members, but committee structure, observer rights, and
              current investor designation are not public. That leaves Carousell with real key-person concentration risk
              around Quek even though the founder bench and investor roster are both broad.
