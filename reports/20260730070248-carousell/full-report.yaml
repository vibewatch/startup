      - number: '7.2'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              Carousell's operating risks are the classic problems of open marketplaces at meaningful scale: phishing,
              off-platform deal migration, deposit scams, counterfeit exposure, account takeover, and reliability
              expectations that rise as the platform pushes more transactions on-platform. The good news is that
              Carousell appears to run a layered mitigation stack, including ML detection, link blocking, review loops,
              official delivery, Buyer Protection, dispute banners, and moderation. The bad news is that every one of
              those protections costs money, adds workflow friction, or still fails in some edge cases. No public
              incident log or uptime disclosure resolves the availability question, and merchant terms explicitly carve
              out downtime beyond Carousell's control. The risk is therefore not simply that fraud exists; it is that
              the company may have to keep spending heavily on controls just to preserve trust at current levels, while
              still facing public criticism when scam counts rise.
            claimRefs:
