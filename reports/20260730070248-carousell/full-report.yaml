      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              Public partner evidence gives an unusually concrete picture of Carousell's technical stack for a private
              marketplace business. Google Cloud says the company uses Gemini, Vertex AI, BigQuery, Compute Engine, GKE,
              Cloud Storage, and Google Workspace across user-facing and internal workflows. The flagship “List with AI”
              feature uses multimodal input to generate title, description, category, price, and condition attributes,
              shifting listing from manual drafting to guided review. On the infrastructure side, Cloudflare describes a
              platform serving around one petabyte of images per month and handling flash-sale traffic spikes above
              three times normal volume with caching, WAF, DNS, and SSL services. This is not enough to reconstruct the
              whole architecture, but it is enough to conclude that Carousell's operating model is production-scale,
              cloud-native, and increasingly AI-mediated on both customer and internal workflows. The documented stack
