  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Anchor valuation and business-quality shift
        blocks:
          - type: paragraph
            body: >-
              The starting point for Carousell valuation is still the September 2021 unicorn round at US$1.1 billion,
              because no cleaner public financing mark has replaced it. That anchor is old, but it is not irrelevant. In
              the years since, the company has moved from a still-loss-making but growing marketplace into a business
              that reported US$141 million of FY25 revenue and positive EBITDA. The operating profile is therefore
              better than the headline valuation timestamp implies. At the same time, investors cannot simply mark the
              company upward because business quality improved. The missing ingredients are public GMV, category-level
              take rates, durable net profitability, and evidence that recommerce stores and specialist verticals earn
              attractive returns. The right framing is not “old valuation equals wrong valuation,” but “old valuation
              now needs to be re-judged against stronger fundamentals and still-material uncertainty.” Investors also
              need to remember that private market marks can stay flat while fundamentals improve; that dynamic alone
              does not make the current price wrong, but it does make scenario analysis more important than headline
              nostalgia.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV001
