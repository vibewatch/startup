    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and mix
        blocks:
          - type: paragraph
            body: >-
              Carousell is no longer best described as a simple classifieds site monetized only by listing visibility or
              ad products. The strongest public evidence now shows a blended model: classifieds advertising, recommerce
              transactions, buyer-protected checkout, delivery-linked services, and merchant tools. FY24 reporting broke
              revenue into recommerce, classifieds advertising, and other revenue, while FY25 coverage emphasized that
              recommerce had grown to 45% of group revenue. App-store surfaces also reveal explicit monetization hooks
              such as CarouBiz subscriptions, listing bumps, and coins. This matters because it changes how revenue
              quality should be judged. Advertising-heavy classifieds businesses can be lighter but weaker on close-rate
              monetization, while transaction-led recommerce can compound take rate and repeat usage if trust,
              logistics, and inspection actually raise conversion. Carousell appears to be trying to move into that
              second category, but its public evidence still reveals more about topline direction than about
              gross-profit conversion by stream.
