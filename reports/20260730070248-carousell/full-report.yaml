      - number: '2.2'
        title: 'Regional sizing: large backdrop, narrower serviceable market'
        blocks:
          - type: paragraph
            body: >-
              Multiple third-party datasets support the conclusion that Southeast Asia is one of the world's
              fastest-growing digital commerce regions. UnivDatos sizes the 2024 market at US$201.9 billion, while
              AFFiNCO and Sellercraft place 2026 GMV around US$230-234 billion. Statista's topic page and Hashmeta's
              synthesis also point to a regional market already well above US$139 billion and still compounding at
              double-digit rates. The common picture is consistent even when the exact totals differ: Indonesia is the
              volume leader, Vietnam is among the fastest-growing markets, and Singapore is a smaller but far
              higher-spending premium market. For Carousell, this means the macro tide is supportive, but serviceable
              spend must be haircut aggressively for geography and category focus. Carousell does not cover Thailand,
              and much of headline regional GMV sits in categories or merchant models that look nothing like secondhand
              classifieds or recommerce. The right conclusion is not that Carousell owns a US$200+ billion market; it is
              that Carousell is riding a powerful macro shift inside a much narrower but still very large local resale
              and trust-enabled commerce wedge.
