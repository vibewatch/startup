chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, origins, and scope
        blocks:
          - type: paragraph
            body: >-
              Carousell Group presents itself as a Singapore-founded, mobile-first marketplace built around the idea
              that selling should feel as easy as taking a photo and buying as easy as chatting. The current press fact
              sheet anchors the company in August 2012, describes a leading presence across Singapore, Hong Kong,
              Malaysia, Indonesia, the Philippines, Taiwan, and Vietnam, and frames the mission as making secondhand the
              first choice for everyone. The business has moved meaningfully beyond a single classifieds app: Carousell
              now describes a portfolio that includes regional classifieds brands, vertical assets in fashion, luxury,
              and mobile phones, and operating layers such as payments, shipping, seller subscriptions, and
              inspection-based trust services. The 2021 unicorn announcement still referenced eight markets and the
              OneKyat brand, while the 2026 fact sheet has shifted to seven markets and a different brand set. That
              suggests the company has already rationalised parts of its regional footprint rather than simply adding
              logos without pruning.
