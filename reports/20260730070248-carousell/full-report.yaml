              - CV034
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV027
              - CV028
              - CV029
              - CV032
      - number: '8.4'
        title: Investment stance
        blocks:
          - type: paragraph
            body: >-
              The most defensible stance is a conditional-pass posture with an at-market to slightly above-market
              valuation view. Carousell has earned that better stance through real revenue scale, an EBITDA milestone,
              growing recommerce mix, and a strategy that now looks more structurally differentiated than it did in
              2021. However, the company has not yet earned an unqualified premium mark close to the very best private
              recommerce leaders, because it still carries disclosure gaps, regional competition pressure, trust cost
              uncertainty, and execution complexity from stores and vertical operations. Investors should be open to the
              current valuation if management can prove durability rather than merely momentum. The next leg of upside
              depends less on narrative and more on whether FY26 converts EBITDA positivity into repeatable,
              risk-adjusted operating quality. Until those proofs arrive, discipline should come from terms, governance
              asks, and milestone-based conviction rather than from pretending that one point estimate is exact.
            claimRefs:
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
