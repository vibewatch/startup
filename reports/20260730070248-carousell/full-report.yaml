  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and who uses Carousell
        blocks:
          - type: paragraph
            body: >-
              Carousell's customer base is not one monolithic group. Public evidence supports at least four distinct
              user types: casual consumers clearing unused items, bargain-seeking buyers, specialist or professional
              merchants, and business sellers using CarouBiz. Category breadth matters here because each segment behaves
              differently. Home services, property, autos, and luxury are not just different products; they involve
              different trust needs, transaction speeds, and monetization potential. The existence of Specialist Awards,
              verified business badges, and CarouBiz terms all show that Carousell is consciously nurturing more
              structured seller types alongside everyday peer-to-peer use. At the same time, app-store language and the
              core product still position the platform as something ordinary consumers can use with minimal friction.
              That mix of casual and professional participation is central to how Carousell scales supply without
              becoming a pure merchant marketplace. In practice, each segment likely responds to a different mix of
              price, trust, convenience, and speed.
            claimRefs:
