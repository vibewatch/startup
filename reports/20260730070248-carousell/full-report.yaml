      - number: '5.4'
        title: Trust, safety, compliance, and quality controls
        blocks:
          - type: paragraph
            body: >-
              Trust and safety are central product features, not a compliance afterthought. Carousell's own help-centre
              materials describe AI and machine-learning detection, moderator review, dispute banners, real-time
              warnings, mobile verification, and 2FA or SMS re-verification. MHA and other independent reporting add
              stronger evidence still: Carousell committed to passkeys or biometric logins, account-suspension controls,
              and Singpass blacklist measures after verified accounts were abused for scams. The MHA transaction-safety
              page also frames user badges, secure payments, official delivery, and record retention as productized
              safeguards. Meanwhile, the sanctions policy shows a separate compliance layer dealing with unsupported
              geographies and prohibited transactions. Together these sources support a clear conclusion: Carousell has
              built a layered trust stack that spans interface, workflow, moderation, identity, and compliance. What
              remains unknown is the exact precision of those systems and the operational cost of running them at scale.
              In other words, Carousell is shipping a trust operating system as much as a marketplace app.
