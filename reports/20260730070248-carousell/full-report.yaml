  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what counts
        blocks:
          - type: paragraph
            body: >-
              Carousell should not be underwritten against all Southeast Asian digital commerce. The right market
              boundary is the portion of consumer commerce where secondhand supply, peer-to-peer discovery, seller
              tools, and trust layers actually matter. Carousell's own materials show the company spanning goods, cars,
              luxury, mobile phones, fashion, property, home and living, and services; its recommerce strategy then adds
              inspection, seller subscriptions, integrated payments, shipping, and direct sell-to-platform workflows.
              That means the relevant market includes C2C and lightly intermediated secondhand transactions, classifieds
              monetization attached to those categories, and selected adjacent seller services. It excludes most
              first-party retail GMV, food delivery, pure grocery, and markets where Carousell does not operate. This
              distinction matters because broad SEA e-commerce TAM numbers are real but misleading if treated as
              directly addressable. Carousell is not competing for all online retail baskets; it is competing for the
              subset where trust, convenience, and local resale liquidity can beat both informal offline trade and
              horizontal mass-market platforms.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM022
              - CM037
