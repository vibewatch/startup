            body: >-
              The most credible proof of product maturity is not just what Carousell says, but what its partners and
              public engineering surfaces show. GitHub reveals an organization with public repositories in Go, Swift,
              Kotlin, TypeScript, Python, and shell tooling, including the Orion microservice framework built around
              grpc/protobuf. Google Cloud also describes a roadmap that extends beyond the current AI listing experience
              toward sub-45-second listing time, richer stylistic attributes for discovery, and internal agentic tooling
              that may shorten engineering work. None of this proves a hard technology moat by itself. Larger
              competitors can buy or replicate many generic AI capabilities. But it does indicate a serious product and
              platform organization with the ability to turn infrastructure, data, and process improvements into
              user-facing speed and trust gains. Carousell's real edge appears operational and integrative rather than
