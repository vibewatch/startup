              - CV037
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The 2021 valuation aged better than expected
            body: >-
              Because Carousell improved to US$141M revenue and positive EBITDA by FY25, the old unicorn mark is no
              longer obviously stale or inflated.
            calloutType: insight
            claimRefs:
              - CV001
              - CV002
              - CV003
          - type: callout
            title: Premium case still lacks proof on unit economics
            body: >-
              Without public GMV, category contribution margins, and store productivity, investors cannot fully
              underwrite a premium private-recommerce multiple.
            calloutType: risk
            claimRefs:
              - CV021
              - CV031
              - CV039
          - type: callout
            title: Conditional-pass, not maximalist enthusiasm
            body: >-
              Carousell looks worthy of engagement at roughly the current valuation band, but the next step up in
              confidence requires proof of durable EBITDA and efficient trust-led growth.
            calloutType: recommendation
            claimRefs:
              - CV037
              - CV038
              - CV040
