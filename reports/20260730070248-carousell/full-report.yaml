      - number: '1.4'
        title: Milestones, adverse events, and current trajectory
        blocks:
          - type: paragraph
            body: >-
              Carousell's chronology shows a company that has alternated between capital formation, portfolio building,
              and operational tightening. The September 2021 US$100 million STIC-led round pushed valuation to US$1.1
              billion and formally positioned the group around trusted secondhand commerce, including certified mobiles,
              auto programs, and integrated shipping. By 2025 the message had changed from growth-at-all-costs to
              disciplined execution: Quek emphasised capital optionality rather than imminent IPO timing, and industry
              coverage flagged both the aborted SPAC path and the December 2024 layoffs of 76 employees. At the same
              time the company deepened physical and AI-enabled recommerce. By end FY25 it operated 29 stores across
              four markets, claimed more than 20% GMV uplift in targeted categories from those stores, and described AI
              as already improving listing speed, fraud detection, translation, and engineering efficiency. The central
              diligence question is whether Carousell's FY25 EBITDA inflection reflects a durable new earnings profile
              or only the first step toward one.
