      - number: '1.3'
        title: Economics, business-model shift, and scale indicators
        blocks:
          - type: paragraph
            body: >-
              The most important strategic fact about Carousell in 2026 is not simply that it remains a unicorn; it is
              that the company has materially changed the shape of the business since that 2021 mark. FY25 revenue
              reached US$141 million, up 18% year on year, and management said the group became EBITDA positive.
              Recommerce revenue grew 40% and accounted for 45% of total revenue, making it the biggest contributor to
              incremental growth. That stands in contrast to FY24, when public coverage described a slower topline year
              at US$119.3 million, a US$33.2 million net loss, and a cleaner but still incomplete view of the mix: US$53
              million from recommerce, US$52.8 million from classifieds advertising, and US$13.5 million from other
              revenue. Public scale indicators still have caveats. Management uses rounded language such as tens of
              millions of users and 800+ teammates, while Dealroom shows 1,239 mapped employees. Those numbers are
              directionally helpful but not yet data-room grade.
