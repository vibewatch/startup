      - number: '7.4'
        title: People, execution, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Execution risk is still one of the most important investment risks because the strategy itself is
              operationally demanding. Carousell is simultaneously trying to increase trust, professionalize sellers,
              run stores and trade-ins, integrate acquisitions, and improve profitability. The company has already shown
              that miscalibration can lead to painful corrections, including workforce reductions in 2022 and 2024. This
              does not prove weak management; it does prove that the strategy has little room for sloppy execution. The
              founder-CEO remains the public face of capital allocation, profitability messaging, and strategic
              direction, which increases key-person sensitivity. Investors should therefore focus less on whether risk
              exists and more on whether it is being converted into monitorable controls. The thesis breaks if trust
              controls remain costly but ineffective, if category operations fail to earn their keep, or if competition
              forces Carousell back into subsidy-heavy behavior.
            claimRefs:
              - CR027
