      - number: '3.2'
        title: Feature breadth and trust positioning
        blocks:
          - type: paragraph
            body: >-
              Carousell's strongest competitive argument is not raw assortment or social reach but trust-enabled
              completion. App-store surfaces and company materials show Buyer Protection, certified listings, delivery,
              and safer payment flows that go materially beyond bare-listing products. Singapore regulatory signals
              strengthen that posture further: Carousell publicly participates in enhanced verification measures and has
              a large visible safety-and-security help surface. Relative to Craigslist-like substitutes, that is a
              meaningful advantage. Relative to Facebook Marketplace, it is a more explicit trust stack but with less
              native discovery power. Relative to eBay, Carousell has a more regional and local-market focus but less
              global liquidity and less obviously mature seller tooling. The platform therefore sits in an intermediate
              position: stronger than lightweight classifieds on trust and completion, but not as broad as the largest
              global marketplaces or social networks.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP014
