summary:
  headline: |
    Carousell 的经营改善已足以让投资人认真推进接触：FY25 收入达到 US$141M，
    循环电商已贡献 45% 收入，集团也报告 EBITDA 转正。
    但公司仍夹在高溢价私有循环电商赢家与更便宜的上市二手交易可比公司之间；
    信任、竞争和披露缺口也让 2021 年独角兽估值很难直接成立为高溢价案例。
    合适姿态是有条件跟进：密切观察、加深尽调，只有 FY26 证明盈利经风险调整后仍可持续，
    才上调信心。
