  topStrengths:
    - FY25 收入 US$141M 且 EBITDA 转正，说明业务质量明显好过 2021 年独角兽标签本身传递的信息
    - 循环电商现已贡献 45% 收入，模型更靠交易驱动，也可能比纯分类信息市场更守得住
    - 29 家实体门店和专门品类流程，在奢侈品、时尚和手机品类里拼出差异化的全渠道信任主张
    - 管理层明显在投入 AI 辅助信任、刊登和运营；如果也能降低摩擦和成本，护城河可能继续拉宽
    - 相比眼前融资需求，公司资金看起来较充足，历史累计融资约 US$376M
  topRisks:
    - 新加坡监管仍要求更强反诈骗控制，说明信任和验证风险还在塑造产品，而不是已经解决
    - Shopee、TikTok Shop、Lazada 等大规模电商平台的竞争，可能挤压流量质量、卖家注意力和变现
    - 公开披露仍缺 GMV、品类级抽佣率、FY25 净利润和门店级回报，限制了高估值论证的可信度
    - 门店、专家、以旧换新和跨品牌整合会抬高运营复杂度；即便收入结构改善，执行负担也在加重
    - 历史 US$1.1B 估值接近可辩护 2026 区间的乐观端，估值出错空间有限
  unresolvedGaps:
    - 目前没有公开的 2026 年 Carousell 新股或老股定价事件，真实当前成交价仍未知
    - 公开 GMV、贡献利润率、CAC 回本周期和门店队列经济性未披露
    - FY25 期末现金、债务额度，以及欺诈或纠纷准备金假设未公开
    - 如果 FY26 信任与安全支出或竞争强度进一步上升，EBITDA 能维持多久仍不清楚
    - 专门垂直品类和实体门店的确切回报曲线，公开证据仍未证明
