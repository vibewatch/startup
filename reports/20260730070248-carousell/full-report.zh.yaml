      - number: '3.3'
        title: 定价不透明、切换成本与护城河逻辑
        blocks:
          - type: paragraph
            body: >-
              公开竞争对手定价资料零散，因此能力和行为证据比整齐的价格表更可靠。最重要的结构性事实是多平台发布很容易。卖家常能把同一件商品跨多个应用发布，这让切换成本保持低位，也削弱任何硬锁定主张。于是，流动性密度、信任信号和重复卖家工具比单纯功能对齐更重要。Carousell
              在信任敏感品类中受益于认证流程、门店和更安全成交，但在买家只需要简单本地商品发布和聊天的场景里仍然脆弱。因此，公司的护城河是有条件的。风险降低足以改变用户行为、支撑更高变现或重复使用时，它最强；商品发布可替代、分发由社交图谱驱动、价格是唯一重要决策标准时，它最弱。对尽调而言，实际含义是管理层必须证明品类层面的成交率改善、重复卖家行为和可衡量的信任驱动变现，而不能只证明产品宽度。没有这些证明，即便市场平台打磨得很漂亮，也仍可能像商品化商品发布界面一样运转。
