  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 按竞争对手类型划分的格局
        blocks:
          - type: paragraph
            body: >-
              Carousell 的对标对象应由用户任务定义，而不只是其他东南亚创业公司。对许多随手卖东西的用户来说，最接近的替代品是 Facebook
              Marketplace，它把发现和内置身份结合在一起。对更结构化的转售和更大规模卖家行为而言，eBay 和 Mercari
              更有参考意义，因为它们更强调信任、工具和重复发布行为。OLX、Quikr、OfferUp、Craigslist 和 Wallapop
              等传统分类信息玩家，仍是判断本地商品发布需求韧性的有用基准，即便它们无法逐市场匹配 Carousell。Depop 和类似垂直专家在时尚驱动转售中重要，线下经销商和本地社群则仍是现状替代方案。这个分类很重要，因为
              Carousell 不是要用同一种方式打败所有对手。面对随手本地转售，它需要一种答案；面对高客单可信交易，需要另一种答案；面对垂直商户工作流，还需要第三种答案。
