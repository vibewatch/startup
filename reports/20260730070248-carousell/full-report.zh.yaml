            body: >-
              持久性问题上，公开证据变薄。Carousell 可能的先落地再扩张路径不是经典企业增购，而是把用户迁移到更高信任、更高变现的工作流：Buy button、认证品类、垂直商户、Sell to Carousell
              和门店。这些路径可以加深参与度、提高每活跃用户收入，尤其在手机、奢侈品和汽车中。客户集中风险也与企业软件结构不同。Carousell
              不太可能依赖少数命名账号，但仍可能按地理、信任监管和卖家结构集中。新加坡的重要性不成比例，因为最可见的验证、Singpass
              和反诈骗要求都在那里有记录。最重要的是，所审阅公开来源没有披露真实留存、流失、用户分群行为或专业卖家占比。因此，投资人看到的是好的规模故事、还不错的信任故事，以及不完整的持久性故事。这也意味着，管理层披露用户分群的价值会远高于又一个宽口径用户数标题。
