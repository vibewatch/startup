  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚点与业务质量变化
        blocks:
          - type: paragraph
            body: >-
              Carousell 估值的起点仍是 2021 年 9 月 US$1.1B 的独角兽轮，因为之后没有更干净的公开融资标记取代它。这个锚点已经旧了，但并非无关紧要。几年下来，公司从仍在亏损但保持增长的市场平台，变成
              FY25 收入 US$141M、EBITDA 为正的业务。因此，运营画像比估值时间戳本身更好。不过，投资人不能因为业务质量改善就简单上调估值。缺的东西仍然是公开
              GMV、分品类抽佣率、可持续净利润，以及二手电商门店和专业垂类能赚到有吸引力回报的证据。正确框架不是「旧估值等于错估值」，而是「旧估值现在必须拿更强的基本面和仍然不小的不确定性重新判断」。投资人也要记住，私募市场标记可以在基本面改善时保持不变；这种动态本身不说明当前价格错了，但确实让情景分析比标题式怀旧更重要。
            claimRefs:
              - CV001
