  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Carousell 的公开轨迹从 2012 年新加坡创立出发，经过 2021 年独角兽融资，进入 2025-2026 年二手循环商业盈利拐点。
    data:
      items:
        - date: 2012-08
          label: 在新加坡创立
          detail: Carousell 由 Siu Rui Quek、Marcus Tan 和 Lucas Ngoo 创立。
          tone: positive
        - date: '2020'
          label: 独角兽前估值抬升
          detail: 公开报道将早期 Naver 领投融资与约 US$900M 估值联系起来。
          tone: positive
        - date: 2021-04
          label: 汽车垂类推进
          detail: Carousell Auto Group 是更强调信任的汽车交易布局之一。
          tone: positive
        - date: 2021-09
          label: US$100M Series E 轮
          detail: STIC 领投轮将 Carousell 估值定在 US$1.1B，使其成为新加坡独角兽。
          tone: positive
        - date: 2024-12
          label: 裁员 76 人
          detail: 盈利声明之前，成本压力和经营重置已经显性化。
          tone: warning
        - date: 2025-07
          label: FY24 亏损收窄
          detail: 收入达到 US$119.3M，净亏损收窄至 US$33.2M。
          tone: neutral
        - date: 2025-07
          label: Block 79 总部启用
          detail: 新总部凸显 Carousell 长期扎根本地的承诺。
          tone: neutral
        - date: 2026-07
          label: FY25 EBITDA 为正
          detail: 收入达到 US$141M，二手循环商业贡献 45% 收入。
          tone: positive
        - date: 2026-07
          label: 二手循环商业门店达 29 家
          detail: 四个市场的实体门店成为 Carousell 全渠道模式的核心部分。
          tone: positive
