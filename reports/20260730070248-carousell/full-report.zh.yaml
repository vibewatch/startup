              Carousell 的财务弧线已经好过“亏损分类信息独角兽”这个过时叙事，但仍达不到上市公司式透明度。平台现在有收入规模证据，更可信地转向信任驱动的二手再商业，并从 AI
              和基础设施工作中初步释放经营杠杆。与之相对，投资人用于定价或下行保护几乎需要的每个精确指标都仍然缺失：抽佣率、按收入流划分的毛利率、重复购买分群、卖家
              CAC、现金转化，以及最新现金续航。公开应用定价显示变现存在，但没有显示它有多持久、多赚钱。因此，正确的尽调姿态是建设性但有条件。Carousell
