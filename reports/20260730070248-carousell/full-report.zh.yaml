  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与结构
        blocks:
          - type: paragraph
            body: >-
              Carousell 已不再适合被描述为一个只靠商品发布可见度或广告产品变现的简单分类信息网站。最强公开证据显示，它现在是混合模式：分类广告、二手再商业交易、买家保护结账、与配送挂钩的服务，以及商户工具。FY24
              报告把收入拆为二手再商业、分类广告和其他收入；FY25 报道则强调二手再商业已增长至集团收入的 45%。应用商店界面也显示了明确变现入口，如 CarouBiz 订阅、商品曝光加速和
              coins。这很重要，因为它改变了判断收入质量的方式。广告重的分类信息业务可以更轻，但在成交率变现上更弱；交易驱动的二手再商业若信任、物流和检测确实提升转化，就能复合抽佣率和重复使用。Carousell
              似乎正试图进入第二类，但其公开证据对收入方向的揭示，仍多于对各收入流毛利转化的揭示。
