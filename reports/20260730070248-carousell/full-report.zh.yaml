  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管压力对 Carousell 不是假设，已经在新加坡塑造产品要求。MHA 已直接按 Online Criminal Harms Act
              框架评估该平台，并在已验证账号滥用持续后要求更强控制。仅这一点就把监管风险抬高到普通消费者平台担忧之上。随着 Carousell
              在多个司法辖区处理敏感身份、支付、位置、聊天和争议数据，法律和政策复杂度也在扩张。制裁和 AML
              政策显示，公司围绕地理范围和金融犯罪筛查还有另一层合规开销。这些都不意味着公司特别不合规，但意味着风险会累积：诈骗防范、身份验证、隐私和跨境合规在一个面向客户的产品里汇聚。监管机构可能比平台低成本适配更快地收紧要求，因此合规成本和用户摩擦都是实质下行通道。条款和禁售内容规则也显示，Carousell
              必须在细粒度层面治理行为、商品发布和身份，交易量扩张时政策执行负担会加重。
