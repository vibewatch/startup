              tone: positive
            - label: 门店增加复杂度
              tone: warning
            - label: 东南亚竞争集中
              tone: negative
        - label: 披露质量
          values:
            - label: 收入公开披露
              tone: positive
            - label: 未披露 GMV / 单位经济
              tone: negative
            - label: 无最新融资定价
              tone: warning
    approximationNotes: 单元格概括估值压力方向，不给出点估计。
    claimRefs:
      - CV003
      - CV025
      - CV026
      - CV030
      - CV037
