      - number: '8.2'
        title: 可比公司组与倍数框架
        blocks:
          - type: paragraph
            body: >-
              没有任何一个可比公司完全贴合。Vinted 是最好的高端私募可比，因为它同时具备二手行为、平台流动性、内嵌物流和支付，以及可见的盈利能力。Back Market
              可以作为更高信任度的二手电商可比，服务层和可信供给支撑更厚的经济性。ThredUp 则是透明度最好的公开市场可比，尽管公开市场在结构上会给它相对私募战略赢家更低的折价。这些同业说明，如果投资人相信
              Carousell 交易驱动的二手电商策略正在奏效，它的交易倍数应低于最强私募龙头，但高于商品化或纯公开市场标记。难点在于，Carousell
              规模比高端同业小，同时运营野心又比轻型市场平台更重。这个组合要求估值工作保持克制，而不是追求极致。地理位置也重要：Carousell 竞争的是变化更快的东南亚商业栈，而 Vinted
              受益于更广的欧洲足迹，Back Market 受益于更强的翻新供给标准化。
