  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 信任和监管失灵会快速传导到客户行为、利润率和估值。
    data:
      nodes:
        - id: a
          label: 诈骗 / 账号滥用
          detail: 欺诈尝试、钓鱼、已验证账号滥用
        - id: b
          label: 监管升级
          detail: 强制控制和更高合规负担
        - id: c
