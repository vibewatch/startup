      - number: '1.3'
        title: 经济性、商业模式转向与规模指标
        blocks:
          - type: paragraph
            body: >-
              2026 年关于 Carousell 最重要的战略事实，不只是它仍是独角兽，而是公司自 2021 年估值标记以来已实质改变业务形态。FY25 收入达到 US$141 million，同比增长
              18%，管理层称集团已实现 EBITDA 转正。二手再商业收入增长 40%，占总收入 45%，成为增量增长的最大贡献者。这与 FY24 形成对比：公开报道当时描述的是收入增长更慢，收入 US$119.3
              million、净亏损 US$33.2 million，收入结构更清楚但仍不完整：二手再商业 US$53 million，分类广告 US$52.8 million，其他收入 US$13.5
              million。公开规模指标仍需打折。管理层使用数千万用户、800+ 团队成员这类取整表述，Dealroom 则显示 1,239 名映射员工。这些数字方向上有用，但还达不到尽调数据室级别。
