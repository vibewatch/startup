      - number: '4.2'
        title: 经济性、成本与经营杠杆代理指标
        blocks:
          - type: paragraph
            body: >-
              最清晰的正面财务信号是，Carousell 在 FY25 实现 EBITDA 转正，同时没有完全放弃增长。收入从 FY24 的 US$119.3 million 升至 FY25 的 US$141
              million，公司和独立报道都把二手再商业描述为越来越重要的驱动因素。公开来源还提供了一些运营杠杆线索。Google Cloud 称，AI 驱动的商品发布工具把中位发布时间降至两分钟以内，并让上架商品数增加
              20%；自动翻译现在覆盖 90% 的翻译需求。同一案例研究称，基础设施迁移把计算集群成本削减 10%，并移除了大量值班负担。这些事实不等同于完整单位经济，但支持一个判断：Carousell
              找到了一些真实的成本和生产率杠杆。限制同样重要：所审阅公开来源没有披露抽佣率、贡献利润率、CAC 或分群盈利能力，因此投资人仍无法测试 EBITDA
              质量是否能跨品类和市场持久。经营故事变好了，但仍不能替代直接的品类层面经济性。
