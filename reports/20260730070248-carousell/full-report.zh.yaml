      - number: '8.3'
        title: 估值区间与情景分析
        blocks:
          - type: paragraph
            body: >-
              第一轮投资判断，用简单倍数框架就足够。若市场坚持透明度、上市可比折价和未解决的竞争风险，偏公开市场的下行情景可以支撑约 3x 到 4x 收入的区间。较均衡的私募市场区间约为 5x 到 7x 收入，反映
              EBITDA 转正、品类扩张和持续改善的信任栈，但仍对规模和披露缺口打折。只有当投资人把 Carousell 视为稀缺区域赢家，并看到门店、专家型垂类和 AI 强化信任工具是在加深护城河而不是增加成本时，约 7x
              到 9x 收入的高端二手电商区间才站得住。这个练习的结论是，US$1.1B 已不再明显虚高，但仍接近 2026
              年可辩护区间的乐观端。实际操作中，这是谈判区间，不是单一真理；投资人愿意在区间内哪个位置交易，应由尽调质量决定。
