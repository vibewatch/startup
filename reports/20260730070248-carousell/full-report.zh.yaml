      - number: '2.4'
        title: 采用驱动因素与 Carousell 份额上限
        blocks:
          - type: paragraph
            body: >-
              支撑 Carousell
              的区域趋势，也会限制其上行空间。移动和钱包普及、社交发现、电商快速增长，都有助于需求形成。电子产品、时尚、美妆和其他信任敏感品类，也为差异化二手再商业创造空间，尤其是检测、保修和全渠道交接能降低买家恐惧时。但约束同样重要。Shopee、Lazada、TikTok
              Shop、Facebook Marketplace、eBay、Mercari 和 OLX 都在争夺同一用户任务的一部分，手段可能是规模、价格、内容驱动发现或根深蒂固的本地流动性。线下零售仍占大部分支出，因此
              Carousell 必须持续证明其混合模式比普通商品发布更能解决信任问题。而且许多区域估算来自供应商，而非经审计数据，很容易高估市场规模或低估执行难度。Carousell
              最好的路径不是模仿最大市场平台，而是在高摩擦二手场景中占据主导；在那里，信任基础设施能把混乱的线下交易变成可重复的数字行为。
