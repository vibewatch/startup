      - number: '5.4'
        title: 信任、安全、合规与质量控制
        blocks:
          - type: paragraph
            body: >-
              信任和安全是核心产品功能，不是合规附带项。Carousell 自己的帮助中心资料描述了 AI 和机器学习检测、版主审核、争议提示、实时警告、手机验证，以及 2FA 或 SMS 重新验证。MHA
              和其他独立报道还提供了更强证据：已验证账号被滥用于诈骗后，Carousell 承诺引入 passkeys 或生物识别登录、账号暂停控制和 Singpass 黑名单措施。MHA
              交易安全页面也把用户徽章、安全支付、官方配送和记录留存描述为产品化防护。与此同时，制裁政策显示，公司还有一层处理不支持地区和禁止交易的合规层。合起来看，这些来源支持一个清晰结论：Carousell
              已构建分层信任栈，覆盖界面、工作流、审核、身份和合规。未知的是这些系统的精确度，以及大规模运行它们的运营成本。换句话说，Carousell 交付的不只是市场平台应用，也是一套信任操作系统。
