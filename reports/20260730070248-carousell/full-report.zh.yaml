chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、起点与业务边界
        blocks:
          - type: paragraph
            body: >-
              Carousell Group 把自己定位为创立于新加坡、移动优先的市场平台，核心理念是让卖东西像拍照一样简单，让买东西像聊天一样简单。当前新闻事实表把公司锚定在 2012 年 8
              月，描述其在新加坡、香港、马来西亚、印度尼西亚、菲律宾、台湾和越南均有领先存在，并把使命表述为让二手成为每个人的第一选择。业务已明显不再只是一个分类信息应用：Carousell
              现在描述的组合包括区域分类信息品牌、时尚、奢侈品和手机等垂直资产，以及支付、物流、卖家订阅、基于检测的信任服务等运营层。2021 年独角兽公告仍提到八个市场和 OneKyat 品牌，而 2026
              年事实表已调整为七个市场和另一组品牌。也就是说，公司已经在梳理区域版图的一部分，而不是只加标识、不做取舍。
