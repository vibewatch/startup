      - number: '8.4'
        title: 投资立场
        blocks:
          - type: paragraph
            body: >-
              最站得住的立场，是有条件通过，并给予贴近市场到略高于市场的估值判断。Carousell 通过真实收入规模、EBITDA 里程碑、不断提升的二手电商占比，以及相比 2021
              年更具结构差异化的策略，配得上这个更好的态度。不过，公司还没有资格拿到接近最佳私募二手电商龙头的无条件溢价标记，因为它仍有披露缺口、区域竞争压力、信任成本不确定性，以及门店和垂直运营带来的执行复杂度。只要管理层能证明耐久性，而不只是证明动能，投资人就可以对当前估值保持开放。下一段上行更少取决于叙事，更取决于
              FY26 能否把 EBITDA 转正转化为可重复、风险调整后质量更高的运营表现。在这些证据出现之前，纪律应来自条款、治理要求和基于里程碑的信念，而不是假装某个点估值足够精确。
