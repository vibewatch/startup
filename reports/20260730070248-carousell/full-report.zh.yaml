              公开证据显示，Carousell 已不再处于即时资本困境，但当前融资图景仍不完整。Tracxn 和 The Company Check 都显示累计股权融资约 US$376 million，多个来源确认 2021
              年 9 月 US$100 million 独角兽轮，估值 US$1.1 billion。Tracxn 还记录了 2023 年 9 月由 GoTo 领投的一笔较小延展轮。管理层在 2023 年告诉 The
              Straits Times，公司资本充足，不依赖 IPO 作为唯一融资选项；FY24 现金 US$50.5 million 则提供了一个已披露的流动性锚点。话虽如此，所审阅公开资料包不包括 FY25
              期末现金、债务额度、月度烧钱，或门店层面资本需求。承销时，投资人可以合理认为融资依赖相对前几年已有改善，但还不能得出业务已完全自我融资，或在低增长、门店扩张情景下不需要外部资本的结论。
