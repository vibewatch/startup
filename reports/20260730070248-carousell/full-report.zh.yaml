      - number: '3.2'
        title: 功能宽度与信任定位
        blocks:
          - type: paragraph
            body: >-
              Carousell 最强的竞争论点不是原始供给量或社交触达，而是由信任驱动的成交。应用商店界面和公司资料显示，Buyer
              Protection、认证商品发布、配送和更安全支付流程，已明显超出裸商品发布产品。新加坡监管信号进一步强化了这个姿态：Carousell 公开参与强化验证措施，并有大面积可见的安全与保障帮助界面。相对
              Craigslist 式替代品，这是有意义的优势。相对 Facebook Marketplace，它有更明确的信任栈，但原生发现力更弱。相对 eBay，Carousell
              更聚焦区域和本地市场，但全球流动性更低，卖家工具成熟度也不如 eBay 明显。因此，平台处在中间位置：在信任和成交上强于轻量分类信息，但不如最大的全球市场平台或社交网络那样宽。
