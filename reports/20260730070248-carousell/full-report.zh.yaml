              Carousell 已不再只呈现一个买卖双方聊天、其余留在线下完成的商品发布看板。可见产品栈现在包括商品发布创建、评价、安全结账、官方配送、可信家政服务、CarouBiz 商户工具、Carousell
              Certified，以及部分品类的直接 Sell to Carousell 流程。这个拓宽很重要，因为它改变了 Carousell
              正在解决的任务。在较低风险品类中，应用仍可像轻量点对点市场平台一样运转。在手机、奢侈包和汽车等较高风险品类中，产品越来越多地插入验证、支付保护，有时还插入库存收货路径本身。LuxLexicon
              和其他品类动作进一步说明，Carousell 正围绕同一套信任重的二手流程拼装多条产品线，而不是停留在通用分类信息前端。产品范围扩大，也解释了为什么品类运营和信任功能如今与商品发布流动性同样重要。
