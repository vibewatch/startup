      - number: '2.2'
        title: 区域规模：大背景，较窄的可服务市场
        blocks:
          - type: paragraph
            body: >-
              多组第三方数据都支持一个结论：东南亚是全球增长最快的数字商业区域之一。UnivDatos 估算 2024 年市场规模为 US$201.9 billion，AFFiNCO 和 Sellercraft 则把 2026
              年 GMV 放在约 US$230-234 billion。Statista 专题页和 Hashmeta 的综合也指向一个已远高于 US$139
              billion、仍以双位数复合增长的区域市场。即便精确总量不同，共同图景仍一致：印度尼西亚是规模领头羊，越南位列增速最快市场，新加坡较小但客单和消费强度高得多。对 Carousell
              而言，宏观潮水有利，但可服务支出必须因地理和品类聚焦大幅打折。Carousell 不覆盖泰国，许多头部区域 GMV 也落在与二手分类信息或二手再商业完全不同的品类或商户模式中。正确结论不是 Carousell
              拥有一个 US$200+ billion 市场；而是 Carousell 乘上了一股强劲宏观迁移，但它所在的是更窄、仍然很大的本地转售和信任驱动电商楔形市场。
