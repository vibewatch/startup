      - number: '2.3'
        title: 买家分层、行为与预算逻辑
        blocks:
          - type: paragraph
            body: >-
              所审阅的市场来源一致把东南亚描述为移动优先、受社交影响、由评价驱动的市场。AFFiNCO 估算，目前 78% 的电商交易发生在移动端，Sellercraft 认为智能手机占比更高。Hashmeta 和
              AFFiNCO 都强调，看评价、比价格、直播或达人带动发现，是核心习惯而非边缘行为。这个环境格外适合
              Carousell。二手市场平台需要用户在手机上浏览、跨卖家比较商品发布、依赖评价和徽章，并接受钱包或平台内支付。这也解释了新加坡、印度尼西亚和越南为什么以不同方式重要。新加坡是高端市场，订单价值更高，对便利性的要求更强；印度尼西亚和越南则提供更大规模和更快品类增长。预算所有权主要来自消费者家庭支出，而不是企业采购，但决策路径随品类变化：汽车、奢侈品和手机比时尚或家居用品更需要信任，也常需要更多线下触点。因此，Carousell
              的价值主张落在价格敏感与风险降低的交汇处。
