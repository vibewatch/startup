        title: 客户分层与谁在使用 Carousell
        blocks:
          - type: paragraph
            body: >-
              Carousell 的客户群不是一个单一整体。公开证据至少支持四类不同用户：清理闲置物品的普通消费者、寻求低价的买家、垂直或专业商户，以及使用 CarouBiz
              的企业卖家。品类宽度在这里很重要，因为每个分层的行为不同。家政服务、房产、汽车和奢侈品不只是不同产品；它们涉及不同信任需求、交易速度和变现潜力。Specialist Awards、认证企业徽章和 CarouBiz
              条款都显示，Carousell 正有意识地在日常点对点使用之外培育更结构化的卖家类型。同时，应用商店语言和核心产品仍把平台定位为普通消费者可以低摩擦使用的工具。普通和专业参与者的混合，是 Carousell
              扩大供给又不变成纯商户市场平台的核心。实际中，每个分层可能会对价格、信任、便利和速度的不同组合作出响应。
