    data:
      columns:
        - 支撑溢价
        - 信号不一
        - 支撑折价
      rows:
        - label: 财务质量
          values:
            - label: EBITDA 为正
              tone: positive
            - label: 净利润不透明
              tone: warning
            - label: FY24 亏损记录
