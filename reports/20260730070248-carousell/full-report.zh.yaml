companyProfile:
  summary: >
    Carousell 创立于新加坡，最初是面向消费者的移动优先市场平台，如今已从分类信息扩展为更宽的二手再商业平台，覆盖日常转售、垂直品类、认证商家、以旧换新和线下门店。公开证据显示，公司已具备实质经营规模——FY25 收入
    US$141M，二手再商业占比 45%，EBITDA 转正——但它也仍在处理信任、披露和竞争复杂度，从高增长私营市场平台迈向更交易驱动的电商业务。
