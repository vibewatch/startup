        blocks:
          - type: paragraph
            body: >-
              Carousell
              的运营风险，是开放市场平台达到实质规模后会遇到的经典问题：钓鱼、交易迁移到平台外、订金诈骗、假货暴露、账号接管，以及随着平台推动更多交易在平台内完成而上升的可靠性预期。好消息是，Carousell
              似乎运行着分层缓释栈，包括机器学习检测、链接拦截、评价循环、官方配送、Buyer
              Protection、争议提示和审核。坏消息是，每一种保护都会花钱、增加工作流摩擦，或在某些边缘情形下仍会失效。没有公开事故日志或可用性披露能解答可用性问题，商户条款还明确排除了 Carousell
              控制之外的停机。因此，风险不只是欺诈存在；而是公司可能不得不持续大额投入控制措施，仅仅为了守住当前信任水平，同时在诈骗数量上升时仍面对公众批评。
