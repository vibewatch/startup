            body: >-
              产品成熟度最可信的证明，不只是 Carousell 自己说了什么，而是其伙伴和公开工程界面展示了什么。GitHub 显示，公司有一个公开组织，仓库覆盖
              Go、Swift、Kotlin、TypeScript、Python 和 shell 工具，包括围绕 grpc/protobuf 构建的 Orion 微服务框架。Google Cloud 还描述了一条路线图，从当前
              AI 辅助发布体验延伸到低于 45 秒的商品发布时间、更丰富的发现用风格属性，以及可能缩短工程工作的内部智能体式工具。这些本身都不能证明硬技术护城河。更大竞争对手可以买入或复制许多通用 AI
              能力。但它确实显示出一个严肃的产品和平台组织，能把基础设施、数据和流程改善转化为面向用户的速度和信任收益。Carousell
              的真实边际优势看起来更偏运营和整合，而非纯算法。它也说明产品迭代是连续的，而不是偶发的；基础设施和机器学习变化会直接进入用户工作流。
