            body: >-
              Carousell 依赖复杂的外部栈。Google Cloud 位于 AI、数据和计算工作流内部，Cloudflare
              支撑核心流量处理和攻击缓释。应用商店、支付系统、配送伙伴和验证通道也调解客户旅程的一部分。在温和市场中，这可以管理；但外部市场远非温和。区域电商和社交电商现在由少数规模平台主导，Shopee 和 TikTok
              Shop 对需求形成和卖家经济性尤其有强拉力。对 Carousell
              而言，风险既由伙伴驱动，也由市场结构驱动：云或平台问题会伤害运营，竞争环境加剧则会迫使更高信任支出、更低抽佣率目标，或更慢走向净盈利。EBITDA
              转正确实存在，但没有移除竞争强度和仍不完整的公开单位经济所带来的模式风险。换句话说，Carousell 已不再是在一个平静的分类信息利基中竞争；它是在更严酷的区域电商栈中承销信任和交易质量。
