  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入范围
        blocks:
          - type: paragraph
            body: >-
              不能按整个东南亚数字商业来承销 Carousell。更合适的市场边界，是消费者电商中二手供给、点对点发现、卖家工具和信任层真正起作用的那一部分。Carousell
              自身资料显示，公司覆盖商品、汽车、奢侈品、手机、时尚、房产、家居生活和服务；其二手再商业战略又加入检测、卖家订阅、一体化支付、物流，以及直接卖给平台的流程。这意味着相关市场包括 C2C
              和轻中介二手交易、附着在这些品类上的分类信息变现，以及部分相邻卖家服务。它不包括大多数自营零售 GMV、外卖、纯生鲜杂货，以及 Carousell 没有运营的市场。这个区分很重要，因为宽口径东南亚电商 TAM
              数字真实存在，但若视作可直接触达就会误导。Carousell 不是在争夺所有线上零售篮子；它争夺的是信任、便利和本地转售流动性能打赢非正式线下交易和横向大众平台的那一小块。
            claimRefs:
