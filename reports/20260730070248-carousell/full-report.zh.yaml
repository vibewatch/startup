        title: 反向视角：竞争为何仍会压缩结果
        blocks:
          - type: paragraph
            body: >-
              没有证据显示 Carousell 在其市场中的二手再商业拥有赢家通吃控制力。更大生态可以模仿 AI 功能，社交平台可以在意图到达 Carousell
              前截走发现，免费商品发布替代品可以限制低信任品类的变现。Carousell 的门店和验证栈是优势，但也带来纯数字竞争对手无需承担的运营复杂度。因此，投资问题不是竞争是否存在；竞争显然存在。问题是
              Carousell
              能否在自己选择强调的品类中，获得更好的信任调整后抽佣率、转化和重复行为。当前证据支持差异化定位，但还不支持不可攻破的护城河。投资人应承销持续竞争，避免假设仅靠产品改善就能消除市场平台商品化。这个反向框架应塑造估值。市场平台胜者即便没有绝对统治，也可以赚取有吸引力的回报，但前提是所选品类产生更优的信任调整后经济性。Carousell
              有这种可能性的证据，但没有竞争已被中和的证明。
