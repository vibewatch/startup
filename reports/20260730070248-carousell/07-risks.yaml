- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Trust controls losing effectiveness
    - Regulatory intervention increases after new safeguards
    - Another mandated step-up despite Jan 2026 controls
    - Pause enthusiasm and re-underwrite trust economics
  - - Fraud burden overwhelming economics
    - Fraud loss or dispute cost rises faster than transaction growth
    - Management cannot show improving dispute-cost curve
    - Assume lower-quality EBITDA and higher reserve needs
  - - Store / trade-in operations underperform
    - No evidence of payback or conversion uplift
    - Stores become traffic or margin drag instead of moat
    - Cut valuation for operational intensity
  - - Competition compresses model
    - Growth slows while take rates or promotions worsen
    - Carousell forced into subsidy-heavy response
    - Move toward fail / strong-fail depending on cash impact
  - - Management execution falters
    - Another large layoff or strategic reset without stronger economics
    - Repeated correction after new investment cycle
    - Treat as thesis-break on operating discipline
  notes: Kill criteria focus on observable operating evidence rather than narrative discomfort.
