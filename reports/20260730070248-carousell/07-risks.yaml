company:
  name: Carousell
chapter:
  number: 7
  title: Risks
  summary: Carousell's risk profile is dominated by trust, regulation, and the difficult balancing act between safer transactions and scalable economics. The company has a real mitigation stack and improving headline trust metrics, but Singapore regulators still see enough residual harm to demand stronger controls, and the marketplace remains exposed to off-platform fraud, privacy complexity, cloud dependencies, and brutal regional competition. The key underwriting question is whether Carousell can continue improving trust and profitability at the same time, rather than trading one off against the other.
sections:
- id: regulatory-legal
  title: Regulatory and legal risk
  body: 'Regulatory pressure is not hypothetical for Carousell; it is already shaping product requirements in Singapore. MHA has directly assessed the platform under the Online Criminal Harms Act framework and required stronger controls after abuse of verified accounts persisted. That alone elevates regulatory risk above a generic consumer-platform concern. Legal and policy complexity is also broadening as Carousell handles sensitive identity, payment, location, chat, and dispute data across multiple jurisdictions. The sanctions and AML policy suggests a separate layer of compliance overhead around geography and financial-crime screening. None of this means the company is uniquely non-compliant, but it does mean risk is cumulative: scam prevention, identity verification, privacy, and cross-border compliance all converge in one customer-facing product. Because regulators can tighten requirements faster than platforms can cheaply adapt, compliance cost and user friction are both material downside
    channels. The terms and prohibited-content rules also show that Carousell must police behavior, listings, and identity at a granular level, increasing policy-enforcement burden as transaction volume scales.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: operational-security
  title: Operational, quality, and security risk
  body: 'Carousell''s operating risks are the classic problems of open marketplaces at meaningful scale: phishing, off-platform deal migration, deposit scams, counterfeit exposure, account takeover, and reliability expectations that rise as the platform pushes more transactions on-platform. The good news is that Carousell appears to run a layered mitigation stack, including ML detection, link blocking, review loops, official delivery, Buyer Protection, dispute banners, and moderation. The bad news is that every one of those protections costs money, adds workflow friction, or still fails in some edge cases. No public incident log or uptime disclosure resolves the availability question, and merchant terms explicitly carve out downtime beyond Carousell''s control. The risk is therefore not simply that fraud exists; it is that the company may have to keep spending heavily on controls just to preserve trust at current levels, while still facing public criticism when scam counts rise.'
  claimRefs:
  - CR009
  - CR016
  - CR017
  - CR018
  - CR019
  - CR020
  - CR024
  - CR034
  - CR035
  - CR036
  tableRefs:
  - TR002
  figureRefs:
  - FR002
- id: dependency-and-financial
  title: Dependency, financial, and market-structure risk
  body: 'Carousell depends on a complex external stack. Google Cloud sits inside AI, data, and compute workflows, while Cloudflare supports core traffic handling and attack mitigation. App stores, payment systems, delivery partners, and verification rails also mediate parts of the customer journey. That would be manageable in a benign market, but the external market is anything but benign. Regional e-commerce and social-commerce are now dominated by a handful of scaled platforms, with Shopee and TikTok Shop exerting particularly strong pull on demand formation and seller economics. For Carousell, this means risk is both partner and market-structure driven: a cloud or platform problem can hurt operations, while an intensified competitive environment can force higher trust spend, lower take-rate ambition, or slower path to net profitability. EBITDA positivity is real, but it does not remove the model risk created by competitive intensity and still-incomplete public unit economics. In other
    words, Carousell is not competing in a calm classifieds niche anymore; it is underwriting trust and transaction quality inside a much harsher regional commerce stack.'
  claimRefs:
  - CR021
  - CR022
  - CR023
  - CR025
  - CR026
  - CR028
  - CR029
  - CR030
  - CR031
  - CR032
  - CR033
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: people-execution
  title: People, execution, and thesis-break triggers
  body: Execution risk is still one of the most important investment risks because the strategy itself is operationally demanding. Carousell is simultaneously trying to increase trust, professionalize sellers, run stores and trade-ins, integrate acquisitions, and improve profitability. The company has already shown that miscalibration can lead to painful corrections, including workforce reductions in 2022 and 2024. This does not prove weak management; it does prove that the strategy has little room for sloppy execution. The founder-CEO remains the public face of capital allocation, profitability messaging, and strategic direction, which increases key-person sensitivity. Investors should therefore focus less on whether risk exists and more on whether it is being converted into monitorable controls. The thesis breaks if trust controls remain costly but ineffective, if category operations fail to earn their keep, or if competition forces Carousell back into subsidy-heavy behavior.
  claimRefs:
  - CR027
  - CR037
  - CR038
  - CR039
  - CR040
  - CR041
  - CR042
