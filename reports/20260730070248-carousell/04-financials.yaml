- id: economics-and-efficiency
  title: Economics, costs, and operating leverage proxies
  body: 'The clearest positive financial signal is that Carousell reached positive EBITDA in FY25 without abandoning growth altogether. Revenue rose from US$119.3 million in FY24 to US$141 million in FY25, while the company and independent coverage both framed recommerce as an increasingly important driver. Public sources also provide a few operational leverage hints. Google Cloud said AI-led listing tools reduced median listing time below two minutes and increased items listed by 20%, while automated translation now covers 90% of translation needs. The same case study says infrastructure migration cut compute-cluster cost by 10% and removed a large on-call burden. These facts do not equal full unit economics, but they do support the thesis that Carousell has found some real cost and productivity levers. The limitation is equally important: no public source in the reviewed set discloses take rates, contribution margins, CAC, or cohort profitability, so investors still cannot test whether
    EBITDA quality is durable across categories and markets. The operating story is better, but it is still not a substitute for direct category-level economics.'
