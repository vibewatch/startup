- id: capital-adequacy
  title: Capital adequacy and financing dependency
  body: Public evidence suggests Carousell is no longer in immediate capital-distress territory, but the current funding picture is still incomplete. Tracxn and The Company Check both show roughly US$376 million of cumulative equity financing, while multiple sources confirm the September 2021 US$100 million unicorn round at a US$1.1 billion valuation. Tracxn also records a smaller September 2023 extension led by GoTo. Management told The Straits Times in 2023 that the company was well capitalised and not reliant on an IPO as the only financing option, and FY24 cash of US$50.5 million offers one disclosed liquidity anchor. That said, the reviewed public package does not include FY25 ending cash, debt facilities, monthly burn, or store-level capital requirements. For underwriting purposes, this means investors can reasonably view funding dependency as improved relative to prior years, but cannot yet conclude that the business is fully self-funding or that external capital will be unnecessary
    under slower-growth or store-expansion scenarios.
  claimRefs:
