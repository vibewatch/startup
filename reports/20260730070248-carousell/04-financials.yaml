  evidenceGaps:
  - type: missing-source
    severity: material
    topic: take-rates
    missingEvidence: Category-level take rates, ad yield, subscription attach rates, and seller-service monetization by market.
    whyItMatters: The company is clearly monetizing through multiple channels, but public evidence does not reveal how much each unit of activity contributes to gross profit.
    diligencePath: Request cohort-level monetization by category, geography, and transaction type.
    relatedQuestionRefs:
    - QI015
    - QI025
    relatedTableRefs:
    - TI002
    - TI005
  - type: private-evidence-only
    severity: material
    topic: runway
    missingEvidence: FY25 ending cash, monthly burn or cash generation, debt facilities, and committed capex.
    whyItMatters: Without current cash and burn detail, public investors cannot judge whether the EBITDA milestone converts into durable self-funding.
    diligencePath: Request cash bridge from FY24 to current month including stores, inventory, and financing flows.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI004
    - TI005
