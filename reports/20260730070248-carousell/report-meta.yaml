  topStrengths:
    - "FY25 revenue of US$141M and positive EBITDA show a materially better business than the 2021 unicorn headline alone suggests"
    - "Recommerce now drives 45% of revenue, making the model more transaction-led and potentially more defensible than a pure classifieds marketplace"
    - "29 physical stores and specialist category workflows create a differentiated omnichannel trust proposition in luxury, fashion, and mobile categories"
    - "Management is visibly investing in AI-assisted trust, listings, and operations, which could widen moat if it also lowers friction and cost"
    - "The business appears well-capitalized relative to immediate financing needs, with roughly US$376M raised historically"
  topRisks:
    - "Singapore regulators still require stronger anti-scam controls, showing that trust and verification risk remains product-shaping rather than solved"
    - "Competition from Shopee, TikTok Shop, Lazada, and other high-scale commerce platforms can compress traffic quality, seller attention, and monetization"
    - "Public disclosure still lacks GMV, category-level take rates, FY25 net profitability, and store-level returns, limiting confidence in premium valuation arguments"
    - "Operational complexity rises with stores, specialists, trade-ins, and cross-brand integration, increasing execution burden even as revenue mix improves"
    - "The historical US$1.1B valuation sits near the optimistic end of a defendable 2026 range, leaving limited room for valuation error"
  unresolvedGaps:
    - "No fresh 2026 primary or secondary Carousell pricing event is public, so the true current clearing price is unknown"
    - "Public GMV, contribution margin, CAC payback, and store cohort economics are not disclosed"
    - "FY25 ending cash, debt facilities, and reserve assumptions for fraud or disputes are not publicly available"
    - "It remains unclear how durable EBITDA is if trust-and-safety spending or competitive intensity rises further in FY26"
    - "The exact return profile of specialist verticals and physical stores is still unproven in public evidence"
