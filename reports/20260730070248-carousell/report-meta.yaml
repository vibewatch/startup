summary:
  headline: |
    Carousell has improved enough operationally to justify serious investor engagement: FY25 revenue
    reached US$141M, recommerce is now 45% of revenue, and the group reported positive EBITDA.
    However, the company still sits in a difficult middle ground between premium private recommerce
    winners and cheaper public resale comps, while trust, competition, and disclosure gaps keep the
    2021 unicorn valuation from becoming an easy premium case. The right posture is conditional:
    track closely, lean in on diligence, and only upgrade conviction if FY26 proves durable,
    risk-adjusted profitability.
