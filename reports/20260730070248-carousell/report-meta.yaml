companyProfile:
  summary: |
    Carousell is a Singapore-founded consumer marketplace that has expanded from mobile-first
    classifieds into a broader recommerce platform spanning everyday resale, specialist categories,
    verified business sellers, trade-ins, and offline stores. Public evidence now shows a company
    with meaningful operating scale — US$141M of FY25 revenue, 45% recommerce mix, and positive
    EBITDA — but also one still navigating trust, disclosure, and competition complexity as it
    matures from a high-growth private marketplace into a more transaction-led commerce business.
