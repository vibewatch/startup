company:
  name: Carousell
chapter:
  number: 1
  title: Company Overview
  summary: 'Carousell is a Singapore-founded consumer marketplace that has spent 2021-2026 shifting from classifieds toward transaction-led recommerce. Public evidence supports the 2012 founding, the September 2021 US$1.1 billion unicorn round, FY24 revenue of US$119.3 million with narrowing losses, and FY25 revenue of US$141 million with positive EBITDA. The strongest current execution signal is recommerce scale-up: 45% of FY25 revenue, 29 physical stores across four markets, and AI-assisted listing and trust tooling that management says now shape both growth and efficiency.'
sections:
- id: company-identity
  title: Identity, origins, and scope
  body: 'Carousell Group presents itself as a Singapore-founded, mobile-first marketplace built around the idea that selling should feel as easy as taking a photo and buying as easy as chatting. The current press fact sheet anchors the company in August 2012, describes a leading presence across Singapore, Hong Kong, Malaysia, Indonesia, the Philippines, Taiwan, and Vietnam, and frames the mission as making secondhand the first choice for everyone. The business has moved meaningfully beyond a single classifieds app: Carousell now describes a portfolio that includes regional classifieds brands, vertical assets in fashion, luxury, and mobile phones, and operating layers such as payments, shipping, seller subscriptions, and inspection-based trust services. The 2021 unicorn announcement still referenced eight markets and the OneKyat brand, while the 2026 fact sheet has shifted to seven markets and a different brand set. That suggests the company has already rationalised parts of its regional
    footprint rather than simply adding logos without pruning.'
  claimRefs:
  - CO001
  - CO003
  - CO004
  - CO005
  - CO006
  - CO024
  figureRefs:
  - FO002
- id: leadership-governance
  title: Leadership, governance, and investor control points
  body: 'The public record supports Siu Rui Quek as the central operating and narrative figure: he is repeatedly quoted as co-founder and CEO, he remains the spokesperson on funding, profitability, and IPO optionality, and the group''s current transformation story is tied directly to his commentary. The named founding team in public databases includes Quek, Marcus Tan, and Lucas Ngoo, but disclosure on current executive depth is thinner than the strength of the brand might imply. The strongest newly visible non-founder leaders in 2026 are Shing Tai Leung, the chief strategy officer quoted on data and AI, and Rajath Ramesh, the product and platform engineering leader in Google Cloud''s case study. JJ Ang appears as CFO in FY24 results coverage. Governance visibility remains incomplete: official materials confirm Jason Cho joining the board in 2021, while Tracxn lists additional board members, but committee structure, observer rights, and current investor designation are not public. That leaves
    Carousell with real key-person concentration risk around Quek even though the founder bench and investor roster are both broad.'
  claimRefs:
  - CO002
  - CO023
  - CO028
  - CO030
  - CO032
  - CO033
  tableRefs:
  - TO002
  - TO003
- id: economics-and-transformation
  title: Economics, business-model shift, and scale indicators
  body: 'The most important strategic fact about Carousell in 2026 is not simply that it remains a unicorn; it is that the company has materially changed the shape of the business since that 2021 mark. FY25 revenue reached US$141 million, up 18% year on year, and management said the group became EBITDA positive. Recommerce revenue grew 40% and accounted for 45% of total revenue, making it the biggest contributor to incremental growth. That stands in contrast to FY24, when public coverage described a slower topline year at US$119.3 million, a US$33.2 million net loss, and a cleaner but still incomplete view of the mix: US$53 million from recommerce, US$52.8 million from classifieds advertising, and US$13.5 million from other revenue. Public scale indicators still have caveats. Management uses rounded language such as tens of millions of users and 800+ teammates, while Dealroom shows 1,239 mapped employees. Those numbers are directionally helpful but not yet data-room grade.'
  claimRefs:
  - CO007
  - CO008
  - CO009
