  evidenceGaps:
  - type: missing-source
    severity: material
    topic: reliability-sla
    missingEvidence: Public uptime metrics, incident history, and user-facing service-level commitments.
    whyItMatters: Production-scale product claims are credible, but public users and investors still cannot inspect reliability history.
    diligencePath: Request internal incident log, uptime by market, and major outage postmortems.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: trust-model-precision
    missingEvidence: Precision/recall metrics for fraud detection, false-positive rates, and dispute-resolution timelines.
    whyItMatters: Trust is a central differentiator, but public evidence is directional rather than statistical.
    diligencePath: Request model-performance dashboards and resolution SLAs by scam type.
    relatedQuestionRefs:
    - QE012
    - QE017
    relatedTableRefs:
    - TE004
