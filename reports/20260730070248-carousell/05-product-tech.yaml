company:
  name: Carousell
chapter:
  number: 5
  title: Product & Technology
  summary: Carousell's product is now best understood as a hybrid of software marketplace, trust infrastructure, and recommerce operations. The company combines AI-assisted listing, seller tooling, secure checkout, official delivery, certification, and direct sell-to-platform workflows across multiple categories and brands. Public technical evidence supports meaningful production maturity and engineering depth, but the strongest product edge appears to come from workflow compression and trust operations rather than from a singular defensible software invention.
sections:
- id: surface
  title: What the product delivers now
  body: Carousell no longer presents only a listing board where buyers and sellers chat and leave the rest offline. The visible product stack now includes listing creation, reviews, safe checkout, official delivery, trusted home services, CarouBiz merchant tooling, Carousell Certified, and direct Sell to Carousell flows for selected categories. That broadening matters because it changes the job Carousell is solving. In lower-risk categories, the app can still behave like a lightweight peer marketplace. In higher-risk categories such as phones, luxury bags, and cars, the product increasingly inserts itself into verification, payment protection, and sometimes the inventory intake path itself. LuxLexicon and other category moves reinforce that Carousell is assembling multiple product lines around the same trust-heavy secondhand workflow rather than remaining a generic classifieds front end. That widening product scope explains why category operations and trust features now matter as much as
    listing liquidity alone.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  - CE010
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE002
- id: architecture
  title: Architecture and operating model
  body: Public partner evidence gives an unusually concrete picture of Carousell's technical stack for a private marketplace business. Google Cloud says the company uses Gemini, Vertex AI, BigQuery, Compute Engine, GKE, Cloud Storage, and Google Workspace across user-facing and internal workflows. The flagship “List with AI” feature uses multimodal input to generate title, description, category, price, and condition attributes, shifting listing from manual drafting to guided review. On the infrastructure side, Cloudflare describes a platform serving around one petabyte of images per month and handling flash-sale traffic spikes above three times normal volume with caching, WAF, DNS, and SSL services. This is not enough to reconstruct the whole architecture, but it is enough to conclude that Carousell's operating model is production-scale, cloud-native, and increasingly AI-mediated on both customer and internal workflows. The documented stack also implies meaningful vendor concentration, but
    it is still clearly beyond lightweight marketplace infrastructure.
  claimRefs:
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
  - CE019
  - CE020
  - CE021
