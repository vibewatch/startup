- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Carousell solution
  - Measurable benefit
  - Limitation
  rows:
  - - List an item fast
    - Take photos, write copy, price manually
    - List with AI pre-fills title, description, category, price, condition
    - Median listing time below two minutes
    - Needs category-level accuracy statistics
  - - Buy a higher-risk used item
    - Find listing, compare seller, worry about authenticity or condition
    - Certified listings, reviews, Buyer Protection, official delivery
    - Higher trust and clearer dispute path
    - Exact conversion uplift unknown
  - - Sell for instant or assisted resale
    - Negotiate with buyers manually
    - Sell to Carousell / consignment-style workflows in selected categories
    - Faster cash-out and reduced negotiation burden
    - Economics and turnaround time not public
  - - Run a small resale business
    - Post repeatedly and promote inventory
    - CarouBiz subscriptions, coins, bumps, seller features
    - Dedicated merchant tooling beyond casual P2P use
    - Feature depth by plan is opaque
  - - Stay safe on platform
    - Avoid phishing and counterfeit risk
    - Blocking of links, QR codes, warnings, badges, verification, moderation
    - Lower scam exposure and better decision support
    - False-positive and support cost not public
  notes: Benefits are public or directional; economic outcomes still require management data.
