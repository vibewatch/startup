  - TE003
  figureRefs:
  - FE001
- id: differentiation-and-roadmap
  title: Differentiation, engineering signal, and roadmap
  body: The most credible proof of product maturity is not just what Carousell says, but what its partners and public engineering surfaces show. GitHub reveals an organization with public repositories in Go, Swift, Kotlin, TypeScript, Python, and shell tooling, including the Orion microservice framework built around grpc/protobuf. Google Cloud also describes a roadmap that extends beyond the current AI listing experience toward sub-45-second listing time, richer stylistic attributes for discovery, and internal agentic tooling that may shorten engineering work. None of this proves a hard technology moat by itself. Larger competitors can buy or replicate many generic AI capabilities. But it does indicate a serious product and platform organization with the ability to turn infrastructure, data, and process improvements into user-facing speed and trust gains. Carousell's real edge appears operational and integrative rather than purely algorithmic. It also suggests product iteration is continuous
    rather than episodic, with infrastructure and ML changes feeding directly into the user workflow.
  claimRefs:
  - CE022
  - CE023
  - CE031
  - CE032
  - CE033
  - CE034
  - CE035
  - CE037
  tableRefs:
  - TE005
  figureRefs:
  - FE004
- id: trust-safety
  title: Trust, safety, compliance, and quality controls
  body: 'Trust and safety are central product features, not a compliance afterthought. Carousell''s own help-centre materials describe AI and machine-learning detection, moderator review, dispute banners, real-time warnings, mobile verification, and 2FA or SMS re-verification. MHA and other independent reporting add stronger evidence still: Carousell committed to passkeys or biometric logins, account-suspension controls, and Singpass blacklist measures after verified accounts were abused for scams. The MHA transaction-safety page also frames user badges, secure payments, official delivery, and record retention as productized safeguards. Meanwhile, the sanctions policy shows a separate compliance layer dealing with unsupported geographies and prohibited transactions. Together these sources support a clear conclusion: Carousell has built a layered trust stack that spans interface, workflow, moderation, identity, and compliance. What remains unknown is the exact precision of those systems and
    the operational cost of running them at scale. In other words, Carousell is shipping a trust operating system as much as a marketplace app.'
  claimRefs:
  - CE024
  - CE025
  - CE026
  - CE027
  - CE028
  - CE029
  - CE030
  - CE036
  - CE038
