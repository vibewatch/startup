- id: comparable-set
  title: Comparable set and multiple framing
  body: 'No single comp is perfect. Vinted is the best premium private comp because it combines secondhand behavior, platform liquidity, integrated logistics and payments, and visible profitability. Back Market is useful as a higher-trust recommerce comp where service layers and trusted supply support richer economics. ThredUp is the best public transparency comp, even though public markets structurally discount it relative to private strategic winners. These peers suggest that Carousell should trade below the strongest private leaders but above a commodity or purely public-market mark if investors believe its transaction-led recommerce strategy is working. The challenge is that Carousell is simultaneously smaller than premium peers and more operationally ambitious than a thin marketplace. That combination argues for moderation, not maximalism, in valuation work. Geography matters too: Carousell competes in a faster-changing Southeast Asian commerce stack, whereas Vinted benefits from a
    broader European footprint and Back Market benefits from stronger refurbished-supply standardization.'
  claimRefs:
  - CV009
  - CV010
