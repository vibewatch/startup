company:
  name: Carousell
chapter:
  number: 8
  title: Valuation
  summary: Carousell's 2021 unicorn valuation no longer looks obviously stale because the company has since reached US$141 million of FY25 revenue and positive EBITDA, but neither does it deserve an unqualified premium mark. Against Vinted, Back Market, and ThredUp, Carousell screens as a mid-quality private recommerce asset whose defendable 2026 valuation range clusters around roughly US$0.9 billion to US$1.15 billion, with the historical US$1.1 billion mark near the optimistic end of fair value. The investment posture is therefore conditional-pass with an at-market to slightly above-market stance, contingent on durable EBITDA and better disclosure of unit economics.
sections:
- id: anchor-and-quality
  title: Anchor valuation and business-quality shift
  body: The starting point for Carousell valuation is still the September 2021 unicorn round at US$1.1 billion, because no cleaner public financing mark has replaced it. That anchor is old, but it is not irrelevant. In the years since, the company has moved from a still-loss-making but growing marketplace into a business that reported US$141 million of FY25 revenue and positive EBITDA. The operating profile is therefore better than the headline valuation timestamp implies. At the same time, investors cannot simply mark the company upward because business quality improved. The missing ingredients are public GMV, category-level take rates, durable net profitability, and evidence that recommerce stores and specialist verticals earn attractive returns. The right framing is not “old valuation equals wrong valuation,” but “old valuation now needs to be re-judged against stronger fundamentals and still-material uncertainty.” Investors also need to remember that private market marks can stay flat
    while fundamentals improve; that dynamic alone does not make the current price wrong, but it does make scenario analysis more important than headline nostalgia.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV007
  - CV008
