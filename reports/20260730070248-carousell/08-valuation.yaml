- id: range-and-scenario
  title: Valuation range and scenario analysis
  body: A simple multiple framework is sufficient for a first-pass investment view. Public-style downside logic can justify a range around 3x to 4x revenue if the market insists on transparency, listed-comp discounts, and unresolved competition risk. A balanced private-market band of roughly 5x to 7x revenue reflects EBITDA positivity, category expansion, and an improving trust stack but still penalizes scale and disclosure gaps. A premium recommerce band of about 7x to 9x revenue becomes plausible only if investors view Carousell as a scarce regional winner with credible evidence that stores, specialists, and AI-enhanced trust tooling deepen moat rather than cost. The conclusion from this exercise is that US$1.1 billion is no longer obviously stretched, but it still sits near the optimistic end of a defendable 2026 range. In practice, this is a negotiation range rather than a single truth, and diligence quality should determine where inside the band an investor is willing to transact.
  claimRefs:
