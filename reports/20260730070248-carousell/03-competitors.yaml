- id: adverse-view
  title: 'Adverse view: why competition can still compress outcomes'
  body: There is no evidence that Carousell enjoys winner-take-all control over recommerce in its markets. Larger ecosystems can imitate AI features, social platforms can intercept discovery before intent reaches Carousell, and free-listing substitutes can cap monetization in low-trust categories. Carousell's stores and verification stack are advantages, but they also add operating complexity that purely digital rivals do not bear. The investment question is therefore not whether competition exists; it clearly does. The question is whether Carousell can earn better trust-adjusted take rates, conversion, and repeat behavior in the categories it has chosen to emphasize. Current evidence supports a differentiated position, but not an unassailable moat. Investors should underwrite sustained rivalry and avoid assuming that product improvements alone eliminate marketplace commoditization. That adverse frame should shape valuation. Marketplace winners can still earn attractive returns without absolute
    dominance, but only if the chosen categories generate superior trust-adjusted economics. Carousell has evidence for that possibility, not proof that competition has been neutralized.
