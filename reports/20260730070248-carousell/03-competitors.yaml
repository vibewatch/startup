  evidenceGaps:
  - type: missing-source
    severity: material
    topic: competitor-pricing
    missingEvidence: Public list pricing for seller boosts, subscriptions, and take rates across key competitors.
    whyItMatters: Opaque public pricing makes monetization comparison less reliable than capability comparison.
    diligencePath: Request mystery-shop or account-level screenshots by market and category.
    relatedQuestionRefs:
    - QP017
    - QP023
  - type: private-evidence-only
    severity: material
    topic: win-loss
    missingEvidence: Internal win-loss data by category and by competitor.
    whyItMatters: Public surfaces show feature overlap but not where Carousell truly wins or loses in conversion.
    diligencePath: Request marketplace-level competitor reason codes and category-specific churn notes.
    relatedQuestionRefs:
    - QP024
  - type: stale
    severity: minor
    topic: specialist-entrants
    missingEvidence: Current 2026 evidence on emerging local resale startups in each Carousell market.
    whyItMatters: Smaller entrants may matter before broad analysts notice them.
    diligencePath: Extend local-language search and app-store scans by market.
    relatedQuestionRefs:
    - QP014
  - type: access-blocked
    severity: minor
    topic: platform-traffic
    missingEvidence: Deeper Similarweb or app-intelligence metrics behind paywall.
    whyItMatters: Traffic intensity and engagement would sharpen relative liquidity assessment.
    diligencePath: Use paid traffic intelligence or management dashboards.
    relatedQuestionRefs:
    - QP010
  - type: conflicting-data
    severity: minor
    topic: competitor-set-size
    missingEvidence: A stable authoritative competitor taxonomy.
    whyItMatters: Third-party maps disagree on which peers are closest because business models only partially overlap.
    diligencePath: Normalize by buyer job and category rather than one fixed “peer set.”
