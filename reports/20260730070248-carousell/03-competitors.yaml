- id: economics-and-switching
  title: Pricing opacity, switching cost, and moat logic
  body: Public competitor pricing is patchy, so capability and behavior evidence is more dependable than neat pricing charts. The most important structural fact is that multi-homing is easy. Sellers can often cross-list the same item across several apps, which keeps switching costs low and weakens any claim of hard lock-in. That makes liquidity density, trust signals, and repeat seller tooling more important than feature parity alone. Carousell benefits from verified flows, stores, and safer completion in trust-sensitive categories, but it is still vulnerable where buyers only need simple local listing and chat. The company's moat is therefore conditional. It is strongest where risk reduction changes user behavior enough to justify higher monetization or repeat use. It is weakest where listings are interchangeable, distribution is social-graph-driven, or price is the only important decision criterion. The practical implication for diligence is that management must prove category-level close-rate
    improvement, repeat seller behavior, and measurable trust-driven monetization rather than merely product breadth. Without those proofs, even a polished marketplace can still behave like a commodity listing surface.
  claimRefs:
  - CP012
  - CP013
  - CP015
  - CP017
  - CP018
  - CP019
  - CP020
  - CP021
  - CP024
  - CP025
