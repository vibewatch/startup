company:
  name: Carousell
chapter:
  number: 3
  title: Competitors
  summary: 'Carousell faces a crowded substitute set rather than one mirror-image rival. The most important alternatives split into social/discovery platforms like Facebook Marketplace, global or recommerce peers like eBay and Mercari, and lower-friction classifieds such as OLX, OfferUp, Craigslist, and Wallapop. Carousell''s defensibility is real but conditional: its trust stack, certified flows, payments, and stores matter most in higher-risk secondhand categories, while low switching costs and multi-homing keep commoditization risk elevated.'
sections:
- id: landscape
  title: Landscape by competitor class
  body: Carousell should be benchmarked against a competitor set defined by user jobs, not just by other Southeast Asian startups. The closest substitute for many casual sellers is Facebook Marketplace, which combines discovery and built-in identity. For more structured resale and higher-scale seller behavior, eBay and Mercari are more relevant comparators because they put more emphasis on trust, tools, and repeat listing behavior. Traditional classifieds players such as OLX, Quikr, OfferUp, Craigslist, and Wallapop remain useful benchmarks for the persistence of local-listing demand, even if they do not match Carousell market for market. Depop and similar vertical specialists matter in fashion-led resale, while offline dealers and local social groups remain status-quo alternatives. This classification matters because Carousell is not trying to beat all rivals the same way. It needs a different answer for casual local resale, a different answer for higher-ticket trusted transactions, and
    another for vertical merchant workflows.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  - CP005
  - CP006
  - CP007
  - CP033
  tableRefs:
  - TP001
- id: feature-and-trust-positioning
  title: Feature breadth and trust positioning
  body: 'Carousell''s strongest competitive argument is not raw assortment or social reach but trust-enabled completion. App-store surfaces and company materials show Buyer Protection, certified listings, delivery, and safer payment flows that go materially beyond bare-listing products. Singapore regulatory signals strengthen that posture further: Carousell publicly participates in enhanced verification measures and has a large visible safety-and-security help surface. Relative to Craigslist-like substitutes, that is a meaningful advantage. Relative to Facebook Marketplace, it is a more explicit trust stack but with less native discovery power. Relative to eBay, Carousell has a more regional and local-market focus but less global liquidity and less obviously mature seller tooling. The platform therefore sits in an intermediate position: stronger than lightweight classifieds on trust and completion, but not as broad as the largest global marketplaces or social networks.'
  claimRefs:
  - CP008
  - CP009
  - CP010
  - CP011
