  evidenceGaps:
  - type: missing-source
    severity: material
    topic: recommerce-only-tam
    missingEvidence: A market report isolating secondhand/recommerce GMV across Carousell's exact seven-market footprint.
    whyItMatters: Broad SEA e-commerce totals overstate Carousell's reachable spend because they include first-party retail, food delivery, and geographies Carousell does not serve.
    diligencePath: Commission market-sizing cut by category and geography or request internal GMV by category from management.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: repeat-buyer-share
    missingEvidence: Repeat-purchase mix, cohort behavior, and high-frequency category retention data.
    whyItMatters: Market attractiveness depends on whether Carousell wins recurring secondhand behavior rather than one-off bargain hunting.
    diligencePath: Request cohort retention by category, frequency bands, and buy-button penetration by market.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM003
  - type: conflicting-data
    severity: minor
    topic: vendor-estimates
    missingEvidence: A single audited regional dataset rather than multiple vendor estimates with different definitions.
    whyItMatters: Current TAM references mix GMV, revenue, and platform-specific estimates.
    diligencePath: Normalize to one definition in investment committee materials and label vendor-estimated figures clearly.
