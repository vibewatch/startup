tables:
- id: TM001
  title: Market definition table
  columns:
  - Lens
  - Included spend
  - Excluded spend
  - Why it matters for Carousell
  rows:
  - - Core Carousell market
    - Secondhand goods, C2C listings, local resale, seller services, verified recommerce transactions
    - First-party retail, food delivery, enterprise software, pure logistics
    - Matches where Carousell has product-market fit and monetization levers
  - - Adjacency market
    - Classifieds for property, autos, services, and higher-trust commerce workflows
    - Broader digital advertising unrelated to transactions
    - Explains why Carousell still matters beyond pure resale SKUs
  - - Status-quo substitute
    - Offline flea markets, dealer networks, local Facebook groups, informal referrals
    - Institutional procurement or wholesale trade
    - Shows Carousell competes with unstructured offline behavior as much as with apps
  - - Overstated TAM trap
    - Total SEA e-commerce GMV
    - Verticals or countries Carousell does not serve
    - Prevents using a generic regional GMV figure as direct TAM
  notes: 'Boundary is analytical rather than company-issued: the goal is to separate relevant secondhand and classifieds spend from the much broader regional e-commerce backdrop.'
