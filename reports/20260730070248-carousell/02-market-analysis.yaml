- id: buyer-segments-and-behavior
  title: Buyer segments, behaviors, and budget logic
  body: 'The reviewed market sources consistently describe Southeast Asia as mobile-first, social-influenced, and review-driven. AFFiNCO estimates that 78% of e-commerce transactions now happen on mobile, while Sellercraft argues smartphone share is even higher. Hashmeta and AFFiNCO both emphasize review-reading, price comparison, and live-stream or influencer-led discovery as central habits, not edge behaviors. This environment fits Carousell unusually well. A secondhand marketplace needs users who browse on phones, compare listings across sellers, rely on reviews and badges, and accept wallet-based or on-platform payments. It also explains why Singapore, Indonesia, and Vietnam matter in different ways. Singapore is a premium market with higher order values and stronger expectations around convenience, while Indonesia and Vietnam offer greater volume and faster category growth. Budget ownership is mostly consumer household spend rather than corporate procurement, but the decision path varies
    by category: cars, luxury, and mobile devices require more trust and often more offline touchpoints than fashion or household goods. Carousell''s value proposition therefore sits at the intersection of price sensitivity and risk reduction.'
  claimRefs:
