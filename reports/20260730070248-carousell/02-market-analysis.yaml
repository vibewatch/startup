- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Factor
  - Direction
  - Type
  - Evidence
  - Implication
  - Diligence ask
  rows:
  - - Mobile-first commerce
    - Positive
    - Demand formation
    - 78%+ of transactions or more on mobile in reviewed sources
    - Supports app-native discovery and chat-based resale flows
    - Request Carousell app share of GMV by market
  - - Social-commerce and live-stream discovery
    - Mixed
    - Discovery
    - TikTok Shop, Facebook Marketplace, and live-stream shopping are large and growing
    - Creates both acquisition channel opportunity and competitive pressure
    - Ask how much traffic starts from social versus direct or organic search
  - - Digital wallets and secure payments
    - Positive
    - Conversion
    - Wallets dominate regional online payment mixes
    - Supports Buyer Protection and in-app checkout adoption
    - Request buy-button penetration by category and market
  - - Offline trust still matters
    - Mixed
    - Category behavior
    - Offline retains 80-85% of retail spend in Sellercraft
    - Supports Carousell's store strategy but raises execution cost
    - Ask store payback and conversion uplift by category
  - - Higher-ticket used categories
    - Positive
    - Category structure
    - Electronics, fashion, and higher-value goods remain important regional online categories
    - Trust-led recommerce can take share from informal offline trade
    - Request GMV share of high-ticket categories
  - - Horizontal platform competition
    - Negative
    - Competition
    - Shopee, Lazada, TikTok Shop, Facebook Marketplace, eBay, Mercari, OLX all overlap parts of the job
    - Limits pricing power and raises CAC pressure
    - Ask win/loss reasons by competitor and by category
  - - Over-broad TAM narratives
    - Negative
    - Methodology
    - Regional sources use different definitions and vendor estimates
    - Easy to over-underwrite Carousell if TAM is not normalized
    - Force one committee-ready TAM framework before valuation work
  notes: The table intentionally mixes demand and constraint factors because Carousell's market attractiveness depends on both macro growth and category-specific trust friction.
