- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Primary need
  - User behavior
  - Budget owner
  - Why Carousell can win
  rows:
  - - Value-conscious everyday sellers and buyers
    - Turn unused goods into cash and source bargains
    - Mobile-first browsing, price comparison, review checking
    - Household consumer budget
    - Simple listing, local chat, and marketplace liquidity lower friction
  - - Higher-ticket trust-seeking buyers
    - Buy used phones, luxury, or cars with lower fraud risk
    - Need verification, delivery, and safer payment flow
    - Household budget with higher deliberation
    - Certified, Buyer Protection, stores, and sell-to-platform features matter more here
  - - Small merchants and power sellers
    - Operate repeat listings or storefronts
    - Need promotion, analytics, and seller tools
    - Owner-operated microbusiness budget
    - CarouBiz and seller tooling extend beyond casual P2P use
  - - Property and auto searchers
    - Lead generation and discovery rather than instant checkout
    - Longer consideration cycles and cross-checking across channels
    - Consumer household or agent marketing spend
    - Carousell remains useful as a classifieds surface even when final transactions move offline
  notes: Consumer household spend dominates, but decision paths vary meaningfully by category and trust requirement.
