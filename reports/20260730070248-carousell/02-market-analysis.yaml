callouts:
- calloutType: insight
  title: Carousell's market is smaller than the headline TAM but cleaner
  body: 'The company cannot claim all SEA e-commerce, yet its effective niche is more defensible: secondhand transactions where mobile convenience alone is not enough and trust infrastructure changes buyer behavior.'
  claimRefs:
  - CM001
  - CM022
  - CM036
  - CM038
- calloutType: risk
  title: Social-commerce giants can siphon discovery before Carousell gets intent
  body: TikTok Shop and Facebook Marketplace increasingly shape discovery, especially in fashion and lower-trust categories. That can raise acquisition costs unless Carousell wins on trust, inspection, or repeat usage.
  claimRefs:
  - CM019
  - CM021
  - CM022
  - CM025
- calloutType: strength
  title: Hybrid trust is a real wedge in higher-ticket secondhand categories
  body: Regional buyer behavior remains mobile and price-sensitive, but it is also review-driven and risk-aware. That combination favors Carousell's certified, buyer-protected, and physical-store-assisted model in phones, luxury, and cars.
