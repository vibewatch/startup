- id: drivers-and-constraints
  title: Adoption drivers and what limits Carousell's share
  body: The same regional trends that support Carousell also cap its upside. Mobile and wallet adoption, social discovery, and rapid e-commerce growth all help demand formation. Electronics, fashion, beauty, and other trust-sensitive categories also create room for differentiated recommerce, especially when inspection, warranties, and omnichannel handoffs reduce buyer fear. Yet the constraints are equally important. Shopee, Lazada, TikTok Shop, Facebook Marketplace, eBay, Mercari, and OLX all compete for parts of the same user job, either through scale, price, content-led discovery, or entrenched local liquidity. Offline retail still accounts for most spending, so Carousell must keep proving that its hybrid model solves trust better than ordinary listings do. And because many regional estimates are vendor-built rather than audited, it is easy to overstate market size or understate execution difficulty. Carousell's best path is not to mimic the largest marketplaces, but to dominate higher-friction
    secondhand use cases where trust infrastructure turns messy offline trade into repeatable digital behavior.
