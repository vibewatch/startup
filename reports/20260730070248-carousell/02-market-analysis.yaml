company:
  name: Carousell
chapter:
  number: 2
  title: Market Analysis
  summary: Carousell operates inside a very large regional e-commerce backdrop, but its true market is narrower and more attractive than a generic SEA TAM slide suggests. Public sources put Southeast Asian e-commerce around US$180-234 billion in 2024-2026, led by Indonesia and fast-growing Vietnam, with social, mobile, and wallet-led shopping behaviors now dominant. Carousell is best viewed as a secondhand, trust-led subset of that market, strongest where higher-ticket categories and omnichannel verification matter more than lowest-price mass retail.
sections:
- id: market-boundary
  title: Market boundary and what counts
  body: Carousell should not be underwritten against all Southeast Asian digital commerce. The right market boundary is the portion of consumer commerce where secondhand supply, peer-to-peer discovery, seller tools, and trust layers actually matter. Carousell's own materials show the company spanning goods, cars, luxury, mobile phones, fashion, property, home and living, and services; its recommerce strategy then adds inspection, seller subscriptions, integrated payments, shipping, and direct sell-to-platform workflows. That means the relevant market includes C2C and lightly intermediated secondhand transactions, classifieds monetization attached to those categories, and selected adjacent seller services. It excludes most first-party retail GMV, food delivery, pure grocery, and markets where Carousell does not operate. This distinction matters because broad SEA e-commerce TAM numbers are real but misleading if treated as directly addressable. Carousell is not competing for all online retail
    baskets; it is competing for the subset where trust, convenience, and local resale liquidity can beat both informal offline trade and horizontal mass-market platforms.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM022
  - CM037
  tableRefs:
  - TM001
- id: regional-sizing
  title: 'Regional sizing: large backdrop, narrower serviceable market'
  body: 'Multiple third-party datasets support the conclusion that Southeast Asia is one of the world''s fastest-growing digital commerce regions. UnivDatos sizes the 2024 market at US$201.9 billion, while AFFiNCO and Sellercraft place 2026 GMV around US$230-234 billion. Statista''s topic page and Hashmeta''s synthesis also point to a regional market already well above US$139 billion and still compounding at double-digit rates. The common picture is consistent even when the exact totals differ: Indonesia is the volume leader, Vietnam is among the fastest-growing markets, and Singapore is a smaller but far higher-spending premium market. For Carousell, this means the macro tide is supportive, but serviceable spend must be haircut aggressively for geography and category focus. Carousell does not cover Thailand, and much of headline regional GMV sits in categories or merchant models that look nothing like secondhand classifieds or recommerce. The right conclusion is not that Carousell owns
    a US$200+ billion market; it is that Carousell is riding a powerful macro shift inside a much narrower but still very large local resale and trust-enabled commerce wedge.'
  claimRefs:
