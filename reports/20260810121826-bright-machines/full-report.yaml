        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              Bright Machines in 2026 is not selling a single robot or a generic factory dashboard. Its public product
              definition is Bright Factory: an intelligent manufacturing platform that links design, automation, and
              data to help customers build AI hardware and other complex electronics faster, more flexibly, and with
              tighter quality control. The stack is consistently described in three layers—virtual product development,
              AI-enabled robotics, and factory intelligence—which together form the company’s main module map. That
              framing is important because it shows Bright Machines as an operating model, not just a piece of
              equipment.


              The module-level story also looks more mature than a concept deck. Bright Designer appears to handle
              digital manufacturability and simulation upstream; Bright Robotic Cells and Smart Skills execute assembly,
              inspection, and adaptable robotic tasks on the floor; and the data layer captures process and product
              records for quality and optimization. Public demo surfaces and deployment stories show specific workflows
              rather than pure aspiration, including motherboard, DIMM, and AI-infrastructure assembly use cases. What
              is still missing is a formal published SKU or version map, so maturity must be inferred from repeated
              product surfaces rather than explicit release-line documentation.
