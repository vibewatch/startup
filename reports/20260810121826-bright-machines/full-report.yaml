      - number: '7.4'
        title: People, execution, and financing risk
        blocks:
          - type: paragraph
            body: >-
              Bright Machines has already shown that leadership and financing strategy can change abruptly. The 2021 CEO
              transition and cancelled SPAC are not fatal history, but they establish precedent for strategy resets
              under market pressure. Add in a hybrid capital structure with debt, a product that requires scarce
              robotics and AI talent, and a deployment model spanning multiple countries and customer archetypes, and
              the execution burden is clearly high.


              The financing angle is equally important. Historical fundraising is large, but burn, runway, and covenant
              headroom remain private. That means even a well-positioned company can become vulnerable if capex cycles
              slow, deployments take longer, or partner-led customer acquisition underperforms. Public evidence
              therefore supports a measured execution view: Bright Machines is serious and well funded, but not
              obviously beyond financing or organizational strain. The company looks most exposed when operational
              complexity, customer concentration, and capital intensity compound at the same time.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR021
              - CR022
