      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The adoption case rests on four strong drivers. First, AI-hardware complexity is rising faster than
              traditional line-engineering methods can absorb, which makes digital-first validation and
              software-configurable automation more valuable. Second, labor shortages and skills gaps remain important:
              IFR explicitly highlighted labor gaps in 2026, while Bright Machines’ reshoring note argues local
              AI-hardware assembly needs modern automation to offset expensive or scarce labor. Third, regionalization
              and domestic-capacity investment are real tailwinds; Jabil’s planned $500 million U.S. expansion is
              evidence that incumbents also see a durable reshoring opportunity. Fourth, AI ecosystems are broadening
              through Microsoft, NVIDIA, and other partners, which helps legitimize the surrounding demand environment.


              Constraints are just as real. Bright Machines’ own ROI note says approvals get harder once payback
              stretches beyond three years and can be derailed by incomplete requirements, demand swings, or new product
              versions. IDC adds external bottlenecks such as power availability, memory and storage scarcity, export
              controls, and architecture shifts between x86 and ARM. IFR raises a different layer of constraint: as AI
              autonomy and cloud-connected robotics spread, safety, cybersecurity, liability, and explainability become
              more important. Bright Machines therefore benefits from a huge market wave, but it still sells into one of
              the hardest procurement environments in industrial technology.
