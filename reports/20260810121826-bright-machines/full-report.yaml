        - Opaque methodology and thin public detail.
      - - Vention
        - Commercialization transparency
        - >-
          Scaled full-stack automation platform; public scale metrics but no disclosed comparable valuation in fetched
          pack
        - Best operating analog for software-defined automation packaging and GTM clarity.
        - Broader market scope and different hardware architecture.
      - - ABB / EMS incumbents
        - Ceiling reference
        - Public-scale incumbents with global service and manufacturing reach
        - Useful to test whether Bright Machines has enough differentiation to win against giants.
        - Too mature and diversified to apply directly as a startup pricing comp.
      - - Machina Labs
        - Startup-stage strategic reference
        - Physical-AI manufacturing startup with a different process focus
        - Shows investors will fund software-defined manufacturing narratives.
        - Different end market and no close apples-to-apples electronics-assembly economics.
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Covers the practical comparable set available in the fetched public evidence: self-anchors, analogs, incumbents,
        and startup references.
    notes: >-
      Because disclosed multiples are sparse, the comparable set is used primarily for entry discipline and
      ceiling/floor framing rather than for strict comp-based pricing.
