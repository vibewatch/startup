        title: Adoption trajectory is real, but the denominator stays hidden
        blocks:
          - type: paragraph
            body: >-
              Public adoption metrics are directionally strong. Bright Machines said it had more than 75 microfactories
              deployed worldwide by late 2021, more than 100 microfactories and more than 40 customers by 2022, and more
              than 130 microfactories, more than 60 customers, and over 300,000 servers produced by mid-2026. That arc
              is too substantial to dismiss as marketing fluff. It strongly suggests that the company is winning real
              factory programs and has continued to scale through the current AI-infrastructure cycle.


              But adoption counts are not the same as business quality. Public sources do not disclose the size
              distribution of customers, revenue concentration, or whether the increase is coming from net-new logos
              versus deeper expansion inside existing accounts. Nor do they reveal the total addressable account base,
              so adoption momentum cannot be converted into market share. The right reading is therefore positive but
              constrained: Bright Machines has believable deployment growth and geographic breadth, yet investors still
              lack the denominators that would translate those counts into a high-confidence customer-quality
              conclusion.
