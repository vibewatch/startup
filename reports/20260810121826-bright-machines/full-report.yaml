      - number: '7.3'
        title: Partner, customer, and competitive dependency risk
        blocks:
          - type: paragraph
            body: >-
              Bright Machines’ ecosystem is simultaneously a strength and a risk. Microsoft Azure improves distribution
              and integration credibility, NVIDIA strengthens the simulation and AI-stack story, and customer reality is
              supported by DRW, Viridi, and Argonaut. Yet the company’s customer-quality proof still depends more on
              aggregate scale metrics than on named current AI-infrastructure flagship accounts. That leaves
              concentration, renewal, and partner-bargaining questions unresolved.


              Competitive dependence is just as important. Jabil, Flex, Sanmina, Foxconn, Siemens, Rockwell, and
              NVIDIA-linked industrial stacks show that better-capitalized or more deeply embedded rivals are crowding
              the same demand wave. Bright Machines may not need to beat every rival, but it does need to keep a
              differentiated wedge inside an ecosystem where partners can also empower competitors. The risk here is not
              only lost deals. It is slower share capture, margin compression, and the possibility that buyers decide an
              incumbent, EMS provider, or open industrial-AI stack is “good enough.”
            claimRefs:
