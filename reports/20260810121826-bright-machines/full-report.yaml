        title: Customer base segmentation and use-case breadth
        blocks:
          - type: paragraph
            body: >-
              Bright Machines’ public customer base is more diverse than its current AI-infrastructure branding might
              first suggest. Official and partner materials indicate that the company sells to OEMs, ODMs, contract
              manufacturers, and hyperscaler-adjacent hardware producers, but the actual proof set spans many end-use
              categories: medical diagnostics, life sciences, battery systems, networking and wireless hardware,
              automotive-electronics modules, media hubs, consumer devices, and security products. That breadth is
              strategically useful because it shows the company is not limited to a single demo workflow or one fragile
              vertical.


              At the same time, the customer story has clearly migrated toward AI infrastructure. Current company
              language emphasizes servers, storage, racks, and the “AI backbone,” which suggests the most economically
              important customers today may differ from the older named customer set. The implication is that Bright
              Machines now has two customer narratives running in parallel: older named cross-vertical proof and newer
              aggregate AI-infrastructure scale proof. Both matter. The first establishes that buyers have paid for real
              deployments; the second indicates where management now believes the highest-value customer expansion lies.
