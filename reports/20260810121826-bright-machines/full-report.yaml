      - number: '7.5'
        title: Mitigations, monitoring signals, and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              Bright Machines does have visible mitigations. Simulation moves problems upstream, traceability and data
              capture help diagnose failures, Hybrid BRC handles exception states more safely than off-line manual work,
              and ecosystem partnerships shorten time to market. Those are all meaningful. The mistake would be treating
              them as full risk removal. They are better understood as partial controls that reduce, but do not
              eliminate, operational and commercial fragility.


              The cleanest kill criteria therefore sit where these controls would prove insufficient. A material quality
              or security incident, a sharp slowdown in AI-infrastructure capex, evidence that debt or burn is becoming
              urgent, or repeated losses to incumbents and EMS alternatives would all alter the investment view quickly.
              That is also why public evidence is not enough for a green-light on its own. Bright Machines can plausibly
              mitigate many risks, but the residual exposures are still large enough that monitoring indicators and
              management-only diligence must carry real weight in the final recommendation.
            claimRefs:
              - CR025
              - CR028
              - CR029
              - CR030
