  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation is positive on company quality but cautious on price
        blocks:
          - type: paragraph
            body: >-
              Bright Machines clears the most important first screen for a growth-stage industrial-technology
              investment: it is clearly real. The company has repeatedly raised substantial capital, names blue-chip
              strategic investors, shows live product evolution, and now discloses a level of deployment activity that
              is hard to fake. The 2026 record of more than 130 microfactories, more than 60 customers, and more than
              300,000 servers produced means Bright Machines should be treated as a scaled commercial platform, not as a
              lab-stage robotics concept. That matters because valuation discussions for private factory-automation
              companies often blur together early promise and operating proof; Bright Machines has more proof than most.


              The caution is price, not existence. Public evidence still does not disclose current ARR, gross margin,
              customer concentration, software attach, burn, or the cap-table terms that determine whether a new
              investor is buying into a compounding software layer or a capital-intensive deployment business with
              weaker incremental economics. That gap is large enough to prevent a clean buy call at an unknown or
              premium price. The practical recommendation is therefore track: stay close, keep the company on the active
              list, and move only if a financing process supplies evidence that the recurring-software layer is real
              enough to justify a premium multiple.
            claimRefs:
              - CV001
              - CV002
              - CV012
              - CV018
              - CV034
              - CV035
              - CV036
              - CV045
