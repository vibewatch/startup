      - number: '2.2'
        title: Sizing Lenses and Contradictions
        blocks:
          - type: paragraph
            body: >-
              The outer market signals around Bright Machines are unmistakably large. IDC’s July 2026 update put Q1 AI
              infrastructure spending at $89.7 billion and raised the 2026 full-year forecast to $497 billion, while
              TrendForce estimated the top nine cloud service providers would spend more than $886.7 billion in 2026
              capex as the AI buildout accelerated. TrendForce also lifted its 2026 AI-server shipment growth estimate
              to nearly 31%, with total server shipments up 12.8%. Japan’s AI infrastructure market alone is expected to
              exceed $5.5 billion in 2026 after seven-fold growth in three years.


              But those numbers are not interchangeable. IDC measures infrastructure spending, TrendForce adds
              hyperscaler capex lenses, Bright Machines cites network-equipment adjacency, and IFR measures
              industrial-robot market value. Each lens is useful for understanding why demand exists, but none directly
              states the exact Bright Machines revenue pool. That is why this chapter preserves contradictory estimates
              rather than forcing a single TAM. The company’s true capture wedge is much narrower than total datacenter
              capex and somewhat broader than a single robotic station: it sits where complex hardware assembly, digital
              manufacturability, and AI-infrastructure urgency overlap.
