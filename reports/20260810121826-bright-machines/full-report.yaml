      - CV035
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    description: Directional sensitivity of the valuation case to the variables that matter most in public diligence.
    data:
      xAxis: Driver
      yAxis: Relative impact score (0-10)
      items:
        - label: Recurring software attach
          value: 10
          note: >-
            Largest swing factor because it determines whether Bright Machines behaves like software-plus or
            deployment-heavy automation.
        - label: Customer concentration / renewal quality
          value: 9
          note: If the installed base is narrow or low-retention, scale signals lose value quickly.
        - label: AI infrastructure capex continuity
          value: 8
          note: Demand remains powerful but is still shaped by hyperscaler budgets and commissioning bottlenecks.
        - label: Gross-margin trajectory
          value: 8
          note: Margin proof determines whether premium valuation can persist through future rounds.
        - label: Cap-table / debt terms
          value: 7
          note: Preferences and covenants can materially alter upside for new investors.
