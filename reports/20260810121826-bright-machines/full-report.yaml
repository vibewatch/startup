  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Bright Machines should not be underwritten against the whole factory-automation universe. Its public
              materials consistently define a narrower problem: complex backend assembly of AI servers, storage,
              networking gear, and other high-value electronics where product variants change quickly, traceability
              matters, and manual workflows create rework risk. That boundary is tighter than a generic robotics
              narrative but broader than a single machine-vision or robot-arm component sale. The company is trying to
              own the software-defined assembly layer: design validation upstream, robotic execution on the line, and
              production intelligence after every build.


              That distinction matters because the status quo Bright Machines displaces is not simply ‘no automation.’
              It is a mix of manual assembly, highly customized single-purpose lines, and fragmented handoffs between
              designers, contract manufacturers, and quality systems. Its own AI-backbone and reshoring materials argue
              that these legacy approaches break down as AI hardware gets more complex and as manufacturers try to ramp
              local production with less labor slack. Sacra’s framing reinforces the same point from the outside: Bright
              Machines is a narrow but potentially valuable wedge inside a much larger manufacturing spend pool, not a
              claim on all industrial automation budgets.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
