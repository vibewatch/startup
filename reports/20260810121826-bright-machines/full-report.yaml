  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model is legible, but realized pricing is opaque
        blocks:
          - type: paragraph
            body: >-
              Bright Machines’ public materials support a hybrid revenue model rather than a neat SaaS story. The LLM
              profile, official company pages, and Sacra’s analysis all point in the same direction: customers buy a mix
              of robotic cells, engineering and deployment work, and recurring software or data modules layered on top.
              That makes economic sense for the problem Bright Machines is trying to solve. Complex AI-hardware assembly
              is not a pure software workflow; it demands physical deployment, process engineering, inspection, and
              ongoing optimization.


              What public evidence does not provide is the pricing waterfall. Bright Machines sells economic
              outcomes—faster time to revenue, lower total cost, higher reliability—but it does not publish standard
              contract prices. Sacra’s public estimate of roughly $150,000 per year per line for application software is
              directionally useful, and the same analysis suggests a meaningful long-term land-and-expand layer, but
              those are still not realized contract data. The key financial judgment is therefore mixed: Bright Machines
              likely has recurring software economics embedded in the model, but public evidence cannot yet say how much
              of today’s revenue quality comes from software renewal versus services-heavy deployment work.
