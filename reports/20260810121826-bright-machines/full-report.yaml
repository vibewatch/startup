              The public financial picture is strong in outline and weak in precision. Bright Machines clearly has a
              hybrid business, real customers, significant historical capital support, and a market backdrop that could
              sustain continued demand. The company is also not hiding behind pure concept language: it talks about time
              to revenue, lower cost, localized advanced manufacturing, and real production scale. Those are the
              ingredients of a real business rather than a pre-revenue research project.


              But the most important underwriting inputs remain private. There is no public ARR, no current revenue, no
              gross-margin split, no burn or runway, no customer concentration, and no credible public renewal data. The
              chapter’s practical verdict is therefore cautious. Bright Machines can be underwritten as financially
