chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Platform, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Bright Machines in 2026 presents itself less as a traditional automation vendor and more as a
              next-generation manufacturer for AI and data-center infrastructure. Across the homepage, the LLM profile
              page, and current thought-leadership pieces, the company consistently describes Bright Factory as the
              operating system for this model: virtual product development upstream, AI-enabled robotic assembly on the
              line, and factory-intelligence data downstream. That framing matters because it places Bright Machines
              between enterprise software, robotics integrator, and contract manufacturer rather than squarely inside
              only one of those categories.


              The one-line business model visible from public sources is a hybrid of equipment deployment, integration
              work, and recurring software/data modules. Sacra’s public analysis describes Bright Machines as selling
              Bright Robotic Cells and engineering services up front, then monetizing Brightware, Smart Skills, and
              analytics applications over time. The company’s official messaging also emphasizes moving manufacturing
              closer to demand and compressing the path from silicon to revenue for high-value electronics. In practice,
              Bright Machines is using that story to target hyperscaler-adjacent AI servers, racks, and storage systems,
              where design iteration, traceability, and yield matter more than the cheapest labor-only assembly model.
