  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and policy risk
        blocks:
          - type: paragraph
            body: >-
              Bright Machines’ legal and policy risk profile is defined more by absence of evidence than by any one
              scandal. The company operates in manufacturing environments increasingly shaped by OT cybersecurity
              requirements, export controls, data-sovereignty rules, and safety expectations, yet the public source pack
              does not expose a mature external compliance package. IDC’s 2026 AI infrastructure work specifically
              highlights export-control and sovereignty pressures, while Bright Machines’ own plant-infrastructure
              article stresses cybersecurity and data governance as foundational. That combination matters: the company
              is clearly aware of the risk surface, but public evidence does not show a completed trust or regulatory
              story.


              The same caution applies to litigation and formal enforcement. No fetched source clearly surfaced a
              litigation, recall, or enforcement trail, but that is not the same as a clean bill of health. It simply
              means the public pack cannot verify one way or the other. For diligence, the practical legal view is
              straightforward: Bright Machines does not present an obvious red-flag headline, but it also does not
              provide enough public compliance evidence to remove legal, safety, or regulatory uncertainty from the
              investment case.
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR026
