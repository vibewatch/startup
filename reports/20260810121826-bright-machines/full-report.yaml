              calling OT cybersecurity, visibility, and data governance foundational. The physical-AI article also
              describes confidence thresholds, out-of-distribution handling, and fallback logic—useful signs that the
              company thinks about safe model operation in production rather than only about accuracy claims.


              What the source pack does not provide is a mature trust-center equivalent. No fetched source clearly
              verified ISO, SOC, IEC, or comparable product-certification status, and no public SLA or uptime table was
              found. That does not mean those controls do not exist; it means the public product narrative is still more
