  - id: TV005
    title: Thesis-break and kill triggers table
    type: enumeration
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Financing quality deteriorates
        - Flat or down round, or financing led mainly by insiders at defensive terms
        - Signals the market sees weaker economics or weaker demand than the public story implies.
        - Reprice or pause; do not underwrite premium multiple.
      - - Software mix remains unproven
        - Management still cannot show recurring-software attach, renewal quality, or gross-margin lift
        - Breaks the premium-software layer part of the thesis.
        - Value as hybrid industrial business, not software-enabled platform.
      - - AI-infrastructure quality incident
        - Major server-assembly defect, traceability failure, or reliability issue in a marquee program
        - Damages the core quality and data-thread differentiation story.
        - Escalate technical diligence and cut valuation range.
      - - Share captured by incumbents
        - Repeated losses to EMS or incumbent-automation alternatives in target accounts
        - Suggests Bright Machines is strategically relevant but economically replaceable.
        - Lower moat score and strategic-premium assumption.
      - - Customer concentration disappoints
        - Installed base is narrow, non-renewing, or heavily project-based
        - Undercuts durability of reported scale metrics.
        - Move to watch-only until retention and concentration improve.
    enumerationScope:
      coverage: exhaustive
      basis: Enumerates the main thesis-break events investors can monitor after initial diligence.
    notes: These are decision triggers, not ordinary operating KPIs.
    sourceRefs:
      - SV014
      - SV011
      - SV031
    claimRefs:
      - CV041
      - CV044
  - id: TV006
    title: Final diligence asks table
    type: enumeration
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Current financial quality
        - ARR, current revenue, gross-margin split, contribution margin by deployment
        - Separates a compounding platform from a project-heavy industrial business.
        - Management data room; CFO diligence session.
      - - Customer quality
        - Top-customer concentration, renewal / expansion, cohort economics
        - Tests whether public scale metrics are durable and valuable.
        - Revenue cohort analysis; reference calls.
      - - Cap table and preferences
        - Liquidation preferences, anti-dilution, debt covenants, option pool, seniority stack
        - Determines real downside protection and upside participation for new capital.
        - Counsel review; financing docs.
      - - Operational proof
        - Incident history, defect escapes, field quality, rework, uptime, and RMA metrics
        - Validates whether the quality story scales under AI-infrastructure workloads.
        - VP Ops diligence; customer QA references.
      - - Software attach
        - Module adoption, per-line recurring value, churn, and upsell behavior
        - Core variable behind any premium valuation thesis.
        - Product analytics export; cohort model review.
    enumerationScope:
      coverage: exhaustive
      basis: Covers the minimum additional evidence required to upgrade from track to investable.
    notes: These asks focus on the smallest set of items that would move the valuation call materially.
    sourceRefs:
      - SV014
      - SV013
      - SV001
    claimRefs:
      - CV042
      - CV043
      - CV044
      - CV045
