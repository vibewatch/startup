      - number: '7.2'
        title: Operational, quality, and cybersecurity risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Bright Machines is attacking one of the hardest manufacturing problems in the market:
              high-mix, high-value, rapidly changing AI-hardware assembly. That creates rich upside but also layered
              failure modes. The company’s own content acknowledges downtime, performance inconsistency,
              capacity-transfer risk, and the need for fallback logic when models face edge cases. Hybrid BRC is
              especially revealing because it proves the product is not yet a “set and forget” autonomous factory; some
              workflows still require controlled human intervention to preserve quality and throughput.


              External evidence compounds the risk picture. IDC highlights power and component constraints on
              AI-infrastructure deployments, while IFR flags OT cybersecurity and labor shortages. Together these point
              to a practical risk thesis: Bright Machines may execute well at the line level and still suffer from macro
              bottlenecks, staffing gaps, or multi-site rollout problems. The company appears to have serious
              mitigations—simulation, traceability, fallback logic—but public evidence still stops short of hard
              incident-rate or uptime disclosure. That is why operational risk remains one of the highest-weighted
              diligence categories.
            claimRefs:
              - CR002
              - CR004
