    type: range
    layout: standard
    description: Public-evidence scenario ranges for Bright Machines valuation as of August 2026.
    data:
      items:
        - label: Bear case
          low: 600
          high: 900
          unit: USD millions
          note: Services-heavy mix, concentration, or financing pressure pushes value below prior tracker references.
        - label: Base case
          low: 1000
          high: 1400
          unit: USD millions
          note: >-
            Strategic relevance and 2026 scale support fair value around low-single-digit billions, but not a pure
            software premium.
        - label: Bull case
          low: 1800
          high: 2800
          unit: USD millions
          note: >-
            Recurring software attach, strong AI-infrastructure share, and scarcity as a strategic target justify a
            higher premium.
        - label: Historical SPAC anchor
          low: 1600
          high: 1600
          unit: USD millions
          note: 2021 reported transaction anchor; included as context, not as a current mark.
        - label: Tracker reference
          low: 938
          high: 938
