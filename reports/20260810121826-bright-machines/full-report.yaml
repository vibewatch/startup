      - number: '1.3'
        title: Funding History, Investors, and Capital-Structure Ambiguity
        blocks:
          - type: paragraph
            body: >-
              Bright Machines’ financing history is unusually large for an industrial automation startup, but it is not
              perfectly clean in public sources. TechCrunch documented a $179 million Series A at launch in 2018,
              already tied to the Flex spinout story and Eclipse’s backing. The company then announced a $132 million
              2022 financing package split between $100 million of Series B equity and $32 million of debt from Silicon
              Valley Bank and Hercules. In June 2024 it announced a $126 million Series C with $106 million of equity
              led by BlackRock-managed funds and $20 million of venture debt from J.P. Morgan, with NVIDIA, Microsoft,
              Eclipse, Jabil, and Shinhan Securities participating.


              The ambiguity is in the cumulative totals. Bright Machines said the 2022 round brought total capital
              raised to $330 million, while the 2024 round said total capital exceeded $400 million. A simple sum of the
              named 2018, 2022, and 2024 rounds yields at least $437 million, implying either earlier capital not
              obvious in the named-round record or different inclusion rules across announcements. That does not
              invalidate the financing story, but it is exactly the kind of cap-table ambiguity a diligence process
              should reconcile before underwriting dilution, liquidation stack, or current valuation. Public sources
              also fail to establish a company-confirmed 2026 valuation, leaving price discovery mostly to
              secondary-market trackers and commentary.
