  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    description: Chain from company quality, demand tailwind, pricing opacity, and valuation support to the final recommendation.
    data:
      nodes:
        - id: n1
          label: Real operating proof
          type: input
          detail: Funding history, scale metrics, and product releases show Bright Machines is commercially real.
        - id: n2
          label: AI infrastructure tailwind
          type: input
          detail: IDC and TrendForce show durable AI hardware demand through 2026 and beyond.
        - id: n3
          label: Economics still private
          type: input
          detail: ARR, gross margin, retention, concentration, and cap-table terms are not publicly disclosed.
        - id: n4
          label: Premium partly justified
          type: process
          detail: Strategic relevance warrants a premium to generic automation vendors, but not a blind software multiple.
        - id: n5
          label: 'Verdict: Track / Fair / Medium confidence'
          type: output
          detail: Stay engaged, but require better economics disclosure or disciplined pricing before committing capital.
      edges:
        - from: n1
          to: n4
        - from: n2
          to: n4
        - from: n3
          to: n4
        - from: n4
          to: n5
