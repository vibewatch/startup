- id: unit-economics-and-cost-structure
  title: Cost structure should improve with software attach, but deployment drag remains real
  body: 'Bright Machines likely sits in the difficult middle of industrial-tech economics. It is lighter than a manufacturer that owns every factory asset or builds full products end to end, but heavier than a pure cloud-software vendor. Public sources consistently emphasize localized production, robotics deployment, simulation, quality inspection, and field-ready plant infrastructure. Those are value-creating capabilities, yet they also imply customer engineering, implementation cost, and some working-capital burden around hardware modules and deployments.


    The better-margin side of the model is also visible. Bright Machines’ software, Smart Skills, Data Hub, and application layers should scale more cleanly once a line is live, and the company’s own messaging repeatedly frames data and software as the source of compounding performance improvement. The unresolved question is mix. If recurring software attaches strongly to each microfactory and expands over time, gross margins can improve meaningfully. If deployments remain heavily customized or services-dominant, consolidated economics may stay much more project-like than a software headline suggests. Public evidence today cannot settle that distinction.'
