- id: capital-adequacy
  title: Historical capital support is verified; present adequacy is not
  body: 'Bright Machines’ historical capital base is easy to verify, but its current cash position is not. The company officially disclosed a $132 million 2022 financing package and a $126 million 2024 Series C, and TechCrunch documented the earlier $179 million launch round. The 2024 release also said total capital raised was more than $400 million. SEC search results add a useful regulatory anchor: Bright Machines appears in EDGAR under CIK 0001741724, and the public Form D listing shows at least one 2022 exempt offering filing. The financing record therefore looks real, large, and continuous.


    That still falls short of underwriting current adequacy. The capital structure includes debt as well as equity, with $32 million of debt attached to the 2022 package and $20 million of venture debt in 2024. Public sources do not disclose the present cash balance, monthly burn, covenant package, or runway. That means an investor can conclude Bright Machines has raised enough capital to build a serious platform, but cannot conclude whether the company is comfortably funded today, approaching another raise, or managing around debt-linked constraints.'
