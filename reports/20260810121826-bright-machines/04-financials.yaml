- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact
  - Public proxy available
  - Exact diligence path
  rows:
  - - Current ARR / revenue
    - Cannot judge scale against price or forecast growth
    - Only stale >$30M-in-first-two-years datapoint and operational scale signals
    - Request monthly revenue bridge by product, segment, and geography.
  - - Gross margin by stream
    - Cannot test software thesis versus services drag
    - Hybrid business-model narrative only
    - Request hardware/services/software gross margin bridge.
  - - Pricing waterfall and discounting
    - Cannot assess pricing power or quality of bookings
    - One public third-party software estimate only
    - Request price book, sample contracts, and realized discount analysis.
  - - Customer concentration and renewal
    - Cannot assess durability or top-account risk
    - Customer count and deployment scale only
    - Request top-account mix, renewal history, and NRR/GRR.
  - - Cash burn and runway
    - Cannot know financing urgency or downside risk
    - Historical capital raised only
    - Request current cash, debt schedule, and forecast scenarios.
  - - Debt obligations and covenants
    - Cannot see hidden capital constraints
    - Debt amounts disclosed, terms absent
    - Request lender documents, covenant metrics, and headroom analysis.
  notes: These are the exact private metrics needed to convert Bright Machines from “financially credible” to actually underwritable.
