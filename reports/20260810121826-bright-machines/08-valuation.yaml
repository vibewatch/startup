- id: TV005
  title: Thesis-break and kill triggers table
  type: enumeration
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Financing quality deteriorates
    - Flat or down round, or financing led mainly by insiders at defensive terms
    - Signals the market sees weaker economics or weaker demand than the public story implies.
    - Reprice or pause; do not underwrite premium multiple.
  - - Software mix remains unproven
    - Management still cannot show recurring-software attach, renewal quality, or gross-margin lift
    - Breaks the premium-software layer part of the thesis.
    - Value as hybrid industrial business, not software-enabled platform.
  - - AI-infrastructure quality incident
    - Major server-assembly defect, traceability failure, or reliability issue in a marquee program
    - Damages the core quality and data-thread differentiation story.
    - Escalate technical diligence and cut valuation range.
  - - Share captured by incumbents
    - Repeated losses to EMS or incumbent-automation alternatives in target accounts
    - Suggests Bright Machines is strategically relevant but economically replaceable.
    - Lower moat score and strategic-premium assumption.
  - - Customer concentration disappoints
    - Installed base is narrow, non-renewing, or heavily project-based
    - Undercuts durability of reported scale metrics.
    - Move to watch-only until retention and concentration improve.
  enumerationScope:
    coverage: exhaustive
    basis: Enumerates the main thesis-break events investors can monitor after initial diligence.
  notes: These are decision triggers, not ordinary operating KPIs.
