  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-financial-quality
    missingEvidence: Current ARR or revenue, gross-margin split, contribution margin, cash balance, and burn rate remain undisclosed publicly.
    whyItMatters: Those numbers determine whether Bright Machines deserves a premium software-enabled valuation or only a hybrid industrial valuation.
    diligencePath: Request current KPI pack, monthly financials, and cohort-level unit economics from finance leadership.
    relatedQuestionRefs:
    - QV006
    - QV017
    - QV028
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-and-financing-terms
    missingEvidence: Current post-money valuation, liquidation preferences, anti-dilution protections, option-pool impact, and debt covenant package are not public.
    whyItMatters: Without terms, an investor cannot translate company quality into actual upside or downside for a new round.
    diligencePath: Review term sheets, charter, debt documents, and full cap table with counsel.
    relatedQuestionRefs:
    - QV027
    - QV029
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: customer-quality-and-retention
    missingEvidence: Current customer concentration, renewal behavior, software attach, and cohort expansion across the installed base are not publicly disclosed.
    whyItMatters: Scale metrics can overstate value if the installed base is concentrated, project-based, or low-retention.
