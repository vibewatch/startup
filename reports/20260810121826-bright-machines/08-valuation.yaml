- id: kill-triggers-and-diligence-path
  title: Final diligence should focus on economics, concentration, and terms—not on whether the company exists
  body: 'The remaining work is unusually focused. An investor does not need another broad market study to decide whether Bright Machines is interesting; the market tailwind and product relevance are already visible. What matters now is whether the company’s economics justify paying a premium for that relevance. The first diligence bucket is commercial quality: current revenue, ARR or recurring-software mix, gross-margin split, cohort expansion, and customer concentration. The second bucket is financing structure: liquidation preferences, anti-dilution provisions, debt covenants, and how much of any next round is supporting growth versus runway. The third is operating proof: quality incidents, renewal behavior, and whether named and unnamed AI-infrastructure customers are deepening rather than merely piloting.


    If those asks come back strong, Bright Machines could graduate from track to investable. If they come back weak—or if the company avoids disclosing them while seeking a premium round—the valuation should be treated as fully priced or worse. The thesis can survive imperfect transparency; it cannot survive evidence that the software narrative is masking low-quality industrial economics.'
