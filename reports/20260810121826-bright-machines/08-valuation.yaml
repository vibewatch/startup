- id: scenario-ranges-and-exit-readiness
  title: The base case is around fair value; upside requires proof that is still private
  body: 'Because Bright Machines does not publish the operating metrics needed for a normal revenue-multiple approach, scenario ranges are more credible than a single-point estimate. The bear case assumes that AI-hardware demand stays healthy but Bright Machines proves more services-heavy than software-heavy, needs more capital before showing margin lift, or loses economic leverage to EMS incumbents serving the same customers. In that world, a valuation below prior private references is plausible. The base case assumes the 2026 deployment statistics are real leading indicators of a company becoming an important control layer for AI-hardware assembly, but not yet a proven software compounder; that points to a range clustered around low-single-digit billions rather than around a pure-AI-software premium. The bull case requires management to demonstrate that Bright Machines is not only automating lines but owning a durable data and orchestration layer across those lines.


    Exit logic follows the same pattern. The company looks more like a future strategic target or a candidate for a later private round than like a near-term IPO name. A public-market listing would require evidence of scale and recurring economics that the company has not yet chosen to disclose.'
