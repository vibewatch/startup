- id: TV002
  title: Thesis / anti-thesis table
  type: enumeration
  columns:
  - Argument
  - Evidence supporting
  - What would change the view
  rows:
  - - Strategic investors validate relevance
    - BlackRock, NVIDIA, Microsoft, Jabil, Eclipse, and J.P. Morgan participated across recent financings.
    - Less relevant if participation was mostly defensive or if economics fail to justify follow-on support.
  - - Commercial scale is real
    - 130+ microfactories, 60+ customers, 300k+ servers, plus earlier revenue and deployment proof.
    - Would strengthen materially with current cohort economics and renewal metrics.
  - - Software-defined stack can earn a premium
    - Design-through-traceability stack is more valuable than a standalone robot or integrator project.
    - Needs proof that recurring software and data attach drive margin improvement.
  - - Hybrid industrial model constrains software-style pricing
    - Hardware, services, and implementation work remain visible in the public model.
    - Would weaken if software mix and renewal quality are disclosed as dominant.
  - - Price discovery remains opaque
    - No confirmed 2024 post-money; only partial tracker references and stale SPAC history are public.
    - Would improve immediately with clean round terms, cap-table details, and current KPI disclosure.
