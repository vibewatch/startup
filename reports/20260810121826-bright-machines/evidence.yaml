evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      A current cap-table or independent secondary-market price history tying Bright Machines to a company-confirmed
      2026 valuation.
    whyItMatters: >-
      The chapter can bracket historical funding and outdated valuation markers, but not underwrite current entry price
      without a fresher reference.
    diligencePath: >-
      Request the latest board-approved 409A, preferred-share pricing history, and any fund-mark support or secondary
      transaction comps.
    relatedQuestionRefs:
      - QO011
      - QO024
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure-gap
    missingEvidence: >-
      Current revenue run-rate, gross margin, burn, and runway details tied to audited or board-level financial
      reporting.
    whyItMatters: >-
      Without current financial statements, public evidence cannot support underwriting on growth durability or
      profitability path.
    diligencePath: Request monthly management accounts, board materials, and debt covenant packages covering the last 12 months.
    relatedQuestionRefs:
      - QO025
  - type: conflicting-data
    severity: material
    topic: total-raised
    missingEvidence: >-
      A reconciled financing history that explains why the 2022 cumulative total of $330M is higher than the named 2018
      plus 2022 round sum.
    whyItMatters: >-
      Capital history is foundational for dilution analysis, and unexplained discrepancies can distort valuation and
      ownership assumptions.
    diligencePath: >-
      Reconcile the capitalization table against every equity, debt, and warrant issuance since founding, including any
      incubator transfers from Flex.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: leadership-table coverage
    missingEvidence: A current, complete board and executive roster with committee assignments and investor representation.
    whyItMatters: >-
      The published leadership table is directionally useful, but not a full governance package for control-risk
      analysis.
    diligencePath: Request the latest board observer list, committee chart, and executive org chart from the company.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: milestone chronology coverage
    missingEvidence: >-
      A full dated milestone log covering every facility launch, major product release, and financing close since
      founding.
    whyItMatters: >-
      The milestone table captures the most material public events but almost certainly omits non-public or unpublished
      internal scale milestones.
    diligencePath: Request an internal chronology from founding through 2026 and reconcile it against board decks and press archives.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: share-and-conversion
    missingEvidence: >-
      A funnel showing Bright Machines pipeline volume, win rate, pilot-to-production conversion, and booked capacity by
      buyer segment.
    whyItMatters: >-
      Public market demand signals are strong, but underwriting still depends on whether Bright Machines converts that
      demand into repeatable booked programs.
    diligencePath: >-
      Request CRM pipeline cohorts, deployment conversion history, and backlog by hyperscaler, OEM, ODM, and
      contract-manufacturing segment.
    relatedQuestionRefs:
      - QM022
      - QM023
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: precise-tam
    missingEvidence: >-
      A directly published TAM, SAM, and SOM specific to software-defined assembly of AI servers, storage, and
      networking equipment.
    whyItMatters: >-
      The current source pack supports a strong outer-market story but not a precise Bright Machines-specific sizing
      stack.
    diligencePath: >-
      Build a bottoms-up model from server, rack, storage, and networking assembly spend by region and product family,
      then map the automation-addressable portion.
