- id: retention-durability-and-expansion
  title: Retention, durability, and expansion remain the biggest public blind spots
  body: 'Public evidence supports a plausible land-and-expand motion but not a measured one. Bright Machines’ modular deployment library, rising microfactory count, and expanding AI-infrastructure feature set suggest there are natural paths to deepen a relationship: add lines, add modules, extend into adjacent SKUs, or solve more exception-handling problems such as those addressed by Hybrid BRC. That is the qualitative expansion story, and it is believable.


    What is missing is the data needed to decide how durable that story really is. No public source in the fetched pack discloses NRR, GRR, churn, contract length, renewals, or customer-satisfaction metrics. Without those, one cannot know whether customers that start with one use case reliably expand, whether large programs persist, or whether deployments become sticky enough to justify premium software-style revenue assumptions. The chapter therefore has to separate customer proof from retention proof: Bright Machines has plenty of the former and almost none of the latter.'
  claimRefs:
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU031
  - CU035
  - CU036
