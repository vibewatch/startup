- id: named-customer-proof
  title: Named customer proof is credible, but much of the newest AI proof is aggregate
  body: 'The named public case studies are credible and varied. DRW in diagnostics is the strongest quantified outcome, with a target of raising annual HIV-test cartridge production tenfold to over one million units. Argonaut shows Bright Machines working inside sterile life-science manufacturing. Viridi extends the proof set into electrification infrastructure. Alongside those named customers, the short deployment pages show the platform being reused across motherboards, base stations, media hubs, infotainment modules, smart speakers, smart tags, and wireless alarm systems. The overall impression is of real production use, not a lab-only product.


    The limitation is recency and specificity. The newest AI-infrastructure proof is mostly aggregate—customer counts, server counts, Hybrid BRC availability—rather than fully named current hyperscaler or OEM references. That does not invalidate the scale story, but it does mean the best public evidence on today’s most strategic customer segment is less concrete than the older cross-vertical case studies. In diligence terms, Bright Machines looks strongest on “proof of use” and weaker on “proof of current flagship account quality.”'
  claimRefs:
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
