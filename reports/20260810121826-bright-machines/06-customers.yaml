  - TU004
  figureRefs:
  - FU004
- id: expansion-and-concentration-risk
  title: Expansion upside is real, but concentration risk remains unresolved
  body: 'The same facts that make Bright Machines attractive to customers also create concentration risk. AI-infrastructure programs are strategically valuable, likely large, and tied to well-funded buyers, which means a few accounts could matter disproportionately. Public evidence does not let investors rule that out. In fact, the opposite is more prudent: the modest disclosed customer count, scarcity of named current AI-hardware logos, and absence of segment-level revenue mix all point to a need for caution. Market tailwinds from hyperscaler capex help customer formation, but they also increase exposure to capex-cycle volatility and to channel partners or OEMs with strong bargaining power.


    This leaves Bright Machines in a familiar but still investable place. The company seems to have real adoption, real workflow breadth, and a believable expansion path. It simply lacks the public retention and concentration data required to underwrite those strengths as durable revenue quality. Customer diligence therefore needs to move past logo and deployment counting into revenue share, renewal behavior, partner dependence, and the exact mix between older cross-vertical programs and the newer AI-infrastructure wedge.'
