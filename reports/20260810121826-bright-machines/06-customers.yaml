chapter:
  number: 6
  title: Customers
  summary: Bright Machines has credible adoption and unusually broad public deployment proof for a private manufacturing-technology company, but the public record is much stronger on deployment breadth than on retention, concentration, or segment-level revenue quality. The customer story supports real demand and expansion potential, yet still requires deeper diligence on durability.
sections:
- id: customer-base-and-segmentation
  title: Customer base segmentation and use-case breadth
  body: 'Bright Machines’ public customer base is more diverse than its current AI-infrastructure branding might first suggest. Official and partner materials indicate that the company sells to OEMs, ODMs, contract manufacturers, and hyperscaler-adjacent hardware producers, but the actual proof set spans many end-use categories: medical diagnostics, life sciences, battery systems, networking and wireless hardware, automotive-electronics modules, media hubs, consumer devices, and security products. That breadth is strategically useful because it shows the company is not limited to a single demo workflow or one fragile vertical.


    At the same time, the customer story has clearly migrated toward AI infrastructure. Current company language emphasizes servers, storage, racks, and the “AI backbone,” which suggests the most economically important customers today may differ from the older named customer set. The implication is that Bright Machines now has two customer narratives running in parallel: older named cross-vertical proof and newer aggregate AI-infrastructure scale proof. Both matter. The first establishes that buyers have paid for real deployments; the second indicates where management now believes the highest-value customer expansion lies.'
  claimRefs:
  - CU001
  - CU002
  - CU013
  - CU014
  - CU015
  - CU016
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory-and-scale
  title: Adoption trajectory is real, but the denominator stays hidden
  body: 'Public adoption metrics are directionally strong. Bright Machines said it had more than 75 microfactories deployed worldwide by late 2021, more than 100 microfactories and more than 40 customers by 2022, and more than 130 microfactories, more than 60 customers, and over 300,000 servers produced by mid-2026. That arc is too substantial to dismiss as marketing fluff. It strongly suggests that the company is winning real factory programs and has continued to scale through the current AI-infrastructure cycle.


    But adoption counts are not the same as business quality. Public sources do not disclose the size distribution of customers, revenue concentration, or whether the increase is coming from net-new logos versus deeper expansion inside existing accounts. Nor do they reveal the total addressable account base, so adoption momentum cannot be converted into market share. The right reading is therefore positive but constrained: Bright Machines has believable deployment growth and geographic breadth, yet investors still lack the denominators that would translate those counts into a high-confidence customer-quality conclusion.'
  claimRefs:
  - CU003
  - CU004
  - CU005
  - CU006
