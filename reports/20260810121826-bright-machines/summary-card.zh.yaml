  topStrengths:
    - NVIDIA、Microsoft、BlackRock、Eclipse、Jabil 等战略投资者验证了 Bright Machines 的 AI 基础设施用例。
    - 软件定义路径应能比传统硬自动化更快重编程。
    - Bright Machines 正受益于长期 AI 数据中心建设潮，后者需要专门的硬件组装和可追溯性。
    - 公开的 2026 年规模信号——130+ 个 microfactory、60+ 客户、生产 300,000+ 台服务器——表明商业牵引真实存在。
  topRisks:
    - 长销售周期和资本密集的 microfactory 部署，会拖慢收入转化和毛利率扩张。
    - Bright Machines 面对 ABB、Flex、Jabil、Sanmina 等存量基础和服务足迹更大的老牌厂商。
    - 财务指标、软件 attach rate 和盈利路径仍未披露。
    - 如果 hyperscaler 或 AI 服务器支出放缓，客户集中度风险可能很实质。
  unresolvedGaps:
