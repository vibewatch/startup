  evidenceGaps:
  - type: missing-source
    severity: material
    topic: formal-certifications
    missingEvidence: A current product-security, quality, or certification matrix covering ISO, SOC, safety, and deployment-compliance posture.
    whyItMatters: The product narrative is strong on traceability and security intent, but public evidence is weak on formal external certifications.
    diligencePath: Request trust-center materials, certification letters, safety standards mapping, and recent audit results.
    relatedQuestionRefs:
    - QE018
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: reliability-sla
    missingEvidence: Actual uptime, failure-rate, MTBF, SLA, and incident statistics for deployed Bright Machines systems.
    whyItMatters: Public demos and architecture descriptions do not prove production reliability at scale.
    diligencePath: Request fleet reliability dashboards, incident logs, and SLA performance by customer cohort.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE002
    - TE004
  - type: private-evidence-only
    severity: minor
    topic: ip-estate
    missingEvidence: A patent or trade-secret map tying core Smart Skills, simulation, and data-layer claims to defensible IP.
    whyItMatters: The technology appears differentiated, but the exact legal defensibility is not visible in the public pack.
    diligencePath: Request patent schedule, invention assignments, and trade-secret protection controls.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: minor
    topic: developer-signal-proxy
    missingEvidence: A stronger public practitioner signal such as engineering talks, release notes, SDK docs, or community usage telemetry.
    whyItMatters: Bright Machines is not a public developer platform, so careers and keynote proxies are useful but shallow.
