- id: trust-quality-and-compliance
  title: Trust, quality, security, and compliance posture
  body: 'Public evidence is strongest on embedded quality controls and weakest on formal external attestations. Bright Machines repeatedly highlights traceability, in-process inspection, force sensing, visual verification, and serial-number-level records. The plant-infrastructure piece goes further by explicitly calling OT cybersecurity, visibility, and data governance foundational. The physical-AI article also describes confidence thresholds, out-of-distribution handling, and fallback logic—useful signs that the company thinks about safe model operation in production rather than only about accuracy claims.


    What the source pack does not provide is a mature trust-center equivalent. No fetched source clearly verified ISO, SOC, IEC, or comparable product-certification status, and no public SLA or uptime table was found. That does not mean those controls do not exist; it means the public product narrative is still more operational than compliance-document driven. For technical diligence, that gap matters. Investors and customers can reasonably believe the product has serious quality instrumentation, but they still need primary evidence on safety frameworks, external audits, and runtime reliability before treating the platform as fully de-risked.'
  claimRefs:
  - CE028
  - CE030
  - CE031
  - CE032
  - CE033
