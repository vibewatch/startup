  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    description: 把公司质量、需求顺风、定价不透明和估值支撑串到最终建议。
    data:
      nodes:
        - id: n1
          label: 真实运营验证
          type: input
          detail: 融资历史、规模指标和产品发布显示，Bright Machines 的商业化已经跑起来。
        - id: n2
          label: AI 基础设施顺风
          type: input
          detail: IDC 和 TrendForce 显示，AI 硬件需求会贯穿 2026 年并延续其后，韧性仍在。
        - id: n3
          label: 经济性仍未公开
          type: input
          detail: ARR、毛利率、留存、客户集中度和股权结构条款都没有公开披露。
        - id: n4
          label: 溢价有部分依据
          type: process
          detail: 战略价值支撑一定溢价，但不能盲目套用软件倍数。
        - id: n5
          label: 结论：跟踪 / 公允 / 中等信心
          type: output
          detail: 继续保持接触，但在投入资本前，需要看到更好的经济性披露或有纪律的定价。
      edges:
        - from: n1
          to: n4
        - from: n2
          to: n4
        - from: n3
          to: n4
        - from: n4
          to: n5
    sourceRefs:
      - SV001
      - SV012
      - SV015
    claimRefs:
