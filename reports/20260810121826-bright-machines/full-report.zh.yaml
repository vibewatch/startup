      - number: '6.2'
        title: 采用轨迹真实，但分母仍被隐藏
        blocks:
          - type: paragraph
            body: >-
              公开采用指标整体很强。Bright Machines 称，截至 2021 年底，全球已部署超过 75 个微型工厂；到 2022 年，微型工厂超过 100 个、客户超过 40 家；到 2026 年中，微型工厂超过
              130 个、客户超过 60 家，并已生产超过 300,000 台服务器。这个轨迹已经很实，不宜当作营销话术略过。它强烈说明，公司正在拿下真实工厂项目，并且在当前 AI 基础设施周期里继续放大规模。


              但采用数量不等于业务质量。公开来源没有披露客户规模分布、收入集中度，也没有说明增长来自新增客户，还是来自既有账户加深扩张。它们也没有给出总可触达账户基数，因此采用动能无法换算成市场份额。正确读法是正面但有边界：Bright
              Machines 的部署增长和地域宽度可信，但投资者仍缺少分母，无法把这些数量转成高置信度的客户质量结论。
