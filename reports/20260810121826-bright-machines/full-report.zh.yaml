              缺的是判断这个故事到底有多耐久所需的数据。本次来源包中的公开来源没有披露
              NRR、GRR、流失、合同期限、续约或客户满意度指标。没有这些，无法判断从一个用例起步的客户是否会稳定扩张，大型项目是否持续，部署是否足够黏、足以支撑偏软件式的溢价收入假设。因此，本章必须把客户证明和留存证明分开：Bright
