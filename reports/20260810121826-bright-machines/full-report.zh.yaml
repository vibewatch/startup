companyProfile:
  summary: >-
    Bright Machines 是一家总部位于旧金山的工厂自动化公司，2018 年从 Flex Ltd 拆分出来。公司开发软件定义微型工厂——由其 Brightware AI
    软件平台驱动、模块化且可重新编程的机器人装配单元——用于自动化复杂电子制造。BlackRock、NVIDIA、Microsoft、Eclipse Ventures 和 Jabil 同时提供战略与财务支持，使 Bright
    Machines 站在 AI 基础设施扩建和先进制造自动化的交叉点。它的微型工厂装配 AI 服务器组件、数据中心设备、电池和其他复杂电子产品，并用基于计算机视觉的质检和自适应装配指令控制生产。
  foundedDate: '2018-01-01'
  founders:
    - name: Amar Hanspal
      role: 首席执行官
      background: 曾任 Autodesk 首席产品官；2018 年加入创始团队，并参与塑造 Bright Machines 早期商业化策略。
  foundingLocation: San Francisco, California, USA
  headquarters: San Francisco, California, USA
  productSummary: 面向电子制造的微型工厂硬件（带机器人臂和计算机视觉的模块化装配单元）加 Brightware 软件（AI 驱动的装配编程、错误检测、良率优化和质量检测）。
  customerFocus: 超大规模数据中心设备 OEM、AI 服务器制造商、消费电子品牌和医疗设备制造商；这些客户需要高混合度、高精度的自动化装配。
  businessModel: 销售资本设备，再叠加经常性软件订阅（Brightware、Smart Skills 和数据模块）；部分部署可能还包含 capacity-as-a-service 或代运营制造元素。
  stage: Series C (growth)
  fundingStatus: >-
    2024 年 6 月完成 $126M Series C 轮，由 BlackRock 领投，NVIDIA、Microsoft、Eclipse、Jabil 和 Shinhan Securities 参投；公开一手来源确认累计融资超过
    $400M，二级来源则常把 Bright Machines 描述为一家累计融资约 $600M+ 的公司。
