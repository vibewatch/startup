      - number: '1.4'
        title: 规模信号、客户证明与里程碑
        blocks:
          - type: paragraph
            body: >-
              Bright Machines 已有足够公开经营证据，阶段远不止概念。公司自己的里程碑显示，它从 2018 年的创立使命，走到首批微型工厂部署，再到 Brightware 集成、Series B
              资助下的客户扩张，最后在 2024-2026 年集中转向 AI 基础设施。官方披露从 2021 年超过 75 座微型工厂，推进到 2022 年超过 100 座微型工厂和 40 多家制造业客户，再到 2026
              年中超过 10 个国家、130 多座微型工厂和 60 多家客户。即便公司没有发布完整客户名单，这条轨迹仍然方向性很强。


              最好的具名证明点仍是跨垂直行业，而不是带有 hyperscaler 品牌背书的案例。DRW 用 Bright Machines 目标把 HIV 检测试剂盒产量提升 10 倍。Argonaut
              用公司方案自动化无菌生命科学装配流程。Viridi 选择 Bright Machines 在 Buffalo 数字化电池系统制造。这些案例重要，因为它们证明 Bright Machines
              能卖进受监管、任务关键的生产环境，而不只是消费电子。同时，公司的最新叙事已经明确围绕 AI 服务器、AI 机架和存储系统展开，说明数据中心基础设施已经从边缘垂直方向变成核心增长切入口。
