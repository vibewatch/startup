chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位、平台与商业模式
        blocks:
          - type: paragraph
            body: >-
              到 2026 年，Bright Machines 对外呈现的形象已经不太像传统自动化供应商，而更像服务 AI 和数据中心基础设施的新一代制造商。官网首页、LLM profile 页面和当前思想领导力文章都反复把
              Bright Factory 描述为这一模式的操作系统：上游做虚拟产品开发，产线上用 AI 驱动机器人装配，下游沉淀工厂智能数据。这个框架很关键，因为 Bright Machines
              被放在企业软件、机器人集成商和合约制造商之间，而不是完全落在其中某一类。


              从公开来源能看到的一句话商业模式，是设备部署、集成工作和经常性软件 / 数据模块的混合。Sacra 的公开分析称，Bright Machines 先销售 Bright Robotic Cells
              和工程服务，再长期通过 Brightware、Smart Skills 和分析应用变现。公司官方叙事也强调把制造搬近需求端，并压缩高价值电子产品从硅片到收入的路径。落到实践中，Bright Machines
              正用这套故事切入靠近 hyperscaler 的 AI 服务器、机架和存储系统；在这些场景里，设计迭代、可追溯性和良率比单纯最低人工成本的装配模式更重要。
