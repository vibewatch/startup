      - number: '3.3'
        title: 切换成本、多供应商策略与分销能力
        blocks:
          - type: paragraph
            body: >-
              一旦安装，Bright Machines 应该能受益于不低的切换成本。它的工艺逻辑、可追溯数据、机器人单元配置和质量流程，都比简单零件采购嵌得更深。但公司的锁定并非绝对。Vention 的开放硬件和编程姿态、广泛
              EMS 制造服务，以及在位控制系统生态，都给想避免单一全栈供应商的买方提供了多供应商路径。实际中，许多大型制造商可以拆解问题：一家做仿真，一家做机器人，一家做制造服务，内部团队负责质量编排。


              分销能力是更难补的缺口。Jabil、Flex、Sanmina 和 Celestica 已经有全球站点、成熟供应链和长期 OEM 关系。Siemens、Rockwell、ABB 和 KUKA
              则受益于买方熟悉的采购路径和支持组织。Bright Machines
              有战略投资人和伙伴关系，但公开证据没有显示它拥有可比的渠道优势。这不意味着它不能赢；而是意味着在更大的竞争对手复制足够多工作流、抹平差异化之前，公司必须靠集成结果和实施速度赢。
