      - CV018
      - CV025
      - CV034
      - CV035
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    description: 公开尽调中最关键变量对估值判断的方向性敏感度。
    data:
      xAxis: 驱动因素
      yAxis: 相对影响评分（0-10）
      items:
        - label: 经常性软件附加
          value: 10
          note: 这是最大摆动因素，因为它决定 Bright Machines 更像软件增强型公司，还是交付很重的自动化项目。
        - label: 客户集中度 / 续约质量
          value: 9
          note: 如果装机客户群过窄，或留存偏低，规模信号会很快贬值。
        - label: AI 基础设施资本开支持续性
          value: 8
          note: 需求依然强劲，但仍受超大规模云厂商预算和投产瓶颈牵引。
        - label: 毛利率轨迹
          value: 8
          note: 毛利率能否得到验证，决定溢价估值能否撑过后续轮次。
        - label: 股权结构 / 债务条款
          value: 7
          note: 优先权和契约条款可能显著改变新投资人的上行空间。
    sourceRefs:
      - SV014
      - SV015
      - SV013
    claimRefs:
