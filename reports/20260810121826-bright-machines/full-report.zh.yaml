        - BlackRock、NVIDIA、Microsoft、Jabil、Eclipse 和 J.P. Morgan 参与了近期多轮融资。
        - 如果参投主要出于防守，或经济性撑不起后续支持，相关性就会下降。
      - - 商业规模真实
        - 130+ 座微型工厂、60+ 个客户、300k+ 台服务器，加上更早的收入和部署证明。
        - 若拿到当前 cohort 经济性和续约指标，判断会明显增强。
      - - 软件定义栈有机会拿到溢价
        - 从设计到可追溯的整栈，比单台机器人或集成商项目更值钱。
        - 需要证明经常性软件和数据绑定能拉动毛利改善。
      - - 混合工业模式压住软件式定价
        - 硬件、服务和实施工作在公开模式中仍然可见。
        - 若披露显示软件占比和续约质量已占主导，这条反方会减弱。
      - - 价格发现仍不透明
        - 没有确认的 2024 年投后估值；公开信息只有零散追踪器引用和过时的 SPAC 历史。
        - 一旦披露清晰轮次条款、股权结构细节和当前 KPI，判断会立刻改善。
