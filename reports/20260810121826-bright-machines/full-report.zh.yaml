  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律和政策风险
        blocks:
          - type: paragraph
            body: >-
              Bright Machines 的法律和政策风险画像，更多由证据缺失决定，而不是由某个丑闻决定。公司所处制造环境越来越受 OT
              网络安全要求、出口管制、数据主权规则和安全预期影响，但公开来源包没有展现成熟的外部合规材料。IDC 的 2026 年 AI 基础设施研究特别强调出口管制和主权压力；Bright Machines
              自己关于工厂基础设施的文章，也把网络安全和数据治理列为基础。这个组合很关键：公司显然意识到风险面，但公开证据没有显示信任或监管叙事已经闭环。


              诉讼和正式执法也要同样谨慎。抓取来源没有明确暴露诉讼、召回或执法记录，但这不等于健康证明。它只说明公开包无法正反验证。尽调里的实用法律判断很直接：Bright Machines
              没有显著红旗标题，但公开合规证据也不足以把法律、安全或监管不确定性从投资案例中拿掉。
