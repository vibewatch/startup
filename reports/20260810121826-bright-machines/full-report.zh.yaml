      - number: '6.5'
        title: 扩张上行真实存在，但集中度风险仍未解决
        blocks:
          - type: paragraph
            body: >-
              让 Bright Machines 吸引客户的同一组事实，也带来集中度风险。AI
              基础设施项目具有战略价值，规模可能很大，买方资金也充足；这意味着少数账户可能会过度重要。公开证据无法让投资者排除这一点。事实上，更谨慎的判断恰恰相反：披露客户数量不算大、当前 AI
              硬件客户很少具名、没有分业务收入结构，全部指向需要谨慎。超大规模云厂商资本开支带来的市场顺风有助于形成客户，但也提高了对资本开支周期波动，以及对议价能力很强的渠道伙伴或 OEM 的暴露。


              这让 Bright Machines
              落在一个熟悉、但仍可投资的位置。公司似乎有真实采用、真实工作流覆盖面，也有可信的扩张路径。只是公开留存和集中度数据不足，无法把这些优势承销为耐久收入质量。因此，客户尽调需要从客户名称和部署计数往前走，进入收入占比、续约行为、伙伴依赖，以及较早跨垂直项目与较新
