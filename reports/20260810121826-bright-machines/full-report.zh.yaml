              限制在于近度和具体度。最新 AI 基础设施证明大多是汇总口径——客户数、服务器数、Hybrid BRC 可用性——而不是完全具名的当前超大规模云厂商或 OEM
              引用。这不会推翻规模叙事，但也意味着，在当下最战略性的客户细分上，最好的公开证据没有较早跨垂直案例那么具体。按尽调语言说，Bright Machines 在「使用证明」上最强，在「当前旗舰账户质量证明」上较弱。
