  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接、相邻、在位与替代竞争格局
        blocks:
          - type: paragraph
            body: >-
              理解 Bright Machines 的竞争集合，最好按类别，而不是找一个镜像创业公司。公司显然要面对 Siemens、Rockwell、ABB 和 KUKA
              等工业在位者；这些公司已经掌握制造预算，并有深厚服务覆盖。它也要面对 Flex、Jabil、Sanmina 和 Celestica 等 EMS 与制造巨头；这些公司正在把 AI
              基础设施制造能力产品化。最后，它还要面对 Vention、Machina Labs 等软件形态或相邻挑战者，以及人工装配、内部工程和合约制造商变通方案这些现状替代。


              这组对手重要，因为 Bright Machines 本身夹在多个类别之间。它比机器人臂供应商更纵向整合，比广义工业软件公司更贴近制造场景，又远小于服务 hyperscaler 和 OEM
              的大型合约制造商。竞争因此是不对称的：在位者可以在关系和支持上火力更强，模块化平台可以用开放性和 ROI 简洁性抢叙事，EMS 对手可以用大得多的产能销售同一波 AI 硬件需求。Bright Machines
              的任务，是证明它把设计智能、机器人执行和可追溯性揉成统一层后，值得客户整体购买，而不是逐块采购。
