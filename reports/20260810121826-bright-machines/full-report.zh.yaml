      - number: '3.2'
        title: 能力、包装和买方适配对比
        blocks:
          - type: paragraph
            body: >-
              从能力看，任务需要紧密耦合的设计阶段可制造性、复杂机器人、检测和序列化生产追溯时，Bright Machines 最强。这不同于 ABB 或 KUKA 销售广泛机器人目录，也不同于 Rockwell 和
              Siemens 销售工业 AI 与数字孪生平台，更不同于大型 EMS 公司销售全球制造执行和产能。Vention 是最有信息量的现代参照，因为它也营销全栈硬件 /
              软件自动化平台，但其公开叙事覆盖更广的工厂自动化，并且在 ROI 上更透明。Machina Labs 与 Bright Machines 差异更大，它用 physical AI
              主题切入敏捷金属成形和低量制造，而不是聚焦 AI 服务器和电子产品。


              包装和定价可见度更有利于挑战者，而不是 Bright Machines。Vention 发布具体性能和 ROI 信号。Bright Machines 和在位者以及多数 EMS
              供应商一样，仍是按报价销售。这在企业制造里很常见，但会让公开对比更难，也可能掩盖供应商到底是靠真正的软件差异化赢，还是靠打包项目经济性赢。实际结论是，单看功能对比不会决定结果；买方适配、已安装关系和部署模式与原始能力广度同样重要。
