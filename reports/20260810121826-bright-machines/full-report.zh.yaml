      - number: '4.5'
        title: 财务结论：经营活动可信，投资判断材料不完整
        blocks:
          - type: paragraph
            body: >-
              公开财务图景轮廓强、精度弱。Bright Machines
              显然有混合业务、真实客户、重要的历史资本支持，以及可以支撑持续需求的市场背景。公司也不是躲在纯概念话术后面：它谈收入时间、较低成本、本地化先进制造和真实生产规模。这些是一家真实业务的要素，而不是一个未产生收入的研究项目。


              但最重要的投资判断输入仍在私域。没有公开 ARR，没有当前收入，没有毛利率拆分，没有 burn 或 runway，没有客户集中度，也没有可信的公开续费数据。因此，本章的实际结论偏谨慎。Bright
              Machines
              可以被视为财务上可信、商业上活跃，但还不能被视为一家定价合理或资本效率已验证的成长公司。它是否值得享受溢价估值，最取决于一个私人问题：今天业务中有多少是挂在已部署微型工厂上的经常性高毛利软件，又有多少是质量较低的部署和制造服务收入。
