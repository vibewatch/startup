        title: 架构与运行流程
        blocks:
          - type: paragraph
            body: >-
              Bright Machines 的架构公开信息足够具体，可以描述系统如何在实践中运转。Bright Designer 把 CAD
              和相关产品数据转换为可用于生产的模型，公司称这些模型会在实体部署前通过仿真测试和优化。在车间，Bright Robotic Cells 执行装配任务，Smart Skills
              处理视觉、空间和力感知执行。工厂智能随后把产生的工艺数据、质量证据和工作流记录汇入一条可追溯的数据线索。用产品语言说，这是一套数字优先制造闭环，而不是传统自动化产线。


              具体案例强化了这些工作流主张。DIMM 视频聚焦协同视觉、机器人和力控；主板案例强调围绕节拍时间和良率标准构建的无接触装配；physical AI 文章描述了如何把模型输出包进监控和 fallback
              逻辑，而不是盲目信任。这个细节层级支撑了可信的运行模型。它不能证明可靠性指标，但能显示 Bright Machines 对架构的表达映射到真实制造任务和异常处理，而不是泛泛的「AI-powered」信息。
