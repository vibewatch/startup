      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              采用逻辑建立在四个强驱动上。第一，AI 硬件复杂度上升速度超过传统产线工程方法的吸收能力，让数字优先验证和软件可配置自动化更有价值。第二，劳动力短缺和技能缺口仍然重要：IFR 在 2026
              年明确强调劳动力缺口，而 Bright Machines 的回流制造文章认为，本地 AI 硬件装配需要现代自动化来抵消昂贵或稀缺劳动力。第三，区域化和本土产能投资是真实顺风；Jabil 计划在美国扩张
              $500M，证明在位企业也看到了持久的回流制造机会。第四，Microsoft、NVIDIA 和其他伙伴推动 AI 生态扩展，帮助强化周边需求环境的可信度。


              约束同样真实。Bright Machines 自己的 ROI 文章称，一旦回收期拉长到三年以上，审批会更难，还可能被需求不完整、需求波动或新产品版本拖垮。IDC
              还加入外部瓶颈，例如电力可用性、内存和存储短缺、出口管制，以及 x86 与 ARM 之间的架构变化。IFR 提出另一层约束：随着 AI
              自主化和云连接机器人扩散，安全、网络安全、责任归属和可解释性会更重要。因此，Bright Machines 受益于巨大的市场浪潮，但它卖进的仍是工业技术里最难的采购环境之一。
