      - number: '1.2'
        title: 管理层、治理与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              和许多私营工业公司相比，Bright Machines 的管理层可见度明显更好，但重要的交接风险仍在。公司当前官方资料显示，Lior Susan 是联合创始人兼董事长，Sviat Dulianinov 是
              CEO，Fiaz Mohamed 是总裁兼首席增长官。这意味着公司已经明确走出早期报道中的 Amar Hanspal 时代。公开记录里最大的治理事件仍是 2021 年 12 月那次调整：Hanspal
              离任，Lior Susan 出任临时 CEO，公司同时终止与 SCVX 的 SPAC 合并。这一组合不能证明经营疲弱，但说明 Bright Machines 已经在公开视野里调整过领导层和融资策略。


              董事会可见度是部分而非完整的。公司披露确认 Glenda Dorchak 是董事，并列出 Susan、Carl Bass、Stephen Luczo 和 Hanspal
              等历史董事，但公开来源没有披露委员会结构、投资人控制权，或一份当前完全核对过的董事会名单。因此，关键人依赖仍然有分量：Susan 牵住战略资本关系，Dulianinov 是公司转向 AI 基础设施阶段的公开
              CEO，而公司尚未发布可与上市公司相比的完整治理包。
