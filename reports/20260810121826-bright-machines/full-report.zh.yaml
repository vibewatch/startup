      - number: '1.5'
        title: 封面指标、外部认可与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              第一章的封面指标有方向性价值，但对投资判断仍不完整。Bright Machines 能支撑旧金山总部、2018 年成立、员工超过 200 人、微型工厂超过 130 座、覆盖 10 多个国家、截至 2026 年拥有
              60 多家客户等表述。它也能支撑大额融资历史和知名战略投资人。World Economic Forum Technology Pioneer 身份和多次制造 AI
              奖项等认可信号进一步说明，公司在工业技术圈并不边缘。


              缺的恰好是多数成长投资人下一步最想要的东西：新的估值、当前收入
              run-rate、经审计的毛利率证据，以及对累计资本栈更清楚的解释。即便是公开融资记录也需要核对，因为官方累计金额和具名轮次的算术结果并不完全对齐。收入只有一个带日期的公开数据点——Amar Hanspal
              时期前两年超过 $30M——对 2026 年决策已经陈旧。这一组合导向清晰的第一章判断：Bright Machines
              有真实规模信号和可信战略背书，但只靠公开证据，还不足以在没有数据室的情况下支撑价格、毛利质量或资本效率判断。
