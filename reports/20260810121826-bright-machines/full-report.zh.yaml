      - number: '2.2'
        title: 市场规模口径与矛盾
        blocks:
          - type: paragraph
            body: >-
              围绕 Bright Machines 的外部市场信号无疑很大。IDC 2026 年 7 月更新把 Q1 AI 基础设施支出定为 $89.7B，并把 2026 全年预测上调到 $497B；TrendForce
              则估计，随着 AI 建设加速，前九大云服务提供商 2026 年资本开支将超过 $886.7B。TrendForce 还把 2026 年 AI 服务器出货增长预期上调到接近 31%，服务器总出货量增长
              12.8%。仅日本 AI 基础设施市场，预计 2026 年也会在三年增长七倍后超过 $5.5B。


              但这些数字不能互相替换。IDC 衡量基础设施支出，TrendForce 加入 hyperscaler 资本开支口径，Bright Machines 引用网络设备相邻市场，IFR
              衡量工业机器人市场价值。每个口径都有助于理解需求为什么存在，但没有一个直接说明 Bright Machines 的准确收入池。因此，本章保留相互矛盾的估算，而不是强行压成一个
              TAM。公司的真实捕获切入口远窄于数据中心总资本开支，又略宽于单个机器人工位：它位于复杂硬件装配、数字化可制造性和 AI 基础设施紧迫性重叠的地方。
