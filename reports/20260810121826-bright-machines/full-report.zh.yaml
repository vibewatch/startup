              剩下的工作异常聚焦。投资者不需要再做一轮宽泛市场研究来判断 Bright Machines
              是否有意思；市场顺风和产品相关性已经可见。现在关键是公司的经济性是否支撑为这种相关性支付溢价。第一类尽调是商业质量：当前收入、ARR
