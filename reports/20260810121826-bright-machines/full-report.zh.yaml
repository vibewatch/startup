        title: 公开牵引力信号偏运营，不是会计口径
        blocks:
          - type: paragraph
            body: >-
              公开市场进入证据中最清楚的是生态驱动和运营信号。Bright Machines 与 Microsoft Azure 的合作明确瞄准 OEM、ODM
              和合约制造商，说明销售动作把直接企业销售和伙伴辅助触达结合在一起。这一姿态也暗示销售效率可能好于冷启动式外勤模型，但公开来源没有量化伙伴贡献订单或销售周期。Bright Machines
              自己的经济语言强调收入时间和部署加速，而不是回收期表或 CAC 指标。


              牵引力看得见，只是不是投资人通常想要的形式。到 2026 年中，外部报道和公司相关公告引用了 130 多座微型工厂、60 多家客户和超过 300,000 台已生产服务器；2024 年来源仍提到员工超过 200
              人。这些是商业活动和组织规模的有意义信号。但它们不是 ARR、GAAP 收入或留存。即便公司唯一的历史收入数据点——前两年超过 $30M——也太旧，只能证明 Bright Machines 在当前 AI
              基础设施热潮前很早就已经产生真实收入。
