      - number: '1.3'
        title: 融资历史、投资人和资本结构模糊性
        blocks:
          - type: paragraph
            body: >-
              对一家工业自动化创业公司而言，Bright Machines 的融资历史异常庞大，但公开来源并不完全干净。TechCrunch 记录了 2018 年创立时的 $179M Series A，当时已经绑定 Flex
              拆分叙事和 Eclipse 的支持。公司随后在 2022 年宣布一笔 $132M 融资包，包括 $100M Series B 股权，以及来自 Silicon Valley Bank 和 Hercules 的
              $32M 债务。2024 年 6 月，公司又宣布 $126M Series C，其中 $106M 为 BlackRock 管理基金领投的股权，另有 J.P. Morgan 提供的 $20M
              风险债务，NVIDIA、Microsoft、Eclipse、Jabil 和 Shinhan Securities 参投。


              模糊点在累计金额。Bright Machines 说 2022 年融资后累计募集资本达到 $330M，而 2024 年融资公告又称累计资本超过 $400M。简单相加 2018、2022 和 2024
              年具名轮次，至少得到
              $437M，意味着具名轮次记录之外可能还有更早资本，或各次公告的纳入口径不同。这并不推翻融资故事，但恰恰是尽调在判断稀释、清算优先级或当前估值前必须核对的股权结构问题。公开来源也无法确认公司口径的 2026
              年估值，使价格发现主要依赖二级市场追踪器和评论。
