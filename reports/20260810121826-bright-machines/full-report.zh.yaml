  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              不能把 Bright Machines 放进整个工厂自动化宇宙里估值。它的公开材料一直定义的是一个更窄的问题：AI
              服务器、存储、网络设备和其他高价值电子产品的复杂后端装配；这些产品变体变化快、可追溯性重要，人工流程还会制造返工风险。这个边界比泛泛的机器人叙事更紧，但又比单一机器视觉或机器人臂组件销售更宽。公司想占住的是软件定义装配层：上游做设计验证，产线上执行机器人作业，每次生产后沉淀生产智能。


              这一区分重要，因为 Bright Machines 替代的现状并不只是「没有自动化」。它替代的是人工装配、高度定制的单用途产线，以及设计方、合约制造商和质量系统之间碎片化交接的组合。公司自己的 AI
              backbone 和回流制造材料认为，AI 硬件越复杂，制造商又想用更少的劳动力冗余扩大本地生产时，这些旧方法就会失效。Sacra 从外部给出的框架也强化同一点：Bright Machines
              是一个窄但可能很有价值的切入口，嵌在更大的制造支出池里，而不是声称吃下全部工业自动化预算。
