      - number: '2.5'
        title: 尽调缺口与投资判断影响
        blocks:
          - type: paragraph
            body: >-
              市场证据足以支撑严肃的需求论点，但不足以支撑精确测算。Bright Machines 显然站在正确水流里：AI 基础设施支出扩张，hyperscaler
              激进建设，机器人仍是劳动力和质量问题的活跃解法，在位企业也都在增加产能或工业 AI 层。这意味着公司不需要发明市场。真正的尽调工作在更底层：Bright Machines 到底在这个巨大支出池里的哪里赢，跨
              OEM、hyperscaler 和合约制造商的动作有多可复制，预算权又有多少掌握在运营团队手里，而不是企业战略或供应链项目手里？


              公开来源还留下三个对估值重要的缺口。没有精确的 Bright Machines 专属 TAM/SAM/SOM 模型，没有 AI
              服务器装配环节的公开份额估计，也没有从试点到量产转化的公开视图。这些不是修饰性遗漏。它们决定公司该被估为广义 AI 基础设施受益者、较窄但质量更高的软件和可追溯性层，还是一个借临时 AI
              支出强度起飞的资本密集型项目业务。正确方法是保留相互矛盾的规模口径，把捕获切入口视为受限，并在把今天有利的市场背景外推成长期可防守收入前，要求公司提供内部漏斗证据。
