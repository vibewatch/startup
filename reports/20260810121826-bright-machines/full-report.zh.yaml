        title: 客户群分层与用例广度
        blocks:
          - type: paragraph
            body: >-
              Bright Machines 的公开客户群，比当前 AI 基础设施品牌叙事初看更分散。官方和伙伴材料显示，公司卖给 OEM、ODM、合约制造商，以及靠近 hyperscaler
              的硬件生产商；但实际证明集合横跨许多终端用途类别：医疗诊断、生命科学、电池系统、网络和无线硬件、汽车电子模块、媒体枢纽、消费设备和安全产品。这种广度有战略价值，因为它显示公司并不局限于单一 demo
              工作流或一个脆弱垂直行业。


              同时，客户故事已经明显迁移到 AI 基础设施。公司当前语言强调服务器、存储、机架和「AI backbone」，说明今天经济价值最高的客户可能不同于较早的具名客户集合。含义是 Bright Machines
              现在并行运行两套客户叙事：较早的具名跨垂直行业证明，以及较新的聚合式 AI 基础设施规模证明。两者都重要。前者证明买方为真实部署付过钱；后者显示管理层现在认为最高价值的客户扩张在哪里。
