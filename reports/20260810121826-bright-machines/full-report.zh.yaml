        title: 运营、质量和网络安全风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，Bright Machines 正在攻市场上最难的制造问题之一：高混合、高价值、快速变化的 AI
              硬件组装。上行空间很大，但故障模式也层层叠加。公司自有内容承认了停机、性能不一致、产能转移风险，以及模型遇到边缘案例时需要回退逻辑。Hybrid BRC
              尤其有说明力，因为它证明产品还不是「设好就忘」的自主工厂；部分工作流仍需要受控人工介入，才能守住质量和吞吐。


              外部证据让风险图景更复杂。IDC 强调 AI 基础设施部署面临电力和组件约束，IFR 则提示 OT 网络安全和劳动力短缺。合在一起，实际风险命题是：Bright Machines
              即便在产线层面执行不错，仍可能被宏观瓶颈、人员缺口或多站点铺开问题拖住。公司看起来有严肃的缓释手段——仿真、可追溯、回退逻辑——但公开证据仍没有给出硬的事故率或正常运行时间披露。因此，运营风险仍是权重最高的尽调类别之一。
