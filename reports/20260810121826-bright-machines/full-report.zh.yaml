        blocks:
          - type: paragraph
            body: >-
              支撑溢价估值的逻辑并不复杂。Bright Machines
              卖的不只是机械臂或集成项目。其公开材料描述的是一套软件定义制造栈，覆盖自动化组装设计、模块化机器人单元、计算机视觉、序列化质量记录和工厂智能工具。它还正对 AI
              基础设施建设扩张；在这个市场里，延误代价高，可追溯价值异常大。与 Microsoft 的战略伙伴关系，以及与 NVIDIA
              主导的基础设施周期对齐，增加了分销和品类相关性。如果管理层能证明装机基础会复合成经常性软件和数据收入，Bright Machines 的估值可能显著高于普通自动化集成商。


              限制溢价的因素同样重要。公开记录仍更像混合型工业业务：硬件部署、工程工作和经常性软件，而不是纯经常性订阅引擎。ABB、Flex、Jabil、Foxconn、Sanmina
