      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Bright Machines 的买方生态横跨不止一种客户。Microsoft/Azure 合作和 Sacra 的商业模式框架都指向 OEM、ODM、合约制造商，以及靠近 hyperscaler
              的生产商；这些才是最相关的采购组织。在这些账户里，直接用户很可能是工业工程师、产线操作员、工艺工程师和质量团队，付款方通常是制造资本开支或运营改善预算。最终预算所有者更高层：制造副总裁、运营副总裁、COO，或负责新产品爬坡和质量的业务单元负责人。


              公司的当前信息也能看出采用路径。Bright Machines
              越来越把故事起点前移到产线建成之前，用仿真和数字化表达更早暴露设计与排序问题。这意味着销售动作从可制造性痛点开始，进入试点设计和产线架构，再落到生产部署以及经常性软件 / 数据使用。Hybrid BRC
              公告提供了一个有用的现实校验：即便在软件定义工厂里，一些高价值 AI 硬件步骤仍然需要人工介入。这让产品锚在实际部署上，而不是只停留在营销式自主化。
