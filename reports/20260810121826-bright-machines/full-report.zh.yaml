      - number: '4.3'
        title: 软件挂载应改善成本结构，但部署拖累仍然存在
        blocks:
          - type: paragraph
            body: >-
              Bright Machines
              很可能处在工业科技经济性最难的中间地带。它比拥有全部工厂资产或端到端制造完整产品的制造商更轻，但比纯云软件供应商更重。公开来源不断强调本地化生产、机器人部署、仿真、质量检测和可落地的工厂基础设施。这些能力创造价值，但也意味着客户工程、实施成本，以及围绕硬件模块和部署的一定营运资本负担。


              模型里毛利更好的那一侧同样可见。产线上线后，Bright Machines 的软件、Smart Skills、Data Hub
              和应用层应该能更干净地扩张；公司自己的信息也反复把数据和软件描述为性能持续复利改善的来源。未解决的问题是收入结构。如果每座微型工厂都强力挂载经常性软件并随时间扩张，毛利率可以明显改善。如果部署仍然高度定制或服务占主导，合并经济性可能比软件标题暗示的更像项目制。今天的公开证据无法判定这一区别。
