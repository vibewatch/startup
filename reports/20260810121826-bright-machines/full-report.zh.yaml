  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型看得清，实际定价仍不透明
        blocks:
          - type: paragraph
            body: >-
              Bright Machines 的公开材料支持的是混合收入模型，而不是一个整齐的 SaaS 故事。LLM profile、官方公司页面和 Sacra
              的分析都指向同一方向：客户购买的是机器人单元、工程和部署工作，再加上叠在其上的经常性软件或数据模块。对 Bright Machines 想解决的问题而言，这样的经济模型说得通。复杂 AI
              硬件装配不是纯软件工作流；它需要实体部署、工艺工程、检测和持续优化。


              公开证据没有给出的是定价瀑布。Bright Machines 销售的是经济结果——更快收入转化、更低总成本、更高可靠性——但不发布标准合同价格。Sacra 公开估计每条产线应用软件约 $150,000 /
              年，这有方向性价值；同一分析也暗示长期 land-and-expand 层有意义，但这些仍不是实际合同数据。因此，关键财务判断是混合的：Bright Machines
              的模型里很可能嵌入了经常性软件经济性，但公开证据还不能说明，今天收入质量中有多少来自软件续费，又有多少来自服务密集型部署工作。
