      - CV027
      - CV035
      - CV042
      - CV043
      - CV044
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    description: 截至 2026 年 8 月，基于公开证据的 Bright Machines 估值情景区间。
    data:
      items:
        - label: 悲观情景
          low: 600
          high: 900
          unit: USD millions
          note: 服务占比过高、客户集中或融资压力，会把价值压到此前跟踪参考值以下。
        - label: 基准情景
          low: 1000
          high: 1400
          unit: USD millions
          note: 战略价值和 2026 年规模支撑低个位数十亿美元左右的公允价值，但不足以拿到纯软件溢价。
        - label: 乐观情景
          low: 1800
          high: 2800
          unit: USD millions
          note: 经常性软件附加、AI 基础设施份额强劲，以及作为战略标的的稀缺性，支撑更高溢价。
        - label: 历史 SPAC 锚点
          low: 1600
          high: 1600
          unit: USD millions
          note: 2021 年披露的交易锚点；这里只作背景，不代表当前估值标记。
        - label: 跟踪参考值
          low: 938
          high: 938
          unit: USD millions
          note: 二级市场 / 分析师参考点；信息不透明，且不是公司的一手披露。
