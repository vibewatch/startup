  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公司质量判断偏正面，但价格上保持谨慎
        blocks:
          - type: paragraph
            body: >-
              Bright Machines 通过了成长阶段工业科技投资最重要的第一道筛选：它显然是真公司。公司反复融到大额资金，点名一线战略投资者，展示在线产品演进，如今又披露了难以伪造的部署活跃度。2026
              年记录显示，微型工厂超过 130 个、客户超过 60 家、已生产服务器超过 300,000 台，这意味着 Bright Machines
              应被视为已有规模的商业平台，而不是实验室阶段的机器人概念。这一点重要，因为私营工厂自动化公司的估值讨论常把早期承诺和运营证明混在一起；Bright Machines 的证明比多数公司更多。


              谨慎点是价格，不是公司是否存在。公开证据仍没有披露当前
              ARR、毛利率、客户集中度、软件附着、烧钱，或决定新投资者买到的是复合软件层还是增量经济性较弱的资本密集型部署业务的股权结构条款。这个缺口足以阻止在未知价格或溢价价格上给出明确买入。实用建议因此是跟踪：保持接近，把公司留在主动名单上；只有融资流程提供证据，证明经常性软件层足够真实、能支撑溢价倍数时，才行动。
