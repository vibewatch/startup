      - number: '4.4'
        title: 历史资本支持可核验，当前资金充足性不可核验
        blocks:
          - type: paragraph
            body: >-
              Bright Machines 的历史资本基础容易核验，但当前现金状况不是。公司正式披露了 2022 年 $132M 融资包和 2024 年 $126M Series C，TechCrunch 也记录了更早的
              $179M 创始轮。2024 年公告还称累计募集资本超过 $400M。SEC 搜索结果增加了一个有用的监管锚点：Bright Machines 在 EDGAR 中的 CIK 为 0001741724，公开
              Form D 列表显示至少有一份 2022 年豁免发行备案。因此，融资记录看起来真实、庞大且连续。


              但这仍不足以判断当前资金是否充足。资本结构既有股权也有债务，2022 年融资包中附带 $32M 债务，2024 年又有 $20M 风险债务。公开来源没有披露当前现金余额、月度 burn、契约条款或
              runway。这意味着投资人可以得出 Bright Machines 已募集足够资本打造严肃平台的结论，但不能判断公司今天是否资金充裕、是否接近下一轮融资，或是否在债务约束下运营。
            claimRefs:
