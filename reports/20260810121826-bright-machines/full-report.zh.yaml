  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块图谱
        blocks:
          - type: paragraph
            body: >-
              到 2026 年，Bright Machines 卖的不是单个机器人，也不是通用工厂仪表盘。它的公开产品定义是 Bright
              Factory：一个智能制造平台，把设计、自动化和数据连起来，帮助客户更快、更灵活、以更严格质量控制制造 AI 硬件和其他复杂电子产品。栈通常被描述为三层——虚拟产品开发、AI
              驱动机器人、工厂智能——三者合在一起构成公司的主模块图谱。这个框架很重要，因为它把 Bright Machines 呈现为一种运营模型，而不只是一台设备。


              模块层面的故事也比概念 deck 更成熟。Bright Designer 似乎负责上游数字化可制造性和仿真；Bright Robotic Cells 和 Smart Skills
              在车间执行装配、检测和可适应的机器人任务；数据层则捕获工艺和产品记录，用于质量与优化。公开 demo 界面和部署故事展示的是具体工作流，而非纯愿景，包括主板、DIMM 和 AI
              基础设施装配用例。仍然缺失的是正式发布的 SKU 或版本图谱，因此成熟度必须从反复出现的产品表面推断，而不是来自明确的发布线文档。
