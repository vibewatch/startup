  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: win-rate
    missingEvidence: Named head-to-head wins and losses against incumbents, Vention-like platforms, and EMS alternatives by segment.
    whyItMatters: Without competitive win/loss data, it is hard to know whether Bright Machines is truly taking share or simply participating in a fast-growing market.
    diligencePath: Request pipeline win/loss analyses, displacement reasons, and competitor mentions from CRM and board materials.
    relatedQuestionRefs:
    - QP024
    - QP026
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: channel-power
    missingEvidence: A public or private channel map showing where Bright Machines has exclusive access, captive partners, or structurally advantaged distribution.
    whyItMatters: Competitive durability depends as much on distribution as on product features, and current public evidence favors incumbents on channel reach.
    diligencePath: Request channel-contribution data, partner agreements, and coverage by geography/vertical.
    relatedQuestionRefs:
    - QP022
    relatedTableRefs:
    - TP001
    - TP004
  - type: enumeration-incomplete
    severity: minor
    topic: status-quo-alternatives
    missingEvidence: A ranked list of internal-build, system-integrator, and contract-manufacturing substitutes from actual Bright Machines deal cycles.
    whyItMatters: The landscape covers visible external competitors well but only indirect evidence on internal-build substitutes.
    diligencePath: Review recent lost-deal analyses and procurement alternatives used by prospects.
    relatedQuestionRefs:
    - QP001
    - QP020
    relatedTableRefs:
    - TP001
