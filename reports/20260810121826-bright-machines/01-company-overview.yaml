- id: leadership-and-governance
  title: Leadership, Governance, and Key-Person Dependence
  body: 'Leadership visibility is materially better than many private industrial companies, but it still contains important transition risk. Bright Machines’ current official profile identifies Lior Susan as co-founder and chairman, Sviat Dulianinov as CEO, and Fiaz Mohamed as President and Chief Growth Officer. That means the company has clearly moved beyond the Amar Hanspal era described in older coverage. The biggest governance event in the public record remains the December 2021 transition in which Hanspal stepped down, Lior Susan became interim CEO, and the company simultaneously terminated its SPAC combination with SCVX. That combination does not prove operational weakness, but it does show Bright Machines has already had to adjust both leadership and financing strategy in public view.


    Board visibility is partial rather than comprehensive. Company disclosures identify Glenda Dorchak as a director and list historical directors including Susan, Carl Bass, Stephen Luczo, and Hanspal, but public sources do not disclose committee structure, investor control rights, or a current fully reconciled board roster. Key-person dependence is therefore still meaningful: Susan anchors strategic capital relationships, Dulianinov is the public CEO during the AI-infrastructure pivot, and the company has not published a robust governance package comparable to a public issuer.'
