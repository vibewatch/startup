  topStrengths:
    - Strategic investors such as NVIDIA, Microsoft, BlackRock, Eclipse, and Jabil validate Bright Machines' AI infrastructure use case.
    - The software-defined approach should enable faster reprogramming than traditional hard automation.
    - Bright Machines is riding a secular AI data center build-out that requires specialized hardware assembly and traceability.
    - Public 2026 scale signals — 130+ microfactories, 60+ customers, and 300,000+ servers produced — suggest real commercial traction.
  topRisks:
    - Long sales cycles and capital-intensive microfactory deployments can slow revenue conversion and margin expansion.
    - Bright Machines competes against ABB, Flex, Jabil, Sanmina, and other incumbents with larger installed bases and service footprints.
    - Financial metrics, software attach rate, and path to profitability remain undisclosed.
    - Customer concentration risk could be material if hyperscaler or AI-server spending slows.
  unresolvedGaps:
    - Revenue, ARR, gross margin, and burn trajectory are not publicly disclosed.
    - Unit economics of microfactory deployments versus recurring software are still unclear.
    - Customer concentration, renewal quality, and software attach by cohort remain unknown.
    - Current post-Series-C valuation and cap-table preference terms are not formally disclosed.
