companyProfile:
  summary: Bright Machines is a San Francisco-based factory automation company that spun out of Flex Ltd in 2018. The company develops software-defined microfactories — modular, reprogrammable robotic assembly cells guided by its Brightware AI software platform — to automate complex electronics manufacturing. With strategic and financial backing from BlackRock, NVIDIA, Microsoft, Eclipse Ventures, and Jabil, Bright Machines sits at the intersection of the AI infrastructure build-out and advanced manufacturing automation. Its microfactories assemble AI server components, data center equipment, batteries, and other complex electronics with computer-vision-based quality inspection and adaptive assembly instructions.
  foundedDate: '2018-01-01'
  founders:
    - name: Amar Hanspal
      role: CEO
      background: Former Chief Product Officer at Autodesk; joined the founding team in 2018 and helped shape Bright Machines' early commercialization strategy.
  foundingLocation: San Francisco, California, USA
  headquarters: San Francisco, California, USA
  productSummary: Microfactory hardware (modular assembly cells with robotic arms and computer vision) plus Brightware software (AI-driven assembly programming, error detection, yield optimization, and quality inspection) for electronics manufacturing.
  customerFocus: Hyperscale data center equipment OEMs, AI server manufacturers, consumer electronics brands, and medical device makers requiring high-mix, high-precision automated assembly.
  businessModel: Capital equipment sale plus recurring software (Brightware, Smart Skills, and data modules) subscriptions; capacity-as-a-service or operated-manufacturing elements may exist for some deployments.
  stage: Series C (growth)
  fundingStatus: '$126M Series C (June 2024) led by BlackRock with NVIDIA, Microsoft, Eclipse, Jabil, and Shinhan Securities; public primary sources confirm >$400M raised, while secondary sources often frame Bright Machines as a ~$600M+ funded company.'
