- calloutType: strength
  title: The demand wave is real even if Bright Machines captures only a small slice
  body: IDC, TrendForce, and IDC Japan all point to a durable AI-infrastructure expansion cycle. Bright Machines does not need to own all of that spend to benefit; it only needs a defensible wedge inside the most automation-constrained assembly steps.
  claimRefs:
  - CM011
  - CM013
  - CM017
  - CM041
- calloutType: risk
  title: Capex approval and deployment readiness are the real choke points
  body: Bright Machines’ own ROI material makes clear that projects get harder to approve once payback drifts past three years, and that requirements gaps or product changes can quickly erode economics. Public market growth alone does not solve that conversion problem.
  claimRefs:
  - CM027
  - CM028
  - CM032
- calloutType: assumption
  title: Treat total AI-infrastructure spend as context, not as Bright Machines TAM
  body: The chapter uses IDC, TrendForce, and adjacency lenses to define the environment, but those figures are much larger than the specific software-defined assembly wedge Bright Machines can monetize directly.
