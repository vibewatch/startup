- id: diligence-gaps-and-underwriting-implications
  title: Diligence Gaps and Underwriting Implications
  body: 'The market evidence is good enough to support a serious demand thesis, but not enough to underwrite precision. Bright Machines clearly sits in the right current: AI infrastructure spending is expanding, hyperscalers are building aggressively, robotics remains a live labor and quality solution, and incumbents are all adding capacity or industrial-AI layers. That means the company does not need to invent the market. The real diligence work is lower in the stack: where inside that huge spend pool does Bright Machines actually win, how repeatable is the motion across OEMs versus hyperscalers versus contract manufacturers, and how much budget authority sits with operations teams versus corporate strategy or supply chain programs?


    Public sources also leave three gaps that matter for valuation. There is no precise Bright Machines-specific TAM/SAM/SOM model, no public share estimate in AI-server assembly, and no public view of pilot-to-production conversion. Those are not cosmetic omissions. They determine whether the company should be valued as a broad AI-infrastructure beneficiary, a narrower but higher-quality software-and-traceability layer, or a capital-intensive project business riding temporary AI spending strength. The correct approach is to preserve the contradictory sizing lenses, treat the capture wedge as constrained, and demand internal funnel evidence before extrapolating today’s favorable market backdrop into long-term defensible revenue.'
