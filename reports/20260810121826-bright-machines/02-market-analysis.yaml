- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - AI hardware complexity and variant growth
    - Positive
    - Now
    - Raises the value of simulation, traceability, and configurable automation
    - Which programs show the strongest changeover or rework pain today?
  - - Labor shortages and skills gaps
    - Positive
    - Now to medium term
    - Supports automation budgets for reshored or local production
    - How acute is labor churn in target factories and regions?
  - - Regionalization / reshoring
    - Positive
    - Now to medium term
    - Makes flexible domestic capacity more valuable
    - How much current pipeline is tied to domestic-capacity programs?
  - - Partner ecosystem momentum around Azure, NVIDIA, and physical AI
    - Positive
    - Now
    - Improves strategic credibility and buyer interest
    - How much of pipeline originates through partners versus direct sales?
  - - Capex approval and ROI sensitivity
    - Negative
    - Now
    - Longer payback can kill otherwise valid projects
    - What percentage of deals slip or fail because payback exceeds plan?
  - - Demand volatility and new product revisions
    - Negative
    - Now
    - Can degrade utilization and force re-engineering after approval
    - How often do ECOs or product changes hit deployment timelines?
  - - Power, memory, storage, and export-control bottlenecks
    - Negative
    - Now to medium term
    - Can slow the AI hardware programs that feed Bright Machines demand
    - How exposed is pipeline to delayed datacenter or server programs?
  - - Safety, cybersecurity, and liability requirements
    - Negative
    - Ongoing
    - Raises validation and support burden as AI/robotics autonomy grows
    - Which deployments need the most expensive compliance and cybersecurity work?
  notes: This table is designed as an underwriting aid, combining Bright Machines’ own ROI logic with 2026 infrastructure and robotics constraints published by IDC and IFR.
