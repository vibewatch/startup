tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Software-defined electronics assembly wedge
    - Simulation, robotic assembly execution, traceability, inspection, process intelligence
    - Front-end semiconductor tools, unrelated enterprise AI software, and generic MES-only spend
    - VP Manufacturing / COO / plant-automation capex owner
    - Core Bright Machines capture layer.
  - - AI infrastructure manufacturing systems
    - Server, rack, storage, and network-hardware assembly programs plus associated automation
    - Datacenter land, buildings, power-generation assets, and pure cloud software
    - OEMs, ODMs, CMs, hyperscaler hardware teams
    - Most relevant adjacent spend pool that creates demand.
  - - Broader industrial automation
    - Robots, controls, safety, simulation, and engineering services across factories
    - Non-assembly enterprise software and non-industrial AI applications
    - Operations, engineering, industrial-tech budgets
    - Useful outer TAM but materially broader than Bright Machines.
  - - Status-quo substitute spend
    - Manual labor, custom engineering, scrap, rework, and legacy line maintenance
    - New software-defined automation deployments
    - Plant operations budgets and labor lines
    - Primary ROI displacement pool.
  - - Adjacent strategic capacity investment
    - Domestic AI-hardware plants, EMS expansion, and reshoring programs
    - Pure product R&D and downstream datacenter operating expense
    - Executive manufacturing strategy / supply chain programs
    - Important because it shapes who is ready to buy automation faster.
  notes: The boundary intentionally separates Bright Machines’ capture wedge from broader AI infrastructure and industrial automation pools. Included and excluded spend are synthesized from official product messaging, Sacra’s business-model framing, and 2026 market sources.
