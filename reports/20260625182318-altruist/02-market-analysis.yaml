chapter:
  number: 2
  title: Market Analysis
  summary: >-
    The US RIA channel is a structurally growing market—roughly 16,500 SEC-registered advisers, a channel
    approaching one-third of all advisor assets, and a multitrillion-dollar succession and breakaway pipeline.
    Altruist targets the custody and integrated-software spend of mostly small-to-mid RIAs, where technology
    differentiation is reshaping selection, but Schwab's 58%+ dominance, high switching costs and the
    absence of a clean monetizable-revenue denominator bound the near-term opportunity.
sections:
- id: market-definition-and-substitutes
  title: Market Definition and Status-Quo Substitutes
  body: >-
    Altruist competes in the market for RIA custody and integrated advisory software—the qualified custody,
    clearing, trading, rebalancing, performance reporting, fee billing, tax tooling, and increasingly
    AI paraplanning that SEC- and state-registered investment advisers buy to run their practices. The
    relevant spend boundary is the custodian-and-platform layer, not the advisory fees RIAs charge their
    own end clients; those AUM-based fees accrue to the RIA and are explicitly excluded from the custodian
    revenue pool. The status-quo substitute is fragmentation: pairing a legacy custodian such as Schwab,
    Fidelity or Pershing with separate point solutions for portfolio management, rebalancing, reporting
    and billing, then stitching them together with integrations. Altruist's thesis is that a single vertically
    integrated, RIA-only stack collapses that fragmentation. Adjacent categories include TAMPs, standalone
    wealthtech vendors, and bank cash and lending products. Defining this boundary first is essential
    because the market's eye-catching asset figures measure pools far larger than the monetizable custody-and-software
    opportunity Altruist actually serves.
  claimRefs:
  - CM001
  - CM033
  - CM022
  - CM038
  - CM008
  tableRefs:
  - TM001
  figureRefs: []
- id: market-sizing
  title: Market Sizing Across Multiple Lenses
  body: >-
    The market can be sized through several non-additive lenses. By regulatory assets under management,
    US RIAs reported a record $176.8 trillion at the end of 2025, up 22.3% year over year, across 16,544
    SEC-registered advisers (a 4.2% increase). That RAUM figure, however, includes private-fund and institutional
    assets that are not custody-eligible retail wealth. A narrower and more relevant lens is Cerulli's
    independent-and-hybrid RIA channel, which oversees roughly $9.8 trillion—up from $6.6 trillion in
    2019, a compound growth rate near 12%—and is projected to reach about a third of all advisor-managed
    assets by 2026. Altruist itself frames the opportunity as the roughly $128 trillion held across the
    RIA market, a positioning number rather than a serviceable revenue base. For Altruist, the serviceable
    market is best proxied by the custody and platform spend of the mostly small-to-mid RIA firms among
    the ~16,500 registered advisers, while its obtained share (SOM) shows up as more than 3,150 RIA firms
    and a number-four ranking by relationships. Crucially, no public source isolates the absolute annual
    custody-and-advice revenue pool, so penetration math must rely on asset and firm-count proxies.
  claimRefs:
  - CM002
  - CM003
  - CM004
  - CM005
  - CM007
  - CM034
  - CM012
  - CM036
  tableRefs:
  - TM002
  figureRefs:
  - FM001
  - FM002
- id: buyers-and-segments
  title: Buyers, Users, Payers and Segmentation
  body: >-
    The RIA custodian purchase is made by the firm's principal—a founder-advisor at small firms, a principal
    or COO at mid-sized firms, and an investment or operations committee at large RIAs. The users are
    advisory teams and operations staff who live in the platform daily, and the payer is the RIA firm,
    though custodian economics (cash spreads, transaction charges, payment for order flow) effectively
    pass some cost to end clients. Segment behavior differs sharply: small and mid RIAs—the bulk of the
    ~16,500 firms—prize cost, simplicity and modern user experience and are the core adoption segment
    for challenger custodians, whereas large RIAs remain anchored to Schwab and Fidelity for service depth
    and redundancy, and increasingly run multiple custodians. Newly formed RIAs disproportionately default
    to Schwab for transition familiarity, which raises the bar for challengers on first-custodian decisions.
    The adoption path typically runs from awareness through evaluation, a trial or secondary-custodian
    wedge, asset migration and repapering, and finally primary-custodian adoption—each stage shedding
    firms, with migration friction the sharpest drop-off. Multi-custody, now used by nearly 30% of RIAs,
    gives Altruist a realistic entry point as a secondary custodian before competing for primary status.
  claimRefs:
  - CM029
  - CM030
  - CM031
  - CM015
  - CM032
  - CM016
  tableRefs:
  - TM003
  figureRefs:
  - FM003
  - FM004
- id: drivers-constraints
  title: Growth Drivers and Adoption Constraints
  body: >-
    Several structural drivers expand the addressable market through 2026. An aging advisor workforce
    will generate more than 26,000 retirements over the next decade, feeding a succession and breakaway
    pipeline exceeding $2.5 trillion in assets, while a multitrillion-dollar generational wealth transfer
    favors digital-first platforms that next-generation clients prefer. The RIA channel's rising share
    of advisor assets, accelerating M&A approaching the $4 trillion mark, and the elevation of technology
    and AI to primary custodian-selection criteria all benefit a modern, RIA-only entrant. Against these
    tailwinds stand real constraints. Switching costs—data migration, client repapering and operational
    risk—slow displacement of incumbents and protect Schwab's 58%-plus position and Fidelity's installed
    base. Fee compression toward roughly 0.85%-1.0% pressures advisor margins (raising demand for low-cost
    custody but squeezing the entire value chain), and intensifying SEC scrutiny of custody, marketing
    and cybersecurity raises compliance costs in ways that can favor scaled players. Heavy asset concentration—about
    2% of firms controlling 54% of assets—means winning small-to-mid firms drives logo growth faster than
    asset share. The net read is a genuinely growing market whose monetizable size and Altruist's obtainable
    slice remain partially obscured by incompatible sizing bases.
  claimRefs:
  - CM018
  - CM023
  - CM021
  - CM026
  - CM027
  - CM024
  - CM028
  - CM019
  - CM020
