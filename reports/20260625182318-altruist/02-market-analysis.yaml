callouts:
- calloutType: insight
  title: Channel tailwind is real, but boundary discipline matters
  body: >-
    The RIA channel is genuinely expanding—projected toward roughly 33% of advisor assets by 2026, fed
    by $2.5T+ of retiring-advisor succession and breakaway flows. But the headline $128 trillion and $176.8
    trillion figures measure total or regulatory assets, not the monetizable custody-and-platform revenue
    Altruist can actually capture. The investable opportunity is the custody/software spend of the roughly
    16,500 mostly small-to-mid RIA firms, where Altruist's vertically integrated model is most differentiated.
  claimRefs:
  - CM005
  - CM007
  - CM003
  - CM017
  - CM030
- calloutType: risk
  title: Incumbency and switching costs cap near-term share capture
  body: >-
    Schwab serves more than 58% of RIAs and is the default for newly formed firms, while data migration,
    client repapering and operational risk make advisors reluctant to switch primary custodians. Altruist's
    rapid logo growth is real, but multi-custody adoption (now ~30% of RIAs) suggests challengers often
    win the secondary-custodian slot first. Converting secondary relationships into primary custody—against
    deep-pocketed incumbents—is the central market-penetration risk.
  claimRefs:
  - CM009
  - CM031
  - CM027
  - CM015
- calloutType: strength
  title: Technology is the wedge reshaping custodian selection
  body: >-
    Modern technology and onboarding have become primary custodian-selection criteria, especially for
    breakaway and next-generation advisors. Altruist's RIA-only, vertically integrated stack and its fast-adopted
    Hazel AI paraplanner (1,600 firms in a month) position it on the right side of the demand shift away
    from fragmented legacy tooling, even as incumbents retain larger installed bases.
  claimRefs:
  - CM026
  - CM013
  - CM038
