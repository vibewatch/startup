  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-pool
    missingEvidence: >-
      No public source isolates the absolute annual US RIA custody-and-advice revenue pool that underlies
      the asset bases cited.
    whyItMatters: >-
      Without a monetizable revenue denominator, TAM/SAM figures expressed in assets overstate the investable
      opportunity and complicate valuation.
    diligencePath: >-
      Triangulate custodian take-rates (net interest spread, PFOF, platform fees) against served AUM,
      or obtain management's bottoms-up revenue model.
    relatedQuestionRefs:
    - QM025
  - type: enumeration-incomplete
    severity: minor
    topic: TAM/SAM/SOM or sizing lens
    missingEvidence: >-
      A single consistent dollar figure for serviceable obtainable market across small-to-mid RIAs is
      not available from public data.
    whyItMatters: >-
      The SOM tier of the sizing lens relies on firm-count proxies rather than dollars, weakening penetration
      math.
    diligencePath: >-
      Commission a segment-level custody-spend estimate by AUM band, or license Cerulli's RIA marketplace
      dataset.
    relatedQuestionRefs:
    - QM024
    - QM006
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: minor
    topic: channel-aum
    missingEvidence: >-
      Reported asset bases conflict across lenses ($9.8T channel AUM vs $176.8T RAUM vs $128T framing).
    whyItMatters: >-
      Mixing these bases can inflate perceived market size; each measures a different population.
    diligencePath: >-
      Standardize on one definition (custody-eligible RIA client assets) before sizing penetration.
    relatedQuestionRefs:
    - QM022
