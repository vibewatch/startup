- id: capability-pricing
  title: Capability and Pricing Comparison
  body: >-
    On capability and price, Altruist's edge is bundling and transparency. It charges no separate platform
    or software fee for accounts custodied at Altruist—folding portfolio accounting, trading, reporting
    and billing into custody—against legacy stacks that typically cost roughly $40 to $70 per account
    per year for portfolio accounting alone; connected third-party accounts cost $1 per month beyond the
    first 100 free each month. Altruist sharpened this position by eliminating its brokerage-account software
    fee in September 2023 and introducing 'Simply Better Pricing' in April 2024. Its Model Marketplace
    offers model portfolios at a disclosed 0-1% as a lower-cost alternative to traditional TAMPs, and
    its Hazel AI paraplanner—adopted by 1,600 firms within a month—extends differentiation into AI workflows
    where incumbents have moved more slowly. Schwab counters with proprietary tools such as iRebal and
    hundreds of integrations, Fidelity with Wealthscape depth, and Pershing with the multi-custodian Wove
    operating system. All major custodians are SEC- and FINRA-regulated, so trust posture is broadly at
    parity, and Altruist discloses its revenue conflicts in its Form CRS.
  claimRefs:
  - CP009
  - CP010
  - CP011
  - CP012
  - CP013
