  title: Competitors
  summary: >-
    Altruist competes in a market dominated by Charles Schwab (58%+ of RIAs, ~$5.1T independent-advisor
    assets) with Fidelity and BNY Pershing as trillion-dollar incumbents. Altruist has reached #4 by firm
    relationships on the strength of vertically integrated, no-platform-fee custody plus software and
    its Hazel AI paraplanner, but incumbent scale, brand trust and switching costs—plus fast-follow risk—bound
    its displacement potential, making multi-homing the realistic path to share.
sections:
- id: competitive-landscape
  title: Competitive Landscape and Entrant Map
  body: >-
    The RIA custody market is a concentrated oligopoly with a long challenger tail. Three incumbents anchor
    the field: Charles Schwab Advisor Services, the dominant custodian used by more than 58% of RIAs with
    over 16,000 firms and roughly $5.1 trillion in independent-advisor assets; Fidelity Institutional,
    the clear number two serving 3,400-plus firms through its Wealthscape platform; and BNY Pershing,
    which supports more than 100,000 advisors and broker-dealers, custodies about $59.4 trillion across
    institutional and international clients, and is modernizing through its Wove operating system. Against
    these sit challengers built on technology—Altruist, Betterment for Advisors, Apex Clearing and SEI—plus
    smaller entrants such as Axos Advisor Services, TradePMR and EAS that target startup and small RIAs
    beyond Schwab and Fidelity. The status-quo substitute remains assembling a legacy custodian with separate
    portfolio, reporting and billing software. Altruist's positioning is deliberately against the 'big
    two,' offering the same core custody while differentiating on integrated software, transparent pricing
    and a no-minimum model aimed at the small-to-mid firms incumbents historically de-prioritized.
  claimRefs:
  - CP001
  - CP005
  - CP006
  - CP018
  - CP028
  - CP030
  - CP022
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: competitor-profiles
  title: Competitor Profiles and Scale
  body: >-
    Scale heavily favors the incumbents. Schwab's franchise posted roughly $98 billion of quarterly net
    new assets and its CEO publicly described Schwab Advisor Services as 'all but unbeatable,' even as
    it cuts in-house RIA books to improve service—evidence that the leader is both dominant and actively
    defending. Fidelity's broader $17.9 trillion in assets under administration reflects total institutional
    scale far beyond its RIA-custody segment, while Pershing's $59.4 trillion is dominated by institutional
    and broker-dealer assets, making both less directly comparable to Altruist's RIA-only focus. Altruist,
    by contrast, is the fourth-largest custodian by firm relationships with more than 3,150 RIA firms,
    having recently surpassed Pershing on that metric. Among challengers, Betterment for Advisors competes
    as a white-labeled robo charging about 0.25% of AUM, Apex Clearing provides API-centric custody for
    fintechs and robo-advisors, and SEI offers a bundled end-to-end platform for complex and high-net-worth
    practices. The picture is one of incumbents winning on scale and Altruist winning logos on technology
    and cost.
  claimRefs:
  - CP003
  - CP026
  - CP036
  - CP029
  - CP008
  - CP015
  - CP016
  - CP017
  - CP034
  tableRefs: []
