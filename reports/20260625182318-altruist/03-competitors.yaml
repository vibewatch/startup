- id: moats-displacement
  title: Moat Durability and Displacement Risk
  body: >-
    Altruist's principal moat is vertical integration—self-clearing custody plus a full advisory software
    suite plus AI—that is hard for single-point incumbents or software vendors to match without rebuilding.
    Its cost advantage and early AI lead reinforce this, but durability is only medium: well-funded incumbents
    can bundle features, cut fees, or fast-follow on AI, creating genuine commoditization risk over time.
    Altruist's weakest dimensions are scale and brand—at #4 with far smaller assets under custody, it
    lacks the distribution power, integration ecosystems and balance-sheet products incumbents wield.
    The most realistic path to share runs through multi-homing: with nearly 30% of RIAs using two or more
    custodians, Altruist can win secondary-custodian mandates where its software and pricing shine, then
    attempt to convert them to primary. That conversion, against deep switching costs and entrenched incumbents
    actively defending their books, is the central competitive unknown. Private competitor economics and
    precise RIA-segment share remain undisclosed, limiting confident benchmarking.
  claimRefs:
  - CP023
  - CP024
  - CP020
  - CP021
  - CP019
