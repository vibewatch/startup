callouts:
- calloutType: strength
  title: Vertical integration plus zero platform fee is a genuine wedge
  body: >-
    Altruist bundles self-clearing custody with portfolio management, rebalancing, reporting, billing
    and an AI paraplanner at no platform fee for custodied accounts, against legacy stacks that charge
    roughly $40-$70 per account per year for portfolio accounting alone. For cost-sensitive small-to-mid
    RIAs, this total-cost-of-ownership advantage—reinforced by transparent published pricing and the fast-adopted
    Hazel AI—gives Altruist a real differentiator that incumbents have so far matched only partially.
  claimRefs:
  - CP009
  - CP011
  - CP023
  - CP025
- calloutType: risk
  title: Incumbent scale and momentum remain formidable
  body: >-
    Schwab serves 16,000+ firms with ~$5.1T in independent-advisor assets, posted roughly $98B of quarterly
    net-new assets, and its CEO publicly called the franchise 'all but unbeatable' while reallocating
    resources to defend service levels. With Fidelity and BNY Pershing also at trillion-dollar scale and
    able to fast-follow features, Altruist's #4 position and far smaller AUC mean its differentiation
    must stay ahead of well-capitalized incumbents who can bundle or cut fees in response.
  claimRefs:
  - CP001
  - CP003
  - CP024
  - CP026
- calloutType: insight
  title: Multi-homing is the realistic path to share
  body: >-
    With nearly 30% of RIAs now running two or more custodians, Altruist's most credible near-term growth
    lever is winning the secondary-custodian slot and then converting to primary, rather than dislodging
    incumbents outright. This reframes the competitive contest from head-to-head displacement toward wallet-share
    expansion, where Altruist's integrated software and pricing are strongest—but primary-custodian conversion
    against entrenched switching costs remains the key unknown.
  claimRefs:
  - CP019
  - CP020
  - CP035
