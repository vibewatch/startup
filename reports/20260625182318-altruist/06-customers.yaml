  - FU003
- id: retention-and-durability
  title: Retention, Satisfaction and Durability
  body: >-
    Retention and durability are the least-evidenced part of the customer story. On the positive side,
    custody relationships carry high switching costs—repapering, data migration, and operational risk—which
    structurally support retention once a firm adopts Altruist as its primary custodian, and the platform
    earns very high marks on some review aggregators (around 4.8 to 5.0 out of 5). On the negative side,
    the picture is sharply divided: some independent review sites score Altruist near 2.7 out of 5 with
    only about 43% of reviewers recommending it, and isolated reviewers report difficulty accessing accounts
    or withdrawing funds, though prevalence is unclear. The most concrete durability event was the April
    2024 announcement of new IRA maintenance and conversion fees, which advisors branded predatory and
    which Altruist acknowledged as a miscommunication mistake and rescinded after backlash—an episode
    that dented trust even after reversal. Crucially, Altruist discloses no quantified net revenue retention,
    gross retention, or cohort churn, so the retention cohort shown here is an illustrative proxy reflecting
    switching-cost stickiness rather than measured data. The October 2025 layoffs further raise questions
    about support capacity as the base scales. Retention durability therefore remains inferred rather
    than proven.
  claimRefs:
  - CU024
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
  - CU025
  - CU026
  - CU032
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-and-concentration
  title: Expansion and Concentration Risk
  body: >-
    Altruist's expansion motion is genuine and multi-pronged: existing firms migrate more of their AUM
    onto the platform over time, and the company cross-sells new modules into the installed base—most
    visibly Hazel AI, which roughly 1,600 firms subscribed to within a month, with a pipeline management
    framed as adding around 1,500 advisors per month thereafter. That land-and-expand dynamic, combining
    deeper asset migration with module upsell, is a strong driver of revenue per customer. The offsetting
    risks are concentration and share-of-wallet. Because nearly 30% of RIAs now use two or more custodians,
    Altruist frequently enters as a secondary custodian and must convert those relationships into primary
    status to capture full wallet share; that conversion rate is undisclosed. Customer concentration is
    also opaque: large adopters like CWM ($26.8B) are positive proof of upmarket traction but also concentrate
    revenue in ways that are not publicly quantified, and channel dependence on cyclical breakaway and
    new-RIA formation adds variability. Combined with the lingering trust impact of the fee controversy
    and post-layoff service-capacity questions, these factors make customer concentration, primary-conversion,
    and retention data the most important customer-side items for a diligence process to obtain before
    underwriting durable expansion.
  claimRefs:
  - CU037
  - CU021
  - CU022
  - CU019
  - CU020
  - CU028
  - CU033
  - CU036
