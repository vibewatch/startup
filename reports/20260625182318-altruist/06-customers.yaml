chapter:
  number: 6
  title: Customers
  summary: >-
    Altruist's customers are registered investment advisers, skewing toward small-to-mid, tech-forward
    and breakaway firms, with more than 4,700 advisors served and relationships across roughly 3,150 RIA
    firms. Named production references now range from startups and ~$900M firms (Lifeworks, SGROI) up
    to multibillion-dollar adopters (CreativeOne, Ritholtz, CWM at $26.8B with 34% AUM growth), and Hazel
    cross-sold to ~1,600 firms in a month. But customer durability is unproven: satisfaction is sharply
    divided across review platforms, an April 2024 fee misstep dented trust, Altruist often enters as
    a secondary custodian, and no retention, churn, or concentration metrics are public.
sections:
- id: segmentation
  title: Customer Base and Segmentation
  body: >-
    Altruist's customer base is composed almost entirely of registered investment advisers, and the platform
    is marketed most directly at small-to-mid, technology-forward, growth-minded firms. The buyer is the
    firm principal, the users are advisory and operations staff who work in the platform daily, and the
    payer is the RIA firm itself. Segment behavior is visible in the named evidence: newly formed and
    startup RIAs (such as Eighth Wonder Investments) adopt Altruist for fast, paperless onboarding and
    free core software; small-to-mid firms value cost, user experience, and the integrated stack; breakaway
    advisors leaving wirehouses choose it for an easy transition to a modern platform; and an expanding
    set of mid-to-large RIAs—CWM at $26.8B, CreativeOne at $3.43B—migrate assets for efficiency. The base
    also spans geographies, from rural Kansas practices to coastal metros, and increasingly includes mass-affluent
    pipelines like the one Ritholtz Wealth is reportedly powering with Altruist. The common thread is
    that customer acquisition is driven heavily by breakaway advisors and newly formed RIAs selecting
    a low-cost, vertically integrated, digital-first custodian, with the platform's appeal broadening
    upmarket over time even though its center of gravity remains smaller, growth-oriented firms.
  claimRefs:
  - CU001
  - CU002
  - CU027
  - CU031
  - CU033
  - CU007
  - CU009
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-and-named-proof
  title: Adoption Trajectory and Named Customer Proof
  body: >-
    Altruist's adoption trajectory is steep. The company reported serving more than 4,700 advisors at
    its April 2025 Series F, third-party rankings credit it with relationships across roughly 3,150 RIA
    firms, and management said it was running at about 140% of its expected growth trajectory in its 2026
    breakout year after tripling AUM for two consecutive years through 2024. Named, production proof has
    matured alongside that growth. Lifeworks Advisors, a Michigan RIA managing over $900M, named Altruist
    its custodial partner in January 2026; SGROI Wealth Advisory ($939M) moved most client assets; CreativeOne
    Wealth ($3.43B) and CWM ($26.8B, citing 34% AUM growth) are cited as large adopters; and Ritholtz
    Wealth Management (~$6B) is reportedly using Altruist to power a revamped mass-affluent pipeline.
    Smaller firms such as Eighth Wonder Investments and VIP Wealth Advisors provide case-study and customer-authored
    proof. The evidence mixes company-curated advisor stories with independent news and third-party rankings,
    which strengthens credibility, though the named set remains a sample of the broader base rather than
    a representative census, and several of the strongest logos are recent, so reference freshness is
    good but depth of long-tenure proof is still limited.
  claimRefs:
  - CU003
  - CU004
  - CU005
  - CU034
  - CU006
  - CU009
  - CU011
  - CU023
  - CU035
