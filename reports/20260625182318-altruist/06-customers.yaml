callouts:
- calloutType: strength
  title: Production references now span startups to multibillion-dollar RIAs
  body: >-
    Altruist's customer proof has matured from small-firm testimonials to named, production custody wins
    across a wide size range: Lifeworks Advisors ($900M), SGROI ($939M), CreativeOne ($3.43B), Ritholtz
    Wealth (~$6B), and CWM ($26.8B), the last citing 34% AUM growth. Combined with more than 4,700 advisors
    served and a Hazel cross-sell that reached roughly 1,600 firms in a month, the evidence shows both
    broad adoption and genuine upmarket traction beyond the platform's small-firm core.
  claimRefs:
  - CU006
  - CU009
  - CU011
  - CU003
  - CU021
- calloutType: risk
  title: Divided satisfaction, a fee misstep, and undisclosed retention metrics
  body: >-
    Customer durability is not yet proven. Review scores are sharply divided—near 4.8-5.0 on some platforms
    but around 2.7 with only 43% recommending on others—and isolated complaints about account access and
    fund withdrawals exist. The April 2024 IRA-fee announcement enraged advisors, was branded predatory,
    and had to be reversed, denting trust. Altruist often enters as a secondary custodian, capping share-of-wallet,
    and discloses no net revenue retention, churn, or customer-concentration data, leaving retention durability
    inferred from switching costs rather than measured.
  claimRefs:
  - CU015
  - CU016
  - CU018
  - CU019
  - CU025
- calloutType: recommendation
  title: Require retention, concentration, and conversion data in diligence
  body: >-
    Because retention and concentration are the weakest-evidenced areas, diligence should require quantified
    gross and net revenue retention, logo and dollar churn by cohort, top-customer revenue concentration,
    and primary-versus-secondary custodian conversion rates. Pair these with post-fee-controversy NPS
    and support SLAs to test whether the divided satisfaction signal and 2025 layoffs have affected experience
    as the base scales.
  claimRefs:
  - CU025
  - CU028
  - CU029
  - CU019
  - CU026
