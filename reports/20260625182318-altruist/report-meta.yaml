  topStrengths:
    - "First and only vertically integrated all-in-one RIA custodian with self-clearing, custody, and full advisory software stack."
    - "Exceptional growth trajectory: AUM tripled 2 consecutive years; revenue grew 1,700%/550% in 2022/2023; T3 market share doubled to 6.25%."
    - "Disciplined capital raise strategy (minimal dilution, sequentially higher valuations) with GIC sovereign wealth fund as Series F lead."
    - "Large and growing TAM ($128T in RIA AUM globally; 3,000+ new RIA firms/year) with strong structural tailwind from Schwab-TD merger disruption."
    - "Strong network effects and switching costs: advisors deeply embedded once custody relationship established."
  topRisks:
    - "Audited revenue and margins undisclosed; all growth metrics are company-stated and unverified, creating significant valuation uncertainty."
    - "Concentrated founder/CEO dependency on Jason Wenk; his departure or distraction could destabilize strategic execution."
    - "Schwab and Fidelity have R&D budgets that dwarf Altruist's valuation, posing a technology catch-up risk over 3-5 years."
    - "Regulatory risk: FINRA/SEC broker-dealer status subjects Altruist to continuous examination; material enforcement could disrupt operations."
    - "Series F $1.9B valuation implies 10x-19x estimated revenue multiple, which is full-to-rich vs. public wealthtech comps."
  unresolvedGaps:
    - "Audited annual revenue and gross margin profile for 2023, 2024, and 2025 (blocking for final valuation judgment)."
