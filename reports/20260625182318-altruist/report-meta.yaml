companyProfile:
  summary: >-
    Altruist is a Los Angeles-area fintech company building the modern custodian for independent RIAs.
    Founded in 2018 by serial entrepreneur Jason Wenk, it vertically integrates self-clearing brokerage
    (Altruist Financial LLC, FINRA/SIPC), SEC-registered investment advisory (Altruist LLC), and a
    comprehensive advisory software suite—including trading, rebalancing, performance reporting, fee billing,
    and tax management—into a single platform purpose-built for independent financial advisors.
    By April 2025, Altruist had raised ~$602M across six rounds, achieved a $1.9B valuation, and grown to
    serve 4,700+ advisory firms (10%+ market share by firm count), becoming the third-largest RIA custodian
    behind Schwab and Fidelity. AUM has tripled for two consecutive years. The 2026 launch of Hazel AI,
    an AI paraplanner powered by Anthropic models with Salesforce CRM integration, represents Altruist's
    expansion beyond pure custody into AI-powered advisory tools.
  foundedDate: "2018-01-01"
  founders:
    - name: Jason Wenk
      role: "Founder & CEO"
      background: "Former Morgan Stanley engineer; founded FormulaFolios ($4B AUM); EY Entrepreneur of Year 2018"
      claimRefs: [CO009, CO010]
  foundingLocation: "Los Angeles, CA"
  headquarters: "Culver City, CA (3030 S La Cienega Blvd)"
  productSummary: >-
    Altruist offers a vertically integrated RIA platform combining self-clearing brokerage custody, fractional
    share trading, automated rebalancing, performance reporting, fee billing, high-yield cash accounts
    (5.10% APY), fixed-income trading, automated tax management, and Hazel AI paraplanner—all in one interface.
    The platform is free from software subscription fees for core functions.
  customerFocus: "Independent Registered Investment Advisors (RIAs), particularly growth-oriented and next-generation advisory firms."
  businessModel: >-
    Platform fees (zero for core functions to drive adoption), payment for order flow, interest on customer
    cash balances, Model Marketplace Fee (0%-1% annually), Tax Management Fee, and transaction fees on
    specific security types.
  stage: "Series F (late-stage private)"
  fundingStatus: "$152M Series F (April 2025, GIC lead); total raised ~$602M; valuation ~$1.9B; CEO states no further fundraising needed."
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO004, CO005, CO007, CO025, CO033, CO039]

