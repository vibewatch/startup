callouts:
- calloutType: risk
  title: Revenue quality hinges on undisclosed, rate-sensitive economics
  body: >-
    Altruist's monetization leans on net interest margin from client cash, fully paid securities lending,
    and payment for order flow—lines that are highly sensitive to short-term interest rates and to how
    much yield the firm passes through to clients. Having advertised a 5.10% APY and eliminated core software
    fees, Altruist deliberately trades per-dollar spread for asset gathering. With no audited revenue,
    gross margin, or burn disclosed, the durability of revenue quality is unproven, and a sustained drop
    in rates or spreads is the central financial risk to underwrite.
  claimRefs:
  - CI008
  - CI023
  - CI030
  - CI027
  - CI018
- calloutType: strength
  title: Strong capitalization and credible institutional backing
  body: >-
    The broker-dealer entity reported roughly $63.5M of net capital at June 2025—about 11,381% of its
    regulatory minimum—and the company has raised more than $600M, including a $152M Series F led by sovereign
    investor GIC at a ~$1.9B valuation. That balance-sheet strength and long-horizon backing materially
    reduce near-term solvency and financing risk, even though net capital alone does not establish operating
    profitability.
  claimRefs:
  - CI018
  - CI019
  - CI020
  - CI022
  - CI033
- calloutType: recommendation
  title: Close the margin and burn gaps before underwriting
  body: >-
    Public sources estimate revenue near $193M for 2024 with triple-digit growth and a 140%-of-plan 2026,
    but absolute revenue, gross and contribution margin, EBITDA, net burn, runway, and cohort CAC/LTV
    are all undisclosed. Diligence should require audited financials, a segment revenue breakdown (cash
    vs subscription), a cohort data room, and a rate-sensitivity model before relying on the company's
    'clear path to profitability' framing.
  claimRefs:
  - CI011
  - CI013
  - CI027
  - CI016
  - CI037
