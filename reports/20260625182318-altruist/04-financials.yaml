company:
  name: Altruist
chapter:
  number: 4
  title: Financials
  summary: >-
    Altruist monetizes custody through net interest on client cash, fully paid securities lending, payment
    for order flow, and a thin layer of subscription and model-marketplace fees, having eliminated core
    software charges in 2024. Public data points to roughly $193M of estimated 2024 revenue with triple-digit
    growth and a 140%-of-plan 2026, while the balance sheet is strong—about $63.5M net capital (11,381%
    of minimum) and $600M+ raised including a GIC-led $152M Series F at ~$1.9B. But absolute revenue,
    margins, burn, runway, and cohort CAC/LTV are undisclosed, making revenue quality and the path to
    profitability the core diligence blockers.
sections:
- id: revenue-model-and-monetization
  title: Revenue Model, Pricing and Monetization
  body: >-
    Altruist's revenue model is built on monetizing the custody relationship rather than charging for
    software. Following its 2024 'Simply Better Pricing' change, the core custody-and-advisory platform
    carries a zero software fee and US equity and ETF trades are commission-free. Instead, Altruist earns
    money from four principal sources: net interest on client cash held in sweep accounts, fully paid
    securities lending, payment for order flow, and a thin layer of subscription and asset-based fees.
    The high-yield cash account—advertised at 5.10% APY when launched in March 2024—illustrates the central
    tension: the more yield Altruist passes through to clients, the narrower the net interest margin it
    retains, so the model deliberately trades per-dollar spread for asset gathering and relationship depth.
    Layered on top are the premium Altruist One subscription (about 0.01% per month per household), a
    model marketplace fee of roughly 10-12 basis points per month, $1-per-month pricing on connected third-party
    accounts beyond the first hundred, and an emerging Hazel AI subscription line. Because cash interest
    dominates and is rate-sensitive, revenue quality is closely tied to prevailing short-term rates and
    to how aggressively Altruist competes on client yield.
  claimRefs:
  - CI001
  - CI002
  - CI006
  - CI008
  - CI009
  - CI010
  - CI003
  - CI004
  - CI036
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: gtm-and-unit-economics
  title: Go-to-Market, Cost Structure and Unit Economics
  body: >-
    Altruist's go-to-market is largely product-led and self-serve: low-friction onboarding, free core
    software, and viral advisor adoption (most visibly the 1,600 firms that subscribed to Hazel AI in
    a single month) substitute for a heavy enterprise sales force, which supports favorable channel economics.
    On the cost side, Altruist is a self-clearing broker-dealer, a structure that raises working-capital
    and capital-intensity requirements versus an introducing broker but captures more of the economics
    per account. Public unit-economics proxies are thin and estimate-based: third-party trackers put 2024
    revenue near $193M (up from roughly $111M in 2023, about 74% growth) and revenue per employee near
    $186,000 across an estimated 1,000 staff—respectable but below top-tier fintech benchmarks, consistent
    with a company investing ahead of monetization. The October 2025 layoff of about 50 employees (roughly
    15% of staff), framed by the CEO as resource reallocation toward a clear path to profitability, signals
    active cost management. Crucially, gross margin, contribution margin, clearing and service-delivery
    cost, CAC, LTV, and payback are all undisclosed, so true unit economics cannot be verified from public
    sources and remain a diligence priority.
  claimRefs:
  - CI031
  - CI024
  - CI011
  - CI012
  - CI014
  - CI015
  - CI016
  - CI034
  - CI028
