  figureRefs:
  - FI002
- id: public-traction-vs-private-gaps
  title: Public Traction Versus Private-Metric Gaps
  body: >-
    Altruist publishes growth narratives but not audited financials, creating a wide gap between public
    traction signals and verifiable metrics. On the public side, the company cites triple-digit 2024 growth
    in revenue, brokerage accounts, and advisors served; reports tripling AUM for two consecutive years
    through 2024; served more than 4,700 advisors at the April 2025 Series F; and stated it was running
    at about 140% of its expected growth trajectory in its 2026 'breakout' year. Third-party trackers
    add an estimated revenue figure near $193M and a roughly $1.9B valuation. On the private side, absolute
    audited revenue, gross and contribution margin, EBITDA or net income, monthly net burn, cash runway,
    revenue mix by stream, and cohort-level CAC, LTV, and payback are all undisclosed. The result is that
    nearly every figure underwriters would use to assess revenue quality is either an external estimate
    or unavailable. This gap is the defining financial characteristic of the company at this stage: strong
    directional momentum paired with limited primary-source financial transparency, which materially raises
    the burden on a diligence data room.
  claimRefs:
  - CI012
  - CI013
  - CI025
  - CI026
  - CI011
  - CI032
  - CI027
  - CI029
