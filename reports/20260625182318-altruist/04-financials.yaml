  - FI003
- id: capital-adequacy-and-verdict
  title: Capital Adequacy, Financing Dependency and Verdict
  body: >-
    Altruist's balance sheet is a clear strength. The broker-dealer entity, Altruist Financial LLC, reported
    approximately $63.5M of regulatory net capital at June 30, 2025—about 11,381% of its minimum requirement—indicating
    strong near-term solvency, though that entity-level measure does not by itself prove group profitability.
    The company has raised more than $600M since 2018, most recently a $152M Series F led by sovereign
    investor GIC in April 2025 at roughly a $1.9B valuation, with participation from Salesforce Ventures,
    Baillie Gifford, ICONIQ Growth, Geodesic Capital, and the Carson Family Office; GIC's long-horizon
    leadership signals institutional conviction. Financing dependency therefore appears manageable: a
    large net-capital buffer plus a recent raise suggest ample runway barring a severe downturn, although
    exact burn and runway are undisclosed. The financial verdict is mixed-positive: revenue is growing
    rapidly and the company is well-capitalized, but revenue quality leans on undisclosed, rate-sensitive
    cash economics, and margins, burn, and cohort economics are unverifiable. The principal diligence
    blockers are audited financials, a margin and revenue-mix breakdown, a burn-and-runway bridge, and
    a rate-sensitivity model—each required before underwriting the path to profitability.
  claimRefs:
  - CI018
  - CI019
  - CI020
  - CI021
  - CI022
