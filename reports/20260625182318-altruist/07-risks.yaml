  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory / legal risk register
    missingEvidence: >-
      The regulatory/legal risk register lists principal exposures but is not an exhaustive enumeration
      of every regulatory obligation or pending rule affecting Altruist.
    whyItMatters: >-
      Unlisted or emerging rules (e.g., specific state requirements, future PFOF/sweep rulemaking) could
      add material exposure not captured here.
    diligencePath: >-
      Commission a full regulatory-obligation inventory and pending-rulemaking review from securities
      counsel, plus BrokerCheck/IAPD pull.
    relatedQuestionRefs:
    - QR003
    - QR031
    relatedTableRefs:
    - TR001
  - type: access-blocked
    severity: material
    topic: private-risk-evidence
    missingEvidence: >-
      Exam results, internal incident and reconciliation logs, cyber test results, and any litigation
      are not publicly available.
    whyItMatters: >-
      These private records are where genuine regulatory, operational, and legal risk would first appear;
      their absence prevents full risk verification.
    diligencePath: >-
      Request exam letters, incident logs, pen-test summaries, and litigation schedules in a diligence
      data room.
    relatedQuestionRefs:
    - QR032
    - QR033
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: revenue-at-regulatory-risk
    missingEvidence: >-
      The revenue share derived from PFOF and cash interest—the lines most exposed to regulation—is not
      disclosed.
    whyItMatters: >-
      Without this share, the financial magnitude of a PFOF ban or sweep-rule change cannot be sized.
    diligencePath: Obtain a segment revenue breakdown isolating PFOF and net interest income from management.
    relatedQuestionRefs:
    - QR034
    relatedTableRefs:
    - TR005
