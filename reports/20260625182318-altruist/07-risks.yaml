company:
  name: Altruist
chapter:
  number: 7
  title: Risks
  summary: >-
    Altruist's most severe risks cluster where its revenue model meets regulation: net interest margin
    on client cash and payment for order flow are exactly the areas SEC and FINRA are scrutinizing, so
    a PFOF ban or tighter sweep rules would strike core economics, as would a sustained decline in short-term
    rates. As a self-clearing custodian of record, operational, cybersecurity, and settlement failures
    carry outsized trust impact, with reliability monitored only via a status page. The April 2024 fee
    misstep and October 2025 layoffs show trust and execution fragility, new margin/options products add
    credit risk, and the model depends on concentrated partners (program banks, market makers, cloud,
    LLMs) and continued financing. Residual exposure is material across regulatory, operational, and model
    dimensions, and key private evidence—exam results, incident logs, and revenue-at-risk shares—is unavailable.
sections:
- id: risk-overview
  title: Risk Overview and Severity Ranking
  body: >-
    Altruist's risk profile is dominated by a small number of high-impact exposures that sit at the intersection
    of its business model and external conditions it does not control. Ranked by likelihood and impact,
    the top tier comprises regulatory risk to its two most sensitive revenue lines—net interest margin
    on client cash and payment for order flow—and the closely related model risk that a sustained decline
    in short-term interest rates would compress cash-sweep margin. The second tier is operational: as
    a self-clearing custodian of record, Altruist internalizes settlement, reconciliation, and recordkeeping,
    so outages, cybersecurity breaches, or settlement failures carry outsized impact on the trust that
    underpins a custody franchise. Beyond these, dependency risk on concentrated partners, financing risk
    tied to continued capital access, and people-and-execution risk from rapid scaling and key-person
    reliance round out the register. These risks are not independent: a rate decline or regulatory change
    impairs revenue, an operational failure or misstep erodes advisor trust and accelerates churn, and
    impaired revenue feeds valuation and financing risk. The heatmap and transmission map that follow
    show that residual exposure remains material across regulatory, operational, and model dimensions
    even after the mitigations Altruist has in place.
  claimRefs:
  - CR040
  - CR003
  - CR019
  - CR009
  - CR017
  - CR023
  tableRefs: []
  figureRefs:
  - FR001
  - FR002
- id: regulatory-legal-risk
  title: Regulatory and Legal Risk
  body: >-
    Altruist operates two regulated entities—Altruist Financial LLC, a self-clearing broker-dealer and
    FINRA/SIPC member, and Altruist LLC, an SEC-registered investment adviser (CRD 299398)—a dual structure
    that requires careful management of conflicts between brokerage and advisory roles under Reg BI and
    fiduciary standards, disclosed through Form CRS and Form ADV. The sharpest regulatory exposure is
    to the revenue model. SEC and FINRA have intensified scrutiny of cash sweep programs—focusing on yield
    disclosure, conflicts, and whether clients are disadvantaged for firm benefit—and Altruist earns net
    interest margin on swept client cash. Payment for order flow, which Altruist discloses as a revenue
    source, remains under heavy SEC scrutiny and could be restricted or banned outright, directly threatening
    that line. As a self-clearing custodian since around April 2023, Altruist also carries custody-rule
    obligations to safeguard assets and provide required statements and audits. The April 2024 fee episode—new
    IRA fees that advisors called predatory before the company rescinded them—illustrates legal and reputational
    risk from disclosure and communication missteps. No major enforcement action against Altruist is publicly
    disclosed, but absence of public action is not absence of risk, and BrokerCheck and IAPD remain the
    channels to verify status. SEC examination priorities now span sweep, PFOF, custody, and marketing—each
    directly relevant to Altruist.
  claimRefs:
  - CR001
  - CR036
  - CR003
  - CR005
  - CR002
  - CR006
  - CR007
  - CR035
  - CR037
  tableRefs:
  - TR001
  figureRefs: []
- id: operational-security-risk
  title: Operational, Quality and Security Risk
  body: >-
    Operationally, self-clearing concentrates responsibility for settlement, reconciliation, and recordkeeping
    inside Altruist rather than a third-party clearing firm, raising the operational-risk profile in exchange
    for more control and economics. Because Altruist is a custodian of record, the impact of a platform
    outage, settlement failure, or cybersecurity breach is severe—client assets and trust are directly
    at stake—yet reliability is visible publicly only through a live status page with no quantified uptime
    SLA or published incident history. Custody of client cash and securities also makes Altruist a high-value
    cyberattack target, elevating data-protection risk; the company describes encryption and controls
    but holds no publicly confirmed SOC 2 or ISO 27001 certification. Hazel's access to real-time custodial
    and client data adds AI-governance and privacy risk, which Altruist addresses with zero-data-retention
    and no-model-training commitments that remain self-attested. The October 2025 layoff of roughly 50
    employees raises service-quality and support-capacity questions as the base scales, and the 2026 addition
    of margin lending and options introduces new credit and loss-exposure risk with controls that are
    as yet unproven. Quality and security risk is therefore both structurally elevated and, in several
    respects, verifiable only through private evidence.
  claimRefs:
  - CR009
  - CR010
  - CR011
  - CR013
  - CR012
  - CR020
  - CR039
  - CR022
  tableRefs:
  - TR002
  figureRefs: []
- id: dependency-and-financial-risk
  title: Partner Dependency and Financial / Model Risk
  body: >-
    Altruist's operating model concentrates critical functions in a limited set of external partners.
    It depends on program banks for cash sweep and FDIC capacity, on market makers for order routing and
    the associated PFOF revenue, on cloud infrastructure for hosting, and on large language model providers
    for Hazel's inference—any failure or repricing of which would materially affect operations or economics.
    It also depends on continued access to capital: more than $600M raised, including a GIC-led $152M
    Series F, provides runway, but future rounds and terms are not guaranteed, and roughly $1.9B valuation
    against undisclosed profitability creates down-round risk if growth slows or markets tighten. On the
    model side, revenue is materially rate-sensitive because cash-sweep margin scales with short-term
    rates, so a sustained rate decline without offsetting fee revenue is a direct model risk; the new
    margin and options products add credit and loss exposure; and custody of client assets carries inherent
    fraud and financial-control risk that must be managed through segregation, reconciliation, and audit.
    A strong net-capital buffer (about 11,381% of minimum) mitigates near-term solvency risk but not operating-loss
    or financing risk. Competition from Schwab and Fidelity and the prevalence of multi-custody further
    cap share-of-wallet, and customer-concentration risk cannot be sized because top-customer revenue
    shares are undisclosed.
  claimRefs:
  - CR014
  - CR015
  - CR016
  - CR017
  - CR021
  - CR019
  - CR020
  - CR018
  - CR025
  - CR026
