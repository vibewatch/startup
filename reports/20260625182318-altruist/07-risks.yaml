callouts:
- calloutType: risk
  title: Regulatory exposure sits squarely on the revenue model
  body: >-
    Altruist's two most rate-sensitive and regulation-sensitive revenue lines—net interest margin on client
    cash and payment for order flow—are precisely the areas where SEC and FINRA scrutiny is intensifying.
    Tighter sweep-disclosure or best-interest rules, or any PFOF restriction, would strike the core economics
    directly. The model also carries custody-rule obligations and dual broker-dealer/adviser conflict-management
    duties. None of this is unusual for a custodian, but it means regulatory change is a first-order,
    not peripheral, risk to underwrite.
  claimRefs:
  - CR003
  - CR005
  - CR004
  - CR036
  - CR035
- calloutType: risk
  title: Operational and trust risks are amplified by custody-of-record status
  body: >-
    As a self-clearing custodian, Altruist internalizes settlement, reconciliation, and recordkeeping,
    so an outage, cyber breach, or settlement failure carries outsized impact on client trust—and there
    is no public quantified uptime SLA, only a live status page. The April 2024 fee misstep showed how
    quickly advisor trust can erode, and the October 2025 layoffs raise service-capacity questions. New
    2026 margin and options products add an unproven credit-loss surface. These operational and trust
    risks compound the regulatory exposure.
  claimRefs:
  - CR009
  - CR010
  - CR011
  - CR033
  - CR020
- calloutType: recommendation
  title: Pre-commit to kill triggers and demand private risk evidence
  body: >-
    Given material residual exposure across regulatory, operational, and model dimensions, an investor
    should pre-commit to explicit thesis-break triggers—a PFOF ban or sweep rule that materially cuts
    revenue, a sustained rate decline without fee-revenue offset, a serious custody or cyber failure,
    or a down-round/failed raise. Diligence should obtain the private risk evidence public sources lack:
    SEC/FINRA exam results, incident and reconciliation logs, any litigation, cyber penetration tests,
    and the revenue share exposed to PFOF and cash interest.
  claimRefs:
  - CR029
  - CR030
  - CR031
  - CR038
  - CR041
