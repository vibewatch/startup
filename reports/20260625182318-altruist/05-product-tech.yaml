callouts:
- calloutType: strength
  title: Vertically integrated, AI-native stack is the core product advantage
  body: >-
    Altruist's defining strength is consolidation: qualified custody, self-clearing, onboarding, trading,
    rebalancing, reporting, billing, tax, and cash sit in one cloud-native platform, with Hazel AI layered
    on top and uniquely wired into real-time custodial data. That single-vendor architecture removes the
    integration tax RIAs pay when stitching a legacy custodian to multiple point solutions, and the November
    2025 custodial-data integration gives Hazel a proprietary data edge over standalone AI notetakers—evidenced
    by roughly 1,600 firms subscribing within a month.
  claimRefs:
  - CE001
  - CE022
  - CE013
  - CE021
  - CE024
- calloutType: risk
  title: Trust posture and architecture rest largely on company disclosure
  body: >-
    Most of Altruist's technical and compliance assurances—in-house ledger design, encryption, zero-data-retention
    AI, reliability—are company-described and not independently verifiable from public sources. There
    is no public SOC 2 or ISO 27001 confirmation, no quantified uptime SLA beyond a live status page,
    and exam outcomes are private. The architecture also concentrates dependency on a limited set of program
    banks, market makers, cloud, and LLM providers, creating single-point-of-failure exposure that diligence
    should probe.
  claimRefs:
  - CE027
  - CE029
  - CE028
  - CE026
  - CE018
- calloutType: insight
  title: AI-led roadmap is expanding capability faster than incumbents
  body: >-
    The 2025-2026 release cadence—Hazel general availability, custodial integration, AI tax planning,
    then alternatives, options, margin, and faster money movement—shows a roadmap that is closing feature
    gaps with incumbents while opening a differentiated AI front. The pace is a competitive asset, but
    the newest capabilities (alts, options, margin) are only months old and remain unproven at scale,
    so capability maturity is uneven across the stack.
