company:
  name: Altruist
chapter:
  number: 5
  title: Product and Technology
  summary: >-
    Altruist is a vertically integrated, cloud-native platform that fuses qualified custody and self-clearing
    with the full RIA software stack—onboarding, trading, rebalancing, reporting, billing, tax, and high-yield
    cash—plus Hazel, an AI paraplanner uniquely wired into real-time custodial data. Its in-house ledger
    underpins self-clearing, and a 2025-2026 AI-led roadmap (Hazel GA, custodial integration, AI tax planning,
    then alternatives, options, and margin) is rapidly closing gaps with incumbents. The principal caveats
    are that architecture, reliability, and security claims are largely company-described, with no public
    SOC 2 or quantified SLA, and the platform concentrates dependency on program banks, market makers,
    cloud, and LLM providers.
sections:
- id: product-definition-and-workflows
  title: Product Definition and Customer Workflows
  body: >-
    In customer-workflow terms, Altruist is the system an RIA uses to run its entire investment operation
    from one place. An advisor opens and funds a client account through paperless onboarding and ACATs—across
    more than thirty account types, often in minutes—then builds and rebalances portfolios using commission-free
    fractional-share trading, smart order routing, and a model marketplace spanning hundreds of models.
    Ongoing, the same platform handles performance reporting, integrated fee billing, and a co-branded
    client portal on web and mobile, manages cash through an integrated high-yield sweep, and runs tax
    workflows from automated tax-loss harvesting to AI-generated tax plans. Layered across all of this
    is Hazel, an AI paraplanner that prepares advisors for meetings, summarizes discussions, drafts follow-ups,
    and surfaces next-best actions by drawing on emails, documents, CRM data, and real-time custodial
    data. The defining product claim is consolidation: each of these workflows replaces a task that a
    legacy setup splits between a custodian and one or more third-party vendors, collapsing the integration
    burden into a single vertically integrated platform and a unified advisor and client experience.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE030
  - CE033
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE002
- id: architecture-and-operating-model
  title: Technology and Operating Architecture
  body: >-
    Altruist's operating model is built around being a self-clearing broker-dealer: rather than routing
    custody and settlement through a third-party clearing firm, it directly settles trades and maintains
    its own in-house ledger as the system of record for positions, balances, transactions, and corporate
    actions. That ledger is the technical core of the business and the foundation for real-time reconciliation
    and workflow automation. Above it sits a cloud-native software layer for onboarding, trading, rebalancing,
    reporting, and billing, and an AI layer—Hazel—granted real-time access to custodial data through an
    industry-first integration shipped in November 2025. The platform exposes APIs and more than two dozen
    integrations with CRMs and other fintech tools. Operationally, the architecture depends on external
    rails: program banks for cash sweep and FDIC capacity, market makers for order routing and payment
    for order flow, cloud infrastructure for hosting, and large language model providers for Hazel's inference,
    all within a FINRA-member, SIPC-protected, SEC-regulated custody regime. This vertical integration
    is the source of both the product's efficiency advantage and its concentration of critical dependencies,
    which a technical diligence process must verify because the internal design is company-described rather
    than independently documented.
  claimRefs:
  - CE010
  - CE011
  - CE012
  - CE013
  - CE015
  - CE016
  - CE007
  - CE034
  tableRefs:
  - TE003
  figureRefs:
  - FE001
  - FE003
- id: deployment-integration-roadmap
  title: Deployment, Integration, Reliability and Roadmap
  body: >-
    Deployment for an RIA is largely self-serve: paperless onboarding, bulk client transitions, and more
    than two dozen integrations let firms connect existing CRMs and tools, while a public system-status
    page provides ongoing availability signals. Reliability assurances, however, are thin in quantified
    terms—there is a live status page but no published uptime SLA or historical incident-frequency disclosure.
    Altruist's roadmap cadence is its most visible strength. In a roughly nine-month span it brought Hazel
    to general availability (September 2025), shipped an industry-first custodial-data integration (November
    2025), launched AI-powered tax planning (February 2026), and then added support for alternative assets,
    options, margin loans, and faster money movement (June 2026). This is an AI-led roadmap that is simultaneously
    closing feature gaps with incumbents in core RIA workflows and opening a differentiated AI front.
    The caveat is maturity: custody, trading, reporting, and rebalancing are mature, but the newest 2026
    additions—alternatives, options, and margin—are only months old and unproven at scale, so capability
    maturity is uneven and recent releases warrant close validation during diligence.
  claimRefs:
  - CE012
  - CE018
  - CE035
  - CE013
  - CE008
  - CE014
  - CE032
  - CE025
  tableRefs:
  - TE005
  figureRefs: []
- id: differentiation-trust-security
  title: Differentiation, Trust, Security and Compliance
  body: >-
    Altruist's differentiation rests on a modern, RIA-only, cloud-native stack with native AI, contrasted
    with incumbents' older and more fragmented architectures; the proprietary custodial-data integration
    gives Hazel an information advantage that standalone notetakers and planning tools cannot match. On
    trust and compliance, the platform operates under FINRA membership and SIPC protection with custody
    subject to SEC rules, and the company describes encryption, data-protection controls, and an AI governance
    posture in which client data is never used to train models and Hazel satisfies zero-data-retention
    agreements. The material weakness is verifiability: these assurances are largely self-attested. Public
    sources reviewed do not confirm a SOC 2 or ISO 27001 certification, exam outcomes are not public,
    and there is no quantified reliability SLA. The architecture's concentration on a limited set of program
    banks, market makers, cloud providers, and LLM vendors adds single-point-of-failure risk. The net
    read is a genuinely differentiated, fast-moving product whose technical and security claims are credible
    but should be independently validated—through SOC 2 reports, an architecture and resilience review,
    and confirmation of AI-governance controls—before they are underwritten.
  claimRefs:
  - CE023
  - CE024
  - CE016
  - CE017
  - CE009
  - CE026
  - CE027
  - CE029
  tableRefs:
  - TE004
  figureRefs:
  - FE004
