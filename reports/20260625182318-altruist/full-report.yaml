      - number: '7.3'
        title: Operational, Quality and Security Risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, self-clearing concentrates responsibility for settlement, reconciliation, and recordkeeping
              inside Altruist rather than a third-party clearing firm, raising the operational-risk profile in exchange
              for more control and economics. Because Altruist is a custodian of record, the impact of a platform
              outage, settlement failure, or cybersecurity breach is severe—client assets and trust are directly at
              stake—yet reliability is visible publicly only through a live status page with no quantified uptime SLA or
              published incident history. Custody of client cash and securities also makes Altruist a high-value
              cyberattack target, elevating data-protection risk; the company describes encryption and controls but
              holds no publicly confirmed SOC 2 or ISO 27001 certification. Hazel's access to real-time custodial and
              client data adds AI-governance and privacy risk, which Altruist addresses with zero-data-retention and
              no-model-training commitments that remain self-attested. The October 2025 layoff of roughly 50 employees
              raises service-quality and support-capacity questions as the base scales, and the 2026 addition of margin
              lending and options introduces new credit and loss-exposure risk with controls that are as yet unproven.
              Quality and security risk is therefore both structurally elevated and, in several respects, verifiable
              only through private evidence.
