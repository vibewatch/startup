      - number: '6.4'
        title: Expansion and Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              Altruist's expansion motion is genuine and multi-pronged: existing firms migrate more of their AUM onto
              the platform over time, and the company cross-sells new modules into the installed base—most visibly Hazel
              AI, which roughly 1,600 firms subscribed to within a month, with a pipeline management framed as adding
              around 1,500 advisors per month thereafter. That land-and-expand dynamic, combining deeper asset migration
              with module upsell, is a strong driver of revenue per customer. The offsetting risks are concentration and
              share-of-wallet. Because nearly 30% of RIAs now use two or more custodians, Altruist frequently enters as
              a secondary custodian and must convert those relationships into primary status to capture full wallet
              share; that conversion rate is undisclosed. Customer concentration is also opaque: large adopters like CWM
              ($26.8B) are positive proof of upmarket traction but also concentrate revenue in ways that are not
              publicly quantified, and channel dependence on cyclical breakaway and new-RIA formation adds variability.
              Combined with the lingering trust impact of the fee controversy and post-layoff service-capacity
              questions, these factors make customer concentration, primary-conversion, and retention data the most
              important customer-side items for a diligence process to obtain before underwriting durable expansion.
