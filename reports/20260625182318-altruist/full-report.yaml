companyProfile:
  summary: >-
    Altruist is a Los Angeles-area fintech company building the modern custodian for independent RIAs. Founded in 2018
    by serial entrepreneur Jason Wenk, it vertically integrates self-clearing brokerage (Altruist Financial LLC,
    FINRA/SIPC), SEC-registered investment advisory (Altruist LLC), and a comprehensive advisory software
    suite—including trading, rebalancing, performance reporting, fee billing, and tax management—into a single platform
    purpose-built for independent financial advisors. By April 2025, Altruist had raised ~$602M across six rounds,
    achieved a $1.9B valuation, and grown to serve 4,700+ advisory firms (10%+ market share by firm count), becoming the
    third-largest RIA custodian behind Schwab and Fidelity. AUM has tripled for two consecutive years. The 2026 launch
    of Hazel AI, an AI paraplanner powered by Anthropic models with Salesforce CRM integration, represents Altruist's
    expansion beyond pure custody into AI-powered advisory tools.
