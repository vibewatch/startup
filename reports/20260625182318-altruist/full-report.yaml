              suite plus AI—that is hard for single-point incumbents or software vendors to match without rebuilding.
              Its cost advantage and early AI lead reinforce this, but durability is only medium: well-funded incumbents
              can bundle features, cut fees, or fast-follow on AI, creating genuine commoditization risk over time.
