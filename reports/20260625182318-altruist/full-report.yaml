  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Signal
      - Action
    rows:
      - - Growth slowdown
        - YoY revenue growth falls below ~35%
        - Re-underwrite multiple; pause adds
      - - Regulatory shock
        - PFOF ban or sweep-disclosure rule cuts revenue
        - Cut target; reassess economics
      - - Financing stress
        - Down round or punitive new-round terms
        - Exit or demand preference protection
      - - Trust erosion
        - Mass advisor churn after a misstep
        - Reassess franchise durability
      - - Margin failure
        - Profitability path slips materially
        - Discount base case; widen bear
      - - Exit delay
        - IPO pushed beyond early 2030s
        - Extend hold or seek secondary exit
    notes: >-
      Each trigger is a pre-committable condition that would break or materially impair the investment thesis if
      observed.
    claimRefs:
      - CV039
      - CV016
      - CV033
      - CV025
      - CV021
      - CV018
  - id: TV006
    title: Final diligence asks table
    columns:
      - Ask
      - Why it matters
      - Owner
    rows:
      - - Audited revenue and margins
        - Fixes the entry multiple and profitability claim
        - Management / auditor
      - - Full cap table with preferences
        - Sizes dilution and liquidation-preference overhang
        - Legal / CFO
      - - Churn and net-revenue-retention data
        - Validates durability of the customer base
        - Revenue ops
      - - Segment revenue at regulatory risk
        - Sizes PFOF and cash-interest exposure
        - Finance / compliance
      - - Runway and burn schedule
        - Confirms self-sustainability narrative
        - CFO
      - - Secondary-market terms and pricing
        - Defines achievable entry discipline
        - Investor relations
    notes: These asks target the private evidence that public sources lack and that most affects the valuation decision.
    claimRefs:
