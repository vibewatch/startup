        blocks:
          - type: paragraph
            body: >-
              Altruist's customer base is composed almost entirely of registered investment advisers, and the platform
              is marketed most directly at small-to-mid, technology-forward, growth-minded firms. The buyer is the firm
              principal, the users are advisory and operations staff who work in the platform daily, and the payer is
              the RIA firm itself. Segment behavior is visible in the named evidence: newly formed and startup RIAs
              (such as Eighth Wonder Investments) adopt Altruist for fast, paperless onboarding and free core software;
              small-to-mid firms value cost, user experience, and the integrated stack; breakaway advisors leaving
              wirehouses choose it for an easy transition to a modern platform; and an expanding set of mid-to-large
              RIAs—CWM at $26.8B, CreativeOne at $3.43B—migrate assets for efficiency. The base also spans geographies,
              from rural Kansas practices to coastal metros, and increasingly includes mass-affluent pipelines like the
              one Ritholtz Wealth is reportedly powering with Altruist. The common thread is that customer acquisition
              is driven heavily by breakaway advisors and newly formed RIAs selecting a low-cost, vertically integrated,
              digital-first custodian, with the platform's appeal broadening upmarket over time even though its center
              of gravity remains smaller, growth-oriented firms.
