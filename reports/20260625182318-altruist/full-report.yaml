      - number: '3.2'
        title: Competitor Profiles and Scale
        blocks:
          - type: paragraph
            body: >-
              Scale heavily favors the incumbents. Schwab's franchise posted roughly $98 billion of quarterly net new
              assets and its CEO publicly described Schwab Advisor Services as 'all but unbeatable,' even as it cuts
              in-house RIA books to improve service—evidence that the leader is both dominant and actively defending.
              Fidelity's broader $17.9 trillion in assets under administration reflects total institutional scale far
              beyond its RIA-custody segment, while Pershing's $59.4 trillion is dominated by institutional and
              broker-dealer assets, making both less directly comparable to Altruist's RIA-only focus. Altruist, by
              contrast, is the fourth-largest custodian by firm relationships with more than 3,150 RIA firms, having
              recently surpassed Pershing on that metric. Among challengers, Betterment for Advisors competes as a
              white-labeled robo charging about 0.25% of AUM, Apex Clearing provides API-centric custody for fintechs
