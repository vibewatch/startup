      - number: '1.3'
        title: Funding History and Investor Base
        blocks:
          - type: paragraph
            body: >-
              Altruist has raised over $602 million in total venture capital across six rounds since 2019. The Series A
              ($8.5 million, 2019, led by Venrock) established the foundational investor base with Bill McNabb (former
              Vanguard CEO) and Ron Carson (Carson Group founder) as personal investors. The Series B ($50 million, May
              2021, led by Insight Partners) added Vanguard as a strategic institutional investor—notable as Vanguard
              was expanding its RIA channel focus. The Series C ($110 million, November 2021, led by Declaration
              Partners) was previously undisclosed until the Series D announcement. The Series D ($112 million, April
              2023, led by Insight Partners and Adams Street Partners) came immediately after the SSG acquisition and
              the Altruist Clearing launch, cementing Altruist as the third-largest custodian by firm count. The Series
              E ($169 million, May 2024, led by ICONIQ Growth with Granite Capital and Sound Ventures) elevated the
              valuation to over $1.5 billion. The Series F ($152 million, April 2025, led by GIC Singapore's sovereign
              wealth fund) with Salesforce Ventures, Baillie Gifford, Geodesic Capital, Carson Family Office, and ICONIQ
              Growth reaching a $1.9 billion post-money valuation—bringing total raised to approximately $602 million.
              CEO Wenk stated this would be the company's last needed round.
