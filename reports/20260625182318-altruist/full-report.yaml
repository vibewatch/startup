    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Mission
        blocks:
          - type: paragraph
            body: >-
              Altruist Corp is a Delaware-incorporated financial technology company headquartered in Culver City,
              California (3030 S La Cienega Blvd, Culver City, CA 90232). Founded in 2018 by Jason Wenk, the company
              operates under two registered subsidiaries: Altruist Financial LLC, a FINRA/SIPC member self-clearing
              broker-dealer, and Altruist LLC, an SEC-registered investment adviser. The company's mission is to make
              financial advice better, more affordable, and accessible to everyone by providing independent RIAs with
              modern custodial infrastructure and integrated advisory technology. Unlike legacy custodians, Altruist
              built its platform from the ground up exclusively for the RIA market, combining clearing, custody,
              portfolio management, trading, reporting, billing, and tax management into one solution—eliminating the
              need for multiple third-party software integrations. As of June 2025, Altruist holds net capital of $63.5
              million (11,381% of its regulatory minimum), reflecting a financially stable operating base. The company
              is regulated by the SEC, FINRA, OCC, and 53 states and territories. Altruist generates revenue through
              software subscriptions from RIA firms, transaction fees, payment for order flow, cash interest income, and
              model marketplace fees.
