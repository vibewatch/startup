      - number: '7.5'
        title: People, Execution, Mitigations and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              People and execution risk reflects a fast-growing, still-unprofitable company managing scale, cost, and
              trust at once. There is key-person dependence on founder-CEO Jason Wenk, whose vision and public profile
              are central to the narrative; rapid scaling strains controls and culture; talent retention is tested after
              layoffs; and the drive to profitability adds execution pressure. Against these risks Altruist has real
              mitigations: robust Form CRS and ADV disclosures and best-interest procedures for regulatory risk,
              in-house controls and audits plus status monitoring for operational risk, a strong net-capital buffer and
              institutional backers for financing risk, and improved communications after the fee episode for trust
              risk. The most useful discipline for an investor is to pre-commit to explicit thesis-break triggers: a
              PFOF ban or sweep rule that materially cuts revenue, a sustained rate decline without fee-revenue offset,
              a serious custody or cyber failure, a down-round or failed raise, a mass advisor exodus after a misstep,
              or the loss of a few large concentrated customers. Monitoring indicators—BrokerCheck/IAPD disclosures,
              status-page incident frequency, advisor churn after changes, and funding-round timing—provide early
              warning. Crucially, the private evidence that would confirm or allay these risks (exam results, incident
              logs, litigation, and the revenue share exposed to PFOF and cash interest) is not public and must be
              obtained in diligence.
