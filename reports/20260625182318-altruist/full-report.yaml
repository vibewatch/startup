      - number: '7.4'
        title: Partner Dependency and Financial / Model Risk
        blocks:
          - type: paragraph
            body: >-
              Altruist's operating model concentrates critical functions in a limited set of external partners. It
              depends on program banks for cash sweep and FDIC capacity, on market makers for order routing and the
              associated PFOF revenue, on cloud infrastructure for hosting, and on large language model providers for
              Hazel's inference—any failure or repricing of which would materially affect operations or economics. It
              also depends on continued access to capital: more than $600M raised, including a GIC-led $152M Series F,
              provides runway, but future rounds and terms are not guaranteed, and roughly $1.9B valuation against
              undisclosed profitability creates down-round risk if growth slows or markets tighten. On the model side,
              revenue is materially rate-sensitive because cash-sweep margin scales with short-term rates, so a
              sustained rate decline without offsetting fee revenue is a direct model risk; the new margin and options
              products add credit and loss exposure; and custody of client assets carries inherent fraud and
              financial-control risk that must be managed through segregation, reconciliation, and audit. A strong
              net-capital buffer (about 11,381% of minimum) mitigates near-term solvency risk but not operating-loss or
              financing risk. Competition from Schwab and Fidelity and the prevalence of multi-custody further cap
              share-of-wallet, and customer-concentration risk cannot be sized because top-customer revenue shares are
              undisclosed.
