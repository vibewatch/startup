  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Altruist competes in the market for RIA custody and integrated advisory software—the qualified custody,
              clearing, trading, rebalancing, performance reporting, fee billing, tax tooling, and increasingly AI
              paraplanning that SEC- and state-registered investment advisers buy to run their practices. The relevant
              spend boundary is the custodian-and-platform layer, not the advisory fees RIAs charge their own end
              clients; those AUM-based fees accrue to the RIA and are explicitly excluded from the custodian revenue
              pool. The status-quo substitute is fragmentation: pairing a legacy custodian such as Schwab, Fidelity or
              Pershing with separate point solutions for portfolio management, rebalancing, reporting and billing, then
              stitching them together with integrations. Altruist's thesis is that a single vertically integrated,
              RIA-only stack collapses that fragmentation. Adjacent categories include TAMPs, standalone wealthtech
              vendors, and bank cash and lending products. Defining this boundary first is essential because the
              market's eye-catching asset figures measure pools far larger than the monetizable custody-and-software
              opportunity Altruist actually serves.
            claimRefs:
              - CM001
              - CM033
              - CM022
              - CM038
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM022
