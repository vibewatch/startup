  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, Thesis and Anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The overall recommendation on Altruist is conditional—proceed with diligence—carried at medium confidence
              with an elevated risk rating. The investment thesis is straightforward and attractive: the RIA-custody
              market is large and growing, advisor breakaways from wirehouses provide a structural tailwind, Altruist
              offers a modern all-in-one self-clearing platform differentiated by its Hazel AI paraplanner, and it has
              reached roughly 4,700 advisors and the number-three position by firms served while compounding revenue at
              triple-digit rates. Against that, the anti-thesis is equally concrete. The roughly $1.9B Series F mark
              implies an estimated 10x-19x revenue multiple that sits at or above the wealthtech SaaS comparable range,
              the company discloses no audited revenue so profitability is asserted rather than verified, incumbents led
              by Schwab dominate custody while multi-custody adoption caps share-of-wallet, and the most valuable
              revenue lines—cash-sweep net interest margin and payment for order flow—are precisely where regulatory
              scrutiny is intensifying. The October 2025 layoffs, while framed as a march to profitability, hint at burn
              pressure. The recommendation therefore hinges on entry discipline: underwrite the growth, but gate any
              commitment on disclosure of audited revenue, the full cap table, and segment economics, and enter only at
              or below the Series F mark.
            claimRefs:
