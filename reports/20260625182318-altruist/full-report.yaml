      - number: '2.3'
        title: Buyers, Users, Payers and Segmentation
        blocks:
          - type: paragraph
            body: >-
              The RIA custodian purchase is made by the firm's principal—a founder-advisor at small firms, a principal
              or COO at mid-sized firms, and an investment or operations committee at large RIAs. The users are advisory
              teams and operations staff who live in the platform daily, and the payer is the RIA firm, though custodian
              economics (cash spreads, transaction charges, payment for order flow) effectively pass some cost to end
              clients. Segment behavior differs sharply: small and mid RIAs—the bulk of the ~16,500 firms—prize cost,
              simplicity and modern user experience and are the core adoption segment for challenger custodians, whereas
              large RIAs remain anchored to Schwab and Fidelity for service depth and redundancy, and increasingly run
              multiple custodians. Newly formed RIAs disproportionately default to Schwab for transition familiarity,
              which raises the bar for challengers on first-custodian decisions. The adoption path typically runs from
              awareness through evaluation, a trial or secondary-custodian wedge, asset migration and repapering, and
              finally primary-custodian adoption—each stage shedding firms, with migration friction the sharpest
              drop-off. Multi-custody, now used by nearly 30% of RIAs, gives Altruist a realistic entry point as a
              secondary custodian before competing for primary status.
            claimRefs:
              - CM029
              - CM030
              - CM031
              - CM015
              - CM032
