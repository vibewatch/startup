      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Several structural drivers expand the addressable market through 2026. An aging advisor workforce will
              generate more than 26,000 retirements over the next decade, feeding a succession and breakaway pipeline
              exceeding $2.5 trillion in assets, while a multitrillion-dollar generational wealth transfer favors
              digital-first platforms that next-generation clients prefer. The RIA channel's rising share of advisor
              assets, accelerating M&A approaching the $4 trillion mark, and the elevation of technology and AI to
              primary custodian-selection criteria all benefit a modern, RIA-only entrant. Against these tailwinds stand
              real constraints. Switching costs—data migration, client repapering and operational risk—slow displacement
              of incumbents and protect Schwab's 58%-plus position and Fidelity's installed base. Fee compression toward
              roughly 0.85%-1.0% pressures advisor margins (raising demand for low-cost custody but squeezing the entire
              value chain), and intensifying SEC scrutiny of custody, marketing and cybersecurity raises compliance
              costs in ways that can favor scaled players. Heavy asset concentration—about 2% of firms controlling 54%
              of assets—means winning small-to-mid firms drives logo growth faster than asset share. The net read is a
              genuinely growing market whose monetizable size and Altruist's obtainable slice remain partially obscured
              by incompatible sizing bases.
            claimRefs:
              - CM018
              - CM023
              - CM021
              - CM026
              - CM027
              - CM024
              - CM028
