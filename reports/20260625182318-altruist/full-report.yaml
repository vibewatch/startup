              - CV004
          - type: callout
            title: A rich mark against opaque, regulation-sensitive economics
            body: >-
              The bear case is concrete. The entry multiple is full-to-rich, profitability is asserted but unaudited,
              and the most rate- and regulation-sensitive revenue lines (cash-sweep net interest margin and PFOF) are
              exactly where scrutiny is intensifying. Incumbent dominance by Schwab and the prevalence of multi-custody
              cap realistic share-of-wallet, the October 2025 layoffs hint at burn pressure, and an IPO is years away
              with M&A effectively off the table. Together these create genuine down-round and long-hold risk that a
              disciplined entry price and pre-committed kill triggers must offset.
            calloutType: risk
            claimRefs:
              - CV029
              - CV033
              - CV025
              - CV022
              - CV016
          - type: callout
            title: Implied multiple, not headline valuation, is the crux
            body: >-
              Because Altruist withholds audited revenue, the headline $1.9B mark is far less informative than the
              implied multiple it represents. At an estimated $150M of revenue, an 8x versus 16x multiple spans roughly
              $1.2B to $2.4B, so the single most valuable diligence output is a verified revenue figure that fixes where
              on that curve the company actually sits. Comparable private rounds (DriveWealth, Apex) have re-rated
              toward 7x-9x, underscoring that Altruist's premium depends entirely on growth durability that only audited
              data can confirm.
            calloutType: insight
            claimRefs:
              - CV038
              - CV006
              - CV011
              - CV012
              - CV015
