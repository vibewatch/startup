      - number: '8.3'
        title: Scenarios, Comparables and Valuation Sensitivity
        blocks:
          - type: paragraph
            body: >-
              Valuation turns on the implied multiple, not the headline mark, because Altruist withholds audited
              revenue. On company-stated 300% 2025 growth, estimated revenue of roughly $100M-$200M implies a 10x-19x
              multiple. Sector benchmarks put mission-critical wealthtech and B2B SaaS infrastructure near 8x-12x
              EV/revenue, with a 15-20% premium available for AI-embedded models like Hazel, while median private SaaS
              sits closer to 4.5x-5x and private rounds typically clear at a 20-30% discount to public comps. Recent
              private comparables frame the richness: DriveWealth carried roughly $2.85B on about $75M of 2024 ARR
              before re-rating toward 7x-9x, and Apex was last marked near $4.7B (2021) on an estimated $214M of 2024
              revenue. Against this set, Altruist's implied multiple sits at or above the top of the range, a premium
              that only durable growth can justify. The scenario framework captures the dispersion: a bull case (about
              25%) of sustained triple-digit-trending growth toward $1B+ revenue and a successful IPO supports
              multi-billion upside; a base case (about 50%) of deceleration to durable double digits and a late-decade
              IPO yields a modest premium near $2-3B; and a bear case (about 25%) of regulatory or rate shocks and
              incumbent pressure produces a flat-to-down outcome below the entry mark. Sensitivity is stark: at $150M
              estimated revenue, an 8x versus 16x multiple spans roughly $1.2B to $2.4B, so a verified revenue figure is
              the single most valuable diligence output.
