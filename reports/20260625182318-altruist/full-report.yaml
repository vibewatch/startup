      - number: '1.4'
        title: Business Model and Platform
        blocks:
          - type: paragraph
            body: >-
              Altruist's vertically integrated platform bundles clearing, custody, account opening, fractional share
              trading, portfolio rebalancing, performance reporting, fee billing, and tax management software into a
              single solution for independent RIAs. The company's business model generates revenue from RIA platform
              subscription fees, transaction-based charges on certain securities types, payment for order flow on equity
              trades, interest on customer cash balances, a Model Marketplace Fee (0%–1% annually) for advisors using
              Altruist Portfolios or third-party portfolios, and a Tax Management Fee for use of tax optimization tools.
              Altruist eliminated software subscription fees for many core functions to lower barriers to entry for
              smaller RIAs—a deliberate strategy to build market share. The company also offers a high-yield cash
              product paying competitive APY rates and a fully digital fixed-income trading platform launched in 2024.
              The Hazel AI paraplanner platform—launched in early 2026—represents a strategic expansion into AI-powered
              advisory tools that integrate with CRM and custodial data. Salesforce Ventures' participation in the
              Series F reflects strategic alignment: Salesforce Ventures invested because Altruist's data integrations
              with Salesforce CRM are central to the Hazel AI workflow. As of 2025, Altruist supports account types
              including individual, joint, trust, IRA, and business accounts, with options and margin account support
              through its legacy Pershing relationship (inherited from SSG).
