      - number: '5.2'
        title: Technology and Operating Architecture
        blocks:
          - type: paragraph
            body: >-
              Altruist's operating model is built around being a self-clearing broker-dealer: rather than routing
              custody and settlement through a third-party clearing firm, it directly settles trades and maintains its
              own in-house ledger as the system of record for positions, balances, transactions, and corporate actions.
              That ledger is the technical core of the business and the foundation for real-time reconciliation and
              workflow automation. Above it sits a cloud-native software layer for onboarding, trading, rebalancing,
              reporting, and billing, and an AI layer—Hazel—granted real-time access to custodial data through an
              industry-first integration shipped in November 2025. The platform exposes APIs and more than two dozen
              integrations with CRMs and other fintech tools. Operationally, the architecture depends on external rails:
              program banks for cash sweep and FDIC capacity, market makers for order routing and payment for order
              flow, cloud infrastructure for hosting, and large language model providers for Hazel's inference, all
              within a FINRA-member, SIPC-protected, SEC-regulated custody regime. This vertical integration is the
              source of both the product's efficiency advantage and its concentration of critical dependencies, which a
              technical diligence process must verify because the internal design is company-described rather than
              independently documented.
