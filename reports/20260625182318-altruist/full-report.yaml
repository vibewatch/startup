      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Channel tailwind is real, but boundary discipline matters
            body: >-
              The RIA channel is genuinely expanding—projected toward roughly 33% of advisor assets by 2026, fed by
              $2.5T+ of retiring-advisor succession and breakaway flows. But the headline $128 trillion and $176.8
              trillion figures measure total or regulatory assets, not the monetizable custody-and-platform revenue
              Altruist can actually capture. The investable opportunity is the custody/software spend of the roughly
              16,500 mostly small-to-mid RIA firms, where Altruist's vertically integrated model is most differentiated.
            calloutType: insight
            claimRefs:
              - CM005
              - CM007
              - CM003
              - CM017
              - CM030
          - type: callout
            title: Incumbency and switching costs cap near-term share capture
            body: >-
              Schwab serves more than 58% of RIAs and is the default for newly formed firms, while data migration,
              client repapering and operational risk make advisors reluctant to switch primary custodians. Altruist's
              rapid logo growth is real, but multi-custody adoption (now ~30% of RIAs) suggests challengers often win
              the secondary-custodian slot first. Converting secondary relationships into primary custody—against
              deep-pocketed incumbents—is the central market-penetration risk.
            calloutType: risk
            claimRefs:
              - CM009
              - CM031
              - CM027
              - CM015
          - type: callout
            title: Technology is the wedge reshaping custodian selection
            body: >-
              Modern technology and onboarding have become primary custodian-selection criteria, especially for
              breakaway and next-generation advisors. Altruist's RIA-only, vertically integrated stack and its
              fast-adopted Hazel AI paraplanner (1,600 firms in a month) position it on the right side of the demand
              shift away from fragmented legacy tooling, even as incumbents retain larger installed bases.
            calloutType: strength
            claimRefs:
              - CM026
              - CM013
              - CM038
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Entrant Map
        blocks:
          - type: paragraph
            body: >-
              The RIA custody market is a concentrated oligopoly with a long challenger tail. Three incumbents anchor
              the field: Charles Schwab Advisor Services, the dominant custodian used by more than 58% of RIAs with over
              16,000 firms and roughly $5.1 trillion in independent-advisor assets; Fidelity Institutional, the clear
              number two serving 3,400-plus firms through its Wealthscape platform; and BNY Pershing, which supports
              more than 100,000 advisors and broker-dealers, custodies about $59.4 trillion across institutional and
              international clients, and is modernizing through its Wove operating system. Against these sit challengers
              built on technology—Altruist, Betterment for Advisors, Apex Clearing and SEI—plus smaller entrants such as
              Axos Advisor Services, TradePMR and EAS that target startup and small RIAs beyond Schwab and Fidelity. The
              status-quo substitute remains assembling a legacy custodian with separate portfolio, reporting and billing
              software. Altruist's positioning is deliberately against the 'big two,' offering the same core custody
              while differentiating on integrated software, transparent pricing and a no-minimum model aimed at the
              small-to-mid firms incumbents historically de-prioritized.
            claimRefs:
