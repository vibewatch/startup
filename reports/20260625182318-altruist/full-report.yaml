        title: Founding Story and Leadership Team
        blocks:
          - type: paragraph
            body: >-
              Jason Wenk, founder and CEO, is an industry veteran who began his career at Morgan Stanley at age 20,
              working on investment research and asset management systems. He subsequently founded Retirement Wealth
              Advisors in 2004, which grew to $100 million AUM, and then FormulaFolios, which became the fastest-growing
              RIA organically in history—reaching nearly $4 billion AUM in six years and appearing on the Inc. 500 list
              four years running (peak ranking: #10 in 2017). Wenk was named an EY Entrepreneur of the Year in 2018 and
              selected as an Endeavor Entrepreneur in 2017. Altruist was founded in 2018 and publicly launched in 2019.
              The current leadership team includes Rich Rao (Chief Business Officer, joined March 2025, formerly of
              Google, Meta, and Intuit), Sumanth Sukumar (Chief Technology Officer, recently appointed), Mazi Bahadori
              (Chief Compliance Officer and EVP of Operations, founding team), Harpreet Ahluwalia (Chief Product
              Officer), Pete Dorsey (Chief Strategy and Revenue Officer), and Piret Loone (General Counsel, appointed
              2025). The company has approximately 908–1,039 employees as of mid-2026. Wenk has noted this will be
              Altruist's last funding round for the foreseeable future, positioning the company for either sustained
              private operation or a future IPO without additional capital raises. Brandon Golden, Ben Mizes, and Erin
              Hager were referenced in the initial brief but could not be verified as Altruist executives in public
              sources; these names do not appear in any Altruist press releases or leadership announcements reviewed
              during this research.
