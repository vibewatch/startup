        title: Product Definition and Customer Workflows
        blocks:
          - type: paragraph
            body: >-
              In customer-workflow terms, Altruist is the system an RIA uses to run its entire investment operation from
              one place. An advisor opens and funds a client account through paperless onboarding and ACATs—across more
              than thirty account types, often in minutes—then builds and rebalances portfolios using commission-free
              fractional-share trading, smart order routing, and a model marketplace spanning hundreds of models.
              Ongoing, the same platform handles performance reporting, integrated fee billing, and a co-branded client
              portal on web and mobile, manages cash through an integrated high-yield sweep, and runs tax workflows from
              automated tax-loss harvesting to AI-generated tax plans. Layered across all of this is Hazel, an AI
              paraplanner that prepares advisors for meetings, summarizes discussions, drafts follow-ups, and surfaces
              next-best actions by drawing on emails, documents, CRM data, and real-time custodial data. The defining
              product claim is consolidation: each of these workflows replaces a task that a legacy setup splits between
              a custodian and one or more third-party vendors, collapsing the integration burden into a single
              vertically integrated platform and a unified advisor and client experience.
