      - number: '6.3'
        title: Retention, Satisfaction and Durability
        blocks:
          - type: paragraph
            body: >-
              Retention and durability are the least-evidenced part of the customer story. On the positive side, custody
              relationships carry high switching costs—repapering, data migration, and operational risk—which
              structurally support retention once a firm adopts Altruist as its primary custodian, and the platform
              earns very high marks on some review aggregators (around 4.8 to 5.0 out of 5). On the negative side, the
              picture is sharply divided: some independent review sites score Altruist near 2.7 out of 5 with only about
              43% of reviewers recommending it, and isolated reviewers report difficulty accessing accounts or
              withdrawing funds, though prevalence is unclear. The most concrete durability event was the April 2024
              announcement of new IRA maintenance and conversion fees, which advisors branded predatory and which
              Altruist acknowledged as a miscommunication mistake and rescinded after backlash—an episode that dented
              trust even after reversal. Crucially, Altruist discloses no quantified net revenue retention, gross
              retention, or cohort churn, so the retention cohort shown here is an illustrative proxy reflecting
              switching-cost stickiness rather than measured data. The October 2025 layoffs further raise questions
              about support capacity as the base scales. Retention durability therefore remains inferred rather than
              proven.
