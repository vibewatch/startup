      - number: '8.4'
        title: Exit Readiness, Thesis-break Triggers and Final Asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is a long-horizon proposition. Altruist's IPO is widely characterized as years away, with
              expectations pointing to the late 2020s or early 2030s, and CEO Jason Wenk has set internal thresholds of
              exceeding $1B in annual revenue, a few hundred million dollars of GAAP profitability, and maintaining over
              35% growth before going public. An M&A exit is effectively off the table: Wenk has said he would never
              sell, and only mega-incumbents could absorb the company, which would invite antitrust scrutiny. That
              leaves an IPO as the preferred exit and secondary sales as the realistic near-term liquidity path,
              implying a multi-year hold. Given that profile, an investor should pre-commit to explicit thesis-break
              triggers before entering: a sustained growth slowdown below roughly 35%, a PFOF ban or cash-sweep
              disclosure rule that materially cuts revenue, a down round or punitive financing terms, mass advisor churn
              after a misstep, a material slip in the profitability path, or an IPO pushed beyond the early 2030s.
              Equally important are the final diligence asks that target the private evidence public sources lack:
              audited revenue and margins to fix the entry multiple, the full cap table with preferences to size
              overhang, churn and net-revenue-retention data to validate durability, the segment revenue exposed to PFOF
              and cash interest, a runway and burn schedule, and secondary-market terms and pricing. Satisfactory
              answers would convert the conditional recommendation into a disciplined entry; unanswered, they are
              reasons to wait.
