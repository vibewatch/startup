      - number: '2.2'
        title: Market Sizing Across Multiple Lenses
        blocks:
          - type: paragraph
            body: >-
              The market can be sized through several non-additive lenses. By regulatory assets under management, US
              RIAs reported a record $176.8 trillion at the end of 2025, up 22.3% year over year, across 16,544
              SEC-registered advisers (a 4.2% increase). That RAUM figure, however, includes private-fund and
              institutional assets that are not custody-eligible retail wealth. A narrower and more relevant lens is
              Cerulli's independent-and-hybrid RIA channel, which oversees roughly $9.8 trillion—up from $6.6 trillion
              in 2019, a compound growth rate near 12%—and is projected to reach about a third of all advisor-managed
              assets by 2026. Altruist itself frames the opportunity as the roughly $128 trillion held across the RIA
              market, a positioning number rather than a serviceable revenue base. For Altruist, the serviceable market
              is best proxied by the custody and platform spend of the mostly small-to-mid RIA firms among the ~16,500
              registered advisers, while its obtained share (SOM) shows up as more than 3,150 RIA firms and a
              number-four ranking by relationships. Crucially, no public source isolates the absolute annual
              custody-and-advice revenue pool, so penetration math must rely on asset and firm-count proxies.
            claimRefs:
