  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Overview and Severity Ranking
        blocks:
          - type: paragraph
            body: >-
              Altruist's risk profile is dominated by a small number of high-impact exposures that sit at the
              intersection of its business model and external conditions it does not control. Ranked by likelihood and
              impact, the top tier comprises regulatory risk to its two most sensitive revenue lines—net interest margin
              on client cash and payment for order flow—and the closely related model risk that a sustained decline in
              short-term interest rates would compress cash-sweep margin. The second tier is operational: as a
              self-clearing custodian of record, Altruist internalizes settlement, reconciliation, and recordkeeping, so
              outages, cybersecurity breaches, or settlement failures carry outsized impact on the trust that underpins
              a custody franchise. Beyond these, dependency risk on concentrated partners, financing risk tied to
              continued capital access, and people-and-execution risk from rapid scaling and key-person reliance round
              out the register. These risks are not independent: a rate decline or regulatory change impairs revenue, an
              operational failure or misstep erodes advisor trust and accelerates churn, and impaired revenue feeds
              valuation and financing risk. The heatmap and transmission map that follow show that residual exposure
              remains material across regulatory, operational, and model dimensions even after the mitigations Altruist
              has in place.
