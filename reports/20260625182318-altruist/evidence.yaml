evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: annual-revenue
    missingEvidence: Altruist's actual annual revenue run-rate or ARR; company does not disclose absolute revenue figures.
    whyItMatters: >-
      Revenue size is critical to valuation assessment; only growth rates (1,700%, 550%, triple-digit) are available
      without an absolute base.
    diligencePath: Request audited financial statements from management or target VC-level disclosures in due diligence.
    relatedQuestionRefs:
      - QO016
  - type: missing-source
    severity: minor
    topic: board-composition
    missingEvidence: >-
      Full current board of directors composition and terms; confirmed only Rosenbaum (Insight), Beim (Venrock), McNabb
      (personal), and Sull (ICONIQ) at various points.
    whyItMatters: Board governance affects strategic decision-making, investor oversight, and IPO readiness.
    diligencePath: Request current board roster and committee structure from management.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: minor
    topic: regulatory-investigations
    missingEvidence: >-
      Specifics of any pending regulatory investigations or enforcement matters; the financial statement discloses
      existence of 'regulatory matters' without detail.
    whyItMatters: Material regulatory actions could affect business operations, licensing, or valuation.
    diligencePath: Review FINRA BrokerCheck disciplinary history and request management representation on pending matters.
    relatedQuestionRefs:
      - QO011
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder or investor map
    missingEvidence: >-
      Complete investor allocation sizes, current board seats and observer rights for all investors, and secondary
      transaction history.
    whyItMatters: >-
      Knowing who controls board votes and what percentage each investor owns affects governance analysis and potential
      future transactions.
    diligencePath: Request cap table and board observer agreements from management in due diligence.
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone table
    missingEvidence: >-
      Complete chronology of early-stage events (2018-2019), all product launches, regulatory approvals, and adverse
      events not in public press releases.
    whyItMatters: Missing milestones could indicate unreported setbacks, regulatory delays, or product failures.
    diligencePath: Request internal company timeline and press clippings from management.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: revenue-pool
    missingEvidence: >-
      No public source isolates the absolute annual US RIA custody-and-advice revenue pool that underlies the asset
      bases cited.
    whyItMatters: >-
      Without a monetizable revenue denominator, TAM/SAM figures expressed in assets overstate the investable
      opportunity and complicate valuation.
    diligencePath: >-
      Triangulate custodian take-rates (net interest spread, PFOF, platform fees) against served AUM, or obtain
      management's bottoms-up revenue model.
    relatedQuestionRefs:
      - QM025
  - type: enumeration-incomplete
    severity: minor
    topic: TAM/SAM/SOM or sizing lens
    missingEvidence: >-
      A single consistent dollar figure for serviceable obtainable market across small-to-mid RIAs is not available from
      public data.
    whyItMatters: The SOM tier of the sizing lens relies on firm-count proxies rather than dollars, weakening penetration math.
    diligencePath: Commission a segment-level custody-spend estimate by AUM band, or license Cerulli's RIA marketplace dataset.
    relatedQuestionRefs:
      - QM024
      - QM006
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: channel-aum
    missingEvidence: Reported asset bases conflict across lenses ($9.8T channel AUM vs $176.8T RAUM vs $128T framing).
    whyItMatters: Mixing these bases can inflate perceived market size; each measures a different population.
    diligencePath: Standardize on one definition (custody-eligible RIA client assets) before sizing penetration.
    relatedQuestionRefs:
      - QM022
  - type: private-evidence-only
    severity: material
    topic: intel-gap
    missingEvidence: >-
      Precise RIA-segment custody share, advisor counts and unit economics for private competitors (Apex, SEI,
      Betterment) are not publicly disclosed.
    whyItMatters: >-
      Without segment-level competitor economics, relative pricing power and margin durability cannot be benchmarked
      confidently.
    diligencePath: Acquire Cerulli/AdvizorPro custodian datasets and request management's competitive win/loss data.
    relatedQuestionRefs:
      - QP025
  - type: conflicting-data
    severity: minor
    topic: competitor scale metrics
    missingEvidence: Reported scale metrics mix RIA-specific and total-firm assets (e.g. Fidelity $17.9T AUA, Pershing $59.4T total).
    whyItMatters: Comparing total-firm assets to RIA-only metrics overstates incumbents' directly competitive scale.
    diligencePath: Isolate RIA-segment AUC for each incumbent from segment disclosures or analyst breakouts.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: margin-and-profitability
    missingEvidence: >-
      Altruist does not publicly disclose audited revenue, gross or contribution margin, EBITDA, or net income; only
      third-party estimates and company growth-rate framing exist.
    whyItMatters: >-
      Without margin and profitability data, revenue quality and the claimed path to profitability cannot be verified,
      which is central to valuation underwriting.
    diligencePath: >-
      Obtain audited financial statements and a management revenue model with margin by revenue line and a
      rate-sensitivity scenario.
    relatedQuestionRefs:
      - QI025
      - QI019
    relatedTableRefs:
      - TI005
  - type: missing-source
    severity: material
    topic: burn-and-runway
    missingEvidence: No public source discloses Altruist's monthly net burn or remaining cash runway.
    whyItMatters: >-
      Burn and runway determine financing dependency and the timing of the next raise, which affects dilution and
      downside risk.
    diligencePath: Request the cash-flow statement, monthly burn trend, and a runway bridge from management.
    relatedQuestionRefs:
      - QI026
    relatedTableRefs:
      - TI004
  - type: missing-source
    severity: material
    topic: sales-efficiency
    missingEvidence: Cohort-level CAC, LTV, and payback period for advisor acquisition are not publicly available.
    whyItMatters: Sales efficiency and payback drive the sustainability of the zero-core-fee, product-led growth model.
    diligencePath: Obtain cohort acquisition economics and channel-level CAC/payback from a diligence data room.
    relatedQuestionRefs:
      - QI027
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: technology-architecture
    missingEvidence: >-
      Detailed internal architecture of the in-house ledger and clearing system (design, latency, failover) is
      company-described but not independently verifiable.
    whyItMatters: >-
      The self-clearing ledger is the core technical moat and operational risk; without independent verification its
      resilience and scalability cannot be confirmed.
    diligencePath: >-
      Request an architecture review, SOC 2 report, and resilience/DR testing evidence under NDA during technical
      diligence.
    relatedQuestionRefs:
      - QE025
  - type: missing-source
    severity: minor
    topic: reliability-and-uptime
    missingEvidence: No quantified uptime SLA or historical incident-frequency data is published beyond the live status page.
    whyItMatters: Reliability is critical for a custodian of record; unmeasured uptime is a gap for operational underwriting.
    diligencePath: Obtain historical incident logs, uptime metrics, and SLA commitments from management.
    relatedQuestionRefs:
      - QE026
    relatedTableRefs:
      - TE004
  - type: missing-source
    severity: minor
    topic: security-certifications
    missingEvidence: Third-party security certifications such as SOC 2 or ISO 27001 are not confirmed in public sources.
    whyItMatters: >-
      Certifications provide independent assurance of security and AI-governance claims that are otherwise
      self-attested.
    diligencePath: Request current SOC 2 Type II and any ISO 27001 certificates and penetration-test summaries.
    relatedQuestionRefs:
      - QE027
    relatedTableRefs:
      - TE004
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof
    missingEvidence: >-
      The named-customer table is a sample of disclosed wins and case studies, not an exhaustive or representative
      census of Altruist's 4,700+ advisors.
    whyItMatters: >-
      A curated sample can overstate proof quality; without a representative customer list, reference strength and
      concentration cannot be fully assessed.
    diligencePath: >-
      Request a full customer reference list with AUM bands, tenure, and primary/secondary status under NDA, plus
      independent reference calls.
    relatedQuestionRefs:
      - QU006
      - QU008
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: blocking
    topic: retention-and-churn
    missingEvidence: >-
      No public source discloses Altruist's net revenue retention, gross retention, or cohort churn; the retention
      cohort figure is an illustrative proxy.
    whyItMatters: >-
      Retention is the core determinant of customer lifetime value and revenue durability for a custodian and cannot be
      underwritten from public data.
    diligencePath: Obtain audited cohort retention, NRR/GRR, and churn data from a management data room.
    relatedQuestionRefs:
      - QU025
      - QU026
    relatedTableRefs:
      - TU004
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue concentration among Altruist's largest customer firms is not disclosed.
    whyItMatters: >-
      Concentration risk (a few large firms driving disproportionate revenue) materially affects downside and
      negotiating leverage.
    diligencePath: Request top-10 and top-20 customer revenue shares and assets-by-firm distribution.
    relatedQuestionRefs:
      - QU027
      - QU012
    relatedTableRefs:
      - TU005
  - type: enumeration-incomplete
    severity: material
    topic: regulatory / legal risk register
    missingEvidence: >-
      The regulatory/legal risk register lists principal exposures but is not an exhaustive enumeration of every
      regulatory obligation or pending rule affecting Altruist.
    whyItMatters: >-
      Unlisted or emerging rules (e.g., specific state requirements, future PFOF/sweep rulemaking) could add material
      exposure not captured here.
    diligencePath: >-
      Commission a full regulatory-obligation inventory and pending-rulemaking review from securities counsel, plus
      BrokerCheck/IAPD pull.
    relatedQuestionRefs:
      - QR003
      - QR031
    relatedTableRefs:
      - TR001
  - type: access-blocked
    severity: material
    topic: private-risk-evidence
    missingEvidence: >-
      Exam results, internal incident and reconciliation logs, cyber test results, and any litigation are not publicly
      available.
    whyItMatters: >-
      These private records are where genuine regulatory, operational, and legal risk would first appear; their absence
      prevents full risk verification.
    diligencePath: Request exam letters, incident logs, pen-test summaries, and litigation schedules in a diligence data room.
    relatedQuestionRefs:
      - QR032
      - QR033
    relatedTableRefs:
      - TR002
  - type: missing-source
    severity: material
    topic: revenue-at-regulatory-risk
    missingEvidence: The revenue share derived from PFOF and cash interest—the lines most exposed to regulation—is not disclosed.
    whyItMatters: Without this share, the financial magnitude of a PFOF ban or sweep-rule change cannot be sized.
    diligencePath: Obtain a segment revenue breakdown isolating PFOF and net interest income from management.
    relatedQuestionRefs:
      - QR034
    relatedTableRefs:
      - TR005
  - type: enumeration-incomplete
    severity: material
    topic: comparable valuation table
    missingEvidence: >-
      The comparable valuation table samples principal private rounds, sector benchmarks, and public incumbents but is
