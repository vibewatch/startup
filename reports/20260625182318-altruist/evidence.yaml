    diligencePath: >-
      Commission an updated comparable analysis using current secondary-market pricing and recent private rounds from
      PitchBook, Sacra, and Forge.
    relatedQuestionRefs:
      - QV013
      - QV014
    relatedTableRefs:
      - TV004
  - type: missing-source
    severity: blocking
    topic: audited-revenue-for-entry-multiple
    missingEvidence: >-
      Altruist does not disclose audited revenue, margins, or free cash flow, so the entry multiple and profitability
      claim cannot be precisely verified.
    whyItMatters: >-
      The entire valuation conclusion hinges on the implied revenue multiple; without verified revenue the $1.9B mark
