  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: comparable valuation table
    missingEvidence: >-
      The comparable valuation table samples principal private rounds, sector benchmarks, and public incumbents
      but is not an exhaustive enumeration of every relevant comparable, and several private marks are
      dated to 2021.
    whyItMatters: >-
      A fuller, fresher comparable set would tighten the implied-multiple judgment and the relative-richness
      conclusion for Altruist's mark.
    diligencePath: >-
      Commission an updated comparable analysis using current secondary-market pricing and recent private
      rounds from PitchBook, Sacra, and Forge.
    relatedQuestionRefs:
    - QV013
    - QV014
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: blocking
    topic: audited-revenue-for-entry-multiple
    missingEvidence: >-
      Altruist does not disclose audited revenue, margins, or free cash flow, so the entry multiple and
      profitability claim cannot be precisely verified.
    whyItMatters: >-
      The entire valuation conclusion hinges on the implied revenue multiple; without verified revenue
      the $1.9B mark cannot be confidently underwritten.
    diligencePath: >-
      Request audited financial statements and a current revenue run-rate under NDA before committing
      capital.
    relatedQuestionRefs:
    - QV031
    - QV033
    relatedTableRefs:
    - TV003
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: >-
      The full cap table, liquidation-preference stack, and exact Series F terms are not publicly available.
    whyItMatters: >-
      Preference overhang and dilution materially affect common-equivalent returns and the achievable
      entry price via secondary.
    diligencePath: >-
      Obtain the cap table and preference schedule from the company or a secondary broker in a data room.
