company:
  name: Altruist
chapter:
  number: 8
  title: Valuation and Recommendation
  summary: >-
    Altruist's April 2025 Series F set a roughly $1.9B post-money valuation, which on company-stated but
    unaudited revenue of an estimated $100M-$200M implies a forward/trailing revenue multiple near 10x-19x—at
    or above the 8x-12x range for mission-critical wealthtech SaaS and a premium to re-rated private comparables
    like DriveWealth and Apex. The bull case underwrites continued triple-digit-trending growth toward
    $1B+ revenue and a late-decade IPO; the bear case sees a rich multiple, opaque profitability, incumbent
    dominance, and regulation-sensitive cash-sweep and PFOF revenue compressing returns. Because Altruist
    withholds audited revenue, the implied multiple—not the headline mark—is the crux. The recommendation
    is conditional: proceed with diligence at medium confidence and an elevated risk rating, target entry
    at or below the Series F mark via secondary, pre-commit to explicit thesis-break triggers, and gate
    any commitment on audited revenue, the full cap table, and segment economics.
sections:
- id: recommendation-and-thesis
  title: Recommendation, Thesis and Anti-thesis
  body: >-
    The overall recommendation on Altruist is conditional—proceed with diligence—carried at medium confidence
    with an elevated risk rating. The investment thesis is straightforward and attractive: the RIA-custody
    market is large and growing, advisor breakaways from wirehouses provide a structural tailwind, Altruist
    offers a modern all-in-one self-clearing platform differentiated by its Hazel AI paraplanner, and
    it has reached roughly 4,700 advisors and the number-three position by firms served while compounding
    revenue at triple-digit rates. Against that, the anti-thesis is equally concrete. The roughly $1.9B
    Series F mark implies an estimated 10x-19x revenue multiple that sits at or above the wealthtech SaaS
    comparable range, the company discloses no audited revenue so profitability is asserted rather than
    verified, incumbents led by Schwab dominate custody while multi-custody adoption caps share-of-wallet,
    and the most valuable revenue lines—cash-sweep net interest margin and payment for order flow—are
    precisely where regulatory scrutiny is intensifying. The October 2025 layoffs, while framed as a march
    to profitability, hint at burn pressure. The recommendation therefore hinges on entry discipline:
    underwrite the growth, but gate any commitment on disclosure of audited revenue, the full cap table,
    and segment economics, and enter only at or below the Series F mark.
  claimRefs:
