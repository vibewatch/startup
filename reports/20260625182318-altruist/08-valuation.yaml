- id: financing-and-entry
  title: Financing Context, Entry Discipline and Overhang
  body: >-
    Altruist's $152M Series F closed in April 2025 led by GIC at an approximately $1.9 billion post-money
    valuation, with participation from Salesforce Ventures, Geodesic Capital, Baillie Gifford, Carson
    Family Office, and ICONIQ Growth, bringing cumulative capital raised to more than $600 million. The
    balance sheet is solid for a self-clearing broker-dealer: Altruist reported about $63.5M of net capital
    at June 2025, roughly 11,381% of the regulatory minimum, and management has positioned recent rounds
    as the last capital the company expects to need while asserting a path to cash-flow profitability.
    Entry discipline matters because the headline mark is rich. A disciplined investor would target pre-IPO
    secondary exposure at or below the Series F valuation, since near-term liquidity for early holders
    is most plausibly via secondary rather than an IPO or acquisition. Two overhang risks require attention.
    First, down-round risk is real: a roughly $1.9B mark against undisclosed profitability could re-rate
    lower if growth decelerates or capital markets tighten, as several private comparables have already
    re-rated. Second, successive priced rounds create liquidation-preference and dilution overhang that
    can erode common-equivalent returns, so the full cap table and preference stack must be reviewed before
    sizing any position. Neither is disqualifying, but both argue for price discipline and structural
    protection.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV020
