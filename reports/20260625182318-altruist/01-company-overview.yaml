company:
  name: Altruist

chapter:
  number: 1
  title: Company Overview
  summary: >-
    Altruist is a vertically integrated RIA custodian founded in 2018 by Jason Wenk, combining self-clearing
    brokerage, custody, and advisory software into a single platform. Having raised over $602 million across six rounds
    through April 2025—most recently a $152 million Series F at a $1.9 billion valuation—Altruist is now the
    third-largest RIA custodian by firm count, serving more than 4,700 advisory firms as of Q2 2025.

sections:
  - id: identity-and-mission
    title: Identity and Mission
    body: >-
      Altruist Corp is a Delaware-incorporated financial technology company headquartered in Culver City, California
      (3030 S La Cienega Blvd, Culver City, CA 90232). Founded in 2018 by Jason Wenk, the company operates under
      two registered subsidiaries: Altruist Financial LLC, a FINRA/SIPC member self-clearing broker-dealer, and
      Altruist LLC, an SEC-registered investment adviser. The company's mission is to make financial advice better,
      more affordable, and accessible to everyone by providing independent RIAs with modern custodial infrastructure
      and integrated advisory technology. Unlike legacy custodians, Altruist built its platform from the ground up
      exclusively for the RIA market, combining clearing, custody, portfolio management, trading, reporting, billing,
      and tax management into one solution—eliminating the need for multiple third-party software integrations.
      As of June 2025, Altruist holds net capital of $63.5 million (11,381% of its regulatory minimum), reflecting
      a financially stable operating base. The company is regulated by the SEC, FINRA, OCC, and 53 states and
      territories. Altruist generates revenue through software subscriptions from RIA firms, transaction fees,
      payment for order flow, cash interest income, and model marketplace fees.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO008]
    tableRefs: [TO001]
    figureRefs: [FO002]

  - id: founding-and-leadership
    title: Founding Story and Leadership Team
    body: >-
      Jason Wenk, founder and CEO, is an industry veteran who began his career at Morgan Stanley at age 20,
      working on investment research and asset management systems. He subsequently founded Retirement Wealth Advisors
      in 2004, which grew to $100 million AUM, and then FormulaFolios, which became the fastest-growing RIA
      organically in history—reaching nearly $4 billion AUM in six years and appearing on the Inc. 500 list four
      years running (peak ranking: #10 in 2017). Wenk was named an EY Entrepreneur of the Year in 2018 and
      selected as an Endeavor Entrepreneur in 2017. Altruist was founded in 2018 and publicly launched in 2019.
      The current leadership team includes Rich Rao (Chief Business Officer, joined March 2025, formerly of
      Google, Meta, and Intuit), Sumanth Sukumar (Chief Technology Officer, recently appointed), Mazi Bahadori
      (Chief Compliance Officer and EVP of Operations, founding team), Harpreet Ahluwalia (Chief Product Officer),
      Pete Dorsey (Chief Strategy and Revenue Officer), and Piret Loone (General Counsel, appointed 2025).
      The company has approximately 908–1,039 employees as of mid-2026. Wenk has noted this will be Altruist's
      last funding round for the foreseeable future, positioning the company for either sustained private operation
      or a future IPO without additional capital raises. Brandon Golden, Ben Mizes, and Erin Hager were referenced
      in the initial brief but could not be verified as Altruist executives in public sources; these names do not
      appear in any Altruist press releases or leadership announcements reviewed during this research.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014, CO015, CO016, CO017]
    tableRefs: [TO002]
    figureRefs: []

  - id: funding-and-investors
    title: Funding History and Investor Base
    body: >-
      Altruist has raised over $602 million in total venture capital across six rounds since 2019. The Series A
      ($8.5 million, 2019, led by Venrock) established the foundational investor base with Bill McNabb (former
      Vanguard CEO) and Ron Carson (Carson Group founder) as personal investors. The Series B ($50 million, May 2021,
      led by Insight Partners) added Vanguard as a strategic institutional investor—notable as Vanguard was expanding
      its RIA channel focus. The Series C ($110 million, November 2021, led by Declaration Partners) was previously
      undisclosed until the Series D announcement. The Series D ($112 million, April 2023, led by Insight Partners
      and Adams Street Partners) came immediately after the SSG acquisition and the Altruist Clearing launch, cementing
      Altruist as the third-largest custodian by firm count. The Series E ($169 million, May 2024, led by ICONIQ Growth
      with Granite Capital and Sound Ventures) elevated the valuation to over $1.5 billion. The Series F ($152 million,
      April 2025, led by GIC Singapore's sovereign wealth fund) with Salesforce Ventures, Baillie Gifford, Geodesic
      Capital, Carson Family Office, and ICONIQ Growth reaching a $1.9 billion post-money valuation—bringing total
      raised to approximately $602 million. CEO Wenk stated this would be the company's last needed round.
    claimRefs: [CO018, CO019, CO020, CO021, CO022, CO023, CO024, CO025, CO026]
    tableRefs: [TO003]
    figureRefs: []

  - id: business-model-and-platform
    title: Business Model and Platform
    body: >-
      Altruist's vertically integrated platform bundles clearing, custody, account opening, fractional share trading,
      portfolio rebalancing, performance reporting, fee billing, and tax management software into a single solution
      for independent RIAs. The company's business model generates revenue from RIA platform subscription fees,
      transaction-based charges on certain securities types, payment for order flow on equity trades, interest on
      customer cash balances, a Model Marketplace Fee (0%–1% annually) for advisors using Altruist Portfolios or
      third-party portfolios, and a Tax Management Fee for use of tax optimization tools. Altruist eliminated
      software subscription fees for many core functions to lower barriers to entry for smaller RIAs—a deliberate
      strategy to build market share. The company also offers a high-yield cash product paying competitive APY rates
      and a fully digital fixed-income trading platform launched in 2024. The Hazel AI paraplanner platform—launched
      in early 2026—represents a strategic expansion into AI-powered advisory tools that integrate with CRM and
      custodial data. Salesforce Ventures' participation in the Series F reflects strategic alignment: Salesforce
      Ventures invested because Altruist's data integrations with Salesforce CRM are central to the Hazel AI
      workflow. As of 2025, Altruist supports account types including individual, joint, trust, IRA, and business
      accounts, with options and margin account support through its legacy Pershing relationship (inherited from SSG).
    claimRefs: [CO027, CO028, CO029, CO030, CO031, CO032]
    tableRefs: []
    figureRefs: [FO003]

  - id: scale-and-milestones
    title: Company Scale and Key Milestones
    body: >-
      Altruist has achieved substantial scale since its 2019 public launch. As of the April 2025 Series F, the
      company serves more than 4,700 advisory firms—including more than 3,150 RIA firms representing over 10% of the
      total U.S. RIA market by firm count. By mid-2026, industry estimates place the advisor count above 5,500.
      Assets under management tripled in both 2022 and 2023; the company reported triple-digit revenue growth in
      2024, with revenue growing 550% in 2023 and 1,700% in 2022. Average advisor firm size grew 43% year-over-year
      through 2024, signaling migration of larger advisory firms to the platform. The 2025 T3/Inside Information
      Software Survey ranked Altruist as a T3 Software All-Star in five categories (custody, portfolio management,
      trading/rebalancing, billing, and cash management) and reported a market share increase from 2.85% to 6.25%.
      The March 2023 acquisition of Shareholders Service Group (SSG, 1,600+ advisors, founded 2002) added
      significant scale and talent while maintaining the SSG relationship with Pershing for advisor continuity.
      Altruist's launch of its self-clearing infrastructure (Altruist Clearing) in early 2023 made it the only
      full-service custodian built exclusively from the ground up for the RIA market—a key competitive differentiator.
    claimRefs: [CO033, CO034, CO035, CO036, CO037, CO038, CO039]
    tableRefs: [TO004]
    figureRefs: [FO001]

