      - number: '5.2'
        title: 技术与运营架构
        blocks:
          - type: paragraph
            body: >-
              Altruist 的运营模式围绕自清算 broker-dealer 构建：它不通过第三方清算公司路由托管和结算，
              而是直接结算交易，并维护自有内部账本，作为头寸、余额、交易和公司行动的记录系统。该账本是业务的技术核心， 也是实时对账和工作流自动化的基础。其上是一层云原生软件，覆盖开户、交易、再平衡、报告和计费；再上面是 AI
              层 Hazel， 它通过 2025 年 11 月上线的行业首个集成，获得托管数据的实时访问。平台开放 API，并与 CRM 和其他 fintech 工具集成超过二十项。 运营上，架构依赖外部 rails：现金
              sweep 和 FDIC 容量依靠 program banks，订单路由和订单流支付依靠做市商， 托管依靠云基础设施，Hazel 推理依靠大语言模型供应商；所有这些都运行在 FINRA 成员、SIPC
              保护、SEC 监管的托管体系内。 这种纵向整合既是产品效率优势的来源，也集中了一组关键依赖；技术尽调必须验证这些依赖，因为内部设计来自公司描述， 而非独立文件证明。
