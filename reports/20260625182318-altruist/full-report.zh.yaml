        blocks:
          - type: paragraph
            body: >-
              对 Altruist 的总体建议是有条件推进尽调，置信度为中等，风险评级偏高。投资论点直接且有吸引力：RIA 托管市场大且在增长，顾问从 wirehouse 出走提供结构性顺风，Altruist
              提供现代化一体化自清算平台，并以 Hazel AI paraplanner 做出差异化；公司已触达约 4,700 名顾问，按服务公司数位居第三，收入还以三位数速度复合增长。反论点同样具体。约 $1.9B 的
              Series F 估值意味着估算 10x–19x 收入倍数，位于或高于 wealthtech SaaS 可比区间；公司没有披露经审计收入，盈利能力只是声称而非验证；Schwab 领衔的 incumbent
              主导托管市场，多托管采用限制钱包份额；最有价值的收入线——现金 sweep 净息差和订单流付款——正是监管审查加强的地方。2025 年 10 月裁员虽被包装为迈向盈利，但暗示 burn
              压力。因此，建议取决于进入纪律：承销增长，但任何承诺都要以披露经审计收入、完整 cap table 和分部经济性为前提，并且只在不高于 Series F 估值时进入。
