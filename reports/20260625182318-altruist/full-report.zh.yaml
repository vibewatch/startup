      - number: '1.3'
        title: 融资历史与投资人基础
        blocks:
          - type: paragraph
            body: >-
              自 2019 年以来，Altruist 通过六轮融资累计募集超过 $602M 风险资本。Series A（$8.5M，2019 年， Venrock 领投）奠定了基础投资人阵容，Bill McNabb（前
              Vanguard CEO）和 Ron Carson（Carson Group 创始人） 以个人身份投资。Series B（$50M，2021 年 5 月，Insight Partners 领投）引入
              Vanguard 作为战略机构投资人； 当时 Vanguard 正在加大 RIA 渠道投入，这一点值得注意。Series C（$110M，2021 年 11 月，Declaration Partners 领投）
              直到 Series D 公告时才首次披露。Series D（$112M，2023 年 4 月，Insight Partners 和 Adams Street Partners 领投） 紧接 SSG 收购和
              Altruist Clearing 上线之后完成，巩固了 Altruist 按公司数量计第三大托管机构的位置。 Series E（$169M，2024 年 5 月，ICONIQ Growth 领投，Granite
              Capital 和 Sound Ventures 参与） 把估值推高到超过 $1.5B。Series F（$152M，2025 年 4 月，由新加坡主权财富基金 GIC 领投）， Salesforce
              Ventures、Baillie Gifford、Geodesic Capital、Carson Family Office 和 ICONIQ Growth 参与， 投后估值达到 $1.9B，累计融资约
              $602M。CEO Wenk 表示，公司所需的最后一轮融资已经完成。
