  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              从客户工作流看，Altruist 是 RIA 用来在一个地方跑完整投资运营的系统。顾问通过无纸化开户和 ACATs 为客户开户并入金，
              覆盖三十多种账户类型，往往几分钟完成；随后用免佣碎股交易、智能订单路由，以及覆盖数百个模型的模型市场来构建和再平衡组合。 持续运营中，同一平台处理业绩报告、一体化费用计费，以及 Web
              和移动端的联合品牌客户门户；通过一体化高收益 sweep 管理现金； 并运行从自动税损收割到 AI 生成税务计划的税务工作流。Hazel 叠加在这一切之上：这是一个 AI 副规划师， 通过调用邮件、文件、CRM
              数据和实时托管数据，帮助顾问准备会议、总结讨论、起草跟进，并浮现 next-best actions。 产品的核心主张是整合：上述每个工作流，都替代了传统设置中由托管机构和一个或多个第三方供应商拆分完成的任务，
              把集成负担压缩进一个纵向整合平台，以及统一的顾问和客户体验。
