      - number: '8.4'
        title: 退出准备度、论点破裂触发器与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              退出准备度是长周期命题。Altruist 的 IPO 被广泛描述为还有多年，预期指向 2020 年代末或 2030 年代初；CEO Jason Wenk 设定的内部门槛是年收入超过 $1B、GAAP
              盈利达到数亿美元，并在上市前维持 35% 以上增长。M&A 退出基本不在台面上：Wenk 曾说自己永远不会出售，且只有超大型 incumbent 能吞下公司，这会引发反垄断审查。因此，IPO
              是首选退出，二级销售则是现实的近期流动性路径，意味着要持有多年。基于这种画像，投资人进入前应预先承诺明确的 thesis-break 触发器：持续增长放缓到约 35% 以下、PFOF 禁令或现金 sweep
              披露规则导致收入实质下降、down round 或惩罚性融资条款、失误后顾问大规模流失、盈利路径重大滑坡，或 IPO 被推迟到 2030
              年代初以后。同样重要的是最终尽调问题，它们瞄准公开来源缺失的私有证据：经审计收入和利润率，用来锁定进入倍数；完整 cap table 及优先权，用来量化悬顶；流失和净收入留存数据，用来验证耐久性；暴露于 PFOF
              和现金利息的分部收入；runway 和 burn 时间表；以及二级市场条款与定价。答案满意，才会把有条件建议转化为有纪律进入；如果没有答案，就是继续等待的理由。
