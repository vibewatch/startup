      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Altruist 运营两个受监管实体——自清算 broker-dealer、FINRA/SIPC 成员 Altruist Financial LLC，以及 SEC 注册投资顾问 Altruist LLC（CRD
              299398）。这种双重结构要求公司在 Reg BI 和受托责任标准下，谨慎管理经纪与顾问角色之间的冲突，并通过 Form CRS 和 Form ADV 披露。最尖锐的监管敞口在收入模型。SEC 和 FINRA
              加强了对现金 sweep 项目的审查，重点包括收益率披露、利益冲突，以及客户是否因公司利益受损；Altruist 从被 sweep 的客户现金中赚取净息差。订单流付款是 Altruist 披露的收入来源，仍处在
              SEC 高强度审查下，可能被限制甚至彻底禁止，直接威胁这条收入线。自约 2023 年 4 月成为自清算托管方以来，Altruist 还承担 custody rule 下保护资产、提供必要报表和审计的义务。2024
              年 4 月收费事件——新 IRA 费用被顾问称为掠夺性收费，随后公司撤回——说明披露和沟通失误会带来法律与声誉风险。公开渠道没有披露针对 Altruist
              的重大执法行动，但没有公开行动并不等于没有风险，BrokerCheck 和 IAPD 仍是核验状态的渠道。SEC 现在的检查重点覆盖 sweep、PFOF、托管和营销，每一项都与 Altruist 直接相关。
