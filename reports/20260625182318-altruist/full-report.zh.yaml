              Altruist 的资产负债表是明确优势。其 broker-dealer 实体 Altruist Financial LLC 在 2025 年 6 月 30 日报告约 $63.5M 监管净资本，约为最低要求的
              11,381%，显示近期偿付能力强；但实体层面的这一指标本身并不能证明集团盈利。 公司自 2018 年以来募集超过 $600M，最近一轮是 2025 年 4 月由主权投资者 GIC 领投、估值约 $1.9B 的
              $152M Series F， Salesforce Ventures、Baillie Gifford、ICONIQ Growth、Geodesic Capital 和 Carson Family Office
              参与； GIC 长周期领投释放出机构信心。因此融资依赖看起来可控：较大净资本缓冲加近期融资，说明除非出现严重下行，runway 应该充足， 尽管准确 burn 和 runway
              未披露。财务结论偏正面但有混合性：收入快速增长，公司资本充足；但收入质量依赖未披露、 对利率敏感的现金经济，利润率、burn 和 cohort 经济无法验证。主要尽调阻塞项是经审计财务、利润率和收入组合拆分、
              burn-and-runway 桥，以及利率敏感性模型；承销盈利路径前，每一项都必须拿到。
