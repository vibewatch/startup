companyProfile:
  summary: >-
    Altruist 是一家洛杉矶地区金融科技公司，正在为独立 RIA 打造现代托管机构。公司由连续创业者 Jason Wenk 于 2018 年创立， 把自清算券商（Altruist Financial
    LLC，FINRA/SIPC）、SEC 注册投资顾问（Altruist LLC）， 以及完整顾问软件套件——交易、再平衡、业绩报告、费用计费和税务管理——纵向整合进一个专为独立财务顾问打造的平台。 到 2025 年 4
    月，Altruist 已经通过六轮融资募集约 $602M，估值达到 $1.9B，服务 4,700 多家顾问公司 （按公司数量计市场份额超过 10%），成为仅次于 Schwab 和 Fidelity 的第三大 RIA 托管机构。AUM
    已连续两年增长三倍。 2026 年推出的 Hazel AI 是由 Anthropic 模型驱动、并集成 Salesforce CRM 的 AI 副规划师， 标志着 Altruist 从纯托管扩展到 AI 驱动的顾问工具。
