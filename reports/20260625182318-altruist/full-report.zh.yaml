      - number: '6.3'
        title: 留存、满意度与耐久性
        blocks:
          - type: paragraph
            body: >-
              留存和耐久性是客户故事里证据最弱的一块。正面看，托管关系切换成本高——重新签署文件、迁移数据、承担运营风险——一旦公司把 Altruist 作为主托管方，结构上有利于留存；平台在部分评论聚合站也拿到很高分（约
              4.8 到 5.0 / 5）。负面看，图景分裂明显：一些独立评论网站给 Altruist 的评分接近 2.7 / 5，只有约 43%
              的评论者推荐；个别评论者称访问账户或提取资金困难，但普遍程度不清楚。最具体的耐久性事件是 2024 年 4 月新 IRA 维护和转换费用公告，顾问称其掠夺性收费，Altruist
              承认是沟通失误，并在反弹后撤回——即使撤销，信任也已受损。关键是，Altruist 没有披露量化的净收入留存、总留存或 cohort 流失率，所以这里的留存 cohort
              只是示意性代理，反映的是切换成本带来的粘性，不是实测数据。2025 年 10 月裁员进一步让外界质疑，客户基数扩大后支持能力能否跟上。因此，留存耐久性仍是推断出来的，而非已经证明。
