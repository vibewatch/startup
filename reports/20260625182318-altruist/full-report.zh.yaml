      - number: '6.4'
        title: 扩张与集中风险
        blocks:
          - type: paragraph
            body: >-
              Altruist 的扩张动作真实且多线并行：现有公司会随时间把更多 AUM 迁到平台上，公司也向存量客户交叉销售新模块——最显眼的是 Hazel AI，约 1,600
              家公司在一个月内订阅，后续管线管理被描述为每月再增加约 1,500 名顾问。这种落地后扩张，把更深的资产迁移和模块加售结合起来，是单客收入的重要驱动。抵消项是集中度和钱包份额。近 30% 的 RIA
              现在使用两个或更多托管方，Altruist
              往往先作为次级托管方切入，必须把这些关系转成主托管方才能拿到完整钱包份额；转化率未披露。客户集中度也不透明：CWM（$26.8B）这样的大型采用者证明了上行市场牵引力，但也会以未公开量化的方式集中收入；渠道对周期性的
              breakaway 和新 RIA 成立也有依赖，带来波动。叠加收费争议留下的信任影响和裁员后的服务能力疑问，客户集中度、主托管转化率和留存数据，是尽调在承销可持续扩张前最需要拿到的客户侧材料。
