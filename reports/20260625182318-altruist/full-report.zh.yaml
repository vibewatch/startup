  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价与变现
        blocks:
          - type: paragraph
            body: >-
              Altruist 的收入模式建立在变现托管关系上，而不是对软件收费。2024 年 “Simply Better Pricing” 调整后， 核心托管和顾问平台不收软件费，美国股票和 ETF
              交易免佣。Altruist 主要通过四类来源赚钱： 客户现金存放在 sweep accounts 的净利息、全额付清证券借贷、订单流支付，以及一层较薄的订阅和资产类费用。 2024 年 3 月上线时宣传
              5.10% APY 的高收益现金账户，展示了核心张力：Altruist 向客户让渡的收益越多， 自己保留的净利差越窄，因此该模式有意用每美元利差换资产汇集和关系深度。叠加其上的还有 premium
              Altruist One 订阅 （每 household 每月约 0.01%）、每月约 10–12 个基点的模型市场费用、前 100 个以外连接第三方账户每月 $1 的定价， 以及正在出现的 Hazel AI
              订阅线。由于现金利息占主导且对利率敏感，收入质量与当前短端利率、以及 Altruist 在客户收益率上竞争多激进密切绑定。
