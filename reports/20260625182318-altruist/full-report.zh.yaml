      - number: '1.2'
        title: 创业故事与领导团队
        blocks:
          - type: paragraph
            body: >-
              创始人兼 CEO Jason Wenk 是行业老兵，20 岁进入 Morgan Stanley，参与投资研究和资产管理系统。 他随后在 2004 年创办 Retirement Wealth Advisors，并把
              AUM 做到 $100M；之后创办 FormulaFolios， 该公司成为史上有机增长最快的 RIA，六年内 AUM 接近 $4B，并连续四年入选 Inc. 500 （最高排名：2017 年第 10）。Wenk
              在 2018 年获评 EY Entrepreneur of the Year，并在 2017 年入选 Endeavor Entrepreneur。 Altruist 于 2018 年创立，2019
              年公开上线。现任领导团队包括 Rich Rao（首席商务官，2025 年 3 月加入， 曾任职 Google、Meta 和 Intuit）、Sumanth Sukumar（首席技术官，近期任命）、Mazi
              Bahadori （首席合规官兼运营 EVP，创始团队成员）、Harpreet Ahluwalia（首席产品官）、Pete Dorsey （首席战略和收入官）以及 Piret Loone（总法律顾问，2025
              年任命）。截至 2026 年中，公司约有 908–1,039 名员工。 Wenk 表示，这将是 Altruist 在可预见未来的最后一轮融资，公司将走向持续私营运营，或在不再融资的情况下未来 IPO。
              初始简报提到 Brandon Golden、Ben Mizes 和 Erin Hager，但公开来源无法核实他们是 Altruist 高管； 在本次研究审阅的任何 Altruist
              新闻稿或领导层公告中，都没有出现这些姓名。
