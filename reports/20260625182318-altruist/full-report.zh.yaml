              Altruist 公开增长叙事，但不公布经审计财务，导致公开牵引信号和可核实指标之间有很大缺口。 公开侧，公司称 2024 年收入、券商账户和服务顾问数均实现三位数增长；报告 AUM 截至 2024
              年连续两年增长三倍； 在 2025 年 4 月 Series F 时服务超过 4,700 名顾问；并表示 2026 年“breakout”年份实际运行约为预期增长轨迹的 140%。 第三方追踪还给出约 $193M
