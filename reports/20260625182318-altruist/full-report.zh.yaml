      - number: '1.6'
        title: 展示
        blocks:
          - type: callout
            title: 纵向整合护城河
            body: >-
              Altruist 是第一家、也是唯一一家专为 RIA 打造的托管机构，把自清算、托管和完整顾问软件套件——交易、 再平衡、计费和税务管理——整合进单一平台。这种纵向整合消除了第三方软件带来的碎片化，
              相比传统托管机构和单点软件供应商，形成结构性成本优势和切换成本优势。2023 年 Altruist Clearing 上线后， 这套整合在技术上补齐。
            calloutType: strength
            claimRefs:
              - CO027
              - CO028
              - CO036
              - CO037
          - type: callout
            title: 身份混淆与竞争批评
            body: >-
              WealthManagement.com 在 2021 年发表的一篇批评性文章（"Altruist's $50 Million Investment Raises Eyebrows and
              Questions"）记录了行业对 Altruist 身份和战略的显著混淆：它到底是 TAMP、托管机构，还是纯技术叠加层。 批评者指出，早期公司依赖 Apex
              Clearing（第三方）而不是自清算；也有顾问担心 Apex 迁移期间的平台稳定性。 2023 年收购 SSG 也引发行业策略师 Tim Welsh 质疑，他质疑服务小型顾问的经济性。虽然后续产品执行
              （Altruist Clearing、Series D/E/F 增长）部分回应了这些担忧，但 Schwab 和 Fidelity 的持续竞争压力仍是长期平台差异化的核心风险； 两者合计 R&D 预算远高于
              Altruist 的估值。
            calloutType: risk
            claimRefs:
              - CO040
              - CO041
              - CO042
          - type: callout
            title: GIC 领投释放机构信心
            body: >-
              GIC（新加坡主权财富基金）领投 Series F 是一个重要信号。主权财富基金参与后期私募轮，说明机构看好公司长期位置， 也隐含推动公司以更有纪律的路径走向盈利或 IPO。GIC 私募股权 CIO
              明确把管理团队和顾问基础设施现代化作为投资理由， 说明其回报周期是多年维度，也与 Altruist CEO 公开承诺不再需要融资相吻合。
            calloutType: insight
            claimRefs:
