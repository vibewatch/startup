      - number: '1.4'
        title: 商业模式与平台
        blocks:
          - type: paragraph
            body: >-
              Altruist 的纵向整合平台把清算、托管、开户、碎股交易、组合再平衡、业绩报告、费用计费和税务管理软件， 打包成面向独立 RIA 的单一方案。公司的商业模式来自 RIA 平台订阅费、特定证券类型的交易类收费、
              股票交易订单流支付、客户现金余额利息、顾问使用 Altruist Portfolios 或第三方组合时收取的 Model Marketplace Fee （每年 0%–1%），以及使用税务优化工具的 Tax
              Management Fee。Altruist 取消了许多核心功能的软件订阅费， 以降低小型 RIA 的进入门槛；这是有意建立市场份额的策略。公司还提供支付有竞争力 APY 的高收益现金产品， 并在 2024
              年推出全数字化固定收益交易平台。2026 年初上线的 Hazel AI 副规划师平台， 标志着公司战略性扩展到与 CRM 和托管数据集成的 AI 顾问工具。Salesforce Ventures 参与
              Series F 体现了战略契合： 其投资 Altruist，是因为 Altruist 与 Salesforce CRM 的数据集成处在 Hazel AI 工作流的核心。 截至 2025 年，Altruist
              支持个人、联名、信托、IRA 和企业账户等账户类型，并通过继承自 SSG 的传统 Pershing 关系， 支持期权和保证金账户。
