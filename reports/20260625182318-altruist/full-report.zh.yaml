      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              几个结构性驱动因素会在 2026 年前扩大可寻址市场。顾问队伍老龄化将在未来十年带来超过 26,000 人退休， 注入超过 $2.5T 资产的传承和 breakaway
              管道；数万亿美元的代际财富转移则利好下一代客户偏好的数字优先平台。 RIA 渠道在顾问资产中的份额上升、接近 $4T 的加速并购，以及技术和 AI 被提升为托管机构选择的主要标准， 都有利于现代化、只服务 RIA
              的新进入者。但这些顺风之外也有真实约束。切换成本——数据迁移、客户重新签署文件和运营风险—— 放慢了对 incumbents 的替代，并保护 Schwab 超过 58% 的位置和 Fidelity
              的存量基础。费用压缩到约 0.85%–1.0%， 挤压顾问利润率（提高对低成本托管的需求，也挤压整条价值链）；SEC 对托管、营销和网络安全的审查强化，
              也以可能利好规模化玩家的方式推高合规成本。资产高度集中——约 2% 的公司控制 54% 资产——意味着赢下中小公司会更快推动 logo 增长， 而不是资产份额。总体判断是，市场确实在增长，但可变现规模和
              Altruist 可获得份额仍被不兼容的测算口径部分遮住。
