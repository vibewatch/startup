        title: 差异化、信任、安全与合规
        blocks:
          - type: paragraph
            body: >-
              Altruist 的差异化建立在现代、只服务 RIA、云原生且原生 AI 的技术栈上，与 incumbents 更老旧、更碎片化的架构形成对比； 专有托管数据集成给 Hazel 带来 standalone
              记录工具和规划工具无法匹配的信息优势。在信任和合规上， 平台以 FINRA 成员身份运营，并受 SIPC 保护，托管受 SEC 规则约束；公司描述其加密、数据保护控制和 AI 治理姿态：
              客户数据永不用于训练模型，Hazel 满足零数据保留协议。实质弱点在可验证性：这些保证大多是自我陈述。 本次审阅的公开来源未确认 SOC 2 或 ISO 27001 认证，检查结果不公开，也没有量化可靠性
              SLA。 架构集中依赖有限数量的 program banks、做市商、云服务商和 LLM 供应商，增加单点故障风险。总体判断是， 产品确实差异化、推进很快，技术和安全主张可信，但在承销前应独立验证：取得 SOC
              2 报告，审阅架构和韧性， 并确认 AI 治理控制。
