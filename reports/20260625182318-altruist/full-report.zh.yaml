      - number: '2.3'
        title: 买方、用户、付费方与分层
        blocks:
          - type: paragraph
            body: >-
              RIA 托管采购由公司负责人决定：小公司是创始人顾问，中型公司是 principal 或 COO，大型 RIA 则是投资或运营委员会。 用户是每天在平台里工作的顾问团队和运营人员；付费方是 RIA
              公司本身，不过托管机构经济性（现金利差、交易收费、订单流支付） 实际上会把部分成本传导给终端客户。不同分层的行为差异很大：中小 RIA 是约 16,500 家公司的主体，
              它们看重成本、简单性和现代用户体验，也是挑战者托管机构的核心采用群体；大型 RIA 仍因服务深度和冗余而锚定 Schwab 和 Fidelity， 并越来越多地采用多托管。新成立 RIA 往往默认选择
              Schwab，因为迁移经验更熟悉，这抬高了挑战者争夺首个托管机构决策的门槛。 采用路径通常从认知、评估、试用或二级托管切入、资产迁移和重新签署文件，最后到主托管采用；每个阶段都会流失公司，
              其中迁移摩擦造成的掉队最明显。多托管现在已被近 30% 的 RIA 采用，给 Altruist 作为二级托管机构切入、再争取主托管地位提供了现实入口。
