      - number: '1.5'
        title: 公司规模与关键里程碑
        blocks:
          - type: paragraph
            body: >-
              自 2019 年公开上线以来，Altruist 已经做到相当规模。到 2025 年 4 月 Series F 时， 公司服务超过 4,700 家顾问公司，其中包括 3,150 多家 RIA
              公司，按公司数量计占美国 RIA 市场总量的 10% 以上。 到 2026 年中，行业估计顾问数量已超过 5,500。2022 年和 2023 年，管理资产均增长三倍； 公司披露 2024
              年收入实现三位数增长，其中 2023 年收入增长 550%，2022 年增长 1,700%。 到 2024 年，平均顾问公司规模同比增长 43%，显示更大型顾问公司正在迁入平台。 2025 年 T3/Inside
              Information Software Survey 将 Altruist 评为五个类别的 T3 Software All-Star （托管、组合管理、交易 / 再平衡、计费和现金管理），并报告其市场份额从
              2.85% 升至 6.25%。 2023 年 3 月收购 Shareholders Service Group（SSG，1,600 多名顾问，成立于 2002 年） 带来显著规模和人才，同时保留 SSG 与
              Pershing 的关系，以保障顾问连续性。Altruist 在 2023 年初上线自清算基础设施 （Altruist Clearing），使其成为唯一一家完全从零开始、专为 RIA
              市场打造的全服务托管机构，这是关键竞争差异。
