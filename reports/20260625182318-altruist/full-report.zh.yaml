      - number: '7.3'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              运营上，自清算把结算、对账和记录维护责任集中在 Altruist 内部，而不是第三方清算公司；公司换来更多控制权和经济性，也抬高了运营风险。Altruist
              是记录托管方，平台宕机、结算失败或网络安全事件的影响会很严重——客户资产和信任直接押在上面——但公开可见的可靠性只有实时状态页，没有量化 uptime SLA，也没有发布的事故历史。托管客户现金和证券也让
              Altruist 成为高价值网络攻击目标，数据保护风险上升；公司描述了加密和控制措施，但没有公开确认的 SOC 2 或 ISO 27001 认证。Hazel 接入实时托管和客户数据，又增加 AI
              治理和隐私风险；Altruist 以零数据保留、不用于模型训练的承诺应对，但这些承诺仍属自我证明。2025 年 10 月裁掉约 50 名员工，让客户基数扩张时的服务质量和支持能力受到质疑；2026
              年新增保证金融资和期权，又引入新的信用与损失敞口，控制措施尚未被证明。因此，质量和安全风险既在结构上偏高，在若干方面也只能靠私有证据核验。
