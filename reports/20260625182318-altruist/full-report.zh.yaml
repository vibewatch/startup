              Wonder Investments、VIP Wealth Advisors
              等较小公司提供了案例和客户自述证据。证据既有公司筛选的顾问故事，也有独立新闻和第三方排名，可信度因此更强；但具名集合仍只是更大客户基数的样本，不是代表性普查，而且几个最强 logo
