              和回本周期均未披露。 结果是，承销方用来评估收入质量的几乎每个数字，要么是外部估计，要么不可获得。这一缺口是公司现阶段最鲜明的财务特征： 方向性动能强，但一手财务透明度有限，显著提高了尽调 data room
