              Altruist 的 go-to-market 主要是产品驱动和自助式：低摩擦开户、免费核心软件，以及顾问病毒式采用 （最醒目的是一个月内 1,600 家公司订阅 Hazel
              AI）替代了重型企业销售队伍，支撑了有利的渠道经济性。 成本侧，Altruist 是自清算 broker-dealer；相比 introducing broker，这种结构提高了营运资本和资本强度要求，
              但也能捕获每个账户更多经济性。公开单位经济代理指标很少，且主要来自估计：第三方追踪机构把 2024 年收入估在约 $193M （高于 2023 年约 $111M，增长约 74%），并估算 1,000
              名员工下每员工收入约 $186,000——不错，但低于顶级 fintech 基准， 符合一家先于变现投入的公司。2025 年 10 月裁员约 50 人（约 15% 员工），CEO
              将其表述为把资源重新分配到清晰盈利路径， 释放出主动成本管理信号。关键在于，毛利率、贡献利润率、清算和服务交付成本、CAC、LTV、回本周期均未披露， 因此真实单位经济无法通过公开来源核实，仍是尽调优先事项。
