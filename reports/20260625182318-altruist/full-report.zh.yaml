      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 有条件买入：承销增长，以披露为闸门
            body: >-
              Altruist 是大型 RIA 托管市场里可信的挑战者，拥有三位数趋势增长、现代化平台和 Hazel AI 差异化，支撑建设性立场。但约 $1.9B 的 Series F 估值意味着估算 10x–19x
              收入倍数，位于或高于 wealthtech SaaS 可比区间；公司也没有披露经审计收入。因此建议是有条件的：以中等置信度和偏高风险评级推进尽调，通过二级交易把进入价格瞄准不高于 Series F
              估值，并把任何承诺都卡在经审计收入、完整 cap table 和分部经济性披露之后。
            calloutType: recommendation
            claimRefs:
              - CV030
              - CV031
              - CV006
              - CV007
              - CV004
          - type: callout
            title: 高估值对应不透明且受监管影响大的经济性
            body: >-
              熊市情景很具体。进入倍数已经偏满到偏贵，盈利能力只是声称而未经审计，最受利率和监管影响的收入线（现金 sweep 净息差和 PFOF）正是审查加码之处。Schwab 等 incumbent
              的主导地位和多托管普及限制现实钱包份额，2025 年 10 月裁员暗示 burn 压力，IPO 还要多年，M&A 基本不在台面上。这些因素共同造成真实的 down-round
              和长期持有风险，必须靠有纪律的进入价格和预先承诺的终止触发器抵消。
            calloutType: risk
            claimRefs:
              - CV029
              - CV033
              - CV025
              - CV022
              - CV016
          - type: callout
            title: 隐含倍数才是关键，而非表面估值
            body: >-
              Altruist 不披露经审计收入，表面的 $1.9B 估值远不如其代表的隐含倍数有信息量。按估算收入 $150M，8x 与 16x 倍数对应约 $1.2B 到
              $2.4B，所以最有价值的单项尽调产出，是经验证的收入数字，用来确定公司实际落在这条曲线的哪个位置。可比私有轮次（DriveWealth、Apex）已经重估至约 7x–9x，凸显 Altruist
              的溢价完全依赖增长耐久性，而这一点只有经审计数据才能确认。
            calloutType: insight
