        title: 伙伴依赖与财务 / 模型风险
        blocks:
          - type: paragraph
            body: >-
              Altruist 的运营模型把关键功能集中在有限外部伙伴手里。公司依赖项目银行提供现金 sweep 和 FDIC 容量，依赖做市商做订单路由并贡献 PFOF 收入，依赖云基础设施托管，依赖大语言模型提供商为
              Hazel 做推理；任何一端失败或重新定价，都会实质影响运营或经济性。公司也依赖持续资本可得性：已融资超过 $600M，包括 GIC 领投的 $152M Series F，提供了
              runway，但未来轮次和条款没有保证；约 $1.9B 估值叠加未披露盈利能力，若增长放缓或市场收紧，会带来 down-round 风险。模型侧，收入对利率高度敏感，因为现金 sweep
              利差随短期利率变化；如果利率持续下行且没有费用收入抵消，就是直接模型风险。新的保证金和期权产品增加信用与损失敞口；托管客户资产天然带有欺诈和财务控制风险，必须靠隔离、对账和审计管理。强劲的净资本缓冲（约为最低要求的
              11,381%）缓释短期偿付风险，但不能消除经营亏损或融资风险。Schwab 和 Fidelity 的竞争以及多托管普及进一步限制钱包份额；头部客户收入占比未披露，客户集中风险无法量化。
