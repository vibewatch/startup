        title: 人才、执行、缓释与终止标准
        blocks:
          - type: paragraph
            body: >-
              人才和执行风险来自一家快速增长、仍未盈利的公司要同时管理规模、成本和信任。创始人兼 CEO Jason Wenk
              是关键人物，公司叙事高度依赖他的愿景和公众形象；快速扩张拉扯控制体系和文化；裁员后人才留存承压；冲向盈利又增加执行压力。面对这些风险，Altruist 有真实缓释：用扎实的 Form CRS、ADV
              披露和最佳利益程序应对监管风险，用内部控制、审计和状态监控应对运营风险，用强净资本缓冲和机构支持者应对融资风险，并在收费事件后改善沟通以修复信任。对投资人最有用的纪律，是提前承诺明确的 thesis-break
              触发器：PFOF 禁令或 sweep 规则导致收入实质下降，利率持续下行且没有费用收入抵消，严重托管或网络事件，down-round
              或融资失败，失误后顾问大规模流失，或少数大型集中客户流失。监控指标——BrokerCheck/IAPD
              披露、状态页事故频率、变更后的顾问流失、融资轮时间点——可提供早期预警。关键是，能确认或缓释这些风险的私有证据（检查结果、事故日志、诉讼，以及暴露于 PFOF 和现金利息的收入占比）并不公开，必须在尽调中取得。
