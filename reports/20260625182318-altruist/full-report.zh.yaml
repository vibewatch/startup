              2025 年 6 月净资本约 $63.5M，约为监管最低要求的 11,381%；管理层把近期轮次定位为公司预计最后需要的资本，同时声称有通向现金流盈利的路径。进入纪律很重要，因为表面估值偏贵。有纪律的投资人会把
              IPO 前二级市场敞口目标定在不高于 Series F 估值，因为早期持有人的近期流动性最可能来自二级交易，而不是 IPO 或收购。两个悬顶风险需要关注。第一，down-round 风险真实存在：约 $1.9B
              估值叠加未披露盈利能力，如果增长放缓或资本市场收紧，可能下修估值；若干私有可比公司已经重估下行。第二，连续定价轮会形成清算优先权和稀释悬顶，侵蚀普通股等价回报，所以任何仓位 sizing 前都必须审查完整 cap
              table 和优先权堆栈。两者都不构成直接否决，但都要求价格纪律和结构保护。
