      - number: '2.2'
        title: 多视角市场规模测算
        blocks:
          - type: paragraph
            body: >-
              市场可以用几个不可相加的视角来测算。按监管口径管理资产计算，美国 RIA 在 2025 年底报告创纪录的 $176.8T， 同比增长 22.3%，覆盖 16,544 家 SEC 注册顾问（增长 4.2%）。但
              RAUM 包含私募基金和机构资产， 这些并不是可托管的零售财富。更窄也更相关的口径，是 Cerulli 的独立和混合 RIA 渠道：该渠道管理约 $9.8T， 高于 2019 年的 $6.6T，复合增速接近
              12%，预计到 2026 年将达到所有顾问管理资产的约三分之一。 Altruist 自己把机会表述为 RIA 市场约 $128T 的资产；这是定位数字，而不是可服务收入基数。 对 Altruist
              来说，可服务市场最好用约 16,500 家注册顾问中以中小 RIA 为主的托管和平台支出来近似； 其已获得份额（SOM）体现为 3,150 多家 RIA
              公司，以及按关系数量排名第四。关键在于，没有公开来源单独拆出年度托管和顾问收入池的绝对规模， 因此渗透率测算必须依赖资产和公司数量代理指标。
