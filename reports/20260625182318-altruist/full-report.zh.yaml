    sections:
      - number: '1.1'
        title: 身份与使命
        blocks:
          - type: paragraph
            body: >-
              Altruist Corp 是一家在 Delaware 注册的金融科技公司，总部位于 California Culver City （3030 S La Cienega Blvd, Culver City, CA
              90232）。公司由 Jason Wenk 于 2018 年创立， 通过两个注册子公司运营：Altruist Financial LLC 是 FINRA/SIPC 成员自清算 broker-dealer，
              Altruist LLC 是 SEC 注册投资顾问。公司的使命是向独立 RIA 提供现代托管基础设施和一体化顾问技术， 让财务建议更好、更便宜，也更容易获得。不同于传统托管机构，Altruist 从零开始专为
              RIA 市场搭建平台， 把清算、托管、组合管理、交易、报告、计费和税务管理合成一个方案，免去多套第三方软件集成。 截至 2025 年 6 月，Altruist 持有 $63.5M 净资本，是监管最低要求的
              11,381%，运营基础在财务上较稳。 公司受 SEC、FINRA、OCC 以及 53 个州和地区监管。Altruist 通过 RIA 公司的软件订阅、交易费、 订单流支付、现金利息收入和模型市场费用获得收入。
