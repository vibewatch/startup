  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              Altruist 的客户基础几乎全部由注册投资顾问构成，平台最直接面向中小型、技术前瞻、成长导向的公司。 买方是公司负责人，用户是每天在平台工作的顾问和运营人员，付费方是 RIA
              公司本身。具名证据显示出分层行为： 新成立和初创 RIA（如 Eighth Wonder Investments）因快速无纸化开户和免费核心软件采用 Altruist；
              中小公司看重成本、用户体验和一体化技术栈；离开 wirehouse 的 breakaway 顾问选择它，是为了更容易迁移到现代平台； 也有越来越多中大型
              RIA——CWM（$26.8B）、CreativeOne（$3.43B）——为效率迁移资产。客户基础还跨越地域， 从 Kansas 农村业务到沿海大都市，并越来越多地包括 Ritholtz Wealth 据称正用
              Altruist 支撑的大众富裕客群管道。 共同点是，客户获取很大程度上由 breakaway 顾问和新成立 RIA 推动；它们选择的是低成本、纵向整合、数字优先的托管机构。
              随着时间推移，平台吸引力正在向更高端市场扩展，尽管重心仍在规模较小、成长导向的公司。
