              估值取决于隐含倍数，而非表面估值，因为 Altruist 不披露经审计收入。按公司声称的 2025 年 300% 增长，估算收入约 $100M–$200M，对应 10x–19x 倍数。行业基准显示，关键任务型
              wealthtech 和 B2B SaaS 基础设施约为 8x–12x EV/revenue，Hazel 这类嵌入 AI 的模型可获得 15–20% 溢价；私有 SaaS 中位数更接近
              4.5x–5x，私有轮次通常较公开可比公司折价 20–30%。近期私有可比公司勾勒出其估值偏高：DriveWealth 在 2024 年约 $75M ARR 上曾有约 $2.85B 估值，之后重估至约
              7x–9x；Apex 最近一次估值接近 $4.7B（2021 年），基于 2024 年估算收入 $214M。放在这一组里，Altruist
              的隐含倍数位于或高于区间顶部，只有可持续增长才能证明这份溢价。情景框架体现分散度：牛市情景（约 25%）是假设三位数趋势增长持续，收入迈向 $1B+ 并成功 IPO，支撑数十亿美元上行空间；基准情景（约
              50%）是假设增速放缓到可持续双位数，十年后期 IPO，估值小幅溢价到约 $2B–$3B；熊市情景（约 25%）是假设监管或利率冲击叠加 incumbent 压力，结果持平或低于进入估值。敏感性很刺眼：在估算收入
              $150M 时，8x 与 16x 倍数对应约 $1.2B 到 $2.4B，所以经验证收入数字是最有价值的单项尽调产出。
