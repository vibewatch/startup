  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与严重性排序
        blocks:
          - type: paragraph
            body: >-
              Altruist
              的风险画像由少数高影响敞口主导，它们位于商业模式和公司无法控制的外部条件交界处。按可能性和影响排序，第一梯队包括两条最敏感收入线的监管风险——客户现金的净息差和订单流付款——以及紧密相关的模型风险：短期利率若持续下行，将压缩现金
              sweep 利差。第二梯队是运营风险：作为自清算的记录托管方，Altruist
              把结算、对账和记录维护内化，宕机、网络安全事件或结算失败会对托管业务赖以成立的信任造成放大影响。除此之外，集中伙伴依赖、持续融资可得性带来的融资风险，以及快速扩张和关键人物依赖带来的人才与执行风险，共同构成风险清单。这些风险并不独立：利率下行或监管变化会伤害收入，运营失败或失误会侵蚀顾问信任并加速流失，收入受损又会传导到估值和融资风险。后续热力图和传导图显示，即便计入
              Altruist 已有缓释措施，监管、运营和模型维度的剩余敞口仍然重要。
