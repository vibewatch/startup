  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Altruist 竞争的是 RIA 托管和一体化顾问软件市场：SEC 和州注册投资顾问为运营业务而采购的合格托管、 清算、交易、再平衡、业绩报告、费用计费、税务工具，以及越来越重要的 AI
              副规划。相关支出边界是托管机构和平台层， 不是 RIA 向终端客户收取的顾问费；这些基于 AUM 的费用归 RIA 所有，并明确排除在托管机构收入池之外。 现状替代方案是碎片化：把 Schwab、Fidelity
              或 Pershing 等传统托管机构，与组合管理、再平衡、报告和计费的单点方案配对， 再用集成把它们缝在一起。Altruist 的论点是，一个单一、纵向整合、只服务 RIA 的技术栈可以压缩这种碎片化。
              相邻类别包括 TAMP、独立 wealthtech 供应商，以及银行现金和贷款产品。先定义这个边界很关键， 因为市场上吸睛的资产数字衡量的是远大于 Altruist 实际可变现托管和软件机会的资金池。
            claimRefs:
              - CM001
              - CM033
              - CM022
              - CM038
              - CM008
