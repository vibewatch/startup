  topStrengths:
    - 首个也是唯一一个垂直一体化的一站式 RIA 托管方，覆盖自清算、托管和完整投顾软件栈。
    - 增长曲线突出：AUM 连续 2 年增至 3 倍；2022/2023 年收入分别增长 1,700%/550%；T3 市占率翻倍至 6.25%。
    - 融资策略克制，稀释较低且估值逐轮抬升；Series F 由主权财富基金 GIC 领投。
    - 总可用市场（TAM）大且仍在扩张：全球 RIA AUM 达 $128T，每年新增 3,000+ 家 RIA 公司；Schwab-TD 合并后的扰动提供结构性顺风。
    - 网络效应和切换成本强：托管关系一旦建立，顾问就会深度嵌入。
  topRisks:
    - 审计收入和利润率未披露；所有增长指标都来自公司口径且未经验证，估值不确定性很高。
    - 对创始人兼 CEO Jason Wenk 的依赖集中；一旦他离任或精力被分散，战略执行可能失稳。
    - Schwab 和 Fidelity 的研发预算远高于 Altruist 的估值，未来 3-5 年存在技术追赶风险。
    - 监管风险：FINRA/SEC 经纪交易商身份让 Altruist 持续接受检查；重大执法可能扰乱运营。
    - Series F $1.9B 估值意味着 10x-19x 的估计收入倍数，相比上市 wealthtech 可比公司已经偏满到偏贵。
  unresolvedGaps:
    - 2023、2024 和 2025 年审计年度收入与毛利率情况，这是最终估值判断的关键阻断项。
    - 完整股权结构表，包括清算优先权堆叠和投资人投票权。
    - 已确认的董事会构成和治理结构。
    - T3 调查满意度之外，用于衡量 RIA 顾问留存的流失率 / NRR 指标。
    - Brandon Golden、Ben Mizes 和 Erin Hager 的身份与职责仍需核验，目前无法确认他们是 Altruist 高管。
