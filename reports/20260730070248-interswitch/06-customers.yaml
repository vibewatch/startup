  title: Customer journey map
  type: journey-map
  layout: wide
  summary: How major customer types encounter and expand within the Interswitch stack.
  data:
    items:
    - label: Banks and financial institutions start with switching, card, or banking-infrastructure needs and then expand into more workflow modules after integration.
    - label: Merchants and SMEs start with acceptance or collections, go live in daily operations, and can expand into more business tools or channels.
    - label: Government and public institutions typically move through procurement or project implementation before citizens and staff use the live workflow.
    - label: Consumers often arrive through Quickteller or Verve, while agents arrive through activation and assisted-service rollout.
    - label: Repeat usage and expansion are strongest when payment capabilities become embedded in everyday or mission-critical workflows.
    - label: Public evidence proves the path exists, but not the retention rate at each stage.
