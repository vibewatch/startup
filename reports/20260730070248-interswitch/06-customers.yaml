- id: adoption-proof
  title: Adoption trajectory and named customer proof
  body: 'Public adoption evidence is materially better than public retention evidence. Today Africa''s profile says Quickteller connects more than 8,000 billers, supports over 41,000 PayPoint agents nationwide, and reaches about 190,000 active businesses making payments daily. Official and near-official announcements add more concrete deployment proof: Interswitch says it supports Nigeria''s Federal Revenue Collection System, is deploying e-clinic capabilities in Lagos primary healthcare centres, powers payments on the Lagos Blue Line through Cowry Card, continues land-administration digitisation with Lagos State, and partnered with Hamilton Telecom in Uganda to expand digital access. These are not all equivalent in revenue size, but together they prove the stack is live in multiple real-world contexts. Temenos also states that Interswitch supports more than 300 financial institutions across Africa, which is one of the strongest ecosystem-scale customer signals in the public record. The
    customer-proof pattern is therefore broad and production-oriented, but still incomplete on commercial intensity: public announcements show existence and direction more clearly than contract value, renewal rates, or deployment penetration.'
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  tableRefs:
