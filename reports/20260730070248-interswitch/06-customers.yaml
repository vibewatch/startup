  - FU003
- id: durability-expansion
  title: Durability, repeat usage, and expansion paths
  body: 'Interswitch''s expansion logic is credible even where hard retention metrics are missing. Consumer and assisted-payment products can expand through more billers, broader service categories, and more frequent everyday use. Merchant and enterprise products can expand through additional rails, settlement services, collections, and sector-specific operational workflows. Financial-institution relationships can deepen through digital-banking enablement, tokenization, and broader card or payments infrastructure services. Public signals of expansion include Temu and AliExpress acceptance growth for Verve, Temenos-linked banking-tech expansion, and sector-specific rollouts in mobility, healthcare, and energy. The missing data is on durability: there is no trustworthy public NRR, GRR, churn, renewal-rate, or contract-duration dataset in the reviewed sources. That means the chapter can show many expansion surfaces and production proofs, but it cannot claim that these convert into low churn
    or exceptionally sticky wallet share without management data. Durability must therefore be inferred from embeddedness and workflow criticality rather than from disclosed cohort metrics.'
  claimRefs:
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  tableRefs:
  - TU004
  - TU005
- id: concentration-friction
  title: Concentration, procurement friction, and unresolved customer risks
  body: 'The key customer risk is not lack of breadth; it is opacity around concentration and renewal quality. The financial chapter already established that more than 90% of revenue comes from Nigeria, which implies the customer base is also highly concentrated in one geography and regulatory context. Public evidence does not reveal what share of revenue comes from top banks, top merchants, public-sector contracts, or specific institutional partners. Government-linked and enterprise workflows may also have longer procurement cycles and implementation complexity than consumer apps or simple gateway onboarding. The Paypoint distribution model brings another type of friction: agent quality, activation, and compliance support matter at field level, yet public disclosures say much more about mission and rollout than about active-usage cohorts or agent profitability. Finally, some end-user frequency categories are contested by consumer wallets and merchant-bank platforms. The public customer
    verdict is therefore positive on adoption proof, mixed on visibility into retention, and cautious on concentration. A strong diligence process would request segment revenue mix, renewal data, largest-account exposure, and production-usage depth per named deployment.'
  claimRefs:
