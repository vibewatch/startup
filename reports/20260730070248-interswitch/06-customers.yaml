company:
  name: Interswitch
chapter:
  number: 6
  title: Customers
  summary: Interswitch serves a multi-sided customer base that includes banks, fintechs, merchants, billers, agents, government agencies, and end-consumers. Public evidence is strongest on breadth of segments and named deployments—financial institutions, Quickteller Paypoint agents, federal revenue collections, Lagos healthcare and land-administration workflows, transit payments, and merchant gateway usage. Public evidence is weakest on retention, contract duration, net revenue retention, and top-customer concentration. The customer story therefore supports real adoption and expansion surfaces, but not a complete durability underwrite.
sections:
- id: segments
  title: Customer segmentation by buyer, user, payer, and use case
  body: 'Interswitch''s customer base is structurally multi-sided. Banks and financial institutions use the company for switching, card, and digital-banking infrastructure. Fintechs and developers can consume payments, transfer, wallet, or related APIs. Merchants and SMEs use gateway, collections, Quickteller Business, and assisted-payment tools. Government agencies and public institutions use revenue-collection and service-delivery infrastructure. Individuals use Quickteller, Verve, and agent channels as end-users, even when they are not the contracting party. This segmentation matters because buyer, user, and payer often diverge: a bank may buy the capability, merchants and cardholders use it, and end customers indirectly fund usage through payment economics. The strongest public evidence supports breadth across banks, merchants, agents, government, and consumer touchpoints, not one narrow customer niche. That is positive for resilience at the ecosystem level, but it also means the company
    must satisfy many stakeholder types simultaneously—regulators, issuers, merchants, agents, and public-sector operators—each with different needs and renewal logic.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  tableRefs:
  - TU001
