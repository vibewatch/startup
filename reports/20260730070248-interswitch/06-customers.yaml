tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale signal
  - Revenue / strategic value
  - Gap
  rows:
  - - Banks and financial institutions
    - Institution buys; staff and end-users consume; institution pays
    - Switching, card, banking-tech, and payment infrastructure
    - 300+ financial institutions supported (Temenos claim)
    - High strategic importance and ecosystem embeddedness
    - Revenue concentration by institution not public
  - - Fintechs and developers
    - Product or engineering teams buy / integrate; their end-users consume
    - API-led payments, transfers, wallet, card, or service enablement
    - Public docs and developer portal show broad service set
    - Strategic because fintechs can build on top of rails
    - Named active fintech customer list is incomplete
  - - Merchants and SMEs
    - Merchant owner / team buys; customers transact through it
    - Gateway, collections, business operations, assisted payments
    - 190,000 active businesses daily cited by Today Africa
    - High operational relevance in Nigeria commerce
    - Merchant-count methodology and ARPU not public
  - - Agents and assisted-payment operators
    - Agent activates and local customers use
    - Cashout, bills, deposits, withdrawals, local payment access
    - 41,000+ PayPoint agents cited by Today Africa
    - Distribution and inclusion value
    - Active-agent rate and unit economics not public
  - - Government and public institutions
    - Agency or public operator buys; citizens / staff use
    - Revenue collection, healthcare, land admin, transit
    - Multiple named deployments and public workflows
    - Strategically sticky if implementation is deep
    - Contract value, tenure, and renewal terms not public
  - - Consumers
    - Individual user uses and indirectly pays
    - Bills, transfers, airtime, cards, wallet-like utility
    - Quickteller and Verve are major public brands
    - Important for brand relevance and transaction frequency
    - Active-user, retention, and monetisation data thin publicly
  notes: Customer categories overlap; some relationships are channel-led while others are directly contracted.
