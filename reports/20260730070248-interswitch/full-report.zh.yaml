  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 按买方、用户、付款方和用例划分客户
        blocks:
          - type: paragraph
            body: >-
              Interswitch 的客户基础在结构上是多边的。银行和金融机构用它做交换、发卡和数字银行基础设施。金融科技公司和开发者可调用支付、转账、钱包或配套 API。商户和 SME
              使用网关、收款、Quickteller Business 和辅助支付工具。政府机构和公共机构使用收入收缴与服务交付基础设施。个人作为终端用户使用 Quickteller、Verve
              和代理渠道，即便他们不是签约方。这种分层重要，因为买方、用户和付款方常常分离：银行可能购买能力，商户和持卡人使用它，终端客户通过支付经济性间接出资。最强公开证据支持其横跨银行、商户、代理、政府和消费者触点的宽度，而不是一个狭窄客户细分。这对生态层面的韧性是正面的；但也意味着公司必须同时满足多类利益相关方——监管者、发卡方、商户、代理和公共部门运营方——且各自需求和续约逻辑不同。
