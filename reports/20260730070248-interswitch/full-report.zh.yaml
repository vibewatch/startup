  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 按客户工作流理解产品组合
        blocks:
          - type: paragraph
            body: >-
              产品版图最好理解为贴合客户任务的分层组合，而不是品牌孤岛。面向消费者，Quickteller
              处理日常账单、转账、话费充值和其他支付任务；官方品牌信息和历史报道将其描述为直观交易的数字支付界面。面向卡基商业，Verve 仍是旗舰本土卡和 token 平台；官方沟通提到其在尼日利亚有 70 million
              张卡，后续信息称非洲范围超过 100 million 张卡。面向商户和企业，Interswitch
              提供网关、收款、增值服务、企业运营工具和辅助支付。开发者和文档界面让这些能力可落地：支付受理、转账、VAS、代理取现、贷款、钱包服务、虚拟卡和 Paycode
              都以可嵌入合作伙伴产品的模块化服务呈现。公司还从通用支付延伸到移动出行、能源、医疗和公共服务工作流等垂直方案。这个宽度有战略价值，因为 Interswitch
              可以围绕同一支付关系参与多个收费事件；但它也提高了整个产品版图在一致性和发布速度上的负担。
