            body: >-
              公开采用证据明显强于公开留存证据。Today Africa 的画像称，Quickteller 连接超过 8,000 个账单方，支持全国超过 41,000 个 PayPoint 代理，并触达约 190,000
              家每天付款的活跃企业。官方和近官方公告提供了更具体的部署证明：Interswitch 称其支持尼日利亚 Federal Revenue Collection System，在 Lagos 基层医疗中心部署
              e-clinic 能力，通过 Cowry Card 支撑 Lagos Blue Line 支付，继续与 Lagos State 推进土地管理数字化，并与 Uganda 的 Hamilton Telecom
              合作扩大数字接入。这些项目收入规模不等，但合在一起证明该技术栈已在多个真实场景中运行。Temenos 还称 Interswitch 支持非洲超过 300
              家金融机构，这是公开记录中最强的生态规模客户信号之一。因此，客户证明模式很宽且偏生产环境，但商业强度仍不完整：公开公告对存在性和方向的证明，明显强于对合同金额、续约率或部署渗透率的证明。
