  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前公开估值锚下的投资正反论点
        blocks:
          - type: paragraph
            body: >-
              核心投资逻辑很直接：Interswitch 不是投机性应用，而是尼日利亚的基础支付设施之一，嵌入深、拥有本土卡组织、工作流触达广，也有公开证据证明规模真实。Techpoint 等媒体披露，2024 年收入约
              ₦137.5B，Technext24 和 BusinessDay 则显示 FY2025 已恢复盈利。这些都是业务仍具商业分量的硬证据。反方论点同样重要。外界最常引用的估值锚仍是 2019 年 Visa
              交易，隐含估值约 $1B。TechCabal 的 2025 年 12 月估值表仍把 Interswitch
              列在这一水平附近，但这不等于新的一级市场估值标记。换句话说，业务运营看起来比过时独角兽叙事暗示的更强，但股权价格仍缺少当前的公平交易重估。公司已经盈利且基础设施属性重，旧标记不像一些风投支持的消费金融科技公司那样明显过高。但没有新的资本市场证据，也很难说它明显便宜。因此，投资逻辑看好质量和市场位置；反方论点集中在价格发现过时、业务集中和披露缺口，而不是没有产品市场契合。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
