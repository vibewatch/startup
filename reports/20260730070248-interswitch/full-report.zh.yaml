        - label: 乐观情形
          value: 1.8
          unit: USD billion
          note: IPO 准备度、多元化增强和持续盈利支撑溢价。
        - label: 基准情形
          value: 1.1
          unit: USD billion
          note: 盈利改善，但估值标记陈旧，公允价值仍贴近历史锚点。
        - label: 悲观情形
