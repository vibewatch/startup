  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              Interswitch
              的可服务市场比单纯支付网关市场更宽，但比尼日利亚整个金融服务经济更窄。这个市场显然包括支付交换、商户收单、发卡与受理、数字账单支付、企业收款和付款、代理银行赋能，以及政府收入支付基础设施。官方产品页面显示，Interswitch
              通过 Paydirect、AutoPay、Quickteller、IPG、金融科技发卡和 API
              驱动的银行服务等产品，服务银行、金融科技公司、企业、开发者、SME、政府和个人。这个宽度意味着，市场边界最好定义为支付与商业基础设施，而不是单纯消费金融科技。与此同时，市场应排除独立信贷、保险和存款业务，因为
              Interswitch 并不直接拥有完整的资产负债表关系。现状替代也重要：银行可以自建，商户可以继续高现金占比，金融科技公司可以拼接多供应商栈，而不是使用单一既有提供商。即使 Interswitch
              受益于深厚的本地交换和合规嵌入度，这些替代方案也会压低对市场必然性的高估冲动。
