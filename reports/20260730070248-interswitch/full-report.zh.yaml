            - Visa、Helios、TA 和 IFC 出现在公开历史中
        - label: 当前在手现金
          values:
            - Unknown
            - 决定韧性和 IPO 准备度
            - 未找到可靠公开数字
        - label: 债务 / 义务
          values:
            - 未知 / 部分可见
            - 影响清算优先权、偿付能力和选择权
            - 公开渠道未找到完整的当前债务期限表
        - label: 营运资本需求
          values:
