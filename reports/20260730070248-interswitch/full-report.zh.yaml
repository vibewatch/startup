      - number: '7.3'
        title: 财务和模型风险由集中度、宏观波动和定价压力驱动
        blocks:
          - type: paragraph
            body: >-
              财务和模型风险现在比绝对偿付能力风险更可见。公开报道显示，超过 90% 的收入来自尼日利亚，把客户、货币和监管暴露集中到一个市场。同一公开记录也显示盈利改善，但这不能中和宏观风险。Today Africa
              强调，通胀和购买力疲弱是持续约束；更广泛的尼日利亚金融科技分析反复把合规、欺诈控制和运营复杂度与利润率压力联系起来。竞争又叠加一层。随着网关、商户银行、钱包和电信商主导模式争夺前端客户关系，基础设施既有玩家可以仍然必不可少，却捕获更少经济性。这对
              Interswitch 重要，因为许多风险不是通过即时交易量流失传导，而是通过 take rate
              压缩、实施放慢，或公司需要在安全、合作伙伴和产品打包上投入更多防御性支出传导。缺乏公开毛利率和流动性细节，也进一步限制了可量化的下行空间。因此，模型风险不只是“业务会不会增长？”，而是“在以尼日利亚为重心的基础上，盈利质量和现金生成在竞争与宏观压力下有多韧？”
