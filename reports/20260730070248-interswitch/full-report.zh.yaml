  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入流、变现，以及公开证据真正能证明什么
        blocks:
          - type: paragraph
            body: >-
              Interswitch 的收入模型最好理解为多流基础设施模型，而不是单一支付 take
              rate。官方材料显示，变现面分布在发卡与受理、支付交换、企业收款、网关服务、数字银行赋能、政府收入处理、账单支付和面向代理的支付服务。独立报道补上了规模信号：TechCabal、Techpoint、Innovation
              Village 和 BusinessDay 均报道，2024 年收入达到约 ₦137.5 billion，同比约增长 50%。这支撑了真实商业规模，但不能支撑分部级归因。公开证据无法让外部投资者干净拆分
              Verve、Quickteller、交换、商户收单、公共部门收款或更新的银行技术服务各贡献了多少收入。因此，本章可以以合理信心描述收入引擎的机制，却不能断言各收入流的精确占比。关键含义是，Interswitch
              似乎通过多种收费面变现广泛交易基础设施，但每条收入流的耐久性和利润率仍有部分不透明。
