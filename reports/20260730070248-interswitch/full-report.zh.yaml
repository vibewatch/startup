      - number: '8.4'
        title: 建议、退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              建议：有条件通过。置信度：中。风险评级：中高。估值立场：围绕旧独角兽锚按市场价看待，但必须守住纪律。这个判断对应的是一家业务显然真实、战略上仍重要的公司，但其当前私有市场价值披露不足。无条件通过会夸大定价确定性；拒绝则会忽视规模、盈利反弹和基础设施重要性的组合。有条件通过是两者之间的窄答案。实际含义是，投资者可以围绕不明显高于历史约
              $1B 锚的区间推进接触，但在支付实质溢价前，需要更强证据。退出准备度只是部分具备。IPO
              叙事已持续多年，但公开证据仍没有显示路径已完成，也没有确认交易所、时间表或披露包。最后尽调问题应集中在当前股权结构和优先权、审计财务、分部利润率、客户集中度、监管往来以及具体 IPO
              工作流。若出现新的估值标记、更干净的多元化证明，或经审计的公开市场准备度，投资逻辑会明显改善；如果集中度、监管拖累或利润率压缩恶化且没有增长或退出催化剂抵消，逻辑会转弱。
