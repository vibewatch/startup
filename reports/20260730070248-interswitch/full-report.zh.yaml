  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险主导打破投资逻辑的风险集合
        blocks:
          - type: paragraph
            body: >-
              监管和法律风险位于栈顶，因为 Interswitch 运行在支付中监管最重的层。公开记录显示，卡组织、支付服务提供商、开放银行参与者和共享基础设施参与方，都受不断演进的 CBN 和生态规则约束。CBN
              支付服务提供商名单把 Verve International 列入卡 / 支付方案类别，进一步说明集团在受严密监管的牌照边界内运营。Mondaq 对 2026 年 CBN 金融科技报告的摘要，以及 Open
              Banking Nigeria 材料，都显示制度正走向更强的开放银行标准、同意机制、数据共享规则、数字身份和监管基础设施。Today Africa 补充说，合规成本和审批时间线显著约束创新，MFB
              生态的牌照清理在 2026 年加速。对 Interswitch
              来说，这意味着深度嵌入带来的运营优势，与保持对齐的负担不可分割。数据处理、卡组织行为、商户路由规则，以及任何公共部门支付角色，都不是边缘事项；它们是核心法律和商业风险。主要未解问题不是监管是否重要——它显然重要——而是相对于更快、更窄的同业，监管给公司施加了多少隐性运营成本和执行拖累。
