            body: >-
              真正承销模型最关心的变量，公开信息很薄。这里没有可靠公开披露可用于判断毛利率、净留存率、获客成本、销售效率、各产品 take
              rate、欺诈损失负担、账上现金、月度烧钱速度或债务契约。这不意味着业务薄弱；它意味着外部人无法负责任地量化几条核心单位经济线。可以做一些方向性推断。盈利的支付基础设施模型通常依赖高交易吞吐、轨道和合规运营上的固定成本杠杆，以及严谨的欺诈和结算管理。FY2025
              恢复盈利说明运营杠杆改善，或非核心拖累减轻，但具体驱动因素不可见。同样，Visa、Helios、TA Associates 和 IFC
              的公开参与证明其历史资本基础强，但没有揭示当前现金储备、优先权条款或下一轮需求。就尽调而言，资产负债表细节缺失是主要阻碍，而不是已经证明的资本短缺。
