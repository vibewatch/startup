      - number: '5.3'
        title: 部署界面、集成模式与产品成熟度
        blocks:
          - type: paragraph
            body: >-
              部署方式随用户和产品而变。面向开发者的集成，在凭证和文档层面看起来可自助，API marketplace 和文档环境旨在支持伙伴实施。商户和企业部署更偏运营：网关、收款和企业工具接入商业工作流，而
              Quickteller Paypoint 等辅助支付网络需要现场支持和分销。Quickteller、Verve 等消费者产品依赖信任、受理和便利性，而不只是 API
              质量。近期产品和合作公告显示，公司仍在进入新场景：数字加油站支付、通过 Cowry Card 支持 Blue Line 轨道交通支付、Lagos 基层医疗中心 e-clinic 部署、Uganda 的
              Hamilton Telecom 合作，以及通过 Temu 和 AliExpress 扩大国际受理。这些项目规模和成熟度并不等同，但合在一起显示同一条底层逻辑：Interswitch
              希望自己的支付层出现在多种运营环境中，而不只是结账框里。因此，产品成熟度在卡、交换、收款和支付 API 上最强；较新的垂直包处于中等；完全公开的开放银行 API 或突出披露的 LANPAY 产品线则不那么清晰。
