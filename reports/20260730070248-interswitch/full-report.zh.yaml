      - number: '6.3'
        title: 耐久性、重复使用与扩张路径
        blocks:
          - type: paragraph
            body: >-
              Interswitch
              的扩张逻辑可信，即使硬留存指标缺失。消费者和辅助支付产品可通过更多账单方、更宽服务类别和更高日常使用频次扩张。商户和企业产品可通过新增轨道、结算服务、收款和行业专项运营工作流扩张。金融机构关系可通过数字银行赋能、tokenization
              以及更广泛的卡或支付基础设施服务加深。公开扩张信号包括 Temu 和 AliExpress 的 Verve 受理增长、Temenos
              带动的银行技术扩张，以及移动出行、医疗和能源中的行业专项部署。缺失的是耐久性数据：经审阅来源没有可信的公开
              NRR、GRR、流失率、续约率或合同期限数据集。因此，本章能展示许多扩张界面和生产证明，但不能在没有管理层数据的情况下宣称它们会转化为低流失或异常粘性的客户钱包份额。耐久性只能从嵌入度和工作流关键性推断，而不能从已披露队列指标推断。
