      - number: '2.3'
        title: 买方、用户、付款方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图异常多边。银行和金融科技公司为交换、发卡、转账轨道、收款和银行即服务模块购买或集成 Interswitch；商户和 SME 购买网关、收款、Quickteller Business
              和代理赋能服务；政府和公共机构购买可信的收款与收入路由基础设施；个人使用 Quickteller、Verve
              和配套交易服务。有些场景里买方、用户和付款方是同一方，但很多场景会分离。例如，银行可能购买发卡处理能力，商户和持卡人成为用户，终端客户通过交易费用间接出资。政府收款是另一条多边路径：MDA
              或政府平台设定工作流，公民和企业付款，Interswitch
              充当安全路由层。因此，采用不是单一自助漏斗。通常先要监管认可，再做企业或机构集成、商户铺开，最后形成终端用户频次。这种结构利好拥有广泛合规和可用性信誉的既有玩家，但也意味着企业销售周期和认证负担会拖慢扩张。
