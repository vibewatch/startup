chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立逻辑与历史角色
        blocks:
          - type: paragraph
            body: >-
              Interswitch 更应被看作一家尼日利亚支付基础设施公司，后来延展成更宽的数字商业平台，而不是围绕单一 App
              做出的消费金融科技公司。公司官网称，它是一家一体化支付和数字商业公司，在多个非洲市场支撑安全、可靠的交易；公司页和品牌页显示，其产品版图覆盖消费者支付、商户收款、政府收入处理、开发者
              API、企业付款、健康科技、交通，以及面向特定行业的工作流工具。历史主线是支付交换：Today Africa 的长篇画像称，公司最初是为了连接尼日利亚此前割裂的银行和 ATM 系统；Helios 投资页则把
              Interswitch 称为该国领先的支付处理商。多数公开来源，包括创始人资料和 Today Africa，都把创立时间放在 2002 年、由 Mitchell Elegbe 领导；IFC 项目披露则称公司成立于
              2001 年，形成了不大但真实的时间线冲突。无论准确的法律成立日期是哪一年，更强的定性结论不变：Interswitch 是尼日利亚最早做出规模的支付平台之一，也是后来金融科技公司搭建其上的市场结构基础。
