      items:
        - label: 悲观
          low: 0.6
          high: 0.9
          unit: USD billion
          note: IPO 延迟、宏观拖累或抽佣率压力
        - label: 基准
          low: 0.9
          high: 1.3
          unit: USD billion
          note: 利润证明改善后，历史锚点大体守住
        - label: 乐观
          low: 1.3
          high: 2
          unit: USD billion
          note: 新估值标记、IPO 路径和多元化支撑溢价
    approximationNotes: 区间代表估值立场，不是已披露交易。它们用公开财务信号和可比定位，为合理的私人市场价值划出边界。
