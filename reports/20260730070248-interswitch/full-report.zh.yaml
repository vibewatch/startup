      - number: '1.3'
        title: 所有权、融资历史与估值锚点
        blocks:
          - type: paragraph
            body: >-
              Interswitch 的所有权故事由长期私募股权持有、战略卡网络验证，以及不完整的公开股权结构可见度共同主导。Helios 投资页称，由 Helios 牵头的投资者集团于 2010 年 12
              月同意收购多数股权，并在 TA Associates 于 2017 年 3 月买入少数股权后继续持有多数。BusinessAMLive 2019 年报道补充说，公司恢复 IPO 规划时，其他股东包括 IFC
              和其他财务投资者。最耐久的估值锚点仍是 Visa 在 2019 年 11 月以 $200 million 购买 20% 股份；多家媒体将其解读为隐含约 $1 billion
              股权估值，并让公司成为尼日利亚首家金融科技独角兽。此后，公开估值透明度急剧下降：经审阅来源没有确认此后的定价股权融资；2019 年 IPO 规划报道曾抛出 $1.3 billion 到 $1.5 billion
              的公开市场目标，但上市没有完成。与此同时，Today Africa 提到公司在 2020 年挂牌 ₦23 billion
              债券，说明它用债务资本而非公开股权延展融资弹性。净结果是：一个可信但陈旧的股权价值标记，配上一套很薄的当前所有权经济性披露。
