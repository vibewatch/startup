      - number: '8.3'
        title: 可比公司、情景区间与下行触发因素
        blocks:
          - type: paragraph
            body: >-
              最合适的可比集不是纯粹的一类，而是混合参照。Flutterwave、OPay 和 Moniepoint 是相关的非洲私有可比公司，因为它们展示了市场如何给已成规模的区域金融科技龙头定价：TechCabal
              2025 年表格把 Flutterwave 放在约 $3B，OPay 约 $2.7-$3B，Moniepoint 高于 $1B，Interswitch 接近 $1B。Fawry、dLocal、Adyen 和
              Network International 提供的是公开市场或准公开市场模型参照，而不是完全同类。dLocal 和 Adyen 在结构上有参考价值，因为它们是公开市场规模的处理商 / 基础设施公司；Fawry 和
              Network International
              则是更扎根区域的支付参照。要做干净的倍数测算仍然很难，因为本次审阅的公开来源对规模、触达和市值的证据更强，对每个同业的可比收入倍数数据则弱得多。因此，情景法比伪精确更诚实。乐观情景下，IPO
              路径完成、盈利持续、非洲扩张叙事增强，可能支撑高于旧 $1B 锚的溢价。基准情景下，旧估值标记、尼日利亚集中和披露不完整，使公允价值贴近当前公开锚。悲观情景下，IPO
              长期拖延、竞争压缩或宏观背景转弱，会把估值区间拉到旧独角兽标签之下。
