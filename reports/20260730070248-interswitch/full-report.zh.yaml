      - number: '2.2'
        title: 用交易和采用视角测算市场规模
        blocks:
          - type: paragraph
            body: >-
              最站得住脚的市场规模测算，应使用多个运营视角，而不是单一分析师预测。CBN 统计显示，仅 2024 年上半年，尼日利亚处理了 22.42 billion 笔电子支付交易，金额约 ₦1.56
              quadrillion；互联网转账、移动 App 转账、POS 和移动货币渠道都已经达到巨大规模。Today Africa 的 H1 2026 金融科技报告补充说，即时支付交易从 2022 年约 5
              billion 笔增至 2024 年近 11 billion 笔，而 Q1 2026 POS 交易达到 ₦18.78 trillion。这些数字不等于 Interswitch 的
              TAM，但能说明处理商、交换网络和商户平台所运行的交易底座有多大。Statista
              的尼日利亚支付展望提供了更宽的框架，强调交易金额、收入和用户数据，而不是某个狭窄产品分部；其方法论还把互联网渗透率、智能手机渗透率、消费者支出和网上银行渗透率列为核心市场驱动因素。务实结论是：按交易吞吐量看，Interswitch
              的机会巨大；但任何收入 TAM 估计，都高度取决于纳入哪些交换、收单、发行、代理分销和商业赋能层。
