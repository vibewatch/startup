      - CI020
      - CI021
      - CI023
  - id: FI004
    title: 资本强度 / 现金流地图
    type: matrix
    layout: wide
    summary: 公开信息中，资本充足度哪些已知、哪些未知。
    data:
      columns:
        - 公开状态
        - 重要性
        - 当前判断
      rows:
        - label: 历史股权支持
          values:
