      - number: '3.3'
        title: 区域与相邻替代：MTN MoMo、M-Pesa、Fawry、Network International 与 NIBSS
        blocks:
          - type: paragraph
            body: >-
              区域和相邻玩家揭示了买方可能偏好的战略方向，即便它们并不全是尼日利亚的直接替代。MTN 将 MoMo
              描述为面向消费者和企业的金融科技平台，提供支付、电商、保险、借贷和汇款；这说明电信商主导的分销可以从移动货币演化为更宽的金融生态。Safaricom 的 M-Pesa
              仍代表典型的移动货币和钱包中心型运营模式，尽管本次抓取的公开页面更偏导航而非分析。Fawry 展示了另一种原型：一家上市的埃及数字支付平台，覆盖消费者支付、账单支付、商户工具和金融服务。Network
              International 代表规模化区域处理商和收单机构模式，官方宣称在 50+ 个市场运营，服务 250+ 家金融机构、240,000+ 家企业和 25+ million 名持卡人。与此同时，NIBSS
              不是普通竞争者，而是设定边界的公用设施。它在国家交换、登记系统和连接 CBN 的基础设施中的角色，意味着支付栈的一部分仍更接近共享轨道，而不是纯专有软件。对 Interswitch
              来说，这些例子说明，威胁不是某一个新进入者，而是多种商业模式原型，它们会从不同方向压缩利润率或买方忠诚度。
