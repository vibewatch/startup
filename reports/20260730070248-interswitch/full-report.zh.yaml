      - number: '7.4'
        title: 执行、依赖与退出风险集中在 IPO 节奏和多方协同
        blocks:
          - type: paragraph
            body: >-
              执行风险更高，是因为 Interswitch 同时要做几件难事：守住核心支付轨道、持续升级产品层、在非洲有选择地扩张，并在多年延迟后保留 IPO 选项。Financial
              Nigeria、Tekedia、EcofinAgency、BusinessAMLive 和 IPOs.fyi 的多篇公开文章显示，伦敦 /
              拉各斯双重上市叙事已延续多年，但发行仍未完成。这不能证明失败，却带来退出时点风险，也提高了公开市场准备度始终停在临门一脚的概率。依赖风险同样关键。Interswitch 依赖监管机构、与 NIBSS
              相连的互操作性、机构伙伴、商户、公共部门，以及越来越多的全球受理或银行科技伙伴。协同点越多，防御性可能越深；但也意味着一个薄弱环节——不利监管转向、信任事件、上线失败、银行科技商业化路径延迟，或主要伙伴错位——都可能拖慢整个投资逻辑。实际投资含义是，评估公司不应只看增长和历史地位，还要看管理层能否让生态保持同步，并把基础设施地位转化为更清晰、更具地域韧性的股权结果。
