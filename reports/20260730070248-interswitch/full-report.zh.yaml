  - id: FI003
    title: 单位经济模型桥
    type: flow
    layout: standard
    summary: 哪些单位经济模块公开可见，哪些仍缺失。
    data:
      nodes:
        - id: u1
          label: 交易量可见
        - id: u2
          label: 定价部分不透明
        - id: u3
          label: 毛利率未公开
        - id: u4
          label: 欺诈 / 损失和支持成本未公开
        - id: u5
          label: 真实单位经济模型未解
      edges:
        - from: u1
          to: u2
          label: 规模存在，但变现细节不完整
        - from: u2
          to: u3
          label: 缺少实际成交定价，毛利测算就撑不住
        - from: u3
          to: u4
          label: 损失和服务成本仍不可见
        - from: u4
          to: u5
          label: 需要管理层数据才能建模经济性
