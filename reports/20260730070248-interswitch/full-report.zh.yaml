      - number: '1.5'
        title: 里程碑、监管事件与未解决的退出叙事
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，这家公司围绕基础设施深度反复重塑自己，同时仍背着未解决的集中度和市场结构风险。Today Africa 的时间线追溯了首个 switch 上线、Verve 作为本土卡组织推出、2006 年
              Quickteller 上线、2010 年 Helios 交易、随后东非收购、2019 年 Visa 入股，以及 2020 年债券发行。更近期的官方材料又提供了持续战略动作的证据：2024 年与 NIBSS
              合作，以符合尼日利亚 PTSA 路由制度；2025 年和 2026 年获得全球金融科技认可；2025 年 M-Kudi 获得移动货币牌照；2026 年与 Temenos 合作提供数字银行服务；2026
              年公共部门和能源零售部署；以及通过 Quickteller 代理网络扩张至 Uganda。但反向一面同样重要。Nairametrics 2026 年 5 月报道称，处理商和收单机构因路由排他性和费用争议威胁暂停
              Verve，说明市场力量可能转化为生态摩擦。IPO 历史同样没有收尾：London / Lagos 双重上市计划在 2015–2017 年间搁置，2019 年重启，但截至 2026 年 7
              月报告生成日仍未形成公开交易。战略韧性和未完成退出执行并存，应成为后续每一章的核心背景。
