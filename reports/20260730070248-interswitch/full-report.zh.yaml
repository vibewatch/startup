      - number: '2.4'
        title: 增长驱动、约束与未解的市场矛盾
        blocks:
          - type: paragraph
            body: >-
              最强的结构性驱动来自无现金迁移、监管对可监测数字交易的推动、商户数字化、跨境贸易、数字身份扩张，以及金融科技公司向受监管基础设施移动。Today Africa
              明确认为，尼日利亚金融科技生态正从支付驱动的增长阶段进入受监管基础设施阶段；Mondaq 对 2026 年 CBN
              金融科技报告的摘要称，监管方优先推动有利于创新的监管、通过数字基础设施扩大普惠、系统完整性、开放银行和更强的数据共享轨道。这些力量净利好 Interswitch
              这样的既有玩家，因为它们奖励可靠性、牌照、集成和信任。但约束同样真实：同一份 CBN 报告暴露了基础设施缺口、高合规成本、漫长上市时间、身份瓶颈和信任问题。尼日利亚宏观背景也仍是双刃剑。支付采用提升不能消除 FX
              波动、购买力疲弱、欺诈压力，或来自更新一代商户中心型提供商的竞争强度。这意味着市场很大且仍在增长，但并非无摩擦；可触达机会应按执行和监管拖累打折，而不是被当成直线采用。
