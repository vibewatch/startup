companyProfile:
  summary: >-
    Interswitch 是一家总部位于 Lagos 的支付基础设施公司，由 Mitchell Elegbe 于 2002 年创立。它搭起了尼日利亚核心电子支付栈之一，覆盖交换与清结算连接、Verve
    本土卡组织、Quickteller 面向消费者的账单支付与转账流程、商户受理产品，以及银行、公共部门机构、商户和金融科技公司使用的集成层。公开报道支撑其规模：2024 年收入 ₦137.5B，FY2025 税前利润恢复至约
    ₦23B，并且在尼日利亚数字支付生态中继续具备战略意义。该业务也集中暴露于单一地理市场，公开披露有限，2019 年的独角兽估值锚点已经老化，仍等待一次干净的公开市场检验。
