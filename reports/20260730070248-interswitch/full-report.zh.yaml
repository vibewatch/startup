      - number: '6.4'
        title: 集中度、采购摩擦与未解客户风险
        blocks:
          - type: paragraph
            body: >-
              关键客户风险不是缺乏宽度，而是集中度和续约质量不透明。财务章节已经说明，超过 90%
              的收入来自尼日利亚，这意味着客户基础也高度集中在一个地理和监管环境中。公开证据没有披露收入中有多少来自头部银行、头部商户、公共部门合同或具体机构伙伴。政府连接型和企业工作流的采购周期和实施复杂度，也可能长于消费者
              App 或简单网关入驻。Paypoint
              分销模式带来另一类摩擦：代理质量、激活和合规支持在一线很重要，但公开披露更多谈使命和铺开，较少谈活跃使用队列或代理盈利能力。最后，一些终端用户频次类别正被消费者钱包和商户银行平台争夺。因此，公开客户结论是：采用证明正面，留存可见度好坏参半，集中度上需要谨慎。强尽调应要求公司提供分部收入结构、续约数据、最大客户暴露，以及每个具名部署的生产使用深度。
