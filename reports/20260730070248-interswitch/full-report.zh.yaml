        - MEA 范围内的规模参考
        - 区域内适配的处理机构模式
        - 已审阅资料中没有新的公开估值数字
    notes: 可比组混合了非洲金融科技私募估值标记和公开市场处理机构参考；应当用来三角校验，不应当作一个干净同业篮子。
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly visible private and public references relevant to African and emerging-market payments; excludes
        undisclosed secondaries and confidential marks.
    claimRefs:
      - CV011
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
  - id: TV005
    title: 论点失效与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - IPO 进一步长期延迟
        - 下一个战略周期看不到可信上市或替代流动性计划
        - 退出选择权减弱，陈旧估值标记折价应扩大
        - 持有或下调估值预期
      - - 尼日利亚集中度仍极高
        - 多元化没有可信进展
        - 宏观和监管风险仍权重过高
        - 维持集中度折价
      - - 重大信任或监管事件
        - 重大不利卡组织、欺诈或牌照事件
        - 质量论点大幅削弱
        - 转向防守 / 回避立场
      - - 边缘层利润率或份额被压缩
        - 网关 / 商户层重要性被侵蚀的证据
        - 基础设施质量不再转化为强经济性
        - 下调公允价值区间
      - - 没有新披露却以溢价完成新一轮融资
        - 新估值标记显著高于 $1.3B，但透明度没有改善
        - 价格跑在证据质量前面
        - 不追价
    notes: 这些触发项既服务投后监控，也服务投前纪律。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前股权结构和优先权
        - 投资者权利、清算顺位和任何二级估值标记
        - 不知道谁先拿钱，就无法干净地承销价格
        - 管理层 / 法律顾问 / 资料室
      - - 经审计财务和分部利润率
        - 按产品和地域拆分的收入质量
        - 用来检验旧独角兽估值标记是否仍有支撑
        - 财务团队 / 审计师
      - - 客户集中度和续约
        - 头部客户组合、合同期限和留存
        - 目前只能在地域层面看见集中度风险
        - 销售运营 / 财务
      - - 监管往来和事故历史
        - 监管函件、整改、宕机和欺诈损失细节
        - 用来补齐法律和运营下行缺口
        - 合规 / 法务 / 风控
      - - IPO 准备包
        - 交易所计划、时间表、顾问和关口事项
        - 用来判断退出时点是否值得溢价
        - 董事会 / CFO / 顾问
    notes: 这些问题划定了按市场价接触与有信心给溢价之间的门槛。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
figures:
  - id: FO001
    title: Interswitch 里程碑时间线
    type: timeline
    layout: wide
    summary: Interswitch 的公开轨迹，从尼日利亚早期支付交换基础设施起步，延伸到 Verve、Quickteller、私募股权控股、Visa 少数股投资、债券市场融资、监管重组，以及至今未完成的 IPO 叙事。
    data:
      items:
        - date: '2002'
          label: 成立
          detail: Mitchell Elegbe 在 Lagos 创办 Interswitch，连接银行和 ATM 网络；IFC 后来引用的成立年份为 2001 年。
          tone: positive
          claimRefs:
            - CO001
            - CO004
        - date: '2006'
          label: Quickteller 推出
          detail: Quickteller 作为面向消费者和企业的多渠道支付平台推出。
          tone: positive
          claimRefs:
            - CO042
        - date: 2010-12
          label: Helios 收购多数股权
          detail: Helios 牵头的投资者集团同意收购多数股权，开启长期 PE 持股时代。
          tone: positive
          claimRefs:
            - CO017
        - date: 2017-03
          label: TA Associates 少数股投资
          detail: TA 买入少数股权，Helios 仍是多数股东。
          tone: positive
          claimRefs:
            - CO018
        - date: 2019-11
          label: Visa 投资 $200M
          detail: Visa 买入 Interswitch 20% 股权，这笔交易成为最常用的 $1B 估值锚点。
          tone: positive
          claimRefs:
            - CO020
            - CO021
        - date: 2020-02
          label: ₦23B 债券挂牌
          detail: Interswitch 通过国内债券挂牌而非公开股权融资来拓宽资金来源。
          tone: neutral
          claimRefs:
            - CO044
        - date: 2025-05
          label: M-Kudi MMO 获批
          detail: 子公司 M-Kudi 获得 CBN 最终批准，成为移动货币运营商。
          tone: positive
          claimRefs:
            - CO034
        - date: 2025-12
          label: Verve 发卡达到 100M 张
          detail: 官方新闻中心称 Verve 在非洲发卡量突破 1 亿张。
          tone: positive
          claimRefs:
            - CO038
        - date: 2026-05
          label: Verve 路由争议
          detail: 行业联盟因路由排他和费用担忧威胁暂停服务。
          tone: warning
          claimRefs:
            - CO040
        - date: 2026-06
          label: Temenos 合作
          detail: Interswitch 借助新的 Temenos 合作，扩展到数字银行赋能。
          tone: positive
          claimRefs:
            - CO048
    approximationNotes: 早期里程碑采用年份或年月锚点，因为已审阅资料并未一致披露精确日期；这条时间线优先采用最常被引用的公开脉络，而不是追求法律注册日期的精度。
    claimRefs:
