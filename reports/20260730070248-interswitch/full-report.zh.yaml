      - number: '5.4'
        title: 信任、合规、质量控制与路线图缺口
        blocks:
          - type: paragraph
            body: >-
              信任和控制本身就是产品的重要部分。Techpoint 的网关解释称，Interswitch Payment Gateway 支持广泛轨道，并使用 PCI DSS 合规、tokenization
              和自适应认证来降低欺诈和拒付风险。BusinessDay 2025 年技术报道补充说，Interswitch 正在推动 tokenization、tap-to-pay、非接触式卡和跨境互操作；管理层称，已有超过
              40 million 张 Verve 卡具备非接触功能。Temenos 进一步把 Verve 描述为本土支付卡和 token 方案，已发行超过 100 million
              张支付卡。这些信号让产品路线图变得清楚：安全凭证抽象、非接触使用、更广泛受理，以及更深的金融机构软件层。但缺口也重要。经审阅的公开材料没有清楚记录一个命名的开放银行 API
              产品，尽管市场很需要开放银行；也没有突出记录当前独立 LANPAY
              界面。这些缺失不能否定产品能力，但确实意味着审慎审查者应把清楚公开、面向生产的内容，与可能内部开发、白标化或只是披露不足的内容分开。路线图看起来活跃且具备商业价值；产品文档信息量足够，但并不完整。
