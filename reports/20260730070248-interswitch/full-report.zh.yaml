              当前最清晰的规模证据来自 2025 年财务披露和官方产品 / 新闻页面，而不是单一公司事实表。Techpoint、BusinessDay、Technext 和 Innovation Village 均报道，截至
              2025 年 3 月的年度收入达到 ₦137.5 billion，同比增长 50%，尼日利亚贡献约 90%。这些来源还一致称，公司在上一年亏损后恢复到有意义的盈利，报告税前利润 ₦23 billion、税后利润
              ₦14.7 billion。收入结构对一家私营公司而言也异常有信息量：交易收入占总收入 75%，Verve 单独贡献 32%、增长 39%，非交易收入在增长 81% 后达到 ₦34.3
              billion。产品侧，官方页面显示 Interswitch 现在覆盖交换、支付网关、Quickteller
              消费者和企业服务、Paydirect、AutoPay、代理银行、金融科技发卡、安全服务和行业专项工具。官方页面还宣称进入 25+ 个非洲国家，并在 UK、USA、Canada 和 Gulf
              开展跨境业务。产品宽度让战略价值更强，但也让披露质量不均，因为组合中只有一部分有最新公开运营指标。
