      - number: '1.2'
        title: 创始人—市场匹配、领导梯队与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人—市场匹配异常强。Mitchell Elegbe 的官方领导层履历称，他曾在 Schlumberger 任职，之后在 TELNET 担任业务发展集团负责人；Today Africa
              补充说，他看到尼日利亚银行系统现金占比高、彼此割裂所带来的成本后，离开 TELNET，为本地银行和 ATM 构建交换软件。技术背景叠加对尼日利亚支付瓶颈的一线感知，是 Interswitch
              能成为基础设施而不是薄 App 层的核心原因。目前公开资料中的领导层可见度好坏参半。官方领导层和新闻材料清楚列出 Mitchell 是创始人兼集团董事总经理 / CEO，Cherry Eromosele
              是市场与传播执行副总裁，Vincent Ogbunude 负责 Verve，Akeem Lawal
              是资深交换和支付处理运营负责人。因此，管理梯队比“单一创始人故事”更厚，但经审阅的公开记录没有披露董事会构成、独立董事设置、接班规划和正式治理委员会。一家仍与 IPO
              可选项绑定的公司，治理透明度不足就是重大尽调缺口，不是表面瑕疵。
