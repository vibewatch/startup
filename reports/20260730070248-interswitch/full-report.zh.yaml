        title: 增长牵引、集中度与盈利信号
        blocks:
          - type: paragraph
            body: >-
              最高置信度的财务牵引信号既近期又重大。Techpoint Africa 报道，Interswitch 2024 年收入增长 50% 至 ₦137.5 billion；Innovation Village 和
              TechCabal 也给出了相同收入数字和尼日利亚集中度信息。随后 Technext24 和 BusinessDay 报道，公司 FY2025 恢复盈利，税前利润约 ₦23 billion，税后利润约 ₦14.7
              billion，扭转了此前亏损期。这些披露重要，因为它们意味着 Interswitch 不再只是历史上重要的平台：它重新在显著规模上展现正向盈利能力。主要但书是集中度。多篇报道称，超过 90%
              的收入仍来自尼日利亚。这种集中度可能简化 go-to-market
              焦点并帮助形成本地护城河，但也意味着财务底座高度暴露于一个经济体、一种货币和一个监管环境。公开证据因此更强地支持增长和盈利修复，而不是尼日利亚之外的地域多元化或收入韧性。
