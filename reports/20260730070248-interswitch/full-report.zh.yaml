  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、既有机构、相邻玩家与现状替代
        blocks:
          - type: paragraph
            body: >-
              Interswitch 在几个相互重叠的赛场竞争，而不是面对一个干净的同业集合。尼日利亚线上支付和商户软件的直接挑战来自 Flutterwave 和 Paystack，二者主打开发者友好的
              API、商户入驻和互联网支付工作流。代理、钱包和日常消费者频次的挑战更多来自 OPay，以及间接来自 MTN Mobile Money、M-Pesa 等电信商或移动货币模式。Moniepoint
              在商户受理、企业银行和更宽的 SME 运营工作流上重叠更深。Egypt 的 Fawry、Middle East and Africa 的 Network International
              等区域既有机构，作为即时尼日利亚替代品意义较弱，但能证明支付基础设施品类会分裂出本地冠军，并各自拥有不同变现层。即便是
              NIBSS，虽然主要是系统公用设施和合作伙伴，也会塑造竞争，因为一个工作流越接近公共交换基础设施，单一处理商的经济性就越不专有。现状替代仍然真实：银行、商户和金融科技公司可以多栖，或拼装混合轨道，而不是完全押注一家提供商。
