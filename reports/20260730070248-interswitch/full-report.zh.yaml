      - number: '8.2'
        title: 融资背景、入场纪律与旧估值标记风险
        blocks:
          - type: paragraph
            body: >-
              Visa 2019 年以 $200M 买入 20%，仍是公开融资的标准参照，因为这笔交易既具体，外界引用也很广。BusinessAM Live、Today Africa 和 TechCabal
              的公开来源都强化了这一点：这笔交易让 Interswitch 成为尼日利亚首个金融科技独角兽。但 2026 年投资者不能只靠这一事件。过去数年，多篇文章提到伦敦和拉各斯 IPO
              设想或准备，但本次审阅材料没有一篇证明上市已经完成，也没有新的公开估值。这个缺口影响入场纪律。即便业务改善，如果最后一次估值太旧、公开可比公司估值压缩，或集中风险仍未解决，估值支撑也可能变弱。收入和利润反弹降低了「故事破裂」大幅折价的风险，但不能证明溢价倍数合理。因此，价格问题不是「Interswitch
              好不好？」，而是「在盈利改善但透明度仍有限的情况下，旧独角兽估值应打折还是给溢价，幅度多大？」公开证据支持把 2019 年 Visa
              标记作为参照点，而不是当前成交价。入场纪律应锚定更新后的收入、盈利和可比公司数据，而不是只看声望。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
