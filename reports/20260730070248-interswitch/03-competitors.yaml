    - Fintechs own the customer interface while Interswitch becomes an unseen back-end utility
    - High
    - Measure whether gateway, merchant, and developer layers are growing faster than core rail economics
  - - Verve card-scheme position
    - Routing or fee disputes reduce scheme leverage and processor alignment
    - High
    - Review Verve dispute history, issuer incentives, and margin by card product
  - - Broad product estate
    - Sprawl can weaken product speed against sharper specialist rivals
    - Medium-High
    - Assess roadmap velocity for Quickteller, APIs, and merchant tools
  - - Local rail trust
    - Open-banking and shared-infrastructure rules can commoditize more workflows
    - Medium-High
    - Track where regulation moves value toward shared rails and registries
  - - Nigeria incumbency
    - Moniepoint, OPay, Flutterwave, and Paystack each win different edge relationships
    - High
    - Request win/loss data by merchant, bank, fintech, and government segment
  notes: Severity reflects competitive transmission to revenue relevance, not legal risk ranking.
