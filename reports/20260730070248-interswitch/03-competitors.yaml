company:
  name: Interswitch
chapter:
  number: 3
  title: Competitors
  summary: 'Interswitch competes from a different starting point than most African fintech peers: it is a long-built payments rail, card-scheme, and collections incumbent that now also has to defend itself against faster merchant and consumer fintechs. The sharpest direct pressure in Nigeria comes from Flutterwave, Paystack/Stripe, Moniepoint, and OPay, while MTN MoMo, M-Pesa, Fawry, Network International, and NIBSS define adjacent or regional alternatives that shape buyer expectations. The competitive question is not whether digital-payments demand exists; it is whether Interswitch can preserve infrastructure depth while rivals win developer mindshare, merchant relationships, consumer frequency, or regulator-backed utility roles.'
sections:
- id: landscape
  title: 'Landscape: direct peers, incumbents, adjacencies, and the status quo'
  body: 'Interswitch competes across several overlapping arenas rather than one clean peer set. The direct Nigerian online-payments and merchant-software challenge comes from Flutterwave and Paystack, both of which lead with developer-friendly APIs, merchant onboarding, and internet-payment workflows. The agent, wallet, and daily consumer-frequency challenge comes more from OPay and, indirectly, telco- or mobile-money-style models such as MTN Mobile Money and M-Pesa. Moniepoint overlaps more deeply on merchant acceptance, business banking, and broader SME operating workflows. Regional incumbents such as Fawry in Egypt and Network International across the Middle East and Africa matter less as immediate Nigerian substitutes than as evidence that the payments-infrastructure category can fragment into local champions with different monetisation layers. Even NIBSS, although primarily a system utility and partner, shapes competition because the closer a workflow sits to public switching infrastructure,
    the less proprietary any single processor''s economics become. The status quo substitute also remains real: banks, merchants, and fintechs can multi-home or assemble blended rails instead of committing fully to one provider.'
