    severity: material
    topic: comparable valuation table
    missingEvidence: Current public valuation or market-cap data for every regional comparable in one consistent basis.
    whyItMatters: TV004 mixes private valuations, public market caps, and status references because the source set is heterogeneous.
    diligencePath: Refresh TV004 with consistent EV / revenue or market-cap measures where available.
