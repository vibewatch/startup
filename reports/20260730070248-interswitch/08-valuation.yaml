  - - Verve, payments rails, and institutional embeddedness create quality signals
    - Evidence of erosion in merchant or developer relevance would weaken the thesis
  - - Historic ~$1B anchor is still directionally plausible
    - A large premium above it without new mark or disclosure would weaken the call
  - - Nigeria concentration and stale price discovery remain the core anti-thesis
    - Geographic diversification and clearer segment disclosure would improve the view
  notes: The anti-thesis is mainly about price and concentration, not about lack of a real business.
