company:
  name: Interswitch
chapter:
  number: 8
  title: Valuation
  summary: The public record still anchors Interswitch around the ~$1B mark implied by Visa’s 2019 purchase of 20% for $200M, and that anchor remains directionally plausible because the company now discloses scaled revenue (₦137.5B / about $121M in 2024), a 2025 profit rebound, and continuing strategic relevance in Nigeria’s payment infrastructure. But the valuation mark is stale, the company remains highly Nigeria-concentrated, and IPO readiness has been discussed for years without a completed listing. The most defensible stance is therefore conditional-pass / at-market around the $0.9B-$1.3B band, with upside only if IPO readiness, geographic diversification, and cleaner financial disclosure become visible.
sections:
- id: thesis
  title: Investment thesis and anti-thesis at the current public valuation anchor
  body: 'The core investment thesis is straightforward: Interswitch is not a speculative app but one of Nigeria''s foundational payment infrastructures, with strong embeddedness, a domestic card scheme, broad workflow reach, and public evidence of real scale. Techpoint and other outlets report 2024 revenue of about ₦137.5 billion, while Technext24 and BusinessDay show a return to profitability in FY2025. Those are material proofs that the business still matters commercially. The anti-thesis is equally important. The most widely cited valuation anchor is still the 2019 Visa transaction implying roughly $1 billion. TechCabal''s December 2025 valuation table still lists Interswitch around that level, but that is not the same as a fresh primary valuation mark. In other words, the business appears stronger operationally than a stale-unicorn narrative might imply, yet the equity price still lacks a current arm''s-length reset. Because the business is profitable and infrastructure-heavy, the stale
    mark is not obviously excessive in the same way some venture-funded consumer fintechs may be. But without updated capital-market evidence, it is also not clearly cheap. The thesis is therefore positive on quality and market position, while the anti-thesis is centered on stale price discovery, concentration, and disclosure gaps rather than on the absence of product-market fit.'
