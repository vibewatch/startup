- id: context
  title: Financing context, entry discipline, and stale-mark risk
  body: Visa's 2019 purchase of 20% for $200 million remains the canonical public financing reference because it is both specific and widely cited. Public sources from BusinessAM Live, Today Africa, and TechCabal all reinforce that this transaction made Interswitch Nigeria's first fintech unicorn. Yet an investor in 2026 cannot rely on that event alone. Multiple articles over several years point to London and Lagos IPO aspirations or preparations, but none in the reviewed set establish a completed listing or a fresh public valuation. That gap matters for entry discipline. A business can improve while its valuation support weakens if the last mark is too old, if public comps compress, or if concentration risk remains unresolved. The revenue and profit rebound reduce the risk of a deep broken-story discount, but they do not prove a premium multiple is justified. The price question is therefore less 'is Interswitch good?' and more 'what discount or premium to the old unicorn mark is warranted
    in light of improved earnings but still-limited transparency?' Public evidence supports using the 2019 Visa mark as a reference point, not as a current clearing price. Entry discipline should therefore be anchored to updated revenue, profitability, and comparables rather than to prestige alone.
  claimRefs:
