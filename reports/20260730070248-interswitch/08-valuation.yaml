- id: decision
  title: Recommendation, exit readiness, and final diligence asks
  body: 'Recommendation: conditional-pass. Confidence: medium. Risk rating: medium-high. Valuation stance: at-market around the old unicorn anchor, but only with discipline. That call reflects a business that is clearly real and still strategically important, but whose current private value is under-documented. A pass without qualification would overstate certainty around price. A reject would ignore the combination of scale, profitability rebound, and infrastructure importance. Conditional-pass is the narrow answer between those two. The practical implication is that an investor could justify engagement around a range that does not stretch far above the historic ~$1 billion anchor, but should demand stronger evidence before paying a meaningful premium. Exit readiness is partial. The IPO narrative has persisted for years, but public evidence still does not show a completed pathway with confirmed exchange, timetable, or disclosure package. The final diligence asks therefore focus on current
    cap table and preferences, audited financials, segment margins, customer concentration, regulatory correspondence, and concrete IPO workstreams. The thesis would improve materially with a fresh valuation mark, cleaner diversification proof, or audited public-market readiness. It would deteriorate if concentration, regulatory drag, or margin compression worsened without a compensating growth or exit catalyst.'
