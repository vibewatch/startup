- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Further prolonged IPO delay
    - No credible listing or alternate liquidity plan visible over next strategic cycle
    - Exit optionality weakens and stale-mark discount should widen
    - Hold or reduce valuation expectations
  - - Nigeria concentration remains extreme
    - No credible diversification progress
    - Macro and regulatory risk stay over-weighted
    - Maintain concentration discount
  - - Material trust or regulatory event
    - Major adverse scheme, fraud, or licence event
    - Quality thesis weakens sharply
    - Shift to defensive / avoid stance
  - - Margin or share compression at the edge
    - Evidence gateway / merchant relevance is eroding
    - Infrastructure quality no longer converts into strong economics
    - Lower fair-value band
  - - Fresh premium-priced round without new disclosure
    - New mark materially above $1.3B with no better transparency
    - Price outruns evidence quality
    - Do not chase pricing
  notes: Triggers are designed for post-investment monitoring as well as pre-investment discipline.
  claimRefs:
  - CV033
  - CV034
  - CV035
  - CV036
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current cap table and preferences
    - Investor rights, liquidation stack, and any secondary marks
    - Price cannot be underwritten cleanly without knowing who gets paid first
    - Management / counsel / data room
  - - Audited financials and segment margins
    - Revenue quality by product and geography
    - Needed to test whether the old unicorn mark is still supported
    - Finance team / auditor
  - - Customer concentration and renewal
    - Top-account mix, contract tenor, and retention
    - Concentration risk is visible only at geography level today
    - Sales ops / finance
  - - Regulatory correspondence and incident history
    - Regulator letters, remediation, outages, and fraud-loss detail
    - Needed to close legal and operational downside gaps
    - Compliance / legal / risk
  - - IPO readiness package
    - Exchange plans, timetable, advisers, and gating items
    - Needed to decide whether exit timing deserves a premium
    - Board / CFO / advisers
  notes: These asks define the threshold between at-market engagement and a confident premium valuation.
