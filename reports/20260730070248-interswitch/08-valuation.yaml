  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current cap table and preferences
    missingEvidence: Current ownership, liquidation preferences, secondaries, or updated marks after the 2019 Visa deal.
    whyItMatters: Price cannot be fully underwritten without knowing who gets paid first and whether any fresher marks exist.
    diligencePath: Request cap table, preference stack, and any internal or secondary valuation materials.
    relatedQuestionRefs:
    - QV019
    - QV026
  - type: missing-source
    severity: material
    topic: comparable-multiple precision
    missingEvidence: A clean set of directly comparable revenue / EBITDA multiples for African payments infrastructure peers matched to Interswitch’s model.
    whyItMatters: The reviewed public sources support triangulation, but not a high-confidence precision multiple model.
    diligencePath: Build a comp sheet from public filings, annual reports, and management-adjusted segment definitions.
    relatedQuestionRefs:
    - QV014
