- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Regulatory tightening
    - Adverse licence, enforcement, or compulsory remediation event
    - Any material restriction on scheme or processing activities
    - Shift thesis to defensive / avoid until resolved
  - - Fraud / trust event
    - Major incident, breach, or spike in fraud losses
    - Evidence of worsening fraud trend or customer-trust hit
    - Demand incident disclosure and risk-premium adjustment
  - - Nigeria concentration
    - Country exposure remains extremely high without diversification proof
    - No credible reduction in Nigeria dependence over next strategic cycle
    - Maintain valuation discount and concentration caution
  - - IPO timing
    - No credible listing path or repeated multi-year slippage
    - Further delay without clear readiness milestones
    - Treat exit timing as optional, not base case
  - - Competitive compression
    - Edge players win customer interface while Interswitch stays utility-only
    - Evidence of margin or share erosion in gateway / merchant layers
    - Reassess moat and lower valuation support
  notes: Triggers are framed as monitorable investment checkpoints rather than predictive certainties.
