- id: operational
  title: Operational reliability, fraud, and trust risk flow directly into adoption
  body: 'Operational risk is unusually important in payments infrastructure because customer trust depends on uptime, fraud control, and routing integrity more than on marketing. Interswitch''s own NIBSS partnership announcement highlights system uptime, transaction success rates, terminal re-certification, and compliance alignment as active priorities rather than settled facts. That is consistent with the broader ecosystem data. Today Africa cites NIBSS-linked fraud-loss reporting of ₦25.85 billion in 2025 even after a decline from the prior year, showing that fraud remains a large system cost. Nairametrics'' 2026 reporting on the Verve routing dispute is also revealing: even where the company owns a strong domestic card brand, downstream processor conflict can quickly become a customer-trust and partner-alignment problem. Privacy and data handling create another operational-legal bridge. Interswitch''s privacy policy explicitly frames the business around customer and partner data collection,
    retention, and disposal under industry regulation, which is the right posture but also confirms how central information governance is to the operating model. In short, operational risk is not just outage risk. It includes fraud exposure, data stewardship, partner certification, scheme disputes, and the practical challenge of keeping a high-volume infrastructure stack dependable while the market and rulebook keep changing.'
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
