- id: execution-exit
  title: Execution, dependency, and exit risk center on IPO timing and multi-party coordination
  body: 'Execution risk is amplified by the fact that Interswitch is trying to do several difficult things at once: defend core rails, keep upgrading product layers, expand selectively across Africa, and preserve IPO optionality after years of delay. Multiple public articles spanning Financial Nigeria, Tekedia, EcofinAgency, BusinessAMLive, and IPOs.fyi show that a London/Lagos dual-listing narrative has persisted for years without a completed offering. That does not prove failure, but it does create exit-timing risk and raises the chance that public-market readiness stays just over the horizon. Dependency risk is equally important. Interswitch depends on regulators, NIBSS-linked interoperability, institution partners, merchants, public agencies, and increasingly global acceptance or banking-tech partners. That many coordination points can deepen defensibility, but it also means a single weak link—an adverse regulatory turn, a trust event, a failed rollout, a delayed bank-tech commercialization
    path, or a major partner misalignment—can slow progress across the thesis. The practical investment implication is that the company should be judged not only on growth and historic importance, but on whether management can keep the ecosystem synchronized while converting infrastructure stature into cleaner, more geographically resilient equity outcomes.'
