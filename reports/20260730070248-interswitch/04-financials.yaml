  - TI005
  figureRefs:
  - FI003
  - FI004
- id: financial-verdict
  title: Financial verdict on revenue quality, margin path, and underwriting readiness
  body: The public-financial verdict is cautiously constructive. Revenue quality looks stronger than a typical consumer-fintech story because Interswitch monetizes infrastructure workflows embedded in banks, merchants, enterprises, and government-linked payment flows. The profit rebound in FY2025 reduces one of the biggest concerns that emerged after the loss period. At the same time, the company remains under-disclosed for institutional valuation work. There is not enough public evidence to model stream-level margins, working-capital stress, credit exposure, or cash sufficiency under adverse macro scenarios. The Temenos partnership and continued product launches suggest management is still investing into future monetisation layers rather than harvesting a mature asset, which is positive strategically but harder to translate into near-term financial forecasts. Overall, public evidence supports the view that Interswitch is a scaled, economically meaningful processor with improving profitability,
    but final underwriting still requires management materials on revenue mix, margin by line, treasury exposure, and current liquidity headroom.
  claimRefs:
