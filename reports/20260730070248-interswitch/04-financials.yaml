company:
  name: Interswitch
chapter:
  number: 4
  title: Financials
  summary: Public evidence supports that Interswitch is a scaled, profitable Nigerian payments infrastructure company, but it does not provide the private-company depth needed for a full institutional underwrite. The strongest disclosed signals are ₦137.5 billion revenue in 2024, more than 90% Nigerian revenue concentration, and a return to roughly ₦23 billion pre-tax profit and ₦14.7 billion after-tax profit in FY2025. What remains missing are segment mix, realized pricing, gross margin, loss rates, burn, cash, and working-capital detail. The financial picture is therefore directionally positive on revenue quality and operating leverage, but incomplete on capital adequacy and unit economics.
sections:
- id: revenue-model
  title: Revenue streams, monetisation, and what public evidence really proves
  body: 'Interswitch''s revenue model is best understood as a multi-stream infrastructure model rather than a single payments take-rate. Official materials show monetisation surfaces across card issuance and acceptance, payment switching, enterprise collections, gateway services, digital banking enablement, government-revenue processing, bill payments, and agent-facing payment services. Independent reporting fills in the scale signal: TechCabal, Techpoint, Innovation Village, and BusinessDay all reported that revenue reached about ₦137.5 billion in 2024, up roughly 50% year over year. That supports real commercial scale, but not segment-level attribution. Public evidence does not let an outside investor cleanly split how much of revenue comes from Verve, Quickteller, switching, merchant acquiring, public-sector collections, or newer banking-technology services. As a result, this chapter can describe the mechanics of the revenue engine with reasonable confidence, yet it cannot assert a precise
    mix by stream. The key implication is that Interswitch appears to monetize broad transaction infrastructure with multiple fee surfaces, but the durability and margin of each stream remain partially opaque.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI008
  tableRefs:
  - TI001
