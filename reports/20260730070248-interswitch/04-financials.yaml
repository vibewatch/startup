- id: traction-and-profitability
  title: Traction, concentration, and profitability signals
  body: 'The highest-confidence financial traction signals are recent and material. Techpoint Africa reported that Interswitch''s revenue rose 50% to ₦137.5 billion in 2024, while Innovation Village and TechCabal carried the same revenue figure and Nigeria concentration message. Technext24 and BusinessDay then reported that the company returned to profitability in FY2025, with pre-tax profit around ₦23 billion and after-tax profit around ₦14.7 billion, reversing the prior loss period. Those disclosures matter because they imply that Interswitch is no longer just a historically important platform: it is again showing positive earnings power at significant scale. The major caveat is concentration. Multiple reports state that more than 90% of revenue still comes from Nigeria. That concentration may simplify go-to-market focus and local moat formation, but it also means the financial base is highly exposed to one economy, one currency, and one regulatory environment. Public evidence therefore
    supports growth and profit rebound more strongly than it supports geographic diversification or revenue resilience outside Nigeria.'
  claimRefs:
  - CI009
  - CI010
  - CI011
  - CI012
  - CI013
