  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: liquidity
    missingEvidence: Current cash, debt, and covenant package.
    whyItMatters: Without liquidity detail, profitability cannot be translated into resilience or IPO readiness.
    diligencePath: Request latest management accounts, debt schedule, and monthly cash bridge.
    relatedQuestionRefs:
    - QI017
    - QI018
    - QI024
  - type: private-evidence-only
    severity: material
    topic: unit economics
    missingEvidence: Gross margin, take rates, fraud-loss burden, and support cost by product line.
    whyItMatters: These inputs determine true revenue quality and margin durability.
    diligencePath: Request segment P&L and monthly operating dashboards for cards, gateway, collections, and banking tech.
    relatedQuestionRefs:
    - QI013
    - QI015
    - QI016
    - QI024
  - type: missing-source
    severity: material
    topic: customer concentration
    missingEvidence: Revenue concentration by top customers / institutions and renewal data.
    whyItMatters: Financial quality depends partly on concentration and contract durability.
    diligencePath: Request top-20 customer revenue mix, renewal rates, and largest contract tenors.
    relatedQuestionRefs:
    - QI022
    - QI024
