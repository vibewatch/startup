- id: trust-roadmap
  title: Trust, compliance, quality controls, and roadmap gaps
  body: 'The trust and control story is an important part of the product itself. Techpoint''s gateway explainer says Interswitch Payment Gateway supports extensive rails and uses PCI DSS compliance, tokenization, and adaptive authentication to reduce fraud and chargeback risk. BusinessDay''s 2025 technology coverage adds that Interswitch is actively pushing tokenization, tap-to-pay, contactless cards, and cross-border interoperability, with management claiming more than 40 million Verve cards already rolled out with contactless functionality. Temenos further described Verve as a domestic payment cards and tokens scheme with more than 100 million payment cards issued. These signals make the product roadmap legible: secure credential abstraction, contactless usage, broader acceptance, and deeper financial-institution software layers. But the gaps matter. Public materials reviewed here do not clearly document a named open-banking API product, despite open-banking relevance in the market, and
    they do not prominently document a current standalone LANPAY surface. Those absences do not disprove product capability, but they do mean a cautious reviewer should separate what is clearly public and production-facing from what may be internally developed, white-labelled, or simply under-disclosed. The roadmap appears active and commercially relevant; the product documentation is informative but not exhaustive.'
