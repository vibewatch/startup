tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - User
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Verve card and token platform
    - Consumers, issuers, merchants
    - Mature / scaled
    - Domestic card-scheme ownership and expanding international acceptance
    - Need scheme economics, issuer incentives, and margin by product
  - - Quickteller consumer platform
    - Consumers
    - Mature / scaled
    - Bills, transfers, airtime, and multi-channel utility
    - Need active-user, retention, and monetisation data
  - - Quickteller Paypoint / assisted channel
    - Agents, SMEs, underserved users
    - Mature / field-distributed
    - Extends services into communities and assisted payments
    - Need current active-agent and profitability data
  - - IPG / payments and collections
    - Merchants, enterprises, billers
    - Mature / core
    - Broad rails across cards, transfers, USSD, QR, wallets, and more
    - Need success-rate, take-rate, and segment split
  - - Developer API marketplace
    - Developers, fintechs, partners
    - Mature / actively maintained
    - Modular APIs across payments, transfers, VAS, wallet, loans, paycode, cards
    - Need adoption metrics and versioning / deprecation policy
  - - Digital-banking enablement
    - Banks, fintechs
    - Emerging / strategic
    - Temenos-linked banking-tech expansion
    - Need implementation count and commercial model
  - - Vertical solutions (energy, mobility, healthcare, public service)
    - Institutions, enterprises, public-sector users
    - Emerging to medium
    - Same payment rails reused in sector-specific workflows
    - Need scaled deployment counts and renewal evidence
  notes: Maturity reflects evidence continuity and public product visibility, not internal engineering age alone.
