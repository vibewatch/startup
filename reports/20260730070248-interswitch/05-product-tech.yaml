- id: deployment
  title: Deployment surfaces, integration patterns, and product maturity
  body: 'Deployment varies by user and product. Developer-facing integrations appear self-serve at the credential and documentation level, with the API marketplace and docs environment meant to support partner implementation. Merchant and enterprise deployment is more operational: gateway, collections, and business tools plug into commerce workflows, while assisted-payment networks such as Quickteller Paypoint require field support and distribution. Consumer products such as Quickteller and Verve depend on trust, acceptance, and convenience rather than only on API quality. Recent product and partnership announcements show continuing deployment into new contexts: digital forecourt payments, Blue Line rail payments through Cowry Card, e-clinic deployment in Lagos primary healthcare centres, Hamilton Telecom partnership in Uganda, and international acceptance expansions through Temu and AliExpress. These are not all equivalent in scale or maturity, but together they show the same underlying
    thesis: Interswitch wants its payment layer to show up inside many operational environments rather than only in a checkout box. Product maturity therefore looks strongest for cards, switching, collections, and payment APIs; medium for newer vertical packages; and less clear for a fully public open-banking API or a prominently disclosed LANPAY product line.'
  claimRefs:
  - CE019
  - CE020
  - CE021
  - CE022
  - CE023
  - CE024
  - CE025
  - CE026
  - CE027
