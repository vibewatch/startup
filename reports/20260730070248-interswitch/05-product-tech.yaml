- id: architecture
  title: Operating architecture, rails, and partner dependencies
  body: 'Public evidence supports a modular operating model built around shared payment rails, APIs, and partner integrations rather than a single monolithic front end. The docs home page explicitly organizes capabilities into payment acceptance, transfers, VAS, agent cashout, lending APIs, wallet services, Paycode, and virtual cards. That indicates a service-layer approach in which third parties can consume discrete functions depending on their use case. Official solutions pages and the NIBSS partnership announcement reinforce the infrastructure role: Interswitch operates in bank-linked, merchant, and institutional workflows that require switching reliability, interoperability, and regulatory alignment. The Temenos partnership suggests an additional architecture layer around digital-banking enablement, potentially letting financial institutions use Interswitch for faster delivery of embedded or modernized banking experiences. At the same time, the exact internal architecture remains only
    partially public. The available documentation is enough to prove a broad API marketplace and operating stack, but not enough to independently verify internal latency, redundancy topology, or all dependency boundaries. That means architecture diligence can confirm modular intent and partner-connected design, while still leaving system-depth questions for management or technical review.'
  claimRefs:
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
