runDate: '2026-07-30'
company:
  name: Interswitch
chapter:
  number: 5
  title: Product & Technology
  summary: 'Interswitch delivers a layered payments stack rather than a single app: Verve for cards and tokenized credentials, Quickteller for consumer and bill-payment surfaces, gateway and collections tooling for merchants and enterprises, developer APIs for payments/transfers/wallets/value-added services, and sector-specific solutions built on the same rails. The strongest public evidence supports mature payments infrastructure, meaningful API breadth, and continuing expansion into tokenization, contactless, and banking-tech enablement. The weakest areas are public disclosure around deeper architecture details, a clearly documented open-banking API product, and the current standalone positioning of LANPAY.'
sections:
- id: portfolio
  title: Product portfolio in customer-workflow terms
  body: 'The product estate is best understood as a layered portfolio aligned to customer jobs rather than brand silos. For consumers, Quickteller handles everyday bills, transfers, airtime, and other payment tasks; official brand messaging and historical reporting describe it as the digital-payment surface for intuitive transactions. For card-based commerce, Verve remains the flagship domestic card and token platform, with official communications citing 70 million cards in Nigeria and more than 100 million cards across Africa in later messaging. For merchants and businesses, Interswitch offers gateway, collections, value-added services, business operations tools, and assisted payments. The developer and docs surfaces make this practical: payment acceptance, transfers, VAS, agent cashout, loans, wallet services, virtual cards, and Paycode are presented as modular services that can be embedded into partner products. The company also extends beyond generic payments into verticalized solutions
    such as mobility, energy, healthcare, and public-service workflows. This breadth is strategically useful because it lets Interswitch participate in multiple fee events around the same payment relationship, but it also raises the burden of product coherence and release velocity across the estate.'
