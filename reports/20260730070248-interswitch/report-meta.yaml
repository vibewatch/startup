companyProfile:
  summary: >-
    Interswitch is a Lagos-based payments infrastructure company founded in 2002 by
    Mitchell Elegbe. It built one of Nigeria's core electronic payments stacks,
    spanning switching and settlement connectivity, the Verve domestic card scheme,
    Quickteller consumer bill-pay and transfer flows, merchant acceptance products,
    and integration layers used by banks, public-sector entities, merchants, and
    fintechs. Public reporting supports meaningful scale: 2024 revenue of ₦137.5B,
    a rebound to roughly ₦23B pre-tax profit in FY2025, and continued strategic
    relevance inside Nigeria's digital-payments ecosystem. The business also carries
    concentrated exposure to one geography, limited public disclosure, and an aging
    2019 unicorn valuation anchor still awaiting a clean public-market test.
  foundedDate: "2002-01-01"
  founders:
    - name: "Mitchell Elegbe"
      role: "Founder & Group Managing Director/CEO"
      background: >-
        Nigerian entrepreneur and payments operator who founded Interswitch after
        earlier work in banking and technology roles, then led the build-out of its
        switching, card, and merchant-payments franchise.
      claimRefs: [CO001, CO003]
  foundingLocation: "Lagos, Nigeria"
  headquarters: "Lagos, Nigeria"
  productSummary: >-
    Interswitch sells payments infrastructure: switching and settlement rails,
    domestic card scheme issuance and acceptance through Verve, Quickteller
    consumer payments, merchant acquiring and acceptance products, APIs and network
    integrations for banks/fintechs, and adjacent enterprise payment workflows.
  customerFocus: >-
    Nigerian banks, merchants, public institutions, fintech platforms, and mass-
    market consumers using domestic cards, bill payment, transfers, and acceptance
    rails.
  businessModel: >-
    The company monetizes transaction processing, switching and settlement fees,
    card-scheme economics, merchant-service and acceptance fees, enterprise payment
    software/integration charges, and related value-added services.
  stage: "Growth / pre-IPO candidate"
  fundingStatus: >-
    Publicly associated with a November 2019 Visa investment of $200M for a 20%
    stake, implying about a $1B valuation; public sources continue to reference IPO
    preparation, but no newer primary valuation reset has been clearly disclosed.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO008, CE002, CI009, CI010, CI011, CV001, CV002, CV040]
summary:
  headline: >-
    Interswitch appears to be a durable Nigerian payments infrastructure franchise
    with real revenue and renewed profitability, but the public record still favors
    further diligence over paying materially above its stale 2019 unicorn anchor.
