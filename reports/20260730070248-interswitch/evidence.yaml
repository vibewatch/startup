evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding
    missingEvidence: >-
      A statutory incorporation record or company secretarial extract that resolves whether formation should be dated
      2001 or 2002.
    whyItMatters: The founding year is a core identity fact reused across every chapter and on the front-page company profile.
    diligencePath: Request CAC and foreign-entity registration extracts plus an internal corporate chronology from management.
    relatedQuestionRefs:
      - QO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board composition, committee structure, and any independent-director roster.
    whyItMatters: Governance depth and succession readiness are central to underwriting IPO readiness and key-person risk.
    diligencePath: Request current board deck, cap table, governance manual, and board observer rights from investors.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: ownership
    missingEvidence: >-
      Current fully diluted cap table, preference stack, and whether any shareholder has partial exit rights tied to a
      future IPO.
    whyItMatters: >-
      The last clean valuation marker is from 2019, so present economics may diverge meaningfully from the public
      narrative.
    diligencePath: Obtain shareholder register, option schedule, and all post-2019 financing or secondary documents.
    relatedQuestionRefs:
      - QO009
      - QO010
      - QO011
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone chronology
    missingEvidence: >-
      A complete board-approved milestone chronology covering exact dates for every financing, expansion, and governance
      event listed publicly.
    whyItMatters: >-
      The milestone table is the chronology of record for the report, so ambiguous dates weaken later cross-chapter
      references.
    diligencePath: Reconcile official press archive, investor updates, and internal legal records into one signed chronology.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: A current employee count or audited payroll proxy for direct staff and major contractor populations.
    whyItMatters: Headcount is a basic maturity and cost-structure input later needed for financial and operational benchmarking.
    diligencePath: Request HR snapshot, payroll totals, and location-level staffing breakdowns from management.
    relatedQuestionRefs:
      - QO021
  - type: missing-source
    severity: material
    topic: market tam
    missingEvidence: >-
      A clean third-party revenue TAM or infrastructure take-rate dataset for Nigerian payments infrastructure
      incumbents specifically.
    whyItMatters: >-
      Without a consistent infrastructure-only market estimate, sizing has to rely on transaction and adoption proxies
      rather than a direct revenue pool.
    diligencePath: >-
      Obtain industry research separating switching, acquiring, issuance, agent enablement, and gateway revenue pools
      for Nigeria.
    relatedQuestionRefs:
      - QM021
      - QM022
      - QM025
  - type: private-evidence-only
    severity: material
    topic: market share
    missingEvidence: Interswitch's current switching, acquiring, and gateway share by channel versus major competitors.
    whyItMatters: >-
      Market attractiveness is easier to assess than capture efficiency; chapter-level conclusions remain incomplete
      without share and win-rate data.
    diligencePath: Request management market-share decks, acquiring volumes, issuer counts, and channel-level success-rate data.
    relatedQuestionRefs:
      - QM023
  - type: stale
    severity: minor
    topic: financial inclusion
    missingEvidence: A 2024-2026 refresh of excluded-adult counts using the latest EFInA or regulator-supported survey.
    whyItMatters: Inclusion headroom is an important market lens, but the best public figure here remains 2023.
    diligencePath: Refresh with latest EFInA release or official inclusion dashboard when published.
    relatedQuestionRefs:
      - QM010
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Clean side-by-side public pricing and discounting data for large enterprise, merchant, and bank contracts across
      Interswitch and major peers.
    whyItMatters: Without realized pricing, competitive advantage can be described but not converted into hard margin comparisons.
    diligencePath: Request enterprise price books, merchant discount-rate schedules, and realized take-rate data by segment.
    relatedQuestionRefs:
      - QP015
      - QP020
  - type: private-evidence-only
    severity: material
    topic: win-loss
    missingEvidence: >-
      Recent win/loss data by bank, fintech, merchant, and government segment versus Flutterwave, Paystack, Moniepoint,
      and OPay.
    whyItMatters: Competitive durability depends on actual displacement and renewal outcomes, not only product-page comparison.
    diligencePath: Request pipeline conversion data, churn data, and named displacement cases.
    relatedQuestionRefs:
      - QP017
      - QP025
  - type: missing-source
    severity: minor
    topic: regional-adjacent detail
    missingEvidence: >-
      Richer public disclosures on MTN MoMo, M-Pesa, and Fawry relevant specifically to Nigeria-comparable merchant and
      infrastructure economics.
    whyItMatters: These players are used mainly as archetypes here, not full numerical peers.
    diligencePath: Pull annual reports and market-specific filings for more exact traction and economics.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: material
    topic: liquidity
    missingEvidence: Current cash, debt, and covenant package.
    whyItMatters: Without liquidity detail, profitability cannot be translated into resilience or IPO readiness.
    diligencePath: Request latest management accounts, debt schedule, and monthly cash bridge.
    relatedQuestionRefs:
      - QI017
      - QI018
      - QI024
  - type: private-evidence-only
    severity: material
    topic: unit economics
    missingEvidence: Gross margin, take rates, fraud-loss burden, and support cost by product line.
    whyItMatters: These inputs determine true revenue quality and margin durability.
    diligencePath: Request segment P&L and monthly operating dashboards for cards, gateway, collections, and banking tech.
    relatedQuestionRefs:
      - QI013
      - QI015
      - QI016
      - QI024
  - type: missing-source
    severity: material
    topic: customer concentration
    missingEvidence: Revenue concentration by top customers / institutions and renewal data.
    whyItMatters: Financial quality depends partly on concentration and contract durability.
    diligencePath: Request top-20 customer revenue mix, renewal rates, and largest contract tenors.
    relatedQuestionRefs:
      - QI022
      - QI024
  - type: missing-source
    severity: material
    topic: open banking
    missingEvidence: A clear official product page or developer reference for an Interswitch-branded open-banking API.
    whyItMatters: >-
      Open banking is strategically important in Nigeria, but product-specific visibility is needed to underwrite
      readiness.
    diligencePath: Request open-banking product docs, bank participants, consent architecture, and production metrics.
    relatedQuestionRefs:
      - QE018
  - type: missing-source
    severity: material
    topic: LANPAY
    missingEvidence: Current official collateral defining LANPAY as a standalone product, module, or merchant surface.
    whyItMatters: User-specified product importance is not matched by strong public evidence in the reviewed set.
    diligencePath: Request current LANPAY deck, feature sheet, merchant deployment data, and roadmap status.
    relatedQuestionRefs:
      - QE019
  - type: private-evidence-only
    severity: material
    topic: architecture performance
    missingEvidence: Internal uptime, latency, redundancy, incident, and adoption metrics by product module.
    whyItMatters: These determine whether the public product story is matched by enterprise-grade operational performance.
    diligencePath: Request architecture review, status / incident history, API uptime, and implementation metrics.
    relatedQuestionRefs:
      - QE016
      - QE017
      - QE020
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: NRR, GRR, churn, contract duration, and renewal data by customer segment.
    whyItMatters: Without durability metrics, production proofs cannot be translated into reliable future revenue quality.
    diligencePath: Request segment-level retention cohorts, contract-tenor data, and renewal performance.
    relatedQuestionRefs:
      - QU018
      - QU019
      - QU024
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Revenue concentration by top institutions, merchants, public-sector accounts, and channels.
    whyItMatters: Geographic concentration is visible, but account concentration is not.
    diligencePath: Request top-20 account revenue mix and dependency analysis.
    relatedQuestionRefs:
      - QU020
      - QU021
      - QU024
  - type: missing-source
    severity: minor
    topic: commercial depth
    missingEvidence: Contract values, rollout penetration, and usage intensity for named deployments.
    whyItMatters: Named proof shows real use cases, but not enough to compare strategic value across customers.
    diligencePath: >-
      Request deployment KPIs, GMV / transaction counts, site counts, and renewal milestones for each named customer
      proof.
    relatedQuestionRefs:
      - QU011
      - QU023
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
