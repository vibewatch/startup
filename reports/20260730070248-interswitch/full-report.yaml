              - CV033
      - number: '8.3'
        title: Comparable set, scenario ranges, and downside triggers
        blocks:
          - type: paragraph
            body: >-
              The best comparable set is mixed rather than pure. Flutterwave, OPay, and Moniepoint are relevant African
              private comps because they show how the market values scaled regional fintech leaders: TechCabal's 2025
              table places Flutterwave at about $3 billion, OPay around $2.7-$3 billion, Moniepoint above $1 billion,
              and Interswitch near $1 billion. Fawry, dLocal, Adyen, and Network International provide public or
              public-market-adjacent model references rather than direct like-for-like peers. dLocal and Adyen are
              structurally useful because they are processor/infrastructure businesses operating at public-market scale,
              while Fawry and Network International are more regionally grounded payments references. A clean multiple
              exercise is still hard because the reviewed public sources here give much stronger evidence for scale,
              reach, and market capitalization than for directly comparable revenue-multiple datasets on every peer. The
              scenario method is therefore more honest than false precision. In a bull case, a completed IPO path,
              sustained profitability, and a stronger Africa expansion narrative could justify a premium above the old
              $1 billion anchor. In a base case, the stale mark, Nigeria concentration, and incomplete disclosure keep
              fair value near the current public anchor. In a bear case, prolonged IPO delay, competitive compression,
              or a weaker macro backdrop pull the range below the old unicorn label.
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
