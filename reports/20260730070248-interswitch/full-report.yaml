      - number: '1.2'
        title: Founder-market fit, leadership bench, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Founder-market fit is unusually strong. Mitchell Elegbe’s official leadership biography says he worked at
              TELNET as group head for business development after time at Schlumberger, while Today Africa adds that he
              left TELNET to build switching software for Nigerian banks and ATMs after seeing the costs of a
              cash-heavy, disconnected banking system. That combination of technical background and first-hand exposure
              to Nigeria’s payment bottlenecks is central to why Interswitch could become infrastructure rather than a
              thin app layer. Current public leadership visibility is mixed. The official leadership and news materials
              clearly identify Mitchell as founder and group managing director/CEO, Cherry Eromosele as executive vice
              president for marketing and communications, Vincent Ogbunude as the Verve executive, and Akeem Lawal as a
              senior switching and payment-processing operator. The bench is therefore more substantial than a
              single-founder story, but board composition, independent-director presence, succession planning, and
              formal governance committees are not disclosed in the reviewed public record. For a company still
              associated with IPO optionality, that lack of governance transparency is a material diligence gap rather
              than a cosmetic omission.
