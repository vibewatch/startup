        title: Product portfolio in customer-workflow terms
        blocks:
          - type: paragraph
            body: >-
              The product estate is best understood as a layered portfolio aligned to customer jobs rather than brand
              silos. For consumers, Quickteller handles everyday bills, transfers, airtime, and other payment tasks;
              official brand messaging and historical reporting describe it as the digital-payment surface for intuitive
              transactions. For card-based commerce, Verve remains the flagship domestic card and token platform, with
              official communications citing 70 million cards in Nigeria and more than 100 million cards across Africa
              in later messaging. For merchants and businesses, Interswitch offers gateway, collections, value-added
              services, business operations tools, and assisted payments. The developer and docs surfaces make this
              practical: payment acceptance, transfers, VAS, agent cashout, loans, wallet services, virtual cards, and
              Paycode are presented as modular services that can be embedded into partner products. The company also
              extends beyond generic payments into verticalized solutions such as mobility, energy, healthcare, and
              public-service workflows. This breadth is strategically useful because it lets Interswitch participate in
              multiple fee events around the same payment relationship, but it also raises the burden of product
              coherence and release velocity across the estate.
