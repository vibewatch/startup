  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Interswitch's addressable market is broader than a simple payments gateway market but narrower than
              Nigeria's full financial-services economy. The market clearly includes payment switching, merchant
              acquiring, card issuance and acceptance, digital bill payment, enterprise collections and disbursements,
              agency banking enablement, and government-revenue payment infrastructure. Official product pages show
              Interswitch serving banks, fintechs, enterprises, developers, SMEs, governments, and individuals through
              products such as Paydirect, AutoPay, Quickteller, IPG, fintech card issuance, and API-led banking
              services. That breadth means the relevant market boundary is best defined as payments and commerce
              infrastructure rather than consumer fintech alone. At the same time, the market should exclude standalone
              credit, insurance, and deposit businesses where Interswitch does not directly own the full balance-sheet
              relationship. Status-quo substitutes also matter: banks can build internally, merchants can stay
              cash-heavy, and fintechs can assemble multi-vendor stacks instead of using a single incumbent provider.
              Those substitutes reduce any temptation to overstate market inevitability, even though Interswitch
              benefits from deep local switching and compliance embeddedness.
            claimRefs:
