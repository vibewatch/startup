      - number: '3.4'
        title: Switching costs, multi-homing, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Interswitch's moat is real, but it is not absolute. Its strongest defenses are embeddedness in bank and
              government workflows, long-standing switching relationships, the Verve card scheme, and the fact that many
              newer fintechs historically built on top of infrastructure layers Interswitch helped normalize. Today
              Africa explicitly notes that Flutterwave and Paystack rely on Interswitch rails in Nigeria, which
              reinforces the infrastructure-incumbent argument. But developer-first gateways and merchant platforms can
              still erode economics by owning the user interface, checkout experience, and merchant relationship.
              Multi-homing is also widespread in payments: merchants often keep several gateways, consumers can move
              across apps, and institutions can route selectively. Competitive durability therefore depends less on a
              pure network-effect story and more on whether Interswitch can keep expanding product relevance around its
              infrastructure core. The adverse evidence is meaningful. A 2026 Verve-routing dispute reported by
              Nairametrics shows that even a domestic card-scheme advantage can become contested through processor
              conflicts and fee disputes. The competitive verdict is that Interswitch still has meaningful depth, trust,
              and local-rail relevance, but its moat will weaken if developer experience, merchant packaging, or
              cross-border capability continue to improve faster outside the company than inside it.
            claimRefs:
              - CP026
              - CP027
              - CP028
