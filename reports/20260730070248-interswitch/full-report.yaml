    summary: >-
      Interswitch's public trajectory runs from early switching infrastructure in Nigeria to Verve, Quickteller,
      private-equity control, Visa's minority investment, debt-market funding, regulatory restructuring, and a
      still-unfinished IPO narrative.
    data:
      items:
        - date: '2002'
          label: Founded
          detail: >-
            Mitchell Elegbe launches Interswitch in Lagos to connect banks and ATM networks; IFC later cites 2001
            formation.
          tone: positive
          claimRefs:
            - CO001
            - CO004
        - date: '2006'
          label: Quickteller launch
          detail: Quickteller is launched as a multi-channel payments platform for consumers and businesses.
          tone: positive
          claimRefs:
            - CO042
        - date: 2010-12
          label: Helios acquires majority
          detail: Helios-led investor group agrees a majority equity acquisition, establishing the long PE ownership era.
          tone: positive
          claimRefs:
            - CO017
        - date: 2017-03
          label: TA Associates minority investment
          detail: TA buys a minority interest while Helios remains majority shareholder.
          tone: positive
          claimRefs:
            - CO018
        - date: 2019-11
          label: Visa invests $200M
          detail: Visa buys 20% of Interswitch and the deal becomes the canonical $1B valuation anchor.
          tone: positive
          claimRefs:
            - CO020
            - CO021
        - date: 2020-02
          label: ₦23B bond listing
          detail: Interswitch uses a domestic bond listing instead of public equity to diversify funding.
          tone: neutral
          claimRefs:
            - CO044
        - date: 2025-05
          label: M-Kudi MMO approval
          detail: Subsidiary M-Kudi receives final CBN approval as a mobile-money operator.
          tone: positive
          claimRefs:
            - CO034
        - date: 2025-12
          label: Verve reaches 100M cards
          detail: Official newsroom states Verve crossed 100 million cards issued across Africa.
          tone: positive
