      - number: '4.3'
        title: Unit economics, cost structure, and capital adequacy gaps
        blocks:
          - type: paragraph
            body: >-
              Public information is thin on the variables that matter most for a true underwriting model. There is no
              reliable public disclosure here for gross margin, net revenue retention, customer acquisition cost, sales
              efficiency, take rate by product, fraud-loss burden, cash on hand, monthly burn, or debt covenants. That
              does not mean the business is weak; it means outsiders cannot responsibly quantify several core
              unit-economics lines. Some directional inference is possible. A profitable payments-infrastructure model
              typically depends on high transaction throughput, fixed-cost leverage across rails and compliance
              operations, and disciplined fraud and settlement management. The return to profit in FY2025 suggests
              operating leverage improved or non-core drag eased, but the exact driver is not visible. Likewise, public
              reports of Visa, Helios, TA Associates, and IFC involvement establish a strong historic-capital base, yet
              they do not reveal current cash reserves, preference terms, or next-round needs. For diligence purposes,
              the absence of balance-sheet detail is the main blocker, not a proven capital shortfall.
