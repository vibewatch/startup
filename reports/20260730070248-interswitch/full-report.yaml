  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams, monetisation, and what public evidence really proves
        blocks:
          - type: paragraph
            body: >-
              Interswitch's revenue model is best understood as a multi-stream infrastructure model rather than a single
              payments take-rate. Official materials show monetisation surfaces across card issuance and acceptance,
              payment switching, enterprise collections, gateway services, digital banking enablement,
              government-revenue processing, bill payments, and agent-facing payment services. Independent reporting
              fills in the scale signal: TechCabal, Techpoint, Innovation Village, and BusinessDay all reported that
              revenue reached about ₦137.5 billion in 2024, up roughly 50% year over year. That supports real commercial
              scale, but not segment-level attribution. Public evidence does not let an outside investor cleanly split
              how much of revenue comes from Verve, Quickteller, switching, merchant acquiring, public-sector
              collections, or newer banking-technology services. As a result, this chapter can describe the mechanics of
              the revenue engine with reasonable confidence, yet it cannot assert a precise mix by stream. The key
              implication is that Interswitch appears to monetize broad transaction infrastructure with multiple fee
              surfaces, but the durability and margin of each stream remain partially opaque.
