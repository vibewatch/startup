      - number: '1.5'
        title: Milestones, regulatory events, and unresolved exit narrative
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a business that repeatedly reinvents itself around infrastructure depth while
              still carrying unresolved concentration and market-structure risks. Today Africa’s chronology traces the
              first switch rollout, the launch of Verve as a domestic card scheme, the 2006 Quickteller launch, the 2010
              Helios transaction, later East African acquisitions, the 2019 Visa stake sale, and the 2020 bond issuance.
              More recent official materials add evidence of continued strategic motion: a 2024 NIBSS partnership to
              comply with Nigeria’s PTSA routing regime, 2025 and 2026 global fintech recognitions, a 2025 mobile-money
              licence for M-Kudi, 2026 Temenos partnership for digital banking services, 2026 public sector and
              energy-retail deployments, and Uganda expansion through the Quickteller agent network. However, the
              adverse side matters too. Nairametrics reported in May 2026 that processors and acquirers threatened Verve
              suspension over routing exclusivity and fee disputes, showing that market power can turn into ecosystem
              friction. IPO history is similarly unfinished: plans for dual London/Lagos listing were shelved in the
              2015–2017 period, revived in 2019, but still had not culminated in a public transaction by the July 2026
              run date. That combination of strategic resilience and incomplete exit execution should be treated as a
              central framing fact for every later chapter.
