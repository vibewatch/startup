  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation by buyer, user, payer, and use case
        blocks:
          - type: paragraph
            body: >-
              Interswitch's customer base is structurally multi-sided. Banks and financial institutions use the company
              for switching, card, and digital-banking infrastructure. Fintechs and developers can consume payments,
              transfer, wallet, or related APIs. Merchants and SMEs use gateway, collections, Quickteller Business, and
              assisted-payment tools. Government agencies and public institutions use revenue-collection and
              service-delivery infrastructure. Individuals use Quickteller, Verve, and agent channels as end-users, even
              when they are not the contracting party. This segmentation matters because buyer, user, and payer often
              diverge: a bank may buy the capability, merchants and cardholders use it, and end customers indirectly
              fund usage through payment economics. The strongest public evidence supports breadth across banks,
              merchants, agents, government, and consumer touchpoints, not one narrow customer niche. That is positive
              for resilience at the ecosystem level, but it also means the company must satisfy many stakeholder types
              simultaneously—regulators, issuers, merchants, agents, and public-sector operators—each with different
              needs and renewal logic.
