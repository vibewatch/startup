      - number: '1.3'
        title: Ownership, funding history, and valuation anchors
        blocks:
          - type: paragraph
            body: >-
              Interswitch’s ownership story is dominated by a long private-equity hold, strategic card-network
              validation, and incomplete public cap-table visibility. The Helios investment page says an investor group
              led by Helios agreed the acquisition of a majority equity interest in December 2010 and remained the
              majority shareholder after TA Associates bought a minority interest in March 2017. BusinessAMLive’s 2019
              reporting adds that other shareholders included IFC and other financial investors at the time the company
              resumed IPO planning. The most durable valuation anchor is still Visa’s November 2019 purchase of a 20%
              stake for $200 million, which multiple outlets treated as implying roughly a $1 billion equity valuation
              and Nigeria’s first fintech-unicorn status. After that event, public valuation transparency deteriorates
              sharply: there is no confirmed later priced equity round in the reviewed sources, while 2019 IPO planning
              coverage floated a $1.3 billion to $1.5 billion public-market ambition without a completed listing. In
              parallel, Today Africa notes a ₦23 billion bond listing in 2020, showing that the company used debt
              capital rather than public equity to extend funding flexibility. The net result is a credible but stale
              equity value marker paired with thin disclosure on today’s ownership economics.
