      - number: '3.3'
        title: 'Regional and adjacent alternatives: MTN MoMo, M-Pesa, Fawry, Network International, and NIBSS'
        blocks:
          - type: paragraph
            body: >-
              Regional and adjacent players reveal the strategic directions buyers may prefer even when they are not all
              direct Nigerian substitutes. MTN describes MoMo as a fintech platform for consumers and businesses
              offering payments, e-commerce, insurance, lending, and remittances; that shows how telco-led distribution
              can evolve from mobile money into broader financial ecosystems. Safaricom's M-Pesa still represents the
              archetypal mobile-money and wallet-centred operating model, even if the fetched public pages here are more
              navigational than analytical. Fawry demonstrates a different archetype: a listed Egyptian digital-payments
              platform spanning consumer payments, bill pay, merchant tools, and financial services. Network
              International represents the scaled regional processor and acquirer model, with official claims of
              operation in 50+ markets, 250+ financial institutions, 240,000+ businesses, and 25+ million cardholders.
              NIBSS, meanwhile, is not a normal rival but a boundary-setting utility. Its role in national switching,
              registries, and CBN-linked infrastructure means parts of the payments stack remain closer to shared rails
              than to purely proprietary software. For Interswitch, these examples show that the threat is not one
              entrant but multiple business-model archetypes that can compress margins or buyer loyalty from different
              directions.
