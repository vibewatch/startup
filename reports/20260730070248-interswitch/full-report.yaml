      - number: '2.3'
        title: Buyer, user, payer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is unusually multi-sided. Banks and fintechs buy or integrate with Interswitch for
              switching, card issuance, transfer rails, collections, and banking-as-a-service modules; merchants and
              SMEs buy gateway, collections, Quickteller Business, and agency-enabled services; governments and public
              institutions buy trusted collection and revenue-routing infrastructure; and individuals use Quickteller,
              Verve, and related transaction services. In some cases the buyer, user, and payer are the same party, but
              in many cases they diverge. For example, a bank may buy a card-processing capability, merchants and
              cardholders become the users, and end-customers indirectly fund usage through transaction fees. Government
              collections are another multi-sided path: the MDA or government platform sets the workflow, citizens and
              businesses make payments, and Interswitch acts as the secure routing layer. Adoption is therefore not a
              single self-serve funnel. It usually starts with regulatory comfort, enterprise or institutional
              integration, merchant rollout, and then end-user frequency. That structure favors incumbents with broad
              compliance and uptime credentials, but it also means enterprise sales cycles and certification burdens can
              slow expansion.
