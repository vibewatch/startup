      - number: '3.2'
        title: 'Nigerian peers: Flutterwave, Paystack, Moniepoint, and OPay'
        blocks:
          - type: paragraph
            body: >-
              The strongest direct Nigerian competitors attack different parts of Interswitch's stack. Flutterwave
              positions around online commerce, cross-border acceptance, remittances, and programmable payment APIs; it
              has also moved closer to regulated banking infrastructure through its Nigerian microfinance-banking
              licence, according to Today Africa's 2026 market report. Paystack, backed by Stripe, retains major
              developer credibility and large merchant reach, with official pages emphasizing more than 200,000
              businesses and deeply documented APIs. Moniepoint is different again: its public positioning is an
              all-in-one payments, banking, and operations platform for businesses, putting it closer to Interswitch on
              merchant and business-infrastructure breadth than a pure gateway operator. OPay is the clearest consumer
              and wallet-scale challenger, combining app-led daily usage, agent distribution, cards, and merchant
              acceptance. The result is that no single rival fully replicates Interswitch, but together they pressure
              its gateway relevance, merchant economics, consumer attention, and bank-partner importance. That
              collective pressure raises the risk that Interswitch remains essential in the rails layer while losing
              visibility and margin at the product edge.
