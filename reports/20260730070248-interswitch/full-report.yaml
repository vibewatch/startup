companyProfile:
  summary: >-
    Interswitch is a Lagos-based payments infrastructure company founded in 2002 by Mitchell Elegbe. It built one of
    Nigeria's core electronic payments stacks, spanning switching and settlement connectivity, the Verve domestic card
    scheme, Quickteller consumer bill-pay and transfer flows, merchant acceptance products, and integration layers used
    by banks, public-sector entities, merchants, and fintechs. Public reporting supports meaningful scale: 2024 revenue
    of ₦137.5B, a rebound to roughly ₦23B pre-tax profit in FY2025, and continued strategic relevance inside Nigeria's
    digital-payments ecosystem. The business also carries concentrated exposure to one geography, limited public
    disclosure, and an aging 2019 unicorn valuation anchor still awaiting a clean public-market test.
  foundedDate: '2002-01-01'
  founders:
    - name: Mitchell Elegbe
      role: Founder & Group Managing Director/CEO
      background: >-
        Nigerian entrepreneur and payments operator who founded Interswitch after earlier work in banking and technology
        roles, then led the build-out of its switching, card, and merchant-payments franchise.
      claimRefs:
