      - number: '7.3'
        title: Financial and model risk are driven by concentration, macro volatility, and pricing pressure
        blocks:
          - type: paragraph
            body: >-
              The financial and model risks are more visible now than the absolute solvency risks. Public reporting
              shows that more than 90% of revenue comes from Nigeria, which concentrates customer, currency, and
              regulatory exposure in one market. The same public record also shows improving profitability, but that
              does not neutralize macro risk. Today Africa highlights inflation and weak purchasing power as persistent
              constraints, while broader Nigerian fintech analysis repeatedly ties compliance, fraud control, and
              operating complexity to margin pressure. Competition adds another layer. As gateways, merchant banks,
              wallets, and telco-led models fight for the front-end customer relationship, an infrastructure incumbent
              can remain essential yet capture less of the economics. That matters for Interswitch because many of its
              risks transmit not through immediate volume loss, but through take-rate compression, slower
              implementation, or the need for more defensive investment in security, partnerships, and product
              packaging. The lack of public gross-margin and liquidity detail further limits how much downside can be
              quantified. The model risk is therefore not simply 'will the business grow?' but 'how resilient are
              earnings quality and cash generation under competitive and macro stress in a Nigeria-heavy base?'
            claimRefs:
