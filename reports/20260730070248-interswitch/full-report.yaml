chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founding logic, and historical role
        blocks:
          - type: paragraph
            body: >-
              Interswitch is best understood as a Nigerian payments-infrastructure company that grew into a broader
              digital commerce platform rather than as a consumer fintech built around a single app. The company’s
              official website describes it as an integrated payments and digital commerce company powering secure,
              reliable transactions across multiple African markets, while its company and brands pages show a product
              estate spanning consumer payments, merchant collections, government revenue processing, developer APIs,
              enterprise disbursements, health-tech, transport, and sector-specific workflow tools. The historical
              through-line is switching: Today Africa’s long-form profile says the company was built to connect
              previously fragmented bank and ATM systems in Nigeria, and the Helios investment page separately
              characterizes Interswitch as the country’s leading payment processor. Most public sources, including the
              founder profile and Today Africa, place the founding in 2002 under Mitchell Elegbe’s leadership, while an
              IFC project disclosure says the company was formed in 2001, creating a modest but real chronology
              conflict. Regardless of the exact legal formation date, the stronger qualitative conclusion is unchanged:
              Interswitch is one of the oldest scaled payments platforms in Nigeria and a foundational part of the
              market structure that later fintechs built on top of.
