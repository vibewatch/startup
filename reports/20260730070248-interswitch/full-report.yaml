  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk dominate the thesis-break set
        blocks:
          - type: paragraph
            body: >-
              Regulatory and legal risk sit at the top of the stack because Interswitch operates in the most regulated
              layers of payments. The public record shows that card schemes, payment service providers, open-banking
              participants, and shared-infrastructure actors are all subject to evolving CBN and ecosystem rules. The
              CBN payment-service-provider list places Verve International inside the card/payment-schemes category,
              reinforcing that the group operates within a closely supervised licensing perimeter. Mondaq's summary of
              the 2026 CBN fintech report and Open Banking Nigeria materials both show a regime moving toward stronger
              open-banking standards, consent, data-sharing rules, digital identity, and supervisory infrastructure.
              Today Africa adds that compliance costs and approval timelines materially constrain innovation, and that
              licence clean-up in the MFB ecosystem accelerated in 2026. For Interswitch, this means the operating
              advantage of being deeply embedded is inseparable from the burden of staying aligned. Data handling,
              card-scheme conduct, merchant-routing rules, and any public-sector payment role are not side issues; they
              are core legal and commercial risks. The main unresolved question is not whether regulation matters—it
              clearly does—but how much hidden operational cost and execution drag it imposes on the company relative to
              faster, narrower peers.
            claimRefs:
