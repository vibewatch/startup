- id: sizing-lenses
  title: Sizing the market through transaction and adoption lenses
  body: The most defensible market-sizing approach uses multiple operating lenses rather than a single analyst forecast. CBN statistics show Nigeria processed 22.42 billion e-payment transactions worth about ₦1.56 quadrillion in the first half of 2024 alone, with internet transfers, mobile-app transfers, POS, and mobile-money channels all operating at massive scale. Today Africa's H1 2026 fintech report adds that instant-payment transactions rose from about 5 billion in 2022 to nearly 11 billion in 2024, while Q1 2026 POS transactions reached ₦18.78 trillion. Those figures do not equal Interswitch's TAM, but they do show the size of the transactional substrate on which processors, switches, and merchant platforms operate. Statista's Nigeria payments outlook provides a broader framing, emphasizing transaction-value, revenue, and user data rather than one narrow product segment, while its methodology highlights internet penetration, smartphone penetration, consumer spending, and online-banking
    penetration as core market drivers. The practical conclusion is that Interswitch's opportunity is enormous in transaction throughput terms, but any revenue TAM estimate depends heavily on which layers of switching, acquiring, issuance, agent distribution, and commerce enablement are included.
  claimRefs:
