chapter:
  number: 2
  title: Market Analysis
  summary: Nigeria's digital-payments market is already operating at national-infrastructure scale, and Interswitch sits in the dense core of that system rather than at the consumer edge. The strongest evidence does not support a single neat TAM number; instead it supports multiple sizing lenses built from transaction rails, adoption, inclusion, and merchant digitisation. The market remains structurally attractive because digital-payment usage is large and growing, but regulation, identity gaps, compliance cost, and rising competition mean Interswitch's addressable opportunity depends as much on licences and trust as on raw payment volume.
sections:
- id: market-boundary
  title: Market boundary, included spend, and substitutes
  body: 'Interswitch''s addressable market is broader than a simple payments gateway market but narrower than Nigeria''s full financial-services economy. The market clearly includes payment switching, merchant acquiring, card issuance and acceptance, digital bill payment, enterprise collections and disbursements, agency banking enablement, and government-revenue payment infrastructure. Official product pages show Interswitch serving banks, fintechs, enterprises, developers, SMEs, governments, and individuals through products such as Paydirect, AutoPay, Quickteller, IPG, fintech card issuance, and API-led banking services. That breadth means the relevant market boundary is best defined as payments and commerce infrastructure rather than consumer fintech alone. At the same time, the market should exclude standalone credit, insurance, and deposit businesses where Interswitch does not directly own the full balance-sheet relationship. Status-quo substitutes also matter: banks can build internally,
    merchants can stay cash-heavy, and fintechs can assemble multi-vendor stacks instead of using a single incumbent provider. Those substitutes reduce any temptation to overstate market inevitability, even though Interswitch benefits from deep local switching and compliance embeddedness.'
