- id: drivers-constraints
  title: Growth drivers, constraints, and unresolved market contradictions
  body: 'The strongest structural drivers are continued cashless migration, regulatory push for monitored digital transactions, merchant digitisation, cross-border trade, digital identity expansion, and the movement of fintechs toward regulated infrastructure. Today Africa explicitly argues that Nigeria''s fintech ecosystem is moving from a payments-led growth phase into a regulated infrastructure phase, and Mondaq''s summary of the 2026 CBN fintech report says the regulator is prioritising innovation-friendly regulation, inclusion through digital infrastructure, system integrity, open banking, and stronger data-sharing rails. Those forces are net-positive for an incumbent like Interswitch because they reward reliability, licences, integration, and trust. But the constraints are equally real: the same CBN report surfaces infrastructure gaps, high compliance costs, long time-to-market, identity bottlenecks, and trust issues. Nigeria''s macro backdrop also remains double-edged. Better payment
    adoption does not eliminate FX volatility, weak purchasing power, fraud pressure, or competitive intensity from newer merchant-centric providers. This means the market is large and still growing, but it is not frictionless, and addressable opportunity should be discounted for execution and regulatory drag rather than treated as straight-line adoption.'
