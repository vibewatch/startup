  evidenceGaps:
  - type: missing-source
    severity: material
    topic: market tam
    missingEvidence: A clean third-party revenue TAM or infrastructure take-rate dataset for Nigerian payments infrastructure incumbents specifically.
    whyItMatters: Without a consistent infrastructure-only market estimate, sizing has to rely on transaction and adoption proxies rather than a direct revenue pool.
    diligencePath: Obtain industry research separating switching, acquiring, issuance, agent enablement, and gateway revenue pools for Nigeria.
    relatedQuestionRefs:
    - QM021
    - QM022
    - QM025
  - type: private-evidence-only
    severity: material
    topic: market share
    missingEvidence: Interswitch's current switching, acquiring, and gateway share by channel versus major competitors.
    whyItMatters: Market attractiveness is easier to assess than capture efficiency; chapter-level conclusions remain incomplete without share and win-rate data.
    diligencePath: Request management market-share decks, acquiring volumes, issuer counts, and channel-level success-rate data.
    relatedQuestionRefs:
    - QM023
  - type: stale
    severity: minor
    topic: financial inclusion
    missingEvidence: A 2024-2026 refresh of excluded-adult counts using the latest EFInA or regulator-supported survey.
    whyItMatters: Inclusion headroom is an important market lens, but the best public figure here remains 2023.
    diligencePath: Refresh with latest EFInA release or official inclusion dashboard when published.
    relatedQuestionRefs:
    - QM010
