figures:
- id: FM001
  title: Market sizing pyramid — Nigeria payments infrastructure opportunity
  type: pyramid
  layout: standard
  summary: Three-layer pyramid framing the broad payments substrate, Interswitch-relevant infrastructure layers, and the company-specific capture zone.
  data:
    items:
    - label: TAM-like payments substrate
      value: ₦1.56 quadrillion H1 2024 e-payment value; nearly 11B instant-payment transactions in 2024
      unit: national rails
      note: Broadest lens includes all major e-payment channels, much larger than revenue opportunity.
    - label: SAM-like infrastructure layers
      value: Switching, acquiring, card issuance, collections, agency enablement, revenue-routing
      unit: Interswitch-relevant layers
      note: Narrower lens focuses on the workflows Interswitch directly addresses.
    - label: SOM-like capture zone
      value: Nigeria-heavy processor with 90%+ revenue from one geography
      unit: current monetised footprint
      note: Current capture remains large but concentrated and not equal to total market potential.
  approximationNotes: This figure uses descriptive values because public evidence supports the size of national rails more strongly than a single clean revenue TAM for infrastructure incumbents.
