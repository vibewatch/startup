- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Cashless migration and digital-payment habit
    - Positive
    - Current / multi-year
    - Expands transaction substrate available to switches and acquirers
    - What share of growth converts into monetisable processing volume for Interswitch?
  - - Regulatory shift toward infrastructure and licensing
    - Positive with friction
    - Current
    - Favors trusted incumbents with compliance muscle
    - Which licences and approvals most directly expand or constrain Interswitch?
  - - Open banking and digital identity build-out
    - Positive if execution lands
    - Near-term
    - Could deepen data-rich payment workflows and lower onboarding friction
    - How fast will Nigeria operationalize open-banking rails and consent infrastructure?
  - - Merchant digitisation and cross-border trade
    - Positive
    - Current / medium-term
    - Raises need for interoperable collections, cards, and settlement
    - Can Interswitch capture cross-border flows outside Nigeria without margin erosion?
  - - Compliance cost and approval delays
    - Negative
    - Current
    - Raises time-to-market and fixed operating burden
    - How much does compliance cost differ between incumbents and newer fintechs?
  - - Fraud, trust, and identity gaps
    - Negative
    - Current
    - Increases operational risk and may slow adoption in weaker segments
    - What fraud-loss and uptime performance does Interswitch sustain versus peers?
  - - FX volatility and weak purchasing power
    - Negative
    - Current
    - Can depress SME activity and distort USD benchmarking
    - How sensitive is Interswitch's Nigerian revenue base to macro stress?
  notes: Direction labels describe net effect on market expansion, not guaranteed impact on Interswitch share.
