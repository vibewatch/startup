  topStrengths:
    - Core infrastructure role in Nigeria's payments stack across switching, settlement, cards, and merchant acceptance.
    - >-
      Publicly reported 2024 revenue growth and FY2025 profit rebound indicate a real business rather than a purely
      narrative unicorn.
    - Verve, Quickteller, and long-standing bank integrations provide embedded distribution and ecosystem relevance.
  topRisks:
    - >-
      Revenue concentration in Nigeria leaves the business exposed to naira volatility, local regulation, and domestic
      macro shocks.
    - The ~$1B valuation anchor is old, with no clearly disclosed post-2019 pricing event to validate upside.
    - IPO preparation has been discussed for years without completion, creating exit-timing uncertainty.
    - >-
      Competition from well-funded gateways, merchant-bank platforms, and wallets can compress take rates and strategic
      leverage.
  unresolvedGaps:
    - Current cap table, liquidation preferences, and any internal or secondary marks after 2019.
