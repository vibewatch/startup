company:
  name: Interswitch
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Interswitch is a Lagos-based payments infrastructure incumbent founded in 2002 by Mitchell Elegbe,
    though an older IFC disclosure cites 2001 formation and creates a date ambiguity that later diligence
    should resolve. Public 2025 reporting shows a sharp operating rebound to ₦137.5 billion revenue and
    ₦23 billion pre-tax profit, while Visa's 2019 $200 million purchase of a 20% stake remains the last
    widely corroborated valuation anchor at roughly $1 billion. The business retains deep strategic assets
    in Verve, Quickteller, switching, government collections, and bank infrastructure, but leadership,
    ownership, and exit readiness remain partly opaque for a company with continuing IPO speculation.
sections:
  - id: identity-history
    title: Identity, founding logic, and historical role
    body: >-
      Interswitch is best understood as a Nigerian payments-infrastructure company that grew into a broader
      digital commerce platform rather than as a consumer fintech built around a single app. The company’s
      official website describes it as an integrated payments and digital commerce company powering secure,
      reliable transactions across multiple African markets, while its company and brands pages show a
      product estate spanning consumer payments, merchant collections, government revenue processing,
      developer APIs, enterprise disbursements, health-tech, transport, and sector-specific workflow tools.
      The historical through-line is switching: Today Africa’s long-form profile says the company was built
      to connect previously fragmented bank and ATM systems in Nigeria, and the Helios investment page
      separately characterizes Interswitch as the country’s leading payment processor. Most public sources,
      including the founder profile and Today Africa, place the founding in 2002 under Mitchell Elegbe’s
      leadership, while an IFC project disclosure says the company was formed in 2001, creating a modest
      but real chronology conflict. Regardless of the exact legal formation date, the stronger qualitative
      conclusion is unchanged: Interswitch is one of the oldest scaled payments platforms in Nigeria and a
      foundational part of the market structure that later fintechs built on top of.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO008]
    figureRefs: [FO001, FO002]
  - id: founders-leadership
    title: Founder-market fit, leadership bench, and governance visibility
    body: >-
      Founder-market fit is unusually strong. Mitchell Elegbe’s official leadership biography says he worked
      at TELNET as group head for business development after time at Schlumberger, while Today Africa adds
      that he left TELNET to build switching software for Nigerian banks and ATMs after seeing the costs of a
      cash-heavy, disconnected banking system. That combination of technical background and first-hand
      exposure to Nigeria’s payment bottlenecks is central to why Interswitch could become infrastructure
      rather than a thin app layer. Current public leadership visibility is mixed. The official leadership and
      news materials clearly identify Mitchell as founder and group managing director/CEO, Cherry Eromosele
      as executive vice president for marketing and communications, Vincent Ogbunude as the Verve executive,
      and Akeem Lawal as a senior switching and payment-processing operator. The bench is therefore more
      substantial than a single-founder story, but board composition, independent-director presence,
      succession planning, and formal governance committees are not disclosed in the reviewed public record.
      For a company still associated with IPO optionality, that lack of governance transparency is a material
      diligence gap rather than a cosmetic omission.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    tableRefs: [TO002]
  - id: ownership-capital
    title: Ownership, funding history, and valuation anchors
    body: >-
      Interswitch’s ownership story is dominated by a long private-equity hold, strategic card-network
      validation, and incomplete public cap-table visibility. The Helios investment page says an investor
      group led by Helios agreed the acquisition of a majority equity interest in December 2010 and remained
      the majority shareholder after TA Associates bought a minority interest in March 2017. BusinessAMLive’s
      2019 reporting adds that other shareholders included IFC and other financial investors at the time the
      company resumed IPO planning. The most durable valuation anchor is still Visa’s November 2019 purchase
      of a 20% stake for $200 million, which multiple outlets treated as implying roughly a $1 billion equity
      valuation and Nigeria’s first fintech-unicorn status. After that event, public valuation transparency
      deteriorates sharply: there is no confirmed later priced equity round in the reviewed sources, while
      2019 IPO planning coverage floated a $1.3 billion to $1.5 billion public-market ambition without a
      completed listing. In parallel, Today Africa notes a ₦23 billion bond listing in 2020, showing that the
      company used debt capital rather than public equity to extend funding flexibility. The net result is a
      credible but stale equity value marker paired with thin disclosure on today’s ownership economics.
    claimRefs: [CO017, CO018, CO019, CO020, CO021, CO022, CO023, CO024, CO025]
    tableRefs: [TO003]
  - id: operating-scale
    title: Scale metrics, product breadth, and current operating posture
    body: >-
      The clearest current public evidence of scale comes from the 2025 financial disclosures and official
      product/news pages rather than from a single corporate factsheet. Techpoint, BusinessDay, Technext, and
      Innovation Village all report that revenue for the year ended March 2025 reached ₦137.5 billion, up 50%
      year over year, with Nigeria contributing about 90% of the total. Those sources also agree that the
      business returned to meaningful profitability after a prior-year loss, reporting ₦23 billion pre-tax
      profit and ₦14.7 billion profit after tax. The revenue mix is also unusually informative for a private
      company: transaction revenue made up 75% of the total, Verve alone contributed 32% with 39% growth, and
      non-transaction revenue reached ₦34.3 billion after 81% growth. On the product side, official pages show
      that Interswitch now spans switching, payment gateway, Quickteller consumer and business services,
      Paydirect, AutoPay, agency banking, fintech card issuance, security services, and sector-specific tools.
      Official pages also claim presence in 25+ African countries plus cross-border operations in the UK, USA,
      Canada, and the Gulf. That product breadth strengthens strategic relevance, but it also makes disclosure
      quality uneven because only a subset of the portfolio has current public operating metrics.
    claimRefs: [CO026, CO027, CO028, CO029, CO030, CO031, CO032, CO033, CO034, CO035, CO036, CO037]
    tableRefs: [TO001]
    figureRefs: [FO003]
  - id: milestones-risks-exit
    title: Milestones, regulatory events, and unresolved exit narrative
    body: >-
      The milestone record shows a business that repeatedly reinvents itself around infrastructure depth while
      still carrying unresolved concentration and market-structure risks. Today Africa’s chronology traces the
      first switch rollout, the launch of Verve as a domestic card scheme, the 2006 Quickteller launch, the
      2010 Helios transaction, later East African acquisitions, the 2019 Visa stake sale, and the 2020 bond
      issuance. More recent official materials add evidence of continued strategic motion: a 2024 NIBSS
      partnership to comply with Nigeria’s PTSA routing regime, 2025 and 2026 global fintech recognitions, a
      2025 mobile-money licence for M-Kudi, 2026 Temenos partnership for digital banking services, 2026 public
      sector and energy-retail deployments, and Uganda expansion through the Quickteller agent network.
      However, the adverse side matters too. Nairametrics reported in May 2026 that processors and acquirers
      threatened Verve suspension over routing exclusivity and fee disputes, showing that market power can turn
      into ecosystem friction. IPO history is similarly unfinished: plans for dual London/Lagos listing were
      shelved in the 2015–2017 period, revived in 2019, but still had not culminated in a public transaction by
      the July 2026 run date. That combination of strategic resilience and incomplete exit execution should be
      treated as a central framing fact for every later chapter.
    claimRefs: [CO038, CO039, CO040, CO041, CO042, CO043, CO044, CO045, CO046, CO047, CO048, CO049, CO050]
    tableRefs: [TO004]
