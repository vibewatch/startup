  - id: FI001
    title: FY2025 收入模型桥
    type: flow
    summary: 两个已披露的收入引擎合计形成总收入，再转化为毛利，之后还要承担规模大得多的运营费用。
    data:
      nodes:
        - id: consumer-products
          label: AI 原生产品需求
          detail: 用户对 Hailuo AI 等产品的参与度和付费意愿
        - id: consumer-revenue
          label: AI 原生产品收入
          value: 53.1
          unit: USD M, FY2025
        - id: enterprise-demand
          label: 企业与开发者需求
          detail: Open Platform 及其他企业服务的付费用户
        - id: enterprise-revenue
