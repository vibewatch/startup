              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: 伙伴依赖、云集中度与分发摩擦
        blocks:
          - type: paragraph
            body: >-
              MiniMax
              的商业模式依赖集中度高的上游基础设施供应商和脆弱的第三方分发渠道。集团不运营自有超大规模数据中心，而是通过第三方云服务商采购算力基础设施；历史披露显示，在开发高峰期，最大单一供应商占年度采购的比例最高达
              29.7%。主要云主机受到任何监管制裁、价格上涨或容量削减，都会直接危及 MiniMax 的服务可用性。与此同时，MiniMax 的消费业务极度依赖渠道：约 70%
              的用户基础和消费收入来自中国大陆以外，并高度集中于 Apple App Store 和 Google Play 等移动应用市场。过去的运营周期中，消费旗舰 Talkie 因内容安全审查和用户互动审查，在
              Apple 平台遭遇临时下架和分发摩擦。考虑到国际社会对情感 AI 陪伴、年龄验证和数据驻留的监管正在收紧，MiniMax 仍容易受到应用商店单方面政策变化、平台下架或强制区域性公司重组的影响。
            claimRefs:
              - CR006
              - CR009
              - CR010
              - CR011
