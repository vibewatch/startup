figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间梳理 MiniMax 从成立、基础模型迭代、私募融资、版权诉讼到公开上市的进程。
    data:
      items:
        - date: 2021-12
          label: 公司成立
          detail: MiniMax 由 Yan Junjie 与前 SenseTime 研究人员在上海创立。
        - date: 2022-04
          label: 首个文本模型发布
          detail: MiniMax 开始研发运营并发布 abab1，随后迭代推出 abab2 和 abab3。
        - date: 2022-10
          label: Glow AI 伴侣发布
          detail: MiniMax 发布 Glow，用户迅速超过 500 万，随后于 2023 年从国内应用商店下架。
        - date: 2023-06
          label: Talkie 全球化与腾讯轮融资
          detail: Talkie 推向国际市场，并从 Tencent 及机构投资者处融资超过 $250M。
        - date: 2024-03
          label: Alibaba $600M 轮融资与 Hailuo 发布
          detail: Alibaba 领投 $600M 融资，估值 $2.5B；发布 Hailuo AI 文本与多模态平台。
        - date: 2025-09
          label: 好莱坞制片厂版权诉讼
          detail: Disney、Universal 和 Warner Bros 向美国联邦法院提起版权侵权诉讼，目标指向 Hailuo AI。
        - date: 2026-01
          label: 香港交易所 IPO
          detail: MiniMax 以代码 0100 在港交所上市，募资 $620M，股价首日翻倍。
        - date: 2026-08
          label: M3 多模态与 MiniMax Design
          detail: 发布百万上下文基础模型 MiniMax-M3，以及桌面端多智能体创意工作室 MiniMax Design。
    approximationNotes: null
    claimRefs:
      - CO012
      - CO013
      - CO014
  - id: FM001
    title: 受约束的基础模型市场规模层级
    type: pyramid
    summary: 对全球基础模型市场潜力进行分层，将不受约束的行业预测与可触达细分市场及已实现商业收入进行比较。
    data:
      items:
        - label: 总可触达市场（全球基础模型，2029E）
          value: $206.5B
          detail: 全球基于模型的基础模型市场覆盖消费和企业领域，包括应用软件（$151.5B）与 MaaS（$55.0B）（CIC 预测）。
          tone: medium
        - label: 应用软件层（2029E）
          value: $151.5B
          detail: 面向终端用户的生成式 AI 应用订阅覆盖文本、视频、音频和伴侣界面，CAGR 达 84.3%。
          tone: positive
        - label: 模型即服务（MaaS）层（2029E）
          value: $55.0B
          detail: 全球开发者和企业平台用于基础模型推理的云 API token 消耗与许可，CAGR 达 72.7%。
          tone: positive
        - label: 可服务可触达市场（近期全球 TAM，2024）
          value: $10.7B
          detail: 2024 年商业化基于模型的基础模型收入基线（应用软件 $7.1B，MaaS $3.6B），界定当前商业需求。
          tone: neutral
        - label: 可服务可获取市场（亚太与跨境机会，2026E）
          value: Target ~$1.5B–$2.5B
          detail: 中国本土资本支持的基础模型领先厂商可触达的亚太、中国大陆及跨境新兴市场支出。
          tone: opportunity
        - label: MiniMax 当前已实现商业捕获（FY2025）
          value: $79.0M
          detail: 已披露 FY2025 经审计收入（同比增长 +158.9%），国际业务贡献超过 70%，覆盖 236M 用户和 214k 个企业账户。
          tone: positive
    approximationNotes: 层级规模综合 MiniMax 监管文件披露的 China Insights Consultancy（CIC）市场预测与 FY2025 公司实际披露；SOM 代表可触达的区域捕获，不代表合同积压。
    claimRefs:
      - CM003
      - CM004
      - CM005
      - CM009
  - id: FP001
    title: 受证据约束的竞争定位
    type: quadrant
    summary: 按序数绘制产品覆盖广度和直接分发控制力，用于展示公开证据的强弱，而不是宣称基准测试优越性。
    data:
      points:
        - label: MiniMax
          x: 5
          'y': 4
          detail: 模型到应用覆盖面广，拥有多条自有分发渠道；活跃留存数据未公开。
        - label: 美国前沿模型集团
          x: 4
          'y': 3
          detail: 已有广泛前沿模型和多模态竞争记录，但缺少可比的分发证据。
        - label: 中国前沿初创公司
          x: 3
          'y': 2
          detail: 已有直接模型同行的记录；同行的产品广度和分发尚未标准化。
        - label: 中国平台型既有厂商
          x: 4
          'y': 4
          detail: 已有平台和资本杠杆的方向性记录；产品层面的证据不完整。
        - label: 专业媒体与伴侣应用
          x: 2
          'y': 3
          detail: 专注于 Hailuo 或 Talkie 的替代品，引用范围更窄，并拥有直接的应用分发渠道。
        - label: 内部构建 / 自托管
          x: 2
          'y': 5
          detail: 买方控制力最高，但产品广度取决于集成能力和稀缺的工程资源。
    approximationNotes: 分析师按序数评分为 1（低）至 5（高），仅依据留存来源中的产品广度和分发描述；不代表市场份额、基准、价格或性能测量。
    claimRefs:
