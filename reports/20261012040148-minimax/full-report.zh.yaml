      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 美国版权诉讼构成存亡级法律风险
            body: >-
              Disney、Universal 和 Warner Bros. Discovery 在加州中区提起的诉讼针对 Hailuo AI，主张最高 $75 million 的法定赔偿（约 500 部作品、每部
              $150,000）并要求禁令救济。若禁令获准，MiniMax 将面临必须使用获许可数据集重新训练，以及在其最大国际收入市场暂停视频生成功能的风险。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: 算法效率是地缘政治护甲
            body: >-
              由于美国出口管制限制获取 H100、H200 等尖端 NVIDIA 集群，MiniMax 依赖专有的 Lightning Attention 和 Sparse Attention 架构。公司在 1M-token
              上下文中最多将注意力计算削减 28.4x，并开放分散模型权重，从而降低硬件依赖，同时保持前沿多模态能力。
            calloutType: insight
            claimRefs:
