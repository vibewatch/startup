      - CI001
      - CI005
      - CI009
  - id: FE001
    title: 受证据边界约束的产品架构图
    type: stack
    summary: 该分层将已有记录的产品和模型层与指定公开证据尚未验证的保障边界区分开来。
    data:
      layers:
        - label: 用户应用
          detail: MiniMax Code、MiniMax Design、MiniMax Audio、Talkie、Xingye 和 Hailuo AI 提供编程、创意、音频、伴侣和视频工作流。
          modules:
            - 企业与开发者工具
            - 消费者应用
        - label: 创意编排
          detail: MiniMax Design 解读需求、拆解工作，并协调文案、图像、视频和音频智能体。
          modules:
            - 任务拆解
            - 并行专业智能体
            - 合并与导出
        - label: 开放平台
          detail: 公司通过面向企业和开发者的平台分发专有文本与多模态模型能力。
          modules:
            - 开发者访问
            - 企业访问
        - label: 当前模型组合
          detail: 2026 年发布记录包括用于智能体语言任务的 M3 和用于多模态视频生成的 H3。
          modules:
            - M3 语言与智能体任务
            - H3 多模态视频
        - label: 已发布模型原语
          detail: MiniMax-01 记录了混合线性与 softmax 注意力、混合专家路由以及视觉 Transformer 扩展。
          modules:
            - 文本模型核心
            - 视觉语言编码器
        - label: 部署与保障边界
          detail: Transformers 和 vLLM 路径已公开；留存证据尚未证明生产可靠性、安全认证、数据治理和服务等级。
          modules:
            - 开放部署指南
            - 未解决的企业保障
    approximationNotes: 概念排序仅反映留存来源所描述的接口和组件，不重构 MiniMax 的私有生产拓扑。
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE005
      - CE006
      - CE008
      - CE009
      - CE015
  - id: FU001
    title: 客户旅程与扩张触点
    type: journey-map
    summary: MiniMax 可以将用户从产品发现引导至付费使用和平台集成，但公开证据没有量化各阶段之间的转化或留存。
    data:
      items:
        - label: 消费者发现
          stage: Reach
          detail: Talkie、Xingye、Hailuo AI、MiniMax Audio 和 MiniMax Design 构成多个获客触点。
          touchpoints:
            - 移动应用
            - Web 产品
        - label: 活跃使用
          stage: Engagement
          detail: 发售文件披露了消费者产品的平均 MAU，并说明账户和设备定义。
          touchpoints:
            - 伴侣对话
            - 创意生成
        - label: 消费者付费
          stage: Monetization
          detail: 订阅、预付额度、虚拟物品和广告将部分消费者转化为付费用户。
          touchpoints:
            - 订阅
            - 应用内交易
        - label: 开发者试用
          stage: Evaluation
          detail: 开发者和企业通过 Open Platform 访问文本、视频和音频模型。
          touchpoints:
            - API 调用
            - 模型集成
        - label: 平台付费使用
          stage: Production
          detail: 只有在某期间 API 消耗至少达到 US$50 后，文件才将用户计为 Open Platform 付费用户。
          touchpoints:
            - 按使用量计费
            - 专用推理
        - label: 扩张或中断
          stage: Durability
          detail: 定制化服务可以扩大客户账户，但应用商店准入和版权纠纷可能阻碍获客或采购。
          touchpoints:
            - 授权交付物
            - 渠道与法律审查
    approximationNotes: 这是基于证据梳理出的客户触点序列，不是经过测量的漏斗；公开资料未披露转化率或客户群组关联。
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU009
      - CU014
      - CU015
      - CU016
