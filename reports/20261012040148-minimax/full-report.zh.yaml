              - CP010
              - CP014
      - number: '3.3'
        title: 分发广度可能比名义功能对等更重要
        blocks:
          - type: paragraph
            body: >-
              MiniMax 掌握多条触达用户的路径：消费应用、创作者产品、开放权重、托管 API 和企业/开发者平台。公司据称其模型和产品累计服务超过 300 million 个人以及超过 200
              万家企业和开发者，但这两个数字都是公司发布的累计触达数据，不是活跃客户、收入或留存指标。这一产品面可以带来交叉销售和产品反馈优势，而开放权重则让技术买方可以自行托管并获得更强的数据控制。代价在于运营复杂度：一份经过审阅的指南警告，服务一个
              456-billion-parameter 混合专家模型并利用超长上下文，需要稀缺的专业工程能力。公开证据没有量化迁移成本、多重归属、流失、渠道经济性或实际折扣，因此锁定效应仍未经证明。
            claimRefs:
              - CP003
              - CP007
              - CP009
              - CP010
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP010
              - CP011
      - number: '3.4'
        title: 护城河持续性与替代风险
        blocks:
          - type: paragraph
            body: >-
              只有当 MiniMax 比资本更充裕的老牌公司更快地把技术和产品触达转化为重复使用、可信部署和高效分发时，其广度才具有防御性。保留的独立评论认为，美国前沿模型在最难的纯推理上占优，而 MiniMax
              在长上下文、成本和生成媒体上领先；这只是方向性分析，不是受控基准。竞争压力因此来自两端：专业工具可能在单个工作流上胜出，云和平台巨头则可以补贴一体化替代方案。法律、地缘政治和先进 GPU 获取风险也可能削弱
              MiniMax 维持模型迭代节奏或让企业买方放心的能力。投资案例应将当前广度视为分发期权，而非已被证明的切换成本。
            claimRefs:
              - CP006
              - CP011
              - CP012
              - CP013
              - CP014
