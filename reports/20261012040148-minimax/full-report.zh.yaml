  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 决策流程展示了从运营验证点和估值阻力走向“跟踪”建议的过程。
    approximationNotes: 这是对分析决策阈值和风险门槛因素的示意。
    data:
      nodes:
        - id: scale-traction
          label: 全球消费者规模与 $150M+ ARR 运行速率
          description: 236M 全球用户和 73% 的海外收入证明了商业可行性
        - id: cost-efficiency
          label: 成本优化型 MoE 架构
          description: 专有多模态模型带来具有竞争力的推理经济性
        - id: margin-headwinds
          label: 25.4% 毛利率与价格竞争
          description: 较低的毛利率使商业模式暴露于开源模型的价格压缩风险
        - id: litigation-regulatory
          label: 诉讼与跨境合规压力
          description: 好莱坞制片公司的版权诉讼和国际监管审查带来负债
        - id: valuation-multiple
          label: IPO 后估值过高（约 70x ARR）
          description: HK$821 的公开交易价格已计入近乎完美的执行表现，安全边际很小
        - id: final-recommendation
          label: 最终建议：跟踪
          description: 待估值倍数回落、法律和利润率风险降低后，再投入资本
      edges:
        - from: scale-traction
          to: cost-efficiency
          label: 由……支撑
        - from: cost-efficiency
          to: margin-headwinds
          label: 受……约束
        - from: margin-headwinds
          to: litigation-regulatory
          label: 因……加剧
        - from: litigation-regulatory
          to: valuation-multiple
          label: 与……权衡
        - from: valuation-multiple
          to: final-recommendation
          label: 最终形成
