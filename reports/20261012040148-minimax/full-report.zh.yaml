      - number: '7.2'
        title: 运营与基础设施瓶颈：硬件制裁与对齐完整性
        blocks:
          - type: paragraph
            body: >-
              MiniMax 的前沿模型路线容易受到不断升级的国际半导体制裁和硬件出口管制冲击。美国商务部工业与安全局（BIS）连续采取监管行动，尤其是对 NVIDIA H20 集成电路及同等互连带宽配置实施许可要求，限制中国
              AI 公司进口 NVIDIA H100 和 H200 集群等尖端加速器。为在严峻硬件约束下维持模型训练和长上下文推理，MiniMax 构建了包括 Lightning Attention 和 MiniMax
              Sparse Attention（MSA）在内的专有算法优化。MSA 在 1-million-token 上下文中最多将每 token 注意力计算减少 28.4 times，并在 NVIDIA H800
              集群上显著提升解码速度，但实体算力稀缺仍持续威胁公司相对于西方前沿实验室的训练速度。除硬件限制外，运营消费级和开发者基础模型也带来复杂的模型对齐挑战。复杂多模态基础架构存在固有失效模式，包括幻觉、开放式聊天互动中的人格漂移失配，以及公共沙盒环境缺少零保留保证所带来的安全漏洞。随着基础模型扩张，在不牺牲表达性生成的前提下确保行为对齐，仍是关键运营优先事项。
            claimRefs:
              - CR005
              - CR007
              - CR008
              - CR014
          - type: table
            tableRef: TR002
