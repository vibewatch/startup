chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与基础使命
        blocks:
          - type: paragraph
            body: >-
              MiniMax 由前 SenseTime 计算机视觉研究员于 2021 年 12 月创立。MiniMax Group
              Inc.（中国境内称上海稀宇科技有限公司）已成长为中国主要的生成式人工智能公司之一。公司总部位于上海徐汇区新颜大厦，围绕“Intelligence with
              Everyone”的指导理念，以借助多模态模型推进通用人工智能为基础使命。MiniMax
              从一开始就没有把架构限制在文本基础模型上，而是在文本、语音、音乐和视频合成领域同步推进原生多模态开发。如今，这套技术支撑起庞大的产品生态，包括面向消费者的虚拟角色扮演平台 Talkie、Hailuo AI
              视频生成、面向企业开发者的 API，以及 MiniMax Design 创意工作室。截至 2026 年末，公司称其专有基础模型和 AI 原生应用累计服务超过 300 million 名个人用户，覆盖 230
              个国家和地区，同时拥有全球超过 200 万个企业及开发者账户。
            claimRefs:
              - CO001
              - CO005
              - CO008
              - CO012
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: figure
