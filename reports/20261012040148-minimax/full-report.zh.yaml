      - number: '7.4'
        title: 财务消耗、缓释成熟度与风险综合
        blocks:
          - type: paragraph
            body: >-
              MiniMax 从风险资本支持的私营创业公司转型为上市公司，从根本上改变了其容忍资本低效的程度。上市前，公司研发支出约为商业收入的
              9:1，反映出在文本、语音和视频模态上进行激进前置模型训练投资。尽管快速国际商业化和推理成本下降扩大了收入，但公开资本市场对运营利润率和现金节约提出严格要求。风险热力图综合了 MiniMax
              的跨职能威胁矩阵，显示算法算力效率和开放权重分发可以中等程度缓解半导体禁运，但工作室版权诉讼造成的法律风险以及移动应用商店分发脆弱性，仍具有较高残余严重度。如果无法在二次股权融资窗口关闭前建立经常性企业盈利，公司将被迫大幅收缩运营，削减模型训练雄心，并巩固对旧模型架构的依赖。
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR010
              - CR013
