            body: >-
              MiniMax 报告了两大商业引擎，而非单一 SaaS 收入流。AI 原生产品 FY2025 产生 US$53.1 million，较 US$21.8 million 增长
              143.4%；开放平台及其他企业服务产生 US$26.0 million，较 US$8.7 million 增长 197.8%。两者合计收入 US$79.0 million，增长 158.9%；其中超过 70%
              来自国际市场。这一组合说明终端应用与企业/开发者接入都具有经济重要性，但并不能证明经常性收入质量：经审阅证据没有披露订阅收入与用量收入的比例、合同期限、集中度、流失、递延收入或各收入流的确认政策。管理层 2026
              年 2 月公布的 ARR 超过 US$150 million，但 ARR 不是 FY2025 会计收入，不应替代后者。
