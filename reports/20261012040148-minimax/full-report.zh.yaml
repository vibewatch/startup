  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律与监管风险：版权诉讼与主权合规
        blocks:
          - type: paragraph
            body: >-
              MiniMax 快速拓展生成媒体业务，已在关键国际司法辖区招致重大法律风险。最突出的是，2025 年 9 月 16 日，Disney、Universal 和 Warner Bros. Discovery
              等美国大型娱乐工作室在美国加州中区联邦地区法院对 MiniMax 提起民事版权侵权诉讼。诉状针对 MiniMax 的旗舰视觉生成平台 Hailuo
              AI，依据美国《版权法》指控直接侵权以及从属侵权（帮助侵权和替代侵权）。原告主张每件被侵权作品最高可获 $150,000 的法定赔偿，涉及约 500 部电影和电视作品，最坏情况下合计约 $75
              million，并要求永久禁令。MiniMax 董事会和美国法律顾问声称，这些诉讼请求在第九巡回法院的自愿行为标准下缺乏法律依据；其理由是 Hailuo AI
              严格属于通用创作平台，只有在用户明确提示后才生成输出。不过，不利裁决或初步禁令可能迫使 MiniMax 撤下视频生成功能、只用获许可语料重新训练基础模型，或谈判昂贵的内容许可协议。在中国，MiniMax
              还必须同时遵守国家互联网信息办公室（CAC）算法备案以及对情感陪伴聊天机器人的收紧监管；其在香港交易所依据第 18C 章上市，则在加权投票权（WVR）治理制度下受到更高的公众审查。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR012
