callouts:
  - calloutType: "risk"
    title: "Runway Cannot Be Derived from the Headline Cash Balance"
    body: "The reported cash balance includes restricted cash, time deposits, and financial assets, while adjusted net loss is an accounting measure rather than cash burn. Without operating cash flow, capex, debt, working capital, and cloud commitments, a precise runway estimate would be false precision."
    claimRefs:
      - "CI009"
      - "CI010"
  - calloutType: "insight"
    title: "Growth Is Outrunning R&D Expense, but Not Yet Producing Profit"
    body: "Revenue grew 158.9% in FY2025 while R&D expense grew 33.8%, evidence of improving scale efficiency. Yet adjusted net loss still increased to US$250.9 million, so the margin path remains dependent on further gross-profit expansion and cost discipline."
    claimRefs:
      - "CI001"
      - "CI008"
      - "CI009"
