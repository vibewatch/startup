      missingEvidence: "Numeric list pricing, realized pricing, discounts, contract units, minimum commitments, and revenue-recognition terms by product."
      whyItMatters: "Without pricing and contract detail, revenue quality, pricing power, and product-level gross margin cannot be underwritten."
      diligencePath: "Obtain the current price book, anonymized customer contracts, billing extracts, discount approvals, and revenue-recognition memorandum."
