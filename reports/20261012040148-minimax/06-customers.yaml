company:
  name: "MiniMax"
chapter:
  number: 6
  title: "Customers"
  summary: "MiniMax has demonstrated broad reach across consumer applications and its developer platform, with a 2025 offering document reporting 27.6 million average monthly active users and 1.77 million paying consumer users in the first nine months of 2025. The same record shows improving customer concentration, but cumulative reach is not retention, named enterprise references remain mostly anonymized, and public NRR, GRR, churn, renewal, and contract-duration evidence is absent."
sections:
  - id: "customer-segments-and-monetization"
    title: "A broad customer surface, but mixed commercial populations"
    body: >-
      MiniMax addresses four overlapping populations: companion-app consumers, creative users,
      developers, and enterprises. Its offering document separates consumer monetization through
      subscriptions, prepaid virtual credits, and advertising from Open Platform monetization
      through usage-based API calls and customized enterprise arrangements. Official pages now
      claim cumulative reach above 300 million individuals and two million enterprises and
      developers, but those totals combine different products, geographies, and levels of
      engagement. They should not be read as active customers or paying accounts. The clearest
      segmentation evidence comes from the product surface itself: Talkie serves entertainment
      users, Hailuo and MiniMax Design target creative workflows, and the Open Platform serves
      developers and enterprise integrators. MiniMax Design further identifies short drama,
      e-commerce, brand-video, and advertising workflows, suggesting multiple buyer contexts
      without disclosing conversion, revenue contribution, or repeat-use rates by segment.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU009"
      - "CU014"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory"
    title: "Active and paying usage expanded through September 2025"
    body: >-
      The offering document provides a more decision-useful adoption view than cumulative reach.
      Average monthly active users across AI-native products rose from 3.1 million in 2023 to
      19.1 million in 2024 and 27.6 million in the nine months ended September 2025. Paying users
      of those products rose from about 119,700 to 650,300 and then 1.77 million over the same
      reporting sequence. Open Platform paying users, defined as accounts consuming at least
      US$50 of API calls in the period, increased from roughly 100 to 700 and then 2,500. These
      figures support real monetization and usage growth, but their periods are not identical
      cohorts and the filing warns that consumer users may have multiple accounts. Later company
      pages claim more than 300 million cumulative individuals and two million enterprises and
      developers; these broader totals use different denominators and do not supersede the
      filing's active and paying-user measures.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU002"
  - id: "proof-durability-and-concentration"
    title: "Customer proof is improving, while durability remains unproven"
    body: >-
      The strongest enterprise evidence is financial rather than testimonial. An anonymized
      Shanghai cultural-industry group accounted for US$1.3 million, or 37.2% of 2023 revenue,
      through Open Platform purchases. A Singapore technology company that also supplied
      advertising and cloud services became the largest 2024 customer at US$9.4 million and
      30.9% of revenue; its share fell to 14.7% in the first nine months of 2025. A newer digital
      human and video-synthesis customer contributed US$1.2 million in that 2025 period, showing
      production use beyond consumer apps but not revealing renewal economics. Separately,
      Variety reported four AI Backlot creator pairs using Hub for short films, which is a useful
      pilot reference rather than proof of a paid deployment. Durability is the central gap:
      public evidence does not disclose cohort retention, NRR, GRR, churn, renewal rates, or
      contract duration, while Talkie's two-month App Store removal and the Hailuo copyright
      lawsuit illustrate channel and procurement friction.
    claimRefs:
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU015"
      - "CU016"
    tableRefs:
      - "TU003"
