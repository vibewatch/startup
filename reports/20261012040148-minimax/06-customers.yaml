callouts:
  - calloutType: "insight"
    title: "Cumulative reach materially overstates the measurable paying base"
    body: "The retained record supports very large cumulative reach, but the comparable 9M 2025 measures are 27.6 million average consumer MAU, 1.77 million paying consumer users, and 2,500 Open Platform users above the filing's US$50 payment threshold. Investment diligence should anchor on these defined populations rather than combine them."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU006"
      - "CU007"
      - "CU008"
  - calloutType: "risk"
    title: "Durability is exposed to both distribution and procurement friction"
    body: "Talkie's temporary App Store removal reduced average daily downloads by about 16,800, while litigation by major Hollywood studios targets Hailuo AI. Neither event proves churn or lost contracts, but both create observable constraints on acquisition and enterprise procurement."
    claimRefs:
      - "CU015"
      - "CU016"
