      Ordinal map of product-surface breadth and direct distribution control,
      used to show where public evidence is strong or weak rather than to claim
      benchmark superiority.
    data:
      points:
        - label: MiniMax
          x: 5
          y: 4
          detail: "Broad model-to-application surface and multiple owned distribution routes; active retention is not public."
        - label: US frontier group
          x: 4
          y: 3
          detail: "Broad frontier and multimodal competition is documented, but comparable distribution evidence is absent."
        - label: Chinese frontier start-ups
          x: 3
          y: 2
          detail: "Direct model peers are documented; peer product breadth and distribution are not normalized."
        - label: Chinese platform incumbents
          x: 4
          y: 4
          detail: "Potential platform and capital leverage is documented directionally; product-level evidence is incomplete."
        - label: Specialist media and companion apps
          x: 2
          y: 3
          detail: "Focused Hailuo or Talkie alternatives have narrower cited scope and direct application distribution."
        - label: Internal build / self-host
          x: 2
          y: 5
          detail: "Buyer control is highest, but product breadth depends on integration and scarce engineering capacity."
    approximationNotes: >-
      Analyst ordinal scores from 1 (low) to 5 (high), based only on product
      breadth and distribution descriptions in the retained sources; they are
      not market-share, benchmark, price, or performance measurements.
    claimRefs: [CP002, CP004, CP005, CP009, CP010, CP014]
callouts:
  - calloutType: risk
    title: Breadth is not lock-in
    body: >-
      MiniMax's broad product surface may aid cross-selling, but no retained
      evidence quantifies cohort retention, migration cost, multi-homing, or
      enterprise procurement wins; durability remains a diligence question.
    claimRefs: [CP009, CP011, CP014]
