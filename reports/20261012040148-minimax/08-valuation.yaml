callouts:
- calloutType: recommendation
  title: Capital Discipline Mandate
  body: Although MiniMax achieved remarkable velocity from inception in late 2021 to a public Hong Kong listing in January
    2026, the current post-IPO trading valuation of approximately $10.9 billion prices in sustained hyper-growth without factoring
    in the margin vulnerability of its 25.4% gross margin and live copyright litigation. Prospective investors should maintain
    a Track stance until secondary multiples compress toward comparable peer levels or audited filings prove gross margin
    expansion above 35%.
  claimRefs:
  - CV001
  - CV004
  - CV006
  - CV013
