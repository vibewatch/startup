      - number: '5.2'
        title: Model Architecture and Release Cadence
        blocks:
          - type: paragraph
            body: >-
              The most technically specific public evidence is the company-issued MiniMax-01 repository. It describes
              MiniMax-Text-01 as a 456-billion-parameter mixture-of-experts model with 45.9 billion parameters activated
              per token, combining Lightning Attention and periodic Softmax Attention. The same source says training
              context reaches one million tokens and inference can extend to four million tokens, while MiniMax-VL-01
              adds a 303-million-parameter vision transformer, a two-layer projector, and dynamic-resolution image
              handling. These are architectural disclosures, not independent production benchmarks. The 2026 release log
              shows continued portfolio turnover: M3 was released for agentic reasoning, tool use, coding, multimodal
              input, and long-context work on June 1, and H3 was listed as a multimodal video model on July 31. The pace
              is strategically useful but raises compatibility, migration, and validation questions that the release log
              does not answer.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE006
