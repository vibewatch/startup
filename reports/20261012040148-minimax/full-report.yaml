figures:
  - id: FO001
    title: Company Milestone Timeline
    type: timeline
    summary: >-
      Chronological progression of MiniMax from founding through foundation model iterations, private financings,
      copyright litigation, and public listing.
    data:
      items:
        - date: 2021-12
          label: Company Founded
          detail: MiniMax founded in Shanghai by Yan Junjie and former SenseTime researchers.
        - date: 2022-04
          label: First Text Model Launch
          detail: MiniMax begins R&D operations and releases abab1, followed by abab2 and abab3 iterations.
        - date: 2022-10
          label: Glow AI Companion Released
          detail: MiniMax launches Glow, rapidly amassing over 5 million users before domestic store removal in 2023.
        - date: 2023-06
          label: Talkie Global & Tencent Round
          detail: Launched Talkie internationally and raised $250M+ from Tencent and institutional backers.
        - date: 2024-03
          label: Alibaba $600M Round & Hailuo Launch
          detail: Alibaba leads $600M financing at $2.5B valuation; launched Hailuo AI text and multimodal platform.
        - date: 2025-09
          label: Hollywood Studio Copyright Lawsuit
          detail: Disney, Universal, and Warner Bros file US federal copyright infringement lawsuit targeting Hailuo AI.
        - date: 2026-01
          label: Hong Kong Stock Exchange IPO
          detail: MiniMax lists on HKEX under code 0100, raising $620M as shares double on opening day debut.
        - date: 2026-08
          label: M3 Multimodal & MiniMax Design
          detail: Released MiniMax-M3 million-context foundation model and MiniMax Design desktop multi-agent creative studio.
    approximationNotes: null
    claimRefs:
      - CO012
      - CO013
      - CO014
