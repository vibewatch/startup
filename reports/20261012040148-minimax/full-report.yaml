      - number: '5.3'
        title: Deployment and Operating Maturity
        blocks:
          - type: paragraph
            body: >-
              Public deployment guidance is more concrete for the older open MiniMax-01 family than for the current
              application stack. The repository provides Transformers examples and recommends vLLM for production
              serving, which gives technical evaluators a reproducible starting point and qualifies the repository as a
              developer signal. It does not, however, disclose measured throughput, latency distributions, uptime,
              incident history, support response targets, or version-support policy. The official corporate pages claim
              more than 300 million cumulative individual users and more than two million enterprises and developers,
              but those issuer-reported totals do not reveal active usage, paid usage, workload mix, or service
              reliability. BenchGecko independently tracks four models and names Hailuo AI, Talkie, and MiniMax API as
              key products, yet labels its underlying figures as source-pending. Product maturity is therefore visible
              at the surface level but not underwritten at the production-quality level.
            claimRefs:
              - CE009
              - CE013
              - CE014
      - number: '5.4'
        title: Trust, Safety, and Technical Risk
        blocks:
          - type: paragraph
            body: >-
              The assigned public materials leave the assurance layer notably thinner than the product and model layers.
              None of the retained official pages supplies a security trust center, certification inventory,
              service-level history, model-evaluation protocol, or detailed data-governance controls, so those items
              remain open rather than presumed absent. External risk signals are substantive: Wikipedia summarizes a
              September 2025 U.S. copyright suit by Disney, Universal, and Warner Bros. Discovery alleging infringement
              by Hailuo AI, and a February 2026 accusation by Anthropic that MiniMax used fraudulent accounts and more
              than 16 million Claude interactions for distillation. These are allegations reported in a secondary
              source, not adjudicated findings in the assigned evidence. They nevertheless create diligence questions
              around training-data provenance, output controls, enterprise indemnities, and model-development governance
              that should be resolved before treating the broad multimodal stack as enterprise-ready.
            claimRefs:
              - CE011
              - CE012
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Architecture is unusually inspectable for a private-model vendor
            body: >-
              The MiniMax-01 repository exposes parameter counts, attention structure, multimodal encoder design,
              deployment examples, and serving guidance; that is materially more testable than a marketing-only product
              claim, even though the evidence remains company-issued.
            calloutType: strength
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
          - type: callout
            title: Assurance evidence lags the product surface
            body: >-
              The retained evidence supports product breadth and model architecture, but not independent reliability
              results, current security certifications, enterprise service levels, or resolution of the copyright and
              distillation allegations.
            calloutType: risk
            claimRefs:
              - CE011
              - CE012
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: A broad customer surface, but mixed commercial populations
        blocks:
          - type: paragraph
            body: >-
              MiniMax addresses four overlapping populations: companion-app consumers, creative users, developers, and
              enterprises. Its offering document separates consumer monetization through subscriptions, prepaid virtual
              credits, and advertising from Open Platform monetization through usage-based API calls and customized
              enterprise arrangements. Official pages now claim cumulative reach above 300 million individuals and two
              million enterprises and developers, but those totals combine different products, geographies, and levels
              of engagement. They should not be read as active customers or paying accounts. The clearest segmentation
              evidence comes from the product surface itself: Talkie serves entertainment users, Hailuo and MiniMax
              Design target creative workflows, and the Open Platform serves developers and enterprise integrators.
              MiniMax Design further identifies short drama, e-commerce, brand-video, and advertising workflows,
              suggesting multiple buyer contexts without disclosing conversion, revenue contribution, or repeat-use
              rates by segment.
            claimRefs:
              - CU001
              - CU002
              - CU009
              - CU014
