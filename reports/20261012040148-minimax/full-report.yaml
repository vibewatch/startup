      - number: '6.3'
        title: Customer proof is improving, while durability remains unproven
        blocks:
          - type: paragraph
            body: >-
              The strongest enterprise evidence is financial rather than testimonial. An anonymized Shanghai
              cultural-industry group accounted for US$1.3 million, or 37.2% of 2023 revenue, through Open Platform
              purchases. A Singapore technology company that also supplied advertising and cloud services became the
              largest 2024 customer at US$9.4 million and 30.9% of revenue; its share fell to 14.7% in the first nine
              months of 2025. A newer digital human and video-synthesis customer contributed US$1.2 million in that 2025
              period, showing production use beyond consumer apps but not revealing renewal economics. Separately,
              Variety reported four AI Backlot creator pairs using Hub for short films, which is a useful pilot
              reference rather than proof of a paid deployment. Durability is the central gap: public evidence does not
              disclose cohort retention, NRR, GRR, churn, renewal rates, or contract duration, while Talkie's two-month
              App Store removal and the Hailuo copyright lawsuit illustrate channel and procurement friction.
            claimRefs:
