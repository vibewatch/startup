      - number: '6.2'
        title: Active and paying usage expanded through September 2025
        blocks:
          - type: paragraph
            body: >-
              The offering document provides a more decision-useful adoption view than cumulative reach. Average monthly
              active users across AI-native products rose from 3.1 million in 2023 to 19.1 million in 2024 and 27.6
              million in the nine months ended September 2025. Paying users of those products rose from about 119,700 to
              650,300 and then 1.77 million over the same reporting sequence. Open Platform paying users, defined as
              accounts consuming at least US$50 of API calls in the period, increased from roughly 100 to 700 and then
              2,500. These figures support real monetization and usage growth, but their periods are not identical
              cohorts and the filing warns that consumer users may have multiple accounts. Later company pages claim
              more than 300 million cumulative individuals and two million enterprises and developers; these broader
              totals use different denominators and do not supersede the filing's active and paying-user measures.
