- calloutType: risk
  title: Existential Legal Exposure in US Copyright Litigation
  body: The Disney, Universal, and Warner Bros. Discovery lawsuit in the Central District of California targets Hailuo AI with statutory damage claims of up to $75 million (covering ~500 works at $150,000 each) and injunctive relief. If an injunction is granted, MiniMax faces mandatory retraining on licensed datasets and potential video generation feature suspensions in its largest international revenue market.
  claimRefs:
  - CR001
  - CR002
- calloutType: insight
  title: Algorithmic Efficiency as Geopolitical Armor
  body: Because U.S. export controls restrict access to cutting-edge NVIDIA clusters (such as H100 and H200 accelerators), MiniMax relies on proprietary Lightning Attention and Sparse Attention architectures. By cutting attention computation by up to 28.4x on 1M-token contexts and decentralizing model weights openly, the company reduces hardware dependency while preserving frontier multimodal capability.
  claimRefs:
  - CR005
  - CR014
