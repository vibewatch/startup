      - "CE007"
      - "CE008"
      - "CE009"
  - calloutType: "risk"
    title: "Assurance evidence lags the product surface"
    body: "The retained evidence supports product breadth and model architecture, but not independent reliability results, current security certifications, enterprise service levels, or resolution of the copyright and distillation allegations."
    claimRefs:
      - "CE011"
      - "CE012"
      - "CE015"
