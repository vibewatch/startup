    title: "Architecture is unusually inspectable for a private-model vendor"
    body: "The MiniMax-01 repository exposes parameter counts, attention structure, multimodal encoder design, deployment examples, and serving guidance; that is materially more testable than a marketing-only product claim, even though the evidence remains company-issued."
    claimRefs:
