      - ["Salesforce Ventures", "New Series C investor", "Validates strategic-investor interest and partner willingness to endorse the company publicly.", "Clarify ownership, information rights, and commercial overlap versus pure financial exposure."]
      - ["Crescent Cove", "Existing investor that also provided equity and debt in the Series C", "Signals bridge support across financing structures, potentially relevant to downside protections.", "Obtain debt terms, security package, and liquidation preferences."]
      - ["645 Ventures", "Named Series C investor and portfolio backer", "Adds another venture sponsor to the disclosed syndicate.", "Confirm ownership level and whether support is strategic, financial, or both."]
      - ["Polaris Government and Defense", "OEM partner for the April 2026 MESA platform", "Important to platformization because MESA is built on a Polaris Ranger XD 1500 base vehicle.", "Clarify exclusivity, manufacturing commitments, and gross-margin split."]
      - ["Hypercraft", "October 2026 integration partner on Razorback vehicle", "Shows Forterra extending AutoDrive into another partner vehicle platform.", "Clarify revenue model, IP/control boundaries, and whether deployments are pilot or programmatic."]
    notes: "The map captures only stakeholders explicitly named in the assigned pool and therefore does not substitute for a full cap table or full partner ledger."
    enumerationScope:
      coverage: partial
      basis: "Rows cover publicly named investors and strategic platform partners surfaced in the assigned evidence pool, not the exhaustive shareholder register or full commercial-partner set."
    claimRefs: [CO007, CO010, CO012, CO013]
