      - ["Alberto Lacaze", "Chairman of the Board and President; founder", "Founder of the original Robotic Research business in 2002; long-time robotics technologist.", "Embeds core technical lineage and founder continuity into current governance.", "High — founder credibility and technical legacy remain part of the company story."]
      - ["Joseph Putney", "Chief Technology Officer", "Long-tenured roboticist who helped build Forterra from the ground up.", "Owns autonomy-platform continuity and engineering depth.", "Medium-high — technical execution appears concentrated in a small visible bench."]
      - ["Scott Sanders", "Chief Growth Officer", "Former Vannevar Labs and Anduril business-development leader; joined Forterra in May 2022.", "Supports defense GTM, customer growth, and program capture.", "Medium — important for defense-program commercialization and ecosystem building."]
