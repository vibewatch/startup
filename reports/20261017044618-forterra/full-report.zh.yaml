      - number: '4.3'
        title: 成本结构、资本强度与营运资金影响
        blocks:
          - type: paragraph
            body: >-
              现有证据暗示这是一种资本密集型交付模式。Forterra 称 2025 年 Series C 将提升边缘计算平台的生产能力；MESA 发布也强调与 Polaris 一起完成 OEM
              生产线改造，而不是轻量级纯软件部署。公司还称在不到六个月内生产并部署了 105 辆
              Lancer。即使部分底盘制造由供应商承担，公司仍会承担硬件采购、集成用工、测试和支持运营的实际风险。项目规模扩大后，这种模式仍可能有吸引力，但来源没有披露营运资金条款、库存风险、软硬件毛利结构，或在主承包商和
              OEM 参与时 Forterra 保留的经济份额。因此，Defense.Direct 关于合同上限的提醒很重要：公开授标金额可能高估可实现现金。
