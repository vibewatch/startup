        - 2026 年规模化将乌克兰和 DoD 的验证转化为已披露的可重复项目收入，同时新资金的条款仍保持干净。
        - 只有在已披露的收入质量支撑高溢价国防自主系统定价时，至少 $1 billion 的估值才可能成立。
        - 项目集中度、采购延迟和隐性优先权。
        - 需要已签署的 2026 年收入 / 积压订单证据及条款清单证明；目前二者均未公开。
      - - 基准
        - Forterra 仍具战略相关性，但经济数据仍属非公开，最近一轮融资估值仍是主要锚点。
        - 约 $1 billion 的估值显得偏满；实际行动是等待或持续跟踪，直到有新数据出现。
        - 数据不透明、缺乏流动性，以及相对国防同业的估值倍数压缩。
        - 与当前公开证据集合最为一致。
      - - 悲观
        - 部署成果未能转化为可重复的经济回报，或私人市场条款被证明比表面估值所暗示的更不利于投资者。
        - 低于 $1 billion，或在出现更低的成交价格 / 更干净的结构前不参与。
        - 采购延迟、债务 / 优先权负担和客户集中度。
        - 若下一轮融资缺乏干净的新股需求，或财务尽调结果令人失望，则触发该情景。
    notes: 公开证据不足以支持精确的 DCF 或收入倍数模型，因此这些情景是围绕最近一次报告估值的价格敏感区间，而不是虚假的精确目标。
