              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV008
              - CV013
              - CV014
      - number: '8.3'
        title: 情景框架与入场纪律
        blocks:
          - type: paragraph
            body: >-
              因此，情景框架必须保持定性并对价格敏感。乐观情景要求公开描述的部署证明和 1,000
              辆生产计划转化为已披露且可重复的收入，更清楚地看到客户集中度和积压订单转化，并且融资条款不会让新投资者处于次要地位。基准情景假设 Forterra
              在战略上重要，但由于投资者仍无法将估值与公开基本面联系起来，按上次披露的估值大致已被充分定价。悲观情景假设商业化落后于战区验证，国防采购时点拉长，或债务和清算优先权吞噬的经济利益多于估值标题所暗示的部分。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV009
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV014
              - CV015
      - number: '8.4'
        title: 最终尽调要求与投资逻辑中断点
        blocks:
          - type: paragraph
            body: >-
              公司退出准备度尚未得到公开证明。IPO Club 称 Forterra 没有公开股票代码、没有宣布 IPO
              日期，二级市场流动性有限；因此任何持仓都应被视为长期持有的私营国防科技资产，而不是近期退出的纸面机会。下一步尽调不是再看一次自主系统演示，而是取得董事会批准的 2026
              年财务报表、逐项目积压订单转化、债务和清算优先权细节、按主承包商及终端客户拆分的客户集中度，以及证明 2025 年 11
              月融资后该估值仍通过清晰新资金基准的证据。如果无法提供这套材料，投资建议应维持继续研究或更差。
            claimRefs:
              - CV001
