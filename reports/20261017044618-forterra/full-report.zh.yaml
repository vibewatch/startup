chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与定位
        blocks:
          - type: paragraph
            body: >
              Forterra 一直将自己定位为自主任务系统公司，而不是单一车辆
              OEM。官方材料强调模块化自主、通信和任务模块，这些模块可跨多个平台集成，并将“边缘连接到企业”；合作伙伴和媒体则将同一模式描述为全栈自主层，既可改装到现有车辆，也可嵌入新车。这个定位影响后续整份报告，因为它表明
              Forterra 的价值主张是可复用的自主与互操作性技术栈，而不只是来自某一个国防项目或某一种硬件形态的收入。

              公司公开身份也明确落在国防和军民两用工业自主领域。官方及第三方来源将业务所在地指向马里兰州 Clarksburg，并称其任务覆盖拒止 GPS
              环境下的导航、物流、感知、通信和机器人集群。因此，现有资料支持一个清晰基线：Forterra
              是一家私营国防自主系统公司，向军事及相邻工业工作流销售可执行任务的自主平台；当前证据明显偏向产品叙事和部署里程碑，而非财务披露。
            claimRefs:
              - CO001
              - CO004
              - CO006
      - number: '1.2'
        title: 领导层、创始人延续性与治理透明度
        blocks:
          - type: paragraph
            body: >
              创始人延续性非常明确。Forterra 官方领导层页面称 Alberto Lacaze 于 2002 年创办这家公司，当时公司仍名为 Robotic Research；如今他担任董事会主席兼总裁。Josh
              Araujo 在担任首席运营官后出任首席执行官；Joseph Putney、Scott Sanders、Scott Philips 和 Kevin Turner
              分别负责技术、增长、创新以及法律与合规。Salesforce Ventures 的投资说明也独立印证了当前运营班底，将 Araujo、Sanders、Putney、Philips 和 Lacaze
              视为公司运营故事的核心人物。

              关键人物带来的上行是技术传承与国防市场拓展经验的结合；风险则是公开叙事仍集中在一支规模不大的可见班底上，尤其是 Lacaze 和
              Araujo。治理披露比领导层披露更薄弱。现有资料确认创始人兼董事长的结构，并称首席法务官向董事会提供治理建议，但没有列出完整董事会名单、所有权与控制权拆分，或清晰的领导层变动时间线。这足以说明目前由谁领导公司，却不足以有把握地评估治理质量。
            claimRefs:
              - CO002
              - CO003
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
              - CO014
      - number: '1.3'
        title: 资本基础与公开规模信号
        blocks:
          - type: paragraph
            body: >
              当前最有力的融资事实是 2025 年 11 月的 Series C。GovCon Wire 报道 Forterra 获得 $238 million 股权及债务融资，Salesforce Ventures
              也单独确认参与该轮。随后，第三方私募市场资料将该轮融资与据报道约 $1 billion 的估值联系起来；其中一个登记册式资料还称，三轮融资累计超过 $541
              million。这些数字可作为方向性锚点，但不如经审计或主要来源的股权结构披露可靠，应视为据报道的估值标记，而不是已经完成投资判断的经济数据。

              公开规模指标仍很零散。Cyberr 的未认领页面将 Forterra 员工数列为约 630 人，其他市场数据资料则称超过 500
              人；两者都不具备公司主要文件或直接薪资披露的可信度。现有资料无法证明收入、年经常性收入（ARR）、客户数或积压订单转化，IPO Club 还明确指出 Forterra
              仍是私有公司，任何老股交易都有限且缺乏流动性。实际而言，本章可以支持融资事件和大致规模类别，却无法支持精确的运营指标投资判断。
            claimRefs:
              - CO005
              - CO007
              - CO008
              - CO009
