  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 该序数图根据指定资料池披露的证据，展示开放程度与公开实地验证之间的关系，并非独立基准。
    data:
      xAxis:
        label: 平台开放度 / 伙伴杠杆
        min: 1
        max: 5
        low: 封闭或受控路径
        high: 可跨伙伴平台模块化
        description: Ordinal synthesis from cited evidence; higher values reflect a more modular cross-platform autonomy position.
        scale: ordinal
      yAxis:
        label: 公开披露的国防实地验证
        min: 1
        max: 5
        low: 资料页级验证
        high: 已部署任务 / 在运项目
        description: >-
          Ordinal synthesis from cited evidence; higher values reflect stronger public evidence of field use or active
          program deployment.
        scale: ordinal
      points:
        - label: Forterra
          x: 5
          'y': 5
          note: 模块化技术栈，并有多项公开部署和集成参考。
        - label: Hypercraft / 专用 UGV 路径
          x: 3
          'y': 2
          note: 指定资料池中的车辆规格较强，但披露的实地验证主要来自与 Forterra 的配对。
        - label: 国防主承包商 / 现有项目团队
          x: 2
          'y': 4
          note: 采购触达和项目存在感似乎较强，但指定资料池没有展示可比的自主系统技术栈细节。
        - label: OEM / 内部集成路径
          x: 2
          'y': 3
          note: 底盘控制力强，但自主能力需要外部采购或自行组装。
        - label: 有人驾驶现状
          x: 1
          'y': 5
          note: 运营上已验证的基线，但自主系统开放度低。
        - label: 新兴机器人初创公司
          x: 4
          'y': 2
          note: IPO Club 将这一类别列为威胁集合，但指定资料池没有直接点名或对标其中许多公司。
    approximationNotes: 评分是分析师根据引用证据编制的序数定位，不应解读为经过测量的市场基准或赢单率数据。
    claimRefs:
      - CP001
      - CP003
      - CP005
      - CP006
      - CP007
      - CP009
      - CP011
      - CP012
  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 公开证据显示，Forterra 通过将模块化自主系统集成到客户或 OEM 平台中实现变现，随后扩大部署；公开来源尚未披露确认收入或毛利。
    data:
      nodes:
        - id: demand
          label: 国防或工业平台需求
          note: 买方首先需要车辆、任务或场地自动化能力，而不是单独购买一个 SaaS 席位。
        - id: modules
          label: AutoDrive 加任务模块
          displayValue: Retrofit or OEM-line autonomy stack
          note: 公开来源将 AutoDrive、Vektor 及相关模块描述为核心可售能力。
        - id: integration
          label: 集成到客户或 OEM 车辆
          displayValue: Existing fleet or production line
          note: 来源显示，既有改装安装，也有与 Polaris 合作的 OEM 产线改造。
        - id: delivery
          label: 已部署的自主平台交付
          displayValue: '>200 active-service vehicles; 105 Lancers in under six months'
          note: 部署规模已公开，但每个平台的收入尚未披露。
        - id: operations
          label: 任务运营与支持
          displayValue: 1,100+ missions; 52 CASEVAC operations
          note: 实地使用表明持续支持和迭代需求存在，但服务经济性未披露。
        - id: financial-output
          label: 确认收入与毛利
          displayValue: Undisclosed
          note: 公开来源没有提供实际定价、毛利率、获客成本或现金跑道。
      edges:
        - from: demand
          to: modules
          relationship: 需求转化为 Forterra 自主系统范围
        - from: modules
          to: integration
          relationship: 软件、通信和计算能力集成到车辆中
        - from: integration
          to: delivery
          relationship: 集成后的车辆或系统部署到项目中
        - from: delivery
          to: operations
          relationship: 项目带来任务活动、支持负荷和迭代需求
        - from: operations
          to: financial-output
          relationship: 公开记录没有披露活动如何转化为收入或利润率
    approximationNotes: 该流程为定性描述，并保留了明确的披露限制；不能根据部署数量推断转化率、定价或利润率。
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI005
      - CI006
      - CI009
      - CI011
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Forterra 当前架构分层搭建，从底盘和边缘硬件延伸至自主系统、通信、操作员控制和特定任务载荷。
    data:
      layers:
        - label: 任务载荷与项目
          detail: 各项目的专用载荷利用通用技术栈执行物流、撤离、破障及其他国防任务。
          outputs:
            - label: Last tactical mile logistics
            - label: CASEVAC and battlefield resupply
            - label: Autonomous breaching and lane making
        - label: 操作员控制
          detail: OneLink 为多种自主系统提供共享的操作框架。
          outputs:
            - label: Single operator interface
            - label: Faster onboarding for new autonomous systems
        - label: 通信与数据层
          detail: Vektor 和 OASIS-Fabric 提供韧性连接和共享数据交换。
          modules:
            - label: Vektor 通信
            - label: OASIS-Fabric 网络
          outputs:
            - label: Distributed fleet coordination
        - label: 自主系统层
          detail: AutoDrive 在复杂越野环境中负责导航和任务执行。
          outputs:
            - label: GPS-enabled driving
            - label: GPS-denied driving
            - label: Teleoperation to autonomy progression
        - label: 边缘计算与感知
          detail: 加固型车载计算设备在边缘侧支持传感器融合和任务应用。
          modules:
            - label: 车载计算
            - label: 传感器与载荷接口
        - label: 基础车辆
          detail: Forterra 将技术栈部署在改装后的 OEM 或合作伙伴底盘上，而非采用单一的专有车辆架构。
          modules:
            - label: Polaris Ranger XD 1500 / 改装 Ranger 基础车
            - label: Hypercraft Razorback 集成
            - label: 基于 Ford F-250 的 MAUL 应用
    claimRefs:
      - CE002
      - CE003
      - CE005
      - CE006
      - CE008
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 国防领域的采用似乎从平台集成推进到项目选择，再扩展至任务场景；续约经济性仍不透明。
    data:
      items:
        - label: 识别国防任务需求
          actor: 美国及盟国国防买方
          touchpoints:
            - 降低部队补给和侦察风险
            - 无 GPS 及恶劣地形下的自主系统需求
        - label: 传感器与车辆集成
          actor: Ouster、Polaris 和 Hypercraft 生态
          touchpoints:
            - 以 Ouster 激光雷达为中心的感知技术栈
            - 基于 Polaris 的 MESA 与 Hypercraft Razorback 集成
        - label: 项目准入与选择
          actor: 陆军 / DoD 采购渠道
          touchpoints:
            - Ouster 点名的四个活跃 DoD 项目
            - 工程自主破障能力项目的主承包商选择
        - label: 实地部署与任务验证
          actor: 军方操作员
          touchpoints:
            - '>100 辆已交付车辆和累计 400,000 英里'
            - '>200 辆在役车辆'
        - label: 拓展至相邻任务
          actor: 现有军事项目负责人
          touchpoints:
            - ROGUE Fires 和 SOCOM 验证点
            - 乌克兰物流、战斗支援和 CASEVAC 任务
        - label: 续约与集中度可见性缺口
          actor: 投资者和尽调团队
          touchpoints:
            - 合同期限、NRR 和流失率仍未披露
            - 头部客户集中度和经济份额仍不清楚
    approximationNotes: null
    claimRefs:
      - CU008
      - CU010
      - CU011
      - CU012
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 定性定位优先考虑后果和证据缺口，并非经过测量的概率模型。
    data:
      columns:
        - id: likelihood
          label: 可能性
          detail: 定性评估；“未知”表示指定证据不足以支持概率估计。
        - id: impact
          label: 影响
          detail: 风险发生时可能造成的后果。
        - id: mitigation
          label: 缓释成熟度
          detail: 指定公开证据中可见的缓释措施强度。
        - id: residual
          label: 剩余暴露
          detail: 计入可见缓释措施后的剩余投资暴露。
      rows:
        - id: authorization
          label: 安全与授权
          note: 指定资料池中没有批准和安全记录。
          values:
            - label: Unknown
              note: 指定证据不足以支持任何概率判断。
            - label: 若存在缺陷则为关键风险
              note: 重大缺陷可能阻止或限制部署。
            - label: 未验证
              note: 可见政府项目活动，但看不到控制措施。
            - label: 高
              note: 投资前需要法律和技术层面的保证。
        - id: reliability
          label: 车队可靠性
          note: 任务和里程总数缺少故障及人工干预分母。
          values:
            - label: Unknown
              note: 没有披露车队层面的故障率。
            - label: 关键
              note: 对抗性作战中的故障可能影响任务和安全。
            - label: 部分
              note: 部署已得到证明；可靠性控制尚未得到证明。
            - label: 高
              note: 需要车队遥测和验收证据。
        - id: metric-control
          label: 运营指标控制
          note: 发布方版本与转载版本中的 CASEVAC 总数不同。
          values:
            - label: 已观察到问题
              note: 保留文本中存在这一不一致。
            - label: 尽调影响高
              note: 未调和的指标削弱了对运营报告的信心。
            - label: 没有证据
              note: 没有提供调和结果或有日期的截止点。
            - label: 调和前为高
              note: 应以底层任务日志为准。
        - id: common-platform
          label: 通用平台缺陷
          note: 据报道，AutoDrive 已覆盖 200 多辆在役车辆。
          values:
            - label: Unknown
              note: 没有公开事故率或共模故障率。
            - label: 关键
              note: 共享软件缺陷可能影响多个车队。
            - label: 部分
              note: 可见在役部署；隔离和故障转移能力不可见。
            - label: 高
              note: 需要审查冗余、补丁和降级模式。
        - id: dependency
          label: OEM 与合作伙伴依赖
          note: 当前集成中点名了 Polaris 和 Hypercraft。
          values:
            - label: 中度担忧
              note: 多项已点名集成带来了可观察的交易对手。
            - label: 高
              note: 供应、质量或接口故障可能延迟部署。
            - label: 部分
              note: OEM 产线集成和联合演示缓解了执行风险。
            - label: 重大
              note: 替代所需时间和合同救济未披露。
        - id: concentration
          label: 政府项目集中度
          note: 可见项目制和陆军选择相关的声明，但看不到经济数据。
          values:
            - label: 较高担忧
              note: 保留证据集中在国防项目上。
            - label: 关键
              note: 取消或延迟可能损害增长和现金转化。
            - label: 部分
              note: 提及了多个项目，但份额不可得。
            - label: 高
              note: 收入和积压订单集中度仍未知。
    approximationNotes: 仅使用指定来源池进行的分析师定性分类；“可能性未知”不是数值概率，可能性较低一栏的空白也不代表风险不存在。
    claimRefs:
      - CR003
      - CR007
      - CR008
      - CR009
      - CR010
      - CR013
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 实地验证和产品广度已经可见，但在最近一次报告估值下，经济数据和流动性仍不足以支持买入判断。
    data:
      nodes:
        - id: proof
          label: 实地验证
          note: 乌克兰部署 105 辆 Lancer，以及 200 多辆处于在役状态的 AutoDrive 车辆。
        - id: breadth
          label: 产品广度
          note: MESA 以 AutoDrive、Vektor、OEM 集成和 2,000 磅载荷能力扩展了平台。
        - id: financing
          label: 融资锚点
          note: 最近一次公开融资为 $238 million，估值约 $1 billion，且据报道包含债务。
        - id: economics
          label: 缺失的经济数据
          note: 公开来源仍未披露收入、盈利能力、利润率或积压订单转化。
        - id: liquidity
          label: 流动性 / 结构风险
          note: Forterra 仍是私人公司，在二级市场缺乏流动性，也没有公布 IPO 时间表。
        - id: call
          label: 继续研究的判断
          note: 跟踪运营验证，但在纳入投资判断前要求披露经济数据或给出更好的价格。
          tone: risk
      edges:
        - from: proof
          to: breadth
          label: 证明真实的运营相关性
        - from: breadth
          to: financing
          label: 有助于解释融资叙事
        - from: financing
          to: economics
          label: 提出分母证据需求
        - from: economics
          to: liquidity
          label: 不透明性叠加私人市场风险
        - from: liquidity
          to: call
          label: 推动价格敏感的谨慎态度
    approximationNotes: 基于已披露证据的定性逻辑链，而非机械评分模型。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV006
      - CV007
      - CV008
      - CV014
