              Forterra 拥有有意义的公开部署证明，但这些披露更像需求信号，而不是可用于投资判断的输入。Defense News 报道 AutoDrive 已集成到超过 200 辆现役车辆；Forterra
              称其在不到六个月内生产并部署了 105 辆 Lancer，在乌克兰完成超过 1,100 次任务和 52 次
