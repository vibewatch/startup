      - number: '2.3'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              保留下来的证据指向项目驱动的购买流程。用户是在高风险环境执行物流、部队防护、破障和支援任务的操作人员；采购权力似乎掌握在军种项目办公室、主承包商、OEM
              合作伙伴和系统集成商手中，而不是自助式终端用户。Forterra 对 MESA 的说明强调与现有平台、传感器和指挥系统互操作；Hypercraft 合作及基于 Polaris 的 MESA
              平台也表明，采用路径往往要经过合作伙伴车辆平台和集成任务系统。终端牵引车等工业邻近场景仍有意义，但公开证明仍集中在国防工作流和国防采购路径。
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM011
              - CM014
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM005
              - CM011
              - CM014
              - CM016
      - number: '2.4'
        title: 需求驱动、约束与未解尽调
        blocks:
          - type: paragraph
            body: >-
              现有资料中最强的需求驱动因素是降低风险、提高人力效率和互操作性。NightDragon 强调，GEARS 式自主系统可将一次货运任务所需人员从五六人减少到一两人；Defense News 和 Forterra
              自身披露也反复将价值主张落在把士兵从危险的物流、破障和撤离环节中移出。同时，同一组证据说明采用速度可能慢于软件投资者预期：地面自主系统必须应对不平地形、障碍物和持续的人类活动，项目时点仍取决于采购决定、合作伙伴集成和生产扩张。因此，公开记录对任务需求的方向判断偏乐观，但对支出归属、收入结构和独立的
              2026 年市场规模基准仍很薄弱。
