      - number: '3.2'
        title: 产品位置与分销杠杆
        blocks:
          - type: paragraph
            body: >-
              Forterra 最清晰的差异化，在于它把自主能力作为跨多个车辆合作伙伴的集成层来销售。Tectonic 称 AutoDrive 是全栈自主方案，已经集成到多家制造商的车辆中；Forterra 自身的 MESA
              发布也显示，在需要更完整的可执行任务系统时，公司会在 Polaris 底盘上把 AutoDrive 与 Vektor 打包。这个混合模式拓宽了市场路径：当主承包商或 OEM
              已控制车辆时，公司可以保持模块化；当客户需要比内部集成更快获得可用平台时，公司也可以交付更紧密的预集成方案。
