              - CM016
      - number: '2.2'
        title: 受证据约束的规模化视角
        blocks:
          - type: paragraph
            body: >-
              保留下来的来源没有披露 Forterra
              市场可辩护的美元总可用市场（TAM）、可服务市场（SAM）或可获取市场（SOM），也没有提供可直接用于估值、而无需引入外部假设的公开复合年增长率。因此，本章用运营规模视角替代虚构的收入池。最有力的视角是项目覆盖、已安装基数证据和观察到的任务吞吐量：Forterra
              被描述为覆盖当前国防部四个地面自主项目；Defense News 称 AutoDrive 已集成到超过 200 辆现役车辆；Forterra 2026 年 7 月关于乌克兰的披露则增加了 105 辆已部署
              Lancer、超过 1,100 次任务和 777,440 磅运输量。这些数据点显示真实采用深度，但仍是采用代理指标而非支出上限，因此更能支持市场相关性，而非精确市场规模。
