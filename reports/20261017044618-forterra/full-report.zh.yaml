              - CV004
              - CV005
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 公开证据表明应等待价格
            body: Forterra 在战略上相关，但缺乏流动性且经济性未披露，因此在上次披露的独角兽估值下，应继续研究而非买入。
