  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              现有资料把市场边界收得比泛泛的“自主系统”更窄。Forterra 面向国防提供地面自主系统，也服务相邻的工业和越野工作流，而不是乘用车道路自动驾驶。它卖的不只是驾驶软件：Forterra
              将自主能力与任务模块、计算、通信和感知打包，使系统能够在 GPS
              拒止或受威胁环境中运行。因此，相关替代方案仍是由人员执行危险的物流、伤员后送、补给、破障和机动作业，而不是另一套消费级移动技术栈。公开证据也表明工业邻近市场确实存在，但其证据比国防记录薄弱，因此工业上行空间应视为增量可服务市场，而不是当前市场判断的主要证明点。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
