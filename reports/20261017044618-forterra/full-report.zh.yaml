        blocks:
          - type: paragraph
            body: >-
              同一套帮助 Forterra
              进入更多车辆类型的渠道策略，也限制了仅凭公开证据判断其锁定效应的能力。来源显示了真实的现场验证和合作伙伴广度，包括乌克兰部署指标及跨多种车辆的集成，但没有披露目录价格、折扣、合同结构，或相对于替代供应商的明确客户切换阻力。因此，护城河成立但并不完整：Forterra
              拥有可信的项目牵引力和集成经验，但如果主承包商、OEM 和成熟客户能够将自主集成内化，或在未来项目中绕开 Forterra，它们仍是可信的替代路径。
