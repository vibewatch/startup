        title: 竞争版图与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              本章公开记录指向的竞争集合，比简单列出直接软件同行更广。IPO Club 将 Forterra 与“成熟国防承包商和新兴机器人初创公司”并列；Forterra 自身及第三方报道也反复显示，公司通过 OEM
              和主承包商渠道开展业务，而不是销售一辆完全自有的整车。买方因此不仅会比较其他自主技术栈，还会比较专用无人车辆供应商、能把自主能力装进大型项目的传统国防主承包商，以及已经嵌入采购和运营流程的有人物流平台这一现状方案。
