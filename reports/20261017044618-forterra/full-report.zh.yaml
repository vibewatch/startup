      - number: '1.4'
        title: 里程碑轨迹与未解缺口
        blocks:
          - type: paragraph
            body: >
              2026 年的里程碑流向与 2025 年融资后的国防优先扩张故事一致。Forterra 2026 年 4 月发布的 MESA 公告显示，公司正以 Polaris Ranger 基础车将自主技术栈产品化；公司
              2026 年 7 月发布的公告称，在一个始于 2024 年、截至 2025 年 3 月已签约的项目中，为乌克兰生产并部署了 105 辆自主 Lancer 车辆；Defense News 报道 2026 年 10
              月与 Hypercraft 合作，同时称 AutoDrive 已集成到超过 200 辆处于现役的车辆上。GovCon Wire 还将融资后的时期与陆军及海军陆战队项目联系起来，并提到 Volvo
              Defense、BAE Systems、CHAOS Industries 和 Raytheon 等更广泛的合作伙伴。

              这些证据支持从融资走向部署、集成和生态扩展的真实里程碑轨迹，但没有消除核心尽调缺口。现有资料仍缺乏收入质量、客户集中度、股权结构条款、完整董事会构成，以及 Forterra
              在主承包商主导项目中实际取得的经济份额等主要披露。后续章节应将这些缺失作为真实的投资判断限制保留下来，而不是从旧报告记忆中悄悄补齐。
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
