      - number: '4.4'
        title: 资本充足性与财务结论
        blocks:
          - type: paragraph
            body: >-
              本章的本地证据支持 Forterra 能继续为产品和生产扩张提供资金，但不支持外部投资者仅凭公开材料判断收入质量或利润率持久性。Forterra 披露 2025 年 11 月完成 $238 million 的
              Series C 股权及债务融资；第三方资料将累计融资概括为约 $541 million，最新披露估值为 $1
              billion。这说明公司具备明确的资本获取能力，却没有回答关键投资判断问题：当前现金、债务条款、烧钱速度、客户集中度、项目级毛利率，以及合同赢单转化为实收现金的情况。审慎的财务结论是，Forterra
              确有扩张势头和融资支持，但尽调应将收入质量、利润率路径和现金跑道视为未解事项，而不是已解决的事实。
