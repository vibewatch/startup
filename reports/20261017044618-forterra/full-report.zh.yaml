  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与保障风险
        blocks:
          - type: paragraph
            body: >-
              保留下来的公开记录确认了美国政府项目下的国防部署，以及入选陆军破障项目，但没有说明这些部署所受的安全授权、出口管制批准、网络安全认证、保险结构、诉讼状况或事故历史。这种缺失不等于不存在问题，但它是实质性的投资判断缺口，因为
              Forterra
              的系统在受威胁环境中结合了自主机动、通信、传感器以及可能接近武器的任务载荷。当前证据支持将授权和保障视为未经验证，而不是给出概率。在投资前，法律顾问应按项目梳理批准事项，审查出口许可证和数据处理控制，检查安全论证及测试豁免，并使用法律实体名称检索诉讼和监管记录。缺失必要授权、未解决的重大安全发现或未披露的执法事项，都应触发投资逻辑中断。
