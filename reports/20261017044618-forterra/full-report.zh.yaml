      - number: '8.2'
        title: 公开记录支持什么、不支持什么
        blocks:
          - type: paragraph
            body: >-
              公开证据最强的是技术和部署证明，而不是财务转化。Forterra 2026 年 4 月的 MESA 发布、2026 年 7 月的乌克兰披露、2026 年 10 月的 Hypercraft 发布，以及 645
              Ventures 对列装项目的描述，都指向真实的产品广度和合作伙伴验证。同时，Silicon Valley Investclub 称底层公开来源没有披露 Forterra 的收入或盈利能力；公开员工数披露仍在约
              500 人到 629 人之间。没有收入、利润率或积压订单质量证据，$1 billion 的估值标题仍只是融资数据点，而不是可辩护的公开市场倍数。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
