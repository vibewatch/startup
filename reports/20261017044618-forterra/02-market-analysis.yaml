company:
  name: Forterra
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Forterra's retained public evidence defines a defense-led ground-autonomy market with industrial adjacencies,
    but not a clean public TAM/SAM/SOM in dollars. The best support comes from operational proxies—program
    coverage, fielded vehicles, and mission throughput—plus explicit evidence that buyers care about reducing
    personnel risk, interoperating with existing platforms, and operating in GPS-denied or contested terrain.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The retained pool supports a narrower market definition than generic "autonomy." Forterra is framed as a
      supplier of autonomous ground systems for defense, with adjacent industrial and off-road workflows, rather
      than a passenger-road AV vendor. The offer is not just driving software: Forterra packages autonomy with
      mission modules, compute, communications, and sensing so the system can operate in GPS-denied or contested
      environments. That boundary matters because the relevant substitute is still crewed execution of dangerous
      logistics, CASEVAC, resupply, breaching, and maneuver tasks, not another consumer mobility stack. Public
      evidence also suggests the industrial-adjacency story exists, but it is thinner than the defense record, so
      industrial upside should be treated as incremental SAM rather than the main proof point in today's market case.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM016]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Evidence-constrained sizing lenses
    body: >-
      None of the retained sources discloses a defensible dollar TAM, SAM, or SOM for Forterra's market, and none
      provides a public CAGR that could be carried into valuation work without importing external assumptions. The
      chapter therefore uses operational sizing lenses instead of invented revenue pools. The strongest lenses are
      program coverage, installed-base evidence, and observed mission throughput: Forterra is described as present
      across all four current DoD ground-autonomy programs, Defense News says AutoDrive is integrated on more than
      200 active-service vehicles, and Forterra's July 2026 Ukraine disclosure adds 105 fielded Lancer vehicles,
      more than 1,100 missions, and 777,440 pounds moved. Those data points show real adoption depth, but they are
      still adoption proxies, not spend ceilings, so they support market relevance more than precise market size.
    claimRefs: [CM006, CM007, CM008, CM009, CM013, CM015]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-map
    title: Buyers, users, and adoption path
    body: >-
      The retained evidence points to a program-led buying motion. Users are operators running logistics,
      force-protection, breaching, and support missions in high-risk environments, while purchasing power appears to
      sit with service program offices, primes, OEM partners, and systems integrators rather than with self-serve
      end users. Forterra's own MESA description emphasizes interoperability with existing platforms, sensors, and
      command systems, and both the Hypercraft collaboration and the Polaris-based MESA platform reinforce that the
      route to adoption often runs through partner vehicle platforms and integrated mission systems. Industrial
      adjacencies such as terminal tractors remain relevant, but the available public proof still centers on defense
      workflows and defense procurement pathways.
    claimRefs: [CM002, CM003, CM005, CM011, CM014, CM016]
    tableRefs: [TM003]
  - id: drivers-constraints-gaps
    title: Demand drivers, constraints, and unresolved diligence
    body: >-
      The strongest demand drivers in the retained pool are risk reduction, manpower efficiency, and interoperability.
      NightDragon highlights that GEARS-style autonomy can reduce a cargo mission from five or six people to one or
      two, while Defense News and Forterra's own disclosures repeatedly anchor the value proposition in taking
      soldiers out of dangerous logistics, breaching, and evacuation loops. At the same time, the same evidence set
      shows why adoption may be slower than software investors expect: ground autonomy must handle uneven terrain,
      obstacles, and constant human activity, and program timing still depends on procurement decisions, partner
      integration, and production scaling. The public record is therefore directionally bullish on mission need, but
      still weak on spend ownership, revenue mix, and independent 2026 market-size benchmarks.
    claimRefs: [CM005, CM010, CM011, CM012, CM014, CM015, CM016]
