  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing-gap
      missingEvidence: Independent 2026 TAM, SAM, or SOM estimates in dollars for defense ground autonomy and Forterra's industrial adjacency.
      whyItMatters: Without a third-party spend benchmark, valuation work has to lean on adoption proxies instead of true market ceilings.
      diligencePath: Obtain analyst-market data, procurement-budget studies, or public-company disclosures that quantify spend by defense and industrial ground-autonomy segment.
      relatedQuestionRefs: [QM003]
      relatedTableRefs: [TM002]
    - type: missing-source
      severity: material
      topic: buying-motion
      missingEvidence: Program-level budget owners, appropriation lines, and spend envelopes for the logistics, breaching, and mission-platform workflows in this chapter.
      whyItMatters: Budget ownership determines sales-cycle length, pricing power, and how much of the adoption story can convert into contracted revenue.
      diligencePath: Pull procurement documents, OTA awards, budget justifications, or prime-contractor program material that names the paying office and spending line.
      relatedQuestionRefs: [QM004, QM005]
      relatedTableRefs: [TM003]
    - type: private-evidence-only
      severity: material
      topic: market-mix
      missingEvidence: Current defense-versus-industrial revenue mix and named commercial deployment counts.
      whyItMatters: The public record implies industrial adjacency, but not whether it is a real second growth engine or mostly narrative support around a defense-led core.
      diligencePath: Request customer counts, booked pilots, and revenue split data by defense and industrial segment from management or investor materials.
      relatedQuestionRefs: [QM007]
