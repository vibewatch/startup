schemaVersion: report-v2
artifact: customers
slug: forterra
runDate: '2026-10-17'
company:
  name: Forterra
chapter:
  number: 6
  title: Customers
  summary: >-
    Forterra's public customer proof remains overwhelmingly defense-program specific:
    partner and trade-press sources point to more than 100 shipped vehicles, more
    than 400,000 cumulative miles, and more than 200 vehicles in active service
    across military use cases. What the refresh evidence still does not disclose is
    customer durability, renewal behavior, or concentration economics inside
    prime-contractor-led and government-funded programs.
sections:
  - id: customer-base-segmentation
    title: Customer base is evidenced mainly through defense programs and program-adjacent partners
    body: >-
      The retained refresh evidence does not show a broad set of named commercial
      customers; instead, it concentrates on U.S. defense and allied military use
      cases. Ouster names four active DoD programs, Forterra's own April 2026 MESA
      launch cites real-world operations in the USMC ROGUE Fires program and various
      SOCOM initiatives, and 645 Ventures describes Forterra as present across every
      current DoD ground vehicle autonomy program. Cyberr still describes industrial
      applications in general terms, but the assigned pool does not contain equally
      concrete non-defense deployments, so current segmentation proof is much stronger
      for defense buyers, users, and payers than for commercial accounts.
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU009
      - CU012
    tableRefs:
      - TU001
  - id: adoption-trajectory
    title: Adoption proof is real, but the disclosed metrics use different denominators
    body: >-
      Adoption proof is materially stronger than logo-only evidence. Ouster says
      Forterra has shipped more than 100 vehicles, accumulated 400,000 operating
      miles, and is in U.S. military programs across more than ten countries. Two
      October 2026 trade reports also say AutoDrive is integrated on more than 200
      vehicles in active service, while Forterra's July 2026 Ukraine disclosure adds
      a separate wartime deployment datapoint of 105 Lancer vehicles, more than 1,100
      missions, and 52 CASEVAC operations. Those are meaningful scale signals, but
      they are not clearly the same denominator, so the chapter can support mission
      breadth and field use more confidently than any precise customer-count trend.
    claimRefs:
      - CU003
      - CU004
      - CU007
      - CU011
    tableRefs:
      - TU002
    figureRefs:
      - FU001
  - id: named-customer-proof
    title: Named customer proof mixes production evidence, program selection, and showcase paths
    body: >-
      The strongest named proof comes from government programs rather than enterprise
      SaaS-style account disclosures. Forterra's own material points to ROGUE Fires
      and SOCOM as real-world operating environments for MESA, the Ukraine disclosure
      presents a production-scale deployment under a U.S. government program, and the
      ArmyTimes and Defense News coverage shows both a showcased Hypercraft-integrated
      vehicle and Army selection of Forterra for the Engineer Autonomous Breaching
      Capability effort. Together, these sources support real adoption and land-and-
      expand channel motion, but they still leave open where pilots end and durable,
      high-margin recurring program revenue begins.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
      - CU011
    tableRefs:
      - TU003
  - id: durability-and-concentration
    title: Durability and concentration remain the weakest parts of the public customer record
    body: >-
      The assigned refresh pool does not disclose NRR, GRR, logo churn, renewal
      rates, contract length, or even a clean split between direct end-customer
      revenue and partner-enabled deployments. It also does not quantify top-customer
      concentration or Forterra's economic share inside programs led by military
      customers, primes, or OEM partners. That means the public customer story is
      persuasive on operational validation, but still incomplete for underwriting
      repeatability, expansion efficiency, and concentration risk.
    claimRefs:
      - CU010
      - CU012
callouts:
  - calloutType: strength
    title: Operational customer proof is stronger than simple logo evidence
    body: >-
      The retained 2026 evidence includes shipped-vehicle, active-service, mission,
      mileage, and casualty-evacuation datapoints, which is materially stronger than
      a logo wall or an undeveloped testimonial page.
    claimRefs:
      - CU003
      - CU004
      - CU007
  - calloutType: risk
    title: Public evidence still does not prove durability or concentration quality
    body: >-
      The refresh pool shows live defense adoption, but it still leaves renewal,
      churn, contract-length, and customer-concentration economics largely private.
    claimRefs:
      - CU010
      - CU012
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / payer
      - User
      - Use case
      - Scale / strategic value
      - Gap
    rows:
      - - U.S. Army and broader DoD ground-autonomy programs
        - Army / DoD procurement
        - Operators, logistics, and maneuver units
        - Reconnaissance, troop supply, autonomous transport, and expeditionary fires
        - Ouster names four active DoD programs; 645 Ventures says Forterra is present across current DoD ground vehicle autonomy programs
        - Revenue share, renewal timing, and program-by-program economics are not disclosed
      - - USMC and SOCOM mission programs
        - U.S. government defense budgets
        - Expeditionary and special-operations users
        - Last tactical mile logistics, force protection, and mission payload integration
        - Forterra cites ROGUE Fires and various SOCOM initiatives as real-world operating contexts for MESA
        - Independent retained proof does not quantify fleet size or budget conversion
      - - Ukrainian forces via a U.S. government program
        - U.S. government program funding
        - Ukrainian battlefield operators
        - Logistics, combat support, and casualty evacuation
        - Forterra disclosed 105 Lancer vehicles, more than 1,100 missions, and 52 CASEVAC operations
        - Metrics are company-issued and do not disclose contract value or follow-on orders
      - - OEM / integration-led route to military end users
        - Partner chassis, payload, and sensor ecosystems
        - End military users operating partner-equipped platforms
        - Hypercraft Razorback integration, Polaris-based MESA configuration, and Ouster-enabled perception
        - Suggests channel leverage and faster deployment into existing vehicle programs
        - Public sources do not separate direct customer demand from partner-enabled deployment
    notes: >-
      Null is avoided here because each row is a supported segment summary; strategic
      value reflects operational significance, not disclosed revenue.
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU012
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date / period
      - Source basis
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Vehicles shipped
        - '>100'
        - Undated current case study
        - Ouster customer story
        - Medium
        - Demonstrates fielded hardware footprint, not just prototype claims
        - Does not say how many remain active or how many belong to each program
      - - Cumulative operating miles
        - '400,000'
        - Undated current case study
        - Ouster customer story
        - Medium
        - Suggests sustained operational use in harsh environments
        - Miles are not broken out by customer, vehicle class, or time period
      - - Vehicles in active service
        - '>200'
        - '2026-10-14'
        - ArmyTimes and Defense News reporting
        - High
        - Indicates installed-base expansion beyond the older >100 shipped datapoint
        - Could include different platform counts than the Ouster figure
      - - Ukraine deployment
        - '105 vehicles; >1,100 missions; 52 CASEVAC operations'
        - '2026-07-07'
        - Forterra disclosure syndicated on Yahoo Finance
        - Medium
        - Shows production-scale battlefield usage rather than lab validation
        - No disclosed contract value, renewal status, or gross-margin context
    notes: >-
      These metrics come from different issuers and likely different denominators, so
      they should be read as directional adoption proof rather than a clean time
      series or a single customer-count funnel.
    claimRefs:
      - CU003
      - CU004
      - CU007
      - CU011
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / program
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome / proof
      - Limitation
    rows:
      - - Engineer Autonomous Breaching Capability / MAUL
        - U.S. Army
        - Mine-clearing, reconnaissance, and autonomous breaching support
        - Program selection plus field exercise evidence
        - Army selected Forterra as a prime contractor and the MAUL was demonstrated during Project Sandhills
        - Retained evidence does not disclose contract value or fleet size
      - - USMC ROGUE Fires and SOCOM initiatives
        - U.S. military mission programs
        - Mission-ready autonomous logistics and payload mobility
        - Production-use evidence claimed by company
        - Forterra cites real-world operations and interoperable mission-ready deployment
        - Public independent corroboration in this pool is limited
      - - Ukrainian forces under a U.S. government program
        - Allied military deployment
        - Logistics, combat support, and casualty evacuation
        - Production deployment
        - 105 vehicles delivered, more than 1,100 missions, and 52 CASEVAC operations
        - Metrics are company-issued and do not show post-program renewal durability
      - - Hypercraft Razorback path to end military users
        - OEM / channel-enabled military deployment
        - Autonomous payload delivery in contested environments
        - Showcase with active-service installed-base proof
        - AUSA 2026 unveiling plus trade-press reporting that AutoDrive is on >200 active-service vehicles
        - Showcase momentum does not itself prove recurring Razorback orders
    notes: >-
      This is a partial sample of named proof from the assigned pool, not an exhaustive
      customer list; it mixes direct government program evidence with partner-enabled
      routes to military end users.
    enumerationScope:
      coverage: partial
      basis: >-
        The assigned worker pool contains only a subset of public, successfully
        prefetched customer evidence centered on named defense programs and partner-led
        deployments during the 2025-2026 refresh window.
