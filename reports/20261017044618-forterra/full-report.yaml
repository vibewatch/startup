chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and positioning
        blocks:
          - type: paragraph
            body: >
              Forterra consistently frames itself as an autonomous-mission-systems company rather than a single-vehicle
              OEM. Its official materials emphasize modular autonomy, communications, and mission modules that can be
              integrated across multiple platforms and “connect the edge to the enterprise,” while partner and press
              sources describe the same model as a full-stack autonomy layer that can be retrofitted onto existing
              vehicles or embedded into new ones. That positioning matters for the rest of the report because it
              suggests Forterra’s value proposition is a reusable autonomy-and-interoperability stack, not just revenue
              from one defense program or one hardware form factor.


              The company’s public identity also anchors it in defense and dual-use industrial autonomy. Official and
              third-party sources place the business in Clarksburg, Maryland and describe a mission set spanning
              GPS-denied navigation, logistics, sensing, communications, and robotic swarms. The assigned pool therefore
              supports a clear baseline: Forterra is a private defense-autonomy company selling mission-ready autonomy
              platforms into military and adjacent industrial workflows, with current evidence skewed much more toward
              product narrative and deployment milestones than toward financial disclosure.
            claimRefs:
              - CO001
              - CO004
              - CO006
      - number: '1.2'
        title: Leadership, founder continuity, and governance visibility
        blocks:
          - type: paragraph
            body: >
              Founder continuity is unusually visible. Forterra’s official leadership page says Alberto Lacaze founded
              the business in 2002, when it was still Robotic Research, and now serves as chairman of the board and
              president. Josh Araujo is presented as chief executive officer after previously serving as chief operating
              officer, while Joseph Putney, Scott Sanders, Scott Philips, and Kevin Turner cover technology, growth,
              innovation, and legal/compliance functions respectively. Salesforce Ventures’ investment note
              independently reinforces the current operating bench by highlighting Araujo, Sanders, Putney, Philips, and
              Lacaze as central to the company’s operating story.


              The key-person upside is a blend of technical lineage and defense go-to-market experience; the key-person
              risk is that the public narrative remains concentrated around a small visible bench, especially Lacaze and
              Araujo. Governance disclosure is thinner than leadership disclosure. The available pool identifies a
              founder-chair structure and notes that the chief legal officer advises the board on governance, but it
              does not surface a full board roster, ownership/control breakdown, or clean chronology of leadership
              transitions. That is enough to establish who currently leads the company, but not enough to underwrite
              governance quality confidently.
            claimRefs:
              - CO002
              - CO003
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
              - CO014
      - number: '1.3'
        title: Capital base and public scale signals
        blocks:
          - type: paragraph
            body: >
              The strongest current financing fact is the November 2025 Series C. GovCon Wire reports that Forterra
              secured $238 million in equity and debt financing, and Salesforce Ventures separately confirms it invested
              in that round. Third-party private-market profiles then extend that snapshot by tying the round to a
              reported roughly $1 billion valuation and, in one registry-style profile, total funding of $541
              million-plus across three rounds. Those figures are useful directional anchors, but they remain less
              robust than audited or primary cap-table disclosure and should be treated as reported marks rather than
              fully underwritten economics.


              Public scale metrics remain patchy. Cyberr’s unclaimed profile lists Forterra at approximately 630
              employees, while other market-data profiles describe 500-plus employees; neither source provides the same
              confidence as a primary company filing or direct payroll disclosure. The current pool does not
              substantiate revenue, ARR, customer count, or backlog conversion, and IPO Club explicitly notes that
              Forterra remains private and that any secondary transactions are limited and illiquid. In practical terms,
              the chapter can support the financing event and the broad scale category, but not a precise
              operating-metric underwriting case.
            claimRefs:
              - CO005
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO003
            claimRefs:
              - CO007
              - CO010
              - CO012
              - CO013
      - number: '1.4'
        title: Milestone trajectory and open gaps
        blocks:
          - type: paragraph
            body: >
              The 2026 milestone flow is consistent with a defense-first expansion story after the 2025 raise.
              Forterra’s April 2026 MESA announcement shows the company productizing its autonomy stack on a Polaris
              Ranger base vehicle; a July 2026 company-issued release says it produced and deployed 105 autonomous
              Lancer vehicles for Ukraine after a program that originated in 2024 and was under contract by March 2025;
              and Defense News reports an October 2026 Hypercraft collaboration while also stating that AutoDrive had
              been integrated on more than 200 vehicles in active service. GovCon Wire further links the post-raise
              period to Army and Marine programs and a wider partner set including Volvo Defense, BAE Systems, CHAOS
              Industries, and Raytheon.


              That evidence supports a real milestone arc from financing into deployments, integrations, and ecosystem
              breadth. It does not eliminate the core diligence gaps. The assigned pool still lacks primary disclosure
              on revenue quality, customer concentration, cap-table terms, full board composition, and the exact
              economic share Forterra captures inside prime-contractor-led programs. Those absences should be carried
              into later chapters as real underwriting limits rather than silently backfilled from older report memory.
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
