      - number: '3.2'
        title: Product position and distribution leverage
        blocks:
          - type: paragraph
            body: >-
              Forterra's clearest differentiation is that it sells autonomy as an integration layer across multiple
              vehicle partners. Tectonic describes AutoDrive as a full-stack autonomy offering that has already been
              integrated into vehicles from multiple manufacturers, and Forterra's own MESA launch shows the company
              packaging AutoDrive and Vektor together on a Polaris chassis when it wants a more complete mission-ready
              system. That hybrid model broadens the company's route to market: it can stay modular when primes or OEMs
              already control the vehicle, but it can also ship a tighter pre-integrated package when the customer needs
              a ready platform faster than an in-house integration effort would allow.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP007
