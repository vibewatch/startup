      - number: '5.3'
        title: Deployment evidence is real, but public assurance on security and reliability remains thin
        blocks:
          - type: paragraph
            body: >-
              Forterra's product maturity is better evidenced than in many defense-autonomy startups: the company has
              disclosed a 105-vehicle Lancer deployment to Ukraine, Defense News says AutoDrive is integrated on more
              than 200 vehicles in active service, and OneLink is already being piloted at the Army's Joint Readiness
              Training Center. Those are meaningful indicators that the stack is being exercised outside slideware. The
              weak point is assurance detail. Public materials emphasize modularity, contested-environment
              communications, and product-security hiring, but the retained public record does not verify formal uptime
              commitments, third-party security certifications, or detailed field failure and maintenance data. For
              diligence, that leaves a gap between visible deployment momentum and independently evidenced reliability
              and security controls.
            claimRefs:
