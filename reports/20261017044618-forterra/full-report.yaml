  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows Forterra monetizing modular autonomy through integration into customer or OEM platforms,
      then scaling deployments; public sources stop short of disclosing recognized pricing or gross profit.
    data:
      nodes:
        - id: demand
          label: Defense or industrial platform need
          note: Buyers start with a vehicle, mission, or yard-automation requirement rather than a standalone SaaS seat.
        - id: modules
          label: AutoDrive plus mission modules
          displayValue: Retrofit or OEM-line autonomy stack
          note: Public sources describe AutoDrive, Vektor, and related modules as the core sellable capability.
        - id: integration
          label: Integration on customer or OEM vehicle
          displayValue: Existing fleet or production line
          note: Sources show both retrofit installs and OEM-line modifications with Polaris.
        - id: delivery
          label: Fielded autonomous platform delivery
          displayValue: '>200 active-service vehicles; 105 Lancers in under six months'
          note: Deployment scale is public, but revenue per platform is not.
        - id: operations
          label: Mission operations and support
          displayValue: 1,100+ missions; 52 CASEVAC operations
          note: Field usage suggests ongoing support and iteration demands, but service economics are undisclosed.
        - id: financial-output
          label: Recognized revenue and gross profit
          displayValue: Undisclosed
          note: Public sources do not provide realized pricing, gross margin, CAC, or runway.
      edges:
        - from: demand
          to: modules
          relationship: Requirement converted into Forterra autonomy scope
        - from: modules
          to: integration
          relationship: Software, comms, and compute are integrated into the vehicle
        - from: integration
          to: delivery
          relationship: Integrated vehicles or systems are fielded into programs
        - from: delivery
          to: operations
          relationship: Programs generate mission activity, support load, and iteration demand
        - from: operations
          to: financial-output
          relationship: Public record does not disclose how activity converts into revenue or margin
    approximationNotes: >-
      This flow is qualitative and preserves explicit disclosure limits; it does not infer conversion rates, pricing, or
      margin from deployment counts.
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI005
      - CI006
      - CI009
      - CI011
