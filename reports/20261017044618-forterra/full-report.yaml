      - number: '4.2'
        title: Public traction versus unit-economics visibility
        blocks:
          - type: paragraph
            body: >-
              Forterra has meaningful public deployment proof, but those disclosures are better demand signals than
              underwriting inputs. Defense News reports AutoDrive is integrated on more than 200 vehicles in active
              service, and Forterra says it produced and deployed 105 Lancer vehicles in under six months with more than
              1,100 missions and 52 CASEVAC operations completed in Ukraine. Those data points support product
              acceptance, field reliability, and some integration throughput. They do not reveal revenue recognition,
              realized pricing, gross margin, CAC, payback, or renewal durability. Silicon Valley Investclub is
              unusually explicit that the provided sources do not disclose Forterra revenue or profitability, so public
              traction should not be treated as a proxy for ARR or contribution margin.
