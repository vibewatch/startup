  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          2026 scale-up converts Ukraine and DoD proof into disclosed repeat program revenue, while terms remain clean
          for new money.
        - >-
          Greater-than-or-equal-to $1 billion can work only if disclosed revenue quality supports premium
          defense-autonomy pricing.
        - Program concentration, procurement delays, and hidden preferences.
        - Needs signed 2026 revenue/backlog evidence and term-sheet proof; neither is public yet.
      - - Base
        - >-
          Forterra remains strategically relevant, but economics stay private and the latest financing mark remains the
          main anchor.
        - Around $1 billion looks full; the practical action is wait or track until new data arrives.
        - Data opacity, illiquidity, and multiple compression against defense peers.
        - Most consistent with the current public evidence set.
      - - Bear
        - >-
          Deployment wins fail to translate into repeatable economics, or private-market terms prove more
          investor-unfriendly than the headline valuation suggests.
        - Below $1 billion or no participation until a lower-clearing price or cleaner structure appears.
        - Delayed procurements, debt/preference overhang, and customer concentration.
        - Triggered if the next financing lacks clean primary demand or if financial diligence disappoints.
    notes: >-
      Public evidence does not support a precise DCF or revenue-multiple model, so the scenarios are price-sensitive
      bands around the last reported mark rather than false-precision targets.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV014
      - CV015
