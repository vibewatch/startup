      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The retained evidence points to a program-led buying motion. Users are operators running logistics,
              force-protection, breaching, and support missions in high-risk environments, while purchasing power
              appears to sit with service program offices, primes, OEM partners, and systems integrators rather than
              with self-serve end users. Forterra's own MESA description emphasizes interoperability with existing
              platforms, sensors, and command systems, and both the Hypercraft collaboration and the Polaris-based MESA
              platform reinforce that the route to adoption often runs through partner vehicle platforms and integrated
              mission systems. Industrial adjacencies such as terminal tractors remain relevant, but the available
              public proof still centers on defense workflows and defense procurement pathways.
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM011
              - CM014
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM005
              - CM011
              - CM014
              - CM016
      - number: '2.4'
        title: Demand drivers, constraints, and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers in the retained pool are risk reduction, manpower efficiency, and
              interoperability. NightDragon highlights that GEARS-style autonomy can reduce a cargo mission from five or
              six people to one or two, while Defense News and Forterra's own disclosures repeatedly anchor the value
              proposition in taking soldiers out of dangerous logistics, breaching, and evacuation loops. At the same
              time, the same evidence set shows why adoption may be slower than software investors expect: ground
              autonomy must handle uneven terrain, obstacles, and constant human activity, and program timing still
              depends on procurement decisions, partner integration, and production scaling. The public record is
              therefore directionally bullish on mission need, but still weak on spend ownership, revenue mix, and
              independent 2026 market-size benchmarks.
            claimRefs:
              - CM005
              - CM010
              - CM011
              - CM012
              - CM014
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The public record in this chapter points to a wider competitive set than a simple list of direct software
              peers. IPO Club places Forterra against "established defense contractors and emerging robotics startups,"
              while Forterra's own and third-party coverage repeatedly shows the company working through OEM and
              prime-contractor channels rather than selling a complete captive vehicle. That means buyers can compare
              Forterra not only with other autonomy stacks, but also with purpose-built unmanned vehicle providers,
              incumbent defense primes that can bundle autonomy into larger programs, and the status quo of crewed
              logistics platforms that already sit inside procurement and operating workflows.
            claimRefs:
