  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The retained pool supports a narrower market definition than generic "autonomy." Forterra is framed as a
              supplier of autonomous ground systems for defense, with adjacent industrial and off-road workflows, rather
              than a passenger-road AV vendor. The offer is not just driving software: Forterra packages autonomy with
              mission modules, compute, communications, and sensing so the system can operate in GPS-denied or contested
              environments. That boundary matters because the relevant substitute is still crewed execution of dangerous
              logistics, CASEVAC, resupply, breaching, and maneuver tasks, not another consumer mobility stack. Public
              evidence also suggests the industrial-adjacency story exists, but it is thinner than the defense record,
              so industrial upside should be treated as incremental SAM rather than the main proof point in today's
              market case.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM016
      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              None of the retained sources discloses a defensible dollar TAM, SAM, or SOM for Forterra's market, and
              none provides a public CAGR that could be carried into valuation work without importing external
              assumptions. The chapter therefore uses operational sizing lenses instead of invented revenue pools. The
              strongest lenses are program coverage, installed-base evidence, and observed mission throughput: Forterra
              is described as present across all four current DoD ground-autonomy programs, Defense News says AutoDrive
              is integrated on more than 200 active-service vehicles, and Forterra's July 2026 Ukraine disclosure adds
              105 fielded Lancer vehicles, more than 1,100 missions, and 777,440 pounds moved. Those data points show
              real adoption depth, but they are still adoption proxies, not spend ceilings, so they support market
              relevance more than precise market size.
