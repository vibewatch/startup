  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports a hybrid revenue model rather than a pure software-license story. Aerospace
              & Defense Technology quotes Forterra describing AutoDrive as something that can be deployed "as a retrofit
              onto existing vehicles or on production lines," while Forterra's own April 2026 MESA announcement says the
              platform is built with Polaris on the OEM's production line. That combination implies Forterra can
              monetize autonomy software, rugged compute/comms modules, integration engineering, and in some cases
              complete autonomous vehicle configurations. Defense.Direct also describes a commercial track through the
              Kalmar Ottawa AutoTT, but notes it is still in testing ahead of 2027 availability, so the industrial
              channel appears less mature than the defense business. None of the retained sources disclose list prices,
              take rates, or whether recurring software/support revenue is separated from platform-delivery revenue.
            claimRefs:
