  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Forterra is selling a reusable mission-system stack, not just a single vehicle
        blocks:
          - type: paragraph
            body: >-
              The public record reviewed here points to Forterra moving up from an autonomy-software vendor to a modular
              mission-systems provider. The current product surface includes the newly unveiled MESA vehicle platform,
              the AutoDrive autonomy stack, Vektor communications, OASIS-Fabric networking, and the OASIS-OneLink
              operator interface. That matters because the buyer workflow is not limited to acquiring a standalone
              robotic truck; Forterra is pitching a kit of interoperable layers that can be fielded on Forterra-owned
              vehicles, on partner vehicles, and inside specific defense programs. The 2025 and 2026 coverage also shows
              the company extending the same core stack across last-tactical-mile logistics, casualty evacuation,
              mine-clearing, and multi-system control rather than building one-off point solutions for each use case.
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE010
              - CE013
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
              - CE010
              - CE011
              - CE013
      - number: '5.2'
        title: Architecture centers on autonomy, communications, and control layers that can travel across chassis
        blocks:
          - type: paragraph
            body: >-
              The common architecture is clearer than the branding alone suggests. MESA combines a modified Polaris base
              with onboard compute, sensing, AutoDrive autonomy, and Vektor communications; Defense News separately
              reports that OASIS-OneLink sits above the data layer to let operators command different autonomous systems
              from one interface. That gives Forterra two technical advantages if the public claims hold: a portable
              autonomy layer that can be integrated onto third-party vehicles such as Hypercraft's Razorback, and a
              common operator framework that reduces re-integration friction when new systems are added. The stack still
              depends heavily on OEM chassis partners and program-specific payload integration, so the portability claim
              is stronger for autonomy and control software than for a fully standardized end product.
            claimRefs:
              - CE002
              - CE003
              - CE005
              - CE006
              - CE008
              - CE009
