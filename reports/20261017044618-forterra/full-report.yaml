      - number: '4.3'
        title: Cost structure, capital intensity, and working-capital implications
        blocks:
          - type: paragraph
            body: >-
              Available evidence implies a capital-intensive delivery model. Forterra says the 2025 Series C will
              enhance production capacity for edge-computing platforms, and the MESA launch highlights OEM-line
              modifications executed alongside Polaris rather than a lightweight software-only deployment. The company
              also says it produced and fielded 105 Lancer vehicles in less than six months, which suggests real
              exposure to hardware procurement, integration labor, testing, and support operations even if suppliers
              absorb some chassis manufacturing. That can still be an attractive model if program scale expands, but the
              sources do not disclose working-capital terms, inventory exposure, hardware/software gross-margin mix, or
              the share of economics Forterra keeps when primes and OEMs are involved. Defense.Direct's contract-ceiling
              caveat is therefore important: public award values can overstate realizable cash.
            claimRefs:
              - CI002
              - CI005
              - CI007
              - CI009
              - CI010
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              This chapter's local evidence supports the view that Forterra can keep funding product and production
              expansion, but not that outside investors can yet underwrite revenue quality or margin durability from
              public materials alone. Forterra disclosed a $238 million Series C in equity and debt in November 2025,
              and third-party profiles summarize roughly $541 million in total funding with a latest disclosed $1
              billion valuation. That provides clear access to capital, yet it does not answer the key underwriting
              questions: current cash on hand, debt terms, burn, customer concentration, program-level gross margin, or
              conversion of contract wins into collected cash. The prudent financial conclusion is that Forterra has
              real scale-up momentum and financing support, but diligence should treat revenue quality, margin path, and
              runway as open items rather than solved facts.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
      - number: '4.5'
        title: Exhibits
        blocks:
