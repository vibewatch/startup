  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base is evidenced mainly through defense programs and program-adjacent partners
        blocks:
          - type: paragraph
            body: >-
              The retained refresh evidence does not show a broad set of named commercial customers; instead, it
              concentrates on U.S. defense and allied military use cases. Ouster names four active DoD programs,
              Forterra's own April 2026 MESA launch cites real-world operations in the USMC ROGUE Fires program and
              various SOCOM initiatives, and 645 Ventures describes Forterra as present across every current DoD ground
              vehicle autonomy program. Cyberr still describes industrial applications in general terms, but the
              assigned pool does not contain equally concrete non-defense deployments, so current segmentation proof is
              much stronger for defense buyers, users, and payers than for commercial accounts.
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU009
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU012
      - number: '6.2'
        title: Adoption proof is real, but the disclosed metrics use different denominators
        blocks:
          - type: paragraph
            body: >-
              Adoption proof is materially stronger than logo-only evidence. Ouster says Forterra has shipped more than
              100 vehicles, accumulated 400,000 operating miles, and is in U.S. military programs across more than ten
              countries. Two October 2026 trade reports also say AutoDrive is integrated on more than 200 vehicles in
              active service, while Forterra's July 2026 Ukraine disclosure adds a separate wartime deployment datapoint
              of 105 Lancer vehicles, more than 1,100 missions, and 52 CASEVAC operations. Those are meaningful scale
              signals, but they are not clearly the same denominator, so the chapter can support mission breadth and
              field use more confidently than any precise customer-count trend.
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU008
              - CU010
              - CU011
              - CU012
      - number: '6.3'
        title: Named customer proof mixes production evidence, program selection, and showcase paths
        blocks:
          - type: paragraph
            body: >-
              The strongest named proof comes from government programs rather than enterprise SaaS-style account
              disclosures. Forterra's own material points to ROGUE Fires and SOCOM as real-world operating environments
              for MESA, the Ukraine disclosure presents a production-scale deployment under a U.S. government program,
              and the ArmyTimes and Defense News coverage shows both a showcased Hypercraft-integrated vehicle and Army
              selection of Forterra for the Engineer Autonomous Breaching Capability effort. Together, these sources
              support real adoption and land-and- expand channel motion, but they still leave open where pilots end and
              durable, high-margin recurring program revenue begins.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU011
      - number: '6.4'
        title: Durability and concentration remain the weakest parts of the public customer record
        blocks:
          - type: paragraph
            body: >-
              The assigned refresh pool does not disclose NRR, GRR, logo churn, renewal rates, contract length, or even
              a clean split between direct end-customer revenue and partner-enabled deployments. It also does not
              quantify top-customer concentration or Forterra's economic share inside programs led by military
              customers, primes, or OEM partners. That means the public customer story is persuasive on operational
              validation, but still incomplete for underwriting repeatability, expansion efficiency, and concentration
              risk.
            claimRefs:
              - CU010
              - CU012
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Operational customer proof is stronger than simple logo evidence
            body: >-
              The retained 2026 evidence includes shipped-vehicle, active-service, mission, mileage, and
              casualty-evacuation datapoints, which is materially stronger than a logo wall or an undeveloped
              testimonial page.
            calloutType: strength
            claimRefs:
              - CU003
              - CU004
              - CU007
          - type: callout
            title: Public evidence still does not prove durability or concentration quality
            body: >-
              The refresh pool shows live defense adoption, but it still leaves renewal, churn, contract-length, and
              customer-concentration economics largely private.
            calloutType: risk
            claimRefs:
              - CU010
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and assurance exposure
        blocks:
          - type: paragraph
            body: >-
              The retained public record confirms defense deployment under a U.S. government program and selection for
              an Army breaching program, but it does not identify the safety authorizations, export-control approvals,
              cybersecurity accreditations, insurance structure, litigation posture, or incident history governing those
              deployments. That absence is not evidence that no issue exists. It is a material underwriting gap because
              Forterra's systems combine autonomous maneuver, communications, sensors, and potentially weapon-adjacent
              mission payloads in contested environments. The current evidence supports treating authorization and
              assurance as unverified rather than assigning a probability. Before investment, counsel should map
              approvals program by program, review export licenses and data-handling controls, inspect safety cases and
              test waivers, and search litigation and regulator records using legal entity names. A missing required
              authorization, an unresolved material safety finding, or an undisclosed enforcement matter should be a
              thesis-break trigger.
            claimRefs:
              - CR004
              - CR010
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR010
              - CR012
              - CR015
      - number: '7.2'
        title: Operational reliability and systemic execution risk
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows real operating scale, but it is dominated by issuer statements and includes a
              consequential inconsistency. Forterra says it delivered 105 Lancer vehicles in under six months and
              reports more than 1,100 missions and 2,500 miles. Its own page reports 88 CASEVAC operations, while a
              syndicated version of the release reports 52. The discrepancy may reflect an update or editorial lag, but
              neither source states the measurement cut-off, denominator, failure rate, intervention rate, or fleet
              availability. Independent reporting says AutoDrive is integrated on more than 200 active-service vehicles
              and describes an Army demonstration under attack, which strengthens deployment proof but still does not
              establish reliability. The key kill criteria are unreconciled mission telemetry, material safety events,
              failure to meet program acceptance thresholds, or evidence that one software or communications defect can
              impair multiple vehicle programs.
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR012
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR007
              - CR008
              - CR009
              - CR010
              - CR013
              - CR016
      - number: '7.3'
        title: Partner, concentration, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              Forterra's modular strategy accelerates fielding but distributes execution risk across base vehicles,
              autonomy software, communications, payloads, OEM production, and government programs. Lancer and MESA use
              Polaris platforms; Razorback depends on Hypercraft hardware; and an investor describes Forterra as
              sole-source on the first DoD autonomous ground-vehicle program of record. These are useful validation
              signals, not diversification proof. No retained source quantifies supplier substitution time,
              program-level revenue, funded backlog conversion, customer concentration, gross margin, warranty exposure,
              working capital, or cash burn. Management should provide program economics, milestone-payment schedules,
              supplier terms, fleet-level reliability, and a dependency map. Monitor acceptance delays, component
              shortages, adverse contract modifications, concentration increases, and security staffing gaps. A lost
              anchor program, inability to replace a critical OEM, or capital needs unsupported by contracted cash flows
              would materially weaken the thesis.
            claimRefs:
              - CR002
              - CR004
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR004
              - CR009
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Reconcile operational telemetry before underwriting reliability
            body: >-
              The 52-versus-88 CASEVAC discrepancy may be a timing update, but the public record does not say so.
              Require dated fleet logs, mission definitions, intervention rates, availability, failures, and independent
              program acceptance evidence.
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR016
          - type: callout
            title: Treat missing legal and financial evidence as diligence gates
            body: >-
              Do not infer clean regulatory posture, low concentration, or adequate liquidity from the absence of public
              adverse records in this assigned pool. Investment approval should remain conditional on legal, security,
              program-economics, supplier, and cash-flow data.
            calloutType: recommendation
            claimRefs:
              - CR010
              - CR013
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment call
        blocks:
          - type: paragraph
            body: >-
              Forterra merits a research-more recommendation rather than a price-insensitive buy or dismissive pass.
              Independent sources confirm a November 2025 financing around a $1 billion valuation, while 2026 product
              and deployment updates show that the company has more than a concept story. But public evidence still does
              not disclose revenue, margin, backlog conversion, or clean cap-table economics, and IPO Club explicitly
              frames current access as illiquid private-market exposure with no public share price and no announced IPO
              date. That combination makes Forterra strategically credible but still too opaque for conviction
              underwriting at the reported mark.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV014
      - number: '8.2'
        title: What the public record does and does not support
        blocks:
          - type: paragraph
            body: >-
              Public evidence is strongest on technical and deployment proof, not on financial conversion. Forterra's
              April 2026 MESA launch, July 2026 Ukraine disclosure, October 2026 Hypercraft reveal, and 645 Ventures'
              program-of-record description all point to real product breadth and partner validation. At the same time,
              Silicon Valley Investclub says the underlying public source set does not disclose Forterra revenue or
              profitability, while public headcount disclosures still range from around 500 employees to 629. Without
              revenue, margin, or backlog-quality evidence, the $1 billion headline valuation remains a financing
              datapoint rather than a defensible public multiple.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV008
              - CV013
              - CV014
      - number: '8.3'
        title: Scenario framework and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Scenario framing therefore has to stay qualitative and price sensitive. The bull case requires the
              publicly described deployment proof and 1,000-unit production plan to convert into disclosed repeatable
              revenue, cleaner visibility into customer concentration and backlog conversion, and financing terms that
              do not subordinate new investors. The base case assumes Forterra is strategically relevant but roughly
              fully priced at the last reported mark because investors still cannot tie the valuation to public
              fundamentals. The bear case assumes commercialization lags theater proof, defense procurement timing
              stretches, or debt and liquidation preferences absorb more of the economics than the headline valuation
              suggests.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV009
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV014
              - CV015
      - number: '8.4'
        title: Final diligence asks and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is not yet publicly proven. IPO Club says Forterra has no public ticker, no announced IPO
              date, and limited secondary liquidity, so any position should be treated as a long-duration private
              defense-tech holding rather than near-term exit paper. The next diligence step is not another autonomy
              demo; it is access to board-approved 2026 financials, program-by-program backlog conversion, debt and
              liquidation-preference detail, customer concentration by prime and end customer, and evidence that the
              reported valuation still clears a clean new-money benchmark after the November 2025 round. Failure to
              produce that package should keep the recommendation at research-more or worse.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence says wait on price
            body: >-
              Forterra looks strategically relevant, but illiquidity plus undisclosed economics argue for research-more
              rather than a buy at the last reported unicorn mark.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV014
          - type: callout
            title: Headline valuation outruns disclosed denominators
            body: >-
              The market can cite the $1 billion mark, but public sources still cannot cite revenue, margin,
              profitability, or clean-term support against it.
            calloutType: risk
            claimRefs:
              - CV001
              - CV005
              - CV014
          - type: callout
            title: Upside depends on production converting into economics
            body: >-
              A more constructive stance requires the reported 2026 production plan and deployment proof to convert into
              disclosed recurring economics, not just stronger product milestones.
            calloutType: assumption
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV015
