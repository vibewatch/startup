            title: Hybrid monetization looks more like program delivery than SaaS
            body: >-
              Public evidence supports a mix of modules, integration, OEM-line work, and some complete vehicle delivery,
              which likely raises implementation and working capital needs relative to a software-only model.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI012
          - type: callout
            title: Deployment traction is not the same as revenue quality
            body: >-
              Vehicle counts, mission counts, and contract ceilings show activity, but they do not reveal realized
              pricing, gross margin, renewal durability, or cash collection timing.
            calloutType: risk
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI010
              - CI011
          - type: callout
            title: Underwriting should start with program-level cash conversion
            body: >-
              Management should provide recognized revenue, gross margin, support burden, customer concentration, debt
              terms, and backlog-to-cash conversion by major program before investors rely on the unicorn headline.
            calloutType: recommendation
            claimRefs:
