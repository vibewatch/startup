      - number: '3.3'
        title: Durability, lock-in, and open tradeoffs
        blocks:
          - type: paragraph
            body: >-
              The same channel strategy that helps Forterra get onto more vehicle types also limits how visible its
              lock-in is from public evidence alone. The sources show real field proof and partner breadth, including
              Ukraine deployment metrics and integrations across multiple vehicles, but they do not disclose list
              pricing, discounting, contract structure, or clear customer switching frictions versus alternative
              providers. That leaves a durable but incomplete moat case: Forterra has credible program traction and
              integration know-how, yet primes, OEMs, and sophisticated customers still look like credible substitution
              paths if they can internalize autonomy integration or route around Forterra on future programs.
