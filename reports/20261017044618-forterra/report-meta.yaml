companyProfile:
  summary: >-
    Forterra is a private defense-autonomy company that sells modular ground autonomy, communications, and
    mission-system capabilities into military and adjacent industrial workflows. The public record supports a business
    built around reusable autonomy layers, OEM and partner integrations, and fielded deployments such as MESA, Lancer,
    and Hypercraft-linked programs, but it still leaves revenue quality, concentration, and cap-table economics only
    partially disclosed.
  founders:
    - name: Alberto Lacaze
      role: Chairman of the Board and President
      background: Founder of the business in 2002 and still the visible bridge to the company’s technical lineage.
      claimRefs:
        - CO002
  headquarters: Clarksburg, Maryland, USA
  productSummary: >-
    Modular autonomy, communications, edge-compute, and mission-system platforms for defense and off-road autonomy
    programs.
  customerFocus: U.S. defense programs, military OEM partners, and adjacent industrial/off-road autonomy workflows.
  businessModel: >-
    Program-led delivery of autonomy platforms, mission modules, integration work, and related support across vehicle
    programs.
