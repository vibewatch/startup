  topStrengths:
    - Visible 2026 deployment and product milestones across MESA, Lancer, and Hypercraft-linked programs.
    - Reusable modular autonomy stack that appears to travel across vehicles, partners, and mission layers.
    - Real capital access via the November 2025 $238 million Series C.
    - Strong government-program and partner validation signals across defense workflows.
  topRisks:
    - Public disclosure still does not support revenue, margin, or backlog-quality underwriting.
    - Government-program and OEM/partner concentration remain meaningfully opaque.
    - Operational metric reconciliation and assurance details are still thin in the public record.
    - Private-market valuation and cap-table economics remain difficult to verify.
  unresolvedGaps:
    - Current revenue, ARR, gross margin, and backlog conversion by major program.
    - >-
      Exact cap-table, debt terms, liquidation preferences, and whether the reported unicorn mark reflects clean
      economics for new investors.
    - Full board roster, ownership/control structure, and the current leadership-transition history.
    - Customer concentration, renewal durability, and Forterra’s economic share inside prime-contractor-led programs.
