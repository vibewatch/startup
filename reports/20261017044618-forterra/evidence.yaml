evidenceGaps:
  - type: missing-source
    severity: material
    topic: revenue-and-customer-metrics
    missingEvidence: Current revenue, ARR, customer count, and backlog-conversion disclosure.
    whyItMatters: >-
      Without operating metrics, the chapter cannot test whether the reported valuation and defense traction translate
      into durable commercial scale.
    diligencePath: Request current board deck, monthly KPI pack, and program-level revenue bridge.
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: material
    topic: valuation-and-cap-table-economics
    missingEvidence: Cap table, debt terms, liquidation preferences, and round economics behind the reported unicorn valuation.
    whyItMatters: >-
      The current pool supports the financing event and reported mark but not whether new investors bought into clean
      economics or heavily structured downside protection.
    diligencePath: Request the Series C term sheet, cap table, debt schedule, and investor-rights documents.
    relatedQuestionRefs:
      - QO003
      - QO006
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: leadership and founder table coverage
    missingEvidence: Full board roster, committee structure, founder ownership, and leadership-transition chronology.
    whyItMatters: Public sources establish who is visible today but do not allow a strong governance or control assessment.
    diligencePath: Request the board list, organizational chart, option/ownership summary, and governance-policy materials.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A precise current employee count from management or HR systems.
    whyItMatters: Current public sources indicate approximate scale but not a clean, supportable headcount figure.
    diligencePath: Request current headcount by function and geography as of the latest month-end.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      Independent 2026 TAM, SAM, or SOM estimates in dollars for defense ground autonomy and Forterra's industrial
      adjacency.
    whyItMatters: >-
      Without a third-party spend benchmark, valuation work has to lean on adoption proxies instead of true market
      ceilings.
    diligencePath: >-
      Obtain analyst-market data, procurement-budget studies, or public-company disclosures that quantify spend by
      defense and industrial ground-autonomy segment.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buying-motion
    missingEvidence: >-
      Program-level budget owners, appropriation lines, and spend envelopes for the logistics, breaching, and
      mission-platform workflows in this chapter.
    whyItMatters: >-
      Budget ownership determines sales-cycle length, pricing power, and how much of the adoption story can convert into
      contracted revenue.
    diligencePath: >-
      Pull procurement documents, OTA awards, budget justifications, or prime-contractor program material that names the
      paying office and spending line.
    relatedQuestionRefs:
      - QM004
      - QM005
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: market-mix
    missingEvidence: Current defense-versus-industrial revenue mix and named commercial deployment counts.
    whyItMatters: >-
      The public record implies industrial adjacency, but not whether it is a real second growth engine or mostly
      narrative support around a defense-led core.
    diligencePath: >-
      Request customer counts, booked pilots, and revenue split data by defense and industrial segment from management
      or investor materials.
    relatedQuestionRefs:
      - QM007
  - type: enumeration-incomplete
    severity: material
    topic: competitor profile table coverage
    missingEvidence: >-
      A fuller named list of direct ground-autonomy peers, recent win/loss data, and cleaner public scale signals for
      each alternative class.
    whyItMatters: >-
      Without a broader peer census, the competitor profile table is directionally useful but cannot prove Forterra's
      exact rank against the full market.
    diligencePath: >-
      Request pipeline and win/loss materials, then cross-check named peers against current defense-autonomy program
      announcements and procurement records.
    relatedQuestionRefs:
      - QP001
      - QP008
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing and packaging transparency
    missingEvidence: >-
      List pricing, discounting, contract duration, sustainment terms, and where Forterra monetizes software versus
      vehicle integration.
    whyItMatters: >-
      Pricing opacity blocks a clean view of buyer tradeoffs, margin structure, and whether Forterra has a durable
      commercial edge over substitutes.
    diligencePath: >-
      Obtain redacted customer proposals, pricing sheets, or procurement records that separate software, integration,
      and vehicle economics.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: feature matrix unknown cells
    missingEvidence: >-
      Side-by-side requirements documents or evaluation records showing where primes, OEMs, and internal teams
      outperform or underperform Forterra on autonomy scope.
    whyItMatters: >-
      Unknown cells in the feature matrix limit confidence about switching costs, multi-homing risk, and the practical
      strength of Forterra's differentiation.
    diligencePath: >-
      Request demo scorecards, source-selection criteria, and technical evaluations from recent programs to convert
      unknown matrix cells into source-backed comparisons.
    relatedQuestionRefs:
      - QP003
      - QP006
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: >-
      Current recognized revenue, backlog conversion by major program, and revenue split across software, integration,
      sustainment, and vehicle delivery.
    whyItMatters: >-
      Without recognized revenue and mix detail, investors cannot distinguish deployment activity from durable,
      high-quality revenue.
    diligencePath: >-
      Request monthly or quarterly revenue bridge by program plus accounting policy for milestone, product, and service
      recognition.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: margin-and-runway
    missingEvidence: Gross margin, contribution margin, cash balance, burn, debt terms, and runway after the 2025 Series C.
    whyItMatters: >-
      Capital raised is not the same as cash available, and the mix of equity, debt, hardware content, and support
      burden determines financing dependency.
    diligencePath: Obtain latest management accounts, debt schedule, covenant package, and a 12- to 18-month cash forecast.
    relatedQuestionRefs:
      - QI004
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: go-to-market-efficiency
    missingEvidence: >-
      CAC, payback period, average program win cycle, and customer concentration across primes, branches, and industrial
      accounts.
    whyItMatters: >-
      Sales efficiency and concentration determine whether public traction scales efficiently or depends on a small
      number of bespoke defense programs.
    diligencePath: Review cohort-level pipeline, booked wins, renewal data, and customer concentration by revenue and gross profit.
    relatedQuestionRefs:
      - QI004
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: pricing-disclosure
    missingEvidence: >-
      Public or diligence-only pricing for modules, vehicle integrations, commercial pilots, and recurring support
      contracts.
    whyItMatters: Pricing is necessary to translate deployment metrics into revenue, margin, and potential operating leverage.
    diligencePath: >-
      Request exemplar customer contracts, price lists, and BOM-to-price waterfalls for at least one defense and one
      industrial program.
    relatedQuestionRefs:
      - QI001
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: >-
      Independent evidence of cybersecurity testing, third-party certifications, uptime commitments, or formal
      safety-case documentation for AutoDrive, Vektor, OASIS-Fabric, or OneLink.
    whyItMatters: >-
      Deployment momentum does not prove cyber resilience, software assurance, or operational reliability in scaled
      field conditions.
    diligencePath: >-
      Request product-security architecture, red-team or penetration-test summaries, certification status, incident
      history, and program-level uptime or failure-rate dashboards.
    relatedQuestionRefs:
      - QE007
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: integration-burden
    missingEvidence: >-
      Program-level data on integration cycle time, operator training time, field maintenance burden, and
      interoperability breadth across third-party vehicles and systems.
    whyItMatters: >-
      The investment case depends on a reusable stack reducing deployment friction; without these metrics it is hard to
      underwrite how scalable that reuse really is.
    diligencePath: >-
      Ask for integration playbooks, supported-vehicle matrixes, operator-training requirements, and post-deployment
      reliability reports for MESA, Lancer, and partner-vehicle programs.
  - type: missing-source
    severity: material
    topic: retention-durability
    missingEvidence: >-
      Program-level renewal rates, contract lengths, churn, NRR, GRR, and customer-satisfaction evidence for Forterra's
      installed base.
    whyItMatters: >-
      Without durability data, field deployment can prove utility without proving repeatability, retention quality, or
      efficient expansion.
    diligencePath: Request cohort retention, recompete, and renewal data by major defense program and any commercial account cohort.
    relatedQuestionRefs:
      - QU005
  - type: private-evidence-only
    severity: material
    topic: concentration-risk
    missingEvidence: >-
      Top-customer concentration, revenue split between direct and partner-enabled deployments, and Forterra's economic
      share inside prime-led programs such as ROGUE Fires.
    whyItMatters: Concentration risk can materially change valuation quality even when adoption proof is real.
    diligencePath: >-
      Obtain customer concentration schedules, program-level revenue waterfalls, and the direct-versus-channel booking
      mix from management.
    relatedQuestionRefs:
      - QU006
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      An exhaustive named-customer register that separates pilots, field trials, production deployments, and concluded
      programs.
    whyItMatters: >-
      The public sample proves traction, but it does not show the full breadth, attrition, or maturity mix of the
      customer base.
    diligencePath: Request the complete customer/program list with deployment stage, contract value band, and renewal status.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: regulatory-legal
    missingEvidence: >-
      Program-specific safety approvals, export licenses, cybersecurity accreditations, litigation and enforcement
      searches, incident logs, and insurance coverage.
    whyItMatters: >-
      Autonomous defense deployments can be delayed, restricted, or impaired by authorization, safety, cyber,
      export-control, or legal failures that the assigned public sources do not resolve.
    diligencePath: >-
      Obtain counsel and technical-assurance workstreams covering legal entities, jurisdictions, licenses, ATOs, safety
      cases, mishap records, regulator searches, and material litigation.
    relatedQuestionRefs:
      - QR001
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-concentration
    missingEvidence: >-
      Revenue, gross margin, burn, runway, working-capital needs, warranty exposure, funded backlog conversion, program
      economics, customer concentration, and supplier commitments.
    whyItMatters: >-
      Deployment and contract announcements do not establish profitable conversion, cash sufficiency, or resilience to
      program delay and supplier disruption.
    diligencePath: >-
      Review audited financials, monthly cash bridge, program-level backlog and margin schedules, milestone-payment
      terms, concentration reports, warranty reserves, and supplier contracts.
    relatedQuestionRefs:
      - QR003
  - type: missing-source
    severity: material
    topic: reliability-security
    missingEvidence: >-
      Fleet availability, mission success definitions, interventions, disengagements, failures, safety events, cyber
      incidents, patch latency, component yield, rework, and warranty returns.
    whyItMatters: >-
      Cumulative missions and miles cannot establish reliability or common-mode risk without denominators, failure logs,
      cut-off dates, and independent acceptance evidence.
    diligencePath: >-
      Reconcile the CASEVAC totals and inspect dated fleet telemetry, program acceptance reports, incident registers,
      root-cause analyses, software-release controls, and quality metrics.
    relatedQuestionRefs:
      - QR002
      - QR004
      - QR009
      - QR010
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: >-
      2026 revenue, gross margin, program-level backlog conversion, and renewal or recompete durability by major
      program.
    whyItMatters: >-
      Without denominators, investors cannot test whether the last reported valuation reflects scalable economics or
      only strategic narrative.
    diligencePath: >-
      Request audited 2025 and YTD 2026 financials plus a board or lender package that breaks revenue and backlog by
      major defense program.
    relatedQuestionRefs:
      - QV002
      - QV005
  - type: private-evidence-only
    severity: blocking
    topic: cap-table
    missingEvidence: >-
      Exact debt terms, liquidation preferences, dilution stack, transfer restrictions, and any structure attached to
      the November 2025 financing.
    whyItMatters: >-
