        Autonomous defense deployments can be delayed, restricted, or impaired by authorization,
        safety, cyber, export-control, or legal failures that the assigned public sources do not resolve.
      diligencePath: >-
        Obtain counsel and technical-assurance workstreams covering legal entities, jurisdictions,
        licenses, ATOs, safety cases, mishap records, regulator searches, and material litigation.
      relatedQuestionRefs: [QR001]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: financial-concentration
      missingEvidence: >-
        Revenue, gross margin, burn, runway, working-capital needs, warranty exposure, funded backlog
        conversion, program economics, customer concentration, and supplier commitments.
      whyItMatters: >-
        Deployment and contract announcements do not establish profitable conversion, cash
        sufficiency, or resilience to program delay and supplier disruption.
      diligencePath: >-
        Review audited financials, monthly cash bridge, program-level backlog and margin schedules,
        milestone-payment terms, concentration reports, warranty reserves, and supplier contracts.
