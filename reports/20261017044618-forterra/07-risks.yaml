  - id: TR002
    title: Operational, quality, and security risk register
    columns:
      - Failure mode
      - Evidence
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Monitor / kill criterion
    rows:
      - - Fleet reliability cannot be calculated
        - More than 1,100 missions and 2,500 miles are reported without failures, interventions, availability, or a time cut-off
        - Unknown
        - Critical
        - Field deployment demonstrated; reliability controls undisclosed
        - High
        - Require fleet telemetry and acceptance data; stop if material failures or unsafe interventions are concealed
      - - Operational metrics are inconsistent
        - Forterra's page reports 88 CASEVAC operations while the syndicated release reports 52
        - Observed reporting risk; operational cause unknown
        - High for diligence confidence
        - No reconciliation in retained evidence
        - High until reconciled
        - Reconcile source timestamps and underlying logs before relying on mission outcomes
      - - Rapid manufacturing strains quality control
        - The company reports 105 Lancers delivered in under six months and first integrated field exercise in under 40 days
        - Unknown
        - High
        - OEM platform and field iteration are described; yield and rework are absent
        - Material
        - Track first-pass yield, rework, warranty returns, spares, and acceptance delays
      - - Common autonomy or communications defect propagates across platforms
        - AutoDrive is reported on more than 200 active-service vehicles and is paired with Vektor across multiple vehicle integrations
        - Unknown
        - Critical
        - Modular integration is visible; isolation and fallback evidence is absent
        - High
        - Review redundancy, degraded modes, patch process, cyber incidents, and fleet-wide grounding triggers
    notes: >-
      Qualitative likelihood and severity reflect evidence availability and potential consequence,
      not measured incident rates; no failure-rate denominator was available.
    claimRefs: [CR003, CR005, CR006, CR007, CR008, CR009, CR012, CR016]
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Counterparty / owner
      - Role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation evidence
      - Residual exposure
    rows:
      - - Base vehicle supply
        - Polaris
        - Ranger platforms underpin Lancer and MESA
        - Two disclosed vehicle programs use Polaris platforms; supplier share is undisclosed
        - Allocation, redesign, or quality issue delays delivery
        - High
        - OEM-line integration is claimed for MESA
        - Material; substitution time unknown
      - - Partner vehicle integration
        - Hypercraft
        - Razorback hardware paired with AutoDrive
        - One newly disclosed integration; commercial allocation is undisclosed
        - Partner delay or interface failure blocks fielding
        - Medium to high
        - Joint demonstration is independently reported
        - Material; contractual remedies unknown
      - - Core autonomy platform
        - Forterra AutoDrive
        - Shared autonomy layer across vehicle programs
        - More than 200 active-service vehicles are reported
        - Common defect, cyber issue, or failed update affects multiple fleets
        - Critical
        - Active deployment and demonstrations are reported
        - High; redundancy and isolation unverified
      - - Government program and customer concentration
        - U.S. Department of Defense programs
        - Program selection, contracting, and production scale
        - An investor claims sole-source status on a program of record; revenue shares are undisclosed
        - Cancellation, delay, recompete, or adverse modification impairs growth and cash conversion
        - Critical
        - Multiple programs and platform integrations are mentioned
        - High until program economics and concentration are disclosed
    notes: >-
      Concentration percentages, contractual protections, supplier terms, revenue shares, and
      substitution timelines were not disclosed in the assigned evidence.
    claimRefs: [CR002, CR004, CR009, CR011, CR012, CR013, CR014]
figures:
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Qualitative placement prioritizes consequence and evidence gaps; it is not a measured
      probability model.
    data:
      columns:
        - id: likelihood
          label: Likelihood
          detail: Qualitative assessment; unknown means the assigned evidence supports no probability estimate.
        - id: impact
          label: Impact
          detail: Potential consequence if the risk occurs.
        - id: mitigation
          label: Mitigation maturity
          detail: Strength of mitigation visible in the assigned public evidence.
        - id: residual
          label: Residual exposure
          detail: Remaining investment exposure after visible mitigation.
      rows:
        - id: authorization
          label: Safety and authorization
          note: Approval and safety records were not available in the assigned pool.
          values:
            - label: Unknown
              note: No probability is supportable from the assigned evidence.
            - label: Critical if deficient
              note: A material deficiency could prevent or restrict deployment.
            - label: Unverified
              note: Government-program activity is visible, but controls are not.
            - label: High
              note: Requires legal and technical assurance before investment.
        - id: reliability
          label: Fleet reliability
          note: Mission and mileage totals lack failure and intervention denominators.
          values:
            - label: Unknown
              note: No fleet-level failure rate was disclosed.
            - label: Critical
              note: Failures in contested operations could affect mission and safety.
            - label: Partial
              note: Deployment is demonstrated; reliability controls are not.
            - label: High
              note: Fleet telemetry and acceptance evidence are required.
        - id: metric-control
          label: Operational metric control
          note: Public CASEVAC totals differ between issuer and syndicated versions.
          values:
            - label: Observed issue
              note: The inconsistency is present in retained texts.
            - label: High diligence impact
              note: Unreconciled metrics weaken confidence in operating reporting.
            - label: Not evidenced
              note: No reconciliation or dated cut-off is provided.
            - label: High until reconciled
              note: Underlying mission logs should control.
        - id: common-platform
          label: Common-platform defect
          note: AutoDrive is reported across more than 200 active-service vehicles.
          values:
            - label: Unknown
              note: No incident or common-mode failure rate is public.
            - label: Critical
              note: A shared software defect could affect multiple fleets.
            - label: Partial
              note: Active deployment is visible; isolation and fallback are not.
            - label: High
              note: Redundancy, patching, and degraded modes require review.
        - id: dependency
          label: OEM and partner dependency
          note: Polaris and Hypercraft are named in current integrations.
          values:
            - label: Medium concern
              note: Multiple named integrations create observable counterparties.
            - label: High
              note: Supply, quality, or interface failures could delay fielding.
            - label: Partial
              note: OEM-line integration and joint demonstration mitigate execution risk.
            - label: Material
              note: Substitution timing and contractual remedies are undisclosed.
        - id: concentration
          label: Government-program concentration
          note: Program-of-record and Army selection claims are visible; economics are not.
          values:
            - label: Elevated concern
              note: The retained evidence is concentrated in defense programs.
            - label: Critical
              note: Cancellation or delay could impair growth and cash conversion.
            - label: Partial
              note: Multiple programs are mentioned, but shares are unavailable.
            - label: High
              note: Revenue and backlog concentration remain unknown.
    approximationNotes: >-
      Qualitative analyst classification using only the assigned source pool; "unknown likelihood"
      is not a numerical probability, and empty lower-likelihood cells are not proof of absence.
    claimRefs: [CR003, CR007, CR008, CR009, CR010, CR013, CR016]
callouts:
  - calloutType: risk
    title: Reconcile operational telemetry before underwriting reliability
    body: >-
      The 52-versus-88 CASEVAC discrepancy may be a timing update, but the public record does not
      say so. Require dated fleet logs, mission definitions, intervention rates, availability,
      failures, and independent program acceptance evidence.
    claimRefs: [CR006, CR007, CR008, CR016]
  - calloutType: recommendation
    title: Treat missing legal and financial evidence as diligence gates
    body: >-
      Do not infer clean regulatory posture, low concentration, or adequate liquidity from the
      absence of public adverse records in this assigned pool. Investment approval should remain
      conditional on legal, security, program-economics, supplier, and cash-flow data.
    claimRefs: [CR010, CR013, CR015]
