chapter:
  number: 5
  title: "Product & Technology"
  summary: "Forterra now presents a modular defense-autonomy stack rather than a single vehicle: AutoDrive autonomy, Vektor and OASIS communications/control layers, and mission-specific vehicle integrations such as MESA, Lancer, and partner chassis. Recent 2026 launches and deployment disclosures show real field maturity and integration breadth, but the public record still lacks third-party assurance on reliability, cybersecurity, and certification."
sections:
  - id: "product-scope"
    title: "Forterra is selling a reusable mission-system stack, not just a single vehicle"
    body: "The public record reviewed here points to Forterra moving up from an autonomy-software vendor to a modular mission-systems provider. The current product surface includes the newly unveiled MESA vehicle platform, the AutoDrive autonomy stack, Vektor communications, OASIS-Fabric networking, and the OASIS-OneLink operator interface. That matters because the buyer workflow is not limited to acquiring a standalone robotic truck; Forterra is pitching a kit of interoperable layers that can be fielded on Forterra-owned vehicles, on partner vehicles, and inside specific defense programs. The 2025 and 2026 coverage also shows the company extending the same core stack across last-tactical-mile logistics, casualty evacuation, mine-clearing, and multi-system control rather than building one-off point solutions for each use case."
    claimRefs: ["CE001", "CE002", "CE006", "CE010", "CE013", "CE014"]
    tableRefs: ["TE001"]
  - id: "architecture-and-integration"
    title: "Architecture centers on autonomy, communications, and control layers that can travel across chassis"
    body: "The common architecture is clearer than the branding alone suggests. MESA combines a modified Polaris base with onboard compute, sensing, AutoDrive autonomy, and Vektor communications; Defense News separately reports that OASIS-OneLink sits above the data layer to let operators command different autonomous systems from one interface. That gives Forterra two technical advantages if the public claims hold: a portable autonomy layer that can be integrated onto third-party vehicles such as Hypercraft's Razorback, and a common operator framework that reduces re-integration friction when new systems are added. The stack still depends heavily on OEM chassis partners and program-specific payload integration, so the portability claim is stronger for autonomy and control software than for a fully standardized end product."
    claimRefs: ["CE002", "CE003", "CE005", "CE006", "CE008", "CE009"]
    tableRefs: ["TE003"]
    figureRefs: ["FE001"]
  - id: "maturity-and-technical-risks"
    title: "Deployment evidence is real, but public assurance on security and reliability remains thin"
    body: "Forterra's product maturity is better evidenced than in many defense-autonomy startups: the company has disclosed a 105-vehicle Lancer deployment to Ukraine, Defense News says AutoDrive is integrated on more than 200 vehicles in active service, and OneLink is already being piloted at the Army's Joint Readiness Training Center. Those are meaningful indicators that the stack is being exercised outside slideware. The weak point is assurance detail. Public materials emphasize modularity, contested-environment communications, and product-security hiring, but the retained public record does not verify formal uptime commitments, third-party security certifications, or detailed field failure and maintenance data. For diligence, that leaves a gap between visible deployment momentum and independently evidenced reliability and security controls."
    claimRefs: ["CE007", "CE009", "CE010", "CE011", "CE012"]
    tableRefs: ["TE002"]
