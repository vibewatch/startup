callouts:
  - calloutType: "strength"
    title: "Reusable control and autonomy layers appear to be the core product advantage"
    body: "The best-supported product thesis is not that Forterra owns every vehicle layer, but that AutoDrive, Vektor/OASIS-Fabric, and OneLink can be reused across multiple vehicle types and defense programs."
    claimRefs: ["CE003", "CE006", "CE008", "CE013"]
  - calloutType: "risk"
    title: "Deployment proof is ahead of public assurance proof"
    body: "Recent launch and fielding evidence is stronger than the public evidence on cybersecurity testing, uptime, or sustainment metrics, so technical diligence should focus on reliability, security, and integration burden before underwriting scale assumptions."
    claimRefs: ["CE010", "CE011", "CE012"]
