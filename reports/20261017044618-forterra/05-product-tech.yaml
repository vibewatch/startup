      - ["Onboard compute and sensing", "Runs edge decision-making, sensor fusion, and mission applications", "Ruggedized compute and integrated payload interfaces", "Public sources describe function but not compute redundancy, failover, or sensor-maintenance burden"]
      - ["AutoDrive autonomy stack", "Handles perception, navigation, teleoperation-to-autonomy progression, and mission execution", "Vehicle integration, sensor inputs, and mission safety envelopes", "No public disengagement, obstacle-detection, or cyber-hardening metrics in the assigned pool"]
