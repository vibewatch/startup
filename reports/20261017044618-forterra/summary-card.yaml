  topStrengths:
    - Visible 2026 deployment and product milestones across MESA, Lancer, and Hypercraft-linked programs.
    - Reusable modular autonomy stack that appears to travel across vehicles, partners, and mission layers.
    - Real capital access via the November 2025 $238 million Series C.
