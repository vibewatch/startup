company:
  name: "Forterra"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Forterra's public competitive position is strongest where buyers want a modular autonomy layer that can ride on partner
    vehicles instead of a single captive chassis. The assigned evidence also shows that this advantage is channel-dependent:
    Forterra's visible moat comes from program integrations and OEM/prime access, while public pricing, switching-cost, and
    named win/loss evidence versus alternative suppliers remain thin.
sections:
  - id: "landscape-and-alternatives"
    title: "Landscape and buyer alternatives"
    body: >-
      The public record in this chapter points to a wider competitive set than a simple list of direct software peers. IPO
      Club places Forterra against "established defense contractors and emerging robotics startups," while Forterra's own and
      third-party coverage repeatedly shows the company working through OEM and prime-contractor channels rather than selling a
      complete captive vehicle. That means buyers can compare Forterra not only with other autonomy stacks, but also with
      purpose-built unmanned vehicle providers, incumbent defense primes that can bundle autonomy into larger programs, and
      the status quo of crewed logistics platforms that already sit inside procurement and operating workflows.
    claimRefs: ["CP001", "CP003", "CP009", "CP012"]
    tableRefs: ["TP001"]
  - id: "product-position-and-distribution"
    title: "Product position and distribution leverage"
    body: >-
      Forterra's clearest differentiation is that it sells autonomy as an integration layer across multiple vehicle partners.
      Tectonic describes AutoDrive as a full-stack autonomy offering that has already been integrated into vehicles from
      multiple manufacturers, and Forterra's own MESA launch shows the company packaging AutoDrive and Vektor together on a
      Polaris chassis when it wants a more complete mission-ready system. That hybrid model broadens the company's route to
      market: it can stay modular when primes or OEMs already control the vehicle, but it can also ship a tighter
      pre-integrated package when the customer needs a ready platform faster than an in-house integration effort would allow.
    claimRefs: ["CP001", "CP002", "CP004", "CP007"]
    tableRefs: ["TP002"]
  - id: "durability-and-tradeoffs"
    title: "Durability, lock-in, and open tradeoffs"
    body: >-
      The same channel strategy that helps Forterra get onto more vehicle types also limits how visible its lock-in is from
      public evidence alone. The sources show real field proof and partner breadth, including Ukraine deployment metrics and
      integrations across multiple vehicles, but they do not disclose list pricing, discounting, contract structure, or clear
      customer switching frictions versus alternative providers. That leaves a durable but incomplete moat case: Forterra has
      credible program traction and integration know-how, yet primes, OEMs, and sophisticated customers still look like
      credible substitution paths if they can internalize autonomy integration or route around Forterra on future programs.
    claimRefs: ["CP005", "CP006", "CP010", "CP011", "CP012", "CP013"]
    tableRefs: ["TP003"]
    figureRefs: ["FP001"]
