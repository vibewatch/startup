summary:
  headline: >
    ENN Fusion 是一家有母公司背书的中国聚变长期项目：技术上押注真实的质子-硼路线，2026 年 7 月估值据报道约
    $1.6B。但公开证据更像期权价值，还撑不起可投资基本面：没有收入、没有具名客户、没有电站经济性，也没有清晰的牌照路径。更合适的判断是密切跟踪，或只在结构保护充分、里程碑约束严格时出手。
  overallScore: 5.6
  recommendation: track
