  topStrengths:
    - 母公司支持扎实：ENN Group 和 ENN Energy Research Institute 在首轮外部融资前已多年投入聚变研发，比许多早期深科技公司多一层产业支撑
    - 技术身份清楚：ENN 不是泛泛讲聚变故事；它明确押注紧凑型质子-硼 / 少中子聚变，并公开了路线图和经同行评审的技术论文
    - 能源场景相邻：如果 ENN 能把 ENN Energy 的企业能源和综合能源客户基础转成试点，后者可能成为未来商业化渠道
    - 能吸引大额外部资本：2026 年 7 月融资和投资方名单显示，尽管公司仍处早期，市场兴趣已经不低
    - 中国聚变叙事占位：ENN 所在的本土市场越来越重视稳定低碳电力、工业能源安全和前沿能源声望
  topRisks:
    - 技术风险：质子-硼聚变仍是商业聚变里最难走的路线之一，反向文献仍在强调轫致辐射和点火难度
    - 商业验证缺口：ENN 没有公开具名客户、试点业主、LOI 或 PPA，估值还缺少直接买方证据支撑
    - 披露风险：没有公开子公司财务、烧钱速度、股权结构细节、里程碑预算或电站经济模型，传统承销很难落笔
    - 监管与牌照路径不透明：ENN 尚未披露未来电站的商业牌照、安全、废弃物或环评路线图
    - 资本强度和稀释：商业化前后续融资大概率还会发生，即便技术继续推进，也可能压低普通股回报
    - 地缘政治和供应链暴露：出口管制、稀土 / 磁体瓶颈和跨境敏感性，都可能拖慢这个重硬件聚变项目
  unresolvedGaps:
    - 没有公开的 ENN Fusion 股权结构表、融资条款、清算优先权或投资人权利安排
    - 没有公开的月度烧钱速度、现金跑道或逐里程碑资金计划
    - 没有公开的客户管线、试点名单或母公司客户向聚变业务转化的漏斗
    - 没有公开的平准化电力成本、电站 capex、可用率或商业供电假设
    - 没有公开的中国特定牌照路径、安全论证、环境路线图或废弃物处理方案
    - 没有独立反应堆级基准，说明 ENN 距离商业相关性能还有多近
