- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for ENN Fusion
  - Diligence ask
  rows:
  - - AI-era data-center power growth
    - +
    - 2026-2030
    - Expands demand for compact firm power and increases willingness to test new baseload technologies
    - Map Chinese and global hyperscaler clean-power procurement priorities
  - - Industrial electrification and decarbonization
    - +
    - 2026-2035
    - Supports a second buyer segment beyond cloud and utility demand
    - Quantify process-power use cases most compatible with compact fusion siting
  - - Chinese policy prioritization of fusion
    - +
    - 2026-2030
    - Improves talent, funding, and ecosystem support inside China
    - Track standards, permitting, and provincial implementation pathways
  - - Peer fusion PPAs with Google and Microsoft
    - +
    - current signal
    - Shows buyers will sign long-dated agreements for fusion before commercial operation
    - Test whether ENN is pursuing analogous offtake conversations
  - - Power scarcity and utility deposits
    - mixed
    - current
    - Raises buyer urgency but also makes interconnection and project development more complex
    - Request siting strategy for high-load customers and power-delivery architecture
  - - Supply-chain and fuel-cycle bottlenecks
    - '-'
    - persistent
    - Can delay machine buildout and later plant commercialization
    - Request procurement plan for key materials, fuel-cycle assumptions, and vendor readiness
  - - Technology-readiness gap
    - '-'
    - persistent until milestone
    - No public ENN customer can rely on output until EHL-2 and later milestones validate the route
    - Ask for milestone gates between EXL-50U and first commercial pilot
  - - Lack of public pricing and customer data
    - '-'
    - current
    - Prevents any credible willingness-to-pay model for ENN specifically
    - Request pricing framework, target offtake structures, and pipeline status
  - - Regulatory and product-category ambiguity
    - '-'
    - 2026-2035
    - Fusion still lacks a standardized market product and bankable regulatory template in China
    - Assess expected licensing regime for commercial spherical-torus proton-boron facilities
  notes: Timing and direction are author judgments grounded in reviewed 2025-2026 sources. Constraints combine market, technology, capital, and regulatory effects because buyers evaluate all four together.
