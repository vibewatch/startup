- id: buyers-and-adoption
  title: Buyer segmentation and adoption path
  body: 'ENN''s likely early buyers can be segmented by tolerance for technology novelty and urgency of power need. Hyperscale data-center operators are the clearest lead segment because they already sign long-duration clean-power agreements and increasingly care more about power certainty than geographic location. Commonwealth Fusion Systems'' 200 MW Google agreement and Helion''s Microsoft PPA are important because they show that sophisticated buyers will contract for fusion before commercial operation if the strategic narrative is strong enough. Heavy industry is the second segment: electric steel, chemicals, hydrogen, and energy-intensive manufacturing all need clean power that matches production cycles rather than just annual certificates. Utilities and grid operators are the third segment; they are natural scale buyers but usually require longer permitting and evidence cycles. In China''s domestic context, ENN''s parent enterprise-energy footprint offers relationship adjacency to industrial
    clients, but public evidence does not show those customers converting into fusion buyers yet. The adoption path therefore runs from strategic proof customers in peer markets to industrial pilots and only later to broader grid deployment.

    '
