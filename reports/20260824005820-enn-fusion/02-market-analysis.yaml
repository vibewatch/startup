- id: TM001
  title: Market definition table
  columns:
  - Segment / boundary
  - Included spend or use
  - Excluded spend or use
  - Buyer / payer
  - Relevance to ENN Fusion
  rows:
  - - Global electricity TAM
    - All grid electricity demand and revenue
    - Pure equipment spend and fusion R&D budgets
    - Utilities, grid operators, industrials, large corporates
    - Broad ceiling only; too wide for underwriting
  - - Firm carbon-free power SAM
    - Dispatchable low-carbon power with reliability value
    - Intermittent solar and wind sold without firming layer
    - Hyperscalers, industrials, utilities, governments
    - Best-fit segment for ENN's commercialization story
  - - Data-center power sub-segment
    - Large AI and cloud electricity loads requiring power certainty
    - IT hardware spend and non-energy data-center costs
    - Hyperscalers and colocation operators
    - Likely early wedge if ENN can offer compact firm power
  - - Industrial electrification sub-segment
    - High-load manufacturing and process-power demand
    - Thermal-only solutions without electricity demand
    - Steel, chemicals, hydrogen, other power-intensive manufacturers
    - Relevant because ENN's parent already serves enterprise-energy customers
  - - Fusion industry aggregate
    - R&D, pilot construction, equipment, services, financing
    - Mature electricity revenue from operating plant fleets
    - Investors, governments, suppliers
    - Useful for capital context but not the same as power-market SAM
  notes: The chapter draws the primary market boundary around firm, dispatchable, carbon-free electricity rather than around the broader fusion-industry revenue bucket reported by market-research firms.
