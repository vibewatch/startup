companyProfile:
  summary: 'ENN Fusion is the fusion-energy commercialization vehicle created out of ENN Energy Research Institute, the R&D arm of China’s ENN Group. Public sources indicate the company was formally incorporated in 2025 as a Beijing-based subsidiary while operating technical work across the ENN research campus in Langfang, Hebei. Its core thesis is compact proton-boron (p-11B) fusion: an aneutronic pathway that, if made practical, could avoid many neutron-management burdens of deuterium-tritium fusion. The company’s differentiation is real, but so is the difficulty. ENN has invested heavily in fusion R&D inside the parent organization since roughly 2017, built the EXL / EHL experimental lineage, and in July 2026 attracted its first disclosed outside financing at a reported ~$1.6 billion valuation. It remains pre-revenue, with no public named customer, no disclosed commercial plant economics, and no publicly articulated licensing path.

    '
