  productSummary: 'ENN Fusion does not yet sell a commercial product. Its current “product” is a compact-fusion development program built around proton-boron fusion, the EXL / EHL experimental line, and the future promise of aneutronic firm power. The intended commercial outcome is dispatchable, low-carbon electricity for large industrial, infrastructure, or utility-style buyers once physics, engineering, safety, and cost challenges are solved.

    '
  customerFocus: 'Future large-load energy buyers rather than paying customers today: industrial manufacturers, industrial parks, utilities, municipal infrastructure entities, and eventually hyperscale / AI data-center operators if ENN can translate parent energy relationships into fusion pilots. No public named customer or PPA exists yet.

    '
  businessModel: 'Pre-revenue deep-tech. Today the company is financed by parent support and private venture equity. The intended long-term model is selling firm fusion electricity, capacity-style energy services, and potentially project-based plant deployments once commercial viability is demonstrated.

    '
  stage: Pre-A / venture-backed private
  fundingStatus: 'ENN funded fusion R&D internally for years before the subsidiary’s first disclosed outside round. Public reporting says ENN Fusion completed a July 2026 Pre-A / seed financing at a roughly $1.6B post-money valuation. The round size was not disclosed. Reported participants included CAS Star, Matrix Partners China, Loongson Venture Capital, CDH Investments, Cathay Capital, SAIC Hengxu Capital, Legend Star, China Merchants Zhiyuan, and E-Town Capital.

    '
