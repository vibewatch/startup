- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk Category
  - Kill Signal / Trigger
  - Recovery Path
  - Diligence Ask
  rows:
  - - Physics / EHL-2
    - EHL-2 fails to show a credible Q>1 path by 2028-2029 or slips materially past its current schedule
    - Re-scope to longer R&D option value only; stop underwriting near-term valuation expansion
    - Request milestone tree, commissioning plan, and independent technical review
  - - Capital / sponsor concentration
    - ENN Group narrows support or next round depends solely on insiders
    - Demand stronger downside protection or pause investment
    - Request funding commitment letters, runway model, and syndicate plan
  - - People / scientific leadership
    - Dr. Peng departs without a clearly visible successor bench
    - Reset confidence and re-underwrite technical leadership
    - Request contracts, retention terms, and succession design
  - - Regulatory / export controls
    - Collaboration or hardware restrictions materially narrow supplier or advisor options
    - Shift toward domestic-only assumptions and lower upside case
    - Request compliance architecture and restricted-input map
  - - Commercialization / customer proof
    - Still no named pilot host, LOI, or offtake path by next major financing cycle
    - Treat story as science option rather than emerging energy platform
    - Request live pipeline, counterparties, and qualification stages
  notes: The table focuses on monitorable events that should change investment behavior, not on generic long-duration startup worries.
