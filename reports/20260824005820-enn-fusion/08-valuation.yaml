- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Thesis Leg
  - Support
  - Anti-Thesis Leg
  - Challenge
  enumeration: true
  enumerationScope:
    coverage: exhaustive
    basis: All major thesis and anti-thesis legs derived from ENN public disclosures, peer fusion financing evidence, physics literature, and downside commentary relevant as of 2026-08-24.
  rows:
  - - Physics differentiation
    - Aneutronic p-11B plus spherical-torus compactness can create exceptional scarcity value
    - Bremsstrahlung and temperature barriers may block economic net gain
    - No public global proof that ENN's route beats reactor-grade alternatives
  - - Capital and patronage
    - ENN Group sponsorship and a ¥10.6B round create runway and credibility
    - Parent concentration can magnify downside if support narrows
    - Sponsor dependence is still structurally high
  - - China ecosystem advantage
    - Industrial adjacency, talent pool, and policy prestige can accelerate execution
    - Licensing path and IP chain remain under-disclosed
    - Domestic context helps narrative more than proof
  - - Market potential
    - Clean firm power and industrial decarbonization make fusion optionality valuable
    - Commercial cash flows are likely 7-10+ years away
    - Time value and dilution can absorb much of the upside
  - - Team quality
    - Peng, Yuan, Liu, and Wang provide real scientific and institutional weight
    - Key-person concentration is unusually material
    - Successor depth is not yet visible publicly
  - - Relative pricing
    - ENN is cheaper than top-tier global leaders
    - It is not cheap relative to same-stage proof quality
    - Valuation discount may be smaller than the proof discount
  notes: The anti-thesis is not a denial of ENN's scientific ambition; it is a warning that price can outrun proof in frontier fusion.
