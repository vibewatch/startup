- id: scenario-analysis
  title: Bull / Base / Bear Scenario Analysis
  body: 'Scenario analysis is the only honest fit for the public evidence. The bull case assumes ENN converts EHL-2 into a genuine proof step, clarifies the path from experiment to plant, and keeps enough capital and scientific continuity in place to maintain a 2030 ignition narrative. In that world, today''s price can look early because the market will begin capitalizing scarcity value in aneutronic fusion, not just lab progress. The base case is less dramatic: EHL-2 helps, but timelines slip, customer formation lags, and ENN still needs years of technical and legal de-risking before it resembles a commercial energy company.


    The bear case is not a mild downside; it is the modal warning. If bremsstrahlung, confinement, subsystem integration, or schedule slip prevent ENN from proving a credible path to Q>1 or economically relevant performance, the valuation can fall toward strategic-asset value or even near-zero option value. That is why the downside probability must stay high even while the upside remains large. The distribution is wide because fusion optionality is real, but proof is still scarce.'
