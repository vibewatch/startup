company:
  name: ENN Fusion Technology
chapter:
  number: 1
  title: Company Overview
  summary: ENN Fusion Technology (Beijing ENN Fusion Energy Technology Co., Ltd. / 新奥聚变技术有限公司) is China's highest-valued private fusion energy startup, spun out in 2025 from ENN Energy Research Institute, a subsidiary of ENN Group—one of China's largest privately held clean-energy conglomerates founded in 1989 by Wang Yusuo. The company is pursuing hydrogen-boron (proton-boron, p-11B) fusion using a compact spherical torus (ST) architecture whose aneutronic characteristics—producing helium alpha particles rather than neutrons—ENN cites as a long-term safety and cost advantage over mainstream deuterium-tritium (D-T) approaches. ENN Fusion completed its first external financing, a Pre-A round, in July 2026 at a post-money valuation of ¥10.6 billion (~US$1.6 billion), the highest among Chinese private fusion companies, led by Loongson Venture Capital with co-leads CAS Star and Matrix Partners China. The company has approximately 300 staff, has invested more than ¥4 billion in internal R&D since
    2017, and achieved a world-first 1 million-ampere p-11B plasma current in April 2025. Helong-2 (EHL-2), its third-generation device, is under construction with completion targeted for Q4 2027. The roadmap targets plasma ignition ~2030 and a commercial demonstration reactor ~2035. ENN Fusion is entirely pre-revenue; the investment case rests on technology optionality and parent ENN Group's patient-capital capacity.
sections:
- id: section-identity
  title: Identity, Mission, and Corporate Footprint
  body: 'ENN Fusion Technology was formally incorporated in 2025 as Beijing ENN Fusion Energy Technology Co., Ltd., the commercial vehicle for fusion R&D that ENN Group had been funding inside its ENN Energy Research Institute (EERI) since 2017. Corporate filings place the registered address in Tongzhou District, Beijing; the experimental-device facilities are in Langfang, Hebei, where the parent conglomerate''s research campus is located.


    ENN Group (romanized also as Xinao Group) was founded in 1989 by Dr. Wang Yusuo in Langfang, Hebei, beginning as a city-gas distributor before expanding into the full natural-gas value chain and broader clean energy. By 2025 the group''s consolidated revenues exceeded ¥150 billion (~US$21 billion), it employed more than 40,000 people, and its city-gas subsidiary ENN Energy Holdings (2688.HK) served 32.8 million households and 316,000 commercial clients across 22 Chinese provinces. Other listed entities include ENN Natural Gas (600803.SH) and ENC Digital Technology (603869.SH). ENN Fusion is wholly owned by EERI, which is in turn controlled by ENN Group; no minority equity holders at the EERI or ENN Fusion levels have been disclosed publicly prior to the Pre-A round.


    The company''s mission is to be the first entity globally to achieve commercial proton-boron fusion power. The p-11B reaction produces three alpha particles (helium nuclei) per fusion event rather than the fast neutron and helium nucleus produced by D-T fusion. Theoretically this means no radioactive material activation, no tritium breeding, and no neutron-induced damage to reactor structures—advantages ENN emphasizes will drive far lower lifetime costs and superior safety profiles relative to D-T plants. The scientific viability of p-11B net energy gain remains the central diligence question (addressed in the Risks chapter).'
