- id: section-team
  title: Founding Team and Scientific Leadership
  body: 'Wang Yusuo, founder and chairman of ENN Group, is the strategic founder and primary capital sponsor. A clean-energy billionaire, he has committed ENN resources to fusion since ~2017 and serves as the long-term patient-capital anchor. He does not hold a formal plasma-physics role.


    Dr. Minsheng Liu is President of EERI and Director of the Fusion Technology R&D Center. He holds a Tsinghua University PhD in chemical engineering and has led ENN''s broadened R&D agenda including bioenergy and fusion. He bridges the parent conglomerate''s governance structures and the fusion program''s operating needs.


    Dr. Y.K. (Martin) Peng is Chief Scientist—the intellectual core of the program. A Stanford PhD physicist, Dr. Peng invented the spherical tokamak (ST) concept in the 1980s and was a co-founder and principal investigator of the National Spherical Torus Experiment (NSTX) at the Princeton Plasma Physics Laboratory (PPPL). His recruitment from the US national-laboratory system to ENN was widely noted in the global fusion community as a signal of ENN''s seriousness.


    Baoshan Yuan serves as Chief Engineer. He previously held the position of deputy director at the Southwestern Institute of Physics (SWIP) in Chengdu, operator of China''s HL-2A tokamak, the primary state fusion device in southwest China. His engineering background bridges government-program experience with the commercial-scale demands of a private company.


    Additional senior researchers include Prof. Kaiming Feng (reactor theory), Dr. Hua-sheng Xie (plasma theory and simulation), Dr. Bihe Deng (diagnostics), and Dr. Bing Liu (experimental physics). The team has published more than a dozen peer-reviewed papers in Nuclear Fusion (IOP) and Physics of Plasmas (AIP) on EXL-50/50U results in 2024–2026. Total staff was reported at approximately 300 in mid-2026 per Yicai Global.'
