  evidenceGaps:
  - type: private-evidence-only
    severity: minor
    topic: headcount-breakdown
    missingEvidence: Public sources give only an approximate total headcount (~300) and do not break staffing by physics, engineering, operations, or corporate functions.
    whyItMatters: Functional staffing mix is needed to judge whether ENN is over-indexed on science relative to productization and program execution.
    diligencePath: Request an org chart and functional headcount split, plus hiring plan through EHL-2 completion.
    relatedQuestionRefs:
    - QO012
    relatedTableRefs:
    - TO001
    - TO002
  - type: private-evidence-only
    severity: material
    topic: channel-activation
    missingEvidence: ENN has not disclosed whether its parent utility and integrated-energy customer base is being actively converted into pilot, offtake, or site-development discussions for fusion.
    whyItMatters: Parent distribution reach is strategically valuable only if it becomes real commercial access rather than a theoretical adjacency.
    diligencePath: Request named pilot prospects, internal channel plan with ENN Energy, and any municipal or industrial engagement pipeline.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: round-size-and-financials
    missingEvidence: Exact capital raised in the Pre-A round; investor rights agreements; cash runway and burn rate projections; financial commitments from ENN Group for phases beyond EHL-2.
    whyItMatters: Without knowing the round size, it is impossible to evaluate whether raised capital is sufficient to fund EHL-2 construction (likely requiring hundreds of millions of dollars) or whether a bridge will be required before the next device phase.
    diligencePath: Request investor-disclosed term sheet, pro-forma cap table, and EHL-2 construction budget and timeline from the company and lead investor.
    relatedQuestionRefs:
    - QO006
    - QO026
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: governance-and-board
    missingEvidence: Board composition, investor representation on board, founder vesting terms, and whether the entity has a VIE structure or CSRC-registrable equity vehicle accessible to international investors.
    whyItMatters: For non-Chinese investors, corporate structure determines exit optionality. A pure domestic company without VIE has no clear path to international secondary or IPO, and the ITPEA membership (science partnership) does not resolve equity-access constraints.
    diligencePath: Request SAIC business registration, articles of association, investor rights agreement from lead investor Loongson VC, and legal memo on exit pathways.
    relatedQuestionRefs:
    - QO011
    - QO023
    relatedTableRefs:
    - TO002
    - TO003
  - type: missing-source
    severity: material
    topic: helong-2-engineering-status
    missingEvidence: Current engineering progress on Helong-2 (EHL-2) — build status, cost estimate, technical specifications, construction timeline, and risk log.
    whyItMatters: EHL-2 is the central capital deployment target of the Pre-A round and the critical next physics gate. Its engineering risk profile and timeline credibility are central to the investment case for all subsequent milestones.
    diligencePath: Request construction contract, design documentation, engineering milestone report, and an independent device review from a credentialed external plasma physics organization.
    relatedQuestionRefs:
    - QO016
    relatedTableRefs:
