- id: current-adoption-proof
  title: Current adoption trajectory and proof quality
  body: 'The direct adoption trajectory at ENN Fusion is simple: there is still no public customer deployment. No named pilot, PPA, LOI, or plant host has been announced. That absence is the core commercial fact of this chapter. What does exist is indirect and category-level proof. At the parent level, ENN Energy reports large enterprise reach and more than 6,000 integrated-energy customers, along with hundreds of operating projects. At the broader fusion-category level, Microsoft signed with Helion, Google signed with CFS, and Eni also signed for CFS output. Those deals do not prove ENN adoption, but they do prove that sophisticated buyers are willing to underwrite fusion optionality years before delivery.


    The right interpretation is therefore asymmetric. ENN has no direct customer proof, which weakens any near-term commercial confidence score. But the category no longer suffers from zero buyer willingness: global anchor customers have started placing early bets, especially where AI and industrial decarbonization create pressure for clean firm power. If ENN can translate its parent network and China industrial presence into even one credible pilot or anchor offtake, the proof gap could narrow quickly.

    '
