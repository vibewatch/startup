- id: retention-durability-and-switching-costs
  title: Retention durability, satisfaction, and switching costs
  body: 'There is no public ENN Fusion retention data because there is no disclosed customer cohort yet. No NRR, GRR, churn, contract duration, satisfaction metric, or repeat-purchase evidence exists. That means any retention discussion must be framed as a proxy. The useful proxy is structural: if a future fusion plant is deployed into a customer''s physical energy system, switching costs should become high because replacement would involve infrastructure, permitting, engineering redesign, and business-continuity risk. This logic is consistent with the long-lived nature of energy infrastructure and with ENN Energy''s broader integrated-energy delivery model.


    Still, structural logic is not evidence. Parent integrated-energy projects may have durable relationships, but the public record does not tell us their renewal behavior or profitability. Likewise, Microsoft''s and Google''s category-leading fusion agreements show willingness to commit early, not proof of renewal outcomes. For ENN specifically, durability remains unproven until the company discloses at least one pilot or contract with milestones, term length, and counterparty commitment.

    '
  claimRefs:
  - CU018
  - CU019
  - CU020
  - CU021
