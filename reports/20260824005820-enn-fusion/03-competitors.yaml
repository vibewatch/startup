company:
  name: ENN Fusion Technology
chapter:
  number: 3
  title: Competitors
  summary: ENN Fusion competes in a crowded but highly stratified field where capital, customer proof, and fuel-route difficulty matter as much as raw plasma ambition. Commonwealth Fusion Systems and Helion lead on commercial proof and financing depth; Proxima leads the European stellarator push; and TAE is the closest conceptual peer because it also targets aneutronic hydrogen-boron outcomes, though through a field-reversed-configuration route rather than ENN's spherical torus. ENN's current edge is a differentiated China-based ST proton-boron program backed by a large parent and serious team depth; its biggest competitive weakness is that peers already own the most visible customer and offtake reference points.
sections:
- id: direct-fusion-peer-set
  title: Direct fusion peer landscape
  body: 'The practical peer set for ENN is smaller than the total number of private fusion companies. The relevant direct competitors are the firms that either compete for the same future firm-power buyers or prove alternative technical routes to the same market. Commonwealth Fusion Systems (CFS) is the best-funded private fusion company and the clearest commercial-scale tokamak competitor. Helion is the most commercially visible FRC competitor because of its Microsoft contract and $15.5 billion valuation. TAE is the nearest fuel-route cousin because it also frames hydrogen-boron fusion as a cleaner long-run destination, although its machine design is a beam-driven FRC rather than a spherical torus. Proxima Fusion represents the strongest European stellarator entrant. Pacific Fusion and Focused Energy matter as well because they show how quickly fresh capital can back radically different inertial or pulsed approaches. ENN therefore operates in a field where no single architecture has won,
    but where visible buyer proof and funding depth already create a tiering of perceived credibility.

    '
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  - CP005
  - CP006
  - CP007
  - CP008
  tableRefs:
  - TP001
