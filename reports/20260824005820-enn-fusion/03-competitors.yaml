  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ENN-customer-proof-gap
    missingEvidence: ENN discloses no named fusion customer, buyer pipeline, or contract form to compare directly against Helion and CFS.
    whyItMatters: Customer proof is the most obvious current gap in ENN's public competitive position.
    diligencePath: Request any LOIs, PPA discussions, industrial pilot MOU list, and internal commercial roadmap.
    relatedQuestionRefs:
    - QP014
    - QP018
    - QP025
    relatedTableRefs:
    - TP003
    - TP004
  - type: private-evidence-only
    severity: material
    topic: supplier-map
    missingEvidence: Public sources do not show ENN's supplier concentration, proprietary manufacturing depth, or exclusivity arrangements.
    whyItMatters: Supplier access and industrial execution are key moat variables in a capital-intensive fusion race.
    diligencePath: Request supplier map, key-component sourcing strategy, and vendor lock-in assessment.
    relatedQuestionRefs:
