- id: enn-relative-positioning
  title: ENN's relative positioning on route, customer proof, and geography
  body: 'ENN''s competitive identity is unusual because it combines two comparison sets that usually sit apart. On machine geometry, it is closest to spherical-tokamak programs such as Tokamak Energy and to compact-magnet programs that aim for smaller plant footprints. On fuel ambition, it sits nearer to TAE and HB11 Energy because it wants a proton-boron outcome rather than the more common deuterium-tritium route. That combination is strategically attractive if it works: a compact machine, aneutronic narrative, and China-based supply and talent ecosystem. But the same combination also means ENN cannot borrow commercial proof from other categories. Helion and CFS already own the most visible customer validation through Microsoft and Google, while Proxima has captured the European stellarator funding narrative. ENN''s public data therefore support a differentiated technical story but not yet a differentiated commercial one. Its strongest comparative advantages are parent sponsorship, a public
    team with tokamak and diagnostics depth, and a Chinese ecosystem position that global peers cannot easily replicate.

    '
  claimRefs:
  - CP009
  - CP010
  - CP011
  - CP012
  - CP013
  - CP014
  - CP015
  - CP016
  - CP017
