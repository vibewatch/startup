- id: switching-costs-and-moats
  title: Switching costs, distribution power, and moat durability
  body: 'Fusion''s switching costs are still largely pre-commercial, so moat analysis depends less on installed base lock-in and more on who captures scarce external validators first. Customer-side switching cost today is mostly reputational and contractual: once a hyperscaler or industrial anchor allocates engineering time, transmission planning, or public commitment to one fusion vendor, that commitment becomes a real advantage. Helion and CFS already benefit from that effect. ENN does not. Supply-side switching cost is more subtle. Fusion programs rely on rare combinations of diagnostics, power electronics, controls, materials, and specialized physics talent. ENN''s parent platform and Langfang research base likely help on domestic hiring and infrastructure, but the public record does not show the kind of supplier or customer lock-in that would make ENN structurally hard to displace. The moat case is therefore moderate rather than strong: if ENN reaches credible EHL-2 milestones, its
    China position and proton-boron niche could become distinctive; if it slips while peers keep landing customers or capital, differentiation could compress quickly.

    '
  claimRefs:
  - CP018
  - CP019
  - CP020
  - CP021
  - CP022
  - CP023
  - CP024
  - CP025
  tableRefs:
  - TP004
