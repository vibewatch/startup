    - QP020
  - type: conflicting-data
    severity: minor
    topic: sector-tiering
    missingEvidence: Public peer funding and milestone disclosures are not perfectly comparable across companies and often mix company claims with third-party estimates.
    whyItMatters: Competitive ranking can shift quickly when private companies disclose selective data.
    diligencePath: Rebuild the competitive scorecard from consistent metrics at each refresh.
