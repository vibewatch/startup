      - number: '7.3'
        title: 合作伙伴、依赖与资本风险
        blocks:
          - type: paragraph
            body: >-
              按今天的估值，ENN 更像一张依赖外部条件兑现的期权，而不是已经能自我循环的平台。2026 年 7 月这一轮融资证明，严肃资本愿意入场，ENN Group
              也能托起一项大规模前沿科学计划；但它还不能证明，公司离开母公司持续支持后也能融到后续资金。聚变融资仍然高度看里程碑，ENN
              也还没有公开客户证明、试点业主或承购协议，能把投资逻辑从科学期权扩展出去。因此，出资方广度、后续联合投资人质量和母公司承诺，比账面投后估值更关键。


              依赖图谱也不止资金。ENN 还依赖特殊材料和硬件，依赖 ITPEA 参与等政策与声誉生态，也依赖日后把 ENN Energy
              的邻近资源转成真正的试点或交易对手。每个依赖项都能撑起今天的故事，也都可能非对称地失效：供应商流失会拉长进度，政策气候转弱会压低投资人胃口，没有具名试点则意味着下一轮融资仍靠叙事，而不是收入。因此，对 ENN
              Group、投资人、交易对手和生态入口的依赖，必须作为核心风险打分，不能只当脚注。
