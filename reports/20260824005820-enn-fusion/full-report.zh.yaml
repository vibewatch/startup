      - number: '4.4'
        title: 资本充足性、现金跑道与融资依赖
        blocks:
          - type: paragraph
            body: >
              ENN 的融资位置必须同时透过子公司和母公司两层看。子公司层面的披露信号，是 2026 年 7 月首轮外部融资，投后估值约 CNY10.6 billion，据报道用于 Helong-2
              建设和调试。这是有力的信任票，但不是 ENN
              资本足以达到商业就绪的证据。确切融资规模、当前现金余额、月度烧钱速度、招聘计划和装置预算仍未披露。考虑到行业资本密集度，以及知名度高得多的同行仍在继续筹集大额融资，应假设 ENN
              在任何可融资的聚变电站出现前都需要反复融资。


              母公司层面，ENN 拥有的平台远比典型种子期硬件初创厚实。ENN Energy
              的年报材料和业务画像显示，它是一家有规模的上市企业，拥有数百万客户、大量项目基础和一体化能源战略。这不意味着母公司会无限期资助聚变，但会显著提升 ENN
              面向投资者、供应商和地方利益相关方的可信度。实际结论是：ENN 的近期偿付风险大概率低于同技术阶段的独立初创；但长期项目融资风险仍很高，因为公开证据尚未支持对质子-硼电站进行债务式投资测算。
