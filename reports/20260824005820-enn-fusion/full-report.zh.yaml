  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 路线选择与设计基础
        blocks:
          - type: paragraph
            body: >
              ENN 的产品技术投资逻辑，始于一个非主流但自洽的设计选择：球形环质子-硼聚变（STPBF）。ENN 官方材料认为质子-硼具吸引力，因为燃料丰富、中子辐射最小，并可能支持直接能量转换。这个叙事与更广泛的
              p-11B 文献大体一致；后者也强调更低中子负担和有吸引力的副产物。但同一批文献也说明这条路线为什么仍然困难：更高的库仑势垒、苛刻的温度窗口，以及如果等离子体条件管理不好，可能出现严重轫致辐射损失约束。


              ENN 选择球形环，而不是常规大型托卡马克或 FRC，对商业和技术都很关键。球形环承诺紧凑性和强约束潜力；如果物理规律能放大，这可以支撑分布式或模块化商业叙事。它也让 ENN 相比 Helion 的
              FRC、CFS 的紧凑托卡马克和 Proxima 的仿星器走出差异化赛道。因此，设计基础具备战略合理性：ENN 不是在和美国托卡马克或 FRC 同行跑完全相同的比赛。但这也意味着 ENN
              同时背负两重证明负担——质子-硼燃料路线，以及让这条路线可行的特定机器几何形态 / 放大路径。
            claimRefs:
