chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与公司版图
        blocks:
          - type: paragraph
            body: >-
              ENN Fusion Technology 于 2025 年正式注册为 Beijing ENN Fusion Energy Technology Co., Ltd.，是 ENN Group 自 2017 年起在其
              ENN Energy Research Institute（EERI）内部资助的聚变研发商业化载体。工商文件显示，注册地址位于北京通州区；实验装置设施则在河北廊坊，即母集团研究园区所在地。


              ENN Group（也按拼音写作 Xinao Group）由 Dr. Wang Yusuo 于 1989 年在河北廊坊创办，最初是城市燃气分销商，之后扩展到完整天然气价值链和更广义的清洁能源。到 2025
              年，集团合并收入超过 ¥150 billion（约 US$21 billion），员工超过 40,000 人，其城市燃气子公司 ENN Energy Holdings（2688.HK）服务中国 22 个省份的
              32.8 million 户家庭和 316,000 个商业客户。其他上市主体包括 ENN Natural Gas（600803.SH）和 ENC Digital Technology（603869.SH）。ENN
              Fusion 由 EERI 全资持有，EERI 则由 ENN Group 控制；在 Pre-A 轮之前，EERI 或 ENN Fusion 层面没有公开披露少数股东。


              公司的使命是成为全球首个实现商业化质子-硼聚变发电的实体。p-11B 反应每次聚变产生三个 alpha 粒子（氦核），而不是 D-T
              聚变产生的快中子和氦核。理论上，这意味着没有放射性材料活化、无需氚增殖，也不会对反应堆结构造成中子诱导损伤——ENN 强调，这些优势会让全生命周期成本远低于 D-T 电站，安全性也更好。p-11B
              净能量增益的科学可行性，仍是本次尽调的核心问题（见风险章节）。
            claimRefs:
