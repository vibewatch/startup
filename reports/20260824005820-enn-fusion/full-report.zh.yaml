      - number: '5.4'
        title: 瓶颈、验证、IP 姿态与技术结论
        blocks:
          - type: paragraph
            body: >
              对 ENN 的核心技术判断需要细分。正面看，ENN
              有自洽路线、公开机器规格、具名技术领导层、接近同行评审或预印本的披露，以及具体的下一代装置设计。很少有私营聚变项目披露到这个程度。反面看，独立技术文献仍警示：只有当轫致辐射损失、约束阈值、alpha
              处理和部件耐久性能够同时管住时，质子-硼聚变才有吸引力。FIA 供应链证据又加了一层风险：即便等离子体路线成立，热管理、电力系统、材料和燃料系统工业化仍是瓶颈。


              ENN 的验证姿态强于黑箱初创，但弱于完全同行评审的公共实验室项目。ITPEA 参与和 PST 发表材料包有所帮助，但公司仍控制了大部分对反应堆级判断真正重要的信息。因此，恰当的技术结论是“可信但早期”。ENN
              已经展示出足够内容，值得继续尽调并给予技术尊重；但还不足以断定 ST 质子-硼已经从优雅科学跨入可融资的产品工程。
