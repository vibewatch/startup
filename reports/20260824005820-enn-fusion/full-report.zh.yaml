      - number: '6.2'
        title: 当前采用轨迹与验证质量
        blocks:
          - type: paragraph
            body: >
              ENN Fusion 的直接采用轨迹很简单：公开资料里仍没有客户部署。公司没有宣布具名试点、PPA、LOI 或电站东道主。这种缺席，是本章最核心的商业事实。现有内容是间接的、品类层面的验证。母公司层面，ENN
              Energy 报告称拥有庞大企业触达，以及 6,000 多个一体化能源客户和数百个运营项目。更广泛的聚变品类层面，Microsoft 与 Helion 签约，Google 与 CFS 签约，Eni 也签约购买
              CFS 输出。这些交易不能证明 ENN 会被采用，但确实证明成熟买家愿意在交付前多年为聚变期权买单。


              因此，正确解读是不对称的。ENN 没有直接客户验证，这会削弱任何近期商业信心评分。但这一品类已经不再是买家意愿为零：全球锚定客户已经开始早期下注，尤其是在 AI 和工业脱碳为清洁稳定电力制造压力的地方。如果
              ENN 能把母公司网络和中国工业存在转化为哪怕一个可信试点或锚定售电方，验证缺口可能迅速收窄。
