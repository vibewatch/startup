      - number: '7.4'
        title: 团队、执行与终止标准
        blocks:
          - type: paragraph
            body: >-
              团队风险在这里格外重要，因为 ENN 想把研究属性很重的聚变研究院，转成资本效率更高的商业化项目。公开团队页说明 ENN
              确实有具名的强科学家和工程师，但也显示可见领导层集中在少数人身上，商业化班底深度并不透明。即使公司还没到证明第一台商业机器的阶段，接班、系统工程、质量管理和治理厚度已经很关键。如果 Dr. Y.K. Martin
              Peng 或其他具名核心人物在 EHL-2 证明可信的下一步路径前离开，投资人信心很可能立刻重置。


              正确做法是预先设定明确的终止标准。投资人应要求 ENN 拿出 EHL-2 进度表和物理指标看板、母公司资金承诺、IP 归属图，以及客户形成正从邻近资源推进到具名交易对手的证据。如果 EHL-2
              错过下一道重大关口，ENN Group 收窄支持，Peng 离开且看不到接班人，或许可和网络安全控制仍不透明，估值逻辑就应重新承销，而不是靠希望顺延。项目周期这么长，纪律性的止损规则和上行想象一样重要。
