      - number: '4.5'
        title: 公开财务缺口与结论
        blocks:
          - type: paragraph
            body: >
              财务尽调的主要卡点，不是 ENN 的数字看起来弱，而是大多数数字没有以可承销、可测算的形式公开存在。投资者不知道 ENN Fusion 手头现金、烧钱速度、EHL-2
              资本开支预算、最新融资隐含现金跑道、客户管线、补助流入、定价逻辑或首座电站经济性。即使是吸引眼球的估值，也更适合被理解为战略可选性的定价，而不是经济性已降险的证据。本章引用的科学文献和 MIT
              经济框架强化了谨慎观点：聚变不仅需要等离子体成功，还需要经济 Q 大于一，而这取决于资本效率、电站耐久性和市场收入。


              从财务角度看，ENN
              应被视为一家高期权性、高资本强度、且有异常强母公司支持的公司。这个组合足以支撑继续尽调，但不足以带来传统成长股权投资的舒适感。前瞻投资测算问题很窄，也很具体：到底融了多少钱、能撑多久、多少比例已经锁定给
              EHL-2、客户开发正在做什么，以及母公司或战略投资人在什么条件下会提供下一笔资金？在这些答案出现前，ENN 的财务故事作为叙事可信，作为模型仍偏投机。
