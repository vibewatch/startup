  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 核心估值观点
        blocks:
          - type: paragraph
            body: >-
              理解 ENN Fusion 当前价格，最干净的方式是把它看作一张押注里程碑兑现的长期期权。2026 年 7 月 Pre-A 轮据报道将公司投后估值定在约 ¥10.6B，约合
              $1.6B。用当下经营数据无法支撑这个价格：ENN
              没有披露收入、没有具名客户，也没有公开的电站经济性包。但这轮融资也不能简单斥为纯炒作；联合投资人、母公司背书和真实机器路线图都在说明，成熟资本愿意为一种可能性付费：ENN 可能成为少数严肃的 p-11B
              聚变竞争者之一。


              因此，ENN 的定价对应的是科学和战略期权，不是已经用现金流承销的能源公司。如果 EHL-2 把路线图话术转成可信证明，且 ENN 展示更清楚的许可、IP
              和客户形成路径，今天的价格只会显得早；如果证明停滞，同样的估值会快速压缩，因为底下几乎没有收入或客户保护。当前估值可以理解，但相对公开证据仍偏高。
