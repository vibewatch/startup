coverageNotes: >
  ENN Fusion 是一家尚未产生收入的私营聚变公司，公开披露明显少于许多西方同行。公开证据有力支持几件事：公司是 ENN Energy Research Institute 于 2025 年设立的子公司，技术方向指向质子-硼 /
  紧凑型聚变，并在 2026 年 7 月完成外部融资，据报道估值约 $1.6 billion。公开证据并未披露 ENN Fusion 的独立财报、烧钱速度、股权结构表、融资条款、具名客户、电站经济性或商业授权路径。母公司 ENN
  体系披露了可观规模和资源，但母公司指标不能替代子公司的基本面。因此，本报告所有估值判断都是基于情景的期权价值判断，而不是基于盈利的投资测算。
