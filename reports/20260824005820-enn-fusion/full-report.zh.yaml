      - number: '4.2'
        title: 定价模式、GTM 动作与销售效率代理
        blocks:
          - type: paragraph
            body: >
              ENN Fusion 没有披露目录价、实际成交价或任何商业合同条款。这对商业化前聚变公司很正常，但也意味着定价讨论必须按“缺失”来框定，而不是当作证据来分析。未来 GTM
              动作最可能是直接面向企业和公用事业式销售，而不是渠道分销。ENN Energy 现有一体化能源业务，显示它有可信的企业路径触达大型工业买家、能源园区和地方政府；不过，公开资料没有证明这些渠道已专门为聚变启动。


              因此，销售效率无法用常规方式量化。没有 CAC、回本周期、转化漏斗或管线披露。唯一有意义的代理，是超大规模云厂商和战略工业客户已经通过 Helion 和 CFS
              协议验证了这个品类，而中国的政策蓝图和产业资本兴趣表明，只要 ENN 达到技术可信度，国内买家需求可能存在。但因为 ENN 还没有具名客户，任何 GTM 模型都仍是推测。恰当的尽调立场是：ENN
              可能受益于母公司的买家网络，但当前公开证据只支持渠道邻近性，不支持一个正在运转的聚变销售引擎。
