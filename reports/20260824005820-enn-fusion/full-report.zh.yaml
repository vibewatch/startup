      - number: '1.2'
        title: 融资历史、估值与投资方
        blocks:
          - type: paragraph
            body: >-
              进入 2026 年时，ENN Fusion 的资产负债表上还没有外部股权。从 2017 年到 2025 年，ENN Group 通过 EERI 向聚变研发投入超过 ¥4 billion（约 US$590
              million）——按外部资本进入前的累计投入看，这一内部投入水平可使 ENN Group 被视为全球最大的私营单一实体聚变投资者之一。


              2026 年 7 月，公司完成首轮外部融资 Pre-A，投后估值为 ¥10.6 billion（约 US$1.6 billion）。总融资额未披露。Loongson Venture Capital（Longxin
              Private Equity Venture Capital Fund Management）领投，CAS Star（Chinese Academy of Sciences 商业化平台）和 Matrix
              Partners China 共同领投。参投方包括 CDH Investments、Cathay Capital、SAIC Hengxu Capital（SAIC Motor Group
              旗下创投平台）、Legend Star、China Merchants Zhiyuan 和 E-Town Capital（北京政府相关）。这批投资者横跨国资相关实体（CAS Star、E-Town
              Capital）、产业战略方（SAIC Hengxu）和主流科技 VC（Matrix Partners China、CDH、Cathay）。


              已披露资金用途：Helong-2（EHL-2）建设和调试、技术能力升级，以及高级研发团队扩充。公司没有发布收入指引。迄今也没有披露老股交易或债务融资。
