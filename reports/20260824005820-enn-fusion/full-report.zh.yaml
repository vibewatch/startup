  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 买家分层、用户与付款方
        blocks:
          - type: paragraph
            body: >
              ENN Fusion
              不是在做消费产品。它可能面向的买家是企业和电网侧主体：寻找清洁稳定电力的超大规模云厂商和大型数据中心运营商、有超大连续用电或用热需求的工业公司、试图锚定未来能源基础设施的地方政府或产业园，以及能够签长期发电合同的公用事业类实体。可能用户是运营团队、电力规划人员和能源经理；可能付款方则是企业采购、基础设施、公用事业或市政预算负责人。


              最强的公开商业邻近性不在 ENN Fusion 自身，而在 ENN Energy。ENN Energy
              官方材料显示，它拥有庞大的企业和家庭覆盖面，以及围绕定制化能源-碳解决方案搭建的一体化能源业务。这很重要，因为这意味着 ENN
              不必从零发明一个中国企业能源分销网络。但把母公司的客户基础视为自动聚变需求，会是错误判断。城市燃气或一体化能源关系可以打开门，但首个同类聚变合同仍会面对漫长尽调周期、选址问题和极端技术风险。
