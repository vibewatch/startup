      - number: '5.3'
        title: 路线图、放大逻辑与平台化
        blocks:
          - type: paragraph
            body: >
              EHL-2 是 ENN 当前科学项目和任何未来产品之间的关键桥梁。ENN 自身描述给出了具体目标参数：约 1.05 m 主半径、3 T 中心场、3 MA 等离子体电流、17 MW NBI 加热和 6 MW
              ECRH。其声明使命还不是卖电，而是解决 ST 质子-硼聚变的核心科学和技术挑战，验证可行性，并为后续更大平台打基础。对一个严肃聚变项目而言，这一排序正确：EHL-2
              被定位为高价值验证平台，而不是过度营销的商业反应堆。


              路线图也受益于中国更广泛的聚变生态。CAS 和 SCIO 材料显示，中国国家层面的环境正在推进托卡马克科学、密度极限工作和商业化雄心。因此，ENN
              可以借力一个比“子公司”身份本身更强的国内聚变体系。尽管如此，路线图可信度仍取决于执行节奏。EHL-2 在 2027
              年中完成建设的目标很激进，任何滑坡都会传导到每一条商业时间表。作为研究计划，路线图可信；但产品化至少还隔着 EHL-2 之后的一个主要平台。
