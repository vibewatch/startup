      - number: '2.2'
        title: 规模测算视角与受证据约束的 SAM 逻辑
        blocks:
          - type: paragraph
            body: >
              聚变的公开 TAM/SAM/SOM 测算必须克制，因为很多已发布数字根本不是电力市场数字。测算 ENN 机会的最保守方法，是从已经观察到的增长驱动因素入手。EIA
              表示，美国用电量在长期持平后重回增长，并明确指出数据中心服务器能耗是主要因素。JLL 预计，全球数据中心行业将在 2026 至 2030 年间新增约 97 GW，并可能需要高达 $3 trillion
              的资本来支撑近 100 GW 新增容量。Colliers 还指出，电力稀缺、公用事业保证金和基础设施级执行能力，已成为决定数据中心估值和吸纳的核心因素。这些都不是 ENN
              的直接收入数字，但说明买家为什么在寻找清洁稳定电力。同样的研究逻辑也延伸到工业电气化和资源充足性。公开证据下，ENN 自身 SOM 事实上仍为零，因为公司没有披露售电协议或试点买家。最接近的可信 SOM
              代理，是同行 PPA 和中国政府支持把聚变从科学推进到工程的政策方向。
