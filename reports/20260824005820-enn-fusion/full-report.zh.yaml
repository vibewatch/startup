  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              ENN Fusion 的法律挑战，不是监管机构已经拒绝商业聚变；而是 ENN
              尚未公开展示一条中国特定路径，说明如何从实验机器走向获得许可、可融资的电站。其紧凑型聚变页面描述了装置、里程碑和路线图意图，但没有披露电站级审批地图，覆盖辐射安全、环境评估、废物表征、应急规划，或未来商业机器所需的文件链。随着美国和国际聚变讨论越来越明确开发者在商业化前必须记录什么，这个缺口更加重要。公司可以在物理上取得进展，却仍可能因为法律准备落后于机器路线图而损失多年。


              地缘政治会放大这种不确定性。ENN 是一家中国开发者，却希望在出口管制、受限方筛查和稀土管制都在收紧的时期获得专门硬件、软件和国际专业能力。这些规则不会让 ENN 失去可行性，但会把供应商尽调、IP
              归属和协作治理变成核心投资测算问题。公开记录也没有充分记录从 EERI 到 ENN 的 IP 链条，因此投资者应把所有权、授权和跨境协作条款列为第一轮尽调问题，而不是后台细节。
