      - number: '3.4'
        title: 替代品、反向竞争证据与潜在进入者
        blocks:
          - type: paragraph
            body: >
              ENN 面临的竞争威胁不只是其他聚变初创。先进裂变、天然气支撑的稳定电力，以及围绕供电确定性搭建的能源基础设施策略，都可能在 ENN
              达到产品就绪前抢走同一批采购预算。即使在聚变内部，反向证据也很重要。TechCrunch 2026 年 4 月报道指出，市场越来越担心部分聚变公司把资本形成跑在证据之前。FIA
              供应链数据说明，整个行业仍缺乏长期可见性，关键工业瓶颈还没有解决。这些警示同样适用于 ENN，尤其因为它的路线在物理上比主流 D-T
              项目更难。潜在进入者会持续出现，因为买家关心的是清洁稳定电力，而不是对某一机器类别的品牌忠诚。这意味着 ENN 必须把早期客户验证和生态杠杆视为战略优先级，不能假设技术新颖性本身就会创造持久护城河。
