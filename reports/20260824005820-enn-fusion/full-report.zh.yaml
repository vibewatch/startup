      - number: '3.3'
        title: 切换成本、分发能力与护城河耐久度
        blocks:
          - type: paragraph
            body: >
              聚变的切换成本仍大多处于商业化前阶段，因此护城河分析更少取决于已安装基数锁定，更多取决于谁先拿下稀缺外部验证者。客户侧切换成本今天主要是声誉和合同成本：一旦超大规模云厂商或工业锚定客户把工程时间、输电规划或公开承诺押给某一家聚变供应商，这种承诺就会变成真实优势。Helion
              和 CFS 已经受益于这一效应，ENN 尚未受益。供给侧切换成本更微妙。聚变项目依赖诊断、电力电子、控制、材料和专门物理人才的稀缺组合。ENN
              的母公司平台和廊坊研究基地，可能有助于国内招聘和基础设施，但公开记录没有显示足以让 ENN 在结构上难以被替代的供应商或客户锁定。因此，护城河判断是中等而非强：如果 ENN 达到可信的 EHL-2
              里程碑，其中国位置和质子-硼细分路线可能变得鲜明；如果它延误，而同行继续拿客户或资本，差异化可能迅速被压缩。
