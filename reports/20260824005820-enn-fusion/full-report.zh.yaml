      - number: '5.2'
        title: 当前装置状态与里程碑质量
        blocks:
          - type: paragraph
            body: >
              ENN 目前的实验平台是 EXL-50U，即 EXL-50 的升级后继。官方页面称，EXL-50U 于 2024 年 1 月实现首次等离子体，随后在 2025 年 4 月达到 1
              兆安培氢-硼等离子体电流里程碑，磁场性能为 1.2 tesla，并称已满足工程目标。这些披露有意义，因为它们给出了机器参数，而不只是营销语言。ENN 加入 ITPEA，以及发布大型 EHL-2
              论文包，也显示它与更广泛的聚变社区有一定外部连接，从而增强可信度。


              不过，里程碑质量必须谨慎解读。1 MA p-B11 等离子体里程碑很重要，但不等同于证明发电条件或商业相关能量平衡。公开来源没有显示电站级输出、净电力或经过验证的成本路径。正确解读是，ENN
              已经越过概念阶段叙事，进入真实造机和物理产出的阶段，但它仍处于实验状态，而不是产品状态。
