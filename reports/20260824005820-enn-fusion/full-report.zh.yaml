      - number: '6.4'
        title: 扩张路径、集中度与商业结论
        blocks:
          - type: paragraph
            body: >
              ENN
              的扩张逻辑直观：利用母公司关系，从大型高耗能或具政治战略意义的买家起步，证明一次部署，再靠标杆价值扩张。但集中度风险同样直观。第一个真实客户很可能主导商业叙事，并可能主导最初几年收入，因为聚变部署会是定制化且资本密集的。一次试点失败或交付日期滑坡，可能同时伤害融资和客户开发。


              商业结论是：ENN 的客户故事在理论上可信，直接证据薄弱。公司受益于母公司的海量企业触达和一体化能源运营，也受益于这样一个市场：超大规模云厂商和工业客户已经表态愿意与同行签早期聚变协议。但这些都不能替代 ENN
              自身证据。在 ENN 披露具名试点、客户板块转化数据，甚至非约束性锚定合作之前，客户案例应被评为渠道邻近，而非客户验证。
