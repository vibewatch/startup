      - number: '4.3'
        title: 成本结构、毛利率驱动与单位经济性
        blocks:
          - type: paragraph
            body: >
              ENN
              的成本结构由研发人员、专门实验基础设施、电力系统、诊断、真空和材料系统，以及建设下一台机器所需的资本开支主导。公开科学和行业资料清楚表明，质子-硼聚变只有在极高的物理和工程门槛被满足后才具经济吸引力。这意味着
              ENN
              的成本基础不只是泛泛意义上的“深科技研发”；它还包含一条燃料路线，可能比主流氘-氚项目要求更高温度、更紧的辐射损失控制和更苛刻的部件性能。全聚变行业的供应链数据进一步强化了这一担忧：行业支出快速增加，但燃料系统、极端条件材料、热管理和电力部件仍是瓶颈。


              因此，单位经济性大多不可观察。公开资料没有足以支撑投资测算的每 MW
              成本、电站资本开支估计、维护曲线、产能假设、容量因子披露或转换效率披露。最佳公开分析立场，是把理论吸引力和当前可计算性分开。质子-硼最终可能降低与中子相关的屏蔽、废物和退役负担；但如果轫致辐射损失、灰烬处理或装置复杂性让电站经济性缺乏吸引力，理论优势就没有意义。因此，ENN
              的利润率路径不是单纯为负，而是尚未定义。
