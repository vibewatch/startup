      - number: '2.3'
        title: 买家分层与采用路径
        blocks:
          - type: paragraph
            body: >
              ENN 早期买家大概率可按对技术新颖性的容忍度和用电需求紧迫性分层。超大规模数据中心运营商是最清晰的领先板块，因为他们已经会签长期清洁电力协议，而且越来越看重供电确定性，超过地理位置。Commonwealth
              Fusion Systems 的 200 MW Google 协议和 Helion 的 Microsoft PPA
              很重要，因为它们证明：只要战略叙事足够强，成熟买家会在商业运营前就为聚变签约。重工业是第二个板块：电炉钢、化工、氢能和高耗能制造，都需要能匹配生产周期的清洁电力，而不只是年度证书。公用事业公司和电网运营商是第三个板块；它们天然具备规模购买力，但通常需要更长的许可和证据周期。在中国本土语境下，ENN
              母公司的企业能源版图为其接近工业客户提供关系邻近性，但公开证据还没有显示这些客户转化为聚变买家。因此，采用路径会先从同行市场的战略验证客户开始，再到工业试点，最后才走向更广泛的电网部署。
