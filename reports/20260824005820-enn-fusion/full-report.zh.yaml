      - number: '3.2'
        title: ENN 在路线、客户验证与地理位置上的相对定位
        blocks:
          - type: paragraph
            body: >
              ENN 的竞争身份很少见，因为它把两个通常分开的比较集合放在一起。按机器几何形态看，它最接近 Tokamak Energy 等球形托卡马克项目，以及追求更小电站占地的紧凑磁体项目。按燃料雄心看，它更接近 TAE
              和 HB11 Energy，因为它想要的是质子-硼结果，而不是更常见的氘-氚路线。如果跑通，这一组合具备战略吸引力：紧凑机器、无中子叙事、中国本土供应和人才生态。但同一组合也意味着 ENN
              不能借用其他类别的商业验证。Helion 和 CFS 已通过 Microsoft 和 Google 掌握最可见的客户验证，Proxima 则拿下了欧洲仿星器融资叙事。ENN
              的公开数据因此支撑了一个差异化技术故事，但还不支撑差异化商业故事。它最强的比较优势，是母公司资助、拥有托卡马克和诊断深度的公开团队，以及全球同行难以轻易复制的中国生态位置。
