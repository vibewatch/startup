      - number: '7.2'
        title: 运营、物理与技术风险
        blocks:
          - type: paragraph
            body: >-
              ENN 最大的技术风险没有变化：质子-硼聚变因为无中子上行空间而在纸面上很有吸引力，但它也是聚变中最难商业化的路径之一。ENN
              自身路线图和机器页面显示了一个真实实验项目，但反向文献仍强调轫致辐射损失、极高离子温度要求，以及把等离子体成功变成可重复发电的工程挑战。对外部投资者而言，真正问题不是 ENN
              是否在做科学，而是公开记录是否包含足够反应堆级证据，能够把有前景的实验和通向净能量或有用电力输出的可投资路径区分开来。答案是否定的。


              运营上，这留下了多层叠加风险。EHL-2 是下一个有形项目关口，因此建设延迟或结果功率不足，都会立即传导为融资压力。诊断不确定性、子系统集成、排热、材料耐久性，以及网络 /
              控制弱点，也可能让一个看似漂亮的等离子体故事失效。因为 ENN 没有公开披露占空比、可用率、成本或转换效率指标，正确的风险姿态是：在 EHL-2
              不仅展示性能标题、还展示可融资的工程纪律之前，把技术和运营就绪度视为不可分割。
