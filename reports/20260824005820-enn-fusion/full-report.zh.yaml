      - number: '8.2'
        title: 可比估值框架
        blocks:
          - type: paragraph
            body: >-
              可比公司有意义，但必须打可迁移性折扣。ENN 的估值低于最显眼的美国头部公司，尤其是 Helion 和 Commonwealth Fusion
              Systems；但这些同业的公开证明栈也更强：资本底座更大，客户或承购证据更清楚，商业化顺序更可读。TAE 是分析上最相关的同燃料同业，因为它同样讲质子-硼叙事；如果没有更多公开物理披露，ENN 相对历史 TAE
              式基准的溢价很难自洽。Proxima、Tokamak Energy 和 Energy Singularity
              能帮助框定市场愿意为其他私有聚变故事支付什么价格，也提醒投资人：地域、技术路线、客户证明和电站架构都会改变估值可比性。


              所以，正确的可比结论应是方向性的，不是公式化的。相对于同阶段前沿科学风险，ENN 并不便宜。它的估值高于多数早期或区域化的聚变同业，因为它叠加了 ENN Group 支持、中国工业邻近资源和大胆的 p-11B
              愿景；但它仍低于全球第一梯队，因为这些同业投入了更多资本、展示了更多商业化证明，或两者兼有。ENN 因此是一项证明前的溢价资产，而不是 Helion 或 CFS 的廉价影子。
