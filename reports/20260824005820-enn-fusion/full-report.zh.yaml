      - number: '6.3'
        title: 留存耐久度、满意度与切换成本
        blocks:
          - type: paragraph
            body: >
              公开资料没有 ENN Fusion 的留存数据，因为还没有披露客户队列。没有
              NRR、GRR、流失率、合同期限、满意度指标或复购证据。因此，任何留存讨论都必须作为代理来处理。有用的代理是结构性逻辑：如果未来聚变电站被部署进客户的实体能源系统，切换成本应当变高，因为更换会牵涉基础设施、许可、工程重设和业务连续性风险。这一逻辑与能源基础设施的长寿命属性、以及
              ENN Energy 更广泛的一体化能源交付模式一致。


              但结构性逻辑不是证据。母公司一体化能源项目可能有耐久关系，但公开记录没有告诉我们其续约行为或盈利能力。同样，Microsoft 和 Google 的头部聚变协议显示的是早期承诺意愿，不是续约结果证据。对 ENN
              而言，耐久度在公司披露至少一个含里程碑、期限和交易对手承诺的试点或合同前，仍未被证明。
