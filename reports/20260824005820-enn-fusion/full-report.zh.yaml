  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与收入流
        blocks:
          - type: paragraph
            body: >
              ENN Fusion 目前似乎没有商业收入。公开材料把公司定位为 ENN 生态内的质子-硼聚变装置开发者，而不是已经在销售的能源供应商。未来收入模式大概率是在商业机器出现后销售稳定电力或一体化能源容量，并可能借助
              ENN Energy 更广泛的企业能源关系打包提供。这是一条可信的战略路径，因为 ENN Energy
              已在中国服务数百万居民用户和数十万工业与商业客户；但聚变子公司尚未披露任何试点电价、开发费、里程碑付款结构或非电力收入线，无法让投资者建立真正的近期预测。


              ENN Fusion 层面唯一明确公开的融资事件，是 2026 年 7 月外部融资；据报道，该轮使公司估值约 CNY10.6
              billion。这一轮不能证明收入质量，只能证明投资者愿意为一个差异化未来能源故事出资。管理层表述显示，资金用途锁定在 Helong-2 / EHL-2
              装置建设和调试，而不是扩张一个已验证的商业引擎。换句话说，ENN 的近期现金流入来自融资，不是客户现金。除非 ENN
              发展出尚未披露的付费工程服务、政府补助或战略开发合同，否则收入确认仍是未来状态问题，取决于聚变输出能否从实验室里程碑变成产品。
