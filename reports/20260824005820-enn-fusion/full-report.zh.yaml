      - number: '8.4'
        title: 投资决定与尽调要求
        blocks:
          - type: paragraph
            body: >-
              按当前价格，除非投资人对质子-硼路线有异常强的技术确信，并能拿到非公开尽调材料，否则 ENN 很难作为领投投资来承销。这个价格并不荒谬：ENN
              有真实母公司、真实机器路线图、真实科学身份，也确实在全球聚变对话中占有位置。但相对公开证明仍偏高，因为法律链条、股权条款、客户时间线和 EHL-2
              经济性都还太不透明。因此，更合理的是观察或继续研究，而不是不计价格买入。


              尽调清单因此格外具体。投资人需要 EHL-2 的进度表和预算、从 EERI 到 ENN Fusion 的 IP 链条、Dr. Peng
              与工程骨干的留任和接班条款、母公司出资承诺函，以及客户形成进展的实时图。如果这些材料扎实，价格可以变得可辩护；如果材料薄弱，公司也许仍有科学吸引力，但估值应被视为头条动量，而不是可投资证明。
