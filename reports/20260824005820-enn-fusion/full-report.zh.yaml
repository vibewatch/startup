  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接聚变同行版图
        blocks:
          - type: paragraph
            body: >
              ENN 的实际同行集合小于私营聚变公司的总数。相关直接竞争者，是那些争夺同一批未来稳定电力买家，或用替代技术路线证明可进入同一市场的公司。Commonwealth Fusion
              Systems（CFS）是融资最充足的私营聚变公司，也是最清晰的商业规模托卡马克竞争者。Helion 因 Microsoft 合同和 $15.5 billion 估值，成为商业可见度最高的 FRC 竞争者。TAE
              是燃料路线最接近的亲缘公司，因为它也把氢-硼聚变包装为更清洁的长期终点，尽管其机器设计是束驱动 FRC，而不是球形环。Proxima Fusion 代表欧洲最强的仿星器新进入者。Pacific Fusion 和
              Focused Energy 也重要，因为它们显示新资本能多快支持截然不同的惯性或脉冲路线。因此，ENN 所处赛场尚未有任何单一架构胜出，但可见的买家验证和资金厚度已经拉开了感知可信度的层级。
