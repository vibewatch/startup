companyProfile:
  summary: >
    ENN Fusion 是 ENN Group 的研发机构 ENN Energy Research Institute 孵化出的聚变能源商业化载体。公开资料显示，公司于 2025 年正式注册为北京子公司，同时在河北廊坊的 ENN
    研究园区开展技术工作。它的核心投资逻辑是紧凑型质子-硼（p-11B）聚变：如果能落地，这条无中子路线可避开氘-氚聚变的许多中子管理负担。公司的差异化是真实的，难度也同样真实。ENN 大约自 2017
    年起就在母公司内部重金投入聚变研发，搭起 EXL / EHL 实验谱系，并在 2026 年 7 月完成首次披露的外部融资，据报道估值约 $1.6
    billion。公司仍处于收入前阶段，没有公开具名客户，没有披露商业电站经济性，也没有公开阐明授权路径。
