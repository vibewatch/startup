      - number: '2.4'
        title: 增长驱动、约束与未解决的市场缺口
        blocks:
          - type: paragraph
            body: >
              需求条件有利，但采用约束依然严峻。正面看，数据中心用电增长、工业脱碳和国家对聚变的支持，都在扩大清洁稳定电力的可服务需求。FIA 的 2026
              年材料也显示，投资者和供应商在聚变产能上投入更多。负面看，电力市场需求无法抹掉技术成熟度、供应链、融资和监管瓶颈。FIA 供应链报告称，69%
              的供应商仍缺乏长期可见性，并提示燃料循环系统、热管理和第一壁材料会成为未来约束。美国 NRC 的聚变框架正在变清晰，但具体场址的安全和环境工作仍然重要；中国也才刚开始把商业聚变政策体系正式化。对 ENN
              而言，最大的市场证据缺口在于没有公开来源披露产品定价、目标售电结构、买家管线或质子-硼电站的支付意愿数据。因此，市场投资逻辑可信且具战略吸引力，但仍由代理证据驱动。
