  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >
              ENN Fusion
              所处市场，更适合按买方痛点界定，而不是按反应堆标签界定。最宽的外层边界是电力市场，但这一上限对尽调过于粗。更有决策价值的边界，是能够同时解决可靠性、许可压力和脱碳需求的稳定、可调度、无碳电力板块。这排除了没有稳定化层的纯间歇式发电，也不同于更宽泛的“聚变行业”统计口径；后者会把研发、设备、基础设施和服务混在一起。对
              ENN 而言，最接近的需求楔子是供电确定性重要的大负荷用电：超大规模数据中心、有全天候用电需求的工业用户，以及面对需求上升和脱碳目标的电网运营商。现状替代方案包括先进裂变、天然气加
              CCS、地热、与可再生能源搭配的长时储能，以及继续向电网购电。ENN 的质子-硼策略只有在选址灵活性、成本和稳定电力质量上打赢或补足这些方案时，才具备商业意义；仅有科学新颖性不够。
