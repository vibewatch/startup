      - number: '1.3'
        title: 创始团队与科学领导层
        blocks:
          - type: paragraph
            body: >-
              Wang Yusuo 是 ENN Group 创始人兼董事长，也是战略创始人和主要资本资助方。这位清洁能源亿万富豪自约 2017 年起持续把 ENN
              资源投向聚变，并承担长期耐心资本锚点的角色。他没有正式的等离子体物理职务。


              Dr. Minsheng Liu 是 EERI 院长兼 Fusion Technology R&D Center 主任。他拥有 Tsinghua University 化学工程博士学位，曾带领 ENN
              扩展研发议程，覆盖生物能源和聚变。他连接了母集团治理结构和聚变项目的运营需求。


              Dr. Y.K.（Martin）Peng 是首席科学家，也是该项目的智识核心。Dr. Peng 是 Stanford 物理学博士，1980 年代发明了球形托卡马克（ST）概念，并曾是 Princeton
              Plasma Physics Laboratory（PPPL）National Spherical Torus Experiment（NSTX）的共同创始人与首席研究员。他从美国国家实验室体系加入
              ENN，在全球聚变社区被广泛视为 ENN 认真投入的信号。


              Baoshan Yuan 担任首席工程师。他曾在成都 Southwestern Institute of Physics（SWIP）担任副所长，该机构运营中国西南地区主要国家聚变装置 HL-2A
              托卡马克。他的工程背景把政府项目经验和私营公司商业规模化需求接了起来。


              其他高级研究人员包括 Prof. Kaiming Feng（反应堆理论）、Dr. Hua-sheng Xie（等离子体理论与模拟）、Dr. Bihe Deng（诊断）和 Dr. Bing
              Liu（实验物理）。2024–2026 年，团队在 Nuclear Fusion（IOP）和 Physics of Plasmas（AIP）围绕 EXL-50/50U 结果发表了十余篇同行评审论文。按 Yicai
              Global 报道，2026 年中员工总数约 300 人。
