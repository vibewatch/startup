      - number: '8.3'
        title: 乐观 / 基准 / 悲观情景分析
        blocks:
          - type: paragraph
            body: >-
              情景分析是唯一诚实匹配公开证据的方法。乐观情景假设 ENN 把 EHL-2 转成真正的证明台阶，厘清从实验到电站的路径，并保留足够资本和科学连续性，让 2030
              年点火叙事站得住。在这种情况下，今天的价格可能显得偏早，因为市场会开始资本化非中子聚变的稀缺价值，而不只是实验室进展。基准情景没那么戏剧化：EHL-2 有帮助，但时间线滑后，客户形成滞后，ENN
              还需要多年技术和法律去风险，才像一家商业能源公司。


              悲观情景不是温和下行，而是最可能出现的警示。如果轫致辐射、约束、子系统集成或进度滑坡，让 ENN 无法证明一条通向 Q>1
              或经济相关性能的可信路径，估值可能跌向战略资产价值，甚至接近零期权价值。因此，即便上行空间仍大，下行概率也必须保持在高位。分布很宽，因为聚变期权真实存在，但证明仍然稀缺。
