- id: current-device-status
  title: Current device status and milestone quality
  body: 'ENN''s current experimental platform is EXL-50U, the upgraded successor to EXL-50. Official pages state that EXL-50U achieved first plasma in January 2024 and then reached a one-megaampere hydrogen-boron plasma-current milestone in April 2025, with 1.2 tesla magnetic field performance and stated fulfillment of engineering targets. These disclosures are meaningful because they provide machine parameters, not only marketing language. ENN''s ITPEA admission and publication of a large EHL-2 paper package also strengthen credibility by showing some external integration with the broader fusion community.


    That said, milestone quality must be interpreted carefully. A 1 MA p-B11 plasma milestone is important but not equivalent to demonstrating power-producing conditions or commercially relevant energy balance. The public sources do not show plant-grade output, net electricity, or a validated cost path. The right interpretation is that ENN has moved beyond concept-stage storytelling and into real machine-building and physics generation, but it is still in the experimental-regime rather than product-regime phase.

    '
