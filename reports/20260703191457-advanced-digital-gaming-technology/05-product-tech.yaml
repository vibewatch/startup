- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / requirement
  - Public status
  - Where it appears
  - Operational implication
  - Gap / caveat
  rows:
  - - Gaming-related vendor licensing
    - Explicit UAE category and named public register
    - GCGRA license types and licensee pages
    - Payments infrastructure must fit gaming-vendor supervision, not only generic fintech rules
    - Public page does not map ADGT branding to a named legal entity
  - - Technical standards for gaming processes and technology
    - Explicit regulatory expectation
    - GCGRA legislation page
    - Wallet, kiosks, tables, apps, and data flows may all need certification evidence
    - Technical-standards detail was not publicly retrievable in this run
  - - AML / suspicious-activity monitoring
    - Detailed product claims for transaction aggregation and casework
    - Aura AML docs and GeoComply / Sightline materials
    - ADGT can plausibly centralize monitoring across property and online channels
    - No public UAE SAR or STR workflow is linked to ADGT
  - - OFAC / sanctions / PEP screening
    - Explicitly described in GeoComply and Sightline materials
    - Sightline-Geocomply announcement and IDComply docs
    - Cross-border and digital-funding flows need sanctions-aware onboarding and monitoring
    - UAE-specific sanctions and screening vendor configuration is not public
  - - Authentication and touchpoint authorization
    - Detailed but vendor-specific control description
    - Sightline passwordless blog and Parx wallet MFA listing
    - Stronger touchpoint binding can reduce phishing and account-takeover risk
    - No public ADGT control narrative confirms this exact model will be retained
  - - Geolocation / device-integrity checks
    - Public product evidence and cashless-risk commentary
    - GeoComply Core and GeoComply cashless-risk article
    - Necessary to stop spoofed or remotely controlled cashless activity
    - Actual UAE jurisdiction rules and on-property geofencing design remain unknown
  - - Table and device approval burden
    - Demonstrated by Nevada table-payment approval and GLI references at Resorts World
    - NRT TablePay and Sightline Resorts World announcements
    - Go-live depends on certification as much as product readiness
    - UAE certification path for the same hardware is not public
  - - App privacy and consumer disclosure surfaces
    - Visible in live app-store listings and Play+ toolkits
    - Apple App Store pages and operator toolkits
    - Consumer apps disclose data handling, support lines, and FDIC or issuer statements
    - Public app disclosures show U.S. issuer language, not UAE consumer-protection wording
  notes: Status reflects publicly visible controls only; private control testing, SOC reports, and local-regulator audits remain outside public evidence.
