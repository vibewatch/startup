- id: wallet-and-compliance-plane
  title: Wallet, identity, and compliance control plane from Sightline and partners
  body: 'Sightline contributes the wallet and digital-journey logic that ADGT says it needs for online gaming and omnichannel resort spend. Public product pages describe a single account model that can span slots, tables, sportsbook, iGaming, lottery, and non-gaming resort spend, while Deposit and Debit add operator-treasury and open-loop consumer-spend paths that a pure closed-loop casino wallet would not cover. The most relevant technical signals are the compliance integrations: Sightline''s GeoComply partnership explicitly references BSA, OFAC, KYC, AML, and geolocation checks at key customer-journey steps, and GeoComply''s own docs show the expected vendor pattern—single-API waterfall verification, sanctions screening, selfie checks, SDK-based geolocation, and device-integrity monitoring. Sightline''s 2026 authentication and fraud essays add one more clue: the control plane is designed as layered authorization, touchpoint identification, and automated anomaly detection rather than a
    lightweight consumer wallet alone. That is exactly the kind of stack ADGT would need if it wants one platform to span both gaming-floor and internet-gaming flows in a newly regulated market.'
  claimRefs:
  - CE025
  - CE026
  - CE027
  - CE028
  - CE029
