chapter:
  number: 5
  title: Product & Technology
  summary: ADGT's claimed UAE-wide payments-and-compliance layer is best understood as a localization of NRT's land-based cash, cage, payout, credit, and AML products around Sightline's wallet and omnichannel funding stack; the architecture is credible, but it inherits multi-vendor integration, certification, and control-surface complexity that ADGT has not yet documented publicly.
sections:
- id: product-definition-and-architecture
  title: Product definition and inferred base architecture
  body: 'ADGT''s own public surface is almost empty today—the adgt.ai site fetched during this run is only a placeholder—so the best available architecture read comes from the March 2026 Blackstone announcement plus the underlying NRT and Sightline product surfaces. Blackstone says ADGT is a unified payments-and-compliance platform for both land-based and online gaming in the UAE, and explicitly names the core building blocks: digital wallets, real-time funding and payout rails, identity and access management, compliance monitoring, and both closed-loop and open-loop ecosystem controls. Those functions line up unusually cleanly with Sightline''s Play+ / prepaid / debit account model on the digital side and NRT''s cage, kiosk, payout, credit, and AML assets on the land-based side. The technical conclusion is therefore not that ADGT has already shown a native greenfield stack; it is that ADGT most likely starts as a UAE-localized orchestration layer wrapped around proven but heavily integrated
    U.S. gaming-payments components.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE008
  - CE009
  - CE025
  - CE049
  tableRefs:
  - TE001
  - TE003
