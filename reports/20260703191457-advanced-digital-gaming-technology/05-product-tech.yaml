- calloutType: strength
  title: The core omnichannel use case is technically credible
  body: 'Public NRT and Sightline materials already cover the exact ingredients Blackstone attributes to ADGT: land-based endpoints, wallet accounts, real-time payout rails, and layered compliance controls.'
  claimRefs:
  - CE002
  - CE009
  - CE016
  - CE025
  - CE030
  - CE049
- calloutType: risk
  title: Integration breadth is a feature and a risk
  body: The stack spans apps, kiosks, tables, cage systems, issuer banks, processors, card networks, geolocation vendors, and regulators, so deployment risk concentrates in orchestration and certification rather than in any single module.
  claimRefs:
  - CE020
  - CE037
  - CE038
  - CE047
  - CE048
  - CE050
- calloutType: assumption
  title: ADGT-specific engineering remains mostly inferential
  body: Because ADGT has not published technical docs or a consumer product surface, this chapter uses NRT and Sightline assets as the best-supported proxy for what ADGT is likely commercializing in the UAE.
  claimRefs:
  - CE003
  - CE049
  - CE051
