- id: deployment-and-roadmap
  title: Deployment evidence, roadmap signals, and developer surface
  body: 'The roadmap and deployment evidence suggest real technology underneath the branding, but they also show that the stack is still evolving. Sightline''s Resorts World release documents a shift from a two-step Play+ transfer model to a single-wallet flow with remote identity verification and biometrics, while Project 250 shows a parallel retrofit strategy aimed at legacy slot floors through Acres Foundation rather than only through greenfield app launches. NRT''s smartSend rollout at Great Canadian and its earlier NRT-Sightline integration release show that cross-property cashless and payout workflows were being assembled well before ADGT existed. The strongest developer-signal proxies are not GitHub repos but live casino apps and toolkits: STN MOBILE, Talking Stick, Resorts World, and Parx Wallet are all publicly distributed, and Sightline publishes issuer-network toolkits that read like partner implementation packages rather than pure marketing collateral. Still, the app-store quality
    spread is wide, which implies that distribution maturity does not guarantee uniform execution quality once the stack is embedded in operator-specific apps.'
