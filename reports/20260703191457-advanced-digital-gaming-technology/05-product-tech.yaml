- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role in stack
  - Representative public evidence
  - Key dependency
  - Main risk
  rows:
  - - Consumer app / rewards surface
    - Enrollment, balance visibility, loyalty, bookings, promotions, and wallet initiation
    - Operator apps at STN, Talking Stick, Resorts World, and Parx
    - JOINGO / operator app team / app stores
    - Public quality is inconsistent and ratings suggest adoption friction at some operators
  - - Identity and account opening
    - Verify patron identity and create reusable financial or loyalty-linked account
    - ResortID, IDComply, remote ID verification at Resorts World
    - GeoComply, ID data sources, operator KYC workflow
    - False rejects, state-by-state rules, and localization to UAE identity standards
  - - Wallet and account model
    - Hold or reference funds across gaming and non-gaming contexts
    - Play+, single-wallet roadmap, and patented funding flows
    - Issuer bank, payment network, sponsor-bank compliance
    - Complex ledger and transfer logic across wagering and non-wagering balances
  - - Funding and payout rails
    - Move money in and out in real time
    - SPAN, smartSend, J.P. Morgan processing, Mastercard Send, Visa / bank programs
    - Processors, issuers, card networks, local acquirers
    - Settlement, dispute, FX, and sanctions-screening complexity
  - - Land-based endpoint layer
    - Accept or disburse funds on cage, kiosk, table, and slot touchpoints
    - Cage Center, QuickBank, Lilly TablePay, slot and cage integrations
    - Casino CMS, kiosk hardware, table devices, cage workflows
    - Device certification, maintenance burden, and on-property training
  - - Compliance and surveillance layer
    - Aggregate transactions, file CTRs, monitor suspicious activity, and enforce controls
    - Aura AML, GeoComply Core, IDComply, GCGRA technical standards
    - Regulators, source systems, data quality, screening vendors
    - Any missing interface or stale rules degrade monitoring coverage
  - - Real-time event / analytics layer
    - Track machine events, player behavior, and operator decisions
    - Acres Foundation real-time stream plus NRT table patent and resort analytics claims
    - Machine data interfaces and historical fraud models
    - Cross-vendor event normalization is hard and can become integration debt
  - - Regulatory and certification envelope
    - Authorize products, operators, and vendors before go-live
    - GCGRA licensing, Nevada approval precedent, and GLI-style testing references
    - GCGRA, labs, operator compliance teams
    - Approval timelines can become gating items rather than coding speed
  notes: This table is an inferred operating model stitched from partner product pages, patents, app-store evidence, and regulator pages rather than from ADGT-native technical documentation.
