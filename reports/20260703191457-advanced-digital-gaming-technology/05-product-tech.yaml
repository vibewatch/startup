  evidenceGaps:
  - type: missing-source
    severity: material
    topic: adgt-native-architecture
    missingEvidence: A public ADGT architecture diagram, API reference, SDK documentation, or security white paper showing what is newly built in UAE versus reused from NRT and Sightline.
    whyItMatters: Without native technical documentation, diligence can only infer whether ADGT is a regional orchestration layer or a substantively new platform with its own control plane and reliability model.
    diligencePath: Request ADGT product architecture, integration, and information-security documentation under NDA and ask engineering to walk through wallet, ledger, IAM, and compliance-service boundaries.
    relatedQuestionRefs:
    - QE022
  - type: private-evidence-only
    severity: material
    topic: uae-license-entity
    missingEvidence: The exact legal entity name, license category, and effective date for the ADGT-linked UAE authorization.
    whyItMatters: The public GCGRA page shows active categories and named licensees, but not the exact entity that underpins ADGT's claimed direct-contracting rights, which affects regulatory diligence and contracting risk.
    diligencePath: Obtain the GCGRA license certificate, application entity name, and any affiliate or service-company structure that maps ADGT branding to the licensed legal entity.
    relatedQuestionRefs:
    - QE023
  - type: missing-source
    severity: material
    topic: reliability-and-incidents
    missingEvidence: A public status page, uptime SLA, postmortem archive, or regulator-disclosed incident history for NRT, Sightline, or ADGT-specific operations.
    whyItMatters: Cashless gaming, payouts, and identity controls sit directly on payment and play flows; without reliability and incident evidence, operational risk has to be inferred from indirect signals such as app ratings and marketing blogs.
    diligencePath: Ask for operator SLAs, uptime reports, major-incident logs, failover design, and regulator or lab test results for production cashless deployments.
    relatedQuestionRefs:
    - QE024
  - type: missing-source
