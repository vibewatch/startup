- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Public maturity / status
  - Differentiation signal
  - Diligence gap
  rows:
  - - Play+ / Sightline Prepaid
    - Patron and operator
    - Live product with toolkit docs, patent family, and operator integrations
    - Single account across slots, tables, sportsbook, iGaming, and lottery plus API / iframe options
    - No ADGT-local wallet or ledger schema is public
  - - smartSend
    - Casino cage, slots, tables, sportsbook, online payout teams
    - Live NRT product and 2023 operator deployment announcement
    - Instant payout to bank accounts or prepaid cards across on-property and remote touchpoints
    - Need actual UAE rail, issuer, FX, and processor configuration
  - - Cage Center
    - Casino cashiers and cage managers
    - Mature web workflow product
    - ID auto-population, e-signatures, cage reporting, and Title 31 hooks
    - No public throughput, fraud-loss, or uptime metrics
  - - QuickBank
    - Back-of-house finance and cage operations
    - Mature cash-recycling hardware / software product
    - Automates employee floats and cash recycling instead of manual cage routines
    - Needs venue-by-venue capex, maintenance, and device-certification detail
  - - Aura AML
    - BSA / AML / compliance teams
    - Mature web suite with documented interfaces
    - Real-time transaction aggregation, CTR workflow, suspicious-activity case handling, and multi-system interfaces
    - No public ADGT mapping to UAE AML or suspicious-activity reporting workflow
  - - eMarker / Lilly TablePay
    - Casino credit and table-game operations
    - Mature but regulator-dependent products
    - Digitizes credit markers and supports table-side buy-in on wireless hardware
    - Needs local approval path and responsible-gaming guardrails in UAE
  - - ResortID / JOINGO mobile surfaces
    - Enrollment, rewards, and on-property digital-experience teams
    - Recently launched identity product plus live operator apps
    - ID auth, age verification, watch-list checks, and branded app distribution
    - Public docs do not show how ADGT will unify these with UAE identity stacks
  - - Sightline Deposit / Debit
    - Operator treasury and patrons spending beyond gaming floor
    - Public products with bank / network partners
    - Operator-liquidity optimization plus open-loop card access beyond gaming floor
    - Regional issuer, settlement, and consumer-protection model remains undisclosed
  notes: Rows combine public product pages, toolkits, patents, and deployment announcements; ADGT-specific localization remains mostly undisclosed.
