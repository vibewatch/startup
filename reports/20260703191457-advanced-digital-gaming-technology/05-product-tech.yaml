- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - NRT / Sightline solution
  - Measurable or claimed benefit
  - Limitation / caveat
  rows:
  - - Enroll and verify a patron
    - Manual in-person ID check or fragmented mobile signup
    - ResortID plus Sightline / GeoComply IDComply enrollment stack
    - Faster onboarding, less manual review, reusable identity across payments and loyalty
    - No public ADGT flow showing UAE KYC vendor or sponsor-bank handoff
  - - Fund play without physical cash
    - ATM or cashier visit before gaming
    - Play+ / Prepaid / Debit / open-loop funding options
    - Omnichannel access to funds and lower queue friction
    - UAE domestic rails and chargeback policies are not public
  - - Cash out from slots or tables
    - Ticket redemption, cage line, or check issuance
    - smartSend, Play+, and single-wallet cashless flows
    - Near-instant access to winnings and reduced ticket / check friction
    - Real-world quality varies by operator app and deployment depth
  - - Manage casino credit and markers
    - Paper markers and manual reconciliation
    - eMarker and Lilly TablePay
    - Faster issuance, redemption, and audit trails with table-side hardware
    - Requires local approval and disciplined operational controls
  - - Run cage and back-office cash ops
    - Manual float prep and fragmented reports
    - QuickBank plus Cage Center
    - Lower labor, less shrinkage, and more structured reporting
    - Hardware installation and staff-change programs can slow rollout
  - - Monitor AML and suspicious activity
    - Separate reports and manual aggregation across systems
    - Aura AML with multi-system interfaces and CTR workflows
    - Centralized patron-view of reportable activity and case handling
    - Fallback imports imply data quality and interface variance across operators
  notes: Benefits are vendor-claimed unless the row cites independent app-store or regulatory evidence; operational KPIs such as fraud-loss reduction are not publicly quantified.
