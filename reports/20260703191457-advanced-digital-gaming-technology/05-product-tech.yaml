- id: technical-risks-and-diligence-gaps
  title: Technical risks, certification burden, and remaining diligence gaps
  body: 'The main product risk is not whether the component technologies exist—they do—but whether ADGT can regionalize and govern them cleanly in the UAE. GCGRA makes clear that gaming-related vendors sit inside a dedicated licensing framework and must meet technical standards for gaming activities, processes, technology, and game design, which means deployment speed will be constrained by certification and supervision as much as engineering capacity. GeoComply''s own cashless-risk writing also underlines why this matters: remotely controlled devices, location spoofing, sanctions exposure, account takeover, and illicit-finance risk all become more acute when mobile cashless flows are opened across property and online channels. The structural issue is that even Sightline''s own 2026 commentary describes modern gaming payments as a best-of-breed mosaic of wallet, fraud, AML, geolocation, and issuer partners. ADGT may benefit from that maturity, but it also inherits the integration debt, vendor
    management, and outage blast radius that come with a multi-party control stack—without yet giving investors a public ADGT-native architecture, SLA, or status surface to inspect.'
  claimRefs:
  - CE004
  - CE005
  - CE007
  - CE020
