- id: land-based-stack
  title: Land-based endpoint stack from NRT
  body: NRT contributes the most visible land-based operating substrate. QuickBank automates cage and back-of-house cash recycling, Cage Center digitizes cash advances, check cashing, ID capture, reporting, and Title 31 controls, eMarker modernizes marker issuance and redemption, and Lilly / TablePay extends that cashless logic to the table-game edge. smartSend then bridges those physical touchpoints into real-time payout rails, with NRT describing a flow that can originate from slots, tables, cage, sportsbook, or online channels and land in bank accounts or prepaid cards. ResortID adds another important layer, because age verification, ID authentication, and barred-list checks are core to any UAE commercial-gaming deployment. In other words, ADGT does not need to invent a land-based operating model from scratch; the harder question is how cleanly these historically separate modules can be normalized into a single UAE-regulated workflow without creating brittle interface, training, or device-certification
    dependencies.
  claimRefs:
  - CE013
  - CE014
  - CE015
  - CE016
  - CE017
