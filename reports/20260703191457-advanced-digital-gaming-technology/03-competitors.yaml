- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - ADGT moat claim
  - Threat or substitute
  - Severity
  - Why the threat is credible
  - Mitigation / diligence ask
  rows:
  - - Only platform spanning land-based and online UAE gaming
    - Register gap and expanding vendor base
    - High
    - Fetched GCGRA page lists 22 gaming-related vendors and does not visibly show ADGT by name
    - Obtain legal entity name, license category, and regulator-visible proof
  - - Unified wallet and payments stack
    - Sightline omnichannel wallet depth
    - High
    - Sightline publicly shows single-account use across slots, tables, sportsbook, iGaming, and lottery
    - Clarify what ADGT adds beyond imported Sightline capability
  - - Local regulatory advantage
    - PayBy local-fintech adjacency
    - Medium
    - PayBy publicly claims a gaming-related vendor license plus existing UAE payments rails
    - Track whether PayBy lands named gaming operators or expands on-property capabilities
  - - Integrated compliance layer
    - Checkout / Paysafe / multi-vendor fraud-KYC assembly
    - Medium
    - Fraud, identity, AML, and PSP components are already sold separately by scaled vendors
    - Show superior approval, fraud-loss, or onboarding economics in live deployments
  - - Land-based operational depth
    - Everi and NRT cash-access / AML / credit systems
    - High
    - Property workflows can still be solved with dedicated floor-tech stacks
    - Prove ADGT can displace or orchestrate incumbent floor systems without friction
  - - Distribution through partners
    - Channel conflict from Sightline or NRT direct expansion
    - Medium
    - Both partners retain strong standalone market identities and product surfaces
    - Disclose exclusivity, territory, or white-label terms if they exist
  - - Sticky operator integration
    - Internal build or co-developed operator app
    - Medium
    - Resorts World demonstrates that operators can shape branded wallet experiences with vendors
    - Assess whether Wynn or future UAE operators want control over front-end wallet UX
  - - Price-insensitive workflow moat
    - Enterprise discounting and bundled bids
    - Medium
    - Most vendors do not publish rates, so late-stage deals can become heavily negotiated
    - Pressure-test ADGT unit economics against bundled PSP plus floor-tech alternatives
  notes: Risk ratings reflect competitive pressure on ADGT's public narrative, not probability of immediate displacement; several risks remain unresolved because operator contracts are undisclosed.
