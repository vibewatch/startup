company:
  name: Advanced Digital Gaming Technology
chapter:
  number: 3
  title: Competitors
  summary: ADGT enters a field where online PSPs, land-based gaming-tech vendors, and global iGaming processors already cover most component capabilities, so its defensibility appears to rest more on UAE licensing, partner distribution, and operator integration than on feature uniqueness alone. The strongest public disconfirming evidence in this chapter is that the fetched GCGRA register already lists 22 gaming-related vendor licensees and does not visibly list ADGT by name, leaving the company's dual-channel exclusivity claim company-stated rather than regulator-verified in the public materials reviewed here.
sections:
- id: landscape-and-classes
  title: 'Landscape: direct peers, adjacents, and likely entrants'
  body: 'The public landscape is already broader than ADGT''s launch framing implies. ADGT''s own announcement positions the company as the only licensed platform able to contract directly with both land-based venues and online digital platforms in the UAE, while combining wallet, funding, identity, and compliance functions into one stack. But the public GCGRA register fetched for this chapter lists 22 gaming-related vendor licensees plus separate land-based and internet-gaming licensees, showing that the supplier layer is already populated by geolocation, content, payments-adjacent, lottery, and integrity vendors rather than a blank field waiting for one national champion. In the online-payment layer, PayBy, Checkout.com, PayTabs, and Paysafe all publicly expose many of the same building blocks ADGT says it brings: gateway processing, wallets or stored-value experiences, fraud tooling, KYC/identity checks, and cross-border payouts. In the land-based layer, Sightline, Everi, and NRT already
    market cashless gaming, AML, casino credit, kiosk, and resort-spend workflows. That makes ADGT less a category creator than an attempt to localize and package multiple proven capability blocks under UAE regulatory cover.'
  claimRefs:
