  rows:
  - - ADGT
    - Company under review
    - US$250m investment from Blackstone
    - Claims unified wallet, identity, compliance, and funding rails across land-based and online UAE gaming
    - If true, this is the local integrated benchmark
    - Dual-license exclusivity remains company-claimed in public sources
  - - PayBy
    - UAE fintech / PSP
    - Press release says first fintech with GCGRA gaming-related vendor license
    - Digital wallet, payments, fraud tools, POS, recurring payments, settlement, cross-border merchant rails
    - Closest UAE-native PSP adjacency and most obvious mainstream fintech alternative
    - No public proof in fetched materials of land-based casino-floor depth
  - - Checkout.com
    - Global PSP
    - US$300bn ecommerce volume in 2025
    - Acceptance, fraud detection, identity verification, hosted pages, 150+ currencies, 50+ countries
    - Could cover online deposits/payouts/KYC for major operators if licensed or partnered
    - Public evidence is merchant-generic rather than UAE-gaming-specific
  - - PayTabs
    - Regional PSP
    - Tailored flat-rate or interchange++ pricing model
    - Gateway, links, QR, repeat billing, plugins, multi-currency acceptance, PCI/3DS readiness
    - Competes on regional merchant onboarding and generic payment acceptance
    - No public gaming-specific land-based capability proof in fetched materials
  - - Sightline Payments
    - Gaming wallet specialist / ADGT partner
    - 6.5bn+ network processing, 5m+ wallets, 60+ partners, 44 states
    - Single-account gaming wallet across slots, tables, sportsbook, iGaming, and lottery; strong fraud/compliance framing
    - Most credible functional proxy to ADGT omnichannel thesis and a potential channel conflict
    - No public GCGRA license evidence found in this chapter
  - - Paysafe
    - Global iGaming processor
    - US$167bn annualized transactional volume in 2025; ~2,800 employees
    - Cards, wallets, eCash, pay by bank, crypto, 120+ countries, iGaming-specific buyer targeting
    - Global scale and brand relationships could matter if UAE licensing opens further
    - Fetched materials did not show UAE gaming licensing or land-based floor integration
  - - Everi / IGT
    - Land-based gaming fintech / systems
    - Planned combined enterprise valued around US$6.2bn with ~US$2.7bn projected 2024 revenue
    - Casino payment, compliance, loyalty, kiosk, iGaming/sports-betting/fintech one-stop-shop narrative
    - Strong land-based credibility and distribution if entering GCC
    - Public evidence is mainly US/global and not UAE-licensed
  - - NRT Technology
    - Land-based gaming payments and compliance / ADGT partner
    - Blackstone calls NRT the world's largest payment technology company in gaming
    - Payments, AML compliance, Play Plus walleting, and casino credit automation surfaces are all public
    - Could either deepen ADGT's moat through supply or compete for operator wallet/floor workflows directly
    - Public UAE customer and licensing specifics were not found in this chapter
  notes: Profiles reflect only fetched public materials as of 2026-07-03; "limitation / gap" means not verified here, not necessarily absent in reality.
