- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing metric
  - Current public status
  - Underwriting impact
  - Exact diligence path
  rows:
  - - Revenue / ARR / TPV / GMV
    - Not disclosed in any official or filing source reviewed.
    - Prevents any company-specific view on scale, take rate, or growth quality.
    - Request monthly management accounts, operator-by-operator volumes, and booked vs realized revenue.
  - - Gross margin / net revenue
    - Not disclosed.
    - Blocks conversion of payment activity into gross profit and margin-path analysis.
    - Request revenue-recognition memo and product-level gross-margin bridge.
  - - Customer count / contracted operators / venues
    - Not disclosed.
    - Makes revenue concentration and pipeline quality impossible to assess.
    - Request signed customers, LOIs, launch dates, and revenue start assumptions by venue / operator.
  - - Headcount / compensation plan
    - Not disclosed.
    - Obscures fixed-cost burden and hiring intensity.
    - Request current org chart, fully loaded compensation by function, and 18-month hiring plan.
  - - Burn / runway / cash balance
    - Not disclosed.
    - Prevents any capital-adequacy conclusion beyond headline fundraise size.
    - Request current cash, monthly burn, capex / integration spend, and base / downside runway models.
  - - Capital structure / valuation support
    - Only a thin secondary “around US$1 billion” reference was found.
    - Leaves entry valuation, dilution, and investor downside protection unverified.
    - Request executed financing documents, cap table, and board-approved valuation materials.
  - - Legal entity mapped to GCGRA license
    - ADGT is not named in the public licensee register.
    - Leaves the central licensing claim only partially verified in public records.
    - Request the licence certificate, exact entity name, and any trade-name or nominee mapping to ADGT.
  notes: Every row names a missing private-data item that directly blocks a normal venture-underwriting workflow; none of the nulls can be repaired from public peer proxies.
