- id: TI003
  title: Unit Economics Table
  columns:
  - Metric
  - Public value/status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Net take rate
    - null
    - Low
    - The single most important missing input for translating operator volume into ADGT net revenue.
    - Provide blended take rate and separate gross billed fees from pass-through interchange/network costs.
  - - Gross margin / net revenue margin
    - null
    - Low
    - Determines whether ADGT behaves more like software, merchant acquiring, or a hybrid.
    - Provide gross margin by product line and explain which payment costs are pass-through vs retained.
  - - Chargeback / fraud loss-rate proxy
    - PayPal reported transaction losses of ~0.07% of TPV in 2025.
    - Medium
    - Illustrates that even scaled platforms retain non-zero fraud and chargeback leakage.
    - Disclose expected loss rates for land-based gaming, online gaming, and wallet-funded transactions separately.
  - - Gaming-sector revenue concentration proxy
    - Paysafe said Digital Wallets, primarily serving online gambling, represented ~47% of 2025 revenue.
    - Medium
    - Shows that a gaming-heavy mix can be material and increases regulatory dependence.
    - Disclose target mix across gaming, lottery, and any non-gaming regulated markets.
  - - Scaled processor margin proxy
    - Shift4’s filings imply ~43% to 49% adjusted EBITDA as a share of gross revenue less network fees.
    - Medium
    - Provides an upper-end benchmark for a mature integrated processor after scale.
    - Provide ADGT’s target steady-state EBITDA bridge and launch-phase opex plan.
  - - Settlement / banking dependency
    - Paysafe flags sponsor-bank, licensing, settlement, and fee escalation risk.
    - Medium
    - Bank-rail access and reserve requirements can constrain both growth and gross margin.
    - Disclose sponsor-bank relationships, reserve requirements, settlement timing, and any ring-fenced client-fund rules.
  notes: Nulls are intentional where ADGT has made no public disclosure. Benchmark rows use public peers to show the metrics an investor would need, not to backfill company-specific values.
