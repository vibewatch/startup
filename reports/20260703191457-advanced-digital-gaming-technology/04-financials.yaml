chapter:
  number: 4
  title: Financials
  summary: ADGT’s public financial record is limited to Blackstone’s announced US$250 million investment and thin secondary valuation chatter. Available evidence supports a multi-rail gaming-payments infrastructure model and public peer benchmarks for cost structure, but there are still no disclosed ADGT revenue, margin, burn, runway, or capitalization details. The chapter therefore concludes that the company may be well capitalized for launch, yet remains un-underwritable on company-specific economics without private diligence materials.
sections:
- id: funding-disclosure
  title: Funding Structure, Valuation Signals, and Blackstone Disclosure Posture
  body: 'The only hard company-specific financial fact in public circulation is the March 26, 2026 Blackstone announcement. It says funds managed by Blackstone invested US$250 million in ADGT and that the company was formed with Raya Holding, NRT Technology, and Sightline Payments. That is a real capital signal, but not a full financing memo. The release does not say whether the US$250 million is common equity, preferred equity, structured equity, convertible paper, or a staged draw facility, and it does not disclose ownership percentages, board rights, liquidation preferences, or how the technology partners participate economically. Blackstone’s own latest filed 10-Q is useful mostly for what it does not say: in the filing reviewed for this run, ADGT is not named, so the investment had not yet surfaced as a specifically identified portfolio holding in the most recent SEC quarterly disclosure. The same omission carries through to ADGT’s placeholder website, which still offers no revenue,
    burn, headcount, or runway data. The only public valuation reference located in this run is EnterpriseAM’s Bloomberg-attributed “around US$1 billion” line, which is too thin to underwrite as a confirmed post-money valuation.'
