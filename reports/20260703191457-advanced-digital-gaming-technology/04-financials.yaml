tables:
- id: TI001
  title: Revenue Streams Table
  columns:
  - Stream
  - Public mechanism
  - Likely unit
  - Current public status
  - Revenue quality
  - Diligence ask
  rows:
  - - Merchant acquiring / processing
    - Shift4 and PayPal benchmarks point to processing fees tied mainly to payment volume.
    - bps of processed value + fixed transaction fees
    - ADGT has disclosed capability, not pricing.
    - Could be recurring and high-volume, but margin is sensitive to interchange/network costs.
    - Disclose gross vs net take rate by land-based, online, wallet-funded, and bank-funded volume.
  - - Wallet / stored-value services
    - ADGT and Paysafe both frame wallet rails as a core product layer.
    - wallet load / withdrawal / transfer fee or revenue share
    - Wallet functionality is disclosed; fee schedule is not.
    - Sticky if integrated deeply into operator journeys, but economics depend on funding mix and float rules.
    - Provide wallet monetization, funding-mix assumptions, and whether customer funds generate any ancillary economics.
  - - Real-time funding and payout
    - Official launch materials highlight real-time funding and payout rails.
    - per payout, instant-transfer, or FX fee
    - Capability disclosed; no price card.
    - Useful ancillary revenue, but typically variable and event-driven.
    - Break out payout pricing by rail, geography, and cross-border use case.
  - - Identity / compliance / monitoring software
    - ADGT explicitly markets compliance monitoring and identity controls.
    - monthly SaaS, per account, per check, or bundled minimums
    - No public SKU or module pricing.
    - Potentially the highest-quality margin layer if sold separately from payment volume.
    - State whether compliance is bundled into MDR-like pricing or sold as a distinct software line.
  - - Integration / implementation / support
    - Shift4’s software and support disclosures show another common monetization layer.
    - setup fee, project fee, monthly minimum, support retainer
    - No ADGT disclosure.
    - One-time or semi-recurring; quality depends on contract scope and renewal structure.
    - Provide implementation fees, minimum commits, and support SLAs by operator type.
  notes: Public evidence supports the existence of these revenue layers, but not ADGT’s realized pricing, take rate, or revenue mix; rows distinguish disclosed capabilities from inferred commercialization patterns.
