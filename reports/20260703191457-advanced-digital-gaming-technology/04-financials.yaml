- id: diligence-blockers
  title: Public Gaps and Financial Verdict
  body: 'The underwriting blocker is not lack of strategic narrative; it is lack of company data. Public evidence supports four boundary conditions: ADGT has sponsor-backed launch capital, the regulatory perimeter is real, the operating model likely resembles a bundled gaming-payments infrastructure stack, and mature public processors can produce healthy margins after network fees once scale is reached. None of that answers the basic investment questions for ADGT itself. There is still no public revenue figure, no customer count, no headcount, no gross margin disclosure, no monthly burn, no cash balance, no runway, and no official valuation support. Even the licensing claim remains only partly mapped because the GCGRA public register does not list ADGT by name, despite the announcement’s strong wording about cross-channel contracting rights. The chapter’s financial verdict is therefore cautious: US$250 million appears large enough to fund an initial UAE launch and regional build-out, but
    without private operating and financing materials it is impossible to judge revenue quality, margin path, or whether the capital is abundant, merely adequate, or already structurally committed.'
