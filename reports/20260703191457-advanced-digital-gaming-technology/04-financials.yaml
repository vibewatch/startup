  evidenceGaps:
  - type: missing-source
    severity: material
    topic: instrument-structure
    missingEvidence: Executed subscription agreement, cap table, or management disclosure describing whether Blackstone’s US$250 million is common equity, preferred equity, structured equity, debt, or a staged commitment.
    whyItMatters: Ownership economics, liquidation rights, and governance control determine whether the headline capital amount actually supports attractive equity underwriting.
    diligencePath: Request the executed financing documents, post-money cap table, board-rights summary, and any side letters with Raya, NRT, or Sightline.
    relatedQuestionRefs:
    - QI002
  - type: private-evidence-only
    severity: material
    topic: valuation-reference
    missingEvidence: Primary valuation support such as a term sheet, board paper, fairness memo, or company-authored financing summary confirming any post-money valuation.
    whyItMatters: The only public unicorn framing is a secondary Bloomberg-attributed report; without primary support the valuation anchor is too thin for investment-committee use.
    diligencePath: Request financing decks, board approvals, and any investor communications that specify pre-money, post-money, and fully diluted ownership.
    relatedQuestionRefs:
    - QI005
    - QI022
  - type: missing-source
    severity: blocking
    topic: financial-disclosure-gap
    missingEvidence: Revenue, ARR, TPV/GMV, customer count, gross margin, headcount, monthly burn, cash balance, and runway.
    whyItMatters: Without operating metrics the chapter can describe only the business model and peer proxies, not ADGT’s actual revenue quality or capital adequacy.
    diligencePath: Request monthly management accounts, KPI dashboard, customer pipeline, headcount by function, and a 13-week cash forecast.
    relatedQuestionRefs:
    - QI004
    - QI023
    - QI024
  - type: missing-source
    severity: material
    topic: license-register-gap
    missingEvidence: The legal-entity mapping between ADGT’s commercial brand and any GCGRA-licensed entity capable of contracting across both land-based and online channels.
    whyItMatters: The press release makes a strong licensing claim, but the public GCGRA register does not list ADGT by name, leaving a verification gap around the exact regulated entity.
    diligencePath: Request the GCGRA licence certificate, legal entity name, licence category, and any trade-name or nominee structure linking ADGT to the licensed entity.
    relatedQuestionRefs:
    - QI011
  - type: missing-source
    severity: material
    topic: capital-intensity-synthesis
    missingEvidence: An official budget for licensing, AML/KYC, certification, settlement-reserve, local hiring, and integration costs for the UAE launch.
    whyItMatters: Public evidence supports that the build-out is compliance-heavy, but not how much of the US$250 million is consumed before the platform reaches meaningful revenue scale.
    diligencePath: Request the launch budget by workstream, reserve policies, sponsor-bank terms, and milestone-based spend plan through first revenue.
    relatedQuestionRefs:
    - QI017
    - QI018
    - QI025
  - type: access-blocked
    severity: minor
    topic: valuation-reference
    missingEvidence: A directly accessible Crunchbase or other database profile confirming whether a US$1 billion valuation was actually recorded for ADGT.
    whyItMatters: Database replication of the unicorn narrative would not make the valuation primary evidence, but it would help distinguish between a single press shorthand and a broader data-provider consensus.
    diligencePath: Retry Crunchbase with authenticated access or request the company’s own financing summary instead of relying on inaccessible third-party databases.
    relatedQuestionRefs:
    - QI022
