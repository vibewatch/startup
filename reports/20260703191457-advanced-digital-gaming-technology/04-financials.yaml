- id: TI004
  title: Capital Adequacy Table
  columns:
  - Item
  - Public disclosure
  - What can be said now
  - Quality
  - Diligence ask
  rows:
  - - Initial capital base
    - Blackstone announced a US$250 million investment.
    - Material launch capital exists on paper for licensing, integrations, reserves, and hiring.
    - Confirmed official disclosure
    - Provide opening balance sheet, cash-at-close, and any earmarks or restricted cash.
  - - Instrument type / ownership
    - Not disclosed publicly.
    - Official materials do not say whether the money is common equity, preferred equity, structured equity, debt, or a staged commitment.
    - Missing
    - Provide security type, ownership %, board rights, liquidation preference, and investor protections.
  - - Cash balance / unrestricted liquidity
    - null
    - No public figure is available.
    - Missing
    - Provide current cash, restricted cash, and minimum regulatory reserve requirements.
  - - Burn / runway
    - null
    - Runway cannot be computed from public materials.
    - Missing
    - Provide monthly burn bridge, fixed-vs-variable opex split, and downside runway case.
  - - Commercialization dependency
    - Wynn ecosystem and UAE vendor market appear narrow through 2027.
    - Capital may need to support a longer pre-scale period before multiple operators are live.
    - Inferred from public market structure
    - Provide signed pipeline, launch dates, and minimum-revenue milestones by counterparty.
  - - Compliance / certification burden
    - Public regulatory and vendor reporting indicate front-loaded licensing, audit, AML, and integration spend.
    - A meaningful share of capital is likely consumed before steady-state volumes arrive.
    - Inferred from public regulatory context
    - Provide compliance budget, certification timetable, and reserve assumptions through first year of operation.
  notes: The table separates the confirmed headline capital amount from the much larger set of capital-adequacy questions that remain undisclosed.
