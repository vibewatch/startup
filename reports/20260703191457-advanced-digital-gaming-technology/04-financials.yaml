- id: revenue-model
  title: Revenue Model and Monetization Benchmarks
  body: 'ADGT’s official materials imply a multi-layer revenue model rather than a single merchant-discount spread. The launch release describes digital wallets, real-time funding and payout rails, identity and access management, compliance monitoring, and closed-loop plus open-loop controls in one platform. Public payment-company filings show what that usually means economically. Shift4 says payments-based revenue is mostly a percentage of processed dollar volume, but can also include fixed fees, monthly minimums, per-transaction charges, gateway services, tokenization, and software revenue. PayPal adds another relevant layer: variable and fixed payment fees, plus cross-border, FX, instant-transfer, and other ancillary charges. Paysafe’s iGaming positioning points in the same direction by marketing one integration across cards, wallets, eCash, local methods, bank rails, and crypto. The economic implication for ADGT is a blended model: processing spread plus wallet/payout monetization plus
    compliance or gateway software. What is still missing is the realized take rate. Official surfaces do not reveal whether ADGT plans to price these capabilities separately, bundle them, or subsidize one rail to win operator adoption.'
