- id: FI004
  title: Capital Intensity / Cash-Flow Map
  type: flow
  layout: wide
  summary: Where ADGT’s launch capital is most likely to be consumed before broad-scale revenue exists in the UAE gaming-payments market.
  data:
    nodes:
    - id: capital-pool
      label: Capital Pool (US$250M announced)
      detail: Headline capital exists, but instrument terms and restricted-vs-unrestricted cash are undisclosed.
    - id: licensing-and-legal
      label: Licensing / Legal / Governance
      detail: CBUAE and GCGRA frameworks imply licensing, legal structuring, and ongoing compliance overhead.
    - id: integration-and-certification
      label: Integration / Certification / Testing
      detail: Payments rails, casino systems, online platforms, and responsible-gaming tooling all require integration and regulator comfort before launch.
    - id: settlement-and-risk
      label: Settlement Liquidity / Risk / AML
      detail: Sponsor-bank diligence, reserve requirements, AML controls, and reconciliation processes can tie up cash before scale.
    - id: narrow-initial-tam
      label: Narrow Initial TAM
      detail: Public reporting indicates the near-term UAE market is still concentrated around one resort, the lottery, and phased online categories.
    - id: scale-or-refinance
      label: Scale or Refinance Decision
      detail: If commercialization is slower than expected, ADGT may need either more time on capital or more capital before the market broadens.
    edges:
    - from: capital-pool
      to: licensing-and-legal
    - from: capital-pool
      to: integration-and-certification
    - from: capital-pool
      to: settlement-and-risk
    - from: integration-and-certification
      to: narrow-initial-tam
    - from: settlement-and-risk
      to: narrow-initial-tam
    - from: narrow-initial-tam
      to: scale-or-refinance
  approximationNotes: This map is a public-evidence synthesis, not a disclosed ADGT budget. It shows likely uses and bottlenecks rather than actual company cash allocations.
