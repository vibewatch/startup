- id: TI002
  title: Pricing / Monetization Table
  columns:
  - Public benchmark
  - What is monetized
  - Pricing form
  - ADGT read-through
  - Caveat
  - Source
  rows:
  - - PayPal transaction revenues
    - Merchant payment acceptance plus FX, cross-border, instant transfer, and other ancillary fees.
    - Fixed + variable % of payment amount
    - Suggests ADGT could combine core processing fees with payout, FX, and urgency premiums.
    - Consumer-wallet mix differs from regulated gaming infrastructure.
    - PayPal 2025 10-K
  - - Shift4 payments-based revenue
    - Payment processing, gateway services, tokenization, and other related services.
    - '% of volume + fixed fee + minimum monthly + per-transaction fee'
    - Closest public analog for an operator-facing acquiring and gateway stack.
    - U.S. hospitality/enterprise mix is not a clean UAE gaming equivalent.
    - Shift4 2025 10-K / Q1 2026 10-Q
  - - Shift4 subscription and other revenue
    - POS, terminals, business-intelligence software, support, and annual fees.
    - device, software, statement, annual, and support fees
    - Indicates ADGT could monetize non-payment operational software around the core rails.
    - ADGT has not disclosed hardware exposure or software packaging.
    - Shift4 2025 10-K
  - - Paysafe iGaming suite
    - Cards, wallets, eCash, local methods, pay-by-bank, and crypto under one integration.
    - Contract-specific bundle; list pricing undisclosed
    - Supports a bundled multi-rail commercial model for regulated gaming operators.
    - Marketing page proves product scope, not realized pricing or contribution margin.
    - Paysafe iGaming page
  notes: This table uses public peer disclosures to frame monetization forms available to gaming-payments infrastructure businesses; it does not imply ADGT already earns from every line shown.
