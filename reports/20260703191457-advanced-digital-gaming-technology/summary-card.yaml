summary:
  headline: >-
    ADGT is a well-capitalized, PE-and-strategic-partner-backed UAE gaming-payments platform with a credible regulatory
    positioning claim, but it has no public operating track record and its widely repeated ~US$1 billion valuation is
    not verified by any primary disclosure.
