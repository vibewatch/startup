  evidenceGaps:
  - type: missing-source
    severity: material
    topic: license-cost-disclosure
    missingEvidence: A public GCGRA fee schedule or operator/vendor license-cost disclosure that would quantify entry cost and recurring compliance burden.
    whyItMatters: Without public fee data, the report can describe licensing friction qualitatively but cannot convert it into a reliable SAM or payback assumption.
    diligencePath: Request the latest GCGRA invitation-to-apply pack, fee schedule, or applicant memo directly from management or counsel.
    relatedQuestionRefs:
    - QM021
    relatedTableRefs:
    - TM004
  - type: private-evidence-only
    severity: material
    topic: payments-volume-and-take-rate
    missingEvidence: Public transaction-volume, wallet-activity, payout-volume, or take-rate data for ADGT or comparable UAE gaming-payment platforms.
    whyItMatters: A true SOM model for ADGT depends on payment flow and monetization per operator, not just on the number of visible licenses.
    diligencePath: Ask management for pipeline TPV assumptions, operator-level wallet adoption, payout mix, and revenue take-rate by channel.
    relatedQuestionRefs:
    - QM022
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: named-customer-proof
    missingEvidence: A current public source naming ADGT as the contracted payments or compliance vendor for Wynn Al Marjan or another licensed UAE operator.
    whyItMatters: Without named customer proof, the report can validate ADGT's license position but cannot verify early share capture at the operator level.
    diligencePath: Request customer contracts, redacted MSAs, or customer references from management and legal counsel.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM003
  - type: stale
    severity: minor
    topic: license-rollout-pace
    missingEvidence: An official forward-looking GCGRA disclosure on expected operator-license cadence by emirate and by product type after the current public cohort.
    whyItMatters: Most top-down TAM scenarios assume more than the currently visible license set, but public evidence does not pin down timing.
    diligencePath: Track new GCGRA licensing notices monthly and ask management for counsel-based expectations on additional operator awards.
    relatedQuestionRefs:
    - QM024
