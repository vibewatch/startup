  - - Dubai Program for Gaming 2033 and esports investment
    - driver
    - current and medium term
    - Strengthens talent, content, and digital-engagement adjacencies around the broader gaming ecosystem
    - How much of this adjacency converts into regulated gaming transaction demand?
  - - Bank-grade AML, KYC, and responsible-gaming controls
    - constraint
    - current
    - Raises implementation cost, onboarding friction, and audit burden for operators and vendors
    - What is the real cost to stay compliant per operator and per player wallet?
  - - CBUAE perimeter expansion and AED 1B fine ceiling
    - constraint
    - current
    - Raises regulatory downside for payment-enabling technology providers serving sensitive use cases
