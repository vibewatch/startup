tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to ADGT
  rows:
  - - Regulated land-based gaming
    - Casino wallet funding, payout, cage-to-digital transfer, patron identity, on-property settlement, operator compliance tooling
    - Hotel rooms, restaurants, general tourism spend outside gaming transactions
    - Integrated-resort operator; payer is operator finance or operations budget
    - High, because omnichannel funding and payout is part of ADGT's stated value proposition
  - - Regulated internet gaming and sports wagering
    - Account funding, withdrawals, KYC, geolocation-linked controls, fraud detection, payments orchestration
    - General entertainment apps and unlicensed offshore sites
    - Internet-gaming operator; payer is operator product, payments, or compliance budget
    - High, because ADGT explicitly says it can contract with online digital platforms
  - - Lottery and digital draw operations
    - Ticket purchase rails, wallet top-up, identity verification, responsible-gaming controls, payout processing
    - Promotional giveaways that are not regulated gaming
    - Lottery operator; payer is operator finance and compliance budget
    - Medium to high, because lottery is a public, currently licensed UAE category
  - - Gaming-related vendor stack
    - Geolocation, sports data, content aggregation, device interfaces, payment middleware, compliance integrations
    - Generic enterprise software with no gaming or regulated-payments role
    - Licensed vendors and their operator customers
    - High, because ADGT operates inside the same regulated ecosystem and may partner or compete by layer
  - - Adjacent consumer gaming and esports
    - Game downloads, in-app purchases, tournament sponsorship, creator and platform spend
    - Licensed wagering or casino revenue when not directly linked
    - Players and publishers; payer is mostly consumer or sponsor
    - Indirect, as a demand and talent adjacency rather than current regulated-gaming SAM
  - - Unlicensed gambling and grey channels
    - None for investable SAM purposes
    - Offshore betting, unlicensed sites, cash play outside GCGRA oversight
    - No lawful payer under the regime
    - Explicitly excluded because GCGRA says facilitation without license is illegal
  notes: This boundary table separates regulated gaming transaction flows from broader gaming consumption, tourism, and illegal or grey-market activity so ADGT's addressable layer is not overstated.
