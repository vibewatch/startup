    - How many additional operator categories are expected over the next 12-24 months?
  - - Wynn Al Marjan opening path
    - driver
    - 2027 and after
    - Creates a flagship land-based node for high-value funding, payout, and omnichannel wallet activity
    - Has ADGT won any named Wynn-facing mandate or pilot?
  - - Mobile-first player behavior and digital payments familiarity
    - driver
