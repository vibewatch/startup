  - - Cultural and legal restrictions on gambling
    - constraint
    - structural
    - Limits mass-market participation and requires careful channel design and enforcement
    - How are tourist, expatriate, and resident segments actually segmented in practice?
  notes: The driver side is visible and directional, but the constraint side is what prevents broad regional gaming TAM figures from mapping directly into ADGT revenue potential.
