- id: sizing-lenses
  title: TAM, SAM, and SOM Sizing Lenses
  body: 'Public market sizing is directionally useful but not cleanly additive. At the broadest level, Precedence Research frames a $9.81 billion 2026 Middle East gaming market growing to $22.20 billion by 2035, with online and mobile formats already dominating the mix. That is a useful adjacency lens because ADGT sits in a digital payments layer, but it is not a regulated UAE gaming number. A second adjacency lens comes from low-confidence UAE consumer-gaming estimates such as Juego Studios'' $1.16 billion 2024 UAE gaming market number and GamesMEA survey data showing a mobile-first, high-spending player base. Again, those data say something about digital demand, not about licensed gaming revenue. The most relevant top-down lens for ADGT is regulated UAE gaming revenue. Here the scenario spread is wide: SCCG sketches $1.5-2.0 billion, $5-6 billion, and $8-10 billion 2030 outcomes depending on how many resorts and online products are approved, while CBRE''s $8.5 billion TAM frame also warns that supply constraints could slow realization. The cleanest bottom-up lens is actually the public licensee register: one lottery operator, one internet-gaming operator, one land-based operator, and 22 gaming-related vendors. That means ADGT''s near-term SOM is a share of payment, compliance, and omnichannel transaction flows at a very small set of regulated nodes, not a share of all Middle East gaming spend. The biggest analytical gap is that no public source discloses ADGT transaction volume, pricing, or take rate, so the chapter keeps market math evidence-constrained.'
