- id: buyers-and-payments-layer
  title: Buyer, User, and Payer Segmentation
  body: 'ADGT''s buyer map starts with regulated operators and adjacent licensed vendors, not with players. In land-based integrated resorts, the likely economic buyer is the operator''s finance, cage, treasury, cashless, or operations leadership because they own funding, payout, settlement, and on-property wallet workflows. In internet gaming and lottery, digital product, payments, fraud, and compliance teams become more central because registration, KYC, deposits, gameplay limits, withdrawals, and suspicious-activity monitoring all happen online. The player is the end user and the originator of funds, but in a B2B model the operator still pays the infrastructure bill. The public vendor roster also implies that the buyer ecosystem is already multi-layered: geolocation, content aggregation, sports data, and gaming-device suppliers are licensed separately, so ADGT is selling into a stack rather than into a blank field. That stack supports the company''s thesis that a unified land-based and online payments layer can be valuable, but it also means buyer education, integration effort, and partner management are part of the go-to-market motion. Because public evidence does not yet name ADGT as Wynn''s or Coin Technology Projects'' chosen vendor, the current segmentation is strongest on who should buy and why, and weakest on which buyer already has.'
