  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Excluded Spend
        blocks:
          - type: paragraph
            body: >-
              The market ADGT can address today is the GCGRA-regulated commercial gaming stack, not the full Gulf or
              Middle East entertainment economy. Official GCGRA materials define the legal perimeter as lottery,
              internet gaming, sports wagering, and land-based gaming facilities, and they also make clear that
              operators, related vendors, employees, and even consumers cannot legally participate outside that licensed
              perimeter. That boundary matters because ADGT sells into the transaction and compliance layer, not into
              content creation or general game publishing. Included spend therefore covers operator budgets for wallet
              funding and payout, identity verification, KYC and AML controls, transaction monitoring, omnichannel
              settlement, and the software or services that let land-based and digital touchpoints share one regulated
              payments experience. Excluded spend includes unlicensed offshore gambling, generic consumer video-game
              software, esports sponsorship that never touches wagering or regulated funds flow, and broader tourism or
              hospitality spending that sits outside gaming transactions themselves. GCC consumer gaming and esports
              demand are still relevant as adjacency signals, but the currently evidenced commercial SAM remains
              UAE-centric because the visible licensing regime is UAE federal and not a broader GCC-wide commercial
              gaming framework.
            claimRefs:
