      - number: '3.4'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The best case for ADGT is that it can become the locally trusted orchestration layer connecting regulated
              online payments with land-based gaming operations before foreign vendors obtain equivalent UAE
              permissions. The weaker case is that much of its product narrative is already decomposable into functions
              that are visible in competitor materials today: PSP acceptance, fraud, AML/KYC, wallets, resort spend,
              cash access, and casino credit. That makes the moat more regulatory-distributional than technical. The key
              adverse datapoint is that the public GCGRA register reviewed for this chapter did not visibly list ADGT by
              name and already contained 22 gaming-related vendor licensees, which means public regulator evidence does
              not yet independently prove ADGT's exclusivity claim even though the Blackstone launch announcement
              asserts it. A second adverse theme is future entrant elasticity: the legal-advisory source reviewed here
              says foreign suppliers can apply if they establish UAE entities and that one operation can require
              multiple licence types, making both specialist entrants and operator-owned modules plausible. Net: ADGT
              may have an early positioning advantage, but durability depends on converting that positioning into
              disclosed customers, regulator-visible status, and hard-to-replace workflow depth before the field
              thickens.
