            body: >-
              The only hard company-specific financial fact in public circulation is the March 26, 2026 Blackstone
              announcement. It says funds managed by Blackstone invested US$250 million in ADGT and that the company was
              formed with Raya Holding, NRT Technology, and Sightline Payments. That is a real capital signal, but not a
              full financing memo. The release does not say whether the US$250 million is common equity, preferred
              equity, structured equity, convertible paper, or a staged draw facility, and it does not disclose
              ownership percentages, board rights, liquidation preferences, or how the technology partners participate
              economically. Blackstone’s own latest filed 10-Q is useful mostly for what it does not say: in the filing
