            body: >-
              ADGT’s UAE customer universe is currently defined less by broad market size than by a regulator-curated
              license map. The GCGRA framework covers four operator categories—lottery, internet gaming, sports
              wagering, and land-based gaming facilities—while also separately licensing gaming-related vendors. On the
              public register reviewed on 2026-07-03, only three operator entities were populated: The Game LLC for
              lottery, Island 3 AMI FZ-LLC (DBA Wynn Al Marjan) for land-based gaming facilities, and Coin Technology
              Projects LLC for internet gaming. The sports wagering bucket was still empty. That means ADGT’s short-term
              reachable buyer set is tiny even before factoring procurement, integration, or brand credibility. The
              vendor side is broader, with 22 gaming-related vendors on the public register, but those companies are
              mostly ecosystem counterparts or competitors rather than direct revenue customers for ADGT. In practical
              terms, the UAE market is open, but customer concentration is structurally extreme until more operator
