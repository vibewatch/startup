companyProfile:
  summary: >-
    Advanced Digital Gaming Technology (ADGT) is a payments-and-data-intelligence technology platform launched from Abu
    Dhabi, UAE on 2026-03-26, built through a strategic partnership between Blackstone (which invested US$250 million),
    Raya Holding, NRT Technology, and Sightline Payments. ADGT states it is the only platform currently licensed in the
    UAE to contract directly with both land-based gaming venues and online digital gaming platforms, positioning it as a
    unified payments and compliance layer for the country's newly regulated commercial gaming market overseen by the
    GCGRA. Beyond the launch announcement, the company discloses no public revenue, customer, or headcount figures, and
    its corporate website (adgt.ai) remains a placeholder page.
  foundedDate: '2026-03-26'
  founders:
    - name: Michael Dominelli
