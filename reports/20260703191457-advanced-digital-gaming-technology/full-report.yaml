            body: >-
              Customer concentration is the central commercial risk. Independent trade analysis describes the UAE
              opportunity as high stakes but narrow in the near term, with one resort and a national lottery carrying
              most of the visible demand through 2027. Public evidence is consistent with that view: Wynn is the
              flagship land-based venue, Coin Technology Projects LLC is the sole named internet gaming licensee, and
              sports wagering remains publicly empty. At the same time, the vendor ecosystem is not empty. PayBy is
              already publicly licensed to provide payment services to gaming operators, while the register and
              Wynn-focused reporting show a widening field of slots, lottery, geolocation, and table-equipment
              suppliers. That combination creates a difficult launch geometry for ADGT: few buyers, growing incumbent
              context, and no named production customer. The most important diligence asks now are exact license-entity
              mapping, signed operator contracts or LOIs, implementation references, and any retention or transaction
              data that proves repeat usage rather than mere licensing eligibility.
