  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory risk is the central underwriting issue because ADGT is trying to monetise a
              payments-and-compliance layer inside a UAE commercial gaming regime that is still very new. The GCGRA has
              clear statutory authority, public licence categories, and an explicit consumer advisory against unlicensed
              activity, but the public record still looks early-stage: the reviewed pages show a narrow disclosed
              licensee universe, limited public enforcement history, and only partial visibility into licence fees,
              renewal terms, and entity-level mappings. That matters because ADGT's most important moat claim is itself
              regulatory: it says it is the only licensed platform able to contract across land-based and online
              channels. Yet the public register does not clearly map the ADGT brand to a named legal entity, while
              separate 2024 press around PayBy shows how public licence announcements and the live register can diverge.
              At the same time, the payments perimeter is tightening. White & Case and other legal commentary indicate
              that Article 62 of the 2025 CBUAE law can bring enabling payments infrastructure into direct supervision,
              with maximum administrative fines now reaching AED 1 billion and a 2026-09-16 regularisation date for
              newly in-scope firms. For a start-up platform with gaming exposure, the practical risk is not just “is
              gaming legal” but whether GCGRA, CBUAE, and AML obligations line up cleanly enough for ADGT's exact
              operating model.
            claimRefs:
