  - id: FI001
    title: Revenue Model Bridge
    type: flow
    layout: wide
    summary: >-
      How ADGT’s disclosed product layers would likely convert regulated gaming transaction activity into net revenue
      and gross profit if commercialized in line with public payment-infrastructure peers.
    data:
      nodes:
        - id: operator-and-player-activity
          label: Operator / Player Activity
          detail: >-
            Land-based and online gaming transactions are the economic starting point, but ADGT has not disclosed active
            operators, venues, or volumes.
        - id: processing-layer
          label: Processing Layer
          detail: >-
            Volume-based payment processing fees, potentially with fixed and minimum components, are the closest public
            analog from Shift4 and PayPal.
        - id: wallet-and-payout-layer
          label: Wallet / Funding / Payout Layer
          detail: >-
            Digital wallets, instant funding, payout, FX, and alternative methods can add ancillary revenue above the
            core processing spread.
        - id: compliance-software-layer
          label: Identity / Compliance Software Layer
          detail: >-
            Monitoring, identity, and access controls could monetize as bundled software or per-account / per-check
            services.
        - id: net-revenue
          label: Net Revenue
          detail: >-
            Realized ADGT take rate is undisclosed, so the blend between payment spread and software-like revenue is
            unknown.
        - id: gross-profit
          label: Gross Profit
          detail: >-
            Gross profit depends on how much of interchange, network, bank, fraud, and support cost is passed through
            versus absorbed.
      edges:
        - from: operator-and-player-activity
          to: processing-layer
        - from: processing-layer
          to: wallet-and-payout-layer
        - from: processing-layer
          to: compliance-software-layer
        - from: wallet-and-payout-layer
          to: net-revenue
        - from: compliance-software-layer
          to: net-revenue
        - from: net-revenue
          to: gross-profit
    approximationNotes: >-
      The nodes are company-specific where officially disclosed and peer-derived where monetization mechanics are not
      publicly specified by ADGT.
    claimRefs:
      - CI006
      - CI022
      - CI029
      - CI033
      - CI044
  - id: FI002
    title: Unit Economics Bridge
    type: flow
    layout: wide
    summary: >-
      Qualitative cost bridge showing the public-peer inputs ADGT would need to disclose before investors can move from
      headline capital to actual margin underwriting.
    data:
      nodes:
        - id: gross-billings
          label: Gross Billings / Volume
          detail: Transaction volume is undisclosed, but peer filings show it is the primary driver of payment revenue.
        - id: pricing-yield
          label: Pricing Yield / Take Rate
          detail: Fixed and variable pricing plus ancillary FX / payout / wallet fees determine gross monetization.
        - id: network-and-funding-costs
          label: Interchange / Network / Funding Costs
          detail: Processors and wallets pay card, bank, and settlement costs before gross profit is visible.
        - id: fraud-and-chargebacks
          label: Fraud / Chargebacks / Losses
          detail: Loss rates can be manageable at scale but still matter, especially in gaming and wallet-funded flows.
        - id: compliance-and-support
          label: Compliance / Licensing / Support
          detail: >-
            AML, KYC, audit, certification, sponsor-bank diligence, and customer support all consume margin before
            EBITDA.
        - id: ebitda
          label: EBITDA Potential
          detail: >-
            Public peers show attractive mature economics are possible, but ADGT has not disclosed any base-period
            revenues or costs.
      edges:
        - from: gross-billings
          to: pricing-yield
        - from: pricing-yield
          to: network-and-funding-costs
        - from: network-and-funding-costs
          to: fraud-and-chargebacks
        - from: fraud-and-chargebacks
          to: compliance-and-support
        - from: compliance-and-support
          to: ebitda
    approximationNotes: >-
      Every node after gross billings is informed by public peer filings rather than ADGT company disclosures; the
      bridge is therefore directional, not a forecast.
    claimRefs:
      - CI027
      - CI028
      - CI030
