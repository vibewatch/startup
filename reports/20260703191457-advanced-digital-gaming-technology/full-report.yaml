  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: What is actually disclosed versus merely reported
        blocks:
          - type: paragraph
            body: >-
              The primary evidence base is unusually narrow. The official Blackstone launch release and the mirrored NRT
              partner release clearly support one hard transaction number: funds managed by Blackstone invested US$250
              million into ADGT on 26 March 2026. Those same launch materials describe the company, its launch
              geography, and its positioning in the UAE gaming-payments stack, but they do not disclose a post-money
              valuation, ownership percentage, revenue denominator, ARR, customer count, or margin profile. That
              omission matters because valuation discussions around ADGT quickly moved from a sponsor-backed funding
              fact to an unsupported “unicorn” shorthand. The same caution holds in Blackstone's own investor-facing
              materials fetched for this run: the Q1 2026 10-Q, the April 2026 8-K earnings materials, and the Q1 2026
              earnings event page contain no ADGT reference or valuation disclosure. In other words, the primary public
              record proves sponsor backing and strategic intent, but not a disclosed current fair value.


              The ~$1 billion narrative comes from secondary and database-style reporting. MarketScreener / S&P Capital
              IQ reports that the round used convertible preferred stock and carries an estimated $1.0 billion
              post-money valuation. EnterpriseAM separately says ADGT is “understood to be valued at around USD 1 bn”
              and attributes that characterization to Bloomberg. But EnterpriseAM also reports the Blackstone check as
              $205 million, directly conflicting with the official $250 million press release. That inconsistency is
              important: it lowers confidence in the surrounding valuation framing and reinforces that the $1 billion
              figure is not a primary, management-disclosed, or investor-disclosed post-money number. The best public
              description is therefore “thinly corroborated secondary estimate,” not “verified valuation.”
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
