        title: Unit Economics, Cost Stack, and UAE Build-Out Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              The public-comparable cost stack is much clearer than ADGT’s own. Shift4 and PayPal both show that gross
              billings do not flow directly to EBITDA: interchange, assessments, processor fees, sponsor-bank costs,
              chargebacks, fraud, residual commissions, integration, support, and compliance consume a meaningful share
              of economics before overhead. PayPal’s 2025 transaction-loss rate of 0.07% of TPV shows that fraud losses
              can be contained at scale, but not avoided. Paysafe’s 20-F is the clearest adverse signal for this chapter
              because it ties almost half of revenue to online-gambling exposure while warning that licensing, bank
              diligence, chargebacks, and settlement risk can all pressure margins. The UAE build-out also looks
              unusually front-loaded in compliance and ecosystem work. White & Case says the new CBUAE law now captures
              technology-enablement platforms and can impose fines up to AED 1 billion. Wynn’s Ras Al Khaimah project is
              still under construction with a 2027 target, and secondary ecosystem reporting says launch-critical work
              includes certified casino-management systems, payments testing, AML/KYC, and responsible-gaming controls.
