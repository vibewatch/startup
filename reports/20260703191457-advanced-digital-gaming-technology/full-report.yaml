      - number: '3.2'
        title: Capability, pricing, and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              The most important comparison is not feature checklists in isolation but which vendors have already
              assembled enough adjacent capabilities to compress ADGT's differentiation window. Checkout.com is a scaled
              global PSP with fraud, identity verification, and hosted acceptance flows, but its public materials remain
              merchant-generic and sales-led rather than gaming-specific. PayTabs is more transparent on packaging,
              showing tailored flat-rate or interchange++ structures, yet it also reads like a broad PSP rather than a
              gaming infrastructure specialist. PayBy looks more locally adapted to UAE merchant operations, with online
              and offline acceptance, settlement, POS, and recurring billing, and its gaming-license announcement gives
              it the cleanest current UAE-gaming adjacency among mainstream fintechs. The global gaming specialists are
              stronger on gaming depth than on GCC regulatory proof: Sightline shows the richest omnichannel gaming
              wallet evidence; Paysafe shows the broadest global iGaming payment reach; Everi and NRT show the deepest
              land-based cash-access, compliance, and credit tooling. Public pricing is sparse almost everywhere, which
              limits straightforward price benchmarking but also implies enterprise deal-making, bundling, and
              discounting will matter more than published rate cards.
