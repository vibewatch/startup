      - number: '1.4'
        title: Regulatory Positioning, Milestones, and Risk Signals
        blocks:
          - type: paragraph
            body: >-
              ADGT’s strategic narrative depends heavily on regulation. The GCGRA is the sole UAE gaming regulator and
              repeatedly emphasizes licensing, financial-crime prevention, and severe penalties for unlicensed activity.
              Legal commentary further indicates that gaming-related vendors, controllers, directors, and executive
              officers can all fall into the regulatory perimeter. Against that backdrop, ADGT’s claim to be the only
              platform able to contract directly across both land-based and online channels is important if true. The
              problem is external verification. As of the run date, the GCGRA public our-licensees page listed 22
              gaming-related vendors and other category licensees, but ADGT did not appear by name. That does not
              necessarily falsify the claim—public registers can lag or use a different entity name—but it leaves a real
              corroboration gap. The same gap appears in benchmarking. Multiple 2024 sources said PayBy was the first
              fintech to receive a gaming-related vendor license, yet PayBy also did not appear on the current public
              roster. Combined with ADGT’s placeholder website and sparse operating disclosure, these are the main
              cautionary signals inside an otherwise high-profile launch story. The milestone record is therefore strong
              on timing and sponsor identity, but still incomplete on independently visible operating proof.
