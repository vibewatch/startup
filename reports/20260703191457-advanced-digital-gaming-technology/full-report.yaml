  foundingLocation: Abu Dhabi, United Arab Emirates
  headquarters: Abu Dhabi, United Arab Emirates
  productSummary: >-
    A unified payments, digital-wallet, real-time-funding, identity, and compliance/AML technology platform for
    regulated gaming operators, combining Sightline Payments' cashless wallet technology with NRT Technology's
    land-based cash-access/kiosk technology, aimed at giving both physical casino venues and online gaming platforms a
    single compliant payments rail.
  customerFocus: >-
    GCGRA-licensed land-based integrated resort/casino operators (e.g. the Wynn Al Marjan Island development in Ras Al
    Khaimah) and online/digital gaming platform licensees in the UAE, with stated ambitions to expand across the Middle
    East, Africa, and select international corridors.
  businessModel: >-
