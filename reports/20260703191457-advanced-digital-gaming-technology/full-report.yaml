      - number: '7.3'
        title: Concentration, competition, geopolitical, and hype risk
        blocks:
          - type: paragraph
            body: >-
              ADGT is also exposed to concentration risk on several axes at once. The company was formed around a small
              founding cluster of Blackstone, Raya, NRT, and Sightline, so sponsor, technology, and market-entry
              dependencies are visibly concentrated before there is public customer diversification. The public GCGRA
              register also points to a narrow near-term addressable market: Wynn Al Marjan is the only disclosed
              land-based facility licensee, and the published internet-gaming roster is also extremely short. That can
              help an early mover, but it also makes first-year revenue and reference-customer formation vulnerable to
              one market, one regulator, and a small number of counterparties. Meanwhile, ADGT will not operate in a
              vacuum. Sightline and NRT bring real gaming-payments experience, but broader incumbents such as Everi and
              large PSPs such as Checkout.com, plus regional processors like PayTabs, show that payments infrastructure,
              fraud tooling, and compliance workflow are contested layers rather than empty white space. Regional
              context adds another risk vector: EnterpriseAM explicitly framed Blackstone's check as occurring amid the
              Iran war, while Blackstone itself acknowledged near-term headwinds. Finally, the valuation narrative looks
              headline-led. Secondary press invoked a unicorn label and a Bloomberg-attributed US$1 billion valuation,
              but the launch materials themselves did not disclose valuation and direct database verification was
              blocked at fetch time.
