      - number: '3.3'
        title: Switching costs, substitutes, and internal-build risk
        blocks:
          - type: paragraph
            body: >-
              ADGT does have real switching-cost potential if it becomes embedded in licensing-facing controls, patron
              identity, wallet balances, payout flows, or floor hardware, because those systems are costly to re-certify
              and disruptive to move. Sightline's public materials show how sticky wallet, onboarding, and
              single-account flows can become once integrated into the patron journey, and Everi plus NRT show how
              land-based venues can anchor around cash-access, AML, and credit-automation stacks for years. Even so, the
              public evidence also argues against winner-take-all lock-in. Checkout, PayTabs, and PayBy all market APIs,
              hosted flows, or configurable merchant tooling; Sightline itself says operators will keep assembling
              best-of-breed fraud, AML, and KYC components; and the Resorts World deployment demonstrates that a major
              operator can co-develop a branded wallet experience instead of surrendering the whole front end to a
              vendor. Status-quo substitutes therefore remain credible: generic PSP rails online, cash handling plus
              credit/kiosk vendors on property, and multi-vendor assembly for groups that want negotiating leverage or
              tighter internal control.
