            body: >-
              The public leadership file is directionally clear but thin. Michael Dominelli is named as CEO across
              launch coverage, and Wamda even describes him as the founder, yet the reviewed materials provide little
              biography beyond that name. The partnership structure is clearer than the executive bench. Blackstone is
              the disclosed capital sponsor, Raya Holding is the Abu Dhabi-based strategic sponsor led by H.H. Sheikh
              Mohammed Bin Sultan Bin Khalifa Al Nahyan, and NRT Technology plus Sightline Payments provide the
              gaming-payments operating pedigree. That combination explains why ADGT could emerge fully formed with a
              strong market narrative. It does not, however, answer who controls board votes, who owns what percentage,
              or whether any partner has special governance protections. Public sources reviewed do not disclose a board
              roster, voting-right allocations, or the legal entity map behind the partnership. In a sector where the
              GCGRA can require licensing or suitability review not only for operating entities but also for
              controllers, directors, and executive officers, that governance opacity matters more than it would for an
              ordinary early-stage fintech.
