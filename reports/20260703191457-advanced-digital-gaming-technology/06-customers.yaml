- id: retention-and-switching
  title: Retention is undisclosed and switching frictions are high
  body: 'Retention and durability are currently unprovable from public materials. None of the reviewed ADGT sources provides NRR, renewals, churn, contract length, active accounts, transaction volume, or customer satisfaction disclosures. That does not mean the business lacks traction; it means public evidence is not yet sufficient to distinguish a licensed platform from a deployed, repeat-usage platform. Adoption also looks operationally heavy. GCGRA rules extend licensing obligations to third parties supplying products or services to the sector, and Wynn’s public surfaces imply structured supplier onboarding rather than lightweight self-serve procurement. Gaming Eminence adds that vendors should expect formal RFPs, localisation requirements, certification queues, and bank/payment friction. For a brand-new vendor, that combination increases switching costs for operators and raises the burden of proof on ADGT: it likely must show reference implementations, regulatory mapping, and integration
    readiness before customers will move core payment or compliance workflows.'
