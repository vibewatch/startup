chapter:
  number: 6
  title: Customers
  summary: 'ADGT’s UAE addressable customer base is currently extremely concentrated: one public lottery operator, one public land-based resort operator, and one public internet gaming licensee sit inside the operator universe, while 22 licensed vendors already surround them. No reviewed source names a live ADGT customer or pilot, so current customer proof is market-contextual rather than company-specific and the key diligence burden is to verify license-entity mapping, operator contracts, and repeat-usage evidence.'
sections:
- id: addressable-universe
  title: Addressable UAE buyer universe is real but tiny
  body: 'ADGT’s UAE customer universe is currently defined less by broad market size than by a regulator-curated license map. The GCGRA framework covers four operator categories—lottery, internet gaming, sports wagering, and land-based gaming facilities—while also separately licensing gaming-related vendors. On the public register reviewed on 2026-07-03, only three operator entities were populated: The Game LLC for lottery, Island 3 AMI FZ-LLC (DBA Wynn Al Marjan) for land-based gaming facilities, and Coin Technology Projects LLC for internet gaming. The sports wagering bucket was still empty. That means ADGT’s short-term reachable buyer set is tiny even before factoring procurement, integration, or brand credibility. The vendor side is broader, with 22 gaming-related vendors on the public register, but those companies are mostly ecosystem counterparts or competitors rather than direct revenue customers for ADGT. In practical terms, the UAE market is open, but customer concentration is structurally
    extreme until more operator licenses are issued.'
