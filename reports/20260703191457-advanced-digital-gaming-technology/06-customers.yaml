- id: named-customer-proof
  title: No named ADGT customer proof yet; broader market proof exists
  body: 'No reviewed ADGT primary or secondary source supplied direct company-specific customer proof. Blackstone’s announcement, the NRT mirror, Morgan Lewis’ deal note, and follow-up press all explain the platform and capital structure, but none names a live operator customer, pilot, or deployment reference. The company website adds no compensating evidence because it remains a placeholder page. To satisfy customer-proof requirements, the best available evidence is therefore market-contextual: Wynn Al Marjan is the flagship licensed land-based operator publicly targeting a 2027 opening; The Game LLC is the named lottery operator; Coin Technology Projects LLC is the named internet gaming licensee; and Play971 provides a public online gaming surface in the market, albeit without a clean entity-to-brand disclosure on the fetched page. Fresh 2026 review also did not surface ADGT, NRT, or Sightline being publicly named as Wynn’s selected payments or cashless vendor. That absence is meaningful
    because it keeps ADGT’s traction story at the thesis stage, not the reference-customer stage.'
