- id: mitigations-monitoring-and-kill-criteria
  title: Mitigations, monitoring, and kill criteria
  body: 'The investable version of this thesis requires replacing narrative with documentary proof quickly. First, ADGT should be treated as a revocable, regulator-dependent launch rather than a durable licensed monopoly until management can map the ADGT brand to a specific GCGRA legal entity, show its licence term and renewal path, and clarify any CBUAE Article 62 exposure. Second, management needs to prove production reality: named customers, signed contracts, go-live dates, throughput, uptime, fraud losses, and renewal signals. Third, sponsor and partner concentration needs contractual mitigation through replacement rights, clearly allocated control ownership, and a visible pipeline beyond one flagship UAE venue. Fourth, any valuation discussion should be anchored to primary financing documents instead of the public unicorn label. The practical kill criteria are straightforward and observable from public or easily diligenced materials: loss of register visibility, failure to regularise
    any payments permissions by the September 2026 deadline, no live customer proof within the first operating year, and continued absence of primary valuation support. Until those items are closed, the residual risk profile remains high even if the strategic positioning is attractive.'
