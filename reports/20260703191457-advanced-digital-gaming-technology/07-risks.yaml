  evidenceGaps:
  - type: missing-source
    severity: material
    topic: license-entity-mapping
    missingEvidence: A direct regulator or company document mapping the ADGT brand to the exact GCGRA-licensed legal entity and licence number.
    whyItMatters: The moat claim and renewal risk depend on knowing whether ADGT itself, a partner, or an affiliated legal entity holds the operative licence.
    diligencePath: Request the GCGRA licence certificate, legal-entity chart, and any regulator correspondence confirming the licensed applicant.
    relatedQuestionRefs:
    - QR003
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: operating-proof
    missingEvidence: Named operator contracts, production go-live dates, throughput, uptime, fraud-loss, chargeback, and renewal metrics for the platform.
    whyItMatters: Without live operating metrics, investors cannot distinguish a concept launch from a scaled, resilient payments platform.
    diligencePath: Request customer references, signed operator contracts, monthly KPI dashboards, SLA history, and renewal or retention evidence.
    relatedQuestionRefs:
    - QR014
    relatedTableRefs:
    - TR002
    - TR004
  - type: access-blocked
    severity: minor
    topic: valuation-verification
    missingEvidence: Direct access to the underlying database record or other primary valuation evidence supporting the unicorn claim.
    whyItMatters: A hype-driven price anchor can distort underwriting if no cap-table, board, or signed financing documents support it.
    diligencePath: Obtain a cap table, board-approved financing memo, or read-only database export from Crunchbase or another verified data provider.
    relatedQuestionRefs:
    - QR027
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: A complete public schedule of GCGRA fees, renewal terms, public enforcement actions, and all vendor or service-provider boundary rulings.
    whyItMatters: The risk register cannot be exhaustive when core cost, renewal, and enforcement precedents remain only partially public.
    diligencePath: Ask counsel for fee tables, renewal notices, prior enforcement orders, and written regulator guidance on service-provider scope.
    relatedQuestionRefs:
    - QR004
    - QR005
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: regulator-coordination
    missingEvidence: Public or private documents showing how GCGRA, CBUAE, and any other UAE financial regulators allocate oversight where gaming and payments overlap.
    whyItMatters: Boundary uncertainty can create duplicate licensing, delayed launches, or conflicting compliance obligations for a payments-and-compliance platform.
    diligencePath: Request counsel memos, regulator meeting notes, or written no-objection letters covering ADGT’s payment flows and supervisory perimeter.
    relatedQuestionRefs:
    - QR012
    relatedTableRefs:
    - TR003
