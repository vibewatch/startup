- id: aml-and-platform-execution-risk
  title: AML, platform, and execution risk
  body: Even if the licensing architecture ultimately proves workable, ADGT still faces classic execution risk because it is a brand-new platform with no public operating history and no disclosed production metrics. The launch materials describe an ambitious stack spanning wallets, payout rails, identity, and compliance monitoring, but the reviewed public sources do not identify named customers, live operator contracts, throughput, uptime, fraud-loss, or renewal figures. That absence is especially important in gaming-adjacent payments because AML and fraud controls are not decorative compliance modules; they are business-critical operating systems. Legal commentary and gaming-regtech analysis consistently point back to DNFBP-style AML obligations such as CDD, EDD, suspicious-transaction reporting, MLRO ownership, sanctions screening, and independent audit expectations. A control failure here can simultaneously create regulatory exposure, reputational damage, and operator churn. The people
    risk is similarly concentrated. Public launch coverage clearly names Michael Dominelli as CEO, but it does not reveal a deeper operating bench or publicly named compliance and technology control owners. For underwriters, that means the platform is not yet de-risked by public proof of resilient operations, repeatable controls, or a broad management bench.
