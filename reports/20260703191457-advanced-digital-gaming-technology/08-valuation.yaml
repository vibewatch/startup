- id: comparable-lenses
  title: Comparable and market-growth lenses
  body: |-
    Because ADGT has not disclosed revenue or ARR, a normal current-period valuation exercise is impossible. The best available substitute is to build lenses around comparable public payment-infrastructure companies, an adjacent gaming-fintech transaction, and the growth profile of the UAE / broader MENA gaming environment. On current public market data, relevant payment infrastructure references span a wide but not unbounded range: Paysafe screens at about 0.25x market-cap-to-revenue, Shift4 at about 1.22x, dLocal at about 4.00x, and Flywire at about 3.71x, with a median around 2.46x. An adjacent gaming-fintech M&A reference, the Everi/IGT combination, implies about 2.3x EV/revenue. These are imperfect comps, but they are directionally useful because they translate the “unicorn” conversation into the missing denominator problem: what revenue run rate would be needed to make $1 billion plausible?

    On that math, a $1 billion value would require roughly $400 million of revenue at a 2.5x multiple, roughly $250 million at a 4.0x multiple, and still about $200 million at a premium 5.0x multiple. Public sources do not show that denominator today. The market-growth backdrop is supportive but not enough by itself to close the gap. AGB / CBRE describes a potential UAE gaming TAM around $8.5 billion, while HLB HAMT cites a $3-5 billion annual GGR range. Precedence Research and Niko both support the broader thesis that MENA gaming demand is growing and that payments infrastructure is a genuine bottleneck. But TAM is not ADGT revenue, and Niko's own work highlights monetization friction, underbanked users, and the need for localized payments. Those conditions support the strategic case for ADGT, yet they do not verify that the company already has the contracts, payment volume, or economics needed to support a near-unicorn current mark.
