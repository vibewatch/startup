- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - 'Thesis: blue-chip sponsor backing and legal structuring suggest ADGT is more than a concept-stage shell.'
    - Private diligence showing the capital is smaller, more contingent, or structurally senior to common would weaken this.
  - - 'Thesis: UAE / MENA gaming and payments infrastructure are opening into a real addressable market.'
    - If operator rollout slips or the regulatory opening narrows, the market-timing premium falls.
  - - 'Anti-thesis: no public revenue, customer, or margin data exists to support a current premium valuation.'
    - A management KPI deck with signed contracts, payment volume, and take-rate evidence would materially improve confidence.
  - - 'Anti-thesis: the licensed vendor field is broadening, so exclusivity could compress faster than the narrative implies.'
    - Proof that ADGT has a differentiated license pathway or flagship exclusive contracts would reduce this concern.
  notes: The anti-thesis is evidence-backed and intentionally price-sensitive; the chapter does not assume that sponsor quality alone proves value.
