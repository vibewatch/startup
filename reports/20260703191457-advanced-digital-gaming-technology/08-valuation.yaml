- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Revenue / ARR bridge
    - Current run-rate, payment volume, take rate, margin, and cohort trends.
    - Without a denominator, no current fair-value claim is verifiable.
    - Request monthly KPI pack and board materials.
  - - Customer contracts
    - Signed agreements, implementation timelines, and launch scope with operators or venues.
    - Bull and base cases depend on real payment flows, not only licensing position.
    - Obtain contract excerpts, LOIs, and pipeline review with management.
  - - Cap table / preferences
    - Full financing stack, liquidation preferences, conversion terms, and governance rights.
    - Convertible preferred stock can materially change common-equity value.
    - Review term sheet, waterfall model, and reserved-matters schedule.
  - - License pathway
    - Entity-to-license mapping and regulator explanation of ADGT's cross-channel contracting claim.
    - The uniqueness narrative is a major source of valuation premium.
    - Ask management and counsel for license documentation and regulator correspondence.
  - - Database / media valuation trail
    - Primary screenshots or extracts from Bloomberg / Crunchbase / S&P Capital IQ.
    - Would determine whether the $1bn narrative is a real market datum or merely repeated hearsay.
    - Use licensed terminals or investor relations follow-up to verify upstream records.
  notes: The diligence list is intentionally short and directly tied to the variables that would move the recommendation or valuation stance.
