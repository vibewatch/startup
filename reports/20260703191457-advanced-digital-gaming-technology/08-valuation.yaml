- id: remaining-diligence
  title: Final diligence asks and thesis-break triggers
  body: |-
    Three diligence gaps dominate. First, public materials do not bridge ADGT's licensing position to any disclosed operator contract, customer list, payment volume, or revenue run rate. That is the key blocker because every valuation method eventually needs a denominator. Second, MarketScreener is the only fetched source that adds capital-structure detail, reporting convertible preferred stock and an estimated $1.0 billion post-money valuation. Without the cap table, liquidation preferences, reserved matters, and governance rights, investors cannot tell whether the headline round economics translate cleanly into common-equity value. Third, the market is not standing still: the GCGRA register already shows a widening vendor field, PayBy has publicly secured a gaming-related vendor license for payments services, and the broader regulatory perimeter around enabling payments technology is becoming more demanding rather than less.

    The unresolved verification problem on the reported $1 billion figure also remains important. Direct Crunchbase pages were inaccessible during this run, and no Bloomberg original story was directly retrievable here, so the database-style valuation narrative cannot be independently re-verified from its apparent upstream sources. That does not invalidate the secondary reports, but it does cap confidence. The correct investment-committee treatment is to log $250 million as the only hard primary number, log “~$1 billion post-money” as thinly corroborated third-party reporting, and require private revenue, contracts, and preference documents before treating the round as evidence of verified unicorn economics.
