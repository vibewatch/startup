- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bear
    - ADGT reaches only ~$50m revenue and loses scarcity faster than expected.
    - $75m-$125m at roughly 1.5x-2.5x revenue.
    - Competitive compression, slow operator wins, regulatory friction.
    - Closest to today's public-proof floor because operating metrics are absent.
  - - Base
    - ADGT signs early flagship operators and reaches about ~$100m revenue with visible payment volume.
    - $250m-$400m at roughly 2.5x-4.0x revenue.
    - Execution, take-rate, and preference overhang still matter.
    - Reasonable if launch traction is real but not yet scaled.
  - - Bull
    - ADGT proves ~$200m revenue and sustains premium strategic scarcity in a fast-opening UAE market.
    - $800m-$1.0bn at roughly 4x-5x revenue.
    - Requires both contracts and durable differentiation.
    - Possible, but not something the public record currently verifies.
  notes: All ranges are illustrative scenario outputs in USD millions; ADGT has not publicly disclosed the current denominator needed for a point valuation.
