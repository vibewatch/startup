- id: scenario-judgment
  title: Scenario-backed judgment and recommendation
  body: |-
    The scenario work therefore has to be milestone-based rather than point-estimate-based. A bear case assumes ADGT converts its launch narrative into only modest commercial traction, reaching something like $50 million of revenue and attracting a 1.5x-2.5x multiple similar to pressured or more mature payment platforms; that points to roughly $75-125 million of value. A base case assumes ADGT successfully signs early flagship operators, proves payment volume, and reaches around $100 million of revenue; at 2.5x-4.0x, that supports roughly $250-400 million. Only the bull case — roughly $200 million of revenue plus a 4x-5x multiple that preserves meaningful scarcity value — gets ADGT into the $800 million-$1.0 billion range. Put differently, the public evidence does not show that $1 billion is impossible; it shows that $1 billion is an upside milestone case, not a currently verified fact.

    That leads to a conservative recommendation. The sponsor roster, the UAE regulatory opening, and the payments-orchestration need in gaming all support strategic interest. But the public record remains too thin to underwrite current entry price discipline. The fastest way for valuation support to improve would be a private diligence package showing signed operator contracts, revenue run rate, payment volume, take-rate economics, and the exact rights attached to the reported convertible preferred stock. Until that appears, the sensible public-market style read-through is research-more, medium confidence, high risk, and stretched valuation optics.
