  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-preferences
    missingEvidence: Full term sheet, cap table, liquidation preferences, conversion terms, and governance rights for the Blackstone-led round.
    whyItMatters: MarketScreener reports convertible preferred stock, so headline post-money may not translate cleanly into common-equity value.
    diligencePath: Request executed financing documents, a waterfall model, and board-reserved-matters schedule from management and counsel.
    relatedQuestionRefs:
    - QV007
  - type: access-blocked
    severity: material
    topic: database-valuation-verification
    missingEvidence: Direct upstream database evidence from Crunchbase or Bloomberg supporting the reported ~$1 billion valuation.
    whyItMatters: Without the upstream data record, the chapter can only classify the $1 billion narrative as thinly corroborated secondary reporting.
    diligencePath: Verify the round inside licensed Bloomberg / Crunchbase / Capital IQ access and preserve screenshots or exports for the ledger.
    relatedQuestionRefs:
    - QV031
  - type: private-evidence-only
    severity: blocking
    topic: revenue-denominator
    missingEvidence: Current revenue run rate, payment volume, take rate, ARR, gross margin, and customer concentration metrics.
    whyItMatters: No current fair-value conclusion is defensible without the denominator and the quality of that denominator.
    diligencePath: Request monthly KPI packs, cohort economics, operator onboarding funnels, and audited management accounts.
    relatedQuestionRefs:
    - QV032
  - type: private-evidence-only
    severity: material
    topic: contract-proof
    missingEvidence: Signed operator and venue contracts, implementation dates, and payment-volume ramps for flagship accounts.
    whyItMatters: The bull and base cases assume the licensing position converts into real transaction volume and take-rate revenue.
    diligencePath: Review contract excerpts, launch milestones, pipeline conversion assumptions, and customer reference calls.
    relatedQuestionRefs:
    - QV024
    - QV025
    - QV026
  - type: enumeration-incomplete
    severity: material
    topic: comparable-valuation-table
    missingEvidence: More direct 2026 private gaming-fintech round and transaction comps with disclosed valuation denominators.
    whyItMatters: The comparable table relies mainly on public payment infrastructure comps plus one adjacent gaming-fintech transaction because the private market set is sparse and under-disclosed.
    diligencePath: Expand the comp set with licensed database access, sponsor outreach, and private round documents before treating the scenario ranges as precision pricing.
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: material
    topic: license-uniqueness
    missingEvidence: Documentary explanation of ADGT's exact licensing pathway and why it can contract across both land-based and online channels while other vendors are also being licensed.
    whyItMatters: That uniqueness claim is a major source of valuation premium in the launch narrative.
    diligencePath: Obtain regulator or management documentation mapping legal entities to permissions and counterparties.
    relatedQuestionRefs:
    - QV015
    - QV016
    - QV017
