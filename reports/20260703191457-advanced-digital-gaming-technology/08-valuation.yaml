- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue proof misses the milestone path
    - Private diligence shows run-rate well below the ~$100m base-case path.
    - Removes the denominator needed for anything above a modest valuation anchor.
    - Downgrade any premium pricing assumption immediately.
  - - Cap-table overhang is severe
    - Preferences, ratchets, or governance rights make common-equity economics unattractive.
    - Headline post-money stops being an investable common-equity proxy.
    - Re-price the opportunity or walk away.
  - - Regulatory perimeter tightens
    - CBUAE / GCGRA implementation materially restricts payment-enabling infrastructure economics.
    - Compresses margin and increases compliance cost.
    - Move valuation toward bear-case assumptions.
  - - Flagship contracts go elsewhere
    - Another licensed payment vendor wins the key operator or venue relationships first.
    - Undercuts the first-mover premium embedded in bullish scenarios.
    - Remove scarcity premium from the model.
  - - The $1bn label cannot be reconciled privately
    - Management cannot bridge the reported round mark to contracts, revenue, or term-sheet economics.
    - Turns the unicorn narrative into branding rather than evidence.
    - Treat reported valuation as non-actionable marketing noise.
  notes: These triggers are designed for investment-committee use and tie directly to revenue support, preference economics, and regulatory durability.
