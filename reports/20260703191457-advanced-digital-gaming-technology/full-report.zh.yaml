  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入 / ARR 桥接
        - 当前收入年化、支付量、抽成率、利润率和客户分群趋势。
        - 没有分母，任何当前公允价值说法都无法验证。
        - 索取月度 KPI 包和董事会材料。
      - - 客户合同
        - 已签协议、实施时间表，以及与运营商或场馆的上线范围。
        - 乐观和基准情景都靠真实支付流支撑，而不只是牌照位置。
        - 获取合同摘录、LOI，并与管理层核对管线。
      - - 股权结构 / 优先权
        - 完整融资层级、清算优先权、转换条款和治理权利。
        - 可转换优先股可能显著改变普通股价值。
        - 审阅条款清单、瀑布模型和保留事项清单。
      - - 牌照路径
        - 实体与牌照映射，以及监管方对 ADGT 跨渠道签约说法的解释。
        - 独特性叙事是估值溢价的主要来源。
        - 向管理层和律师索取牌照文件及监管往来函件。
      - - 数据库 / 媒体估值线索
        - 来自 Bloomberg / Crunchbase / S&P Capital IQ 的原始截图或摘录。
        - 可判断 $1bn 叙事是真实市场数据，还是被反复转述的传闻。
        - 用授权终端或投资者关系跟进核验上游记录。
    notes: 尽调清单刻意压短，并直接绑定会改变推荐结论或估值立场的变量。
