        - 只有 Blackstone 的 $250 million 出资是一手且高置信度证据。
        - Blackstone 和 NRT 官方披露了金额；没有一手披露的投后估值。
        - 不要仅凭启动新闻稿承销已验证的独角兽估值。
      - - 报道中的 $1 billion 标签
        - 佐证很薄的二手估计，不是已验证事实。
        - MarketScreener / S&P Capital IQ 和 EnterpriseAM 提到 ~$1 billion；一手来源没有提。
        - 把这个数字当作需要私下尽调验证的天花板参照，而不是当前公允价值。
      - - 当前建议
        - 继续研究 / 中等信心 / 高风险
        - 赞助方质量和市场开放是真实的，但运营分母缺失。
        - 只有完成合同、收入和股权结构表的私下尽调后才推进。
      - - 回报逻辑
        - 基于里程碑，而非基于当前价值
        - 要支撑 $1 billion 结果，按不同倍数约需 $200 million-$400 million 收入。
        - 定价锚定已披露的里程碑证据，而不是品牌叙事。
    notes: 判断综合了一手披露、二手估值报道，以及截至运行日期的公开可比公司测算。
