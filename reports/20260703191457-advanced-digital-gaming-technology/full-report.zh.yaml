      - number: '5.3'
        title: 来自 Sightline 与伙伴的钱包、身份与合规控制平面
        blocks:
          - type: paragraph
            body: >-
              Sightline 贡献了 ADGT 声称在线上博彩和全渠道度假村消费中需要的钱包和数字旅程逻辑。公开产品页描述了可跨老虎机、桌台、体育投注、iGaming、彩票和非博彩度假村消费的单账户模型，而 Deposit
              和 Debit 增加了运营商资金管理和开环消费者消费路径，覆盖纯闭环赌场钱包够不到的场景。最相关技术信号是合规集成：Sightline 与 GeoComply 的合作明确提到客户旅程关键步骤中的
              BSA、OFAC、KYC、AML 和地理定位检查；GeoComply 自己的文档则展示了预期供应商模式——单 API 瀑布式验证、制裁筛查、自拍检查、基于 SDK 的地理定位和设备完整性监控。Sightline
              2026 年身份认证和欺诈文章又补了一条线索：控制平面被设计为分层授权、触点识别和自动异常检测，而不只是轻量消费者钱包。若 ADGT
              想让一个平台同时覆盖新近受监管市场中的博彩场地和互联网博彩资金流，它恰恰需要这类栈。
