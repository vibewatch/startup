        - ADGT 收入只达到 ~$50m，稀缺性流失快于预期。
        - 按约 1.5x-2.5x 收入，对应 $75m-$125m。
        - 竞争压缩、运营商拓展慢、监管摩擦。
        - 由于缺少运营指标，最接近当前公开证据下限。
      - - 基准
        - ADGT 签下早期旗舰运营商，收入约达 ~$100m，并有可见支付量。
        - 按约 2.5x-4.0x 收入，对应 $250m-$400m。
        - 执行、抽成率和优先权包袱仍然关键。
        - 如果上线牵引力真实但尚未规模化，这一情景合理。
      - - 牛
        - ADGT 证明 ~$200m 收入，并在快速开放的阿联酋市场守住高溢价战略稀缺性。
        - 按约 4x-5x 收入，对应 $800m-$1.0bn。
        - 需要合同和可持续差异化同时成立。
        - 可能成立，但当前公开记录无法验证。
    notes: 所有区间都是以百万美元计的示意性情景结果；ADGT 尚未公开点估值所需的当前分母。
