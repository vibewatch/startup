              是普通股、优先股、结构化股权、可转债还是分阶段提款工具，也未披露持股比例、董事会权利、清算优先权，或技术合作方如何参与经济分配。Blackstone 自己最新提交的 10-Q
              主要价值在于它没说什么：本次审阅的文件中没有点名 ADGT，因此该投资尚未在最近 SEC 季度披露中作为具体已识别组合持仓出现。同样的缺席延伸到 ADGT
              占位官网，那里仍没有收入、烧钱速度、员工数或现金跑道数据。本次运行中找到的唯一公开估值引用，是 EnterpriseAM 归因于 Bloomberg 的“约 US$1
              billion”表述；这个证据太薄，不能支撑为已确认投后估值。
