chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与定位
        blocks:
          - type: paragraph
            body: >-
              ADGT 应被看作一个新近启动的 Abu Dhabi 金融科技与博彩基础设施平台，而不是一家已长期运营、拥有深厚独立公开记录的公司。最清晰的来源是 Blackstone 的 26 March 2026
              公告，公告把 ADGT
              介绍为从阿联酋启动的新设支付与数据智能技术平台。官方与独立报道口径基本一致：面向受监管博彩和相邻数字市场，提供一套支付、身份与合规栈；起步聚焦阿联酋、中东更广区域、非洲和部分国际通道。产品描述比运营披露具体得多。管理层称，平台整合数字钱包、入金和出金轨道、身份与访问控制、合规监控，以及可互操作的闭环
              / 开环控制。这足以判断 ADGT 卖什么，但不足以推断当前商业规模，因为公开来源未披露收入、客户、部署或员工规模。公司官网进一步支持这种谨慎判断：截至运行日，它仍只是一个单词占位页，不是实质性的公司或产品网站。
