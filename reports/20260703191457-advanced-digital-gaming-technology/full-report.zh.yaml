  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与推断基础架构
        blocks:
          - type: paragraph
            body: >-
              ADGT 自己的公开界面今天几乎为空——本次运行抓取的 adgt.ai 网站只是占位页——因此最佳架构判断来自 March 2026 Blackstone 公告，以及底层 NRT 和 Sightline
              产品界面。Blackstone 称 ADGT 是面向阿联酋线下和线上博彩的统一支付与合规平台，并明确列出核心构件：数字钱包、实时入金和出金轨道、身份与访问管理、合规监控，以及闭环和开环生态控制。这些功能与数字侧
              Sightline 的 Play+ / 预付 / 借记账户模型，以及线下侧 NRT 的账房、自助终端、出金、信用和 AML 资产异常吻合。因此技术结论不是 ADGT 已展示原生从零新建栈；更可能的是，ADGT
              起步是一个阿联酋本地化编排层，包在已验证但高度集成的美国博彩支付组件外面。
