        - 官方披露已确认
        - 提供开业资产负债表、交割时现金，以及任何指定用途或受限现金。
      - - 融资工具类型 / 所有权
        - 未公开披露。
        - 官方材料没有说明这笔资金是普通股、优先股、结构性股权、债务，还是分阶段承诺。
        - 缺失
        - 提供证券类型、持股比例、董事会权利、清算优先权和投资人保护条款。
      - - 现金余额 / 不受限流动性
        - null
        - 没有可用的公开数字。
        - 缺失
        - 提供当前现金、受限现金和最低监管准备金要求。
      - - 烧钱 / 跑道
        - null
        - 无法用公开材料计算跑道。
        - 缺失
        - 提供月度烧钱桥、固定与可变运营开支拆分，以及下行情景跑道。
      - - 商业化依赖
        - Wynn 生态和阿联酋供应商市场到 2027 年前看起来都偏窄。
        - 在多家运营商上线前，资本可能需要支撑更长的规模化前阶段。
        - 据公开市场结构推断
        - 按交易对手提供已签销售管线、上线日期和最低收入里程碑。
      - - 合规 / 认证负担
        - 公开监管和供应商报告显示，许可、审计、AML 和集成支出会前置。
        - 稳态交易量到来前，很大一部分资本可能已经被消耗。
        - 据公开监管背景推断
        - 提供第一年运营前的合规预算、认证时间表和准备金假设。
    notes: 本表把已确认的融资总额，与仍未披露的更大一组资本充足性问题分开。
