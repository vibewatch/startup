      - number: '7.4'
        title: 缓释措施、监控与终止标准
        blocks:
          - type: paragraph
            body: >-
              这个投资假设要成立，必须尽快用文件证据替代叙事。第一，在管理层能把 ADGT 品牌映射到具体 GCGRA 法人实体、展示牌照期限和续期路径，并澄清任何 CBUAE 第 62 条敞口之前，ADGT
              应被视为一个可撤回、依赖监管的启动项目，而不是稳固的持牌垄断。第二，管理层需要证明生产环境事实：具名客户、已签合同、上线日期、吞吐量、可用性、欺诈损失和续约信号。第三，出资方和合作伙伴集中度需要通过替换权、清晰划分的控制权归属，以及一个不止于阿联酋单一旗舰场馆的可见管线来做合同缓释。第四，任何估值讨论都应锚定一手融资文件，而不是公开独角兽标签。实际终止标准很直接，也能从公开或容易尽调的材料中观察：登记册可见性消失、未能在
              2026 年 9 月期限前完成任何支付许可补正、首个运营年度内没有真实客户证据，以及持续缺少一手估值支持。在这些事项关闭前，即便战略定位有吸引力，剩余风险画像仍然偏高。
