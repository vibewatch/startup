      - number: '4.4'
        title: 公开缺口与财务结论
        blocks:
          - type: paragraph
            body: >-
              投资判断的卡点不是缺少战略叙事，而是缺少公司数据。公开证据支持四个边界条件：ADGT
              拥有赞助方支持的启动资本，监管边界真实存在，运营模型可能类似打包的博彩支付基础设施栈，成熟公开处理商在达到规模后可在网络费用之后产生健康利润率。这些都回答不了 ADGT
              自身的基本投资问题。仍然没有公开收入数字、客户数、员工数、毛利率披露、月度烧钱、现金余额、现金跑道，也没有官方估值支持。即便许可主张也只完成了部分映射，因为 GCGRA 公开名册没有按名称列出
              ADGT，尽管公告对跨渠道签约权措辞强烈。因此，本章财务结论谨慎：US$250 million
              看起来足以支持初期阿联酋启动和区域建设，但缺少私人运营和融资材料，就无法判断收入质量、利润率路径，或资本到底充裕、仅仅够用，还是已被结构性承诺占用。
