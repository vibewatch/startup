      - number: '1.4'
        title: 监管定位、里程碑与风险信号
        blocks:
          - type: paragraph
            body: >-
              ADGT 的战略叙事高度依赖监管。GCGRA
              是阿联酋唯一博彩监管机构，反复强调许可、金融犯罪防控，以及对无牌活动的重罚。法律评论进一步显示，博彩相关供应商、控制人、董事和高管都可能落入监管边界。在这个背景下，如果 ADGT
              称可同时直接覆盖线下和线上渠道的唯一平台属实，这一点很重要。问题在外部验证。截至运行日，GCGRA 公开 our-licensees 页面列出 22 家博彩相关供应商及其他类别持牌方，但没有以 ADGT
              名称出现。这不一定推翻该主张——公开名册可能滞后，或使用不同实体名——但留下真实佐证缺口。基准比较中也有同样缺口。多个 2024 年来源称 PayBy 是首家获得博彩相关供应商许可的金融科技公司，但 PayBy
              也没有出现在当前公开名册。ADGT 官网占位、运营披露稀疏，再叠加这些信号，就是这个高调启动故事中的主要警示。里程碑记录因此在时间和赞助方身份上强，但在可由独立方看见的运营证明上仍不完整。
