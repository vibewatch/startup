  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 可触达的阿联酋买方宇宙真实但很小
        blocks:
          - type: paragraph
            body: >-
              ADGT 的阿联酋客户宇宙目前更多由监管方策划的许可地图定义，而不是由广义市场规模定义。GCGRA
              框架覆盖四类运营商——彩票、互联网博彩、体育博彩和线下博彩设施——同时单独许可博彩相关供应商。2026-07-03 审阅的公开名册上，只有三个运营实体有信息：The Game LLC 对应彩票，Island 3
              AMI FZ-LLC（DBA Wynn Al Marjan）对应线下博彩设施，Coin Technology Projects LLC
              对应互联网博彩。体育博彩栏仍为空。这意味着，即便不考虑采购、集成或品牌可信度，ADGT 短期可触达买方集合也很小。供应商侧更宽，公开名册上有 22 家博彩相关供应商，但这些公司多数是生态对手方或竞争者，而不是
              ADGT 的直接收入客户。实际看，阿联酋市场已经打开，但在更多运营商牌照发出之前，客户集中度在结构上极端。
