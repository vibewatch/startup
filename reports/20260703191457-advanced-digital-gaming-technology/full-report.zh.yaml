      - number: '8.2'
        title: 可比公司与市场增长视角
        blocks:
          - type: paragraph
            body: >-
              ADGT 没有披露收入或 ARR，因此无法做正常的当前期估值。最好的替代办法，是围绕可比上市支付基础设施公司、相邻博彩金融科技交易，以及阿联酋 / 更广泛 MENA
              博彩环境的增长画像建立几组视角。按当前公开市场数据，相关支付基础设施参照物区间很宽，但不是无限宽：Paysafe 的市值 / 收入约为 0.25x，Shift4 约为 1.22x，dLocal 约为
              4.00x，Flywire 约为 3.71x，中位数约 2.46x。相邻博彩金融科技 M&A 参照物 Everi/IGT 组合，隐含约 2.3x EV /
              收入。这些可比样本并不完美，但有方向性价值，因为它们把「独角兽」讨论转化为缺失分母问题：需要多少收入运行率，才能让 $1 billion 显得合理？


              按这个数学，$1 billion 估值在 2.5x 倍数下大约需要 $400 million 收入，在 4.0x 倍数下大约需要 $250 million，即便给到 5.0x 的溢价倍数，也仍需约 $200
              million。公开来源今天没有显示这个分母。市场增长背景有支撑，但本身不足以补上缺口。AGB / CBRE 描述的阿联酋潜在博彩 TAM 约为 $8.5 billion，HLB HAMT 则引用 $3-5
              billion 年度 GGR 区间。Precedence Research 和 Niko 都支持更广泛的论点：MENA 博彩需求在增长，支付基础设施确实是瓶颈。但 TAM 不是 ADGT 收入，Niko
              自己的研究也强调变现摩擦、银行服务不足用户以及本地化支付需求。这些条件支撑 ADGT 的战略逻辑，却不能验证公司已经拿到足以支撑接近独角兽当前估值的合同、支付量或经济性。
