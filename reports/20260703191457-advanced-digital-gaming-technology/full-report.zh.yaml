  - id: FI001
    title: 收入模型桥接图
    type: flow
    layout: wide
    summary: 如果按公开支付基础设施同行的商业化方式落地，ADGT 披露的产品层可能如何把受监管博彩交易活动转成净收入和毛利。
    data:
      nodes:
        - id: operator-and-player-activity
          label: 运营商 / 玩家活动
          detail: 线下和线上博彩交易是经济起点，但 ADGT 未披露活跃运营商、场馆或交易量。
        - id: processing-layer
          label: 处理层
          detail: 按交易量收取的支付处理费，可能叠加固定和最低收费，是 Shift4 和 PayPal 公开资料中最接近的类比。
        - id: wallet-and-payout-layer
          label: 钱包 / 入金 / 出款层
          detail: 数字钱包、即时入金、出款、FX 和替代支付方式可在核心处理价差之外增加附加收入。
        - id: compliance-software-layer
          label: 身份 / 合规软件层
          detail: 监控、身份和访问控制可作为打包软件，或按账户 / 按检查次数变现。
        - id: net-revenue
          label: 净收入
          detail: ADGT 实际抽成率未披露，因此支付价差与类软件收入之间的混合比例未知。
        - id: gross-profit
          label: 毛利
          detail: 毛利取决于交换费、网络、银行、欺诈和支持成本中有多少被转嫁、多少被吸收。
      edges:
        - from: operator-and-player-activity
          to: processing-layer
        - from: processing-layer
          to: wallet-and-payout-layer
        - from: processing-layer
          to: compliance-software-layer
        - from: wallet-and-payout-layer
          to: net-revenue
        - from: compliance-software-layer
          to: net-revenue
        - from: net-revenue
          to: gross-profit
    approximationNotes: 节点中，公司已官方披露的部分按 ADGT 口径；变现机制未公开说明的部分，则来自同行推导。
    claimRefs:
      - CI006
      - CI022
      - CI029
      - CI033
      - CI044
  - id: FI002
    title: 单位经济模型桥接图
    type: flow
    layout: wide
    summary: 定性成本桥接图显示：投资者若要从发布资本额推到真实利润率承保，ADGT 还需要披露哪些公开同行口径输入。
    data:
      nodes:
        - id: gross-billings
          label: 总账单额 / 交易量
          detail: 交易量未披露，但同行申报显示，交易量是支付收入的主要驱动。
        - id: pricing-yield
          label: 定价收益率 / 抽成率
          detail: 固定与可变定价，加上 FX / 出款 / 钱包附加费用，决定总变现能力。
        - id: network-and-funding-costs
          label: 交换费 / 网络 / 资金成本
          detail: 处理商和钱包在毛利显现前，需要支付银行卡、银行和结算成本。
        - id: fraud-and-chargebacks
          label: 欺诈 / 拒付 / 损失
          detail: 损失率在规模化后可以可控，但仍重要，尤其是在博彩和钱包入金流程中。
        - id: compliance-and-support
          label: 合规 / 牌照 / 支持
          detail: AML、KYC、审计、认证、赞助银行尽调和客户支持都会在 EBITDA 前吃掉利润率。
        - id: ebitda
          label: EBITDA 潜力
          detail: 公开同行显示，成熟阶段可以有不错的经济性，但 ADGT 未披露任何基期收入或成本。
      edges:
        - from: gross-billings
          to: pricing-yield
        - from: pricing-yield
          to: network-and-funding-costs
        - from: network-and-funding-costs
          to: fraud-and-chargebacks
        - from: fraud-and-chargebacks
          to: compliance-and-support
        - from: compliance-and-support
          to: ebitda
    approximationNotes: 总账单额之后的每个节点都来自公开同行申报，而不是 ADGT 公司披露；因此桥接图只指方向，不是预测。
