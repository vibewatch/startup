  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 哪些真正披露，哪些只是报道
        blocks:
          - type: paragraph
            body: >-
              一手证据基础异常狭窄。Blackstone 官方发布稿和 NRT 同步的合作伙伴发布稿只明确支撑一个硬交易数字：Blackstone 管理的基金于 2026 年 3 月 26 日向 ADGT 投资 US$250
              million。同一批发布材料描述了公司、启动地域和其在阿联酋博彩支付技术栈中的定位，但没有披露投后估值、持股比例、收入分母、ARR、客户数量或利润率结构。这个缺口很关键，因为围绕 ADGT
              的估值讨论很快从有出资方背书的融资事实，跳到缺乏支撑的「独角兽」简称。Blackstone 本次抓取到的投资者材料也同样需要谨慎看待：2026 年 Q1 10-Q、2026 年 4 月 8-K 业绩材料和
              2026 年 Q1 业绩活动页面都没有提到 ADGT，也没有披露估值。换句话说，公开一手记录证明了出资方支持和战略意图，但没有披露当前公允价值。


              ~$1 billion 叙事来自二级和数据库式报道。MarketScreener / S&P Capital IQ 报道称，该轮使用可转换优先股，估计投后估值为 $1.0 billion。EnterpriseAM
              另称 ADGT「据悉估值约 USD 1 bn」，并把这一说法归因于 Bloomberg。但 EnterpriseAM 同时把 Blackstone 出资报道为 $205 million，直接与官方 $250
              million 新闻稿冲突。这个不一致很重要：它降低了周边估值框架的可信度，也再次说明，$1 billion
              不是一手、管理层披露或投资人披露的投后数字。因此，最好的公开描述是「佐证稀薄的二级估算」，而不是「已验证估值」。
