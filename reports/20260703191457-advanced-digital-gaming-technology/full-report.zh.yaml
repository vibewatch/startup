companyProfile:
  summary: >-
    Advanced Digital Gaming Technology (ADGT) 是一个支付与数据智能技术平台，2026-03-26 从阿联酋 Abu Dhabi 启动，由 Blackstone（投资 US$250
    million）、Raya Holding、NRT Technology 和 Sightline Payments 战略合作搭建。ADGT 称自己是阿联酋目前唯一获准同时与线下博彩场馆和线上数字博彩平台直接签约的平台，定位是
    GCGRA 监管下该国新近受监管商业博彩市场的统一支付与合规层。启动公告之外，公司没有公开披露收入、客户或员工数，公司官网（adgt.ai）仍是占位页。
