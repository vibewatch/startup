        title: 资本、估值与 KPI 不透明
        blocks:
          - type: paragraph
            body: >-
              最可辩护的资本事实很直接：Blackstone 披露在 ADGT 启动时投资 US$250
              million。除此之外都明显更软。已审阅材料没有披露合作方经济安排是否包含老股交易、资产出资、权证或其他结构化机制，因此实际总资本化可能比一个标题数字更复杂。估值更不确定。EnterpriseAM 援引
              Bloomberg 称估值约 US$1 billion，并把 ADGT 定义为首日独角兽；但公司自己的启动材料没有披露估值，公开直接抓取 Crunchbase 和 PitchBook
              页面也没有得到可读佐证。这不能证明估值错误；但意味着该数字应被视为佐证单薄的二级媒体说法，而不是事实底稿。运营 KPI
              也要同样谨慎。已审阅公开来源没有披露收入、年经常性收入（ARR）、客户数、员工数或部署数量，因此本章 KPI 表必须保留 null 和尽调问题，而不能编造增长精度。
