              公开可比公司的成本栈比 ADGT 自身清楚得多。Shift4 和 PayPal 都显示，总账单不会直接流向
              EBITDA：交换费、评估费、处理商费用、赞助银行成本、拒付、欺诈、剩余佣金、集成、支持和合规，都会在覆盖总部成本之前吃掉相当一部分经济收益。PayPal 2025 年交易损失率为 TPV 的
              0.07%，说明欺诈损失在规模化后可以被压住，但无法避免。Paysafe 的 20-F
              是本章最清晰的反向信号，因为它把近半收入与在线赌博敞口相连，同时警告许可、银行尽调、拒付和结算风险都可能压缩利润率。阿联酋建设也异常前置，资本先投向合规和生态系统工作。White & Case 称，新 CBUAE
              法律已覆盖技术赋能平台，并可处以最高 AED 1 billion 罚款。Wynn 的 Ras Al Khaimah 项目仍在建设中，目标 2027
