  - id: TV002
    title: 正向论点 / 反向论点表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - 正向论点：蓝筹赞助方背书和法律结构表明，ADGT 不只是概念阶段空壳。
        - 私下尽调若显示资金规模更小、附带更多条件，或在结构上优先于普通股，会削弱该论点。
      - - 正向论点：阿联酋 / MENA 博彩和支付基础设施正在打开，形成真实可触达市场。
        - 如果运营商推出延后，或监管开放收窄，市场时点溢价会下降。
      - - 反向论点：没有公开收入、客户或利润率数据支撑当前溢价估值。
        - 管理层 KPI 材料若包含已签合同、支付量和抽成率证据，会显著提高置信度。
      - - 反向论点：持牌供应商阵营正在扩大，独占性可能比叙事暗示的更快被压缩。
        - 若能证明 ADGT 拥有差异化牌照路径或旗舰独家合同，这一担忧会降低。
    notes: 反向论点有证据支撑，且有意对价格敏感；本章不假设只靠赞助方质量就能证明价值。
