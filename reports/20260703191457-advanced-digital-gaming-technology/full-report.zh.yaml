            body: >-
              ADGT
              官方材料暗示的是多层收入模型，而不是单一商户折扣价差。启动新闻稿把数字钱包、实时入金和出金轨道、身份和访问管理、合规监控，以及闭环加开环控制放进一个平台。公开支付公司文件说明这类模式通常如何赚钱。Shift4
              称，支付型收入主要按处理金额百分比计，但也可包括固定费、月最低费、单笔交易费、网关服务、代币化和软件收入。PayPal 又加一层相关收费：可变和固定支付费，以及跨境、FX、即时转账和其他附加费用。Paysafe
              的 iGaming 定位也指向同一方向：一次集成覆盖卡、钱包、eCash、本地支付方式、银行轨道和加密货币。对 ADGT 的经济含义是混合模型：处理价差，加上钱包 /
