  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与排除支出
        blocks:
          - type: paragraph
            body: >-
              ADGT 当前能覆盖的是 GCGRA 监管的商业博彩栈，不是整个海湾或中东娱乐经济。GCGRA
              官方材料把合法边界定义为彩票、互联网博彩、体育博彩和线下博彩设施，并明确运营商、相关供应商、员工乃至消费者都不得在持牌边界之外合法参与。这个边界很重要，因为 ADGT
              卖的是交易和合规层，不是内容创作或一般游戏发行。因此，纳入支出包括运营商在钱包入金和出金、身份验证、KYC 和 AML
              控制、交易监控、全渠道结算，以及让线下和数字触点共享同一种受监管支付体验的软件或服务上的预算。排除支出包括无牌离岸赌博、通用消费者电子游戏软件、从不触及下注或受监管资金流的电竞赞助，以及位于博彩交易本身之外的更广旅游或酒店支出。GCC
              消费者游戏和电竞需求仍可作为相邻信号，但当前有证据支持的商业可服务市场（SAM）仍以阿联酋为中心，因为可见许可制度是阿联酋联邦制度，而非更广 GCC 商业博彩框架。
