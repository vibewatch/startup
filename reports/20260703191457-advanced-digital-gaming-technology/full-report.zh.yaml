      - number: '2.3'
        title: 买方、用户与付费方分层
        blocks:
          - type: paragraph
            body: >-
              ADGT
              的买方地图从受监管运营商和相邻持牌供应商开始，而不是玩家。在线下综合度假村中，可能的经济买方是运营商的财务、账房、资金、无现金或运营负责人，因为他们负责入金、出金、结算和场内钱包工作流。在互联网博彩和彩票中，数字产品、支付、欺诈和合规团队更居中，因为注册、KYC、存款、玩法限制、提款和可疑活动监控都在线上发生。玩家是终端用户和资金发起方，但在
              B2B 模型里，基础设施账单仍由运营商支付。公开供应商名册也说明买方生态已经多层：地理定位、内容聚合、体育数据和博彩设备供应商分别持牌，因此 ADGT
              面向的是一个栈，而不是空白市场。这个栈支撑公司的论点：统一线下和线上支付层有价值；但也意味着买方教育、集成工作和伙伴管理都是市场进入动作的一部分。由于公开证据尚未说明 ADGT 是 Wynn 或 Coin
              Technology Projects 选定的供应商，当前分层对谁应该买以及为什么最有力，对谁已经买最弱。
