  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管风险是核心承销问题，因为 ADGT 想在一个仍很新的阿联酋商业博彩制度里，把支付与合规层变现。GCGRA
              有明确法定权限、公开牌照类别，也发布了针对无牌活动的明确消费者提示；但公开记录仍处在早期：本次审阅页面显示，已披露持牌方范围很窄，公开执法历史有限，对牌照费用、续期条款和实体层映射也只看得到一部分。这很关键，因为
              ADGT 最重要的护城河主张本身就是监管主张：公司称自己是唯一能横跨线下场馆和线上渠道签约的持牌平台。但公开登记册没有把 ADGT 品牌清楚映射到某个具名法人实体，而 PayBy 相关 2024
              年新闻也显示，公开牌照公告和实时登记册可能并不同步。与此同时，支付边界在收紧。White & Case 及其他法律评论指出，2025 年 CBUAE 法第 62
              条可能把赋能支付基础设施纳入直接监管，最高行政罚款现已达到 AED 1 billion，新纳入范围的公司需在 2026-09-16
              前完成合规补正。对一家有博彩敞口的初创平台来说，实际风险不只是「博彩是否合法」，而是 GCGRA、CBUAE 和 AML 义务能否足够干净地对齐 ADGT 的确切运营模式。
