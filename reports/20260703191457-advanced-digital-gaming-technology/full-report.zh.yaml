        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              公开领导层资料方向上清楚，但很薄。Michael Dominelli 在启动报道中均被列为首席执行官，Wamda
              甚至称其为创始人，但已审阅材料除了这个名字几乎没有提供履历。合作结构比高管班底更清楚。Blackstone 是已披露资本赞助方；Raya Holding 是 Abu Dhabi 战略赞助方，由 H.H.
              Sheikh Mohammed Bin Sultan Bin Khalifa Al Nahyan 领导；NRT Technology 与 Sightline Payments 提供博彩支付运营经验。这个组合解释了
              ADGT 为什么能带着强市场叙事成形。它仍回答不了谁控制董事会投票权、各方持股多少，或任何合作方是否有特殊治理保护。已审阅公开来源未披露董事会名单、投票权分配或合作背后的法律实体图谱。在 GCGRA
              不仅可要求运营实体接受许可或适格性审查，也可审查控制人、董事和高管的行业里，这种治理不透明比普通早期金融科技公司更重要。
