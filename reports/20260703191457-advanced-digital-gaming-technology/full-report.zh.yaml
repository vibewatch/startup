    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同行、相邻厂商和潜在进入者
        blocks:
          - type: paragraph
            body: >-
              公开格局已经比 ADGT 启动叙事暗示的更宽。ADGT 自己的公告把公司定位为阿联酋唯一获牌、可同时与线下场馆和线上数字平台直接签约的平台，并把钱包、入金、身份和合规功能整合进一个栈。但本章抓取的 GCGRA
              公开名册列出 22
              家博彩相关供应商持牌方，另有独立的线下和互联网博彩持牌方，说明供应层已由地理定位、内容、支付相邻、彩票和诚信供应商填充，并非等待一个全国冠军入场的空白地。在在线支付层，PayBy、Checkout.com、PayTabs
              和 Paysafe 都公开呈现了 ADGT 声称要提供的许多相同构件：网关处理、钱包或储值体验、欺诈工具、KYC / 身份检查和跨境出金。在线下层，Sightline、Everi 和 NRT
              已在营销无现金博彩、AML、赌场信用、自助终端和度假村消费工作流。这使 ADGT 更像是在阿联酋监管框架下本地化并打包多个已验证能力模块，而不是创造一个新类别。
