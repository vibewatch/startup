  - id: TV005
    title: 论点破裂与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 如何传导到论点
      - 行动含义
    rows:
      - - 收入证据偏离里程碑路径
        - 私下尽调显示年化收入远低于 ~$100m 基准情景路径。
        - 抽掉了高于温和估值锚所需的分母。
        - 立即下调任何溢价定价假设。
      - - 股权结构包袱严重
        - 优先权、棘轮或治理权让普通股经济性失去吸引力。
        - 标题里的投后估值不再能代表可投资的普通股价值。
        - 重新定价机会，或直接放弃。
      - - 监管边界收紧
        - CBUAE / GCGRA 执行落地大幅限制支付赋能基础设施经济性。
        - 压缩利润率并抬高合规成本。
        - 将估值移向熊情景假设。
      - - 旗舰合同流向他方
        - 另一家持牌支付供应商先拿下关键运营商或场馆关系。
        - 削弱乐观情景里隐含的先发溢价。
        - 从模型中剔除稀缺性溢价。
      - - $1bn 标签无法在私下核对
        - 管理层无法把外传轮次估值与合同、收入或条款清单经济性对上。
        - 独角兽叙事会变成品牌包装，而不是证据。
        - 把报告估值视为不可操作的营销噪音。
    notes: 这些触发项为投资委员会设计，直接对应收入支撑、优先股经济性和监管耐久性。
