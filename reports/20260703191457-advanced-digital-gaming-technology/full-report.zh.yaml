      - number: '7.2'
        title: AML、平台与执行风险
        blocks:
          - type: paragraph
            body: >-
              即便牌照架构最终可行，ADGT
              仍面对典型执行风险：它是一个全新平台，没有公开运营历史，也没有披露生产环境指标。发布材料把技术栈画得很大，覆盖钱包、出款通道、身份和合规监测，但本次审阅的公开来源没有列出具名客户、已上线运营商合同、吞吐量、可用性、欺诈损失或续约数据。博彩相关支付里，这个缺口尤其重要，因为
              AML 和反欺诈控制不是摆设式合规模块，而是撑住业务的操作系统。法律评论和博彩监管科技分析反复指向类似 DNFBP 的 AML 义务，包括 CDD、EDD、可疑交易报告、MLRO
              责任归属、制裁筛查和独立审计预期。这里一旦控制失效，会同时带来监管敞口、声誉损害和运营商流失。人员风险也同样集中。公开发布报道明确称 Michael Dominelli 为
              CEO，但没有展示更深的运营梯队，也没有公开点名合规和技术控制负责人。对承销判断而言，公开证据尚未证明该平台具备韧性运营、可重复控制或宽管理层梯队，因此风险仍未降下来。
