      - number: '2.4'
        title: 增长驱动、采用节奏与约束
        blocks:
          - type: paragraph
            body: >-
              需求逻辑真实存在，但时间风险同样真实。最大驱动是监管创设：GCGRA 已把此前被禁止或灰色市场活动变成可许可、可审计的市场，并明确技术和负责任博彩标准。Wynn Al Marjan 的 2027
              年开业可形成旗舰场内入金和出金节点；移动优先的消费者行为，以及 Dubai Program for Gaming 2033 等更广游戏投资计划，也可扩大该行业周边的本地人才、内容和数字参与基础。对 ADGT
              而言，每新增一个运营商或供应商获批，都可能提高其跨渠道支付与合规命题的价值。不过约束比典型金融科技市场进入故事更重。AML、KYC、制裁、资金来源、交易监控、存款限额、冷静期和报告控制是市场设计核心，不是可选附加项。2025
              年 CBUAE 法律又扩大了对支持持牌金融服务技术的监管，并把行政罚款提高到 AED 1
              billion。公开市场也仍处萌芽期：可见运营商数量少，后续许可节奏不清，交易量、费用或许可成本公开数据仍薄。最后，文化和法律限制仍有分量，因为持牌边界之外的赌博仍属非法，公共采用必须与谨慎的社会政策框架共存。这些约束不会抹掉机会，但足以说明最乐观的
              TAM 数字更像期权价值，而不是基准需求。
