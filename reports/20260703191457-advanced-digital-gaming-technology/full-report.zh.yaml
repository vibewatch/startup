            body: >-
              如果 ADGT 嵌入面向许可的控制、玩家身份、钱包余额、出金流或场地硬件，确实可能形成切换成本，因为这些系统重新认证成本高，迁移扰动大。Sightline
              的公开材料显示，钱包、开户和单账户流程一旦融入玩家旅程，可以变得很黏；Everi 与 NRT 也显示，线下场馆可围绕现金取用、AML
              和信用自动化栈稳定多年。即便如此，公开证据也不支持赢家通吃式锁定。Checkout、PayTabs 和 PayBy 都在营销 API、托管流程或可配置商户工具；Sightline
              自己也称运营商会继续组装同类最佳的欺诈、AML 和 KYC 组件；Resorts World 部署则证明，大型运营商可以共同开发品牌钱包体验，而不是把整个前端交给供应商。因此，现状替代方案仍可信：线上用通用
