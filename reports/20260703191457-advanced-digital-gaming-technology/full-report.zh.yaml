      - number: '7.3'
        title: 集中度、竞争、地缘政治与叙事风险
        blocks:
          - type: paragraph
            body: >-
              ADGT 还同时暴露在多条集中度风险轴上。公司围绕 Blackstone、Raya、NRT 和 Sightline 这一小型创始集群组建；在出现公开客户多元化之前，出资方、技术和市场进入依赖已经明显集中。公开
              GCGRA 登记册也指向一个很窄的短期可触达市场：Wynn Al Marjan
              是唯一披露的线下场馆牌照持有人，已发布的互联网博彩名单也极短。早期进入者可能受益，但首年收入和标杆客户形成也会受制于一个市场、一个监管者和少数交易对手。与此同时，ADGT 不会在真空里经营。Sightline 和
              NRT 带来真实的博彩支付经验，但 Everi 等更广泛既有企业、Checkout.com 等大型 PSP，以及 PayTabs
              等区域处理商都说明，支付基础设施、反欺诈工具和合规工作流已有竞争，不是空白市场。区域环境又增加一层风险：EnterpriseAM 明确把 Blackstone 的出资放在伊朗战争背景下，Blackstone
              自身也承认短期逆风。最后，估值叙事看起来由标题牵引。二级媒体使用独角兽标签，并引用归因于 Bloomberg 的 US$1 billion 估值，但发布材料本身没有披露估值，直接数据库验证在抓取时也受阻。
