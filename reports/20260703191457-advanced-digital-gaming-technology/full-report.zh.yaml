  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 公开机制
      - 可能计费单位
      - 当前公开状态
      - 收入质量
      - 尽调问题
    rows:
      - - 商户收单 / 处理
        - Shift4 和 PayPal 基准显示，处理费主要绑定支付量。
        - 处理金额 bps + 固定交易费
        - ADGT 披露了能力，未披露定价。
        - 可能具备经常性且交易量高，但利润率受交换费 / 网络成本影响。
        - 按地面、线上、钱包出资和银行出资交易量披露毛 / 净抽成率。
      - - 钱包 / 储值服务
        - ADGT 和 Paysafe 都把钱包通道定位为核心产品层。
        - 钱包充值 / 提现 / 转账费或收入分成
        - 已披露钱包功能；未披露费用表。
        - 若深度嵌入运营商旅程，粘性强；经济性取决于出资组合和浮存规则。
        - 提供钱包货币化、出资组合假设，以及客户资金是否产生任何附带经济收益。
      - - 实时入金与出款
        - 官方发布材料突出实时入金和出款通道。
        - 按出款、即时转账或 FX 收费
        - 已披露能力；无价目表。
        - 有用的附带收入，但通常是可变且由事件触发。
        - 按通道、地域和跨境用例拆分出款定价。
      - - 身份 / 合规 / 监测软件
        - ADGT 明确营销合规监测和身份控制能力。
        - 月度 SaaS 订阅、按账户、按检查或捆绑最低收费
        - 没有公开 SKU 或模块定价。
        - 若与支付交易量分开销售，可能是质量最高的利润层。
        - 说明合规功能是打包进类似 MDR 的定价，还是作为独立软件线销售。
      - - 集成 / 实施 / 支持
        - Shift4 的软件和支持披露显示了另一层常见变现方式。
        - 设置费、项目费、月度最低收费、支持保留费
        - ADGT 未披露。
        - 一次性或半经常性收入；质量取决于合同范围和续约结构。
        - 按运营商类型提供实施费、最低承诺和支持 SLA。
    notes: 公开证据支持这些收入层的存在，但不能证明 ADGT 的实际定价、抽成率或收入结构；各行区分的是已披露能力和推断出的商业化模式。
