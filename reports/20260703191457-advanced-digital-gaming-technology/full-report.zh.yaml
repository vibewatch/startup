        - id: integration-and-certification
          label: 集成 / 认证 / 测试
          detail: 支付轨道、赌场系统、线上平台和负责任博彩工具都要完成集成，并在发布前让监管方放心。
        - id: settlement-and-risk
          label: 结算流动性 / 风险 / AML
          detail: 赞助银行尽调、准备金要求、AML 控制和对账流程会在规模化前占用现金。
        - id: narrow-initial-tam
          label: 初始 TAM 狭窄
          detail: 公开报道显示，近期 UAE 市场仍集中在一个度假村、彩票，以及分阶段开放的线上品类。
        - id: scale-or-refinance
          label: 扩张或再融资决策
          detail: 如果商业化慢于预期，ADGT 可能需要更多资本使用时间，或在市场放大前补充更多资本。
