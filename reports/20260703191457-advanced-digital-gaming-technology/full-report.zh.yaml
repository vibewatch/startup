      - number: '5.2'
        title: 来自 NRT 的线下端点栈
        blocks:
          - type: paragraph
            body: >-
              NRT 贡献了最可见的线下运营底座。QuickBank 自动化账房和后台现金循环；Cage Center 将现金垫款、支票兑现、身份采集、报告和 Title 31 控制数字化；eMarker
              现代化筹码信用签发和赎回；Lilly / TablePay 把这套无现金逻辑延伸到桌面游戏边缘。smartSend 再把这些物理触点接入实时出金轨道；NRT
              描述的流程可从老虎机、桌台、账房、体育投注或线上渠道发起，并落到银行账户或预付卡。ResortID 又增加了一层重要能力，因为年龄验证、身份认证和禁入名单检查是任何阿联酋商业博彩部署的核心。换言之，ADGT
              不需要从零发明线下运营模型；更难的问题是，如何把这些历史上相互分离的模块干净地规范进一条受阿联酋监管的工作流，同时不制造脆弱接口、培训或设备认证依赖。
