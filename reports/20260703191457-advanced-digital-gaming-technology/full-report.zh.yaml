      - number: '2.2'
        title: 总可用市场（TAM）、可服务市场（SAM）与可获取市场（SOM）测算口径
        blocks:
          - type: paragraph
            body: >-
              公开市场规模数据有方向价值，但不能干净相加。最宽口径下，Precedence Research 把 2026 年中东游戏市场描述为 $9.81 billion，到 2035 年增至 $22.20
              billion，线上和移动形态已占主导。这是有用的相邻视角，因为 ADGT 位于数字支付层，但它不是受监管阿联酋博彩数字。第二个相邻视角来自低置信度的阿联酋消费者游戏估算，例如 Juego Studios 的
              2024 年阿联酋游戏市场 $1.16 billion 数字，以及 GamesMEA 调研显示的移动优先、高消费玩家基础。同样，这些数据说明的是数字需求，不是持牌博彩收入。对 ADGT
              最相关的自上而下视角是受监管阿联酋博彩收入。这里情景区间很宽：SCCG 根据批准多少度假村和线上产品，勾勒了 2030 年 $1.5-2.0 billion、$5-6 billion 和 $8-10
              billion 三种结果；CBRE 的 $8.5 billion TAM 框架也提醒供应约束可能拖慢兑现。最干净的自下而上视角其实是公开持牌方名册：1 家彩票运营商、1 家互联网博彩运营商、1 家线下运营商和
              22 家博彩相关供应商。这意味着 ADGT 近端可获取市场（SOM）是极少数受监管节点上支付、合规和全渠道交易流的一部分，而不是整个中东游戏支出的一部分。最大的分析缺口是，没有公开来源披露 ADGT
              交易量、定价或抽成率，因此本章市场数学保持受证据约束。
