      - number: '8.4'
        title: 最终尽调问题与论点破裂触发器
        blocks:
          - type: paragraph
            body: >-
              三个尽调缺口最重要。第一，公开材料没有把 ADGT 的牌照位置与任何已披露运营商合同、客户名单、支付量或收入运行率连接起来。这是关键阻碍，因为每一种估值方法最终都需要一个分母。第二，MarketScreener
              是本次抓取到的唯一增加资本结构细节的来源，报道了可转换优先股和估计 $1.0 billion
              投后估值。没有股权结构表、清算优先权、保留事项和治理权，投资人无法判断这轮标题经济性是否能干净转化为普通股价值。第三，市场没有停在原地：GCGRA 登记册已经显示供应商范围在扩大，PayBy
              已公开取得支付服务相关的博彩供应商牌照，更广泛的赋能支付技术监管边界也在变得更严格，而不是更宽松。


              已报道 $1 billion 数字的未解决验证问题同样重要。Crunchbase 直接页面在本次运行中无法访问，也没有直接取回 Bloomberg
              原始报道，因此数据库式估值叙事无法从其表面上游来源独立复核。这并不推翻二级报道，但会压低置信度。投委会的正确处理方式，是把 $250 million 记录为唯一硬一手数字，把「~$1 billion
              投后」记录为佐证稀薄的第三方报道，并在把该轮融资视为已验证独角兽经济性证据之前，要求提供私下收入、合同和优先权文件。
