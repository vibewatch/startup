- id: capital-valuation-and-kpi-opacity
  title: Capital, Valuation, and KPI Opacity
  body: 'The most defensible capital fact is straightforward: Blackstone disclosed a US$250 million investment into ADGT at launch. Everything beyond that is meaningfully softer. The reviewed materials do not disclose whether partner economics included secondary sales, asset contributions, warrants, or other structuring mechanics, so total effective capitalization may be more complicated than one headline number suggests. Valuation is even less settled. EnterpriseAM cited Bloomberg for a roughly US$1 billion value and framed ADGT as a unicorn from day one, but the company’s own launch materials did not disclose valuation, and direct public fetches of Crunchbase and PitchBook pages did not produce readable corroboration. That does not prove the valuation is wrong; it does mean the figure should be treated as a thinly corroborated secondary-media claim rather than as ground-truth fact. The same caution applies to operating KPIs. Public sources reviewed disclose no revenue, ARR, customer count,
    headcount, or deployment count, so the chapter’s KPI table must preserve nulls and diligence asks rather than manufacture traction precision.'
