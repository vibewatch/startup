company:
  name: Advanced Digital Gaming Technology
chapter:
  number: 1
  title: Company Overview
  summary: ADGT is a newly launched Abu Dhabi-based payments and data-intelligence platform announced on 26 March 2026 through a Blackstone-backed partnership with Raya Holding, NRT Technology, and Sightline Payments, led publicly by CEO Michael Dominelli. The strongest public facts are the US$250 million Blackstone investment, the company’s regulatory and product claims, and its Abu Dhabi base; the weakest are direct public corroboration of the circulated ~US$1 billion valuation, board-control details, and any operating KPIs such as revenue, customers, or headcount.
sections:
- id: identity-and-positioning
  title: Identity and Positioning
  body: 'ADGT should be treated as a newly launched Abu Dhabi fintech-and-gaming-infrastructure platform, not as a long-operating company with a deep standalone public record. The clearest source is Blackstone’s 26 March 2026 announcement, which introduced ADGT as a newly established payments and data-intelligence technology platform launched from the UAE. Across official and independent coverage, the core proposition is consistent: a single payments, identity, and compliance stack for regulated gaming and adjacent digital markets, initially focused on the UAE, broader Middle East, Africa, and selected international corridors. The product description is more concrete than the operating disclosure. Management says the platform combines digital wallets, funding and payout rails, identity and access controls, compliance monitoring, and interoperable closed-loop / open-loop controls. That is enough to understand what ADGT sells. It is not enough to infer current commercial scale, because public
    sources do not disclose revenue, customers, deployments, or workforce size. The corporate website strengthens that cautionary view: as of the run date it remained a one-word placeholder rather than a substantive company or product site.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO014
