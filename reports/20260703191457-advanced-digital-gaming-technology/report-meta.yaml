companyProfile:
  summary: Advanced Digital Gaming Technology (ADGT) is a payments-and-data-intelligence technology platform launched from Abu Dhabi, UAE on 2026-03-26, built through a strategic partnership between Blackstone (which invested US$250 million), Raya Holding, NRT Technology, and Sightline Payments. ADGT states it is the only platform currently licensed in the UAE to contract directly with both land-based gaming venues and online digital gaming platforms, positioning it as a unified payments and compliance layer for the country's newly regulated commercial gaming market overseen by the GCGRA. Beyond the launch announcement, the company discloses no public revenue, customer, or headcount figures, and its corporate website (adgt.ai) remains a placeholder page.
  foundedDate: '2026-03-26'
  founders:
    - name: Michael Dominelli
      role: Chief Executive Officer
      background: Publicly named as CEO in the launch announcement; the reviewed launch materials and press coverage provide little additional public biography.
      claimRefs: [CO005, CO006]
  foundingLocation: Abu Dhabi, United Arab Emirates
  headquarters: Abu Dhabi, United Arab Emirates
  productSummary: A unified payments, digital-wallet, real-time-funding, identity, and compliance/AML technology platform for regulated gaming operators, combining Sightline Payments' cashless wallet technology with NRT Technology's land-based cash-access/kiosk technology, aimed at giving both physical casino venues and online gaming platforms a single compliant payments rail.
  customerFocus: GCGRA-licensed land-based integrated resort/casino operators (e.g. the Wynn Al Marjan Island development in Ras Al Khaimah) and online/digital gaming platform licensees in the UAE, with stated ambitions to expand across the Middle East, Africa, and select international corridors.
  businessModel: Payments-processing and compliance-technology infrastructure provided to licensed gaming operators; exact pricing, take-rate, and contract economics for ADGT itself are not publicly disclosed, so this report benchmarks against comparable public payments-infrastructure companies.
  stage: Private, growth/launch stage following a US$250 million PE-backed investment; no disclosed subsequent financing round.
  fundingStatus: US$250 million invested by Blackstone (with Raya Holding, NRT Technology, and Sightline Payments as partners) announced 2026-03-26. No post-money valuation was disclosed in the primary announcement; a widely circulated ~US$1 billion "unicorn" figure appears only in secondary press and database-style sources and is treated in this report as thinly corroborated.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO005, CO008, CO009]
