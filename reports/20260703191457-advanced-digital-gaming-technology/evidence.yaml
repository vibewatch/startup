evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-governance
    missingEvidence: >-
      Board roster, board-seat allocation, shareholder rights, cap-table breakdown, and whether the launch financing
      included primary capital, secondaries, or partner asset contributions.
    whyItMatters: Governance rights determine who truly controls strategy, compliance, and future financing decisions.
    diligencePath: Request the cap table, shareholder agreement, board minutes roster, and any GCGRA key-person filings.
    relatedQuestionRefs:
      - QO007
      - QO010
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-kpis
    missingEvidence: Current revenue, ARR, customer count, headcount, and active deployment count.
