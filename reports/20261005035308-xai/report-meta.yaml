companyProfile:
  summary: >-
    xAI, founded by Elon Musk in March 2023 and headquartered in Palo Alto, built Grok plus consumer, enterprise,
    voice-agent, API, and cloud-distribution products before being acquired by SpaceX in February 2026 and becoming a
    subsidiary inside a broader corporate group. The company monetizes through subscriptions, developer APIs, and
    large-scale compute leasing, but the public evidence still does not provide audited standalone financials, a clean
    waterfall, or a verifiable intrinsic valuation for the reported $230B-$250B marks.
