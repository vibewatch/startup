      - "CO007"
  - calloutType: "insight"
    title: "Scale metrics use different denominators"
    body: "The $20 billion Series E is financing raised, the Southaven figure is planned corporate investment, one million H100 equivalents is a compute measure, and 600 million monthly active users blends X and Grok reach. None is a substitute for revenue, cash available, paid customers, or utilization."
