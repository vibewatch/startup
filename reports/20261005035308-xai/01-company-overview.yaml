company:
  name: "xAI"
chapter:
  number: 1
  title: "Company Overview"
  summary: "xAI progressed from a March 2023 founding to a SpaceX subsidiary in February 2026 while financing and building unusually large AI infrastructure. The strongest public evidence verifies a $20 billion Series E and a planned Southaven investment exceeding $20 billion, but audited revenue, cash availability, governance rights, and even the final founding-team departure count remain unresolved."
sections:
  - id: "identity-product-and-ownership"
    title: "Identity, Product, and Ownership"
    body: |
      Elon Musk founded xAI in Nevada in March 2023, and the company describes its mission as building AI to understand the universe and accelerate scientific discovery. Britannica identifies Palo Alto as the headquarters; xAI's current company page separately lists Palo Alto, Seattle, Memphis, and London as offices, so the broader footprint should not be mistaken for multiple headquarters. The core product is Grok, launched in November 2023 as an AI chatbot with real-time access to X data. xAI's own milestone log now shows consumer applications, enterprise products, voice and agent APIs, and distribution through third-party cloud platforms, but it does not disclose the revenue contribution of those channels.

      The corporate perimeter changed twice in less than a year. xAI acquired X in an all-stock transaction in March 2025, then joined SpaceX in February 2026 and became a subsidiary. This makes the current diligence object an AI operating business inside a wider corporate group rather than a clearly separable standalone issuer. Public sources support the transaction sequence, but the assigned evidence does not expose transfer-pricing arrangements, intercompany obligations, board composition, or minority-holder protections.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO001"
    figureRefs:
      - "FO001"
  - id: "financing-and-operating-scale"
    title: "Financing and Operating Scale"
    body: |
      xAI announced an upsized $20 billion Series E on January 6, 2026 after targeting $15 billion. Its release names financial investors including Valor Equity Partners, StepStone Group, Fidelity, Qatar Investment Authority, MGX, and Baron Capital Group, plus strategic investors NVIDIA and Cisco Investments. A private-market directory reports a $230 billion post-money valuation for that round, but the retained evidence does not contain transaction documents that independently verify pricing, preferences, or dilution. The round amount is funding raised, not cash currently available, and should not be added to infrastructure commitments as though both were unrestricted liquidity.

      Company-reported scale is substantial but needs denominator discipline. xAI says it ended 2025 with more than one million H100 GPU equivalents and reaches approximately 600 million monthly active users across X and Grok together; neither metric identifies paid Grok customers or standalone utilization. Separately, the Mississippi Development Authority says the Southaven MACROHARDRR project will exceed $20 billion of corporate investment and raise computing power to nearly two gigawatts. That is a project commitment, not revenue, ARR, cash burn, or capital raised. No retained source establishes audited revenue, gross margin, operating loss, cash burn, or runway.
    claimRefs:
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO016"
    tableRefs:
      - "TO003"
  - id: "leadership-governance-and-key-person-risk"
    title: "Leadership, Governance, and Key-Person Risk"
    body: |
      xAI began with a small technical team recruited from organizations including Google, Microsoft, DeepMind, and OpenAI. Britannica identifies twelve original staff members and specifically names Igor Babuschkin, Yuhuai Wu, Christian Szegedy, and Jimmy Ba. It also records Szegedy's February 2025 departure and Babuschkin's August 2025 departure. Those facts establish meaningful founding-team turnover, but the assigned source pool does not provide an authoritative current executive roster, replacement leadership map, board roster, or allocation of authority after the SpaceX transaction.

      A more sweeping April 2026 Tech Insider account says all twelve original co-founders had departed by late March. The same article, however, acknowledges that another tracker still listed Manuel Kroiss and Ross Nordeen as active and counted nine departures from an eleven-person roster. The report therefore treats complete founder attrition as disputed rather than verified. This uncertainty does not eliminate the risk: confirmed early departures and inconsistent roster accounting both indicate weak governance transparency and potential key-person dependence. The appropriate diligence response is to obtain a dated organization chart and board materials, not to convert an unverified absence into a precise attrition statistic.
    claimRefs:
      - "CO013"
      - "CO014"
      - "CO015"
    tableRefs:
      - "TO002"
