callouts:
  - calloutType: "risk"
    title: "Subsidized Token Pricing Masks Unsustainable Operating Losses"
    body: "xAI's aggressive pricing undercuts frontier competitors by up to 80% on reasoning tokens, but regulatory disclosures indicate xAI spent $2 for every dollar earned in 2025, yielding a $6.4 billion operating loss. Without significant monetization through high-margin enterprise seats or Cursor subscriptions, low-cost API tokens risk permanent margin compression."
    claimRefs:
      - "CP005"
      - "CP008"
  - calloutType: "insight"
    title: "Dual Identity as Competitor and Infrastructure Landlord"
    body: "By utilizing only ~11% of Colossus compute for proprietary Grok models and leasing surplus capacity to direct rivals like Anthropic and Google, xAI operates as both an AI model lab and a wholesale compute utility. This hedge generates liquidity but creates strategic conflicts and dependence on rivals' model demand."
    claimRefs:
      - "CP012"
      - "CP013"
