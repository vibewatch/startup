callouts:
  - calloutType: risk
    title: Severe Capital Expenditure Drag and Operating Loss
    body: xAI incurred an operating loss of $6.4 billion against $3.2 billion in revenue during 2025, spending $12.7 billion on capital expenditures. Operating at an estimated burn of $1 billion monthly against standalone AI software ARR of approximately $500 million represented an unsustainable funding treadmill that ultimately necessitated absorption into SpaceX.
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI015
  - calloutType: insight
    title: Structural Transition to Infrastructure Compute Wholesaling
    body: Recognizing that consumer subscriptions and developer API usage cannot independently support multi-gigawatt data center expansion, xAI has shifted aggressively toward wholesale compute leasing, signing multi-billion-dollar Cloud Service Agreements to convert capital commitments into contracted revenue backlogs.
    claimRefs:
      - CI005
      - CI007
      - CI011
