chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Ownership
        blocks:
          - type: paragraph
            body: >
              Elon Musk founded xAI in Nevada in March 2023, and the company describes its mission as building AI to
              understand the universe and accelerate scientific discovery. Britannica identifies Palo Alto as the
              headquarters; xAI's current company page separately lists Palo Alto, Seattle, Memphis, and London as
              offices, so the broader footprint should not be mistaken for multiple headquarters. The core product is
              Grok, launched in November 2023 as an AI chatbot with real-time access to X data. xAI's own milestone log
              now shows consumer applications, enterprise products, voice and agent APIs, and distribution through
              third-party cloud platforms, but it does not disclose the revenue contribution of those channels.


              The corporate perimeter changed twice in less than a year. xAI acquired X in an all-stock transaction in
              March 2025, then joined SpaceX in February 2026 and became a subsidiary. This makes the current diligence
              object an AI operating business inside a wider corporate group rather than a clearly separable standalone
              issuer. Public sources support the transaction sequence, but the assigned evidence does not expose
              transfer-pricing arrangements, intercompany obligations, board composition, or minority-holder
              protections.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
