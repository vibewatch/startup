  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Included Spend
        blocks:
          - type: paragraph
            body: >-
              xAI should not be underwritten against a single market label. The available evidence spans at least three
              different spend pools: model and assistant products distributed through a chatbot or developer API;
              external AI-compute capacity; and explainability, governance, and implementation tooling used around
              generative models. The last pool is an adjacency rather than a direct proxy for all xAI revenue. A
              Springer-documented Whirlpool deployment also shows that enterprise AI adoption includes business-process
              redesign, data preparation, model maintenance, and user-facing explanation work, not merely model access.
              Accordingly, this chapter includes software, API, compute, and implementation spend where the source names
              them, while excluding generic white-collar payroll displacement, unrelated cloud infrastructure, and
              undifferentiated global AI forecasts from the investable near-term market boundary.
            claimRefs:
              - CM001
              - CM009
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM009
              - CM010
      - number: '2.2'
        title: Sizing Lenses and Comparability Limits
        blocks:
          - type: paragraph
            body: >-
              Data Bridge estimates the global explainable-AI-in-generative-models category at $4.86 billion in 2025 and
              $24.91 billion in 2033, with a 22.7% CAGR over 2026-2033. That estimate is narrow: it covers
              explainability software and services, not the whole frontier-model, consumer-assistant, or data-center
              economy. At the opposite extreme, PrimeXBT's syndicated account says SpaceX assigns its AI division a
              $26.5 trillion TAM, of which $22.7 trillion relates to enterprise projects that the same account describes
              as very early stage. These figures are not competing estimates of one denominator. Their category scope,
              maturity, and methodology differ by orders of magnitude, so the broad corporate TAM cannot substitute for
              an xAI SAM or SOM. Public sources do not disclose enough product-level demand, pricing, geography, or
              attainable share data to bridge those lenses without false precision.
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM011
