  - id: TV002
    title: Thesis and Anti-Thesis Decision Tests
    columns:
      - Lens
      - Evidence-supported argument
      - What would change the view
      - Current implication
    rows:
      - - Thesis
        - A $20B upsized round demonstrates exceptional access to strategic and financial capital
        - Audited evidence that capital produces durable gross profit and positive unit economics
        - Strong financing access is real, but it is not proof of economic return
      - - Anti-thesis
        - >-
          Independent reporting identifies regulatory probes and infrastructure opposition while public financial
          disclosure remains inconsistent
        - Closed investigations, durable permits, and audited segment economics
        - Operating and regulatory uncertainty warrants a high risk rating
      - - Governance and structure
        - Reported acquisition by SpaceX ended clean standalone price discovery for xAI
        - Executed exchange documents, preference waterfall, and separable segment reporting
        - Entry and exit exposure cannot be isolated from the combined entity
    notes: >-
