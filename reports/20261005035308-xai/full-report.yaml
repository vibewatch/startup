      - number: '1.2'
        title: Financing and Operating Scale
        blocks:
          - type: paragraph
            body: >
              xAI announced an upsized $20 billion Series E on January 6, 2026 after targeting $15 billion. Its release
              names financial investors including Valor Equity Partners, StepStone Group, Fidelity, Qatar Investment
              Authority, MGX, and Baron Capital Group, plus strategic investors NVIDIA and Cisco Investments. A
              private-market directory reports a $230 billion post-money valuation for that round, but the retained
              evidence does not contain transaction documents that independently verify pricing, preferences, or
              dilution. The round amount is funding raised, not cash currently available, and should not be added to
              infrastructure commitments as though both were unrestricted liquidity.


              Company-reported scale is substantial but needs denominator discipline. xAI says it ended 2025 with more
              than one million H100 GPU equivalents and reaches approximately 600 million monthly active users across X
              and Grok together; neither metric identifies paid Grok customers or standalone utilization. Separately,
              the Mississippi Development Authority says the Southaven MACROHARDRR project will exceed $20 billion of
              corporate investment and raise computing power to nearly two gigawatts. That is a project commitment, not
              revenue, ARR, cash burn, or capital raised. No retained source establishes audited revenue, gross margin,
              operating loss, cash burn, or runway.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO016
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
      - number: '1.3'
        title: Leadership, Governance, and Key-Person Risk
        blocks:
          - type: paragraph
            body: >
              xAI began with a small technical team recruited from organizations including Google, Microsoft, DeepMind,
              and OpenAI. Britannica identifies twelve original staff members and specifically names Igor Babuschkin,
              Yuhuai Wu, Christian Szegedy, and Jimmy Ba. It also records Szegedy's February 2025 departure and
              Babuschkin's August 2025 departure. Those facts establish meaningful founding-team turnover, but the
              assigned source pool does not provide an authoritative current executive roster, replacement leadership
              map, board roster, or allocation of authority after the SpaceX transaction.


              A more sweeping April 2026 Tech Insider account says all twelve original co-founders had departed by late
              March. The same article, however, acknowledges that another tracker still listed Manuel Kroiss and Ross
              Nordeen as active and counted nine departures from an eleven-person roster. The report therefore treats
              complete founder attrition as disputed rather than verified. This uncertainty does not eliminate the risk:
              confirmed early departures and inconsistent roster accounting both indicate weak governance transparency
              and potential key-person dependence. The appropriate diligence response is to obtain a dated organization
              chart and board materials, not to convert an unverified absence into a precise attrition statistic.
            claimRefs:
              - CO013
              - CO014
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO013
              - CO014
              - CO015
