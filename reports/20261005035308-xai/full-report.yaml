        title: Exhibits
        blocks:
          - type: callout
            title: Governance visibility lags corporate consolidation
            body: >-
              The retained evidence verifies that xAI became a SpaceX subsidiary, but it does not disclose the
              post-transaction board, voting rights, related-party approvals, or intercompany economics. These are
              private-evidence gaps rather than facts that can be inferred from the acquisition.
            calloutType: risk
            claimRefs:
              - CO006
              - CO007
          - type: callout
            title: Scale metrics use different denominators
            body: >-
              The $20 billion Series E is financing raised, the Southaven figure is planned corporate investment, one
              million H100 equivalents is a compute measure, and 600 million monthly active users blends X and Grok
              reach. None is a substitute for revenue, cash available, paid customers, or utilization.
            calloutType: insight
            claimRefs:
