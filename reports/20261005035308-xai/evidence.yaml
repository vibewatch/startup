evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial metrics
    missingEvidence: >-
      Audited revenue, ARR, gross margin, operating loss, cash burn, unrestricted cash, debt, and runway for xAI on a
      standalone and post-SpaceX basis.
    whyItMatters: >-
      Without consistent financial statements, neither operating quality nor financing sufficiency can be compared with
      the reported private valuation.
    diligencePath: >-
      Obtain audited financial statements, monthly management accounts, debt schedules, and a cash bridge that
      reconciles financing proceeds to current unrestricted liquidity.
    relatedQuestionRefs:
      - QO004
      - QO006
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership and governance
    missingEvidence: >-
      A dated executive roster, complete founder-status reconciliation, board membership, voting rights, delegated
      authorities, and replacement ownership for departed technical leaders.
    whyItMatters: >-
      The disputed founder tally and absent governance documents prevent a reliable assessment of succession,
      accountability, and key-person concentration.
    diligencePath: >-
      Request the current organization chart, board and committee charters, departure records, retention plan, and
      signed post-acquisition delegation matrix.
    relatedQuestionRefs:
      - QO002
      - QO003
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: capitalization
    missingEvidence: >-
      A complete capitalization table and financing history that separates equity, debt, strategic investments,
      secondary transfers, and conversion into SpaceX securities.
    whyItMatters: >-
      Named round participants and headline proceeds do not establish current ownership, preference seniority, dilution,
      control, or cash remaining.
    diligencePath: >-
      Review financing documents, the merger agreement and schedules, shareholder registers, debt instruments, side
      letters, and investor carrying-value records.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: xai-sam-som
    missingEvidence: >-
      Product-level revenue, pricing, buyer counts, contract duration, geography, retention, and attainable share for
      xAI assistant, API, and compute offerings
    whyItMatters: >-
      Without a common product and buyer denominator, neither the broad corporate TAM nor the explainable-AI category
      forecast can be converted into a defensible xAI SAM or SOM
    diligencePath: >-
      Obtain audited segment schedules, product-level bookings, customer cohorts, price-volume data, and management's
      bottom-up market bridge
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: market-sizing-methodology
    missingEvidence: >-
      Transparent sampling frame, revenue taxonomy, vendor universe, and sensitivity analysis behind the public
      explainable-AI market estimate
    whyItMatters: >-
      The category estimate is the only focused market forecast in the assigned evidence, but its public page does not
      expose enough methodology to reproduce it
    diligencePath: >-
      Review the full analyst report and triangulate its vendor revenues against filings and independent industry
      statistics
  - type: conflicting-data
    severity: minor
    topic: source-quality
    missingEvidence: >-
      A reconciled entity match for third-party company databases that return incompatible founding years and company
      descriptions under the xAI name
    whyItMatters: >-
      Unreconciled profiles can contaminate revenue, employee, funding, and valuation comparisons with data from a
      different company
    diligencePath: Require legal-entity identifiers and trace each database field to a filing or company-issued record before use
    relatedQuestionRefs:
      - QM007
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Audited gross margins, COGS breakdown between inference compute and electricity, and customer acquisition costs
      across enterprise and consumer tiers.
    whyItMatters: >-
      Without audited gross margin data, institutional investors cannot evaluate whether token inference and
      subscription revenues are fundamentally cash-flow positive after compute hosting costs.
    diligencePath: >-
      Obtain management-prepared unit contribution models and audited financial statements during formal confirmatory
      due diligence.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: customer-retention
    missingEvidence: >-
      Net revenue retention (NRR), gross retention, and paid churn curves across enterprise API customers and consumer
      SuperGrok subscribers.
    whyItMatters: >-
      Rapid top-line subscriber adoption from social platform reach cannot prove revenue durability if user churn is
      high or API customers fail to expand token consumption.
    diligencePath: Review monthly cohort retention schedules and API consumption expansion tables from internal management reporting.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: enterprise-compliance
    missingEvidence: >-
      Official SOC 2 Type II audit report, ISO 27001 certification, and published data processing agreements for
      enterprise Grok deployments.
    whyItMatters: >-
      Regulated enterprise buyers require verified third-party audit attestations before routing sensitive proprietary
      data through external LLM APIs.
    diligencePath: Request xAI enterprise compliance packet and security whitepaper during formal vendor procurement diligence.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: infrastructure-slas
    missingEvidence: >-
      Formal enterprise availability SLAs, token rate limits, latency guarantees, and multi-region failover
      documentation for developer API tiers.
    whyItMatters: >-
      Production application developers cannot de-risk service dependencies without contractual uptime and throughput
      commitments.
    diligencePath: Review master service agreements and enterprise tier rate schedules under non-disclosure agreement.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention-and-nrr
    missingEvidence: >-
      Audited retention cohorts, churn rates, Gross Revenue Retention (GRR), and Net Revenue Retention (NRR) across
      standalone Grok and enterprise API customer tiers.
    whyItMatters: >-
      Without cohort retention curves, long-term customer lifetime value and the durability of software subscription
      revenue cannot be verified independently from top-of-funnel marketing reach.
    diligencePath: >-
      Review internal management reporting on monthly cohort churn and expansion rates for SuperGrok and enterprise API
      developer accounts.
    relatedQuestionRefs:
      - QU007
  - type: missing-source
    severity: material
    topic: compute-delivery-status
    missingEvidence: >-
      Formal public confirmation or regulatory filing confirming whether the full committed ~110,000 GPU allocation was
      delivered to Google by the September 30, 2026 contract milestone.
    whyItMatters: >-
      Failure to deliver by the contract deadline triggers a one-month grace period after which Google may terminate the
      $920M/month contract or negotiate reduced fees, directly jeopardizing projected segment revenue.
    diligencePath: >-
      Inspect Q3 2026 SpaceX 10-Q disclosures or customer delivery confirmation statements regarding Colossus 2
      operational performance.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: financial-reporting-gap
    missingEvidence: >-
      Audited financial statements or management-verified segment reporting for xAI disclosing 2026 operating cash burn,
      GPU lease revenue yield, and gross margins.
    whyItMatters: >-
      Following the all-stock SpaceX acquisition, xAI's standalone capital burn and cash generation are obscured within
      consolidated private and public SpaceX filings.
    diligencePath: >-
      Review future SpaceX SEC Form 10-Q and 10-K segment reporting, or obtain private financial exhibits detailing AI
      infrastructure capital expenditure.
    relatedQuestionRefs:
      - QR009
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Complete docket filings and agency enforcement tracking across European, British, and Malaysian data protection
      authorities regarding Grok CSAM investigations.
    whyItMatters: >-
      International cross-border probes into synthetic media and non-consensual imagery may trigger extraterritorial
      fines or product distribution suspensions.
    diligencePath: >-
      Monitor official gazette releases from the UK Information Commissioner's Office, the European Data Protection
      Board, and relevant state attorney general dockets.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: standalone-financials
    missingEvidence: >-
      Audited standalone or segment revenue, gross margin, operating cash flow, capital expenditure, cash balance, and
      debt schedules with consistent periods and denominators.
    whyItMatters: >-
      Without audited financials, no intrinsic valuation range, target return, probability weighting, or downside case
      can be calculated responsibly.
    diligencePath: >-
      Obtain audited financial statements and management segment schedules, then reconcile every revenue and loss metric
      to its period, entity scope, and accounting basis.
    relatedQuestionRefs:
      - QV008
    relatedTableRefs:
      - TV001
      - TV003
  - type: missing-source
    severity: material
    topic: transaction-terms
    missingEvidence: >-
      Executed SpaceX-xAI acquisition agreement, share-exchange schedule, capitalization table, liquidation preferences,
      investor protections, and debt repayment waterfall.
    whyItMatters: >-
      Reported headline values do not determine investor proceeds, dilution, governance rights, or the value
      attributable to xAI inside the combined entity.
    diligencePath: >-
      Review signed transaction documents, board approvals, investor consents, and the fully diluted pre- and
      post-transaction capitalization schedules.
    relatedQuestionRefs:
      - QV008
    relatedTableRefs:
      - TV002
  - type: conflicting-data
    severity: material
    topic: revenue-denominator
    missingEvidence: >-
      A primary reconciliation of public revenue estimates, including whether each figure is standalone xAI, combined
      xAI and X, run-rate, LTM, or a partial-period result.
    whyItMatters: >-
      Mixing entity scope and periods creates misleading valuation multiples and can reverse the apparent investment
      conclusion.
    diligencePath: >-
      Reconcile source figures to audited ledgers and customer billing records; exclude contaminated company profiles
      and unlabeled aggregator estimates.
    relatedQuestionRefs:
      - QV008
    relatedTableRefs:
      - TV003
