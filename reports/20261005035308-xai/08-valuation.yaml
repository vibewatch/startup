      edges:
        - from: financing
          to: valuation
        - from: valuation
          to: structure
        - from: structure
          to: economics
        - from: economics
          to: risk
        - from: risk
          to: decision
    approximationNotes: >-
      The flow is analytical and non-proportional; dollar values are reported transaction marks and no conversion rate or probability is implied.
