  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: standalone-financials
      missingEvidence: >-
        Audited standalone or segment revenue, gross margin, operating cash flow, capital expenditure, cash balance, and debt schedules with consistent periods and denominators.
      whyItMatters: >-
        Without audited financials, no intrinsic valuation range, target return, probability weighting, or downside case can be calculated responsibly.
      diligencePath: >-
        Obtain audited financial statements and management segment schedules, then reconcile every revenue and loss metric to its period, entity scope, and accounting basis.
      relatedQuestionRefs:
        - QV008
      relatedTableRefs:
        - TV001
        - TV003
    - type: missing-source
      severity: material
      topic: transaction-terms
      missingEvidence: >-
        Executed SpaceX-xAI acquisition agreement, share-exchange schedule, capitalization table, liquidation preferences, investor protections, and debt repayment waterfall.
      whyItMatters: >-
        Reported headline values do not determine investor proceeds, dilution, governance rights, or the value attributable to xAI inside the combined entity.
      diligencePath: >-
        Review signed transaction documents, board approvals, investor consents, and the fully diluted pre- and post-transaction capitalization schedules.
      relatedQuestionRefs:
        - QV008
      relatedTableRefs:
        - TV002
    - type: conflicting-data
      severity: material
      topic: revenue-denominator
      missingEvidence: >-
        A primary reconciliation of public revenue estimates, including whether each figure is standalone xAI, combined xAI and X, run-rate, LTM, or a partial-period result.
      whyItMatters: >-
        Mixing entity scope and periods creates misleading valuation multiples and can reverse the apparent investment conclusion.
      diligencePath: >-
        Reconcile source figures to audited ledgers and customer billing records; exclude contaminated company profiles and unlabeled aggregator estimates.
      relatedQuestionRefs:
        - QV008
      relatedTableRefs:
        - TV003
