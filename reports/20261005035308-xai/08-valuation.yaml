    title: Recommendation Logic
    type: flow
    summary: >-
      The decision chain separates verified financing scale from missing economic proof and ends at a research-more recommendation.
    data:
      nodes:
        - id: financing
          label: $20B Series E
          detail: Independently reported round amount exceeded the prior $15B target
        - id: valuation
          label: About $230B reported mark
          detail: Financing reference, not an audited intrinsic-value conclusion
        - id: structure
          label: Reported $250B SpaceX acquisition
          detail: Standalone xAI price discovery ends in the assigned evidence
        - id: economics
          label: Inconsistent financial denominators
          detail: Public databases disagree on funding and revenue definitions
        - id: risk
          label: High downside uncertainty
          detail: Regulatory, infrastructure, loss, and governance exposures remain
        - id: decision
          label: Research-more
