      - CV002
      - CV005
      - CV008
      - CV013
      - CV015
callouts:
  - calloutType: recommendation
    title: Public Evidence Does Not Support a Price Target
    body: >-
      Use the reported $230 billion and $250 billion marks only as transaction context. A defensible entry price, target return, hold period, or downside range requires audited standalone or segment cash flows and the executed capitalization documents.
    claimRefs:
      - CV002
      - CV008
      - CV014
      - CV016
  - calloutType: risk
    title: Aggregator Precision Is Not Verification
    body: >-
      Public databases disagree on founding year, cumulative funding, revenue labels, and transaction counts. Their precise-looking values should not substitute for audited accounts, executed financing documents, or a regulator-filed transaction record.
    claimRefs:
      - CV005
      - CV011
      - CV012
