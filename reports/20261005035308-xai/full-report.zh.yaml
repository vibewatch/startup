      - number: '4.2'
        title: 成本结构、经营亏损与资本开支强度
        blocks:
          - type: paragraph
            body: >-
              xAI 的成本结构由前沿模型预训练和大规模数据中心部署带来的极高资本密集度与巨额经营消耗定义。FY2025 合并申报显示，包括被吸收的社交平台 X 在内，xAI 运营产生 $3.2 billion
              总收入，同时录得 $6.4 billion 经营亏损。独立 Grok 和 API 软件业务贡献约 $500 million 年化经常性收入（ARR），据估计较 2024 年约 $100 million 同比增长
              400%，但远远被实体基础设施支出盖过。2025 年资本开支单年达到 $12.7 billion，主要用于采购先进加速器硬件、高带宽互连和孟菲斯 Colossus
              设施的快速发电建设。经营费用主要来自高密度算力电力采购、通过 Valor Equity Partners 等赞助方安排的表外 GPU 租赁工具，以及专业工程人员薪酬。尽管第三方聚合方给出从独立商业运行率 $1.2
              billion 到未经验证的员工生产率比率等不一致估计，主要 SEC 申报确认，巨额折旧、服务器维护和多吉瓦电力运营严重压缩经营利润率，使独立业务在外部资本重组前深陷现金流负值。
