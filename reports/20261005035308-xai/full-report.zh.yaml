        - 据报道被 SpaceX 收购后，xAI 的独立价格发现已终结
        - 已签署的换股文件、优先权瀑布及可分拆的分部报告
        - 无法将进出场暴露从合并实体中单独隔离
    notes: 本表区分已观察到的融资与据报道的交易事件和投资判断结论；不假定缺失的私人文件。
