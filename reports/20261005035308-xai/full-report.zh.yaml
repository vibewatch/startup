      - number: '1.2'
        title: 融资与经营规模
        blocks:
          - type: paragraph
            body: >-
              xAI 于 2026 年 1 月 6 日宣布将 Series E 扩大至 $20 billion，此前目标为 $15 billion。公告列出的财务投资者包括 Valor Equity
              Partners、StepStone Group、Fidelity、Qatar Investment Authority、MGX 和 Baron Capital Group，战略投资者包括 NVIDIA 和
              Cisco Investments。一家私募市场目录给出该轮 $230 billion
              的投后估值，但留存证据没有能独立验证定价、优先权或稀释的交易文件。该轮金额是已募集资金，不是当前可用现金，不能把它与基础设施承诺相加后当作不受限制的流动性。


              公司披露的规模很大，但必须守住分母。xAI 称其在 2025 年末拥有超过 100 万个 H100 GPU 等效算力，并称 X 与 Grok 合计每月触达约 600 million
              名活跃用户；两项指标都没有识别付费 Grok 客户或独立利用率。另据 Mississippi Development Authority，Southaven MACROHARDRR 项目将带来超过 $20
              billion 的企业投资，并把算力提升至接近 2 gigawatts。这是项目承诺，不是收入、ARR、现金消耗或融资额。现有来源没有证明经审计收入、毛利率、经营亏损、现金消耗或现金跑道。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO016
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
      - number: '1.3'
        title: 领导层、治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              xAI 最初由从 Google、Microsoft、DeepMind 和 OpenAI 等组织招募的小型技术团队组成。Britannica 认定有 12 名原始员工，并点名 Igor
              Babuschkin、Yuhuai Wu、Christian Szegedy 和 Jimmy Ba；还记录 Szegedy 于 2025 年 2 月离职、Babuschkin 于 2025 年 8
              月离职。这些事实说明创始团队出现了实质性流失，但现有来源没有提供权威的当前高管名单、继任领导图谱、董事会名单，或 SpaceX 交易后的权力分配。


              一篇 2026 年 4 月的 Tech Insider 报道更进一步称，12 名原始联合创始人到 3 月底全部离职。但同一文章承认，另一追踪器仍将 Manuel Kroiss 和 Ross Nordeen
              列为在职，并以 11 人名单计算出 9
              人离职。因此，本报告将创始人全部流失视为有争议、而非已验证事实。这种不确定性并未消除风险：已确认的早期离职与不一致的人员统计都指向治理透明度偏弱及潜在关键人物依赖。适当的尽调动作是取得带日期的组织架构图和董事会材料，而不是把未经验证的缺席转换成精确的流失率。
            claimRefs:
              - CO013
              - CO014
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO013
              - CO014
              - CO015
      - number: '1.4'
        title: 展品
        blocks:
          - type: callout
            title: 治理透明度落后于公司整合
            body: 留存证据验证了 xAI 已成为 SpaceX 子公司，但没有披露交易后的董事会、投票权、关联方审批或公司间经济安排。这些是私有证据缺口，不能从收购事实中推断出来。
            calloutType: risk
            claimRefs:
              - CO006
              - CO007
          - type: callout
            title: 规模指标使用不同分母
            body: >-
              $20 billion Series E 是融资额，Southaven 数字是计划中的企业投资，100 万 H100 等效数是算力指标，600 million 月活则混合了 X 与 Grok
              的触达范围。它们都不能替代收入、可用现金、付费客户或利用率。
            calloutType: insight
            claimRefs:
              - CO008
              - CO011
              - CO012
              - CO016
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >-
              xAI 不应按单一市场标签来评估。现有证据至少覆盖三个不同支出池：通过聊天机器人或开发者 API 分发的模型与助手产品；外部 AI
              算力；以及围绕生成式模型使用的可解释性、治理和实施工具。最后一个池是相邻市场，不能直接代理 xAI 的全部收入。Springer 记录的 Whirlpool 部署还表明，企业采用 AI
              不只是获取模型，还包括业务流程重设计、数据准备、模型维护和面向用户的解释工作。因此，本章在来源明确提及时纳入软件、API、算力和实施支出，同时将普通白领岗位替代、无关云基础设施和未区分的全球 AI
              预测排除在可投资的近期市场边界之外。
            claimRefs:
              - CM001
              - CM009
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM009
              - CM010
      - number: '2.2'
        title: 市场规模视角与可比性限制
        blocks:
          - type: paragraph
            body: >-
              Data Bridge 估计，生成式模型可解释 AI 类别的全球规模在 2025 年为 $4.86 billion，2033 年为 $24.91 billion，2026—2033 年 CAGR 为
              22.7%。这一估计很窄：覆盖的是可解释性软件和服务，不是整个前沿模型、消费者助手或数据中心经济。另一端，PrimeXBT 的联合发布账户称 SpaceX 将其 AI 部门的 TAM 定为 $26.5
              trillion，其中 $22.7 trillion 对应同一账户描述为非常早期的企业项目。这些数字不是同一分母的竞争性估计；类别边界、成熟度和方法相差数个数量级，因此宽泛的集团 TAM 不能替代 xAI 的
              SAM 或 SOM。公开来源没有提供足够的产品级需求、定价、地域或可获取份额数据，无法在不制造虚假精确度的情况下连接这两个视角。
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM011
              - CM012
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM006
