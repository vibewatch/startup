  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 环境与监管责任：孟菲斯基础设施挑战
        blocks:
          - type: paragraph
            body: >-
              xAI 快速部署 Colossus 计算园区，在多个司法辖区引发严重法律和监管敞口。2026 年 4 月，NAACP 提起联邦《清洁空气法》诉讼，指称 xAI 及其运营子公司 MZX Tech 在密西西比州
              Southaven 安装并运行 27 台燃气涡轮机，却未取得必要的建设前许可。xAI 与 Mississippi Department of Environmental Quality 协商同意命令，待永久
              1.2 GW 天然气电厂上线后逐步淘汰临时发电；但建设延误和替代涡轮机供应链摩擦，直接带来法院命令削减电力的风险。与此同时，Grok 能生成未经同意的性化图像后，加拿大和欧洲的数据保护机构启动正式调查。根据 EU
              AI Act，基础模型供应商若合规失败，可能面临最高 35 million euros 或全球营业额 7% 的法定罚款。此外，xAI 还面临明尼苏达州 HF 1605
              的即时州级敞口：联邦法院拒绝禁令救济后，每次违规的法定赔偿最高达 500,000 dollars。
