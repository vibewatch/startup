              - CV008
              - CV013
              - CV015
      - number: '8.2'
        title: 融资、据报估值与可比背景
        blocks:
          - type: paragraph
            body: >-
              最强的公开锚点是 2026 年 1 月 Series E：Wall Street Journal 和 CNBC 均报道融资 $20 billion，CNBC 报道该融资将 xAI 估值定在约 $230
              billion。Forge 也显示 $230 billion 投后估值，但说明投后数值是根据公司提交的公司注册证书作出的估计，并声明未独立验证。据报累计融资总额并不一致：Forge 显示 $37.45
              billion，Tracxn 报告九轮合计 $45 billion，Multiples 报告五轮合计 $36 billion，RevenueMemo 报告包含债务在内约 $43
              billion。这些数字使用不同的交易数量和资本口径，因此都不应解读为当前可用现金。CNBC 报道的 OpenAI 和 Anthropic
              估值可作市场背景，不是估值基准：收入基础、资本结构和日期不同，无法进行可辩护的倍数比较。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV011
              - CV012
      - number: '8.3'
        title: 乐观、基准与悲观框架
        blocks:
          - type: paragraph
            body: >-
              情景分析应把经营结果与已观察到的交易估值分开。乐观情景下，供应商协同和深厚融资能力转化为持久的模型需求及改善的单位经济性；但公开证据仍不足以支持独立价值区间或目标回报。基准情景下，xAI 仍具战略重要性，但据报
              $230 billion 轮次估值和 $250 billion
              收购估值只能作为交易参考，不是内在价值终点。悲观情景下，监管限制、基础设施反对或持续亏损损害经济性，而不透明的分部报告阻止投资者量化下行。据报收购估值比据报 Series E 估值高约
              8.7%，相对于底层分母的不确定性只是小幅上调。由于现有证据缺少经审计独立财务数据，任何情景都不赋予数字概率。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
      - number: '8.4'
        title: 进入纪律、退出敞口与尽调要求
        blocks:
          - type: paragraph
            body: >-
              现有来源称 SpaceX 于 2026 年 2 月 2 日收购 xAI，Multiples 将 xAI 交易价值定为 $250 billion；因此 Value Add VC 将 $230 billion
              Series E 视为最终独立价格。这使公开证据中不再存在干净的 xAI 单独进入或退出工具，任何回报或持有期目标都取决于合并实体的资本结构和披露。优先权悬置也尚未解决。Forge
              展示轮次级优先权字段，但公开页面不足以确定完整清算瀑布、转换选择、投资者保护或其在据报收购中的处理。最终尽调应取得经审计分部财务、已签署的收购与换股文件、完整优先权表和一致的收入定义。没有这些材料，稀释和终端收益都无法纳入投资判断。
            claimRefs:
              - CV008
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: 展品
        blocks:
          - type: callout
            title: 公开证据不支持目标价格
            body: 只能把据报 $230 billion 和 $250 billion 估值作为交易背景。要确定可辩护的进入价格、目标回报、持有期或下行区间，需要经审计的独立或分部现金流，以及已签署的资本结构文件。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV008
              - CV014
              - CV016
          - type: callout
            title: 聚合数据库的精确数字不等于验证
            body: 公开数据库对成立年份、累计融资、收入标签和交易数量说法不一。看似精确的数字不能替代经审计账目、已签署融资文件或监管机构备案的交易记录。
            calloutType: risk
            claimRefs:
              - CV005
              - CV011
              - CV012
