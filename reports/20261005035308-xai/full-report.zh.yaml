      - number: '7.3'
        title: 战略交易对手依赖：Nvidia 集中度与锚定客户租约
        blocks:
          - type: paragraph
            body: >-
              xAI 在硬件采购和商业算力租赁两端都呈现极端交易对手集中度。供应端方面，公司管理层宣布专属架构策略，在地面数据中心及拟议的轨道算力载荷中全部标准化采用 Nvidia GPU 和 Vera
              CPU。这种单一来源姿态消除了双重采购弹性，使 xAI 直接暴露于 Nvidia 配额、平台溢价和架构交付时间表。商业分发端方面，外部收入高度集中于与 Google 在 Colossus 2 的数十亿美元 GPU
              产能租约。协议规定，若 2026 年 9 月 30 日后一个月宽限期结束时仍未达到约定集群交付里程碑，Google
              可终止安排或重新协商折扣算力费率。任何租约争议或规模削减都会立即削弱外部算力现金流，并提高闲置数据中心产能的持有成本。
            claimRefs:
              - CR006
              - CR008
              - CR009
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.4'
        title: 财务模型不透明、资本密集度与治理风险
        blocks:
          - type: paragraph
            body: >-
              在 2026 年 2 月 2 日被 SpaceX 吸收前，xAI 为前沿模型研究和大型硬件集群融资，吸收了约 43 billion dollars 的股权和债务资本。2026 年 1 月 Series E
              将企业估值定为 230 billion dollars，随后全股票收购把股权治理完全转入
              SpaceX。这一结构掩盖了独立运营经济性。商业第三方收入估计依赖未经验证的专有模型，而非经审计财务披露，使外部投资者无法独立验证毛利率、年化经常性收入或净运营消耗。2026 年 6
              月，一名前安全工程师提起加州非法解雇诉讼，指称其提出 Grok 安全护栏担忧后遭到报复，治理摩擦进一步浮现。没有经审计的分部报告或公开财务报表，资本投资者始终无法看清 AI 运营底层成本结构和现金跑道。
            claimRefs:
              - CR003
              - CR009
              - CR010
              - CR011
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR008
              - CR012
              - CR013
      - number: '7.5'
        title: 展品
        blocks:
          - type: callout
            title: 《清洁空气法》禁令威胁 Colossus 运营连续性
            body: >-
              NAACP 针对 Southaven 27 台无许可天然气涡轮机的诉讼，直接暴露了 Colossus 园区的运营脆弱性。若禁令救济在永久 1.2 GW 设施投产前就叫停涡轮发电，xAI 将立即削减 GPU
              使用并违约商业交付。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: 单一供应商芯片集中放大资本风险
            body: xAI 专门采用 Nvidia GPU 和 CPU 架构，造成尖锐的单一交易对手依赖。虽然这能保证 Grok 5 和轨道算力计划的架构一致性，但单一来源姿态让公司在全行业供应紧张时失去芯片采购议价能力。
            calloutType: insight
            claimRefs:
              - CR008
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              可投资逻辑是：xAI 的 $20 billion Series E 超过此前目标，同时吸引财务投资者和战略供应商，说明其获得资本与基础设施关系的能力异常强。Nvidia 和 Cisco
              被描述为投资者兼供应商或战略伙伴，因此融资还体现生态协同，而不只是独立交易的价格发现。进入端更有决定性的反向逻辑是：约 $230 billion
              的轮次估值，在现有公开证据中没有经审计的独立收入、利润率、烧钱、留存或现金数据相伴。独立报道还指出 Grok
              输出受到监管调查，孟菲斯基础设施面临空气质量担忧。这些条件使机会对价格和下行都敏感。在经审计财务和交易证据支持回报模型前，建议为继续研究，信心中等、风险高、估值偏贵。
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
