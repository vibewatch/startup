  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 决策链条将已验证的融资规模与缺失的经济性证明分开，最终给出继续研究的建议。
    data:
      nodes:
        - id: financing
          label: $20B Series E 轮
          detail: 独立报道的本轮融资金额超过此前 $15B 的目标
        - id: valuation
          label: 据报道约 $230B 的估值
          detail: 这是融资参考值，不是经审计的内在价值结论
        - id: structure
          label: 据报道以 $250B 收购 SpaceX
          detail: 指定证据止于对 xAI 独立价格发现的支持
        - id: economics
          label: 财务分母不一致
          detail: 公开数据库对融资和收入定义存在分歧
        - id: risk
          label: 下行不确定性高
          detail: 监管、基础设施、亏损和治理敞口仍然存在
        - id: decision
          label: 继续研究
          detail: 需要经审计的分部经济数据和交易原始文件
      edges:
        - from: financing
          to: valuation
        - from: valuation
          to: structure
        - from: structure
          to: economics
        - from: economics
          to: risk
        - from: risk
          to: decision
    approximationNotes: 该流程用于分析且不代表比例关系；美元数值是已报道的交易估值，不代表任何换算率或概率。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV008
      - CV013
      - CV015
