      - number: '7.2'
        title: 运营扩张瓶颈：电力基础设施与涡轮机约束
        blocks:
          - type: paragraph
            body: >-
              xAI 的基础设施扩张战略受到工业电力接入、电网瓶颈和精密硬件制造周期的严格约束。在大孟菲斯地区运营近 100 万个 GPU，需要接近大都市公共电网的电力容量。由于公共事业无法立即提供吉瓦级并网，xAI
              严重依赖移动燃气涡轮发电机。然而，高效率天然气涡轮机的全球供应链积压严重，一级供应商的订单已排到 2030 年。对此，SpaceX 在得州 Bastrop
              启动内部铸造业务，浇铸镍基超合金涡轮叶片，以缩短设备交付周期。这种非常规垂直整合带来显著运营执行风险，包括制造缺陷率和环境审批延误。若替代涡轮机安装错过监管停用节点，xAI 将面临集群被迫停机，进而影响 Grok
              5 训练并违反对合同企业算力租户的交付承诺。
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
