        blocks:
          - type: paragraph
            body: >-
              xAI 的客户生态分为四个结构上不同的层级，各自的经济性、采购动态和留存行为差异很大。最广的一层是通过 X 平台集成和独立订阅使用 Grok 的消费者终端用户。2025 年与 X 整合、随后并入 SpaceX
              后，Grok 到 2026 年 3 月约有 1.17 亿月活，主要通过捆绑的 X Premium 和 Premium+ 档位变现，同时提供直接 SuperGrok 订阅（$30/月）和 SuperGrok
              Heavy（$300/月）。第二层是企业和开发者 API 客户，按用量支付 token 费率（Grok 4.5 至 Grok 4.7 每百万输入 token $2、每百万输出 token $6），并采用 Grok
              Bot 和新收购的 Cursor 编码生态等开发者工具，后者服务超过 50,000 家企业。第三层是公共部门，以 GSA OneGov 计划下的联邦采购为核心，促销价为每个组织 $0.42，同时包括上限 $200
              million 的国防部合同，以及在 Impact Level 5 的 GenAI.mil 上部署到五角大楼。第四层、也是财务上占主导的一层，是批发算力租赁：xAI 向同行 AI 开发者出租 Colossus
              超级集群产能，产生近期企业现金流的绝大多数。
