  - id: FU001
    title: xAI 商业化采用与扩张路径
    type: journey-map
    summary: 从漏斗顶部的消费者触达到企业集成和算力批发租赁的多层级客户扩张路径。
    data:
      items:
        - label: 认知与发现
          description: 借助 X 平台 550M 月活用户和实时公开趋势分析，实现漏斗顶部的大规模触达。
          touchpoints:
            - 集成在 X 时间线中的 Grok 提示词
            - 公开传播的基准测试和社交讨论
            - GSA OneGov 联邦机构公告
        - label: 评估与进入
          description: 通过消费者层级、免费开发者试用和补贴型公开试点，降低初次采用门槛。
          touchpoints:
            - X Premium 套餐（$8-$16/mo）
            - 每个机构 $0.42 的联邦试点协议
            - Grok Bot 为期 2 周的企业免费试用
        - label: 消费者变现
          description: 直接转化为面向专业消费者的高端对话订阅。
          touchpoints:
            - SuperGrok（$30/mo）对话层级
            - SuperGrok Heavy（$300/mo）高级用户访问权限
        - label: 开发者与企业采用
          description: 转化为专用业务工作流、开发者 API 消耗和专业化编码工具。
          touchpoints:
            - 开发者 API（每百万 tokens 收费 $2/$6）
            - 覆盖 50,000 家企业的 Cursor 企业编码席位
            - Grok Bot 企业网络和审计控制
        - label: 联邦与国防运营
          description: 正式机构部署、安全授权和专业化任务支持。
          touchpoints:
            - GenAI.mil 影响级别 5 国防部署
            - GSA OneGov 专属工程入驻支持
            - FedRAMP 授权升级路径
        - label: 算力批发租赁
          description: 多年期超级计算基础设施租赁，为数据中心资本开支提供融资支撑。
          touchpoints:
            - 多年期 Colossus GPU 批发租赁（积压订单 $76B+）
            - Colossus 1 专用集群部署（Anthropic）
            - Colossus 2 GB300 专用容量（Google 与 Reflection AI）
    approximationNotes: 展示消费者、企业、政府和基础设施各细分领域的结构性客户路径阶段。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU007
      - CU008
  - id: FR001
    title: 风险热力图
