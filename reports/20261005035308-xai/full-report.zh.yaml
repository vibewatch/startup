chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与所有权
        blocks:
          - type: paragraph
            body: >-
              Elon Musk 于 2023 年 3 月在内华达州创立 xAI，公司称其使命是打造理解宇宙、加速科学发现的 AI。Britannica 将帕洛阿尔托列为总部；xAI
              当前公司页面另列出帕洛阿尔托、西雅图、孟菲斯和伦敦办公室，因此不能把更广的办公版图误认为多个总部。核心产品是 Grok，2023 年 11 月上线，作为可实时访问 X 数据的 AI 聊天机器人。xAI
              的里程碑记录如今还显示消费者应用、企业产品、语音和智能体 API，以及通过第三方云平台分发，但没有披露这些渠道各自的收入贡献。


              公司边界在不到一年内两次改变。xAI 于 2025 年 3 月以全股票交易收购 X，随后于 2026 年 2 月加入 SpaceX 并成为其子公司。因此，当前尽调对象是更大集团内的 AI
              运营业务，而不是边界清晰、可单独拆分的发行人。公开来源支持这一交易顺序，但现有证据没有披露转让定价安排、关联公司间义务、董事会构成或少数股东保护。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
