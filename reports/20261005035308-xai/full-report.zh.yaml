      - number: '6.3'
        title: 客户集中度、监管逆风与部署风险
        blocks:
          - type: paragraph
            body: >-
              在醒目的规模数字之下，xAI 面临前所未有的客户集中度和威胁商业持久性的运营逆风。财务集中极端：前三大算力租赁交易对手 Anthropic、Google 和 Reflection AI 的年化合同运行率约为
              $27 billion，远超 API 和直接订阅收入。关键在于，Google 的 Colossus 2 协议设有严格交付里程碑：Google 约 110,000 个 GPU 的配额须在 2026 年 9 月 30
              日前全部交付；若未完成，一个月宽限期后可终止合同或降低费用。同时，企业和消费者领域都出现严重采购与法律摩擦。消费者和企业安全方面，2026 年 1 月在加州北区提交的联邦集体诉讼指称，Grok
              生成未经同意的性露骨深度伪造内容，构成产品责任、过失和不公平商业行为；该案引发 35 名州检察长和欧盟调查，并涉及明尼苏达州 HF 1605 反裸体化法规。基础设施方面，NAACP 就为孟菲斯 Colossus
