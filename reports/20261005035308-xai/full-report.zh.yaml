      - - 悲观
        - 监管约束、基础设施反对或持续亏损会降低变现能力并推高资本需求
        - 没有经核实的收入基础与负债瀑布，下行空间无法量化
        - 未评分；存在反向证据，但无法量化暴露
        - 执法、许可中断或持续负面的运营结果
    notes: 情景为定性判断，因为指定公开证据没有提供经审计的独立预测；$230B 与 $250B 是据报道的交易估值，不是预测终点。
