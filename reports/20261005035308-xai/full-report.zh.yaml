  - id: TV002
    title: 投资逻辑与反向逻辑决策测试
    columns:
      - 视角
      - 证据支持的论点
      - 改变判断的因素
      - 当前含义
    rows:
      - - 投资逻辑
        - 一轮增发至 $20B 的融资显示其获得战略与金融资本的能力非同寻常
        - 经审计的证据证明资本带来可持续毛利与正向单位经济效益
        - 融资渠道强大确实存在，但不能证明经济回报
      - - 反向逻辑
        - 独立报道发现监管调查与基础设施反对，而公开财务披露仍不一致
        - 调查结案、稳定有效的许可与经审计的分部经济数据
        - 运营与监管不确定性足以支持高风险评级
