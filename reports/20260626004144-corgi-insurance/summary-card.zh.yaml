  topStrengths:
    - AI 原生全栈 carrier 模型可吃到承保利润，而不是像经纪同行只赚佣金
    - ARR 增长异常快：2024 年中 $1.2M，不到 18 个月到 2025 年 12 月超过 $40M
    - 40,000+ 活跃客户和公司声称低于 1% 的流失率，指向强产品市场契合
    - TCV 领投的 B 轮和 B1 轮相隔三周连续完成，显示投资人信心异常强
    - 自研 AI 责任险产品切中真实且供给不足的保障缺口
  topRisks:
    - TRRG 是 RRG：州保险破产担保基金不覆盖保单持有人
    - Carrier 牌照未满 12 个月；不利理赔发展是核心未证实风险
    - 估值 22 天翻倍（$1.3B → $2.6B）；65x ARR 倍数高度依赖增长
    - 所有财务指标均由公司披露且未经审计；没有公开 loss ratio 或 combined ratio
    - 初创客户群天然波动；VC 融资放缓会直接压缩 TAM
  unresolvedGaps:
    - 经审计财务、loss ratio、combined ratio 和实际理赔经验未公开
    - CAC、回本周期和销售效率指标未披露
    - TRRG 资本充足性和再保险结构未公开
    - 卡车运输扩张承保表现：首个公布垂直没有历史记录
