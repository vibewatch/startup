      - number: '5.2'
        title: AI-native underwriting engine and customer workflow
        blocks:
          - type: paragraph
            body: >
              Corgi's product promise depends on compressing a historically manual insurance workflow into a
              software-mediated process that founders can complete in one sitting for standard lines. Public
              descriptions of the system say the company uses large language models to read application materials,
              assess risk, generate quotes, administer policies, and support claims handling. Nubia's review
              characterizes the system as a "regulatory bare metal" stack, meaning Corgi applies AI directly to
              regulated insurance tasks rather than merely wrapping a broker experience around a legacy carrier backend.
              In practical terms, the company appears to gather structured inputs such as company stage, revenue,
              headcount, sector, product profile, and jurisdiction, then use that information to produce a priced quote
              rapidly for standard products.

              The workflow is designed around speed and continuity. Corgi says core startup lines can be quoted in 10-15
              minutes, specialty products take one to fourteen business days, and certificates can be delivered
              digitally within minutes of binding. Claims are also part of the full-stack promise: the same company that
              underwrites the policy handles the claim, which reduces handoffs common in broker-led structures. The
              dashboard is positioned as a 24/7 operating surface for adding or removing coverage, downloading
              certificates, and managing renewals. What remains opaque is the technical substrate: Corgi has not
              disclosed the foundation-model vendors, model architecture, accuracy benchmarks, or review thresholds that
              determine when humans step in.
