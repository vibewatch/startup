            body: >-
              Corgi has assembled compelling customer stories, but the underlying evidence base is thinner than the
              headline logos imply. Most named proof comes from Corgi's own customer pages, while public independent
              validation of ARR, customer count, renewal behavior, and outcome claims is limited. That does not
              invalidate the traction story, but it means diligence should rely on direct customer calls and internal
              operating data rather than marketing pages alone.
