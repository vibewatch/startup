          - type: callout
            title: Rapid Valuation Expansion — $1.3B to $2.6B in 22 Days
            body: >-
              Corgi's valuation doubled from $1.3B (Series B, May 6 2026) to $2.6B (Series B1, May 28 2026) in 22 days.
              This pace is unusual even for high-growth insurtechs and reflects strong investor demand at the current
              growth trajectory. The risk is that this multiple expansion embeds assumptions about growth continuation,
              margin improvement, and market expansion that may not materialize. If ARR growth decelerates, loss ratios
              deteriorate, or the AI Liability product faces adverse claims, the valuation multiple could compress
              sharply. Diligence should model downside scenarios where growth is 50% of current trajectory and combined
              ratios are 105% rather than sub-100%.
