      - number: '7.4'
        title: Partner, dependency, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Corgi's go-to-market and operating model rely on a small set of critical dependencies that can change
              economics or viability without any direct change in customer demand. The most obvious is the TRRG license
              itself: because the carrier entity underpins the whole product stack, any regulatory action against that
              vehicle would affect nearly every line at once. Reinsurance is a second dependency with similar importance
              but less public transparency. If counterparties reduce capacity, tighten terms, or reprice aggressively,
              Corgi could face lower limits, worse margins, or higher retained risk while still needing to serve startup
              customers expecting speed and low premiums. Distribution concentration adds another layer. Public evidence
              suggests YC is the primary customer-acquisition engine, which is a major strength while community trust
              holds but a material weakness if YC founder sentiment shifts or a competing insurer becomes the preferred
              partner. The company also appears dependent on undisclosed cloud and AI infrastructure providers,
              cap-table and workflow APIs, and a founder-centric operating core. None of these dependencies is unusual
              for a young insurtech, but the combination matters. Corgi has built a platform that is broad in visible
              product reach yet narrow in several invisible load-bearing relationships, so diligence should treat
              resilience of counterparties and channels as first-order underwriting variables rather than as background
              operational details.
            claimRefs:
