      - number: '6.2'
        title: Adoption trajectory and growth metrics
        blocks:
          - type: paragraph
            body: >
              The headline adoption claim is striking: Corgi reported 40,000+ active customers and $40M+ ARR in its
              January 2026 launch materials, only months after TRRG became an operating carrier. Taken at face value,
              that implies one of the fastest early customer ramps in startup-insurance history. The supporting math is
              at least directionally coherent. Dividing $40M ARR by 40,000 customers yields an average revenue per
              customer of roughly $1,000 annually, which fits the company's positioning around early-stage startups
              purchasing baseline commercial insurance bundles rather than large, multi-million-dollar enterprise
              programs. Public reporting around the January raise and May follow-on financing also supports the
              narrative that Corgi scaled rapidly through 2025 rather than only at launch.

              That said, the evidence quality is still mixed. The customer count, ARR figure, and churn metric are all
              company-claimed and surfaced through press materials, not audited filings or a lender-quality data room.
              No public source independently verifies whether "customers" means unique businesses, unique bound
              policies, or a broader account definition that includes multiple policies per company. Similarly, there is
              no disclosed third-party audit of ARR, cohort retention, or bind conversion. The growth story is therefore
              plausible and internally consistent, but investors should treat it as management-reported traction rather
              than a fully verified operating dataset.
