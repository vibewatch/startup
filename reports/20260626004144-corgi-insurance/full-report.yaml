  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      The heatmap places Corgi's most important risks by expected likelihood and impact. The highest- priority quadrant
      is the combination of AI model mispricing and regulatory-compliance complexity, because those are the pathways
      most likely to damage the carrier model before long operating history exists.
    data:
      columns:
        - Low Impact
        - Medium Impact
        - High Impact
        - Critical Impact
      rows:
        - label: High Likelihood
          values:
            - YC concentration
            - Operational burn/culture
            - Regulatory compliance complexity
            - AI model mispricing (adverse selection)
        - label: Medium Likelihood
          values:
            - VC funding slowdown
            - API dependency failure
            - Claims dispute spike
            - AI Liability adverse development
        - label: Low Likelihood
          values:
            - Cap table API revocation
            - SOC 2 breach
            - TRRG license challenge
            - Reinsurance capacity withdrawal
        - label: Very Low Likelihood
          values:
            - Founder departure
            - Catastrophic AI liability claim
            - Federal prohibition of RRG model
            - Complete ARR restatement
    claimRefs:
      - CR001
      - CR008
      - CR013
      - CR021
      - CR029
      - CR032
      - CR038
      - CR042
      - CR044
  - id: FR002
    title: Risk transmission map
    type: dag
    summary: >-
      The core transmission path for Corgi runs from AI underwriting error into loss ratio pressure, then into reserve
      inadequacy, regulatory or capital action, and finally a broken carrier thesis.
    data:
      nodes:
        - id: ai-mispricing
          label: AI model mispricing
          detail: Systematic underpricing of AI Liability or Cyber risk by AI-driven underwriting.
        - id: loss-ratio-deterioration
          label: Loss ratio deterioration
          detail: Claims exceed premium expectations and the combined ratio breaches sustainable levels.
        - id: reserve-inadequacy
          label: Reserve inadequacy
          detail: TRRG holds insufficient reserves to pay outstanding claims at maturity.
        - id: regulatory-action
          label: Regulatory action
          detail: NAIC or state regulators impose corrective action on TRRG.
        - id: capital-shortfall
          label: Capital shortfall
          detail: TRRG requires additional equity to maintain surplus adequacy.
        - id: thesis-break
          label: Thesis break
          detail: Carrier-model viability is undermined and the valuation basis compresses.
      edges:
        - from: ai-mispricing
          to: loss-ratio-deterioration
        - from: loss-ratio-deterioration
          to: reserve-inadequacy
        - from: reserve-inadequacy
          to: regulatory-action
        - from: reserve-inadequacy
          to: capital-shortfall
        - from: regulatory-action
          to: thesis-break
        - from: capital-shortfall
          to: thesis-break
    claimRefs:
      - CR020
      - CR022
      - CR028
      - CR037
      - CR038
      - CR039
  - id: FR003
    title: Dependency map
    type: dag
    summary: >-
      Corgi's platform depends on six critical external or concentrated relationships; TRRG carrier status and the
      founders are the clearest single points of failure, while YC and reinsurance are the two most important scaling
      dependencies.
    data:
      nodes:
        - id: corgi-platform
          label: Corgi platform
          detail: Central AI-native insurance platform and go-to-market engine.
        - id: trrg
          label: TRRG carrier license
          detail: Technology Risk Retention Group, Inc., the underwriting vehicle.
        - id: reinsurance
          label: Reinsurance program
          detail: Undisclosed reinsurers providing risk-transfer capacity.
        - id: yc-network
          label: YC network
          detail: Primary customer-acquisition channel.
        - id: ai-infra
          label: Cloud AI infrastructure
          detail: Undisclosed cloud providers powering the underwriting stack.
        - id: founders
          label: Founders (Laqua/Yuan)
          detail: Two-person strategic and operational concentration.
        - id: regulators
          label: State/federal regulators
          detail: 45+ jurisdictions requiring ongoing compliance and license maintenance.
      edges:
        - from: corgi-platform
          to: trrg
        - from: corgi-platform
          to: reinsurance
        - from: corgi-platform
          to: yc-network
        - from: corgi-platform
          to: ai-infra
        - from: corgi-platform
          to: founders
        - from: corgi-platform
          to: regulators
    claimRefs:
      - CR029
      - CR031
      - CR032
      - CR033
      - CR034
      - CR036
  - id: FV001
    title: ARR growth trajectory
    type: bar
    summary: >-
      Corgi's ARR appears to have grown from approximately $1.2 million in mid-2024 to $40 million by December 2025. The
      2026 estimate is a directional analyst projection rather than a disclosed company figure.
    data:
      items:
        - label: Mid-2024
