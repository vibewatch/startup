      - number: '6.3'
        title: Named customer proof and case studies
        blocks:
          - type: paragraph
            body: >
              Corgi's strongest customer-proof assets are its named case studies, which repeatedly frame the product as
              a speed and fit solution for founders facing a blocking insurance requirement. Artisan is the clearest
              economic proof point: the company says it switched from a traditional broker, saved about 30%, and bound
              in two days so it could satisfy banking-related enterprise requirements. Eragon's case centers on
              procurement velocity, with the founder describing a shift from a multi-week insurance checklist problem to
              a days-long close. Sorcerer shows the other side of the thesis: not every startup fits generic software
              underwriting, and hardware- linked or climate-adjacent businesses may value a carrier willing to tailor
              coverage rather than force a standard template. Intryc and Imagine AI reinforce the onboarding-speed
              message, including near-instant quoting, digital documentation, and a founder-facing support experience.

              The limitation is not the absence of named logos, but the independence of the evidence. Nearly all primary
              customer proof comes from Corgi's own curated customer pages, where the company selects the quotes, the
              examples, and the framing. The only higher-independence named customer corroboration in the provided
              source set is TechCrunch's mention of Deel as a customer. That helps because Deel is a credible,
              recognizable enterprise software logo, but the article does not detail policy scope, premium volume, or
              renewal history. Overall, the case studies are directionally persuasive for product-market fit, yet they
              stop short of the independent, portfolio-level customer validation that later-stage diligence would
              ideally require.
