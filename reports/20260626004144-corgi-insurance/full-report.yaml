      - number: '7.3'
        title: Financial and actuarial model risk
        blocks:
          - type: paragraph
            body: >-
              The financial risk in Corgi is structural: once the company chose a full-stack carrier model, it accepted
              reserve, surplus, and risk-transfer obligations that a broker-led startup would not have to carry. That is
              attractive when underwriting works because economics and product control improve, but it is unforgiving if
              loss development surprises, reinsurers retrench, or premium growth outruns statutory capital. Public
              sources do not disclose TRRG's reserve methodology, surplus-to-premium ratio, combined ratio, or
              reinsurance attachment points, which means outside observers cannot verify whether capital adequacy is
              conservative, merely sufficient, or thin. The company has raised substantial equity and management has
              claimed profitability, yet both the financial quality of those claims and the durability of the current
              valuation depend on numbers that remain unaudited in the public set. The newest product lines add further
              uncertainty. AI Liability is effectively a first-mover actuarial experiment, and trucking expansion
              introduces a claim profile with very different severity and frequency behavior from software-centric
              startup liability products. If adverse development appears in either area, the risk can transmit quickly:
              loss ratio deterioration pressures reserves, reserve pressure invites regulatory scrutiny, and both can
              force additional capital raises or a sharp valuation reset. The public record therefore supports optimism
              about demand, but not confidence that the carrier model has already been economically stress-tested.
            claimRefs:
              - CR020
              - CR021
              - CR022
