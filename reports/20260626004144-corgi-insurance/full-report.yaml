  - id: FO001
    title: Corgi funding and valuation timeline
    type: timeline
    layout: wide
    summary: >-
      Corgi moved from founding in 2024 to a $2.6B valuation in under two and a half years, with three distinct
      financings in a five-month window in 2026.
    data:
      items:
        - date: '2024'
          label: Founded; YC S2024
