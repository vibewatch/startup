      - number: '8.2'
        title: Comparable companies and precedent transactions
        blocks:
          - type: paragraph
            body: >-
              Comparable analysis shows how exceptional Corgi's current price is. The cleanest direct marker is Corgi
              itself: the May 6, 2026 Series B valued the business at $1.3 billion on the same company-stated $40
              million ARR base, and the May 28, 2026 Series B1 valued it at $2.6 billion, doubling the implied multiple
              from 32.5x to 65.0x in only 22 days. That is not normal even in a growth-friendly financing market.
              Looking outside Corgi, the closest strategic transaction is ERGO's 2025 acquisition of Next Insurance at
              roughly $2.6 billion. Next was meaningfully more mature, with a much larger premium base and a longer
              underwriting record, which makes the equal headline valuation informative but not supportive of Corgi's
              entry price on a risk-adjusted basis. Coalition's $5.0 billion private valuation on roughly $500 million
              GWP and Cowbell, Pie, Vouch, and Embroker funding histories suggest investors will pay meaningful premiums
              for full-stack or differentiated insurtech carriers, but the sector's benchmark multiples still sit well
              below Corgi's current ARR framing. In other words, the comparable set explains why a high multiple is
              possible, not why a 65x multiple is conservative. The precedent evidence supports a view that Corgi is
              being valued as an AI-native category leader whose best years are ahead; it does not support the claim
              that present public metrics alone justify the latest round price.
            claimRefs:
              - CV001
              - CV002
