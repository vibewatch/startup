      - number: '4.2'
        title: Pricing and Monetization Structure
        blocks:
          - type: paragraph
            body: >-
              Corgi uses a direct carrier pricing model: premiums are set by its own underwriting team without broker
              commission layers. Published startup insurance cost guides indicate that pre-seed coverage (CGL + Tech E&O
              baseline) starts at approximately $500–$2,000 per year, with seed-stage bundles in the $2,000–$4,000
              range, Series A packages (adding D&O and EPLI) in the $10,000–$25,000 range, and growth-stage programs
              exceeding $30,000 annually. These are list prices; actual premiums vary by risk profile, limits selected,
              industry, and claims history. The company's full-stack carrier position enables Corgi to offer up to 30%
              cost savings versus broker competitors in some cases, according to a customer testimonial from Artisan
              (Corgi's own case study). The pricing model includes an instant-bind self-serve path for standard lines
              (quote in 10–15 minutes, bind same day) and a human broker channel for specialized lines requiring 1–14
              days of underwriting. There is no publicly disclosed volume discount or enterprise pricing schedule.
              Contract terms are annual policies with standard commercial insurance renewal cycles. Workers comp and
              some specialty lines may be billed on payroll-adjusted basis. The monetization model does not include
              subscription SaaS revenue; revenue is 100% insurance premium-driven as disclosed in public statements.
              This means revenue is correlated to premium volume and loss experience rather than contracted recurring
              SaaS revenue, creating volatility risk that pure SaaS models do not have.
            claimRefs: []
