      - number: '4.3'
        title: Unit Economics and Efficiency Metrics
        blocks:
          - type: paragraph
            body: >-
              Corgi's publicly disclosed unit economics are limited to three company-stated metrics: average revenue per
              customer of approximately $1,000 per year (derived from $40M+ ARR / 40,000 customers), customer churn
              below 1% annually (company-claimed, unaudited), and a CEO statement of profitability in April 2026. No
              CAC, payback period, gross margin, combined ratio, or loss ratio has been publicly disclosed. The sub-1%
              annual churn rate, if accurate, is exceptional for commercial insurance and implies very high LTV relative
              to CAC — the implied LTV at 1% churn is 100x ARPC (assuming constant revenue), or approximately $100,000
              per customer at current ARPC. However, commercial insurance churn is generally understated in the early
              stages of a portfolio because the majority of policyholders have not yet had a renewal event; the true
              retention rate will only be verifiable after 24–36 months of portfolio seasoning. The YC network as
              primary distribution channel implies a potentially low CAC (partner referral rather than paid
              acquisition), but this has not been confirmed with numbers. Coverage costs for AI-native claims processing
              may be lower than traditional carrier cost structures, but Corgi has not disclosed headcount per policy,
              automation rate, or claims frequency/severity data. The full-stack carrier model means Corgi bears the
              full insurance risk — unlike brokers, its economics include the actuarial uncertainty of loss development,
              especially for D&O and Cyber lines with multi-year development tails. Adverse scenarios where loss ratios
              deteriorate (e.g., a wave of AI Liability claims) could significantly impair profitability without the
              buffer of external carrier paper.
