  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              The startup commercial insurance market in 2026 is contested by three distinct competitor classes. First,
              direct insurtech peers—principally Vouch and Embroker—have built digital brokerage platforms purpose-built
              for startup buyers, offering streamlined quoting and startup-stage products but relying on external
              carriers for underwriting. Second, specialist insurtechs have carved out single-vertical or single-line
              positions: Coalition dominates cyber insurance with its Active Insurance model, Cover Whale applies AI to
              trucking fleet risk, Pie Insurance focuses on workers compensation, and Cowbell Cyber provides AI-driven
              cyber pricing for SMBs. Third, incumbent carriers—Chubb, The Hartford, and Progressive Commercial—control
              the broader commercial insurance market, hold full carrier licenses, and are expanding digital
              capabilities but do not segment specifically for venture-backed tech companies. Corgi sits at the
              intersection of full-stack carrier and insurtech: it owns its own underwriting entity (TRRG), generates
              margin as a carrier rather than a broker, and applies AI-native tooling across the entire policy
              lifecycle. No other player combines startup-stage modular coverage, instant bind, AI Liability, and
              full-stack carrier economics in a single platform as of mid-2026. The competitive map is evolving rapidly:
              Next Insurance was acquired by ERGO/Munich Re in 2025 for approximately $2.6 billion, signaling that large
              incumbent carriers are willing to pay for AI-forward distribution capabilities and scale in the SMB
              segment. Corgi's dual advantage of carrier margin and insurtech speed will be tested as incumbents invest
              in digital transformation and as direct insurtechs mature their underwriting capabilities.
