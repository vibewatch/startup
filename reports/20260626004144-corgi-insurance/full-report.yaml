      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: At 65x ARR, Corgi requires flawless execution to return capital at Series B1 entry
            body: >-
              The May 2026 Series B1 price leaves almost no room for ordinary execution slippage. At roughly 65x
              company-stated ARR, investors are underwriting not just continued growth, but rapid proof that Corgi's
              full-stack carrier model can hold attractive loss ratios while scaling into new products and geographies.
              The probability-weighted scenario model lands almost exactly on the $2.6 billion entry value, which means
              downside scenarios do not just reduce upside — they erase capital quickly. That is why the latest round
              should be understood as a high-conviction, low- margin-of-safety entry rather than as an obviously cheap
              growth asset.
            calloutType: risk
            claimRefs:
              - CV001
              - CV003
              - CV022
          - type: callout
            title: >-
              The Next Insurance comp is instructive but misleading — Corgi is priced for a future that Next never
              reached at equivalent maturity
            body: >-
              The most eye-catching comparable is ERGO's approximately $2.6 billion acquisition of Next Insurance,
              because it matches Corgi's current headline valuation. But the comparison flatters Corgi more than it
              validates it. Next reached that price with a longer operating record and a meaningfully larger premium
              base, while Coalition's and broader sector benchmarks still imply much lower valuation multiples than
              Corgi's 65x ARR framing. The lesson is not that Corgi is wrongly valued by definition; it is that
              investors are paying today for a future state of scale, underwriting quality, and exit optionality that
              peers had to earn over a longer period.
            calloutType: insight
            claimRefs:
              - CV011
              - CV012
              - CV036
          - type: callout
            title: >-
              A conditional positive thesis is available: carrier economics are structurally sound, but require 2+ years
              of combined ratio evidence to validate
            body: >-
              The reason Corgi remains investable despite a stretched entry multiple is structural, not evidentiary: if
              a full-stack AI-native carrier truly acquires customers cheaply, underwrites well, and holds reserves
              conservatively, it can be more valuable than broker-led insurtech peers. What investors do not yet have is
              the proof. A disciplined buyer should therefore treat the thesis as conditional on evidence: statutory
              statements, reinsurance schedules, and at least a multi-year line-level claims record that demonstrates
              combined ratios below 100% and adequate reserve development. Until that evidence exists, the current
              valuation is a forward bet rather than a settled fact.
            calloutType: insight
            claimRefs:
              - CV037
              - CV044
              - CV028
