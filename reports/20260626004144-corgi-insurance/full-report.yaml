      - number: '7.5'
        title: Risk mitigations, monitoring signals, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The good news in Corgi is that the major risks are monitorable even if they are not yet fully measurable
              from public information. The company's broad licensing progress, strong fundraising, high growth, and
              apparent product-market fit in startup insurance provide enough evidence to justify diligence rather than
              immediate dismissal. The problem is that the decisive questions are exactly the ones that public materials
              do not answer: TRRG surplus adequacy, line-level loss ratios, reserve methodology, reinsurance structure,
              dependence on YC-sourced demand, and the sustainability of a founder-intensive culture. That means the
              right posture is not to assume the thesis is broken, but to set explicit triggers that would break it
              quickly if crossed. The most important include regulatory action against TRRG, sustained adverse
              development in AI Liability or Cyber, loss of the YC distribution flywheel, founder departure, or evidence
              that ARR or customer metrics were overstated. Monitoring should therefore focus on NAIC filings once they
              become available, any change in licensing status, reinsurance disclosures, leadership updates, and signs
              that the startup funding environment is weakening enough to hit the portfolio's core customer base. Before
              underwriting the business aggressively, investors should request management accounts, actuarial reserve
              memos, reinsurance schedules, claims runs, and channel-mix data.
            claimRefs:
              - CR037
              - CR038
              - CR039
              - CR040
              - CR041
              - CR042
              - CR043
              - CR044
