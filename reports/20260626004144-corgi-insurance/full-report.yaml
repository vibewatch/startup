      - number: '3.6'
        title: Moat, Lock-in, and Competitive Risk Assessment
        blocks:
          - type: paragraph
            body: >-
              Corgi's competitive durability rests on several moat categories with varying resilience. The full-stack
              carrier structure is moderately durable: it took Corgi approximately $35 million to acquire a licensed
              carrier and secure TRRG authorization, creating a meaningful capital barrier for insurtechs without
              funding. However, incumbents (Chubb, Hartford) already have full carrier licenses and need only develop
              the distribution and AI tooling. Vouch or Embroker could theoretically acquire a carrier entity if they
              chose to replicate Corgi's model. The AI-native underwriting moat is high-risk: as large language models
              become commoditized infrastructure, competitors can replicate AI-based underwriting without proprietary
              training data at comparable cost. Coalition and Cowbell already use AI for cyber pricing. The YC network
              distribution channel provided a strong early-mover advantage but is not exclusive—any insurer can partner
              with YC or cultivate a presence in the accelerator ecosystem. Corgi's AI Liability product is the most
              defensible near-term moat: no competitor has a publicly available standalone AI Liability policy, and
              Corgi's claims experience from AI-company policyholders will build actuarial data before competitors can
              enter. Customer switching costs in commercial insurance are moderate: policies are annual, certificates of
              insurance are transferable, and broker-of-record changes are standard. However, integrations with cap
              table platforms, law firm referrals, and cloud marketplace listings create embedded distribution that
              increases effective switching costs at the segment level. On the risk side, the most acute competitive
              threat in the near term is that established cyber insurers (Coalition, Chubb) will introduce AI riders to
              existing cyber policies, undermining the standalone value of Corgi's AI Liability product before Corgi has
              achieved meaningful market penetration. The TRRG structure also means that Corgi does not have access to
              state guaranty funds, which may disadvantage it with risk-averse buyers who compare it to carrier-backed
              alternatives.
