  - id: FO002
    title: Corgi operating model logic
    type: flow
    layout: standard
    summary: >-
      Corgi's full-stack carrier model connects founders directly to underwriting, policy management, and claims without
      broker intermediaries, powered by an AI layer that compresses each step.
    data:
      nodes:
        - id: founders
          label: Venture-backed startup founders
          detail: Primary customer segment; acquire via YC network, law firm and cap table platform integrations.
          tone: positive
        - id: platform
          label: Corgi digital platform
          detail: Self-serve quote-to-bind in 10-15 minutes; modular coverage toggled by funding stage.
          tone: positive
        - id: ai_layer
          label: AI underwriting layer
          detail: LLM-powered risk assessment, document processing, and adaptive pricing replace manual broker workflows.
          tone: positive
        - id: trrg
          label: TRRG (risk-bearing carrier)
          detail: >-
            Technology Risk Retention Group writes policies on own paper; NOT subject to all state insurance laws; state
            guaranty funds unavailable.
          tone: warning
        - id: claims
          label: Claims administration
          detail: Affiliated claims admin handles claims in-house; no third-party administrator delay.
          tone: positive
      edges:
        - from: founders
          to: platform
        - from: platform
          to: ai_layer
        - from: ai_layer
          to: trrg
        - from: trrg
          to: claims
        - from: claims
          to: founders
    approximationNotes: null
