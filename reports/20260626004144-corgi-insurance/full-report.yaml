            body: >-
              Comparing feature coverage across the competitor set reveals three tiers of capability. Corgi occupies a
              unique position as the only player that is simultaneously a full-stack carrier with AI-native underwriting
              AND offers startup-stage-modular coverage with instant bind AND includes an AI Liability product. Vouch
              and Embroker match on startup focus and instant quoting but operate as brokers without underwriting
              control. Coalition leads on cyber risk management depth but does not offer the startup bundle or D&O/EPLI.
              Next Insurance (ERGO NEXT) leads on raw customer volume but is generalist SMB and does not specialize for
              venture-backed tech. Incumbent carriers (Chubb, Hartford, Progressive) are full-stack carriers with deep
              coverage breadth but lack startup specialization and instant bind capabilities for the seed/early stage.
              The most consequential differentiators for Corgi's core segment are: (1) the AI Liability product, which
