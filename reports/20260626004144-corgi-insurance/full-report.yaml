      - number: '2.2'
        title: Market sizing—TAM, SAM, and SOM
        blocks:
          - type: paragraph
            body: >
              The total addressable market (TAM) for Corgi's broadest relevant universe—global P&C commercial
              insurance—exceeds $1 trillion annually. However, this figure includes personal auto, homeowners, workers'
              comp, and large-enterprise specialty lines that Corgi does not currently target and cannot price through a
              risk retention group structure. Using it as a valuation multiple anchor significantly overstates near-term
              opportunity.


              The more defensible serviceable addressable market (SAM) is the US commercial insurance market for
              small-to-mid-market businesses, particularly the technology and startup subsegment. The FIO 2025 Annual
              Report places total US P&C direct written premiums at approximately $1.1 trillion as of 2024 industry
              data. Commercial lines account for roughly 40-50% of that total, placing the commercial lines TAM at
              approximately $440-550B annually in the US. Within commercial lines, the small-to-mid-market tech startup
              segment is materially smaller. Beinsure's analysis of US insurance rate data (sourced from Marsh's
              composite rate indices) shows that financial and professional lines (which include D&O, E&O, and Cyber)
              represent a subset of total commercial premium with Cyber declining 5% in Q4 2025 and D&O declining 5%.


              A conservative bottom-up estimate for Corgi's serviceable addressable market anchors to venture-backed
              startups requiring commercial insurance: approximately 50,000-80,000 active US venture-backed companies at
              any point in time (inferred from PitchBook and NVCA ecosystem data) times an average annual premium of
              $3,000-$10,000 depending on stage yields a SAM of roughly $150M to $800M for startup-only commercial
              insurance. However, Corgi's stated expansion into trucking, small business, and other commercial segments
              materially widens the SAM: the US commercial auto market alone (which includes trucking) is estimated by
              Lockton at a meaningful portion of total commercial lines. The lockton 2026 quarterly update describes the
              commercial insurance market as entering a more stable phase with competitive rates for well-managed risks.


              The serviceable obtainable market (SOM) for 2026 is best proxied by Corgi's own publicly stated traction:
              $40M ARR and 40,000 customers. This implies current penetration of roughly 0.1% of the broadest US
              commercial lines market, or 50-80% of the targeted startup-insurance SAM if the conservative sizing is
              correct. The startup SAM sizing gap is the most important evidence gap for valuation chapters.
            claimRefs:
              - CM006
