      - number: '2.5'
        title: Adoption constraints and market headwinds
        blocks:
          - type: paragraph
            body: >
              Despite the favorable drivers, several structural constraints limit the pace and ceiling of Corgi's market
              penetration.


              The TRRG structure is the most important regulatory constraint. Risk retention groups are exempt from many
              state insurance laws and do not qualify for state guaranty fund protection. This limits Corgi's ability to
              serve buyers whose procurement requirements mandate coverage from an admitted carrier or A-rated carrier
              on AM Best's scale. Large enterprise buyers and regulated industries (banking, healthcare, government
              contracts) often have vendor insurance requirements that specify admitted carrier status—something Corgi's
              TRRG structure does not provide. This is a genuine market ceiling for the enterprise segment.


              Cyber rate declines represent a double-edged dynamic. While lower rates make Corgi more competitive, they
              compress premium per policy and require higher volume to sustain ARR growth. The Beinsure/Marsh composite
              rate data shows cyber rates declined 5% in Q4 2025, which is both a tailwind for customer acquisition and
              a headwind for underwriting margins on the cyber line.


              Geographic concentration in the United States limits the total addressable market. Corgi is unavailable
              for international operations, and the large community of Delaware-incorporated companies with
              international operations (especially Africa, Europe, and Asia-Pacific startups that incorporate in the US)
              cannot fully utilize Corgi's coverage for non-US operations.


              Switching costs in commercial insurance are lower than in other financial services products: most policies
              are annual, and broker-led competitors can be switched without IT integration cost. This means retention
              depends heavily on claims service quality and pricing, not on technical lock-in. Corgi's below-1% churn
              claim is an important counter-signal, but it is company-asserted and not independently verified.


              The insurance industry's long claims cycles mean that superior underwriting economics may not be visible
              to the market for 3-5 years. Corgi's carrier license dates from July 2025; loss ratios will not be
              meaningfully interpretable until 2027 at the earliest.
