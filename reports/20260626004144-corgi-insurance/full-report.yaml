      - number: '3.3'
        title: Specialist and Vertical Insurtech Players
        blocks:
          - type: paragraph
            body: >-
              Beyond direct startup-insurance peers, several insurtech companies hold strong positions in lines that
              intersect with Corgi's expansion roadmap. Coalition is the dominant cyber insurance specialist, raising
              $250 million in Series F funding at a $5 billion enterprise valuation in 2022. Coalition's "Active
              Insurance" model bundles cyber risk management tooling with insurance coverage; policyholders reportedly
              experience 73% fewer claims as a result of proactive threat detection. Coalition focuses exclusively on
              cyber risk across SMB and mid-market and does not offer the bundled startup-stage package that Corgi
              provides. As Corgi competes on cyber line, it must differentiate on startup specialization, carrier
              economics, and the integrated bundle rather than on cyber-specific risk management depth. Cover Whale,
              which raised $27.5 million in Series A funding in 2023, applies AI-driven underwriting to trucking and
              commercial fleet insurance. Its DriveSmart telematics engine averages 18-minute bind times. Cover Whale
              operates in the same trucking vertical that Corgi announced as its next market expansion, making it the
              most direct future competitor in that lane. Pie Insurance, having raised $315 million in its Series D
              round in 2022, targets the workers compensation market for small businesses. Pie's vertical depth in
              workers comp exceeds Corgi's current offering in that line. Cowbell Cyber raised $100 million in Series B
              and $60 million in Series C funding to develop an AI-powered cyber insurance pricing and policy management
              platform targeting SMBs through broker channels. Cowbell operates through brokers, while Corgi goes
              direct-to-founder. Next Insurance, which was acquired by ERGO/Munich Re in 2025 for approximately $2.6
              billion, now operates as ERGO NEXT, insuring 750,000+ businesses with instant online access across 1,300+
              types. Its near-term direction under Munich Re's ownership is unclear, but its scale and parent company's
              resources make it a potential threat in the broader SMB digital insurance market.
            claimRefs: []
      - number: '3.4'
        title: Incumbent Carrier Alternatives
        blocks:
          - type: paragraph
            body: >-
              Traditional carriers remain relevant alternatives for startup buyers, particularly as companies mature
              into Series B and beyond. Chubb, one of the world's largest commercial insurers, serves businesses of all
              sizes across 30+ specialized industry practices, including tech and professional liability. Chubb provides
              the depth of coverage that large, multinational tech companies require but typically routes buyers through
              broker intermediaries, adding friction and cost. For the early-stage startup segment, Chubb's underwriting
              processes, minimum premiums, and broker-required workflow are not competitive with Corgi's self-serve
              model. The Hartford has served small business insurance customers for 200+ years and has 1.3 million+
              small business customers as of 2026, holding the number-one digital small business insurer ranking by
              Keynova. Hartford's digital capabilities have advanced significantly, but its product design is generalist
              SMB rather than startup-specific. It does not offer startup-stage modular packaging, AI Liability, or
              direct integrations with VC infrastructure platforms. Progressive Commercial has 50+ years of experience
              and 30+ coverage types across commercial auto and small business insurance, with particular strength in
              commercial vehicle lines relevant to trucking fleets. As Corgi expands into trucking, Progressive
              Commercial becomes a more relevant incumbent competitor. Incumbent carriers collectively represent the
              underwriting capital and pricing depth that insurtechs must eventually match; their weakness is
              distribution friction and product rigidity for tech-native buyers who want API integrations, instant bind,
              and transparent pricing.
