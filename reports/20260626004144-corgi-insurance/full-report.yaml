      - number: '4.6'
        title: Financial Gaps and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              The financial picture for Corgi is materially incomplete for investment-grade diligence. The most critical
              missing metrics are: loss ratio and combined ratio (the fundamental health measures for a carrier), gross
              margin (which for an insurer is the inverse of the loss ratio after reinsurance), claims frequency and
              severity data by product line, D&O and Cyber reserve adequacy (given multi-year development tails),
              audited financials or any GAAP/statutory financial statements, cash position and burn rate, and CAC and
              payback period. Several of these metrics may only be available under an NDA in a full diligence data room.
              The positive indicators are the rapid ARR growth (from $1.2M to $40M+ in approximately 15 months), the
              CEO's April 2026 profitability claim, sub-1% churn (company-stated), the full-carrier license received
              July 2025, $378M total funding from institutional investors, and a valuation confirmed by three successive
              rounds (market validation). The risk indicators are: rapid valuation multiple expansion ($630M to $2.6B in
              ~5 months), unaudited financial claims, concentrated customer acquisition (YC ecosystem), absence of any
              public loss experience data, and the TRRG structure's potential disadvantage vs. standard licensed
              carriers in risk-averse buyer segments. The overall financial verdict is that Corgi shows exceptional
              revenue growth and promising traction but requires a full data room review of statutory financials,
              reserve adequacy, loss development triangles, and CAC data before any financial thesis can be formed with
              high confidence.
            claimRefs: []
          - type: table
            tableRef: TI005
            claimRefs:
              - CI035
