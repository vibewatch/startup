            title: 40,000 customers in under 12 months of carrier operations is exceptional traction
            body: >-
              If Corgi's reported figures are directionally accurate, the company has achieved unusually fast customer
              adoption for a newly licensed startup carrier. The combination of 40,000+ active customers, $40M+ ARR, and
              roughly $1,000 average annual revenue per customer suggests a highly efficient high-volume distribution
              engine aimed at startup compliance moments. The main caveat is that all three numbers remain
              management-reported rather than externally audited.
            calloutType: strength
            claimRefs:
              - CU009
