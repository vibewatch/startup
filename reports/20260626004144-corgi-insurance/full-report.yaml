      - number: '4.4'
        title: Funding History and Capital Adequacy
        blocks:
          - type: paragraph
            body: >-
              Corgi has raised $378 million in total as of May 2026, with three primary rounds: an $108 million combined
              Seed and Series A (announced January 2026), a $160 million Series B at a $1.3 billion valuation (May 6,
              2026), and a $106 million Series B1 at a $2.6 billion valuation (May 28, 2026), all led by TCV. The $106
              million Series B1 closed three weeks after the $160 million Series B — an unusually compressed financing
              cycle that doubled the valuation in 22 days. CEO Nico Laqua stated in a May 2026 Forbes interview that the
              company was profitable in April 2026 (the month preceding the Series B1 close), making the capital raise
              more growth-oriented than survival-driven. As a full-stack carrier, Corgi has capital requirements beyond
              those of an insurtech broker: TRRG must maintain adequate surplus (capital reserve) relative to its net
              written premiums under risk retention group regulations. The approximately $35 million paid to acquire the
              carrier entity is a sunk cost; ongoing capital adequacy depends on the growth rate of the premium book
              relative to surplus. At $40M+ ARR and rapid growth, capital allocation to carrier surplus rather than
              operating expenses may explain the large fundraise amounts. The company has not disclosed cash on hand,
              monthly burn rate, or runway. Given the CEO's April 2026 profitability statement, burn may be near zero or
              positive on an operating basis, though carrier surplus requirements could consume capital separately. The
              Series B1 term "led by TCV" with 15+ co-investors suggests the round was partially supply-driven by strong
              investor demand at the current growth trajectory rather than by an acute capital need.
