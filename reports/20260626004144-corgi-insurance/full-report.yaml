chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, operating model, and carrier structure
        blocks:
          - type: paragraph
            body: >
              Corgi Insurance is a full-stack insurance carrier headquartered at 9 Claude Lane, San Francisco,
              California. The company sells commercial insurance products directly to venture-backed startups and
              technology companies, operating as both the underwriter and the program administrator without relying on a
              broker intermediary or a fronting carrier. This full-stack model is the single most important structural
              differentiator from the dominant broker-led insurtech competitors such as Vouch and Embroker.


              Corgi's legal and regulatory structure divides responsibility across two entities. Coverage is
              underwritten by Technology Risk Retention Group, Inc. (TRRG), a risk retention group organized under the
              Liability Risk Retention Act (15 U.S.C. §3901 et seq.). TRRG is the risk-bearing entity. Corgi Insurance
              Services, Inc. is a separately licensed insurance producer (California License #6012791) that acts as the
              program administrator and manages distribution. Producer entities hold licenses across 45 US jurisdictions
              and products are available in 49 states.


              A critical regulatory caveat flows from the TRRG structure: as a risk retention group, TRRG is not subject
              to all state insurance laws and regulations, and state insurance insolvency guaranty funds are explicitly
              unavailable for policies issued by a risk retention group. This is disclosed in Corgi's own disclaimers
              page and is material for prospective policyholders and investors evaluating the soundness of the carrier
              model.


              The company describes its mission as rebuilding the $1T+ global insurance industry from the ground up,
              positioning itself as financial infrastructure for the next hundred years rather than an incremental
              improvement on existing broker-led distribution. Corgi maintains a direct digital platform where founders
              can obtain a bound policy in under 15 minutes for core coverage lines, compressing a process that
              traditionally takes days or weeks with legacy brokers.
