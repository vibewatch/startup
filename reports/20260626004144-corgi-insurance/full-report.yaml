  - id: FV004
    title: Investment decision logic
    type: flow
    summary: >-
      The valuation decision flows from today's high entry price through value-creation drivers and risk factors into
      scenario outcomes, ending in a conditional recommendation rather than an unconditional buy.
    data:
      nodes:
        - id: entry
          label: Entry at $2.6B (65x ARR)
          detail: Series B1 post-money valuation. Priced for execution.
        - id: drivers
          label: Value creation drivers
          detail: ARR growth (3x+), carrier economics, AI differentiation, market expansion.
        - id: risks
          label: Risk register
          detail: RRG regulatory risk, AI loss development, YC concentration, key-person risk.
        - id: scenarios
          label: Scenario outcomes
          detail: Bull $7B / Base $2.4B / Bear $0.4B / Thesis break $0.
        - id: recommendation
          label: Conditional positive thesis
          detail: Conviction warrants only if ARR sustains 3x+ growth and TRRG annual statement confirms adequate reserves.
      edges:
        - from: entry
          to: drivers
        - from: entry
          to: risks
        - from: drivers
          to: scenarios
        - from: risks
          to: scenarios
        - from: scenarios
          to: recommendation
    claimRefs:
      - CV022
      - CV024
      - CV028
      - CV037
  - id: FV005
    title: Key performance indicators
    type: kpi
    summary: >-
      Five public KPIs summarize Corgi's growth and valuation posture. They are directionally useful but mostly
      management-stated rather than independently audited.
    data:
      items:
        - label: ARR (Dec 2025)
          value: $40M
          tone: positive
          detail: Company-stated; roughly 33x growth from mid-2024. Not independently audited.
        - label: Customer count (Jan 2026)
          value: 40,000+
          tone: positive
          detail: Company-stated; implies roughly $1,000 average annual premium per customer.
        - label: Churn (company-stated)
          value: <1%
          tone: neutral
          detail: Management-claimed; no independent verification. Strong if accurate.
        - label: Series B1 valuation
          value: $2.6B
          tone: positive
          detail: May 28, 2026 post-money. 65x ARR multiple. 2x step-up from Series B in 22 days.
        - label: Total raised
          value: $378M
          tone: neutral
          detail: Cumulative capital through the latest round. Carrier capital requirements remain meaningful.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV035
