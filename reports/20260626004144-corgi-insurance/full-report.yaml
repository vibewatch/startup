      - number: '2.4'
        title: Growth drivers and market tailwinds
        blocks:
          - type: paragraph
            body: >
              Five structural drivers support Corgi's market opportunity over a 2-5 year horizon. First, the
              proliferation of venture-backed startups continues to expand the base of buyers requiring startup
              insurance packages. YC alone funds hundreds of companies per batch, and the YC alumni network of hundreds
              of thousands of companies is Corgi's primary channel. The number of companies requiring D&O coverage
              within 24 months of founding has grown as institutional investors have standardized insurance requirements
              in term sheets.


              Second, cyber risk is a primary growth driver. Despite rate declines (down 5% in Q4 2025 per
              Beinsure/Marsh data), cyber claims volumes remain high—Beinsure notes cyber claims surpassed 2,000 cases
              in the period reviewed—and AI-driven attack surfaces are expanding. The NAIC's insurance industry snapshot
              confirms that cyber remains a rapidly growing coverage line. Corgi's AI underwriting stack is positioned
              to price cyber risk more accurately for tech startups than legacy carriers that lack data on
              startup-specific attack surfaces.


              Third, AI liability is a new product category with limited competition. Traditional insurers are actively
              carving AI errors out of E&O policies as LLM-driven products proliferate. Companies replacing human
              workflows with AI agents face a coverage gap that Corgi explicitly addresses. The FIO 2025 Annual Report
              notes that emerging technology risks are creating new coverage demands across financial and professional
              lines.


              Fourth, market stabilization is creating favorable conditions for new entrants. The Lockton 2026 quarterly
              market update describes the US commercial insurance market as entering a "more stable phase," with rates
              competitive for well-understood and controllable risks. This reduces the pricing volatility that benefits
              large incumbent carriers and creates room for AI-native underwriters to compete on speed, accuracy, and
              experience rather than on reinsurance capacity alone.


              Fifth, the accelerating adoption of B2B SaaS and API-based business models is expanding the tech E&O and
              cyber exposure base. More startups building AI-powered products need explicit coverage for software
              failures and data breaches, and the growth in this segment directionally favors specialized carriers with
              AI-specific underwriting expertise.
