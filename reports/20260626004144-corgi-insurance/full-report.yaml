  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Corgi's most important legal and regulatory risk comes from the fact that the underwriting entity is a
              risk retention group operating under the Liability Risk Retention Act rather than a conventional admitted
              carrier structure. That structure is a feature for speed and national reach because it allows cross-state
              liability writing with narrower state-by-state friction, but it is also a meaningful risk transfer to the
              customer. Policyholders in a TRRG do not get the same insolvency-guaranty-fund protection they would
              expect from a standard admitted carrier, which means credit risk on the carrier matters far more than
              brand polish or acquisition speed. Corgi's California producer license, broad jurisdictional coverage, and
              the absence of known enforcement actions are constructive, but they do not remove the fact that the
              carrier license only became active in July 2025 and therefore has less than a year of public operating
              history. Regulatory risk is heightened further by the company's AI-native positioning. AI-based
              underwriting and AI Liability coverage sit in an evolving legal perimeter shaped by FTC privacy
              expectations, broader federal concern about automated decision systems, and the possibility that
              regulators eventually ask for more explainability, adverse-outcome monitoring, or model-governed
              disclosures than the company currently provides. The public evidence therefore supports a view that Corgi
              is legally operational today, but the residual exposure remains high because the legal structure
              intentionally offers policyholders less backstop and because future rulemaking could force control
              upgrades or narrower product scope.
            claimRefs:
