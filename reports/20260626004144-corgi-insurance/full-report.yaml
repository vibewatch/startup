      - number: '4.5'
        title: Public Traction, Revenue Quality, and Estimates
        blocks:
          - type: paragraph
            body: >-
              Corgi's publicly disclosed financial metrics create a partial picture. The $40M+ ARR figure is
              company-stated and was announced as part of the January 2026 Series A press release rather than a formal
              audited disclosure. The $1.2M revenue mentioned in mid-2024 is from secondary analyst sources. The ARR
              metric for an insurance company deserves interpretation: insurance ARR (annualized premium run rate)
              differs from SaaS ARR in that premiums are subject to claims, reinsurance costs, and actuarial
              development. A $40M ARR carrier with a 100% combined ratio (breakeven) generates no net income; a 90%
              combined ratio generates $4M net income; an 80% combined ratio generates $8M. The CEO's April 2026
              profitability statement, if interpreted as combined ratio below 100%, is a meaningful milestone for a
              carrier with only ~10 months of full-carrier operation (license received July 2025). Customer quality is
              partially evidenced by named customers: Artisan (AI BDR startup), Eragon (enterprise SaaS), Sorcerer
              (weather balloon / climate data), Intryc (data security / Deel customer), and Imagine AI (content
              automation). All five customer case studies are from YC-affiliated companies, which is consistent with the
              YC-network acquisition strategy and also creates concentration risk: a shift in YC deal flow or brand
              perception could disproportionately impact Corgi's customer pipeline. The 40,000+ customer count at $40M+
              ARR implies a high-volume, low-ARPC customer base dominated by small seed-stage companies. As these
              companies grow to Series A and beyond, natural upsell should expand ARPC, improving revenue quality.
              However, there is no disclosed data on ARPC trajectory or cohort expansion revenue.
            claimRefs: []
