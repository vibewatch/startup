  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Full-stack carrier platform and product architecture
        blocks:
          - type: paragraph
            body: >
              Corgi's product architecture starts with a structural decision that shapes every downstream technology
              choice: it is not merely a broker workflow layer placed on top of legacy insurance carriers, but a
              full-stack carrier that underwrites, issues, administers, and claims-manages startup insurance through its
              own operating structure. Public materials consistently position the company as an AI-native insurance
              carrier for technology companies, while the January 2026 launch release makes clear that Technology Risk
              Retention Group, Inc. (TRRG) is the underwriting carrier and Corgi Insurance Services, Inc. is the
              licensed producer and program administrator. That matters because the platform is vertically integrated
              from quote intake through claims.

              The product surface is correspondingly broad. Corgi markets modular commercial insurance lines, including
              the core startup bundle of CGL, D&O, Tech E&O, and Cyber, plus stage-expansion products such as EPLI,
              Media Liability, Fiduciary Liability, Workers Compensation, AI Liability, and other specialty lines. The
              homepage and products page describe a self-serve dashboard where founders can adjust coverage as their
              company matures, while direct carrier control enables certificates and standard-line quotes to be issued
              quickly without a separate broker or fronting-carrier handoff. Geographic breadth is already material:
              company disclosures state 45 producer-license jurisdictions and product availability across 49 states. The
              resulting architecture is best understood as insurance infrastructure, not a single-product app.
            claimRefs:
