      - number: '8.5'
        title: Risk-adjusted return, value creation levers, and recommendation
        blocks:
          - type: paragraph
            body: >-
              The investment recommendation depends less on whether Corgi is impressive — it clearly is — and more on
              whether a new investor is being compensated for the unresolved risks that remain in the carrier model. The
              most important value drivers are already visible: rapid ARR growth, strong startup-market fit, an apparent
              YC acquisition flywheel, broad licensing progress, and a product narrative around AI underwriting and AI
              Liability that investors see as category-defining. Several parts of the story are partially de-risked,
              especially brand, investor quality, and the existence of real demand. What is not yet de-risked is the
              underwriting engine itself. Without public combined ratio, reserve methodology, reinsurance schedule, or
              actuarial development data, the market is being asked to accept software-style multiples on
              insurance-style risk. That is a workable bet only if investors can verify downside protection through
              diligence materials and if position sizing reflects the asymmetry. At $2.6 billion, the risk-adjusted
              return profile does not argue for an oversized position. It argues for a selective, conviction-based entry
              sized for loss tolerance, with clear monitoring triggers around ARR growth, statutory surplus, line-level
              loss ratios, and any signs of channel concentration or claims deterioration. The right stance is
              conditional positive: attractive as a monitored position if private diligence confirms the carrier
              economics, but not a broad-margin-of-safety investment on public evidence alone.
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV037
              - CV041
              - CV044
