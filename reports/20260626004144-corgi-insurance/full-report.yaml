      - number: '5.3'
        title: Product line portfolio and stage-based packaging
        blocks:
          - type: paragraph
            body: >
              Corgi's portfolio is intentionally expansive for an early-stage insurer because the company is not selling
              a single policy type; it is selling a startup-lifecycle insurance system. The products page and homepage
              together show a menu exceeding fifteen lines and, based on public references, closer to nineteen named
              products. Core lines include Cyber, D&O, Tech E&O, and General Liability, while adjacent lines include
              EPLI, Fiduciary, Media Liability, Workers Compensation, HNOA, Commercial Umbrella, R&W, and AI Liability.
              Specialty extensions such as Lawyer E&O, Real Estate E&O, Non-Profit D&O, K&R, Medical Malpractice, Crime,
              and BOP broaden the coverage map further.

              Packaging is organized around startup milestones rather than traditional insurance taxonomy. The Pre-Seed
              package centers on first-contract and first-lease readiness through CGL, D&O, Tech E&O, and Cyber. Series
              A adds Media Liability and EPLI as enterprise diligence, hiring, and public communications risks rise.
              Growth adds Fiduciary Liability once employee benefit plans appear. The Custom path preserves modularity
              for companies with unusual risk profiles. AI Liability is the standout strategic product because it
              explicitly targets hallucination, bias, and training-data dispute risks that traditional forms often
              exclude or leave ambiguous. The trucking expansion announced alongside the Series B also shows Corgi
              testing adjacencies beyond software startups, though that vertical appears earlier in maturity and
              validation than the core startup bundle.
