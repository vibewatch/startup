      - number: '3.2'
        title: Direct Insurtech Competitors — Vouch and Embroker
        blocks:
          - type: paragraph
            body: >-
              Vouch Insurance is the closest direct competitor to Corgi, serving 6,000+ companies across technology,
              healthcare, and professional services verticals. Vouch operates as an insurance brokerage, placing
              policies with external carriers rather than underwriting risk on its own balance sheet. It raised $90
              million in Series C funding in September 2023, bringing total funding to approximately $160 million.
              Vouch's startup insurance platform covers CGL, D&O, Tech E&O, Cyber, EPLI, and other core lines with a
              digital-first interface and human advisors for complex coverage. Its "Ambition Insured" brand and
              YC-adjacent customer base closely mirror Corgi's target segment. The key structural difference from Corgi
              is that Vouch relies on external carrier paper: when an external carrier exits a line or reprices, Vouch
              must renegotiate or find alternatives. Corgi's in-house underwriting entity (TRRG) eliminates this
              dependency and allows tighter pricing control. Embroker is a digital brokerage serving 9,500+ businesses
              with 16,000+ policies across multiple industries. Founded more than a decade ago, Embroker raised
              approximately $100 million in Series C funding in 2021 and combines digital quoting with a human advisory
              layer. Embroker's startup insurance offering covers similar lines to Corgi but does not offer
              startup-stage-modular packaging or the AI Liability product. Its broader industry focus (not exclusively
              startups/tech) dilutes the degree of product specialization. Both Vouch and Embroker have 4.5+ star
              advisor ratings and strong brand recognition among founders, representing meaningful competition for
              customer acquisition in the YC/accelerator ecosystem. Corgi's Corgi vs. Vouch comparison page argues that
              the full-stack model provides faster binding, more flexible underwriting, and better economics for
              startup-specific risks.
