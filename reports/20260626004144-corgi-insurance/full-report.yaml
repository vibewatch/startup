      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: TRRG guaranty fund exclusion is the single most important risk disclosure for policyholders
            body: >-
              The central legal fact in Corgi is not that it is unlicensed or visibly non-compliant; it is that the TRRG
              structure changes who ultimately bears credit risk if the carrier becomes impaired. Policyholders do not
              receive the normal state-guaranty-fund backstop associated with admitted carriers, so diligence has to
              focus on surplus, reserves, and reinsurance rather than on growth alone.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
          - type: callout
            title: >-
              AI Liability product is a first-mover bet with no actuarial history — adverse development is
              unquantifiable
            body: >-
              Corgi's AI Liability line may prove differentiated, but it is being written before the industry has
              accumulated a credible database of claim frequency, severity, exclusions behavior, or loss- development
              patterns for LLM hallucination, model bias, and training-data disputes. That makes reserve adequacy and
              pricing discipline unusually hard to evaluate from public evidence.
            calloutType: risk
            claimRefs:
              - CR013
              - CR020
              - CR028
          - type: callout
            title: Regulatory and capital risk is manageable today but requires active monitoring as the premium book grows
            body: >-
              Nothing in the reviewed source set proves that Corgi is currently in distress, and the company has raised
              enough capital to make the business worth underwriting seriously. But the risk can change quickly once
              premium volume scales. The right diligence posture is continuous monitoring of NAIC filings, surplus
              adequacy, line-level loss development, and any signal that regulators are asking harder questions of the
              TRRG structure.
            calloutType: insight
            claimRefs:
              - CR039
              - CR040
              - CR037
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Unit economics and path to profitability
        blocks:
          - type: paragraph
            body: >-
              The valuation case for Corgi begins with what can and cannot be observed about unit economics. Publicly,
              the company has disclosed enough to establish fast top-line scaling but not enough to prove durable
              carrier profitability. Corgi stated that ARR reached $40 million by December 2025 and that the platform
              served 40,000+ customers by January 2026, implying approximately $1,000 of annual premium per customer.
              That figure is directionally credible for early-stage startup commercial insurance, especially given a
              product mix centered on CGL, Tech E&O, Cyber, and D&O. The more difficult question is quality of that
              revenue. Corgi has not publicly disclosed loss ratio, combined ratio, CAC, payback period, or cohort-level
              retention mechanics. Management has claimed profitability and sub-1% churn, and the YC network likely
              lowers acquisition cost relative to broker-led or field-sales-heavy peers, but none of those claims is
              independently auditable from the public record. That matters because an insurer's cash-flow quality is not
              defined by ARR alone; it is defined by how much premium survives claims, reinsurance, and operating
              expense over time. A full-stack carrier can be much more valuable than a broker if underwriting is sound,
              because it captures underwriting margin and investment income on float. It can also be materially less
              valuable if reserves are light or if long-tail liability lines deteriorate after growth has already been
              celebrated. The current valuation is therefore best understood as paying for the future proof of unit
              economics rather than for a fully demonstrated present-state earnings stream.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV023
              - CV035
