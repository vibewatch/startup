  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base segmentation and acquisition channels
        blocks:
          - type: paragraph
            body: >
              Corgi's customer base is best understood as a venture-backed startup portfolio rather than a generic
              small-business book. The company's customer pages, homepage, and YC profile all point to a concentrated
              core segment: Seed and Series A technology companies that suddenly need enterprise-grade insurance because
              a buyer, bank, landlord, or investor requires it. Within that broad startup segment, the visible
              sub-clusters are AI-native software companies, enterprise SaaS vendors, and a smaller set of climate or
              hardware-adjacent startups whose risks do not fit cleanly into an off-the-shelf broker template. The named
              examples reinforce this pattern. Artisan needed coverage to sell to banks, Eragon needed to satisfy
              enterprise procurement checklists, and Sorcerer required coverage tailored to a more complex physical
              deployment profile.

              Acquisition channels appear similarly focused. Public disclosures consistently suggest that YC and the
              founder-referral loop are the primary distribution engine, with secondary contribution from law firms, cap
              table platforms, cloud marketplace workflows, and direct inbound demand. That mix matters because it
              explains both the speed of logo accumulation and the concentration risk: Corgi is selling into communities
              where trust, referenceability, and timing around fundraises or enterprise deals matter more than broad
              consumer-style brand awareness. The 49- state footprint widens the reachable US startup market, but the
              absence of non-US coverage excludes a meaningful share of globally distributed founders who still operate
              US-incorporated startups.
            claimRefs:
