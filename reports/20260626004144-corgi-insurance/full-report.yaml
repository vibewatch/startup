companyProfile:
  summary: >
    Corgi Insurance is a San Francisco-based AI-native, full-stack insurance carrier founded in 2024 by Nico Laqua
    (CEO/CTO) and Emily Yuan (COO). The company emerged from Y Combinator's Summer 2024 batch and received full carrier
