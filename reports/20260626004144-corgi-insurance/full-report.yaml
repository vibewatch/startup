      - number: '1.3'
        title: Funding history and valuation progression
        blocks:
          - type: paragraph
            body: >
              Corgi's capital trajectory is one of the fastest in recent insurtech history. The company executed three
              distinct financings in an approximately five-month window between January and May 2026, each at a
              materially higher valuation.


              In January 2026, Corgi announced a combined Seed and Series A totaling $108 million at a $630 million
              valuation. That round was led by Kindred Ventures with participation from Y Combinator, Contrary, Oliver
              Jung, Glade Brook Capital Partners, Seven Stars, Leblon Capital, Phosphor Capital, Fellows Fund, Alumni
              Ventures, Quadri Ventures, Vocal Ventures, and SV Angel. The announcement coincided with regulatory
              approval to operate as a full-stack carrier and the first public disclosure of the company after what
              Nubia Magazine described as an 18-month regulatory process involving the acquisition of a decades-old
              licensed carrier for roughly $35M.


              On May 6, 2026, Corgi closed a $160 million Series B at a $1.3 billion valuation, led by TCV, with
              participation from Oliver Jung, Leblon Capital, Kindred Ventures, Repeat VC, Zone 2 Ventures, Audeo
              Ventures, Quadri Ventures, First Order Fund, Vocal Ventures, Maiora Ventures, Nordstar, Seven Stars
              Ventures, Hexa Capital, Alpha Square Group, GSBackers, OurCrowd, Alumni Ventures, and Global Growth Fund.
              This brought cumulative capital raised to over $268 million.


              On May 28, 2026—just 22 days later—Corgi announced a $106 million Series B1 at a $2.6 billion valuation,
              again led by TCV with Prime Capital, Zone 2 Ventures, Oliver Jung, Leblon Capital, Kindred Ventures,
              Quadri Ventures, First Order Fund, Vocal Ventures, Nordstar, GSBackers, Repeat Ventures, and 8188 Capital.
              Total raised reached $378 million. CEO Nico Laqua stated the company was profitable in April 2026 (the
              preceding month). The doubling of valuation in three weeks—from $1.3B to $2.6B—is an exceptional data
              point that later chapters will need to assess for sustainability and market-comparables context.
