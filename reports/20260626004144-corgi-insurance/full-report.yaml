      - number: '8.4'
        title: 'Scenario analysis: bull, base, and bear cases'
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis is the most disciplined way to interpret a valuation as stretched as Corgi's. In the
              bull case, Corgi compounds from $40 million ARR to roughly $350 million by 2028, keeps its AI-led
              distribution advantage, proves that the carrier model scales with acceptable claims performance, and exits
              on a still-premium 20x multiple; that produces about $7.0 billion of value and a 2.7x outcome from the
              Series B1 entry. In the base case, Corgi still grows well — to roughly $200 million ARR by 2028 — but the
              market normalizes toward a 12x multiple as the company matures and as investors ask for demonstrated
              carrier margins rather than narrative; that yields approximately $2.4 billion, or slightly below the
              current entry value. In the bear case, growth slows to roughly $80 million ARR and the market prices the
              company more like a specialty broker or challenged insurtech at 5x ARR, creating an approximately $400
              million outcome and severe capital loss. A true thesis-break case — reserve stress, adverse regulatory
              action, or a failed carrier model — can approach zero. On the stated probabilities, the
              probability-weighted value is about $2.57 billion, essentially equal to the Series B1 price. That is the
              core insight of this chapter: the upside is real, but the expected value is already largely pulled forward
              into today's entry valuation.
            claimRefs:
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV024
              - CV031
