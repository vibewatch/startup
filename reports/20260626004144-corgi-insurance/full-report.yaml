      - number: '5.5'
        title: Differentiation, technical risks, and compliance
        blocks:
          - type: paragraph
            body: >
              Corgi's clearest differentiator is structural rather than algorithmic: analysts and reviewers point to the
              full-stack carrier model as the main reason it can capture underwriting economics and shape product
              experience differently from broker-led insurtechs. The AI Liability product adds a second layer of
              differentiation by targeting an emerging category where traditional carriers often rely on exclusions,
              ambiguity, or manual review. That combination could create a meaningful moat if the company develops
              credible claims history and pricing data before larger incumbents respond.

              The core technical and regulatory risks are equally visible. Corgi has less than a year of carrier
              operating history from the July 2025 TRRG license to the January 2026 public launch, leaving very limited
              long-tail claims evidence. Independent review coverage highlights the lack of public claims data and the
              short track record as real concerns. Public technical transparency is also low: no model cards, benchmark
              results, API docs, or algorithmic audit reports have been released. That makes it difficult to assess
              whether the underwriting AI has enough data, controls, and monitoring to avoid adverse selection. The TRRG
              structure adds a compliance caveat as well, because RRGs do not provide state guaranty-fund protection and
              can face state-by-state operating constraints even when federally enabled under the LRRA.
