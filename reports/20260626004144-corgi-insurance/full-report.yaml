      - number: '2.6'
        title: AI liability as an emerging market category
        blocks:
          - type: paragraph
            body: >
              AI liability is a materially new insurance product category with no established market sizing or loss-cost
              data as of the run date. Traditional Tech E&O policies are increasingly carving out AI-specific
              risks—including errors caused by large language model hallucinations, autonomous agent actions, and
              algorithmic bias—as insurers struggle to price tail risk in AI-generated outputs.


              Corgi's AI Liability product is currently one of the only commercial insurance products explicitly
              covering financial losses caused by AI model errors, hallucinations, and bias. As described on Corgi's AI
              industries page, the product is designed for companies scaling AI products that face liability exposure
              when model outputs cause downstream financial harm to customers or third parties.


              The market for AI liability is driven by regulatory uncertainty (the EU AI Act, US federal discussions on
              AI accountability) and by enterprise buyer requirements: procurement teams at regulated buyers are
              beginning to demand AI-specific coverage before signing contracts with AI-native vendors. The FIO's 2025
              Annual Report acknowledges that emerging technology risks are creating new coverage demands that the
              traditional insurance classification system was not designed to accommodate.


              From a sizing perspective, the AI liability segment is too early for bottom-up sizing with public data.
              However, as a proxy: if even 10% of Corgi's current 40,000 customers are primarily AI companies and they
              pay a premium of $5,000-$15,000 for AI liability coverage, the current segment contribution is $20-60M in
              potential premium—close to Corgi's current total ARR. The long-term market is potentially very large given
              the pace of AI adoption across enterprise software, but the early-market loss experience will be critical
              in determining whether current premium rates are adequate.
            claimRefs:
              - CM034
              - CM035
              - CM036
              - CM037
              - CM038
