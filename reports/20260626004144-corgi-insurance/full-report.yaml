      - number: '7.2'
        title: Operational and technology risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Corgi is asking the market to trust a very young carrier to underwrite and service
              complicated liability products with AI-heavy workflows and little public claims history. That combination
              is manageable in a small, clean early cohort but becomes harder as policy volume, product breadth, and
              loss complexity rise. The company has not publicly disclosed loss ratios, combined ratios, claims dispute
              metrics, uptime, security certifications, or incident history, leaving investors and policyholders to
              infer maturity from growth rather than from the operating metrics that usually matter in insurance. The
              risk is especially acute for long-tail lines such as D&O and Cyber, where claims can emerge years after
              underwriting decisions are made, and for AI Liability, where the underlying peril set is novel enough that
              no durable actuarial history exists. People risk amplifies the operational question. Corgi appears lean at
              roughly 70 employees relative to 40,000+ customers and a 15+ product footprint, while founder
              concentration is extreme because Nico Laqua spans CEO and CTO responsibilities and the two- founder team
              appears to carry strategy, product, fundraising, and culture simultaneously. Public reviews that describe
              a seven-day work week and living-at-the-office intensity are not fatal on their own, but they raise
              credible retention and burnout concerns. The operating takeaway is that Corgi may be efficient, but
              efficiency and resilience are not yet the same thing.
            claimRefs:
              - CR010
              - CR011
