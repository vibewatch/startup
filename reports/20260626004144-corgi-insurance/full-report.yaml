            title: CEO April 2026 Profitability Statement — Encouraging but Unaudited
            body: >-
              CEO Nico Laqua stated in a Forbes interview that Corgi was profitable in April 2026, the month preceding
              the $106M Series B1 close. If interpreted as combined ratio below 100% on an operating basis, this would
              represent a significant milestone for a carrier that received its full license only in July 2025. However,
              the statement is verbal and unaudited; statutory accounting for insurance carriers can differ
              significantly from GAAP profitability, and reserve adequacy is not captured in monthly operating profit.
              Diligence should verify whether this claim is consistent with TRRG's statutory filings.
            calloutType: insight
            claimRefs:
              - CI024
