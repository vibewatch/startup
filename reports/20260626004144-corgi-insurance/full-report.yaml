          detail: Revenue reported at $1.2M before carrier license is received; acquisition process underway.
          tone: positive
        - date: 2025-07
          label: Full carrier license — TRRG activated
          detail: Corgi receives full carrier approval; Technology Risk Retention Group, Inc. becomes underwriter.
          tone: positive
        - date: 2025-12
