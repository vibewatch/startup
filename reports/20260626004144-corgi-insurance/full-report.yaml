      - number: '6.4'
        title: Retention, churn, and durability signals
        blocks:
          - type: paragraph
            body: >
              Retention is where the customer story becomes materially less proven. Corgi states that annual customer
              churn is below 1%, which would be extraordinary for a portfolio centered on early- stage startups, a
              segment that naturally experiences company shutdowns, pivots, and financing volatility. Directionally, low
              churn is plausible if many customers buy insurance to satisfy recurring contractual needs and then keep
              renewing as long as they remain active businesses. But the public evidence is insufficient to treat the
              number as validated. No NRR, GRR, renewal-rate series, satisfaction scorecard, or cohort table has been
              disclosed. The oldest observable carrier cohort only dates to Q3 2025, leaving at most three to four
              quarters of public retention history by the run date.

              This immaturity cuts both ways. On the positive side, there is no public evidence in the reviewed source
              set of widespread cancellations, claims-handling blowups, or visible renewal disputes. Customer anecdotes
              such as Intryc's suggest a high-touch post-bind experience for at least some accounts, which can support
              renewals. On the negative side, the portfolio has not yet been tested through a long claims-development
              cycle, a broad startup-downturn wave, or a multiyear repricing environment. That means the sub-1% churn
              figure should be treated as an early signal rather than a seasoned insurance-book durability metric.
