  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, definition, and context
        blocks:
          - type: paragraph
            body: >
              Corgi's relevant market spans three nested levels. At the broadest level, the global property and casualty
              (P&C) insurance industry is a $1T+ market by total premium, as cited in Corgi's own about page and
              corroborated by the Federal Insurance Office's (FIO) 2025 Annual Report, which tracks the US P&C segment
              as one of the largest globally. This headline number is useful as a narrative frame but is not a
              meaningful sizing constraint for Corgi's near-term operations.


              At the mid-tier, Corgi competes within the US commercial insurance market for small and medium-sized
              businesses, specifically the technology startup and venture-backed company segment. This is the segment
              where Corgi's product portfolio is most directly applicable: CGL, D&O, Tech E&O, Cyber, and EPLI are the
              coverage lines enterprise contracts and investor term sheets require before money moves. The FIO's 2025
              Annual Report confirms the US P&C industry premium base, and the NAIC industry snapshots data provides the
              statutory filings baseline that anchors carrier-level sizing.


              At the most addressable level, Corgi competes in the insurtech segment—digital-first commercial insurance
              for high-growth businesses. Startupsunion estimated the broader insurtech market at approximately $50
              billion in 2026. This estimate covers digital distribution and underwriting platforms across all
              commercial lines, not just startup- focused coverage. Corgi's current footprint—40,000 startup customers
              at roughly $1,000 average annual premium as of January 2026—represents a narrow but rapidly growing slice
              of this space.


              The market boundary matters for valuation. Corgi's stated ambition is to rebuild the $1T+ global insurance
              industry from the ground up, but its current product portfolio and carrier license constrains near-term
              penetration to the US commercial lines segment accessible through a risk retention group structure,
              available in 49 states. International business and personal lines are explicitly excluded from Corgi's
              current market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
