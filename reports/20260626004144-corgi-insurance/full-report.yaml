      - number: '8.3'
        title: Investor-implied valuation and round context
        blocks:
          - type: paragraph
            body: >-
              Investor behavior is a major part of the valuation story because the latest price is not merely an
              abstract analyst estimate; it is the number sophisticated investors agreed to fund at in 2026. Corgi's
              early financing path appears to run through Kindred Ventures and Y Combinator, which fits the company's
              startup-centric distribution and product orientation. The business then stepped into growth-stage
              territory with TCV leading the Series B and Series B1. Public sources indicate total capital raised of
              roughly $378 million, with the Series B alone contributing $160 million and the Series B1 implying a $2.6
              billion post-money valuation. On company-stated $40 million ARR, that prices the business at 65x ARR; the
              earlier $1.3 billion Series B implied 32.5x ARR. That step-up is so fast that the round sequence itself
              becomes a diligence topic. It may reflect unusually strong investor demand for AI-native full-stack
              carriers, confidence in Corgi's ability to scale like software while owning underwriting economics, or
              competitive round dynamics around a scarce asset. It may also mean that later investors paid for momentum
              and narrative before reserve, reinsurance, and line-level profitability data were available. For valuation
              purposes, the round history tells investors two things at once: first, high-quality capital has validated
              the company; second, that validation has already been capitalized into an entry price with little room for
              execution slippage. TVPI and DPI context is therefore early and mostly notional: fund sponsors can mark up
              paper quickly at this price, but realized value will depend on whether a later IPO or M&A event supports
              the same optimism.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV017
              - CV033
              - CV040
              - CV042
          - type: table
            tableRef: TV003
