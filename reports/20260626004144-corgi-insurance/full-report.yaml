      - number: '6.5'
        title: Expansion dynamics and concentration risks
        blocks:
          - type: paragraph
            body: >
              Corgi's expansion model is structurally attractive because it matches how startups mature. Early customers
              can start with a compact bundle such as general liability, Tech E&O, cyber, and D&O, then add EPLI, media
              liability, fiduciary, or other specialty lines as headcount, fundraising complexity, or enterprise
              procurement needs rise. If the company keeps customers through that stage progression, average revenue per
              account should expand even without large numbers of new logos. The absolute customer base also reduces
              classic single-logo revenue concentration risk: at roughly $1,000 average annual revenue per customer, it
              is unlikely that any one startup dominates ARR.

              The more material risks are channel and portfolio composition. Public evidence suggests heavy dependence
              on the YC ecosystem and adjacent founder networks, which is powerful while Corgi is the preferred
              insurance choice inside that community but could become a meaningful drag if reputation shifts or
              competitors copy the acquisition motion. The startup-heavy portfolio also carries cyclical fragility: a
              venture slowdown, lower company formation, or elevated startup failure rates would hit both new-logo
              generation and renewal volumes. Geographic limits add a second constraint, since US-only coverage can
              create friction for globally distributed teams or companies whose operating footprint outgrows a
              startup-centric domestic policy package.
