        title: Integrations, deployment, and developer signal
        blocks:
          - type: paragraph
            body: >
              Publicly disclosed integrations are described more at the business-workflow level than the API
              specification level. Corgi says it integrates into cap table management platforms and cloud marketplace
              procurement channels so startups can acquire or update insurance when financing, vendor onboarding, or
              infrastructure purchasing events occur. That positioning suggests the product is intended to sit inside
              the operational systems founders already use, rather than behaving as a once-a-year insurance transaction.
              The self-service dashboard reinforces that framing by allowing ongoing policy management, certificate
              retrieval, and staged coverage expansion without a broker call.

              The stronger external signal comes from customer and developer-adjacent communities rather than from a
              traditional software ecosystem. Product Hunt commentary describes onboarding as fast, intuitive, and
              founder-friendly, which fits Corgi's message that buying insurance should feel more like setting up a
