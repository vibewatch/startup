  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Premium Streams
        blocks:
          - type: paragraph
            body: >-
              Corgi's revenue model is structurally different from insurtech brokers because Corgi retains the
              underwriting margin as a full-stack carrier. When a customer pays a premium, that premium flows to
              Technology Risk Retention Group, Inc. (TRRG), Corgi's underwriting entity. After paying claims,
              reinsurance costs, and operating expenses, the net underwriting result accrues to the Corgi group rather
              than to an external carrier. This carrier economics model means that, at a profitable combined ratio,
              Corgi generates a spread between earned premiums and incurred losses plus operating expenses that brokers
              cannot replicate. The primary revenue stream is insurance premium income across a portfolio that spans
              CGL, D&O, Tech E&O, Cyber, EPLI, AI Liability, Fiduciary, Workers Compensation, BOP, Commercial Umbrella,
              and specialized lines including Real Estate E&O, Lawyer E&O, and Non-Profit D&O. Products are priced on
              annual policy terms with premiums determined at binding based on AI-native underwriting assessment of risk
              factors including company stage, revenue, employee count, product type, and jurisdiction. Corgi's
              startup-stage modular packaging creates natural upsell paths: a pre-seed company buying CGL and Tech E&O
              for $500–$2,000 annually may expand to a $10,000–$25,000 D&O and full-bundle customer after raising a
              Series A. The company disclosed $40M+ ARR as of December 2025 with 40,000+ active customers, implying
              average revenue per customer (ARPC) of approximately $1,000 per year. Gross margin in the carrier model
              depends critically on the loss ratio and expense ratio (the combined ratio), which Corgi has not publicly
              disclosed. The company growing from approximately $1.2M revenue in mid-2024 to $40M+ ARR fifteen months
              later represents approximately 33x growth — a trajectory consistent with rapid market penetration in the
              YC ecosystem.
