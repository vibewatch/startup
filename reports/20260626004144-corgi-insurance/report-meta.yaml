appendices:
  - id: A
    title: Key Regulatory Disclosures
    blocks:
      - type: paragraph
        title: TRRG and RRG Structure
        body: >
          Coverage offered through Corgi is underwritten by Technology Risk Retention Group, Inc.
          (TRRG), organized as a risk retention group under the federal Liability Risk Retention Act
          (15 U.S.C. §3901 et seq.). TRRG is not subject to all state insurance laws and regulations.
          State insurance insolvency guaranty funds are NOT available for TRRG-underwritten policies.
          Corgi Insurance Services, Inc. (CA License #6012791) acts as program administrator and
          licensed insurance producer, not as the insurer. The Corgi group additionally includes
          other affiliated carriers and claims administration operations.
        claimRefs: [CO003, CO004, CO005, CO006, CO007]
