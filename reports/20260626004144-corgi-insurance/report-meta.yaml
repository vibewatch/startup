companyProfile:
  summary: >
    Corgi Insurance is a San Francisco-based AI-native, full-stack insurance carrier founded in
    2024 by Nico Laqua (CEO/CTO) and Emily Yuan (COO). The company emerged from Y Combinator's
    Summer 2024 batch and received full carrier regulatory approval in July 2025 after acquiring
    a licensed insurance entity for approximately $35 million. Corgi designs and manages insurance
    end-to-end — underwriting, policy issuance, and claims — powered by large language models
    and AI agents, and distributes modular commercial insurance directly to venture-backed startups
    across 49 US states. In under 12 months post-launch, the company grew to $40M+ ARR, 40,000+
    active customers, and completed three funding rounds totaling $378M, reaching a $2.6B valuation
    by late May 2026.
  foundedDate: "2024-01-01"
  founders:
    - name: Nico Laqua
      role: Co-founder, CEO & CTO
      background: Previously founded Basket, a gaming publisher with over 200 million monthly active users.
      claimRefs: [CO010, CO012]
    - name: Emily Yuan
      role: Co-founder & COO
      background: Dropped out of Stanford; Forbes 30 Under 30 (2024); formerly a product manager at OpenAI.
      claimRefs: [CO011, CO013, CO014]
  foundingLocation: San Francisco, CA
  headquarters: San Francisco, CA (9 Claude Lane)
  productSummary: >
    Modular commercial insurance packages (CGL, D&O, Tech E&O, Cyber, EPLI, Fiduciary, HNOA,
    Media Liability, R&W, and AI Liability) tiered by startup funding stage (Pre-Seed, Series A,
    Growth). Core products quote and bind in 10–15 minutes via AI-powered underwriting; specialty
    lines take 1–14 days. Underwriting is handled by affiliated carrier TRRG; Corgi Insurance
    Services acts as program administrator.
  customerFocus: Venture-backed startups and technology companies in the United States
  businessModel: >
    Premium-based insurance carrier model. Revenue comes from insurance premiums on annual
    policies; as a full-stack carrier, Corgi captures underwriting profit (premiums minus claims
    and operating costs) rather than brokerage commissions. Average revenue per customer is
    approximately $1,000/year; unit economics improved by sub-1% claimed churn and modular
    upsell as customers raise successive rounds.
  stage: Series B1
  fundingStatus: >
    $378M total raised across Seed + Series A ($108M, Jan 2026), Series B ($160M, May 6, 2026),
    and Series B1 ($106M, May 28, 2026). TCV led both Series B rounds; Kindred Ventures led
    Series A. Latest post-money valuation: $2.6B.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO009, CO015, CO023, CO024, CO030, CO031]
