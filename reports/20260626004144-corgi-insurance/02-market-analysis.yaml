callouts:
  - calloutType: insight
    title: The startup insurance SAM is defensible but undersized relative to the $1T+ TAM narrative
    body: >-
      Corgi's stated mission to rebuild the $1T+ global insurance market creates an attractive
      narrative, but the near-term serviceable market for startup commercial insurance is more
      plausibly $150-800M annually in the US. The trucking expansion and small-business
      ambition widen this materially, but neither market has been publicly sized with
      methodology.
    claimRefs:
      - CM001
      - CM006
      - CM007
      - CM009
      - CM011
  - calloutType: strength
    title: Deal-blocking trigger creates a captive, urgency-driven buyer
    body: >-
      Insurance becomes non-negotiable—and therefore price-insensitive on speed—when a startup
      needs to close a round or sign an enterprise contract. This purchase trigger means Corgi's
      10-15 minute bind time is not just a UX advantage but a revenue-acceleration mechanism.
    claimRefs:
      - CM014
      - CM015
      - CM018
  - calloutType: risk
    title: Cyber rate declines and TRRG non-admitted status are structural headwinds
    body: >-
      Cyber represents a significant portion of Corgi's product mix, but rates declined 5% in
      Q4 2025 and are expected to remain competitive. Simultaneously, TRRG's non-admitted
      status excludes an unknown but potentially material share of enterprise buyers who require
      admitted carriers.
    claimRefs:
      - CM022
      - CM028
      - CM029

