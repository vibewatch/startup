      - direction
      - timing
      - implication for Corgi
      - diligence ask
    rows:
      - - Startup formation rate (YC, Y Combinator, other accelerators)
        - Tailwind
        - Ongoing
        - Expands core SAM; YC batches are Corgi's highest-conversion distribution channel
        - Track new YC cohort sizes and insurability requirements for each batch.
      - - D&O becoming mandatory at Series A
        - Tailwind
        - Current
        - Every Series A in Corgi's target market requires D&O; near-100% conversion trigger
        - Monitor competitive pricing on D&O given market rate declines of 5%.
      - - Cyber proliferation and AI-driven attack surface expansion
        - Tailwind
        - 2-3 year horizon
        - Increases cyber coverage demand even as rates decline; volume offsets pricing
        - Assess whether Corgi's AI underwriting accurately prices AI-specific cyber risks.
      - - AI liability as new coverage category
        - Tailwind
        - Emerging now
        - Unique product differentiator; limited competition for 12-24 months
        - Monitor competitor product launches; assess adequacy of Corgi's AI liability pricing.
      - - Trucking/commercial auto market entry
        - Tailwind (expansion)
        - 2026-2027
        - Widens SAM materially; trucking is a $30B+ annual premium market
        - Review amwins and inszone trucking market data on pricing and loss environment.
      - - Cyber rate declines (down 5% Q4 2025)
        - Headwind
        - Current
        - Compresses premium per policy; requires higher volume to sustain ARR
        - Monitor combined ratio on cyber book as rates decline further.
