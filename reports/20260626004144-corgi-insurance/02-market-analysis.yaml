  - id: section-5
    title: Adoption constraints and market headwinds
    body: >
      Despite the favorable drivers, several structural constraints limit the pace and ceiling
      of Corgi's market penetration.


      The TRRG structure is the most important regulatory constraint. Risk retention groups are
      exempt from many state insurance laws and do not qualify for state guaranty fund protection.
      This limits Corgi's ability to serve buyers whose procurement requirements mandate coverage
      from an admitted carrier or A-rated carrier on AM Best's scale. Large enterprise buyers
      and regulated industries (banking, healthcare, government contracts) often have vendor
      insurance requirements that specify admitted carrier status—something Corgi's TRRG structure
      does not provide. This is a genuine market ceiling for the enterprise segment.


      Cyber rate declines represent a double-edged dynamic. While lower rates make Corgi more
      competitive, they compress premium per policy and require higher volume to sustain ARR
      growth. The Beinsure/Marsh composite rate data shows cyber rates declined 5% in Q4 2025,
      which is both a tailwind for customer acquisition and a headwind for underwriting margins
      on the cyber line.


      Geographic concentration in the United States limits the total addressable market.
      Corgi is unavailable for international operations, and the large community of
      Delaware-incorporated companies with international operations (especially Africa, Europe,
      and Asia-Pacific startups that incorporate in the US) cannot fully utilize Corgi's coverage
      for non-US operations.


      Switching costs in commercial insurance are lower than in other financial services products:
      most policies are annual, and broker-led competitors can be switched without IT integration
      cost. This means retention depends heavily on claims service quality and pricing, not on
      technical lock-in. Corgi's below-1% churn claim is an important counter-signal, but it is
      company-asserted and not independently verified.


      The insurance industry's long claims cycles mean that superior underwriting economics may
      not be visible to the market for 3-5 years. Corgi's carrier license dates from July 2025;
      loss ratios will not be meaningfully interpretable until 2027 at the earliest.
    claimRefs:
      - CM028
      - CM029
      - CM030
      - CM031
      - CM032
      - CM033
    figureRefs:
      - FM004

  - id: section-6
    title: AI liability as an emerging market category
    body: >
      AI liability is a materially new insurance product category with no established market
      sizing or loss-cost data as of the run date. Traditional Tech E&O policies are increasingly
      carving out AI-specific risks—including errors caused by large language model hallucinations,
      autonomous agent actions, and algorithmic bias—as insurers struggle to price tail risk in
      AI-generated outputs.


      Corgi's AI Liability product is currently one of the only commercial insurance products
      explicitly covering financial losses caused by AI model errors, hallucinations, and bias.
      As described on Corgi's AI industries page, the product is designed for companies scaling
      AI products that face liability exposure when model outputs cause downstream financial
      harm to customers or third parties.


      The market for AI liability is driven by regulatory uncertainty (the EU AI Act, US federal
      discussions on AI accountability) and by enterprise buyer requirements: procurement teams
      at regulated buyers are beginning to demand AI-specific coverage before signing contracts
      with AI-native vendors. The FIO's 2025 Annual Report acknowledges that emerging technology
      risks are creating new coverage demands that the traditional insurance classification system
      was not designed to accommodate.


      From a sizing perspective, the AI liability segment is too early for bottom-up sizing with
      public data. However, as a proxy: if even 10% of Corgi's current 40,000 customers are
      primarily AI companies and they pay a premium of $5,000-$15,000 for AI liability coverage,
      the current segment contribution is $20-60M in potential premium—close to Corgi's current
      total ARR. The long-term market is potentially very large given the pace of AI adoption
      across enterprise software, but the early-market loss experience will be critical in
      determining whether current premium rates are adequate.
    claimRefs:
      - CM034
      - CM035
      - CM036
      - CM037
      - CM038

