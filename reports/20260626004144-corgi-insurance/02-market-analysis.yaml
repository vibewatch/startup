company:
  name: Corgi Insurance
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Corgi operates at the intersection of three addressable markets: the $1T+ global P&C insurance
    industry, the $50B-estimated insurtech segment, and the emerging US commercial insurance market
    for technology startups and AI-native businesses. The TAM is very large but poorly bounded for
    underwriting purposes; the more defensible SAM is the US small-business and startup commercial
    insurance segment, estimated conservatively at $15-25B in addressable gross premium. Growth
    drivers are structurally favorable—AI-driven underwriting efficiency, cyber risk proliferation,
    and venture-capital funding of startups—but the regulatory environment for risk retention groups,
    competitive cyber rate declines, and potential macro headwinds represent material constraints.

sections:
  - id: section-1
    title: Market boundary, definition, and context
    body: >
      Corgi's relevant market spans three nested levels. At the broadest level, the global
      property and casualty (P&C) insurance industry is a $1T+ market by total premium, as
      cited in Corgi's own about page and corroborated by the Federal Insurance Office's (FIO)
      2025 Annual Report, which tracks the US P&C segment as one of the largest globally.
      This headline number is useful as a narrative frame but is not a meaningful sizing
      constraint for Corgi's near-term operations.


      At the mid-tier, Corgi competes within the US commercial insurance market for small and
      medium-sized businesses, specifically the technology startup and venture-backed company
      segment. This is the segment where Corgi's product portfolio is most directly applicable:
      CGL, D&O, Tech E&O, Cyber, and EPLI are the coverage lines enterprise contracts and
      investor term sheets require before money moves. The FIO's 2025 Annual Report confirms
      the US P&C industry premium base, and the NAIC industry snapshots data provides the
      statutory filings baseline that anchors carrier-level sizing.


      At the most addressable level, Corgi competes in the insurtech segment—digital-first
      commercial insurance for high-growth businesses. Startupsunion estimated the broader
      insurtech market at approximately $50 billion in 2026. This estimate covers digital
      distribution and underwriting platforms across all commercial lines, not just startup-
      focused coverage. Corgi's current footprint—40,000 startup customers at roughly $1,000
      average annual premium as of January 2026—represents a narrow but rapidly growing slice
      of this space.


      The market boundary matters for valuation. Corgi's stated ambition is to rebuild the
      $1T+ global insurance industry from the ground up, but its current product portfolio and
      carrier license constrains near-term penetration to the US commercial lines segment
      accessible through a risk retention group structure, available in 49 states. International
      business and personal lines are explicitly excluded from Corgi's current market.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
    tableRefs:
      - TM001

  - id: section-2
    title: Market sizing—TAM, SAM, and SOM
    body: >
      The total addressable market (TAM) for Corgi's broadest relevant universe—global P&C
      commercial insurance—exceeds $1 trillion annually. However, this figure includes personal
      auto, homeowners, workers' comp, and large-enterprise specialty lines that Corgi does not
      currently target and cannot price through a risk retention group structure. Using it as
      a valuation multiple anchor significantly overstates near-term opportunity.


      The more defensible serviceable addressable market (SAM) is the US commercial insurance
      market for small-to-mid-market businesses, particularly the technology and startup
      subsegment. The FIO 2025 Annual Report places total US P&C direct written premiums at
      approximately $1.1 trillion as of 2024 industry data. Commercial lines account for
      roughly 40-50% of that total, placing the commercial lines TAM at approximately
      $440-550B annually in the US. Within commercial lines, the small-to-mid-market tech
      startup segment is materially smaller. Beinsure's analysis of US insurance rate data
      (sourced from Marsh's composite rate indices) shows that financial and professional lines
      (which include D&O, E&O, and Cyber) represent a subset of total commercial premium with
      Cyber declining 5% in Q4 2025 and D&O declining 5%.


      A conservative bottom-up estimate for Corgi's serviceable addressable market anchors to
      venture-backed startups requiring commercial insurance: approximately 50,000-80,000 active
      US venture-backed companies at any point in time (inferred from PitchBook and NVCA
      ecosystem data) times an average annual premium of $3,000-$10,000 depending on stage
      yields a SAM of roughly $150M to $800M for startup-only commercial insurance. However,
      Corgi's stated expansion into trucking, small business, and other commercial segments
      materially widens the SAM: the US commercial auto market alone (which includes trucking)
      is estimated by Lockton at a meaningful portion of total commercial lines. The lockton
      2026 quarterly update describes the commercial insurance market as entering a more stable
      phase with competitive rates for well-managed risks.


      The serviceable obtainable market (SOM) for 2026 is best proxied by Corgi's own publicly
      stated traction: $40M ARR and 40,000 customers. This implies current penetration of
      roughly 0.1% of the broadest US commercial lines market, or 50-80% of the targeted
      startup-insurance SAM if the conservative sizing is correct. The startup SAM sizing gap
      is the most important evidence gap for valuation chapters.
