    summary: >-
      Startup insurance adoption follows a predictable path from deal-blocking trigger through
      product selection, underwriting, and claims. Corgi's AI-native stack collapses multiple
      steps that traditionally involve 3-5 intermediaries.
    data:
      nodes:
        - id: trigger
          label: Deal-blocking trigger
          detail: Investor term sheet, enterprise contract, or office lease requires proof of insurance.
          tone: neutral
        - id: channel
          label: Channel/referral
          detail: YC network, law firm, VC, cap table platform, or direct web search.
          tone: positive
        - id: quote
          label: Instant quote (10-15 min)
          detail: AI underwriting engine assesses risk and delivers a bound quote without broker intermediary.
          tone: positive
        - id: bind
          label: Policy binding and certificate
          detail: Coverage bound same day; certificate of insurance issued immediately.
          tone: positive
        - id: claims
