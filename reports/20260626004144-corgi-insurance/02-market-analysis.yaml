  - id: section-3
    title: Buyer segmentation and adoption path
    body: >
      Corgi's core buyer is the founder or early employee responsible for closing a funding
      round, signing an enterprise contract, or satisfying a landlord requirement—moments when
      insurance becomes a deal-blocking constraint rather than a discretionary purchase. This
      purchase trigger is important: it creates urgency and lowers price elasticity because the
      opportunity cost of delay (a deal blocked, a round jeopardized) exceeds the premium cost
      by orders of magnitude.


      Corgi's published startup insurance cost guide identifies three distinct buyer segments
      by funding stage, each with different coverage requirements and budget profiles. Pre-Seed
      and Seed stage buyers typically spend $2,000-$4,000 per year on a core CGL + Tech E&O +
      Cyber bundle. Series A buyers increase spend to $10,000-$25,000+ per year as D&O and
      EPLI become mandatory for board composition and enterprise contracting. Growth stage
      buyers (Series B+) spend $30,000-$100,000+ per year and require fiduciary, higher-limit
      umbrella, and specialized lines.


      The payer is typically the company rather than the founder personally. The budget owner is
      the CEO or CFO at early stages, with procurement or risk management roles at growth stage.
      Channel partners—VCs, law firms, cap table platforms—play a significant role in the
      adoption path because they introduce insurance requirements at the point of maximum
      urgency: term sheet signing, board member joining, or enterprise contract negotiation.
      This gives Corgi a structural advantage through its YC ecosystem integration.


      The AI company subsegment is an emerging buyer type with distinct needs. Companies building
      AI products face unique liability exposure from model errors, hallucinations, and bias that
      traditional Tech E&O policies are increasingly carving out. Corgi's AI Liability product
      targets this buyer directly. The inszone trucking market data and amwins transportation
      outlook confirm that trucking is a second buyer segment Corgi is actively entering.
    claimRefs:
      - CM014
      - CM015
