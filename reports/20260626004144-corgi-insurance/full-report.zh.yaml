      - number: '1.2'
        title: 创始人、领导层与组织文化
        blocks:
          - type: paragraph
            body: >
              Corgi 由 Nico Laqua 和 Emily Yuan 于 2024 年创立。两位创始人都完成了 Y Combinator 2024
              年夏季批次，因此公司早期就接入全球最密集的风投支持初创公司网络之一——这也是它的主要获客渠道。


              Nico Laqua 担任 CEO 兼 CTO。他是连续创业者：在 Corgi 之前，他创办了游戏发行商 Basket，月活用户超过 2 亿。Laqua 曾把自己对保险的兴趣追溯到父亲在 USAA
              担任律师的经历；ChatGPT 3.5 发布后，他认为保险是 LLM 颠覆的理想对象，并称其为「全球最大的文字型行业」。他同时担任 CEO 和 CTO，既反映公司工程优先的身份，也形成了明显的关键人物集中度。


              Emily Yuan 担任 COO 和联合创始人。她在 Stanford 大三退学，并于 2024 年入选 Forbes 30 Under 30。The Next Web 称她在联合创办 Corgi 前曾任
              OpenAI 产品经理；这一背景很可能影响了公司的 AI-first 产品架构。Yuan 是 Corgi 合作伙伴和品牌项目的公开代表，包括 Corgi Café。


              按 YC 列表，公司团队约有 70 名员工。创始人公开确认公司实行高强度的一周七天工作制；Nubia Magazine 一篇评论还称，已有数名员工住在公司位于 Claude Lane 9
              号、带住宅分区属性的办公室里。Nubia
              调研的创始人反应不一：有人认为这种文化有吸引力，也有人在把风险栈关键部分交给该服务商时把它视为实质顾虑。这种文化强度符合高速增长初创公司的常态，但如果公司大幅扩员，需要继续跟踪。
