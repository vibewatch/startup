      - number: '3.5'
        title: 功能与能力对比
        blocks:
          - type: paragraph
            body: >-
              横向比较竞争者功能覆盖，可以看到三层能力。Corgi 占据独特位置：它是唯一同时具备 AI 原生核保的全栈承保公司、提供初创阶段模块化保障和即时出单、且包含 AI Liability 产品的玩家。Vouch 和
              Embroker 在初创聚焦和即时报价上可以匹配，但它们是经纪商，没有核保控制权。Coalition 在网络风险管理深度上领先，但不提供初创组合包或 D&O/EPLI。Next Insurance（ERGO
              NEXT）在原始客户量上领先，但它是通用 SMB，不专门服务风投支持科技公司。既有承保公司（Chubb、Hartford、Progressive）是全栈承保公司，保障宽度很深，但缺乏面向种子 /
              早期阶段的初创专业化和即时出单能力。对 Corgi 核心板块最关键的差异点是：（1）AI Liability
              产品，目前没有竞争者以独立保单形式清晰覆盖模型错误、幻觉和偏见索赔；（2）把保障映射到融资里程碑的初创阶段模块化打包，这是其他保险公司没有复制的产品设计；（3）全栈承保结构，让 Corgi
              保留经纪商必须交给外部承保公司的核保利润。不过，标准险种（CGL、D&O、Tech E&O、Cyber）的功能集在数字保险科技同行之间大体可比。Corgi
              在标准险种上的竞争优势越来越依赖定价和速度，而不是产品独特性；随着竞争者用类似 AI 工具成熟核保能力，存在趋同风险。
