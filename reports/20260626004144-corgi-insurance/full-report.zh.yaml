      - number: '2.2'
        title: 市场规模——TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >
              Corgi 最宽相关宇宙——全球 P&C 商业保险——的总可服务市场（TAM）每年超过 $1 trillion。不过，这个数字包含个人汽车险、房主险、Workers' Comp 和大型企业专项险种；Corgi
              目前不瞄准这些业务，也无法通过风险自留集团结构定价。把它用作估值倍数锚点，会显著夸大近期机会。


              更站得住脚的可服务可触达市场（SAM），是美国面向中小企业的商业保险市场，尤其是科技和初创公司子板块。FIO 2025 Annual Report 显示，截至 2024 年行业数据，美国 P&C
              直接承保保费总额约为 $1.1 trillion。商业险种约占其中 40-50%，对应美国商业险 TAM 约为每年 $440-550B。在商业险种内部，中小市场科技初创公司板块要小得多。Beinsure
              对美国保险费率数据的分析（来自 Marsh 综合费率指数）显示，金融与专业险种（包括 D&O、E&O 和 Cyber）只是商业总保费的一个子集，其中 Cyber 在 2025 年 Q4 下降 5%，D&O 下降
              5%。


              对 Corgi 可服务可触达市场做保守自下而上估算，可以锚定需要商业保险的风投支持初创公司：任一时点美国活跃风投支持公司约 50,000-80,000 家（从 PitchBook 和 NVCA
              生态数据推断），乘以随阶段不同约 $3,000-$10,000 的年均保费，得到仅初创商业保险的 SAM 约 $150M 至 $800M。不过，Corgi 公开表示要进入卡车、小企业和其他商业板块，这会大幅拓宽
              SAM：仅美国商业汽车险市场（包含卡车）就是总商业险种中有意义的一部分，Lockton 也给出过估计。Lockton 2026 年季度更新称，商业保险市场正在进入更稳定阶段，对管理良好的风险给出有竞争力的费率。


              2026 年可获得市场（SOM）最好用 Corgi 自己公开披露的牵引来近似：$40M ARR 和 40,000 名客户。这意味着，公司当前在最宽美国商业险种市场中的渗透率约为
              0.1%；如果保守规模估算正确，则在目标初创保险 SAM 中的渗透率为 50-80%。初创 SAM 的规模缺口，是估值章节最重要的证据缺口。
