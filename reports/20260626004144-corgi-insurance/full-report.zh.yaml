        - label: D&O（成熟）
          values:
            - 高到中
            - 长尾品类；Corgi 特定公开历史很少
            - 高
            - 中等
        - label: AI Liability（先发）
          values:
            - 中
            - 公开理赔历史非常有限
            - AI 初创公司需求快速增长
            - 若条款和定价撑得住，则为高
        - label: Trucking（萌芽）
          values:
            - 低 / 未知
            - 未公开披露
            - 可能是很大的相邻市场
            - 目前低；护城河未验证
    claimRefs:
      - CE017
      - CE027
      - CE033
      - CE037
      - CE039
      - CE040
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 多数 Corgi 客户是在外部触发因素出现时发现产品：企业合同、融资、租约或银行要求会立刻制造已验证保险和快速出具凭证的需求。
    approximationNotes: 旅程阶段来自公开客户故事和公司描述的综合，而不是 Corgi 发布的漏斗仪表盘。
    data:
      nodes:
        - id: enterprise-contract-trigger
          label: 企业合同触发
          detail: 初创公司遇到买方、银行、租约或尽调要求；保险不到位，收入或融资就会被卡住。
        - id: corgi-discovery
          label: 发现 Corgi
          detail: 创始人通过 YC、创始人转介绍、律所、合作伙伴工作流或直接网页搜索了解 Corgi。
        - id: quote-and-bind
          label: 报价并绑定
          detail: 客户完成简短录入，标准险种快速收到定价，并以数字方式绑定。
        - id: policy-activation
          label: 保单激活
          detail: 系统激活保险凭证、保单文件和支持渠道，初创公司可以满足交易对手要求。
        - id: renewal-event
          label: 续保事件
          detail: 业务变化、原有供应商涨价冲击，或年度续保会触发重新评估。
        - id: upsell-expansion
          label: 加购 / 扩展
          detail: 员工数、企业销售和治理需求扩大后，客户增加后续阶段保障。
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU017
      - CU019
      - CU030
  - id: FU002
    title: 采用漏斗
    type: funnel
    layout: standard
    summary: Corgi 从可触达的创始人网络转化为活跃投保人的表现看起来强，但续保层仍不成熟，主要依赖公司披露指标。
    approximationNotes: 除公司声称的 40,000+ 活跃投保人外，前四个漏斗阶段都是方向性估算。续保量为推断值，而非直接披露。
    data:
      items:
        - label: 可触达的 YC 初创公司和相邻创始人网络
          value: 100
        - label: 知晓 Corgi（估算）
          value: 80
        - label: 完成报价流程（估算）
          value: 60
        - label: 活跃投保人（40,000+）
          value: 40
        - label: 至少续保一次（估算）
          value: 18
    claimRefs:
      - CU009
      - CU010
      - CU013
      - CU026
      - CU033
  - id: FU003
    title: 留存队列
    type: cohort
    layout: standard
    summary: 留存数据几乎全部来自公司说法；截至运行日期，最早可观察客户队列也只有三个季度公开历史。
    approximationNotes: 数值来自管理层表述（<1% 流失率意味着约 99% 留存）或分析师估算。空季度数值设为 99（公司称 <1% 流失）以满足数字队列合约。
    data:
      columns:
        - Q3 2025
        - Q4 2025
        - Q1 2026
