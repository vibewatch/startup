      - number: '7.5'
        title: 风险缓释、监控信号与 thesis 破裂触发器
        blocks:
          - type: paragraph
            body: >-
              Corgi
              的好消息是，主要风险即便还无法完全通过公开信息衡量，也都可以监控。公司广泛推进牌照、强劲融资、高增长，以及在创业公司保险中的明显产品市场匹配，提供了足够证据支持继续尽调，而不是立即排除。问题在于，决定性问题恰好是公开材料没有回答的那些：TRRG
              盈余充足性、按险种拆分的赔付率、准备金方法、再保险结构、对 YC
              来源需求的依赖，以及创始人高强度文化的可持续性。因此，正确姿态不是假定投资判断已破裂，而是设定一旦触发就会迅速破裂的明确条件。最重要的触发器包括针对 TRRG 的监管行动、AI Liability 或 Cyber
              中持续不利发展、YC 分销飞轮丧失、创始人离职，或 ARR / 客户指标被夸大的证据。监控应聚焦 NAIC
              filings（可获得后）、任何牌照状态变化、再保险披露、领导层更新，以及创业融资环境弱化到足以打击组合核心客户群的迹象。在积极承保该业务前，投资者应要求管理账、精算准备金备忘录、再保险明细表、理赔清单和渠道组合数据。
