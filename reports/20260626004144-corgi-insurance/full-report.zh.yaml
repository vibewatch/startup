      - number: '8.2'
        title: 可比公司与先例交易
        blocks:
          - type: paragraph
            body: >-
              可比分析显示，Corgi 现在的价格有多特殊。最干净的直接标尺就是 Corgi 自己：2026 年 5 月 6 日 Series B 在公司自称 $40M ARR 的基础上给出 $1.3B 估值；5 月 28 日
              Series B1 给出 $2.6B 估值，隐含倍数只用 22 天就从 32.5x 翻到 65.0x。即便在偏友好的融资市场，这也不寻常。跳出 Corgi 看，最接近的战略交易是 ERGO 2025 年以约
              $2.6B 收购 Next Insurance。Next 成熟度明显更高，保费基数大得多，承保记录也更长；两家公司头部估值相同很有信息量，但从风险调整角度并不支持 Corgi 的入场价。Coalition 以约
              $500M GWP 支撑 $5.0B 私募估值，以及 Cowbell、Pie、Vouch、Embroker 的融资历史，说明投资人愿意为全栈或差异化 insurtech
              保险公司支付显著溢价；但行业基准倍数仍明显低于 Corgi 当前的 ARR 框架。换句话说，可比组解释了为什么高倍数可能出现，却不能说明 65x 倍数是保守的。先例证据支持的观点是，Corgi 正被当作 AI
              原生品类领军者来定价，最好的年份还在前面；它不支持仅凭当前公开指标就能证明最新轮价格合理的说法。
            claimRefs:
