              全栈设计同时改变产品体验和经济性。Corgi
              不把客户导向外部承保载体，而是用自有保险公司结构承保，因此能在一个运营模型下统一报价、绑定、保单服务和理赔。这应能带来更简单的客户工作流，也创造了留下承保利润的可能；经纪主导同行通常会把这部分利润留在桌上。战略问题在于，Corgi
