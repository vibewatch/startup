      - number: '2.4'
        title: 增长驱动与市场顺风
        blocks:
          - type: paragraph
            body: >
              未来 2-5 年，五个结构性驱动支撑 Corgi 的市场机会。第一，风投支持初创公司的扩散，持续扩大需要初创保险包的买方基数。仅 YC 每批就投资数百家公司，YC 由数十万家公司组成的校友网络是 Corgi
              的主要渠道。随着机构投资人把保险要求标准化写入 term sheet，成立后 24 个月内需要 D&O 保障的公司数量也在增长。


              第二，网络风险是主要增长驱动。尽管费率下降（按 Beinsure/Marsh 数据，2025 年 Q4 下降 5%），网络理赔量仍然很高——Beinsure 指出，在其评估期间网络理赔超过 2,000 起——而
              AI 驱动的攻击面还在扩大。NAIC 保险行业快照确认，Cyber 仍是快速增长的险种。相较缺乏初创公司特定攻击面数据的传统承保公司，Corgi 的 AI 核保栈更有机会为科技初创公司的网络风险精准定价。


              第三，AI liability 是竞争有限的新产品类别。随着 LLM 驱动产品扩散，传统保险公司正主动把 AI 错误从 E&O 保单中剔除。用 AI agent 替代人工流程的公司面临保障缺口，Corgi
              明确填补这一缺口。FIO 2025 Annual Report 指出，新兴技术风险正在金融与专业险种中创造新的保障需求。


              第四，市场稳定正在给新进入者创造有利条件。Lockton 2026
              年季度市场更新称，美国商业保险市场正在进入「更稳定阶段」，对理解充分、可控的风险给出有竞争力的费率。这会降低有利于大型既有承保公司的定价波动，并给 AI
              原生核保方留下空间，让它们不只靠再保险能力，而是靠速度、准确性和体验竞争。


              第五，B2B SaaS 和 API 型商业模式加速采用，正在扩大 Tech E&O 和 Cyber 的敞口基础。更多开发 AI 驱动产品的初创公司需要明确覆盖软件故障和数据泄露；该板块增长在方向上利好具备 AI
              专项核保能力的专业承保公司。
