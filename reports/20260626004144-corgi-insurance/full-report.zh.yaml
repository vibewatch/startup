      - number: '3.3'
        title: 专业与垂直保险科技玩家
        blocks:
          - type: paragraph
            body: >-
              除了直接初创保险同行，几家保险科技公司在与 Corgi 扩张路线相交的险种上占据强位。Coalition 是主导性的网络保险专业公司，2022 年以 $5 billion 企业估值完成 $250 million
              Series F 融资。Coalition 的「Active Insurance」模式把网络风险管理工具与保险保障打包；据称，主动威胁检测让投保人理赔减少 73%。Coalition 只聚焦 SMB
              和中端市场的网络风险，不提供 Corgi 的初创阶段组合包。当 Corgi 在 cyber 险种竞争时，它必须靠初创专业化、承保经济性和一体化组合来差异化，而不能靠网络专项风险管理深度。Cover Whale 在
              2023 年完成 $27.5 million Series A 融资，把 AI 驱动核保用于卡车和商用车队保险。它的 DriveSmart 车联网引擎平均 18 分钟出单。Cover Whale 位于 Corgi
              宣布下一步扩张的同一卡车垂直，是该赛道最直接的未来竞争者。Pie Insurance 在 2022 年完成 $315 million Series D 融资，瞄准小企业 Workers Compensation
              市场。Pie 在 Workers Comp 上的垂直深度超过 Corgi 当前该险种供给。Cowbell Cyber 先后完成 $100 million Series B 和 $60 million Series
              C 融资，开发面向 SMB、通过经纪渠道销售的 AI 驱动网络保险定价和保单管理平台。Cowbell 通过经纪人运营，而 Corgi 直接面向创始人。Next Insurance 于 2025 年被
              ERGO/Munich Re 以约 $2.6 billion 收购后，现在以 ERGO NEXT 运营，为 750,000+ 家企业提供 1,300+ 类型的即时在线保险。Munich Re
              入主后的近期方向尚不清楚，但它的规模和母公司资源让它在更广义 SMB 数字保险市场中构成潜在威胁。
            claimRefs: []
      - number: '3.4'
        title: 既有承保公司替代方案
        blocks:
          - type: paragraph
            body: >-
              传统承保公司仍是初创买方的相关替代选项，尤其当公司成熟到 Series B 及之后。Chubb 是全球最大的商业保险公司之一，服务各种规模企业，覆盖 30+ 个专业行业实践，包括科技和专业责任。Chubb
              能提供大型跨国科技公司需要的保障深度，但通常通过经纪中介触达买方，增加摩擦和成本。对早期初创板块而言，Chubb 的核保流程、最低保费和必须经纪人参与的工作流，无法与 Corgi 的自助模式竞争。The
              Hartford 服务小企业保险客户已有 200+ 年，截至 2026 年拥有 1.3 million+ 小企业客户，并获 Keynova 评为排名第一的数字小企业保险公司。Hartford
              的数字能力已经显著提升，但产品设计是通用 SMB，而非初创专项。它不提供初创阶段模块化打包、AI Liability，也不直接集成 VC 基础设施平台。Progressive Commercial 拥有 50+
              年经验和 30+ 种保障类型，覆盖商业汽车和小企业保险，在与卡车车队相关的商用车险种上尤其强。随着 Corgi 扩张进入卡车，Progressive Commercial
              会成为更相关的既有竞争者。既有承保公司总体代表着保险科技公司最终必须匹配的核保资本和定价深度；它们的弱点是分销摩擦和产品僵硬，难以服务那些想要 API 集成、即时出单和透明定价的科技原生买方。
