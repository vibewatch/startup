      - number: '4.2'
        title: 定价与商业化结构
        blocks:
          - type: paragraph
            body: >-
              Corgi 采用直接保险公司定价模型：保费由自有承保团队设定，没有经纪佣金层。公开的创业公司保险成本指南显示，pre-seed 覆盖（CGL + Tech E&O 基础组合）起步约为每年
              $500–$2,000；seed 阶段组合在 $2,000–$4,000 区间；Series A 套餐（加入 D&O 和 EPLI）在 $10,000–$25,000 区间；growth 阶段方案每年超过
              $30,000。这些是标价；实际保费会随风险画像、选择的限额、行业和历史理赔而变化。根据 Artisan 的客户证言（Corgi 自有案例研究），公司作为全栈保险公司，在某些情况下可比经纪竞争对手节省最高 30%
              成本。定价模型包括标准险种的即时绑定自助路径（10–15 分钟出报价，当天绑定），也包括需要 1–14
              天承保的专项险种人工经纪渠道。公司未公开披露批量折扣或企业定价表。合同条款为年度保单，遵循标准商业保险续保周期。Workers comp 和部分专项险种可能按工资调整后基础计费。商业化模型不包含订阅 SaaS
              收入；公开声明显示，收入 100% 由保险保费驱动。这意味着收入与保费规模和赔付经验相关，而不是与合同化经常性 SaaS 收入相关，也带来纯 SaaS 模型没有的波动风险。
