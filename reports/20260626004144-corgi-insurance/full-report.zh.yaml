  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群分层与获客渠道
        blocks:
          - type: paragraph
            body: >
              Corgi 的客户群更适合理解为一个 VC 支持的创业公司组合，而不是泛化的小企业账簿。公司的客户页、首页和 YC profile 都指向一个集中的核心细分：Seed 和 Series A
              科技公司，因为买方、银行、房东或投资者要求，突然需要企业级保险。在这一宽泛创业公司细分中，可见子集包括 AI 原生软件公司、企业 SaaS
              供应商，以及一小批气候或硬件相邻创业公司；它们的风险无法干净套进现成经纪模板。具名案例强化了这一模式。Artisan 需要保障才能卖给银行，Eragon 需要满足企业采购清单，Sorcerer
              则需要为更复杂的物理部署画像定制保障。

              获客渠道也同样聚焦。公开披露持续显示，YC 和创始人推荐循环是主要分销引擎，律所、股权表平台、云市场工作流和直接入站需求提供次级贡献。这一组合重要，因为它同时解释了客户标识积累速度和集中风险：Corgi
              销售进入的是信任、可背书性，以及围绕融资或企业交易的时点，比广泛消费者式品牌知名度更重要的社区。49
