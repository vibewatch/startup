              - CR040
              - CR044
      - number: '7.6'
        title: 展示材料
        blocks:
          - type: callout
            title: TRRG 担保基金排除是对投保人最重要的单一风险披露
            body: >-
              Corgi 的核心法律事实不是它无牌或明显不合规；而是 TRRG
              结构改变了保险公司受损时最终承担信用风险的人。投保人拿不到认可保险公司通常对应的州担保基金兜底，因此尽调必须聚焦盈余、准备金和再保险，而不是只看增长。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
          - type: callout
            title: AI Liability 产品是没有精算历史的先发押注——不利发展无法量化
            body: >-
              Corgi 的 AI Liability 线可能证明具备差异化，但公司在行业尚未积累可信数据库前就开始承保；该数据库本应覆盖 LLM
              幻觉、模型偏见和训练数据争议的理赔频率、严重度、除外责任行为和损失发展模式。这让外部很难仅凭公开证据评估准备金充足性和定价纪律。
            calloutType: risk
            claimRefs:
              - CR013
              - CR020
              - CR028
          - type: callout
            title: 监管和资本风险当前可管理，但保费账簿增长后需要主动监控
            body: >-
              审阅的来源集中没有任何内容证明 Corgi 当前陷入困境，公司也已融到足够资本，值得认真承保这门业务。但保费规模扩大后，风险可能迅速变化。正确的尽调姿态是持续监控 NAIC
              申报、盈余充足性、按险种拆分的损失发展，以及任何监管方开始更严格审视 TRRG 结构的信号。
            calloutType: insight
            claimRefs:
              - CR039
              - CR040
              - CR037
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 单位经济与盈利路径
        blocks:
          - type: paragraph
            body: >-
              Corgi 的估值判断，先要看清单位经济学哪些可见、哪些不可见。公司公开披露的信息足以证明收入端扩张很快，但还不足以证明承保利润能持续。Corgi 称 ARR 到 2025 年 12 月达到 $40M，平台到
              2026 年 1 月服务 40,000+ 客户，折算每名客户年保费约 $1,000。考虑到产品组合以 CGL、Tech E&O、Cyber、D&O
              为核心，这个数字对早期创业公司的商业保险而言大体可信。更难的问题是收入质量。Corgi 尚未公开披露赔付率、综合成本率、CAC、回本周期或 cohort 层面的留存机制。管理层声称公司已盈利、流失率低于
              1%，YC 网络也可能让获客成本低于依赖经纪人或重度现场销售的同业，但这些说法都无法从公开记录中独立审计。问题在于，保险公司的现金流质量不由 ARR
              单独定义，而取决于保费在理赔、再保险和运营费用之后，长期能留下多少。若承保稳健，全栈保险公司会比经纪商值钱得多，因为它能拿到承保利润和浮存金投资收益。反过来，若准备金偏轻，或长尾责任险在增长被庆祝后恶化，价值也可能大幅低于经纪商。因此，当前估值更像是在为未来单位经济学得到验证付费，而不是为已经充分证明的当期盈利流付费。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV023
              - CV035
