  summary: >
    Corgi Insurance 是一家位于旧金山的 AI 原生全栈保险承保公司，2024 年由 Nico Laqua（CEO/CTO）和 Emily Yuan（COO）创立。公司出自 Y Combinator 2024
    年夏季批次，并在以约 $35 million 收购一家持牌保险实体后，于 2025 年 7 月拿到完整承保监管批准。Corgi 用大语言模型和 AI agent 驱动核保、签发保单、理赔等端到端保险环节，向美国 49
