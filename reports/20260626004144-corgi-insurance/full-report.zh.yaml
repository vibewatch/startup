      - number: '4.5'
        title: 公开牵引力、收入质量与估算
        blocks:
          - type: paragraph
            body: >-
              Corgi 公开披露的财务指标只拼出一幅局部图景。$40M+ ARR 是公司口径，随 2026 年 1 月 Series A 新闻稿发布，并非正式审计披露。2024 年中提到的 $1.2M
              收入来自二级分析来源。保险公司的 ARR 指标需要解释：保险 ARR（年化保费 run rate）不同于 SaaS ARR，因为保费会受到赔付、再保险成本和精算发展的影响。若一家 $40M ARR
              的保险公司综合成本率为 100%（盈亏平衡），则不产生净利润；综合成本率 90% 时产生 $4M 净利润；80% 时产生 $8M。若 CEO 2026 年 4 月盈利说法可解读为综合成本率低于
              100%，对于一家全牌照运营仅约 10 个月（2025 年 7 月获牌）的保险公司，这是有意义的里程碑。客户质量有部分具名客户佐证：Artisan（AI BDR 创业公司）、Eragon（企业
              SaaS）、Sorcerer（气象气球 / 气候数据）、Intryc（数据安全 / Deel 客户）和 Imagine AI（内容自动化）。五个客户案例均来自 YC 关联公司，这符合 YC
              网络获客策略，也带来集中风险：YC deal flow 或品牌认知一旦变化，可能不成比例地影响 Corgi 的客户管线。40,000+ 客户数和 $40M+ ARR 意味着客户基数高量、低 ARPC，以小型
              seed 阶段公司为主。随着这些公司成长到 Series A 及以后，自然追加销售应拉高 ARPC，改善收入质量。不过，公司未披露 ARPC 走势或 cohort 扩张收入数据。
