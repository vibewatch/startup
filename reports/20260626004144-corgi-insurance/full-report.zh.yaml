      - number: '1.5'
        title: 市场进入、里程碑与负面信号
        blocks:
          - type: paragraph
            body: >
              Corgi 的主要获客渠道是 YC 网络，这让它能在保险需求最强的时刻直接触达初创生态：公司即将完成融资或签下企业合同时。公司还借助与律所、股权表管理平台和云市场的 API
              集成扩大触达。复杂保障需求可选择人工经纪人，给需要指导、而非纯自助的创始人保留选择权。


              最显眼的 GTM 动作是 Corgi Café：一家 24 小时咖啡馆，2026 年 2 月开在旧金山金融区 Claude Lane 9 号，位于公司办公室楼下的一层。Startupsunion 将其类比为
              Capital One Café——一个实体品牌社区触点，让创始人在低压力场景里接触 Corgi 品牌。2026 年 3 月，Corgi 收购域名 corgi.com，整合线上存在，也释放长期品牌投入信号。


              后续需要带入的关键负面与尽调信号包括：（1）TRRG 结构意味着投保人没有州偿付保障基金保护。（2）承保牌照仅从 2025 年 7 月开始，理赔处理记录非常有限。（3）公司未披露公开赔付率。（4）Nubia
              Magazine 已独立提到文化顾虑——一周七天工作制、员工住办公室。（5）22 天内估值从 $1.3B 升至 $2.6B，即使放在 2026 年 AI
              融资公告中也是离群值，需要更深入的倍数扩张分析。（6）ARR 和客户数由公司声称，未经审计。
