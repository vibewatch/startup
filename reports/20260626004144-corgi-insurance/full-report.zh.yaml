      - number: '6.5'
        title: 扩张机制与集中风险
        blocks:
          - type: paragraph
            body: >
              Corgi 的扩张模型结构上有吸引力，因为它匹配创业公司的成熟路径。早期客户可以从 general liability、Tech E&O、cyber 和 D&O
              等紧凑组合开始；当员工数、融资复杂度或企业采购需求上升时，再加入 EPLI、media liability、fiduciary
              或其他专项险种。若公司能留住客户穿过这一阶段演进，平均每账户收入即便不靠大量新增客户标识也应扩张。绝对客户基数也降低了经典的单一客户收入集中风险：按约 $1,000
              的客户平均年收入估算，任何一家创业公司都不太可能主导 ARR。

              更实质的风险在于渠道和组合构成。公开证据显示，Corgi 高度依赖 YC 生态和相邻创始人网络；当 Corgi
              是该社区内首选保险选择时，这是强大优势，但若声誉变化或竞争对手复制获客动作，也可能成为有意义的拖累。创业公司占比重的组合还带有周期脆弱性：venture 放缓、公司设立减少或创业公司失败率上升，都会打击新
              logo 生成和续保量。地域限制构成第二个约束，因为仅覆盖美国会给全球分布团队，或运营足迹超出创业公司中心化国内保单包的公司，带来摩擦。
