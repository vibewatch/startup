              - CV040
      - number: '8.4'
        title: 情景分析：牛市、基准与熊市情形
        blocks:
          - type: paragraph
            body: >-
              面对 Corgi 这样被拉伸的估值，情景分析是最克制的解读方式。牛市情形下，Corgi 从 $40M ARR 复合增长到 2028 年约 $350M，守住 AI
              驱动的分发优势，证明保险公司模型在扩张时仍能保持可接受的理赔表现，并以仍然有溢价的 20x 倍数退出；这会产生约 $7.0B 价值，对 Series B1 入场价约为 2.7x 结果。基准情形下，Corgi
              仍然增长良好，到 2028 年约 $200M ARR，但随着公司成熟、投资人要求看到保险公司利润率而不只是叙事，市场倍数回归到 12x；结果约为 $2.4B，略低于当前入场价值。熊市情形下，增长放缓到约 $80M
              ARR，市场按特色经纪商或承压 insurtech 的 5x ARR 给公司定价，结果约 $400M，资本损失严重。真正击穿 thesis
              的情形——准备金承压、不利监管行动，或保险公司模型失败——可能接近归零。按既定概率计算，概率加权价值约 $2.57B，基本等于 Series B1
              价格。这就是本章的核心洞见：上行空间真实存在，但预期价值已经很大程度上提前体现在今天的入场估值里。
            claimRefs:
              - CV018
              - CV019
              - CV020
              - CV021
