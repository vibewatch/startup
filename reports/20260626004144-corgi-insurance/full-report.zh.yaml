      - number: '5.5'
        title: 差异化、技术风险与合规
        blocks:
          - type: paragraph
            body: >
              Corgi 最清晰的差异化不是算法，而是结构：分析师和评论者都指向全栈保险公司模型，认为这是它能够捕获承保经济性、并以不同于经纪主导保险科技公司的方式塑造产品体验的主要原因。AI Liability
              产品提供了第二层差异化，瞄准一个新兴类别；传统保险公司在该类别常依赖除外责任、模糊措辞或人工审核。若公司能在大型在位者回应前形成可信理赔历史和定价数据，这一组合可能构成有意义的护城河。

              核心技术和监管风险同样清晰。从 2025 年 7 月 TRRG 获牌到 2026 年 1 月公开发布，Corgi
              的保险公司运营历史不足一年，长期尾部理赔证据非常有限。独立评论也强调缺少公开理赔数据、历史记录太短是真实担忧。公开技术透明度也低：没有发布模型卡、基准结果、API 文档或算法审计报告。因此外部难以评估承保 AI
              是否具备足够数据、控制和监控来避免逆选择。TRRG 结构还带来合规注脚，因为 RRG 不提供州担保基金保护；即便在 LRRA 下获得联邦授权，也可能面对逐州运营限制。
