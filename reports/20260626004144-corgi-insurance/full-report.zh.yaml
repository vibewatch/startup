              - CP036
      - number: '3.2'
        title: 直接保险科技竞争者——Vouch 和 Embroker
        blocks:
          - type: paragraph
            body: >-
              Vouch Insurance 是 Corgi 最接近的直接竞争者，服务科技、医疗和专业服务等垂直领域的 6,000+ 家公司。Vouch
              作为保险经纪公司运营，把保单放到外部承保公司，而不是用自己的资产负债表承担风险。它在 2023 年 9 月完成 $90 million Series C 融资，累计融资约 $160 million。Vouch
              的初创保险平台覆盖 CGL、D&O、Tech E&O、Cyber、EPLI 和其他核心险种，提供数字优先界面，并为复杂保障配置人工顾问。它的「Ambition Insured」品牌和贴近 YC 的客户基础，与
              Corgi 目标板块高度相似。与 Corgi 的关键结构差异在于，Vouch 依赖外部承保公司纸面：当外部承保公司退出某个险种或重新定价时，Vouch 必须重新谈判或寻找替代方案。Corgi
              的内部核保实体（TRRG）消除了这项依赖，并允许更紧的定价控制。Embroker 是一家数字经纪公司，服务 9,500+ 家企业，覆盖多个行业的 16,000+ 张保单。Embroker 成立已有十多年，2021
              年完成约 $100 million Series C 融资，并把数字报价与人工咨询层结合。Embroker 的初创保险产品覆盖与 Corgi 相似的险种，但不提供按初创阶段模块化打包的产品，也不提供 AI
              Liability。它的行业覆盖更广（并不只做初创 / 科技），削弱了产品专业化程度。Vouch 和 Embroker 都拥有 4.5 星以上顾问评分，在创始人群体中品牌认知强，是 Corgi 在 YC /
              加速器生态获客中的重要竞争者。Corgi 的 Corgi vs. Vouch 对比页主张，全栈模式能为初创专项风险提供更快出单、更灵活核保和更好经济性。
