      - number: '7.4'
        title: 合作伙伴、依赖与集中风险
        blocks:
          - type: paragraph
            body: >-
              Corgi 的市场进入和运营模型依赖少数关键节点；这些节点即便在客户需求不变时，也能改变经济性或可行性。最明显的是 TRRG
              牌照本身：保险公司实体支撑整个产品栈，任何针对该载体的监管行动都会同时影响几乎所有产品线。再保险是第二项同样重要但公开透明度更低的依赖。若交易对手削减 capacity、收紧条款或激进重定价，Corgi
              可能面对更低限额、更差利润率或更高自留风险，同时仍要服务期待速度和低保费的创业客户。分销集中又加了一层。公开证据显示 YC 是主要获客引擎；当社区信任仍在时，这是重大优势，但若 YC
              创始人情绪变化，或竞争保险公司成为首选合作伙伴，就会变成实质弱点。公司似乎还依赖未披露的云和 AI 基础设施提供商、cap-table 与工作流
              API，以及创始人中心的运营核心。对年轻保险科技公司而言，这些依赖单独看都不罕见，但组合起来很重要。Corgi
              搭建的平台在可见产品覆盖上很宽，但若干不可见承重关系很窄；尽调应把交易对手和渠道韧性视为一阶承保变量，而非背景运营细节。
