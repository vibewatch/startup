      - number: '2.5'
        title: 采用约束与市场逆风
        blocks:
          - type: paragraph
            body: >
              尽管驱动因素有利，几个结构性约束仍会限制 Corgi 的市场渗透速度和天花板。


              TRRG 结构是最重要的监管约束。风险自留集团豁免许多州保险法律，也不符合州偿付保障基金保护条件。这会限制 Corgi 服务某些买方的能力，因为他们的采购要求规定保障必须来自 admitted
              carrier，或来自 AM Best 评级体系中的 A 级承保公司。大型企业买方和受监管行业（银行、医疗、政府合同）经常在供应商保险要求中指定 admitted carrier 身份——Corgi 的 TRRG
              结构无法提供这一点。这是企业板块真实存在的市场天花板。


              Cyber 费率下降是一把双刃剑。较低费率让 Corgi 更有竞争力，但也压缩单张保单保费，需要更高量级才能维持 ARR 增长。Beinsure/Marsh 综合费率数据显示，2025 年 Q4 cyber
              费率下降 5%；它既是获客顺风，也是 cyber 险种核保利润率的逆风。


              地理集中在美国，限制了总可服务市场。Corgi 不能用于国际业务；大量在 Delaware 注册、但有国际运营的公司（尤其是非洲、欧洲和亚太初创公司在美国设立主体）无法把 Corgi 保障完整用于非美国运营。


              商业保险的转换成本低于其他金融服务产品：多数保单按年签，且可以在没有 IT 集成成本的情况下从经纪商主导的竞争者切换。这意味着留存高度依赖理赔服务质量和定价，而不是技术锁定。Corgi 声称流失率低于
              1%，这是重要的反向信号，但它由公司提出，未经独立验证。


              保险行业理赔周期长，意味着更优的核保经济性可能要 3-5 年才会被市场看见。Corgi 的承保牌照始于 2025 年 7 月；最早也要到 2027 年，赔付率才具备实质解读意义。
