      - number: '1.4'
        title: 收入牵引、客户规模与产品组合
        blocks:
          - type: paragraph
            body: >
              Corgi 的收入轨迹，是少数能独立支撑估值叙事的公开验证数据点之一。公司报告 2024 年中收入为 $1.2 million——这与尚未取得承保牌照、尚处监管批准前的阶段相符；2025 年 7
              月拿到完整承保牌照后，公司宣布到 2025 年 12 月 ARR 超过 $40 million。这意味着约 18 个月内收入增长约 33 倍；Startupsunion
              将其形容为「悬崖，而不是增长曲线」。两组数据均为公司声称，尚未经独立审计。


              支撑这项 ARR 的客户规模是：截至 2026 年 1 月公告，公司在 49 个州拥有超过 40,000 名活跃客户。公司报告流失率低于 1%，Startupsunion 据此估算单客户年均收入约
              $1,000。这个算术与已发布 ARR 方向一致：40,000 × $1,000 = $40M。客户群集中在早期、与 YC 关联的初创公司；具名客户包括
              Artisan、Eragon、Sorcerer、Intryc 和 Deel。


              产品组合采用模块化设计，并跟随初创公司的融资阶段变化。Pre-Seed 和 Seed 包包含 Commercial General Liability（CGL）、Directors and
              Officers（D&O）、Technology Errors & Omissions（Tech E&O）和 Cyber。Series A 包增加 Media Liability 和 Employment
              Practices Liability Insurance（EPLI）。Growth 阶段增加 Fiduciary Liability。专项险种包括 Hired and Non-Owned
              Auto（HNOA）、Representations and Warranties（R&W）、AI Liability、Workers Comp、BOP、Contractors Professional、Real
              Estate E&O、Lawyer E&O、Non-Profit D&O、K&R 和 Medical Malpractice。


              AI Liability 产品是一个值得注意的差异点：它明确覆盖 AI 模型错误、幻觉和偏见造成的财务损失，而传统保险公司正主动把这类风险从 E&O 保单中剔除，而不是承保。Corgi 能在 10-15
              分钟内给出报价并当天出单，这一点在多份独立客户评价和分析师评论中得到交叉印证。
