            body: >-
              CEO Nico Laqua 在 Forbes 采访中表示，Corgi 已在 2026 年 4 月盈利，也就是 $106M Series B1 交割前一个月。若按运营口径解读为综合成本率低于 100%，这对一家
              2025 年 7 月才取得全牌照的保险公司是重要里程碑。不过，该表态是口头且未经审计；保险公司的法定会计可能与 GAAP 盈利能力显著不同，准备金充足性也不会体现在月度运营利润中。尽调应验证这一说法是否与
