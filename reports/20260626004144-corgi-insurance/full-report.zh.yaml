  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 全栈保险公司平台与产品架构
        blocks:
          - type: paragraph
            body: >
              Corgi
              的产品架构始于一个结构性选择，并由此影响所有下游技术决策：它不只是搭在传统保险公司之上的经纪工作流层，而是一家全栈保险公司，通过自有运营结构完成承保、出单、保单管理和理赔管理。公开材料持续把公司定位为面向科技公司的
              AI 原生保险公司；2026 年 1 月发布公告则明确说明，Technology Risk Retention Group, Inc.（TRRG）是承保机构，Corgi Insurance Services,
              Inc. 是持牌销售主体和项目管理方。这一点重要，因为平台从报价入口到理赔都实现了纵向整合。

              产品表面也因此相当宽。Corgi 销售模块化商业保险险种，包括 CGL、D&O、Tech E&O、Cyber 这组核心创业公司组合，以及 EPLI、Media Liability、Fiduciary
              Liability、Workers Compensation、AI Liability
              等随阶段扩展的产品和其他专项险种。官网首页和产品页描述了一个自助仪表盘，创始人可随着公司成熟调整保障；直接保险公司控制权则让证书和标准险种报价无需另行经纪或前置承保机构交接即可快速签发。地域覆盖已经具备实质规模：公司披露拥有
              45 个销售牌照司法辖区，产品可覆盖 49 个州。由此形成的架构更适合理解为保险基础设施，而不是单一产品应用。
