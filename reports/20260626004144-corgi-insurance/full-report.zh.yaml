      - CU008
      - CU011
      - CU015
      - CU038
      - CU039
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 热力图按预期发生概率和影响放置 Corgi 最重要的风险。最高优先级象限是 AI 模型错误定价与监管合规复杂度的组合，因为在长期运营历史尚未形成前，这两条路径最可能伤到保险公司模型。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
        - 关键影响
      rows:
        - label: 高概率
          values:
            - YC 集中
            - 运营烧钱 / 文化
            - 监管合规复杂度
            - AI 模型错误定价（逆向选择）
        - label: 中等概率
          values:
            - VC 融资放缓
            - API 依赖故障
            - 理赔争议激增
            - AI Liability 不利发展
        - label: 低概率
          values:
            - 股权结构 API 撤销
            - SOC 2 违规
            - TRRG 牌照挑战
            - 再保险容量撤出
        - label: 极低概率
          values:
            - 创始人离职
            - 灾难性 AI 责任索赔
            - 联邦禁止 RRG 模式
            - ARR 全面重述
    claimRefs:
      - CR001
      - CR008
      - CR013
      - CR021
      - CR029
      - CR032
      - CR038
      - CR042
      - CR044
  - id: FR002
    title: 风险传导图
    type: dag
    summary: Corgi 的核心传导路径从 AI 承保错误进入损失率压力，再传导到准备金不足、监管或资本行动，最终让保险公司论点破裂。
    data:
      nodes:
        - id: ai-mispricing
          label: AI 模型错误定价
          detail: AI 驱动承保系统系统性低估 AI Liability 或 Cyber 风险价格。
        - id: loss-ratio-deterioration
          label: 损失率恶化
          detail: 赔款超过保费预期，综合成本率突破可持续水平。
        - id: reserve-inadequacy
          label: 准备金不足
          detail: TRRG 持有准备金不足，无法在索赔成熟时支付未决赔款。
        - id: regulatory-action
          label: 监管行动
          detail: NAIC 或州监管机构对 TRRG 采取纠正行动。
        - id: capital-shortfall
          label: 资本缺口
          detail: TRRG 需要额外股权以维持盈余充足。
        - id: thesis-break
          label: 论点破裂
          detail: 保险公司模型可行性被削弱，估值基础压缩。
      edges:
        - from: ai-mispricing
          to: loss-ratio-deterioration
        - from: loss-ratio-deterioration
          to: reserve-inadequacy
        - from: reserve-inadequacy
          to: regulatory-action
        - from: reserve-inadequacy
          to: capital-shortfall
        - from: regulatory-action
          to: thesis-break
        - from: capital-shortfall
          to: thesis-break
    claimRefs:
      - CR020
      - CR022
      - CR028
      - CR037
      - CR038
      - CR039
  - id: FR003
    title: 依赖图
    type: dag
    summary: Corgi 平台依赖六类关键外部关系或集中关系；TRRG 保险公司身份和创始人是最清晰的单点故障，YC 与再保险则是两个最重要的扩张依赖。
    data:
      nodes:
        - id: corgi-platform
          label: Corgi 平台
          detail: 中央 AI 原生保险平台和商业化引擎。
        - id: trrg
          label: TRRG 保险公司牌照
          detail: Technology Risk Retention Group, Inc.，承保载体。
        - id: reinsurance
          label: 再保险项目
          detail: 未披露的再保险方提供风险转移容量。
        - id: yc-network
          label: YC 网络
          detail: 主要获客渠道。
        - id: ai-infra
          label: 云端 AI 基础设施
          detail: 未披露的云服务商支撑承保栈。
        - id: founders
          label: 创始人（Laqua/Yuan）
          detail: 两人战略和运营集中。
        - id: regulators
          label: 州 / 联邦监管机构
          detail: 45+ 个司法辖区要求持续合规和牌照维护。
      edges:
        - from: corgi-platform
          to: trrg
        - from: corgi-platform
          to: reinsurance
        - from: corgi-platform
          to: yc-network
        - from: corgi-platform
          to: ai-infra
        - from: corgi-platform
          to: founders
        - from: corgi-platform
          to: regulators
    claimRefs:
      - CR029
      - CR031
      - CR032
      - CR033
      - CR034
      - CR036
  - id: FV001
    title: ARR 增长轨迹
    type: bar
    summary: Corgi 的 ARR 似乎从 2024 年中约 $1.2M 增至 2025 年 12 月的 $40M。2026 年估算是分析师给出的方向性预测，不是公司披露口径。
    data:
      items:
        - label: 2024 年中
          value: 1.2
          unit: $M ARR
          detail: 公司称上线时的 ARR。种子轮阶段。
          tone: positive
        - label: 2025 年 12 月
          value: 40
          unit: $M ARR
          detail: 公司披露 ARR；18 个月约增长 33x。
          tone: positive
        - label: 2026（分析师估算）
          value: 80
          unit: $M ARR
          detail: 分析师基于既有增长轨迹推算；公司未披露。
          tone: neutral
    claimRefs:
      - CV006
      - CV024
      - CV031
  - id: FV002
    title: 可比估值倍数
    type: bar
    summary: Corgi Series B1 的 65x ARR 倍数远高于可比公司。即便不同收入定义带来偏差，和成熟或部分可比的保险科技交易相比，差距仍然极端。
    data:
      items:
        - label: Corgi（Series B1）
          value: 65
          unit: x ARR multiple
          detail: Series B1 投后估值 $2.6B / $40M ARR。
          tone: warning
        - label: Corgi（Series B）
          value: 32.5
          unit: x ARR multiple
          detail: Series B 投后估值 $1.3B / $40M ARR。
          tone: neutral
        - label: Coalition（2022）
          value: 10
          unit: x GWP multiple
          detail: Coalition Series F 轮估值 $5B / GWP 约 $500M。
          tone: neutral
        - label: Next Insurance（2025）
          value: 8.7
          unit: x GWP multiple
          detail: ERGO 以约 $2.6B 收购 / GWP 约 $300M。
          tone: neutral
        - label: Vouch/Embroker（估算）
          value: 3
          unit: x ARR/revenue (est)
          detail: MGA 模式保险科技公司的估算收入倍数。
          tone: neutral
    claimRefs:
      - CV001
      - CV002
      - CV011
      - CV012
      - CV036
      - CV041
  - id: FV003
    title: 情景价值区间
    type: range
    summary: 情景区间显示，当前入场价格已经接近概率加权后的中位数。上行仍有空间，但中位回报的大部分已经被定价。
    data:
      items:
        - label: 乐观（25%）
          low: 5
          mid: 7
          high: 9
          unit: $B enterprise value
          detail: $350M ARR × 20x 终局倍数。
          tone: positive
        - label: 基准（50%）
          low: 1.8
          mid: 2.4
          high: 3
          unit: $B enterprise value
          detail: $200M ARR × 12x 重估倍数。
          tone: neutral
        - label: 悲观（20%）
          low: 0.1
          mid: 0.4
          high: 0.7
          unit: $B enterprise value
          detail: $80M ARR × 5x 经纪商级倍数。
          tone: negative
        - label: 投资逻辑失效（5%）
          low: 0
          mid: 0
          high: 0.1
          unit: $B enterprise value
          detail: TRRG 遭监管行动或准备金不足；股权价值接近零。
          tone: negative
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
  - id: FV004
    title: 投资决策逻辑
    type: flow
    summary: 估值判断从当下偏高的入场价格出发，经由价值创造驱动因素和风险因素，落到不同情景结果，最终给出有条件的推荐，而不是无条件买入。
    data:
      nodes:
        - id: entry
          label: 以 $2.6B 入场（65x ARR）
          detail: Series B1 投后估值。价格已经押注执行兑现。
        - id: drivers
          label: 价值创造驱动因素
          detail: ARR 增长（3x+）、承保载体经济性、AI 差异化、市场扩张。
        - id: risks
          label: 风险清单
          detail: RRG 监管风险、AI 损失发展、YC 客户集中、关键人物风险。
        - id: scenarios
          label: 情景结果
          detail: 乐观 $7B / 基准 $2.4B / 悲观 $0.4B / 投资逻辑失效 $0。
        - id: recommendation
          label: 有条件看多逻辑
          detail: 只有 ARR 保持 3x+ 增长，且 TRRG 年报确认准备金充足，才足以支撑信心。
      edges:
        - from: entry
          to: drivers
        - from: entry
          to: risks
        - from: drivers
          to: scenarios
        - from: risks
          to: scenarios
        - from: scenarios
          to: recommendation
    claimRefs:
      - CV022
      - CV024
      - CV028
      - CV037
  - id: FV005
    title: 关键绩效指标
    type: kpi
    summary: 五项公开 KPI 概括了 Corgi 的增长和估值状态。它们有方向性参考价值，但大多来自管理层披露，而非独立审计。
    data:
      items:
        - label: ARR（2025 年 12 月）
          value: $40M
          tone: positive
          detail: 公司披露；较 2024 年中约增长 33x。未经独立审计。
        - label: 客户数（2026 年 1 月）
          value: 40,000+
          tone: positive
          detail: 公司披露；意味着单客户平均年保费约 $1,000。
        - label: 流失率（公司披露）
          value: <1%
          tone: neutral
          detail: 管理层口径；没有独立验证。若属实则表现很强。
        - label: Series B1 估值
          value: $2.6B
          tone: positive
          detail: 2026 年 5 月 28 日投后估值。ARR 倍数 65x。较 22 天前的 Series B 上调 2x。
        - label: 累计融资额
          value: $378M
          tone: neutral
          detail: 截至最新一轮的累计资本。承保载体资本要求仍然不低。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV035
