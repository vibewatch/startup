      - number: '3.6'
        title: 护城河、锁定与竞争风险评估
        blocks:
          - type: paragraph
            body: >-
              Corgi 的竞争韧性建立在几类护城河上，但强度不同。全栈承保结构具备中等韧性：Corgi 花费约 $35 million 收购持牌承保公司并取得 TRRG
              授权，这给资金不足的保险科技公司设置了有意义的资本门槛。不过，既有公司（Chubb、Hartford）已经拥有完整承保牌照，只需要开发分销和 AI 工具。Vouch 或 Embroker
              理论上也可以选择收购承保实体来复制 Corgi 模式。AI 原生核保护城河风险较高：随着大语言模型商品化为基础设施，竞争者可以在没有专有训练数据的情况下，以可比成本复制 AI 核保。Coalition 和
              Cowbell 已经把 AI 用于 cyber 定价。YC 网络分销渠道给了强早发优势，但并不独占——任何保险公司都可以与 YC 合作，或在加速器生态中培育存在感。Corgi 的 AI Liability
              产品是近期最可防守的护城河：没有竞争者公开提供独立 AI Liability 保单，Corgi 从 AI
              公司投保人积累的理赔经验，会在竞争者进入前形成精算数据。商业保险的客户转换成本中等：保单按年，保险证明可转移，broker-of-record
              变更也很常见。不过，与股权表平台的集成、律所推荐和云市场上架，形成了嵌入式分销，提高了板块层面的有效转换成本。风险侧，短期最尖锐的竞争威胁是成熟 cyber 保险公司（Coalition、Chubb）给现有
              cyber 保单加上 AI rider，在 Corgi 于 AI 公司投保人中形成实质规模之前削弱其 AI Liability 独立价值。TRRG 结构还意味着 Corgi
              无法使用州偿付保障基金；风险厌恶型买方把它与承保公司背书的替代方案比较时，这可能让 Corgi 处于劣势。
