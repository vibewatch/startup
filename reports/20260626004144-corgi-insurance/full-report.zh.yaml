  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              2026 年的初创商业保险市场由三类竞争者争夺。第一类是直接保险科技同行，主要是 Vouch 和
              Embroker；它们为初创买方搭建数字经纪平台，提供顺畅报价和按初创阶段设计的产品，但依赖外部承保公司核保。第二类是专业或垂直保险科技公司，在单一垂直或单一险种中建立位置：Coalition 以 Active
              Insurance 模式主导网络保险，Cover Whale 把 AI 用在卡车车队风险，Pie Insurance 聚焦 Workers Compensation，Cowbell Cyber 为 SMB 提供
              AI 驱动的 cyber 定价。第三类是既有承保公司——Chubb、The Hartford 和 Progressive
              Commercial——它们控制更广义商业保险市场，持有完整承保牌照，也在扩张数字能力，但并不专门按风投支持科技公司分层。Corgi
              处在全栈承保公司和保险科技交叉点：它拥有自己的核保实体（TRRG），以承保公司而非经纪商身份赚取利润，并把 AI 原生工具用到整个保单生命周期。截至 2026
              年中，还没有其他玩家在同一平台上同时组合初创阶段模块化保障、即时出单、AI Liability 和全栈承保经济性。竞争地图变化很快：Next Insurance 于 2025 年被 ERGO/Munich Re
              以约 $2.6 billion 收购，说明大型既有承保公司愿意为 AI-forward 分销能力和 SMB 板块规模付费。随着既有公司投资数字化转型、直接保险科技公司成熟核保能力，Corgi
              的承保利润和保险科技速度双重优势将接受检验。
            claimRefs: []
