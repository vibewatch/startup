      - number: '4.4'
        title: 融资历史与资本充足性
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 5 月，Corgi 已累计融资 $378 million，主要包括三轮：合并的 $108 million Seed 和 Series A（2026 年 1 月宣布）、估值 $1.3
              billion 的 $160 million Series B（2026 年 5 月 6 日），以及估值 $2.6 billion 的 $106 million Series B1（2026 年 5 月 28
              日），均由 TCV 领投。$106 million Series B1 在 $160 million Series B 后三周完成——融资节奏异常压缩，22 天内估值翻倍。CEO Nico Laqua 在
              2026 年 5 月 Forbes 采访中表示，公司已在 2026 年 4 月盈利（Series B1 交割前一个月），因此这轮融资更偏增长驱动，而不是生存驱动。作为全栈保险公司，Corgi 的资本要求高于
              insurtech 经纪商：按照风险自留集团监管要求，TRRG 必须相对于净签单保费维持足够盈余（资本储备）。为收购保险公司实体支付的约 $35 million
              是沉没成本；持续资本充足性取决于保费账簿相对盈余的增长速度。在 $40M+ ARR 且快速增长的情况下，将资本配置给保险公司盈余而非运营费用，可能解释了大额融资规模。公司未披露手头现金、月度 burn rate
              或 runway。鉴于 CEO 关于 2026 年 4 月盈利的说法，运营层面的 burn 可能接近零或为正，不过保险公司盈余要求可能另行消耗资本。Series B1 条款中「由 TCV 领投」且有 15+
              家共同投资方，说明此轮融资部分可能由当前增长轨迹下的强劲投资者需求供给驱动，而不是急迫资本需求驱动。
