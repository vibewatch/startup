      - number: '5.3'
        title: 产品线组合与按阶段打包
        blocks:
          - type: paragraph
            body: >
              对一家早期保险公司而言，Corgi 的组合刻意做得很宽，因为公司销售的不是单一保单类型，而是创业公司生命周期保险系统。产品页和首页合起来显示超过十五条产品线；按公开引用，具名产品接近十九个。核心险种包括
              Cyber、D&O、Tech E&O 和 General Liability；相邻险种包括 EPLI、Fiduciary、Media Liability、Workers
              Compensation、HNOA、Commercial Umbrella、R&W 和 AI Liability。Lawyer E&O、Real Estate E&O、Non-Profit
              D&O、K&R、Medical Malpractice、Crime 和 BOP 等专项扩展进一步拓宽覆盖地图。

              打包方式围绕创业公司里程碑，而不是传统保险分类法。Pre-Seed 套餐以 CGL、D&O、Tech E&O 和 Cyber 支撑首次合同和首次租约准备。Series A 在企业尽调、招聘和公开沟通风险上升时加入
              Media Liability 和 EPLI。Growth 阶段在员工福利计划出现后加入 Fiduciary Liability。Custom 路径则为风险画像特殊的公司保留模块化。AI Liability
              是最突出的战略产品，因为它明确瞄准传统保单常常排除或表述模糊的幻觉、偏见和训练数据争议风险。伴随 Series B 宣布的 trucking 扩张也显示 Corgi
              在软件创业公司之外测试相邻市场，不过该垂直的成熟度和验证程度似乎早于核心创业公司组合。
