      - number: '6.4'
        title: 留存、流失与耐久性信号
        blocks:
          - type: paragraph
            body: >
              留存是客户故事中明显更未经证实的部分。Corgi 称年客户流失率低于
              1%；对于一个以早期创业公司为中心的组合而言，这会非常突出，因为该细分天然经历公司关闭、转型和融资波动。方向上，低流失率并非不可信：如果许多客户买保险是为了满足反复出现的合同需求，只要仍在运营，就会持续续保。但公开证据不足以把该数字视为已验证。公司未披露
              NRR、GRR、续保率序列、满意度 scorecard 或 cohort 表。最早可观察保险公司 cohort 也只追溯到 2025 年 Q3，截至运行日期最多只有三到四个季度的公开留存历史。

              这种不成熟有两面。积极一面是，在审阅的来源集中，没有公开证据显示大范围取消、理赔处理爆雷或明显续保争议。Intryc
              等客户轶事显示，至少部分账户在绑定后获得高触达体验，这能支持续保。消极一面是，该组合尚未经历长理赔发展周期、大范围创业公司下行潮，或多年重定价环境的检验。因此，低于 1%
              的流失率应被视为早期信号，而不是成熟保险账簿的耐久性指标。
