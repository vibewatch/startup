      - number: '7.3'
        title: 财务与精算模型风险
        blocks:
          - type: paragraph
            body: >-
              Corgi
              的财务风险是结构性的：一旦公司选择全栈保险公司模型，就接受了经纪主导创业公司无需承担的准备金、盈余和风险转移义务。承保有效时，这很有吸引力，因为经济性和产品控制都会改善；但若损失发展意外恶化、再保险方收缩，或保费增长跑赢法定资本，就会非常无情。公开来源未披露
              TRRG 的准备金方法、盈余 /
              保费比率、综合成本率或再保险附着点，因此外部观察者无法验证资本充足性是保守、刚够，还是偏薄。公司已融资大量股权，管理层也声称盈利，但这些主张的财务质量以及当前估值的耐久性，都取决于公开资料中仍未经审计的数字。最新产品线带来更多不确定性。AI
              Liability 本质上是先发精算实验，trucking
              扩张则引入与软件中心化创业公司责任险截然不同的理赔严重度和频率画像。若任一领域出现不利发展，风险会快速传导：赔付率恶化压迫准备金，准备金压力引来监管审视，两者都可能迫使追加融资或估值大幅重置。因此，公开记录支持对需求保持乐观，但不能让人确信保险公司模型已经过经济压力测试。
