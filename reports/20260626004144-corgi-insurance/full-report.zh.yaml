    rows:
      - - 经审计或法定财务报表
        - 没有经审计数据，无法核实 ARR、赔付率或盈利说法
        - 从资料室要求提供经审计 GAAP 财务报表或 TRRG 的 NAIC 法定报表
      - - 按险种赔付率和综合成本率
        - 无法评估核保质量、定价准确性或准备金充足性
        - 要求提供 TRRG Schedule P（赔付发展三角）和当前综合成本率
      - - 客户获取成本（CAC）和回本期
        - 无法评估增长资本效率或 YC 渠道优势的持久性
        - 向销售 / 财务团队要求按渠道拆分 CAC；用人员数据交叉核对
      - - 毛利率
        - 无法建模盈利路径，或与 SaaS / 保险科技基准对比
        - 可由综合成本率 + 费用率披露推导；要求提供法定 P&L
      - - 再保险条款和交易对手
        - 无法评估灾难性损失敞口或承保方资本要求
        - 要求提供再保险合约条款、自留水平和交易对手名称
      - - D&O 和 Cyber 准备金充足性
        - 长尾险种可能掩盖正在形成的损失；准备金不足会抬高盈利
        - 要求提供最近季度 D&O 和 Cyber 精算准备金证明
      - - 净收入留存（NRR）和分群扩张
        - 无法评估追加销售轨迹或 ARPC 是否在增长
        - 要求提供按分群年份拆分的 NRR，以及 2024 vs 2025 分群的 ARPC 扩张数据
    notes: 上述项目都是保险承保方机构尽调的标准要求。许多指标对私营风险自留集团并无公开披露要求，但在投资级资料室中属于标准材料。缺少公开披露符合预期，本身并非负面信号。
