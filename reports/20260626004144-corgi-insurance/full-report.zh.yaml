  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与保费流
        blocks:
          - type: paragraph
            body: >-
              Corgi 的收入模型和保险科技经纪商在结构上不同，因为 Corgi 作为全栈承保机构，留下承保利润。客户缴纳保费后，保费流向 Corgi 的承保实体 Technology Risk Retention
              Group, Inc.（TRRG）。扣除赔付、再保险成本和运营费用后，净承保结果归 Corgi 集团，而不是外部保险公司。在综合成本率实现盈利时，这种保险公司经济模型让 Corgi
              能在已赚保费与已发生损失加运营费用之间赚取价差，经纪商无法复制。主要收入来自保险保费，产品组合覆盖 CGL、D&O、Tech E&O、Cyber、EPLI、AI
              Liability、Fiduciary、Workers Compensation、BOP、Commercial Umbrella，以及 Real Estate E&O、Lawyer E&O、Non-Profit
              D&O 等专项险种。产品按年度保单定价，绑定时依据 AI 原生承保对风险因素评估后确定保费，包括公司阶段、收入、员工数、产品类型和司法辖区。Corgi 面向创业阶段的模块化打包形成自然追加销售路径：一家
              pre-seed 公司每年花 $500–$2,000 购买 CGL 和 Tech E&O，完成 Series A 融资后，可能升级为 $10,000–$25,000 的 D&O 和全套组合客户。公司披露截至
              2025 年 12 月 ARR 超过 $40M、活跃客户超过 40,000，意味着平均每客户收入（ARPC）约为每年 $1,000。保险公司模型的毛利率关键取决于赔付率和费用率（即综合成本率），Corgi
              尚未公开披露。从 2024 年中约 $1.2M 收入增长到 15 个月后的 $40M+ ARR，约为 33 倍增长——这一轨迹符合其在 YC 生态中快速渗透市场的表现。
