      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >
              Corgi
              的核心买方，是负责完成融资、签下企业合同或满足房东要求的创始人或早期员工——这些时刻，保险从可选采购变成会卡住交易的约束。这个购买触发点很重要：它制造紧迫感，也降低价格弹性，因为延误的机会成本（交易被卡、融资受威胁）比保费高出几个数量级。


              Corgi 发布的初创公司保险成本指南按融资阶段划分了三个买方群体，各自有不同保障要求和预算画像。Pre-Seed 和 Seed 阶段买方通常每年在核心 CGL + Tech E&O + Cyber 组合上花
              $2,000-$4,000。Series A 买方因董事会构成和企业签约必须配置 D&O 和 EPLI，年支出提高到 $10,000-$25,000+。Growth 阶段买方（Series B+）每年花
              $30,000-$100,000+，需要 Fiduciary、更高限额 umbrella 和专项险种。


              付款方通常是公司，而不是创始人个人。早期阶段预算负责人是 CEO 或 CFO；到 Growth
              阶段，则由采购或风险管理角色参与。渠道伙伴——VC、律所、股权表平台——在采用路径中作用很大，因为它们会在紧迫性最高的节点引入保险要求：签署 term sheet、董事加入或谈判企业合同。这让 Corgi 通过
              YC 生态集成获得结构性优势。


              AI 公司子板块是一类正在出现的买方，需求明显不同。开发 AI 产品的公司会因模型错误、幻觉和偏见承担独特责任敞口，而传统 Tech E&O 保单越来越多地剔除这些风险。Corgi 的 AI Liability
              产品直接瞄准这类买方。Inszone 卡车市场数据和 Amwins 运输展望确认，卡车是 Corgi 正在主动进入的第二个买方板块。
