chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、运营模式与承保结构
        blocks:
          - type: paragraph
            body: >
              Corgi Insurance 是一家全栈保险承保公司，总部位于加州旧金山 Claude Lane 9 号。公司向风投支持的初创公司和科技公司直接销售商业保险产品，同时承担核保方和项目管理方角色，不依赖经纪中介或
              fronting carrier。这种全栈模式，是它区别于 Vouch、Embroker 等经纪商主导保险科技竞争者的最关键结构差异。


              Corgi 的法律和监管结构把责任分给两个实体。保单由 Technology Risk Retention Group, Inc.（TRRG）承保；TRRG 是一家按 Liability Risk
              Retention Act（15 U.S.C. §3901 et seq.）组建的风险自留集团，也是承担风险的实体。Corgi Insurance Services, Inc.
              是另一家持牌保险生产者（California License #6012791），担任项目管理方并负责分销。生产者实体在美国 45 个司法辖区持有牌照，产品覆盖 49 个州。


              TRRG 结构带来一个关键监管 caveat：作为风险自留集团，TRRG 不受所有州保险法律法规约束；风险自留集团签发的保单也明确不能使用州保险破产偿付保障基金。Corgi
              自己的免责声明页面披露了这一点。无论潜在投保人评估承保主体稳健性，还是投资人判断全栈模式的可靠性，这都是实质性因素。


              公司把使命表述为从零重建 $1T+ 的全球保险业，并把自己定位为未来一百年的金融基础设施，而不是在现有经纪商主导分销上做渐进改良。Corgi 运营直接数字平台，创始人可在核心险种上用不到 15
              分钟拿到已出单保单，把传统经纪商通常需要数天甚至数周的流程压缩到分钟级。
