  - id: FU004
    title: 客户证据质量矩阵
    type: matrix
    layout: wide
    summary: 可见客户证据几乎全部由公司筛选发布；在给定来源集中，只有 Deel 有实质性的第三方佐证。
    approximationNotes: 矩阵按来源出处和客户故事具体程度，对独立性和业务影响作定性评分。
    data:
      columns:
        - 证据类型
        - 来源独立性
        - 新鲜度
        - 业务影响
        - 尽调需求
      rows:
        - label: Artisan（AI BDR）
          values:
            - 具名案例研究
            - 公司筛选发布
            - 当前
            - 合同签署（企业银行）
            - 独立验证
        - label: Eragon（企业 SaaS）
          values:
            - 具名案例研究
            - 公司筛选发布
            - 当前
            - 合同签署（数天 vs 数周）
            - 独立验证
        - label: Sorcerer（气候科技）
          values:
            - 具名案例研究
            - 公司筛选发布
            - 当前
            - 续保时定制保障
            - 需要损失率数据
        - label: Intryc（软件开发）
          values:
            - 具名案例研究（CEO 引述）
            - 公司筛选发布
            - 当前
            - 即时绑定和创始人参与
            - 独立验证
        - label: Deel（AI 薪资）
          values:
            - 第三方提及
            - TechCrunch（独立）
            - 当前
            - 高知名度具名客户
            - 确认保障范围
    claimRefs:
