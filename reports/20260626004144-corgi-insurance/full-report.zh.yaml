      - number: '1.3'
        title: 融资历史与估值演进
        blocks:
          - type: paragraph
            body: >
              Corgi 的资本轨迹是近年保险科技领域最快的一类。公司在 2026 年 1 月至 5 月约五个月内完成三次独立融资，每次估值都大幅上台阶。


              2026 年 1 月，Corgi 宣布合并 Seed 和 Series A 融资，合计 $108 million，估值 $630 million。该轮由 Kindred Ventures 领投，Y
              Combinator、Contrary、Oliver Jung、Glade Brook Capital Partners、Seven Stars、Leblon Capital、Phosphor
              Capital、Fellows Fund、Alumni Ventures、Quadri Ventures、Vocal Ventures 和 SV Angel
              参投。公告发布时，公司同步披露已获准作为全栈承保公司运营，也是公司首次公开亮相；Nubia Magazine 称此前有一段 18 个月监管流程，并涉及以约 $35M 收购一家已有数十年历史的持牌承保公司。


              2026 年 5 月 6 日，Corgi 完成 $160 million Series B 融资，估值 $1.3 billion，由 TCV 领投，Oliver Jung、Leblon
              Capital、Kindred Ventures、Repeat VC、Zone 2 Ventures、Audeo Ventures、Quadri Ventures、First Order Fund、Vocal
              Ventures、Maiora Ventures、Nordstar、Seven Stars Ventures、Hexa Capital、Alpha Square
              Group、GSBackers、OurCrowd、Alumni Ventures 和 Global Growth Fund 参投。至此，公司累计融资超过 $268 million。


              仅 22 天后的 2026 年 5 月 28 日，Corgi 又宣布以 $2.6 billion 估值完成 $106 million Series B1 融资，仍由 TCV 领投，Prime
              Capital、Zone 2 Ventures、Oliver Jung、Leblon Capital、Kindred Ventures、Quadri Ventures、First Order Fund、Vocal
              Ventures、Nordstar、GSBackers、Repeat Ventures 和 8188 Capital 参投。累计融资达到 $378 million。CEO Nico Laqua 表示，公司在
              2026 年 4 月（即前一个月）已实现盈利。三周内估值从 $1.3B 翻倍到 $2.6B，是一个异常数据点；后续章节需要从可持续性和市场可比公司语境检验它。
