      - number: '8.5'
        title: 风险调整后回报、价值创造杠杆与建议
        blocks:
          - type: paragraph
            body: >-
              投资建议的关键，不在于 Corgi 是否令人印象深刻——它显然是——而在于新投资人是否因保险公司模型中仍未解决的风险得到足够补偿。最重要的价值驱动因素已经可见：ARR 快速增长、与创业公司市场强匹配、看似有效的
              YC 获客飞轮、广泛的牌照推进，以及围绕 AI 承保和 AI Liability
              的产品叙事，投资人将其视为品类定义级机会。故事中若干部分已经部分去风险，尤其是品牌、投资人质量和真实需求的存在。尚未去风险的是承保引擎本身。没有公开的综合成本率、准备金方法、再保险安排或精算发展数据，市场等于被要求把软件式倍数套在保险式风险上。只有当投资人能通过尽调材料验证下行保护，且仓位大小反映不对称性时，这个赌注才可操作。在
              $2.6B 估值下，风险调整后回报不支持过大仓位。更合理的是选择性、基于信念入场，并按损失承受能力控制规模，同时围绕 ARR
              增长、法定盈余、险种级赔付率，以及任何渠道集中或理赔恶化信号设置明确监测触发点。正确姿态是有条件正面：若私有尽调确认保险公司经济性，可以作为受监控仓位进入；但仅凭公开证据，它不是一个有宽厚安全边际的投资。
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV037
              - CV041
              - CV044
