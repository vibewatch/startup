      - number: '8.3'
        title: 投资人隐含估值与轮次背景
        blocks:
          - type: paragraph
            body: >-
              投资人行为是估值故事的核心部分，因为最新价格不只是抽象的分析师估算，而是成熟投资人在 2026 年同意出资的价格。Corgi 早期融资路径似乎经过 Kindred Ventures 和 Y
              Combinator，这与公司面向创业公司的分发和产品取向相符。随后，公司进入成长阶段，由 TCV 领投 Series B 和 Series B1。公开来源显示累计融资约 $378M，其中 Series B
              单轮贡献 $160M，Series B1 隐含投后估值 $2.6B。按公司自称 $40M ARR 计算，业务定价为 65x ARR；此前 $1.3B 的 Series B 隐含 32.5x
              ARR。这个跃升太快，轮次序列本身就成了尽调议题。它可能反映投资人对 AI 原生全栈保险公司的需求异常强劲，可能反映他们相信 Corgi
              能像软件公司一样扩张、同时掌握承保经济性，也可能是稀缺资产引发的竞争性轮次动态。它也可能意味着，后轮投资人在准备金、再保险和险种级盈利数据可得之前，就已经为动能和叙事付费。对估值而言，融资历史同时告诉投资人两件事：第一，高质量资本已经验证了公司；第二，这种验证已经被计入入场价格，留给执行偏差的空间很小。因此，TVPI
              和 DPI 语境仍然很早，也大多停留在账面：基金管理人可以按这个价格快速上调账面价值，但实际回报要看后续 IPO 或 M&A 能否支撑同样的乐观预期。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV017
              - CV033
              - CV040
              - CV042
          - type: table
            tableRef: TV003
