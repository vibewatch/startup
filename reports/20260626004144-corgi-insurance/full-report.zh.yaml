              - CV035
      - number: '8.6'
        title: 图表附录
        blocks:
          - type: callout
            title: 65x ARR 下，Corgi 必须完美执行，才能让 Series B1 入场资本回本
            body: >-
              2026 年 5 月 Series B1 价格几乎不给普通执行偏差留空间。按公司自称 ARR 约 65x 计算，投资人承保的不只是持续增长，还包括 Corgi
              必须迅速证明：全栈保险公司模型在切入新产品和新地区时，仍能守住有吸引力的赔付率。概率加权情景模型几乎正好落在 $2.6B
              入场价值上，也就是说，下行情景不只是压低上行空间，而是会快速抹掉资本。因此，最新轮更应被理解为高信念、低安全边际的入场，而不是显然便宜的成长资产。
            calloutType: risk
            claimRefs:
              - CV001
              - CV003
              - CV022
          - type: callout
            title: Next Insurance 可比项有启发，但也会误导——Corgi 的定价押注的是 Next 在相同成熟度时从未达到过的未来
            body: >-
              最醒目的可比项是 ERGO 以约 $2.6B 收购 Next Insurance，因为它与 Corgi 当前头部估值相同。但这个比较更多是在抬高 Corgi，而不是验证 Corgi。Next
              达到这一价格时，运营记录更长、保费基数明显更大；同时，Coalition 和更广行业基准仍暗示远低于 Corgi 65x ARR 框架的估值倍数。教训不是 Corgi
              天然估值错误，而是投资人今天买的是一个未来状态：规模、承保质量和退出可选性，而这些同业用了更长时间才挣到。
            calloutType: insight
            claimRefs:
              - CV011
              - CV012
              - CV036
          - type: callout
            title: 有条件正面的 thesis 仍然成立：保险公司经济性在结构上可行，但需要 2+ 年综合成本率证据验证
            body: >-
              即便入场倍数被拉得很高，Corgi 仍然可投资，理由来自结构而不是证据：如果一家全栈 AI 原生保险公司真的能低成本获客、承保做得好、准备金保守，它就可能比经纪驱动的 insurtech
              同业更值钱。投资人还缺的是证明。因此，纪律严明的买方应把 thesis 视为有条件成立：需要法定报表、再保险安排，以及至少多年险种级理赔记录，证明综合成本率低于
              100%、准备金发展充足。在证据出现之前，当前估值是一笔前瞻押注，而不是既成事实。
            calloutType: insight
            claimRefs:
              - CV037
              - CV044
              - CV028
