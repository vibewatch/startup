              而言，这一速度也不寻常，反映投资者对当前增长轨迹的强烈需求。风险在于，这种倍数扩张嵌入了对增长延续、利润率改善和市场扩张的假设，而这些假设未必兑现。若 ARR 增速放缓、赔付率恶化，或 AI Liability
