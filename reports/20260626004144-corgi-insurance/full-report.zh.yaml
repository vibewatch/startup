  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Corgi 最重要的法律和监管风险来自这样一个事实：承保实体是根据 Liability Risk Retention Act
              运营的风险自留集团，而不是传统认可保险公司结构。该结构有利于速度和全国覆盖，因为它允许跨州承保责任险，并减少逐州摩擦；但它也把有意义的风险转移给客户。TRRG
              的投保人拿不到标准认可保险公司通常提供的破产担保基金保护，这意味着保险公司的信用风险远比品牌包装或获客速度重要。Corgi 的 California producer
              license、广泛司法辖区覆盖，以及未发现已知执法行动，都是建设性信号，但无法改变保险公司牌照直到 2025 年 7 月才激活、因此公开运营历史不足一年的事实。公司的 AI 原生定位进一步抬高监管风险。AI
              承保和 AI Liability 覆盖处在不断演变的法律边界中，受到 FTC
              隐私预期、联邦层面对自动化决策系统的更广泛关切，以及监管方未来可能要求更多可解释性、不利结果监控或模型治理披露的影响。公开证据因此支持这样一个判断：Corgi
              今天在法律上可以运营，但残余暴露仍高，因为其法律结构有意向投保人提供更少兜底，且未来规则制定可能迫使控制升级或产品范围收窄。
