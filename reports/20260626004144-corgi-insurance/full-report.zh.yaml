            title: 保险公司运营不足 12 个月即达到 40,000 客户，是异常强的牵引力
            body: >-
              如果 Corgi 报告的数据方向准确，公司作为一家新持牌创业保险公司，已经实现异常快速的客户采用。40,000+ 活跃客户、$40M+ ARR 和约 $1,000
              平均客户年收入的组合，说明其面向创业公司合规时点，拥有高度高效、高量的分销引擎。主要保留点是，三项数字仍由管理层报告，而非外部审计。
