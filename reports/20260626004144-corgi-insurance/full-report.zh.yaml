      - number: '6.3'
        title: 具名客户证明与案例研究
        blocks:
          - type: paragraph
            body: >
              Corgi 最强的客户证明资产是具名案例研究，这些案例反复把产品描述为创始人面对阻断性保险要求时的速度和适配解决方案。Artisan 是最清晰的经济证明点：公司称其从传统经纪商切换而来，节省约
              30%，并在两天内完成绑定，从而满足与银行相关的企业要求。Eragon 的案例聚焦采购速度，创始人描述了从多周保险清单问题到数天成交的转变。Sorcerer
              展示了投资判断的另一面：并非每家创业公司都适合通用软件承保，硬件相关或气候相邻业务可能更看重愿意定制保障、而不是强塞标准模板的保险公司。Intryc 和 Imagine AI
              则强化上手速度信息，包括近乎即时的报价、数字文档和面向创始人的支持体验。

              局限不在于缺少具名客户标识，而在于证据独立性。几乎所有一手客户证明都来自 Corgi 自己策划的客户页面，由公司选择引语、案例和叙事框架。提供来源集中唯一更独立的具名客户佐证，是 TechCrunch 提到
              Deel 为客户。这有帮助，因为 Deel
              是可信且可识别的企业软件客户标识，但文章没有详述保单范围、保费规模或续保历史。总体看，案例研究在产品市场匹配方向上有说服力，但还达不到后期尽调理想要求的独立、组合层客户验证。
