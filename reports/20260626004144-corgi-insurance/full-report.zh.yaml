      - number: '6.2'
        title: 采用轨迹与增长指标
        blocks:
          - type: paragraph
            body: >
              头部采用数据很醒目：Corgi 在 2026 年 1 月发布材料中报告 40,000+ 活跃客户和 $40M+ ARR，距离 TRRG
              成为运营中保险公司只有数月。若按表面值看，这意味着创业公司保险史上最快的早期客户爬坡之一。支撑性计算至少方向一致。用 $40M ARR 除以 40,000 客户，得到平均每客户收入约每年
              $1,000，符合公司围绕早期创业公司购买基础商业保险组合的定位，而不是大型、数百万美元企业方案。围绕 1 月融资和 5 月后续融资的公开报道，也支持 Corgi 在 2025
              年快速扩张，而非只在发布时扩张的叙事。

              不过，证据质量仍然混合。客户数、ARR
              和流失率指标均为公司口径，通过新闻材料露出，而非经审计申报或贷方级尽调资料室。没有公开来源独立验证「客户」指唯一企业、唯一已绑定保单，还是包含每家公司多张保单的更宽账户定义。同样，公司未披露 ARR、cohort
              留存或绑定转化的第三方审计。因此，增长故事可信且内部一致，但投资者应把它视为管理层报告的牵引力，而非已完全验证的运营数据集。
