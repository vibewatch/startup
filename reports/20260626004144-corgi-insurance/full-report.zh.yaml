      - number: '7.2'
        title: 运营与技术风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Corgi 要求市场信任一家非常年轻的保险公司，让它用 AI 占比很重的工作流和很少的公开理赔历史，承保并服务复杂责任险产品。小而干净的早期 cohort
              中，这一组合可管理；随着保单量、产品宽度和损失复杂度上升，难度会加大。公司未公开披露赔付率、综合成本率、理赔争议指标、uptime、安全认证或事故历史，投资者和投保人只能从增长推断成熟度，而不是从保险业通常真正重要的运营指标判断。D&O
              和 Cyber 等长尾险种风险尤其突出，因为理赔可能在承保决策作出多年后才浮现；AI Liability 也类似，其底层风险集合足够新颖，尚无持久精算历史。人员风险进一步放大运营问题。相对 40,000+ 客户和
              15+ 产品足迹，Corgi 约 70 名员工显得精简；创始人集中度极高，因为 Nico Laqua 同时承担 CEO 和 CTO
              职责，且双创始人团队似乎同时扛着战略、产品、融资和文化。公开评论描述七天工作制和住在办公室式强度，这些本身不致命，但提出了可信的留任和过劳担忧。运营结论是，Corgi 可能很高效，但高效和韧性还不是一回事。
