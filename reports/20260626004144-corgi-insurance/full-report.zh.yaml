      - number: '4.6'
        title: 财务缺口与尽调结论
        blocks:
          - type: paragraph
            body: >-
              按投资级尽调标准，Corgi
              的财务图景实质上不完整。最关键的缺失指标包括：赔付率和综合成本率（保险公司的根本健康指标）、毛利率（对保险公司而言，即扣除再保险后的赔付率反面）、按产品线拆分的理赔频率和严重度数据、D&O 和 Cyber
              准备金充足性（考虑多年发展尾部）、经审计财务报表或任何 GAAP / 法定财务报表、现金头寸和 burn rate，以及 CAC 和回本周期。其中若干指标可能只有在完整尽调资料室和 NDA
              下才能获得。积极信号包括 ARR 快速增长（约 15 个月从 $1.2M 到 $40M+）、CEO 关于 2026 年 4 月盈利的说法、低于 1% 的流失率（公司口径）、2025 年 7
              月取得全保险公司牌照、来自机构投资者的 $378M 总融资，以及连续三轮融资确认估值（市场验证）。风险信号包括：估值倍数快速扩张（约 5 个月从 $630M 到
              $2.6B）、未经审计的财务主张、客户获取集中（YC 生态）、缺少任何公开损失经验数据，以及 TRRG 结构在风险厌恶买方群体中相对标准持牌保险公司的潜在劣势。总体财务结论是，Corgi
              展现了异常出色的收入增长和有前景的牵引力，但在形成高置信度财务判断前，必须完整审阅尽调资料室中的法定财务、准备金充足性、损失发展三角和 CAC 数据。
            claimRefs: []
