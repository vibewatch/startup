  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、定义与背景
        blocks:
          - type: paragraph
            body: >
              Corgi 的相关市场有三层嵌套。最宽一层是全球财产与意外险（P&C）行业，按总保费计是 $1T+ 市场；这一数字来自 Corgi 自己的关于页面，并得到 Federal Insurance
              Office（FIO）2025 Annual Report 佐证，该报告把美国 P&C 板块列为全球最大市场之一。这个头部数字适合做叙事框架，但不能作为 Corgi 近期运营的有效规模约束。


              中间一层，Corgi 竞争的是美国中小企业商业保险市场，尤其是科技初创公司和风投支持公司板块。这是 Corgi 产品组合最直接适用的板块：CGL、D&O、Tech E&O、Cyber 和
              EPLI，都是企业合同和投资条款清单在资金流动前要求配置的险种。FIO 2025 Annual Report 确认了美国 P&C 行业保费基础；NAIC
              行业快照数据提供了法定申报基线，用来锚定承保公司层面的市场规模。


              最可触达的一层，Corgi 竞争的是保险科技板块——面向高增长企业、数字优先的商业保险。Startupsunion 估计 2026 年更广义保险科技市场约为 $50
              billion。该估计覆盖所有商业险种中的数字分销和核保平台，不只包括面向初创公司的保障。Corgi 当前足迹——截至 2026 年 1 月约 40,000 家初创客户、平均年保费约
              $1,000——只是这一空间中狭窄但快速增长的一片。


              市场边界会影响估值。Corgi 的公开雄心是从零重建 $1T+ 全球保险业，但它当前产品组合和承保牌照把近期渗透限制在美国商业险种板块，且必须通过 49 个州可用的风险自留集团结构展开。国际业务和个人险种明确不在
              Corgi 当前市场内。
