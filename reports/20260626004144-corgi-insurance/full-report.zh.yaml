      - number: '4.3'
        title: 单位经济与效率指标
        blocks:
          - type: paragraph
            body: >-
              Corgi 公开披露的单位经济仅限三项公司口径指标：平均每客户收入约为每年 $1,000（由 $40M+ ARR / 40,000 客户推导）、年客户流失率低于 1%（公司声称，未经审计），以及 CEO 在
              2026 年 4 月称公司已盈利。CAC、回本周期、毛利率、综合成本率或赔付率均未公开披露。如果低于 1% 的年流失率准确，对商业保险而言非常突出，也意味着 LTV 相对 CAC 很高——在 1% 流失率下，隐含
              LTV 为 ARPC 的 100 倍（假设收入不变），按当前 ARPC 约为每客户 $100,000。不过，商业保险组合早期通常会低估流失，因为多数投保人尚未经历续保事件；真实留存率只有在组合沉淀 24–36
              个月后才能验证。YC 网络作为主要分销渠道，意味着 CAC 可能较低（来自合作伙伴推荐而非付费获客），但公司尚未用数字确认。AI 原生理赔处理的覆盖成本可能低于传统保险公司成本结构，但 Corgi
              未披露每保单所需人力、自动化率或理赔频率 / 严重度数据。全栈保险公司模型意味着 Corgi 承担全部保险风险——不同于经纪商，其经济性包含损失发展的精算不确定性，尤其是 D&O 和 Cyber
              等具有多年发展尾部的险种。若赔付率恶化（例如 AI Liability 理赔潮），在没有外部承保载体缓冲的情况下，盈利能力可能显著受损。
