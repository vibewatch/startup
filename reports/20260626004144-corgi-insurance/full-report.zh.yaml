      - number: '2.6'
        title: AI liability 作为新兴市场类别
        blocks:
          - type: paragraph
            body: >
              截至本报告运行日，AI liability 是一个实质上的新保险产品类别，还没有成熟的市场规模或损失成本数据。传统 Tech E&O 保单越来越多地剔除 AI 专项风险，包括大语言模型幻觉、自主 agent
              行为和算法偏见造成的错误，因为保险公司很难给 AI 生成输出中的尾部风险定价。


              Corgi 的 AI Liability 产品目前是少数明确覆盖 AI 模型错误、幻觉和偏见造成财务损失的商业保险产品之一。按 Corgi AI 行业页面描述，该产品面向正在规模化 AI
              产品的公司；当模型输出对客户或第三方造成下游财务伤害时，这些公司会暴露在责任风险中。


              AI liability 市场由监管不确定性（EU AI Act、美国联邦层面对 AI 责任的讨论）和企业买方要求共同推动：受监管买方的采购团队开始要求 AI 原生供应商在签约前配置 AI 专项保障。FIO
              2025 Annual Report 承认，新兴技术风险正在创造新的保障需求，而传统保险分类体系并不是为承接这些需求而设计。


              从规模测算看，AI liability 板块还太早，无法用公开数据自下而上测算。不过可以做一个 proxy：即便 Corgi 当前 40,000 名客户中只有 10% 主要是 AI 公司，且每家公司为 AI
              liability 保障支付 $5,000-$15,000 保费，当前板块潜在保费贡献也有 $20-60M——接近 Corgi 目前总 ARR。鉴于 AI
              在企业软件中的采用速度，长期市场可能很大；但早期市场的损失经验，将决定当前保费率是否足够。
            claimRefs:
              - CM034
              - CM035
              - CM036
              - CM037
              - CM038
