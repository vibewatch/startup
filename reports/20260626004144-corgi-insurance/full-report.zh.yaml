      - number: '5.2'
        title: AI 原生承保引擎与客户工作流
        blocks:
          - type: paragraph
            body: >
              Corgi
              的产品承诺，取决于能否把过去高度人工的保险工作流压缩成一个由软件居中协调、创始人可一次完成标准险种购买的流程。公开系统描述称，公司使用大语言模型阅读申请材料、评估风险、生成报价、管理保单并支持理赔处理。Nubia
              的评论把该系统称为「regulatory bare metal」栈，意思是 Corgi 直接把 AI
              应用于受监管的保险任务，而不是只在传统保险公司后端外面包一层经纪体验。落到实践，公司似乎会收集公司阶段、收入、员工数、行业、产品画像和司法辖区等结构化输入，再用这些信息为标准产品快速生成定价报价。

              工作流围绕速度和连续性设计。Corgi 称核心创业公司险种可在 10-15
              分钟内报价，专项产品需要一到十四个工作日，证书可在绑定后数分钟内数字交付。理赔也是全栈承诺的一部分：承保保单的同一家公司处理理赔，减少经纪主导结构常见的交接。仪表盘被定位为 24/7
              运营界面，用于增减保障、下载证书和管理续保。仍不透明的是技术底座：Corgi 未披露基础模型供应商、模型架构、准确率基准，或决定何时由人工介入的审核阈值。
