  evidenceGaps:
    - type: missing-source
      severity: material
      topic: unit-economics-disclosure
      missingEvidence: >-
        No public loss ratio, CAC, payback, or LTV data; unit economics cannot be independently
        reconstructed from available materials.
      whyItMatters: >-
        The entire intrinsic value case turns on whether premium revenue converts into durable
        underwriting profit. Without those metrics, ARR can describe scale without describing quality.
      diligencePath: >-
        Request line-level loss ratios, cohort retention, CAC by channel, payback periods, and a
        management bridge from gross written premium to earned revenue and net underwriting income.
      relatedQuestionRefs: [QV006, QV007]
      relatedTableRefs: [TV001, TV005]

    - type: analyst-assumption
      severity: minor
      topic: bull-case-probability-calibration
      missingEvidence: >-
        Scenario probability weights are analytical estimates rather than actuarially calibrated
        probabilities, and there is no public reserve or cohort history to refine them.
      whyItMatters: >-
        Because the probability-weighted valuation is close to the current entry price, small changes
        in weighting can materially alter whether the investment looks fair, rich, or attractive.
      diligencePath: >-
        Revisit scenario probabilities after reviewing statutory statements, growth cohort quality,
        and any private board materials used by the lead investors.
      relatedQuestionRefs: [QV024, QV029]

    - type: missing-source
      severity: minor
      topic: churn-versus-saas-benchmarks
      missingEvidence: >-
        No public breakdown of churn by customer cohort, company stage, product line, or premium band
        was available.
      whyItMatters: >-
        A reported sub-1% churn figure may be economically meaningful or may reflect a young book that
        has not yet experienced enough renewal cycles to test durability.
      diligencePath: >-
        Request renewal cohorts, gross and net retention by product, and voluntary versus involuntary
        churn segmentation.
      relatedQuestionRefs: [QV025]

    - type: analyst-assumption
      severity: minor
      topic: terminal-multiple-calibration
      missingEvidence: >-
        There is no direct public comparable establishing a durable 2028 terminal-multiple range for
        an AI-native full-stack insurtech carrier.
      whyItMatters: >-
        Terminal multiple selection drives most of the modeled upside and downside, especially in the
        bull and base cases.
      diligencePath: >-
        Update the comparable set as later-stage AI-insurtech financings, secondaries, M&A exits, or
        IPO filings become available.
      relatedQuestionRefs: [QV029]
      relatedTableRefs: [TV002]

    - type: private-evidence-only
      severity: material
      topic: audited-financial-statements
      missingEvidence: >-
        No audited revenue, profitability, cash-position, reserve, or line-level underwriting data
        has been disclosed; the public case rests largely on management-stated financial assertions.
      whyItMatters: >-
        The latest valuation implicitly assumes both growth quality and cash-flow quality. Without
        audited or statutory evidence, investors cannot distinguish a software-like insurer from a
        premium-rich but reserve-thin carrier.
      diligencePath: >-
        Request audited GAAP financials, NAIC or statutory carrier statements, actuarial reserve
        memos, reinsurance schedules, and a reconciliation from ARR to earned premium and net income.
      relatedQuestionRefs: [QV005, QV016]
      relatedTableRefs: [TV005]

