slug: corgi-insurance
runDate: '2026-06-26'
company:
  name: Corgi Insurance
chapter:
  number: 8
  title: Valuation
  key: valuation
  summary: >-
    Corgi Insurance enters Chapter 8 with one of the most aggressive private-market valuations in
    insurtech: the May 28, 2026 Series B1 implies a $2.6 billion post-money valuation, or roughly
    65x company-stated $40 million ARR. The upside case is understandable — rapid growth, a full-
    stack carrier model, strong YC-linked distribution, and investor sponsorship from TCV and
    Kindred — but the current price already assumes that Corgi can convert startup-insurance demand
    into durable carrier economics without a public record of loss ratios, reserves, or audited cash
    flow. Comparable public and private insurtech evidence suggests the entry is priced for
    sustained 3x+ execution rather than for margin of safety. The right conclusion is a conditional
    positive thesis: attractive only if investors can verify underwriting quality, capital adequacy,
    and loss development through non-public diligence materials.
sections:
  - id: unit-economics-and-profitability
    title: Unit economics and path to profitability
    body: >-
      The valuation case for Corgi begins with what can and cannot be observed about unit economics.
      Publicly, the company has disclosed enough to establish fast top-line scaling but not enough to
      prove durable carrier profitability. Corgi stated that ARR reached $40 million by December
      2025 and that the platform served 40,000+ customers by January 2026, implying approximately
      $1,000 of annual premium per customer. That figure is directionally credible for early-stage
      startup commercial insurance, especially given a product mix centered on CGL, Tech E&O,
      Cyber, and D&O. The more difficult question is quality of that revenue. Corgi has not publicly
      disclosed loss ratio, combined ratio, CAC, payback period, or cohort-level retention mechanics.
      Management has claimed profitability and sub-1% churn, and the YC network likely lowers
      acquisition cost relative to broker-led or field-sales-heavy peers, but none of those claims is
      independently auditable from the public record. That matters because an insurer's cash-flow
      quality is not defined by ARR alone; it is defined by how much premium survives claims,
      reinsurance, and operating expense over time. A full-stack carrier can be much more valuable
      than a broker if underwriting is sound, because it captures underwriting margin and investment
      income on float. It can also be materially less valuable if reserves are light or if long-tail
      liability lines deteriorate after growth has already been celebrated. The current valuation is
      therefore best understood as paying for the future proof of unit economics rather than for a
      fully demonstrated present-state earnings stream.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV023
      - CV035
    tableRefs:
      - TV001
    figureRefs:
      - FV001

  - id: comparable-company-and-transaction-analysis
    title: Comparable companies and precedent transactions
    body: >-
      Comparable analysis shows how exceptional Corgi's current price is. The cleanest direct marker
      is Corgi itself: the May 6, 2026 Series B valued the business at $1.3 billion on the same
      company-stated $40 million ARR base, and the May 28, 2026 Series B1 valued it at $2.6 billion,
      doubling the implied multiple from 32.5x to 65.0x in only 22 days. That is not normal even in
      a growth-friendly financing market. Looking outside Corgi, the closest strategic transaction is
      ERGO's 2025 acquisition of Next Insurance at roughly $2.6 billion. Next was meaningfully more
      mature, with a much larger premium base and a longer underwriting record, which makes the equal
      headline valuation informative but not supportive of Corgi's entry price on a risk-adjusted
      basis. Coalition's $5.0 billion private valuation on roughly $500 million GWP and Cowbell,
      Pie, Vouch, and Embroker funding histories suggest investors will pay meaningful premiums for
      full-stack or differentiated insurtech carriers, but the sector's benchmark multiples still sit
      well below Corgi's current ARR framing. In other words, the comparable set explains why a high
      multiple is possible, not why a 65x multiple is conservative. The precedent evidence supports a
      view that Corgi is being valued as an AI-native category leader whose best years are ahead; it
      does not support the claim that present public metrics alone justify the latest round price.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV036
      - CV042
