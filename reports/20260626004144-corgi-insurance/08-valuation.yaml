  - id: investor-implied-valuation-and-round-context
    title: Investor-implied valuation and round context
    body: >-
      Investor behavior is a major part of the valuation story because the latest price is not merely
      an abstract analyst estimate; it is the number sophisticated investors agreed to fund at in
      2026. Corgi's early financing path appears to run through Kindred Ventures and Y Combinator,
      which fits the company's startup-centric distribution and product orientation. The business then
      stepped into growth-stage territory with TCV leading the Series B and Series B1. Public sources
      indicate total capital raised of roughly $378 million, with the Series B alone contributing
      $160 million and the Series B1 implying a $2.6 billion post-money valuation. On company-stated
      $40 million ARR, that prices the business at 65x ARR; the earlier $1.3 billion Series B implied
      32.5x ARR. That step-up is so fast that the round sequence itself becomes a diligence topic.
      It may reflect unusually strong investor demand for AI-native full-stack carriers, confidence in
      Corgi's ability to scale like software while owning underwriting economics, or competitive round
      dynamics around a scarce asset. It may also mean that later investors paid for momentum and
      narrative before reserve, reinsurance, and line-level profitability data were available. For
      valuation purposes, the round history tells investors two things at once: first, high-quality
      capital has validated the company; second, that validation has already been capitalized into an
      entry price with little room for execution slippage. TVPI and DPI context is therefore early and
      mostly notional: fund sponsors can mark up paper quickly at this price, but realized value will
      depend on whether a later IPO or M&A event supports the same optimism.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV017
      - CV033
      - CV040
      - CV042
    tableRefs:
      - TV003
    figureRefs: []

  - id: scenario-analysis
    title: "Scenario analysis: bull, base, and bear cases"
    body: >-
      Scenario analysis is the most disciplined way to interpret a valuation as stretched as Corgi's.
      In the bull case, Corgi compounds from $40 million ARR to roughly $350 million by 2028, keeps
      its AI-led distribution advantage, proves that the carrier model scales with acceptable claims
      performance, and exits on a still-premium 20x multiple; that produces about $7.0 billion of
      value and a 2.7x outcome from the Series B1 entry. In the base case, Corgi still grows well —
      to roughly $200 million ARR by 2028 — but the market normalizes toward a 12x multiple as the
      company matures and as investors ask for demonstrated carrier margins rather than narrative;
      that yields approximately $2.4 billion, or slightly below the current entry value. In the bear
      case, growth slows to roughly $80 million ARR and the market prices the company more like a
      specialty broker or challenged insurtech at 5x ARR, creating an approximately $400 million
      outcome and severe capital loss. A true thesis-break case — reserve stress, adverse regulatory
      action, or a failed carrier model — can approach zero. On the stated probabilities, the
      probability-weighted value is about $2.57 billion, essentially equal to the Series B1 price.
      That is the core insight of this chapter: the upside is real, but the expected value is already
      largely pulled forward into today's entry valuation.
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV024
      - CV031
