company:
  name: Corgi Insurance
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Corgi Insurance is an AI-native, full-stack insurance carrier founded in 2024 in San Francisco by
    Nico Laqua (CEO/CTO) and Emily Yuan (COO), targeting venture-backed startups. The company
    completed a licensed carrier acquisition in July 2025, now writes on its own paper through
    Technology Risk Retention Group, Inc. (TRRG), and operates across 49 states. In under 18 months
    of carrier operations, Corgi grew from $1.2M revenue (mid-2024) to $40M+ ARR (December 2025),
    surpassed 40,000 active customers, and raised $378M cumulatively through a Series B1 in May 2026
    at a $2.6B valuation. The speed of its valuation progression—from $630M in January 2026 to $2.6B
    by late May 2026—is exceptional even by 2026 AI-startup standards and warrants scrutiny.

sections:
  - id: section-1
    title: Identity, operating model, and carrier structure
    body: >
      Corgi Insurance is a full-stack insurance carrier headquartered at 9 Claude Lane, San Francisco,
      California. The company sells commercial insurance products directly to venture-backed startups
      and technology companies, operating as both the underwriter and the program administrator without
      relying on a broker intermediary or a fronting carrier. This full-stack model is the single most
      important structural differentiator from the dominant broker-led insurtech competitors such as
      Vouch and Embroker.


      Corgi's legal and regulatory structure divides responsibility across two entities. Coverage is
      underwritten by Technology Risk Retention Group, Inc. (TRRG), a risk retention group organized
      under the Liability Risk Retention Act (15 U.S.C. §3901 et seq.). TRRG is the risk-bearing
      entity. Corgi Insurance Services, Inc. is a separately licensed insurance producer (California
      License #6012791) that acts as the program administrator and manages distribution. Producer
      entities hold licenses across 45 US jurisdictions and products are available in 49 states.


      A critical regulatory caveat flows from the TRRG structure: as a risk retention group, TRRG is
      not subject to all state insurance laws and regulations, and state insurance insolvency guaranty
      funds are explicitly unavailable for policies issued by a risk retention group. This is disclosed
      in Corgi's own disclaimers page and is material for prospective policyholders and investors
      evaluating the soundness of the carrier model.


      The company describes its mission as rebuilding the $1T+ global insurance industry from the
      ground up, positioning itself as financial infrastructure for the next hundred years rather than
      an incremental improvement on existing broker-led distribution. Corgi maintains a direct
      digital platform where founders can obtain a bound policy in under 15 minutes for core coverage
      lines, compressing a process that traditionally takes days or weeks with legacy brokers.
    claimRefs:
