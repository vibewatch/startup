  - id: section-2
    title: Founders, leadership, and organizational culture
    body: >
      Corgi was founded in 2024 by Nico Laqua and Emily Yuan. Both founders completed Y Combinator's
      Summer 2024 batch, giving the company early access to one of the densest networks of
      venture-backed startups in the world—which also serves as its primary customer acquisition
      channel.


      Nico Laqua serves as CEO and CTO. He is a repeat founder: before Corgi, he built Basket, a
      gaming publisher that reached over 200 million monthly active users. Laqua has traced his
      interest in insurance to his father's career as a lawyer at USAA, and identified insurance
      as an ideal candidate for LLM disruption when ChatGPT 3.5 launched, describing it as "the
      biggest words-based industry in the world." He serves simultaneously as CEO and CTO, reflecting
      the company's engineering-first identity and creating a meaningful key-person concentration.


      Emily Yuan serves as COO and co-founder. She dropped out of Stanford in her junior year and
      was named to the Forbes 30 Under 30 list in 2024. The Next Web described her as a former
      product manager at OpenAI before co-founding Corgi, a background that likely informs the
      company's AI-first product architecture. Yuan is the public face of Corgi's partnerships and
      brand initiatives, including the Corgi Café.


      The team reached approximately 70 employees as of the YC listing. The founders have publicly
      confirmed a demanding seven-day work week and, per a Nubia Magazine review, several employees
      have reportedly been living at the company's 9 Claude Lane office, which has a residential
      zoning component. Founders surveyed by Nubia expressed mixed reactions: some found the culture
      magnetic, others flagged it as a material concern when entrusting a critical part of their risk
      stack to this provider. This cultural intensity is consistent with hyper-growth startup norms but
      warrants tracking if the company expands headcount materially.
