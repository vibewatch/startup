  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: audited-financial-statements
      missingEvidence: >-
        Audited financial statements or an independent audit of ARR, customer count, and churn.
        All cover metrics are company-claimed from press releases.
      whyItMatters: >-
        The valuation trajectory is built on revenue growth claims that lack third-party
        verification. Unaudited ARR, customer, and churn figures should not be used as the sole
        basis for valuation analysis.
      diligencePath: >-
        Request audited or reviewed financial statements, management accounts, and a data-room
        definition of ARR (e.g., whether annual policy premiums are recognized ratably or
        upfront).
      relatedQuestionRefs:
        - QO017
        - QO018
        - QO019
    - type: missing-source
      severity: material
      topic: loss-ratios-claims-data
      missingEvidence: >-
        Public loss ratios, combined ratios, or claims payment frequency and severity data for
        TRRG since carrier activation in July 2025.
      whyItMatters: >-
        Insurance quality is ultimately measured by claims outcomes. Without loss ratio data,
        underwriting quality and sustainable pricing cannot be assessed.
      diligencePath: >-
        Request TRRG loss runs, combined ratio by line, and reinsurance structure from management.
        Check NAIC filings for TRRG once available.
      relatedQuestionRefs:
        - QO030
      relatedTableRefs:
