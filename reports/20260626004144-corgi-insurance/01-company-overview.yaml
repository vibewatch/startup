callouts:
  - calloutType: strength
    title: Full-stack carrier model unlocks underwriting margin
    body: >-
      Unlike broker-led insurtechs, Corgi writes on its own paper through TRRG, enabling it to
      capture underwriting profit directly, reprice risk in near-real-time, and build an integrated
      data advantage from policy to claims.
    claimRefs:
      - CO002
      - CO003
      - CO005
      - CO006
      - CO033
  - calloutType: risk
    title: TRRG structure excludes state guaranty fund protection
    body: >-
      Coverage underwritten by a risk retention group is explicitly excluded from state insurance
      insolvency guaranty funds. This is material for policyholders evaluating carrier solvency risk
      and for investors assessing the regulatory durability of the full-stack model.
    claimRefs:
      - CO004
      - CO007
      - CO008
  - calloutType: insight
    title: Valuation tripled in under five months
    body: >-
      Corgi moved from a $630M valuation (January 2026) to $2.6B (May 28, 2026), a roughly 4x
      step-up in five months. The 22-day interval between Series B and B1 is an outlier by any
      2026 benchmark and demands multi-chapter diligence on revenue quality, burn rate, and whether
      the profitability claim holds at scale.
    claimRefs:
      - CO019
      - CO023
      - CO024
      - CO025
      - CO026
      - CO027
      - CO028
  - calloutType: risk
    title: Limited claims history and no public loss ratios
    body: >-
      Corgi's carrier license dates from July 2025 — less than 12 months at initial announcement.
      Insurance quality is ultimately judged by claims resolution over multi-year cycles. The
      absence of public loss ratios is a gap that later chapters, particularly risks and valuation,
      must address with diligence asks.
    claimRefs:
      - CO005
      - CO006
      - CO043
      - CO044

