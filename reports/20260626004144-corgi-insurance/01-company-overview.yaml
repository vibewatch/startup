  - id: section-5
    title: Go-to-market, milestones, and adverse signals
    body: >
      Corgi's primary acquisition channel is the YC network, which gives direct access to the
      startup ecosystem at the moment of highest insurance need: when a company is closing a funding
      round or signing an enterprise contract. The company extends this reach through partnerships
      with law firms, cap table management platforms, and cloud marketplaces via API integrations.
      A human broker option is available for complex coverage needs, preserving optionality for
      founders who need guidance rather than pure self-serve.


      The most visible GTM activation was the Corgi Café: a 24-hour café opened in February 2026
      at 9 Claude Lane in San Francisco's Financial District, operating from the ground floor beneath
      the company's offices. Startupsunion described it as analogous to Capital One Café—a physical
      brand-community touchpoint where founders encounter the Corgi brand in a low-pressure context.
      In March 2026, Corgi acquired the domain corgi.com, consolidating its online presence and
      signaling long-term brand investment.


      Key adverse and diligence signals to carry forward: (1) The TRRG structure means policyholders
      lack state guaranty fund protection. (2) The carrier license dates only from July 2025,
      providing a very limited track record for claims resolution. (3) No public loss ratios have
      been disclosed. (4) Culture concerns—seven-day work week, office living—have been independently
      noted by Nubia Magazine. (5) The $1.3B to $2.6B valuation step in 22 days is an outlier even
      among 2026 AI funding announcements and warrants deeper multiple-expansion analysis. (6) ARR
      and customer figures are company-claimed and unaudited.
    claimRefs:
