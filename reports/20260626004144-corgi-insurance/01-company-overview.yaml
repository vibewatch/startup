  - id: section-4
    title: Revenue traction, customer scale, and product portfolio
    body: >
      Corgi's revenue trajectory is one of the few publicly corroborated data points that
      independently supports the valuation narrative. The company reported $1.2 million in revenue
      at mid-2024—consistent with a pre-carrier, pre-regulatory-approval phase—and announced ARR
      exceeding $40 million by December 2025, after receiving its full carrier license in July 2025.
      That trajectory represents roughly a 33x revenue increase in approximately 18 months, a growth
      rate that Startupsunion describes as "a cliff face, not a growth curve." Both figures are
      company-claimed and have not been independently audited.


      Customer scale supporting this ARR: over 40,000 active customers across 49 states as of the
      January 2026 announcement. Churn is reported below 1%, which Startupsunion estimates as
      roughly $1,000 average revenue per customer per year. This math is directionally consistent
      with the published ARR: 40,000 × $1,000 = $40M. The customer cohort is concentrated in
      early-stage YC-associated startups, with named customers including Artisan, Eragon, Sorcerer,
      Intryc, and Deel.


      The product portfolio is modular and designed to track a startup's funding stage. Pre-Seed and
      Seed packages include Commercial General Liability (CGL), Directors and Officers (D&O),
      Technology Errors & Omissions (Tech E&O), and Cyber. Series A packages add Media Liability and
      Employment Practices Liability Insurance (EPLI). Growth stage adds Fiduciary Liability.
      Specialty lines include Hired and Non-Owned Auto (HNOA), Representations and Warranties (R&W),
      AI Liability, Workers Comp, BOP, Contractors Professional, Real Estate E&O, Lawyer E&O,
      Non-Profit D&O, K&R, and Medical Malpractice.


      The AI Liability product is a notable differentiator: it explicitly covers financial losses
      caused by AI model errors, hallucinations, and bias—a risk category that traditional insurers
      are actively carving out of E&O policies rather than covering. Corgi's ability to reach a quote
      in 10-15 minutes and bind policy the same day is corroborated across multiple independent
      customer testimonials and analyst reviews.
