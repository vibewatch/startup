callouts:
- calloutType: strength
  title: Physics-First Architecture Addresses Core Robotics Reliability Problem
  body: 'FieldAI''s belief-space, physics-first FFM design directly tackles the hallucination and reliability failure mode that has limited LLM-retrofitted robot approaches. The architecture was validated in DARPA SubT, among the world''s most demanding real-world robotics competitions, before commercial deployment. No GPS, pre-mapping, or cloud dependency is a genuine operational differentiator for industrial, federal, and remote deployments.

    '
  claimRefs:
  - CE001
  - CE007
  - CE033
  - CE034
- calloutType: risk
  title: No Published Safety Certifications or Independent Performance Benchmarks
  body: 'Despite production deployments across hundreds of sites and partnerships in safety-critical environments (construction, energy, security), FieldAI has not disclosed any formal safety certifications (ISO, IEC, ANSI/RIA), FedRAMP status, or independent third-party performance benchmarks as of May 2026. Safety validation frameworks with Certis are stated as in development. Investors and enterprise buyers should require documented safety acceptance criteria, incident records, and compliance roadmaps before scaling deployments.

    '
  claimRefs:
  - CE026
  - CE031
  - CE027
- calloutType: risk
  title: Vendor Concentration in NVIDIA Omniverse Training Pipeline
  body: 'FieldAI''s sim-to-real and model improvement pipeline now runs on NVIDIA Omniverse NuRec, Isaac Sim, Isaac Lab, Cosmos, and OSMO — with Microsoft Azure as the toolchain host. This three-party dependency (NVIDIA, Microsoft, FieldAI) creates commercial and technical concentration risk. Any licensing changes, platform deprecation, or supply constraints on NVIDIA compute infrastructure would affect model improvement velocity and digital twin delivery to customers.

    '
  claimRefs:
  - CE014
  - CE015
  - CE016
  - CE017
- calloutType: insight
  title: Developer Ecosystem Is Practitioner-Proxy Only — No Public API Surface
  body: 'FieldAI''s GitHub organization forks standard robotics libraries (Spot SDK, ROS, spconv) and shows active commit history through April 2026, providing a practitioner-community proxy signal. However, no proprietary FFM code, SDK, or developer documentation is publicly available. The private release notes page prevents changelog auditing. This limits independent technical validation and raises questions about ecosystem moat defensibility if the company eventually opens developer access.

    '
  claimRefs:
  - CE020
  - CE028
  - CE029
