chapter:
  number: 5
  title: Product & Technology
  summary: 'FieldAI''s core product is the Field Foundation Model (FFM) platform — a physics-first, risk-aware embodied AI software brain that runs entirely on-edge across heterogeneous industrial robots without maps, GPS, or cloud connectivity. The platform is organized into three integrated model components (perception/reasoning FFM, Dynamics Foundation Model, and Multiagent Foundation Model) and supports eight application modules from inspection to ISR. Technical differentiation rests on belief-space uncertainty management, real-deployment data flywheels, and deep DARPA/NASA lineage. Two major partnerships closed in Q1 2026 — Boston Dynamics and Certis Group — and NVIDIA Omniverse integration enables a real-to-sim training pipeline. No public API, published performance benchmarks, or safety certifications exist yet, and the release notes page is access-restricted, limiting external validation.

    '
sections:
- id: SE-prod
  title: Product Definition and Module Map
  body: 'FieldAI is a pure-play AI software company that does not manufacture robots. Its commercial offering is the Field Foundation Model (FFM) platform: embodiment-agnostic autonomy software installed on partner or customer-owned robot hardware. The FFM acts as a universal "brain" that enables robots to perceive, reason, and act in unstructured industrial environments without requiring pre-mapped layouts, GPS, cloud connectivity, or per-task reprogramming. The platform is hardware-agnostic across quadrupeds (e.g., Boston Dynamics Spot), wheeled robots, humanoid platforms, and passenger-scale autonomous vehicles.

    FieldAI''s application portfolio spans eight solution categories listed on its official Solutions page: site mapping and documentation; facility and equipment inspection; condition anomaly detection; large-scale data capture; unmanned material transport; security and threat detection; telepresence and teleoperation; and search and ISR. The company develops applications both in-house and through a partner payload model with third-party providers. Near-term commercial focus is inspection and data collection (revenue-generating now), with manipulation and general-purpose operations on the mid- and long-term roadmap.

    A distinguishing architectural principle is "Context over Training": instead of requiring exhaustive scenario pre-training, FFMs use contextual cues and learned physical priors to make inferences about unforeseen situations. CEO Ali Agha described the robot''s risk-awareness as giving it a sense of "how confident I am" in any action, with customer-configurable risk thresholds that adjust behavior in safety-critical zones. The result is a deployment model where robots can be activated at new sites quickly and scale to enterprise fleets without extensive per-site customization.

    '
