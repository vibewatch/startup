  title: FieldAI Product Architecture Stack
  type: stack
  layout: standard
  summary: Layered model architecture of the FFM platform from sensor inputs to application output.
  data:
    layers:
    - label: Application Layer
      detail: 'Eight solution modules: site mapping, facility inspection, anomaly detection, data capture, material transport, security/threat detection, telepresence, and search/ISR. Deployed via in-house or partner payload model.

        '
    - label: Multiagent Foundation Model (MFM)
      detail: 'Fleet coordination layer. Enables multiple robots to share environmental representations and reason collectively at site scale. Designed for high-risk, unstructured multi-robot deployments.

        '
    - label: Field Foundation Model (FFM) Core — Perception & World Model
      detail: 'Physics-first belief-space model. Processes multimodal inputs (vision, LiDAR, text, audio, thermal, event cameras). Maintains probabilistic uncertainty estimates. Context over Training — infers behavior in novel scenarios without exhaustive pre-training. No maps, GPS, or cloud required.

        '
    - label: Dynamics Foundation Model (DFM)
      detail: 'Robot-specific dynamic model integration layer. Decouples world model from robot body, enabling the same cognitive brain to control mechanically distinct platforms (quadruped, wheeled, humanoid, passenger-scale).

        '
    - label: Edge Compute Runtime
      detail: 'On-device inference only. Full autonomy without cloud connectivity. Runs on industrial edge hardware (specific SoC/GPU not publicly disclosed; NVIDIA Jetson-class inferred from NVIDIA partnership context).

        '
    - label: Simulation & Training Infrastructure (NVIDIA-integrated)
      detail: 'Real sensor data to NuRec 3D digital twins to Isaac Sim/Isaac Lab to NVIDIA Physical AI Data Factory Blueprint (via Azure) using Cosmos + OSMO synthetic data pipeline. Closes sim-to-real gap and supports continuous model improvement from operational data flywheel.

        '
