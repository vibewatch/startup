  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: release notes changelog
    missingEvidence: 'FieldAI''s product release notes page is a private Squarespace site returning HTTP 401. No changelog, version history, or feature release schedule is publicly accessible.

      '
    whyItMatters: 'Without a public changelog, investors and enterprise buyers cannot independently audit what capabilities have shipped vs. what remains on the roadmap, or verify the pace of model improvement.

      '
    diligencePath: 'Request changelog access or a formal product version history summary from FieldAI directly.

      '
    relatedQuestionRefs:
    - QE017
  - type: missing-source
    severity: material
    topic: safety certifications and compliance
    missingEvidence: 'No ISO 10218, IEC 62443, ANSI/RIA, FedRAMP, or equivalent safety and security certifications have been publicly disclosed for FieldAI''s platform.

      '
    whyItMatters: 'Production deployments in hazardous industrial environments (energy, mining, construction, defense) and multi-site security operations require enterprise-grade safety compliance. Absence of formal certifications is a procurement blocker for regulated industries and large enterprises.

      '
    diligencePath: 'Request compliance documentation, audit reports, or safety certification roadmap from FieldAI, particularly for ISO 10218 (industrial robot safety) and IEC 62443 (industrial network security).

      '
    relatedQuestionRefs:
    - QE016
  - type: missing-source
    severity: material
    topic: FFM performance benchmarks
    missingEvidence: 'No independent performance benchmarks, inference latency specs, throughput metrics, or accuracy measures for the FFM platform have been published. Customer outcomes (90% inspection time reduction, 200x speedup) are company-claimed and single-source.

      '
    whyItMatters: 'Without benchmarks, enterprise buyers and investors cannot objectively compare FieldAI''s performance to competing autonomy solutions or validate the claimed efficiency improvements.

      '
    diligencePath: 'Request access to production telemetry, third-party benchmark results, or pilot performance logs. Independent evaluation by a qualified robotics consultant is strongly recommended.

      '
    relatedQuestionRefs:
    - QE009
    - QE014
  - type: missing-source
    severity: material
    topic: edge compute hardware requirements
    missingEvidence: 'FieldAI does not publicly disclose the minimum hardware specifications (compute, memory, power) required for FFM deployment on robot platforms. The specific on-device accelerator is not documented.

      '
    whyItMatters: 'Hardware requirements directly constrain which robot platforms are compatible and what total cost of ownership looks like for customers considering FFM deployment on existing robot fleets.

      '
    diligencePath: 'Request hardware compatibility matrix and minimum compute specifications from FieldAI.

      '
    relatedQuestionRefs:
    - QE010
  - type: missing-source
    severity: minor
    topic: developer ecosystem and public API
    missingEvidence: 'No public API documentation, developer SDK, developer forum, Discord/Slack community, or Stack Overflow tag has been identified for FieldAI''s FFM platform. GitHub activity is limited to third-party library forks.

      '
    whyItMatters: 'Absence of a developer surface limits ecosystem moat, third-party integrations, and the community-based validation that typically accompanies platform-category claims. It also constrains technical diligence.

      '
    diligencePath: 'Determine whether FieldAI has a partner API program, and request SDK or integration documentation for the FFM platform.

      '
    relatedQuestionRefs:
    - QE017
    - QE025
  - type: missing-source
    severity: material
    topic: sim-to-real gap quantification
    missingEvidence: 'FieldAI acknowledges a throughput cost when robots encounter unfamiliar scenarios (conservative fallback). No data has been published on the frequency, severity, or conditions under which this fallback is triggered.

      '
    whyItMatters: 'The conservative fallback is a direct product quality metric that affects deployment ROI, customer satisfaction, and scalability. Unquantified, it represents an unknown operational risk.

      '
    diligencePath: 'Request production telemetry on fallback frequency and conditions. Compare across deployment environments (known vs. novel sites, indoor vs. outdoor, different robot platforms).

      '
    relatedQuestionRefs:
    - QE022
