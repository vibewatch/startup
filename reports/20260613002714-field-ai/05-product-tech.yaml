- id: SE-arch
  title: Architecture and Technical Design
  body: 'The FFM platform is organized into three layered model components. The core FFM handles perception, world modeling, and decision-making using multimodal sensor streams including vision, LiDAR, text, and audio. The Dynamics Foundation Model (DFM) is a sub-model that integrates the robot''s intrinsic kinematic and dynamic properties, enabling the same cognitive layer to drive mechanically distinct robot bodies. The Multiagent Foundation Model (MFM) is a coordination layer that allows multiple robots in a fleet to share environmental representations and reason collectively at site scale — turning a robot swarm into a distributed autonomous system rather than isolated tools.

    Architecturally, FieldAI operates in "belief space": the system continuously tracks probability distributions over environmental states rather than assuming perfect information, a design lineage traceable to CEO Ali Agha''s academic work on FIRM (Feedback-based Information RoadMap) belief-space planning, as well as the NeBula system that won Phase II of the DARPA SubT challenge. This probabilistic approach means robots can function in GPS-denied, low-visibility, and sensor-degraded conditions. When FFMs encounter unfamiliar conditions, they explicitly slow down or choose more conservative paths — an admitted throughput cost that the company treats as a safety feature. The real-world data flywheel means each deployment improves model performance over time, creating a compounding data advantage.

    NVIDIA integration deepens the engineering stack. FieldAI uses NVIDIA Omniverse NuRec to reconstruct high-fidelity 3D digital twins from sensor data captured as a byproduct of normal robot operations. These digital twins load into NVIDIA Isaac Sim and Isaac Lab for robot policy training and validation, and FieldAI is adopting the NVIDIA Physical AI Data Factory Blueprint via Microsoft Azure, using NVIDIA Cosmos open-world foundation models and NVIDIA OSMO for synthetic data pipeline automation. The company''s GitHub organization (field-ai) maintains active forks of robotics infrastructure libraries — Spot SDK, rosbridge_suite, spconv, unitree_sdk2 — with commits as recent as April 2026, providing developer-side evidence of the platform''s integration surface, though no proprietary model weights or SDK documentation is publicly published. The private Squarespace release notes page further limits external auditability of shipped capabilities.

    '
