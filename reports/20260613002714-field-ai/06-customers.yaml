- id: SU-adoption
  title: Adoption Trajectory and Deployment Scale
  body: 'FieldAI''s August 2025 funding announcement stated "successful testing and deployments across hundreds of complex real-world industrial environments" in Japan, Europe, and the United States, with "some of the world''s largest companies" across construction, energy, manufacturing, and urban delivery and inspection. The round was described as oversubscribed following "rapid customer adoption and multiple expansion contracts," and by March 2026 the company referenced a "rapidly growing fleet" with customers expanding across North America, Europe, and Asia in the NVIDIA collaboration announcement. These are company-originated claims without third-party verification of active site count, customer count, or fleet size.

    Independent tracking by robotsinconstruction.com as of April 2026 counts exactly four confirmed construction deployments: Big-D Construction (production, 2+ years), DPR Construction (production, ~1.5 years as of November 2025), and two unnamed top-10 ENR general contractors. The platform notes FieldAI has been shipping since 2024. The discrepancy between "hundreds of environments" and four confirmed construction deployments may be partly explained by non-construction verticals, pre-commercial testing environments, and demo or evaluation deployments that are not tracked by independent sources. The Big-D and DPR deployments are the only cases with customer-identified outcomes (named executive and superintendent quotes, specific square-footage data, elapsed deployment duration).

    The Boston Dynamics partnership (March 2026) added a credible third-party validator, with Boston Dynamics citing customers "from Asia to Europe to North America" expanding to enterprise-scale deployments. FieldAI stated plans to expand the Spot deployment to "one of the largest third-party quadruped fleets in the world." Neither claim carries independent site-level corroboration.

    '
