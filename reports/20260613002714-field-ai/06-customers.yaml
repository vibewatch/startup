  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue and ARR
    missingEvidence: 'FieldAI''s ARR, revenue run-rate, and any disclosed financial metric (contract value, average deal size, revenue by vertical) have not been disclosed publicly.

      '
    whyItMatters: 'Without revenue data, the $2B valuation cannot be contextualized against any financial multiple; customer adoption narrative rests entirely on qualitative signals.

      '
    diligencePath: 'Request ARR, customer count, and average contract value in a formal management presentation; cross-reference with Series B pitch materials if accessible.

      '
    relatedQuestionRefs:
    - QU007
    - QU022
  - type: private-evidence-only
    severity: material
    topic: retention metrics
    missingEvidence: 'No NRR, GRR, churn rate, or cohort retention data has been disclosed for any segment or period.

      '
    whyItMatters: 'The land-and-expand thesis and data-flywheel stickiness narrative are unverifiable without retention metrics; existing qualitative signals (Big-D expansion language) are insufficient for diligence confidence.

      '
    diligencePath: 'Request GRR and NRR by cohort year and vertical; ask whether any customer has churned or significantly reduced its deployment since inception.

      '
    relatedQuestionRefs:
    - QU008
  - type: missing-source
    severity: material
    topic: failed pilots and adverse customer evidence
    missingEvidence: 'No public record of a failed FieldAI pilot, early customer termination, deployment complaint, or performance dispute has been found in any media, review, or procurement record.

      '
    whyItMatters: 'The absence of adverse customer evidence could reflect genuinely high success rates, or could reflect NDA-restricted customer relationships and the lack of independent tracking outside construction; either way, the record is incomplete for diligence.

      '
    diligencePath: 'Conduct reference calls with named and unnamed customers; request Win/Loss analysis from FieldAI; search procurement databases and industry forums for any complaint records.

      '
    relatedQuestionRefs:
    - QU018
  - type: missing-source
    severity: material
    topic: safety incidents and operational outages
    missingEvidence: 'No public disclosure exists of any safety incident, robot malfunction, or operational outage at a live FieldAI customer site. No incident report, safety audit, or uptime metric has been made public.

      '
    whyItMatters: 'FieldAI operates in safety-critical environments (active construction sites, security perimeters, oil & gas facilities); silent failures or unreported incidents in these environments carry physical risk and liability exposure.

      '
    diligencePath: 'Request safety incident log, MTBF data, and near-miss reports from FieldAI; inquire with named customers about their safety-review process for autonomous robots.

      '
    relatedQuestionRefs:
    - QU020
  - type: enumeration-incomplete
    severity: material
    topic: energy, mining, and manufacturing named customers
    missingEvidence: 'Despite energy and industrial manufacturing being stated commercial segments, no named or independently confirmed production customer in these segments has appeared in any public source as of May 2026.

      '
    whyItMatters: 'Multi-vertical proof is essential to justify the FieldAI valuation and the narrative of general-purpose robotics. If deployments are predominantly limited to construction, the addressable market and defensibility assessment changes substantially.

      '
    diligencePath: 'Request a named customer reference in at least one non-construction segment; verify whether BHP Ventures'' investment entailed a commercial arrangement or was purely financial.

      '
