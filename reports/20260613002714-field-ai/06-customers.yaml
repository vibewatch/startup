figures:
- id: FU001
  title: Customer Journey Map — FieldAI Enterprise Industrial Buyer
  type: journey-map
  layout: wide
  summary: 'Illustrates the typical enterprise industrial customer journey from awareness through production deployment and fleet expansion, across FieldAI''s primary and secondary segments.

    '
  data:
    items:
    - id: stage-awareness
      label: 1. Awareness
      actor: Enterprise VP/Director (Technology, Innovation, VDC, or Operations)
      description: Customer discovers FieldAI via industry conference, partner referral (Boston Dynamics, NVIDIA), earned media, or peer recommendation from another contractor.
      channels:
      - Industry conferences
      - OEM partner networks (Boston Dynamics, NVIDIA)
      - Press coverage and analyst reports
    - id: stage-discovery
      label: 2. Discovery / Demo
      actor: Technology or Innovation Director; Project Executive
      description: Technical evaluation; CEO-level or VP engagement; live demo on active site or digital-twin walkthrough. FieldAI demonstrates BIM integration, autonomous mission modes, and sensor payload.
      channels:
      - FieldAI direct sales team
      - fieldai.com product pages
      - Partner introductions and referrals
    - id: stage-pilot
      label: 3. Proof-of-Concept / Pilot
      actor: Site Superintendent; Safety Manager; VDC Director
      description: Time-bounded deployment on a single project site. Limited robot fleet; one mission type (inspection or documentation). Superintendent and field team buy-in tested here.
      channels:
      - Supervised field deployment
      - Customer feedback loop
      - Field superintendent evaluation
    - id: stage-production
      label: 4. Production Deployment
      actor: Site Superintendent; Technology Director; Operations Lead
      description: Recurring autonomous missions on active sites; FieldAI integrated into BIM, project management, and safety reporting workflows. Data flywheel begins enriching site-specific models.
      channels:
      - Expanded robot fleet
      - Daily autonomous operations
      - BIM and project management integrations
    - id: stage-expansion
      label: 5. Fleet / Enterprise Expansion
      actor: Innovation Director; CTO; VP Operations
      description: Multi-site rollout; additional mission types (inspection + security + transport); multi-year contract renewal. Big-D's trajectory to deploy on every future project exemplifies this stage.
      channels:
      - New site onboarding
      - Model improvement via data flywheel
      - Enterprise fleet management via FieldAI cloud
  approximationNotes: 'Stage sequence is inferred from available customer evidence (Big-D 2-year trajectory, DPR PoC → production arc) and company materials. Not all segments have confirmed production deployments; energy, mining, and federal are represented based on stated positioning only.

    '
