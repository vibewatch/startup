- id: SU-proof
  title: Named Customer Proof
  body: 'Big-D Construction and DPR Construction are FieldAI''s two fully named, production-deployed customers with publicly attributed outcomes. Big-D, a US contractor with 25+ years in commercial construction, has been in active deployment for over two years as of April 2026. C-level executive Shaun Orr described a breakthrough moment when the robot walked a project site in real time, linked to the BIM model and project schedule, identified missing work and safety issues, and correlated findings back to the company''s project management platforms — a capability that no single human team could replicate alone. Orr projected that "every project will have some representation of FieldAI tools." Big-D superintendent Bronson Dupaix described replacing five-hour manual job-walk sessions using handheld cameras and scanners. Big-D director Chantelle Menlove independently noted that a superintendent who had seen the robot on one site called to request it on his next site, indicating organic bottom-up
    demand.

    DPR Construction, one of the ten largest US contractors (and a data-center and healthcare specialist), hosted FieldAI robots at a Santa Clara, California data center site for approximately 1.5 years as of November 2025. The robot captured 45,000+ photos, walked 100+ miles, scanned 500,000 square feet of interiors and 125,000 square feet of roofing. Superintendent Justin Schreiner said the system "makes us better at what we do" by removing mundane documentation tasks and enabling teams to focus on critical work.

    Certis Group, Singapore''s largest security and operations company, announced a strategic partnership with FieldAI in February 2026 to deploy autonomous security robots across its global operations. Certis'' Mozart orchestration platform integrates with FieldAI''s FFMs for autonomous patrol, incident detection, and human-robot coordination at multi-site security environments. Certis president Ng Tian Beng confirmed the partnership is structured for "live, mission-critical environments." The partnership is not a direct customer sale but a channel/OEM-style arrangement where Certis is both partner and operator-customer for the security vertical.

    An unnamed global industrial manufacturing executive was quoted in a March 2026 FieldAI/NVIDIA press release saying a process that "once took three and a half months now takes just twelve hours" — a 200× improvement. The customer is not named and the metric is unverifiable, but the quote is attributed by a named company executive (CEO Ali Agha) in a formal press release. Two additional unnamed top-10 ENR firms appear in the robotsinconstruction.com independent tracker with confirmed production deployments but no disclosed outcomes.

    '
