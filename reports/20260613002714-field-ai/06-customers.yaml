chapter:
  number: 6
  title: Customers
  summary: 'FieldAI''s confirmed customer base is concentrated in construction — with Big-D Construction and DPR Construction as the only two publicly named production accounts, plus two unnamed top-10 ENR firms per independent tracking. The Certis Group security partnership (February 2026) and an unnamed global industrial manufacturer (named in a company press release) extend the breadth claim, but the energy, mining, and manufacturing verticals carry no named, verified customer. FieldAI''s company-claimed "hundreds of industrial environments" figure is unverifiable; the independently confirmed count is four construction sites. No NRR, GRR, or churn data has been disclosed; expansion signals rest on qualitative executive quotes and an oversubscribed funding round. Adverse evidence includes a sector-wide adoption drop from 65% to 46% of construction contractors actively using robots in 2025 despite record optimism, pointing to material go-to-market friction in FieldAI''s primary vertical.

    '
sections:
- id: SU-segments
  title: Customer Segments, Buyer/User/Payer Logic
  body: 'FieldAI sells embodied AI software and sensor-compute payloads to enterprise industrial organizations across six named verticals: construction, energy/oil & gas, mining, manufacturing, urban delivery and inspection, and federal/defense. It does not manufacture robots; the company''s product is the autonomy software and payload that retrofits hardware the buyer already owns or procures from an OEM partner such as Boston Dynamics. This clean software-licensing model means the payer is always the industrial enterprise, the buyer is typically a technology officer, VP of operations, or innovation director, and the daily user is the field superintendent, safety manager, or operations lead who deploys and monitors the robot.

    Subscriptions are reported to range from tens of thousands of dollars to $500,000 per year depending on deployment scale, with hardware integration services layered on top for first-time deployments. The construction vertical is FieldAI''s most commercially mature segment — it has the only publicly named customer case studies (Big-D Construction, DPR Construction) and the only confirmed multi-year production deployments as of mid-2026. Energy/oil & gas and industrial manufacturing are served by a dedicated product page covering equipment anomaly detection, gauge and thermal monitoring, and digital-twin creation, but no named enterprise customers in these segments have been disclosed publicly. Security operations entered the addressable market via the Certis Group strategic partnership announced February 2026, and federal/defense is a separately branded segment (FieldAI Federal) with a Detroit Defense partnership noted in prior chapters.

    The buyer/user split creates an important sales dynamic: the champion in the purchase decision is often a technology or innovation director, but production adoption hinges on buy-in from superintendents and safety managers who use the system daily. At Big-D, organic demand from superintendents reinforced top-down investment decisions — a positive signal for stickiness — but also implies that a single project team''s resistance could slow site-level expansion.

    '
