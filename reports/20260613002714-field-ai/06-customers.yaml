- id: SU-retention
  title: Retention, Expansion, and Concentration Risk
  body: 'FieldAI has not disclosed any retention metrics — no NRR, GRR, cohort data, churn rate, contract renewal rate, or customer satisfaction score has appeared in any public statement, press release, or investor communication as of May 2026. The company is pre-revenue-disclosure and private; no regulatory filing mandates these disclosures.

    Qualitative retention signals are modestly positive for construction. Big-D''s multi-year active deployment and explicit plans to expand FieldAI to every future project are the strongest available signal of retention and expansion. DPR''s corporate venture arm (WND Ventures) called the August 2025 funding raise "a sign that people can expect larger funding rounds for robotics," and noted that DPR sites helped test proof of concept — language that implies an ongoing relationship. The oversubscribed funding round, explicitly attributed to "multiple expansion contracts," provides financial-signal corroboration of repeat purchase, though specific contract values and customer names remain undisclosed.

    Structural concentration risk is elevated. Based on publicly confirmed production deployments, FieldAI''s construction customer base consists of four accounts: Big-D, DPR, and two unnamed ENR firms. Loss of either named anchor customer would remove more than 50% of the visible evidence base. The energy, mining, and manufacturing verticals have no named public customers, meaning outside construction the proof-of-production is a gap. Certis provides vertical diversification into security but is a partner-operator, not a direct enterprise SaaS account.

    A broader macro headwind exists for the primary vertical: the BuiltWorlds 2025 Equipment & Robotics Benchmarking report found that active construction robotics usage among contractors dropped from 65% to 46% year-over-year, even as positive sentiment rose to 95%. The decline was attributed to a move away from experimental pilots toward selective, proven implementations — a dynamic that may slow FieldAI''s new customer acquisition while benefiting its existing production accounts. Long enterprise sales cycles, multi-stakeholder approval workflows, and NDA-restricted customer naming mean FieldAI''s real customer base is almost certainly larger than public evidence suggests but no independent method exists to verify this.

    '
