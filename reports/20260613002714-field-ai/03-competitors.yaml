company:
  name: FieldAI
chapter:
  number: 3
  title: Competitors
  summary: 'FieldAI competes across three overlapping solution spaces: embodied AI software platforms (Intrinsic/Google, Physical Intelligence), vertically integrated industrial-inspection robots (Gecko Robotics), and robot OEM software stacks (Boston Dynamics Orbit). Its primary differentiation is physics-first, risk-aware edge autonomy across heterogeneous robot fleets without GPS or pre-mapping. The most pressing competitive threat is Intrinsic/Google''s distribution scale—Fanuc''s 1.1 million installed robots—and Physical Intelligence''s 5.5× capital advantage despite having no commercial product. Status-quo alternatives (manual inspection, in-house SLAM navigation) remain the largest single incumbent; displacing them is FieldAI''s near-term market-creation task.

    '
sections:
- id: competitive-landscape-overview
  title: Competitive Landscape and Buyer Alternatives
  body: 'Industrial enterprises that need autonomous robot operations have five materially distinct ways to solve the job in 2026: (1) deploy FieldAI''s Field Foundation Models on existing hardware; (2) adopt an embodied-AI foundation model platform from a well-capitalized rival (Intrinsic/Google, Physical Intelligence, Covariant); (3) use an inspection-specialist platform with its own robotics stack (Gecko Robotics, Machina Labs); (4) rely on the robot OEM''s bundled intelligence software (Boston Dynamics Orbit, KUKA, Fanuc native AI); (5) continue with status quo—manual inspection crews, traditional SLAM/GPS-dependent navigation, or an in-house software team. Most large enterprise buyers use more than one approach simultaneously, making multi-homing common and switching costs softer than they initially appear. FieldAI targets the largest unmet slice: dynamic, GPS-denied, unstructured field environments where status-quo and OEM-native solutions fail. The company''s hardware-agnostic software
    model avoids the capital intensity of robot manufacturing while enabling presence across more platforms than any single OEM. As of May 2026, the eight direct and substitute players profiled below collectively represent substantially more VC and corporate capital than FieldAI, creating both validation of the market and a material risk of well-resourced competitive entrenchment.

    '
