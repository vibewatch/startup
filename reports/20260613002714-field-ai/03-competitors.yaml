callouts:
- calloutType: risk
  title: Google/Intrinsic Distribution Scale Is Structural, Not Speed-Dependent
  body: 'The Fanuc partnership gives Google/Intrinsic access to 1.1 million already-deployed industrial robots—a fleet FieldAI cannot replicate organically in any foreseeable timeline. Even if Flowstate''s autonomy capabilities are inferior today, the upgrade path to existing Fanuc customers creates a beachhead that compresses FieldAI''s addressable greenfield market. This threat is structural (distribution leverage) rather than purely technical and is the single most important competitive dynamic for FieldAI''s financial model.

    '
  claimRefs:
  - CP007
  - CP028
- calloutType: risk
  title: Partner/Competitor Dual Role of Boston Dynamics Warrants Contractual Diligence
  body: 'Boston Dynamics simultaneously serves as FieldAI''s most prominent named hardware partner and runs the Orbit software platform—which is now integrated with Google Gemini—for fleet intelligence on the same Spot robots FieldAI powers. This dual relationship creates a latent conflict of interest: Boston Dynamics can observe FieldAI''s deployment performance data through Orbit, develop competing capabilities, and selectively de-prioritize the partnership if FieldAI''s capabilities become redundant or commercially threatening. No public exclusivity or IP-separation provisions have been disclosed.

    '
  claimRefs:
  - CP013
  - CP033
- calloutType: strength
  title: GPS-Denied Edge Deployment Is a Defensible Niche Others Have Not Prioritized
  body: 'No competitor reviewed in this chapter has confirmed on-edge, air-gappable embodied AI for GPS-denied, unstructured outdoor environments (construction sites, underground mines, remote energy assets). This combination—edge inference, multi-embodiment, physics-aware risk modeling, no pre-mapping—is the narrowest but most defensible portion of FieldAI''s differentiation, because cloud-first platforms (Intrinsic, Pi) face fundamental architecture constraints in fully air-gapped or bandwidth-constrained deployments.

    '
  claimRefs:
  - CP003
  - CP004
  - CP018
- calloutType: insight
  title: Status Quo Displacement Is FieldAI's Largest Near-Term Market Creation Task
  body: 'Manual inspection and in-house SLAM navigation are not traditional software competitors, but they are the default choice for most industrial operators evaluating FieldAI. The U.S. Navy spends an estimated $13–20 billion annually on ship maintenance—an order of magnitude more than any of the startup competitors'' total annual revenue. FieldAI''s primary competitive task in the near term is proving ROI that displaces the status quo, not outcompeting other AI platforms.

    '
  claimRefs:
  - CP026
  - CP034
