- id: competitor-profiles-and-capabilities
  title: Competitor Profiles and Capability Comparison
  body: 'Intrinsic, now folded into Google (February 2026), offers Flowstate, a web-based development and simulation environment for industrial robots. The platform is hardware-agnostic across KUKA, Fanuc, Universal Robots, and others, and leverages Google''s Gemini AI models for vision and reasoning. The May 2026 Fanuc partnership gives Google access to 1.1 million deployed industrial robots—a distribution channel no startup can match. Intrinsic''s laid-off 20 percent of staff in January 2023 after five years of development and has not disclosed commercial revenue, but its absorption into Google and the Foxconn joint venture (October 2025) signal accelerating commercial intent. Physical Intelligence (Pi) is a research-first foundation model company founded in 2024 with no commercial product or revenue as of March 2026. Its π0.7 model (April 2026) shows emergent generalization across manipulation tasks, and it is reportedly raising $1 billion at an $11 billion valuation. Pi''s VLA (Vision-Language-Action)
    architecture targets lab-to-production transfer. Covariant was an early mover in robotics foundation models (RFM-1, 8B parameters, launched March 2024), but its founders and approximately 25 percent of staff were acqui-hired by Amazon in August 2024 in exchange for a non-exclusive technology license. The remaining company, led by new CEO Ted Stinson, continues to serve non-Amazon logistics customers (apparel, grocery, pharma) but faces corporate uncertainty and narrow moat from competing data accumulators. Gecko Robotics pairs proprietary TOKA inspection robots with the Cantilever AI platform for critical-infrastructure digital twins, reached unicorn status ($1.25 billion valuation) in June 2025, and in March 2026 won a $71 million five-year U.S. Navy IDIQ contract. Gecko''s market is deep in energy, defense, and manufacturing inspection but is structurally narrower than FieldAI''s horizontal ambition. Boston Dynamics (Hyundai-owned) offers Spot, Stretch, and Atlas robots plus the Orbit
    software platform for fleet intelligence. In March 2026, Boston Dynamics announced a direct partnership with FieldAI to extend Spot into uncharted, dynamic environments—making Boston Dynamics simultaneously a hardware partner and a potential software competitor as Orbit expands its AI integration with Google Gemini. Machina Labs focuses on AI-driven robotic sheet-metal forming (RoboCraftsman) for defense and aerospace, with a $124 million Series C (February 2026). It is not a direct competitor to FieldAI''s inspection and autonomy focus but competes for defense budget and OEM robotics mind-share. Viam is an open-source robotic software platform ($117 million total raised) targeting developers who want hardware abstraction across IoT, robots, and industrial machines. Viam competes for the same "brain layer" framing but positions itself as a developer-SDK approach versus FieldAI''s pre-trained AI model. Internal build remains the incumbent: large industrial companies (energy, mining, construction)
    maintain internal robotics and software engineering teams. The unit economics of internal build are difficult to quantify but become the default when no commercial platform meets the required safety certifications or data-residency constraints.

    '
