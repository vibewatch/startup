- id: TP004
  title: Moat Durability / Competitive Risk Register
  columns:
  - Moat Claim
  - Threat
  - Severity
  - Evidence Basis
  - Mitigation / Diligence Ask
  rows:
  - - Physics-first FFM data flywheel
    - Physical Intelligence and open-source VLAs accumulate competing deployment data faster with more capital
    - High
    - Pi raising $1B at $11B valuation (thelec.net); open-source π models available
    - Verify FieldAI's current fleet size and data volume vs. Pi; confirm model-update cadence; assess data exclusivity
  - - On-edge GPS-denied deployment (no-cloud)
    - Google Cloud/Intrinsic cloud-native architecture could adapt to edge if Gemini model compression advances
    - Medium
    - Fanuc/Google partnership (thenextweb.com); NVIDIA Isaac edge compute roadmap
    - Assess edge-model compression trajectory; quantify latency requirements for FieldAI target environments
  - - Hardware-agnostic "universal robot brain"
    - Robot OEMs (Boston Dynamics, Fanuc) could prefer bundled internal AI or exclusive Google/NVIDIA AI partnerships
    - High
    - BD Orbit + Google Gemini integration (bostondynamics.com); Fanuc/Intrinsic partnership (thenextweb.com)
    - Confirm contractual exclusivity (or lack thereof) in Boston Dynamics and other OEM partnerships
  - - Multi-agent fleet coordination
    - Boston Dynamics Orbit already does centralized fleet management; NVIDIA Isaac ROS does multi-agent simulation
    - Medium
    - BD Orbit multi-site fleet management confirmed (bostondynamics.com); Orbit FieldAI partnership covers terrain gap
    - Distinguish FieldAI's real-time multi-agent AI reasoning vs. Orbit's orchestration layer; obtain third-party benchmark
  - - Defense / DoD clearance moat
    - Gecko Robotics already has $71M Navy IDIQ; other DoD primes (FLIR, Teledyne) can contest DoD AI inspections
    - Medium
    - Gecko Navy contract (ubos.tech); FieldAI Federal subsidiary disclosed but no public DoD contracts announced
    - Obtain FieldAI Federal contract pipeline; compare DARPA heritage to Gecko's existing naval certifications
  - - Preference-stack risk (capital structure)
    - $506M in preferences on $2B valuation creates 50% bear-case equity wipeout per independent analysis
    - High
    - 'UpsideList March 2026: "Bear (50%)—NVIDIA Isaac/BD internalize; down-round; common wiped by $506M preferences"'
    - Obtain full cap table, preference terms, and liquidation waterfall; model downside for common equity holders
  - - Broad data diversity across industries
    - Amazon (via Covariant license) accumulates manipulation data at 750,000-robot scale; Google accumulates via Intrinsic/Fanuc
    - High
    - Amazon Covariant license (techcrunch.com); Fanuc/Google 1.1M robot partnership (thenextweb.com)
    - Confirm FieldAI's fleet size across heterogeneous environments; quantify data diversity vs. Amazon/Google scale
  notes: 'Severity ratings are editorial judgments based on evidence strength and capital/distribution differential. "High" reflects a threat that, if realized, could materially reduce FieldAI''s competitive position within 3 years. "Medium" reflects a real but slower-moving or mitigable threat.

    '
