- id: scenarios
  title: Bull, Base, and Bear Scenarios
  body: 'The bull case requires that FieldAI''s revenue is at the high end of estimates ($140M ARR growing at 80–100% year-over-year), that gross margins on the software licensing stream approach 70–80%, that NRR exceeds 120% driven by fleet expansion, and that the company closes a Series B in 2027 at 15–20x forward ARR on a $350–500M ARR base—implying a $5.25–10B valuation and a 2.6–5x return from the $2B mark. The key risks to this scenario are that the revenue figure is unverified, the growth rate is not independently confirmed, and the market environment needs to remain supportive of high AI-software multiples.


    The base case assumes $100M ARR, 40–60% growth, blended gross margins in the 55–70% range, and NRR of 110–120%. On a 2027–2028 Series B at 10–12x forward ARR on a $200–300M ARR base, the valuation would be $2.0–3.6B—a 0–1.8x return from the $2B mark. This implies roughly flat to modest appreciation, appropriate for the risk level.


    The bear case assumes revenue is materially lower ($20–50M ARR), growth slows due to sector headwinds (enterprise adoption friction, macro capex pullback), and multiple compression in AI software drags the implied valuation to $0.4–1.0B at the next round—a 50–80% loss from the $2B mark. Down-round risk is highest in this scenario. Adverse triggers include: a robotics sector-wide valuation reset if Physical Intelligence or Skild AI raise at lower-than-expected multiples; FieldAI customers reducing deployments or not renewing; or evidence that "booked revenue" significantly overstates recognized ARR.

    '
