chapter:
  number: 8
  title: Valuation
  summary: 'FieldAI''s $2B post-money valuation (August 2025) rests on investor conviction rather than verified fundamentals: the best available revenue signal is an anonymous-source report of >$100M booked revenue (April 2026), while third-party estimates range from $5M to $140M ARR, a 28x spread that makes any precise multiple analysis unreliable. Against a comparable set that includes Physical Intelligence ($5.6B at near-zero revenue), Skild AI ($14B on $30M ARR), and Gecko Robotics ($1.25B on industrial inspection revenue), FieldAI''s $2B is not implausible for the category—but the information asymmetry between private-investor diligence and public evidence is unusually wide. The chapter recommendation is TRACK: the thesis is structurally compelling, the investor-quality signal is as strong as it gets, and the valuation is within the range of comparable embodied-AI software companies, but absent access to audited financials no external investor can underwrite the $2B price with high
    confidence.

    '
sections:
- id: valuation-context
  title: Valuation Context and Financing History
  body: 'FieldAI''s last disclosed valuation is $2.0 billion post-money, established when the company announced $405 million raised across two consecutive rounds in August 2025. The most recent round raised $314 million, oversubscribed and co-led by Bezos Expeditions, Prysm Capital, and Temasek; the preceding round raised approximately $91 million at a ~$500M valuation. The company thus quadrupled its valuation in roughly twelve months. GeekWire and Reuters sources describe the two rounds as "Series A and A1." Some pre-diligence references describe the breakdown as $150M (seed) plus $255M (Series A), but this is inconsistent with Reuters'' reporting of a $314M latest round and cannot be confirmed from primary sources; this chapter uses the canonical figures from sibling chapters.


    PremierAlts (accessed May 2026) shows $506.1M total funding across five rounds with a last round of $315M closed in February 2026—potentially reflecting post-announcement secondary SPV activity or a new primary round—at the same $2.0B valuation mark. Form D filings at the SEC confirm investment vehicles "HII Field AI Series I, II, and III, a Series of HII Field AI, LLC," filed in November 2025 and April 2026 (CIKs 0002095306, 0002095305, 0002126354), consistent with special-purpose pooled investment fund structures that commonly aggregate secondary and LP interest in high-profile private companies. No Form D has been filed by "Field Ai, Inc." directly under the California entity, consistent with the company relying on an exemption or using a different legal entity structure.


    Secondary-market activity is active: FieldAI shares trade on the Nasdaq Private Market and at Notice.co (~$34.32/share as of May 2026), and UpsideList lists the company with limited upside signal, suggesting secondary pricing is at or near the $2B headline valuation. PitchBook (archived June 2025) shows 47 employees and "Early Stage VC" deal type, reflecting data lag common to PitchBook''s private-company coverage. The company''s own disclosures of 201–500 LinkedIn employees and >$100M booked revenue (April 2026) suggest material growth since the PitchBook snapshot.

    '
