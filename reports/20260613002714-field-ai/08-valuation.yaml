- id: TV002
  title: Thesis and Anti-Thesis
  columns:
  - Argument
  - Evidence Base
  - What Would Change the View
  rows:
  - - 'Thesis: Hardware-agnostic AI software captures monopoly-like share as robot hardware commoditizes'
    - FFMs deployed across quad/humanoid/wheeled/tracked; hardware-agnostic architecture confirmed by TechCrunch and official sources
    - OEM vertical integration (Boston Dynamics, Figure) captures brain layer; or hyperscaler (Google Intrinsic, NVIDIA Cosmos) commoditizes foundation model
  - - 'Thesis: Founding team has highest field robotics credibility in the sector'
    - DARPA SubT win, NASA JPL, MIT/DeepMind credentials documented; Marc Raibert/Vinod Khosla endorsements on record
    - Key-person risk if CEO departs; CSO or CTO attraction by better-funded competitor
  - - 'Thesis: $405M from elite investors reflects private diligence superior to public data'
    - Oversubscribed; Bezos Expeditions, Temasek, Khosla, NVentures all participated; investor statements confirm commercial conviction
    - Down-round at Series B would contradict private diligence thesis; if investors write down the position, the signal reverses
  - - 'Thesis: >$100M booked revenue in 9 months post-announcement is unusually fast commercial traction'
    - OCBJ April 2026 anonymous sources; GetLatka $140M ARR estimate; CEO stated multi-million-dollar contracts
    - Booked revenue conflated with pipeline; ARR is materially lower; churn reveals customer dissatisfaction
  - - 'Anti-thesis: Revenue is unverified and the range of estimates is 28x wide'
    - Estimates span $5M (CompWorth) to $140M ARR (GetLatka); no audited figure; anonymous OCBJ sourcing
    - Company releases audited ARR; figure above $80M would largely close this gap
  - - 'Anti-thesis: Governance opacity is extreme for a $2B company'
    - No board composition disclosed; no Form D from Field Ai, Inc.; no audited financials; no cap table details
    - Formal data room access under NDA would satisfy; pre-IPO financial reporting would close the gap
  - - 'Anti-thesis: Multiple compression in AI software is a structural 2026–2027 risk'
    - Howard Morgan (First Round Capital) warns AI valuations overheated; Madrona partner notes seed/Series A priced well ahead of fundamentals
    - Sector-wide re-rating upward on proven revenue would negate this; or FieldAI's own Series B step-up would confirm
  - - 'Anti-thesis: Competitors (Physical Intelligence, Skild AI) are raising at higher valuations with comparable or weaker revenue'
    - PI at $11B talks with zero revenue; Skild at $14B on $30M ARR; sector optionality premium inflates all valuations
    - If sector multiples compress and PI or Skild raise flat/down, FieldAI's $2B could look expensive
  notes: 'Thesis rows represent the bull/confirming interpretation; anti-thesis rows represent the bear/challenging interpretation. Both sets are evidence-supported as of May 2026 runDate.

    '
