  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue
    missingEvidence: Audited or independently verified ARR for FieldAI, with revenue recognition policy and breakdown by software licensing vs. hardware integration
    whyItMatters: Without verified revenue, the valuation multiple could be anywhere from 14x to 400x; at 400x the $2B valuation is untenable; at 14x it is defensible
    diligencePath: Request audited P&L and ARR schedule under NDA from management; accept rolling 12-month ARR figure with revenue recognition footnote as minimum
    relatedQuestionRefs:
    - QV003
    - QV012
  - type: private-evidence-only
    severity: blocking
    topic: governance
    missingEvidence: Board composition, liquidation preference waterfall, option pool size, investor rights agreement, and cap table
    whyItMatters: Heavy liquidation preferences in Series A/A1 could reduce common equity value to near zero in base case scenarios; governance structure is unknown
    diligencePath: Request cap table summary and waterfall analysis from Series A lead counsel; confirm preference structure; verify independent board representation
    relatedQuestionRefs:
    - QV025
    - QV014
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin by revenue stream, NRR cohort data, CAC, and payback period
    whyItMatters: These three metrics determine whether the business model justifies an AI-native software multiple (21x+) or a hybrid services multiple (8–12x)
    diligencePath: Request contribution margin waterfall and quarterly cohort retention data under NDA
