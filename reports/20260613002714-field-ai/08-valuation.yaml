- id: recommendation-and-diligence
  title: Recommendation, Kill Triggers, and Final Diligence Asks
  body: 'The recommendation is TRACK (medium confidence, high risk, stretched valuation). The investment thesis is structurally sound: embodied-AI software with physics-first architecture and field-proven deployments, elite founder-market fit, and the strongest possible investor syndicate. But no external investor can underwrite the $2B price without access to audited financials, verified ARR, and disclosed gross margin—the information asymmetry is the dominant risk, not the technology or team quality. At the current $2B mark, the entry price is priced for execution on the high end of the revenue range; any downward revision to revenue or a sector-wide multiple compression would result in material dilution.


    This recommendation would upgrade to BUY if three conditions are met: (1) audited or independently verified ARR of ≥$100M with ≥40% year-over-year growth is disclosed; (2) blended gross margin of ≥60% is confirmed; and (3) net revenue retention of ≥110% is evidenced by cohort data. Absent these, TRACK remains appropriate: monitor for company-disclosed financial milestones, Series B announcement and implied valuation step-up, strategic partnership revenue disclosures, and customer concentration risk signals. The recommendation would downgrade to AVOID if: (1) a Series B is announced at a valuation below $2B (down-round); (2) a major customer departure or deployment failure becomes public; or (3) the reported >$100M booked revenue is materially revised downward.


    Governance is a notable gap: board composition is undisclosed, liquidation preferences and option pool size are unknown, and no independent financial reporting exists. For any potential investor, these must be diligenced before any commitment. The company''s strategic positioning as the "software brain" layer of industrial robotics is genuinely differentiated and difficult to replicate quickly, but the combination of governance opacity and valuation stretch warrants a disciplined TRACK posture until commercial proof points are publicly verifiable.

    '
