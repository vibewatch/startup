- id: comparable-analysis
  title: Comparable Valuations and Market Context
  body: 'The embodied-AI and industrial-robotics software sector provides a useful but imperfect comparable set. Within the embodied-AI software peer group, Physical Intelligence is in talks for $11B at near-zero disclosed revenue (March 2026)—an extreme outlier driven by research prestige and optionality value, not current commercial traction. Skild AI raised at $14B in January 2026 with $30M ARR growing exponentially, implying a ~467x forward multiple on a small base—again, an early-stage optionality multiple rather than a fundamental one. These comparables confirm that the investor community is placing high optionality premiums on embodied-AI software platforms, but the wide range ($14B–$5.6B at near-zero revenue) reflects enormous uncertainty in terminal-value assumptions.


    FieldAI''s $2B at $100–140M ARR (if those estimates are correct) actually implies a more moderate multiple (14–20x) than its two closest embodied-AI software peers, making it look attractively priced within the category if revenue is real. However, if the true revenue figure is $5–20M, the implied multiple (100–400x) would be among the most aggressive in the sector. The hardware-integrated comparables—Apptronik ($5.3B, humanoid hardware+software) and Gecko Robotics ($1.25B, critical infrastructure inspection) — are structurally different business models with lower software margins but more verifiable revenue, pulling comps downward for a pure-software valuation. Houlihan Lokey''s Q1 2026 report on AI vertical software found that AI-native software companies commanded a median EV/Revenue of 21.2x in VC rounds, versus 8.5x for AI-enabled software and 5.5x for legacy SaaS. At $100M ARR and 21x, FieldAI would support a ~$2.1B valuation—broadly consistent with its current mark. The key risk
    is that this median applies to companies with verified financials, whereas FieldAI''s revenue is entirely unverified externally.

    '
