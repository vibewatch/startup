- id: TV005
  title: Thesis-Break and Kill Triggers
  columns:
  - Trigger
  - Threshold / Measurable Event
  - Transmission to Thesis
  - Action Implication
  rows:
  - - Down-round at Series B
    - Series B closes at valuation below $2.0B
    - Directly contradicts private-investor thesis; signals revenue disappointment or sector repricing
    - Downgrade to AVOID; exit or reduce exposure immediately
  - - Major customer churn or deployment failure
    - Publicly announced customer exit or safety incident causing suspension of deployments
    - Undermines "hundreds of sites, three continents" commercial traction narrative
    - Review position; determine whether isolated or systemic before acting
  - - Revenue revision materially below $100M booked
    - Company-disclosed or investigative journalism reveals booked revenue <$50M or bookings ≠ ARR
    - Valuation multiple jumps to 40x+ on real ARR; beyond reasonable range for current stage
    - Downgrade to AVOID; multiple compression to 10–15x would imply $500M–750M valuation
  - - Competitive displacement by hyperscaler
    - NVIDIA Cosmos, Google Intrinsic, or Amazon AWS Robotics announces comparable FFM service
    - Pricing pressure on licensing fees; platform risk materializes; moat questions arise
    - Reassess defensibility; downgrade to TRACK or AVOID depending on scope
  - - Governance or legal risk event
    - IP dispute, regulatory action, key-person departure (CEO or CSO), or SEC enforcement
    - Destabilizes team and investor confidence; raises execution risk
    - Material risk event → downgrade to TRACK pending resolution; severe event → AVOID
  notes: 'Triggers are defined at observable thresholds to enable monitoring without access to private financial data. All five represent thesis-break conditions; any one of them materially changes the recommendation. The down-round trigger is the single most actionable public signal.

    '
