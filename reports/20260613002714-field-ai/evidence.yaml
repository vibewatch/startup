    severity: minor
    topic: hq-location
    missingEvidence: >
      Some secondary databases and pre-diligence sources list FieldAI's headquarters as San Francisco, California. No
      primary source—including FieldAI's own press releases, TechCrunch, CNBC, Reuters, or OCBJ—places the company in
      San Francisco. The company has been in Mission Viejo, CA (2023–2025) and Irvine, CA (late 2025 onward).
    whyItMatters: >
