evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: >
      FieldAI's annual recurring revenue, total revenue, gross margin, and customer contract values are private and have
      not been disclosed. The only public signal is ">$100M booked revenue" from anonymous sources cited by OCBJ.
    whyItMatters: >
      Revenue is the primary commercial traction metric; the $2B valuation implies a high revenue multiple. Without
      disclosed revenue, it is impossible to assess whether the valuation is justified on fundamentals.
    diligencePath: >
      Request audited financial statements or management accounts during due diligence; verify the ">$100M booked
      revenue" figure and decompose into contracted ARR vs. one-time services.
    relatedQuestionRefs:
      - QO015
      - QO017
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >
      FieldAI's board composition, voting rights, investor protective provisions, and governance structure have not been
      publicly disclosed.
    whyItMatters: >
      Board composition determines who controls major decisions including future fundraising, M&A, and CEO succession.
      Key-person risk in CEO Agha is elevated without disclosed succession or governance guardrails.
    diligencePath: >
      Obtain cap table and shareholders' agreement from the company; request board meeting minutes from the last four
      quarters and investor rights agreement.
    relatedQuestionRefs:
