    severity: minor
    topic: round-breakdown
    missingEvidence: >
      The canonical pre-diligence description of FieldAI's funding as "$150M seed (Aug 2024) + $255M Series A (Aug
      2025)" conflicts with Reuters' reporting of a $314 million most-recent round and a $500 million prior-round
      valuation. The inferred first-round amount is ~$91M. No primary source independently confirms the $150M + $255M
      breakdown.
    whyItMatters: >
      The precise round structure, dilution profile, and per-round investor ownership percentages are material to cap
      table analysis and future liquidation preference calculations.
    diligencePath: >
      Request official capitalization table and closing documents for all rounds from company counsel; cross-reference
      with SEC Form D filings if available.
