      - number: '3.2'
        title: 竞争者画像与能力对比
        blocks:
          - type: paragraph
            body: >
              Intrinsic 已于 2026 年 2 月并入 Google，提供 Flowstate，这是面向工业机器人的网页版开发与仿真环境。该平台在 KUKA、Fanuc、Universal Robots
              等硬件上保持无关性，并利用 Google 的 Gemini AI 模型进行视觉和推理。2026 年 5 月与 Fanuc 的合作，让 Google 触达 1.1 million
              台已部署工业机器人——这是任何创业公司都无法匹敌的分销渠道。Intrinsic 在 2023 年 1 月、五年开发后裁员 20%，尚未披露商业收入，但被 Google 吸收以及 Foxconn 合资公司（2025
              年 10 月）显示商业化意图正在加速。Physical Intelligence（Pi）是一家研究优先的基础模型公司，成立于 2024 年，截至 2026 年 3 月没有商业产品或收入。其 π0.7
              模型（2026 年 4 月）在操作任务中显示出涌现泛化能力，据称正在以 $11 billion 估值融资 $1 billion。Pi 的
              VLA（Vision-Language-Action）架构瞄准从实验室到生产的迁移。Covariant 是机器人基础模型早期玩家（RFM-1，8B 参数，2024 年 3 月发布），但其创始人和约 25% 员工于
              2024 年 8 月被 Amazon 收购式招聘，交换条件是一份非独占技术许可。剩余公司由新 CEO Ted Stinson 领导，继续服务非 Amazon
              物流客户（服装、杂货、医药），但面临公司不确定性，以及竞争数据积累者带来的窄护城河。Gecko Robotics 把自有 TOKA 巡检机器人与 Cantilever AI
              平台结合，为关键基础设施做数字孪生，2025 年 6 月达到独角兽地位（估值 $1.25 billion），并于 2026 年 3 月赢得美国海军 $71 million、五年期 IDIQ 合同。Gecko
              在能源、防务和制造巡检中很深，但结构上窄于 FieldAI 的横向野心。Boston Dynamics（Hyundai 旗下）提供 Spot、Stretch 和 Atlas 机器人，以及面向机队智能的 Orbit
              软件平台。2026 年 3 月，Boston Dynamics 宣布与 FieldAI 直接合作，把 Spot 延伸到未知、动态环境中——这让 Boston Dynamics
              同时成为硬件伙伴和潜在软件竞争者，因为 Orbit 正在扩大与 Google Gemini 的 AI 集成。Machina Labs 专注 AI
              驱动的机器人钣金成形（RoboCraftsman），面向防务和航空航天，2026 年 2 月完成 $124 million Series C。它不是 FieldAI
              巡检和自主能力重点的直接竞争者，但会争夺防务预算和 OEM 机器人心智。Viam 是开源机器人软件平台（累计融资 $117 million），面向希望在 IoT、机器人和工业机器上做硬件抽象的开发者。Viam
              竞争同一个“大脑层”叙事，但把自己定位为开发者 SDK 路径，而 FieldAI 是预训练 AI
              模型。内部自建仍是既有方案：大型工业公司（能源、采矿、建筑）保有内部机器人和软件工程团队。内部自建的单位经济难以量化，但当没有商业平台满足所需安全认证或数据驻留约束时，它会成为默认选择。
