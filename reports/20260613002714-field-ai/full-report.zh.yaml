      - number: '4.2'
        title: 资本充足性与前瞻跑道
        blocks:
          - type: paragraph
            body: >
              FieldAI 的两轮融资历史已在公司概览章节详述。就资本充足性而言，关键输入包括：截至 2025 年 8 月累计融资 $405M；第二轮（$314M）于 2025 年 8 月超额认购完成，由 Bezos
              Expeditions、Prysm Capital 和 Temasek 共同领投，Khosla Ventures、NVentures（NVIDIA）、Intel Capital、Canaan
              Partners、BHP Ventures 和 Emerson Collective 参与。第一轮（约 $91M）于 2024 年以 $500M 估值完成；Gates Frontier 和 Samsung
              被列为上一轮投资人。


              手头现金未披露。月烧钱速度未披露。公司员工数轨迹——从 2024 年底约 30 人增至 2025 年 8 月公告时约 130 人，并明确计划到 2025 年底翻倍至约 260 人——意味着固定成本基数快速抬升。按
              200–260 名员工、每人平均全负担成本 $250K–$350K（与 Irvine, CA 以及分布式工程团队相符）估算，仅年化薪酬支出就为 $50–90M/year，对应每月劳动力运行成本约
              $4–8M。再加上全球部署费用、云基础设施、硬件载荷成本和 G&A，总月烧钱估计为 $5–10M。低端情景下，累计融资 $405M、每月烧钱 $5M，意味着从创立起约 81 个月总跑道；每月 $10M 时约为
              40 个月。若抵扣假设的 $100M+ 累计收入，2025 年 8 月融资完成后的净跑道估计为 24–48 个月；若收入不加速或成本没有意外上升，下一轮融资触发点落在 2027 年末至 2029 年初。


              FieldAI 尚未宣布任何债务工具、项目融资义务、收入型融资或授信额度。公司资本结构看起来是纯股权。与垂直整合机器人公司不同，FieldAI 不制造硬件，这显著降低了相较同行的营运资本和库存融资需求。
