      - number: '6.4'
        title: 留存、扩张与集中风险
        blocks:
          - type: paragraph
            body: >
              FieldAI 没有披露任何留存指标——截至 2026 年 5 月，任何公开声明、新闻稿或投资人沟通中都没有出现
              NRR、GRR、队列数据、流失率、合同续约率或客户满意度评分。公司是私营企业，尚未披露收入；没有监管文件强制这些披露。

              建筑垂直的定性留存信号略偏正面。Big-D 多年活跃部署，并明确计划把 FieldAI 扩展到未来每个项目，是目前最强的留存和扩张信号。DPR 的企业风投部门（WND Ventures）称 2025 年 8
              月融资是“人们可以期待机器人领域更大融资轮的信号”，并提到 DPR
              场地帮助测试概念验证——措辞暗示双方关系仍在持续。超额认购的融资轮被明确归因于“多个扩张合同”，从财务信号上佐证重复购买，虽然具体合同价值和客户名称仍未披露。

              结构性集中风险较高。按公开确认的生产部署看，FieldAI 的建筑客户基础由四个账户组成：Big-D、DPR 和两家未具名 ENR 公司。若失去任一具名锚定客户，可见证据基础将消失超过
              50%。能源、采矿和制造垂直没有公开具名客户，意味着建筑之外的生产化证据仍是缺口。Certis 将公司带入安防垂直，提供垂直多元化，但它是伙伴兼运营方，不是直接企业 SaaS 账户。

              主要垂直还存在更广泛的宏观逆风：BuiltWorlds 2025 Equipment & Robotics Benchmarking 报告发现，承包商中的活跃建筑机器人使用率同比从 65% 降至
              46%，尽管正面情绪升至 95%。下降被归因于行业从实验性试点转向更有选择、更成熟的实施——这一动态可能放慢 FieldAI 新客户获取，同时利好其现有生产账户。企业销售周期长、涉及多方审批、客户名称受 NDA
              限制，意味着 FieldAI 真实客户基础几乎肯定大于公开证据所示，但没有独立方法可以验证。
