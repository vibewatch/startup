  - id: FU001
    title: 客户旅程图 —— FieldAI 企业级工业买家
    type: journey-map
    layout: wide
    summary: |
      展示典型企业级工业客户从认知到生产部署、再到车队扩张的旅程，覆盖 FieldAI 的主要和次要客群。
    data:
      items:
        - id: stage-awareness
          label: 1. 认知
          actor: 企业副总裁 / 总监（技术、创新、VDC 或运营）
          description: 客户通过行业会议、合作伙伴转介绍（Boston Dynamics、NVIDIA）、媒体报道，或其他承包商的同业推荐发现 FieldAI。
          channels:
            - 行业会议
            - OEM 伙伴网络（Boston Dynamics、NVIDIA）
            - 媒体报道与分析师报告
        - id: stage-discovery
          label: 2. 了解 / 演示
          actor: 技术或创新总监；项目高管
          description: 技术评估；CEO 层级或 VP 参与；在活动工地现场演示，或用数字孪生走查。FieldAI 展示 BIM 集成、自主任务模式和传感器载荷。
          channels:
            - FieldAI 直销团队
            - fieldai.com 产品页
            - 合作伙伴引荐与转介绍
        - id: stage-pilot
          label: 3. 概念验证 / 试点
          actor: 现场主管；安全经理；VDC 总监
          description: 在单个项目现场限期部署。机器人车队规模有限；只跑一种任务类型（巡检或文档记录）。现场主管和一线团队是否买账，在这个阶段验证。
          channels:
            - 有监督的现场部署
            - 客户反馈闭环
            - 现场主管评估
        - id: stage-production
          label: 4. 生产部署
          actor: 现场主管；技术总监；运营负责人
          description: 在活动工地上反复执行自主任务；FieldAI 接入 BIM、项目管理和安全报告工作流。数据飞轮开始丰富站点专属模型。
          channels:
            - 扩大的机器人车队
            - 日常自主运营
            - BIM 与项目管理集成
        - id: stage-expansion
          label: 5. 车队 / 企业级扩张
          actor: 创新总监；CTO；运营 VP
          description: 多站点铺开；增加任务类型（巡检 + 安防 + 运输）；多年合同续约。Big-D 计划部署到每个未来项目的轨迹，体现了这一阶段。
          channels:
            - 新站点上线
            - 借助数据飞轮改进模型
            - 通过 FieldAI 云管理企业车队
    approximationNotes: |
      阶段顺序根据可获得的客户证据（Big-D 两年轨迹、DPR 从 PoC 到生产的路径）和公司材料推断。并非所有客群都有已确认的生产部署；能源、矿业和联邦市场仅按公司披露定位纳入。
