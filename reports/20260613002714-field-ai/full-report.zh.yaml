      - number: '2.2'
        title: 市场规模测算视角
        blocks:
          - type: paragraph
            body: >
              没有单一公开分析师数字能干净覆盖 FieldAI 的可服务可触达市场，因为多数分析师报告要么定义过宽（包含硬件或全部工业自动化），要么过窄（只覆盖一个垂直）。最相关的横向数字，是 Global Market
              Insights 对 AI 驱动工业机器人市场的估计：2026 年 $17.9 billion，按 7.1% CAGR 增长至 2035 年 $33.3 billion。该数字包含硬件，但可提示 FieldAI
              所瞄准的 AI 增强机器人软件层规模。另据 The Business Research Company，工业人工智能市场（所有软件、平台、解决方案）2026 年为 $13.69 billion，并以 51.1%
              CAGR 爆发式增长至 2030 年 $73.54 billion；这是覆盖制造、能源和物流的最宽用例集合，并非专指非结构化环境。


              对 FieldAI 的四个核心垂直，垂直特定规模给出更清晰信号：建筑机器人：2026 年 $7.79 billion（TBRC）和 $1.4 billion（Grand View
              Research，仅建筑机器人窄口径）；差异反映定义范围不同，较低数字可能更适合仅衡量机器人平台。采矿机器人：2026 年 $1.7 billion（PMR），按 9.8% CAGR 增长至 2033 年
              $3.3 billion。油气机器人：2026 年 $3.8 billion（MarkWide Research），按 14.6% CAGR 增长至 2035 年 $12.96 billion；仅巡检子细分
              2026 年估计为 $0.93 billion（Fortune Business Insights）。具身 AI 市场（跨垂直、所有物理 AI 系统）预计到 2030 年达到 $7.24 billion，CAGR
              为 17.5%（Research and Markets）。


              对 FieldAI 纯软件、非结构化环境市场做保守自下而上 SAM 估算——把 15–25% 的软件占比假设应用到 $13.2 billion 的垂直硬件与服务市场合计（2026 年建筑 + 采矿 +
              油气机器人）——得到 FieldAI 当前垂直在 2026 年可触达软件支出的 SAM 约为 $2–3.3 billion。该估算天然不确定，置信度低；FieldAI 未发布 SAM
              数字，也没有分析师发布专门的“面向非结构化环境工业机器人的 AI 软件”市场估算。IFR 的 World Robotics 2025 报告记录，2024 年工业机器人安装量为 542,000 台，全球在役量为
              4.66 million 台；其中部署在 FFMs 能创造价值的非结构化环境中的比例未被单独量化。分析师估算区间很宽（见 TM002），相互矛盾的规模数据作为证据缺口保留。
