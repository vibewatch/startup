chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >
              FieldAI 是一家位于加州 Irvine 的机器人 AI 软件公司，2023 年由 NASA Jet Propulsion Laboratory（JPL）老兵 Ali Agha
              创立。公司的核心判断是，工业机器人普及的约束不在硬件，而在智能：机器人缺少适应性强、能感知风险的自主能力，难以在非结构化真实环境中稳定工作。FieldAI 用 Field Foundation
              Models（FFMs）来解这个问题。FFMs 是一类“物理优先”的基础模型，训练数据来自物理部署中的传感器数据，而不是互联网文本或图像。FFMs
              充当通用软件大脑，可安装到不同机器人平台上——四足机器人、人形机器人、轮式漫游车、履带车辆以及乘用级自动驾驶车辆——不需要逐平台重新编程、预建地图、GPS 或云连接。机器人完全在边缘端实时决策。FieldAI
              面向建筑、能源、采矿、制造、物流、城市配送、巡检和国防等企业工业客户销售平台。公司明确不制造机器人；它是一家纯 AI 软件供应商，与机器人 OEM 合作，把软件部署在客户自有或第三方机器人硬件上。硬件无关模式把
              FieldAI 放在机器人技术栈的“大脑层”，类似企业计算中 OS 或中间件层对硬件的抽象。Bill Gates 对公司的描述很直接：FieldAI “为其他公司的机器人开发 AI 软件，让它们能感知环境、不靠
              GPS 导航，甚至彼此通信。”主要收入渠道是 B2B 软件授权和硬件集成服务；据称订阅价格从每年数万美元到 $500,000 不等，取决于部署规模。截至 2026 年 4 月，知情人士称公司已拥有超过 $100
              million 的预订收入，并与大型工业客户建立合作关系。
