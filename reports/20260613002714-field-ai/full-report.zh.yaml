      - number: '4.5'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >
              FieldAI 的财务画像是：资本充足、收入早期、软件业务增长够快，能在 24 个月吸引 $405M 融资，但外部承销仍然看不清。$2B 估值完全由投资人信号、增长轨迹和团队履历支撑，而不是经验证的财务基本面。若
              $140M ARR 估算准确，且同比增长 50–100%，这一估值仍在品类开创型 AI 软件公司的范围内；若 ARR 明显更低或增长更慢，倍数就难以解释。前瞻资本充足性看起来稳固：公司累计融资
              $405M，对应纯软件运营模式（无硬件制造资本开支、无库存融资），并披露 >$100M 预订收入，意味着下一轮融资前至少有 2–3
              年经营现金跑道。最大的尽调风险不是偿付能力，而是信息不对称——公开可核验内容与承销估值所需信息之间的缺口，对一家 $2B 公司而言异常大。
            claimRefs:
              - CI030
              - CI031
              - CI032
      - number: '4.6'
        title: 附录
        blocks:
          - type: callout
