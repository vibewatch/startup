        - 高 —— 未发布就绪文档
        - 确认欧盟合规计划状态；索取内部风险评估文件
      - - 数据主权与跨境数据传输违规（客户运营数据）
        - 低至中 —— FieldAI 从三大洲客户现场采集传感器 / 视频数据
        - 中 —— GDPR 执法、客户合同违约、声誉受损
        - 未知 —— 未发现 DPA 或跨境传输机制文件
        - 中 —— 未确认存在标准合同条款或 DPA
        - 索取 DPA 模板、跨境传输机制和数据留存政策
