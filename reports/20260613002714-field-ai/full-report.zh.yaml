  - id: TE003
    title: 技术 / 运行架构表
    columns:
      - 层 / 组件
      - 角色
      - 关键依赖
      - 风险
    rows:
      - - 多模态感知栈
        - 将视觉、LiDAR、文本、音频、热成像、事件相机输入统一的信念状态表征
        - 合作机器人上的传感器硬件（Spot、Unitree 等）
        - 新平台上的传感器退化或不支持的模态会降低感知质量
      - - 信念空间世界模型（FFM 核心）
        - 概率式环境表征；在未知场景中管理不确定性
        - 来自运营部署的真实世界训练数据
        - 分布偏移：训练语料未覆盖的新环境会带来保守吞吐成本
      - - Dynamics Foundation Model（DFM）
        - 集成机器人运动学 / 动力学模型，支持跨平台执行
        - 机器人 URDF / 动力学模型；平台特定校准
        - 每种新机器人形态都需要 DFM 适配；集成工作深度未发布
      - - Multiagent Foundation Model（MFM）
        - 机队级协调；共享环境推理
        - 机器人间通信（边缘 mesh 或本地网络）
        - 密集工业环境中的通信故障或带宽限制
      - - 边缘计算运行时
        - 在机器人本体上完整运行 FFM 推理，不连接云
        - 设备端加速硬件（推测为 NVIDIA Jetson 或同类）
        - 硬件采购和兼容性未公开记录；功耗 / 散热限制会约束可选机器人平台
      - - NVIDIA Omniverse NuRec 管线
        - 将运营传感器数据转换为高保真 3D 数字孪生，供客户和 sim-to-real 使用
        - NVIDIA Omniverse 授权；Data Factory Blueprint 的 Azure 工具链
        - 依赖 NVIDIA 商业栈；存在 Omniverse 平台连续性和授权风险
      - - Isaac Sim / Isaac Lab 训练管线
        - 在可用于仿真的重建环境中训练并验证策略
        - 重建的数字孪生；NVIDIA Isaac 计算基础设施
        - 仿真到现实的差距：机器人遇到仿真中未覆盖的陌生现实特征时，行为会趋于保守
      - - 合成数据管线（Cosmos + OSMO）
        - 用合成训练场景补充真实部署数据
        - NVIDIA Cosmos 开放世界模型；NVIDIA OSMO；Microsoft Azure
        - 三方依赖（NVIDIA、Microsoft、FieldAI）扩大了集成面，也加重了供应商锁定
    notes: >
      架构层来自 FieldAI 官方产品页、NVIDIA 合作新闻稿，以及 FieldAI 的 NVIDIA Omniverse 博文。边缘计算硬件细节未公开披露；NVIDIA Jetson 是基于行业惯例和 NVIDIA
      合作背景的推断。依赖项只反映已记录的集成点；未披露组件可能仍然存在。
