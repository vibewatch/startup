      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              结构性增长驱动横跨数十年，且证据充分。劳动力短缺最为直接：美国西部矿业劳动力超过 50% 预计将在 2029 年前退休，全球建筑业也长期面对熟练工短缺。美国 Mine Safety and Health
              Administration（MSHA）在 2024 财年记录了 31 起采矿死亡事故，致命伤害率为每 200,000 工时 0.0110，持续推动监管要求在最危险任务中采用自主替代方案。IFR 的 World
              Robotics 2025 数据显示，全球工业机器人年安装量到 2028 年将保持在 500,000+，随着硬件规格趋同，软件定义自主能力越来越成为差异化因素。Deloitte 的 2026 TMT
              Prediction 确认，专用 AI 基础模型——区别于消费级 LLM——是可能在 2026 至 2030 年间把机器人从命令控制推向真正泛化自主的技术突破。


              采用约束同样实质。McKinsey 的 Industrial Robotics Survey 记录，71% 的工业公司把硬件资本成本列为机器人采用主要障碍，61%
              提到缺少内部经验；装配、表面处理、焊接等复杂活动在中短期内不太可能自动化。Deloitte 观察到，自 2021 年以来，工业机器人年销量基本持平在约 500,000
              台，并警告除非数据质量、集成复杂度和网络安全瓶颈被解决，市场可能维持相对温和的年增长。最关键的是，Construction Dive 报道 FieldAI 融资时引用的 BuiltWorlds 2025
              Equipment and Robotics Benchmarking 报告发现，报告活跃使用机器人的建筑公司比例从 2024 年的 65% 降至 2025 年的 46%，尽管正面评价从 74% 跳升至
              95%。热情与部署之间的背离，是近期市场的核心张力，也是 FieldAI 最直接的执行风险：能否把强劲试点表现转化为持久企业收入。高资本开支周期、与遗留工厂系统的 OT/IT
              集成摩擦、较长回本期要求，以及油气运营商资本环境波动，都是进一步的结构性逆风。口径中的市场规模与实际部署产品之间，确实存在重大缺口。
