  - id: TI003
    title: 单位经济模型——已披露、估计与未知项
    columns:
      - 指标
      - 数值 / 估计
      - 置信度
      - 重要性
      - 尽调问题
    rows:
      - - 毛利率（软件授权）
        - 估计 65–80%（企业 AI 软件行业基准）
        - 低——估计值；未披露
        - 长期现金生成的主要驱动项；必须高于边缘计算 + 支持的边际成本
        - 向管理层账户索取按收入来源拆分的毛利率瀑布
      - - 毛利率（硬件集成服务）
        - 估计 20–45%（现场服务和集成工作）
        - 低——估计值；未披露
        - 服务毛利率会稀释综合毛利率；服务与授权的占比至关重要
        - 披露服务与软件收入拆分及各自毛利率
      - - 综合毛利率
        - 估计 55–75%（取决于授权 / 服务组合）
        - 低——估计值；未披露
        - 估值相关：软件级毛利率能支撑高溢价倍数；混合型毛利率不行
        - 索取最新 P&L 或贡献毛利数据
      - - 获客成本（CAC）
        - 未披露；考虑 12–24 个月销售周期，估计每个企业客户 $200K–$1M
        - Unknown
        - 高 CAC 叠加短回本周期是现金流风险；回本慢则需要粘性 NRR 支撑
        - 按客户分群索取综合 CAC 和回本周期
      - - 净留存率（NRR）
        - 未披露；官方公告提到「扩张合同」
        - Unknown
        - NRR >120% 将验证落地后扩张模式，并显著抬高 LTV 估计
        - 索取队列留存数据；确认扩张合同是否提高 ACV
      - - 平均合同金额（ACV）
        - 基于数百万美元级交易说法和定价区间，估计 $300K–$2M
        - 低——估计值
        - ACV 决定 LTV/CAC 分析；估计区间很宽，说明信息缺口大
        - 披露 ACV 四分位数；确认 ACV 是否包含集成费
      - - 人均收入
        - 估计 ~$900K–$1M（若 $140M ARR / 150 名员工）
        - 低——分子和分母都是估计值
        - 若准确，这是强生产率信号；验证软件模式的可扩展性
        - 同时确认员工数和 ARR，以验证该比率
      - - 烧钱倍数（每新增 $1 ARR 消耗资本）
        - 估计 1.5x–3x（与激进扩张期 AI 同业一致）
        - 低——估计值；未披露
        - 高烧钱倍数意味着资本效率低；高效增长目标应 <1.5x
        - 向管理层索取滚动 12 个月现金消耗和新增 ARR
    notes: |
      所有单位经济模型数值都由可比上市公司基准和可观察经营数据（员工数、定价区间、交易规模说法）估算得出。没有经审计数字。置信度一致偏低；这些估计应作为情景建模的方向性输入，而非已确认指标。
