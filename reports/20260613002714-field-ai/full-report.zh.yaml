      - number: '8.5'
        title: 建议、否决触发点与最终尽调要求
        blocks:
          - type: paragraph
            body: >
              建议为 TRACK（中等信心、高风险、估值偏紧）。投资论点在结构上成立：具身 AI 软件具备物理优先架构和实地验证部署，创始人-市场匹配度顶级，投资人集团也几乎是最强配置。但外部投资者若拿不到经审计财报、经验证
              ARR 和披露毛利率，就无法承销 $2B 价格——主导风险是信息不对称，不是技术或团队质量。以当前 $2B 标记看，入场价格已经假设收入区间高端能兑现；任何收入下修或板块整体倍数压缩，都会造成实质稀释。


              若满足三个条件，建议可上调至 BUY：(1) 披露经审计或独立验证的 ARR ≥$100M，且年同比增长 ≥40%；(2) 确认混合毛利率 ≥60%；(3) 用 cohort 数据证明净收入留存
              ≥110%。否则，TRACK 仍合适：继续跟踪公司披露的财务里程碑、Series B 公告及隐含估值跃升、战略合作收入披露和客户集中度风险信号。若出现以下情况，建议应下调至 AVOID：(1) Series B
              公告估值低于 $2B（down-round）；(2) 重大客户流失或部署失败公开；或 (3) 报告的 >$100M 已预订收入被大幅下修。


              治理是明显缺口：董事会构成未披露，清算优先权和期权池规模未知，也没有独立财务报告。任何潜在投资者在承诺前都必须尽调这些事项。公司作为工业机器人「软件大脑」层的战略定位确实差异化，且难以快速复制；但治理不透明叠加估值拉伸，要求投资者保持纪律性的
              TRACK 姿态，直到商业验证点可被公开确认。
