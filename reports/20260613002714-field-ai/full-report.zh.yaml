      - number: '7.2'
        title: 运营、安全与网络安全风险
        blocks:
          - type: paragraph
            body: >
              FieldAI 的核心价值主张——自主机器人在非结构化、安全关键环境中运行——同时也是最高的运营风险面。由 FFM 驱动的机器人完全在边缘端决策，不依赖
              GPS、地图或云连接。模型在新环境中的一次推理错误（例如训练数据未覆盖的碎片堆放形态，或意外穿过预授权机器人路径的人）可能在建筑、采矿或能源作业等高后果场景中造成身体伤害、财产损失或任务失败。2026
              International AI Safety Report 将“失控场景”和“真实世界可靠性测试不足”列为快速发展的自主系统中最紧迫的两类风险，直接适用于 FieldAI 的产品领域。2025 年广泛报道的一起
              Unitree H1 机器人在人类工人附近故障事件，以及 SRES 对 CES 2026 的安全分析中提到“当机器人与人类共享开放工作空间时，现有工业安全协议往往不足”，都说明更广泛竞争同类——并非
              FieldAI 本身——已经出现公开安全失败，这会塑造客户尽调要求、采购标准和潜在诉讼预期。

              截至 2026 年 5 月，尚无涉及 FieldAI 驱动机器人的公开安全事件。不过，公司没有发布性能基准、安全验证测试报告或第三方安全认证（工业机器人 ISO 10218、工业网络安全 IEC
              62443、或数据处理 SOC 2），意味着企业客户和投资人无法独立核验剩余风险水平。NIOSH Center for Occupational Robotics Research 和 OSHA
              都记录了工业场景中严重机器人相关工伤的基线；FieldAI
              在活跃建筑工地和采矿作业中的部署，恰好把机器人放进这些事故最常见的场景。公司自身的部署叙事——三大洲数百个场地——也会在部署规模扩大时，提高遇到首个不利事件的概率。

              网络安全方面：FieldAI 机器人会把机队数据上传到云分析平台，并与 NVIDIA Omniverse 和 Isaac 基础设施通信。未发现公开 DPA、安全白皮书、渗透测试报告或 SOC 2
              认证。若攻击者能够伪造设备端传感器数据，或向机队管理平面注入命令，可能造成物理伤害。工业 IoT 和运营技术（OT）安全标准（IEC
              62443）尚未确认已实施。若安全事件先于正式认证发生，这些缺口会带来实质剩余暴露。
