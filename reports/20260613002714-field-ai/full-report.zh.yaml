      - CR028
      - CR029
      - CR030
      - CR031
  - id: FV001
    title: 建议逻辑链
    type: flow
    layout: wide
    summary: |
      从证据质量到估值评估，再到最终观察建议的决策逻辑，并显示哪些证据升级会改变判断。
    data:
      nodes:
        - id: team
          label: 创始团队信号
          detail: Ali Agha（DARPA SubT/JPL）、Omidshafiei（DeepMind）、Fan（DARPA RACER）→ 强正向
        - id: investors
          label: 投资人质量信号
          detail: Bezos Expeditions、Khosla、NVentures、Temasek、Intel Capital → 超额认购 → 强正向
        - id: technology
          label: 技术差异化
          detail: 物理优先 FFM；硬件无关；边缘推理 <100ms；联邦学习 → 中强正向
        - id: revenue
          label: 收入证据质量
          detail: 未验证：$5M–$140M 区间；OCBJ 匿名来源；无审计财务 → 重大缺口
        - id: valuation
          label: 估值评估
          detail: $2B 对应未验证 $100–140M ARR = 14–20x；若按 $5M = 约 400x；如果收入真实，偏高但仍在可比区间内
        - id: governance
          label: 治理不透明
          detail: 未披露董事会；运营实体没有 Form D；无 cap table 细节 → 显著风险
        - id: recommendation
          label: 建议：观察
          detail: 强投资逻辑 + 顶级投资人，抵消部分未验证收入和估值拉伸风险 → 等证明点出现前维持观察
        - id: upgrade_path
          label: 升级至买入的路径
          detail: 经审计 ARR ≥$100M + GM ≥60% + NRR ≥110% → 在 $2B 或接近 $2B 时升级至买入
      edges:
        - from: team
          to: recommendation
          label: +
        - from: investors
          to: recommendation
          label: +
        - from: technology
          to: recommendation
          label: +
        - from: revenue
          to: recommendation
          label: 缺口 → 谨慎
        - from: valuation
          to: recommendation
          label: 偏高 → 观察
        - from: governance
          to: recommendation
          label: 不透明 → 观察
        - from: recommendation
          to: upgrade_path
          label: 升级条件
    approximationNotes: |
      逻辑流是定性判断；节点权重基于可获得公开证据评估，不是量化打分。投资人质量信号是最强正向因素；收入证据缺口是升级至买入的主要约束。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV015
      - CV036
  - id: FV002
    title: 收入假设下的估值敏感性
    type: bar
    layout: standard
    summary: |
      在不同收入情景下，$2B 估值隐含的 EV/ARR 倍数，并以 Houlihan Lokey AI 原生软件中位数（21.2x）作为参照。
    data:
      items:
        - label: $5M ARR（CompWorth 估计）
          value: 400
        - label: $20M ARR（悲观情景）
          value: 100
        - label: $50M ARR（保守）
          value: 40
        - label: $100M ARR（OCBJ 匿名）
          value: 20
        - label: $140M ARR（GetLatka 估计）
          value: 14
        - label: HL AI 原生软件中位数（21x）
          value: 21
        - label: $200M ARR（乐观前瞻）
          value: 10
    approximationNotes: >
      所有收入数值都是估计或第三方报道；没有任何一个经过审计。$2B 估值分母来自 Reuters/CNBC 援引的知情人士。Houlihan Lokey 21.2x 中位数适用于财务已验证的 AI 原生软件公司；鉴于 FieldAI
      收入未验证，该比较只是示意，不是精确对标。
    claimRefs:
      - CV022
      - CV023
      - CV024
      - CV028
  - id: FV003
    title: 估值与回报区间 —— 乐观、基准、悲观
    type: range
    layout: standard
    summary: |
      下一轮融资（2027–2028）在乐观、基准和悲观情景下的隐含估值结果，并以当前 $2B 标记作为参照。
    data:
      items:
        - label: 悲观（降价轮，收入 <$50M，倍数压缩）
          low: 400
          mid: 700
          high: 1000
        - label: 当前标记（$2B，2025 年 8 月）
          low: 2000
          mid: 2000
          high: 2000
        - label: 基准（2028 年 Series B，$200–300M ARR @ 10–12x）
          low: 2000
          mid: 2800
          high: 3600
        - label: 乐观（2027 年 Series B，$350–500M ARR @ 15–20x）
          low: 5250
          mid: 7500
          high: 10000
    approximationNotes: |
      所有情景区间都是基于可比公司倍数和既定收入假设的模型估计。没有审计财务就无法验证。回报计算假设以 $2B 入场且没有额外稀释；实际稀释会压低回报。数值单位为百万美元。
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV030
  - id: FV004
    title: 投资 KPI —— 评分摘要
    type: kpi
    layout: standard
    summary: |
      投委会可用的 FieldAI 七项投资维度评分；分数为 0–10，10 代表同类最佳。
    data:
      items:
        - label: 市场机会
          value: 8
          unit: /10
          detail: 横跨建筑、能源、矿业、物流、国防的大 TAM；渗透率低；劳动力短缺带来宏观顺风
        - label: 技术护城河
          value: 8
          unit: /10
          detail: 物理优先的 FFMs；不绑定硬件；已经实地验证；3+ 年自有部署数据；联邦学习飞轮
        - label: 团队 / 创始人与市场匹配
          value: 9
          unit: /10
          detail: 一流团队；拿下 DARPA SubT；来自 NASA JPL、DeepMind；野外机器人 AI 领域难见同等深度团队
        - label: 商业验证
          value: 5
          unit: /10
          detail: 据称覆盖数百个现场、3 大洲；已签约 >$100M（匿名、未经审计）；没有客户名称，也没有经验证 ARR
        - label: 财务透明度
          value: 2
          unit: /10
          detail: 没有经审计财务；运营实体未提交 Form D；收入区间跨度 28x；治理结构未披露
        - label: 估值与基本面
          value: 4
          unit: /10
          detail: 若 ARR 为 $100–140M，$2B 对应 14–20x（说得通）；若 ARR 为 $5M，则为 400x（不合理）；不确定性是核心风险
        - label: 退出准备度
          value: 5
          unit: /10
          detail: 没有 IPO 时间表；没有 M&A 信号；距离 Series B 可能还要 2+ 年；战略收购方池子很大（NVIDIA、Amazon、Honeywell、Emerson）
    approximationNotes: >
      评分是分析师基于截至 May 2026 的公开证据作出的定性判断。财务透明度得分为 2/10，反映这家 $2B 公司异常不透明；若开放 data room 披露，得分会明显上升。综合得分（未加权平均）约为
      5.9/10，因此支持观察而不是买入。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV014
      - CV015
      - CV033
