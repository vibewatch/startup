        - 欧盟市场监管机构公告、FieldAI 新闻稿、新闻报道、客户以合规为由冻结采购
        - 欧盟市场监管机构正式调查、不合格认定，或客户以 AI Act 合规为由冻结采购
        - 立即尽调欧盟合规计划；评估市场准入风险；认证完成前考虑暂停欧盟部署
      - - Boston Dynamics 合作终止或 Hyundai 战略转向
        - 公开合作公告、Hyundai Motor Group 战略披露、FieldAI OEM 合作伙伴更新
        - 任一方公开声明终止合作，或 Hyundai 宣布为 Boston Dynamics 硬件开发自有自主栈
        - 在没有 Spot 集成的情况下重新评估建筑垂直商业案例；评估 OEM 多元化时间表；重新校准收入预测
      - - Ali Agha 离职或声誉事件
        - LinkedIn、新闻报道、公司公告、投资人沟通
        - 确认其离开 CEO / 创始人角色、长期病假，或公开声誉争议
        - 紧急评估管理层继任计划；投资人沟通；考虑陈述与保证保险触发
      - - 融资估值重置或 down round
        - 未来融资公告、二级市场数据（Nasdaq Private Market、PremierAlts）、投资人沟通
        - 任何公告融资轮估值显著低于 $2B，或二级市场价格显示较上一轮价格折价 30%+
        - 重新评估终局估值上行空间；审查优先股堆叠和清算优先权；评估相对原始入场逻辑的稀释敞口
      - - 商业化平台期（收入增长低于阈值）
        - OCBJ/Sacra/GetLatka 收入报告、客户数披露、招聘放缓信号
        - 公开或可靠第三方迹象显示 ARR 同比增长低于 80%，或到 2027 年已签约收入停滞在 $150M 以下
        - 下一次资本部署决策前，深挖销售生产率指标、客户留存和管线质量
    notes: 阈值是分析师定义的加强尽调触发点，不是合同或法律约束标准。鉴于 FieldAI 作为私营公司的披露姿态，监测主要依赖公开信息。
  - id: TV001
    title: 建议摘要
    columns:
      - 维度
      - 评估
      - 依据
      - 决策含义
    rows:
      - - 建议
        - 观察
        - 强投资逻辑被估值不透明和收入未验证抵消
        - 监测商业验证点；没有经审计财务数据前，不要按当前价格投入
      - - 置信度
        - 中
        - 投资人财团顶级；收入区间相差 28x；治理未披露
        - 若有 2 年以上经审计 ARR 数据和披露的 NRR，置信度可升至高
      - - 风险评级
        - 高
        - 收入未验证；若行业倍数压缩或收入不及预期，存在 down-round 风险
        - 对冲敞口；相对组合保守控制仓位
      - - 估值立场
        - 偏高
        - $2B 对应 $100–140M ARR = 14–20x；若 ARR 为 $5M，则约 400x；AI-native 中位数基于已验证 ARR 为 21x
        - 入场价要求收入跑到高端；外部看安全边际很薄
      - - 升级触发器
        - 经审计 ARR ≥$100M + GM ≥60% + NRR ≥110%
        - 这三个数据点足以支撑在当前 $2B 左右估值买入
        - 任何投入前先索取 data room 访问
    notes: |
      建议反映无法接触私有尽调时的外部投资人立场。战略投资人和领投 VC（Bezos Expeditions、Khosla、NVentures）已完成公众无法获取的专有尽调；其信心是正面信号，但只能补充、不能替代本评估。
