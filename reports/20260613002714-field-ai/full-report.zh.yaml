      - number: '7.5'
        title: 财务、估值与投资逻辑破裂风险
        blocks:
          - type: paragraph
            body: >
              FieldAI 以 $2B 估值完成 Series A，是机器人 AI 史上同阶段公司里最高的一笔，也把后续融资门槛抬得很高。唯一独立收入信号来自 OCBJ 2026 年 4 月匿名消息源所称的「$100M+
              已预订收入」；按 $2B 估值计算，收入倍数约 20×，与企业 AI 软件最高倍数组别相当，但一旦增长放缓、AI 板块情绪转向，或公开市场可比公司重估，倍数压缩会直接暴露。GetLatka 2025 年 11
              月给出的 $140M ARR 估算未经审计，也未获公司确认。毛利率、NRR、CAC、账上现金和烧钱速度完全未披露，无法用常规 SaaS 或 deeptech 指标承销估值。

              资本强度是隐藏风险：工业机器人部署需要现场集成、定制载荷安装和持续模型微调，每一项都会带来交付成本，可能把毛利率大幅压到纯软件水平以下。如果毛利率明显低于 60–70%，即便收入加速增长，$2B
              估值也很难撑住。第二个风险是烧钱集中度：公司已有 130+ 名员工，管理层来自高成本学术和科技机构，月度烧钱可能达到 $10–20M；按 $405M 融资额估算，现金跑道约 2–4
              年。若在盈亏平衡前市场或宏观环境打断增长，公司可能被迫下轮降价融资。

              破坏投资论点的触发点，集中在会动摇核心假设的证据上：(1) FieldAI 驱动机器人发生重大安全事故，引发客户退出、监管行动或诉讼；(2) EU AI Act 执法阻断欧盟市场准入；(3) Boston
              Dynamics 合作终止，或 Hyundai 战略转向，导致主要商业案例消失；(4) Ali Agha 离职或发生声誉事件；(5) 估值重置或下轮降价，说明市场无法承接 $2B
              入场估值。上述任一触发点单独出现，都足以显著改变风险调整后回报。
