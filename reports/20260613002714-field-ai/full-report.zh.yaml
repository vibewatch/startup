        - 美国 —— Colorado
        - 2026 年 6 月 30 日生效；美国首个全面的州级高风险 AI 法规
        - 中 —— 取决于 FieldAI 系统是否服务 Colorado 企业客户
        - 中 —— 影响评估处罚、消费者披露义务
