      - number: '6.3'
        title: 具名客户证据
        blocks:
          - type: paragraph
            body: >
              Big-D Construction 和 DPR Construction 是 FieldAI 两个完全具名、已生产部署且公开归因成果的客户。Big-D 是一家拥有 25+ 年商业建筑经验的美国承包商，截至
              2026 年 4 月已活跃部署超过两年。C 级高管 Shaun Orr 描述了一个突破性时刻：机器人实时走访项目现场，连接 BIM
              模型和项目进度，识别遗漏工作和安全问题，并把发现回连到公司的项目管理平台——单个人类团队无法独自复制这种能力。Orr 预计“每个项目都会以某种形式使用 FieldAI 工具”。Big-D 主管 Bronson
              Dupaix 描述了用系统替代手持相机和扫描仪进行的五小时人工巡场。Big-D 总监 Chantelle Menlove
              另行提到，一位在某个场地见过机器人的主管打电话要求在下一个场地使用它，显示出自下而上的有机需求。

              DPR Construction 是美国十大承包商之一（同时专注数据中心和医疗），截至 2025 年 11 月，已在加州 Santa Clara 一个数据中心场地托管 FieldAI 机器人约 1.5
              年。机器人采集了 45,000+ 张照片，行走 100+ 英里，扫描 500,000 平方英尺室内空间和 125,000 平方英尺屋面。主管 Justin Schreiner
              表示，该系统通过移除单调的文档记录任务，让团队专注关键工作，“让我们把本职工作做得更好”。

              Certis Group 是新加坡最大的安防和运营公司，2026 年 2 月宣布与 FieldAI 建立战略伙伴关系，在全球运营中部署自主安防机器人。Certis 的 Mozart 编排平台与 FieldAI 的
              FFM 集成，用于多场地安防环境中的自主巡逻、事件检测和人机协同。Certis 总裁 Ng Tian Beng 确认，伙伴关系面向“实时、任务关键环境”。这不是直接客户销售，而是渠道 / OEM
              式安排；Certis 既是安防垂直的伙伴，也是运营方客户。

              2026 年 3 月 FieldAI / NVIDIA 新闻稿引用一位未具名全球工业制造高管称，一个“过去需要三个半月的流程，现在只需十二小时”——提升
              200×。客户没有具名，指标无法验证，但该引用由具名公司高管（CEO Ali Agha）在正式新闻稿中归因。robotsinconstruction.com 独立跟踪器还列出两家未具名 ENR 前 10
              公司，确认已有生产部署，但未披露结果。
