            body: >
              与最接近的两家具身 AI 软件同行相比，FieldAI 的 $2B 估值显得保守：Physical Intelligence 2025 年 11 月在零披露收入下估值 $5.6B，Skild AI 2026 年
              1 月凭 $30M ARR 达到 $14B。若 FieldAI 收入数字准确且继续增长，下一轮融资可能远高于 $2B。这并不改变 TRACK
              建议——未验证收入仍是硬约束——但能更准确地框定下行风险：在可比组内，$2B 标记更像地板，不是天花板。
