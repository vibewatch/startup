  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户细分、买方 / 用户 / 付款方逻辑
        blocks:
          - type: paragraph
            body: >
              FieldAI 向企业级工业组织销售具身 AI 软件和传感器—计算载荷，覆盖六个具名垂直：建筑、能源 / 油气、采矿、制造、城市配送与巡检、联邦 /
              国防。公司不制造机器人；产品是自主软件和载荷，用于改装买方已经拥有、或从 Boston Dynamics 等 OEM
              伙伴采购的硬件。这个清晰的软件授权模式意味着，付款方始终是工业企业，买方通常是技术负责人、运营副总裁或创新总监，日常用户则是部署并监控机器人的现场主管、安全经理或运营负责人。

              据报道，订阅价格会随部署规模从数万美元到每年 $500,000 不等，首次部署时叠加硬件集成服务。建筑垂直是 FieldAI 商业成熟度最高的板块——它拥有唯一公开具名的客户案例（Big-D
              Construction、DPR Construction），也是截至 2026 年中唯一确认多年生产部署的板块。能源 /
              油气和工业制造由专门产品页服务，覆盖设备异常检测、仪表和热监控、数字孪生创建，但这些细分里没有公开披露具名企业客户。安防运营通过 2026 年 2 月宣布的 Certis Group
              战略伙伴关系进入可服务市场，联邦 / 国防则是单独品牌化板块（FieldAI Federal），前文提到过 Detroit Defense 伙伴关系。

              买方 / 用户分离造成了重要销售动态：采购决策中的拥护者往往是技术或创新总监，但生产采用取决于每天使用系统的主管和安全经理是否买账。在
              Big-D，主管层的自发需求强化了自上而下的投资决策——这是黏性的正面信号——但也意味着单个项目团队的抵触可能拖慢场地级扩张。
