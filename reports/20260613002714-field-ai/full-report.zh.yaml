      - - Covariant
        - 机器人 AI 平台（仓储 / 操作）
        - 累计融资 $222M；估值 $625M；Amazon 于 2024 年 8 月收购式聘用创始人（非独家许可）
        - 仓储、物流、零售履约（单件拣选、分拣）
        - RFM-1 80 亿参数多模态基础模型；舰队学习；通过 ABB 和 KNAPP 集成商走渠道
        - 收购式聘用后范围收窄；以仓储为中心；未在户外 / GPS 受限工业环境验证
      - - Gecko Robotics
        - 检查机器人 + AI 平台（垂直）
        - 累计融资 $347M；估值 $1.25B（2025 年 6 月）
        - 能源、国防、制造、海军——关键基础设施检查
        - TOKA 磁轮机器人 + Cantilever 数字孪生平台；$71M 海军 IDIQ（2026 年 3 月）
        - 垂直整合（自有机器人），限制 OEM / 硬件无关打法；聚焦检查场景
      - - Boston Dynamics (Hyundai)
        - 机器人 OEM + 舰队管理软件
        - Hyundai 持有（无独立 VC 融资）；2021 年完成对 Hyundai 的 $14.5B 交易
        - 工业检查、物流、制造；Atlas 人形机器人到 2028 年进入 Kia/Hyundai 工厂
        - Orbit 软件；集成 Google Gemini/DeepMind；FieldAI 合作伙伴（2026 年 3 月），用于未知地形
        - Orbit 锁定 Boston Dynamics 硬件；不是具身无关；非结构化自主能力依赖 FieldAI
      - - Machina Labs
        - AI 驱动的制造机器人（垂直）
        - 累计融资 $209M；$124M Series C（2026 年 2 月）；投资方包括 Lockheed Martin/Toyota/Woven Capital
        - 国防、航空航天、先进出行——机器人钣金成形
        - RoboCraftsman AI 成形平台；软件定义工厂；从数字设计到生产
        - 应用专用（金属成形），不是通用自主大脑；只在国防机器人预算上有重叠
      - - Viam
        - 开源机器人软件平台（开发者）
        - 累计融资 $117M；Series C 2025 年 3 月
        - IoT、工业自动化、智能机器——开发者 / 工程团队
        - 开源；模块化；多语言 SDK；云端舰队管理；Universal Robots 合作伙伴
        - SDK / 中间件层没有训练好的自主模型；需要大量开发者投入才能追平 FieldAI
      - - 现状 / 内部自研
        - 人工检查 + 内部 SLAM/GPS 导航
        - N/A——现有人工或内部 R&D 预算
        - 拥有内部工程团队的大型工业企业；风险厌恶型买家
        - 无软件许可成本；数据完全可控；可定制
        - 无法在 GPS 受限或非结构化环境中可靠运行；人力成本高；没有跨平台舰队学习
    notes: >
