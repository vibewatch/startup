      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >
              乐观情景要求 FieldAI 收入处于估算高端（$140M ARR，年同比增长 80–100%），软件授权流毛利率接近 70–80%，NRR 在车队扩张带动下超过 120%，且公司在 2027 年以
              $350–500M ARR 基数、15–20× 前瞻 ARR 完成 Series B——对应 $5.25–10B 估值，较 $2B 标记回报
              2.6–5×。该情景的关键风险是：收入数字未验证，增长率未获独立确认，市场环境也必须继续支持 AI 软件高倍数。


              基准情景假设 ARR 为 $100M，增长 40–60%，混合毛利率在 55–70% 区间，NRR 为 110–120%。若 2027–2028 年 Series B 按 $200–300M ARR
              基数、10–12× 前瞻 ARR 定价，估值为 $2.0–3.6B——较 $2B 标记回报 0–1.8×。这意味着大体持平到温和升值，与风险水平相匹配。


              悲观情景假设收入显著更低（$20–50M ARR），行业逆风拖慢增长（企业采用摩擦、宏观资本开支收缩），AI 软件倍数压缩把下一轮隐含估值拖到 $0.4–1.0B——较 $2B 标记亏损
              50–80%。该情景下，下轮降价风险最高。负面触发因素包括：如果 Physical Intelligence 或 Skild AI 以低于预期的倍数融资，引发机器人板块整体估值重置；FieldAI
              客户减少部署或不续约；或出现证据表明「已预订收入」显著高估已确认 ARR。
