  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块图
        blocks:
          - type: paragraph
            body: >
              FieldAI 是一家纯 AI 软件公司，不制造机器人。它的商业产品是 Field Foundation Model（FFM）平台：一套不依赖具体机体的自主软件，安装在合作伙伴或客户自有的机器人硬件上。FFM
              充当通用“大脑”，让机器人无需预先建图、GPS、云连接或按任务重新编程，就能在非结构化工业环境中感知、推理和行动。平台跨硬件形态运行，包括四足机器人（如 Boston Dynamics
              Spot）、轮式机器人、人形平台和乘用车尺度自动驾驶车辆。

              FieldAI 的应用组合覆盖其官方 Solutions 页面列出的八类方案：现场测绘与文档记录；设施和设备巡检；状态异常检测；大规模数据采集；无人化物料运输；安全和威胁检测；远程临场与遥操作；搜索和
              ISR。公司既自研应用，也通过第三方供应商的伙伴载荷模式开发。近期商业重点是巡检和数据采集（已经产生收入），操控和通用作业在中长期路线图上。

              一个突出的架构原则是 “Context over Training”：FFM 不要求穷尽式场景预训练，而是使用上下文线索和学到的物理先验，对未见情况作出推断。CEO Ali Agha
              将机器人的风险感知描述为让它对任何动作都有一种“我有多确定”的感觉，客户可配置风险阈值，从而调整安全关键区域里的行为。结果是一种部署模式：机器人可以在新场地快速启用，并在不做大量逐场地定制的情况下扩展到企业级机队。
