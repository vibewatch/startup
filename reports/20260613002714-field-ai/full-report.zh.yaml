        - 模型扩展时跟踪训练算力报告义务
        - 低至中 —— 目前可能尚未触发，但模型增长后可能跨过门槛
        - 获取训练算力估计，以及关于 SB 53 适用性的法律意见
      - - AI 产品责任（欧盟 PLD / 美国州侵权法）
