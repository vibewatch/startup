            title: 纯软件模式带来非对称扩张潜力
            body: >-
              FieldAI 拒绝自建硬件，因此避开机器人制造的资本密集度，并可把每家机器人 OEM 同时视作分销伙伴和可触达账户。硬件无关路径意味着每个新机器人平台（人形、轮式、空中）都是扩张机会，而不是产品转向。这就是
              OS 层类比：如果 FFMs 成为工业机器人自主系统的事实标准，可触达市场会随全球机器人机队增长而同比例扩大，同时不需要相称增加资本开支。
