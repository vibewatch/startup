  - id: FM003
    title: 买方 / 细分采用流程 — FieldAI 工业客户旅程
    type: flow
    layout: standard
    summary: |
      FieldAI AI 机器人平台的工业客户采用流程，映射从初始认知到企业级车队部署的买方角色和关键决策关口。
    data:
      nodes:
        - id: awareness
          label: 工业运营商识别问题
          detail: 劳动力短缺、安全事件、文档积压或监管巡检期限带来紧迫性
        - id: champion
          label: 内部支持者介入（HSE / 运营经理）
          detail: 站点层面的支持者（总监、HSE 经理）评估 FieldAI；发起概念验证请求
        - id: pilot
          label: 概念验证（1 个站点，范围有限）
          detail: FieldAI 在一个站点部署机器人；展示巡检时间减少、数字孪生价值和安全监控
        - id: roi_validation
          label: ROI 验证关口（CFO / 运营 VP 审查）
          detail: 付款方审查 PoC 指标；验证相对人工的成本节省；批准推进企业合同
        - id: enterprise_contract
          label: 企业框架协议
          detail: 多站点或多区域软件授权与服务协议；车队级部署开始
        - id: fleet_expansion
          label: 车队规模部署与飞轮
          detail: 每次新部署都给 FieldAI 学习飞轮供数；模型改进；新站点加入；合作扩大
      edges:
        - from: awareness
          to: champion
          label: 安全 / 用工触发
        - from: champion
          to: pilot
          label: PoC 批准
        - from: pilot
          to: roi_validation
          label: 结果复核
        - from: roi_validation
          to: enterprise_contract
          label: 商业案例批准
        - from: enterprise_contract
          to: fleet_expansion
          label: 扩张决策
    approximationNotes: >-
      采用路径基于 FieldAI 的 Boston Dynamics 案例研究描述和公司 PR 推断；公司未披露转化率或销售周期长度数据。「试点炼狱」约束（BuiltWorlds：活跃使用率从 65% 降至 46%）表明，ROI
