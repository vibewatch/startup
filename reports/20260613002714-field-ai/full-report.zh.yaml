      - number: '3.5'
        title: 展示材料
        blocks:
          - type: callout
            title: Google/Intrinsic 的分销规模是结构性优势，不取决于速度
            body: >
              Fanuc 合作让 Google/Intrinsic 触达 1.1 million 台已部署工业机器人——这是 FieldAI 在任何可预见时间内都无法有机复制的机队。即便 Flowstate
              今天的自主能力较弱，面向既有 Fanuc 客户的升级路径也会形成滩头阵地，压缩 FieldAI 可触达的新建市场。该威胁是结构性的（分销杠杆），而非单纯技术性，并且是 FieldAI
              财务模型中最重要的单一竞争动态。
            calloutType: risk
            claimRefs:
              - CP007
              - CP028
          - type: callout
            title: Boston Dynamics 的伙伴 / 竞争者双重角色需要合同尽调
            body: >
              Boston Dynamics 既是 FieldAI 最显眼的具名硬件伙伴，也运营 Orbit 软件平台；该平台已与 Google Gemini 集成，用于同一批 FieldAI 驱动的 Spot
              机器人机队智能。这种双重关系带来潜在利益冲突：Boston Dynamics 可通过 Orbit 观察 FieldAI 的部署表现数据、开发竞争能力，并在 FieldAI
              能力变得冗余或构成商业威胁时，有选择地降低合作优先级。公开资料未披露任何排他性或 IP 隔离条款。
            calloutType: risk
            claimRefs:
              - CP013
              - CP033
          - type: callout
            title: 无 GPS 边缘部署是其他玩家尚未优先投入的可防守利基
            body: >
              本章审阅的竞争者中，没有一家确认拥有面向无 GPS、非结构化户外环境（建筑工地、地下矿山、偏远能源资产）的边缘端、可物理隔离具身 AI。边缘推理、多形态机器人、物理感知风险建模、无需预建地图这组组合，是
              FieldAI 差异化里最窄但也最可防守的部分，因为云优先平台（Intrinsic、Pi）在完全隔离或带宽受限部署中面临根本架构约束。
            calloutType: strength
            claimRefs:
              - CP003
              - CP004
              - CP018
          - type: callout
            title: 取代现状是 FieldAI 近期最大的市场创造任务
            body: >
              人工巡检和内部 SLAM 导航不是传统软件竞争者，但它们是多数工业运营商评估 FieldAI 时的默认选择。美国海军每年在舰船维护上的支出估计为 $13–20
              billion，比任何创业竞争者的全年收入高一个数量级。FieldAI 近期的首要竞争任务，是证明 ROI 足以取代现状，而不是击败其他 AI 平台。
            calloutType: insight
            claimRefs:
              - CP026
              - CP034
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与货币化策略
        blocks:
          - type: paragraph
            body: >
              FieldAI 的收入模式是 B2B 企业模式，围绕两条主线：（1）客户首次把 FieldAI 的传感器—计算载荷和固件部署到既有第三方机器人上时收取的前期硬件集成费；（2）继续访问 Field
              Foundation Models（FFMs）、机队管理和分析服务的经常性软件授权费。公司不制造机器人，并明确避开硬件 OEM
              定位，使模式更接近企业软件订阅，而不是机器人硬件供应商。所有端侧推理都在边缘端运行，延迟低于 100ms；机队数据上传至 FieldAI 云平台，用于分析和联邦式模型改进。


              标价未公开披露。第三方来源把订阅区间描述为“每年数万美元到 $500,000”，取决于部署规模；CEO Ali Agha 则引用美国、欧洲和亚洲的“数百万美元合同”来证明大型企业交易规模。Construction
              Dive 和 Sacra 确认了 B2B 硬件集成加软件授权结构。没有证据显示公司存在面向消费者的收入流、市场模式或硬件 OEM 收入。面向防务的子公司 FieldAI Federal
              已在运营，未来可能产生政府合同收入，但尚未公开披露任何中标合同。


              唯一公开收入信号，是 2026 年 4 月 Orange County Business Journal 援引匿名“知情人士”称公司预订收入超过 $100M。GetLatka 的分析师平台估算，截至 2025 年
              11 月 ARR 为 $140M。两个数字都未经审计、未获公司确认，也未按收入流拆分。这里把它们视为方向性信号，而非已确认财务指标。
