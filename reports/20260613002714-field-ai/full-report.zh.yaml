            body: >
              FieldAI 采用硬件无关、仅软件的收入模式，因此不背机器人库存、制造资本开支或供应链营运资本风险。不同于垂直整合机器人公司（Figure AI、Agility Robotics），FieldAI
              的成本基础主要是工程人才和现场支持；部署足迹扩大后，两者相对收入呈次线性增长。这一结构性优势支撑了高毛利率和相对融资额的资本效率判断。
