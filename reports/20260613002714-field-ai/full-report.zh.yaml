      - number: '1.4'
        title: 规模、合作伙伴与里程碑时间线
        blocks:
          - type: paragraph
            body: >
              FieldAI 自 2023 年创立以来增长陡峭。公司在 2024 年底约有 30 名员工，到 2025 年 8 月融资公告时增至约 130 人；LinkedIn 在 2026 年初显示员工数为 201–500
              人，与公司到 2025 年底把人数翻倍至约 260 人的计划相符。因招聘和实验室扩张，公司在 2025 年末从 Mission Viejo 约 13,000 平方英尺办公室迁至 Irvine Spectrum 3
              Morgan 的 41,000 平方英尺研发总部。FieldAI
              的生产部署目前覆盖三大洲——北美、欧洲和亚太（包括日本）——数百个现场的数千次任务。公司已吸引建筑、能源、制造、城市配送、安防和防务领域数十家大型企业客户，并为政府和军事应用设立了 FieldAI Federal
              子公司。2026 年初宣布了两项重大战略合作：2 月，Certis Group（新加坡领先的综合安防服务商）与 FieldAI 建立合作，在全球部署自主安防机器人；2026 年 3 月，Boston
              Dynamics 与 FieldAI 宣布合作，把 Spot 的机动能力与 FieldAI 的 FFMs 结合，用于建筑和其他动态环境。Boston Dynamics 创始人 Marc Raibert
              在背书中专门提到双方 2020 年 DARPA SubT 获胜：“自 Ali 和他的团队用 Spot 机器人赢得 DARPA Subterranean Challenge 的 Urban Circuit，并为
              NASA 处理类似挑战以来，我们就认识他们。” Construction Dive 提到的一个关键风险指标是：受访承包商的活跃机器人部署比例从 2024 年的 65% 降至 2025 年的
              46%，尽管正面评价达到 95%；这说明行业整体在意愿与实际采用之间存在摩擦，对 FieldAI 近期商业规模目标构成逆风。
