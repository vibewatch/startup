      - number: '4.4'
        title: 财务不透明与尽调阻碍
        blocks:
          - type: paragraph
            body: >
              FieldAI 是私营公司，没有公开财务报告义务。截至 2026 年 5 月，仍未披露或无法核验的关键财务指标包括：（1）经审计 ARR 或总收入；（2）按收入流划分的毛利率；（3）CAC
              和回本周期；（4）净留存率；（5）客户数量和集中度；（6）账面现金；（7）月度或季度烧钱速度。


              现有收入信号相互冲突。GetLatka 估算 ARR 为 $140M（2025 年 11 月），其他分析平台却引用过低至 $5M 的数字，差距达 28 倍，反映出从外部估算私营公司指标的难度。UpsideList
              的社区模型标记 -2% 上行，并从二级市场定价角度将公司视为接近收入前阶段，提示私募二级市场层面的流动性和估值不确定性。


              若按 $140M ARR 估算，$2B 估值对应 14 倍收入倍数；若按 $100M 已预订收入信号，则对应 20 倍。公司未披露盈利能力，没有公开财务记录，且所在市场中至少 54%
              的建筑垂直机器人部署（公司披露的最大市场）仍停留在试点或停滞项目阶段（据 BuiltWorlds 2025 数据），这两个倍数都偏激进。只有在 ARR
              快速增长且利润率很高时，这些倍数才站得住脚，而两点都无法从公开数据确认。FieldAI 未向 SEC 提交 Form D（经 EDGAR 全文检索确认），意味着公司要么使用了无需 Form D
              的豁免，要么采用了不同法律实体，要么尚未提交。加州实体 “Field Ai, Inc.”（文件 #6436098，2024 年 10 月 24 日成立，特拉华设立，CEO Aliakbar
              Aghamohammadi）处于有效状态。


              二级市场分析师给出的反向估值信号，以及收入估算范围过宽，并不构成直接否决项；但这意味着，要承销 $2B 估值，必须通过正式尽调拿到非公开财务信息。
