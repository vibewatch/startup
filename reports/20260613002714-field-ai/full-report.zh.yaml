      - number: '5.2'
        title: 架构与技术设计
        blocks:
          - type: paragraph
            body: >
              FFM 平台由三层模型组件组成。核心 FFM 使用视觉、LiDAR、文本和音频等多模态传感器流，处理感知、世界建模和决策。Dynamics Foundation
              Model（DFM）是一个子模型，整合机器人自身运动学和动力学属性，让同一认知层能够驱动机械结构不同的机器人机体。Multiagent Foundation
              Model（MFM）是协调层，允许机队中的多台机器人共享环境表征，并在场地尺度上集体推理——把机器人群从彼此孤立的工具变成分布式自主系统。

              架构上，FieldAI 在“信念空间”中运行：系统持续跟踪环境状态的概率分布，而不是假设信息完美。这一设计脉络可追溯到 CEO Ali Agha 关于 FIRM（Feedback-based
              Information RoadMap）信念空间规划的学术工作，以及赢得 DARPA SubT 挑战赛第二阶段的 NeBula 系统。这种概率方法意味着，机器人可以在无
              GPS、低能见度、传感器退化的条件下工作。FFM
              遇到陌生条件时，会明确减速或选择更保守路径——这是公司承认的吞吐量代价，但也被视为安全特性。真实世界数据飞轮意味着，每次部署都会随时间改善模型表现，形成复利式数据优势。

              NVIDIA 集成加深了工程栈。FieldAI 使用 NVIDIA Omniverse NuRec，将机器人正常作业中顺带采集的传感器数据重建成高保真 3D 数字孪生。这些数字孪生载入 NVIDIA Isaac
              Sim 和 Isaac Lab，用于机器人策略训练和验证；FieldAI 还通过 Microsoft Azure 采用 NVIDIA Physical AI Data Factory Blueprint，使用
              NVIDIA Cosmos 开放世界基础模型和 NVIDIA OSMO 自动化合成数据流水线。公司的 GitHub 组织（field-ai）维护多个机器人基础设施库的活跃 fork——Spot
              SDK、rosbridge_suite、spconv、unitree_sdk2——最近提交截至 2026 年 4 月，提供了开发者侧的平台集成面证据；但没有公开发布自研模型权重或 SDK 文档。私有的
              Squarespace 发布说明页面进一步限制了外部对已交付能力的审计。
