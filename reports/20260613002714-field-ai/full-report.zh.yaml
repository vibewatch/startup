  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与融资历史
        blocks:
          - type: paragraph
            body: >
              FieldAI 最后一次披露估值为投后 $2.0B。该估值来自 2025 年 8 月公司宣布连续两轮合计融资 $405M 时。最近一轮融资 $314M，超额认购，由 Bezos Expeditions、Prysm
              Capital 和 Temasek 联合领投；前一轮约 $91M，估值约 ~$500M。因此，公司大约 12 个月内估值翻了四倍。GeekWire 和 Reuters 消息源将两轮描述为「Series A 和
              A1」。部分预尽调资料把拆分写成 $150M（种子轮）加 $255M（Series A），但这与 Reuters 报道的最近一轮 $314M 不一致，也无法从一手来源确认；本章采用兄弟章节中的标准口径。


              PremierAlts（2026 年 5 月访问）显示，公司五轮合计融资 $506.1M，最近一轮 $315M 于 2026 年 2 月完成——可能反映公告后二级 SPV 活动或新一轮一级融资——估值仍为
              $2.0B。SEC 的 Form D 文件确认，投资载体「HII Field AI Series I, II, and III, a Series of HII Field AI, LLC」分别于 2025 年
              11 月和 2026 年 4 月提交（CIK 0002095306、0002095305、0002126354），这与常见的特殊目的集合投资基金结构一致：用于汇集热门私营公司的二级份额和 LP
              兴趣。未发现「Field Ai, Inc.」以加州实体直接提交 Form D，这与公司依赖豁免或使用不同法律实体结构相符。


              二级市场交易活跃：FieldAI 股份在 Nasdaq Private Market 和 Notice.co 交易（截至 2026 年 5 月约 ~$34.32/股），UpsideList
              也列出该公司但上行信号有限，说明二级定价接近或等于 $2B 头部估值。PitchBook（2025 年 6 月归档）显示 47 名员工、交易类型为「早期 VC」，反映出 PitchBook
              私营公司覆盖常见的数据滞后。公司自己披露 LinkedIn 员工 201–500 人、已预订收入 >$100M（2026 年 4 月），显示较 PitchBook 快照已有实质增长。
