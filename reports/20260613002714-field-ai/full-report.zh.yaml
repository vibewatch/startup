      - number: '5.3'
        title: 部署流程与使用场景
        blocks:
          - type: paragraph
            body: >
              FieldAI 的部署模式是 B2B 软件：客户拥有或租用的机器人安装 FFM 大脑，FieldAI 提供集成服务和持续模型更新。客户无需从 FieldAI
              购买专用硬件。部署时间是一个关键差异化主张：由于机器人不需要预先建图环境或 GPS
              基础设施，场地启用被描述为很快；公司和投资人称，过去“需要数月的流程现在只需数小时”。一位未具名的全球工业制造高管引用过一个具体结果：使用 FieldAI 技术加 NVIDIA NuRec 数字孪生生成后，流程从
              3.5 个月缩短到 12 小时（提升超过 200 倍），但该主张未经独立第三方验证。

              建筑是最领先的商业垂直。Big-D Construction 已经做了两年多 FieldAI 客户，并在 2026 年 4 月宣布扩展到多个项目；据报道，其中一次项目问题捕捉通过早期缺陷发现节省了 $1.2
              million。在安防垂直，Certis Group（新加坡）部署与其自研 Mozart 编排平台集成的 FFM，覆盖公共基础设施、交通枢纽和工业设施。FieldAI 与 Boston Dynamics
              的伙伴关系在 2026 年 3 月 12 日正式化，目标是建筑巡检；搭载 FFM 的 Spot 机器人自主执行 3D 扫描、危险识别和夜间监控。公司还通过 FieldAI Federal
              处理联邦和国防使用场景，该部门由前 DARPA Program Manager Dr. Eric Krotkov 领导。

              从地域看，FieldAI 记录了美国、日本、欧洲以及通过 Certis 覆盖亚太的部署。客户通常不会公开具名（TechCrunch 确认，公司在 2025 年 8 月融资公告时拒绝披露客户名称）；截至 2026
              年 5 月，Big-D Construction 是唯一公开点名的建筑行业客户。
