      - number: '2.3'
        title: 买方、用户与付款方细分
        blocks:
          - type: paragraph
            body: >
              FieldAI 销售 B2B 企业软件，而非硬件。公司的买方结构符合典型企业工业技术模式：付款方是高管层或运营 / 财务 VP，技术买方是运营或 HSE（Health, Safety,
              Environment）负责人，日常用户是现场主管、现场工程师或项目经理。预算归属取决于垂直，通常落在两个池子之一：（1）用于新自动化投资的资本开支（capex）预算，由 CFO 以及工程或运营 VP
              控制；（2）用于经常性巡检、监控和现场情报合同的运营开支（opex），由工厂或项目经理在预批准服务供应商协议内控制。FieldAI 把产品定位为在 opex 侧带来即时 ROI（人工文档时间减少
              90%+、更早发现返工），因此初始销售可包装为成本规避，而非 capex 转型。


              建筑细分中，最直接的购买力集中在最大总承包商——例如 FieldAI 的 Boston Dynamics 案例研究提到但未点名的 ENR
              排名前列公司。这些公司拥有大量项目积压，承担成本超支风险，并设有内部创新或数字化转型预算用于自动化试点。采用触发因素包括无法快速生成准确竣工 BIM
              数据、现场文档团队劳动力短缺，以及要求定期检查危险区域的安全指令。采矿和能源买家集中在大型运营商（BHP、Rio Tinto 及同类公司），其 HSE 和运营负责人受监管合规、事故减少和机队生产率指标驱动。BHP
              Ventures 投资 FieldAI，构成来自该买方细分的直接市场验证。油气客户受巡检合规要求、危险环境进入成本降低和资产完整性管理要求驱动。所有细分的采用路径都从有限
              PoC（通常为一个现场或资产集群）开始，经验证 ROI 后，进入覆盖多个现场或区域的企业框架协议；这与 FieldAI 所称“全机队部署”和“企业级”全球运营扩张模式一致。
