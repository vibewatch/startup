  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              FieldAI 的可触达市场不是整个工业机器人市场——已部署工业机器人多数位于结构化、重复性的制造环境（汽车装配、半导体制造、消费电子），传统固定路径自动化厂商如 FANUC、ABB 和 Yaskawa
              已能很好服务。FieldAI 的独特市场，是需要适应性、风险感知自主能力的工业机器人部署细分：它们要在布局每日变化、GPS
              和预建路径不可用、静态编程失效的非结构化环境中运行。该市场包括活跃建筑工地（地形、障碍和工作流按小时变化）、地下和露天矿山（落石、瓦斯风险和狭窄空间使人员暴露危险）、油气上部设施与巡检环境（资产访问危险且偏远），以及不适合固定路径机器人的柔性或高混合制造设施。


              市场边界排除以下支出：（a）结构化工厂自动化硬件和软件（例如固定装配线上的传统关节臂机器人）；（b）在受控环境中运行的消费或物流仓储机器人；（c）机器人硬件本身，因为 FieldAI 是纯软件供应商；（d）海底
              ROV 和专用水下车辆，其供应商生态另成体系。工业买家目前依赖的现状替代方案包括人工巡检和监控班组、需要大量预编程的传统固定路径或单任务机器人、无人机 / UAV 航测，以及结合人工数据采集的 BIM/CAD
              建模。与这些替代方案相比，单位现场情报成本更高、实时性更差；随着劳动力池收缩、安全要求收紧，它们越来越难以维持。


              FieldAI
              的市场横跨四个主要垂直：（1）建筑与基础设施，（2）能源、采矿和采掘，（3）油气巡检与运营，（4）非结构化或高混合配置中的工业制造。公司把目标环境称为“脏、枯燥、危险”，自主机器人能在安全、文档和运营洞察上释放复利价值；这一表述与其服务四个垂直的结构特征高度一致。代表未来扩张路径的相邻市场包括防务和周界安防、复杂环境物流，以及半结构化场景下的城市配送。更合适的市场规模测算方式，是使用垂直特定的分析师估算，而不是一个宽泛机器人
              TAM；因为不同分析师报告的范围定义差异很大。
