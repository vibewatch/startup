      - number: '4.3'
        title: 单位经济与成本结构
        blocks:
          - type: paragraph
            body: >
              FieldAI 的单位经济大多未披露。公司没有发布经审计财务，也没有披露毛利率、获客成本（CAC）、净留存率（NRR）、年度合同价值（ACV）或回本周期数据。以下分析基于可比的 B2B 工业 AI 软件公司，以及
              FieldAI 收入模式中可观察的结构。


              按典型企业 AI 软件基准估算，软件授权部分毛利率约在 55–80%
              区间。硬件集成服务涉及实体传感器—计算载荷部署和现场支持，毛利率可能更低（20–45%），会把综合毛利率拉到纯软件可比公司之下。规模起来后，软件授权收入应当占主导，并改善综合毛利率。边缘端架构不依赖云端推理，相比重云端
              AI 平台降低了每次部署的持续可变成本，这是有利的结构性特征。


              企业工业机器人销售效率先天承压：销售周期通常为 12–24 个月，需要现场演示和集成测试，并牵涉多方采购。CEO Agha 提到合同价值可达数百万美元，说明单笔订单规模可能支持在中等流失率下 1–3 年回收
              CAC，但没有披露 CAC 和 NRR 数据，无法验证。若 $140M ARR 估算和 150 名员工属实，人均收入约为 $900K–$1M，对这个阶段的企业软件公司而言很强。FieldAI 的 GTM
              动作聚焦直销给企业、硬件伙伴关系（Boston Dynamics、OEM）和地理扩张伙伴（Certis Group、亚洲），这会限制纯直销渠道能够触达的市场天花板。
