            title: 关键风险：收入不透明在悲观情景下带来 400× 倍数风险
            body: >
              FieldAI 最大的单一估值风险不是技术、团队或市场，而是信息不对称。如果收入真实值是 $5M（如某个二级估算所示），而不是 $140M ARR（GetLatka），$2B 估值隐含收入倍数约
              400×，只有最投机的早期 AI 投资可比。若收入无法匹配当前投资人信心所隐含的 $100M+，下轮降价概率会快速上升。
