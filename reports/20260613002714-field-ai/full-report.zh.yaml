            body: >
              要承销 $2B 估值，最低可行尽调包需要包括：（1）截至最近一个季度、经审计或管理层认证的 ARR，并按授权和服务分拆；（2）按收入流划分的毛利率；（3）滚动 12 个月现金消耗和资产负债表；（4）客户数量和前
              5 大收入集中度；（5）2024 和 2025 队列的队列级 NRR；（6）按行业垂直划分的 ACV 四分位数。没有这些信息，当前估值下的任何投资逻辑，本质上都是基于团队和市场的知情押注，而不是财务扎实的承销。
