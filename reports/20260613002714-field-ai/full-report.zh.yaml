      - number: '8.3'
        title: 可比估值与市场背景
        blocks:
          - type: paragraph
            body: >
              具身 AI 和工业机器人软件板块提供了有用但并不完美的可比组。在具身 AI 软件同行中，Physical Intelligence 2026 年 3 月正洽谈 $11B
              估值，而披露收入接近为零——这是由研究声望和期权价值驱动的极端离群点，不是当前商业牵引。Skild AI 2026 年 1 月以 $14B 估值融资，ARR 为 $30M 且指数式增长，意味着小基数上的
              ~467× 前瞻倍数——同样是早期阶段期权倍数，而非基本面倍数。这些可比公司确认，投资人群体正给具身 AI 软件平台很高的期权溢价；但从近零收入对应 $14B–$5.6B 的宽估值区间看，终局价值假设仍极不确定。


              如果 $100–140M ARR 估算正确，FieldAI 的 $2B 实际对应 14–20×，低于最接近的两家具身 AI 软件同行；只要收入真实，它在板块内看起来定价有吸引力。但如果真实收入只有
              $5–20M，隐含倍数（100–400×）将跻身板块内最激进一档。硬件整合型可比公司——Apptronik（$5.3B，人形硬件 + 软件）和 Gecko
              Robotics（$1.25B，关键基础设施检测）——商业模式结构不同，软件毛利较低但收入更可验证，会把纯软件估值可比值向下拉。Houlihan Lokey 2026 年 Q1 的 AI 垂直软件报告发现，AI
              原生软件公司在 VC 轮次中的 EV/Revenue 中位数为 21.2×，AI 赋能软件为 8.5×，传统 SaaS 为 5.5×。若 FieldAI 有 $100M ARR、按 21× 估值，可支撑约
              ~$2.1B 估值——与当前标记大体一致。关键风险在于：这个中位数适用于财务已验证的公司，而 FieldAI 收入完全无法从外部验证。
