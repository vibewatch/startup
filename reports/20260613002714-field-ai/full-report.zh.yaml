    title: 客户证明矩阵 —— 证据质量 vs. 生产成熟度
    type: matrix
    layout: wide
    summary: |
      从结果证据质量（低到高）和生产部署成熟度（试点到规模化生产）两个维度，绘制 FieldAI 已知客户与合作伙伴关系。
    data:
      columns:
        - 试点 / 早期
        - 单站点生产
        - 多站点生产
        - 车队 / 企业级规模
      rows:
        - label: 高结果证据（具名高管引用 + 指标）
          values:
            - ''
            - DPR Construction（45K 照片，500K sqft，现场主管引用）
            - Big-D Construction（多站点，2+ 年，高管 + 现场主管引用，VDC 总监）
            - ''
        - label: 中等结果证据（合作伙伴确认收益）
          values:
            - ''
            - ''
            - Boston Dynamics（称巡检时间减少 >90%）
            - ''
        - label: 低结果证据（公司归因、无法验证的指标）
          values:
            - ''
            - 未具名全球制造商（速度提升 200×，未验证）
            - ''
            - ''
        - label: 最少 / 仅合作关系证据
          values:
            - Certis Group（2026 年 2 月签署合作，实时运营规模未确认）
            - 2 家未具名 ENR 公司（确认部署，未披露结果）
            - ''
            - ''
    approximationNotes: |
      结果证据质量由分析师根据证据的独立性、具体性和归因评定。成熟度位置反映公开披露的部署时长和规模，不代表公司内部数据。该矩阵只是局部视图 —— FieldAI 完整客户群未公开披露。
    claimRefs:
      - CU019
      - CU023
      - CU026
      - CU028
      - CU029
      - CU030
  - id: FR001
    title: 风险热力图 —— 发生可能性 vs. 影响
    type: matrix
    layout: wide
    summary: |
      截至 2026 年 5 月，按四档影响（关键、高、中、低）和三档发生可能性（低、中、高）排列 FieldAI 的主要风险。位置由分析师根据公开证据评估。
    data:
      columns:
        - 低发生可能性
        - 中发生可能性
        - 高发生可能性
      rows:
        - label: 关键影响
          values:
            - ITAR 违规（FieldAI Federal）；人员离职带来的 IP 模仿
            - EU AI Act 执法行动；Boston Dynamics 合作终止
            - 重大安全事故（人身伤害）；Ali Agha 在关键增长阶段离职
        - label: 高影响
          values:
            - NVIDIA 供应切断（投资方关系有所缓释）；客户数据泄露
            - 估值重置 / 降价轮；企业销售转化停滞；CTO/CSO 离职
            - 商业化延迟至 2027 年以后；GPU 供应成本通胀
        - label: 中等影响
          values:
            - 美国州级 AI Act 合规处罚（Colorado、California）
            - Certis Group 平台不兼容；融资后工程团队流失
            - 机器人 OEM SDK 不兼容；客户在试点现场部署失败
        - label: 低影响
          values:
            - 轻微 OT 网络安全未遂事件（已控制）；HR 纠纷
            - 建筑工地机器人导航错误（无伤害）；第三方 IP 争议
            - 媒体批评 AI 估值过高叙事
    approximationNotes: 发生可能性和影响是分析师基于公开证据和行业类比作出的序数评估；不是来自量化 fault-tree 或 Monte Carlo 模型。
    claimRefs:
      - CR004
      - CR006
      - CR016
      - CR019
      - CR040
      - CR041
      - CR042
      - CR045
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: |
      FieldAI 的主要风险事件如何传导到收入、客户、利润率、融资和估值结果。箭头表示传播路径。
    data:
      nodes:
        - id: r1
          label: 安全事故（FFM 失效造成的人身伤害）
          body: First-order risk event; triggers regulatory, commercial, and reputational cascades simultaneously.
        - id: r2
          label: EU AI Act 执法 / 市场封锁
          body: Regulatory action blocking EU product sales or requiring expensive compliance retrofit.
        - id: r3
          label: Boston Dynamics 合作流失
          body: Commercial partnership termination or Hyundai strategic pivot removing primary reference case.
        - id: r4
          label: Ali Agha 离职
          body: Key-person event removing primary technical credibility, commercial relationships, and public narrative.
        - id: r5
          label: 估值重置 / 降价轮
          body: >-
            Financing event at sub-$2B valuation signals market repricing; triggers preference stack, dilution, and
            morale effects.
        - id: r6
          label: 客户流失
          body: Customers withdraw or defer expansion following safety, regulatory, or partner disruption events.
        - id: r7
          label: 收入增长放缓
          body: Pipeline stalls due to procurement freeze, reference customer loss, or competitive substitution.
        - id: r8
          label: 利润率压缩
          body: Higher cost-of-delivery from compliance, integration rework, or hardware dependency repricing.
        - id: r9
          label: 融资受损
          body: Inability to raise at sufficient valuation; forces dilutive financing or operational cuts.
        - id: r10
          label: 人才流失螺旋
          body: Below-threshold equity value, uncertain trajectory, and competitor offers drive senior departures.
      edges:
        - from: r1
          to: r6
          label: 客户撤出
        - from: r1
          to: r2
          label: 监管审查升级
        - from: r2
          to: r7
          label: EU 市场准入受阻
        - from: r3
          to: r6
          label: 参考案例丢失
        - from: r3
          to: r7
          label: 销售管线受扰
        - from: r4
          to: r9
          label: 投资者信心受挫
        - from: r4
          to: r6
          label: 商业关系受损
        - from: r6
          to: r7
          label: 客户流失压低 ARR
        - from: r7
          to: r9
          label: 增长放缓削弱融资能力
        - from: r8
          to: r9
          label: 利润率压缩降低吸引力
        - from: r9
          to: r5
          label: 被迫降价轮
        - from: r5
          to: r10
          label: 股权价值坍塌触发人才流失
        - from: r10
          to: r7
          label: 团队退化拖慢产品 / 销售
    claimRefs:
      - CR005
      - CR009
      - CR016
      - CR023
      - CR035
      - CR040
      - CR041
      - CR045
      - CR050
  - id: FR003
    title: 依赖图谱 —— 关键伙伴、平台与投资人
    type: dag
    layout: wide
    summary: |
      截至 2026 年 5 月，FieldAI 运营生态中的关键技术、商业和资本依赖。箭头表示依赖方向；更粗关系代表更高集中度风险。
    data:
      nodes:
        - id: dep1
          label: FieldAI FFM 平台
          body: Core product; depends on all downstream nodes for training, deployment, and commercial scale.
        - id: dep2
          label: Boston Dynamics / Hyundai Motor Group（平台伙伴）
          body: >-
            Primary hardware partner and strategic investor; Spot is the primary commercial robot platform; Hyundai owns
            Boston Dynamics.
        - id: dep3
          label: NVIDIA（NVentures 投资方 + Omniverse / Isaac / OSMO）
          body: Strategic investor and deep technical dependency across simulation, training, and pipeline infrastructure.
        - id: dep4
          label: Certis Group（Mozart 编排）
          body: Security vertical partner; fleet command-and-control integration dependency.
        - id: dep5
          label: Microsoft Azure
          body: Cloud hosting for NVIDIA Physical AI Data Factory Blueprint and synthetic data pipeline.
        - id: dep6
          label: 机器人 OEM SDK 池（Spot SDK、Unitree 等）
          body: Enables hardware-agnostic deployment; custom Spot SDK fork is primary active integration.
        - id: dep7
          label: Bezos Expeditions / Prysm Capital / Temasek（投资人）
          body: Lead investors in $314M round; continued follow-on and board support expected for next raise.
        - id: dep8
          label: CMU Robotics Innovation Center
          body: R&D and testing infrastructure; 1.5-acre outdoor ground as inaugural corporate tenant.
      edges:
        - from: dep1
          to: dep2
          label: 硬件集成（Spot SDK fork）
        - from: dep2
          to: dep1
          label: 传感器数据 + 平台访问
        - from: dep1
          to: dep3
          label: 仿真 + 训练流水线
        - from: dep3
          to: dep1
          label: GPU 计算 + Omniverse 工具链
        - from: dep1
          to: dep4
          label: FFM 车队互操作（Mozart API）
        - from: dep4
          to: dep1
          label: 安防部署渠道
        - from: dep3
          to: dep5
          label: Azure 托管的 NVIDIA 流水线
        - from: dep5
          to: dep1
          label: 云计算 + 存储
        - from: dep1
          to: dep6
          label: OEM SDK 集成
        - from: dep6
          to: dep1
          label: 机器人执行 + 传感器流
        - from: dep7
          to: dep1
          label: 资本 + 董事会治理
        - from: dep1
          to: dep8
          label: 研发测试与操作研究
    claimRefs:
      - CR023
      - CR024
