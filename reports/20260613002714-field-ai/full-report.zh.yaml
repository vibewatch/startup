        - 低至中 —— 设备端不确定性量化是设计特性；未发布独立安全审计
        - 高 —— 未发现 ISO 10218 或 IEC 61508 认证
        - 未发布性能基准、安全验证报告或第三方安全审计
      - - 针对边缘设备群或云分析平台的网络安全攻击
        - 低至中 —— 工业 OT 环境越来越常被攻击；设备群联网形成攻击面
        - 高 —— 对抗性传感器欺骗可能造成物理伤害；客户现场数据外泄
        - 低 —— 未发现 SOC 2、IEC 62443 或已发布渗透测试
        - 高 —— 未见安全认证证据
        - 未披露公开 DPA、安全白皮书或面向 OT 的网络安全计划
      - - 危险环境中的设备端硬件故障（边缘计算、传感器）
        - 中 —— 采矿、建筑和能源部署的恶劣条件会加速硬件退化
        - 中 —— 任务失败、数据丢失，可能带来机器人回收风险
        - 中 —— Boston Dynamics Spot 面向工业占空比设计；FieldAI 的计算载荷为定制
        - 中 —— 极端环境下载荷 MTBF 公开数据有限
        - FieldAI 专用载荷的平均故障间隔（MTBF）数据未公开
      - - 监管不合规阻断欧盟或美国州级市场准入
        - 中 —— EU AI Act 2026 年 8 月期限；Colorado AI Act 2026 年 6 月；合规计划未确认
        - 高 —— 市场准入中断、罚款、企业客户声誉受损
