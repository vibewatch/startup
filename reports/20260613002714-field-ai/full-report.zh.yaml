  - id: TE002
    title: 工作流 / 使用场景表
    columns:
      - 用户任务
      - 当前 / FieldAI 前工作流
      - FieldAI 方案
      - 可衡量收益（声称）
      - 已记录限制
    rows:
      - - 施工进度监测
        - 人工巡场、无人机飞行、3D 扫描项目（数周）
        - 自主夜间 Spot 巡逻 → 每日 3D 进度报告，并接入 BIM
        - 巡检 / 文档时间减少 90%+（Boston Dynamics 新闻稿）
        - 声称未经独立第三方验证；单一供应商来源
      - - 工业设备巡检
        - 受训技术员在危险区域人工巡检
        - 机器人自主导航设施，无需预制地图路线即可采集设备读数
        - 降低人员暴露于危险条件；更早发现异常
        - 未发布误报率或覆盖率数据
      - - 数字孪生生成
        - 人工 3D 扫描项目——数月完成，很快过时
        - 机器人每天把重建数据作为运营副产物生成 + NuRec → Isaac Sim
        - 某未具名客户从 3.5 个月缩短到 12 小时（>200× 更快，公司声称）
        - 单一未具名客户；未经独立验证
      - - 安防巡逻与事件响应
        - 人工安保巡逻，覆盖一致性有限
        - 自主机器人巡逻 → 实时事件检测 → 通过 Mozart 协调人机响应
        - 运营效率和韧性提升（Certis 声称）
        - Certis 部署规模未披露；缺少独立评估
      - - 联邦 / ISR 行动
        - 在 GPS 拒止或危险区域执行有人侦察
        - FFM 驱动机器人在未测绘环境中执行地下和野外 ISR 导航
        - DARPA SubT 胜利验证其在 GPS 拒止条件下的方法
        - 国防合同细节涉密；无商业等价性能基准
      - - 多机器人站点协同
        - 机器人顺序执行或人工调度，共享态势有限
