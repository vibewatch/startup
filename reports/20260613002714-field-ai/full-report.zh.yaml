      - number: '1.3'
        title: 融资历史与投资人构成
        blocks:
          - type: paragraph
            body: >
              FieldAI 自 2023 年创立后一直隐身运营，直到 2025 年 8 月 20 日才同时披露连续两轮融资合计 $405 million，并宣布估值达到 $2 billion——较上一轮确立的 $500
              million 估值翻了四倍。最近一轮融资 $314 million，且获得超额认购；共同投资方包括 Bezos Expeditions（Jeff Bezos 家族办公室）、Prysm Capital 和
              Temasek。两轮其他投资方包括 BHP Ventures、Canaan Partners、Emerson Collective、Intel Capital、Khosla
              Ventures、NVentures（NVIDIA 风投部门）等。Gates Frontier（Bill Gates 投资机构）和 Samsung 被列为“既有投资人”，说明它们参与了确立 $500
              million 估值的上一轮。按披露总额倒推，第一轮约融资 $91 million。注意：部分预尽调资料把融资拆分描述为 $150 million（种子轮）加 $255 million（Series
              A）；这一拆分与 Reuters 报道的最新轮 $314 million 不一致，也无法从一手来源确认。超额认购和投资人水准——覆盖科技风投领袖（Khosla、NVentures、Intel
              Capital）、主权财富与机构资金（Temasek、BHP）、慈善资本（Gates Frontier、Emerson Collective），以及全球最富有人群的家族办公室（Bezos
              Expeditions）——反映出异常广泛的投资人信念。Vinod Khosla 表示：“FieldAI 站在通用机器人革命前沿，其快速部署能力将释放长期经济和社会价值。” Intel Capital
              的公开背书帖子正式确认了与 Intel 硬件栈的平台集成和战略关系。融资用途包括全球扩张、产品开发（运动、操作）以及到 2025 年底将员工数翻倍。
