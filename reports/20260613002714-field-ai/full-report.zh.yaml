      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >
              FieldAI 的投资论点建立在五根相互咬合的支柱上。第一，工业机器人硬件商品化之后，具身 AI
              软件层在结构上有机会吃下企业价值的大头：一个硬件无关的软件大脑，靠多样化部署中的联邦学习形成网络效应，天然有垄断吸引力。第二，创始团队——Ali Agha（NASA JPL/DARPA SubT
              获胜者）、Shayegan Omidshafiei（DeepMind/MIT）和 David Fan（DARPA
              RACER/JPL）——已有可信先例，证明这一路线能在真实场地跑通，而不只是仿真。第三，投资人集团（Bezos Expeditions、Khosla
              Ventures、NVentures/NVIDIA、Temasek、Intel Capital、Gates Frontier）可能是围绕一家机器人 AI
              公司聚集的最强战略和财务投资人组合，他们也做过外部看不到的私下尽调。第四，公司出隐身期时，生产部署已经覆盖三大洲数百个现场，并在公告后 9 个月内报告 >$100M 已预订收入——商业牵引速度快于任何可比具身
              AI 软件公司。第五，建筑、能源、采矿、物流和国防的总可服务市场大，渗透率仍低。


              反论点逐一挑战这些支柱。如果机器人 OEM 纵向整合自有 AI 软件（Boston Dynamics、Figure AI、Agility
              Robotics），或大型云服务商（Google/Intrinsic、NVIDIA Cosmos）把基础模型层商品化，硬件无关优势可能被削弱。收入数字仍未验证：$100M
              已预订收入来自匿名消息源，「booked」可能包含管线或未承诺订单；$140M ARR 估算来自第三方分析平台，方法未披露；另一个估算把收入压到 $5M，差距达
              28×。外部投资者面对的治理和财务透明度几乎为零：没有经审计财报，运营实体未提交 Form D，毛利率、CAC 或 NRR 均未披露。$2B 估值已计入大量执行兑现：即便按 $140M ARR 计算，14×
              收入倍数也要求高毛利、高留存和持续高速增长，才能支撑二级入场。资深投资人 Howard Morgan（First Round Capital/B
              Capital）已公开警告，「高价买入、更高价卖出只在泡沫里成立」；Seattle 地区 VC 在 2025 年 12 月 GeekWire 圆桌上也指出，种子轮和 Series A
              阶段的私营市场估值已经远远跑在基本面前面。2026–2027 年环境下，Series B+ AI 软件发生倍数压缩是真实风险。
