  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              FieldAI 部署的 AI 系统会在安全关键工业环境中作出自主物理决策，因此正落入多个 2026 年演进中的 AI 监管框架范围。根据 EU AI Act，用作工业场景安全组件的机器人 AI
              系统被列为高风险，需要风险管理系统、技术文档、人类监督设计、CE 标识和上市后监测。Baker Botts 指出，Annex III 高风险系统原定 2026 年 8 月 2 日期限，受 European
              Commission Digital Omnibus 提案影响，可能延至统一标准发布后六个月（最终兜底为 2027 年 12 月）；但延期取决于 2026 年 8
              月前是否获采纳，意味着公司必须按现有期限并行推进合规准备。Colorado AI Act（SB 24-205）将于 2026 年 6 月 30 日生效，是美国首部针对高风险 AI
              系统的综合州法，要求影响评估、消费者披露，并采取合理注意防止算法歧视。California SB 53 自 2026 年 1 月生效，要求大型前沿 AI 模型（训练 >10²⁶
              FLOPS）的开发者发布风险框架，并在 15 天内报告关键安全事件；FieldAI 的训练算力是否越过该阈值未披露。联邦方向仍未定：Trump administration 2025 年 12
              月行政令显示有意优先于州级 AI 法律，但目前并未实际排除州法，合规负担仍呈拼图状。

              产品责任方面，法院正围绕 AI 部署形成产品责任框架。KL Gates（2026 年 3 月）记录了越来越多诉状把已部署 AI 系统视为“产品”，适用设计缺陷、未警示和可预见误用等理论。EU 修订后的
              Product Liability Directive 将严格责任沿供应链延伸至上游 AI 组件提供商；即便部署客户或机器人 OEM 拥有终端产品关系，FieldAI 也会被纳入。Garcia v.
              Character Technologies 形成了一个先例：面向消费者的 AI 在起诉阶段可被视为严格责任下的产品。对工业机器人 AI 而言，物理伤害因果（压伤、撞击、意外运动）会比消费者聊天机器人案件更直接。

              未发现涉及 FieldAI 的公开执法行动、监管调查、诉讼或 IP 争议。FieldAI Federal 作为国防子公司，若其自主系统进入军民两用技术范围，将受 ITAR/EAR
              出口管制约束；未发现公开出口授权披露。IP 保护主要依赖商业秘密和发表速度，而非已授权专利：USPTO 专利申请检索显示有一件已提交专利申请（US 2025/0252306），但截至 2026 年 5
              月没有授权专利；若人员离职，核心 FFM 技术可能暴露在模仿风险下。
