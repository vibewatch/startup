  - id: TV002
    title: 投资逻辑与反向逻辑
    columns:
      - 论点
      - 证据基础
      - 什么会改变判断
    rows:
      - - 投资逻辑：机器人硬件商品化后，硬件无关 AI 软件能捕获近似垄断份额
        - FFM 已部署在四足 / 人形 / 轮式 / 履带式平台；TechCrunch 和官方来源确认其硬件无关架构
        - OEM 垂直整合（Boston Dynamics、Figure）拿走“大脑层”；或超大规模云厂商（Google Intrinsic、NVIDIA Cosmos）把基础模型商品化
      - - 投资逻辑：创始团队拥有该领域最高的现场机器人可信度
        - DARPA SubT 获胜、NASA JPL、MIT/DeepMind 履历已记录；Marc Raibert/Vinod Khosla 背书在案
        - 若 CEO 离职，则出现关键人物风险；CSO 或 CTO 被资金更充裕的竞争对手吸走
      - - 投资逻辑：顶级投资人投入 $405M，反映私有尽调优于公开数据
        - 轮次超额认购；Bezos Expeditions、Temasek、Khosla、NVentures 均参与；投资人声明确认其商业信心
        - 若 Series B 出现 down round，将与私有尽调逻辑相冲突；若投资人下调持仓价值，信号反转
      - - 投资逻辑：宣布后 9 个月内已签约收入超过 $100M，商业牵引速度异常快
        - OCBJ 2026 年 4 月匿名来源；GetLatka 估计 ARR 为 $140M；CEO 称有数百万美元级合同
        - 已签约收入与管线混同；ARR 显著更低；流失暴露客户不满
      - - 反向逻辑：收入未验证，估计区间相差 28x
        - 估计从 $5M（CompWorth）到 $140M ARR（GetLatka）不等；无经审计数字；OCBJ 来源匿名
        - 公司发布经审计 ARR；若数字高于 $80M，基本可弥合该缺口
      - - 反向逻辑：对一家 $2B 公司而言，治理透明度极低
        - 未披露董事会构成；Field Ai, Inc. 没有 Form D；无经审计财务；无 cap table 细节
        - NDA 下开放正式 data room 可满足要求；IPO 前财务报告可弥合缺口
      - - 反向逻辑：AI 软件倍数压缩是 2026–2027 年的结构性风险
        - Howard Morgan（First Round Capital）警告 AI 估值过热；Madrona 合伙人指出种子轮 / Series A 定价远超基本面
        - 若行业在已验证收入支撑下整体向上重估，可抵消该风险；或 FieldAI 自身 Series B 估值上台阶可确认
      - - 反向逻辑：竞争对手（Physical Intelligence、Skild AI）以可比或更弱收入拿到更高估值
        - PI 正以零收入洽谈 $11B 估值；Skild 以 $30M ARR 获 $14B 估值；行业可选性溢价抬高所有估值
        - 若行业倍数压缩，且 PI 或 Skild 以持平 / 下调估值融资，FieldAI 的 $2B 可能显得昂贵
    notes: |
      投资逻辑行代表乐观 / 证实性解读；反向逻辑行代表悲观 / 挑战性解读。两组观点截至 2026 年 5 月 runDate 均有证据支撑。
