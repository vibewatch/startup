  - id: TV005
    title: 投资逻辑失效与终止触发器
    columns:
      - 触发器
      - 阈值 / 可观测事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - Series B 下调估值
        - Series B 以低于 $2.0B 的估值完成
        - 直接推翻私募投资人逻辑；意味着收入不及预期或赛道重估
        - 下调至回避；立即退出或降低敞口
      - - 主要客户流失或部署失败
        - 公开宣布客户退出，或安全事件导致部署暂停
        - 削弱「数百个站点、三大洲」的商业牵引叙事
        - 复核持仓；行动前判断事件是个别问题还是系统性问题
      - - 收入修正大幅低于 $100M 已签订单
        - 公司披露或调查报道显示已签收入 <$50M，或已签订单 ≠ ARR
        - 按真实 ARR 计算，估值倍数跳至 40x+；超出当前阶段的合理范围
        - 下调至回避；倍数压缩至 10–15x 将对应 $500M–750M 估值
      - - 被超大规模云厂商竞争替代
        - NVIDIA Cosmos、Google Intrinsic 或 Amazon AWS Robotics 发布可比 FFM 服务
        - 授权费承压；平台风险兑现；护城河被质疑
        - 重新评估防御性；视影响范围下调至观察或回避
      - - 治理或法律风险事件
        - IP 纠纷、监管行动、关键人物离职（CEO 或 CSO）或 SEC 执法
        - 动摇团队和投资人信心；抬高执行风险
        - 重大风险事件 → 降至观察，等待解决；严重事件 → 回避
    notes: |
      这些触发器按可观测阈值定义，便于在拿不到私有财务数据时持续监控。五项均属投资逻辑失效条件；任一发生都会实质改变建议。下调估值轮是最具行动性的公开信号。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经审计 ARR 与收入确认政策
        - 无经审计财务；估计区间为 $5M–$140M；「已签收入」≠ 已确认 ARR
        - 没有经验证的收入锚，无法支撑 $2B 估值；决定适用 14x 还是 400x 倍数
        - 在 NDA 下索取经审计或审阅的 P&L 与 ARR 明细；可接受滚动 12 个月 ARR，并附收入确认脚注
      - - 按收入流拆分的毛利率
        - 未披露；软件授权与硬件集成拆分未知；混合毛利无法验证
        - 软件级毛利率（70–80%）支撑溢价；混合毛利（55–65%）不支持同样倍数
        - 索取按授权与服务拆分的贡献毛利瀑布图；对照公开 AI SaaS 基准
      - - 净留存率（NRR）与队列数据
        - 未披露；公司称有「扩张合同」，但 NRR 未验证
        - NRR >120% 才能支撑先落地再扩张的 SaaS 倍数；<100% 将触发悲观情景
        - 索取按产品线拆分的季度队列留存；确认 2024–2026 队列的 ACV 轨迹
      - - 股权结构表、清算优先权与期权池
        - 未披露；优先权悬顶和反稀释保护未知
        - Series A/A1 若有沉重清算优先权，基准情景下普通股价值可能接近零
        - 向 Series A 主投法律顾问索取股权结构摘要和瀑布分析；确认优先权结构
      - - 董事会构成与治理文件
        - 未公开披露；独立董事未知
        - 治理质量是机构投资人的关键尽调维度；治理薄弱 = 更高代理风险
        - 索取董事会材料、观察员权利协议和投资人权利协议；确认审计委员会状态
      - - 客户集中度与合同条款
        - 客户名称未披露；前 5 大客户收入集中度未知；合同期限 / 续约条款未知
        - 高集中度（前 3 大客户 >50% 收入）会实质改变流失风险画像
        - 在 NDA 下索取脱敏客户明细；确认单一客户收入上限；审查合同续约条款
    notes: >
      六项都是标准投前尽调要求。对这个阶段的私营公司而言并不异常；要用任何基本面锚支撑 $2B
      估值，六项都必不可少。前三项（ARR、毛利率、NRR）是从观察升至买入的最低门槛；后三项（股权结构表、治理、客户集中度）是任何投委会批准的必要条件。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
