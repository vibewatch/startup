  - id: TR003
    title: 合作伙伴 / 依赖风险登记表
    columns:
      - 依赖项
      - 交易对手
      - 角色
      - 集中度
      - 失败情景
      - 严重性
      - 缓释措施
      - 剩余敞口
    rows:
      - - Boston Dynamics Spot 硬件平台
        - Boston Dynamics / Hyundai Motor Group（平台伙伴）
        - 建筑垂直的主要商用硬件平台；主要参考客户案例研究
        - 高 —— 建筑市场进入案例以 Spot 为中心
        - 合作终止、Hyundai 战略转向、Spot 平台停产，或 Hyundai-FieldAI 投资人冲突
        - 严重 —— 失去主要商用案例研究、收入集中、市场叙事
        - FFM 硬件无关设计；推进更多 OEM 合作；Hyundai 的财务投资让部分激励一致
        - 重大 —— 未披露排他或最低承诺条款；投资人关系不保证商业连续性
      - - NVIDIA Omniverse / Isaac / OSMO 计算与仿真栈
        - NVIDIA（通过 NVentures 作为战略投资人）
        - 仿真训练、合成数据生成、数字孪生重建；深度模型流水线依赖
        - 高 —— 训练和部署流水线多处使用 NVIDIA 产品
        - 价格上涨、供应优先分配给超大规模云厂商、API 废弃，或战略伙伴优先级变化
        - 高 —— 模型训练成本和流水线可靠性绑定 NVIDIA 可用性与定价
        - NVentures 投资人关系；NVIDIA Omniverse 合作加深；边缘推理设计可在多种硬件上运行
        - 中 —— 投资人一致性降低突然切断风险；GPU 供应紧张是全市场约束
      - - Certis Group 设备群编排（Mozart 平台）
        - Certis Group（安防垂直合作伙伴）
        - 安防运营中的设备群指挥控制集成；互操作依赖
        - 中 —— 安防垂直商业管线取决于 Mozart 兼容性
        - Certis 平台废弃、战略变化，或与 FieldAI 直销产生竞争冲突
        - 中 —— 若 Certis 分道扬镳，会限制安防垂直可部署性
        - FFM 设计为中间件层；可接入替代编排系统
        - 低至中 —— 依赖深度低于 NVIDIA 或 Boston Dynamics
      - - NVIDIA 和云 GPU 计算（模型训练）
        - NVIDIA / Azure / 超大规模云厂商
        - FFM 模型改进的训练基础设施；来自部署数据的联邦学习
        - 中 —— 集中在 NVIDIA GPU 生态；Azure 用于流水线工具链
        - 持续 GPU 供应短缺（HBM 瓶颈、TSMC 冲击）推高训练成本或延迟模型更新
        - 中 —— 放慢模型改进速度；提高资本强度
        - $405M 融资提供资本缓冲，可锁定长期云承诺
        - 中 —— GPU 供应结构性约束是全市场问题，并非 FieldAI 特有
      - - 机器人 OEM SDK 和载荷访问（多平台）
        - Boston Dynamics、Unitree、其他 OEM
        - 每个硬件平台接入 FFM 都需要 SDK 访问；FieldAI 维护定制 Spot SDK 分叉
        - 中 —— 每个 OEM 集成都是定制工程；OEM SDK 变化会打断集成
        - OEM SDK 不兼容、许可撤销，或 OEM 自研竞争性自主软件
        - 中高 —— OEM 垂直整合 AI 栈是长期竞争威胁
        - 硬件无关设计理念；多个活跃 OEM 集成降低单一 OEM 锁定
        - 中 —— Boston Dynamics 的 OEM 所有者（Hyundai）有战略动机，长期可能自己掌控自主层
    notes: 合作条款（排他、收入分成、最低承诺、终止权）均未公开披露。集中度评估仅基于公开合作公告和产品文档。
