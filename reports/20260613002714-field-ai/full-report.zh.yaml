      - number: '3.3'
        title: 定价与打包对比
        blocks:
          - type: paragraph
            body: >
              竞争场内定价透明度低；多数平台通过企业采购销售，没有公开标价。FieldAI 的订阅据称按部署规模从每年数万美元到 $500,000 不等，公司引用 $100 million 或更多预订收入，第三方估算称
              2025 年 ARR 为 $140 million。Intrinsic 不公布 Flowstate 定价；Google 的云优先模式暗示企业 SaaS 分层会叠加在 Google Cloud
              计算费用之上，Fanuc 合作则意味着批量授权。Physical Intelligence 没有商业产品或定价。Gecko Robotics 把巡检服务、Cantilever
              平台访问和工程咨询打包进多年合同；海军 IDIQ 展示了 18 艘舰船、五年 $71 million 的合同上限。Boston Dynamics Orbit 作为硬件之上的软件层销售；年费未披露，但
              Michelin 和其他企业案例研究把它称为持续运营软件。Viam 提供开发者友好的免费层，并按需提供企业定价；开源模式先推动开发者采用，再向托管基础设施上售。Machina Labs
              按制造服务合同定价，而不是软件订阅。行业估计，仅美国海军每年现状人工巡检成本就达 $13–$20 billion；Boston Dynamics 合作公告称，FieldAI 支持的系统可把建筑工地文档时间减少超过
              90%。
