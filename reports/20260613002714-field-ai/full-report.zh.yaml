      - number: '7.4'
        title: 人才与执行风险
        blocks:
          - type: paragraph
            body: >
              FieldAI 创始团队拥有极强领域可信度——Ali Agha 领导 DARPA SubT 冠军 CoSTAR 团队，以及此前担任 NASA JPL principal
              investigator，是投资人和客户信心的主要来源。这也造成集中的关键人物风险：Agha 同时是公司公众面孔、主要技术思想领袖，也是最可见的商业关系负责人。未发现具名 COO、Head of
              Engineering，或具有同等公开声望的平行商业领导者。David Fan（CTO）和 Shayegan Omidshafiei（CSO/President）提供了一定领导层厚度，但公开形象明显不及
              Agha。若 Agha 非自愿离职、长期无法履职或发生声誉事件，融资、企业客户信心和伙伴关系都可能同时受扰。

              创始人之外，FieldAI 还面临快速扩张时的人才风险，而它所在的是科技行业竞争最激烈的劳动力市场之一。据报道，员工数从 2023 年创立增长到 2025 年 8 月的
              130+，意味着年化增长会让文化维护、工程协调和产品执行纪律难以持续。公司与 Google Intrinsic（现已整合进 Google AI）、Physical Intelligence（融资
              $700M+）、Amazon Robotics 和 Tesla Optimus 争抢机器人 AI 工程师——这些公司都在同一个狭窄人才池里招聘能够规模化做具身 AI
              的博士和资深工程师。未发现融资后关键技术人员离职证据，但缺少公开证据并不等于稳定性得到确认。

              执行风险也体现在商业维度。FieldAI 直到 2025 年 8 月都处于隐身状态；可展示的企业销售能力还不到一年。公司没有公布客户名称、带验证结果的部署案例，或留存指标。从研究血统团队（NASA
              JPL、DARPA）转型为对收入负责的企业软件供应商，是一个有充分记录的组织拐点，许多深科技 spinout 都无法足够快跨过去，从而难以支撑其估值轨迹。
            claimRefs:
