    title: 增长驱动因素与采用约束表
    columns:
      - 驱动因素 / 约束
      - 类型
      - 方向
      - 时间
      - 对 FieldAI 的影响
      - 尽调问题
    rows:
      - - 建筑、采矿、能源行业劳动力短缺
        - 驱动因素
        - 正向
        - 当前 → 数十年结构性趋势
        - 人工替代方案变少，客户付费意愿和紧迫感上升，试点到签约周期缩短
        - 核验各垂直行业劳动力短缺的量化口径，并对应到具体客户预算批准
      - - 安全监管（MSHA、OSHA、IEC 61511、OHS 框架）
        - 驱动因素
        - 正向
        - 当前 → 加速
        - 监管强制要求推动采矿和 O&G 更快采用自主系统；HSE 预算成为部署触发点
        - 跟踪 MSHA 执法行动，并映射到 FieldAI 目标客户的 MSHA 合规状态
      - - 自主能力成熟（FFM、VLA 模型、边缘 AI）
        - 驱动因素
        - 正向
        - 2026–2028 拐点
        - FieldAI 物理优先的 FFM 目前有差异化；竞争对手的 VLA 模型到 2028 年可能缩小差距
        - 在真实非结构化部署中，对标 FFM 与竞争基础模型的任务表现
      - - 硬件商品化（Boston Dynamics Spot 价格、人形机器人）
        - 驱动因素
        - 正向
        - 2026–2030 趋势
        - 机器人硬件商品化后，软件智能层吃到越来越多利润
        - 监测 Spot 价格趋势，以及 FieldAI 与 OEM 合作伙伴的版税 / 收入分成模式
      - - CAPEX 周期和 ROI 验证要求
        - 约束
        - 负向
        - 持续
        - 企业采购委员会在规模化前要求多年 ROI 证据，拖慢收入确认
        - FieldAI 已将多少试点转成多年期企业合同？平均销售周期多长？
      - - 集成复杂度和传统 OT/IT 系统
        - 约束
        - 负向
        - 持续
        - 运营方使用彼此不兼容的传统数据格式（BIM、ERP、historian）；集成开销推高部署成本
        - 评估 FieldAI 与主流 BIM（Autodesk BIM 360）、ERP 和 OSIsoft PI 系统的集成深度
      - - 试点炼狱（BuiltWorlds：尽管 95%+ 评价正面，机器人活跃使用率仍从 65% 降至 46%）
        - 约束
        - 负向
        - 近期（2025–2027）
        - 正面评价没有转化为实际部署；试点后的流失风险在全行业都高
        - 索取 FieldAI 试点转企业合同转化率和流失数据；这是最关键的商业指标
      - - 地缘政治扰动和大宗商品价格波动
        - 约束
        - 负向
        - 间歇性
        - 油价冲击、工业硬件关税和地缘政治冲突可能让 O&G 与采矿 CAPEX 周期暂停
        - 评估 FieldAI 在垂直行业和地域上的收入多元化，判断宏观韧性
    notes: >-
      试点炼狱数据来自 Construction Dive 引用的 BuiltWorlds 2025 Equipment & Robotics Benchmarking 报告。MSHA 死亡事故数据来自 PMR 引用的 MSHA
      FY2024 记录。采矿劳动力短缺数字来自 PMR 引用的行业估计。McKinsey 障碍数据来自 2022 Global Industrial Robotics Survey。所有约束严重性评级均为分析师判断；FieldAI
      尚未披露转化率或流失指标。
