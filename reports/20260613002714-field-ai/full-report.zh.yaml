      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 结构性需求顺风跨越数十年并在汇合
            body: >
              建筑、采矿和能源行业的劳动力短缺不是周期性问题，而是由劳动力老龄化、危险工种吸引力下降和监管升级驱动的结构性问题。叠加 AI 自主能力在 2026–2028 年达到工业生产化成熟度，FieldAI
              的时点很好：技术已足够被证明（企业级部署、90%+ 效率提升已有记录），市场又足够早，平台在竞争碎片化前仍有机会建立在位优势。IFR 数据显示全球有 4.66 million 台在役工业机器人、年安装量
              542,000 台，为 FieldAI 的软件层提供了庞大且增长中的装机基础。
            calloutType: strength
            claimRefs:
              - CM008
              - CM031
              - CM033
              - CM035
          - type: callout
            title: 试点炼狱和企业转化缓慢是生存级风险
            body: >
              近期最重要的单一市场风险，是正面机器人评价与活跃部署之间有明确记录的缺口。BuiltWorlds 发现，2025 年 95%+ 建筑公司正面评价机器人，但只有 46% 报告活跃使用，低于上一年的 65%。该模式与
              McKinsey 的发现一致：71% 工业公司把资本成本、61% 把缺少内部经验列为采用障碍。对 FieldAI 而言，强劲试点表现不会自动转化为企业收入。公司的 $405M
              资金提供了解决转化问题的跑道，但试点到企业级部署的转化率，是决定 FieldAI 市场机会能否按预测时间线兑现的关键未披露指标。
            calloutType: risk
            claimRefs:
              - CM036
              - CM038
              - CM039
          - type: callout
            title: 硬件商品化后，软件层攫取不成比例价值
            body: >
              Analytics Insight 指出，工厂开始像选择云基础设施一样选择机器人：看其是否兼容某个智能生态，而不是只看单机硬件性能。随着机器人硬件规格趋同（Boston Dynamics Spot
              价格趋势下行；人形机器人进入价格竞争），软件智能层会吃掉越来越多的系统总价值。FieldAI 的硬件无关 FFM 架构，把它放在工业机器人潜在 OS
              级平台的位置——类似超大规模云厂商在企业计算中抽象硬件。长期看，软件层市场可能赢家拿大头，但前提是 FieldAI 在竞争者基础模型缩小自主能力差距前，靠数据飞轮优势建立转换成本。
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
              - CM019
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >
              到 2026 年，需要自主机器人运营的工业企业有五种实质不同的解法：（1）在现有硬件上部署 FieldAI 的 Field Foundation Models；（2）采用资金充足对手的具身 AI
              基础模型平台（Intrinsic/Google、Physical Intelligence、Covariant）；（3）使用带自有机器人栈的巡检专家平台（Gecko Robotics、Machina
              Labs）；（4）依赖机器人 OEM 捆绑的智能软件（Boston Dynamics Orbit、KUKA、Fanuc 原生 AI）；（5）维持现状——人工巡检班组、依赖 SLAM/GPS
              的传统导航，或内部软件团队。多数大型企业买家会同时使用不止一种方式，多归属常见，转换成本也比表面看起来更软。FieldAI 瞄准最大未满足切片：动态、无 GPS、非结构化现场环境，在这些场景中，现状方案和 OEM
              原生方案失效。公司的硬件无关软件模式避开机器人制造的资本密集度，同时能覆盖比任何单一 OEM 更多的平台。截至 2026 年 5 月，下文列出的八家直接和替代玩家合计拥有的风投与公司资本显著高于
              FieldAI，这既验证了市场，也带来资源充足竞争者深扎市场的实质风险。
