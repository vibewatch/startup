        - 判例法到 2026 年仍在演进；欧盟 PLD 需在 2026 年 12 月前转化
        - 高 —— 工业机器人场景下，物理伤害因果链直接且可预见
        - 严重 —— 设计缺陷、未警示、供应链上游严格责任
        - 产品责任保险；安全文档；系统护栏；客户赔偿条款
        - 高 —— 未发现已发布的安全认证、DPA 或独立审计
