      - number: '5.5'
        title: 路线图、成熟度与开发者生态
        blocks:
          - type: paragraph
            body: >
              FieldAI 的产品成熟度在巡检和数据采集上最强：公司已有付费客户，并记录了跨数百个场地的生产部署。分析师报道和投资人材料中提到的三阶段路线图是：（1）近期至 2026
              年——自主巡检、监控和数据采集，已经商业化；（2）中期 2026–2028 年——干预和操控，从感知扩展到物理动作；（3）长期 2028 年以后——跨所有平台的通用自主，包括人形机器人。该路线图与 FieldAI
              所称使用 $405M 融资支持运动和操控能力开发相一致。

              CMU Robotics Innovation Center 入驻（2026 年 2 月宣布，Hazelwood Green 的 2,500 sq ft 空间）将公司的学术研究合作正式化，使其可使用 1.5
              英亩户外测试场和专业机器人实验室。FieldAI 赞助 CMU AirLab 和 LeCAR lab 的研究，并支持 VectorRobotics 学生团队做人形机器人
              loco-manipulation，显示公司在中长期路线图的能力缺口上持续投入。Field AI Research Institute（FAIRI）发表同行评议研究，NeBula DARPA SubT 论文以及
              2024 年关于风险感知 AI 和 MPPI 控制的论文，为其提供学术可信度。

              开发者生态访问受限。FieldAI 的 GitHub 组织（field-ai）托管了 10+ 个标准机器人库 fork，但没有发布自研 FFM 代码、模型权重或 SDK。未发现公开开发者门户、API
              文档或社区论坛（Discord、Slack、Stack Overflow 标签）。发布说明页面是私有 Squarespace 站点。这把开发者信号面限制在可观察的 GitHub
              仓库活动，而不是真正的实践者社区。NVIDIA 和 CMU 伙伴关系提供了工程可信度的间接代理，但外部仍无法从公开来源独立评估 FFM 能力。
