              FieldAI 的仿真到现实和模型改进流水线现在运行在 NVIDIA Omniverse NuRec、Isaac Sim、Isaac Lab、Cosmos 和 OSMO 上，Microsoft Azure
              承载工具链。这种三方依赖（NVIDIA、Microsoft、FieldAI）带来商业和技术集中风险。NVIDIA 算力基础设施的任何授权变化、平台下线或供给约束，都会影响模型改进速度和向客户交付数字孪生的能力。
