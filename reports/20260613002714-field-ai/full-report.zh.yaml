              $2B 投后估值建立在 $405M 融资、顶级投资人信号和匿名第三方收入估算之上，而不是经验证的财务基本面。缺少经审计 ARR、毛利率披露、客户数量或 SEC Form D
              文件，外部无法在没有非公开尽调权限的情况下承销这一估值。UpsideList 的二级市场模型估算，按当前隐含价格上行空间为
              -2%，反映出私募二级市场对财务不透明给出的信息折价。收入估算范围很宽（$50M–$140M ARR，跨度 2.8 倍），分析平台数据点彼此冲突，都说明估值几乎完全由前瞻叙事而非历史基本面托住。
