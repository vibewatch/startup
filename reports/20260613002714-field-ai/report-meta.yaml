  topStrengths:
    - >-
      Hardware-agnostic Field Foundation Models solve a real robotics bottleneck: autonomy in unstructured,
      safety-critical environments.
    - >-
      Founder-market fit is unusually strong, anchored in NASA JPL, DARPA SubT, DeepMind, and high-end field robotics
      experience.
    - >-
      Investor quality is top tier, with Bezos Expeditions, Temasek, NVentures, Intel Capital, and Khosla signaling
      strong private-market conviction.
    - >-
      Public case studies show measurable deployment value in construction, including 90%+ inspection/documentation time
      reduction and multi-project expansion at Big-D.
  topRisks:
    - >-
      Revenue, margins, retention, and board governance remain largely undisclosed, making valuation underwriting highly
      uncertain.
    - >-
      Publicly named customer proof is still narrow, concentrated in construction, and does not yet show broad
      cross-vertical production scale.
    - >-
      Safety, certification, and regulatory readiness for embodied AI in industrial settings remain partially
      unverified.
    - >-
      Key-person dependence on Ali Agha and deep dependencies on platform partners such as NVIDIA and Boston Dynamics
      add concentration risk.
  unresolvedGaps:
    - No audited ARR, recognized revenue, gross margin, or NRR disclosures are publicly available.
    - Board composition, preference stack, and detailed governance rights are not public.
    - The split between software subscriptions, services revenue, and hardware-integration fees is unverified.
    - Current headcount and exact headquarters designation vary across public sources.
    - Customer concentration outside the visible construction deployments is not measurable from public evidence.
