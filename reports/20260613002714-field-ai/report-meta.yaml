    - name: David Fan
      role: Co-founder & CTO
      background: Former DARPA SubT and RACER technologist and NASA JPL research fellow focused on deployable autonomy.
      claimRefs:
        - CO015
  foundingLocation: Southern California, USA
  headquarters: Irvine, CA, USA
  productSummary: >-
    FieldAI’s product is the Field Foundation Model platform: physics-first, risk-aware embodied AI that runs on partner
    robot hardware at the edge and enables perception, reasoning, planning, and multi-robot coordination in dynamic
    industrial environments.
  customerFocus: >-
    Large industrial operators and contractors in construction, energy, manufacturing, inspection, urban delivery, and
    selected federal applications that need autonomy in hazardous or unstructured environments.
  businessModel: >-
    B2B enterprise software licensing plus integration and deployment services, with recurring autonomy subscriptions
    layered on top of customer- or partner-owned robot hardware.
  stage: Series A private company
