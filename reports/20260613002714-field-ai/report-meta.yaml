companyProfile:
  summary: >-
    FieldAI is a private embodied AI software company founded in 2023 by former NASA JPL robotics leader Ali Agha and
    technical co-founders drawn from DeepMind, NASA JPL, and DARPA autonomy programs. The company sells Field Foundation
    Models, a hardware-agnostic software brain that lets third-party robots operate safely in unstructured industrial
    environments without GPS, pre-mapped scenes, or constant cloud connectivity. FieldAI’s public traction is strongest
    in construction, with named deployments at Big-D Construction and DPR Construction, but the company also targets
    energy, manufacturing, inspection, urban delivery, and federal use cases. Its August 2025 financing established a
    $2B valuation and one of the strongest investor syndicates in embodied AI, while leaving material questions around
    audited revenue, governance, and current scale unanswered.
  foundedDate: '2023-01-01'
  founders:
    - name: Ali Agha
      role: Founder & CEO
      background: >-
        Former NASA JPL principal investigator and DARPA Subterranean Challenge leader with roughly two decades in field
        robotics and autonomous systems.
      claimRefs:
        - CO011
