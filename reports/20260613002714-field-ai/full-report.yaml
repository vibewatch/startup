  - id: TV004
    title: Comparable Valuation Table
    columns:
      - Company
      - Stage / Last Round
      - Valuation
      - ARR / Revenue Signal
      - Revenue Multiple (est.)
      - Relevance to FieldAI
      - Limitation
    enumerationScope:
      coverage: partial
      basis: >
        Six embodied-AI software and industrial-robotics companies with publicly disclosed valuation marks from funding
        rounds announced between June 2025 and March 2026; excludes hardware-only robotics companies and public company
        comps. Coverage is partial: several closely comparable companies (Covariant post-Amazon acqui-hire, Boston
        Dynamics post-HMG) have no current private valuation.
    rows:
      - - Physical Intelligence
        - Series B ($600M, Nov 2025)
        - $5.6B (in talks for $11B+ per Bloomberg Mar 2026)
        - Near-zero disclosed; no commercialization timeline stated
        - N/A (pre-revenue); optionality multiple
        - Closest embodied-AI software peer; foundation model approach; hardware-agnostic
        - >-
          No revenue → valuation driven purely by research optionality and brand; less relevant for fundamental
          comparison
      - - Skild AI
        - Series C ($1.4B, Jan 2026)
        - $14B
        - $30M ARR (BusinessWire Jan 2026); growing rapidly
        - ~467x on $30M ARR
        - Direct competitor; same cohort (2023 founded); omni-bodied foundation model; similar positioning
        - >-
          Higher valuation on lower revenue signals extreme investor optimism; Skild's revenue verification is also
          limited
      - - Apptronik
        - Series A extension ($935M total, Feb 2026)
        - $5.3B
        - Not disclosed; hardware-first humanoid robotics
        - Undisclosed; likely low given hardware stage
        - Humanoid robotics integration partner; software+hardware model differs from FieldAI pure-software
        - Hardware economics drag margins vs. FieldAI software-only model; less directly comparable
      - - Gecko Robotics
        - Series D ($125M, Jun 2025)
        - $1.25B
        - Not separately disclosed; critical infrastructure inspection revenue growing
        - Undisclosed; industrial inspection sector
        - Industrial robotics AI platform; software + hardware; DARPA-credentialed team
        - Focus on inspection vs. general autonomy; hardware component limits software multiple applicability
      - - Figure AI
        - Series C ($1B+, Sep 2025)
        - $39B
        - Not disclosed publicly; humanoid hardware pre-commercial
        - Undisclosed; extreme optionality premium
        - Largest humanoid robotics valuation; benchmark for max sector exuberance
        - Humanoid hardware focus with automotive OEM (BMW) partnership; structurally different from FieldAI
      - - FieldAI (subject)
        - Series A1 ($314M, Aug 2025)
        - $2.0B
        - '>$100M booked (OCBJ Apr 2026 anonymous); $140M ARR est. (GetLatka); $5M est. (CompWorth)'
        - 14–20x (if $100–140M); ~400x (if $5M)
        - Subject company
        - Revenue unverified; 28x estimate range creates fundamental uncertainty
    notes: >
      All valuations are last disclosed private round marks, not public market prices. Revenue figures for comparables
      are self-reported or third-party estimated; none are audited. "Revenue multiple" is illustrative only. Physical
