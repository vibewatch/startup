      - number: '7.4'
        title: People, Talent, and Execution Risk
        blocks:
          - type: paragraph
            body: >
              FieldAI's founding team carries exceptional domain credibility — Ali Agha's leadership of the DARPA
              SubT-winning CoSTAR team and his prior NASA JPL principal investigator role are the primary basis for
              investor and customer confidence. This creates a concentrated key-person risk: Agha is simultaneously the
              company's public face, its primary technical thought leader, and its most visible commercial relationship
              owner. No named COO, Head of Engineering, or parallel commercial leadership figure with equivalent public
              standing has been publicly identified. David Fan (CTO) and Shayegan Omidshafiei (CSO/President) provide
              some leadership depth, but their public profiles are substantially less prominent than Agha's. An
              involuntary departure, extended incapacitation, or reputational event involving Agha would likely disrupt
              fundraising, enterprise customer confidence, and partnership relationships simultaneously.

              Beyond the founder, FieldAI faces talent risk inherent to rapid scaling in one of the most competitive
              labour markets in technology. Headcount reportedly grew from founding in 2023 to 130+ by August 2025,
              implying annualised growth that makes culture-maintenance, engineering coordination, and product execution
              discipline difficult to sustain. The company competes for robotics-AI engineers with Google Intrinsic (now
              integrated into Google AI), Physical Intelligence (raised $700M+), Amazon Robotics, and Tesla Optimus —
              all of whom are hiring from the same narrow pool of PhDs and senior engineers who can work on embodied AI
              at scale. No evidence of post-funding key technical departures has been identified, but the absence of
              public evidence is not confirmation of stability.

              Execution risk also manifests in the commercial dimension. FieldAI was in stealth until August 2025; less
              than one year of demonstrable enterprise sales capacity has elapsed. The company has not published
              customer names, deployment case studies with verified outcomes, or retention metrics. The transition from
              a research-lineage team (NASA JPL, DARPA) to a revenue-accountable enterprise software vendor is a
              well-documented organisational inflection point that many deep-tech spinouts fail to navigate quickly
              enough to justify their valuation trajectory.
