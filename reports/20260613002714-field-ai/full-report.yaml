              - CV036
          - type: callout
            title: 'Key Risk: Revenue Opacity Creates 400x Multiple Risk in Bear Case'
            body: >
              The single largest valuation risk for FieldAI is not technology, team, or market—it is information
              asymmetry. If revenue is truly $5M (as one secondary estimate suggests) rather than $140M ARR (GetLatka),
              the implied revenue multiple at $2B is approximately 400x, comparable only to the most speculative
              early-stage AI investments. Down-round probability rises sharply if revenue fails to match the $100M+
              implied by current investor confidence.
            calloutType: risk
            claimRefs:
              - CV013
              - CV016
              - CV028
              - CV029
          - type: callout
            title: $2B Is Actually Conservative Within Embodied-AI Peer Valuations
            body: >
              Compared to its two closest embodied-AI software peers, FieldAI's $2B valuation appears conservative:
              Physical Intelligence was valued at $5.6B in November 2025 with zero disclosed revenue, and Skild AI
              reached $14B in January 2026 on $30M ARR. If FieldAI's revenue figures are accurate and it continues to
              grow, the next funding round could be well above $2B. This does not change the TRACK
