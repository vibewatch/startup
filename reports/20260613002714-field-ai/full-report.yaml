      - number: '3.3'
        title: Pricing and Packaging Comparison
        blocks:
          - type: paragraph
            body: >
              Pricing transparency across the competitive field is low; most platforms sell into enterprise procurement
              without public list pricing. FieldAI's subscriptions reportedly range from tens of thousands to $500,000
              per year per deployment, with the company citing $100 million or more in booked revenue and $140 million
              in ARR for 2025 per a third-party estimate. Intrinsic does not publish Flowstate pricing; Google's
              cloud-first model suggests enterprise SaaS tiers layered on top of Google Cloud compute fees, with the
              Fanuc partnership implying volume licensing. Physical Intelligence has no commercial product or pricing.
              Gecko Robotics bundles inspection services, Cantilever platform access, and engineering consulting into
              multi-year contracts; the Navy IDIQ illustrates a $71 million five-year envelope for 18 vessels. Boston
              Dynamics Orbit is sold as a software layer on top of hardware; annual fees have not been disclosed but are
              referenced by Michelin and other enterprise case studies as ongoing operational software. Viam offers a
              developer-friendly free tier and enterprise pricing upon request; the open-source model drives developer
              adoption before upselling managed infrastructure. Machina Labs prices on manufacturing-service contracts
              rather than software subscriptions. Status-quo manual inspection costs are estimated by industry at
              $13–$20 billion per year for the U.S. Navy alone, and FieldAI-enabled systems reduce documentation time by
              more than 90 percent on construction sites per the Boston Dynamics partnership announcement.
