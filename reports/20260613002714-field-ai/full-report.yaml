  - id: FR001
    title: Risk Heatmap — Likelihood vs. Impact
    type: matrix
    layout: wide
    summary: >
      Ordinal risk positioning for FieldAI's top risks across four impact levels (Critical, High, Medium, Low) and three
      likelihood levels (Low, Medium, High) as of May 2026. Positions are analyst-assessed from public evidence.
    data:
      columns:
        - Low Likelihood
        - Medium Likelihood
        - High Likelihood
      rows:
        - label: Critical Impact
          values:
            - ITAR violation (FieldAI Federal); IP imitation via personnel departure
            - EU AI Act enforcement action; Boston Dynamics partnership termination
            - Material safety incident (physical harm); Ali Agha departure during critical growth phase
        - label: High Impact
          values:
            - NVIDIA supply cutoff (investor relationship mitigates); Customer data breach
            - Valuation reset / down round; Enterprise sales conversion plateau; CTO/CSO departure
            - Commercialisation delay extending beyond 2027; GPU supply cost inflation
        - label: Medium Impact
          values:
            - US state AI Act compliance penalty (Colorado, California)
            - Certis Group platform incompatibility; Post-funding engineering attrition
            - Robot OEM SDK incompatibility; Customer deployment failure at pilot site
        - label: Low Impact
          values:
            - Minor OT cybersecurity near-miss (contained); HR dispute
            - Construction site robot navigation error (no injury); Third-party IP dispute
            - Press criticism of AI overvaluation narrative
    approximationNotes: >-
      Likelihood and impact are ordinal analyst assessments based on public evidence and industry analogs; not derived
      from quantitative fault-tree or Monte Carlo models.
