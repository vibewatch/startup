  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Monetization Strategy
        blocks:
          - type: paragraph
            body: >
              FieldAI's revenue model is B2B enterprise, centered on two primary streams: (1) upfront hardware
              integration fees collected when a customer first deploys FieldAI's sensor-compute payload and firmware
              onto existing third-party robots; and (2) recurring software licensing fees for continued access to Field
              Foundation Models (FFMs), fleet management, and analytics services. The company does not manufacture
              robots and explicitly avoids hardware OEM positioning, keeping the model closer to an enterprise software
              subscription than a robotics hardware vendor. All on-device inference runs at the edge with latency under
              100ms; fleet data is uploaded to FieldAI's cloud platform for analytics and federated model improvement.


              List pricing is not publicly disclosed. Third-party sources characterize the subscription range as "tens
              of thousands to $500,000 per year" depending on deployment scale, with CEO Ali Agha citing "multi-million
              dollar contracts" in the US, Europe, and Asia as evidence of large-enterprise deal sizes. Construction
              Dive and Sacra confirm the B2B hardware integration plus software licensing structure. There is no
              evidence of a consumer-facing revenue stream, marketplace model, or hardware OEM revenue. A
              defense-oriented subsidiary, FieldAI Federal, is operational and could eventually generate government
              contract revenue, though no contract awards have been publicly disclosed.


              The only public revenue signal is an April 2026 Orange County Business Journal report citing anonymous
              "sources familiar with the matter" indicating the company has more than $100M in booked revenue.
              GetLatka's analyst platform estimates $140M ARR as of November 2025. Neither figure is audited,
              company-confirmed, or broken down by stream. These data points are treated as directional signals rather
              than confirmed financial metrics.
