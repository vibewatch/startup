      - Monitorable Trigger
      - Threshold / Event
      - Action Implication
    rows:
      - - Safety incident (AI-caused physical harm)
        - Public incident reports, OSHA filings, news coverage, customer disclosures
        - >-
          First confirmed robot-caused injury or property damage event attributed to FFM failure at any FieldAI
          deployment
        - >-
          Pause new deployment expansion; conduct root-cause analysis; obtain independent safety audit before resuming;
          monitor customer withdrawal announcements
      - - EU AI Act enforcement action
        - >-
          EU market authority announcements, FieldAI press releases, news coverage, customer procurement freezes citing
          compliance
        - >-
          Formal EU market authority investigation, non-conformity finding, or customer procurement freeze citing AI Act
          compliance
        - >-
          Immediate diligence on EU compliance programme; assess market access risk; consider EU deployment pause
          pending certification
      - - Boston Dynamics partnership termination or Hyundai strategic pivot
        - Public partnership announcements, Hyundai Motor Group strategy disclosures, FieldAI OEM partner updates
        - >-
          Public statement by either party terminating partnership, or Hyundai announcement of proprietary autonomy
          stack for Boston Dynamics hardware
        - >-
          Re-assess construction-vertical commercial case without Spot integration; evaluate OEM diversification
          timeline; recalibrate revenue projections
      - - Ali Agha departure or reputational event
        - LinkedIn, press coverage, company announcements, investor communications
        - Confirmed departure from CEO/founder role, extended medical leave, or public reputational controversy
        - >-
          Emergency assessment of management succession plan; investor communication; consider representation and
          warranty insurance triggers
      - - Fundraising valuation reset or down round
        - >-
          Future financing announcements, secondary market data (Nasdaq Private Market, PremierAlts), investor
          communications
        - >-
          Any announced financing round at valuation materially below $2B, or secondary market price indicating 30%+
          discount to last-round price
        - >-
          Re-assess terminal valuation upside; review preference stack and liquidation preferences; evaluate dilution
          exposure relative to original entry thesis
      - - Commercialisation plateau (revenue growth below threshold)
        - OCBJ/Sacra/GetLatka revenue reports, customer count disclosures, hiring slowdown signals
        - >-
          Public or reliable third-party indication of ARR growth falling below 80% YoY or booked revenue stagnating
          below $150M through 2027
        - >-
          Deep-dive on sales productivity metrics, customer retention, and pipeline quality before next capital
          deployment decision
    notes: >-
      Thresholds are analyst-defined trigger points for heightened diligence, not contractual or legally binding
      criteria. Monitoring relies primarily on public information given FieldAI's private-company disclosure posture.
  - id: TV001
    title: Recommendation Summary
    columns:
      - Dimension
      - Assessment
      - Basis
      - Decision Implication
    rows:
      - - Recommendation
        - TRACK
        - Strong thesis offset by valuation opacity and unverified revenue
        - Monitor for commercial proof points; do not commit at current price without audited financials
      - - Confidence
        - Medium
        - Investor syndicate is elite; revenue range is 28x wide; governance undisclosed
        - Confidence would rise to high with 2+ years audited ARR data and disclosed NRR
      - - Risk rating
        - High
        - Revenue unverified; down-round risk if sector multiples compress or revenue disappoints
        - Hedge exposure; size position conservatively relative to portfolio
      - - Valuation stance
        - Stretched
        - $2B at $100–140M ARR = 14–20x; at $5M ARR = ~400x; AI-native median is 21x on verified ARR
        - Entry price requires high-end revenue execution; little margin of safety externally
      - - Upgrade trigger
        - Audited ARR ≥$100M + GM ≥60% + NRR ≥110%
        - These three data points would justify BUY at or near current $2B valuation
        - Request data room access before any commitment
    notes: >
      Recommendation reflects external-investor posture without access to private diligence. Strategic investors and
      lead VCs (Bezos Expeditions, Khosla, NVentures) have conducted proprietary due diligence not available publicly;
      their conviction is a positive signal that supplements but does not replace this assessment.
    claimRefs:
      - CV001
      - CV014
      - CV015
      - CV036
  - id: TV002
    title: Thesis and Anti-Thesis
    columns:
      - Argument
      - Evidence Base
      - What Would Change the View
    rows:
      - - 'Thesis: Hardware-agnostic AI software captures monopoly-like share as robot hardware commoditizes'
        - >-
          FFMs deployed across quad/humanoid/wheeled/tracked; hardware-agnostic architecture confirmed by TechCrunch and
          official sources
        - >-
          OEM vertical integration (Boston Dynamics, Figure) captures brain layer; or hyperscaler (Google Intrinsic,
          NVIDIA Cosmos) commoditizes foundation model
      - - 'Thesis: Founding team has highest field robotics credibility in the sector'
        - >-
          DARPA SubT win, NASA JPL, MIT/DeepMind credentials documented; Marc Raibert/Vinod Khosla endorsements on
          record
        - Key-person risk if CEO departs; CSO or CTO attraction by better-funded competitor
      - - 'Thesis: $405M from elite investors reflects private diligence superior to public data'
        - >-
          Oversubscribed; Bezos Expeditions, Temasek, Khosla, NVentures all participated; investor statements confirm
          commercial conviction
        - >-
          Down-round at Series B would contradict private diligence thesis; if investors write down the position, the
          signal reverses
      - - 'Thesis: >$100M booked revenue in 9 months post-announcement is unusually fast commercial traction'
        - OCBJ April 2026 anonymous sources; GetLatka $140M ARR estimate; CEO stated multi-million-dollar contracts
        - Booked revenue conflated with pipeline; ARR is materially lower; churn reveals customer dissatisfaction
      - - 'Anti-thesis: Revenue is unverified and the range of estimates is 28x wide'
        - Estimates span $5M (CompWorth) to $140M ARR (GetLatka); no audited figure; anonymous OCBJ sourcing
        - Company releases audited ARR; figure above $80M would largely close this gap
      - - 'Anti-thesis: Governance opacity is extreme for a $2B company'
        - No board composition disclosed; no Form D from Field Ai, Inc.; no audited financials; no cap table details
        - Formal data room access under NDA would satisfy; pre-IPO financial reporting would close the gap
      - - 'Anti-thesis: Multiple compression in AI software is a structural 2026–2027 risk'
        - >-
          Howard Morgan (First Round Capital) warns AI valuations overheated; Madrona partner notes seed/Series A priced
          well ahead of fundamentals
        - >-
          Sector-wide re-rating upward on proven revenue would negate this; or FieldAI's own Series B step-up would
          confirm
      - - >-
          Anti-thesis: Competitors (Physical Intelligence, Skild AI) are raising at higher valuations with comparable or
          weaker revenue
        - >-
          PI at $11B talks with zero revenue; Skild at $14B on $30M ARR; sector optionality premium inflates all
          valuations
        - If sector multiples compress and PI or Skild raise flat/down, FieldAI's $2B could look expensive
    notes: >
      Thesis rows represent the bull/confirming interpretation; anti-thesis rows represent the bear/challenging
      interpretation. Both sets are evidence-supported as of May 2026 runDate.
