        title: Exhibits
        blocks:
          - type: callout
            title: 'TRACK: Monitor for Commercial Proof Points Before Committing'
            body: >
              FieldAI's investment case is structurally among the best in embodied AI: elite team, elite investors,
              genuinely differentiated technology, and faster commercial traction than any comparable. The
              recommendation is nonetheless TRACK because the $2B valuation cannot be underwritten from public data:
              revenue is unverified across a 28x range, governance is opaque, and the investor-private-diligence
              advantage enjoyed by lead VCs is not available to external buyers. At the right price and with a verified
              data room, this company would merit strong consideration for BUY.
            calloutType: recommendation
            claimRefs:
              - CV014
              - CV015
