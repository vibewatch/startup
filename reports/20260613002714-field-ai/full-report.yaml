      - number: '4.3'
        title: Unit Economics and Cost Structure
        blocks:
          - type: paragraph
            body: >
              FieldAI's unit economics are largely undisclosed. No audited financials have been published, and the
              company has not released gross margin, customer acquisition cost (CAC), net revenue retention (NRR),
              annual contract value (ACV), or payback period data. The following analysis is based on comparable B2B
              industrial AI software companies and the observable structure of FieldAI's revenue model.


              Gross margin is estimated to be in the 55–80% range on the software licensing component, based on typical
              enterprise AI software benchmarks. The hardware integration service component—which involves physical
              sensor-compute payload deployment and field support— likely carries a lower margin (20–45%), pulling
              blended gross margin below pure-software comparables. At scale, the software licensing stream should
              dominate and improve blended margins. The on-edge architecture (no cloud inference dependency) reduces
              ongoing variable costs per deployment compared to cloud-heavy AI platforms, which is a favorable
              structural feature.


              Sales efficiency for enterprise industrial robotics is structurally challenged: sales cycles are typically
              12–24 months, require field demonstration and integration testing, and involve multi-stakeholder
              procurement. CEO Agha cited multi-million-dollar contract values, suggesting deal sizes that could support
              CAC payback in 1–3 years at moderate churn rates—but this cannot be verified without disclosed CAC and NRR
              data. Revenue per employee is approximately $900K–$1M if the $140M ARR estimate and 150-employee figure
              are correct, which is strong for an enterprise software company of this stage. FieldAI's GTM motion
              focuses on direct enterprise sales, hardware-partner relationships (Boston Dynamics, OEMs), and geographic
              expansion partnerships (Certis Group, Asia), which reduces the addressable market ceiling through a pure
              direct-sales channel.
