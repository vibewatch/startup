  - id: FE001
    title: FieldAI Product Architecture Stack
    type: stack
    layout: standard
    summary: Layered model architecture of the FFM platform from sensor inputs to application output.
    data:
      layers:
        - label: Application Layer
          detail: >
            Eight solution modules: site mapping, facility inspection, anomaly detection, data capture, material
            transport, security/threat detection, telepresence, and search/ISR. Deployed via in-house or partner payload
            model.
        - label: Multiagent Foundation Model (MFM)
          detail: >
            Fleet coordination layer. Enables multiple robots to share environmental representations and reason
            collectively at site scale. Designed for high-risk, unstructured multi-robot deployments.
        - label: Field Foundation Model (FFM) Core — Perception & World Model
          detail: >
            Physics-first belief-space model. Processes multimodal inputs (vision, LiDAR, text, audio, thermal, event
            cameras). Maintains probabilistic uncertainty estimates. Context over Training — infers behavior in novel
            scenarios without exhaustive pre-training. No maps, GPS, or cloud required.
        - label: Dynamics Foundation Model (DFM)
          detail: >
            Robot-specific dynamic model integration layer. Decouples world model from robot body, enabling the same
            cognitive brain to control mechanically distinct platforms (quadruped, wheeled, humanoid, passenger-scale).
        - label: Edge Compute Runtime
          detail: >
            On-device inference only. Full autonomy without cloud connectivity. Runs on industrial edge hardware
            (specific SoC/GPU not publicly disclosed; NVIDIA Jetson-class inferred from NVIDIA partnership context).
        - label: Simulation & Training Infrastructure (NVIDIA-integrated)
          detail: >
            Real sensor data to NuRec 3D digital twins to Isaac Sim/Isaac Lab to NVIDIA Physical AI Data Factory
            Blueprint (via Azure) using Cosmos + OSMO synthetic data pipeline. Closes sim-to-real gap and supports
            continuous model improvement from operational data flywheel.
    approximationNotes: >
      Layer boundaries and names inferred from official product page, NVIDIA collaboration press releases, and FAIRI
      publications. DFM and MFM are described officially; internal model weights and inference hardware are not
      disclosed.
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE005
      - CE016
      - CE030
  - id: FE002
    title: Customer Deployment Workflow
    type: flow
    layout: wide
    summary: How the FFM platform is activated at a customer site and delivers continuous operational value.
    data:
      nodes:
        - id: n1
          label: Robot Hardware Procurement
          body: Customer procures or owns compatible robot platform (e.g., Boston Dynamics Spot, Unitree, others).
        - id: n2
          label: FFM Software Installation
          body: >-
            FieldAI installs Field Foundation Models on-robot. No pre-mapping, GPS setup, or cloud wiring required. Site
            activation is rapid.
        - id: n3
          label: Initial Site Activation
          body: >-
            Robot activates and begins exploration of unknown environment. FFM builds context from first-run sensor data
            without any prior map.
        - id: n4
          label: Autonomous Mission Execution
          body: >-
            Robot executes configured missions (inspection, mapping, patrol, transport) fully on-edge. MFM coordinates
            multiple robots if fleet-deployed.
        - id: n5
          label: Real-Time Data Capture
          body: >
            Robot logs vision, LiDAR, and sensor streams as byproduct of normal operation. Data feeds FieldAI's
            operational flywheel.
        - id: n6
          label: NuRec Digital Twin Generation
          body: >
            Sensor data transforms into high-fidelity 3D digital twin via NVIDIA NuRec. Customer receives continuously
            updated site reconstruction for planning, asset management, and safety oversight.
        - id: n7
          label: Isaac Sim Validation & Model Improvement
          body: >
            Reconstructed environments loaded into Isaac Sim/Isaac Lab for robot policy validation and retraining.
            Models improve per deployment; data flywheel compounds value over time.
        - id: n8
          label: Customer Value Delivery
          body: >
            Inspection reports, anomaly alerts, progress documentation, security patrol logs, and digital twin artifacts
            delivered to customer workflow systems (e.g., BIM, Mozart, ERP).
      edges:
        - from: n1
          to: n2
