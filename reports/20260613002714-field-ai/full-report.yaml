      - number: '5.4'
        title: Trust, Safety, and Compliance
        blocks:
          - type: paragraph
            body: >
              FieldAI's safety architecture is based on probabilistic risk management rather than explicit rules: the
              FFM operates in belief space, maintaining confidence estimates about the environment and taking
              conservative actions when uncertainty exceeds a customer-configured threshold. CEO Agha has described this
              as the robot knowing "how confident it is" and slowing or rerouting to avoid unsafe actions. This design
              addresses the hallucination risk of conventional LLMs applied to robotics, as FieldAI's models were
              designed from the ground up for physical safety rather than retrofitting language or vision models.

              However, no publicly documented safety certifications, regulatory approvals, or compliance standards
              (e.g., ISO 10218, IEC 62443, ANSI/RIA, FedRAMP, or equivalents for industrial robotics) have been
              disclosed as of May 2026. The Certis partnership agreement mentions that both companies will "work
              together on training, safety validation and operational frameworks to support responsible deployment,"
              implying that formal safety validation frameworks are still in development rather than completed.
              Similarly, the Boston Dynamics partnership focuses on practical deployment outcomes rather than
              certifications. FieldAI's role in defense/federal contexts through FieldAI Federal implies some level of
              government security review, but no specific clearances or FedRAMP status have been published. The private
              release notes page prevents external parties from auditing shipped versus roadmap capabilities, and no
              formal bug bounty or security disclosure policy has been identified.
