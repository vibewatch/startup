      - number: '7.3'
        title: Partner and Technology Dependency Risk
        blocks:
          - type: paragraph
            body: >
              FieldAI's go-to-market strategy and technology stack are concentrated across a small number of high-value
              partners and suppliers. The March 2026 Boston Dynamics partnership is the most visible commercial
              dependency: the company's construction-focused autonomy story is built around Spot quadruped hardware, and
              Marc Raibert's public endorsement citing the DARPA SubT history ties both brand and market credibility to
              the relationship. Boston Dynamics is owned by Hyundai Motor Group, which separately invested in FieldAI in
              February 2026 — creating a potential misalignment if Hyundai decides to invest in competing proprietary
              autonomy software for Boston Dynamics hardware, or if the partnership is restructured as part of a
              Hyundai-level strategic realignment. The terms of the partnership (exclusivity provisions, revenue
              sharing, minimum commitment, termination rights) are not publicly disclosed, making it impossible to
              assess contractual protection.

              NVIDIA is a deeper, more pervasive dependency. NVentures (NVIDIA's corporate venture arm) is a financial
              investor, and FieldAI uses NVIDIA Omniverse NuRec for 3D reconstruction, Isaac Sim / Isaac Lab for
              simulation training, NVIDIA Cosmos for synthetic data generation, and OSMO for pipeline automation. This
              creates a multi-layer strategic and commercial lock-in. While the investor relationship reduces the
              probability of abrupt supply disruption, NVIDIA's own priorities (hyperscaler allocations, data center GPU
              supply bottlenecks, competitive dynamics) could compress FieldAI's compute access or raise training costs.
              VerticalData reports that high-bandwidth memory (HBM) bottlenecks persist in 2026, with data-centre GPU
              lead times extending 9–12 months for the latest models; smaller AI firms without multi-year cloud
              commitments are most exposed.

              Beyond NVIDIA and Boston Dynamics, the Certis Group security partnership (February 2026) adds a third
              integration dependency. Certis uses its Mozart platform for fleet command-and-control, and FieldAI's FFMs
              must inter-operate with this proprietary infrastructure. Partner diversification is an explicit part of
              FieldAI's hardware-agnostic narrative — the company claims FFM compatibility with quadrupeds, humanoids,
              wheeled robots, and AVs — but named commercial partnership depth (Boston Dynamics for construction, Certis
              for security) concentrates revenue and reputational exposure in two partners as of May 2026.
