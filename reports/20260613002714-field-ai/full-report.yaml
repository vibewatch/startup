      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              FieldAI was founded by Ali Agha, who serves as CEO, drawing on nearly two decades of robotics AI
              expertise. Before founding FieldAI, Agha spent approximately seven years at NASA's Jet Propulsion
              Laboratory (JPL) as Principal Investigator for some of the nation's highest-profile autonomy programs,
              including the DARPA Subterranean Challenge, DARPA RACER (self-driving off-road vehicles), NASA's
              Autonomous Mars Cave Exploration, and Coordinated Autonomy for Prototype Mars Helicopter-Rover. He also
              worked as a researcher at Qualcomm and held a postdoctoral position at MIT. Critically, Agha led the
              JPL-MIT-Caltech-KAIST-LTU CoSTAR team that won the Urban Circuit of the 2020 DARPA Subterranean
              Challenge—a landmark achievement in field robotics that validated the risk-aware autonomy approach now
              central to FieldAI's technology. Agha earned his PhD in Computer Science and Engineering from Texas A&M
              University. His co-founders include Dr. Shayegan Omidshafiei (Chief Science Officer), who spent over five
              years as a Research Scientist at DeepMind/Google focused on large-scale AI models and multi-agent
              reinforcement learning, and who completed his PhD at MIT where he first collaborated with Agha; and Dr.
              David Fan (Chief Technology Officer), who was chief technologist for multiple DARPA SubT and DARPA RACER
              programs and a NASA JPL research fellow. Additional senior leaders include Dr. Eric Krotkov, who heads
              FieldAI Federal, the company's defense subsidiary, and is a former DARPA Program Manager and CSO of Toyota
              Research Institute; and Sebastian Scherer, Director of Fieldable Embodied AI, an Associate Research
              Professor at Carnegie Mellon's Robotics Institute. The founding team's shared JPL, DARPA, and MIT lineage
              gives FieldAI exceptional founder-market fit for deploying AI in safety-critical field environments. Board
              composition and formal governance structure have not been publicly disclosed. CEO Ali Agha is the
              company's primary public spokesperson and fundraiser, constituting a meaningful key-person dependency.
