  - id: FR002
    title: Risk Transmission Map
    type: dag
    layout: wide
    summary: >
      How primary risk events cascade into revenue, customers, margin, financing, and valuation outcomes for FieldAI.
      Arrows show propagation paths.
    data:
      nodes:
        - id: r1
          label: Safety Incident (physical harm from FFM failure)
          body: First-order risk event; triggers regulatory, commercial, and reputational cascades simultaneously.
        - id: r2
          label: EU AI Act Enforcement / Market Block
          body: Regulatory action blocking EU product sales or requiring expensive compliance retrofit.
        - id: r3
          label: Boston Dynamics Partnership Loss
          body: Commercial partnership termination or Hyundai strategic pivot removing primary reference case.
        - id: r4
          label: Ali Agha Departure
          body: Key-person event removing primary technical credibility, commercial relationships, and public narrative.
        - id: r5
          label: Valuation Reset / Down Round
          body: >-
            Financing event at sub-$2B valuation signals market repricing; triggers preference stack, dilution, and
            morale effects.
        - id: r6
          label: Customer Loss / Churn
          body: Customers withdraw or defer expansion following safety, regulatory, or partner disruption events.
        - id: r7
          label: Revenue Growth Deceleration
          body: Pipeline stalls due to procurement freeze, reference customer loss, or competitive substitution.
        - id: r8
          label: Margin Compression
          body: Higher cost-of-delivery from compliance, integration rework, or hardware dependency repricing.
        - id: r9
          label: Fundraising Impairment
          body: Inability to raise at sufficient valuation; forces dilutive financing or operational cuts.
        - id: r10
          label: Talent Attrition Spiral
          body: Below-threshold equity value, uncertain trajectory, and competitor offers drive senior departures.
      edges:
        - from: r1
          to: r6
          label: Customer withdrawal
        - from: r1
          to: r2
          label: Regulatory scrutiny escalates
        - from: r2
          to: r7
          label: EU market access blocked
        - from: r3
          to: r6
          label: Reference case lost
        - from: r3
          to: r7
          label: Sales pipeline disruption
        - from: r4
          to: r9
          label: Investor confidence disruption
        - from: r4
          to: r6
          label: Commercial relationships impaired
        - from: r6
          to: r7
          label: Churn reduces ARR
        - from: r7
          to: r9
          label: Growth slowdown impairs fundraising
        - from: r8
          to: r9
          label: Margin compression reduces attractiveness
        - from: r9
          to: r5
          label: Forced down round
        - from: r5
          to: r10
          label: Equity value collapse triggers attrition
        - from: r10
          to: r7
          label: Team degradation slows product/sales
