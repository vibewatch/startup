  - id: FV004
    title: Investment KPIs — Scoring Summary
    type: kpi
    layout: standard
    summary: |
      IC-ready scoring of FieldAI across seven investment dimensions; scores are 0–10 where 10 is best-in-class.
    data:
      items:
        - label: Market Opportunity
          value: 8
          unit: /10
          detail: >-
            Large TAM across construction, energy, mining, logistics, defense; underpenetrated; macro tailwinds from
            labor shortage
        - label: Technology Moat
          value: 8
          unit: /10
          detail: >-
            Physics-first FFMs; hardware-agnostic; field-proven; 3+ years of proprietary deployment data; federated
            learning flywheel
        - label: Team / Founder-Market Fit
          value: 9
          unit: /10
          detail: Best-in-class; DARPA SubT win; NASA JPL; DeepMind; no comparable team depth in field robotics AI
        - label: Commercial Proof
          value: 5
          unit: /10
          detail: >-
            Hundreds of sites, 3 continents claimed; >$100M booked (anonymous, unaudited); no customer names or verified
            ARR
        - label: Financial Transparency
          value: 2
          unit: /10
          detail: No audited financials; no Form D from operating entity; revenue range 28x wide; governance undisclosed
        - label: Valuation vs. Fundamentals
          value: 4
          unit: /10
          detail: $2B at 14–20x if $100–140M ARR (plausible); at $5M = 400x (unreasonable); uncertainty is the core risk
        - label: Exit Readiness
          value: 5
          unit: /10
          detail: >-
            No IPO timeline; no M&A signals; 2+ years to Series B likely; strategic acquirer universe is large (NVIDIA,
            Amazon, Honeywell, Emerson)
    approximationNotes: >
      Scores are qualitative assessments by the analyst based on publicly available evidence as of May 2026. Financial
      Transparency score of 2/10 reflects the unusually high opacity for a $2B company; this score would rise materially
      with a data room disclosure. Composite score (unweighted average) is approximately 5.9/10, supporting TRACK rather
      than BUY.
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV014
      - CV015
      - CV033
