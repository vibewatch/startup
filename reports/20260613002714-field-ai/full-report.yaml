      - number: '5.3'
        title: Deployment Workflow and Use Cases
        blocks:
          - type: paragraph
            body: >
              FieldAI's deployment model is B2B software: robots owned or leased by the customer receive the FFM brain
              as a software installation, with FieldAI providing integration services and ongoing model updates. No
              dedicated hardware needs to be purchased from FieldAI. Deployment time is a key differentiator claim:
              because robots do not require pre-mapped environments or GPS infrastructure, site activation is described
              as rapid, with the company and its investors describing processes that "once took months now take hours."
              One unnamed global industrial manufacturing executive cited a specific 3.5-month-to-12-hours outcome (over
              200x improvement) when using FieldAI's technology plus NVIDIA NuRec digital twin generation — though this
              claim is unverified by an independent third party.

              Construction is the leading commercial vertical. Big-D Construction has been a FieldAI customer for over
              two years and in April 2026 announced expansion across multiple projects, with one project catch
              reportedly saving $1.2 million through early defect detection. In the security vertical, Certis Group
              (Singapore) deploys FFMs integrated with its proprietary Mozart orchestration platform across public
              infrastructure, transport hubs, and industrial facilities. FieldAI's Boston Dynamics partnership,
              formalized March 12, 2026, targets construction inspection; Spot robots equipped with FFMs perform 3D
              scanning, hazard identification, and overnight monitoring autonomously. The company also has federal and
              defense use cases handled via FieldAI Federal, led by Dr. Eric Krotkov, a former DARPA Program Manager.

              Geographically, FieldAI has documented deployments in the US, Japan, Europe, and across Asia-Pacific
              through Certis. Customers are generally not named publicly (TechCrunch confirmed the company declined to
              disclose customer names at August 2025 funding announcement), with Big-D Construction as the only
              construction-sector customer publicly identified by name as of May 2026.
