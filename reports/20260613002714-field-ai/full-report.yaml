      - number: '4.2'
        title: Capital Adequacy and Forward Runway
        blocks:
          - type: paragraph
            body: >
              FieldAI's two-round funding history is detailed in the Company Overview chapter. For capital adequacy
              purposes, the key inputs are: $405M total capital raised as of August 2025, with the second round ($314M)
              closing oversubscribed in August 2025, co-led by Bezos Expeditions, Prysm Capital, and Temasek, with
              participation from Khosla Ventures, NVentures (NVIDIA), Intel Capital, Canaan Partners, BHP Ventures, and
              Emerson Collective. The first round (~$91M) closed in 2024 at a $500M valuation; Gates Frontier and
              Samsung are designated prior-round investors.


              Cash on hand is not disclosed. Monthly burn rate is not disclosed. The company's headcount
              trajectory—growing from approximately 30 employees at the end of 2024 to approximately 130 at the August
              2025 announcement, with explicit plans to double to approximately 260 by end of 2025—implies a rapid ramp
              in the fixed-cost base. At 200–260 employees at an average fully-loaded cost of $250K–$350K per employee
              (consistent with Irvine, CA and distributed engineering teams), annualized compensation expense alone is
              $50–90M/year, implying a monthly run-rate labor cost of approximately $4–8M. Adding global deployment
              expenses, cloud infrastructure, hardware payload costs, and G&A, total monthly burn is estimated at
              $5–10M. At the lower bound, $405M total raised at $5M/month burn implies approximately 81 months of gross
              runway from inception; at $10M/month, approximately 40 months. Netting against an assumed $100M+ in
              cumulative revenue offset, net runway from the August 2025 close is estimated at 24–48 months, placing the
              next-round trigger in late 2027 to early 2029 absent revenue acceleration or unexpected cost escalation.


              FieldAI has not announced any debt facilities, project finance obligations, revenue-based financing, or
              lines of credit. The company's capital structure appears to be pure equity. The absence of hardware
              manufacturing (unlike vertically integrated robotics companies) materially reduces working capital and
              inventory financing needs compared to peers.
