      - number: '5.5'
        title: Roadmap, Maturity, and Developer Ecosystem
        blocks:
          - type: paragraph
            body: >
              FieldAI's product maturity is strongest in inspection and data collection, where the company has paying
              customers and documented production deployments across hundreds of sites. The three-phase roadmap,
              articulated in analyst coverage and investor materials, is: (1) near-term through 2026 — autonomous
              inspection, monitoring, and data collection, already commercialized; (2) mid-term 2026–2028 — intervention
              and manipulation, expanding beyond sensing to physical actions; (3) long-term 2028+ — general-purpose
              autonomy across all platforms including humanoids. This roadmap aligns with FieldAI's stated use of $405M
              raised to fund development across locomotion and manipulation capabilities.

              The CMU Robotics Innovation Center tenancy (announced February 2026, 2,500 sq ft at Hazelwood Green)
              formalizes the company's academic research partnerships, giving access to 1.5-acre outdoor testing grounds
              and specialized robotics labs. FieldAI sponsors research at CMU's AirLab and LeCAR lab, and supports the
              VectorRobotics student team on humanoid loco-manipulation, indicating active investment in the capability
              gaps on the mid-to-long-term roadmap. The Field AI Research Institute (FAIRI) publishes peer-reviewed
              research, with the NeBula DARPA SubT paper and 2024 publications on risk-aware AI and MPPI control
              providing academic credibility.

              Developer ecosystem access is limited. FieldAI's GitHub organization (field-ai) hosts 10+ forks of
              standard robotics libraries but publishes no proprietary FFM code, model weights, or SDK. No public
              developer portal, API documentation, or community forum (Discord, Slack, Stack Overflow tag) has been
              identified. The release notes page is a private Squarespace site. This limits the developer-signal surface
              to the observed GitHub repository activity rather than a genuine practitioner community. The partnership
              with NVIDIA and CMU provides an indirect proxy for engineering credibility, but independent technical
