  - id: FV001
    title: Recommendation Logic Chain
    type: flow
    layout: wide
    summary: >
      Decision logic from evidence quality through valuation assessment to final TRACK recommendation, showing where
      upgraded evidence would change the call.
    data:
      nodes:
        - id: team
          label: Founding Team Signal
          detail: Ali Agha (DARPA SubT/JPL), Omidshafiei (DeepMind), Fan (DARPA RACER) → Strong positive
        - id: investors
          label: Investor Quality Signal
          detail: Bezos Expeditions, Khosla, NVentures, Temasek, Intel Capital → Oversubscribed → Strong positive
        - id: technology
          label: Technology Differentiation
          detail: Physics-first FFMs; hardware-agnostic; edge inference <100ms; federated learning → Medium-strong positive
        - id: revenue
          label: Revenue Evidence Quality
          detail: 'Unverified: $5M–$140M range; anonymous OCBJ sourcing; no audited financials → Material gap'
        - id: valuation
          label: Valuation Assessment
          detail: $2B at unverified $100–140M ARR = 14–20x; at $5M = ~400x; stretched but within comp range if revenue is real
        - id: governance
          label: Governance Opacity
          detail: No board disclosure; no Form D from operating entity; no cap table details → Significant risk
        - id: recommendation
          label: 'Recommendation: TRACK'
          detail: >-
            Strong thesis + elite investors offset by unverified revenue and valuation stretch → TRACK until proof
            points emerge
        - id: upgrade_path
          label: Upgrade Path to BUY
          detail: Audited ARR ≥$100M + GM ≥60% + NRR ≥110% → upgrade to BUY at or near $2B
      edges:
        - from: team
          to: recommendation
          label: +
        - from: investors
          to: recommendation
          label: +
        - from: technology
          to: recommendation
          label: +
        - from: revenue
          to: recommendation
          label: Gap → caution
        - from: valuation
          to: recommendation
          label: Stretched → TRACK
        - from: governance
          to: recommendation
          label: Opacity → TRACK
        - from: recommendation
          to: upgrade_path
          label: Conditions for upgrade
    approximationNotes: >
      Logic flow is qualitative; node weights are assessments based on available public evidence, not quantitative
      scoring. Investor quality signal is the strongest positive; revenue evidence gap is the primary constraint on
      upgrading to BUY.
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV015
      - CV036
