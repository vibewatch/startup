      - number: '4.5'
        title: Financial Verdict
        blocks:
          - type: paragraph
            body: >
              FieldAI's financial picture is that of a well-capitalized, early-revenue software business growing fast
              enough to attract $405M in 24 months but still too opaque for external underwriting. The $2B valuation is
              carried entirely by investor signal, growth trajectory, and team pedigree—not by verified financial
              fundamentals. If the $140M ARR estimate is accurate and growing at 50–100% year-on-year, the valuation is
              in range for a category-creating AI software company; if ARR is materially lower or growth is slower, the
              multiple becomes difficult to justify. Forward capital adequacy appears solid: $405M raised against a
              pure-software operating model (no hardware manufacturing capex, no inventory financing) and a disclosed
              >$100M in bookings implies at least 2–3 years of operating runway before the next fundraise. The largest
              diligence risk is not solvency but information asymmetry—the gap between what is publicly verifiable and
              what is needed to underwrite the valuation is unusually wide for a $2B company.
            claimRefs:
              - CI030
              - CI031
              - CI032
      - number: '4.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Pure-Software Model Limits Capital Intensity
            body: >
              FieldAI's hardware-agnostic, software-only revenue model means it does not carry robot inventory,
              manufacturing capex, or supply-chain working capital risk. Unlike vertically integrated robotics companies
              (Figure AI, Agility Robotics), FieldAI's cost base is dominated by engineering talent and field
              support—both of which scale sub-linearly with revenue as the deployment footprint grows. This structural
              advantage supports the case for high gross margins and capital efficiency relative to the raised amount.
            calloutType: strength
            claimRefs:
              - CI001
              - CI002
              - CI015
          - type: callout
            title: Valuation Carries Significant Financial Opacity Premium
            body: >
              The $2B post-money valuation rests on a $405M capital raise, elite investor signal, and anonymous
              third-party revenue estimates—not on verified financial fundamentals. The absence of audited ARR, gross
              margin disclosure, customer count, or SEC Form D filing makes external underwriting of the valuation
              impossible without non-public diligence access. UpsideList's secondary-market model estimates -2% upside
              at current implied price, reflecting the information discount the private secondary market assigns to
              financial opacity. The wide revenue estimate range ($50M–$140M ARR, a 2.8x spread) and conflicting data
              points from analyst platforms underscore that the valuation is carried almost entirely by forward
              narrative rather than trailing fundamentals.
            calloutType: risk
            claimRefs:
              - CI022
              - CI023
              - CI024
              - CI025
              - CI028
              - CI029
          - type: callout
            title: Core Diligence Asks Before Underwriting
            body: >
              A minimum viable diligence package for underwriting the $2B valuation requires: (1) audited or
              management-certified ARR as of most recent quarter, segmented by licensing and services; (2) gross margin
              by stream; (3) rolling 12-month cash burn and balance sheet; (4) customer count and top-5 revenue
              concentration; (5) cohort-level NRR for 2024 and 2025 cohorts; and (6) ACV quartiles by industry vertical.
              Without these, any investment thesis at the current valuation is an informed bet on team and market rather
              than a financially-grounded underwrite.
