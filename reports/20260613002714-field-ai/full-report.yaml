    title: Growth Drivers and Adoption Constraints Table
    columns:
      - Driver / Constraint
      - Type
      - Direction
      - Timing
      - Implication for FieldAI
      - Diligence Ask
    rows:
      - - Labor shortage across construction, mining, energy
        - Driver
        - Positive
        - Current → multi-decade structural
        - Expands willingness-to-pay and urgency; shortens pilot-to-contract cycle as manual alternatives become scarce
        - Verify per-vertical workforce shortage quantification and link to specific customer budget approvals
      - - Safety regulation (MSHA, OSHA, IEC 61511, OHS frameworks)
        - Driver
        - Positive
        - Current → accelerating
        - Regulatory mandates accelerate autonomy adoption in mining and O&G; HSE budget becomes a deployment trigger
        - Track MSHA enforcement actions and map to FieldAI's target customer MSHA compliance posture
      - - Autonomy maturity (FFMs, VLA models, edge AI)
        - Driver
        - Positive
        - 2026–2028 inflection point
        - FieldAI's physics-first FFM is differentiated today; VLA models from competitors may narrow gap by 2028
        - Benchmark FFM task performance vs. competing foundation models in real unstructured deployments
      - - Hardware commoditization (Boston Dynamics Spot price, humanoid robots)
        - Driver
        - Positive
        - 2026–2030 trend
        - As robot hardware becomes commoditized, software intelligence layer captures increasing margin share
        - Monitor Spot pricing trends and FieldAI's royalty/rev-share model with OEM partners
      - - CAPEX cycles and ROI validation requirements
        - Constraint
        - Negative
        - Persistent
        - Enterprise buying committees require multi-year ROI proof before scaling; slows revenue recognition
        - >-
          How many pilots has FieldAI converted to multi-year enterprise contracts? What is the average sales cycle
          length?
      - - Integration complexity and legacy OT/IT systems
        - Constraint
        - Negative
        - Persistent
        - >-
          Operators use incompatible legacy data formats (BIM, ERP, historian); integration overhead raises deployment
          cost
        - Assess FieldAI's integration depth with leading BIM (Autodesk BIM 360), ERP, and OSIsoft PI systems
      - - 'Pilot purgatory (BuiltWorlds: active robotics use fell 65%→46% despite 95%+ positive evals)'
        - Constraint
        - Negative
        - Near-term (2025–2027)
        - Positive evaluations are not translating to active deployment; churn risk post-pilot is high industry-wide
        - >-
          Request FieldAI pilot-to-enterprise conversion rate and churn data; this is the most critical commercial
          metric
      - - Geopolitical disruption and commodity price volatility
        - Constraint
        - Negative
        - Episodic
        - >-
          Oil price shocks, tariffs on industrial hardware, and geopolitical conflict can pause capex cycles in O&G and
          mining
        - Assess FieldAI's revenue diversification across verticals and geographies to evaluate macro resilience
    notes: >-
