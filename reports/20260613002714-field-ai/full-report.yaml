  - id: TV003
    title: Bull, Base, and Bear Scenarios
    columns:
      - Scenario
      - Key Assumptions
      - Implied Valuation at Exit / Next Round
      - Return Logic from $2B Mark
      - Probability Signal
    rows:
      - - Bull
        - 'ARR: $140M (verified), growing 80–100% YoY; GM: 70–80%; NRR: 120%+; Series B 2027 at 15–20x on $350–500M ARR'
        - $5.25B–$10B at Series B; $15–30B+ at IPO in 2030
        - 2.6–5x from $2B entry; potential 7–15x to IPO
        - 'Low-medium: requires both revenue verification AND sustained growth; AI multiples must hold'
      - - Base
        - >-
          ARR: $100M (unverified), growing 40–60% YoY; GM: 55–70%; NRR: 110–120%; Series B 2028 at 10–12x on $200–300M
          ARR
        - $2.0B–$3.6B at Series B; $6–9B at IPO in 2031
        - 0–1.8x from $2B entry; ~3–4.5x to IPO; adequate but not exceptional
        - 'Medium: consistent with ''good but not exceptional'' execution; requires avoiding sector compression'
      - - Bear
        - 'ARR: $20–50M (actual), growth slowing; sector multiple compression to 8–10x; down-round 2027'
        - $0.4B–$1.0B at next round; potential restructuring or acqui-hire
        - Loss of 50–80% from $2B entry; rescue acquisition at distress price
        - 'Low-medium: triggered by revenue surprise + sector correction; unlikely if investors have done real diligence'
    notes: >
      All scenarios are model estimates based on public data and comparable company benchmarks. None can be verified
      without audited financials. Revenue figures in scenarios are hypothetical ranges, not confirmed values. Return
      estimates assume no additional dilution beyond existing cap table.
