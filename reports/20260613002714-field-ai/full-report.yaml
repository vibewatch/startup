      - number: '7.2'
        title: Operational, Safety, and Security Risk
        blocks:
          - type: paragraph
            body: >
              FieldAI's core value proposition — autonomous robots operating in unstructured, safety-critical
              environments — is simultaneously its highest operational risk surface. Robots powered by FFMs make
              decisions entirely on-edge without GPS, maps, or cloud connectivity. A model inference error in a novel
              environment (e.g., a debris configuration not represented in training data, an unexpected human crossing a
              pre-authorised robot path) could result in physical harm, property damage, or mission failure in
              high-consequence settings such as construction, mining, or energy operations. The 2026 International AI
              Safety Report identifies "loss-of-control scenarios" and "inadequate real-world reliability testing" as
              two of the most pressing risks in rapidly advancing autonomy systems, directly applicable to FieldAI's
              product domain. A 2025 widely-reported incident in which a Unitree H1 robot malfunctioned near a human
              worker, and the CES 2026 safety analysis from SRES noting that "existing industrial safety protocols often
              fall short when robots share open workspaces with humans," illustrate how the broader competitive cohort —
              not FieldAI specifically — has suffered public safety failures that will shape customer due diligence
              requirements, procurement standards, and potential litigation expectations.

              No safety incidents involving FieldAI-powered robots have been publicly reported as of May 2026. However,
              the absence of published performance benchmarks, safety validation test reports, or third-party safety
              certifications (ISO 10218 for industrial robots, IEC 62443 for industrial cybersecurity, or SOC 2 for data
              handling) means that enterprise customers and investors cannot independently verify the residual risk
              level. The NIOSH Center for Occupational Robotics Research and OSHA both document a documented baseline of
              serious robot-related workplace injuries in industrial settings; FieldAI's deployments in active
              construction zones and mining operations place its robots in precisely the settings where these incidents
              are most common. The company's own deployment narrative — hundreds of sites on three continents —
              increases the probability of encountering a first adverse event as deployment scale grows.

              On cybersecurity: FieldAI's robots upload fleet data to a cloud analytics platform and communicate with
              NVIDIA Omniverse and Isaac infrastructure. No public DPA, security whitepaper, penetration test report, or
              SOC 2 certification has been found. An adversarial attacker capable of spoofing on-device sensor data or
              injecting commands into the fleet management plane could potentially cause physical harm. Industrial IoT
              and operational technology (OT) security standards (IEC 62443) are not confirmed as implemented. These
              gaps create material residual exposure if a security incident precedes formal certification.
