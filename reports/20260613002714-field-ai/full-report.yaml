chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Business Model
        blocks:
          - type: paragraph
            body: >
              FieldAI is an Irvine, California-based robotics AI software company founded in 2023 by Ali Agha, a veteran
              of NASA's Jet Propulsion Laboratory (JPL). The company's central thesis is that the binding constraint on
              industrial robotics adoption is not hardware but intelligence: robots lack the adaptive, risk-aware
              autonomy needed to operate reliably in unstructured real-world environments. FieldAI addresses this by
              building Field Foundation Models (FFMs), a class of "physics-first" foundation models trained on sensor
              data from physical deployments rather than internet text or images. FFMs serve as a universal software
              brain that can be installed across heterogeneous robot platforms—quadrupeds, humanoids, wheeled rovers,
              tracked vehicles, and passenger-scale autonomous vehicles—without requiring per-platform reprogramming,
              pre-mapped environments, GPS, or cloud connectivity. The robots make decisions entirely on-edge in real
              time. FieldAI markets the platform to enterprise industrial customers in construction, energy, mining,
              manufacturing, logistics, urban delivery, inspection, and defense. The company explicitly does not
              manufacture robots; it is a pure-play AI software vendor that partners with robot OEMs and deploys
              software on customer-owned or third-party robot hardware. This hardware-agnostic model positions FieldAI
              as the "brain layer" of the robotics stack, analogous to how an OS or middleware layer abstracts hardware
              in enterprise computing. Bill Gates described the company simply: FieldAI "develops AI software for other
              companies' robots that enables them to perceive their environments, navigate without GPS, and even
              communicate with each other." Primary revenue channels are B2B software licensing and hardware-integration
              services, with subscriptions reportedly ranging from tens of thousands to $500,000 per year depending on
              deployment scale. As of April 2026, sources familiar with the matter indicate the company has more than
              $100 million in booked revenue and partnerships with large industrial customers.
