  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / Measurable Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Down-round at Series B
        - Series B closes at valuation below $2.0B
        - Directly contradicts private-investor thesis; signals revenue disappointment or sector repricing
        - Downgrade to AVOID; exit or reduce exposure immediately
      - - Major customer churn or deployment failure
        - Publicly announced customer exit or safety incident causing suspension of deployments
        - Undermines "hundreds of sites, three continents" commercial traction narrative
        - Review position; determine whether isolated or systemic before acting
      - - Revenue revision materially below $100M booked
        - Company-disclosed or investigative journalism reveals booked revenue <$50M or bookings ≠ ARR
        - Valuation multiple jumps to 40x+ on real ARR; beyond reasonable range for current stage
        - Downgrade to AVOID; multiple compression to 10–15x would imply $500M–750M valuation
      - - Competitive displacement by hyperscaler
        - NVIDIA Cosmos, Google Intrinsic, or Amazon AWS Robotics announces comparable FFM service
        - Pricing pressure on licensing fees; platform risk materializes; moat questions arise
        - Reassess defensibility; downgrade to TRACK or AVOID depending on scope
      - - Governance or legal risk event
        - IP dispute, regulatory action, key-person departure (CEO or CSO), or SEC enforcement
        - Destabilizes team and investor confidence; raises execution risk
        - Material risk event → downgrade to TRACK pending resolution; severe event → AVOID
    notes: >
      Triggers are defined at observable thresholds to enable monitoring without access to private financial data. All
      five represent thesis-break conditions; any one of them materially changes the recommendation. The down-round
      trigger is the single most actionable public signal.
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner or Diligence Path
    rows:
      - - Audited ARR and revenue recognition policy
        - No audited financials; range of estimates is $5M–$140M; "booked revenue" ≠ recognized ARR
        - Cannot underwrite $2B valuation without verified revenue anchor; defines whether 14x or 400x multiple applies
        - >-
          Request audited or reviewed P&L and ARR schedule under NDA; accept rolling 12-month ARR with revenue
          recognition footnote
      - - Gross margin by revenue stream
        - Not disclosed; software licensing vs. hardware integration split unknown; blended margin unverifiable
        - Software-level margins (70–80%) justify premium; hybrid margins (55–65%) do not support same multiple
        - >-
          Request contribution margin waterfall segmented by licensing vs. services; compare to public AI SaaS
          benchmarks
      - - Net Revenue Retention and cohort data
        - Not disclosed; company claims "expansion contracts" but NRR is unverified
        - NRR >120% is required to justify land-and-expand SaaS multiple; <100% would trigger bear case
        - Request quarterly cohort retention by product line; confirm ACV trajectory for 2024–2026 cohorts
      - - Cap table, liquidation preferences, and option pool
        - Not disclosed; preference overhang and anti-dilution protections unknown
        - Heavy liquidation preferences in Series A/A1 could reduce common equity value to near zero in base case
        - Request cap table summary and waterfall analysis from Series A lead counsel; confirm preference structure
      - - Board composition and governance documentation
        - Not publicly disclosed; independent board members unknown
        - >-
          Governance quality is a key diligence dimension for institutional investors; weak governance = higher agency
          risk
        - Request board deck, observer rights agreement, and investor rights agreement; confirm audit committee status
      - - Customer concentration and contract terms
        - >-
          Customer names not disclosed; top-5 customer revenue concentration unknown; contract length/renewal terms
          unknown
        - High concentration (top-3 customers >50% revenue) would materially change churn risk profile
        - >-
          Request redacted customer schedule under NDA; confirm single-customer revenue cap; review contract renewal
          clauses
    notes: >
      All six asks are standard pre-investment due diligence requests. None are unusual for a private company at this
      stage; all are required before underwriting the $2B valuation with any fundamental anchor. The first three (ARR,
      GM, NRR) are the minimum threshold to upgrade from TRACK to BUY; the last three (cap table, governance, customer
      concentration) are required for any investment committee approval.
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
