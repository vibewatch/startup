      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Deep Founder-Market Fit from DARPA and NASA JPL
            body: >-
              The FieldAI founding team (Agha, Omidshafiei, Fan) shares a uniquely tight founder-market fit: all three
              worked directly on the CoSTAR program at JPL, MIT, and affiliated institutions, and their core autonomy
              architecture (NeBula, later FFMs) was battle-tested in the DARPA Subterranean Challenge before any
              commercial application was attempted. This research-to-deployment path is rare and substantially de-risks
              the technical thesis. Marc Raibert's personal Boston Dynamics endorsement further validates the team's
              technical credibility.
            calloutType: strength
            claimRefs:
              - CO013
              - CO014
              - CO015
              - CO038
          - type: callout
            title: No Named Customers and Early Commercial Stage
            body: >-
              Despite $405M raised and a $2B valuation, FieldAI has declined to publicly name any specific enterprise
              customers as of its August 2025 funding announcement. The company had only ~130 employees at funding time
              (growing from ~30 just nine months prior), and revenue metrics are privately held. The OCBJ-reported
              ">$100M booked revenue" is from anonymous third-party sources, not company disclosure. Active robotics
              deployments among contractors fell from 65% in 2024 to 46% in 2025 per BuiltWorlds, indicating an
              industry-wide adoption gap that FieldAI must navigate to convert its stated bookings into durable
              recurring revenue.
            calloutType: risk
            claimRefs:
              - CO040
              - CO041
              - CO031
              - CO033
          - type: callout
            title: HQ Location Conflict in Canon
            body: >-
              Multiple pre-diligence references describe FieldAI's headquarters as San Francisco. However, all primary
              sources—including FieldAI's own official press releases, TechCrunch, CNBC, Reuters, and Orange County
              Business Journal—consistently identify the company as headquartered in Irvine, California (formerly
              Mission Viejo, CA). No credible source places a FieldAI headquarters in San Francisco. This discrepancy in
              prior references should be verified in due diligence.
            calloutType: risk
            claimRefs:
              - CO002
              - CO042
          - type: callout
            title: Software-Only Model Provides Asymmetric Scale Potential
            body: >-
              By refusing to build hardware, FieldAI avoids the capital intensity of robot manufacturing and can target
              every robot OEM as both a distribution partner and an addressable account. The hardware-agnostic approach
              means each new robot platform (humanoid, wheeled, aerial) represents an expansion opportunity rather than
              a product pivot. This is the OS-layer analogy: if FFMs become the de facto standard for industrial robot
              autonomy, the addressable market expands proportionally to global robot fleet growth without commensurate
              capex increases.
            calloutType: insight
            claimRefs:
              - CO003
              - CO005
              - CO007
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >
              FieldAI's addressable market is not the full industrial robotics market—the majority of deployed
              industrial robots reside in structured, repetitive manufacturing environments (automotive assembly,
              semiconductor fabrication, consumer electronics) that are already well served by traditional fixed-path
              automation vendors such as FANUC, ABB, and Yaskawa. FieldAI's distinct market is the segment of industrial
              robot deployments that require adaptive, risk-aware autonomy to operate in unstructured environments where
              layouts change daily, GPS and pre-mapped paths are unavailable, and static programming fails. This
              includes active construction sites (where terrain, obstacles, and workflows shift hourly), underground and
              open-pit mines (where rock falls, gas hazards, and confined spaces make human exposure dangerous), oil and
              gas topside and inspection environments (where access to assets is hazardous and remote), and flexible or
              high-mix manufacturing facilities not amenable to fixed-path robots.


              The market boundary excludes spend on: (a) structured factory automation hardware and software (e.g.,
              traditional articulated arm robots on fixed assembly lines); (b) consumer or logistics warehouse robots
              operating in controlled environments; (c) robot hardware itself, as FieldAI is a pure-play software
              vendor; and (d) subsea ROVs and specialty underwater vehicles, which are addressed by a separate supplier
              ecosystem. The status-quo substitutes that industrial buyers currently rely on include manual human
              inspection and monitoring crews, traditional fixed-path or single-task robots that require extensive
              pre-programming, drone/UAV aerial surveys, and BIM/CAD modeling with manual data capture. Each of these
              substitutes is more expensive per unit of site intelligence, less real-time, and increasingly untenable as
              labor pools shrink and safety requirements tighten.


              FieldAI's market spans four primary verticals: (1) construction and infrastructure, (2) energy, mining,
              and extractives, (3) oil and gas inspection and operations, and (4) industrial manufacturing in
              unstructured or high-mix configurations. The company describes its target as "dirty, dull, and dangerous"
              environments where autonomous robots deliver compounding value across safety, documentation, and
              operational insight— a framing that aligns closely with the structural characteristics of its four served
              verticals. Adjacent markets that represent future expansion paths include defense and perimeter security,
              logistics in complex environments, and urban delivery in semi-structured settings. The relevant market is
              best sized through vertical-specific analyst estimates rather than a single broad robotics TAM, because
              scope definitions across analyst reports diverge materially.
