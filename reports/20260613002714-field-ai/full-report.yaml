      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural Demand Tailwinds Are Multi-Decade and Converging
            body: >
              Labor shortages in construction, mining, and energy are not cyclical—they are structural, driven by
              workforce aging, declining interest in hazardous trades, and regulatory escalation. Combined with AI
              autonomy reaching industrial productionization maturity in 2026–2028, FieldAI's timing is optimal: the
              technology is sufficiently proven (deployed at enterprise scale, 90%+ efficiency gains documented) while
              the market is still early enough for platform incumbency to be established before competitive
              fragmentation. IFR's data showing 4.66 million operational industrial robots globally and 542,000 annual
              installations provides a large and growing installed base for FieldAI's software layer.
            calloutType: strength
            claimRefs:
              - CM008
              - CM031
              - CM033
              - CM035
          - type: callout
            title: Pilot Purgatory and Slow Enterprise Conversion Are Existential Risks
            body: >
              The single most important near-term market risk is the documented gap between positive robotics
              evaluations and active deployments. BuiltWorlds found that 95%+ of construction firms positively evaluated
              robotics in 2025 but only 46% reported active use—down from 65% the prior year. This pattern aligns with
              McKinsey's finding that 71% of industrial companies cite capital costs and 61% cite lack of internal
              experience as adoption barriers. For FieldAI, this means strong pilot performance does not automatically
              translate into enterprise revenue. The company's $405M in capital provides the runway to solve this
              conversion problem, but the pilot-to-enterprise rate is the critical unpublished metric that determines
              whether FieldAI's market opportunity is realized on its projected timeline.
            calloutType: risk
            claimRefs:
              - CM036
              - CM038
              - CM039
          - type: callout
            title: Software Layer Captures Disproportionate Value as Hardware Commoditizes
            body: >
              Analytics Insight notes that factories are beginning to select robots the way companies select cloud
              infrastructure: for compatibility with an intelligence ecosystem rather than standalone hardware
              performance. As robot hardware specifications converge (Boston Dynamics Spot pricing trends down; humanoid
              robots entering price competition), the software intelligence layer captures an increasing share of total
              system value. FieldAI's hardware-agnostic FFM architecture positions it as the potential OS-level platform
              of industrial robotics—analogous to how hyperscalers abstracted hardware in enterprise computing. The
              market long-term could be winner-take-most for the software layer, but this requires FieldAI to build
              switching costs through data flywheel advantages before competitor foundation models narrow the autonomy
              gap.
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
              - CM019
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Buyer Alternatives
        blocks:
          - type: paragraph
            body: >
              Industrial enterprises that need autonomous robot operations have five materially distinct ways to solve
              the job in 2026: (1) deploy FieldAI's Field Foundation Models on existing hardware; (2) adopt an
              embodied-AI foundation model platform from a well-capitalized rival (Intrinsic/Google, Physical
              Intelligence, Covariant); (3) use an inspection-specialist platform with its own robotics stack (Gecko
              Robotics, Machina Labs); (4) rely on the robot OEM's bundled intelligence software (Boston Dynamics Orbit,
              KUKA, Fanuc native AI); (5) continue with status quo—manual inspection crews, traditional
              SLAM/GPS-dependent navigation, or an in-house software team. Most large enterprise buyers use more than
              one approach simultaneously, making multi-homing common and switching costs softer than they initially
              appear. FieldAI targets the largest unmet slice: dynamic, GPS-denied, unstructured field environments
              where status-quo and OEM-native solutions fail. The company's hardware-agnostic software model avoids the
              capital intensity of robot manufacturing while enabling presence across more platforms than any single
              OEM. As of May 2026, the eight direct and substitute players profiled below collectively represent
              substantially more VC and corporate capital than FieldAI, creating both validation of the market and a
              material risk of well-resourced competitive entrenchment.
