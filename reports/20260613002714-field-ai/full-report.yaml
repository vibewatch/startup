      - number: '1.4'
        title: Scale, Partnerships, and Milestone Chronology
        blocks:
          - type: paragraph
            body: >
              FieldAI's growth trajectory since its 2023 founding has been steep. The company had approximately 30
              employees at the end of 2024, grew to approximately 130 by the time of its August 2025 funding
              announcement, and LinkedIn reported 201–500 employees as of early 2026—consistent with its stated plan to
              double headcount to approximately 260 by end-2025. The company relocated from roughly 13,000 square feet
              of Mission Viejo office space to a 41,000-square-foot R&D headquarters at 3 Morgan, Irvine Spectrum in
              late 2025, driven by hiring and lab expansion needs. FieldAI's production deployments now span thousands
              of missions across hundreds of sites on three continents—North America, Europe, and Asia-Pacific
              (including Japan). The company has attracted dozens of large enterprise customers across construction,
              energy, manufacturing, urban delivery, security, and defense, and has established a FieldAI Federal
              subsidiary for government and military applications. Two major strategic partnerships were announced in
              early 2026: in February, Certis Group (Singapore's leading integrated security provider) and FieldAI
              formed a partnership to deploy autonomous security robots globally; in March 2026, Boston Dynamics and
              FieldAI announced a collaboration combining Spot's mobility with FieldAI's FFMs for construction and other
              dynamic environments. Marc Raibert, founder of Boston Dynamics, endorsed the company specifically by
              referencing their 2020 DARPA SubT win: "We've known Ali and his team since they won the Urban-circuit of
              the DARPA Subterranean Challenge using Spot robots, while tackling similar challenges for NASA." A key
              risk metric noted by Construction Dive: active robotics deployments among surveyed contractors fell from
              65% in 2024 to 46% in 2025 despite 95% positive evaluations—suggesting industry-wide friction between
              willingness and actual adoption that represents a near-term headwind for FieldAI's commercial scale
              targets.
