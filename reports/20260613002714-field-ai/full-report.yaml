      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >
              FieldAI sells B2B enterprise software, not hardware. The company's buyer structure follows a classic
              enterprise industrial technology pattern: the payer is the C-suite or VP Operations/Finance, the technical
              buyer is the operations or HSE (Health, Safety, Environment) leader, and the day-to-day user is the site
              superintendent, field engineer, or project manager. Budget ownership sits in one of two pools depending on
              vertical: (1) capital expenditure (capex) budgets for new automation investments, which are controlled by
              CFOs and VPs of Engineering or Operations; and (2) operational expenditure (opex) for recurring
              inspection, monitoring, and site-intelligence contracts, which are controlled by plant or project managers
              working within pre-approved service vendor agreements. FieldAI has positioned its offering as delivering
              immediate ROI on the opex side (90%+ reduction in manual documentation time, identification of rework
              earlier), enabling the initial sale to be framed as cost avoidance rather than capex transformation.


              The construction segment concentrates its most immediate buying power among the largest general
              contractors—top ENR-ranked firms such as the unnamed customers referenced in FieldAI's Boston Dynamics
              case study. These firms own large project backlogs, bear cost-overrun risk, and have internal innovation
              or digital-transformation budgets earmarked for automation pilots. Adoption triggers include inability to
              generate accurate as-built BIM data quickly, labor shortages for site documentation teams, and safety
              mandates requiring periodic inspection of hazardous areas. Mining and energy buyers are concentrated
              around major operators (BHP, Rio Tinto, and equivalents) whose HSE and operations leaders are incentivized
              by regulatory compliance, incident reduction, and fleet productivity metrics. BHP Ventures' investment in
              FieldAI constitutes direct market validation from this buyer segment. Oil and gas customers are driven by
              inspection compliance requirements, cost reduction in hazardous environment access, and asset integrity
              management mandates. Across all segments, the adoption path progresses from a limited proof-of-concept
              (typically one site or asset cluster), through validated ROI, to an enterprise framework agreement
              covering multiple sites or regions—the same pattern demonstrated by FieldAI's references to "fleet-wide
              deployments" and "enterprise-scale" expansion across global operations.
            claimRefs:
              - CM025
              - CM026
              - CM027
              - CM028
