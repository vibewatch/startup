callouts:
- calloutType: risk
  title: Safety Certification Gap Is the Highest-Urgency Pre-Investment Diligence Item
  body: 'No ISO 10218, IEC 62443, SOC 2, or equivalent third-party safety or security certification has been found for FieldAI''s platform as of May 2026. Deploying autonomous robots in construction, mining, and energy environments without published safety validation exposes customers to OSHA compliance risk and creates direct product liability exposure for FieldAI under the EU''s revised Product Liability Directive. An investor should require an independent safety audit report and a compliance roadmap before closing any position.

    '
  claimRefs:
  - CR019
  - CR022
  - CR006
  - CR008
- calloutType: risk
  title: $2B Valuation at Series A Creates Material Down-Round and Dilution Risk
  body: 'FieldAI''s $2B entry valuation is the largest in robotics-AI Series A history and implies ~20× revenue multiple against unaudited signals. This leaves limited margin for growth deceleration or multiple compression. Any of the thesis-break triggers — safety incident, EU enforcement, key person loss, or commercialisation plateau — would likely reset the valuation, activating preference waterfall protections for later investors at the expense of earlier and common holders.

    '
  claimRefs:
  - CR041
  - CR042
  - CR043
  - CR044
  - CR045
