chapter:
  number: 7
  title: Risks
  summary: 'FieldAI operates at the intersection of safety-critical autonomy, a rapidly crystallizing AI regulatory environment, and extremely high valuation expectations for a two-year-old company. No public lawsuits, regulatory enforcement actions, or safety incidents against FieldAI have been identified as of May 2026, but the absence of safety certifications, undisclosed financial metrics, deep NVIDIA and Boston Dynamics dependencies, a single-founder keystone risk, and a $2B Series A valuation that outpaces comparable benchmarks collectively produce a high residual risk profile. Thesis-break triggers centre on a material safety incident, EU AI Act non-compliance enforcement, Boston Dynamics partnership unwinding, Ali Agha departure, or a fundraising valuation reset.

    '
sections:
- id: regulatory-legal
  title: Regulatory and Legal Risk
  body: 'FieldAI deploys AI systems that make autonomous physical decisions in safety-critical industrial environments. This places the company squarely within the scope of several evolving 2026 AI regulatory frameworks. Under the EU AI Act, robotics AI systems used as safety components in industrial settings are classified as high-risk, requiring risk management systems, technical documentation, human oversight design, CE marking, and post-market monitoring. Baker Botts notes that the original August 2, 2026 deadline for Annex III high-risk systems is subject to a European Commission Digital Omnibus proposal that could extend it to six months after harmonised standards are published (backstop December 2027); however, the extension depends on adoption before August 2026, meaning companies must maintain parallel compliance preparation under the existing deadline. Colorado''s AI Act (SB 24-205), effective June 30, 2026 — the first comprehensive US state statute on high-risk AI systems — requires
    impact assessments, consumer disclosures, and reasonable care to prevent algorithmic discrimination. California SB 53, effective January 2026, requires developers of large frontier AI models (>10²⁶ FLOPS training) to publish risk frameworks and report critical safety incidents within 15 days; whether FieldAI''s training compute crosses this threshold is undisclosed. Federal direction remains unsettled: the Trump administration''s December 2025 executive order signals intent to pre-empt state AI laws but does not preempt them today, leaving a patchwork compliance burden.

    On product liability, courts are consolidating around a products-liability framework for AI deployments. KL Gates (March 2026) documents a growing body of pleadings treating deployed AI systems as "products" subject to design-defect, failure-to-warn, and foreseeable-misuse theories. The EU revised Product Liability Directive extends strict liability across the supply chain to upstream AI component providers, which would encompass FieldAI even if the deploying customer or robot OEM owns the end-product relationship. Garcia v. Character Technologies set a precedent that consumer-facing AI can be treated as a product under strict liability at the pleading stage. For industrial robotics AI, physical harm causation (crushing, striking, unexpected motion) would be even more direct than in consumer chatbot cases.

    No public enforcement actions, regulatory investigations, lawsuits, or IP disputes involving FieldAI have been identified. FieldAI Federal, the defense subsidiary, would be subject to ITAR/EAR export controls if its autonomy systems cross into dual-use military technology; no public disclosure of export authorisations has been found. IP protection relies primarily on trade secrets and publication velocity rather than granted patents: USPTO patent application search finds one filed patent application (US 2025/0252306) but no granted patents as of May 2026, leaving the core FFM technology potentially exposed to imitation if personnel depart.

    '
