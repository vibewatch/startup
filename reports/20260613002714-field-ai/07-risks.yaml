    - Low-medium — no public indication of departure risk; early-stage founder retention incentives typical
    - Critical — fundraising disruption, enterprise customer confidence collapse, partnership relationship rupture
    - Robust equity vesting and investor retention agreements expected (not confirmed); leadership depth in CTO/CSO positions
