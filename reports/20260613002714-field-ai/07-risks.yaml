- id: financial-thesis-break
  title: Financial, Valuation, and Thesis-Break Risk
  body: 'FieldAI''s $2B Series A valuation is the largest in robotics-AI history for a company at this stage, and it creates a high bar for future capital events. The only independent revenue signal — "$100M+ in booked revenue" from anonymous OCBJ April 2026 sources — implies a revenue multiple of roughly 20× at the $2B mark, consistent with the highest-multiple cohort in enterprise AI software but exposed to multiple compression if growth deceleration, AI sector sentiment shifts, or public-market comps reprice. GetLatka''s $140M ARR estimate (November 2025) is unaudited and unconfirmed by the company. Gross margin, NRR, CAC, cash on hand, and burn rate are entirely undisclosed, preventing underwriting of the valuation with conventional SaaS or deeptech metrics.

    Capital intensity is a hidden risk: industrial robot deployments require on-site integration, custom payload installation, and ongoing model fine-tuning, all of which carry cost-of-delivery overhead that could compress gross margins significantly below pure-software levels. If gross margins are substantially below 60–70%, the $2B valuation becomes difficult to support even at accelerating revenue growth. A second risk is burn concentration: at 130+ employees and with a leadership team from high-cost academic and technology institutions, monthly burn could reach $10–20M, implying a cash runway of 2–4 years from the $405M raise. Market or macroeconomic conditions that disrupt growth before breakeven could force a down round.

    Thesis-break triggers are defined at the intersection of evidence that undermines the core investment thesis: (1) a material safety incident involving FieldAI-powered robots that leads to customer withdrawal, regulatory action, or litigation; (2) EU AI Act enforcement action blocking EU market access; (3) Boston Dynamics partnership termination or Hyundai strategic pivot that removes the primary commercial case study; (4) Ali Agha departure or reputational event; (5) a valuation reset or down round indicating the market will not sustain the $2B entry valuation. Each of these triggers is independently sufficient to change the risk-adjusted return profile materially.

    '
