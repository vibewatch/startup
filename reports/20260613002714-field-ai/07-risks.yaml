tables:
- id: TR001
  title: Regulatory / Legal Risk Register
  enumerationScope:
    coverage: partial
    basis: Key regulatory, legal, and liability frameworks applicable to FieldAI's operations across US federal, US state, EU, and defense channels as of 2026; excludes country-specific regulations outside US/EU with insufficient public evidence
  columns:
  - Rule / License / Framework
  - Jurisdiction
  - Status as of May 2026
  - Likelihood for FieldAI
  - Severity if Triggered
  - Mitigation
  - Residual Exposure
  - Diligence Path
  rows:
  - - EU AI Act (high-risk AI — Annex III safety components)
    - EU / Global
    - Obligations apply from August 2026 (or extended backstop Dec 2027 if Digital Omnibus adopted)
    - High — FieldAI's industrial autonomy deployments in EU markets likely qualify as high-risk
    - Critical — market access blocked, fines up to €35M or 7% global revenue
    - Compliance programme preparation; technical documentation; CE marking pipeline
    - Material — no public evidence of readiness; exact EU deployment scope undisclosed
    - Request EU-specific compliance roadmap, CE marking status, notified-body engagement documentation
  - - Colorado AI Act (SB 24-205)
    - US — Colorado
    - Effective June 30, 2026; first comprehensive US state high-risk AI statute
    - Medium — depends on whether FieldAI systems serve Colorado-based enterprise customers
    - Medium — impact assessment penalties, consumer disclosure obligations
    - Monitor state applicability thresholds; engage Colorado counsel
    - Low-medium — startup-scale companies below certain thresholds may be exempt
    - Confirm Colorado customer list and applicability threshold analysis
  - - California SB 53 (Transparency in Frontier AI Act)
    - US — California
    - Effective January 2026; requires risk framework publication + 15-day incident reporting
    - Medium — depends on training compute; 10²⁶ FLOP threshold likely not reached yet
    - Medium — up to $1M per violation; whistleblower protections activate
    - Monitor training compute reporting obligations as models scale
    - Low-medium — may not yet trigger but could cross threshold as models grow
    - Obtain training compute estimates and legal opinion on SB 53 applicability
  - - AI Product Liability (EU PLD / US state tort law)
    - US / EU
    - Evolving case law through 2026; EU PLD transposition by December 2026
    - High — physical harm causation in industrial robot settings is direct and foreseeable
    - Critical — design defect, failure-to-warn, strict liability up supply chain
    - Product liability insurance; safety documentation; system guardrails; customer indemnification terms
    - High — no published safety certifications, DPA, or independent audit found
    - Review customer contracts for indemnification scope; obtain product liability insurance certificate; request safety test reports
  - - ITAR / EAR Export Controls (FieldAI Federal)
    - US Federal
    - ITAR/EAR apply to dual-use military technology; FieldAI Federal is an operational subsidiary
    - Medium — FieldAI Federal's autonomous military robotics could trigger export control classifications
    - High — criminal penalties, export licence revocations, loss of government contracts
    - Engage ITAR counsel; classify products; obtain State/Commerce authorisations as needed
    - Material — no public ITAR authorisation documentation found
    - Request ITAR/EAR classification opinions and export authorisation status for FieldAI Federal
  notes: Coverage is partial; exact EU deployment geography and US state customer footprint are not publicly disclosed. Likelihood assessments are inferred from public product descriptions, partnership announcements, and regulatory text; not confirmed by company or counsel.
