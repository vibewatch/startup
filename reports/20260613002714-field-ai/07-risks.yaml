  - Residual Exposure
  rows:
  - - Boston Dynamics Spot hardware platform
    - Boston Dynamics / Hyundai Motor Group
    - Primary commercial hardware platform for construction vertical; primary reference customer case study
    - High — construction go-to-market case is Spot-centric
    - Partnership termination, Hyundai strategic pivot, Spot platform discontinuation, or Hyundai-FieldAI investor conflict
    - Critical — loss of primary commercial case study, revenue concentration, market narrative
    - Hardware-agnostic FFM design; pursuing additional OEM partnerships; Hyundai financial investment aligns some incentives
    - Material — no exclusivity or minimum commitment terms disclosed; investor relationship does not guarantee commercial continuity
  - - NVIDIA Omniverse / Isaac / OSMO compute and simulation stack
    - NVIDIA (strategic investor via NVentures)
    - Simulation training, synthetic data generation, digital twin reconstruction; deep model pipeline dependency
    - High — multiple NVIDIA products used across training and deployment pipeline
    - Pricing increase, supply allocation to hyperscalers, API deprecation, or strategic partner priority change
    - High — model training costs and pipeline reliability tied to NVIDIA availability and pricing
    - NVentures investor relationship; NVIDIA Omniverse collaboration deepening; edge inference designed to run on diverse hardware
    - Medium — investor alignment reduces abrupt cutoff risk; GPU supply tightness is a market-wide constraint
  - - Certis Group fleet orchestration (Mozart platform)
    - Certis Group (security vertical partner)
    - Fleet command-and-control integration for security operations; inter-operability dependency
    - Medium — security vertical commercial pipeline depends on Mozart compatibility
    - Certis platform deprecation, strategy change, or competitive conflict with FieldAI's direct sales
    - Medium — limits security vertical deployability if Certis diverges
    - FFM designed as middleware layer; alternative orchestration integration is possible
    - Low-medium — less deep than NVIDIA or Boston Dynamics dependencies
  - - NVIDIA and cloud GPU compute (model training)
    - NVIDIA / Azure / hyperscalers
    - Training infrastructure for FFM model improvement; federated learning from deployment data
    - Medium — concentrated in NVIDIA GPU ecosystem; Azure used for pipeline toolchain
    - Sustained GPU supply shortage (HBM bottleneck, TSMC shock) raising training costs or delaying model updates
    - Medium — slows model improvement velocity; increases capital intensity
    - $405M raise provides capital buffer to secure long-term cloud commitments
    - Medium — structural GPU supply constraints are market-wide and not FieldAI-specific
  - - Robot OEM SDK and payload access (multi-platform)
    - Boston Dynamics, Unitree, other OEMs
    - SDK access required for FFM integration with each hardware platform; FieldAI maintains customised Spot SDK fork
    - Medium — each OEM integration is a bespoke engineering effort; OEM SDK changes break integrations
    - OEM SDK incompatibility, licence revocation, or OEM-developed competing autonomy software
    - Medium-High — OEM vertical integration of AI stack is a long-term competitive threat
    - Hardware-agnostic design philosophy; multiple active OEM integrations reduce single-OEM lock-in
    - Medium — Boston Dynamics OEM owner (Hyundai) has strategic incentive to eventually own the autonomy layer
  notes: Partner terms (exclusivity, revenue sharing, minimum commitments, termination rights) are not publicly disclosed. Concentration assessments are based on publicly available partnership announcements and product documentation only.
