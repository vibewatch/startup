  notes: Likelihood and severity are based on industry analogs for deep-tech spinouts at equivalent stage and publicly available leadership information. No internal HR data is available.
- id: TR005
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk
  - Monitorable Trigger
  - Threshold / Event
  - Action Implication
  rows:
  - - Safety incident (AI-caused physical harm)
    - Public incident reports, OSHA filings, news coverage, customer disclosures
    - First confirmed robot-caused injury or property damage event attributed to FFM failure at any FieldAI deployment
    - Pause new deployment expansion; conduct root-cause analysis; obtain independent safety audit before resuming; monitor customer withdrawal announcements
  - - EU AI Act enforcement action
    - EU market authority announcements, FieldAI press releases, news coverage, customer procurement freezes citing compliance
    - Formal EU market authority investigation, non-conformity finding, or customer procurement freeze citing AI Act compliance
    - Immediate diligence on EU compliance programme; assess market access risk; consider EU deployment pause pending certification
  - - Boston Dynamics partnership termination or Hyundai strategic pivot
    - Public partnership announcements, Hyundai Motor Group strategy disclosures, FieldAI OEM partner updates
    - Public statement by either party terminating partnership, or Hyundai announcement of proprietary autonomy stack for Boston Dynamics hardware
    - Re-assess construction-vertical commercial case without Spot integration; evaluate OEM diversification timeline; recalibrate revenue projections
  - - Ali Agha departure or reputational event
    - LinkedIn, press coverage, company announcements, investor communications
    - Confirmed departure from CEO/founder role, extended medical leave, or public reputational controversy
    - Emergency assessment of management succession plan; investor communication; consider representation and warranty insurance triggers
  - - Fundraising valuation reset or down round
    - Future financing announcements, secondary market data (Nasdaq Private Market, PremierAlts), investor communications
    - Any announced financing round at valuation materially below $2B, or secondary market price indicating 30%+ discount to last-round price
    - Re-assess terminal valuation upside; review preference stack and liquidation preferences; evaluate dilution exposure relative to original entry thesis
  - - Commercialisation plateau (revenue growth below threshold)
    - OCBJ/Sacra/GetLatka revenue reports, customer count disclosures, hiring slowdown signals
    - Public or reliable third-party indication of ARR growth falling below 80% YoY or booked revenue stagnating below $150M through 2027
    - Deep-dive on sales productivity metrics, customer retention, and pipeline quality before next capital deployment decision
  notes: Thresholds are analyst-defined trigger points for heightened diligence, not contractual or legally binding criteria. Monitoring relies primarily on public information given FieldAI's private-company disclosure posture.
