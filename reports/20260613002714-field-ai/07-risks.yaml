- id: TR002
  title: Operational / Quality / Security Risk Register
  columns:
  - Failure Mode
  - Likelihood
  - Severity
  - Mitigation Maturity
  - Residual Exposure
  - Unresolved Gap
  rows:
  - - AI model inference error causing physical harm in novel environment
    - Medium — compounding with scale; novel environments are unavoidable in unstructured deployment
    - Critical — worker injury, property damage, litigation, customer withdrawal
    - Low-medium — on-device uncertainty quantification is a design feature; no independent safety audit published
    - High — no ISO 10218 or IEC 61508 certification found
    - No published performance benchmarks, safety validation reports, or third-party safety audits
  - - Cybersecurity attack on edge fleet or cloud analytics platform
    - Low-medium — industrial OT environments increasingly targeted; fleet connectivity creates attack surface
    - High — adversarial sensor spoofing could cause physical harm; data exfiltration from customer sites
    - Low — no SOC 2, IEC 62443, or published penetration test found
    - High — no security certification evidence available
    - No public DPA, security whitepaper, or OT-specific cybersecurity programme disclosed
  - - On-device hardware failure in hazardous environment (edge compute, sensor)
    - Medium — harsh conditions in mining, construction, and energy deployments accelerate hardware degradation
    - Medium — mission failure, data loss, possible robot recovery hazard
    - Medium — Boston Dynamics Spot is designed for industrial duty cycles; FieldAI's compute payload is custom
    - Medium — limited public data on payload MTBF in extreme environments
    - Mean-time-between-failure (MTBF) data for FieldAI-specific payload not publicly available
  - - Regulatory non-compliance blocking EU or US state market access
    - Medium — August 2026 EU AI Act deadline; June 2026 Colorado AI Act; compliance programme not confirmed
    - High — market access disruption, fines, reputational damage with enterprise customers
    - Low — no compliance programme evidence found in public disclosures
    - High — no readiness documentation published
    - Confirm EU compliance programme status; request internal risk assessment documentation
  - - Data sovereignty and cross-border data transfer violation (customer operational data)
    - Low-medium — FieldAI collects sensor/video data from customer sites across three continents
    - Medium — GDPR enforcement, customer contract breach, reputational damage
    - Unknown — no DPA or cross-border transfer mechanism documentation found
    - Medium — no confirmed Standard Contractual Clauses or DPA found
    - Request DPA template, cross-border transfer mechanism, and data retention policy
  notes: Likelihood and severity are evidence-informed ordinal assessments; no quantitative fault-tree analysis is available from public sources. Mitigation maturity is assessed against publicly available disclosures only.
- id: TR003
  title: Partner / Dependency Risk Register
  columns:
  - Dependency
  - Counterparty
  - Role
  - Concentration
  - Failure Scenario
  - Severity
