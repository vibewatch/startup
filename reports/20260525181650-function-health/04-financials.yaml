  figureRefs: []
- id: cost-structure-and-unit-economics-proxies
  title: Cost structure proxies point to a service-heavy rather than software-pure model
  body: 'Function’s own legal and FAQ materials make one key financial point clear: the company does not own the core lab infrastructure and does not describe itself as the medical provider. The closest public benchmark is therefore not a high-gross-margin SaaS company but the economics of diagnostics and fulfillment partners. Quest’s 10-K is valuable here because it shows the sheer physical and economic scale behind nationwide testing—billions of dollars of revenue, thousands of patient service centers, and distinct revenue streams for reference testing and laboratory services. Function then adds more third-party layers on top through Galleri and Ezra imaging. That structure does create ARPU upside, but it also implies vendor payments, clinical-review cost, scheduling complexity, and downstream follow-up burden. The directional conclusion is straightforward: until Function publishes stream-level gross margins, the margin path should be underwritten more like a diagnostics-distribution business
    with software enablement than like a pure software subscription.'
