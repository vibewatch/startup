  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue
    missingEvidence: Audited revenue, ARR, and renewal bridge by cohort and channel.
    whyItMatters: Valuation and revenue-quality conclusions cannot be validated without realized revenue data.
    diligencePath: Request audited P&L plus cohort revenue by join channel and renewal status.
    relatedQuestionRefs:
    - QI015
    - QI027
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: margin
    missingEvidence: Gross margin and contribution margin by subscription, imaging, and Galleri streams.
    whyItMatters: Without stream economics the company could be either software-enabled diagnostics or a thin-margin reseller.
    diligencePath: Request vendor contracts, stream gross profit, and clinical-review staffing cost.
    relatedQuestionRefs:
    - QI016
    - QI020
    relatedTableRefs:
    - TI003
    - TI006
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: Current unrestricted cash, monthly burn, debt, covenant schedule, and Ezra acquisition financing details.
    whyItMatters: A large funding round does not prove runway without burn and cash-balance visibility, and Ezra economics remain opaque.
    diligencePath: Request treasury snapshot, board-approved operating plan, debt schedule, and Ezra purchase-price documentation.
    relatedQuestionRefs:
    - QI014
    - QI017
    relatedTableRefs:
    - TI004
    - TI005
  - type: conflicting-data
    severity: material
    topic: pricing
    missingEvidence: Current cohort-level realized pricing and migration from $499 to $365.
    whyItMatters: Menu pricing is visible but public surfaces disagree on which price is current.
    diligencePath: Request billing records or cohort summary by signup month and renewal price.
    relatedQuestionRefs:
    - QI002
    - QI022
    - QI024
    relatedTableRefs:
    - TI001
    - TI002
    - TI003
  - type: missing-source
    severity: material
    topic: channel-mix
    missingEvidence: Revenue split across DTC, partner promotions, and enterprise or benefit channels.
    whyItMatters: Channel mix shapes CAC, retention, and gross margin.
    diligencePath: Request bookings and revenue by acquisition channel plus employer contract list.
