company:
  name: Function Health
chapter:
  number: 1
  title: Company Overview
  summary: 'Function Health is a private diagnostics membership company founded in 2022 and launched in beta in April 2023, built around a national Quest-based lab network, clinician review, and a later expansion into imaging and AI. Public evidence is strong on identity, leadership, financing, and packaged product surfaces: $53M Series A in 2024, $298M Series B at a $2.5B valuation in 2025, and a May 2025 Ezra acquisition. Public evidence is weaker on current paid members, headcount, board composition, revenue, and which of the competing $499 versus $365 pricing surfaces is operationally current.'
sections:
- id: identity-product
  title: Identity, product, and what is actually being sold
  body: 'Function Health is a consumer-facing diagnostics membership business built around longitudinal lab testing rather than a conventional primary-care relationship. Public materials support the basic identity facts: third-party coverage dates the company to 2022, independent reporting places beta launch in April 2023, and official FAQ plus terms pages place the company in Austin, Texas with nationwide availability across 48 states. The product promise is broader than a one-off blood panel. Function markets 160+ lab tests annually, a Quest-based national draw network, clinician review, a persistent dashboard, and optional add-ons such as Galleri and imaging. The important underwriting nuance is legal structure: Function’s own terms emphasize that it is a healthcare technology company, not the laboratory or medical provider. That means the member proposition is a packaged coordination and interpretation layer wrapped around third-party fulfillment, not vertically owned clinical delivery.'
