- id: adverse-signals-and-gaps
  title: Adverse signals, public contradictions, and what is still missing
  body: 'The strongest chapter-1 caution flags are not existential red flags but they are real. First, the public pricing surface is inconsistent: the pricing page still says $499 while newer official materials say $365. Second, the company mixes scale counters measured in results delivered, lab tests completed, paying members, and vaguer “hundreds of thousands of members” language. Those are directionally bullish but analytically messy. Third, the surrounding market is becoming more adversarial. The January 2026 Superpower lawsuit shows that biomarker marketing claims are now being contested in court, while Forbes and BMJ coverage frame the broader direct-to-consumer testing market as crowded, commoditizing, and potentially prone to overselling clinical value. Finally, the chapter could not verify current headcount, board composition, revenue, ARR, or a cap table from public materials. It also could not verify the economics of Quest, Ezra, or partner relationships from Function’s perspective, which means even seemingly simple scale claims should be read as market-positioning evidence rather than as complete operating proof. Those omissions are manageable for a company-overview chapter, but they materially constrain later valuation and financial confidence.'
