- id: TO005
  title: Public fact conflicts and evidence gaps
  columns:
  - Topic
  - Observed public conflict or gap
  - Why it matters
  - Current best read
  - Next diligence step
  rows:
  - - Membership price
    - $499 on pricing page versus $365 in Function365 and the Nov 2025 announcement
    - Affects demand modeling and realized-revenue assumptions
    - Treat $499 as stale surface until sales materials confirm otherwise
    - Request current checkout flow, renewal notices, and cohort pricing by join date
  - - Scale metric denominator
    - 75M+ results delivered versus 50M+ lab tests since 2023
    - Different units can distort growth narratives
    - Assume both are directional, not directly comparable
    - Request member-level testing frequency and cumulative completed panels
  - - Current paid members
    - Public snapshots stop at nearly 100k paying members in Nov 2024 and use vaguer later phrasing
    - Core coverage metric for later chapters remains soft
    - Use 2024 figure as verified floor only
    - Request current active paying members and churn by vintage
  - - Headcount
    - No public headcount disclosed in official materials
    - Blocks operating-cost and execution-capacity analysis
    - Leave null in cover metrics
    - Request org chart, leadership span, and total FTE by function
  - - Board / governance
    - Public materials list executives and advisors but not a formal board roster
    - Limits governance diligence and investor-control analysis
    - Board composition remains partially disclosed at best
    - Request board observer rights, committees, and independence
  - - Revenue / ARR
    - No audited or management-published revenue metric found
    - Prevents clean valuation benchmarking
    - Treat Function as private-undisclosed
    - Request audited revenue bridge and renewal metrics
  notes: Table separates factual conflicts from outright missing data so later chapters can reuse the uncertainty correctly.
