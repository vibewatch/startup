- id: leadership-governance
  title: Founders, executives, and governance concentration
  body: Function’s public leadership story is founder-led and personality-driven. The official about page identifies five co-founders—Jonathan Swerdlin, Mark Hyman, Pranitha Patil, Seth Weisfeld, and Dan Swerdlin—and later materials add non-founder operators such as Ziad Sultan, Neil Shah, and Dan Sodickson as the company pushes into product, operations, and imaging-heavy medical intelligence. This depth is helpful, but public governance disclosure remains thin relative to the valuation. The chapter could verify executive biographies and role titles, but not a full board roster, voting control map, or committee structure. Mark Hyman’s reach is strategically valuable because he is both co-founder and major distribution asset, yet that also heightens key-person exposure and raises the risk that brand momentum is over-attributed to durable product economics. The gap between detailed executive biographies and sparse board disclosure is one of the clearest diligence asymmetries in the chapter.
