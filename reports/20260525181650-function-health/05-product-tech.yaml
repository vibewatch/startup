  - - Longitudinal dashboard and result record
    - Consumer member
    - Live / mature
    - Secure result storage, sharing, downloads, action-plan context
    - No public API or documented export format beyond user-facing download/share
  - - Private AI Chat (beta)
    - Consumer member
    - Beta
    - Personalized explanations grounded in results, history, and connected-device data
    - No public accuracy metrics or clinician-override statistics
  - - Protocols (beta)
    - Consumer member
    - Beta
    - Evidence-based plans across nutrition, supplements, sleep, fitness, and stress
    - No public outcome or adherence data
  - - Upload Health Records / connected-data context
    - Consumer member
    - Newly launched
    - Past labs and visit notes feed the AI and dashboard context
    - No public detail on supported formats, reconciliation logic, or error handling
  - - Advanced imaging via Ezra
    - Consumer member
    - Live / partner-dependent
    - MRI/CT expands Function beyond blood testing into structural screening
    - Requires separate Ezra account, partner facility availability, and separate pricing
  - - Galleri and specialized add-ons
    - Consumer member
    - Live / partner-dependent
    - Cancer detection and specialized panels widen scope beyond core labs
    - Prescription-only or separately priced pathways add friction and compliance dependencies
  notes: Maturity labels reflect public launch language as of 2026-05-25. “Beta” means Function itself uses beta or early-access language; “partner-dependent” means the member journey depends on external ordering, facility, or fulfillment infrastructure.
