- id: TE001
  title: Product Module / Asset Matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Core annual lab membership
    - Consumer member
    - Live / mature
    - 160+ annual labs, clinician review, repeat cadence, Quest access
