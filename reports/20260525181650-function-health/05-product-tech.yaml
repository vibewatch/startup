- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / component
  - Role
  - Key dependency
  - Risk
  rows:
  - - Member intake + health history
    - Captures context that tailors interpretation and recommendations
    - Function app / web experience
    - Data quality depends on user disclosure and form design
  - - Quest specimen collection network
    - Executes most core blood draws and follow-up tests
    - Quest Diagnostics locations and scheduling capacity
    - Partner-site constraints can feel like product friction
  - - Function MD review layer
    - Orders labs, reviews every result, writes reports, escalates urgent findings
    - Licensed clinicians and legal ordering framework
    - Clinical staffing and turnaround times are operational bottlenecks
  - - Dashboard / results record
    - Stores results, sharing, downloads, and longitudinal visualization
    - Function consumer product and identity/access controls
    - No public API or external-developer interface surfaced
  - - Private AI Chat + Protocols
    - Transforms records into personalized explanation and action suggestions
    - MI Lab prompts, clinical curation, connected-data ingestion
    - Beta maturity and model-accuracy risk
  - - Ezra imaging workflow
    - Handles MRI/CT purchase, scheduling, image review, and report delivery
    - Ezra account system and partner imaging facilities
    - Separate account and report environment fragment user experience
  - - Galleri ordering path
    - Adds multi-cancer screening outside core membership
    - Healthcare-provider or telemedicine prescription flow
    - Prescription-only pathway adds cost, compliance, and conversion friction
  notes: Architecture is reconstructed from official workflow, FAQ, privacy, and announcement materials rather than from a published technical diagram. The table focuses on operational components visible in the public user journey.
