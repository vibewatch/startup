- id: imaging-and-partner-dependent-operations
  title: Imaging and Partner-Dependent Operations
  body: 'The biggest change to Function’s product scope is the Ezra acquisition, which turns advanced imaging from a neighboring prestige category into an internalized but still partner-dependent module. Public guidance says a Function member who wants imaging must first complete lab testing, then create an Ezra account, then schedule at an imaging partner facility. Results come back after medical review in Ezra’s environment, with Function explicitly saying full account-level unification is planned for the future rather than fully complete today. The same pattern appears in Galleri: the test is available through the Function ecosystem, but it remains prescription-only and dependent on healthcare-provider or telemedicine ordering, with separate pricing economics. In other words, Function has increased breadth by adding more modules, but those modules remain operationally distributed across multiple entities and facility networks. That matters for diligence because the real product is not
    just code; it is partner management, clinical review, turnaround times, facility coverage, and the friction of moving members between Quest, Ezra, telemedicine ordering, and back into Function’s dashboard. Function’s upside is being the coordinating layer. Its risk is that any weak link in those dependencies will feel like a product failure to the member even if the root cause is external.'
