- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User job / problem
  - Current workflow
  - Function solution
  - Measurable or practical benefit
  - Limitation
  rows:
  - - Establish a broad preventive baseline
    - Book PCP or order scattered specialty labs
    - One membership bundles a large initial panel and guided follow-up
    - Far more breadth than a typical annual physical according to Function’s positioning
    - Requires annual membership commitment and off-insurance spend
  - - Interpret abnormal or borderline biomarker results
    - Search the internet or wait for ad hoc PCP follow-up
    - Clinician-reviewed results plus next-step guidance in dashboard
    - Faster explanation and written context around flagged markers
    - Clinical depth and escalation metrics are not publicly benchmarked
  - - Track whether interventions are working
    - Repeat a few targeted labs inconsistently
    - Retest every 3–6 months with included midyear follow-up labs
    - Longitudinal pattern detection rather than one-time snapshot
    - Requires repeat adherence and continued membership
  - - Add structural screening beyond bloodwork
    - Book a separate imaging provider and manage outside records
    - Function member flow routes into Ezra MRI/CT offering
    - Broader early-detection scope in same commercial ecosystem
    - Still requires separate Ezra account, facility, and payment flow
  - - Get personalized explanation using records and devices
    - Use generic chatbot or disconnected wellness app
    - Private AI Chat and Protocols use results, history, and connected-device data
    - More contextual guidance than a generic search prompt
    - Feature is still beta and not outcome-validated publicly
  - - Buy direct-pay testing without a PCP
    - Use Quest Health or Labcorp OnDemand transactionally
    - Function wraps direct-pay testing in a recurring guided program
    - Adds clinician interpretation and high-breadth preventive framing
    - Incumbent labs remain simpler for one-off use cases
  notes: Benefits are practical workflow benefits derived from official product copy and comparison against direct-pay incumbents. Public sources did not disclose quantitative retention, protocol adherence, or clinician-response SLAs.
