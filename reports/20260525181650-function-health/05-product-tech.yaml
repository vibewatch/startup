- id: TE004
  title: Trust / Quality / Compliance Table
  columns:
  - Control / policy / quality marker
  - Status
  - Scope
  - Gap / diligence ask
  rows:
  - - 'FAQ claim: encrypted and protected to HIPAA standards'
    - Publicly stated
    - Member results and health data in Function environment
    - Need independent assurance of implementation detail, not just policy language
  - - Results access limited to member, lab partners, clinicians, essential admins
    - Publicly stated
    - Core result handling and legally required disclosures
    - Need audit-log, role-based-access, and subcontractor detail
  - - Data deletion on request
    - Publicly stated
    - Consumer-managed deletion right
    - Clarify retention exceptions for legally required medical or transaction records
  - - Main Privacy Policy
    - Live
    - General personal-information processing across Function services
    - Policy says HIPAA does not apply to all processed data; diligence should map which flows are exempt
  - - Consumer Health Data Privacy Policy
    - Live
    - US state-law consumer health data regime
    - Clarify state-by-state triggers and vendor obligations
  - - Separate Ezra privacy surface
    - Live
    - Imaging and affiliate processing flows
    - Multi-entity governance may confuse users about controller/processor boundaries
  - - SOC2 / HITRUST / public uptime SLA
    - Not surfaced in reviewed public materials
    - Trust assurance and reliability posture
    - Request current certification status, recent penetration tests, and disaster-recovery documentation
  notes: This table summarizes public trust controls and missing assurance artifacts observed on 2026-05-25. Absence in public review does not prove absence in operation, but it remains a diligence gap.
