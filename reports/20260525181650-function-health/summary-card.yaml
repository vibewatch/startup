summary:
  headline: >-
    Function Health is building a compelling consumer preventive-health platform with real demand and product breadth,
    but the last disclosed $2.5 billion price already assumes stronger retention, margin, and data-layer economics than
    public evidence currently proves.
  overallScore: 6.8
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
