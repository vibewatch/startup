- id: switching-costs-moats-and-risks
  title: Switching Costs, Moats, and Competitive Risks
  body: 'Function’s switching costs are moderate at best. Its own product pages stress downloadable results, uploaded prior records, and connected-health context; rival products like Levels, InsideTracker, and SiPhox also advertise past-bloodwork imports or third-party data syncing. That makes multi-homing easy: a user can keep Function for broad labs, add Levels for glucose, use SiPhox for at-home recurrence, or buy a one-off MRI. The durable edges are therefore operational rather than purely software-based: Quest draw-network access, clinician review, and now imaging adjacency through Ezra. Those edges matter, but they are not invulnerable. Incumbent labs can defend on trust and provider workflows, software-first apps can compress headline price, and prestige clinics can continue to siphon the highest-intent prevention buyers. The most serious adverse evidence is not a peer’s marketing page but the underlying skepticism around the category: RSNA warns whole-body MRI screening can create
    incidentalomas and extra downstream utilization, BMJ argues broad DTC testing can do more harm than good when sold to broad populations, STAT highlights privacy and insurability concerns for consumer health-test data, and KFF documents ongoing reliability issues in AI health interpretation. Those critiques do not eliminate demand, but they constrain how far Function’s model can scale without clearer clinical-outcome proof and cleaner pricing/governance answers.'
