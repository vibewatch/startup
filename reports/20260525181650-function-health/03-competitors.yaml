company:
  name: Function Health
chapter:
  number: 3
  title: Competitors
  summary: 'Function Health competes across four substitute sets: direct biomarker memberships (InsideTracker, Superpower, SiPhox, Lifeforce, Everlywell), direct-pay lab incumbents (Quest Health, Labcorp OnDemand), imaging/prestige prevention clinics (Fountain Life, Neko, Ezra), and software-first adjacencies like Levels or the standard annual physical. The strongest official differentiation is modality breadth — 160+ lab tests, clinician review, Quest network access, and MRI/CT/Galleri adjacency — while the biggest competitive pressure comes from cheaper software-first rivals, trusted incumbent lab brands, and adverse concerns around DTC testing, AI interpretation, and whole-body imaging false positives.'
sections:
- id: landscape-overview
  title: Competitive Landscape and Job-to-be-Done
  body: 'Function is not competing against one clean peer set. The customer can solve the same preventive-health job through at least four routes: a comprehensive biomarker membership, a direct-pay incumbent lab, a prestige scan clinic, or the status-quo annual physical with PCP-ordered labs. Function’s current live pricing page places it in the middle of those routes: materially broader than a standard checkup, more clinically mediated than AI-only wellness apps, and less expensive than MRI-first concierge programs. Direct peers such as InsideTracker, Superpower, SiPhox, Everlywell, and Lifeforce all sell some mix of bloodwork, dashboarding, and recommendations, but they tend to emphasize either lower entry price, at-home convenience, tracker integration, or hormone-optimization positioning. Incumbents Quest and Labcorp attack from trust, nationwide access, and à-la-carte flexibility. Imaging clinics such as Fountain Life, Neko, and Ezra promise earlier structural detection but at a higher
    incremental price or a separate workflow. That means Function’s buyer is effectively choosing how much breadth, clinical mediation, and friction they are willing to buy.'
