- id: direct-biomarker-peers
  title: Direct Biomarker Membership Peers
  body: 'Among direct peers, Superpower is the clearest low-price attack: official pages market 100+ biomarkers and a $199 annual entry point, which comparison sources frame as the strongest value option. InsideTracker is more modular and athlete/data-optimizer oriented: its public store shows a $149 membership plus separate blood-test bundles, with DNA and fitness-tracker data syncing as a core wedge. SiPhox pushes even further toward at-home and wearable-native use, centering a needle-free panel, third-party uploads, device integrations, and its Sai AI assistant. Everlywell sits lower on clinical ambition: it offers flexible at-home kits and membership credits, but its own product catalog emphasizes that most tests are for wellness monitoring or educational use rather than diagnosis or treatment. Lifeforce remains relevant as a higher-touch longevity-medicine alternative, but publicly accessible official pricing remains less transparent than Function, Superpower, or InsideTracker, so most
    current detail comes from review and comparison sources rather than a clean official rate card. Relative to this set, Function’s strongest differentiation remains its default breadth and clinician-reviewed interpretation, while its biggest weakness is that cheaper and simpler software-first or at-home options can cherry-pick parts of the workflow.'
