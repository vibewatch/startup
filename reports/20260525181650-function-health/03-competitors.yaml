- id: TP004
  title: Moat Durability / Competitive Risk Register
  columns:
  - Moat claim
  - Main threat
  - Severity
  - Current public evidence
  - Mitigation / diligence ask
  rows:
  - - Quest-powered national draw access
    - Quest and Labcorp can sell direct-pay testing too
    - High
    - Quest Health and Labcorp OnDemand both market no-doctor-visit ordering or provider-mediated direct-pay workflows
    - Test whether Function gets better scheduling economics, conversion, or clinician follow-through than incumbents
  - - Broadest default lab + imaging bundle among direct peers
    - Software-first rivals undercut on price and simplicity
    - High
    - Superpower advertises $199/year entry, while Levels and SiPhox let users buy only the software or at-home piece they want
    - Measure retention and attach rates for add-ons, not just top-of-funnel membership growth
  - - Clinician-reviewed interpretation
    - Adverse evidence questions DTC testing utility and overuse
    - Critical
    - BMJ and Stat both warn broad consumer testing can create unnecessary use, privacy risk, and weak follow-up pathways
    - Request clinical-outcome data, urgent-escalation metrics, and false-positive follow-up rates
  - - Imaging adjacency through Ezra
    - Whole-body imaging can produce incidental findings and false positives
    - High
    - RSNA says low-yield whole-body MRI in asymptomatic populations can drive incidentalomas and downstream utilization
    - Demand modality-specific sensitivity/specificity, follow-up rates, and reimbursement/appeal playbooks
  - - Growing AI layer and connected-data moat
    - Consumer AI health tools still face accuracy and safety skepticism
    - Medium
    - KFF documents inconsistent or unsafe advice in consumer-facing AI health offerings
    - Keep AI clearly assistive, monitor hallucination rates, and disclose clinician-vs-model boundaries
  - - Longitudinal health record accumulation
    - Switching costs stay moderate because results can be exported and competitors also ingest past data
    - Medium
    - Function, Levels, InsideTracker, and SiPhox all market uploads or connected-data flows
    - Validate net retention and multi-homing behavior rather than assuming software lock-in
  notes: Severity is an analyst judgment about competitive durability and category risk as of the run date. It prioritizes diligence, not quantified downside.
