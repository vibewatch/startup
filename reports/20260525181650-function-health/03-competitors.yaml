- id: incumbents-adjacencies-and-substitutes
  title: Incumbents, Imaging Adjacencies, and Status-Quo Substitutes
  body: 'Quest Health and Labcorp OnDemand are the incumbent substitutes a skeptical buyer can choose instead of Function. Both public sites show that direct-pay testing can already be bought without a conventional doctor visit, with results delivered online and provider involvement available within the workflow. Those incumbents therefore reduce any moat based purely on lab access. Where Function still differentiates is the curated, longitudinal layer: one account, repeated panels, interpretation, and upsell paths into imaging and cancer screening. Imaging/prestige clinics are a different threat. Fountain Life sells AI-guided diagnostics and higher-touch concierge care, while Neko offers a fast non-MRI body scan and immediate consultation at a much lower ticket than MRI clinics. Ezra, now acquired into Function’s orbit, shows what the imaging-first adjacency used to look like as a separate product: scans priced separately, separate facility scheduling, and a structural-screening value proposition
    rather than a recurring lab relationship. The status quo annual physical remains the cheapest substitute because it is insurance-mediated and familiar, but Function’s own positioning — and review sources comparing the category — frame that PCP route as much narrower on biomarker breadth and less consistent on longitudinal follow-up.'
