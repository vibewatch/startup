companyProfile:
  summary: Function Health is a private Austin-based preventive-health platform founded in 2022 and launched in beta in April 2023. It sells a self-pay membership that bundles twice-yearly lab testing, clinician-reviewed interpretation, longitudinal tracking, and newer AI features such as Private AI Chat and Protocols; members can also buy MRI, CT, and Galleri cancer-screening add-ons after the Ezra acquisition expanded the product set. The company has shown unusually strong consumer demand signals for a young health platform—50,000 customers and a 200,000-person waitlist at the June 2024 Series A checkpoint, then nearly 100,000 paying members and a 400,000-plus waitlist in the November 2024 expansion release—while raising about $350 million to $351 million in total and reaching a $2.5 billion valuation in the November 2025 Series B.
  founders:
    - name: Jonathan Swerdlin
      role: Co-Founder & Chief Executive Officer
      background: Serial healthcare entrepreneur and investor; public company materials describe him as building Function partly around his own experience managing a lifelong neurological condition.
      claimRefs:
        - CO015
        - CO016
    - name: Mark Hyman, M.D.
      role: Co-Founder & Chief Medical Officer
      background: Former Cleveland Clinic physician and bestselling health author who publicly frames Function as a way to scale proactive, preventive medicine beyond a traditional clinic visit.
      claimRefs:
        - CO015
        - CO017
    - name: Pranitha Patil
      role: Co-Founder & Chief Business Officer
      background: Function says she left Harvard graduate school early to build the company and previously worked in Accenture Health Strategy.
      claimRefs:
        - CO015
        - CO018
    - name: Seth Weisfeld
      role: Co-Founder & Chief Design Officer
      background: Product and UX leader focused on zero-to-one category creation, positioned by Function as the architect of a more consumer-native health-data experience.
      claimRefs:
        - CO015
        - CO019
    - name: Dan Swerdlin
      role: Co-Founder & General Counsel
      background: Stanford Law-trained attorney whose role gives Function in-house legal leadership as it expands across privacy-sensitive healthcare workflows.
      claimRefs:
        - CO015
        - CO020
