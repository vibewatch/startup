artifact: customers
slug: function-health
runDate: '2026-05-25'
company:
  name: Function Health
chapter:
  number: 6
  title: Customers
  summary: Function’s strongest customer evidence is a rapidly growing self-pay membership base that scaled from beta in April
    2023 to roughly 50,000 paying members in mid-2024, nearly 100,000 by late 2024, and an analyst-estimated 200,000+ members
    by May 2025. Public proof is strongest on top-of-funnel demand, user experience, and premium-partner distribution through
    Equinox; it is weakest on enterprise case studies, channel mix, customer concentration, and retention disclosure. Quest
    dependence, anecdotal review quality, and missing NRR or churn data remain the key customer-durability gaps.
sections:
- id: SU-profile
  title: Who buys, uses, and pays
  body: 'Function’s clearest public customer is the self-pay adult who wants more testing than a standard annual physical
    offers. Official copy leans hard into proactive prevention, “100 healthy years,” and a premium but still consumer-friendly
    promise: 160+ biomarkers, a repeat-testing cadence, clinician review, and app-based tracking without using insurance.
    Independent review coverage reinforces that positioning by describing Function as best suited to people paying out of
    pocket for broader testing or frustrated by routine primary-care panels. The buyer, user, and payer are usually the same
    person in the core D2C motion, but the company is also beginning to surface other payer structures. Its FAQ explicitly
    markets Function for Work to employees and dependents 18+, while its privacy policy contemplates employer or enterprise
    eligibility flows. That means Function is no longer just a pure personal-longevity subscription; it is starting to look
    like a health-data product that can also be distributed as a workplace or partner benefit.'
  claimRefs:
  - CU001
  - CU003
  - CU005
  - CU007
  - CU008
  - CU026
  - CU028
  - CU033
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: SU-adoption
  title: Adoption trajectory and engagement depth
  body: The public adoption story is strong on top-of-funnel growth. Multiple 2024 outlets reported that Function had reached
    roughly 50,000 paying members with a 200,000-plus waitlist about a year after entering beta in April 2023. By late 2024,
    company-promoted coverage said the paid base was nearing 100,000 and the waitlist had exceeded 400,000. Sacra then estimated
    that members surpassed 200,000 by May 2025, while site copy in 2026 says the platform has delivered more than 75 million
    results to members. Taken together, those signals suggest genuine scale and repeated use, not just curiosity. But the
    quality of the funnel is still partly ambiguous. The waitlist is useful evidence of awareness, yet one detailed reviewer
    said it can be bypassed and functions partly as a growth tactic. Public evidence is therefore strongest on demand generation
    and weakest on audited conversion, activation, and retention rates across the funnel.
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU025
  - CU030
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: SU-proof
  title: Customer proof and channel evidence
  body: Named customer proof is much thinner than the adoption-count story. The most concrete public partner proof is Equinox,
    which now offers a first-year Function membership at $249 and integrates testing into performance and women’s-health programming.
    That is meaningful because it validates Function as a channel product, not only a direct-response web subscription. Beyond
    Equinox, the best public proof comes from attributable individual users. Long-form customer reviews describe repeat testing,
    clinician notes, Quest-based draws, and HSA-funded use. App Store reviews show some household expansion and renewal behavior.
    Sacra adds one more important clue by saying that insurance brokerage Higginbotham put Function into its employee well-being
    portfolio. Even so, the public record still does not look like a mature enterprise case-study library. The strongest proof
    is anecdotal but detailed; the weakest area is public disclosure of named employer deployments, production outcomes, and
    channel economics.
  claimRefs:
  - CU015
  - CU016
  - CU017
  - CU018
  - CU022
  - CU023
  - CU034
  - CU035
  - CU037
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: SU-retention
  title: Retention proxies and missing durability data
  body: 'Function has enough public usage evidence to suggest some users return, but not enough to underwrite durable retention
    at scale. The best visible proxy is user behavior: one reviewer reported four rounds of testing over nearly two years,
    and an App Store reviewer described renewing for a spouse and children. Trustpilot’s archived March 2026 snapshot showed
    a sizable corpus—768 reviews at 4.3 out of 5—which implies a real installed base and some satisfaction with the service.
    Those same review surfaces also show why proxy evidence is not enough. Function does not publicly disclose NRR, GRR, annual
    renewal rate, second-draw completion, or cohort churn. Review platforms are also self-selected and tend to overweight
    highly motivated users. The result is a classic diligence split: the product appears engaging for health-literate enthusiasts,
    but the public record is still too thin to prove mainstream durability or renewals by channel.'
  claimRefs:
  - CU019
  - CU021
  - CU022
  - CU036
  - CU038
  - CU039
  tableRefs:
  - TU004
- id: SU-risks
  title: Concentration, expansion, and customer-friction risks
  body: The main commercial risk is not a lack of visible demand; it is the mismatch between visible demand and limited public
    evidence on where durable revenue actually comes from. Function now has several expansion surfaces—direct D2C, Equinox,
    early employer-benefit language, brokerage distribution, and imaging upsell after the Ezra deal. That is strategically
    attractive because it could lower CAC and increase wallet share per member. It also creates dependency and concentration
    questions the public record cannot answer. Quest remains a critical lab-fulfillment bottleneck, and review evidence shows
    that scheduling failures can become Function problems in the eyes of members. Publicly disclosed top-customer exposure,
    broker concentration, and partner-channel renewal remain absent. Management has broadened the product promise into a more
    comprehensive preventive-health platform, but investors still need proof that this broader motion converts into durable,
    channel-diversified economics rather than just a larger and louder top of funnel.
  claimRefs:
  - CU020
  - CU024
  - CU029
  - CU031
  - CU032
  - CU035
  - CU037
  - CU038
