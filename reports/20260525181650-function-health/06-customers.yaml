  rows:
  - - Self-pay health-conscious adults
    - Buyer=user=payer
    - Baseline testing, prevention, longevity tracking
    - Core membership flow and reviews describe direct self-pay purchase
    - Largest disclosed public funnel; recurring annual membership
    - Income mix and geographic split undisclosed
  - - Performance / longevity consumers
    - Buyer=user=payer
    - Training, hormone, recovery, and optimization use cases
    - Equinox integration and performance language on official pages
    - Higher upsell potential into premium channels and imaging
    - No public conversion rate from partner channel
  - - Employer-benefit users
    - Employer or broker buyer; employee/dependent user; employer payer/subsidizer
    - Benefit-style access through Function for Work or brokerage bundles
    - FAQ and Sacra mention employees, dependents, and brokerage portfolio distribution
    - Could reduce CAC and expand covered lives faster than pure D2C
    - No disclosed enterprise account count or revenue mix
  - - Premium fitness members via Equinox
    - Partner channel buyer subsidy; member user; member or partner payer
    - Lab-driven performance and women’s health programs
    - Public $249 offer and EQX ARC integration
    - High-affinity wellness audience and premium brand halo
    - Unknown retention or attach rate after subsidized first year
  - - Imaging add-on members
    - Existing member buyer; member user; self-pay payer
    - MRI, CT, and deeper preventive workups
    - Official announcement and Ezra launch materials
    - Raises wallet share per member and broadens product scope
    - No disclosed take rate or repeat-imaging behavior
