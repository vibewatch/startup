  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited revenue, gross margin, and cash-burn disclosures for Function Health.
    whyItMatters: The current valuation call relies on analyst estimates and pricing/member proxies rather than reported financial statements.
    diligencePath: Request audited financials or wait for materially fuller disclosure before underwriting a buy decision.
    relatedQuestionRefs:
    - QV012
    - QV015
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: renewal-retention
    missingEvidence: Member renewal, churn, and cohort retention by acquisition channel.
    whyItMatters: Retention determines whether Function deserves a platform multiple or a much lower premium testing multiple.
    diligencePath: Request cohort retention and reactivation data segmented by direct consumer, partner, and imaging users.
    relatedQuestionRefs:
    - QV021
    - QV022
    - QV023
    - QV028
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table-preferences
    missingEvidence: Preference stack, liquidation waterfall, and any secondary or special rights attached to the Series B and prior rounds.
    whyItMatters: Equity downside and future-round dilution cannot be judged responsibly without knowing the capital structure.
    diligencePath: Request board-approved cap-table summary and term-sheet economics from counsel or the data room.
    relatedQuestionRefs:
    - QV015
    - QV024
    - QV026
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: channel-economics
    missingEvidence: Publicly disclosed partner-channel conversion, subsidy, attach, and retention economics.
    whyItMatters: The bull case depends on B2B2C leverage, but the public evidence only proves channel existence, not quality.
    diligencePath: Request partner cohort economics for Equinox and any employer or insurer channels.
    relatedQuestionRefs:
    - QV021
    - QV028
    relatedTableRefs:
    - TV006
  - type: conflicting-data
    severity: material
    topic: pricing-consistency
    missingEvidence: A reconciled statement of realized ARPU, renewal pricing, and how legacy $499 references coexist with official $365 marketing.
    whyItMatters: Small ARPU differences materially change Function's implied revenue multiple and fair-value range.
    diligencePath: Ask management for current realized ARPU, active paid memberships, and the proportion of members on legacy vs current pricing.
