- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Pillar
  - Thesis argument
  - Anti-thesis / what would change the view
  rows:
  - - Growth
    - Function scaled from a $53M Series A story to a $2.5B Series B story in roughly 17 months and has sizable member/data accumulation.
    - If renewal, attach, or retention are weak, that growth could prove marketing-led rather than durable.
  - - Pricing
    - Lower pricing can widen access and accelerate membership growth.
    - The $499-to-$365 cut may indicate that the category is already pricing like a commodity.
  - - Platform optionality
    - Imaging, AI, and partner channels can expand Function beyond simple lab panels.
    - Optionality is only valuable if it improves retention, ARPU, or enterprise willingness to pay.
  - - Comparable support
    - High-growth diagnostics peers show premium multiples are possible.
    - Even the richest public comp in this set trades below Function's implied revenue multiple.
  - - Sector precedent
    - Preventive health remains strategically interesting.
    - 23andMe's 2025 collapse shows consumer-health data stories can de-rate quickly when economics fail.
  notes: The anti-thesis is not that demand disappears, but that the current price already assumes Function escapes the commoditization seen elsewhere in consumer health.
