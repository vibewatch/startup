callouts:
- calloutType: recommendation
  title: 'Recommendation: Track'
  body: Function Health looks strategically interesting and could still grow into its valuation, but the current public evidence does not make the last disclosed $2.5 billion price look cheap. The better stance is to track execution and wait for harder proof on retention, margins, and partner economics.
