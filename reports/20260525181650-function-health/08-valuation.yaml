- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Audited revenue and gross margin
    - Income statement detail beyond analyst estimates
    - Core multiple math is fragile without audited financials
    - Request company financials or wait for fuller disclosure
  - - Renewal and retention cohorts
    - Cohort renewals by join period and channel
    - Determines whether Function is a platform or a novelty purchase
    - Request member-cohort deck or board materials
  - - Cap table and preference stack
    - Preference terms and any secondary structure
    - Critical for downside and future-round dilution analysis
    - Request term sheets or counsel summary
  - - Post-Series B member count and attach rates
    - Updated members, MRI attach, CT attach, and partner mix
    - Needed to test bull/base/bear assumptions with current data
    - Request operating KPI dashboard
  - - Partner channel economics
    - Equinox and other partner conversion, CAC, and retention performance
    - Determines whether B2B2C meaningfully changes the model
    - Request partner cohort and subsidy economics
  notes: Items 1-4 are material to moving from track to buy. Without them, the right stance remains price-disciplined and evidence-sensitive.
  claimRefs:
  - CV040
  - CV042
