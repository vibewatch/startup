- id: comparable-analysis
  title: Comparable Set and Relative Valuation
  body: 'No public company is a perfect comp for Function Health, so the best approach is a triangulated set. Quest Diagnostics and Labcorp provide a diagnostics-infrastructure floor, showing what large-scale testing businesses are worth once the category is mature and heavily operationalized. Natera and Exact Sciences represent higher-growth diagnostics businesses with stronger software, oncology, or data-layer narratives. Prenetics is the closest small-cap reminder that consumer-adjacent diagnostics can still be low scale and volatile even when the category story sounds compelling.


    On that basis, Function''s last disclosed round price looks rich. Quest and Labcorp trade around 1.5x to 2.0x revenue, Exact Sciences around 6x, Prenetics around 4x, and Natera around 12.7x. Function''s implied ~25x on Sacra''s revenue estimate is above the entire set. The company may deserve a premium for growth, data density, and optionality from imaging and AI, but the current premium already assumes a large portion of the upside narrative. That is why the comp exercise supports a stretched valuation stance rather than a fair or attractive one.'
