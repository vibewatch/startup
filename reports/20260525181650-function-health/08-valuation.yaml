company:
  name: Function Health
chapter:
  number: 8
  title: Valuation
  summary: 'Function Health has clear strategic momentum, but the last disclosed $2.5 billion valuation already demands a strong execution outcome relative to the limited public financial evidence. Official and analyst sources support a membership-fee revenue proxy around $73 million to $100 million, which implies roughly 25x revenue at the last round—well above the 1.5x to 12.7x market-cap-to-revenue range of the public diagnostics and consumer-health comparable set used here. The recommendation is track with medium confidence, high risk, and a stretched valuation stance: upside exists if Function proves retention, imaging attach, and a defensible data layer, but current evidence does not yet justify calling the entry price attractive.'
sections:
- id: thesis-recommendation
  title: Investment Thesis, Anti-Thesis, and Recommendation
  body: 'Function Health clearly has real momentum. The company has reached a disclosed $2.5 billion valuation, added imaging through Ezra, lowered pricing to widen access, and accumulated a large enough member base to support a data-platform narrative rather than a pure one-off testing story. That makes the bullish case understandable: if Function can turn repeated testing, imaging, AI features, and partner distribution into a sticky health operating layer, its current price could eventually look rational.


    The anti-thesis is valuation discipline. Public evidence still does not show audited revenue, gross margin, renewal cohorts, or preference-stack details. What it does show is that Function''s likely revenue base is still modest relative to the valuation. Sacra''s $100 million run-rate estimate and supportable membership-fee proxies place the company at a multiple meaningfully above every public comparable in this set. Skeptical coverage also points to commoditization risk, thin partner-driven economics, and an increasingly crowded field built on the same laboratory infrastructure. That leaves the right present-tense call as track: attractive company, interesting platform story, but a price that already discounts a material amount of future success.'
