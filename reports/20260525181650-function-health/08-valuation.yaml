- id: scenarios-and-diligence
  title: Bull, Base, Bear Scenarios and Diligence Triggers
  body: 'Three scenarios bound the current decision. In the bear case, the category commoditizes, Function keeps cutting price, renewal is weaker than expected, and regulators or clinical skeptics push back on broad-based testing narratives. In that world, valuation converges toward the lower half of the public-growth diagnostics comp set and the company is worth well below the last round. In the base case, Function sustains growth, expands imaging attach, and proves enough retention to justify a premium multiple on a materially larger revenue base. That still only gets the current valuation into roughly fair territory. In the bull case, Function becomes a genuine consumer health platform with durable data advantages, partner leverage, and improving economics; then the current price can work and possibly look cheap in hindsight.


    The diligence agenda therefore matters as much as the company narrative. Investors still need clearer evidence on audited revenue, margin, renewal, partner mix, and preference overhang. 23andMe''s 2025 collapse is a useful cautionary precedent: consumer-health data businesses can look strategic right up to the moment financing, governance, or economics fail. Until Function proves the metrics that separate a great story from a resilient business, the right stance is disciplined curiosity rather than aggressive underwriting.'
