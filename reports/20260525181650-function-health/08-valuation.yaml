- calloutType: risk
  title: The anti-thesis is about economics, not attention
  body: The main risk is not that consumers stop caring about prevention. It is that Function becomes one of many brands packaging the same laboratory infrastructure while competitors cut price, employers demand proof, and regulators scrutinize the clinical value of broad DTC testing.
