  rows:
  - - Bull
    - Requires sustained execution and proof that imaging/AI raise lifetime value
    - Member growth remains strong, imaging attaches meaningfully, and the data layer supports premium retention
    - 2.5-4.0
    - Premium growth multiple on a materially larger revenue base than public evidence currently supports
    - Hard to justify without better disclosure and clear competitive separation
  - - Base
    - Most plausible with current evidence
    - Function scales into a larger recurring business but still looks like a premium diagnostics layer rather than a monopoly platform
    - 1.5-2.5
    - 10x-15x on roughly $150M-$200M revenue-equivalent run rate
    - Current round already sits near the top of this case
  - - Bear
    - Material if pricing pressure and commoditization intensify
    - Retention weakens, pricing continues to fall, and the market treats Function more like a crowded testing reseller
    - 0.8-1.5
    - Compression toward lower public-growth diagnostics multiples
    - Large gap down from the last disclosed round
  notes: Ranges are evidence-constrained scenario frames, not a DCF. They use only supportable public pricing, member, and comparable data plus explicit assumptions.
