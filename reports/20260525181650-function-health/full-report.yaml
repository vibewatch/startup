      - CV036
      - CV037
      - CV038
      - CV039
      - CV042
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: A scorecard view of Function Health's valuation-readiness as of the current public evidence set.
    data:
      items:
        - label: Market tailwind
          value: 4
          note: Preventive diagnostics demand is real and still expanding.
        - label: Growth proof
          value: 4
          note: Funding, member growth, and testing scale all support momentum.
        - label: Differentiation
          value: 3
          note: Imaging and data layer help, but the core stack still depends on incumbent labs.
        - label: Financial transparency
          value: 1
          note: Audited revenue, renewal, and margin disclosures are still missing.
        - label: Relative valuation support
          value: 1
          note: Current private price sits above the full public comp set.
        - label: Downside resilience
          value: 2
          note: Sector precedent and commoditization concerns remain material.
    approximationNotes: >-
      Scorecard uses a 1-5 scale where 5 is strongest. It is an analytic aid, not a mechanical investment decision
      model.
    claimRefs:
      - CV007
      - CV009
      - CV025
      - CV027
      - CV040
      - CV042
