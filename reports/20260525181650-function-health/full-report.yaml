  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer Workflow and Product Modules
        blocks:
          - type: paragraph
            body: >-
              Function’s public workflow is built like an orchestrated service stack rather than a single app. Members
              start by sharing health history, then book a first lab appointment through Function, usually at a Quest
              Diagnostics location. The live membership proposition is a broad recurring lab package with clinician
              interpretation, repeat testing, and optional add-ons rather than one-off diagnostic episodes. Product
              pages emphasize that every result is reviewed with context from the member’s health history and returned
              in a secure dashboard, with food, supplement, and next-step guidance. The base product is not just
              “bloodwork”; it is a longitudinal operating rhythm: initial panel, clinician interpretation, action plan,
              retesting every few months, and selective upsell into advanced add-ons. Those add-ons include Galleri,
              MRI/CT, extended panels, and brain or mold-related pathways, which means the product map is already
              modular even though the buying surface is a single annual membership. That modularity broadens the
              platform’s scope but also means value realization depends on how effectively Function moves a member
              across modules, not just on how many biomarkers are in the starter panel.
