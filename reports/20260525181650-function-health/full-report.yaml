            body: >-
              The public adoption story is strong on top-of-funnel growth. Multiple 2024 outlets reported that Function
              had reached roughly 50,000 paying members with a 200,000-plus waitlist about a year after entering beta in
              April 2023. By late 2024, company-promoted coverage said the paid base was nearing 100,000 and the
              waitlist had exceeded 400,000. Sacra then estimated that members surpassed 200,000 by May 2025, while site
              copy in 2026 says the platform has delivered more than 75 million results to members. Taken together,
              those signals suggest genuine scale and repeated use, not just curiosity. But the quality of the funnel is
              still partly ambiguous. The waitlist is useful evidence of awareness, yet one detailed reviewer said it
              can be bypassed and functions partly as a growth tactic. Public evidence is therefore strongest on demand
