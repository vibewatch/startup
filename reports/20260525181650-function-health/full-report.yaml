      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: Track'
            body: >-
              Function Health looks strategically interesting and could still grow into its valuation, but the current
              public evidence does not make the last disclosed $2.5 billion price look cheap. The better stance is to
              track execution and wait for harder proof on retention, margins, and partner economics.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV039
              - CV040
              - CV042
          - type: callout
            title: The anti-thesis is about economics, not attention
            body: >-
              The main risk is not that consumers stop caring about prevention. It is that Function becomes one of many
              brands packaging the same laboratory infrastructure while competitors cut price, employers demand proof,
              and regulators scrutinize the clinical value of broad DTC testing.
            calloutType: risk
            claimRefs:
