      - number: '5.2'
        title: Data, AI, and Operating Architecture
        blocks:
          - type: paragraph
            body: >-
              The company’s current product narrative is shifting from “labs plus clinicians” toward “labs plus a data
              layer.” Function’s November 2025 announcement introduced the Medical Intelligence Lab as the coordinating
              concept: a clinician-led system meant to unify labs, imaging, wearables, IoT devices, and medical records
              rather than rely on generic chatbot behavior. The immediate member-facing expressions of that strategy are
              Private AI Chat, Protocols, and Upload Health Records. Those features matter because they change the
              software layer from passive result storage into active explanation and personalized recommendation. They
              also create the beginnings of data lock-in by combining lab results, stated health history, past records,
              and connected-device context in one vault. At the same time, the public surface still looks like a closed
              consumer product rather than an open health platform: no public API, no developer docs, and no ecosystem
              tooling were surfaced in this review. The strongest operational takeaway is therefore not that Function
              has published a deep technical architecture, but that it is assembling a consumer-facing intelligence
              layer on top of partner-run testing, clinician review, and uploaded records. That makes the AI layer
              differentiating, but still immature and clearly subordinate to the service workflow underneath it.
