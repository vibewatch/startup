  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Anti-Thesis, and Recommendation
        blocks:
          - type: paragraph
            body: >-
              Function Health clearly has real momentum. The company has reached a disclosed $2.5 billion valuation,
              added imaging through Ezra, lowered pricing to widen access, and accumulated a large enough member base to
              support a data-platform narrative rather than a pure one-off testing story. That makes the bullish case
              understandable: if Function can turn repeated testing, imaging, AI features, and partner distribution into
              a sticky health operating layer, its current price could eventually look rational.


              The anti-thesis is valuation discipline. Public evidence still does not show audited revenue, gross
              margin, renewal cohorts, or preference-stack details. What it does show is that Function's likely revenue
              base is still modest relative to the valuation. Sacra's $100 million run-rate estimate and supportable
              membership-fee proxies place the company at a multiple meaningfully above every public comparable in this
              set. Skeptical coverage also points to commoditization risk, thin partner-driven economics, and an
              increasingly crowded field built on the same laboratory infrastructure. That leaves the right
              present-tense call as track: attractive company, interesting platform story, but a price that already
              discounts a material amount of future success.
            claimRefs:
              - CV001
              - CV004
