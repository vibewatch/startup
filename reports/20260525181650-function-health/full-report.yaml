      - number: '5.4'
        title: Privacy, Compliance, and Product Risks
        blocks:
          - type: paragraph
            body: >-
              Function’s public privacy posture is stronger than many consumer wellness apps on messaging, but it is
              still materially different from a traditional provider or hospital context. The FAQ says Function data are
              encrypted and protected to HIPAA standards, never sold, and only accessible to members, lab partners,
              clinicians, and essential administrators, with deletion available on request. The formal privacy policy is
              more nuanced: it says HIPAA does not apply to all personal information the company processes, even if
              Function or affiliates may act as business associates in some contexts, and it explicitly references
              linked third-party devices, services, and a separate Ezra privacy policy. A companion Consumer Health Data
              policy exists to satisfy US state-law obligations, which indicates a multi-regime compliance burden.
              Publicly reviewed materials did not surface SOC2, HITRUST, uptime, or disaster-recovery documentation, so
              assurance remains largely policy-based. That matters because category-level adverse evidence is real. STAT
              highlights privacy and insurability concerns for DTC health-test startups, BMJ questions broad DTC testing
              utility, RSNA questions low-yield whole-body MRI screening, and KFF documents continued safety concerns
              around AI health chatbots. Function can respond by keeping clinicians in the loop, but its trust posture
              is only as strong as the weakest combination of privacy governance, partner coordination, and explanatory
              accuracy.
