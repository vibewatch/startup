              helpful, but public governance disclosure remains thin relative to the valuation. The chapter could verify
              executive biographies and role titles, but not a full board roster, voting control map, or committee
              structure. Mark Hyman’s reach is strategically valuable because he is both co-founder and major
              distribution asset, yet that also heightens key-person exposure and raises the risk that brand momentum is
              over-attributed to durable product economics. The gap between detailed executive biographies and sparse
              board disclosure is one of the clearest diligence asymmetries in the chapter.
