        title: Clinical-utility, operational, and partner risk
        blocks:
          - type: paragraph
            body: >-
              The next risk layer is whether broad preventive testing and imaging generate more signal than noise once
              Function is used at scale. Independent medical and laboratory bodies are consistently cautious on this
              front. BMJ, ADLM, ASCLS, IFCC, ACOG, and the ACR all raise versions of the same concern: broad
              direct-access testing can create questionable utility, overdiagnosis, confirmatory-workup burden, and
              ambiguous clinical responsibility. Function’s MRI expansion intensifies that concern because ACR
              explicitly says there is insufficient evidence to recommend total-body MRI screening for asymptomatic
              people. The operational path amplifies the same issue. Function’s customer promise runs through Quest,
              contracted clinicians, and Ezra’s network, so failures or delays in those layers quickly become Function’s
              problem. Even where mitigations exist—encryption, clinician review, and large partner footprints—the
              public record remains thin on SLAs, false-positive rates, audit depth, and adverse-event handling.
