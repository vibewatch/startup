        title: Regulatory, legal, and privacy risk
        blocks:
          - type: paragraph
            body: >-
              Function’s legal posture is the chapter’s top-ranked risk area because the company sits between pure
              direct-to-consumer commerce and regulated clinical workflows. FDA and CLIA materials make clear that
              specimen testing, consumer-facing diagnostics, and laboratory-developed tests are governed by an active
              and evolving rule set. Function’s own terms then add another wrinkle by stating that using the service
              does not itself create a patient relationship with a medical provider or laboratory. Privacy risk is
              equally material. Function says data is encrypted and not sold to advertisers or data brokers, but its own
              privacy policy also says HIPAA does not apply to all personal information it processes. That matters even
              more because the company contemplates enterprise or employer eligibility flows and maintains a dedicated
              consumer-health-data policy to address state laws. STAT’s 2026 reporting sharpens the adverse view: DTC
              health-test data can spill into insurance, mortgage, employment, or law-enforcement concern zones even
              when the company’s stated intent is benign.
