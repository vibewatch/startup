  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Adjacent Categories
        blocks:
          - type: paragraph
            body: >-
              Function Health should be bounded first as a self-pay preventive-diagnostics membership, not as a general
              healthcare company. The current product sells access to recurring laboratory testing without insurance
              dependence, physician replacement, or broad reimbursement. The core included spend is therefore direct
              consumer payment for multi-biomarker blood testing, clinician review of results, and the software layer
              that stores trends and turns results into guidance. That is much closer to direct-to-consumer laboratory
              testing and consumer preventive diagnostics than to concierge medicine, health insurance, or full-stack
              primary care.


              The market boundary gets wider only when Function's imaging products are added. Function's acquisition of
              Ezra makes MRI and CT credible adjacencies, but those products have different pricing, throughput,
              regulation, and care-path implications than bloodwork. They should expand the narrative around preventive
              diagnostics without being treated as identical to the subscription core. The practical substitute set also
              matters. Status-quo alternatives remain the primary-care annual physical, self-directed testing through
              Quest or Labcorp channels, and a wide set of competing wellness or longevity panels. That means Function
              is best understood as an experience-and-interpretation layer riding on incumbent diagnostic infrastructure
              rather than a laboratory owner building a new lab network from scratch.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM020
