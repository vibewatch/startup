      - number: '1.3'
        title: Funding history, scale claims, and partner dependence
        blocks:
          - type: paragraph
            body: >-
              Function’s financing and scale narrative accelerated quickly. Independent June 2024 reporting pegged the
              Series A at $53 million with roughly 50,000 paying members and a 200,000-person waitlist. By November
              2024, the company’s own expansion release raised that to nearly 100,000 paying members and a waitlist
              above 400,000 while also highlighting Equinox and Thrive Global partnerships. The November 2025 Series B
              then reset the story around $298 million of fresh capital at a $2.5 billion valuation, with broad venture
              and celebrity participation. The May 2025 Ezra acquisition mattered strategically because it extended
              Function from lab access into imaging and made third-party clinical infrastructure even more central to
              the offering. The partner map therefore matters as much as the investor list: Quest, Ezra, Equinox, and
              other external relationships are not optional embellishments but core pieces of how Function reaches
              users, fulfills services, and justifies platform breadth.
