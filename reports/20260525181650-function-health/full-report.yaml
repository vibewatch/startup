chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and what is actually being sold
        blocks:
          - type: paragraph
            body: >-
              Function Health is a consumer-facing diagnostics membership business built around longitudinal lab testing
              rather than a conventional primary-care relationship. Public materials support the basic identity facts:
              third-party coverage dates the company to 2022, independent reporting places beta launch in April 2023,
              and official FAQ plus terms pages place the company in Austin, Texas with nationwide availability across
              48 states. The product promise is broader than a one-off blood panel. Function markets 160+ lab tests
              annually, a Quest-based national draw network, clinician review, a persistent dashboard, and optional
              add-ons such as Galleri and imaging. The important underwriting nuance is legal structure: Function’s own
              terms emphasize that it is a healthcare technology company, not the laboratory or medical provider. That
              means the member proposition is a packaged coordination and interpretation layer wrapped around
              third-party fulfillment, not vertically owned clinical delivery.
