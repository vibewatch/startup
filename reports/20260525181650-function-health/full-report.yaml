      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Renewal or retention disappoints
        - Evidence shows members do not renew after the first year at healthy rates
        - Undermines the platform and recurring-revenue narrative
        - Re-cut valuation to a one-off testing model
      - - Further price cuts without better attach or retention
        - Another broad price cut not offset by higher conversion or ARPU
        - Signals commoditization instead of scale economics
        - Move toward bear-case framework
      - - Margin evidence is weak
        - Public or diligence materials show lab/clinician costs absorb most revenue
        - Confirms Forbes-style thin-margin anti-thesis
        - Do not underwrite a premium multiple
      - - Regulatory or clinical backlash escalates
        - New restrictions, lawsuits, or evidence that overtesting harms dominate benefits
        - Weakens category legitimacy and raises CAC/churn risk
        - Reduce conviction and required entry price
      - - Capital-markets pressure
        - Down round, punitive structure, or evidence of heavy preference overhang
        - Shows the private market no longer supports current narrative
        - Pause or exit pending recapitalization clarity
