  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: >-
      Function’s clearest public customer journey runs from self-pay signup to Quest draw, clinician interpretation,
      longitudinal tracking, and optional upsell into imaging or partner channels.
    data:
      items:
        - stage: Discovery
          actors:
            - Self-pay consumer
            - Health-conscious adult
            - Performance seeker
          touchpoints:
            - Waitlist / referral
            - Press coverage
            - Equinox offer
          emotion: Curious about deeper testing than a standard physical
          label: Discovery
        - stage: Signup
          actors:
            - Member
          touchpoints:
            - Annual membership purchase
            - HSA/FSA checkout
            - Gift / renewal flow
          emotion: Comparing price versus traditional self-pay labs
          label: Signup
        - stage: Testing
          actors:
            - Member
            - Quest staff
          touchpoints:
            - Quest appointment
            - Blood draw
            - Twice-yearly cadence
          emotion: Convenient when scheduling works; frustrating when partner operations fail
          label: Testing
        - stage: Interpretation
          actors:
            - Member
            - Clinician
          touchpoints:
            - Clinician notes
            - AI chat
            - Protocols
          emotion: High perceived value when results feel actionable
          label: Interpretation
        - stage: Expansion
          actors:
            - Returning member
            - Household / partner-channel user
          touchpoints:
            - Repeat testing
            - Family renewal
            - MRI / CT upsell
          emotion: Sticky for motivated users, uncertain for mainstream cohorts
          label: Expansion
