  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Pricing surfaces and what they do—and do not—tell us about revenue
        blocks:
          - type: paragraph
            body: >-
              Function has unusually visible product pricing for a private company, but that visibility is not the same
              as revenue transparency. The core membership still appears at $499 on the main pricing page while
              Function365 and the November 2025 announcement say the plan is now $365 per year. Imaging and
              cancer-screening add-ons are also public: member MRI discounts, CT menu prices, and Galleri’s official
              list price are all fetchable. That is helpful for product-packaging analysis and for bounding the
              company’s ARPU opportunity, but it does not reveal realized price, discount intensity, renewal mix, attach
              rates, or contribution margin. The right interpretation is therefore narrow. Function is transparent about
              menu construction and broad affordability claims, but not about durable net revenue realization today.
              Investors should treat list pricing as a top-of-funnel demand signal, not as a proxy for recognized annual
              revenue per member.
