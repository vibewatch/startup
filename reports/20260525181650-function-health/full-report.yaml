            body: >-
              Function’s public leadership story is founder-led and personality-driven. The official about page
              identifies five co-founders—Jonathan Swerdlin, Mark Hyman, Pranitha Patil, Seth Weisfeld, and Dan
              Swerdlin—and later materials add non-founder operators such as Ziad Sultan, Neil Shah, and Dan Sodickson
