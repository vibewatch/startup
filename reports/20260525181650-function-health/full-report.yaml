  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Five-layer view of Function’s publicly visible product architecture from data capture through trust controls. The
      stack shows a consumer software layer sitting on top of partner-run testing and clinician review.
    data:
      layers:
        - label: Data Capture
          detail: Where health information enters the product
          items:
            - Health-history intake
            - Quest blood draws
            - Advanced MRI / CT scans via Ezra
            - Galleri ordering path
            - Uploaded prior records
            - Connected wearables / devices
        - label: Clinical Interpretation
          detail: Human review and escalation layer
          items:
            - Function MD ordering
            - Clinician review of every result
            - Written reports
            - Urgent-result phone escalation
        - label: Member Experience
          detail: Consumer-facing surfaces that package the service
          items:
            - Function dashboard
            - Secure result history
            - Download / share results
            - Quest scheduling entry points
        - label: Intelligence Layer
          detail: New product layer introduced in 2025
          items:
            - Medical Intelligence Lab
            - Private AI Chat (beta)
            - Protocols (beta)
            - Upload Health Records
        - label: Trust and Governance
          detail: Policies and partner surfaces supporting compliance
          items:
            - Privacy Policy
            - Consumer Health Data policy
            - Role-based result access
            - Deletion workflow
            - Separate Ezra privacy surface
    claimRefs:
      - CE004
      - CE007
      - CE009
      - CE010
      - CE018
      - CE019
      - CE022
      - CE040
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      End-to-end member workflow from onboarding through repeat testing and optional add-ons. The flow emphasizes where
      partner systems enter the experience.
    data:
      nodes:
        - id: n1
          label: Join + share health history
          description: Member signs up and provides baseline context
        - id: n2
          label: Schedule core lab visit
          description: Function routes member into Quest or concierge draw workflow
        - id: n3
          label: Sample collection + lab processing
          description: Bloodwork completed and processed through partner infrastructure
        - id: n4
          label: Clinician review + written report
          description: MD team orders, reviews, and escalates urgent findings
        - id: n5
          label: Dashboard + action plan
          description: Results stored, shared, and interpreted inside Function experience
        - id: n6
          label: Repeat testing cadence
          description: Follow-up panels every few months and on-demand retests
        - id: n7
          label: Optional add-ons
          description: Galleri, MRI/CT, and specialized panels branch from the core workflow
