      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and What Would Break the Thesis
        blocks:
          - type: paragraph
            body: >-
              The category benefits from durable demand tailwinds. Consumers increasingly want convenient digital
              experiences, longitudinal data, and prevention-oriented care that feels more responsive than the
              traditional annual physical. Chronic-disease anxiety, dissatisfaction with reactive care, and the spread
              of telehealth-style digital delivery all help explain why direct ordering and subscription-style testing
              are gaining traction. Function's own price cut, imaging expansion, and partner activity suggest management
              believes the category can widen from niche curiosity into a recurring health habit.


              But the adoption case is not unqualified. BMJ and Penn LDI both emphasize that direct-to-consumer testing
              can create real harm when marketing outruns evidence, when abnormal results do not receive follow-up, or
              when privacy expectations are weaker than consumers assume. Syndicated market research also flags tighter
              regulation, data-governance requirements, and compliance costs as genuine drags on smaller entrants. On
              the commercial side, employers want outcomes proof, not just novelty, and incumbent labs can absorb volume
              while capturing much of the economics. The most credible adverse scenario is therefore not that preventive
              diagnostics disappears, but that the market becomes crowded, more regulated, and less profitable for
              intermediary brands that do not prove durable differentiation beyond packaging incumbent laboratory
              capacity.
