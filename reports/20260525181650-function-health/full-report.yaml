        title: Retention proxies and missing durability data
        blocks:
          - type: paragraph
            body: >-
              Function has enough public usage evidence to suggest some users return, but not enough to underwrite
              durable retention at scale. The best visible proxy is user behavior: one reviewer reported four rounds of
              testing over nearly two years, and an App Store reviewer described renewing for a spouse and children.
              Trustpilot’s archived March 2026 snapshot showed a sizable corpus—768 reviews at 4.3 out of 5—which
              implies a real installed base and some satisfaction with the service. Those same review surfaces also show
              why proxy evidence is not enough. Function does not publicly disclose NRR, GRR, annual renewal rate,
              second-draw completion, or cohort churn. Review platforms are also self-selected and tend to overweight
              highly motivated users. The result is a classic diligence split: the product appears engaging for
              health-literate enthusiasts, but the public record is still too thin to prove mainstream durability or
              renewals by channel.
