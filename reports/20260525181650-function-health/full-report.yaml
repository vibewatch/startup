              - CR043
      - number: '7.5'
        title: Mitigations, monitorable triggers, and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              Function is not unmitigated. It has raised large amounts of capital, lowered headline pricing to widen
              access, published detailed privacy and terms language, and built a credible network story around Quest,
              Equinox, and Ezra. Those are real mitigations. But they are not enough to offset the fact that several
              decisive underwriting variables remain private. The company does not publicly disclose cohort renewal,
              partner SLAs, independent audit depth, or clinical follow-up burden from broad screening. That means the
              right diligence stance is conditional: Function can remain investable if it proves that self-pay renewals
              hold up, privacy controls withstand scrutiny, and partner operations scale without visible quality
              degradation. If instead the company faces a privacy controversy, regulatory tightening, partner outages,
              or a downshift in renewal economics, the thesis changes quickly because the current valuation already
              assumes Function can execute through those constraints while continuing to broaden the platform.
            claimRefs:
              - CR009
