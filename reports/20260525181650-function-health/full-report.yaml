  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: Bear, base, and bull ranges show that the current disclosed round price already requires a favorable outcome.
    data:
      items:
        - label: Bear case
          low: 0.8
          mid: 1.1
          high: 1.5
          unit: USD B
          note: Commoditization, weaker retention, and comp compression.
        - label: Base case
          low: 1.5
          mid: 2
          high: 2.5
          unit: USD B
          note: Continued growth plus premium, but not exceptional, economics.
        - label: Bull case
          low: 2.5
          mid: 3.2
          high: 4
          unit: USD B
          note: Function proves it is a platform, not a premium testing reseller.
        - label: Last disclosed round
          low: 2.5
          mid: 2.5
          high: 2.5
          unit: USD B
          note: Current public anchor.
    approximationNotes: >-
      Ranges are deliberately wide because audited financial disclosure is not public. They are meant to guide
      discipline, not imply false precision.
    claimRefs:
