companyProfile:
  summary: >-
    Function Health is a private Austin-based preventive-health platform founded in 2022 and launched in beta in April
    2023. It sells a self-pay membership that bundles twice-yearly lab testing, clinician-reviewed interpretation,
    longitudinal tracking, and newer AI features such as Private AI Chat and Protocols; members can also buy MRI, CT,
    and Galleri cancer-screening add-ons after the Ezra acquisition expanded the product set. The company has shown
    unusually strong consumer demand signals for a young health platform—50,000 customers and a 200,000-person waitlist
    at the June 2024 Series A checkpoint, then nearly 100,000 paying members and a 400,000-plus waitlist in the November
    2024 expansion release—while raising about $350 million to $351 million in total and reaching a $2.5 billion
    valuation in the November 2025 Series B.
