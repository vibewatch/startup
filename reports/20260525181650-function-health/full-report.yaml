        title: Exhibits
        blocks:
          - type: callout
            title: The market is attractive, but only after narrowing the boundary
            body: >-
              Function benefits from a real category tailwind in consumer preventive diagnostics, but the investable
              opportunity is much narrower than headline global TAM figures suggest. The practical market is premium
              self-pay testing layered on top of incumbent laboratory networks, with partner channels still emerging
              rather than already dominant.
            calloutType: insight
            claimRefs:
              - CM015
              - CM016
              - CM035
              - CM036
          - type: callout
            title: Overtesting, privacy, and incumbent economics are the real structural constraints
            body: >-
              The sharpest downside is not lack of demand. It is the combination of regulatory scrutiny, weak privacy
              norms across DTC testing, and the possibility that Quest/Labcorp capture most category economics while
              consumer-facing brands compete away price and differentiation.
