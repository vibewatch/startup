        title: Capital adequacy is headline-positive but still impossible to underwrite tightly
        blocks:
          - type: paragraph
            body: >-
              The capital story sounds strong on the surface. Function raised $298 million in late 2025, total disclosed
              funding is around $350 million, and the company broadened its product set through Ezra rather than
              remaining a single-product lab subscription. But the chapter’s underwriting limit remains hard: no public
              revenue, ARR, gross margin, retention, CAC, burn, cash balance, or debt schedule. The most skeptical
              public analysis argues the valuation could be very rich relative to plausible revenue, while privacy and
              marketing-litigation sources show that compliance risk and trust risk can rise alongside growth. Those
              factors do not prove the business is weak; they simply prevent the analyst from converting a strong
              consumer narrative into a robust financial model. They also mean even the large fundraise cannot be
              translated into months of runway with any defensible precision. The correct financial verdict is therefore
              cautious rather than dismissive: Function may have meaningful optionality, but its revenue quality, margin
              durability, and runway are still private claims, not publicly corroborated facts.
