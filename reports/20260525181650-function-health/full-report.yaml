            body: >-
              The main commercial risk is not a lack of visible demand; it is the mismatch between visible demand and
              limited public evidence on where durable revenue actually comes from. Function now has several expansion
              surfaces—direct D2C, Equinox, early employer-benefit language, brokerage distribution, and imaging upsell
