      - number: '4.2'
        title: 'GTM shape: DTC core with partner and employer-adjacent edges'
        blocks:
          - type: paragraph
            body: >-
              The public evidence suggests Function is not a pure one-channel DTC subscription business even though the
              consumer story is the dominant front-end narrative. The homepage, pricing, and FAQ pages are unmistakably
              consumer oriented, but the Equinox campaign, Thrive Global benefit language, and privacy-policy references
              to enterprise customers and gyms indicate a more mixed channel structure. That matters because channel mix
              affects CAC, pricing discipline, and renewal behavior. A member acquired through an Equinox discount or
              employer-adjacent benefit can behave very differently from a cash-pay member sourced through brand or
              creator media. The legal structure also reinforces this point: Function positions itself as the software
              and service layer that facilitates access to third-party labs and providers. In other words, the company
              appears to monetize a bundle of access, orchestration, and interpretation across multiple acquisition
              channels, not simply an app subscription sold one member at a time.
