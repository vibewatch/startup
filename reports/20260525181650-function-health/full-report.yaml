  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Most material risks and why they matter
        blocks:
          - type: paragraph
            body: >-
              Function’s risk stack is unusual because it combines the speed and narrative of a consumer-health startup
              with the compliance surface of laboratory testing, clinical interpretation, sensitive health data, and now
              imaging. The most material risks are not simple demand risk; Function clearly has demand. Instead, the
              biggest risks cluster around regulatory ambiguity, privacy exposure, partner concentration, and the
              possibility that controversial screening categories create more follow-up burden than durable health
              value. The company’s own materials promise strong security and clinician review, but public third-party
              materials also show that the workflow depends heavily on outside labs, contracted doctors, and an
              expanding imaging network. That creates a real possibility that Function scales its commercial front end
              faster than it scales the clinical, legal, and operational controls behind it. Investors should therefore
              rank the company less like a normal wellness subscription and more like a health-data and diagnostics
              orchestration layer with unusually broad downside pathways.
