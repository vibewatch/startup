      - number: '8.2'
        title: Financing History, Pricing Ambiguity, and What Can Be Underwritten
        blocks:
          - type: paragraph
            body: >-
              Public financing evidence is directionally strong but still incomplete. The disclosed sequence goes from a
              $53 million Series A in mid-2024 to a $298 million Series B in late 2025, with total capital raised
              reported around $350 million. That is enough to show investor enthusiasm and a meaningful valuation
              step-up, but not enough to fully underwrite downside because the public record does not disclose detailed
              cap-table or preference economics. Pricing evidence is also more ambiguous than headline coverage
              suggests. Official November 2025 materials say the membership is now $365 annually, yet the live pricing
              page still contains a legacy $499 annual-charge reference.


              That ambiguity matters because valuation math is highly sensitive to realized ARPU. Even using optimistic
              but evidence-constrained figures, public revenue support remains thin. Sacra's $100 million run-rate
              estimate broadly matches what 200,000 members would imply at legacy pricing and sits above what the same
              member count would imply at the newer $365 price. In other words, the public record is good enough to say
              Function is growing quickly, but not precise enough to justify false precision in valuation. Price, not
              company quality alone, should drive the current call.
            claimRefs:
              - CV001
