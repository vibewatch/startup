      - number: '2.3'
        title: Buyer, User, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              The current commercial model is straightforward: the individual member is the buyer, user, and primary
              payer. Function markets annual pricing directly to adults, emphasizes that insurance is unnecessary, and
              asks members to schedule phlebotomy at Quest locations after digital signup. That creates a consumer
              budget decision, not a reimbursed medical-claims workflow. Within that broad consumer lane, the likely
              early adopters are health-conscious, digitally fluent, higher-income users who are motivated by
              prevention, performance, fertility, metabolic optimization, or longevity. Public partner evidence
              reinforces that skew. Equinox is Function's clearest outside channel, and it appears as a premium
              distribution and subsidy mechanism rather than mass-market employer adoption.


              Employers and partners still matter, but today they are better treated as an emerging channel than as the
              budget owner of record. Business Group on Health shows employers in 2026 are under cost pressure and
              scrutinizing vendors for measurable value, while Mordor lists employer wellness subsidies as a market
              driver but not the dominant one. That is consistent with the public Function evidence: partnerships can
              reduce acquisition cost and add credibility, but public data do not yet show employer coverage driving the
              majority of revenue. Meanwhile Quest and Labcorp matter in two ways at once: they are the infrastructure
              that makes Function convenient, and they are large incumbents with their own consumer-facing capabilities
              that cap how much value any app-layer intermediary can keep.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM019
              - CM021
