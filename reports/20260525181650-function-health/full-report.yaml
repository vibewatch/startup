      - number: '7.4'
        title: Financial, model, and execution risk
        blocks:
          - type: paragraph
            body: >-
              Function’s financial and model risk is tightly linked to execution. TechCrunch reported a $298 million
              Series B at a $2.5 billion valuation, while Sacra estimated roughly a $100 million run rate in early 2025.
              That is strong growth, but it still leaves little room for operational disappointment if self-pay renewals
              soften or channel economics fail to mature. The company has already expanded from lab testing into AI
              chat, protocols, wearables, records integration, and MRI or CT access. That strategy could create a
              powerful longitudinal-health platform, but it also means the business is taking on new regulatory,
              operational, and reputational surface area before public evidence on retention or clinical outcomes is
              mature. The self-pay model is another pressure point: Function explicitly positions itself outside
              insurance. That makes the product cleaner to buy, but also more exposed to discretionary-spend pullbacks
              and scrutiny if customers decide the service is informative but not essential enough to renew.
            claimRefs:
              - CR006
              - CR007
