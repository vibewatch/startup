    title: Customers
    sections:
      - number: '6.1'
        title: Who buys, uses, and pays
        blocks:
          - type: paragraph
            body: >-
              Function’s clearest public customer is the self-pay adult who wants more testing than a standard annual
              physical offers. Official copy leans hard into proactive prevention, “100 healthy years,” and a premium
              but still consumer-friendly promise: 160+ biomarkers, a repeat-testing cadence, clinician review, and
              app-based tracking without using insurance. Independent review coverage reinforces that positioning by
              describing Function as best suited to people paying out of pocket for broader testing or frustrated by
              routine primary-care panels. The buyer, user, and payer are usually the same person in the core D2C
              motion, but the company is also beginning to surface other payer structures. Its FAQ explicitly markets
              Function for Work to employees and dependents 18+, while its privacy policy contemplates employer or
              enterprise eligibility flows. That means Function is no longer just a pure personal-longevity
              subscription; it is starting to look like a health-data product that can also be distributed as a
              workplace or partner benefit.
