  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: partner-slas
    missingEvidence: Quest, clinician, and imaging-partner contract terms, SLAs, redundancy plans, and incident history.
    whyItMatters: Partner concentration is one of the clearest operational risks, but public materials do not disclose enough
      to measure resilience.
    diligencePath: Request partner agreements, SLA dashboards, outage / cancellation logs, and documented fallback options.
    relatedQuestionRefs:
    - QR022
    - QR030
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: security-assurance
    missingEvidence: Independent security audits, penetration tests, SOC reports, and detailed incident-response metrics.
    whyItMatters: The public posture is strong, but investment conviction on privacy and breach risk requires more than policy
      language.
    diligencePath: Request the latest security audit package, pen-test remediation log, and incident response tabletop results.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: self-pay-unit-economics
    missingEvidence: Cohort renewal, second-draw completion, channel-specific CAC, payback, and cancellation reasons.
    whyItMatters: A $2.5B valuation on a self-pay health product is hard to sustain without durable renewal economics.
    diligencePath: Request cohort-level revenue retention and renewal by acquisition channel, plus pricing-test history.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: material
    topic: clinical-outcomes
    missingEvidence: False-positive rates, incidental-finding follow-up burden, adverse-event logs, and external clinical-review
      outcomes for MRI or MCED upsells.
    whyItMatters: Clinical-utility controversy is central to the risk stack, but public outcome data is thin.
    diligencePath: Request follow-up referral rates, confirmatory-testing yields, and any internal review of clinically unnecessary
      workups.
