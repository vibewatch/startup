- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Regulatory tightening on DTC / LDT workflows
    - New FDA or state enforcement directly affecting provider-ordered consumer testing
    - Any enforcement, warning letter, or abrupt product redesign requirement
    - Re-underwrite timeline, compliance spend, and category viability
  - - Privacy / data-use controversy
    - Public incident, legal challenge, or material policy change
    - Breached records, enforcement notice, or adverse press on insurer / employer exposure
    - Pause conviction until root-cause, liability, and partner impact are clear
  - - Quest or imaging-partner disruption
    - Sustained scheduling failures or partner outage
    - Material rise in cancellations, test delays, or partner churn
    - Downgrade growth assumptions and pressure-test redundancy plan
  - - Self-pay renewal weakness
    - Cohort renewal data misses management targets
    - Meaningful drop in year-one renewal or second-draw completion
    - Cut revenue durability assumptions and valuation multiple
  - - Valuation / financing mismatch
    - Next financing below expectations or delayed despite growth claims
    - Down round, flat round, or major bridge financing
    - Re-rate capital-dependency risk and exit path
  - - Clinical-utility backlash
    - Incidental-finding or false-positive follow-up burden becomes visible
    - Professional-society criticism escalates into payer, regulator, or employer resistance
    - Reduce confidence in MRI / screening upsell economics
  notes: These kill criteria convert the abstract risk stack into events that should change underwriting, not just narrative
    tone.
