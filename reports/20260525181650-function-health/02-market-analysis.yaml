- id: sizing-lenses
  title: Sizing the Opportunity with Multiple Lenses
  body: 'The broad category is clearly real, but any one-size market claim is misleading. Syndicated estimates span a very wide range because vendors disagree on whether the category includes only consumer-ordered diagnostic panels, or also genetics, at-home kits, hormonal wellness, microbiome services, telehealth bundles, and other digital-health adjacencies. Mordor''s 2026 estimate of about $4 billion is the narrowest current lens in this evidence set, while The Business Research Company reaches $7.5 billion for 2026 and Expert Market Research publishes a much broader 2025 value above $15 billion. Technavio avoids a direct present-value number and instead frames the opportunity as more than $28 billion of incremental expansion by 2030.


    The useful conclusion is not to average those estimates mechanically. Function''s own service design narrows the realistic serviceable market below all broad global TAM figures. The company requires adult users, uses Quest draw centers instead of universal home collection, sells a premium recurring membership, and is strongest today in digitally engaged self-pay cohorts. North America is the right geographic anchor because multiple reports treat it as the leading current region and because Function''s current network, partners, and user experience are all US-centric. For diligence, the investable sizing lens is a constrained North American premium self-pay diagnostics niche nested within a much broader, noisier global DTC testing market.'
