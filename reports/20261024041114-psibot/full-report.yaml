  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              PsiBot's customer-facing proposition is an intelligence layer for physical work rather than a single robot
              SKU. Its official English site describes Psi SynRobot as a robot for logistics and industry, SynGlove Air
              as a real-machine teleoperation glove for data collection and control, and multiple demonstrations
              spanning optical-module inspection, vacuuming, box packing, knot tying, object tossing, and Lego assembly.
              That surface maps to a workflow in which a buyer supplies a workcell and task, the platform acquires
              demonstrations or prompts, and the robot executes manipulation policies. The site also identifies
              partners, but does not disclose contract terms, deployment counts, uptime, or realized customer outcomes.
              A third-party model listing describes Psi R1 as a model rather than a physical robot and places it across
              industry, logistics, retail, and end-customer applications. Those are addressable use cases, not proof of
              commercial scale. The most defensible near-term wedge is therefore constrained logistics or industrial
              work where task boundaries and measurable cycle-time benefits can be specified before general-purpose
              autonomy is underwritten.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
