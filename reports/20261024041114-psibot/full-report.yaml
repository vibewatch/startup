  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buying logic
        blocks:
          - type: paragraph
            body: >-
              PsiBot's relevant market is the software-and-data intelligence layer for robots used in logistics,
              manufacturing, retail, and other physical workflows, not the entire robot hardware stack. Its own site
              positions SynRobot for logistics, retail, and industry and describes a foundation-model-powered robot,
              while the refreshed funding coverage says the company develops VLA models rather than building complete
              robots. The included spend is therefore model licensing, deployment integration, teleoperation and data
              tooling, and potentially dexterous-hand or reference-system revenue; robot bodies, warehouse conveyors,
              generic industrial arms, and unrelated consumer robotics are excluded. Buyers are likely manufacturers,
              logistics operators, robot OEMs, and strategic component companies; users are operators and engineers,
              while the payer is usually an operations, automation, or innovation budget owner. The practical substitute
              is fixed automation or human labor in a constrained workflow, not another abstract AI model.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Multiple sizing lenses and evidence limits
        blocks:
          - type: paragraph
            body: >-
              The available estimates establish a set of adjacent market lenses rather than a clean PsiBot SAM. GMI
              estimates the global humanoid-robot market at $10.9 billion in 2026 and $192.7 billion in 2035, with a
              37.6% 2026–2035 CAGR; Grand View Research estimates global warehouse automation at $27.4 billion in 2026
              and $59.5 billion in 2030, with an 18.7% 2024–2030 CAGR; and Fortune Business Insights estimates warehouse
              robotics at $7.35 billion in 2026 and $25.41 billion in 2034, with a 16.80% CAGR. These are not additive:
              warehouse robotics is nested within warehouse automation, while humanoid robots include hardware and
              applications beyond PsiBot's software layer. The 36Kr Research Institute gives a broader China
              embodied-intelligence estimate of RMB915 billion in 2025 and says it may exceed RMB1 trillion in 2026, but
              its boundary includes a broad ecosystem. IDC's deployment lens forecasts more than 510,000 humanoid
              shipments by 2030. The defensible conclusion is substantial adjacency growth, not a precise SAM or SOM.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
      - number: '2.3'
        title: Drivers, constraints, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Adoption is pulled by labor scarcity, e-commerce throughput, flexible manufacturing, and strategic
              industrial policy. The market sources repeatedly identify logistics, picking, packing, material handling,
              and manufacturing as early use cases where layouts and task flows can be bounded. IDC reports that more
              than 80% of users plan to deploy humanoids in palletizing, handling, picking, and machine tending over the
              next three years, while warehouse-market sources emphasize e-commerce and workforce shortages.
              China-specific policy is an additional demand catalyst: the 15th Five-Year Plan coverage describes
              embodied intelligence as a named future-industry priority and calls for training grounds, model evolution,
              core-component work, and humanoid deployment. Constraints remain material: published market analysis notes
              high initial investment, maintenance, safety, integration, and limited adaptation to unpredictable
              situations. PsiBot's industrial investors may accelerate pilots, but no assigned source verifies paid
              production deployments, pricing, recurring revenue, or unit economics.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM010
              - CM012
              - CM013
              - CM015
      - number: '2.4'
        title: What the market means for underwriting
        blocks:
          - type: paragraph
            body: >-
              The market supports a focused beachhead thesis rather than an unrestricted platform assumption. PsiBot's
              logistics and advanced-manufacturing targets align with the most repeatable early workflows, and its
              reported dual-system model architecture and human operation data program are directionally relevant to
              deployment learning. However, the evidence is primarily market-level or company-originated and does not
              establish that PsiBot captures a defined share of any reported market. The most decision-relevant
              diligence is a bottom-up pipeline by workflow, robot OEM, geography, and deployment stage; contracted
              pricing and take rates; conversion from pilot to production; task-success, uptime, and integration
              metrics; and the share of demand that strategic investors can actually route. Until those data are
              available, the valuation should be stress-tested against a serviceable intelligence-layer market below the
              headline robotics estimates.
            claimRefs:
              - CM002
              - CM004
              - CM013
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The market is real, but the addressable slice is unproven
            body: >-
              The strongest evidence supports fast growth in adjacent robotics and automation markets; it does not yet
              isolate PsiBot's software revenue pool or prove conversion from industrial sponsorship to recurring
              commercial demand.
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM015
          - type: callout
            title: Deployment economics are the gating variable
            body: >-
              Market growth forecasts do not resolve whether robots can achieve predictable uptime, integration cost,
              safety performance, and payback in customer workflows.
            calloutType: risk
            claimRefs:
              - CM011
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive boundary is wider than humanoid vendors
        blocks:
          - type: paragraph
            body: >-
              PsiBot competes for the intelligence layer of industrial and logistics automation rather than only for
              complete-robot sales. Third-party descriptions characterize Psi R1 as a vision-language-action model and
              PsiBot as a supplier of intelligence to manufacturers, while the company's own site presents a broader
              loop spanning foundation models, robot hardware, simulation, teleoperation, and data. This puts direct
              model vendors such as Physical Intelligence in the closest strategic peer set, but buyers can also choose
              a vertically integrated robot maker such as Unitree, AGIBOT, UBTECH, Figure, or Tesla; use NVIDIA's
              development stack; build an internal model; or retain fixed automation and conventional grippers. The
              alternatives therefore differ not only in capability but in ownership of hardware, deployment data,
              integration risk, and distribution.
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP012
              - CP014
