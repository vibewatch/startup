      - number: '5.2'
        title: Architecture, data loop, and maturity
        blocks:
          - type: paragraph
            body: >-
              The public technical description is consistent with a hierarchical vision-language-action design: a
              high-level model interprets language and visual context, while a lower-level policy converts
              representations and robot state into action chunks. The DexGraspVLA paper, authored by a Peking
              University/PsiBot joint-lab team and presented as an AAAI 2026 oral presentation, specifies a VLM-based
              planner, SAM and Cutie segmentation, DINOv2 visual encoders, a trainable ViT, projectors, and a diffusion
              transformer controller. It reports more than 90% grasping success across thousands of unseen cluttered
              scenes for that research system, using 2,094 successful episodes and roughly two hours of demonstrations.
              This is relevant technical evidence, but it is not a disclosed production benchmark for every PsiBot
              product. Company and trade coverage separately describe Psi R1 as hierarchical, end-to-end,
              reinforcement-learning based, and capable of a more than 30-minute Mahjong demonstration; those claims
              remain company-reported or derivative reports. The architecture's maturity signal is thus stronger at
              research-component level than at fleet-reliability level: buyers still need task-level acceptance tests,
              failure recovery measurements, data-governance terms, and integration evidence in their own environments.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
              - CE008
              - CE009
              - CE010
              - CE013
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE006
              - CE008
              - CE009
              - CE011
      - number: '5.3'
        title: Differentiation, dependencies, and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              PsiBot's potential differentiation is the combination of a model layer, dexterous manipulation, and a
              data-collection loop rather than a novel chassis alone. Origin of Bots attributes lower training-data
              collection cost to Psi-SynEngine and reports small-scale warehouse verification with improved sorting
              efficiency; both points are secondary-source summaries, not audited operating metrics. The academic paper
              offers a stronger mechanism-level signal for generalized grasping, while the official site shows breadth
              of task demonstrations. The counterweight is operational: the public materials do not specify model
              versioning, API or on-premise boundaries, observability, safety interlocks, incident history, service
              levels, or component/compute dependencies. A trade report also flags that independent verification of the
              Mahjong and data-cost demonstrations is scarce and discusses export-control and Chinese-law exposure for
              licensees. That report is not a legal opinion, and the absence of a public incident is not evidence that
              no incident occurred. Before deployment, diligence should require reproducible task benchmarks,
              network/data-flow diagrams, red-team and fail-safe results, support commitments, model-update controls,
              and a documented bill of materials and compute plan.
            claimRefs:
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Platform thesis has a concrete technical surface
            body: >-
              PsiBot exposes more than a generic AI label: the retained record identifies a foundation-model family, a
              robot, a teleoperation glove, dexterous manipulation, and a published research mechanism.
            calloutType: strength
            claimRefs:
              - CE001
              - CE006
              - CE009
          - type: callout
            title: Demonstration maturity is ahead of deployment proof
            body: >-
              Public materials show research performance and task demonstrations, but do not disclose reproducible
              production benchmarks, reliability, security controls, or integration economics.
            calloutType: risk
            claimRefs:
              - CE007
              - CE011
              - CE013
              - CE014
          - type: callout
            title: Underwrite by task acceptance, not benchmark headline
            body: >-
              A buyer should require task-specific reproducibility, failure recovery, data-flow, model-update, and
              safety evidence before treating PsiBot's platform claims as production readiness.
            calloutType: recommendation
            claimRefs:
              - CE011
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer segments and use cases
        blocks:
          - type: paragraph
            body: >-
              PsiBot is positioning its intelligence and dexterous-manipulation stack for industrial buyers rather than
              selling a single standardized consumer robot. Its official site describes products built for “Real-world
              Logistics, Retail and Industry,” while third-party descriptions place the model in industry, logistics,
              retail, e-commerce, and end-customer applications. The most economically legible starting jobs are
              repetitive but variable physical tasks: barcode scanning, sorting, kitting, packing, and fine
              manipulation. That segmentation is strategically coherent because buyers can evaluate seconds saved per
              pick or reduced manual handling, but the sources do not identify a paying buyer, contract value,
              deployment site, or production acceptance criterion. The customer thesis therefore rests on a plausible
              workflow fit, not yet on disclosed commercial conversion.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU010
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU006
              - CU008
              - CU009
              - CU012
      - number: '6.2'
        title: Adoption evidence and durability
        blocks:
          - type: paragraph
            body: >-
              The evidence supports an adoption ladder, but not a revenue funnel. RoboAtlas records the company saying
              it has validated logistics-warehouse use cases at small scale and provides a business-contact channel;
              PsiBot's own materials show a logistics, retail, and industrial product surface. A separate article says
              the company cites deployments in semi-structured clothing warehouses for barcode scanning and sorting,
              while another report describes sector testing and partnerships as underway. These are materially stronger
              than a logo-only claim, but they remain company-linked descriptions without named sites, customer quotes,
              paid-versus-pilot status, utilization, uptime, repeat orders, or denominator. AInvest's sector analysis
              cautions that orders, pilots, and demonstrations are not the same as recurring demand. No source in the
              assigned pool discloses NRR, GRR, churn, renewal rate, contract length, customer count, or revenue; those
              are explicit gaps rather than zero values.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
      - number: '6.3'
        title: Named proof, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              PsiBot's strategic-capital base may create a route to early reference deployments, but it is not the same
              as independent customer proof. Chery led the reported 2026 financing and Lens Technology participated; the
              sources describe their industrial positions and potential supply-chain logic, yet do not establish that
              either company is a paying customer or that an investment converts into exclusive procurement. The
              available named-proof inventory is consequently partial: sources mention manufacturing, retail,
              e-commerce, logistics, and industrial settings, but do not name three contactable production customers.
              This creates two linked risks. First, strategic relationships could concentrate early demand around
              investors or related industrial channels. Second, the licensing thesis depends on repeatable integration
              across robot bodies, while the sources do not show renewal or multi-site expansion. The next diligence
              step is a customer-reference pack with legal counterparty, paid status, site count, production acceptance,
              outcome metric, renewal/expansion status, and related-party designation.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU010
              - CU011
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Industrial workflow fit is specific
            body: >-
              The strongest customer signal is not a logo; it is the specificity of the proposed work: warehouse
              scanning and sorting plus dexterous manipulation in logistics and manufacturing.
            calloutType: strength
            claimRefs:
              - CU003
              - CU005
              - CU006
          - type: callout
            title: Adoption is not yet durable revenue
            body: >-
              No assigned source discloses a named paying customer, recurring contract, retention metric, or repeat
              deployment, so pilots and strategic relationships should not be valued as recurring revenue.
            calloutType: risk
            claimRefs:
              - CU008
              - CU009
              - CU012
              - CU013
          - type: callout
            title: Make customer references a financing gate
            body: >-
              Require a reference pack that reconciles investor relationships, paid status, production acceptance,
              measurable outcomes, renewal, and expansion before underwriting customer-led scale.
            calloutType: recommendation
            claimRefs:
              - CU010
              - CU011
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              China-specific cyber and data obligations are a material risk for an embodied-AI platform handling
              training data, robot telemetry, and potentially personal information. A legal analysis reports that
              amendments to China's Cybersecurity Law took effect on 2026-01-01, introduced AI governance language,
              broadened extraterritorial reach, and increased maximum fines to RMB10 million depending on the violation.
              A separate legal analysis likewise describes higher penalties, expanded reach, and the importance of
              documented remediation. These sources describe the legal framework, not a Psibot violation; the diligence
              question is whether its data flows, customers, and deployed systems trigger the relevant obligations.
              There is also no assigned primary source establishing Psibot's licenses, litigation history, or
              enforcement status. The investment implication is a potentially asymmetric downside: compliance controls
              can reduce exposure, but an undocumented cross-border or incident-response posture could delay deployments
              or create fines and remediation costs.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR014
      - number: '7.2'
        title: Operational, quality, and technical execution
        blocks:
          - type: paragraph
            body: >-
              Psibot presents a full-stack model, data, simulation, and hardware strategy for logistics, retail, and
              industrial settings, but the strongest performance evidence in the assigned pool is either
              company-authored or a secondary summary of company demonstrations. The official site lists logistics and
              industrial products and model demonstrations, while third-party listings repeat the claimed Psi R1
              long-horizon capabilities. Independent coverage explicitly says that Psibot's L3 classification and its
              demonstrations have scarce independent verification. That creates execution risk between a controlled
              demonstration and reliable production use: errors, integration time, safety controls, warranty exposure,
              and data-collection cost are not disclosed here. The broader robotics evidence also describes current
              deployments as limited and site-specific, and identifies dependence on foreign compute and
              precision-component inputs. The appropriate monitor is production evidence by site, task, uptime, safety
              incident, and unit economics rather than benchmark claims alone.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR011
              - CR012
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR007
              - CR011
              - CR012
              - CR015
      - number: '7.3'
        title: Financial, partner, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The latest assigned reporting describes more than $100 million of new financing from industrial and
              state-linked investors, while separate coverage describes a nearly $100 million round at about a $1.48
              billion valuation. Dealroom records a March 2026 $280 million financing at a $1.1 billion valuation and
              says the company targets high-value B2B scenarios, but it does not provide audited revenue, margins, burn,
              runway, customer concentration, or contract quality in the fetched text. Strategic investors can improve
              distribution and industrial access, yet they can also create related-party, channel, and
              customer-concentration questions. A platform strategy depends on manufacturers adopting the intelligence
              layer; if customers build models in-house or if a partner delays deployment, revenue conversion may lag
              the capital narrative. Until management provides cohort, contract, cash-use, and cap-table evidence, the
              financial risk should be treated as high-uncertainty rather than inferred from funding size.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR012
              - CR015
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-priority diligence
            body: >-
              Obtain a China data-flow and AI-governance map, production deployment metrics, named customer references,
              audited financials, and the cap table before underwriting the current valuation.
            calloutType: risk
            claimRefs:
              - CR001
              - CR004
              - CR007
              - CR009
              - CR010
          - type: callout
            title: Thesis-break trigger
            body: >-
              Treat a material regulatory finding, repeated production safety or reliability failure, inability to
              verify customer deployments, or insufficient cash runway as a thesis-break event.
            calloutType: assumption
            claimRefs:
              - CR001
              - CR007
              - CR010
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price and evidence
        blocks:
          - type: paragraph
            body: >-
              The strongest current valuation evidence is a Bloomberg-reported financing described by the Strait Times
              as close to US$100 million at a US$1.48 billion valuation, with about US$300 million raised since
              inception. Yicai independently reports total capital of CNY2 billion (US$300 million), while Gasgoo
              reports a new funding round used for R&D and commercialization without publishing a valuation. These
              sources establish a financing context, not a verified revenue multiple or cash balance. The round's
              strategic investor mix is economically relevant: Humanoid Intel reports participation by Ningbo Tuopu,
              Lens Technology, a Chery-backed fund, Wuhu Investment Holding, Fosun Fortune Capital, 37 Interactive
              Entertainment, and existing investor Zhuhai Technology Industry Group. Strategic capital may improve
              access to deployment sites, but it can also encode industrial-policy or supply-chain objectives that are
              not equivalent to financial underwriting.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV012
      - number: '8.2'
        title: Scenarios and comparables
        blocks:
          - type: paragraph
            body: >-
              The available comparable evidence is a capital-market and funding landscape, not a like-for-like
              public-company valuation set. AI Funding Tracker reports large 2026 rounds for model-layer and humanoid
              companies, including Skild AI at more than $14 billion and Physical Intelligence at $5.6 billion in its
              cited set, while Yicai reports that Chinese robotics companies above CNY10 billion in valuation raised
              more than CNY40 billion in the first half of 2026. Those benchmarks show that the sector can support high
              software-layer prices, but they do not establish Psibot's relative multiple because Psibot has not
              publicly disclosed revenue, recurring revenue, gross margin, or shipment economics. ChinaBizInsider's
              account of Unitree, DEEP Robotics, and Leju shows how IPO benchmarks can separate profitable, subsidized,
              and loss-making businesses; the same discipline should be applied to Psibot before treating a headline
              valuation as fair.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV008
              - CV011
              - CV013
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV009
              - CV011
              - CV012
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.3'
        title: Decision and diligence
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is that Psibot can become an intelligence-layer supplier whose models and data
              systems scale across industrial customers. That thesis is not yet demonstrably asset-light: the official
              site also markets Psi SynRobot for logistics and industry plus teleoperation hardware, so diligence must
              separate licensable software economics from hardware and integration capital needs. RobotAIGeek reports a
              fifteen-fold valuation increase in roughly a year and describes the company's own L3 and data-cost claims
              as independently unverified; its account also flags dependence on foreign compute and component
              foundations. The appropriate decision is research-more at the reported mark: require audited financials,
              cap table and preference terms, named customer references, deployment uptime and gross-margin evidence,
              and independent validation of model demonstrations. A move toward track or buy would require evidence that
              recurring commercial revenue and reliability justify the premium; a down-round, failed deployment, or
              inability to verify customer economics would break the thesis.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive call
            body: >-
              Research-more is the appropriate stance at the reported US$1.48 billion mark until audited financials,
              customer economics, and cap-table terms establish whether strategic optionality is translating into
              durable enterprise value.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV009
              - CV012
              - CV014
          - type: callout
            title: Principal thesis break
            body: >-
              A failed deployment or down-round would materially weaken the platform thesis because the current public
              case relies more on financing momentum and strategic backers than on disclosed recurring revenue.
            calloutType: risk
            claimRefs:
              - CV011
              - CV012
              - CV014
