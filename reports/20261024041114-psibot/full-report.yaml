      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              PsiBot has access to substantial strategic financing signals, but financing raised is not cash available
              and a reported round is not a balance-sheet disclosure. A July 23 account attributed to Bloomberg
              described a nearly $100 million round at a $1.48 billion valuation and approximately $300 million of total
              funding since inception, while a separate August 28 briefing reported completion of a new round of over
              $100 million. The July account explicitly cautioned that its deal was close but not signed and terms could
              change, so the two reports should not be mechanically added. Neither assigned source discloses cash on
              hand, burn, runway, debt, working-capital needs, committed versus deployed capital, or the next financing
              trigger. The planned use of funds—research, data collection, and deployments—implies continuing capital
              needs before commercial scale is proven.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial picture is investable only as an evidence-limited option on platform adoption, not as an
              underwritten cash-flow or margin story. PsiBot's model and data assets may support licensing, integration,
              and deployment revenue, but no assigned source supplies audited revenue, ARR, gross margin, customer
              concentration, contract duration, realized pricing, or cash runway. A competitor benchmark illustrates why
              those omissions matter: Unitree's 2025 prospectus materials report 2025 revenue of 1.70 billion yuan and
              gross margins around 60%, while a contemporaneous report describes first-quarter 2026 revenue growth
              alongside a sharp adjusted-profit decline and rising R&D and sales expense. That benchmark is not a PsiBot
              estimate; it shows the sector can scale revenue while profitability compresses. PsiBot should not be
              valued on revenue multiples until management provides a reconciled revenue bridge and evidence of
              repeatable customer economics.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
