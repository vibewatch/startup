              - CP010
              - CP012
              - CP013
              - CP014
      - number: '3.3'
        title: Scaled hardware rivals possess stronger distribution evidence
        blocks:
          - type: paragraph
            body: >-
              Unitree and AGIBOT already present a different competitive asset: shipped hardware and manufacturing
              learning. Assigned sources report that Unitree generated RMB1.708 billion of 2025 revenue, shipped more
              than 5,500 humanoids, and had shifted more than half of its revenue mix toward humanoids by the first nine
              months of 2025. Yet another source reports that research and education represented 73.6% of Unitree's
              humanoid revenue from 2023 through the first three quarters of 2025, while industrial and
              smart-manufacturing uses represented 9%. That mix limits how confidently shipments can be equated with
              mature factory demand. For PsiBot, strategic investors such as Chery and Lens Technology may provide
              industrial access, but investment relationships are not evidence of arm's-length customer adoption or
              exclusive distribution.
            claimRefs:
              - CP005
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP008
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: The moat depends on portability becoming a standard
        blocks:
          - type: paragraph
            body: >-
              A hardware-agnostic intelligence layer can diversify exposure across robot bodies, but it is durable only
              if customers prefer an external model over their own core software. That condition is not established.
              Independent coverage says major Chinese humanoid makers are developing VLA models internally, while U.S.
              model specialist Physical Intelligence is reportedly raising at an above-US$11 billion valuation despite
              an undefined commercialization timeline. Assigned sources also conflict on Physical Intelligence's
              commercial maturity: one tracker claims an API, more than thirty licensees, and US$500,000 annual fleet
              pricing, while another says commercialization timing is undefined. PsiBot's public list pricing, contract
              structure, retention, integration cycle, and hardware portability remain undisclosed in the retained
              evidence. Until those gaps close, switching costs and platform power should be treated as hypotheses
              rather than demonstrated moat.
            claimRefs:
              - CP013
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic position
            body: >-
              PsiBot can sell across hardware vendors in principle, and its cloud-training/edge-inference design targets
              a real deployment constraint rather than a single robot form factor.
            calloutType: strength
            claimRefs:
              - CP001
              - CP004
              - CP016
          - type: callout
            title: Moat evidence is not yet public
            body: >-
              No retained source provides PsiBot list pricing, customer retention, paid fleet scale, independent
              benchmark leadership, or verified switching-cost evidence.
            calloutType: risk
            claimRefs:
              - CP007
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and revenue quality
        blocks:
          - type: paragraph
            body: >-
              PsiBot positions its intelligence layer for industrial, logistics, retail, and other embodied-AI
              deployments rather than presenting a conventional hardware product line. Its public surfaces present a
              logistics and industrial robot, a teleoperation glove, and a modular whole-machine solution, while
              third-party Psi R1 references describe a model intended for industry, logistics, retail, and end-customer
              applications. A separate industry account characterizes the strategy as licensing intelligence to
              manufacturers and pairing the model with a dexterous hand, simulation tooling, and training-data
              platforms. These descriptions establish plausible revenue mechanisms—model or platform licensing,
              integration or deployment work, and potentially hardware or data-system sales—but do not establish
              realized revenue, recurring revenue, take rate, backlog, or revenue mix. Official pricing, contract terms,
              discounting, and recognition policy are not publicly evidenced in the reviewed sources.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
