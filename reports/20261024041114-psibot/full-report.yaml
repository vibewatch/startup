chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating model
        blocks:
          - type: paragraph
            body: >-
              Psibot, also known as Lingchu Intelligence, is described as a Shanghai-founded embodied-AI company
              established in 2024. Its stated focus is dexterous manipulation rather than a consumer humanoid form
              factor. The company's product surfaces describe Psi SynRobot as a robot for logistics and industry,
              SynGlove Air as a real-machine teleoperation glove for data and control, and the PSI foundation-model
              family as the software layer. Third-party descriptions characterize Psi R1 as a vision-language-action
              model for long-horizon tasks, while the company's own pages present a broader product set spanning models,
              simulation, data, and robots. This supports a platform-plus-deployment thesis, not a cleanly disclosed
              recurring-revenue software model.
            claimRefs:
              - CO001
              - CO002
              - CO003
      - number: '1.2'
        title: Leadership, scale, and execution dependencies
        blocks:
          - type: paragraph
            body: >-
              Available reporting identifies Viktor Wang as a founder and chief executive, with prior JD.com and
              robotics experience, and names Xiaojie Chai, Yaodong Yang, and Yuanpei Chen among the founding team. The
              reported backgrounds span robotics, Peking University, and Stanford-linked AI research, which is relevant
              founder coverage for a technically demanding company. The evidence also points to logistics and
              fibre-optic manufacturing testing, a joint laboratory with Peking University, and a stated goal of
              collecting one million hours of data in 2026. These are operating signals rather than audited scale
              metrics: no source in the assigned pool discloses revenue, ARR, customer count, headcount, board
              composition, ownership percentages, or leadership turnover.
