  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      PsiBot's public product and research surface can be read as a layered loop from task intent and perception through
      policy execution, data collection, and physical workcell delivery.
    data:
      layers:
        - label: Task intent
          detail: Task definition and user prompt
          items:
            - User prompt
            - Industrial task definition
        - label: Perception and grounding
          detail: Visual observations and object grounding
          items:
            - Head-camera image
            - Wrist-camera image
            - Segmentation and tracking
        - label: Planning and policy
          detail: VLA planning and low-level action generation
          items:
            - VLA or VLM planner
            - Action-chunk controller
            - Reinforcement learning
        - label: Data loop
          detail: Demonstration collection and training-data acquisition
          items:
            - SynGlove Air teleoperation
            - Demonstration collection
