          - type: callout
            title: Request a reconciled revenue and cash package
            body: >-
              Before underwriting, request audited or management-reconciled revenue by stream, signed contract and
              backlog support, gross-margin drivers, cash and debt schedules, monthly burn, and customer concentration.
            calloutType: recommendation
            claimRefs:
