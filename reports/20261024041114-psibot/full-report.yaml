      - number: '4.2'
        title: GTM motion and unit economics
        blocks:
          - type: paragraph
            body: >-
              The available go-to-market signal is strategic and deployment-oriented: the July 2026 reporting says
              pilots were live with a major Chinese logistics vendor and a large fiber-optic cable maker, while the
              August briefing says funding will support research, human-operation data collection, and deployments in
              logistics and advanced manufacturing. PsiBot's own page presents logistics and industrial robot
              applications, a teleoperation glove, and task demonstrations, which is consistent with an
              integration-heavy enterprise motion. However, there is no public evidence here for sales-cycle length,
              customer acquisition cost, implementation fees, gross margin, service-level economics, utilization,
              payback, or expansion behavior. The likely commercial bottleneck is not only model performance but also
              deployment, integration, and data-collection cost per customer.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
