      - number: '3.2'
        title: Architecture is differentiated, but proof remains issuer-led
        blocks:
          - type: paragraph
            body: >-
              PsiBot's strongest public differentiation is architectural. At a 2025 company event, it described cloud
              training followed by lightweight edge inference, real-world data collection through proprietary
              exoskeletons, supervised fine-tuning, and reinforcement learning. The same company presentation disclosed
              a meaningful performance gap against Figure's cited Helix frequencies: PsiBot reported 30-50 Hz for its
              low-level module and about 1 Hz for its high-level module, versus 200 Hz and 7-9 Hz respectively for
              Figure. Independent reporting also notes that PsiBot's L3 label, thirty-minute mahjong demonstration, and
              claimed data-cost advantage have not been independently verified. The evidence supports technical
              differentiation, not benchmark leadership or production reliability.
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP007
