        title: Exhibits
        blocks:
          - type: callout
            title: Financing does not substitute for commercial proof
            body: >-
              Strategic rounds support runway optionality, but the assigned evidence does not establish cash available,
              burn, runway, realized pricing, or recurring revenue.
            calloutType: risk
            claimRefs:
