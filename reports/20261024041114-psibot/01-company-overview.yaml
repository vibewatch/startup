company:
  name: Psibot
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Psibot is a Shanghai-founded embodied-AI company building vision-language-action
    models, dexterous manipulation systems, and related data-collection hardware for
    logistics, retail, and industrial use. Public evidence supports a fast financing
    and product-expansion trajectory, but revenue, customer concentration, governance,
    and independent performance verification remain material gaps.
sections:
  - id: identity-and-product
    title: Identity, product, and operating model
    body: >-
      Psibot, also known as Lingchu Intelligence, is described as a Shanghai-founded
      embodied-AI company established in 2024. Its stated focus is dexterous
      manipulation rather than a consumer humanoid form factor. The company's
      product surfaces describe Psi SynRobot as a robot for logistics and industry,
      SynGlove Air as a real-machine teleoperation glove for data and control, and the
      PSI foundation-model family as the software layer. Third-party descriptions
      characterize Psi R1 as a vision-language-action model for long-horizon tasks,
      while the company's own pages present a broader product set spanning models,
      simulation, data, and robots. This supports a platform-plus-deployment thesis,
      not a cleanly disclosed recurring-revenue software model.
    claimRefs: [CO001, CO002, CO003]
  - id: leadership-and-scale
    title: Leadership, scale, and execution dependencies
    body: >-
      Available reporting identifies Viktor Wang as a founder and chief executive,
      with prior JD.com and robotics experience, and names Xiaojie Chai, Yaodong Yang,
      and Yuanpei Chen among the founding team. The reported backgrounds span robotics,
      Peking University, and Stanford-linked AI research, which is relevant founder
      coverage for a technically demanding company. The evidence also points to
      logistics and fibre-optic manufacturing testing, a joint laboratory with Peking
      University, and a stated goal of collecting one million hours of data in 2026.
      These are operating signals rather than audited scale metrics: no source in the
      assigned pool discloses revenue, ARR, customer count, headcount, board
      composition, ownership percentages, or leadership turnover.
    claimRefs: [CO005, CO006, CO008, CO009]
    tableRefs: [TO002]
  - id: financing-and-milestones
    title: Financing, strategic stakeholders, and milestones
    body: >-
      Publicly available sources describe a March 2026 cumulative angel and Pre-A
      financing of approximately CNY 2 billion and a further August 2026 round of
      more than US$100 million. Other reporting describes the company as having
      raised about US$300 million since inception and places the August transaction
      at a US$1.48 billion valuation; the figures are not fully reconciled across
      sources and should not be treated as audited cash available. The investor mix
      is strategic as well as financial, including Chery-linked capital, Lens
      Technology, Tuopu Group, Wuhu investment entities, Fosun-related capital, and
      earlier state-backed and venture investors. The strategic rationale may improve
      industrial access while increasing related-party and concentration diligence
      needs.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015]
    tableRefs: [TO001, TO003]
    figureRefs: [FO001]
