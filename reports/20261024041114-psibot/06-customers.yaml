chapter:
  number: 6
  title: Customers
  summary: PsiBot has credible industrial-market fit signals and small-scale logistics validation, but the assigned evidence does not identify a customer, disclose paid deployments, or establish retention, revenue, or expansion. Strategic investors may provide distribution and reference access, yet the commercial case remains a pilot-to-production diligence question.
sections:
  - id: buyer-segments
    title: Buyer segments and use cases
    body: >-
      PsiBot is positioning its intelligence and dexterous-manipulation stack for
      industrial buyers rather than selling a single standardized consumer robot.
      Its official site describes products built for “Real-world Logistics, Retail and
      Industry,” while third-party descriptions place the model in industry,
      logistics, retail, e-commerce, and end-customer applications. The most
      economically legible starting jobs are repetitive but variable physical tasks:
      barcode scanning, sorting, kitting, packing, and fine manipulation. That
      segmentation is strategically coherent because buyers can evaluate seconds
      saved per pick or reduced manual handling, but the sources do not identify a
      paying buyer, contract value, deployment site, or production acceptance
      criterion. The customer thesis therefore rests on a plausible workflow fit,
      not yet on disclosed commercial conversion.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory
    title: Adoption evidence and durability
    body: >-
      The evidence supports an adoption ladder, but not a revenue funnel. RoboAtlas
      records the company saying it has validated logistics-warehouse use cases at
      small scale and provides a business-contact channel; PsiBot's own materials
      show a logistics, retail, and industrial product surface. A separate article
      says the company cites deployments in semi-structured clothing warehouses for
      barcode scanning and sorting, while another report describes sector testing
      and partnerships as underway. These are materially stronger than a logo-only
      claim, but they remain company-linked descriptions without named sites,
      customer quotes, paid-versus-pilot status, utilization, uptime, repeat
      orders, or denominator. AInvest's sector analysis cautions that orders,
      pilots, and demonstrations are not the same as recurring demand. No source
      in the assigned pool discloses NRR, GRR, churn, renewal rate, contract length,
      customer count, or revenue; those are explicit gaps rather than zero values.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
  - id: named-proof-and-concentration
    title: Named proof, expansion, and concentration
    body: >-
      PsiBot's strategic-capital base may create a route to early reference
      deployments, but it is not the same as independent customer proof. Chery led
      the reported 2026 financing and Lens Technology participated; the sources
      describe their industrial positions and potential supply-chain logic, yet do
      not establish that either company is a paying customer or that an investment
      converts into exclusive procurement. The available named-proof inventory is
      consequently partial: sources mention manufacturing, retail, e-commerce,
      logistics, and industrial settings, but do not name three contactable
      production customers. This creates two linked risks. First, strategic
      relationships could concentrate early demand around investors or related
      industrial channels. Second, the licensing thesis depends on repeatable
      integration across robot bodies, while the sources do not show renewal or
      multi-site expansion. The next diligence step is a customer-reference pack
      with legal counterparty, paid status, site count, production acceptance,
      outcome metric, renewal/expansion status, and related-party designation.
    claimRefs: [CU010, CU011, CU012, CU013, CU014]
    tableRefs: [TU003]
