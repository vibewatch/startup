    claimRefs: [CU005, CU006, CU008, CU009, CU012]
callouts:
  - calloutType: strength
    title: Industrial workflow fit is specific
    body: "The strongest customer signal is not a logo; it is the specificity of the proposed work: warehouse scanning and sorting plus dexterous manipulation in logistics and manufacturing."
    claimRefs: [CU003, CU005, CU006]
  - calloutType: risk
    title: Adoption is not yet durable revenue
    body: "No assigned source discloses a named paying customer, recurring contract, retention metric, or repeat deployment, so pilots and strategic relationships should not be valued as recurring revenue."
    claimRefs: [CU008, CU009, CU012, CU013]
  - calloutType: recommendation
    title: Make customer references a financing gate
    body: "Require a reference pack that reconciles investor relationships, paid status, production acceptance, measurable outcomes, renewal, and expansion before underwriting customer-led scale."
    claimRefs: [CU010, CU011, CU014]
