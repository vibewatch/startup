      - ["Semi-structured warehouse deployment", "Barcode scanning and sorting cited", "2026-03-17", "The Bamboo Works", "medium", "Repetitive-but-variable jobs may be an early commercialization beachhead", "Named customer, production acceptance, duration, and economics"]
      - ["Sector testing", "Logistics, retail, and manufacturing testing stated", null, "Rocking Robots", "low", "Shows claimed expansion of the target surface beyond one workflow", "Publication date, partner names, sites, test results, and conversion to orders"]
      - ["Recurring retention", "Not disclosed", "As of 2026-10-24", "Assigned source pool review", "low", "Durability and expansion cannot be underwritten from the available evidence", "NRR, GRR, churn, renewal, contract length, cohort, and customer count"]
    notes: "Values preserve source wording and date basis; null or undisclosed fields are not treated as zero, and the table is partial rather than an exhaustive customer census."
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or proof unit, Segment, Deployment/use case, Production vs pilot, Outcome, Limitation]
    rows:
      - ["Unnamed logistics warehouse operators", "Logistics", "Warehouse use cases; barcode scanning and sorting are described", "Small-scale validation / claimed deployment; status not independently established", "Use-case fit is plausible for repetitive physical work", "No named counterparty, paid status, site count, or measured outcome"]
      - ["Unnamed manufacturing firms", "Manufacturing", "Dexterous manipulation and advanced manufacturing", "Testing or planned deployment", "Industrial channel is a stated target", "No customer quote, acceptance record, or repeat order"]
      - ["Unnamed retail and e-commerce firms", "Retail / e-commerce", "Generalized embodied-AI applications", "Cooperation or testing described", "Broad applicability is claimed", "No production evidence, reference contact, or retention data"]
    notes: "Enumeration is partial: the assigned sources do not provide three named, contactable customer deployments, so unnamed proof units are retained with explicit production-status limitations."
    enumerationScope:
      coverage: partial
      basis: "Publicly accessible assigned sources through 2026-10-24, limited to customer and deployment references that identify a segment or workflow."
    claimRefs: [CU005, CU006, CU007, CU010, CU011]
