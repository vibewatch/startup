company:
  name: Psibot
chapter:
  number: 8
  title: Valuation
  summary: Psibot's latest reported financing implies a roughly $1.48 billion valuation, but the public record still does not disclose revenue, margins, or audited commercial conversion. Strategic industrial investors and a software-layer model create upside optionality, while the valuation premium, crowded market, and unverified deployment economics support a research-more stance rather than a buy.
sections:
  - id: price-and-evidence
    title: Price and evidence
    body: "The strongest current valuation evidence is a Bloomberg-reported financing described by the Strait Times as close to US$100 million at a US$1.48 billion valuation, with about US$300 million raised since inception. Yicai independently reports total capital of CNY2 billion (US$300 million), while Gasgoo reports a new funding round used for R&D and commercialization without publishing a valuation. These sources establish a financing context, not a verified revenue multiple or cash balance. The round's strategic investor mix is economically relevant: Humanoid Intel reports participation by Ningbo Tuopu, Lens Technology, a Chery-backed fund, Wuhu Investment Holding, Fosun Fortune Capital, 37 Interactive Entertainment, and existing investor Zhuhai Technology Industry Group. Strategic capital may improve access to deployment sites, but it can also encode industrial-policy or supply-chain objectives that are not equivalent to financial underwriting."
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001]
  - id: scenarios-and-comparables
    title: Scenarios and comparables
    body: The available comparable evidence is a capital-market and funding landscape, not a like-for-like public-company valuation set. AI Funding Tracker reports large 2026 rounds for model-layer and humanoid companies, including Skild AI at more than $14 billion and Physical Intelligence at $5.6 billion in its cited set, while Yicai reports that Chinese robotics companies above CNY10 billion in valuation raised more than CNY40 billion in the first half of 2026. Those benchmarks show that the sector can support high software-layer prices, but they do not establish Psibot's relative multiple because Psibot has not publicly disclosed revenue, recurring revenue, gross margin, or shipment economics. ChinaBizInsider's account of Unitree, DEEP Robotics, and Leju shows how IPO benchmarks can separate profitable, subsidized, and loss-making businesses; the same discipline should be applied to Psibot before treating a headline valuation as fair.
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV002, TV003]
    figureRefs: [FV001]
  - id: decision-and-diligence
    title: Decision and diligence
    body: "The investable thesis is that Psibot can become an intelligence-layer supplier whose models and data systems scale across industrial customers. That thesis is not yet demonstrably asset-light: the official site also markets Psi SynRobot for logistics and industry plus teleoperation hardware, so diligence must separate licensable software economics from hardware and integration capital needs. RobotAIGeek reports a fifteen-fold valuation increase in roughly a year and describes the company's own L3 and data-cost claims as independently unverified; its account also flags dependence on foreign compute and component foundations. The appropriate decision is research-more at the reported mark: require audited financials, cap table and preference terms, named customer references, deployment uptime and gross-margin evidence, and independent validation of model demonstrations. A move toward track or buy would require evidence that recurring commercial revenue and reliability justify the premium; a down-round, failed deployment, or inability to verify customer economics would break the thesis."
    claimRefs: [CV011, CV012, CV013, CV014, CV015, CV016]

tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, research-more, Do not underwrite a buy without financial and commercial verification]
      - [Confidence, medium, Financing and market evidence are public; operating metrics remain undisclosed]
      - [Risk rating, high, "Valuation, execution, concentration, and regulatory dependencies remain material"]
      - [Valuation stance, stretched, US$1.48B mark lacks a public revenue or margin denominator]
      - [Entry discipline, Require audited metrics and preference terms, Reprice or wait if absent]
    notes: Public sources describe financing and sector benchmarks, but do not provide a verified Psibot revenue denominator or audited valuation analysis.
    claimRefs: [CV001, CV002, CV009, CV012]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Evidence, What would change the view]
    rows:
      - [Software-layer upside, Model/data focus targets logistics and manufacturing but the official site also markets robot hardware, Segment revenue and capital needs by software versus hardware]
      - [Industrial distribution, Chery-linked and manufacturing investors may create deployment access, Named arm's-length contracts and repeatable gross margins]
      - [Valuation premium, Reported US$1.48B valuation follows a large financing round, Audited ARR or revenue growth supporting the mark]
      - [Model defensibility, Psi-R2/Psi-W0 and proprietary data collection are described publicly, Independent benchmark replication and switching-cost evidence]
      - [Downside, Crowded market and unverified demonstrations raise multiple-compression risk, "Production uptime, retention, and a clean cap table"]
    notes: Evidence distinguishes company and media descriptions from independently verified operating outcomes; no row should be read as a completed diligence finding.
    claimRefs: [CV003, CV004, CV008, CV011, CV013, CV016]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Assumptions, Valuation / return logic, Probability signal, Trigger]
    rows:
      - [Bull, "Recurring industrial licensing, verified reliability, and strategic deployment convert", "Current mark can be defended or expand if revenue scales faster than dilution", "Not established; rises with audited recurring revenue and multi-site renewals", "Audited recurring revenue and multi-site renewals"]
      - [Base, "Continued R&D and pilots with limited disclosed monetization", "Preserve capital and wait for a financing price tied to observable revenue", "Current signal is financing momentum with incomplete operating disclosure", "Customer contracts and unit economics remain partial"]
      - [Bear, "Demonstrations do not generalize and strategic demand does not become repeatable revenue", "Multiple compression or down-round risk at the next financing", "Rises with failed deployments, adverse terms, or cash pressure", "Failed deployments, cash burn, or adverse financing terms"]
    notes: These are conditional decision scenarios, not forecasts; public evidence does not support precise probability percentages or target returns.
    claimRefs: [CV006, CV009, CV011, CV012, CV014, CV015]

