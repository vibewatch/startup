          value: "Revenue and margin undisclosed"
        - id: risk
          label: Multiple and execution risk
          value: "High"
        - id: decision
          label: Recommendation
          value: research-more
    claimRefs: [CV001, CV003, CV006, CV011, CV012, CV015, CV016]

callouts:
  - calloutType: recommendation
    title: Price-sensitive call
    body: Research-more is the appropriate stance at the reported US$1.48 billion mark until audited financials, customer economics, and cap-table terms establish whether strategic optionality is translating into durable enterprise value.
    claimRefs: [CV001, CV009, CV012, CV014]
  - calloutType: risk
    title: Principal thesis break
    body: A failed deployment or down-round would materially weaken the platform thesis because the current public case relies more on financing momentum and strategic backers than on disclosed recurring revenue.
    claimRefs: [CV011, CV012, CV014]

