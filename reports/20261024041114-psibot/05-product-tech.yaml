company:
  name: Psibot
chapter:
  number: 5
  title: Product & Technology
  summary: PsiBot presents a software-led embodied-AI platform built around the PSI foundation-model family, dexterous manipulation hardware, teleoperation/data collection, and logistics-oriented deployments. The public record supports a concrete product surface and credible research lineage, but production reliability, integration burden, security controls, and independent validation of flagship demonstrations remain open.
sections:
  - id: product-surface
    title: Product surface and customer workflow
    body: >-
      PsiBot's customer-facing proposition is an intelligence layer for physical
      work rather than a single robot SKU. Its official English site describes
      Psi SynRobot as a robot for logistics and industry, SynGlove Air as a
      real-machine teleoperation glove for data collection and control, and
      multiple demonstrations spanning optical-module inspection, vacuuming,
      box packing, knot tying, object tossing, and Lego assembly. That surface
      maps to a workflow in which a buyer supplies a workcell and task, the
      platform acquires demonstrations or prompts, and the robot executes
      manipulation policies. The site also identifies partners, but does not
      disclose contract terms, deployment counts, uptime, or realized customer
      outcomes. A third-party model listing describes Psi R1 as a model rather
      than a physical robot and places it across industry, logistics, retail,
      and end-customer applications. Those are addressable use cases, not proof
      of commercial scale. The most defensible near-term wedge is therefore
      constrained logistics or industrial work where task boundaries and
      measurable cycle-time benefits can be specified before general-purpose
      autonomy is underwritten.
    claimRefs: [CE001, CE002, CE003, CE004, CE005]
    tableRefs: [TE001, TE002]
  - id: architecture-and-maturity
    title: Architecture, data loop, and maturity
    body: >-
      The public technical description is consistent with a hierarchical
      vision-language-action design: a high-level model interprets language and
      visual context, while a lower-level policy converts representations and
      robot state into action chunks. The DexGraspVLA paper, authored by a
      Peking University/PsiBot joint-lab team and presented as an AAAI 2026 oral
      presentation, specifies a VLM-based planner, SAM and Cutie segmentation,
      DINOv2 visual encoders, a trainable ViT, projectors, and a diffusion
      transformer controller. It reports more than 90% grasping success across
      thousands of unseen cluttered scenes for that research system, using 2,094
      successful episodes and roughly two hours of demonstrations. This is
      relevant technical evidence, but it is not a disclosed production
      benchmark for every PsiBot product. Company and trade coverage separately
      describe Psi R1 as hierarchical, end-to-end, reinforcement-learning based,
      and capable of a more than 30-minute Mahjong demonstration; those claims
      remain company-reported or derivative reports. The architecture's
      maturity signal is thus stronger at research-component level than at
      fleet-reliability level: buyers still need task-level acceptance tests,
      failure recovery measurements, data-governance terms, and integration
      evidence in their own environments.
    claimRefs: [CE006, CE007, CE008, CE009, CE010, CE011]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-risk
    title: Differentiation, dependencies, and diligence blockers
    body: >-
      PsiBot's potential differentiation is the combination of a model layer,
      dexterous manipulation, and a data-collection loop rather than a novel
      chassis alone. Origin of Bots attributes lower training-data collection
      cost to Psi-SynEngine and reports small-scale warehouse verification with
      improved sorting efficiency; both points are secondary-source summaries,
      not audited operating metrics. The academic paper offers a stronger
      mechanism-level signal for generalized grasping, while the official site
      shows breadth of task demonstrations. The counterweight is operational:
      the public materials do not specify model versioning, API or on-premise
      boundaries, observability, safety interlocks, incident history, service
      levels, or component/compute dependencies. A trade report also flags that
      independent verification of the Mahjong and data-cost demonstrations is
      scarce and discusses export-control and Chinese-law exposure for licensees.
      That report is not a legal opinion, and the absence of a public incident
      is not evidence that no incident occurred. Before deployment, diligence
      should require reproducible task benchmarks, network/data-flow diagrams,
      red-team and fail-safe results, support commitments, model-update
      controls, and a documented bill of materials and compute plan.
    claimRefs: [CE012, CE013, CE014]

