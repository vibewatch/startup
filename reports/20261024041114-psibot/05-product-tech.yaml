    notes: "Use-case benefits are evidence-limited: demonstrations and reported sorting improvement are not equivalent to contracted production outcomes or financial returns."
    claimRefs: [CE002, CE004, CE005, CE007, CE012]
  - id: TE003
    title: Technology / operating architecture
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - ["Task and language interpretation", "Grounds a user prompt in visual context and proposes sequential grasp instructions", "Vision-language model and prompt/task definition", "Ambiguous prompts and out-of-distribution tasks may produce unsafe or incomplete plans"]
      - ["Scene segmentation and tracking", "Identifies and tracks target objects during grasping", "SAM and Cutie in the published research stack", "Occlusion, clutter, lighting, and camera placement can reduce tracking quality"]
      - ["Visual and proprioceptive representation", "Aligns head-camera, wrist-camera, mask, and robot-state features", "DINOv2 encoders, trainable ViT, and projectors", "Sensor calibration and domain shift can break transfer"]
      - ["Action policy", "Predicts action chunks for low-level execution", "Diffusion transformer controller in the published research stack", "Latency, compounding errors, and intervention policy are not publicly quantified"]
      - ["Teleoperation and data acquisition", "Collects demonstrations and control data", "SynGlove Air and Psi-SynEngine are publicly presented", "Data rights, coverage, labeling quality, and cost claims require audit"]
      - ["Robot and workcell execution", "Converts policy actions into physical manipulation", "PSI robot/hand assets plus customer facility and components", "Safety interlocks, integration APIs, maintenance, and compute/network dependencies are undisclosed"]
    notes: "This architecture separates mechanisms explicitly described in the DexGraspVLA paper from company product labels; it is not a complete production bill of materials or deployment diagram."
    claimRefs: [CE006, CE008, CE009, CE010, CE013, CE014]

figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: PsiBot's public product and research surface can be read as a layered loop from task intent and perception through policy execution, data collection, and physical workcell delivery.
    data:
      layers:
        - label: Task intent
          detail: Task definition and user prompt
          items: [User prompt, Industrial task definition]
        - label: Perception and grounding
          detail: Visual observations and object grounding
          items: [Head-camera image, Wrist-camera image, Segmentation and tracking]
        - label: Planning and policy
          detail: VLA planning and low-level action generation
          items: [VLA or VLM planner, Action-chunk controller, Reinforcement learning]
        - label: Data loop
          detail: Demonstration collection and training-data acquisition
          items: [SynGlove Air teleoperation, Demonstration collection, Psi-SynEngine]
        - label: Physical execution
          detail: Robot, hand, and workcell operation
          items: [Psi SynRobot, Dexterous hand, Logistics or industrial workcell]
        - label: Validation and controls
          detail: Buyer-side acceptance, safety, and observability
          items: [Task benchmarks, Failure recovery, Model and network controls]
    approximationNotes: "Layer order is an analytical presentation of mechanisms and products described in the retained sources; it does not claim that every commercial deployment contains every named research component."
    claimRefs: [CE001, CE006, CE008, CE009, CE011]

callouts:
  - calloutType: strength
    title: Platform thesis has a concrete technical surface
    body: "PsiBot exposes more than a generic AI label: the retained record identifies a foundation-model family, a robot, a teleoperation glove, dexterous manipulation, and a published research mechanism."
    claimRefs: [CE001, CE006, CE009]
  - calloutType: risk
    title: Demonstration maturity is ahead of deployment proof
    body: Public materials show research performance and task demonstrations, but do not disclose reproducible production benchmarks, reliability, security controls, or integration economics.
    claimRefs: [CE007, CE011, CE013, CE014]
  - calloutType: recommendation
    title: Underwrite by task acceptance, not benchmark headline
    body: A buyer should require task-specific reproducibility, failure recovery, data-flow, model-update, and safety evidence before treating PsiBot's platform claims as production readiness.
    claimRefs: [CE011, CE013, CE014]

