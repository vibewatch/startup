  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing
      missingEvidence: PsiBot price book, contract structure, realized discounts, services attach, renewal terms, and gross-margin profile.
      whyItMatters: Without comparable customer economics, the licensing model cannot be benchmarked against integrated hardware or internal build.
      diligencePath: Request anonymized contracts, invoices, cohort-level renewals, implementation statements of work, and gross-margin reconciliation.
      relatedQuestionRefs: [QP004, QP006]
      relatedTableRefs: [TP003]
    - type: missing-source
      severity: material
      topic: verification
      missingEvidence: Independent, protocol-level testing of PsiBot's L3 manipulation, long-horizon autonomy, inference latency, and data-efficiency claims.
      whyItMatters: Issuer-led demonstrations cannot establish production reliability or superiority over Figure, Unitree, AGIBOT, or internal models.
      diligencePath: Commission matched-task testing with identical hardware, task definitions, success denominators, reset rules, and operating hours.
      relatedQuestionRefs: [QP003, QP006, QP007]
      relatedTableRefs: [TP002]
    - type: private-evidence-only
      severity: material
      topic: moat
      missingEvidence: Customer retention, multi-homing, integration time, retraining burden, portability across robot bodies, and proprietary-data rights.
      whyItMatters: These measures determine whether PsiBot is a durable platform or a replaceable model component.
      diligencePath: Interview reference customers and OEM partners, inspect deployment logs and data-rights clauses, and run a controlled replacement test.
      relatedQuestionRefs: [QP005, QP006]
    - type: conflicting-data
      severity: minor
      topic: Physical-Intelligence
      missingEvidence: Primary confirmation of Physical Intelligence's API availability, active licensee count, and enterprise price.
      whyItMatters: The closest model-layer comparator cannot be priced or scored consistently while commercialization accounts conflict.
