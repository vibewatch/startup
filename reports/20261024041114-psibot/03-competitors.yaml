schemaVersion: report-v2
artifact: competitors
slug: psibot
runDate: 2026-10-24
company:
  name: Psibot
chapter:
  number: 3
  title: Competitors
  summary: >-
    PsiBot occupies a plausible but unproven position between robot makers and
    hardware-agnostic foundation-model vendors: it offers an intelligence layer plus selected
    execution hardware, while scaled Chinese manufacturers already control distribution,
    manufacturing feedback loops, and in-house model programs. Public evidence supports a
    differentiated architecture and strategic backing, but not durable switching costs,
    independent performance leadership, or transparent commercial pricing.
sections:
  - id: competitive-boundary
    title: The competitive boundary is wider than humanoid vendors
    body: >-
      PsiBot competes for the intelligence layer of industrial and logistics automation rather
      than only for complete-robot sales. Third-party descriptions characterize Psi R1 as a
      vision-language-action model and PsiBot as a supplier of intelligence to manufacturers,
      while the company's own site presents a broader loop spanning foundation models, robot
      hardware, simulation, teleoperation, and data. This puts direct model vendors such as
      Physical Intelligence in the closest strategic peer set, but buyers can also choose a
      vertically integrated robot maker such as Unitree, AGIBOT, UBTECH, Figure, or Tesla; use
      NVIDIA's development stack; build an internal model; or retain fixed automation and
      conventional grippers. The alternatives therefore differ not only in capability but in
      ownership of hardware, deployment data, integration risk, and distribution.
    claimRefs: [CP001, CP002, CP006, CP012, CP014]
    tableRefs: [TP001]
  - id: capability-and-proof
    title: Architecture is differentiated, but proof remains issuer-led
    body: >-
      PsiBot's strongest public differentiation is architectural. At a 2025 company event, it
      described cloud training followed by lightweight edge inference, real-world data collection
      through proprietary exoskeletons, supervised fine-tuning, and reinforcement learning.
      The same company presentation disclosed a meaningful performance gap against Figure's
      cited Helix frequencies: PsiBot reported 30-50 Hz for its low-level module and about 1 Hz
      for its high-level module, versus 200 Hz and 7-9 Hz respectively for Figure. Independent
      reporting also notes that PsiBot's L3 label, thirty-minute mahjong demonstration, and
      claimed data-cost advantage have not been independently verified. The evidence supports
      technical differentiation, not benchmark leadership or production reliability.
    claimRefs: [CP003, CP004, CP006, CP007]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: commercial-and-distribution
    title: Scaled hardware rivals possess stronger distribution evidence
    body: >-
      Unitree and AGIBOT already present a different competitive asset: shipped hardware and
      manufacturing learning. Assigned sources report that Unitree generated RMB1.708 billion
      of 2025 revenue, shipped more than 5,500 humanoids, and had shifted more than half of its
      revenue mix toward humanoids by the first nine months of 2025. Yet another source reports
      that research and education represented 73.6% of Unitree's humanoid revenue from 2023
      through the first three quarters of 2025, while industrial and smart-manufacturing uses
      represented 9%. That mix limits how confidently shipments can be equated with mature
      factory demand. For PsiBot, strategic investors such as Chery and Lens Technology may
      provide industrial access, but investment relationships are not evidence of arm's-length
      customer adoption or exclusive distribution.
    claimRefs: [CP005, CP008, CP009, CP010, CP011]
    tableRefs: [TP003]
  - id: moat-and-displacement
    title: The moat depends on portability becoming a standard
    body: >-
      A hardware-agnostic intelligence layer can diversify exposure across robot bodies, but it
      is durable only if customers prefer an external model over their own core software. That
      condition is not established. Independent coverage says major Chinese humanoid makers are
      developing VLA models internally, while U.S. model specialist Physical Intelligence is
      reportedly raising at an above-US$11 billion valuation despite an undefined
      commercialization timeline. Assigned sources also conflict on Physical Intelligence's
      commercial maturity: one tracker claims an API, more than thirty licensees, and
      US$500,000 annual fleet pricing, while another says commercialization timing is undefined.
      PsiBot's public list pricing, contract structure, retention, integration cycle, and
      hardware portability remain undisclosed in the retained evidence. Until those gaps close,
      switching costs and platform power should be treated as hypotheses rather than demonstrated
      moat.
    claimRefs: [CP013, CP015, CP016]
callouts:
  - calloutType: strength
    title: Strategic position
    body: >-
      PsiBot can sell across hardware vendors in principle, and its cloud-training/edge-inference
      design targets a real deployment constraint rather than a single robot form factor.
    claimRefs: [CP001, CP004, CP016]
  - calloutType: risk
    title: Moat evidence is not yet public
    body: >-
      No retained source provides PsiBot list pricing, customer retention, paid fleet scale,
      independent benchmark leadership, or verified switching-cost evidence.
    claimRefs: [CP007, CP015, CP016]
tables:
  - id: TP001
    title: Competitor and alternative profile
    columns:
      - Competitor / alternative
      - Category
      - Public scale or funding evidence
      - Target customer / job
      - Differentiation
      - Evidence-backed limitation
    rows:
      - [PsiBot, "VLA model plus selected execution hardware", "Reported near-US$100M round at US$1.48B valuation; small-scale warehouse verification", "Logistics, manufacturing, retail and robot OEMs", "Hierarchical VLA, dexterous manipulation, data and simulation loop", "No disclosed revenue, list pricing, fleet count, retention, or independent benchmark"]
      - [Physical Intelligence, "Hardware-agnostic robot foundation models", "Reported talks for about US$1B at above-US$11B valuation; prior funding above US$1B", "Robot manufacturers needing a general manipulation model", "Unified model intended to span robot platforms", "Commercialization timing reported as undefined; assigned sources conflict on current licensing"]
      - [Unitree, "Vertically integrated robot manufacturer", "RMB1.708B 2025 revenue and more than 5,500 humanoid shipments reported", "Research, education, developers and emerging industrial buyers", "Low price, shipped hardware and manufacturing feedback loop", "Institution-heavy demand mix; industrial production-line adoption remains limited"]
      - [AGIBOT, "Vertically integrated humanoid manufacturer", "Company-reported 10,000th humanoid produced in March 2026", "Logistics, retail, hospitality and industrial manufacturing", "Rapid manufacturing ramp and deployment partnerships", "Commercial-operation share of produced units was not independently verified"]
      - [UBTECH, "Full-stack humanoid manufacturer", "Company-reported 13,361 UWORLD U1 orders on launch day", "Institutional, industrial, research and later service/care buyers", "Product tiers and public entry pricing", "Orders do not establish deployments, utilization, or repeat demand"]
      - [Figure AI, "AI-native humanoid manufacturer", "Tracker claims 200+ deployed units and US$8.5B total funding", "Factories, fulfillment and construction", "Integrated high-level reasoning and motion control", "Key scale, pricing, and performance figures come from a single tracker in the assigned pool"]
      - [NVIDIA, "Compute, simulation and developer infrastructure", "Tracker claims 150,000 Isaac developers", "Robot OEMs and model developers", "Cross-vendor compute, simulation, training and edge deployment stack", "Infrastructure dependency can reduce differentiation for application-layer vendors"]
      - ["Internal build / fixed automation", "Substitute and status quo", "No comparable market-wide figure in assigned evidence", "Large OEMs or facilities with narrow repetitive workflows", "Control of proprietary data, integration and safety process", "Higher internal engineering burden; fixed systems adapt poorly to novel tasks"]
    notes: >-
      Scale and funding figures are publisher-reported and use different dates, definitions, and
      denominators; unknown fields are not estimates, and production or orders are not treated as
      sustained commercial deployment.
    enumerationScope:
      coverage: sample
      basis: >-
        Assigned 2026 evidence covering model vendors, integrated manufacturers, infrastructure,
        and status-quo substitutes rather than a complete market census.
    claimRefs: [CP001, CP002, CP005, CP006, CP008, CP009, CP010, CP011, CP012, CP014, CP015]
  - id: TP002
    title: Feature and capability matrix
    columns:
      - Buying criterion
      - PsiBot
      - Physical Intelligence
      - Unitree / AGIBOT
      - Figure
      - NVIDIA
    rows:
      - ["Hardware independence", "Model-led, but also offers hand, robot, simulation and data tooling", "Explicitly model-led and intended for multiple robot platforms", "Low: integrated bodies and in-house models", "Low: integrated humanoid and model stack", "High: infrastructure offered across vendors"]
      - ["Dexterous manipulation", "Core claim; 21-DOF hand and long-horizon demonstrations reported", "General manipulation model focus; assigned evidence lacks a comparable dexterity benchmark", "Available through integrated humanoid products; comparable benchmark unavailable", "Company architecture cited by PsiBot as a frequency reference", "Enabling stack rather than end-task performance"]
      - ["Edge inference", "Company reports cloud training plus lightweight edge deployment", "Unknown in assigned evidence", "On-device capability implied by shipped robots; architecture detail unavailable", "PsiBot cites 7-9 Hz high-level and 200 Hz low-level frequencies", "Jetson edge compute is a core infrastructure offering"]
      - ["Deployment evidence", "Small-scale warehouse scenario verification reported", "Commercial timing disputed across assigned sources", "Thousands of units reported, but end-use mix is institution-heavy", "Tracker claims 200+ units across named facilities", "Developer adoption claimed; not itself end-customer deployment"]
      - ["Independent verification", "Scarce for L3, mahjong and data-efficiency claims", "No independent benchmark in assigned evidence", "Shipment and financial figures have multiple secondary reports; utilization remains uncertain", "No independent benchmark retained", "Adoption percentages in tracker are not independently corroborated"]
      - ["Distribution control", "Potential access through Chery and Lens investment relationships", "Investor network, but no hardware channel established in assigned evidence", "Direct product, retail, OEM and production channels", "Direct enterprise pilots and integrated product", "Broad developer and OEM ecosystem"]
    notes: >-
      This matrix records only capabilities present in the assigned fetched evidence. "Unknown"
      means the pool did not establish the criterion; it does not mean the capability is absent.
    claimRefs: [CP003, CP004, CP005, CP006, CP007, CP008, CP009, CP010, CP012, CP013, CP014]
  - id: TP003
    title: Public pricing and packaging evidence
    columns:
      - Offer
      - Public price / contract model
      - Included scope
      - Qualification
      - Competitive implication
    rows:
      - ["PsiBot Psi R1 / platform", Unknown, "VLA model, selected hardware, simulation, data and execution tooling", "No public list price or contract term in retained evidence", "Cannot compare procurement friction or realized economics"]
      - ["Unitree humanoids", "US$4,900 R1 Air to US$29,900 H2 in one May 2026 source; tax and shipping excluded", "Complete humanoid hardware by model", "Publisher cites public pricing; realized enterprise price and service terms unknown", "Low entry price broadens developer and institutional access"]
      - ["UBTECH UWORLD U1", "From RMB119,800", "Lite, Pro and Ultra product tiers", "Launch pricing; backlog and conversion to deployed units unknown", "Transparent tiering gives buyers a visible hardware budget anchor"]
      - ["Figure 03", "US$89,000 plus US$36,000/year service contract claimed by tracker", "Humanoid hardware plus annual service", "Single assigned tracker; not independently corroborated", "Bundled service makes lifecycle cost explicit but raises recurring spend"]
      - ["Physical Intelligence", "US$500,000/year per fleet claimed by tracker", "pi-zero model API / enterprise license", "Conflicts with separate report that commercialization timing is undefined", "Illustrates potential software licensing value, but not a reliable price benchmark"]
      - ["Internal build / fixed automation", Unknown, "Internal model development or conventional task-specific automation", "Cost varies by workflow, hardware, safety and integration; no pool-wide benchmark", "Retains data and control but shifts integration and maintenance burden to buyer"]
    notes: >-
      Prices are list or publisher-reported figures, not realized revenue, ARR, margin, or total
      cost of ownership. Currency, geography, tax, shipping, service, and contract vintages differ.
    claimRefs: [CP002, CP008, CP012, CP013, CP014, CP015]
figures:
  - id: FP001
    title: Competitive control point versus commercial evidence
    type: quadrant
    summary: >-
      Ordinal scoring separates hardware-agnostic platforms from integrated manufacturers and
      distinguishes public deployment evidence from model or financing evidence.
    data:
      xAxis: "Hardware independence (1 = integrated hardware; 5 = cross-hardware platform)"
      yAxis: "Public commercial evidence (1 = model or financing only; 5 = shipped or deployed product)"
      points:
        - label: PsiBot
          x: 3
          y: 2
          note: "Model-led positioning, but selected hardware and only small-scale warehouse verification are public."
        - label: Physical Intelligence
          x: 5
          y: 1
          note: "Hardware-agnostic model strategy; assigned sources conflict on commercialization."
        - label: Unitree
          x: 1
          y: 5
          note: "Integrated hardware with reported revenue and shipments, though demand is institution-heavy."
        - label: AGIBOT
          x: 1
          y: 4
          note: "Integrated manufacturer with company-reported 10,000-unit production milestone."
        - label: Figure
          x: 1
          y: 3
          note: "Integrated humanoid stack; deployment scale is reported by one assigned tracker."
        - label: NVIDIA
          x: 5
          y: 5
          note: "Cross-vendor infrastructure with broad claimed developer adoption, not an end-task robot."
    approximationNotes: >-
      Scores are analyst-authored ordinal positions from 1 to 5, not measured market shares or
      benchmark results. They summarize retained evidence on hardware coupling and public
      commercial proof; uncertain or single-source claims reduce the commercial-evidence score.
    claimRefs: [CP001, CP002, CP006, CP008, CP009, CP010, CP012, CP013, CP014]
