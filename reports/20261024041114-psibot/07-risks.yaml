company:
  name: Psibot
chapter:
  number: 7
  title: Risks
  summary: "Psibot's most material risks are regulatory exposure in China, unproven deployment economics, and dependence on industrial partners and the robotics supply chain. The evidence supports a research-more posture: several mitigations are visible, but key operating, compliance, and customer proof remains private or company-claimed."
sections:
  - id: regulatory-and-legal
    title: Regulatory and legal exposure
    body: >-
      China-specific cyber and data obligations are a material risk for an embodied-AI
      platform handling training data, robot telemetry, and potentially personal information.
      A legal analysis reports that amendments to China's Cybersecurity Law took effect on
      2026-01-01, introduced AI governance language, broadened extraterritorial reach, and
      increased maximum fines to RMB10 million depending on the violation. A separate legal
      analysis likewise describes higher penalties, expanded reach, and the importance of
      documented remediation. These sources describe the legal framework, not a Psibot
      violation; the diligence question is whether its data flows, customers, and deployed
      systems trigger the relevant obligations. There is also no assigned primary source
      establishing Psibot's licenses, litigation history, or enforcement status. The
      investment implication is a potentially asymmetric downside: compliance controls can
      reduce exposure, but an undocumented cross-border or incident-response posture could
      delay deployments or create fines and remediation costs.
    claimRefs: [CR001, CR002, CR003, CR004, CR014]
    tableRefs: [TR001]
  - id: operational-and-technical
    title: Operational, quality, and technical execution
    body: >-
      Psibot presents a full-stack model, data, simulation, and hardware strategy for
      logistics, retail, and industrial settings, but the strongest performance evidence in
      the assigned pool is either company-authored or a secondary summary of company
      demonstrations. The official site lists logistics and industrial products and model
      demonstrations, while third-party listings repeat the claimed Psi R1 long-horizon
      capabilities. Independent coverage explicitly says that Psibot's L3 classification and
      its demonstrations have scarce independent verification. That creates execution risk
      between a controlled demonstration and reliable production use: errors, integration
      time, safety controls, warranty exposure, and data-collection cost are not disclosed
      here. The broader robotics evidence also describes current deployments as limited and
      site-specific, and identifies dependence on foreign compute and precision-component
      inputs. The appropriate monitor is production evidence by site, task, uptime, safety
      incident, and unit economics rather than benchmark claims alone.
    claimRefs: [CR005, CR006, CR007, CR011, CR012, CR013]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: financial-and-partner
    title: Financial, partner, and concentration risk
    body: >-
      The latest assigned reporting describes more than $100 million of new financing from
      industrial and state-linked investors, while separate coverage describes a nearly
      $100 million round at about a $1.48 billion valuation. Dealroom records a March 2026
      $280 million financing at a $1.1 billion valuation and says the company targets
      high-value B2B scenarios, but it does not provide audited revenue, margins, burn,
      runway, customer concentration, or contract quality in the fetched text. Strategic
      investors can improve distribution and industrial access, yet they can also create
      related-party, channel, and customer-concentration questions. A platform strategy
      depends on manufacturers adopting the intelligence layer; if customers build models
      in-house or if a partner delays deployment, revenue conversion may lag the capital
      narrative. Until management provides cohort, contract, cash-use, and cap-table
      evidence, the financial risk should be treated as high-uncertainty rather than
      inferred from funding size.
    claimRefs: [CR008, CR009, CR010, CR015, CR016]
    tableRefs: [TR003]
callouts:
  - calloutType: risk
    title: Highest-priority diligence
    body: Obtain a China data-flow and AI-governance map, production deployment metrics, named customer references, audited financials, and the cap table before underwriting the current valuation.
    claimRefs: [CR001, CR004, CR007, CR009, CR010]
  - calloutType: assumption
    title: Thesis-break trigger
    body: Treat a material regulatory finding, repeated production safety or reliability failure, inability to verify customer deployments, or insufficient cash runway as a thesis-break event.
    claimRefs: [CR001, CR007, CR010, CR011]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Rule or exposure, Jurisdiction, Likelihood, Severity, Mitigation maturity, Residual exposure, Diligence path]
    rows:
      - [Cybersecurity Law amendments and AI governance duties, China, Medium, High, Partial, High, Obtain counsel-reviewed obligation and control map]
      - [Cross-border personal-information transfer requirements, China / cross-border, Medium, High, Unknown, High, Inventory data flows and identify applicable transfer pathway]
      - [Extraterritorial enforcement and incident penalties, China, Low-to-medium, High, Unknown, Medium-high, Review incident history and remediation evidence]
    notes: Legal analyses describe the framework and effective dates; no assigned primary source confirms Psibot's compliance status or an enforcement action.
    enumerationScope:
      coverage: partial
      basis: "Three principal China legal exposures identified from current assigned legal analyses; not a complete legal opinion or case search."
    claimRefs: [CR001, CR002, CR003, CR004, CR014]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Demo-to-production generalization failure, Medium-high, High, Partial, High, Site-level task and uptime data]
      - [Safety or reliability failure in dexterous manipulation, Medium, High, Unknown, High, Incident and validation records]
      - [Compute and precision-component supply constraint, Medium, Medium-high, Partial, Medium-high, Bill of materials and sourcing plan]
      - [Training-data cost or quality shortfall, Medium, Medium-high, Unknown, Medium-high, Audited data-collection economics]
    notes: Rows combine company-described capabilities with independent limitations on verification and deployment; residual exposure is an analytical rating, not a measured probability.
    claimRefs: [CR005, CR006, CR007, CR011, CR012, CR013]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or class, Role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Industrial investors and channels, Chery-linked funds and industrial investors, Capital and potential deployment access, Unclear, Strategic funding does not convert to paid production deployments, High, Verify contracts and related-party terms, High]
      - ["Robot manufacturers and integrators", Customer and partner ecosystem, Distribution and hardware integration, Unclear, Customers develop competing models or delay integration, High, "Obtain pipeline, win-rate, and reference data", High]
      - [Compute and precision components, Foreign and domestic infrastructure suppliers, Training and robot hardware inputs, Unclear, Export controls or supply interruption delays delivery, Medium-high, "Review sourcing, substitutes, and inventory policy", Medium-high]
    notes: Public sources identify strategic participation and broad supply-chain dependencies, but do not quantify Psibot's counterparty concentration or contractual protections.
    claimRefs: [CR008, CR009, CR012, CR015, CR016]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Regulatory, execution, and dependency risks cluster in the high-impact and low-verification quadrant.
    data:
      columns: [Likelihood, Impact, Mitigation maturity, Residual exposure]
      rows:
        - label: China cyber and AI compliance
          values: [High, High, Undisclosed, High]
        - label: Production generalization and safety
          values: [High, High, Early, High]
        - label: Partner and channel conversion
          values: [Medium, High, Partial, High]
        - label: Compute and component dependency
          values: [Medium, High, Unclear, High]
        - label: Financial disclosure
          values: [High, High, Funded, High]
        - label: Data-transfer exposure
          values: [Medium, High, Undisclosed, High]
    approximationNotes: Likelihood and residual exposure are qualitative assessments from the cited evidence and disclosed gaps, not statistical estimates.
    claimRefs: [CR001, CR007, CR011, CR012, CR015]
