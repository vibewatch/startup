      topic: capital-adequacy-gap
      missingEvidence: Cash balance, monthly burn, runway, debt, committed versus deployed financing, and next-round trigger.
      whyItMatters: Reported funding and valuation do not establish liquidity or financing dependency.
      diligencePath: Request the latest balance sheet, cash-flow statement, debt schedule, cap table, financing close documents, and operating plan.
      relatedQuestionRefs: [QI005, QI006]
      relatedTableRefs: [TI003]
    - type: conflicting-data
      severity: material
      topic: financing
      missingEvidence: Definitive closing documents reconciling the July report of a nearly $100 million round with the August report of a completed round over $100 million.
      whyItMatters: The reports may describe the same transaction at different stages or separate financings; adding them would overstate capital raised.
      diligencePath: Obtain executed financing announcements or cap-table and bank-receipt evidence for each round.
      relatedQuestionRefs: [QI005, QI006]
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Named, contactable customer references and revenue concentration separating arm's-length from strategic-investor relationships.
      whyItMatters: Pilot announcements and strategic investment can overstate repeatable third-party demand.
      diligencePath: Request customer consented references, top-customer revenue shares, related-party flags, and renewal or expansion history.
      relatedQuestionRefs: [QI003, QI007]
      relatedTableRefs: [TI003]
