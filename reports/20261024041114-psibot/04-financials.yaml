company:
  name: Psibot
chapter:
  number: 4
  title: Financials
  summary: PsiBot has a strategic-capital-backed platform model, but public evidence supports financing activity and intended deployment more strongly than recurring revenue, margins, or cash adequacy. The underwriting case therefore depends on converting model and data capabilities into repeatable licensing or deployment economics that are not yet disclosed.
sections:
  - id: monetization-and-revenue-quality
    title: Monetization and revenue quality
    body: >-
      PsiBot positions its intelligence layer for industrial, logistics, retail, and other embodied-AI deployments rather than presenting a conventional hardware product line. Its public surfaces present a logistics and industrial robot, a teleoperation glove, and a modular whole-machine solution, while third-party Psi R1 references describe a model intended for industry, logistics, retail, and end-customer applications. A separate industry account characterizes the strategy as licensing intelligence to manufacturers and pairing the model with a dexterous hand, simulation tooling, and training-data platforms. These descriptions establish plausible revenue mechanisms—model or platform licensing, integration or deployment work, and potentially hardware or data-system sales—but do not establish realized revenue, recurring revenue, take rate, backlog, or revenue mix. Official pricing, contract terms, discounting, and recognition policy are not publicly evidenced in the reviewed sources.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
  - id: go-to-market-and-unit-economics
    title: GTM motion and unit economics
    body: >-
      The available go-to-market signal is strategic and deployment-oriented: the July 2026 reporting says pilots were live with a major Chinese logistics vendor and a large fiber-optic cable maker, while the August briefing says funding will support research, human-operation data collection, and deployments in logistics and advanced manufacturing. PsiBot's own page presents logistics and industrial robot applications, a teleoperation glove, and task demonstrations, which is consistent with an integration-heavy enterprise motion. However, there is no public evidence here for sales-cycle length, customer acquisition cost, implementation fees, gross margin, service-level economics, utilization, payback, or expansion behavior. The likely commercial bottleneck is not only model performance but also deployment, integration, and data-collection cost per customer.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: capital-adequacy-and-financing-dependency
    title: Capital adequacy and financing dependency
    body: >-
      PsiBot has access to substantial strategic financing signals, but financing raised is not cash available and a reported round is not a balance-sheet disclosure. A July 23 account attributed to Bloomberg described a nearly $100 million round at a $1.48 billion valuation and approximately $300 million of total funding since inception, while a separate August 28 briefing reported completion of a new round of over $100 million. The July account explicitly cautioned that its deal was close but not signed and terms could change, so the two reports should not be mechanically added. Neither assigned source discloses cash on hand, burn, runway, debt, working-capital needs, committed versus deployed capital, or the next financing trigger. The planned use of funds—research, data collection, and deployments—implies continuing capital needs before commercial scale is proven.
    claimRefs: [CI009, CI010, CI011, CI012]
  - id: underwriting-verdict-and-diligence-blockers
    title: Financial verdict and diligence blockers
    body: >-
      The financial picture is investable only as an evidence-limited option on platform adoption, not as an underwritten cash-flow or margin story. PsiBot's model and data assets may support licensing, integration, and deployment revenue, but no assigned source supplies audited revenue, ARR, gross margin, customer concentration, contract duration, realized pricing, or cash runway. A competitor benchmark illustrates why those omissions matter: Unitree's 2025 prospectus materials report 2025 revenue of 1.70 billion yuan and gross margins around 60%, while a contemporaneous report describes first-quarter 2026 revenue growth alongside a sharp adjusted-profit decline and rising R&D and sales expense. That benchmark is not a PsiBot estimate; it shows the sector can scale revenue while profitability compresses. PsiBot should not be valued on revenue multiples until management provides a reconciled revenue bridge and evidence of repeatable customer economics.
    claimRefs: [CI013, CI014, CI015, CI016]
callouts:
  - calloutType: risk
    title: Financing does not substitute for commercial proof
    body: Strategic rounds support runway optionality, but the assigned evidence does not establish cash available, burn, runway, realized pricing, or recurring revenue.
    claimRefs: [CI010, CI012, CI015]
  - calloutType: recommendation
    title: Request a reconciled revenue and cash package
    body: Before underwriting, request audited or management-reconciled revenue by stream, signed contract and backlog support, gross-margin drivers, cash and debt schedules, monthly burn, and customer concentration.
    claimRefs: [CI004, CI008, CI012, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns: [Stream, Mechanism, Unit or basis, Current public value/status, Quality, Diligence ask]
    rows:
      - [Model or platform licensing, Intelligence layer supplied to robot manufacturers, Per deployment or contract; exact unit undisclosed, "Strategic positioning is described; realized revenue is undisclosed", "Company and third-party descriptions; no financial reconciliation", "Signed license terms, annualized contract value, renewal and usage rights"]
      - [Deployment and integration, Logistics and advanced-manufacturing deployments, Project or site basis; pricing undisclosed, "Pilots/deployments are reported, but revenue and backlog are not disclosed", "Third-party reported and company-surface context", "Pilot-to-production conversion, implementation fees, acceptance milestones"]
      - [Data collection and teleoperation systems, Human-operation data collection and teleoperation glove, "Per hour, device, or service; pricing undisclosed", "Product and funding-use descriptions exist; realized sales are not evidenced", "Official product surface and third-party reporting", "Data ownership, collection cost per hour, customer billing and gross margin"]
      - [Hardware or component-linked offerings, Dexterous hand and modular whole-machine solution, Per unit or bundled system; price undisclosed, "Capability and deployment claims exist; unit volume and revenue mix are unknown", "Official and independent reference descriptions", "BOM, yield, warranty, service cost, inventory and contract manufacturer terms"]
    notes: "Public descriptions identify possible mechanisms, not recognized revenue. Null or undisclosed values mean the assigned sources do not provide a reconciled amount or realized price."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization table
    columns: [Commercial element, Public list or realized price, Contract model, Discount or uncertainty, Source implication]
    rows:
      - [Psi R1 or foundation-model access, null, Licensing or platform access is described but contract form is undisclosed, "No public list price or realized price", "Cannot calculate ARR, gross margin, or payback"]
      - [Dexterous hand or robot system, null, Hardware or bundled deployment is described, "No public unit price, volume, warranty, or service terms", "Do not treat capability claims as hardware revenue"]
      - [Teleoperation and data services, null, Data and control use is described, "No public hourly, device, or project pricing", "Data-collection economics remain a diligence gap"]
      - [Customer deployment, null, Pilot and deployment activity is reported, "No public implementation fee, backlog, acceptance, or renewal terms", "Pilot activity cannot be converted into revenue"]
    notes: "No assigned source provides official list pricing or realized customer pricing. The table preserves pricing as unavailable rather than treating funding, valuation, or product descriptions as revenue."
    claimRefs: [CI003, CI004, CI005, CI008]
  - id: TI003
    title: Unit economics table
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue or ARR, null, low, "No assigned source discloses recognized revenue, ARR, backlog, or recurring mix", "Monthly revenue bridge by stream, customer, geography, and recognition policy"]
      - [Gross margin, null, low, "Model, data, integration, and hardware/service costs could produce materially different margins", "Gross-margin bridge including compute, data collection, support, warranty, and deployment labor"]
      - ["CAC, sales cycle, and payback", null, low, "Enterprise deployments may require long pilots and costly integration", "Cohort-level funnel, sales expense allocation, cycle length, implementation cost, and payback"]
      - [Burn and runway, null, low, "Funding reports do not disclose cash balance, monthly burn, debt, or committed capital", "Latest cash/debt schedule, monthly burn, runway case, and next-round trigger"]
      - [Customer concentration and expansion, null, low, "Named pilot references do not establish arm's-length recurring demand or expansion", "Top-customer revenue, related-party exposure, contract duration, renewal, and expansion data"]
    notes: "Every null is an unavailable public metric, not zero. The requested diligence items are required to distinguish a funded research program from a repeatable commercial platform."
    claimRefs: [CI005, CI008, CI012, CI015, CI016]
