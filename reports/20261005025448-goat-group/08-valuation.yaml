callouts:
  - calloutType: "recommendation"
    title: "Capital Discipline Mandate: Avoid Historical Secondary Marks Without Audited Proof"
    body: "Investors should reject transactions anchored to the $3.7B Series F headline valuation. Secondary market offers in growth-stage consumer marketplaces frequently lag public market repricing by years. Given public comparables trading below 2.0x revenue, underwriting GOAT Group requires verified audited financials, board-approved cap-table capitalization tables, and a minimum entry discount of 70% to historical private rounds."
    claimRefs:
      - "CV004"
      - "CV007"
      - "CV011"
      - "CV012"
  - calloutType: "risk"
    title: "Downside Exposure from Liquidation Preference Overhang"
    body: "With over $490M in cumulative capital raised through Series F and strategic corporate rounds, senior institutional investors hold significant liquidation preference rights. If an eventual exit or recapitalization occurs at normalized peer multiples ($500M-$800M EV), preferred return thresholds could heavily dilute or wipe out junior equityholders and secondary common stock buyers."
    claimRefs:
      - "CV003"
      - "CV008"
      - "CV010"
      - "CV016"
