      - number: '5.2'
        title: Backend Service Architecture, Event Streaming, and Enterprise Integration
        blocks:
          - type: paragraph
            body: >-
              The engineering infrastructure underpinning GOAT Group's transaction processing and catalog management is
              structured as a distributed, event-driven microservices architecture built primarily in Go and Ruby on
              Rails with Sorbet type-checking. The alias seller engineering pod operates Go microservices managing
              high-volume listing events, real-time pricing adjustments, and fulfillment workflows across AWS cloud
              infrastructure, leveraging event buses such as AWS SQS or Apache Kafka alongside gRPC and Protocol Buffers
              for high-throughput service-to-service RPC communication. Relational transaction state and user ledgers
              interface with scalable PostgreSQL database clusters, complemented by AWS DynamoDB NoSQL stores
              implementing single-table designs and Global Secondary Indexes for low-latency operational data access.
              Search and catalog discovery depend on distributed index clusters such as OpenSearch or Elasticsearch,
              while distributed observability is maintained via telemetry tooling such as Honeycomb and Datadog.
              Enterprise HR and identity backbones utilize ADP Lyric and Okta identity provisioning alongside cloud
              analytical warehousing environments such as Snowflake.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
