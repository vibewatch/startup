              - CU010
              - CU014
      - number: '6.3'
        title: Customer Durability, Retention Dynamics, and Channel Friction
        blocks:
          - type: paragraph
            body: >-
              Evaluating customer retention and revenue concentration for GOAT Group is fundamentally constrained by the
              company's private reporting posture. While registered membership has scaled across 170 countries,
              management does not publicly disclose active transacting buyer counts, repeat buyer frequency, annual
              churn rates, Net Revenue Retention (NRR), or Gross Revenue Retention (GRR). Customer durability is
              structurally exposed to macroeconomic discretionary spending cycles and secondary sneaker price deflation,
              which directly compress gross transaction margins and seller listing velocity. Furthermore, buyer and
              seller satisfaction remains vulnerable to fulfillment latency inherent in the ship-to-verify logistics
              model, where goods must travel from seller to regional authentication facilities—such as Fontana and
              Carson, California, or Easton, Pennsylvania—prior to buyer dispatch. Authentication disputes, strict
              condition grading standards, and return restrictions present recurring operational friction that affects
              long-term customer lifetime value and platform sentiment.
            claimRefs:
              - CU002
              - CU004
              - CU007
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
          - type: table
            tableRef: TU003
