      - number: '3.3'
        title: Portfolio integration is visible; comparative economics are not
        blocks:
          - type: paragraph
            body: >-
              The visible capability stack spans authentication, physical retail, marketplace brands, seller-facing
              software, and internal enterprise systems. A reposted GOAT Group role describes identity, endpoint, SaaS
