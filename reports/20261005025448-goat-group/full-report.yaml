chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Operating Model
        blocks:
          - type: paragraph
            body: >-
              GOAT Group is an e-commerce holding company established in 2018 following the merger of the online sneaker
              marketplace GOAT, founded in 2015 by Eddy Lu and Daishin Sugano, with retail consignment pioneer Flight
              Club [CO001]. The group operates four primary marketplace brands spanning primary and secondary resale:
              GOAT, Flight Club, alias (its dedicated seller listing tool launched in 2020), and Grailed (acquired in
              2022) [CO001, CO002]. Operating from corporate headquarters at 3960 Landmark Street in Culver City,
              California, GOAT Group employs a ship-to-verify authentication model across a network of global
              facilities, serving more than 30 million registered members and over 600,000 sellers globally [CO003,
              CO004, CO005]. While third-party estimates attribute $248M in 2024 revenue to the company, official GAAP
              revenue, margins, and operational profitability remain strictly undisclosed [CO006, CO007].
