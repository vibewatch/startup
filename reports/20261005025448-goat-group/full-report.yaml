  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundaries, Category Scope, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              GOAT Group positions its marketplace platforms at the intersection of the secondary resale and primary
              retail markets for sneakers, streetwear apparel, and luxury accessories. The market boundary encompasses
              authenticated secondary footwear transactions, deadstock collectible sneakers, contemporary and archival
              apparel consignment, and brand-direct primary drops across digital surfaces and physical consignment
              stores. Excluded from this boundary are unauthenticated general merchandise resale, mass unvetted thrift
              apparel, standard wholesale department store retail, and low-ASP discount footwear liquidation. Within
              this perimeter, GOAT Group's primary competitive substitutes remain generalist peer-to-peer marketplaces
              such as eBay, specialized luxury consignment platforms such as The RealReal and Vestiaire Collective,
              pure-play sneaker bidding exchanges like StockX, and traditional physical consignment stores. The
              platform's addressable spend is heavily shaped by consumer willingness to pay an authentication premium to
              mitigate widespread counterfeit risk in high-heat collectible categories.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing Lenses, Addressable Market Estimates, and Growth Discrepancies
        blocks:
          - type: paragraph
            body: >-
              Evaluating GOAT Group's total addressable market requires contrasting broad industry macro projections
              against category-constrained secondary footwear and apparel realities. Historical third-party research and
              industry estimates have projected the global sneaker resale market to reach between $6 billion and $30
              billion over the long term, with broader apparel resale and secondhand fashion markets projected to exceed
              $100 billion to $200 billion globally. However, these aggregate figures conflate high-margin authenticated
              collectible sneakers with low-margin everyday secondhand clothing and unmonetized peer transactions. In
              reality, GOAT Group's historical gross merchandise value reached $2 billion across its platforms, while
              third-party analyst estimates placed GOAT Group's net revenue around $248 million. This discrepancy
              highlights the critical distinction between total gross merchandise volume transacted across platforms and
              the actual net marketplace take-rate monetization achieved by the holding company. Constrained sizing
              demonstrates that while secondary sneaker demand expanded rapidly through 2021, category-specific volume
              has faced deceleration as primary brand distribution strategies evolve.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
