      - number: '2.3'
        title: Buyer Segmentation, Value Drivers, and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption across GOAT Group's multi-brand ecosystem is governed by distinct participant segments with
              varying price sensitivity, purchase frequency, and workflow requirements. Core consumer cohorts include
              dedicated sneaker enthusiasts and collectors seeking verified authentic grails, mainstream fashion-forward
              Gen Z and millennial buyers purchasing contemporary streetwear, and institutional or professional
              resellers managing high-volume cross-platform inventory. Resellers rely on dedicated tools such as the
              alias platform for dynamic pricing, automated listing management, and bulk fulfillment, while retail
              buyers prioritize authentication guarantees, seamless mobile discovery, and curated brand aesthetics
              across GOAT, Grailed, and Flight Club. However, adoption is structurally constrained by several market
              headwinds: substantial seller fees and buyer shipping surcharges, shipping transit latency inherent in
              centralized ship-to-verify authentication hubs, softening secondary market price premiums on core
              silhouette franchises such as Air Jordans and Dunks, and broader macroeconomic pressure on discretionary
              youth consumer spending.
            claimRefs:
              - CM001
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM003
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The GMV versus Net Revenue Gap in Marketplace Sizing
            body: >-
              Market sizing analyses in the sneaker resale sector frequently cite multi-billion dollar TAM figures based
              on gross transaction volume. However, marketplace operators capture only a fractional take-rate (typically
              9% to 15% effective net fee margin after payment processing, shipping subsidies, and seller tier
              discounts). Sizing GOAT Group against a $30 billion GMV horizon obscures the reality that its net revenue
              scale was estimated at $248 million in 2024, emphasizing that operating margin expansion depends on higher
              take-rates, value-added services, or primary retail partnerships.
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
          - type: callout
            title: Secondary Silhouette Saturation and Demand Diversification
            body: >-
              Historically, secondary sneaker platforms were overwhelmingly dependent on high-volume trading of Nike,
              Jordan, and Yeezy franchises. Recent market intelligence from GOAT Group's alias platform reveals a
              critical shift: while classic retros face demand fatigue, emerging athletic brands such as ASICS (+645%
              sales) and Anta (+799% sales) are capturing share. Managing catalog breadth across rapidly shifting
              subcultural trends introduces operational inventory forecasting and authentication complexity.
            calloutType: risk
            claimRefs:
              - CM005
              - CM010
              - CM015
              - CM016
