  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      End-to-end customer lifecycle across onboarding discovery, authentication escrow fulfillment, and buyer-to-seller
      expansion loops.
    data:
      items:
        - label: Marketplace Discovery & Onboarding
          detail: Consumer downloads GOAT app or visits Grailed/Flight Club web surfaces across 170 countries
          touchpoints:
            - App store catalog browsing and sneaker drop alerts
            - Social discovery, brand collaborations, and influencer curation
            - Account profile registration and preference configuration
        - label: Product Selection & Transaction Clearing
          detail: Buyer purchases verified sneaker or apparel listing with escrow payment hold
          touchpoints:
            - Catalog price comparison and instant vs standard shipping selection
            - Integrated payment processing via third-party gateways
            - Immediate automated shipping notification dispatched to merchant
        - label: Physical Verification & Fulfillment
          detail: Seller dispatches item to regional intake center for physical authenticity inspection
          touchpoints:
            - Facility intake at Carson, Fontana, or Easton fulfillment hubs
            - Multi-point authentication verification checking materials and box labels
            - Repackaging and final insured dispatch to buyer with authentication tag
        - label: Post-Sale Engagement & Retention
          detail: Buyer receives authenticated order; delivery confirmation clears transaction
          touchpoints:
            - Mobile push delivery notification and in-app order completion
            - Collection tracking and digital sneaker portfolio inventory viewing
            - Automated product recommendation feeds driving repeat browsing
        - label: Seller Onboarding & Supply Expansion Loop
          detail: Satisfied buyer transitions into seller via alias integration or Grailed P2P listing
          touchpoints:
            - Automated catalog barcode scanning and instant price setting tools
            - Identity and tax verification compliance via Persona biometric scanning
            - Seller payout disbursement to bank ledger upon verification approval
        - label: Loyalty & High-Frequency Power Trading
          detail: Power reseller or avid collector operates ongoing inventory rotation
          touchpoints:
            - alias market report intelligence monitoring brand demand surges
            - Consignment inventory rotation across digital and retail channels
            - High-value trade participation and VIP customer service interaction
    approximationNotes: Journey stages mapped from consumer transaction flows, seller documentation, and identity compliance protocols.
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU005
      - CU006
      - CU010
