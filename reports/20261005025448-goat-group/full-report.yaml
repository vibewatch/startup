      - number: '3.4'
        title: The moat rests on trust and liquidity while fashion demand keeps shifting
        blocks:
          - type: paragraph
            body: >-
              GOAT's strongest supported differentiation is the combination of transaction trust, multi-brand reach, and
              multiple routes to market. Durability is less certain. The official alias market report shows sharp
              changes in brand and silhouette demand, including large reported increases for ASICS and Anta,
              illustrating how rapidly assortment advantage can migrate with consumer taste. Portfolio control may help
              GOAT capture those shifts, but company-issued trend data is not an independent benchmark of authentication
              quality, fulfillment performance, liquidity, or customer preference. Without comparable peer metrics, the
              same breadth could represent a coordination burden rather than lock-in. Underwriting should therefore
              treat the moat as plausible but unproven, with trust outcomes and seller economics as the decisive
              diligence tests.
