    rows:
      - - Investment Thesis
        - >-
          Defensible physical authentication moat and premium multi-brand footprint across GOAT, Flight Club, Grailed,
          and alias
        - Over 30M members, 600K sellers, $2B historical GMV, and physical presence across 13 global hubs
        - Evidence of persistent margin erosion or major counterfeit leakage incidents undermining brand trust
      - - Anti-Thesis
        - Valuation is decoupled from verifiable fundamentals with unquantified capital intensity and burn
        - Peak $3.7B Series F mark compared to $248M 2024 estimated revenue without margin or cash disclosure
        - Audited financial disclosure proving sustained net profitability and positive operating cash flow
      - - Competitive Defense
        - Consolidated supply control through alias app and brick-and-mortar presence in NY, LA, and Miami
        - Omnichannel brand portfolio spanning primary luxury, streetwear, and secondary sneakers
        - Market share gains by zero-fee platforms or peer marketplaces disintermediating authentication
      - - Governance & Liquidity
        - Severe private illiquidity and structural liquidation preference overhang for junior shareholders
        - Capital raised totaling $490M across multiple preferred rounds without an active secondary liquidity path
        - Establishment of transparent secondary trading facility or filing of registration statement
    notes: Synthesis of bull-thesis strengths against structural operating and information-opacity anti-thesis risks.
    claimRefs:
      - CV001
      - CV005
      - CV007
      - CV010
      - CV013
  - id: TV003
    title: Bull, Base, and Bear Underwriting Scenarios
    columns:
      - Scenario
      - Assumed Operating Metrics
      - Implied Valuation Range
      - Implied Multiple Logic
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - Revenue expands to $450M+, gross margins exceed 35%, apparel GMV outpaces sneakers
        - $1,200M - $1,800M
        - 2.5x - 4.0x EV / Revenue reflecting premium fashion marketplace multiple
        - Sneaker category cyclicality, customer acquisition cost inflation, tariff headwinds
        - Low (15%)
      - - Base Case
        - Revenue stabilizes at $250M - $300M, margins hover near 20%-25%, modest international growth
        - $500M - $750M
        - 1.5x - 2.5x EV / Revenue matching mature specialty e-commerce comparables
        - Warehouse inspection bottlenecks, margin compression from logistics overhead
        - Moderate (60%)
      - - Bear Case
        - Revenue declines below $200M under intense competition, negative cash flow forces down-round
        - $200M - $350M
        - 0.8x - 1.2x EV / Revenue reflecting distressed liquidation and preference overhang
        - Sustained inventory obsolescence, seller defection, senior liquidation cramdown
        - High (25%)
    notes: Valuation ranges modelled on estimated $248M revenue baseline and public peer trading multiples.
    claimRefs:
      - CV006
      - CV011
      - CV012
      - CV014
      - CV015
      - CV016
