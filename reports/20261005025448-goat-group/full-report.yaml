              - CV010
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV011
              - CV012
      - number: '8.2'
        title: Financing Context, Capital Structure, and Comparable Multiples
        blocks:
          - type: paragraph
            body: >-
              GOAT Group closed its $195 million Series F financing round in June 2021, which more than doubled the
              company's valuation from $1.8 billion in September 2020 to $3.7 billion. The round was led by Park West
              Asset Management alongside funds advised by T. Rowe Price Associates, Franklin Templeton, Adage Capital
              Management, and Ulysses Management, following a prior strategic investment from Kering holding company
              Groupe Artemis in January 2021. At the time of the Series F, GOAT Group highlighted trailing 12-month
              Gross Merchandise Value of $2 billion, 100% year-over-year growth in sneakers, and 500% year-over-year
              growth in apparel. Public market comparable marketplaces such as eBay, RealReal, Farfetch, and Etsy trade
              at 0.5x to 2.5x trailing revenue multiples in current market environments. Applying a growth-marketplace
              multiple of 1.0x to 2.0x to third-party estimated revenue of $248M yields an implied equity enterprise
              value between $248M and $496M, representing an 86% to 93% discount to the Series F headline valuation.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: Bull, Base, and Bear Return Scenarios with Diligence Triggers
        blocks:
          - type: paragraph
            body: >-
              Underwriting GOAT Group requires evaluating three distinct operational scenarios against structural market
              opacity. In the bull case, GOAT accelerates high-margin apparel through Grailed and alias seller tools,
              expands primary retail partnerships, and scales international GMV through facilities in Shanghai, Japan,
              and Singapore, justifying a $1.2B to $1.8B valuation in an eventual public exit. In the base case, resale
              growth normalizes to mid-single digits as sneaker release hype cools, leaving enterprise value compressed
              to $500M to $750M under ongoing warehouse operating overhead. In the bear case, severe counterfeit
              disputes, warehouse labor friction, and tariff headwinds compress net take-rates, prompting a distressed
              secondary markdown below $300M. Key thesis-break triggers include disclosure of negative operating cash
              flows, liquidation preference overhang from late-stage Series F investors, and ongoing seller attrition
              toward unauthenticated or zero-fee competitive platforms.
            claimRefs:
              - CV005
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Capital Discipline Mandate: Avoid Historical Secondary Marks Without Audited Proof'
            body: >-
              Investors should reject transactions anchored to the $3.7B Series F headline valuation. Secondary market
              offers in growth-stage consumer marketplaces frequently lag public market repricing by years. Given public
              comparables trading below 2.0x revenue, underwriting GOAT Group requires verified audited financials,
              board-approved cap-table capitalization tables, and a minimum entry discount of 70% to historical private
              rounds.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV007
              - CV011
              - CV012
          - type: callout
            title: Downside Exposure from Liquidation Preference Overhang
            body: >-
              With over $490M in cumulative capital raised through Series F and strategic corporate rounds, senior
              institutional investors hold significant liquidation preference rights. If an eventual exit or
              recapitalization occurs at normalized peer multiples ($500M-$800M EV), preferred return thresholds could
              heavily dilute or wipe out junior equityholders and secondary common stock buyers.
            calloutType: risk
            claimRefs:
              - CV003
              - CV008
              - CV010
              - CV016
