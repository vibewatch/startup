      - number: '4.2'
        title: Cost Structure, Unit Economics, and Operational Margin Friction
        blocks:
          - type: paragraph
            body: >-
              The cost structure of GOAT Group's ship-to-verify operating model differs fundamentally from asset-light
              peer-to-peer classifieds due to mandatory physical handling and centralized authentication. Each
              transaction routed through GOAT requires cross-shipping from seller to a regional intake facility—such as
              facilities in Carson, Fontana, Easton, or Shanghai—where trained authenticators and computer-vision
              verification tools inspect product provenance before forwarding items to the buyer. This fulfillment
              architecture introduces direct variable costs including two-leg inbound/outbound shipping subsidies,
              specialized authentication labor overhead, intake handling, packaging, and credit card processing charges.
              In addition, engineering talent compensation reflects market-rate software development costs, with backend
              software engineering roles commanding geographic salary tiers ranging from $124,800 to $184,000 across
              U.S. markets. Furthermore, platform gross margin is heavily influenced by authentication error rates,
              counterfeit dispute settlements, and chargebacks. Because GOAT Group does not disclose contribution
              margins, customer acquisition cost (CAC), buyer lifetime value (LTV), or average order value (AOV),
              investors face substantial diligence uncertainty regarding whether transaction take rates sustainably
              cover physical verification expenses.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI006
          - type: table
            tableRef: TI003
