      - number: '1.2'
        title: Executive Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              The group is led by co-founder and Chief Executive Officer Eddy Lu alongside co-founder Daishin Sugano,
              who established the original platform after personal experiences with counterfeit sneakers in the
              secondary market [CO001, CO008]. Executive leadership has maintained key-person centrality since
              inception, steering the business through successive platform acquisitions and international expansion
              [CO001, CO008]. However, formal board structure, independent committee oversight, and non-executive
              director designations remain entirely opaque in public corporate disclosures [CO009]. Independent
              workforce tracking by Revelio Labs reveals material organizational restructuring: total worldwide
              headcount contracted by 41.6% from 1,911 personnel in 2023 to 1,116 as of March 2026, including a 29.6%
              year-over-year contraction in 2026 [CO010]. Active job postings simultaneously cooled to 48 roles in 2026,
              reflecting disciplined cost containment and workforce rationalization across engineering and operations
              [CO010].
