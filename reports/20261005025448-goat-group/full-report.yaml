  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Multi-Brand Product Architecture and Resale User Workflows
        blocks:
          - type: paragraph
            body: >-
              GOAT Group delivers secondary and primary marketplace infrastructure across four core consumer-facing and
              seller-facing platforms: GOAT, Flight Club, Grailed, and alias. GOAT operates as an authentication-driven
              e-commerce platform offering new and used sneakers, apparel, and accessories to over 60 million global
              members across 170 countries, utilizing a ship-to-verify logistics pipeline to validate merchandise before
              releasing payment. alias functions as the dedicated listing and supply-side operating system, powering
              onboarding, inventory management, dynamic pricing tools, and order fulfillment across global sellers.
              Grailed provides an enthusiast-driven peer-to-peer marketplace focusing on rare luxury, streetwear, and
              vintage menswear and womenswear, while Flight Club provides physical retail consignment across
              brick-and-mortar storefronts in New York, Los Angeles, and Miami alongside its digital e-commerce
              storefront. Together, these surfaces handle high-velocity catalog search, transaction clearing, and
              physical inspection handoffs across fragmented secondhand fashion markets.
