  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Marketplace Revenue Streams and Monetization Mechanics
        blocks:
          - type: paragraph
            body: >-
              GOAT Group generates top-line revenue through take-rate monetization spanning buyer-side and seller-side
              transaction fees across its multi-brand platform portfolio. The group's primary consumer surfaces include
              the digital GOAT marketplace, brick-and-mortar and digital consignment under Flight Club, peer-to-peer
              streetwear trading via Grailed, dedicated seller operating software through alias, and the newly launched
              mass-market footwear portal Sneakers.com. In marketplace transactions, revenue is recognized on a net
              take-rate basis rather than full gross merchandise value (GMV), consisting of fixed cash-out fees, tiered
              seller commissions based on seller rating and cancellation history, and buyer shipping and authentication
              surcharges. For consignment operations conducted through Flight Club, the monetization mechanism functions
              through higher-percentage consignment commissions deducted from realized retail sales. While third-party
              aggregators such as GetLatka claim that GOAT Group achieved $248M in revenue in 2024, the absence of
              audited primary financial statements prevents verification of revenue recognition policies, gross
              merchandise volume conversion rates, promotional discount adjustments, and the precise breakdown between
              digital marketplace fees and retail consignment revenue.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
