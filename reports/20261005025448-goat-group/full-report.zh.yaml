  - id: FE001
    title: GOAT Group 多层技术与物流栈
    type: stack
    summary: 六层平台结构，详细呈现消费者界面、微服务架构、数据基础设施及实体履约枢纽。
    data:
      layers:
        - label: 客户端展示与移动渠道
          detail: 面向消费者的原生移动应用和响应式网页客户端，覆盖不同买家群体
          modules:
            - GOAT iOS 与 Android 原生应用
            - Flight Club 网页电商店面
            - Grailed 网页与移动社区市场
        - label: 卖家与寄售运营前端
          detail: 面向商户供给侧运营的专用工具和销售点界面
          modules:
            - alias 专用转售运营应用
            - Flight Club 实体零售 POS 系统
            - B2B 寄售与大卖家仪表盘
        - label: 核心应用与分布式微服务
          detail: 协调商品目录事件、价格发现和订单生命周期的服务网格
          modules:
            - 基于 Go 的分布式卖家与履约服务
            - 使用 Sorbet 类型系统的 Ruby on Rails API 服务
            - gRPC 与 Protocol Buffers 跨服务网格
            - 实时定价与目录查询服务
        - label: 数据持久化与运营缓存
          detail: 事务账本与低延迟运营 NoSQL 存储
          modules:
            - PostgreSQL 托管高可用集群
            - Amazon DynamoDB 运营 NoSQL 文档存储
            - OpenSearch 与 Elasticsearch 目录搜索集群
        - label: 异步消息与可观测性基础设施
          detail: 事件流管道、遥测监控和企业身份系统
          modules:
            - AWS SQS 与 Apache Kafka 事件流管道
            - Honeycomb 与 Datadog 分布式可观测性遥测
            - Okta 身份与 ADP HR 企业数据集成
        - label: 实体物流与鉴定网络
          detail: 收货验证仓库、配送枢纽及交叉转运设施
          modules:
            - Culver City 全球总部与技术总部
            - Carson 与 Fontana CA 高吞吐配送中心
            - Easton PA 东海岸履约与支持枢纽
            - 上海中国区域物流交叉转运设施
    approximationNotes: 平台分层综合了经核实的公开工程规格、架构披露和实体设施布局。
    claimRefs:
      - CE001
      - CE007
      - CE008
      - CE009
      - CE010
      - CE011
      - CE013
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 覆盖发现与入驻、鉴定托管履约及买卖双方扩展循环的端到端客户生命周期。
    data:
      items:
        - label: 市场发现与入驻
          detail: 消费者下载 GOAT 应用，或访问覆盖 170 个国家的 Grailed / Flight Club 网页入口
          touchpoints:
            - 应用商店目录浏览与球鞋发售提醒
            - 社交发现、品牌联名与达人策展
            - 账户资料注册与偏好设置
        - label: 选品与交易清算
          detail: 买家购买已验证的球鞋或服装商品，托管付款暂时冻结
          touchpoints:
            - 目录价格比较，以及即时或标准配送选择
            - 通过第三方网关完成集成式支付处理
            - 自动向商户即时发送发货通知
        - label: 实体验证与履约
          detail: 卖家将商品发往区域收货中心，进行实体真伪检查
          touchpoints:
            - 在 Carson、Fontana 或 Easton 履约枢纽收货
            - 多点鉴定，检查材料与鞋盒标签
            - 重新包装后，将带鉴定标签的商品投保寄送给买家
        - label: 售后互动与留存
          detail: 买家收到已鉴定订单；确认收货后交易结清
          touchpoints:
            - 移动推送配送通知与应用内订单完成
            - 收藏跟踪与数字球鞋组合库存查看
            - 自动化商品推荐流推动重复浏览
        - label: 卖家入驻与供给扩张循环
          detail: 满意的买家通过 alias 集成或 Grailed P2P 上架转为卖家
          touchpoints:
            - 自动扫描目录条码与即时定价工具
            - 通过 Persona 生物识别扫描完成身份和税务合规验证
            - 验证获批后，将卖家款项发放至银行账本
        - label: 忠诚度与高频大宗交易
          detail: 大型转售商或资深收藏者持续运营库存周转
          touchpoints:
            - 监测品牌需求激增的 alias 市场报告情报
            - 在数字与零售渠道之间周转寄售库存
            - 参与高价值交易并与 VIP 客户服务互动
    approximationNotes: 客户旅程阶段根据消费者交易流程、卖家文档和身份合规流程绘制。
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU005
      - CU006
      - CU010
      - CU014
  - id: FR001
    title: GOAT Group 综合风险暴露矩阵
    type: matrix
    summary: 按可能性和业务影响严重程度，评估主要法律、运营、技术、合作伙伴及估值风险。
    data:
      columns:
        - 可忽略影响
        - 低影响
        - 中等影响
        - 高影响
        - 严重影响
        - 关键严重程度
      rows:
        - label: 高可能性
          values:
            - label: 包装擦痕
              tone: low
            - label: 轻微配送延迟
              tone: low
            - label: 承运商附加费
              tone: medium
            - label: 品牌 IP 询问
              tone: high
            - label: 鉴定流失
              tone: high
            - label: 假货获批审查
              tone: critical
        - label: 中等可能性
          values:
            - label: 社交广告中断
              tone: low
            - label: 本地活动营销受阻
              tone: low
            - label: Grailed 基础设施拖累
              tone: medium
            - label: GDPR 跨境询问
              tone: high
            - label: 区域枢纽劳动力短缺
              tone: high
            - label: 生物识别 BIPA 诉讼
              tone: critical
        - label: 低可能性
          values:
            - label: FAQ 小幅修订
              tone: low
            - label: 使用条款微调
              tone: low
            - label: FTC 常规审计要求
              tone: medium
            - label: 云区域长期中断
              tone: high
            - label: 二级估值压缩
              tone: critical
            - label: 核心支付通道撤销
              tone: critical
    approximationNotes: 可能性和影响分类来自对公开法律披露、平台基础设施及风险投资融资结构的定性评估。
    claimRefs:
      - CR001
      - CR003
      - CR007
      - CR011
  - id: FV001
    title: GOAT Group 投资决策逻辑流程
    type: flow
    summary: 从运营规模和鉴定壁垒出发，经过财务不透明度分析，最终得出回避建议的顺序化判断链。
    data:
      nodes:
        - id: node-scale
          label: 市场平台规模与壁垒
          detail: 四个不同平台、13 个物流枢纽，以及 30M+ 全球会员
        - id: node-valuation
          label: Series F 估值标记
          detail: 2021 年 6 月融资轮确定的 $3.7B 估值
        - id: node-revenue
          label: 估算收入运行率
          detail: 第三方追踪机构估算 2024 年收入为 $248M
        - id: node-opacity
          label: 信息与财务不透明度
          detail: 没有公开披露毛利率、EBITDA、债务或现金消耗
        - id: node-multiple
          label: 隐含倍数错配
          detail: 隐含倍数 14.9x，而同业中位数为 0.8x - 2.0x
        - id: node-decision
          label: 回避建议
          detail: 在可见的 $3.7B 估值下不参与；要求折价 70%+，并通过 NDA 获取完整财务资料
    approximationNotes: 流程图连接观察到的市场规模、私人估值标记和投资判断结论，展示分析步骤。
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV007
      - CV011
      - CV012
