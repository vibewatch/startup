      - number: '3.2'
        title: 历史规模和分销能力支持广度，但当前领先地位未核实
        blocks:
          - type: paragraph
            body: >-
              历史披露显示平台密度和资本能力不弱，但来源过旧或不够扎实，无法证明当前竞争领先。2021 年一则联合发布的公司公告称，过去 12 个月 GMV 为 $2 billion，拥有 30 million
              名会员、600,000 名卖家和 13 个设施；公告还描述了国际化和技术投资计划。某目录后来称，截至 2023 年会员超过 50 million、员工超过 1,200 人；GetLatka 报告 2024
              年收入为 $248 million，但将里程碑来源标为未记录。这些指标的期间和分母不同，不能合并计算增长率、ARR 或当前市场份额。
