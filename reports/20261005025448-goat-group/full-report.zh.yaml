  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 市场收入来源与变现机制
        blocks:
          - type: paragraph
            body: >-
              GOAT Group 通过多品牌平台组合中的买卖双方交易费，以抽成方式实现收入。主要消费端包括数字化 GOAT 市场、Flight Club 的实体和数字寄售、Grailed 的 P2P 街头服饰交易、alias
              的卖家运营软件，以及新上线的大众鞋类门户
              Sneakers.com。市场交易按净抽成确认收入，而非按商品总值（GMV）确认，收入包括固定提现费、根据卖家评级和取消记录分层收取的卖家佣金，以及买家运费和鉴定附加费。Flight Club
              的寄售业务则从实际零售销售额中扣除较高比例的寄售佣金。尽管 GetLatka 等第三方聚合平台称 GOAT Group 2024 年收入达到 $248M，但缺少经审计的主要财务报表，无法核实收入确认政策、GMV
              转化率、促销折扣调整，以及数字市场费用与实体寄售收入的具体拆分。
            claimRefs:
