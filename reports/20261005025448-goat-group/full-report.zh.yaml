      - number: '1.3'
        title: 资本结构与利益相关方
        blocks:
          - type: paragraph
            body: >-
              GOAT Group 在 2021 年 6 月完成由 Park West Asset Management 领投、T. Rowe Price Associates、Franklin Templeton、Adage
              Capital Management 和 Ulysses Management 顾问基金共同参与的 $195M F 轮融资后，估值达到 $3.7B [CO011, CO012]。这轮融资使公司较 2020 年 9
              月 E 轮融资时确定的 $1.8B 估值翻了一倍以上 [CO011, CO012]。股权表中有多家重要战略及机构投资者，包括 2019 年 2 月投资 $100M 的 Foot Locker，以及 Kering
              CEO François-Henri Pinault 的控股公司 Groupe Artémis（2021 年初投资）[CO001, CO013]。在整个融资历程中，GOAT Group 报告 2021
              年年化商品总值达到 $2B，但 2021 年之后的股权轮次、债务结构和二级流动性交易均未核实 [CO011, CO014]。
