      - number: '4.2'
        title: 成本结构、单位经济性与运营利润压力
        blocks:
          - type: paragraph
            body: >-
              GOAT Group 的寄送鉴定模式与轻资产 P2P 分类平台的成本结构根本不同，因为它必须进行实体处理和集中鉴定。每笔经 GOAT 路由的交易都要从卖家转运至区域收货设施——如
              Carson、Fontana、Easton 或
              Shanghai——由受训鉴定人员和计算机视觉工具检查商品来源，再转发给买家。这套履约架构带来双程进出货运补贴、专业鉴定人工、收货处理、包装和信用卡处理费等直接变动成本。工程人才薪酬也体现市场化软件开发成本，美国后端工程岗位按地区分层，薪资为
              $124,800 至 $184,000。此外，平台毛利率还受到鉴定错误率、假货争议赔付和拒付影响。GOAT Group
              未披露贡献利润率、获客成本（CAC）、买家生命周期价值（LTV）或平均订单金额（AOV），投资者因此无法判断交易抽成是否能持续覆盖实体鉴定费用。
