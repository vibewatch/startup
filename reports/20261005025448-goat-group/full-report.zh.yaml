      - number: '7.4'
        title: 图表
        blocks:
          - type: callout
            title: 生物识别身份验证的集体诉讼风险
            body: >-
              GOAT Group 通过 Persona 使用第三方生物识别验证服务，扫描并分析消费者政府身份证件和自拍中的面部几何信息，以核实身份。虽然这对高价值市场的反欺诈不可或缺，但处理生物识别标识会使企业受到
              Illinois BIPA 等法律和不断扩大的州级生物识别法规的严格法定合规责任约束；程序不合规可能触发重大法定集体诉讼赔偿，无论是否真的发生数据泄露。
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
          - type: callout
            title: 不对称鉴定风险与运营可扩展性
            body: >-
              与边际履约成本接近于零的软件市场不同，GOAT Group
              的品牌完整性和消费者定价能力完全取决于实体寄送鉴定枢纽。鉴定准确率出现任何问题都会直接打击客户信任；扩大实体验证网络又会带来设施集中风险、仓库工资上涨和球鞋发售高峰期的吞吐瓶颈。
            calloutType: insight
            claimRefs:
              - CR005
              - CR006
              - CR007
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、立场与决策建议
        blocks:
          - type: paragraph
            body: >-
              GOAT Group 是一个规模化多品牌商业资产，运营 GOAT、Flight Club、Grailed 和 alias，为超过 3,000 万会员和 60
              万卖家组成的国际用户群服务。核心投资论点是平台的鉴定护城河、球鞋和街头服饰的高端二手定位，以及覆盖 13 个设施（包括 Chicago、Japan 和
              Singapore）的激进国际实体基础设施。但公开投资判断更受反论点支配：自 2021 年 6 月 F 轮以来，GOAT Group
              没有发布经审计财务报表、收入增长轨迹、毛利率、单位经济性或资产负债表储备。第三方跟踪机构估计 2024 年收入为 $248M、员工约 1,200 人；若对照峰值 $3.7B 估值，相当于无法支撑的 14.9
              倍收入倍数。考虑到二级市场缺乏流动性、平台集中于周期性时尚发售，以及没有经过认证的现金续航指标，按当前历史估值应采取回避立场。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
