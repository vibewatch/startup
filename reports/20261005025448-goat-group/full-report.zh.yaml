      - number: '3.4'
        title: 护城河建立在信任和流动性上，但时尚需求持续变化
        blocks:
          - type: paragraph
            body: >-
              目前证据最支持 GOAT 的差异化来自交易信任、多品牌触达和多条市场路径，但这种优势能否持久还不确定。官方 alias 市场报告显示品牌和鞋型需求快速变化，ASICS 和 Anta
              的销量大幅增长，说明消费者偏好一变，品类优势就可能迅速转移。组合控制或许能帮助 GOAT
              捕捉变化，但公司发布的趋势数据不是鉴定质量、履约表现、流动性或客户偏好的独立基准。没有可比同行指标，这种广度也可能意味着协调负担，而非客户锁定。因此，投资判断应把护城河视为合理但未证实，信任结果和卖家经济性才是关键尽调测试。
