      - number: '4.3'
        title: 资本充足性、融资依赖与投资判断
        blocks:
          - type: paragraph
            body: >-
              GOAT Group 的资本结构建立在累计风险投资和成长股权融资之上：Tracxn 统计 8 轮机构融资共 $487M，历史报道为 $490M；最终在 2021 年 6 月完成 $195M F 轮，由 Park
              West Asset Management 和 T. Rowe Price Associates 领投，投后估值为 $3.7B。EquityZen 等 IPO
              前平台上的二级股份交易，反映了早期员工和股东的历史流动性机制，但当前私人股价和股权表优先权结构仅在保密协议下向合格投资者开放。F 轮融资后已过去五年多，公司仍未注册
              IPO，也没有经审计的公开财务申报。由于缺少现金余额、月度烧钱、授信额度可用性和债务义务等主要披露，潜在投资人无法核实资本充足性或资金续航。因此，GOAT Group
              的投资判断应为回避或大幅折价，因为二级市场股权估值没有可核实的盈利或现金流支撑。
