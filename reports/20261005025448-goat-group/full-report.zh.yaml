      - number: '3.3'
        title: 组合整合可见，但对比经济性不可见
        blocks:
          - type: paragraph
            body: >-
              可见能力栈覆盖鉴定、实体零售、市场品牌、面向卖家的软件和内部企业系统。GOAT Group 一则转载职位描述了身份、端点、SaaS
              管理和自动化职责，能证明其运营工程范围，但不能证明面向消费者的技术护城河。证据中没有当前官方买家费率表、卖家佣金表、鉴定服务水平数据或同等的直接同行披露。因此，价格领先、抽成优势、卖家盈利能力和转换成本仍未知。买家可能在多个渠道同时交易，但现有来源没有队列、钱包份额、跨平台刊登或留存数据来量化这种行为。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP012
              - CP014
