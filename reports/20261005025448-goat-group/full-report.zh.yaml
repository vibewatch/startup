    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              GOAT Group 是一家电商控股公司，2018 年由 Eddy Lu 和 Daishin Sugano 于 2015 年创办的线上球鞋市场 GOAT，与实体寄售先驱 Flight Club 合并后成立
              [CO001]。集团运营四个覆盖品牌直营和二手转售的主要市场品牌：GOAT、Flight Club、alias（2020 年上线的专用卖家刊登工具）和 Grailed（2022 年收购）[CO001,
              CO002]。GOAT Group 总部位于美国加州卡尔弗城 Landmark Street 3960 号，依托全球设施网络采用“寄送后鉴定”模式，服务全球超过 3,000 万注册会员和 60 万卖家
              [CO003, CO004, CO005]。第三方估计公司 2024 年收入为 $248M，但官方 GAAP 收入、利润率和运营盈利能力仍严格未披露 [CO006, CO007]。
