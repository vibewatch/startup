      - number: '2.3'
        title: 买家细分、价值驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              GOAT Group 多品牌生态的采用情况取决于不同参与者群体，而各群体的价格敏感度、购买频率和工作流要求不同。核心消费者包括寻找真品稀有款的球鞋爱好者和收藏者、购买当代街头服饰的主流潮流 Z
              世代及千禧一代，以及管理跨平台大批量库存的机构或专业转售商。转售商依靠 alias 等专用工具完成动态定价、自动刊登管理和批量履约；零售买家则更看重鉴定保障、顺畅的移动端发现体验，以及 GOAT、Grailed
              和 Flight Club 的品牌审美。不过，采用仍受到多重市场逆风限制：较高的卖家费用和买家运费附加费，集中式寄送鉴定中心固有的运输时延，Air Jordan 和 Dunk
              等核心鞋型的二手溢价走弱，以及宏观经济对年轻消费者可选消费的压力。
            claimRefs:
              - CM001
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM003
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: 图表
        blocks:
          - type: callout
            title: 市场测算中的 GMV 与净收入缺口
            body: >-
              球鞋转售行业的市场测算经常以总交易额为基础引用数十亿美元的 TAM。但市场运营商只能取得其中一小部分抽成（扣除支付处理、运费补贴和卖家等级折扣后，有效净费率通常为 9% 至 15%）。若以 $30B 的 GMV
              规模衡量 GOAT Group，会掩盖其 2024 年净收入估计仅为 $248M 的现实，也说明运营利润率要提升，必须依靠更高抽成、增值服务或品牌直营零售合作。
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
          - type: callout
            title: 二手鞋型饱和与需求分散
            body: >-
              历史上，二手球鞋平台高度依赖 Nike、Jordan 和 Yeezy 系列的大量交易。GOAT Group 的 alias 平台近期市场情报显示，需求正在明显转向：经典复刻款热度减退，而 ASICS（销量
              +645%）和 Anta（销量 +799%）等新兴运动品牌正在抢占份额。随着亚文化趋势快速变化，扩大目录覆盖会增加库存预测和鉴定运营的复杂度。
            calloutType: risk
            claimRefs:
              - CM005
              - CM010
              - CM015
              - CM016
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争范围不止球鞋转售
        blocks:
          - type: paragraph
            body: >-
              GOAT Group 不是以单一市场竞争，而是以多条交易路径组成的组合参与竞争。GOAT 提供球鞋、服装和配饰的寄送鉴定渠道；Flight Club 增加门店寄售模式；alias 提供卖家工具；Grailed
              则把集团延伸到 P2P 时尚转售。相应的替代品包括鉴定转售平台、综合 P2P 市场、品牌和零售商渠道、线下寄售以及买卖双方直接交易。指定的比较页面没有识别出正确实体：它把 GOAT
              归为技术工具，并拿它与开发者基础设施产品比较。这个错误能说明搜索识别质量，但不能证明 GOAT 的真实竞争对手。
            claimRefs:
