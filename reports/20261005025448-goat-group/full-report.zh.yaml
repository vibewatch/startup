          detail: 公司控制的寄售品牌，有引用来源提到其实体门店。
        - label: alias
          x: 5
          'y': 3
          detail: 公司控制的卖家上架路径；交易保障措施未有说明。
        - label: Grailed
          x: 5
          'y': 2
          detail: 公司拥有的点对点时装市场平台；当前整合情况未知。
        - label: 直接鉴定同业类别
          x: 2
          'y': 5
          detail: 仅为概念类别；要定位具体同业，需要分配来源池中没有的证据。
        - label: 品牌 / 零售商直销类别
          x: 3
          'y': 4
          detail: 概念上的一级市场替代方案；定位仅表示方向，不是业绩评分。
    approximationNotes: 分析师以 1（低）至 5（高）构建序数尺度，仅依据来源描述的所有权和交易模式；坐标不代表市场份额、质量或客户结果指标。
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP014
