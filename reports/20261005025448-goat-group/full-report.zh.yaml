              - CV016
      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 资本纪律要求：没有审计证明就回避历史二级估值
            body: >-
              投资者应拒绝锚定 $3.7B F 轮 headline 估值的交易。成长阶段消费市场的二级报价往往比公开市场重定价滞后数年。鉴于公开可比平台的收入倍数低于 2.0 倍，GOAT Group
              的投资判断必须要求经核实的审计财务数据、董事会批准的股权表，以及相对历史私人轮次至少 70% 的进入折价。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV007
              - CV011
              - CV012
          - type: callout
            title: 清算优先权负担带来的下行风险
            body: >-
              通过 F 轮和战略企业轮累计融资超过 $490M 后，高级机构投资者持有重要的清算优先权。若最终退出或资本重组按正常同行倍数进行（企业价值
              $500M-$800M），优先回报门槛可能大幅稀释初级股东和二级普通股买家，甚至让其权益归零。
            calloutType: risk
            claimRefs:
              - CV003
              - CV008
              - CV010
              - CV016
