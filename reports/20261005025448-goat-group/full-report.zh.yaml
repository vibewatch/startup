figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间梳理公司成立、战略性平台收购、主要融资轮次及运营重组事件。
    data:
      items:
        - date: '2015-07-01'
          label: GOAT 平台成立
          title: GOAT Platform Founding
          detail: Eddy Lu 与 Daishin Sugano 创办 GOAT 移动球鞋市场平台，提供寄送验货鉴定服务。
        - date: '2018-02-08'
          label: Flight Club 合并
          title: Flight Club Merger
          detail: GOAT 收购头部球鞋寄售零售商 Flight Club，组建 GOAT Group。
        - date: '2019-02-07'
          label: Foot Locker 战略投资
          title: Foot Locker Strategic Investment
          detail: Foot Locker 向 GOAT Group 投资 $100M，推动正品球鞋零售与二级转售衔接。
        - date: '2020-09-23'
          label: Series E 融资（$100M）
          title: Series E Financing ($100M)
          detail: D1 Capital Partners 领投 $100M Series E 融资轮，GOAT Group 估值达到 $1.8B。
        - date: '2020-10-15'
          label: alias 卖家平台上线
          title: alias Seller Platform Launch
          detail: GOAT Group 推出 alias，作为专门的全球卖家应用与定价情报平台。
        - date: '2021-01-08'
          label: Groupe Artémis 战略支持
          title: Groupe Artémis Strategic Backing
          detail: Kering 的母公司 Groupe Artémis 完成战略投资，支持奢侈时装业务扩张。
        - date: '2021-06-24'
          label: Series F 融资（$195M，估值 $3.7B）
          title: Series F Financing ($195M at $3.7B)
          detail: Park West 与 T. Rowe Price 联合领投 $195M 融资轮，估值升至 $3.7B，年 GMV 达到 $2B。
        - date: '2022-10-17'
          label: Grailed 收购
          title: Grailed Acquisition
          detail: GOAT Group 收购点对点男装与奢侈服装市场平台 Grailed，加快非鞋类业务增长。
        - date: '2026-03-31'
          label: 员工重组
          title: Workforce Restructuring
          detail: 员工数据分析显示，全球员工人数较 2023 年峰值下降 41.6%，至 1,116 人。
    approximationNotes: 日期与公开交易公告、监管申报日期及员工普查快照相符。
    claimRefs:
      - CO001
      - CO002
      - CO010
      - CO011
      - CO012
      - CO013
