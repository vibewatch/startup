      - number: '1.2'
        title: 高管领导与治理
        blocks:
          - type: paragraph
            body: >-
              集团由联合创始人兼 CEO Eddy Lu 与联合创始人 Daishin Sugano 领导；两人因亲身遭遇二手市场假球鞋而创办了最初的平台 [CO001,
              CO008]。自成立以来，高管团队一直高度依赖关键个人，带领公司完成多次平台收购和国际扩张 [CO001, CO008]。然而，公开公司披露完全没有说明正式董事会架构、独立委员会监督或非执行董事任命
              [CO009]。Revelio Labs 的独立员工跟踪显示，公司正在经历明显的组织重组：全球员工总数从 2023 年的 1,911 人下降 41.6%，截至 2026 年 3 月为 1,116 人；2026
              年同比又下降 29.6% [CO010]。同期 2026 年在招职位降至 48 个，反映工程和运营团队正在严格控本并压缩编制 [CO010]。
