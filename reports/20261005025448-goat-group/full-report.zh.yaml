            body: >-
              GOAT Group（通过 1661, Inc. dba GOAT 及关联实体运营）拥有广泛的全球电商和零售业务，受多司法辖区消费者保护与数据隐私法律约束
              [CR001]。平台覆盖美国、英国、欧盟和亚洲，必须持续遵守严格的数据保护要求，包括经 CPRA 修订的《加州消费者隐私法》（CCPA）、美国二十多个州的隐私法规、英国《2018 年数据保护法》/ UK
              GDPR，以及欧盟《条例 2016/679》（GDPR）[CR002]。主要合规风险在身份和反欺诈：GOAT 通过 Persona
              集成第三方生物识别验证，使用光学扫描、机器学习验证和面部几何分析，从消费者政府身份证件和自拍中提取生物识别标识 [CR003]。在 Illinois BIPA
              等严格的生物隐私框架和州级执法下，如果通知、同意或留存流程失效，收集面部几何标识会带来严重的法定集体诉讼风险
              [CR004]。此外，区域子公司、物流中心和外部支付处理商之间的跨境客户及交易数据流，也受到欧洲数据传输标准合同条款和强制性国际传输保障措施的审查 [CR002]。
