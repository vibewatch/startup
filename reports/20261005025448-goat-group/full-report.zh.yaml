  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与替代品
        blocks:
          - type: paragraph
            body: >-
              GOAT Group
              将市场平台定位在球鞋、街头服饰和奢侈配饰的二手转售与品牌直营零售交界处。市场边界包括经鉴定的二手鞋交易、未使用的收藏级球鞋、当季及经典服装寄售，以及数字平台和实体寄售店上的品牌直营首发。未经鉴定的普通商品转售、大规模未筛选的二手服装、标准批发百货零售和低客单价折扣鞋清仓不在范围内。在这一边界内，主要竞争替代品包括
              eBay 等综合 P2P 市场、The RealReal 和 Vestiaire Collective 等专业奢侈品寄售平台、StockX
              等纯球鞋竞价交易所，以及传统实体寄售店。平台可触达支出的大小，很大程度取决于消费者是否愿意为鉴定服务支付溢价，以降低热门收藏品类普遍存在的假货风险。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场测算口径、可服务市场估计与增长差异
        blocks:
          - type: paragraph
            body: >-
              评估 GOAT Group 的可服务市场，需要把行业宏观预测与受品类约束的二手鞋服实际规模放在一起比较。历史第三方研究和行业估计认为，全球球鞋转售市场长期规模约为 $6B 至
              $30B，广义服装转售和二手时尚市场全球规模预计超过 $100B 至 $200B。但这些总量把高毛利的鉴定收藏球鞋、低毛利的日常二手服装和未变现的个人交易混在一起。实际上，GOAT Group 历史 GMV
              在各平台达到 $2B，而第三方分析师估计其净收入约为 $248M。差异凸显了平台总交易商品额与控股公司实际通过净抽成实现的市场变现之间的关键区别。受约束的测算显示，二手球鞋需求虽在 2021
              年前快速增长，但随着品牌直营分销策略变化，特定品类的交易量已开始放缓。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
