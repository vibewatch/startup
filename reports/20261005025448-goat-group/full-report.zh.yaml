      - number: '8.2'
        title: 融资背景、资本结构与可比倍数
        blocks:
          - type: paragraph
            body: >-
              GOAT Group 于 2021 年 6 月完成 $195M F 轮融资，估值从 2020 年 9 月的 $1.8B 翻倍以上至 $3.7B。该轮由 Park West Asset Management
              领投，T. Rowe Price Associates、Franklin Templeton、Adage Capital Management 和 Ulysses Management 顾问基金共同参与；此前
              Kering 控股公司 Groupe Artemis 于 2021 年 1 月进行战略投资。F 轮时，GOAT Group 强调过去 12 个月 GMV 为 $2B，球鞋同比增长 100%，服装同比增长
              500%。当前市场环境下，eBay、RealReal、Farfetch 和 Etsy 等公开市场可比平台的过去收入倍数为 0.5 倍至 2.5 倍。将 1.0 倍至 2.0 倍的成长市场倍数应用于第三方估计收入
              $248M，可得 $248M 至 $496M 的隐含股权企业价值，较 F 轮 headline 估值折价 86% 至 93%。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: 乐观、基准与悲观回报情景及尽调触发条件
        blocks:
          - type: paragraph
            body: >-
              对 GOAT Group 做投资判断，需要针对结构性市场不透明评估三种运营情景。乐观情景下，GOAT 借助 Grailed 和 alias 卖家工具加速高毛利服装业务，扩大品牌直营零售合作，并通过
              Shanghai、Japan 和 Singapore 的设施扩大国际 GMV，最终上市退出时估值可达 $1.2B 至
              $1.8B。基准情景下，随着球鞋发售热度降温，转售增长回归中个位数，持续的仓库运营开销使企业价值压缩至 $500M 至
              $750M。悲观情景下，严重假货争议、仓库劳动力摩擦和关税逆风压缩净抽成，推动二级市场困境折价至 $300M 以下。关键论点破坏触发因素包括披露经营现金流为负、后期 F
              轮投资人的清算优先权负担，以及卖家持续流失至未鉴定或零费用竞争平台。
            claimRefs:
              - CV005
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV011
