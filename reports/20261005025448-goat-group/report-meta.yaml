companyProfile:
  summary: >-
    GOAT Group is a multi-brand resale marketplace holding company built around GOAT, Flight Club, alias, and Grailed.
    The business combines authenticated sneaker and apparel resale with some primary-brand retail exposure, serving
    collectors, fashion buyers, and professional resellers through mobile, web, and physical consignment channels.
    Public evidence supports a scaled platform with meaningful historical GMV and member reach, but current GAAP
    financials and private market marks remain opaque.
