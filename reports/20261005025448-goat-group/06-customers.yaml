callouts:
  - calloutType: "insight"
    title: "The Buyer-to-Seller Flywheel Powers Supply-Side Durability"
    body: "GOAT Group's multi-brand ecosystem creates a natural customer conversion loop: footwear enthusiasts who initially enter the platform as buyers frequently transition into sellers via alias and Grailed to liquidate older collections and fund new acquisitions. This bi-directional participant behavior lowers organic customer acquisition costs and strengthens marketplace liquidity across 170 countries."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
  - calloutType: "risk"
    title: "Customer Concentration Opacity and Macroeconomic Resale Sensitivity"
    body: "While GOAT boasts 60 million members, resale platforms are notoriously prone to high volume concentration among a fractional tier of power resellers and affluent sneakerheads. Without audited disclosures on active transacting buyer cohorts, Net Revenue Retention, or churn, investors cannot quantify platform vulnerability to secondary sneaker price compression or power-seller disintermediation."
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU012"
      - "CU015"
      - "CU016"
