chapter:
  number: 1
  title: "Company Overview"
  summary: "GOAT Group is a digital-first marketplace holding company for sneakers, apparel, and accessories operating GOAT, Flight Club, alias, and Grailed. While historical funding scaled the business to a $3.7B valuation with $2B in trailing GMV by 2021, recent workforce tracking indicates a 41.6% headcount contraction to 1,116 employees by 2026 amid ongoing opacity surrounding primary financials."
sections:
  - id: "corporate-identity-and-operating-model"
    title: "Corporate Identity and Operating Model"
    body: "GOAT Group is an e-commerce holding company established in 2018 following the merger of the online sneaker marketplace GOAT, founded in 2015 by Eddy Lu and Daishin Sugano, with retail consignment pioneer Flight Club [CO001]. The group operates four primary marketplace brands spanning primary and secondary resale: GOAT, Flight Club, alias (its dedicated seller listing tool launched in 2020), and Grailed (acquired in 2022) [CO001, CO002]. Operating from corporate headquarters at 3960 Landmark Street in Culver City, California, GOAT Group employs a ship-to-verify authentication model across a network of global facilities, serving more than 30 million registered members and over 600,000 sellers globally [CO003, CO004, CO005]. While third-party estimates attribute $248M in 2024 revenue to the company, official GAAP revenue, margins, and operational profitability remain strictly undisclosed [CO006, CO007]."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership and Governance"
    body: "The group is led by co-founder and Chief Executive Officer Eddy Lu alongside co-founder Daishin Sugano, who established the original platform after personal experiences with counterfeit sneakers in the secondary market [CO001, CO008]. Executive leadership has maintained key-person centrality since inception, steering the business through successive platform acquisitions and international expansion [CO001, CO008]. However, formal board structure, independent committee oversight, and non-executive director designations remain entirely opaque in public corporate disclosures [CO009]. Independent workforce tracking by Revelio Labs reveals material organizational restructuring: total worldwide headcount contracted by 41.6% from 1,911 personnel in 2023 to 1,116 as of March 2026, including a 29.6% year-over-year contraction in 2026 [CO010]. Active job postings simultaneously cooled to 48 roles in 2026, reflecting disciplined cost containment and workforce rationalization across engineering and operations [CO010]."
    claimRefs:
      - "CO001"
      - "CO008"
      - "CO009"
      - "CO010"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-stakeholder-map"
    title: "Capitalization and Stakeholder Map"
    body: "GOAT Group achieved a $3.7B valuation in June 2021 after completing a $195M Series F funding round led by Park West Asset Management alongside funds advised by T. Rowe Price Associates, Franklin Templeton, Adage Capital Management, and Ulysses Management [CO011, CO012]. This capital raise more than doubled its previous $1.8B valuation established during its Series E financing in September 2020 [CO011, CO012]. The capitalization table features prominent strategic and institutional backers, including Foot Locker—which invested $100M in February 2019—and Groupe Artémis, the holding firm of Kering CEO François-Henri Pinault, which invested in early 2021 [CO001, CO013]. Across its funding history, GOAT Group reported reaching $2B in annualized Gross Merchandise Value in 2021, yet post-2021 equity rounds, debt structures, and secondary liquidity transactions have not been verified [CO011, CO014]."
    claimRefs:
      - "CO001"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
