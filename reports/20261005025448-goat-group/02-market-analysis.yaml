callouts:
  - calloutType: "insight"
    title: "The GMV versus Net Revenue Gap in Marketplace Sizing"
    body: "Market sizing analyses in the sneaker resale sector frequently cite multi-billion dollar TAM figures based on gross transaction volume. However, marketplace operators capture only a fractional take-rate (typically 9% to 15% effective net fee margin after payment processing, shipping subsidies, and seller tier discounts). Sizing GOAT Group against a $30 billion GMV horizon obscures the reality that its net revenue scale was estimated at $248 million in 2024, emphasizing that operating margin expansion depends on higher take-rates, value-added services, or primary retail partnerships."
    claimRefs:
      - "CM006"
      - "CM007"
      - "CM008"
      - "CM009"
  - calloutType: "risk"
    title: "Secondary Silhouette Saturation and Demand Diversification"
    body: "Historically, secondary sneaker platforms were overwhelmingly dependent on high-volume trading of Nike, Jordan, and Yeezy franchises. Recent market intelligence from GOAT Group's alias platform reveals a critical shift: while classic retros face demand fatigue, emerging athletic brands such as ASICS (+645% sales) and Anta (+799% sales) are capturing share. Managing catalog breadth across rapidly shifting subcultural trends introduces operational inventory forecasting and authentication complexity."
    claimRefs:
      - "CM005"
      - "CM010"
      - "CM015"
      - "CM016"
