evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-reporting
    missingEvidence: >-
      Audited GAAP financial statements covering net revenue, gross margin, operating expenses, EBITDA, and balance
      sheet cash.
    whyItMatters: >-
      Without verified income and cash flow statements, valuation multiples cannot be grounded in fundamental cash
      generation.
    diligencePath: Request confidential management financial package and audited statements under non-disclosure agreement.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-cap-table
    missingEvidence: >-
      Comprehensive post-2021 capitalization table detailing exact share classes, option pool allocation, and secondary
      share transfers.
    whyItMatters: Precludes exact verification of fully diluted share counts and waterfall liquidation preference distributions.
    diligencePath: Review certified cap table from corporate counsel or equity transfer agent.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-share-and-take-rate
    missingEvidence: >-
      Audited category gross merchandise value (GMV) by vertical and net effective take-rate breakdown across GOAT,
      Grailed, and Flight Club.
    whyItMatters: >-
      Without audited GMV and segment net take-rates, investors cannot confirm whether revenue growth is driven by
      genuine organic volume expansion or increased seller take-rate extraction.
    diligencePath: >-
      Request confidential quarterly cohort GMV, take-rate schedules, and platform processing margin schedules under an
      investment NDA.
    relatedQuestionRefs:
      - QM002
      - QM006
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: cohort-retention-and-churn
    missingEvidence: >-
      Active buyer repeat purchase cohorts, seller retention curves, and annual net revenue retention (NRR) across
      demographic tiers.
    whyItMatters: >-
      Long-term market sizing and lifetime value (LTV) assumptions depend on recurring purchase frequency rather than
      one-time acquisition spikes during high-heat sneaker releases.
    diligencePath: >-
      Review management cohort retention data, repeat transaction percentages, and customer acquisition cost (CAC)
      payback periods during management meetings.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Current official buyer fees, seller commissions, payout timing, shipping, authentication charges, and
      like-for-like direct-peer schedules.
    whyItMatters: >-
      Without a common transaction basis, price leadership, seller profitability, and total cost of ownership cannot be
      compared.
    diligencePath: >-
      Run a same-day buyer and seller mystery shop across GOAT, Flight Club, alias, and named direct peers, retaining
      official fee pages and checkout evidence.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Buyer and seller cohort retention, wallet share, cross-listing, multi-homing, repeat purchase, and channel-level
      churn.
    whyItMatters: >-
      These measures distinguish genuine liquidity and lock-in from a portfolio that users can leave or use only
      opportunistically.
    diligencePath: >-
      Request channel-level cohorts and interview sampled buyers and sellers about cross-listing, switching triggers,
      and authentication outcomes.
    relatedQuestionRefs:
      - QP006
  - type: enumeration-incomplete
    severity: material
    topic: named-competitors
    missingEvidence: >-
      Competitor-issued product, pricing, compliance, channel, and scale disclosures plus independent customer and
      adverse evidence for named peers.
    whyItMatters: >-
      The current pool cannot support a defensible named-peer ranking or quantify relative trust, liquidity,
      distribution, and economics.
    diligencePath: >-
      Build a peer-class search plan, fetch current official surfaces for each named peer, and corroborate them with
      customer, regulatory, and independent reporting.
    relatedQuestionRefs:
      - QP001
      - QP002
      - QP003
      - QP008
      - QP009
      - QP010
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: cash-and-burn
    missingEvidence: >-
      Audited balance sheet detailing cash and cash equivalents, total debt obligations, and monthly operating cash burn
      rate.
    whyItMatters: Without cash and burn metrics, capital adequacy and remaining runway cannot be verified for underwriting.
    diligencePath: Request confidential management financial review and trailing twenty-four month cash flow statements under NDA.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Granular breakdown of net transaction take rate, customer acquisition cost (CAC), and fulfillment cost per
      shipment.
    whyItMatters: Determines whether physical authentication and shipping costs allow sustainable positive contribution margin.
    diligencePath: Obtain marketplace cohort analysis and unit-level P&L statements across core footwear and apparel categories.
    relatedQuestionRefs:
      - QI002
      - QI008
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: authentication-accuracy
    missingEvidence: >-
      Empirical false-positive rejection rates, false-negative counterfeit pass rates, and computerized image
      recognition telemetry.
    whyItMatters: >-
      Verification integrity is the foundation of GOAT Group's customer trust and pricing premium; unmonitored
      counterfeit leaks damage platform equity.
    diligencePath: >-
      Request internal QA audit logs, customer dispute resolution statistics, and automated inspection throughput
      reports under NDA.
    relatedQuestionRefs:
      - QE002
      - QE007
    relatedTableRefs:
      - TE001
  - type: missing-source
    severity: minor
    topic: sla-telemetry
    missingEvidence: Average intake-to-dispatch turnaround hours across Fontana, Carson, Easton, and international authentication hubs.
    whyItMatters: >-
      Intake velocity dictates seller capital recycling, buyer satisfaction, and working capital efficiency during peak
      sneaker drop events.
    diligencePath: >-
      Review warehouse management system (WMS) cycle times and carrier transit service-level logs during management
      diligence.
    relatedQuestionRefs:
      - QE005
      - QE007
    relatedTableRefs:
      - TE002
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-cohort-churn
    missingEvidence: >-
      Audited disclosures of active transacting 12-month buyers, annual customer churn rates, cohort repurchase
      frequency, and Net Revenue Retention (NRR).
    whyItMatters: >-
      Without retention and repeat-rate disclosures, diligence cannot determine whether customer acquisition growth
      translates into a durable, compounding transaction base.
    diligencePath: >-
      Request confidential management cohort retention schedules, monthly active buyer tables, and repeat transaction
      heatmaps under NDA.
    relatedQuestionRefs:
      - QU007
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: material
    topic: seller-concentration-and-power-trader-share
    missingEvidence: >-
      Breakdown of gross transaction volume and listing share contributed by the top 1% and top 10% of high-volume
      merchant sellers on alias and GOAT.
    whyItMatters: >-
      High supplier concentration exposes the marketplace to supply-chain disruption if professional power resellers
      migrate to rival platforms like StockX or eBay.
    diligencePath: Review seller distribution curves and power-seller retention rates in the confidential data room.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU001
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Comprehensive docket filings, active settlement agreements, and pending litigation records across federal, state,
      and international jurisdictions.
    whyItMatters: >-
      Public disclosure reveals privacy and biometric practices but omits confidential demand letters, ongoing
      arbitration cases, and intellectual property notices.
    diligencePath: >-
      Obtain complete litigation and regulatory inquiry schedules, BIPA class action defense logs, and trademark
      infringement docket disclosures from company legal counsel.
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: monitoring-indicators
    missingEvidence: >-
      Proprietary internal operating telemetry regarding authentication false-positive rates, shipment fulfillment SLA
      failure rates, and buyer return dispute volumes.
    whyItMatters: >-
      Without authentication accuracy telemetry and return dispute rates, investors cannot quantify the operational
      integrity or true residual brand risk of the ship-to-verify model.
    diligencePath: >-
      Request confidential historical quality-control dispute audit logs and authenticator SLA compliance reports during
      confirmatory management diligence.
    relatedQuestionRefs:
      - QR009
  - type: private-evidence-only
    severity: blocking
    topic: audited-financial-metrics
    missingEvidence: Audited financial statements detailing trailing revenue, gross margin, operating expenses, EBITDA, and cash burn.
    whyItMatters: Without certified financial statements, establishing an evidence-based equity valuation multiple is impossible.
    diligencePath: Require management and lead sponsor to provide audited financial disclosures and trailing board packs under NDA.
    relatedQuestionRefs:
      - QV004
      - QV008
    relatedTableRefs:
      - TV001
  - type: missing-source
    severity: material
    topic: cap-table-liquidation-preferences
    missingEvidence: >-
      Fully diluted capitalization table detailing Series F liquidation preferences, participating rights, and secondary
      share transactions.
    whyItMatters: >-
      Preferred return hurdles and senior liquidation overhang dictate the downside recovery for common and junior
      secondary investors.
    diligencePath: Examine amended certificates of incorporation and investor rights agreements with legal counsel.
    relatedQuestionRefs:
      - QV007
      - QV008
    relatedTableRefs:
      - TV002
