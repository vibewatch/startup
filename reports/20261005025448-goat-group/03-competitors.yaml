      - ["GOAT / Flight Club seller route", "Not disclosed in assigned evidence", "Marketplace or consignment access plus physical-store route", "Commission, payout timing, storage, discounts, and seller segmentation", "Seller loyalty and contribution margin cannot be compared"]
      - ["alias seller route", "Not disclosed in assigned evidence", "Listing workflow for sneakers and apparel", "Subscription, transaction fees, cross-listing, and service tiers", "Packaging advantage remains unverified"]
      - ["Direct peer and substitute routes", "No reliable peer pricing retained", "Varies by authenticated peer, horizontal marketplace, retailer, or direct exchange", "Like-for-like fees, authentication scope, payment protection, and shipping basis", "A current mystery-shop and contract-level comparison is required"]
    notes: "The assigned pool contains no current official pricing pages; null comparisons are preserved as material diligence gaps rather than estimated."
    claimRefs: ["CP002", "CP003", "CP004", "CP014"]
