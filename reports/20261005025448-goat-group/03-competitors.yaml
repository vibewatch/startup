      - ["Operational platform", "A closed role describes IAM, endpoint, SaaS, compliance, and automation responsibilities", "Unknown in assigned evidence", "Unknown in assigned evidence", "Unknown in assigned evidence", "Low as a competitive differentiator"]
    notes: "Cells report only what the assigned sources support; class-level competitor cells remain unknown rather than inferred from general industry knowledge."
    claimRefs: ["CP001", "CP002", "CP003", "CP004", "CP012", "CP014"]
  - id: "TP003"
    title: "Pricing / packaging comparison"
    columns: ["Route", "Price / unit / contract model", "Included capability", "Unknowns", "Competitive implication"]
    rows:
