callouts:
  - calloutType: "risk"
    title: "Biometric Identity Verification Class Action Vulnerability"
    body: "GOAT Group's utilization of third-party biometric verification services via Persona involves the scanning and analysis of facial geometry from consumer government IDs and selfies to verify identities. While necessary for fraud mitigation on a high-value marketplace, handling biometric identifiers exposes the enterprise to strict statutory compliance liabilities under laws such as Illinois BIPA and expanding state biometric statutes, where procedural non-compliance can trigger material statutory class-action damages regardless of actual data breach incidents."
    claimRefs:
      - "CR003"
      - "CR004"
  - calloutType: "insight"
    title: "Asymmetric Authentication Risk and Operational Scalability"
    body: "Unlike software-only marketplaces that operate with near-zero marginal fulfillment costs, GOAT Group's brand integrity and consumer pricing power hinge entirely upon physical ship-to-verify authentication hubs. Any failure in authentication accuracy directly strikes at the core of customer trust, while scaling the physical verification footprint introduces facility concentration risks, warehouse wage inflation, and throughput bottlenecks during peak sneaker release cycles."
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR007"
