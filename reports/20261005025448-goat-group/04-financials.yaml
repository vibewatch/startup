callouts:
  - calloutType: "risk"
    title: "Physical Fulfillment Overhead Compresses Digital Marketplace Margins"
    body: "Unlike pure-play digital classifieds or software platforms, GOAT Group's ship-to-verify architecture incurs direct logistics overhead, warehouse lease commitments, and skilled authentication labor across hubs in Fontana, Carson, Easton, and Shanghai. These fixed and variable fulfillment expenses place an aggressive operational floor beneath operating expenses, leaving net margins vulnerable during secondary market volume downturns."
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI010"
  - calloutType: "insight"
    title: "Venture Capital Valuation Disconnected from Unaudited Financial Disclosure"
    body: "GOAT Group's $3.7B valuation established in 2021 was underwritten during peak secondary apparel liquidity. With no subsequent public funding rounds, unverified third-party revenue estimates of $248M in 2024, and opaque secondary share liquidity via EquityZen, public investors cannot determine whether current operating metrics justify earlier private valuation multiples."
    claimRefs:
      - "CI004"
      - "CI011"
      - "CI012"
      - "CI013"
      - "CI015"
