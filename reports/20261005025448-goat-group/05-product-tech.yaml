callouts:
  - calloutType: "insight"
    title: "The Dual Architectural Moat: Event-Driven Software and Physical Authentication Hubs"
    body: "GOAT Group's competitive positioning does not rest exclusively on modern Go and Ruby microservices or event-driven AWS infrastructure; its true barrier to entry is the tightly coupled integration between low-latency catalog software and physical verification warehouses in Carson, Fontana, Easton, and Shanghai. Replicating this model requires both digital scale to clear millions of pricing updates and physical operations capable of inspecting thousands of high-value sneakers daily."
    claimRefs:
      - "CE001"
      - "CE007"
      - "CE013"
      - "CE014"
  - calloutType: "risk"
    title: "Throughput Bottlenecks and Telemetry Opacity in Ship-to-Verify Operations"
    body: "The ship-to-verify operational model introduces structural friction that pure digital marketplaces avoid: transit latency, inspection labor overhead, and physical facility throughput constraints. Without publicly reported authentication SLA metrics, false-positive dispute counts, or counterfeit leakage telemetry, investors cannot independently evaluate how effectively GOAT Group scales its quality control against rapid catalog expansion."
    claimRefs:
      - "CE002"
      - "CE013"
      - "CE015"
      - "CE016"
