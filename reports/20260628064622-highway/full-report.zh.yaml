      - number: '5.4'
        title: 信任控制、成熟度与技术风险
        blocks:
          - type: paragraph
            body: >-
              Highway 的公开信任叙事强于公开架构披露。公司声称行业首个符合 NIST SP 800-63，并把其身份核验描述为基于证据、多因素、生物识别、真人客服支持。底层 NIST 标准重要，因为 Revision
              4 明确提高了对连续评估、欺诈控制、伪造媒体抵抗和现代认证器的要求。Highway 的公开路线图也显示信任层正在扩散到相邻节点：通过 Highway for VoIP
              处理电话欺诈，面向收件箱被攻陷场景提供安全费率确认交付，认证保险机构提供更干净的 COI 和 VIN 级覆盖数据，以及 Know Your Driver 提供司机级保障。


              公开成熟度证明有意义，但不均衡。FreightWaves 2026 年获奖报道称，Highway 在 2026 年 Q1 拦截 527,940 封欺诈入站邮件、71,801 通伪造电话，标记 399
              起所有权变更事件，并记录 2,256 起身份盗用实例，同时称客户 double brokering 下降 97%。Freight Caviar 称，在 Know Your Driver 于 TIA 2026
              推出时，Highway 已完成供应链中超过 500,000 人的身份验证。这些都是强外部信号，说明 Highway 正在大规模运行真实生产工作流。


              风险层同样重要。Overdrive 记录了承运商对更严格 ID 验证流程的反弹，包括驾照和生物识别采集，以及声称的三年保留。IsDown
              事件显示其对远程信息处理伙伴有真实依赖。而公开来源包仍没有呈现技术尽调真正想承销的材料——当前 SOC 2
              报告范围、架构图、服务边界细节、供应商集中度，或除孤立事件外的历史可靠性指标。结论是产品相关性和广度为正，但仍取决于私有技术尽调。
