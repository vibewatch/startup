  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与优先级
        blocks:
          - type: paragraph
            body: >-
              Highway 的风险画像不是由单一存亡缺陷主导，而是由一组相互牵连的控制系统风险主导。第一是监管与法律： Highway 当前隐私通知明确覆盖生物识别数据、地理位置、ELD
              衍生位置数据和身份验证流程；公开负面报道 则显示，至少部分车主运营商认为这些控制侵入性强，并限制其进入市场。第二是运营：在欺诈明显升级 的环境里，Highway 承诺实时、货载级保护，但 2026 年 2
              月的一起公开事件显示，Samsara 合作伙伴宕机 可中断 Load Lock 警报和里程碑更新。第三是依赖与竞争：Highway 正把自己嵌进保险方、TMS、交易所、
              支付和车联网工作流；与此同时，Descartes MyCarrierPortal、Truckstop 等更大对手也在发布自身 规模指标和反欺诈结果，而 FMCSA
              免费、一次查一个承运人的基线仍有粘性。第四是人员与模型风险：Jordan Graft 仍是品类叙事核心，而公开来源对估值、经济性、合作伙伴合同条款、申诉率和治理深度仍大多不透明。
              因此，本章更适合读成一张传导图：法律 / 隐私摩擦、欺诈压力增长和合作伙伴宕机，都会传导到采用、留存、 利润率，并最终传导到估值风险。
