      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              最可能的买方是高度依赖第三方承运商运力的货运经纪商和 3PL，尤其是车道覆盖全国、高价值货物或开放市场订舱密集的玩家。全国性经纪商和大型 3PL
              可以用避免欺诈损失和提升承运商网络效率来证明品类价值；中型市场和数字化成长经纪商则看重更快获得企业级控制，否则内部自建会很吃力。日常用户覆盖承运商销售、运力、风险、合规和运营团队，但承运商自身通常是不付费参与者，而其入驻体验仍决定网络效应是否成立。这一点重要，因为更严格身份核验可以降低欺诈，同时也会制造承运商摩擦，尤其是在小型
              owner-operator 群体中。采用路径通常从入驻或告警开始，再扩到连续监控、货载级合规、安全通信；在 Highway 的案例里，还通过 TFX 和 Triumph
              扩到交易所与支付挂钩工作流。这个顺序意味着，公司先销售切入口产品；一旦经纪商信任核心身份层，再试图扩进更高频交易基础设施。
