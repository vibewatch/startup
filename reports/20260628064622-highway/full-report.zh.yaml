  - id: TM001
    title: 市场定义表
    columns:
      - 类别
      - 纳入的支出 / 工作流
      - 排除或相邻支出
      - 现状替代方案
      - 买方 / 付款方
      - 与 Highway 的相关性
    rows:
      - - 承运人身份与接入
        - 身份核验、资质检查、调度员授权、保险门槛和经纪商网络注册
        - 通用托运人采购工具或车队管理系统
        - 人工 FMCSA、SAFER、COI、邮件和电话检查
        - 货运经纪商运营或合规预算
        - 核心纳入市场，也是 Highway 最初的切入点
      - - 持续监控与货载级合规
        - 行为警报、联系人变更监控、Load Lock、异常路由和安全执行控制
        - 通用货物可见性或车联网平台，除非与访问控制绑定
        - 规则电子表格和被动异常处理
        - 经纪商风险、运营或反欺诈预算
        - 纳入原因是欺诈现在出现在接入之后，而不只是之前
      - - 可信交易访问控制
        - 身份验证订舱、已审查承运人访问和安全数字发单
        - 没有身份控制的开放货源板
        - 传统货源板加人工承运人回拨
        - 经纪商数字订舱或市场预算
        - 相邻市场，但随着 Highway 从审查走向交易，正变得越来越核心
      - - 支付与结算信任层
        - 信用保证、安全结算，以及连接到已验证交易的发票 / 支付工作流
        - 货运执行之外的独立保理、托运人 AP 软件或银行产品
        - 独立支付供应商和人工结算控制
        - 经纪商财务或运营预算
        - 通过 Triumph 延伸的相邻扩张区域，而非最初核心市场
      - - 排除的记录系统
        - 除 Highway 直接触达的信任和访问层之外无其他部分
        - 托运人 TMS、通用网络安全套件、承运人后台 ERP、资产车联网
        - 既有记录系统保持原位
        - 经纪商信任工作流之外的 IT 或车队预算
        - 重要排除项，避免把 TAM 膨胀到所有物流软件或所有卡车运输支出
    notes: 本表按工作流控制来定义 Highway 的市场，而不是按宽泛的物流软件标签。整车运输或欺诈损失数字是语境输入， 本身不是软件市场。
