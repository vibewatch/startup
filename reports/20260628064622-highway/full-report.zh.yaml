        - 中
        - 询问采用率、误报率，以及符合 NIST 的流程在多大频率上改变经纪商或承运商行为。
      - - 覆盖电话、邮件和运价确认的多渠道安全
        - 最强的可见护城河要素
        - 竞争对手不重建核心平台，也能外挂相邻渠道控制
        - 高
        - 验证 VoIP、Load Lock 和安全邮件相对基础入驻部署的附加率。
      - - 合作伙伴与集成杠杆
        - 有用的分发放大器
        - 大型既有厂商仍控制更广的装机基础和工作流界面
        - 中
        - 要求披露当前合作伙伴数量、联合销售贡献，以及在关键 TMS 或车联网平台中的嵌入深度。
      - - 既有厂商捆绑压力
        - 最可信的替代路径
        - Descartes 将 MCP 与 MacroPoint 捆绑；Truckstop 将 RMIS 与市场位置捆绑；DAT 仍嵌在工作流里
        - 高
        - 测试买方把 Highway 放进正式方案比选、对比更宽捆绑方案时，Highway 是否还能胜出，而不是只在单点方案搜索中获胜。
      - - 现状粘性
        - 持续偏高
        - 免费 FMCSA 查询加内部流程，对价格敏感型经纪商仍然够用
        - 高
        - 量化相对手工流程节省的人力小时、避免的欺诈损失和缩短的订舱时间，用来证明支出合理。
      - - 承运商摩擦风险
        - 可见但可控
        - 更严格的验证惹恼小型承运商，或降低其快速入驻意愿
        - 中
        - 按承运商分群衡量流失率和审批时间；把欺诈减少幅度与损失运力对比。
    notes: 严重性衡量未来 12–24 个月的竞争耐久性风险，不是投资建议。本风险清单只基于公开来源可见证据，因此多项缓释措施需要公司内部运营数据才能验证。
