      - number: '2.4'
        title: 增长驱动、约束与矛盾
        blocks:
          - type: paragraph
            body: >-
              最清晰的驱动因素很简单：欺诈压力上升。NICB、FreightWaves、DAT 和 Highway 自有指数都指向更高的货物盗窃和身份型攻击水平，而 double brokering
              的成本仍足以支撑预防支出。第二个驱动是工作流扩张：经纪商如果已经信任 Highway 做入驻，就可以理性延伸到货载级合规、安全费率确认，以及可信交易所或结算工作流。第三个驱动是地理和商品集中度，因为通过
              California、Texas 或跨境走廊运输高价值货物的经纪商应能看到更快 ROI。约束同样重要。承运商隐私异议显示，更强控制会拖慢网络增长。替代产品和内部合规栈意味着 Highway
              争夺的是既有预算，而不是进入空白田地。最重要的是，公开记录保留了相互矛盾的损失估算，而且仍没有独立软件 TAM
              或定价披露。因此，这个市场看起来战略重要且可能持久，但在变现深度，以及广泛经纪商宇宙中有多少会采用完整身份优先运营模式上，证据仍有限。
