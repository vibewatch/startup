      - number: '6.5'
        title: 扩张动作与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Highway 的扩张逻辑看得见，财务结果看不见。客户旅程似乎从承运人身份和经纪商验证起步，再进入货载 级监控、TFX 订舱、基于车道的采购，以及嵌在 McLeod、Parade、Transport Pro
              里的合作伙伴工作流。 这在战略上有吸引力：Highway 不是试图替换既有 TMS 和订舱基础设施，而是成为其中一部分，从而在 账户内加深使用。合作伙伴计划和解决方案伙伴页面也强化了同一模式：Highway
              想让身份情报穿过相邻 货运系统，变成共享的工作流标准。主要风险在于，这些强表面证据仍缺经济语境。公开来源没有披露头部 客户集中度、各模块经纪商使用占比、客户流失、总留存或
              NRR。大多数证据也来自公司或合作伙伴联合 发布，而不是独立客户撰写的 ROI 分析。因此，克制的解读是正面但不完整：客户质量看起来强，也符合 企业级场景；但多元化和变现深度仍要靠私有证据回答。
