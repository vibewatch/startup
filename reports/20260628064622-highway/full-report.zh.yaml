  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Highway
              的市场边界应从它自动化的经纪商工作流开始，而不是从卡车运输总规模开始。纳入的支出包括承运商身份核验、入驻、合规检查、联系人或经营许可变更监控、货载级规则，以及费率确认等订舱文件的安全流转。这些控制很关键，因为经纪商才是决定哪家承运商获得货载访问权的经济中介。相邻品类包括交易所访问控制和支付挂钩的信任层；排除品类包括货主
              TMS 软件、通用网络安全、车队远程信息处理，以及不决定谁能订货的承运商后台系统。现状替代方案仍是人工 FMCSA 和 SAFER 验证，加上保险证书、电话、邮件和内部表格规则，常常再叠加 RMIS
              等工具。这个替代方案起步更便宜，但欺诈者恰恰利用的就是这套信任模型：入驻后，收件箱、电话号码、调度员身份或 MC 所有权会发生变化。
