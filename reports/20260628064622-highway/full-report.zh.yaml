      - number: '1.4'
        title: 牵引、风险与里程碑
        blocks:
          - type: paragraph
            body: >-
              产品采用和欺诈遥测交叉处，公开牵引指标最强。到 2025 年 8 月融资窗口，Highway 称其服务超过 1,050 家经纪商，包括美国 Top 100 中的 70 家。FTV
              的投资人说明补充了一个高层运营数据——2024 年拦截约 915,000 次欺诈企图——而 Highway 的 2026 年 Q1 Fraud Index 与 FreightWaves 的 Fraud
              Fighters 报道给出更细颗粒度图景：拦截 527,940 封邮件、71,801 通伪造电话、399 起所有权变更事件、2,256 起身份盗用实例，并称客户的 double brokering 下降
              97%。第三方认可也支撑品类势头：Highway 位列 2025 FreightTech 25 第一，获得 2026 Fraud Fighters Award，并在 ITS Logistics 的获奖说明中被称为
              ITS 承运商 99% Highway-ELD 连接背后的平台。负面记录同样重要。Overdrive 记录了 owner-operator
              对公司更严格身份验证流程的反弹，包括上传驾照、面部图像，以及三年生物识别存储的说法，还包括拒绝验证可能导致账户访问丢失的风险。Freight Caviar
              从管理层侧面强化了同一方向：公司正在推进接近银行式的多点认证，战略上可能很有力，但也带来转化摩擦和误报问题，公开来源包尚未量化。
