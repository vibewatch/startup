  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价纪律与确认可见度
        blocks:
          - type: paragraph
            body: >-
              Highway 的公开记录支持其是一门面向经纪商的订阅软件业务，但只到机制层面。条款页把服务描述为按月订阅提供的在线承运商信息数据库；计划和产品页则展示了围绕 Connect Core、Load Lock
              和若干欺诈防控附加模块的模块栈。这足以说明，Highway 向货运经纪商销售经常性软件访问，而不是像经纪商一样变现货运量、像金融公司一样保理发票，或发布广义 load board 广告模式。


              一旦承销越过包装层面，公开变现图景就变弱。Highway 没有公布 Connect Core、Load Lock、Highway for Email、Highway for VoIP、Exclusion
              Intel 或 Load Limit 的美元价格。买方路径由演示驱动，公开页面未显示合约按经纪商、分支、用户、网络、货载收费，还是采用某种混合企业结构。TFX
              把产品故事拓宽到已验证货运交易和伙伴支持的支付，但证据仍未显示该扩张是否改变收入确认、引入服务收入，或创造任何 take-rate
              经济性。因此，严格解读应保持狭窄：公开来源证明经常性软件包装和多模块加售潜力，但没有证明实际定价、收入组合，或从 bookings 到确认收入的会计桥。
