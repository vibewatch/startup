            title: 跟踪是更克制的判断
            body: Highway 有足够的公开产品、客户和投资方证据，值得继续纳入覆盖；但估值披露不足，无法在未知私有价格下支持 买入建议。核心问题不是公司是否重要，而是其重要性背后的经济性是否像叙事暗示的那样强。
