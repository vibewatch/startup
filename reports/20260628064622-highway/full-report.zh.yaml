      - number: '3.4'
        title: 护城河、现状与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Highway 的护城河看起来真实，但很专门。最可防守的要素包括 NIST
              对齐的身份核验、覆盖语音、邮件和费率确认的经纪商侧渠道安全、正式伙伴生态，以及把威胁用经济语言呈现出来的专有欺诈遥测。这些功能围绕「承运商身份与访问管理」形成连贯品类叙事，而不是简单入驻。风险也同样可见。公开定价不透明，因此很难证明
              Highway 相比既有打包方案具备总拥有成本优势。更大的对手可以把相邻能力打包进更广平台：Descartes 可把入驻接到 MacroPoint 和其他物流系统，Truckstop 可把 RMIS 与其
              load board 位置配对，DAT
              可让人工加目录审查显得足够安全，从而守住既有工作流。还有真实证据显示，更激进身份检查会激怒小型承运商；这在战略上重要，因为安全如果过度拖慢入驻，会把运力推走。综合来看，当买方明确优先考虑可信访问和安全交易渠道时，Highway
              最强；当买方优化最大既有网络、货主侧风险套件或无预算现状方案时，Highway 较弱。
