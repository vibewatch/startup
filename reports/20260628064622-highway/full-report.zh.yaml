        - 截至 2026 年 5 月 15 日快照的月度仪表盘更新
        - 面向机动车承运人的官方注册和安全记录基础设施
        - 高
        - 承运人数量描述的是工作流规模，不是软件买方数量
      - - Highway 采用视角
        - '2025'
        - 美国
        - 1,050+ 家经纪商客户；美国前 100 大经纪商中的 70 家
        - 当前渗透率，不是增长率
        - 公司和投资者报告的安装基础
        - 中
        - 自报数据，且未披露付费模块组合或 ACV
      - - 欺诈损失视角
        - 2024-2026
        - 美国 / 北美
        - 3,625 起至近 4,000 起事件；损失约 $455M 至 $700M+
        - 2024 年同比增长 27%；预计 2025 年压力进一步上升
        - CargoNet、NICB 以及投资人 / 公司对盗窃和欺诈成本的汇总
        - 中
        - 损失测算口径不同，不能作为精确的 TAM 分母
      - - 双重经纪损失视角
        - '2026'
        - 美国
        - 年度损失估计 100M+
        - 持续性方向信号，而非周期性波动
        - FreightWaves 和 Truckstop 引用的行业专家估计
        - 中
        - 专家估计，不是经审计的行业账本
      - - 交易基础设施相邻视角
        - 2025-2026
        - 美国
        - 未披露以美元计的 TAM；从入驻延伸到订舱、信用和结算
        - 战略性产品扩张，而非已量化的市场增长
        - TFX 加 Triumph 围绕已验证交易的定位
