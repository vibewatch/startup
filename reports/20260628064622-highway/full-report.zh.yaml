      - 限制
    rows:
      - - FTV / Highway 经纪商人口视角
        - '2025'
        - 美国
        - 13,000+ 家经纪商；约占整车运输量 30%
        - 20 年市场份额约增至 4 倍（发布方表述）
        - 投资者和公司基于经纪商在整车运输中角色给出的市场框架
        - 中
        - 不是官方政府计数，也不是软件支出估算
      - - FMCSA 注册视角
        - '2026'
