      - number: '7.2'
        title: 监管、法律与隐私风险
        blocks:
          - type: paragraph
            body: >-
              Highway 的法律和监管暴露，首先来自产品本身：它不只是远程给承运人风险打分，而是直接触碰敏感身份和 工作流数据。2026 年 1 月 1 日隐私通知称，Highway 可能收集政府
              ID、照片或视频、生物识别数据、 地理位置、ELD 衍生位置数据和银行信息，并称通过验证供应商收集的生物识别数据最长可保存三年。这很
              重要，因为公开承运人批评已经集中到驾照和面部图像流程；伊利诺伊、得克萨斯和华盛顿也各有生物识别 隐私制度，一旦公司大规模收集并保留生物识别标识，这些制度就可能相关。合同姿态也偏单边：Highway
              条款保留修改服务、暂停或终止访问的广泛权利，同时否认对使用服务造成的损失或决策承担责任。这个组合 不能证明诉讼已经在路上，但如果更严格控制造成可衡量的商业损害，它会提高纠纷、集体诉讼理论或承运人 /
              经纪商商业索赔出现的概率。另一条监管线索来自 FMCSA 工作流变化。Highway 所在市场的验证仍依赖公开 承运人资质和注册数据，FMCSA 的 Motus 现代化则显示，标识符和注册工作流正转向以
              USDOT 为中心的结构。 如果资质验证基线变化，Highway 可能必须比客户预期更快地重建部分接入、异常处理和内部规则逻辑。 最后，Highway 正通过 Certified Insurance
              Agencies 计划把保险数据质量制度化；这在战略上聪明，但也 等于承认，陈旧或不准确的第三方保险数据足以威胁经纪商决策，并在信号出错时让平台背锅。
