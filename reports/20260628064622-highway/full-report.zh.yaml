  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河或风险维度
      - 当前评估
      - 威胁
      - 严重性
      - 缓释措施 / 尽调问题
    rows:
      - - 符合 NIST 的身份核验
        - 真实但偏垂直的差异点
