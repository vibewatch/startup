      - number: '3.2'
        title: 既有巨头与传统方案
        blocks:
          - type: paragraph
            body: >-
              DAT 和 FMCSA 代表 Highway 仍需替代的传统基线，即便它们的产品并不逐项对应 Highway 功能。DAT
              被审阅材料强调公有领域检查、目录审核、关系培养和流程纪律。这一点重要，因为许多经纪商已经生活在 load board 和承运商目录世界里，所以 DAT
              与其说是专门身份平台，不如说是固化既有习惯的既有工作流。FMCSA SAFER 则是纯免费现状方案。它提供公开注册和安全数据，Company Snapshot
              明确可免费逐个承运商查询。弱点在于，免费公开记录无法处理 Truckstop、DAT 和 Highway 都在描述的新欺诈向量：被劫持的收件箱、伪造电话号码、被篡改联系人，以及叠加在合法 MC
              号码上的身份盗用。换句话说，Highway 不只是在对抗其他软件供应商。它也在对抗一种根深蒂固的心智模型：SAFER
              加电话加人工文件已经「够好」。这条免费基线黏性强，但也正是供应商能把身份挂钩控制作为升级项而非锦上添花来销售的原因。
