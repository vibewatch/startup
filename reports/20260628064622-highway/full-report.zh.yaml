      - number: '7.4'
        title: 合作伙伴、依赖与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Highway 正在搭建一张密集依赖图，而不是一个纯独立 SaaS 护城河。TFX 由 Triumph 的评级、情报、支付和 信用能力驱动；收购 Newtrul 是为了加入承运人撮合和 TMS 集成；Parade
              和 McLeod 把 Highway 身份与交易 逻辑更深地分发进经纪工作流；Certified Insurance Agencies 计划则显示，保险方数据质量也成了正式依赖。
              这种合作伙伴密度在战略上很有力，因为它把 Highway 嵌进执行技术栈；但也意味着宕机、合同变化、数据共享 限制或合作伙伴重新定价，都能直接传导到 Highway
              的价值主张。竞争图景进一步抬高风险。Descartes MyCarrierPortal 披露 1,300+ 客户、250k+ 已验证承运人和 350k+ 存档承运人 COI，同时还受益于上市公司资源 和更广的
              Descartes 套件。Truckstop 称其 2025 年审查 63,000+ 个实体，在 RMIS 接入中拦下 14,000+ 次身份检查，因资质或权限原因拒绝 5,525 个账户，并报告 2024 年
              Q1 至 2025 年 Q1 客户报告欺诈下降 57%。 这些是真实的竞争对手证据点，不是抽象的品类同行。在市场低端，FMCSA 免费、一次查一个的 Company Snapshot
              让偏好人工流程、电话和保险验证的经纪商维持现状。因此，Highway 面临经典挤压：上方是更大的捆绑型既有厂商， 下方是免费 / 人工工作流。如果 Highway
              不能证明更严格控制能改善欺诈和货载结果，同时不制造不可接受的承运人 摩擦，合作伙伴依赖和竞争替代会先打击价格实现，再打击留存。
