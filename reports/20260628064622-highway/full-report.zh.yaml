      - number: '4.2'
        title: GTM 动作、需求证据与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Highway 看起来更像企业直销，而不是自助式。网站把买方导向演示，公司还配合伙伴计划、CHRW 集成证明，以及不断扩大的 TFX 生态，把 Highway 更深嵌入经纪商工作流。对一家成立于 2022
              年的公司而言，公开规模代理指标可观：Highway 的投资公告称平台服务超过 1,050 家经纪商，包括美国 Top 100 中的 70 家；FTV
              则把网络表述为数据优势，因为更大的经纪商参与能让欺诈模式更易被发现。这些不是收入披露，但可信地表明，公司已进入一个有意义经纪商群体的关键任务工作流。


              客户证明也方向积极。Sethmar 案例研究称 Load Lock 帮助阻止了一起 $130,000 盗窃；Transportation One 把 TFX
              描述为从被动追车转向基于车道运力采购的方式。这些例子比通用 logo wall
              更能支撑付费意愿和续约逻辑。仍不可得的是承销真正关心的效率指标：CAC、回本期、销售周期长度、实施负担、服务附加、扩展率和流失率。伙伴计划未来可能改善分发杠杆，但公开来源没有量化渠道驱动采用是降低获客成本，还是只是扩大触达。
