  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段与商业模式
        blocks:
          - type: paragraph
            body: >-
              Highway 把自己定位成面向货运经纪商的 Dallas 基础设施层，而不是广义的货主侧物流市场。从官网、融资公告到投资人材料，公司反复强调自己开创了 Carrier Identity
              这一品类：软件帮助经纪商验证到底是谁在承运货物，自动化合规，并在不拖慢数字订舱的前提下降低欺诈。保留来源包支撑 2022 年成立、总部在
              Dallas，也支持把当前阶段描述为私营、成长阶段、少数股权成长投资之后，而不是风险种子期或临近 IPO 后期。买方也清楚。FreightWaves 引述 Jordan Graft 称 Highway
              服务经纪商而非货主，官网则把流程从 tender 到交付组织为识别、连接、监控。产品页进一步显示，Highway 想成为承运商身份和风险的数据型记录系统，而不只是一次性入驻检查。主要身份缺口在法律形式细节：这组
              30 个 URL 的来源未披露注册法人名称或注册州，后续尽调应直接向公司登记记录确认。
