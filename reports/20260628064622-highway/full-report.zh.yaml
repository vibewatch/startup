  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接竞争对手与差异化
        blocks:
          - type: paragraph
            body: >-
              Highway 最接近的直接竞争来自嵌在经纪商承运商入驻和资质审核工作流里的供应商，而不是通用欺诈情报产品。Truckstop RMIS
              是最清晰的一对一对手，因为它直接向经纪商销售承运商入驻、监控和欺诈控制，并用结果指标支撑卖点：Truckstop 称 RMIS 可让入驻速度最高提升 80%，从 2024 年 Q1 到 2025 年 Q1
              客户报告欺诈下降 57%，2025 年审核超过 63,000 个实体，并通过身份或资质检查失败拦截约 20,000 个潜在入驻。Descartes MyCarrierPortal 是更大的平台型对手：它披露
              1,300+ 客户、250k+ 已入驻承运商、350k+ 在档承运商 COI，并把 MCP 与 MacroPoint FraudGuard 连接，打包入驻、可视化和欺诈防控。Highway
              的公开差异化更窄，但更锋利。它把身份核验、车道情报、安全交易所访问、电话控制和费率确认安全放在一个身份优先工作流里。因此，当经纪商把欺诈视为交易渠道问题时，Highway
              更像专门为其打造；当买方偏好更广泛的既有数据或网络位置时，Truckstop 和 Descartes 看起来更强。
