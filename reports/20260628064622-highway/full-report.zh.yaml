      - number: '8.2'
        title: 可比披露视角与敏感性框架
        blocks:
          - type: paragraph
            body: >-
              最干净的公开视角不是完美估值可比公司，而是披露可比公司。C.H. Robinson 展示了一家上市货运运营商每季、 每年披露什么：收入规模、申报节奏和运营量指标都可见。Descartes
              展示了物流软件平台通过投资者关系和公开 市场数据会释放什么。两者合在一起，框出很宽的倍数区间：一边是低销售倍数的货运经纪经济性，另一边是明显 更高的物流软件收入倍数。正是这个区间说明，Highway
              不能只靠相邻公司来估值。


              不过，公开信息足以支撑一个克制的思想实验。Highway 称其服务超过 1,050 家经纪商，但不发布定价。若用每家 经纪商 $20K 到 $50K 的推测 ACV 区间，得出的 ARR 区间约为 $21M 到
              $52.5M。这不是 Highway 事实，而是承保 问题。把启发式 5-15x ARR 框架套到这个估算区间上，得到的指示性企业价值约为 $105M 到 $788M。这个练习的
              价值只在于说明，可能答案仍然很宽，判断仍高度依赖未披露的定价、付费账户定义、留存和利润率。
