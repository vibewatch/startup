        - 货源板、目录、公开数据审核、流程指引
        - 根深蒂固的既有流程和关系
        - 已审阅材料未显示 Highway 式跨渠道身份绑定控制
      - - Descartes MyCarrierPortal + MacroPoint
        - 既有平台型对手
        - 1,300+ 家客户；250k+ 承运商已入驻；350k+ 份 COI 在档；100k+ 起欺诈活动被标记
        - 经纪商、3PL、托运人
        - 承运商入驻、合规、保险监控、事件报告、可视性相邻能力
        - 同行中披露规模最大，打包路径最强
        - 在订舱时点的安全交易渠道上，聚焦不如 Highway 明确
      - - GenLogs
        - 相邻的现实世界验证平台
        - 官方网站称累计 4.2B 张图像、每日 16M 张；AWS 页面称每日 15M 张
        - 经纪商、托运人、风险团队
        - 路侧传感器情报、图像证明、采购、合规、资产监控
        - 独特的现实世界真相层，可在纸面记录之外验证承运商行为
        - 不是完整入驻或安全通信平台
      - - Overhaul
        - 相邻风险 / 可视性平台
        - 企业可视性平台，披露客户 ROI 和合规主张，但未披露经纪商网络数量
        - 托运人和高后果货物运营方
        - SKU 级可视性、预测性风险情报、承运商验证、盗窃干预
        - 相比 Highway，货运风险和保险框架更宽
        - 对经纪商网络入驻和承运商访问控制的聚焦较弱
      - - CargoNet
        - 相邻盗窃追回网络
        - 7×24×365 指挥中心和执法信息共享，但不是入驻网络
        - 承运商、经纪商、保险公司、执法机构
        - 货物盗窃预防、警报、分析、追回协调
        - 面向货物盗窃事件的强追回和情报网络
        - 不能替代身份验证入驻或订舱流程
      - - FMCSA SAFER / 人工流程
        - 免费现状替代
        - 公开安全和登记数据；Company Snapshot 可免费逐个查询承运商
        - 任何人工审核承运商的人
        - 登记查询、安全历史、经营资质检查
        - 免费、熟悉，且已嵌入日常流程
        - 身份、冒名和安全通信缺口仍未解决
    notes: 本表列出已审阅 2025–2026 年来源集中证据最充分的直接、既有、相邻和替代方案。规模指标口径不一，因此各行比较披露的牵引力信号，而不是强行归一到同一单位。
