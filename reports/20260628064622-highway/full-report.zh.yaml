      - - Truckstop RMIS
        - Truckstop 生态内的经纪商软件订阅
        - 无公开标价；公开主张是入驻速度最高提升 80%
        - 入驻、监控、合规、可疑 IP 拦截、差异警报
        - 具体合同结构和实际节省未披露
        - 经纪商安全买方看到的最接近同类打包替代
      - - DAT
        - 货源板 / 目录 / 流程既有方案
        - 已审阅页面未见公开价格
        - 目录、审核指引、关系和流程工具
        - 已审阅页面未见公开欺诈结果指标
        - 往往靠已嵌入流程竞争，而不是靠匹配 Highway 的功能宽度
      - - Descartes MyCarrierPortal + MacroPoint
        - 平台订阅，包含入驻、监控和与 MacroPoint 相连的欺诈栈
        - 无公开标价
        - 承运商入驻、COI 监控、欺诈标记、事件报告、可视性相邻能力
        - MCP 与 MacroPoint FraudGuard 之间的实际打包方式未公开披露
        - 即便看不到定价，打包宽度仍是关键威胁
      - - GenLogs
        - 企业情报平台
        - 无公开价格；市场化销售偏咨询式
        - 路侧传感器真相层、采购、合规、资产监控
        - 商业打包和单用户经济性未披露
        - 买方更看重已观察行为而非入驻自动化时，可能拿到预算
      - - Overhaul / CargoNet
        - 企业风险平台或网络会员
        - 已审阅页面未见公开标价
