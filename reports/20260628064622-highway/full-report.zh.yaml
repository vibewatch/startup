      - number: '1.2'
        title: 领导层、治理与资本
        blocks:
          - type: paragraph
            body: >-
              公开领导层记录范围有限，但口径一致。Jordan Graft 是创始人兼 CEO；FTV 的投资备忘录明确指出其 founder-market fit：创办 Highway 前，他运营
              TriumphPay，亲身看到货运欺诈无法仅靠工作流点工具解决。Michael Caney 在多次产品发布中以 Chief Commercial Officer 身份出现；Mark Ford 于 2025 年 6
              月加入，任 Chief Capacity Officer，此前在 BlueGrace 和 Coyote 担任高管，显示公司正努力把身份基础设施接到网络增长和采购流程上。治理透明度更弱。2025 年 8 月 20
              日的融资被充分交叉印证：FTV Capital 领投、Lead Edge 参投的战略性少数股权成长投资，并让 Jerome Hershey 和 Nimay Mehta 加入董事会；Raymond James 和
              TD Securities
              分别为双方提供顾问服务。公开资料仍未揭示的内容，对后续尽调同样重要：金额未披露，估值和股权分配未披露，保留来源包也没有完整董事名单、创始人持股或投资人控制权。员工数只得到部分确认：FTV 在 2025 年 8
              月提到 100 人，但保留公开来源均未把该数字更新到 2026 年。
