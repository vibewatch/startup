      - number: '3.3'
        title: 相邻和替代竞争对手
        blocks:
          - type: paragraph
            body: >-
              几类相邻产品会吸走本可支持 Highway 的预算，即便它们并不从承运商入驻切入。GenLogs
              是最重要的相邻新进入者，因为它销售的是物理世界验证，而不是纸面验证。其卖点是，路侧传感器、计算机视觉和照片证据能揭示承运商在真实世界中实际在做什么；按来源时间不同，每天图像量为 1,500 万至 1,600
              万张。这可以补充 Highway，但如果买方认为可观察行为比身份挂钩工作流控制更有价值，也会削弱 Highway 车道和风险信号的独特性。Overhaul 和 CargoNet 距离 Highway
              核心更远，但二者仍重要。Overhaul 把问题界定为高后果货物的货运可视化、预测风险、合规和承运商验证。CargoNet 则把它界定为与执法和安全信息共享相连的防盗与追偿网络。替代集合还包括 FMCSA
              检查、电话验证、保险验证和内部表格组成的人工组合。因此，买方至少可以通过四种模式完成同一任务：直接入驻软件、既有网络工具、物理世界情报，或分层人工流程。
