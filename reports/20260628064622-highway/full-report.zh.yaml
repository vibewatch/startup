  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与买方图谱
        blocks:
          - type: paragraph
            body: >-
              Highway 的客户基础最好理解为经纪商优先的信任和工作流层，而不是货主侧货运市场。公开名单横跨 C.H. Robinson、Schneider 的 Brokerage 和 Power Only 业务、MODE
              Global、RXO、Arrive Logistics、ITS Logistics、Allen Lund、NTG 等大型货运经纪商和物流网络，也包括 Circle Logistics、Axle
              Logistics、Sethmar Transportation、Transportation One 等更小或更偏运营的用户。这种跨度重要，因为它说明 Highway
              并不依赖单一买方原型。共同线索不是垂直行业，而是工作流痛点：这些客户需要验证到底是谁在承运货物，自动化合规检查，保护数字订舱，并在不拖慢覆盖的情况下减少欺诈。产品和演示页面进一步证明，买方通常是经纪商侧运营、合规、承运商采购或数字订舱负责人，而不是货主采购团队。因此，分层模式具有吸引力：Highway
              看起来同时适用于蓝筹企业经纪商、中型经纪公司，以及需要在既有系统内嵌入可信承运商身份的货运科技平台。
