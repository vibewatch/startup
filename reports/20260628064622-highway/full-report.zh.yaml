      - number: '4.3'
        title: 成本结构、毛利驱动与运营风险
        blocks:
          - type: paragraph
            body: >-
              尽管没有公开来源披露毛利率，Highway 的成本结构轮廓仍可读。隐私政策和产品页描述的服务会收集 ID、生物识别、地理位置和 ELD
              连接的位置数据，同时运行连续监控、安全通信和货载级告警。这意味着交付栈包含身份验证供应商、数据增强源、远程信息处理和地图依赖、通信工具、集成，以及用于调查事件的客户风险或运营职能。换句话说，Highway
              可能销售软件，但其成本底座不像零接触、纯软件。


              负面证据重要，因为它标出这些成本和风险可能咬人的位置。Overdrive 记录了承运商对驾照和生物识别验证的反弹；这在商业上相关，因为如果用户认为流程过于侵入，信任平台会制造自己的入驻摩擦。2026 年 2 月与
              Samsara 中断有关的事件显示，Load Lock 告警及相关更新容易受外部系统故障影响。这些信号并不推翻 Highway
              的价值；它们说明，服务交付依赖敏感数据流、伙伴可靠性和用户对验证流程的信任。没有毛利率、供应商集中度、支持负荷或实施成本的公开披露，最稳妥结论是：Highway 长期毛利率可能有吸引力，但目前无法用公开证据验证。
