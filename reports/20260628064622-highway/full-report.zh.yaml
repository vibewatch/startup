      - number: '8.4'
        title: 最终尽调问题与论点破裂触发因素
        blocks:
          - type: paragraph
            body: >-
              最终投资判断更多取决于管理层披露，而不是全新的市场研究。缺失项都是常规承保输入：实际定价、客户定义清晰度、 ARR、GRR / NRR、毛利率、客户集中度，以及 2025 年 8
              月融资的具体经济条款。没有这些数据，公开证据可以支持 业务质量和品类紧迫性，但支撑不了价格纪律。即便 FTV 对盈利能力和留存的表述很强，在管理层数字证实之前， 它仍是投资方叙事。


              如果付费客户渗透率显著低于头部经纪商数量、附加率较窄、毛利率被数据供应商或支持成本拖累，或新一轮条款 制造优先权悬顶并压制普通股上行，论点会迅速走弱。反过来，一个相对小的私有数据包就能显著改善判断。如果管理层
              能展示强 ACV、软件式毛利率、干净留存和直接明了的融资经济性，Highway 几乎不需要公司本身发生多大变化，就能 从可跟踪变成可行动。
