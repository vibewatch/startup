        - 高附加购买率和续约披露会显著强化这一假设。
      - - 客户假设
        - 服务 1,050+ 家经纪商且打入前 100 大经纪商，说明市场相关性真实，不是微不足道的试点足迹。
        - 需要付费账户口径和集中度数据，才能把触达转化为承保信心。
      - - 股东方假设
        - FTV 关于盈利能力和留存的表述方向上偏正面，也符合成长型股权投资的背书逻辑。
        - 审计指标或管理层指标必须证明，股东方表述反映了真实经济性。
      - - 披露反假设
        - 公开资料没有披露估值、收入、定价、ARR 或融资条款。
        - 即便管理层只披露适度信息，也可能很快收窄当前不确定性区间。
      - - 负面反假设
        - 承运商验证遇阻和故障证据表明，信任产品可能制造摩擦和依赖风险。
        - 如果有证据显示这些问题低频且商业上可控，这一担忧会下降。
      - - 投资反假设
        - 公司可能具备战略价值，但在价格未知时，仍未必是可以买入的私募资产。
        - 相对于实际 ARR 和留存的已披露或经尽调确认的估值标记，是关键解锁点。
    notes: 每一行都把当前叙事与推动建议变化所需的精确披露或经营证据配对。
