  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: standard
    summary: 产品和客户证据真实、财务赞助方支持明确；扣除信息不透明和负面摩擦后，结论才落到跟踪。
    data:
      nodes:
        - id: proof
          label: 产品与客户证明
          detail: 1,050+ 家经纪商、客户案例和多模块产品宽度，支撑其相关性。
          tone: positive
        - id: sponsor
          label: 成长股权赞助
          detail: FTV 和 Lead Edge 背书，释放外部信心信号。
          tone: positive
        - id: opacity
          label: 财务不透明
          detail: 估值、ARR、定价、留存或轮次条款均未公开。
          tone: warning
        - id: adverse
          label: 负面摩擦
          detail: 验证阻力和中断证据增加执行风险。
          tone: warning
        - id: stance
          label: 估值立场未知
          detail: 公开数据不足以有把握地判断估值有吸引力、公允还是偏高。
          tone: neutral
        - id: call
          label: 投资建议
          detail: 跟踪 | 中等信心 | 中等风险 | 6.5/10
          tone: neutral
      edges:
        - from: proof
          to: sponsor
          label: 强化
        - from: sponsor
          to: opacity
          label: 但无法解决
        - from: opacity
          to: adverse
          label: 放大影响
        - from: adverse
          to: stance
          label: 维持
        - from: stance
          to: call
          label: 推动
    approximationNotes: 该流程只是按分析顺序排列决策因素，不是加权评分模型。
    claimRefs:
      - CV012
      - CV026
      - CV027
      - CV034
      - CV037
      - CV038
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 假设 ACV 和 ARR 倍数只要小幅变化，企业价值区间就会被拉得很宽，因为 Highway 没有公开这两个输入。
    data:
      items:
        - label: 低 ARR 思维实验，5x
          value: 105
          unit: $M
        - label: 低 ARR 思维实验，10x
          value: 210
          unit: $M
        - label: 低 ARR 思维实验，15x
          value: 315
          unit: $M
        - label: 高 ARR 思维实验，5x
          value: 262.5
          unit: $M
        - label: 高 ARR 思维实验，10x
          value: 525
          unit: $M
        - label: 高 ARR 思维实验，15x
          value: 787.5
          unit: $M
    approximationNotes: 每根柱子都来自估算：在 1,050 家经纪商上假设 $20K-$50K 的 ACV 区间，再套用经验性的 5-15x ARR 区间。 这些数值都不是 Highway 披露的指标。
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 情景结果仍然很宽，因为公开记录更能证明需求和融资可得性，却不太能证明定价和收入质量。
    data:
      items:
        - label: 悲观
          low: 105
          value: 180
          high: 262.5
          unit: $M
          claimRef: CV041
        - label: 基准
          low: 210
          value: 367.5
          high: 525
          unit: $M
          claimRef: CV040
        - label: 乐观
          low: 525
          value: 656
          high: 787.5
          unit: $M
          claimRef: CV039
    approximationNotes: 这些情景区间是在公开思维实验上叠加的分析师估算，不是管理层预测、按市值重估结果或已披露融资条款。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV037
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: Highway 在市场需求和产品相关性上得分最高，在估值支撑和财务披露质量上最弱。
    data:
      items:
        - label: 市场需求
          value: 8/10
          detail: 货运欺诈的紧迫性和客户痛点都有充分证据。
          tone: positive
        - label: 产品 / 工作流证明
          value: 7/10
          detail: 产品宽度、客户案例和合作伙伴集成，显示出真实运营相关性。
          tone: positive
        - label: 客户规模证明
          value: 7/10
          detail: 1,050+ 家经纪商有分量，但变现细节缺失。
          tone: positive
        - label: 财务可见度
          value: 3/10
          detail: ARR、收入、定价、留存或毛利率均无公开披露。
          tone: warning
        - label: 估值支撑
          value: 3/10
          detail: 没有公开标记或轮次条款，投资判断仍然对价格敏感。
          tone: warning
        - label: 运营风险
          value: 5/10
          detail: 验证摩擦和中断证据可控，但确实存在。
          tone: neutral
        - label: 尽调就绪度
          value: 6/10
          detail: 即使公开数据不完整，下一轮尽调资料包也很明确，而且相对紧凑。
          tone: neutral
    approximationNotes: 这些分数是基于公开证据综合出的 IC 式判断指标，不是公司报告的 KPI。
    claimRefs:
      - CV035
      - CV036
      - CV038
      - CV042
      - CV043
