      - number: '2.2'
        title: 受证据约束的 TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >-
              本章审阅的公开来源没有给出经纪商承运商身份软件的清晰美元 TAM，因此任何市场规模判断都只能三角交叉。最宽但有用的视角是买方数量：FTV 和 Highway 描述了一个超过 13,000
              家货运经纪商的宇宙，管理约三分之一的美国 truckload 货量。第二个视角是工作流规模：FMCSA 官方注册统计和 SAFER
              系统显示，经纪商面对的是庞大的联邦注册承运商基础，因此身份验证是经常性运营需求，而不是小众边缘案例。第三个视角是痛感强度：货物盗窃和非法转包损失足够大，即便它们不同于软件
              TAM，也足以支撑软件支出。第四个视角是当前采用：Highway 称已服务超过 1,050 家经纪商，包括 Top 100 中的 70 家，说明企业细分并非假设。正确结论应谨慎。Truckload
              支出和盗窃损失描述的是经济暴露面，但不能证明同等规模的软件市场。可防守的 TAM 是经纪商账户和风险暴露叙事；近期 SOM 应以低数千个经纪商账户衡量，而不是膨胀的货运美元。
