      - number: '7.3'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              Highway 的运营风险来自一个不舒服的不对称：客户越来越需要这个平台，正是因为欺诈者适应很快；但 Highway 越是从静态接入走向实时货载保护，就越要承担可用性、数据质量和误报负担。Highway
              自己公开的 遥测数据把军备竞赛说得很清楚。2025 年 Q4 欺诈指数称，2025 年拦截近 200 万次欺诈邮件尝试、850 万个 欺诈电话号码，并出现一种 2025
              年末模式：合法提货随后被伪造改道指令攻破。2026 年 Q1 材料延续了这个方向， 单季就有 527,940 封欺诈邮件和 71,801 个伪造电话号码被拦截。这个背景支持 Highway 更激进的控制，但也放大
              了漏判和误报的代价。Overdrive 记录了一名承运人的指控：Highway 错误地把保险标为过期，耗费了时间和金钱； 无论这个个案是否有代表性，它都准确显示运营质量如何转化为商业损害。2026 年 2 月
              23–24 日 Load Lock 事件 同样重要，因为它证明 Highway 的货载级保护并非自成一体：一次 Samsara 中断就足以影响警报和货运里程碑更新。 同时，Highway
              自己的产品表述也确认其依赖 ELD 活动、物理位置、货物保险和服务区域信号。也就是说，数据来源、 延迟和合作伙伴可用性不是边缘问题，而是核心产品承诺的一部分。安全姿态只能相对缓解：Highway 指向银行级 或
              NIST 对齐的身份标准，但公开证据没有披露误报率、申诉量或人工异常处理的运营成本。
