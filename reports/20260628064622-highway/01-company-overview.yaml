  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital-structure-gap
    missingEvidence: Exact investment amount, valuation, ownership percentages, board rights, and investor control terms for the August 2025 growth-equity transaction.
    whyItMatters: The company is clearly past seed stage, but the public pack cannot translate that financing into dilution, governance leverage, or valuation benchmarking.
    diligencePath: Request the signed term sheet, cap table, board consents, and investor rights agreement covering the 2025 transaction.
    relatedQuestionRefs:
    - QO010
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: current-scale-gap
    missingEvidence: A current 2026 headcount figure plus the operating metrics that would connect customer traction to company scale, including revenue, ARR, gross margin, and retention.
    whyItMatters: Without updated scale and economics, the chapter can show product momentum but cannot judge how efficiently that momentum is monetized or staffed.
    diligencePath: Request the current org chart, HRIS headcount export, board deck KPI page, and any lender or investor operating summary used after August 2025.
    relatedQuestionRefs:
    - QO012
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: identity-verification-friction-gap
    missingEvidence: Systematic data on carrier appeal rates, churn, false positives, or broker adoption drag caused by stricter IDV and biometric-style verification steps.
    whyItMatters: Overdrive provides credible anecdotal backlash, but an investment view needs to know whether the friction is edge-case noise or a material go-to-market and retention risk.
    diligencePath: Request carrier conversion-funnel data, rejected-IDV counts, false-positive audits, customer-support volumes, and broker retention data before and after IDV rollout.
    relatedQuestionRefs:
    - QO024
