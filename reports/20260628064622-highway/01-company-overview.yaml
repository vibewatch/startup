company:
  name: Highway
chapter:
  number: 1
  title: Company Overview
  summary: Highway is a Dallas-based, growth-stage freight-broker SaaS company founded in 2022 that built a carrier-identity control layer for brokers and has rapidly expanded into load-level protection, secure exchange, and capacity sourcing. Public sources support strong broker penetration, fast 2025-2026 product expansion, and meaningful fraud-prevention telemetry, but they still leave financing size, valuation, legal-entity details, current 2026 headcount, and unit economics undisclosed.
sections:
- id: identity-stage-and-business-model
  title: Identity, Stage, and Business Model
  body: 'Highway presents itself as a Dallas-based infrastructure layer for freight brokers rather than a broad shipper-facing logistics marketplace. Across the homepage, financing announcement, and investor materials, the company consistently describes itself as the category creator of Carrier Identity: software that helps brokers verify who is actually hauling a load, automate compliance, and reduce fraud without slowing down digital booking. The retained source pack supports a 2022 founding date, a Dallas headquarters, and a current stage best described as private, growth-stage, and post-minority growth-equity rather than venture-seed or late-pre-IPO. The buyer is also clear. FreightWaves quotes Jordan Graft saying Highway serves brokers, not shippers, while the homepage organizes the workflow around identify, connect, and monitor from tender through delivery. Product pages add that Highway is trying to become a data-rich system of record for carrier identity and risk, not just a one-time
    onboarding check. The main identity gap is legal-form specificity: this 30-URL source set does not disclose the incorporated legal entity name or state of incorporation, so later diligence should confirm those directly from corporate records.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO015
  - CO016
  - CO017
  - CO042
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: leadership-governance-and-capital
  title: Leadership, Governance, and Capital
  body: 'The public leadership record is narrow but consistent. Jordan Graft is the founder and CEO and, in FTV''s investment memo, the founder-market fit is explicit: before starting Highway, he ran TriumphPay and learned firsthand that freight fraud could not be solved with workflow point tools alone. Michael Caney appears repeatedly as Chief Commercial Officer across product releases, while Mark Ford joined in June 2025 as Chief Capacity Officer after senior roles at BlueGrace and Coyote, signaling an effort to connect identity infrastructure to network growth and procurement workflows. Governance transparency is thinner. The August 20, 2025 financing is well corroborated as a strategic minority growth-equity investment led by FTV Capital with Lead Edge participation, and it added Jerome Hershey and Nimay Mehta to the board while Raymond James and TD Securities advised the two sides. What public sources still do not reveal is equally important for later diligence: the dollar amount was
    undisclosed, the valuation and ownership split were undisclosed, and the retained source pack does not give a full board roster, founder ownership, or investor control rights. Headcount is only partially resolved: FTV referenced 100 individuals in August 2025, but none of the retained public sources update that figure for 2026.'
