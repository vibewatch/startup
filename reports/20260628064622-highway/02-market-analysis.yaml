  evidenceGaps:
  - type: missing-source
    severity: material
    topic: serviceable-buyer-count
    missingEvidence: A broker-segmented dataset showing how many of the 13,000-plus brokers source enough open-market truckload
      capacity to justify identity orchestration.
    whyItMatters: Without a broker-count cut by capacity-sourcing intensity, the chapter can frame TAM, SAM, and SOM only
      as scenario ranges rather than a precise addressable-account model.
    diligencePath: Obtain TIA, DAT, or management segmentation by broker size, digital booking mix, and fraud exposure; validate
      with 10-15 broker interviews.
    relatedQuestionRefs:
    - QM022
    - QM025
  - type: private-evidence-only
    severity: material
    topic: pricing-and-acv
    missingEvidence: Module-level pricing, ACV, retention, and attach-rate data for onboarding, monitoring, load-level compliance,
      and TFX workflows.
    whyItMatters: Pricing power determines whether a large buyer universe translates into attractive software revenue, but
      public sources do not disclose Highway’s monetization profile.
    diligencePath: Request the price book, cohort retention, and customer expansion data in diligence; corroborate with customer
      calls across enterprise and mid-market brokers.
    relatedQuestionRefs:
    - QM023
  - type: conflicting-data
    severity: material
    topic: fraud-loss-methodology
    missingEvidence: A reconciled methodology tying direct cargo theft, identity fraud, double brokering, and payment loss
      into one non-overlapping annual loss model.
    whyItMatters: Public estimates range from roughly $455 million of direct cargo losses to $700 million-plus broader estimates,
      which is enough to prove urgency but not enough to build a precise ROI benchmark.
    diligencePath: Reconcile CargoNet, NICB, TIA, Highway, and insurer taxonomies so each loss bucket is counted once and
      mapped to the product module that reduces it.
    relatedQuestionRefs:
    - QM024
