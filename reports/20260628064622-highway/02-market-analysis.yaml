tables:
- id: TM001
  title: Market definition table
  columns:
  - Category
  - Included spend / workflow
  - Excluded or adjacent spend
  - Status-quo substitute
  - Buyer / payer
  - Relevance to Highway
  rows:
  - - Carrier identity and onboarding
    - Identity proofing, authority checks, dispatcher authorization, insurance thresholds, and broker network enrollment
    - Generic shipper procurement tools or fleet management systems
    - Manual FMCSA, SAFER, COI, email, and phone checks
    - Freight broker operations or compliance budget
    - Core included market and Highway’s original wedge
  - - Continuous monitoring and load-level compliance
    - Behavioral alerts, contact-change monitoring, load lock, exception routing, and secure execution controls
    - Generic cargo visibility or telematics platforms unless tied to access control
    - Rules spreadsheets and reactive exception handling
    - Broker risk, operations, or fraud-prevention budget
    - Included because fraud now appears after onboarding, not just before it
  - - Trusted exchange access control
    - Identity-verified booking, vetted carrier access, and secure digital tendering
    - Open load boards without identity controls
    - Traditional load boards plus manual carrier callbacks
    - Broker digital-booking or marketplace budget
    - Adjacent but increasingly central as Highway moves from vetting into transactions
  - - Payments and settlement trust layer
    - Credit assurance, secure settlement, and invoice/payment workflows connected to verified transactions
    - Standalone factoring, shipper AP software, or bank products outside freight execution
    - Separate payment vendors and manual settlement controls
    - Broker finance or operations budget
    - Adjacent expansion area through Triumph rather than the original core market
  - - Excluded systems of record
    - None beyond the trust and access layer Highway directly touches
    - Shipper TMS, generic cybersecurity suites, carrier back-office ERP, asset telematics
    - Incumbent systems of record stay in place
    - IT or fleet budgets outside broker trust workflows
    - Important exclusion so TAM is not inflated to all logistics software or all trucking spend
  notes: This table defines Highway’s market by workflow control, not by broad logistics-software labels. Truckload or fraud-loss
    figures are contextual inputs, not themselves the software market.
