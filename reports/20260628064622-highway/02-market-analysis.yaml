- id: growth-drivers-constraints-and-diligence-gaps
  title: Growth Drivers, Constraints, and Contradictions
  body: 'The clearest driver is the simple rise in fraud pressure. NICB, FreightWaves, DAT, and Highway’s own index all point
    to higher cargo-theft and identity-based attack levels, while double brokering remains costly enough to justify spend
    on prevention. The second driver is workflow expansion: if a broker already trusts Highway for onboarding, it can rationally
    extend into load-level compliance, secure rate confirmations, and trusted exchange or settlement workflows. The third
    driver is geography and commodity concentration, because brokers moving high-value freight through California, Texas,
    or cross-border corridors should see faster ROI. The constraints are equally important. Carrier privacy objections show
    that stronger controls can slow network growth. Substitute products and internal compliance stacks mean Highway is competing
    for an existing budget, not entering a blank field. Most importantly, the public record preserves contradictory loss estimates,
    and there is still no independent software TAM or pricing disclosure. That means the market looks strategically important
    and likely durable, but still evidence-constrained on monetization depth and on how much of the broad broker universe
    will adopt the full identity-first operating model.'
