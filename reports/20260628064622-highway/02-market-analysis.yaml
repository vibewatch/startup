- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Cargo theft and identity-based fraud escalation
    - Tailwind
    - Current
    - Creates urgent loss-avoidance ROI for broker trust software
    - Request customer-level before-and-after fraud-loss data by module
  - - Official-registry insufficiency
    - Tailwind
    - Current
    - FMCSA and SAFER remain necessary but insufficient for modern impersonation and inbox attacks
    - Quantify how often fraud bypassed a carrier that looked valid in official records
  - - Digital booking and secure communications demand
    - Tailwind
    - Current to medium term
    - Rewards vendors that can move from onboarding into trusted booking workflows
    - Measure attach rate of secure rate-con, load lock, and TFX products
  - - Payments and settlement integration via Triumph
    - Tailwind
    - Medium term
    - Could increase share of wallet by attaching credit assurance and settlement to verified transactions
    - Test whether brokers buy Highway and Triumph together or still run separate buying centers
  - - Carrier privacy and onboarding friction
    - Headwind
    - Current
    - Stricter verification can reduce carrier participation or create backlash among small fleets
    - Track carrier completion rates, appeals, and churn after identity-verification changes
  - - Budget-category ambiguity
    - Headwind
    - Current
    - Buyers may see the tool as compliance software, fraud software, or booking infrastructure, which complicates ROI ownership
    - Map who signs the contract and who benefits operationally in each segment
  - - Manual and competitor substitutes
    - Headwind
    - Current
    - RMIS, internal compliance teams, and manual FMCSA workflows keep the category competitive and price-sensitive
    - Benchmark win rates against RMIS and against no-new-vendor decisions
  - - TAM opacity and conflicting loss estimates
    - Headwind
    - Current
    - Makes valuation narratives easy to overstate and hard to normalize across sources
    - Reconcile CargoNet, NICB, Highway, and TIA methodologies before using any ROI benchmark
  notes: The most important rows are the ones that slow adoption, not just the ones that create urgency. Market attractiveness
    is real, but public evidence still leaves pricing power and buyer saturation unresolved.
