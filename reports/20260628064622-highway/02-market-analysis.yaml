figures:
- id: FM001
  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: A cautious broker-count pyramid is more defensible for Highway than a freight-dollar TAM because public evidence
    is strongest on buyer counts, fraud exposure, and current penetration.
  data:
    nodes:
    - label: Excluded outer boundary — all U.S. trucking and logistics software
      value: Too broad for Highway
      description: Useful only as context because Highway does not sell general fleet, shipper, or cybersecurity systems.
    - label: TAM context — broker-managed truckload trust surface
      value: 13,000+ brokers; ~30% of truckload volume
      description: The broad practical buyer universe is freight brokers that control carrier access on a large share of truckload
        freight.
    - label: SAM — brokers with heavy external carrier onboarding and fraud exposure
      value: Low-thousands to mid-thousands of accounts (estimated)
      description: The relevant slice narrows to brokers that routinely source outside capacity and therefore need stronger
        identity, monitoring, and compliance controls.
    - label: SOM — Highway installed base plus near-term expansion
      value: 1,050+ brokers today
      description: Current penetration proves the segment exists, but public evidence is still too thin to claim the whole
        broker universe is equally reachable.
  approximationNotes: The second and third layers are scenarios rather than audited market counts. Broker count and truckload-share
    anchors come from Highway and FTV, while the SAM layer is an evidence-constrained estimate built from workflow intensity
    rather than a published analyst report.
  claimRefs:
  - CM004
