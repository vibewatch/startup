- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Economic buyer
  - Primary user
  - Payer / budget owner
  - Core workflow
  - Adoption trigger
  - Likely entry product
  rows:
  - - Top-100 national broker
    - COO, chief digital officer, or compliance leader
    - Carrier sales, risk, compliance, operations
    - Operations or risk budget with executive sponsorship
    - High-volume carrier onboarding and exception handling
    - Repeated fraud losses or need to standardize trust controls across branches
    - Carrier Identity Engine plus continuous monitoring
  - - Large 3PL or managed transportation provider
    - VP operations or managed transportation leader
    - Operations, account management, compliance
    - Operations budget tied to shipper service levels
    - External carrier sourcing for shipper freight programs
    - Need to reduce fraud without slowing shipper execution
    - Identity plus load-level compliance
  - - Mid-market regional broker
    - Founder, GM, or head of operations
    - Carrier sales and operations team
    - Owner or operations budget
    - Qualify new carriers faster without building internal tooling
    - A few expensive fraud events or rising onboarding burden
    - Onboarding and monitoring bundle
  - - Digital-growth brokerage
    - Head of digital brokerage or product-minded COO
    - Carrier ops, fraud, and digital-booking teams
    - Growth or operations budget
    - Automate trust around self-serve or faster digital booking
    - Need to scale booking volume without scaling manual checks
    - Identity plus secure booking or TFX
  - - Carrier network participant
    - Not usually the payer
    - Dispatcher, driver, or carrier admin
    - N/A for direct spend
    - Complete verification and gain access to broker freight
    - Need for freight access and faster approvals
    - Identity verification and trusted-network access
  notes: Carriers are included because they are essential to adoption but usually are not the paying customer. Budget ownership
    is inferred from workflow economics and should be validated in management and customer interviews.
