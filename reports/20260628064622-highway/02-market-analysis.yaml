artifact: market-analysis
slug: highway
runDate: '2026-06-28'
company:
  name: Highway
chapter:
  number: 2
  title: Market Analysis
  summary: Highway’s market is best defined as the broker-facing carrier identity, onboarding, compliance, and fraud-prevention
    layer inside U.S. truckload brokerage, not as all freight tech or all trucking spend. Public evidence supports a broad
    buyer universe of 13,000-plus brokers managing about 30% of truckload volume and a strong ROI driver from rising cargo
    theft and fraud, but it does not support an inflated standalone software TAM; the sounder lens is broker count, risk exposure,
    and current enterprise adoption.
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary and Status-Quo Substitutes
  body: Highway’s market boundary should start with the broker workflow it automates, not with the total size of trucking.
    The included spend is carrier identity proofing, onboarding, compliance checks, monitoring of contact or authority changes,
    load-level rules, and the secure movement of booking artifacts such as rate confirmations. Those controls matter because
    the broker is the economic intermediary that decides which carrier gets access to a load. Adjacent categories include
    exchange access control and payments-linked trust layers, while excluded categories include shipper TMS software, generic
    cybersecurity, fleet telematics, and carrier back-office systems that do not determine who can book freight. The status
    quo substitute is still manual FMCSA and SAFER verification plus insurance certificates, calls, emails, and internal spreadsheet
    rules, often supplemented by tools such as RMIS. That substitute is cheaper to start with, but it is precisely the trust
    model that fraudsters exploit when inboxes, phone numbers, dispatcher identities, or MC ownership change after onboarding.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM023
  - CM024
  - CM025
  tableRefs:
  - TM001
  figureRefs: []
- id: evidence-constrained-sizing
  title: Evidence-Constrained TAM, SAM, and SOM
  body: 'No public source reviewed in this chapter published a clean dollar TAM for broker carrier-identity software, so any
    market size claim has to be triangulated. The broadest useful lens is buyer count: FTV and Highway describe a universe
    of more than 13,000 freight brokers managing about a third of U.S. truckload volume. The second lens is workflow scale:
    official FMCSA registration statistics and SAFER systems show that brokers operate against a very large federally registered
    carrier base, which makes identity verification a recurring operational need rather than a niche edge case. The third
    lens is pain intensity: cargo-theft and unlawful-brokering losses are large enough to justify software spend even if they
    are not the same thing as software TAM. The fourth lens is current adoption: Highway says it already serves more than
    1,050 brokers, including 70 of the top 100, which means the enterprise segment is not hypothetical. The right conclusion
    is cautious. Truckload spend and theft losses describe the economic surface area, but they do not prove a software market
    of similar size. The defensible TAM is a broker-account and risk-exposure narrative, with a near-term SOM measured in
    low-thousands of broker accounts rather than in inflated freight dollars.'
  claimRefs:
