callouts:
- calloutType: insight
  title: The real wedge is broker trust infrastructure, not “all freight tech”
  body: The strongest evidence supports a broker-centric identity and compliance wedge. Truckload spend and logistics-software
    headlines are context only; the defensible market is the set of brokers that control freight access and repeatedly vet
    outside carriers.
  claimRefs:
  - CM001
  - CM004
  - CM007
  - CM009
  - CM033
- calloutType: risk
  title: Official registries are necessary but no longer sufficient
  body: 'FMCSA and SAFER remain the baseline, yet Q1 2026 data and owner-operator backlash show the tradeoff clearly: stronger
    identity controls are increasingly necessary, but they can also create onboarding friction and pushback if implemented
    poorly.'
  claimRefs:
  - CM006
  - CM012
  - CM013
  - CM022
  - CM023
- calloutType: insight
  title: Triumph broadens the market from vetting into transaction infrastructure
  body: If brokers trust Highway first for identity and monitoring, then Triumph-linked settlement, credit assurance, and
    secure exchange access can expand the company’s share of wallet and increase workflow stickiness beyond compliance alone.
  claimRefs:
  - CM015
  - CM016
  - CM028
  - CM029
  - CM038
