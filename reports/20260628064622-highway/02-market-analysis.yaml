- id: TM002
  title: TAM / SAM / SOM or sizing lens table
  columns:
  - Publisher / lens
  - Year
  - Geography
  - Value / signal
  - CAGR or change
  - Methodology
  - Confidence
  - Limitation
  rows:
  - - FTV / Highway broker population lens
    - '2025'
    - U.S.
    - 13,000+ brokers; about 30% of truckload volume
    - Market share up roughly 4x over 20 years (publisher framing)
    - Investor and company market framing based on broker role in truckload
    - Medium
    - Not an official government count and not a software spend estimate
  - - FMCSA registration lens
    - '2026'
    - U.S.
    - Very large federally registered carrier base; official registration and SAFER tools are the baseline
    - Monthly dashboard updates as of May 15, 2026 snapshot
    - Official registration and safety-record infrastructure for motor carriers
    - High
    - Carrier counts describe workflow scale, not the number of software buyers
  - - Highway adoption lens
    - '2025'
    - U.S.
    - 1,050+ broker customers; 70 of top 100 U.S. brokers
    - Current penetration, not growth rate
    - Company and investor reported installed base
    - Medium
    - Self-reported and does not disclose paid module mix or ACV
  - - Fraud-loss lens
    - 2024-2026
    - U.S. / North America
    - 3,625 to almost 4,000 incidents; roughly $455M to $700M+ losses
    - 27% YoY increase in 2024; 2025 pressure expected to rise further
    - CargoNet, NICB, and investor/company summaries of theft and fraud costs
    - Medium
    - Loss methodologies differ and cannot be used as a precise TAM denominator
  - - Double-brokering loss lens
    - '2026'
    - U.S.
    - 100M+ annual loss estimate
    - Persistent rather than cyclical directional signal
    - Industry expert estimates cited by FreightWaves and Truckstop
    - Medium
    - Expert estimate rather than audited industry ledger
  - - Transaction-infrastructure adjacency lens
    - 2025-2026
    - U.S.
    - No disclosed dollar TAM; expands from onboarding into booking, credit, and settlement
    - Strategic product expansion rather than measured market growth
    - TFX plus Triumph positioning around verified transactions
    - Medium
    - Shows wallet-share potential but not a publishable standalone market size
  notes: The evidence supports multiple lenses but not a clean standalone software TAM. Counts, risk metrics, and current
    adoption are more defensible than any attempt to equate Highway’s market with total trucking or total truckload spend.
