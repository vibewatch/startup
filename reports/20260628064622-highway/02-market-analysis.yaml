- id: FM004
  title: Adoption funnel or value-chain map
  type: flow
  layout: wide
  summary: The market expands as brokers move from basic official-record checks to a broader identity-first transaction workflow
    that can include booking and settlement.
  data:
    nodes:
    - id: risk
      label: Fraud event or rising risk signal
      detail: A theft, spoofed call, or suspicious ownership change forces the broker to reassess its trust model.
    - id: baseline
      label: Baseline official checks
      detail: FMCSA, SAFER, insurance certificates, and manual contact validation establish the initial control layer.
    - id: identity
      label: Identity-first onboarding
      detail: Highway or a substitute tool verifies who is actually acting for the carrier authority.
    - id: monitoring
      label: Continuous monitoring and load rules
      detail: The broker adds load lock, alerts, and behavior-aware compliance to reduce post-onboarding risk.
    - id: booking
      label: Trusted digital booking or exchange
      detail: Verified brokers and carriers transact in a more controlled environment such as TFX.
    - id: payments
      label: Settlement and network effects
      detail: Payments, credit assurance, and secure settlement deepen the workflow and can raise switching costs.
    edges:
    - from: risk
      to: baseline
      label: forces review
    - from: baseline
      to: identity
      label: manual checks prove insufficient
    - from: identity
      to: monitoring
      label: post-onboarding risk remains
    - from: monitoring
      to: booking
      label: trusted access enables digital transactions
    - from: booking
      to: payments
      label: workflow expands into settlement
  approximationNotes: The sequence reflects common adoption logic from public materials, not a disclosed sales funnel. Some
    brokers may stop at onboarding, while others expand into secure booking or payments-linked workflows.
