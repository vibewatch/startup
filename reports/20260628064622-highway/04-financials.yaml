- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current public status
  - Revenue-quality read
  - Diligence ask
  rows:
  - - Connect Core
    - Recurring software subscription for carrier search, onboarding, certificate management, monitoring, and TMS integration
    - Broker account / enterprise contract
    - Packaging is public but no dollar pricing is disclosed
    - High on mechanism, low on monetization detail
    - Request standard pricing sheet, contract minimums, billing unit, and renewal terms
  - - Load Lock
    - Recurring add-on or module for load-level compliance, alerts, and secure rate-confirmation workflow
    - Broker account / protected load workflow
    - Publicly marketed as a distinct module with no listed price
    - Looks monetizable and sticky, but price realization is unknown
    - Provide attachment rate, standalone vs bundled pricing, and revenue-recognition treatment
  - - Highway for Email
    - Communication-security add-on for verifying inbound or outbound email interactions
    - Add-on module
    - Listed on plans page without price
    - Potentially high-margin software layer, but public evidence stops at packaging
    - Share attach rate, price card, and churn profile
  - - Highway for VoIP
    - Phone-fraud prevention add-on integrated into broker IVR workflows
    - Add-on module
    - Publicly launched and listed without price
    - Useful expansion surface, but vendor-cost burden is also plausible
    - Provide average selling price, implementation burden, and gross-margin profile
  - - Exclusion Intel
    - Additional fraud-prevention dataset or rules layer
    - Add-on module
    - Named publicly but not economically described
    - Could deepen wallet share, but revenue contribution is invisible
    - Request contribution to ARR and the data-cost model
  - - Load Limit
    - Additional policy or control layer for load access
    - Add-on module
    - Named publicly without commercial detail
    - Probably supports segmentation and expansion, but not quantifiable today
    - Request pricing logic, usage triggers, and renewal behavior
  - - Trusted Freight Exchange
    - Identity-verified freight workflow that may create broader platform monetization and data lock-in
    - Platform module / enterprise workflow
    - Public access is demo-led; no public take rate or fee schedule
    - Strategically important, but economics are still opaque
    - Clarify whether revenue is subscription, transaction, services, or partner-share based
  notes: Public sources are strong enough to enumerate monetization surfaces but not strong enough to quantify the revenue share of any stream or confirm recognition mechanics.
