- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric or document
  - Why it matters
  - Current public status
  - Exact diligence path
  rows:
  - - Price card and billing unit by module
    - Needed to estimate ACV and expansion logic
    - No public numeric pricing for Highway modules
    - Request current order form, packaging matrix, and billing examples
  - - Revenue mix by Connect Core, Load Lock, add-ons, and TFX
    - Separates stable recurring revenue from experimental or partner-driven streams
    - Not disclosed
    - Request revenue bridge by product family for the last twelve months
  - - Revenue-recognition policy
    - Clarifies whether any portion is subscription, services, transaction, or implementation revenue
    - Not disclosed
    - Request accounting memo or auditor policy summary
  - - Gross margin by product line
    - Determines whether the business behaves like clean SaaS or data-and-services software
    - Not disclosed
    - Request last twelve months gross margin by core platform, comms security, and exchange products
  - - Retention and expansion metrics
    - Best test of revenue quality and long-term value creation
    - Not disclosed
    - Request gross retention, net revenue retention, logo churn, and module attach expansion by cohort
  - - CAC and payback
    - Shows whether growth is efficient and repeatable
    - Not disclosed
    - Request fully loaded CAC by channel and payback by customer segment
  - - Cash, burn, runway, and debt
    - Needed to judge financing dependency and downside resilience
    - Not disclosed
    - Request current treasury package, budget vs actuals, and debt schedule
  - - Customer concentration and contract terms
    - High broker concentration or short contracts can weaken revenue durability
    - Not disclosed
    - Request top-10 customer share, average contract length, and renewal history
  notes: These are the specific missing inputs that keep the chapter from moving from a strong category thesis to a finance-grade underwriting decision.
