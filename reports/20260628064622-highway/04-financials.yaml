- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value or status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Broker count proxy
    - More than 1,050 brokers, including 70 of the top 100 in the U.S.
    - Medium-high
    - Supports relevance and network depth, but not spend per customer
    - Provide ARR per customer cohort and concentration by top accounts
  - - Customer outcome proxy
    - Sethmar says Highway prevented a $130K theft; Transportation One says TFX supported scalable growth
    - Medium
    - Suggests ROI and renewal logic
    - Provide quantified renewal, win-back, and expansion case studies
  - - Sales motion
    - Demo-led enterprise workflow with partner and integration leverage
    - Medium
    - Useful for CAC framing, but not enough to calculate payback
    - Disclose sales cycle length, implementation cost, and channel-sourced pipeline share
  - - Fraud-activity proxy
    - Repeated quarterly disclosures of blocked emails and fraudulent phone numbers
    - Medium
    - Shows activity and product engagement, not monetization efficiency
    - Provide relationship between protected loads, active users, and retained ARR
  - - Gross margin
    - null
    - Low
    - Core underwriting metric for software durability
    - Disclose gross margin by core software, communications, and exchange-related products
  - - CAC / payback
    - null
    - Low
    - Tests whether growth is efficient or subsidy-driven
    - Provide fully loaded CAC, payback period, and partner-sourced CAC delta
  - - Retention / NRR
    - null
    - Low
    - Needed to assess revenue quality and platform stickiness
    - Provide gross retention, net revenue retention, and module attachment expansion by cohort
  - - Implementation and support burden
    - Likely nontrivial because product set includes identity verification, monitoring, alerts, and partner integrations
    - Medium
    - Heavy service overhead can compress software margins
    - Provide implementation hours, support ratio, and professional-services mix
  - - Vendor / data dependency
    - Likely meaningful due to biometric verification, telematics, and communications-security features
    - Medium
    - Can create gross-margin pressure and outage risk
    - Disclose largest third-party spend categories and concentration limits
  notes: The table intentionally separates visible demand proxies from missing efficiency metrics because the public record supports the former far better than the latter.
