- id: capital-adequacy-and-public-comp-disclosure-lens
  title: Capital adequacy and the public-comparable disclosure lens
  body: |-
    Highway clearly has capital access, but not public capital adequacy. The company announced a minority growth-equity investment led by FTV with Lead Edge participation and said the funds would support product development, go-to-market expansion, and customer growth. Multiple contemporaneous sources confirm the amount was undisclosed. FTV's commentary is constructive: it highlighted a highly retentive blue-chip customer base and scalable profitability. Those are useful qualitative signals because they suggest the round was framed as expansion capital rather than emergency financing.

    Even so, every metric needed for underwriting the balance sheet remains private. No reviewed source discloses revenue, ARR, cash on hand, monthly burn, runway, debt, working-capital needs, or next-round trigger. The easiest way to see the gap is through public benchmarks. Highway itself points to CHRW as the largest freight broker in the U.S., and CHRW's 10-K discloses revenue, customers, carriers, shipments, freight managed, and how brokerage gross profit works. Descartes provides a different lens: a logistics-software network platform that also lives inside quarterly public-company disclosure. Truckstop, while not a perfect comp, at least publishes a starting price for RMIS. Highway discloses none of the corresponding economic anchors. That leaves the financing story positive on access and negative on transparency.
