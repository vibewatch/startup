- id: financial-verdict-and-diligence-blockers
  title: Financial verdict and diligence blockers
  body: |-
    Highway's public value-creation evidence is real. The company can point to broker penetration, repeated fraud-blocking activity, ecosystem expansion, and customer stories tied to avoided losses or more scalable procurement. Category urgency is also real: Highway's own materials cite very large freight-theft losses, Food Logistics reports that legitimate-seeming carriers now account for a meaningful share of incidents, and Landstar's fraud event showed that the economic damage can reach public-company materiality. That combination supports the strategic case for the product category and suggests Highway is operating in a market where pain is acute.

    But the public record still stops well short of a financial underwrite. There is no disclosed price realization, no revenue mix by module, no gross-margin bridge, no retention or expansion math, and no cash or runway disclosure. The disciplined conclusion is therefore conditional. Highway looks like a promising broker-workflow SaaS and control-layer business whose relevance is supported by fresh industry evidence, but the company remains too opaque to underwrite revenue quality, margin durability, or capital efficiency with conviction. Management materials should make realized pricing, contract structure, net retention, gross margin, customer concentration, cash, and burn mandatory diligence items before any valuation confidence is earned.
