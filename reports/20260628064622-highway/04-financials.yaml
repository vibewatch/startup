  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Module-level realized pricing, contract structure, and revenue-recognition policy across Connect Core, Load Lock, add-ons, and TFX.
    whyItMatters: Without those inputs, the chapter cannot distinguish high-quality recurring software revenue from services-heavy or lightly monetized workflow adoption.
    diligencePath: Request the current price book, sample order forms, and accounting policy memo for subscription, implementation, and any transaction-adjacent revenue.
    relatedQuestionRefs:
    - QI004
    - QI005
    relatedTableRefs:
    - TI001
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Gross margin, CAC, payback, churn, net revenue retention, and support-burden metrics.
    whyItMatters: These metrics determine whether Highway behaves like attractive software or like a more operationally intensive trust-services business.
    diligencePath: Request the last-twelve-month SaaS KPI deck with cohort retention, CAC by channel, gross-margin bridge, and services attachment rate.
    relatedQuestionRefs:
    - QI012
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash, monthly burn, runway, debt, vendor commitments, and next-round trigger thresholds.
    whyItMatters: Capital access is not the same as capital adequacy; the missing treasury data prevents any evidence-based runway judgment.
    diligencePath: Request the latest board finance package, cash waterfall, debt schedule, and monthly management reporting on burn and covenant headroom.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
