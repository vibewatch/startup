- id: gtm-demand-and-sales-efficiency-proxies
  title: GTM motion, demand evidence, and sales-efficiency proxies
  body: |-
    Highway looks more enterprise-direct than self-serve. The website routes buyers into demos, and the company pairs that motion with a partner program, CHRW integration proof, and a growing TFX ecosystem that embeds Highway deeper into broker workflows. Public scale proxies are respectable for a company founded in 2022: Highway's investment announcement said the platform served more than 1,050 brokers, including 70 of the top 100 in the U.S., while FTV framed the network as a data advantage because larger broker participation makes fraud patterns easier to detect. Those are not revenue disclosures, but they are credible signs that the company has crossed into mission-critical workflow territory for a meaningful broker cohort.

    Customer proof is directionally positive as well. Sethmar's case study says Load Lock helped prevent a $130,000 theft, and Transportation One frames TFX as a way to move from reactive truck chasing into lane-based capacity procurement. Those examples support willingness to pay and renewal logic better than a generic logo wall would. What remains unavailable are the efficiency metrics that matter for underwriting: CAC, payback, sales cycle length, implementation burden, services attachment, expansion rate, and churn. The partner program may improve distribution leverage over time, but public sources do not quantify whether channel-led adoption lowers customer-acquisition cost or simply broadens reach.
