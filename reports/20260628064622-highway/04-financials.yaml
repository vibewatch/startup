- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public status
  - Evidence
  - Underwriting read
  - Diligence ask
  rows:
  - - Latest financing event
    - Minority growth-equity investment announced in August 2025
    - Highway release plus independent coverage
    - Positive access-to-capital signal
    - Provide closing amount, instrument terms, and liquidation preferences
  - - Amount raised
    - Undisclosed
    - Repeated across company and media coverage
    - Material gap because round size frames runway
    - Disclose gross proceeds and net cash added to the balance sheet
  - - Use of funds
    - Product development, GTM expansion, and customer growth or diversification
    - Management comments in funding release and coverage
    - Looks like expansion capital rather than explicit rescue capital
    - Provide budget split across R&D, sales, marketing, and operations
  - - Investor view of business quality
    - FTV cited a highly retentive blue-chip customer base and scalable profitability
    - Investor and company sources
    - Helpful positive signal, but still promotional and non-quantitative
    - Provide retention curves, cohort expansion, and margin bridge underlying the claim
  - - Cash on hand
    - null
    - No reviewed public source discloses it
    - Runway cannot be calculated
    - Disclose unrestricted cash and any minimum-cash covenants
  - - Gross and net burn
    - null
    - No reviewed public source discloses it
    - Cannot judge financing dependency or efficiency
    - Provide monthly gross burn, net burn, and burn multiple
  - - Debt / off-balance-sheet obligations
    - null
    - No reviewed public source discloses it
    - Potential hidden claim on future cash flows
    - Disclose debt, leases, data commitments, and material vendor minimums
  - - Next-round trigger
    - Not publicly disclosed
    - No public board or management guidance on trigger metrics
    - Makes timing risk impossible to model
    - Provide trigger thresholds for ARR, cash balance, or product milestones
  notes: Public evidence supports capital access but not capital adequacy. The distinction matters because an undisclosed round size cannot be turned into a runway view.
