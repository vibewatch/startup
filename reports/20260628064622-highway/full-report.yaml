  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: Real product proof and sponsor support lead to a Track call only after opacity and adverse frictions are deducted.
    data:
      nodes:
        - id: proof
          label: Product and customer proof
          detail: 1,050+ brokers, customer stories, and multi-module product breadth support relevance.
          tone: positive
        - id: sponsor
          label: Growth-equity sponsorship
          detail: FTV and Lead Edge backing signal external confidence.
          tone: positive
        - id: opacity
          label: Financial opacity
          detail: No public valuation, ARR, pricing, retention, or round terms.
          tone: warning
        - id: adverse
          label: Adverse frictions
          detail: Verification pushback and outage evidence add execution risk.
          tone: warning
        - id: stance
          label: Valuation stance unknown
          detail: Public data cannot support attractive, fair, or stretched with conviction.
          tone: neutral
        - id: call
          label: Recommendation
          detail: Track | medium confidence | medium risk | 6.5/10
          tone: neutral
      edges:
        - from: proof
          to: sponsor
          label: reinforces
        - from: sponsor
          to: opacity
          label: but does not solve
        - from: opacity
          to: adverse
          label: worsens impact of
        - from: adverse
          to: stance
          label: keeps
        - from: stance
          to: call
          label: drives
    approximationNotes: The flow is an analytical ordering of decision factors, not a weighted scoring model.
    claimRefs:
      - CV012
      - CV026
      - CV027
      - CV034
      - CV037
      - CV038
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Small changes in assumed ACV and ARR multiple produce a very wide enterprise-value range because Highway discloses
      neither input publicly.
    data:
      items:
        - label: Low ARR thought experiment at 5x
          value: 105
          unit: $M
        - label: Low ARR thought experiment at 10x
          value: 210
          unit: $M
        - label: Low ARR thought experiment at 15x
          value: 315
          unit: $M
        - label: High ARR thought experiment at 5x
          value: 262.5
          unit: $M
        - label: High ARR thought experiment at 10x
          value: 525
          unit: $M
        - label: High ARR thought experiment at 15x
          value: 787.5
          unit: $M
    approximationNotes: >-
      Every bar is estimated from a speculative $20K-$50K ACV range across 1,050 brokers and a heuristic 5-15x ARR band.
      None of these values is a disclosed Highway metric.
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Scenario outcomes remain wide because the public record proves demand and financing access more clearly than it
      proves pricing and revenue quality.
    data:
      items:
        - label: Bear
          low: 105
          value: 180
          high: 262.5
          unit: $M
          claimRef: CV041
        - label: Base
          low: 210
          value: 367.5
          high: 525
          unit: $M
          claimRef: CV040
        - label: Bull
          low: 525
          value: 656
          high: 787.5
          unit: $M
          claimRef: CV039
    approximationNotes: >-
      These scenario ranges are analyst estimates layered on top of the public thought experiment. They are not
      management forecasts, mark-to-market values, or disclosed financing terms.
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV037
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: >-
      Highway scores best on market need and product relevance, and weakest on valuation support and financial
      disclosure quality.
    data:
      items:
        - label: Market need
          value: 8/10
          detail: Freight fraud urgency and customer pain are well evidenced.
          tone: positive
        - label: Product / workflow proof
          value: 7/10
          detail: Product breadth, customer stories, and partner integrations show real operating relevance.
          tone: positive
        - label: Customer-scale proof
          value: 7/10
          detail: 1,050+ brokers is meaningful, though monetization detail is missing.
          tone: positive
        - label: Financial visibility
          value: 3/10
          detail: No public ARR, revenue, pricing, retention, or gross-margin disclosure.
          tone: warning
        - label: Valuation support
          value: 3/10
          detail: No public mark or round terms let the investment case stay price-sensitive.
          tone: warning
        - label: Operational risk
          value: 5/10
          detail: Verification friction and outage evidence are manageable but real.
          tone: neutral
        - label: Diligence readiness
          value: 6/10
          detail: The next diligence pack is obvious and relatively compact even if public data are incomplete.
          tone: neutral
    approximationNotes: Scores are IC-style judgment indicators synthesized from public evidence rather than reported company KPIs.
    claimRefs:
      - CV035
      - CV036
      - CV038
      - CV042
      - CV043
