      - number: '3.3'
        title: Adjacent and substitute competitors
        blocks:
          - type: paragraph
            body: >-
              Several adjacent products can capture budget that might otherwise support Highway, even when they do not
              begin at carrier onboarding. GenLogs is the most important adjacent entrant because it sells
              physical-world verification rather than paper verification. Its pitch is that roadside sensors, computer
              vision, and photographic proof reveal what carriers are actually doing in the real world, with 15 million
              to 16 million images per day depending on source vintage. That can complement Highway, but it can also
              erode the uniqueness of Highway's lane and risk signals if buyers decide observed behavior is more
              valuable than identity-linked workflow controls. Overhaul and CargoNet sit farther away from Highway's
              core, yet both matter. Overhaul frames the problem as shipment visibility, predictive risk, compliance,
              and carrier verification for high-consequence cargo. CargoNet frames it as a theft-prevention and recovery
              network tied to law enforcement and secure information sharing. The substitute set also includes the
              manual bundle of FMCSA checks, phone verification, insurance validation, and internal spreadsheets. Buyers
              can therefore solve the same job through at least four modes: direct onboarding software, incumbent
              network tools, physical-world intelligence, or layered manual process.
            claimRefs:
