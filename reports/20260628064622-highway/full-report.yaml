      - number: '3.4'
        title: Moat, status quo, and competitive risk
        blocks:
          - type: paragraph
            body: >-
              Highway's moat looks real but specialized. The most defensible ingredients are NIST-aligned identity
              proofing, broker-facing channel security across voice, email, and rate confirmations, a formal partner
              ecosystem, and proprietary fraud telemetry that makes the threat visible in economic terms. Those features
              create a coherent category story around 'carrier identity and access management' rather than simple
              onboarding. The risks, however, are equally visible. Public pricing is opaque, so it is hard to prove
              Highway wins on total cost of ownership against incumbent bundles. Larger rivals can bundle adjacent
              capabilities into broader platforms: Descartes can tie onboarding to MacroPoint and other logistics
              systems, Truckstop can pair RMIS with its load-board position, and DAT can preserve the incumbent workflow
              by making manual-plus-directory vetting feel sufficient. There is also real evidence that more aggressive
              identity checks can irritate small carriers, which is strategically important because security that slows
              onboarding too much can push capacity away. Netting it out, Highway appears strongest when the buyer
              explicitly prioritizes trusted access and secure transaction channels; it appears weaker when the buyer
              optimizes for the biggest incumbent network, a shipper-side risk suite, or the no-budget status quo.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP037
              - CP038
