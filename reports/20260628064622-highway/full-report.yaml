      - number: '7.3'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              Highway's operational risk is shaped by an uncomfortable asymmetry: customers increasingly need the
              platform precisely because fraudsters are adapting quickly, but the more Highway moves from static
              onboarding into real-time load protection, the more it inherits uptime, data-quality, and false-positive
              burden. Highway's own public telemetry makes the arms-race point clear. The Q4 2025 fraud index reported
              nearly 2.0 million blocked fraudulent email attempts in 2025, 8.5 million blocked fraudulent phone
              numbers, and a late-2025 pattern in which legitimate pickups are later compromised through spoofed reroute
              instructions. The Q1 2026 materials continue that direction with 527,940 blocked fraudulent emails and
              71,801 spoofed phone numbers in one quarter alone. That backdrop justifies Highway's more aggressive
              controls, but it also increases the penalty for misses and false alarms. Overdrive documented one
              carrier's allegation that Highway wrongly marked insurance as expired, costing time and money; whether or
              not that anecdote is representative, it shows exactly where operational quality turns into commercial
              damage. The February 23-24, 2026 Load Lock incident is equally important because it demonstrates that
              Highway's load-level protection is not self-contained: a Samsara disruption was enough to affect alerts
              and shipment milestone updates. Meanwhile, Highway's own product language confirms dependence on ELD
              activity, physical location, cargo insurance, and service-area signals. That means data provenance,
              latency, and partner uptime are not peripheral issues—they are part of the core product promise. Security
              posture is a relative mitigation: Highway points to bank-grade or NIST-aligned identity standards, but
              public evidence does not disclose false-positive rates, appeal volumes, or the operating cost of manual
              exception handling.
