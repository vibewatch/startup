  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: standard
    summary: >-
      Highway's risks cluster in the upper-right around privacy/IDV friction, fraud-arms-race intensity, and
      partner-dependent operational reliability.
    data:
      columns:
        - Low likelihood
        - Medium likelihood
        - High likelihood
      rows:
