      - number: '7.4'
        title: Partner, dependency, and competitive risk
        blocks:
          - type: paragraph
            body: >-
              Highway is building a dense dependency graph rather than a pure standalone SaaS moat. TFX is powered by
              Triumph's ratings, intelligence, payment, and credit capabilities; Newtrul was acquired to add carrier
              matchmaking and TMS integration; Parade and McLeod distribute Highway identity and exchange logic deeper
              into brokerage workflows; and the Certified Insurance Agencies program shows that insurer-side data
              quality is now a formal dependency as well. This partner density is strategically powerful because it
              embeds Highway into the execution stack, but it also means that outages, contract changes, data-sharing
              restrictions, or partner repricing can transmit directly into Highway's value proposition. The competitive
              picture raises the risk further. Descartes MyCarrierPortal discloses 1,300+ customers, 250k+ verified
              carriers, and 350k+ carrier COIs on file, while also benefiting from public-company resources and the
              broader Descartes bundle. Truckstop says it reviewed 63,000+ entities in 2025, failed 14,000+ identity
              checks during RMIS onboarding, denied 5,525 accounts for qualification or authority reasons, and reported
              a 57% decrease in customer-reported fraud from Q1 2024 to Q1 2025. Those are real competitor proof points,
              not abstract category peers. At the low end of the market, FMCSA's free one-at-a-time Company Snapshot
              keeps the status quo alive for brokers that prefer manual workflow plus phone calls and insurance
              validation. Highway therefore faces a classic squeeze: larger bundled incumbents above it, and free/manual
              workflow below it. If Highway cannot show that its stricter controls create better fraud and load outcomes
              without unacceptable carrier friction, partner dependence and competitive substitution will hit price
              realization first, then retention.
