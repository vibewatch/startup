              missing items are ordinary underwriting inputs: realized pricing, customer-definition clarity, ARR,
              GRR/NRR, gross margin, customer concentration, and the exact economic terms of the August 2025 round.
              Without those data, public evidence can support business quality and category urgency, but not price
              discipline. Even the strong FTV language on profitability and retention remains sponsor framing until
              management numbers substantiate it.


