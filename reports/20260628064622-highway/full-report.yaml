    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Stage, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Highway presents itself as a Dallas-based infrastructure layer for freight brokers rather than a broad
              shipper-facing logistics marketplace. Across the homepage, financing announcement, and investor materials,
              the company consistently describes itself as the category creator of Carrier Identity: software that helps
              brokers verify who is actually hauling a load, automate compliance, and reduce fraud without slowing down
              digital booking. The retained source pack supports a 2022 founding date, a Dallas headquarters, and a
              current stage best described as private, growth-stage, and post-minority growth-equity rather than
              venture-seed or late-pre-IPO. The buyer is also clear. FreightWaves quotes Jordan Graft saying Highway
              serves brokers, not shippers, while the homepage organizes the workflow around identify, connect, and
              monitor from tender through delivery. Product pages add that Highway is trying to become a data-rich
              system of record for carrier identity and risk, not just a one-time onboarding check. The main identity
              gap is legal-form specificity: this 30-URL source set does not disclose the incorporated legal entity name
              or state of incorporation, so later diligence should confirm those directly from corporate records.
