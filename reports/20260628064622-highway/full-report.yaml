  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Highway’s market boundary should start with the broker workflow it automates, not with the total size of
              trucking. The included spend is carrier identity proofing, onboarding, compliance checks, monitoring of
              contact or authority changes, load-level rules, and the secure movement of booking artifacts such as rate
              confirmations. Those controls matter because the broker is the economic intermediary that decides which
              carrier gets access to a load. Adjacent categories include exchange access control and payments-linked
              trust layers, while excluded categories include shipper TMS software, generic cybersecurity, fleet
              telematics, and carrier back-office systems that do not determine who can book freight. The status quo
              substitute is still manual FMCSA and SAFER verification plus insurance certificates, calls, emails, and
              internal spreadsheet rules, often supplemented by tools such as RMIS. That substitute is cheaper to start
              with, but it is precisely the trust model that fraudsters exploit when inboxes, phone numbers, dispatcher
              identities, or MC ownership change after onboarding.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM023
              - CM024
