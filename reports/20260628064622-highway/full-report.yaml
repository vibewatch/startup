      - number: '5.2'
        title: Load-level enforcement and exchange workflows
        blocks:
          - type: paragraph
            body: >-
              The strongest product expansion pattern since 2024 is Highway’s move from carrier identity into
              transaction-level enforcement. Load Lock is the clearest proof. The load-level product page, plans page,
              and launch release consistently describe a workflow that secures rate confirmations, continuously checks
              compliance, routes exceptions, and generates real-time fraud alerts after a carrier is selected. The
              launch release is unusually concrete for public product proof: Highway says Load Lock has protected more
              than 5 million loads since the beginning of 2024 with zero strategic cargo-theft incidents. Whether that
              KPI is independently audited is unknown, but it is still a meaningful public commercialization signal.


              Load Lock+ pushed the stack deeper into execution. Highway’s April 2025 release says it adds 100%
              ELD-powered tracking, automated vehicle assignment, dynamic geofencing, and proximity-adaptive location
              updates, while Exclusion Intel adds policy-level cargo-insurance exclusion analysis. Public operating
              evidence also shows where the architecture can break. An IsDown incident record from February 23-24, 2026
              shows that a Samsara service disruption affected Load Lock alerts and Load Lock+ arrival-and-delivery
              updates for Samsara-connected carriers for roughly four hours. That is valuable diligence evidence because
              it confirms both real telematics dependence and real production usage.


              TFX is the other major step in Highway’s workflow expansion. Public materials describe it as a secure
              exchange exclusively for vetted brokers and identity-verified, ELD-connected carriers, with Highway’s
              identity engine at the core and Triumph providing ratings, intelligence, payment, and credit capabilities.
              The later Newtrul acquisition adds carrier matchmaking and TMS integration to that exchange, reinforcing
              the idea that Highway is trying to connect identity, pricing, payments, sourcing, and execution inside one
              broker operating surface.
