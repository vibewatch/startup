  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk overview and prioritization
        blocks:
          - type: paragraph
            body: >-
              Highway's risk profile is not dominated by a single existential flaw; it is dominated by a set of linked
              control-system risks. The first is regulatory and legal: Highway's current privacy notice explicitly
              covers biometric data, geolocation, ELD-derived location data, and identity verification flows, while
              public adverse reporting shows that at least some owner-operators see those controls as invasive and
              market-limiting. The second is operational: Highway is promising real-time, load-level protection in a
              fraud environment that is visibly escalating, yet a public February 2026 incident showed that a partner
              outage at Samsara could interrupt Load Lock alerts and milestone updates. The third is dependency and
              competition: Highway is embedding itself into insurer, TMS, exchange, payment, and telematics workflows at
              the same time that larger rivals such as Descartes MyCarrierPortal and Truckstop are publishing scale
              metrics and fraud outcomes of their own, while FMCSA's free one-carrier- at-a-time baseline remains
              sticky. The fourth is people and model risk: Jordan Graft remains central to the category narrative, while
              public sources still leave valuation, economics, partner contract terms, appeal rates, and governance
              depth largely opaque. The right way to read the chapter is therefore as a transmission map: legal/privacy
              friction, fraud-pressure growth, and partner outages all flow into adoption, retention, margin, and
              ultimately valuation risk.
            claimRefs:
