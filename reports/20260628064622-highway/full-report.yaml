      - number: '7.5'
        title: People, execution, financial opacity, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The people and model risks are easy to underrate because Highway's public evidence is strongest on product
              motion and weakest on organizational detail. Jordan Graft appears to have strong founder-market fit from
              his TriumphPay background, but that also concentrates the company's partner logic, fraud narrative, and
              strategic credibility in one executive. Public financing disclosures from August 2025 establish that
              Highway had more than 1,050 brokers and board participation from FTV and Lead Edge, yet they still do not
              disclose valuation, ownership split, full board composition, partner economics, or a current 2026
              headcount beyond FTV's dated reference to roughly 100 individuals. That makes it hard to judge whether
              Highway has enough management depth, risk operations staffing, and support capacity to scale a product set
              that now spans identity proofing, load-level monitoring, secure booking, insurer signals, and carrier
              sourcing. Financial/model risk is similarly opaque. No reviewed public source discloses Highway's
              false-positive rate, appeal volume, churn from stricter IDV, gross margin, or how much economics are
              shared with partners. That means investors cannot cleanly quantify whether higher fraud pressure improves
              demand faster than it increases service burden and integration cost. The practical answer is to define
              kill criteria around externally visible failures: privacy or biometric injunctions, repeated
              partner-driven outage events, a visible step-up in carrier market-access friction, key-person disruption,
              or evidence that brokers can get “good enough” fraud reduction from Truckstop, Descartes, or free
              FMCSA-plus- process workflow. If those triggers materialize together, the thesis changes from category
              leader to operationally expensive control layer.
