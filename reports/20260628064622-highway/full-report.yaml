      - number: '3.2'
        title: Incumbent and legacy solutions
        blocks:
          - type: paragraph
            body: >-
              DAT and FMCSA represent the legacy baseline that Highway still has to displace even when their products do
              not mirror Highway feature-for-feature. DAT's reviewed material emphasizes public-domain checks, directory
              review, relationship cultivation, and process discipline. That matters because many brokers already live
              in the load-board and carrier-directory world, so DAT competes less as a purpose-built identity platform
              and more as the incumbent workflow that keeps existing habits in place. FMCSA SAFER is the pure free
              status quo. It offers public registration and safety data, and the Company Snapshot is explicitly
              available one carrier at a time free of charge. The weakness is that free public records do not address
              the newer fraud vectors that Truckstop, DAT, and Highway all describe: hijacked inboxes, spoofed phone
              numbers, manipulated contacts, and identity theft layered on top of legitimate MC numbers. In other words,
              Highway is not just fighting other software vendors. It is also fighting the deeply embedded mental model
              that SAFER plus phone calls plus manual paperwork is 'good enough.' That free baseline is sticky, but it
              is also the reason vendors can credibly sell identity-linked controls as an upgrade rather than a
              nice-to-have add-on.
