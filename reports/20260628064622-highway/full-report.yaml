  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - ARR and recognized revenue
        - Current ARR, revenue run-rate, and any growth trend by quarter.
        - Without revenue scale, no valuation multiple can be applied credibly.
        - Management finance pack or board deck.
      - - Pricing and ACV
        - Standard package pricing, realized ACV distribution, and enterprise-vs-SMB mix.
        - This is the single biggest driver behind the current ARR thought experiment.
        - Pricing sheet plus cohort ACV cut.
      - - Retention quality
        - GRR, NRR, logo retention, and attach / expansion by module.
        - Sponsor language around retention is central to any premium-software case.
        - Customer cohort table and renewal history.
      - - Gross margin and cost structure
        - Gross margin, third-party data costs, support intensity, and fraud-ops burden.
        - Determines whether Highway should trade like software or like a lower-margin services-enabled platform.
        - Margin bridge by product family.
      - - Customer concentration
        - Revenue concentration by top accounts and by top broker cohorts.
        - Scale proxies are less useful if revenue is concentrated.
        - Revenue concentration schedule and churn case studies.
      - - Round economics
        - Post-money mark, security type, preference stack, secondary content, and pro-rata rights.
        - A strong company can still be a poor entry if the private terms are unfavorable.
        - Cap table, term sheet summary, and liquidation waterfall.
    notes: >-
      These asks are deliberately valuation-specific. Clearing even a subset would narrow the recommendation band
      materially.
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV042
      - CV043
      - CV047
