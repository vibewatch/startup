      - number: '1.2'
        title: Leadership, Governance, and Capital
        blocks:
          - type: paragraph
            body: >-
              The public leadership record is narrow but consistent. Jordan Graft is the founder and CEO and, in FTV's
              investment memo, the founder-market fit is explicit: before starting Highway, he ran TriumphPay and
              learned firsthand that freight fraud could not be solved with workflow point tools alone. Michael Caney
              appears repeatedly as Chief Commercial Officer across product releases, while Mark Ford joined in June
              2025 as Chief Capacity Officer after senior roles at BlueGrace and Coyote, signaling an effort to connect
              identity infrastructure to network growth and procurement workflows. Governance transparency is thinner.
              The August 20, 2025 financing is well corroborated as a strategic minority growth-equity investment led by
              FTV Capital with Lead Edge participation, and it added Jerome Hershey and Nimay Mehta to the board while
              Raymond James and TD Securities advised the two sides. What public sources still do not reveal is equally
              important for later diligence: the dollar amount was undisclosed, the valuation and ownership split were
              undisclosed, and the retained source pack does not give a full board roster, founder ownership, or
              investor control rights. Headcount is only partially resolved: FTV referenced 100 individuals in August
              2025, but none of the retained public sources update that figure for 2026.
