      - number: '1.4'
        title: Traction, Risks, and Milestones
        blocks:
          - type: paragraph
            body: >-
              Public traction indicators are strongest where product adoption and fraud telemetry intersect. By the
              August 2025 financing window, Highway said it served more than 1,050 brokers, including 70 of the top 100
              in the United States. FTV's investor note added a high-level operating datapoint—about 915,000 fraud
              attempts blocked in 2024—while Highway's Q1 2026 Fraud Index and FreightWaves' Fraud Fighters coverage
              gave a more granular picture: 527,940 blocked emails, 71,801 spoofed calls, 399 ownership-change events,
              2,256 identity-theft instances, and a reported 97% reduction in double brokering for customers.
              Third-party recognition also supports category momentum: Highway led the 2025 FreightTech 25, won a 2026
              Fraud Fighters Award, and was cited in ITS Logistics' award write-up as the platform behind 99%
              Highway-ELD connectivity among ITS carriers. The adverse record matters, too. Overdrive documented
              owner-operator backlash to the company's stricter identity-verification flow, including driver's-license
              uploads, face images, and claims of three-year biometric storage, plus the risk that refusing verification
              can mean losing account access. Freight Caviar reinforces the same direction from management's side: the
              company is pushing toward bank-like, multi-point authentication, which may be strategically powerful but
              also raises conversion-friction and false-positive questions that the public pack does not quantify.
