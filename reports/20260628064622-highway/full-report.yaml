  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and what is publicly knowable
        blocks:
          - type: paragraph
            body: >-
              Highway's valuation discussion starts with a real but incomplete financing signal. In August 2025 the
              company announced a minority growth-equity investment led by FTV Capital, with Lead Edge participating,
              and multiple third-party outlets repeated the event while also confirming that the amount was not
              disclosed. FTV's own investment language is constructive: it described Highway as serving a highly
              retentive blue-chip customer base and showing scalable profitability. That combination matters because it
              suggests a growth round was raised on strength rather than on an obvious rescue narrative.


              The underwriting problem is that the public package stops before any of the inputs that would translate
              sponsor enthusiasm into a supportable mark. Highway does not publicly disclose valuation, revenue, ARR,
              pricing, gross margin, net retention, burn, cash, or liquidation preferences. Public pages do support a
              broker-facing recurring software and control-layer model, and they show enough product breadth to argue
              for multi-module expansion, but not enough to backsolve realized ACV or contract quality. That means the
              round is valuation-positive as a signal of external confidence and valuation-incomplete as a pricing
              anchor.
