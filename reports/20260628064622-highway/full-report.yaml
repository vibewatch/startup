  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing discipline, and recognition visibility
        blocks:
          - type: paragraph
            body: >-
              Highway's public record supports a broker-facing subscription software business, but only at the mechanism
              level. The terms page describes the service as an online carrier-information database offered on a monthly
              subscription basis, while the plans and product pages show a module stack built around Connect Core, Load
              Lock, and several fraud-prevention add-ons. That is enough to conclude Highway is selling recurring
              software access to freight brokers rather than monetizing freight volume like a broker, factoring invoices
              like a finance company, or publishing a broad load-board advertising model.


              The public monetization picture gets weaker as soon as underwriting moves past packaging. Highway
              publishes no dollar pricing for Connect Core, Load Lock, Highway for Email, Highway for VoIP, Exclusion
              Intel, or Load Limit. The buyer journey is demo-led, and the public pages do not reveal whether contracts
              are charged per broker, per branch, per user, per network, per load, or through some mixed enterprise
              construct. TFX broadens the product story because it pushes Highway into verified freight transactions and
              partner-enabled payments, but the evidence still does not show whether that expansion changes revenue
              recognition, introduces services revenue, or creates any take-rate economics. The disciplined read is
              therefore narrow: public sources prove recurring software packaging and multi-module upsell potential, but
              not realized pricing, revenue mix, or the accounting bridge from bookings to recognized revenue.
