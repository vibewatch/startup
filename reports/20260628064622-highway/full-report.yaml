              count, if attach rates are narrow, if gross margin is burdened by data-vendor or support costs, or if new
              round terms create preference overhang that caps common-equity upside. Conversely, a relatively small
              private-data package could improve the call meaningfully. If management can show strong ACVs,
              software-like margins, clean retention, and straightforward round economics, Highway could move from
