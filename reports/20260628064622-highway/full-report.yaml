      - number: '2.2'
        title: Evidence-Constrained TAM, SAM, and SOM
        blocks:
          - type: paragraph
            body: >-
              No public source reviewed in this chapter published a clean dollar TAM for broker carrier-identity
              software, so any market size claim has to be triangulated. The broadest useful lens is buyer count: FTV
              and Highway describe a universe of more than 13,000 freight brokers managing about a third of U.S.
              truckload volume. The second lens is workflow scale: official FMCSA registration statistics and SAFER
              systems show that brokers operate against a very large federally registered carrier base, which makes
              identity verification a recurring operational need rather than a niche edge case. The third lens is pain
              intensity: cargo-theft and unlawful-brokering losses are large enough to justify software spend even if
              they are not the same thing as software TAM. The fourth lens is current adoption: Highway says it already
              serves more than 1,050 brokers, including 70 of the top 100, which means the enterprise segment is not
              hypothetical. The right conclusion is cautious. Truckload spend and theft losses describe the economic
              surface area, but they do not prove a software market of similar size. The defensible TAM is a
              broker-account and risk-exposure narrative, with a near-term SOM measured in low-thousands of broker
              accounts rather than in inflated freight dollars.
