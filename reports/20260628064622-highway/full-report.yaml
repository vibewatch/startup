      - number: '8.2'
        title: Comparable disclosure lenses and sensitivity framing
        blocks:
          - type: paragraph
            body: >-
              The cleanest public lenses are not perfect valuation comps; they are disclosure comps. C.H. Robinson shows
              what a public freight operator reveals every quarter and every year: revenue scale, filing cadence, and
              operating volume metrics are all visible. Descartes shows what a logistics-software platform makes
              available through investor relations and public market data. Together they frame a wide multiple spread:
              low-sales-multiple freight brokerage economics on one side and materially richer logistics software
              revenue multiples on the other. That spread is exactly why Highway cannot be valued by adjacency alone.


              Public information does, however, support a disciplined thought experiment. Highway says it serves more
              than 1,050 brokers, but it does not publish pricing. If one uses a speculative ACV band of $20K to $50K
              per broker, the resulting ARR range is roughly $21M to $52.5M. That is not a Highway fact; it is an
              underwriting question. Applying a heuristic 5-15x ARR framing to that estimated band produces an
              indicative enterprise-value range of roughly $105M to $788M. The exercise is useful only because it shows
              how wide the possible answer still is and how dependent the call remains on undisclosed pricing,
              paying-account definition, retention, and margin.
