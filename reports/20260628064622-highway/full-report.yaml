      - number: '7.2'
        title: Regulatory, legal, and privacy risk
        blocks:
          - type: paragraph
            body: >-
              Highway's legal and regulatory exposure starts with the fact that its product does not merely score
              carrier risk from afar; it directly touches sensitive identity and workflow data. The January 1, 2026
              privacy notice says Highway may collect government IDs, photos or videos, biometric data, geolocation,
              ELD-derived location data, and bank details, and says biometric data collected through its verification
              vendor may be stored for up to three years. That matters because public carrier criticism has already
              surfaced around the driver's-license and face-image workflow, and because Illinois, Texas, and Washington
              each maintain biometric-privacy regimes that can become relevant once a company collects and retains
              biometric identifiers at scale. The contractual posture is also one-sided: Highway's terms reserve broad
              rights to modify services and suspend or terminate access, while disclaiming liability for losses or
              decisions made using the service. That combination does not prove a pending lawsuit, but it does increase
              the probability that disputes, class-action theories, or carrier/broker commercial claims could emerge if
              stricter controls create measurable business harm. A separate regulatory vector comes from FMCSA workflow
              change. Highway operates in a market where verification still leans on public carrier authority and
              registration data, and FMCSA's Motus modernization indicates that identifier and registration workflows
              are moving toward a USDOT-centric structure. If the authority-verification baseline changes, Highway may
              have to rebuild parts of onboarding, exception handling, and internal rule logic faster than customers
              expect. Finally, Highway itself is now trying to formalize insurance-data quality through its Certified
              Insurance Agencies program, which is strategically smart but also an implicit admission that stale or
              inaccurate third-party insurance data is material enough to threaten broker decisions and expose the
              platform to blame when signals are wrong.
