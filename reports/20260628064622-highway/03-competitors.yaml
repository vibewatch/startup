- id: FP003
  title: Moat / readiness KPIs
  type: kpi
  layout: standard
  summary: 'Compact view of the competitive signals that matter most for Highway: standards-backed identity, attack-volume telemetry, partner leverage, and the scale gap versus larger incumbent platforms.'
  data:
    items:
    - label: Standards-backed identity posture
      value: NIST SP 800-63 conformance
      detail: Signals Highway's attempt to anchor category leadership in recognized identity controls rather than only broker convenience.
    - label: Current fraud telemetry
      value: 527,940 emails + 71,801 spoofed numbers
      detail: Q1 2026 figures quantify the attack surface Highway claims to manage for brokers.
    - label: Channel coverage
      value: Phone, email, exchange, lane, rate-con
      detail: Highway's public stack spans more transaction surfaces than a typical onboarding-only tool.
    - label: Direct-competitor proof point
      value: 63,000+ entities reviewed by Truckstop in 2025
      detail: Shows Truckstop is not a niche point solution but a scaled direct competitor with disclosed operating volume.
    - label: Largest incumbent scale signal
      value: 1,300+ MCP customers; 250k+ carriers onboarded
      detail: Descartes has the clearest public scale advantage among onboarding-centric rivals.
    - label: Free substitute pressure
      value: FMCSA snapshot free, one carrier at a time
      detail: Explains why Highway must prove ROI against a familiar no-budget baseline, not just against software competitors.
