  rows:
  - - Highway
    - Direct identity-and-access platform
    - Q1 2026 index reports 527,940 blocked fraudulent emails and 71,801 spoofed phone numbers; 2026 partner program launched
    - Freight brokers and their carrier-sales teams
    - Carrier Identity Engine, TFX, Lane Intelligence, Load Lock, VoIP/email controls
    - Most explicit identity-first workflow spanning onboarding through transaction channels
    - Public network size, realized pricing, and retention are not disclosed
  - - Truckstop RMIS / Risk Factors
    - Direct onboarding and monitoring competitor
    - 63,000+ entities reviewed in 2025; roughly 19,500 onboarding denials/failed identity checks; 57% fraud reduction claim
    - Freight brokers using Truckstop ecosystem
    - Carrier onboarding, monitoring, compliance, fraud checks, suspicious IP auto-blocking
    - Most direct broker-facing substitute with measurable onboarding and fraud outcomes
    - Public material centers on onboarding and vetting rather than Highway-style voice/email/rate-con controls
  - - DAT
    - Incumbent load-board and vetting workflow
    - Large incumbent marketplace position, but reviewed pages emphasize directory and process rather than proprietary identity metrics
    - Freight brokers, carrier managers, load-board users
    - Load board, directory, public-data vetting, workflow guidance
    - Entrenched incumbent workflow and relationships
    - Reviewed materials do not show Highway-like identity-linked controls across channels
  - - Descartes MyCarrierPortal + MacroPoint
    - Incumbent platform rival
    - 1,300+ customers; 250k+ carriers onboarded; 350k+ COIs on file; 100k+ fraudulent activities flagged
    - Brokers, 3PLs, shippers
    - Carrier onboarding, compliance, insurance monitoring, incident reporting, visibility adjacency
    - Biggest disclosed scale and strongest bundling path in the peer set
    - Less explicitly focused than Highway on secure transaction channels at the point of booking
  - - GenLogs
    - Adjacent physical-world verification platform
    - Official site says 4.2B images total and 16M per day; AWS page says 15M per day
    - Brokers, shippers, risk teams
    - Roadside-sensor intelligence, photographic proof, sourcing, compliance, asset monitoring
    - Unique physical-world truth layer can validate carrier behavior beyond paper records
    - Not a full onboarding or secure-communications platform
  - - Overhaul
    - Adjacent risk / visibility platform
    - Enterprise visibility platform with customer ROI and compliance claims, but no broker-network count disclosed
    - Shippers and high-consequence cargo operators
    - SKU-level visibility, predictive risk intelligence, carrier verification, theft intervention
    - Broader shipment-risk and insurance framing than Highway
    - Less centered on broker network onboarding and carrier-access controls
  - - CargoNet
    - Adjacent theft-recovery network
    - 24/7/365 command center and law-enforcement information sharing, but not an onboarding network
    - Carriers, brokers, insurers, law enforcement
    - Cargo-theft prevention, alerts, analytics, recovery coordination
    - Strong recovery and intelligence network for cargo theft events
    - Does not replace identity-proofed onboarding or booking workflow
  - - FMCSA SAFER / manual process
    - Free status quo substitute
    - Public safety and registration data; Company Snapshot free one carrier at a time
    - Anyone vetting a carrier manually
    - Registration lookup, safety history, authority checks
    - Free, familiar, and already embedded in daily workflows
    - Leaves identity, spoofing, and secure-communications gaps unresolved
