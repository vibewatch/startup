- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat or risk dimension
  - Current assessment
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - NIST-aligned identity proofing
    - Real but specialized differentiator
    - Incumbents adopt similar proofing or customers treat it as table stakes
    - Medium
    - Ask for adoption rates, false-positive rates, and how often NIST-conformant flows change broker or carrier behavior.
  - - Multi-channel security across phone, email, and rate confirmations
    - Strongest visible moat element
    - Competitors bolt on adjacent channel controls without rebuilding their core platforms
    - High
    - Validate attach rates for VoIP, Load Lock, and secure email relative to base onboarding deployments.
  - - Partner and integration leverage
    - Helpful distribution amplifier
    - Larger incumbents still control broader installed bases and workflow surfaces
    - Medium
    - Request current partner counts, co-sell contribution, and embed depth in key TMS or telematics platforms.
  - - Incumbent bundling pressure
    - Most credible displacement path
    - Descartes bundles MCP with MacroPoint; Truckstop bundles RMIS with marketplace position; DAT stays embedded
    - High
    - Test whether Highway wins when buyers run a formal bake-off against broader bundles rather than a point-solution search.
  - - Status-quo stickiness
    - Persistently high
    - Free FMCSA checks plus internal process remain good enough for price-sensitive brokers
    - High
    - Quantify labor hours, fraud loss avoided, and time-to-booking versus manual process to justify spend.
  - - Carrier-friction risk
    - Visible but manageable
    - Stricter verification annoys small carriers or reduces willingness to onboard quickly
    - Medium
    - Measure carrier drop-off and time-to-approval by carrier segment; compare fraud reduction to lost capacity.
  notes: Severity reflects competitive durability risk over the next 12-24 months, not an investment recommendation. The register focuses on evidence visible in public sources, so several mitigations require company-only operating data.
