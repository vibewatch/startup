- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Solution
  - Public contract / access model
  - Public price signal
  - Included capabilities
  - What is not public
  - Competitive implication
  rows:
  - - Highway
    - 'Demo-led software packaging: Connect Core, Load Lock, and fraud-prevention add-ons'
    - No public rate card
    - Carrier identity, onboarding, lane intelligence, exchange access, phone/email/rate-con controls
    - Realized pricing, seat model, and implementation scope are undisclosed
    - Helps Highway sell a full security workflow, but opacity limits easy ROI comparison
  - - Truckstop RMIS
    - Broker software subscription alongside Truckstop ecosystem
    - No public list price; public claim is up to 80% faster onboarding
    - Onboarding, monitoring, compliance, suspicious-IP blocking, discrepancy alerts
    - Exact contract structure and realized savings are undisclosed
    - Closest like-for-like packaging substitute for a broker security buyer
  - - DAT
    - Load board / directory / workflow incumbent
    - No public price in reviewed pages
    - Directory, vetting guidance, relationship and process tooling
    - No public fraud-outcome metrics in reviewed pages
    - Often competes by being already embedded rather than by matching Highway feature breadth
  - - Descartes MyCarrierPortal + MacroPoint
    - Platform subscription with onboarding, monitoring, and MacroPoint-linked fraud stack
    - No public list price
    - Carrier onboarding, COI monitoring, fraud flags, incident reporting, visibility adjacency
    - Actual packaging between MCP and MacroPoint FraudGuard is not disclosed publicly
    - Bundling breadth is the key threat, even without visible pricing
  - - GenLogs
    - Enterprise intelligence platform
    - No public price; marketplace pitch is consultative
    - Roadside-sensor truth layer, sourcing, compliance, asset monitoring
    - Commercial packaging and per-user economics are undisclosed
    - Can win budget when buyers care more about observed behavior than onboarding automation
  - - Overhaul / CargoNet
    - Enterprise risk platform or network membership
    - No public list price in reviewed pages
    - 'Overhaul: visibility, risk, carrier verification; CargoNet: theft alerts, analytics, recovery network'
    - How often these solutions replace versus complement onboarding software is not public
    - More likely to be layered beside Highway than to replace it end to end
  - - FMCSA SAFER / manual process
    - Free public lookup plus internal labor
    - Free one-carrier-at-a-time Company Snapshot
    - Registration, authority, and safety lookup only
    - No collaboration layer, no secure transaction controls, and no identity proofing outcomes
    - Sticky because cost is zero, but operational burden and fraud exposure remain with the broker
  notes: The comparison is mostly about packaging and access model because none of the major peers publish a clean public rate card in the fetched corpus. Highway's competitive question is therefore whether integrated security can justify a software budget versus incumbent or free workflows.
