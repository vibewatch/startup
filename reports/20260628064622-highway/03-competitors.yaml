  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: Incomplete public enumeration for competitor profile and feature matrix
    missingEvidence: A complete 2026 market map of broker-facing carrier identity, onboarding, and fraud vendors with disclosed pricing, customer counts, and feature-level parity.
    whyItMatters: The public corpus is strong enough for the main direct, incumbent, adjacent, and status-quo set, but not enough to claim exhaustive coverage across regional, niche, or white-labeled alternatives.
    diligencePath: Ask Highway for named loss analyses and win/loss lists by competitor; supplement with broker RFPs or G2/RFP documents that reveal which vendors appear in real buying cycles.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP001
    - TP002
  - type: private-evidence-only
    severity: material
    topic: Independent validation of Highway realized fraud reduction and ROI
    missingEvidence: Audited customer-level before-and-after data showing fraud loss avoided, booking-speed gains, attach rates for channel-security modules, and churn by cohort.
    whyItMatters: Highway and Truckstop both cite compelling fraud and onboarding metrics, but the public record does not let an outsider compare realized customer ROI on a normalized basis.
    diligencePath: Request anonymized broker case studies with baseline and post-deployment metrics, plus references from customers who evaluated Highway against Truckstop or Descartes in the same period.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: Highway network size, retention, and competitive win-rate versus incumbents
    missingEvidence: Current broker count, verified-carrier count, module attach rates, net retention, and named competitive wins or losses versus Truckstop, DAT, and Descartes.
    whyItMatters: Without those internal metrics, the analysis can describe Highway's product differentiation but cannot cleanly quantify how much commercial momentum it has relative to larger incumbents.
    diligencePath: Request board-level KPI dashboards or cohort tables showing network growth, retention, and competitive displacement outcomes by segment.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP001
    - TP003
