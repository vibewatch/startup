callouts:
- calloutType: strength
  title: Highway's clearest public edge is secure transaction-channel control
  body: 'The reviewed public corpus consistently points to one differentiator that incumbents do not make equally explicit: Highway links identity proofing to the operational channels where fraud happens in practice, including phone calls, rate confirmations, and access to identity-verified freight transactions.'
  claimRefs:
  - CP005
  - CP006
  - CP032
  - CP037
- calloutType: risk
  title: Bundling is a bigger threat than feature-for-feature point competition
  body: Truckstop, Descartes, and DAT do not need to copy every Highway feature to be dangerous. They can preserve share by making their broader network or workflow bundle feel sufficiently safe, especially when public pricing remains opaque.
  claimRefs:
  - CP034
  - CP038
  - CP039
  - CP040
- calloutType: insight
  title: The free status quo still shapes the category
  body: FMCSA SAFER and manual verification remain a powerful substitute because they are familiar and free. Highway's sales challenge is therefore not only to beat software rivals, but to convince brokers that identity-linked controls are worth paying for.
  claimRefs:
  - CP027
  - CP028
  - CP040
