chapter:
  number: 3
  title: Competitors
  summary: Highway's most direct competition comes from broker-facing carrier-onboarding and vetting vendors such as Truckstop RMIS and Descartes MyCarrierPortal, while DAT and FMCSA remain the sticky incumbent and free-status-quo alternatives. Adjacent entrants like GenLogs, Overhaul, and CargoNet matter because they can absorb fraud or cargo-risk budget without matching Highway's full product shape. The net result is a specialized but credible Highway moat around identity-first transaction security, offset by bundling risk from larger incumbents and the persistent pull of manual FMCSA-based workflows.
sections:
- id: direct-competitors-and-differentiation
  title: Direct competitors and differentiation
  body: 'Highway''s closest direct competition comes from vendors that sit inside a broker''s carrier-onboarding and qualification workflow rather than from generic fraud-intelligence products. Truckstop RMIS is the clearest one-for-one rival because it sells carrier onboarding, monitoring, and fraud controls directly to brokers and backs that pitch with outcome metrics: Truckstop says RMIS can make onboarding up to 80% faster, reported a 57% decrease in customer-reported fraud from Q1 2024 to Q1 2025, reviewed more than 63,000 entities in 2025, and blocked roughly 20,000 would-be onboardings through failed identity or qualification checks. Descartes MyCarrierPortal is the larger platform rival: it discloses 1,300+ customers, 250k+ carriers onboarded, 350k+ carrier COIs on file, and links MCP with MacroPoint FraudGuard to bundle onboarding, visibility, and fraud prevention. Highway''s public differentiation is narrower but sharper. It combines identity proofing, lane intelligence, secure
    exchange access, phone controls, and rate-confirmation security inside one identity-first workflow. That makes Highway more purpose-built for brokers who see fraud as a transaction-channel problem, while Truckstop and Descartes look stronger when buyers prefer a broader incumbent data or network position.'
