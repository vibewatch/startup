- id: TV004
  title: Comparable valuation table
  columns:
  - Reference set
  - Metric used
  - Multiple / valuation status
  - Relevance to Highway
  - Main limitation
  rows:
  - - C.H. Robinson Worldwide
    - June 2026 public-sales lens using investor relations and market-data references
    - ~$16.2B TTM revenue and ~1.30x sales
    - Useful freight-operator disclosure benchmark and reminder that logistics adjacency does not guarantee software multiples.
    - Asset-light freight brokerage is not broker-facing SaaS.
  - - Descartes Systems Group
    - June 2026 public logistics-software lens using IR and market-data references
    - ~$753.9M TTM revenue and ~8.02x sales
    - Better software-style reference for how logistics workflows can trade when disclosure and recurring revenue are visible.
    - Descartes is public, scaled, and far more disclosed than Highway.
  - - Growth-equity vertical SaaS heuristic
    - Analyst framing band used only as a thought tool
    - ~5-15x ARR heuristic
    - Helpful midpoint between low-multiple freight operators and richer software references.
    - Not a confirmed Highway fact and not sourced to a single disclosed transaction here.
  - - Highway public-data thought experiment
    - 1,050+ brokers multiplied by speculative $20K-$50K ACV
    - ~$21M-$52.5M ARR estimate; ~\$105M-\$788M EV at 5-15x ARR
    - Creates a rough underwriting box for discussion while management metrics remain private.
    - Entire range depends on unknown paying-account definition, pricing, attach, and retention.
  notes: This table mixes disclosure lenses, public comps, and an explicitly estimated thought experiment. Use it to frame uncertainty, not to claim a settled mark.
  enumerationScope:
    coverage: exhaustive
    basis: 'Covers the four valuation reference sets actually used in this chapter: freight-operator disclosure, logistics-software disclosure, a heuristic vertical-SaaS band, and a Highway-only thought experiment.'
