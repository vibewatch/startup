- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Valuation / return logic
  - Probability signal
  - Downside trigger
  rows:
  - - Bull
    - ACV trends toward the top of the public thought experiment, retention is elite, and multi-module attach validates FTV's sponsor language.
    - Estimated ARR moves toward the upper end of the $21M-$52.5M thought-experiment band and supports a premium private-software framing.
    - Requires management data that confirms strong ACV, GRR/NRR, and software-like gross margin.
    - Failure to convert broker reach into paying and expanding accounts.
  - - Base
    - ACV and retention are respectable but not elite, and product relevance is real without full proof of premium economics.
    - The company remains worth tracking, but public evidence still does not justify aggressive entry discipline.
    - Most consistent with what public evidence supports today.
    - Continued opacity on pricing, margin, and round terms.
  - - Bear
    - Customer-count optics overstate paying penetration, attach rates stay narrow, or economics are dragged down by support/data costs.
    - Any unknown private mark could prove too rich relative to real ARR and cash-generation quality.
    - Triggered by weak retention, weak ACV, or heavy preference overhang.
    - A new round on weaker terms or evidence of concentrated customer exposure.
  notes: Scenario framing is qualitative by design because the public record is missing the exact inputs needed for numeric return underwriting. Where numbers appear elsewhere in this chapter, they are estimates and open questions, not company disclosures.
