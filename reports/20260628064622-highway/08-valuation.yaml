tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Why
  - Decision implication
  rows:
  - - Recommendation
    - Track
    - Public evidence supports real product relevance and sponsor interest, but not a price-sensitive entry decision.
    - Keep active coverage and request management data before underwriting upside.
  - - Confidence
    - Medium
    - Broker scale, category urgency, and sponsor language are corroborated, but valuation inputs remain private.
    - Treat the call as directionally informed rather than high-conviction on price.
  - - Risk rating
    - Medium
    - Fresh capital and customer-scale proxies offset some downside, but opaque unit economics and platform dependencies remain material.
    - Maintain diligence discipline rather than taking a blind premium-software view.
  - - Valuation stance
    - Unknown
    - No public valuation, revenue, ARR, pricing, or round terms are disclosed.
    - Do not label the company attractive, fair, or stretched with false precision.
  - - Overall score
    - 6.5 / 10
    - Highway scores well on problem relevance and product credibility, but poorly on financial visibility.
    - Suitable for watchlist and diligence continuation, not immediate conviction entry.
  - - What changes the view
    - ARR, ACV, retention, margin, and round-term disclosure
    - A compact management data room could quickly narrow the current valuation band.
    - Positive disclosure could upgrade the recommendation; weak disclosure could break the thesis.
  notes: Recommendation is intentionally evidence-sensitive and price-sensitive. The company may be good even if the investment case remains incomplete.
