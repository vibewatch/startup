- id: final-diligence-asks-and-thesis-breakers
  title: Final diligence asks and thesis-break triggers
  body: 'The final investment judgment depends less on brand-new market research than on management disclosure. The missing items are ordinary underwriting inputs: realized pricing, customer-definition clarity, ARR, GRR/NRR, gross margin, customer concentration, and the exact economic terms of the August 2025 round. Without those data, public evidence can support business quality and category urgency, but not price discipline. Even the strong FTV language on profitability and retention remains sponsor framing until management numbers substantiate it.


    The thesis would weaken quickly if paying-customer penetration is materially below the headline broker count, if attach rates are narrow, if gross margin is burdened by data-vendor or support costs, or if new round terms create preference overhang that caps common-equity upside. Conversely, a relatively small private-data package could improve the call meaningfully. If management can show strong ACVs, software-like margins, clean retention, and straightforward round economics, Highway could move from trackable to actionable without changing the company much at all.'
