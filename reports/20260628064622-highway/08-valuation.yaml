- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Current view
  - What would change the view
  rows:
  - - Product thesis
    - Highway appears to be a broker-facing trust and workflow SaaS platform with multiple expansion surfaces beyond core onboarding.
    - Strong attach-rate and renewal disclosure would materially strengthen this thesis.
  - - Customer thesis
    - 1,050+ brokers and top-100-broker penetration suggest real market relevance, not a trivial pilot footprint.
    - Paying-account clarity and concentration data are needed to convert reach into underwriting confidence.
  - - Sponsor thesis
    - FTV's profitability and retention language is directionally positive and consistent with growth-equity backing.
    - Audited or management metrics must confirm that sponsor language reflects actual economics.
  - - Disclosure anti-thesis
    - No public valuation, revenue, pricing, ARR, or round terms are disclosed.
    - Even modest management disclosure could narrow the current uncertainty band quickly.
  - - Adverse anti-thesis
    - Carrier-verification pushback and outage evidence show that trust products can create friction and dependency risk.
    - Evidence that these issues are low-frequency and commercially manageable would reduce this concern.
  - - Investment anti-thesis
    - The company may be strategically valuable and still not be a buyable private asset at an unknown price.
    - A disclosed or diligenced mark relative to actual ARR and retention is the key unlock.
  notes: Each row pairs the current narrative with the precise disclosure or operating evidence required to move the recommendation.
