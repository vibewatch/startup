callouts:
- calloutType: recommendation
  title: Track is the disciplined call
  body: Highway has enough public product, customer, and sponsor proof to stay active in coverage, but not enough valuation disclosure to justify a Buy recommendation at an unknown private price. The central issue is not whether the company matters; it is whether the economics behind that relevance are as strong as the narrative implies.
  claimRefs:
  - CV034
  - CV035
  - CV037
  - CV038
- calloutType: assumption
  title: The ARR and EV math is a thought experiment, not a fact
  body: The $21M-$52.5M ARR band and the derived $105M-$788M EV range exist only to show how sensitive Highway's value is to undisclosed ACV and retention. Those numbers should be treated as underwriting questions and explicitly not as confirmed Highway financials.
  claimRefs:
  - CV029
  - CV030
  - CV031
  - CV032
  - CV033
- calloutType: risk
  title: Sponsor enthusiasm is helpful but not sufficient
  body: FTV's language around scalable profitability and a highly retentive blue-chip customer base is directionally encouraging, yet it remains sponsor framing until management provides actual ARR, margin, and retention data. This is the main reason valuation stance stays unknown instead of moving to attractive or fair.
  claimRefs:
  - CV003
  - CV004
  - CV037
  - CV047
