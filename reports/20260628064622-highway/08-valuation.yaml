- id: scenario-underwriting-and-recommendation
  title: Scenario underwriting and recommendation
  body: 'The bull case is not hard to articulate. Highway could justify a premium private-software outcome if the sponsor language is directionally right: if the broker count really translates into paying penetration, if retention is elite, if attach rates across Load Lock, TFX, VoIP, and related modules materially expand wallet share, and if gross margins look software-like after third-party data and monitoring costs. In that world, Highway is not merely a freight-fraud tool; it is a workflow and trust-control layer embedded into broker operations.


    The base case is more restrained and is the right public-market stance today. Highway may be strategically important to customers and still remain too opaque to price aggressively. The bear case is not that the product is fake; it is that disclosed customer-scale proxies fail to convert into the ACV, renewal, and margin profile implied by a growth-equity software narrative. That asymmetry is why the recommendation is Track rather than Buy. Public evidence is sufficient to monitor closely and insufficient to say whether current private pricing would be attractive, fair, or stretched.'
