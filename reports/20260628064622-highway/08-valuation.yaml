- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Paying-account penetration disappoints
    - Management shows the 1,050+ broker figure includes many low-value or non-paying relationships.
    - The ARR thought experiment collapses and broker-count signaling loses valuation relevance.
    - Downgrade from Track toward Avoid absent offsetting ACV strength.
  - - Retention does not match sponsor language
    - GRR or NRR materially trails what a premium vertical SaaS narrative would imply.
    - FTV's retentive-customer framing stops supporting premium-software logic.
    - Reframe the company as strategically useful but not premium-priced.
  - - Gross margin is structurally weaker than expected
    - Data-vendor, support, fraud-ops, or communication costs keep margins far below software-like levels.
    - Rich SaaS heuristics become inapplicable even if revenue is real.
    - Use lower-multiple disclosure lenses and pause aggressive underwriting.
  - - Preference stack is heavy
    - Round terms or liquidation preferences cap common-equity upside.
    - A good business can still be a weak late-entry investment.
    - Require cap-table and waterfall analysis before any investment committee support.
  - - Adverse operating evidence persists
    - Verification friction or alert/outage incidents become recurrent rather than isolated.
    - Product value may remain real while implementation friction lowers adoption and retention.
    - Keep on watchlist only if mitigations are weak or unproven.
  notes: Kill criteria are tied to monitorable diligence outputs rather than to vague sentiment shifts.
  claimRefs:
  - CV026
