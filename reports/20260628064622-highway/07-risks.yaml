  title: Biometrics are both moat and litigation surface
  body: Highway's identity-heavy workflow is strategically rational in a market where fraud keeps moving across email, phones, ELD-adjacent signals, and insurance. But the exact same workflow creates a visible legal and commercial surface because public sources already show concern over driver's-license uploads, face images, biometric retention, and the risk of being functionally shut out of broker networks if verification is refused.
  claimRefs:
