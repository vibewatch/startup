  - CR007
  - CR009
  - CR019
- calloutType: risk
  title: The Samsara incident matters because it punctures the illusion of self-contained security
  body: Highway markets load-level protection as a tighter, more trustworthy operating layer, yet the February 2026 Load Lock incident showed that external partner uptime can still interrupt customer-visible alerts and updates. If customers buy Highway as a control system, repeated third- party outages will be judged as Highway failures whether or not the root cause sits elsewhere.
  claimRefs:
  - CR020
  - CR021
  - CR022
- calloutType: insight
  title: Competitive pressure will show up first in margin and retention, not in headline category relevance
  body: Highway can remain strategically relevant and still be economically pressured. Descartes and Truckstop publish enough scale and fraud-control proof to compress Highway's premium, while FMCSA/manual workflow preserves a zero-budget alternative. If Highway cannot prove that stricter controls improve outcomes without adding too much support burden or carrier loss, the market can validate the problem while discounting the standalone economics.
