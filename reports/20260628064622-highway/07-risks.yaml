  evidenceGaps:
  - type: missing-source
    severity: material
    topic: false-positive-risk
    missingEvidence: Highway's actual false-positive rate, appeal volume, reversal rate, and carrier churn attributable to stricter IDV or insurance-status errors.
    whyItMatters: Anecdotes of wrongful insurance expiry and intrusive verification are not enough to judge whether friction is occasional or systematic.
    diligencePath: Request monthly support dashboards, appeal logs, reversal rates, and carrier-verification funnel metrics segmented by broker and carrier size.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: threatened-claims
    missingEvidence: Any demand letters, threatened litigation, arbitration notices, or broker-carrier disputes involving biometric retention, suspension, or onboarding gating.
    whyItMatters: Public silence is not proof of no legal exposure; early disputes often surface privately before they become filed cases.
    diligencePath: Obtain outside-counsel memo and management representation on threatened claims, regulatory correspondence, and dispute reserves.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: management-depth
    missingEvidence: Current 2026 headcount, org chart, leadership roster below Jordan Graft, and staffing levels for risk operations, support, legal, and engineering.
    whyItMatters: Highway's product surface is widening while public org visibility remains narrow; execution quality depends on bench depth, not just founder fit.
    diligencePath: Request current org chart, headcount by function, and role-by-role leadership map with tenure and attrition data.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: partner-economics
    missingEvidence: Revenue-share terms, minimum commitments, SLAs, exclusivity restrictions, uptime guarantees, and termination rights for Triumph, Samsara, McLeod, Parade, and other material partners.
    whyItMatters: Partner dependence is visible publicly, but the economic and operational asymmetry of those dependencies is not.
    diligencePath: Review material partner contracts, SLA schedules, incident credits, renewal dates, and concentration by workflow volume.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Full board roster, independence status, observer rights, voting thresholds, protective provisions, and control rights granted to FTV and Lead Edge.
    whyItMatters: Governance can either mitigate founder concentration or amplify it; the public record currently does not reveal which is true.
    diligencePath: Request charter documents, board-consent thresholds, investor-rights agreements, and committee composition.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: material
    topic: insurance-roi
    missingEvidence: Evidence that Highway's controls measurably reduce insurance losses, claims frequency, or broker premiums rather than only shifting workflow burden.
    whyItMatters: The "insurance is the real regulator" thesis is strategically important, but its economic proof is not publicly disclosed.
    diligencePath: Request insurer case studies, broker premium changes, claim-severity data, and pre/post control-loss comparisons.
    relatedQuestionRefs:
    - QR031
    relatedTableRefs:
    - TR005
