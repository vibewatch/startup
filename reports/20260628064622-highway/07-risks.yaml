chapter:
  number: 7
  title: Risks
  summary: Highway's highest-risk cluster sits at the intersection of privacy-heavy identity controls, third-party workflow dependencies, and a fast-moving freight-fraud arms race. The same product posture that makes Highway strategically relevant—carrier identity, load-level monitoring, insurer and TMS integrations, ELD-adjacent signals, and strict access controls—also creates legal/privacy exposure, false-positive and carrier-friction risk, and dependence on partners such as Samsara, Triumph, McLeod, Parade, and insurance-data providers. Competitive pressure from Truckstop, Descartes MyCarrierPortal, and the free FMCSA/manual baseline can further compress pricing and force Highway to prove that tighter controls improve outcomes without choking carrier access.
sections:
- id: risk-overview-and-prioritization
  title: Risk overview and prioritization
  body: 'Highway''s risk profile is not dominated by a single existential flaw; it is dominated by a set of linked control-system risks. The first is regulatory and legal: Highway''s current privacy notice explicitly covers biometric data, geolocation, ELD-derived location data, and identity verification flows, while public adverse reporting shows that at least some owner-operators see those controls as invasive and market-limiting. The second is operational: Highway is promising real-time, load-level protection in a fraud environment that is visibly escalating, yet a public February 2026 incident showed that a partner outage at Samsara could interrupt Load Lock alerts and milestone updates. The third is dependency and competition: Highway is embedding itself into insurer, TMS, exchange, payment, and telematics workflows at the same time that larger rivals such as Descartes MyCarrierPortal and Truckstop are publishing scale metrics and fraud outcomes of their own, while FMCSA''s free one-carrier-
    at-a-time baseline remains sticky. The fourth is people and model risk: Jordan Graft remains central to the category narrative, while public sources still leave valuation, economics, partner contract terms, appeal rates, and governance depth largely opaque. The right way to read the chapter is therefore as a transmission map: legal/privacy friction, fraud-pressure growth, and partner outages all flow into adoption, retention, margin, and ultimately valuation risk.'
