- id: TR005
  title: Mitigation and kill criteria table
  notes: Triggers are investor-oriented and intentionally observable from outside the company. Any one item may not be fatal alone; combinations are more important than single incidents.
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Biometric / privacy litigation
    - Court filings, state AG inquiries, or public injunction request
    - Any named biometric or privacy suit tied to carrier IDV, retention, or consent
    - Immediate legal-diligence escalation; reassess adoption-friction thesis
  - - Carrier friction / false-positive overload
    - Broker or carrier complaints, public case studies, support leaks
    - Multiple public complaints or a disclosed spike in appeal volume / wrongful denials
    - Re-underwrite retention and network-liquidity assumptions
  - - Partner-driven reliability failure
    - Status pages, incident trackers, broker complaints
    - Repeated Samsara-like outages affecting Load Lock or milestone integrity in a 12-month period
    - Downgrade operational-quality confidence; require redundancy plan
  - - TFX partner dependency failure
    - Product changes, pricing shifts, partnership termination, service notices
    - Triumph or core TMS partner materially changes access, economics, or integration scope
    - Reassess exchange economics and workflow moat
  - - FMCSA workflow breakage
    - FMCSA system changes or authority-verification disruptions
    - Highway or major customers report onboarding friction tied to Motus / identifier changes
    - Require roadmap proof and customer transition metrics
  - - Incumbent competitive compression
    - Descartes or Truckstop launches materially broader bundled controls or superior fraud ROI proof
    - Clear evidence brokers can get similar outcomes from incumbent bundle with less friction
    - Re-rate Highway from differentiated control layer to feature-premium vendor
  - - Key-person disruption
    - Leadership departure, material role change, prolonged absence
    - Jordan Graft departs or loses operating control before bench depth is publicly visible
    - Pause conviction upgrade until succession and partner continuity are proven
  - - Economic opacity persists into next financing
    - New financing, board materials, or investor marketing remain non-disclosive
    - Still no gross margin, churn, support-burden, or partner-economics visibility at next major round
    - Treat valuation discipline as strict; avoid underwriting premium multiples
