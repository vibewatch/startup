- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Identity and authority resolution
    - Verify who the user is and whether they can act for the carrier
    - Carrier records, user verification flows, broker-configured policies
    - Public sources do not reveal graph model, storage design, or tenant isolation
  - - Rules and decisioning
    - Apply insurance, authority, lane, equipment, and behavioral requirements consistently
    - Broker policy configuration and data freshness
    - Need evidence on explainability, tuning workflow, and override controls
  - - Continuous monitoring and alerting
    - Watch identity, insurance, authority, behavioral, and telematics changes after onboarding
    - External data feeds and alert pipeline
    - Noise management, latency, and escalation quality are not public
  - - Communications security
    - Secure inbound phone handling and outbound rate-confirmation delivery
    - IVR systems, inbox hygiene, verified-user access controls
    - Need deeper docs on auth flows and incident response for compromised channels
  - - Execution visibility
    - Track whether the assigned truck can and does move the load
    - ELD / telematics providers, location signals, insurance data
    - Samsara incident shows real external dependency and availability exposure
  - - Exchange and integration layer
    - Embed verified identity inside TFX and partner systems such as McLeod, Parade, Qued, and Isometric
    - Partner APIs, TMS integrations, Triumph financial rails, Newtrul matching
    - Commercial differentiation depends on partner uptime and integration depth, not just Highway’s own logic
  notes: This is a public-evidence operating model, not an internal architecture diagram.
