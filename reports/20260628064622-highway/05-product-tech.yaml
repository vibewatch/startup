- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Highway solution
  - Measurable benefit
  - Limitation
  rows:
  - - Onboard a carrier safely
    - Verify identity, authority, insurance, lane fit, and equipment before granting access
    - Carrier Identity Engine with Sign In with Highway, rules, and continuous monitoring
    - Reduces manual back-and-forth and standardizes approval logic
    - Thresholds and false-positive rates are not public
  - - Protect a booked load
    - Keep compliance and fraud checks running after tender
    - Load Lock with alerts, exception routing, and secure rate-con delivery
    - Highway says 5M+ protected loads and zero strategic cargo theft incidents since start of 2024
    - Metric methodology is company-claimed
  - - Track whether the right truck is actually moving
    - Match assignment, location, and route reality during execution
    - Load Lock+ with ELD-powered tracking, geofencing, and vehicle assignment
    - Real-time visibility into suspicious mismatches or inactivity
    - Dependence on telematics partners is visible in the Samsara incident
  - - Find likely capacity faster
    - Rank trusted carriers for a lane without cold-calling blind
    - Lane Intelligence inside identity-verified network
    - Moves sourcing from reactive truck chasing to lane-first procurement
    - Public proof is mostly qualitative and customer-story based
  - - Book freight in a verified exchange
    - Give vetted brokers direct access to compliant, identity-verified carriers
    - TFX powered by Triumph and extended by Newtrul
    - Combines identity, payments, broker vetting, and matching in one surface
    - Public sources do not show exchange volume or monetization detail
  - - Protect communications channels
    - Screen phone calls and prevent compromised-inbox interception
    - Highway for VoIP plus secure rate-con delivery / email verification tooling
    - Q1 2026 external coverage cites 71,801 spoofed calls intercepted
    - Exact product boundaries across modules remain blurry publicly
  notes: Benefits are workflow-level and partly marketing-derived; the retained public pack is stronger on process design than on independently benchmarked ROI.
