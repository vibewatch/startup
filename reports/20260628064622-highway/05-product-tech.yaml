tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Carrier Identity Engine
    - Broker compliance, carrier sales, and risk teams
    - GA core platform
    - Combines identity, authority, capability, rules, and monitoring in one workflow
    - Need exact graph topology, tenant model, and alerting architecture
  - - Load Lock
    - Broker ops and load-compliance teams
    - Mature expansion module
    - Post-onboarding load-level compliance, secure rate-con delivery, exception routing, and alerts
    - Need audited methodology behind 5M+ loads and zero-theft claim
  - - Load Lock+
    - Broker ops and security teams
    - Newer but concrete
    - Automated ELD-powered tracking, geofencing, and vehicle assignment
    - Need vendor concentration, latency, and outage-resilience detail
  - - Lane Intelligence
    - Carrier sales and procurement teams
    - Commercially launched
    - Geospatial ranking of verified capacity using lane history, nearby trucks, and posted capacity
    - Need measured win-rate or margin lift versus standard sourcing
  - - Trusted Freight Exchange (TFX)
    - Broker capacity and digital-booking teams
    - Strategic platform bet
    - Identity-first exchange for vetted brokers and verified carriers with Triumph-backed financial rails
    - Need transaction-volume, take-rate, and attach-rate disclosure
  - - Highway for Carriers
    - Motor carriers
    - Live two-sided network layer
    - Lets carriers protect identity, verify brokers, and accelerate onboarding at no cost
    - Need carrier MAU, verified-broker usage, and opt-in conversion data
  - - Highway for VoIP / email security
    - Broker carrier-sales and fraud teams
    - Live communications-security layer
    - Blocks spoofed calls and secures rate-confirmation access for verified users
    - Need exact packaging split between VoIP, email, and Load Lock surfaces
  - - Certified Network and Know Your Driver
    - Insurance agencies, brokers, and security-sensitive operators
    - Early expansion surface
    - Extends identity assurance to insurance-data quality and eventually driver-level assurance
    - Need GA status, pricing, adoption, and workflow burden evidence
  notes: Public maturity here means commercial visibility and evidence depth, not a full independent quality audit for every module.
