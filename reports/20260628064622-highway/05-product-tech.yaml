  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: architecture-topology-gap
    missingEvidence: Internal service topology, identity-graph design, tenancy boundaries, data retention model, and alert-pipeline architecture behind the Carrier Identity Engine.
    whyItMatters: The product story is broad and plausible, but the public pack still cannot distinguish strong workflow packaging from deeply integrated, well-observed core architecture.
    diligencePath: Request architecture diagrams, system-boundary maps, data-flow diagrams, tenant-isolation controls, and incident postmortems for the identity and alerting stack.
    relatedQuestionRefs:
    - QE021
    - QE023
    - QE026
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: security-attestation-gap
    missingEvidence: Current SOC 2 report scope, exceptions, subservice carve-outs, trust-center materials, and control mapping from Highway’s NIST conformance claim into implemented systems.
    whyItMatters: Highway’s trust thesis is central to product value, so diligence needs the underlying control evidence rather than only a headline conformance announcement.
    diligencePath: Request the latest SOC 2 report, bridge letter, control matrix, NIST mapping memo, and evidence of independent assessment scope.
    relatedQuestionRefs:
    - QE019
    - QE024
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: reliability-history-gap
    missingEvidence: A broader uptime and incident-history record for Load Lock, Load Lock+, TFX, and partner integrations beyond the visible Samsara-linked February 2026 incident.
    whyItMatters: The public pack proves external dependency but not whether the outage was exceptional or representative of a larger operational pattern.
    diligencePath: Request status history, incident register, vendor SLA summaries, RTO/RPO targets, and monthly availability by product module and major dependency.
    relatedQuestionRefs:
    - QE022
    - QE026
    relatedTableRefs:
    - TE004
    relatedFigureRefs:
    - FE003
  - type: missing-source
    severity: material
    topic: know-your-driver-commercialization-gap
    missingEvidence: GA status, workflow burden, adoption metrics, pricing, and measured fraud-outcome impact for Know Your Driver beyond conference introduction and verification-volume commentary.
    whyItMatters: Driver-level identity could become a major differentiator, but today’s public evidence shows positioning and early volume more clearly than repeatable product maturity.
    diligencePath: Request product brief, customer rollout list, attach rate, funnel metrics, false-positive data, and implementation requirements for driver verification.
    relatedQuestionRefs:
    - QE017
    relatedTableRefs:
    - TE001
    - TE005
  - type: missing-source
    severity: medium
    topic: web-surface-and-docs-gap
    missingEvidence: Public API docs, integration docs, security docs, and a cleaner web-surface narrative that matches the platform’s claimed breadth.
    whyItMatters: The gap does not invalidate the product, but it weakens outside technical diligence and can mask where features are deep versus merely announced.
    diligencePath: Ask management for customer-facing docs, API references, integration guides, deployment playbooks, and a full module catalog with GA/beta status.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE001
    - TE003
