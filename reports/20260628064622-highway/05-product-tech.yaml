chapter:
  number: 5
  title: Product & Technology
  summary: 'Highway’s public product story is now a layered freight-security stack rather than a single carrier-onboarding tool: the Carrier Identity Engine feeds rules, monitoring, communications security, load-level enforcement, and a verified exchange. Public evidence strongly supports workflow breadth, partner embedding, and meaningful fraud-prevention telemetry, but it still leaves material diligence gaps around internal topology, control-attestation scope, dependency concentration, and the commercialization state of newer surfaces such as Know Your Driver.'
sections:
- id: product-surface-and-identity-core
  title: Product surface and identity core
  body: 'Highway’s chapter-five product surface is best understood as an identity-first control layer that has expanded outward into adjacent execution workflows. The anchor remains the Carrier Identity Engine: Highway’s public product materials frame it around three questions—who the carrier user is, whether that person has authority to act for the carrier, and whether the carrier has the capability to haul the load. The public workflow is not just point-in-time carrier onboarding. Highway explicitly markets Sign In with Highway as a broker-friendly SSO-style entry point, a rule builder for insurance, authority, lane-history, equipment, and behavioral requirements, and continuous monitoring for identity, insurance, authority, and telematics anomalies. That makes the product more like a live identity-and-compliance graph than a static carrier database.


    The surrounding module map is now materially broader. Highway’s main product pages tie the identity core to fleet analytics, Lane Intelligence, Load Lock, TFX, Highway for Carriers, Highway for VoIP, secure rate-confirmation delivery, and the newer certified-network and driver-verification efforts. Public scale claims are notable: the product catalog says Highway categorizes 90% of trucks and trailers in America across 280,000+ carriers and surfaces 225,000+ insights across 415,000+ interstate and intrastate carriers. Those claims, plus the Isometric and Parade partner releases, support a thesis that Highway is trying to become the system of record for carrier identity and execution eligibility inside broker workflows rather than only an onboarding checkpoint.


    The disciplined caveat is that Highway’s public web surface is still thinner than the product ambition. The site reveals what the modules do and where they sit in the customer flow, but not the deeper engineering details that diligence would need: graph topology, tenancy boundaries, alerting architecture, or the exact control mapping behind the company’s strongest security claims.'
