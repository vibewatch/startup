- id: retention-repeat-usage-and-friction-proxies
  title: Retention, repeat usage, and friction proxies
  body: True SaaS retention metrics are absent, so customer quality has to be inferred from workflow depth, repeat usage, and adverse evidence. The positive proxies are meaningful. FTV explicitly described a highly retentive blue-chip customer base. Circle's claim that Highway replaced a 30-person manual verification team suggests not just trial usage but operational dependence. ITS Logistics' 99% Highway-ELD connectivity is another strong signal that the system is embedded in day-to-day execution rather than left on the shelf. Transportation One's lane-first TFX story likewise implies repeat procurement behavior, not a one-off fraud event. At the same time, the adverse signal cannot be ignored. Overdrive reported owner-operator backlash to Highway's ID verification process, including driver's-license uploads, face-image collection, and claims of long biometric-data retention, and said carriers who refuse verification may lose active account access. That does not disprove customer value,
    but it raises a real question about whether stronger security creates onboarding friction that could affect carrier-side participation and ultimately broker satisfaction.
