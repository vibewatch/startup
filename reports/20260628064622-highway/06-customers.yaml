- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Risk or expansion area
  - Public status
  - Evidence
  - Why it matters
  - Diligence ask
  rows:
  - - Land-and-expand from identity into load-level protection
    - Visible
    - Sethmar, Axle, and TFX-related customer stories
    - Supports more wallet share than a one-time onboarding tool
    - Request module attach rates by customer cohort
  - - Embedded distribution through ecosystems
    - Visible
    - McLeod, Parade, Transport Pro, partner program
    - Could improve expansion and make Highway sticky inside existing systems
    - Request partner-sourced pipeline and partner-driven ARR
  - - Customer concentration
    - Unknown
    - No public top-customer or top-10 concentration disclosure
    - One or two large brokers could dominate revenue
    - Request top-10 customer revenue share and any >10% customers
  - - Retention / churn / NRR
    - Unknown
    - No public cohort or renewal metrics
    - Prevents clean translation from logos to durable revenue quality
    - Request NRR, GRR, logo churn, and cohort expansion by module
  - - Proof independence
    - Mixed
    - Most named proofs are company-authored or partner-coauthored
    - May overstate benefits or understate implementation friction
    - Collect independent customer references and customer-authored ROI decks
  - - Full-suite penetration
    - Unknown
    - Public sources do not say what share of 1,050+ brokers use TFX, Load Lock, VoIP, or all modules
    - Expansion potential may be high but currently unquantified
    - Request active customer counts by module and by ACV band
  notes: The key customer risk is not lack of logos but lack of economic context around those logos.
