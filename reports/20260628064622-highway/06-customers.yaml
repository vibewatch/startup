  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: Top-10 customer revenue share, any customer above material concentration thresholds, and revenue concentration by broker cohort.
    whyItMatters: Blue-chip logos do not prove diversification; one or two large broker accounts could still dominate revenue.
    diligencePath: Request the top-10 customer revenue table, concentration memo, and any board materials discussing customer exposure.
    relatedQuestionRefs:
    - QU021
    - QU025
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: NRR, GRR, logo churn, renewal rates, and cohort expansion by module and customer size.
    whyItMatters: Without retention data, the public proof set cannot be translated into durable recurring-revenue quality.
    diligencePath: Request retention dashboards, cohort tables, and renewal history by enterprise, mid-market, and partner-sourced accounts.
    relatedQuestionRefs:
    - QU016
    - QU020
    - QU025
    relatedTableRefs:
    - TU004
    - TU005
  - type: private-evidence-only
    severity: material
    topic: module-penetration-gap
    missingEvidence: Active-customer counts and ACV by Connect Core, Load Lock, TFX, VoIP, and other add-ons.
    whyItMatters: Expansion logic is visible publicly, but the share of the broker base that actually adopts higher-value modules is unknown.
    diligencePath: Request product-adoption dashboards, active logos by module, and expansion ARR by module.
    relatedQuestionRefs:
    - QU024
    - QU025
    relatedTableRefs:
    - TU002
    - TU005
  - type: missing-source
    severity: material
    topic: carrier-friction-gap
    missingEvidence: Systematic data on false positives, carrier appeals, abandonment, or broker dissatisfaction caused by Highway's verification flow.
    whyItMatters: Overdrive provides credible adverse anecdotes, but diligence needs to know whether the friction is edge-case noise or a meaningful adoption headwind.
    diligencePath: Request ID-verification funnel metrics, support-volume data, false-positive audits, and carrier reactivation rates.
    relatedQuestionRefs:
    - QU017
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: moderate
    topic: proof-independence-gap
    missingEvidence: More customer-authored ROI analyses, independent customer references, or third-party case studies not hosted by Highway.
    whyItMatters: Company-authored customer stories are useful, but they may understate implementation burden or selection bias.
    diligencePath: Collect at least three independent reference calls, customer-authored decks, or customer-written case materials from named broker accounts.
    relatedQuestionRefs:
    - QU022
    - QU025
    relatedTableRefs:
    - TU003
    - TU005
