- id: adoption-trajectory-and-scale-proxies
  title: Adoption trajectory and scale proxies
  body: 'Highway does not publish a current 2026 customer count, but the visible adoption proxies are still strong. The August 2025 financing announcement said Highway served more than 1,050 brokers, including 70 of the top 100 in the U.S., and that scale is corroborated across FTV, AJOT, Dallas Innovates, Source Alliance, and Yahoo Finance. FTV''s note is especially useful because it characterizes the base as highly retentive and blue-chip, implying the round was backed by customer-quality evidence even though the underlying cohort math stays private. Fresh 2026 proofs show that customer engagement is not static. FreightWaves'' Fraud Fighters coverage cites a 97% reduction in double brokering for customers, names ITS Logistics with 99% of carriers connected via Highway ELD, and places Highway in an award context that also references Arrive Logistics and RXO. The limitation is important: none of these sources disclose how many of the 1,050-plus brokers are active on TFX, Load Lock, VoIP,
    or the full suite, so scale is better evidenced than product penetration.'
