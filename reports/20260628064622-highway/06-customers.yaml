company:
  name: Highway
chapter:
  number: 6
  title: Customers
  summary: 'Highway''s public customer evidence is unusually concrete for a private freight-tech company. The retained record supports broad broker adoption, multiple blue-chip references, and several operational proofs that go beyond logo slides, including C.H. Robinson, Schneider, MODE Global, McLeod, Parade, Circle Logistics, Axle Logistics, Sethmar Transportation, Transportation One, and ITS Logistics. The strongest pattern is that customers appear to use Highway inside real broker workflows for carrier vetting, load-level compliance, secure booking, and lane-based procurement. The weakest part of the record is classic SaaS quality disclosure: Highway still does not publish NRR, churn, revenue concentration, or module-level penetration, so customer quality looks strong but revenue durability remains only partially visible.'
sections:
- id: customer-segmentation-and-buyer-map
  title: Customer segmentation and buyer map
  body: 'Highway''s customer base is best understood as a broker-first trust and workflow layer rather than a shipper-facing freight marketplace. The public roster spans very large freight brokers and logistics networks such as C.H. Robinson, Schneider''s Brokerage and Power Only businesses, MODE Global, RXO, Arrive Logistics, ITS Logistics, Allen Lund, and NTG, plus smaller or more operationally focused users such as Circle Logistics, Axle Logistics, Sethmar Transportation, and Transportation One. That spread matters because it suggests Highway is not dependent on a single buyer archetype. The common thread is not vertical but workflow pain: these customers need to verify who is actually hauling freight, automate compliance checks, protect digital booking, and reduce fraud without slowing down coverage. Product and demo pages reinforce that the buyer is generally a broker-side operations, compliance, carrier-procurement, or digital-booking leader rather than a shipper procurement team.
    The segmentation pattern is therefore attractive: Highway appears relevant to blue-chip enterprise brokers, mid-market brokerages, and embedded freight-tech platforms that need trusted carrier identity inside existing systems.'
