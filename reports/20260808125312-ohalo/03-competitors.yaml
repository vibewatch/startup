  "chapter": {
    "number": 3,
    "title": "Competitive Landscape",
    "summary": "Ohalo competes with gene-editing platforms (Inari, Cibus, Pairwise, Tropic), a direct hybrid-potato rival (Solynta), almond gene-editing entrants, adjacent input players (Pivot Bio), and seed incumbents. Its differentiation is heterosis-fixing Boosted Breeding for crops that never had hybrid seed, but it is pre-commercial, small, and reliant on partners who could become competitors."
  },
  "sections": [
    {
      "id": "landscape",
      "title": "Competitive Landscape and Direct Rivals",
      "body": "Ohalo operates in a crowded plant gene-editing and advanced-breeding field spanning platform companies, direct crop rivals, and incumbents. Platform peers include Inari, which pairs AI with multiplex gene editing for corn and soybean and raised a $144 million round as an agtech unicorn; Cibus, a publicly listed precision-editing company targeting disease resistance and herbicide tolerance in canola and rice; Pairwise, a CRISPR company for consumer produce reporting a 72% edit success rate and partnerships with large agriculture firms; and Tropic Biosciences, focused on banana and rice. Directly, Solynta pursues hybrid true potato seed against the same tuber-to-seed transition Ohalo targets, and at least two other companies announced gene-edited self-pollinating Nonpareil almonds, putting early pressure on FruitionOne. Pivot Bio competes adjacently by supplying microbial nitrogen rather than genetics. The competitive set therefore spans direct, platform, and adjacent rivals simultaneously, each pressuring a different part of Ohalo’s thesis.",
