    {
      "id": "pricing",
      "title": "Monetization and Packaging",
      "body": "Ohalo’s likely monetization is a mix of seed sales and trait licensing to seed companies and growers, mirroring peers’ licensing-led models. However, public per-unit pricing for gene-edited seed is scarce, so direct price competition is hard to assess and must be inferred from packaging choices. Competitors show varied approaches: Cibus licenses traits to seed developers, Pairwise sells branded consumer produce such as edited leafy greens, and Pivot Bio sells microbial inputs directly to farmers. Ohalo’s emphasis on crops that previously lacked hybrid seed lets it frame value around new yield and cost savings rather than displacing an existing seed price point, which could support premium pricing but also lengthens the education and adoption cycle with growers who have no prior reference price. Because licensing revenue depends on incumbent partners embedding Ohalo genetics into their own branded seed, the effective price to the grower may be bundled and invisible, making channel economics rather than list price the real competitive battleground.",
      "claimRefs": [
        "CP018",
        "CP019",
        "CP020",
        "CP034"
      ],
      "tableRefs": [
        "TP003"
      ]
    },
    {
      "id": "moats",
      "title": "Moat Durability and Competitive Risk",
      "body": "Ohalo’s primary moat is proprietary Boosted Breeding intellectual property for fixing heterosis in true seed, reinforced by first-mover positions in self-fertile Nonpareil almonds and commercial true potato seed. Those advantages are real but contestable: incumbents or well-funded rivals such as Inari could replicate heterosis-fixing or out-scale Ohalo through distribution, and reliance on seed-multinational partnerships brings both access and partner-turned-competitor risk. Cibus’s public listing and Inari’s deep funding give rivals capital-market access private Ohalo lacks, and Benson Hill’s post-SPAC distress is a cautionary comparable for platforms that scale before proving unit economics. No independent head-to-head field trial comparing Ohalo’s varieties to competitors’ is yet public, and Ohalo’s valuation appears stretched versus some revenue-generating peers, so moat durability ultimately hinges on defensible IP plus timely commercial proof. The rapidly growing gene-editing seed category will also attract new entrants, so competitive intensity is likely to rise even as Ohalo works to convert its technical lead into shipped, revenue-generating products.",
