  "chapter": {
    "number": 6,
    "title": "Customers and Adoption",
    "summary": "As a pre-commercial company, Ohalo’s “customers” are today strategic partners—Allied Potato, the University of Florida, and the Florida strawberry industry—rather than a paying base. Named partnerships provide credible early validation, but there is no retention, satisfaction, or sales-volume data yet, and early concentration in a few partners and regions is a key risk pending first deliveries in 2026-2027."
  },
  "sections": [
    {
      "id": "segmentation",
      "title": "Customer Segments and Go-to-Market",
      "body": "Because Ohalo is pre-commercial, its current customers are strategic partners and design collaborators rather than paying end customers, and understanding the base means understanding its partnerships. Its target segments span commercial potato growers reached through the Allied Potato partnership, almond growers and nurseries targeted by FruitionOne, Florida strawberry growers engaged via a University of Florida consortium, and seed multinationals as potential licensees that could also become competitors. Almond growers are motivated by eliminating pollenizer trees and pollination costs, while strawberry growers face an urgent, quantified disease threat from Neopestalotiopsis. The hire of Justin Wolfe, a former Syngenta executive, to lead commercialization signals a deliberate build-out of customer-facing go-to-market capability ahead of first revenue. The segmentation is coherent and tied to concrete grower pain points, but every segment is still at the trial-and-partnership stage rather than generating repeat sales, so the base should be read as a pipeline of prospective customers rather than an installed one.",
      "claimRefs": [
        "CU001",
        "CU002",
