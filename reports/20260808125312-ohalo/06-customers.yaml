    {
      "id": "proof",
      "title": "Named Customer Proof and Validation",
      "body": "Ohalo’s verifiable proof today is partnership-based. Allied Potato is a named strategic partner for commercializing true potato seed; the University of Florida (UF/IFAS) is a named R&D partner for disease-resistant strawberries; and the broader Florida strawberry industry is an engaged partner community. These endorsements act as early proxies for customer validation in lieu of sales data, but the proof remains qualitative and is not yet backed by sales volumes, pilot acreage, or trial counts, which Ohalo has not disclosed. Partner endorsements from a large potato producer and a leading agricultural university are meaningful signals of technical credibility and commercial intent, yet they are a handful of flagship relationships rather than a paying base. Diligence should convert these into verifiable trial data, acreage commitments, and, ideally, early purchase intent from the partners themselves, since a named partnership and a signed purchase order are very different levels of validation.",
      "claimRefs": [
        "CU007",
        "CU008",
        "CU009",
        "CU016",
        "CU018",
        "CU027",
        "CU028",
        "CU031",
        "CU036"
