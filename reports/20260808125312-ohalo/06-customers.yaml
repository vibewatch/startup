      ]
    },
    {
      "id": "adoption",
      "title": "Adoption Trajectory and Retention",
      "body": "Ohalo’s adoption trajectory is early, with first commercial deliveries of potato seed and almonds expected in 2026-2027. True potato seed’s logistics and disease advantages could accelerate grower uptake once field performance is proven, and historically growers have adopted proven new genetics at scale, as genetically engineered seed already dominates major US row crops. However, perennial almond adoption is inherently slow because orchards are long-lived, grower conservatism demands multi-season proof, and a softer farm-economics climate can dampen willingness to try new inputs. There is no public retention, repeat-purchase, or satisfaction data because Ohalo has not sold commercially; in seed markets, retention is driven by demonstrated yield, reliability, and season-over-season agronomic support, and for perennial crops satisfaction is only measurable years after first plantings mature. Repeat purchase of true potato seed will ultimately hinge on consistent field emergence and yield versus tubers.",
      "claimRefs": [
        "CU011",
        "CU012",
        "CU013",
        "CU014",
        "CU015",
        "CU017",
        "CU019",
        "CU030",
        "CU033"
      ],
      "tableRefs": [
        "TU002",
        "TU004"
      ],
      "figureRefs": [
        "FU002",
        "FU004"
      ]
    },
    {
      "id": "expansion",
      "title": "Expansion and Concentration Risk",
      "body": "Ohalo’s early customer base carries meaningful concentration risk: revenue and proof depend on a small number of flagship partners, notably Allied Potato, and the base is geographically concentrated in California potatoes and almonds and Florida strawberries. Expansion depends on moving from anchor partners to a broad base of growers and licensees across crops, and licensing to large seed companies could rapidly broaden reach while concentrating dependence on a few licensees. The largest long-run opportunity is adoption in global staple potato markets if true seed proves out, though broad diversification is a multi-year journey given biological and regulatory gating per crop and geography. Consumer perception of gene-edited produce could influence downstream grower demand, but sustainability and input-cost benefits align Ohalo with evolving grower priorities. On balance, customer validation to date is credible but thin, and de-risking concentration by broadening the named base, geographies, and licensees is a central diligence priority that will unfold over several seasons rather than a single year.",
      "claimRefs": [
