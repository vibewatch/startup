    "number": 2,
    "title": "Market Analysis",
    "summary": "Ohalo sells into the global seed and plant-breeding market, where hybrid seed is ~$47.8B and gene-editing-enabled breeding is estimated at $3.8B–$27B in 2025 depending on scope. Its serviceable pool centers on potato true seed, almond nurseries, strawberry, and future corn, driven by yield, water, and pollination economics but constrained by long lead times, incumbent concentration, and a weak agrifoodtech funding climate."
  },
  "sections": [
    {
      "id": "market-boundary",
      "title": "Market Boundary and Substitutes",
      "body": "Ohalo competes in the global seed and plant-breeding market, upstream of food production. Its output is genetics and seed rather than harvested crops, so the relevant spend is seed and trait value, not grocery sales. The global hybrid seed market across all crops was estimated near $47.8 billion in 2025, while the narrower plant-breeding and CRISPR-plants segment was about $8.91 billion. Status-quo substitutes include conventional breeding, existing hybrid seed, seed tubers for potatoes, and rival gene-editing platforms; hybrid true potato seed is also being pursued by players such as Solynta, making it an emerging but contested category. Adjacent markets include crop protection and precision-agriculture inputs, which Ohalo does not directly sell but whose economics its varieties can displace by lowering pesticide, water, and pollination costs, so the practical addressable value extends beyond seed revenue into avoided grower input spend.",
