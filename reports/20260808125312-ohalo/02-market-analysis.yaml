    {
      "id": "sizing",
      "title": "Sizing: TAM, SAM, and SOM",
      "body": "Sizing Ohalo requires multiple lenses because published estimates diverge by an order of magnitude. A broad TAM lens is the global hybrid and gene-edited seed opportunity, on the order of tens of billions of dollars annually; the gene-edited seeds segment alone was estimated at about $7.14 billion in 2025 and is forecast to grow above 25 percent annually, though a genome-editing crop estimate put 2025 nearer $3.8 billion. A serviceable market lens narrows to seed and trait value in potato, almond, strawberry, and corn, where Boosted Breeding applies first; hybrid corn seed alone was about $9.8 billion in 2025 and the potato industry about $100 billion. The near-term obtainable market is small, anchored on true potato seed and FruitionOne almond nursery sales beginning in 2026-2027. No public source isolates Ohalo’s specific revenue pool, so SAM and SOM must be triangulated indirectly.",
