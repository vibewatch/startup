    {
      "id": "buyers",
      "title": "Buyers, Users, and Payers",
      "body": "Ohalo’s buyer segments include commercial potato growers, almond growers and nurseries, strawberry growers, and seed companies that own germplasm. For vegetatively propagated crops the budget owner shifts from tuber or plant multiplication toward purchasing true seed, changing the adoption path and procurement cycle. Almond growers are a distinct payer segment motivated by pollination cost and orchard economics rather than seed yield alone, which is why FruitionOne is framed around eliminating pollenizer trees. Seed multinationals occupy a dual role: they can license Ohalo’s technology as customers or develop competing platforms, so Ohalo faces a partner-or-compete dynamic. Because the top five seed companies control roughly half the hybrid-seed market, Ohalo’s route to scale depends heavily on partnerships or licensing rather than building global distribution alone. The buyer journey therefore differs by segment: potato and strawberry growers evaluate on disease and yield over one or two seasons, almond growers weigh multi-year orchard economics, and seed multinationals assess trait fit against their own germplasm portfolios before licensing.",
      "claimRefs": [
        "CM014",
        "CM015",
        "CM016",
