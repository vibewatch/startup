  topStrengths:
    - Boosted Breeding 平台差异化明显，瞄准多个大宗作物里的基础难题：固定杂种优势。
    - 创始人 David Friedberg 和投资人阵容较强，为公司带来可信度和资本支持。
    - 非转基因、基因编辑路线在美国面对的监管压力轻于转基因 GMO。
    - 商业化前已拿到 Allied Potato、University of Florida 等标杆验证伙伴。
  topRisks:
    - 固定杂种优势这一核心主张尚未在商业规模跑通，也缺少独立、同行评审的田间验证。
    - 收入前估值约 $1.7B，已经偏高；若里程碑延期，降轮风险会暴露出来。
    - 2024 年 SECURE rule 被法院推翻后，美国生物技术监管仍有波动。
    - 客户证据仍停留在合作伙伴层面，尚未披露收入、留存或试点英亩数据。
  unresolvedGaps:
    - 一手确认 $1.7B 估值和累计融资额；当前数据库口径冲突。
    - 验证固定杂种优势机制的独立田间数据。
    - 烧钱速度、现金跑道和融资计划，用来估算稀释与再融资风险。
    - 合作伙伴购买意向和试点英亩数据，用来验证商业需求。
