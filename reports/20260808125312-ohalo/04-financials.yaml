    "number": 4,
    "title": "Financials",
    "summary": "Ohalo raised a ~$165M Series B in February 2025 (~$205M total) at a reported ~$1.7B valuation, but is pre-revenue with first product income expected in 2026-2027 and no audited public financials. Its economics are R&D- and capital-heavy with multi-year biological cycles; the valuation-versus-revenue gap and a tightened funding climate are the central financial risks."
  },
  "sections": [
    {
      "id": "funding",
      "title": "Funding, Valuation, and Investors",
      "body": "Ohalo raised a $165 million Series B round announced in February 2025, bringing reported total capital to about $205 million, at a valuation trackers place near $1.7 billion. That valuation is contested: some databases imply a materially lower figure, so the $1.7 billion mark should be treated as reported rather than confirmed, and it is unclear whether the round was consistently labeled a Series B or a later-stage financing. Ohalo is closely associated with David Friedberg’s The Production Board, its founding investor and holding vehicle, which concentrates both funding support and governance influence. The company is pre-commercial, with first product revenue from potato seed and almonds expected in 2026-2027, and as a private company it discloses no audited financial statements. The size of the raise is notable for a pre-revenue plant-genetics company and signals strong investor conviction, even as the gap between a multi-billion valuation and zero current revenue implies aggressive growth expectations.",
