    {
      "id": "unit-economics",
      "title": "Unit Economics and Capital Intensity",
      "body": "Ohalo’s unit economics are dominated by heavy upfront R&D, multi-year field trials, and nursery and seed-production build-out, so revenue per program lags investment by several years and pressures near-term economics. At roughly 80 to 86 employees, annual operating burn is plausibly in the tens of millions of dollars, and with about $205 million raised and no revenue, runway depends on disciplined spending and timely commercialization. Scaling seed production and nurseries is capital-intensive and will likely require additional financing before the business is self-sustaining. Because burn and milestone data are not public, Ohalo’s capital efficiency versus peers cannot be independently assessed. A value-based pricing strategy could ultimately yield strong margins, but it is unproven at commercial volume, so the unit-economics case rests on assumptions that diligence must test against management’s internal model and cohort-level cost data.",
      "claimRefs": [
        "CI016",
        "CI017",
        "CI018",
        "CI019",
        "CI020",
        "CI032",
