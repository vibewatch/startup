    {
      "id": "revenue",
      "title": "Revenue Streams and Monetization",
      "body": "Ohalo’s planned revenue streams span true potato seed sales, almond variety royalties, strawberry licensing, and trait licensing to seed companies, with a longer-dated row-crop opportunity in corn and wheat. The Allied Potato partnership is the anchor channel for future true potato seed revenue, while FruitionOne almonds imply a royalty or nursery-based model tied to orchard plantings, and trait licensing to multinationals offers a potentially high-margin, capital-light lever. Seed and trait products can carry high gross margins once production scales, consistent with the broader seed industry, and true potato seed’s dramatic logistics savings support a value-based price to growers. However, public per-unit pricing is not yet disclosed, which limits revenue modeling, and almond and potato revenue timing hinges on biological cycles outside Ohalo’s control, adding forecast risk. Realistically, the highest-margin near-term lever is licensing, while direct seed sales scale more slowly. Diligence should therefore weight the credibility of licensing conversations with seed multinationals as heavily as the pace of direct seed production, because the two paths carry very different capital and margin profiles.",
      "claimRefs": [
        "CI008",
        "CI009",
