      ]
    },
    {
      "id": "comparables",
      "title": "Comparable Valuation",
      "body": "Comparable analysis places Ohalo against both private peers and public benchmarks. Inari Agriculture is a comparable seed-technology startup that raised large private rounds at high valuations; Benson Hill was a publicly traded crop-genetics company whose SEC filings document sector economics and illustrate how quickly ag-genetics valuations can de-rate absent commercial traction; Cibus is a public gene-editing agriculture company offering another listed comparable; and Corteva, Bayer, and Syngenta anchor incumbent multiples. Public ag-biotech comparables generally trade at far lower revenue multiples than Ohalo’s implied private multiple, and private agtech valuations broadly compressed after the 2024 funding downturn, pressuring the comparable set further. The comparables therefore do not support Ohalo’s implied valuation on any near-term financial metric; they justify it only if one accepts a platform-scale outcome that remains unproven, which is precisely the crux of the diligence.",
      "claimRefs": [
        "CV015",
        "CV016",
        "CV017",
        "CV018",
        "CV019",
        "CV020",
        "CV041"
      ],
      "tableRefs": [
        "TV004"
      ]
    },
    {
      "id": "triggers",
      "title": "Thesis-Break Triggers and KPIs",
      "body": "Investors should monitor explicit thesis-break triggers. First field data failing to confirm the heterosis-fixing mechanism is the primary trigger; a materially adverse regulatory reversal is a second; a down round or failed follow-on financing is a financial trigger; and loss of an anchor commercialization partner would materially impair the commercialization thesis. On the positive side, APHIS confirmation-of-status letters for gene-edited plants can materially de-risk the regulatory KPI by clarifying that specific products fall outside heavier regulation. Investment KPIs summarize the picture: strong market and novelty scores, weak proof and valuation scores, and a supportive but not decisive credibility score from the CEO and syndicate. The recommended monitoring plan is to define these triggers up front and revisit the recommendation as first field results, regulatory determinations, and the next financing event arrive, since each one collapses a large part of the current uncertainty.",
      "claimRefs": [
        "CV025",
        "CV026",
        "CV027",
        "CV028",
        "CV038"
      ],
      "tableRefs": [
        "TV005"
      ]
    },
    {
      "id": "diligence",
      "title": "Final Diligence Asks",
      "body": "The recommendation is actionable through a focused diligence list. The priority ask is primary cap-table and round documentation to confirm the valuation and reconcile the conflicting database figures. The second ask is independent, peer-reviewed field data validating the core trait claims, since the entire thesis turns on whether the platform works at scale. The third ask is the burn rate, runway, and financing plan to size dilution and refinancing risk over the long pre-revenue horizon. The fourth ask is partner purchase-intent and pilot-acreage data to validate commercial demand beyond named partnerships. Together these asks target the four variables that drive the valuation the most—valuation baseline, technical validation, financing, and demand—and clearing them would move Ohalo from a track-and-monitor posture toward an investable one. Until then, the evidence supports continued engagement and diligence rather than a commitment at the current price.",
      "claimRefs": [
        "CV029",
        "CV030",
        "CV031",
        "CV032"
      ],
      "tableRefs": [
        "TV006"
      ]
    }
