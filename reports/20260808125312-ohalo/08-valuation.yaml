    {
      "id": "thesis",
      "title": "Thesis and Anti-Thesis",
      "body": "The bull thesis is that Boosted Breeding is a genuine platform that can fix heterosis and reset seed economics across major crops, addressing seed and crop-protection markets worth tens of billions of dollars. The credibility of the CEO and the investor syndicate reinforce this growth-stage bet, and evolving EU rules toward new genomic techniques could expand the future addressable market. The anti-thesis is that the core scientific claim is unproven at scale while the valuation prices in near-certain success; that seed multinationals such as Corteva, Bayer, and Syngenta could replicate or leapfrog the approach and compress any advantage; and that regulatory volatility, including the 2024 SECURE-rule reversal, could delay commercialization. Adverse European commentary also highlights persistent public and political resistance to gene-edited crops. A balanced view holds both simultaneously: the upside is real and large, but the probability-weighting the current price assumes is difficult to justify on today’s evidence.",
      "claimRefs": [
        "CV006",
        "CV007",
        "CV008",
        "CV009",
        "CV010",
        "CV033",
        "CV034",
        "CV035",
        "CV037"
      ],
      "tableRefs": [
        "TV002"
      ]
    },
    {
      "id": "scenarios",
      "title": "Scenarios and Sensitivity",
      "body": "Scenario analysis frames the range of outcomes. In a bull scenario, broad multi-crop adoption could justify or exceed the current valuation over a long horizon; in a base scenario, partial validation and slower adoption imply a flat-to-modest return from the current entry price; and in a bear scenario, failure of the core trait or a down round leads to a substantial loss of value. Outcomes are highly sensitive to milestone-probability assumptions given the pre-revenue stage. Valuation is most sensitive to the probability that the heterosis-fixing trait validates commercially, and also to achievable seed pricing and gross margin, the exit multiple assumed at maturity, and dilution from future capital raises across a long runway. Because the swing between scenarios is so wide and driven by a single binary—does the platform work at scale—any point estimate of value is fragile, and the sensitivity analysis is more informative than a single headline number.",
      "claimRefs": [
        "CV011",
        "CV012",
        "CV013",
