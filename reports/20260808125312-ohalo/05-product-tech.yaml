    {
      "id": "architecture",
      "title": "Operating Architecture and Dependencies",
      "body": "Ohalo’s workflow moves from genome analysis and ML-guided design, through gene editing, to seed multiplication and field validation, with machine learning used across the pipeline to predict and select genetic modifications—now a common agtech pattern rather than a unique edge. Seed multiplication and nursery build-out are essential operating steps before commercial volumes are reached, and regulatory clearance such as USDA “Am I Regulated” determinations gates each edited product. The technology’s critical dependencies therefore include validated genetics, nursery capacity, partner distribution, and regulatory approval, and dependence on external nurseries and partners creates real execution risk. Regulatory classification as non-GMO gene editing materially shortens time-to-market versus transgenic routes, but the operating architecture still requires Ohalo to orchestrate biology, manufacturing, and partnerships in sequence, so a delay in any one dependency cascades into the overall commercial timeline and cash needs.",
      "claimRefs": [
        "CE013",
        "CE014",
        "CE015",
        "CE016",
        "CE017",
        "CE035"
      ],
      "tableRefs": [
        "TE003"
