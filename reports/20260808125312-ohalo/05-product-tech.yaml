      ]
    },
    {
      "id": "trust-maturity",
      "title": "Trust, Validation, and Maturity",
      "body": "Ohalo’s claims are largely company-stated and await independent, peer-reviewed field validation at commercial scale, with field performance, yield stability, and multi-season durability of the fixed-vigor trait being the key open technical questions. No public, independent dataset yet quantifies Ohalo’s yield uplift under commercial conditions. Products remain pre-commercial or early-commercial, with first deliveries in 2026-2027, and technology maturity varies by crop—almonds and potatoes are ahead of row crops. Competing approaches such as Solynta’s hybrid potato validate the broader technical category while differing in method, and emerging literature on new genomic techniques supports faster development of edited crops. The platform is crop-agnostic in principle, which would let Ohalo reuse the core mechanism across many species if it generalizes, but that generalization is itself an open question. Overall, the technology is scientifically credible and distinctive, yet its maturity and independent proof remain the central diligence gaps that separate a compelling scientific story from a de-risked commercial platform.",
