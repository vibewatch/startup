    {
      "id": "products",
      "title": "Product Portfolio and Use Cases",
      "body": "Ohalo’s methods let it create true seed for crops normally propagated vegetatively or requiring cross-pollination. FruitionOne is described as the world’s first self-fertile Nonpareil almond, removing the need for pollenizer trees and managed honeybee pollination; independent reporting corroborated that gene editing enabling self-pollination in almonds is feasible. Its true potato seed lets potatoes be grown from seed instead of seed tubers, delivering disease-cleaner planting material and major logistics savings. With the University of Florida, Ohalo is developing strawberries resistant to the Neopestalotiopsis fungal disease, addressing a concrete pathogen threat to Florida growers. The roadmap spans potato, almond, strawberry, and future row crops such as corn, sorghum, and wheat, and the maize patent suggests row-crop applications are under active development. Across all of these, the unifying value proposition is resource efficiency: less water, fewer inputs, and reduced pollination dependence, which aligns the portfolio with the strongest structural demand drivers in agriculture.",
      "claimRefs": [
