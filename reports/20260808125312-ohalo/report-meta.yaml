  topStrengths:
    - Distinctive Boosted Breeding platform targeting a fundamental problem (fixing heterosis) across multiple large crops.
    - Strong founder (David Friedberg) and investor syndicate lending credibility and capital.
    - Non-transgenic, gene-edited approach faces a lighter US regulatory path than transgenic GMOs.
    - Marquee validation partners (Allied Potato, University of Florida) ahead of commercialization.
  topRisks:
    - Core heterosis-fixing claim is unproven at commercial scale and lacks independent, peer-reviewed field validation.
    - ~$1.7B pre-revenue valuation is stretched and exposed to down-round risk if milestones slip.
    - US biotech regulation is volatile following the 2024 SECURE-rule court reversal.
    - Customer proof is partnership-based only, with no revenue, retention, or pilot-acreage data disclosed.
  unresolvedGaps:
    - Primary confirmation of the $1.7B valuation and total raised (databases conflict).
    - Independent field data validating the heterosis-fixing mechanism.
    - Burn rate, runway, and financing plan to size dilution and refinancing risk.
    - Partner purchase-intent and pilot-acreage data validating commercial demand.
