  productSummary: >-
    Boosted Breeding — a gene-editing and machine-learning platform that fixes
    hybrid vigor to produce higher-yielding, more resource-efficient seeds and
    plant varieties (e.g., true potato seed, self-compatible almonds, disease-
    resistant strawberries).
  customerFocus: >-
    Commercial growers (potato, almond, strawberry) reached through strategic
