companyProfile:
  summary: >-
    Ohalo is a US plant-genetics company based in Aptos, California, founded in
    2019 and led by CEO David Friedberg. Its Boosted Breeding platform uses
    gene-editing and machine learning to fix heterosis in seeds, targeting crops
    such as potato, almond, strawberry, and staple row crops with the promise of
    higher yields and lower water and input requirements. In February 2025 it
    raised a $165 million Series B at a reported ~$1.7 billion valuation. The
    company is pre-revenue, with commercial validation resting on strategic
    partnerships rather than sales.
  foundedDate: "2019-01-01"
  founders:
    - name: David Friedberg
      role: CEO
      background: Founder of The Production Board and The Climate Corporation; long-time agtech investor and operator.
      claimRefs: [CO006, CO010]
    - name: Judson Ward
      role: Co-founder / Chief Technology Officer
      background: Plant geneticist leading Ohalo's Boosted Breeding scientific platform.
