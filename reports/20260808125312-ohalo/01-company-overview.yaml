    {
      "id": "leadership-and-governance",
      "title": "Leadership, Founders, and Key-Person Risk",
      "body": "Ohalo’s leadership pairs a high-profile founder-investor with deep operating talent. David Friedberg is Chief Executive Officer, joining full-time in late 2023; he previously founded The Climate Corporation (sold to Monsanto for about $1.1 billion in 2013), co-hosts the All-In Podcast, studied astrophysics at UC Berkeley, and was an early Google employee. Co-founder and Chief Technology Officer Dr. Judson (Jud) Ward is a molecular biologist who previously worked on Driscoll’s strawberry breeding and anchors the company’s science. In 2025 Ohalo recruited Justin Wolfe, former President of Global Seeds at Syngenta with two decades at Monsanto, as President and Chief Operating Officer to lead commercialization. The combination is strong but concentrates key-person dependence on Friedberg for capital and Ward for core technology, a governance consideration for diligence.",
      "claimRefs": [
