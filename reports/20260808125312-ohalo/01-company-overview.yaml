    {
      "id": "funding-and-valuation",
      "title": "Funding, Valuation, and Stakeholders",
      "body": "Ohalo’s most recent financing of $165 million closed on 24 February 2025, and independent trackers report a valuation of approximately $1.7 billion with total capital raised near $205 million. These figures should be read with caution: the round label is reported inconsistently (Series B versus later-stage VC), and some private-market databases estimate a materially lower valuation, creating a genuine valuation-source conflict. As of May 2024 the CEO characterized total funding as “a little over $100 million” from undisclosed investors, so the disclosed cap table remains thin. The Production Board is the founding investor and Friedberg’s vehicle. Critically, revenue and run-rate figures are not publicly disclosed, and first commercial almond deliveries are not expected until 2027, so the valuation is best understood as pre-commercial and story-driven rather than earnings-backed.",
