    {
      "id": "milestones-and-products",
      "title": "Milestones, Products, and Trajectory",
      "body": "Ohalo’s public trajectory is short but dense. It announced the discovery of Boosted Breeding in May 2024, followed by FruitionOne, the world’s first self-fertile Nonpareil almond, in October 2024; Ohalo says it completed the USDA Regulatory Status Review for FruitionOne, with early orders in late 2026 and first commercial deliveries in 2027. It launched a strawberry consortium with the University of Florida targeting the fungal disease Neopestalotiopsis, and announced a strategic partnership with Allied Potato to commercialize next-generation potatoes and true potato seed. The company has filed patents on polyploid hybrid breeding, including a Polyploid Hybrid Potato Breeding application, and reports early-trial yield gains of 50 to 100 percent or more. Its stated initial commercial priority is delivering the world’s first true potato seed globally.",
