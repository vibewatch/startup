  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Ohalo Genetics is a 2019-founded, Aptos, California plant-genetics company that emerged from stealth in May 2024 with Boosted Breeding, a whole-genome inheritance platform. Led by CEO David Friedberg and CTO Jud Ward, it reported a $165M February 2025 round at a ~$1.7B valuation despite a pre-commercial revenue stage."
  },
  "sections": [
    {
      "id": "identity-and-model",
      "title": "Identity, Model, and Origins",
      "body": "Ohalo Genetics, Inc. is a US agricultural-technology and plant-genetics company headquartered in Aptos, California, though some databases list a South San Francisco address. Founded in 2019 by entrepreneur David Friedberg and his venture foundry The Production Board, Ohalo spent roughly five years in stealth before unveiling its core technology, Boosted Breeding, in May 2024. The company describes its mission as developing novel breeding systems and improved plant varieties so farmers can grow more food with fewer natural resources. Its business model is deliberately flexible: partnering with owners of germplasm, licensing technology, and, for select crops such as potato, directly breeding and producing seed. Ohalo’s branded lines include Boosted Breeding, FruitionOne, and true seed, and its early commercial crops are potato, almond, and strawberry.",
