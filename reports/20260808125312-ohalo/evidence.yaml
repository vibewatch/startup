evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: investors
    missingEvidence: Full cap table and lead investor identities for the $165M round.
    whyItMatters: Investor quality and terms materially affect governance and future financing risk.
    diligencePath: Request the cap table and round documents from the company or a data room.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: leadership completeness (TO002)
    missingEvidence: Full board composition and any additional executives beyond the three named leaders.
    whyItMatters: Board and executive depth affect governance and execution capacity.
    diligencePath: Obtain the org chart and board roster from the company.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: Reconciliation between the ~$1.7B tracker valuation and lower database estimates.
    whyItMatters: A large valuation discrepancy changes the entry-price analysis.
    diligencePath: Obtain the priced-round term sheet to confirm post-money valuation.
    relatedQuestionRefs:
      - QO028
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: An authoritative, current employee count.
    whyItMatters: Headcount informs burn and execution capacity.
    diligencePath: Confirm headcount via company HR or LinkedIn workforce data.
    relatedQuestionRefs:
      - QO005
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: A reconciled, scope-consistent market size for gene-editing agriculture.
    whyItMatters: Order-of-magnitude divergence undermines any TAM-based valuation.
    diligencePath: Commission or obtain a bottom-up seed-market model by crop.
    relatedQuestionRefs:
      - QM004
      - QM020
  - type: private-evidence-only
    severity: material
    topic: sam
    missingEvidence: Ohalo’s internal SAM/SOM projections by crop and geography.
    whyItMatters: Public proxies cannot isolate Ohalo’s serviceable revenue.
    diligencePath: Request management’s market model and pipeline revenue plan.
    relatedQuestionRefs:
      - QM022
      - QM026
  - type: missing-source
    severity: minor
    topic: row-crop expansion
    missingEvidence: Evidence of committed corn or wheat programs at commercial stage.
    whyItMatters: Future SAM expansion is a major part of the bull case.
    diligencePath: Verify row-crop trial status and partner commitments.
    relatedQuestionRefs:
      - QM022
  - type: missing-source
    severity: material
    topic: competitive benchmarking
    missingEvidence: Independent head-to-head field-trial data comparing Ohalo’s varieties to rivals’.
    whyItMatters: Ohalo’s edge rests on unvalidated performance claims.
    diligencePath: Seek third-party trial data or replicated agronomy results.
