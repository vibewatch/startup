      - number: '2.4'
        title: Drivers, Constraints, and Sizing Gaps
        blocks:
          - type: paragraph
            body: >-
              Structural demand drivers are strong: a global population above 9.7 billion by 2050, water scarcity and
              rising input costs, and acute pain points such as roughly $364 million in 2025 California almond
              pollination costs and the up-to-99 percent logistics savings of true potato seed. Gene-edited seed is
              forecast to grow far faster than conventional seed. Constraints are equally real: long perennial-crop lead
              times delay revenue, grower conservatism slows adoption, agrifoodtech venture funding has contracted
              sharply since 2022, and US-EU regulatory divergence adds cost and timing uncertainty. Sizing gaps compound
              the picture, because market estimates for gene-editing agriculture differ by an order of magnitude and no
              source isolates Ohalo’s serviceable pool, so directional claims like true potato seed “upending” a $100
              billion industry must be treated as unquantified. On balance the demand backdrop favors resource-efficient
              genetics, but the pace of monetization will be set by field validation, grower trust, and Ohalo’s ability
              to fund seed production through a lean capital cycle.
