  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Ohalo competes in the global seed and plant-breeding market, upstream of food production. Its output is
              genetics and seed rather than harvested crops, so the relevant spend is seed and trait value, not grocery
              sales. The global hybrid seed market across all crops was estimated near $47.8 billion in 2025, while the
              narrower plant-breeding and CRISPR-plants segment was about $8.91 billion. Status-quo substitutes include
              conventional breeding, existing hybrid seed, seed tubers for potatoes, and rival gene-editing platforms;
              hybrid true potato seed is also being pursued by players such as Solynta, making it an emerging but
              contested category. Adjacent markets include crop protection and precision-agriculture inputs, which Ohalo
              does not directly sell but whose economics its varieties can displace by lowering pesticide, water, and
              pollination costs, so the practical addressable value extends beyond seed revenue into avoided grower
              input spend.
            claimRefs:
