      - number: '7.2'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              US regulation of gene-edited plants without foreign DNA is generally lighter than for transgenic GMOs,
              which aids Ohalo’s timeline, but the environment is unsettled. A 2024 federal court ruling vacated parts
              of USDA APHIS’s SECURE rule, injecting regulatory uncertainty, and APHIS subsequently moved to reinstate
              legacy biotechnology regulations, changing compliance expectations. Gene-edited plant regulation remains
              an active issue for Congress, signaling potential statutory change, though some biotechnology product
              reviews have gotten faster despite the churn, a partial offset. International market access adds
              complexity because the EU and other jurisdictions apply divergent gene-editing rules. Beyond process
              regulation, IP freedom-to-operate and patent disputes are common in plant biotech and could constrain
              Ohalo, and litigation and enforcement exposure rises as products approach market and attract activist and
              competitor scrutiny. Regulatory and legal risk is therefore both a timeline risk and a potential
              cost-and-credibility risk.
