      - number: '7.6'
        title: Mitigations, Monitoring and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Several mitigations exist. The non-transgenic approach reduces the regulatory approval burden, and
              diversifying across crops—potato, almond, strawberry, and row crops—spreads technical and market risk. But
              mitigations do not eliminate the core uncertainties, so investors should track explicit kill-criteria. A
              monitorable thesis-break trigger is failure of first field data to confirm the heterosis-fixing claim;
              loss of an anchor partner or a materially adverse regulatory reversal is another; and a down round or
              inability to raise follow-on capital at milestones is a financial kill-criterion. On balance, Ohalo’s
              risks are concentrated in unproven scale-up, regulatory volatility, and a rich valuation, and the
              recommended posture is to define these triggers up front, monitor first field results and regulatory
              decisions closely, and size any position to the possibility that the platform does not validate on the
              current timeline.
            claimRefs:
              - CR036
              - CR037
              - CR038
              - CR039
              - CR040
              - CR041
          - type: table
            tableRef: TR005
            claimRefs:
              - CR038
              - CR039
              - CR040
              - CR036
      - number: '7.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory environment is unsettled
            body: >-
              A 2024 court ruling vacated parts of the SECURE rule and APHIS is reinstating legacy regs, adding timeline
              and compliance uncertainty.
            calloutType: risk
            claimRefs:
              - CR007
              - CR008
          - type: callout
            title: Rich valuation, pre-revenue
            body: A ~$1.7B valuation with no commercial revenue concentrates down-round risk if milestones slip.
            calloutType: risk
            claimRefs:
              - CR002
              - CR030
          - type: callout
            title: Unproven at commercial scale
            body: >-
              Seed production, field reliability, and the heterosis-fixing claim itself are not yet independently
              validated at scale.
            calloutType: risk
            claimRefs:
              - CR014
              - CR005
          - type: callout
            title: Define kill-criteria up front
            body: >-
              Track first field data, anchor-partner status, regulatory decisions, and follow-on financing as explicit
              thesis-break triggers.
            calloutType: recommendation
