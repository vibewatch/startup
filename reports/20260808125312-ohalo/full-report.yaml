  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Model, and Origins
        blocks:
          - type: paragraph
            body: >-
              Ohalo Genetics, Inc. is a US agricultural-technology and plant-genetics company headquartered in Aptos,
              California, though some databases list a South San Francisco address. Founded in 2019 by entrepreneur
              David Friedberg and his venture foundry The Production Board, Ohalo spent roughly five years in stealth
              before unveiling its core technology, Boosted Breeding, in May 2024. The company describes its mission as
              developing novel breeding systems and improved plant varieties so farmers can grow more food with fewer
              natural resources. Its business model is deliberately flexible: partnering with owners of germplasm,
              licensing technology, and, for select crops such as potato, directly breeding and producing seed. Ohalo’s
              branded lines include Boosted Breeding, FruitionOne, and true seed, and its early commercial crops are
              potato, almond, and strawberry.
