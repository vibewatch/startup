  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Core Technology: Fixing Heterosis'
        blocks:
          - type: paragraph
            body: >-
              Ohalo’s core technology, Boosted Breeding, aims to fix heterosis—the hybrid vigor that conventionally
              cannot be stably inherited through normal sexual reproduction—so its benefits persist in seed rather than
              being lost after one generation. The biological outcome it seeks to emulate is apomixis, asexual
              reproduction through seed that produces clones of the parent; published synthetic-apomixis research has
              demonstrated clonal seed in crops such as rice, validating the scientific direction. Ohalo combines plant
              genetics with machine learning to accelerate identification of the genetic changes that fix vigor, and a
              published patent on polyploid hybrid maize breeding evidences relevant IP activity. Because gene-edited
              crops containing no foreign DNA are regulated more lightly than transgenic GMOs in the US, the approach
              can reach market faster than transgenic routes. The scientific plausibility rests on decades of
              hybrid-vigor and apomixis research, but the specific heterosis-fixing claim still awaits independent,
              peer-reviewed field validation, so the technology should be read as promising and well-founded rather than
              proven at commercial scale.
            claimRefs:
              - CE001
