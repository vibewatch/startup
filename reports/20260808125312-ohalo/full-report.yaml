              Seed production, multiplication, and quality control at commercial scale are unproven for Ohalo’s
              pipeline, and field performance variability across geographies and seasons is a core reliability risk.
              Perennial crop timelines, especially almonds, mean operational errors surface slowly and are expensive to
              correct, while disease-resistance claims such as the strawberry program require durable resistance that
              pathogens may overcome over time. Because Ohalo’s edge is a proprietary genetics-plus-machine-learning
