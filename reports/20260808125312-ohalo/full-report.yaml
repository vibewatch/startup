              an operational continuity risk for a small team. None of these failure modes is currently backed by public
              evidence of commercial-scale validation, so operational risk should be read as largely unretired.
              Diligence should seek scale-up plans, quality systems, trial-reliability data, and evidence of resistance
              durability before treating operational execution as de-risked.
