      - number: '3.2'
        title: Capability and Readiness Comparison
        blocks:
          - type: paragraph
            body: >-
              On capability, most rivals edit one or a few genes to install a trait, whereas Ohalo claims to manipulate
              whole-genome heterosis to fix hybrid vigor directly in seed, an approach it says uniquely serves
              vegetatively propagated and perennial crops such as potato, almond, and strawberry where hybrid seed did
              not previously exist. Machine learning is central to Ohalo’s pipeline, but it is now table stakes across
              the sector and no longer a sole differentiator. Incumbents Bayer, Corteva, and Syngenta run their own
              editing programs and control global distribution, while Ohalo remains pre-commercial with first
              potato-seed and almond deliveries expected in 2026-2027, later than some rivals already selling edited
              traits. Ohalo’s roughly 80-person team is small relative to public competitors, constraining how many
              programs it can advance in parallel. If its heterosis-fixing claim validates at scale, single-trait
              editors would struggle to match it quickly.
