  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Overview and Severity Ranking
        blocks:
          - type: paragraph
            body: >-
              Ohalo’s single largest risk is execution: it must convert an unproven-at-scale breeding platform into
              demonstrated commercial crop performance across multiple species. Layered on top are a rich ~$1.7 billion
              valuation on a pre-revenue company, which creates valuation and down-round risk if milestones slip;
              concentration in a small leadership team and key scientific founders; a shifting US biotech-regulation
              environment that has recently seen legal challenges and rule reversals; and inherent biological risk,
              because heterosis-fixing and true-seed traits must hold across generations and environments. Ranked by
              residual severity, regulatory volatility and scale-up execution sit at the top, followed by valuation and
              financing risk, then partner concentration and people risk. Each is only partially mitigated today, so the
              chapter treats them as live diligence items rather than closed questions, and the severity ordering should
              be revisited as first field data and regulatory decisions arrive.
