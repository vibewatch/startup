      - number: '2.4'
        title: 驱动因素、约束与规模缺口
        blocks:
          - type: paragraph
            body: >-
              结构性需求驱动很强：2050 前全球人口超过 9.7 billion，水资源短缺和投入成本上升，以及 2025 California 杏仁授粉成本 约 $364 million、实生马铃薯种子最高 99
              percent 的物流节省等尖锐痛点。基因编辑种子的预测增速远快于传统种子。约束同样真实：多年生作物交付周期长，收入被推迟；种植者保守，采用变慢；农业食品科技 风投自 2022
              以来急剧收缩；美国和欧盟监管分歧增加成本和时间不确定性。规模缺口进一步放大问题，因为基因编辑农业的市场估计相差一个数量级，没有来源隔离 Ohalo 的可服务池，所以实生马铃薯种子「颠覆」$100 billion
              产业这样的方向性表述必须视为尚未量化。总体看，需求背景有利于资源效率更高的遗传技术，但变现速度取决于田间验证、种植者信任，以及 Ohalo 在精瘦资本周期里为种子生产融资的能力。
