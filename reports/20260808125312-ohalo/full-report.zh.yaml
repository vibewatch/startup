            calloutType: risk
            claimRefs:
              - CV019
              - CV041
          - type: callout
            title: 一个二元问题决定全局
            body: 固定杂种优势平台能否在规模上跑通，会让估值在很宽区间内摆动。
            calloutType: insight
            claimRefs:
              - CV014
              - CV021
          - type: callout
            title: 四项尽调要求要厘清
            body: 股权结构表、独立田间数据、现金消耗率 / 现金续航期和伙伴购买意向，会推动 Ohalo 接近可投资状态。
            calloutType: recommendation
            claimRefs:
              - CV029
              - CV030
