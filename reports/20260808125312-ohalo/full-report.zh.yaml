  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Ohalo 竞争的是全球种子和植物育种市场，位于食品生产上游。它产出遗传性状和种子，而不是收获作物，因此相关支出是种子和性状价值，不是杂货零售额。全球所有作物的杂交种子市场在 2025 估计接近 $47.8
              billion，较窄的植物育种与 CRISPR 植物细分约为 $8.91 billion。现状替代方案包括传统育种、既有杂交种子、马铃薯种薯和竞争性的基因编辑平台；Solynta
              等玩家也在推进杂交实生马铃薯种子，使这一类别新兴但竞争未定。相邻市场包括作物保护和精准农业投入品，Ohalo
              不直接销售这些产品，但其品种可通过降低农药、用水和授粉成本替代其经济性，因此实际可触达价值超出种子收入，进入种植者可节省的投入支出。
