              Ohalo；依赖种子跨国公司合作也同时带来入口和伙伴转竞争者风险。Cibus 的上市身份和 Inari 的深厚融资让对手拥有私营 Ohalo 没有的资本市场入口，而 Benson Hill 的 SPAC
