  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与估值立场
        blocks:
          - type: paragraph
            body: >-
              建议对 Ohalo 继续跟踪并深入尽调，而不是按当前估值投资。Ohalo 于 2025 年 2 月完成 $165 million B 轮融资，据报估值约 $1.7
              billion；公司尚无收入，技术也未在商业规模验证，这一价格偏紧。更麻烦的是，一些数据库给出的总额差异很大，连核心估值也有不确定性，需要用一手文件核实。整体风险评级为高，反映风险章节列出的执行、监管和估值风险。经济性尚未验证，任何
              DCF 都高度依赖假设且带有投机性；投资 KPI 显示，Ohalo 在市场规模和技术新颖性上强，在证据和估值上弱。因此，结论不是 Ohalo 公司差，而是当前价格需要更多证据支撑，公开信息还不够。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV036
              - CV039
              - CV040
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV005
              - CV001
              - CV039
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV033
              - CV006
              - CV008
              - CV003
              - CV005
      - number: '8.2'
        title: 正反投资假设
        blocks:
          - type: paragraph
            body: >-
              看多逻辑是：Boosted Breeding 是真实平台，能固定杂种优势，并重塑主要作物的种子经济性，切入规模达数百亿美元的种子和作物保护市场。CEO
              和投资人团的可信度强化了这笔成长阶段押注；欧盟对新基因组技术的规则演进，未来也可能扩大可触达市场。反向逻辑是：核心科学主张尚未在规模上验证，但估值已按接近确定成功定价；Corteva、Bayer、Syngenta
              等种子跨国公司可能复制或超越 Ohalo 路线，压缩任何优势；包括 2024 年 SECURE
              规则反转在内的监管波动也可能推迟商业化。欧洲负面评论还显示，公众和政治层面对基因编辑作物的抵触仍会持续。平衡判断需要同时承认两点：上行空间真实且巨大，但按今天证据看，当前价格隐含的成功概率权重很难自洽。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV033
              - CV034
              - CV035
              - CV037
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
      - number: '8.3'
        title: 情景与敏感性
        blocks:
          - type: paragraph
            body: >-
              情景分析框定结果区间。看多情景下，多作物广泛采用可能在长期支撑甚至超过当前估值；基准情景下，部分验证和较慢采用意味着从当前入场价只能获得持平到小幅回报；看空情景下，核心性状失败或下轮估值下调会造成大幅价值损失。公司仍处收入前阶段，结果对里程碑概率假设高度敏感。估值最敏感的是固定杂种优势性状能否通过商业验证，其次是可实现的种子定价和毛利率、成熟期退出倍数，以及漫长资金周期中未来融资带来的稀释。情景跨度很大，又由一个二元问题驱动——平台能否在规模上跑通——任何单点估值都很脆弱，敏感性分析比单一核心数字更有信息量。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV021
              - CV022
              - CV023
              - CV024
