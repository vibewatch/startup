      - number: '8.4'
        title: 可比估值
        blocks:
          - type: paragraph
            body: >-
              可比分析把 Ohalo 放在私营同业和公开市场标杆中比较。Inari Agriculture 是可比的种子技术初创公司，曾以高估值完成大额私募融资；Benson Hill 曾是上市作物基因公司，其 SEC
              文件记录了行业经济性，也显示农业基因估值在缺乏商业牵引时下修得多快；Cibus 是另一家上市基因编辑农业公司；Corteva、Bayer、Syngenta 则锚定现有龙头倍数。上市农业生物技术可比公司通常以远低于
              Ohalo 隐含私募倍数的收入倍数交易；2024 年融资下行后，私营农业科技估值普遍压缩，可比组压力更大。因此，从任何近期财务指标看，可比公司都不支撑 Ohalo
              的隐含估值；只有接受一个尚未验证的平台级结果，这一估值才说得通，而这正是尽调核心。
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV041
          - type: table
            tableRef: TV004
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV018
      - number: '8.5'
        title: 投资假设破裂触发器与 KPI
        blocks:
          - type: paragraph
            body: >-
              投资人应跟踪明确的投资假设破裂触发器。首批田间数据若不能证实固定杂种优势机制，就是首要触发器；重大不利监管反转是第二个；下轮估值下调或后续融资失败是财务触发器；若失去核心商业化伙伴，商业化假设也会受到实质损害。正向看，针对基因编辑植物的
              APHIS 状态确认函可以明确特定产品不落入更重监管，从而显著降低监管 KPI 风险。投资 KPI 汇总了图景：市场和新颖性得分强，证据和估值得分弱，CEO
              与投资人团带来的可信度有支撑但不是决定性。建议监控方案是预先定义这些触发器，并在首批田间结果、监管认定和下一轮融资事件落地时重新审视建议，因为每一项都会压缩当前不确定性的很大一部分。
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV038
          - type: table
            tableRef: TV005
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
      - number: '8.6'
        title: 最终尽调清单
        blocks:
          - type: paragraph
            body: >-
              建议可以转化为一份聚焦的尽调清单。首要要求是取得一手股权结构表和轮次文件，核实估值并对齐数据库之间冲突的数据。第二是独立、同行评审的田间数据，用来验证核心性状主张，因为整套投资假设取决于平台能否在规模上跑通。第三是现金消耗率、现金续航期和融资计划，用来衡量漫长收入前阶段的稀释和再融资风险。第四是伙伴购买意向和试点种植面积数据，用来验证署名合作之外的商业需求。合起来，这些要求瞄准最能驱动估值的四个变量——估值基准、技术验证、融资和需求；逐项厘清后，Ohalo
              才会从跟踪观察接近可投资。在此之前，证据支持继续接触和尽调，而不是按当前价格承诺投资。
            claimRefs:
              - CV029
              - CV030
              - CV031
              - CV032
          - type: table
            tableRef: TV006
            claimRefs:
              - CV029
              - CV030
              - CV031
              - CV032
      - number: '8.7'
        title: 图表
        blocks:
          - type: callout
            title: 继续跟踪尽调，暂不投资
            body: ~$1.7B 的收入前估值，需要独立证据和一手文件之后才能承诺投资。
