            body: >-
              测算 Ohalo 需要多重镜头，因为公开估计相差一个数量级。广义 TAM 镜头是全球杂交和基因编辑种子机会，年规模在数百亿美元量级；仅基因编辑种子 细分在 2025 估计约 $7.14
              billion，预计年增速高于 25 percent，不过另一项基因组编辑作物估计把 2025 放在更接近 $3.8 billion。可服务市场镜头收窄到马铃薯、杏仁、草莓和玉米中的种子与性状价值，这些是
              Boosted Breeding 最先落地的作物；仅杂交玉米种子在 2025 约 $9.8 billion，马铃薯产业约 $100 billion。短期可获取市场很小，锚定 2026-2027
              开始的实生马铃薯种子和 FruitionOne 杏仁苗圃销售。没有公开来源隔离 Ohalo 的特定收入池，因此 SAM 和 SOM 必须间接三角测算。
