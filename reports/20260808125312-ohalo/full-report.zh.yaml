  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心技术：固定杂种优势
        blocks:
          - type: paragraph
            body: >-
              Ohalo 的核心技术 Boosted Breeding 旨在把杂种优势固定下来。传统育种中，这种优势无法通过正常有性繁殖稳定遗传；Ohalo
              要让收益留在种子里，而不是一代后消失。它试图模拟的生物结果是无融合生殖，即通过种子进行无性繁殖，产生亲本克隆；已发表的合成无融合生殖研究已在水稻等作物中证明克隆种子，验证了科学方向。Ohalo
              把植物遗传学与机器学习结合，加速识别可固定活力的遗传变化；已公开的多倍体杂交玉米育种专利也显示相关 IP 活动。由于不含外源 DNA 的基因编辑作物在美国监管轻于转基因
              GMO，这一路线比转基因路线更快进入市场。科学可信度来自数十年的杂种优势和无融合生殖研究，但具体的固定杂种优势主张仍等待独立、同行评审的田间验证，因此应将该技术理解为有前景且有扎实基础，而不是已在商业规模上被证明。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE007
