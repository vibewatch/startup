              对 Ohalo
              管线而言，商业规模下的种子生产、扩繁和质量控制尚未证明；跨地域和跨季节的田间表现波动，是核心可靠性风险。多年生作物时间线，尤其是杏仁，意味着运营错误暴露很慢且修正成本高；草莓项目等抗病主张也需要持久抗性，因为病原体可能随时间突破。Ohalo
              的边界在于专有遗传学加机器学习管线，因此数据和平台安全重要；对小团队来说，专门植物基因组人才留存也是运营连续性风险。这些失效模式目前都缺少商业规模验证的公开证据，因此运营风险应被视为大体尚未释放。尽调在把运营执行视为已降风险前，应索取扩张计划、质量体系、试验可靠性数据和抗性持久性的证据。
