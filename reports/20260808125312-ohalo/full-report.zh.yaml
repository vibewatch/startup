              Ohalo 的主张大多来自公司表述，仍等待商业规模下独立、同行评审的田间验证；固定杂种优势性状的田间表现、产量稳定性和多季耐久性，是核心开放技术问题。尚无公开独立数据集量化 Ohalo
              在商业条件下的产量提升。产品仍处商业化前或早期商业化，首批交付在 2026-2027；技术成熟度因作物而异，杏仁和马铃薯领先于大田作物。Solynta
              的杂交马铃薯等竞争路径验证了更广泛技术类别，但方法不同；关于新基因组技术的新兴文献也支持编辑作物更快开发。原则上平台不限定作物，如果机制可泛化，Ohalo
