  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与严重性排序
        blocks:
          - type: paragraph
            body: >-
              Ohalo 最大的单一风险是执行：它必须把一个尚未在规模上证明的育种平台，转化为跨多个物种已展示的商业作物表现。叠加其上的是一家收入前公司约 $1.7 billion
              的高估值，如果里程碑滑坡，会带来估值和下轮降价风险；小型领导团队和关键科学创始人的集中；美国生物技术监管环境变化，近期已出现法律挑战和规则反转；以及固有生物风险，因为固定杂种优势和实生种子性状必须跨世代、跨环境保持。按剩余严重性排序，监管波动和规模化执行位居最高，其次是估值与融资风险，再之后是伙伴集中和人员风险。当前每项风险只得到部分缓释，因此本章把它们视为仍在发生的尽调事项，而不是已关闭问题；随着首批田间数据和监管决定到来，严重性排序应重新审视。
