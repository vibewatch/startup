              瞄准的杏仁种植者和苗圃、通过 University of Florida 联盟参与的佛罗里达草莓种植者，以及可能成为许可客户也可能成为竞争者的种子跨国公司。杏仁种植者的动机是取消授粉树和授粉成本，草莓种植者则面对
              Neopestalotiopsis 带来的紧迫且可量化病害威胁。Ohalo 聘请前 Syngenta 高管 Justin Wolfe
