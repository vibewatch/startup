companyProfile:
  summary: >-
    Ohalo 是一家美国植物遗传学公司，总部位于加州 Aptos，成立于 2019，由 CEO David Friedberg 领导。其 Boosted Breeding
    平台用基因编辑和机器学习把种子里的杂种优势固定下来，瞄准马铃薯、杏仁、草莓和大田主粮作物，承诺提高产量、降低用水和投入需求。February 2025，公司以据报 ~$1.7 billion 估值完成 $165 million
    Series B 融资。公司尚未产生收入，商业验证主要靠战略合作，而不是销售。
