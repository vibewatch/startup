            body: >-
              从能力看，多数对手编辑一个或少数几个基因来装入某个性状；Ohalo
              则声称操控全基因组杂种优势，直接把杂种优势固定在种子里。它称这种方法独特适用于马铃薯、杏仁、草莓等无性繁殖和多年生作物，因为这些作物此前不存在杂交种子。机器学习是 Ohalo
              管线的核心，但如今已是整个赛道的标配，不再是唯一差异点。Bayer、Corteva 和 Syngenta 等既有巨头拥有自己的编辑项目，并控制全球分销；Ohalo 仍处于商业化前，首批马铃薯种子和杏仁交付预计在
