              确实存在若干缓释。非转基因路径降低监管审批负担；跨马铃薯、杏仁、草莓和大田作物多元化，可分散技术和市场风险。但缓释无法消除核心不确定性，因此投资人应追踪明确的否决标准。可监控的投资命题失效
              触发点，是首批田间数据未能确认固定杂种优势主张；失去锚定伙伴或出现实质不利监管反转，是另一类触发点；在里程碑节点发生降价轮 或无法完成后续融资，则是财务否决标准。总体看，Ohalo
