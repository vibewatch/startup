    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、模式与起源
        blocks:
          - type: paragraph
            body: >-
              Ohalo Genetics, Inc. 是一家美国农业科技和植物遗传学公司，总部位于加州 Aptos，但部分数据库列出 South San Francisco 地址。公司由创业者 David Friedberg
              及其创业平台 The Production Board 于 2019 创立，随后大约五年处于隐身状态，直到 May 2024 发布核心技术 Boosted Breeding。Ohalo
              将使命表述为开发新型育种系统和改良植物品种，让农民用更少自然资源生产更多食物。它的商业模式有意保持弹性：与种质所有者合作、技术许可，并在马铃薯等选定作物上直接育种和生产种子。Ohalo 的品牌线包括
              Boosted Breeding、FruitionOne 和 true seed，早期商业作物是马铃薯、杏仁和草莓。
