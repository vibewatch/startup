      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              美国对不含外源 DNA 的基因编辑植物监管通常轻于转基因 GMO，这有利于 Ohalo 时间线，但环境并不稳定。2024 的联邦法院裁决撤销 USDA APHIS SECURE
              规则部分内容，注入监管不确定性；APHIS 随后转向恢复旧版生物技术监管，改变合规预期。基因编辑植物监管仍是 Congress
              的活跃议题，意味着潜在立法变化；不过，部分生物技术产品审查在波动中反而变快，形成部分抵消。国际市场准入增加复杂性，因为欧盟和其他司法辖区采用不同的基因编辑规则。除流程监管外，IP
              自由实施和专利纠纷在植物生物技术中很常见，可能约束 Ohalo；产品接近市场并吸引活动人士与竞争者审视时，诉讼和执法暴露也会上升。因此，监管和法律风险既是时间线风险，也是潜在成本与可信度风险。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR035
