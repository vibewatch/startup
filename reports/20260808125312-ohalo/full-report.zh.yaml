      - number: '2.3'
        title: 买方、用户与付费方
        blocks:
          - type: paragraph
            body: >-
              Ohalo
              的买方细分包括商业马铃薯种植者、杏仁种植者和苗圃、草莓种植者，以及拥有种质的种子公司。对无性繁殖作物，预算负责人从种薯或植株繁殖转向购买实生种子，采用路径和采购周期随之改变。杏仁种植者是独立付费人群，动机来自授粉成本和果园经济性，而不只是种子产量，这解释了
              FruitionOne 为何围绕取消授粉树来叙事。种子跨国公司扮演双重角色：它们可以作为客户许可 Ohalo 技术，也可以开发竞争平台，因此 Ohalo
              面临合作或竞争的动态。由于前五大种子公司控制约一半的杂交种子市场，Ohalo
              扩张高度依赖合作或许可，而不是单独搭建全球分销。买方旅程按细分不同：马铃薯和草莓种植者用一到两个季节评估病害和产量，杏仁种植者权衡多年果园经济，种子跨国公司在许可前评估性状与自身种质组合的匹配。
