            body: >-
              Ohalo 的方法让它能为通常靠无性繁殖或需要异花授粉的作物创造实生种子。FruitionOne 被描述为全球首个自交亲和 Nonpareil
              杏仁，取消授粉树和管理蜂授粉需求；独立报道也佐证，基因编辑让杏仁自花授粉可行。其实生马铃薯种子让马铃薯可由种子而不是种薯种植，提供病害更少的种植材料，并带来重大的物流节省。Ohalo 与 University
              of Florida 正在开发抗 Neopestalotiopsis
              真菌病的草莓，回应佛罗里达种植者面临的具体病原威胁。路线图覆盖马铃薯、杏仁、草莓，以及玉米、高粱、小麦等未来大田作物；玉米专利表明大田作物应用正在积极开发。贯穿所有用例的统一价值主张是资源效率：更少用水、更少投入、更低授粉依赖，这让组合与农业最强的结构性需求驱动保持一致。
