  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与直接对手
        blocks:
          - type: paragraph
            body: >-
              Ohalo 身处拥挤的植物基因编辑和先进育种赛道，竞争者横跨平台公司、直接作物对手和既有巨头。平台同业包括 Inari，它把 AI 与多重基因编辑用于玉米和大豆，并作为农业科技独角兽完成 $144 million
              融资；Cibus 是上市精准编辑公司，瞄准油菜和水稻的抗病性与除草剂耐受性；Pairwise 是面向消费农产品的 CRISPR 公司，报告 72% 编辑成功率，并与大型农业公司合作；Tropic
              Biosciences 聚焦香蕉和水稻。直接看，Solynta 在 Ohalo 瞄准的同一条种薯到种子的转换线上推进杂交实生马铃薯种子，至少另外两家公司也宣布了基因编辑自花授粉 Nonpareil 杏仁，对
              FruitionOne 形成早期压力。Pivot Bio 是相邻竞争者，它提供微生物固氮而不是遗传技术。因此，竞争集合同时覆盖直接、平台和相邻对手，每一类都压到 Ohalo 投资命题的不同部分。
