              billion。该估值存在争议：部分数据库暗示数值明显更低，因此 $1.7 billion 应视为据报而非已确认，而且该轮到底是否一致标为 Series B 还是后期融资也不清楚。Ohalo 与 David
              Friedberg 的 The Production Board 关系密切，后者既是创始投资者，也是持股平台，因此融资支持和治理影响都高度集中。公司尚未产生收入，马铃薯种子和杏仁的首批产品收入预计在
              2026-2027，且作为私营公司未披露经审计财报。对一家收入前植物遗传学公司而言，这轮融资规模显著，体现了投资人强信念；但多十亿美元估值与当前零收入之间的缺口，也意味着增长预期激进。
