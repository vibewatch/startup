  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: unit-economics-gaps
      missingEvidence: Realized issuance and redemption take rates, direct-versus-exchange customer mix, CAC, payback, and retention by major counterparty cohort.
      whyItMatters: Without these metrics, there is no defensible public view on GTM efficiency or whether reserve growth depends on concentrated counterparties.
      diligencePath: Request cohort reporting for direct customers, exchange-partner volumes, fee-waiver schedules, and management's internal payback analysis.
      relatedQuestionRefs: [QI005]
    - type: private-evidence-only
      severity: blocking
      topic: corporate-liquidity
      missingEvidence: Parent-company cash, debt facilities, legal reserves, monthly burn, and a 12-month liquidity and redemption-stress plan.
      whyItMatters: Reserve adequacy for tokens is not the same as unrestricted corporate liquidity available for operations, legal costs, or adjacent investments.
      diligencePath: Obtain treasury schedules, debt agreements, board materials on liquidity planning, and legal-contingency memoranda.
      relatedQuestionRefs: [QI003, QI006]
    - type: missing-source
      severity: material
      topic: independent-audit
      missingEvidence: A completed independent full audit of reserves and entity-level financial statements rather than attestations or marketing transparency pages.
      whyItMatters: Audit absence reduces confidence in reserve composition, related-party exposures, and the reliability of current profitability disclosures.
      diligencePath: Request the latest full audit, audit-scope memo, and management letters from the independent auditor.
      relatedQuestionRefs: [QI006]
    - type: private-evidence-only
      severity: material
      topic: diversification
      missingEvidence: Segment-level capital invested, revenue, opex, and return hurdles for mining, AI, and education initiatives.
      whyItMatters: Adjacent projects may consume retained earnings or change risk profile even if the core stablecoin reserve loop remains profitable.
      diligencePath: Request business-line budgets, capex approvals, and internal hurdle-rate assumptions for non-stablecoin investments.
      relatedQuestionRefs: [QI007]
