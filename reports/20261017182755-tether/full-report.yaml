      - number: '4.3'
        title: Current capital adequacy looks positive, but audit and legal overhang reduce confidence
        blocks:
          - type: paragraph
            body: >
              The strongest public capital-adequacy signal in the assigned evidence is current profitability plus an
              excess reserve buffer, not a disclosed corporate cash balance. ValueTheMarkets, citing BDO attestation
              reporting, said Tether generated $1.5 billion of Q2 2026 net operating profit and ended the quarter with
              $187.75 billion of assets against $183.64 billion of liabilities, leaving a $4.11 billion reserve buffer.
              That is a meaningful cushion, but the same report said the buffer had fallen from $8.23 billion at Q1
              close, which matters because the model is exposed to interest-rate compression and redemption stress.
              Independent adverse reporting also says Tether still has not produced a full audit and remains in active
              litigation over alleged market manipulation, so the capital case is financially impressive but still
              disclosure-light.
            claimRefs:
              - CI005
              - CI006
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >
              The public case for Tether is that it already operates at enormous scale, keeps most reserve yield for
              itself, and currently shows enough excess reserves to avoid an immediate financing-dependency story. The
              public case against easy underwriting is that almost every investor-grade input beyond reserve size
              remains private: realized pricing, customer mix, treasury duration, corporate cash, debt or
              project-finance obligations, burn, litigation reserves, and management's next-round or recapitalization
              triggers are all missing from the assigned sources. On the available evidence, the right verdict is that
              revenue quality is understandable at a high level, margin durability depends on rates and redemption
              behavior, and true capital adequacy still requires direct diligence materials rather than another round of
              public-web scraping.
            claimRefs:
              - CI001
              - CI003
              - CI006
              - CI011
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financial model is reserve carry, not subscription software
            body: >-
              Public evidence supports underwriting Tether more like a short-duration spread business on a huge
              liability base than like a company with disclosed SaaS pricing or sales-efficiency metrics.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI014
          - type: callout
            title: Audit and litigation remain the main confidence discounts
            body: >-
              Strong reported profitability does not offset the lack of a full independent audit and the continuing
              market-manipulation litigation overhang.
            calloutType: risk
            claimRefs:
              - CI011
              - CI012
              - CI013
          - type: callout
            title: Ask for treasury, liquidity, and contingency files before underwriting
            body: >-
              A serious diligence process should request reserve composition by tenor, direct issuance and redemption
              cohorts, parent-company cash and debt, and quantified legal contingencies rather than rely on public
              reserve summaries alone.
            calloutType: recommendation
            claimRefs:
              - CI005
              - CI006
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope centers on stablecoin rails, with wallet infrastructure layered on top
        blocks:
          - type: paragraph
            body: >
              The strongest product evidence still starts with Tether's core stablecoin rails. Official copy describes
              reserve-backed tokens pegged 1-to-1 to fiat or commodity units and explicitly names USDt, MXNt, and XAUt
              as public products. That same surface frames the business less as a retail app and more as embedded
              financial infrastructure for exchanges, wallets, merchants, payment processors, financial services
              providers, and ATMs. The newer WDK documentation expands the picture from asset issuance into developer
              tooling: Tether is not only asking partners to hold or transfer tokens, but also to build end-user wallets
              and payment experiences on infrastructure that Tether describes as underlying wallet rails. In
              customer-workflow terms, the public product map is therefore a layered stack of multi-chain reserve-backed
              assets plus assisted wallet infrastructure rather than a narrow single-token website.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
