  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - - Thesis
        - >-
          Tether has multi-chain distribution and describes USDT as the most widely adopted stablecoin, supporting
          durable liquidity relevance.
        - >-
          Independent usage, settlement, or customer concentration evidence would strengthen this from strategic scale
          to underwritable moat.
      - - Thesis
        - >-
          Third-party reporting describes roughly $10 billion of annual profit and growing Treasury and gold exposure,
          implying meaningful balance-sheet capacity.
        - >-
          Primary audited financial statements or a full reserve audit would convert this from reported strength into
          financeable evidence.
      - - Thesis
        - Tether is redeploying capital into payment infrastructure through 2026 investments such as Utexo and Plenti.
        - >-
          Evidence that these investments drive measurable distribution, transaction volume, or take-rate advantages
          would justify strategic premium.
      - - Anti-thesis
        - >-
          Investor resistance to a reported valuation near $500 billion suggests public price discovery is already
          pushing back on the premium.
        - >-
          A completed financing at or near those terms with credible counterparties would weaken the no-deal or
          down-round concern.
      - - Anti-thesis
        - >-
          ICIJ says Tether has never released results of a full financial audit of its reserves, leaving a central
          valuation risk unresolved.
        - A full audit or equivalently strong primary disclosure would remove one of the biggest underwriting blockers.
      - - Anti-thesis
        - >-
          Ownership and control remain unusually opaque for a company of Tether's scale, raising governance and
          preference-stack uncertainty.
        - >-
          A current cap table, control-rights summary, and financing-term package would materially improve
          underwriteability.
    notes: >-
      Arguments mix company claims, investigative reporting, and thin secondary financing context; the table highlights
      what evidence would move the call.
