  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence supports a layered stack from multi-chain assets and distribution surfaces up through WDK,
      developer tooling, and operating controls.
    data:
      layers:
        - label: Distribution and user surface
          note: Public-facing adoption surface for token movement and payment use cases.
          items:
            - label: Exchanges and wallets
              note: Core liquidity and custody surfaces highlighted on the homepage.
            - label: Merchants and payment providers
              note: Commercial acceptance surface for stable-value transfers.
          outputs:
            - label: Global USDt ecosystem
              note: Tether describes a global network of exchanges, wallets, merchants, and payment providers.
        - label: Asset and protocol layer
          note: Reserve-backed token products delivered across several chains.
          items:
            - label: USDt, MXNt, XAUt
              note: Publicly listed token products.
          modules:
            - label: Multi-chain transport
              note: Algorand, Celo, Cosmos, Ethereum, EOS, Liquid Network, Solana, Tezos, Ton, and Tron.
          outputs:
            - label: Cross-chain reserve-backed rails
              note: Token transfer and redemption workflow depends on protocol selection and reserve trust.
        - label: Wallet and developer layer
          note: Tether is positioning WDK as an integration substrate, not just a marketing concept.
          items:
            - label: WDK
              note: Underlying wallet infrastructure for partner-built end-user products.
          modules:
            - label: Key management and signing
              note: WDK docs say partner products can rely on Tether for these under-the-hood functions.
            - label: SDKs, APIs, docs-as-code
              note: Recruiting signals point to a formal developer-documentation and example-app surface.
          outputs:
            - label: Wallet and payments integrations
              note: Supported through engineering access, solutions architects, and partner tracks.
        - label: Platform and control layer
          note: Public evidence suggests conventional platform operations beyond the token and wallet layers.
          items:
            - label: Apps, SDKs, SaaS platforms, distributed systems
              note: Architecture role language implies a broad operating estate.
          modules:
            - label: Docker, Kubernetes, CI/CD
              note: Called out in the Technical Architect brief.
          outputs:
            - label: Scalable product operations
              note: The platform brief implies ongoing deployment, orchestration, and delivery discipline.
        - label: Partner enablement layer
          note: Public WDK materials emphasize guided rollout rather than purely self-serve onboarding.
          items:
            - label: Solutions architects and engineering access
              note: Project Partners are offered direct product and engineering support.
          modules:
            - label: Project, Tech Contributor, and Consulting tracks
              note: Tether publishes multiple partnership tracks for builders and implementers.
          outputs:
            - label: Assisted WDK launches
              note: Early API and SDK access plus privileged support are part of the value proposition.
        - label: Governance and trust layer
          note: Public trust surfaces exist, but independent proof remains incomplete.
          items:
            - label: Transparency and supported-protocol disclosures
