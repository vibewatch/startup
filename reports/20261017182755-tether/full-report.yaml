  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The market boundary has to start with the job USDT is solving rather than with a generic "crypto TAM."
              Tether's own materials position the token across exchanges, wallets, payment processors, merchants,
              financial services, and ATMs, while independent market sources describe stablecoins as tools for
              low-volatility transactions, remittances, savings, and cross-border settlement. That means the relevant
              market includes blockchain dollar liquidity, not just speculative trading volume. It also means the status
              quo substitutes are mixed: bank wires and remittance rails for payments, fiat balances on exchanges for
              traders, and local-currency savings or other stablecoins for end users. The adjacency to broader
              cryptocurrency infrastructure is real, but the evidence here does not justify calling all crypto activity
              part of Tether's monetizable market.
            claimRefs:
              - CM002
              - CM014
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM005
              - CM009
              - CM014
              - CM016
      - number: '2.2'
        title: Sizing lenses and geographic concentration
        blocks:
          - type: paragraph
            body: >-
              Public sizing is strongest at the stablecoin-network layer, not at a clean Tether-specific SAM or SOM.
              DataWallet reports roughly $185 billion of USDT circulation in 2026 and 57.96% stablecoin share after a
              modest decline from 60.46%, which still leaves Tether as the category leader. The same source describes
              more than $90 billion of USDT on Tron and about $4.2 trillion of year-to-date transfer volume there,
              showing that the most important observable market is settlement throughput on low-fee rails. Geography
              matters as much as size: SQ Magazine and other retained sources place more usage outside North America,
              with heavy concentration in Asia-Pacific and other emerging-market corridors where dollar access,
              inflation hedging, and cross-border payments matter more than regulated U.S. retail distribution.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM007
              - CM008
