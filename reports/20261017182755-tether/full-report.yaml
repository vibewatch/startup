      - number: '5.3'
        title: Public control surfaces exist, but trust still depends on reserve and governance credibility
        blocks:
          - type: paragraph
            body: >
              Tether does expose more public control surfaces than a pure marketing site. The official homepage links
              readers to transparency materials, supported protocols, integration guidance, bug bounty resources, and
              security-features pages, which at least shows an intent to surface product-control information for users
              and integrators. The problem is that these are entry points, not audited operating proof. In the assigned
              evidence, the strongest independent counterweight is ICIJ's reporting that Tether still has not released
              the results of a full financial audit and remains unusually opaque on ownership and control. For a product
              whose utility depends on reserve credibility and trust in redemption, that governance opacity is not a
              side issue; it is part of the technical trust model. The practical takeaway is that public controls are
              visible, but public verification remains incomplete.
            claimRefs:
              - CE010
              - CE011
      - number: '5.4'
        title: Product breadth looks real; independent technical benchmarking is still thin
        blocks:
          - type: paragraph
            body: >
              The public evidence is strong enough to say Tether has a real, multi-surface product stack: multi-chain
              stablecoins are clearly in production, WDK is being positioned as wallet infrastructure, and the hiring
              footprint spans architecture, wallets, compliance, QA, Linux, and adjacent AI work. The weaker part of the
              case is external technical validation. The assigned pool includes very little independent practitioner
              evidence on WDK adoption, production reliability, or ecosystem usage, and one ostensibly technical result
              in the pool was actually an unrelated electrodynamic tether propulsion report. That namesake noise matters
              because it lowers confidence in generic discovery and pushes this chapter toward official surfaces and
              recruiting proxies. A serious diligence process should therefore treat the public materials as proof of
              scope and intent, not as proof that the newer developer stack is mature, widely adopted, or independently
              benchmarked.
            claimRefs:
