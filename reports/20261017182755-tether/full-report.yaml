      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              The buyer map is multi-sided. Exchanges and trading desks buy liquidity depth and a quote-currency
              standard; end users in weaker-currency markets buy access to a dollar proxy for savings and remittances;
              merchants and gateways buy a settlement option that can cross borders without card-network or
              correspondent-banking friction; and wallets or protocols buy a liquid, familiar unit for settlement and
              collateral flows. The adoption path differs by segment: exchange distribution is pulled by liquidity and
              interoperability, whereas payments use cases are pulled by currency instability, banking friction, and
              installed wallet reach. Merchant acceptance is visible but still much thinner than exchange or wallet
              evidence, so it should be treated as a supporting growth surface rather than as the core demand base.
            claimRefs:
              - CM002
              - CM006
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM006
              - CM008
              - CM009
      - number: '2.4'
        title: Adoption constraints and remaining diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The main constraints are not demand-side awareness; they are trust, regulation, and measurement quality.
              ICIJ says Tether had not released results of a full reserve audit as of August 2026, while DataWallet says
              a first full audit only began in Q1 2026, leaving a valuation-relevant disclosure lag even at large scale.
              DataWallet also reports $4.4 billion frozen across more than 7,200 wallets, which matters because some
              users choose stablecoins precisely to avoid intervention risk. Europe is a nearer-term regulatory
              headwind, with MiCA-related listing and issuance effects pushing Tether's strongest observable growth back
              toward non-EU corridors. The bigger analytical gap is denominator quality: current sources mix users,
              wallets, merchant listings, stablecoin share, and transfer volume, so public evidence still does not
              isolate segment economics or a defensible Tether-specific SAM/SOM.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: USDT behaves like dollar-liquidity infrastructure
            body: >-
              The strongest retained evidence points to settlement and liquidity infrastructure, not to a narrow "crypto
              token" market. That broadens Tether's relevance but makes category share a weaker proxy for monetizable
              demand than circulation, transfer, or segment economics would be.
            calloutType: insight
            claimRefs:
              - CM002
              - CM005
              - CM014
          - type: callout
            title: Disclosure lag is still a market constraint
            body: >-
              Tether's adoption can keep compounding even while disclosure quality lags, but that gap matters for
              regulated distribution, trust-sensitive buyers, and valuation confidence. The evidence here supports
              treating transparency as a commercial constraint, not only as a governance footnote.
            calloutType: risk
