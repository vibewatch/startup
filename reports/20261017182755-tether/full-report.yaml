  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Tether delivers stronger reserve disclosure, fundraising clears near premium terms, and portfolio investments
          strengthen payments distribution.
        - >-
          Upside exists only if entry still reflects some disclosure discount; the assigned evidence does not support a
          standalone numeric range today.
        - >-
          Audit still disappoints, financing terms leak weaker than expected, or regulatory pressure rises before deal
          close.
        - Would require new primary evidence rather than interpretation of existing rumor-driven price talk.
      - - Base
        - >-
          Tether remains strategically important and profitable, but investors continue to haircut opacity, governance,
          and regulatory uncertainty.
        - >-
          Underwrite only at a negotiated discount to premium rumor marks and with hard diligence protections around
          reserves and control rights.
        - >-
          Price can stay elevated relative to disclosure quality, leaving asymmetric downside even if the business
          itself remains resilient.
        - Best fit for current evidence set because it recognizes scale while refusing unsupported precision.
      - - Bear
        - >-
          Fundraising stalls, reprices, or shifts to investor-friendly terms because disclosure gaps and regulatory risk
          outweigh momentum.
        - >-
          Returns become unattractive if buyers absorb premium pricing without audit, governance, or liquidity
          protections.
        - >-
          Permanent capital impairment, down-round signaling, or tighter stablecoin regulation can all force a lower
          clearing price.
        - Supported by reported investor pushback and unresolved reserve-audit concerns.
    notes: >-
      Scenarios are qualitative because the assigned evidence lacks primary financing documents, audited financials, and
      a defendable public comparable set.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
