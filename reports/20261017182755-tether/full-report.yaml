        title: Public technical signals imply a mixed token, wallet, app, and platform stack
        blocks:
          - type: paragraph
            body: >
              Public technical proof comes mostly from documentation and recruiting, not from directly inspected
              repositories or architecture diagrams. The wallet documentation role and WDK partner materials together
              suggest a developer surface that includes SDKs, APIs, open-source libraries, and web, mobile, and desktop
              applications. The same sources repeatedly mention key management, transaction signing, and blockchain
              interactions, which indicates that Tether wants WDK to sit below partner applications as a wallet
              operating layer rather than a simple API wrapper. Recruiting for a Technical Architect adds signals of
              broader platform complexity: apps, SDKs, SaaS platforms, distributed systems, Docker, Kubernetes, and
              CI/CD automation appear in the brief, implying that Tether's technical estate likely spans token
              transport, developer tooling, partner enablement, and conventional cloud-platform operations. That is
              enough to establish architectural breadth, but not enough to verify implementation quality or operational
              maturity.
