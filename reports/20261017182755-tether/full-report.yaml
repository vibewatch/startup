        title: Capital signals and milestone trajectory
        blocks:
          - type: paragraph
            body: >-
              The assigned pool supports two different kinds of scale signal: operating scale and strategic capital
              deployment. Official history materials record milestone growth points such as USDT crossing $1 billion of
              market cap in 2017 and $100 billion in 2024, while partner-side releases show Tether deploying capital
              into regulated and Bitcoin-native infrastructure through the $100 million Anchorage investment and the
              proposed majority ownership of Twenty One. What remains unresolved is the clean investor baseline. ICIJ's
              2026 estimate of roughly $200 billion of private-company value is directionally very different from a
              low-reputation August 2026 tear sheet that compiles public reporting around a $12 billion November 2024
              valuation, $600 million-plus funding total, and 244 employees. Those signals are not directly comparable,
              and the retained evidence does not include primary financing documents that would reconcile them.
