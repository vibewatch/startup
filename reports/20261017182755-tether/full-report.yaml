      - number: '3.3'
        title: The moat is durable in liquidity, but vulnerable in reserve trust and legal overhang
        blocks:
          - type: paragraph
            body: >-
              The main durability question is whether Tether can preserve network effects while the market places more
              weight on auditability and regulatory fit. Tether states that every USD₮ token is backed 1-to-1 by
              reserves, but both ICIJ and legal commentary underscore why that claim does not close the competitive
              argument on trust. ICIJ reports that Tether has never released results of a full financial audit of its
              reserves, and The Antitrust Attorney notes that a federal judge certified buyer classes against Tether and
              Bitfinex in February 2026 before the Second Circuit let that ruling stand in July. Bitget's summary of
              Coin Metrics argues that Tether's next phase depends on whether it can extend its network effects under
              growing regulatory pressure. That points to a durable but narrowing moat: Tether remains hard to displace
              where liquidity and cross-chain reach dominate, but it gives more room to compliant issuers, yield-bearing
              products, and bank-led substitutes wherever buyers treat transparency and legal cleanliness as primary
              buying criteria.
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Liquidity moat still outruns feature parity debates
            body: >-
              Tether's strongest defense is not a unique feature bundle; it is the combination of exchange ubiquity,
              multi-chain issuance, and entrenched use as the default settlement pair.
            calloutType: strength
            claimRefs:
              - CP001
              - CP003
              - CP008
          - type: callout
            title: Trust-sensitive flows have cleaner substitutes
            body: >-
              USDC, yield-bearing alternatives, and bank-led workflows do not need to beat Tether on raw volume to win
              selective flows; they only need to look safer or more compliant for the buyer cohort that values
              auditability over universal liquidity.
