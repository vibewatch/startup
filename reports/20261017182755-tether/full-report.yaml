  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape breadth spans direct peers, yield-bearing adjacencies, and non-issuer substitutes
        blocks:
          - type: paragraph
            body: >-
              Tether competes first against other fiat-referenced stablecoins, led by Circle's USDC, because buyers
              choosing a crypto-native dollar care about exchange reach, redemption confidence, and whether the token is
              accepted across trading, payment, and wallet rails. That direct peer set is widening: Coin Metrics
              describes USDC as regaining footing on regulatory momentum while yield-bearing alternatives such as
              Ethena's USDe, Sky's USDS, and tokenized money-market funds gain ground as users look for yield
              distribution rather than pure payment utility. The substitute set is broader than stablecoin issuers
              alone. EarnPark's wallet guide shows that self-custody, hardware wallets, and exchange custody change the
              user's control, recovery, and fee model, meaning some buyers can solve the same treasury or settlement job
              by changing wallet architecture instead of changing issuer. Traditional bank rails and internal treasury
              stacks remain status-quo substitutes for regulated or passive holders, even if they lack Tether's
              always-on trading liquidity.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP009
              - CP010
              - CP011
              - CP014
