          - type: callout
            title: Ask for architecture, security, and adoption files before underwriting WDK
            body: >
              The next diligence step should be a product and security walkthrough covering WDK architecture boundaries,
              key-management design, production customer count, uptime history, incident handling, and any third-party
              attestations.
            calloutType: recommendation
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE010
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer evidence points to channel breadth and payment utility, not a single vertical
        blocks:
          - type: paragraph
            body: >
              The assigned evidence does not show a conventional enterprise customer list with ARR by account, but it
              does show a wide set of user and payer categories around the USDT rail. Official copy says Tether is
              integrated across exchanges, OTC desks, wallets, payment processors, financial services, and ATMs, while
              independent analysis says the heaviest real-payment cohorts in 2026 are cross-border suppliers, contractor
              payroll platforms, remittance providers, crypto-native treasuries, and emerging-market merchants. That
              matters because it frames Tether less as an application sold into one workflow and more as shared
              infrastructure used by many distribution channels. The breadth is real, but it is mostly ecosystem-level
              breadth rather than a disclosed direct-sales roster with contract economics.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU016
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU016
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU010
      - number: '6.2'
        title: Named proof is visible, but most of it is channel or partner evidence rather than customer cohorts
        blocks:
          - type: paragraph
            body: >
              The clearest named public proof in the pool comes from distribution surfaces and partner programs.
              Tether's homepage lists major exchanges and wallets such as Binance, Coinbase, Kraken, and OKX as
              integration venues, which supports liquidity reach but does not disclose active-customer counts, net
              revenue, or retention by counterparty. Additional official and third-party sources show expansion programs
              with Shiga in Africa and the GCC and with Bitqik in Laos, where the emphasis is product launch, education,
              and merchant enablement. Those examples show Tether can extend into new geographies and user groups
              through partners, but they still stop short of investor-grade production case studies with dated outcomes,
              contract length, or renewal behavior.
            claimRefs:
              - CU002
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU009
              - CU010
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU004
              - CU009
              - CU010
              - CU016
      - number: '6.3'
        title: Reported scale is large, but durability and concentration remain the real customer questions
        blocks:
          - type: paragraph
            body: >
              Public scale signals are strong enough to confirm adoption, but not strong enough to underwrite customer
              quality. Market Insiders reported that Tether said USDT had more than 500 million users worldwide in
              February 2026, and CoinLaw separately said Tether reported adding more than 30 million users during Q2
              2026 while USDT circulation stood at $183.3801 billion and roughly 58.94 percent of tracked stablecoin
              supply in September 2026. Those are meaningful reach indicators, yet none of the assigned sources disclose
              NRR, GRR, churn, renewal rates, contract length, top-customer concentration, or top-channel dependency.
              For this chapter, the gap is therefore not whether Tether has users, but whether the best users are
              sticky, diversified, and economically attractive.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU012
              - CU013
      - number: '6.4'
        title: Adverse-use scrutiny and opaque cohorts cap confidence in the customer story
        blocks:
          - type: paragraph
            body: >
              The adoption story also carries a meaningful adverse edge. ICIJ wrote that USDT has become a tool for
              money launderers at industrial-scale scam centers, which shows that customer growth is not purely a
              bullish demand story and can attract regulatory pressure or reputational damage. Tether's own September
              2026 news page simultaneously highlighted cooperation with more than 2,900 investigations globally,
              including over 1,600 involving U.S. law enforcement, reinforcing that misuse monitoring is now part of the
              product's operating context. On balance, Tether looks like a massive and still-expanding network product
              with global distribution, but the absence of retention and concentration disclosures means the customer
              base is easier to observe at the top of the funnel than to underwrite for durability.
            claimRefs:
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is easy to verify; customer quality is not
            body: >-
              Public evidence makes it easy to confirm that Tether reaches exchanges, merchants, remittance flows, and
              emerging-market users, but much harder to quantify which cohorts renew, expand, or generate the best
              economics.
            calloutType: insight
            claimRefs:
              - CU001
              - CU004
              - CU016
          - type: callout
            title: Concentration and retention are still blind spots
            body: >-
              The assigned public sources do not disclose NRR, GRR, churn, renewal, contract length, or top-customer
              concentration, so the customer story is broad but not yet durable enough to underwrite without private
              materials.
            calloutType: risk
            claimRefs:
              - CU012
              - CU013
          - type: callout
            title: Ask for cohort and counterparty files before trusting the growth story
            body: >-
              A serious diligence process should request active-user definitions, cohort retention, top-counterparty
              concentration, geography-by-corridor volume, and partner conversion funnels rather than rely on
              circulation and user-count headlines.
            calloutType: recommendation
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU010
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal overhang is the first kill criterion
        blocks:
          - type: paragraph
            body: >
              Tether's core legal risk is the gap between what the company says about backing and what investors can
              verify from the assigned public record. Tether states that every token is 100% backed and that it
              publishes daily circulation and quarterly reserve information. ICIJ reported on 7 August 2026 that the
              company had not released full-audit results; a later tertiary account says KPMG US completed an
              unqualified audit of Tether International's 2025 financial statements in August, while also saying Tether
              did not publicly release the report. ICIJ also says Tether paid a $41 million fine in 2021 over reserve
              misrepresentation and that El Salvador filings reviewed by ICIJ do not disclose current ownership. This
              does not prove insolvency, but the unavailable audit scope and report leave material assurance questions
              open.


              The litigation stack is also still live rather than historical. The Tether/Bitfinex crypto-asset
              litigation survived into class status in 2026, which raises the economic downside even though causation
              remains a summary-judgment fight. BitOK's reporting adds a separate market-access angle: Tether did not
              obtain MiCA authorization and USDT was delisted in the EEA by several exchanges after the regime took
              effect. Put together, the legal posture is not "proven fatal," but it is serious enough that a fresh
              enforcement action, an adverse merits ruling, or inability to review the completed audit and its scope
              should be treated as thesis-breaking rather than routine noise.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR009
              - CR011
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR009
              - CR011
              - CR015
              - CR016
      - number: '7.2'
        title: Operational controls exist, but the freeze and control plane still looks behaviorally mitigated
        blocks:
          - type: paragraph
            body: >
              Tether's enforcement tooling is active and large-scale, but the available evidence says its operational
              mitigation is still mostly procedural rather than structural. BitOK's 2026 on-chain review says Tether
              destroyed $1.08 billion of USDT over 24 months and $822 million in the last year alone, showing that the
              blacklist-and-burn machinery is heavily used. The same research, however, says $127.6 million left
              targeted addresses during the public submit-to-execute freeze window on clean cases, that roughly 85% of
              blacklistings still run through that slower public window, and that the multisig architecture itself saw
              zero owner or threshold changes across the observed period.


              That matters because the downside is not theoretical: as long as a public pending window remains visible,
              counterparties can race it. OpenZeppelin's earlier audit did not find critical or high severity issues,
              but it did identify medium-severity problems around outdated imports, pause behavior, and
              blacklist-contract responsibilities, which is directionally consistent with a long-lived control surface
              that has historically favored incremental fixes over redesign. For investment underwriting, the key
              conclusion is that Tether can enforce at scale, but investors still need proof that its high-stakes
              enforcement path is structurally hardened rather than selectively accelerated when law enforcement
              pressure is highest.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR010
              - CR013
              - CR014
              - CR016
      - number: '7.3'
        title: Dependencies on rates, distribution partners, and management bandwidth widen residual exposure
        blocks:
          - type: paragraph
            body: >
              Tether's model has clear external dependencies that can compress margins or amplify execution mistakes. A
              2025 deep-dive cited by the assigned pool says the company held more than $127 billion in U.S. Treasuries
              and reported $4.9 billion of Q2 2025 profit, implying that a meaningful share of economics depends on
              reserve yield rather than software gross margin. The official site also frames USD₮ as broadly distributed
              across exchanges, OTC desks, wallets, merchants, and multiple blockchains, so channel access and ecosystem
              support are not incidental; they are part of the product itself. In parallel, Tether's own corporate
              surface now spans finance, power, data, and education, and the archived corporate site claims 15+ mining
              sites and 20,000+ AI-dedicated GPUs.


              The diversification story may become a strength, but today it raises management-bandwidth and governance
              questions because public third-party evidence still describes a lean organization and unusually opaque
              control structure. Tracxn says Tether has 290 employees and 357 active competitors, while ICIJ describes
              only a few hundred staff and limited ownership disclosure. Meanwhile, Tether's own site emphasizes support
              for more than 2,900 investigations globally and nearly $550 million in Iran-linked freezes, which makes
              regulatory and banking relationships operational dependencies rather than background context. The
              practical read-through is that execution risk rises if rates fall, counterparties narrow support, or
              management stretches a still-opaque organization across too many capital-intensive adjacencies at once.
            claimRefs:
              - CR001
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR009
              - CR012
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR005
              - CR007
              - CR009
              - CR011
              - CR013
              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Kill criteria before any positive underwriting case
            body: >-
              Do not underwrite Tether as a routine scale story unless the signed 2026 audit report and scope can be
              reviewed, freeze-window hardening is shown to be structural rather than selective, and the 2026
              litigation/regulatory stack de-risks rather than widens. A fresh reserve disclosure failure, an adverse
              merits turn in the class action, or evidence that expansion is outrunning governance bandwidth should all
              be treated as thesis-break triggers.
            calloutType: risk
            claimRefs:
              - CR005
              - CR007
              - CR008
              - CR011
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Tether is strategically important and clearly scaled, but the public underwriting package in this chapter
              is materially weaker than the valuation ambition reported in 2026 fundraising coverage. The core positive
              case is that USDT remains broadly distributed, Tether presents itself as fully reserve-backed, and
              third-party reporting describes very large profits plus active capital deployment into adjacent payments
              infrastructure. The core negative case is that investors reportedly resisted a fundraising process that
              could have implied roughly $500 billion, while investigative reporting still flags no full audit of
              reserves and unusually limited ownership disclosure for a business of this scale. On that mix, the clean
              price-sensitive recommendation is to track the asset and only engage if diligence quality improves or
              entry pricing resets materially below rumor-driven marks.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
              - CV009
      - number: '8.2'
        title: Financing context, comparables, and scenarios
        blocks:
          - type: paragraph
            body: >-
              The strongest public price signal in the assigned pool is not a completed round but resistance to one.
              CoinDesk reported that Tether scaled back plans to raise up to $20 billion after investors balked at a
              valuation that could have reached about $500 billion, and advisers were instead discussing something
              closer to $5 billion. ICIJ separately framed Tether as likely worth around $200 billion, while also
              stressing that ownership and reserve disclosure remain unusually opaque for a company that may already
              rank among the most valuable private firms. That evidence supports scenario framing rather than precise
              valuation math. A bull case requires audited reserve proof, credible confirmation that financing can clear
              near premium terms, and evidence that portfolio investments convert into durable distribution or
              monetization advantages. The base case assumes Tether stays powerful but privately discounted for
              disclosure, governance, and regulatory overhang. The bear case assumes no-deal, a down-round, or multiple
              compression once buyers refuse to pay for opacity.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
              - CV009
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
      - number: '8.3'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Public evidence is good enough to say Tether matters, but not good enough to support false precision on
              valuation or target returns. Before underwriting any price, diligence should force disclosure on reserve
              audit scope, cap-table ownership, control rights, preference stack, and the exact status of any ongoing
              fundraising. The chapter's supportive evidence on ecosystem breadth and capital deployment also needs
              sharper attribution, because some directional context comes from aggregators or thin secondary sources
              rather than primary financing documents. Thesis-break triggers are straightforward: if fundraising only
              clears after a sharp reprice, if audited reserve support still fails to appear, if ownership/control
              questions remain unresolved, or if regulatory pressure increases while valuation expectations stay
              premium, downside dominates optionality. Conversely, the view can improve if Tether supplies primary
              documentation that narrows the disclosure gap while preserving scale, profitability, and strategic
              ecosystem reach.
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Current call
            body: >-
              Treat Tether as strategically important but not currently underwritable at premium rumor-based pricing
              without stronger reserve, governance, and financing disclosure.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV007
          - type: callout
            title: What would break the thesis fastest
            body: >-
              A down-round, investor-friendly preference stack, absent reserve audit, or rising regulatory pressure
              would all matter more than incremental ecosystem expansion headlines.
            calloutType: risk
            claimRefs:
              - CV004
              - CV006
              - CV008
