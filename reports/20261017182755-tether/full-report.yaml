      - number: '4.2'
        title: Public traction is large, but unit economics stay mostly private
        blocks:
          - type: paragraph
            body: >
              Public scale is visible even though classical startup KPIs are not. ValueTheMarkets reported roughly
              $184.6 billion of USDT in circulation at the end of Q2 2026, and Tether.io displayed a USDT market cap of
              $184.24 billion in October 2026, which is close enough to confirm that the business remained at very large
              scale through the run date. Official surfaces also describe broad distribution across exchanges, OTC
              desks, and wallets rather than a disclosed direct-sales motion, while ICIJ characterizes the company as
              operating with only a few hundred employees. That combination suggests strong operating leverage, but
              there is still no public view into realized fee capture, customer concentration, CAC, payback, or
              retention cohorts, so sales-efficiency underwriting is mostly unavailable from the assigned pool.
            claimRefs:
