  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Reserve yield, not software pricing, is the core earnings engine
        blocks:
          - type: paragraph
            body: >
              The assigned evidence consistently describes Tether as monetizing reserve float rather than charging a
              broad software subscription. The Block says Tether receives dollars or equivalents when USDT is minted,
              reinvests most of that balance into short-term US Treasuries and other low-risk assets, and keeps the
              resulting spread after operating costs. Official copy on tether.to aligns with that mechanism by stating
              that every Tether token is backed by reserves that include traditional currency, cash equivalents, and
              other assets, with daily circulation disclosures and quarterly reserve updates. Public fee disclosures
              exist, but they appear secondary to reserve yield, so revenue quality is driven more by balance-sheet
              scale and short-rate levels than by a disclosed customer take rate.
            claimRefs:
              - CI001
              - CI002
              - CI003
