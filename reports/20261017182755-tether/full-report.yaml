      - number: '1.2'
        title: Leadership, founders, and control
        blocks:
          - type: paragraph
            body: >-
              The origin story is relatively clear, but the current control map is not. ICIJ traced Tether back to the
              2014 Realcoin project and reported that early ownership migrated from the founding trio toward
              Bitfinex-linked executives. Fortune's profile makes Paolo Ardoino the visible current operator, while ICIJ
              and FinTelegram both point to public filings showing Giancarlo Devasini with greater than 50% voting
              interest in a Tether entity. That is meaningful evidence of concentrated control, but it is not the same
              thing as a full current group cap table, board-rights schedule, or governance package. For later diligence
              work, this chapter should be treated as establishing who appears central to Tether rather than proving a
              fully reconciled ownership structure.
