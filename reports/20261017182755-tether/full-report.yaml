  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and current scale
        blocks:
          - type: paragraph
            body: >-
              Tether's retained official pages consistently describe the company as a 2014-launched platform for using
              fiat currencies in digital form, with USDT as the flagship product and a broader infrastructure narrative
              extending into adjacent services. Independent reporting places the company at a much later stage than a
              typical startup: Fortune reported USDT market capitalization at roughly $187 billion in early January 2026
              and more than $10 billion of profit for 2025, while FinTelegram summarized Tether International's Q2 2026
              disclosure at about $184.6 billion of USDT issued, $187.75 billion of assets, and $4.11 billion of excess
              reserves. The footprint picture is less settled. ICIJ reported that Tether moved from the British Virgin
              Islands to El Salvador, but the retained pool does not provide a primary disclosure that cleanly settles a
              principal headquarters, customer count, or revenue/run-rate figure distinct from profit.
