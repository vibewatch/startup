schemaVersion: report-v2
artifact: customers
slug: tether
runDate: 2026-10-17
company:
  name: Tether
chapter:
  number: 6
  title: Customers
  summary: "Tether's public customer proof is strongest on distribution breadth: official and independent sources place USDT across exchanges, wallets, payment processors, merchants, remittance flows, and emerging-market users, with third-party trackers still showing enormous circulation and share. The main underwriting gap is durability rather than reach, because the assigned pool does not disclose retention, renewal, or concentration metrics and named production proof skews toward channel partners and ecosystem listings instead of customer-level cohorts."
sections:
  - id: segmentation-and-adoption-surfaces
    title: Customer evidence points to channel breadth and payment utility, not a single vertical
    body: |
      The assigned evidence does not show a conventional enterprise customer list with ARR by account, but it does show a wide set of user and payer categories around the USDT rail. Official copy says Tether is integrated across exchanges, OTC desks, wallets, payment processors, financial services, and ATMs, while independent analysis says the heaviest real-payment cohorts in 2026 are cross-border suppliers, contractor payroll platforms, remittance providers, crypto-native treasuries, and emerging-market merchants. That matters because it frames Tether less as an application sold into one workflow and more as shared infrastructure used by many distribution channels. The breadth is real, but it is mostly ecosystem-level breadth rather than a disclosed direct-sales roster with contract economics.
    claimRefs: [CU001, CU002, CU003, CU004, CU016]
    tableRefs: [TU001, TU002]
  - id: named-proof-and-expansion-loops
    title: Named proof is visible, but most of it is channel or partner evidence rather than customer cohorts
    body: |
      The clearest named public proof in the pool comes from distribution surfaces and partner programs. Tether's homepage lists major exchanges and wallets such as Binance, Coinbase, Kraken, and OKX as integration venues, which supports liquidity reach but does not disclose active-customer counts, net revenue, or retention by counterparty. Additional official and third-party sources show expansion programs with Shiga in Africa and the GCC and with Bitqik in Laos, where the emphasis is product launch, education, and merchant enablement. Those examples show Tether can extend into new geographies and user groups through partners, but they still stop short of investor-grade production case studies with dated outcomes, contract length, or renewal behavior.
    claimRefs: [CU002, CU009, CU010, CU011]
    tableRefs: [TU003]
    figureRefs: [FU001]
  - id: scale-is-large-but-durability-is-under-disclosed
    title: Reported scale is large, but durability and concentration remain the real customer questions
    body: |
      Public scale signals are strong enough to confirm adoption, but not strong enough to underwrite customer quality. Market Insiders reported that Tether said USDT had more than 500 million users worldwide in February 2026, and CoinLaw separately said Tether reported adding more than 30 million users during Q2 2026 while USDT circulation stood at $183.3801 billion and roughly 58.94 percent of tracked stablecoin supply in September 2026. Those are meaningful reach indicators, yet none of the assigned sources disclose NRR, GRR, churn, renewal rates, contract length, top-customer concentration, or top-channel dependency. For this chapter, the gap is therefore not whether Tether has users, but whether the best users are sticky, diversified, and economically attractive.
    claimRefs: [CU005, CU006, CU007, CU008, CU012, CU013]
  - id: adverse-and-underwriting-verdict
    title: Adverse-use scrutiny and opaque cohorts cap confidence in the customer story
    body: |
      The adoption story also carries a meaningful adverse edge. ICIJ wrote that USDT has become a tool for money launderers at industrial-scale scam centers, which shows that customer growth is not purely a bullish demand story and can attract regulatory pressure or reputational damage. Tether's own September 2026 news page simultaneously highlighted cooperation with more than 2,900 investigations globally, including over 1,600 involving U.S. law enforcement, reinforcing that misuse monitoring is now part of the product's operating context. On balance, Tether looks like a massive and still-expanding network product with global distribution, but the absence of retention and concentration disclosures means the customer base is easier to observe at the top of the funnel than to underwrite for durability.
    claimRefs: [CU014, CU015, CU016]
