  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-gap
      missingEvidence: Cohort retention, NRR, GRR, churn, renewal, contract length, or satisfaction data by major customer segment.
      whyItMatters: Adoption breadth does not prove durability, expansion efficiency, or quality of the underlying user base.
      diligencePath: Request monthly active-user definitions, cohort tables, renewal data, and segment-level retention from management or core operating dashboards.
      relatedQuestionRefs: [QU005]
    - type: private-evidence-only
      severity: material
      topic: concentration-gap
      missingEvidence: Top-customer, top-exchange, top-wallet, top-country, and top-partner concentration metrics for issuance, redemption, and transaction activity.
      whyItMatters: Customer and channel concentration can turn a broad ecosystem story into a fragile dependency story if a few counterparties dominate volume.
      diligencePath: Request top-10 counterparty concentration, issuer-redemption mix, and geography-by-corridor volume from finance and treasury teams.
      relatedQuestionRefs: [QU007]
    - type: enumeration-incomplete
      severity: material
      topic: named-proof-quality
      missingEvidence: An independently supported list of production customer deployments with outcome metrics, dates, and status.
      whyItMatters: Official integration lists and partner announcements are weaker than live production case studies when judging deployment quality and reference strength.
      diligencePath: Gather procurement records, customer case studies, marketplace reviews, or user conference talks that confirm active production usage and outcomes.
      relatedQuestionRefs: [QU004, QU005]
      relatedTableRefs: [TU003]
