figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Tether's public customer journey runs from distribution integrations to cross-border operational use, then into merchant acceptance and partner-led geographic expansion.
    data:
      nodes:
        - label: Exchange and wallet integration
          actor: Exchanges, wallets, and OTC venues
          stage: Distribution surface
          channel: Official ecosystem integrations
          touchpoints:
            - Logo-listed venues on tether.to
            - Liquidity access and settlement rails
          detail: Public proof is strongest on integration breadth across crypto-native channels.
        - label: Treasury and liquidity use
          actor: Crypto-native treasuries and trading operators
          stage: Balance-sheet use
          channel: Stablecoin reserve and settlement behavior
          touchpoints:
            - Treasury management
            - Instant settlement inside crypto markets
          detail: Independent analysis places treasuries among the main business-use cohorts.
        - label: Cross-border supplier and payroll flow
          actor: Suppliers, exporters, payroll platforms, and contractors
          stage: Operational payment use
          channel: Faster and lower-cost international settlement
          touchpoints:
            - Supplier payments
            - Contractor payouts
            - Remittance corridors
          detail: Payment utility is the clearest non-speculative demand narrative in the pool.
        - label: Merchant acceptance and emerging-market savings
          actor: Merchants and end users
          stage: Checkout and store-of-value use
          channel: Merchant directories and emerging-market demand
          touchpoints:
            - 2,100+ USDT-accepting companies in Cryptwerk
            - Merchant and saver use cases
          detail: Public proof supports breadth, but not merchant retention or GMV.
        - label: Partner-led localization
          actor: Local exchanges and ecosystem partners
          stage: Geographic expansion
          channel: Education, onboarding, and product launch programs
          touchpoints:
            - Bitqik education program in Laos
            - Lao-language content and workshops
          detail: Expansion is visible, though often still top-of-funnel rather than cohort-proven.
        - label: New institutional and consumer products
          actor: Institutions and consumers in Africa and the GCC
          stage: Product expansion loop
          channel: Shiga wallet infrastructure partnership
          touchpoints:
            - Self-custodial finance products
            - USD₮, Bitcoin, and XAU₮ support
          detail: Official proof shows partner-enabled expansion beyond legacy exchange-only distribution.
    approximationNotes: The journey map shows channel progression and expansion loops, not conversion rates or stage-by-stage cohort retention.
    claimRefs: [CU001, CU004, CU009, CU010, CU016]
callouts:
  - calloutType: insight
    title: Breadth is easy to verify; customer quality is not
    body: Public evidence makes it easy to confirm that Tether reaches exchanges, merchants, remittance flows, and emerging-market users, but much harder to quantify which cohorts renew, expand, or generate the best economics.
    claimRefs: [CU001, CU004, CU016]
  - calloutType: risk
    title: Concentration and retention are still blind spots
    body: The assigned public sources do not disclose NRR, GRR, churn, renewal, contract length, or top-customer concentration, so the customer story is broad but not yet durable enough to underwrite without private materials.
    claimRefs: [CU012, CU013]
  - calloutType: recommendation
    title: Ask for cohort and counterparty files before trusting the growth story
    body: A serious diligence process should request active-user definitions, cohort retention, top-counterparty concentration, geography-by-corridor volume, and partner conversion funnels rather than rely on circulation and user-count headlines.
    claimRefs: [CU005, CU006, CU007, CU010, CU012, CU013]
