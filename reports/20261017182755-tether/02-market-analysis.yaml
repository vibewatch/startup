figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: Mixed public lenses narrow from adjacent crypto demand to directly observed USDT adoption surfaces.
    data:
      items:
        - label: Adjacent crypto demand backdrop
          value: 2.1
          unit: USD bn (2024)
          note: ResearchAndMarkets values the broader cryptocurrency trends market at US$2.1B in 2024 and US$5B by 2030.
          tone: neutral
        - label: Stablecoin market capitalization
          value: 320
          unit: USD bn+
          note: DataWallet says the total stablecoin market crossed $320B in 2026.
          tone: neutral
        - label: USDT share of stablecoins
          value: 57.96
          unit: "%"
          note: DataWallet says Tether remained dominant but ceded some share during 2026.
          tone: positive
        - label: USDT circulating supply
          value: 185
          unit: USD bn
          note: DataWallet reports roughly $185B of USDT in circulation.
          tone: positive
        - label: Global user base proxy
          value: 534
          unit: M users
          note: BlockchainJournal cites Tether's Q4 2025 market report at 534M users worldwide.
          tone: positive
        - label: Merchant acceptance proxy
          value: 2100
          unit: companies
          note: Cryptwerk tracks 2,100+ companies that accept USDT, but warns it is a directory view rather than a merchant census.
          tone: neutral
    approximationNotes: >-
      This pyramid intentionally mixes adjacent market value, category share, circulation,
      users, and directory adoption as evidence-constrained layers rather than as a literal
      additive TAM/SAM/SOM bridge. The numbers match the table-backed public sources but do
      not share a common denominator, so they should be read as narrowing demand lenses.
    claimRefs: [CM003, CM004, CM007, CM009, CM014, CM016]
callouts:
  - calloutType: insight
    title: USDT behaves like dollar-liquidity infrastructure
    body: >-
      The strongest retained evidence points to settlement and liquidity infrastructure, not
      to a narrow "crypto token" market. That broadens Tether's relevance but makes category
      share a weaker proxy for monetizable demand than circulation, transfer, or segment
      economics would be.
    claimRefs: [CM002, CM005, CM014]
  - calloutType: risk
    title: Disclosure lag is still a market constraint
    body: >-
      Tether's adoption can keep compounding even while disclosure quality lags, but that gap
      matters for regulated distribution, trust-sensitive buyers, and valuation confidence.
      The evidence here supports treating transparency as a commercial constraint, not only as
      a governance footnote.
    claimRefs: [CM010, CM011, CM013]
