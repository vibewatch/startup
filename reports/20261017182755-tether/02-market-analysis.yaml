slug: tether
runDate: 2026-10-17
company:
  name: Tether
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Tether operates in a broader market than exchange trading alone: the retained evidence
    shows demand spanning exchange liquidity, cross-border payments, merchant settlement,
    and dollar savings use cases, with emerging markets and Tron-based settlement driving
    current adoption. Public market sizing remains proxy-heavy rather than fully
    monetization-ready, so the chapter preserves stablecoin share, circulation, user, and
    merchant-adoption lenses while keeping transparency and regulatory constraints explicit.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The market boundary has to start with the job USDT is solving rather than with a generic
      "crypto TAM." Tether's own materials position the token across exchanges, wallets,
      payment processors, merchants, financial services, and ATMs, while independent market
      sources describe stablecoins as tools for low-volatility transactions, remittances,
      savings, and cross-border settlement. That means the relevant market includes blockchain
      dollar liquidity, not just speculative trading volume. It also means the status quo
      substitutes are mixed: bank wires and remittance rails for payments, fiat balances on
      exchanges for traders, and local-currency savings or other stablecoins for end users.
      The adjacency to broader cryptocurrency infrastructure is real, but the evidence here
      does not justify calling all crypto activity part of Tether's monetizable market.
    claimRefs: [CM002, CM014, CM016]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and geographic concentration
    body: >-
      Public sizing is strongest at the stablecoin-network layer, not at a clean
      Tether-specific SAM or SOM. DataWallet reports roughly $185 billion of USDT circulation
      in 2026 and 57.96% stablecoin share after a modest decline from 60.46%, which still
      leaves Tether as the category leader. The same source describes more than $90 billion
      of USDT on Tron and about $4.2 trillion of year-to-date transfer volume there, showing
      that the most important observable market is settlement throughput on low-fee rails.
      Geography matters as much as size: SQ Magazine and other retained sources place more
      usage outside North America, with heavy concentration in Asia-Pacific and other
      emerging-market corridors where dollar access, inflation hedging, and cross-border
      payments matter more than regulated U.S. retail distribution.
    claimRefs: [CM003, CM004, CM005, CM007, CM008]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-map
    title: Buyer, user, and payer segmentation
    body: >-
      The buyer map is multi-sided. Exchanges and trading desks buy liquidity depth and a
      quote-currency standard; end users in weaker-currency markets buy access to a dollar
      proxy for savings and remittances; merchants and gateways buy a settlement option that
      can cross borders without card-network or correspondent-banking friction; and wallets
      or protocols buy a liquid, familiar unit for settlement and collateral flows. The
      adoption path differs by segment: exchange distribution is pulled by liquidity and
      interoperability, whereas payments use cases are pulled by currency instability,
      banking friction, and installed wallet reach. Merchant acceptance is visible but still
      much thinner than exchange or wallet evidence, so it should be treated as a supporting
      growth surface rather than as the core demand base.
    claimRefs: [CM002, CM006, CM008, CM009]
    tableRefs: [TM003]
  - id: constraints-and-gaps
    title: Adoption constraints and remaining diligence gaps
    body: >-
      The main constraints are not demand-side awareness; they are trust, regulation, and
      measurement quality. ICIJ says Tether had not released results of a full reserve audit
      as of August 2026, while DataWallet says a first full audit only began in Q1 2026,
      leaving a valuation-relevant disclosure lag even at large scale. DataWallet also
      reports $4.4 billion frozen across more than 7,200 wallets, which matters because some
      users choose stablecoins precisely to avoid intervention risk. Europe is a nearer-term
      regulatory headwind, with MiCA-related listing and issuance effects pushing Tether's
      strongest observable growth back toward non-EU corridors. The bigger analytical gap is
      denominator quality: current sources mix users, wallets, merchant listings, stablecoin
      share, and transfer volume, so public evidence still does not isolate segment economics
      or a defensible Tether-specific SAM/SOM.
    claimRefs: [CM010, CM011, CM012, CM013, CM015, CM016]
