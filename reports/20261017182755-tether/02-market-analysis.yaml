  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: sam-som-gap
      missingEvidence: Segment-level transaction volume, take rate, and gross profit by exchange, payments, remittance, merchant, and protocol channels.
      whyItMatters: Without channel economics, public adoption proxies cannot be converted into a revenue-bearing Tether SAM or SOM.
      diligencePath: Request management disclosure or partner data splitting circulation, transfer volume, and monetization by use case and region.
      relatedQuestionRefs: [QM007]
    - type: conflicting-data
      severity: material
      topic: denominator-quality
      missingEvidence: A reconciled methodology linking unique users, active wallets, merchant listings, and transfer-volume activity.
      whyItMatters: Current public evidence mixes non-comparable denominators and can overstate directly monetizable demand if read as one funnel.
      diligencePath: Obtain Tether or independent dashboard definitions for unique active users, wallet activity, and merchant acceptance methodology.
      relatedQuestionRefs: [QM008]
