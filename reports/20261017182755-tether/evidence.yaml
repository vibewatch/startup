evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: cover-metrics reconciliation
    missingEvidence: A primary financing history, current headcount disclosure, and a management-approved metrics baseline.
    whyItMatters: >-
      Later valuation and operating-leverage analysis will be noisy if headcount, funding, and valuation are not
      reconciled at source.
    diligencePath: >-
      Request a management data room extract or primary board/investor materials covering valuation events,
      capitalization, and HR reporting.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership and founder table coverage
    missingEvidence: A current board list, executive roster, and formal ownership map that tie founders to present governance rights.
    whyItMatters: >-
      Public reporting identifies central figures but does not fully resolve who can approve strategy, financing, or
      related-party transactions.
    diligencePath: Obtain current board materials, shareholder agreements, and an organization chart from management counsel.
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: headquarters and customer disclosure
    missingEvidence: >-
      A primary disclosure identifying Tether's principal headquarters, verified customer count, and a revenue figure
      distinct from profit.
    whyItMatters: >-
      Cover metrics should not force headquarters, customer, or revenue conclusions from jurisdictional reporting and
      secondary commentary.
    diligencePath: >-
      Request a current corporate fact sheet or audited management presentation that states principal office, customers,
      and revenue explicitly.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: sam-som-gap
    missingEvidence: >-
      Segment-level transaction volume, take rate, and gross profit by exchange, payments, remittance, merchant, and
      protocol channels.
    whyItMatters: Without channel economics, public adoption proxies cannot be converted into a revenue-bearing Tether SAM or SOM.
    diligencePath: >-
      Request management disclosure or partner data splitting circulation, transfer volume, and monetization by use case
      and region.
    relatedQuestionRefs:
      - QM007
  - type: conflicting-data
    severity: material
    topic: denominator-quality
    missingEvidence: A reconciled methodology linking unique users, active wallets, merchant listings, and transfer-volume activity.
    whyItMatters: >-
      Current public evidence mixes non-comparable denominators and can overstate directly monetizable demand if read as
      one funnel.
    diligencePath: >-
      Obtain Tether or independent dashboard definitions for unique active users, wallet activity, and merchant
      acceptance methodology.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: reserve-transparency
    missingEvidence: A full third-party audit of reserves and a cleaner public breakdown of reserve eligibility.
    whyItMatters: >-
      Trust-sensitive competitor comparisons hinge on whether Tether can match the transparency standards that help USDC
      and bank-led substitutes win regulated flows.
    diligencePath: >-
      Request the latest full audit, reserve composition detail, and any jurisdiction-specific compliance attestations
      directly from management.
    relatedQuestionRefs:
      - QP002
      - QP006
  - type: access-blocked
    severity: minor
    topic: asia-regional-benchmark
    missingEvidence: A readable independent regional market note on Tether positioning in Asia or Korea.
    whyItMatters: >-
      Tether's distribution moat is strongest in cross-border and exchange-heavy geographies, so regional competitive
      evidence would sharpen whether that lead is durable or policy-fragile.
    diligencePath: >-
      Replace the unreadable Xangle page with another assigned or later-approved independent regional benchmark before
      using region-specific share claims.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: unit-economics-gaps
    missingEvidence: >-
      Realized issuance and redemption take rates, direct-versus-exchange customer mix, CAC, payback, and retention by
      major counterparty cohort.
    whyItMatters: >-
      Without these metrics, there is no defensible public view on GTM efficiency or whether reserve growth depends on
      concentrated counterparties.
    diligencePath: >-
      Request cohort reporting for direct customers, exchange-partner volumes, fee-waiver schedules, and management's
      internal payback analysis.
    relatedQuestionRefs:
      - QI005
  - type: private-evidence-only
    severity: blocking
    topic: corporate-liquidity
    missingEvidence: >-
      Parent-company cash, debt facilities, legal reserves, monthly burn, and a 12-month liquidity and redemption-stress
      plan.
    whyItMatters: >-
      Reserve adequacy for tokens is not the same as unrestricted corporate liquidity available for operations, legal
      costs, or adjacent investments.
    diligencePath: >-
      Obtain treasury schedules, debt agreements, board materials on liquidity planning, and legal-contingency
      memoranda.
    relatedQuestionRefs:
      - QI003
      - QI006
  - type: missing-source
    severity: material
    topic: independent-audit
    missingEvidence: >-
      A completed independent full audit of reserves and entity-level financial statements rather than attestations or
      marketing transparency pages.
    whyItMatters: >-
      Audit absence reduces confidence in reserve composition, related-party exposures, and the reliability of current
      profitability disclosures.
    diligencePath: Request the latest full audit, audit-scope memo, and management letters from the independent auditor.
    relatedQuestionRefs:
      - QI006
  - type: private-evidence-only
    severity: material
    topic: diversification
    missingEvidence: Segment-level capital invested, revenue, opex, and return hurdles for mining, AI, and education initiatives.
    whyItMatters: >-
      Adjacent projects may consume retained earnings or change risk profile even if the core stablecoin reserve loop
      remains profitable.
    diligencePath: >-
      Request business-line budgets, capex approvals, and internal hurdle-rate assumptions for non-stablecoin
      investments.
    relatedQuestionRefs:
      - QI007
  - type: missing-source
    severity: material
    topic: reliability-controls
    missingEvidence: >-
      Public uptime history, incident postmortems, security certifications, or independent technical attestations for
      WDK and related wallet operations.
    whyItMatters: >-
      Without independent operating proof, the chapter can verify scope and intent but not whether the newer
      developer-facing stack performs reliably in production.
    diligencePath: >-
      Request status-history exports, incident logs, SOC or ISO evidence if any, penetration-test summaries, and the
      current security-review package for wallet infrastructure.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: partner-adoption
    missingEvidence: >-
      Production customer count, retained partner roster, transaction volume, and deployment maturity for WDK and
      adjacent products.
    whyItMatters: >-
      Product-market fit for developer infrastructure depends on real integrator adoption, not just documentation and
      partner-program language.
    diligencePath: >-
      Obtain a customer reference list, production deployment counts, integration funnel metrics, and renewal or
      expansion evidence for WDK partners.
    relatedQuestionRefs:
      - QE004
      - QE008
    relatedTableRefs:
      - TE001
      - TE002
  - type: missing-source
    severity: minor
    topic: independent-benchmarking
    missingEvidence: >-
      Independent practitioner benchmarks, repo or package telemetry, and named third-party technical case studies
      specific to Tether's wallet and developer stack.
    whyItMatters: >-
      The assigned pool relies heavily on company-issued documentation and recruiting proxies, which is enough to map
      the stack but not enough to benchmark external developer traction.
    diligencePath: >-
      Request official repository and package links, customer engineering references, and any public or private
      benchmarking of WDK integrations versus alternatives.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: Cohort retention, NRR, GRR, churn, renewal, contract length, or satisfaction data by major customer segment.
    whyItMatters: Adoption breadth does not prove durability, expansion efficiency, or quality of the underlying user base.
    diligencePath: >-
      Request monthly active-user definitions, cohort tables, renewal data, and segment-level retention from management
      or core operating dashboards.
    relatedQuestionRefs:
      - QU005
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: >-
      Top-customer, top-exchange, top-wallet, top-country, and top-partner concentration metrics for issuance,
      redemption, and transaction activity.
    whyItMatters: >-
      Customer and channel concentration can turn a broad ecosystem story into a fragile dependency story if a few
      counterparties dominate volume.
    diligencePath: >-
      Request top-10 counterparty concentration, issuer-redemption mix, and geography-by-corridor volume from finance
      and treasury teams.
    relatedQuestionRefs:
      - QU007
  - type: enumeration-incomplete
    severity: material
    topic: named-proof-quality
    missingEvidence: An independently supported list of production customer deployments with outcome metrics, dates, and status.
    whyItMatters: >-
      Official integration lists and partner announcements are weaker than live production case studies when judging
      deployment quality and reference strength.
    diligencePath: >-
      Gather procurement records, customer case studies, marketplace reviews, or user conference talks that confirm
      active production usage and outcomes.
    relatedQuestionRefs:
      - QU004
      - QU005
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: reserve-audit
    missingEvidence: >-
      The signed 2026 audit report, engagement scope, audited financial statements, reserve schedules, management
      letter, subsequent-events work, and legal-entity boundaries.
    whyItMatters: >-
      A tertiary statement that an unqualified audit was completed does not expose its scope, tested assets,
      related-party treatment, or subsequent reserve changes.
    diligencePath: >-
      Obtain the signed KPMG report and engagement scope, then reconcile it against current transparency data, reserve
      composition, liabilities, and redemption records.
  - type: private-evidence-only
    severity: material
    topic: counterparty-concentration
    missingEvidence: Current banking, custodian, and redemption-counterparty concentration data by entity and jurisdiction.
    whyItMatters: >-
      Partner and regulatory dependencies are clearly material, but the public record does not quantify where a single
      banking or channel failure would bind hardest.
    diligencePath: >-
      Request a current counterparty map covering banking, custody, redemption, exchange, and market-maker relationships
      by revenue or balance exposure.
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory / legal risk register
    missingEvidence: A complete internal legal matter list and current jurisdictional compliance matrix.
    whyItMatters: >-
      The public-source register is enough to rank disclosed risks, but not enough to certify that no additional
      regional or private disputes are material.
    diligencePath: >-
      Request management legal schedules, outside-counsel summaries, and a jurisdiction-by-jurisdiction product and
      licensing map.
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: Current fundraising documents, investor rights, liquidation preferences, and any confirmed post-money valuation.
    whyItMatters: >-
      Without live terms, the chapter can reject overpriced entry but cannot underwrite a target return or defend a
      numeric valuation range.
    diligencePath: >-
      Request the latest deck, cap table, term sheet, and any signed financing documents directly from the company or
      lead investors.
    relatedQuestionRefs:
      - QV001
      - QV003
      - QV005
  - type: private-evidence-only
    severity: material
    topic: reserves-and-governance
    missingEvidence: >-
      Full reserve audit results, current cap table, control-rights summary, and audited entity-level financial
      statements.
    whyItMatters: >-
      Reserve quality and governance transparency are central to both downside protection and any premium multiple
      justification.
    diligencePath: >-
      Obtain the latest audit package, reserve-attestation workpapers, ownership schedule, and governance documents
      under diligence NDA.
    relatedQuestionRefs:
      - QV002
      - QV006
      - QV008
  - type: missing-source
    severity: minor
    topic: comparable-set
    missingEvidence: >-
      A defendable public or private comparable set with disclosed metrics that can anchor stage-appropriate valuation
      benchmarks.
    whyItMatters: The current pool supports scenario framing but not a rigorous multiple-based valuation range.
    diligencePath: >-
      Pull direct filings or financing disclosures for the closest stablecoin, payments, or infrastructure comparables
      before final pricing work.
    relatedQuestionRefs:
      - QV005
