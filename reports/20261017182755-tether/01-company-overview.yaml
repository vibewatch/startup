  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: cover-metrics reconciliation
      missingEvidence: A primary financing history, current headcount disclosure, and a management-approved metrics baseline.
      whyItMatters: Later valuation and operating-leverage analysis will be noisy if headcount, funding, and valuation are not reconciled at source.
      diligencePath: Request a management data room extract or primary board/investor materials covering valuation events, capitalization, and HR reporting.
      relatedQuestionRefs: [QO006]
      relatedTableRefs: [TO001]
    - type: enumeration-incomplete
      severity: material
      topic: leadership and founder table coverage
      missingEvidence: A current board list, executive roster, and formal ownership map that tie founders to present governance rights.
      whyItMatters: Public reporting identifies central figures but does not fully resolve who can approve strategy, financing, or related-party transactions.
      diligencePath: Obtain current board materials, shareholder agreements, and an organization chart from management counsel.
      relatedTableRefs: [TO002, TO003]
    - type: missing-source
      severity: material
      topic: headquarters and customer disclosure
      missingEvidence: A primary disclosure identifying Tether's principal headquarters, verified customer count, and a revenue figure distinct from profit.
      whyItMatters: Cover metrics should not force headquarters, customer, or revenue conclusions from jurisdictional reporting and secondary commentary.
      diligencePath: Request a current corporate fact sheet or audited management presentation that states principal office, customers, and revenue explicitly.
      relatedQuestionRefs: [QO006]
      relatedTableRefs: [TO001]
