schemaVersion: report-v2
artifact: company-overview
slug: tether
runDate: 2026-10-17
company:
  name: Tether
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Tether's retained official sources present it as a 2014-launched platform for
    moving fiat currencies digitally, while independent reporting shows it has
    become an unusually large and profitable private financial network. The
    assigned evidence supports major recent scale and expansion milestones, but
    public disclosure still does not reconcile ownership, headquarters,
    fundraising, headcount, or valuation into one clean investor-grade baseline.
sections:
  - id: identity-scale
    title: Identity, footprint, and current scale
    body: >-
      Tether's retained official pages consistently describe the company as a
      2014-launched platform for using fiat currencies in digital form, with
      USDT as the flagship product and a broader infrastructure narrative
      extending into adjacent services. Independent reporting places the company
      at a much later stage than a typical startup: Fortune reported USDT market
      capitalization at roughly $187 billion in early January 2026 and more than
      $10 billion of profit for 2025, while FinTelegram summarized Tether
      International's Q2 2026 disclosure at about $184.6 billion of USDT
      issued, $187.75 billion of assets, and $4.11 billion of excess reserves.
      The footprint picture is less settled. ICIJ reported that Tether moved
      from the British Virgin Islands to El Salvador, but the retained pool does
      not provide a primary disclosure that cleanly settles a principal
      headquarters, customer count, or revenue/run-rate figure distinct from
      profit.
    claimRefs: [CO001, CO003, CO004, CO005, CO009]
    tableRefs: [TO001]
  - id: leadership-control
    title: Leadership, founders, and control
    body: >-
      The origin story is relatively clear, but the current control map is not.
      ICIJ traced Tether back to the 2014 Realcoin project and reported that
      early ownership migrated from the founding trio toward Bitfinex-linked
      executives. Fortune's profile makes Paolo Ardoino the visible current
      operator, while ICIJ and FinTelegram both point to public filings showing
      Giancarlo Devasini with greater than 50% voting interest in a Tether
      entity. That is meaningful evidence of concentrated control, but it is not
      the same thing as a full current group cap table, board-rights schedule,
      or governance package. For later diligence work, this chapter should be
      treated as establishing who appears central to Tether rather than proving a
      fully reconciled ownership structure.
    claimRefs: [CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: capital-signals
    title: Capital signals and milestone trajectory
    body: >-
      The assigned pool supports two different kinds of scale signal: operating
      scale and strategic capital deployment. Official history materials record
      milestone growth points such as USDT crossing $1 billion of market cap in
      2017 and $100 billion in 2024, while partner-side releases show Tether
      deploying capital into regulated and Bitcoin-native infrastructure through
      the $100 million Anchorage investment and the proposed majority ownership
      of Twenty One. What remains unresolved is the clean investor baseline.
      ICIJ's 2026 estimate of roughly $200 billion of private-company value is
      directionally very different from a low-reputation August 2026 tear sheet
      that compiles public reporting around a $12 billion November 2024
      valuation, $600 million-plus funding total, and 244 employees. Those
      signals are not directly comparable, and the retained evidence does not
      include primary financing documents that would reconcile them.
    claimRefs: [CO006, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO003]
    figureRefs: [FO001]
tables:
  - id: TO001
    title: Snapshot KPI table
    columns:
      - Metric
      - Value/status
      - Date/period
      - Confidence
      - Gap/context
    rows:
      - ["Founded", "2014", "2014", "high", "Official retained sources align on a 2014 launch."]
      - ["Core product/business model", "USDT-led digital fiat and financial infrastructure platform", "current", "high", "Derived from official positioning, not a GAAP segment disclosure."]
      - ["Operating-jurisdiction signal", "Move to El Salvador reported by ICIJ", "2025-2026", "medium", "Jurisdiction shift is clearer than principal headquarters."]
      - ["USDT issued", 184.6, "Q2 2026", "medium", "FinTelegram reports Tether International's figure; unit is USD billions."]
      - ["Total assets", 187.75, "Q2 2026", "medium", "Reported from the same Q2 2026 reserve disclosure; unit is USD billions."]
      - ["2025 profit", ">10", "FY2025", "medium", "Fortune reported profit above $10 billion; this is not revenue or ARR."]
      - ["Confirmed external capital raised", null, "current", "low", "Retained pool does not contain primary financing documents establishing a clean cumulative total."]
      - ["Latest valuation signal", "~200B estimate; 12B Nov 2024 low-confidence datapoint", "2024-2026", "low", "ICIJ estimate and tear-sheet compilation are not directly comparable valuation events."]
      - ["Customer count", null, "current", "low", "Assigned evidence does not support a verified customer count."]
      - ["Headcount", null, "2026", "low", "Fortune says fewer than 200 employees while the tear sheet lists 244; conflict remains unresolved."]
    notes: >-
      Nulls mark unsupported metrics in the assigned pool. Numeric values are not
      normalized into ARR, revenue, or cash-balance proxies, and mixed valuation
      datapoints are preserved with their original uncertainty.
    claimRefs: [CO001, CO003, CO004, CO005, CO009, CO013, CO014]
  - id: TO002
    title: Leadership and founder table
    columns:
      - Person
      - Public role
      - Evidence-backed position
      - Founder-market fit or functional coverage
      - Key-person dependency
    rows:
      - ["Paolo Ardoino", "CEO", "Fortune profiles him as Tether's public operating leader; Anchorage quotes him on infrastructure strategy.", "Product, external narrative, and expansion execution", "High: visible decision-maker for strategy and U.S.-facing expansion"]
      - ["Giancarlo Devasini", "Co-founder / control figure", "ICIJ and FinTelegram link him to concentrated voting control signals and earlier ownership reshuffles.", "Ownership concentration and capital allocation", "High: current public filings imply control without a full public cap table"]
      - ["Brock Pierce", "Original Realcoin co-founder", "ICIJ traces him to the 2014 founding cohort before ownership shifted toward Bitfinex-linked executives.", "Early crypto distribution and project formation", "Historical rather than current operating dependence"]
      - ["Reeve Collins", "Original Realcoin co-founder", "ICIJ places him in the founding group that preceded the later Bitfinex-linked control structure.", "Early commercialization and launch formation", "Historical rather than current operating dependence"]
      - ["Craig Sellars", "Original Realcoin co-founder", "ICIJ places him in the founding trio behind the initial Realcoin project.", "Early token design and launch support", "Historical rather than current operating dependence"]
    notes: >-
      This is a partial public enumeration of the most visible founders and
      operators in the assigned source pool, not a complete current board or
      management register.
    enumerationScope:
      coverage: partial
      basis: >-
        Limited to founders and executives explicitly named in the retained
        official and independent source set for this chapter.
    claimRefs: [CO007, CO008, CO011]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role / relationship
      - Control or economic importance
      - Evidence-backed note
      - Diligence ask
    rows:
      - ["Giancarlo Devasini", "Co-founder and apparent control holder", "Public filings cited by third parties suggest >50% voting interest in a Tether entity.", "Most important current control signal in retained public evidence", "Obtain current cap table, voting agreements, and board-rights schedule"]
      - ["Paolo Ardoino", "CEO and public operator", "Runs external narrative and strategic expansion according to retained reporting.", "Central operating figure but not a disclosed majority owner in retained evidence", "Test succession, delegation, and key-man protections"]
      - ["Jean-Louis van der Velde", "Historic executive/shareholder", "Appears in prior ownership reconstructions but not as a clear current controller.", "Important for reconstructing control evolution", "Reconcile current title, equity, and governance rights"]
      - ["Cantor / Twenty One", "Financing and corporate-structure counterparty", "Cantor's release says Tether will be majority owner of Twenty One at closing.", "Shows Tether deploying balance-sheet strength into adjacent Bitcoin vehicles", "Review ownership percentages, governance rights, and related-party exposure"]
      - ["Anchorage Digital", "Regulated infrastructure partner", "$100 million strategic investment followed Tether's selection of Anchorage as a U.S. stablecoin issuer.", "Corroborates U.S.-facing infrastructure strategy from a partner source", "Review economics, issuance controls, and compliance responsibilities"]
      - ["SoftBank Group", "Minority partner in Twenty One transaction", "Cantor names SoftBank as a significant minority owner alongside Tether and Bitfinex.", "Signals consortium-style strategic expansion rather than isolated product investment", "Clarify economics and any governance influence over the vehicle"]
    notes: >-
      This map is intentionally partial and mixes control stakeholders with key
      counterparties because the retained public evidence does not disclose a
      complete shareholder register.
    enumerationScope:
      coverage: partial
      basis: >-
        Built from retained public reporting and partner press releases that
        identify control figures or economically important counterparties.
    claimRefs: [CO008, CO011, CO012]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Tether's retained evidence shows an arc from early stablecoin launch to
      large-scale capital deployment and renewed governance scrutiny in 2025-2026.
    data:
      items:
        - year: "2014"
          label: USDT launches and Tether adopts its current stablecoin identity
          detail: Official history materials place the launch in 2014 and frame the company around digital fiat settlement.
          tone: positive
          claimRefs: [CO001, CO010]
        - year: "2017"
          label: USDT market cap passes $1 billion
          detail: Tether's own history page marks 2017 as the first billion-dollar scale milestone.
          tone: positive
          claimRefs: [CO010]
        - year: "2020"
          label: XAUT launches
          detail: Official history materials list the launch of the gold-backed token as a key diversification step.
          tone: opportunity
          claimRefs: [CO010]
        - year: "2022"
          label: Lugano Plan B initiative launches
          detail: Tether's retained history page treats the Lugano initiative as a public ecosystem-building milestone.
          tone: neutral
          claimRefs: [CO010]
        - year: "2023"
          label: Tether starts mining and acquiring Bitcoin
          detail: Official history materials say 2023 marked direct expansion into Bitcoin mining and treasury activity.
          tone: opportunity
          claimRefs: [CO010]
        - year: "2024"
          label: USDT market cap crosses $100 billion
          detail: Tether's history page identifies 2024 as the point when USDT crossed the $100 billion threshold.
          tone: positive
          claimRefs: [CO010]
        - date: 2025-04-23
          label: Twenty One transaction announced
          detail: Cantor's press release says Tether is expected to be majority owner of the proposed Bitcoin-native vehicle at closing.
          tone: opportunity
          claimRefs: [CO012]
        - date: 2026-02-05
          label: Anchorage partnership deepens into $100 million equity investment
          detail: Anchorage says the investment followed its selection as Tether's U.S. stablecoin issuer.
          tone: opportunity
          claimRefs: [CO011]
        - date: 2026-08-07
          label: ICIJ reopens the ownership-opacity question
          detail: Independent reporting reframed Tether's scale and control disclosures as a governance issue rather than only a reserve-quality debate.
          tone: adverse
          claimRefs: [CO006, CO008]
callouts:
  - calloutType: risk
    title: Governance opacity is still a live diligence issue
    body: >-
      The retained pool is strong enough to establish Tether's scale and current
      strategic expansion, but not strong enough to produce a fully reconciled
      cap table, headquarters disclosure, funding history, or headcount baseline.
      That gap should carry forward into valuation and risk work rather than be
      treated as a solved background fact.
    claimRefs: [CO006, CO008, CO013, CO014]
