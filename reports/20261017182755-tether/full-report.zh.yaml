  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 序数评分综合了现有关于信任 / 监管姿态与流动性 / 分发触达的证据；并非供应商提供的基准数字。
    data:
      xAxis:
        label: 信任与监管姿态
        min: 1
        max: 5
        low: 争议更多
        high: 更利于机构
        description: Ordinal scoring synthesized from reserve-audit, legal, and compliance evidence in the assigned pool.
        scale: ordinal
      yAxis:
        label: 流动性与分发触达
        min: 1
        max: 5
        low: 分发更窄
        high: 分发更广
        description: >-
          Ordinal scoring synthesized from exchange reach, multi-chain support, and settlement-role evidence in the
          assigned pool.
        scale: ordinal
      points:
        - label: Tether (USDT)
          x: 2
          'y': 5
          tone: adverse
          detail: 流动性和交易所触达领先，但审计和法律遗留问题削弱了信任姿态。
        - label: USDC
          x: 5
          'y': 4
          tone: positive
          detail: 合规叙事更强，但交易对的普遍主导程度略逊于 USDT。
        - label: 生息稳定币
          x: 3
          'y': 2
          tone: warning
          detail: 用户经济性具备竞争力，但现有证据池没有显示出 USDT 级别的分发深度。
        - label: 托管交易所 / 钱包堆栈
          x: 2
          'y': 4
          tone: warning
          detail: 便利性和流动性获取能力高，但平台风险限制了信任。
        - label: 银行通道 / 国库流程
          x: 5
          'y': 2
          tone: neutral
          detail: 熟悉且符合政策取向，但原生加密结算效用弱得多。
        - label: 自托管 / 内部堆栈
          x: 3
          'y': 1
          tone: neutral
          detail: 为成熟用户提供最高控制权，但运营负担限制了采用。
    approximationNotes: 坐标轴是有证据支持的序数判断，不是来源报告的评分。它们总结了本章引用材料关于信任姿态、交易所接受度、链上经济性和替代方案便利性的论点。
