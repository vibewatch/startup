      - number: '2.2'
        title: 规模化视角与地域集中
        blocks:
          - type: paragraph
            body: >-
              公开规模数据最能说明稳定币网络；Tether 专属 SAM 或 SOM 仍无法清晰界定。DataWallet 报告称，2026 年 USDT 流通量约为 $185B，稳定币份额为 57.96%，较 60.46%
              小幅下降，但 Tether 仍是品类领导者。同一来源称 Tron 上的 USDT 超过 $90B，年初至今转账量约 $4.2T，说明最重要的可观测市场是低费率通道上的结算吞吐。地域与规模同样重要：SQ
              Magazine 及其他保留来源认为，更多使用发生在北美以外，且高度集中于亚太及其他新兴市场走廊；在那里，美元获取、通胀对冲和跨境支付比受监管的美国零售分发更重要。
