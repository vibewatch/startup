      - number: '3.2'
        title: 分发与链上经济仍有利于 Tether，但信任与合规有利于挑战者
        blocks:
          - type: paragraph
            body: >-
              Tether 的竞争优势仍是分发密度。Tether 在自有网站称，该代币是主要交易所、OTC 柜台和钱包中采用最广泛的稳定币；Coin Metrics 也独立描述 USDT
              是遥遥领先的最大稳定币。这一既有基础很重要，因为 OneBullEx
              指出，一旦稳定币成为主导交易对，交易所和交易者都会面临较高切换成本，从而进一步巩固其流动性优势。问题是，这一护城河在用户优化交易触达的场景最强，而不是在用户优化合规安心感的场景。OneBullEx 将 USDC
              描述为机构和风险敏感型持有者的首选，因为它有月度鉴证和更强的监管地位。EarnPark 的链比较还表明，Tether 的优势按网络分层：Tron 赢在低费率零售转账效用，Ethereum 则仍是更深层 DeFi
              和结算场景的入口。因此，竞争版图比简单的 USDT 对 USDC 二选一更为多元。
