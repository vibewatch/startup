  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              市场边界应从 USDT 解决的任务出发，而不是从笼统的“加密 TAM”出发。Tether 自有材料将代币定位于交易所、钱包、支付处理商、商户、金融服务和
              ATM；独立市场来源则把稳定币描述为低波动交易、汇款、储蓄和跨境结算工具。因此，相关市场包括区块链美元流动性，而不只是投机交易量。替代方案也不单一：支付场景有银行电汇和汇款通道，交易者有交易所内的法币余额，终端用户则可选择本地货币储蓄或其他稳定币。Tether
              与更广泛加密基础设施的邻接关系确实存在，但现有证据不足以把所有加密活动都算作 Tether 可变现市场。
            claimRefs:
              - CM002
              - CM014
              - CM016
