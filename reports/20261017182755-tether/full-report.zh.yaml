    summary: Tether 保留的证据展现了一条从早期稳定币发布、到大规模资本部署，再到 2025—2026 年治理审视重启的轨迹。
    data:
      items:
        - year: '2014'
          label: USDT 发布，Tether 确立当前稳定币身份
          detail: 官方历史材料将发布时间定在 2014 年，并围绕数字法币结算描述公司定位。
          tone: positive
          claimRefs:
            - CO001
            - CO010
        - year: '2017'
          label: USDT 市值突破 $1B
          detail: Tether 自有历史页面将 2017 年标为首次达到十亿美元规模的里程碑。
          tone: positive
          claimRefs:
            - CO010
        - year: '2020'
          label: XAUT 发布
          detail: 官方历史材料将黄金支持代币的发布列为关键多元化步骤。
          tone: opportunity
          claimRefs:
            - CO010
        - year: '2022'
          label: Lugano Plan B 计划启动
          detail: Tether 保留的历史页面将 Lugano 计划视为建设公开生态的里程碑。
          tone: neutral
          claimRefs:
            - CO010
        - year: '2023'
          label: Tether 开始挖矿并购买 Bitcoin
          detail: 官方历史材料称，2023 年标志着直接扩展到 Bitcoin 挖矿和国库活动。
          tone: opportunity
          claimRefs:
            - CO010
        - year: '2024'
          label: USDT 市值突破 $100B
          detail: Tether 历史页面将 2024 年确定为 USDT 突破 $100B 门槛的年份。
          tone: positive
          claimRefs:
            - CO010
        - date: 2025-04-23T00:00:00.000Z
          label: Twenty One 交易公布
          detail: Cantor 的新闻稿称，交易完成时 Tether 预计将成为拟议 Bitcoin 原生载体的大股东。
          tone: opportunity
          claimRefs:
            - CO012
        - date: 2026-02-05T00:00:00.000Z
          label: Anchorage 合作深化为 $100M 股权投资
          detail: Anchorage 称，该投资发生在其被选为 Tether 美国稳定币发行方之后。
          tone: opportunity
          claimRefs:
