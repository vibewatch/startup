      - number: '2.4'
        title: 采用限制与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              主要限制不是需求端认知，而是信任、监管和计量质量。ICIJ 称，截至 2026 年 8 月，Tether 尚未发布完整储备审计结果；DataWallet 称首次完整审计直到 2026
              年第一季度才启动，即使在大规模阶段也形成与估值相关的披露滞后。DataWallet 还报告称，超过 7,200 个钱包合计有 $4.4B
              被冻结；这很重要，因为部分用户正是为了规避干预风险才选择稳定币。欧洲是更近的监管逆风，MiCA 相关的上架与发行影响使 Tether
              最强的可观测增长更多回到非欧盟走廊。更大的分析缺口在分母质量：现有来源混用用户、钱包、商户列表、稳定币份额和转账量，公开证据仍无法拆出分层经济性或站得住脚的 Tether 专属 SAM / SOM。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: USDT 更像美元流动性基础设施
            body: 现有证据最有力地指向结算与流动性基础设施，而不是狭义的“加密代币”市场。这扩大了 Tether 的相关性，但也意味着，相比品类份额，流通量、转账量或分层经济性才是更好的可变现需求代理指标。
            calloutType: insight
            claimRefs:
              - CM002
              - CM005
              - CM014
          - type: callout
            title: 披露滞后仍是市场约束
            body: 即便披露质量滞后，Tether 的采用仍可能持续累积；但这一缺口会影响受监管分发、重视信任的买方和估值信心。现有证据支持把透明度视为商业约束，而不只是治理脚注。
