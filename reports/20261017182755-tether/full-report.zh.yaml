      - number: '7.3'
        title: 对利率、分发伙伴和管理带宽的依赖扩大剩余暴露
        blocks:
          - type: paragraph
            body: >
              Tether 的模式存在明确的外部依赖，可能压缩利润率或放大执行错误。现有证据池引用的一份 2025 年深度分析称，公司持有超过 $127B 美国国债，并报告 2025 年第二季度利润为
              $4.9B，说明相当一部分经济性来自储备收益，而非软件毛利率。官网还将 USD₮ 描述为广泛分布于交易所、OTC
              柜台、钱包、商户和多个区块链，因此渠道触达和生态支持并非附属项，而是产品本身的一部分。同时，Tether 自有企业版图已扩展至金融、电力、数据和教育；存档企业网站称其拥有 15+ 个挖矿地点和 20,000+
              枚专用于 AI 的 GPU。


              多元化故事可能变成优势，但目前也带来管理带宽和治理问题，因为公开第三方证据仍把公司描述为精简组织和异常不透明的控制结构。Tracxn 称 Tether 有 290 名员工和 357 家活跃竞争者；ICIJ
              则称公司只有几百名员工，所有权披露有限。与此同时，Tether 自有网站强调全球配合超过 2,900 起调查，并涉及近 $550M
              与伊朗相关的冻结，这使监管和银行关系成为运营依赖，而非背景信息。实际含义是：若利率下降、交易对手收窄支持，或管理层让一个仍不透明的组织同时铺开过多资本密集型邻接业务，执行风险会升高。
            claimRefs:
              - CR001
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
