      - number: '4.4'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >
              Tether
              的公开正面逻辑是：公司已达到巨大规模，大部分储备收益归自己所有，目前超额储备足以避免立即依赖融资。反对轻易纳入投资判断的逻辑是：除储备规模外，几乎所有投资级输入仍属私有——实际定价、客户结构、资金期限、公司现金、债务或项目融资义务、烧钱、诉讼准备金，以及管理层下一轮或资本重组触发条件，都未在现有来源中披露。基于可用证据，合理结论是：收入质量的大致逻辑已经清楚，利润率持久性取决于利率和赎回行为，而真正的资本充足性仍需直接尽调材料，不能靠又一轮公开网页检索解决。
