      - CV006
      - CV007
      - CV009
      - CV011
      - CV012
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - Tether 提供更有力的储备披露，融资按接近溢价的条款完成，组合投资强化支付分发。
        - 只有入场价格仍体现一定披露折价时才有上行空间；现有证据今天不支持独立的数值区间。
        - 审计仍令人失望、融资条款泄露后弱于预期，或交易完成前监管压力上升。
        - 需要新的第一手证据，而不是解读现有由传闻驱动的价格讨论。
      - - 基准
        - Tether 仍具战略重要性且保持盈利，但投资者继续对不透明性、治理和监管不确定性打折。
        - 只有在相对溢价传闻价格取得协商折价，并对储备和控制权设置严格尽调保护时，才作投资判断。
        - 即使业务本身保持韧性，价格也可能相对披露质量维持高位，留下不对称下行空间。
        - 这是当前证据集最匹配的情景：承认规模，却拒绝没有依据的精确判断。
      - - 悲观
        - 由于披露缺口与监管风险压过增长势头，融资停滞、重新定价，或转向更有利于投资者的条款。
        - 如果买方在没有审计、治理或流动性保护的情况下接受溢价定价，回报将变得缺乏吸引力。
        - 永久性资本减值、下轮融资信号，或更严格的稳定币监管，都可能迫使成交价格下移。
        - 有投资者反弹报道和储备审计问题悬而未决作为支持。
    notes: 情景为定性判断，因为现有证据缺少一手融资文件、经审计财务数据和可辩护的公开可比公司集合。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
