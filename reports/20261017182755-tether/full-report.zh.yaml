      - number: '7.2'
        title: 运营控制确实存在，但冻结与控制面仍主要靠行为性缓解
        blocks:
          - type: paragraph
            body: >
              Tether 的执法工具活跃且规模很大，但现有证据显示，其运营缓解仍主要是程序性的，而非结构性的。BitOK 的 2026 年链上审查称，Tether 在 24 个月内销毁 $1.08B
              USDT，仅过去一年就销毁 $822M，说明黑名单和销毁机制被大量使用。但同一研究称，在清洁案例的公开提交至执行冻结窗口内，有 $127.6M 离开了目标地址；约 85%
              的拉黑仍经过较慢的公开窗口；在观察期内，多签架构本身没有发生所有者或阈值变化。


              这很重要，因为下行风险并非理论问题：只要公开的待处理窗口仍可见，对手方就能抢跑。OpenZeppelin
              早期审计没有发现严重或高危问题，但确实指出了与过时导入、暂停行为和黑名单合约职责相关的中危问题；这与一个长期存在、历史上偏向渐进修补而非重构的控制面相符。对投资判断而言，关键结论是：Tether
              可以大规模执行冻结，但投资人仍需证明其高风险执法路径在结构上已经加固，而不是只在执法压力最高时选择性加速。
