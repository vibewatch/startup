      - number: '8.3'
        title: 最终尽调要求与击穿投资论点的触发因素
        blocks:
          - type: paragraph
            body: >-
              公开证据足以说明 Tether
              很重要，但不足以支持对估值或目标回报的虚假精确度。在任何价格纳入投资判断前，尽调都应强制披露储备审计范围、股权结构表所有权、控制权、优先股堆叠及任何正在进行的融资的确切状态。本章关于生态广度和资本部署的支持性证据也需要更清晰的归因，因为部分方向性背景来自聚合器或薄弱的二手来源，而非一级融资文件。击穿投资论点的触发因素很明确：若融资只有在大幅重估后才能完成、经审计的储备支持仍未出现、所有权
              / 控制权问题仍未解决，或监管压力增加而估值预期仍保持溢价，下行就会压过期权价值。反过来，如果 Tether 提供一级文件，缩小披露缺口，同时保住规模、盈利能力和战略生态触达，判断可以改善。
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV011
              - CV012
