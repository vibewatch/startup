      - number: '3.3'
        title: 流动性护城河持久，但储备信任和法律余波构成脆弱点
        blocks:
          - type: paragraph
            body: >-
              持久性的核心问题，是在市场越来越看重可审计性和监管适配时，Tether 能否保住网络效应。Tether 称每枚 USD₮ 都由储备 1:1 支持，但 ICIJ
              和法律评论都强调，这一说法并不能终结围绕信任的竞争争论。ICIJ 报道称，Tether 从未发布储备完整财务审计结果；The Antitrust Attorney 则指出，联邦法官在 2026 年 2 月批准针对
              Tether 和 Bitfinex 的买方集体诉讼，第二巡回法院在 7 月维持该裁定。Bitget 对 Coin Metrics 的总结认为，Tether
              下一阶段取决于其能否在监管压力上升时延展网络效应。这指向一个持久但收窄的护城河：在流动性和跨链触达占主导的地方，Tether
              仍难以替代；但只要买方把透明度和法律清洁度作为首要标准，合规发行方、收益型产品和银行主导的替代方案就有更多空间。
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP012
              - CP013
              - CP014
