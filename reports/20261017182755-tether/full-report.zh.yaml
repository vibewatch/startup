      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              买方版图是多边的。交易所和交易台购买深度流动性及报价货币标准；弱势货币市场的终端用户购买美元代理资产，用于储蓄和汇款；商户和网关购买可跨境结算的选项，避开卡组织或代理行摩擦；钱包和协议则购买用于结算及抵押流转的高流动性、熟悉的单位。不同分层的采用路径不同：交易所分发由流动性和互操作性拉动，支付场景则由货币不稳定、银行摩擦和既有钱包触达拉动。商户接受度已有迹象，但远薄于交易所或钱包证据，因此更适合作为辅助增长面，而非核心需求基础。
