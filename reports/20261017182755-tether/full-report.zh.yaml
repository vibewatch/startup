        blocks:
          - type: paragraph
            body: >-
              现有证据支持两类不同的规模信号：运营规模和战略资本部署。官方历史材料记录了多个增长节点，例如 USDT 市值在 2017 年突破 $1B、2024 年突破 $100B；合作方公告则显示，Tether 通过投资
              $100M 于 Anchorage，以及拟取得 Twenty One 的多数股权，将资本投入受监管和 Bitcoin 原生基础设施。尚未解决的是清晰的投资人基线。ICIJ 在 2026
              年估算这家私营公司的价值约为 $200B；而一份可信度较低的 2026 年 8 月 tear sheet 汇总公开报道，给出 2024 年 11 月 $12B 估值、超过 $600M 的融资总额和 244
