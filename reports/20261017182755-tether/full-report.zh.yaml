      - number: '8.2'
        title: 融资背景、可比对象与情景
        blocks:
          - type: paragraph
            body: >-
              现有证据池中最强的价格信号不是已完成的一轮融资，而是对融资的抵制。CoinDesk 报道称，Tether 在投资人对可能达到约 $500B 的估值表示犹豫后，缩减了最多 $20B 的融资计划，顾问转而讨论接近
              $5B 的规模。ICIJ 另称 Tether 可能价值约
              $200B，同时强调对于一家可能已跻身最有价值私营公司之列的企业，其所有权和储备披露仍异常不透明。这些证据支持情景框架，而非精确估值计算。乐观情景需要经审计的储备证明、有可信度的近溢价融资确认，以及投资组合能转化为持久分发或变现优势的证据。基准情景假设
              Tether 继续强大，但因披露、治理和监管余波而保持私有折价。悲观情景则假设交易失败、下轮融资，或买方拒绝为不透明度买单后出现倍数压缩。
