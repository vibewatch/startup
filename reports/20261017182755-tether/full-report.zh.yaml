  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 客户存款转为 USDT 负债，储备转为生息资产，扣除运营成本和赎回后的利差推动利润与超额储备。
    data:
      nodes:
        - id: customer-fiat
          label: 客户美元 / 等价物
          detail: 机构客户或交易所交付法币或等价物，以铸造 USDT。
        - id: usdt-issued
          label: 已发行 USDT
          detail: Tether 创建负债，设计为可按 1:1 赎回。
        - id: reserve-book
          label: 储备组合
          detail: 公开描述强调美国国债、回购、货币市场、现金等价物，以及规模更小但波动更高的持仓。
        - id: yield-income
          label: 收益与费用收入
          detail: 国债持有收益是核心来源；发行和赎回费用似乎处于次要地位。
        - id: profit-buffer
          label: 利润与超额储备
          detail: 公开鉴证报告提到 2026 年第二季度利润和正向储备缓冲。
        - id: adjacent-deployment
          label: 相邻资本部署
          detail: 官方渠道显示挖矿、AI 和教育计划，这些计划可能消耗或复合留存收益。
      edges:
        - from: customer-fiat
          to: usdt-issued
          label: 铸造
        - from: usdt-issued
          to: reserve-book
          label: 储备支持
        - from: reserve-book
          to: yield-income
          label: 利息、资产收益与费用
        - from: yield-income
          to: profit-buffer
          label: 扣除运营成本
        - from: profit-buffer
          to: adjacent-deployment
          label: 留存收益配置
    approximationNotes: 该图为概念示意，并非量化瀑布图；公开来源支持这一运营顺序，但不支持完整的分部利润桥接。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI005
      - CI006
      - CI009
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据支持一个分层堆栈：从多链资产和分发面，一直延伸到 WDK、开发者工具和运营控制。
    data:
      layers:
        - label: 分发与用户面
          note: Public-facing adoption surface for token movement and payment use cases.
          items:
            - label: 交易所与钱包
              note: Core liquidity and custody surfaces highlighted on the homepage.
            - label: 商户与支付服务商
              note: Commercial acceptance surface for stable-value transfers.
          outputs:
            - label: Global USDt ecosystem
              note: Tether describes a global network of exchanges, wallets, merchants, and payment providers.
        - label: 资产与协议层
          note: Reserve-backed token products delivered across several chains.
          items:
            - label: USDt, MXNt, XAUt
              note: Publicly listed token products.
          modules:
            - label: 多链传输
              note: Algorand, Celo, Cosmos, Ethereum, EOS, Liquid Network, Solana, Tezos, Ton, and Tron.
          outputs:
            - label: Cross-chain reserve-backed rails
              note: Token transfer and redemption workflow depends on protocol selection and reserve trust.
        - label: 钱包与开发者层
          note: Tether is positioning WDK as an integration substrate, not just a marketing concept.
          items:
            - label: WDK
              note: Underlying wallet infrastructure for partner-built end-user products.
          modules:
            - label: 密钥管理与签名
              note: WDK docs say partner products can rely on Tether for these under-the-hood functions.
            - label: SDK、API、文档即代码
              note: Recruiting signals point to a formal developer-documentation and example-app surface.
          outputs:
            - label: Wallet and payments integrations
              note: Supported through engineering access, solutions architects, and partner tracks.
        - label: 平台与控制层
          note: Public evidence suggests conventional platform operations beyond the token and wallet layers.
          items:
            - label: 应用、SDK、SaaS 平台、分布式系统
              note: Architecture role language implies a broad operating estate.
          modules:
            - label: Docker、Kubernetes、CI/CD
              note: Called out in the Technical Architect brief.
          outputs:
            - label: Scalable product operations
              note: The platform brief implies ongoing deployment, orchestration, and delivery discipline.
        - label: 合作伙伴赋能层
          note: Public WDK materials emphasize guided rollout rather than purely self-serve onboarding.
          items:
            - label: 解决方案架构师与工程访问
              note: Project Partners are offered direct product and engineering support.
          modules:
            - label: Project、Tech Contributor 与 Consulting 路径
              note: Tether publishes multiple partnership tracks for builders and implementers.
          outputs:
            - label: Assisted WDK launches
              note: Early API and SDK access plus privileged support are part of the value proposition.
        - label: 治理与信任层
          note: Public trust surfaces exist, but independent proof remains incomplete.
          items:
            - label: 透明度与支持协议披露
              note: Official entry points explain reserves and protocol coverage.
            - label: QA 与 AML 质量保障
              note: Current openings show explicit quality and compliance staffing.
          modules:
            - label: 漏洞赏金与安全功能入口
              note: Public links indicate where users and builders are directed for trust information.
          outputs:
            - label: Public trust-control surface
              note: These are discoverable controls, not the same thing as an independent audit or uptime history.
    approximationNotes: 这是根据公开文档和招聘信号综合出的概念运营堆栈，不是逆向还原的网络图，也不是经过验证的软件拓扑。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Tether 的公开客户旅程从分发集成开始，延伸到跨境运营使用，再进入商户接受和合作伙伴主导的地域扩张。
    data:
      nodes:
        - label: 交易所与钱包集成
          actor: Exchanges, wallets, and OTC venues
          stage: Distribution surface
          channel: Official ecosystem integrations
          touchpoints:
            - Logo-listed venues on tether.to
            - Liquidity access and settlement rails
          detail: 公开证据对加密原生渠道的集成广度支持最强。
        - label: 国库与流动性使用
          actor: Crypto-native treasuries and trading operators
          stage: Balance-sheet use
          channel: Stablecoin reserve and settlement behavior
          touchpoints:
            - Treasury management
            - Instant settlement inside crypto markets
          detail: 独立分析将国库列为主要商业使用群体之一。
        - label: 跨境供应商与薪资流
          actor: Suppliers, exporters, payroll platforms, and contractors
          stage: Operational payment use
          channel: Faster and lower-cost international settlement
          touchpoints:
            - Supplier payments
            - Contractor payouts
            - Remittance corridors
          detail: 支付效用是证据池中最清晰、最不依赖投机的需求叙事。
        - label: 商户接受与新兴市场储蓄
          actor: Merchants and end users
          stage: Checkout and store-of-value use
          channel: Merchant directories and emerging-market demand
          touchpoints:
            - 2,100+ USDT-accepting companies in Cryptwerk
            - Merchant and saver use cases
          detail: 公开证据支持广度，但不支持商户留存或 GMV。
        - label: 合作伙伴主导的本地化
          actor: Local exchanges and ecosystem partners
          stage: Geographic expansion
          channel: Education, onboarding, and product launch programs
          touchpoints:
            - Bitqik education program in Laos
            - Lao-language content and workshops
          detail: 扩张可见，但通常仍停留在漏斗顶部，尚未得到群体验证。
        - label: 新机构与消费者产品
          actor: Institutions and consumers in Africa and the GCC
          stage: Product expansion loop
          channel: Shiga wallet infrastructure partnership
          touchpoints:
            - Self-custodial finance products
            - USD₮, Bitcoin, and XAU₮ support
          detail: 官方证据显示，合作伙伴推动的扩张已超越传统仅面向交易所的分发。
    approximationNotes: 旅程图展示渠道推进和扩张循环，不代表转化率或逐阶段群体留存。
    claimRefs:
      - CU001
      - CU004
      - CU009
      - CU010
      - CU016
