      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 正面投资判断前的致命标准
            body: >-
              除非能够审阅签署版 2026 年审计报告及其范围、证明冻结窗口加固是结构性的而非选择性的，并且 2026 年诉讼 / 监管堆栈得到缓解而非扩大，否则不要把 Tether
              当作普通规模故事纳入投资判断。新的储备披露失败、集体诉讼实体裁决不利，或扩张速度超过治理带宽，都应视为击穿投资论点的触发因素。
