  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律余波是第一项致命标准
        blocks:
          - type: paragraph
            body: >
              Tether 的核心法律风险在于，公司关于储备支持的说法与投资人能从现有公开记录中验证的内容之间存在差距。Tether 称每枚代币都有 100% 储备支持，并每日发布流通量、每季度发布储备信息。ICIJ 于
              2026 年 8 月 7 日报道称，公司尚未发布完整审计结果；后来的三手报道称 KPMG US 在 8 月完成了 Tether International 2025 年财务报表的无保留审计，但同时表示
              Tether 没有公开发布报告。ICIJ 还称，Tether 在 2021 年因储备误述支付了 $41M 罚款，而经 ICIJ
              审阅的萨尔瓦多文件没有披露当前所有权。这并不能证明资不抵债，但无法取得的审计范围和报告仍留下重大保证问题。


              诉讼堆栈也仍在进行，而不是历史遗留问题。Tether / Bitfinex 加密资产诉讼在 2026 年进入集体诉讼阶段，尽管因果关系仍是简易判决争议，但经济下行风险因此上升。BitOK
              的报道还增加了市场准入角度：Tether 未取得 MiCA 授权，相关制度生效后，若干交易所已在 EEA 下架
              USDT。综合来看，法律态势不是“已证明致命”，但足够严重：新的执法行动、不利的实体裁决，或无法审阅已完成审计及其范围，都应视为击穿投资论点，而不是日常噪声。
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR009
              - CR011
              - CR016
