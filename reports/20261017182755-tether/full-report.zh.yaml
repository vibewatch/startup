  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 规模和表面盈利能力支持继续关注，但披露与融资摩擦使建议停留在跟踪或重新定价。
    data:
      nodes:
        - label: 规模与分发
          detail: 多链发行以及广泛的交易所和钱包可用性，表明其具备战略相关性。
        - label: 储备支持叙事
          detail: Tether 称代币由 100% 储备支持，并发布透明度更新。
        - label: 资本火力
          detail: 第三方报道提到高额利润和 2026 年资产负债表投资。
        - label: 估值反弹
          detail: 据报道，投资者抵制可能意味着约 $500B 估值的融资流程。
        - label: 审计与治理拖累
          detail: 没有完整储备审计，所有权披露又有限，使投资判断风险维持高位。
        - label: 建议
          detail: 跟踪该资产；在作投资判断前，要求更好的披露或显著更低的入场价格。
    approximationNotes: 该流程为定性判断，反映证据方向，而非加权评分模型。
