  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Tether 具有战略重要性且规模明确，但本章的公开投资判断材料明显弱于 2026 年融资报道中呈现的估值野心。核心正面逻辑是：USDT 仍广泛分发，Tether
              将自己描述为由完整储备支持，第三方报道则称利润巨大，并积极向相邻支付基础设施部署资本。核心负面逻辑是：据报道，投资人抵制过一轮可能隐含约 $500B
              估值的融资进程，而调查报道仍指出储备没有完整审计；这种规模的企业，所有权披露也异常有限。综合来看，最干净的价格敏感型建议是持续跟踪该资产，只有在尽调质量改善或入场价格明显低于传闻驱动的估值标记时才参与。
            claimRefs:
              - CV001
