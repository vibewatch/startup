    sections:
      - number: '4.1'
        title: 核心盈利引擎是储备收益，而非软件定价
        blocks:
          - type: paragraph
            body: >
              现有证据一贯将 Tether 描述为变现储备浮存金，而不是收取广泛的软件订阅费。The Block 称，USDT 铸造时 Tether
              会收到美元或等价物，再将大部分余额投向短期美国国债及其他低风险资产，并在扣除运营成本后保留利差。tether.to 的官方文案也与这一机制一致：每枚 Tether
              代币都由储备支持，储备包括传统货币、现金等价物和其他资产，并每日披露流通量、每季度更新储备。公开费率披露确实存在，但看起来次于储备收益，因此收入质量更多由资产负债表规模和短端利率决定，而不是由公开披露的客户费率决定。
