          - type: paragraph
            body: >
              现有证据最强的资本充足性信号，是当前盈利和超额储备缓冲，而不是公开披露的公司现金余额。ValueTheMarkets 引用 BDO 鉴证报告称，Tether 在 2026 年第二季度实现 $1.5B
              净运营利润，季度末持有 $187.75B 资产、负债为 $183.64B，留下 $4.11B 储备缓冲。这是有意义的安全垫，但同一报告称该缓冲已从第一季度末的 $8.23B
              下降；这很重要，因为该模式暴露于利率压缩和赎回压力。独立的负面报道还称 Tether 尚未出具完整审计，并因涉嫌市场操纵持续诉讼，因此资本故事在财务上令人印象深刻，但披露仍偏薄。
