        title: 领导层、创始人与控制权
        blocks:
          - type: paragraph
            body: >-
              起源故事相对清楚，但当前控制版图并不清晰。ICIJ 将 Tether 追溯至 2014 年的 Realcoin 项目，并报道称早期所有权从创始三人组逐步转向与 Bitfinex 相关的高管。Fortune
              的人物介绍将 Paolo Ardoino 描绘为当前公开可见的运营者；ICIJ 和 FinTelegram 则都指出，公开文件显示 Giancarlo Devasini 在某个 Tether 实体中拥有超过
              50% 的投票权益。这足以证明控制权高度集中，但不等于完整的当前集团股权结构表、董事会权利安排或治理文件。后续尽调应把本章视为确认谁看起来是 Tether 的核心人物，而不是证明所有权结构已经完整对齐。
