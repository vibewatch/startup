  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 立场
      - 论点
      - 哪些证据会改变判断
    rows:
      - - 正方
        - Tether 拥有多链分发能力，并将 USDT 描述为采用最广泛的稳定币，这支持其持续的流动性相关性。
        - 独立的使用、结算或客户集中度证据，可将这一判断从战略规模提升为可纳入投资判断的护城河。
      - - 正方
        - 第三方报道指向约 $10B 的年利润，以及不断增加的美国国债和黄金敞口，意味着资产负债表具备可观的承载能力。
        - 经审计的一手财务报表或完整储备审计，才能把这一报道中的优势转化为可用于融资判断的证据。
      - - 正方
        - Tether 正通过 Utexo、Plenti 等 2026 年投资，把资本重新投入支付基础设施。
        - 若证据显示这些投资带来了可量化的分发、交易量或抽成率优势，就足以支持战略溢价。
      - - 反方
        - 投资者抵制接近 $500B 的传闻估值，说明公开价格发现机制已经在抵制这一溢价。
        - 若能与可信交易对手按接近该条款完成融资，将削弱交易落空或下轮融资的担忧。
      - - 反方
        - ICIJ 称 Tether 从未公布储备完整财务审计的结果，使核心估值风险悬而未决。
        - 完整审计或同等有力的一手披露，可消除最大的投资判断障碍之一。
      - - 反方
        - 对 Tether 这样的规模而言，其所有权与控制权仍异常不透明，增加了治理和优先股堆叠的不确定性。
        - 当前股权结构表、控制权摘要和融资条款包，将显著提升投资判断的可行性。
    notes: 论点混合了公司说法、调查报道和有限的二手融资背景；本表强调哪些证据会改变判断。
    claimRefs:
