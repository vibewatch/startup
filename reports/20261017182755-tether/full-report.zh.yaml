  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争版图覆盖直接同业、收益型邻接产品和非发行方替代方案
        blocks:
          - type: paragraph
            body: >-
              Tether 首先与其他锚定法币的稳定币竞争，其中 Circle 的 USDC 最直接，因为选择加密原生美元的买方关心交易所覆盖、赎回信心，以及代币能否在交易、支付和钱包通道中被接受。直接同业还在扩大：Coin
              Metrics 称 USDC 借监管势头重新站稳；Ethena 的 USDe、Sky 的 USDS
              和代币化货币市场基金等收益型替代品也在获得份额，因为用户开始寻找收益分配，而不只是支付效用。替代方案并不局限于稳定币发行方。EarnPark
              的钱包指南显示，自托管、硬件钱包和交易所托管会改变用户的控制、恢复和费用模式；因此，一些买方可以改变钱包架构来解决同一资金管理或结算任务，而不必更换发行方。对受监管或被动持有者而言，传统银行通道和内部资金管理栈仍是现状替代方案，尽管它们缺少
              Tether 全天候的交易流动性。
