  evidenceGaps:
    - type: missing-source
      severity: material
      topic: reliability-controls
      missingEvidence: Public uptime history, incident postmortems, security certifications, or independent technical attestations for WDK and related wallet operations.
      whyItMatters: Without independent operating proof, the chapter can verify scope and intent but not whether the newer developer-facing stack performs reliably in production.
      diligencePath: Request status-history exports, incident logs, SOC or ISO evidence if any, penetration-test summaries, and the current security-review package for wallet infrastructure.
      relatedQuestionRefs: [QE006]
    - type: private-evidence-only
      severity: material
      topic: partner-adoption
      missingEvidence: Production customer count, retained partner roster, transaction volume, and deployment maturity for WDK and adjacent products.
      whyItMatters: Product-market fit for developer infrastructure depends on real integrator adoption, not just documentation and partner-program language.
      diligencePath: Obtain a customer reference list, production deployment counts, integration funnel metrics, and renewal or expansion evidence for WDK partners.
      relatedQuestionRefs: [QE004, QE008]
      relatedTableRefs: [TE001, TE002]
    - type: missing-source
      severity: minor
      topic: independent-benchmarking
      missingEvidence: Independent practitioner benchmarks, repo or package telemetry, and named third-party technical case studies specific to Tether's wallet and developer stack.
      whyItMatters: The assigned pool relies heavily on company-issued documentation and recruiting proxies, which is enough to map the stack but not enough to benchmark external developer traction.
      diligencePath: Request official repository and package links, customer engineering references, and any public or private benchmarking of WDK integrations versus alternatives.
      relatedQuestionRefs: [QE008]
