  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - - Thesis
        - Tether has multi-chain distribution and describes USDT as the most widely adopted stablecoin, supporting durable liquidity relevance.
        - Independent usage, settlement, or customer concentration evidence would strengthen this from strategic scale to underwritable moat.
      - - Thesis
        - Third-party reporting describes roughly $10 billion of annual profit and growing Treasury and gold exposure, implying meaningful balance-sheet capacity.
        - Primary audited financial statements or a full reserve audit would convert this from reported strength into financeable evidence.
      - - Thesis
        - Tether is redeploying capital into payment infrastructure through 2026 investments such as Utexo and Plenti.
        - Evidence that these investments drive measurable distribution, transaction volume, or take-rate advantages would justify strategic premium.
      - - Anti-thesis
        - Investor resistance to a reported valuation near $500 billion suggests public price discovery is already pushing back on the premium.
        - A completed financing at or near those terms with credible counterparties would weaken the no-deal or down-round concern.
      - - Anti-thesis
        - ICIJ says Tether has never released results of a full financial audit of its reserves, leaving a central valuation risk unresolved.
        - A full audit or equivalently strong primary disclosure would remove one of the biggest underwriting blockers.
      - - Anti-thesis
        - Ownership and control remain unusually opaque for a company of Tether's scale, raising governance and preference-stack uncertainty.
        - A current cap table, control-rights summary, and financing-term package would materially improve underwriteability.
    notes: Arguments mix company claims, investigative reporting, and thin secondary financing context; the table highlights what evidence would move the call.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV006
      - CV007
      - CV009
      - CV011
      - CV012
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - Tether delivers stronger reserve disclosure, fundraising clears near premium terms, and portfolio investments strengthen payments distribution.
        - Upside exists only if entry still reflects some disclosure discount; the assigned evidence does not support a standalone numeric range today.
        - Audit still disappoints, financing terms leak weaker than expected, or regulatory pressure rises before deal close.
        - Would require new primary evidence rather than interpretation of existing rumor-driven price talk.
      - - Base
        - Tether remains strategically important and profitable, but investors continue to haircut opacity, governance, and regulatory uncertainty.
        - Underwrite only at a negotiated discount to premium rumor marks and with hard diligence protections around reserves and control rights.
        - Price can stay elevated relative to disclosure quality, leaving asymmetric downside even if the business itself remains resilient.
        - Best fit for current evidence set because it recognizes scale while refusing unsupported precision.
      - - Bear
        - Fundraising stalls, reprices, or shifts to investor-friendly terms because disclosure gaps and regulatory risk outweigh momentum.
        - Returns become unattractive if buyers absorb premium pricing without audit, governance, or liquidity protections.
        - Permanent capital impairment, down-round signaling, or tighter stablecoin regulation can all force a lower clearing price.
        - Supported by reported investor pushback and unresolved reserve-audit concerns.
    notes: Scenarios are qualitative because the assigned evidence lacks primary financing documents, audited financials, and a defendable public comparable set.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
