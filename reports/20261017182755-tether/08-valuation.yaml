chapter:
  number: 8
  title: Valuation
  summary: Tether has evident scale, distribution, and apparent profit capacity, but the assigned evidence does not justify underwriting a premium private valuation on trust alone. Reported investor resistance to a proposed $500 billion mark, combined with missing full reserve audit and opaque ownership disclosure, supports a track-or-reprice stance rather than a buy call.
sections:
  - id: recommendation-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      Tether is strategically important and clearly scaled, but the public underwriting
      package in this chapter is materially weaker than the valuation ambition
      reported in 2026 fundraising coverage. The core positive case is that USDT
      remains broadly distributed, Tether presents itself as fully reserve-backed,
      and third-party reporting describes very large profits plus active capital
      deployment into adjacent payments infrastructure. The core negative case is
      that investors reportedly resisted a fundraising process that could have
      implied roughly $500 billion, while investigative reporting still flags no
      full audit of reserves and unusually limited ownership disclosure for a
      business of this scale. On that mix, the clean price-sensitive recommendation
      is to track the asset and only engage if diligence quality improves or entry
      pricing resets materially below rumor-driven marks.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV006
      - CV007
      - CV008
      - CV009
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: financing-context-and-scenarios
    title: Financing context, comparables, and scenarios
    body: >-
      The strongest public price signal in the assigned pool is not a completed
      round but resistance to one. CoinDesk reported that Tether scaled back plans
      to raise up to $20 billion after investors balked at a valuation that could
      have reached about $500 billion, and advisers were instead discussing
      something closer to $5 billion. ICIJ separately framed Tether as likely
      worth around $200 billion, while also stressing that ownership and reserve
      disclosure remain unusually opaque for a company that may already rank among
      the most valuable private firms. That evidence supports scenario framing
      rather than precise valuation math. A bull case requires audited reserve
      proof, credible confirmation that financing can clear near premium terms,
      and evidence that portfolio investments convert into durable distribution or
      monetization advantages. The base case assumes Tether stays powerful but
      privately discounted for disclosure, governance, and regulatory overhang.
      The bear case assumes no-deal, a down-round, or multiple compression once
      buyers refuse to pay for opacity.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
      - CV013
    tableRefs:
      - TV002
      - TV003
  - id: final-diligence-asks-and-kill-criteria
    title: Final diligence asks and thesis-break triggers
    body: >-
      Public evidence is good enough to say Tether matters, but not good enough
      to support false precision on valuation or target returns. Before
      underwriting any price, diligence should force disclosure on reserve audit
      scope, cap-table ownership, control rights, preference stack, and the exact
      status of any ongoing fundraising. The chapter's supportive evidence on
      ecosystem breadth and capital deployment also needs sharper attribution,
      because some directional context comes from aggregators or thin secondary
      sources rather than primary financing documents. Thesis-break triggers are
      straightforward: if fundraising only clears after a sharp reprice, if
      audited reserve support still fails to appear, if ownership/control
      questions remain unresolved, or if regulatory pressure increases while
      valuation expectations stay premium, downside dominates optionality.
      Conversely, the view can improve if Tether supplies primary documentation
      that narrows the disclosure gap while preserving scale, profitability, and
      strategic ecosystem reach.
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV007
      - CV011
      - CV012
      - CV013
      - CV014
