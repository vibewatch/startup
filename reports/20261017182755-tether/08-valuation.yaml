  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financing-terms
      missingEvidence: Current fundraising documents, investor rights, liquidation preferences, and any confirmed post-money valuation.
      whyItMatters: Without live terms, the chapter can reject overpriced entry but cannot underwrite a target return or defend a numeric valuation range.
      diligencePath: Request the latest deck, cap table, term sheet, and any signed financing documents directly from the company or lead investors.
      relatedQuestionRefs:
        - QV001
        - QV003
        - QV005
    - type: private-evidence-only
      severity: material
      topic: reserves-and-governance
      missingEvidence: Full reserve audit results, current cap table, control-rights summary, and audited entity-level financial statements.
      whyItMatters: Reserve quality and governance transparency are central to both downside protection and any premium multiple justification.
      diligencePath: Obtain the latest audit package, reserve-attestation workpapers, ownership schedule, and governance documents under diligence NDA.
      relatedQuestionRefs:
        - QV002
        - QV006
        - QV008
    - type: missing-source
      severity: minor
      topic: comparable-set
      missingEvidence: A defendable public or private comparable set with disclosed metrics that can anchor stage-appropriate valuation benchmarks.
      whyItMatters: The current pool supports scenario framing but not a rigorous multiple-based valuation range.
      diligencePath: Pull direct filings or financing disclosures for the closest stablecoin, payments, or infrastructure comparables before final pricing work.
      relatedQuestionRefs:
        - QV005
