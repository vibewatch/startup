    title: Recommendation logic
    type: flow
    summary: Scale and apparent profitability support interest, but disclosure and financing friction keep the recommendation at track or reprice.
    data:
      nodes:
        - label: Scale and distribution
          detail: Multi-chain issuance and broad exchange and wallet availability indicate strategic relevance.
        - label: Reserve-backed narrative
          detail: Tether says tokens are 100% backed and publishes transparency updates.
        - label: Capital firepower
          detail: Third-party reporting cites large profits and 2026 balance-sheet investments.
        - label: Valuation pushback
          detail: Reported investors resisted a financing process that could have implied about $500 billion.
        - label: Audit and governance overhang
          detail: No full reserve audit and limited ownership disclosure keep underwriting risk elevated.
        - label: Recommendation
          detail: Track the asset and require better disclosure or a materially lower entry price before underwriting.
    approximationNotes: The flow is qualitative and reflects the direction of the evidence rather than a weighted scoring model.
