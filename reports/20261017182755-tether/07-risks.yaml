chapter:
  number: 7
  title: "Risks"
  summary: "Tether's highest risks are not generic crypto volatility but limited public visibility into reserve assurance and ownership, live regulatory and litigation overhang, and an enforcement control plane that independent researchers say still leaves exploitable freeze windows. A tertiary source reports that KPMG completed a 2026 audit, but the assigned evidence does not include the audit report or its scope."
sections:
  - id: "regulatory-and-legal-overhang"
    title: "Regulatory and legal overhang is the first kill criterion"
    body: |
      Tether's core legal risk is the gap between what the company says about backing and what investors can verify from the assigned public record. Tether states that every token is 100% backed and that it publishes daily circulation and quarterly reserve information. ICIJ reported on 7 August 2026 that the company had not released full-audit results; a later tertiary account says KPMG US completed an unqualified audit of Tether International's 2025 financial statements in August, while also saying Tether did not publicly release the report. ICIJ also says Tether paid a $41 million fine in 2021 over reserve misrepresentation and that El Salvador filings reviewed by ICIJ do not disclose current ownership. This does not prove insolvency, but the unavailable audit scope and report leave material assurance questions open.

      The litigation stack is also still live rather than historical. The Tether/Bitfinex crypto-asset litigation survived into class status in 2026, which raises the economic downside even though causation remains a summary-judgment fight. BitOK's reporting adds a separate market-access angle: Tether did not obtain MiCA authorization and USDT was delisted in the EEA by several exchanges after the regime took effect. Put together, the legal posture is not "proven fatal," but it is serious enough that a fresh enforcement action, an adverse merits ruling, or inability to review the completed audit and its scope should be treated as thesis-breaking rather than routine noise.
    claimRefs: ["CR002", "CR003", "CR004", "CR005", "CR009", "CR011", "CR016"]
    tableRefs: ["TR001"]
  - id: "operational-and-control-plane-risks"
    title: "Operational controls exist, but the freeze and control plane still looks behaviorally mitigated"
    body: |
      Tether's enforcement tooling is active and large-scale, but the available evidence says its operational mitigation is still mostly procedural rather than structural. BitOK's 2026 on-chain review says Tether destroyed $1.08 billion of USDT over 24 months and $822 million in the last year alone, showing that the blacklist-and-burn machinery is heavily used. The same research, however, says $127.6 million left targeted addresses during the public submit-to-execute freeze window on clean cases, that roughly 85% of blacklistings still run through that slower public window, and that the multisig architecture itself saw zero owner or threshold changes across the observed period.

      That matters because the downside is not theoretical: as long as a public pending window remains visible, counterparties can race it. OpenZeppelin's earlier audit did not find critical or high severity issues, but it did identify medium-severity problems around outdated imports, pause behavior, and blacklist-contract responsibilities, which is directionally consistent with a long-lived control surface that has historically favored incremental fixes over redesign. For investment underwriting, the key conclusion is that Tether can enforce at scale, but investors still need proof that its high-stakes enforcement path is structurally hardened rather than selectively accelerated when law enforcement pressure is highest.
    claimRefs: ["CR006", "CR007", "CR008", "CR010"]
    tableRefs: ["TR002"]
  - id: "dependency-and-execution-risks"
    title: "Dependencies on rates, distribution partners, and management bandwidth widen residual exposure"
    body: |
      Tether's model has clear external dependencies that can compress margins or amplify execution mistakes. A 2025 deep-dive cited by the assigned pool says the company held more than $127 billion in U.S. Treasuries and reported $4.9 billion of Q2 2025 profit, implying that a meaningful share of economics depends on reserve yield rather than software gross margin. The official site also frames USD₮ as broadly distributed across exchanges, OTC desks, wallets, merchants, and multiple blockchains, so channel access and ecosystem support are not incidental; they are part of the product itself. In parallel, Tether's own corporate surface now spans finance, power, data, and education, and the archived corporate site claims 15+ mining sites and 20,000+ AI-dedicated GPUs.

      The diversification story may become a strength, but today it raises management-bandwidth and governance questions because public third-party evidence still describes a lean organization and unusually opaque control structure. Tracxn says Tether has 290 employees and 357 active competitors, while ICIJ describes only a few hundred staff and limited ownership disclosure. Meanwhile, Tether's own site emphasizes support for more than 2,900 investigations globally and nearly $550 million in Iran-linked freezes, which makes regulatory and banking relationships operational dependencies rather than background context. The practical read-through is that execution risk rises if rates fall, counterparties narrow support, or management stretches a still-opaque organization across too many capital-intensive adjacencies at once.
    claimRefs: ["CR001", "CR012", "CR013", "CR014", "CR015", "CR016"]
    tableRefs: ["TR003"]
    figureRefs: ["FR001"]
