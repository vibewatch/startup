  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: reserve-transparency
      missingEvidence: A full third-party audit of reserves and a cleaner public breakdown of reserve eligibility.
      whyItMatters: Trust-sensitive competitor comparisons hinge on whether Tether can match the transparency standards that help USDC and bank-led substitutes win regulated flows.
      diligencePath: Request the latest full audit, reserve composition detail, and any jurisdiction-specific compliance attestations directly from management.
      relatedQuestionRefs: [QP002, QP006]
    - type: access-blocked
      severity: minor
      topic: asia-regional-benchmark
      missingEvidence: A readable independent regional market note on Tether positioning in Asia or Korea.
      whyItMatters: Tether's distribution moat is strongest in cross-border and exchange-heavy geographies, so regional competitive evidence would sharpen whether that lead is durable or policy-fragile.
      diligencePath: Replace the unreadable Xangle page with another assigned or later-approved independent regional benchmark before using region-specific share claims.
      relatedQuestionRefs: [QP008]
