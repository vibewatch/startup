company:
  name: Valo Health
chapter:
  number: 6
  title: Customers
  summary: Valo Health's public customer evidence is concentrated in partnership-based discovery collaborations with large pharmaceutical companies rather than self-serve software adoption. Named relationships with Novo Nordisk, Merck KGaA, Pfizer, Charles River, and Lundbeck show commercial reach, but public sources do not disclose active-user counts, retention, realized revenue, or program-level conversion.
sections:
  - id: buyer-and-use-case
    title: Buyer, payer, and use-case segmentation
    body: Valo's apparent buyer is enterprise biopharma, while the operational users are discovery, translational-biology, chemistry, and portfolio teams. The public material describes a partnership model in which Valo supplies human-data analysis, causal-biology target selection, and closed-loop chemistry, and the pharmaceutical partner supplies disease-area priorities, development resources, and downstream commercialization capacity. The customer is therefore not an individual software seat or a broad clinical provider network; it is a strategic sponsor purchasing access to a discovery engine and a portfolio of potential programs. The evidence supports distinct use cases in cardiometabolic disease, Parkinson's disease and related disorders, autoimmune disease, and neuroscience. Pricing is not publicly listed, and the available descriptions emphasize upfront, milestone, research-funding, royalty, or equity economics rather than recurring subscription revenue. That structure can support large contract value but makes customer durability dependent on scientific milestones, partner priorities, and contract continuation.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-commercial-trajectory
    title: Adoption trajectory and commercial proof
    body: "Public adoption proof is strongest at the relationship level: Valo has announced or been described in collaborations with Novo Nordisk, Merck KGaA, Pfizer through Flagship Pioneering, Charles River, and Lundbeck. The Novo relationship expanded from an 11-program collaboration formed in 2023 to a stated opportunity covering up to 20 programs, while the Merck relationship was described as a new Parkinson's-focused discovery collaboration. These are meaningful enterprise commitments, but they are not equivalent to active customers, deployed seats, renewal rates, or recognized revenue. The public record also shows a mixed durability signal: partnerships expanded while an internal diabetic-retinopathy program was paused after it failed primary and secondary efficacy endpoints. That combination suggests partner demand for platform-enabled discovery can coexist with asset-level attrition. No public denominator supports a conversion funnel from targets to preclinical candidates to clinical programs, so program counts and milestone ceilings should be read as contract scope or potential value, not delivered customer outcomes."
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
  - id: named-customer-proof-and-risks
    title: Named customer proof, retention, and concentration
    body: "Named counterparties provide customer-proof evidence, but the available sources mostly describe collaborations, intended work, or potential economics rather than independently verified production outcomes. Novo Nordisk is the clearest repeat-partner signal because the collaboration expanded and covers multiple cardiometabolic programs. Merck provides a separate neurology buyer and a large potential milestone envelope. Pfizer access is described through Flagship Pioneering's multi-program agreement, and Charles River is described as a platform relationship that also supports work adopted by Lundbeck. The evidence does not disclose which programs are active, whether any partner has renewed after a completed milestone, or what share of Valo's economics comes from its largest counterparty. A concentration risk therefore remains: a small number of strategic pharma relationships may carry much of the commercial pathway, while a failed internal asset demonstrates that platform engagement does not ensure clinical success. Diligence should obtain signed statements of work, current program status, milestone recognition, renewal/termination terms, and partner-level revenue concentration."
    claimRefs: [CU009, CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
    figureRefs: [FU001]
