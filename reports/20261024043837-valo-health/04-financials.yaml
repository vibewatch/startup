      - [Merck KGaA collaboration, "Upfront and milestone payments, R&D funding, and potential royalties", "Up to more than $3B in upfront and potential milestone payments", "Potential consideration tied to discovery and development outcomes", "Upfront amount received, milestone definitions, timing, and accounting treatment"]
      - [Research grants, "Target-validation grant funding", "MJFF grant awarded; amount not disclosed", "Non-dilutive research support, not recurring commercial revenue", "Grant amount, reimbursement mechanics, restrictions, and cost coverage"]
      - [Platform subscription or license, "No standalone public price found", null, "Recurring software revenue is not established", "Customer invoices, access fees, contract term, and renewal history"]
    notes: "Public deal figures are maximum or near-term packages and do not establish recognized revenue, cash receipts, ARR, or probability-weighted value; null means unavailable, not zero."
    claimRefs: [CI001, CI002, CI003, CI004, CI010, CI015]
  - id: TI002
    title: Pricing and monetization
    columns: [Contract basis, List versus realized price, Public disclosure, Underwriting treatment]
    rows:
      - ["Novo: near-term package plus milestones and royalties", "Realized amount not disclosed", "Up to $190M near-term and about $4.6B potential milestones", "Model only verified receipts and probability-weighted milestones"]
      - ["Merck: upfront, milestones, R&D funding, and royalties", "Realized amount not disclosed", "Up to more than $3B in upfront and potential milestone payments", "Separate fixed funding from contingent consideration"]
      - ["Platform access or discovery service", "No list or realized price disclosed", "AI Health Index reports pricing as not published", "Do not infer ACV, discounts, recurring revenue, or margin"]
    notes: "The assigned evidence describes collaboration economics rather than a price list; amounts labeled 'up to' are contractual ceilings or packages, not observed revenue."
    claimRefs: [CI001, CI002, CI004, CI015]
  - id: TI003
    title: Unit economics and capital inputs
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Recognized revenue, null, Low, "No revenue by period or contract is disclosed", "Audited revenue by contract, period, and recognition policy"]
      - [Gross margin, null, Low, "Data, AI, laboratory, tissue-model, and CRO costs are visible but unquantified", "Gross-margin bridge separating reimbursed and unreimbursed work"]
      - [CAC and sales cycle, null, Low, "Large partnerships are visible, but acquisition spend and cycle length are absent", "Business-development spend, pipeline, win rate, and cycle length"]
      - [Program conversion, null, Low, "Current sources show discovery and preclinical activity without a complete conversion denominator", "Dated program register, stage transitions, kill rates, and cost-to-go"]
      - [Internal clinical exposure, "114 actual participants in SPECTRA Phase 2", Medium, "A multicenter trial indicates capital exposure beyond computational discovery", "Study spend, committed obligations, and wind-down costs"]
      - [Current cash and runway, null, Low, "Liquidity cannot be inferred from historical financing or deal ceilings", "Latest balance sheet and monthly cash forecast"]
      - [Burn and debt, null, Low, "Financing dependency and downside runway remain unknown", "Monthly burn by function, debt schedule, and covenants"]
      - [Partner funding, "Novo and Merck include near-term, research-funding, or milestone components", Medium, "Can offset R&D cost but timing and probability are undisclosed", "Executed contracts, invoices, receipts, and milestone probability"]
    notes: "Null values are unavailable public inputs, not zeroes. The table does not impose SaaS metrics on a discovery-partnership model, and potential deal value is distinct from cash available."
    claimRefs: [CI001, CI002, CI005, CI006, CI007, CI009, CI013, CI014, CI015]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: "The public model converts discovery work into a mix of near-term payments, research support, contingent milestones, and potential royalties rather than a disclosed subscription."
    data:
      nodes:
        - id: discovery-engine
          label: "Human data and Opal discovery"
          detail: "Licensed data, AI, biology, chemistry, and laboratory work generate targets and preclinical compounds."
        - id: partner-program
          label: "Partnered program"
          detail: "A pharmaceutical partner funds or collaborates on a disease-area program."
        - id: near-term
          label: "Upfront / near-term consideration"
          detail: "Disclosed in the Novo and Merck structures, but verified receipts are not public."
        - id: research-support
          label: "Research funding or grant"
          detail: "Merck R&D funding and the MJFF grant support research, with incomplete amount disclosure."
        - id: milestones
          label: "Potential milestones"
          detail: "Large headline pools depend on future program events and are not current revenue."
        - id: royalties
          label: "Potential royalties"
          detail: "Valo may retain product-sale royalties while partners lead later development."
      edges:
        - {from: discovery-engine, to: partner-program}
        - {from: partner-program, to: near-term}
        - {from: partner-program, to: research-support}
        - {from: partner-program, to: milestones}
        - {from: partner-program, to: royalties}
    approximationNotes: "This is a mechanism map, not a forecast, accounting bridge, probability-weighted valuation, or value-proportional diagram."
    claimRefs: [CI003, CI005, CI010, CI015]
