company:
  name: Valo Health
chapter:
  number: 4
  title: Financials
  summary: "Valo Health has shifted toward a partner-funded discovery model built on near-term payments, research funding, milestones, and potential royalties. The model has strategic validation, but public evidence does not disclose recognized revenue, cash, burn, margin, milestone probability, or program-level economics, leaving capital adequacy unquantifiable."
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: "Valo's visible monetization is collaboration-led rather than a public software subscription. Independent sources describe the expanded Novo Nordisk relationship as including up to $190 million of near-term consideration and about $4.6 billion of potential milestones across as many as 20 programs. The Merck KGaA relationship adds upfront and potential milestone payments totaling up to more than $3 billion, plus research funding and potential royalties. Those amounts describe contractual structures and ceilings, not recognized revenue, ARR, current cash, or probability-weighted value. A separate Michael J. Fox Foundation grant adds non-dilutive research support, although the assigned evidence does not disclose its amount. No public list price, realized contract price, royalty rate, discount schedule, or revenue mix is available."
    claimRefs: [CI001, CI002, CI003, CI004, CI010, CI015]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: operating-economics
    title: GTM motion and operating economics
    body: "The go-to-market motion is concentrated enterprise partnering: Valo works on multiple candidates, then relies on larger pharmaceutical companies with the resources to develop and commercialize them. This can transfer downstream commercialization obligations, but it does not make discovery inexpensive or establish positive gross margin. Public descriptions point to a cost base spanning licensed human data, AI and statistical talent, closed-loop chemistry, tissue models, laboratories, CRO relationships, and senior scientific leadership. The 114-participant, multicenter SPECTRA Phase 2 study illustrates the capital exposure associated with internal clinical development. Its failure to meet primary and secondary efficacy endpoints is adverse evidence, even though several sources state that OPL-0401 was not generated by Opal."
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI014]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and financial verdict
    body: "Capital adequacy cannot be underwritten from the assigned public record. A 2021 article described an expected pro forma cash balance of about $750 million for a proposed SPAC combination, including a $168.5 million PIPE, but a later source says the transaction was terminated in November 2021; neither figure is current cash available to Valo. The Novo and Merck structures may fund research and create future milestone inflows, yet the largest headline values remain contingent. Public sources do not disclose current cash, monthly burn, runway, debt, financing commitments, recognized revenue, gross margin, CAC, payback, or program-level cost-to-go. The financial verdict is therefore conditional: strategic partner demand is visible, but revenue quality, margin path, and financing dependency remain material diligence blockers."
    claimRefs: [CI001, CI002, CI011, CI012, CI013, CI014, CI015]
callouts:
  - calloutType: strength
    title: Partner-funded validation
    body: "Novo Nordisk and Merck KGaA provide evidence that sophisticated pharmaceutical buyers value Valo's discovery capabilities, while the contract structures can fund research and preserve royalty upside."
    claimRefs: [CI001, CI002, CI003]
  - calloutType: risk
    title: Headline deal values are not cash
    body: "The disclosed multibillion-dollar figures are potential milestone pools; without payment schedules, milestone probabilities, receipts, and accounting treatment, they cannot be modeled as revenue or liquidity."
    claimRefs: [CI001, CI002, CI015]
  - calloutType: recommendation
    title: Require contract and liquidity diligence
    body: "Obtain executed collaboration agreements, payment history, milestone definitions, royalty terms, audited revenue, current cash, monthly burn, debt schedules, and program-level cost-to-go before assigning a financial valuation."
    claimRefs: [CI004, CI013, CI014, CI015]
tables:
  - id: TI001
