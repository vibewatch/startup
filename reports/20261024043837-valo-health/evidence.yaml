evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: financing
    missingEvidence: A current balance sheet, cash runway, burn rate, and cap table with preference terms.
    whyItMatters: >-
      Transaction-era cash and historical round totals cannot establish current solvency, dilution, or investor
      economics.
    diligencePath: Request the latest management accounts, capitalization table, debt schedule, and financing documents under NDA.
    relatedQuestionRefs:
      - QO005
      - QO009
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: A reconciled round-by-round financing ledger explaining the $300M FundedIQ total versus Netfigo's $520M estimate.
    whyItMatters: >-
      Different inclusion rules can materially change perceived capitalization and the denominator for valuation
      analysis.
    diligencePath: >-
      Reconcile wire proceeds, equity instruments, acquisitions, and announced-versus-closed rounds against primary
      financing documents.
    relatedQuestionRefs:
      - QO006
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: A current executive roster, board roster, and documented leadership-change history.
    whyItMatters: The evidence shows a CEO transition but does not establish current governance coverage or succession depth.
    diligencePath: Obtain the current board consent, executive roster, and organizational chart.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: stale
    severity: material
    topic: pipeline
    missingEvidence: A current asset-by-asset pipeline and milestone status, including outcomes after the diabetic-retinopathy setback.
    whyItMatters: The internal pipeline appears to have changed materially, affecting platform validation and financing needs.
    diligencePath: Request the latest pipeline deck, program status table, and partner milestone schedule.
    relatedQuestionRefs:
      - QO007
      - QO008
  - type: private-evidence-only
    severity: blocking
    topic: market-size
    missingEvidence: >-
      A Valo-specific SAM/SOM model with customer segment counts, program budgets, geography, and a clearly defined
      denominator.
    whyItMatters: Published category TAMs vary materially and cannot establish Valo's addressable revenue or share.
    diligencePath: >-
      Request management's bottom-up market model, pipeline-to-market assumptions, and the customer or partner universe
      used to size it.
    relatedQuestionRefs:
      - QM004
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: business-model
    missingEvidence: >-
      Contract-level economics showing recognized revenue, research funding, milestone probability, royalty structure,
      and renewal or expansion behavior.
    whyItMatters: Large headline biobucks are contingent and do not establish recurring demand, cash generation, or valuation.
    diligencePath: >-
      Review anonymized collaboration agreements, revenue recognition policy, milestone achievement history, and partner
      renewal data under NDA.
    relatedQuestionRefs:
      - QM007
      - QM008
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: >-
      Reconciled definitions and methodology for the Grand View Research, MarketsandMarkets, and Global Market Insights
      estimates.
    whyItMatters: >-
      The range from USD 13.8 billion to USD 43.9 billion at different endpoints could materially change market and
      valuation conclusions.
    diligencePath: >-
      Obtain each report's scope, included categories, base-year data, forecast assumptions, and treatment of services
      versus software.
    relatedQuestionRefs:
      - QM003
      - QM009
  - type: enumeration-incomplete
    severity: material
    topic: adoption
    missingEvidence: >-
      A complete, current map of Valo's paying customers, active programs, buyer roles, and conversion from pilot or
      collaboration to scaled use.
    whyItMatters: Partnership announcements show willingness to explore programs but not repeatable adoption or market penetration.
    diligencePath: >-
      Request a customer and program cohort schedule with start dates, stage, budget owner, renewal status, and outcome
      metrics.
    relatedQuestionRefs:
      - QM002
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Comparable Valo and peer list pricing, realized pricing, renewal, and switching-cost data.
    whyItMatters: >-
      Without commercial terms, competitive differentiation cannot be translated into durable revenue quality or
      retention.
    diligencePath: >-
      Request executed contract examples, pricing schedules, renewal cohorts, and customer concentration from
      management.
    relatedQuestionRefs:
      - QP005
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: benchmarking
    missingEvidence: >-
      Independent head-to-head validation of Valo and competitor target-selection, cycle-time, and clinical-conversion
      performance.
    whyItMatters: >-
