chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Valo Health was founded in 2019 by David Berry and is headquartered in Boston, according to the retained
              third-party company profiles. Its core product is the Opal Computational Platform, described as an
              end-to-end system combining human-centric data, AI computation, and drug-development workflows. The
              company has used that platform both for an internal therapeutic pipeline and for collaborations with
              pharmaceutical partners. MedCity News reported that Valo works across more than 17 million de-identified
              patient records and biobank samples, while Pharmaceutical Technology described the platform as using
              patient records and biobank samples to identify targets and generate preclinical compounds. The operating
              model therefore appears less like a conventional single-asset biotech and more like a
              platform-plus-pipeline business: partner economics include upfront and milestone payments, research
              funding, and potential royalties, while the company has said it does not intend to commercialize drugs
              itself.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO009
              - CO010
              - CO011
              - CO012
      - number: '1.2'
        title: Leadership, governance, and key-person exposure
        blocks:
          - type: paragraph
            body: >-
              The evidence identifies David Berry as founder and an early chief executive, while current 2026 reporting
              identifies Brian Alexander as CEO. The 2021 transaction announcement said Samir Kaul of Khosla Ventures
              was expected to join Valo's board after the proposed business combination. BioTechTV's 2026 leadership
              material identifies Karin Conde-Knape as senior vice president and chief scientific officer and Chris
              Anagnostopoulos as chief causal AI officer. This combination covers company formation, clinical and
              scientific leadership, and computational capability, but the assigned public evidence does not establish a
              complete current board roster or a full succession plan. The visible transition from Berry to Alexander
              and reliance on specialized scientific leaders make leadership continuity and key-person concentration
              material diligence questions.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
