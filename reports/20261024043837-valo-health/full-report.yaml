  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer
        blocks:
          - type: paragraph
            body: >-
              Valo's relevant market is AI-enabled drug discovery and early development: software, data, computational
              biology, and associated research services used to identify targets, design or prioritize compounds, and
              support preclinical decisions. It is narrower than the total pharmaceutical R&D budget and excludes
              downstream manufacturing, clinical-trial operations, and approved-product sales. The buyer is principally
              a pharmaceutical or biotechnology R&D organization, while scientists and medicinal chemists are users and
              program leaders or alliance teams control budgets. Independent market descriptions place pharmaceutical
              and biotechnology companies at the center of demand, and company-specific descriptions identify pharma R&D
              teams, medicinal chemists, and drug hunters as the immediate user group. Valo's enterprise-partnership
              model therefore implies consultative, program-based adoption rather than low-friction self-serve software.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and commercial relevance
        blocks:
          - type: paragraph
            body: >-
              Public estimates disagree materially because they use different boundaries, vintages, geographies, and
              methodologies. Grand View Research reports USD 2.3 billion in 2025 global AI-in-drug-discovery revenue and
              USD 13.8 billion by 2033, while MarketsandMarkets reports USD 3.92 billion in 2025 and USD 17.56 billion
              by 2031; Global Market Insights reports USD 3.1 billion in 2025 and USD 43.9 billion by 2035. These are
              market-research estimates, not Valo revenue or serviceable market, and their divergence is itself
              decision-relevant. A constrained Valo SAM should focus on pharma and biotech programs needing human-data
              interpretation, target selection, compound generation, or integrated discovery workflows; no public source
              here isolates that subset or a defensible SOM.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM009
      - number: '2.3'
        title: Adoption drivers and adoption path
        blocks:
          - type: paragraph
            body: >-
              The demand case is strongest where an AI platform improves an expensive early decision and can be
              connected to experimental validation. MarketsandMarkets identifies the need to reduce discovery time and
              cost, multi-omics availability, generative AI, cloud and high-performance computing, and strategic pharma
              collaborations as drivers. Valo's cited partnerships show how adoption can be bought through programs
              rather than a generic license: the Novo collaboration covers up to 20 treatments and up to approximately
              USD 4.6 billion of milestones, while the Merck arrangement offers more than USD 3 billion in potential
              payments. This creates a buyer path from scoped collaboration to validated target or preclinical
              candidate, with milestone and royalty economics rather than a disclosed recurring software metric.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Constraints, substitutes, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The main constraints are not only algorithmic. MarketsandMarkets cites limited high-quality training data,
              limited real-world clinical validation, talent scarcity, evolving regulatory frameworks, and rising
              compute costs. Global Market Insights emphasizes data provenance, integration, model credibility, and
              documentation when AI-supported evidence reaches regulatory decision-making. Valo's own market position
              also faces the status quo of internal pharma research, conventional CRO work, and competing AI platforms;
              AI Scanner describes enterprise partnerships and explicitly flags a clinical translation gap and
              data-quality dependence. Valo's strategy of partnering with larger companies can reduce commercialization
              burden, but it also makes demand and valuation sensitive to partner program selection, milestone
              conversion, and evidence that platform outputs generalize beyond individual datasets.
            claimRefs:
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM010
              - CM011
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Market is attractive but not a simple software TAM
            body: >-
              The market-growth estimates support a large and expanding category, but Valo's economically relevant
              opportunity is a narrower, program-based market whose realized value depends on scientific validation and
              partner milestones.
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM011
          - type: callout
            title: Evidence quality is the adoption bottleneck
            body: >-
              Public evidence does not disclose Valo's SAM, SOM, recurring software revenue, or program-conversion
              rates; the central diligence question is whether its human-data and causal-biology workflow produces
              repeatable, development-stage outcomes.
            calloutType: risk
            claimRefs:
              - CM009
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and strategic position
        blocks:
          - type: paragraph
            body: >-
              Valo's disclosed competitive position is an end-to-end discovery-to-development workflow built around its
              Opal Computational Platform. Tracxn describes the platform as combining machine learning, tissue biology,
              and patient data, while an independent comparison frames the principal alternative as XtalPi's narrower
              focus on solid-state chemistry and property prediction. This creates a meaningful category distinction:
              Valo is selling integrated target selection, biology, and chemistry work, whereas specialized chemistry
              vendors can be substitutes for particular lead-optimization or formulation problems. The practical buying
              set also includes internal pharma discovery teams, CROs, and other AI-native platforms such as Relay
              Therapeutics and Xaira that appear in Tracxn's similar-company listing. A buyer therefore compares not
              only model quality but also data access, laboratory execution, therapeutic-area expertise, and whether the
              vendor shares asset risk through a collaboration.
            claimRefs:
              - CP001
              - CP002
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP013
      - number: '3.2'
        title: Buyer criteria, distribution, and capability trade-offs
        blocks:
          - type: paragraph
            body: >-
              The public record points to enterprise partnerships as Valo's principal route to market. MedCity News
              reports that Valo works on multiple candidates and then partners with larger companies that can
              commercialize them; Fierce Biotech describes collaborations with Merck KGaA, Novo Nordisk, Pfizer, and
              Charles River. This distribution model can provide access to pharma data, development infrastructure, and
              therapeutic-area budgets, but it also makes Valo dependent on partner selection and milestone economics.
              The comparison with XtalPi is useful but not an independent benchmark: Inferensys is itself the issuer of
              that comparison and reports proprietary cycle-compression and success-prediction figures without a
              disclosed validation sample. Public sources do not establish a comparable list price, realized price,
              renewal rate, or switching-cost schedule for Valo or its peers; those cells remain unknown rather than
              being inferred from deal headline values.
            claimRefs:
              - CP003
              - CP004
              - CP012
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP012
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Valo's potential moat is the combination of longitudinal human data, causal biology, and a closed-loop
              discovery workflow. MedCity reports access to more than 17 million de-identified patient records and
              describes the company's use of human data to identify disease patterns and targets. That data-and-workflow
              combination is harder to reproduce than a stand-alone model, but it is not equivalent to proven clinical
              or commercial superiority. PatSnap's current pipeline snapshot lists discovery and preclinical activity,
              while Fierce reports five preclinical candidates after an internal diabetic-retinopathy program was
              scrapped following a failed Phase 2 trial. The failure is adverse evidence against assuming that platform
              differentiation automatically converts into clinical outcomes. Market reports also show a rapidly
              expanding AI-drug- discovery category, which increases the threat from well-funded incumbents, specialized
              entrants, and internal build-outs. The defensible thesis is thus conditional on continued data access,
              partner conversion, and evidence that target-selection advantages survive clinical testing.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP009
              - CP010
              - CP012
      - number: '3.4'
        title: Competitive diligence implications
        blocks:
          - type: paragraph
            body: >-
              Valo appears strongest when a pharma buyer values broad discovery integration, access to human data, and
              shared-risk partnerships; a focused chemistry vendor may be preferable when the bottleneck is solid-form
              prediction or late lead optimization. Internal build remains credible for the largest pharmaceutical
              companies because they already own data, wet labs, and regulatory workflows, although the sources do not
              quantify build cost or time. The competitive assessment should therefore avoid a generic AI premium. It
              should instead test partner renewal, milestone conversion, reproducibility of target-selection claims,
              access rights to the underlying data, and the economics of converting preclinical programs into partnered
              assets. The principal unresolved issue is pricing and switching cost: public deal ceilings and funding
              totals are not comparable to recurring software revenue, and neither indicates realized margin or customer
              retention.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP012
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation
            body: >-
              Valo's most credible differentiator is an integrated human-data and causal-biology workflow connected to
              target discovery and closed-loop chemistry, not an independently proven model-accuracy lead.
            calloutType: strength
            claimRefs:
              - CP001
              - CP003
          - type: callout
            title: Competitive risk
            body: >-
              The platform competes in a fast-growing field while public evidence includes an internal Phase 2 failure
              and no transparent pricing or retention metrics, leaving displacement and monetization unproven.
            calloutType: risk
            claimRefs:
              - CP005
              - CP009
              - CP010
              - CP012
          - type: callout
            title: Competitive verdict
            body: >-
              Treat Valo as a differentiated but unproven enterprise discovery partner: the moat case rests on data
              access, causal biology, and partner distribution, while pricing, retention, and clinical conversion remain
              underwriting gaps.
            calloutType: recommendation
            claimRefs:
              - CP003
              - CP005
              - CP012
