      - number: '1.3'
        title: Financing, valuation, and strategic capital
        blocks:
          - type: paragraph
            body: >-
              Valo's financing history is reported inconsistently across sources and periods. The 2021 Khosla Ventures
              Acquisition Co. announcement described a proposed transaction at approximately $2.8 billion pro forma
              market value and approximately $750 million of pro forma cash before transaction expenses, including
              approximately $250 million of existing Valo cash, $333 million of net trust cash, and a $168.5 million
              PIPE assuming no redemptions. That announcement is a transaction-era projection, not current cash or
              current valuation. FundedIQ records two Series B announcements totaling $300 million on its tracked
              profile, while Netfigo presents a broader $520 million total and additional historical rounds. The
              difference is a data-definition and coverage issue rather than a basis for selecting one number. No
              assigned source verifies current cash, burn, runway, or a current valuation, so those fields should remain
              open.
            claimRefs:
