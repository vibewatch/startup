  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      The public model converts discovery work into a mix of near-term payments, research support, contingent
      milestones, and potential royalties rather than a disclosed subscription.
    data:
      nodes:
        - id: discovery-engine
          label: Human data and Opal discovery
          detail: Licensed data, AI, biology, chemistry, and laboratory work generate targets and preclinical compounds.
        - id: partner-program
          label: Partnered program
          detail: A pharmaceutical partner funds or collaborates on a disease-area program.
        - id: near-term
          label: Upfront / near-term consideration
          detail: Disclosed in the Novo and Merck structures, but verified receipts are not public.
        - id: research-support
          label: Research funding or grant
          detail: Merck R&D funding and the MJFF grant support research, with incomplete amount disclosure.
        - id: milestones
          label: Potential milestones
          detail: Large headline pools depend on future program events and are not current revenue.
        - id: royalties
          label: Potential royalties
          detail: Valo may retain product-sale royalties while partners lead later development.
      edges:
        - from: discovery-engine
          to: partner-program
        - from: partner-program
          to: near-term
        - from: partner-program
          to: research-support
        - from: partner-program
          to: milestones
        - from: partner-program
          to: royalties
    approximationNotes: >-
      This is a mechanism map, not a forecast, accounting bridge, probability-weighted valuation, or value-proportional
      diagram.
    claimRefs:
      - CI003
      - CI005
      - CI010
      - CI015
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Valo's publicly described stack runs from multimodal human data through causal target selection and closed-loop
      compound design to partner or clinical development.
    data:
      layers:
        - label: Human data
          detail: Multimodal inputs from longitudinal and biological records
          items:
            - label: Longitudinal patient records
              detail: De-identified clinical histories and outcomes
            - label: Omics and multimodal data
              detail: Imaging, laboratory, diagnostic, and biological modalities
        - label: Human models
          detail: Human-centric validation layer for disease biology
          items:
            - label: Human-centric models
              detail: Target validation before compound design
        - label: Biology and AI
          detail: Causal and machine-learning interpretation
          items:
            - label: Causal biology
              detail: Genetic evidence and Mendelian-randomization-informed target hypotheses
            - label: Machine learning
              detail: Target prioritization and discovery decision support
        - label: Compound design
          detail: AI-enabled closed-loop small-molecule generation
          items:
            - label: Closed-loop design
              detail: Generate and refine preclinical candidates
        - label: Development and handoff
          detail: Partner or internal progression into development
          items:
            - label: Partner or clinical handoff
              detail: Programs advance through Valo or pharmaceutical collaborators
        - label: Clinical feedback
          detail: Observed study outcomes inform portfolio and partner decisions
          items:
            - label: Program readouts
              detail: Clinical evidence remains the external test of translation
    approximationNotes: >-
      Layer order is an analytical presentation of public descriptions, not a disclosed technical architecture or proof
      of universal data flow.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
      - CE007
  - id: FU001
    title: Customer journey from partnership to program value
    type: journey-map
    summary: >-
      Public evidence supports a partnership-led path from enterprise sponsor engagement to target discovery and
      preclinical work, while later clinical and commercial outcomes remain unverified.
    data:
      nodes:
        - id: enterprise-sponsor
          label: Enterprise pharma sponsor
          detail: Named relationships include Novo Nordisk and Merck KGaA.
        - id: data-and-targets
          label: Human-data target discovery
          detail: Valo describes human causal biology, patient records, and target prioritization.
        - id: preclinical-programs
          label: Preclinical compounds / programs
          detail: Sources describe closed-loop chemistry and preclinical candidate generation.
        - id: milestones
          label: Milestone economics
          detail: Potential milestone and royalty economics are disclosed for several collaborations.
        - id: clinical-commercial
          label: Clinical and commercial outcome
          detail: Program conversion, renewals, and realized commercial outcomes are not publicly quantified.
        - id: diligence
          label: Diligence confirmation
          detail: Current program status, renewals, and counterparty concentration require private records.
    claimRefs:
      - CU001
      - CU005
      - CU008
      - CU013
  - id: FR001
    title: Residual risk priority matrix
    type: matrix
    summary: >-
      Evidence strength is highest for clinical attrition and external dependency, while legal and security posture
      remain evidence-limited.
    data:
      columns:
        - Evidence signal
        - Residual severity
        - Monitor or kill criterion
      rows:
        - label: Clinical translation
          values:
            - Failed phase 2 endpoints
            - high
            - Another material efficacy failure
        - label: Partner commercialization
          values:
            - No self-commercialization
            - high
            - Major partner exit or no asset uptake
        - label: Milestone economics
          values:
            - Headline values are contingent
            - high
            - Material milestone delay without runway
        - label: External data access
          values:
            - nference supplies multimodal access
            - medium-high
            - Loss or restriction of core data access
        - label: Model and data validation
          values:
            - Industry misuse concern acknowledged
            - medium-high
            - Prospective validation misses agreed threshold
        - label: Legal and security status
          values:
            - Primary records absent from pool
            - unknown
            - Material undisclosed action or incident
    approximationNotes: >-
      The matrix uses qualitative analyst judgments, not modeled probabilities; unknown means the assigned evidence
      cannot support a rating.
    claimRefs:
      - CR001
      - CR002
      - CR007
      - CR009
      - CR010
      - CR015
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Partner validation is offset by contingent economics, clinical attrition, and missing entry-price evidence,
      producing a research-more decision.
    data:
      nodes:
        - id: model
          label: Portfolio partnership model
          detail: Valo retains partial ownership across multiple programs and relies on commercialization partners.
        - id: demand
          label: Strategic demand
          detail: Merck and Novo agreements show large-pharma willingness to fund discovery work.
        - id: contingency
          label: Contingent economics
          detail: Large headline amounts depend on milestones, programs, funding, and royalties.
        - id: validation
          label: Clinical validation gap
          detail: OPL-0401 missed both primary and secondary phase 2 endpoints.
        - id: price
          label: Entry inputs unavailable
          detail: Current price, preferences, cash, burn, and runway remain unverified.
        - id: decision
          label: Research-more
          detail: Obtain primary financing, contracts, and pipeline evidence before valuation.
    approximationNotes: Ordered analytical chain only; node order does not imply magnitude, conversion rate, or probability.
    claimRefs:
      - CV007
      - CV009
      - CV011
      - CV013
      - CV014
      - CV016
