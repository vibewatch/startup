        title: Milestones and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a rapid move from formation and acquisitions to a platform financing, a
              proposed public-market transaction, and large strategic collaborations. The 2021 announcement described
              two clinical-stage and 15 prioritized preclinical assets at that time; later coverage described a smaller
              current internal pipeline after a diabetic retinopathy program failed its Phase 2 endpoints and the
              company shifted emphasis toward human-data partnerships. Merck's collaboration offers more than $3 billion
              in potential upfront and milestone payments plus research funding and royalties, but those are contingent
              economics, not booked revenue or cash. The strongest unresolved questions are current ownership and
              capitalization, realized versus contingent partnership proceeds, present employee count, complete
