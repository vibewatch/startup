      - number: '4.2'
        title: GTM motion and operating economics
        blocks:
          - type: paragraph
            body: >-
              The go-to-market motion is concentrated enterprise partnering: Valo works on multiple candidates, then
              relies on larger pharmaceutical companies with the resources to develop and commercialize them. This can
              transfer downstream commercialization obligations, but it does not make discovery inexpensive or establish
              positive gross margin. Public descriptions point to a cost base spanning licensed human data, AI and
              statistical talent, closed-loop chemistry, tissue models, laboratories, CRO relationships, and senior
              scientific leadership. The 114-participant, multicenter SPECTRA Phase 2 study illustrates the capital
              exposure associated with internal clinical development. Its failure to meet primary and secondary efficacy
              endpoints is adverse evidence, even though several sources state that OPL-0401 was not generated by Opal.
            claimRefs:
