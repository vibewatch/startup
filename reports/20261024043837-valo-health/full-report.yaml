      - number: '4.3'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Capital adequacy cannot be underwritten from the assigned public record. A 2021 article described an
              expected pro forma cash balance of about $750 million for a proposed SPAC combination, including a $168.5
              million PIPE, but a later source says the transaction was terminated in November 2021; neither figure is
              current cash available to Valo. The Novo and Merck structures may fund research and create future
              milestone inflows, yet the largest headline values remain contingent. Public sources do not disclose
              current cash, monthly burn, runway, debt, financing commitments, recognized revenue, gross margin, CAC,
              payback, or program-level cost-to-go. The financial verdict is therefore conditional: strategic partner
              demand is visible, but revenue quality, margin path, and financing dependency remain material diligence
              blockers.
