    claimRefs: [CP001, CP002, CP007, CP013]
callouts:
  - calloutType: strength
    title: Differentiation
    body: Valo's most credible differentiator is an integrated human-data and causal-biology workflow connected to target discovery and closed-loop chemistry, not an independently proven model-accuracy lead.
    claimRefs: [CP001, CP003]
  - calloutType: risk
    title: Competitive risk
    body: The platform competes in a fast-growing field while public evidence includes an internal Phase 2 failure and no transparent pricing or retention metrics, leaving displacement and monetization unproven.
    claimRefs: [CP005, CP009, CP010, CP012]
  - calloutType: recommendation
    title: Competitive verdict
    body: "Treat Valo as a differentiated but unproven enterprise discovery partner: the moat case rests on data access, causal biology, and partner distribution, while pricing, retention, and clinical conversion remain underwriting gaps."
    claimRefs: [CP003, CP005, CP012]
