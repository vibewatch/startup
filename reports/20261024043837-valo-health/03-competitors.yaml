      - [Trust and regulatory posture, "Data and clinical-development claims require diligence", "Developability claims require validation", "Established internal governance", "No comparable regulatory or audit evidence in pool"]
    notes: "This matrix deliberately marks unsupported peer and internal-build cells as unknown; deal headlines are not treated as product pricing or retention evidence."
    claimRefs: [CP002, CP003, CP004, CP012]
  - id: TP003
    title: Moat and displacement evidence
    columns: [Moat or risk factor, Supporting evidence, Competitive implication, Confidence]
    rows:
      - [Human-data access, "MedCity reports more than 17M de-identified patient records", "Potentially difficult-to-replicate input advantage", high]
      - [Causal-biology workflow, "MedCity describes genetic and Mendelian-randomization approach", "Differentiates target selection from generic generative chemistry", medium]
      - [Partner distribution, "Merck, Novo Nordisk, Pfizer, and Charles River relationships reported", "Access to budgets and downstream capabilities", high]
      - [Clinical conversion risk, "Internal diabetic-retinopathy program was paused after failed Phase 2 endpoints", "Platform claims do not remove clinical attrition", high]
      - [Competitive intensity, "Market reports forecast 24.8% and 28.1% CAGRs on different scopes", "Fast growth may attract well-funded entrants and incumbents", medium]
      - [Commercial opacity, "No public Valo price, renewal, or switching-cost schedule in assigned sources", "Underwriting cannot yet separate strategic deals from durable recurring economics", medium]
    notes: "Confidence reflects source quality and directness, not an independent validation of the underlying business claims."
    claimRefs: [CP003, CP004, CP005, CP009, CP010, CP012]
