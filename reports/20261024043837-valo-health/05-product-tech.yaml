  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: controls-and-benchmarks
      missingEvidence: "Independent model validation, target-ranking benchmarks, error analysis, uptime history, access controls, audit reports, and privacy/security controls for the Opal environment."
      whyItMatters: "Without these records, investors cannot distinguish a repeatable platform advantage from program-specific scientific judgment or assess operational and data-governance risk."
      diligencePath: "Request model cards, benchmark datasets and protocols, validation results by disease area, SOC 2 or equivalent reports, incident logs, access-control diagrams, and data-provenance schedules."
      relatedQuestionRefs: [QE007, QE008]
      relatedTableRefs: [TE003]
    - type: conflicting-data
      severity: material
      topic: clinical-maturity
      missingEvidence: "A current, complete asset inventory linking each program to whether Opal supplied target discovery, validation, design, or development evidence."
      whyItMatters: "The failed OPL-0401 program was stated not to use Opal, while partner announcements describe platform-generated work; the boundary is important for measuring platform efficacy."
      diligencePath: "Obtain a program-by-program provenance map, milestone outcomes, partner validation criteria, and historical platform-use records under confidentiality."
      relatedQuestionRefs: [QE005, QE006]
      relatedTableRefs: [TE001]
