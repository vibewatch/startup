company:
  name: Valo Health
chapter:
  number: 1
  title: Company Overview
  summary: Valo Health is a privately held, Flagship Pioneering-founded drug-discovery company built around human-centric data, AI, and the Opal platform. Public evidence supports a partnership-led model and substantial historical financing, but current cash, exact headcount, present pipeline depth, and the conversion of announced biobucks into realized economics remain undisclosed or uncertain.
sections:
  - id: identity-and-business-model
    title: Identity and operating model
    body: >-
      Valo Health was founded in 2019 by David Berry and is headquartered in Boston, according to
      the retained third-party company profiles. Its core product is the Opal Computational
      Platform, described as an end-to-end system combining human-centric data, AI computation,
      and drug-development workflows. The company has used that platform both for an internal
      therapeutic pipeline and for collaborations with pharmaceutical partners. MedCity News
      reported that Valo works across more than 17 million de-identified patient records and
      biobank samples, while Pharmaceutical Technology described the platform as using patient
      records and biobank samples to identify targets and generate preclinical compounds. The
      operating model therefore appears less like a conventional single-asset biotech and more
      like a platform-plus-pipeline business: partner economics include upfront and milestone
      payments, research funding, and potential royalties, while the company has said it does not
      intend to commercialize drugs itself.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person exposure
    body: >-
      The evidence identifies David Berry as founder and an early chief executive, while current
      2026 reporting identifies Brian Alexander as CEO. The 2021 transaction announcement said
      Samir Kaul of Khosla Ventures was expected to join Valo's board after the proposed business
      combination. BioTechTV's 2026 leadership material identifies Karin Conde-Knape as senior
      vice president and chief scientific officer and Chris Anagnostopoulos as chief causal AI
      officer. This combination covers company formation, clinical and scientific leadership, and
      computational capability, but the assigned public evidence does not establish a complete
      current board roster or a full succession plan. The visible transition from Berry to
      Alexander and reliance on specialized scientific leaders make leadership continuity and
      key-person concentration material diligence questions.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: financing-and-strategic-capital
    title: Financing, valuation, and strategic capital
    body: >-
      Valo's financing history is reported inconsistently across sources and periods. The 2021
      Khosla Ventures Acquisition Co. announcement described a proposed transaction at
      approximately $2.8 billion pro forma market value and approximately $750 million of
      pro forma cash before transaction expenses, including approximately $250 million of
      existing Valo cash, $333 million of net trust cash, and a $168.5 million PIPE assuming no
      redemptions. That announcement is a transaction-era projection, not current cash or current
      valuation. FundedIQ records two Series B announcements totaling $300 million on its tracked
      profile, while Netfigo presents a broader $520 million total and additional historical
      rounds. The difference is a data-definition and coverage issue rather than a basis for
      selecting one number. No assigned source verifies current cash, burn, runway, or a current
      valuation, so those fields should remain open.
    claimRefs: [CO009, CO010, CO011, CO012]
    tableRefs: [TO003]
  - id: milestones-and-evidence-gaps
    title: Milestones and unresolved diligence
    body: >-
      The milestone record shows a rapid move from formation and acquisitions to a platform
      financing, a proposed public-market transaction, and large strategic collaborations. The
      2021 announcement described two clinical-stage and 15 prioritized preclinical assets at
      that time; later coverage described a smaller current internal pipeline after a diabetic
      retinopathy program failed its Phase 2 endpoints and the company shifted emphasis toward
      human-data partnerships. Merck's collaboration offers more than $3 billion in potential
      upfront and milestone payments plus research funding and royalties, but those are contingent
      economics, not booked revenue or cash. The strongest unresolved questions are current
      ownership and capitalization, realized versus contingent partnership proceeds, present
      employee count, complete leadership and board composition, and the status of the broader
      internal pipeline.
    claimRefs: [CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
