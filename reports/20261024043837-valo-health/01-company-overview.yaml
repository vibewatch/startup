callouts:
  - calloutType: insight
    title: Platform value is commercially validated but not yet economically transparent
    body: "Large pharmaceutical collaborations demonstrate willingness to test Valo's platform, but announced biobucks and potential royalties cannot be treated as current revenue, cash, or valuation without contract and milestone disclosures."
    claimRefs: [CO003, CO013, CO014]
  - calloutType: risk
    title: Current scale and capitalization remain opaque
    body: "Assigned evidence does not verify current cash, burn, runway, exact headcount, current cap table, or the complete current pipeline; the financing sources also differ materially in reported total raised."
    claimRefs: [CO010, CO011, CO012, CO016]
