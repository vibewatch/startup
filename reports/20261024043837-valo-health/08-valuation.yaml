company:
  name: Valo Health
chapter:
  number: 8
  title: Valuation
  summary: Valo Health has credible strategic validation from large-pharma collaborations, but their headline economics are contingent and the accessible evidence does not establish a current equity price, cash runway, or preference stack. The evidence supports a research-more recommendation rather than a price-insensitive investment call.
sections:
  - id: investment-case
    title: Investment thesis and anti-thesis
    body: >-
      The investment thesis is that Valo can spread scientific risk across a portfolio and monetize
      its human-data and computational capabilities through partners with development and
      commercialization capacity. The chief executive described a preference for partial ownership
      of many drugs rather than full ownership of one, while reported collaborations with Merck KGaA
      and Novo Nordisk provide evidence of pharmaceutical demand. The anti-thesis is that demand for
      discovery work is not yet proof of repeatable clinical conversion or realized economics.
      OPL-0401 missed both primary and secondary endpoints in phase 2, and Valo stopped developing it
      independently. Because Valo also says it will not commercialize products itself, investment
      value depends on partner selection, milestone achievement, downstream execution, and contract
      economics that are not fully visible in the public evidence.
    claimRefs: [CV007, CV008, CV009, CV010, CV011, CV012]
    tableRefs: [TV002]
  - id: financing-and-comparables
    title: Financing context, comparables, and entry discipline
    body: >-
      The strongest disclosed valuation anchor is historical, not current. A proposed 2021
      Valo-KVAC transaction valued the combined company at approximately $2.8 billion and described
      approximately $750 million of pro forma cash before transaction expenses. Those figures were
      transaction assumptions that included trust cash and a PIPE; they are not evidence of Valo's
      cash or equity value in 2026. Caplight identifies Insitro, Insilico Medicine, and Terray
      Therapeutics as similar private companies and lists Valo financing events, but the fetched
      public page does not display market-cap, round-amount, or valuation values. EquityZen likewise
      reserves current valuation, stock-price, cap-table, preference, revenue, and financial detail
      for accredited users. Entry discipline therefore requires primary pricing and capitalization
      evidence rather than extrapolation from an announced SPAC value or undisclosed private peers.
    claimRefs: [CV002, CV003, CV004, CV005, CV006, CV014]
    tableRefs: [TV001]
  - id: scenario-logic
    title: Bull, base, and bear cases
    body: >-
      Scenario value should be built from probability-weighted collaboration receipts and
      program-level development outcomes, not from headline deal ceilings. The bull case requires
      several partner programs to generate milestones, royalties, or transferable assets while
      financing terms preserve stakeholder value. The base case assumes collaborations continue
      but most disclosed consideration remains conditional and internal programs advance unevenly.
      The bear case combines another clinical or translational failure with a need to raise capital
      before material partner receipts arrive. No numeric valuation range or target return is
      defensible from the assigned public evidence because the current price, share class,
      preferences, cash, burn, milestone probabilities, and program status are missing. The
      scenarios therefore define decision boundaries and evidence signals rather than false
      precision.
    claimRefs: [CV009, CV010, CV011, CV012, CV013, CV014]
    tableRefs: [TV003]
  - id: recommendation-and-diligence
    title: Recommendation, exit readiness, and thesis-break triggers
    body: >-
      The recommendation is research-more with medium confidence, high risk, and an unknown
      valuation stance. Strategic collaborations support a potential partner-led liquidity route,
      but the evidence does not support a specific IPO, acquisition, holding period, or exit
      multiple. A current investment decision should wait for the latest cap table and preference
      schedule, cash and burn plan, debt and financing needs, executed collaboration agreements,
      achieved milestone history, and a program-by-program pipeline review. Thesis-break triggers
      include termination or material contraction of a major collaboration, another failed
      clinical or translational program without offsetting partner validation, financing on
      materially weaker terms, or evidence that announced programs are not converting into
      milestone-bearing assets. A lower entry price could improve expected return, but price alone
      would not resolve the missing operating evidence.
    claimRefs: [CV011, CV012, CV013, CV014, CV015, CV016]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, research-more, Require current primary financing and operating evidence before underwriting an entry]
      - [Confidence, medium, Strategic validation is visible but valuation inputs are incomplete]
      - [Risk rating, high, Clinical attrition and dependence on contingent partner economics create material downside]
      - [Valuation stance, unknown, The 2021 transaction value is historical and current pricing is not publicly established]
      - [Return and exit, not supportable, No defensible target return holding period or exit multiple is available from the assigned evidence]
    notes: "Analyst synthesis from the retained sources; historical transaction values and contingent collaboration ceilings are not treated as current fair value, revenue, or cash."
    claimRefs: [CV002, CV011, CV013, CV014, CV015, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Evidence, What would change the view]
    rows:
      - [Portfolio partnership model, Valo favors partial ownership across multiple drugs and relies on larger partners for commercialization, Evidence of repeatable partner handoffs and durable downstream economics]
      - [Pharma demand, Merck and Novo agreements contain substantial potential economics across discovery programs, Disclosure of achieved milestones rather than announced maximums]
      - [Clinical validation gap, OPL-0401 missed primary and secondary phase 2 endpoints and Valo stopped independent development, Partner-backed clinical success from a Valo-originated program]
      - [Capital opacity, Current price cap table preferences cash and burn are not available in the retained public evidence, A primary financing package and current management accounts]
    notes: "The table separates observed partner interest from unverified conversion and financing assumptions; announced maximum payments remain contingent."
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011, CV012, CV013, CV014]
  - id: TV003
    title: Bull, base, and bear scenario framework
    columns: [Scenario, Explicit assumptions, Valuation and return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, Multiple partner programs achieve milestones and financing avoids punitive dilution, Upside may exceed historical anchors but no numeric range is supportable, Low-to-medium because milestone conversion is undisclosed, Partner program failure or weak financing terms]
      - [Base, Collaborations continue while most consideration remains conditional and internal progress is uneven, Value requires contract-level expected-value analysis unavailable publicly, Medium because this matches the visible partnership model, Cash needs arrive before material milestones]
      - [Bear, Another clinical or translational failure occurs before meaningful partner receipts, Historical transaction values become irrelevant and dilution risk dominates, Medium given one documented phase 2 failure and missing runway data, Collaboration termination clinical setback or down round]
      - [Decision rule, Current price preferences cash burn and milestone schedules are produced, Calculate a probability-weighted return only after those inputs are verified, High confidence in the evidence requirement rather than an outcome probability, Any valuation based only on headline deal ceilings]
    notes: "Qualitative scenarios only: the sources do not disclose the current capitalization, cash runway, milestone probabilities, or program-level values needed for numeric valuation ranges."
    claimRefs: [CV009, CV010, CV011, CV012, CV013, CV014, CV016]
figures:
