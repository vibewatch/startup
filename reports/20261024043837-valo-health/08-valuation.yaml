    title: Recommendation logic
    type: flow
    summary: Partner validation is offset by contingent economics, clinical attrition, and missing entry-price evidence, producing a research-more decision.
    data:
      nodes:
        - id: model
          label: Portfolio partnership model
          detail: Valo retains partial ownership across multiple programs and relies on commercialization partners.
        - id: demand
          label: Strategic demand
          detail: Merck and Novo agreements show large-pharma willingness to fund discovery work.
        - id: contingency
          label: Contingent economics
          detail: Large headline amounts depend on milestones, programs, funding, and royalties.
        - id: validation
          label: Clinical validation gap
          detail: OPL-0401 missed both primary and secondary phase 2 endpoints.
        - id: price
          label: Entry inputs unavailable
          detail: Current price, preferences, cash, burn, and runway remain unverified.
        - id: decision
          label: Research-more
          detail: Obtain primary financing, contracts, and pipeline evidence before valuation.
    approximationNotes: "Ordered analytical chain only; node order does not imply magnitude, conversion rate, or probability."
    claimRefs: [CV007, CV009, CV011, CV013, CV014, CV016]
