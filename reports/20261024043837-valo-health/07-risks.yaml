    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Preclinical target fails to translate into clinical efficacy", high, high, "Partial: portfolio diversification and partner hand-off are stated", "High after the OPL-0401 endpoint failure", "No public target-to-IND or IND-to-proof-of-concept conversion series"]
      - ["Pipeline narrows before clinical validation", medium, high, "Partial: five preclinical candidates were reported by Fierce Biotech", "High because stage definitions and current status are incomplete", "No complete current asset list with provenance, status, and termination reason"]
      - ["Clinical-care and trial data are misused or insufficiently representative", medium, high, "Early: executives identify the industry problem and the company cites broad multimodal access", "Medium-high pending prospective validation", "No public cohort representativeness, reproducibility, or error-rate evidence"]
      - ["External data access, quality, or continuity degrades", medium, high, "Partial: a multi-year nference collaboration and federated network are described", "Medium-high because service and termination terms are private", "No public SLA, continuity plan, lineage audit, or substitution cost"]
    notes: "Qualitative ratings preserve the cited program stages and do not convert source-reported pipeline counts into success probabilities."
    claimRefs: [CR002, CR003, CR004, CR005, CR006, CR009, CR010, CR011]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration evidence, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Downstream commercialization", "Large-pharma partners generally", "Clinical development and commercialization", "CEO says Valo will not commercialize products itself", "No partner accepts or continues a program", high, "Diversified partial ownership across multiple drugs", "High; partner appetite and economics remain externally controlled"]
      - ["Parkinson's discovery economics", "Merck KGaA", "Target identification and preclinical candidates", "More than $3 billion is described as upfront and potential milestones plus other economics", "Program stops or milestones are not achieved", high, "R&D funding and potential royalties broaden the consideration mix", "High; payment timing, probabilities, and termination rights are undisclosed"]
      - ["Multimodal patient-data access", "nference", "Patient-level data and analytics for Opal", "Real-time access to multiple data modes is company-reported", "Access, lawful-use, quality, or continuity constraints arise", high, "Multi-year collaboration and federated network", "Medium-high; contractual protections and substitution options are private"]
      - ["Current financing between milestones", "Investors and collaboration counterparties", "Funds platform and program work", "Only historical conditional SPAC cash figures are retained", "Milestones slip while internal cash requirements continue", high, "Multiple partnerships may diversify timing", "High; current cash, burn, runway, and funded budgets are undisclosed"]
    notes: "Headline collaboration and historical transaction amounts are not treated as revenue, ARR, cash available, or achieved milestones."
    claimRefs: [CR001, CR003, CR007, CR008, CR009, CR010, CR012]
figures:
  - id: FR001
    title: Residual risk priority matrix
    type: matrix
    summary: Evidence strength is highest for clinical attrition and external dependency, while legal and security posture remain evidence-limited.
    data:
      columns: ["Evidence signal", "Residual severity", "Monitor or kill criterion"]
      rows:
        - label: "Clinical translation"
          values: ["Failed phase 2 endpoints", high, "Another material efficacy failure"]
        - label: "Partner commercialization"
          values: ["No self-commercialization", high, "Major partner exit or no asset uptake"]
        - label: "Milestone economics"
          values: ["Headline values are contingent", high, "Material milestone delay without runway"]
        - label: "External data access"
          values: ["nference supplies multimodal access", "medium-high", "Loss or restriction of core data access"]
        - label: "Model and data validation"
          values: ["Industry misuse concern acknowledged", "medium-high", "Prospective validation misses agreed threshold"]
        - label: "Legal and security status"
          values: ["Primary records absent from pool", unknown, "Material undisclosed action or incident"]
    approximationNotes: "The matrix uses qualitative analyst judgments, not modeled probabilities; unknown means the assigned evidence cannot support a rating."
    claimRefs: [CR001, CR002, CR007, CR009, CR010, CR015, CR016]
callouts:
  - calloutType: risk
    title: Clinical translation is the clearest thesis-break trigger
    body: "A second material efficacy failure, without offsetting prospective platform validation, would weaken the claim that Valo can improve clinical success."
    claimRefs: [CR002, CR016]
  - calloutType: assumption
    title: Collaboration headlines are not current liquidity
    body: "Potential milestones, R&D funding, and royalties cannot substitute for current cash, burn, runway, or recognized revenue."
    claimRefs: [CR007, CR008, CR012]
