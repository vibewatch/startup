company:
  name: Valo Health
chapter:
  number: 7
  title: Risks
  summary: Valo Health's highest-evidence risks are clinical attrition and dependence on external pharma and data partners. A failed phase 2 lead asset, contingent collaboration economics, and missing public evidence on current legal, security, liquidity, and conversion metrics leave residual exposure high despite a diversified partnership strategy.
sections:
  - id: ranked-risk-view
    title: Ranked risk view and investment implication
    body: >-
      The strongest public downside signal is execution, not a documented enforcement action. Independent reports
      describe OPL-0401 missing primary and secondary phase 2 endpoints, while Valo's CEO says the company does not
      plan to commercialize products itself. That combination puts clinical translation and partner hand-off at the
      top of the risk register: platform output must survive human testing and then attract a capable counterparty.
      Large collaboration headlines do not remove this exposure because payments include contingent milestones, and
      the assigned evidence does not disclose conversion probabilities. The resulting residual-risk ranking is an
      analytical synthesis rather than a source-issued score. A repeated material clinical failure, loss of a major
      discovery partner, or inability to fund programs between milestones would break the investment thesis.
    claimRefs: [CR001, CR002, CR007, CR008, CR016]
    figureRefs: [FR001]
  - id: clinical-operational-execution
    title: Clinical, operational, and model risk
    body: >-
      OPL-0401 is the clearest observed test of execution risk: Pharmaphorum reported that it was the lead and only
      clinical-stage candidate and that it missed both primary and secondary endpoints. Fierce Biotech subsequently
      described partnerships as increasingly important as the internal pipeline stumbled and cited five remaining
      preclinical candidates. Patsnap's current snapshot is broader but only partially visible, listing discovery,
      preclinical, and other projects without a complete public denominator or consistent program definitions. This
      evidence supports heightened concern about preclinical-to-clinical conversion, but it does not establish that
      every Opal-derived program will fail. Mitigation should be measured through target-to-IND conversion, replicated
      model performance, prospective validation, and partner continuation rather than data scale or program counts
      alone.
    claimRefs: [CR002, CR004, CR005, CR006, CR011, CR015]
    tableRefs: [TR002]
  - id: regulatory-data-security
    title: Regulatory, data-governance, and legal exposure
    body: >-
      The retained evidence documents data scope but not a complete control environment. Valo's nference announcement
      says the collaboration uses HIPAA-compliant, fully de-identified patient-level data and provides real-time access
      to physicians' notes, imaging, outcomes, diagnoses, treatments, and laboratory results. Those assertions identify
      mitigation, yet the assigned pool contains no primary regulator record, litigation docket, independent security
      audit, data-processing agreement, incident history, or re-identification test. That is a diligence gap, not proof
      that no incident or legal issue exists. Valo's careers page separately warns about fraudulent recruitment offers
      seeking information or funds; this is an impersonation and brand-control issue, not evidence of a breach of
      Valo's systems. Current regulatory correspondence, privacy controls, and incident logs remain necessary.
    claimRefs: [CR009, CR010, CR013, CR014]
    tableRefs: [TR001]
  - id: partner-financial-dependencies
    title: Partner, concentration, and financial-model risk
    body: >-
      Valo's model deliberately relies on larger companies for downstream development and commercialization. The
      Merck KGaA collaboration offers strategic validation, but independent reports describe more than $3 billion as
      a mixture of upfront and potential milestone payments, R&D funding, and royalties rather than current revenue
      or cash. The nference relationship likewise makes access to multimodal patient data and analytics an external
      dependency. Valo's stated portfolio approach—partial ownership across many drugs—can diversify single-asset
      exposure, but public sources do not disclose counterparty concentration, termination rights, funded budgets,
      milestone schedules, current cash, or burn. The 2021 proposed SPAC figures are historical and conditional, so
      they cannot support a present liquidity conclusion. Diligence should test runway and partner continuity under
      delayed or failed milestones.
    claimRefs: [CR001, CR003, CR007, CR008, CR009, CR010, CR012]
    tableRefs: [TR003]
