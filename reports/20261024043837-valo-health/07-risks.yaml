      - ["Historical transaction and securities conditions", "United States", "The 2021 proposed SPAC was subject to shareholder, trust, PIPE, and regulatory conditions", historical, medium, "The release described filings, approvals, and closing conditions", "Unknown today; the announcement is not current capital evidence", "Confirm transaction disposition, current cap table, financing obligations, and litigation history"]
      - ["Recruitment impersonation and applicant fraud", "Online; company warning directs victims to the FBI IC3", "Valo says job seekers reported false offers requesting information or funds", current, medium, "Formal interviews and verified @valohealth.com email guidance", "Unknown incident volume and remediation effectiveness", "Request incident counts, takedown procedures, applicant notices, and control testing"]
