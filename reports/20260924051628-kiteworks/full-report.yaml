              - CO004
              - CO005
              - CO006
      - number: '1.2'
        title: Funding, valuation, and scale
        blocks:
          - type: paragraph
            body: >-
              The refresh confirms the company is still sitting on a large late-stage funding base: the August 2024
              round was $456 million and the external valuation cluster remains centered around $1 billion. Third-party
              data vendors disagree on the exact total capital raised and revenue scale, which is itself a useful
              diligence signal. For underwriting, the practical takeaway is that Kiteworks is funded like a unicorn, but
              still behaves like a private company with opaque financials. The funding and valuation signals are strong
              enough to confirm unicorn status, but the refresh still lacks audited margin, revenue, and retention data,
              so the operating picture remains estimate-driven.
