chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and footprint
        blocks:
          - type: paragraph
            body: >-
              Kiteworks is best understood as a late-stage private secure-content platform with an enterprise and
              public-sector footprint. The public site describes a private content / data network spanning email, file
              sharing, managed file transfer, APIs, forms, and AI agent access. Public sources consistently place
              headquarters in San Mateo and trace the company back to 1999, which matters because the business is old
              enough to have installed-base gravity but still private enough that many operating metrics are inferred
              rather than disclosed. The company narrative is reinforced by a long-lived enterprise footprint, a
              regulated-industry compliance story, and a platform that stretches from core exchange channels into
              AI-agent governance.
            claimRefs:
              - CO001
              - CO002
              - CO003
