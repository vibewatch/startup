  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct rivals and substitutes
        blocks:
          - type: paragraph
            body: >-
              The competitive set is a mix of specialized MFT, collaboration substitutes, sovereign-collaboration tools,
              and broader point solutions. GoAnywhere is the clearest feature-driven rival on MFT-centric workflows,
              while SharePoint migration, ownCloud, and Zivver together show that many buyers are evaluating different
              flavors of governed content exchange rather than just “another file-transfer product.” The competition
              story is less about a single rival and more about how buyers rank breadth, compliance, price, and
              deployment control. That makes the moat real, but it also keeps the product in a crowded decision tree.
              The public evidence suggests buyers often compare these platforms on compliance posture first and feature
              fit second.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
      - number: '3.2'
        title: Where Kiteworks is differentiated
        blocks:
          - type: paragraph
            body: >-
              Kiteworks’ answer is breadth plus compliance: eight channels, unified audit, and regulated-industry
              reporting in a single control plane. That is a credible differentiator when the buyer’s pain is policy
              enforcement and evidence collection across email, MFT, APIs, and AI agents. It is less compelling when the
              buyer simply wants high-throughput transfer or an operations-first MFT stack. GoAnywhere is the sharpest
              feature competitor on MFT, while ownCloud and Zivver push a sovereignty narrative from adjacent angles.
              SharePoint remains the biggest status-quo alternative because migration economics are so familiar to
              enterprises. That is why the market keeps splitting between breadth-led governance vendors and narrower
              MFT specialists.
            claimRefs:
              - CP003
              - CP006
              - CP007
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP009
              - CP010
              - CP012
      - number: '3.3'
        title: Moat durability and weak spots
        blocks:
          - type: paragraph
            body: >-
              The moat appears durable where regulation, sovereignty, and auditability dominate the RFP, but it gets
              thinner on price, OS flexibility, and MFT specialization. The refresh therefore treats the company as
              differentiated but not unassailable: the product is defensible in regulated environments, yet buyer cost
              pressure and feature-specific competition remain real. Kiteworks wins when policy and auditability
              dominate the buying criteria; it is less advantaged when the buyer wants a pure MFT workhorse or a highly
              flexible open-source deployment model. The result is durable differentiation in regulated use cases, but
              not a monopoly on secure exchange.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
