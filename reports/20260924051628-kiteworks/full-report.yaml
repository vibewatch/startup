      - number: '4.3'
        title: Financial quality and blockers
        blocks:
          - type: paragraph
            body: >-
              The operating verdict is mixed: enterprise software with real scale, but limited visibility into the
              actual margin and cash-generation profile. The Bonfy acquisition suggests the company can spend on
              inorganic growth, which is strategically useful but makes it harder to model clean organic performance.
              Until management discloses audited financials or a more complete metric pack, the finance view remains a
              diligence blocker rather than a clean underwriting input. Until audited revenue, retention, and margin
              data are visible, the valuation model stays a range rather than a point estimate. The underwriting
              takeaway is simple: the balance sheet looks supportive, but the actual cash-generation story is still an
              open question.
