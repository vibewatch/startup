  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risks and what they mean
        blocks:
          - type: paragraph
            body: >-
              The biggest risks are reputational residue from the Accellion breach, incomplete FedRAMP High completion,
              and a product that must continually prove trust in the market it sells to. Those are not unusual in
              security software, but they matter more here because the company’s differentiation depends on being the
              trusted control plane for sensitive data. If trust slips, the value proposition weakens quickly. The risk
              view is dominated by trust architecture. Kiteworks sells trust, so any gap in disclosure, assurance, or
              execution matters more than it would for a generic workflow product.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR004
              - CR010
      - number: '7.2'
        title: Commercial and channel risks
        blocks:
          - type: paragraph
            body: >-
              The competitor critique about complexity and premium pricing is the most useful commercial warning sign in
              the refresh. Kiteworks is also leaning harder on channel partners, which can scale efficiently but adds
              dependency and potential margin leakage. The refresh therefore treats growth as real but not frictionless:
              the company has to keep aligning product simplicity with the compliance premium it charges. Legacy breach
              baggage, security advisories, and the still-in-process FedRAMP High path are all manageable individually,
              but together they keep the risk rating elevated. The refresh still sees category pressure from compliance
              complexity, partner economics, and the need to justify premium packaging every quarter.
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR005
              - CR008
              - CR009
      - number: '7.3'
        title: Operational, AI, and security risks
        blocks:
          - type: paragraph
            body: >-
              AI governance cuts both ways: it is a growth driver, but it also increases the attack surface and the
              burden of proving policy enforcement. The public advisory repository and the survey data show the company
              is operating in a live-risk environment, not a static compliance checklist. That means the investment case
              depends on operational discipline, not just product positioning. The company can likely keep growing, but
              it has to do so while constantly proving that its trust posture is better than the alternatives. That is a
              hard bar, even for a strong security vendor. Sovereignty rules and AI workload governance add moving
              parts, so the company has to prove control continuously, not occasionally.
            claimRefs:
              - CR007
              - CR010
              - CR011
              - CR012
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR011
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
