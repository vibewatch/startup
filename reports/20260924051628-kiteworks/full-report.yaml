  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Kiteworks is selling into the market for governed sensitive-data exchange, not just secure file sharing.
              The boundary includes email, MFT, APIs, web forms, SFTP, collaboration, and increasingly AI-agent access.
              That matters because the real substitute is not a single rival; it is a mix of SharePoint, legacy MFT, ad
              hoc email attachments, consumer file sharing, and internally stitched compliance processes. The refresh
              therefore treats the company as a control-plane vendor for regulated data motion. The market read is
              shaped by fragmentation, regulatory pressure, and the shift toward AI governance. Buyers are not replacing
              one tool with one other tool; they are trying to replace a stack of partially overlapping controls with a
              single policy layer.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM008
              - CM009
      - number: '2.2'
        title: Demand signals and adoption friction
        blocks:
          - type: paragraph
            body: >-
              The strongest demand signal is fragmentation: most organizations are already using several channels and
              many cannot technically enforce policy across them. The 2026 survey also shows that AI governance has
              moved from a theoretical issue to a budget line, with a meaningful share of respondents naming AI security
              as a top priority. Kiteworks can ride that wave because the same controls solve both classic compliance
              and AI data controls. The public evidence supports a demand-shape thesis more than a hard market-size
              thesis. That is enough to justify the category, but not enough to pretend the company has published a
              defensible TAM model.
            claimRefs:
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: Sizing view and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The opportunity is real, but the evidence set is not enough to claim a clean TAM/SAM/SOM. The available
              sources support a market-shape argument: buyers are fragmented, regulated, and under-instrumented, and
              channel-led enterprise selling is credible. For underwriting, that is enough to support a durable
              niche-plus expansion thesis, but not enough to build a precise bottom-up market model from public sources
              alone. The refresh therefore emphasizes buying urgency, channel mediation, and the compliance pain that
              keeps showing up in the survey data. Those are the real market signals that matter here.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM011
