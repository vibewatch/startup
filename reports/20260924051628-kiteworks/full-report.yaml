  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Kiteworks has a credible strategic thesis: regulated data exchange, AI governance, sovereign
              collaboration, and a real enterprise customer base. The anti-thesis is not that the product is irrelevant;
              it is that the company still withholds enough economic detail that the private-market valuation cannot be
              judged with the same rigor as a public software comp. That makes the company investable only if the buyer
              accepts disclosure risk. The valuation call is intentionally cautious. There is enough evidence to say
              Kiteworks matters strategically, but not enough to assign a high-conviction entry price with the
              confidence you would want on a public software comp.
            claimRefs:
              - CV001
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV010
              - CV012
              - CV013
      - number: '8.2'
        title: Valuation stance and recommendation
        blocks:
          - type: paragraph
            body: >-
              The refresh points to a fair-to-stretched private valuation rather than a bargain. The $1B unicorn anchor
              is believable, but the estimated revenue spread is wide enough that the multiple could look normal or
              expensive depending on which estimate you trust. On that basis, the right action is to track the company,
              not size a high-conviction purchase. A fair private-market stance fits the evidence better than a deep
              discount or a full premium view. The business is meaningful, but the missing financials keep the range
              wide. Even the better comp services reinforce the same point: the valuation is plausible, but still not
              precise enough for conviction sizing. That is the call.
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV007
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV009
              - CV010
      - number: '8.3'
        title: Bull, base, and bear cases
        blocks:
          - type: paragraph
            body: >-
              The bull case depends on AI governance, compliance automation, and sovereign-collaboration demand staying
              elevated; the base case assumes steady enterprise renewals and partner-led scale; the bear case assumes
              pricing pressure and feature-specific competition compress the multiple. None of those scenarios are
              implausible, but only the bullish one justifies a materially higher confidence level than the public
              record supports today. The key next step is simple: if management can narrow the disclosure gap on
              retention, margin, and cash flow, the recommendation can move up. Without that, track is the right answer.
            claimRefs:
