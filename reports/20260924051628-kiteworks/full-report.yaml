      - number: '4.2'
        title: Funding and capital structure
        blocks:
          - type: paragraph
            body: >-
              Public capital-markets sources agree that Kiteworks is a unicorn-scale private company with a large 2024
              growth round, but they also disagree on how much capital has truly been raised over time. The most
              consistent signal is that the 2024 deal was a partial liquidity event and that the company still has
              meaningful sponsor backing. The refresh therefore treats financing as ample but still opaque. The company
              clearly has capital to continue buying growth and extending its platform, but the public evidence does not
              say whether that growth is efficient or sponsor-supported. It is enough to justify a unicorn-scale private
              company, but not enough to infer operating leverage or durable margin structure.
