  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and disclosed economics
        blocks:
          - type: paragraph
            body: >-
              The refresh still does not surface audited financials, so the company must be underwritten from estimates
              and indirect indicators. The best public numbers cluster around $130 million of estimated 2025 revenue and
              a low-to-mid hundreds employee count, but another vendor places both revenue and headcount materially
              higher. That spread is not unusual for private software, yet it means the financial view stays directional
              rather than exact. The financial story remains a private-software estimate story, not an audited
              disclosure story. That is acceptable for a refresh, but it prevents a hard margin or cash-flow conclusion.
              That matters because enterprise security vendors can look healthy on funding alone while still hiding weak
              economics underneath.
