      - number: '1.3'
        title: Governance, trust, and recent milestones
        blocks:
          - type: paragraph
            body: >-
              The company’s 2025-2026 moves point in the same direction: regulated-industry trust, partner distribution,
              and a broader sovereign-collaboration story. FedRAMP, FIPS, IRAP, the public security-advisory repo, the
              ownCloud OSPO, and the channel-first certification launch all reinforce the same positioning. The main
              caution is that the legacy breach history and the lack of audited operating metrics continue to cap
              conviction even as the platform expands. The key diligence point is that governance, partner motion, and
              legacy breach history all matter at the same time; the story is not just what Kiteworks sells, but how it
              earns trust and keeps it.
            claimRefs:
