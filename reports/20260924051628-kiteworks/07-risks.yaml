- id: TR002
  title: Operational / quality / security risk register
  columns:
  - Risk
  - Why it matters
  - Mitigation / monitoring
  rows:
  - - Security advisories / vuln surface
    - Live patches and disclosure imply a continuing attack surface
    - Advisories, bug bounty, patch cadence
  - - AI-agent attack surface
    - Mis-scoped agents can move data at machine speed
    - Scope controls and audit logging
  - - Complex deployment / onboarding
    - Competitors cite a steep learning curve and premium pricing
    - Simplify packaging and onboarding
  - - M&A integration
    - Bonfy and other acquisitions need technical assimilation
    - Platform governance and integration discipline
  notes: This is a qualitative risk ranking derived from the refresh evidence, not a formal incident probability
    model.
  claimRefs:
  - CR002
  - CR005
  - CR008
  - CR009
- id: TR003
  title: Partner / dependency risk register
  columns:
  - Dependency
  - Risk
  - Mitigation
  rows:
  - - Channel partners
    - Partner-led growth can dilute margin or slow execution
    - Training / certification and partner governance
  - - Investors / sponsors
    - Growth equity owners expect exit discipline
    - Align product and finance milestones
  - - Open-source ecosystem
    - Sovereign / open-source story can create roadmap expectations
    - Public governance charter and contribution model
  - - Customer trust
    - Security buyers are unforgiving after incidents
    - Independent validation and evidence production
  - - Public-sector compliance
    - FedRAMP and related controls can slip schedule
    - Maintain continuous monitoring and ATO focus
  notes: Dependencies are drawn from public channel, compliance, and governance sources; quantitative
    exposure is not public.
  claimRefs:
  - CR003
  - CR004
  - CR007
  - CR011
  - CR012
