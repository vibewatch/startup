      - number: '3.3'
        title: 护城河韧性与薄弱环节
        blocks:
          - type: paragraph
            body: >-
              当采购重点是监管合规、数据主权和可审计性时，Kiteworks 的护城河较稳；在价格、操作系统灵活性和 MFT
              专业能力上，优势则较弱。本次更新因此将其视为有差异化、但并非不可撼动：它在受监管场景中站得住脚，仍面临买家控本压力和专门功能的竞争。买家重视策略管控与审计时，Kiteworks 更占优势；若要的是纯 MFT
              工具或高度灵活的开源部署，优势就不明显。它在受监管场景中有持久差异化，但并未垄断安全交换市场。
