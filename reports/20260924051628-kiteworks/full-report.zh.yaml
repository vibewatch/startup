    title: 公司概况
    sections:
      - number: '1.1'
        title: 业务定位与业务版图
        blocks:
          - type: paragraph
            body: >-
              Kiteworks 更适合被视为一家面向企业和公共部门的后期私营安全内容平台。官网将其描述为私有内容 / 数据网络，覆盖电子邮件、文件共享、托管文件传输（MFT）、API、表单和 AI
              智能体访问。公开资料一致显示，公司总部位于 San Mateo，创立于 1999
              年。悠久经营历史意味着平台可能积累了稳固的存量客户基础；但公司仍未上市，许多运营指标只能估算，无法从公开披露中核实。企业客户基础、受监管行业的合规定位，以及从核心交换渠道延伸至 AI
              智能体治理的产品范围，共同支撑其业务叙事。
