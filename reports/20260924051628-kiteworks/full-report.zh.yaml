        title: 信任机制、开源与安全性
        blocks:
          - type: paragraph
            body: >-
              Kiteworks 也把治理做成产品能力。FedRAMP Moderate、仍在推进中的 FedRAMP High、公开安全公告库和 ownCloud OSPO
              都指向同一点：信任要靠流程和可追溯性建立。公开资料没有完整列出各个 SKU
              和路线图节点，因此产品版图仍有部分内容只能推断。待解的问题不是平台是否存在，而是各模块、部署选项和路线图如何定价、打包。产品路线图仍不清楚，但技术架构已远超单一文件传输工具。
