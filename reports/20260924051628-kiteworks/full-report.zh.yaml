  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接对手与替代方案
        blocks:
          - type: paragraph
            body: >-
              竞争对手包括专业 MFT、协作工具、主权协作产品和各类单点方案。在以 MFT 为核心的工作流上，GoAnywhere 是最直接的功能型对手。SharePoint 迁移、ownCloud 和 Zivver
              的案例则说明，许多买家比较的是不同形态的受治理内容交换，而非再买一款“文件传输产品”。竞争不只在于对手是谁，更在于买家如何权衡功能广度、合规能力、价格和部署控制权。Kiteworks
              因此有一定护城河，但也身处拥挤的选型市场。公开证据显示，买家通常先看合规能力，再看功能是否契合。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
      - number: '3.2'
        title: Kiteworks 的差异化优势
        blocks:
          - type: paragraph
            body: >-
              Kiteworks 的差异化在于“覆盖广、重合规”：一个控制平面覆盖八类渠道，统一审计，并为受监管行业提供报告。若买家需要跨电子邮件、MFT、API 和 AI
              智能体执行策略、收集审计证据，这一定位有说服力；若买家只要高吞吐传输或以运维为先的 MFT 工具栈，吸引力就有限。GoAnywhere 是 MFT 功能上的主要对手，ownCloud 和 Zivver
              则从相邻领域切入主权协作。SharePoint 仍是最大的现状替代方案，企业熟悉这类迁移的经济账。市场因此分化为覆盖广的治理平台和更专精的 MFT 产品。
            claimRefs:
              - CP003
              - CP006
              - CP007
