          - type: paragraph
            body: >-
              Kiteworks 在 2025—2026 年的动作都指向三件事：赢得受监管行业信任、借渠道伙伴拓展分销，以及讲述更广泛的主权协作故事。FedRAMP、FIPS、IRAP、公开安全公告库、ownCloud
