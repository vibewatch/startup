      - number: '6.3'
        title: 业务韧性与客户集中度风险
        blocks:
          - type: paragraph
            body: >-
              公开资料也有明显边界：没有留存队列、头部客户集中度明细或 NRR
              数据。具名案例让业务看起来有韧性，但投资者通常依赖的量化指标仍不透明。竞品称部分买家因产品复杂或价格偏高而离开；这值得纳入风险考量，却不是定论。由于公开资料没有披露客户集中度和留存数据，业务韧性只能从具名案例推断，无法用队列数据验证。因此，本次更新把集中度风险列为尽调缺口，而非已证实的弱点。这个缺口确实存在。
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
