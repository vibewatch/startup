  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Kiteworks 面向的是受治理的敏感数据交换市场，不只是安全文件共享。其业务覆盖电子邮件、MFT、API、网页表单、SFTP、协作，并逐步延伸至 AI 智能体访问。真正的替代方案不是某一家竞品，而是
              SharePoint、传统 MFT、邮件附件、消费级文件共享和企业内部拼凑的合规流程。因此，本次更新将 Kiteworks 视为受监管数据流动的控制平面厂商。市场判断取决于工具碎片化、监管压力和 AI
              治理需求上升。买家不是以一换一，而是想用统一策略层替代一整套功能重叠的管控工具。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM008
              - CM009
      - number: '2.2'
        title: 需求信号与落地阻力
        blocks:
          - type: paragraph
            body: >-
              最强的需求信号是渠道碎片化：多数机构已使用多种渠道，不少机构却无法在技术上跨渠道统一执行策略。2026 年调查还显示，AI 治理已从理论议题变成预算项目，相当一部分受访者把 AI
              安全列为首要任务。Kiteworks 可借此受益，因为同一套控制既能应对传统合规要求，也能管控 AI 数据。公开证据更能说明需求形态，尚不足以精确测算市场规模。这足以支撑赛道成立，却不能证明公司已发布可靠的
              TAM 模型。
            claimRefs:
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: 规模研判与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              市场机会真实存在，但现有证据不足以断言 TAM/SAM/SOM
              已经清晰。资料显示，买家分散、受监管严格且工具不足；通过渠道开展企业销售也具备可行性。投资上，这些信号足以支撑“稳固利基市场并向外扩张”的判断，却不足以仅凭公开资料搭建精确的自下而上模型。因此，本次更新聚焦采购紧迫度、渠道作用和调查中反复出现的合规痛点——这些才是目前看得见的市场信号。
