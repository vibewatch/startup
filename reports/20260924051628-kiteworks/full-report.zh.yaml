              本次更新仍未找到经审计的财务数据，只能依据估算和间接信号评估公司。公开数据较集中于 2025 年收入预估约 $130
              million、员工人数估计处于数百人的低至中段；另有数据厂商给出的收入和员工数明显更高。私营软件公司的数据存在分歧并不罕见，因此财务判断只能看方向，难以精确。现有财务信息仍是估算，而非经审计披露；用于定期跟踪尚可，却不足以判断利润率或现金流。这一点不能忽视：企业安全厂商可能单看融资显得稳健，实际经济性却未必理想。
