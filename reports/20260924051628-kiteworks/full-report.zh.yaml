              公开资本市场资料一致将 Kiteworks 描述为独角兽级私营公司，并确认其在 2024 年完成大额成长轮融资；但累计融资总额仍众说纷纭。较一致的信号是，2024
              年交易包含部分老股流动性安排，公司也仍有重要资方支持。因此，本次更新认为其资金充裕，但财务状况不透明。公司有资金继续投资增长、拓展平台；公开资料却无法说明增长是否高效，或是否依赖资方支持。这些信息足以确认其独角兽级私营公司地位，却不足以推断经营杠杆或长期利润结构。
