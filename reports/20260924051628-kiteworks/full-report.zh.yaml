  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品核心定义
        blocks:
          - type: paragraph
            body: >-
              Kiteworks 是受治理的安全数据交换平台，不只是文件共享工具。公司称产品覆盖八类渠道，并将治理能力延伸至 AI 智能体；因此，其范围超过传统
              MFT，也比普通协作工具更接近数据控制平面。产品广度是其核心叙事，也使平台处在合规、AI 治理和数据交换基础设施的交汇处。Kiteworks 试图为各类敏感数据流动提供策略控制，包括 AI
              智能体操作和开源协作工作流。开源与 MFT 相关证据显示，公司希望在商业和主权部署中都掌握受治理的数据交换层。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE008
              - CE012
      - number: '5.2'
        title: 实际运行机制
        blocks:
          - type: paragraph
            body: >-
              Kiteworks 的技术架构采用分层控制：身份、策略、加密和审计覆盖各个渠道，再汇入合规报告与适配 SIEM 的日志。AWS
              自动化部署博客支持这样一种判断：客户部署已趋于标准化、可复制，而非逐个定制。这不只是给旧传输工具套上 UI，而是按基础设施方式部署、配置和审计的架构。开源 OSPO 和 FedRAMP
              路径值得关注：Kiteworks 试图靠信任架构而非功能堆叠赢得客户。即使产品策略有吸引力，部署摩擦仍可能让安全平台丢单，因此自动化很重要。
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE004
              - CE007
              - CE008
