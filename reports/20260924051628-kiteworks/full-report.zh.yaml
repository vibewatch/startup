  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 主要风险排序与内涵解读
        blocks:
          - type: paragraph
            body: >-
              主要风险包括 Accellion 数据泄露留下的声誉包袱、FedRAMP High 尚未完成，以及产品必须持续证明自身可信。安全软件常见这些问题，但 Kiteworks
              更受影响，因为它的差异化依赖于成为敏感数据的可信控制平面。信任一旦动摇，价值主张就会迅速减弱。公司的风险归根结底落在信任架构上：披露、保障或执行上的缺口，对 Kiteworks 的影响会超过一般工作流软件。
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR004
              - CR010
      - number: '7.2'
        title: 商业与渠道风险
        blocks:
          - type: paragraph
            body: >-
              竞品对产品复杂度和高定价的批评，是本次更新中最有用的商业警示。Kiteworks
              更依赖渠道伙伴；这种模式有望高效扩张，却也增加依赖，并可能侵蚀利润率。因此，增长虽真实存在，却并非没有摩擦：产品必须足够简单，才能撑起合规溢价。历史泄露、安全公告和仍在推进的 FedRAMP High
              路径，单独看都可管理，合在一起却推高整体风险。合规复杂度、渠道经济性，以及每个季度都要证明溢价产品值得购买，共同构成持续的商业压力。
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR005
              - CR008
              - CR009
      - number: '7.3'
        title: 运营、AI 与安全风险
        blocks:
          - type: paragraph
            body: >-
              AI 治理既能带来增长，也会扩大攻击面、增加证明策略有效执行的负担。公开安全公告库和调查数据说明，Kiteworks
              面对的是持续变化的风险，而非一张静态合规清单。因此，投资逻辑不仅取决于产品定位，也取决于运营纪律。公司大概率还能继续增长，但必须持续证明其信任水平优于替代方案；这对任何安全厂商都是高要求。数据主权规则和 AI
              工作负载治理还在不断变化，公司必须持续证明管控有效，而非偶尔提供一次佐证。
            claimRefs:
              - CR007
              - CR010
              - CR011
              - CR012
              - CR014
          - type: table
