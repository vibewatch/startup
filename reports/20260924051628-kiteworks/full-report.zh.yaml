  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 核心逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Kiteworks 的正向逻辑清晰：受监管数据交换、AI
              治理、主权协作和真实的企业客户基础都有战略价值。反方并非认为产品无关紧要，而是公司仍未披露足够的经济数据，私营市场估值无法像上市软件公司那样严格比较。因此，只有接受披露风险的投资者才适合考虑投资。估值判断刻意保持谨慎：现有证据足以说明
              Kiteworks 具有战略意义，却不足以给出高确信度的入场价格，无法达到评估上市软件可比公司时所需的把握。
            claimRefs:
              - CV001
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV010
              - CV012
              - CV013
      - number: '8.2'
        title: 估值立场与投资建议
        blocks:
          - type: paragraph
            body: >-
              本次更新认为，Kiteworks 的私营市场估值合理但略显偏高，并非便宜货。$1B
              独角兽估值锚点可信，但收入估算差距较大，按不同数据计算，估值倍数可能合理，也可能偏贵。因此，当前更适合跟踪，而非高确信度买入。与大幅折价或明显溢价相比，“合理”更符合现有证据。业务已有一定体量，但财务披露不足，估值区间仍宽。较好的可比数据也指向同一结论：估值有其合理性，却不够精确，难以据此确定高确信度的仓位。
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV007
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV009
              - CV010
      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景假设 AI
              治理、合规自动化和主权协作需求维持高位；基准情景假设企业客户续约平稳、渠道带动规模增长；悲观情景则假设定价压力和细分功能竞争压低估值倍数。这些情景都说得通，但只有乐观情景能支撑显著高于当前公开证据所能支持的确信度。若管理层缩小留存、利润率和现金流的披露缺口，建议可以上调；否则，维持跟踪更合适。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
