company:
  name: Kiteworks
chapter:
  number: 1
  title: Company Overview
  summary: Kiteworks remains a late-stage private secure-content platform with strong regulated-industry
    positioning, a $456M 2024 growth round, and broad compliance messaging, but public financial disclosure
    is still thin.
sections:
- id: overview-identity
  title: Identity and footprint
  body: Kiteworks is best understood as a late-stage private secure-content platform with an enterprise
    and public-sector footprint. The public site describes a private content / data network spanning email,
    file sharing, managed file transfer, APIs, forms, and AI agent access. Public sources consistently
    place headquarters in San Mateo and trace the company back to 1999, which matters because the business
    is old enough to have installed-base gravity but still private enough that many operating metrics
    are inferred rather than disclosed. The company narrative is reinforced by a long-lived enterprise
    footprint, a regulated-industry compliance story, and a platform that stretches from core exchange
    channels into AI-agent governance.
  claimRefs:
  - CO001
  - CO002
  - CO003
  tableRefs:
  - TO001
- id: overview-capital
  title: Funding, valuation, and scale
  body: 'The refresh confirms the company is still sitting on a large late-stage funding base: the August
    2024 round was $456 million and the external valuation cluster remains centered around $1 billion.
    Third-party data vendors disagree on the exact total capital raised and revenue scale, which is itself
    a useful diligence signal. For underwriting, the practical takeaway is that Kiteworks is funded like
    a unicorn, but still behaves like a private company with opaque financials. The funding and valuation
    signals are strong enough to confirm unicorn status, but the refresh still lacks audited margin, revenue,
    and retention data, so the operating picture remains estimate-driven.'
  claimRefs:
  - CO004
  - CO005
  - CO006
  - CO011
  - CO012
  tableRefs:
  - TO002
- id: overview-governance
  title: Governance, trust, and recent milestones
  body: "The company\u2019s 2025-2026 moves point in the same direction: regulated-industry trust, partner\
    \ distribution, and a broader sovereign-collaboration story. FedRAMP, FIPS, IRAP, the public security-advisory\
    \ repo, the ownCloud OSPO, and the channel-first certification launch all reinforce the same positioning.\
    \ The main caution is that the legacy breach history and the lack of audited operating metrics continue\
    \ to cap conviction even as the platform expands. The key diligence point is that governance, partner\
    \ motion, and legacy breach history all matter at the same time; the story is not just what Kiteworks\
    \ sells, but how it earns trust and keeps it."
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO010
  tableRefs:
  - TO003
  figureRefs:
  - FO001
