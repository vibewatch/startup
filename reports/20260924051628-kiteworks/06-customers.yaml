company:
  name: Kiteworks
chapter:
  number: 6
  title: Customers
  summary: Kiteworks appears strongest in regulated enterprise and public-sector workflows, with good
    named-customer proof but no public retention or concentration data.
sections:
- id: customers-segmentation
  title: Customer mix and use cases
  body: 'The customer evidence points to a regulated-enterprise and public-sector mix: banks, local government,
    law firms, land registries, and compliance-heavy enterprises. This is exactly the sort of buyer who
    cares about auditability, identity, and controlled external exchange rather than simple file convenience.
    The refresh therefore treats the product as a workflow tool for regulated exchange, not a horizontal
    SMB collaboration app. The customer evidence is stronger than the public financial evidence. Named
    deployments show repeated usage in banking, public sector, legal, and regulated enterprise settings,
    which is exactly where the product thesis should be strongest.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  tableRefs:
  - TU001
- id: customers-proof
  title: Named proof and adoption depth
  body: 'Several case studies show real production deployment rather than pilot-only use. The strongest
    adoption signal is the Savings Bank case, where the bank claims 95% lending-customer usage, followed
    by the Sacramento deployment with more than 1,400 active users. Those figures are more persuasive
    than generic logos because they show repeat operational use and deep embedding in customer workflows.
    The adoption story is less about flashy logos and more about recurring operational necessity: audits,
    loan documents, matter exchange, and secure sharing with external parties. That kind of workflow tends
    to stick.'
  claimRefs:
  - CU004
  - CU005
  - CU007
  tableRefs:
  - TU002
- id: customers-risk
  title: Durability and concentration risk
  body: 'The same evidence set also shows the limits of the public record: no retention cohorts, no top-customer
    concentration table, and no NRR disclosure. That makes the business look durable on anecdotal proof
    but still opaque on the metrics that would normally reassure an investor. The competitor critique
    that some buyers leave because of complexity or premium pricing is worth carrying as a caution, not
    as a decisive verdict. The obvious gap is that the public record still does not expose concentration
    or retention metrics, so durability is inferred from named proof rather than measured from cohorts.
    That is why the refresh still treats concentration risk as a diligence gap rather than a proven weakness.
    That is real.'
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  tableRefs:
  - TU003
  figureRefs:
  - FU001
