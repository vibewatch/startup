chapter:
  number: 5
  title: Product & Technology
  summary: Kiteworks is a broad secure-data control plane spanning eight channels, governed open-source
    activity, and compliance-heavy deployment options, but SKU-level pricing and roadmap detail remain
    opaque.
sections:
- id: product-overview
  title: What the product is
  body: "Kiteworks is a governed secure-data exchange platform, not just a file-sharing box. The company\u2019\
    s current description spans eight channels and explicitly extends governance to AI agents, which makes\
    \ the offering broader than traditional MFT and more control-plane oriented than a simple collaboration\
    \ tool. That breadth is central to the product story and explains why the platform sits at the intersection\
    \ of compliance, AI governance, and data-exchange infrastructure. The technical picture is broader\
    \ than classic secure file transfer. The platform is trying to be the policy layer for any sensitive-data\
    \ move, including AI-agent actions and open-source collaboration workflows. The open-source and MFT\
    \ evidence together show that Kiteworks is trying to own the governed-exchange layer across both commercial\
    \ and sovereign deployments."
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE014
  tableRefs:
  - TE001
- id: product-architecture
  title: How it works in practice
  body: 'The technical story is a layered control model: identity, policy, encryption, and audit are enforced
    across channels and then surfaced in compliance reports and SIEM-ready logs. The AWS automation blog
    supports the idea that the customer deployment model is industrialized rather than bespoke. This is
    not just a UI wrapper around legacy transfer tools; it is an architecture designed to be deployed,
    provisioned, and audited like infrastructure. The open-source OSPO and the FedRAMP path are important
    because they show Kiteworks trying to win on trust architecture, not just on feature density. Automation
    matters because deployment friction is one of the few places where a security platform can lose a
    deal even when the policy story is strong.'
  claimRefs:
  - CE004
  - CE005
  - CE006
  - CE007
  - CE013
  tableRefs:
  - TE002
- id: product-governance
  title: Trust, open source, and security
  body: 'Kiteworks is also using governance as a product feature. FedRAMP Moderate, FedRAMP High In Process,
    the public advisories repository, and the ownCloud OSPO all point in the same direction: trust is
    earned through process and traceability. The main caveat is that the public sources stop short of
    fully enumerating every SKU and roadmap milestone, so the product map remains partly inferred. The
    main unresolved question is not whether the platform exists; it is how the modules, deployment options,
    and roadmap are packaged in commercial terms. That leaves the roadmap question open, but the architecture
    story is now visibly broader than a narrow file-transfer product.'
  claimRefs:
  - CE008
  - CE009
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
  tableRefs:
  - TE003
  figureRefs:
