- id: FE001
  title: Product Architecture Map
  type: stack
  layout: wide
  summary: Layered architecture from infrastructure through governance and AI-agent controls.
  data:
    layers:
    - label: Infrastructure layer
      detail: Hosted / customer-managed private cloud and gov cloud environments; automation and provisioning
        supported by AWS partner materials
    - label: Identity and policy layer
      detail: SAML, MFA, certificates, scoped delegation, ABAC-style policy
    - label: Channel layer
      detail: Email, file sharing, MFT, SFTP, APIs, forms, desktop sync, AI agents
    - label: Audit / evidence layer
      detail: Normalized audit trail and compliance reporting across channels
    - label: Security operations layer
      detail: Public advisories, bug bounty, responsible disclosure, and patch communication
    - label: Open-source sovereignty layer
      detail: ownCloud OSPO, DCO contribution model, Apache 2.0 pathway
  approximationNotes: Layer stack is a synthesis of public product and governance descriptions.
