    - 54% use 4+ channels; 4% unified platform
    - Very large installed problem, not a niche
  - - AI governance lens
    - 43% name AI security/governance as a top priority
    - Budget urgency rising with AI deployments
  - - Compliance lens
    - 63% report a compliance consequence; 80% had an incident
    - Pain-based buying is already happening
  - - Partner lens
    - Channel-first program targets MSPs / MSSPs / integrators
    - Channel-mediated land-and-expand is credible
  notes: This table deliberately avoids pretending a precise dollar TAM exists; it instead frames multiple
    evidence-constrained sizing lenses.
