  - - Regulatory pull
    - HIPAA, CMMC, GDPR, PCI DSS, IRAP, FedRAMP
    - Why buyers pay for governance rather than convenience
  notes: A boundary table, not a formal TAM model; spend categories are inferred from public product positioning
    and survey evidence.
