schemaVersion: "report-v2"
artifact: valuation
slug: rentberry
runDate: 2026-10-19
company:
  name: Rentberry
chapter:
  number: 8
  title: Valuation
  summary: >-
    Rentberry presents a functioning rental workflow and substantial company-reported reach, but
    public financing records do not reconcile: references span an $85.1 million historical
    crowdfunding valuation, a reported $200 million 2026 pre-money valuation, and a $1 billion
    database mark. Without audited current revenue, a reconciled capitalization table, or direct
    listing evidence, the appropriate conclusion is research-more with high risk and a stretched
    valuation stance.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The recommendation is research-more, with medium confidence, high risk, and a stretched
      valuation stance. The positive case begins with a live product: Rentberry's own pages show
      applications, tours, screening, payments, e-signatures, and maintenance workflows, while
      current promotional materials claim broad geographic and user scale. The anti-thesis is more
      consequential for an entry decision. Public sources do not provide a consistent financing
      history, independently verified operating KPIs, or current financial statements that could
      connect product usage to enterprise value. Entry discipline should therefore be evidence-led,
      not narrative-led: no investment price is supportable until management reconciles security
      classes, fully diluted ownership, revenue, retention, gross margin, cash, and runway. A lower
      headline price alone would not cure those underwriting gaps.
    claimRefs: [CV001, CV002, CV004, CV005, CV006, CV015, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-and-valuation-context
    title: Financing and valuation context
    body: >-
      The freshest company-issued release says Rentberry was launching a $20 million pre-IPO round;
      it does not establish that the round closed or that $20 million became cash available. A
      separate article described a capital injection, while SaaSRise reported a $4.98 million Reg CF
      close at a $200 million pre-money valuation. Historical references widen rather than resolve
      the range: StartEngine displayed an $85.1 million valuation for a closed common-stock offer,
      and Tracxn displays a $1 billion mark dated December 2024. EquityZen's public page lists only
      $1.2 million of total funding, while an IT Brand Pulse article reports more than $40 million
      raised. These values have different dates, instruments, and provenance; none is a substitute
      for a current cap table or cash balance.
    claimRefs: [CV002, CV003, CV007, CV008, CV009, CV010, CV013, CV014, CV016]
    tableRefs: [TV002]
  - id: scenarios-and-comparable-frame
    title: Scenarios and comparable frame
    body: >-
      Scenario analysis must use conditional entry rules rather than a false point estimate.
      Tracxn's peer set confirms that Rentberry operates among funded rental marketplaces and
      property-management software companies, but the public page supplies funding comparisons,
      not normalized revenue or transaction multiples. The bull case requires audited operating
      evidence that converts reported scale into durable monetization and supports no more than the
      reported $200 million 2026 pre-money reference. The base case treats the observed $85.1
      million to $200 million financing references as a wide, non-comparable band and requires a
      material uncertainty discount. The bear case assumes weak monetization or financing failure;
      even a price below the historical $85.1 million reference would remain uninvestable without
      proof of solvency and unit economics.
    claimRefs: [CV004, CV005, CV006, CV009, CV011, CV012, CV013, CV016]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness, diligence asks, and thesis-break triggers
    body: >-
      Public-market readiness is asserted rather than demonstrated in the retained evidence. A
      reserved ticker and an announced pre-IPO round are milestones in a financing narrative, not
      proof of an effective registration statement, exchange approval, underwriter mandate, or
      listing timetable. The final diligence package should include audited 2024-2026 financials, a
      monthly KPI bridge from users and properties to paying activity, the current capitalization
      table by security class, liquidation preferences and bonus-share dilution, cash and debt,
      board approvals, and direct SEC or exchange correspondence. Thesis-break triggers are failure
      to reconcile the $85.1 million, $200 million, and $1 billion marks; inability to substantiate
      revenue against reported scale; another retail round without institutional validation; or a
      missed listing milestone without a funded operating plan.
    claimRefs: [CV002, CV007, CV010, CV011, CV013, CV014, CV016]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Decision field, Current view, Evidence basis, Investment implication]
    rows:
      - [Recommendation, Research more, "Product exists but valuation inputs do not reconcile", "Do not invest before primary diligence"]
      - [Confidence, Medium, "Multiple current sources agree that financing activity is being marketed, but terms and completion conflict", "Treat every headline financing figure as provisional"]
      - [Risk rating, High, "Private-company liquidity, disclosure, monetization, and execution risks remain unresolved", "Require loss-tolerant sizing only after gaps close"]
      - [Valuation stance, Stretched, "Reported references range from $85.1M historically to $200M pre-money and $1B", "Demand a material uncertainty discount to any verified current term"]
      - [Decision implication, No priceable entry today, "No audited current revenue, cap table, preference stack, cash, or runway is public", "Obtain the diligence package before term-sheet work"]
    notes: "Analyst judgment as of 2026-10-19; valuation references differ by date, instrument, and source and are not treated as directly comparable."
    claimRefs: [CV001, CV002, CV009, CV010, CV011, CV013, CV015, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Argument, Supporting evidence, What would change the view]
    rows:
      - [Thesis, "A live end-to-end rental workflow can support multiple monetization surfaces", "Official pages show search, applications, screening, e-signing, payments, and maintenance", "Audited revenue by product and cohort retention would strengthen the thesis"]
      - [Thesis, "Reported reach could create marketplace and data advantages", "Company-issued materials claim 90+ countries, 20M+ properties, and 5M monthly active users", "Independent KPI definitions and paying-activity conversion are required"]
      - [Anti-thesis, "Financing and valuation disclosures are internally difficult to reconcile", "Public references include $85.1M, $200M pre-money, and $1B marks plus inconsistent total-funding figures", "A fully diluted cap table and signed financing documents could resolve the conflict"]
      - [Anti-thesis, "Commercial proof appears weak relative to the highest valuation mark", "Tracxn reports less than $1M annual revenue as of April 2024; current audited revenue is absent", "Audited 2025-2026 revenue, margin, retention, and cash evidence could reverse this view"]
    notes: "The scale figures are company claims or confirming coverage, not independently audited operating metrics; the revenue reference is dated April 2024."
    claimRefs: [CV001, CV004, CV005, CV006, CV007, CV009, CV010, CV011, CV013, CV014, CV016]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Assumptions, Valuation or return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Audited KPIs validate monetization, retention, and cash runway; the 2026 round closes on clean terms", "Conditional ceiling at the reported $200M pre-money reference; upside requires evidence not presently public", "Execution and listing timing", "Low support in current public evidence"]
      - [Base, "Product remains active, reported scale is partly real, but monetization and financing remain opaque", "$85.1M-$200M is an observed financing-reference band, not a fair-value range; require a material uncertainty discount", "Dilution, preference overhang, and weak conversion from usage to revenue", "Most consistent with retained evidence"]
      - [Bear, "Scale claims do not convert to revenue, the financing does not close, or liquidity needs force repricing", "Below the historical $85.1M reference still does not create investability without solvency and unit-economics proof", "Down round, illiquidity, cash shortfall, or delayed listing", "Material downside cannot be bounded publicly"]
    notes: "Scenario values are entry-discipline references derived from disclosed financing marks, not intrinsic-value estimates or forecasts; no probability percentages are assigned."
    claimRefs: [CV002, CV004, CV005, CV006, CV009, CV011, CV013, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: "The evidence chain moves from verified product breadth through unverified scale and conflicting financing marks to a research-more decision."
    data:
      nodes:
        - id: product
          label: Operational product
          detail: "Official pages show a broad digital rental workflow."
        - id: scale
          label: Reported scale
          detail: "Company-issued materials claim global reach, properties, and monthly users."
        - id: financing
          label: Financing activity
          detail: "A $20M pre-IPO round was announced, while a $4.98M Reg CF close was reported."
        - id: valuation
          label: Conflicting marks
          detail: "$85.1M, $200M pre-money, and $1B references are not reconciled."
        - id: financials
          label: Missing financial proof
          detail: "Current audited revenue, margin, retention, cash, and runway are absent."
        - id: risk
          label: High underwriting risk
          detail: "Cap-table, preference, dilution, and listing evidence remain private."
        - id: decision
          label: Research more
          detail: "No priceable entry until primary diligence closes the gaps."
      edges:
        - from: product
          to: scale
        - from: scale
          to: financing
        - from: financing
          to: valuation
        - from: valuation
          to: financials
        - from: financials
          to: risk
        - from: risk
          to: decision
    approximationNotes: "The flow expresses analytical dependency, not probability, magnitude, or a valuation bridge."
    claimRefs: [CV001, CV003, CV008, CV010, CV011, CV014, CV016]
callouts:
  - calloutType: recommendation
    title: Price is not yet underwritable
    body: "Treat every disclosed valuation as a reference point until current audited financials and the fully diluted capitalization table reconcile the transaction history."
    claimRefs: [CV009, CV010, CV011, CV013, CV014, CV016]
  - calloutType: risk
    title: Financing language is not cash evidence
    body: "The retained company release says the $20 million round was launching; it does not establish a close, cash receipt, or runway."
    claimRefs: [CV002, CV003, CV016]
