schemaVersion: report-v2
artifact: company-overview
slug: rentberry
runDate: 2026-10-19
company:
  name: Rentberry
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Rentberry is a San Francisco-founded rental workflow platform whose official
    materials now market a pre-IPO, AI-enabled landlord/tenant stack, but the
    public record is materially inconsistent on valuation, scale, and even some
    leadership details. The strongest current evidence supports real product
    breadth, repeated fundraising access, and sustained user reach, while
    leaving cap-table, governance-rights, and metric-reconciliation questions
    open.
sections:
  - id: identity-and-platform
    title: Identity and platform scope
    body: >-
      Reviewed company and third-party materials consistently place Rentberry in
      San Francisco and date the company's founding to 2015, even though
      street-level address details vary across public pages. The product
      position is clearer than the capital story: Rentberry describes a
      long-term rental workflow that connects tenants and landlords across
      search, applications, screening, negotiation, e-signing, payments, and
      maintenance rather than a narrow listing marketplace. Official investor
      marketing has shifted the identity toward an AI-enabled, pre-IPO story,
      including a claimed Nasdaq ticker reservation, so later chapters should
      treat the company as an operating rental platform with increasingly
      capital-markets-oriented messaging.
    claimRefs:
      - CO001
      - CO002
      - CO003
    figureRefs:
      - FO001
  - id: leadership-and-governance
    title: Leadership, founder dependence, and governance visibility
    body: >-
      Public 2026 materials show a founder-led organization centered on CEO
      Oleksiy Lubinsky, with engineering, marketing, design, and investor
      relations functions called out by name. That concentration is a double
      signal: it suggests a coherent operating core, but it also means execution
      and financing remain tightly tied to a small leadership bench. Public
      disclosures are not fully clean. KingsCrowd and Rentberry's current
      investor site align on the active executive team, yet EquityZen still
      presents Aleksey Perfilov as co-founder and CTO, implying either a stale
      marketplace profile or an under-explained leadership transition. The
      reviewed pool also does not surface a clearly public board roster or a
      rights map for minority common holders, leaving governance diligence
      incomplete.
    claimRefs:
      - CO004
      - CO005
      - CO006
      - CO015
    tableRefs:
      - TO002
      - TO003
  - id: capital-history-and-scale
    title: Funding history, valuation drift, and scale disclosure quality
    body: >-
      Rentberry has clearly raised capital repeatedly, but public summaries do
      not reconcile into a single capitalization story. Tracxn reports $118
      million across ten rounds, including a September 2024 Series A at a $1
      billion post-money valuation. By contrast, StartEngine's earlier
      2023 crowdfunding page closed at an $85.1 million valuation, KingsCrowd's
      Republic analysis shows a $138.7 million pre-money value for the current
      common-stock round, and SaasRise summarizes an August 2026 Reg CF as a
      $200 million pre-money financing. Scale metrics are similarly noisy:
      public materials cite user counts ranging from one million to seven
      million monthly users and property/listing figures from nine million to
      more than twenty million. The company therefore looks financeable, but not
      yet publicly metric-disciplined.
    claimRefs:
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
      - CO014
      - CO016
    tableRefs:
      - TO001
  - id: current-operating-signal-and-open-gaps
    title: Current operating signal and unresolved diligence gaps
    body: >-
      The strongest third-party operating signal in the pool comes from
      KingsCrowd's review of the 2026 Republic round, which cites audited 2025
      revenue of $1.72 million, a 2025 net loss of $4.77 million, and a
      minority-holder package without anti-dilution or meaningful governance
      protections. Those numbers point to a real operating business, but also to
      a company still far from self-funding and still dependent on capital
      markets access. The key open issues for later diligence are not whether
      Rentberry exists or has product reach; they are whether the company can
      reconcile valuation claims, user-property metrics, board oversight, and
      shareholder rights tightly enough for underwriting.
    claimRefs:
      - CO010
      - CO011
      - CO012
      - CO013
      - CO015
      - CO016
