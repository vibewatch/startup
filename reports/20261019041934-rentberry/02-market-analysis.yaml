callouts:
  - calloutType: insight
    title: Small-operator leasing workflow is the clearest evidenced wedge
    body: The strongest externally supported buyer case is not 'all of real estate' but smaller landlords and boutique property managers that want one workflow for listing, screening, e-signing, payments, and communication.
    claimRefs: [CM001, CM002, CM003]
  - calloutType: risk
    title: Large market narrative outruns reconciled market math
    body: The assigned sources support a very large rental-market backdrop, but they do not reconcile Rentberry's current users, inventory, capital raised, or monetization into a clean SAM/SOM model that an investor can underwrite confidently.
    claimRefs: [CM004, CM014, CM016]
