  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-gap
      missingEvidence: A denominator-consistent market model that bridges a defined residential-leasing workflow into TAM, SAM, and SOM by geography, customer segment, and monetization basis.
      whyItMatters: Without a reconciled sizing model, the market narrative stays directional and cannot anchor valuation or go-to-market efficiency with confidence.
      diligencePath: Obtain a current management market model or third-party sector study that ties renter, landlord, property, and revenue assumptions to the same date and geography.
      relatedQuestionRefs: [QM006]
      relatedTableRefs: [TM002]
    - type: conflicting-data
      severity: material
