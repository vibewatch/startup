        title: Capability and packaging favor different buyer jobs
        blocks:
          - type: paragraph
            body: >-
              Rentberry's most defensible product story is workflow depth. Official pages repeatedly combine search,
              applications, screening, payments, e-signing, partner syndication, and maintenance in one account, and
              2026 marketing doubles down on AI-driven leasing automation and dynamic pricing. The local specialist
              comparison cuts the other way on inventory and discovery: Luntero describes Pararius as a large agency-fed
              Dutch aggregator with a paid acceleration tier, while it frames Rentberry's Netherlands supply as less
              predictable and Luntero's own advantage as commute-aware search tools. The result is a segmented market
              structure rather than a clean winner-take-most contest, with explicit public pricing still clearer for
