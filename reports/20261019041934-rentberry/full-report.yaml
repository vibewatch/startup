        title: Public traction versus unit-economics visibility
        blocks:
          - type: paragraph
            body: >-
              Rentberry publishes or syndicates large scale claims, but the metric set is not presented as a reconciled
              financial bridge. Company-controlled 2026 releases repeat more than 90 countries, more than 20 million
              properties, and more than 5 million monthly active users, while the older StartEngine campaign cites
              different baselines such as 1M+ monthly active users, 9M+ listings, 8M users, and 24M properties. IT Brand
              Pulse repeats the company's claim that dynamic pricing can reduce pricing errors by up to 30%, but that is
              not tied to a disclosed revenue, conversion, or gross-margin outcome. Tracxn contributes one hard
              commercial datapoint by listing annual revenue below $1M as of April 2024, which highlights how far public
