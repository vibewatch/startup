      - number: '1.3'
        title: Funding history, valuation drift, and scale disclosure quality
        blocks:
          - type: paragraph
            body: >-
              Rentberry has clearly raised capital repeatedly, but public summaries do not reconcile into a single
              capitalization story. Tracxn reports $118 million across ten rounds, including a September 2024 Series A
              at a $1 billion post-money valuation. By contrast, StartEngine's earlier 2023 crowdfunding page closed at
              an $85.1 million valuation, KingsCrowd's Republic analysis shows a $138.7 million pre-money value for the
              current common-stock round, and SaasRise summarizes an August 2026 Reg CF as a $200 million pre-money
              financing. Scale metrics are similarly noisy: public materials cite user counts ranging from one million
              to seven million monthly users and property/listing figures from nine million to more than twenty million.
              The company therefore looks financeable, but not yet publicly metric-disciplined.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO014
              - CO016
