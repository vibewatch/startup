  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Workflow boundary and best-evidenced buyer wedge
        blocks:
          - type: paragraph
            body: >-
              Rentberry's official product surfaces consistently define the company around the long-term residential
              rental journey rather than around home sales, hospitality, or a general real-estate operating system. The
              core workflow spans search, applications, tenant screening, lease execution, rent collection, and
              maintenance requests for tenants and landlords, while the investor campaign further frames the relevant
              operating loop as the 12-month lease cycle. Independent product analysis narrows the most credible buyer
              wedge: the clearest public fit is with independent landlords, small portfolio owners, and boutique
              property managers rather than with enterprise operators that need deeper accounting, work-order, and
              integration breadth. That means the most defensible market boundary is leasing-workflow software and
              marketplace tooling for smaller residential operators, with enterprise property-management and
              short-term-stay platforms treated as adjacencies or substitutes rather than as proven served categories.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
