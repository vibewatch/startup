              - CO010
              - CO011
              - CO014
              - CO016
      - number: '1.4'
        title: Current operating signal and unresolved diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest third-party operating signal in the pool comes from KingsCrowd's review of the 2026 Republic
              round, which cites audited 2025 revenue of $1.72 million, a 2025 net loss of $4.77 million, and a
              minority-holder package without anti-dilution or meaningful governance protections. Those numbers point to
              a real operating business, but also to a company still far from self-funding and still dependent on
              capital markets access. The key open issues for later diligence are not whether Rentberry exists or has
              product reach; they are whether the company can reconcile valuation claims, user-property metrics, board
              oversight, and shareholder rights tightly enough for underwriting.
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO015
