chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and platform scope
        blocks:
          - type: paragraph
            body: >-
              Reviewed company and third-party materials consistently place Rentberry in San Francisco and date the
              company's founding to 2015, even though street-level address details vary across public pages. The product
              position is clearer than the capital story: Rentberry describes a long-term rental workflow that connects
              tenants and landlords across search, applications, screening, negotiation, e-signing, payments, and
              maintenance rather than a narrow listing marketplace. Official investor marketing has shifted the identity
              toward an AI-enabled, pre-IPO story, including a claimed Nasdaq ticker reservation, so later chapters
              should treat the company as an operating rental platform with increasingly capital-markets-oriented
              messaging.
            claimRefs:
              - CO001
              - CO002
              - CO003
