              - CM004
      - number: '2.2'
        title: Evidence-constrained sizing lenses and adoption drivers
        blocks:
          - type: paragraph
            body: >-
              The assigned pool supports several directional market lenses but not a single clean sizing stack.
              Rentberry's StartEngine campaign cites $694B of annual US rent spend, 44 million rented US properties in
              2021, more than 641 million rental units globally, and about 2.3 billion people living in long-term
              rentals.       Separately, 2026 company-issued releases describe current operating reach at more than 90
              countries, over 20 million listed properties, and roughly 5 million monthly active users. Those signals
              together suggest a very large underlying rental market and a company strategy aimed at automating
              high-friction steps such as pricing, screening, signatures, payments, and maintenance. The adoption logic
              is strongest where landlords or smaller managers want to replace paper, fragmented communication, and
              manual leasing tasks with a single workflow; official product pages and press releases repeatedly tie the
              value proposition to speed, contactless execution, and better price discovery.
            claimRefs:
              - CM001
