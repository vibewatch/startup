        title: Adoption signals are real, but the metric glossary is not
        blocks:
          - type: paragraph
            body: >-
              The assigned pool contains several adoption signals, but they do not line up cleanly enough to support a
              single customer-growth curve. StartEngine's archived offering materials cite 1M+ monthly active users, 9M+
              listings, and more than 60 partnerships, and elsewhere on the same page cite 8M users, 24M properties, and
              137K locations in 2021. Company-issued 2026 media materials shift again to more than 90 countries, 20M
              properties, and roughly 5M monthly active users. Those numbers are directionally supportive of real scale,
              but they rotate across users, monthly actives, listings, properties, processed properties, and locations
              without a reconciled glossary, so public evidence supports reach more than it supports comparable growth
              or monetized-customer trend lines.
