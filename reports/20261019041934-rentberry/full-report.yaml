  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape breadth extends beyond named portals
        blocks:
          - type: paragraph
            body: >-
              Public materials position Rentberry against more than one portal class. Official and crowdfunding surfaces
              describe the product as an end-to-end long-term rental workflow with applications, screening, payments,
              e-signing, maintenance, and AI-driven pricing, while also framing the status quo as classifieds, agents or
              brokers, and manual paperwork rather than a single software rival. In the assigned competitor-specific
              evidence, Pararius appears as the strongest local Dutch inventory-led alternative, and Luntero appears as
              the strongest context-led local-search specialist. That matters because Rentberry's competitive set spans
              both direct portals and substitute workflows: buyers can multi-home across a local portal for breadth, a
              search specialist for neighborhood context, and Rentberry for cross-border workflow convenience.
