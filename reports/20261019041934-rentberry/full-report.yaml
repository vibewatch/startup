        - Scale claims do not convert to revenue, the financing does not close, or liquidity needs force repricing
        - >-
          Below the historical $85.1M reference still does not create investability without solvency and unit-economics
          proof
        - Down round, illiquidity, cash shortfall, or delayed listing
        - Material downside cannot be bounded publicly
    notes: >-
      Scenario values are entry-discipline references derived from disclosed financing marks, not intrinsic-value
      estimates or forecasts; no probability percentages are assigned.
    claimRefs:
      - CV002
