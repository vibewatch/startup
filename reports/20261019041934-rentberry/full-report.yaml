              Public capital signals are easier to find than operating efficiency data, but they still need
              reconciliation. The 2023 StartEngine page showed an $85.1M valuation and $10K-$5M Reg CF target, National
              Law Review's press-release page later said Rentberry had raised over $40M, Tracxn reported $118M over 10
