              - CU007
              - CU013
      - number: '6.3'
        title: Named proof exists, but it is still curated and shallow
        blocks:
          - type: paragraph
            body: >-
              Rentberry's homepage goes beyond logo walls by publishing short named testimonial snippets from two
              landlords and two tenants. That is better than unsupported brand imagery, because the quotes at least tie
              the product to actual use cases such as tenant acquisition, lease signing, apartment search, and
              self-management. But the proof remains shallow: the quotes are undated, company-hosted, and uncorroborated
              by independent case studies, procurement records, or disclosed deployment sizes. The result is enough
              evidence to show real workflow usage is plausible, but not enough to underwrite deployment depth,
              stickiness, or revenue importance by cohort.
            claimRefs:
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU008
      - number: '6.4'
        title: Expansion levers are visible; durability and concentration are not
        blocks:
          - type: paragraph
            body: >-
              Public materials imply multiple expansion paths around the core rental workflow. The FAQ says core use is
              free for landlords and tenants while paid add-ons include tenant screening and renters insurance, and
              StartEngine adds enterprise clients, moving-company leads, Flexible Living, and Happy Seniors as revenue
              ambitions. The problem is that none of the retained sources disclose retention, churn, renewal terms,
              ARPU, contract length, top-customer concentration, or how many landlords and property managers actually
              convert from free usage to paying relationships. ITQlick's complaints about opaque pricing and limited
              enterprise depth therefore matter: public evidence supports real adoption and expansion intent, but not
              durable monetized customer economics.
            claimRefs:
              - CU003
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Best-fit buyer looks narrower than the top-line marketplace story
            body: >-
              The public product story is broad, but the strongest independent fit signal points to small landlords and
              boutique property managers rather than enterprise operators. That narrows the likely paying cohort even
              while overall marketplace reach appears large.
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: callout
            title: Durability still cannot be underwritten from the assigned pool
            body: >-
              None of the retained sources disclose churn, NRR, GRR, renewal rate, contract length, top-customer
              concentration, or customer mix by paying status. The chapter can support real usage and product breadth,
              but not durable monetized-customer economics.
            calloutType: risk
            claimRefs:
              - CU007
              - CU010
              - CU011
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk frame
        blocks:
          - type: paragraph
            body: >-
              The most important current risk is not whether Rentberry has a product, but whether investors can
              underwrite the legal, financing, and operational claims that now sit underneath its public-listing
              narrative. Company-aligned 2026 releases describe a reserved NASDAQ ticker, a projected 2027 public
              listing, and a 2026 $20 million pre-IPO round, while the independent SaaSRise profile adds a $4.98 million
              Reg CF common-stock round, 838 investors, a $200 million pre-money valuation, and a planned $15 million
              follow-on in 2027. At the same time, the reviewed public materials do not reconcile the cap table, board
              rights, liquidation preferences, or a consistent operating-scale glossary. That leaves financing and
              disclosure risk above the level implied by the marketing tone of the pre-IPO narrative.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR010
              - CR014
      - number: '7.2'
        title: Regulatory, legal, and disclosure risk
        blocks:
          - type: paragraph
            body: >-
              The legal-disclosure package still looks thin relative to the ambition of the financing story. Publicly
              reviewed sources support that Rentberry is marketing a public-listing path and additional private capital,
              but they do not provide the underwriting basics a late-stage common-stock buyer would normally want before
              trusting valuation language or IPO timing: a reconciled cap table, rights map, liquidation waterfall, or a
              clean explanation of how prior Reg A, Reg CF, and venture rounds stack together. Jurisdictional complexity
              also matters because company materials describe operations across more than 90 countries and product
              features such as pricing optimization, tenant screening, payments, and digital signatures, all of which
              can trigger different consumer, privacy, and housing-law obligations by market. Finally, the official
              pages still present "Patents Pending" rather than issued patent assets, so IP defensibility should be
              treated as a diligence item rather than a resolved moat.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
              - CR008
              - CR014
      - number: '7.3'
        title: Operational, security, and execution risk
        blocks:
          - type: paragraph
            body: >-
              Rentberry's product promise is unusually broad: AI-driven search and pricing, automated lead handling,
              tenant screening, digital signatures, rent payments, and maintenance workflows inside one system. That
              breadth can be a strength, but it also raises failure-mode surface area. The reviewed sources show only
              public-control descriptions such as SSL, payment-history tooling, and AI-based duplicate-listing
              detection; they do not surface third-party security attestations, incident history, or quantified
              performance metrics for the automation claims. The staffing signal is also modest versus the claimed
              footprint: the about page says the company has 30 dedicated people, while company-aligned and independent
              sources describe 90+ country reach, 20 million properties, and multi-step workflow automation. Until
              diligence closes that gap with operational metrics and assurance packs, residual execution risk remains
              high.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR009
              - CR010
              - CR011
      - number: '7.4'
        title: Partner, channel, and capital dependence
        blocks:
          - type: paragraph
            body: >-
              Rentberry depends on several external rails that sit on critical workflow paths. The official product
              pages explicitly name Dropbox Sign for legally binding documents and Apple Pay, Google Pay, and card rails
              for rental payments, while the marketplace pages also market listing syndication to partner websites and
              tenant screening against state and federal databases. Those integrations can speed onboarding, but they
              also create dependency, compliance, and outage-transfer risk if policies, economics, or service
              availability change. Capital dependence is similarly visible in public sources: company-aligned releases
              market a 2026 pre-IPO round, and SaaSRise reports a near-cap retail crowdfunding raise plus a planned 2027
              follow-on round. If the next financing, listing timetable, or investor-rights package slips, the residual
              risk to common-equity holders rises quickly because the current public record still leans more on
              narrative than on reconciled financing detail.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Kill criteria before underwriting common equity
            body: >-
              Do not underwrite a late-stage common entry or IPO-adjacent pricing case without a reconciled cap table,
              rights package, liquidation waterfall, and an independent security/compliance evidence pack; those are the
              fastest ways to falsify the current pre-IPO narrative.
            calloutType: risk
            claimRefs:
              - CR004
              - CR007
              - CR014
          - type: callout
            title: Monitorable triggers
            body: >-
              A slipped 2027 follow-on or listing timetable, continued inconsistency between monthly-active-user and
              total-user disclosures, or a disruption in payment or signature rails should be treated as measurable
              signs that residual risk is rising rather than shrinking.
            calloutType: insight
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR012
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more, with medium confidence, high risk, and a stretched valuation stance.
              The positive case begins with a live product: Rentberry's own pages show applications, tours, screening,
              payments, e-signatures, and maintenance workflows, while current promotional materials claim broad
              geographic and user scale. The anti-thesis is more consequential for an entry decision. Public sources do
              not provide a consistent financing history, independently verified operating KPIs, or current financial
              statements that could connect product usage to enterprise value. Entry discipline should therefore be
              evidence-led, not narrative-led: no investment price is supportable until management reconciles security
              classes, fully diluted ownership, revenue, retention, gross margin, cash, and runway. A lower headline
              price alone would not cure those underwriting gaps.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV010
              - CV011
              - CV014
              - CV016
      - number: '8.2'
        title: Financing and valuation context
        blocks:
          - type: paragraph
            body: >-
              The freshest company-issued release says Rentberry was launching a $20 million pre-IPO round; it does not
              establish that the round closed or that $20 million became cash available. A separate article described a
              capital injection, while SaaSRise reported a $4.98 million Reg CF close at a $200 million pre-money
              valuation. Historical references widen rather than resolve the range: StartEngine displayed an $85.1
              million valuation for a closed common-stock offer, and Tracxn displays a $1 billion mark dated December
              2024. EquityZen's public page lists only $1.2 million of total funding, while an IT Brand Pulse article
              reports more than $40 million raised. These values have different dates, instruments, and provenance; none
              is a substitute for a current cap table or cash balance.
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
              - CV016
      - number: '8.3'
        title: Scenarios and comparable frame
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis must use conditional entry rules rather than a false point estimate. Tracxn's peer set
              confirms that Rentberry operates among funded rental marketplaces and property-management software
              companies, but the public page supplies funding comparisons, not normalized revenue or transaction
              multiples. The bull case requires audited operating evidence that converts reported scale into durable
              monetization and supports no more than the reported $200 million 2026 pre-money reference. The base case
              treats the observed $85.1 million to $200 million financing references as a wide, non-comparable band and
              requires a material uncertainty discount. The bear case assumes weak monetization or financing failure;
              even a price below the historical $85.1 million reference would remain uninvestable without proof of
              solvency and unit economics.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV009
              - CV011
              - CV012
              - CV013
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV009
              - CV011
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Public-market readiness is asserted rather than demonstrated in the retained evidence. A reserved ticker
              and an announced pre-IPO round are milestones in a financing narrative, not proof of an effective
              registration statement, exchange approval, underwriter mandate, or listing timetable. The final diligence
              package should include audited 2024-2026 financials, a monthly KPI bridge from users and properties to
              paying activity, the current capitalization table by security class, liquidation preferences and
              bonus-share dilution, cash and debt, board approvals, and direct SEC or exchange correspondence.
              Thesis-break triggers are failure to reconcile the $85.1 million, $200 million, and $1 billion marks;
              inability to substantiate revenue against reported scale; another retail round without institutional
              validation; or a missed listing milestone without a funded operating plan.
            claimRefs:
              - CV002
              - CV007
              - CV010
              - CV011
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is not yet underwritable
            body: >-
              Treat every disclosed valuation as a reference point until current audited financials and the fully
              diluted capitalization table reconcile the transaction history.
            calloutType: recommendation
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
              - CV016
          - type: callout
            title: Financing language is not cash evidence
            body: >-
              The retained company release says the $20 million round was launching; it does not establish a close, cash
              receipt, or runway.
            calloutType: risk
            claimRefs:
              - CV002
              - CV003
              - CV016
