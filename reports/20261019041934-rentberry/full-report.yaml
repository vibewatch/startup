      - number: '5.3'
        title: Maturity, dependencies, and unresolved diligence items
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a real product with a usable workflow, but not a fully underwritten technical moat.
              User feedback is mixed: one Capterra reviewer praised syndication, screening, and online lease signing,
              while others complained that the product still needed development or that customer support failed in
              important moments. That makes support quality and implementation execution a meaningful product risk
              rather than a peripheral service issue. The official surface also exposes dependency clues: e-signing
              relies on Dropbox Sign, and the site advertises partner distribution rather than claiming wholly
              proprietary demand capture. The company asserts "Patents Pending," but the assigned evidence does not
              identify patent numbers, granted claims, architecture diagrams, named certifications, uptime targets, API
              references, or independent validation of the AI-agent rollout. For diligence, the product passes the "real
              workflow exists" threshold but still fails the "technical maturity and defensibility are externally
              verified" threshold.
            claimRefs:
