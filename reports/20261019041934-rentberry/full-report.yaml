              - CO003
              - CO007
              - CO008
              - CO009
      - number: '1.2'
        title: Leadership, founder dependence, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Public 2026 materials show a founder-led organization centered on CEO Oleksiy Lubinsky, with engineering,
              marketing, design, and investor relations functions called out by name. That concentration is a double
              signal: it suggests a coherent operating core, but it also means execution and financing remain tightly
              tied to a small leadership bench. Public disclosures are not fully clean. KingsCrowd and Rentberry's
              current investor site align on the active executive team, yet EquityZen still presents Aleksey Perfilov as
              co-founder and CTO, implying either a stale marketplace profile or an under-explained leadership
              transition. The reviewed pool also does not surface a clearly public board roster or a rights map for
              minority common holders, leaving governance diligence incomplete.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO015
