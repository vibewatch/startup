      - number: '2.3'
        title: Constraints, contradictions, and what the evidence cannot yet prove
        blocks:
          - type: paragraph
            body: >-
              The same evidence set that makes the market look large also limits underwriting confidence. Public pricing
              is still opaque, so external readers cannot test payback, take rate, or whether the product clears
              small-landlord budget hurdles without direct sales contact. Independent review evidence also says the
              platform is less suitable for larger property-management organizations that require advanced asset
              management, maintenance depth, broader integrations, and complex accounting, which limits the currently
              evidenced buyer set.       Most importantly, the sizing and traction signals are not internally
              harmonized. A 2026 company-issued release says Rentberry had raised more than $40 million, while
              StartupHub's later profile reports $131 million of total funding; neither source provides a bridge between
              those totals. Likewise, broad population, rental-unit, rent-spend, platform-property, and active-user
              figures use different units and methodologies. Because those baselines do not reconcile to a common
              denominator, date, or monetization model, this chapter can support only an evidence-constrained market
              lens and explicit diligence asks rather than a precise SAM or SOM.
            claimRefs:
              - CM003
              - CM004
              - CM012
              - CM013
              - CM014
              - CM016
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Small-operator leasing workflow is the clearest evidenced wedge
            body: >-
              The strongest externally supported buyer case is not 'all of real estate' but smaller landlords and
              boutique property managers that want one workflow for listing, screening, e-signing, payments, and
              communication.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: callout
            title: Large market narrative outruns reconciled market math
            body: >-
              The assigned sources support a very large rental-market backdrop, but they do not reconcile Rentberry's
              current users, inventory, capital raised, or monetization into a clean SAM/SOM model that an investor can
              underwrite confidently.
