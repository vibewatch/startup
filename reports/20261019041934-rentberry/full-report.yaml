      - number: '5.2'
        title: Claimed automation stack and control surfaces
        blocks:
          - type: paragraph
            body: >-
              Rentberry's strongest current differentiation claim is not a hidden back-end architecture but a unified
              operating model: the company says it combines marketplace inventory, screening, contracting, payments, and
              maintenance with AI-assisted search and pricing. On the official site, that AI layer is still described at
              a marketing-feature level—smart search, dynamic pricing, automated communication, and an AI-powered
              description generator. The 2026 promotional releases go further, claiming a "fully automated" AI
              real-estate agent that qualifies leads, optimizes pricing with micro-market analysis, and orchestrates the
              rental lifecycle end to end. Trust and control claims are similarly real but high level: the official
              pages mention SSL-encrypted contract storage, background and credit screening, and press materials
              describe image-analysis controls for fraudulent or duplicate listings. What is still missing from the
              assigned evidence is public technical documentation that would let an investor test how much of this
              architecture is automated software, partner integrations, or manual operational workflow.
            claimRefs:
              - CE005
