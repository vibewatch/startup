      - number: '3.3'
        title: Durability depends on distribution and execution more than hard lock-in
        blocks:
          - type: paragraph
            body: >-
              The assigned pool supports a real but still moderate moat. Rentberry can point to a partner distribution
              story, older campaign claims of more than 60 rental-sector partnerships, and a 2026 crowdfunding round
              meant to extend AI product development and go-to-market. But the same evidence set leaves material limits.
              The company's own comparison surfaces show major metric drift over time, the about page still presents a
              30-person team, and the most direct competitor-issued comparison explicitly recommends mixing platforms
              rather than relying on one destination. That makes Rentberry look more differentiated on workflow breadth
              and capital access than on exclusive inventory, transparent pricing, or independently benchmarked trust
