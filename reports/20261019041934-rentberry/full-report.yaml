  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform scope and rental workflow coverage
        blocks:
          - type: paragraph
            body: >-
              The official surfaces support a clear product definition: Rentberry is a two-sided long-term-rental
              workflow platform rather than a single-point listing or payments tool. The company describes a tenant
              journey that covers search, online applications, tour scheduling, digital rent payments, e-signing, and
              maintenance requests, while the landlord flow adds listing creation, rent collection, tenant screening,
              and syndication to partner sites. Independent category coverage from Forge is directionally consistent
              with that positioning, describing Rentberry as an online rental service platform focused on price
              negotiation between tenants and landlords. Practitioner evidence is narrower but useful: archived Capterra
              reviews corroborate that at least some users experienced lease signing, syndication, and screening as real
              product surfaces rather than purely marketing copy.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE012
              - CE015
