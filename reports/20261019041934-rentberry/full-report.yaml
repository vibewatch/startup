              2026 Republic round at a $200M pre-money valuation with a planned $15M follow-on in 2027. Taken together,
              the record shows continued financing access, but not capital adequacy: the allowed sources do not disclose
              current cash, burn, runway, debt obligations, CAC, payback, or gross margin, so management data is still
