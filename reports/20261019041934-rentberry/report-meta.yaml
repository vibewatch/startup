  topStrengths:
    - The core rental workflow appears live and broad across search, leasing, screening, payment, and maintenance.
    - The company continues to access capital, including a current 2026 Reg CF and repeated financing references.
    - Public materials suggest meaningful market reach across countries, properties, and monthly users.
  topRisks:
