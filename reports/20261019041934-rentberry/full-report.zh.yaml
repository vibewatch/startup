        title: 平台范围与租赁工作流覆盖
        blocks:
          - type: paragraph
            body: >-
              官方页面支持一个清晰的产品定义：Rentberry
              是双边长租工作流平台，而不是单点房源列表或支付工具。公司描述的租客旅程覆盖搜索、在线申请、看房安排、数字租金支付、电子签名和维修请求；房东流程则增加创建房源、收租、租客筛选以及向合作伙伴网站分发房源。Forge
              的独立品类覆盖与这一定位大体一致，将 Rentberry 描述为专注于租客与房东议价的在线租赁服务平台。实践者证据更窄但有用：已归档的 Capterra
              评论印证，至少部分用户确实使用过签约、分发和筛选等产品功能，而不是只看到了营销文案。
