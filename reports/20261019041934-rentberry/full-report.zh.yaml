      - number: '7.3'
        title: 运营、安全与执行风险
        blocks:
          - type: paragraph
            body: >-
              Rentberry 的产品承诺异常宽泛：AI 驱动的搜索和定价、自动处理线索、租客筛选、数字签名、租金支付和维修工作流都放在同一系统里。这种广度可以成为优势，但也扩大了故障模式的覆盖面。审阅来源只展示了
              SSL、支付历史工具和 AI 重复房源检测等公开控制描述，没有出现第三方安全鉴证、事故历史，或针对自动化主张的量化性能指标。相对于声称的业务覆盖面，人员规模信号也偏小：关于页面称公司有 30
              名专职人员，而与公司一致的来源和独立来源都描述了 90+ 个国家、20 million 套房源和多步骤工作流自动化。在尽调用运营指标和保障材料填上这一缺口之前，剩余执行风险仍然很高。
            claimRefs:
              - CR005
