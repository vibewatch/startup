      - number: '8.4'
        title: 退出准备度、尽调要求与论点破坏触发因素
        blocks:
          - type: paragraph
            body: >-
              保留证据中对公开市场准备度的描述是宣称，而不是证明。预留的股票代码和宣布的 IPO 前融资是融资叙事中的里程碑，不是有效注册声明、交易所批准、承销商委任或上市时间表的证明。最终尽调包应包括经审计的
              2024-2026 年财务报表、从用户和房源到付费活动的月度 KPI 桥接、按证券类别划分的当前股权结构表、清算优先权和赠股稀释、现金和债务、董事会批准，以及直接的 SEC
              或交易所往来。论点破坏触发因素包括无法对账 $85.1 million、$200 million 和 $1 billion
              三个数字；无法将收入与报告的规模相互印证；再次进行没有机构验证的零售轮融资；或在没有已融资运营计划的情况下错过上市里程碑。
