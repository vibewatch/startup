      - number: '2.3'
        title: 约束、矛盾与证据目前无法证明的事项
        blocks:
          - type: paragraph
            body: >-
              同一组证据既让市场看起来很大，也限制了投资判断的信心。公开定价仍不透明，外部读者无法在不直接联系销售的情况下检验回本周期、抽成率，或产品是否跨过小房东的预算门槛。独立评测还认为，对于需要高级资产管理、更深维修能力、更广集成和复杂会计的大型物业管理机构，该平台适配度较低，这限制了目前有证据支持的买方范围。      
              更重要的是，规模和增长信号在内部并未统一。2026 年一份公司发布称 Rentberry 已融资超过 $40 million，而 StartupHub 后来的资料报告累计融资 $131
              million；两者都没有给出这两个数字之间的桥接。类似地，人口、租赁单元、租金支出、平台房源和活跃用户数据采用了不同单位和方法。由于这些基线无法对齐到共同的分母、日期或变现模型，本章只能支持受证据约束的市场视角和明确的尽调问题，不能支持精确的
              SAM 或 SOM。
            claimRefs:
              - CM003
              - CM004
              - CM012
              - CM013
              - CM014
              - CM016
