      - number: '4.2'
        title: 公开增长信号与单位经济透明度
        blocks:
          - type: paragraph
            body: >-
              Rentberry 发布或分发了大规模指标主张，但这些指标没有被组织成可对账的财务桥接。公司控制的 2026 年新闻稿重复超过 90 个国家、超过 20 million 套房源和超过 5 million
              月活用户；较早的 StartEngine 活动则给出不同基线，例如 1M+ 月活用户、9M+ 房源列表、8M 用户和 24M 套房源。IT Brand Pulse 重复公司的说法，称动态定价最多可将定价错误降低
              30%，但这没有与已披露的收入、转化率或毛利率结果挂钩。Tracxn 提供了一个较硬的商业数据点：截至 2024 年 4 月，年收入低于
              $1M，这也凸显了公开漏斗顶端活跃度指标与可纳入投资判断的单位经济视角之间有多大距离。
