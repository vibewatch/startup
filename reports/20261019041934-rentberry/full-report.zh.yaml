      - number: '7.2'
        title: 监管、法律与披露风险
        blocks:
          - type: paragraph
            body: >-
              相对于融资故事的野心，法律披露包仍显得单薄。公开审阅来源支持 Rentberry 正在营销一条上市路径并寻求额外私募资本，但没有提供后期普通股买方在相信估值语言或 IPO
              时间表之前通常会要求的基本投资判断材料：可对账的股权结构表、权利图谱、清算瀑布，或清楚解释此前 Reg A、Reg CF 和风险投资轮次如何叠加。司法辖区复杂性也很重要，因为公司材料称业务覆盖超过 90
              个国家，产品功能包括定价优化、租客筛选、支付和数字签名，所有这些在不同市场都可能触发不同的消费者、隐私和住房法律义务。最后，官方页面仍写着“Patents Pending”，而不是已授权的专利资产，因此 IP
              防御性应视为尽调事项，而不是已解决的护城河。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR014
