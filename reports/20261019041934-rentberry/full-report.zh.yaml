        title: 展示材料
        blocks:
          - type: callout
            title: 小型运营商租赁工作流是证据最充分的切口
            body: 外部支持最强的买方案例不是“所有房地产”，而是希望用一套工作流完成挂牌、筛选、电子签名、支付和沟通的小房东与精品物业管理公司。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: callout
            title: 巨大的市场叙事跑在可对账的市场数学前面
            body: 指定来源支持一个非常大的租赁市场背景，但无法将 Rentberry 当前用户、库存、融资额或变现情况对账成一套投资者可以有把握纳入投资判断的 SAM/SOM 模型。
            calloutType: risk
