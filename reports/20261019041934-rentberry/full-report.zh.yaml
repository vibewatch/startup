      - number: '3.2'
        title: 能力与产品包装对应不同买方任务
        blocks:
          - type: paragraph
            body: >-
              Rentberry 最有说服力的产品故事是工作流深度。官方页面反复把搜索、申请、筛选、支付、电子签名、合作伙伴分发和维修放进同一账户，2026 年营销又进一步强调 AI
              驱动的租赁自动化和动态定价。本地专家对比则在库存和发现能力上呈现相反结果：Luntero 将 Pararius 描述为由代理机构供给的大型荷兰聚合平台，并设有付费加速层；同时认为 Rentberry
              在荷兰的供给更不稳定，而 Luntero 的优势是考虑通勤的搜索工具。最终形成的是分层市场，而不是赢家通吃的竞争格局；Pararius 的公开定价也明显比 Rentberry 的房东收费模式更清楚。
