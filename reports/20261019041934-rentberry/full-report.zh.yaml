      - number: '1.3'
        title: 融资历史、估值漂移与规模披露质量
        blocks:
          - type: paragraph
            body: >-
              Rentberry 显然多次完成融资，但公开摘要无法还原出一套统一的资本结构故事。Tracxn 报告十轮融资合计 $118 million，其中包括 2024 年 9 月一轮投后估值为 $1 billion 的
              Series A。相比之下，StartEngine 较早的 2023 年众筹页面以 $85.1 million 估值收盘，KingsCrowd 对当前普通股轮的 Republic 分析给出 $138.7
              million 投前估值，SaasRise 则将 2026 年 8 月的 Reg CF 总结为 $200 million 投前融资。规模指标同样嘈杂：公开材料给出的用户数从 one million 到 seven
              million 月活用户不等，房源/列表数则从 nine million 到超过 twenty million 不等。因此，公司看起来具备融资能力，但公开指标还没有做到口径自洽。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO014
              - CO016
