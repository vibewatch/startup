      - number: '1.4'
        title: 当前运营信号与未解决的尽调缺口
        blocks:
          - type: paragraph
            body: >-
              材料池中最强的第三方运营信号来自 KingsCrowd 对 2026 年 Republic 轮的审阅，其中提到经审计的 2025 年收入为 $1.72 million、2025 年净亏损为 $4.77
              million，以及一个不含反稀释或实质性治理保护的少数股东条款包。这些数字说明公司确实在运营，但也说明它离自我造血仍很远，仍依赖资本市场融资。后续尽调的关键问题不是 Rentberry
              是否存在、是否有产品触达，而是公司能否足够严密地对齐估值主张、用户与房源指标、董事会监督和股东权利，以支撑投资判断。
