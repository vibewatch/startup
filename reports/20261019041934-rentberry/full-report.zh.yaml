      - number: '1.2'
        title: 领导层、创始人依赖与治理透明度
        blocks:
          - type: paragraph
            body: >-
              2026 年公开材料显示，公司由创始人主导，核心人物是 CEO Oleksiy
              Lubinsky；工程、营销、设计和投资者关系职能也都点名列出。这种集中既是双重信号：它说明运营核心较为统一，但也意味着执行和融资仍紧系于一个规模很小的领导班子。公开披露并不完全干净。KingsCrowd 与
              Rentberry 当前投资者网站对现任高管团队的描述一致，但 EquityZen 仍将 Aleksey Perfilov 列为联合创始人兼
              CTO，可能意味着该市场资料已经过时，也可能存在未充分解释的领导层交接。审阅材料中也没有出现清晰公开的董事会名单，或面向少数普通股股东的权利图谱，因此治理尽调仍不完整。
