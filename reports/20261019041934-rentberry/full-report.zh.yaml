      - number: '4.3'
        title: 资本充足性与投资判断阻碍
        blocks:
          - type: paragraph
            body: >-
              公开资本信号比运营效率数据更容易找到，但仍需要对账。2023 年 StartEngine 页面显示估值 $85.1M，Reg CF 目标为 $10K-$5M；National Law Review
              的新闻稿页面后来称 Rentberry 已融资超过 $40M；Tracxn 报告十轮融资合计 $118M，其中包括一轮 $90M 的 2024 Series A，投后估值为 $1B；SaasRise
              则描述了另一轮 2026 年 Republic 融资，金额为 $4.98M、投前估值 $200M，并计划在 2027 年追加
              $15M。综合来看，记录显示公司仍能获得融资，但不能证明资本充足：允许使用的来源没有披露当前现金、烧钱速度、现金跑道、债务义务、CAC、回本周期或毛利率，因此在评估下一轮融资或 IPO 路径前，仍需要管理层数据。
