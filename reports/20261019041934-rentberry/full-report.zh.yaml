chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与平台边界
        blocks:
          - type: paragraph
            body: >-
              审阅的公司材料和第三方材料都将 Rentberry 定位在旧金山，并把公司成立时间定为 2015 年，尽管公开页面上的街道地址细节并不一致。相比资本故事，产品定位更清楚：Rentberry
              描述的是一套连接租客与房东的长租工作流，覆盖搜索、申请、筛选、谈判、电子签名、支付和维修，而不是狭窄的房源列表市场。官方投资者营销已将身份叙事转向 AI 驱动、IPO 前的故事，包括宣称预留 Nasdaq
              股票代码，因此后续章节应将其视为一家正在运营的租赁平台，同时注意其信息越来越偏向资本市场。
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO003
              - CO007
              - CO008
