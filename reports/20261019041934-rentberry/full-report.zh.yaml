  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序框架
        blocks:
          - type: paragraph
            body: >-
              当前最重要的风险不是 Rentberry 是否有产品，而是投资者能否对其公开上市叙事背后的法律、融资和运营主张作出投资判断。与公司口径一致的 2026 年新闻稿描述了预留的 NASDAQ 股票代码、预计 2027
              年上市，以及一轮 $20 million 的 2026 年 IPO 前融资；独立的 SaaSRise 资料则增加了 $4.98 million 的 Reg CF 普通股融资、838 名投资者、$200
              million 投前估值，以及计划于 2027 年追加 $15 million。与此同时，审阅的公开材料无法对账股权结构表、董事会权利、清算优先权或统一的运营规模口径。因此，融资和披露风险高于 IPO
              前营销叙事的语气所暗示的水平。
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
