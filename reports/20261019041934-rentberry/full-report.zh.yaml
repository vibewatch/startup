      - number: '3.3'
        title: 持久性更多取决于分发与执行，而非硬锁定
        blocks:
          - type: paragraph
            body: >-
              指定材料池支持一个真实但仍属中等的护城河。              Rentberry 可以强调合作伙伴分发故事、早期活动中超过 60 个租赁行业合作伙伴的说法，以及一轮用于延长 AI 产品开发和市场拓展的
              2026 年众筹融资。但同一组证据也留下了实质性限制：公司自己的对比页面显示指标随时间明显漂移，关于页面仍显示团队有 30
              人，最直接的竞争对手对比还明确建议混用平台，而不是依赖单一目的地。因此，Rentberry 的差异化更多体现在工作流广度和融资能力，而不是独家库存、透明定价，或经过独立基准验证的信任与合规表现。
