      - number: '2.2'
        title: 受证据约束的市场规模视角与采用驱动因素
        blocks:
          - type: paragraph
            body: >-
              指定材料池支持若干方向性的市场视角，但不足以搭出一套干净的规模测算。Rentberry 的 StartEngine 活动引用了美国每年 $694B 的租金支出、2021 年美国 44 million
              套出租房源、全球超过 641 million 个租赁单元，以及约 2.3 billion 名居住在长租住房中的人口。       另外，2026 年公司发布的材料称当前运营覆盖超过 90 个国家、超过 20
              million 套挂牌房源，以及约 5 million
              月活用户。这些信号合在一起，指向一个非常大的底层租赁市场，也指向公司试图自动化定价、筛选、签名、支付和维修等高摩擦环节的战略。采用逻辑在房东或小型管理者希望用一套工作流替代纸张、碎片化沟通和手工租赁任务时最强；官方产品页面和新闻稿反复把价值主张与提速、无接触执行和更好的价格发现联系起来。
