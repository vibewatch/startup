              - CV016
      - number: '8.2'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              最新的公司发布称 Rentberry 正在启动一轮 $20 million 的 IPO 前融资；但这不能证明融资已完成，也不能证明 $20 million 已变成可用现金。另一篇文章描述了一笔资本注入，而
              SaaSRise 报告一轮 $4.98 million 的 Reg CF 已以 $200 million 投前估值收盘。历史参考进一步拉大而不是收窄了区间：StartEngine 为一项已结束的普通股发行展示
              $85.1 million 估值，Tracxn 则展示一个日期为 2024 年 12 月的 $1 billion 数字。EquityZen 公共页面只列出 $1.2 million 累计融资，而 IT Brand
              Pulse 的文章称融资超过 $40 million。这些数字的日期、工具和出处各不相同，都不能替代当前股权结构表或现金余额。
