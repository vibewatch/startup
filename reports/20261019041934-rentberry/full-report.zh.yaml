      - number: '8.3'
        title: 情景与可比框架
        blocks:
          - type: paragraph
            body: >-
              情景分析必须使用有条件的进入规则，而不是虚假的点估计。Tracxn 的同行集合确认 Rentberry
              处于已融资的租赁市场和物业管理软件公司之中，但该页面提供的是融资比较，不是标准化收入或交易倍数。乐观情景要求经审计的运营证据将已报告的规模转化为持久变现，并且估值不高于已报告的 2026 年 $200
              million 投前参考值。基准情景将观察到的 $85.1 million 至 $200 million
              融资参考视为一个宽泛且不可比的区间，并要求计入重大不确定性折价。悲观情景假设变现疲弱或融资失败；即使价格低于历史上的 $85.1 million 参考值，在没有偿付能力和单位经济证据的情况下，仍不具备可投资性。
