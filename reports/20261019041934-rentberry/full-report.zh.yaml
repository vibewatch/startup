  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图不止于点名门户
        blocks:
          - type: paragraph
            body: >-
              公开材料把 Rentberry 放在不止一种门户类型的竞争环境中。官方和众筹页面将产品描述为端到端长租工作流，覆盖申请、筛选、支付、电子签名、维修和 AI
              定价，同时把现状定义为分类信息、代理或经纪人以及手工文书，而不是某一家软件对手。在指定的竞争对手证据中，Pararius 是最强的本地荷兰库存型替代方案，Luntero
              则是最强的本地场景型搜索专家。这一点很重要，因为 Rentberry 的竞争集合同时覆盖直接门户和替代工作流：买方可以在本地门户上获得广度，在搜索专家处获得社区环境信息，再用 Rentberry
              获得跨境工作流便利。
