        title: 收入模型与变现基础
        blocks:
          - type: paragraph
            body: >-
              最清楚的公开证据是产品覆盖广度，而不是已经实现的商业表现。Rentberry 官方网站和 About 页面展示了一套端到端租赁工作流，覆盖创建房源、申请、筛选、签约、支付和维修，主页还加入 AI
              定价和沟通功能。最明确的变现表述来自 2023 年 StartEngine 活动：页面将业务标为免费增值模式，并列出企业客户、保险产品销售、搬家公司线索、Flexible Living 和 Happy
              Seniors 等额外收入来源。这说明租客和房东工作流上存在多个变现入口，但公开材料没有披露当前套餐结构、实际定价或各收入来源的占比。
