    approximationNotes: 这些层级混合了不同来源和年份的宽泛市场主张与公司覆盖范围主张，因此这是一种受证据约束的规模视角，而非分母一致的 TAM/SAM/SOM 桥接。
    claimRefs:
      - CM005
      - CM007
      - CM008
      - CM009
      - CM010
      - CM011
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 序数定位突出 Rentberry 的覆盖广度和流程深度，而本地专业公司在更窄的任务上占优。
    xAxis:
      label: 地理覆盖广度
      min: 1
      max: 5
      low: Local / fragmented
      high: Multi-country network
      description: Ordinal synthesis from assigned evidence; not a benchmarked market-share score.
      scale: ordinal
    yAxis:
      label: 工作流自动化深度
      min: 1
      max: 5
      low: Search-only / manual
      high: End-to-end automated flow
      description: Ordinal synthesis from assigned evidence; higher values mean more steps kept inside one product.
      scale: ordinal
    data:
      points:
        - label: 分类信息平台
          x: 2
          'y': 1
        - label: 经纪人 / 代理
          x: 1
          'y': 2
        - label: 房东自有工具栈
          x: 1
          'y': 3
        - label: Pararius
          x: 2
          'y': 2
        - label: Luntero
          x: 2
          'y': 3
        - label: Rentberry
          x: 5
          'y': 5
    approximationNotes: 坐标是基于指定证据池中的产品范围、地理覆盖和替代品描述综合得出的序数判断，不是客户调查分数或实测转化基准。
    claimRefs:
      - CP001
      - CP006
      - CP007
      - CP008
      - CP009
      - CP010
      - CP015
      - CP016
  - id: FI001
    title: 公开收入模型桥
    type: flow
    summary: 公开证据支持从工作流走向变现的路径，但无法证明每一步的实际转化、利润率或定价。
    data:
      nodes:
        - id: discovery
          label: 发现与房源库存
          detail: 官方网站和 2026 年新闻稿都描述了庞大的房源基础及房东发布工具。
        - id: application
          label: 申请与报价流程
          detail: 申请、自定义报价和租客工作流都是明确的产品入口。
        - id: screening
          label: 资格审核与定价
          detail: 租客筛选、AI 资格评估和动态定价被列为核心能力。
        - id: lease
          label: 租约签署与支付
          detail: 电子签名、在线付租和数字化租约处理让工作流留在平台内。
        - id: operations
          label: 持续的房产运营
          detail: 维护管理和面向房东的工具将使用延伸到入住之后。
        - id: monetization
          label: 变现入口
          detail: 已披露免费增值访问、企业客户、合作伙伴 / 线索销售和附加项目；实际定价未披露。
      edges:
        - from: discovery
          to: application
          label: 流量转化为申请活动
        - from: application
          to: screening
          label: 资格审核和定价嵌入工作流
        - from: screening
          to: lease
          label: 获批租客在线签约并付款
        - from: lease
          to: operations
          label: 签约后的服务保持房东和租客的参与度
        - from: operations
          to: monetization
          label: 多个入口都可变现，但公开费率未披露
    approximationNotes: 顺序反映官方材料描述的产品流程；不代表已披露转化率，也不代表各步骤经验证的毛利润贡献。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI005
  - id: FE001
    title: 自述产品架构图
    type: stack
    summary: 可见的技术栈是一个叠加 AI 与控制层的工作流平台，但公开证据仍以产品入口为主，而非工程文档。
    data:
      layers:
        - label: 用户入口市场
          detail: 租客和房东通过发现房源和推广房产进入平台。
          modules:
            - 智能房源搜索
            - 全球公寓库存
            - 发布房产
            - 向合作伙伴分享房源
          outputs:
            - 可搜索的租赁库存
            - 分发式房源发布
        - label: 申请与安排工作流
          detail: 申请、看房和报价环节在签约前完成数字化。
          modules:
            - 在线申请
            - 在线预约看房
            - 自定义报价 / 协商租金
            - 自动化沟通
          outputs:
            - 申请人录入
            - 已安排看房
        - label: 筛选与信任控制
          detail: 筛选和反欺诈控制自述位于申请人录入与租约签署之间。
          modules:
            - 信用评分和信用记录检查
            - 背景与犯罪记录检查
            - 欺诈 / 重复房源检测
            - 安全合同存储
          outputs:
            - 筛选报告
            - 更高信任度的市场平台自述
        - label: 签约与支付通道
          detail: 产品自述可在线完成核心租约和资金流转环节。
          modules:
            - Dropbox Sign 电子签名
            - 在线付租
            - 支付提醒
            - 支付历史记录
          outputs:
            - 已签署租约文件
            - 数字化收租
        - label: 租约后的运营
          detail: 平台通过服务和支持功能持续参与入住后的流程。
          modules:
            - 维护请求
            - 请求优先级设置
            - 自动化沟通
            - 文件处理
          outputs:
            - 持续问题录入
            - 面向租客和房东的支持入口
        - label: AI 编排层
          detail: 2026 年公司发布的材料描述了位于核心工作流之上的更高自主性层。
          modules:
            - 租客线索资格评估
            - 微观市场定价优化
            - 预测性市场分析
            - 端到端生命周期自动化
          outputs:
            - 自述的全自动房地产经纪人
            - 自述可减少碎片化人工工作
    approximationNotes: 这是根据官方页面和宣传稿综合出的公开入口运营图，不是已披露的源代码、API 或基础设施图。
    claimRefs:
      - CE005
      - CE006
      - CE008
      - CE009
      - CE016
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开材料展示了从发现房源到租约后服务的租客—房东一体化工作流；变现集中在附加服务和供给侧工具，而不是明确披露的订阅核心。
    data:
      items:
        - label: 发现房源
          title: Discover inventory
          description: 租客通过搜索和城市页面浏览本地及全球公寓供给。
          touchpoints:
            - 智能搜索
            - 城市与国家房源页面
        - label: 申请与协商
          title: Apply and negotiate
          description: 租客提交申请、披露家庭信息并发出自定义报价。
          touchpoints:
            - 在线申请
            - 自定义报价
        - label: 筛选与比较
          title: Screen and compare
          description: 房东结合筛选和背景信息审阅申请人。
          touchpoints:
            - 租客筛选
            - 申请人比较
        - label: 看房与决策
          title: Tour and decide
          description: 双方协调看房，并最终判断房产是否合适。
          touchpoints:
            - 安排看房
            - 看房协调
        - label: 签约与付款
          title: Sign and pay
          description: 协议进入电子签名和周期性收租环节。
          touchpoints:
            - 电子签署租约
            - 支付租金
        - label: 运营与扩展
          title: Operate and expand
          description: 持续循环加入维护请求、合作伙伴分发和保险类附加服务。
          touchpoints:
            - 维护请求
            - 房源分发
            - 租客保险
    approximationNotes: 这是根据产品入口推导出的工作流顺序图；不代表各阶段之间存在已知转化率、附加购买率或留存。
    claimRefs:
      - CU002
      - CU009
      - CU011
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最高的剩余风险集中在融资 / 披露不透明、运营范围广度和第三方工作流依赖上。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 缓解成熟度
        - label: 剩余风险
      rows:
        - label: 证券与治理披露
          note: IPO 路径和 2026 年融资活动可见，但权利和股权结构表细节不可见。
          values:
            - text: 高
              tone: high
            - text: 高
              tone: critical
            - text: 低
              tone: low
            - text: 高
              tone: critical
        - label: AI、安全与运营控制
          note: 公开来源描述了控制措施和自动化自述，但没有第三方鉴证或 KPI 证明。
          values:
            - text: 中
              tone: medium
            - text: 高
              tone: high
            - text: 部分
              tone: medium
            - text: 高
              tone: high
        - label: 工作流合作伙伴依赖
          note: 签约、支付、数据和分发都分别接触外部通道或合作伙伴渠道。
          values:
            - text: 中
              tone: medium
            - text: 高
              tone: high
            - text: 部分
              tone: medium
            - text: 高
              tone: high
        - label: 资本市场依赖
          note: 公开资本计划仍在推进，但散户普通股和后续融资细节仍不完整。
          values:
            - text: 高
              tone: high
            - text: 高
              tone: critical
            - text: 低
              tone: low
            - text: 高
              tone: critical
        - label: IP 可防御性
          note: 公开页面仍显示专利尚在申请，未列出已授权专利组合。
          values:
            - text: 中
              tone: medium
            - text: 中
              tone: medium
            - text: 低
              tone: low
            - text: 中
              tone: medium
        - label: 规模披露一致性
          note: 已审阅来源对于当前用户规模究竟是 5 million 月活用户还是 50 million 总用户存在分歧。
          values:
            - text: 中
              tone: medium
            - text: 中
              tone: medium
            - text: 低
              tone: low
            - text: 中
              tone: medium
    claimRefs:
      - CR003
      - CR004
      - CR007
      - CR010
      - CR014
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 证据链从已验证的产品广度，经过未经验证的规模和相互冲突的融资标记，最终导向继续研究的决定。
    data:
      nodes:
        - id: product
          label: 运营中的产品
          detail: 官方页面展示了广泛的数字化租赁工作流。
        - id: scale
          label: 已报道规模
          detail: 公司发布的材料宣称覆盖全球、拥有大量房源和月活用户。
        - id: financing
          label: 融资活动
          detail: 公司宣布了一轮 $20M 的 pre-IPO 融资，同时有报道称 $4.98M 的 Reg CF 已完成。
        - id: valuation
          label: 相互冲突的估值标记
          detail: $85.1M、$200M pre-money 和 $1B 参考值尚未相互勾稽。
        - id: financials
          label: 缺失的财务证明
          detail: 当前经审计收入、利润率、留存、现金和现金跑道均缺失。
        - id: risk
          label: 高投资判断风险
          detail: 股权结构表、优先权、摊薄和上市证据仍属非公开信息。
        - id: decision
          label: 继续研究
          detail: 在一手尽调补齐缺口前，没有可定价的进入机会。
      edges:
        - from: product
          to: scale
        - from: scale
          to: financing
        - from: financing
          to: valuation
        - from: valuation
          to: financials
        - from: financials
          to: risk
        - from: risk
          to: decision
    approximationNotes: 该流程表达分析上的依赖关系，不代表概率、规模或估值桥接。
    claimRefs:
      - CV001
      - CV003
      - CV008
      - CV010
      - CV011
      - CV014
      - CV016
