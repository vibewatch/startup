  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 工作流边界与证据最充分的买方切口
        blocks:
          - type: paragraph
            body: >-
              Rentberry
              官方产品页面始终把公司定义在长租住宅租赁旅程上，而不是住宅销售、酒店住宿或通用房地产运营系统。核心工作流覆盖租客和房东的搜索、申请、租客筛选、租约签署、收租和维修请求；投资者活动进一步把相关运营闭环定义为 12
              个月租约周期。独立产品分析收窄了最可信的买方切口：公开证据最清楚地支持独立房东、小型房源组合持有人和精品物业管理公司，而不是需要更深会计、工单和集成能力的大型企业运营商。因此，最稳妥的市场边界是面向小型住宅运营商的租赁工作流软件和市场工具；企业级物业管理平台与短租平台应视为相邻领域或替代方案，而不是已被证明服务的品类。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
