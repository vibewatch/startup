schemaVersion: "report-v2"
artifact: financials
slug: rentberry
runDate: 2026-10-19
company:
  name: Rentberry
chapter:
  number: 4
  title: Financials
  summary: >-
    Rentberry's public materials support a broad rental-workflow product and repeated access to
    external capital, but they do not provide the operating detail needed to underwrite revenue
    quality. The allowed evidence pool points to a freemium-style model, large top-of-funnel usage
    claims, and continued fundraising dependence, while leaving current cash, burn, gross margin,
    CAC, payback, and churn largely undisclosed.
sections:
  - id: monetization-foundation
    title: Revenue model and monetization foundation
    body: >-
      The clearest public evidence is product-surface breadth rather than realized commercial
      performance. Rentberry's official site and About page show an end-to-end rental workflow that
      spans listing creation, applications, screening, lease execution, payments, and maintenance,
      and the homepage adds AI-led pricing and communication features. The clearest explicit
      monetization statement comes from the 2023 StartEngine campaign, which labels the business a
      freemium model and names enterprise clients, insurance-product sales, moving-company leads,
      Flexible Living, and Happy Seniors as additional revenue sources. That suggests multiple
      monetization surfaces across both tenant and landlord workflows, but the public materials do
      not disclose current package structure, realized pricing, or revenue mix by stream.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-unit-economics
    title: Public traction versus unit-economics visibility
    body: >-
      Rentberry publishes or syndicates large scale claims, but the metric set is not presented as
      a reconciled financial bridge. Company-controlled 2026 releases repeat more than 90
      countries, more than 20 million properties, and more than 5 million monthly active users,
      while the older StartEngine campaign cites different baselines such as 1M+ monthly active
      users, 9M+ listings, 8M users, and 24M properties. IT Brand Pulse repeats the company's
      claim that dynamic pricing can reduce pricing errors by up to 30%, but that is not tied to a
      disclosed revenue, conversion, or gross-margin outcome. Tracxn contributes one hard
      commercial datapoint by listing annual revenue below $1M as of April 2024, which highlights
      how far public top-of-funnel activity metrics are from an underwriteable unit-economics view.
    claimRefs: [CI006, CI008, CI009, CI010, CI011]
  - id: capital-adequacy-and-underwriting
    title: Capital adequacy and underwriting blockers
    body: >-
      Public capital signals are easier to find than operating efficiency data, but they still need
      reconciliation. The 2023 StartEngine page showed an $85.1M valuation and $10K-$5M Reg CF
      target, National Law Review's press-release page later said Rentberry had raised over $40M,
      Tracxn reported $118M over 10 rounds and a $90M 2024 Series A at a $1B post-money
      valuation, and SaasRise described a separate $4.98M 2026 Republic round at a $200M
      pre-money valuation with a planned $15M follow-on in 2027. Taken together, the record shows
      continued financing access, but not capital adequacy: the allowed sources do not disclose
      current cash, burn, runway, debt obligations, CAC, payback, or gross margin, so management
      data is still required before underwriting the next round or IPO path.
    claimRefs: [CI007, CI012, CI013, CI014, CI015, CI016]
    tableRefs: [TI003]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current public value/status
      - Quality
      - Diligence ask
    rows:
      - [Core rental workflow, "Listings, applications, screening, e-sign, payments, maintenance", "Per listing / lease workflow", "Product publicly live; monetization mechanics not quantified", "High on feature existence, low on revenue conversion", "Provide paying-landlord and paying-tenant counts plus conversion from listing to paid workflow"]
      - [AI pricing and qualification tools, "Dynamic pricing, tenant qualification, automated communication", "Per listing / pricing action", "Capabilities public; no standalone monetization disclosed", "Capability evidence is clearer than revenue evidence", "Disclose whether AI features are bundled, upsold, or drive higher take rates"]
      - [Membership and application services, "Tenant applications, landlord/tenant membership, data storage", "Membership / application", "Investor perks imply these services can be monetized; current carded pricing not public", "Indirect signal from campaign-era material", "Share current plan tiers, application fees, and attach rates"]
      - [Enterprise and partner revenue, "Enterprise clients, insurance products, moving-company leads", "Contract / referral lead", "Named in StartEngine materials only", "Medium but dated", "Bridge current partner count, economics, and gross margin by stream"]
      - [Ancillary programs, "Flexible Living, Happy Seniors, owned-rental discounts", "Program-specific", "Initiatives disclosed; 2026 revenue contribution unavailable", "Low because contribution and current status are not disclosed", "Clarify whether these remain active and quantify revenue and capital needs by program"]
    notes: >-
      Combines official site workflow evidence with the 2023 StartEngine campaign; null public
      pricing or mix means the source pool does not disclose a current value, not that the stream
      is immaterial.
    enumerationScope:
      coverage: partial
      basis: "Publicly disclosed monetization surfaces from the allowed official and campaign sources only."
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - [Core platform access, "Freemium model; no public carded price", "List pricing not disclosed; realized pricing unknown", "No public plan tiers, minimum contract, or take rate", "StartEngine 2023"]
      - [Tenant applications and membership, "Standalone price not disclosed", "Only investor-perk evidence is public", "Perk grants free-for-life tenant applications and landlord/tenant membership rather than market pricing", "StartEngine 2023"]
      - [Property promotion and data storage, "Standalone price not disclosed", "Only investor-perk evidence is public", "Unlimited property promotion and data storage appear as $10K investor perks, not customer price cards", "StartEngine 2023"]
      - [Rentberry-managed rental discounts, "5%-30% investor discount on owned/exclusively managed rentals", "Promotional perk rather than ordinary realized pricing", "Applies only to qualifying investors and undisclosed owned/exclusively managed inventory", "StartEngine 2023"]
    notes: >-
      Public product pricing is largely absent from the assigned pool, so this table records only
      explicit monetization signals that are actually disclosed and labels campaign perks separately
      from ordinary customer pricing.
    enumerationScope:
      coverage: partial
      basis: "Restricted to explicit public pricing or perk disclosures in the allowed source pool."
    claimRefs: [CI003, CI004, CI016]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Annual revenue, "<$1M as of 2024-04-29", Medium, "Only public revenue datapoint in the pool; frames the gap between operating disclosure and valuation claims", "Provide 2024-2026 audited revenue by stream and geography"]
      - [User / activity scale, "1M+ MAU and 9M+ listings in 2023; 5M MAU and 20M+ properties in 2026 releases; 8M users and 24M properties also cited for 2021", Low, "Top-of-funnel scale is not comparable without a metric glossary or paying-activity bridge", "Reconcile users, properties, processed properties, paying landlords, and paying tenants in one glossary"]
      - [Funding to date, "$118M over 10 rounds in Tracxn; >$40M in 2026 press-release coverage", Medium, "Capital-stack inconsistency affects dilution analysis and financing dependence", "Provide round-by-round capitalization table from 2015 through the 2026 retail round"]
      - [2026 retail financing, "$4.98M Reg CF from 838 investors at $200M pre-money; planned $15M 2027 follow-on", Medium, "Shows continued access to capital but also continued financing dependence ahead of IPO", "Share use of proceeds, milestone triggers, and target runway from the 2026-2027 capital plan"]
      - [Gross margin / contribution margin, null, Low, "No public margin path means revenue quality and operating leverage cannot be tested", "Disclose gross margin by revenue stream and contribution margin by cohort"]
      - [CAC / payback / churn, null, Low, "Without CAC, payback, and churn, sales efficiency and durability are not underwriteable", "Provide acquisition channel mix, CAC, payback, churn, and retention by landlord and tenant cohort"]
      - [Cash / burn / runway / debt, null, Low, "Capital adequacy depends on liquidity and obligations, not just valuation headlines", "Provide current cash balance, monthly burn, debt facilities, covenants, and runway base case"]
    notes: >-
      Null rows represent genuine public disclosure gaps in the allowed evidence pool rather than
      zero values; older figures are kept with their source dates because the company has not
      published a current reconciled metric bridge.
    enumerationScope:
      coverage: partial
      basis: "Financial metrics that the allowed public sources disclose directly or make explicitly absent."
    claimRefs: [CI006, CI010, CI011, CI012, CI013, CI014, CI015, CI016]
figures:
  - id: FI001
    title: Public revenue model bridge
    type: flow
    summary: "Public evidence supports the workflow-to-monetization path, but not the realized conversion, margin, or pricing at each step."
    data:
      nodes:
        - id: discovery
          label: "Discovery & listing inventory"
          detail: "Official site plus 2026 releases describe a large listing base and landlord listing tools."
        - id: application
          label: "Application & offer flow"
          detail: "Applications, custom offers, and tenant workflows are explicit product surfaces."
        - id: screening
          label: "Qualification & pricing"
          detail: "Tenant screening, AI qualification, and dynamic pricing are presented as core capabilities."
        - id: lease
          label: "Lease execution & payments"
          detail: "e-sign, online rent payments, and digital lease handling keep the workflow on-platform."
        - id: operations
          label: "Ongoing property operations"
          detail: "Maintenance management and landlord-side tools extend usage beyond move-in."
        - id: monetization
          label: "Monetization surfaces"
          detail: "Freemium access, enterprise clients, partner/lead sales, and ancillary programs are disclosed; realized pricing is not."
      edges:
        - from: discovery
          to: application
          label: "Traffic converts into application activity"
        - from: application
          to: screening
          label: "Qualification and pricing sit inside the workflow"
        - from: screening
          to: lease
          label: "Approved tenants execute and pay online"
        - from: lease
          to: operations
          label: "Post-signing services keep landlords and tenants engaged"
        - from: operations
          to: monetization
          label: "Multiple surfaces can be monetized, but public rates are not disclosed"
    approximationNotes: >-
      Sequence reflects product flow described in official materials; it does not imply disclosed
      conversion rates or validated gross-profit contribution by step.
    claimRefs: [CI001, CI002, CI003, CI005]
callouts:
  - calloutType: risk
    title: Unit economics are still opaque
    body: >-
      Public evidence shows funding access and product breadth, but not current gross margin, CAC,
      payback, churn, or runway.
    claimRefs: [CI011, CI015]
  - calloutType: insight
    title: Capital headlines are better documented than liquidity
    body: >-
      Valuation and fundraising datapoints are public, but those disclosures still do not answer
      whether current cash and burn are adequate for the 2027 plan.
    claimRefs: [CI012, CI013, CI014, CI015, CI016]
