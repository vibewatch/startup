evidenceGaps:
  - type: missing-source
    severity: material
    topic: cap-table
    missingEvidence: A reconciled capitalization table from the 2024 unicorn round through the 2026 Republic common-stock offering.
    whyItMatters: Without a share-class and proceeds bridge, valuation changes and dilution economics cannot be underwritten.
    diligencePath: >-
      Obtain the 2024 financing documents, subsequent crowd-round summaries, and a current cap table from management or
      primary offering filings.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: metric-glossary
    missingEvidence: >-
      A management-approved glossary reconciling monthly users, active users, properties, listings processed, and
      headcount.
    whyItMatters: Conflicting scale claims undermine confidence in topline traction and operating leverage assumptions.
    diligencePath: >-
      Ask management to bridge each public metric to a date, denominator, and source system, then match it against filed
      or audited disclosures.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A public or diligence-room board roster, voting-rights summary, and minority-holder rights schedule.
    whyItMatters: >-
      Investor control, oversight quality, and liquidation outcomes cannot be judged from the assigned public pool
      alone.
    diligencePath: >-
      Request board materials, charter summaries, and current shareholder-rights documentation from counsel or investor
      relations.
    relatedQuestionRefs:
      - QO006
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: ipo-readiness
    missingEvidence: Direct SEC or exchange-linked documentation supporting the timing and mechanics of a Nasdaq listing path.
    whyItMatters: The pre-IPO narrative affects valuation expectations, liquidity timing, and retail-holder underwriting.
    diligencePath: >-
      Verify whether a filing package, confidential submission, or formal exchange correspondence exists beyond
      syndicated marketing releases.
    relatedQuestionRefs:
      - QO005
      - QO008
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A denominator-consistent market model that bridges a defined residential-leasing workflow into TAM, SAM, and SOM
      by geography, customer segment, and monetization basis.
    whyItMatters: >-
      Without a reconciled sizing model, the market narrative stays directional and cannot anchor valuation or
      go-to-market efficiency with confidence.
    diligencePath: >-
      Obtain a current management market model or third-party sector study that ties renter, landlord, property, and
      revenue assumptions to the same date and geography.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: conflicting-metrics
    missingEvidence: >-
      A reconciled metric glossary covering users, properties, listings, monthly actives, countries served, and
      cumulative capital raised.
    whyItMatters: Conflicting scale and funding baselines distort market-penetration, growth, and valuation interpretations.
    diligencePath: >-
      Request the latest investor deck or KPI glossary that bridges the 2022 StartEngine campaign, 2026 press materials,
      and any 2024-2026 financing events.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Current pricing, packaging, take-rate, and budget-owner evidence by landlord, property-manager, and tenant
      segment.
    whyItMatters: >-
      Adoption cannot be underwritten cleanly when the public record does not show whether the product clears budget
      thresholds for the buyers it appears to target.
    diligencePath: >-
      Request current pricing sheets, customer contracts, and segment-level monetization data from management or
      customers.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: likely-entrants
    missingEvidence: >-
      Independent current sources showing which incumbent portals or lease-management vendors match Rentberry's AI
      automation depth.
    whyItMatters: >-
      The chapter can name substitute classes, but it cannot cleanly rank likely entrants or displacement risk without
      vendor-by-vendor evidence.
    diligencePath: >-
      Collect current product pages or independent reviews for named incumbent portals and lease-management suites, then
      compare workflow depth and automation claims directly.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: >-
      Realized take rates, tenant fees by geography, and landlord conversion metrics for Rentberry versus local
      specialists.
    whyItMatters: >-
      Public messaging shows list-style packaging, but underwriting competitive strength needs realized economics and
      conversion, not only free-browse or premium-tier descriptions.
    diligencePath: Request management KPI definitions, cohort-level conversion funnels, and regional pricing schedules.
    relatedQuestionRefs:
      - QP004
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: trust-benchmarks
    missingEvidence: >-
      Independent security, compliance, fraud-prevention, or service-quality benchmarks versus rental portals and
      landlord software.
    whyItMatters: >-
      Trust and regulatory posture are part of buyer choice, but the assigned pool provides mostly company-controlled
      statements rather than third-party validation.
    diligencePath: >-
      Gather security/compliance pages, incident histories, or customer-review evidence for Rentberry and local rivals,
      then compare like-for-like controls.
    relatedQuestionRefs:
      - QP006
  - type: missing-source
    severity: blocking
    topic: liquidity
    missingEvidence: Current cash balance, monthly burn, debt facilities, covenant package, and runway assumptions.
    whyItMatters: Capital adequacy cannot be underwritten from valuation headlines or fundraising totals alone.
    diligencePath: Request CFO cash bridge, debt schedule, and 12-18 month base/upside/downside runway model.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing-signals
    missingEvidence: Current pricing card, plan tiers, take rates, contract minima, and revenue mix by product line.
    whyItMatters: The public record suggests multiple monetization surfaces, but not which ones drive revenue quality.
    diligencePath: Request current pricing sheets, landlord and tenant cohort revenue mix, and realized pricing versus list.
    relatedQuestionRefs:
      - QI001
      - QI007
    relatedTableRefs:
      - TI001
      - TI002
  - type: conflicting-data
    severity: material
    topic: metric-glossary
    missingEvidence: A reconciled glossary linking users, properties, listings, processed properties, and paying activity.
    whyItMatters: Different activity baselines across public materials make conversion and sales-efficiency inference unreliable.
    diligencePath: Obtain a metric glossary and monthly KPI bridge tying product activity to revenue-bearing cohorts.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: capital-stack
    missingEvidence: A round-by-round capitalization and funding bridge from 2015 through the 2026 Republic round.
    whyItMatters: The public record contains materially different funding and valuation figures that affect dilution analysis.
    diligencePath: Request cap table, security terms, and round chronology covering VC, Reg A, Reg CF, and pre-IPO issuances.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: technical-documentation
    missingEvidence: Public API references, architecture documents, or engineering documentation for the AI and transaction stack.
    whyItMatters: >-
