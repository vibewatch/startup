callouts:
  - calloutType: "strength"
    title: "Workflow breadth is the clearest supported differentiator"
    body: >-
      Across official and crowdfunding surfaces, Rentberry consistently presents one of the broadest
      public rental-workflow bundles in the assigned pool, spanning search through maintenance.
    claimRefs: ["CP001", "CP002", "CP011"]
  - calloutType: "risk"
    title: "Multi-homing risk remains high"
    body: >-
      The strongest independent comparison in the pool recommends mixing Pararius, Luntero, and
      Rentberry rather than treating any one platform as sufficient, which weakens the case for
      hard user lock-in.
    claimRefs: ["CP009", "CP016"]
