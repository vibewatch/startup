      - ["Pararius", "Luntero says browsing and applying are free but Pararius+ adds a low-cost trial and monthly subscription", "Local inventory access, alerts, one-click applications, and visibility into competing applicants", "Exact current subscription price is not quoted in the assigned text", "Pararius is more explicit about paying for speed in a competitive market"]
      - ["Luntero", "Assigned source says browsing is discovery-led and any paid features, if present, are aimed at faster matching rather than gatekeeping basics", "Advanced filters, commute analysis, POIs, and multilingual search context", "Public listing counts and any current premium tier terms are not reproduced here", "Value proposition is decision support rather than owning the whole lease flow"]
      - ["Brokers / agents", "Fee structure is not disclosed in assigned evidence", "Human sourcing, viewings, and negotiation support", "Manual intermediation may add cost and time", "This substitute competes on service rather than software breadth"]
      - ["Internal build", "Software and operational cost are absorbed internally, not disclosed in assigned evidence", "Landlords can assemble their own point tools and processes", "Integration burden and maintenance sit with the operator", "Custom control comes with fragmentation risk"]
    notes: "Pricing rows preserve unknowns when the pool does not provide current tenant or landlord fee schedules."
    claimRefs: ["CP001", "CP008", "CP009", "CP010", "CP011"]
