company:
  name: "Rentberry"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Assigned evidence supports a broad substitute set around Rentberry: Dutch rental portals,
    local-search specialists, classifieds and brokers, and landlords' own fragmented workflows.
    Rentberry's best-supported edge is cross-border workflow depth and automation, but local
    inventory predictability, explicit pricing transparency, and independently benchmarked trust
    outcomes remain weaker than the marketing narrative suggests.
sections:
  - id: "landscape"
    title: "Landscape breadth extends beyond named portals"
    body: >-
      Public materials position Rentberry against more than one portal class. Official and
      crowdfunding surfaces describe the product as an end-to-end long-term rental workflow with
      applications, screening, payments, e-signing, maintenance, and AI-driven pricing, while
      also framing the status quo as classifieds, agents or brokers, and manual paperwork rather
      than a single software rival. In the assigned competitor-specific evidence, Pararius appears
      as the strongest local Dutch inventory-led alternative, and Luntero appears as the strongest
      context-led local-search specialist. That matters because Rentberry's competitive set spans
      both direct portals and substitute workflows: buyers can multi-home across a local portal
      for breadth, a search specialist for neighborhood context, and Rentberry for cross-border
      workflow convenience.
    claimRefs: ["CP001", "CP002", "CP006", "CP008", "CP015"]
    tableRefs: ["TP001"]
    figureRefs: ["FP001"]
  - id: "comparison"
    title: "Capability and packaging favor different buyer jobs"
    body: >-
      Rentberry's most defensible product story is workflow depth. Official pages repeatedly
      combine search, applications, screening, payments, e-signing, partner syndication, and
      maintenance in one account, and 2026 marketing doubles down on AI-driven leasing automation
      and dynamic pricing. The local specialist comparison cuts the other way on inventory and
      discovery: Luntero describes Pararius as a large agency-fed Dutch aggregator with a paid
      acceleration tier, while it frames Rentberry's Netherlands supply as less predictable and
      Luntero's own advantage as commute-aware search tools. The result is a segmented market
      structure rather than a clean winner-take-most contest, with explicit public pricing still
      clearer for Pararius than for Rentberry's landlord-fee model.
    claimRefs: ["CP001", "CP002", "CP006", "CP007", "CP008", "CP009", "CP010", "CP011"]
    tableRefs: ["TP002", "TP003"]
  - id: "durability"
    title: "Durability depends on distribution and execution more than hard lock-in"
    body: >-
      The assigned pool supports a real but still moderate moat. Rentberry can point to a partner
      distribution story, older campaign claims of more than 60 rental-sector partnerships, and a
      2026 crowdfunding round meant to extend AI product development and go-to-market. But the same
      evidence set leaves material limits. The company's own comparison surfaces show major metric
      drift over time, the about page still presents a 30-person team, and the most direct
      competitor-issued comparison explicitly recommends mixing platforms rather than relying on one
      destination. That makes Rentberry look more differentiated on workflow breadth and capital
      access than on exclusive inventory, transparent pricing, or independently benchmarked trust
      and compliance performance.
    claimRefs: ["CP003", "CP004", "CP005", "CP011", "CP012", "CP013", "CP014", "CP016"]
