schemaVersion: report-v2
artifact: customers
slug: rentberry
runDate: 2026-10-19
company:
  name: Rentberry
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports Rentberry as a real two-sided rental workflow product with tenant and
    landlord activity, a visible small-landlord use case, and a workflow that extends from search
    through payments and maintenance. The customer case is still weaker than the product case,
    because the freshest scale claims use shifting denominators, named proof is mostly
    company-curated testimonials, and the assigned pool does not disclose retention, concentration,
    or monetized customer counts.
sections:
  - id: customer-segments
    title: Customer segments and value exchange
    body: >-
      Rentberry's own surfaces consistently frame the product as a two-sided long-term rental
      workflow: tenants search, apply, schedule tours, sign leases, pay rent, and request
      maintenance, while landlords list inventory, screen applicants, coordinate tours, collect
      rent, and syndicate listings to partner sites. Independent commentary narrows the best-fit
      buyer profile: ITQlick positions Rentberry as a better fit for independent landlords, small
      portfolio owners, and boutique property-management firms than for enterprise operators that
      need deeper accounting and integrations. That makes the customer story more specific than
      generic "all landlords" marketplace messaging, but it also suggests the likely paying cohort
      may be smaller and more fragmented than the platform's global inventory claims imply.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU011
      - CU012
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-signals
    title: Adoption signals are real, but the metric glossary is not
    body: >-
      The assigned pool contains several adoption signals, but they do not line up cleanly enough
      to support a single customer-growth curve. StartEngine's archived offering materials cite 1M+
      monthly active users, 9M+ listings, and more than 60 partnerships, and elsewhere on the same
      page cite 8M users, 24M properties, and 137K locations in 2021. Company-issued 2026 media
      materials shift again to more than 90 countries, 20M properties, and roughly 5M monthly
      active users. Those numbers are directionally supportive of real scale, but they rotate
      across users, monthly actives, listings, properties, processed properties, and locations
      without a reconciled glossary, so public evidence supports reach more than it supports
      comparable growth or monetized-customer trend lines.
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU007
      - CU013
    tableRefs:
      - TU002
  - id: named-customer-proof
    title: Named proof exists, but it is still curated and shallow
    body: >-
      Rentberry's homepage goes beyond logo walls by publishing short named testimonial snippets
      from two landlords and two tenants. That is better than unsupported brand imagery, because
      the quotes at least tie the product to actual use cases such as tenant acquisition, lease
      signing, apartment search, and self-management. But the proof remains shallow: the quotes are
      undated, company-hosted, and uncorroborated by independent case studies, procurement records,
      or disclosed deployment sizes. The result is enough evidence to show real workflow usage is
      plausible, but not enough to underwrite deployment depth, stickiness, or revenue importance
      by cohort.
    claimRefs:
      - CU008
      - CU009
      - CU010
    tableRefs:
      - TU003
  - id: durability-and-expansion
    title: Expansion levers are visible; durability and concentration are not
    body: >-
      Public materials imply multiple expansion paths around the core rental workflow. The FAQ says
      core use is free for landlords and tenants while paid add-ons include tenant screening and
      renters insurance, and StartEngine adds enterprise clients, moving-company leads, Flexible
      Living, and Happy Seniors as revenue ambitions. The problem is that none of the retained
      sources disclose retention, churn, renewal terms, ARPU, contract length, top-customer
      concentration, or how many landlords and property managers actually convert from free usage to
      paying relationships. ITQlick's complaints about opaque pricing and limited enterprise depth
      therefore matter: public evidence supports real adoption and expansion intent, but not durable
      monetized customer economics.
    claimRefs:
      - CU003
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Tenants
        - User, and sometimes economic payer through rent and add-on flows
        - Search homes, apply online, negotiate terms, e-sign, pay rent, request maintenance
        - Official site shows global inventory and tenant workflow; homepage includes two tenant testimonial snippets
        - Demand-side traffic supports marketplace liquidity and add-ons such as renters insurance
        - No disclosed tenant count by paying status, geography, or repeat usage
      - - Individual landlords
        - Supply-side user and likely buyer for screening, payments, and promotion tools
        - List units, screen applicants, coordinate tours, sign leases, and collect rent
        - Homepage and FAQ emphasize free listing plus workflow automation; two landlord testimonial snippets are published
        - Core supply acquisition channel and likely attach point for screening or payment monetization
        - No disclosed landlord count, ARPU, or retention by cohort
      - - Small portfolio owners / boutique property managers
        - Buyer, payer, and operational user
        - Digitize leasing, rent collection, and tenant communication for modest residential portfolios
        - ITQlick says this is the best-fit segment and cites landlords with roughly 10-100 units
        - Most credible public path to repeat software spend beyond one-off listing usage
        - No public conversion or cohort economics
      - - Enterprise clients / channel partners
        - Potential payer or distribution partner
        - Enterprise workflow sales, listing syndication, and ancillary service distribution
        - StartEngine cites 60+ partnerships and enterprise-clients revenue ambitions; homepage cites partner syndication
        - Expansion lever for broader supply reach and non-core revenue
        - No named enterprise customers, contract values, or partner concentration data
    notes: >-
      Mixes official positioning with one independent software review; cells describe visible roles
      and monetization hypotheses, not disclosed cohort economics.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU009
      - CU011
      - CU012
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date / vintage
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Monthly active users
        - 1M+
        - StartEngine offering page
        - StartEngine
        - medium
        - Shows older active-use scale claim before the 2026 AI narrative
        - Not reconciled to registered users or paying accounts
      - - Users
        - 8M
        - 2021
        - StartEngine
        - medium
        - Indicates broad historical reach claim
        - Unclear whether this means cumulative accounts, active users, or another basis
      - - Properties
        - 24M
        - 2021
        - StartEngine
        - medium
        - Suggests large historical inventory footprint
        - Not bridged to listings, processed properties, or unique paying landlords
      - - Listings
        - 9M+
        - StartEngine offering page
        - StartEngine
        - medium
        - Shows another pre-2026 supply metric
        - Listings are not reconciled to properties or occupied units
      - - Monthly active users
        - 5M
        - 2026 company-issued media
        - Journal of Real Estate Professionals and IT Brand Pulse
        - medium
        - Freshest direct active-use claim in the pool
        - No buyer mix, landlord split, or paid-conversion disclosure
      - - Properties / geographic reach
        - 20M properties across 90+ countries
        - 2026 company-issued media
        - Journal of Real Estate Professionals and IT Brand Pulse
        - medium
        - Supports continued international marketplace scale
        - Inventory does not prove active supply, occupancy, or monetization
      - - Retail investors
        - 838 individuals
        - Aug 2026
        - SaasRise
        - medium
        - Demonstrates brand reach with investors and financing appetite
        - Investors are not end customers and do not evidence retention
    notes: >-
      Mixed metric bases (users, monthly actives, listings, properties, countries, investors) are
      intentionally separated rather than shown as one funnel because the sources do not establish a
      common denominator or time basis.
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU007
      - CU013
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / named proof
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - J. Carpenter
        - Landlord
        - Used Rentberry to find tenants and manage lease signing digitally
        - Appears live production use, but date and portfolio size are undisclosed
        - Says Rentberry "saved me a ton of time" finding tenants and managing lease signing
        - Company-hosted testimonial with no external corroboration
      - - R. Nair
        - Tenant
        - Used the platform during apartment search and application support
        - Appears live production use, but no lease count or geography is disclosed
        - Says 24/7 support helped secure an apartment
        - Company-hosted testimonial with no deployment depth disclosed
      - - S. Baker
        - Tenant
        - Used negotiation, contract-signing, and rent-payment workflow
        - Appears live production use, but no rent or contract value is disclosed
        - Says negotiation, paper contracts, and sending checks became easier
        - Company-hosted testimonial with no date or independent case study
      - - M. Koran
        - Landlord
        - Used Rentberry for tenant selection and self-management workflow
        - Appears live production use, but unit count is undisclosed
        - Says the product improved confidence in finding quality tenants and managing properties
        - Company-hosted testimonial with no portfolio or retention data
    notes: >-
      Public named proof is partial and company-curated; the quotes are useful because they map to
      landlord and tenant workflows, but they are undated and not independently corroborated.
    enumerationScope:
      coverage: partial
      basis: >-
        Enumerates only the named testimonial snippets visible on the retained homepage evidence, not
        the full customer base or all referenceable deployments.
    claimRefs:
      - CU003
      - CU008
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public materials show a joined tenant-landlord workflow from discovery through post-lease
      service, with monetization concentrated around add-ons and supply-side tools rather than a
      clearly disclosed subscription core.
    data:
      items:
        - label: Discover inventory
          title: Discover inventory
          description: Tenants browse local and global apartment supply through search and city pages.
          touchpoints:
            - Smart search
            - City and country inventory pages
        - label: Apply and negotiate
          title: Apply and negotiate
          description: Tenants submit applications, disclose household details, and make custom offers.
          touchpoints:
            - Apply online
            - Custom offers
        - label: Screen and compare
          title: Screen and compare
          description: Landlords review applicants with screening and background information.
          touchpoints:
            - Tenant screening
            - Applicant comparison
        - label: Tour and decide
          title: Tour and decide
          description: Both sides coordinate showings and finalize whether a property is a fit.
          touchpoints:
            - Schedule tours
            - Tour coordination
        - label: Sign and pay
          title: Sign and pay
          description: Agreements move to e-signature and recurring rent collection.
          touchpoints:
            - eSign lease
            - Pay rent
        - label: Operate and expand
          title: Operate and expand
          description: The ongoing loop adds maintenance requests, partner syndication, and insurance-style extras.
          touchpoints:
            - Maintenance requests
            - Listing syndication
            - Renters insurance
    approximationNotes: >-
      This is a workflow-order diagram derived from product surfaces; it does not imply conversion
      rates, attach rates, or retention between stages.
    claimRefs:
      - CU002
      - CU009
      - CU011
callouts:
  - calloutType: insight
    title: Best-fit buyer looks narrower than the top-line marketplace story
    body: >-
      The public product story is broad, but the strongest independent fit signal points to small
      landlords and boutique property managers rather than enterprise operators. That narrows the
      likely paying cohort even while overall marketplace reach appears large.
    claimRefs:
      - CU001
      - CU002
      - CU003
  - calloutType: risk
    title: Durability still cannot be underwritten from the assigned pool
    body: >-
      None of the retained sources disclose churn, NRR, GRR, renewal rate, contract length,
      top-customer concentration, or customer mix by paying status. The chapter can support real
      usage and product breadth, but not durable monetized-customer economics.
    claimRefs:
      - CU007
      - CU010
      - CU011
      - CU013
