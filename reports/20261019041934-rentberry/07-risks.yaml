callouts:
  - calloutType: risk
    title: Kill criteria before underwriting common equity
    body: >-
      Do not underwrite a late-stage common entry or IPO-adjacent pricing case without a
      reconciled cap table, rights package, liquidation waterfall, and an independent
      security/compliance evidence pack; those are the fastest ways to falsify the current
      pre-IPO narrative.
    claimRefs: [CR004, CR007, CR014]
  - calloutType: insight
    title: Monitorable triggers
    body: >-
      A slipped 2027 follow-on or listing timetable, continued inconsistency between
      monthly-active-user and total-user disclosures, or a disruption in payment or
      signature rails should be treated as measurable signs that residual risk is rising
      rather than shrinking.
    claimRefs: [CR002, CR004, CR005, CR012, CR013]
