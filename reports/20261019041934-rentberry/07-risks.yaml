chapter:
  number: 7
  title: Risks
  summary: >-
    Rentberry's heaviest underwritten risks are disclosure and financing opacity around its
    pre-IPO narrative, operational breadth relative to publicly disclosed staffing, and
    dependence on external rails for payments, signatures, listings, and retail capital.
    The product surface looks real, but the reviewed 2026 sources still leave material
    gaps on cap-table rights, independent security assurance, and a reconciled operating-scale glossary.
sections:
  - id: risk-frame
    title: Ranked risk frame
    body: >-
      The most important current risk is not whether Rentberry has a product, but whether
      investors can underwrite the legal, financing, and operational claims that now sit
      underneath its public-listing narrative. Company-aligned 2026 releases describe a
      reserved NASDAQ ticker, a projected 2027 public listing, and a 2026 $20 million
      pre-IPO round, while the independent SaaSRise profile adds a $4.98 million Reg CF
      common-stock round, 838 investors, a $200 million pre-money valuation, and a planned
      $15 million follow-on in 2027. At the same time, the reviewed public materials do
      not reconcile the cap table, board rights, liquidation preferences, or a consistent
      operating-scale glossary. That leaves financing and disclosure risk above the level
      implied by the marketing tone of the pre-IPO narrative.
    claimRefs: [CR002, CR003, CR004, CR014]
    figureRefs: [FR001]
  - id: regulatory-legal-and-disclosure
    title: Regulatory, legal, and disclosure risk
    body: >-
      The legal-disclosure package still looks thin relative to the ambition of the
      financing story. Publicly reviewed sources support that Rentberry is marketing a
      public-listing path and additional private capital, but they do not provide the
      underwriting basics a late-stage common-stock buyer would normally want before
      trusting valuation language or IPO timing: a reconciled cap table, rights map,
      liquidation waterfall, or a clean explanation of how prior Reg A, Reg CF, and
      venture rounds stack together. Jurisdictional complexity also matters because company
      materials describe operations across more than 90 countries and product features such
      as pricing optimization, tenant screening, payments, and digital signatures, all of
      which can trigger different consumer, privacy, and housing-law obligations by market.
      Finally, the official pages still present "Patents Pending" rather than issued patent
      assets, so IP defensibility should be treated as a diligence item rather than a
      resolved moat.
    claimRefs: [CR001, CR002, CR003, CR008, CR014]
    tableRefs: [TR001]
  - id: operational-and-security
    title: Operational, security, and execution risk
    body: >-
      Rentberry's product promise is unusually broad: AI-driven search and pricing,
      automated lead handling, tenant screening, digital signatures, rent payments, and
      maintenance workflows inside one system. That breadth can be a strength, but it also
      raises failure-mode surface area. The reviewed sources show only public-control
      descriptions such as SSL, payment-history tooling, and AI-based duplicate-listing
      detection; they do not surface third-party security attestations, incident history,
      or quantified performance metrics for the automation claims. The staffing signal is
      also modest versus the claimed footprint: the about page says the company has 30
      dedicated people, while company-aligned and independent sources describe 90+ country
      reach, 20 million properties, and multi-step workflow automation. Until diligence
      closes that gap with operational metrics and assurance packs, residual execution risk
      remains high.
    claimRefs: [CR005, CR006, CR007, CR009, CR010, CR011]
    tableRefs: [TR002]
  - id: dependency-and-capital
    title: Partner, channel, and capital dependence
    body: >-
      Rentberry depends on several external rails that sit on critical workflow paths. The
      official product pages explicitly name Dropbox Sign for legally binding documents and
      Apple Pay, Google Pay, and card rails for rental payments, while the marketplace
      pages also market listing syndication to partner websites and tenant screening
      against state and federal databases. Those integrations can speed onboarding, but
      they also create dependency, compliance, and outage-transfer risk if policies,
      economics, or service availability change. Capital dependence is similarly visible in
      public sources: company-aligned releases market a 2026 pre-IPO round, and SaaSRise
      reports a near-cap retail crowdfunding raise plus a planned 2027 follow-on round.
      If the next financing, listing timetable, or investor-rights package slips, the
      residual risk to common-equity holders rises quickly because the current public
      record still leans more on narrative than on reconciled financing detail.
    claimRefs: [CR003, CR004, CR005, CR006, CR014]
    tableRefs: [TR003]
