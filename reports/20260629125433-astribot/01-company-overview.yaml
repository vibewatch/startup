company:
  name: Astribot
chapter:
  number: 1
  title: Company Overview
  summary: Astribot (星尘智能, Stardust Intelligence) is a Shenzhen humanoid-robotics company founded December 2022 by Lai Jie, formerly of Tencent Robotics X and Baidu Xiaodu. It reached unicorn status in June 2026 after a Series B exceeding 1 billion RMB and now ships its 89,900 RMB cable-driven T1 robot.
sections:
- id: s1
  title: Identity and business model
  body: 'Astribot (星尘智能, Stardust Intelligence) is a Shenzhen-headquartered humanoid-robotics company founded in December 2022. It positions itself as a full-stack embodied-AI developer, building the AI models, an embodied operating system, and a cable-driven robotic body in-house rather than integrating third-party hardware. The company’s stated ambition, captured in its “Ad astra per aspera” motto, is to deliver general-purpose robots that can perform useful physical work alongside people. Its commercial model centres on selling humanoid robots: the S1 served as a research and demonstration platform from 2024, while the T1, launched in May 2026 at 89,900 RMB, targets volume deployment. Astribot is at the Series B venture stage as of mid-2026, operating from China’s densest robotics-hardware supply chain in the Shenzhen / Guangdong corridor. This identity — a vertically integrated, China-based humanoid builder with a distinctive actuation approach — frames every subsequent diligence question
    about market, technology, customers, and capital.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO031
  tableRefs:
  - TO001
  figureRefs:
