- id: s2
  title: Founders, leadership and governance
  body: 'Astribot’s gravitational centre is founder and chief executive Lai Jie, widely reported as the first employee and a chief architect of Tencent Robotics X and previously a leader of Baidu’s Xiaodu robot programme, with roughly 17 years in robotics and AI. That pedigree gives the company unusually strong founder-market fit in a field where embodied-AI talent is scarce. Co-founder Fang Ke has fronted commercial and partnership announcements, and Dai Yuan, a UCLA-trained robotics PhD, contributes founding technical depth. The flip side of this concentrated talent is material key-person dependence: Lai Jie anchors both the technical roadmap and investor confidence, so his continuity is a genuine diligence risk. Astribot continues to hire across engineering and operations, signalling team expansion. Governance remains opaque — board composition, investor control rights, and equity splits are not publicly disclosed, which is typical for a private Chinese venture but leaves real questions
    for any acquirer or late-stage investor to probe.'
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
  - CO037
  tableRefs:
  - TO002
- id: s3
  title: Funding, valuation and capital structure
  body: 'Astribot’s capital story accelerated dramatically in 2026. The company raised more than 1 billion RMB across roughly three rounds in three months, culminating in a June 2026 Series B that pushed its valuation above 10 billion RMB (about 1.4 billion US dollars) and conferred unicorn status — placing it among China’s most valuable humanoid-robot startups. The investor roster is notably blue-chip and strategic: Ant Group as a platform strategic, alongside Bohua Capital, Yunqi Partners, Matrix Partners China, and Jinqiu Capital, plus listed-company strategics Thundersoft (中科创达) and Kede Education (科德教育). Cumulative disclosed funding is estimated above 1.5 billion RMB, though the round-by-round split and ownership percentages are not public. Revenue, run-rate, gross margin, and precise headcount are all undisclosed, and no secondary sales or debt facilities have been reported. The capital base is therefore strong and well-sponsored, but the financial transparency needed to underwrite
    the valuation independently is largely absent.'
  claimRefs:
  - CO014
