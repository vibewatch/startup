  - TI004
  figureRefs:
  - FI004
- id: s4
  title: Financial gaps and verdict
  body: 'The honest summary is that Astribot’s financial profile is a well-capitalised question mark. The material gaps — revenue, gross margin, burn, runway, cash on hand, round structure, and any peer-comparable capital efficiency — are all undisclosed, so the financial judgment rests on estimates rather than statements. There is also a valuation-quality concern: some analysts warn that China’s humanoid funding cycle is frothy, and Astribot’s valuation looks rich relative to its disclosed traction, raising down-round risk if growth disappoints. Against that, the company has genuine strengths: a clear hardware monetisation model with a disclosed price, real if modest delivery traction, blue-chip strategic backing, and a fortified post-Series-B balance sheet. The financial verdict is therefore mixed-positive: revenue quality and margin path are unproven and capital intensity is high, but funding access is excellent. The priority diligence asks are management accounts (revenue, margin, burn),
    the cap-table and round structure, and BOM/cost-down trajectory — without which the valuation cannot be independently validated.'
  claimRefs:
