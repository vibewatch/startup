chapter:
  number: 4
  title: Financials & Funding
  summary: Astribot is a private, pre-disclosure company whose economics are dominated by hardware sales of its 89,900 RMB T1 robot and a 2026 Series B exceeding 1 billion RMB at a 10-billion-RMB-plus valuation; revenue, margin, burn and runway are undisclosed and must be estimated.
sections:
- id: s1
  title: Revenue model, pricing, and recognition
  body: Astribot’s economics are, at this stage, a hardware story. Its revenue is generated primarily by selling humanoid robots — the established S1 research platform and, since May 2026, the volume-oriented T1 priced at 89,900 RMB (about 13,500 US dollars) — with software, embodied-OS, fleet-management and data services as potential but unconfirmed future streams. Hardware revenue is typically recognised on delivery while any service revenue would be deferred, but the mix is unknown because Astribot, as a private pre-disclosure company, does not break out revenue. The T1 price is the single firmly disclosed monetisation data point and anchors per-unit revenue; combined with reported thousand-level cumulative deliveries it implies annualised hardware revenue on the order of tens to low-hundreds of millions of RMB, an estimate carrying low confidence. The strategic logic of the aggressive price is to trade per-unit margin for adoption and installed base, betting that software attach and
    component cost-down later convert volume into profit.
  claimRefs:
  - CI007
  - CI008
  - CI028
  - CI026
  - CI009
  - CI010
  tableRefs:
  - TI001
  - TI002
- id: s2
  title: Cost structure, unit economics, and sales efficiency
  body: Beneath the price sits an unproven cost structure. For humanoid hardware the dominant gross-margin driver is the bill of materials — actuators, harmonic reducers, sensors and compute — and Astribot discloses neither its BOM nor its gross margin, which industry observers expect to be thin in the early ramp. Scaling mass production demands capex in tooling and assembly capacity and carries working-capital needs in inventory and receivables, both typical drags on a hardware balance sheet. On the demand side, enterprise and integrator sales cycles for humanoids are long, weighing on near-term sales efficiency, though integrator partnerships such as the Seer tie-up can improve distribution economics and shorten the path to deployment. The plausible route to healthy unit economics runs through driving BOM cost below the 89,900 RMB price while sustaining volume, plus eventual software attach — but with only ASP disclosed, the unit economics here are reconstructed rather than observed, and
    remain the central financial uncertainty.
  claimRefs:
  - CI019
  - CI012
  - CI020
  - CI021
  - CI017
  - CI018
  - CI027
  - CI016
  - CI033
  tableRefs:
