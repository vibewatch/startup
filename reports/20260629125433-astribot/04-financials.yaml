  figureRefs:
  - FI001
  - FI002
- id: s3
  title: Capital, funding velocity, and adequacy
  body: Where the financial picture is strong is capital. Astribot raised more than 1 billion RMB across three rounds in roughly three months in 2026, culminating in a June Series B that valued it above 10 billion RMB (~1.4 billion US dollars); cumulative disclosed funding is estimated above 1.5 billion RMB. The investor base is blue-chip and strategic — Ant Group plus listed companies including Kede Education (SZSE 300192), which discloses through the cninfo exchange platform — lending financing credibility and follow-on capacity, and the sheer velocity of the raise signals strong investor demand for the equity. This materially strengthens the balance sheet and funds R&D and manufacturing scale-up. The caveat is that humanoid development and manufacturing are capital-intensive, so as a pre-profit company Astribot remains dependent on continued external financing; its exact cash, burn and runway are undisclosed, so capital adequacy, while clearly improved, cannot be precisely underwritten.
  claimRefs:
  - CI003
  - CI001
  - CI002
  - CI004
  - CI024
  - CI006
  - CI025
  - CI014
  - CI015
  - CI023
  - CI029
