- id: s3
  title: Moats, switching costs, and competitive risk
  body: 'Astribot’s defensibility is real but unproven. Its strongest potential moats are cable-driven actuation know-how, full-stack integration of AI model, embodied OS and body, integrator distribution via the Seer partnership, and proprietary manipulation data that compounds with deployments. Against these, switching costs are presently low because the market is pre-standard and dominated by early pilots where buyers can multi-home across vendors, and humanoid hardware and AI stacks face genuine commoditisation risk as components standardise and foundation models converge. The dominant competitive risks are structural: Astribot is materially less capitalised than Figure, Apptronik and Tesla, exposing it in a capital-intensive race; aggressive pricing across Chinese makers threatens a margin-compressing price war; and well-funded entrants could displace it if they reach reliable autonomy and fleet scale first. The competitive verdict is that Astribot has a differentiated, fast-executing
    position with credible early moats, but must convert technical novelty into scale and data advantages before better-funded rivals close the gap.'
