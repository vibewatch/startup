- id: s4
  title: Go-to-market, distribution, and execution outlook
  body: 'Beyond raw capability and capital, the humanoid race will be decided by go-to-market execution, and here the field diverges. Competitors mix three motions: direct enterprise sales to factories and logistics operators, integrator and channel partnerships that embed robots into existing automation, and research or developer adoption that seeds future commercial demand. Astribot pursues all three but leans on its Seer integrator partnership for logistics distribution and on its viral S1 platform for developer mindshare, while Unitree leverages volume and price to flood the low end and Figure and Apptronik pursue marquee enterprise pilots with Western manufacturers. Trust and regulatory posture are becoming a differentiator as China rolls out humanoid safety standards, potentially favouring domestic players who design to those norms. The execution outlook for Astribot is encouraging on speed and channel access but constrained by capital: it must convert its differentiated dexterity
    and integrator distribution into repeatable, reference-able deployments before better-funded rivals scale autonomy and drive the cost curve down faster than Astribot can match.'
