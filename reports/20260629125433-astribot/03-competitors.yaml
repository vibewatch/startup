chapter:
  number: 3
  title: Competitive Landscape
  summary: Astribot competes in a crowded humanoid-robot field against far larger-funded rivals — China's Unitree, AgiBot, UBTech and Galbot and US players Figure and Apptronik — differentiating on cable-driven dexterity and aggressive pricing rather than balance-sheet scale.
sections:
- id: s1
  title: The competitive landscape
  body: Astribot competes in one of the most crowded and well-capitalised technology races of the decade. The humanoid-robot field has begun to show a Chinese duopoly dynamic around Unitree and AgiBot, but the broader landscape includes UBTech, Galbot, XPeng, Leju and others domestically, plus US leaders Figure, Apptronik, Tesla’s Optimus programme and 1X. China controls roughly 80% of global humanoid shipments in 2026, giving domestic players including Astribot a supply-chain and iteration-speed advantage, while US rivals generally carry far higher valuations. Direct peers are other general-purpose humanoid makers; adjacent competitors include collaborative-arm and AMR vendors; and the ultimate substitute remains human labour with fixed automation. Within this set Astribot is a mid-valuation challenger — well below Figure and Apptronik on capital but credible among Chinese peers — that has executed quickly, moving from viral S1 demonstrations to a priced commercial T1 in roughly two years.
