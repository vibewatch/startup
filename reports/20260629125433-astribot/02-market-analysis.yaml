chapter:
  number: 2
  title: Market Analysis
  summary: Astribot competes in China's fast-growing humanoid-robot market, which Morgan Stanley sizes at roughly 50,000 units and about 2 billion US dollars for 2026 and which is forecast to expand sharply through 2030 on labour shortages, ageing demographics, falling costs, and strong state backing.
sections:
- id: s1
  title: Market boundary and adjacencies
  body: 'Astribot operates in the market for general-purpose humanoid robots — bipedal and wheeled-humanoid machines sold for commercial, industrial, and service work — of which its S1 research platform and 89,900 RMB T1 are representative. The boundary is evidence-constrained and increasingly blurry: collaborative arms, autonomous mobile robots (AMRs), and quadrupeds sit in adjacent territory, both competing with and complementing humanoids, while fixed industrial automation and consumer toys fall outside the core. The status-quo substitute that humanoids must displace is human labour combined with existing fixed automation and wheeled robots. China anchors the supply side, with Shenzhen and the Yangtze-river-delta clusters concentrating components and integrators; Astribot’s Shenzhen base places it inside the densest part of that ecosystem. Because form factors are converging — wheeled-humanoid hybrids and AMR-plus-arm stacks overlap with Astribot’s integrator channel — any market sizing
    must be read as indicative rather than precise, a caveat that recurs throughout this chapter and shapes every sizing judgment that follows here.'
  claimRefs:
  - CM022
  - CM023
  - CM020
  - CM021
  - CM004
  - CM028
  tableRefs:
  - TM001
- id: s2
  title: Market sizing across multiple lenses
  body: 'Sizing the opportunity demands multiple lenses rather than one headline number. At the top, the long-run total addressable market for general-purpose humanoids is widely projected to reach hundreds of billions of dollars over coming decades, though such figures carry low confidence. Closer in, the serviceable market most relevant to Astribot is China in 2026: Morgan Stanley raised its forecast to about 50,000 units — nearly doubling its prior estimate — implying a market on the order of 2 billion US dollars, while TrendForce projects roughly 94% output growth for the year. Astribot’s obtainable share today is small: reported thousand-level cumulative deliveries against a 50,000-unit market imply low-single-digit penetration, with its 89,900 RMB T1 price the main lever to expand reach. Estimates vary widely across analysts and methodologies, and a precise bottom-up TAM/SAM for Astribot’s exact use cases is not publicly available, so the sizing here is a triangulated range, not a
    forecast.'
  claimRefs:
  - CM005
  - CM006
  - CM007
  - CM001
