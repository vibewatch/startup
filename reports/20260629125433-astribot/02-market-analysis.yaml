- id: s3
  title: Segments, buyers, and adoption path
  body: Demand concentrates in a handful of segments. Industrial manufacturing and logistics are the leading near-term buyers, where Astribot’s cable-driven dexterity suits manipulation-heavy tasks and its partnership with AMR integrator Seer offers a logistics channel. Elderly care, services, and household assistance form a large emerging segment driven by China’s ageing population, but remain mostly at pilot stage on safety and cost grounds. Research and education — the original home of the S1 — is an established early-adopter segment. Budgets sit predominantly with enterprise operations and R&D functions rather than consumers, and the adoption path runs from research and pilot deployments toward repeatable commercial use as reliability and return on investment improve. Astribot’s sub-90,000-RMB pricing is explicitly aimed at broadening the buyer base beyond labs toward commercial operators, though the precise split of demand across these segments is not quantified in public data.
  claimRefs:
  - CM008
  - CM009
  - CM010
  - CM011
  - CM025
  - CM026
  - CM031
  - CM034
  tableRefs:
  - TM003
  figureRefs:
  - FM003
  - FM004
- id: s4
  title: Growth drivers, constraints, and demand quality
  body: The forces shaping this market are strongly positive on balance but not unqualified. On the driver side, labour shortages and wage inflation, a rapidly ageing population, falling component costs, rapid advances in embodied-AI models, and explicit Chinese state strategy and standards all pull adoption forward; the 2026 shipment upgrades and order-pipeline signals suggest the demand is genuine commercial pull rather than pure hype. On the constraint side, unproven return on investment and reliability at scale are the dominant brakes, alongside safety and human-robot-interaction concerns in shared workspaces and the risk that aggressive sub-90,000-RMB pricing from Astribot and peers compresses margins as volumes rise. The market is also crowded, with dozens of well-funded Chinese and global entrants chasing early demand. The net picture is a large, fast-growing, policy-supported market where Astribot is well-positioned technically, but where ROI proof, safety standards, and pricing
    discipline will determine how much of the headline growth converts into durable revenue.
  claimRefs:
