- id: s2
  title: Architecture, software stack, and operating model
  body: 'The product is best understood as a stack. At the base sits Astribot’s defining differentiator: a rope/cable-driven (tendon) actuation system that relocates motors away from the joints, cutting inertia to deliver the high speed and human-like dexterity for which the S1 is known. Above the actuation hardware, a DuoCore architecture pairs a whole-body control core — coordinating arms, torso and mobility — with a learning and decision core; perception via cameras and sensor fusion feeds both. Manipulation skills are acquired through imitation and reinforcement learning on teleoperated demonstrations, an approach documented in the company’s published research (arXiv 2507.17141). In practice, deployment blends autonomous policies with teleoperation fallback for novel or unstructured tasks, and integration into customer operations is supported by an SDK and a public GitHub presence plus integrator partners such as Seer. This layered design — actuation, whole-body control, perception,
    learning, applications — is coherent, but the learning layer is also where the central uncertainty lives.'
  claimRefs:
  - CE001
  - CE007
  - CE030
  - CE031
  - CE009
  - CE010
