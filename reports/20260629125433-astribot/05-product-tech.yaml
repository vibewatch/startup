chapter:
  number: 5
  title: Product & Technology
  summary: Astribot builds AI humanoid robots differentiated by a rope/cable-driven actuation system and a DuoCore software architecture; the S1 research platform (viral 2024) and the volume T1 (May 2026, 1.55m, 66kg, 23 DOF, 89,900 RMB) target dexterous manipulation for industrial and commercial work, but autonomy generality and field reliability remain unproven.
sections:
- id: s1
  title: Products, specifications, and customer workflows
  body: 'Astribot’s line-up centres on two robots and the technology beneath them. The S1, which went viral in 2024, is a research and demonstration platform celebrated for fast, smooth bimanual manipulation — dual 7-DOF arms reaching end-effector speeds up to roughly 10 m/s, about 1.5 kg payload per arm, and reported sub-millimetre (~±0.1 mm) repeatability. In May 2026 the company launched the T1, its commercialisation-oriented humanoid: 1.55 m tall, 66 kg, 23 degrees of freedom, priced aggressively at 89,900 RMB. In customer terms these robots target jobs that today require human hands — dexterous pick-and-place, assembly assist, sorting and logistics, and service or demonstration roles — by substituting flexible bimanual manipulation for manual labour or rigid fixed automation. The T1 productises lessons from the S1, trading some peak performance for manufacturability and a low price, and its 23 DOF reflect a deliberate manipulation-first, cost-aware design rather than maximal full-body
    articulation.'
  claimRefs:
  - CE002
  - CE003
  - CE004
  - CE005
