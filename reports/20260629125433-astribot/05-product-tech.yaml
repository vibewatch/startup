- id: s3
  title: Differentiation, IP, manufacturing, and dependencies
  body: 'Astribot competes on dexterity and speed rather than raw payload, positioning its cable-driven design as a manufacturing-know-how moat that, if protected, could be defensible. A complementary advantage compounds over time: teleoperation generates proprietary manipulation data that can improve learned policies, while a public SDK lowers integration friction and can seed a developer ecosystem. On the supply side, the actuation system depends on motors, tendons, transmission and sensors — a supply chain shared with the broader humanoid sector — plus compute and AI models for perception and control, making these critical dependencies. Crucially, the company has crossed from demonstration into mass production, reportedly reaching thousand-level cumulative deliveries by late 2025 and engineering the T1 explicitly for cost and manufacturability to hit its 89,900 RMB price. Whether cable-driven dexterity remains a durable moat against far better-funded peers, however, is a genuinely open
    strategic question.'
  claimRefs:
  - CE014
  - CE018
  - CE028
  - CE029
  - CE016
  - CE017
  - CE015
