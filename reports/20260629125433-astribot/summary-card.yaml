summary:
  headline: >-
    Astribot is China's leading cable-driven humanoid-robot startup, reaching unicorn status on differentiated actuation
    technology and unusually fast commercial traction, but undisclosed financials and unproven autonomy keep this a
    qualified, medium-confidence Buy rather than a clean underwrite.
