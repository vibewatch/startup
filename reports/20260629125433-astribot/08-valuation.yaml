- id: s3
  title: Scenarios, returns, and valuation sensitivity
  body: Framing the outcome as scenarios clarifies the asymmetry. In the bull case (roughly 25% likely) autonomy generalises, the T1 scales to tens of thousands of units and software attach lifts margins, supporting multi-bagger upside over a 3–5 year horizon. The base case (~45%) sees steady scaling with Seer and domestic buyers as the valuation grows with the sector while autonomy stays semi-supervised. The bear case (~30%) has autonomy stalling, competition compressing pricing and a down-round following as the funding cycle cools, implying a meaningful loss. Valuation is most sensitive to autonomy progress, unit volumes, gross margin and sector multiples — the first being both the largest swing factor and the least proven. Because revenue and margin are undisclosed, no multiples-based valuation can be computed, only narrative comparables, and elevated sector multiples could compress and pressure private marks in a downturn. The position is also illiquid until an IPO or secondary, lengthening
    the effective horizon.
  claimRefs:
  - CV013
  - CV014
  - CV015
  - CV016
  - CV024
