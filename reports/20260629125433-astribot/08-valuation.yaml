- id: s2
  title: Financing context, entry discipline, and comparables
  body: 'Astribot’s June 2026 Series B exceeded 1 billion RMB and valued it above 10 billion RMB (~$1.4 billion), conferring unicorn status. Entry discipline at that level is hard: with revenue undisclosed, pricing leans on narrative and comparables rather than cash flows, and the round structure, preferences and dilution overhang are not public — a material entry-terms gap with real downside-protection implications. The comparable set spans a listed-IPO proxy (Unitree, ~$7B target on 2025 revenue of 1.708 billion RMB up ~335%), large US privates (Figure ~$39B after ~$1B raised; Apptronik ~$5B after ~$520M), and Chinese embodied-AI peers (Galbot ~$3B after ~$363M; AgiBot, well-funded with ~10,000-unit ambitions). Against this spread Astribot’s ~$1.4B looks mid-tier — reasonably valued on differentiation and traction but rich on disclosed financials. Blue-chip backers, including listed strategic Kede Education (SZSE 300192) which discloses via cninfo, lend credibility and a regulated-filing
    reference point, while a domestic supply chain and policy alignment provide a relative-value edge in China.'
