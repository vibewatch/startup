        blocks:
          - type: paragraph
            body: >-
              Operationally, the central risk is the gap between demonstration and dependable autonomy. Over-reliance on
              teleoperation or scripted demos risks disappointing buyers if autonomous generality lags expectations, and
              field reliability, durability and mean-time-between-failures for the cable-driven mechanism at scale
              remain unproven — an operational and reputational risk given demo-driven hype. Scaling mass production
              introduces quality-control, yield and capex execution risk, while dependence on motors, harmonic reducers,
              sensors and compute exposes the company to supply-chain and component-cost pressure shared across the
              humanoid sector. Fleet software or model failures could cause coordinated downtime across deployments.
              These operational risks are compounded by intense competition: well-funded domestic and global rivals such
              as Unitree, AgiBot, Figure and Apptronik intensify competitive and pricing pressure. Mitigation maturity
              across these items is generally low, and residual execution risk on autonomy and manufacturing scale-up is
              high pending independent evidence such as benchmarks and reliability data.
