      - number: '5.4'
        title: Trust, reliability, autonomy gaps, and verdict
        blocks:
          - type: paragraph
            body: >-
              The honest weak spot is evidence of trust, reliability and true autonomy. General, reliable autonomy in
              unstructured environments remains unproven across the sector, and independent reviewers caution that viral
              demos can overstate real-world general capability; many impressive results lean on teleoperation or
              scripting. Compounding this, field reliability, uptime and mean-time-between-failures for the cable-driven
              mechanism at scale are not publicly documented, no public safety certifications (such as CE or ISO) for
              the T1 are available, and quality or defect metrics at volume are undisclosed. Independent, standardised
              benchmarks comparing Astribot’s autonomy to peers are scarce, limiting verification. The
              product/technology verdict is therefore strong-but-unproven: the actuation and dexterity story is
              differentiated and credibly engineered, and the move to volume is real, but generality, reliability and
              compliance evidence are missing. The priority diligence asks are independent autonomy benchmarks,
              field-reliability and MTBF data, and safety and quality certification status, without which the
              differentiated hardware story cannot yet be underwritten as a reliable commercial product at scale.
