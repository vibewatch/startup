              trajectory is striking for its speed: from viral S1 demos in 2024 to reported thousand-level cumulative
              deliveries by late 2025 and the May 2026 launch of the 89,900 RMB T1, which broadens the buyer base beyond
              premium research units. The recurring caveat is missing denominators — active fleet, account counts and
