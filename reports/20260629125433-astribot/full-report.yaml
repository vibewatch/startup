              - CV036
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Asymmetric upside on differentiation and traction
            body: >-
              Cable-driven dexterity, a 1,000+ robot Seer deal and blue-chip backing give Astribot real, fairly-priced
              upside if autonomy and commercialisation prove out.
            calloutType: strength
            claimRefs:
              - CV004
              - CV012
              - CV041
          - type: callout
            title: Frothy sector and missing financials cap conviction
            body: >-
              Bubble warnings, a >10B RMB valuation on undisclosed revenue, and unproven autonomy create down-round risk
              and keep confidence at medium.
            calloutType: risk
            claimRefs:
              - CV023
