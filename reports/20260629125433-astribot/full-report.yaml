  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing, and recognition
        blocks:
          - type: paragraph
            body: >-
              Astribot’s economics are, at this stage, a hardware story. Its revenue is generated primarily by selling
              humanoid robots — the established S1 research platform and, since May 2026, the volume-oriented T1 priced
              at 89,900 RMB (about 13,500 US dollars) — with software, embodied-OS, fleet-management and data services
              as potential but unconfirmed future streams. Hardware revenue is typically recognised on delivery while
              any service revenue would be deferred, but the mix is unknown because Astribot, as a private
              pre-disclosure company, does not break out revenue. The T1 price is the single firmly disclosed
              monetisation data point and anchors per-unit revenue; combined with reported thousand-level cumulative
              deliveries it implies annualised hardware revenue on the order of tens to low-hundreds of millions of RMB,
              an estimate carrying low confidence. The strategic logic of the aggressive price is to trade per-unit
              margin for adoption and installed base, betting that software attach and component cost-down later convert
              volume into profit.
            claimRefs:
