          - type: callout
            title: Autonomy progress is the swing factor
            body: >-
              The valuation view assumes autonomy generality is the dominant value driver and the least-proven
              assumption, making it the top diligence priority.
            calloutType: assumption
            claimRefs:
              - CV027
