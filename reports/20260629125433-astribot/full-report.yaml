  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adjacencies
        blocks:
          - type: paragraph
            body: >-
              Astribot operates in the market for general-purpose humanoid robots — bipedal and wheeled-humanoid
              machines sold for commercial, industrial, and service work — of which its S1 research platform and 89,900
              RMB T1 are representative. The boundary is evidence-constrained and increasingly blurry: collaborative
              arms, autonomous mobile robots (AMRs), and quadrupeds sit in adjacent territory, both competing with and
              complementing humanoids, while fixed industrial automation and consumer toys fall outside the core. The
              status-quo substitute that humanoids must displace is human labour combined with existing fixed automation
              and wheeled robots. China anchors the supply side, with Shenzhen and the Yangtze-river-delta clusters
              concentrating components and integrators; Astribot’s Shenzhen base places it inside the densest part of
              that ecosystem. Because form factors are converging — wheeled-humanoid hybrids and AMR-plus-arm stacks
              overlap with Astribot’s integrator channel — any market sizing must be read as indicative rather than
              precise, a caveat that recurs throughout this chapter and shapes every sizing judgment that follows here.
            claimRefs:
              - CM022
              - CM023
