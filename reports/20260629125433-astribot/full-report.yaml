      - number: '2.3'
        title: Segments, buyers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Demand concentrates in a handful of segments. Industrial manufacturing and logistics are the leading
              near-term buyers, where Astribot’s cable-driven dexterity suits manipulation-heavy tasks and its
              partnership with AMR integrator Seer offers a logistics channel. Elderly care, services, and household
              assistance form a large emerging segment driven by China’s ageing population, but remain mostly at pilot
              stage on safety and cost grounds. Research and education — the original home of the S1 — is an established
              early-adopter segment. Budgets sit predominantly with enterprise operations and R&D functions rather than
              consumers, and the adoption path runs from research and pilot deployments toward repeatable commercial use
              as reliability and return on investment improve. Astribot’s sub-90,000-RMB pricing is explicitly aimed at
              broadening the buyer base beyond labs toward commercial operators, though the precise split of demand
              across these segments is not quantified in public data.
