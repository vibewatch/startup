        title: Founders, leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Astribot’s gravitational centre is founder and chief executive Lai Jie, widely reported as the first
              employee and a chief architect of Tencent Robotics X and previously a leader of Baidu’s Xiaodu robot
              programme, with roughly 17 years in robotics and AI. That pedigree gives the company unusually strong
              founder-market fit in a field where embodied-AI talent is scarce. Co-founder Fang Ke has fronted
              commercial and partnership announcements, and Dai Yuan, a UCLA-trained robotics PhD, contributes founding
              technical depth. The flip side of this concentrated talent is material key-person dependence: Lai Jie
              anchors both the technical roadmap and investor confidence, so his continuity is a genuine diligence risk.
              Astribot continues to hire across engineering and operations, signalling team expansion. Governance
              remains opaque — board composition, investor control rights, and equity splits are not publicly disclosed,
              which is typical for a private Chinese venture but leaves real questions for any acquirer or late-stage
              investor to probe.
