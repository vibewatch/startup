  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and geopolitical risk
        blocks:
          - type: paragraph
            body: >-
              The most structural risks sit in the regulatory and geopolitical domain. As a China-based robotics
              company, Astribot is exposed to US–China technology tensions and export controls that can restrict access
              to advanced components or overseas markets — a high-likelihood, high-impact risk largely outside its
              control. The legal picture is mixed: cable-driven actuation overlaps a crowded patent landscape, creating
              freedom-to-operate and IP-litigation risk, while the absence of public safety certifications (CE/ISO) for
              the T1 is a market-access and liability concern, and national humanoid-robot standards are still emerging,
              leaving compliance uncertain. Robots with cameras and sensors in workplaces add data-privacy and security
              obligations, and operating near people creates product-liability exposure. Offsetting some of this,
              China’s government actively supports embodied AI and humanoid robotics through policy and an emerging
              standards framework, which lowers domestic regulatory risk even as evolving enforcement could impose new
              obligations. No public litigation against Astribot is documented, but sector-wide IP disputes remain a
              live risk.
            claimRefs:
