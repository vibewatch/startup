      - number: '2.4'
        title: Growth drivers, constraints, and demand quality
        blocks:
          - type: paragraph
            body: >-
              The forces shaping this market are strongly positive on balance but not unqualified. On the driver side,
              labour shortages and wage inflation, a rapidly ageing population, falling component costs, rapid advances
              in embodied-AI models, and explicit Chinese state strategy and standards all pull adoption forward; the
              2026 shipment upgrades and order-pipeline signals suggest the demand is genuine commercial pull rather
              than pure hype. On the constraint side, unproven return on investment and reliability at scale are the
              dominant brakes, alongside safety and human-robot-interaction concerns in shared workspaces and the risk
              that aggressive sub-90,000-RMB pricing from Astribot and peers compresses margins as volumes rise. The
              market is also crowded, with dozens of well-funded Chinese and global entrants chasing early demand. The
              net picture is a large, fast-growing, policy-supported market where Astribot is well-positioned
              technically, but where ROI proof, safety standards, and pricing discipline will determine how much of the
              headline growth converts into durable revenue.
