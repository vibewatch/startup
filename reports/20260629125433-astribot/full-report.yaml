              US–China export controls and the gap between demo and dependable autonomy are the highest-severity,
              hardest-to-control risks in the profile.
            calloutType: risk
            claimRefs:
              - CR001
              - CR012
              - CR035
          - type: callout
            title: Valuation and partner concentration
            body: >-
              A >10B RMB valuation on undisclosed revenue plus heavy reliance on the Seer channel create down-round and
              concentration risk amid bubble warnings.
            calloutType: risk
            claimRefs:
              - CR015
              - CR002
              - CR013
          - type: callout
            title: Policy support partially offsets risk
            body: >-
              The assessment assumes strong Chinese policy backing and blue-chip investors materially, though not fully,
              mitigate financing and regulatory risk.
            calloutType: assumption
            claimRefs:
              - CR003
              - CR023
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis, anti-thesis, and recommendation
        blocks:
          - type: paragraph
            body: >-
              The investment case for Astribot is genuinely two-sided. The bull thesis rests on a differentiated
              cable-driven actuation system that delivers human-like dexterity, unusually fast traction from viral 2024
              demos to a flagship 1,000+ robot Seer partnership and thousand-level deliveries, blue-chip backing led by
              Ant Group, and a humanoid TAM that analysts size in the tens of billions of dollars by the early 2030s
              with China positioned to capture a large output share. The anti-thesis is equally concrete: autonomy
              generality is unproven and demo-reliant, revenue and margin are undisclosed, competition from far
              better-funded rivals is fierce, and Chinese officials and analysts warn of bubble risk that could see the
              valuation overshoot fundamentals. Weighing these, the recommendation is a qualified Buy with medium
              confidence, a high risk rating and a fair valuation stance — an asymmetric bet that rewards proven
              commercialisation while keeping risk monitorable. Confidence is medium precisely because the qualitative
              case is strong but quantitative validation is missing.
            claimRefs:
              - CV004
              - CV005
              - CV017
              - CV018
              - CV023
              - CV001
              - CV031
              - CV032
              - CV030
              - CV041
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV031
              - CV032
              - CV030
              - CV025
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV017
              - CV012
              - CV023
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV041
              - CV004
              - CV016
              - CV030
              - CV001
      - number: '8.2'
        title: Financing context, entry discipline, and comparables
        blocks:
          - type: paragraph
            body: >-
              Astribot’s June 2026 Series B exceeded 1 billion RMB and valued it above 10 billion RMB (~$1.4 billion),
              conferring unicorn status. Entry discipline at that level is hard: with revenue undisclosed, pricing leans
              on narrative and comparables rather than cash flows, and the round structure, preferences and dilution
              overhang are not public — a material entry-terms gap with real downside-protection implications. The
              comparable set spans a listed-IPO proxy (Unitree, ~$7B target on 2025 revenue of 1.708 billion RMB up
              ~335%), large US privates (Figure ~$39B after ~$1B raised; Apptronik ~$5B after ~$520M), and Chinese
              embodied-AI peers (Galbot ~$3B after ~$363M; AgiBot, well-funded with ~10,000-unit ambitions). Against
              this spread Astribot’s ~$1.4B looks mid-tier — reasonably valued on differentiation and traction but rich
              on disclosed financials. Blue-chip backers, including listed strategic Kede Education (SZSE 300192) which
              discloses via cninfo, lend credibility and a regulated-filing reference point, while a domestic supply
              chain and policy alignment provide a relative-value edge in China.
            claimRefs:
              - CV003
              - CV002
              - CV019
              - CV020
