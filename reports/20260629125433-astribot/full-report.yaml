              geopolitical/export exposure, autonomy execution, valuation/financing, and partner concentration, with
              reliability and key-person dependence close behind. These risks are interconnected: a financing or export
              shock can cascade into supply, scaling and partner stress and ultimately a thesis break, so they should be
              monitored as a system rather than in isolation. Partial mitigants exist — strong Chinese policy support
              and blue-chip investors including Ant Group cushion financing and regulatory risk, and diversifying beyond
              Seer while securing multi-source components would reduce concentration and supply risk — but several kill
              triggers, such as an export block or a failed autonomy step-change, lie outside the company’s direct
              control. The thesis-break triggers to watch are a failed autonomy step-change, a down-round, loss of the
              Seer channel, or an export-control block; the key monitoring indicators are certification milestones,
