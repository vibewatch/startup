      - number: '3.2'
        title: Competitor profiles and comparison
        blocks:
          - type: paragraph
            body: >-
              On scale and capital, Astribot is clearly out-resourced by the leaders. Unitree is pursuing an IPO near a
              7 billion US dollar valuation on the back of about 1.708 billion RMB of 2025 revenue (up roughly 335%) and
              competes aggressively on price, offering its G1 around 16,000 US dollars. AgiBot has reached a 10,000-unit
              production milestone, signalling manufacturing scale that dwarfs Astribot’s thousand-level deliveries. In
              the US, Figure raised about 1 billion US dollars at roughly a 39 billion US dollar valuation and Apptronik
              raised about 520 million US dollars at roughly 5 billion, while Galbot in China reached about a 3 billion
              US dollar valuation. Against these, Astribot’s roughly 1.4 billion US dollar valuation is modest. Where
              Astribot competes is on capability and price: its cable-driven actuation gives high manipulation
              dexterity, and its 89,900 RMB T1 undercuts most full-size peers while rivalling Unitree’s low-cost
              positioning. Like-for-like capability benchmarks across these makers are, however, not publicly available.
