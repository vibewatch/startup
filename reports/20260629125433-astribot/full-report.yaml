              - CV001
              - CV031
              - CV032
              - CV025
      - number: '8.4'
        title: Exit readiness, triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness hinges on proven commercialisation. The plausible paths are a domestic IPO — as Unitree’s
              move signals for Chinese humanoid leaders — or a strategic acquisition, both contingent on demonstrating
              reliable, autonomous, software-rich deployments at scale, which is also the key upside driver. The
              thesis-break triggers to monitor are a failed autonomy step-change, a down-round, loss of the Seer
              channel, and an export-control block, several of which lie outside the company’s control. To move from a
              qualified Buy to a high-conviction position, the priority diligence asks are management accounts (revenue,
              margin, burn), the cap table and round terms to size dilution and preferences, independent autonomy
              benchmarks to validate the core differentiation, plus field-reliability data and named non-Seer customers.
              Until those are answered, Astribot remains an attractive but unproven asymmetric bet: real differentiation
              and momentum, priced fairly for the sector, carrying high but monitorable risk — hence Buy, with medium
              confidence.
            claimRefs:
              - CV026
              - CV037
              - CV028
              - CV029
              - CV020
              - CV027
              - CV041
