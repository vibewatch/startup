            body: >-
              Beneath the price sits an unproven cost structure. For humanoid hardware the dominant gross-margin driver
              is the bill of materials — actuators, harmonic reducers, sensors and compute — and Astribot discloses
              neither its BOM nor its gross margin, which industry observers expect to be thin in the early ramp.
              Scaling mass production demands capex in tooling and assembly capacity and carries working-capital needs
              in inventory and receivables, both typical drags on a hardware balance sheet. On the demand side,
              enterprise and integrator sales cycles for humanoids are long, weighing on near-term sales efficiency,
              though integrator partnerships such as the Seer tie-up can improve distribution economics and shorten the
              path to deployment. The plausible route to healthy unit economics runs through driving BOM cost below the
              89,900 RMB price while sustaining volume, plus eventual software attach — but with only ASP disclosed, the
              unit economics here are reconstructed rather than observed, and remain the central financial uncertainty.
