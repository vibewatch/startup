chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Astribot (星尘智能, Stardust Intelligence) is a Shenzhen-headquartered humanoid-robotics company founded in
              December 2022. It positions itself as a full-stack embodied-AI developer, building the AI models, an
              embodied operating system, and a cable-driven robotic body in-house rather than integrating third-party
              hardware. The company’s stated ambition, captured in its “Ad astra per aspera” motto, is to deliver
              general-purpose robots that can perform useful physical work alongside people. Its commercial model
              centres on selling humanoid robots: the S1 served as a research and demonstration platform from 2024,
              while the T1, launched in May 2026 at 89,900 RMB, targets volume deployment. Astribot is at the Series B
              venture stage as of mid-2026, operating from China’s densest robotics-hardware supply chain in the
              Shenzhen / Guangdong corridor. This identity — a vertically integrated, China-based humanoid builder with
              a distinctive actuation approach — frames every subsequent diligence question about market, technology,
              customers, and capital.
