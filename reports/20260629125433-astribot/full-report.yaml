      - number: '1.4'
        title: Products, milestones and traction
        blocks:
          - type: paragraph
            body: >-
              Astribot’s public trajectory is a tight four-year arc. The S1 research humanoid, unveiled in 2024 with
              dual seven-degree-of-freedom cable-driven arms, high end-effector speed, and sub-millimetre repeatability,
              went viral and was showcased at the 2024 World Robot Conference in Beijing, establishing technical
              credibility. The company’s rope/cable-driven actuation — paired with a “DuoCore” dual-system control
              architecture — is its core differentiator, and Astribot claims to be the first to mass-produce
              cable-driven humanoids. By late 2025 it reported thousand-level cumulative deliveries, and in May 2026 it
              launched the commercial T1 (about 1.55 m, 66 kg, 23 degrees of freedom) at an aggressive 89,900 RMB price
              point, supported by mass-production capability and industrial-deployment partnerships. Not all signals are
              uniformly positive: at least one independent reviewer questioned whether early demo videos overstated
              autonomy, and commentators warn that the rapid valuation step-up reflects broader froth in China’s
              humanoid-robot cycle. These tensions — real technical novelty against unproven at-scale economics — define
              the central diligence question.
