        title: Market sizing across multiple lenses
        blocks:
          - type: paragraph
            body: >-
              Sizing the opportunity demands multiple lenses rather than one headline number. At the top, the long-run
              total addressable market for general-purpose humanoids is widely projected to reach hundreds of billions
              of dollars over coming decades, though such figures carry low confidence. Closer in, the serviceable
              market most relevant to Astribot is China in 2026: Morgan Stanley raised its forecast to about 50,000
              units — nearly doubling its prior estimate — implying a market on the order of 2 billion US dollars, while
              TrendForce projects roughly 94% output growth for the year. Astribot’s obtainable share today is small:
              reported thousand-level cumulative deliveries against a 50,000-unit market imply low-single-digit
              penetration, with its 89,900 RMB T1 price the main lever to expand reach. Estimates vary widely across
              analysts and methodologies, and a precise bottom-up TAM/SAM for Astribot’s exact use cases is not publicly
              available, so the sizing here is a triangulated range, not a forecast.
