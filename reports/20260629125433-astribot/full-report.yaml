      - number: '1.3'
        title: Funding, valuation and capital structure
        blocks:
          - type: paragraph
            body: >-
              Astribot’s capital story accelerated dramatically in 2026. The company raised more than 1 billion RMB
              across roughly three rounds in three months, culminating in a June 2026 Series B that pushed its valuation
              above 10 billion RMB (about 1.4 billion US dollars) and conferred unicorn status — placing it among
              China’s most valuable humanoid-robot startups. The investor roster is notably blue-chip and strategic: Ant
              Group as a platform strategic, alongside Bohua Capital, Yunqi Partners, Matrix Partners China, and Jinqiu
              Capital, plus listed-company strategics Thundersoft (中科创达) and Kede Education (科德教育). Cumulative disclosed
              funding is estimated above 1.5 billion RMB, though the round-by-round split and ownership percentages are
              not public. Revenue, run-rate, gross margin, and precise headcount are all undisclosed, and no secondary
              sales or debt facilities have been reported. The capital base is therefore strong and well-sponsored, but
              the financial transparency needed to underwrite the valuation independently is largely absent.
