  - TU002
- id: s2
  title: Named customer proof and the journey to production
  body: 'The strongest customer proof point is the partnership with Seer, an industrial-robotics company, to put more than 1,000 humanoid robots into industrial use — a deployment that, if realised, would be significant by 2026 standards and represents Astribot’s most concrete production-scale reference. Around it, the customer journey runs from viral awareness and demonstrations, through pilots and partnerships, to production deployment and prospective fleet expansion, with the lower-priced T1 helping convert demonstration interest into paying deployments. Beyond Seer, however, few named production customers are publicly verifiable: much disclosed activity is pilot, demonstration or partnership-stage rather than confirmed at-scale production, and adverse commentary cautions that humanoid traction across China may be overstated by demos and announcements. Reference quality is therefore moderate — the Seer deal is corroborated across independent outlets, but most other proof is announcement-based,
    leaving the funnel narrow at its production end.'
  claimRefs:
  - CU001
  - CU002
  - CU035
  - CU009
  - CU010
  - CU030
