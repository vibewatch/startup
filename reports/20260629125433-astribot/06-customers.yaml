chapter:
  number: 6
  title: Customers & Traction
  summary: 'Astribot’s customer story is early but accelerating: thousand-level cumulative deliveries by late 2025, a flagship partnership with industrial-robotics firm Seer to deploy 1,000+ humanoid robots, and the May 2026 T1 launch broadening the buyer base — yet named production references, retention data and concentration metrics are largely undisclosed.'
sections:
- id: s1
  title: Customer segments, geography, and adoption trajectory
  body: 'Astribot’s customer base, while still thin in named detail, divides into four inferable segments: industrial manufacturers (the commercial core, reached largely through the Seer partnership), logistics and warehousing integrators, research institutions that formed an early base after the S1 went viral in 2024, and service or showcase deployments that provide marketing validation. For industrial work the buyer and payer is typically a manufacturer or integrator while the end-users are line workers and operations teams. Geographically the disclosed traction is concentrated in China, consistent with the company’s Shenzhen base and domestic supply chain; international customers are not publicly documented. The adoption trajectory is striking for its speed: from viral S1 demos in 2024 to reported thousand-level cumulative deliveries by late 2025 and the May 2026 launch of the 89,900 RMB T1, which broadens the buyer base beyond premium research units. The recurring caveat is missing denominators
    — active fleet, account counts and utilisation behind the delivery figures are undisclosed.'
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  - CU033
  - CU003
  - CU004
  - CU023
  - CU024
  - CU031
