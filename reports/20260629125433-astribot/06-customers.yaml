- id: s3
  title: Retention, durability, and the data gap
  body: Where the evidence thins to nothing is retention and durability. Net-revenue-retention, repeat-purchase and renewal metrics are not disclosed; contract lengths, terms and any recurring-revenue structure are undisclosed; and public customer-satisfaction or outcome metrics such as cycle-time or ROI from deployments do not exist. Churn and decommissioning data are likewise unavailable, so the durability of deployments cannot be assessed, and no public cohort or retention curves can be constructed. This matters because a hardware company’s long-run value depends heavily on repeat orders, expansion within accounts and fleet longevity, none of which can currently be verified. Each deployment does generate manipulation data that can deepen the product and support future expansion, but whether that compounds into stickiness or merely one-off sales is unknowable from public information. Retention is, bluntly, the largest single evidence gap in the customer picture, and it directly constrains
    how confidently any forward revenue or lifetime-value estimate can be made.
  claimRefs:
  - CU011
  - CU012
  - CU013
  - CU028
  - CU029
  - CU034
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: s4
  title: Concentration, expansion levers, and verdict
  body: 'On balance, Astribot’s expansion levers are real but counterweighted by concentration. The clearest growth path is land-and-expand through Seer’s integrator network plus the T1 widening the funnel, with deployment data as a compounding asset. Against that, disclosed traction is concentrated in the Seer relationship, creating partner-concentration risk if it underperforms; the company is effectively single-product and China-centric; and top-customer concentration is material until the pipeline diversifies. The customer/traction verdict is cautiously constructive: Astribot has moved faster than most humanoid peers from demos to a flagship 1,000+ robot industrial partnership and thousand-level deliveries, which is genuine early proof, but the picture rests heavily on one corroborated reference with no retention, satisfaction or concentration data behind it. The priority diligence asks are named non-Seer production customers, active-fleet and repeat-order data, and contract terms —
    without which traction quality, durability and the true breadth of the customer base cannot be independently underwritten or compared against faster-scaling humanoid peers.'
