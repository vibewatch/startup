  topStrengths:
    - 差异化绳索 / 线缆驱动技术让机器人具备高速、低惯量、类人灵巧度，并已产品化到商用 T1。
    - 估值超过 100 亿人民币，背后有 Ant Group 和上市产业方等强投资人，资产负债表和后续融资能力更稳。
    - 人形机器人公司里少见地跑得快：2024 年 S1 演示出圈，到 Seer 旗舰合作一次部署 1,000+ 台机器人，2025 年底交付达到千台级。
    - 创始团队经验足，由腾讯 Robotics X 前首位员工兼首席架构师 Lai Jie 领衔，机器人和 AI 背景深。
  topRisks:
    - 中国和全球人形机器人玩家（Unitree、AgiBot、Figure、Apptronik）融资实力强得多，竞争和价格风险会被进一步放大。
    - 自主能力和规模化商业收入尚未验证，毛利率也未披露；公司仍依赖演示，可能高估真实场景能力。
    - 中国机器人公司绕不开地缘政治和中美出口管制敞口，且多数不在公司可控范围内。
    - 对创始人 Lai Jie 依赖高，同时部署渠道集中在 Seer；行业估值泡沫也带来下一轮融资降估值风险。
  unresolvedGaps:
    - 收入、ARR、毛利率、烧钱速度和现金跑道均未公开，因此商业进展和估值仍建立在估算上。
    - Series B 背后的股权结构表、轮次结构、优先权和潜在稀释压力均未披露。
    - Seer 之外已具名量产客户、在役机队基数、留存和部署效果尚未验证。
    - 独立自主能力基准、现场可靠性 / MTBF 数据、安全认证和专利组合深度均未公开。
