summary:
  headline: Astribot 是中国领先的绳索 / 线缆驱动人形机器人创业公司，靠差异化驱动技术和异常快的商业进展跻身独角兽；但财务未披露、自主能力仍未跑通，投资结论只能是带条件、中等置信度的买入，而不是可以直接承销的干净标的。
