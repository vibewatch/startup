companyProfile:
  summary: >-
    Astribot (星尘智能, Stardust Intelligence) is a Shenzhen-based humanoid robotics company founded in December 2022 by Lai Jie, formerly the first employee and a chief architect at Tencent Robotics X and a lead at Baidu's Xiaodu Robot. The company develops cable-driven AI humanoid robots, having launched the S1 research platform that went viral in 2024 and the commercial T1 at 89,900 RMB in May 2026. It achieved unicorn status in June 2026 following a Series B round exceeding 1 billion RMB at a valuation above 10 billion RMB (roughly 1.4 billion US dollars), backed by Ant Group and other strategic investors. The principal diligence limitation is opacity: revenue, gross margin, burn, runway, round terms, and independent autonomy benchmarks are all undisclosed.
