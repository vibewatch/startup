  topStrengths:
    - Differentiated rope/cable-driven actuation technology enabling high-speed, low-inertia, human-like dexterity now productised in the commercial T1.
    - Unicorn valuation above 10 billion RMB with strong investor backing including Ant Group and listed strategics, giving a fortified balance sheet and follow-on capacity.
    - Unusually fast traction for a humanoid maker, from viral S1 demos in 2024 to a flagship 1,000+ robot Seer partnership and thousand-level deliveries by late 2025.
    - Experienced founder team led by Lai Jie, formerly first employee and chief architect at Tencent Robotics X, with deep robotics and AI background.
  topRisks:
    - Intense competition from far better-funded Chinese and global humanoid makers (Unitree, AgiBot, Figure, Apptronik) intensifies competitive and pricing risk.
    - Unproven autonomy and commercial revenue at scale, with undisclosed gross margin and reliance on demonstrations that may overstate real-world capability.
    - Geopolitical and US-China export-control exposure for a China-based robotics company, largely outside its control.
    - Key-person dependence on founder Lai Jie, plus partner concentration on the Seer deployment channel and a frothy-sector down-round risk.
  unresolvedGaps:
    - Revenue, ARR, gross margin, burn, and runway are not publicly disclosed, so traction and valuation rest on estimates.
    - Cap-table, round structure, preferences, and dilution overhang behind the Series B are undisclosed.
    - Named non-Seer production customers, active-fleet denominators, retention, and deployment outcomes are unverified.
    - Independent autonomy benchmarks, field-reliability/MTBF data, safety certifications, and patent-portfolio depth are not public.
