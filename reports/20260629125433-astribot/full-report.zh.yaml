  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与地缘政治风险
        blocks:
          - type: paragraph
            body: >-
              最结构性的风险在监管和地缘政治领域。作为中国机器人公司，Astribot 暴露在中美技术紧张和出口管制之下，先进零部件或海外市场 access
              可能受限；这是高概率、高影响，且很大程度不在公司控制范围内的风险。法律图景混合：绳驱执行机构与拥挤专利版图重叠，带来自由实施和 IP 诉讼风险；T1
              缺少公开安全认证（CE/ISO）又构成市场准入和责任问题；国家人形机器人标准仍在形成，合规不确定。带摄像头和传感器的机器人进入工作场所，会增加数据隐私和安全义务；在人附近运行也带来产品责任暴露。部分抵消因素是，中国政府通过政策和新兴标准框架积极支持具身
              AI 和人形机器人，降低了国内监管风险；但执法演进也可能增加新义务。公开资料没有记录针对 Astribot 的诉讼，但全行业 IP 争议仍是现实风险。
