              Astribot 的资本故事在 2026 年急速升温。公司约三个月内完成约三轮融资，合计超过 1 billion RMB，最终在 2026 年 6 月 B 轮将估值推至 10 billion RMB 以上（约
              1.4 billion US dollars），拿到独角兽身份，跻身中国估值最高的人形机器人创业公司之列。投资人阵容兼具头部和战略属性：平台型战略方 Ant Group，Bohua Capital、Yunqi
              Partners、Matrix Partners China、Jinqiu Capital，以及上市公司战略方 Thundersoft（中科创达）和 Kede Education（科德教育）。累计披露融资估计超过
