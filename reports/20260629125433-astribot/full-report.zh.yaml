              从规模和资本看，Astribot 明显不如头部玩家资源充足。Unitree 正以约 7 billion US dollar 估值推进 IPO，背后是 2025 年约 1.708 billion RMB
              收入（同比增长约 335%），并以 G1 约 16,000 US dollars 的价格积极竞争。AgiBot 达到 10,000 台生产里程碑，制造规模远超 Astribot
              的千台级交付。美国方面，Figure 以约 39 billion US dollar 估值融资约 1 billion US dollars，Apptronik 以约 5 billion US dollars
              估值融资约 520 million US dollars；中国 Galbot 估值约 3 billion US dollars。相比之下，Astribot 约 1.4 billion US dollar
              估值并不夸张。Astribot 的竞争点在能力和价格：绳驱方案带来高操作灵巧性，89,900 RMB 的 T1 低于多数全尺寸同行，同时可与 Unitree
