  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻赛道
        blocks:
          - type: paragraph
            body: >-
              Astribot 所处市场是通用人形机器人——面向商业、工业和服务工作的双足或轮式人形机器，S1 研究平台和 89,900 RMB 的 T1
              是其代表。这个边界受证据限制且越来越模糊：协作机械臂、自主移动机器人（AMR）和四足机器人处在相邻地带，既竞争也补充人形机器人；固定工业自动化和消费玩具则在核心之外。人形机器人要替代的现状，是人力叠加既有固定自动化和轮式机器人。供给侧由中国锚定，深圳和长三角集群集中零部件与集成商；Astribot
              位于深圳，正处在这一生态最密集的位置。形态正在收敛——轮式人形混合体、AMR 加机械臂方案与 Astribot 的集成商渠道重叠——因此任何市场规模测算都只能作为指示而非精确值；这一 caveat
              贯穿本章，也影响后续每个规模判断。
