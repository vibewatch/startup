chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Astribot（星尘智能，Stardust Intelligence）是一家总部位于深圳的人形机器人公司，成立于 2022 年 12 月。公司把自己定位为全栈具身 AI 开发者，自研 AI
              模型、具身操作系统和绳驱机器人本体，而不是集成第三方硬件。其口号「Ad astra per aspera」概括了目标：交付能在人身边完成实用体力工作的通用机器人。商业模式以销售人形机器人为中心：S1 自 2024
              年起承担研究和演示平台角色，2026 年 5 月发布的 T1 定价 89,900 RMB，面向规模化部署。截至 2026 年中，Astribot 处于 B 轮阶段，扎根中国最密集的机器人硬件供应链——深圳 /
              广东走廊。这个身份——一家中国本土、垂直整合、采用独特驱动方案的人形机器人制造商——决定了后续关于市场、技术、客户和资本的每一个尽调问题。
