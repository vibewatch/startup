          - type: paragraph
            body: >-
              Astribot 的公开轨迹是一条紧凑的四年曲线。2024 年亮相的 S1 研究型人形机器人配备双七自由度绳驱手臂，末端执行器速度高、重复定位精度达亚毫米级，视频走红，并在 2024 World Robot
              Conference 北京展出，建立了技术可信度。公司的绳 / 索驱动方案叠加「DuoCore」双系统控制架构，是其核心差异化；Astribot 称自己是首家量产绳驱人形机器人的公司。到 2025
              年末，公司报告累计交付达到千台级；2026 年 5 月又以激进的 89,900 RMB 价格发布商用 T1（约 1.55 m、66 kg、23
              个自由度），背后有量产能力和工业部署合作支撑。信号并非全都正面：至少一位独立评测者质疑早期演示视频夸大了自治能力，评论者也提醒，快速估值跃升反映了中国人形机器人周期的整体泡沫。真实技术新意与尚未验证的规模经济之间的张力，构成了核心尽调问题。
