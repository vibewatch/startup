      - number: '2.4'
        title: 增长驱动、约束与需求质量
        blocks:
          - type: paragraph
            body: >-
              塑造这个市场的力量总体强正面，但并非无条件。驱动侧，劳动力短缺和工资上涨、快速老龄化、零部件成本下降、具身 AI 模型快速进步，以及中国明确的国家战略和标准，都在推前采用；2026
              年出货上调和订单管线信号显示，需求更像真实商业拉动，而非纯炒作。约束侧，规模化 ROI 和可靠性未被验证，是最主要刹车；共享工作空间里的安全与人机交互顾虑，以及 Astribot 和同行低于 90,000 RMB
              的激进定价在放量后压缩利润，也构成压力。市场也很拥挤，数十家资金充足的中国和全球玩家都在追逐早期需求。净图景是：一个大、快增长、政策支持的市场，Astribot 在技术上位置不错；但 ROI
              证明、安全标准和定价纪律，将决定表面增长有多少能转化为耐久收入。
