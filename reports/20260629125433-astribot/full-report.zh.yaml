        title: 收入模式、定价与确认
        blocks:
          - type: paragraph
            body: >-
              Astribot 现阶段的经济模型，本质上是硬件故事。收入主要来自销售人形机器人——已成型的 S1 研究平台，以及 2026 年 5 月以来面向规模的 T1，定价 89,900 RMB（约 13,500 US
              dollars）；软件、具身 OS、机队管理和数据服务可能成为未来收入流，但尚未确认。硬件收入通常在交付时确认，服务收入则会递延；但由于 Astribot 是尚未披露财务的私营公司，收入结构未知。T1
              价格是唯一牢固披露的变现数据点，也锚定了单台收入；结合已报道的千台级累计交付，年化硬件收入大致可能在数千万至低数亿 RMB
              量级，但该估计置信度低。激进定价的战略逻辑，是用单台利润换采用和装机量，押注未来软件附加销售与零部件降本把规模转成利润。
