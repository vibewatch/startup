            body: >-
              价格之下，是尚未验证的成本结构。人形机器人硬件的主要毛利驱动来自 BOM——执行器、谐波减速器、传感器和计算——但 Astribot 没有披露 BOM
              或毛利率，行业观察者预计早期爬坡阶段毛利偏薄。扩大规模量产需要模具和装配产能
              capex，也会带来库存和应收账款等营运资金需求，这是硬件资产负债表的典型拖累。需求侧，人形机器人的企业和集成商销售周期很长，短期销售效率承压；不过 Seer
              这类集成商合作可以改善分销经济性、缩短部署路径。健康单台经济性的合理路径，是在维持销量的同时把 BOM 成本压到 89,900 RMB 以下，再叠加后续软件附加销售；但目前只披露
