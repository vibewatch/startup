        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Astribot 的重心是创始人兼 CEO 赖杰。公开报道普遍称，他是 Tencent Robotics X 首位员工兼首席架构师，此前还负责 Baidu Xiaodu Robot，在机器人和 AI 领域约有
              17 年经验。这一履历让公司在具身 AI 人才稀缺的赛道里拥有少见的创始人 - 市场匹配度。联合创始人方柯多次代表公司发布商业和合作消息；Dai Yuan 拥有 UCLA
              机器人学博士背景，补足创始技术深度。反面是明显的关键人依赖：赖杰同时锚定技术路线图和投资人信心，他能否持续在位是真正的尽调风险。Astribot
              仍在招聘工程和运营岗位，显示团队继续扩张。治理仍不透明——董事会构成、投资人控制权和股权拆分未公开披露；这在中国私营创企中常见，但任何收购方或后期投资人都需要追问。
