      - number: '2.3'
        title: 细分、买方与采用路径
        blocks:
          - type: paragraph
            body: >-
              需求集中在少数细分场景。工业制造和物流是近期领先买方，Astribot 的绳驱灵巧性适合重操作任务，与 AMR 集成商 Seer
              的合作则提供物流渠道。养老、服务和家庭辅助是由中国人口老龄化推动的大型新兴细分，但受安全和成本约束，大多仍停留在试点阶段。研究和教育——S1
              最初的落点——是已成型的早期采用者。预算主要掌握在企业运营和研发部门，而不是消费者手中；采用路径从研究和试点部署走向可重复商业使用，前提是可靠性和投资回报率改善。Astribot 的低于 90,000 RMB
              定价，明确意在把买方基础从实验室拓展至商业运营方；但公开数据没有量化各细分需求占比。
