              Astribot 的投资判断确实是两面的。多头逻辑建立在差异化绳驱执行系统之上：它带来类人灵巧性；牵引也很快，从 2024 年病毒式演示推进到旗舰级 1,000+ 台 Seer 合作和千台级交付；背后有 Ant
              Group 领投的头部支持；人形机器人 TAM 被分析师估到 2030
              年代初数百亿美元量级，而中国有望拿下很大产出份额。反方逻辑同样具体：通用自治未验证且依赖演示；收入和利润率未披露；资金远更充足的对手竞争激烈；中国官员和分析师警告泡沫风险，估值可能高于基本面。权衡之后，建议是有条件买入，置信度中等，风险评级高，估值立场为公平——这是一笔非对称赌注：若商业化被证明，回报可观；风险也仍可监控。置信度之所以只是中等，正因为定性逻辑强，但缺少定量验证。
