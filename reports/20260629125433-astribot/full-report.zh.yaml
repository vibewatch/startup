      - number: '8.4'
        title: 退出准备度、触发点与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              退出准备度取决于商业化是否已经跑通。可行路径包括国内 IPO——Unitree
              的动作已经给中国人形机器人龙头发出信号——或战略收购；两条路都需要公司证明可靠、自治、软件含量高的部署可以规模化落地，这也是关键上行驱动。需要监控的论点失效触发点包括：自治能力未能跃迁、出现
              down-round、失去 Seer
              渠道、遭遇出口管制阻断，其中多项不完全由公司控制。若要从有条件买入推进到高确信度持仓，优先尽调问题是：管理账（收入、毛利、烧钱速度）、股权结构和轮次条款以测算稀释和优先权、用于验证核心差异化的独立自治基准，以及现场可靠性数据和具名的非
              Seer 客户。在这些问题回答前，Astribot 仍是一笔有吸引力但未被充分证明的不对称押注：差异化和动能真实，按板块定价公平，风险高但可监控——因此评级为买入，置信度中等。
