  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局
        blocks:
          - type: paragraph
            body: >-
              Astribot 参与的是本十年最拥挤、资本最密集的技术竞赛之一。人形机器人赛道已开始围绕 Unitree 和 AgiBot 呈现中国双寡头动态，但更广的格局还包括国内的
              UBTech、Galbot、XPeng、Leju 等，以及美国领先者 Figure、Apptronik、Tesla 的 Optimus 项目和 1X。中国在 2026 年控制全球人形机器人出货约 80%，给包括
              Astribot 在内的本土玩家带来供应链和迭代速度优势；美国竞争者估值通常高得多。直接同行是其他通用人形机器人制造商；相邻竞争者包括协作机械臂和 AMR
              厂商；最终替代品仍是人力加固定自动化。在这组玩家中，Astribot 是中等估值挑战者——资本规模远低于 Figure 和 Apptronik，但在中国同行里具备可信度——并且执行很快，约两年内从 S1
              病毒式演示推进到有定价的商用 T1。
