              capex
              执行风险；对电机、谐波减速器、传感器和计算的依赖，也让公司承受整个人形机器人行业共享的供应链和零部件成本压力。机队软件或模型故障可能导致部署同步停摆。这些运营风险还被激烈竞争放大：Unitree、AgiBot、Figure、Apptronik
              等资金充足的国内外对手加剧了竞争和价格压力。这些项目的缓释成熟度整体偏低；在独立基准和可靠性数据出现前，自治与制造爬坡的剩余执行风险很高。
