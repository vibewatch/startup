        blocks:
          - type: paragraph
            body: >-
              Astribot 的产品线围绕两款机器人及其底层技术展开。2024 年走红的 S1 是研究和演示平台，以快速、顺滑的双手操作见长——双 7-DOF 手臂末端速度最高约 10 m/s，每臂载荷约 1.5
              kg，公开称重复定位精度达亚毫米级（约 ±0.1 mm）。2026 年 5 月，公司发布面向商业化的 T1：身高 1.55 m、体重 66 kg、23 个自由度，激进定价 89,900
              RMB。从客户角度，这些机器人瞄准今天需要人手完成的工作——灵巧抓取放置、装配辅助、分拣和物流，以及服务或展示角色——用灵活双手操作替代人工或刚性固定自动化。T1 将 S1
              的经验产品化，以部分峰值性能换取可制造性和低价格；23 个自由度体现的是操作优先、成本敏感的设计，而不是追求最大化全身关节数量。
