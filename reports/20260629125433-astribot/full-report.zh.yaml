            body: >-
              Astribot 2026 年 6 月完成的 B 轮融资超过 10 亿元人民币，估值超过 100 亿元人民币（约
              $1.4B），正式进入独角兽行列。这个估值水平下，入场纪律并不容易把握：公司未披露收入，定价更多靠叙事和可比公司，而不是现金流；轮次结构、优先权和稀释压力也未公开——这是真实影响下行保护的重要条款缺口。可比公司横跨已上市
              IPO 代理标的（Unitree，目标估值约 $7B，2025 年收入 17.08 亿元人民币、增长约 335%）、大型美国未上市公司（Figure 融资约 $1B 后估值约 $39B；Apptronik 融资约
              $520M 后估值约 $5B），以及中国具身智能同业（Galbot 融资约 $363M 后估值约 $3B；AgiBot 资金充足，目标约 10,000 台）。放在这组区间里，Astribot 约 $1.4B
              的估值处在中档——按差异化和进展看算合理，按已披露财务看则偏贵。包括上市战略方 Kede Education（SZSE 300192）在内的头部投资人提升了可信度；Kede Education 通过 cninfo
              披露，也提供了受监管申报的参照点。国内供应链和政策同向，则给 Astribot 在中国提供了相对价值优势。
