companyProfile:
  summary: >-
    Astribot（星尘智能，Stardust Intelligence）是一家总部位于深圳的人形机器人公司，由赖杰于 2022 年 12 月创立。赖杰曾是 Tencent Robotics X 首位员工兼首席架构师，也曾负责
    Baidu Xiaodu Robot。公司开发绳驱 AI 人形机器人，已推出 2024 年走红的 S1 研究平台，并在 2026 年 5 月发布售价 89,900 RMB 的商用 T1。2026 年 6 月，公司完成超过 1
    billion RMB 的 B 轮融资，估值超过 10 billion RMB（约 1.4 billion US dollars），由 Ant Group
    等战略投资方支持，并由此跻身独角兽。核心尽调限制在于不透明：收入、毛利率、烧钱速度、资金续航期、轮次条款和独立自治基准均未披露。
