            body: >-
              用情景框架看结果，不对称性更清楚。乐观情景（概率约 25%）下，自治能力泛化，T1 放量到数万台，软件附加率拉高利润率，3–5 年周期内有望带来多倍回报。基准情景（约 45%）下，公司借助 Seer
              和国内买方稳步放量，估值随板块上行，但自治仍停留在半监督状态。悲观情景（约 30%）下，自治进展卡住，竞争压低价格，融资周期降温后出现
              down-round，意味着显著亏损。估值对自治进展、出货量、毛利率和板块倍数最敏感——其中自治既是最大摆动因子，也是最未被验证的假设。由于公司未披露收入和毛利率，无法用倍数法计算估值，只能依赖叙事型可比公司；若板块高倍数在下行周期收缩，未上市估值标记也会承压。该头寸在
              IPO 或二级转让前也缺乏流动性，实际持有周期会被拉长。
            claimRefs:
