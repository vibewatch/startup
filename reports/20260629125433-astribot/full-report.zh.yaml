              除了原始能力和资本，人形机器人竞赛最终会由市场进入执行决定，而这里各家公司路径不同。竞争者混合三类动作：直接向工厂和物流运营方做企业销售；通过集成商和渠道合作，把机器人嵌入既有自动化；以及用研究或开发者采用培育未来商业需求。Astribot
              三者都做，但更依赖 Seer 集成商合作获取物流分销，也借 S1 的病毒式传播获取开发者心智；Unitree 靠规模和价格冲低端，Figure 和 Apptronik
