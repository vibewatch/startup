            body: >-
              真正的弱点，是信任、可靠性和真实自治的证据。整个行业在非结构化环境中的通用可靠自治仍未被验证，独立评测者也提醒，病毒式演示可能夸大真实世界通用能力；许多亮眼结果依赖遥操作或脚本。进一步看，绳驱机构在规模部署中的现场可靠性、uptime
              和平均故障间隔未公开记录；T1 没有可用的公开安全认证（如 CE 或 ISO）；规模化质量或缺陷指标也未披露。可将 Astribot 自治能力与同行比较的独立标准化基准很少，限制了验证。因此，产品 /
              技术结论是强但未证：执行机构和灵巧性故事差异化且工程可信，迈向规模也是真实的；但通用性、可靠性和合规证据缺失。优先尽调问题是独立自治基准、现场可靠性和 MTBF
              数据，以及安全和质量认证状态；缺少这些，差异化硬件故事还不能被承销为可规模化的可靠商业产品。
