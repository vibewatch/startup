              这款产品最好理解为一个 stack。底层是 Astribot 的定义性差异化：绳 / 索驱（腱）执行系统把电机从关节处移开，降低惯量，带来 S1 出名的高速和类人灵巧性。执行硬件之上，DuoCore
              架构把全身控制核心——协调手臂、躯干和移动——与学习和决策核心配对；摄像头和传感器融合提供感知输入。操作技能通过遥操作示范上的模仿学习和强化学习获得，这一方法见于公司公开研究（arXiv
