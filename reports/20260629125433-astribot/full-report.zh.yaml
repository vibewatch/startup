      - number: '2.2'
        title: 多重视角下的市场规模
        blocks:
          - type: paragraph
            body: >-
              判断机会规模不能只看一个表面数字，而要多重交叉。最上层，通用人形机器人的长期 TAM 被广泛预测会在未来几十年达到数千亿美元，但这类数字置信度低。更近处，与 Astribot 最相关的服务可得市场是 2026
              年的中国：Morgan Stanley 将预测上调至约 50,000 台，接近此前估计的两倍，意味着约 2 billion US dollars 量级市场；TrendForce 预计当年产出增长约
              94%。Astribot 今天可获得份额仍小：以已报道的千台级累计交付对比 50,000 台市场，渗透率为低个位数；89,900 RMB 的 T1
              价格是扩大触达的主要杠杆。不同分析师和方法之间估计差异很大，Astribot 精确用例的自下而上 TAM/SAM 也未公开，因此这里的规模测算是三角校准区间，不是预测。
