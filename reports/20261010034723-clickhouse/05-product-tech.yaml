  - id: TE002
    title: Workflow / use-case table
    columns:
      - User Job / Objective
      - Legacy / Alternative Workflow
      - ClickHouse Solution
      - Measurable Benefit
      - Technical Limitation
    rows:
      - - Real-time telemetry and ad-hoc log exploration
        - Row-oriented RDBMS or Elasticsearch clusters with heavy index overhead
        - ClickHouse MergeTree with columnar compression and sparse primary index
        - Sub-second scan queries across billions of rows with 3x to 5x storage compression
        - Single-row point mutations cause significant write amplification and merge overhead
      - - User-facing analytics and real-time dashboarding
        - Pre-aggregated data marts or batch-computed caching layers
        - Direct ad-hoc SQL execution over raw streaming event tables
        - Eliminates batch pre-aggregation pipelines and reduces data latency to milliseconds
        - Complex multi-table distributed joins require extensive memory and manual co-location
      - - LLM application tracing and evaluation
        - Fragmented third-party observability SaaS tools or disconnected vector stores
        - Langfuse platform backed by ClickHouse columnar analytical storage
        - Unified end-to-end trace analytics and evaluation at petabyte event scale
        - Integration of LLM traces with core database schemas is in early adoption stages
      - - Operational database analytics offloading
        - ETL pipelines extracting transactional data into remote data lakes
        - ClickHouse for PostgreSQL co-processing analytics alongside transactional data
        - Zero-ETL real-time query offloading directly against operational databases
        - Does not provide full transactional ACID semantics for operational write paths
    notes: Performance benefits reflect columnar vectorized execution over structured analytical workloads; transactional and mutation workloads remain constrained.
    claimRefs:
      - CE006
      - CE009
      - CE010
      - CE013
      - CE014
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Architectural Layer
      - Role & Functional Responsibility
      - Underlying Technology / Dependency
      - Operating & Scaling Risk
    rows:
      - - Client Connectivity & Ingestion
        - Accepts queries and streaming batch ingest via native wire, HTTP REST, MySQL/Postgres protocols
        - Statically-linked C++ networking stack, Kafka/Pulsar streaming connectors
        - Connection pool exhaustion under bursty unpooled client traffic
      - - Query Parser & Execution Engine
        - Parses SQL, performs AST optimization, and executes vectorized processing over column chunks
        - Vectorized query engine leveraging CPU caches and SIMD instruction sets
        - Out-of-memory query failures on wide unpartitioned joins or high cardinality GROUP BY
      - - Storage Engine & Partitioning
        - Organizes columnar parts on disk with sparse primary indexes (8,192-row granules)
        - MergeTree engine family with LZ4/ZSTD compression and background part merges
        - Write amplification and filesystem I/O thrashing during frequent small batch inserts
      - - Cloud Decoupled Storage & Consensus
        - Decouples stateless compute nodes from persistent cloud object storage
        - Shared cloud object stores (S3/GCS/Azure Blob) coordinated via ClickHouse Keeper
        - Shared storage metadata latency and tail-latency variance across multi-cloud regions
    notes: Architectural roles reflect the ClickHouse VLDB 2024 academic architecture and ClickHouse Cloud decoupled storage models.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE007
      - CE008
      - CE011
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: ClickHouse multi-layer technical architecture spanning ingestion protocols, vectorized compute, MergeTree storage, and cloud decoupling.
    data:
      layers:
        - label: Client Ingestion & Protocol Interfaces
          detail: Native TCP wire protocol, HTTP REST API, MySQL and PostgreSQL compatibility wire protocols, and streaming ingest connectors (Kafka, Pulsar).
          modules:
            - Native Binary TCP Protocol
            - HTTP REST Interface
            - MySQL / PostgreSQL Wire Protocols
            - Streaming Connectors (Kafka, Object Storage)
        - label: Query Processing & Optimization Layer
          detail: SQL parsing, abstract syntax tree (AST) generation, rule-based and cost-based query optimization, and logical plan transformation.
          modules:
            - SQL Parser & AST Builder
            - Logical & Physical Query Optimizer
            - Distributed Query Coordinator
        - label: Vectorized Compute Execution Engine
          detail: Column-oriented vectorized execution processing data in blocks, optimizing CPU instruction pipelines and hardware SIMD registers.
          modules:
            - Vectorized Operator Pipeline
            - SIMD-accelerated Expressions
            - Multi-threaded Worker Execution
        - label: MergeTree Columnar Storage Engine
          detail: Physical columnar storage format organized in immutable parts, sparse primary indexes with 8,192-row granules, and background asynchronous compaction.
          modules:
            - MergeTree Engine Core
            - Sparse Primary Indexing
            - LZ4 / ZSTD Columnar Compression
            - Asynchronous Background Part Merging
        - label: Cloud Decoupled Storage & Metadata Tier
          detail: Stateless compute worker decoupling over shared object storage (S3, GCS, Azure Blob) coordinated by ClickHouse Keeper for distributed consensus.
          modules:
            - Shared Object Storage Abstraction
            - ClickHouse Keeper (Raft Consensus)
            - Local NVMe Cache & Prefetching
        - label: Security, Compliance & Multi-Tenant Management Tier
          detail: Role-based access control (RBAC), TLS encryption, query quotas, resource governances, and continuous cluster monitoring telemetry.
          modules:
            - Role-Based Access Control (RBAC)
            - TLS/mTLS Network Encryption
            - Query Resource Quotas & Limits
            - Audit Logging & System Telemetry
    approximationNotes: null
    claimRefs:
