      - CE011
      - CE012
callouts:
  - calloutType: strength
    title: Vectorized SIMD Engine Delivers Unmatched Real-Time Scan Performance
    body: By processing data column-by-column in vectorized chunks and utilizing SIMD instructions, ClickHouse scans billions of records in sub-second latencies with 3x to 5x data compression over row-oriented databases.
    claimRefs:
      - CE003
      - CE006
  - calloutType: risk
    title: Asynchronous Part Merges Impose High Write Amplification on Point Updates
    body: ClickHouse is strictly optimized for immutable batch ingestion; high-frequency individual row updates or mutations trigger asynchronous background rewrites of entire parts, causing disk thrashing and memory exhaustion.
    claimRefs:
      - CE013
      - CE014
