evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited breakdown of cohort-level net retention rates, customer acquisition costs, and GAAP gross margin across
      ClickHouse Cloud.
    whyItMatters: >-
      High top-line ARR growth can conceal margin dilution if cloud infrastructure and hosting costs scale faster than
      contracted customer commitments.
    diligencePath: >-
      Request non-GAAP contribution margin tables, customer cohort retention waterfall charts, and cloud hosting margin
      statements during confidential management diligence.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: minor
    topic: cap-table-ownership
    missingEvidence: >-
      Detailed capitalization table showing exact percentage equity ownership, voting rights, and liquidation preference
      stacks.
    whyItMatters: >-
      Understanding exact ownership percentages and liquidation seniority is essential for evaluating downside
      protection and control dynamics across financing rounds.
    diligencePath: >-
      Review the company's verified cap table spreadsheet and certificate of incorporation during formal investment
      committee diligence.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sizing-limitations
    missingEvidence: >-
      Audited financial disclosure of ClickHouse Cloud cohort gross margins, customer acquisition payback periods, and
      infrastructure hosting cost breakdowns.
    whyItMatters: >-
      Without segmented gross margin and cohort-level retention economics, market sizing models cannot accurately
      forecast long-term commercial operating leverage against hyperscaler-managed database competition.
    diligencePath: >-
      Review future S-1 or pre-IPO regulatory filings, or request confidential investor presentation data detailing
      cloud infrastructure cost of goods sold (COGS).
    relatedQuestionRefs:
      - QM009
  - type: missing-source
    severity: minor
    topic: market-sizing
    missingEvidence: >-
      Independent analyst report isolating dollar TAM and 5-year CAGR specifically for real-time columnar OLAP engines
      distinct from general data warehousing.
    whyItMatters: >-
      Broad big-data category estimates aggregate batch data lakes and transactional systems, obscuring the precise
      serviceable market expansion for sub-second analytical databases.
    diligencePath: >-
      Engage Gartner, IDC, or Forrester research coverage on real-time database management systems and specialized event
      observability infrastructure.
    relatedQuestionRefs:
      - QM009
  - type: missing-source
    severity: material
    topic: competitive-win-loss-rates
    missingEvidence: >-
      Audited enterprise win-loss data and migration statistics comparing ClickHouse Cloud directly against Snowflake
      and BigQuery deployments.
    whyItMatters: >-
      Without independent enterprise win-loss tracking, the precise customer substitution rate between centralized cloud
      warehouses and dedicated real-time OLAP engines cannot be empirically quantified.
    diligencePath: >-
      Request customer migration case studies and reference accounts from enterprise sales leadership detailing prior
      database architecture and displacement drivers.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: retention-and-margin-underwriting
    missingEvidence: >-
      Audited cohort-level net revenue retention (NRR), gross customer churn, and gross margin percentage breakdowns
      between serverless and BYOC deployments.
    whyItMatters: >-
      Without verified net expansion and cloud hosting COGS, an underwriter cannot model long-term terminal operating
      margins or evaluate whether 250%+ ARR growth is driven by organic customer expansion or heavy new-logo acquisition
      spend.
    diligencePath: >-
      Request audited GAAP/IFRS financials, revenue recognition schedules, cloud infrastructure provider bills, and
      customer retention cohort curves in confidential diligence.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: multi-tenant-isolation
    missingEvidence: >-
      Audited multi-tenant noisy-neighbor isolation benchmarks and p99 tail-latency SLA guarantees for ClickHouse Cloud
      under shared storage contention.
    whyItMatters: >-
      Enterprise buyers and underwriting diligence require empirical proof that concurrent large analytical scans do not
      degrade production ingestion or query SLAs.
    diligencePath: >-
      Request confidential SOC 2 Type II reports, private-cloud benchmark suites, and customer tenant-isolation SLA
      agreements under NDA.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: minor
    topic: mutation-overhead-benchmarks
    missingEvidence: >-
      Standardized independent benchmark data quantifying write amplification and merge latency when applying frequent
      lightweight updates in production MergeTree clusters.
    whyItMatters: >-
      Assessing total cost of ownership for mixed analytical and transactional workloads requires transparent data part
      merge overhead metrics.
    diligencePath: >-
      Review vendor-provided performance engineering benchmarks and run synthetic update-heavy stress tests on reference
      hardware.
  - type: missing-source
    severity: material
    topic: retention-and-churn
    missingEvidence: >-
      Audited cohort net revenue retention (NRR), gross revenue retention (GRR), and logo renewal rates across
      ClickHouse Cloud subscription tiers.
    whyItMatters: >-
      Without cohort retention disclosures, investors cannot assess whether rapid ARR growth is driven by efficient
      expansion of retained accounts or masked customer churn.
    diligencePath: >-
      Request audited cohort expansion schedules, net retention trends, and customer gross churn data during formal
      management diligence.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Disclosed percentage of annual recurring revenue contributed by ClickHouse's top 10 and top 20 customer accounts.
    whyItMatters: >-
      High customer concentration among early AI infrastructure adopters like Anthropic could introduce revenue
