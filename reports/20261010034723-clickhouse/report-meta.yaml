companyProfile:
  summary: >-
    ClickHouse is a Delaware-incorporated private database company commercializing an open-source columnar analytics
    engine through ClickHouse Cloud and adjacent enterprise services. The business pairs a broad developer adoption
    funnel with managed cloud, BYOC, and support offerings aimed at analytics, observability, and AI infrastructure
    teams.
