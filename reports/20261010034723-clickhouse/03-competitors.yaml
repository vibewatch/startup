callouts:
  - calloutType: "insight"
    title: "Net-New Workloads vs Warehouse Displacement"
    body: "ClickHouse rarely displaces Snowflake or BigQuery as the centralized corporate data warehouse of record. Instead, ClickHouse predominantly wins net-new real-time workloads—such as user-facing analytics, API-driven customer dashboards, observability telemetry, and AI agent evaluation—where sub-second query performance and aggressive compression deliver significant cost efficiencies over traditional cloud warehouse pricing models."
    claimRefs:
      - "CP001"
      - "CP013"
      - "CP015"
  - calloutType: "risk"
    title: "Architectural Boundary in Point Lookups and Transactional Integrity"
    body: "Engineering teams evaluating ClickHouse must recognize that its sparse indexing and MergeTree architecture are fundamentally unsuited for OLTP workloads requiring ACID guarantees or single-record point lookups. Misapplying ClickHouse to transactional schemas inevitably creates maintenance overhead around asynchronous mutations, non-standard joins, and data deduplication."
    claimRefs:
      - "CP004"
      - "CP005"
      - "CP014"
