      - number: '2.4'
        title: 增长催化剂、采用约束与尽调现实
        blocks:
          - type: paragraph
            body: >-
              ClickHouse 的市场扩张由现代应用架构的结构性变化推动：机器生成遥测数据呈指数增长，实时面向用户的分析兴起，能够高频生成分析查询的自主 AI
              智能体出现。不过，采用约束和尽调现实会压低扩张速度。首先，企业账户渗透要面对 Databricks、Azure Databricks 和 Microsoft Azure Synapse
              等传统云平台；它们合计占已跟踪类别市场份额的 44% 以上，并受益于与企业签订的云厂商承诺协议。其次，虽然开源社区采用广泛，但 38% 的受访企业用户表示传统 BI 工具无法充分发挥 ClickHouse
              的列式执行引擎，需要专门工具或定制工程，这会拖慢非技术用户实现价值的速度。最后，ClickHouse Cloud
              的长期单位经济仍存在关键尽调缺口：群组毛利率、客户获取回收指标以及高管评论之外的净收入留存持久性，均未得到经审计的公开财务披露验证。
            claimRefs:
              - CM001
              - CM005
              - CM008
              - CM013
              - CM014
