  - id: FE001
    title: 产品架构图
    type: stack
    summary: ClickHouse 多层技术架构覆盖采集协议、向量化计算、MergeTree 存储和云端解耦。
    data:
      layers:
        - label: 客户端采集与协议接口
          detail: 原生 TCP 线协议、HTTP REST API、MySQL 和 PostgreSQL 兼容线协议，以及流式采集连接器（Kafka、Pulsar）。
          modules:
            - 原生二进制 TCP 协议
            - HTTP REST 接口
            - MySQL / PostgreSQL 线协议
            - 流式连接器（Kafka、对象存储）
        - label: 查询处理与优化层
          detail: SQL 解析、抽象语法树（AST）生成、基于规则和基于成本的查询优化，以及逻辑计划转换。
          modules:
            - SQL 解析器与 AST 构建器
            - 逻辑与物理查询优化器
            - 分布式查询协调器
        - label: 向量化计算执行引擎
          detail: 面向列的向量化执行按数据块处理数据，优化 CPU 指令流水线和硬件 SIMD 寄存器。
          modules:
            - 向量化算子流水线
            - SIMD 加速表达式
            - 多线程工作线程执行
        - label: MergeTree 列式存储引擎
          detail: 物理列式存储格式按不可变分片组织，配备 8,192 行粒度的稀疏主索引和后台异步压缩。
          modules:
            - MergeTree 引擎核心
            - 稀疏主索引
            - LZ4 / ZSTD 列式压缩
            - 后台异步分片合并
        - label: 云端解耦存储与元数据层
          detail: 无状态计算工作节点在共享对象存储（S3、GCS、Azure Blob）之上解耦，由 ClickHouse Keeper 协调分布式共识。
          modules:
            - 共享对象存储抽象层
            - ClickHouse Keeper（Raft 共识）
            - 本地 NVMe 缓存与预取
        - label: 安全、合规与多租户管理层
          detail: 基于角色的访问控制（RBAC）、TLS 加密、查询配额、资源治理和持续集群监控遥测。
          modules:
            - 基于角色的访问控制（RBAC）
            - TLS/mTLS 网络加密
            - 查询资源配额与限制
            - 审计日志与系统遥测
    approximationNotes: null
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE007
      - CE011
      - CE012
