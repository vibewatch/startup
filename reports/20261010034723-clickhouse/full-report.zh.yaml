      - number: '3.3'
        title: 架构取舍、护城河持久性与反向证据
        blocks:
          - type: paragraph
            body: >-
              将 ClickHouse 与替代平台比较，可以看到决定客户留存和工作负载扩张的结构性限制。第一，ClickHouse 的设计严格优先保障 OLAP 扫描效率，而非在线事务处理（OLTP）能力。平台不提供完整的
              ACID 事务保证、行级锁定，也不擅长任意单条记录的更新和删除。ClickHouse 虽支持后台 Mutations 和 Lightweight
              Deletes，但变更是异步、非原子且资源密集型的，后台合并时必须重写整个数据分片。第二，相比 PostgreSQL 或 MySQL 等行式事务数据库，单主键记录的点查询仍效率低下，因为 ClickHouse
              依赖稀疏索引，定位的是包含 8,192 行的粒度，而非单条记录。第三，分布式多表连接是公认的性能瓶颈；要获得最佳执行效果，摄取前需把关系型模式反规范化或摊平为宽表，这会增加外部管道复杂度。第四，自管
              ClickHouse 集群需要较强的运营能力，尤其是对分片 MergeTree 节点进行数据再平衡，以及通过 ClickHouse Keeper 或 ZooKeeper 管理共识状态。ClickHouse
              Cloud 虽然减轻了基础设施管理负担，并能在主要超大规模云厂商上自动扩展，但厂商锁定和专有云管理层会让开源纯粹主义者感到受限。此外，Snowflake 和 Google BigQuery
              等企业巨头拥有根深蒂固的采购协议、广泛的合作伙伴生态和集成式合规框架；ClickHouse 若要从部门级可观测性与遥测部署进入核心企业数据仓库支出，就会遇到强大的分销壁垒。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP012
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP012
              - CP014
              - CP015
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 新增工作负载与仓库替代
            body: >-
              ClickHouse 很少会取代 Snowflake 或 BigQuery，成为企业中央数据仓库的正式记录库。相反，ClickHouse 主要赢得新增的实时工作负载——如面向用户的分析、API
              驱动的客户仪表盘、可观测性遥测和 AI 智能体评估——这些场景中，亚秒级查询性能和激进压缩相较传统云数据仓库定价模式能带来显著成本效率。
            calloutType: insight
            claimRefs:
              - CP001
              - CP013
              - CP015
          - type: callout
            title: 点查询与事务完整性的架构边界
            body: >-
              评估 ClickHouse 的工程团队必须认识到，其稀疏索引和 MergeTree 架构根本不适合需要 ACID 保证或单记录点查询的 OLTP 工作负载。将 ClickHouse
              错用于事务模式，必然会因异步变更、非标准连接和数据去重而产生维护负担。
            calloutType: risk
            claimRefs:
              - CP004
              - CP005
              - CP014
