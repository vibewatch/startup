    data:
      items:
        - label: 大数据分析总市场
          value: 48 Competitor Platforms Tracked
          detail: 6sense 技术画像所追踪的广阔市场，其中 Databricks（18.0%）和 Azure Databricks（17.6%）在品类覆盖率上领先。
          tone: neutral
        - label: 生产分析部署
          value: 4,770 ClickHouse Customer Domains
          detail: 6sense 在 2026 年识别出的全球安装量，其中 50.3% 集中在美国。
          tone: positive
        - label: 托管云生产账户
          value: 3,000+ ClickHouse Cloud Customers
          detail: ClickHouse 在 D 轮披露中公布的付费云数据库客户群。
          tone: positive
        - label: AI 基础设施原生工作负载
          value: <12% Revenue Concentration
          detail: 快速增长的 AI 客群，包括 Anthropic、OpenAI 和 Cursor，代表高吞吐事件采集需求。
          tone: warning
        - label: 高吞吐运营集群
          value: 1B+ Events/sec Scale Tier
          detail: 以 Tesla Comet 和 Mercado Libre 可观测性为代表的超大规模企业安装。
          tone: positive
        - label: 核心变现 ARR 覆盖面
          value: $350M+ Run-Rate ARR
          detail: 管理层在 2026 年披露的商业数据库收入运行率。
          tone: positive
    approximationNotes: 金字塔层级代表从广泛技术画像到付费云客户和大规模生产集群的运营与市场规模视角；美元金额在披露时代表年化运行率。
