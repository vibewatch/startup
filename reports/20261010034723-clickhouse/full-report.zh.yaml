  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与市场分类
        blocks:
          - type: paragraph
            body: >-
              ClickHouse
              所处的分析数据市场高度分化，包含专用实时在线分析处理（OLAP）引擎、企业云数据仓库和嵌入式执行环境。竞争的核心不是覆盖所有数据库工作负载的正面功能对等，而是不同的性能边界和架构取舍。ClickHouse
              专为在海量扁平或反规范化数据集上进行高吞吐分析查询而设计，利用向量化 MergeTree 存储引擎，在数十亿条记录上执行亚秒级扫描。因此，替代方案分为五类：云数据仓库（Snowflake、Google
              BigQuery、Databricks SQL、Amazon Redshift）、实时流式 OLAP 系统（Apache Druid、Apache
              Pinot）、传统事务关系型引擎（PostgreSQL、MySQL）、专用时序平台（TimescaleDB）和嵌入式分析引擎（DuckDB）。传统企业数据仓库擅长复杂多表连接、临时商业智能、治理和集中式存储计算分离，但在高并发实时事件摄取下往往延迟更高、计算成本更高。相反，Druid
              和 Pinot 等流式 OLAP 竞品专注于从 Kafka 等消息总线低延迟摄取，但过去需要复杂的多节点分布式微服务架构。与此同时，DuckDB
              等单节点和边缘分析引擎越来越多地承接开发者工作站和本地管道的工作负载，省去了分布式开销。
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP011
      - number: '3.2'
        title: 竞争者画像与核心差异
        blocks:
          - type: paragraph
            body: >-
              在企业部署中，ClickHouse 面对的主要竞争者取决于架构层级和部署模式。在企业云数据仓库层，Snowflake 是最主要的全托管替代方案。Snowflake
              采用多集群共享数据架构，将计算仓库与中央对象存储完全解耦，提供自动弹性扩展、稳健的工作负载隔离和顺畅的数据共享。该无服务器模式大幅降低企业数据团队的运维负担，因此在运营简洁性比亚秒级延迟更重要的集中式
              BI、高管报告和跨职能企业数据汇总场景中，Snowflake 成为默认选择。Databricks 以统一 Lakehouse 架构挑战 ClickHouse，在开放的 Apache Parquet 和 Delta
              Lake 存储格式之上结合 Spark 与 Photon 执行引擎。Databricks 面向希望在单一数据湖上整合端到端数据管道、流式 ETL 和机器学习模型训练的组织，而 ClickHouse
              专注于分析服务和可观测性。在实时事件分析领域，Apache Druid 和 Apache Pinot
              是直接的架构类比，优化不可变事件流索引和实时仪表盘生成。两者都使用带位图索引的分段列式存储，但管理分布式协调器、代理和历史节点需要较强的运营能力。在开发者一端，DuckDB
              已成为本地、单服务器和嵌入式分析工作流的替代方案，在应用进程内部直接执行向量化查询，不需要外部守护进程管理或网络延迟。
            claimRefs:
              - CP002
              - CP003
              - CP009
              - CP010
              - CP011
