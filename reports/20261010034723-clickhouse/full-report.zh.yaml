        title: 可触达市场规模与渗透视角
        blocks:
          - type: paragraph
            body: >-
              估算 ClickHouse 的总可触达市场需要同时看运营和经济维度，因为独立分析机构不会单独发布纯实时列式数据库引擎的收入。按广义技术画像口径，6sense 统计 ClickHouse 在 2026 年覆盖全球
              4,770 个客户域名，估计市场份额为 2.83%，在更广义的大数据分析类别中排名 #10。按地域看，采用高度集中于北美：美国占已识别全球部署的 1,625 个客户域名或
              50.34%，其次是印度（13.69%）和英国（7.78%）。按商业变现口径，ClickHouse Cloud 快速扩张，付费商业账户从 2025 年 5 月的超过 2,000 个增至 2026 年 1 月的超过
              3,000 个，同时商业 ARR 超过 $350 million，按同比口径增长 250%。按开源口径，全球调查显示 72% 的部署会将外部可视化层连接到
              ClickHouse，说明可触达市场既包括底层基础设施存储引擎，也包括更广泛的分析查询服务生态。
