  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 将运营验证点、产品扩张、估值倍数与下行风险串联起来，推导出继续跟踪的建议。
    data:
      nodes:
        - id: node-scale
          label: 运营规模
          description: ClickHouse Cloud 已有超过 3,000 个客户，ARR 同比增长 >250%，并获得标杆企业采用。
          tone: positive
        - id: node-expansion
          label: AI 平台扩张
          description: 收购 Langfuse 布局 LLM 可观测性，并与 Ubicloud 推出原生 Postgres 服务。
          tone: positive
        - id: node-valuation
          label: 极高估值倍数
          description: D 轮估值 $15B，按已记录收入 $160M 计算，对应 93.8x 收入倍数。
          tone: critical
        - id: node-comps
          label: 与公开市场可比公司的脱节
          description: 公开市场龙头 Datadog、Dynatrace 和 Elastic 的交易倍数为收入的 5x 至 24x，意味着估值大幅压缩风险严重。
          tone: critical
        - id: node-illiquidity
          label: 私募市场流动性不足
          description: 二级市场股份存在结构性流动性不足，没有有保障的退出时间表，并且面临全部损失风险。
          tone: warning
        - id: node-recommendation
          label: 投资建议：跟踪
          description: 出色的运营和强劲的产品需求被过高估值抵消；等待估值倍数重置或利润率变得明朗。
          tone: neutral
      edges:
        - from: node-scale
          to: node-expansion
          label: 促成
        - from: node-expansion
          to: node-valuation
          label: 已计入定价
        - from: node-valuation
          to: node-comps
          label: 对比
        - from: node-comps
          to: node-illiquidity
          label: 叠加加剧
        - from: node-illiquidity
          to: node-recommendation
          label: 决定
    approximationNotes: null
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV014
