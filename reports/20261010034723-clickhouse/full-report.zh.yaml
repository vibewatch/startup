  - id: FP001
    title: 竞争定位：运营负担与实时分析延迟
    type: quadrant
    summary: 按序映射分析平台，比较运营管理负担与实时亚秒级查询性能。
    data:
      xAxis: 运营负担（低至高）
      yAxis: 实时查询延迟（批处理至亚秒级）
      points:
        - label: ClickHouse Cloud
          x: 4
          'y': 9
          quadrant: top-left
          notes: Fully managed cloud delivery with sub-second query latency on billion-row datasets.
        - label: ClickHouse OSS
          x: 8
          'y': 9
          quadrant: top-right
          notes: High operational complexity managing sharded clusters, delivering industry-leading raw scan speed.
        - label: Snowflake
          x: 2
          'y': 5
          quadrant: bottom-left
          notes: Minimal operational overhead with serverless compute, but higher latency on continuous streaming queries.
        - label: Google BigQuery
          x: 2
          'y': 4
          quadrant: bottom-left
          notes: Serverless managed model optimized for ad-hoc batch SQL rather than high-frequency real-time serving.
        - label: Apache Druid（OSS）
          x: 9
          'y': 8
          quadrant: top-right
          notes: >-
            Excellent low-latency event indexing, but requires maintaining complex multi-daemon distributed
            architecture.
        - label: DuckDB
          x: 1
          'y': 7
          quadrant: top-left
          notes: Zero operational footprint embedded in application memory, bound by single-node compute limits.
    approximationNotes: 坐标依据架构要求和基准延迟画像进行标准化序位定位，并非实测毫秒级遥测数据。
    claimRefs:
