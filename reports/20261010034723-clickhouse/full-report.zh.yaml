              ClickHouse 广泛部署于 Anthropic、OpenAI、Harvey 和 Decagon 等前沿 AI 开发者，用于追踪遥测和亚秒级评估查询；但 CEO Aaron Katz 披露，整个 AI
              客户群占商业总收入不到 12%。这种结构性分散降低了 ClickHouse 对应用层波动的暴露，同时让数据库层成为智能体查询量激增的基础受益者。
