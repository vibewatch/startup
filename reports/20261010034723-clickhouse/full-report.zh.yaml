              还提供专用集群和 Bring-Your-Own-Cloud（BYOC）部署模式，面向受监管的企业环境。在 BYOC 模式下，专有控制平面负责编排，数据库集群直接运行在客户管理的虚拟私有云中。其他收入来源包括通过
              ClickPipes 提供的托管流式摄取连接器、原生变更数据捕获同步和企业支持协议，构成多层次商业组合。
