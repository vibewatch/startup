      - number: '1.4'
        title: 商业规模、里程碑轨迹与尽调风险
        blocks:
          - type: paragraph
            body: >-
              从运营表现看，ClickHouse 增长势头极强：截至 2026 年 5 月，年化运行率收入超过 $250 million，付费客户组织超过 4,000 家。这一表现反映了企业云的快速采用，以及公司在生成式 AI
              遥测和基础设施日志领域的战略定位与高净扩张率。2026 年 1 月，公司收购 Langfuse，扩大软件组合，把原生 LLM
              应用追踪和评估直接纳入分析生态。不过，尽调仍需重点审视若干风险：列式存储的数据摄取流程可能脆弱且工程负担重；高并发分析查询可能耗尽数据库处理能力；AI 基础设施毛利率承压和早期 AI
              应用切换成本低，也会持续带来风险，需结合私有单位经济数据验证。
