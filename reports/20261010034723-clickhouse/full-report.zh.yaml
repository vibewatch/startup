      - number: '5.2'
        title: 向量化列式架构与云端解耦
        blocks:
          - type: paragraph
            body: >-
              ClickHouse 用 C++ 实现为单一静态链接二进制文件，不依赖强制运行时组件或第三方协调软件。其查询处理架构将 SQL 查询解析为优化的逻辑和物理执行树，借助 SIMD 硬件向量化和 CPU
              缓存局部性评估列块。持久化存储依赖 MergeTree 引擎系列，把数据划分为不可变分片，并使用带 8,192 行粒度的稀疏主索引进行快速范围过滤。在 ClickHouse Cloud
              中，计算执行与持久化存储解耦：无状态工作节点负责查询执行和本地 NVMe 缓存，底层数据集存放在 AWS S3 或 Google Cloud Storage 等共享云对象存储中，由 ClickHouse
              Keeper 协调。
