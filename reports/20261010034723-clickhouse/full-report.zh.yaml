chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与历史基础
        blocks:
          - type: paragraph
            body: >-
              ClickHouse, Inc. 是一家商业化开源基础设施供应商，提供高性能实时分析、数据仓库和可观测性能力。底层技术于 2009 年起源于 Yandex，由 Alexey Milovidov 负责工程，最初为
              Yandex.Metrica 处理 PB 级遥测数据，查询响应时间低于一秒。该技术证明相较传统关系型、行式系统具有巨大性能优势后，核心数据库引擎于 2016 年 6 月以宽松的 Apache 2.0
              开源许可证发布。2021 年 9 月，公司在旧金山湾区成立 ClickHouse, Inc.，成为独立的特拉华州公司，并正式将技术商业化。如今，公司主要通过 ClickHouse Cloud
              变现；这是一项全托管、无服务器数据库服务，面向多租户分析应用和机器学习工作负载。
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
              - CO008
              - CO009
