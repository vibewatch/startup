      - 角色与功能职责
      - 底层技术 / 依赖
      - 运维与扩展风险
    rows:
      - - 客户端连接与摄取
        - 通过原生 wire、HTTP REST、MySQL/Postgres 协议接收查询和流式批量摄取
        - 静态链接 C++ 网络栈、Kafka/Pulsar 流式连接器
        - 未池化客户端流量突发时连接池耗尽
      - - 查询解析器与执行引擎
        - 解析 SQL、执行 AST 优化，并在列块上进行向量化处理
        - 利用 CPU 缓存和 SIMD 指令集的向量化查询引擎
        - 宽表未分区连接或高基数 GROUP BY 可能导致查询因内存不足失败
      - - 存储引擎与分区
        - 将列式数据片段组织在磁盘上，并使用稀疏主索引（每个粒度 8,192 行）
        - 采用 LZ4/ZSTD 压缩和后台数据片段合并的 MergeTree 引擎系列
        - 频繁小批量插入时写放大和文件系统 I/O 抖动
      - - 云解耦存储与共识
        - 将无状态计算节点与持久化云对象存储解耦
        - 共享云对象存储（S3/GCS/Azure Blob）由 ClickHouse Keeper 协调
        - 多云区域间共享存储元数据延迟和尾延迟波动
    notes: 架构角色反映 ClickHouse VLDB 2024 学术架构和 ClickHouse Cloud 解耦存储模型。
