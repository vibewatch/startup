      - number: '1.2'
        title: 高管团队与组织治理
        blocks:
          - type: paragraph
            body: >-
              ClickHouse 的管理团队既有深厚的开源数据库工程背景，也有成熟的企业级市场执行能力。联合创始人兼首席执行官 Aaron Katz 在公司成立时加入，曾在 Salesforce 和 Elastic
              担任高级商业领导职务，拥有丰富的规模化经验。联合创始人兼首席技术官 Alexey Milovidov 继续掌舵技术方向；他创建了原始数据库引擎，并持续负责开源社区贡献和架构创新。联合创始人兼总裁 Yury
              Izrailevsky 负责运营及基础设施扩张，此前曾任 Google 工程副总裁和 Netflix 云系统副总裁。治理由早期投资机构的董事会席位支持，但 Milovidov 的架构主导权和 Katz
              的企业分销策略仍形成明显的关键人依赖。
            claimRefs:
              - CO001
              - CO003
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO003
      - number: '1.3'
        title: 资本结构、融资轮次与所有权
        blocks:
          - type: paragraph
            body: >-
              ClickHouse 已成为数据基础设施领域资本最充裕的公司之一，自 2021 年剥离以来累计获得约 $1.15 billion 的资本承诺。公司于 2021 年 9 月完成由 Benchmark 和 Index
              Ventures 领投的 $50 million Series A，随后在 2021 年 10 月完成由 Coatue Management 和 Altimeter Capital 共同领投的 $250
              million Series B，投后估值 $2 billion。2022 年 12 月，Thrive Capital 领投了一轮未披露金额的 Series B 扩展融资。2025 年 5 月，Khosla
              Ventures 领投 $350 million Series C，同时配套 $100 million 信贷额度，增长进一步加速。最近，公司于 2026 年 1 月完成由 Dragoneer Investment
              Group 领投的 $400 million Series D，估值 $15 billion，从而建立充足现金储备，加速拓展企业人工智能和分析工作负载产品。
