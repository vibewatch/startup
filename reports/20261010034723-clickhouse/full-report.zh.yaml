      - ClickHouse 方案
      - 可量化收益
      - 技术限制
    rows:
      - - 实时遥测和即席日志探索
        - 行式 RDBMS 或 Elasticsearch 集群，索引开销很高
        - 采用列式压缩和稀疏主索引的 ClickHouse MergeTree
        - 可在数十亿行上以亚秒级扫描查询，存储压缩率达 3x 至 5x
        - 单行点变更会造成显著写放大和合并开销
      - - 面向用户的分析和实时仪表盘
        - 预聚合数据集市或批量计算的缓存层
        - 直接在原始流式事件表上执行即席 SQL
        - 省去批量预聚合管道，将数据延迟降至毫秒级
        - 复杂的多表分布式连接需要大量内存和手动共置
      - - LLM 应用追踪和评估
        - 碎片化的第三方可观测性 SaaS 工具或彼此割裂的向量存储
        - 由 ClickHouse 列式分析存储支撑的 Langfuse 平台
        - 在 PB 级事件规模上统一端到端追踪分析和评估
        - LLM 追踪与核心数据库模式的集成仍处于早期采用阶段
      - - 运营数据库分析卸载
        - 将事务数据抽取到远程数据湖的 ETL 管道
        - 用 ClickHouse for PostgreSQL 与事务数据并行处理分析
        - 无需 ETL，直接对运营数据库进行实时查询卸载
        - 无法为运营写入路径提供完整事务 ACID 语义
    notes: 性能收益来自面向结构化分析工作负载的列式向量化执行；事务和变更工作负载仍受限制。
    claimRefs:
      - CE006
      - CE009
      - CE010
      - CE013
      - CE014
  - id: TE003
    title: 技术 / 运营架构表
    columns:
