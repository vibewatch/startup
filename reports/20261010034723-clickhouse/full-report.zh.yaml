        title: 运营约束、多租户与技术尽调缺口
        blocks:
          - type: paragraph
            body: >-
              ClickHouse
              擅长追加型分析扫描，但架构设计也带来明确的运营边界和技术取舍。高频单行更新和变更会产生显著写放大，因为不可变分片必须通过后台合并异步重写。宽型分布式连接和高基数分组还需要大量内存余量；超过内存上限时，查询可能被终止。ClickHouse
              纳入企业安全控制，包括基于角色的访问控制、TLS 网络加密、查询配额和审计日志。不过，针对 ClickHouse Cloud
