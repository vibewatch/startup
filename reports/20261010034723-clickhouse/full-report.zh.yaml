            body: >-
              ClickHouse Cloud 从两个主要维度将基础设施消费变现：计算单元小时数和托管存储容量。公开计算价格从基础开发层级的每计算单元小时 $0.22，到高并发生产工作负载的每计算单元小时
              $0.75；云对象存储按每 TB 每月 $25.30 至 $50.00 计费。与自托管部署进行总拥有成本基准比较，显示潜在客户需要权衡显著的运营取舍。运营自有 ClickHouse
              集群，每月需要为原始云计算、高可用复制存储和协调节点支付 $2,435 至 $30,720，另需占用全职数据库管理员工程能力的 10% 至
