  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与工作负载分类
        blocks:
          - type: paragraph
            body: >-
              ClickHouse
              主要处于实时分析数据库管理系统（OLAP）市场，为跨数十亿行数据、要求亚秒级响应的结构化和半结构化分析查询提供服务。可触达的软件支出包括高性能列式存储引擎、向量化查询执行层、实时流式摄取管道和交互式 API
              服务数据库。传统行式事务数据库（OLTP）和通用 ACID 应用后端明确不属于这一核心边界；不过，ClickHouse 最近与 Ubicloud 推出原生托管 Postgres
              服务，借助变更数据捕获简化事务数据与分析数据同步。与此同时，ClickHouse 通过开源 ClickStack
              框架不断切入相邻的云可观测性和日志分析市场，替代那些处理结构化遥测时计算和存储开销过高的传统搜索技术。收购 Langfuse 后，市场边界还延伸至 AI 可观测性和智能体基础设施，使 ClickHouse
              成为下一代软件系统中 LLM 评估与追踪遥测的底层分析数据平面。
            claimRefs:
              - CM007
              - CM009
              - CM010
