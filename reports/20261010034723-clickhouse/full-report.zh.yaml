        - ARR 按 120% CAGR 增长至 $1.2B；云端毛利率达到 75%；Langfuse 和 Postgres 变现成功
        - ARR：$1,200M；毛利率：75%；NRR：140%
        - 退出倍数：30x ARR；隐含估值：$36.0B
        - MOIC：2.4x；隐含 IRR：3 年约 34%
        - AI 工作负载查询快速增长，企业从 Snowflake 迁移
      - - 基准情景
        - ARR 按 75% CAGR 复合增长至 $650M；毛利率稳定在 68%；云端转化平稳
        - ARR：$650M；毛利率：68%；NRR：125%
        - 退出倍数：22x ARR；隐含估值：$14.3B
        - MOIC：0.95x；隐含 IRR：-2%（保本）
        - 稳定的开源转化抵消倍数从 93.8x 压缩至 22x 的影响
      - - 悲观情景
        - ARR 增长放缓至 40% CAGR，达到 $350M；超大规模云厂商激烈打价格战；毛利率降至 60% 以下
        - ARR：$350M；毛利率：58%；NRR：105%
        - 退出倍数：12x ARR；隐含估值：$4.2B
        - MOIC：0.28x；隐含 IRR：-35%（资本严重受损）
        - 超大规模云厂商的托管产品压低价格，宏观环境下企业软件预算收紧
    notes: 情景建模采用 2026 年入场、3 年投资持有期；退出倍数反映 Multiples.vc 可比公司的正常化公开软件估值。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV012
      - CV013
