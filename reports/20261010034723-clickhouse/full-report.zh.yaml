      - number: '2.3'
        title: 买方画像、工作流与预算归属
        blocks:
          - type: paragraph
            body: >-
              ClickHouse
              的采用者可分为四类买方，体现其架构在开发者主导的开源采用和企业自上而下采购之间的灵活性。主要商业买方通常是工程副总裁、基础设施负责人或首席技术官，他们掌管中央工程算力预算，需要为面向客户的应用或内部分析功能提供亚秒级查询性能。在可观测性场景，经济买方转为站点可靠性工程（SRE）和
              DevOps 负责人，目标是压低来自传统专有供应商、不断上涨的日志存储账单。快速崛起的买方群体还包括 AI 负责人和机器学习工程负责人，他们用 ClickHouse 摄取并分析数百万条智能体追踪和 LLM
              生成日志。在企业账户中，开发者和数据工程师自下而上的采用是主要催化剂：团队先部署开源 ClickHouse Local 或自托管集群，解决紧迫的延迟瓶颈；随后迁移到 ClickHouse
              Cloud，以免去集群运维和基础设施配置的负担。
