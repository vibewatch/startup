  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Corporate Governance Risks
        blocks:
          - type: paragraph
            body: >-
              ClickHouse operates with an open-source core licensed under Apache 2.0, providing broad global
              distribution while avoiding restrictive copyleft obligations. Corporate formation occurred in Delaware in
              September 2021 after originating within Yandex in Russia, supported initially by venture investors
              including Index Ventures and Benchmark Capital. The separation into an independent US entity and Dutch
              subsidiary established clear corporate governance boundaries. Public legal filings and open-source audit
              logs reveal no outstanding patent assertion, trade secret litigation, or structural intellectual property
              disputes threatening the core database engine. Regulatory compliance risks primarily involve cross-border
              data transfer regulations, regional data sovereignty requirements, and SOC 2 / ISO certifications across
              international deployment zones. Furthermore, capital structure covenants associated with the $100 million
              venture debt facility led by Stifel and Goldman Sachs require continuous liquidity monitoring, though
              recent equity financing mitigates covenant strain.
            claimRefs:
