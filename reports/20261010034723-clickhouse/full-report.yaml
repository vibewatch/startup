      - number: '1.2'
        title: Executive Leadership and Organizational Governance
        blocks:
          - type: paragraph
            body: >-
              The executive management team at ClickHouse blends deep open-source database engineering heritage with
              seasoned enterprise go-to-market execution. Co-founder and Chief Executive Officer Aaron Katz joined the
              company at incorporation, bringing extensive scaling experience from senior commercial leadership roles at
              Salesforce and Elastic. The technical vision remains steered by co-founder and Chief Technology Officer
              Alexey Milovidov, who created the original database engine and continues to direct open-source community
              contributions and architectural innovations. Operational and infrastructure scaling is directed by
              co-founder and President Yury Izrailevsky, formerly Vice President of Engineering at Google and Vice
              President of Cloud Systems at Netflix. Governance is supported by institutional board representation from
              foundational backers, while key-person dependencies remain pronounced around Milovidov's architectural
              stewardship and Katz's enterprise distribution strategy.
            claimRefs:
              - CO001
              - CO003
              - CO015
