            title: Disciplined Entry Over Operational FOMO
            body: >-
              While ClickHouse exhibits world-class technical adoption and exceptional ARR acceleration, paying 93.8x
              trailing revenue leaves no room for execution errors or macro multiple contractions. Prospective investors
              should track the company, waiting for multiple normalization or detailed margin disclosures.
            calloutType: recommendation
            claimRefs:
