  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition & Core Analytical Workflows
        blocks:
          - type: paragraph
            body: >-
              ClickHouse delivers high-speed online analytical processing across structured telemetry, logs, metrics,
              and user-facing dashboards. The product portfolio comprises three primary deployment form factors: the
              open-source self-managed ClickHouse database engine, the zero-dependency ClickHouse Local command-line
              tool, and ClickHouse Cloud, a fully managed serverless platform. Across real-time telemetry and ad-hoc
              analytical workflows, ClickHouse replaces traditional row-oriented database bottlenecks by compressing
              columnar data and executing queries directly over raw immutable event streams. This eliminates complex
              batch pre-aggregation pipelines, allowing enterprises to ingest millions of events per second while
              maintaining sub-second query response times across multi-billion-row datasets.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE009
              - CE010
