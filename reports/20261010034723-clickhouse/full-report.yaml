      - number: '2.2'
        title: Addressable Market Sizing and Penetration Lenses
        blocks:
          - type: paragraph
            body: >-
              Estimating the total addressable market for ClickHouse requires evaluating multiple operational and
              economic lenses, as independent analyst firms do not publish isolated revenue figures solely for pure
              real-time columnar database engines. Under a broad technographic lens, 6sense tracks ClickHouse across
              4,770 customer domains globally in 2026, representing an estimated 2.83% market share and a #10 ranking
              within the broader Big Data Analytics category. Geographically, adoption remains heavily concentrated in
              North America, with the United States accounting for 1,625 customer domains or 50.34% of identified global
              deployments, followed by India (13.69%) and the United Kingdom (7.78%). Under a commercial monetization
              lens, ClickHouse Cloud has expanded rapidly, growing paying commercial accounts from over 2,000 in May
              2025 to more than 3,000 customers by January 2026, while driving commercial ARR beyond $350 million on a
              250% year-over-year trajectory. Under an open-source lens, global survey data indicates that 72% of
              deployments connect external visualization layers to ClickHouse, illustrating that the addressable market
              encompasses both the raw infrastructure storage engine and the broader analytical query serving ecosystem.
