      - number: '2.3'
        title: Buyer Personas, Workflow Dynamics, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              Adoption of ClickHouse spans four distinct buyer profiles, reflecting its architectural flexibility across
              developer-led open-source adoption and top-down enterprise platform deals. The primary commercial buyer is
              typically a Vice President of Engineering, Head of Infrastructure, or Chief Technology Officer who
              controls central engineering compute budgets and requires sub-second query performance for customer-facing
              applications or internal analytical features. In observability use cases, the economic buyer shifts to
              Site Reliability Engineering (SRE) and DevOps leadership seeking to curtail escalating log storage bills
              from proprietary incumbent vendors. A rapidly emerging buyer segment comprises Heads of AI and machine
              learning engineering leaders who deploy ClickHouse to ingest and analyze millions of agent traces and LLM
              generation logs. Across enterprise accounts, developer and data engineer bottom-up adoption serves as the
              principal catalyst: teams initially deploy open-source ClickHouse Local or self-hosted clusters to resolve
              urgent latency bottlenecks, subsequently migrating to ClickHouse Cloud to eliminate operational cluster
              management overhead and infrastructure provisioning friction.
