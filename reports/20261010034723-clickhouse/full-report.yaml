      - number: '8.3'
        title: Bull, Base, and Bear Scenario Projections
        blocks:
          - type: paragraph
            body: >
              Evaluating investment outcomes across a three-year holding period requires modeling explicit revenue
              growth rates, margin structures, and exit multiple compression. While third-party estimates from UpMarket
              and Sacra project ClickHouse reaching $250 million in annualized revenue by May 2026, return profiles
              remain heavily dictated by entry discipline and the exit multiple environment.


              In our Bull Case, ClickHouse compounds ARR at 120% annually to $1.2 billion, achieving 75% gross margins
              as AI query volume surges and Langfuse observability cross-sells effectively. Even with multiple
              compression from 93.8x to 30.0x, the company achieves a $36.0 billion valuation (2.4x MOIC, ~34% IRR). In
              our Base Case, ARR grows at 75% CAGR to $650 million with 68% gross margin, but multiple compression to
              22.0x results in a $14.3 billion exit valuation (0.95x MOIC, ~-2% IRR), illustrating complete return
              erosion despite stellar operating growth. Under the Bear Case, ARR deceleration to 40% CAGR ($350 million
              ARR) paired with 12.0x multiple normalization yields a $4.2 billion valuation, causing a 72% capital
              impairment (-35% IRR).
            claimRefs:
              - CV001
