      - number: '8.2'
        title: Current Financing Context and Peer Valuation Multiples
        blocks:
          - type: paragraph
            body: >
              ClickHouse's financing trajectory highlights unprecedented capital availability coupled with accelerating
              valuation expansion. Across its history through 2026, the company has raised over $1.05 billion in
              cumulative equity and debt capital across seven funding transactions. The capital structure expanded in
              May 2025 with a $350 million Series C led by Khosla Ventures at a $6.3 billion valuation alongside a $100
              million credit facility from Stifel and Goldman Sachs, followed less than eight months later by the $400
              million Series D led by Dragoneer at $15 billion.


              This rapid escalation caused ClickHouse's implied revenue multiple to inflate from 63.5x at Series C to
              93.8x at Series D. In contrast, mature public analytics and observability leaders trade at dramatic
              valuation discounts despite proven GAAP profitability or strong free cash flow generation. Public market
              leaders trade across a 1.5x to 24.0x EV/revenue spectrum: Datadog trades at 24.0x, Dynatrace at 8.0x,
              Elastic at 5.1x, and legacy provider Teradata at 1.5x. Even among top-quartile high-growth software
              vendors, a 93.8x multiple prices in near-perfection and leaves private investors highly vulnerable to
              macro re-rating or down-round revisions.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV011
