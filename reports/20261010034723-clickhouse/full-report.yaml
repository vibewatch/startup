  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      ClickHouse multi-layer technical architecture spanning ingestion protocols, vectorized compute, MergeTree storage,
      and cloud decoupling.
    data:
      layers:
        - label: Client Ingestion & Protocol Interfaces
          detail: >-
            Native TCP wire protocol, HTTP REST API, MySQL and PostgreSQL compatibility wire protocols, and streaming
            ingest connectors (Kafka, Pulsar).
          modules:
            - Native Binary TCP Protocol
            - HTTP REST Interface
            - MySQL / PostgreSQL Wire Protocols
            - Streaming Connectors (Kafka, Object Storage)
        - label: Query Processing & Optimization Layer
          detail: >-
            SQL parsing, abstract syntax tree (AST) generation, rule-based and cost-based query optimization, and
            logical plan transformation.
          modules:
            - SQL Parser & AST Builder
            - Logical & Physical Query Optimizer
            - Distributed Query Coordinator
        - label: Vectorized Compute Execution Engine
          detail: >-
            Column-oriented vectorized execution processing data in blocks, optimizing CPU instruction pipelines and
            hardware SIMD registers.
          modules:
            - Vectorized Operator Pipeline
            - SIMD-accelerated Expressions
            - Multi-threaded Worker Execution
        - label: MergeTree Columnar Storage Engine
          detail: >-
            Physical columnar storage format organized in immutable parts, sparse primary indexes with 8,192-row
            granules, and background asynchronous compaction.
          modules:
            - MergeTree Engine Core
            - Sparse Primary Indexing
            - LZ4 / ZSTD Columnar Compression
            - Asynchronous Background Part Merging
        - label: Cloud Decoupled Storage & Metadata Tier
          detail: >-
            Stateless compute worker decoupling over shared object storage (S3, GCS, Azure Blob) coordinated by
            ClickHouse Keeper for distributed consensus.
          modules:
            - Shared Object Storage Abstraction
            - ClickHouse Keeper (Raft Consensus)
            - Local NVMe Cache & Prefetching
        - label: Security, Compliance & Multi-Tenant Management Tier
          detail: >-
            Role-based access control (RBAC), TLS encryption, query quotas, resource governances, and continuous cluster
            monitoring telemetry.
          modules:
            - Role-Based Access Control (RBAC)
            - TLS/mTLS Network Encryption
            - Query Resource Quotas & Limits
            - Audit Logging & System Telemetry
    approximationNotes: null
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE007
      - CE011
