      - number: '5.2'
        title: Vectorized Columnar Architecture & Cloud Decoupling
        blocks:
          - type: paragraph
            body: >-
              ClickHouse is implemented in C++ as a single, statically-linked binary that operates without mandatory
              runtime dependencies or third-party coordination software. Its query processing architecture parses SQL
              queries into optimized logical and physical execution trees that evaluate column chunks using SIMD
              hardware vectorization and CPU cache locality. Persistent storage relies on the MergeTree engine family,
              which partitions data into immutable parts and utilizes sparse primary indexes with 8,192-row granules for
              rapid range filtering. In ClickHouse Cloud, compute execution is decoupled from persistent storage:
              stateless worker nodes handle query execution and local NVMe caching while underlying datasets reside in
              shared cloud object storage like AWS S3 or Google Cloud Storage, coordinated by ClickHouse Keeper.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE007
              - CE008
              - CE011
