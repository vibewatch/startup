  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Stance, and Recommendation
        blocks:
          - type: paragraph
            body: >
              ClickHouse presents one of the most compelling operational growth profiles in modern data infrastructure,
              driven by clear open-source adoption and dramatic cloud acceleration. The core investment thesis rests on
              ClickHouse's column-oriented database architecture delivering up to 100x query speed advantages over
              traditional systems, enabling high-concurrency analytical and AI-agent workloads. Commercial momentum is
              underscored by ClickHouse Cloud serving more than 3,000 customers with ARR expanding over 250 percent year
              over year. Leading technology innovators including Meta, Tesla, and Cursor have deployed the platform at
              enterprise scale.


              However, this exceptional operational performance is fully countered by an aggressive private market
              valuation. ClickHouse's $15 billion Series D financing implies a 93.8x revenue multiple against $160
              million in recorded revenue, far exceeding established public comparables such as Datadog (24.0x) and
              Dynatrace (8.0x). Furthermore, private pre-IPO shares carry inherent secondary illiquidity and capital
              loss risks without audited cohort visibility. Consequently, we issue a clear recommendation of track with
              a high risk rating and stretched valuation stance, advising investors to await multiple normalization or
              comprehensive margin disclosures before committing capital.
            claimRefs:
              - CV001
              - CV003
              - CV005
