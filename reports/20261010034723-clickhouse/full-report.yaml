      - number: '1.3'
        title: Capitalization, Financing Rounds, and Ownership Structure
        blocks:
          - type: paragraph
            body: >-
              ClickHouse has established one of the most well-capitalized balance sheets in the data infrastructure
              landscape, securing approximately $1.15 billion in total capital commitments since its 2021 spin-out. The
              company completed an initial $50 million Series A in September 2021 led by Benchmark and Index Ventures,
              followed rapidly by a $250 million Series B in October 2021 co-led by Coatue Management and Altimeter
              Capital at a $2 billion post-money valuation. In December 2022, Thrive Capital led an undisclosed Series B
              extension. Growth accelerated further in May 2025 with a $350 million Series C led by Khosla Ventures
              alongside a $100 million credit facility. Most recently, in January 2026, ClickHouse closed a $400 million
              Series D financing led by Dragoneer Investment Group at a $15 billion valuation, establishing a
              substantial cash reserve to accelerate product expansion across enterprise artificial intelligence and
              analytics workloads.
