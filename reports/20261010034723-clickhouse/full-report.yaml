  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundaries and Workload Categorization
        blocks:
          - type: paragraph
            body: >-
              ClickHouse operates primarily within the real-time analytical database management system (OLAP) market,
              serving structured and semi-structured analytical queries requiring sub-second response times across
              billions of rows. The addressable software spend covers high-performance columnar storage engines,
              vectorized query execution layers, real-time streaming ingestion pipelines, and interactive API-serving
              databases. Explicitly excluded from this core category boundary is traditional row-oriented transactional
              database spend (OLTP) and general ACID application backends, though ClickHouse has recently introduced a
              native managed Postgres service with Ubicloud to streamline transactional-to-analytical data
              synchronization via change data capture. Additionally, ClickHouse increasingly captures spend in the
              adjacent cloud observability and log analytics market through its open-source ClickStack framework,
              displacing legacy search-oriented technologies that incur severe compute and storage overhead for
              structured telemetry. The market boundary also expands into AI observability and agentic infrastructure
              following the strategic acquisition of Langfuse, establishing ClickHouse as the underlying analytical data
              plane for LLM evaluation and trace telemetry across next-generation software systems.
            claimRefs:
              - CM007
              - CM009
              - CM010
              - CM011
              - CM012
