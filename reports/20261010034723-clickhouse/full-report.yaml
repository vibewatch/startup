chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Historical Foundations
        blocks:
          - type: paragraph
            body: >-
              ClickHouse, Inc. operates as a commercial open-source infrastructure provider delivering high-performance
              real-time analytics, data warehousing, and observability capabilities. The foundational technology began
              inside Yandex in 2009 under the engineering leadership of Alexey Milovidov, originally engineered to
              process petabyte-scale telemetry for Yandex.Metrica with sub-second query response times. After
              demonstrating immense performance advantages over traditional relational and row-oriented systems, the
              core database engine was released under the permissive Apache 2.0 open-source license in June 2016. In
              September 2021, the technology was formally commercialized through the incorporation of ClickHouse, Inc.
              as an independent Delaware corporation headquartered in the San Francisco Bay Area. Today, the company
              monetizes its technology primarily through ClickHouse Cloud, a fully managed, serverless database service
              designed for multi-tenant analytical applications and machine learning workloads.
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
              - CO008
              - CO009
