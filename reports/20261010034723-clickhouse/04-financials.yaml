callouts:
  - calloutType: strength
    title: Substantial Forward Capital Cushion
    body: With $400 million raised in Series D equity in January 2026, over $1 billion in total cumulative funding, and an active $100 million credit facility from Goldman Sachs and Stifel, ClickHouse maintains substantial liquidity to fund global expansion without near-term financing dependency.
    claimRefs:
      - CI003
      - CI008
      - CI013
  - calloutType: risk
    title: High Premium Multiple and Undisclosed Margin Profile
    body: ClickHouse's reported $15 billion private valuation implies an aggressive revenue multiple exceeding 43x forward ARR and over 90x historical deal-date revenue. In the absence of disclosed GAAP gross margins or net revenue retention, investors face significant valuation vulnerability if cloud infrastructure hosting costs compress long-term software economics.
    claimRefs:
      - CI004
      - CI005
      - CI010
      - CI011
