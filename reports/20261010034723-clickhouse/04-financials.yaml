slug: clickhouse
runDate: "2026-10-10"
company:
  name: ClickHouse
chapter:
  number: 4
  title: Financials
  summary: ClickHouse has demonstrated rapid commercial expansion, scaling from a $250 million ARR milestone in May 2026 to an estimated $350 million in August 2026 backed by over 4,000 customers and a $400 million Series D led by Dragoneer at a $15 billion valuation. However, fundamental unit economics including GAAP gross margins and cohort net revenue retention remain undisclosed, presenting material diligence hurdles at its current 40x to 90x revenue multiple.
sections:
  - id: revenue-streams-and-pricing-model
    title: Revenue Streams and Monetization Architecture
    body: ClickHouse commercializes its open-source columnar database technology through ClickHouse Cloud, a fully managed cloud service offered across serverless and dedicated deployment modes on AWS, GCP, and Microsoft Azure. While the core ClickHouse engine remains Apache 2.0 licensed to maintain a broad developer adoption funnel, enterprise revenue is driven by consumption-based billing for active compute units and managed cloud object storage. In addition to multi-tenant serverless clusters that scale down to zero when idle, ClickHouse offers dedicated clusters and a Bring-Your-Own-Cloud (BYOC) deployment model designed for regulated enterprise environments. Under the BYOC model, the proprietary control plane manages orchestration while database clusters run directly inside customer-managed virtual private clouds. Supplementary revenue streams include managed streaming ingestion connectors via ClickPipes, native change-data-capture synchronization, and enterprise support agreements, establishing a multi-tiered commercial portfolio.
    claimRefs:
      - CI001
      - CI002
      - CI014
    tableRefs:
      - TI001
  - id: pricing-mechanics-and-customer-economics
    title: Pricing Mechanics, Packaging, and TCO Tradeoffs
    body: "ClickHouse Cloud monetizes infrastructure consumption through two primary dimensions: compute unit-hours and managed storage volume. Published compute rates range from $0.22 per compute unit-hour for basic development tiers to $0.75 per compute unit-hour for high-concurrency production workloads, while cloud object storage is billed between $25.30 and $50.00 per terabyte-month. Total cost of ownership benchmarking against self-hosted deployments highlights significant operational tradeoffs for prospective customers. Operating an in-house ClickHouse cluster requires $2,435 to $30,720 per month in raw cloud compute, high-availability replication storage, and coordination nodes, alongside 10% to 20% of full-time database administrator engineering capacity. Furthermore, published list pricing pages frequently omit secondary cost drivers such as inter-region data egress, disaster recovery snapshots, and cross-region private networking, requiring rigorous pipeline architecture planning to prevent unexpected billing escalation."
    claimRefs:
      - CI002
      - CI006
      - CI012
    tableRefs:
      - TI002
  - id: unit-economics-and-cost-structure
    title: Unit Economics, Cost Structure, and Margin Drivers
    body: Because ClickHouse Cloud operates atop underlying public hyperscaler infrastructure across AWS, Google Cloud, and Azure, its cost of goods sold (COGS) is predominantly composed of wholesale compute, object storage, and networking bandwidth expenses. While the columnar architecture and vectorized execution deliver high compression ratios and compute efficiency relative to row-oriented databases, gross margin performance remains unproven in public disclosures. ClickHouse employs a globally distributed workforce spanning more than ten countries, yet the company does not disclose consolidated gross profit, research and development investments, or customer acquisition costs. Key software unit economics benchmarks—most notably gross margin percentage, net revenue retention (NRR), and annual customer payback velocity—remain undisclosed private data. Consequently, underwriting long-term software profitability requires independent verification of hosting infrastructure cost pass-throughs and customer expansion dynamics.
    claimRefs:
      - CI009
      - CI010
      - CI011
    tableRefs:
      - TI003
  - id: revenue-bridge-and-cloud-conversion
    title: Revenue Model Bridge and Monetization Conversion
    body: The commercial transition from open-source community usage into monetized cloud consumption operates as an operational conversion bridge. Free open-source deployments establish developer adoption and workload proof-of-concept validation, which ClickHouse converts into paid cloud consumption as data volumes and operational complexity expand. Customer spend converts directly into gross billings based on active query execution and storage retention. However, cloud delivery costs immediately absorb a substantial portion of gross billings through underlying hyperscaler compute instances, managed storage tiers, and cross-region egress traffic. Additional service delivery costs include automated backup monitoring, managed ingestion infrastructure, and continuous cloud support operations. For enterprise underwriting, understanding the residual contribution margin after hosting COGS and ongoing platform reinvestment is critical to evaluating operating leverage at scale.
    claimRefs:
      - CI001
      - CI011
      - CI012
    figureRefs:
      - FI001
  - id: capital-adequacy-and-financial-verdict
    title: Capital Adequacy, Cash Runway, and Underwriting Verdict
    body: ClickHouse has established strong capital adequacy through its January 2026 financing package and existing credit facility, leaving the company well-positioned for near-term expansion. This financing brought total cumulative equity funding to more than $1 billion across institutional rounds, complemented by a $100 million credit facility secured from Goldman Sachs and Stifel during its Series C round. The company has demonstrated exceptional commercial traction, expanding its customer count from 3,000 in January 2026 to more than 4,000 in May 2026, while annualized recurring revenue expanded from $160 million at year-end 2025 to a company-reported $250 million in May 2026 and an estimated $350 million in August 2026. However, at a $15 billion valuation, ClickHouse trades at an implied revenue multiple between 43x estimated forward ARR and over 90x historical deal-date revenue. Given the absence of audited gross margin disclosures and customer cohort retention data, investment underwriting carries elevated valuation risk despite pristine commercial momentum.
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI007
      - CI008
      - CI010
      - CI013
    tableRefs: []
tables:
  - id: TI001
    title: Revenue Streams Table
    columns:
      - Revenue Stream
      - Monetization Mechanism
      - Billing Unit
      - Current Status / Run-Rate
      - Revenue Quality
      - Diligence Requirement
    rows:
      - - ClickHouse Cloud (Serverless & Dedicated)
        - Usage-based consumption for compute and storage
        - Compute unit-hours ($0.22-$0.75/CU-hr) + Storage ($25.30-$50/TB-mo)
        - Core growth engine; ARR crossed $250M in May 2026 and estimated $350M in Aug 2026
        - High (recurring, expansion-driven)
        - Cohort retention, net expansion rate, and compute utilization rates
      - - Enterprise BYOC (Bring Your Own Cloud)
        - Annual subscription with dedicated VPC control plane
        - Annual contract value (ACV) based on provisioned scale
        - Active enterprise deployment mode for regulated clients
        - High (annual contracted recurring)
        - Enterprise contract duration, discounting schedules, and committed spend minimums
      - - Managed Ingestion & Add-ons (ClickPipes / CDC)
        - Consumption surcharge for managed Kafka/S3/DB connectors
        - Data volume ingested / connector hours
        - Commercial feature bundled into Cloud tiers
        - Medium (tied to Cloud ingestion volume)
        - Gross margin on managed connector compute versus public cloud egress costs
      - - Open-Source Support & Advisory (Historical)
        - Annual support SLAs and commercial licenses
        - Per-node annual license / cluster fee
        - De-emphasized relative to Cloud; open source remains Apache 2.0 funnel
        - Moderate (non-consumption services/support)
        - Mix percentage of pure support vs Cloud subscription revenue
    notes: Data reflects reported cloud monetization structure and analyst estimates (Sacra, Improvado). Realized revenue mix between serverless consumption and committed enterprise BYOC contracts is not publicly disclosed.
    claimRefs:
      - CI001
      - CI004
      - CI014
  - id: TI002
    title: Pricing / Monetization Table
    columns:
      - Deployment Tier
      - List Pricing / Unit Metric
      - Contract / Billing Model
      - Realized Pricing vs List
      - Discounts & Unknowns
      - Source
    rows:
      - - ClickHouse Cloud Basic / Development
        - $0.22 per compute unit-hour; $25.30/TB-month storage; $67/mo entry
        - Pay-as-you-go credit card or self-service billing
        - Standard list pricing with $300 signup credits
        - Self-service usage without enterprise discounts; churn rates undisclosed
        - Improvado TCO Guide / ClickHouse Official
      - - ClickHouse Cloud Scale / Production
        - $0.39-$0.75 per compute unit-hour; $35-$50/TB-month storage
        - Usage-based monthly invoicing or committed drawdowns
        - Realized rate varies with sustained concurrency and auto-suspend
        - Volume tiering and commit drawdowns reduce effective unit rate
        - Improvado TCO Guide / Sacra
      - - Enterprise Dedicated / BYOC
        - Custom enterprise contract ($100k+/yr scale commitments)
        - Annual recurring subscription + overage / VPC license
        - Negotiated enterprise discounts on compute commits
        - Private pricing; multi-year commit discounts and support bundling unverified
        - Improvado TCO Guide / Sacra
      - - Self-Hosted Open Source (Comparison)
        - $0 software license (Apache 2.0); infrastructure $2,435-$30,720/mo
        - Hardware / cloud IaaS infrastructure + internal engineering overhead
        - Zero software fee; infrastructure + 10-20% FTE DBA operational overhead
        - Hardware provisioning, backup replication, and Keeper quorum costs externalized
        - Improvado TCO Guide / ClickHouse Official
    notes: List pricing taken from Improvado 2026 pricing benchmarks and ClickHouse documentation. Realized discounting schedules, average contract values, and minimum commit thresholds are private.
    claimRefs:
      - CI002
      - CI006
      - CI012
  - id: TI003
    title: Unit Economics Table
    columns:
      - Financial Metric
      - Reported or Estimated Value
      - Confidence Level
      - Analytical Significance
      - Diligence Requirement
    rows:
      - - Annual Recurring Revenue (ARR)
        - $350M (August 2026 estimate); $250M (May 2026 milestone)
        - Medium
        - Top-line commercial scale and velocity for IPO readiness
        - Audit audited financials, subscription ARR definition, and LTM realized revenue
      - - Customer Count
        - 4,000+ (May 2026); 3,000+ (Jan 2026)
        - High
        - Customer adoption velocity across ClickHouse Cloud
        - Breakdown by contract tier (self-service vs enterprise >$100k ARR)
      - - Gross Margin (%)
        - null
        - Low
        - Direct indicator of cloud infrastructure efficiency vs AWS/GCP hosting costs
        - Request COGS breakdown between public cloud compute/storage and customer support
      - - Net Revenue Retention (NRR)
        - null
        - Low
        - Critical SaaS/consumption expansion indicator determining organic growth durability
        - Request cohort-level net expansion curves and gross churn by customer cohort
    notes: Gross margin and Net Revenue Retention remain completely undisclosed by ClickHouse. Diligence must establish audited COGS and cohort retention before underwriting.
    claimRefs:
      - CI004
      - CI007
      - CI010
