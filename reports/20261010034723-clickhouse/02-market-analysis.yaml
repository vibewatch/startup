callouts:
  - calloutType: "insight"
    title: "Decoupling AI Volume from Revenue Concentration"
    body: "While ClickHouse is widely deployed across frontier AI developers such as Anthropic, OpenAI, Harvey, and Decagon for trace telemetry and sub-second evaluation queries, CEO Aaron Katz disclosed that the entire AI cohort accounts for less than 12% of total commercial revenue. This structural diversification protects ClickHouse from application-layer volatility while positioning the database layer as the fundamental beneficiary of surging agentic query volumes."
    claimRefs:
      - "CM006"
      - "CM009"
  - calloutType: "risk"
    title: "Technographic Fragmentation and Competitor Density"
    body: "Despite holding a commanding reputation for columnar performance, ClickHouse holds an estimated 2.83% market share and ranks #10 in 6sense's Big Data Analytics category. Incumbent data platforms Databricks, Azure Databricks, and Microsoft Azure Synapse command over 44% of tracked enterprise installations, creating substantial switching-cost barriers for enterprise accounts with centralized cloud data contracts."
    claimRefs:
      - "CM001"
      - "CM013"
