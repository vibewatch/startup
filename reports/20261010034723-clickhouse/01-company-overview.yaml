callouts:
  - calloutType: strength
    title: Hypergrowth Across Cloud and Enterprise AI Deployments
    body: >-
      ClickHouse has demonstrated rapid commercial execution by scaling ClickHouse Cloud from inception to over $250
      million in annual run-rate revenue in under five years. The platform has achieved widespread adoption across
      leading technology organizations, combining high net dollar retention with disciplined AI revenue diversification.
    claimRefs:
      - CO007
      - CO008
      - CO013
  - calloutType: risk
    title: Infrastructure Cost Pressures and Unverified Margin Profile
    body: >-
      While ClickHouse's $15 billion valuation reflects exceptional top-line momentum, private disclosures leave gross
      margin and cohort durability unverified. High query concurrency on massive analytical datasets demands substantial
      compute resources, creating potential margin friction if cloud hosting costs outpace consumption expansion.
    claimRefs:
      - CO004
      - CO012
      - CO014
