company:
  name: ClickHouse
chapter:
  number: 1
  title: Company Overview
  summary: >-
    ClickHouse is a high-performance open-source columnar analytics database company commercializing ClickHouse Cloud,
    which has scaled to over $250 million in annual run-rate revenue and 4,000 customers. Founded around the open-source
    project created at Yandex in 2009 and incorporated in Delaware in September 2021, the company has raised
    approximately $1.15 billion in total capital—most recently securing a $400 million Series D led by Dragoneer at a
    $15 billion valuation in January 2026.
sections:
  - id: company-identity-and-foundations
    title: Company Identity and Historical Foundations
    body: >-
      ClickHouse, Inc. operates as a commercial open-source infrastructure provider delivering high-performance
      real-time analytics, data warehousing, and observability capabilities. The foundational technology began inside
      Yandex in 2009 under the engineering leadership of Alexey Milovidov, originally engineered to process
      petabyte-scale telemetry for Yandex.Metrica with sub-second query response times. After demonstrating immense
      performance advantages over traditional relational and row-oriented systems, the core database engine was released
      under the permissive Apache 2.0 open-source license in June 2016. In September 2021, the technology was formally
      commercialized through the incorporation of ClickHouse, Inc. as an independent Delaware corporation headquartered
      in the San Francisco Bay Area. Today, the company monetizes its technology primarily through ClickHouse Cloud, a
      fully managed, serverless database service designed for multi-tenant analytical applications and machine learning
      workloads.
    claimRefs:
      - CO001
      - CO002
      - CO006
      - CO007
      - CO008
      - CO009
    tableRefs:
      - TO001
  - id: executive-leadership-and-governance
    title: Executive Leadership and Organizational Governance
    body: >-
      The executive management team at ClickHouse blends deep open-source database engineering heritage with seasoned
      enterprise go-to-market execution. Co-founder and Chief Executive Officer Aaron Katz joined the company at
      incorporation, bringing extensive scaling experience from senior commercial leadership roles at Salesforce and
      Elastic. The technical vision remains steered by co-founder and Chief Technology Officer Alexey Milovidov, who
      created the original database engine and continues to direct open-source community contributions and architectural
      innovations. Operational and infrastructure scaling is directed by co-founder and President Yury Izrailevsky,
      formerly Vice President of Engineering at Google and Vice President of Cloud Systems at Netflix. Governance is
      supported by institutional board representation from foundational backers, while key-person dependencies remain
      pronounced around Milovidov's architectural stewardship and Katz's enterprise distribution strategy.
    claimRefs:
      - CO001
      - CO003
      - CO015
    tableRefs:
      - TO002
  - id: capitalization-and-ownership-structure
    title: Capitalization, Financing Rounds, and Ownership Structure
    body: >-
      ClickHouse has established one of the most well-capitalized balance sheets in the data infrastructure landscape,
      securing approximately $1.15 billion in total capital commitments since its 2021 spin-out. The company completed
      an initial $50 million Series A in September 2021 led by Benchmark and Index Ventures, followed rapidly by a $250
      million Series B in October 2021 co-led by Coatue Management and Altimeter Capital at a $2 billion post-money
      valuation. In December 2022, Thrive Capital led an undisclosed Series B extension. Growth accelerated further in
      May 2025 with a $350 million Series C led by Khosla Ventures alongside a $100 million credit facility. Most
      recently, in January 2026, ClickHouse closed a $400 million Series D financing led by Dragoneer Investment Group
      at a $15 billion valuation, establishing a substantial cash reserve to accelerate product expansion across
      enterprise artificial intelligence and analytics workloads.
    claimRefs:
      - CO004
      - CO005
      - CO006
      - CO011
      - CO015
    tableRefs:
      - TO003
  - id: commercial-scale-and-operating-risks
    title: Commercial Scale, Milestone Trajectory, and Diligence Risks
    body: >-
      From an operational perspective, ClickHouse has demonstrated extraordinary top-line momentum, reaching more than
      $250 million in annualized run-rate revenue and surpassing 4,000 paying customer organizations by May 2026. This
      performance reflects rapid enterprise cloud adoption, with high net expansion and strategic positioning across
      generative AI telemetry and infrastructure logging. In January 2026, the company broadened its software portfolio
      by acquiring Langfuse, integrating native LLM application tracing and evaluation directly into its analytics
      ecosystem. However, significant diligence risks warrant scrutiny. Data ingestion workflows into columnar storage
      can be brittle and engineering-intensive, while high-concurrency analytical queries risk saturating database
      processing capacity. Furthermore, broader industry headwinds surrounding AI infrastructure gross margins and low
      switching costs among early-stage AI applications create ongoing risks that require verification against private
      unit economics.
    claimRefs:
      - CO004
      - CO007
      - CO008
      - CO010
      - CO012
      - CO013
      - CO014
    figureRefs:
      - FO001
