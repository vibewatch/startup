company:
  name: Icertis
chapter:
  number: 1
  title: Company Overview
  summary: Icertis is a Bellevue-based enterprise contract lifecycle management company founded in 2009 by Samir Bodas and Monish Darda. Current public evidence supports a late-stage, enterprise-focused platform with substantial private funding and a 2025 $50 million financing, but private-company operating metrics and leadership continuity remain only partially disclosed and source estimates conflict.
sections:
  - id: identity-and-operating-model
    title: Identity, product, and scale
    body: >-
      Tracxn describes Icertis as a Bellevue-based software developer founded in
      2009 by Monish Darda and Samir Bodas, focused on contract lifecycle
      management and intelligence. The platform's operating model is enterprise
      SaaS: it supports drafting, negotiation, obligation tracking, analytics,
      compliance, and integrations with systems such as SAP, Salesforce, and
      Microsoft. Independent reviews and a current Cognizant implementation role
      consistently place the product at the high-complexity end of CLM rather
      than in self-serve small-business software. Public scale indicators remain
      qualified: GeekWire relays Icertis's report of more than $300 million in
      2024 ARR and positive free cash flow, while Tracxn reports 1,654 employees
      as of May 2026. ARR is not GAAP revenue, company-reported free cash flow is
      not audited cash availability, and the employee figure is an aggregator
      estimate rather than a management-certified workforce count.
    claimRefs: [CO001, CO002, CO003, CO012, CO014]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-governance-and-dependence
    title: Leadership, governance, and key-person dependence
    body: >-
      The founding team remains visible in the evidence, but the current
      leadership picture is not fully settled. GlobalData reports Jim Moffatt as
      interim co-chief executive officer and chairman in 2026, while an April
      2026 third-party profile says Anand Subbaraman became CEO in 2025 and leads
      the company after Samir Bodas's death. These records may reflect different
      update times or governance scopes, so the CEO, chair, board roster, and
      control positions require direct company confirmation. The operational
      dependency is material: product strategy, enterprise relationships, and
      transition execution have historically been associated with the founders
      and a small group of senior operators, while the current succession
      structure is not established by primary evidence in this pool.
    claimRefs: [CO001, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: capital-milestones-and-information-gaps
    title: Capital history, milestones, and diligence gaps
    body: >-
      Icertis has a substantial financing history, but the exact cumulative
      total and current valuation are not uniformly reported. Tracxn records
      $497 million across 12 rounds and a March 2025 $50 million Series F,
      while GeekWire independently reports that the company raised $50 million
      from existing backer B Capital to pay down outstanding debt and had
      raised more than $500 million. Sacra reports more than $520 million and
      describes a possible sale at up to $5 billion in February 2025, while
      other profiles present $5 billion as an estimate rather than a current
      transaction price. Public evidence therefore supports a late-stage
      financing profile, not an audited valuation, ARR, cash balance, burn rate,
      net retention, or board-control conclusion. Those gaps are central to
      underwriting. The financing proceeds cannot be treated as current cash
      available because the reported use was repayment of outstanding debt.
    claimRefs: [CO009, CO010, CO011, CO013, CO015]
    tableRefs: [TO003]
callouts:
  - calloutType: strength
    title: Enterprise depth is evidenced, but not fully quantified
    body: The sources consistently describe a deeply integrated enterprise CLM platform with AI-assisted contract workflows and broad systems integration, while audited scale and customer denominators remain unavailable.
    claimRefs: [CO002, CO003, CO015]
  - calloutType: risk
    title: Governance and private-company disclosure are the main overview risks
    body: Current leadership descriptions conflict across sources, implementation estimates vary materially, and private-company disclosure does not establish audited revenue, cash, profitability, or current valuation.
    claimRefs: [CO008, CO015, CO016]
  - calloutType: recommendation
    title: Confirm current control and financing terms directly
    body: Before relying on the reported $5 billion valuation or leadership transition, obtain a current capitalization table, board roster, debt schedule, and management-certified operating metrics.
    claimRefs: [CO008, CO010, CO013, CO015]
