      - [Annual recurring revenue, "$300M estimated ARR", "End of 2024", "Sacra estimate", medium, Corroborates the broad scale signal, "Methodology and customer cohort bridge"]
      - [Named deployment, "Vaillant Group selected Icertis Contract Intelligence across operations in 60 countries", "2023", "GlobalData report", medium, Shows a named multinational use case, "Production scope, users, and outcomes"]
      - [Ferring adoption support, "33% of end-user support tickets deflected; 97% Self Help resolution rate", "First quarter after integration", "Whatfix partner case study", medium, Shows active post-launch support usage, "Ticket volume, contract scope, renewal, and independent verification"]
      - [Compass Group rollout, "1,500+ employee end-users", "Date not stated", "Whatfix partner case study", medium, Indicates a broad enterprise user rollout, "Active-user definition, utilization, baseline, and renewal"]
    notes: "Values mix company-reported, analyst-estimated, and named-deployment evidence; they are not a single comparable adoption series and do not establish active-account growth."
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
  - id: TU003
    title: Named customer proof table
    enumerationScope:
      coverage: partial
      basis: "Publicly named customer and case-study references found in the assigned prefetched sources as of 2026-10-25."
    columns: [Customer, Segment, Deployment/use case, Production vs pilot, Outcome, Limitation]
    rows:
      - [Vaillant Group, Global industrial enterprise, Contract-driven processes across enterprise operations in 60 countries, "Status not specified", "Selection indicates a named multinational deployment", "No public users, contract count, renewal, or quantified outcome"]
      - [Ferring, Pharmaceutical enterprise, In-app guidance and support for employees using Icertis, "Post-launch production use described by implementation partner", "33% ticket deflection and 97% Self Help resolution rate in the first quarter", "Partner-published case study; ticket volume, contract scope, and renewal are undisclosed"]
      - [Compass Group, Hospitality and multinational catering, Contextual walkthroughs and self-help in an Icertis rollout, "Production rollout described by implementation partner", "More than 1,500 employee end-users and a qualitative reduction in task completion time", "Partner-published case study; no quantified baseline, utilization, or renewal data"]
    notes: "This is a partial set of named references in the assigned sources; Vaillant status comes from GlobalData, while Ferring and Compass outcomes are published by Icertis partner Whatfix and are not independently audited."
    claimRefs: [CU005, CU006, CU014, CU015]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Enterprise adoption moves from complex contracting needs through implementation and integration toward portfolio governance and possible expansion, with friction concentrated in configuration and proof of durability.
    data:
      nodes:
        - id: need
          label: Complex contract portfolio
          detail: "Large enterprise functions need governed authoring, negotiation, execution, and post-signature oversight."
          value: "Buyer trigger"
        - id: implement
          label: Configure and deploy
          detail: "Templates, clauses, approval matrices, integrations, training, and ongoing administration are required."
          value: "Adoption hurdle"
        - id: embed
          label: Connect workflows
          detail: "ERP, CRM, procurement, and enterprise systems can share contract data and obligations."
          value: "Usage surface"
        - id: govern
          label: Govern obligations
          detail: "Teams monitor renewals, milestones, risk, compliance, and portfolio analytics."
          value: "Value realization"
        - id: renew
          label: Renew and re-scope
          detail: "Renewal timing and portfolio outcomes create the test for durability and account expansion."
          value: "Durability checkpoint"
        - id: expand
          label: Expand across functions
          detail: "Broader buy-side, sell-side, and internal agreement coverage can increase account scope."
          value: "Hypothesized expansion"
    claimRefs: [CU003, CU010, CU011, CU012, CU014, CU015]
callouts:
  - calloutType: strength
    title: Enterprise workflow breadth is credible
    body: Independent descriptions consistently place Icertis across legal, procurement, sales, finance, and connected enterprise systems, supporting a broad buyer and user surface.
    claimRefs: [CU001, CU003, CU006, CU014, CU015]
  - calloutType: risk
    title: Retention and concentration are not public
    body: No assigned source provides audited NRR, GRR, churn, renewal cohorts, top-customer concentration, or customer-level revenue bands; these remain material diligence gaps.
    claimRefs: [CU012, CU013]
  - calloutType: recommendation
    title: Require cohort evidence before underwriting expansion
    body: Request ARR by cohort, gross and net retention, renewal and churn schedules, top-10 customer concentration, implementation duration, and channel-sourced bookings.
    claimRefs: [CU012, CU013]
