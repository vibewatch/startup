schemaVersion: "report-v2"
artifact: valuation
slug: icertis
runDate: 2026-10-25
company:
  name: Icertis
chapter:
  number: 8
  title: Valuation
  summary: >-
    Icertis has credible late-stage enterprise-software scale, but public evidence does not
    establish a current priced round or audited operating base. The available evidence therefore
    supports research-more rather than a buy at the historical $5 billion mark.
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      The positive case is a category-scale enterprise platform with recurring subscription
      economics, deep integrations, and evidence of material ARR growth. Sacra reports $300
      million of ARR at the end of 2024 and says the company described itself as approaching
      $350 million in ARR in August 2025, while Growfusely reports $250 million ARR by early
      2024 and an AI-led product expansion. Official competitor releases show historical
      financing appetite for contract software, but their different vintages and stages do not
      provide a direct valuation multiple for Icertis.
      The anti-thesis is price discovery: the last widely reported $5 billion mark dates to
      2021, while QuantLogix's 2026 research estimate is $3.9 billion and explicitly says it is
      a model estimate rather than a live price. Public sources also disagree on funding and
      revenue definitions, so the thesis is not sufficiently underwritten for a buy decision.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV002]
  - id: price-and-financing
    title: Financing context and entry discipline
    body: >-
      Icertis remains privately held, so the historical secondary valuation is not a continuously
      quoted market price. Silicon Valley Investclub lists a $5 billion valuation in October 2021
      and a $50 million later-stage equity entry in March 2025 without a disclosed post-money
      valuation; Sacra likewise describes a possible sale process valuing the company at up to
      $5 billion and says the 2025 financing was intended to pay down debt. QuantLogix records a
      $3.8 billion secondary-market print on 2026-06-27 and a $3.9 billion research estimate,
      but cautions that the secondary print has no bid, ask, or spread. Those observations imply
      a disciplined entry would require updated cap-table, preference, debt, and transaction
      terms, not simply applying the old $5 billion headline to an ARR estimate.
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: scenarios-and-diligence
    title: Scenarios, exit readiness, and diligence asks
    body: >-
      A bull case is possible if ARR near the reported 2025 range is audited, growth remains
      durable, AI modules expand wallet share, and an exit process clears the historical mark.
      The base case is a valuable but disclosure-constrained private software asset whose fair
      price is below the 2021 headline until a new financing or sale establishes terms. The bear
      case is multiple compression or a down-round if AI features commoditize, implementation
      remains lengthy, or channel dependence weakens. Owlesq flags a high price point,
      complex implementation, and a user experience that some users perceive as dated; Sacra
      identifies SAP dependence and AI commoditization as risks. Before investing, diligence
      should obtain audited ARR and GAAP revenue reconciliation, gross margin, net retention,
      burn and runway, customer concentration, debt and preference terms, board control, and
      evidence of a current arm's-length transaction.
    claimRefs: [CV011, CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV004]
callouts:
  - calloutType: recommendation
    title: Recommendation
    body: >-
      Research-more: the business appears investable in quality terms, but public evidence does
      not support underwriting a current entry price or return target with high confidence.
    claimRefs: [CV008, CV010, CV015]
  - calloutType: risk
    title: Thesis-break trigger
    body: >-
      Treat the thesis as broken if audited ARR or revenue is materially below the reported
      range, if a new transaction prices materially below the historical mark without a credible
      recovery path, or if debt and liquidation preferences leave common equity with little
      participation in an exit.
    claimRefs: [CV009, CV013, CV016]
tables:
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Evidence, What would change the view]
    rows:
      - ["Recommendation", "Research-more; confidence medium; risk high; valuation stance stretched.", "A current priced transaction and audited operating data could support a buy decision."]
      - ["Enterprise scale", "Reported ARR reached $300M at end-2024 and was approaching $350M in August 2025.", "Audited ARR, GAAP revenue, gross margin, and retention reconciliation."]
      - ["Peer financing context", "Ironclad announced a $150M Series E in 2022, while Conga announced a $70M investment in 2015.", "Current, stage-matched transactions with disclosed revenue and valuation terms."]
      - ["Price discovery", "Historical $5B mark versus QuantLogix $3.9B model estimate and $3.8B secondary print.", "A current arm's-length round, sale, or tender with disclosed terms."]
      - ["AI differentiation", "Copilots and contract-intelligence positioning expand the product surface.", "Independent proof of AI attach, expansion, accuracy, and durable pricing power."]
      - ["Execution risk", "Independent reviews cite high price and complex implementation.", "Cohort implementation time, deployment costs, and customer reference evidence."]
    notes: "Rows separate operating quality from price evidence; reported ARR is not treated as audited GAAP revenue."
    claimRefs: [CV001, CV002, CV004, CV006, CV008, CV011, CV012]
  - id: TV003
    title: Financing and valuation evidence
    columns: [Period, Event or metric, Reported value, Qualification]
    rows:
      - ["2019", "Series E post-money", "$1.0B", "Reported by multiple secondary databases; transaction terms are not independently filed here."]
      - ["2021", "Series F post-money", "$2.8B", "Reported historical financing mark."]
      - ["Oct 2021", "Secondary valuation", "$5.0B", "Secondary transaction, not a current continuous market quote."]
      - ["Mar 2025", "Later-stage equity / funding", "$50M", "Reported amount; post-money valuation not disclosed."]
      - ["2026-06-27", "Secondary-market print", "$3.8B", "QuantLogix says no bid, ask, or spread was available."]
      - ["2026-10-25", "QuantLogix research estimate", "$3.9B", "Model estimate, not a quote or investment advice."]
      - ["Current source snapshot", "Ironclad reported comparable", "$3.2B / 16.0x revenue", "Multiples.vc estimate; different scale, business mix, and transaction basis."]
      - ["Current source snapshot", "Intapp reported comparable", "$3.7B / 5.9x revenue", "Multiples.vc estimate for a public company; not directly comparable to private ARR."]
      - ["Current source snapshot", "CS Disco reported comparable", "$329M / 1.4x revenue", "Multiples.vc estimate for a smaller public company; illustrates dispersion, not fair value."]
    notes: "Values retain each source's period and status; financing raised is not treated as cash available and secondary marks are not treated as audited enterprise value."
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
  - id: TV004
    title: Bull, base, and bear scenarios
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - ["Bull", "Audited ARR is near the reported 2025 range; AI attach and enterprise expansion remain strong; a current exit clears the old mark.", "A new transaction at or above $5B could validate upside from the $3.9B model estimate.", "Lower probability until current terms and audited metrics are disclosed.", "ARR quality, retention, or AI monetization fails diligence."]
      - ["Base", "Reported ARR is directionally right, but growth, margins, debt, and preferences remain partly private.", "Fair value should be negotiated around current transaction evidence, not anchored to the 2021 $5B mark.", "Most supportable public-evidence case.", "No current transaction and persistent metric-definition conflicts."]
      - ["Bear", "AI features commoditize; implementation remains costly; SAP channel or enterprise demand weakens.", "Multiple compression or a down-round creates permanent dilution and weak common-equity returns.", "Material risk given cited competition and execution concerns.", "Debt, preferences, or weak cash generation absorb exit proceeds."]
      - ["No-investment / wait", "Required audited and cap-table evidence is not delivered.", "Return target cannot be responsibly calculated from public evidence.", "Default until evidence gap closes.", "Proceeding on the historical headline valuation."]
    notes: "These are qualitative scenario signals, not a probabilistic forecast; no unsupported point valuation or return percentage is invented."
    claimRefs: [CV009, CV011, CV012, CV013, CV014, CV016]
