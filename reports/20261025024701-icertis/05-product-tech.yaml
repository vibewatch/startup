    title: Product architecture map
    type: stack
    summary: Icertis combines user experiences and applications with contract workflows, structured data, AI, integrations, and governance.
    data:
      layers:
        - label: User experiences
          modules: [Office 365 and Salesforce surfaces, Role-based dashboards, Business-user workflows]
        - label: Applications
          modules: [Contract setup, Contract operations, Obligations and sourcing, AI applications]
        - label: Contract intelligence core
          modules: [Repository and metadata, Clause and template logic, Negotiation and execution]
        - label: AI and analytics
          modules: [Extraction and classification, Risk and compliance insights, Reporting and search]
        - label: Enterprise integrations
          modules: [REST APIs and webhooks, ERP/CRM/procurement connectors, Identity and data exchange]
        - label: Governance
          modules: [Role-based access, Audit trails, Human review, Security and compliance controls]
    approximationNotes: "Layer order is an analytical view of capabilities described in the assigned sources, not a vendor-published deployment topology."
    claimRefs: [CE001, CE005, CE006, CE007, CE013]
callouts:
  - calloutType: strength
    title: Broad enterprise operating model
    body: The product surface spans setup, operations, governance, compliance, analytics, embedded experiences, business applications, and AI applications on a shared contract platform.
    claimRefs: [CE001, CE005]
  - calloutType: risk
    title: Implementation and control evidence remains incomplete
    body: Public evidence describes a powerful but complex platform; independent proof of reliability, security assurance, AI accuracy, and implementation outcomes is not available in the assigned pool.
    claimRefs: [CE011, CE012, CE016]
  - calloutType: recommendation
    title: Underwrite architecture, not marketing breadth
    body: Treat Icertis as a potentially strong enterprise control plane, but make a decision contingent on tenant-specific security evidence, production references, implementation economics, integration testing, and AI evaluation results.
    claimRefs: [CE011, CE012, CE016]
