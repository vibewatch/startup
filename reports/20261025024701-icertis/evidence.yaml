evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: leadership
    missingEvidence: A current official executive roster, board consent record, and governance organization chart.
    whyItMatters: >-
      Conflicting CEO and chair descriptions affect key-person dependence, control analysis, and accountability for the
      current operating plan.
    diligencePath: >-
      Request a management-certified leadership roster, board minutes or consent summary, and current executive
      employment dates.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      A reconciled capitalization and financing schedule distinguishing equity, convertible debt, venture debt, and
      secondary transactions.
    whyItMatters: >-
      Reported cumulative funding totals are not comparable until instrument type, inclusion rules, and transaction
      dates are standardized.
    diligencePath: >-
      Obtain the latest cap table, financing closing statements, debt schedule, and investor ownership summary under
      NDA.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Audited or management-certified ARR, GAAP revenue, gross margin, burn, cash runway, customer count, and retention
      cohorts.
    whyItMatters: >-
      Private profiles provide estimates, but investors cannot translate valuation or funding into sustainable unit
      economics without denominators and accounting definitions.
    diligencePath: >-
      Request monthly KPI history, audited financial statements, cohort retention, customer concentration, and a bridge
      from ARR to GAAP revenue.
    relatedQuestionRefs:
      - QO006
      - QO010
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: implementation
    missingEvidence: >-
      Customer-level evidence quantifying implementation duration, adoption burden, and realized ROI across
      representative deployments.
    whyItMatters: >-
      Third-party material repeatedly describes enterprise implementation as complex or lengthy, which could constrain
      growth and increase services dependence.
    diligencePath: >-
      Review reference calls, implementation statements of work, services gross margin, and time-to-value metrics by
      cohort.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A segmented Icertis market model with customer counts, ACV by segment, win rates, retention, expansion,
      implementation economics, and served geographies.
    whyItMatters: >-
      Category forecasts cannot be translated into serviceable or obtainable market share without company-specific
      penetration and monetization evidence.
    diligencePath: >-
      Request management's bottoms-up TAM/SAM/SOM model and reconcile it to CRM pipeline, bookings, ACV, renewal, and
      expansion cohorts.
    relatedQuestionRefs:
      - QM006
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: A reconciled definition of CLM versus procurement software and the methodology behind each forecast.
    whyItMatters: >-
      The USD 1.8 billion CLM estimate and USD 8.89 billion procurement estimate have different category boundaries and
      cannot be added or compared as like-for-like TAM.
    diligencePath: >-
      Obtain full methodologies, segment definitions, currency conventions, and overlap assumptions from both publishers
      before using a composite market model.
    relatedQuestionRefs:
      - QM005
      - QM006
      - QM008
  - type: private-evidence-only
    severity: material
