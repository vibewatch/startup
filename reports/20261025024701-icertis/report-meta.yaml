companyProfile:
  summary: >-
    Icertis is a Bellevue-based late-stage private enterprise software company founded in 2009 by Samir Bodas and Monish
    Darda. Its Icertis Contract Intelligence platform manages contract authoring, negotiation, obligations, compliance,
    analytics, and integrations across legal, procurement, sales, and finance workflows. Public evidence supports
    substantial enterprise traction and financing, but operating metrics, leadership continuity, customer economics, and
    current valuation remain only partially disclosed.
