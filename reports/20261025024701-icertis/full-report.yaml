    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and scale
        blocks:
          - type: paragraph
            body: >-
              Tracxn describes Icertis as a Bellevue-based software developer founded in 2009 by Monish Darda and Samir
              Bodas, focused on contract lifecycle management and intelligence. The platform's operating model is
              enterprise SaaS: it supports drafting, negotiation, obligation tracking, analytics, compliance, and
              integrations with systems such as SAP, Salesforce, and Microsoft. Independent reviews and a current
              Cognizant implementation role consistently place the product at the high-complexity end of CLM rather than
              in self-serve small-business software. Public scale indicators remain qualified: GeekWire relays Icertis's
              report of more than $300 million in 2024 ARR and positive free cash flow, while Tracxn reports 1,654
              employees as of May 2026. ARR is not GAAP revenue, company-reported free cash flow is not audited cash
              availability, and the employee figure is an aggregator estimate rather than a management-certified
              workforce count.
