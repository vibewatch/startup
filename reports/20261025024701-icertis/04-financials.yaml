      - [Implementation and support, Services associated with enterprise deployment, "Required/meaningful implementation effort indicated", "Third-party and partner evidence", "Separate services revenue, cost, and implementation gross margin"]
    notes: "Sources include Sacra, Business-Software.com, IntuitionLabs, and Cognizant; public materials do not provide an audited stream mix, so undisclosed values remain unknown."
    claimRefs: [CI001, CI002, CI003, CI009]
  - id: TI002
    title: Pricing and monetization
    columns: [Dimension, Public evidence, List vs realized, Confidence, Diligence ask]
    rows:
      - [Contract volume, Custom enterprise quote, "List structure unavailable; realized price unavailable", medium, "Obtain price bands by contract volume"]
      - [User licenses, Custom enterprise quote, "No public seat price", medium, "Obtain seat counts and effective price per user"]
      - [Modules and AI, Modular/premium capabilities, "No public attach or uplift data", medium, "Obtain AI/module attach and renewal pricing"]
      - [Deployment style, Cloud/on-premise/hybrid described by a listing, "No comparable realized pricing", low, "Confirm supported deployment economics and support burden"]
      - [Discounting, Not disclosed, "Cannot infer from quote-based model", low, "Request bookings-to-billings discount bridge"]
    notes: "Official and third-party surfaces describe custom enterprise pricing; no source provides realized pricing, discounts, or customer-level contract terms."
    claimRefs: [CI002, CI003]
  - id: TI003
    title: Unit economics and underwriting inputs
    columns: [Metric, Value/null, Confidence, Why it matters, Diligence ask]
    rows:
      - [ARR, "$300M at end-2024 Sacra estimate; more than $300M in 2024 company-reported via GeekWire", medium, "Indicates recurring scale but is not recognized revenue", "Provide ARR bridge and contracted backlog"]
      - [Revenue, "$350M in 2025 Sacra estimate", medium, "Anchors scale but requires accounting reconciliation", "Provide audited revenue by geography and product"]
      - [Gross margin, null, low, "AI and implementation costs determine margin path", "Provide GAAP gross margin and services allocation"]
      - [Net revenue retention, null, low, "Tests expansion and durability in enterprise accounts", "Provide cohort NRR and gross retention"]
      - [CAC/payback, null, low, "Long enterprise cycles can consume cash before renewal", "Provide fully loaded CAC, payback, and sales-capacity model"]
      - [Free cash flow, "Positive in 2024 according to company, not audited here", medium, "Signals operating leverage but does not establish cash balance", "Provide cash-flow statement and reconciliation"]
      - [Cash runway, null, low, "Determines dependence on financing", "Provide cash, burn, runway, and board-approved plan"]
      - [Debt obligations, "$150M convertible debt in 2022; 2025 funding used for debt repayment", medium, "Debt terms can constrain liquidity and valuation", "Provide maturity, covenants, and remaining balance"]
    notes: "Nulls mean the assigned public evidence did not disclose the metric; estimates and company claims are labeled rather than converted into precise audited values."
    claimRefs: [CI005, CI006, CI007, CI010, CI011, CI012, CI013, CI014]
