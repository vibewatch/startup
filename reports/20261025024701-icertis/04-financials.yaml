callouts:
  - calloutType: strength
    title: Recurring scale is credible, but not fully auditable
    body: "Sacra estimates $300 million ARR at end-2024 and lists $350 million of 2025 revenue, while GeekWire reports the company's claim of more than $300 million ARR and positive free cash flow in 2024; the measures and evidence quality must remain distinct."
    claimRefs: [CI005, CI006, CI007]
  - calloutType: risk
    title: Liquidity and debt terms remain underwriting blockers
    body: "The reported 2025 financing was used to pay down debt, but no assigned source discloses cash on hand, burn, runway, covenants, or remaining debt balance."
    claimRefs: [CI010, CI011, CI014]
  - calloutType: recommendation
    title: Require a finance data room before valuation conviction
    body: "The next diligence step should reconcile ARR, GAAP revenue, gross margin, retention, customer concentration, cash flow, debt, and realized pricing at the customer-cohort level."
    claimRefs: [CI015, CI017]
