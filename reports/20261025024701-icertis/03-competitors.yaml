  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing
      missingEvidence: Comparable current Icertis and peer total-cost data segmented by seats, modules, implementation, support, and contract term.
      whyItMatters: Opaque and non-normalized pricing is central to competitive selection and cannot be underwritten from peer medians or one anecdote.
      diligencePath: Request written base-tier, module, implementation, integration, support, renewal, and discount schedules from Icertis and two peers.
      relatedQuestionRefs: [QP005, QP008]
      relatedTableRefs: [TP003]
    - type: missing-source
      severity: material
      topic: product-performance
      missingEvidence: Independent benchmark evidence for implementation duration, time to value, AI accuracy, user adoption, and renewal outcomes.
      whyItMatters: Assigned timing and usability claims are competitor or user-report signals rather than controlled comparative benchmarks.
      diligencePath: Obtain reference calls and anonymized implementation metrics from comparable regulated and multi-business-unit deployments.
      relatedQuestionRefs: [QP004, QP007, QP008]
      relatedTableRefs: [TP002]
    - type: enumeration-incomplete
      severity: material
      topic: competitor-set
      missingEvidence: Current procurement evidence for internal build, incumbent ERP or CRM modules, and region-specific CLM vendors.
      whyItMatters: The public comparison set may omit substitutes that affect win rates and the true cost of switching.
      diligencePath: Collect three recent procurement shortlists by region and industry and interview buyers that selected internal build or an incumbent module.
      relatedQuestionRefs: [QP001, QP002]
      relatedTableRefs: [TP001]
