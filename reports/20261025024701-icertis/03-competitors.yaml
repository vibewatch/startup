    title: Competitive positioning map
    type: quadrant
    summary: An evidence-constrained ordinal view separates enterprise operating depth from distribution and installed-system leverage.
    data:
      xAxis:
        label: Enterprise operating depth
        min: 1
        max: 5
        low: Lighter workflow
        high: Governance-heavy platform
        description: Analyst ordinal score based on assigned product-scope descriptions
        scale: ordinal
      yAxis:
        label: Distribution and installed-system leverage
        min: 1
        max: 5
        low: Standalone route to market
        high: Strong ecosystem leverage
        description: Analyst ordinal score based on integrations and ecosystem positioning
        scale: ordinal
      points:
        - {label: Icertis, x: 5, y: 4, note: "Enterprise governance and broad integrations; SAP relationship adds both leverage and dependency"}
        - {label: Ironclad, x: 4, y: 3, note: "Enterprise workflow breadth without an assigned installed-base metric"}
        - {label: DocuSign CLM, x: 3, y: 5, note: "Signing-led ecosystem provides a strong distribution route"}
        - {label: Sirion, x: 4, y: 3, note: "Deep post-signature control; connected operational data is important"}
        - {label: Agiloft, x: 4, y: 3, note: "Configurable enterprise governance with no assigned distribution metric"}
        - {label: SpotDraft, x: 3, y: 2, note: "Workflow-focused challenger; enterprise depth is not independently benchmarked here"}
    approximationNotes: Coordinates are analyst-authored ordinal scores derived only from assigned source descriptions; they are not measured market shares, customer ratings, or precise rankings.
    claimRefs: [CP005, CP009, CP013, CP016]
