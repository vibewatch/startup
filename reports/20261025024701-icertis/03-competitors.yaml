      - ["Sirion", "Post-signature enterprise CLM", "Not established in assigned evidence", "Enterprises managing obligations, service levels, and performance", "Connects obligations with performance and financial data", "Requires detailed setup and connected operational data"]
      - ["Agiloft", "Configurable enterprise CLM", "Not established in assigned evidence", "Enterprises with highly customized contract processes", "No-code configurability and enterprise controls", "Learning and configuration burden can remain high"]
