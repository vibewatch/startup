      - ["AI contract intelligence", "Drafting, negotiation intelligence, risk scoring, obligations, and analytics", "Drafting, review, redlining, and analysis", "Extraction and agreement analysis", "Obligation extraction and performance comparison", "No assigned accuracy benchmark"]
      - ["Governance and compliance", "Permissions, approval hierarchies, auditability, and multi-jurisdiction support", "Workflow and permission controls", "Signing and agreement governance in its ecosystem", "Obligation and performance governance", "Qualitative evidence only"]
      - ["Enterprise integrations", "SAP, Salesforce, Microsoft, Workday, and procurement systems", "Salesforce, Coupa, and Microsoft Word listed by SpotDraft", "Salesforce and DocuSign ecosystem", "Operational and financial data connections", "Integration presence does not establish implementation quality"]
      - ["Implementation burden", "Configuration project with administration and change-management needs", "Varies with workflow scope", "Repository and workflow setup can require substantial effort", "Detailed clause, task, owner, and data setup", "Competitor and user-report signals, not an independent timing study"]
      - ["Pricing transparency", "Custom quote; no public Icertis price located", "Vendr median cited by Bind, not an official list price", "No comparable figure in assigned evidence", "No comparable figure in assigned evidence", "Do not infer total cost from peer prices"]
    notes: Cells summarize assigned public descriptions. Unsupported or non-comparable quantitative cells are marked unavailable; the matrix does not establish product equivalence or measured performance.
    claimRefs: [CP002, CP003, CP005, CP006, CP008, CP009]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Platform, Public price or pricing posture, Included or emphasized capabilities, Buyer implication]
    rows:
      - ["Icertis", "Custom quote; no public rate in assigned evidence", "Enterprise CLM, AI, governance, integrations, and obligations", "Budget must be established through scoped procurement"]
      - ["Ironclad", "Bind cites a Vendr median of about $40,000/year across 363 purchases", "Enterprise workflow, editor, repository, and AI", "Directional peer benchmark only; scope and contract terms differ"]
      - ["Conga", "Bind cites a Vendr median of about $17,179 across 236 purchases", "CLM connected to commercial systems", "Directional peer benchmark only; capability scope differs"]
      - ["Agiloft", "Bind cites a Vendr median of $67,132", "Configurable workflows and enterprise controls", "Setup and administration must be modeled with license cost"]
      - ["Bind", "$90/seat/month Starter or $500/month for five users per Bind", "AI drafting, review, negotiation, e-signature, and storage", "Transparent pricing trades off against less enterprise governance depth"]
      - ["Signeasy", "$20-$30/user/month stated by Signeasy", "Lighter repository, automation, signing, and AI features", "Lower-entry alternative for simpler workflows; competitor-issued comparison"]
    notes: Prices and purchasing medians are publisher-stated and are not normalized for seats, modules, implementation, geography, contract term, or realized discounts. Icertis has no public rate in the assigned evidence.
    claimRefs: [CP010, CP011, CP012]
figures:
