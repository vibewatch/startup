      - number: '2.2'
        title: Sizing lenses and estimate divergence
        blocks:
          - type: paragraph
            body: >
              Published market estimates vary by more than 6× depending on boundary choice, and even within comparable
              clinical-treatment boundaries the spread reaches 27%. Mordor Intelligence (January 2026 update) values the
              U.S. behavioral health market at $76.25B in 2025, projecting it at $79.79B in 2026 and $100.15B by 2031 at
              a 4.65% CAGR. TowardsHealthcare estimates $96.9B in 2025, reaching $101.84B in 2026 and $159.35B by 2035
              at 5.1%. Fortune Business Insights lands at $92.14B in 2025, growing to $132.46B by 2032 at 5.3%. These
              are not random variation: Mordor counts ambulatory visits at 41% share and excludes some segments that
              TowardsHealthcare includes. The psychiatry-clinic sub-market is separately sized by Grand View Research at
              $10.96B in 2025 (growing to $21.60B by 2033 at 7.79%) while Covenant Health Advisors placed it at $25.9B
              in 2023. This 2.4× discrepancy reflects whether the analyst counts only clinic revenue versus including
              all outpatient psychiatry billing across settings. The global telepsychiatry market (inclusive of all
              delivery modes) is valued by The Business Research Company at $15.55B in 2025 growing to $19.15B in 2026
              at 23.1%, while Grand View Research estimated $22.9B for 2024 growing to $64.5B by 2030 at 18.4%—nearly 3×
              higher by 2030. These contradictions are diagnostic rather than accidental: they confirm there is no
              consensus on whether to count routine psychiatric visits separately from behavioral health broadly or
              telehealth from in-person visits. Investors should treat any single published TAM as a definitional
              artifact and triangulate using multiple lenses. The behavioral health utilization trend is unambiguous
              regardless of boundary: U.S. utilization grew 62.6% between 2018 and 2024, and behavioral health accounted
              for 65.6% of all U.S. telehealth visits in 2024, up from just 18.4% in 2018, with 66.4M behavioral health
              telehealth visits that year surpassing 62.8M primary care visits—confirming behavioral health as the
              dominant telehealth use case.
