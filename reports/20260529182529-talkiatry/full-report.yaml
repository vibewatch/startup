  - id: FU004
    title: Talkiatry adoption and partnership milestones timeline
    type: timeline
    layout: wide
    summary: Key customer and partnership milestones illustrating Talkiatry's adoption trajectory from launch through May 2026.
    claimRefs:
      - CU029
      - CU030
      - CU014
      - CU015
      - CU017
      - CU022
    data:
      items:
        - label: Apr 2020 — First patient visit
          description: Talkiatry launches virtual-only psychiatry; commercial insurance in-network from the outset.
        - label: Nov 2023 — Mindshare Partner Program launch
          description: >-
            NYU Langone Health Ambulatory Care, NOCD, and Transact Campus announced as founding partners. Program allows
            free EHR-integrated referrals from health systems.
        - label: Dec 2023 — Charlie Health youth partnership
          description: Step-up/step-down care partnership for ages 11-33 across 31 Talkiatry states and 27 Charlie Health states.
        - label: ~Apr 2024 — 1 million cumulative patient visits
          description: >-
            First visit-volume milestone disclosed; CEO described the 'vast majority' occurring in the prior 12 months,
            indicating accelerating growth.
        - label: Sep 2024 — BetterHelp employer channel
          description: >-
            Exclusive employer-channel partnership gives BetterHelp Business clients (1,000+ employer/payer
            partnerships) access to Talkiatry in-network psychiatry.
        - label: May 2025 — 2 million patient visits; 600+ psychiatrists
          description: Second milestone crossed; psychiatrist workforce at 600+ full-time employed W-2 providers.
        - label: Feb 2026 — 3 million visits; 800+ psychiatrists; $210M Series D
          description: Third visit milestone; workforce expanded to 800+; $210M Series D raised to continue scale.
        - label: Apr 2026 — AMGA strategic partnership
          description: >-
            AMGA (175,000+ physicians, serving 1 in 3 Americans) partnership enables member organizations to refer to
            Talkiatry nationwide.
        - label: Apr 2026 — NYCBS oncology partnership (Talkiatry Connect)
          description: >-
            First named specialty-medicine integration: 30+ NYCBS oncology locations using Talkiatry Connect for
            psychiatric referrals.
        - label: May 2026 — 50+ health system partners (Mindshare)
          description: 35% of top-20 US health systems now partner with Talkiatry via Mindshare program.
