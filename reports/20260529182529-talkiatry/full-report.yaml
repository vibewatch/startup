      - number: '5.4'
        title: Technology stack, AI, and platform architecture
        blocks:
          - type: paragraph
            body: >
              Talkiatry describes itself as a "full-stack" psychiatry provider underpinned by proprietary AI-powered
              technology for care delivery management, clinical operations streamlining, and member engagement. Public
              evidence does not confirm a proprietary video conferencing layer — virtual visits are explicitly delivered
              through healow™, a third-party telehealth infrastructure from eClinicalWorks. The patient portal (app and
              web) is branded Talkiatry but powered by healow; the practice code FGCACD is how patients locate Talkiatry
              within the healow ecosystem.

              AI is cited in three contexts: (1) patient-clinician matching (based on expertise, availability, and
              patient-specific factors including insurance and preferences), (2) measurement-based care coordination
              (automated collection and tracking of GAD-7/PHQ-8 scores, clinical alerts), and (3) the Talkiatry Connect
              referral alert logic (identifying patients who may need psychiatric referral from within the EMR). The
              internal differentiation between AI components and standard software workflow automation is not publicly
              disclosed.

              Engineering signals are limited. The Talkiatry careers page lists open roles for Senior Software Engineers
              (internal platforms/tooling), Senior Product Data Scientists (Snowflake, dbt, Databricks stack), Senior
              Analytics Engineers, and Business Intelligence Engineering Managers — suggesting an analytics-first
              technology organization rather than deep software infrastructure. Talkiatry Connect's
              Chromium-browser-overlay architecture allows rapid EMR integration without HL7/FHIR API negotiation for
              each EMR, which explains the stated one-day deployment timeline. The explicit exclusion of Epic — the
              dominant U.S. hospital EMR with 38%+ market share — is a material product gap for large health system
              partnerships. The native mobile app (version 1.3.0, April 2026) is in beta with a 2.9/5 App Store rating
              from 17 reviews; reviewers note improved stability, fewer unexpected logouts, and education PDFs now
              opening in-app. Clinician feedback (aggregated from review platforms) cites recurring audio/video issues
              during virtual sessions as a recurring technical limitation.

              The operational infrastructure includes: (1) insurance eligibility verification built into both the
              consumer intake and Talkiatry Connect; (2) automated patient outreach within 24 hours of referral
              submission; (3) clinician matching logic that produces a four-psychiatrist shortlist; and (4) closed-loop
              progress notes delivery to referring providers. Talkiatry is organized as Talkiatry Management Services,
              LLC providing administrative support, with clinical services delivered by independent MCCD Psychiatry
