      - number: '5.2'
        title: Clinical model — psychiatrist-led care and outcomes infrastructure
        blocks:
          - type: paragraph
            body: >
              Talkiatry's clinical model is psychiatrist-led and medication-management-centric, with supplemental
              therapy available only as an adjunct to psychiatric care. All providers are employed full-time (not
              contracted marketplace participants), board-certified, and licensed to prescribe. The standard treatment
              pathway is: online intake assessment → insurance verification → clinician matching → comprehensive
              psychiatric evaluation → individualized care plan (medication and/or supportive psychotherapy) → scheduled
              follow-ups (30-minute visits) → outcomes tracking. The platform routes care coordination notes back to
              referring providers with patient consent.

              Measurement-based care (MBC) is a structural feature: patients complete the GAD-7 (anxiety) and PHQ-8
              (depression) validated questionnaires before their first visit and at each subsequent visit, enabling
              clinicians to track symptom trajectories and adjust treatment. A peer-reviewed retrospective study in the
              Journal of Medical Internet Research (JMIR Formative Research, 2023) evaluated 1,826 commercially-insured
              Talkiatry patients treated between February and September 2023. After an average of five appointments over
              103 days, 67% no longer had clinically significant anxiety symptoms, 62% no longer had clinically
              significant depression symptoms, 26% achieved anxiety remission, and 29% achieved depression remission;
              effect sizes were large (Cohen d = 1.30 for GAD-7, d = 1.39 for PHQ-8). The company's partnerships page
              (citing the same study) reports that 65% of patients no longer report clinically significant symptoms
              overall.

              The AMGA partnership announcement (April 2026) cites updated internal data: 87% of anxiety patients and
              86% of depression patients see symptom reduction after just two visits. A national insurer cohort analysis
              cited on the partnerships page shows 68% fewer hospitalizations, 32% fewer ER visits, and $700 savings per
              member per month for Talkiatry patients. Talkiatry's medical affiliate is ACME-accredited as a provider of
              continuing medical education (CME), which the company notes is "almost unheard of in digital health."
              Clinicians are available via secure healow messaging, with a stated response time of 3 business days;
              same-day scheduling is not supported.

              Therapy is offered only to patients already in Talkiatry's medication management program, not as a
              standalone service — a deliberate clinical boundary that distinguishes Talkiatry from pure therapy
              marketplaces like BetterHelp (which offers no psychiatric prescribing) and positions it alongside hybrid
              providers like LifeStance Health. Care coordination partnerships with NOCD (OCD-specific ERP therapy) and
              Charlie Health (teen/young adult intensive outpatient) extend the care pathway for patients whose needs
              exceed Talkiatry's own scope without creating revenue-sharing conflicts.
