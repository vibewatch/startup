companyProfile:
  summary: >
    Talkiatry is a New York City-based telepsychiatry company co-founded in 2019 by Robert Krayn (CEO) and Dr. Georgia
    Gaveras, DO (CMO), that delivered its first patient visit in April 2020 after pivoting to a fully virtual model
    during COVID-19. It operates as a "full-stack provider group," directly employing more than 800 full-time W-2
    psychiatrists—making it the largest private employer of psychiatrists in the United States—and is in-network with
    more than 100 insurance plans covering 170 million-plus lives across 45 states. Talkiatry has delivered over 3
    million patient visits as of February 2026 and pairs psychiatrist-led medication management with measurement-based
    care and a proprietary AI-powered care platform. The company has raised over $400 million in total, most recently a
    $210 million oversubscribed Series D in February 2026 led by Perceptive Advisors, with a Banc of California debt
    facility. Talkiatry declined to disclose its valuation; a ~$1.4 billion unicorn mark has circulated but is
    industry-inferred, not company-confirmed.
