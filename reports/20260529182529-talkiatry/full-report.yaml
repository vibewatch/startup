      - number: '8.4'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              Because revenue is the single biggest unknown, the scenarios anchor on the ~$95 million Latka run-rate
              estimate and a plausible higher current figure given disclosed hypergrowth, then apply model-appropriate
              multiples. The bear case applies roughly 3x–5x to about $95 million for approximately $285 million–$475
              million, the outcome if growth has decelerated, a DEA telemedicine-prescribing rollback or DOJ enforcement
              hits the model, or payer concentration proves acute. The base case applies roughly 6x–10x to about $110
              million–$130 million for approximately $700 million–$1.3 billion, awarding a growth premium over
              LifeStance's ~2x and aligning with private-peer marks; this is the most evidence-consistent range from
              public data. The bull case applies roughly 10x–14x to about $130 million–$150 million for approximately
              $1.3 billion–$2.1 billion, but requires confirming strong gross margin, net revenue retention, and
              value-based traction.

              The inferred ~$1.4 billion mark sits at the top of the base case and the bottom of the bull case — a
              meaningful growth premium to public comps that is rich on visible evidence yet not implausible against
              Headway's $2.3 billion. The decisive sensitivity is the multiple-times-revenue grid: applying the ~2x
              public-services multiple to ~$95 million implies only about $190 million, so almost the entire distance to
              an inferred $1.4 billion is a growth-and-private premium that private financials must validate.
              Digital-health unicorn multiples have compressed from the 10x–15x revenue range of 2021 toward
              low-single-digit multiples by 2026, and psychiatrist labor-cost inflation pressures any asset-light
              narrative, both of which argue for caution at the top of the range.
            claimRefs:
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV042
