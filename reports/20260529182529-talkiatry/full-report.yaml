      - number: '7.2'
        title: Clinical, Workforce, and Quality Risk
        blocks:
          - type: paragraph
            body: >
              Talkiatry's identity as the "largest private employer of psychiatrists" in the United States is
              simultaneously a competitive moat and a workforce-concentration risk. The national backdrop is severe:
              HRSA projects a shortage of 43,660 adult psychiatrists by 2038, and as of December 2025, 40% of the U.S.
              population—137 million people—lives in a Mental Health Professional Shortage Area. Approximately 60% of
              practicing psychiatrists are 55 or older, raising near-term retirement risk. Nationally, 39% of
              psychiatrists reported experiencing burnout in the Medscape Physician Burnout Report 2024. Talkiatry
              claims its model generates 80% less burnout than the industry average and that 90% of its psychiatrists
              would recommend the practice, but these are company-reported figures unaudited by independent observers.

              Quality and acuity risk is structural. Talkiatry's current service scope concentrates on outpatient
              medication management for conditions including anxiety, depression, ADHD, bipolar disorder, and PTSD,
              explicitly excluding the highest-acuity patients; the company has signaled intent to expand across the
              acuity spectrum, but doing so introduces crisis management obligations that are inherently more difficult
              to fulfill via telemedicine. Telepsychiatry crisis response for suicidal patients carries documented
              limitations: confirming patient location, coordinating emergency services across jurisdictions, and
              maintaining connectivity during acute episodes are materially harder in a virtual setting. A clinical
              adverse event at scale—particularly involving a patient the platform should have stepped up to higher
              acuity—could attract both regulatory scrutiny and significant reputational damage.

              Supervision and quality-control at scale also carry risk. With 800+ employed psychiatrists across 45
              states, maintaining clinical consistency, peer oversight, and timely escalation protocols requires
              operational infrastructure that is difficult to audit from the outside. The company's 76 NPS rating and
              outcomes data come from self-reported internal studies; independent clinical-quality audits are not
              publicly available.
            claimRefs:
