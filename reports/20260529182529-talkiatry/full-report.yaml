      - number: '5.5'
        title: Compliance, trust, and product risks
        blocks:
          - type: paragraph
            body: >
              Talkiatry faces several interrelated product and compliance risks that represent material underwriting
              considerations.

              **Controlled-substance prescribing cliff**: The company's psychiatrists routinely prescribe Schedule II–V
              controlled substances (stimulants for ADHD, benzodiazepines for anxiety, controlled analgesics, etc.)
              under DEA telemedicine flexibilities extended through December 31, 2026 — the fourth such extension since
              COVID-19. These flexibilities waive the Ryan Haight Act's baseline requirement for an in-person patient
              evaluation before prescribing. If the DEA fails to finalize permanent telemedicine prescribing rules
              before year-end 2026, the in-person mandate automatically reinstates, disrupting care for every new
              patient needing controlled substances without a prior in-person visit. This is an existential operational
              risk given the prevalence of ADHD (stimulants) and anxiety (benzodiazepines) in Talkiatry's patient mix.
              The DEA is working toward a permanent "Advanced Telemedicine Prescribing Registration" for psychiatrists,
              but final rules remain unfinished as of May 2026.

              **Meta pixel class action**: A proposed class action in the U.S. District Court for the Central District
              of California (Case in front of Judge Sunshine S. Sykes) advanced in October 2025, with the court allowing
              claims of invasion of privacy and violation of the California pen register statute to proceed. The
              plaintiff alleges Talkiatry shared patient health information with Meta Platforms without consent. The
              outcome and potential damages are unknown; the ECPA and California Invasion of Privacy claims were
              dismissed.

              **Billing transparency and consumer complaints**: The Truth in Advertising Organization (TINA) published a
              consumer-adverse article in January 2024 after receiving multiple complaints about surprise bills above
              the advertised "$30 or less" average copay. Talkiatry updated its advertising following the TINA inquiry.
              Trustpilot shows a 2.7/5 overall rating from 566 reviews (November 2025 snapshot), with consistent themes
              of deceptive pricing, billing opacity, appointment cancellations, and poor communication. BBB complaints
              corroborate these patterns. These signals indicate a structural gap between the insurance billing workflow
              and patient-facing cost transparency.

              **HIPAA and privacy posture**: Talkiatry's privacy policy (effective January 1, 2026) explicitly states
              that Talkiatry Management Services is not the HIPAA-covered entity; the Medical Group (MCCD entities) is
              the HIPAA holder and issues the Notice of Privacy Practices. The policy permits de-identification and sale
              of de-identified data to third parties for analytics and research. The terms of use acknowledge risks
              including protocol failures that could result in PHI breaches. SOC 2 certification status is not publicly
              disclosed.

              **Product gaps**: Epic EMR incompatibility limits Talkiatry Connect's reach to cloud-only EMRs. No
              self-pay option means the product is inaccessible to the uninsured or those preferring cash-pay. Medicaid
              is excluded, limiting access for lower-income populations. The mobile app remains in beta. Telehealth
              infrastructure depends on a third-party vendor (healow/eClinicalWorks), creating vendor lock-in risk.
