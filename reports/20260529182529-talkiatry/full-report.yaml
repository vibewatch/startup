  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Patient-facing product and service scope
        blocks:
          - type: paragraph
            body: >
              Talkiatry's core patient product is an insurance-covered, virtual-first psychiatric practice accessible
              via web and a mobile app (iOS/Android). Onboarding begins with a short assessment that collects clinical
              history, insurance details, and clinician preferences; the platform then matches the patient with up to
              four in-network psychiatrists, with initial appointments typically bookable within days. Virtual visits
              use the healow™ platform (practice code FGCACD), a third-party telehealth infrastructure also providing
              secure messaging, health records, and appointment management. The Talkiatry native app (version 1.3.0,
              released April 29, 2026) remains in beta with self-rated 2.9/5 on the App Store (17 ratings), offering
              quick access to the healow portal, visit joining, appointment management, and education PDFs.

              The service scope spans eleven condition categories: ADHD, anxiety, bipolar disorder, children's mental
              health (ages 5–18), depression, OCD, postpartum conditions, mood disorders, insomnia, substance use
              disorder (SUD), and PTSD. Evaluation windows are 60 minutes for adult initial visits, 75 minutes for
              children and adolescents, and 30 minutes for follow-ups. Talkiatry explicitly excludes conditions
              requiring in-person administration — schizophrenia (injectable antipsychotics) is cited as a canonical
              out-of-scope case. The platform does not accept Medicaid and offers no self-pay or cash-pay option; all
              patients must have qualifying in-network insurance. Most patients pay an average estimated copay of $30,
              though actual out-of-pocket costs vary with plan deductibles and have generated significant consumer
              complaints about billing transparency. Talkiatry's insurance page added guidance following a Truth in
              Advertising investigation into its "$30 or less" advertising claims in January 2024.

              As of May 2026, Talkiatry has completed over 3 million patient visits and employs 800+ full-time
              psychiatrists with an average of 10 years of clinical experience, representing 26 subspecialties and
              speaking 32 languages. The company operates in 47 states, with insurance coverage through 100+ plans
              covering approximately 170 million commercial lives. Named "Best Virtual Care Platform" at the 2025
              MedTech Breakthrough Awards.
