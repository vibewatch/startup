      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural shortage is the durable demand engine
            body: >
              The 43,810-psychiatrist projected deficit by 2038, combined with 137M Americans in shortage areas and an
              average 48-day wait, creates demand that cannot be absorbed by in-person supply alone. Telepsychiatry is
              not a pandemic convenience—it is an access infrastructure gap-filler with multi-decade structural
              tailwinds.
            calloutType: strength
            claimRefs:
              - CM020
              - CM021
              - CM022
          - type: callout
            title: DEA prescribing cliff is a binary year-end 2026 risk
            body: >
              The Fourth Temporary Extension of telemedicine prescribing flexibilities expires December 31, 2026. If
              permanent DEA rules are not finalized before that date, Ryan Haight Act in-person visit requirements
              return, disrupting controlled-substance prescribing for ADHD, anxiety, and other conditions that commonly
              require Schedule II–IV medications via telemedicine.
            calloutType: risk
            claimRefs:
              - CM026
              - CM027
          - type: callout
            title: Parity fines signal a commercial market structure favorable to broad-network platforms
            body: >
              Georgia's $25M in insurer fines and Washington State's ongoing enforcement actions show that state-level
              MHPAEA enforcement is filling the federal enforcement void. Insurers under parity scrutiny have a direct
              financial incentive to expand their behavioral health provider networks, which structurally benefits
              platforms with large, credentialed, in-network psychiatrist panels.
            calloutType: insight
            claimRefs:
              - CM030
              - CM032
          - type: callout
            title: SAM / SOM estimates are directional only; no public data isolates in-network telepsychiatry
            body: >
              Published market sizing conflates global and domestic, telepsychiatry and broader behavioral health, and
              clinic revenue with all-payer billing. Talkiatry's specific SAM—U.S. in-network outpatient
              telepsychiatry—cannot be precisely sized from public data; a bottom-up model anchored to CPT billing
              volume, psychiatrist supply, and reimbursement rates is needed.
            calloutType: assumption
            claimRefs:
