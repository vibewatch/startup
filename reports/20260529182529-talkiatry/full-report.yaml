    title: Growth drivers and constraints table
    columns:
      - Driver / constraint
      - Direction
      - Timing
      - Implication for Talkiatry
      - Diligence ask
    rows:
      - - Psychiatrist supply shortage (43,810 projected deficit by 2038)
        - driver
        - Structural / multi-decade
        - Demand exceeds supply permanently in shortage areas; telehealth eliminates geographic mismatch
        - Map Talkiatry patient geography against HPSA designations to quantify coverage advantage
      - - 137M Americans in mental health shortage areas (40% of U.S. population)
        - driver
        - Current and worsening
        - Large addressable population with no viable in-person alternative; telehealth is primary access
        - Estimate conversion from HPSA population to Talkiatry's in-network insured cohort
      - - Medicare behavioral health telehealth—permanently expanded (no geo restriction, home-based)
        - driver
        - Permanent (effective 2023 onwards)
        - 65+ segment becomes durable; removes payer cliff risk for Medicare patients
        - Disclose revenue share from Medicare vs. commercial payers; Medicare Advantage network adequacy
      - - MHPAEA parity enforcement tightening at state level
        - driver
        - Short term (2025–2026 state-level)
        - Insurers under pressure to expand in-network psychiatric provider panels; favors large platforms
        - Quantify how many new insurer contracts Talkiatry has added in 2025–2026 parity enforcement wave
      - - 'Telehealth normalization: behavioral health is 65.6% of all U.S. telehealth visits in 2024'
        - driver
        - Current—structural shift complete
        - Reduced patient and provider hesitancy; referral pathways now assume virtual first for psychiatry
        - Measure patient satisfaction and no-show rates vs. in-person benchmarks
      - - Employer mental health investment (97% offer benefits, 73% cover telehealth; EAP market ~$6B)
        - driver
        - Ongoing; high-value EAP fastest-growing segment
        - >-
          Employer channel is an expanding top-of-funnel for in-network psychiatry; partnership with BetterHelp
          validates model
        - Get employer-sourced patient volume as share of Talkiatry total; assess EAP contract terms
      - - Rising mental health diagnoses and treatment-seeking (62.6% utilization increase 2018–2024)
        - driver
        - Trend continues
        - Growing eligible patient pool even without supply expansion
        - Assess Talkiatry's organic patient acquisition cost vs. employer-channel or health-system-referral cost
      - - DEA telemedicine prescribing flexibility expiration risk (current extension through Dec 31, 2026)
        - constraint
        - 'Binary risk: year-end 2026'
        - >-
          If permanent rules not finalized, controlled-substance prescribing (stimulants, benzodiazepines) reverts to
          requiring in-person visit; disrupts ~24% of medication patients
        - >-
          Request legal analysis of Talkiatry's exposure to Ryan Haight snapback; review DEA special registration
          rulemaking progress
      - - MHPAEA enforcement pause at federal level (2024 Final Rule not enforced)
        - constraint
        - Ongoing uncertainty; 18+ month non-enforcement stated
        - Commercial insurer network adequacy pressure partially relieved; slows payer contract expansion momentum
        - >-
          Track which states have adopted 2024 Rule provisions into state law and whether Talkiatry's key payers are in
          those states
      - - Ghost networks and prior authorization burden
        - constraint
        - Persistent structural
        - >-
          55% of Medicare Advantage listed behavioral health providers inactive; prior auth consumes 5–10% of session
          revenue; unit economics erosion
        - Obtain Talkiatry's prior authorization denial rate and administrative cost per clinical hour
      - - '54.7% treatment gap: most Americans with mental illness receive no treatment'
        - constraint
        - Structural; does not respond to telemedicine alone
        - Telehealth addresses access but not stigma, cost, and acuity barriers; limits total utilization ceiling
        - Assess patient attrition rates and cost-per-acquired-patient vs. cost-per-retained-patient
      - - Regulatory scrutiny of telemedicine prescribing (Cerebral $3.6M fine; Done Health criminal charges)
        - constraint
        - Active and escalating
        - >-
          DEA/DOJ standard disfavors volume-first, clinically unverified prescribing models; full-stack W-2 model with
          chart review is a compliance differentiator
        - Review Talkiatry's DEA audit trail, prescribing quality metrics, and any regulatory correspondence
      - - Clinician supply ceiling despite telepsychiatry's geographic flexibility
        - constraint
        - Structural / multi-decade
        - >-
          HRSA projects psychiatrist supply declining from 37,470 in 2026 to 36,550 by 2038; employer platform must
          retain psychiatrists vs. private practice alternatives
        - Obtain psychiatrist turnover rate and 12-month retention cohort data
