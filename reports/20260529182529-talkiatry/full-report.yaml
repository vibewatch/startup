  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >
              Talkiatry's clinical model depends on the DEA's fourth temporary extension of COVID-19 telemedicine
              prescribing flexibilities, which runs only through December 31, 2026. Under the Ryan Haight Act of 2008,
              practitioners must conduct an in-person evaluation before prescribing Schedule II–V controlled substances
              unless an exemption applies; the current emergency flexibilities constitute the sole broad exemption for
              remote prescribing of stimulants (ADHD), anxiolytics, and other controlled medications. The DEA issued a
              proposed Special Registration rule in January 2025 but the Trump administration has not moved to finalize
              it, and the DEA acknowledged a prior 41-day lapse in Medicare telehealth authority in October 2025 that
              caused a measurable decline in access. If permanent rules impose in-person evaluation requirements or
              registration burdens that Talkiatry's enrolled psychiatrists cannot satisfy, a material portion of
              Talkiatry's patient population—particularly those treated for ADHD with stimulants— could be disrupted.

              The privacy litigation risk is live and advancing. In October 2025, U.S. District Judge Sunshine S. Sykes
              in the Central District of California allowed Talkiatry's class action alleging unauthorized Meta Pixel
              data sharing to proceed on invasion-of-privacy and California pen-register-statute grounds, though she
              dismissed the Electronic Communications Privacy Act and CIPA claims. The case, Jane Doe et al. v.
              Talkiatry Management Services, LLC, is not an isolated event: U.S. healthcare providers paid more than
              $100 million in pixel-tracking penalties across 19 cases from 2023 to 2025. Peer Cerebral was fined $7
              million by the FTC and $3.6 million by DOJ/DEA for data sharing and prescribing violations, establishing
              regulatory willingness to penalize telehealth platforms.

              Mental Health Parity and Addiction Equity Act (MHPAEA) final rules finalized September 23, 2024 require
              health plans to submit comparative analyses of nonquantitative treatment limitations for mental health
              versus medical/surgical benefits. If payers face findings of material access disparities, they are
              required to take remedial actions including increasing MH/SUD provider reimbursement—a favorable pressure
              for Talkiatry—but the same enforcement framework could also trigger retrospective audits of Talkiatry's
              billing practices and prior authorization rates. Multi-state licensure compliance is a continuous
              operational obligation: Talkiatry operates in 45 states and each psychiatrist must hold an active license
              in the patient's state at time of service; COVID-era emergency waivers allowing cross-state practice have
              mostly expired.
