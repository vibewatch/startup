  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and investment stance
        blocks:
          - type: paragraph
            body: >-
              The recommendation for Talkiatry is track / research-more at the inferred unicorn-tier mark, with medium
              confidence, a high risk rating, and a valuation stance best described as stretched versus public
              comparables but defensible versus private peers pending private financials. The company is a genuinely
              strong operating business: it is the largest private employer of psychiatrists in the United States with
              more than 800 full-time clinicians, has delivered three million patient visits, is in-network with more
              than 100 insurers covering over 170 million lives, and reported management-disclosed revenue growth of
              1,745% between 2021 and 2024. The February 2026 Series D was oversubscribed and drew a credible
              institutional syndicate led by Perceptive Advisors with Sofina and prior leads Andreessen Horowitz,
              blisce/, and Left Lane Capital. Those facts support a premium private mark relative to slower-growing
              public services peers.

              The reason the call is not a buy is price discipline plus disclosure opacity, not company quality.
              Talkiatry has not disclosed annual recurring revenue, gross margin, net revenue retention, cash burn,
              EBITDA, or payer concentration, and it explicitly declined to comment on a valuation. The thesis
              (insurance-covered, outcomes-validated, value-based-ready psychiatry with the fastest growth in the
              category) and the anti-thesis (a labor-intensive psychiatrist-employment model, undisclosed unit
              economics, prescribing-regulatory exposure, and 2026 multiple compression) are both evidence-supported,
              which is exactly why the entry decision hinges on getting private data before underwriting an inferred
              ~$1.4 billion price.
            claimRefs:
