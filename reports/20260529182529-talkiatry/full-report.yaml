      - number: '3.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory overhang from DEA telemedicine prescribing rules
            body: >
              Talkiatry's compliance posture is differentiated from Cerebral and Done Global, but all telepsychiatry
              platforms — including compliant ones — face the risk that DEA's proposed January 2025 special registration
              rule (requiring 50% of Schedule II prescriptions to follow in-person visits) is finalized. If enacted,
              this rule would impose material clinical workflow changes on Talkiatry's ADHD practice and could increase
              patient acquisition friction across the platform's virtual-only model.
            calloutType: risk
            claimRefs:
              - CP015
              - CP016
              - CP017
              - CP030
          - type: callout
            title: Competitor regulatory failures create a compliance moat window
            body: >
              Cerebral's DOJ/DEA $3.6 million settlement, FTC $7 million+ payment, and controlled substance exit,
              combined with Done Global's criminal arrests, have structurally removed the two most aggressive
              ADHD-focused telepsychiatry platforms from the competitive landscape. Talkiatry's W-2 compliance model and
              avoidance of prescribing-at-scale incentive structures positions it favorably with payers, employers, and
              regulators at a critical market consolidation moment.
            calloutType: strength
            claimRefs:
              - CP015
              - CP016
              - CP017
              - CP025
              - CP029
          - type: callout
            title: Payer reimbursement compression threatens all in-network behavioral health platforms
            body: >
              Aetna's May 2026 rate cuts on Alma-contracted therapists illustrate that payers are exercising bargaining
              power against behavioral health network intermediaries as the sector scales. Talkiatry's W-2 cost
              structure means it absorbs payer rate changes directly into unit economics — unlike 1099 marketplaces that
              pass rate changes to contractors. An APA survey finding that ~35% of therapists already refuse insurance
              due to low reimbursement indicates the sector-wide supply-demand dynamic that could affect Talkiatry's
              margin trajectory if payer rates are compressed.
            calloutType: risk
            claimRefs:
              - CP024
