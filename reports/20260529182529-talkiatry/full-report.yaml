    title: 'Market estimate range: U.S. behavioral health and telepsychiatry sizing bands by publisher'
    type: range
    layout: wide
    summary: >
      The range chart preserves the spread of reputable publisher estimates for four closely related markets, making the
      boundary ambiguity visible rather than collapsing it to a point.
