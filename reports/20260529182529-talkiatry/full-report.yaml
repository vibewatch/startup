      - number: '4.3'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              Talkiatry's largest and most distinctive cost is its psychiatrist workforce. Unlike marketplace-model
              competitors that rely on independent contractors, the company directly employs 800+ full-time W-2
              psychiatrists with benefits. This creates a high fixed-cost structure relative to pure platform
              businesses: payroll, benefits, malpractice insurance, credentialing, and onboarding for 800 physicians
              represent a substantial recurring expense. The CEO explicitly acknowledged this in the STAT News Series D
              coverage, noting that the $210 million raise in part provides a financial cushion to maintain payroll in
              the event of revenue interruptions such as the 2024 Change Healthcare ransomware attack that disrupted
              claims processing across the industry.


              The per-visit economics are partially inferrable from public data. Talkiatry bills in-network psychiatric
              CPT codes — primarily 90791 (psychiatric diagnostic evaluation, initial visits of 60-75 minutes) and 90837
              (psychotherapy with E/M, follow-up visits) — at negotiated in-network rates. Medicare fee schedule
              benchmarks for these codes are approximately $155 for initial evaluations and $148 for 60-minute
              follow-ups (2025 national non-facility rates), though commercial payer rates are negotiated separately and
              typically higher. Psychiatrist compensation at Talkiatry is productivity-based: publicly disclosed on
              professional forums and student physician networks, the structure requires approximately 36 billable
              patient-hours per week to achieve top-tier compensation, with estimated earnings of $330,000-$400,000 for
              highly productive psychiatrists. This means psychiatrist labor costs are semi-variable (rising with visit
              volume), which provides some operating leverage at scale but also creates retention pressure if the
              productivity hurdle is perceived as onerous.


              Administrative leverage comes from the proprietary AI platform that the company describes as automating
              scheduling, billing, credentialing, and patient coordination. This is Talkiatry's primary technology moat:
              standardizing the workflow that private-practice psychiatrists find most burdensome (in-network
              credentialing, insurance billing, prior authorization) while maintaining full-time employment
              relationships. The platform also supports health system integration through EHR referral workflows. Gross
              margin, technology operating costs, and CAC are not disclosed. The company's claim of 80% less burnout
              than industry average and 90% clinician satisfaction survey scores are internally generated metrics cited
              in company materials; they indirectly support the argument that the W-2 model is economically sustainable
              from a retention perspective, but do not directly measure financial unit economics.
