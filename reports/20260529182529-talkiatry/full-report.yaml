  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and payer architecture
        blocks:
          - type: paragraph
            body: >-
              Talkiatry's primary revenue mechanism is fee-for-service in-network insurance reimbursement. The company
              submits claims against CPT codes for psychiatric evaluation and medication management visits to commercial
              payers and, increasingly, Medicare Advantage plans. As of the February 2026 Series D announcement,
              Talkiatry is in-network with more than 100 insurance plans covering more than 170 million commercially
              insured lives — a breadth that makes it one of the widest- access telepsychiatry networks in the United
              States. Patients enrolled in qualifying plans pay a standard co-pay or cost-share determined by their
              plan; the company collects the balance from the payer at negotiated in-network rates. Talkiatry has stated
              it does not determine or capture a patient's out-of-pocket cost directly but bills insurers at standard
              negotiated rates for medical services.


              Layered on top of the base fee-for-service model is a value-based care dimension that Andreessen Horowitz
              and company management have described as central to the strategic thesis. The company has disclosed a
              matched-cohort analysis by a leading national health plan showing Talkiatry patients had a 68% lower
              hospitalization rate, 32% fewer emergency room visits, and approximately $700 lower monthly per-member
              care costs versus similar patients treated elsewhere. These outcomes form the basis for Talkiatry's pitch
              to payers on risk-sharing or shared-savings arrangements. Specific contracts, revenue contribution, or
              PMPM/PEPM structure of value- based deals are not publicly disclosed. The Series C (June 2024)
              announcement specifically named growing value-based payer contracts as a primary use of proceeds, and the
              Series D (February 2026) reiterates enabling "innovative payment models with payers" as a funded priority.
              Revenue from these arrangements is therefore real but not separately measurable from public sources.


              A third channel — employer and health system partnerships — is formalized through the Mindshare Partner
              Program launched in late 2023. Under this program, health systems refer their own patients to Talkiatry
              psychiatrists when internal capacity is absent, integrating through existing EHR referral workflows. The
              AMGA partnership announced in April 2026 extends this model to AMGA's 175,000+ physician member
              organizations, which collectively serve one in three Americans. Revenue from these partnerships flows
              through the same in-network insurance billing mechanism; the health system channel functions as a
              distribution and patient- acquisition pathway rather than a separate revenue line.
