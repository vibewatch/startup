            title: W-2 employment model creates defensible quality moat
            body: >-
              Talkiatry's decision to employ all psychiatrists as full-time W-2 staff—rather than the contractor model
              used by most telehealth peers—enables meaningful quality control, continuity of care, and proprietary
              AI-driven workflow optimization. The peer-reviewed JMIR outcomes data and repeat institutional investment
