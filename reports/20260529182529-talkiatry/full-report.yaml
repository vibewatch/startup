      - number: '3.3'
        title: 'Substitute platforms and adverse regulatory signals: Cerebral, Done, BetterHelp, Array'
        blocks:
          - type: paragraph
            body: >
              The regulatory collapse of Cerebral and Done Global is a double-edged signal for Talkiatry. On one hand,
              it removes competitors from the ADHD medication-management segment and validates Talkiatry's compliant W-2
              model. On the other hand, the regulatory scrutiny of controlled substance prescribing via telemedicine
              remains a structural overhang on all telepsychiatry providers, including Talkiatry.

              Cerebral's trajectory is the most instructive adverse case. Founded in 2019 and at its peak valued at $4.8
              billion, Cerebral raised $462 million in total funding and achieved a prominent public profile before DOJ
              and DEA investigators found that it had encouraged the unauthorized distribution of controlled substances
              including Adderall from 2019 to 2022. In November 2024 Cerebral entered a non-prosecution agreement with
              the Eastern District of New York and agreed to pay $3.6 million (with an additional $2.92 million deferred
              payment contingent on 30-month compliance). Separately, Cerebral paid $7 million+ to the FTC over
              deceptive cancellation practices and sensitive data sharing. The company abandoned controlled substance
              prescribing entirely. Done Global's leaders faced criminal arrest in June 2024 for ADHD stimulant
              management violations. These outcomes illustrate that telepsychiatry platforms with aggressive prescribing
              practices face existential compliance risk.

              The DEA proposed in January 2025 a special telemedicine registration framework that would require
              practitioners prescribing Schedule II medications (Adderall, Ritalin) via telemedicine to (a) be
              physically located in the same state as the patient, and (b) issue at least 50% of their prescriptions
              after in-person appointments. If enacted, this rule would structurally disadvantage pure-play telemedicine
              ADHD platforms and benefit Talkiatry's compliant model, though Talkiatry also relies on DEA telemedicine
              flexibilities currently extended through December 2025.

              BetterHelp/Teladoc is a competitor primarily in the therapy segment: Q1 2026 revenue was $218.4 million,
              down 9% year-over-year, as cash-pay users declined. Insurance-covered sessions at BetterHelp reached
              approximately $13 million/quarter in Q1 2026 after Teladoc acquired UpLift (a virtual mental health and
              psychiatry platform). Teladoc management targets $125 million+ in annualized insurance revenue run rate by
              year-end 2026. BetterHelp's collaboration with Talkiatry, announced in September 2024, allows employers
              purchasing BetterHelp's platform to access Talkiatry's psychiatric services — converting what would be a
              pure substitute relationship into a complementary one. This partnership is evidence of Talkiatry's growing
              distribution reach without entering direct therapy competition.

              Array Behavioral Care is a health-system-facing telepsychiatry practice with 25+ years of experience and
              an Epic-based EHR platform that integrates with hospital workflows. Its 2025 partnership with TeamHealth
              for emergency department psychiatric support, its May 2026 outcomes report demonstrating
              industry-benchmark-outperforming depression and anxiety remission rates, and its CareConnect platform
              (integrating ED, outpatient community, and at-home virtual care) position Array as the B2B incumbent in
              the health-system-telepsychiatry channel. Array does not compete with Talkiatry for direct-to- consumer
              in-network patients; rather, it addresses a hospital-based referral population that Talkiatry could target
              through health system partnerships but has not publicly made its primary distribution.
