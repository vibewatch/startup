      - number: '8.5'
        title: Thesis-break triggers and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The triggers that would change the recommendation are designed to move the call, not just the narrative. A
              revenue print materially below the ~$95 million run-rate, or evidence of decelerating growth, would
              collapse the premium-multiple case and push the stance toward the bear range. A DEA
              telemedicine-prescribing rollback or a DOJ enforcement action — the precise dynamic that erased most of
              Cerebral's value — would re-rate the entire psychiatry-prescribing model downward regardless of growth.
              Disappointing gross margin driven by psychiatrist compensation, or disclosure of acute payer
              concentration, would each compress the defensible multiple. Conversely, confirmation of strong net revenue
              retention and material value-based revenue would support the bull case and could move the recommendation
              constructive.

              The minimum diligence set needed to convert this public-evidence view into an underwriteable one is
              concrete: current ARR and a monthly revenue bridge; product-level gross margin and psychiatrist cost
              structure; net revenue retention and patient cohort economics; payer mix and concentration; the Series C/D
              equity-versus-debt split; and the preferred-stock and liquidation-preference stack. Exit readiness is
              supportable in principle — LifeStance is a public-market precedent and behavioral-health assets remain
              acquisition targets for payer and health-system consolidators — but the 2026 window is selective. Until
              ARR, margin, retention, and cap-table detail are in hand, the disciplined posture is to track the company
              and revisit on disclosure or a lower price.
