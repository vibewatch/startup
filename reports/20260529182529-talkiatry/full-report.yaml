  - id: FU001
    title: Talkiatry patient journey map — from access to ongoing care
    type: journey-map
    layout: wide
    summary: How patients discover, access, and remain in Talkiatry care across the four primary intake channels.
    claimRefs:
      - CU001
      - CU004
      - CU006
      - CU011
      - CU020
      - CU031
    data:
      items:
        - label: Stage 1 — Awareness and channel entry
          description: >-
            Patient searches for in-network psychiatrist via insurer directory, Zocdoc, employer BetterHelp portal, or
            receives EHR-generated referral from HCA or AMGA member clinician. Self-pay patients cannot access
            Talkiatry; insurance verification is required before booking.
        - label: Stage 2 — Intake and matching
          description: >-
            Patient completes online symptom and insurance intake (73% finish in 20 minutes or less). Talkiatry matches
            patient to a psychiatrist based on condition, insurance plan, and state availability. BetterHelp therapist
            may trigger a direct referral to a matched psychiatrist.
        - label: Stage 3 — First evaluation (60 minutes)
          description: >-
            Full 60-minute initial psychiatric evaluation. Diagnosis, medication decision, and care plan established.
            GAD-7/PHQ-8 outcome measures administered at intake and tracked across visits. 89% of patients said
            medication initiation process was clear.
        - label: Stage 4 — Ongoing care (30-minute follow-ups)
          description: >-
            Follow-up appointments every 4-8 weeks for medication management. 92% of patients found it easy to request
            refills or dose changes. Patients may also access Talkiatry therapists if psychiatrist includes therapy in
            the care plan.
        - label: Stage 5 — Expansion or referral handoff
          description: >-
            Patients needing higher-acuity care (e.g., virtual IOP) are referred to Charlie Health. Lower-acuity
            patients from Charlie Health or NYCBS oncology teams are referred to Talkiatry for ongoing care. Health
            system partners receive coordinated care updates on diagnosis and medication via EMR.
        - label: Stage 6 — Churn or access discontinuation
          description: >-
            Patients whose insurance changes or whose plan exits Talkiatry's network lose access. No self-pay bridge
            option exists. Trustpilot reviews cite billing surprise and network confusion as a significant discontinuity
            trigger.
