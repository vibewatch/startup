        - Disclosed revenue materially below ~$95M run-rate or growth decelerates sharply
        - Premium-multiple case collapses
        - Move toward bear range; pass at an inferred unicorn price
      - - Prescribing-regulatory shock
        - DEA telemedicine-prescribing rollback or DOJ enforcement action
        - Re-rates the psychiatry-prescribing model downward (Cerebral precedent)
        - Apply a regulatory discount; require mitigation before entry
      - - Margin quality disappoints
        - Psychiatrist compensation suppresses gross margin
        - Labor-intensive model caps the defensible multiple
        - Cut the valuation range; extend diligence
      - - Payer concentration is acute
        - A small number of payers dominate revenue
        - Downside becomes contract-specific rather than platform-wide
        - Demand concentration mitigation and a higher discount
      - - Cap-table downside is unattractive
        - Heavy preferences or debt create weak downside protection
        - Entry discipline worsens even if the operating business is strong
        - Require a lower price or richer downside protection
