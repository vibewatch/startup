      - number: '6.4'
        title: Adoption, retention, and clinical outcomes
        blocks:
          - type: paragraph
            body: >
              Talkiatry's adoption trajectory is well-evidenced by cumulative visit milestones: the company hit 1
              million patient visits by approximately April 2024, surpassed 2 million in May 2025, and announced 3
              million by February 2026 — doubling visits in roughly 10 months from the first to second million and then
              again in nine months. The company's published peer-reviewed research offers the strongest available lens
              on patient retention and clinical impact. A December 2025 study in The Archives of Psychiatry (sourced
              from Talkiatry internal data on ~800 patients) identified an early dropout rate of 13.2%, notably below
              the 20-30% benchmarks typically observed in both traditional and virtual behavioral health settings. Key
              predictors of dropout were a weaker patient-clinician therapeutic alliance (2.6x higher dropout risk) and
              first-visit copays or deductibles exceeding $40 (2x higher dropout risk), reinforcing the company's
              in-network model as a structural retention advantage. Separately, the 2023 JMIR Formative Research
              peer-reviewed retrospective of 1,826 Talkiatry patients (GAD-7 and PHQ-8 validated scales) showed that
              after an average of five appointments over 15 weeks, 67% of anxiety patients and 62% of depression
              patients no longer had clinically significant symptoms, with 26% and 29% respectively achieving full
              remission. These outcomes were comparable across urban and rural geographies, supporting access equity
              claims. A Zocdoc case study noted that 65% of Talkiatry patients with anxiety or depression no longer
              reported clinically significant symptoms after approximately five visits. The HelpGuide survey of 100
              users found 92% rated it easy or very easy to request refills or dose changes, and 89% found medication
              initiation clear — indicating low friction in ongoing care management. Clinician satisfaction at Talkiatry
              is more mixed. Great Place to Work certified data show 84% of Talkiatry employees say it's a great place
              to work (vs. 57% for the typical U.S. company), and 96% feel welcomed when joining. However, archived
              Indeed reviews cite complaints about unpaid no-shows, high documentation burden, productivity-metric
              pressure, and below-expected compensation, with overall star ratings of 3.1-3.5/5 on employer review
              platforms. These clinician-side dynamics are relevant to customers because consistent psychiatric care
              depends on clinician stability and satisfaction.
