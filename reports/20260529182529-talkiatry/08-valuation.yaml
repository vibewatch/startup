company:
  name: Talkiatry
chapter:
  number: 8
  title: Valuation
  summary: >-
    Talkiatry closed an oversubscribed $210 million Series D in February 2026, lifting total disclosed capital above $400 million, but the company
    explicitly declined to disclose a post-money valuation; the widely circulated ~$1.4 billion figure is an industry-inferred unicorn mark, not a
    company-confirmed price. Against public behavioral-health services comps (Amwell ~0.6x, LifeStance ~2.1x, Talkspace ~3.3x EV/sales) and private
    insurance-access peers (Headway $2.3B, Grow Therapy >$1B), Talkiatry's psychiatrist-employment model most resembles labor-intensive LifeStance and
    therefore likely deserves a services multiple plus a growth premium rather than a software-like multiple. With ARR, gross margin, NRR, burn, and
    payer concentration all undisclosed, the recommendation is track / research-more: do not underwrite at an inferred ~$1.4 billion without private
    financials or a materially lower entry price, while a base-case of roughly $0.7B–$1.3B is the most evidence-consistent range from public data.

sections:
  - id: recommendation-and-investment-stance
    title: Recommendation and investment stance
    body: >-
      The recommendation for Talkiatry is track / research-more at the inferred unicorn-tier mark, with medium confidence, a high risk rating, and a
      valuation stance best described as stretched versus public comparables but defensible versus private peers pending private financials. The
      company is a genuinely strong operating business: it is the largest private employer of psychiatrists in the United States with more than 800
      full-time clinicians, has delivered three million patient visits, is in-network with more than 100 insurers covering over 170 million lives, and
      reported management-disclosed revenue growth of 1,745% between 2021 and 2024. The February 2026 Series D was oversubscribed and drew a credible
      institutional syndicate led by Perceptive Advisors with Sofina and prior leads Andreessen Horowitz, blisce/, and Left Lane Capital. Those facts
      support a premium private mark relative to slower-growing public services peers.

      The reason the call is not a buy is price discipline plus disclosure opacity, not company quality. Talkiatry has not disclosed annual recurring
      revenue, gross margin, net revenue retention, cash burn, EBITDA, or payer concentration, and it explicitly declined to comment on a valuation.
      The thesis (insurance-covered, outcomes-validated, value-based-ready psychiatry with the fastest growth in the category) and the anti-thesis (a
      labor-intensive psychiatrist-employment model, undisclosed unit economics, prescribing-regulatory exposure, and 2026 multiple compression) are
      both evidence-supported, which is exactly why the entry decision hinges on getting private data before underwriting an inferred ~$1.4 billion
      price.
    claimRefs:
      - CV001
