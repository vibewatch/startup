  - id: comparable-valuation-framework
    title: Comparable valuation framework
    body: >-
      Talkiatry is best triangulated against two comp families. The public family is behavioral-health and broad-telehealth services companies, which
      in 2026 trade at compressed revenue multiples: Amwell carries a roughly $164 million market cap on about $237 million trailing revenue (~0.6x
      EV/sales) and remains loss-making; LifeStance, the closest pure-play analog, carries a roughly $2.99 billion market cap on $1,424.3 million of
      2025 revenue (~2.1x EV/sales, ~18.5x EV/EBITDA) with $157.7 million adjusted EBITDA, 8,040 clinicians, and 572 centers; and Talkspace trades near
      a $871 million market cap on about $238 million revenue (~3.3x EV/sales). Teladoc's BetterHelp segment, the largest direct-to-consumer mental
      health asset, saw revenue fall 9% to $218.4 million in Q1 2026, illustrating multiple compression in the category. The public band is therefore
      roughly 0.6x–3.3x EV/sales, centered near LifeStance's ~2x.

      The private family is insurance-access mental-health platforms. Headway reached a $2.3 billion valuation on its July 2024 Series D (a 130%
      step-up), Grow Therapy raised $150 million in 2026 after a 2024 Series C that crossed the $1 billion unicorn line, and Brightside and Array
      Behavioral Care sit far lower. The cautionary anchor is Cerebral, which hit ~$4.8 billion in December 2021 before collapsing amid Department of
      Justice scrutiny of its controlled-substance prescribing — a direct warning for prescribing-heavy telepsychiatry. Because Talkiatry directly
      employs its psychiatrists rather than operating an asset-light marketplace, its economics most resemble LifeStance, so the disciplined frame is a
      LifeStance-like services multiple plus a growth premium justified by insurance breadth and outcomes — not a SaaS-marketplace multiple.
    claimRefs:
