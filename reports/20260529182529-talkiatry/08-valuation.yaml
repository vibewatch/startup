  - id: TV004
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bear
        - Revenue near ~$95M with decelerating growth; no premium beyond public services comps
        - ~3x-5x on ~$95M revenue → ~$285M-$475M
        - DEA prescribing rollback / DOJ enforcement, payer concentration, margin compression
        - Plausible if growth slowed or a regulatory shock lands
      - - Base
        - Growth premium over LifeStance's ~2x; current revenue ~$110M-$130M
        - ~6x-10x on ~$110M-$130M → ~$700M-$1.3B
        - Retention, gross-margin quality, and cap-table unknowns
        - Most evidence-consistent range from public data and private-peer marks
      - - Bull
        - Revenue materially above estimate with strong margins and value-based traction
        - ~10x-14x on ~$130M-$150M → ~$1.3B-$2.1B
        - Requires confirming NRR, gross margin, and value-based revenue
        - Possible, but dependent on private facts not yet disclosed
    notes: Scenario ranges are estimated, anchored on a low-reliability third-party revenue figure; they are decision aids, not a substitute for management data.
    claimRefs:
      - CV006
      - CV028
      - CV029
      - CV030
      - CV031
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Revenue support fails
        - Disclosed revenue materially below ~$95M run-rate or growth decelerates sharply
        - Premium-multiple case collapses
        - Move toward bear range; pass at an inferred unicorn price
      - - Prescribing-regulatory shock
        - DEA telemedicine-prescribing rollback or DOJ enforcement action
        - Re-rates the psychiatry-prescribing model downward (Cerebral precedent)
        - Apply a regulatory discount; require mitigation before entry
      - - Margin quality disappoints
        - Psychiatrist compensation suppresses gross margin
        - Labor-intensive model caps the defensible multiple
        - Cut the valuation range; extend diligence
      - - Payer concentration is acute
        - A small number of payers dominate revenue
        - Downside becomes contract-specific rather than platform-wide
        - Demand concentration mitigation and a higher discount
      - - Cap-table downside is unattractive
        - Heavy preferences or debt create weak downside protection
        - Entry discipline worsens even if the operating business is strong
        - Require a lower price or richer downside protection
    notes: Triggers are constructed to change the recommendation; each maps to a monitorable event tied to the valuation stance.
    claimRefs:
      - CV022
      - CV027
      - CV032
      - CV033
      - CV039
      - CV040
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Current ARR / revenue
        - Latest revenue, ARR definition, and a monthly bridge
        - Single biggest driver of every valuation lens
        - CFO / finance data room
      - - Gross margin & psychiatrist cost
        - Product-level gross margin and clinician compensation structure
        - Determines whether a services-plus-premium multiple is justified
        - Finance + clinical operations
      - - Retention & cohort economics
        - NRR, GRR, patient cohort retention, and expansion
        - Separates growth optics from durable value
        - Revenue operations / board pack
      - - Payer mix & concentration
        - Revenue by payer and top-payer concentration
        - Tests platform-wide vs contract-specific downside
        - FP&A + payer contracting
      - - Capital structure
        - Series C/D equity-vs-debt split, preferred stack, liquidation preferences
        - Downside protection matters as much as topline in late-stage entries
        - Legal + finance
      - - Valuation confirmation
        - Company-confirmed post-money for the Series D
        - The ~$1.4B mark is industry-inferred, not confirmed
        - Investor documents / cap-table review
    notes: These asks are the minimum data set required to convert a public-evidence view into an investment-ready underwriting view.
    claimRefs:
      - CV003
      - CV032
      - CV033
      - CV041

