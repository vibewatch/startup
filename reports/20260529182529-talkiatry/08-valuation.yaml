  - id: financing-context-and-valuation-anchor
    title: Financing context and the valuation anchor
    body: >-
      The latest financing anchor is the $210 million Series D announced on February 12, 2026, which the company described as oversubscribed and which
      brought total raise to date to over $400 million, consistent with Tracxn's record of roughly $400 million across seven rounds. Crucially, every
      primary account is consistent that Talkiatry did not disclose a valuation: Fierce Healthcare reported flatly that "Talkiatry is not disclosing
      its valuation," and STAT News reported that the company "declined to comment on a new company valuation or its progress toward profitability."
      The frequently repeated ~$1.4 billion figure is therefore an industry-inferred unicorn mark rather than an official price; notably, $1.4 billion
      was the median valuation of new 2026 unicorns tracked by Crunchbase and PitchBook, which is the lens through which Talkiatry's round was popularly
      framed. No named investor has publicly confirmed a specific post-money value.

      Two structural caveats matter for entry discipline. First, the $210 million headline blends equity with a debt facility from Banc of California,
      and the equity-versus-debt split was not disclosed, so the figure may overstate net new equity. Second, the only public revenue anchor is a
      third-party Latka estimate of approximately $94.7 million for 2025, which is low reliability because the same database carries factual errors
      about the company. CEO Robert Krayn framed part of the raise as a payroll cushion against revenue interruptions, citing the 2024 Change Healthcare
      ransomware disruption — useful color on capital purpose but not a substitute for disclosed economics.
    claimRefs:
