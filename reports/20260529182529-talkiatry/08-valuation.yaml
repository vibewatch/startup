  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - What would change the view
    rows:
      - - Talkiatry has the widest in-network psychiatry footprint in the category (100+ payers, 170M lives) and validated clinical outcomes.
        - If disclosed revenue, retention, and margins are materially weaker than the growth narrative implies, the premium case weakens.
      - - Fastest-growth profile (management-cited 1,745% 2021-2024) plus value-based optionality can justify a premium private mark.
        - If growth has decelerated post-2024 or value-based revenue is immaterial, the multiple should converge toward public services comps.
      - - A direct-employment psychiatrist model gives quality control and a defensible referral position with health systems.
        - If psychiatrist compensation compresses gross margin, the labor-intensive model caps the multiple below software-like peers.
      - - Private insurance-access peers (Headway $2.3B, Grow >$1B) corroborate $1B+ marks for high-growth insurance models.
        - If those peers are asset-light marketplaces with structurally better margins, their marks over-state Talkiatry's fair multiple.
      - - Disclosure opacity and prescribing-regulatory exposure dominate the entry decision today.
        - If management provides ARR, gross margin, NRR, payer mix, and cap-table detail, the recommendation could move constructive.
    notes: The anti-thesis is primarily about price, missing economics, and regulatory exposure, not about whether Talkiatry is a real, high-quality business.
