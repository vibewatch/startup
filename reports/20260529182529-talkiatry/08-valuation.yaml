  - id: TV003
    title: Comparable valuation table
    columns:
      - Comparable
      - Type / metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    rows:
      - - LifeStance Health (LFST)
        - Public; EV/sales + EV/EBITDA
        - ~$2.99B market cap on $1,424.3M 2025 revenue; ~2.1x EV/sales; ~18.5x EV/EBITDA
        - Closest public pure-play; employed-clinician outpatient mental-health services
        - Slower growth (~14%) and in-person mix; payor concentration risk
      - - Talkspace (TALK)
        - Public; EV/sales
        - ~$871M market cap on ~$238M revenue; ~3.3x EV/sales
        - Public mental-health telehealth with B2B insurance pivot
        - Therapy/DTC mix, not psychiatry-led medication management
      - - Teladoc / BetterHelp (TDOC)
        - Public segment; revenue trend
        - BetterHelp Q1 2026 revenue $218.4M, down 9%; segment multiple compressing
        - Largest DTC mental-health asset; category demand signal
        - DTC cash-pay model declining; different acquisition motion
      - - Amwell (AMWL)
        - Public; EV/sales
        - ~$164M market cap on ~$237M revenue; ~0.6x EV/sales; loss-making
        - Broad telehealth services floor comp
        - Distressed multiple; weaker growth and profitability
      - - Headway
        - Private; last round valuation
        - $2.3B at July 2024 Series D ($100M; 130% step-up); ~$326M raised
        - Insurance-access mental-health platform; payer breadth parallel
        - Asset-light three-sided marketplace, not employed psychiatrists
      - - Grow Therapy
        - Private; funding/valuation
        - $150M raised in 2026; prior $88M 2024 Series C crossed >$1B unicorn line
        - Insurance-access mental-health platform; recent private mark
        - Marketplace model and undisclosed current post-money
      - - Brightside Health
        - Private; funding
        - $33M round (2024) for Medicare/Medicaid expansion; current valuation undisclosed
        - Virtual mental-health peer expanding into government payers
        - Smaller scale; no recent disclosed valuation
      - - Array Behavioral Care
        - Private; funding/status
        - ~$49M raised; Series C; acquired by Harbour Point Capital
        - Long-standing telepsychiatry provider (founded 1999)
        - Much smaller; sponsor-owned; opaque economics
      - - Cerebral (cautionary)
        - Private; peak valuation then collapse
        - ~$4.8B (Dec 2021, SoftBank) from $1.2B; collapsed amid DOJ prescribing scrutiny
        - Downside analog for prescribing-heavy telepsychiatry
        - Different (DTC, controlled-substance) model; pandemic-era mark
    notes: >-
      Public multiples computed from market caps and revenues retrieved on the 2026-05-29 run date; private marks are last-disclosed round valuations
      and are not mark-to-market. Cerebral is included as a downside cautionary anchor, not a positive comp.
    enumerationScope:
