callouts:
  - calloutType: risk
    title: DEA prescribing cliff risk — expiry on December 31, 2026
    body: >
      The DEA's fourth temporary extension expires at year-end 2026. There is no finalized
      permanent rule; the Trump administration has not advanced the Biden-era Special Registration
      proposal. A lapse would require all Talkiatry psychiatrists to obtain an in-person patient
      evaluation before prescribing Schedule II–V substances—structurally incompatible with a
      fully virtual model. This is the single highest-severity regulatory kill criterion.
    claimRefs:
      - CR001
      - CR002
      - CR003

  - calloutType: risk
    title: Live class action — Meta Pixel privacy claims survived motion to dismiss
    body: >
      The October 2025 ruling in Jane Doe et al. v. Talkiatry Management Services, LLC means
      the company faces ongoing class-action exposure for invasion of privacy and California pen
      register violations. The U.S. healthcare pixel-tracking enforcement wave has already
      produced $100M+ in penalties. Talkiatry's patient population—mental health patients whose
      data is uniquely sensitive—raises both the regulatory and reputational stakes.
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR007

  - calloutType: recommendation
    title: Diligence priorities before committing capital
    body: >
      Before committing capital, investors should obtain: (1) confirmation of Talkiatry's
      DEA registration and prescribing protocol for each controlled substance category and its
      contingency plan if flexibilities lapse; (2) full terms of the Banc of California debt
      facility including covenants; (3) psychiatrist voluntary turnover rate and credentialing
      cycle times; (4) the current litigation defense posture and reserve for the Meta Pixel
      class action; and (5) audited financials including burn rate and cash balance.
    claimRefs:
      - CR001
      - CR003
      - CR026
      - CR027
      - CR032

