  - id: section-operational
    title: Operational, Multi-State, and Technology Risk
    body: >
      Talkiatry's operational risk is concentrated in three areas: scheduling infrastructure,
      multi-state regulatory compliance, and technology platform reliability. As of February 2026,
      the company has delivered 3 million patient visits, but the national average wait time for
      behavioral health services remains 48 days (National Council for Mental Wellbeing, 2025).
      Demand materially outstrips supply, meaning any scheduling bottleneck—caused by psychiatrist
      turnover, technology failure, or payer credentialing delays—directly translates into patient
      abandonment and lost revenue.

      Operating in 45 states creates a complex, continuously evolving compliance matrix. Each
      psychiatrist must hold an active medical license in the state where the patient is located
      at time of service. State-specific telehealth registration requirements, prescription drug
      monitoring program (PDMP) checks, prescribing rules, and privacy statutes (e.g., California's
      CMIA, CCPA) must all be tracked and maintained. Credentialing delays when adding new
      psychiatrists to payer panels can create months-long gaps between hire and revenue generation,
      worsening fixed-cost exposure.

      Talkiatry's AI-powered proprietary platform automates scheduling, billing, patient engagement,
      and care coordination for 800+ psychiatrists. Platform downtime or data integrity failure
      would simultaneously disrupt clinical operations across all 45 states. The company's patient
      database—drawn from 3 million visits covering sensitive mental health diagnoses, medication
      histories, and therapy notes—represents a high-value cybersecurity target. A breach would
      trigger HIPAA notification obligations, potential OCR enforcement, and class-action exposure
      compounding the existing Meta Pixel litigation. HHS OCR settled a behavioral health provider
      HIPAA investigation in July 2025, demonstrating active enforcement in the sector. Health
      system EMR integration, required by the Mindshare program for referral workflows, introduces
      additional data-flow complexity and third-party dependency risk.
