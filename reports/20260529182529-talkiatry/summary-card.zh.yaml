summary:
  headline: >
    Talkiatry 是网内远程精神科服务的品类龙头，拥有 800+ 名雇佣制精神科医生、广泛支付方覆盖和已验证疗效；但 W-2 模式重人力、单位经济性完全未披露、处方监管风险高，约 $1.4B 推断估值也未确认，因此更适合观察 /
    继续研究，而不是立即承销。
