  topStrengths:
    - 网内远程精神科龙头地位明确：800+ 名直接雇佣的 W-2 持证精神科医生（美国最大私人精神科医生雇主），与 100+ 个计划完成全栈支付方签约，覆盖 170M+ 参保人，累计完成 3M+ 次患者就诊。
    - >-
      临床结果已获验证，也保留价值医疗可选性：经同行评审的 JMIR 数据显示，约 5 次就诊后，67%（焦虑）和 62%（抑郁）患者达到临床不显著症状水平，退出率明显低于行业基准，并为一家全国性健康计划最高降低 $700 PMPM
      成本。
    - >-
      长期顺风和投资人信心都强：精神科医生结构性短缺（137M 美国人位于短缺地区；预计到 2038 年缺口约 43,660 人）、Medicare 行为健康远程医疗永久扩容、平价法执行，以及 Perceptive Advisors
      领投、a16z 和 Left Lane 回归的超额认购 $210M Series D 轮。
  topRisks:
    - >-
      监管 / 处方基础脆弱：业务依赖 DEA 远程医疗受控物质灵活政策，该政策将于 2026 年 12 月 31 日到期，永久规则尚未敲定；行业背景里还有 Cerebral 遭 DOJ/FTC 执法、Done Global
      高管被刑事逮捕。
    - >-
      隐私诉讼仍在推进，声誉也被拖累：Meta Pixel 患者数据集体诉讼在 2025 年 10 月未被驳回，TINA.org 审查“$30 or less”广告，2.7/5 消费者评分（三年内 200+ 起 BBB
      投诉）集中指向账单不透明。
    - >-
      财务不透明且资本消耗重：W-2 雇佣成本结构叠加累计融资 $400M+，但烧钱速度、现金跑道、毛利率、NRR、ARR、支付方集中度，以及 Series D 轮股权 / 债务拆分均未披露，约 $1.4B
      推断估值无法用公开数据验证。
  unresolvedGaps:
    - 当前 ARR、收入桥、毛利率、净收入留存和队列经济性仍缺失；这些是拿公开可比公司（Amwell 约 0.6x、LifeStance 约 2.1x、Talkspace 约 3.3x EV/sales）校验倍数的核心输入。
    - 经确认的 Series D 轮投后估值、$210M 标题融资中的股权与债务拆分，以及优先股和清算优先权堆叠仍未披露。
    - 重人力的精神科医生雇佣模式下，现金消耗、现金跑道和支付方组合 / 集中度仍待确认。
    - DEA 永久远程医疗处方规则是否会在 2026 年 12 月 31 日后保留当前受控物质灵活性，仍未确定。
