      - number: '7.2'
        title: 临床、劳动力与质量风险
        blocks:
          - type: paragraph
            body: >
              Talkiatry 作为美国「最大的精神科医生私营雇主」，既是竞争护城河，也是劳动力集中风险。全国背景严峻：HRSA 预计到 2038 年成人精神科医生短缺 43,660 名；截至 2025 年 12 月，美国
              40% 的人口——137 million 人——生活在精神卫生专业人员短缺区。约 60% 在业精神科医生年龄在 55 岁或以上，带来近期退休风险。全国范围内，39% 的精神科医生在 Medscape
              Physician Burnout Report 2024 中称自己经历倦怠。Talkiatry 声称其模式比行业平均少 80% 倦怠，并称 90%
              的精神科医生会推荐该诊所，但这些都是公司自报数据，未经独立观察者审计。

              质量和病情严重度风险具有结构性。Talkiatry 当前服务范围集中在门诊药物管理，覆盖焦虑、抑郁、ADHD、双相情感障碍和 PTSD
              等病症，并明确排除最高严重度患者；公司已表示有意沿病情严重度谱系扩展，但这会引入危机管理义务，而远程医疗天然更难完成。针对自杀患者的远程精神科危机响应有已记录的局限：确认患者位置、跨辖区协调急救服务、在急性发作期间保持连接，在虚拟环境中都明显更难。规模化平台一旦发生临床负面事件——尤其涉及本应升级到更高强度照护的患者——可能同时招致监管审查和重大声誉损害。

              规模化监督和质量控制也有风险。800+ 名雇佣制精神科医生分布在 45 个州，要维持临床一致性、同侪监督和及时升级协议，需要外部很难审计的运营基础设施。公司的 76 NPS
              评分和结局数据来自自报内部研究；独立临床质量审计尚未公开。
