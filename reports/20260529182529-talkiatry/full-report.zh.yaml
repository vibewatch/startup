      - number: '8.3'
        title: 可比估值框架
        blocks:
          - type: paragraph
            body: >-
              Talkiatry 最适合用两组可比公司三角定位。上市组是行为健康和广义远程医疗服务公司；2026 年这些公司收入倍数已经压缩：Amwell 约 $164 million 市值，基于约 $237 million
              过去十二个月收入（约 0.6x EV/sales），且仍在亏损；最接近的纯标的 LifeStance 市值约 $2.99 billion，2025 年收入 $1,424.3 million（约 2.1x
              EV/sales、约 18.5x EV/EBITDA），调整后 EBITDA 为 $157.7 million，拥有 8,040 名临床医生和 572 个中心；Talkspace 市值约 $871
              million，基于约 $238 million 收入（约 3.3x EV/sales）。Teladoc 旗下最大的直面消费者（DTC）心理健康资产 BetterHelp，在 2026 年 Q1 收入下降 9%
              至 $218.4 million，说明品类倍数继续压缩。因此，上市公司区间大约是 0.6x–3.3x EV/sales，中心接近 LifeStance 的约 2x。

              非上市组是保险可及型心理健康平台。Headway 在 2024 年 7 月 Series D 达到 $2.3 billion 估值（较上一轮上升 130%），Grow Therapy 在 2026 年融资
              $150 million，此前 2024 年 Series C 已跨过 $1 billion 独角兽线；Brightside 和 Array Behavioral Care 估值低得多。警示锚点是
              Cerebral：它在 2021 年 12 月达到约 $4.8 billion，后因美国司法部 审查其管制物质开方而崩塌——这对开方较重的远程精神科是直接警告。因为 Talkiatry
              直接雇佣精神科医生，而不是运营轻资产市场平台，其经济模型更接近 LifeStance；因此有纪律的框架应是类似 LifeStance 的服务倍数，加上由保险覆盖广度和结局支撑的增长溢价，而不是
              SaaS/市场平台倍数。
