      - number: '6.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 13.2% 早期脱落率支撑留存优势
            body: >
              2025 年 12 月发表在 The Archives of Psychiatry 的同行评审研究发现，Talkiatry 的早期脱落率为 13.2%，显著低于传统和虚拟心理健康场景 20-30%
              的基准。研究发现，治疗联盟比疾病严重程度更能预测留存，且可负担性（自付额 ≤ $40）会显著降低脱落；这与 Talkiatry 的网络内模式作为结构性差异点直接一致。这是公开来源中关于患者留存质量的最强独立证据。
            calloutType: strength
            claimRefs:
              - CU032
              - CU033
              - CU034
          - type: callout
            title: 账单惊讶和保险混乱是持续负面信号
            body: >
              Talkiatry 的 Trustpilot 评分为 2.7/5（566 条评论），TINA 也记录了围绕「$30 or
              less」成本说法的广告投诉；这些都反映患者成本预期与实际账单结果之间存在系统性落差。相信自己保险被接受的患者，曾报告 $334 到 $550+ 的自付账单。TINA 调查后，Talkiatry 移除了「$30
              or less」广告（2024 年 12 月）。该平台的患者价值主张依赖「可负担、网络内」照护，反复出现的账单惊讶就是实质性的留存和声誉风险。
            calloutType: risk
