  - id: FM001
    title: 市场规模视角：Talkiatry 的 TAM / SAM / SOM 金字塔
    type: pyramid
    layout: standard
    summary: |
      三层金字塔展示 $76B–$500B 的整体行为健康市场，如何收窄到 Talkiatry 实际可触达的网内门诊远程精神科空间。
    data:
      items:
        - label: TAM — 美国行为健康（临床治疗）
          value: $76B–$97B (2025)
          detail: >
            发布方给出的 2025 年美国行为健康临床服务范围：Mordor（$76.25B）、Fortune Business Insights（$92.14B）和
            TowardsHealthcare（$96.9B）。不包括加入 IDD、自闭症、EAP 和健康管理后达到 $400–500B 的宽口径定义。
        - label: SAM — 美国门诊精神科和远程精神科
          value: $11B–$26B (2025 estimate)
          detail: >
            Grand View Research 的精神科诊所市场为 $10.96B（2025 年）。Covenant Health Advisors 将更广义的门诊精神科板块估为 $25.9B（2023 年），说明 SAM
            取决于边界，介于 $11B 与 $26B 之间。没有单一公开来源单独拆出美国网内远程精神科。
        - label: SOM — Talkiatry 可触达的网内远程精神科
          value: Not precisely isolable from public data
          detail: >
            Talkiatry 通过 100+ 个付款方覆盖 170M+ 参保人。2024 年，远程医疗在美国行为健康远程就诊中占比达到 65.6%。仅凭公开市场数据无法推导精确
            SOM；需要从报销费率和可服务的精神科医生产能自下而上建模。
    approximationNotes: |
      SAM 区间使用公开可得的精神科诊所市场估算，不是 Talkiatry 管理层预测。没有专有收入和付款方组合数据，无法精确估算 SOM。金字塔是方向性展示，不做算术加总。
