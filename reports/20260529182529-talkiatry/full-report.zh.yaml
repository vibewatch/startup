      - number: '8.2'
        title: 融资背景与估值锚点
        blocks:
          - type: paragraph
            body: >-
              最新融资锚点是 2026 年 2 月 12 日宣布的 $210 million Series D。公司称该轮获得超额认购，并使累计融资超过 $400 million，这与 Tracxn 记录的约 $400
              million、7 轮融资一致。关键在于，所有主要报道口径都一致表明 Talkiatry 没有披露估值：Fierce Healthcare 直接报道称「Talkiatry 不披露估值」，STAT News
              则报道公司「拒绝评论新的公司估值或盈利进展」。因此，反复出现的约 ~$1.4 billion 数字，是行业推断的独角兽价格，而非官方价格；值得注意的是，$1.4 billion 是 Crunchbase 和
              PitchBook 跟踪的 2026 年新独角兽估值中位数，外界正是用这副镜头来解读 Talkiatry 这一轮。没有任何具名投资者公开确认过具体投后估值。

              两个结构性限制关系到入场纪律。第一，$210 million 的披露总额混合了股权和 Banc of California
              债务额度，且股权与债务拆分未披露，因此该数字可能高估净新增股权。第二，唯一公开收入锚点是第三方 Latka 对 2025 年约 $94.7 million
              的估计；可信度较低，因为同一数据库对公司还存在事实错误。CEO Robert Krayn 将部分融资描述为应对收入中断的工资缓冲，并引用 2024 年 Change Healthcare
              勒索软件事件；这有助于理解资本用途，但不能替代已披露经济数据。
