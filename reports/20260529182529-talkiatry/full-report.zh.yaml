  - id: FM004
    title: 患者采用漏斗：从心理疾病患病率到网内远程精神科
    type: funnel
    layout: standard
    summary: |
      漏斗展示治疗缺口、准入障碍和远程医疗常态化，分别在潜在患者转化为活跃远程精神科用户时产生影响的位置。
    data:
      items:
        - label: 美国患有任何心理疾病的成年人（2024 年，百万）
          value: 62
          detail: Mordor Intelligence 引用的 SAMHSA 2025 数据显示，2024 年约 6200 万名美国成年人患有任何心理疾病，约占成年人口 ~23%。
          claimRefs:
            - CM042
        - label: 寻求或接受过任何心理健康治疗的成年人（百万）
          value: 28
          detail: 2024 年，54.7% 的心理疾病成年人没有接受治疗，因此约 45%（~28M）获得某种形式照护。远程医疗能降低准入障碍，但无法完全消除污名或成本问题。
          claimRefs:
            - CM042
        - label: 拥有覆盖门诊精神科照护保险的成年人（百万，估算）
          value: 24
          detail: 寻求治疗者中约 85-90% 有保险；97% 的大型雇主计划提供心理健康福利，Medicare/Medicaid 进一步提供覆盖。估算寻求治疗者中约 24M 人有保险。
          claimRefs:
            - CM034
            - CM028
        - label: 通过行为健康远程医疗渠道触达的成年人——所有提供方（百万，估算）
          value: 12
          detail: 2024 年，所有提供方合计产生 66.4M 次行为健康远程就诊。按每名独立患者约 4-5 次就诊估算，2024 年使用行为健康远程医疗的独立患者约 12-15M 人。
          claimRefs:
            - CM016
            - CM017
        - label: 远程医疗打开短缺地区后，可由网内远程精神科触达的成年人（百万，估算）
          value: 5
          detail: 137M 名美国人生活在 HPSA；远程精神科为短缺地区商业保险患者移除地理障碍。这是对虚拟交付解锁的增量网内人群的保守估算。
          claimRefs:
            - CM020
            - CM022
        - label: 活跃网内远程精神科用药管理项目中的患者（百万，估算）
          value: 2
          detail: 网内全栈平台只占行为健康远程医疗的一小部分，但增长很快。Talkiatry 截至 2026 年 2 月报告累计 3M+ 次就诊；活跃患者数明显小于累计就诊次数。
          claimRefs:
            - CM001
            - CM015
    approximationNotes: >
      漏斗各步数值混合了已发布的市场层面统计和推导估算。45% 接受治疗的数字由 54.7% 未治疗率估算得出。参保人占比估算只具方向性。就诊级数据（66.4M 次就诊）不等同于独立患者。Talkiatry 累计就诊次数来自第 1
