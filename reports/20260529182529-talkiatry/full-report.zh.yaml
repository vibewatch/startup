      - number: '2.4'
        title: 增长驱动与结构性顺风
        blocks:
          - type: paragraph
            body: >
              五个结构性驱动为 Talkiatry 模式带来持久需求。第一，精神科医生供给短缺是最大的结构性驱动。HRSA 2025 年 12 月 Behavioral Health Workforce Brief 确认，美国
              40% 人口（137M 美国人）生活在指定心理健康专业人员短缺区，全国行为健康服务平均等待时间为 48 天，10 名心理学家中已有 6 名拒收新患者。即便按当前使用模式，HRSA 预计到 2038
              年成人精神科医生缺口为 43,810 名；若计入未满足需求，短缺规模要大得多。HRSA 还预计，成人精神科医生供给将从 2026 年的 37,470 名降至 2038 年的 36,550 名，而年需求会增长
              40.7%。远程精神科可以缓解地理错配，但不能增加总供给。第二，Medicare 行为健康远程医疗永久扩展，消除了此前压制投资的报销不确定性。没有地理或发起地点限制，且居家就诊可永久报销后，Medicare
              患者成为持久市场细分。2026 年《综合拨款法》进一步把非行为健康远程医疗弹性延长至 2027 年 12 月 31 日。第三，心理健康平价执法正抬高商业保险方的网络充足性门槛。2024 年 MHPAEA
              Final Rule
              虽因诉讼目前未在联邦层面执行，但已被若干主要商业保险市场的州法律纳入（Georgia、Washington、Colorado、California、Maryland），形成一个奖励网络内服务方规模的全国基线。Georgia
              一州在 2026 年初就因平价违规对保险方开出 $25M 罚款，说明执法环境有利于广网络保险承运人，也有利于拥有大型医生池的精神科平台。第四，远程医疗常态化已经改变患者和服务方预期：2024
              年行为健康占美国所有远程医疗就诊 65.6%，说明虚拟心理健康已进入主流，不再是实验。第五，雇主是需求放大器：97% 提供心理健康福利，73% 覆盖远程心理健康，而每名员工每月 $10–$14 的创新
              EAP，为网络内服务方提供雇主出资的顶部漏斗。
