      - number: '8.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 估值来自行业推断，不是公司确认
            body: >-
              Talkiatry 明确拒绝披露估值，也没有任何具名投资者确认投后估值；约 ~$1.4 billion 数字反映的是 2026
              年独角兽叙事，而非经验证价格，因此任何入场分析都必须把它当作需要尽调的估计，而不是事实。
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
              - CV034
          - type: callout
            title: 模型形态支持服务倍数加增长溢价
            body: >-
              因为 Talkiatry 直接雇佣 800+ 名精神科医生，其经济模型更像 LifeStance（约 2x EV/sales），远多于轻资产市场平台；可辩护框架是服务倍数加增长溢价，这也是为什么通向推断
              $1.4B 的大部分距离，必须用私人毛利率和留存数据验证。
            calloutType: insight
            claimRefs:
              - CV024
              - CV025
              - CV042
          - type: callout
            title: 情景依赖低可信度收入锚点
            body: 唯一公开收入数字是 Latka 约 ~$94.7M 的估计，且存在已知数据错误；因此乐观 / 基准 / 悲观区间都只是方向性判断，一旦管理层披露 ARR，区间会出现实质性移动。
            calloutType: assumption
            claimRefs:
