      - number: '2.6'
        title: 要点
        blocks:
          - type: callout
            title: 结构性短缺是持久需求引擎
            body: >
              到 2038 年预计缺口 43,810 名精神科医生，叠加 137M 美国人位于短缺区、平均等待 48
              天，形成线下供给无法单独吸收的需求。远程精神科不是疫情便利工具，而是填补可及性基础设施缺口的方案，并有数十年结构性顺风。
            calloutType: strength
            claimRefs:
              - CM020
              - CM021
              - CM022
          - type: callout
            title: DEA 开方断崖是 2026 年底的二元风险
            body: >
              远程医疗开方弹性第四次临时延期将于 2026 年 12 月 31 日到期。如果 DEA 永久规则未能在该日期前落地，Ryan Haight Act 的线下就诊要求将回归，扰动
              ADHD、焦虑以及其他通常需要通过远程医疗开具 II–IV 类药物的疾病。
            calloutType: risk
            claimRefs:
              - CM026
              - CM027
          - type: callout
            title: 平价罚款显示商业市场结构有利于广网络平台
            body: >
              Georgia 对保险方开出 $25M 罚款，Washington State 持续执法，显示州级 MHPAEA
              执法正在填补联邦执法真空。受到平价审查的保险方有直接财务激励去扩张行为健康服务方网络，这在结构上利好拥有大型、已认证、网络内精神科医生池的平台。
            calloutType: insight
            claimRefs:
              - CM030
              - CM032
          - type: callout
            title: SAM / SOM 估算只能指示方向；公开数据无法隔离网络内远程精神科
            body: >
              已发布市场规模把全球与国内、远程精神科与更广义行为健康、诊所收入与全支付方账单混在一起。Talkiatry 的具体 SAM——美国网络内门诊远程精神科——无法用公开数据精确测算；需要用锚定 CPT
              账单量、精神科医生供给和报销费率的自下而上模型。
            calloutType: assumption
            claimRefs:
              - CM013
              - CM033
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：四类竞争者及其边界
        blocks:
          - type: paragraph
            body: >
              拆开四类本质不同的竞争者，才能看清 Talkiatry 的竞争环境；分析师不应把它们混为一谈。第一类是直接全栈同行：像 Talkiatry
              一样，把雇佣或认证精神科医生、保险网络内合约和自研技术平台结合起来的公司。Brightside Health 和 LifeStance Health 是这一类中最清晰的成员。LifeStance（Nasdaq:
              LFST）影响最大：它是线下与虚拟混合的门诊服务方，2026 年 Q1 收入 $403.5M（同比增长 21%），在 33 个州和 550+ 个中心雇佣 8,349 名临床医生，并把 2026 全年收入指引上调至
              $1.64B–$1.68B。Brightside Health 是纯远程心理健康平台，2024 年 3 月完成 $33M Series C（累计 $100M+），通过与 Centene、Blue Shield
              of California、Blue Cross Blue Shield of Texas 和 CareOregon 合作，覆盖 100M+ 参保人，其中包括 50M Medicare 和 Medicaid
              受益人。第二类是治疗师市集平台，它们主要为治疗师而非精神科医生搭建大型保险网络内足迹：Headway（2024 年 7 月 $100M Series D，$2.3B 估值，34,000+ 名服务方，100+
              个计划，覆盖 50 个州）、Grow Therapy（2026 年 3 月 $150M Series D，$3B 估值，约 $1B 年收入，26,000+ 名服务方，125+ 个健康计划，220M 覆盖人群）和
              Alma（30,000 名服务方，120M 人，被 Spring Health 收购，交易预计 2026 年 Q2 完成）。Talkspace（Nasdaq: TALK）作为上市公司补足这一类，2025 年总收入
              $229M，其中保险 / 支付方会话同比增长 32% 至 1.617M 次。第三类是替代和受监管平台：Cerebral（2024 年 11 月就管制药物开方与 DOJ/DEA 达成 $3.6M
              和解，并因欺骗性做法与 FTC 达成 $7M+ 和解；已完全放弃管制药物开方）、Done Global（高管 2024 年 6 月因刑事指控被捕）、BetterHelp/Teladoc（2026 年 Q1 收入
              $218.4M，现金支付模式下滑，转向保险），以及 Array Behavioral Care（一家有 25 年历史、面向 B2B
              医疗系统的远程精神科服务方，服务医院系统和急诊科，不直接面向消费者患者）。第四类是现状型既有替代：传统线下精神科团体诊所、由 PCP 开具精神类药物（估计占美国抗抑郁药处方的
              80%），以及作为危机兜底的急诊科或住院急性护理。分析师必须分别评估 Talkiatry 是从同行（第一、第二类）手中赢份额，还是更有价值地转换现状（第四类）——鉴于美国 55%
              的县没有精神科医生，后者对应的总可触达人群更大。
