          - type: callout
            title: 纯保险模式制造结构性可及性和流失风险
            body: >
              Talkiatry 拒绝接受自费或 Medicaid 患者，带来两类结构性风险：第一，治疗中途保险变化的患者必须离开平台，正在进行的精神科照护会被打断；第二，Medicaid 约 90 million
              名受益人被完全排除，公司把一个庞大患者群体让给了 Charlie Health（面向青少年）和 Brightside Health 等接受 Medicaid 的竞争对手。MHPAEA
              平等执行加强后，Medicaid 管理式医疗组织在扩大行为健康网络要求；如果 Talkiatry 最终不增加 Medicaid 签约，可能被排除在行为健康市场中一个不断增长的部分之外。
