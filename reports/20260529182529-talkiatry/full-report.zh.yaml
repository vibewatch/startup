      - number: '2.2'
        title: 测算口径与估算差异
        blocks:
          - type: paragraph
            body: >
              已发布市场估计会因边界选择相差 6× 以上；即便在相近的临床治疗口径内，差距也达到 27%。Mordor Intelligence（2026 年 1 月更新）把 2025 年美国行为健康市场估为
              $76.25B，预计 2026 年为 $79.79B，2031 年达到 $100.15B，CAGR 为 4.65%。TowardsHealthcare 估计 2025 年为 $96.9B，2026 年达到
              $101.84B，2035 年达到 $159.35B，增速 5.1%。Fortune Business Insights 的 2025 年数字为 $92.14B，并预计 2032 年增长到 $132.46B，增速
              5.3%。这些不是随机波动：Mordor 把门诊就诊计为 41% 份额，并排除了一些 TowardsHealthcare 纳入的细分市场。精神科诊所子市场由 Grand View Research 单独估为
              2025 年 $10.96B（到 2033 年增至 $21.60B，CAGR 7.79%），而 Covenant Health Advisors 给出的 2023 年数字是 $25.9B。2.4×
              差异来自分析师到底只计算诊所收入，还是纳入各种场景下的所有门诊精神科账单。全球远程精神科市场（含所有交付模式）被 The Business Research Company 估为 2025 年
              $15.55B、2026 年 $19.15B，增速 23.1%；Grand View Research 则估计 2024 年为 $22.9B，到 2030 年增至 $64.5B，增速 18.4%，到 2030
              年几乎高出 3×。这些矛盾不是偶然噪音，而是诊断信号：市场并未就是否应把常规精神科就诊从广义行为健康中单列、是否应把远程医疗与线下就诊分开统计形成共识。投资者不应把任何单一公开 TAM
              当成事实，而应把它视作定义产物，并用多重口径三角验证。无论边界如何，行为健康使用率趋势很清楚：美国使用量 2018 至 2024 年增长 62.6%；2024 年行为健康占美国所有远程医疗就诊的 65.6%，而
              2018 年仅为 18.4%；当年行为健康远程医疗就诊 66.4M 次，超过初级保健的 62.8M 次，确认行为健康是远程医疗的主导用例。
