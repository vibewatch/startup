      - number: '2.5'
        title: 约束、不利信号与尽调缺口
        blocks:
          - type: paragraph
            body: >
              多项约束限制远程精神科机会的扩张速度和天花板。时间最敏感的是 DEA 开方规则不确定性：疫情时期的远程医疗弹性第四次临时延期将于 2026 年 12 月 31
              日到期。如果在此之前没有永久规则或进一步延期，Ryan Haight Act 在疫情前的要求会于 2027 年回归：通过远程医疗开具任何 II–V 类管制药物前，必须先完成线下评估。约 24%
              美国人目前使用处方心理健康药物，包括 ADHD 兴奋剂（II 类）和苯二氮䓬类药物（IV 类），这会让药物管理型远程精神科面对一个二元准入断崖。第二，行政摩擦侵蚀单位经济模型：2023 年，Medicare
              Advantage 计划名录下 55% 的行为健康服务方处于非活跃状态（幽灵网络），且事先授权往往每 8–20 次治疗就要重新授权一次，吃掉 5–10% 的单次收入。第三，2024 年 54.7%
              患有精神疾病的美国成年人没有接受治疗；治疗缺口不只来自短缺，也来自污名、成本和病情严重度因素，远程医疗本身无法解决。第四，针对 Cerebral 和 Done Health
              的执法行动说明，激进的远程医疗开方商业模式会招来 DEA 和 DOJ 审查：Cerebral 2024 年 11 月向 DOJ/DEA 支付
              $3.6M，因为公司激励临床医生在不顾临床适当性的情况下增加兴奋剂处方；Done Health 创始人则面临刑事指控。这些行动表明，全市场的合规标准更有利于 Talkiatry
              这类临床保守的全栈服务方，但也确认监管审查会长期存在。第五，2024 年 MHPAEA Final Rule
              下的平价执法暂停，让商业保险方在州法律补齐缺口前仍保有网络充足性谈判杠杆。第六，各发布方之间持续存在规模口径差异——同一个 2025 年美国市场，一个是 $76B，一个是
              $97B——意味着任何自下而上市场模型都应锚定服务量和报销费率，而不是共识 TAM。
