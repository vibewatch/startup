      - number: '6.3'
        title: 雇主与支付方渠道
        blocks:
          - type: paragraph
            body: >
              截至 2026 年中，Talkiatry 还没有独立的 B2B 雇主产品；雇主渠道完全靠 BetterHelp 合作进入。2024 年 9 月，Talkiatry 与 BetterHelp
              宣布独家安排，Talkiatry 的远程精神科和药物管理服务接入 BetterHelp Business——BetterHelp 面向企业的产品，覆盖 1,000+ 个雇主、支付方、大学和 EAP
              合作关系，合计覆盖数百万受保人群。BetterHelp Business 客户选择该增项后，员工可在网络内使用 Talkiatry 精神科医生，且无需额外自付费用。员工可以自行选择精神科照护，也可以由其
              BetterHelp 治疗师直接转诊，在同一个福利平台里完成从心理治疗到精神科的交接。Talkiatry CEO Robert Krayn
              称，这项合作补上了一个缺口：雇主想要高质量的网络内精神科服务时，「真的没有别的地方可去」；他还指出，该渠道有助于维持患者量，并让 Talkiatry 持续进入雇主和支付方买家的视野。支付方侧，截至 2026 年
              2 月，Talkiatry 已进入 100 多个商业保险计划网络，在全美覆盖超过 170 million 人。主要支付方包括 Aetna、Blue Cross Blue Shield、United
              Healthcare、Cigna 和 Humana。AMGA 合作进一步延伸了支付方价值主张，因为它让 Talkiatry 能展示基于测量的照护：公司称，焦虑患者中 87%、抑郁患者中 86%
              在仅两次就诊后症状减轻；公司还称，相比传统模式，支付方每名会员每月最多可节省 $700。尚无独立审计的支付方价值或雇主结果数据公开发布，能够确认这些数字。
