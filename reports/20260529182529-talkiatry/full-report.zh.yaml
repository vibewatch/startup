      - number: '3.6'
        title: 证据材料
        blocks:
          - type: callout
            title: DEA 远程医疗开药规则带来的监管悬顶
            body: >
              Talkiatry 的合规姿态不同于 Cerebral 和 Done Global，但所有远程精神科平台——即便是合规平台——都面临 DEA 2025 年 1 月提出的特殊注册规则最终落地的风险。该规则要求
              Schedule II 处方中 50% 先经过线下就诊。若规则生效，Talkiatry 的 ADHD 业务将被迫大幅调整临床流程，也可能增加其纯虚拟模式下全平台的获客摩擦。
