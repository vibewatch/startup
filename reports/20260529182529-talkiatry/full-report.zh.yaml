        title: 市场边界与品类逻辑
        blocks:
          - type: paragraph
            body: >
              做任何市场规模测算前，第一项分析任务是划定正确边界。行为健康支出可以从窄口径到宽口径连续展开：窄口径只包括由持证精神科医生主导、以药物管理为锚、由商业或政府保险覆盖的门诊服务；宽口径则把所有触及心理健康、物质使用障碍、自闭症、智力和发育障碍、员工援助计划、健康应用和住院设施的服务都纳入。Houlihan
              Lokey 以全连续谱口径估算 2025 年市场为 $400B–$500B；多数聚焦临床治疗的研究机构，在较窄定义下收敛于 $76B–$97B 区间。Talkiatry
              落在中偏窄区间：保险网络内门诊远程精神科，覆盖精神科评估、药物管理，以及焦虑、抑郁、ADHD、PTSD、双相障碍、OCD
              等疾病的随访。核心定义排除住院和住宿型精神科照护、没有药物管理的独立心理治疗、物质使用障碍治疗、仅 EAP 项目，以及直接面向消费者但无保险或现金支付的产品。未来可能扩大 Talkiatry
              足迹的相邻支出包括基于价值的照护合同、雇主赞助福利（估计 $6B 的高价值 EAP 机会）和医疗系统容量合作。边界纪律很重要：若声称总市场为 $500B，会人为压小 Talkiatry
              网络内模式的相对体量；若只说精神科诊所市场 $10B，又会低估网络内渠道的触达。常规远程精神科——预约制评估，由固定精神科医生或小团队服务稳定患者面板——是主导性的商业交付模式，也是 Talkiatry
              最直接竞争的细分市场。2024 年，居家远程精神科解决方案以约 36% 占据全球最大市场份额，确认消费者对居家精神科照护的偏好与 Talkiatry 的全虚拟模式一致。
