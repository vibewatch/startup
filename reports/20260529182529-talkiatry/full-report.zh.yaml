  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              Talkiatry 的临床模式依赖 DEA 对 COVID-19 远程医疗开方弹性政策的第四次临时延期，而该延期只持续到 2026 年 12 月 31 日。根据 2008 年 Ryan Haight
              Act，除非适用豁免，执业者在开具 Schedule II–V 管制物质前必须进行线下评估；当前应急弹性是远程开具兴奋剂（ADHD）、抗焦虑药和其他管制药物的唯一广泛豁免。DEA 在 2025 年 1 月发布了
              Special Registration 拟议规则，但特朗普政府尚未推进最终定稿；DEA 还承认，2025 年 10 月 Medicare 远程医疗授权曾出现 41
              天空窗，并导致可及性可测量下降。如果永久规则要求线下评估，或增加 Talkiatry 已入职精神科医生无法满足的注册负担，Talkiatry 患者人群中的实质性部分——尤其是使用兴奋剂治疗 ADHD
              的患者——可能受到干扰。

              隐私诉讼风险已经发生且在推进。2025 年 10 月，加州中区美国联邦地区法官 Sunshine S. Sykes 允许针对 Talkiatry 未经授权共享 Meta Pixel
              数据的集体诉讼在侵犯隐私和加州笔式记录器 法规理由上继续推进，尽管她驳回了 Electronic Communications Privacy Act 和 CIPA 主张。Jane Doe et al. v.
              Talkiatry Management Services, LLC 并非孤立事件：2023 到 2025 年，美国医疗服务提供商在 19 起像素追踪案件中支付了超过 $100 million 罚金。同业公司
              Cerebral 因数据共享和开方违规被 FTC 罚款 $7 million、被 DOJ/DEA 罚款 $3.6 million，显示监管方愿意处罚远程医疗平台。

              Mental Health Parity and Addiction Equity Act（MHPAEA）最终规则于 2024 年 9 月 23 日定稿，要求健康计划提交心理健康与医疗 /
              外科福利之间非定量治疗限制的比较分析。如果支付方被认定存在重大可及性差异，就必须采取补救行动，包括提高 MH/SUD 服务提供者报销——这对 Talkiatry 是有利压力——但同一执行框架也可能触发对
              Talkiatry 账单实践和事先授权率的追溯审计。多州执照合规是一项持续运营义务：Talkiatry 在 45 个州运营，每名精神科医生在服务发生时必须持有患者所在州的有效执照；COVID
              期间允许跨州执业的应急豁免大多已经到期。
