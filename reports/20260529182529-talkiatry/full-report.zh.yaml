      - number: '5.4'
        title: 技术栈、AI 与平台架构
        blocks:
          - type: paragraph
            body: >
              Talkiatry 将自己描述为由自研 AI 技术支撑的「全栈」精神科服务者，用于照护交付管理、临床运营精简和会员互动。公开证据并不能确认它拥有自研视频会议层——虚拟就诊明确通过 eClinicalWorks
              的第三方远程医疗基础设施 healow™ 交付。患者门户（应用和网页）带有 Talkiatry 品牌，但由 healow 驱动；患者在 healow 生态内用诊所代码 FGCACD 定位 Talkiatry。

              AI 被用于三类场景：（1）患者—临床医生匹配（基于专长、可用性，以及保险和偏好等患者特定因素），（2）基于测量的照护协调（自动收集和追踪 GAD-7/PHQ-8 分数、临床提醒），（3）Talkiatry
              Connect 的转诊提醒逻辑（在 EMR 内识别可能需要精神科转诊的患者）。AI 组件与标准软件工作流自动化之间的内部差异没有公开披露。

              工程信号有限。Talkiatry 招聘页面列出 Senior Software Engineers（内部平台/工具）、Senior Product Data
              Scientists（Snowflake、dbt、Databricks 栈）、Senior Analytics Engineers 和 Business Intelligence Engineering
              Managers 等开放岗位，显示其更像数据分析优先的技术组织，而不是深软件基础设施组织。Talkiatry Connect 的 Chromium 浏览器叠加层架构允许快速集成 EMR，不必为每个 EMR 谈
              HL7/FHIR API，这解释了其所称的一天部署周期。明确排除 Epic 是重大产品缺口；Epic 是美国医院主导 EMR，市场份额超过 38%。原生移动应用（1.3.0 版，2026 年 4 月）处于
              beta，App Store 评分 2.9/5，来自 17 条评论；评论者提到稳定性改善、意外登出减少、教育 PDF
              现可在应用内打开。临床医生反馈（汇总自评论平台）反复提到虚拟会话中的音频/视频问题，这是持续的技术限制。

              运营基础设施包括：（1）内置在消费者入组和 Talkiatry Connect 中的保险资格核验；（2）转诊提交后 24
              小时内自动患者触达；（3）生成四名精神科医生候选名单的临床医生匹配逻辑；（4）向转诊服务者闭环交付进展记录。Talkiatry 的组织形式是由 Talkiatry Management Services, LLC
              提供行政支持，临床服务由独立的 MCCD Psychiatry Services 实体交付（多数州为 PLLC，另有 PA、PC 和 LLC 等州别变体）。这种 MSO/PC
              结构是多州远程医疗的标准做法，但也在技术平台与临床执业之间制造监管和责任切分。
