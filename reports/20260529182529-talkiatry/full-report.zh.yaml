  - id: FU001
    title: Talkiatry 患者旅程图——从获得服务到持续护理
    type: journey-map
    layout: wide
    summary: 患者如何通过四个主要接收渠道发现、获得并留在 Talkiatry 护理中。
    claimRefs:
      - CU001
      - CU004
      - CU006
      - CU011
      - CU020
      - CU031
    data:
      items:
        - label: 阶段 1——认知与渠道进入
          description: >-
            患者通过保险公司目录、Zocdoc、雇主 BetterHelp 门户寻找网络内精神科医生，或收到 HCA / AMGA 成员临床医生由 EHR 生成的转诊。自费患者无法使用
            Talkiatry；预约前必须完成保险核验。
        - label: 阶段 2——接收与匹配
          description: 患者完成在线症状和保险接收（73% 在 20 分钟或更短时间内完成）。Talkiatry 根据病情、保险计划和州内可用性匹配精神科医生。BetterHelp 治疗师可直接触发转诊，匹配到精神科医生。
        - label: 阶段 3——首次评估（60 分钟）
          description: 完成 60 分钟首次全面精神科评估，确定诊断、用药决定和护理计划。接收时执行 GAD-7/PHQ-8 结果测量，并跨就诊跟踪。89% 的患者表示启动用药流程清晰。
        - label: 阶段 4——持续护理（30 分钟复诊）
          description: 每 4-8 周安排一次复诊做用药管理。92% 的患者认为申请续方或调整剂量很容易。如精神科医生把治疗纳入护理计划，患者也可使用 Talkiatry 治疗师。
        - label: 阶段 5——扩展或转诊交接
          description: >-
            需要更高严重度护理（如虚拟 IOP）的患者转诊至 Charlie Health。来自 Charlie Health 或 NYCBS 肿瘤团队的较低严重度患者，则转诊到 Talkiatry 继续护理。医疗系统合作方通过
            EMR 收到诊断和用药的协调护理更新。
        - label: 阶段 6——流失或服务中断
          description: 患者保险变更，或其保险计划退出 Talkiatry 网络后，就会失去访问权。没有自费过渡选项。Trustpilot 评论把意外账单和网络混淆列为重要中断触发因素。
