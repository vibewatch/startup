  - id: TV001
    title: 建议摘要表
    columns:
      - 建议
      - 置信度
      - 风险评级
      - 估值立场
      - 决策含义
    rows:
      - - 观察 / 继续研究
        - 中
        - 高
        - 较上市可比公司偏高；相对私营同业仍有支撑
        - 若没有 ARR、毛利率、NRR、烧钱速度和支付方集中度披露，或没有更低入场价格，不应按推断的约 $1.4B 估值承销
    notes: 建议明确对价格和披露敏感，不是泛泛的公司质量评分；估值为行业推断，并非公司确认。
    claimRefs:
      - CV003
      - CV032
      - CV035
      - CV036
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 什么会改变看法
    rows:
      - - Talkiatry 拥有同类中最宽的网内精神科覆盖（100+ 个支付方，170M 参保人），且临床结果已获验证。
        - 如果披露的收入、留存和利润率显著弱于增长叙事暗示，溢价逻辑会削弱。
      - - 最高增长画像（管理层称 2021–2024 年增长 1,745%）叠加价值导向医疗可选项，可支撑更高的私营市场估值。
        - 如果 2024 年后增长放缓，或基于价值的收入无足轻重，倍数应向上市服务类可比公司收敛。
      - - 直接雇佣精神科医生的模式带来质量控制，也在医疗系统转诊中占住防御性位置。
        - 如果精神科医生薪酬挤压毛利，劳动密集型模式会把估值倍数压在软件型同行之下。
      - - 面向保险准入的私营同行（Headway $2.3B、Grow >$1B）印证，高增长保险模式可以拿到 $1B+ 标记。
        - 如果这些同行是资产更轻、利润率结构更好的市场平台，它们的标记会高估 Talkiatry 的合理倍数。
      - - 披露不透明和处方监管敞口，是今天入场决策的主导因素。
        - 如果管理层提供 ARR、毛利、NRR、付款方组合和股权结构表细节，建议可能转向建设性。
    notes: 反方论点主要围绕价格、缺失的经济性和监管敞口，并不是质疑 Talkiatry 是否是一家真实、高质量的公司。
    claimRefs:
      - CV024
      - CV026
      - CV025
      - CV023
      - CV032
      - CV037
      - CV038
      - CV044
  - id: TV003
    title: 可比估值表
    columns:
      - 可比公司
      - 类型 / 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - LifeStance Health (LFST)
        - 上市；EV/sales + EV/EBITDA
        - ~$2.99B 市值，对应 2025 年收入 $1,424.3M；~2.1x EV/sales；~18.5x EV/EBITDA
        - 最接近的上市纯标的；雇佣临床人员的门诊心理健康服务
        - 增长较慢（~14%），且含线下业务；付款方集中风险
      - - Talkspace (TALK)
        - 上市；EV/sales
        - ~$871M 市值，对应 ~$238M 收入；~3.3x EV/sales
        - 上市心理健康远程医疗公司，正转向 B2B 保险
        - 治疗 / DTC 业务混合，不是以精神科为核心的用药管理
      - - Teladoc / BetterHelp (TDOC)
        - 上市公司分部；收入趋势
        - BetterHelp 2026 年 Q1 收入 $218.4M，同比下降 9%；分部倍数受压
        - 最大 DTC 心理健康资产；反映品类需求
        - DTC 现金自付模式下行；获客方式不同
      - - Amwell (AMWL)
        - 上市；EV/sales
        - ~$164M 市值，对应 ~$237M 收入；~0.6x EV/sales；亏损中
        - 广义远程医疗服务的底部可比
        - 困境倍数；增长与盈利更弱
      - - Headway
        - 私营；最近一轮估值
        - 2024 年 7 月 Series D 估值 $2.3B（$100M；较前轮上调 130%）；累计融资约 $326M
        - 面向保险准入的心理健康平台；付款方广度可参照
        - 轻资产三边市场平台，不雇佣精神科医生
      - - Grow Therapy
        - 私营；融资 / 估值
        - 2026 年融资 $150M；此前 2024 年 $88M Series C 跨过 >$1B 独角兽线
        - 面向保险准入的心理健康平台；近期私营市场标记
        - 市场平台模式，当前投后估值未披露
      - - Brightside Health
        - 私营；融资
        - 2024 年融资 $33M，用于 Medicare/Medicaid 扩张；当前估值未披露
        - 向政府付款方扩张的虚拟心理健康同行
        - 规模更小；近期无披露估值
      - - Array Behavioral Care
        - 私营；融资 / 状态
        - 累计融资 ~$49M；Series C；被 Harbour Point Capital 收购
        - 老牌远程精神科服务商（1999 年创立）
        - 规模小得多；由私募基金持有；经济性不透明
      - - Cerebral（警示）
        - 私营；峰值估值后崩塌
        - 由 $1.2B 升至 ~$4.8B（2021 年 12 月，SoftBank），后在 DOJ 处方审查中崩塌
        - 处方权重高的远程精神科下行参照
        - 模式不同（DTC、受控物质）；疫情期标记
    notes: 上市倍数基于 2026-05-29 运行日取得的市值和收入计算；私营标记为最近披露的轮次估值，不是按市值重估。Cerebral 作为下行警示锚点纳入，而非正向可比。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Enumerates the public behavioral-health/telehealth services comps and private insurance-access mental-health
        peers used in this chapter's valuation framework as of the 2026-05-29 run date.
