      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              由于收入是最大的未知数，情景以 Latka 约 $95 million 的收入运行率估计为锚，同时考虑披露的高速增长所支持的更高当前数字，再套用适合该模式的倍数。悲观情景对约 $95 million 套用约
              3x–5x，得到约 $285 million–$475 million；触发条件包括增长已经减速、DEA 远程医疗开方回滚或 DOJ 执法打击模式，或支付方集中度被证实很高。基准情景对约 $110
              million–$130 million 套用约 6x–10x，得到约 $700 million–$1.3 billion；该情景给予高于 LifeStance 约 2x
              的增长溢价，并与非上市同业价格一致，是公开数据下最符合证据的区间。乐观情景对约 $130 million–$150 million 套用约 10x–14x，得到约 $1.3 billion–$2.1
              billion，但前提是确认强劲毛利率、净留存率和价值医疗进展。

              推断的约 ~$1.4 billion 价格位于基准情景顶部和乐观情景底部——相对上市可比公司有明显增长溢价，按可见证据看偏贵，但对照 Headway 的 $2.3 billion
              也并非不可能。决定性敏感项是收入倍数网格：对约 $95 million 套用约 2x 上市服务倍数，只得到约 $190 million，因此从这里到推断的 $1.4 billion
              几乎全靠增长和私人市场溢价，必须由私人财务数据验证。数字健康独角兽倍数已从 2021 年 10x–15x 收入区间压缩到 2026
              年的低个位数倍数；精神科医生劳动力成本通胀也压制任何轻资产叙事，这两点都说明在区间顶部应保持谨慎。
            claimRefs:
