      - number: '5.3'
        title: Talkiatry Connect——面向服务方的集成产品
        blocks:
          - type: paragraph
            body: >
              Talkiatry Connect 于 2026 年 4 月推出，是一个基于浏览器的叠加层（Chromium 原生），嵌在服务者现有云端 EMR 内。它可与 30+ 个云 EMR 集成——点名例子包括
              Athenahealth、eClinicalWorks 和 Practice Fusion——但明确排除
              Epic。当患者可能需要精神科照护时，一个小图标会提醒服务者；一键打开的侧边面板会用病历中已有数据自动填充转诊，把患者路由到 Talkiatry 网络，并在患者同意后把就诊摘要和临床记录回传给转诊服务者。

              部署模式对医疗系统零成本，不需要 IT 建设，也不需要合同。一个组织的设置需要一个工作日；单个服务者约五分钟即可启用。转诊提交后，Talkiatry 会在 24
              小时内联系患者，确认保险资格，并安排首次就诊。面板会在整个患者旅程中显示实时转诊状态更新。

              HCA Healthcare 集成是 Talkiatry 首个公开宣布的大型医疗系统合作，也成为 Talkiatry Connect 的原型。HCA 网络覆盖 186 家医院和约 2,400
              个门诊点。该集成解决了 Talkiatry 所说的「portal hopping」问题，即手工把患者数据重新录入独立转诊门户，导致数千个精神科转诊被放弃。该集成已在 HCA
              绝大多数技术系统上线，并按部门推进教育推广。HCA 之外的早期采用者包括 New York Cancer & Blood Specialists，其肿瘤科医生用它为癌症患者协调精神科支持。

              2026 年 4 月 AMGA 合作把这套转诊基础设施延伸到 AMGA 的 175,000+ 名医生成员，他们合计服务三分之一美国人。该合作特别利用 Talkiatry 的 AI
              驱动基于测量的照护技术来协调照护。Talkiatry 用于正式化医疗系统关系的 Mindshare Partner Program，截至 2026 年 4 月公告时，已包括美国前 20 大医疗系统中的
              35%，以及总计 50+ 个系统。
