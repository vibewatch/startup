      - number: '7.4'
        title: 竞争与声誉风险
        blocks:
          - type: paragraph
            body: >
              远程行为健康市场挤满了融资充足的竞争对手。Spring Health 2024 年以 $3.3 billion 估值融资 $100 million。Grow Therapy 在 Series C 融资 $88
              million。Brightside、Headspace 以及 BetterHelp/Teladoc 网络都在争夺同一批有保险的患者。Cerebral 的故事——这家曾以 $300 million Series
              C 受追捧的公司，因开方违规向 DOJ/DEA 支付 $3.6 million，又因隐私处理不当向 FTC 支付 $7
              million——已经给整个品类留下持久信任伤害；患者、支付方和雇主现在更严密审视远程医疗开方实践，这抬高了包括 Talkiatry 在内所有平台的合规成本。

              面向消费者的声誉指标偏弱。截至 2025 年底，Talkiatry 在 Trustpilot 566 条评论中的评分为
              2.7/5，评论摘要将「欺骗性定价做法、意外高额账单、以及解决账单问题困难」列为持续投诉。Better Business Bureau 过去三年记录了 200 多起投诉，最近 12 个月超过 100
              起；多数围绕账单惊讶——患者预期支付 $15–$30 共付额，却收到 $200–$400
              发票——以及难以联系客户服务解决问题。这些模式根植于纯保险模式：患者实际责任取决于计划设计、免赔额状态和福利年度，而账单周期在时间上又脱离临床就诊。

              软件和平台防御性有限。Talkiatry 的 AI 驱动自研技术平台在排班、账单自动化和患者互动上形成差异，但核心临床价值由雇佣制精神科医生交付，不是平台本身。如果资金更充足的竞争对手能以更低成本复制技术层，或
              AI 辅助临床工具将照护协调商品化，Talkiatry 的技术护城河会收窄，而其劳动力模式仍是固定成本。公司的治理结构——董事会构成、清算优先权和期权池——未公开披露，使投资者评估一致性和控制风险时缺乏透明度。
