    rows:
      - - W-2 精神科医生队伍（仅 MD/DO，专科委员会认证）
        - LifeStance 和 Brightside 拥有可比或部分可比的雇佣模式；如果支付方拉平报销，NP/PA 替代可能削弱护城河
        - 中
        - LifeStance 雇佣 8,349 名临床医生（MD/NP/治疗师混合）；Brightside 雇佣 MD 和 NP；Talkiatry 称拥有 800+ 名 W-2 精神科医生，全部通过专科委员会认证
        - 核实 MD 与 NP 精神科就诊的支付方报销差异；确认 Talkiatry 精神科医生流失率和薪酬竞争力
      - - 全栈支付方签约（100+ 计划，170M 覆盖人群）
        - Grow Therapy 已覆盖 220M 人群（125+ 计划）；Headway 覆盖 100+ 计划；支付方规模不是 Talkiatry 独有
        - 中高
        - >-
          Grow Therapy 2026 年 3 月 Series D：220M 覆盖人群，125+ 计划；Headway 2024 年 7 月：100+ 计划；Talkiatry 2026 年 2 月：170M
          覆盖人群，100+ 计划
        - 确认 Talkiatry 按计划类型拆分的支付方组合；验证哪些计划包含精神科专项拆分条款，哪些只是一般行为健康覆盖；核实网络充足性合规状态
      - - 合规状态和监管记录
        - DEA 远程医疗处方规则变化可能限制所有平台的管制药物远程医疗可及性；Talkiatry 数据共享集体诉讼（Meta Pixel）仍未解决
        - 中
        - >-
          Cerebral 2024 年 11 月 DOJ 和解 $3.6M；Done Global 2024 年 6 月高管被捕；Talkiatry 因 Meta Pixel 患者数据共享面临活跃集体诉讼（Bloomberg
          Law）
        - 确认 Talkiatry 管制药物合规流程；获取 Meta Pixel 集体诉讼状态；核实 DEA 远程医疗规则对 Talkiatry ADHD 处方量的影响
      - - 临床结果证据（JMIR 2023 同行评审）
        - LifeStance 2026 年发布 180K 患者结果研究；Brightside 的 PrecisionRx 首轮响应率达 70%；竞争对手正主动缩小结果证据差距
        - 中低
        - LifeStance Q1 2026 业绩：180K 患者中 75% 取得临床显著改善；Brightside：首轮响应率 70%；Talkiatry：焦虑 / 抑郁症状消失 67% / 62%（JMIR 2023）
        - 索取最新结果数据；确认 2023 年 JMIR 研究是否在更大规模上复现或延展；用标准化方法比较 PHQ-9/GAD-7 改善率
      - - 通过 BetterHelp 合作（2024）获取雇主 / 医疗计划分发
        - Grow Therapy 的 EAP 桥接模式以及 Spring Health + Alma 组合，构成更大的雇主渠道竞争者；Talkiatry 的雇主接入是间接的
        - 高
        - Grow Therapy 2026 年 3 月：EAP 桥接直接争夺同一雇主渠道；Spring Health $3.3B 估值 + Alma $220M+ 形成 >170M 覆盖人群的雇主 + 保险平台
        - 量化雇主渠道与直接保险的收入占比；确认 BetterHelp 合作经济条款和排他性；监测 Spring Health + Alma 合并后雇主渗透率
      - - 支付方报销耐久度（W-2 模式成本 vs 费率表）
        - Aetna 2026 年下调 Alma 签约治疗师费率，显示支付方有议价力；W-2 精神科医生的人均员工成本高于 1099 市场；支付方费率压缩可能收窄利润率优势
        - 高
        - Aetna 2026 年 5 月下调 Alma 网络治疗师费率；约 35% 治疗师因报销顾虑不接受保险（APA 调研）
        - 索取 Talkiatry 关键计划中按支付方拆分的报销费率；核实包含 W-2 管理成本的单次就诊经济性，并与行业基准对比；评估未来 12 个月支付方续约费率风险
    notes: >
      严重度评级是基于本轮公开证据的分析师判断。高严重度意味着如果不处理，该威胁可能实质性约束 Talkiatry 的增长或利润率轨迹。「护城河主张」反映 Talkiatry
