      - number: '4.6'
        title: 证据材料
        blocks:
          - type: callout
            title: 超额认购的 Series D 证实机构对模式有信心
            body: >-
              2026 年 2 月 $210 million Series D 获得超额认购——投资人需求超过公司融资需求——当时行为健康数字健康融资正越来越集中到更少数已验证平台。a16z、Perceptive
              Advisors、blisce/、Left Lane Capital 回归，并有新进投资人 Sofina 加入，传递的是多轮信心，而不只是新资金热情。Rock Health 数据显示，Andreessen
              Horowitz 参与 Series D 或更后期轮次时，该阶段平均交易规模接近 $94M；Talkiatry 的 $210M 是这一基准的 2 倍，说明投资人给该模式的规模和防御性赋予了显著溢价。
            calloutType: strength
            claimRefs:
              - CI031
              - CI032
              - CI033
              - CI040
          - type: callout
            title: 账单投诉与撤下广告主张带来声誉和留存风险
            body: >-
              TINA.org 2024 年 1 月调查记录到，消费者在被告知保险可用后，收到从 $334 到 $1,000+ 不等的意外账单。Talkiatry 到 2024 年 12 月撤下「$30 or
              less」广告主张，说明公司内部承认该主张并非总能准确兑现。Trustpilot 2.7/5 评分（566
              条评论）反复出现账单相关主题，显示公司网内定位与患者自付费用体验之间仍有未解决缺口。对一个依赖患者留存和口碑转诊的平台而言，这种账单摩擦可能压低单个患者生命周期就诊量，并推高重新获客成本。
            calloutType: risk
            claimRefs:
              - CI041
              - CI042
              - CI043
              - CI048
          - type: callout
            title: 医疗欺诈执法正聚焦高量远程医疗计费
            body: >-
              DOJ 在 2025 财年通过 False Claims Act 和解追回创纪录的 $6.8 billion，其中 $5.7 billion
              来自医疗事项；执法机构现在用机器学习工具实时标记离群远程医疗计费。Talkiatry 的雇佣模式和标准化就诊记录是结构性缓释因素，但 3 million
              次累计就诊的理赔量，以及精神科医生队伍规模，即使没有任何已知违规，也会带来审计暴露。任何投资尽调都应要求公司展示成文的合规计划、计费审计节奏和预授权工作流。
            calloutType: risk
            claimRefs:
              - CI045
              - CI046
              - CI049
          - type: callout
            title: 按 Series D 隐含估值承保前，应索取完整财务数据室
            body: >-
              公开记录支持商业可信度和机构投资人信心，但不足以直接承保收入倍数、利润率路径或资本充足性。完整尽调数据室应包括：FY2024 和 FY2025 经审计或管理层编制的 P&L、Series D
              后现金流量表、按收入和就诊量拆分的支付方组合、股债拆分和 Banc of California 信贷条款、价值医疗合同数量及经济条款、按渠道拆分的 CAC。没有这些材料，任何估值结论都是推测，而不是经过承保。
