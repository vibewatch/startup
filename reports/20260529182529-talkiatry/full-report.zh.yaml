      - number: '6.4'
        title: 使用增长、留存与临床结局
        blocks:
          - type: paragraph
            body: >
              Talkiatry 的使用增长轨迹有累计就诊里程碑支撑：公司大约在 2024 年 4 月达到 1 million 次患者就诊，2025 年 5 月超过 2 million 次，并在 2026 年 2 月宣布达到
              3 million 次——从第一个 million 到第二个 million 大约 10 个月翻倍，此后又在 9 个月内再次翻倍。公司发表的同行评审研究，是观察患者留存和临床影响的最强公开窗口。2025 年 12
              月发表在 The Archives of Psychiatry 的研究（来自 Talkiatry 内部约 800 名患者数据）显示，早期脱落率为 13.2%，明显低于传统和虚拟行为健康场景通常 20-30%
              的基准。脱落的关键预测因素是较弱的医患治疗联盟（脱落风险高 2.6 倍）以及首次就诊自付额或免赔额超过 $40（脱落风险高 2 倍），进一步支撑了公司网络内模式作为结构性留存优势。另有 2023 年 JMIR
              Formative Research 对 1,826 名 Talkiatry 患者的同行评审回顾研究（使用 GAD-7 和 PHQ-8 验证量表）显示，在 15 周内平均 5 次就诊后，67% 的焦虑患者和
              62% 的抑郁患者不再有临床显著症状，分别有 26% 和 29% 达到完全缓解。城乡地区结果相近，支撑其可及性公平主张。Zocdoc 案例研究指出，约 5 次就诊后，65% 伴有焦虑或抑郁的 Talkiatry
              患者不再报告临床显著症状。HelpGuide 对 100 名用户的调查发现，92% 认为申请续药或调整剂量容易或非常容易，89% 认为开始用药流程清晰，说明持续照护管理摩擦较低。Talkiatry
              的临床医生满意度则更复杂。Great Place to Work 认证数据显示，84% 的 Talkiatry 员工认为这里是理想工作场所（典型美国公司为 57%），96% 入职时感到受欢迎。但归档的
              Indeed 评论提到未付费爽约、高文档负担、生产率指标压力和低于预期的薪酬，雇主点评平台总体星级为 3.1-3.5/5。临床医生侧的这些动态关系到客户，因为稳定的精神科照护依赖临床医生稳定性和满意度。
