  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与支付方架构
        blocks:
          - type: paragraph
            body: >-
              Talkiatry 的主要收入机制是按服务收费的网内保险报销。公司针对精神科评估和用药管理就诊提交 CPT 编码索赔，支付方包括商业保险，并且越来越多包括 Medicare Advantage 计划。截至
              2026 年 2 月 Series D 公告，Talkiatry 已进入 100 多个保险计划网络，覆盖 170 million+
              商业保险人群——这一广度让它成为美国可及性最广的远程精神科网络之一。符合条件计划内的患者支付标准共付额或按计划确定的费用分摊；公司按谈好的网内费率向支付方收取余额。Talkiatry
              表示，它不直接决定或收取患者自付费用，而是按医疗服务的标准谈判费率向保险方计费。


              在基础按服务收费模式之上，还有一层价值医疗维度；Andreessen Horowitz
              和公司管理层都称其为战略逻辑的核心。公司披露，一家领先全国健康计划做过匹配队列分析：与在其他地方接受治疗的相似患者相比，Talkiatry 患者住院率低 68%，急诊就诊少 32%，每名会员每月照护成本低约
              $700。这些结果构成 Talkiatry 向支付方推销风险共担或共享节省安排的基础。具体合同、收入贡献，或价值医疗交易的 PMPM/PEPM 结构均未公开披露。Series C（2024 年 6
              月）公告明确把扩大价值型支付方合同列为主要募资用途，Series D（2026 年 2 月）也重申，募资重点包括支持与支付方建立「创新支付模式」。因此，这些安排带来的收入是真实存在的，但无法从公开来源单独量化。


              第三条渠道——雇主和医疗系统合作——通过 2023 年末推出的 Mindshare Partner Program 正式化。在该计划下，医疗系统内部容量不足时，会通过既有 EHR 转诊流程把自己的患者转给
              Talkiatry 精神科医生。2026 年 4 月宣布的 AMGA 合作，把这一模式扩展到 AMGA 覆盖的成员组织；这些组织合计拥有 175,000+
              名医生，并服务三分之一美国人。这些合作收入仍通过同一套网内保险计费机制流入；医疗系统渠道是分销和获客路径，而不是单独收入线。
