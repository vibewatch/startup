      - number: '5.5'
        title: 合规、信任与产品风险
        blocks:
          - type: paragraph
            body: >
              Talkiatry 面临几项相互关联的产品和合规风险，都是重要的承保考量。

              **受控物质处方断崖**：公司精神科医生通常会在 DEA 远程医疗弹性规则下开具 Schedule II–V 受控物质（ADHD 兴奋剂、焦虑用苯二氮卓类、受控镇痛药等）。该弹性规则延长至 2026 年 12 月
              31 日，是 COVID-19 以来第四次延期。这些弹性规则豁免了 Ryan Haight Act 关于开药前必须线下评估患者的基线要求。若 DEA 未能在 2026
              年底前敲定永久远程医疗开药规则，线下要求将自动恢复，所有此前没有线下就诊、需要受控物质的新患者照护都会被打断。考虑到 Talkiatry 患者组合中
              ADHD（兴奋剂）和焦虑（苯二氮卓类）的普遍性，这是生死级运营风险。DEA 正在推动面向精神科医生的永久「Advanced Telemedicine Prescribing Registration」，但截至
              2026 年 5 月，最终规则仍未完成。

              **Meta pixel 集体诉讼**：美国加州中区联邦地区法院的一项拟议集体诉讼（Sunshine S. Sykes 法官面前的案件）在 2025 年 10 月推进，法院允许侵犯隐私和违反 California
              pen register statute 的诉求继续。原告称 Talkiatry 未经同意向 Meta Platforms 分享患者健康信息。结果和潜在赔偿未知；ECPA 和 California
              Invasion of Privacy 诉求已被驳回。

              **账单透明度和消费者投诉**：Truth in Advertising Organization（TINA）在 2024 年 1 月收到多起关于账单超出广告所称「$30 or
              less」平均共付额的投诉后，发表了一篇对消费者不利的文章。TINA 询问后，Talkiatry 更新了广告。Trustpilot 显示整体评分 2.7/5，来自 566 条评论（2025 年 11
              月快照），一致主题包括误导性定价、账单不透明、预约取消和沟通差。BBB 投诉印证了这些模式。这些信号说明保险计费工作流与面向患者的费用透明度之间存在结构性缺口。

              **HIPAA 和隐私姿态**：Talkiatry 隐私政策（2026 年 1 月 1 日生效）明确表示，Talkiatry Management Services 不是 HIPAA 覆盖实体；Medical
              Group（MCCD 实体）才是 HIPAA 持有方，并发布 Notice of Privacy
              Practices。政策允许对数据去标识化，并将去标识化数据出售给第三方用于分析和研究。使用条款承认包括协议失败在内的风险，可能导致 PHI 泄露。SOC 2 认证状态没有公开披露。

              **产品缺口**：Epic EMR 不兼容限制了 Talkiatry Connect 触达范围，使其只能覆盖云端 EMR。没有自费选项，意味着无保险者或偏好现金支付者无法使用。Medicaid
              被排除，限制了低收入人群的可及性。移动应用仍处于 beta。远程医疗基础设施依赖第三方供应商（healow/eClinicalWorks），带来供应商锁定风险。
