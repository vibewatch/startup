            body: >-
              Talkiatry 决定把所有精神科医生作为全职 W-2 员工雇佣，而不是采用多数远程医疗同行的承包人模式。这让公司可以更有效地控制质量、维持照护连续性，并优化自研 AI 驱动工作流。同行评议 JMIR
              结果数据和机构投资者的反复下注，都验证了这一结构性选择。
