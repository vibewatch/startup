      - number: '1.2'
        title: 创始人、领导层与运营足迹
        blocks:
          - type: paragraph
            body: >
              Talkiatry 仍明显由联合创始人带队。CEO Robert Krayn 有投行背景，并把自己塑造成 Talkiatry 在保险覆盖远程精神科领域的战略、立法倡导和品类创建公开面孔。Dr. Georgia
              Gaveras, DO 是联合创始人兼首席医疗官；她拥有成人精神病学、儿童与青少年精神病学和成瘾医学三重委员会认证，并持续代表公司在同行评议研究和行业论坛中发声。患者权益倡导型 CEO 搭配执业精神科医生
              CMO，是公司的差异化叙事。创始二人之外，Talkiatry 已组建高管梯队，包括 CFO Rachael Kobida、COO Christian Freese、首席人力官 Leslie
              Guckert-Neitzel、首席合规官 Eric Triana 和首席增长官 Alexander Kozersky。运营足迹完全虚拟：公司覆盖的 45 个州都不需要面向患者的办公室基础设施。Talkiatry
              2021 年在 Hudson Square 开设了曼哈顿实体办公室，但临床模式并不依赖它。公司把所有精神科医生都作为 W-2
              员工，提供福利和行政支持，而不是让其做独立承包人；这种雇佣结构既是质量杠杆，也是实质性成本中心。同行评议 Journal of Medical Internet
              Research（2023）研究引用的临床结果显示，平均 5 次就诊后，67% 的焦虑患者和 62% 的抑郁患者不再有临床显著症状。公司在自有调查中称，临床医生倦怠率比行业平均低 80%。对 Krayn 和
              Gaveras 的关键人依赖很高：公司的外部定位、投资者关系和临床理念都与二人紧密绑定。
