      - number: '4.2'
        title: 增长证据与临床牵引
        blocks:
          - type: paragraph
            body: >-
              公司公开披露的牵引力以里程碑为主，而不是按期间披露收入。截至 2026 年 2 月，Talkiatry 累计患者就诊超过 3 million 次，较 2025 年 5 月的 2 million
              次翻倍，提速明显：公司花了三年半才在 2023 年中达到第一个 1 million 次就诊，却只用了 14 个月新增第二个 1 million 次，说明既有转诊和支付方基础正在产生有意义的复利。精神科医生队伍从
              Series C（2024 年 6 月）时的 300+，增至 2025 年 5 月的 600+，又在 Series D（2026 年 2 月）时达到 800+，意味着约九个月净增约 200 名 W-2
              精神科医生。若每名精神科医生的就诊量保持稳定，这一人力扩张与收入继续加速相一致。


              公开记录中最具体的收入数字，是管理层披露 2021 至 2024 年收入增长 1,745%。这是四年内很醒目的复合增速（约 107% 复合年增长），但起始基数和 2024
              年绝对金额没有披露。公开记录中唯一外部收入估计来自 Latka（一个自报式 SaaS 收入数据库），其估计截至 2025 年 9 月年化收入运行率约 $94.7 million。Latka
              的方法依赖创始人自报或推导估计，且其他字段存在重大不准确（把公司描述为未融资、纯 SaaS），因此这一数字应视为量级估计，而不是经审计收入。没有分析师或投资人公开确认过具体收入数字。Deloitte 2025 年
              Technology Fast 500 认可能够第三方确认高增长率，但没有给出美元金额。


              医疗系统渗透率是收入扩张潜力的领先指标。通过 Mindshare Partner Program，Talkiatry 已与美国前 20 大医疗系统中超过三分之一建立合作，总合作系统数超过 50 个。2026 年
              4 月宣布的 AMGA 合作进一步加速了这条 B2B 渠道。此前合作公告包括 HCA Healthcare（2024 年宣布）和 BetterHelp/Business（2024 年 9
              月），两者都增加了转诊管道，但未披露经济条款。合在一起看，这些迹象表明公司正在构建耐久的机构需求护城河，尽管每项合作的收入贡献没有公开量化。
