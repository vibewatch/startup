companyProfile:
  summary: >
    Talkiatry 是一家总部位于纽约市的远程精神科公司，由 Robert Krayn（CEO）和 Dr. Georgia Gaveras, DO（CMO）于 2019 年联合创办。COVID-19 期间，公司转向全虚拟模式，并在
    2020 年 4 月完成首次患者就诊。公司以“全栈医疗服务集团”运营，直接雇佣 800+ 名全职 W-2 精神科医生，使其成为美国最大的私营精神科医生雇主；同时进入 100+ 个保险计划网络，覆盖 45 个州的 170M+
    参保人。截至 2026 年 2 月，Talkiatry 已交付 3M+ 次患者就诊，以精神科医生主导的药物管理为核心，叠加量表驱动照护和自研 AI 驱动照护平台。公司累计融资超过 $400M，最近一轮是 2026 年 2 月由
    Perceptive Advisors 领投的 $210M 超额认购 Series D，另有 Banc of California 债务融资额度。Talkiatry 拒绝披露估值；市场流传的约 $1.4B
    独角兽标记来自行业推算，并非公司确认。
