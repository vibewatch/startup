            body: >
              Cerebral 与 DOJ/DEA 达成 $3.6 million 和解、向 FTC 支付 $7 million+，并退出受控物质业务；再叠加 Done Global 的刑事逮捕，两家最激进、聚焦 ADHD
              的远程精神科平台已从竞争格局中被结构性清出。Talkiatry 的 W-2 合规模型避开了规模化开药激励结构，在市场整合关键时点，更容易获得支付方、雇主和监管机构认可。
