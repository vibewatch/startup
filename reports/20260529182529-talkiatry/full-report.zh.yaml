          - type: callout
            title: 支付方报销压缩威胁所有网内行为健康平台
            body: >
              Aetna 2026 年 5 月下调 Alma 签约治疗师费率，说明行为健康网络中介规模扩大后，支付方正在动用议价能力。Talkiatry 的 W-2
              成本结构意味着它会把支付方费率变化直接吸收到单元经济里——不像 1099 市场平台可以把费率变化转嫁给承包方。APA 调查显示，约 35%
              治疗师已因报销过低拒绝保险；这揭示了全行业供需动态，一旦支付方费率被压缩，Talkiatry 的利润率轨迹也会受影响。
