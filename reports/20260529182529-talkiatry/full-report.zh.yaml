      - number: '1.4'
        title: 里程碑、合作与不利事件
        blocks:
          - type: paragraph
            body: >
              Talkiatry 的时间线显示，临床与商业快速扩张，中间穿插了重要不利披露。公司 2019 年注册成立，2020 年 4 月接收首位患者，2021 年开设曼哈顿办公室，同时搭建全国保险合约。2023 年 8
              月，公司与 NOCD 建立 OCD 治疗转诊合作；2023 年 12 月，又与 Charlie Health 合作，开展青少年和青年照护协调，显示公司正从直接面向消费者的精神科，走向生态整合。2023
              年末，Talkiatry 推出 Mindshare Partner Program，让医疗系统可在自有电子病历工作流中转诊患者；到 2026 年 2 月 Series D 时，该项目已扩展到美国前 20
              大医疗系统中超过三分之一，并覆盖总计 50+ 个系统。2024 年 9 月，公司与 BetterHelp 合作，为 BetterHelp 的雇主客户提供精神科服务，新增雇主渠道。2025 年，公司入选
              Deloitte Technology Fast 500 北美增长最快公司榜。不利面上，Truth in Advertising（TINA.org）在 2024 年 1 月质疑 Talkiatry
              宣称“多数就诊患者费用为 $30 或更低”，但很多患者收到数百美元意外账单；公司 2024 年 12 月从网站移除了该说法。BBB 和 Trustpilot 上的消费者投诉印证了账单混乱。更严重的是，2025 年
              10 月，美国加州中区联邦地区法院推进一项联邦集体诉讼，指控 Talkiatry 未经同意向 Meta Platforms
              分享患者健康信息，违反州和联邦隐私法。该诉讼经受住了部分驳回，按本报告运行日期仍在审理。此外，现任和前任精神科医生在专业论坛上对基于生产率的薪酬指标和严格竞业限制条款提出担忧；规模扩大后，这些问题可能影响临床医生留存。
