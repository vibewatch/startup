  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与投资立场
        blocks:
          - type: paragraph
            body: >-
              对 Talkiatry 的建议是在推断的独角兽级价格上观察 /
              继续研究，置信度中等，风险评级高；估值立场可以概括为：相对上市可比公司偏高，但在拿到私人财务数据前，相对非上市同业仍可辩护。公司确实是一家运营很强的业务：它是美国最大的精神科医生私营雇主，拥有 800
              多名全职临床医生，已交付 3 million 次患者就诊，进入 100 多家保险方网络、覆盖超过 170 million 人，并披露 2021 到 2024 年管理层口径收入增长 1,745%。2026 年 2
              月 Series D 获得超额认购，并吸引了由 Perceptive Advisors 领投、Sofina 以及既有领投方 Andreessen Horowitz、blisce/ 和 Left Lane
              Capital 参与的可信机构财团。这些事实支撑其相对增长较慢的上市服务同业享有私人市场溢价。

              这不是买入建议，原因是价格纪律和披露不透明，而不是公司质量。Talkiatry 尚未披露年经常性收入（ARR）、毛利率、净留存率、现金消耗、EBITDA
              或支付方集中度，并且明确拒绝评论估值。投资逻辑（保险覆盖、结局经过验证、可接入价值医疗的精神科服务，并且是品类中增长最快者）和反向逻辑（劳动密集型精神科医生雇佣模式、未披露单位经济、开方监管暴露，以及 2026
              年倍数压缩）都有证据支撑；正因如此，入场决定取决于能否在为推断的约 $1.4 billion 价格做投资承保前拿到私人数据。
