      - number: '6.2'
        title: 医疗系统与转诊合作伙伴客户
        blocks:
          - type: paragraph
            body: >
              Talkiatry 的 Mindshare Partner Program 于 2023 年 11 月推出，是公司获取医疗系统和医生集团客户的主要机制。该计划允许医院系统、门诊照护集团和责任制照护组织通过既有
              EMR 工作流，把患者直接转入 Talkiatry 网络；Talkiatry 负责入组、保险核验、触达和排期，通常在五个工作日内完成。伙伴组织可免费加入。启动时，创始伙伴包括 NYU Langone Health
              Ambulatory Care、NOCD（OCD 专科照护）和 Transact Campus。到 2026 年初，Talkiatry 自家合作伙伴页面称，美国顶级医疗系统中有 35% 与其合作；公司还称
              Mindshare 目前整体覆盖 50+ 个医院系统。HCA Healthcare 是第一个在 EHR 层面集成的大型医疗系统伙伴；HCA 初级保健和急诊服务者可以在病历内触发 Talkiatry
              转诊，Talkiatry 则在患者同意后，把协调照护文档（诊断、药物）回传给转诊临床医生。2026 年 4 月，Talkiatry 宣布与 New York Cancer & Blood
              Specialists（NYCBS）合作，用 Talkiatry Connect 将精神科照护嵌入 30+ 个肿瘤科地点；Talkiatry Connect 是覆盖云端 EMR 的照护协调平台。同月，AMGA
              (American Medical Group Association) 宣布战略合作，使 AMGA 成员组织——服务三分之一美国人、包含 175,000+ 名医生——能够把患者接入 Talkiatry 的
              800+ 名雇佣精神科医生网络；该网络已进入 100+ 个保险计划。对转诊服务者而言，商业理由是零行政成本、行为健康等待时间近乎为零，避开新精神科预约全国平均 6+ 周等待。Talkiatry 还与
              Charlie Health 合作开展青少年升阶/降阶照护：需要强化门诊服务的 11-33 岁患者会被转给 Charlie Health 的虚拟 IOP，而 Charlie Health 阶段性降级的患者会转回
              Talkiatry 接受持续精神科照护。
