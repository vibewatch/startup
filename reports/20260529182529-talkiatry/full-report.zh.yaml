      - number: '3.4'
        title: 现状型与既有替代：本地精神科、PCP 开方和急性护理
        blocks:
          - type: paragraph
            body: >
              精神科最大的单一竞争力量不是 VC 支持的远程医疗公司，而是既有现状：患者得不到治疗、为线下精神科预约等待数月，或从初级保健医生而非精神科医生那里获得精神类药物管理。约 55%
              的美国县没有执业精神科医生。学术医疗中心和私营团体诊所的线下门诊精神科等待时间通常超过 4 到 12 周。在这个背景下，Talkiatry
              声称可为覆盖患者提供当周可约服务，相比现状确实是可及性优势，而不只是相对直接同行的差异化。

              初级保健开方是精神科药物管理的最大替代：美国估计 80% 抗抑郁药处方由非精神科医生开具，主要是 PCP。全科医生和内科医生用 SSRI、SNRI
              或情绪稳定剂治疗焦虑和抑郁，构成当前药物性精神科照护“市场”的重要部分，也是 Talkiatry 和竞争者必须转换的人群。这种转换较慢，因为它需要改变患者与医生关系，并说服 PCP 转诊而不是自行管理。

              传统线下精神科团体诊所（独立或附属于医疗系统）仍是复杂病例的黄金标准，也是需要线下监测或 IV /
              注射药物的高严重度疾病的首选场景。这些机构通常患者面板更短、等待时间更长，并面临网络外账单挑战，尤其是商业支付方。不过，它们在精神科医生自身那里保有可信度优势；医生可能更偏好团体或个人执业模式，而不是在远程医疗公司做
              W-2 员工。

              急诊科（ED）和精神科住院代表危机护理兜底，Talkiatry 的预防和持续照护模式旨在减少这种需求。Array Behavioral Care 与 TeamHealth 的合作专门填补这一 ED
              缺口，Brightside Health 的 Crisis Care 项目服务自杀意念风险。Talkiatry
              没有公开声称具备危机干预能力，这形成一个照护严重度天花板，可能限制其渗透高严重度患者人群，或要求与危机服务建立转诊协议。

              雇主赞助 EAP 项目（由 Aetna、Cigna、Optum、Lyra Health 和 Spring Health 雇主平台提供）是商业细分中既有的心理健康福利机制。EAP 通常提供 3 到 5
              次免费治疗会话，并由雇主按每会员每月合同付费。Grow Therapy 的 EAP 桥接模式和 Spring Health 的雇主平台直接瞄准这些既有关系。Talkiatry 的雇主分发策略（通过
              BetterHelp / 雇主合作）则以多数 EAP 项目没有的精神科级别照护来与这些模式竞争。
