        - label: 达到 5+ 次复诊（估计 30%）
          value: 30
        - label: 持续护理参与（估计 25%）
          value: 25
  - id: FU003
    title: 客户证明矩阵——按客户层级划分的证据质量
    type: matrix
    layout: wide
    summary: Talkiatry 关键客户层级的证据质量、结果具体性、合作方集成深度和公开证明成熟度。
    claimRefs:
      - CU013
      - CU015
      - CU016
      - CU021
      - CU033
      - CU034
    data:
      columns:
        - 部署成熟度
        - 临床结果证明
        - 集成深度
        - 公开证据质量
      rows:
        - label: 直接患者（商业险 / Medicare）
          values:
            - 已投产运行（3M+ 次就诊）
            - 同行评审 JMIR 2023；Archives of Psychiatry 2025
            - 自助服务；Zocdoc；应用
            - 高——多个独立来源
        - label: 医疗系统 / Mindshare（HCA 标杆）
          values:
            - 已投产运行（EHR 集成，已在 HCA 全面上线）
            - 公司声称约 5 天可获得服务；无合作方归因结果
            - EHR 集成；护理闭环文档
            - 中——新闻报道 + 公司 PR；无结果数据
        - label: BetterHelp 雇主渠道
          values:
            - 已投产运行（2024 年 9 月上线）
            - 未公开发布雇主渠道结果
            - BetterHelp Business 门户；治疗师转精神科医生
            - 低至中——仅联合新闻稿；无渠道 KPI
        - label: NYCBS 肿瘤（Talkiatry Connect）
          values:
            - 早期投产（2026 年 4 月宣布；30+ 个 NYCBS 网点）
            - 尚无患者结果数据；刚宣布部署
            - EMR 覆盖层（Talkiatry Connect）；云端转诊工作流
            - 低——仅上线公告；无结果
        - label: AMGA 成员机构
          values:
            - 已启用（2026 年 4 月宣布合作）
            - 公司披露：2 次就诊后焦虑症状减少 87% / 抑郁症状减少 86%
            - 成员机构 EHR 转诊框架
            - 低——战略合作公告；单个成员采用情况未知
  - id: FU004
    title: Talkiatry 采用与合作里程碑时间线
    type: timeline
    layout: wide
    summary: 关键客户和合作里程碑，展示 Talkiatry 从上线到 2026 年 5 月的采用轨迹。
    claimRefs:
      - CU029
      - CU030
      - CU014
      - CU015
      - CU017
      - CU022
    data:
      items:
        - label: 2020 年 4 月——首次患者就诊
          description: Talkiatry 上线纯虚拟精神科服务；一开始即接入商业保险网络。
        - label: 2023 年 11 月——Mindshare Partner Program 上线
          description: NYU Langone Health Ambulatory Care、NOCD 和 Transact Campus 宣布成为创始合作方。该计划允许医疗系统免费进行 EHR 集成转诊。
        - label: 2023 年 12 月——Charlie Health 青少年合作
          description: 面向 11-33 岁人群的升阶 / 降阶护理合作，覆盖 31 个 Talkiatry 州和 27 个 Charlie Health 州。
        - label: 约 2024 年 4 月——累计 100 万次患者就诊
          description: 首个披露的就诊量里程碑；CEO 称“绝大多数”发生在此前 12 个月，显示增长在加速。
        - label: 2024 年 9 月——BetterHelp 雇主渠道
          description: 独家雇主渠道合作让 BetterHelp Business 客户（1,000+ 个雇主 / 支付方合作关系）可使用 Talkiatry 网络内精神科服务。
        - label: 2025 年 5 月——200 万次患者就诊；600+ 名精神科医生
          description: 跨过第二个里程碑；精神科医生团队达到 600+ 名全职雇佣的 W-2 提供者。
        - label: 2026 年 2 月——300 万次就诊；800+ 名精神科医生；$210M Series D
          description: 第三个就诊里程碑；团队扩至 800+；完成 $210M Series D 融资以继续扩张。
        - label: 2026 年 4 月——AMGA 战略合作
          description: AMGA（175,000+ 名医生，服务每 3 名美国人中的 1 名）合作使成员机构能够在全美转诊至 Talkiatry。
        - label: 2026 年 4 月——NYCBS 肿瘤合作（Talkiatry Connect）
          description: 首个披露名称的专科医疗集成：30+ 个 NYCBS 肿瘤网点使用 Talkiatry Connect 进行精神科转诊。
        - label: 2026 年 5 月——50+ 家医疗系统合作方（Mindshare）
          description: 美国前 20 大医疗系统中 35% 已通过 Mindshare 计划与 Talkiatry 合作。
  - id: FR001
    title: 风险热力图：Talkiatry 主要风险的严重度与可能性
    type: matrix
    layout: standard
    summary: |
      Y 轴为严重度（高、中、低），X 轴为可能性（低、中、高）。单元格列出监管和运营登记表中的主要风险。
    data:
      columns:
        - label: 低可能性
        - label: 中等可能性
        - label: 高可能性
      rows:
        - label: 高严重度
          values:
            - 数据泄露；不利临床事件；Cerebral 式执法
            - DEA 开方灵活性失效；处方中断；患者数据泄露
            - Meta Pixel 集体诉讼判决；支付方合同终止
        - label: 中严重度
          values:
            - 债务契约违约
            - HIPAA Security Rule 升级负担；高病情复杂度患者扩张失败
            - 多州执照合规缺口；MHPAEA 审计敞口
        - label: 低严重度
          values:
            - CEO 关键人物离任
            - BetterHelp 或 Magellan 渠道中断
            - 消费者账单投诉升级
    approximationNotes: |
      可能性和严重度评级基于公开证据做定性判断；Talkiatry 是私营公司，暂无精算数据可用。鉴于开方灵活性将在 2026 年 12 月 31 日到期，永久规则仍未最终落定，DEA 开方风险上调至高可能性。
    claimRefs:
      - CR001
      - CR004
      - CR007
      - CR008
      - CR009
      - CR029
      - CR043
