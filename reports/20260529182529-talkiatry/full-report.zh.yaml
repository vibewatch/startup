      - number: '8.5'
        title: 投资逻辑失效触发因素与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              会改变建议的触发因素，不只是改叙事，而是足以改判断。若收入显著低于约 $95 million 运行率，或出现增长减速证据，溢价倍数逻辑会坍塌，立场将转向悲观区间。DEA 远程医疗开方回滚或 DOJ
              执法行动——正是抹去 Cerebral
              大部分价值的机制——会无视增长而压低整个精神科开方模式的重估。若精神科医生薪酬拖累毛利率，或披露出严重支付方集中度，也都会压缩可辩护倍数。反过来，如果确认净留存率强、价值医疗收入有实质规模，则可支撑乐观情景，并可能让建议转向更积极。

              要把这份基于公开证据的看法转化为可投资承保的判断，最低尽调清单很具体：当前 ARR 和月度收入桥；产品级毛利率和精神科医生成本结构；净留存率和患者队列经济；支付方组合与集中度；Series C/D
              股权与债务拆分；以及优先股和清算优先权堆叠。退出准备原则上可以支撑——LifeStance 是公开市场先例，行为健康资产仍是支付方和医疗系统整合者的收购目标——但 2026 年窗口是选择性的。在拿到
              ARR、毛利率、留存和股权结构表细节前，有纪律的姿态是继续观察，并在披露改善或价格降低时重新评估。
            claimRefs:
              - CV039
              - CV040
              - CV041
              - CV043
              - CV044
