chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、产品平台与当前规模
        blocks:
          - type: paragraph
            body: >
              Talkiatry 是一家总部位于纽约市的全国性全栈远程精神科服务方。公司由 Robert Krayn 和 Dr. Georgia Gaveras 于 2019 年联合创办，2020 年 4
              月完成首次患者就诊；最初计划采用线下与虚拟结合的模式，COVID-19 封控后被迫全面转向虚拟服务。这个转向反而成为催化剂：Talkiatry
              此后成长为其自称的美国最大私营精神科医生雇主。公司的核心产品是完全通过远程医疗交付的保险网络内精神科照护。平台把患者匹配给全职、通过专科委员会认证的 W-2 雇佣精神科医生，先进行 60–75
              分钟的初始评估，之后持续接受药物管理和支持性心理治疗。治疗疾病包括焦虑、抑郁、ADHD、双相障碍、OCD、PTSD、产后抑郁等。商业上最鲜明的差异化，是保险网络覆盖够广：截至 2026 年 2 月 Series
              D 公告，Talkiatry 已进入 100+ 个保险计划网络，覆盖 170M+ 人，既包括 Aetna、Blue Cross Blue Shield、United Healthcare、Cigna、Humana
              等商业支付方，也包括 Medicare 计划。公司的自研 AI 驱动技术平台自动处理排班、账单、患者互动和照护协调，让精神科医生把精力放在临床工作上。规模曲线很陡：公司从 2020 年 4 月零起步，2023
              年中突破 1M 次患者就诊，2025 年 5 月达到 2M 次，2026 年 2 月突破 3M 次。截至 Series D 公告，2021 至 2024 年收入增长
              1,745%，但当前精确运行率未公开披露。地理覆盖达到美国 45 个州。
