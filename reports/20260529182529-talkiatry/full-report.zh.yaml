        - 最终规则或弹性失效要求 Schedule II-V 物质必须线下评估
        - ADHD 和焦虑药物管理遭遇重大扰动；重新评估模式可行性
      - - Meta Pixel 集体诉讼出现不利判决或大额和解
        - PACER 文件；Bloomberg Law；加州中区法院案卷
        - 法院判决 Talkiatry 败诉或和解金额超过 $10M
        - 声誉受损叠加财务影响；评估 OCR 并行调查风险
      - - 主要支付方合同终止或报销费率下调
        - 保险方网络目录；主要支付方财报电话会
        - 一个或多个前 5 大支付方关系暂停，或费率下调超过 10%
        - 固定成本底座暴露；财务模型承压；融资紧迫性上升
      - - 严重不良临床事件触发监管调查
        - 州委员会纪律文件；HHS OCR；新闻监测
        - 州委员会处罚或 OCR 调查点名 Talkiatry
        - 临床质量叙事可信度受损；企业销售受扰
      - - 需要以显著更低估值进行第二次融资
        - Crunchbase；新闻稿监测；Banc of California 债务信号
        - 以低于上一轮估值融资，或债务契约违约
        - 资本结构恶化；执行能力受限
      - - Cerebral 式处方执法行动点名 Talkiatry
        - DOJ USAO 新闻稿；DEA 执法行动；FTC 文件
        - DEA 或 DOJ 因处方实践启动调查，或签署 NPA
        - 声誉遭遇生死级打击；支付方和医疗系统伙伴流失
      - - 大规模数据泄露暴露患者心理健康记录
        - HHS OCR 泄露门户；新闻监测；集体诉讼文件
        - 向 OCR 报告 500 条或更多患者记录泄露
        - HIPAA 执法；集体诉讼敞口叠加现有诉讼
    claimRefs:
