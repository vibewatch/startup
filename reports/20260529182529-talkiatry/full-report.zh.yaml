      - number: '5.6'
        title: 证据材料
        blocks:
          - type: callout
            title: DEA 远程医疗开药断崖是生死级产品风险
            body: >
              Talkiatry 的核心价值主张——无需线下就诊即可获得可开药的精神科服务——完全依赖将于 2026 年 12 月 31 日到期的 DEA 远程医疗弹性规则。第四次延期已生效，但 DEA 尚未敲定永久法规。若
              Ryan Haight Act 的线下要求在年底恢复，Talkiatry 将无法为任何没有此前线下就诊记录的患者启动受控物质处方。考虑到 Talkiatry 病例组合中
              ADHD（兴奋剂）和焦虑（苯二氮卓类）的普遍性，这一监管断层会实质性削弱临床模式和患者可及性。
            calloutType: risk
            claimRefs:
              - CE040
              - CE041
          - type: callout
            title: 消费者端平台体验明显低于高端产品预期
            body: >
              Talkiatry 面向患者的技术得分不佳：原生移动应用处于 beta（2.9/5，17 个评分），Trustpilot 在 566 条评论中显示
              2.7/5，反复出现账单、沟通和排期投诉，员工评论也把平台可靠性列为长期运营问题。在 $210M Series D
              资本化水平下，这是可解决的问题，但临床结果质量与消费者体验质量之间的落差，是有意义的流失和声誉风险。
            calloutType: risk
            claimRefs:
              - CE046
              - CE047
              - CE048
          - type: callout
            title: Talkiatry Connect 用低摩擦产品解决真实医疗系统痛点
            body: >
              这个零成本、一天部署、无需合同、覆盖 30+ 云 EMR 的转诊叠加层，用一个产品解决了被记录下来的医疗摩擦：因 portal-hopping
              导致精神科转诊被放弃。产品与财务激励一致：医疗系统获得转诊可见性，Talkiatry 获得患者量。HCA 和 AMGA 合作以标杆客户验证了该模式。Epic 不兼容限制了总可服务市场，但并不阻断当前增长路径。
            calloutType: strength
            claimRefs:
              - CE024
              - CE025
              - CE026
              - CE027
              - CE028
              - CE029
