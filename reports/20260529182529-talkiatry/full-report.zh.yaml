  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 患者分群与准入路径
        blocks:
          - type: paragraph
            body: >
              Talkiatry 的主要终端用户，是通过远程医疗寻求门诊精神科评估和用药管理的商业保险或 Medicare 覆盖患者。截至 2026 年 5 月，平台在 45 个州运营（不包括
              Alaska、Delaware、Hawaii、North Dakota 和 Wyoming），可及性广但并非全覆盖。Talkiatry 明确不接受 Medicaid——自家帮助文档直说这一点——这从结构上把
              Medicaid 受益人这一重要的低收入和残障群体排除在服务之外。符合条件的患者有四条主要进入路径：通过 talkiatry.com 或 Zocdoc 直接自助注册（患者可实时搜索保险、病症和服务者可用性），来自
              HCA Healthcare 和 AMGA 成员组织等医疗系统伙伴的 EHR 生成转诊，通过 BetterHelp/Business 获得雇主福利入口，或通过 Talkiatry Mindshare
              计划进行临床医生对临床医生转诊。HelpGuide 对 100 名患者的用户调查发现，73% 在 20 分钟或更短时间内完成入组，90% 表示会向朋友推荐
              Talkiatry，说明覆盖患者的入组摩擦较低。不过，19% 等待至少一周才获得首次预约；TINA 报告称，一些患者基于广告所称「$30 or
              less」费用注册后，因保险并未如预期进入网络，两次就诊后收到账单超过 $550。Talkiatry 治疗成人和儿童患者（31 个州提供儿童和青少年服务），覆盖焦虑、抑郁、ADHD、双相障碍、OCD、PTSD
              和产后抑郁等病症，但明确排除需要线下治疗的病症，例如用注射型抗精神病药管理的精神分裂症。纯保险模式意味着，如果患者在治疗中途保险失效或变更，即便希望继续跟同一位精神科医生就诊，也会失去使用权限。
