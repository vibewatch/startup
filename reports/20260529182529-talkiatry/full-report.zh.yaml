          - type: callout
            title: AMGA 与 Mindshare 通过临床医生网络合计触达 1/3 美国人
            body: >
              Mindshare 计划（50+ 个医疗系统，覆盖前 20 大中 35%）与 2026 年 4 月 AMGA 合作（175,000+ 名医生，服务 1/3 美国人）叠加后，让 Talkiatry
              有机会成为美国最大有组织医生网络事实上的精神科备案合作伙伴。即便只有一小部分 AMGA 成员激活 Mindshare
              转诊，患者漏斗也可能相当可观。关键尽调缺口在于，医疗系统合作伙伴是在主动转诊（且转化率多少），还是只是签了合作协议。
