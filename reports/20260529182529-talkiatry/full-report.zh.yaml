      - number: '2.3'
        title: 买方、支付方与细分市场图谱
        blocks:
          - type: paragraph
            body: >
              保险网络内远程精神科有三层利益相关方：患者是用户和临床受益者；商业保险方或政府项目（Medicare、Medicaid）是主要支付方；雇主（通过福利设计）或医疗系统（通过转诊和容量合作）则是上游渠道塑造者。商业保险是主导渠道：截至
              2025 年，几乎所有美国大型雇主（97%）都提供心理健康福利，73% 明确覆盖远程心理健康服务。雇主赞助商业市场推动网络准入谈判；Talkiatry 覆盖 100+ 个保险计划、170M+
              参保人，把雇主计划广度转化为直接患者触达。Medicare 已永久扩展：行为健康远程医疗如今没有地理发起地点限制，允许居家就诊且不设注册上限，使 Medicare
              受益人（65+）成为网络内精神科结构性可触达的细分市场。Medicaid 覆盖因州而异，但扩张趋势明确：认证社区行为健康诊所从 2017 年 8 个州的 67 家，增长到 2025 年 46 个州和 DC 的
              500+ 家。雇主也越来越通过 EAP 渠道扮演直接支付方：Oliver Wyman / Mercer 对高价值 EAP 的约 $6B 估计，识别出一笔近期雇主赞助精神科预算，可经由雇主福利合作把患者导入
              Talkiatry 这类平台。医疗系统是转诊和容量合作渠道，而不是直接支付方；Talkiatry 的企业合作沿 B2B2C 路径展开，由医疗系统承担溢出风险，Talkiatry 提供已认证医生覆盖。
