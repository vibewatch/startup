      - number: '1.3'
        title: 融资历程与投资方图谱
        blocks:
          - type: paragraph
            body: >
              Talkiatry 的融资历程横跨 5 年，公开披露过 4 笔融资。公司 2021 年 2 月启动 Series A，获得 Sikwoo Capital Partners、Relevance Ventures 和
              CityMD 创始人 Dr. Richard Park 的 $5M 投资。Left Lane Capital 在 2021 年 7 月领投追加 $15M，完成首期 $20M Series A。2022 年 1
              月，公司又追加 $17M，使 Series A 总额达到 $37M。已保留来源中没有单独披露 Series B；下一笔重要融资是 2024 年 6 月的 $130M Series C，由 Andreessen
              Horowitz（a16z）领投，Perceptive Advisors 参投，并获得 Banc of California 债务融资额度。该轮使公开披露融资总额达到 $245M。最近一轮是 2026 年 2
              月，Talkiatry 完成 $210M 超额认购 Series D，由 Perceptive Advisors 领投，Sofina（比利时上市投资公司）、a16z、blisce/ 和 Left Lane
              Capital 参投，并再次配有 Banc of California 债务融资额度。累计融资现已超过 $400M。Talkiatry 未披露当前估值；行业报告中流传 $1.4B 数字，但公司未正式确认。Banc
              of California 反复提供债务支持，说明公司积极用信贷额度配合股权融资来支撑增长。已保留来源中没有发现 Banc of California
              之外的二级交易或其他信贷额度。董事会构成、投资者控制权和股权结构细节均未公开披露。
