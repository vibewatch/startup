      - number: '3.3'
        title: 替代平台与不利监管信号：Cerebral、Done、BetterHelp、Array
        blocks:
          - type: paragraph
            body: >
              Cerebral 和 Done Global 的监管崩塌，对 Talkiatry 是双刃剑。一方面，它清除了 ADHD 药物管理细分中的竞争者，并验证了 Talkiatry 合规的 W-2
              模式。另一方面，围绕远程医疗管制药物开方的监管审查，仍是所有远程精神科服务方（包括 Talkiatry）的结构性拖累。

              Cerebral 的轨迹最能说明不利案例。公司成立于 2019 年，巅峰估值 $4.8B，累计融资 $462M，在获得显著公众关注后，DOJ 和 DEA 调查人员发现其在 2019 至 2022
              年间鼓励未经授权分发包括 Adderall 在内的管制药物。2024 年 11 月，Cerebral 与纽约东区达成不起诉协议，同意支付 $3.6M（另有 $2.92M 延期付款，取决于 30
              个月合规情况）。另行，Cerebral 因欺骗性取消做法和敏感数据分享向 FTC 支付 $7M+。公司完全放弃管制药物开方。Done Global 领导层 2024 年 6 月因 ADHD
              兴奋剂管理违规被刑事逮捕。这些结果说明，开方做法激进的远程精神科平台面临生死级合规风险。

              DEA 于 2025 年 1 月提出特殊远程医疗注册框架，要求通过远程医疗开具 II 类药物（Adderall、Ritalin）的执业者：（a）与患者位于同一州；且（b）至少 50%
              处方在面诊后开具。如果该规则落地，将在结构上不利于纯远程医疗 ADHD 平台，并利好 Talkiatry 的合规模型；不过 Talkiatry 也依赖 DEA 目前延长至 2025 年 12 月的远程医疗弹性。

              BetterHelp/Teladoc 主要在治疗细分中竞争：2026 年 Q1 收入 $218.4M，同比下降 9%，原因是现金支付用户减少。Teladoc 收购虚拟心理健康和精神科平台 UpLift
              后，BetterHelp 的保险覆盖会话在 2026 年 Q1 达到约 $13M / 季。Teladoc 管理层目标是在 2026 年底达到 $125M+ 年化保险收入运行率。BetterHelp 2024 年
              9 月宣布与 Talkiatry 合作，让购买 BetterHelp 平台的雇主可以使用 Talkiatry 的精神科服务——把原本纯替代关系转化为互补关系。该合作证明 Talkiatry
              在不进入直接治疗竞争的情况下扩大分发触达。

              Array Behavioral Care 是一家面向医疗系统的远程精神科执业机构，已有 25+ 年经验，并拥有基于 Epic 的 EHR 平台，可与医院工作流集成。其 2025 年与 TeamHealth
              合作支持急诊科精神科，其 2026 年 5 月结果报告显示抑郁和焦虑缓解率优于行业基准，再加上整合急诊、门诊社区和居家虚拟照护的 CareConnect 平台，使 Array 成为医疗系统远程精神科渠道中的
              B2B 既有玩家。Array 不与 Talkiatry 争夺直接面向消费者的保险网络内患者；它服务的是医院转诊人群，Talkiatry 可以通过医疗系统合作触达这类人群，但尚未公开把它作为主要分发路径。
