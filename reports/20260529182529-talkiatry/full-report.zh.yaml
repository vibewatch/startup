  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 面向患者的产品与服务范围
        blocks:
          - type: paragraph
            body: >
              Talkiatry
              的核心患者产品，是一个保险覆盖、虚拟优先的精神科诊所，可通过网页和移动应用（iOS/Android）访问。入组从一份简短评估开始，收集临床病史、保险信息和临床医生偏好；平台随后为患者匹配最多四名网内精神科医生，初诊通常可在数天内预约。虚拟就诊使用
              healow™ 平台（诊所代码 FGCACD），这是第三方远程医疗基础设施，也提供安全消息、健康记录和预约管理。Talkiatry 原生应用（1.3.0 版，2026 年 4 月 29 日发布）仍处于
              beta，App Store 评分 2.9/5（17 个评分），提供快速进入 healow 门户、加入就诊、预约管理和教育 PDF 等功能。

              服务范围覆盖十一类病症：ADHD、焦虑、双相障碍、儿童心理健康（5–18 岁）、抑郁、OCD、产后问题、情绪障碍、失眠、物质使用障碍（SUD）和 PTSD。评估窗口为成人初诊 60 分钟、儿童和青少年初诊 75
              分钟、复诊 30 分钟。Talkiatry 明确排除需要线下给药的病症——精神分裂症（注射型抗精神病药）被列为典型不在范围内的案例。平台不接受
              Medicaid，也不提供自费或现金支付选项；所有患者都必须拥有符合条件的网内保险。多数患者平均估计共付额为 $30，但实际自付费用会随计划免赔额变化，并已引发大量关于账单透明度的消费者投诉。Truth in
              Advertising 在 2024 年 1 月调查其「$30 or less」广告主张后，Talkiatry 的保险页面增加了说明。

              截至 2026 年 5 月，Talkiatry 已完成超过 3 million 次患者就诊，雇佣 800+ 名全职精神科医生，平均拥有 10 年临床经验，覆盖 26 个亚专科并能使用 32 种语言。公司在 47
              个州运营，保险覆盖来自 100+ 个计划，约覆盖 170 million 商业保险人群。公司获评 2025 MedTech Breakthrough Awards「最佳虚拟照护平台」。
