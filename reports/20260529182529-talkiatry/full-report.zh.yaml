      - number: '4.3'
        title: 成本结构与单元经济
        blocks:
          - type: paragraph
            body: >-
              Talkiatry 最大、也最有辨识度的成本是精神科医生队伍。不同于依赖独立承包方的市场模式竞争者，公司直接雇佣 800+ 名带福利的全职 W-2 精神科医生。相对于纯平台业务，这带来更高的固定成本结构：800
              名医生的工资、福利、医疗事故保险、资质认证和入职培训，都是可观的经常性开支。CEO 在 STAT News 的 Series D 报道中明确承认了这一点，称 $210 million
              融资部分是为了提供财务缓冲，以便在 2024 年 Change Healthcare 勒索软件攻击这类扰乱全行业理赔处理的收入中断事件中维持发薪。


              单次就诊经济可以从公开数据中部分推断。Talkiatry 按网内精神科 CPT 编码计费——主要是 90791（精神科诊断评估，初诊 60–75 分钟）和 90837（带 E/M
              的心理治疗，复诊）——费率为谈判后的网内费率。Medicare 对这些编码的收费表基准约为初诊 $155、60 分钟复诊 $148（2025
              年全国非机构费率），但商业支付方费率单独谈判，通常更高。Talkiatry 的精神科医生薪酬按生产力计算：专业论坛和医学生网络上的公开披露显示，要拿到最高档薪酬，每周约需 36
              个可计费患者小时，高产精神科医生估计收入为 $330,000–$400,000。这意味着精神科医生人力成本是半可变的（随就诊量上升），规模扩大后能提供一定经营杠杆，但如果生产力门槛被认为过重，也会制造留任压力。


              行政杠杆来自公司所称的自研 AI 平台，用于自动化排班、计费、资质认证和患者协调。这是 Talkiatry
              的主要技术护城河：把私人执业精神科医生最头疼的流程（网内资质认证、保险计费、预授权）标准化，同时保持全职雇佣关系。该平台还通过 EHR 转诊流程支持医疗系统集成。毛利率、技术运营成本和 CAC
              均未披露。公司声称倦怠率比行业平均低 80%，临床医生满意度调查得分为 90%；这些是公司材料引用的内部生成指标，间接支撑 W-2 模式从留任角度看具备经济可持续性，但并不直接衡量财务单元经济。
