  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 对 Talkiatry 的影响
      - 尽调事项
    rows:
      - - 精神科医生供给短缺（预计到 2038 年缺口 43,810 名）
        - 驱动因素
        - 结构性 / 跨数十年
        - 短缺地区需求长期超过供给；远程医疗消除地域错配
        - 将 Talkiatry 患者地理分布与 HPSA 划定地区匹配，量化覆盖优势
      - - 137M 美国人处于心理健康短缺地区（占美国人口 40%）
        - 驱动因素
        - 当前存在且继续恶化
        - 大量可服务人群没有可行线下替代；远程医疗是主要入口
        - 估算 HPSA 人群向 Talkiatry 网内参保人群的转化
      - - Medicare 行为健康远程医疗——永久扩展（无地域限制，可居家）
        - 驱动因素
        - 永久（2023 年起生效）
        - 65+ 细分变得可持续；消除 Medicare 患者支付方断崖风险
        - 披露 Medicare 与商业支付方收入占比；Medicare Advantage 网络充足性
      - - 州层面 MHPAEA 平价执行收紧
        - 驱动因素
        - 短期（2025–2026 年州层面）
        - 保险公司承压扩充网内精神科提供者名单；利好大型平台
        - 量化 Talkiatry 在 2025–2026 年平价执行浪潮中新增多少保险公司合同
      - - 远程医疗常态化：2024 年行为健康占美国全部远程医疗就诊 65.6%
        - 驱动因素
        - 当前——结构性迁移已完成
        - 患者和提供者顾虑下降；转诊路径现在默认精神科虚拟优先
        - 衡量患者满意度和爽约率，并与线下基准比较
      - - 雇主心理健康投入（97% 提供福利，73% 覆盖远程医疗；EAP 市场约 ~$6B）
        - 驱动因素
        - 持续；高价值 EAP 是增长最快细分
        - 雇主渠道正扩大网内精神科的获客漏斗顶部；与 BetterHelp 合作验证该模式
        - 获取来自雇主渠道的患者量占 Talkiatry 总量比例；评估 EAP 合同条款
      - - 心理健康诊断和求治增加（2018–2024 年利用率提升 62.6%）
        - 驱动因素
        - 趋势持续
        - 即便供给不扩张，合格患者池也在增长
        - 评估 Talkiatry 自然获客成本，并与雇主渠道或医疗系统转诊成本比较
      - - DEA 远程医疗开具处方灵活性到期风险（当前延期至 2026 年 12 月 31 日）
        - 约束
        - 二元风险：2026 年底
        - 若永久规则未敲定，受控物质处方（兴奋剂、苯二氮卓类）将重新要求线下就诊；约 ~24% 药物患者受冲击
        - 要求法律分析 Talkiatry 面临 Ryan Haight 规则回弹的暴露；审查 DEA 特殊注册规则制定进展
      - - 联邦层面 MHPAEA 执行暂停（2024 Final Rule 不执行）
        - 约束
        - 不确定性持续；已声明 18+ 个月不执行
        - 商业保险公司网络充足性压力部分缓解；支付方合同扩张动能放慢
        - 跟踪哪些州已把 2024 Rule 条款纳入州法，以及 Talkiatry 关键支付方是否位于这些州
      - - 幽灵网络和事先授权负担
        - 约束
        - 持续的结构性问题
        - Medicare Advantage 列名的行为健康提供者中 55% 不活跃；事先授权吃掉 5–10% 单次就诊收入；单位经济被侵蚀
        - 获取 Talkiatry 事先授权拒绝率和每临床小时行政成本
      - - 54.7% 治疗缺口：大多数美国精神疾病患者未接受治疗
        - 约束
        - 结构性；单靠远程医疗无法解决
        - 远程医疗缓解可及性，却解决不了污名、成本和病情严重度门槛；因此限制总利用率上限
        - 评估患者流失率，以及获客单人成本与留存单人成本的对比
      - - 对远程医疗开具处方的监管审查（Cerebral $3.6M 罚款；Done Health 刑事指控）
        - 约束
        - 活跃且升级中
        - DEA/DOJ 标准不支持规模优先、临床未验证的处方模式；全栈 W-2 模式加病历审核，是合规差异化点
        - 审查 Talkiatry 的 DEA 审计追踪、处方质量指标，以及任何监管往来函件
      - - 尽管远程精神科有地理灵活性，临床医生供给仍有天花板
        - 约束
        - 结构性 / 跨数十年
        - HRSA 预计精神科医生供给将从 2026 年 37,470 人降至 2038 年 36,550 人；雇主平台必须把精神科医生留住，顶住私人执业替代选项
        - 获取精神科医生流失率和 12 个月留存队列数据
    notes: >
      时间标签反映截至 2026 年 5 月的执法和政策环境。DEA 延期是最具时间敏感性的单点风险。MHPAEA 执法状态采用 Husch Blackwell / Beckers 2026 年 4
      月关于州级执法的报道。利用率数据来自 Mordor Intelligence 2026 年 1 月报告。
