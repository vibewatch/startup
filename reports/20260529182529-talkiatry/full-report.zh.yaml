  - id: TV005
    title: 投资论点破裂与否决触发器表
    columns:
      - 触发器
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 收入支撑失败
        - 披露收入显著低于 ~$95M 运行率，或增长急剧放缓
        - 溢价倍数逻辑坍塌
        - 估值转向熊情景区间；若隐含独角兽价格则放弃
      - - 处方监管冲击
        - DEA 远程医疗处方规则回撤，或 DOJ 执法行动
        - 市场下调精神科处方模式估值（Cerebral 先例）
        - 施加监管折价；入场前要求缓释措施
      - - 毛利质量不及预期
        - 精神科医生薪酬压低毛利
        - 劳动密集型模式封住可辩护倍数的上限
        - 下调估值区间；延长尽调
      - - 付款方高度集中
        - 少数付款方主导收入
        - 下行风险从平台层面变成合同特定风险
        - 要求集中度缓释，并提高折价
      - - 股权结构表下行保护缺乏吸引力
        - 高额优先权或债务导致下行保护薄弱
        - 即便经营业务强，入场纪律也会变差
        - 要求更低价格或更厚的下行保护
    notes: 触发器旨在改变建议；每一项都对应一个可监测事件，并连接到估值立场。
    claimRefs:
      - CV022
      - CV027
      - CV032
      - CV033
      - CV039
      - CV040
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 当前 ARR / 收入
        - 最新收入、ARR 定义和月度桥接
        - 所有估值视角里最大的单一驱动因素
        - CFO / 财务数据室
      - - 毛利和精神科医生成本
        - 产品层面毛利和临床人员薪酬结构
        - 决定服务类基础上加溢价的倍数是否站得住
        - 财务 + 临床运营
      - - 留存和队列经济性
        - NRR、GRR、患者队列留存和扩张
        - 区分增长表象和持久价值
        - 收入运营 / 董事会材料
      - - 付款方组合和集中度
        - 按付款方拆分的收入和头部付款方集中度
        - 检验下行风险是平台层面还是合同特定
        - FP&A + 付款方合约
      - - 资本结构
        - Series C/D 股权与债务拆分、优先股层级、清算优先权
        - 晚期入场时，下行保护和收入同样重要
        - 法务 + 财务
      - - 估值确认
        - 公司确认的 Series D 投后估值
        - ~$1.4B 标记来自行业推断，未获确认
        - 投资人文件 / 股权结构表审阅
    notes: 这些问题是最低数据集，用来把基于公开证据的看法转成可投资承销视角。
    claimRefs:
      - CV003
      - CV032
      - CV033
      - CV041
