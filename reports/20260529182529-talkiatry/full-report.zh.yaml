        - $403.5M Q1 2026 收入；$1.64B FY2026 指引；Nasdaq 上市；8,349 名临床医生
        - 通过 550+ 中心 + 33 州虚拟服务覆盖成人和儿童；商业险和政府支付方
        - 美国最大门诊心理健康服务商；W-2（或受支持执业）模式；已盈利
        - 需要实体中心基础设施；MD 之外还有治疗师和 NP；混合模式不是纯线上
      - - Brightside Health
        - 直接同业 — 纯远程精神科
        - 累计融资 ~$100M+（Series C 2024 年 3 月 $33M）；100M+ 保险覆盖人群
        - 50 州纯线上覆盖成人；商业险、Medicare、Medicaid
        - 自研 PrecisionRx AI（200+ 数据点，首轮响应率 70%）；预约等待 <48 小时；危机护理
        - 不开具 Schedule II 管制药物（ADHD）处方；精神科医生队伍小于 Talkiatry
      - - Headway
        - 相邻 — 治疗师市场
        - 累计融资 $321M+；2024 年 7 月 Series D $100M，估值 $2.3B（2026 年 4 月隐含约 $4.2B）
        - 50 州独立治疗师；商业险、Medicare、Medicaid
        - 34,000+ 名提供者；100+ 网络内计划；为私人执业临床医生简化资质认证和账单
        - 1099 承包商模式；治疗优先，精神科占少数；跨提供者缺乏临床标准化
      - - Grow Therapy
        - 相邻 — 治疗师 / 精神科市场
