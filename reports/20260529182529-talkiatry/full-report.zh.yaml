      - number: '6.5'
        title: 负面信号与客户摩擦
        blocks:
          - type: paragraph
            body: >
              Talkiatry 的负面证据集中在两个结构性问题：患者客户遭遇账单惊讶和保险混乱，以及特定人群被排除在服务之外。截至 2025 年 11 月快照，Talkiatry 在 Trustpilot 566
              条评论中的评分为 2.7/5（差）；AI 汇总评论显示，账单透明度和意外高额收费是最主要投诉主题，多名评论者称，在被告知保险可用后，仍收到了每次就诊 $400-$550 的账单。TINA.org（Truth in
              Advertising）在 2024 年初记录了投诉，称 Talkiatry「$30 or less」广告说法具有误导性，并引用了真实患者收到远超该金额账单的案例；Talkiatry
              随后从网站上移除了这一广告成本说法。BBB 投诉记录也反映出类似的账单和保险沟通问题。纯保险模式给照护连续性带来一个明确负面信号：雇主变更或保险方在治疗中途被 Talkiatry
              网络移除的患者，无法选择自费，只能失去原精神科医生；这对正在接受药物管理的患者尤其具有破坏性。Talkiatry
              不治疗需要线下注射给药的病症（例如精神分裂症使用的长效注射抗精神病药），因此把一部分需求最高的精神科人群排除在平台之外。Medicaid 受益人是成人心理健康患者中的大规模群体，但 Talkiatry
              自身政策将其完全排除，限制了公司触达低收入和残障社区。2022 年 Bloomberg Law 围绕 Meta Pixel
              数据共享的集体诉讼投诉，也引发了患者隐私信任问题。临床医生侧，对抗性动态包括对竞业限制协议和按生产率计酬模式的投诉；这些模式激励就诊量压过医生福祉，可能影响长期临床医生留存，并进一步影响 Talkiatry
              的关键差异化能力——照护连续性。
