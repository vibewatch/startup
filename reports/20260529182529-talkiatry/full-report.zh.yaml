              - CE031
          - type: callout
            title: Talkiatry 是临床运营公司，技术是助推器而非核心护城河
            body: >
              与纯软件远程医疗平台不同，Talkiatry 的防御性来自雇佣医生队伍的规模和质量、支付方签约深度以及结果数据，而不是自研软件。技术栈包括第三方视频/门户（healow）、Chromium
              浏览器叠加层（Talkiatry Connect）和分析工具。AI 主张是真实的，但技术差异化还没达到科技公司的层级。这会影响利润率：临床运营业务比纯平台模式承担更高固定成本，也有更低软件利润率。
