      - number: '5.2'
        title: 临床模式——精神科医生主导的照护与结果基础设施
        blocks:
          - type: paragraph
            body: >
              Talkiatry 的临床模式由精神科医生主导，以用药管理为中心，补充心理治疗只作为精神科照护的辅助。所有服务者都是全职雇员（不是合约市场参与者）、通过委员会认证，并拥有处方资质。标准治疗路径是：线上入组评估 →
              保险核验 → 临床医生匹配 → 全面精神科评估 → 个性化照护计划（药物和/或支持性心理治疗）→ 定期复诊（30 分钟就诊）→ 结果追踪。经患者同意后，平台会把照护协调记录回传给转诊服务者。

              基于测量的照护（MBC）是一项结构性功能：患者在首次就诊前和之后每次就诊时完成经过验证的 GAD-7（焦虑）和 PHQ-8（抑郁）问卷，临床医生据此追踪症状轨迹并调整治疗。Journal of Medical
              Internet Research（JMIR Formative Research，2023）发表的一项同行评审回顾性研究评估了 1,826 名 2023 年 2 月至 9 月接受治疗的商业保险
              Talkiatry 患者。平均 103 天内完成五次预约后，67% 不再有临床显著焦虑症状，62% 不再有临床显著抑郁症状，26% 达到焦虑缓解，29% 达到抑郁缓解；效应量很大（GAD-7 的 Cohen d
              = 1.30，PHQ-8 的 d = 1.39）。公司合作伙伴页面（引用同一研究）称，整体上 65% 患者不再报告临床显著症状。

              AMGA 合作公告（2026 年 4 月）引用了更新后的内部数据：焦虑患者中 87%、抑郁患者中 86% 在仅两次就诊后症状下降。合作伙伴页面引用的一项全国保险方队列分析显示，Talkiatry 患者住院少
              68%、急诊少 32%、每名会员每月节省 $700。Talkiatry 的医疗关联方获得 ACME 认证，可作为继续医学教育（CME）提供者；公司称这在数字健康领域「几乎闻所未闻」。临床医生可通过安全的
              healow 消息联系，标称响应时间为 3 个工作日；不支持当天排期。

              心理治疗只提供给已经参加 Talkiatry 用药管理项目的患者，而不是独立服务——这一刻意划出的临床边界，使 Talkiatry 区别于 BetterHelp 这类纯治疗市场（不提供精神科处方），并把它放在
              LifeStance Health 这类混合服务者旁边。与 NOCD（OCD 专属 ERP 治疗）和 Charlie Health（青少年/年轻成人强化门诊）的照护协调合作，把超出 Talkiatry
              自身范围的患者需求接续到更长照护路径，同时不制造收入分成冲突。
