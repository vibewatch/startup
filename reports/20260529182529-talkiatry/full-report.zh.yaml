  - id: TV004
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 熊
        - 收入接近 ~$95M，增长放缓；相对上市服务可比公司没有溢价
        - ~$95M 收入按 ~3x-5x → ~$285M-$475M
        - DEA 处方规则回撤 / DOJ 执法、付款方集中、毛利受压
        - 如果增长放缓或监管冲击落地，就可能发生
      - - 基准
        - 相对 LifeStance ~2x 有增长溢价；当前收入 ~$110M-$130M
        - ~$110M-$130M 收入按 ~6x-10x → ~$700M-$1.3B
        - 留存、毛利质量和股权结构表未知
        - 最符合公开数据和私营同行标记的区间
      - - 牛
        - 收入显著高于估算，利润率强，且价值医疗牵引跑通
        - ~$130M-$150M 收入按 ~10x-14x → ~$1.3B-$2.1B
        - 需要确认 NRR、毛利和基于价值的收入
        - 可能成立，但依赖尚未披露的私有事实
    notes: 情景区间为估算，锚定可信度较低的第三方收入数字；它们是决策辅助，不替代管理层数据。
