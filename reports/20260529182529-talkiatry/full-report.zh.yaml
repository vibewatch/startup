  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 为什么一家经营表现扎实的公司，在推断的独角兽级价格下仍只能给出审慎建议。
    data:
      nodes:
        - id: scale
          label: 运营规模与验证
          description: 800+ 名精神科医生、3M 次就诊、100+ 个支付方 / 170M 覆盖人群、疗效已验证
        - id: growth
          label: 增长画像
          description: 管理层称 2021-2024 年收入增长 1,745%；Series D 轮获超额认购
        - id: anchor
          label: 估值锚点
          description: $210M Series D 轮，累计融资 >$400M；估值未披露，行业推断约 $1.4B
        - id: comps
          label: 可比估值差距
          description: 上市服务类可比公司约 0.6x-3.3x EV/sales；以约 $95M 收入按约 2x 乘数计算，只推导出约 $190M
        - id: opacity
          label: 披露与监管缺口
          description: ARR、毛利率、NRR、烧钱速度、支付方结构均未披露；存在开方监管敞口
        - id: decision
          label: 决策
          description: 在拿到未公开财务数据或价格降低前，保持观察 / 继续研究
      edges:
        - source: scale
          target: anchor
        - source: growth
          target: anchor
        - source: anchor
          target: comps
        - source: comps
          target: decision
        - source: opacity
          target: decision
        - source: growth
          target: decision
    approximationNotes: 这是推荐逻辑链，不是数学模型。
    claimRefs:
      - CV007
      - CV005
      - CV004
      - CV037
      - CV038
      - CV042
