      basis: >-
        Rows cover the highest-signal publicly dated milestones from retained press releases, news sources, and legal
        filings through May 2026; internal corporate events, angel or bridge financing, and advisory appointments are
        excluded.
  - id: TM001
    title: 市场定义表：网内远程精神科边界
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 支付方
      - 对 Talkiatry 的意义
    rows:
      - - 网内门诊远程精神科
        - 通过远程医疗提供精神科评估、药物管理、复诊；由商业保险、Medicare 和 Medicaid 覆盖
        - 现金自费、网外、无保险就诊；无 MD 监督的独立咨询
        - 商业保险公司（主要支付方）、Medicare、Medicaid；患者共付次级
        - 核心市场：Talkiatry 的完整商业模式；约 170M 网内覆盖人群
      - - 门诊行为健康 / 治疗
        - 治疗师主导的心理治疗、咨询和团体治疗，由保险覆盖
        - 精神科药物管理（无 MD 参与）；仅 EAP 咨询
        - 商业保险公司、Medicare、Medicaid；部分为雇主赞助 EAP
        - 邻近市场：Talkiatry 在部分市场雇用治疗师，并与 BetterHelp 合作
      - - 住院 / 寄宿式精神科护理
        - 急性精神科住院、日间住院、强化门诊项目
        - 门诊和远程医疗服务；社区心理健康
        - 商业保险公司、Medicare、Medicaid；医疗系统运营方
        - 不属核心：Talkiatry 不运营住院病区；可能接收转诊
      - - 物质使用障碍治疗
        - 戒断排毒、药物辅助治疗（MAT；丁丙诺啡、美沙酮）、SUD 咨询、OTP
        - 不以 SUD 为重点的精神科评估；与成瘾无关的行为健康服务
        - 商业保险公司、Medicaid（主导支付方）、雇主
        - 部分邻近：DEA 延期允许远程医疗开具丁丙诺啡；不是 Talkiatry 的主服务
      - - 雇主赞助行为健康（EAP）
        - EAP 咨询场次、心理健康导航、数字工具、通过雇主合同提供的精神科服务
        - EAP 架构外按保险结算的精神科就诊
        - 雇主（直接向 EAP 供应商付款）；员工使用服务
        - 扩张渠道：BetterHelp–Talkiatry 雇主合作把员工导入网内精神科护理
      - - 数字心理健康 / 健康应用
        - 面向消费者的心理健康应用（Calm、Talkspace、BetterHelp）、情绪追踪、自助式 CBT
        - 临床级精神科护理；可由保险报销的就诊
        - 消费者（直接付费或雇主补贴）
        - 低严重度时是替代品；高严重度时是转诊来源
    notes: >
      市场边界依据 TBRC、Grand View Research 和 Houlihan Lokey 的来源定义近似；Talkiatry 特定边界由公司公开服务描述和第 1 章前文推断。支付方类别反映 2025–2026
      年报销规则。
