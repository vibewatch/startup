callouts:
  - calloutType: risk
    title: "DEA telehealth prescribing cliff is an existential product risk"
    body: >
      Talkiatry's core value proposition — prescribing-capable psychiatry without an in-person
      visit — depends entirely on DEA telemedicine flexibilities that expire December 31, 2026.
      The fourth extension is now in effect, but the DEA has not finalized permanent regulations.
      If the Ryan Haight Act's in-person mandate reinstates at year-end, Talkiatry cannot initiate
      controlled substance prescriptions for any patient without a prior in-person visit. Given
      the prevalence of ADHD (stimulants) and anxiety (benzodiazepines) in Talkiatry's case mix,
      this regulatory discontinuity would materially impair the clinical model and patient access.
    claimRefs:
      - CE040
      - CE041

  - calloutType: risk
    title: "Consumer platform experience is materially below expectations for a premium product"
    body: >
      Talkiatry's patient-facing technology scores poorly: the native mobile app is in beta
      (2.9/5, 17 ratings), Trustpilot shows 2.7/5 across 566 reviews with recurring billing,
      communication, and scheduling complaints, and employee reviews cite platform reliability
      as a chronic operational problem. At a $210M Series D capitalization, this is a
      solvable problem, but the gap between clinical outcome quality and consumer experience
      quality is a meaningful churn and reputation risk.
    claimRefs:
      - CE046
      - CE047
      - CE048

  - calloutType: strength
    title: "Talkiatry Connect solves a genuine health system pain point with a low-friction product"
    body: >
      The zero-cost, one-day-deploy, no-contract referral overlay for 30+ cloud EMRs addresses
      a documented healthcare friction (psychiatric referral abandonment from portal-hopping)
      with a product that aligns financial incentives: health systems gain referral visibility,
      Talkiatry gains patient volume. The HCA and AMGA partnerships validate the model with
      marquee customers. Epic incompatibility limits the total addressable market but does not
      block the current growth vector.
    claimRefs:
      - CE024
      - CE025
      - CE026
      - CE027
      - CE028
      - CE029
      - CE030
      - CE031

  - calloutType: insight
    title: "Talkiatry is a clinical-operations company with technology as an enabler, not a core moat"
    body: >
      Unlike pure-software telemedicine platforms, Talkiatry's defensibility rests on the
      scale and quality of its employed physician workforce, payer contracting depth, and
      outcomes data — not on proprietary software. The tech stack includes third-party
      video/portal (healow), a Chromium browser overlay (Talkiatry Connect), and analytics
      tooling. AI claims are real but not technically differentiated at the level of a
      technology company. This matters for margin: clinical-operations businesses carry higher
      fixed costs and lower software margins than pure-platform models.
    claimRefs:
      - CE032
      - CE033
      - CE034
      - CE035
      - CE036
      - CE037

