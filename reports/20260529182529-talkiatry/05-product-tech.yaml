  - id: talkiatry-connect-integration
    title: Talkiatry Connect — provider-facing integration product
    body: >
      Talkiatry Connect, launched in April 2026, is a browser-based overlay (Chromium-native)
      that lives inside a provider's existing cloud-based EMR. It integrates with 30+ cloud
      EMRs — named examples include Athenahealth, eClinicalWorks, and Practice Fusion — but
      Epic is explicitly excluded. A small icon alerts the provider when a patient may need
      psychiatric care; a one-click side panel auto-populates a referral using data already in
      the chart, routes the patient to Talkiatry's network, and returns visit summaries and
      clinical notes to the referring provider with patient consent.

      The deployment model is zero-cost to health systems, requiring no IT build and no
      contract. Setup for an organization takes one business day; individual providers activate
      in approximately five minutes. After referral submission, Talkiatry contacts the patient
      within 24 hours, confirms insurance eligibility, and schedules a first visit. The panel
      shows real-time referral status updates throughout the patient journey.

      The HCA Healthcare integration — Talkiatry's first publicly announced large health system
      partnership — became the prototype for Talkiatry Connect. HCA's network spans 186
      hospitals and ~2,400 ambulatory sites. The integration resolves what Talkiatry calls
      "portal hopping," the manual re-entry of patient data into a separate referral portal that
      caused thousands of psychiatric referrals to be abandoned. The integration is live across
      the vast majority of HCA's technology systems, with a division-by-division education
      rollout. Early adoption outside HCA includes New York Cancer & Blood Specialists, where
      oncologists use it to coordinate psychiatric support for cancer patients.

      The April 2026 AMGA partnership extends this referral infrastructure to AMGA's 175,000+
      physician members, who collectively serve one in three Americans. The partnership
      specifically leverages Talkiatry's AI-powered measurement-based care technology for care
      coordination. The Mindshare Partner Program, through which Talkiatry formalizes health
      system relationships, already includes 35% of the top 20 U.S. health systems and 50+
      total systems as of the April 2026 announcement.
