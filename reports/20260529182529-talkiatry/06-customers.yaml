    - label: "Stage 6 — Churn or access discontinuation"
      description: "Patients whose insurance changes or whose plan exits Talkiatry's network lose access. No self-pay bridge option exists. Trustpilot reviews cite billing surprise and network confusion as a significant discontinuity trigger."

