- id: TU004
  title: Retention, satisfaction, and outcomes table
  columns:
  - Metric
  - Value / null
  - Segment
  - Confidence
  - Diligence ask
  rows:
  - - Early dropout rate (peer-reviewed)
    - "13.2%"
    - National telepsychiatry patient cohort (~800 adults)
    - Medium-high (peer-reviewed, The Archives of Psychiatry, Dec 2025)
    - Confirm definition of "early dropout" and whether the measured cohort is representative of current patient mix
  - - Industry benchmark early dropout rate
    - "20-30%"
    - Traditional and virtual mental health settings
    - Medium (cited in study context)
    - Independent verification of benchmark range across comparable telehealth settings
  - - Anxiety symptom improvement (JMIR 2023)
    - "67% no longer clinically significant after ~5 visits"
    - "1,826 treatment-seeking patients with GAD-7/PHQ-8 baseline assessments"
    - Medium (peer-reviewed JMIR retrospective; company-affiliated researchers)
    - Independent replication of outcomes study; disclosure of selection criteria
  - - Depression symptom improvement (JMIR 2023)
    - "62% no longer clinically significant after ~5 visits"
    - Same 1,826-patient cohort
    - Medium (same study)
    - Same replication ask; clinical remission vs. symptom reduction distinction
  - - Patient recommendation rate (HelpGuide survey)
    - "90% would recommend to a friend or colleague"
    - 100 surveyed HelpGuide users
    - Medium (third-party survey; small n)
    - Larger independent survey with validated satisfaction instrument
  - - Medication clarity score (HelpGuide)
    - "93/100"
    - 100 HelpGuide-surveyed patients
    - Low-medium (small n; non-validated scale)
    - Validated MSPSS or similar scale across broader patient population
  - - Net revenue retention (NRR)
    - null
    - All segments
    - Low (not disclosed)
    - Request NRR by patient cohort year-over-year; distinguish active patient stickiness from new-patient growth
  - - Logo churn / patient churn
    - null
    - All segments
    - Low (not disclosed)
    - Request annual patient attrition rate, cohort-by-cohort retention curves
  - - Trustpilot rating
    - "2.7/5 (Poor) — 566 reviews"
    - Broad consumer patient base
    - Medium (Trustpilot archive, Nov 2025)
    - Monitor for changes as billing practices evolve post-TINA complaint; separate clinical satisfaction from admin satisfaction
  - - Great Place to Work clinician rating
    - "84% of employees say great place to work"
    - 1,253 US-based employees (Great Place to Work 2025 certification)
    - Medium (employer-sponsored survey; selection bias risk)
    - Third-party validated employee net promoter score; turnover rate and tenure distribution
  notes: >
    NRR, GRR, and patient cohort retention metrics are not publicly disclosed. Outcome data (JMIR 2023) is from a
    retrospective of de-identified patient records by Talkiatry-affiliated researchers; results are peer-reviewed but
    not independently reproduced. Trustpilot rating is from a November 2025 archived snapshot (566 reviews); current
    rating may differ. Great Place to Work certification uses employee survey data sourced by the company.
