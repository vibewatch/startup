- id: TU003
  title: Named customer proof table
  columns:
  - Customer / partner
  - Segment
  - Deployment / use case
  - Production vs. pilot
  - Outcome / evidence
  - Limitation
  enumerationScope:
    coverage: partial
    basis: >
      Rows cover named health system and referral partners with verified press releases, fetched news coverage, or
      company case studies reviewed during this May 2026 research run. This table does not enumerate the full Mindshare
      partner list or all employer clients, which are not publicly named. Rows favor partners with documented referral
      workflow detail or quantified patient outcomes over logo-only mentions.
  rows:
  - - HCA Healthcare
    - Major for-profit health system (186 hospitals; ~2,400 ambulatory sites)
    - EHR-integrated in-visit referrals from primary care and urgent care providers to Talkiatry psychiatrists
    - Production — live across "vast majority" of HCA systems as of public announcement
    - First-appointment within ~5 days after EHR trigger; coordinated care loop returns diagnosis and medication info to referring clinician
    - No patient volume or conversion rate from HCA referrals disclosed; division-by-division rollout timing not finalized
  - - NYU Langone Health Ambulatory Care
    - Academic health system ambulatory network
    - Launch partner in Talkiatry Mindshare program enabling outpatient psychiatric referrals
    - Production (Mindshare launch partner, Nov 2023)
    - Named at program launch; no public patient-volume or outcome data released
    - No case study depth; logo-level partnership announcement only
  - - New York Cancer & Blood Specialists (NYCBS)
    - Oncology practice (30+ locations; 35+ hospital affiliations in NY metro)
    - Talkiatry Connect integration for psychiatric referrals within oncology workflows; addresses 40%+ of cancer patients reporting worsening mental health
    - Production launch announced April 2026
    - Referral workflow integrated via EMR overlay; NYCBS CEO quoted on whole-person care commitment; no patient outcomes disclosed
    - Early-stage deployment; no outcome data available at time of analysis
  - - BetterHelp Business (employer channel)
    - Digital therapy platform with 1,000+ employer/payer partnerships
    - Exclusive employer-channel referral and psychiatry access partnership; employees access Talkiatry via BetterHelp Business portal
    - Production — exclusive partnership announced September 2024
    - BetterHelp business clients gain in-network psychiatry as a premium employee benefit; BetterHelp therapists can refer directly to Talkiatry psychiatrists
    - No employer-level patient volume or outcomes data shared; channel performance not disclosed
  - - Charlie Health
    - Virtual intensive outpatient program (IOP) provider for teens and young adults (ages 11-33, 27 states)
    - "Step-up/step-down referral partnership: Talkiatry refers higher-acuity youth to Charlie Health IOP; Charlie Health refers step-down patients to Talkiatry ongoing outpatient care"
    - Production — partnership announced December 2023
    - Coordinated case management and discharge planning; outcomes tracked jointly; Talkiatry child/adolescent services available in 31 states
    - No disclosed volume of cross-referred patients; no published joint outcome data
  - - AMGA member organizations
    - National association of multispecialty medical groups (175,000+ physicians; serve 1 in 3 Americans)
    - Strategic partnership enabling AMGA member organizations to connect patients with Talkiatry psychiatrists in-network
    - Production — partnership announced April 2026 (AMGA Annual Conference)
    - AMGA CEO quoted; member organizations gain access to 800+ psychiatrists via in-network model; AMGA touts measurement-based care outcomes (87% anxiety and 86% depression improvement after 2 visits)
    - AMGA member uptake volume not disclosed; individual member organization deployments not named
  notes: >
    All rows are based on official press releases or fetched news articles reviewed during this run. Rows reflect
    confirmed partnership announcements; referral patient volume and clinical outcomes for the partner-sourced patients
    are not publicly disclosed for any row. The enumeration covers only publicly named partners with verifiable
    documentation. The full list of 50+ Mindshare hospital partners is not public.
