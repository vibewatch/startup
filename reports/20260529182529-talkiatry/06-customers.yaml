company:
  name: Talkiatry
chapter:
  number: 6
  title: Customers
  summary: >
    Talkiatry's customer base spans three distinct tiers: commercially insured and Medicare patients as direct end-users, health systems and referral partners (including HCA Healthcare, 50+ hospital systems, and AMGA members) who route patients via EHR-integrated workflows, and employers accessing the service through the BetterHelp Business channel. Patient adoption is substantiated by 3 million cumulative visits and a peer-reviewed 13.2% early-dropout rate well below the 20-30% industry benchmark, while clinical outcomes data from a 2023 JMIR study confirm 67% and 62% of anxiety and depression patients, respectively, achieved non-clinically-significant symptom levels after ~5 visits. Adverse signals are material: Trustpilot rates Talkiatry 2.7/5 (Poor) from 566 reviews dominated by billing and insurance complaints, TINA flagged misleading "$30 or less" cost advertising, and the insurance-only access model creates structural friction for Medicaid patients and those whose coverage changes mid-treatment. Clinician satisfaction is mixed, with Great Place to Work surveys citing 84% positive responses but Glassdoor/Indeed reviews citing productivity-metric pressure and lower-than-expected compensation.

sections:
- id: patient-segments-and-access
  title: Patient segments and access pathways
  body: >
    Talkiatry's primary end-user is the commercially insured or Medicare-covered patient seeking outpatient psychiatric evaluation and medication management via telehealth. As of May 2026, the platform operates in 45 states (excluding Alaska, Delaware, Hawaii, North Dakota, and Wyoming), making it broadly but not universally accessible. Talkiatry explicitly does not accept Medicaid — its own help documentation states this outright — which structurally excludes Medicaid beneficiaries, a significant low-income and disability segment, from the service. For eligible patients, access occurs through four primary pathways: direct self-service sign-up via talkiatry.com or Zocdoc (where patients search insurance, condition, and provider availability in real time), EHR-generated referrals from health system partners including HCA Healthcare and AMGA member organizations, employer-benefit access via BetterHelp Business, or clinician-to-clinician referrals through the Talkiatry Mindshare program. The HelpGuide user survey of 100 patients found 73% completed intake in 20 minutes or less, and 90% said they would recommend Talkiatry to a friend, indicating low onboarding friction for covered patients. However, 19% waited at least a week for their first appointment, and TINA reported that patients who enrolled based on advertised "$30 or less" costs sometimes received bills exceeding $550 after two visits when their insurance was not in-network as expected. Talkiatry treats adults and pediatric patients (child and adolescent services in 31 states) across conditions including anxiety, depression, ADHD, bipolar disorder, OCD, PTSD, and postpartum depression, but explicitly excludes conditions requiring in-person treatment such as schizophrenia managed with injectable antipsychotics. The insurance-only model means patients whose coverage lapses or changes mid-treatment lose access even if they want to continue care with the same psychiatrist.
