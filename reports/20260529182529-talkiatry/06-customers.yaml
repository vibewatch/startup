  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: "Talkiatry's NRR, gross revenue retention, patient cohort churn curves, and annual logo attrition by payer segment or visit frequency."
    whyItMatters: "Without patient retention metrics, it is impossible to distinguish a growing platform with high repeat engagement from one masking churn via new patient acquisition, which significantly affects valuation."
    diligencePath: "Request management data room disclosure of patient retention by cohort year, visit frequency distributions, and NRR or equivalent metric."
    relatedQuestionRefs:
    - QU033

  - type: private-evidence-only
    severity: material
    topic: health-system-partners
    missingEvidence: "Referral-to-visit conversion rates and patient visit volume attributable to Mindshare health system partners, disaggregated by partner."
    whyItMatters: "Whether HCA and AMGA partners are generating meaningful patient volume determines whether the Mindshare channel is a real revenue driver or primarily a marketing signal."
    diligencePath: "Request per-partner referral volume, visit conversion rates, and quarterly trend data for the top 5 Mindshare partners."
    relatedQuestionRefs:
    - QU002
    relatedTableRefs:
    - TU003

  - type: private-evidence-only
