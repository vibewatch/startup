- id: employer-payer-channel
  title: Employer and payer channel
  body: >
    Talkiatry does not have its own standalone B2B employer product as of mid-2026; instead, it accesses the employer channel exclusively through the BetterHelp partnership. In September 2024, Talkiatry and BetterHelp announced an exclusive arrangement in which Talkiatry's telepsychiatry and medication management services became available to members of BetterHelp Business — BetterHelp's enterprise offering covering 1,000+ employer, payer, university, and EAP partnerships that collectively cover millions of covered lives. BetterHelp Business clients that elect the add-on give their employees access to Talkiatry psychiatrists in-network at no additional out-of-pocket cost. Employees can self-select into psychiatric care or receive a referral directly from their BetterHelp therapist, creating a therapy-to-psychiatry hand-off within a single benefit platform. Talkiatry CEO Robert Krayn described the partnership as addressing a gap where employers wanting high-quality in-network psychiatry "really have nowhere else to go," and noted that the channel helps maintain patient volume and keeps Talkiatry top-of-mind for employer and payer buyers. On the payer side, Talkiatry is in-network with more than 100 commercial insurance plans, covering more than 170 million lives nationwide as of February 2026. Major payers include Aetna, Blue Cross Blue Shield, United Healthcare, Cigna, and Humana. The AMGA partnership further extends the payer value proposition by enabling measurement-based care demonstrations: Talkiatry reports 87% of anxiety patients and 86% of depression patients see symptom reduction after just two visits, and the company has characterized payer savings at up to $700 per member per month compared to traditional models. No independent audited payer-value or employer-outcome data have been publicly released to confirm these figures.
