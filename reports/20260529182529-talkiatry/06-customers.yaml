callouts:
- calloutType: strength
  title: 13.2% early-dropout rate substantiates retention advantage
  body: >
    A December 2025 peer-reviewed study in The Archives of Psychiatry found Talkiatry's early-dropout rate was 13.2%,
    well below the 20-30% benchmarks for traditional and virtual mental health settings. The study's finding that
    therapeutic alliance is a stronger predictor of retention than illness severity — and that affordability (copays ≤ $40)
    significantly reduces dropout — aligns directly with Talkiatry's in-network model as a structural differentiator.
    This is the strongest independent evidence of patient retention quality available in public sources.
  claimRefs:
  - CU032
  - CU033
  - CU034

- calloutType: risk
  title: Billing surprise and insurance confusion are persistent adverse signals
  body: >
    Talkiatry's 2.7/5 Trustpilot rating (566 reviews) and TINA's documented advertising complaint about the "$30 or less"
    cost claim reflect a systematic gap between patient cost expectations and actual billing outcomes. Patients who believed
    their insurance was accepted have reported out-of-pocket bills of $334 to $550+. Talkiatry removed the "$30 or less"
    advertising following TINA's investigation (December 2024). For a platform whose patient value proposition depends on
    "affordable in-network" care, recurring billing surprise is a material retention and reputation risk.
  claimRefs:
  - CU040
  - CU041
  - CU042

- calloutType: risk
  title: Insurance-only model creates structural access and churn risk
  body: >
    Talkiatry's refusal to accept self-pay or Medicaid patients creates two structural risks: first, patients mid-treatment
    whose insurance changes must exit the platform, disrupting active psychiatric care; second, Medicaid's ~90 million
    beneficiaries are entirely excluded, ceding a large patient segment to Medicaid-accepting competitors such as
    Charlie Health (for youth) and Brightside Health. As MHPAEA parity enforcement strengthens, Medicaid managed care
    organizations are expanding behavioral health network requirements — if Talkiatry does not eventually add Medicaid
    contracting, it may be locked out of a growing portion of the behavioral health market.
  claimRefs:
  - CU002
  - CU003
  - CU043
  - CU044

- calloutType: insight
  title: AMGA and Mindshare together reach 1 in 3 Americans via clinician networks
  body: >
    The combination of the Mindshare program (50+ health systems, 35% of top-20) and the April 2026 AMGA partnership
    (175,000+ physicians, serving 1 in 3 Americans) positions Talkiatry as the de facto psychiatry partner-of-record
    for the nation's largest organized physician networks. If even a small fraction of AMGA members activate Mindshare
    referrals, the patient funnel could be significant. The key diligence gap is whether health system partners are
    actively referring (and at what conversion rate) versus simply having signed partnership agreements.
  claimRefs:
  - CU020
  - CU021
  - CU022

