- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Driver / risk factor
  - Concentration or expansion signal
  - Potential impact
  - Diligence path
  rows:
  - - Insurance-only model dependency
    - All revenue requires in-network payer contracts; Medicaid and self-pay excluded
    - Structural revenue ceiling and access limitation; insurer rate cuts or network terminations could rapidly reduce revenue and patient access
    - Request payer mix by commercial plan; assess dependency on top-5 insurers; review any Aetna/UHC network amendment clauses
  - - BetterHelp employer channel exclusivity
    - Exclusive arrangement with BetterHelp for employer channel; no Talkiatry B2B product
    - Talkiatry's employer revenue is fully dependent on BetterHelp's enterprise sales trajectory; BetterHelp's parent Teladoc has declining BetterHelp performance
    - Assess contractual exclusivity terms; request activation rate from BetterHelp Business portfolio
  - - Health system referral concentration (Mindshare)
    - "50+ hospital partners; HCA is named anchor; 35% of top-20 health systems"
    - HCA represents disproportionate potential referral volume; losing HCA could materially affect pipeline
    - Request Mindshare referral volume by partner; identify if HCA accounts for >20% of referred patients
  - - Medicaid exclusion growth risk
    - Competitors (Charlie Health, Brightside) accept Medicaid; Talkiatry does not
    - As Medicaid managed care expands behavioral health benefits, Talkiatry cedes a large segment to competitors
    - Monitor if Talkiatry adds Medicaid contracting; request Medicaid optionality in strategic roadmap
  - - Geographic coverage gaps
    - "Absent from 5 states (AK, DE, HI, ND, WY); pediatric services in 31 of 45 states"
    - Limits total addressable patient base and restricts some health system partners from full referral capability
    - Monitor state licensing filings; track whether pediatric service expansion closes the 14-state gap
  notes: >
    BetterHelp's strategic challenges are based on public Teladoc Health earnings reports and Behavioral Health Business
    reporting (Oct 2025). HCA referral volume concentration is inferred from the partnership's prominence in public filings
    and announcements; actual volume data is not public. Insurance dependency analysis is based on company-disclosed
    payer network breadth, not financial concentration by insurer.
