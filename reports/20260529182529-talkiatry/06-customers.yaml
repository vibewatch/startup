      - No public employer-channel outcomes published
      - BetterHelp Business portal; therapist-to-psychiatrist referral
      - Low-medium — joint press release only; no channel KPIs
    - label: NYCBS oncology (Talkiatry Connect)
      values:
      - Early production (announced Apr 2026; 30+ NYCBS locations)
      - No patient outcomes data yet; deployment just announced
      - EMR overlay (Talkiatry Connect); cloud-based referral workflow
      - Low — launch announcement only; no outcomes
    - label: AMGA member organizations
      values:
      - Active (partnership announced Apr 2026)
      - "Company-reported: 87% anxiety / 86% depression symptom reduction after 2 visits"
      - Member organization EHR referral framework
      - Low — strategic partnership announcement; individual member uptake unknown

