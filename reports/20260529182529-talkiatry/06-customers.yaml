tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale indicator
  - Revenue / strategic value
  - Key gap
  rows:
  - - Commercially insured patients (direct)
    - Patient (user), commercial insurer (payer)
    - Outpatient psychiatry, medication management, therapy add-on for covered conditions
    - "170M+ covered lives via 100+ plans; 3M+ visits delivered"
    - Primary revenue driver; per-visit billing via insurance
    - No NRR or repeat-visit frequency data published; patient churn undisclosed
  - - Medicare patients (direct)
    - Patient (user), Medicare (payer)
    - Same outpatient psychiatry and medication management; telehealth permitted under permanent Medicare BH rules
    - "Medicare covers 65M+ lives; Talkiatry accepts Medicare including Medicare Advantage"
    - Growing segment; Medicare telehealth permanently authorized with no geographic limits for behavioral health
    - Medicare reimbursement rates typically lower than commercial; margin contribution undisclosed
  - - Medicaid patients (excluded)
    - Excluded — Talkiatry does not accept Medicaid
    - N/A — structural exclusion
    - "Medicaid covers ~90M Americans; entirely excluded from Talkiatry"
    - Represents a material access gap and revenue ceiling
    - Talkiatry's policy is stated but unaddressed; competitive risk from Medicaid-accepting peers
  - - Health system and physician group partners (Mindshare)
    - Health system (channel customer), patient (end-user), commercial insurer (payer)
    - EHR-integrated patient referrals; access to psychiatry for ambulatory/outpatient populations with no admin cost to the partner
    - "50+ hospital system partners; 35% of top-20 US health systems; AMGA members serving 1 in 3 Americans"
    - No direct revenue from health system partner; value via patient volume and brand
    - No disclosed referral-to-visit conversion rate or Mindshare patient volume
  - - Employer-benefit users (via BetterHelp)
    - Employer (channel customer), employee (end-user), commercial insurer (payer)
    - In-network psychiatry and medication management as add-on to BetterHelp Business benefits package
    - "BetterHelp Business has 1,000+ employer/payer partnerships covering millions of covered lives"
    - Indirect revenue via insurer billing when employees use services; employer pays BetterHelp separately
    - Exclusive to BetterHelp channel; Talkiatry has no own B2B employer product
  - - Specialty-medicine practice partners (Talkiatry Connect)
    - Specialty practice (channel customer), patient (end-user), commercial insurer (payer)
    - Integrated psychiatric referrals in oncology, and potentially other specialty settings using Talkiatry Connect technology
    - "NYCBS partnership (30+ oncology locations); AMGA member specialty groups"
    - Strategic differentiation; revenue via clinical services to specialty-referred patients
    - Early-stage channel; no outcomes data for specialty-referred patients published
  notes: >
    Segment scale indicators are sourced from company press releases and the Talkiatry partnerships page (May 2026).
    Medicaid exclusion is confirmed by Talkiatry's own help center documentation. Revenue contribution by segment is not
    publicly disclosed. BetterHelp Business scale is from the September 2024 partnership press release; actual Talkiatry
    patient volume from the BetterHelp channel has not been disclosed.
