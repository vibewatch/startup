- id: health-system-referral-partners
  title: Health system and referral-partner customers
  body: >
    Talkiatry's Mindshare Partner Program, launched in November 2023, is the company's primary mechanism for acquiring health-system and physician-group customers. The program allows hospital systems, ambulatory care groups, and accountable care organizations to refer patients directly into Talkiatry's network via their existing EMR workflows, with Talkiatry handling intake, insurance verification, outreach, and scheduling — typically within five business days. The program is free for partner organizations to join. At launch, founding partners included NYU Langone Health Ambulatory Care, NOCD (OCD-specialty care), and Transact Campus. By early 2026, Talkiatry's own partnerships page claimed that 35% of the top U.S. health systems partner with them, and the company said Mindshare now covers 50+ hospital systems overall. HCA Healthcare was the first large health system partner to integrate at the EHR level; HCA primary care and urgent care providers can trigger Talkiatry referrals from within their charts, and Talkiatry provides coordinated care documentation (diagnoses, medications) back to the referring clinician with patient consent. In April 2026, Talkiatry announced a partnership with New York Cancer & Blood Specialists (NYCBS) to embed psychiatric care into 30+ oncology locations using Talkiatry Connect, a care-coordination platform that overlays cloud-based EMRs for specialty practices. In the same month, AMGA (American Medical Group Association) announced a strategic partnership enabling AMGA member organizations — which serve one in three Americans and include 175,000+ physicians — to connect patients with Talkiatry's network of 800+ employed psychiatrists in-network with 100+ insurance plans. For referring providers, the business case is zero administrative cost and near-zero wait times for behavioral health, avoiding the 6+ week national average wait for new psychiatric appointments. Talkiatry also partners with Charlie Health for step-up/step-down youth care: patients aged 11-33 in need of intensive outpatient services are referred to Charlie Health's virtual IOP, while Charlie Health patients stepping down are referred back to Talkiatry for ongoing psychiatric care.
