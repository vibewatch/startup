summary:
  headline: >
    Talkiatry is the category-leading in-network telepsychiatry provider group with 800+ employed psychiatrists, broad
    payer coverage, and validated outcomes, but a labor-intensive W-2 model, fully undisclosed unit economics,
    prescribing-regulatory exposure, and an unconfirmed ~$1.4B inferred mark make it a track / research-more rather than
    an underwrite-now opportunity.
