  topStrengths:
    - >-
      Category leadership in in-network telepsychiatry: 800+ directly employed W-2 board-certified psychiatrists
      (largest private psychiatrist employer in the U.S.), full-stack payer contracting across 100+ plans covering 170M+
      lives, and 3M+ patient visits delivered.
    - >-
      Validated clinical outcomes and value-based optionality: peer-reviewed JMIR data showing 67% (anxiety) and 62%
      (depression) of patients reaching non-clinically-significant symptom levels after ~5 visits, dropout rates well
      below industry benchmarks, and up to $700 PMPM cost reduction for a national health plan.
    - >-
      Strong secular tailwinds and investor conviction: a structural psychiatrist shortage (137M Americans in shortage
      areas; ~43,660 deficit projected by 2038), permanent Medicare behavioral-telehealth expansion, parity-law
      enforcement, and an oversubscribed $210M Series D led by Perceptive Advisors with a16z and Left Lane returning.
  topRisks:
    - >-
      Regulatory/prescribing fragility: dependence on DEA telemedicine controlled-substance flexibilities that expire
      December 31, 2026 with no finalized permanent rules, against a sector backdrop of Cerebral DOJ/FTC enforcement and
      Done Global criminal arrests.
    - >-
      Live privacy litigation and reputational drag: a Meta Pixel patient-data class action that survived a motion to
      dismiss in October 2025, TINA.org scrutiny of '$30 or less' advertising, and 2.7/5 consumer ratings (200+ BBB
      complaints in three years) concentrated on billing opacity.
    - >-
      Financial opacity and capital intensity: a W-2 employment cost structure paired with $400M+ raised but undisclosed
      burn, runway, gross margin, NRR, ARR, payer concentration, and equity-vs-debt Series D split, leaving the inferred
      ~$1.4B mark unvalidatable on public data.
  unresolvedGaps:
    - >-
      Current ARR, a revenue bridge, gross margin, net revenue retention, and cohort economics—the key inputs to
      validate any multiple against public comps (Amwell ~0.6x, LifeStance ~2.1x, Talkspace ~3.3x EV/sales).
    - >-
      Confirmed Series D post-money valuation and the equity-versus-debt split of the $210M headline, plus the
      preferred-stock and liquidation-preference stack.
    - Cash burn, runway, and payer mix / concentration under the labor-intensive psychiatrist-employment model.
    - >-
      Whether DEA permanent telemedicine prescribing rules will preserve current controlled-substance flexibility after
      December 31, 2026.
