companyProfile:
  summary: >
    Talkiatry is a New York City-based telepsychiatry company co-founded in 2019 by Robert Krayn (CEO)
    and Dr. Georgia Gaveras, DO (CMO), that delivered its first patient visit in April 2020 after
    pivoting to a fully virtual model during COVID-19. It operates as a "full-stack provider group,"
    directly employing more than 800 full-time W-2 psychiatrists—making it the largest private employer
    of psychiatrists in the United States—and is in-network with more than 100 insurance plans covering
    170 million-plus lives across 45 states. Talkiatry has delivered over 3 million patient visits as of
    February 2026 and pairs psychiatrist-led medication management with measurement-based care and a
    proprietary AI-powered care platform. The company has raised over $400 million in total, most recently
    a $210 million oversubscribed Series D in February 2026 led by Perceptive Advisors, with a Banc of
    California debt facility. Talkiatry declined to disclose its valuation; a ~$1.4 billion unicorn mark
    has circulated but is industry-inferred, not company-confirmed.
  foundedDate: "2019-01-01"
  founders:
    - name: "Robert Krayn"
      role: "Co-Founder & CEO"
      background: "Co-founded Talkiatry in 2019 and leads it as Chief Executive Officer."
      claimRefs: [CO002, CO005]
    - name: "Dr. Georgia Gaveras, DO"
      role: "Co-Founder & CMO"
      background: "Triple board-certified in adult psychiatry, child and adolescent psychiatry, and addiction medicine; serves as Chief Medical Officer."
      claimRefs: [CO002, CO006]
  foundingLocation: "New York City, NY"
  headquarters: "New York City, NY (virtual telehealth practice)"
  productSummary: >
    Insurance-covered, in-network outpatient telepsychiatry centered on psychiatrist-led medication
    management for conditions including anxiety, depression, ADHD, bipolar disorder, OCD, PTSD, and
    postpartum depression. Care is delivered through a consumer-facing portal and a provider-facing
    integration layer (Talkiatry Connect / Mindshare) that embeds psychiatric referrals into 30+
    cloud-based EMRs and health-system referral workflows. The platform layers validated
    measurement-based care (GAD-7/PHQ) and AI-powered care coordination on top of a directly employed
    W-2 psychiatrist workforce and broad payer contracting.
  customerFocus: "Commercially insured and Medicare-covered patients seeking outpatient psychiatric care; health systems and referral partners (HCA Healthcare, 50+ systems, AMGA members); and employers via the BetterHelp Business channel. Medicaid is not accepted."
  businessModel: "In-network insurance fee-for-service reimbursement for psychiatric visits, with an emerging layer of value-based / shared-savings contracts; revenue is earned by directly employed W-2 psychiatrists rather than 1099 marketplace contractors."
  stage: "late-stage venture (Series D)"
  fundingStatus: "Series D (Feb 2026, $210M oversubscribed, led by Perceptive Advisors with Sofina, a16z, blisce/, Left Lane Capital, and a Banc of California debt facility); total raised over $400M. Valuation undisclosed; ~$1.4B is an industry-inferred, unconfirmed unicorn mark."
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO005, CO006, CO007, CO008, CO009, CO010, CO014, CO025, CO026, CO028, CV004]
summary:
  headline: >
    Talkiatry is the category-leading in-network telepsychiatry provider group with 800+ employed
    psychiatrists, broad payer coverage, and validated outcomes, but a labor-intensive W-2 model,
    fully undisclosed unit economics, prescribing-regulatory exposure, and an unconfirmed ~$1.4B
    inferred mark make it a track / research-more rather than an underwrite-now opportunity.
