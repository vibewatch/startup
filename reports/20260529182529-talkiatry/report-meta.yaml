coverageNotes: >
  Public evidence supports Talkiatry's 2019 founding by Robert Krayn (CEO) and Dr. Georgia Gaveras
  (CMO), its April 2020 first patient visit, 800+ employed W-2 psychiatrists as of February 2026,
  3M+ cumulative visits, in-network coverage across 100+ plans (170M+ lives), and over $400M raised
  through the February 2026 $210M Series D led by Perceptive Advisors. Talkiatry explicitly declined
  to disclose a Series D valuation; the widely cited ~$1.4B figure is an industry-inferred unicorn
  mark (the 2026 median new-unicorn valuation), not a company-confirmed price. The only public
  revenue anchor is a low-reliability third-party Latka estimate of ~$94.7M for 2025; management
  separately disclosed 1,745% revenue growth from 2021 to 2024. Material gaps remain: no disclosed
  ARR, gross margin, net revenue retention, cash burn, EBITDA, payer concentration, equity-vs-debt
  split of the Series D, or confirmed valuation. Adverse signals include a Meta Pixel patient-data
  class action that survived a motion to dismiss in October 2025, TINA.org scrutiny of "$30 or less"
  advertising, 2.7/5 consumer ratings dominated by billing complaints, and DEA telemedicine
  prescribing flexibilities that expire December 31, 2026.
