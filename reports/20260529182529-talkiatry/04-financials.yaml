  - id: growth-evidence-and-clinical-traction
    title: Growth evidence and clinical traction
    body: >-
      The company's public traction disclosures are milestone-based rather than period-revenue disclosures. Talkiatry crossed 3 million cumulative patient visits as of
      February 2026, doubling from 2 million in May 2025, and the acceleration is striking: the company took three and a half years to reach its first million visits (by
      mid-2023) but added its second million in just 14 months, suggesting meaningful compounding in the installed referral and payer base. The psychiatrist workforce
      has grown from 300+ at the time of the Series C (June 2024) to 600+ by May 2025 and 800+ by the Series D (February 2026), implying a headcount of about 200 net
      new W-2 psychiatrists in approximately nine months. If visit-per-psychiatrist ratios remain stable, this workforce expansion is consistent with continued
      accelerating revenue.


      The most specific revenue figure in the public record is a management-disclosed 1,745% revenue growth from 2021 to 2024. This is a striking compound rate over
      four years (approximately 107% compound annual growth), but starting base and absolute 2024 dollar amount are not disclosed. The only external revenue estimate in
      the public record is from Latka (a self-reported SaaS revenue database), which estimated approximately $94.7 million annual run-rate as of September 2025.
      Latka's methodology relies on founder self-reporting or derived estimates and contains material inaccuracies in other fields (describing the company as bootstrapped
      and SaaS-only), so this figure should be treated as an order-of-magnitude estimate rather than an audited revenue figure. No analyst or investor has publicly
      confirmed a specific revenue number. Deloitte's Technology Fast 500 recognition for 2025 provides third-party confirmation of high growth rates without specifying
      dollar amounts.


      Health system penetration is a leading indicator of revenue scaling potential. Through its Mindshare Partner Program, Talkiatry has established partnerships with
      more than one-third of the top 20 U.S. health systems and 50+ systems in total. The AMGA partnership announced in April 2026 further accelerates this B2B channel.
      Prior collaboration announcements include HCA Healthcare (announced 2024) and BetterHelp/Business (September 2024), both adding referral pipelines without
      disclosing economics. Combined, these suggest the company is building a durable institutional demand moat, though the revenue contribution of each partnership is
      not publicly quantified.
