  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue and gross margin
      missingEvidence: FY2024 and FY2025 audited or management-prepared P&L with revenue, gross margin, and operating income
      whyItMatters: Cannot underwrite revenue multiple or assess capital intensity and path to profitability without disclosed financial statements
      diligencePath: Request audited financials or management-prepared P&L for at least FY2024 and FY2025 plus an LTM bridge
      relatedQuestionRefs:
        - QI001
        - QI003
        - QI004

    - type: private-evidence-only
      severity: blocking
      topic: capital structure
      missingEvidence: Equity-to-debt split in Series C and Series D; Banc of California credit facility terms, maturity, and covenants
      whyItMatters: Debt with maintenance covenants can restrict operations or trigger acceleration; true equity dilution cannot be calculated without the split
      diligencePath: Request financing term sheets for both rounds and the Banc of California credit agreement
      relatedQuestionRefs:
        - QI002
        - QI011

    - type: private-evidence-only
      severity: material
      topic: value-based care revenue
      missingEvidence: Number of active value-based payer contracts, PMPM/PEPM structures, and revenue contribution from these arrangements
      whyItMatters: VBC revenue is structurally higher quality than FFS but its size relative to total revenue is unknown; overstating its contribution would inflate revenue quality assessment
      diligencePath: Request list of active VBC contracts with contract type, effective date, and revenue contribution; validate savings methodology used to trigger shared-savings payments
      relatedQuestionRefs:
        - QI006
        - QI025

    - type: private-evidence-only
      severity: material
      topic: unit economics
      missingEvidence: Per-visit gross margin, customer acquisition cost by channel, and lifetime visit value per patient cohort
      whyItMatters: Cannot model whether the W-2 employer model generates positive contribution margin at current scale or requires further volume to reach profitability
      diligencePath: Request a unit economics model with revenue per visit, direct cost per visit, and CAC by channel alongside patient cohort retention curves
      relatedQuestionRefs:
        - QI003
        - QI005
        - QI027

    - type: conflicting-data
      severity: material
      topic: valuation
      missingEvidence: Company-confirmed post-money valuation for the Series D; reconciliation of conflicting external estimates ($284M Latka vs $500M industry databases vs $1.4B unconfirmed)
      whyItMatters: Valuation is unanchored and external estimates span nearly 5x range; cannot assess premium or discount to fair value without a confirmed number
      diligencePath: Request capitalization table and liquidation preference stack; confirm post-money valuation with investor documents
      relatedQuestionRefs:
        - QI021

    - type: missing-source
      severity: minor
      topic: payer mix
      missingEvidence: Breakdown of visit volume and revenue by payer type (commercial, Medicare Advantage, Medicaid, cash-pay)
      whyItMatters: Reimbursement pressure differs materially by payer type; commercial concentration has different risk profile than Medicare or Medicaid expansion
      diligencePath: Request payer mix as % of total visits and % of net revenue for the most recent 12 months
      relatedQuestionRefs:
        - QI015
        - QI019
