  - id: "buyer-payer-and-segment-map"
    title: "Buyer, payer, and segment map"
    body: >
      In-network telepsychiatry has a three-layer stakeholder model: the patient is the user and
      clinical beneficiary, the commercial insurer or government program (Medicare, Medicaid) is the
      primary payer, and the employer (through benefits design) or health system (through referral
      and capacity partnership) is an upstream channel shaper. Commercial insurance is the dominant
      channel: nearly all large U.S. employers (97%) offer mental health benefits, and 73% specifically
      cover telehealth mental health services as of 2025. The employer-sponsored commercial market
      drives network access negotiations; Talkiatry's coverage of more than 100 insurance plans
      covering 170M+ lives converts employer-plan breadth into direct patient reach. Medicare is
      permanently expanded: behavioral health telehealth now has no geographic originating-site
      restrictions and allows home-based visits with no enrollment ceiling, making Medicare
      beneficiaries (65+) a structurally accessible segment for in-network psychiatry. Medicaid
      coverage is state-variable but trending expansionary: Certified Community Behavioral Health
      Clinics grew from 67 facilities in 8 states in 2017 to over 500 across 46 states and DC by
      2025. Employers also increasingly function as direct payers through EAP channels: the
      Oliver Wyman / Mercer high-value EAP estimate of ~$6B identifies a near-term employer-
      sponsored psychiatry budget that could route patients into platforms like Talkiatry via
      employer benefits partnerships. Health systems represent a referral and capacity partnership
      channel rather than a direct payer; Talkiatry's enterprise partnerships follow a B2B2C path
      where the health system bears overflow risk and Talkiatry provides credentialed coverage.
