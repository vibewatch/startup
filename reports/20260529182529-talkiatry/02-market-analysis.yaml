chapter:
  number: 2
  title: "Market Analysis"
  summary: >
    The U.S. behavioral health market spans $76B–$97B in 2025 by the narrower clinical-treatment
    definition, with the narrower psychiatry-clinic segment at roughly $11B–$26B and the global
    telepsychiatry sub-market at $15.6B–$22.9B. Talkiatry's core addressable space—in-network
    outpatient telepsychiatry—sits inside the psychiatry-clinic layer, turbocharged by a structural
    psychiatrist shortage (137M Americans in shortage areas, 43,810-psychiatrist deficit projected
    by 2038), permanent Medicare telehealth expansions for behavioral health, and tightening insurer
    parity-law enforcement. Key constraints are DEA prescribing flexibility expiration risk post-2026,
    ghost-network and prior-authorization friction, and reimbursement uncertainty; enforcement actions
    against Cerebral highlight the regulatory scrutiny that pure-volume telemedicine prescribing
    practices invite.

sections:
  - id: "market-boundary-and-category-logic"
    title: "Market boundary and category logic"
    body: >
      Defining the right market boundary is the first analytical task before any sizing. The behavioral
      health spending continuum ranges from a narrow definition—licensed psychiatrist-led, medication-
      management-anchored outpatient services covered by commercial or government insurance—to a broad
      definition that includes every service touching mental health, substance use disorders, autism,
      intellectual and developmental disabilities, employee assistance programs, wellness apps, and
      inpatient facilities. Houlihan Lokey captures the full continuum at $400B–$500B in 2025; most
      clinical-treatment-focused research firms converge in the $76B–$97B range for the narrower
      definition. Talkiatry sits in the middle-narrow band: in-network outpatient telepsychiatry
      covering psychiatric evaluation, medication management, and follow-up for conditions such as
      anxiety, depression, ADHD, PTSD, bipolar disorder, and OCD. Excluded from this core definition
      are inpatient and residential psychiatric care, standalone psychotherapy without medication
      management, substance use disorder treatment, EAP-only programs, and direct-to-consumer
      uninsured or cash-pay offerings. Adjacent spend that may expand Talkiatry's footprint over time
      includes value-based care contracts, employer-sponsored benefits (an estimated $6B high-value
      EAP opportunity), and health-system capacity partnerships. The boundary discipline matters
      because a $500B total-market assertion would make Talkiatry's in-network model look artificially
      small; a $10B psychiatry-clinic claim would understate the in-network channel's reach. Routine
      telepsychiatry—scheduled evaluations with a consistent psychiatrist or small group, serving a
      regular caseload—is the dominant commercial delivery mode and the segment Talkiatry competes in
      most directly. In-home telepsychiatry solutions led global market share at roughly 36% in 2024,
      confirming that consumer-preference for home-based psychiatric care aligns with Talkiatry's
      fully virtual model.
