  - id: "constraints-adverse-signals-and-diligence-gaps"
    title: "Constraints, adverse signals, and diligence gaps"
    body: >
      Several constraints limit the speed and ceiling of the telepsychiatry opportunity. The most
      time-sensitive is DEA prescribing rule uncertainty: the pandemic-era Fourth Temporary Extension
      of telemedicine flexibilities expires December 31, 2026. Without permanent rules or further
      extension, the Ryan Haight Act's pre-pandemic requirement for an in-person evaluation before
      prescribing any Schedule II–V controlled substance via telemedicine would snap back in 2027.
      Roughly 24% of Americans currently use prescription mental health medications, including ADHD
      stimulants (Schedule II) and benzodiazepines (Schedule IV), making this a binary access cliff
      for medication-management telepsychiatry. Second, administrative friction erodes unit economics:
      55% of behavioral health providers listed under Medicare Advantage plans were inactive in 2023
      (ghost networks), and prior authorization often requires reauthorization every 8–20 sessions,
      consuming 5–10% of session revenue. Third, 54.7% of U.S. adults with mental illness received
      no treatment in 2024—the treatment gap reflects not just shortage but also stigma, cost, and
      acuity factors that telemedicine alone cannot resolve. Fourth, enforcement actions against
      Cerebral and Done Health illustrate how aggressive telemedicine prescribing business models
      attract DEA and DOJ scrutiny: Cerebral paid $3.6M to DOJ/DEA in November 2024 for incentivizing
      clinicians to boost stimulant prescriptions regardless of clinical appropriateness, and Done
      Health's founders faced criminal charges. These actions signal a market-wide compliance standard
      that favors clinically conservative full-stack providers like Talkiatry but also confirm that
      regulatory scrutiny is a permanent feature of the sector. Fifth, the parity enforcement pause
      under the 2024 MHPAEA Final Rule leaves commercial insurers with negotiating leverage on network
      adequacy until state laws close the gap. Sixth, the persistent sizing discrepancy across
      publishers—$76B vs. $97B for the same U.S. market in 2025—means that any bottoms-up market
      model should be anchored to service volumes and reimbursement rates, not to consensus TAM.
