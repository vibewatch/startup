figures:
  - id: "FM001"
    title: "Market sizing lens: TAM / SAM / SOM pyramid for Talkiatry"
    type: "pyramid"
    layout: "standard"
    summary: >
      A three-layer pyramid shows how the $76B–$500B total behavioral health market narrows toward
      Talkiatry's actual in-network outpatient telepsychiatry addressable space.
    data:
      items:
        - label: "TAM — U.S. behavioral health (clinical treatment)"
          value: "$76B–$97B (2025)"
          detail: >
            Publisher range from Mordor ($76.25B), Fortune Business Insights ($92.14B), and
            TowardsHealthcare ($96.9B) for U.S. behavioral health clinical services in 2025.
            Excludes the $400–500B broad definition that adds IDD, autism, EAP, and wellness.
        - label: "SAM — U.S. outpatient psychiatry and telepsychiatry"
          value: "$11B–$26B (2025 estimate)"
          detail: >
            Grand View Research psychiatry clinic market: $10.96B (2025). Covenant Health
            Advisors places the broader outpatient psychiatry segment at $25.9B (2023), suggesting
            the SAM lies between $11B and $26B depending on boundary. No single public source
            isolates U.S. in-network telepsychiatry alone.
        - label: "SOM — In-network telepsychiatry accessible to Talkiatry"
          value: "Not precisely isolable from public data"
          detail: >
            Talkiatry covers 170M+ insured lives across 100+ payers. Telehealth share of
            behavioral health visits reached 65.6% of all U.S. behavioral health telehealth in
            2024. Precise SOM is not derivable from public market data alone; requires bottom-up
            modeling from reimbursement rates and addressable psychiatrist capacity.
    approximationNotes: >
      SAM range uses publicly available psychiatry clinic market estimates and is not a Talkiatry
      management forecast. SOM cannot be precisely estimated without proprietary revenue and
      payer-mix data. The pyramid is directional, not arithmetic.
    claimRefs:
      - CM001
      - CM006
      - CM010
      - CM013
      - CM014
      - CM016
      - CM033

