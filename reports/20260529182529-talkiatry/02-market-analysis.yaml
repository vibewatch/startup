  - id: "FM004"
    title: "Patient adoption funnel: path from mental illness prevalence to in-network telepsychiatry"
    type: "funnel"
    layout: "standard"
    summary: >
      The funnel illustrates where the treatment gap, access barriers, and telehealth normalization
      each affect the conversion from potential patient to active telepsychiatry user.
    data:
      items:
        - label: "U.S. adults with any mental illness (2024, millions)"
          value: 62
          detail: "SAMHSA 2025 data cited by Mordor Intelligence; approximately 62 million U.S. adults had any mental illness in 2024, representing ~23% of the adult population."
          claimRefs:
            - CM042
        - label: "Adults who sought or received any mental health treatment (millions)"
          value: 28
          detail: "54.7% of adults with mental illness received NO treatment in 2024, leaving approximately 45% (~28M) who accessed some form of care. Telehealth addresses access barriers but not stigma or cost entirely."
          claimRefs:
            - CM042
        - label: "Adults insured with plans covering outpatient psychiatric care (millions, est.)"
          value: 24
          detail: "Approximately 85-90% of treatment-seekers have insurance; 97% of large employer plans offer mental health benefits and Medicare/Medicaid add further coverage. Estimated ~24M insured among treatment-seekers."
          claimRefs:
            - CM034
            - CM028
        - label: "Adults reached by telehealth behavioral health channel—all providers (millions, est.)"
          value: 12
          detail: "66.4M behavioral health telehealth visits in 2024 across all providers. Estimating ~4-5 visits per unique patient yields ~12-15M distinct patients who used behavioral health telehealth in 2024."
          claimRefs:
            - CM016
            - CM017
        - label: "Adults reachable in-network via telepsychiatry in shortage areas unlocked by telehealth (millions, est.)"
          value: 5
          detail: "137M Americans in HPSAs; telepsychiatry removes the geographic barrier for commercially insured patients in shortage areas. Conservative estimate of the incremental in-network population unlocked by virtual delivery."
          claimRefs:
            - CM020
            - CM022
        - label: "Patients in active in-network telepsychiatry medication management programs (millions, est.)"
          value: 2
          detail: "In-network full-stack platforms represent a small but fast-growing share of behavioral health telehealth. Talkiatry reported 3M+ cumulative visits as of February 2026; active-patient count substantially smaller than cumulative visits."
          claimRefs:
            - CM001
            - CM015
    approximationNotes: >
      Funnel step values are a mix of published market-level statistics and derived estimates.
      The 45% receiving-treatment figure is estimated from the 54.7% no-treatment rate. Insured-
      share estimate is directional. Visit-level data (66.4M visits) is not equivalent to unique
      patients. Talkiatry cumulative visit count is from chapter 1 prior context.
    claimRefs:
      - CM015
      - CM016
      - CM017
      - CM020
      - CM022
      - CM034
