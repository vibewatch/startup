  - id: "capital-history-investor-map"
    title: "Capital history and investor map"
    body: >
      Talkiatry's funding history spans five years and four disclosed tranches. The company launched
      its Series A in February 2021 with $5 million from Sikwoo Capital Partners, Relevance Ventures,
      and CityMD founder Dr. Richard Park. Left Lane Capital led an additional $15 million close in
      July 2021, completing an initial $20 million Series A. A $17 million add-on brought the total
      Series A to $37 million by January 2022. The Series B was not separately disclosed in retained
      sources; the next notable round was a $130 million Series C in June 2024, led by Andreessen
      Horowitz (a16z) with participation from Perceptive Advisors, and a debt facility from Banc of
      California. That round brought total disclosed funding to $245 million. Most recently, in
      February 2026, Talkiatry raised a $210 million oversubscribed Series D led by Perceptive Advisors,
      with Sofina (a Belgian publicly traded investment company), a16z, blisce/, and Left Lane Capital
      also participating, and another Banc of California debt facility. Total capital raised now exceeds
      $400 million. Talkiatry does not disclose its current valuation; a $1.4 billion figure has
      circulated in industry reports but has not been officially confirmed by the company. Banc of
      California's recurring debt role suggests the company actively uses credit facilities alongside
      equity to fund growth. No secondary transactions or credit facilities beyond Banc of California
      have been identified in retained sources. Board composition, investor control rights, and cap-table
      details are not publicly disclosed.
