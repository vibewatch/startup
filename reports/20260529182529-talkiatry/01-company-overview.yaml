  - id: "founders-leadership-operating-footprint"
    title: "Founders, leadership, and operating footprint"
    body: >
      Talkiatry remains visibly co-founder led. Robert Krayn, who serves as CEO, brings an investment
      banking background and has positioned himself as the public face of Talkiatry's strategy, legislative
      advocacy, and category creation in insurance-covered telepsychiatry. Dr. Georgia Gaveras, DO, serves
      as Co-Founder and Chief Medical Officer; she holds triple board certification in adult psychiatry,
      child and adolescent psychiatry, and addiction medicine, and has been a consistent scientific voice
      for the company in peer-reviewed research and industry forums. The founding dynamic—a patient-
      advocate CEO paired with a practicing psychiatrist CMO—is a differentiating narrative for the company.
      Beyond the founding duo, Talkiatry has assembled an executive bench that includes Rachael Kobida
      as CFO, Christian Freese as COO, Leslie Guckert-Neitzel as Chief People Officer, Eric Triana as
      Chief Compliance Officer, and Alexander Kozersky as Chief Growth Officer. The operating footprint
      is entirely virtual: there is no required patient-facing office infrastructure across the 45 states
      in which the company operates. Talkiatry opened a physical Manhattan office in Hudson Square in 2021
      but the clinical model does not depend on it. The company's employment structure—treating all
      psychiatrists as W-2 employees with benefits and administrative support rather than independent
      contractors—is both a quality lever and a meaningful cost center. Clinical results cited in a
      peer-reviewed Journal of Medical Internet Research (2023) study demonstrate that 67% of anxiety
      patients and 62% of depression patients no longer had clinically significant symptoms after an
      average of five visits. The company reports 80% less clinician burnout versus industry averages
      in its own surveys. Key-person dependence on Krayn and Gaveras is high: both are closely identified
      with the company's external positioning, investor relationships, and clinical philosophy.
