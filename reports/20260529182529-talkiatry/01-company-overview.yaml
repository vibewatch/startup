company:
  name: "Talkiatry"
chapter:
  number: 1
  title: "Company Overview"
  summary: >
    Talkiatry is a New York City-based telepsychiatry company, co-founded in 2019 by Robert Krayn (CEO)
    and Dr. Georgia Gaveras, DO (CMO), that employs more than 800 full-time W-2 psychiatrists and has
    delivered over 3 million patient visits as of February 2026. The company differentiates on its
    full-stack, in-network model—owning its technology platform, insurer contracts, and clinical workforce—
    and has raised over $400 million in total, most recently a $210 million Series D in February 2026
    led by Perceptive Advisors. Adverse signals include an advanced class action over Meta patient-data
    sharing and prior advertising complaints, neither of which appears existential at this stage.

sections:
  - id: "identity-product-and-scale"
    title: "Identity, product platform, and current scale"
    body: >
      Talkiatry is a national full-stack telepsychiatry provider headquartered in New York City. The
      company co-founded in 2019 by Robert Krayn and Dr. Georgia Gaveras—launched its first patient
      visit in April 2020, originally intending a hybrid in-person and virtual model before COVID-19
      lockdowns forced a fully virtual pivot. That pivot proved catalytic: Talkiatry has since grown into
      what it claims is the largest private employer of psychiatrists in the United States. The company's
      core product is in-network psychiatric care delivered entirely via telemedicine. Patients are matched
      with full-time, board-certified W-2 employed psychiatrists for initial evaluations of 60–75 minutes
      followed by ongoing medication management and supportive psychotherapy. Conditions treated include
      anxiety, depression, ADHD, bipolar disorder, OCD, PTSD, postpartum depression, and more. A
      defining commercial differentiator is the breadth of in-network insurance coverage: as of the
      February 2026 Series D announcement, Talkiatry is in-network with more than 100 insurance plans
      covering more than 170 million lives, spanning commercial payers including Aetna, Blue Cross Blue
      Shield, United Healthcare, Cigna, and Humana as well as Medicare plans. The company's proprietary
      AI-powered technology platform automates scheduling, billing, patient engagement, and care
      coordination, enabling psychiatrists to focus on clinical work. The scale trajectory is steep:
      from a standing start in April 2020, the company surpassed 1 million patient visits by mid-2023,
      reached 2 million by May 2025, and crossed 3 million by February 2026. As of the Series D
      announcement, revenue grew 1,745% from 2021 to 2024, though exact current run-rate is not
      publicly disclosed. Geographic reach covers 45 U.S. states.
