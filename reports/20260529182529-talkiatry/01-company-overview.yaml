  - id: "milestones-partnerships-adverse"
    title: "Milestones, partnerships, and adverse events"
    body: >
      Talkiatry's chronology shows rapid clinical and commercial scaling interrupted by meaningful
      adverse disclosures. The company was incorporated in 2019, took its first patient in April 2020,
      and opened a Manhattan office in 2021 while building out national insurance contracts. In August
      2023, it formed a referral partnership with NOCD for OCD treatment, and in December 2023 it
      partnered with Charlie Health for adolescent and young adult care coordination, signaling a
      movement beyond direct-to-consumer psychiatry into ecosystem integrations. In late 2023, Talkiatry
      launched its Mindshare Partner Program, which enables health systems to refer patients while using
      their own electronic health record workflows; by the February 2026 Series D, that program had
      expanded to partnerships with more than a third of the top 20 U.S. health systems and more than
      50 systems total. In September 2024, it partnered with BetterHelp to provide psychiatry for
      BetterHelp's employer clients, adding an employer channel. In 2025, the company was recognized
      on Deloitte's Technology Fast 500 list of fastest-growing North American companies. On the adverse
      side, Truth in Advertising (TINA.org) raised concerns in January 2024 that Talkiatry was
      advertising that "most visits cost patients $30 or less" while many patients were receiving
      surprise bills of hundreds of dollars; the company removed the claim from its website in December
      2024. Consumer complaints on BBB and Trustpilot corroborate billing confusion. More seriously, in
      October 2025 a federal class action was advanced in the U.S. District Court for the Central
      District of California alleging that Talkiatry shared patient health information with Meta
      Platforms without consent, in violation of state and federal privacy laws. The lawsuit survived
      partial dismissal and remains pending as of the run date. Additionally, current and former
      psychiatrists on professional forums have raised concerns about productivity-based compensation
      metrics and strict non-compete clauses, which could affect clinician retention at scale.
