callouts:
  - calloutType: "strength"
    title: "W-2 employment model creates defensible quality moat"
    body: "Talkiatry's decision to employ all psychiatrists as full-time W-2 staff—rather than the contractor model used by most telehealth peers—enables meaningful quality control, continuity of care, and proprietary AI-driven workflow optimization. The peer-reviewed JMIR outcomes data and repeat institutional investment validate this structural choice."
    claimRefs:
      - CO007
      - CO040
      - CO041
      - CO043

  - calloutType: "strength"
    title: "Deep in-network coverage is a rare moat in behavioral health"
    body: "Coverage of 170 million lives across 100+ insurers positions Talkiatry as the path-of-least-resistance psychiatric referral for any employer or health system seeking in-network psychiatric care, a status most behavioral health providers cannot match."
    claimRefs:
      - CO010
      - CO038

  - calloutType: "risk"
    title: "Privacy class action and billing complaints are reputational and legal overhang"
    body: "The October 2025 federal class action alleging patient data shared with Meta Platforms without consent, combined with the December 2024 advertising correction for misleading cost claims, signals operational and compliance risk that could attract regulatory scrutiny and undermine patient trust even as clinical outcomes remain strong."
    claimRefs:
      - CO045
      - CO046
      - CO047

  - calloutType: "risk"
    title: "Key-person concentration at the founding team level is high"
    body: "External positioning, investor confidence, and clinical credibility are tightly bound to Robert Krayn and Dr. Georgia Gaveras. Neither a board succession plan nor a clear number-two has been disclosed in retained public sources, creating material key-person exposure at the CEO and CMO levels."
    claimRefs:
      - CO005
      - CO006

  - calloutType: "insight"
    title: "Institutional B2B pivot via Mindshare is the growth engine to watch"
    body: "The Mindshare Partner Program, launched in late 2023 and now covering 50+ health systems, represents a shift from consumer acquisition to institutional distribution. If this channel continues to scale, Talkiatry may be building a defensible multi-sided network among payers, health systems, and psychiatrists that could replicate the dynamics of a managed-care organization at startup unit economics."
    claimRefs:
      - CO038
      - CO039

