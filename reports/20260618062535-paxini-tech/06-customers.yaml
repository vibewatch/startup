callouts:
  - calloutType: risk
    title: Investor-Customer Overlap Creates Concentration and Conflict Risk
    body: >-
      PaXini's four primary named production-intent customers—BYD, JD.com, SAIC, and BAIC—are
      all equity shareholders. This creates circular validation: commercial wins may reflect
      investor obligation rather than market-competitive procurement, and any deterioration in
      a strategic relationship could simultaneously remove a major customer and increase financing
      pressure. Arm's-length pricing verification is an essential diligence step.
    claimRefs: [CU019, CU031]

  - calloutType: risk
    title: Market Share Claim Lacks Independent Verification
    body: >-
      The 80% global robotic tactile sensor market share figure attributed to Goldman Sachs likely
      relies on company-provided data. A separate Sina Finance analysis cited 12% domestic high-end
      share in a market where foreign companies hold 68%. Investors should treat the 80% figure as
      indicative of PaXini's own framing rather than independently verified market position, and
      should commission a direct market study.
    claimRefs: [CU011, CU012, CU037]

  - calloutType: insight
    title: Geely Deployment Is a Material Proof Point Awaiting Corroboration
    body: >-
      The Geely Qiantang production deployment—99.8% task success rate, eight hours continuous
      zero-anomaly operation—is the strongest available evidence of production-grade PaXini
      deployment. If independently verified and replicated at a second OEM site, it would
      represent category-defining proof for humanoid-robot-based manufacturing automation.
      Currently it rests on a single company press release.
    claimRefs: [CU002, CU003, CU004]

