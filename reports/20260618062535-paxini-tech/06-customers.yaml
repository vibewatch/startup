company:
  name: PaXini Tech
chapter:
  number: 6
  title: Customers
  summary: >-
    PaXini's declared customer base spans precision manufacturing, automotive assembly, logistics,
    retail, healthcare, and embodied-AI R&D, with Geely Auto as the only publicly confirmed
    production deployment as of June 2026. BYD and JD.com serve simultaneously as equity
    investors and strategic customers, a structure that provides commercial validation while
    concentrating risk in an investor-customer overlap. The company claims over 80% global
    robotic tactile sensor market share per Goldman Sachs research, but independent verification
    is absent, and a domestic market analysis cites a much lower domestic share—pointing to a
    concentration risk and an evidence gap that warrants direct diligence.

sections:
  - id: customer-base-segmentation
    title: Customer Base Segmentation
    body: >-
      PaXini addresses six identifiable buyer segments across its product stack. First, humanoid
      and embodied-AI robot makers integrate PaXini's ITPU sensors, DexH13/DexH5 dexterous hands,
      or full robot platforms into their own systems; Figure AI is mentioned in Chinese investment
      media as an international preferred partner, though no contract has been confirmed. Second,
      automotive OEMs—primarily BYD, Geely, SAIC, and BAIC, all also equity investors—deploy
      TORA-ONE humanoid robots on production lines for precision tasks such as wiring-harness
      assembly. Third, industrial manufacturing integrators in 3C electronics and precision
      assembly use PaXini's force-torque sensors for automation tasks where sensor entry prices
      start as low as CNY 199 (~USD 27). Fourth, cloud and data platforms—JD Cloud, Tencent
      Cloud, and Baidu AI Cloud—act as infrastructure partners and data-monetization channels
      for the OmniSharing DB data mall. Fifth, academic and research institutions such as SJTU
      and Zhejiang University purchase sensors and data for embodied-AI model development. Sixth,
      healthcare, elderly-care, and commercial service operators are targeted by TORA-ONE's
      mobility and dexterity capabilities, though no named healthcare deployment has been
      announced. PaXini's investor roster—BYD, JD.com, SAIC, BAIC, TCL, LEO LION (Meta
      affiliate)—also serves as a proxy for the target customer base, since most investors have
      disclosed deployment plans or strategic alignment. Geographic coverage remains overwhelmingly
      China-domestic, with offices in Shenzhen, Shanghai, Tianjin, and Suqian, though the
      international storefront and AIFITLAB distributor channel provide a global entry point for
      developer and researcher buyers at the sensor level.
    claimRefs: [CU001, CU013, CU015, CU016, CU029, CU033]
    tableRefs: [TU001]
    figureRefs: [FU001]

  - id: named-customer-proof
    title: Named Customer Deployments and Evidence Quality
    body: >-
      The strongest available deployment evidence is Geely Auto's Qiantang manufacturing base,
      where PaXini's TORA-ONE was deployed in May 2026 for automotive wiring-harness assembly
      and adhesive-pasting tasks. The company reported eight hours of continuous zero-anomaly
      operation and a 99.8% task success rate, though these figures originate from a company-issued
      press release and have not been independently audited. BYD made a strategic investment in
      April 2025—reportedly its largest single robotics investment—and has co-developed
      production-line customization requirements with PaXini, but no BYD deployment KPIs have
      been publicly disclosed. JD.com led the Series A round in August 2025 and has committed
      verbally to logistics and warehousing deployment via JD AI Research statements, but no
      JD facility deployment has been announced. SPiRAL Labs is listed as a named customer on
      PaXini's official website, indicating at least one US-market customer engagement, though
      scope and production status are unavailable. The joint OmniSharing DB data mall with JD
      Cloud, Tencent Cloud, and Baidu AI Cloud represents a live partner-customer co-deployment
      where the three cloud companies serve as both distribution infrastructure and early adopters
      of PaXini's embodied data layer. Academic partners SJTU and Zhejiang University
      co-authored the RoboPaint validation paper, confirming research-grade use of PaXini's
      tactile dataset and dexterous-hand products. SAIC Motor and BAIC Group are early investors
      with automotive-sector alignment, but neither has disclosed a production deployment.
    claimRefs: [CU002, CU003, CU004, CU005, CU006, CU007, CU008, CU009, CU010, CU045, CU046, CU047]
    tableRefs: [TU002]
    figureRefs: [FU003]

  - id: adoption-trajectory
    title: Adoption Trajectory and Market Evidence
    body: >-
      PaXini claims industry-leading sensor shipment volumes without disclosing unit counts or
      year-over-year growth, making adoption trajectory assessment indirect. The most-cited proxy
      is a Goldman Sachs statement that PaXini has captured over 80% of the global robotic
      tactile sensor market; however, this figure originates from Goldman Sachs analyst research
      likely informed by company-provided data, and the scope—whether it covers tactile sensors
      deployed specifically in humanoid robots or the broader robotics market—is not defined
      in available sources. A Sina Finance competitive analysis published independently in April
      2025 cited PaXini's domestic high-end tactile sensor share at approximately 12%, in a
      segment where 68% of share is held by foreign incumbents, presenting a materially different
      picture of competitive position. CES 2026 served as PaXini's largest international
      proof-of-concept event, where the full product matrix—sensors, DexH13, TORA-ONE, and
      OmniSharing DB—was demonstrated live. The company's five data factories are designed for
      approximately 200 million omni-modality data entries annually, and joint research with
      SJTU and Zhejiang University validated an 84% success rate in human-to-robot hand mapping
      and 80% VLA policy success in Isaac Sim environments. PaXini is one of eight Chinese
      embodied-intelligence companies valued above RMB 10 billion, a peer benchmark underscoring
      the sector's momentum. The IFR 2025 report shows China installed 295,000 industrial robots
      in 2024—54% of global installations—providing a strong macro tailwind for domestic customer
      acquisition even absent PaXini-specific adoption data.
    claimRefs: [CU011, CU012, CU024, CU025, CU027, CU034, CU035, CU036, CU038, CU048]
    tableRefs: [TU003]
    figureRefs: [FU002]

  - id: retention-durability-expansion
    title: Retention, Durability, and Expansion
    body: >-
      PaXini has not publicly disclosed net revenue retention, gross retention, churn rates,
      contract lengths, repeat purchase rates, or cohort-level customer satisfaction data.
      The business model spans one-time hardware sales—sensors at CNY 199–thousands and
      TORA-ONE at USD 50,000–150,000 per unit—and potentially recurring data subscription
      revenue via OmniSharing DB, but the data mall's subscriber count and pricing terms are
      not disclosed, making durability assessment speculative. The structural retention driver
      is ecosystem lock-in: customers integrating PaXini's ITPU tactile hardware are dependent
      on compatible dexterous hand models and, ultimately, the OmniVTLA training pipeline,
      creating an incentive to deepen the relationship over time. Investor-customers such as
      BYD and JD create long-term strategic alignment but make independent retention measurement
      difficult because these relationships blend equity interest with commercial obligation.
      PaXini maintains four China offices (Shenzhen, Shanghai, Tianjin, Suqian) indicating
      domestic geographic expansion; international reach is nascent, with AIFITLAB as a
      confirmed third-party global distributor. Korean technology conglomerates are mentioned
      as international partners in Chinese investment media, but no named Korean entity or
      revenue has been confirmed. The company's 315 insured employees per the QCC Chinese
      business registry suggests a lean workforce relative to its RMB 10 billion valuation,
      which may constrain its ability to service a rapidly expanding enterprise customer base
      without material hiring investment.
    claimRefs: [CU014, CU018, CU022, CU026, CU028, CU039]
    tableRefs: [TU004]

  - id: concentration-risk
    title: Concentration and Partner Dependence
    body: >-
      PaXini's customer concentration risk is structurally elevated because its principal
      named production-intent customers—BYD, JD.com, Geely, SAIC, BAIC—are also equity
      shareholders. The 14 disclosed top-tier industrial investors span automotive (BYD, SAIC,
      BAIC, Gree-adjacent Zhuhai Sci-Tech), internet and logistics (JD.com), consumer electronics
      (TCL, XGD), and overseas (Meta affiliate LEO LION), creating a customer pipeline that is
      predefined by the cap table rather than purely won through market competition. This structure
      provides strong near-term commercial validation but creates concentration risk if any anchor
      partner reduces strategic commitment, and potential procurement-integrity questions if
      arm's-length pricing is not demonstrable. Goldman Sachs and Morgan Stanley have publicly
      named PaXini as upstream infrastructure for embodied intelligence, adding reputational
      weight but also underscoring the circularity risk: analyst market-share claims may derive
      from company-provided figures without independent verification. The 80% global share
      assertion conflicts with the Sina Finance 12% domestic high-end share figure; the
      discrepancy is unresolved and represents a material diligence gap for any investor
      attempting to size the addressable customer base independently. PaXini's dependence on
      China's automotive and robotics manufacturing ecosystem also means that regulatory
      changes, export controls, or sectoral downturns could disproportionately affect the top
      customer concentration without an international backstop in place.
    claimRefs: [CU017, CU019, CU023, CU030, CU031, CU037]
    tableRefs: [TU005]
    figureRefs: [FU004]

