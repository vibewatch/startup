  - id: operational-technical
    title: Operational, Technical & Safety Risks
    body: >
      PaXini's commercial narrative depends on hardware that performs reliably at industrial scale,
      but the current evidence base is thin. Company-specified durability metrics—more than
      100,000 operation cycles for the DexH13 dexterous hand and over 10 million service-life
      cycles, IP65 protection, and 200% safe overload tolerance for the PX-6AX-GEN3 sensor
      array—have not been independently validated in sustained production environments. The sole
      confirmed production proof point, Tora-One's deployment at Geely's Qiantang manufacturing
      base, reported 99.8% task success over eight continuous hours per a company statement in May
      2026. A single-facility, single-shift measurement from one deployment is insufficient to
      constitute a reliability dataset for capital equipment intended for industrial scale.

      Sector-wide constraints compound PaXini's hardware risk. A Morgan Stanley survey of
      prospective industrial buyers found only 23% satisfaction with currently available humanoid
      robot products—a demand-side reality check that aggressive supply-side forecasts do not
      adequately reflect. Battery life of two to three hours per charge is an industry-level
      constraint that limits shift coverage, adds hot-swap logistical complexity, and restricts
      deployment contexts. Most humanoid robot shipments globally through 2025 remained
      concentrated in controlled pilots and demonstrations rather than continuous multi-shift
      production; PaXini's Geely deployment is among the clearest documented exceptions, but
      rests on a company statement, not independent audit.

      Product safety liability exposure is material in an industrial context. If a Tora-One or
      DexH13 unit caused injury or production loss at a customer facility, PaXini would face
      product liability claims without a documented safety audit history or ISO certification track
      record. The March 2026 national standard system explicitly includes safety-and-ethics
      requirements spanning the entire industrial lifecycle; non-conformance with evolving
      standards could trigger enforcement action and customer contract termination. The five-region
      data collection factory network also introduces operational complexity: sensor calibration,
      data-quality assurance, and security across distributed facilities demand management
      bandwidth that is currently unquantified. AI model failure or misclassification in
      safety-critical operations—PaXini's OmniVTLA 2.0 is a first-generation commercial model—
      represents an emerging liability with no disclosed red-teaming or fail-safe protocol.
