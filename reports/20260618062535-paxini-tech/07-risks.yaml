  - id: financial-model-thesis-break
    title: Financial, Capital & Thesis-Break Triggers
    body: >
      PaXini is a pre-revenue unicorn. CBInsights records zero disclosed fiscal-year revenue
      across nine funding rounds through March 2026, with a post-Series-B valuation above RMB 10
      billion. The closest functional comparable—Unitree Robotics, now STAR Market IPO-approved—
      reported RMB 1.699 billion in 2025 revenue with 60.13% gross margins. PaXini has published
      no analogous revenue milestone. Implied price-to-sales is incalculable; implied
      price-to-narrative is high.

      The planned Hong Kong IPO introduces bilateral risk. Favourable conditions would provide
      capital to fund the data factory expansion and OmniVTLA model training that management
      has explicitly cited as IPO-proceeds targets. Unfavourable HK market conditions—which have
      periodically closed the window for growth-stage deep-tech listings—would force a delay,
      bridge financing with further dilution, or a down-round. The compressed timeline between
      the March 2026 Series B close and a potential IPO application leaves limited runway to
      establish multi-deployment commercial proof before becoming a public company subject to
      quarterly scrutiny.

      Revenue model concentration carries structural risk. Reducing tactile sensor unit prices
      to as low as RMB 199 democratises adoption but requires significant volume to generate
      meaningful revenue in a global force sensor market growing at only 5% CAGR to USD 3.93
      billion by 2035. Goldman Sachs projects the humanoid robotics market reaching USD 38
      billion by 2035, providing a large-market narrative, but near-term realisation depends on
      production scaling that China's 140-plus manufacturers are also pursuing competitively.
      Goldman Sachs and Morgan Stanley research coverage positions PaXini favourably but
      reflects relationship-adjacent analysis rather than independent adversarial buy-side views.

      AgiBot reached 10,000 humanoid units in March 2026 via a listed-company acquisition route—
      an alternative IPO path signalling that direct HK Exchange registration carries approval
      risk for which PaXini may need contingency planning. Global competitors including Figure AI
      ($39B valuation, $1.9B raised) and Skild AI ($14B, $2B+ raised) command substantially
      larger capital pools and operate outside China's National Intelligence Law framework, giving
      them an inherent advantage with international enterprise and government customers.
