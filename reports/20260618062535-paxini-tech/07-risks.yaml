callouts:
  - calloutType: risk
    title: "China National Intelligence Law: Structural Market-Access Ceiling"
    body: >
      Article 7 of China's 2017 National Intelligence Law is not a mitigatable operational
      risk—it is the operative law of PaXini's home jurisdiction. Any Chinese company, including
      PaXini, must cooperate with state intelligence agencies on demand regardless of server
      location, data residency architecture, or stated privacy policy. US federal agencies,
      defense contractors, and regulated sectors in aligned jurisdictions cannot legally deploy
      PaXini hardware under this framework. Legislative momentum (American Security Robotics Act,
      March 2026) signals this ceiling is hardening, not softening. Investors whose thesis depends
      on US government, defense-adjacent, or ITAR-adjacent revenue should treat this as a thesis-
      level structural constraint, not a diligence checklist item.
    claimRefs:
      - CR005
      - CR006
      - CR007

  - calloutType: risk
    title: "Pre-Revenue Unicorn with Single Production Proof Point"
    body: >
      PaXini carries a post-Series-B valuation exceeding RMB 10 billion with zero disclosed
      revenue across nine funding rounds and a single confirmed production deployment (Geely
      Qiantang, May 2026) that rests on a company statement rather than an independently audited
      metric. Unitree Robotics—the sector's first public-market comparable—earned RMB 1.699
      billion in 2025 revenue at 60% gross margins before its IPO approval. PaXini is entering
      the public market without an analogous revenue anchor. Deterioration of the Geely
      relationship or failure to announce additional production deployments before IPO registration
      would remove the sole commercial evidence base at unicorn pricing.
    claimRefs:
      - CR012
      - CR019
      - CR032
      - CR035
      - CR036

  - calloutType: risk
    title: "Key-Person Concentration: Chairman, GM, and Legal Representative"
    body: >
      Founder Xu Jincheng holds the three highest-authority roles in PaXini simultaneously:
      legal representative (statutory liability), Chairman (governance), and General Manager
      (operations). Departure, regulatory restriction, or incapacitation would trigger
      simultaneous governance, strategic, and operational disruptions in a 315-person
      organisation with no documented succession plan. Pre-IPO governance remediation—including
      independent directors, C-suite delegation, and a documented succession structure—should
      be treated as a diligence precondition, not a post-IPO priority.
    claimRefs:
      - CR026
      - CR029
      - CR030

