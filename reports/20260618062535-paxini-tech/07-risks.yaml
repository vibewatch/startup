  - id: people-execution
    title: People & Execution Risks
    body: >
      Founder Xu Jincheng serves simultaneously as legal representative, Chairman, and General
      Manager per Aiqicha registration data. This triple concentration of statutory liability,
      board governance, and operational management in one individual is acute even by early-stage
      deep-tech standards. Should Xu depart, become incapacitated, or face regulatory scrutiny in
      any jurisdiction, PaXini would face simultaneous governance, strategic, and execution
      disruptions. Co-founder Nie Xianru (8% stake, board director) brings commercial depth from
      ZTE, Xiaomi, and NetEase, but the public record does not document formal succession
      planning, independent board structures, or C-suite delegation of operational functions.

      PaXini's registered headcount is 315 insured employees per Aiqicha. This is modest relative
      to simultaneous demands: running five-region Chinese data collection factory operations,
      advancing OmniVTLA and HyperCosmos model development, manufacturing sensors and dexterous
      hands, assembling and deploying Tora humanoid robots, and preparing a public-company-grade
      organisation for an HK IPO within 12 to 18 months. The implied headcount gap between
      current capacity and IPO-ready operations is a material execution risk.

      The Waseda University founding provenance provides technical credibility but introduces an
      IP-provenance question: the extent to which foundational sensor and tactile intelligence IP
      was developed at the university before transfer versus post-founding has not been disclosed.
      No IP disputes with Waseda or the Sugano Lab have been identified, but absence of evidence
      is not confirmed clean provenance. International expansion ambition requires establishing
      non-Chinese legal entities and compliance infrastructure that the current team has not
      publicly addressed.
