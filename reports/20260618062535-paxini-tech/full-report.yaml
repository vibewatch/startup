      - number: '5.5'
        title: Embodied AI Data Infrastructure and OmniVTLA Model
        blocks:
          - type: paragraph
            body: |
              PaXini has built a "human-centric" omni-modality embodied AI data infrastructure it claims
              addresses the scarcity of physical-contact modality training data in the robotics industry.

              The physical infrastructure consists of five wholly self-built data collection factories spanning
              North, East, Central, Southwest, and South China, with claimed annual production capacity of nearly
              200 million omni-modality data entries. Data collection is performed using the PXCap V, a wearable
              device with full five-finger tactile coverage incorporating 30 six-dimensional tactile modules at
              a density of 3,015 sensing points, capable of simultaneously capturing 82 degrees of freedom of
              hand motion and 15 dimensions of tactile information (forces, texture, elasticity). The data format
              is compatible with mainstream frameworks and supports conversion to LeRobot standard format.

              In March 2026, PaXini launched the OmniSharing DB cloud data mall in collaboration with JD Cloud,
              Tencent Cloud, and Baidu AI Cloud, described as the world's first large-scale multimodal embodied
              intelligence data cloud. The platform enables one-stop online data purchase and cloud-based
              preprocessing, model training, and deployment across the three partner cloud platforms.

              The proprietary OmniVTLA multimodal large model integrates Visual, Tactile, Language, and Action
              data streams for embodied AI training. External validation is limited to a joint paper titled
              "RoboPaint: From Human Demonstration to Any Robot and Any View," co-authored with Shanghai Jiao
              Tong University and Zhejiang University, which reported 84% success rate in mapping human hand
              states to robot dexterous hands across 10 tasks. VLA policies (Pi0.5) trained solely on PaXini-
              generated data achieved an average 80% success rate in three representative tasks within the
              Isaac Sim simulation environment. These results are simulation-only and do not constitute
              independent real-world validation of the OmniVTLA model or the data pipeline.

              PaXini also announced HyperCosmos, a multimodal world model under development, and plans to open
              the OmniSharing DB globally as a data infrastructure resource.
            claimRefs:
              - CE029
              - CE030
              - CE031
              - CE032
              - CE033
              - CE034
              - CE035
              - CE036
              - CE037
      - number: '5.6'
        title: Integration, Reliability, Support, and Roadmap
        blocks:
          - type: paragraph
            body: |
              Integration with third-party robot platforms is facilitated at the hardware layer through standard
              EtherCAT and Modbus industrial communication protocols on the DexH13 hand. The OmniSharing DB data
              format supports conversion to LeRobot and is compatible with mainstream deep learning frameworks,
              enabling AI developers to consume PaXini training data without custom preprocessing pipelines. The
              company provides both domestic (mkt@paxini.com) and overseas sales channels (sales_global@paxini.com)
              and maintains offices in Shenzhen (HQ), Shanghai, Tianjin, and Suqian. SPiRAL Labs is listed as
              a named research partnership on the official website.

              Published reliability specs include IP65 water/dust resistance, UL94 V-0 flame certification, and
              chip-level magnetic interference immunity on ITPU sensors. Operating temperature range is 0–50°C,
              with overload tolerance to −20–120°C. The DexH13 is rated for over 1 million press cycles and the
              ITPU sensor for over 10 million. These figures are company-claimed; no third-party certification
              body or independent test laboratory is identified in public materials.

              The publicly visible roadmap includes: (1) continued DexH13 GEN2 scale production; (2) OmniVTLA
              model advancement; (3) HyperCosmos multimodal world model development; (4) global expansion of
              the OmniSharing DB data cloud; and (5) expansion of data collection factory capacity. Specific
              timelines, milestone gates, or committed customer delivery dates are not publicly disclosed.
            claimRefs:
              - CE040
              - CE041
              - CE042
              - CE043
              - CE044
