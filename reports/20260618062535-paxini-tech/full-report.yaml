      - number: '2.2'
        title: Market Sizing Across Multiple Lenses
        blocks:
          - type: paragraph
            body: >
              No single authoritative sizing covers PaXini's precise SAM, so multiple lenses must be triangulated. For
              the humanoid robot market (the primary demand driver), MarketsandMarkets estimates $2.92 B in 2025 growing
              to $15.26 B by 2030 at 39.2% CAGR—a paid-access top-down report with broad inclusions. China alone is
              projected at $0.40 B in 2025 rising to $2.80 B by 2030 at 47.6% CAGR, reflecting the government-backed
              acceleration described in China's policy actions. The US segment is estimated separately at $857.9 M in
              2025 growing to $4.601 B by 2030. In the force sensor market—the industrial robot F/T sensor base on which
              PaXini's sensors compete—the global market was $2.30 B in 2024 and is expected to reach $3.93 B by 2035 at
              a modest 5.0% CAGR, reflecting slower growth in conventional industrial applications. The haptic and
              tactile technology market is broader at $6.61 B in 2025 growing to $8.21 B by 2030 at 4.5% CAGR, but is
              dominated by consumer haptic devices (vibration motors, gaming controllers) and significantly overstates
              the robotics-grade sub-segment PaXini targets. For the global tactile sensor market (consumer plus
              industrial), VMR via Sina Finance reported it exceeded $11.25 B in 2021 and projected it at $26.08 B by
              2028, again dominated by non-robot applications. The GGII forecast cited by China Unicom Research is
              notably more conservative than MarketsandMarkets: 12,400 humanoid units in 2025 at 6.339 B yuan (~$875 M),
              which is three times smaller than MarketsandMarkets' concurrent global estimate of $2.92 B—likely
              reflecting a narrower definition limited to advanced bipedal platforms. Goldman Sachs' two cited
              projections for the 2035 market ($154 B and $38 B) are substantially irreconcilable without access to the
              primary reports; the $38 B figure from AI Funding Tracker and the $154 B from the WIC report may differ in
              scope (hardware only vs. full ecosystem), time horizon, or report vintage, and neither should be used as a
              primary sizing reference without primary access. Investors should treat any single headline TAM with
              caution: PaXini's near-term SAM in the sensor and hand components of humanoid platforms is plausibly in
              the $0.3–0.8 B range as of 2025, growing with humanoid unit volumes.
