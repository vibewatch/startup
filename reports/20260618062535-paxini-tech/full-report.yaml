  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Stack Definition
        blocks:
          - type: paragraph
            body: >
              PaXini's addressable opportunity spans a nested stack of markets rather than a single category. At the
              base is the robotics-grade tactile and force/torque sensor market—distinct from consumer haptics and
              medical-only tactile devices, which have different buyer requirements, precision thresholds, and
              regulatory constraints. Within that base, the high-precision multi-dimensional segment (six-axis force,
              texture, elastic response captured simultaneously) is narrower still, and is where PaXini differentiates
              via its Hall-effect technology. Above sensors, PaXini sells dexterous robotic hands (DexH13) that
              integrate those sensors—competing here against gripper vendors and bare-metal effector suppliers. The next
              layer is humanoid robot platforms (TORA-ONE, TORA-DOUBLE ONE), where PaXini competes with Unitree, AgiBot,
              and global players. At the apex is an emerging embodied AI data infrastructure market: the OmniSharing DB,
              co-hosted with JD Cloud, Tencent Cloud, and Baidu AI Cloud, which commercializes real-world multimodal
              tactile data. This data layer has no established third-party sizing and should not be included in
              near-term TAM estimates without explicit caveats. The relevant excluded spend includes consumer haptic
              actuators (mobile phones, gaming), load cells and uniaxial strain gauges used in industrial weighing,
              autonomous mobile robots without dexterous arms, and purely software-based robot control stacks. PaXini's
              value proposition—full-stack hardware plus proprietary dataset plus model—means its SAM crosses all four
              layers but obtainable penetration in each is at different maturity stages.
