            title: Financial Opacity Is the Central Diligence Blocker
            body: >-
              PaXini has disclosed no revenue, gross margin, burn rate, runway, or unit economics in any public forum.
              CB Insights records zero revenue across all nine funding events. Without any revenue anchor, the RMB 10
              billion post-money valuation cannot be evaluated on standard financial multiples. This opacity is the
              primary reason the company cannot be underwritten on public data alone; a full data room is an absolute
