      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Conditional Track — Entry Discipline Critical
            body: >
              PaXini is a genuine category leader in tactile sensing with a credible full-stack embodied AI vision.
              However, at $1.5 billion with no disclosed revenue, the entry price embeds assumptions that have not yet
              been validated in commercial contracts. The Track recommendation reflects high conviction on the
              technology thesis and low conviction on near-term return at the current price. Entry is recommended only
              on pilot-to-contract confirmation or HK IPO price discovery below $2 billion.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV011
              - CV043
          - type: callout
            title: Valuation Stretch Warning — Revenue Opacity is Structural
            body: >
              No public revenue, gross margin, or customer contract data has been disclosed by PaXini as of June 2026.
              The March 2026 Series B round's implied 100–300x revenue multiple is supported only by narrative, analyst
              opinion, and strategic investor backing — not audited financials. Investors committing at the current
              valuation are underwriting a forecast, not performance. A down-round remains the single most likely
              scenario if commercial pilots do not convert within 18 months.
            calloutType: risk
            claimRefs:
              - CV003
              - CV011
              - CV036
              - CV052
          - type: callout
            title: Tactile Modality as a Durable Data Moat
            body: >
              PaXini's most defensible asset is not the sensor hardware but the proprietary tactile dataset generated by
              it. Unlike vision data, tactile interaction data cannot be scraped, synthesized, or purchased from
              existing data brokers. The OmniVTLA model trained on tens of billions of real-world tactile data points
              represents a compounding advantage — each deployment generates more data, improving model performance,
              strengthening sensor stickiness, and deepening the switching cost for robot OEMs. This flywheel, if it
              achieves escape velocity, could justify premium multiples even as hardware margins compress.
            calloutType: insight
            claimRefs:
              - CV013
              - CV046
              - CV047
              - CV049
