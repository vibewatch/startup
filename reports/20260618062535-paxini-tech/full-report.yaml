      - number: '4.5'
        title: Financial Gaps, Adverse Evidence, and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              PaXini's financial opacity is the defining diligence risk at this stage. The company has not disclosed
              revenue, ARR, GMV, gross margin, burn rate, runway, CAC, LTV, payback period, or any per-customer revenue
              metric. CB Insights records zero revenue for all nine funding events, confirming the absence of any
              verified external financial reporting. A Bloomberg-sourced IPO inquiry (reported by CNEVPost, June 2026)
              did not include financial disclosures. Adverse evidence from the Chinese corporate registry (AiQiCha)
              reveals three recorded business disputes, one filed legal case, and one court hearing announcement—the
              nature, counterparty, and financial materiality of these proceedings are not disclosed and require
              independent legal due diligence. The >80% global tactile sensor market share attributed to PaXini by
              Goldman Sachs originates from a single analyst report cited through a single media outlet (CNEVPost); it
              has not been corroborated by independent market data and should not be used as the primary basis for
              market-sizing assumptions. Revenue quality risk is high: hardware sales to a small cluster of strategic
              investors who also happen to be customers (BYD, JD.com, Geely) create a related-party revenue concern that
              cannot be evaluated without full financial statements. All third-party pricing data—DexH5 $2,000, DexH13
              $17,200, Tora-One $50K–$150K—is derived from marketplace aggregators, not from official PaXini pricing
              pages or contracts. The financial diligence verdict is: the company cannot be underwritten on public data
              alone. Material blockers include: (1) no disclosed revenue or margins, (2) no burn rate or runway, (3)
              related-party revenue concentration risk, (4) unquantified legal proceedings, and (5) IPO-level capital
              dependency for the next growth phase. The Geely deployment (99.8% task success, 8-hour continuous
              operation) is promising evidence of technical readiness, but is self-reported and requires independent
              audit.
