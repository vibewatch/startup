              The strongest available deployment evidence is Geely Auto's Qiantang manufacturing base, where PaXini's
              TORA-ONE was deployed in May 2026 for automotive wiring-harness assembly and adhesive-pasting tasks. The
              company reported eight hours of continuous zero-anomaly operation and a 99.8% task success rate, though
