      - number: '1.3'
        title: Funding history, valuation, and investor base
        blocks:
          - type: paragraph
            body: >-
              PaXini's capital journey has been rapid even by Chinese embodied AI standards. The first documented
              external round was a Pre-A closing dated 2022-12-29, described in Baike as raising "tens of millions of
              CNY" and marking the company's first institutional backing roughly eighteen months after founding. The QCC
              shareholder registry shows Xin'an Capital (新奥资本) and several other early institutional investors appearing
              from February 2024 onward, suggesting a Series A ladder began in early 2024. BAIC's investment vehicle
              (安鹏绿色) is registered from June 2024.

              BYD entered in April 2025 at the A+ stage, an investment described by Sina Finance as BYD's largest single
              embodied AI investment in 2025. Yicai reported a 13.4% stake for BYD at the time of the JD-led round in
              August 2025. On 2025-08-05, JD.com led a Series A financing that brought PaXini's total raised to CNY 1
              billion (~USD 139 million) in just four months—a milestone the company announced publicly. That round also
              included new investors Puxin Capital and XGD (新国都), plus follow-on commitments from existing shareholders
              TCL Capital and Addor Capital.

              The Series B closed on 2026-03-06. Multiple independent Chinese and international sources—Equalocean,
              Gasgoo, and the QQ/猎云网 syndicate—confirm the round exceeded RMB 1 billion and pushed PaXini's post-money
              valuation above RMB 10 billion (~USD 1.5 billion at prevailing rates). Pandaily's headline described the
              round at over USD 150 million. The round was led by Huangpu River Capital (黄浦江资本), Kaitai Capital (凯泰资本),
              and Xin'an Capital (信安资本), with additional participation from a major dual-currency fund, Zhuhai Science
              and Technology Industry Group, Shanda Capital (善达资本), Haichuan Fund (海川基金), Guangzhou Emerging Fund, the
              listed company Uni-Trend (优利德), Zhilai Capital (知来资本), LEO LION, Nanling Fund (南岭基金), Xiangcheng Financial
              Holding (相城金控), and several existing shareholders including Addor/Yida Capital (毅达资本), which significantly
              increased its stake.

              The company describes cumulative investment from 14 top-tier global industrial investors including Meta
              affiliates, BYD, JD.com, TCL, Zhuhai Sci-Tech Industry Group (Huafa and Gree affiliates), SAIC, and BAIC.
              Tracxn pegs total funding at approximately USD 150 million across four rounds, though its per-round
              amounts are partially redacted. CB Insights has a profile page but content is gated; no independently
              verified total has been published outside of company statements and tracker estimates. The pre-Series B
              JD-led round data from Yicai (a state-owned financial media outlet) is the most reliable anchor for the
              cumulative CNY 1 billion figure through August 2025.
