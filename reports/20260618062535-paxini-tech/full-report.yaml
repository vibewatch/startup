  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory & Legal Risks
        blocks:
          - type: paragraph
            body: >
              PaXini's regulatory risk profile is shaped by three reinforcing forces: the structural obligations of
              Chinese corporate domicile, an evolving domestic safety and standards regime, and foreign legislative
              pressure that could progressively close international markets.

              China's National Intelligence Law (Article 7, 2017) requires all Chinese companies and citizens to
              cooperate with state intelligence agencies on demand, regardless of server location, corporate structure,
              or stated privacy policy. For a company collecting rich tactile and multimodal embodied AI data across
              industrial deployments—and building large-model infrastructure from that data—this obligation creates a
              structural barrier with customers and governments that restrict foreign-intelligence-accessible systems.
              This is not an operational risk to be mitigated; it is the applicable law of PaXini's home jurisdiction.
              US federal agencies, defense contractors, and their supply chains face the most acute exposure, and
              legislative momentum is building toward formal restrictions. In March 2026, Senators Cotton and Schumer
              introduced the American Security Robotics Act (with a House companion from Representative Stefanik), which
              would bar federal agencies from Chinese humanoid robots; peer companies Unitree and AgiBot are cited by
              sponsors, and the sector context directly applies to PaXini. A companion Humanoid ROBOT Act (November
              2025) extends proposed restrictions to federal contractors. Neither bill has passed, but the legislative
              record signals durable pressure that will constrain PaXini's US government and defense-contractor market
              even before formal enactment.

              China's domestic regulatory timeline is simultaneously tightening. MIIT's October 2023 Humanoid Robot
              Innovation Development Guidance set a 2027 target for a safe, reliable, and controllable industrial chain.
              In March 2026, the Ministry released China's first national standard system for humanoid robots—developed
              by 120+ institutions—encompassing safety, ethics, lifecycle compliance, and embodied AI model data
              governance. Early movers that have embedded hardware in customer facilities before standards solidified
              face redesign risk if non-conforming components require replacement under future certification regimes.
              The MIIT guidance explicitly prioritises 3C electronics and automotive sectors as lead applications,
              precisely the domains in which PaXini's Geely deployment sits, creating regulatory scrutiny concentration.

              PaXini's own legal record contains disclosed but undescribed adverse items. Aiqicha and QCC data record
              three business disputes (经营纠纷), one formal case filing (立案信息), and one court session announcement (开庭公告).
              The nature—contractual, employment, IP, trade-secret, or customer dispute—is not publicly available.
              PaXini's US trademark filing (October 2025 per Justia) and its 135-patent, 43-software-copyright,
              192-trademark domestic portfolio suggest an active but recently assembled IP defence. IP ownership
              provenance from the Waseda University founding context has not been independently documented.
            claimRefs:
              - CR001
