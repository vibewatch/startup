  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Tactile and Force Sensing Incumbent Competitors
        blocks:
          - type: paragraph
            body: >
              Three established companies define the Western tactile/force sensing incumbent segment that PaXini most
              directly challenges at the component level: Tekscan, Pressure Profile Systems (PPS), and Nitta
              Corporation.

              Tekscan (Norwood, MA; privately held) is the category's best-known vendor for pressure mapping and
              embedded flexible force sensors. Its three core lines— Pressure and Temperature Mapping Systems, Embedded
              Flexible Force Sensors, and TactileLab custom engineering services—serve R&D engineers performing design
              validation, QC, and battery-stack testing, as well as clinicians measuring orthopedic and rehabilitation
              outcomes. Tekscan does not offer a multi-dimensional Hall-effect tactile sensor designed for
              dexterous-hand OEM integration, and its go-to-market is primarily through R&D equipment channels and
              direct sales, not robot OEM supply chains. Pricing is not publicly disclosed; system costs vary widely by
              configuration and are typically obtained via quotation.

              PPS (Pressure Profile Systems; US headquarters, UK office; privately held) offers capacitive tactile
              sensors—claiming 25+ years of experience—and its proprietary Chameleon software for pressure
              visualization. PPS serves 200+ organizations and has explicitly moved into robotics with its TactileGlove,
              Modular TactileHead, and integrated RoboTact product. PPS argues that capacitive sensing outperforms
              resistive alternatives in sensitivity, repeatability, and temperature stability. PPS has distribution
              partners across Asia and offers the RoboTact as an integrated robotics product, making it a more direct
              competitor than Tekscan. However, PPS is a small company without the full-stack embodied AI integration,
              humanoid robot body, or proprietary dataset that PaXini offers. Pricing is not publicly disclosed.

              Nitta Corporation (Osaka; TSE-listed conglomerate) is historically known for force and torque sensors in
              industrial contexts, but its US division (NCA) focuses on industrial belting, hose/couplings, pneumatic
              tubing, and RETS tool-changers for robotics—not humanoid tactile sensing. English-language product content
              from both Nitta's US and Japan English sites covers conveyor and belt products. Nitta's force/torque
              sensor relevance exists as an industrial adjacency, not as a direct competitor to PaXini's Hall-effect
              multi-dimensional tactile stack for humanoid dexterous hands.

              RoboSense (Shenzhen, China; HKEX-listed) is the sharpest single-player threat. Originally a LiDAR and
              active camera maker for automotive and robotics perception, RoboSense has announced a full-stack pivot
              that includes a multi-DOF dexterous hand, a VTLA-3D large model for long-horizon task planning, in-house
              SoC chips (RISC-V data processing, digital SPAD-SoC, 2D addressable VCSELs, MEMS), and a 48,000 m² smart
              manufacturing facility certified under ISO 26262, IATF 16949, and ASPICE CL2. If RoboSense integrates
              tactile sensing into its dexterous hand—as its full-stack framing strongly implies—it would offer
              perception, actuation, and AI in a single supplier relationship, displacing component-level tactile sensor
              vendors for RoboSense's own robotic platforms and potentially for external OEM customers.
