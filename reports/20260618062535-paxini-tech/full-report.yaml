      - number: '8.2'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: |
              The investment thesis rests on four interlocking pillars. First, PaXini occupies the
              most differentiated position in the humanoid robot supply chain: high-precision tactile
              sensing. Tactile data is the one modality that cannot be scraped from the internet, and
              PaXini's ITPU architecture and DexH13 dexterous hand have already generated tens of
              billions of real-world multimodal data points, enabling closed-loop VTLA model training
              that no competitor currently replicates at scale. Second, the investor syndicate is an
              industrial validation signal. BYD, JD.com, TCL, SAIC, BAIC, and Meta-affiliate LEO LION
              constitute a supply-chain-to-deployment continuum. These are not passive financial
              investors; they are potential deployment customers and supply-chain anchors. Third, the
              Geely Qiantang deployment — eight continuous hours with 99.8% task success in automotive
              wiring harness assembly — provides the first credible evidence that PaXini's full-stack
              approach works in a demanding industrial environment. Fourth, the humanoid robot sector is
              entering a period of critical commercialization in H2 2026 per TrendForce, with Chinese
              output expected to grow 94% year-on-year; PaXini's upstream position makes it a supplier
              to the entire sector rather than a single-robot bet.

              The anti-thesis is equally pointed. Revenue is undisclosed, meaning the $1.5B valuation
              is priced entirely on narrative and pipeline, not on demonstrated unit economics. The Geely
              deployment is a single pilot; it does not establish recurring contract revenue. Unitree and
              AgiBot will capture approximately 80% of Chinese humanoid shipments in 2026 — and both are
              pursuing their own sensor and dexterous-hand integrations, threatening to internalize what
              PaXini currently provides. Goldman Sachs's >80% tactile market share figure is not
              independently verified; any competitor with cost parity would rapidly erode this share.
              Finally, as a Chinese company, PaXini is subject to Article 7 of China's National
              Intelligence Law and the broader geopolitical risks of Chinese AI hardware — risks that
              international enterprise customers and potential IPO investors on Western exchanges must
              weigh.
