chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, business model, and product scope
        blocks:
          - type: paragraph
            body: >-
              PaXini Tech (帕西尼感知科技, English legal: PaXini Technology (Shenzhen) Co., Ltd.) was incorporated on
              2021-06-29 in Shenzhen, China. The company's registered headquarters is in the Nanshan District at Vanke
              Cloud City, West Science Street; additional offices operate in Shanghai, Tianjin, and Suqian. The phone
              and address listings on the official English and Chinese sites confirm all four cities.

              The company's stated mission is "embodied perception driving general intelligence." Its business model is
              a full vertical stack: Hall-effect multi-dimensional tactile sensors sit at the base, enabling a dexterous
              hand product line (the DexH series), which integrates into humanoid robots (the TORA platform). This
              hardware stack is supported by a proprietary data infrastructure layer—five data collection factories
              spread across North, East, Central, Southwest, and South China—that produces near-tens-of-billions of
              multimodal data points annually. PaXini uses this data to train its OmniVTLA full-modality embodied AI
              model, closing a loop from physical sensor to foundation model with no external data dependency.

              The core enabling technology is the HAPTA (Hetero-Array Probing Tactile Architecture) and its primary
              component, the ITPU (Intelligent Tactile Processing Unit). This architecture allows a single sensing unit
              to capture 15 simultaneous dimensions of tactile information including six-axis force, material texture,
              temperature, and elastic response at 1000 Hz with 0.01 N full-range resolution. The PX-series sensors span
              three product series and 12 models, and the company asserts global leadership in 6D Hall-effect sensor
              shipment volumes.

              The DexH13 GEN2 dexterous hand—the latest commercially available unit—embeds 1,140 ITPU units across 13
              degrees of freedom, 4 fingers, and a 5 kg load capacity with a 15 cm maximum grasp diameter. It carries an
              800-megapixel AI hand-eye camera for "tactile + vision" dual-modal perception, which the company claims is
              an industry first. The TORA-ONE humanoid robot integrates 47 degrees of freedom, 1,956 tactile sensor
              channels, five monocular cameras, two depth cameras, LiDAR, and laser SLAM.

              Products are deployed across precision manufacturing, automotive production lines, logistics, healthcare,
              and consumer electronics. PaXini publicly names BYD and JD.com as strategic deployment partners. The
              company also participated in CES 2026 in January 2026, where it demonstrated ice-cream preparation by
              TORA-ONE in the ENTERPRISE AI Zone, drawing media attention and validating commercial readiness.

              Beyond hardware, PaXini launched—in collaboration with JD Cloud, Tencent Cloud, and Baidu AI Cloud— the
              world's first large-scale multimodal embodied intelligence data cloud mall, providing standardized data
              products to the broader industry. The HyperCosmos world model is described by the company as under active
              R&D, co-funded by the Series B round.
