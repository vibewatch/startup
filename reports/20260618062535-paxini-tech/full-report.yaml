  - id: FE002
    title: Customer Workflow — Tactile-Enabled Robot Operation Flow
    type: flow
    layout: standard
    summary: >-
      The end-to-end workflow for a PaXini-powered robot progresses from task instruction through multimodal perception,
      AI inference, motion planning, physical execution, and closed-loop tactile feedback.
    data:
      nodes:
        - id: n1
          label: 1. Task Instruction
          description: >-
            Human operator or higher-level AI system issues task goal (e.g., grasp object, assemble component, pour
            liquid). Voice, GUI, or programmatic interface.
        - id: n2
          label: 2. Multimodal Perception
          description: >-
            800MP camera detects object pose (zero-shot estimation); 1,140 ITPU tactile sensors acquire pre-contact
            surface data; LiDAR + SLAM provide scene map (TORA-ONE).
        - id: n3
          label: 3. OmniVTLA AI Inference
          description: >-
            Visual (V), Tactile (T), Language (L), and Action (A) inputs fused by proprietary OmniVTLA multimodal model
            to generate action policy. Model trained on PaXini 200M-entry dataset.
        - id: n4
          label: 4. Force-Controlled Motion Planning
          description: >-
            Trajectory and force profile computed; PX6D/PXTS 6D F/T sensor at wrist provides real-time whole-body force
            state for compliant motion planning.
        - id: n5
          label: 5. Physical Execution
          description: >-
            DexH13 or DexH5 hand executes grasp/manipulation. Hollow-cup motors drive 13 DOF; 5kg payload capacity. ITPU
            tactile feedback provides in-hand contact state continuously.
        - id: n6
          label: 6. Tactile Feedback Loop
          description: >-
            Real-time 1,000Hz tactile readback detects slip, deformation, and contact geometry. Feedback adjusts grip
            force and trajectory in milliseconds. Loop repeats until task complete.
      edges:
        - from: n1
          to: n2
          label: goal signal
        - from: n2
          to: n3
          label: sensor data (V+T+L)
        - from: n3
          to: n4
          label: action policy
        - from: n4
          to: n5
          label: joint commands
        - from: n5
          to: n6
          label: in-hand tactile state
        - from: n6
          to: n4
          label: force correction
    claimRefs:
      - CE006
      - CE007
      - CE015
      - CE017
      - CE032
