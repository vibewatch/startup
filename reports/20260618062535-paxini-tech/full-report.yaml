      - number: '5.7'
        title: Differentiation, IP, Supply Chain, and Trust/Safety/Quality
        blocks:
          - type: paragraph
            body: |
              PaXini's claimed differentiation rests on four interlocking advantages: (1) proprietary Hall-effect
              HAPTA/ITPU sensing technology that the company states breaks through "import reliance" in high-end
              tactile sensors for Chinese robotics; (2) the founding team's academic pedigree from the Sugano
              Laboratory at Waseda University, which built the world's first humanoid robot; (3) a closed-loop
              data flywheel—the only company globally, per its own and EqualOcean's characterization, that
              integrates large-scale tactile modality data into full-modal embodied datasets for training; and
              (4) the full-stack product matrix from sensor to robot to AI model.

              Intellectual property: PaXini's Chinese business registry records show 135 patents, 43 software
              copyrights, and 192 registered trademarks. A USPTO trademark filing for PAXINI (Serial No. 99442343)
              was submitted in October 2025, covering categories including robotic lawn mowers and beverage
              processing machines. The patent portfolio is not individually enumerated in public sources and the
              mix of utility patents, utility-model patents, and design patents is not specified.

              Supply chain: PaXini manufactures products from its Shenzhen headquarters with additional offices
              in Shanghai, Tianjin, and Suqian. Specific component suppliers for Hall-effect magnetic elements,
              hollow-cup motors (used in DexH13 joints), custom PCB/ASIC chips, and structural materials are
              not publicly disclosed. This represents a material diligence gap for assessing single-source risk
              and supply continuity.

              Trust and safety: Published safety specs include IP65 and UL94 V-0 (sensor), chip-level anti-
              magnetic immunity, and 200%/300% safe/shock overload ratings. The Chinese business registry
              (AiQiCha) records 3 business disputes, 1 filing record, and 1 court announcement for PaXini
              Technology (Shenzhen) Co., Ltd.; the nature and materiality of these proceedings are not
              publicly detailed.
            claimRefs:
              - CE045
              - CE046
              - CE047
              - CE048
              - CE049
              - CE050
      - number: '5.8'
        title: Exhibits
        blocks:
          - type: callout
            title: Proprietary Full-Stack Tactile Ecosystem Is Structurally Differentiated
            body: >-
              PaXini is the only publicly identified company combining Hall-effect ITPU sensors, dual-modal (tactile +
              vision) dexterous hands, whole-body humanoid robots, a proprietary multimodal AI model, and a large-scale
              real-world tactile data collection and distribution infrastructure under one corporate roof. This vertical
              integration creates switching costs at each layer and, if the data flywheel operates as described, could
              compound as more robot deployments generate proprietary data.
            calloutType: strength
            claimRefs:
              - CE001
              - CE038
              - CE039
          - type: callout
            title: All Performance Claims Remain Company-Claimed; No Third-Party Hardware Certification Identified
            body: >-
              Despite a detailed specification sheet, no independent calibration laboratory, ISO/IEC accredited test
              body, or named certification authority has publicly verified PaXini's core sensor or hand performance
              claims (IP65, UL94 V-0, 0.01N resolution, 10M cycle life, ±0.05mm arm accuracy). The academic simulation
              results (84%/80%) do not extend to real-robot deployments. Industrial buyers will typically require
              third-party qualification before high-volume production integration.
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
              - CE010
              - CE033
              - CE034
          - type: callout
            title: Component Supply Chain Is Opaque
            body: >-
              PaXini does not publicly disclose its suppliers for Hall-effect magnetic elements, hollow-cup motors (used
              in DexH13 joints), custom ASICs/PCBs, or structural materials. For a hardware company at this product
              scale, single-source or China-concentrated supply risks are common; the absence of any public disclosure
              makes independent assessment impossible. This is a material diligence gap, particularly given US-China
              trade controls affecting semiconductor and advanced sensor components.
            calloutType: risk
            claimRefs:
              - CE046
          - type: callout
            title: OmniSharing DB Cloud Data Mall Is a Potential Platform Wedge
            body: >-
              The March 2026 launch of OmniSharing DB with JD Cloud, Tencent Cloud, and Baidu AI Cloud is structurally
              similar to data-infrastructure plays in other verticals: PaXini captures the data via its physical sensing
              products, cleans and packages it, and distributes it to AI developers who cannot source real-world tactile
              data elsewhere. If the data quality and format compatibility claims prove out, this could create
              significant switching costs for AI research labs and humanoid robot companies building on PaXini data.
            calloutType: insight
            claimRefs:
              - CE031
              - CE033
              - CE037
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation
        blocks:
          - type: paragraph
            body: >-
              PaXini addresses six identifiable buyer segments across its product stack. First, humanoid and embodied-AI
              robot makers integrate PaXini's ITPU sensors, DexH13/DexH5 dexterous hands, or full robot platforms into
              their own systems; Figure AI is mentioned in Chinese investment media as an international preferred
              partner, though no contract has been confirmed. Second, automotive OEMs—primarily BYD, Geely, SAIC, and
              BAIC, all also equity investors—deploy TORA-ONE humanoid robots on production lines for precision tasks
              such as wiring-harness assembly. Third, industrial manufacturing integrators in 3C electronics and
              precision assembly use PaXini's force-torque sensors for automation tasks where sensor entry prices start
              as low as CNY 199 (~USD 27). Fourth, cloud and data platforms—JD Cloud, Tencent Cloud, and Baidu AI
              Cloud—act as infrastructure partners and data-monetization channels for the OmniSharing DB data mall.
              Fifth, academic and research institutions such as SJTU and Zhejiang University purchase sensors and data
              for embodied-AI model development. Sixth, healthcare, elderly-care, and commercial service operators are
              targeted by TORA-ONE's mobility and dexterity capabilities, though no named healthcare deployment has been
              announced. PaXini's investor roster—BYD, JD.com, SAIC, BAIC, TCL, LEO LION (Meta affiliate)—also serves as
              a proxy for the target customer base, since most investors have disclosed deployment plans or strategic
              alignment. Geographic coverage remains overwhelmingly China-domestic, with offices in Shenzhen, Shanghai,
              Tianjin, and Suqian, though the international storefront and AIFITLAB distributor channel provide a global
              entry point for developer and researcher buyers at the sensor level.
