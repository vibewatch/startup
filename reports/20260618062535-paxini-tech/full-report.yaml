            body: >-
              The company's funding trajectory—nine rounds in under three years, with escalating round sizes—signals
              structural reliance on external capital. The next major capital event is a planned Hong Kong IPO. If
              market conditions deteriorate or the IPO is delayed, the company will require an additional private round;
              the Series B proceeds' burn rate is unknown, making the timing of that risk unknowable from public data.
