      - number: '5.2'
        title: ITPU/HAPTA Tactile Architecture and Sensor Specifications
        blocks:
          - type: paragraph
            body: |
              PaXini's core sensing technology is built on Hall-effect multi-dimensional sensing physics, in which
              an array of Hall-effect magnetic sensing elements converts applied force into measurable voltage
              changes across multiple spatial directions simultaneously. This physical layer is organized within
              the HAPTA (Hetero-Array Probing Tactile Architecture), a heterogeneous multi-array software and
              hardware architecture that integrates ITPU sensing units with onboard tactile algorithms to enable
              millisecond-level signal processing. The ITPU (Intelligent Tactile Processing Unit) is the discrete
              functional sensing block embedded in all PaXini products.

              The production sensor, the PX-6AX-GEN3 series, spans three sub-series and 12 models and measures
              15 sensing dimensions simultaneously including six-axis force (Fx, Fy, Fz, Tx, Ty, Tz), material
              texture, and elastic response. Per company-published specifications corroborated by a third-party
              product listing, the ITPU array supports up to 121 force signals per array, a normal force range of
              0–25 N and tangential range of ±10 N, minimum recognition force of 0.01 N, spatial resolution of
              0.1 mm, sampling rate of 1 MHz (maximum output frequency 1,000 Hz), and repeatability of <0.5%FS.
              Environmental ratings include IP65, UL94 V-0 flame retardant certification, 200% safe overload,
              300% shock overload, chip-level stray magnetic field immunity, and service life exceeding 10 million
              cycles. The entry-level sensor lists from US$49, which PaXini positions as a cost reduction for
              the embodied AI developer market.

              The PX6D/PXTS is described by PaXini as the world's first commercial Hall-effect 6D force/torque
              sensor for embodied AI, targeting wrist and joint force control on robot arms. It combines extreme
              lightweight design with on-sensor intelligence for disruptive cost-performance in whole-body force
              perception. This claim has not been independently verified by a third-party reviewer as of the
              run date.
