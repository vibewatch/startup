      - number: '1.4'
        title: Milestone chronology and adverse context
        blocks:
          - type: paragraph
            body: >-
              PaXini's public record provides a clear chronology from founding through its Series B. The company
              incorporated on 2021-06-29 and released its first ITPU-based tactile sensors and DexH dexterous hand
              products within its first two years. The Pre-A round (2022-12-29) provided initial institutional capital.
              The TORA-ONE humanoid robot launched in 2024, integrating the ITPU tactile ecosystem with a full-body
              robot platform. A Tianjin embodied intelligence data center opened in 2024–2025, and by August 2025, the
              JD-led Series A brought total capital raised to CNY 1 billion. The US trademark "PAXINI" was filed with
              Justia on October 14, 2025, signaling a move toward international branding. CES 2026 (January 6–9, 2026)
              provided the first major international stage for the full product portfolio. The Series B closed on
              2026-03-06.

              Adverse signals require explicit treatment. Aiqicha's company record as of 2026 shows three business
              operating disputes (经营纠纷), one formal lawsuit filing (立案信息), and one court hearing announcement (开庭公告)
              against PaXini. These are not immaterial: a court filing and hearing announcement suggest at least one
              active litigation proceeding. The nature, counterparty, and dollar exposure of these disputes are not
              disclosed in public filings; direct inquiry with PaXini's legal team is the appropriate diligence path.

              Two additional adverse signals are traceable from data quality alone. Tracxn reports only 13 employees for
              PaXini, which directly contradicts the 315 insured employees recorded in Aiqicha's social insurance
              database. Tracxn's count is almost certainly a LinkedIn-scrape artifact rather than an accurate payroll
              figure; nonetheless the discrepancy highlights the risk of relying on any single-source headcount proxy.
              PaXini has not published official headcount figures.

              Commercialization opacity is a structural gap: despite extensive product coverage and strategic investor
              involvement from BYD and JD.com, PaXini has disclosed no revenue figure, gross margin, or customer-count
              data to public sources. Claims of "scale deployment" at automotive production lines and logistics
              operations are company-sourced and unverified by customer disclosures. Aiqicha classifies PaXini as a 2025
              Gazelle Enterprise (瞪羚企业) and Science and Technology SME, suggesting it is recognized as a high-growth
              early-stage company but not yet at mature scale.
