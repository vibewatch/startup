              PaXini has not publicly disclosed net revenue retention, gross retention, churn rates, contract lengths,
              repeat purchase rates, or cohort-level customer satisfaction data. The business model spans one-time
              hardware sales—sensors at CNY 199–thousands and TORA-ONE at USD 50,000–150,000 per unit—and potentially
              recurring data subscription revenue via OmniSharing DB, but the data mall's subscriber count and pricing
              terms are not disclosed, making durability assessment speculative. The structural retention driver is
              ecosystem lock-in: customers integrating PaXini's ITPU tactile hardware are dependent on compatible
              dexterous hand models and, ultimately, the OmniVTLA training pipeline, creating an incentive to deepen the
              relationship over time. Investor-customers such as BYD and JD create long-term strategic alignment but
              make independent retention measurement difficult because these relationships blend equity interest with
              commercial obligation. PaXini maintains four China offices (Shenzhen, Shanghai, Tianjin, Suqian)
              indicating domestic geographic expansion; international reach is nascent, with AIFITLAB as a confirmed
              third-party global distributor. Korean technology conglomerates are mentioned as international partners in
              Chinese investment media, but no named Korean entity or revenue has been confirmed. The company's 315
              insured employees per the QCC Chinese business registry suggests a lean workforce relative to its RMB 10
              billion valuation, which may constrain its ability to service a rapidly expanding enterprise customer base
