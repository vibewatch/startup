      - number: '2.3'
        title: Buyer Segmentation and Adoption Path
        blocks:
          - type: paragraph
            body: >
              PaXini's buyer landscape has two structural layers. The first layer is direct commercial customers:
              manufacturing firms, logistics operators, and healthcare systems that purchase PaXini's sensors, hands, or
              robots for their own operations. The second—and currently more material—layer is humanoid robot OEM
              customers: platform builders like Unitree, AgiBot, and Figure that embed PaXini's sensors and hands into
              their robots and create derived demand. In the OEM channel, the budget owner is the VP of Engineering or
              CTO, the evaluation criterion is sensing performance (accuracy, repeatability, latency), and the
              contracting mode is typically a co-development agreement progressing to a volume supply arrangement. In
              manufacturing verticals, the adoption trigger is economic: rising Chinese labor costs, yield requirements
              on precision assembly lines (automotive body panels, 3C electronics), and government-mandated automation
              targets. BYD's investment and customer relationship is the strongest commercial validation available
              publicly, though the terms and volume are not disclosed. JD.com's logistics deployment validates the
              warehousing use case, though humanoid robots in that context are still largely at pilot stage
              industry-wide. Healthcare is the slowest-moving segment: regulatory compliance, liability, and clinical
              validation requirements extend the sales cycle materially, and few humanoid-grade tactile sensing
              deployments exist outside R&D settings. Service robotics and retail represent future optionality rather
              than a 2026 addressable market for PaXini's current price points. The embodied AI data infrastructure
              segment (OmniSharing DB) adds a software-like recurring revenue dimension but lacks publicly comparable
              pricing or adoption benchmarks; the data mall with JD Cloud, Tencent Cloud, and Baidu AI Cloud is early
              stage.
