      - number: '5.3'
        title: Dexterous Hand Platform — DexH5 and DexH13
        blocks:
          - type: paragraph
            body: |
              PaXini produces two commercially available dexterous hand models that embed ITPU sensing directly
              into the finger structure.

              The DexH5 (GEN1) is a four-finger, nine-degrees-of-freedom hand with integrated multi-dimensional
              tactile sensors targeting service robots, research platforms, and light industrial applications.
              It provides 4 kg payload and uses lightweight high-strength composite materials. A modular wrist
              interface enables attachment to various robotic arm platforms. The DexH5 represents PaXini's
              earlier generation, and public specification documentation is limited relative to the newer GEN2.

              The DexH13 (GEN2) is the current flagship dexterous hand. Its key architecture is the combination
              of 1,140 ITPU GEN2 tactile processing units (GEN2 generation) generating 3,420 signal channels
              across four fingers and 13 degrees of freedom, coupled with an 800-megapixel AI camera using
              zero-shot pose estimation for object recognition without prior training on that object. The
              company-claimed specs include 15 N fingertip force, 5 kg payload capacity, 15 cm maximum grasp
              diameter, and under 1.0 s minimum open-close cycle time. For industrial reliability, the DexH13
              is rated at more than 1 million press cycles. PaXini describes DexH13 as the industry's first
              dual-modal dexterous hand combining multidimensional tactile sensing and AI vision. Integration
              is enabled through standard EtherCAT and Modbus industrial communication protocols. At CES 2026,
              DexH13 demonstrated stable grasping of irregular objects including test tubes and cubes, and
              performed delicate knob-turning tasks; independent assessors noted the demonstration but did not
              publish controlled benchmark results.
