      - number: '7.3'
        title: Partner, Dependency & Supply Chain Risks
        blocks:
          - type: paragraph
            body: >
              PaXini's strategic architecture creates dangerously concentrated single-counterparty dependencies across
              its investor, customer, and commercial-validation dimensions simultaneously. BYD made a strategic
              investment in April 2025—described as BYD's largest single robotics investment and its first major
              embodied intelligence commitment—and is simultaneously a target customer for industrial automation. JD.com
              invested through its JoyGen vehicle in Series A III (August 2025) and is a probable commercial reference
              account. Both investors hold dual roles as capital providers and potential customers, meaning any
              deterioration in those commercial relationships—from competitive product launches, technology pivots, or
              geopolitical factors—would impair both PaXini's capital base and its customer proof simultaneously.

              Commercial concentration is acute. The Geely Qiantang deployment, announced May 2026, is the only
              confirmed full-production-grade reference. A single-site, single-customer proof point underpins the entire
              industrial deployment narrative at the time of the planned IPO filing. Failure to extend to additional
              independent production deployments before the HK IPO would leave incoming public-market investors
              underwriting one manufacturing facility as the commercial evidence base at a greater than RMB 10B
              valuation.

              Supply-chain opacity is a structural gap. PaXini's Hall-effect sensing chip design and ITPU (Intelligent
              Tactile Processing Unit) technology rely on component manufacturing that is not publicly disclosed. The
              company describes its sensor cost structure as disruptive— reducing multi-dimensional tactile sensor unit
              prices to as low as RMB 199—but the underlying component sourcing, margin, and supplier concentration are
              unknown. Competitor RoboSense has launched a competing full-stack embodied intelligence platform including
              dexterous hands and IATF 16949- and ISO 26262-certified manufacturing operations, increasing competitive
              pressure on PaXini's supply-chain advantage. TrendForce projects Unitree and AgiBot will together capture
              nearly 80% of Chinese humanoid robot shipments in 2026, compressing the market available to
              component-layer and full-stack humanoid suppliers. The cap table's 50-plus shareholder entities across
              38-plus investors also present governance complexity, with liquidation preferences and anti-dilution terms
              undisclosed.
