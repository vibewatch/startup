  - id: embodied-ai-humanoid-competitors
    title: Embodied AI, Dexterous Hand, and Humanoid Robot Competitors
    body: >
      The embodied AI and humanoid robot segment is PaXini's largest addressable OEM
      customer pool and its most dynamic competitive threat vector. The same OEMs that
      buy PaXini's tactile sensors and dexterous hands could decide to build sensing
      in-house as they scale to tens of thousands of units annually.

      Unitree Robotics (Hangzhou; Series C; IPO approved June 2026) leads the Chinese
      humanoid market by revenue and public profile. The G1 base model is listed at USD
      13,500 (excluding tax/shipping); the H1 and H1-2 are larger full-size platforms
      with optional dexterous hands (Dex3-1 or Dex5-1) and optional tactile sensor
      arrays. Unitree's 2025 revenue reached 1.699 billion yuan (from 159 million yuan
      in 2023), with humanoid robots exceeding 51% of revenue and combined gross margins
      of 60.13%—unusually high for robotics hardware. The STAR Market IPO approval on
      June 1, 2026 (first "embodied AI" company on China's A-share market) validates
      Unitree's financial profile and signals plans to expand capacity to 75,000 humanoid
      and 115,000 quadruped robots annually, requiring massive dexterous-hand and sensor
      procurement that currently flows through third-party suppliers including PaXini.

      AGIBOT (Shanghai; 2023; Series B; ~$83.8M raised per Tracxn) produced its 10,000th
      humanoid robot (Expedition A3) on March 30, 2026, with production accelerating from
      1,000 to 5,000 to 10,000 units in approximately three months. Omdia ranked AGIBOT
      first globally in humanoid robot shipments for 2025. TrendForce projects Unitree
      and AGIBOT together will capture ~80% of Chinese humanoid shipments in 2026 as
      output grows 94% year-on-year. AGIBOT has also released AGIBOT World, a
      large-scale enterprise-quality realistic task dataset and ecosystem for embodied AI,
      signaling vertical integration ambitions that could extend to sensor sourcing.
      Deployments span automotive manufacturing, consumer electronics, logistics, and
      international markets (Europe, Asia, Middle East).

      UBTech Robotics (Shenzhen; HKEX-listed) targets humanoid service robots for
      elderly care, AI education, and consumer-grade smart hardware, with its Walker robot
      as the flagship humanoid platform. As a public company, UBTech is more transparent
      than most Chinese humanoid peers. UBTech's service focus makes high-fidelity tactile
      sensing potentially differentiating, but its product pages provide limited technical
      specification for tactile integration.

      Figure AI (San Jose, CA; Series C; >$1.9B raised; $39B post-money valuation) is
      the most funded pure-play Western humanoid company. Its Figure 03 is designed for
      everyday home environments, powered by the Helix AI system. Figure validated
      sustained commercial deployment with BMW Group Plant Spartanburg (1,250+ runtime
      hours, 90,000+ parts, 30,000+ vehicles). The BotQ factory produces one robot every
      90 minutes as of early 2026. Figure represents the leading Western benchmark for
      AI-driven dexterous manipulation in real manufacturing environments.

      Fourier Intelligence (Shanghai; Series B) develops humanoid robots for
      rehabilitation and industrial applications through its GR series. However, its
      official website was inaccessible (SSL certificate error) during this research run,
      limiting primary-source analysis.

      LimX Dynamics (Shenzhen; 2022; Series B; $296M raised per Tracxn) is developing
      embodied intelligent robotics and an agentic operating system. Commercial deployment
      details and customer announcements are limited in publicly available English-language
      sources as of June 2026.
