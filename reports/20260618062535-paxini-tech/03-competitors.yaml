  - id: gtm-pricing-distribution
    title: GTM, Pricing, Distribution, and Switching Costs
    body: >
      Go-to-market approaches diverge sharply by company class. Western incumbents
      (Tekscan, PPS) sell through direct sales and R&D equipment channels; their typical
      buyer is an engineer, researcher, or clinician—not a robot OEM procurement team.
      PaXini has repositioned for OEM and platform integrator supply, with direct
      relationships at JD (logistics robotics) and BYD (automotive), consistent with
      a B2B sensor-to-OEM model that scales with robot volumes.

      Pricing transparency is low across the category. Among publicly confirmed data
      points: the Unitree G1 base model is USD 13,500 (official product page). PaXini's
      DexH5 is listed at approximately USD 2,000 and the DexH13 at approximately USD
      17,200 on third-party product directories. 1X Technologies' NEO home robot is
      priced at USD 20,000 or USD 499/month (subscription). Tekscan, PPS, Nitta,
      RoboSense, AGIBOT, UBTech, Fourier, and Figure AI do not publicly disclose product
      pricing beyond configuration-specific quotes or partner discussions.

      Switching costs for tactile sensors embedded in a dexterous hand are non-trivial.
      The ITPU interface, communication protocols (EtherCAT, Modbus), and firmware
      integration require meaningful engineering effort to migrate to an alternative sensor
      vendor. PaXini's full-stack SDK support (sensor → hand → AI model → deployment)
      increases stickiness once integrated. However, modular humanoid robot designs—where
      arms and hands are intended for replacement—facilitate multi-homing or vendor
      switching. Tekscan's thin, flexible sensor formats can be retrofitted without
      redesigning an entire hand structure.

      Distribution breadth varies significantly. Unitree sells globally via direct
      e-commerce and distributors, with the G1 publicly available. AGIBOT has announced
      partnerships in Europe (Germany's Minth Group), Singapore (Singtel Enterprise),
      Asia, and the Middle East. Figure AI benefits from strategic investors (NVIDIA,
      Macquarie, Intel Capital) that also act as distribution and channel partners.
      PaXini's distribution is primarily direct-to-OEM in China, with CES 2026 marking
      its first major Western exhibition. Western non-federal OEM partnerships beyond
      JD and BYD are not documented in independent sources reviewed for this chapter.
