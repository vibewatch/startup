callouts:
  - calloutType: risk
    title: OEM Vertical Integration Is the Primary Moat Threat
    body: >
      PaXini's most concentrated risk is Unitree and AGIBOT deciding to build or
      acquire tactile sensing in-house. With Unitree targeting 75,000 humanoids
      annually and AGIBOT at 10,000 units in three months of ramp, the unit economics
      for proprietary sensing shift materially. A post-IPO acquisition of a tactile
      sensor startup by Unitree would be a binary adverse event for PaXini's revenue
      base. Diligence must confirm contractual exclusivity and whether Unitree's IPO
      prospectus discloses sensor sourcing terms.
    claimRefs:
      - CP014
      - CP015
      - CP016

  - calloutType: risk
    title: China National Intelligence Law Creates Structural Western Distribution Barrier
    body: >
      Both PaXini and its largest OEM customers (Unitree, AGIBOT) are Chinese entities
      subject to Article 7 of China's National Intelligence Law (2017), requiring
      cooperation with state intelligence agencies regardless of data storage location
      or Western subsidiary structure. The American Security Robotics Act (March 2026)
      names Unitree and AGIBOT specifically. Even if PaXini is not named in legislation,
      selling sensors and dexterous hands that are embedded into legally restricted robot
      platforms limits PaXini's Western federal market and creates headline risk for
      enterprise buyers. This cannot be resolved by privacy policy or server location.
    claimRefs:
      - CP030
      - CP036

  - calloutType: insight
    title: RoboSense Is the Competitor to Watch — Not Traditional Sensor Incumbents
    body: >
      Tekscan and PPS are formidable in their R&D/clinical niches but are not targeting
      the humanoid OEM supply chain. The competitor most likely to displace PaXini in
      its core market is RoboSense: a HKEX-listed company with ISO 26262-grade
      manufacturing, proprietary SoC chips, a multi-DOF dexterous hand in development,
      and a VTLA-3D large model for embodied AI. RoboSense's missing piece is tactile
      sensing—but its chip and hardware competency makes closing that gap technically
      feasible. PaXini's best defense is deepening OEM integration and demonstrating
      that its OmniVTLA model cannot be replicated without the proprietary tactile
      dataset behind it.
    claimRefs:
      - CP007
      - CP008
      - CP027
      - CP028

