  - id: capability-comparison
    title: Feature and Capability Comparison
    body: >
      PaXini differentiates through the depth and integration of its tactile sensing
      stack rather than the breadth of its robot body portfolio. The critical comparison
      axes are: (a) multi-dimensional sensing quality, (b) dexterous hand design, (c)
      humanoid body completeness, (d) proprietary AI model and real-world data platform,
      and (e) commercial deployment evidence.

      On tactile sensing quality, PaXini's ITPU (Intelligent Tactile Processing Unit)
      technology is purpose-built for multi-axis force, texture, and elastic response
      measurement. The DexH13 integrates 1,140 ITPU units across 4 fingers and 13 DOF,
      with 5 kg load capacity, 1 mm press positioning accuracy, and an 800MP AI camera
      for dual-modal visual-tactile perception. The DexH5 entry-level hand offers 9 DOF,
      4 kg load capacity, and is listed at approximately USD 2,000 on humanoid.guide.
      The DexH13 is listed at approximately USD 17,200. By comparison, Tekscan and PPS
      offer richer per-unit sensing data in controlled R&D settings but do not deliver
      integrated dexterous hands, AI inference, or humanoid robot bodies.

      On AI integration, PaXini's OmniVTLA multimodal large model and the accompanying
      omni-modality data collection infrastructure (near 200 million data points annually
      from five regional factories) create a closed-loop training pipeline that is
      structurally difficult to replicate. RoboSense is the only competitor actively
      building a comparable full-stack AI pipeline (its VTLA-3D model with long-horizon
      planning for 10+ sequential actions), but RoboSense's starting point is
      LiDAR/visual perception rather than tactile sensing.

      On commercial deployment, PaXini's CES 2026 demonstration—TORA-ONE performing
      autonomous ice-cream making including lever manipulation, ingredient handling, and
      cup handover—and supply relationships with JD and BYD provide verifiable deployment
      proof. The PX-6AX-GEN3 sensor covers 3 product series and 12 models with <0.5%
      full-scale repeatability across 15 sensing dimensions. Vision-only manipulation
      approaches (LLM-guided grasping without haptic feedback) represent an active
      substitute, but lack the precise force control for delicate or deformable object
      handling that tactile sensing enables. Traditional strain-gauge and load-cell sensors
      (incumbents: Honeywell, Kistler, ATI/Bosch) remain status-quo for industrial robotic
      force measurement but do not address multi-axis dexterous-hand manipulation.
