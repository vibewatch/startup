figures:
  - id: FP001
    title: Competitive Positioning Map — Tactile Sensing Depth vs. Embodied AI Integration
    type: quadrant
    layout: wide
    summary: >
      Competitors plotted on ordinal axes (0–10) for tactile sensing depth (y) and
      embodied AI / full-stack integration breadth (x). PaXini occupies the high-tactile,
      high-integration quadrant; sensor incumbents (Tekscan, PPS) show deep sensing but
      no robot integration; humanoid OEMs (Unitree, AGIBOT, Figure) have high integration
      but limited native tactile depth. RoboSense is the only competitor with trajectory
