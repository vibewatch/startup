  - id: constraints-gaps
    title: Adoption Constraints and Sizing Uncertainty
    body: >
      Several material constraints limit near-term market realization. Most
      significantly, approximately 68% of the high-end tactile sensor market is
      dominated by established foreign incumbents—Tekscan (US), Nitta (Japan),
      and PPS (US)—who have decades of manufacturing know-how, integration
      histories, and customer relationships in medical and industrial segments.
      PaXini's claimed 12% domestic market share in high-end tactile sensors (per
      Sina Finance) leaves substantial foreign incumbent presence, and displacement
      in premium segments typically requires multi-year qualification cycles.
      The pilot-to-production gap is the second major constraint. As of mid-2026,
      most humanoid robot manufacturers are in trial or early deployment phases.
      TrendForce projects 94% output growth in 2026, but the base is small;
      Unitree and AgiBot together are expected to account for ~80% of global
      shipments, indicating a highly concentrated buyer base for PaXini's OEM
      channel. The unit economics of the DexH13 hand (~$17,200) and TORA-ONE
      platform ($50,000–$150,000) constrain adoption to capitalized OEM partners
      and premium industrial applications; broad consumer or SME adoption is
      several years away at current price points.
      Integration complexity is a persistent constraint: each OEM deployment
      requires deep co-development to integrate PaXini's sensors into robot
      control stacks, and PaXini's headcount limits how many simultaneous
      integration projects it can support. Finally, the market sizing from
      analyst firms reflects methodological divergences—GGII's $875 M vs.
      MarketsandMarkets' $2.92 B for the same 2025 global humanoid market—that
      should prompt investors to conduct bottom-up sizing using actual unit volume
      data rather than relying on top-line report figures.
    claimRefs:
      - CM036
      - CM037
      - CM038
      - CM039
      - CM040

