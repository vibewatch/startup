  - id: growth-drivers
    title: Growth Drivers and Policy Tailwinds
    body: >
      Three structural forces are accelerating market growth for PaXini's stack.
      First, Chinese government policy provides an unusually dense set of demand
      levers. The 17-ministry "Robot+" Action Plan (January 2023) set explicit
      targets of 100+ new robot application technologies and 200+ typical scenarios.
      MIIT's Humanoid Robot Guidance (October 2023) elevated humanoid robotics to
      a key frontier priority, directing provincial and municipal governments to
      include embodied AI in industrial upgrading plans. The March 2026 national
      standard system for humanoid robots—six lifecycle components, developed by
      120+ institutions under MIIT—provides compliance clarity that could accelerate
      procurement in government-adjacent sectors (state-owned manufacturers, public
      logistics). China's 2025 designation as the first year of mass production,
      with 140+ domestic manufacturers and 330+ models, confirms the ecosystem
      is crossing the diffusion threshold.
      Second, investment flows are self-reinforcing. Global robotics startups raised
      $13.8 B in 2025, up 77% from $7.8 B in 2024. Humanoid robot funding alone
      reached a record $1.2 B in 2024 and was projected to double to $2.3 B in 2025.
      This capital funds OEM customers who are then able to afford higher-quality
      sensor components. PaXini itself has attracted 14 global industrial investors
      spanning BYD, JD.com, SAIC, BAIC, and TCL, spanning the automotive,
      logistics, consumer electronics, and manufacturing supply chains.
      Third, the AI/LLM integration wave increases the marginal value of rich
      tactile data. General-purpose humanoid robots need to perform diverse tasks
      without scene-specific programming; tactile feedback from sensors is critical
      for safely grasping irregular objects, detecting slip, and adapting grip
      force in real time. The convergence of LLMs, embodied AI models (VLA
      architectures), and dexterous manipulation is creating a market for precisely
      the full-stack infrastructure PaXini provides.
    claimRefs:
