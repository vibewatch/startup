callouts:
  - calloutType: risk
    title: Analyst Market Sizing Divergence is Material
    body: >
      The two Goldman Sachs estimates for the 2035 humanoid robot market ($38 B vs.
      $154 B) and the 3× gap between GGII and MarketsandMarkets for the 2025 market
      are not minor rounding differences—they reflect fundamentally different scope
      definitions. Investors using headline TAM numbers from any single report risk
      systematically over- or under-sizing PaXini's opportunity.
    claimRefs:
      - CM015
      - CM020

  - calloutType: insight
    title: OEM Channel Is the Dominant Near-Term Revenue Path
    body: >
      Humanoid robot OEMs (Unitree, AgiBot, and their peers) are the highest-priority
      buyer segment: they aggregate demand across verticals, scale component procurement
      with robot shipments, and create indirect market development across manufacturing,
      logistics, and healthcare. PaXini's Series B investor roster (BYD, JD.com, SAIC,
      BAIC) suggests these corporate backers double as channel and co-development
      partners, reducing early sales cycle friction.
    claimRefs:
      - CM024
      - CM034

  - calloutType: assumption
    title: China Policy Intensity Is Unusually High but Execution Risk Remains
    body: >
      No other major economy has directed seventeen ministries to co-author a robot
      application plan. The breadth of China's policy signals—from the 2023 Robot+
      plan to the March 2026 national standard system—is historically rare and creates
      a procurement tailwind not easily replicated outside China. The diligence ask is
      whether policy intention translates to actual funded procurement programs at the
      speed the headline CAGR forecasts imply.
    claimRefs:
      - CM029
      - CM030
      - CM031

