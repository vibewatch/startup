company:
  name: PaXini Tech

chapter:
  number: 2
  title: Market Analysis
  summary: >
    PaXini Tech operates at the intersection of four distinct but interdependent
    addressable markets: robotics-grade tactile sensors, six-axis force/torque
    sensors, dexterous hands for humanoid robots, and embodied AI data infrastructure.
    Global humanoid robot market estimates span $2.92 B–$15.26 B by 2030 (MarketsandMarkets)
    to $38 B–$154 B by 2035 (two conflicting Goldman Sachs projections), reflecting
    genuine methodological divergence rather than a settled consensus. China is the
    dominant near-term demand driver, accounting for 54% of global industrial robot
    deployments in 2024 and hosting 140+ humanoid manufacturers in what MIIT calls
    the industry's first year of mass production in 2025. BYD, JD.com, SAIC, and
    BAIC serve dual roles as strategic investors and anchor customers, anchoring
    PaXini's commercial foothold; however, 68% of the high-end tactile sensor market
    remains foreign-controlled, the pilot-to-production gap is real, and TAM-level
    sizing must be treated with caution given contradictory analyst methodologies.

sections:
  - id: market-boundary
    title: Market Boundary and Stack Definition
    body: >
      PaXini's addressable opportunity spans a nested stack of markets rather than
      a single category. At the base is the robotics-grade tactile and force/torque
      sensor market—distinct from consumer haptics and medical-only tactile devices,
      which have different buyer requirements, precision thresholds, and regulatory
      constraints. Within that base, the high-precision multi-dimensional segment
      (six-axis force, texture, elastic response captured simultaneously) is
      narrower still, and is where PaXini differentiates via its Hall-effect technology.
      Above sensors, PaXini sells dexterous robotic hands (DexH13) that integrate
      those sensors—competing here against gripper vendors and bare-metal effector
      suppliers. The next layer is humanoid robot platforms (TORA-ONE, TORA-DOUBLE ONE),
      where PaXini competes with Unitree, AgiBot, and global players. At the apex is
      an emerging embodied AI data infrastructure market: the OmniSharing DB, co-hosted
      with JD Cloud, Tencent Cloud, and Baidu AI Cloud, which commercializes real-world
      multimodal tactile data. This data layer has no established third-party sizing
      and should not be included in near-term TAM estimates without explicit caveats.
      The relevant excluded spend includes consumer haptic actuators (mobile phones,
      gaming), load cells and uniaxial strain gauges used in industrial weighing,
      autonomous mobile robots without dexterous arms, and purely software-based
      robot control stacks. PaXini's value proposition—full-stack hardware plus
      proprietary dataset plus model—means its SAM crosses all four layers but
      obtainable penetration in each is at different maturity stages.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
    tableRefs:
      - TM001
    figureRefs:
