        - JD Cloud、Tencent Cloud、Baidu AI Cloud 的计算和存储
        - 云合作伙伴连续性；数据授权条款未公开；质量保障流程未说明
      - - 通信层（EtherCAT / Modbus）
        - DexH13 接入标准机器人控制器
        - 工业标准现场总线；多数工业机器人控制器支持
