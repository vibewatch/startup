      - number: '5.7'
        title: 差异化、IP、供应链与信任 / 安全 / 质量
        blocks:
          - type: paragraph
            body: >
              PaXini 宣称的差异化建立在四个互相咬合的优势上：（1）自有 Hall-effect HAPTA/ITPU 感知技术，公司称其突破了中国机器人高端触觉传感器的「进口依赖」；（2）创始团队来自 Waseda
              University Sugano Laboratory，该实验室曾打造全球首个人形机器人，学术履历强；（3）闭环数据飞轮——按公司和 EqualOcean 的表述，PaXini
              是全球唯一把大规模触觉模态数据整合进全模态具身数据集并用于训练的公司；（4）从传感器到机器人再到 AI 模型的全栈产品矩阵。


              知识产权：PaXini 中国企业登记记录显示，公司拥有 135 项专利、43 项软件著作权和 192 件注册商标。PAXINI 的 USPTO 商标申请（Serial No. 99442343）于 2025 年
              10 月提交，覆盖机器人割草机、饮料加工机等类别。公开来源没有逐项列出专利组合，也没有说明发明专利、实用新型和外观设计专利的构成。


              供应链：PaXini 从深圳总部制造产品，并在上海、天津和宿迁设有办公室。Hall-effect 磁元件、空心杯电机（用于 DexH13 关节）、定制 PCB/ASIC
              芯片和结构材料的具体部件供应商均未公开披露。评估单一来源风险和供应连续性时，这是一个实质尽调缺口。


              信任与安全：已发布安全规格包括 IP65 和 UL94 V-0（传感器）、芯片级抗磁免疫，以及 200%/300% 安全 / 冲击过载评级。中国企业登记信息（AiQiCha）记录 PaXini
              Technology (Shenzhen) Co., Ltd. 涉及 3 起经营纠纷、1 条立案信息和 1 条开庭公告；这些程序的性质和重要性没有公开细节。
