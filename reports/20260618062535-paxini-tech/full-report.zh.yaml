      - number: '3.5'
        title: 护城河耐久度与竞争替代风险
        blocks:
          - type: paragraph
            body: >
              PaXini 的竞争护城河立在三根柱子上：源自早稻田大学 Sugano Lab 的 Hall-effect 传感器 IP、自有真实世界触觉数据管线，以及与中国头部人形机器人 OEM
              的深度集成。每根柱子都面临不同的替代风险。

              IP 护城河真实存在，但可被挑战。Hall-effect 力感知是成熟物理原理；Tekscan、PPS、RoboSense 和学术团队都在积极开发替代多轴感知技术（电容式、压阻式、光学）。RoboSense
              投入自研芯片设计（MEMS、SPAD-SoC、VCSEL）说明，聚焦感知的竞争者一旦达到生产规模，就能开发定制感知硬件。

              数据护城河可能是最强的结构性优势。PaXini 的五工厂全模态数据采集网络——声称每年产能接近 2 亿个数据点，并计划向全球提供云访问——为 OmniVTLA
              创造了训练优势，复制它需要大量资本和时间。不过，AGIBOT World（面向具身 AI 的竞争性企业级数据集）和学术开源数据集都是现实替代；质量和多样性差距尚未被独立基准验证。

              OEM 客户护城河取决于 Unitree、AGIBOT 和其他人形 OEM 是否持续愿意做组件买方，而不是垂直整合。TrendForce 报道 Unitree 计划把产能扩大到每年 75,000
              台人形机器人——到这一规模，自研感知在经济上会变得有吸引力。Unitree 或 AGIBOT 在 IPO 后收购触觉传感器公司，将是 PaXini 的重大不利事件。

              更广泛的中国人形机器人行业还承受西方分销的立法和地缘政治风险。American Security Robotics Act（2026 年 3 月，参议员 Cotton 和 Schumer；众议员 Rep.
              Stefanik 提出配套法案）将禁止美国联邦机构采购与外国对手相关的人形机器人，并具体点名 Unitree 和 AGIBOT。中国《国家情报法》（2017 年第 7
              条）要求所有中国组织无论数据存储地或子公司结构如何，都要配合国家情报机关；这对购买包括 PaXini 传感器和手在内的中国机器人组件的西方买方，是结构性合规顾虑。Morgan Stanley 买方调查发现，只有
              23% 的潜在工业买方对当前可用人形机器人产品表示满意，说明供给侧热度已经跑在真实需求验证前面。

              2025 年 9 月披露的 Unitree 机器人 UniPwn Bluetooth 漏洞（可完全接管设备，并自动传播到附近机器人）显示，PaXini 客户基础集中的中国人形机器人平台生态存在系统性安全风险。
