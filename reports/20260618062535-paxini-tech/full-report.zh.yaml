chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、商业模式与产品范围
        blocks:
          - type: paragraph
            body: >-
              PaXini Tech（帕西尼感知科技，英文法定名称：PaXini Technology (Shenzhen) Co., Ltd.）于 2021-06-29
              在中国深圳注册成立。公司注册地址位于南山区万科云城西科创街；上海、天津和宿迁另设办公室。官方英文和中文网站的电话与地址信息确认了这四座城市。

              公司宣称的使命是「具身感知驱动通用智能」。商业模式是一条完整纵向栈：底层是 Hall-effect 多维触觉传感器，向上支撑灵巧手产品线（DexH 系列），再集成进人形机器人（TORA
              平台）。硬件栈背后还有自有数据基础设施——分布在华北、华东、华中、西南和华南的五座数据采集工厂，每年产出接近数百亿级多模态数据点。PaXini 用这批数据训练 OmniVTLA 全模态具身 AI
              模型，试图打通从物理传感器到基础模型的闭环，并不依赖外部数据。

              核心使能技术是 HAPTA（Hetero-Array Probing Tactile Architecture）及其主要组件 ITPU（Intelligent Tactile Processing
              Unit）。该架构让单个感知单元能同时捕捉 15 个维度的触觉信息，包括六轴力、材料纹理、温度和弹性响应；采样频率 1000 Hz，全量程分辨率 0.01 N。PX 系列传感器覆盖 3 个产品系列和 12
              款型号，公司称其 6D Hall-effect 传感器出货量全球领先。

              DexH13 GEN2 灵巧手是当前最新的商用型号，在 13 个自由度、4 根手指和 5 kg 负载能力中嵌入 1,140 个 ITPU 单元，最大抓握直径 15 cm。它搭载 800-megapixel AI
              手眼相机，支持「触觉 + 视觉」双模态感知；公司称这是行业首创。TORA-ONE 人形机器人集成 47 个自由度、1,956 条触觉传感通道、5 个单目相机、2 个深度相机、LiDAR 和激光 SLAM。

              产品已用于精密制造、汽车产线、物流、医疗和消费电子。PaXini 公开点名 BYD 和 JD.com 为战略部署伙伴。公司还参加了 2026 年 1 月的 CES 2026，并在 ENTERPRISE AI
              Zone 展示 TORA-ONE 制作冰淇淋，获得媒体关注，也为商业就绪度提供了展示窗口。

              硬件之外，PaXini 与 JD Cloud、Tencent Cloud、Baidu AI Cloud 合作上线了全球首个大规模多模态具身智能数据云商城，向更广泛行业提供标准化数据产品。公司称
              HyperCosmos 世界模型仍在积极研发中，并由 Series B 资金共同支持。
