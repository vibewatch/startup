      - number: '7.5'
        title: 财务、资本与投资假设破裂触发因素
        blocks:
          - type: paragraph
            body: >
              PaXini 是一家尚未披露收入的独角兽。CBInsights 记录显示，截至 2026 年 3 月，公司九轮融资均未披露财年收入，B 轮后估值超过 RMB 10 billion。最接近的功能可比公司
              Unitree Robotics 已获 STAR Market IPO 审核通过，2025 年收入 RMB 1.699 billion，毛利率 60.13%。PaXini
              尚未公布类似收入里程碑。隐含市销率无法计算；隐含叙事溢价很高。

              拟议的香港 IPO 带来双向风险。市场顺利时，IPO 募资可支持管理层明确提到的数据工厂扩张和 OmniVTLA 模型训练。若 HK
              市场环境不利——成长型深科技上市窗口曾阶段性关闭——公司将被迫推迟、以更高稀释做过桥融资，或接受 down-round。2026 年 3 月 B 轮完成到潜在 IPO
              申报之间时间很紧，公司在成为接受季度审视的公众公司前，留给多部署商业验证的跑道有限。

              收入模式集中也有结构性风险。触觉传感器单价降到最低 RMB 199，有助于打开采用门槛，但全球力传感器市场到 2035 年仅以 5% CAGR 增至 USD 3.93
              billion，要产生有意义收入必须依赖大规模出货。Goldman Sachs 预计人形机器人市场到 2035 年达到 USD 38 billion，支撑大市场叙事；但短期兑现要靠量产爬坡，而中国 140
              多家制造商也在竞争同一目标。Goldman Sachs 和 Morgan Stanley 的研究覆盖对 PaXini 定位有利，但更像关系邻近型分析，不是独立、对抗式的买方观点。

              AgiBot 在 2026 年 3 月通过上市公司收购路径达到 10,000 台人形机器人出货，这是另一条 IPO 路径，也提示直接向 HK Exchange 登记存在审批风险，PaXini
              可能需要预案。Figure AI（估值 $39B，融资 $1.9B）和 Skild AI（估值 $14B，融资超过 $2B）等全球竞争对手掌握更大资本池，且不受中国 National Intelligence
              Law 框架约束，因此在国际企业和政府客户面前有内生优势。
