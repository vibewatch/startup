  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与商业化策略
        blocks:
          - type: paragraph
            body: >-
              PaXini 采用三级、硬件优先的收入模型，以 B2B 企业销售为锚：触觉传感器组件、灵巧手组件和完整人形机器人平台。公司通过直接战略合作触达工业
              OEM、汽车制造商、物流运营商、医疗机构和电子装配商，主要对象包括 BYD、JD.com、SAIC、BAIC 和
              Geely，而不是传统渠道或经销网络。硬件交付给企业客户时确认收入；实际价格、批量折扣和合同结构均未公开披露。第四条收入流仍在开发中：PaXini 计划通过云数据商店向全球开放其全模态具身 AI
              数据，把其声称每年约 2 亿条数据的产出商业化。截至 2026 年 6
              月，该数据商业化路径尚未投入商业运营，也未披露上线时间表或定价模型。产品资料提到专业集成和支持服务是企业方案的一部分，但没有单独服务收入拆分。公司的投资方阵容横跨互联网巨头（JD.com、Meta 关联方 LEO
              LION）、汽车
              OEM（BYD、SAIC、BAIC、Geely）、电子（TCL、Uni-Trend）和国有产业基金，显示其意图是通过深度战略嵌入变现，而非交易型放量；这带来无法从公开来源量化的客户集中风险。收入确认政策未披露；硬件产品线大概率按标准交付确认，但考虑到集成复杂度，企业机器人部署可能采用里程碑模式。
