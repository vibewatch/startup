              创始人 Xu Jincheng 同时握有 PaXini 三个最高权力角色：法定代表人（法定责任）、董事长（治理）和总经理（运营）。一旦离任、受到监管限制或丧失履职能力，一家 315
              人且没有公开接班计划的组织，会同时遭遇治理、战略和运营中断。IPO 前的治理修复——包括独立董事、C-suite 授权和成文接班结构——应作为尽调前置条件，而非 IPO 后优先事项。
