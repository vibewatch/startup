  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 从市场机会和技术验证出发，经过风险校准，推导出有条件的「跟踪」建议。
    data:
      nodes:
        - id: market
          label: 大市场：全球人形机器人 2030 年达 $15.26B；Goldman 预计 2035 年达 $38B
        - id: tech
          label: 技术验证：触觉传感器护城河、VTLA 数据优势、Geely 99.8% 部署
        - id: financing
          label: 融资：Series B 估值 $1.5B；BYD / JD.com / Meta 关联方背书
        - id: risks
          label: 关键风险：未披露收入；Unitree / AgiBot 双寡头；地缘政治；法律纠纷
        - id: valuation
          label: 估值立场：偏高——推断收入倍数 100–300x；假设激进
        - id: recommendation
          label: 建议：跟踪——等待试点转合同验证，或等待 IPO 定价发现
      edges:
        - from: market
          to: financing
        - from: tech
          to: financing
        - from: financing
          to: risks
        - from: risks
          to: valuation
        - from: valuation
          to: recommendation
    approximationNotes: 流程为分析框架；边权重未量化。
    claimRefs:
