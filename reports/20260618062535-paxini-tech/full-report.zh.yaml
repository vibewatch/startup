            body: >-
              PaXini 的客户集中风险结构性偏高，因为主要具名、具备投产意图的客户——BYD、JD.com、Geely、SAIC、BAIC——同时也是股权股东。已披露的 14
              家顶级产业投资方覆盖汽车（BYD、SAIC、BAIC、Gree 关联的 Zhuhai Sci-Tech）、互联网和物流（JD.com）、消费电子（TCL、XGD）以及海外（Meta 关联方 LEO
              LION），客户管线更多由 cap table
              预先定义，而不是完全靠市场竞争赢得。这一结构提供强短期商业验证，但若任何锚定伙伴降低战略承诺，集中风险会暴露；若无法证明公平交易定价，还会引发采购完整性问题。Goldman Sachs 和 Morgan
              Stanley 公开称 PaXini 是具身智能上游基础设施，增加了声誉权重，也凸显循环验证风险：分析师的市场份额说法可能来自公司提供数据，而非独立核验。80% 全球份额说法与 Sina Finance 12%
              国内高端份额数字冲突；差异尚未解决，是任何投资者独立测算可服务客户基础时的实质尽调缺口。PaXini
