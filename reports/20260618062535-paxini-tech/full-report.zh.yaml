            - 战略投资方（持股 13.4%）+ 目标客户
            - 电动车 / 制造
            - 严重——BYD 单笔最大机器人投资；主要 OEM 部署目标
        - label: JD.com
          values:
            - Series A 领投方 + 计划客户
            - 电商 / 物流
            - 高——2025 年 5 月以来 JD 第六笔机器人投资；已声明物流场景
        - label: SAIC Motor
          values:
            - 早期投资方 + 隐含汽车客户
            - 汽车（国有）
            - 中——投资已确认；尚未宣布部署
        - label: BAIC Group
          values:
            - 早期投资方 + 隐含汽车客户
            - 汽车（国有）
            - 中——BAIC 安鹏基金为投资方；部署未确认
        - label: LEO LION（Meta 关联方）
          values:
            - 海外股权投资方
            - 美国互联网 / AI 生态
            - 低——释放国际化信号；未确认商业部署
        - label: Zhuhai Sci-Tech（Huafa / Gree）
          values:
            - 国资背景产业投资方
            - 先进制造 / 房地产
            - 低——战略方向匹配；主要是财务投资，尚未商业化
    approximationNotes: 集中度严重性由分析师根据持股规模、披露意图以及截至 2026 年 6 月已披露或缺失的部署状态判断。
    claimRefs:
      - CU019
      - CU023
      - CU031
      - CU038
  - id: FR001
    title: 风险严重性与发生概率热力图
    type: matrix
    layout: wide
    summary: 将 PaXini 主要风险按分析师评估的发生概率（行）和严重性（列）定位，筛出最需要优先关注、可能打破投资逻辑的风险。
    data:
      columns:
        - 低严重性
        - 中严重性
        - 高严重性
        - 严重
      rows:
        - label: 低概率
          values:
            - Waseda IP 来源缺口
            - 出口管制认定（BIS）
            - ''
            - ''
        - label: 中概率
          values:
            - ''
            - MIIT / 标准合规缺口；数据工厂安全事件
            - 硬件规模化可靠性；制造质量爬坡；供应链不透明；联合创始人离职
            - Geely 验证点失效；产品安全事故
        - label: 高概率
          values:
            - ''
            - 电池与在线时长约束；人员规模与目标不匹配
            - AI 模型在生产中失效；RoboSense 及同业竞争压力；香港 IPO 时点风险；法律纠纷披露缺口
            - 未产生收入前的估值缺口；BYD 与 JD.com 双重角色依赖
        - label: 极高概率
          values:
            - ''
            - ''
            - ''
            - NI Law 数据主权上限；美国立法导致市场关闭；商业验证集中（单一场地）
    approximationNotes: 发生概率和严重性评级是分析师基于公开披露作出的定性判断，并非精算估计。空白单元格表示该交叉点未识别出风险。
