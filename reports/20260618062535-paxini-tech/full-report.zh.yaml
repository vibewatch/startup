      - number: '4.3'
        title: 成本结构与资本强度
        blocks:
          - type: paragraph
            body: >-
              PaXini 的成本结构偏硬件，且叠加第二个资本黑洞：大规模 AI 数据采集基础设施。主要成本项包括：（1）自研传感器芯片和 ITPU
              模块开发；（2）传感器封装和制造爬坡；（3）覆盖中国五大区域（华北、华东、华中、西南、华南）的全模态数据采集工厂集群；（4）用于 OmniVTLA 和 HyperCosmos 模型训练的 GPU
              算力；（5）315 名参保员工（AiQiCha 社保记录）支撑的企业级人才结构，团队带有 Waseda University 机器人学脉络。Tracxn 报告的 13 人规模很可能是过期索引噪声，与
              AiQiCha 登记证据相差一个数量级；315 人这一数字支撑更强。公司没有公开披露毛利率、COGS 拆分、研发支出或运营费用。最有用的行业基准来自 Unitree Robotics STAR Market
              IPO 招股书中的 FY2025 文件（TrendForce 引用），其披露人形和四足机器人合计毛利率为 60%；一家硬件机器人公司达到该水平，说明高量制造规模可以跑出来，但 PaXini
              商业化阶段更早。PaXini 额外投入的数据工厂 capex 在 Unitree 身上没有对应项，使其成本底盘比纯机器人 OEM 更重。没有 COGS
              或毛利数据，五个数据集群设施的资本开支强度无法估算。多地点实体基础设施、员工规模和并行模型开发项目会带来可观月度现金消耗，但具体量级是无法压缩的尽调缺口。
