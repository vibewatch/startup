  - id: TV005
    title: 论点失效与终止触发表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 试点转合同失败
        - 到 2026 年 12 月，与 Tier-1 工业客户确认的多年供货合同少于 2 份
        - 证实试点部署只是演示，不是商业收入；估值失去支撑
        - 退出持仓或拒绝领投；下调至熊市情景 $0.8–1.2B
      - - 触觉市场份额被侵蚀
        - 到 2027 年上半年，Unitree、AgiBot 或西方竞争者推出成本有竞争力、6D 灵敏度可比的自研触觉传感器
        - 核心护城河论点崩塌；Goldman 80% 份额数字过时；VTLA 数据优势可被合成方式复制
        - 重新评估持有；与管理层做治理层面复盘，检验护城河可持续性
      - - 低于 $1.5B 的降价轮或平轮
        - Series C 或 Pre-IPO 轮将 PaXini 定价在 $1.5B（RMB 10B）或以下
        - 既有投资人面临减记；说明商业进展尚未验证 Series B 估值标记
        - 复核资本结构；新投资前评估清算优先权悬空
      - - 地缘政治出口限制
        - 美国或欧盟依据出口管制或投资审查立法（按 American Security Robotics Act 框架）指定中国人形机器人硬件公司
        - 关闭西方企业和研究客户市场；压缩 HKEX IPO 投资人范围
        - 可服务市场大幅缩小；如果投资模型写入国际收入，需要重估
      - - IPO 失败或无限期延迟
        - 到 2027 年 12 月未提交 HKEX 申报，或申报后撤回 IPO
        - 流动性事件推迟；二级市场定价不会向 Series B 估值收敛；早期投资人面临生存级风险
        - 与管理层讨论双轨替代方案（M&A、二级转让要约、战略收购）
    notes: 触发阈值仅为指示性，应该写入股东权利或 side letter 条款；不构成法律契约。
