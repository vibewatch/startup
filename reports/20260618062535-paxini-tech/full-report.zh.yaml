      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >-
              创始团队源自东京早稻田大学 Sugano Laboratory，该实验室被广泛认为是全球首台人形机器人的诞生地。Xu Jincheng（许晋诚）拥有早稻田博士学位，直接师从人形机器人研究领军人物 Shigeki
              Sugano。博士毕业后，Xu 回到深圳并联合创立 PaXini，把实验室的力触觉感知能力商业化。

              联合创始人 Nie Xiangru（聂相如，又名 Mark Nie）拥有 University of Illinois at Urbana-Champaign 硕士学位。此前他任职于 ZTE、Xiaomi 和
              NetEase，聚焦科技行业大客户运营，为 Xu 的技术背景补上企业销售和商务拓展能力。两位创始人的组合体现出较强 founder-market
              fit：深厚的触觉机器人学术积累，加上在中国头部科技公司中的商业化经验。

              根据 Aiqicha 企业登记，Xu Jincheng 同时担任董事长和总经理（CEO）。董事会还包括 Zhang Hengdi、Chen Mei、Jin Feng 和 Wang Li，Zhang Jinping
              担任监事。这些董事成员出现在 Aiqicha 工商档案中，但当前公开来源未披露其背景。

              根据 QCC（Qichacha）股东名册，Xu Jincheng 持股约 18%，Nie Xiangru 持股约 8%，是两位最大的个人股东。BYD（2025-04-22）和 JD Technology
              Information Technology Co., Ltd.（2025-09-12）也登记为股东，印证了媒体关于其投资的报道。

              关键人物依赖很重：Xu Jincheng 是主要技术架构师、公司学术资历的公开代表，也是法定代表人。Nie Xiangru
              则是商业和投资者关系职能的锚点。短期内两人都不容易被替代；若缺位，公司定位和投资者信任都会受影响。
