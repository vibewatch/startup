        - 未发布第三方校准认证；缺少长期漂移现场数据
      - - DexH13 手（触觉 + 视觉）
        - 灵巧操作，配合多模态感知反馈闭环
        - ITPU 单元 + 空心杯电机 + 800MP 摄像头模块 + EtherCAT 接口
        - 电机供应商和连续工业工况耐久性未披露；摄像头失效模式未知
      - - TORA-ONE 轮式人形机器人
        - 具备 SLAM 导航的全身操作平台
        - DexH13 / DexH5 + LiDAR + 深度摄像头 + 板载计算 + 电池系统
        - 规模化集成复杂；无公开正常运行时间、MTBF 或维护成本数据
      - - OmniVTLA 多模态模型
        - 将 V-T-L-A 传感器输入映射为机器人动作轨迹，用于具身 AI
