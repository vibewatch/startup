  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层
        blocks:
          - type: paragraph
            body: >-
              PaXini 在其产品栈中面向六类可识别买家。第一，人形和具身 AI 机器人制造商把 PaXini 的 ITPU 传感器、DexH13/DexH5 灵巧手或完整机器人平台集成进自有系统；Figure AI
              在中国投资媒体中被提为国际优选伙伴，但尚无合同确认。第二，汽车 OEM——主要是 BYD、Geely、SAIC 和 BAIC，且均为股权投资方——在产线上部署 TORA-ONE
              人形机器人，执行线束装配等精密任务。第三，3C 电子和精密装配领域的工业制造集成商使用 PaXini 力 / 力矩传感器做自动化任务，传感器入门价低至 CNY 199（~USD 27）。第四，云和数据平台——JD
              Cloud、Tencent Cloud、Baidu AI Cloud——是 OmniSharing DB 数据商城的基础设施伙伴和数据变现渠道。第五，SJTU、Zhejiang University
              等学术和研究机构采购传感器和数据，用于具身 AI 模型开发。第六，医疗健康、养老和商业服务运营方是 TORA-ONE 移动与灵巧能力的目标客户，不过尚未公布具名医疗部署。PaXini
              的投资者名单——BYD、JD.com、SAIC、BAIC、TCL、LEO LION（Meta
              关联方）——也可作为目标客户基础的代理指标，因为多数投资者披露过部署计划或战略协同。地域覆盖仍明显以中国国内为主，公司在深圳、上海、天津和宿迁设有办公室；但国际店面和 AIFITLAB
              分销渠道为传感器层面的开发者和研究者买家提供了全球入口。
