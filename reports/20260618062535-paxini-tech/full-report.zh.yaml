      - number: '3.2'
        title: 具身 AI、灵巧手与人形机器人竞争者
        blocks:
          - type: paragraph
            body: >
              具身 AI 和人形机器人板块既是 PaXini 最大的可服务 OEM 客户池，也是最动态的竞争威胁来源。购买 PaXini 触觉传感器和灵巧手的同一批 OEM，一旦年产规模扩大到数万台，也可能决定把感知自研。

              Unitree Robotics（杭州；Series C；2026 年 6 月 IPO 获批）按收入和公众知名度领先中国人形机器人市场。G1 基础款标价 USD 13,500（不含税 / 运费）；H1 和
              H1-2 是更大的全尺寸平台，可选灵巧手（Dex3-1 或 Dex5-1）和可选触觉传感器阵列。Unitree 2025 年收入达到 16.99 亿元人民币（2023 年为 1.59
              亿元），其中人形机器人收入超过 51%，综合毛利率 60.13%——对机器人硬件而言异常高。STAR Market IPO 于 2026 年 6 月 1 日获批（中国 A 股首家「具身 AI」公司），验证了
              Unitree 的财务画像，也释放出扩产计划：年产 75,000 台人形机器人和 115,000 台四足机器人。这需要大量灵巧手和传感器采购，目前由包括 PaXini 在内的第三方供应商承接。

              AGIBOT（上海；2023；Series B；据 Tracxn 融资约 $83.8M）于 2026 年 3 月 30 日生产第 10,000 台人形机器人（Expedition A3），约三个月内从 1,000
              台加速到 5,000 台再到 10,000 台。Omdia 将 AGIBOT 评为 2025 年全球人形机器人出货第一。TrendForce 预计，2026 年产出同比增长 94% 时，Unitree 和
              AGIBOT 合计将拿下约 80% 的中国人形机器人出货。AGIBOT 还发布了 AGIBOT World，这是面向具身 AI
              的大规模企业级真实任务数据集和生态，显示其垂直整合野心可能延伸到传感器采购。部署覆盖汽车制造、消费电子、物流和国际市场（欧洲、亚洲、中东）。

              UBTech Robotics（深圳；HKEX 上市）面向养老、AI 教育和消费级智能硬件开发人形服务机器人，Walker 是旗舰人形平台。作为上市公司，UBTech
              比多数中国人形机器人同行更透明。服务场景让高保真触觉感知可能成为差异化能力，但其产品页面对触觉集成的技术规格披露有限。

              Figure AI（San Jose, CA；Series C；累计融资 >$1.9B；投后估值 $39B）是西方资金最充足的纯人形机器人公司。Figure 03 面向日常家庭环境设计，由 Helix AI
              系统驱动。Figure 通过 BMW Group Plant Spartanburg 的持续商业部署验证了能力（1,250+ 小时运行、90,000+ 个零件、30,000+ 辆车）。截至 2026
              年初，BotQ 工厂每 90 分钟生产一台机器人。Figure 是 AI 驱动灵巧操作在真实制造环境中的西方领先标杆。

              Fourier Intelligence（上海；Series B）通过 GR 系列开发康复和工业应用人形机器人。但本次研究期间，其官方网站无法访问（SSL 证书错误），限制了基于一手来源的分析。

              LimX Dynamics（深圳；2022；Series B；据 Tracxn 融资 $296M）正在开发具身智能机器人和 agentic 操作系统。截至 2026 年 6
              月，公开英文来源中的商业部署细节和客户公告有限。
