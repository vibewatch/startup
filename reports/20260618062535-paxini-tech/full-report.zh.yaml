      - number: '8.5'
        title: 退出准备、尽调要求与投资假设破裂触发因素
        blocks:
          - type: paragraph
            body: >
              PaXini 的退出准备仍早，但在推进。Bloomberg 称公司正在积极探索香港 IPO 路径。Unitree 于 2026 年 6 月 1 日获 STAR Market

              上市委审议通过，成为首家在中国 A 股交易所过会的具身 AI 公司，显著改善了同业 IPO 环境。AgiBot 正在走另一条上市路径。若 Unitree

              按 $6.2 billion 目标完成公开发行，将为整个行业设定定价底线，并可能加速 PaXini 向 HKEX 递表。不过，PaXini 的 IPO

              准备度取决于几个关键尽调缺口能否补齐：经审计收入确认、客户合同条款和股权结构披露。最关键的投资假设破裂触发因素包括：18

              个月内无法将当前试点转为经常性合同；触觉市场份额输给一体化竞争对手；西方市场对中国 AI 机器人硬件实施地缘政治出口限制。法律争议记录（Aiqicha 记录中有三起商业纠纷、一起案件立案、一次庭审）意味着在
              IPO

              或锚定投资承诺前，应对任何未结诉讼做隔离式复核。
