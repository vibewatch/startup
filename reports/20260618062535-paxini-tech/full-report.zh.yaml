      - number: '6.3'
        title: 采用轨迹与市场证据
        blocks:
          - type: paragraph
            body: >-
              PaXini 声称传感器出货量行业领先，但没有披露单元数量或同比增长，因此只能间接评估采用轨迹。最常被引用的代理指标是 Goldman Sachs 的表述：PaXini 已拿下全球机器人触觉传感器市场超过 80%
              份额；但该数字来自 Goldman Sachs 分析师研究，很可能受到公司提供数据影响，可用来源也没有界定口径——究竟覆盖专门部署在人形机器人中的触觉传感器，还是更广义机器人市场。Sina Finance 于
              2025 年 4 月独立发布的竞争分析称，PaXini 在国内高端触觉传感器市场约占 12%，而外国厂商占 68%，给出了明显不同的竞争位置图景。CES 2026 是 PaXini
              最大的国际概念验证事件，现场演示了完整产品矩阵——传感器、DexH13、TORA-ONE 和 OmniSharing DB。公司五座数据工厂设计年产约 200 million 条全模态数据；与
              SJTU、Zhejiang University 的联合研究验证了人手到机器人手映射 84% 成功率，以及 Isaac Sim 环境中 VLA 策略 80% 成功率。PaXini 是八家估值超过 RMB 10
              billion 的中国具身智能公司之一，这一同业基准凸显赛道动量。IFR 2025 报告显示，2024 年中国安装 295,000 台工业机器人，占全球装机量 54%；即便缺少 PaXini
              具体采用数据，这也为国内获客提供了强宏观顺风。
