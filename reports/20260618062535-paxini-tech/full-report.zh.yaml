  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              PaXini 的监管风险由三股力量共同塑造：中国企业注册地带来的结构性义务、国内安全与标准体系持续演进，以及可能逐步关闭国际市场的海外立法压力。

              《中国国家情报法》（2017 年第 7 条）要求所有中国公司和公民按要求配合国家情报机关，不受服务器位置、公司结构或其公开隐私政策影响。PaXini 在工业部署中采集丰富触觉与多模态具身 AI
              数据，并用这些数据建设大模型基础设施；这项义务会在限制外国情报可访问系统的客户和政府面前形成结构性障碍。这不是可以通过运营手段缓释的风险，而是 PaXini
              母国司法辖区的适用法律。美国联邦机构、国防承包商及其供应链暴露最尖锐，立法动能正推向正式限制。2026 年 3 月，参议员 Cotton 和 Schumer 提出 American Security
              Robotics Act（众议院配套提案来自 Representative Stefanik），拟禁止联邦机构采购中国人形机器人；发起人点名 Unitree 和 AgiBot 等同业，行业背景也直接适用于
              PaXini。配套 Humanoid ROBOT Act（2025 年 11 月）把拟议限制延伸至联邦承包商。两项法案尚未通过，但立法记录显示压力具备持续性；即便正式生效前，也会约束 PaXini
              的美国政府和国防承包商市场。

              中国国内监管时间线也在收紧。MIIT 2023 年 10 月《人形机器人创新发展指导意见》设定 2027 年目标：形成安全、可靠、可控的产业链。2026 年 3 月，工信部发布中国首个人形机器人国家标准体系，由
              120+ 家机构参与，覆盖安全、伦理、生命周期合规和具身 AI 模型数据治理。标准固化前就把硬件嵌入客户设施的早期玩家，如果未来认证体系要求替换不合规部件，将面临重新设计风险。MIIT 指导意见明确把 3C
              电子和汽车列为领先应用，正好对应 PaXini 的 Geely 部署所在领域，使监管审查集中度更高。

              PaXini 自身法律记录包含已披露但未说明的负面事项。Aiqicha 和 QCC 数据记录 3 起经营纠纷、1 条正式立案信息和 1
              条开庭公告。性质——合同、雇佣、IP、商业秘密或客户纠纷——均未公开。PaXini 的美国商标申请（Justia 显示 2025 年 10 月）以及其国内 135 项专利、43 项软件著作权、192
              件商标组合，说明公司 IP 防御活跃但近期才搭建完成。Waseda University 创始背景中的 IP 权属来源尚未独立记录。
