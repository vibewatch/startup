      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              PaXini 于 2026 年 3 月完成 Series B，融资超过 RMB 1 billion（约 $144.93–$150 million USD，不同来源因汇总方法略有差异）。本轮由 Huangpu
              River Capital、Kaitai Capital 和国资背景的 Xin'an Capital 领投，13+ 家共同投资方包括 Zhuhai Science and Technology Industry
              Group、Shanda Capital、Haichuan Fund、Guangzhou Emerging Industry Fund、Uni-Trend、Zhilai Capital、LEO
              LION、Nanling Fund 和 Xiangcheng Financial Holding。现有股东——包括 Addor Capital、Yida Capital 和 TCL
              Capital——显著加仓。累计融资总额按 CB Insights 为 $144.93 million（9 轮），按 Tracxn 为 $150 million（4 轮，汇总口径不同）；两者都反映截至 2026
              年 3 月已募集资本，差异来自子轮汇总方法。现金余额、月度 burn rate 和剩余 runway 均未披露；没有数据室访问权，无法估算。公司已将 Series B
              资金用途标定为：（i）自有感知系统硬件升级；（ii）扩建超级数据采集工厂，目标约 ~200 million 条数据 / 年；（iii）OmniVTLA 和 HyperCosmos AI
              模型研发；（iv）商业试点扩张和规模化部署。PaXini 还在探索香港 IPO（Bloomberg，经 CNEVPost 报道，2026 年 6
              月），正与银行合作准备未来数月可能提交的上市申请；若顺利推进，将为后续扩张提供实质资本。公司融资轨迹——不到三年九轮，轮次规模从种子轮攀升到 >$140M Series B——显示其结构性依赖外部 VC
              和战略资本，IPO 是下一步计划中的流动性与增长资本事件。Series B 交易条款（投前估值、清算优先权、转换价格、反稀释条款）在 CB Insights 上均标为非公开。
