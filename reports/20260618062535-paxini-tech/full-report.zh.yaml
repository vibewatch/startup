  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 触觉与力感知既有竞争者
        blocks:
          - type: paragraph
            body: >
              三家成熟公司定义了西方触觉 / 力感知既有厂商板块，也是 PaXini 在组件层面最直接挑战的对象：Tekscan、Pressure Profile Systems（PPS）和 Nitta
              Corporation。

              Tekscan（Norwood, MA；非上市）是压力映射和嵌入式柔性力传感器领域最知名的供应商。其三条核心产品线——Pressure and Temperature Mapping
              Systems、Embedded Flexible Force Sensors 和 TactileLab 定制工程服务——服务于做设计验证、QC、电池堆测试的 R&D
              工程师，也服务于测量骨科和康复结果的临床医生。Tekscan 不提供为灵巧手 OEM 集成而设计的多维 Hall-effect 触觉传感器，其 go-to-market 主要走 R&D 设备渠道和直销，而非机器人
              OEM 供应链。价格未公开披露；系统成本随配置差异很大，通常需询价。

              PPS（Pressure Profile Systems；美国总部、英国办公室；非上市）提供电容式触觉传感器，自称拥有 25+ 年经验，并配套自有 Chameleon 压力可视化软件。PPS 服务 200+
              家机构，并已明确进入机器人领域，推出 TactileGlove、Modular TactileHead 和集成式 RoboTact 产品。PPS
              认为，电容式感知在灵敏度、重复性和温度稳定性上优于电阻式方案。PPS 在亚洲有分销伙伴，并将 RoboTact 作为集成机器人产品销售，因此比 Tekscan 更直接。但 PPS 仍是一家小公司，没有
              PaXini 提供的全栈具身 AI 集成、人形机器人本体或自有数据集。价格未公开披露。

              Nitta Corporation（大阪；TSE 上市集团）历史上以工业场景中的力和力矩传感器著称，但其美国分部（NCA）聚焦工业皮带、软管 / 接头、气动管和机器人 RETS
              换刀器，而不是人形触觉感知。Nitta 美国和日本英文网站的英文产品内容都覆盖输送带和皮带产品。Nitta 的力 / 力矩传感相关性来自工业邻近市场，而不是作为 PaXini 面向人形灵巧手的
              Hall-effect 多维触觉栈的直接竞争者。

              RoboSense（中国深圳；HKEX 上市）是最尖锐的单一玩家威胁。它最初是汽车和机器人感知领域的 LiDAR 与主动相机厂商，如今宣布转向全栈，覆盖 multi-DOF 灵巧手、用于长周期任务规划的
              VTLA-3D 大模型、自研 SoC 芯片（RISC-V 数据处理、digital SPAD-SoC、2D addressable VCSELs、MEMS），以及通过 ISO 26262、IATF 16949 和
              ASPICE CL2 认证的 48,000 m² 智能制造设施。如果 RoboSense 将触觉感知集成进其灵巧手——其全栈叙事强烈暗示会这么做——它就能在单一供应商关系中提供感知、执行和 AI，替代
              RoboSense 自有机器人平台上的组件级触觉传感器供应商，也可能替代外部 OEM 客户的供应商。
