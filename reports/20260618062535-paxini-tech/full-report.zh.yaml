      - number: '5.2'
        title: ITPU/HAPTA 触觉架构与传感器规格
        blocks:
          - type: paragraph
            body: >
              PaXini 的核心感知技术建立在霍尔效应多维感知物理之上：一组霍尔效应磁感知元件把外加力转换为可测量的电压变化，并同时覆盖多个空间方向。这个物理层被组织进 HAPTA（Hetero-Array Probing
              Tactile Architecture）之内；HAPTA 是一套异构多阵列软硬件架构，把 ITPU 感知单元与板载触觉算法集成起来，实现毫秒级信号处理。ITPU（Intelligent Tactile
              Processing Unit）则是嵌入所有 PaXini 产品的离散功能感知模块。


              量产传感器 PX-6AX-GEN3 系列覆盖三个子系列、12 个型号，可同时测量 15
              个感知维度，包括六轴力（Fx、Fy、Fz、Tx、Ty、Tz）、材料纹理和弹性响应。按公司发布规格，并由第三方产品列表佐证，ITPU 阵列每阵列最多支持 121 路力信号，法向力范围 0–25 N、切向范围 ±10
              N，最小识别力 0.01 N，空间分辨率 0.1 mm，采样率 1 MHz（最大输出频率 1,000 Hz），重复性 <0.5%FS。环境指标包括 IP65、UL94 V-0 阻燃认证、200%
              安全过载、300% 冲击过载、芯片级杂散磁场免疫，以及超过 10 million 次循环寿命。入门传感器标价从 US$49 起，PaXini 将其定位为面向具身 AI 开发者市场的成本下降。


              PaXini 称 PX6D/PXTS 是全球首款面向具身 AI 商业化的霍尔效应 6D 力 /
              力矩传感器，瞄准机器人手臂腕部和关节力控。它把极致轻量化设计与传感器端智能结合起来，为全身力感知提供颠覆性的性价比。截至运行日期，这一说法尚未由第三方评测者独立验证。
