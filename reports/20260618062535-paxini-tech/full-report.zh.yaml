  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 面向 IC 的 PaXini 七项投资维度评分；量表为 0–10。
    data:
      items:
        - label: 市场机会
          value: 9
          note: 到 2030 年人形机器人 CAGR 为 39–48%；Goldman 预计 2035 年达 $38B；中国是最大市场
        - label: 技术 / 产品验证
          value: 7
          note: 触觉传感器领先地位可信；Geely 部署已验证；OmniVTLA 未经外部基准测试
        - label: 竞争护城河
          value: 7
          note: ITPU 架构和 VTLA 数据管线短期难复制；Goldman 所称 80% 份额未经验证
        - label: 收入 / 单位经济
          value: 2
          note: 无公开收入；CB Insights 显示 FY 收入为零；推断年化收入最好为 $5–15M
        - label: 风险画像
          value: 4
          note: 地缘政治、法律纠纷、竞争双寡头风险，以及早期执行不确定性
        - label: 估值吸引力
          value: 3
          note: 未产生收入前估值 $1.5B，偏高；推断收入倍数 100–300x；需要香港 IPO 完成价格发现
        - label: 证据质量
          value: 5
          note: 战略投资方验证强；有分析师覆盖；运营 KPI 受披露不透明限制
    approximationNotes: 评分为作者基于本报告证据作出的判断，不是量化模型输出。
    claimRefs:
      - CV013
      - CV015
      - CV026
      - CV029
      - CV036
      - CV043
      - CV046
      - CV050
