      - number: '3.3'
        title: 功能与能力对比
        blocks:
          - type: paragraph
            body: >
              PaXini 的差异化在于触觉感知栈的深度和集成度，而不是机器人本体产品线的广度。关键对比轴包括：（a）多维感知质量，（b）灵巧手设计，（c）人形本体完整度，（d）自有 AI
              模型和真实世界数据平台，（e）商业部署证据。

              触觉感知质量方面，PaXini 的 ITPU（Intelligent Tactile Processing Unit）技术专为多轴力、纹理和弹性响应测量设计。DexH13 在 4 根手指和 13 DOF 中集成
              1,140 个 ITPU 单元，负载能力 5 kg，按压定位精度 1 mm，并配备 800MP AI 相机实现视觉 - 触觉双模态感知。DexH5 入门款手有 9 DOF、4 kg 负载能力，在
              humanoid.guide 上标价约 USD 2,000。DexH13 标价约 USD 17,200。相比之下，Tekscan 和 PPS 在受控 R&D
              场景中能提供更丰富的单元级感知数据，但不交付集成灵巧手、AI 推理或人形机器人本体。

              AI 集成方面，PaXini 的 OmniVTLA 多模态大模型及配套全模态数据采集基础设施（来自五个区域工厂、每年接近 2 亿个数据点）构成闭环训练管线，结构上很难复制。RoboSense
              是唯一积极建设可比全栈 AI 管线的竞争者（其 VTLA-3D 模型可为 10+ 个连续动作做长周期规划），但 RoboSense 的起点是 LiDAR / 视觉感知，而不是触觉感知。

              商业部署方面，PaXini 在 CES 2026 展示 TORA-ONE 自主制作冰淇淋，包括拉杆操作、原料处理和递杯；加上与 JD 和 BYD 的供货关系，提供了可核验部署证明。PX-6AX-GEN3
              传感器覆盖 3 个产品系列和 12 款型号，在 15 个感知维度上全量程重复性 <0.5%。纯视觉操作方案（LLM
              引导、无触觉反馈抓取）是活跃替代路径，但缺少触觉感知所能提供的精确力控，难以处理精细或可变形物体。传统应变片和 load-cell
              传感器（既有厂商：Honeywell、Kistler、ATI/Bosch）仍是工业机器人力测量的现状方案，但不解决多轴灵巧手操作问题。
