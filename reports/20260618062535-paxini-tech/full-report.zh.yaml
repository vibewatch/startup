      - number: '7.4'
        title: 人员与执行风险
        blocks:
          - type: paragraph
            body: >
              Aiqicha 注册资料显示，创始人 Xu Jincheng 同时担任法定代表人、董事长和总经理。法定责任、董事会治理、经营管理三项权力压在一个人身上，即便按早期深科技公司标准也过于集中。如果 Xu
              离任、丧失履职能力，或在任何司法辖区遭遇监管审查，PaXini 会同时面临治理、战略和执行中断。联合创始人 Nie Xianru（持股 8%、董事）有 ZTE、Xiaomi、NetEase
              的商业经验，但公开记录没有显示正式接班计划、独立董事会结构，或 C-suite 层面的运营职能授权。

              Aiqicha 显示，PaXini 登记的参保员工为 315 人。相比公司同时承担的任务，这个规模偏小：运营覆盖中国五个区域的数据采集工厂，推进 OmniVTLA 和 HyperCosmos
              模型开发，制造传感器和灵巧手，组装并部署 Tora 人形机器人，还要在 12 至 18 个月内把组织拉到 HK IPO 所需的公众公司水准。现有人力与 IPO 就绪运营之间的缺口，是实质性执行风险。

              Waseda University 的创业来源提供了技术可信度，也引出 IP 来源问题：基础传感器和触觉智能 IP 有多少是在校内开发后转移、有多少是在公司成立后形成，尚未披露。现阶段未发现与 Waseda 或
              Sugano Lab 的 IP 争议，但没有争议证据，不等于权属来源已经干净确认。国际扩张还需要设立中国以外的法律实体和合规基础设施，当前团队尚未公开说明。
