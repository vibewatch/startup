  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入和单位经济
        - FY2025 和 2026 年上半年的经审计或管理账收入、毛利率、客户合同金额
        - 公司未披露公开收入；整个估值压在快速放量假设上
        - 向 CFO 索取；要求提供 3 年收入预测，并附已签 LOI 或 MSA 管线
      - - 股权结构和优先权堆栈
        - Series B 后完整股本表、期权池规模、清算优先权条款
        - 即使以 $2–3B 退出，优先权悬空也可能吃掉普通股价值；偏向投资人的条款可能藏在文件里
        - 索取股本表和股份购买协议；独立法律审查
      - - Geely 及其他客户合同
        - Geely 和其他具名工业伙伴已签供货或服务协议的条款、数量、定价、排他性条款
        - 试点转合同是核心价值拐点；口头或 MOU 级承诺不构成收入
        - 法律审查合同条款；独立向 Geely 采购做客户核查
      - - Goldman Sachs >80% 市占率依据
        - 独立第三方市场研究佐证 Goldman 的说法；80% 数字的方法论、年份、地理范围
        - 这一说法是触觉护城河最强的单一论据；如果夸大或过时，护城河叙事会明显变弱
        - 委托独立市场调研；直接取得 Goldman Sachs 研究报告
      - - 知识产权归属
        - 源自 Waseda University 的 IP 完整权属链、专利授权与待审状态、任何发明人转让协议
        - 创始团队来自 Waseda Lab，IP 是转给 PaXini 还是大学仍有疑问；若未解决，存在诉讼风险
        - 由中国和日本专利律师做 IP 审计；审阅全部转让协议
      - - 法律纠纷解决状态
        - AiQiCha 记录的 3 起经营纠纷、1 起案件立案、1 次开庭的详细状态
        - 未决诉讼可能构成未披露负债，影响 Pre-IPO 估值以及投资人陈述与保证
        - 向法律顾问索取诉讼时间表；独立检索中国法院数据库
    notes: 尽调事项按对投资决策的重要性排序；本清单并不穷尽。
    claimRefs:
      - CV011
      - CV036
      - CV050
