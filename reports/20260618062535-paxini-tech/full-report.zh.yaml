      - number: '5.3'
        title: 灵巧手平台——DexH5 与 DexH13
        blocks:
          - type: paragraph
            body: >
              PaXini 量产两款可商业采购的灵巧手，均把 ITPU 感知直接嵌入手指结构。


              DexH5（GEN1）是一款四指、九自由度灵巧手，集成多维触觉传感器，面向服务机器人、科研平台和轻工业应用。它提供 4 kg 负载，采用轻量高强复合材料。模块化腕部接口可连接多种机械臂平台。DexH5 代表
              PaXini 早期一代产品，公开规格文档相比更新的 GEN2 更有限。


              DexH13（GEN2）是当前旗舰灵巧手。它的关键架构是在四根手指和 13 个自由度上组合 1,140 个 ITPU GEN2 触觉处理单元（GEN2 代），生成 3,420 路信号通道，并配合
              800-megapixel AI 摄像头，用零样本姿态估计识别此前未训练过的物体。公司宣称的规格包括 15 N 指尖力、5 kg 负载能力、15 cm 最大抓握直径，以及低于 1.0 s
              的最短开合周期。面向工业可靠性，DexH13 标称可承受超过 1 million 次按压循环。PaXini 将 DexH13 描述为行业首款结合多维触觉感知与 AI 视觉的双模态灵巧手。集成依靠标准
              EtherCAT 和 Modbus 工业通信协议。CES 2026 上，DexH13 展示了对试管、方块等不规则物体的稳定抓取，并完成精细旋钮转动任务；独立评估者注意到该演示，但未发布受控基准结果。
