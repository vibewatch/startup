      - number: '6.4'
        title: 留存、耐久性与扩张
        blocks:
          - type: paragraph
            body: >-
              PaXini 未公开披露净收入留存、总留存、流失率、合同期限、复购率或 cohort 层面客户满意度数据。业务模式横跨一次性硬件销售——传感器价格从 CNY 199 到数千不等，TORA-ONE 单价 USD
              50,000–150,000——以及可能通过 OmniSharing DB 产生的经常性数据订阅收入；但数据商城订阅者数量和定价条款未披露，使耐久性评估带有推测性。结构性留存驱动来自生态锁定：客户一旦集成
              PaXini 的 ITPU 触觉硬件，就会依赖兼容灵巧手型号，并最终接入 OmniVTLA 训练管线，从而有动力随时间加深关系。BYD 和 JD
              等投资者-客户带来长期战略协同，但也让独立测量留存更困难，因为这些关系混合了股权利益和商业义务。PaXini
              在中国设有四个办公室（深圳、上海、天津、宿迁），说明国内地理扩张已经展开；国际触达仍处萌芽期，AIFITLAB
              是已确认的第三方全球分销商。中国投资媒体提到韩国科技集团是国际伙伴，但没有确认任何具名韩国实体或收入。按 QCC 中国企业登记信息，公司有 315 名参保员工；相对于 RMB 10 billion
              估值，团队偏精简，若不进行实质招聘投入，可能限制其服务快速扩张企业客户群的能力。
