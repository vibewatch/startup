      - number: '5.6'
        title: 集成、可靠性、支持与路线图
        blocks:
          - type: paragraph
            body: >
              第三方机器人平台集成在硬件层通过 DexH13 手上的标准 EtherCAT 和 Modbus 工业通信协议实现。OmniSharing DB 数据格式支持转换为 LeRobot，并兼容主流深度学习框架，让 AI
              开发者无需定制预处理管线即可使用 PaXini
              训练数据。公司提供国内（mkt@paxini.com）和海外销售渠道（sales_global@paxini.com），在深圳（总部）、上海、天津和宿迁设有办公室。SPiRAL Labs
              被列为官网具名研究合作伙伴。


              已发布的可靠性规格包括 ITPU 传感器 IP65 防水防尘、UL94 V-0 阻燃认证和芯片级抗磁干扰能力。工作温度范围为 0–50°C，过载耐受范围为 −20–120°C。DexH13 标称超过 1
              million 次按压循环，ITPU 传感器标称超过 10 million 次。这些数字均为公司宣称；公开材料中没有指出第三方认证机构或独立测试实验室。


              公开可见路线图包括：（1）继续扩大 DexH13 GEN2 量产；（2）推进 OmniVTLA 模型；（3）开发 HyperCosmos 多模态世界模型；（4）全球扩展 OmniSharing DB
              数据云；（5）扩张数据采集工厂产能。具体时间表、里程碑门槛或已承诺客户交付日期均未公开披露。
