      - number: '1.4'
        title: 里程碑时间线与负面背景
        blocks:
          - type: paragraph
            body: >-
              PaXini 的公开记录给出了从成立到 Series B 的清晰时间线。公司于 2021-06-29 注册成立，并在最初两年内发布首批基于 ITPU 的触觉传感器和 DexH 灵巧手产品。Pre-A
              轮（2022-12-29）带来首笔机构资金。TORA-ONE 人形机器人于 2024 年发布，把 ITPU 触觉生态与全身机器人平台集成起来。天津具身智能数据中心在 2024–2025 年开业；到 2025 年
              8 月，JD 领投的 Series A 使累计融资达到 CNY 10 亿元。美国商标「PAXINI」于 2025 年 10 月 14 日向 Justia 提交申请，显示公司开始推进国际品牌。CES
              2026（2026 年 1 月 6–9 日）是完整产品组合首次登上重要国际舞台。Series B 于 2026-03-06 关闭。

              负面信号需要单独处理。Aiqicha 截至 2026 年的公司记录显示，PaXini 涉及 3 起经营纠纷、1 条正式立案信息和 1
              条开庭公告。这些并非无关紧要：立案和开庭公告意味着至少存在一起进行中的诉讼程序。纠纷性质、交易对手和金额敞口未在公开档案披露；恰当的尽调路径是直接向 PaXini 法务团队询证。

              还有两个负面信号来自数据质量本身。Tracxn 报告 PaXini 仅有 13 名员工，这与 Aiqicha 社保数据库记录的 315 名参保员工直接矛盾。Tracxn 的人数几乎肯定是 LinkedIn
              抓取造成的伪影，而非准确薪资人数；但该差异仍提示，任何单一来源的员工数代理指标都存在风险。PaXini 未发布官方员工数。

              商业化不透明是结构性缺口：尽管产品曝光多，BYD 和 JD.com 等战略投资方参与度高，PaXini
              没有向公开来源披露收入、毛利率或客户数量。关于汽车产线和物流运营「规模部署」的说法来自公司，未被客户披露核验。Aiqicha 将 PaXini 归类为 2025
              年瞪羚企业和科技型中小企业，说明它被认定为高增长早期公司，但尚未达到成熟规模。
