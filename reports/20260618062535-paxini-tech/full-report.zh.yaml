      - number: '4.2'
        title: 定价架构与竞争背景
        blocks:
          - type: paragraph
            body: >-
              PaXini 的产品价格只能从第三方市场聚合平台和分析师评论中看到，官方 PaXini 定价页没有披露。Humanoid.Guide 上，入门级灵巧手 DexH5 标价约 $2,000 / 台；功能更强的四指手
              DexH13 Gen 2 配有 1,140 个 ITPU 触觉处理单元，标价约 $17,200。Tora-One 人形机器人系统按 RBTX 市场报价和 OriginOfBots 机构定价信号估算，价格区间为
              USD $50,000–$150,000——这只是标价，企业实际折扣未知。传感器部件层面，CNEVPost 引用 Goldman Sachs 研究称，PaXini 多维触觉传感器的单元价格可低至 RMB
              199（~$28），把原本只停留在实验室的技术成本大幅打了下来。Goldman Sachs 还据称将全球机器人触觉传感器市场 >80% 的份额归于
              PaXini，使其成为核心供应商；但该说法来自一份本分析无法独立获取的分析师研究报告，应视为第三方转述，而非已验证事实。竞争定价背景是：Unitree 的 G1 人形机器人和 H1
              平台定位更低价、偏消费级，PaXini 的 Tora-One 则瞄准更高 ASP 的工业精密任务。DexH5（$2,000）与 DexH13（$17,200）价差很大，意味着 PaXini
              针对不同机器人平台集成设置了分层价格。所有第三方价格来源都应当按市场估算处理；实际企业定价、批量折扣和多年期合同仍是未披露的尽调要求。
