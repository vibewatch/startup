  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与估值锚点
        blocks:
          - type: paragraph
            body: |
              PaXini 于 2026 年 3 月 6 日完成 B 轮融资，募资超过 RMB 1 billion
              （按当时汇率约 $144–150 million）。本轮由 Huangpu River Capital、
              Kaitai Capital 和国资背景的 Xin'an Capital 领投，Zhuhai Science and
              Technology Industry Group、Shanda Capital、Haichuan Fund、Guangzhou Emerging Fund、Uni-Trend、
              Zhilai Capital、LEO LION、Nanling Fund 和 Xiangcheng Financial Holding 跟投。Addor Capital（Yida Capital）
              等老股东大幅增持。投后估值超过 RMB 10 billion（约 $1.5 billion），使 PaXini 成为中国八家跨过该门槛的具身智能公司之一。自 2023
              年以来，公司至少经历九次融资事件，累计外部融资约 $150 million。

              RMB 10B 估值嵌入了激进假设。公司没有公开披露收入或毛利率数据。CB Insights 显示，所有被追踪轮次的财年收入均为零。
              若按部署范围和员工规模推算的年化收入 $5–15 million 估计，隐含收入倍数为 100–300x——只有 PaXini
              在未来 12–24 个月实现快速、可规模化商业化，这一区间才站得住。Goldman
              Sachs 和 Morgan Stanley 的研究把 PaXini 称为具身 AI 的「上游基础设施层」，Goldman 还认为其占据全球触觉传感器市场 80%
              以上份额。这些分析师观点支撑品类假设，但现阶段无法独立验证。Bloomberg 报道的香港 IPO 进程——据称公司正与投行合作，并可能在未来数月向 HKEX
              递表——提供了退出催化剂；若落地，可能弥合估值缺口，也可能把高估值固化为永久性错配。
