      - number: '2.2'
        title: 多视角市场规模测算
        blocks:
          - type: paragraph
            body: >
              没有一个权威口径覆盖 PaXini 精确的 SAM，因此必须用多组视角交叉校准。人形机器人市场是主要需求驱动；MarketsandMarkets 估算其 2025 年规模为 $2.92 B，2030 年增至
              $15.26 B，CAGR 39.2%——这是一个付费获取的自上而下报告，纳入范围较宽。仅中国市场预计 2025 年为 $0.40 B，2030 年升至 $2.80 B，CAGR
              47.6%，反映中国政策行动中描述的政府背书加速。美国细分市场单独估算，2025 年为 $857.9 M，2030 年增至 $4.601 B。力传感器市场是 PaXini 传感器竞争所依托的工业机器人 F/T
              传感器底座；全球市场 2024 年为 $2.30 B，预计 2035 年达到 $3.93 B，CAGR 仅 5.0%，反映传统工业应用增长更慢。触觉和 tactile technology 市场更宽，2025
              年为 $6.61 B、2030 年增至 $8.21 B，CAGR 4.5%，但主要由消费触觉设备（振动马达、游戏手柄）主导，显著高估 PaXini 瞄准的机器人级细分市场。全球触觉传感器市场（消费 +
              工业）方面，VMR 经 Sina Finance 报道称 2021 年已超过 $11.25 B，并预计 2028 年达到 $26.08 B，同样主要由非机器人应用主导。China Unicom Research
              引用的 GGII 预测明显比 MarketsandMarkets 保守：2025 年 12,400 台人形机器人、规模 63.39 亿元人民币（约 $875 M），比 MarketsandMarkets
              同期全球估算 $2.92 B 小 3 倍；这很可能反映其定义更窄，仅限高级双足平台。Goldman Sachs 对 2035 年市场的两组引用预测（$154 B 和 $38
              B）若无法获取原始报告，基本不可调和；AI Funding Tracker 的 $38 B 与 WIC 报告的 $154 B 可能在口径（仅硬件 vs.
              全生态）、时间跨度或报告版本上不同，二者都不应在没有原始访问权限时作为主要测算依据。投资者应谨慎对待任何单一标题 TAM：截至 2025 年，PaXini 在人形平台传感器和手部组件上的近期 SAM 合理区间约为
              $0.3–0.8 B，并会随人形机器人出货量增长而扩大。
