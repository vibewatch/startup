      - number: '8.6'
        title: 图表与附录
        blocks:
          - type: callout
            title: 有条件跟踪——入场纪律关键
            body: >
              PaXini 是触觉传感领域真正的品类龙头，也有可信的全栈具身 AI 愿景。但在 $1.5 billion
              估值且未披露收入的情况下，入场价格嵌入了尚未被商业合同验证的假设。「跟踪」建议反映的是对技术假设的高确信度，以及对当前价格下近期回报的低确信度。只有在试点转合同得到确认，或 HK IPO 价格发现低于 $2
              billion 时，才建议入场。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV011
              - CV043
          - type: callout
            title: 估值拉伸警示——收入不透明是结构性问题
            body: >
              截至 2026 年 6 月，PaXini 没有公开披露收入、毛利率或客户合同数据。2026 年 3 月 B 轮隐含的 100–300x
              收入倍数，只由叙事、分析师观点和战略投资人背书支撑，而不是经审计财务。按当前估值出资的投资人，承销的是预测，不是业绩。如果商业试点 18 个月内不能转单，降估值融资仍是最可能的单一情景。
            calloutType: risk
            claimRefs:
              - CV003
              - CV011
              - CV036
              - CV052
          - type: callout
            title: 触觉模态作为持久数据护城河
            body: >
              PaXini 最有防御力的资产不是传感器硬件，而是硬件生成的自有触觉数据集。不同于视觉数据，触觉交互数据无法从现有数据经纪商处抓取、合成或购买。OmniVTLA
              模型用数百亿个真实世界触觉数据点训练，形成复利优势——每一次部署都会生成更多数据，改善模型表现，增强传感器粘性，并加深机器人 OEM 的切换成本。若飞轮达到逃逸速度，即便硬件毛利被压缩，仍可能支撑溢价倍数。
            calloutType: insight
            claimRefs:
              - CV013
              - CV046
              - CV047
              - CV049
