      - number: '7.2'
        title: 运营、技术与安全风险
        blocks:
          - type: paragraph
            body: >
              PaXini 的商业叙事依赖硬件能在工业规模下可靠运行，但当前证据基础偏薄。公司给出的耐久性指标——DexH13 灵巧手超过 100,000 次操作循环，PX-6AX-GEN3 传感器阵列超过 10
              million 次寿命循环、IP65 防护、200% 安全过载耐受——尚未在持续生产环境中获得独立验证。唯一已确认的生产证明点是 Tora-One 在 Geely 钱塘制造基地的部署；按 2026 年 5
              月公司声明，该部署连续 8 小时运行，任务成功率 99.8%。来自单个设施、单班次、单次部署的测量，不足以构成面向工业规模资本设备的可靠性数据集。

              全行业约束会进一步放大 PaXini 的硬件风险。Morgan Stanley 对潜在工业买家的调查发现，受访者对当前可用人形机器人产品的满意度仅为
              23%；这是需求侧现实校验，激进供给侧预测并未充分反映。每次充电 2–3 小时的电池续航是行业级约束，会限制班次覆盖，增加热插拔物流复杂度，并收窄部署场景。截至 2025
              年，全球大多数人形机器人出货仍集中在受控试点和演示，而非连续多班次生产；PaXini 的 Geely 部署是最清晰的记录例外之一，但仍基于公司声明，而非独立审计。

              工业场景中，产品安全责任暴露很高。如果 Tora-One 或 DexH13 单元在客户设施造成伤害或生产损失，PaXini 将在没有完整安全审计历史或 ISO 认证记录的情况下承受产品责任索赔。2026 年 3
              月国家标准体系明确纳入覆盖全产业生命周期的安全与伦理要求；若不符合持续演进的标准，可能触发执法行动和客户合同终止。五区域数据采集工厂网络也带来运营复杂度：分布式设施中的传感器校准、数据质量保证和安全管理都需要管理带宽，而当前无法量化。AI
              模型在安全关键操作中失效或误分类——PaXini 的 OmniVTLA 2.0 是第一代商业模型——是一类新兴责任，公司未披露红队测试或 fail-safe 协议。
            claimRefs:
