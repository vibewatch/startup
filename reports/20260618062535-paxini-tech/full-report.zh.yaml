      - number: '8.2'
        title: 投资假设与反向假设
        blocks:
          - type: paragraph
            body: >
              投资假设建立在四根互相咬合的支柱上。第一，PaXini 卡住了人形机器人供应链中差异化最强的位置：高精度触觉传感。触觉数据是无法从互联网抓取的模态，

              PaXini 的 ITPU 架构和 DexH13 灵巧手已经生成数百亿个真实世界多模态数据点，可用于闭环 VTLA 模型训练；目前没有竞争对手能规模化复制。

              第二，投资人组合本身就是产业验证信号。BYD、JD.com、TCL、SAIC、BAIC 和 Meta-affiliate LEO LION

              拼出从供应链到部署的连续体。这些不是被动财务投资人，而是潜在部署客户和供应链锚点。第三，Geely Qiantang 部署——汽车线束装配连续运行八小时，任务成功率 99.8%——首次提供了可信证据，说明
              PaXini

              的全栈路径能在高要求工业环境中跑通。第四，TrendForce 认为人形机器人行业将在 2026 年下半年进入关键商业化阶段，中国出货预计同比增长 94%；PaXini

              处在上游，使其不是押注单一机器人，而是面向整个行业供货。


              反向假设同样尖锐。收入未披露，意味着 $1.5B 估值完全按叙事和管线定价，而不是按已验证的单位经济模型定价。Geely

              部署只是单一试点，并不能证明经常性合同收入。Unitree 和 AgiBot 预计将在 2026 年拿下约 80%

              的中国人形机器人出货量——两家公司也在推进自有传感器和灵巧手集成，可能把 PaXini 目前提供的环节内化。Goldman Sachs 提出的 >80%

              触觉市场份额没有独立验证；任何达到成本平价的竞争对手，都可能迅速侵蚀这一份额。最后，作为中国公司，PaXini 受中国 National

              Intelligence Law 第 7 条以及中国 AI 硬件更广泛地缘政治风险约束——国际企业客户和潜在西方交易所 IPO 投资人都必须权衡这些风险。
