          - type: callout
            title: 所有性能说法仍为公司宣称；未识别第三方硬件认证
            body: >-
              尽管规格表很详细，公开资料中没有独立校准实验室、ISO/IEC 认可测试机构或具名认证机构验证 PaXini 核心传感器或灵巧手性能说法（IP65、UL94 V-0、0.01N 分辨率、10M
              循环寿命、±0.05mm 手臂精度）。学术仿真结果（84%/80%）不能外推到真实机器人部署。工业买家在高量产集成前通常会要求第三方认证。
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
              - CE010
              - CE033
              - CE034
          - type: callout
            title: 部件供应链不透明
            body: >-
              PaXini 没有公开披露 Hall-effect 磁元件、空心杯电机（用于 DexH13 关节）、定制 ASIC/PCB
              或结构材料的供应商。对于一家处于这一产品规模的硬件公司，单一来源或中国集中供应风险很常见；没有任何公开披露，使独立评估无法完成。这是实质尽调缺口，尤其考虑到美中贸易管制会影响半导体和先进传感器部件。
            calloutType: risk
            claimRefs:
              - CE046
          - type: callout
            title: OmniSharing DB 云端数据商城可能成为平台楔子
            body: >-
              2026 年 3 月，PaXini 与 JD Cloud、Tencent Cloud、Baidu AI Cloud 推出 OmniSharing DB，这在结构上类似其他垂直行业的数据基础设施打法：PaXini
              通过实体感知产品捕捉数据，清洗并打包，再分发给无法从别处获取真实世界触觉数据的 AI 开发者。如果数据质量和格式兼容性说法成立，基于 PaXini 数据构建系统的 AI
              研究实验室和人形机器人公司会面临显著切换成本。
            calloutType: insight
            claimRefs:
