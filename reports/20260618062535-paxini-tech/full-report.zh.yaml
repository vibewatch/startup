      - number: '8.3'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: |
              三个情景框住了可能的估值结果。牛市情景假设 PaXini 成为人形机器人生态事实上的触觉标准——相当于具身 AI 里的 Bosch Sensortec——其传感器和灵巧手嵌入 Unitree、
              AgiBot、GALBOT 和国际 OEM 的机器人平台。若 2027 年以收入增长溢价成功登陆 HKEX，同时数据商城授权扩大、OmniVTLA
              模型商业化推进，退出估值可达 $5–8 billion。该情景下，2027 年收入达到 $50–80 million，且毛利率较高。基准情景指向 2028 年以 $2–4 billion
              估值 IPO，前提是 PaXini 将若干试点转化为多年供应合同，扩大触觉传感器装机基础，并证明 SaaS 式数据授权可产生经常性收入。熊市情景则是商业化慢于预期：试点没有转单，Unitree
              加速自研传感器，中国机器人市场增速放平并压缩 TAM。到 2027 年底，公司需要以不高于 $1.5 billion 的平轮或降估值融资
              吸引成长资本，早期投资人回报被摧毁。
