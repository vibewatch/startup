      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >
              PaXini 的买方版图有两层结构。第一层是直接商业客户：制造企业、物流运营商和医疗系统，购买 PaXini 的传感器、手或机器人用于自身运营。第二层——当前更重要——是人形机器人 OEM
              客户：Unitree、AgiBot、Figure 等平台厂商把 PaXini 的传感器和手嵌入机器人，进而形成派生需求。在 OEM 渠道，预算所有者通常是工程副总裁或
              CTO，评估标准是感知性能（精度、重复性、延迟），签约模式通常从联合开发协议推进到批量供货安排。制造业垂直场景的采用触发点是经济性：中国劳动力成本上升、精密装配线（汽车车身板件、3C
              电子）的良率要求，以及政府强制自动化目标。BYD 的投资和客户关系是公开可见的最强商业验证，但条款和数量未披露。JD.com
              的物流部署验证了仓储用例，不过在这一场景下，人形机器人在全行业仍基本处于试点阶段。医疗是推进最慢的细分市场：合规、责任和临床验证要求显著拉长销售周期，R&D
              之外几乎没有人形级触觉感知部署。服务机器人和零售更像未来可选项，而不是 PaXini 当前价格点对应的 2026 年可服务市场。具身 AI 数据基础设施板块（OmniSharing
              DB）增加了类似软件的经常性收入维度，但缺少公开可比的定价或采用基准；与 JD Cloud、Tencent Cloud、Baidu AI Cloud 合作的数据商城仍处早期。
