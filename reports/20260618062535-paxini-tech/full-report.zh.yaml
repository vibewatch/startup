      - number: '2.4'
        title: 增长驱动与政策顺风
        blocks:
          - type: paragraph
            body: >
              三股结构性力量正在加速 PaXini 技术栈所在市场。第一，中国政府政策提供了异常密集的需求杠杆。17 部门《“机器人+”应用行动实施方案》（2023 年 1 月）设定了 100+ 项新机器人应用技术和 200+
              个典型场景的明确目标。MIIT《人形机器人创新发展指导意见》（2023 年 10 月）把人形机器人提升为关键前沿方向，并要求省市政府把具身 AI 纳入产业升级规划。2026 年 3
              月发布的人形机器人国家标准体系——覆盖 6 个全生命周期组成部分，由 MIIT 牵头 120+ 家机构制定——提供了合规清晰度，可能加速政府相关部门采购（国有制造商、公共物流）。中国将 2025
              年定为量产元年，已有 140+ 家国内制造商和 330+ 款型号，确认生态正在跨过扩散门槛。第二，投资流会自我强化。全球机器人创业公司 2025 年融资 $13.8 B，较 2024 年 $7.8 B 增长
              77%。仅人形机器人融资 2024 年就达到创纪录的 $1.2 B，并预计 2025 年翻倍至 $2.3 B。这些资本流向 OEM 客户，使其有能力购买更高质量的传感器组件。PaXini 自身已吸引 14
              家全球产业投资方，覆盖 BYD、JD.com、SAIC、BAIC 和 TCL，横跨汽车、物流、消费电子和制造供应链。第三，AI/LLM
              集成浪潮提升了丰富触觉数据的边际价值。通用人形机器人需要在没有场景专用编程的情况下完成多样任务；传感器触觉反馈对安全抓取不规则物体、检测滑移、实时调整握力至关重要。LLM、具身 AI 模型（VLA
              架构）和灵巧操作正在汇合，恰好创造了 PaXini 所提供全栈基础设施的市场。
