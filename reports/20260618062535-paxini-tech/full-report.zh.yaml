  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与技术栈定义
        blocks:
          - type: paragraph
            body: >
              PaXini 的可服务机会不是单一品类，而是一组嵌套市场。底层是机器人级触觉与力 /
              力矩传感器市场——它不同于消费触觉和仅面向医疗的触觉设备，后两者的买方需求、精度门槛和监管约束都不一样。在这一底层里，高精度多维细分市场（同时捕捉六轴力、纹理、弹性响应）更窄，也是 PaXini 借
              Hall-effect 技术做差异化的地方。传感器之上，PaXini
              销售集成这些传感器的机器人灵巧手（DexH13），竞争对象包括夹爪厂商和裸金属末端执行器供应商。再上一层是人形机器人平台（TORA-ONE、TORA-DOUBLE ONE），PaXini 在这里与
              Unitree、AgiBot 和全球玩家竞争。最顶层是新兴具身 AI 数据基础设施市场：与 JD Cloud、Tencent Cloud、Baidu AI Cloud 共建的 OmniSharing
              DB，将真实世界多模态触觉数据商业化。这个数据层尚无成熟第三方规模测算；若无明确 caveat，不应纳入近期 TAM 估算。应剔除的支出包括消费触觉执行器（手机、游戏）、工业称重用 load cells
              和单轴应变片、不带灵巧臂的自主移动机器人，以及纯软件机器人控制栈。PaXini 的价值主张是「全栈硬件 + 自有数据集 + 模型」，因此其 SAM 跨过四层，但每一层可获得渗透率所处成熟阶段不同。
