      - number: '8.4'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >
              PaXini 的 $1.5 billion 估值落在一个很宽的同业区间内。美国本土纯人形机器人公司中，Figure AI 是明显离群值，C 轮后估值 $39 billion——既反映先发品牌，也反映 BMW

              工厂部署凭证。Skild AI 和 Physical Intelligence 分别达到 $14 billion 和 $11 billion，但两者都是软件 / AI 公司，资本设备强度接近零。Apptronik

              估值 $5.5 billion，对应 A 轮阶段、$935 million 融资和 Mercedes-Benz 战略背书。NEURA Robotics 约 $4.6 billion，是结构上更好的可比公司：硬件加
              AI

              基础模型、欧洲市场、阶段相近。Unitree 的 IPO 目标估值 $6.2 billion，且披露 2025 年收入 RMB 1.699 billion、毛利率
              60%，是最关键基准——它定义了商业已验证的中国人形机器人硬件公司在公开市场能值多少钱。PaXini

              估值 $1.5 billion、年收入大概率 $5–15 million，相对 Unitree 的收入倍数存在显著溢价，但相对美国上市同业大幅折价。这个价差一部分来自 PaXini

              阶段更早且尚未披露收入，也反映中国市场相较美国可比公司在地缘政治和监管风险上的折价。可比组确认，行业愿意给已验证全栈公司高倍数；PaXini 的挑战是补上验证缺口。
