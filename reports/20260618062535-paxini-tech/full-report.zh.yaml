      - number: '7.6'
        title: 图表与附录
        blocks:
          - type: callout
            title: 中国 National Intelligence Law：结构性市场准入天花板
            body: >
              中国 2017 年 National Intelligence Law 第 7 条不是可缓释的运营风险，而是 PaXini 母国司法辖区的现行法律。包括 PaXini
              在内的任何中国公司，无论服务器放在哪里、数据驻留架构如何、隐私政策怎样表述，都必须按要求配合国家情报机关。在这个框架下，美国联邦机构、国防承包商以及盟友司法辖区的受监管行业，无法合法部署 PaXini
              硬件。立法动向（American Security Robotics Act，2026 年 3 月）显示这道天花板正在变硬，而不是松动。若投资假设依赖美国政府、国防邻近或 ITAR
              邻近收入，投资人应把它视为投资假设级别的结构性约束，而不是尽调清单上的一项。
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR007
          - type: callout
            title: 尚未披露收入的独角兽，只有一个生产验证点
            body: >
              PaXini B 轮后估值超过 RMB 10 billion，九轮融资均未披露收入，且唯一确认的生产部署（Geely Qiantang，2026 年 5 月）基于公司表述，而非独立审计指标。Unitree
              Robotics 是该领域首个公开市场可比公司，IPO 获批前 2025 年收入 RMB 1.699 billion，毛利率 60%。PaXini 进入公开市场时，没有类似收入锚点。如果 Geely 关系恶化，或
              IPO 注册前未能宣布更多生产部署，独角兽定价下唯一的商业证据底座将被抽掉。
