      - number: '1.3'
        title: 融资历史、估值与投资方基础
        blocks:
          - type: paragraph
            body: >-
              即便按中国具身 AI 标准，PaXini 的融资节奏也很快。第一笔有记录的外部融资是 2022-12-29 完成的 Pre-A；Baike 称其融资「数千万元人民币」，也是公司成立约 18
              个月后的首笔机构资金。QCC 股东名册显示，新奥资本和数家其他早期机构投资者自 2024 年 2 月起出现，说明 Series A 阶梯融资可能在 2024 年初启动。BAIC 的投资载体（安鹏绿色）自 2024
              年 6 月起登记。

              BYD 于 2025 年 4 月进入 A+ 轮；Sina Finance 称这是 BYD 在 2025 年单笔最大的具身 AI 投资。Yicai 报道，在 2025 年 8 月 JD 领投轮时，BYD 持股
              13.4%。2025-08-05，JD.com 领投 Series A 融资，使 PaXini 在短短四个月内累计融资达到 CNY 10 亿元（约 USD 1.39
              亿），公司也公开宣布了这一里程碑。该轮还引入新投资方 Puxin Capital 和 XGD（新国都），并获得老股东 TCL Capital 和 Addor Capital 追加投入。

              Series B 于 2026-03-06 关闭。Equalocean、Gasgoo 以及 QQ/猎云网联合稿等多个相互独立的中文和国际来源确认，该轮融资超过人民币 10 亿元，把 PaXini
              投后估值推至人民币 100 亿元以上（按当时汇率约 USD 15 亿）。Pandaily 标题称该轮超过 USD 1.5 亿。领投方为 Huangpu River Capital（黄浦江资本）、Kaitai
              Capital（凯泰资本）和 Xin'an Capital（信安资本）；其他参与方包括某大型双币基金、Zhuhai Science and Technology Industry Group、Shanda
              Capital（善达资本）、Haichuan Fund（海川基金）、Guangzhou Emerging Fund、上市公司 Uni-Trend（优利德）、Zhilai Capital（知来资本）、LEO
              LION、Nanling Fund（南岭基金）、Xiangcheng Financial Holding（相城金控），以及 Addor/Yida Capital（毅达资本）等多位老股东；其中毅达资本显著加仓。

              公司称，累计获得 14 家全球顶级产业投资方投资，包括 Meta 关联方、BYD、JD.com、TCL、Zhuhai Sci-Tech Industry Group（Huafa 和 Gree
              关联方）、SAIC、BAIC。Tracxn 估算公司总融资约 USD 1.5 亿、跨 4 轮完成，但分轮金额部分被隐藏。CB Insights
              有公司资料页，但内容设门槛；除公司表述和数据平台估算外，尚无独立核验的总额。Yicai（国有财经媒体）关于 Series B 前 JD 领投轮的数据，是截至 2025 年 8 月累计 CNY 10
              亿元这一数字最可靠的锚点。
