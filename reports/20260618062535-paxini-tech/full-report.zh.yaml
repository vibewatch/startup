      - number: '2.5'
        title: 采用约束与规模测算不确定性
        blocks:
          - type: paragraph
            body: >
              多项重要约束限制了近期市场兑现。最关键的是，高端触觉传感器市场约 68% 由成熟海外厂商主导——Tekscan（美国）、Nitta（日本）和 PPS（美国）——这些公司拥有数十年制造
              know-how、集成历史和医疗 / 工业客户关系。PaXini 声称在国内高端触觉传感器市场有 12% 份额（据 Sina
              Finance），但海外存量厂商仍占据大量位置；在高端细分市场替代对手，通常需要多年认证周期。试点到量产的断层是第二大约束。截至 2026 年中，多数人形机器人制造商仍处于试验或早期部署阶段。TrendForce
              预计 2026 年产出增长 94%，但基数很小；Unitree 和 AgiBot 合计预计占全球出货约 80%，说明 PaXini 的 OEM 渠道买方高度集中。DexH13 手（约 $17,200）和
              TORA-ONE 平台（$50,000–$150,000）的单位经济性，把采用范围限制在资金充足的 OEM 伙伴和高端工业应用；在当前价格点下，广泛消费或 SME 采用还要等数年。集成复杂性也是持续约束：每个
              OEM 部署都需要深度联合开发，把 PaXini 传感器接入机器人控制栈；PaXini 的员工规模限制了它能同时支持多少个集成项目。最后，分析机构的市场规模差异反映方法论分歧——GGII 对 2025
              年全球人形机器人市场给出 $875 M，MarketsandMarkets 给出 $2.92 B——投资者应基于实际单机出货数据做自下而上测算，而不是依赖报告标题数字。
            claimRefs:
              - CM036
              - CM037
