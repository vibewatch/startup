      - number: '3.4'
        title: GTM、定价、分销与切换成本
        blocks:
          - type: paragraph
            body: >
              不同公司类型的 go-to-market 路径差异很大。西方既有厂商（Tekscan、PPS）通过直销和 R&D 设备渠道销售；典型买方是工程师、研究人员或临床医生，而不是机器人 OEM 采购团队。PaXini
              已转向 OEM 和平台集成商供应，与 JD（物流机器人）和 BYD（汽车）建立直接关系，符合随机器人出货放大的 B2B sensor-to-OEM 模式。

              整个品类的定价透明度都很低。公开确认的数据点包括：Unitree G1 基础款为 USD 13,500（官方产品页）。PaXini 的 DexH5 在第三方产品目录中标价约 USD 2,000，DexH13 约
              USD 17,200。1X Technologies 的 NEO 家用机器人价格为 USD 20,000，或 USD
              499/月（订阅）。Tekscan、PPS、Nitta、RoboSense、AGIBOT、UBTech、Fourier 和 Figure AI 除按配置报价或伙伴讨论外，都未公开披露产品定价。

              嵌入灵巧手的触觉传感器切换成本不低。ITPU 接口、通信协议（EtherCAT、Modbus）和固件集成，都需要实质工程投入才能迁移到替代传感器供应商。PaXini 的全栈 SDK 支持（传感器 → 手 → AI
              模型 → 部署）在集成后会增加粘性。不过，模块化人形机器人设计——手臂和手本就可替换——也支持多供应商并用或切换。Tekscan 的薄型柔性传感器形态可在不重做整只手结构的情况下改装。

              分销广度差异显著。Unitree 通过直销电商和分销商全球销售，G1 已公开可购。AGIBOT 已宣布在欧洲（德国 Minth Group）、新加坡（Singtel
              Enterprise）、亚洲和中东建立合作。Figure AI 受益于战略投资方（NVIDIA、Macquarie、Intel Capital），这些投资方也承担分销和渠道伙伴角色。PaXini
              的分销主要是在中国直达 OEM，CES 2026 是其首次重要西方展会。本章所审阅的独立来源未记录 JD 和 BYD 之外的西方非联邦 OEM 合作。
