  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品线、SKU 图谱与客户工作流
        blocks:
          - type: paragraph
            body: >
              PaXini 的商业化组合分为三层，并形成闭环：（1）卖给机器人集成商和 OEM
              的触觉传感器与感知单元；（2）把这些传感器集成进末端执行器和全身系统的灵巧手与人形机器人平台；（3）捕捉真实世界交互数据、再喂给自有 AI 模型的具身 AI 数据基础设施。公司把这套体系称为「Tactile
              Sensors – Robot Platform – Embodied Data – Scenario Application」闭环，定位不是单点传感器供应商，而是全栈基础设施提供方。


              客户从不同入口接入 PaXini：纯传感器买家（机器人 OEM、大学实验室）采购 ITPU 单元或 PX-6AX-GEN3 系列，集成到第三方机械臂和夹爪；灵巧手买家（人形机器人厂商、物流集成商）采购 DexH5
              或 DexH13 作为可直接集成的末端执行器；人形平台买家（JD、BYD 等大型工业和医疗健康客户）部署 TORA-ONE，执行汽车装配、货物搬运等具体任务。另一个 AI 开发者客群通过 OmniSharing
              DB 云端数据商城获取训练数据。三层产品互相强化：传感器销售资助硬件 IP，机器人部署生成专有交互数据，数据再训练 OmniVTLA 模型。
