          - type: callout
            title: 最值得关注的竞争者是 RoboSense，而不是传统传感器既有厂商
            body: >
              Tekscan 和 PPS 在 R&D / 临床小众市场很强，但并未瞄准人形 OEM 供应链。最可能在核心市场替代 PaXini 的竞争者是 RoboSense：一家 HKEX 上市公司，拥有 ISO 26262
              级制造、自有 SoC 芯片、正在开发的 multi-DOF 灵巧手，以及面向具身 AI 的 VTLA-3D 大模型。RoboSense
              缺的一块是触觉感知——但其芯片和硬件能力使补齐这一缺口在技术上可行。PaXini 最好的防守，是加深 OEM 集成，并证明没有背后的自有触觉数据集，OmniVTLA 模型无法复制。
