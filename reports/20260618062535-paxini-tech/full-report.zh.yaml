      - number: '4.5'
        title: 财务缺口、负面证据与尽调结论
        blocks:
          - type: paragraph
            body: >-
              PaXini 当前最核心的尽调风险就是财务不透明。公司未披露收入、ARR、GMV、毛利率、burn rate、runway、CAC、LTV、回本周期或任何单客户收入指标。CB Insights
              对全部九次融资事件记录的收入均为零，确认外部没有任何已验证财务报告。Bloomberg 来源的 IPO 询问消息（CNEVPost，2026 年 6
              月报道）也未包含财务披露。中国企业登记信息（AiQiCha）给出负面证据：3 起经营纠纷、1 起立案案件、1 条开庭公告；这些程序的性质、相对方和财务重要性均未披露，需要独立法律尽调。Goldman Sachs
              归于 PaXini 的全球触觉传感器市场 >80%
              份额，来自单一媒体（CNEVPost）引用的一份分析师报告；该数字尚未被独立市场数据交叉验证，不应作为市场规模假设的主要依据。收入质量风险较高：硬件销售面向一小批战略投资方，而这些投资方同时也是客户（BYD、JD.com、Geely），带来关联方收入疑虑；没有完整财报无法评估。所有第三方价格数据——DexH5
              $2,000、DexH13 $17,200、Tora-One $50K–$150K——都来自市场聚合平台，而非 PaXini
              官方定价页或合同。财务尽调结论是：仅凭公开数据无法承销这家公司。关键阻断项包括：（1）未披露收入或毛利；（2）未披露 burn rate 或
              runway；（3）关联方收入集中风险；（4）未量化法律程序；（5）下一阶段增长依赖 IPO 级别资本。Geely 部署（99.8% 任务成功率、8
              小时连续运行）是技术就绪度的积极证据，但属于公司自述，需要独立审计。
