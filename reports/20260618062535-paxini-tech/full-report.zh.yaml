      - number: '5.5'
        title: 具身 AI 数据基础设施与 OmniVTLA 模型
        blocks:
          - type: paragraph
            body: >
              PaXini 已搭建一套「以人为中心」的全模态具身 AI 数据基础设施，并称其解决了机器人行业物理接触模态训练数据稀缺的问题。


              物理基础设施由五座全自建数据采集工厂组成，覆盖华北、华东、华中、西南和华南，宣称年产能接近 200 million 条全模态数据。数据采集使用 PXCap V 可穿戴设备完成；该设备覆盖五指全触觉，集成 30
              个六维触觉模块，密度为 3,015 个感知点，可同时捕捉 82 个手部运动自由度和 15 个触觉信息维度（力、纹理、弹性）。数据格式兼容主流框架，并支持转换为 LeRobot 标准格式。


              2026 年 3 月，PaXini 与 JD Cloud、Tencent Cloud、Baidu AI Cloud 合作推出 OmniSharing DB
              云端数据商城，被描述为全球首个大规模多模态具身智能数据云。该平台支持一站式在线数据购买，并在三家合作云平台上提供云端预处理、模型训练和部署。


              自有 OmniVTLA 多模态大模型整合视觉、触觉、语言和动作数据流，用于具身 AI 训练。外部验证仅限于一篇联合论文《RoboPaint: From Human Demonstration to Any
              Robot and Any View》；该论文与 Shanghai Jiao Tong University 和 Zhejiang University 共同署名，报告称在 10
              项任务中把人手状态映射到机器人灵巧手的成功率为 84%。仅用 PaXini 生成数据训练的 VLA 策略（Pi0.5）在 Isaac Sim 仿真环境三项代表性任务中达到平均 80%
              成功率。这些结果只来自仿真，不能构成对 OmniVTLA 模型或数据管线的独立真实世界验证。


              PaXini 还宣布了正在开发的多模态世界模型 HyperCosmos，并计划把 OmniSharing DB 作为数据基础设施资源向全球开放。
