      - number: '7.3'
        title: 合作伙伴、依赖与供应链风险
        blocks:
          - type: paragraph
            body: >
              PaXini 的战略架构把投资人、客户和商业验证三条线同时压到少数单一交易对手上，风险集中度很高。BYD 在 2025 年 4 月进行战略投资——公开说法称，这是 BYD
              最大的一笔单项机器人投资，也是其首次大规模押注具身智能——同时又是工业自动化的目标客户。JD.com 通过 JoyGen 载体参与 A III 轮（2025 年 8
              月），也很可能成为商业参考客户。两家投资人既出资，又可能买单；一旦商业关系因竞品发布、技术路线切换或地缘政治因素恶化，PaXini 的资本底座和客户验证会同时受损。

              商业集中度同样尖锐。2026 年 5 月宣布的 Geely Qiantang 部署，是目前唯一确认达到完整生产级别的参考案例。拟申报 IPO 时，整个工业部署叙事都压在一个地点、一个客户的验证点上。如果 HK
              IPO 前不能扩展到更多独立生产部署，新进公开市场投资人等于在超过 RMB 10B 的估值上，用一座制造工厂作为商业证据底座。

              供应链不透明是结构性缺口。PaXini 的霍尔效应传感芯片设计和 ITPU（Intelligent Tactile Processing
              Unit）技术，依赖的组件制造环节尚未公开披露。公司称其传感器成本结构有颠覆性——多维触觉传感器单价最低降至 RMB 199——但底层组件来源、毛利和供应商集中度仍未知。竞争对手 RoboSense
              已推出竞品全栈具身智能平台，包含灵巧手，以及通过 IATF 16949 和 ISO 26262 认证的制造运营，进一步挤压 PaXini 的供应链优势。TrendForce 预计 Unitree 和 AgiBot
              在 2026 年合计拿下近 80% 的中国人形机器人出货量，压缩组件层和全栈人形机器人供应商可争取的市场。股权结构中，38 家以上投资人对应 50 多个股东实体，也带来治理复杂度；清算优先权和反稀释条款尚未披露。
