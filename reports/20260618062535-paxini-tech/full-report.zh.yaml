      - number: '3.6'
        title: 图表
        blocks:
          - type: callout
            title: OEM 垂直整合是首要护城河威胁
            body: >
              PaXini 最集中的风险，是 Unitree 和 AGIBOT 决定自建或收购触觉感知能力。Unitree 目标年产 75,000 台人形机器人，AGIBOT 三个月爬坡到 10,000
              台；在这样的规模下，自有感知的单位经济性会显著变化。Unitree 若在 IPO 后收购一家触觉传感器创业公司，将对 PaXini 收入基础构成二元负面事件。尽调必须确认合同排他性，以及 Unitree IPO
              招股书是否披露传感器采购条款。
            calloutType: risk
            claimRefs:
              - CP014
              - CP015
              - CP016
          - type: callout
            title: 中国《国家情报法》构成结构性西方分销壁垒
            body: >
              PaXini 及其最大 OEM 客户（Unitree、AGIBOT）都是中国实体，受中国《国家情报法》（2017 年）第 7 条约束，必须配合国家情报机关，无论数据存储地点或西方子公司结构如何。American
              Security Robotics Act（2026 年 3 月）具体点名 Unitree 和 AGIBOT。即使 PaXini 没有被法律点名，销售嵌入受法律限制机器人平台的传感器和灵巧手，也会限制
              PaXini 的西方联邦市场，并给企业买方带来舆情风险。隐私政策或服务器位置无法解决这个问题。
            calloutType: risk
