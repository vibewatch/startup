  - id: FE001
    title: PaXini 全栈产品架构图
    type: stack
    layout: wide
    summary: PaXini 的架构是五层技术栈：底层是 Hall-effect 感知物理，其上是 ITPU/HAPTA 集成、灵巧手和人形机器人执行器平台、AI / 软件，顶层是终端应用场景。
    data:
      layers:
        - id: sensing-physics
          label: 第 1 层——Hall-Effect 感知物理
          modules:
            - Hall-effect 磁阵列元件：多轴力到电压转换
            - ITPU GEN2 单元：0.01N 最小力、0.1mm 空间分辨率、1MHz 采样
            - PX-6AX-GEN3 传感器：15 维、12 个型号、<0.5%FS 重复性、IP65、UL94 V-0
            - PX6D/PXTS 6D F/T 传感器：腕部 / 关节力控，轻量级端侧智能
        - id: hapta-integration
          label: 第 2 层——HAPTA 架构 / 感知集成
          modules:
            - HAPTA（Hetero-Array Probing Tactile Architecture）：异构多阵列信号路由
            - 板载触觉算法：毫秒级决策支持
            - 通信输出：EtherCAT、Modbus，最高频率 1000Hz
        - id: actuator-platforms
          label: 第 3 层——执行器平台
          modules:
            - DexH5 GEN1：4 指、9-DOF、4kg 负载、复合材料机身、服务 / 研究
            - DexH13 GEN2：4 指、13-DOF、1140 ITPU + 800MP 摄像头、5kg、工业
            - TORA-ONE（轮式人形）：47 DOF、1956 个传感器、±0.05mm 手臂精度、8kg/臂、8 小时电池
            - TORA-DOUBLE ONE（双足人形）：先进运动控制，原型阶段
        - id: ai-software
          label: 第 4 层——AI / 软件
          modules:
            - OmniVTLA 模型：Vision-Tactile-Language-Action 多模态基础模型
            - HyperCosmos 世界模型：开发中
            - PXCap V 可穿戴设备：82 DOF 捕捉、30 个 6D 模块、3015 点密度
            - OmniSharing DB：云端数据商城（JD Cloud、Tencent Cloud、Baidu AI Cloud）
            - 数据工厂 ×5：覆盖中国 5 个区域，年产能 200M 条
        - id: applications
          label: 第 5 层——终端应用
          modules:
            - 精密制造和汽车装配（引用 JD、BYD、Geely）
            - 物流和仓储拣选放置
            - 医疗健康和康复辅助
            - 商业和家庭服务环境
            - 具身 AI 研究和开发者数据访问
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE014
      - CE022
      - CE029
      - CE032
  - id: FE002
    title: 客户工作流——触觉赋能机器人作业流程
    type: flow
    layout: standard
    summary: PaXini 驱动机器人的端到端工作流，从任务指令开始，经过多模态感知、AI 推理、运动规划、物理执行和闭环触觉反馈。
    data:
      nodes:
        - id: n1
          label: 1. 任务指令
          description: 人类操作员或上层 AI 系统下达任务目标（例如抓取物体、装配部件、倒液体）。接口可以是语音、GUI 或程序化接口。
        - id: n2
          label: 2. 多模态感知
          description: 800MP 摄像头检测物体位姿（zero-shot 估计）；1,140 个 ITPU 触觉传感器采集接触前表面数据；LiDAR + SLAM 提供场景地图（TORA-ONE）。
        - id: n3
          label: 3. OmniVTLA AI 推理
          description: 自有 OmniVTLA 多模态模型融合视觉（V）、触觉（T）、语言（L）和动作（A）输入，生成动作策略。模型用 PaXini 200M 条数据集训练。
        - id: n4
          label: 4. 力控运动规划
          description: 系统计算轨迹和力曲线；腕部 PX6D/PXTS 6D F/T 传感器实时提供全身受力状态，用于柔顺运动规划。
        - id: n5
          label: 5. 物理执行
          description: DexH13 或 DexH5 手执行抓取 / 操作。空心杯电机驱动 13 DOF；负载能力 5kg。ITPU 触觉反馈持续提供手内接触状态。
        - id: n6
          label: 6. 触觉反馈闭环
          description: 1,000Hz 实时触觉回读检测滑移、形变和接触几何。反馈在毫秒级调整抓握力和轨迹。闭环重复，直到任务完成。
      edges:
        - from: n1
          to: n2
          label: 目标信号
        - from: n2
          to: n3
          label: 传感器数据（V+T+L）
        - from: n3
          to: n4
          label: 动作策略
        - from: n4
          to: n5
          label: 关节指令
        - from: n5
          to: n6
          label: 手内触觉状态
        - from: n6
          to: n4
          label: 力校正
    claimRefs:
      - CE006
      - CE007
      - CE015
      - CE017
      - CE032
