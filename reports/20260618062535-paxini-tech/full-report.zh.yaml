      - number: '5.4'
        title: 人形机器人平台——TORA-ONE 与 TORA-DOUBLE ONE
        blocks:
          - type: paragraph
            body: >
              PaXini 的人形机器人产品线目前包括两款：TORA-ONE（轮式）和 TORA-DOUBLE ONE（双足），两者都集成了基于 ITPU 的触觉感知生态。


              TORA-ONE 是一款轮式人形平台，身高可在 1.46 至 1.86 米之间调节，共 47 个自由度（身体 21 个、四指仿生手 26 个）。触觉规格为全身表面 1,956 个传感器、7,824
              个通道，支持多维触觉感知。导航和感知由五个单目摄像头、两个深度摄像头、LiDAR 和激光 SLAM 提供，支持 360 度导航和 3D 建图。公司宣称的性能指标包括 ±0.05 mm 手臂定位精度、每臂 8 kg
              负载能力，以及在实时视觉-触觉融合下 8 小时续航。价格按第三方市场列表数据和机构报价估算为 USD 50,000–150,000，并非 PaXini 确认的官方标价。TORA-ONE 于 2024 年发布，并在
              CES 2026 展示了自主执行任务，包括完整制作冰淇淋流程。


              TORA-DOUBLE ONE 是 CES 2026 展出的双足版本，演示了高级越障运动控制和与访客握手互动。截至运行日期，TORA-DOUBLE ONE
              的详细技术规格尚未公开；该平台看起来仍处于演示或商业化前阶段。


              基于 PaXini 营销材料及其与 JD、BYD、Geely 的合作公告，两款机型都定位于工业制造、汽车装配、物流、医疗 / 康复和商业服务场景。
