companyProfile:
  summary: "PaXini Technology (Shenzhen) Co., Ltd. was incorporated in Shenzhen on 2021-06-29 and is marketed as PaXini Tech. The company positions itself as a full-stack embodied-AI supplier spanning PX-series tactile and force sensors, DexH-series dexterous hands, TORA humanoid robots, and a multimodal data infrastructure stack built around its ITPU/HAPTA tactile architecture and OmniVTLA model ambitions. Public evidence indicates rapid financing acceleration from a 2022 Pre-A into a 2025 Series A ladder and a March 2026 Series B above RMB 1 billion, but commercial traction evidence remains concentrated in deployments, pilots, and product claims rather than disclosed recurring financials."
  foundedDate: "2021-06-29"
  founders:
    - name: Xu Jincheng
      role: Founder, Chairman, CEO, legal representative
      background: "Waseda University PhD who studied under robotics professor Shigeki Sugano and leads PaXini's technical and corporate agenda."
      claimRefs: [CO013, CO015]
    - name: Nie Xiangru (Mark Nie)
      role: Co-founder and director
      background: "University of Illinois Urbana-Champaign master's graduate with prior operating experience at ZTE, Xiaomi, and NetEase."
      claimRefs: [CO014, CO016]
  foundingLocation: Shenzhen, China
  headquarters: Shenzhen, China
  productSummary: "PX-series tactile and force/torque sensors, DexH-series dexterous robot hands, TORA humanoid robots, and embodied-AI data infrastructure built around tactile sensing and multimodal training."
  customerFocus: "Robot OEMs, automakers, industrial manufacturers, logistics operators, cloud/data ecosystem partners, and research customers needing tactile manipulation and embodied-AI data."
  businessModel: "Primarily hardware sales (sensors, dexterous hands, robot platforms), solution integration for enterprise robotics deployments, and longer-term monetization of embodied-AI data and model infrastructure."
  stage: Late-stage private (Series B / pre-IPO)
  fundingStatus: "Raised more than RMB 1 billion in a March 2026 Series B at a valuation above RMB 10 billion after a rapid 2024-2025 Series A ladder that added BYD and JD.com as strategic backers."
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO006, CO007, CO013, CO014, CO023, CO024, CO026, CO027, CO028, CO040]
