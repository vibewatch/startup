  topStrengths:
    - "Differentiated tactile-sensing position across sensors, dexterous hands, and humanoid integration, with a proprietary ITPU/HAPTA stack and strong academic roots in Sugano Lab."
    - "Strategic cap table and ecosystem alignment with BYD, JD.com, TCL, SAIC, BAIC, and other industrial backers that can become distribution, deployment, or supply-chain anchors."
