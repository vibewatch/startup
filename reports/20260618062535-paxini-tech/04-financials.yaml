  - id: capital-adequacy
    title: Capital Adequacy and Funding Dependency
    body: >-
      PaXini closed its Series B in March 2026, raising more than RMB 1 billion (approximately
      $144.93–$150 million USD, with minor source variation in aggregation methodology). The round was
      led by Huangpu River Capital, Kaitai Capital, and state-backed Xin'an Capital, with 13+
      co-investors including Zhuhai Science and Technology Industry Group, Shanda Capital, Haichuan
      Fund, Guangzhou Emerging Industry Fund, Uni-Trend, Zhilai Capital, LEO LION, Nanling Fund, and
      Xiangcheng Financial Holding. Existing shareholders—including Addor Capital, Yida Capital, and
      TCL Capital—significantly increased their stakes. The total cumulative raise is $144.93 million
      per CB Insights (9 rounds) or $150 million per Tracxn (4 rounds aggregated differently);
      both figures reflect capital raised through March 2026 and the discrepancy stems from
      sub-round aggregation methodology. Cash on hand, monthly burn rate, and remaining runway are
      not disclosed; no estimates can be made without data room access. The company has earmarked
      the Series B proceeds for: (i) hardware upgrade of proprietary perception systems, (ii) expansion
      of its super data collection factories toward ~200 million data entries per year, (iii) R&D on
      OmniVTLA and HyperCosmos AI models, and (iv) commercial pilot expansion and scale deployment.
      PaXini is additionally exploring a Hong Kong IPO (Bloomberg, via CNEVPost, June 2026), working
      with banks on a potential listing application in the coming months; successful execution would
      provide material capital for further expansion. The company's funding trajectory—nine rounds in
      under three years, with round size escalating from seed to >$140M Series B—reflects structural
      dependence on external venture and strategic capital, with the IPO as the next planned liquidity
      and growth-capital event. Deal terms for the Series B (pre-money valuation, liquidation
      preferences, conversion prices, anti-dilution provisions) are all marked non-public on CB Insights.
