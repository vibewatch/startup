  - id: pricing-competitive-context
    title: Pricing Architecture and Competitive Context
    body: >-
      Product pricing data for PaXini is available only through third-party marketplace aggregators
      and analyst commentary, not from official PaXini pricing pages. The DexH5 entry dexterous hand
      is listed at approximately $2,000 per unit on Humanoid.Guide; the DexH13 Gen 2, a more capable
      four-finger hand with 1,140 ITPU tactile processing units, is listed at approximately $17,200.
      The Tora-One humanoid robot system carries an estimated range of USD $50,000–$150,000 based on
      RBTX marketplace quotes and institutional pricing signals on OriginOfBots—list pricing only,
      with realized enterprise discounts unknown. At the sensor component level, CNEVPost citing
      Goldman Sachs research attributes a sensor unit price as low as RMB 199 (~$28) to PaXini's
      multi-dimensional tactile sensors, representing a dramatic cost disruption of what had been a
      laboratory-only technology. Goldman Sachs also reportedly attributes >80% of the global robotic
      tactile sensor market to PaXini, making it a core supplier—a claim that originated in an
      analyst research report not independently accessible to this analysis and should be treated as
      third-party attributed rather than verified. Competitor pricing context: Unitree's G1 humanoid
      robot and H1 platform are positioned as lower-cost consumer-oriented systems, while PaXini's
      Tora-One targets industrial precision tasks at a higher ASP. The wide spread between DexH5
      ($2,000) and DexH13 ($17,200) implies tiered pricing for different robot platform integrations.
      All third-party pricing sources should be treated as marketplace estimates; realized enterprise
      pricing, volume discounts, and multi-year contracts are undisclosed diligence requirements.
