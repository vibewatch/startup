callouts:
  - calloutType: risk
    title: Financial Opacity Is the Central Diligence Blocker
    body: >-
      PaXini has disclosed no revenue, gross margin, burn rate, runway, or unit economics in
      any public forum. CB Insights records zero revenue across all nine funding events. Without
      any revenue anchor, the RMB 10 billion post-money valuation cannot be evaluated on standard
      financial multiples. This opacity is the primary reason the company cannot be underwritten
      on public data alone; a full data room is an absolute prerequisite.
    claimRefs:
      - CI037
      - CI040
      - CI033

  - calloutType: risk
    title: IPO Dependency and Capital Concentration Risk
    body: >-
      The company's funding trajectory—nine rounds in under three years, with escalating round
      sizes—signals structural reliance on external capital. The next major capital event is a
      planned Hong Kong IPO. If market conditions deteriorate or the IPO is delayed, the company
      will require an additional private round; the Series B proceeds' burn rate is unknown,
      making the timing of that risk unknowable from public data.
    claimRefs:
      - CI031
      - CI032
      - CI035

  - calloutType: risk
    title: Disclosed Legal Proceedings Require Independent Due Diligence
    body: >-
      The Chinese corporate registry (AiQiCha) records three business disputes, one filed legal
      case, and one court hearing announcement against PaXini as of the research date. The
      counterparties, amounts at issue, and resolution status are not publicly available. These
      proceedings represent an unquantified contingent liability that could affect financial
      position; independent legal review of court filings is a blocking diligence requirement.
    claimRefs:
      - CI036

  - calloutType: insight
    title: "Goldman Sachs >80% Market Share Claim: Use with Caution"
    body: >-
      The >80% global robotic tactile sensor market share figure attributed to Goldman Sachs is
      cited via a single media article (CNEVPost) and the primary GS report was not independently
      accessed. While the claim is plausible given PaXini's product depth, data factory moat, and
      strategic investor roster, it should not be treated as independently verified market data for
      sizing or competitive positioning assumptions until the original report is reviewed.
    claimRefs:
      - CI026
      - CI038

