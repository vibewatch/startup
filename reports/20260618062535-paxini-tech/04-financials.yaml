chapter:
  number: 4
  title: Financials
  summary: >-
    PaXini Tech has raised approximately $144.93–150 million across nine rounds through March 2026, most recently closing a Series B exceeding RMB 1 billion at a post-money valuation above RMB 10 billion (~$1.4–1.5 billion USD). Revenue, margins, burn rate, and unit economics are entirely undisclosed; the company is a private pre-IPO entity and all financial judgments must be anchored to product pricing proxies, strategic investor testimony, and competitor benchmarks. Hardware sales across three tiers—tactile sensors (entry ~RMB 199), dexterous hands ($2,000–$17,200), and humanoid robots ($50,000–$150,000)—constitute the current revenue base, with data monetization and a Hong Kong IPO representing the two next capital events.

sections:
  - id: revenue-model
    title: Revenue Model and Monetization Strategy
    body: >-
      PaXini operates a three-tier hardware-first revenue model anchored in B2B enterprise sales:
      tactile sensor components, dexterous hand assemblies, and full humanoid robot platforms. The
      company targets industrial OEMs, automotive manufacturers, logistics operators, healthcare
      institutions, and electronics assemblers through direct strategic partnerships—principally BYD,
      JD.com, SAIC, BAIC, and Geely—rather than through a traditional channel or reseller network.
      Revenue is booked when hardware is delivered to the enterprise customer; realized pricing,
      volume discounts, and contract structures are not publicly disclosed. A fourth revenue stream
      is in active development: PaXini plans to open its omni-modality embodied AI data globally via
      a cloud data store, monetizing its claimed output of ~200 million data entries per year. This
      data monetization pathway was not commercially active as of June 2026, and no launch timeline
      or pricing model has been disclosed. Professional integration and support services are mentioned
      in product literature as part of the enterprise offering, but no standalone service revenue
      breakdown is available. The company's investor roster—spanning internet giants (JD.com, Meta
      affiliate LEO LION), automotive OEMs (BYD, SAIC, BAIC, Geely), electronics (TCL, Uni-Trend),
      and state-owned industrial funds—signals an intent to monetize through deep strategic embedding
      rather than transactional volume, which carries customer-concentration risk that cannot be
      quantified from public sources. Revenue recognition policies are not disclosed; hardware product
      lines likely follow standard delivery-based recognition, but enterprise robot deployments may
      use milestone-based models given the integration complexity.
    claimRefs:
      - CI001
      - CI002
      - CI003
