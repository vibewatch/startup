  - id: cost-structure
    title: Cost Structure and Capital Intensity
    body: >-
      PaXini's cost structure is hardware-intensive and compounded by a second capital sink: large-scale
      AI data collection infrastructure. Major cost categories include: (1) proprietary sensor chip and
      ITPU module development, (2) sensor packaging and manufacturing scale-up, (3) five regional
      omni-modality data collection factory clusters across China (North, East, Central, Southwest, and
      South China), (4) GPU compute for OmniVTLA and HyperCosmos model training, and (5) a headcount
      base of 315 insured employees (AiQiCha social insurance records) against an enterprise-grade
      talent profile from Waseda University robotics lineage. The Tracxn-reported 13-employee figure
      is likely a stale index artifact and conflicts with the AiQiCha registry evidence at an order of
      magnitude; the 315 figure is better supported. No gross margin, COGS breakdown, R&D expenditure,
      or operating expense data is publicly disclosed. The most useful industry benchmark is Unitree
      Robotics's FY2025 filing from its STAR Market IPO prospectus (cited by TrendForce), which reports
      a 60% combined gross margin across humanoid and quadruped robots—a hardware robotics company
      achieving this margin suggests high-volume manufacturing scale is achievable, but PaXini is at an
      earlier commercialization stage. PaXini's additional data factory capex has no Unitree parallel,
      creating a structurally heavier cost base than pure robot OEMs. Without COGS or margin data, the
      capex intensity of the five data cluster facilities cannot be estimated. Monthly cash consumption
      is expected to be material given the multi-site physical infrastructure, headcount, and parallel
      model development programs, but the magnitude is an irreducible diligence gap.
