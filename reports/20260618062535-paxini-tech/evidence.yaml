    whyItMatters: >-
      Without revenue data it is impossible to assess valuation multiples, commercialization progress, or the gap
      between deployment announcements and monetized scale.
    diligencePath: >-
      Request audited or management-prepared financials for FY2024 and FY2025 from the company's data room; benchmark
      against comparable sensor and robotics hardware companies.
    relatedQuestionRefs:
