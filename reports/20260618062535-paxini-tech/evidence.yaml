  - type: private-evidence-only
    severity: material
    topic: production-capacity
    missingEvidence: >-
      Annual production capacity, unit shipment volumes, and manufacturing yield data for ITPU sensors and DexH hands
      are not disclosed in any public source reviewed.
    whyItMatters: >-
