  - id: founders-governance
    title: Founders, leadership, and governance
    body: >-
      The founding team traces its origin to the Sugano Laboratory at Waseda University in Tokyo, which is
      widely credited as the birthplace of the world's first humanoid robot. Xu Jincheng (许晋诚) holds a
      doctorate from Waseda and studied directly under Professor Shigeki Sugano, a leading figure in
      humanoid robotics research. After completing his doctorate, Xu returned to Shenzhen and co-founded
      PaXini to commercialize force-tactile sensing expertise from the lab.

      Co-founder Nie Xiangru (聂相如), also known as Mark Nie, holds a Master's degree from the University
      of Illinois at Urbana-Champaign. His prior career spanned ZTE, Xiaomi, and NetEase, with a focus on
      large-account operations in the technology sector—bringing enterprise sales and business development
      capability to complement Xu's technical background. The two founders' combined credentials represent
      strong founder-market fit: deep academic expertise in tactile robotics combined with commercial go-to-
      market experience across China's leading technology companies.

      Xu Jincheng serves concurrently as Chairman of the Board and General Manager (CEO) per the Aiqicha
      company registry. The board also includes Zhang Hengdi, Chen Mei, Jin Feng, and Wang Li as directors,
      and Zhang Jinping as Supervisor. These additional board members are named in the Aiqicha corporate
      filing but their backgrounds are not disclosed in current public sources.

      Per the QCC (Qichacha) shareholder registry, Xu Jincheng holds approximately 18% of the equity and
      Nie Xiangru approximately 8%, making them the two largest individual shareholders. BYD (2025-04-22)
      and JD Technology Information Technology Co., Ltd. (2025-09-12) are also registered shareholders,
      corroborating media reports of their investment.

      Key-person dependence is material: Xu Jincheng is the primary technical architect, the public face
      of the company's academic credentials, and the legal representative. Nie Xiangru is the anchor of the
      commercial and investor-relations function. Neither appears replaceable in the near term without
      affecting the company's positioning and investor trust.
