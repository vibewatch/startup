  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue
      missingEvidence: >-
        PaXini has not publicly disclosed revenue, ARR, or gross margin. No third-party source (Yicai,
        Gasgoo, Equalocean, Tracxn, CB Insights) contains a confirmed revenue figure.
      whyItMatters: >-
        Without revenue data it is impossible to assess valuation multiples, commercialization progress,
        or the gap between deployment announcements and monetized scale.
      diligencePath: >-
        Request audited or management-prepared financials for FY2024 and FY2025 from the company's
        data room; benchmark against comparable sensor and robotics hardware companies.
      relatedQuestionRefs:
        - QO009
    - type: private-evidence-only
      severity: material
      topic: production-capacity
      missingEvidence: >-
        Annual production capacity, unit shipment volumes, and manufacturing yield data for ITPU sensors
        and DexH hands are not disclosed in any public source reviewed.
      whyItMatters: >-
        Market-leadership claims ("global #1 in 6D Hall-effect sensor shipments") cannot be verified
        without independent production volume or market-share data.
      diligencePath: >-
        Obtain production records, shipping manifests, or third-party market-share audits; cross-check
        against reported customer deployment figures at BYD and JD.com.
      relatedQuestionRefs:
        - QO008
    - type: missing-source
      severity: material
      topic: adverse-legal
      missingEvidence: >-
        The specific counterparties, nature, and financial exposure of PaXini's three business disputes,
        one case filing, and one court hearing recorded in Aiqicha are not available in any public source.
      whyItMatters: >-
        Active litigation could affect operations, investor confidence, or IP ownership; undisclosed
        counterparties may include customers, employees, or former partners.
      diligencePath: >-
        Request copies of all dispute filings, settlement agreements, and litigation reserve disclosures
        from PaXini's legal counsel; conduct court-registry searches in Shenzhen and Nanshan courts.
      relatedTableRefs:
        - TO004
      relatedQuestionRefs:
        - QO017
    - type: missing-source
      severity: material
      topic: adverse-regulatory
      missingEvidence: >-
        No public source reviews the export-control, OFAC, or Wassenaar Arrangement implications of
        PaXini's investor base (BYD and BAIC have exposure to US-China trade restrictions) or its
        embodied AI data collection operations.
      whyItMatters: >-
        If PaXini's technology or data is subject to dual-use restrictions, international investor
        participation (LEO LION, Zenith Win HK) could create compliance complexity.
      diligencePath: >-
        Engage export-control counsel to screen the technology category, investor base, and data
        collection methodology; request the company's compliance assessment documentation.
      relatedQuestionRefs:
        - QO017
        - QO019
    - type: missing-source
      severity: minor
      topic: leadership-changes
      missingEvidence: >-
        No public record confirms or denies any leadership departures, executive hires, or organizational
        changes at PaXini since its 2021 founding.
      whyItMatters: >-
        At a five-year-old company with concentrated founder dependency, undisclosed leadership attrition
        is a meaningful governance risk.
      diligencePath: >-
        Cross-reference LinkedIn profiles of QCC/Aiqicha named board members; request org chart and
        tenure data from PaXini's people team.
      relatedTableRefs:
        - TO002
      relatedQuestionRefs:
        - QO018
    - type: enumeration-incomplete
      severity: material
      topic: investor-cap-table
      missingEvidence: >-
        The full capitalization table for PaXini including exact post-Series-B stakes, preferred-share
        classes, anti-dilution provisions, redemption rights, and side letters for all investors is not
        available in public sources. The QCC registry lists 50+ shareholders without economic detail.
      whyItMatters: >-
        Without the full cap table it is impossible to assess control rights, redemption exposure, or
        the true economic interests of strategic investors like BYD, JD, and the Series B lead funds.
      diligencePath: >-
        Request the fully-diluted capitalization table and all shareholder agreements from PaXini's
        CFO or legal counsel; cross-reference with QCC registry dates.
      relatedTableRefs:
        - TO003
      relatedQuestionRefs:
        - QO002
