  topStrengths:
    - >-
      Differentiated tactile-sensing position across sensors, dexterous hands, and humanoid integration, with a
      proprietary ITPU/HAPTA stack and strong academic roots in Sugano Lab.
    - >-
      Strategic cap table and ecosystem alignment with BYD, JD.com, TCL, SAIC, BAIC, and other industrial backers that
      can become distribution, deployment, or supply-chain anchors.
    - >-
      Early commercial proof points in embodied-AI infrastructure and industrial deployment, including the Geely
      manufacturing use case and the cloud-based data marketplace launch.
  topRisks:
    - >-
      No public revenue, margin, burn, or backlog disclosure, making the March 2026 valuation difficult to underwrite
      against proven recurring economics.
    - >-
      Commercial proof remains concentrated in pilots, demos, and partner narratives; broad production-scale customer
      conversion is not yet independently visible.
    - >-
      As a Chinese robotics company, PaXini faces export-control, standards, and data-governance risk as embodied AI
      becomes more strategically sensitive.
  unresolvedGaps:
    - Current recurring revenue, gross margin, and cash runway remain undisclosed.
    - Named customer mix, contract value, and pilot-to-production conversion rates are still opaque.
    - The timing, certainty, and use of proceeds for a potential Hong Kong IPO remain unconfirmed.
    - Independent verification of claimed tactile-sensor market share and data-scale advantage is limited.
