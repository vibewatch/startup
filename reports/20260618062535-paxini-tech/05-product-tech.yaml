  - id: s-humanoid-robots
    title: Humanoid Robot Platform — TORA-ONE and TORA-DOUBLE ONE
    body: |
      PaXini's humanoid robot line currently comprises two models: TORA-ONE (wheeled) and
      TORA-DOUBLE ONE (bipedal), both integrating the ITPU-based tactile sensing ecosystem.

      TORA-ONE is a wheeled humanoid platform with adjustable height from 1.46 to 1.86 meters and
      47 total degrees of freedom (21 in the body, 26 in its four-fingered bionic hands). The tactile
      specification is 1,956 sensors across 7,824 channels enabling multidimensional touch perception
      across the body surface. Navigation and perception are provided by five monocular cameras, two
      depth cameras, LiDAR, and laser SLAM for 360-degree navigation and 3D mapping. Company-claimed
      performance metrics include ±0.05 mm arm positioning accuracy, 8 kg load capacity per arm, and
      8-hour battery life with real-time visual-tactile fusion. Pricing is estimated at USD 50,000–150,000
      based on third-party market listing data and institutional quotes, not an official list price
      confirmed by PaXini. TORA-ONE was launched in 2024 and demonstrated autonomous task execution
      including a complete ice-cream making process at CES 2026.

      TORA-DOUBLE ONE is a bipedal variant shown at CES 2026 demonstrating advanced obstacle-crossing
      motion control and visitor handshake interactions. Detailed technical specifications for
      TORA-DOUBLE ONE are not publicly disclosed as of the run date; the platform appears to be at a
      demonstration or pre-commercial stage.

      Both models are positioned for industrial manufacturing, automotive assembly, logistics,
      healthcare/rehabilitation, and commercial service scenarios, based on PaXini marketing materials
      and partner announcements with JD, BYD, and Geely.
