  - id: s-integration-reliability-roadmap
    title: Integration, Reliability, Support, and Roadmap
    body: |
      Integration with third-party robot platforms is facilitated at the hardware layer through standard
      EtherCAT and Modbus industrial communication protocols on the DexH13 hand. The OmniSharing DB data
      format supports conversion to LeRobot and is compatible with mainstream deep learning frameworks,
      enabling AI developers to consume PaXini training data without custom preprocessing pipelines. The
      company provides both domestic (mkt@paxini.com) and overseas sales channels (sales_global@paxini.com)
      and maintains offices in Shenzhen (HQ), Shanghai, Tianjin, and Suqian. SPiRAL Labs is listed as
      a named research partnership on the official website.

      Published reliability specs include IP65 water/dust resistance, UL94 V-0 flame certification, and
      chip-level magnetic interference immunity on ITPU sensors. Operating temperature range is 0–50°C,
      with overload tolerance to −20–120°C. The DexH13 is rated for over 1 million press cycles and the
      ITPU sensor for over 10 million. These figures are company-claimed; no third-party certification
      body or independent test laboratory is identified in public materials.

      The publicly visible roadmap includes: (1) continued DexH13 GEN2 scale production; (2) OmniVTLA
      model advancement; (3) HyperCosmos multimodal world model development; (4) global expansion of
      the OmniSharing DB data cloud; and (5) expansion of data collection factory capacity. Specific
      timelines, milestone gates, or committed customer delivery dates are not publicly disclosed.
    claimRefs:
