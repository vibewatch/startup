company:
  name: PaXini Tech
chapter:
  number: 5
  title: Product & Technology
  summary: |
    PaXini Tech delivers a full-stack tactile perception and embodied intelligence platform anchored in
    its proprietary HAPTA (Hetero-Array Probing Tactile Architecture) and ITPU (Intelligent Tactile
    Processing Unit) technology, which are rooted in Hall-effect multi-dimensional sensing physics. The
    product matrix spans tactile sensors (PX-6AX-GEN3, 3 series, 12 models; from US$49), dexterous
    hands (DexH5 GEN1 and DexH13 GEN2 with 1,140 ITPU units and dual tactile-plus-vision), and
    humanoid robots (TORA-ONE wheeled; TORA-DOUBLE ONE bipedal), closed by an embodied AI data
    infrastructure of five data factories, a PXCap V wearable collection device, and the OmniSharing
    DB cloud data mall backed by JD Cloud, Tencent Cloud, and Baidu AI Cloud. Company-claimed specs
    include 0.01 N minimum force recognition, <0.5%FS repeatability, 1,956 TORA-ONE tactile sensors,
    and near-200M-entry annual data capacity. A joint academic paper (SJTU/ZJU) reports 84%/80%
    success rates in simulation only. Key diligence gaps include absence of third-party hardware
    certification, undisclosed component supply chain, no public developer API documentation, and
    real-world deployment outcomes unconfirmed at scale.

sections:
  - id: s-product-overview
    title: Product Line, SKU Map, and Customer Workflow
    body: |
      PaXini's commercial portfolio is organized across three tiers that form a closed loop: (1) tactile
      sensors and sensing units sold to robot integrators and OEMs; (2) dexterous hand and humanoid robot
      platforms that integrate those sensors into end-effectors and full-body systems; and (3) an embodied
      AI data infrastructure that captures real-world interaction data and feeds proprietary AI models.
      The company describes this as the "Tactile Sensors – Robot Platform – Embodied Data – Scenario
      Application" closed loop, positioning PaXini as a full-stack infrastructure provider rather than a
      point-solution sensor vendor.

      Customers engage PaXini at different entry points: pure sensor buyers (robot OEMs, university labs)
      purchase ITPU units or the PX-6AX-GEN3 series for integration into third-party arms and grippers;
      dexterous-hand buyers (humanoid robot makers, logistics integrators) acquire DexH5 or DexH13 as
      ready-to-integrate end-effectors; and humanoid-platform buyers (large industrial and healthcare
      accounts such as JD and BYD) deploy TORA-ONE for specific tasks such as automotive assembly and
      goods handling. A separate AI developer segment accesses the OmniSharing DB cloud data mall for
      training data. All tiers are intended to reinforce each other: sensor sales fund hardware IP, robot
      deployments generate proprietary interaction data, and that data trains the OmniVTLA model.
