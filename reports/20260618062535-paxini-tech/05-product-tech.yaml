callouts:
  - calloutType: strength
    title: Proprietary Full-Stack Tactile Ecosystem Is Structurally Differentiated
    body: >-
      PaXini is the only publicly identified company combining Hall-effect ITPU sensors, dual-modal
      (tactile + vision) dexterous hands, whole-body humanoid robots, a proprietary multimodal AI model,
      and a large-scale real-world tactile data collection and distribution infrastructure under one
      corporate roof. This vertical integration creates switching costs at each layer and, if the data
      flywheel operates as described, could compound as more robot deployments generate proprietary data.
    claimRefs:
      - CE001
      - CE038
      - CE039
  - calloutType: risk
    title: All Performance Claims Remain Company-Claimed; No Third-Party Hardware Certification Identified
    body: >-
      Despite a detailed specification sheet, no independent calibration laboratory, ISO/IEC accredited
      test body, or named certification authority has publicly verified PaXini's core sensor or hand
      performance claims (IP65, UL94 V-0, 0.01N resolution, 10M cycle life, ±0.05mm arm accuracy).
      The academic simulation results (84%/80%) do not extend to real-robot deployments. Industrial
      buyers will typically require third-party qualification before high-volume production integration.
    claimRefs:
      - CE007
      - CE008
      - CE010
      - CE033
      - CE034
  - calloutType: risk
    title: Component Supply Chain Is Opaque
    body: >-
      PaXini does not publicly disclose its suppliers for Hall-effect magnetic elements, hollow-cup
      motors (used in DexH13 joints), custom ASICs/PCBs, or structural materials. For a hardware
      company at this product scale, single-source or China-concentrated supply risks are common;
      the absence of any public disclosure makes independent assessment impossible. This is a material
      diligence gap, particularly given US-China trade controls affecting semiconductor and advanced
      sensor components.
    claimRefs:
      - CE046
  - calloutType: insight
    title: OmniSharing DB Cloud Data Mall Is a Potential Platform Wedge
    body: >-
      The March 2026 launch of OmniSharing DB with JD Cloud, Tencent Cloud, and Baidu AI Cloud is
      structurally similar to data-infrastructure plays in other verticals: PaXini captures the data
      via its physical sensing products, cleans and packages it, and distributes it to AI developers
      who cannot source real-world tactile data elsewhere. If the data quality and format compatibility
      claims prove out, this could create significant switching costs for AI research labs and humanoid
      robot companies building on PaXini data.
    claimRefs:
      - CE031
      - CE033
      - CE037

