  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: independent-hardware-certification
      missingEvidence: >-
        Third-party calibration or certification reports from an ISO/IEC-accredited test laboratory
        (e.g., SGS, TÜV, Bureau Veritas) verifying ITPU sensor specs (0.01N, 0.1mm resolution,
        IP65, UL94 V-0, 10M cycle life).
      whyItMatters: >-
        All published sensor specs are company-claimed or echoed from the company's own product listing
        by third-party resellers. Without independent hardware certification, industrial OEM buyers cannot
        validate claims for qualification, and investors cannot assess the risk of misrepresented specs.
      diligencePath: >-
        Request calibration certificates and test reports directly from PaXini; verify certification
        bodies for IP65 and UL94 V-0 markings; commission an independent lab to benchmark sensor
        against published specs.
      relatedQuestionRefs:
        - QE004
        - QE015
        - QE009

    - type: private-evidence-only
      severity: material
      topic: supply-chain-component-sourcing
      missingEvidence: >-
        Supplier identities for Hall-effect magnetic elements, hollow-cup motors (DexH13 joints),
        custom PCB/ASIC, 800MP camera modules, and structural materials; any multi-source or
        geographically diversified supply documentation.
      whyItMatters: >-
        For a hardware company shipping products into US-China trade-controlled areas, single-source
        or China-concentrated supply for advanced components (magnets, ASICs) creates export-control,
        geopolitical, and continuity risks that cannot be assessed from public materials.
      diligencePath: >-
        Request bill of materials (BOM) from PaXini; cross-check against US Entity List; assess
        alternative sourcing options for critical components.
      relatedQuestionRefs: []

    - type: missing-source
      severity: material
      topic: real-world-deployment-outcomes
      missingEvidence: >-
        Independent field data on TORA-ONE and DexH13 performance in production deployments —
        grasp success rate on mixed SKU, MTBF, maintenance cost, integration timeline, and
        failure mode data from JD, BYD, or Geely facilities.
      whyItMatters: >-
        The academic simulation results (84%/80%) are in Isaac Sim, not real production environments.
        Investors and integrators need real-world data to assess whether PaXini products operate
        reliably at scale in the complex, unstructured industrial settings being targeted.
      diligencePath: >-
        Request customer references and permission to perform independent site visits at JD or BYD
        deployment locations; review production incident logs if available.
      relatedQuestionRefs:
        - QE023
        - QE012

    - type: missing-source
      severity: material
      topic: OmniVTLA-model-real-world-validation
      missingEvidence: >-
        Independent benchmark of OmniVTLA on real robot platforms in non-simulation environments;
        publicly released model weights or reproducible evaluation protocol for the SJTU/ZJU paper.
      whyItMatters: >-
        Simulation-to-real transfer gaps are well-documented in robotics research. The 80% average
        success rate in Isaac Sim does not predict deployment performance. Without real-robot
        evaluation, the OmniVTLA model's practical value is unverifiable.
      diligencePath: >-
        Request real-robot evaluation results and a reproducible benchmark protocol from PaXini;
        verify the RoboPaint paper submission and review status; assess whether any independent
        labs have replicated results.
      relatedQuestionRefs:
        - QE007
        - QE008

    - type: missing-source
      severity: minor
      topic: developer-community-engagement
      missingEvidence: >-
        Public GitHub repository activity, API documentation, developer forum presence, or
        developer SDK download data for PaXini's tactile sensor or OmniVTLA integration.
      whyItMatters: >-
        PaXini has no public developer surface (no GitHub, no public API docs found as of run date).
        The practitioner community signal (humanoid.guide, aifitlab) is limited to spec listings
        rather than active developer contributions. This limits assessment of ecosystem depth.
      diligencePath: >-
        Request PaXini SDK documentation, developer portal access, and any public contributor metrics;
        search for PaXini forum discussions on Stack Overflow, GitHub Issues, or Discord.
      relatedQuestionRefs: []

    - type: missing-source
      severity: minor
      topic: TORA-DOUBLE-ONE-specs
      missingEvidence: >-
        Technical specifications, DOF count, sensor count, and production timeline for
        the TORA-DOUBLE ONE bipedal humanoid robot.
      whyItMatters: >-
        TORA-DOUBLE ONE was demonstrated at CES 2026 but no technical specs are publicly disclosed.
        Its commercial readiness and differentiation versus TORA-ONE cannot be assessed.
      diligencePath: >-
        Request product specification sheet from PaXini for TORA-DOUBLE ONE; monitor 2026
        product announcements for formal release of spec data.
      relatedQuestionRefs: []

    - type: missing-source
      severity: minor
      topic: tactile-sensor-technology-comparison
      missingEvidence: >-
        Published head-to-head technical comparison of PaXini's Hall-effect ITPU approach against
        capacitive tactile sensors (Tekscan, PPS) and piezoresistive alternatives in robotic
        manipulation tasks — covering sensitivity, repeatability, noise floor, and durability under
        identical test conditions.
      whyItMatters: >-
        Both Hall-effect and capacitive sensing are mature technologies. Without independent benchmark
        data comparing PaXini's approach to established alternatives, investors and integrators cannot
        verify PaXini's differentiation claims or assess whether the Hall-effect approach has inherent
        tradeoffs (e.g., magnetic interference susceptibility, hysteresis, temperature drift) that
        limit certain use cases.
      diligencePath: >-
        Commission an independent robotics test lab (e.g., TÜV, NIST-affiliated lab) to benchmark
        PaXini ITPU against Tekscan FlexiForce, PPS capacitive, and reference strain-gauge sensors
        on standardized force-measurement tasks; review any published academic benchmarks comparing
        Hall-effect versus capacitive tactile sensing in robotics.
      relatedQuestionRefs:
        - QE010

