  - id: s-differentiation-ip-trust
    title: Differentiation, IP, Supply Chain, and Trust/Safety/Quality
    body: |
      PaXini's claimed differentiation rests on four interlocking advantages: (1) proprietary Hall-effect
      HAPTA/ITPU sensing technology that the company states breaks through "import reliance" in high-end
      tactile sensors for Chinese robotics; (2) the founding team's academic pedigree from the Sugano
      Laboratory at Waseda University, which built the world's first humanoid robot; (3) a closed-loop
      data flywheel—the only company globally, per its own and EqualOcean's characterization, that
      integrates large-scale tactile modality data into full-modal embodied datasets for training; and
      (4) the full-stack product matrix from sensor to robot to AI model.

      Intellectual property: PaXini's Chinese business registry records show 135 patents, 43 software
      copyrights, and 192 registered trademarks. A USPTO trademark filing for PAXINI (Serial No. 99442343)
      was submitted in October 2025, covering categories including robotic lawn mowers and beverage
      processing machines. The patent portfolio is not individually enumerated in public sources and the
      mix of utility patents, utility-model patents, and design patents is not specified.

      Supply chain: PaXini manufactures products from its Shenzhen headquarters with additional offices
      in Shanghai, Tianjin, and Suqian. Specific component suppliers for Hall-effect magnetic elements,
      hollow-cup motors (used in DexH13 joints), custom PCB/ASIC chips, and structural materials are
      not publicly disclosed. This represents a material diligence gap for assessing single-source risk
      and supply continuity.

      Trust and safety: Published safety specs include IP65 and UL94 V-0 (sensor), chip-level anti-
      magnetic immunity, and 200%/300% safe/shock overload ratings. The Chinese business registry
      (AiQiCha) records 3 business disputes, 1 filing record, and 1 court announcement for PaXini
      Technology (Shenzhen) Co., Ltd.; the nature and materiality of these proceedings are not
      publicly detailed.
    claimRefs:
      - CE045
      - CE046
