  - id: comparable-valuation
    title: Comparable Valuation Analysis
    body: |
      PaXini's $1.5 billion valuation sits in a broad peer range. Among US-based pure-play
      humanoid companies, Figure AI is the clear outlier at $39 billion post-Series C —
      reflecting both first-mover branding and BMW factory deployment receipts. Skild AI and
      Physical Intelligence command $14 billion and $11 billion respectively, but both are
      software/AI companies with near-zero capital equipment intensity. Apptronik's $5.5 billion
      valuation reflects a Series A stage with a $935 million raise and Mercedes-Benz as a
      strategic backer. NEURA Robotics at ~$4.6 billion is a better structural comp: hardware
      plus AI foundation model, European market, similar stage. Unitree's IPO target of $6.2
      billion with disclosed 2025 revenue of RMB 1.699 billion and 60% gross margins is the
      most critical benchmark — it establishes what a commercially proven Chinese humanoid
      hardware company is worth on a public exchange. At $1.5 billion and likely $5–15 million
      in annual revenue, PaXini is priced at a substantial premium to Unitree's revenue multiple
      but at a steep discount to its US-listed peers. This spread is partly justified by PaXini's
      earlier stage and pre-revenue status, but it also reflects the Chinese market discount for
      geopolitical and regulatory risk relative to US comparables. The comparable set confirms
      that the sector supports high multiples for proven full-stack companies; PaXini's challenge
      is to close the proof gap.
