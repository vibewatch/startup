chapter:
  number: 8
  title: Valuation
  summary: >
    PaXini Tech closed a Series B exceeding RMB 1 billion in March 2026, establishing a
    post-money valuation above RMB 10 billion (~$1.5 billion). With no public revenue
    figures disclosed, the valuation embeds aggressive commercialization assumptions. A
    conditional Track recommendation is issued: PaXini's tactile sensor moat and full-stack
    VTLA data advantage are real, but the entry price is stretched relative to available
    evidence of recurring commercial revenue.

sections:
  - id: financing-context
    title: Financing Context and Valuation Anchors
    body: |
      PaXini completed its Series B financing on March 6, 2026, raising more than RMB 1 billion
      (~$144–150 million at prevailing exchange rates). The round was led by Huangpu River Capital,
      Kaitai Capital, and state-backed Xin'an Capital, with co-investment from Zhuhai Science and
      Technology Industry Group, Shanda Capital, Haichuan Fund, Guangzhou Emerging Fund, Uni-Trend,
      Zhilai Capital, LEO LION, Nanling Fund, and Xiangcheng Financial Holding. Existing investors
      including Addor Capital (Yida Capital) significantly increased their stakes. The post-money
      valuation exceeded RMB 10 billion (~$1.5 billion), making PaXini one of eight Chinese embodied
      intelligence companies to cross that threshold. Cumulative external capital raised stands at
      approximately $150 million across at least nine financing events since 2023.

      The RMB 10B valuation implies aggressive assumptions. No public revenue or gross-margin
      figures have been disclosed. CB Insights shows zero FY revenue for all tracked rounds.
      At an estimated run-rate revenue of $5–15 million (inferred from deployment scope and
      headcount), the implied revenue multiple spans 100–300x — a range only supportable if
      PaXini achieves rapid, scalable commercialization over the next 12–24 months. Goldman
      Sachs and Morgan Stanley research have named PaXini as an "upstream infrastructure layer"
      in embodied AI, with Goldman crediting it with more than 80% global tactile sensor market
      share. These analyst views support the category thesis but are not independently verifiable
      at this stage. A Bloomberg-reported Hong Kong IPO process — reportedly working with banks
      and potentially filing with HKEX in coming months — introduces an exit catalyst that, if
      realized, could resolve the valuation gap or crystallize it as a permanent overvaluation.
