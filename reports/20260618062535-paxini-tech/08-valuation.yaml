  - id: scenarios
    title: Bull, Base, and Bear Scenarios
    body: |
      Three scenarios bracket the plausible valuation outcome. The bull case assumes PaXini
      becomes a de facto tactile standard for the humanoid robot ecosystem — effectively the
      Bosch Sensortec of embodied AI — with sensors and dexterous hands embedded in robot
      platforms from Unitree, AgiBot, GALBOT, and international OEMs. A successful HKEX listing
      in 2027 at a revenue-growth premium, combined with expanding data-mall licensing and
      OmniVTLA model commercialization, supports an exit valuation of $5–8 billion. Revenue in
      this scenario reaches $50–80 million by 2027 with high gross margins. The base case targets
      a 2028 IPO at $2–4 billion, assuming PaXini converts several pilot deployments into
      multi-year supply contracts, expands the tactile sensor installed base, and demonstrates
      recurring SaaS-style data licensing revenue. The bear case envisions slower-than-expected
      commercialization: pilots do not convert, Unitree accelerates its own sensor development,
      and a flattening Chinese robotics market compresses the TAM. A flat or down-round below
      $1.5 billion becomes necessary by late 2027 to attract growth capital, destroying early
      investor returns.
