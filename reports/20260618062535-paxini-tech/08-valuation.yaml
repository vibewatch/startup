  - id: exit-readiness
    title: Exit Readiness, Diligence Asks, and Thesis-Break Triggers
    body: |
      PaXini's exit readiness is early but advancing. The Hong Kong IPO pathway is being
      actively explored per Bloomberg. Unitree's STAR Market listing committee approval on
      June 1, 2026 — the first embodied AI company cleared on a Chinese A-share exchange —
      has materially improved the IPO environment for sector peers. AgiBot is pursuing an
      alternative listing route. If Unitree's public offering completes at its $6.2 billion
      target, it will set a pricing floor for the entire sector and likely accelerate PaXini's
      HKEX filing. However, PaXini's IPO readiness depends on resolving key diligence gaps:
      audited revenue confirmation, customer contract terms, and cap-table disclosure. The
      most critical thesis-break triggers are failure to convert current pilots into recurring
      contracts within 18 months, loss of tactile market share to an integrated competitor,
      and a geopolitical export restriction targeting Chinese AI-enabled robotics hardware in
      Western markets. The legal dispute record (three business conflicts, one case filing, one
      court hearing on record at AiQiCha) warrants a clean-room review of any outstanding
      litigation before an IPO or anchor investment commitment.
