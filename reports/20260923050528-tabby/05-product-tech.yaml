sections:
- id: section-1
  title: Product Portfolio Overview
  body: "Tabby has expanded from a single-product Pay-in-4 BNPL service into a multi-product financial platform serving consumers\
    \ and merchants across KSA, UAE, and Kuwait. The core Pay-in-4 product splits any purchase into four equal interest-free\
    \ instalments over six weeks, with no late fees charged since 2023, making it fully Shariah-compliant. [CE001] The Tabby\
    \ Card (Visa network) extends BNPL credit and cashback rewards to any Visa-accepting merchant globally, removing the constraint\
    \ of the partner merchant network. [CE002] Tabby Plus is a SAR 19/month subscription tier delivering premium cashback\
    \ and merchant offers, creating a recurring revenue layer and deepening consumer engagement. [CE003] Tabby Shop is an\
    \ in-app merchant discovery and shopping surface that allows consumers to browse 40,000+ partner merchants and access\
    \ exclusive deals, transforming the Tabby app from a payment tool into a commerce destination. [CE004] Tabby Care adds\
    \ consumer purchase protection and warranty coverage for high-value electronics and goods transactions. [CE005] Most significantly,\
    \ the September 2024 acquisition of Tweeq \u2014 a SAMA EMI-licenced digital wallet startup \u2014 brought stored-value\
    \ wallet capabilities and person-to-person transfer functionality to the platform, enabling Tabby to position itself as\
    \ a full neobanking challenger for MENA consumers. [CE006] In April 2026, Tabby obtained a UAE Stored Value Facility (SVF)\
    \ licence from the CBUAE, unlocking equivalent wallet capabilities in the UAE market. [CE037] The breadth of this product\
    \ portfolio, all accessible through a single 4.8-rated app, creates a consumer financial super-app that no other regional\
    \ BNPL player has replicated at comparable scale."
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  tableRefs:
  - TE001
- id: section-2
  title: Module and Capability Map
  body: "Each Tabby product module addresses a distinct user job and deployment context. Pay-in-4 is the mature anchor product\
    \ used by 15 million+ consumers at checkout, both online and in-store via QR code or NFC. [CE008] Evidence of deployment\
    \ is extensive: Pay-in-4 is available at 70,000+ business partners including IKEA, H&M, Noon, and Namshi, and is accessible\
    \ via Shopify, Magento, and WooCommerce plugins as well as custom API integrations. [CE009] The Tabby Card (Visa) is a\
    \ growth-stage product targeted at consumers who want BNPL credit at merchants outside the Tabby network; deployment evidence\
    \ includes the Visa network partnership and in-app card management. [CE002] Tabby Plus targets frequent purchasers who\
    \ want premium cashback; it is deployed as an in-app subscription with month-to-month billing at SAR 19. [CE003] Tabby\
    \ Shop is live across the primary consumer app and serves as the merchant discovery engine, combining curated storefronts,\
    \ deal alerts, and category browsing to drive purchase intent. [CE004] Tabby Care addresses the consumer protection job,\
    \ providing purchase insurance for electronics and high-value items; deployment evidence comes from Tabby's official product\
    \ listings. [CE005] The Tweeq Wallet, the newest module, adds stored-value balance and P2P transfers for KSA users under\
    \ the SAMA EMI licence, with UAE wallet functionality enabled by the April 2026 SVF licence. [CE007] The most significant\
    \ diligence gap across modules is the Tweeq integration depth \u2014 no official launch confirmation for the fully integrated\
    \ wallet experience has been published as of May 2026, making the timeline for neobank positioning uncertain."
  claimRefs:
  - CE005
  - CE006
  - CE007
  - CE008
  tableRefs:
  - TE002
- id: section-3
  title: Technical Architecture
  body: "Tabby's technical architecture is inferred from public job postings, the Tabby for Business merchant portal, GitHub\
    \ activity, and third-party analyst reporting. [CE022] The consumer application is delivered via native iOS and Android\
    \ apps with Arabic and English localisation, integrating checkout deeplinks, instalment management, Tabby Shop browsing,\
    \ and card controls in a single interface. App store ratings of 4.8 reflect strong UX execution. [CE013] Payment processing\
    \ relies on Visa for the Tabby Card and local acquiring bank partnerships for BNPL transactions across KSA, UAE, and Kuwait;\
    \ card network connectivity and acquiring relationships are critical single-dependency risks. [CE024] Credit decisioning\
    \ is performed in real time at checkout using a proprietary scoring engine that combines national ID data, credit bureau\
    \ signals (where available), and Tabby's internal transaction history. Repeat customers benefit from Tabby's proprietary\
    \ repayment track record data, which is a meaningful data moat for thin-file consumers who lack bureau history. [CE023]\
    \ The merchant API layer supports plug-and-play integration with Shopify, Magento, WooCommerce, and custom REST API implementations,\
    \ with sandbox environments and SDKs published via the Tabby for Business portal. [CE025] Cloud infrastructure is not\
    \ publicly disclosed but is inferred to use a major hyperscaler (AWS or GCP equivalent) based on the scale of transaction\
    \ processing and global engineering hiring signals visible in job postings. [CE022] Tabby's GitHub organisation (github.com/tabbyai)\
    \ shows limited public repositories \u2014 primarily merchant SDKs \u2014 consistent with a closed-source fintech architecture\
    \ rather than an open-source platform. [CE040] The absence of a public engineering blog represents a transparency gap\
    \ compared to Stripe or Monzo but is not atypical for a growth-stage MENA fintech."
  claimRefs:
  - CE009
  - CE010
  - CE011
  - CE012
  figureRefs:
  - FE001
  tableRefs:
  - TE003
