  - CE007
  - CE008
  columns:
  - User Job
  - Current Workflow Pain
  - Tabby Solution
  - Measurable Benefit
  - Deployment Evidence
  - Limitation
  rows:
  - - 'Consumer: split large purchase into affordable instalments'
    - Credit cards require existing credit history; not available to thin-file GCC consumers; high interest rates
    - Pay-in-4 at checkout; no credit card required; real-time KYC + proprietary scoring for first-time users
    - Access to instalment credit for 15M+ users including thin-file consumers; sub-second approval for repeat users
    - Live at 40K+ merchants; Shopify/Magento/WooCommerce plugins; QR in-store at KSA malls
    - Purchase limits capped at SAR 10,000; not available outside KSA/UAE/Kuwait
  - - 'Consumer: shop from favourite brands with BNPL credit outside Tabby partner network'
    - BNPL credit restricted to partner merchant list; cannot use at independent or international retailers
    - Tabby Card (Visa) enables BNPL credit at any Visa-accepting merchant globally
    - Extends BNPL reach to full Visa merchant universe; cashback rewards on all card spend
    - Visa card integration; in-app card management confirmed
    - Card credit limits not disclosed; cashback rates vary by merchant tier
  - - 'Merchant: offer BNPL to increase basket size and conversion'
    - Installing BNPL requires technical integration and contract negotiation; uncertain customer uplift
    - Tabby for Business portal; 48-hour plugin integration; access to 15M+ Tabby consumer base
    - Documented basket size uplift and conversion improvement for BNPL-enabled merchants in MENA
    - Tabby business portal live; Shopify app in marketplace; API sandbox available
    - "MDR of 4\u20138% is high relative to card interchange; smaller merchants may find economics challenging"
  - - 'Consumer: manage finances with a stored-value wallet and P2P transfers in KSA'
    - No single app combines BNPL, stored-value wallet, and salary account in GCC without a traditional bank account
    - Tweeq-powered wallet within Tabby app; salary deposits; P2P transfers under SAMA EMI licence
    - Full neobanking functionality for consumers who do not want or cannot access traditional bank accounts
    - SAMA EMI licence confirmed; UAE SVF licence April 2026; wallet product in integration post-acquisition
    - Full wallet integration timeline not publicly confirmed; wallet GMV and adoption not disclosed
  notes: Source-synthesised product summary; some rows are inferred from partner case studies and official pages.
- id: TE003
  title: Technology and operating architecture table
  subtitle: Tabby's key technology layers, roles, dependencies, and risks
  claimRefs:
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  - CE010
  columns:
  - Layer/Component
  - Role
  - Implementation Evidence
  - Dependency
  - Risk
  rows:
  - - Mobile Application (iOS/Android)
    - Primary consumer interface; checkout, instalment tracking, Tabby Shop, card management
    - Native iOS and Android apps; 4.8 app store rating; Arabic and English localisation
    - Apple App Store / Google Play distribution; device OS updates
    - App store policy changes could restrict BNPL checkout deeplinks; OS fragmentation risk in MENA
  - - Payment Processing and Acquiring
    - Authorises and settles BNPL transactions; routes card payments via Visa for Tabby Card
    - Visa partnership for Tabby Card; local acquiring bank partnerships in KSA/UAE/Kuwait
    - Visa network; local acquiring banks; interbank settlement rails in each market
    - Acquiring bank relationship disruption would halt transaction processing; single-market acquiring concentration risk
  - - Credit Decisioning Engine
    - Real-time credit scoring for first-time and repeat consumers at checkout
    - Proprietary scoring using national ID, bureau data, and internal repayment history; sub-second decisions
    - Credit bureau data availability (limited in MENA); national ID verification APIs
    - Model opacity is a diligence risk; thin bureau data in MENA means proprietary data moat but also higher uncertainty;
      credit model not publicly documented
  - - Merchant API Layer
    - Enables BNPL checkout integration for online merchants; webhook notifications; transaction reporting
    - Tabby for Business portal; Shopify/Magento/WooCommerce plugins; REST API with sandbox
    - E-commerce platform plugin compatibility; API versioning maintenance
    - Plugin breakage on platform updates (e.g. Shopify API version changes); merchant self-service support burden
  - - Cloud Infrastructure
    - Hosts all application services; ensures uptime for real-time payment processing
    - Inferred hyperscaler (AWS or GCP equivalent) based on engineering hiring signals; not publicly disclosed
    - Single cloud provider dependency (inferred); data residency requirements in KSA and UAE
    - Cloud provider outage would impact all transaction processing; KSA data residency regulations may require local cloud
      zones
  notes: Source-synthesised product summary; some rows are inferred from partner case studies and official pages.
