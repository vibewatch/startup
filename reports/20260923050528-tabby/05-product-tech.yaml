    - "Mature \u2014 live since 2020"
    - Split any purchase 4x over 6 weeks; no interest; no late fees; online + in-store
    - Shariah-compliant; 15M+ user network; 40K+ merchants
    - Credit-loss rate not public; approval rate not disclosed
  - - Tabby Card (Visa)
    - Frequent shoppers wanting global BNPL reach
    - "Growth \u2014 expanding"
    - Visa-network prepaid/debit card with BNPL credit and cashback at any Visa merchant
    - Extends BNPL beyond partner merchants; cashback rewards
    - Card issuance volumes and interchange revenue not disclosed
  - - Tabby Plus
    - High-frequency consumers seeking premium rewards
    - "Growth \u2014 active subscription"
    - SAR 19/month; premium cashback rates; exclusive merchant deals; priority support
    - Recurring revenue model; drives engagement frequency
    - Subscriber count and churn rate not publicly disclosed
  - - Tabby Shop
    - "All Tabby app users \u2014 discovery-driven shoppers"
    - "Mature \u2014 live and integrated"
    - In-app browsing of 40K+ merchants; curated deals; category navigation; offer alerts
    - Commerce destination beyond payment; advertising monetization potential
    - Revenue contribution from merchant referrals vs. MDR not separated
  - - Tabby Care
    - Electronics and high-value goods purchasers
    - "Early \u2014 selective deployment"
    - Purchase protection and extended warranty for eligible high-value items
    - Non-credit revenue stream; increases consumer trust for high-ticket purchases
    - Penetration rate and claims data not publicly disclosed
  - - Tweeq Wallet
    - KSA and UAE consumers seeking full neobank experience
    - "Early \u2014 integration in progress post-Sep 2024 acquisition"
    - Stored-value wallet; P2P transfers; salary deposits; SAMA EMI and UAE SVF licensed
