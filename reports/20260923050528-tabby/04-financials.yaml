  title: Financials
  summary: "Tabby\u2019s financial story now centers on a $233M Series F at a $6.5B valuation, profitable Saudi operations,\
    \ and total capital that exceeds $1.65B when debt is included."
sections:
- id: section-revenue
  title: Revenue Model and Revenue Streams
  body: "Tabby's primary revenue source is the merchant discount rate (MDR), charged to retailers who integrate BNPL at checkout.\
    \ The MDR represents a percentage of each transaction value paid by the merchant to Tabby in exchange for offering interest-free\
    \ installment payments to consumers and for Tabby absorbing the credit risk on the installment book. MDR rates are not\
    \ publicly disclosed, but global BNPL peers charge 1\u20136% depending on category and merchant size. For Saudi Arabia\
    \ \u2014 Tabby's primary market \u2014 the $378M revenue figure reported for 2025 (up from $267M in 2024, a 42% increase)\
    \ represents Saudi Arabia only and is not consolidated across all markets. The precise revenue split between KSA, UAE,\
    \ and Kuwait is not disclosed. Secondary revenue streams include: Tabby Plus (SAR 19/month subscription from consumers\
    \ for access to rewards and benefits), Tabby Card fee revenue (not disclosed), Tabby Shop affiliate/referral revenue from\
    \ product discovery, and Tabby Care merchant fees for buyer protection coverage. These non-MDR streams are estimated to\
    \ be a small fraction of total revenue currently, though they represent the strategic direction toward direct consumer\
    \ monetisation. The revenue recognition methodology for BNPL platforms is relevant: Tabby likely recognizes MDR revenue\
    \ at the point of merchant transaction (gross basis for the full transaction facilitating amount), or net of the installment\
    \ payouts. The accounting treatment affects the comparability of Tabby's revenue to BNPL peers. No audited financial statements\
    \ are publicly available. All revenue figures cited in this chapter originate from Tabby company claims (press releases\
    \ and investor communications) as reported in news coverage; they have not been independently verified against audited\
    \ accounts."
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  tableRefs:
  - TI001
- id: section-unit-economics
  title: Unit Economics, Margins, and Profitability
  body: "Tabby reported its first net profit for KSA operations: SAR 90.4 million (approximately $24M) in H1 2025, representing\
    \ a 360% year-over-year improvement in the H1 2025 period. For the full year 2025, net profit was reported at approximately\
    \ $55M (or $378M revenue at a 14.5% net margin). These figures, if accurate, demonstrate that Tabby's BNPL model can be\
    \ profitable at scale in Saudi Arabia \u2014 a positive signal ahead of the planned Tadawul IPO. However, several unit\
    \ economics components are not publicly disclosed: gross margin (MDR revenue minus credit losses and payment processing\
    \ costs), customer acquisition cost (CAC), lifetime value (LTV), 90-day repeat usage rate, loss rate per vintage, and\
    \ operating expense structure. The BNPL gross margin structure depends critically on credit loss rates: for a 0%-interest\
    \ consumer product, Tabby's margin on each transaction equals the MDR charged minus credit losses on defaulted installments\
    \ and payment processing costs. In MENA's thin-file consumer market, underwriting quality is critical. A 1% increase in\
    \ default rate can erase 20\u201350% of gross margin depending on MDR level. Tabby's revenue growth trajectory \u2014\
    \ 42% from 2024 to 2025 in Saudi Arabia \u2014 is consistent with a maturing BNPL business that has achieved scale efficiencies.\
    \ The H1 2025 profit margin of approximately 12\u201315% (SAR 90.4M on estimated H1 revenue of SAR 600-700M) suggests\
    \ operational leverage is working, but without audited accounts, these figures cannot be underwritten with high confidence\
    \ by external investors. Cross-market profitability (UAE and Kuwait) is unknown. The aggregate group financials \u2014\
    \ including the costs of the Tweeq acquisition, the JPMorgan securitization facility interest cost, and UAE and Kuwait\
    \ market losses \u2014 may look materially different from the KSA-only figures."
  claimRefs:
  - CI005
  - CI006
  - CI007
  - CI008
  tableRefs:
  - TI002
- id: section-capital
  title: Capital Structure, Funding, and Capital Intensity
  body: "Tabby has raised approximately $480M in equity across Seed through Series E (excluding the Tweeq acquisition) and\
    \ secured $700M in securitization debt from JPMorgan in December 2023. The JPMorgan facility is backed by Tabby's BNPL\
    \ receivables and represents a form of asset-backed lending: Tabby originates BNPL loans to consumers, pools them into\
    \ a receivables vehicle, and JPMorgan provides a warehouse line to fund those receivables, allowing Tabby to recycle capital\
    \ and grow GMV beyond what equity alone would support. This structure is standard for BNPL operators globally (Klarna,\
    \ Affirm, and Afterpay all use similar receivables financing), but it introduces several financial risks: (1) interest\
    \ rate risk \u2014 the cost of the JPMorgan facility is not disclosed but is likely a floating-rate spread, creating earnings\
    \ sensitivity to rate changes; (2) counterparty concentration \u2014 a single $700M facility from one bank creates concentration\
    \ risk if JPMorgan were to reduce or not renew the facility; (3) covenant risk \u2014 securitization facilities typically\
    \ impose performance covenants (loss triggers, dilution triggers) that could restrict Tabby's operations if credit performance\
    \ deteriorates; (4) leverage \u2014 the $700M facility combined with Tabby's equity base means the business is levered,\
    \ amplifying both upside and downside. Tabby's total funding (equity + debt) of approximately $1.18B as of late 2023 (before\
    \ the $160M Series E in February 2025) represents significant capital deployment in service of a $10B GMV run rate. The\
    \ capital efficiency ratio (GMV / total funding) of approximately 8\u201310x suggests a relatively efficient use of capital,\
    \ consistent with BNPL models that turn their receivables portfolio multiple times per year. The Series E at $6.5B valuation\
    \ implies the market values Tabby at approximately 8.7x 2025 Saudi Arabia revenue ($6.5B / $378M), which is a high multiple\
    \ for a regional BNPL operator, justifiable only if Tabby's super-app expansion and IPO premium materialise."
  claimRefs:
  - CI009
  - CI010
  - CI011
  - CI012
  figureRefs:
  - FI001
  tableRefs:
  - TI003
