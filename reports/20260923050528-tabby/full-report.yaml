      - number: '5.3'
        title: Technical Architecture
        blocks:
          - type: paragraph
            body: >-
              Tabby's technical architecture is inferred from public job postings, the Tabby for Business merchant
              portal, GitHub activity, and third-party analyst reporting. [CE022] The consumer application is delivered
              via native iOS and Android apps with Arabic and English localisation, integrating checkout deeplinks,
              instalment management, Tabby Shop browsing, and card controls in a single interface. App store ratings of
              4.8 reflect strong UX execution. [CE013] Payment processing relies on Visa for the Tabby Card and local
              acquiring bank partnerships for BNPL transactions across KSA, UAE, and Kuwait; card network connectivity
              and acquiring relationships are critical single-dependency risks. [CE024] Credit decisioning is performed
              in real time at checkout using a proprietary scoring engine that combines national ID data, credit bureau
              signals (where available), and Tabby's internal transaction history. Repeat customers benefit from Tabby's
              proprietary repayment track record data, which is a meaningful data moat for thin-file consumers who lack
              bureau history. [CE023] The merchant API layer supports plug-and-play integration with Shopify, Magento,
              WooCommerce, and custom REST API implementations, with sandbox environments and SDKs published via the
              Tabby for Business portal. [CE025] Cloud infrastructure is not publicly disclosed but is inferred to use a
              major hyperscaler (AWS or GCP equivalent) based on the scale of transaction processing and global
              engineering hiring signals visible in job postings. [CE022] Tabby's GitHub organisation
              (github.com/tabbyai) shows limited public repositories — primarily merchant SDKs — consistent with a
              closed-source fintech architecture rather than an open-source platform. [CE040] The absence of a public
              engineering blog represents a transparency gap compared to Stripe or Monzo but is not atypical for a
              growth-stage MENA fintech.
