  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Competitor Classification
        blocks:
          - type: paragraph
            body: >-
              Tabby competes across four competitor classes in the MENA BNPL and consumer fintech market. Direct peers
              are licensed BNPL operators serving the same consumer-merchant installment market in Saudi Arabia and UAE:
              Tamara (Riyadh), Postpay (UAE), Cashew (UAE/Saudi), and Spotii (UAE, now absorbed by Zip Australia after
              acquisition). Incumbent alternatives are bank-issued products including credit cards, interest-bearing
              deferred debit, and bank-sponsored installment plans (Saudi banks such as Al Rajhi, SNB, and Riyad Bank
              offering 0% installment plans on major credit cards via Visa/Mastercard networks). Adjacent entrants are
              global BNPL operators that could expand into MENA — Klarna (Swedish, operating in EU and US, no MENA
              presence as of 2026), Afterpay/Block, and Paidy. Status-quo substitutes are cash on delivery (still
              material in KSA) and informal social credit. Internal build refers to large Saudi retailers or e-commerce
              platforms that could develop in-house BNPL capability rather than relying on third-party operators. The
              most material competitive threat today is Tamara, which operates the same Saudi BNPL market, is funded by
              Coatue and Checkout.com, and holds its own SAMA BNPL licence. Second-tier direct competitors (Postpay,
              Cashew) are smaller and primarily UAE-focused. Global entry by Klarna is possible but has not
              materialised, and the regulatory complexity of MENA (SAMA, CBUAE licensing requirements) creates barriers
              that slow global entry. Incumbent bank installment products are a meaningful substitute for consumers who
              already hold credit cards, but given low credit card penetration in Saudi Arabia, the overlap is limited.
              Tabby's competitive strategy has shifted from "be the best BNPL" to "be the primary financial super-app
              for MENA consumers" (Tabby Card, Tabby Plus, Tabby Shop, Tweeq wallet), which expands both the competitive
              surface and the moat.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
