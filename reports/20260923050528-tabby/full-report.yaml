  - id: FE001
    type: stack
    title: Product architecture map
    subtitle: Tabby's technology and product stack from regulatory foundation to consumer-facing surface
    approximationNotes: Stack is illustrative; layer contents based on public product disclosures, job postings, and analyst inference.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
