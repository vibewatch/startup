      - number: '3.2'
        title: Competitor Profiles — Scale, Funding, and Strategy
        blocks:
          - type: paragraph
            body: >-
              Tamara is Tabby's most direct and credibly-funded competitor. Headquartered in Riyadh, Tamara raised a
              Series B (reported at $210M by multiple sources) from Coatue Management and Checkout.com in 2022–2023,
              making it one of the best-funded BNPL startups in MENA outside of Tabby. Tamara holds a SAMA BNPL licence
              and focuses on the Saudi consumer market. Tamara's product scope covers Pay in 3 and Pay in 4, Tamara
              shopping app, and merchant integrations with Shopify and WooCommerce. Tamara does not appear to have a
              debit card or subscription product analogous to Tabby Card or Tabby Plus, which represents a
              differentiation gap if Tabby's super-app strategy succeeds. No audited revenue or GMV figures for Tamara
              are publicly available as of the research cutoff. Postpay is a UAE-based BNPL operator founded in 2019. It
              secured backing from investors including VCs and is licensed by the UAE Central Bank. Postpay's product
              scope is narrower than Tabby's, focusing on Pay-in-4 for UAE merchants. No material public data on revenue
              or user count is available. Postpay appears to have a predominantly UAE footprint with no disclosed KSA
              licence, which limits its competitive threat to the UAE market segment. Cashew is a Dubai-headquartered
              BNPL operator with UAE and Saudi presence, targeting similar consumer and merchant segments to Tabby,
              particularly in fashion and lifestyle verticals. Cashew has raised funding but at a scale well below Tabby
              or Tamara. Spotii was a UAE BNPL startup that was acquired by Zip Australia (ASX: ZIP) in 2021, making it
              the first significant MENA BNPL M&A transaction and demonstrating global operator interest in the region.
              Following the Zip acquisition, Spotii appears to have been absorbed into Zip's global operations with
              limited continued investment in MENA-specific growth. Klarna, the world's largest private BNPL company
              with $7B+ in GMV and operations across 20+ countries, has not entered the MENA market as of early 2026.
              Klarna's entry would represent the most material competitive threat to Tabby's premium market position if
              it obtained SAMA and CBUAE licences and leveraged global brand recognition.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: Capability, Pricing, and Distribution Comparison
        blocks:
          - type: paragraph
            body: >-
              Tabby leads on breadth of product offering, network scale (20M+ users, 40K+ merchants), and regulatory
              footprint (SAMA BNPL permit, SAMA EMI licence via Tweeq, CBUAE SVF licence). On pricing, merchant discount
              rates are not publicly disclosed by any MENA BNPL operator, making a direct MDR comparison impossible from
              public sources. Based on global BNPL benchmarks, MENA operators likely charge 1–5% MDR with variations by
              category and merchant size. Consumer pricing across all major MENA BNPL operators (Tabby, Tamara, Postpay,
              Cashew) is zero fees if payments are on time — a market-wide feature, not a differentiator. Late fees vary
              by operator and regulatory jurisdiction. Tabby's differentiation on distribution rests on: (1) largest
              merchant network in MENA (40K+), creating a network effect where consumers install Tabby because it is
              available at the most merchants; (2) Tabby Card as a physical card enabling offline and in-store payments,
              extending reach beyond e-commerce; (3) Tabby Plus as a retention and monetization tool that builds habit
              and loyalty among the most active users; (4) Tabby Shop as a discovery layer reducing consumer CAC by
              driving product search intent natively. No competitor has replicated this full-stack product suite.
              Tamara's closest product equivalents lack the card and subscription components based on available public
              information. On trust and regulatory posture, Tabby's SAMA licences and CBUAE licence, combined with
              JPMorgan as a debt partner, position it as the most institutionally-endorsed MENA BNPL operator — a trust
              signal relevant for both merchant adoption and future IPO investors. Switching cost for consumers is low:
              all BNPL apps are installed on the same smartphone and can be selected at checkout. The key switching
              driver is merchant coverage — consumers use whichever app is available at their preferred merchant. This
              dynamic means merchant acquisition is the primary competitive battleground, not consumer-facing features.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
