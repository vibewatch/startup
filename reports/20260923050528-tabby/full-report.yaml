      Scenario valuations are analyst estimates based on public evidence only; Tabby has not issued formal financial
      guidance.
    columns:
      - Scenario
      - Key Assumptions
      - Valuation Range
      - Return Logic
      - Key Risks
      - Probability Signal
    rows:
      - - Bull
        - 2026-27 IPO at 20x forward revenue; Tweeq wallet MAU >2M; UAE expansion accelerates; 2026E revenue ~$600M
        - $6B–$8B
        - 33-78% upside from $4.5B secondary; 3-4 year hold for public market re-rating
        - Regulatory shift or IPO market dislocation
        - Low-medium; requires wallet acceleration and benign regulatory environment
      - - Base
        - >-
          2027 IPO at 15x forward revenue; KSA-dominant growth continues; moderate UAE contribution; 2027E revenue
          ~$520M
        - $4.5B–$6B
        - 0-33% upside from $4.5B; flat to modest gain on 2-3 year horizon
        - Delayed IPO or credit loss normalization compresses multiple
        - Medium; consistent with current trajectory if execution holds
      - - Bear
        - >-
          SAMA tightening caps credit limits; IPO delayed >2027; competitor fee pressure squeezes margins; 2026E revenue
          stalls at $350M
        - $2.5B–$3.5B
        - 22-44% loss from $4.5B; potential down-round if IPO deferred beyond 2028
        - Credit loss spike or regulatory non-renewal
        - Low-medium; tail risk but non-trivial given regulatory uncertainty
