  rows:
  - - Consumer/Shopper
    - User and Payer (instalment repayments)
    - Interest-free Pay-in-4 BNPL at checkout; Tabby Card BNPL at any Visa merchant; Tabby Shop discovery
    - 15M+ registered users; 80%+ in KSA; predominantly millennial and Gen Z
    - MDR-funded by merchants; consumer pays no fees; Tabby Plus subscription SAR 19/month adds direct consumer revenue
    - Cohort retention and repeat purchase rates not publicly disclosed; NPS and MAU not disclosed
  - - "Merchant \u2014 Large Enterprise"
    - Buyer of BNPL payment service and customer acquisition channel
    - BNPL at checkout to increase basket size and conversion; access to Tabby 15M+ consumer base via Tabby Shop
    - 40K+ total merchants; named enterprise includes Amazon, SHEIN, IKEA, H&M, Samsung, Noon, Al Futtaim, Landmark, Apparel,
      Chalhoub
    - Merchant discount rate (MDR) 4-8%; strategic value as consumer acquisition funnel and brand discovery channel
    - Top-merchant GMV concentration unknown; no public per-merchant volume or MDR data; NRR/GRR not disclosed
  - - "Merchant \u2014 SME/Independent"
    - Buyer of BNPL payment service
    - Increase checkout conversion and average basket size; reduce payment friction for price-sensitive consumers
    - Majority of 40K+ merchant count likely SME; no sub-segment count disclosed
    - MDR revenue per merchant lower than enterprise but large volume; SME merchants benefit from Tabby Shop discovery exposure
    - SME merchant churn rate unknown; support costs per SME integration may compress margin; self-service onboarding friction
      not quantified
  - - "Power User \u2014 Tabby Plus Subscriber"
    - Payer (subscription fee) and User (premium cashback and deals)
    - Monthly SAR 19 subscription for premium cashback rates; exclusive merchant deals; priority support; elevated credit
      limits
    - Subscriber count not disclosed; inferred from Tabby Plus feature prominence in official communications
    - Recurring SaaS-like revenue stream; higher lifetime value than standard consumer; reduces churn by creating subscription
      stickiness
    - Subscriber count, churn rate, and payback period not publicly disclosed; cashback rate economics not independently verified
  notes: Segment metrics are company-reported; independent third-party verification of user counts, merchant counts, and MDR
    rates is not available. Segment revenue split is not publicly disclosed.
