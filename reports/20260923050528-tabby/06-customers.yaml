sections:
- id: section-1
  title: Customer Base Segmentation
  body: "Tabby addresses two structurally distinct customer segments: business-to-consumer (B2C) retail shoppers and business-to-business\
    \ (B2B) merchant partners. [CU001] The consumer segment encompasses over 15 million registered users distributed predominantly\
    \ across Saudi Arabia (80%+), UAE, and Kuwait. [CU003] The core user demographic skews strongly toward millennials and\
    \ Generation Z \u2014 digital-native, credit-averse consumers who prefer interest-free instalment purchasing over traditional\
    \ bank credit cards or revolving debt. [CU010] This demographic preference aligns with GCC population dynamics, where\
    \ over 60% of Saudi Arabia's population is under 35 years old, creating a structurally receptive base for BNPL adoption.\
    \ Consumer use cases span fashion purchases, consumer electronics, home furnishings, travel bookings, and grocery spending\
    \ \u2014 verticals with elevated average order values and high repeat purchase frequency. [CU033] The merchant segment\
    \ comprises 40,000+ business partners whose primary job-to-be-done is converting browser visits into paying customers;\
    \ Tabby's BNPL reduces checkout friction by eliminating the upfront full-payment barrier. [CU002] Merchant scale spans\
    \ from independent SME retailers through to global enterprise brands and large retail conglomerates. Enterprise merchant\
    \ relationships include prominent names across fashion, electronics, luxury, and home categories. [CU040] The two-sided\
    \ platform structure creates a reinforcing network dynamic: consumer network scale directly amplifies merchant acquisition\
    \ value, and the 40,000+ merchant catalogue is itself a consumer recruitment and retention asset. [CU001, CU002]"
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  tableRefs:
  - TU001
- id: section-2
  title: Adoption Trajectory and Growth Metrics
  body: "Tabby's adoption trajectory is underpinned by multiple independently corroborated data points signalling rapid scale\
    \ across users, merchants, and financial performance. [CU004] The platform processed over $10 billion in annualized transaction\
    \ volume as of 2025 \u2014 a step-change from sub-$1 billion at the time of Series A fundraising, representing a 10x+\
    \ increase over the growth phase. For the KSA segment \u2014 Tabby's dominant market \u2014 reported revenue was approximately\
    \ $267 million for full-year 2024. [CU005] By 2025, KSA revenue grew to approximately $378 million on the same basis,\
    \ implying approximately 41% year-on-year growth in the core market. [CU006] The most striking metric is H1 2025 KSA net\
    \ profit: SAR 90.4 million, representing a 360% year-on-year increase over H1 2024 \u2014 a growth rate that signals operational\
    \ leverage and improving unit economics at scale. [CU007] Two consecutive profitable years \u2014 achieved during a period\
    \ of aggressive BNPL expansion \u2014 signal a business model generating cash from operations rather than merely growing\
    \ at the expense of margin. [CU009] Fundraising trajectory further corroborates adoption: Series D ($200M at $1.5B valuation,\
    \ November 2023) was followed by Series E ($160M at $6.5B valuation, February 2025), with a secondary transaction at an\
    \ implied $6.5B valuation in April 2025. [CU031, CU032, CU037] Merchant network growth \u2014 from launch to 40,000+ partners\
    \ \u2014 reflects the supply-side adoption that enables and sustains consumer transaction volume at the claimed scale.\
    \ [CU002]"
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  tableRefs:
  - TU002
- id: section-3
  title: Named Merchant Customer Proof
  body: "Tabby's merchant proof extends beyond logo collections to include named production deployments across multiple verticals\
    \ and market segments. [CU020] Amazon, the global e-commerce leader, deploys Tabby BNPL at checkout for Saudi and UAE\
    \ customers \u2014 one of Tabby's most credible production proof points given Amazon's rigorous vendor evaluation standards\
    \ and global brand visibility. SHEIN, the dominant Gen Z fast-fashion platform, represents high-frequency low-basket-size\
    \ transactions at scale \u2014 precisely the repeat-purchase behaviour that builds consumer retention. [CU021] Adidas\
    \ and H&M provide international brand-name fashion proof across sport and mass-market segments. [CU022, CU024] IKEA serves\
    \ as the anchor proof in the home furnishings category, where high average order values make instalment credit particularly\
    \ conversion-relevant. [CU023] Samsung validates the consumer electronics vertical with global brand credibility. [CU025]\
    \ Noon, the UAE-headquartered MENA e-commerce platform, provides regional digital commerce proof. [CU026] Enterprise group\
    \ relationships include Al Futtaim Group, a diversified UAE retail conglomerate; Landmark Group, one of the largest retail\
    \ conglomerates in the Middle East and Africa; Apparel Group, a lifestyle and fashion retail operator with 80+ brands\
    \ across 14 countries; and Chalhoub Group, a luxury goods distributor operating LVMH and premium brands across the GCC.\
    \ [CU027, CU028, CU029, CU030] Named merchant proof spans fashion, electronics, home, luxury, and mass e-commerce \u2014\
    \ the five highest-GMV BNPL categories in the regional market. The primary evidence gap is that only 11 merchants have\
    \ been independently verified against the claimed 40,000+ merchant base."
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
