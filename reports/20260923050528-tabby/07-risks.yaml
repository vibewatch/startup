  title: Risks
  summary: "Tabby\u2019s main risks are regulatory dependence, credit performance opacity, competition, and the valuation\
    \ multiple required for the IPO story."
sections:
- id: section-1
  title: Risk Overview and Severity Ranking
  body: "Tabby's risk profile spans six distinct domains: regulatory/legal, operational/security, partner/dependency, financial/model,\
    \ people/execution, and competitive. Of these, regulatory tightening presents the highest severity given that Tabby's\
    \ SAMA BNPL permit underpins over 80 percent of its user base in Saudi Arabia. Non-renewal or material condition changes\
    \ to the permit would be existential for the KSA business and likely delay or derail the planned Tadawul IPO. IPO execution\
    \ risk ranks as the second-highest priority: market window uncertainty, Saudi CMA prospectus requirements, and mandatory\
    \ audited consolidated accounts represent substantive execution hurdles that could slip the timeline significantly. Third\
    \ in severity is the $700M JPMorgan receivables securitization facility \u2014 a single counterparty providing the working\
    \ capital engine for the entire BNPL receivables book. A covenant breach, credit deterioration event, or non-renewal of\
    \ this facility would constrain GMV capacity and force expensive refinancing or equity dilution. Competitive risk from\
    \ Tamara, the nearest Saudi BNPL rival, and global entrants such as Klarna compresses merchant fee economics and creates\
    \ MDR deflation risk over a multi-year horizon. Operational risk \u2014 platform uptime, fraud, and data security \u2014\
    \ is rated medium-high given the 25M+ user PII exposure; however, the absence of any publicly documented major incident\
    \ to date provides cautious comfort. People risk is concentrated in Hosam Arab, whose public profile, investor relationships,\
    \ and operational leadership create meaningful key-person dependency, though the CTO/COO Daniil Barkalov provides partial\
    \ mitigation through technical and operational depth. The two consecutive profitable years (KSA 2024 and 2025) materially\
    \ reduce financial model risk, creating a cash buffer against regulatory or competitive shocks that would have been debilitating\
    \ at an earlier funding stage."
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  tableRefs:
  - TR001
- id: section-2
  title: Regulatory and Legal Risk
  body: "Tabby's regulatory risk architecture is anchored by its SAMA BNPL permit issued in July 2022, which authorises buy\
    \ now, pay later operations in the Kingdom of Saudi Arabia. This permit is subject to SAMA's ongoing supervision, and\
    \ its renewal conditions \u2014 including capital adequacy thresholds, consumer protection requirements, and credit limit\
    \ caps \u2014 are not publicly disclosed, creating a material diligence gap. Saudi Arabia's broader financial regulation\
    \ landscape has been tightening: SAMA issued revised BNPL Service Providers Regulations that impose merchant and consumer-facing\
    \ disclosure requirements and mandate transparent fee structures. Tabby's Shariah-compliant no-late-fees model provides\
    \ a structural advantage under these rules but does not eliminate renewal risk if SAMA raises capital or operational requirements\
    \ above Tabby's current position. In the UAE, the Central Bank of the UAE (CBUAE) granted Tabby a Stored Value Facility\
    \ (SVF) licence in April 2026, enabling regulated payments operations. However, CBUAE's BNPL-specific supervisory framework\
    \ for credit providers remains in evolution through 2025-2026, and new circulars could impose stricter credit exposure\
    \ limits or disclosure obligations. Kuwait's Central Bank (CBK) is at an early stage of BNPL oversight, representing lower\
    \ but still non-zero risk given Tabby's presence in that market. The Saudi Personal Data Protection Law (PDPL), which\
    \ came into force in 2022 and entered enforcement phase in 2024, creates direct obligations for Tabby given its 15M+ consumer\
    \ PII dataset spanning biometric identity verification, payment history, and device data. A PDPL enforcement action triggered\
    \ by a data breach or inadequate data governance programme could result in material fines and reputational damage. Tweeq's\
    \ EMI licence under SAMA adds a second regulatory track that must be maintained in parallel with the BNPL permit, doubling\
    \ the compliance surface area. Consumer credit disclosure rules in KSA and UAE are tightening through 2025, and legal\
    \ counsel review of Tabby's current consumer-facing documentation is a recommended diligence step. No public record of\
    \ SAMA enforcement actions against Tabby has been identified in retained sources."
  claimRefs:
  - CR005
  - CR006
  - CR007
  - CR008
  tableRefs:
  - TR002
- id: section-3
  title: Operational and Security Risk
  body: "Tabby's operational risk profile is dominated by three vectors: platform availability, fraud and credit default management,\
    \ and data security. As a high-throughput consumer fintech processing millions of BNPL transactions across three markets,\
    \ any significant platform downtime during peak shopping periods \u2014 such as Ramadan or Saudi National Day \u2014 could\
    \ result in material GMV loss and merchant relationship damage. Tabby does not publicly disclose its uptime SLA or incident\
    \ history, creating an evidence gap for operational resilience assessment. Payment fraud is an endemic risk for BNPL operators\
    \ globally. Unlike traditional card networks that share fraud liability with merchants and issuers, Tabby absorbs first-loss\
    \ credit risk on unpaid instalments. The absence of public fraud rate disclosure prevents assessment of whether Tabby's\
    \ machine-learning credit scoring effectively suppresses fraud at the rates achieved by more mature global peers such\
    \ as Klarna or Affirm. Any spike in first-payment default fraud \u2014 a known BNPL attack vector in which fraudsters\
    \ exploit the first instalment grace period \u2014 could significantly impair credit loss performance. The PII dataset\
    \ of 15M+ registered consumers represents a high-value target for cybersecurity threats. Identity verification data, payment\
    \ history, device fingerprints, and potentially biometric data collected during onboarding are all stored by Tabby. A\
    \ material data breach would trigger PDPL notification obligations in Saudi Arabia and potential CBUAE requirements in\
    \ UAE, with associated fine exposure and severe reputational damage. Tabby's payment processing infrastructure is dependent\
    \ on Visa and Mastercard networks for the Tabby Card product and card-based merchant disbursements; network outages or\
    \ fee schedule changes imposed by these networks would directly affect operational costs and the Tabby Card product economics.\
    \ Merchant churn risk from competitors offering lower MDR pricing is a secondary operational risk that erodes the merchant\
    \ network defensibility over time. Trustpilot reviews of Tabby surface consumer complaints primarily around payment dispute\
    \ resolution timelines and merchant delivery issues incorrectly attributed to Tabby's payment system, indicating customer\
    \ service operational gaps worth monitoring."
  claimRefs:
  - CR009
  - CR010
  - CR011
  - CR012
  figureRefs:
  - FR001
  tableRefs:
  - TR003
