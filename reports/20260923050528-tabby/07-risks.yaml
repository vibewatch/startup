  - Residual Exposure
  rows:
  - - JPMorgan $700M Receivables Facility
    - JPMorgan
    - Primary working capital for BNPL receivables book; enables GMV growth beyond equity capacity
    - Single counterparty; no disclosed alternative facility
    - Covenant breach or non-renewal constrains GMV capacity; forces expensive refinancing
    - Critical
    - JPMorgan credit diligence validates loss model; 18+ months of continued availability is positive signal
    - Facility terms undisclosed; covenant thresholds unknown; refinancing risk if credit conditions deteriorate
  - - Visa Network
    - Visa
    - Card network for Tabby Card (Visa debit); payment rails for merchant disbursements
    - High concentration; Tabby Card product fully dependent on Visa network
    - Network outage or fee increase directly disrupts Tabby Card transactions
    - High
    - Global Visa network infrastructure is highly resilient; geographic redundancy
    - Fee schedule changes unilaterally imposed; KSA sanctions events could affect network availability
  - - Mastercard Network
    - Mastercard
    - Alternative payment rail for merchant disbursements and potential card issuance
    - Medium concentration; secondary to Visa for current product
    - Network disruption affects merchant settlement processing
    - Medium
    - Dual-network exposure reduces single-network dependence
    - Contract terms not disclosed; dependency level not quantified publicly
  - - Cloud Infrastructure (AWS/GCP)
    - AWS / GCP (inferred)
    - Hosting and compute for Tabby's platform, scoring models, and transaction processing
    - High concentration in likely single primary cloud provider
    - Regional availability zone outage during peak periods causes platform downtime
    - High
    - Cloud providers maintain multi-AZ redundancy; enterprise SLAs typically 99.9%+ uptime
    - Provider identity not confirmed; disaster recovery plan not publicly disclosed
  - - SAMA Regulatory Approval
    - Saudi Arabian Monetary Authority
    - Permit for BNPL and EMI operations; approval for new products and model extensions
    - Single-regulator concentration for KSA operations (80%+ of user base)
    - Permit denial or adverse condition change eliminates KSA business
    - Critical
    - Track record of compliance; SAMA mandated Tabby as a listed BNPL operator
    - Approval timelines are opaque; new product launches gated by SAMA review
