company:
  name: Tabby
chapter:
  number: 1
  title: Company Overview
  summary: Tabby is a Riyadh-headquartered MENA consumer-finance platform that has moved from BNPL into a broader money app,
    now reporting 25M users, 70k business partners, and a $6.5B Series F valuation.
sections:
- id: section-identity
  title: Identity, Headquarters, and Business Model
  body: 'Tabby is a buy now, pay later (BNPL) and consumer financial services platform founded in 2019 in Dubai, United Arab
    Emirates, by Hosam Arab (CEO) and Daniil Barkalov (CTO/COO). The company originally operated from Dubai but relocated
    its headquarters to Riyadh, Saudi Arabia, ahead of a planned listing on the Saudi Tadawul stock exchange. On its current
    site, Tabby describes itself as MENA''s leading shopping and financial services app, offering four core products: Pay
    in 4 (interest-free BNPL in four installments), the Tabby Card (a Visa debit card with embedded BNPL capability), Tabby
    Plus (a subscription rewards programme priced at approximately SAR 19 per month), and Tabby Shop (a product discovery
    and merchant marketplace surface). The company also offers Tabby Care, a buyer-protection and purchase warranty product.
    Through its September 2024 acquisition of Tweeq, a Saudi-licensed electronic money institution, Tabby added digital wallet
    infrastructure that enables spending, sending, and money management. A UAE Stored Value Facility licence was granted by
    the Central Bank of the UAE on 15 April 2026, extending Tabby''s regulated payments footprint into that market. Tabby''s
    core business model earns merchant discount revenue when retailers pay a percentage of each transaction to offer BNPL
    at checkout. The platform serves consumers in Saudi Arabia, the UAE, and Kuwait, with Saudi Arabia accounting for more
    than 80 percent of its user base. With 25M+ registered users, 70,000+ business partners, and an annualized transaction
    volume exceeding $18B as of September 2026, Tabby has achieved significant scale as the dominant BNPL operator in the
    Kingdom and a major force across the wider MENA region.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  tableRefs:
  - TO001
- id: section-founders
  title: Founders, Leadership, and Governance
  body: 'Hosam Arab co-founded Tabby in 2019 after previously co-founding and serving as CEO of Namshi, the Middle East fashion
    e-commerce platform that was sold to Global Fashion Group. This operational background in regional e-commerce gave Arab
    first-hand insight into the friction consumers face at checkout, forming the founding thesis for Tabby''s BNPL model.
    Daniil Barkalov, Tabby''s CTO and COO, brings the technical infrastructure leadership alongside Arab''s commercial and
    market-development expertise. The founding pair represents a strong founder-market fit for MENA consumer fintech: Arab''s
    Namshi track record created early credibility with regional retailers and investors. Tabby''s investor base functions
    as an informal governance layer given the company''s private status. Wellington Management led the Series D, marking institutional
    quality validation. Mubadala Capital (Abu Dhabi sovereign wealth) and Hassana Investment Company (Saudi pension-fund manager)
    are material shareholders, bringing Gulf sovereign capital with implicit soft-governance expectations. STV, the Saudi-based
    VC, and Blue Pool Capital (Hong Kong) also hold meaningful equity stakes. PayPal Ventures invested in Series D, the first
    Gulf fintech to receive their backing. The board composition and voting-rights structure are not publicly disclosed, representing
    a key governance gap for investors conducting pre-IPO diligence. Key-person dependency on Hosam Arab is rated high: his
    public profile, media presence, and operating role are the primary face of the company. Succession depth below the founding
    duo is not publicly disclosed.'
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO008
  tableRefs:
  - TO002
- id: section-funding
  title: Funding History, Valuation, and Capital Structure
  body: "Tabby's capital formation journey from a $2M seed in 2019 to a $6.5B Series F in 2026 constitutes one of the most\
    \ accelerated venture funding histories in Middle East and North Africa fintech. The company raised $2M in seed funding\
    \ in 2019 from Global Founders Capital, Arbor Ventures, and Wamda Capital. A $7M round in 2020 enabled expansion into\
    \ Saudi Arabia. The $23M Series A in December 2020 was led by Arbor Ventures and Mubadala Capital, with STV, Raed Ventures,\
    \ and JIMCO participating. In 2021, Tabby secured $50M in debt from Partners for Growth to fund its receivables book.\
    \ The $50M Series B in 2022 at a $300M valuation was led by Global Founders Capital and STV, with Delivery Hero as a strategic\
    \ investor. Series D in November 2023 at $1.5B valuation ($200M raise led by Wellington Management) made Tabby MENA's\
    \ first fintech unicorn. The Series D was extended in December 2023 with $50M more equity and a landmark $700M receivables\
    \ securitization arranged by JPMorgan \u2014 the largest debt financing ever arranged for a MENA fintech. Series E in\
    \ February 2025 raised $160M at a $3.3B valuation, led by Blue Pool Capital and Hassana Investment, making Tabby MENA's\
    \ most valuable VC-backed company. A subsequent secondary share sale in April 2025 reportedly implied a valuation of approximately\
    \ $4.5B. Total equity raised is estimated at over $643M through Series F. With $700M+ in receivables financing, total\
    \ capital deployed in support of Tabby's business exceeds $1.65B. An IPO on the Saudi Tadawul is in planning, with JPMorgan,\
    \ HSBC, and Morgan Stanley mandated as advisers."
