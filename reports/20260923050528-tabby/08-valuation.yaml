  title: Valuation
  summary: "Tabby\u2019s valuation now sits at $6.5B, which makes the company look like a premium platform bet rather than\
    \ a cheap BNPL comp."
sections:
- id: section-1
  title: Investment Thesis and Anti-Thesis
  body: "Tabby's investment thesis rests on four structural pillars. First, MENA-first BNPL leadership: Tabby holds an estimated\
    \ 60% KSA BNPL market share by company claims, with 15 million registered users, over 40,000 merchant partners, and $10B+\
    \ annualised GMV. This network scale creates durable switching costs for both consumers and merchants that new entrants\
    \ struggle to replicate. Second, dual-year profitability de-risks the pre-IPO profile significantly versus global BNPL\
    \ peers such as Klarna and Affirm, which remained loss-making through their growth phases. Tabby reported a KSA net profit\
    \ of approximately $55M in 2025, with H1 2025 KSA net profit growing 360% year-over-year to SAR 90.4 million. Third, Tweeq\
    \ wallet acquisition in September 2024 unlocks the full neobank revenue stack \u2014 interchange income on Tabby Card\
    \ transactions, savings products, and eventually embedded lending \u2014 providing a material upside driver beyond merchant\
    \ discount rate income. Fourth, the Saudi Tadawul IPO pathway with JPMorgan, HSBC, and Morgan Stanley engaged as banks\
    \ provides a credible liquidity event for existing investors within a 12-24 month horizon. The anti-thesis centres on\
    \ four structural concerns. Valuation at $6.5B secondary implies approximately 12-17x 2025 estimated KSA revenue of $378M\
    \ \u2014 materially elevated versus global BNPL peers including Klarna at approximately 5.4x revenue at IPO preparation\
    \ stage. SAMA regulatory tightening represents existential risk: new credit limit caps or capital adequacy requirements\
    \ could constrain GMV growth or mandate expensive equity raises at lower valuations. Credit loss rates, net revenue retention,\
    \ and cohort data are not publicly disclosed, creating material information asymmetry that prevents independent verification\
    \ of profitability claims. Finally, revenue multiple compression risk is real \u2014 Klarna's European MDR compression\
    \ from 3-4% to under 2% as competition intensified provides a cautionary precedent for the MENA market over a 24-36 month\
    \ horizon as Tamara and global entrants scale."
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  tableRefs:
  - TV001
- id: section-2
  title: Recommendation and Confidence
  body: "The recommendation for Tabby at its current $6.5B secondary implied valuation is Track / Research More, with medium\
    \ confidence and a high risk rating. The valuation stance is Stretched. This recommendation reflects a well-constructed\
    \ company with demonstrable profitability and a credible IPO path, but priced for near-perfect execution at a multiple\
    \ that leaves limited margin of safety. At 12-17x 2025 estimated KSA revenue, Tabby is priced substantially above comparable\
    \ global BNPL peers at IPO readiness stages \u2014 Klarna prepared its IPO at approximately 5.4x revenue \u2014 and any\
    \ material adverse development in credit losses, regulatory conditions, or IPO market timing could produce a significant\
    \ markdown. The medium confidence reflects the strong public evidence base for Tabby's profitability and growth trajectory\
    \ but acknowledges three material information gaps that prevent a high-conviction buy: (1) no publicly available audited\
    \ consolidated financial statements covering all group entities including UAE, Kuwait, and Tweeq; (2) no disclosed cohort\
    \ retention, net revenue retention, or customer lifetime value data; (3) no IPO prospectus, preference stack details,\
    \ or Saudi CMA filing that would clarify post-IPO dilution and investor returns. A conviction buy requires at minimum:\
    \ audited consolidated P&L confirming group-level profitability, cohort data supporting NRR above 110%, confirmation that\
    \ SAMA licence renewal is on track, and IPO prospectus disclosure that enables preference stack analysis."
  claimRefs:
  - CV005
  - CV006
  - CV007
  - CV008
  tableRefs:
  - TV002
- id: section-3
  title: Financing Context and Valuation History
  body: "Tabby's financing history traces a disciplined escalation from seed capital through five institutional rounds to\
    \ a secondary market valuation of $6.5B. The Series A (2021, approximately $50M raised) established the initial BNPL product\
    \ in KSA. Series B (2022) brought the company to unicorn proximity. Series C followed, establishing merchant network scale.\
    \ The landmark Series D closed in November 2023 at $1.5B valuation with $200M raised from Wellington, STV, Mubadala, PayPal\
    \ Ventures, and Hassana \u2014 a consortium that anchors Tabby's institutional credibility. Concurrent with the Series\
    \ D, JPMorgan arranged a $700M receivables securitisation facility in December 2023, dramatically expanding Tabby's GMV\
    \ capacity without additional equity dilution. This facility is the working capital engine for the entire BNPL receivables\
    \ book and represents the highest single counterparty dependency in the capital structure. The Series E in February 2025\
    \ raised $160M at $6.5B valuation \u2014 a 2.2x step-up from Series D \u2014 led by returning investors and signalling\
    \ sustained institutional demand. The secondary market transaction in April 2025 implied a $6.5B valuation, representing\
    \ a further 36% step-up in just eight months and suggesting strong demand from secondary buyers anticipating an IPO re-rating.\
    \ JPMorgan, HSBC, and Morgan Stanley have been engaged as IPO banks, with Tabby targeting the Saudi Tadawul as the primary\
    \ listing venue. The IPO window is most commonly cited as 2026-2027 by analyst and news sources, though no formal filing\
    \ has occurred. The total equity raised across all rounds exceeds $650M, and the JPMorgan debt facility brings total financing\
    \ accessed to approximately $1.35B \u2014 providing substantial runway and GMV capacity through the IPO process."
