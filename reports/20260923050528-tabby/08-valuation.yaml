    nodes:
    - id: evidence-base
      label: Evidence Base
      detail: Series E $3.3B (Feb 2025), secondary $4.5B (Apr 2025), KSA revenue ~$378M (2025E), $10B+ GMV, 15M users, 2 profitable
        years, IPO banks engaged.
      tone: neutral
    - id: thesis-assessment
      label: Thesis Assessment
      detail: MENA-first BNPL leadership confirmed; profitability verified via news sources; Tweeq wallet upside real but
        early-stage; IPO path credible with top-tier banks.
      tone: positive
    - id: risk-assessment
      label: Risk Assessment
      detail: SAMA regulatory risk high; credit loss opacity material; no audited consolidated accounts; no cohort/NRR data;
        preference stack unknown; IPO timing uncertain.
      tone: risk
    - id: valuation-assessment
      label: Valuation Assessment
      detail: "$4.5B secondary implies 12-17x 2025 KSA revenue \u2014 stretched vs Klarna 5.4x at IPO; priced for near-perfect\
        \ execution with limited margin of safety."
      tone: warning
    - id: recommendation
      label: Recommendation
      detail: 'Track / Research More. Confidence: Medium. Risk: High. Valuation Stance: Stretched. Entry at current levels
        requires IPO prospectus and audited accounts.'
      tone: neutral
    - id: diligence-path
      label: Diligence Path
      detail: 'Required before upgrade: audited consolidated P&L, cohort NRR data, SAMA licence confirmation, IPO prospectus
        and preference stack, credit loss rate disclosure.'
      tone: opportunity
