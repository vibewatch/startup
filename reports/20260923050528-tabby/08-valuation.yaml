  - - Base
    - 2027 IPO at 15x forward revenue; KSA-dominant growth continues; moderate UAE contribution; 2027E revenue ~$520M
    - "$4.5B\u2013$6B"
    - 0-33% upside from $4.5B; flat to modest gain on 2-3 year horizon
