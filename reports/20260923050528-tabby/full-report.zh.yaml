      - number: '5.2'
        title: 产品模块与核心能力图谱
        blocks:
          - type: paragraph
            body: >-
              Tabby 的各项产品对应不同的用户需求和使用场景。Pay-in-4 是成熟的核心产品，超过一千五百万名消费者在结账时使用，覆盖线上购物，也支持通过二维码或 NFC 在线下支付。[CE008] 这项服务已接入
              70,000 多家商户，包括 IKEA、H&M、Noon 和 Namshi；商户可用 Shopify、Magento、WooCommerce 插件接入，也可通过定制 API 集成。[CE009]

              Tabby Card（Visa）仍处于增长阶段，面向想在 Tabby 合作网络以外使用 BNPL 的消费者；Visa 合作关系和应用内卡片管理功能提供了落地证据。[CE002] Tabby Plus
              面向高频购物者，以 SAR 19 月费提供高档返现。[CE003] Tabby Shop 已在主要应用上线，用户可浏览精选商店、促销提醒和商品分类。[CE004] Tabby Care
              为电子产品和高价商品提供购物保险，产品信息见 Tabby 官方页面。[CE005] Tweeq Wallet 是较新的模块，在 SAMA EMI 牌照下为沙特用户提供储值余额和 P2P 转账；2026 年 4
              月获批的 SVF 牌照也为阿联酋钱包业务提供许可。[CE007]

              关键尽调缺口是 Tweeq 与 Tabby 的整合程度：截至 2026 年 5 月，公司尚未正式确认完整整合的钱包体验已经上线，因此数字银行定位何时落地仍不确定。
