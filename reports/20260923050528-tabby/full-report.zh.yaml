chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、总部设立与商业模式
        blocks:
          - type: paragraph
            body: >-
              Tabby 于 2019 年在阿联酋迪拜创立，创始人为 Hosam Arab（CEO）和 Daniil Barkalov（CTO/COO）。公司最初在迪拜运营，后将总部迁至沙特利雅得，为计划中的 Tadawul
              上市做准备。Tabby 官网称自己是 MENA 领先的购物与金融服务应用，核心产品包括 Pay in 4（四期免息分期）、Tabby Card（带 BNPL 功能的 Visa 借记卡）、Tabby
              Plus（订阅奖励计划，月费约 SAR 19）和 Tabby Shop（商品发现与商户平台）；另有买家保障和质保产品 Tabby Care。

              2024 年 9 月收购持有沙特电子货币机构牌照的 Tweeq 后，Tabby 增加了数字钱包基础设施，可用于消费、转账和资金管理。2026 年 4 月 15 日，阿联酋央行授予 Tabby
              储值设施（SVF）牌照，支付业务由此也进入阿联酋受监管市场。其核心收入来自商户扣率（MDR）：零售商按交易额的一定比例付费，以便在结账时提供 BNPL。Tabby
              服务沙特、阿联酋和科威特消费者，沙特用户占比超过八成。截至 2026 年 9 月，公司称注册用户超过 25M、合作商户超过 70,000 家，年化交易额超过 $18B；在沙特规模领先，并已成为 MENA
              市场的重要玩家。
