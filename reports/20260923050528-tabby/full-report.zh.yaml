  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户客群细分与画像
        blocks:
          - type: paragraph
            body: >-
              Tabby 服务两类客户：B2C 零售消费者和 B2B 商户。[CU001] 消费端有超过一千五百万注册用户，主要在沙特（占比超过 80%）、阿联酋和科威特。[CU003] 用户以千禧一代和 Z
              世代为主；他们是数字原住民，偏好免息分期，而非传统信用卡或循环信贷。[CU010] 沙特超过 60% 的人口不到 35 岁，智能手机普及率也位居全球最高水平之列，为 BNPL
              提供了有利的人口和数字基础。消费者主要在时尚、消费电子、家居、旅游和杂货等场景使用 BNPL。[CU033]

              商户端有超过 40,000 家合作伙伴，核心诉求是在结账时把浏览者转化为买家；BNPL 可免去消费者一次性全额付款的门槛。[CU002]
              商户从独立中小零售商延伸至全球品牌和大型零售集团，覆盖时尚、电子、奢侈品和家居等行业。[CU040] 双边网络相互带动：用户规模提升 Tabby
              对商户的吸引力，广泛的商户供给又能帮助平台拉新并留住消费者。[CU001, CU002]
