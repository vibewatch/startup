  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险总览与严重性评级排序
        blocks:
          - type: paragraph
            body: >-
              Tabby 的风险分为监管与法律、运营与安全、合作伙伴依赖、财务模型、团队执行和竞争六类。监管收紧最为严重：SAMA 的 BNPL
              许可支撑着超过八成的沙特用户。若许可不获续期或条件发生重大变化，沙特业务可能受到根本性冲击，也可能延误甚至打断 Tadawul 上市计划。IPO
              执行风险排第二；上市窗口、沙特资本市场管理局（CMA）的招股书要求，以及合并财报审计，都可能拖慢进程。

              排第三的是 JPMorgan 的 $700M 应收账款证券化融资。单一交易对手为 BNPL 应收款提供营运资金；若发生契约违约、信用恶化或融资不续期，GMV
              扩张会受限，公司也可能被迫高成本再融资或稀释股权。Tamara 和 Klarna 等潜在全球对手可能挤压商户费率，带来中长期 MDR 下行压力。运营风险评为中高，涉及平台可用性、欺诈和数据安全；Tabby
              持有超过 25M 用户的个人信息，但目前没有公开记录的重大事故，提供了一定但有限的安心依据。

              团队风险主要集中在 Hosam Arab 身上；他的公众影响力、投资者关系和运营职责使公司存在关键人物依赖。CTO/COO Daniil Barkalov 的技术和运营经验可部分缓释这一风险。沙特业务 2024
              和 2025 年连续盈利，降低了财务模型风险，并为应对监管或竞争冲击提供现金缓冲；在公司融资阶段更早时，这类冲击可能更难承受。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
