    rows:
      - - 乐观
        - 2026-27 年以 20x 远期市销率完成 IPO；Tweeq 钱包 MAU >2M；UAE 扩张提速；2026 预期营收约 $600M
        - $6B–$8B
        - 较 $4.5B 二级市场估值具备 33-78% 上行空间；持股 3-4 年享受公开市场价值重估
        - 监管转向或 IPO 市场剧烈波动
        - 中低；依赖钱包业务放量及温和的监管环境
      - - 基准
        - 2027 年以 15x 远期市销率完成 IPO；KSA 主导增长格局延续；UAE 贡献适度增量；2027 预期营收约 $520M
        - $4.5B–$6B
        - 较 $4.5B 二级市场估值具备 0-33% 上行空间；在 2-3 年投资周期内收益平稳至温和增长
        - IPO 推迟或信用损失率常态化压缩估值倍数
        - 中等；若执行力保持稳定，符合当前发展轨迹
      - - 悲观
        - SAMA 监管收紧压低授信额度上限；IPO 推迟至 2027 年以后；竞对费率压力挤压利润空间；2026 预期营收停滞在 $350M
        - $2.5B–$3.5B
        - 较 $4.5B 二级市场估值承受 22-44% 亏损；若 IPO 拖延至 2028 年后或触发估值下调轮次（down-round）
        - 信用坏账激增或牌照续期受阻
        - 中低；属于尾部风险，但鉴于监管不确定性仍不可忽视
