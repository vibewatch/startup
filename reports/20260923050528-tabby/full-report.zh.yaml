      - number: '2.2'
        title: 市场规模测算——TAM、SAM 与 SOM 多视角测算
        blocks:
          - type: paragraph
            body: >-
              市场规模取决于采用全球 BNPL、MENA BNPL，还是沙特单一市场的口径，各种估算差异很大。Research and Markets 给出的常用基准是：沙特 BNPL 支付额从 2023 年的 $1.4
              billion 增至 2028 年的 $2.7 billion，年复合增速约为百分之十三。AGBI 在 2024 年 9 月直接引用了这组数据，因此它是本次覆盖中 MENA BNPL
              市场规模的主要参照。同一来源预计全球 BNPL 到 2028 年达到 $1 trillion，年复合增速为百分之四十五；这一更宽口径也包含 Klarna 在欧美的可触达市场。对 Tabby
              而言，沙特数据是最有决策价值的 TAM 代理指标。

              若沙特约占 MENA BNPL 交易量的 50–60%（按电商份额推算），则沙特、阿联酋、科威特、卡塔尔和巴林的 BNPL 市场在 2024 年约为 $2.5–3B（按沙特 $1.4B
              数据推算），区域总可用市场（TAM）到 2028 年或从约 $2.5B 增至 $5B 以上。Tabby 声称截至 2025 年初年化 GMV 达 $10B；若与上述市场口径一致，意味着它已覆盖很大一部分 BNPL
              存量，渗透率也会很高，这与其龙头定位相符。不过，若将所有可能使用 BNPL 的电商结账消费都纳入可服务市场（SAM），单是沙特 2023 年电商市场就约有 $12B（多方估算），BNPL
              从少数交易走向多数交易仍有空间。

              两组数据存在明显落差，应保留而非强行调和：Research and Markets 估算沙特 2023 年 BNPL 仅 $1.4B，而 Tabby 声称覆盖沙特、阿联酋和科威特的 GMV 已超过
              $10B。可能是前者采用更窄的 BNPL 定义，也可能 Tabby 对 $10B GMV 的披露偏高，或市场增长快于预测。
            claimRefs:
