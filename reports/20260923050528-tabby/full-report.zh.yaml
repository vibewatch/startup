  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局总览与对手分类
        blocks:
          - type: paragraph
            body: >-
              Tabby 在 MENA 的 BNPL 和消费金融市场面对四类对手。直接竞品是在沙特或阿联酋提供持牌分期服务的 Tamara（利雅得）、Postpay（阿联酋）、Cashew（阿联酋和沙特）及
              Spotii（阿联酋，后被澳大利亚 Zip 收购）。传统替代品包括银行信用卡、计息延期借记和银行分期；例如 Al Rajhi、SNB、Riyad Bank 可通过 Visa 或 Mastercard
              为主流信用卡提供 0% 分期。潜在入局者包括 Klarna（瑞典公司，经营重心在欧美，截至 2026 年尚未进入 MENA）、Afterpay/Block 和
              Paidy。消费者也会选择货到付款（在沙特仍较常见）或亲友借贷；大型沙特零售商和电商平台还可能自建 BNPL，而不依赖第三方。

              目前最直接的竞争来自 Tamara：它和 Tabby 争夺同一沙特市场，获得 Coatue 和 Checkout.com 支持，并持有自己的 SAMA BNPL 牌照。Postpay 和 Cashew
              规模较小，主要面向阿联酋。Klarna 等全球玩家可能进入，但截至目前尚未落地；SAMA 和 CBUAE 的牌照要求增加了进入难度。银行分期可替代 BNPL，但沙特信用卡普及率低，和 Tabby
              的重叠客群有限。Tabby 的策略已从争做 BNPL 头部，转向成为 MENA 消费者的主要金融应用，覆盖 Tabby Card、Tabby Plus、Tabby Shop 和 Tweeq
              钱包；产品范围扩大，也拓宽了竞争边界和潜在护城河。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
