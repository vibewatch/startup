      - number: '7.2'
        title: 监管与法律合规风险
        blocks:
          - type: paragraph
            body: >-
              Tabby 的监管风险首先来自 2022 年 7 月获批的 SAMA BNPL 许可，授权公司在沙特开展 BNPL 业务。SAMA
              持续监管该许可，但续期条件（包括资本充足门槛、消费者保护要求和授信额度上限）没有公开，形成重要尽调缺口。沙特监管趋严：SAMA 修订 BNPL
              服务商规则，要求加强面向商户和消费者的信息披露，并明确收费。Tabby 免收逾期费且符合伊斯兰教法，在这些规则下具备结构性优势；但若 SAMA 提高资本或运营要求，许可续期风险仍在。

              阿联酋央行（CBUAE）于 2026 年 4 月向 Tabby 颁发储值设施（SVF）许可，允许其开展受监管的支付业务。CBUAE 面向信贷机构的 BNPL 监管框架在 2025–2026
              年仍在演进，后续通函可能收紧信贷敞口限制或披露要求。科威特央行（CBK）对 BNPL 的监管仍处早期阶段，Tabby 在当地经营意味着风险虽较低但并非为零。

              沙特《个人数据保护法》（PDPL）于 2022 年生效，2024 年进入执法阶段。Tabby 的 15M+
              消费者数据包括生物识别核验、付款历史和设备信息，若发生泄露或数据治理不当，可能引发罚款和声誉损害。Tweeq 的 SAMA EMI 许可也需与 BNPL 许可并行维护，合规范围因此翻倍。沙特和阿联酋在 2025
              年持续收紧消费信贷披露规则，建议由法律顾问审阅 Tabby 面向消费者的现行文件。留存资料中未发现 SAMA 对 Tabby 执法的公开记录。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
