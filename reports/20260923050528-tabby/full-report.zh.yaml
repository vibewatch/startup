      - number: '3.3'
        title: 综合能力、产品定价与渠道网络对比
        blocks:
          - type: paragraph
            body: >-
              Tabby 的产品范围、网络规模（20M+ 用户、40K+ 商户）和监管牌照覆盖面均领先于当地同业；其牌照包括 SAMA BNPL 许可、收购 Tweeq 后的 SAMA EMI 许可，以及 CBUAE SVF
              许可。MENA 各家 BNPL 公司都没有公开 MDR，无法据公开资料直接比较。参照全球同业，MENA 运营商的 MDR 可能在 1–5%，具体取决于品类和商户规模。Tabby、Tamara、Postpay 和
              Cashew 对按时还款的消费者都不收费，这是市场共性而非差异化优势；逾期费用则因运营商和监管辖区而异。

              Tabby 的分销优势主要来自四点：其一，40K+ 商户构成当地最大的商户网络，覆盖越广，消费者越有理由安装应用；其二，实体 Tabby Card 把使用场景从电商延伸到线下；其三，Tabby Plus
              通过会员奖励提高活跃用户的留存和变现；其四，Tabby Shop 承接商品发现和搜索，有望降低获客成本。目前公开资料显示，竞品尚未复制这套完整产品组合，Tamara 也没有对应的银行卡和订阅产品。

              Tabby 持有 SAMA 和 CBUAE 牌照，并与 JPMorgan 合作融资，机构认可度有助于商户采用，也关系到未来 IPO
              投资者信心。消费者的切换成本不高，结账时通常选择商户支持的服务。因此，争取商户覆盖才是竞争关键；单靠增加面向消费者的功能并不能解决这个问题。
