      - number: '5.3'
        title: 技术架构与工程实现
        blocks:
          - type: paragraph
            body: >-
              Tabby 的技术架构只能从公开招聘信息、Tabby for Business 商户门户、GitHub 活动和第三方分析中推断。[CE022] 消费者使用原生 iOS 和 Android
              应用，界面支持阿拉伯语和英语，整合结账深链、分期管理、Tabby Shop 浏览和卡片控制。应用商店评分为 4.8。[CE013] Tabby Card 依赖 Visa；沙特、阿联酋和科威特的 BNPL
              交易则依赖当地收单银行，因此卡组织和收单关系都是关键依赖项。[CE024]

              Tabby 在结账时用自有评分引擎实时审批，参考国民身份证信息、可取得的征信资料和内部交易记录。回头客的还款历史进一步补充内部数据，为征信记录有限的消费者提供了有价值的数据基础。[CE023] 商户 API 支持
              Shopify、Magento、WooCommerce 插件及定制 REST API；Tabby for Business 门户还提供沙盒和 SDK。[CE025]
              公司没有披露云基础设施；根据交易规模和招聘信息，报告推测其使用 AWS 或 GCP 等大型云服务。[CE022]

              Tabby 的 GitHub 组织（github.com/tabbyai）公开仓库不多，主要是商户 SDK，符合闭源金融科技架构的特征。[CE040] 与 Stripe 或 Monzo
              相比，公司缺少公开工程博客，透明度较低；但这在成长期的 MENA 金融科技公司中并不罕见。
