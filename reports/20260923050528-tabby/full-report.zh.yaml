      - number: '3.2'
        title: 核心竞品画像——规模、融资与战略打法
        blocks:
          - type: paragraph
            body: >-
              Tamara 是 Tabby 最直接、融资基础较扎实的对手。它总部位于利雅得，2022 至 2023 年间获 Coatue Management 和 Checkout.com 投资 Series
              B；多家来源称融资额为 $210M。Tamara 持有 SAMA BNPL 牌照，重点服务沙特消费者，产品包括 Pay in 3、Pay in 4、购物应用及 Shopify、WooCommerce
              商户集成。公开资料未显示它已推出 Tabby Card 或 Tabby Plus 类似的借记卡、订阅产品；若 Tabby 的超级应用策略奏效，这会形成产品差异。截至研究截止日，Tamara 的经审计收入和 GMV
              均未公开。

              Postpay 于 2019 年成立，总部在阿联酋，获风投支持并持有阿联酋央行牌照，主要为当地商户提供 Pay-in-4。其收入、用户数没有实质性公开数据，也未披露沙特牌照，因此竞争主要局限在阿联酋。Cashew
              总部位于迪拜，在阿联酋和沙特经营，面向与 Tabby 相近的消费者和商户，尤以时尚、生活方式为主；其融资规模远小于 Tabby 或 Tamara。阿联酋 BNPL 初创公司 Spotii 于 2021
              年被澳大利亚 Zip（ASX: ZIP）收购，这是 MENA 首笔重要 BNPL 并购。收购后，Spotii 似乎已并入 Zip 全球业务，面向 MENA 的增量投入有限。

              Klarna 在 20 多个国家经营，GMV 超过 $7B，是全球最大的非上市 BNPL 公司；截至 2026 年初仍未进入 MENA。若 Klarna 获得 SAMA 和 CBUAE
              牌照并利用全球品牌进入，可能对 Tabby 的高端市场定位构成重大竞争威胁。
