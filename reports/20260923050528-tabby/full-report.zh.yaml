          detail: 新用户提交国民身份证件并完成 KYC 注册。Tabby 自研信用评分引擎综合身份资料、可用征信数据和行为信号，实时评估用户资格。获批用户取得初始额度。
        - label: 首次消费——四期免息分期（Pay-in-4）
          detail: 消费者在商户结账时选择 Tabby 支付（支持线上或线下扫码/NFC 支付）。首期付款（订单金额的 25%）实时扣缴；商户在扣除 MDR 后全额收妥货款。剩余三期账单按计划于后续 6 周内付清。
        - label: 分期还款履约周期
          detail: 系统通过用户绑定的支付方式在 6 周内自动收取剩余三期款项。用户可在 Tabby App 查看分期和待还款日期。按时还款有助于提高后续额度及获批概率。
        - label: 复购消费与忠诚度沉淀
          detail: 履约完成解锁更高授信额度与更快的复购审批通道。消费者在服饰、数码家电、家居等类目持续复购。Tabby Shop 导购入口不断推介新商户与优惠活动，促成习惯性回流消费。
        - label: 升级 Tabby Plus 付费会员
          detail: 高频购物者升级至 Tabby Plus，月费 SAR 19，可享更高返现和独家商户优惠。订阅带来直接收入，返现也鼓励用户持续使用。
        - label: 核心高价值用户与品牌自传播
          detail: 长期订阅 Tabby Plus 且交易频繁的用户会成为平台拥护者。他们主动推荐并分享使用体验，带动自然增长。用户将工资入账和 P2P 转账也转到 Tabby 后，Tweeq 钱包整合进一步加深用户参与度。
