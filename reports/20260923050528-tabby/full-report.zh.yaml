      - 残留风险敞口
    rows:
      - - JPMorgan $700M 应收账款信贷额度
        - JPMorgan
        - BNPL 应收账款主要营运资金；支撑 GMV 突破自有资本限制持续扩张
        - 单一交易对手方；未披露备用信贷额度
        - 违反契约条款或无法续期将制约 GMV 承载能力；迫使公司开展高成本再融资
        - 严重
        - JPMorgan 信用尽调验证了损失模型；连续 18+ 个月持续获批使用释放积极信号
        - 授信条款未披露；契约阈值未知；信贷环境恶化时面临再融资风险
      - - Visa 网络
        - Visa
        - Tabby Card（Visa 借记卡）卡组织网络；商户放款支付通道
        - 高集中度；Tabby Card 产品完全依赖 Visa 网络
        - 网络故障或费率上调直接阻断 Tabby Card 交易
        - 高
        - Visa 全球网络基础设施具备高韧性与地理冗余
        - 费率表变更由单方推行；KSA 制裁事件可能冲击网络可用性
      - - Mastercard 网络
        - Mastercard
        - 商户结算备用支付通道及潜在发卡合作方
        - 中集中度；在现有产品体系中居 Visa 之后
        - 网络中断影响商户结算处理
        - 中
        - 接入双网络降低了对单一网络的依赖
        - 合同条款未披露；依赖程度未公开量化
      - - 云基础设施（AWS/GCP）
        - AWS / GCP（推测）
        - 为 Tabby 平台、评分模型及交易处理提供托管与算力支撑
        - 高度集中于单一核心云服务商（推测）
        - 高峰期区域可用区故障导致平台宕机
        - 高
        - 云服务商具备多可用区冗余；企业级 SLA 可用性通常达 99.9%+
        - 服务商身份未经证实；容灾预案未公开披露
      - - SAMA 监管许可
        - Saudi Arabian Monetary Authority
        - 开展 BNPL 与 EMI 业务的法定牌照；新产品上线与模型延展的审批方
        - 针对 KSA 业务（占用户基数 80%+）存在单一监管机构高度集中风险
        - 牌照遭撤销或监管条件不利调整将彻底终结 KSA 业务
        - 严重
        - 保持合规记录；SAMA 将 Tabby 列为合规持牌 BNPL 机构
        - 审批周期不透明；新产品发布受制于 SAMA 审查
