  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品矩阵总览
        blocks:
          - type: paragraph
            body: >-
              Tabby 已从 Pay-in-4 分期服务扩展为面向沙特、阿联酋和科威特消费者及商户的多产品金融平台。Pay-in-4 将消费额分成四期，在六周内免息还款；自 2023
              年起不收逾期费，因此完全符合伊斯兰教法（Shariah）。[CE001] Tabby Card 依托 Visa 网络，让消费者在任何 Visa 商户使用 BNPL 额度并获得返现，不再局限于 Tabby
              合作商户。[CE002] Tabby Plus 每月收费 SAR 19，提供高档返现和商户优惠，为公司增加经常性收入，也提高用户参与度。[CE003] Tabby Shop 则让用户在应用内浏览 40,000
              多家合作商户及专属优惠，把 Tabby 从支付工具拓展为购物入口。[CE004]

              Tabby Care 为高价电子产品和其他商品提供购买保障与质保。[CE005] 2024 年 9 月，Tabby 收购持有 SAMA 电子货币机构（EMI）牌照的数字钱包初创公司
              Tweeq，获得储值钱包和个人转账能力，朝 MENA 数字银行方向扩展。[CE006] 2026 年 4 月，公司又获阿联酋央行（CBUAE）颁发储值设施（SVF）牌照，可在当地开展相应钱包业务。[CE037]
              这些产品都集中在一款评分 4.8 的应用中；目前没有其他区域 BNPL 公司以相近规模复制出同样广的产品组合。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
