            body: >-
              多组相互印证的数据表明，Tabby 的用户、商户和财务规模都在快速增长。[CU004] 公司称，截至 2025 年其年化交易额超过 $10 billion；Series A 融资时还不到 $1
              billion，扩张期间增长超过 10x。沙特是其最大市场，2024 年收入约 $267 million。[CU005] 按同一沙特口径，2025 年收入约 $378 million，年增约
              41%。[CU006]

              2025 年上半年，沙特净利润为 SAR 90.4 million，较 2024 年上半年增长 360%，显示规模扩大可能带来经营杠杆和单体经济改善。[CU007] Tabby 连续两年盈利，且盈利发生在
              BNPL 快速扩张期间；这与单纯靠牺牲利润换规模的增长模式不同。[CU009] 融资也反映投资人需求：Series D 于 2023 年 11 月以 $1.5B 估值融资 $200M；2025 年 2 月
              Series E 融资 $160M、估值 $6.5B；2025 年 4 月老股交易隐含估值也为 $6.5B。[CU031, CU032, CU037] 商户网络从零增长到 40,000
              多家，为公司声称的交易规模提供了供给基础。[CU002]
