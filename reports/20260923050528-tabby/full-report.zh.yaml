      - number: '1.3'
        title: 融资历史、估值演进与资本结构
        blocks:
          - type: paragraph
            body: >-
              Tabby 的融资从 2019 年 $2M 种子轮一路增至 2026 年估值 $6.5B 的 Series F，是 MENA 金融科技领域扩张很快的一条融资轨迹。2019 年，Global Founders
              Capital、Arbor Ventures 和 Wamda Capital 投入 $2M 种子资金；2020 年又融资 $7M，用于拓展沙特。2020 年 12 月，Arbor Ventures 与
              Mubadala Capital 领投 $23M Series A，STV、Raed Ventures 和 JIMCO 跟投。2021 年，Partners for Growth 提供 $50M
              债务融资，支持应收账款。2022 年，Global Founders Capital 和 STV 领投 $50M Series B，投后估值 $300M，Delivery Hero 作为战略投资者加入。

              2023 年 11 月，Wellington Management 领投 $200M Series D，Tabby 以 $1.5B 估值成为 MENA 首家金融科技独角兽。2023 年 12 月，Series D
              再获 $50M 股权融资；JPMorgan 同时安排 $700M 应收账款证券化融资，这是 MENA 金融科技领域规模最大的债务融资。2025 年 2 月，Blue Pool Capital 和 Hassana
              领投 $160M Series E，估值为 $3.3B，使 Tabby 成为 MENA 估值最高的风投支持公司。据报道，2025 年 4 月的一笔老股交易隐含估值约 $4.5B。到 Series F
              时，累计股权融资估计超过 $643M；加上 $700M 以上应收账款融资，业务获得的资金总额超过 $1.65B。公司正筹备 Tadawul 上市，并已聘请 JPMorgan、HSBC 和 Morgan
              Stanley 担任顾问。
