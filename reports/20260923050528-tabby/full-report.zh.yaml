      - number: '7.3'
        title: 运营与信息安全风险
        blocks:
          - type: paragraph
            body: >-
              Tabby 的运营风险主要有三类：平台可用性、欺诈与信贷违约管理，以及数据安全。公司在三个市场处理数百万笔 BNPL 交易；若斋月或沙特国庆日等购物旺季发生长时间宕机，可能损失 GMV 并损害商户关系。Tabby
              没有公开可用性 SLA 或事故记录，运营韧性评估因此存在证据缺口。

              BNPL 普遍面临支付欺诈风险。Tabby 对未偿分期承担第一损失信用风险，而信用卡网络通常会与商户和发卡行分担欺诈损失。公司未披露欺诈率，因此无法判断其机器学习评分能否达到 Klarna 或 Affirm
              等成熟同行的水平。首期还款违约是 BNPL 已知的攻击方式，若此类欺诈激增，信用损失表现可能明显恶化。

              超过 15M 注册用户的个人信息对网络攻击者具有吸引力。Tabby 持有身份核验资料、付款历史、设备指纹，以及可能在注册时收集的生物识别信息。重大泄露可能触发沙特 PDPL 通报义务和阿联酋 CBUAE
              要求，并带来罚款及声誉损害。Tabby Card 和卡片结算也依赖 Visa、Mastercard；网络中断或费率变化会影响运营成本和卡业务经济性。竞争者以更低 MDR
              抢商户，也可能逐步削弱商户网络。Trustpilot 上的投诉主要涉及支付争议处理时间，以及消费者把商户配送问题误归因于 Tabby 支付系统，客服流程值得持续关注。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
