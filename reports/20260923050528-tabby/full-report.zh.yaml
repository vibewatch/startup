  - id: FV001
    title: 投资建议推演逻辑
    type: flow
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
    data:
      nodes:
        - id: evidence-base
          label: 证据底座
          detail: >-
            E 轮估值 $3.3B（2025 年 2 月）；二级市场估值 $4.5B（2025 年 4 月）；KSA 营收约 $378M（2025E）；GMV >$10B；用户规模 15M；连续 2 年盈利；已聘任 IPO
            承销投行。
          tone: neutral
        - id: thesis-assessment
          label: 投资逻辑评估
          detail: 确立 MENA 本土 BNPL 龙头地位；新闻来源印证公司已盈利；Tweeq 钱包的上行空间存在但仍处早期；由大型投行参与的 IPO 路径较可信。
          tone: positive
        - id: risk-assessment
          label: 核心风险评估
          detail: SAMA 监管风险高企；坏账损失缺乏透明度；无经审计合并报表；缺失留存队列（cohort）/NRR 数据；优先股堆叠未知；IPO 时间表存不确定性。
          tone: risk
        - id: valuation-assessment
          label: 估值水平评估
          detail: 按 $4.5B 二级市场估值对应 2025 年 KSA 营收约 12-17x 市销率——相较 Klarna IPO 时的 5.4x 明显偏高；当前定价计入近乎完美的经营预期，安全边际有限。
          tone: warning
        - id: recommendation
          label: 投资评级建议
          detail: 持续跟踪 / 深入研究。置信度：中。风险评级：高。估值判断：偏高（Stretched）。当前价位进场亟需等待 IPO 招股书及经审计财报披露。
          tone: neutral
        - id: diligence-path
          label: 深入尽调路径
          detail: 上调评级前必备要素：经审计合并损益表、留存队列 NRR 数据、SAMA 牌照存续确认、IPO 招股书及优先股堆叠细节、信用损失率公开披露。
          tone: opportunity
      edges:
        - from: evidence-base
          to: thesis-assessment
        - from: evidence-base
          to: risk-assessment
        - from: thesis-assessment
          to: valuation-assessment
        - from: risk-assessment
          to: valuation-assessment
        - from: valuation-assessment
          to: recommendation
        - from: recommendation
          to: diligence-path
