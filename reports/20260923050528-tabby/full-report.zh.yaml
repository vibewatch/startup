            body: >-
              Tabby 的商户证据不只是展示合作品牌，还包括多个行业的实际部署。[CU020] Amazon 在沙特和阿联酋结账页面提供 Tabby BNPL；其供应商审核严格，因此这是有分量的落地案例。SHEIN 面向 Z
