      - number: '4.3'
        title: 资本架构、融资格局与资本密集度
        blocks:
          - type: paragraph
            body: >-
              除 Tweeq 收购外，Tabby 从种子轮到 Series E 约筹集 $480M 股权资金；2023 年 12 月，JPMorgan 又提供 $700M 应收账款证券化融资。这笔资产支持融资以 BNPL
              应收款为基础：Tabby 发放分期贷款并汇集应收款，再由 JPMorgan 提供仓储额度，为应收款融资。这样公司可以循环使用资金，扩大 GMV，而不只依靠股权融资。Klarna、Affirm 和 Afterpay
              等全球 BNPL 公司也采用类似结构。

              这类融资同时带来多项风险：利率风险（JPMorgan 融资成本未披露，且可能随浮动利率变化）；交易对手集中风险（单一 $700M
              融资额度若被缩减或不续期，可能迫使公司高成本再融资）；契约风险（证券化融资通常设有损失或稀释等表现触发条件，信用表现恶化时可能限制业务）；以及杠杆风险（$700M
              债务叠加股权资本，使业务带有杠杆，放大上行和下行）。 截至 2023 年末、Series E 于 2025 年 2 月融资 $160M 之前，Tabby 股权和债务融资合计约 $1.18B，支持 $10B 的
              GMV 年化运行率。GMV 与总融资额之比约为 8–10x，显示资本使用效率较高，也符合应收账款一年多次周转的 BNPL 模式。Series E 的 $6.5B 估值约为 2025 年沙特收入 $378M 的
              8.7x（$6.5B / 沙特收入）；对区域 BNPL 公司而言倍数偏高，只有超级应用扩张和 IPO 溢价兑现，才可能支撑这一估值。
