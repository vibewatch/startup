  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 盈利模式与收入构成
        blocks:
          - type: paragraph
            body: >-
              Tabby 的主要收入来自商户扣率（MDR）：零售商接入 BNPL 后，按每笔交易金额的一定比例向 Tabby 付费；Tabby 则提供免息分期并承担分期应收款的信用风险。公司没有公开 MDR 费率。参考全球
              BNPL 同业，费率通常为 1–6%，会随品类和商户规模变化。沙特是 Tabby 的主要市场；据报当地子公司 2025 年收入为 $378M，高于 2024 年的 $267M，增幅
              42%。这不是集团合并收入，沙特、阿联酋和科威特的收入拆分也未披露。

              其他收入包括 Tabby Plus 订阅费（SAR 19/月）、未披露的 Tabby Card 手续费收入、Tabby Shop 导购佣金，以及 Tabby Care 买家保障服务费。估计这些非 MDR
              收入目前只占总收入的一小部分，但代表公司尝试向消费者直接变现。收入确认口径也影响同业比较：Tabby 可能在商户交易时按交易全额确认
              MDR，也可能按分期付款额扣除后的净额确认。公司没有公开审计财报；本章所引营收数字均为公司声称，并由媒体转述其新闻稿和投资者沟通，尚未由审计账目独立核实。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
