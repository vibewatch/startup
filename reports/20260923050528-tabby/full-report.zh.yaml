      - number: '1.2'
        title: 创始人团队、管理层与公司治理
        blocks:
          - type: paragraph
            body: >-
              Hosam Arab 于 2019 年创立 Tabby 前，曾联合创立 Namshi 并担任 CEO；这家中东时尚电商后来被 Global Fashion Group
              收购。他在区域电商的经历让他亲历消费者结账时遇到的阻碍，也由此形成 Tabby 的 BNPL 创业思路。联合创始人 Daniil Barkalov 担任 CTO 和 COO，负责技术与运营，与 Arab
              的商业及市场拓展经验互补。Arab 在 Namshi 的经历也帮助公司早期赢得区域零售商和投资人的信任，构成团队与 MENA 消费金融市场的契合点。

              Tabby 尚未上市，投资人因此也承担了非正式治理角色。Wellington Management 领投 Series D；Mubadala Capital 和沙特养老金基金管理机构 Hassana
              Investment Company 是重要股东；STV 和 Blue Pool Capital 也持有重要股权。PayPal Ventures 参与 Series D，Tabby
              是首家获得其投资的海湾金融科技公司。董事会组成和投票权安排均未公开，是 IPO 尽调的重要缺口。Arab
              的关键人物风险评为高：他是公司主要的公众代表、媒体发言人和运营负责人。创始团队以下的继任梯队也没有公开信息。
