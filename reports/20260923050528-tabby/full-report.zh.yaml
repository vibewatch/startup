      - number: '4.2'
        title: 单量经济模型、利润率与盈利性表现
        blocks:
          - type: paragraph
            body: >-
              Tabby 报告称，沙特业务在 2025 年上半年首次实现净利润，达 SAR 90.4M（约 $24M），同比改善 360%。公司报告的 2025 年全年净利润约为 $55M；以 $378M 收入计算，净利率为
              14.5%。若这些数字准确，说明 Tabby 的沙特 BNPL 业务达到一定规模后可以盈利，为计划中的 Tadawul 上市带来积极信号。

              但多项关键单体经济指标仍未披露：毛利率（MDR 收入扣除信用损失和支付处理成本）、获客成本（CAC）、客户终身价值（LTV）、90 天复购率、各批次损失率及运营费用结构。对利率为 0% 的 BNPL
              而言，每笔交易的毛利取决于 MDR 能否覆盖违约损失和支付处理成本。在 MENA 征信记录较薄的市场，承保质量尤为关键；违约率每上升 1%，按 MDR 水平不同，毛利可能减少 20–50%。沙特收入从 2024
              年到 2025 年增长 42%，与业务规模扩大后的效率提升相符。按估算的 H1 2025 收入 SAR 600–700M 和该净利润计算，2025 年上半年净利率约为
              12–15%；但没有审计账目，外部投资者仍难以高置信度评估这些数字。

              阿联酋和科威特业务是否盈利仍未知。纳入 Tweeq 收购成本、JPMorgan 证券化融资利息，以及阿联酋和科威特市场亏损后，集团整体财务表现可能与沙特单体数据有明显差异。
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
