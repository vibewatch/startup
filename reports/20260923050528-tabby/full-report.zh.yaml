    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
    notes: 正反论点均以公开证据为边界；未取得非公开财务数据用于独立验证。
    columns:
      - 核心论点
      - 转向触发条件
    rows:
      - - 正方：中东本土首屈一指的 BNPL 龙头，盈利性已获验证且具备清晰 IPO 路径
        - 确认条件：经审计 2025 净利润 ≥$50M 且 KSA 市场份额 >40%
      - - 正方：$10B+ GMV 叠加 15M 用户筑就稳固网络效应
        - 确认条件：披露的队列数据中 NRR >110% 且复购率 >60%
      - - 正方：Tweeq 钱包全面解锁数字银行收入空间（刷卡手续费、储蓄业务）
        - 确认条件：整合后 12 个月内 Tweeq MAU >1M 且钱包贡献可观 ARPU
      - - 反方：相对全球 BNPL 可比公司，2025 年营收 12-17x 的估值倍数明显偏高
        - 转向条件：IPO 定价隐含远期市销率 <10x，或可比交易拉低对标估值中枢
      - - 反方：信用损失率与 NRR 未公开披露
        - 转向条件：经审计账目确认坏账拨备低于 GMV 的 2%
      - - 反方：SAMA 监管收紧可能压低授信额度上限或强制追加资本要求
        - 转向条件：SAMA 出台明晰资本要求的多年期稳定 BNPL 监管框架
