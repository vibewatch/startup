      - number: '2.3'
        title: 买方画像与客户客群细分
        blocks:
          - type: paragraph
            body: >-
              Tabby 需要同时赢得两类买家：消费者和商户。消费者端的主力是 18–35 岁年轻人，他们可能没有信用卡，却有智能手机并习惯网购。沙特约七成人口不到 40 岁，智能手机普及率也位居全球前列，形成了适合 BNPL
              的用户基础。Tabby 披露的高频品类是时尚（主要是女性服饰）和电子产品（偏男性、高客单价）。阿联酋外籍人口较多，拥有正规银行关系、持有信用卡的消费者也更多，因此 BNPL 的结构性优势略弱于沙特。

              商户接入 BNPL，主要看中结账转化率和客单价提升。全球 BNPL 公司披露的数据称，提供 BNPL 的零售商转化率比只接受信用卡的商户高 10–30%，客单价高
              20–50%。时尚和电子品类退货率可能较高，Tabby Care 的买家保障则有助于降低商户的财务风险。商户端通常由电商或数字营销团队选择支付网关；大型零售商谈 MDR 时，CFO
              或财务部门也会参与。生鲜杂货和旅游是正在兴起的相邻品类。

              BNPL 由商户支付 MDR，消费者按时还款即可免息、免手续费使用，与传统信贷不同；在消费者排斥计息产品的市场，这一特点有助于推动采用，也符合伊斯兰金融考量。Tabby Plus
              开始靠订阅费直接向消费者变现，收入来源不再只有 MDR。
            claimRefs:
