  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场界定与业务边界
        blocks:
          - type: paragraph
            body: >-
              Tabby 所在的核心市场，是中东和北非面向消费者的 BNPL，重点覆盖沙特和阿联酋。零售商在 POS
              或线上结账时支付商户扣率（MDR），承担利息成本，消费者则可免息分期。传统信用卡（计息循环信贷）、个人贷款、延期借记，以及向消费者收息的 BNPL 产品不计入这一核心市场。相邻机会包括数字钱包和储值账户（由
              Tweeq 收购带入）、Tabby Plus 订阅服务、消费者奖励，以及 Tabby Shop 导购。

              当地消费者目前也会选择货到付款（COD，沙特和阿联酋仍较常见）、借记卡或亲友借贷。与成熟市场相比，MENA 的信用卡普及率低；沙特不少消费者没有银行账户，或难以获得正规信贷，这构成 Tabby
              的需求基础。商户还可选择 Afterpay（全球布局但不以 MENA 为重点）、Klarna（主要在欧洲和美国）及区域玩家 Tamara、Postpay、Cashew。本章按两层口径衡量市场：一是沙特和阿联酋持牌
              BNPL 平台处理的交易额；二是扩展至科威特、巴林和卡塔尔等 Tabby 与同业已进入或计划进入的 MENA 市场。
