company:
  name: Axonius Inc.
chapter:
  number: 3
  title: Competitors
  summary: 'Axonius competes in a multi-front competitive landscape: directly against CAASM-native peers (Armis, runZero, Sevco), against established platform incumbents (Qualys, ServiceNow, Tanium), and against indirect threats from mega-platform vendors (CrowdStrike, Palo Alto Networks) building asset visibility into broader XDR and CNAPP products. Axonius''s primary moat is integration depth (400+ adapters), enterprise trust (FedRAMP, 500+ Fortune customers), and the Cynerio acquisition expanding into healthcare IoT. The largest competitive risk is platform consolidation by CrowdStrike or Palo Alto as enterprise buyers seek fewer security vendors.'
sections:
- id: section-1
  title: Competitor landscape overview
  body: "The cyber asset attack surface management competitive landscape can be divided into five distinct classes of competitor. First, CAASM-native specialists \u2014 Armis, runZero, Sevco Security, Cavelo, OctoXLabs, and Lansweeper \u2014 compete on a shared core use case but differ substantially in approach, depth, and target customer. Axonius leads this class by ARR ($151.5M vs. runZero's estimated $10\u201315M) and enterprise client count (670+ vs. Armis's estimated 1,000+ but at different deal sizes and geographies).\nSecond, security platform incumbents \u2014 Qualys (CSAM module), Rapid7 (InsightVM), and Tenable \u2014 offer cyber asset management as a feature layer within their established vulnerability management platforms. These vendors have deep enterprise relationships and lower switching costs as a combined-platform bundle, but their CAASM features are historically less comprehensive than Axonius's dedicated platform.\nThird, IT operations incumbents \u2014 ServiceNow (ITAM/CMDB),\
    \ BMC Helix, and Lansweeper \u2014 approach the problem from an IT asset management and CMDB perspective. Their strength is workflow integration and large installed bases; their weakness is limited security context and policy enforcement. Fourth, OT and cyber- physical security vendors \u2014 Claroty, Dragos \u2014 compete directly in IoT/OT asset visibility, an area where Axonius expanded via Cynerio. Fifth, mega-platform vendors \u2014 CrowdStrike (Falcon platform) and Palo Alto Networks (Cortex XSIAM) \u2014 represent the medium-term consolidation threat as they add asset discovery and management capabilities to their integrated security operations platforms."
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  - CP005
  tableRefs:
