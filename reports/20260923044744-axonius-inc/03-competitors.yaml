  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: axonius-net-revenue-retention
    missingEvidence: Axonius's net revenue retention (NRR) rate is not publicly disclosed; without NRR data, it is impossible to distinguish whether 51.5% ARR growth is driven by new logo acquisition or expansion in existing accounts; NRR also confirms or denies competitive displacement hypothesis.
    whyItMatters: High NRR (>120%) would confirm durable competitive moat; low NRR (<110%) would indicate competitive displacement is already occurring in the installed base.
    diligencePath: Request NRR by cohort, customer churn rate, expansion revenue, and gross revenue retention in data room.
    relatedQuestionRefs: []
  - type: missing-source
    severity: material
    topic: armis-fedramp-status
    missingEvidence: Armis's FedRAMP authorization status is not confirmed in any public source; if Armis achieves FedRAMP Moderate authorization, it could challenge Axonius's federal market moat directly.
    whyItMatters: FedRAMP Moderate is a key competitive barrier protecting Axonius's federal revenue from direct Armis competition; removing that barrier would open the federal segment to the most capable CAASM competitor.
    diligencePath: Check FedRAMP marketplace for Armis authorization status; request Axonius's assessment of Armis federal pursuit.
    relatedQuestionRefs: []
  - type: missing-source
    severity: minor
    topic: competitor-pricing-data
    missingEvidence: Realized pricing for Armis, Sevco, and runZero is not publicly available; Axonius's realized pricing (post-discount) is also unknown; the Forrester TEI example of $775K/year is a list price example for one configuration, not an average or floor price.
    whyItMatters: Without realized pricing comparison, pricing power assessment is based on list price only; pricing pressure may be greater or lesser than estimated.
    diligencePath: Request actual contract samples or win/loss analysis with competitor pricing in data room; interview channel partners on pricing dynamics.
