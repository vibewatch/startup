- id: section-3
  title: Trust, security, compliance, and reliability
  body: "Axonius holds SOC 2 Type II certification for its commercial cloud environment, demonstrating operational controls for security, availability, and confidentiality. ISO 27001 certification is also claimed on the Axonius Security Center page. The Axonius Federal Systems subsidiary has achieved FedRAMP Moderate authorization, enabling deployment in federal agency environments; FedRAMP High authorization \u2014 required for the most sensitive government systems \u2014 has not been publicly confirmed, limiting access to the highest-classification federal environments.\nGDPR compliance is claimed for EU customer data handling, though no independent GDPR audit certificate is publicly disclosed. The integration of Cynerio introduces healthcare IoT and medical device data; HIPAA Business Associate Agreement (BAA) availability and HITRUST certification for the combined Cynerio product line have not been confirmed in public sources, representing a compliance gap for hospital customers requiring\
    \ HIPAA coverage. Axonius operates a public status page; historical uptime data and SLA terms are not published, making it difficult to independently assess reliability commitments. No public CVE record for Axonius was found in the National Vulnerability Database; however, a formal bug bounty program or public responsible disclosure policy is not prominently published."
  claimRefs:
  - CE006
  - CE007
  - CE015
  tableRefs: []
- id: section-4
  title: Competitive differentiation and roadmap
  body: "Axonius's primary technical differentiation is the breadth of its adapter library (400+ connectors), the accuracy of its normalization engine, and the depth of policy enforcement integration with existing customer toolsets. Competitors (Armis, runZero, Lansweeper) have fewer adapters or focus on specific asset classes (OT/IoT, network discovery). The deep adapter integration creates switching costs: once a customer has configured 40-80 adapters and built automated policies around the normalized asset view, replacing Axonius requires reconfiguring all integrations and rebuilding policies in a competing platform \u2014 a multi-month effort with significant security risk during transition.\nAnnounced roadmap investments include AI/ML-powered policy recommendations (reducing manual rule authoring for security teams), deeper integration of Cynerio's healthcare IoT capabilities within the main Axonius platform, and continued international expansion with support for EMEA-specific data\
    \ residency and compliance requirements. Axonius has not published a detailed feature roadmap with committed dates; all roadmap claims from public sources should be treated as unverified management guidance. The CEO transition to Joe Diamond (February 2026) and CFO Kramer's background (previously Sumo Logic) signal preparation for a public company operating model, which will require faster feature delivery transparency and investor-grade reporting discipline."
  claimRefs:
  - CE013
  tableRefs: []
