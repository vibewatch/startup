- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer/process/component
  - role
  - dependency
  - risk
  rows:
  - - Adapter collection layer
    - API connectors to 400+ third-party tools; scheduled telemetry pull; no agents on endpoints
    - Third-party tool REST APIs; API credentials managed by customer
    - API deprecation, rate-limiting, or credential rotation by vendors disrupts data freshness
  - - Data normalization engine
    - Schema translation; maps heterogeneous tool data to unified Axonius asset schema
    - Proprietary internal algorithm; adapter-specific normalization rules
    - Normalization accuracy degrades when adapters are missing or tool data is inconsistent; benchmarks not public
  - - Deduplication engine
    - Entity resolution; identifies same physical asset appearing in multiple tools under different IDs
    - Proprietary correlation algorithm (MAC address, hostname, IP, serial number matching)
    - False positives/negatives in deduplication create ghost records or merged records; error rate not disclosed
  - - Asset relationship graph
    - Maps relationships between assets, users, software, cloud resources, and policies
    - Internal graph data store (technology stack not disclosed)
    - Schema complexity grows with adapter breadth; query performance at scale not benchmarked publicly
  - - Policy enforcement engine
    - Rule-based automation; triggers alerts, ITSM tickets, and remediation workflows on policy violations
    - REST API integrations with SIEM, SOAR, ITSM (ServiceNow, Jira, Splunk, others)
    - Policy library update cadence not disclosed; rule complexity may require security engineering expertise
  - - Cloud SaaS delivery (multi-tenant)
    - Managed hosting for commercial customers; scalable, always-on; auto-updated
    - AWS (inferred; not officially confirmed); multi-tenant architecture
    - Cloud provider dependency; multi-tenant isolation risk; data residency constraints for non-US customers
  - - On-premises Federal edition
    - Dedicated deployment within federal agency infrastructure for FedRAMP environments
    - Customer-managed infrastructure + Axonius Federal Systems support
    - Slower feature cadence than SaaS edition; higher maintenance burden; update coordination overhead
  - - REST API / developer platform
    - Programmatic access to asset data and policy engine; custom adapter SDK; automation integration
    - Customer engineering teams; docs.axonius.com documentation
    - Developer ecosystem nascent; custom adapter quality depends on customer engineering capacity
  notes: Architecture layers inferred from public product documentation and adapter page. Cloud provider (AWS) is inferred, not confirmed. Internal technology stack details are not publicly disclosed.
  claimRefs:
  - CE003
  - CE004
  - CE005
  - CE008
figures:
- id: FE001
  title: Product architecture map
  type: stack
  summary: Technology stack layers for the Axonius CAASM platform from data collection at the bottom to user-facing policy enforcement at the top. Each layer depends on the layer below it; failure or gaps at any layer propagate upward.
  data:
    items:
    - label: User Interface and Reporting Layer
      note: Web dashboard; asset search and query; policy violation alerts; executive reporting; custom dashboards.
    - label: Policy Enforcement and Automation Layer
      note: Rule-based policy engine; alert triggers; ITSM ticket creation (ServiceNow, Jira); SOAR playbook invocation; REST API webhooks.
    - label: Asset Relationship and Graph Layer
      note: Relationship mapping between assets, users, cloud resources, and software; entity resolution; coverage gap identification.
    - label: Data Normalization and Deduplication Engine
      note: Schema translation from 400+ tool-specific schemas to unified Axonius asset schema; entity deduplication via MAC, hostname, serial number correlation.
    - label: Adapter Collection and Integration Layer
      note: 400+ API-based adapters; agentless; scheduled polling of EDR, MDM, CMDB, cloud, identity, network, vulnerability, and SaaS tools.
    - label: Security and Compliance Infrastructure
      note: SOC 2 Type II; ISO 27001; FedRAMP Moderate (Federal edition); multi-tenant SaaS (AWS inferred) + on-prem Federal deployment option.
  approximationNotes: Architecture layers inferred from public Axonius product documentation, adapters page, and security center. Internal implementation details (database, graph engine, AI/ML stack) are not publicly disclosed. AWS cloud inference based on standard enterprise SaaS patterns; not officially confirmed by Axonius.
