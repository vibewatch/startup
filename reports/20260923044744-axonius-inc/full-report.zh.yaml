      - - 高管阵容深度——CFO Avi Kramer（曾操盘 Sumo Logic IPO）；Dean Sysman 履新执行董事长
        - Payhawk 针对 CFO 的专访；Calcalist 关于 CEO 调整的报道
        - CFO 离职；正式 CEO 人选能力欠佳；投资人信心进一步承压
      - - CAASM 平台同质化——Microsoft、CrowdStrike、Palo Alto 加速内置资产管理模块
        - Microsoft Learn 官方文档；CrowdStrike Falcon Exposure Management；Palo Alto Cortex XSIAM
        - Microsoft 或 CrowdStrike 明确放弃自研 CAASM 计划；Axonius 在平台型巨头挤压下仍实现 NRR > 115%
      - - CEO 交接执行风险——过渡期领导层进入准上市冲刺阶段
        - Calcalist 关于 CEO 交接报道；Forbes IPO 前景展望；行业收并购/IPO 历史前例
        - 在 6 个月内迅速聘定具备深厚上市公司操盘经验的正式 CEO
      - - 估值倍数压缩风险——E 轮对应 17x ARR；公开市场同业仅 7-15x；基准情景上涨空间逼仄
        - 公开市场对标企业（SentinelOne、Qualys、Tenable）；Damodaran 股权估值乘数数据
        - AI 需求爆发驱动二级市场网安 SaaS 估值中枢重估至 20x+；或以 $2.0-2.2B 二级市场折价建仓
      - - 核心财务数据未披露——NRR、毛利率、现金消耗率尚无公开口径
