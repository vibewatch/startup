  - id: FM001
    title: CAASM 市场空间透视（TAM/SAM/SOM）
    type: pyramid
    summary: 自上而下分析师测算与自下而上 Axonius ARR 验证显示，2024 年 CAASM TAM 为 $1.47B，而 SAM 与 SOM 则受大企业客群范围及竞争格局制约。
    data:
      items:
        - label: TAM（2024 年全球 CAASM 市场）
          value: $1.47B
          detail: Dataintelo 自上而下测算；以 21.3% 复合年增长率（CAGR）在 2033 年增至 $10.33B。
          tone: positive
        - label: SAM（大企业与联邦可触达市场）
          value: ~$900M
          detail: 估计占 TAM 的 60% 为 Axonius 可触达范围（大型企业 + 联邦政府）；剔除当前 Axonius 销售重心以外的纯中端市场与中小企业。
          tone: neutral
        - label: SOM（Axonius 当前捕获市场）
          value: ~$150M ARR
          detail: 2024 年 Axonius ARR 达 $151.5M；约占估计 TAM 的 10%；契合高成长市场早期领跑者特征。公司收入同比增长 51.5%——远超 21.3% 的行业复合增速。
          tone: positive
        - label: 邻近领域 TAM（泛平台空间）
          value: $5-10B
          detail: 包含 SaaS 管理、软件资产管理、身份治理及相邻安全管理平台。
          tone: neutral
        - label: 大企业与联邦底线需求
          value: Structural demand
          detail: CISA CDM 与 DoD CMRS 为合规 CAASM 厂商奠定不可削减的联邦刚性需求底线。
          tone: neutral
        - label: 大规模部署定价基准
          value: $775K/year
          detail: Forrester TEI 所引 400,000-699,999 台设备部署范例；更宜作为定价参考信号而非实际平均客单价。
