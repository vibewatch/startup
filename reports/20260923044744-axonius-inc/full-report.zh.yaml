      - number: '3.2'
        title: 功能特性与核心能力横向对比
        blocks:
          - type: paragraph
            body: >-
              Axonius 的杀手锏是生态集成的广度与深度：400+ 开箱即用的适配器能够无死角抽取存量安全与 IT
              工具池数据，覆盖终端防护（CrowdStrike、SentinelOne、Defender）、主流公有云（AWS、Azure、GCP）、身份中枢（Okta、Azure AD）、网络基础设施及各类 SaaS
              软件。这种适配器优先的架构完全摒弃在每个终端强塞 Agent 的重型模式——直接复用企业已采买部署的基础设施，秒级汇聚全量资产总账。相比之下，Armis 核心靠旁路流量镜像分析，主打无代理切入无法安装软件的工控
              OT/IoT 资产；runZero 则走主动无凭据网络扫描路线（由 Metasploit 之父 HD Moore 操刀），在缺乏标准化安全工具的中小企业中落地更为敏捷。

              能力矩阵维度上，Axonius 在适配器支持数、政企合规认证（FedRAMP、SOC 2、ISO 27001）以及资产级策略联动处置上全面领跑。Armis 的强项在于零业务打扰的 OT/IoT
              被动侦测；runZero 胜在轻量敏捷与中小型客群的快速投产；ServiceNow 在 CMDB 流程集成与变更审计上不可撼动；Qualys 凭借漏洞数据库积淀，在 CVE 关联匹配深度上独步江湖；Tanium
              则在资产发现后具备极强的终端秒级指令下发与补丁派发能力。没有任何单点竞品能同时吃透 Axonius 在全域连接、政企合规与合规策略自动化闭环的三重护城河。Axonius 目前的核心短板则在：被动流量侧
              OT/IoT 侦测相对较弱（收购 Cynerio 补齐医疗短板）、缺乏原生漏洞漏洞扫描能力（高度仰赖第三方工具接入），以及按资产规模计费的定价逻辑较为繁琐。
