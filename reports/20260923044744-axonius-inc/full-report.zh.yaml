        - 多年期合同期限；4 个军种部署降低单一军种变动风险
        - 联邦预算自动削减；持续决议案（CR）预算风险；政党及政府轮替变数
      - - Microsoft 与 Google 平台生态
        - Microsoft（Azure、M365、Entra ID）；Google（GCP、Workspace）
        - 适配器遥测数据源；Axonius 依赖对这些平台的 API 访问权
        - 中等（Microsoft/Google 可限制 API 访问或开发竞品功能）
        - Microsoft Defender 或 Google Workspace 新增内置资产管理；Axonius 面向此类平台的适配器遭封禁或失去存在价值
        - 重大
        - 持续维护 API 集成；Axonius 依托超越单一平台的跨源汇聚广度形成差异化
        - 平台厂商 API 政策变动可能降低适配器质量；平台原生 CAASM 构成长期竞争风险
      - - 核心人才（特拉维夫研发中心；创始团队；资深工程师）
        - 内部人才储备；以色列研发团队
        - 核心技术研发；适配器工程；平台架构
        - 高（创始人主导的工程文化；研发地理分布高度集中）
        - 地缘政治事件、人才流失或关键创始人离职拖慢平台迭代速度
        - 重大
        - 具备竞争力的薪酬；股票期权；使命驱动文化
        - 地缘政治风险（以哈冲突）；以色列科技行业人才争夺战；CEO 交接可能引发人员流失
    notes: 依赖严重度与集中度基于架构分析得出。DoD 集中度测算值（15-25%）仅具方向性参考意义；真实联邦 ARR 未见披露。云服务商推断基于行业惯例；Axonius 官方尚未证实采用 AWS。
    claimRefs:
      - CR012
  - id: TV001
    title: 投资建议汇总表
    columns:
