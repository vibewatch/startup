      - number: '6.3'
        title: 留存、扩张与业务持续性
        blocks:
          - type: paragraph
            body: >-
              Axonius 未披露净收入留存率（NRR）、总金额留存率（GDR）、流失率或续约率；这些是评估 670+ 客户群业务持续性最核心的未披露指标。然而，多项结构性因素支撑高 NRR
              假说：基于适配器的集成模式带来了深厚的切换成本（客户通常配置 40–80+ 适配器并编写自定义策略规则）；按资产数量计费的模型随着客户资产规模扩张自然带来增购；此外，平台在合规报告中扮演关键角色（联邦场景的
              FISMA、商业场景的 SOC 2 审计筹备），若强行替换会破坏现有合规工作流。

              Forrester TEI 研究指出客户回本周期 <6 个月，表明价值兑现快，是强劲的留存抓手；统计上看，首年收回投资的客户流失概率更低。反映留存健康度的替代指标包括在 670+ 客户体量下持续的 ARR
              增长（2024 年同比增长 51.5%）——该增速与新客获取叠存量扩张的组合相吻合，不过具体拆分比例未知。

              业务扩张风险主要受宏观因素驱动：若客户资产总数增速放缓（受经济降温或资产优化项目影响），存量客户贡献的 ARR 增长就会减速；且 Axonius
              没有维持平台的最低席位扩充要求。集中度风险处于中等水平：尚无公开确认单一客户贡献超过 5% 的 ARR，但 DoD CMRS 合同可能在政府板块收入中占比较大；若 DoD 到期不续约，联邦业务 ARR
              或将大幅下滑。其余长尾客户（600+ 规模较小的企业客户）提供了客群分散度。
            claimRefs:
              - CU014
              - CU015
              - CU016
