      - number: '6.2'
        title: 具名客户证据与部署验证
        blocks:
          - type: paragraph
            body: >-
              Axonius 的具名客户证据覆盖政府、金融服务与科技等垂直行业。最突出的具名客户是美国国防部，Axonius CMRS 合同已覆盖 DoD 五大军种中的 4
              个（陆军、海军、空军、海军陆战队已确认；太空军尚未确认），且属于多年期平台采购——这是其大规模生产环境部署最明确的公开证据。此外，FedRAMP Moderate 授权等涉军相关证据也支持其在民事联邦机构的部署。

              Gartner Peer Insights 在 CAASM 类别中的评价显示，企业 IT 安全专业人员给出的评分证实了生产环境的部署。G2 评价同样印证客户使用 Axonius
              建立统一资产清单并开展安全覆盖缺口分析。March 2025 的 Forrester TEI 研究基于管理 400,000–699,999 项资产的真实部署复合模型，报告了每年 $775K 节省额、$3.22M
              净现值（NPV）以及 <6 个月回本周期。尽管该研究由厂商赞助，但取材自对实际客户的访谈。

              G2、Gartner Peer Insights 和 PeerSpot
              上的客户满意度评价指出的优势包括：适配器种类广泛、相比替代方案部署更快，以及统一资产视图质量高。负面反馈则集中在：定价不透明、大型资产环境总成本过高、首批适配器初期配置时间过长，以及开箱即用报表模板偏少。G2
              上有评价指出，针对中端市场部署，其价格“明显高于替代方案”，这表明 Axonius 可能因定价过高而脱离 10,000 项资产以下的市场。
