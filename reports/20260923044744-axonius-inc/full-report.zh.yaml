          tone: warning
        - id: operating-loss
          label: 预估经营亏损（成长期阶段）
          detail: 鉴于支持 51.5% 增速的前置投入大概率处于亏损状态；现金消耗情况未披露。
          tone: warning
        - id: future-expansion
          label: 业务扩张增量收入（驱动 NRR 提升）
          detail: 存量客户纳管资产规模自然扩容；附加功能模块增购（SaaS 管理、SAM、Cynerio）。
          tone: positive
      edges:
        - from: customer
          to: subscription
        - from: subscription
          to: platform-cost
        - from: subscription
          to: gross-profit
        - from: platform-cost
          to: gross-profit
        - from: gross-profit
          to: opex
        - from: opex
          to: operating-loss
        - from: customer
          to: future-expansion
        - from: future-expansion
          to: subscription
    approximationNotes: 毛利率与经营业绩系参照大企业 SaaS 板块基准进行的测算，未获 Axonius 官方证实。该流转模型仅供机理说明；实际营业成本（COGS）与运营费用（OpEx）细分数据不详。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI015
      - CI016
  - id: FE001
    title: 产品技术架构图
    type: stack
    summary: Axonius CAASM 平台技术栈分层体系，自底层数据采集延伸至顶层面相用户的策略执行。各层高度依赖下一层；任何层级的故障或缺失均向上逐级传导。
    data:
      items:
        - label: 用户交互与报表呈现层
          note: Web 控制台仪表盘；资产搜索与查询；策略违规告警；高管汇报面板；自定义数据视图。
        - label: 策略执行与自动化处置层
          note: 基于规则的策略引擎；告警触发机制；ITSM 工单自动派发（ServiceNow、Jira）；SOAR 剧本调用；REST API Webhook 联动。
        - label: 资产关联与图谱构建层
          note: 资产、用户、云资源与软件间关联拓扑映射；实体解析消歧；覆盖盲区智能识别。
        - label: 数据归一化与去重引擎
          note: 将 400+ 工具专有 Schema 映射统一至 Axonius 资产模型标准；通过 MAC 地址、主机名、序列号多维关联实现实体去重。
        - label: 适配器数据采集与集成层
          note: 400+ 依托 API 的适配器；无代理（agentless）架构；定时轮询 EDR、MDM、CMDB、云平台、身份认证、网络设备、漏洞扫描器与 SaaS 工具。
        - label: 安全合规基础设施
          note: SOC 2 Type II；ISO 27001；FedRAMP Moderate（联邦专版）；多租户 SaaS 部署（推断为 AWS）+ 联邦机构本地部署可选方案。
    approximationNotes: 技术架构分层系根据 Axonius 官方产品文档、适配器列表和安全中心信息推断。底层技术实现细节（数据库、图引擎、AI/ML 技术栈）未见公开披露。AWS 云托管推断基于企业 SaaS 通用范式；Axonius 官方尚未证实。
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
  - id: FU001
    title: 客户全生命周期旅程图
    type: journey-map
    summary: 大型企业 CISO 或 IT 安全总监采购并部署 Axonius 的完整旅程，贯穿初期认知至续约与扩容全生命周期。展现驱动 NRR 增长的采纳触点与增购飞轮。
    data:
      items:
        - label: 需求萌芽与痛点识别
          detail: CISO 或安全总监察觉资产台账盲区——各工具互为孤岛、数据无法互通；通过 Gartner CAASM 报告、同行引荐或安全峰会结识 Axonius。
        - label: 方案评估与价值验证（POV）
          detail: 3-9 个月大企业销售周期；Axonius 搭建对接 10-20 款适配器的验证环境；直观展示防护缺口与数据归一化精度；核心干系人涵盖 CISO 与 IT 总监。
        - label: 商务采购与合同签署
          detail: 采购多部门协同审查（财务、法务、安全）；审查 SOC 2 报告；签署主服务协议（MSA）；按纳管资产规模计费；大型企业典型 ACV 在 $300K-$1M+；签订单年或多年期合同。
        - label: 初期上线与适配器接入
          detail: 客户 IT 团队激活适配器（优先级：EDR、MDM、CMDB、云平台）；Axonius 客户成功经理全程跟进；配置首批策略规则；安全覆盖缺口大盘上线运转。
        - label: 全面投产与策略强制执行
          detail: 所有核心适配器接入上线；启用自动化策略执行；针对违规缺口自动派发 ITSM 工单；向 CISO 和董事会提报安全缺口治理成果；据 Forrester TEI 投资回报周期不足 6 个月。
        - label: 业务扩张（资产规模自然扩容）
          detail: 随着客户资产版图持续膨胀（云上新工作负载、收并购、新型终端设备），Axonius 纳管资产数自动攀升；下一续约周期通过单资产阶梯溢价拉动 ARR 水涨船高。
        - label: 模块交叉销售（SAM、SaaS 管理）
          detail: Axonius 销售团队推介 SAM 或 SaaS 管理附加模块；客户依托同一套适配器底层拓展新用例；单一平台胜过点状单点工具；带来增量 ACV 跃升。
        - label: 合同续约与 NRR 飞轮放大
          detail: 完成单年或多年期续约；切换成本极高（40-80 款适配器配置、定制化策略规则、报表工作流若替换竞品必须全量推倒重构）；资产盘子扩容下 NRR 大概率保持 100% 以上。
    approximationNotes: >-
      客户旅程阶段基于 Axonius 销售流程说明、Forrester TEI 客户访谈、G2 与 Gartner Peer Insights 评价提炼。采购周期长短与 ACV
      范围为行业基准参考值；具体数额因客户层级与所在地域而异。
    claimRefs:
      - CU003
      - CU004
      - CU008
      - CU014
      - CU015
      - CU016
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: Axonius 核心风险评估矩阵。行代表风险类别；列代表评估维度。单元格数值反映基于公开证据与结构分析所作定性严重程度评估（高 / 中 / 低 / 未知）。
    data:
      columns:
        - 发生概率
        - 若发生之影响
        - 缓解成熟度
        - 剩余严重程度
      rows:
        - label: 监管（HIPAA/FedRAMP/GDPR）
          values:
            - 高（HIPAA 尚未确认；FedRAMP 具年度重审风险；GDPR 持续合规）
            - 重大至阻断级（HIPAA 阻碍医疗行业；丧失 FedRAMP 等同失去联邦收入）
            - 中（FedRAMP 管控良好；HIPAA/GDPR 缺口未平）
            - 重大（HIPAA 缺口属近期阻断因素；FedRAMP 剩余风险偏低）
        - label: 法律（雇佣/出口管制）
          values:
            - 低（无活跃诉讼；大概率符合 WARN Act）
            - 轻微（罚款；声誉风险）
            - 高（预期具备标准法律合规水平）
            - 轻微（法律记录清晰；剩余风险偏低）
        - label: 运营（适配器故障/服务中断）
          values:
            - 高（适配器故障属日常状态；服务中断概率低但仍有可能）
            - 重大（客户资产清单数据脱节；影响客户满意度）
            - 中（适配器团队持续维护代码库；未公开 SLA）
            - 重大（无公开 SLA 或 MTTR 承诺；存在客户信任受损风险）
        - label: 团队与执行（CEO 换届）
          values:
            - 高（现为临时 CEO；正式人选仍在物色）
            - 严峻（IPO 前夕 CEO 换届系影响最深执行风险）
            - 低（Sysman 任执行董事长；Kramer 任 CFO；董事会深度参与）
            - 严峻（暂无正式 CEO 构成阻碍 IPO 时间表重大风险）
        - label: 财务（资本/现金消耗/IPO 窗口）
          values:
            - 中（收购 Cynerio 产生成本；IPO 市场波动）
            - 严峻（资本短缺意味须接受严苛条款过桥融资）
            - 低（财务细节未公开；现金跑道未知）
            - 重大（现金跑道未知；2025 年 Form D 披露含糊）
        - label: 竞争（平台商品化）
          values:
            - 中（Microsoft/CrowdStrike 正拓展 CAASM 相邻领域）
            - 严峻（平台产品捆绑恐将侵蚀独立 CAASM 核心价值）
            - 低（Axonius 具备适配器覆盖广度优势；切换成本显著）
            - 重大（主流平台若直接内嵌 CAASM 将构成长期战略风险）
        - label: 地缘政治（特拉维夫研发中心高度集中）
          values:
            - 中（截至研究基准日以加冲突仍在持续）
            - 重大（研发受阻；人才流失；引发投资方 ESG 顾虑）
            - 低（无公开业务连续性计划；人才集中风险依然存在）
            - 重大（地缘局势升级恐导致研发长期受阻）
    notes: 定性评估基于公开证据与结构分析。Axonius 并未发布正式风险登记册。高 / 重大 / 低评级反映尽调团队专业判断。
    claimRefs:
      - CR001
      - CR008
      - CR015
  - id: FV001
    title: 建议推演逻辑
    type: flow
    summary: 决策逻辑流贯通证据输入（市场、产品、客户、财务、风险、估值）与核心先决条件，最终推导出「持续跟踪 / 条件性买入」（TRACK / CONDITIONAL BUY）建议与评级上调触发条件。
    data:
      nodes:
        - id: market
          label: 市场 — $8.5B CAASM TAM；28% CAGR；零信任政策合规要求
          category: input
        - id: product
          label: 产品 — 400+ 适配器；
          category: input
        - id: customers
          label: 客户 — 670+ 企业客户；DoD CMRS；Forrester TEI 测算 ROI 达 156%
          category: input
        - id: financials
          label: 财务 — $151.5M ARR；51.5% 增速；NRR 未经证实
          category: input
        - id: risks
          label: 风险 — 临时 CEO；HIPAA 缺口；CAASM 商品化；资金储备未知
          category: input
        - id: valuation
          label: 估值 — $2.6B（对应 17x ARR）；入场估值已打满；基准情景回报持平至微薄
          category: input
        - id: thesis
          label: 市场 + 产品 + 客户证据坚实 → 投资论点成立
          category: logic
        - id: antithesis
          label: CEO 风险 + HIPAA 缺口 + NRR 未知 + 估值打满 → 反向论点实质成立
          category: logic
        - id: condition1
          label: 条件 1 — 聘任正式 CEO（具备上市公司操盘经验）
          category: condition
        - id: condition2
          label: 条件 2 — 确认 Cynerio 获得 HIPAA 认证
          category: condition
        - id: condition3
          label: 条件 3 — 虚拟数据室确认 NRR > 110%
          category: condition
        - id: track
          label: 持续跟踪（TRACK）— 观望 3-6 个月；等待条件确认
          category: output
        - id: buy
          label: 条件性买入（CONDITIONAL BUY）— 3 项条件全部满足；按 $2.0-2.6B 估值入场
          category: output
        - id: exit
          label: 规避 / 退出（AVOID / EXIT）— 确认触发论点破裂条件
          category: output
      edges:
        - from: market
          to: thesis
          label: 市场证据
        - from: product
          to: thesis
          label: 产品证据
        - from: customers
          to: thesis
          label: 客户证据
        - from: financials
          to: antithesis
          label: 未证实指标
        - from: risks
          to: antithesis
          label: 执行风险
        - from: valuation
          to: antithesis
          label: $2.6B 估值已打满
        - from: thesis
          to: track
          label: 论点有效但条件未定
        - from: antithesis
          to: track
          label: 反向论点实质成立；等待条件落地
        - from: condition1
          to: buy
          label: CEO 人选敲定
        - from: condition2
          to: buy
          label: HIPAA 认证确认
        - from: condition3
          to: buy
          label: NRR 获证实
        - from: track
          to: exit
          label: 触发论点破裂条件
    claimRefs:
      - CV001
