      - - 决策含义
        - 跟踪观察 3-6 个月；关键条件满足后买入；未获证实前避免在 $2.6B+ 估值追高
        - 严守建仓纪律是获取有利风险收益比的核心抓手
    notes: 投资建议对估值与达成条件高度敏感。本结论绝非对 Axonius 的泛化品质背书——标的公司基本面扎实，核心症结在于估值水平与入场纪律。评级上调前置条件：完成 CEO 聘任、证实 HIPAA 合规、证实 NRR 达标。
