  - id: TI003
    title: 单客经济模型表
    columns:
      - 指标
      - 数值
      - 置信度
      - 核心考量
      - 尽调问询项
    rows:
      - - 毛利率
        - 未披露
        - null
        - 衡量 SaaS 盈利能力与投资回报的核心指标；企业级 SaaS 基准通常为 70-80%
        - 索取按产品线划分的毛利率；对比 Qualys（78%）、Tenable（79%）等上市可比公司
      - - 净留存率（NRR）
        - 未披露
        - null
        - 单客经济模型中最重要的单一指标；验证客户锁定效应；高于 120% 才能撑起扩张驱动型增长
        - 索取按客户队列划分的 NRR；拆解新客与老客增购收入
      - - 获客成本（CAC）
        - 未披露
        - null
        - 直销为主且销售周期达 3-9 个月，推断 CAC 偏高；必须与 LTV 权衡评估
        - 索取按客群（商业与联邦）细分的 CAC；调取销售人员编制与薪酬数据
      - - 回本周期（推算）
        - <6 个月（客户侧，据 Forrester TEI）
        - low
        - 客户投资回本快；厂商端 CAC 回本周期未知且大概率更长（大型企业直销模式）
        - 区分客户侧 ROI 与厂商端 CAC 回本周期；索取厂商端回本数据
      - - 客户终身价值（LTV）
        - 未披露
        - null
        - 缺少 NRR 与流失率，无法测算 LTV；若 NRR 得到验证，深度集成意味着 LTV 处于高位
        - 索取平均合同期限、NRR、流失率及增购收入数据
      - - 总留存率（GDR）
        - 未披露
        - null
        - 即便 NRR 受增购拉动走高，GDR 仍能锁定底线流失率；验证基准 ARR 的稳固度
        - 索取 GDR；对标企业级 SaaS 90%+ 的行业基准
      - - 营业利润 / EBITDA
        - 未披露；大概率仍为负值（成长期 SaaS 公司）
        - null
        - 评估 IPO 准备度与资金需求的核心指标
        - 索取利润表；根据人员编制与已投入资本测算烧钱速度
      - - 销售效率（Magic Number）
        - 未披露
        - null
        - 新增 ARR 与上一期销售及市场推广（S&M）支出之比；销售周期拉长表明效率偏低
        - 索取最近 4 个季度的 S&M 支出与新增 ARR 增速
      - - SaaS 毛利率行业基准（上市可比公司）
        - Qualys：约 78%，Tenable：约 79%，SentinelOne：约 73%
        - medium
        - 仅作为方向性基准；考虑到集成交付成本，Axonius 毛利率大概率落在 65-80% 区间
        - 仅供参考；需索取 Axonius 实际毛利率
    notes: Axonius 的全部单客经济模型指标均无法从公开渠道获取。基准值参考网络安全上市可比 SaaS 公司。客户侧回本周期来自 Forrester TEI 综合案例（2025 年 3 月），并非厂商端运营指标。
