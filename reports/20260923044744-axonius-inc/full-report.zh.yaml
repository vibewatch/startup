chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 定位、使命与经营模式
        blocks:
          - type: paragraph
            body: >-
              Axonius Inc. 于 2017 年在纽约市创立，三位创始人 Dean Sysman、Ofri Shur 与 Avidor Bartov
              均出身以色列国防军（IDF）精锐网络情报部队。公司总部设于纽约市，核心研发中心位于以色列特拉维夫。为承接美国政府及国防部业务，公司设立了全资联邦子公司 Axonius Federal Systems
              LLC。公司将其使命定义为推动网络安全资产情报转化为行动力：帮助机构告别对数字环境的被动可见，迈向对暴露面与策略合规缺口的自动化、验证式修复。

              核心产品 Axonius Asset Cloud 是涵盖五大领域的统一平台：网络资产、SaaS 应用、软件资产、暴露面与身份凭证。平台采用无代理与 API
              架构，完全无需部署终端代理、传感器或网络扫描器。Axonius 通过适配器无缝连接 400+ 款现有安全与 IT
              工具，近实时采集资产数据并完成去重与归一化，精准筛查安全盲区、配置漂移及合规违规。工作流引擎提供包含 500+ 项预置动作的无代码自动化能力。部署形态极为灵活：数小时内即可跑通本地部署、私有云或全托管
              SaaS。截至 2024 年，公司已服务 670+ 家企业客户，年经常性收入（ARR）录得 $151.5M，较 2023 年同比增长约 51.5%。Axonius 被公认为业内 ARR 最快突破 $100M
              大关的网络安全独角兽之一。
            claimRefs:
