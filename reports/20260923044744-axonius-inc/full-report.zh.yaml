          tone: neutral
        - label: Qualys CSAM
          x: 6
          'y': 8
          detail: 原生漏洞数据整合；与脆弱性管理（VM）平台深度捆绑；适配器广度较窄但安全上下文深厚。
          tone: neutral
        - label: ServiceNow ITAM
          x: 8
          'y': 3
          detail: 占据统治地位的 CMDB/ITAM 平台；IT 工作流整合极其卓越，但安全深度与策略执行能力薄弱。
          tone: neutral
        - label: CrowdStrike Falcon
          x: 4
          'y': 9
          detail: 侧重终端的安全平台；对纳管终端具备最高安全深度；非终端资产覆盖能力有限。
          tone: warning
        - label: Tanium
          x: 6
          'y': 7
          detail: 实时终端遥测见长；对受管设备管控极强；但在云、SaaS 与网络资产覆盖上存在空白。
          tone: neutral
