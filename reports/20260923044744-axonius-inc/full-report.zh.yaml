      - number: '2.3'
        title: 客户分群与采购落地路径
        blocks:
          - type: paragraph
            body: >-
              Axonius 与 CAASM 方案的核心采购决策者是企业 CISO 及其安全运营中心（SOC）团队。预算通常由 CISO 或安全副总裁把控，IT
              运维与企业架构负责人共同参与选型。资金直接划拨自各大行业稳步扩容的网络安全专项预算。日常高频使用者则是负责资产检索、基线策略编排与安全响应的分析师或 IT 管理员。

              客群可划分为三个典型梯队。第一梯队为混合云架构庞杂的大型企业（员工数 5,000+），这是绝对核心盘；此类企业资产盲区痛感最深，且完全具备充沛预算支持 Forrester TEI 测算的标准大单：针对
              400,000 至 700,000 台设备规模每年斥资 $775,000+。第二梯队为中型企业（员工数
              1,000–5,000），随着标准化交付门槛下探，正在加速涌入。第三梯队为具有极高战略价值的联邦政府机构，准入门槛卡死在 FedRAMP 资质与严苛合规要求；Axonius
              专门成立联邦子公司打穿此生态。重点渗透行业涵盖高端制造、医疗健康（收购 Cynerio 赋能）、金融服务、数字媒体以及国防军工。获客通常经过严格的招采与 PoC
              流程：价值验证（PoV）、存量安全工具链纳管打通、数据归一化质量核验、自动化策略上线，自初筛到全面铺开通常耗时 3 至 9 个月。
            claimRefs:
