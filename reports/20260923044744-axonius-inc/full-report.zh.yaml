        - 数据室尽调查明 NRR > 110%、毛利率 > 70% 且拥有 12 个月以上现金跑道
    notes: 多空双方论点均基于公开证据。看空各项属于待定条件而非定论——每一项的消除都将推升投资价值。在达成投资决策前，悬而未决的问题须经数据室尽调证实。
