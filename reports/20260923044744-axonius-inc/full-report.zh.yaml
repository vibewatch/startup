      - number: '2.2'
        title: 市场规模与演进轨迹
        blocks:
          - type: paragraph
            body: >-
              多家独立研报对 CAASM 赛道已有扎实的数据测算。Dataintelo 预计全球 CAASM 市场规模在 2024 年录得 $1.47B，未来将以 21.3% 的年复合增长率（CAGR）在 2033 年飙升至
              $10.33B。DataInsightsMarket 研报同样证实，CAASM 软件板块至 2034 年前将长期保持两位数强劲扩张。这些估值在趋势方向上高度一致，但应视为前瞻性推算而非确凿的企业收入汇总——毕竟
              CAASM 作为一个独立品类尚处成长期，且各家厂商的具体创收数据均未公开。

              自下而上推算，仅 Axonius 一家在 2024 年就录得 $151.5M ARR，同比增速达 51.5%。若 Axonius 拿下 $1.47B 市场约 10% 的份额（对应其体量下的收入约
              $147M），自下而上的体量拆解与自上而下的行业大盘基本吻合。扣除传统 ITAM 与 CMDB 后，2024 年由专业独立软件厂商驱动的狭义 CAASM 市场大概率落在 $1B 至 $2B 之间。而计入 SaaS
              管理、软件资产管理与综合安全管理平台后，广义目标市场在 2025-2026 年有望膨胀至 $5B 至 $10B，具体取决于品类界定边界。

              在业务交织重叠的 ITAM 赛道，据 6sense 监测，ServiceNow 以约 30% 的市占率牢牢控盘，Jira Service Desk 占据 15.5%，UpKeep 分得 9.3%。Axonius
              在 ITAM 赛道占比较小，其真正的杀招并非工单流程或日常运维，而是极具深度的网络安全资产上下文关联。作为横向参照，全球网络安全大盘每年总体量约 $200B，年复合增速维持在 10–12%，CAASM
              无疑是这片广阔蓝海中兼具爆发力与稀缺性的高成长细分赛道。
