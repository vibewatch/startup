      - number: '7.2'
        title: 运营与技术风险
        blocks:
          - type: paragraph
            body: >-
              Axonius 基于适配器的集成模式带来了结构性运营风险：第三方工具厂商一旦变更 API（废弃接口端点、修改认证方式或调整数据结构），对应的 Axonius
              适配器就可能失效，在客户无法立即察觉的情况下导致资产清单出现数据断层。Axonius 维护着 400+ 适配器，API
              破损属于常态事件；适配器维护质量与修复响应速度直接影响客户满意度和留存率。公司未公开披露适配器更新 SLA 或针对损坏适配器的平均修复时间（MTTR）。

              归一化引擎的准确度是核心运营风险：去重错误（误判合并不同资产，或漏判产生虚假幽灵记录）会直接动摇“单一可信事实源”资产清单的核心价值。除非客户对照底层基准数据独立审计 Axonius
              资产库，否则这类错误很难被察觉；系统性归一化失效可能在毫无预警的情况下侵蚀客户信任并引发流失。归一化准确度基准指标未见公开披露。

              商业 SaaS 版本面临云基础设施可靠性风险：云服务商层面若发生长时间宕机（3+ 小时），客户将无法运行策略执行或访问资产清单；对于将 Axonius
              纳入安全事件应急响应工作流的客户，这会造成实质性运营冲击。公司虽设有状态页面，但未公布 SLA 条款与历史可用率。

              2024 年底约 100 人的裁员削减了工程与客户成功团队人数；若工程裁员波及适配器团队，适配器维护进度可能放缓；若客户成功团队缩编削弱了 CSM
              覆盖率，大型企业客户获得的支持质量可能下滑。这两项影响在公开来源中均未获得证实。
            claimRefs:
