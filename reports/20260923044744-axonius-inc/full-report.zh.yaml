  - id: FP001
    title: 竞争格局定位矩阵
    type: quadrant
    summary: Axonius 居于高集成广度/高安全深度象限；仅 Armis 与 Qualys 在安全深度上与其接近，而 ServiceNow 与 Lansweeper 虽具集成广度但安全深度偏弱。
    data:
      points:
        - label: Axonius
          x: 9
          'y': 9
          detail: CAASM 市场领军者；适配器数量居首（400+）；策略执行能力强；获 FedRAMP 授权。
          tone: positive
        - label: Armis Centrix
          x: 7
          'y': 8
          detail: 擅长被动式 OT/IoT 资产发现；模块化平台架构；安全深度具备竞争力，但 IT 适配器生态相对受限。
