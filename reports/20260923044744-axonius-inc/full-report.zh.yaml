      - - 估值立场
        - $2.6B 估值已透支；$2.0-2.2B 具吸引力
        - 鉴于执行风险，E 轮 17x 历史 ARR 估值已属偏高；建议优先通过二级市场老股折价建仓
      - - 目标持有期
        - 18-36 个月（至 IPO 或战略并购）
        - 阻碍清除后 IPO 窗口为 2026-2027 年；并购底线估值约 $2.0B
      - - 预期回报（基准情景）
        - 按 $2.6B 估值买入预期回报 -7% 至 +35%
