  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品矩阵与核心模块全景
        blocks:
          - type: paragraph
            body: >-
              Axonius 打造了多模块协同的网络安全资产管理平台。其基石产品是 CAASM（网络资产攻击面管理）：一套全域统一的资产中枢，通过 API 适配器自动采集存量安全与 IT
              工具池数据，完成多源去重与字段归一化，形成单资产维度的唯一黄金记录，并主动向安全与运维团队推送违规预警、防护盲区排查及风险处置优先级。CAASM 是整个平台最重要的创收顶梁柱，也是其他衍生模块依赖的数据底座。

              在 CAASM 底盘之上，Axonius 战略性横向延展了两大全新矩阵：SaaS 应用管理（涵盖 SSPM / SaaS 安全姿态管理）负责摸排全网已知与未知影子
              SaaS，严控高危越权并执行全生命周期治理合规；软件资产管理（SAM）则将软件授权许可底表与底层资产库打通，实现合规审计自动化、压降侵权罚款风险并剔除闲置软件浪费。两大新模块均原生集成在同一平台内并复用既有连接器生态，最大化降低了老客增购试点的摩擦力。

              联邦子公司 Axonius Federal Systems 专门推出了获得 FedRAMP Moderate 资质背书的政府定制版，配备完全物理隔离的合规基础设施与严格对齐 FISMA 及 DoD
              标准的安全风控基线。2025 年 7 月以最高 $250M 对价收入囊中的 Cynerio，为平台注入了专业的医疗 IoT
              及医疗设备防护能力；其技术底座的打通节奏与融合路线图目前尚无公开披露。公司旗下全线产品均未提供免费增值、社区试用或自主开通版本，全部采购必须经由直销团队完成大额商务谈判。
