              - CI012
              - CI013
          - type: callout
            title: 迎娶 Cynerio 预计直接抽干 40-60% 的账面可用现金储备
            body: >-
              高达 $250M 的潜在并购对价，相比 Axonius 估算的实际现金家底而言是一次极大规模的资本消耗。若 2025 年 SEC Form D
              申报确实对应为此发起的配套股权募资，意味着公司难以单靠账面积累独立吃下并购——不仅放大了老股东的股权稀释风险，也让公司在上市前夕的资本运作战术更显扑朔迷离。
