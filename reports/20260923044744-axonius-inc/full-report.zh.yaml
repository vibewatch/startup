      - number: '4.3'
        title: 单客经济模型与成本结构
        blocks:
          - type: paragraph
            body: >-
              Axonius 的底层单客经济指标在公开渠道极度匮乏。Forrester TEI 研报虽提供了详实的客户端 ROI 测算模型（3 年 ROI 156%、净现值 $3.22M、回本周期低于 6
              个月），但对厂商侧核心的毛利率、获客成本（CAC）及净留存率（NRR）守口如瓶。参照成熟企业级网络安全 SaaS 上市公司基准（如 Qualys、Tenable、SentinelOne
              等可比标的），Axonius 理论毛利率大概率落在 65–80% 舒适区间；基于 API 的适配器集成模式天然具备较低的单资产边际交付成本（无需硬件），但超大客交付落地的重度客户成功与运维开销将大幅拉低综合利润。

              CAC 数据未见公开披露；Axonius 重度押注直销团队，大单商务敲定周期普遍拉长至 3 到 9 个月（结合 CFO 表态与 Forrester 部署周期估算）。漫长的销售周期相较于 PLG 模式显著推高了
              CAC 获客成本。NRR 缺乏披露则是尽职调查中最致命的盲盒——鉴于其宣传的极高业务集成依赖，NRR 超越 120% 合乎商业逻辑，但迄今未获任何独立审计数据证实。

              Forrester TEI 报告披露的客户端单客经济模型极具参考价值：典型复合型大客户年付费约 $775K，三年累计投入约 $2.3M，换取约 $5.5M 综合收益，ROI 达
              156%。其收益核心来自三大支柱：日常安全运维提效 60–70%、未知资产归类能力提升 150%，以及外部入侵暴露风险压降 5%。如果这些客户端价值主张被高 NRR
              证实，将成为驱动增购与老客客单价膨胀的核心推手。缺少经审计的 NRR，仍是目前财务尽调中最关键的一处问号。
            claimRefs:
              - CI015
              - CI016
          - type: table
            tableRef: TI003
