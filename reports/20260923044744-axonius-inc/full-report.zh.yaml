      - number: '1.4'
        title: 业务规模、里程碑、收并购与行业认可
        blocks:
          - type: paragraph
            body: >-
              创立未满十年，Axonius 构筑了密集的业务里程碑。公司约于 2017 至 2018 年开启商业化，2023 年 ARR 突破 $100M，2024 年凭借 670+ 家企业客户将 ARR 推高至
              $151.5M。管理层给出的 2025 年 ARR 目标直指 $200M+。2023 年 3 月，联邦子公司在顺利完成与国防创新小组（DIU）及 DISA 新兴技术局的两个原型验证并通过 45
              项严苛测试后，正式拿下美国国防部（DoD）入场券。2024 年 12 月，基于已入选 DoD 统一采购协议（ESI BPA）的先发优势，美国国防部选定 Axonius Federal Systems
              承建其持续监控与风险评分（CMRS）现代化项目。

              2025 年 7 月，Axonius 祭出迄今最大手笔收购：以 $180M 首付外加最高可达 $250M 的里程碑对价，将医疗物联网及医疗设备安全领军企业 Cynerio
              收入囊中。这笔交易助其火速切入医疗健康与关键基础设施领域，并直接催生了 2025 年 10 月推出的 Axonius for Healthcare 以及基于 AI 的自动化研判与处置引擎 Axonius
              AI。2025 年 11 月，Axonius 优化裁员约 100 人——占当时约 900 人团队的近 10%，官方解释为高速扩张后的组织精简。合规资质方面，公司已通过 FedRAMP Moderate
              认证。行业荣誉方面，公司名列 2025 年福布斯全球云计算 100 强（Forbes Cloud 100）第 73 位，并获评 2026 年福布斯全美最佳初创雇主第 82 位。在总经理 Tom Kennedy
              带领下，Axonius Federal Systems 目前已覆盖美国国防部五大军种中的四个。
