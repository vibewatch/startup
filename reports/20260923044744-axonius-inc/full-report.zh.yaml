        - 美国联邦（HHS 民权办公室）
        - 合并平台尚未证实
        - 高（获客医疗客户必须具备）
        - 阻断医疗行业拓展
        - Cynerio 原有业务符合 HIPAA；Axonius 必须扩展或认证合并平台
        - HIPAA 证实前医院采购停滞；HITRUST 带来额外合规负担
        - 核实 HIPAA BAA 签署能力；获取 HITRUST 认证路线图与时间表
      - - FedRAMP Moderate 年度复评
        - 美国联邦（FedRAMP PMO / DoD）
        - 有效授权；须每年接受 3PAO 评估
        - 偏低至中等（已有成熟授权；属常规审计风险）
        - 重大（失去授权将阻断联邦收入）
        - 持续开展 3PAO 评估项目；配备专职联邦合规团队
        - 年度评估若有缺陷可能触发 POA&M 整改；存在临时授权风险
        - 查阅最新 3PAO 评估报告；确认未闭环 POA&M 事项；审查 FedRAMP 持续监控态势
      - - FedRAMP High 授权（尚未取得）
        - 美国联邦（FedRAMP PMO / DoD）
        - 尚未启动（推测）
        - 中等（DoD 确实存在 High 级别需求）
        - 重大（限制进入 TS/SCI 及 DoD 最机密环境）
        - 以 FedRAMP Moderate 授权为基础；进阶 High 级别需补充管控措施
        - 预计耗时 12-24 个月，另需 $2-5M+ 成本方可取得 FedRAMP High
        - 确认 FedRAMP High 是否列入路线图；评估所需投入；权衡 DoD 客户对 High 与 Moderate 级别的需求
      - - GDPR 与欧盟数据本地化（爱尔兰 DPC 监管）
        - 欧盟（GDPR）；主要 DPA：爱尔兰数据保护委员会
        - 声称合规；无独立审计认证
        - 中等（欧盟境内数据处理面临 DPC 调查风险）
        - 重大（GDPR 规定最高罚款可达 €20M 或全球收入的 4%）
        - EMEA 业务设在都柏林；推测已签署标准合同条款（SCC）；隐私政策符合 GDPR
        - 未见公开 DPA 或独立 GDPR 审计；任何欧盟客户投诉均可能引发 DPC 调查风险
        - 索取 GDPR 审计证书；审查 DPA 条款；确认跨境数据传输机制
      - - 美国各州隐私法（CCPA、CPRA、VCDPA 等）
        - 美国多州
        - 声称合规（隐私政策）
        - 偏低至中等（针对 B2B SaaS 的执法并不常见）
        - 轻微（罚款有限；主要是声誉风险）
        - 隐私政策符合 CCPA；为加州居民提供选择退出（opt-out）机制
        - 监管环境不断演变；随着新州法生效需持续跟进合规
        - 确认面向企业客户的 CCPA DPA 条款；审查数据主体权利处理流程
      - - 出口管制（EAR / 加密软件分类）
        - 美国联邦（工业和安全局 / 商务部）
        - 大概率受加密出口管制约束；分类尚未公开证实
        - 低（SaaS 领域违反出口管制较罕见）
        - 轻微至重大（罚款与声誉风险；限制国际扩张）
        - 符合标准企业级 SaaS EAR 要求（大概率适用大众市场加密豁免）
        - 必须禁止向受制裁地区（伊朗、俄罗斯、朝鲜）开展国际扩张
        - 确认 EAR 分类；审查国际客户筛查流程；确认符合 OFAC 规定
      - - 雇佣法（2024 年裁员 — WARN 法案合规）
        - 美国联邦及各州
        - 已完成（裁员发生于 2024 年底）
        - 低（WARN 法案针对裁员超 500 人的风险；Axonius 约 100 人）
        - 轻微（低于 WARN 法案门槛；各州类似法规可能适用）
        - 裁员约 100 人；大概率低于联邦 WARN 法案（500 人）门槛
        - 存在潜在州级 WARN 法案风险（纽约州、加州门槛较低）；未见已证实的诉讼
        - 核实 WARN 法案合规分析；核查是否存在与裁员相关的未结案劳动诉讼
