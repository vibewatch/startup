- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - evidence basis
  - what would change the view
  rows:
  - - "CAASM category leadership \u2014 largest adapter library, broadest enterprise base, Gartner Magic Quadrant leadership"
    - Gartner CAASM position; G2 reviews; 670+ customers; 400+ adapters (Axonius official)
    - Microsoft/CrowdStrike releasing FedRAMP-authorized CAASM at no incremental cost; Axonius losing Magic Quadrant position
  - - "Federal anchor \u2014 DoD CMRS multi-year contract across 4 of 5 branches; FedRAMP Moderate authorized"
    - GovConWire; Axonius Federal press; FedRAMP marketplace confirmation
    - DoD contract non-renewal or competitor winning a competing federal CAASM contract
  - - "Land-and-expand economics \u2014 platform stickiness; expanding use cases; Forrester TEI 156% ROI"
    - Forrester TEI (March 2025); Axonius customer testimonials; G2 reviews confirm high renewal intent
    - NRR confirmed below 100% in data room; customer churn events reported in reviews
  - - "Cynerio optionality \u2014 healthcare IoT expansion TAM; HIPAA compliance path when confirmed"
    - SiliconAngle Cynerio acquisition; HHS HIPAA framework
    - HIPAA certification delayed past Q4 2026; integration architectural mismatch confirmed
  - - "Executive bench \u2014 CFO Avi Kramer (Sumo Logic IPO); Dean Sysman as Executive Chairman"
    - Payhawk CFO interview; Calcalist CEO transition announcement
    - CFO departure; permanent CEO hire of poor quality; investor confidence further eroded
  - - "CAASM commoditization \u2014 Microsoft, CrowdStrike, Palo Alto adding asset management features"
    - Microsoft learn docs; CrowdStrike Falcon Exposure Management; Palo Alto Cortex XSIAM
    - Microsoft or CrowdStrike explicitly abandon CAASM plans; Axonius demonstrates NRR > 115% despite platform competition
  - - "CEO transition execution risk \u2014 interim leadership heading into pre-IPO phase"
    - Calcalist CEO transition; Forbes IPO outlook; general M&A/IPO precedent
    - Permanent CEO hired quickly (< 6 months) with strong public company operating track record
  - - "Valuation multiple compression \u2014 17x ARR at Series E; public comps at 7-15x; limited upside in base"
    - Public company comparables (SentinelOne, Qualys, Tenable); Damodaran equity multiples data
    - Public market cybersecurity SaaS re-rating to 20x+ driven by AI demand; or entry at $2.0-2.2B secondary
  - - "Undisclosed financial metrics \u2014 NRR, gross margin, burn rate not publicly available"
    - Absence of public financial disclosure; Getlatka ARR estimate only
    - Data room disclosure confirming NRR > 110%, gross margin > 70%, 12+ months cash runway
  notes: "Both thesis and anti-thesis are grounded in public evidence. The anti-thesis items are conditions, not certainties \u2014 resolution of each would upgrade the investment case. Unresolved items require data room confirmation before investment decision."
