- id: TR003
  title: Partner / dependency risk register
  columns:
  - dependency
  - counterparty
  - role
  - concentration
  - failure scenario
  - severity
  - mitigation
  - residual exposure
  rows:
  - - Cloud infrastructure provider (AWS inferred)
    - Amazon Web Services (inferred)
    - Multi-tenant SaaS hosting; compute, storage, networking
    - High (single cloud provider; no multi-cloud confirmed)
    - Extended AWS outage or AZ failure disrupts commercial SaaS platform
    - Material
    - AWS SLA; multi-AZ redundancy (standard practice); DR plan assumed
    - No multi-cloud confirmed; cloud provider not officially disclosed; failover RTO not published
  - - Third-party security tool API ecosystem (400+ vendors)
    - EDR, MDM, cloud, CMDB, identity, SIEM vendors collectively
    - Source of all asset telemetry; adapter ecosystem foundation
    - High (entire platform depends on third-party API ecosystem)
    - Mass API deprecation or authentication change breaks multiple adapters simultaneously
    - Material
    - Adapter maintenance team; adapter library breadth distributes risk
    - No single-adapter SLA; no disclosed monitoring for API deprecation signals
  - - FedRAMP PMO and DoD (FedRAMP authorization)
    - U.S. Government (GSA/FedRAMP PMO; DoD CIO)
    - Authorization grant for federal market access
    - High (all federal revenue depends on maintaining authorization)
    - Authorization suspended for material control deficiency; federal revenue at risk
    - Severe
    - Annual 3PAO assessment; continuous monitoring program; dedicated compliance team
    - Authorization suspension could occur in <90 days for material deficiency; no backup authorization
  - - DoD CMRS contract (customer concentration)
    - U.S. Department of Defense
    - Largest single customer or customer group; multi-year contract
    - High (estimated 15-25% of ARR; 4 of 5 DoD branches)
    - Contract non-renewal, termination for convenience, or budget freeze
    - Severe
    - Multi-year contract term; 4-branch adoption reduces single-branch risk
    - Federal budget sequestration; CR (continuing resolution) risk; political/administration change
  - - Microsoft and Google platform ecosystems
    - Microsoft (Azure, M365, Entra ID); Google (GCP, Workspace)
    - Source of adapter telemetry; Axonius depends on API access to these platforms
    - Medium (Microsoft/Google can restrict API access or build competing features)
    - Microsoft Defender or Google Workspace adds built-in asset management; Axonius adapters to these platforms blocked or rendered redundant
    - Material
    - API integrations maintained; Axonius differentiates on aggregation breadth beyond any single platform
    - Platform vendor API policy changes could reduce adapter quality; platform-native CAASM is a long-term competitive risk
  - - Key talent (Tel Aviv R&D; founding team; senior engineers)
    - Internal talent; Israeli R&D workforce
    - Core technology development; adapter engineering; platform architecture
    - High (founder-led engineering culture; geographically concentrated R&D)
    - Geopolitical event, talent exodus, or key founder departure degrades platform velocity
    - Material
    - Competitive compensation; stock options; mission-driven culture
    - Geopolitical risk (Israel-Gaza conflict); talent war in Israeli tech; CEO transition may trigger departures
  notes: Dependency severity and concentration based on structural analysis. DoD concentration estimate (15-25%) is directional only; actual federal ARR not disclosed. Cloud provider inference based on industry norms; AWS is not officially confirmed by Axonius.
  claimRefs:
  - CR012
figures:
- id: FR001
  title: Risk heatmap
  type: matrix
  layout: wide
  summary: Risk assessment matrix for Axonius across key risk categories. Rows represent risk categories; columns represent assessment dimensions. Cell values reflect qualitative severity assessment (High/Medium/Low/Unknown) based on public evidence and structural analysis.
  data:
    columns:
    - Likelihood
    - Impact if realized
    - Mitigation maturity
    - Residual severity
    rows:
    - label: Regulatory (HIPAA/FedRAMP/GDPR)
      values:
      - High (HIPAA not confirmed; FedRAMP annual risk; GDPR ongoing)
      - Material to Blocking (HIPAA blocks healthcare; FedRAMP loss = federal revenue loss)
      - Medium (FedRAMP well-managed; HIPAA/GDPR gaps open)
      - Material (HIPAA gap is near-term blocker; FedRAMP residual low)
    - label: Legal (employment/export controls)
      values:
      - Low (no active litigation; WARN Act likely compliant)
      - Minor (fines; reputational risk)
      - High (standard legal compliance expected)
      - Minor (clean legal record; low residual risk)
    - label: Operational (adapter breakage/outage)
      values:
      - High (adapter breakage is routine; outage low but possible)
      - Material (data gaps in customer inventory; CSM satisfaction)
      - Medium (adapter team maintains library; SLA not disclosed)
      - Material (no public SLA or MTTR commitment; customer trust risk)
    - label: People/Execution (CEO transition)
      values:
      - High (interim CEO; permanent search ongoing)
      - Severe (pre-IPO CEO transition is highest-impact execution risk)
      - Low (Sysman as Executive Chairman; Kramer CFO; board active)
      - Severe (no permanent CEO = blocking risk for IPO timeline)
    - label: Financial (capital/burn/IPO timing)
      values:
      - Medium (Cynerio acquisition cost; IPO market volatility)
      - Severe (capital shortfall = bridge at unfavorable terms)
      - Low (financial details undisclosed; runway unknown)
      - Material (cash runway unknown; 2025 Form D ambiguous)
    - label: Competitive (platform commoditization)
      values:
      - Medium (Microsoft/CrowdStrike investing in CAASM adjacency)
      - Severe (platform bundling could erode standalone CAASM value)
      - Low (Axonius has adapter breadth advantage; switching costs)
      - Material (long-term strategic risk if major platform adds CAASM)
    - label: Geopolitical (Tel Aviv R&D concentration)
      values:
      - Medium (Israel-Gaza conflict ongoing as of research date)
      - Material (R&D disruption; talent attrition; investor ESG concerns)
      - Low (no public continuity plans; talent concentration persists)
      - Material (geopolitical escalation could disrupt R&D for extended period)
  notes: Qualitative assessments based on public evidence and structural analysis. Axonius does not publish a formal risk register. High/Material/Low ratings reflect diligence team judgment.
