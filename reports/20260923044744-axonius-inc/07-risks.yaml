    - FedRAMP Moderate authorization as foundation; path to High requires additional controls
    - Estimated 12-24 months and $2-5M+ additional cost to achieve FedRAMP High
    - Confirm if FedRAMP High is on roadmap; assess investment needed; evaluate DoD customer demand for High vs Moderate
  - - GDPR and EU data residency (DPC Ireland supervision)
    - 'EU (GDPR); primary DPA: Data Protection Commission Ireland'
    - Claimed compliance; no independent audit certificate
    - Medium (DPC investigation risk for EU-based data processing)
    - "Material (\u20AC20M or 4% global revenue maximum fine under GDPR)"
    - Dublin-based EMEA operations; SCCs in place (inferred); privacy policy GDPR aligned
    - No public DPA or independent GDPR audit; DPC inquiry risk from any EU customer complaint
    - Request GDPR audit certificate; review DPA terms; confirm cross-border transfer mechanism
  - - U.S. state privacy laws (CCPA, CPRA, VCDPA, others)
    - U.S. multi-state
    - Claimed compliance (privacy policy)
    - Low-medium (enforcement actions against B2B SaaS are uncommon)
    - Minor (fines limited; primarily reputational risk)
    - Privacy policy aligned with CCPA; opt-out mechanisms for California residents
    - Regulatory landscape evolving; compliance updates required as new state laws take effect
    - Confirm CCPA DPA terms for enterprise customers; review data subject rights procedures
  - - Export controls (EAR / encryption software classification)
    - U.S. federal (Bureau of Industry and Security / Commerce Dept)
    - Likely subject to encryption export controls; classification not publicly confirmed
    - Low (export controls violations are uncommon in SaaS)
    - Minor-material (fines and reputational risk; international expansion restrictions)
    - Standard enterprise SaaS EAR compliance (Mass Market encryption exception likely)
    - International expansion to sanctioned jurisdictions (Iran, Russia, North Korea) must be prohibited
    - Confirm EAR classification; review international customer screening process; confirm OFAC compliance
  - - "Employment law (2024 layoffs \u2014 WARN Act compliance)"
    - U.S. federal and state
    - Completed (layoffs occurred late 2024)
    - Low (WARN Act risk for layoffs >500 employees; Axonius at ~100)
    - Minor (below WARN Act threshold; state equivalents may apply)
    - ~100 employees laid off; likely below federal WARN Act (500 employee) threshold
    - Potential state WARN Act exposure (NY, CA have lower thresholds); no confirmed litigation
    - Confirm WARN Act compliance analysis; verify no active employment litigation related to layoffs
