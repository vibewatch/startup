    topic: hipaa-hitrust-certification-timeline
    missingEvidence: The HIPAA BAA availability timeline and HITRUST certification roadmap for the combined Axonius-Cynerio platform are not publicly disclosed; without confirmed HIPAA coverage, hospital customers cannot deploy; the gap is a near-term blocking risk for healthcare vertical expansion.
    whyItMatters: Healthcare IoT is the primary strategic rationale for the $250M Cynerio acquisition; if HIPAA certification is delayed past Q4 2026, the acquisition return model is materially impaired; this is the highest-priority near-term risk requiring diligence confirmation.
    diligencePath: Request HIPAA BAA availability timeline from Axonius management; confirm HITRUST assessment start date; review Cynerio's pre-acquisition HIPAA compliance posture; assess integration engineering roadmap for HIPAA-relevant data handling.
