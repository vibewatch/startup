      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: IDF cyber pedigree and technical founders create durable differentiation
            body: >-
              All three founders trained in elite IDF cyber intelligence units before building Axonius, giving the
              company deep technical credibility in the security community and access to a talent pipeline that is
              difficult to replicate. This background is directly visible in the product's ability to support DoD-level
              security requirements and pass rigorous government procurement evaluations.
            calloutType: strength
            claimRefs:
              - CO002
          - type: callout
            title: Flat 2024 valuation reflects deliberate positioning not business reversal
            body: >-
              The decision to raise at a flat $2.6B in March 2024 was explicit and intentional. CEO Dean Sysman stated
              he never optimizes for valuation at fundraising; Lightspeed described Axonius as one of its
              best-performing companies and doubled down. The 51.5% ARR growth from 2023 to 2024 is inconsistent with a
              distressed narrative. The flat valuation reflects market multiple compression across the growth software
              sector.
            calloutType: insight
            claimRefs:
              - CO017
              - CO018
          - type: callout
            title: Simultaneous CEO transition, acquisition integration, and IPO prep create execution risk
            body: >-
              Axonius is managing a CEO transition (Sysman to Diamond), integration of the $180M Cynerio acquisition, a
              post-layoff workforce realignment, and IPO preparation simultaneously. Joe Diamond's track record as CEO
              is unproven; his tenure as President began only in August 2025. Key-person risk around Dean Sysman's
              network may not transfer cleanly to the new operating structure.
            calloutType: risk
