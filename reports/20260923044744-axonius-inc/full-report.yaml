      - number: '3.4'
        title: Adverse competitive evidence and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Three adverse signals warrant attention. First, the Cisco acquisition talks at approximately $2B (denied
              by Axonius) suggest that the CAASM market is attractive enough for large platform vendors to consider
              acquisition — but also that Axonius may face increasing pressure from platform consolidation as
              competitors accelerate inorganic growth. Second, CrowdStrike's Falcon platform has added asset discovery
              and management capabilities within its unified agentic security platform; as CrowdStrike penetrates
              enterprises for endpoint protection (already deployed in the majority of large enterprises), its ability
              to provide asset inventory as a byproduct of its endpoint agent represents an existential commoditization
              path for the Axonius market. Third, Armis has publicly claimed monitoring of billions of assets across its
              Centrix platform, with modular capabilities spanning OT, IoT, medical devices, and vulnerability
              prioritization that directly compete with Axonius's expanding healthcare and ICS ambitions.

              Positive competitive evidence includes: Axonius's 51.5% ARR growth in 2024 — well above CAASM market CAGR
              — suggests it is taking market share rather than losing it; the Forrester TEI study (156% ROI, sub-6 month
              payback) provides customers with strong justification to retain and expand Axonius deployments; and the
              DoD CMRS contract provides a structural federal moat that competitors without FedRAMP Moderate
              authorization cannot immediately challenge. The Cynerio acquisition adds a defensive moat in healthcare
              IoT, a segment where Claroty and Armis are Axonius's primary competition.
            claimRefs:
              - CP001
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: CrowdStrike's Falcon platform is the highest-probability commoditization threat
            body: >-
              CrowdStrike already has its endpoint agent deployed in the majority of large enterprises. As it adds asset
              discovery capabilities for non-endpoint assets and bundles them into Falcon modules at no incremental
              cost, it can erode Axonius's value proposition in the installed base without needing to win a competitive
              evaluation. Unlike runZero or Armis, CrowdStrike doesn't need to replace Axonius — it just needs to make
              the buyer question whether they need both.
            calloutType: risk
            claimRefs:
              - CP001
          - type: callout
            title: 400+ adapter library creates durable integration switching cost
            body: >-
              Axonius's integration depth is not easily replicated. Building production-grade adapters for 400+ security
              and IT tools, validating data normalization, and maintaining them as APIs evolve is years of engineering
              effort. Even CrowdStrike's massive platform does not have equivalent purpose-built CAASM adapters. This
              creates a structural switching cost that is particularly durable in enterprise accounts with complex
              heterogeneous tool stacks.
            calloutType: strength
            claimRefs:
              - CP013
              - CP014
          - type: callout
            title: No confirmed net revenue retention data limits moat durability assessment
            body: >-
              The most critical unknown in assessing competitive durability is Axonius's net revenue retention (NRR). If
              NRR is above 120%, the adapter lock-in thesis is confirmed; if below 110%, competitive displacement is
              already occurring. Without NRR data, all moat durability claims are based on integration depth logic
              rather than empirical customer retention evidence.
            calloutType: insight
            claimRefs:
