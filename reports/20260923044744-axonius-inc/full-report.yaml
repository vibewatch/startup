      - number: '5.3'
        title: Trust, security, compliance, and reliability
        blocks:
          - type: paragraph
            body: >-
              Axonius holds SOC 2 Type II certification for its commercial cloud environment, demonstrating operational
              controls for security, availability, and confidentiality. ISO 27001 certification is also claimed on the
              Axonius Security Center page. The Axonius Federal Systems subsidiary has achieved FedRAMP Moderate
              authorization, enabling deployment in federal agency environments; FedRAMP High authorization — required
              for the most sensitive government systems — has not been publicly confirmed, limiting access to the
              highest-classification federal environments.

              GDPR compliance is claimed for EU customer data handling, though no independent GDPR audit certificate is
              publicly disclosed. The integration of Cynerio introduces healthcare IoT and medical device data; HIPAA
              Business Associate Agreement (BAA) availability and HITRUST certification for the combined Cynerio product
              line have not been confirmed in public sources, representing a compliance gap for hospital customers
              requiring HIPAA coverage. Axonius operates a public status page; historical uptime data and SLA terms are
              not published, making it difficult to independently assess reliability commitments. No public CVE record
              for Axonius was found in the National Vulnerability Database; however, a formal bug bounty program or
              public responsible disclosure policy is not prominently published.
            claimRefs:
              - CE006
              - CE007
              - CE015
      - number: '5.4'
        title: Competitive differentiation and roadmap
        blocks:
          - type: paragraph
            body: >-
              Axonius's primary technical differentiation is the breadth of its adapter library (400+ connectors), the
              accuracy of its normalization engine, and the depth of policy enforcement integration with existing
              customer toolsets. Competitors (Armis, runZero, Lansweeper) have fewer adapters or focus on specific asset
              classes (OT/IoT, network discovery). The deep adapter integration creates switching costs: once a customer
              has configured 40-80 adapters and built automated policies around the normalized asset view, replacing
              Axonius requires reconfiguring all integrations and rebuilding policies in a competing platform — a
              multi-month effort with significant security risk during transition.

              Announced roadmap investments include AI/ML-powered policy recommendations (reducing manual rule authoring
              for security teams), deeper integration of Cynerio's healthcare IoT capabilities within the main Axonius
              platform, and continued international expansion with support for EMEA-specific data residency and
              compliance requirements. Axonius has not published a detailed feature roadmap with committed dates; all
              roadmap claims from public sources should be treated as unverified management guidance. The CEO transition
              to Joe Diamond (February 2026) and CFO Kramer's background (previously Sumo Logic) signal preparation for
              a public company operating model, which will require faster feature delivery transparency and
              investor-grade reporting discipline.
            claimRefs:
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base segmentation and verticals
        blocks:
          - type: paragraph
            body: >-
              Axonius has disclosed 670+ enterprise customers as of 2024, growing from a sub-500 count in 2022. The
              platform targets large enterprises with complex, heterogeneous IT environments — specifically
              organizations managing 10,000+ assets across multiple on-premises, cloud, and SaaS environments. The ideal
              customer profile (ICP) is a Fortune 1000 company with a mature security operations team and existing
              investments in multiple endpoint, identity, and cloud security tools that generate fragmented,
              unreconciled asset data. Axonius monetizes the need to aggregate these tools into a unified asset
              inventory without replacing them.

              Verticals represented in public customer evidence include financial services (banks, insurance, asset
              managers), technology companies, healthcare organizations, U.S. federal government and DoD, manufacturing,
              retail, and telecommunications. The DoD CMRS multi-year contract (December 2024) with 4 of the 5 major DoD
              branches is the most significant single customer relationship by strategic value. Geographically,
              Axonius's customer base is predominantly North American, with EMEA expansion underway from the Dublin
              office; international revenue as a proportion of total ARR is not disclosed.

              Buyer personas are primarily security-focused: CISO, Director of Security Operations, and VP of IT
              Security are the most common titles in published customer testimonials and G2 reviews. IT Operations
              leadership (CTO, IT Director) appears as a secondary buyer, particularly for SAM and SaaS Management
              modules. The typical deal is procured at the CISO level with IT Operations as the operator, and
              Finance/Procurement as approver. There is no self-serve or product-led growth path; all customer
              relationships begin with direct enterprise sales, contributing to long sales cycles (3-9 months).
