          label: Enterprise customer (CISO budget)
          detail: 670+ enterprise customers; annual subscription payments; asset count-based billing.
          tone: positive
        - id: subscription
          label: Annual subscription payment
          detail: $775K/year for 400K-700K device example; recognition ratably over contract period.
          tone: positive
        - id: platform-cost
          label: Platform delivery cost (COGS)
          detail: Cloud hosting, adapter maintenance (400+ connectors), customer success, and professional services.
          tone: neutral
        - id: gross-profit
          label: Estimated gross profit (~65-80% of revenue)
          detail: Gross margin estimated at 65-80% based on enterprise SaaS benchmarks; not confirmed publicly.
          tone: neutral
        - id: opex
          label: Operating expenses (S&M, R&D, G&A)
          detail: >-
            Direct sales model with long enterprise cycles (high S&M); active R&D for adapter maintenance and new
            modules.
          tone: warning
        - id: operating-loss
          label: Estimated operating loss (growth-stage)
          detail: Likely operating at a loss given 51.5% growth investment; cash burn not disclosed.
          tone: warning
        - id: future-expansion
          label: Expansion revenue (NRR uplift)
          detail: Asset count expansion within existing customers; add-on module upsells (SaaS, SAM, Cynerio).
          tone: positive
      edges:
