  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Technology stack layers for the Axonius CAASM platform from data collection at the bottom to user-facing policy
      enforcement at the top. Each layer depends on the layer below it; failure or gaps at any layer propagate upward.
    data:
      items:
        - label: User Interface and Reporting Layer
          note: Web dashboard; asset search and query; policy violation alerts; executive reporting; custom dashboards.
        - label: Policy Enforcement and Automation Layer
          note: >-
            Rule-based policy engine; alert triggers; ITSM ticket creation (ServiceNow, Jira); SOAR playbook invocation;
            REST API webhooks.
        - label: Asset Relationship and Graph Layer
          note: >-
            Relationship mapping between assets, users, cloud resources, and software; entity resolution; coverage gap
            identification.
        - label: Data Normalization and Deduplication Engine
          note: >-
            Schema translation from 400+ tool-specific schemas to unified Axonius asset schema; entity deduplication via
            MAC, hostname, serial number correlation.
        - label: Adapter Collection and Integration Layer
          note: >-
            400+ API-based adapters; agentless; scheduled polling of EDR, MDM, CMDB, cloud, identity, network,
            vulnerability, and SaaS tools.
        - label: Security and Compliance Infrastructure
          note: >-
            SOC 2 Type II; ISO 27001; FedRAMP Moderate (Federal edition); multi-tenant SaaS (AWS inferred) + on-prem
            Federal deployment option.
    approximationNotes: >-
      Architecture layers inferred from public Axonius product documentation, adapters page, and security center.
      Internal implementation details (database, graph engine, AI/ML stack) are not publicly disclosed. AWS cloud
      inference based on standard enterprise SaaS patterns; not officially confirmed by Axonius.
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Customer journey for an enterprise CISO or IT security director purchasing and deploying Axonius, from initial
      awareness through renewal and expansion. Illustrates adoption surfaces and expansion loops that drive NRR.
    data:
      items:
        - label: Awareness and problem recognition
          detail: >-
            CISO or security director identifies asset inventory blindspot — tools don't talk to each other; discovers
            Axonius through Gartner CAASM category, peer referral, or security conference.
        - label: Evaluation and proof-of-value (POV)
          detail: >-
            3-9 month enterprise sales cycle; Axonius deploys POV environment connecting 10-20 adapters; demonstrates
            coverage gaps and normalization accuracy; key stakeholders: CISO + IT Director.
        - label: Enterprise procurement and contract signature
          detail: >-
            Procurement review (Finance, Legal, Security); SOC 2 review; Master Service Agreement; pricing based on
            asset count; typical ACV $300K-$1M+ for large enterprise; annual or multi-year term.
        - label: Initial deployment and adapter rollout
          detail: >-
            Customer IT team activates adapters (priority: EDR, MDM, CMDB, cloud); Axonius CSM guides onboarding; first
            policy rules configured; coverage gap dashboard goes live.
        - label: Full production and policy enforcement
          detail: >-
            All critical adapters live; automated policy enforcement active; ITSM tickets generated for gap violations;
            security coverage gap reports shared with CISO and board; <6 month payback per Forrester TEI.
        - label: Expansion (asset count growth)
          detail: >-
            As customer's asset estate grows (new cloud workloads, M&A, new devices), asset count in Axonius increases
            automatically; ARR expands at next renewal via price-per-asset ratchet.
        - label: Module cross-sell (SAM, SaaS Management)
          detail: >-
            Axonius sales proposes SAM or SaaS Management add-on; customer uses same adapters for additional use case;
            single platform vs. point tool argument; incremental ACV increase.
        - label: Renewal and NRR expansion
          detail: >-
            Annual or multi-year renewal; switching cost is high (40-80 adapter configurations, custom policy rules,
            reporting workflows all must be rebuilt in alternative); NRR likely >100% if estate grows.
    approximationNotes: >-
      Customer journey stages based on Axonius sales process descriptions, Forrester TEI customer interviews, G2 and
      Gartner Peer Insights reviews. Cycle lengths and ACV ranges are benchmarks; actual values vary by customer segment
      and geography.
    claimRefs:
      - CU003
      - CU004
      - CU008
      - CU014
      - CU015
      - CU016
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Risk assessment matrix for Axonius across key risk categories. Rows represent risk categories; columns represent
      assessment dimensions. Cell values reflect qualitative severity assessment (High/Medium/Low/Unknown) based on
      public evidence and structural analysis.
    data:
      columns:
        - Likelihood
        - Impact if realized
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Regulatory (HIPAA/FedRAMP/GDPR)
          values:
            - High (HIPAA not confirmed; FedRAMP annual risk; GDPR ongoing)
            - Material to Blocking (HIPAA blocks healthcare; FedRAMP loss = federal revenue loss)
            - Medium (FedRAMP well-managed; HIPAA/GDPR gaps open)
            - Material (HIPAA gap is near-term blocker; FedRAMP residual low)
        - label: Legal (employment/export controls)
          values:
            - Low (no active litigation; WARN Act likely compliant)
            - Minor (fines; reputational risk)
            - High (standard legal compliance expected)
            - Minor (clean legal record; low residual risk)
        - label: Operational (adapter breakage/outage)
          values:
            - High (adapter breakage is routine; outage low but possible)
            - Material (data gaps in customer inventory; CSM satisfaction)
            - Medium (adapter team maintains library; SLA not disclosed)
            - Material (no public SLA or MTTR commitment; customer trust risk)
        - label: People/Execution (CEO transition)
          values:
            - High (interim CEO; permanent search ongoing)
            - Severe (pre-IPO CEO transition is highest-impact execution risk)
            - Low (Sysman as Executive Chairman; Kramer CFO; board active)
            - Severe (no permanent CEO = blocking risk for IPO timeline)
        - label: Financial (capital/burn/IPO timing)
          values:
            - Medium (Cynerio acquisition cost; IPO market volatility)
            - Severe (capital shortfall = bridge at unfavorable terms)
            - Low (financial details undisclosed; runway unknown)
            - Material (cash runway unknown; 2025 Form D ambiguous)
        - label: Competitive (platform commoditization)
          values:
            - Medium (Microsoft/CrowdStrike investing in CAASM adjacency)
            - Severe (platform bundling could erode standalone CAASM value)
            - Low (Axonius has adapter breadth advantage; switching costs)
            - Material (long-term strategic risk if major platform adds CAASM)
        - label: Geopolitical (Tel Aviv R&D concentration)
          values:
            - Medium (Israel-Gaza conflict ongoing as of research date)
            - Material (R&D disruption; talent attrition; investor ESG concerns)
            - Low (no public continuity plans; talent concentration persists)
            - Material (geopolitical escalation could disrupt R&D for extended period)
    notes: >-
      Qualitative assessments based on public evidence and structural analysis. Axonius does not publish a formal risk
      register. High/Material/Low ratings reflect diligence team judgment.
    claimRefs:
      - CR001
      - CR008
      - CR015
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Decision logic flow from evidence inputs (market, product, customers, financials, risks, valuation) through key
      conditions to the final TRACK / CONDITIONAL BUY recommendation with upgrade conditions.
    data:
      nodes:
        - id: market
          label: Market — $8.5B CAASM TAM; 28% CAGR; zero trust mandates
          category: input
        - id: product
          label: Product — 400+ adapters;
          category: input
        - id: customers
          label: Customers — 670+ enterprise; DoD CMRS; Forrester TEI 156% ROI
          category: input
        - id: financials
          label: Financials — $151.5M ARR; 51.5% growth; NRR UNCONFIRMED
          category: input
        - id: risks
          label: Risks — CEO interim; HIPAA gap; CAASM commoditization; capital unknown
          category: input
        - id: valuation
          label: Valuation — $2.6B at 17x ARR; full at entry; base case flat-to-modest return
          category: input
        - id: thesis
          label: Strong market + product + customer evidence → thesis intact
          category: logic
        - id: antithesis
          label: CEO risk + HIPAA gap + NRR unknown + full valuation → anti-thesis material
          category: logic
        - id: condition1
          label: CONDITION 1 — Permanent CEO hired (public company operator)
          category: condition
        - id: condition2
          label: CONDITION 2 — HIPAA certification confirmed for Cynerio
          category: condition
        - id: condition3
          label: CONDITION 3 — NRR > 110% confirmed in data room
          category: condition
        - id: track
          label: TRACK — Monitor for 3-6 months; await condition confirmation
          category: output
        - id: buy
          label: CONDITIONAL BUY — All 3 conditions met; entry at $2.0-2.6B
          category: output
        - id: exit
          label: AVOID / EXIT — Thesis-break trigger confirmed
          category: output
      edges:
        - from: market
          to: thesis
          label: Market evidence
        - from: product
          to: thesis
          label: Product evidence
        - from: customers
          to: thesis
          label: Customer evidence
        - from: financials
          to: antithesis
          label: Unconfirmed metrics
        - from: risks
          to: antithesis
          label: Execution risk
        - from: valuation
          to: antithesis
          label: Full at $2.6B
        - from: thesis
          to: track
          label: Thesis valid but conditions unresolved
        - from: antithesis
          to: track
          label: Anti-thesis material; wait for conditions
        - from: condition1
          to: buy
          label: CEO resolved
        - from: condition2
          to: buy
          label: HIPAA confirmed
        - from: condition3
          to: buy
          label: NRR confirmed
        - from: track
          to: exit
          label: Thesis-break trigger fires
    claimRefs:
      - CV001
