      - number: '1.2'
        title: Leadership, governance, and key-person structure
        blocks:
          - type: paragraph
            body: >-
              Axonius experienced a significant leadership transition in February 2026. Co-founder and CEO Dean Sysman
              announced he was moving into an Executive Chairman role, citing personal reflection and a desire to
              separate the mindsets required to build versus scale a business. Joe Diamond, who had been Chief Marketing
              Officer before being elevated to President in August 2025, assumed the additional role of Interim CEO. The
              transition was framed publicly as pre-IPO preparation, with Sysman committing to remain engaged on
              strategic vision while Diamond takes operational control.

              The broader leadership team reflects an intentional build-out toward public-company readiness. Chris
              Kramer serves as CFO, recruited specifically for pre-IPO preparation; he has publicly acknowledged
              elongated enterprise sales cycles as a challenge. Klaus Moser joined as SVP Global Sales in late 2025,
              bringing prior experience at Qualys and MobileIron. Ernesto Tey joined as VP Global Partners and
              Alliances, with a background spanning Okta, VMware, and Meta, known for building partner-driven revenue
              ecosystems. Tom Kennedy leads Axonius Federal Systems as General Manager. Co-founders Ofri Shur and Avidor
              Bartov remain with the company, though their current operating roles are less publicly specified. The
              company's governance structure is conventional private-company board governance, with backers including
              Accel, Lightspeed Venture Partners, Stripes, Bessemer Venture Partners, OpenView, and Silver Lake
              Waterman. The concentration of company identity in founders and particularly Dean Sysman — who built the
              company's public profile and key customer relationships — represents an ongoing key-person risk even as
              Diamond assumes operational leadership.
            claimRefs:
              - CO021
              - CO027
          - type: table
            tableRef: TO002
            claimRefs:
              - CO026
              - CO027
              - CO028
      - number: '1.3'
        title: Funding history, valuation, and capital structure
        blocks:
          - type: paragraph
            body: >-
              Axonius has raised approximately $700M to $856M across multiple rounds since its founding, with a range
              reflecting discrepancies between sources — Calcalist reported approximately $700M in February 2026 while
              CRN cited approximately $856M in 2026. The funding history includes a 2021 Series D of $100M at a $1.2B
              valuation; a March 2022 Series E of $200M led by Accel and Silver Lake Waterman at a $2.6B valuation; and
              a March 2024 Series E extension of $200M co-led by Lightspeed Venture Partners and Accel at the same $2.6B
              valuation, described by CEO Dean Sysman as an intentional decision not to optimize for a higher valuation.
              An additional undisclosed raise was completed in October 2025.

              Key investors include Accel, Lightspeed Venture Partners, Stripes, Bessemer Venture Partners, OpenView,
              and Silver Lake Waterman. The company is unprofitable, with ARR growth as its primary KPI. CFO Chris
              Kramer has publicly acknowledged elongated enterprise sales cycles. Axonius has expressed plans to pursue
              an IPO and has framed leadership hires and operational decisions as steps toward that goal. In early 2026,
              Israeli tech outlet Calcalist reported that Cisco was in advanced talks to acquire Axonius for
              approximately $2 billion. Axonius publicly denied the report, stating it "is not in talks to be acquired
              by Cisco" and that its strategy is to build a durable, independent company. Cisco did not comment. The
              flat valuation from 2022 to 2024 — a period during which ARR grew significantly — reflects broader market
              multiple compression for growth-stage software companies rather than a reversal in business performance.
            claimRefs:
              - CO017
              - CO018
              - CO020
              - CO021
              - CO028
          - type: table
            tableRef: TO003
            claimRefs:
              - CO017
              - CO018
