      - number: '2.3'
        title: Buyer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >-
              The primary buyer for Axonius and CAASM solutions is the enterprise CISO and their IT security operations
              team. The budget owner is typically the CISO or VP of Security, with procurement involving IT operations
              and enterprise architecture stakeholders. The payer is the organization's cybersecurity capital budget,
              which has grown consistently across enterprise verticals. The user is the security analyst or IT
              administrator running asset queries, configuring policies, and responding to incidents.

              Customer segmentation breaks into three primary tiers. First, large enterprises (5,000+ employees) with
              complex hybrid environments are the primary target; these organizations face the greatest visibility gap
              and have the budget to pay $775,000+ annually for a 400,000–700,000 device deployment per Forrester TEI
              data. Second, mid-market enterprises (1,000–5,000 employees) are an emerging segment as the platform
              becomes more accessible. Third, federal government customers represent a highly strategic vertical,
              requiring FedRAMP authorization and specialized compliance capabilities; Axonius Federal Systems has built
              a dedicated unit for this segment. Vertical concentrations include manufacturing, healthcare
              (post-Cynerio), financial services, media, and government/defense. Customer adoption typically follows a
              procurement and pilot path: a proof-of-value engagement, integration with existing tool stack, data
              quality validation, and policy automation deployment — often taking 3–9 months from initial evaluation to
              full deployment.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: Growth drivers, adoption constraints, and regulatory tailwinds
        blocks:
          - type: paragraph
            body: >-
              The primary growth drivers for CAASM are: cloud and IoT proliferation creating unmanageable asset sprawl;
              zero-trust architecture mandates requiring total asset visibility as a prerequisite; regulatory frameworks
              (FISMA, CMMC, HIPAA, GDPR, CCPA) requiring comprehensive asset tracking and control; high-profile breaches
              attributable to unknown or unmanaged assets; and the maturation of CISO budgets that now explicitly fund
              asset intelligence as a security foundation. The CISA Continuous Diagnostics and Mitigation (CDM) program
              mandates asset visibility across federal agencies, creating a direct regulatory driver for Axonius Federal
              Systems.

              Key constraints on adoption include: complexity of initial deployment and API permission grants (customers
              must grant Axonius read access to existing tools, which raises internal governance concerns); complex
              asset- based pricing that is difficult to forecast for buyers without knowing their exact asset counts;
              elongated enterprise sales cycles noted by Axonius CFO Chris Kramer; platform fatigue from multiple
              security tool consolidations; and competition from incumbents like ServiceNow (ITAM/CMDB) and Qualys
              (CSAM) that already hold enterprise relationships. Additionally, larger platform vendors like Palo Alto
              Networks and CrowdStrike are potential future entrants who could replicate CAASM functionality within
              their existing platforms, threatening Axonius's independent category leadership. The Forrester TEI study
              found 156% ROI and sub-6 month payback for a composite enterprise, which is favorable for ROI-based
              justification of procurement — but the $775K annual fee for large deployments requires budget
              authorization at the CISO level.
            claimRefs:
              - CM001
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 21% CAGR CAASM market growth is structurally driven, not cyclical
            body: >-
              Asset sprawl, cloud adoption, and regulatory mandates create structural demand that is independent of IT
              budget cycles. Zero-trust architecture requirements make asset inventory a non-discretionary security
              investment, providing more durable demand than discretionary security tools. Axonius benefits from being
              the category pioneer and one of the few scaled independent vendors in this segment.
            calloutType: strength
            claimRefs:
              - CM006
          - type: callout
            title: Platform consolidation by Palo Alto or CrowdStrike is a medium-term category risk
            body: >-
              Large security platform vendors with existing enterprise relationships could embed CAASM-equivalent
              functionality into their XDR, SASE, or CNAPP platforms. This is not imminent — Axonius's integration depth
              (400+ adapters) is a meaningful moat — but the risk increases as Palo Alto Networks and CrowdStrike expand
              their platform ambitions. The Cisco acquisition denial in early 2026 suggests acqui-hire paths have been
              considered at the ecosystem level.
            calloutType: risk
            claimRefs:
              - CM001
          - type: callout
            title: Federal market provides a structural floor with non-discretionary budget
            body: >-
              The CISA CDM program and DoD CMRS contract create a federally-funded demand floor for Axonius Federal
              Systems that is governed by regulatory mandate rather than CISO discretion. CMMC Phase 2/3 rollout
              (2025–2026) creates an additional compliance-driven procurement wave for defense contractors.
            calloutType: insight
            claimRefs:
              - CM001
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitor landscape overview
        blocks:
          - type: paragraph
            body: >-
              The cyber asset attack surface management competitive landscape can be divided into five distinct classes
              of competitor. First, CAASM-native specialists — Armis, runZero, Sevco Security, Cavelo, OctoXLabs, and
              Lansweeper — compete on a shared core use case but differ substantially in approach, depth, and target
              customer. Axonius leads this class by ARR ($151.5M vs. runZero's estimated $10–15M) and enterprise client
              count (670+ vs. Armis's estimated 1,000+ but at different deal sizes and geographies).

              Second, security platform incumbents — Qualys (CSAM module), Rapid7 (InsightVM), and Tenable — offer cyber
              asset management as a feature layer within their established vulnerability management platforms. These
              vendors have deep enterprise relationships and lower switching costs as a combined-platform bundle, but
              their CAASM features are historically less comprehensive than Axonius's dedicated platform.

              Third, IT operations incumbents — ServiceNow (ITAM/CMDB), BMC Helix, and Lansweeper — approach the problem
              from an IT asset management and CMDB perspective. Their strength is workflow integration and large
              installed bases; their weakness is limited security context and policy enforcement. Fourth, OT and cyber-
              physical security vendors — Claroty, Dragos — compete directly in IoT/OT asset visibility, an area where
              Axonius expanded via Cynerio. Fifth, mega-platform vendors — CrowdStrike (Falcon platform) and Palo Alto
              Networks (Cortex XSIAM) — represent the medium-term consolidation threat as they add asset discovery and
              management capabilities to their integrated security operations platforms.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
