      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The public financial picture for Axonius shows a well-capitalized, high-growth SaaS company with a clear
              revenue model and strong market position, but with critical gaps in every unit economics metric that
              matters for underwriting. The 51.5% ARR growth, $151.5M 2024 ARR, and projected $200M+ 2025 ARR are
              positive momentum signals. The flat Series E valuation, subsequent layoffs, and the scale of the Cynerio
              acquisition ($250M) relative to estimated cash reserves create meaningful capital adequacy uncertainty.

              Revenue quality is likely high by SaaS standards: annual subscriptions, long enterprise renewal cycles,
              and integration depth suggest durable ARR rather than transient revenue. But quality cannot be confirmed
              without NRR data. Gross margin path is directionally favorable (asset count-based pricing with low
              marginal cost per additional asset), but the fixed cost of 400+ adapter maintenance, customer success for
              complex deployments, and the Cynerio integration costs could compress margins in the near term.

              The most significant financial risk is capital intensity from the Cynerio acquisition combined with the
              cost of IPO preparation. If the 2025 Form D filing reflects additional equity capital for the acquisition,
              the company's total dilution burden increases. The DoD CMRS multi-year contract provides a durable
              government revenue floor that partially offsets downside scenarios. The primary financial diligence
              blockers are: (1) gross margin and operating loss/income not public; (2) NRR not disclosed; (3) CAC and
              sales efficiency not disclosed; (4) cash on hand and burn rate post-Cynerio not disclosed; (5) Cynerio
              integration costs and synergy timeline not disclosed.
            claimRefs:
              - CI001
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Flat Series E valuation signals investor caution at $2.6B
            body: >-
              Axonius raised $200M in 2024 at the same $2.6B valuation as the 2022 Series D, despite growing ARR by over
              50%. A flat round in a period of strong ARR growth suggests investors were unwilling to mark up at the
              prior valuation — either because public market comps had compressed or because the company could not
              sustain the prior growth trajectory. This is a red flag for IPO valuation expectations.
            calloutType: risk
            claimRefs:
