- id: milestones-and-adverse-checks
  title: Milestones, acquisitions, regulatory proof, and adverse checks
  body: 'The milestone record shows deliberate capability expansion and one modest but real disclosure-quality blemish. In September 2023, I-TRACING bought Apalia to add secure cloud hosting, automation-as-code, and containerization depth while expanding in Switzerland and the broader DACH corridor. In May 2024, it publicized an ANSSI PAMS security visa covering support and managed services for SOC/CERT, privileged-access administration, Active Directory Tier 0, and industrial systems, strengthening its credibility in sensitive environments. In February 2025, it announced the Bridewell combination to build a leading independent European cyber-services group, and in October 2025 it added doIT solutions in Germany, by then claiming more than 1,000 experts and more than €210 million of 2024 consolidated revenue. Customer proof also widened, with the MOTUL case study showing multi-year roadmap, tooling, and governance work rather than a narrow one-off project. The adverse check did not surface
    a disclosed lawsuit, breach, or layoff in reviewed public sources, but it did reveal weaker website hygiene: during this run the English deep links for about-us, services, cert, and blog all resolved to "Page not found" even though the homepage navigation still promoted those sections.'
