- id: leadership-and-governance
  title: Founder continuity, operating bench, and governance visibility
  body: 'Leadership is broader than a single founder story, but public governance disclosure is still incomplete. Théodore-Michel Vrangos is the recurring external face across strategic announcements and is consistently identified as co-founder and president. Michel Vujicic appears as the day-to-day operating counterpart, showing up as Deputy Chief Executive Officer in the Apalia acquisition release and as Director General in the PAMS qualification announcement. Laurent Besset is named alongside the founders in the Bridewell transaction materials, signalling continuing involvement in major shareholder decisions even though his current operating remit is not well described publicly. M&A has also pulled business-unit leaders into the shareholder base: Pierre Vacherand joined as head of Cloud Automation & Security after Apalia, and Dominik Oestreicher did the same for Germany after doIT. The governance read-through is encouraging but incomplete. Continuation-fund materials confirm that founders,
    the management team, and more than 80 managers and employees reinvested, yet reviewed public sources still do not expose a clean consolidated board roster, committee map, or explicit control-rights package.'
  claimRefs:
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
  - CO049
  tableRefs:
  - TO002
