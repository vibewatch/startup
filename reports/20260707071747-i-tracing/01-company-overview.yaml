company:
  name: I-TRACING
chapter:
  number: 1
  title: Company Overview
  summary: I-TRACING is a founder-led French managed cybersecurity services platform founded in 2005, legally anchored in Courbevoie, and publicly expanding through a 2021 sponsor-backed LBO, a 2024 continuation-fund transaction, and 2023-2025 acquisitions in cloud, the UK, and Germany. The strongest evidence supports broad service breadth, significant scale, and serious sponsor backing; the biggest remaining gaps are exact post-2024 ownership percentages, lifetime capital raised, audited consolidated economics, and a full governance map.
sections:
- id: identity-and-legal-footprint
  title: Identity, legal footprint, and core positioning
  body: 'I-TRACING enters this report as a founder-led French cybersecurity services platform rather than a single-product software vendor. The public record is strongest on identity and legal footprint. Registry and legal-notice surfaces tie the company to SIREN 484 841 127, SAS status, and a registered office at 25 quai du Président Paul Doumer in Courbevoie, while multiple company and investor materials anchor the operating history to a 2005 founding. On the commercial side, the company consistently presents itself as a one-stop-shop provider spanning strategic consulting, managed detection and response, identity and access management, cloud automation and security, and adjacent data-protection work. That breadth is not just marketing copy: the partner catalog lists 89 partners across multiple cyber domains, and the homepage publicly displays blue-chip and public-sector logos such as EssilorLuxottica, FORVIA, Nexans, VINCI, Michelin, and the Préfecture de Police de Paris. The identity
    conclusion for later chapters is therefore stable: I-TRACING is a French, private, services-led MSSP platform with broad technical coverage, meaningful partner density, and a visible but still mostly company-authored customer proof set.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
