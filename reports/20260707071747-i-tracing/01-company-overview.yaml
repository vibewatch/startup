- id: scale-and-delivery
  title: Service-delivery scale, partner ecosystem, and customer proof
  body: 'The strongest public scale signals sit in service-delivery pages rather than in audited financial disclosure. I-TRACING''s MDR page describes a 24/7 follow-the-sun CyberSOC spanning three continents, 275 engineers including 160 N2/N3 cyber analysts, 190-plus countries covered, one million endpoints controlled, two million users protected, and twelve million security events analyzed. Partner pages from Google Cloud and Palo Alto Networks reinforce that the business is sold through large-vendor ecosystems as well as direct consulting relationships. Google positions I-TRACING as a Google Cloud MSSP program member built on Google Security Operations, while Palo Alto frames the relationship around more than 1,000 global experts protecting more than 600 organizations. Careers pages add current operating texture: 9 international offices, more than 50 leading publishers, 90% of managers promoted internally, and 11 open roles at fetch time. These figures are useful maturity signals, but
    they are still mostly company-reported or partner-amplified rather than independently audited, so later chapters should treat them as directional scale evidence, not as hard financial-control equivalents.'
  claimRefs:
