  evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A consolidated board roster, shareholder agreement summary, and formal governance map after the Oakley/Eurazeo/Sagard continuation structure and subsequent acquisitions.
    whyItMatters: Without it, later chapters cannot judge control rights, vetoes, or succession resilience from public sources alone.
    diligencePath: Request the current board list, reserved-matters schedule, and cap-table governance package from management or counsel.
    relatedQuestionRefs:
    - QO009
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: capitalization
    missingEvidence: A clean lifetime capital-raised bridge separating primary equity, secondary liquidity, debt, and fund-level vehicle commitments, plus post-November 2024 ownership percentages.
    whyItMatters: Public sources establish directional funding strength but do not reveal how much money entered the company versus how much bought out prior holders.
    diligencePath: Ask for the financing history table, debt schedule, and current cap table with pre/post-transaction ownership by investor and management cohort.
    relatedQuestionRefs:
    - QO016
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: audited-economics
    missingEvidence: Audited or management-certified 2024 and 2025 consolidated revenue, EBITDA, cash conversion, customer concentration, and geography mix for the enlarged group.
    whyItMatters: Public sources mix registry history, targets, and current company claims, which is enough for an overview but not for a final quality-of-earnings view.
    diligencePath: Request the last two audited financial statements, monthly revenue bridge, and acquisition-adjusted management accounts.
    relatedQuestionRefs:
    - QO026
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: minor
    topic: adverse-check
    missingEvidence: Direct legal-negative checks or counsel letters covering litigation, sanctions, cyber incidents, and workforce actions.
    whyItMatters: The current adverse read is mostly absence-of-evidence from public sources plus the observed website-disclosure issue, which is weaker than a formal negative confirmation.
    diligencePath: Run counsel-backed litigation, sanctions, and incident checks across France, the UK, Switzerland, Germany, and key subsidiaries, then reconcile the results with management disclosure.
    relatedQuestionRefs:
    - QO025
