  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Realized pricing, SLA tiers, contract lengths, and gross margins for I-TRACING and its direct MSSP peers.
    whyItMatters: Public pages do not reveal whether I-TRACING wins on price, scope efficiency, or margin structure, limiting underwriting of competitive economics.
    diligencePath: Request anonymized proposals, renewal terms, and gross-margin by managed-service cohort during diligence.
    relatedQuestionRefs:
    - QP018
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: orange-ops-disclosure
    missingEvidence: Current public Orange Cyberdefense SOC count, analyst headcount, France win share, and customer concentration metrics.
    whyItMatters: The public adverse case relies on Orange’s France-scale claim, but the reviewed source set does not disclose the exact current operating metrics behind it.
    diligencePath: Fetch Orange annual or market-recognition materials with current operational metrics, or obtain competitive intelligence from recent French enterprise RFPs.
    relatedQuestionRefs:
    - QP027
    relatedTableRefs:
    - TP002
  - type: missing-source
    severity: material
    topic: wavestone-managed-ops-scale
    missingEvidence: A current public source disclosing Wavestone’s managed-security operating scale, accreditations, and 24/7 service footprint.
    whyItMatters: Without this, Wavestone can only be treated confidently as an advisory-led substitute, not precisely benchmarked as a direct operating peer.
    diligencePath: Review Wavestone service-line pages, annual report, or regulatory accreditations to determine whether managed-security operations are material.
    relatedQuestionRefs:
    - QP028
    relatedTableRefs:
    - TP002
    - TP003
  - type: private-evidence-only
    severity: material
    topic: post-acquisition-integration
    missingEvidence: Post-Bridewell and post-doIT cross-sell, retention, NRR, and unified service-delivery metrics.
    whyItMatters: The European-champion thesis improves competitive positioning only if integration yields better delivery leverage and not just more complexity.
    diligencePath: Request a post-merger operating dashboard showing renewal rates, cross-sell penetration, utilization, and delivery quality across France, UK, Germany, and Canada.
