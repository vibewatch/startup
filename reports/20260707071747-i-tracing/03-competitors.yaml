- id: profiles
  title: Peer profiles and current scale
  body: Publicly available evidence places I-TRACING in the upper tier of European specialist MSSPs rather than in the size class of telecom-backed or global consulting incumbents. Its current official surfaces state more than €230 million of consolidated revenue, more than 1,000 experts, more than 600 customers, and nine subsidiaries worldwide; the October 2025 doIT acquisition update separately says the group exceeded €210 million of 2024 revenue and 1,000 experts. Its February 2025 Bridewell transaction materials described the company as the French leading managed cybersecurity services provider and emphasized a 24/7 follow-the-sun operating model. Orange is still the most important local incumbent comparator because IDC says its French domestic presence and pan-European scale are hard for MSSP competitors to match. IBM competes from the opposite extreme, with global lifecycle breadth across threat management, MDR, cloud, and IAM. Eviden is less obviously a pure-play MDR rival and more
    a sovereign-products competitor, while Wavestone is better treated as a consulting-led substitute. Bridewell, although now strategically linked, still shows the capabilities of a strong peer in OT, CNI, and UK regulated environments.
