- id: TP005
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence
  - Mitigation or diligence ask
  rows:
  - - French regulated-services trust
    - Orange still claims unmatched domestic-France presence and pan-European scale
    - High
    - Orange IDC recognition plus Orange Group 2025 scale and reach
    - Request vertical win rates in France versus Orange by banking, energy, defense, and industry
  - - ANSSI-aligned managed-services assurance
    - Competitors can counter with other sovereignty or accreditation narratives, especially Eviden and Bridewell
    - Medium
    - PAMS qualification, Eviden ANSSI-certified components, Bridewell CREST/NCSC assurance claims
    - Map certification and accreditation requirements by sector before assuming PAMS alone wins deals
  - - One-stop-shop service breadth
    - IBM lifecycle breadth and Wavestone advisory reach reduce uniqueness
    - High
    - IBM TDR/MDR plus data, AI, and IAM breadth; Wavestone strategy and benchmark positioning
    - Test attach rates outside MDR and confirm whether IAM or cloud work increases net retention
  - - Tool-agnostic MDR model
    - Platform vendors can bundle technology and operations into one buying motion
    - High
    - Google SecOps and Palo Alto Cortex partnership pages plus Clipperton platformization view
    - Track multivendor retention, migrations off competitor tools, and margin by partner stack
  - - European scale-up story
    - Bridewell and doIT create opportunity but also integration risk
    - High
    - Bridewell and doIT transaction materials
    - Ask for cross-sell pipeline, retention, and unified operating-metric dashboards post integration
  - - Commercial discipline
    - Opaque public pricing makes it hard to prove economic advantage externally
    - Medium
    - Peer set lacks public pricing detail in reviewed corpus
    - Obtain real pricing, gross margin, and renewal data by managed-service cohort during diligence
  notes: Severity reflects the chapter author’s judgment after synthesizing regulatory, partner, competitor, and market-valuation evidence.
