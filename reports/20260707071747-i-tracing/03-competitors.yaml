- id: TP001
  title: Landscape covering direct peers, adjacents, substitutes, and likely entrants
  columns:
  - Class
  - Representative options
  - Why buyers choose it
  - Main strength versus I-TRACING
  - I-TRACING response
  rows:
  - - Direct French and pan-European MDR incumbent
    - Orange Cyberdefense
    - Need converged MDR/XDR plus strong France and Europe coverage
    - Domestic-France presence and pan-European scale publicized as difficult for MSSP competitors to match
    - Lead with PAMS-qualified managed services, independence, and co-managed delivery
  - - Global lifecycle managed security incumbent
    - IBM Security Services
    - Need one provider for MDR, cloud, IAM, and advisory at global scale
    - Broadest lifecycle coverage and global brand reach in reviewed corpus
    - Win on French proximity, pure-play focus, and multi-partner flexibility
  - - Sovereign product and identity specialist
    - Eviden
    - Need European sovereignty, identity, encryption, and industrial trust
    - ANSSI-certified components and stronger product IP in identity/data layers
    - Win on managed operations and multivendor integration breadth
  - - Advisory-led substitute
    - Wavestone
    - Need board-level strategy, resilience roadmaps, and maturity benchmarking
    - Strong strategic positioning with benchmark-led CISO dialogue
    - Win when buyer needs 24/7 operations in addition to strategy
  - - OT and regulated-sector peer
    - Bridewell
    - Need UK-regulated, CNI, or OT-heavy managed and professional services
    - Explicit OT/CNI specialization and UK market depth
    - Win on France depth, IAM/cloud breadth, and current group scale
  - - Status-quo internal build
    - In-house cyberSOC plus consulting integrators
    - Need full control of tooling, data, and governance
    - Maximum internal control of runbooks and escalation paths
    - Offer co-managed cyberSOC so control does not require full internal staffing
  - - Platform-led substitute or entrant
    - Google Security Operations and Palo Alto Cortex operated-service stacks
    - Prefer bundled technology plus operated service and automation
    - Product platforms can bundle tools, telemetry, and operations in one buying motion
    - Stay tool-agnostic and integrate the customer’s existing stack where possible
  notes: Classes synthesized from ENISA market framing, NIS2 and DORA demand drivers, and competitor or partner pages reviewed in this chapter.
