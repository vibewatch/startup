  title: The most defensible angle is regulated French delivery with multivendor breadth
  body: I-TRACING is hardest to displace when the buyer needs France-local trust, ANSSI-grade managed-service assurances, and one operator spanning MDR, IAM, cloud, and consulting without forcing a single product stack.
  claimRefs:
  - CP009
  - CP015
  - CP016
  - CP043
  - CP050
- calloutType: risk
  title: Orange and the platforms define the adverse case
  body: Orange sets the incumbent benchmark in domestic France, while Google and Palo Alto show how product platforms can absorb more of the security-operations budget into bundled tooling plus service. Those two forces are the clearest public threats to a services-led differentiation story.
  claimRefs:
  - CP021
  - CP041
  - CP042
  - CP048
- calloutType: insight
  title: Bridewell and doIT improve the thesis but also raise the execution bar
  body: The UK and German moves make the “European champion” narrative more credible, especially for OT/CNI and DACH reach, but they also mean diligence should focus on integration, cross-sell, and retention rather than on headline transaction rhetoric alone.
