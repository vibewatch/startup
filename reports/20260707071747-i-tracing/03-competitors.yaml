company:
  name: I-TRACING
chapter:
  number: 3
  title: Competitors
  summary: 'I-TRACING competes as a European pure-play cybersecurity services platform against a wider set than classic MDR vendors alone: Orange Cyberdefense in French and pan-European managed security, IBM in global lifecycle managed services, Eviden in sovereign identity/data security, Wavestone in cyber strategy and resilience advisory, Bridewell in UK OT/CNI, and internal-build or partner-led platform stacks as substitutes. Its strongest differentiators are France-local trust, ANSSI PAMS-qualified managed services, a tool-agnostic fully managed or co-managed service model, and breadth across MDR, IAM, cloud, consulting, and partner integrations; its main adverse pressure is that Orange still has the clearest domestic-France incumbency while product platforms and global integrators can bundle technology, distribution, and operations at larger scale.'
sections:
- id: landscape
  title: Competitive landscape and substitutes
  body: Managed security buying in Europe is no longer a simple outsource-versus-build choice. ENISA says organizations are moving toward outsourced managed security services because hybrid environments, tighter regulation, and a shortage of experienced cyber talent make 24/7 resilience harder to sustain internally. NIS2 now applies risk-management and incident-reporting obligations across 18 critical sectors, while DORA adds ICT third-party oversight, testing, and incident-reporting duties for financial institutions. That environment broadens the competitor set around I-TRACING. The direct French and pan-European benchmark is Orange Cyberdefense, which publicizes IDC recognition for European MDR and a domestic-France infrastructure advantage. IBM sets the global full-lifecycle bar across managed response, cloud, and identity. Eviden competes where sovereign identity, encryption, and industrial trust matter. Wavestone substitutes for buyers prioritizing board-level strategy and cyber maturity
    programs. Bridewell matters for OT, CNI, and UK-regulated programs, while internal cyberSOC builds and partner-led Google Security Operations or Palo Alto Cortex service models remain real substitutes for buyers who want to keep more tool control in-house.
