- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - PE roll-up integration
    - Integration KPI package for Bridewell, doIT, and Apalia
    - Management cannot produce 100-day plans, systems harmonization status, or churn / cross-sell evidence by acquisition.
    - Treat the platform story as unproven; re-underwrite as a fragmented asset base and reduce valuation tolerance.
  - - Services-margin scalability
    - Gross-margin and utilization bridge
    - No audited 2024/2025 bridge, or evidence that analyst-heavy growth is diluting margin faster than revenue mix improves it.
    - Move from growth multiple logic to downside cash-conversion logic and demand a lower entry price.
  - - Regulatory / compliance burden
    - Framework scope and audit outcomes
    - ANSSI / SWIFT / regulated-customer evidence is entity-specific, stale, or excludes acquired operations.
    - Escalate to specialist legal-compliance diligence and cap regulated-sector upside assumptions.
  - - Customer concentration opacity
    - Top-account and renewal disclosure
    - Management withholds top-10 revenue, retention, or loss-event data.
    - Treat concentration as potentially thesis-breaking until disproved and avoid underwriting premium retention.
  - - Partner / platform dependence
    - Vendor and hyperscaler exposure map
    - A small set of partner stacks or cloud providers dominate delivery economics or incident history.
    - Raise dependency discount and require contingency / migration plans before crediting scale advantages.
  - - Cyber-talent retention
    - Attrition, open-role aging, and bench depth
    - Senior SOC / GRC / integration roles remain open for extended periods or attrition rises during integration.
    - Lower confidence in service quality, assume wage pressure, and haircut margin expansion.
  - - Disclosure gaps
    - Quality of the diligence room versus public record
    - Private diligence does not close the concentration, litigation, integration, and margin gaps identified here.
    - Stop rather than extrapolate sponsor narratives into current-round underwriting.
  notes: These kill criteria are designed to be monitorable through diligence artifacts, sponsor reporting, legal schedules, and operating dashboards rather than intuition alone.
