  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-opacity
    missingEvidence: Top-10 customer revenue share, renewal rates, contract duration, and concentration by sector/geography.
    whyItMatters: Without concentration and renewal data, a services incident or procurement pause could be far more damaging than headline customer-count claims imply.
    diligencePath: Request customer concentration tables, renewal cohorts, and top-account churn history from finance and sales operations.
    relatedQuestionRefs:
    - QR019
    - QR029
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: blocking
    topic: disclosure-gap
    missingEvidence: Audited 2024 and latest-available 2025/2026 margin bridge, utilization, and acquisition synergy scorecard.
    whyItMatters: Services-margin scalability is central to valuation and cannot be underwritten from 2023 registry data plus sponsor narratives alone.
    diligencePath: Obtain audited financial statements, board packs, and post-close integration dashboards for Bridewell, doIT, and Apalia.
    relatedQuestionRefs:
    - QR020
    - QR030
    relatedTableRefs:
    - TR002
    - TR005
  - type: missing-source
    severity: material
    topic: litigation-enforcement
    missingEvidence: Comprehensive litigation, claims, and regulatory-correspondence schedule covering all current group entities.
    whyItMatters: The public file does not surface a negative event, but absence of disclosure is not proof that no dispute or investigation exists.
    diligencePath: Ask counsel for litigation and regulatory schedules plus representations on open investigations and material claims.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: certification-scope
    missingEvidence: Renewal calendar, scope boundaries, and entity coverage for PAMS, SWIFT audit capability, and any similar regulated-service credentials.
    whyItMatters: Regulated-customer growth and acquisition integration are weaker if trust signals apply only to a subset of legal entities or service lines.
    diligencePath: Collect certificates, assessor letters, renewal plans, and scope matrices by subsidiary and acquired platform.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR001
    - TR002
