- id: regulatory-and-legal-burden
  title: Regulatory and Legal Burden
  body: 'The regulatory and legal burden is material because I-TRACING explicitly sells into domains where customers expect auditable security governance, cross-border data controls, and sector-specific evidence. The legal notice and privacy statement tie the group to a specific French SAS entity, GDPR-linked controller and processor roles, cross-border transfer mechanisms, and a named DPO. The consulting and SWIFT materials show that I-TRACING positions itself around NIS, GDPR, SWIFT, ISO, NIST, and CIS frameworks, while the PAMS announcement adds a high-assurance ANSSI-linked credential for support and managed services. NIS2 and DORA widen incident-reporting, third-party oversight, and board-accountability expectations across critical sectors and finance, and the DORA implementation stack continued to expand through 2025. This is a strategic tailwind for demand, but also a burden: every acquired entity, analyst pod, and regulated-customer workflow has to stay aligned with the representations
    the group now makes publicly.'
