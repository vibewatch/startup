- id: mitigations-and-thesis-breakers
  title: Mitigations and Thesis-Break Triggers
  body: 'The visible mitigations are meaningful but not yet sufficient to clear the core underwriting questions. Publicly, I-TRACING can point to group privacy governance, a named DPO, ANSSI-linked PAMS recognition, explicit NIS/GDPR/SWIFT positioning, scaled MDR operations, and a broad partner ecosystem. Those all indicate that management understands the compliance and delivery demands of the category. The problem is residual exposure: public proof still does not show whether margins hold through cross-border integration, whether regulated-customer evidence scales cleanly across acquired entities, or whether the current customer base is concentrated in ways that would magnify a service or renewal failure. The right stance is therefore to treat the visible controls as medium-maturity mitigants, not as a reason to ignore kill criteria. If management cannot supply customer concentration, integration KPI, margin bridge, certification-scope, and regulatory-response evidence in diligence, the
    thesis should move from growth-underwriting to risk-repricing or stop.'
