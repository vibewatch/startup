- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Side
  - Argument
  - Evidence anchor
  - What would change the view
  rows:
  - - Thesis
    - The group has already crossed the threshold from local specialist to scaled European cyber-services platform.
    - '>€210m to +€230m revenue, >1,000 experts, 600+ customers, Bridewell and doIT expansion.'
    - A reversal in disclosed scale or a failed integration that erodes service quality would weaken this.
  - - Thesis
    - Service breadth and partner density support cross-sell and strategic relevance.
    - 89 partners, Google MSSP alignment, MDR, IAM, cloud, consulting, and customer proof.
    - Evidence that breadth does not convert into cross-sell or recurring managed-service density would reduce the premium.
  - - Thesis
    - Sponsor behavior indicates conviction and financing access.
    - June 2024 >€500m discussion, November 2024 continuation-fund support, 2025 M&A continuation.
    - A flat or down external financing event would sharply reduce confidence in sponsor-marked value.
  - - Anti-thesis
    - The current company-level price is not publicly disclosed with the precision required for underwriting.
    - Continuation-fund structure, no fresh public mark, no secondary quote, no IPO process.
    - A new priced round, secondary quote, or audited valuation bridge would directly improve underwriteability.
  - - Anti-thesis
    - The enlarged group’s actual EBITDA margin is undisclosed, so value support above the historical floor is unproven.
    - No public company-specific EBITDA, leverage, or recurring-revenue disclosure.
    - Audited EBITDA margins in the low-to-mid teens would materially strengthen the case.
  - - Anti-thesis
    - Software-style cyber multiples likely overstate value for a people-intensive services platform.
    - Aventis MSP bands sit far below Finro and Clipperton cyber-software bands.
    - If management proves productized, high-margin recurring economics, the multiple framework can move upward.
  notes: Each row is framed only for valuation relevance; it is not a generic company-quality scorecard.
