- id: scenario-range-and-exit-logic
  title: 'Scenario range and exit logic: upside exists, but only with margin proof and integration execution'
  body: Scenario analysis therefore has to be explicit about what is actually missing. The bull case assumes the enlarged group sustains something close to the historic ~30% organic trajectory, turns Bridewell and doIT scale into cross-sell and managed-services density, and ultimately demonstrates EBITDA margins strong enough to justify upper-teens sponsor-style multiples on a services business. The base case assumes the group remains a credible European champion, but that valuation lands closer to a blended 2.0x to 2.8x revenue or low-teens EBITDA outcome because public data still cannot prove software-grade economics. The bear case assumes growth cools, integration drags, and the market re-rates the business toward more traditional MSP bands. Exit optionality is real—continuation funds, sponsor-to-sponsor sales, and strategic combinations are all consistent with the 2024 to 2025 history—but no public source points to a live IPO process or a fresh external price-setting event. This means
    scenario outcomes are highly sensitive to actual margin disclosure and to whether the combined perimeter can preserve the quality implied by its customer, partner, and geographic footprint.
  claimRefs:
  - CV030
  - CV032
  - CV040
  - CV041
  - CV049
  - CV050
  - CV051
  - CV052
  tableRefs:
  - TV003
  figureRefs:
  - FV003
- id: recommendation-and-diligence
  title: 'Recommendation and diligence: track with medium confidence until price, margin, and cap-table visibility improve'
  body: 'The price-sensitive conclusion is stronger than a generic quality score and weaker than a buy call. Public evidence clearly supports substantial private-market value: the company discussed terms above €500 million in June 2024, then attracted a continuation-fund solution and executed Bridewell and doIT combinations that lifted disclosed group revenue above €210 million and later above €230 million. That is enough to reject any bearish view that the platform lacks scale. It is not enough to underwrite a current mark at whatever price an investor might actually face. Public sources do not disclose company-specific EBITDA, leverage, recurring-revenue mix, or liquidation preferences, and they blur standalone and combined revenue perimeters. Without those inputs, the honest call is track with medium confidence, a high risk rating, and an unknown valuation stance rather than a false-precision buy or avoid. The recommendation should improve only if management provides a clean revenue bridge,
    audited margin evidence, capital-structure terms, and proof that the roll-up is turning scale into profitability rather than just into a larger denominator.'
