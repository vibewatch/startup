- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Indicative valuation logic
  - Probability signal
  rows:
  - - Bull
    - The enlarged group sustains near-historical growth, integrates Bridewell and doIT well, and later proves mid-teens EBITDA margins.
    - Around €700m-€900m using a blended ~2.8x-3.5x revenue or sponsor-style mid-teens EBITDA support on the enlarged perimeter.
    - Requires margin disclosure, cross-sell proof, and continued sponsor-backed M&A execution.
  - - Base
    - Revenue scale holds, growth moderates, and margin quality is decent but not software-like.
    - Around €500m-€700m using a blended ~2.0x-2.8x revenue or low-teens EBITDA framework.
    - Best fit with current public evidence because scale is proven but economics remain opaque.
  - - Bear
    - Growth slows, integration value capture disappoints, and the market re-rates the asset closer to classic MSP bands.
    - Around €275m-€450m using public MSP revenue and lower-EBITDA-service bands.
    - Triggered by weaker growth, no margin disclosure, or evidence that scale is not improving profitability.
  notes: These are indicative public-evidence scenarios, not management forecasts or a price target.
