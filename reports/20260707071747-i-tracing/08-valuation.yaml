  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-valuation
    missingEvidence: A current company-level primary or secondary valuation mark with date, investor, and instrument terms.
    whyItMatters: The recommendation cannot move from track to buy without knowing the actual price an investor would face.
    diligencePath: Request the latest board deck, financing materials, and any secondary indications or lender valuation work.
    relatedQuestionRefs:
    - QV017
    - QV031
    - QV032
  - type: private-evidence-only
    severity: material
    topic: profitability
    missingEvidence: Audited EBITDA, EBITDA margin, gross margin, and recurring-revenue mix for the enlarged group.
    whyItMatters: These metrics determine whether I-TRACING deserves classic MSP bands or a premium hybrid cyber-services multiple.
    diligencePath: Run a quality-of-earnings review and request monthly management accounts by service line.
    relatedQuestionRefs:
    - QV006
    - QV019
    - QV032
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Net debt, covenant package, liquidation preferences, ratchets, and waterfall economics for current shareholders and new money.
    whyItMatters: Enterprise quality does not translate directly into investor returns when leverage and preferences are opaque.
    diligencePath: Obtain the cap table, shareholder agreements, debt documents, and liquidation waterfall model.
    relatedQuestionRefs:
    - QV028
    - QV031
  - type: missing-source
    severity: material
    topic: revenue-perimeter
    missingEvidence: A bridge separating standalone I-TRACING, Bridewell, and doIT revenue within the 2024 to 2026 period.
    whyItMatters: Without perimeter discipline, even well-intentioned revenue-multiple work can overstate or understate value.
    diligencePath: Ask finance for pro forma revenue reconciliation and M&A contribution schedules.
    relatedQuestionRefs:
    - QV005
    - QV018
    - QV029
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: material
    topic: integration-synergies
    missingEvidence: Post-close cross-sell, margin, and utilization KPIs for Bridewell and doIT integration.
    whyItMatters: The roll-up thesis depends on economics improving with scale rather than scale merely increasing complexity.
    diligencePath: Review integration workstream dashboards and regional operating KPIs with management.
    relatedQuestionRefs:
    - QV022
    - QV024
    - QV030
