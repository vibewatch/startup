- id: comparable-bands-and-price-discipline
  title: 'Comparable bands and price discipline: services multiples support value, but not blind software-multiple extrapolation'
  body: 'Comparable analysis is where price discipline enters. Model-appropriate services data from Aventis is far less generous than cybersecurity software data: disclosed MSP transactions center around roughly 8.9x EV to EBITDA, larger MSP deals around 11.2x, and public MSP revenue multiples around 1.3x. By contrast, cybersecurity datasets from Finro and Clipperton show that product-led cyber businesses can command 7.8x to 18.5x revenue in public and private markets, with IAM and cloud-security niches even higher. That spread is informative rather than directly transferable. I-TRACING is not a narrow product company; it is a people-intensive cyber-services platform with consulting, IAM, MDR, cloud, and data-protection depth. Using classic MSP revenue multiples on the enlarged €210 million to €230 million perimeter yields only about €273 million to €299 million, clearly below the company’s own 2024 above-€500 million historical anchor. But jumping all the way to software-like 15x to 18.5x
    revenue would imply several billion euros, a level public evidence does not support for a services-heavy model. The reasonable inference is that value likely sits above plain-vanilla MSP comps and below software-pure-play extremes unless margin data prove otherwise.'
  claimRefs:
  - CV024
  - CV033
  - CV034
  - CV035
  - CV036
