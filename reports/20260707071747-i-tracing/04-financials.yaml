- id: capital-structure-and-financing-visibility
  title: Capital Structure and Financing Visibility
  body: 'Capital support is visible, but current consolidated leverage is not. The 2021 second LBO brought in Eurazeo and Sagard as majority owners, while Ardian disclosed a €60m debt package split between €40m drawn and a €20m acquisition line. In June 2024, Oakley''s announcement said OCI''s indirect commitment via Fund V was expected to reach c.£39m, and the European Commission''s merger summary showed that 100 percent of I-TRACING share capital would be transferred into a BidCo beneath a jointly controlled TopCo owned by Oakley and Eurazeo. French registry files then make the ownership layers more visible: I-Tracing Holding was incorporated on 28 June 2024 with €67.5m of capital, while I-TRACING GROUP carried €114.6m of capital, only four employees, and €75.2m of financial debt in 2023 before being folded back into the operating company in late 2025. Those disclosures show real sponsor support and a multi-layered buy-and-build structure, but they still do not answer the underwriting questions that matter most today: post-deal cash on hand, gross debt, net debt, interest burden, runway, or where leverage now sits by entity. The standalone 2023 accounts looked net-cash positive, yet that cannot be treated as the capital profile of the enlarged group after the continuation fund, holdco reshuffling, Bridewell, doIT, and registry-recorded perimeter changes through late 2025. Scope visibility, not absolute scale, is the main blocker.'
