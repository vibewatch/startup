  title: Financials
  summary: Pappers shows standalone I-TRACING SAS growing revenue from €45.3m in 2020 to €112m in 2023 while keeping 55.8% gross margin and 13.7% EBITDA margin in 2023. Investor and company disclosures then move the scope upward to ~€150m standalone 2024 revenue, >€210m 2024 combined revenue, and +€230m current consolidated revenue, but current group EBITDA, leverage, runway, and revenue mix remain undisclosed.
sections:
- id: revenue-model-and-monetization-visibility
  title: Revenue Model and Monetization Visibility
  body: 'I-TRACING''s public file looks like a services-heavy cybersecurity platform rather than a software company with transparent seat pricing. The company explicitly markets strategic consulting, audit, IAM integration, cloud automation, and always-on MDR / CyberSOC operations. That mix supports at least three monetization buckets: recurring managed security contracts, project-based advisory and integration work, and partner-enabled resale or implementation around a large vendor ecosystem. The strongest recurring signal is the follow-the-sun managed detection model, but the firm does not publish a price book, subscription tiers, minimum contract values, or public statements on what portion of revenue is recurring versus project-led. That matters because revenue quality and margin durability depend heavily on contract duration, staffing intensity, and how much value capture sits in managed services versus one-off integration work. The public evidence is therefore strong on service breadth
    and weak on realized pricing or mix disclosure.'
