- id: TI005
  title: Capital Adequacy Table
  columns:
  - Capital item
  - Public value / status
  - Interpretation
  - Exact diligence ask
  rows:
  - - 2021 ownership change
    - Majority stake sold to Eurazeo and Sagard
    - Marks the second LBO and beginning of sponsor-backed scale phase
    - Provide the full 2021 sources-and-uses schedule and holdco structure
  - - 2021 debt package
    - €60m from Ardian (€40m drawn + €20m acquisition line)
    - Confirms external debt support for growth and M&A
    - Provide current outstanding balance, amortization, and lender covenant package
  - - 2023 group holdco debt snapshot
    - €75.2m financial debt, €2.1m treasury, and 4 employees at I-TRACING GROUP
    - Suggests leverage sat in a sponsor-era group-holding perimeter rather than only the opco
    - Bridge 2023 group-holdco debt to current consolidated gross and net debt by entity
  - - 2024 Oakley announced contribution
    - Up to c. £39m indirect OCI contribution via Oakley Capital Fund V
    - Confirms fresh sponsor equity entering the transaction but not the final debt/equity split above the opco
    - Provide signed sources-and-uses and close funding bridge
  - - 2024 continuation fund
    - €180m commitments with follow-on financing capacity
    - Shows equity/follow-on support for buy-and-build rather than stand-alone self-funding
    - Disclose how much capital reached the company vs. secondary liquidity vs. undrawn follow-on
  - - 2024 management roll-over
    - 80+ managers and employees reinvested
    - Aligns operators with sponsor-backed expansion
    - Provide post-transaction cap table and management ownership percentage
  - - 2024 top-holdco formation
    - I-Tracing Holding incorporated 28/06/2024 with €67.5m capital and a holding-company purpose
    - Makes the new ownership layer visible above the operating group
    - Provide full post-close entity chart, cap table, and intercompany loan stack
  - - 2023 standalone liquidity
    - €23m treasury and €3.75m financial debt
    - Standalone SAS looked net-cash positive before later perimeter changes
    - Bridge standalone liquidity to current consolidated opening balance sheet
  - - 2025 legal simplification
    - I-Tracing Invest merged into I-Tracing Group on 25/11/2025 and I-Tracing Group merged into I-TRACING on 26/12/2025
    - Confirms that public legal-entity scope changed again after the continuation-fund deal
    - Provide merger-accounting entries and the opening 2026 consolidated balance sheet
  - - 2024 discussion-stage valuation signal
    - '>€420m invested and >€500m valuation claimed in June 2024 discussions'
    - Useful only as a pre-close company statement, not a finalized valuation output
    - Provide signed close valuation and enterprise value bridge
  - - 2026 current cash / runway
    - Not publicly disclosed
    - Main blocker for underwriting capital adequacy today
    - Provide consolidated cash, gross debt, net debt, burn, and base/downside runway
