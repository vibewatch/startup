    - Disclose billable customers by service line and top-20 share
  - - 2026 customer scale
    - 600+ customers worldwide
    - Supports continued expansion after acquisitions
    - May include broader group perimeter and mixed service types
    - Provide active customer definition and recurring-customer count
  - - 2024 workforce scale
    - 700+ experts / internal consultants
    - Indicates delivery capacity for premium services
    - Scope is pre-Bridewell/doIT group
