- id: TI007
  title: Public Financial Gaps Table
  columns:
  - Missing metric
  - Why it matters
  - Current public status
  - Exact diligence path
  rows:
  - - Recurring revenue share and contract duration
    - Determines revenue quality and valuation comparability
    - Not publicly disclosed
    - Request revenue bridge by managed services, projects, resale, and contract term bucket
  - - Realized pricing / ACV
    - Needed to judge pricing power and GTM efficiency
    - No public price book or ACV data
    - Request sample contracts, realized ACV distribution, and discount policy
  - - CAC payback / NRR / churn
    - Core test of sponsor-backed growth efficiency
    - No public disclosure
    - Request monthly KPI pack covering CAC, payback, gross retention, and NRR
  - - Current consolidated EBITDA and gross margin
    - Required to apply sector multiples with discipline
    - Not publicly disclosed post-combination
    - Request consolidated P&L with service-line margin split and integration adjustments
  - - Current consolidated gross and net debt
    - Needed to assess financial risk after fund and M&A activity
    - Not publicly disclosed
    - Request debt schedule, lender terms, interest cost, and covenant headroom
  - - Top-holdco financial statements and debt location
    - Needed to understand where sponsor-era borrowings and acquisition funding sit after the 2024-2025 holdco reshuffle
    - I-Tracing Holding is public, but Pappers shows no accounts and public sources do not bridge debt by entity
    - Request latest entity chart plus holding/opco trial balances and intercompany debt map
  - - Cash balance and runway
    - Needed to underwrite capital adequacy and next financing trigger
    - Not publicly disclosed
    - Request cash waterfall, monthly burn / generation, and base/downside runway
  - - Customer concentration and renewal economics
    - Determines resilience of the enlarged group
    - No public concentration or renewal data
    - Request top-20 customer revenue, logo retention, and top-loss bridge
  - - Transaction valuation / multiple at close
    - Necessary for private-market return math
    - Only June 2024 discussion-stage >€500m signal is public
    - Request signed valuation memo or purchase-price allocation bridge
  notes: 'These gaps are not cosmetic: they prevent clean underwriting of today''s enlarged group even though historical standalone performance is well evidenced.'
  enumerationScope:
    coverage: partial
    basis: Rows capture the minimum missing financial disclosures required to move from directional confidence to underwritable current-group economics.
