  rows:
  - - Managed detection and response / outsourced CyberSOC
    - 24/7 monitoring, triage, incident response, threat hunting, telemetry integration, governance
    - Standalone endpoint or network products sold without operational service
    - CISO, SOC leader, security budget owner
    - Closest fit to I-TRACING's MDR-led wedge
  - - Managed security services broad category
    - Network, application, cloud, identity, risk/compliance, managed SOC and response operations
    - Generic IT outsourcing or unrelated MSP work
    - Security, IT, risk, or transformation budgets
    - Matches public analyst definitions used for sizing lenses
  - - IAM-managed security operations
    - Identity lifecycle support, PAM/IGA/CIAM operations, access traceability and compliance services
    - Pure license-only identity products without delivery or ongoing support
    - IAM owner, compliance leader, CISO
    - Important adjacency because I-TRACING sells IAM as an operational security capability
  - - Cloud automation and cloud security operations
    - CNAPP/CSPM/CWPP, DevSecOps, cloud detection and response, AI/LLM security services
    - General cloud migration or platform engineering without security operations
    - Cloud platform owner, DevSecOps lead, CISO
    - Important adjacency because cloud complexity expands recurring security scope
  - - Cybersecurity consulting linked to managed operations
    - Risk assessment, roadmap, resilience planning, GRC and crisis management that convert into recurring service needs
    - Project-only strategy work with no path to operational services
    - CISO, executive management, risk/compliance
    - Useful feeder budget but not the entire core TAM on its own
