chapter:
  number: 2
  title: Market Analysis
  summary: 'I-TRACING operates inside a fast-growing but loosely bounded managed security services market whose public estimates span roughly USD 39-45 billion today and USD 66.8-87.5 billion by 2030. The company''s defendable current wedge is narrower than those global figures: regulated and complex enterprise or midmarket accounts in France and Europe that need 24/7 MDR/SOC coverage plus adjacent IAM, cloud-security, and compliance support. Regulation, cloud complexity, and talent shortages are real demand drivers, but public sources still do not isolate a France-specific SAM or a publishable SOM for I-TRACING, so sizing has to remain range-based and evidence-constrained.'
sections:
- id: market-boundary-and-substitutes
  title: Market boundary and included spend
  body: |-
    I-TRACING should be analyzed first as a managed security services and managed detection-and-response provider, not as a pure cybersecurity software company. Its public materials consistently group MDR, cyber consulting, IAM, and cloud automation/security into one operating model, while its MDR page emphasizes an always-on CyberSOC that ingests telemetry across SIEM, EDR, NDR, IAM, CASB, CSPM/CWPP, DLP, and SOAR layers. That makes the core monetized job outsourced security operations for organizations that cannot or do not want to build the full stack alone.

    Included spend should therefore cover recurring outsourced monitoring, detection, response, cloud-security operations, managed IAM support, and compliance-linked operational services. Public market definitions from The Business Research Company and MarketsandMarkets support that interpretation because they place network, application, cloud, risk-assessment, and managed SOC/MDR-style capabilities inside the same managed-security category. I-TRACING's partner catalog also points to an integration-led, one-stop-service model rather than a single-tool SKU.

    What should stay outside the core market boundary is every euro of cybersecurity software, generic IT outsourcing, or one-off consulting. Some of those budgets are adjacent and may convert later, but the cautious market boundary is the recurring outsourced cyber-operations and security-engineering layer that sits between in-house teams and vendor platforms.
