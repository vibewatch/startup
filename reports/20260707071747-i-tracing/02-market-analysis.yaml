    - n/a
    - Broad cybersecurity software, generic IT services, public cloud consumption, and non-recurring advisory budgets
    - Varies
    - Needed to avoid overstating TAM by counting every cyber or IT euro
  notes: Included spend follows the recurring outsourced-service boundary supported by MDR, IAM, cloud-security, and analyst market-definition sources; excluded spend marks adjacent budgets that may convert later but should not be counted as core MSS today.
