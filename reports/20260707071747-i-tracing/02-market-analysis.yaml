- id: sizing-lenses-and-sam-limits
  title: Sizing lenses and the limits of public SAM logic
  body: |-
    Public market sizing is directionally helpful here, but only if the estimates are treated as lenses rather than a clean TAM slide. MarketsandMarkets projects the global managed security services market from USD 39.47 billion in 2025 to USD 66.83 billion in 2030. The Business Research Company places the market at USD 38.55 billion in 2025, USD 44.85 billion in 2026, and USD 80.42 billion in 2030. An older Grand View Research lens starts from a lower 2022 base of USD 27.2 billion and reaches USD 87.51 billion by 2030. Those numbers are close enough to confirm a large, expanding outsourced-security category, but far enough apart that averaging them into one “true” TAM would be false precision.

    ENISA's market-analysis framing explains why the spread exists: managed security is shaped by demand patterns, compliance, incidents, skills shortages, and evolving service bundles, not by one stable product taxonomy. The reviewed sources also do not isolate an independent European MSSP wedge, a France-specific market, or I-TRACING's own monetizable slice.

    The defensible conclusion is a layered one. TAM is a global MSS category currently in the high-thirties to mid-forties of USD billions, with 2030 forecasts from the high-sixties to high-eighties. SAM is narrower: enterprise and midmarket accounts in France and Europe that need outsourced MDR/SOC plus adjacent IAM, cloud, and compliance support. SOM remains private-data territory because no reviewed public source discloses I-TRACING's service-line mix, contract count, or market share.
