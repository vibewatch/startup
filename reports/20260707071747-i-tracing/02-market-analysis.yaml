- id: buyers-segments-and-adoption-path
  title: Buyer segmentation, regulated demand, and adoption path
  body: |-
    The buyer map is broader than a single SOC budget. Public sources show that large enterprises still dominate current MSS spend, while SMEs can be a faster-growing adoption pool when they lack internal staffing. I-TRACING's own materials also point to multiple economic buyers: CISOs and executive management through consulting; identity and compliance owners through IAM; cloud-platform and DevSecOps owners through cloud-security services; and security-operations teams through MDR.

    Regulation sharpens that demand. NIS2 extends formal cyber obligations across 18 critical sectors and explicitly pulls public administration and medium or large entities in scope sectors into a higher-compliance operating model. DORA does the same for financial entities by codifying ICT risk management, incident reporting, resilience testing, and third-party oversight. That matters for I-TRACING because its vertical language is strongest in finance, insurance, healthcare, industry, retail, public administrations, and other complex organizations that already have governance and reporting burdens.

    The adoption path is usually not “buy a product.” It is “outsource capability”: first to cover round-the-clock monitoring and response, then to tighten identity, cloud posture, and evidence-heavy compliance processes. Bridewell and Eurazeo also frame I-TRACING as a pan-European services platform rather than a France-only local specialist, which supports a Europe-wide served-market narrative even though the exact vertical revenue mix remains private.
