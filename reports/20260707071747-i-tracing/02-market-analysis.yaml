  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: france-sam-som
    missingEvidence: France and Europe revenue split by service line, recurring-revenue mix, active customer count, and contract sizing for MDR, IAM, cloud, and consulting.
    whyItMatters: Without service-line and geography mix, public TAM ranges cannot be converted into a defendable I-TRACING SAM or SOM.
    diligencePath: Request management revenue bridge by geography, service line, and top regulated verticals plus cohort-level contract counts and ACV.
    relatedQuestionRefs:
    - QM007
    - QM025
    - QM026
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: regulated-sector-concentration
    missingEvidence: Revenue and customer concentration by BFSI, public administration, healthcare, industry, and other NIS2-relevant sectors.
    whyItMatters: The regulatory-demand thesis is stronger if a large share of current revenue already comes from regulated or complex sectors; public sources only show positioning, not concentration.
    diligencePath: Ask for customer and ARR mix by sector, plus regulated-pipeline conversion data tied to DORA and NIS2 programs.
    relatedQuestionRefs:
    - QM021
    relatedTableRefs:
    - TM003
  - type: conflicting-data
    severity: material
    topic: market-sizing-methodology
    missingEvidence: A management bridge that reconciles MSS, MDR, cloud-security, IAM, and compliance categories across analyst reports.
    whyItMatters: Public market reports disagree on baseline year, category scope, and endpoint size, so using one unadjusted number would overstate precision.
    diligencePath: Build a bottom-up bridge from current customers, average contract scope, and attach rates instead of relying on a single syndicated market report.
    relatedQuestionRefs:
    - QM004
    - QM005
    - QM006
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: minor
    topic: win-loss-proof
    missingEvidence: Public reference wins, losses, or displacement data against Orange, IBM, and other European MSS incumbents.
    whyItMatters: Competitive baseline is observable, but public evidence on I-TRACING's repeatable differentiation in France and Europe is still limited.
    diligencePath: Request named customer references, competitive win-rate evidence, and case studies by vertical and country.
    relatedQuestionRefs:
    - QM020
    relatedTableRefs:
    - TM004
