        title: Capital history, ownership transitions, and valuation constraints
        blocks:
          - type: paragraph
            body: >-
              The capital story is directionally strong but structurally opaque. The cleanest public ownership pivot is
              June 2021, when Sagard said management sold a majority stake to Eurazeo and Sagard NewGen in a second LBO,
              complemented by Ardian's €60 million debt package structured as €40 million drawn at closing plus a €20
              million acquisition line. The next major public step came on 11 June 2024, when I-TRACING announced
              exclusive discussions to bring Oakley Capital in alongside Eurazeo and Sagard, saying management and the
              investment funds would invest more than €420 million and that the implied valuation under those terms
              would exceed €500 million. That language matters because it is the clearest public valuation marker, but
              it is still discussion-stage wording rather than a closed financing certificate. The November 2024 Eurazeo
              and TPG releases then confirmed the continuation-fund close, Oakley/Eurazeo co-control, Sagard
              reinvestment, and €180 million of new capital commitments at the vehicle level. What remains missing is
              equally important: public sources still do not disclose a simple lifetime total-raised figure, exact
              post-close ownership percentages, or whether the continuation vehicle's size maps directly to primary
              company capital versus secondary liquidity.
