companyProfile:
  summary: >-
    I-TRACING was founded in Paris in 2005 and is now headquartered in Courbevoie in the Paris area. The company markets
    itself as a one-stop cybersecurity partner spanning consulting, MDR/CyberSOC, identity and access management, cloud
    automation and security, data protection, and managed support. Public disclosures show a business that has moved
    from a profitable French operating entity into a larger sponsor-backed European platform: Eurazeo and Oakley now
    co-control the business through the November 2024 continuation-fund structure, while the Bridewell and doIT
    transactions expanded the group beyond its earlier French core. Current official scale markers include +€230 million
    consolidated revenue, +1,000 experts, +600 customers, and 9 subsidiaries, but the public record still does not
    provide a clean current valuation, audited combined-group margins, or a complete capital-structure view.
