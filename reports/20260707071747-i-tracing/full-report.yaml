              page now states more than €230 million of consolidated revenue, more than 1,000 experts, more than 600
              customers, and nine subsidiaries. The October 2025 doIT acquisition post had already put the combined
              group above €210 million of 2024 revenue and above 1,000 experts, while the 2025 Bridewell transaction
              explains how the perimeter expanded before doIT was added. This matters for valuation because the
              frequently cited ~€150 million 2024 revenue figure appears to refer to the pre-Bridewell I-TRACING
              perimeter, whereas the later €210 million and €230 million figures are for the enlarged group. Public
              service-breadth data also strengthens the quality argument: the company shows 89 partners, 275 MDR
              engineers, more than 120 IAM specialists, broad consulting and cloud-security offerings, and named
              customer proof such as SWIFT CSP work and a multi-year Motul program. In other words, the question is no
              longer whether I-TRACING is a meaningful platform; it is whether the eventual entry price properly
