            body: >-
              I-TRACING’s moat is strongest where buyers need an independent European operator with French-local trust,
              regulated-environment assurances, and the ability to combine MDR with IAM, cloud, consulting, and a large
              multivendor partner stack. The PAMS qualification and current Courbevoie-centered operating footprint
              matter most in sensitive French sectors. Bridewell and doIT improve the case that I-TRACING can scale that
              proposition into a broader European platform, especially in OT/CNI, the UK, and the DACH region. The
              adverse evidence is also clear. Orange still owns the clearest incumbent-France and pan-European-scale
              advantage in the reviewed corpus. IBM remains broader at the global lifecycle-services layer. Eviden is
              stronger where buyers want sovereign cybersecurity product IP rather than managed integration.
              Clipperton’s 2025 and early-2026 valuation work also suggests that platform vendors such as Palo Alto
              Networks and CrowdStrike are being rewarded for scale, bundled functionality, and high switching costs.
