    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, legal footprint, and core positioning
        blocks:
          - type: paragraph
            body: >-
              I-TRACING enters this report as a founder-led French cybersecurity services platform rather than a
              single-product software vendor. The public record is strongest on identity and legal footprint. Registry
              and legal-notice surfaces tie the company to SIREN 484 841 127, SAS status, and a registered office at 25
              quai du Président Paul Doumer in Courbevoie, while multiple company and investor materials anchor the
              operating history to a 2005 founding. On the commercial side, the company consistently presents itself as
              a one-stop-shop provider spanning strategic consulting, managed detection and response, identity and
              access management, cloud automation and security, and adjacent data-protection work. That breadth is not
              just marketing copy: the partner catalog lists 89 partners across multiple cyber domains, and the homepage
              publicly displays blue-chip and public-sector logos such as EssilorLuxottica, FORVIA, Nexans, VINCI,
              Michelin, and the Préfecture de Police de Paris. The identity conclusion for later chapters is therefore
              stable: I-TRACING is a French, private, services-led MSSP platform with broad technical coverage,
              meaningful partner density, and a visible but still mostly company-authored customer proof set.
