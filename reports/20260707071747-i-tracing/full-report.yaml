  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer footprint and segment map
        blocks:
          - type: paragraph
            body: >-
              I-TRACING now publicly frames itself as a scaled European cybersecurity services platform rather than a
              narrow French consulting boutique. The current official surfaces converge around a 600-customer
              disclosure: the about-us page says more than 600 customers worldwide, while the careers page says more
              than 600 active customers worldwide and nine international offices. The homepage adds a broader operating
              footprint of protected users in roughly 200 countries and a logo wall that includes EssilorLuxottica,
              Michelin, Vinci, Nexans, FORVIA, Système U, Lefebvre Sarrut, Algeco, and the Paris Police Prefecture.
              Those references support explicit segmentation across CAC 40 or adjacent French blue-chip groups, large
              enterprise accounts, public-sector and regulated institutions, and international clients.


              The same record also shows that I-TRACING serves more than one account tier. The IAM page says it
              addresses both large accounts and SMEs, while the Google Cloud solution page targets midsize businesses
              with enterprise-grade security. The doIT acquisition adds a clearer mid-market proof point because doIT’s
              SOC-in-a-Box built a foothold in Germany’s mid-sized enterprise market, and management explicitly says the
              acquisition should accelerate I-TRACING in Germany and the wider DACH region. External investor materials
              from Eurazeo and Oakley repeatedly describe blue-chip, enterprise, and mid-market customers, but they stop
              short of naming revenue contribution by segment or geography. The disclosed customer map is therefore
              broad and credible, but customer concentration remains undisclosed.
