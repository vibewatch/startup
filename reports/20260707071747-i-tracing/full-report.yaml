              Leadership is broader than a single founder story, but public governance disclosure is still incomplete.
              Théodore-Michel Vrangos is the recurring external face across strategic announcements and is consistently
              identified as co-founder and president. Michel Vujicic appears as the day-to-day operating counterpart,
