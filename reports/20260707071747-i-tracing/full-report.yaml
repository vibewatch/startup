  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Historical valuation context: public support is strongest for a >€500m floor, not a current precise mark'
        blocks:
          - type: paragraph
            body: >-
              The public valuation record is unusually asymmetric. The clearest disclosed price signal is not a closed
              round term sheet or audited sponsor filing, but the company’s own June 2024 announcement that Oakley
              Capital was entering alongside Eurazeo and Sagard, with the management team and investors expected to
              invest more than €420 million and with terms implying a valuation above €500 million. That is a useful
              historical anchor because it comes directly from the company and predates the later sponsor rollover. The
              next public step, however, is structurally different: the November 2024 continuation-fund process
              disclosed €180 million of new commitments and strong sponsor participation, but it did not publish a fresh
              company-level enterprise value that outside investors can underwrite today. Oakley’s later portfolio
              materials confirm that I-TRACING became a 2024 platform investment, while public media and company posts
              consistently describe strong growth and sponsor backing. The result is a chapter where value is clearly
              substantial, but the exact current price is not publicly observable. That gap matters because a
              continuation fund demonstrates sponsor conviction, not necessarily a clean arm’s-length mark for a new
              minority investor.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV031
              - CV043
              - CV044
