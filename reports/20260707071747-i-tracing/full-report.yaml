  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and included spend
        blocks:
          - type: paragraph
            body: >-
              I-TRACING should be analyzed first as a managed security services and managed detection-and-response
              provider, not as a pure cybersecurity software company. Its public materials consistently group MDR, cyber
              consulting, IAM, and cloud automation/security into one operating model, while its MDR page emphasizes an
              always-on CyberSOC that ingests telemetry across SIEM, EDR, NDR, IAM, CASB, CSPM/CWPP, DLP, and SOAR
              layers. That makes the core monetized job outsourced security operations for organizations that cannot or
              do not want to build the full stack alone.


              Included spend should therefore cover recurring outsourced monitoring, detection, response, cloud-security
              operations, managed IAM support, and compliance-linked operational services. Public market definitions
              from The Business Research Company and MarketsandMarkets support that interpretation because they place
              network, application, cloud, risk-assessment, and managed SOC/MDR-style capabilities inside the same
              managed-security category. I-TRACING's partner catalog also points to an integration-led, one-stop-service
              model rather than a single-tool SKU.


              What should stay outside the core market boundary is every euro of cybersecurity software, generic IT
              outsourcing, or one-off consulting. Some of those budgets are adjacent and may convert later, but the
              cautious market boundary is the recurring outsourced cyber-operations and security-engineering layer that
              sits between in-house teams and vendor platforms.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
