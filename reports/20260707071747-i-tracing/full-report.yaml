              improving EBITDA margins, and cash generation consistent with a premium services provider. The 2024-2026
              disclosures also show that sponsors had enough conviction to keep funding expansion and that acquisitions
              quickly pushed the group past €210m and then +€230m of disclosed consolidated revenue. On the negative
              side, the company now looks more like a multi-country services roll-up than a single disclosed operating
              entity, and the public record does not expose recurring-revenue mix, current consolidated EBITDA,
              acquisition integration costs, leverage, burn, customer concentration, or a clean bridge from the holdco
              stack into the current operating perimeter. Valuation context from cyber and MSP market data is therefore
