  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked Risk Posture
        blocks:
          - type: paragraph
            body: >-
              I-TRACING's public file supports real category strength, but the highest investment risk is not demand
              creation; it is execution quality under a private-equity-backed roll-up. The company is now presenting
              itself as a pan-European cybersecurity services platform with more than €230 million of consolidated
              revenue, more than 1,000 experts, more than 600 customers, and multiple acquisitions layered onto a
              follow-the-sun MDR model. That can create scale advantages, but it also raises the stakes on preserving
              service quality, integration discipline, and delivery consistency across France, the UK, Germany,
              Switzerland, and other subsidiaries. The public record also leaves notable underwriting blind spots:
              customer concentration, retention, post-acquisition margin bridge, and integration KPIs are not disclosed
              in the reviewed sources. As a result, the top risks are severity-ranked around roll-up integration,
              services-margin scalability, regulatory burden in sensitive sectors, partner/platform dependence,
              cyber-talent retention, and disclosure opacity rather than around basic market demand.
