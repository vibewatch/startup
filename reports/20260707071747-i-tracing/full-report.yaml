  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: IC-ready scoring balances operating quality against valuation support and evidence quality.
    data:
      items:
        - label: Market need
          value: 8/10
          detail: Cyber-services demand and outsourcing tailwinds remain strong.
        - label: Platform scale
          value: 8/10
          detail: Revenue, customers, staff, and acquisitions support relevance.
        - label: Service breadth
          value: 8/10
          detail: MDR, IAM, consulting, cloud, and partner density are visible.
        - label: Competitive pressure
          value: 5/10
          detail: Incumbents like IBM can bundle similar domains.
        - label: Profitability visibility
          value: 3/10
          detail: No public EBITDA or recurring-revenue mix.
        - label: Valuation support
          value: 4/10
          detail: Historical >€500m support exists, but current price discovery is thin.
        - label: Evidence quality
          value: 5/10
          detail: Many scale facts are clear; current entry terms are not.
    approximationNotes: Scores are the author’s IC shorthand, not a company-disclosed framework.
    claimRefs:
      - CV009
      - CV015
      - CV024
      - CV041
      - CV043
      - CV047
      - CV052
