              I-TRACING share capital would be transferred into a BidCo beneath a jointly controlled TopCo owned by
              Oakley and Eurazeo. French registry files then make the ownership layers more visible: I-Tracing Holding
              was incorporated on 28 June 2024 with €67.5m of capital, while I-TRACING GROUP carried €114.6m of capital,
