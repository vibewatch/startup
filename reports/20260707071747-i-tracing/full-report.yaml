  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or evidence
      - Transmission to thesis
      - Action implication
    rows:
      - - Growth compression
        - Organic growth falls materially below the c.30% pace repeated in historic public materials.
        - Reduces scarcity premium and increases reliance on low-end MSP comp bands.
        - Re-cut valuation closer to base or bear bands and require margin disclosure before proceeding.
      - - Integration slippage
        - Bridewell or doIT fail to produce cross-sell, managed-services density, or geographic leverage.
        - Breaks the European-champion roll-up logic underpinning premium value.
        - Pause until a synergy dashboard and segment-level performance are disclosed.
      - - Profitability opacity persists
        - Management still cannot show audited EBITDA or recurring-revenue mix on the enlarged perimeter.
        - Prevents support for values above the historical €500m floor.
        - Maintain track or research-more stance; do not stretch to software-like multiples.
      - - Unsupported ask price
        - >-
          Entry terms imply substantially above ~3x revenue or a sponsor-style EBITDA multiple without audited margin
          proof.
        - Eliminates margin of safety versus public-evidence bands.
        - Pass unless new evidence or lower price appears.
      - - Weak external validation
        - A future financing, secondary process, or strategic discussion clears below expectation.
        - Would signal that sponsor enthusiasm did not translate into broader market clearing.
        - Use the new mark as the primary price anchor and revise downside assumptions.
    notes: Thresholds are framed as diligence triggers, not automatic forecasts.
    claimRefs:
      - CV040
      - CV041
      - CV049
      - CV050
      - CV051
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Revenue bridge by perimeter
        - Audited 2024-2026 bridge separating standalone I-TRACING, Bridewell, and doIT contributions.
        - Without a clean denominator, EV/revenue comparisons can misprice the asset by hundreds of millions.
        - CFO data room request with monthly management accounts and pro forma reconciliation.
      - - EBITDA and gross-margin disclosure
        - Actual EBITDA, EBITDA margin, gross margin, and recurring-revenue mix for the enlarged group.
        - These determine whether the company merits classic MSP bands or a premium hybrid multiple.
        - Finance package plus quality-of-earnings review.
      - - Capital structure
        - Net debt, leverage covenant package, liquidation preferences, and any preferred return or ratchet terms.
        - Current entry terms, not platform quality alone, determine the actual investment outcome.
        - Cap-table and legal diligence with waterfall model.
      - - Customer concentration and retention
        - Top-10 customers, recurring managed-services mix, and retention by major service line.
        - Upside depends on sticky managed-security economics rather than one-off integration revenue.
        - Commercial diligence and cohort analysis.
      - - Integration scorecard
        - Bridewell and doIT synergy realization, cross-sell pipeline, and margin impact by geography or service line.
        - The roll-up thesis requires proof that scale is turning into economics.
        - Integration workstream review with monthly KPI pack.
      - - Current price discovery
        - Any 2025-2026 secondary indication, lender valuation work, or sponsor mark beyond the public narrative.
        - This is the missing piece between a strong business and an investable price.
        - Board and investor-reference call plus financing materials.
    notes: Each ask is directly tied to a variable that could change the recommendation, risk rating, or valuation stance.
