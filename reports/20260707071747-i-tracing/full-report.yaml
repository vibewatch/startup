      - number: '3.3'
        title: Service breadth, SOC scale, and trust posture
        blocks:
          - type: paragraph
            body: >-
              I-TRACING differentiates less through proprietary product IP than through the combination of operating
              depth and domain breadth. Its MDR page describes 275 engineers, including 160 N2 and N3 analysts, a
              three-continent follow-the-sun CyberSOC, and coverage across 190-plus countries, one million endpoints,
              and two million protected users. Google Cloud corroborates a 150-plus Tier-2 and Tier-3 analyst pool, a
              CSIRT team, and a CTI center inside a Google Security Operations-based MSSP model, while Palo Alto
              positions I-TRACING as a co-managed Cortex SecOps operator across cloud, network, endpoint, and identity.
              Outside MDR, the company also has substantial IAM, cloud security, and consulting practices plus an
              89-partner ecosystem. The strongest trust signal is ANSSI PAMS qualification for support and managed
              services covering SOC/CERT, PAM, Active Directory Tier 0, and industrial environments. Against that,
