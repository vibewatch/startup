      - number: '8.3'
        title: >-
          Comparable bands and price discipline: services multiples support value, but not blind software-multiple
          extrapolation
        blocks:
          - type: paragraph
            body: >-
              Comparable analysis is where price discipline enters. Model-appropriate services data from Aventis is far
              less generous than cybersecurity software data: disclosed MSP transactions center around roughly 8.9x EV
              to EBITDA, larger MSP deals around 11.2x, and public MSP revenue multiples around 1.3x. By contrast,
              cybersecurity datasets from Finro and Clipperton show that product-led cyber businesses can command 7.8x
              to 18.5x revenue in public and private markets, with IAM and cloud-security niches even higher. That
              spread is informative rather than directly transferable. I-TRACING is not a narrow product company; it is
              a people-intensive cyber-services platform with consulting, IAM, MDR, cloud, and data-protection depth.
              Using classic MSP revenue multiples on the enlarged €210 million to €230 million perimeter yields only
              about €273 million to €299 million, clearly below the company’s own 2024 above-€500 million historical
              anchor. But jumping all the way to software-like 15x to 18.5x revenue would imply several billion euros, a
              level public evidence does not support for a services-heavy model. The reasonable inference is that value
              likely sits above plain-vanilla MSP comps and below software-pure-play extremes unless margin data prove
              otherwise.
            claimRefs:
              - CV024
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV045
              - CV046
          - type: table
            tableRef: TV001
            claimRefs:
              - CV043
              - CV044
              - CV047
              - CV048
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV009
              - CV015
              - CV024
              - CV041
              - CV043
              - CV047
              - CV052
      - number: '8.4'
        title: 'Scenario range and exit logic: upside exists, but only with margin proof and integration execution'
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis therefore has to be explicit about what is actually missing. The bull case assumes the
              enlarged group sustains something close to the historic ~30% organic trajectory, turns Bridewell and doIT
              scale into cross-sell and managed-services density, and ultimately demonstrates EBITDA margins strong
              enough to justify upper-teens sponsor-style multiples on a services business. The base case assumes the
              group remains a credible European champion, but that valuation lands closer to a blended 2.0x to 2.8x
              revenue or low-teens EBITDA outcome because public data still cannot prove software-grade economics. The
              bear case assumes growth cools, integration drags, and the market re-rates the business toward more
              traditional MSP bands. Exit optionality is real—continuation funds, sponsor-to-sponsor sales, and
              strategic combinations are all consistent with the 2024 to 2025 history—but no public source points to a
              live IPO process or a fresh external price-setting event. This means scenario outcomes are highly
              sensitive to actual margin disclosure and to whether the combined perimeter can preserve the quality
              implied by its customer, partner, and geographic footprint.
            claimRefs:
              - CV030
              - CV032
              - CV040
              - CV041
              - CV049
              - CV050
              - CV051
              - CV052
          - type: table
            tableRef: TV003
            claimRefs:
              - CV039
              - CV040
              - CV041
              - CV049
              - CV050
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV002
              - CV039
              - CV040
              - CV047
              - CV049
              - CV050
      - number: '8.5'
        title: >-
          Recommendation and diligence: track with medium confidence until price, margin, and cap-table visibility
          improve
        blocks:
          - type: paragraph
            body: >-
              The price-sensitive conclusion is stronger than a generic quality score and weaker than a buy call. Public
              evidence clearly supports substantial private-market value: the company discussed terms above €500 million
              in June 2024, then attracted a continuation-fund solution and executed Bridewell and doIT combinations
              that lifted disclosed group revenue above €210 million and later above €230 million. That is enough to
              reject any bearish view that the platform lacks scale. It is not enough to underwrite a current mark at
              whatever price an investor might actually face. Public sources do not disclose company-specific EBITDA,
              leverage, recurring-revenue mix, or liquidation preferences, and they blur standalone and combined revenue
              perimeters. Without those inputs, the honest call is track with medium confidence, a high risk rating, and
              an unknown valuation stance rather than a false-precision buy or avoid. The recommendation should improve
              only if management provides a clean revenue bridge, audited margin evidence, capital-structure terms, and
              proof that the roll-up is turning scale into profitability rather than just into a larger denominator.
            claimRefs:
              - CV009
              - CV041
              - CV042
              - CV043
              - CV044
              - CV047
              - CV048
