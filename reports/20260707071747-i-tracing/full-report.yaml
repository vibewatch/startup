          - type: table
            tableRef: TV006
            claimRefs:
              - CV041
              - CV042
              - CV044
              - CV047
              - CV048
              - CV050
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Current public evidence supports tracking, not underwriting an undisclosed current mark
            body: >-
              The platform is clearly valuable and larger than the 2024 standalone snapshot, but the missing current
              price, EBITDA, leverage, and preference stack mean a buy call would be false precision.
            calloutType: recommendation
            claimRefs:
              - CV043
              - CV044
              - CV047
          - type: callout
            title: Do not stretch to software multiples without margin proof
            body: >-
              Public cyber-software datasets show why multi-billion outcomes are mathematically possible, but the
              company still looks like a services-led platform unless management proves otherwise.
            calloutType: risk
            claimRefs:
              - CV045
              - CV046
          - type: callout
            title: Perimeter discipline matters
            body: >-
              This chapter treats ~€150m as a pre-Bridewell standalone 2024 anchor and >€210m to +€230m as
              enlarged-group disclosures, so all revenue-multiple work is sensitive to perimeter.
            calloutType: assumption
