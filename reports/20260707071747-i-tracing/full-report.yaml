              standalone accounts. Eurazeo and TPG both set a roughly €150m 2024 revenue target for I-TRACING, while
              Oakley described c.30 percent annual organic growth over the preceding three years. Then the perimeter
              widened further. Bridewell added more than 300 employees and UK/US presence in February 2025, and the
              October 2025 doIT announcement put combined 2024 consolidated revenue above €210m. French registry and
              legal-notice sources show that the legal stack also kept moving under sponsor ownership: I-Tracing Invest
              merged into I-Tracing Group in November 2025, and I-Tracing Group was then absorbed into I-TRACING in
              December 2025. By the 2026 company site, management was publishing +€230m consolidated revenue, +1000
              experts, +600 customers, and nine subsidiaries. These figures are directionally consistent with an
              acquisition-led scale-up, but they are not directly comparable to the 2020-2023 Pappers series because the
