      - number: '3.4'
        title: Commercial model, distribution power, and switching costs
        blocks:
          - type: paragraph
            body: >-
              The reviewed corpus shows that managed security competition here is sold much more through scope, delivery
              model, and incumbent relationships than through transparent public list pricing. I-TRACING describes fully
              managed and co-managed CyberSOC options plus a technology-agnostic model that can integrate a client’s
              existing SIEM or recommend partner tooling; that reduces migration fear for buyers who want to preserve
              prior investments. Orange benefits from telecom-adjacent reach, converged network-cloud-security
              positioning, and a domestic-France installed base that can pull MDR into wider infrastructure deals. IBM
              can sell as a fully managed service or as an extended team with global cloud, identity, and advisory
              relationships already in place. Google Cloud and Palo Alto illustrate another commercial pressure point:
              platforms can become substitutes when buyers prefer tooling and operated service in one package. Switching
              costs in this market rise after runbooks, alerting logic, privileged workflows, and regulatory reporting
              processes are embedded. That makes service quality, local trust, and integration breadth at least as
              important as any headline rate card, which is why the absence of public pricing is itself a diligence
              issue rather than a minor documentation gap.
