              The most thesis-sensitive execution risk is the interaction between sponsor-backed M&A, scarce expert
              talent, and thin public disclosure. Eurazeo, Oakley, and associated coverage all frame I-TRACING as a
              buy-and-build platform, and the company has already moved from Apalia to Bridewell and then doIT while
