            body: >-
              The best hard numbers in the file come from the French legal-entity accounts surfaced by Pappers and the
              registry. Those accounts show I-TRACING SAS growing revenue from €45.3m in 2020 to €112m in 2023, with
              growth rates of 49.8 percent, 20.3 percent, and 37.3 percent across 2021-2023. Profitability also held up:
              gross margin was still 55.8 percent in 2023, EBITDA reached €15.4m, and net income reached €9.6m. For a
              services business, the cash profile is also notable. The 2023 standalone entity showed €23m of treasury
              against €3.75m of financial debt and negative working capital, with suppliers effectively helping fund
              operations. The main caveat is scope. Headcount in the same accounts is only 197 employees, so these are
              clearly not full-group numbers once later acquisitions and holdco structures are considered. They are
