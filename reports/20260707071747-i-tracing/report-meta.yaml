companyProfile:
  summary: >-
    I-TRACING was founded in Paris in 2005 and is now headquartered in Courbevoie in the Paris
    area. The company markets itself as a one-stop cybersecurity partner spanning consulting,
    MDR/CyberSOC, identity and access management, cloud automation and security, data protection,
    and managed support. Public disclosures show a business that has moved from a profitable
    French operating entity into a larger sponsor-backed European platform: Eurazeo and Oakley
    now co-control the business through the November 2024 continuation-fund structure, while the
    Bridewell and doIT transactions expanded the group beyond its earlier French core. Current
    official scale markers include +€230 million consolidated revenue, +1,000 experts, +600
    customers, and 9 subsidiaries, but the public record still does not provide a clean current
    valuation, audited combined-group margins, or a complete capital-structure view.
  founders:
    - name: Théodore-Michel Vrangos
      role: Co-founder and President
      claimRefs: [CO009, CO010]
    - name: Laurent Charvériat
      role: Co-founder
      claimRefs: [CO009]
  foundingLocation: Paris, France
  headquarters: 25 quai du Président Paul Doumer, 92400 Courbevoie, France
  productSummary: >-
    I-TRACING sells managed cybersecurity and advisory services rather than a single software
    product. Its core offer combines 24/7 MDR/CyberSOC operations, IAM integration and managed
    services, cloud automation and security, risk and compliance consulting, incident response,
    and partner-led implementation around major security platforms.
  customerFocus: >-
    Large French enterprises, CAC 40 and other blue-chip organizations, public-sector and highly
    regulated buyers, and increasingly mid-market or international clients reached through the
    enlarged European platform.
  businessModel: >-
    Services-led cybersecurity revenue from consulting, integration, managed detection and
    response, IAM, cloud security, and support contracts, amplified by partner resell/integration
    relationships and buy-and-build expansion.
  stage: Private sponsor-backed European cyber-services platform
  fundingStatus: >-
    Eurazeo first backed I-TRACING in 2021. In November 2024, Eurazeo rolled the asset into a
    new €180 million continuation fund with Oakley joining in co-control, Sagard reinvesting, and
    significant follow-on capacity for further acquisitions.
  disclosureProfile: private-undisclosed
  claimRefs: [CO002, CO003, CO004, CO009, CO024, CO030, CO031, CI022, CI029, CI030]
summary:
  headline: >-
    I-TRACING is a scaled French and increasingly pan-European MSSP with credible operating proof,
    historical profitability, and strong sponsor support, but the absence of a clean public current
    valuation and combined-group margin disclosure keeps the case in track rather than buy territory.
