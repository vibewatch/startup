coverageNotes: >-
  Public evidence is strong on service breadth, historical standalone profitability, sponsor
  support, and enlarged-group scale, but weak on current valuation precision and combined-group
  economics. The record mixes multiple perimeters: 2020-2023 legal-entity accounts from Pappers,
  a ~€150 million 2024 standalone revenue target disclosed around the continuation-fund close,
  an October 2025 >€210 million combined-group 2024 revenue figure after Bridewell and doIT,
  and a current about-us disclosure of +€230 million consolidated revenue. Public sources do not
  disclose a clean current company-level price, audited combined-group EBITDA, leverage, or the
  full preference stack.
