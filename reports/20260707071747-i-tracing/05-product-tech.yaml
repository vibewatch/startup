- id: trust-compliance-and-secure-operations
  title: Trust, compliance, and secure operations
  body: Trust and secure-operations evidence is meaningful, but it is uneven. The strongest single signal is the ANSSI PAMS qualification, which I-TRACING says required rigorous assessment of IT security, physical security, and employee awareness and which covers high-sensitivity services such as SOC, CERT, PAM, Tier-0 Active Directory protection, and industrial systems. The SWIFT CSP content adds another regulated-workflow proof point by showing that the company positions itself as a certified assessor for annual SWIFT audits and tracks 2025 and 2026 control changes. The privacy statement also provides concrete operating-control language around GDPR governance, processor roles, DPO oversight, network segmentation, and strict named access controls. These are serious signals for enterprise buyers. The explicit limit is that the reviewed public surface does not provide a trust-center style list of ISO 27001, SOC 2, or uptime attestations, so buyers still need diligence access to certification
    documents, support commitments, and operational KPI packs.
