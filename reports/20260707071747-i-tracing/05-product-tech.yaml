    - Publicly visible
    - Google MSSP alignment, Palo Alto co-managed MDR positioning, and 89-partner ecosystem depth
    - Need formal partner-tier evidence, certification matrices, and renewal cadence
  - - Global trust attestation transparency
    - Partially evidenced only
    - PAMS and privacy controls are visible; broader attestations are not
    - Reviewed public pages do not enumerate ISO 27001, SOC 2, or public uptime attestations
