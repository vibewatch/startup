- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow problem
  - I-TRACING solution
  - Measurable benefit or operating signal
  - Limitation
  rows:
  - - Run or augment a 24/7 SOC
    - Internal team lacks continuous coverage and response depth
    - Managed or co-managed MDR with CyberSOC, CERT, SIEM, SOAR, and analyst layer
    - Public pages cite follow-the-sun delivery, 400+ critical incidents annually, 1M+ endpoints, 20TB+ of daily events, and partner-backed AI SecOps
    - No public SLA or response-time distribution is disclosed
  - - Modernize privileged and workforce identity
    - Manual identity lifecycle and privileged-access risk slow operations
    - IGA, AM, PAM, CIAM, PKI, AD protection, managed support, and passwordless patterns such as passkeys
    - 120+ IAM engineers and 170+ clients are cited on the IAM page, and the passwordless article adds concrete CIAM-style use cases
    - No public deployment templates or implementation-time benchmarks are disclosed
  - - Secure and automate Kubernetes and hybrid cloud
    - Cloud teams need repeatable deployment, visibility, and governance across complex environments
    - Terraform, Ansible, GitOps, CNAPP, zero trust, and cloud detection services
    - The practice explicitly covers AWS, Azure, GCP, and major Kubernetes distributions
    - No public product library shows what is software-reusable versus consulting-heavy
  - - Prepare for regulated audits and resilience programs
    - Financial and critical-sector teams need audit-ready controls and reporting
    - Consulting, SWIFT assessment support, crisis management, and standards-based GRC
    - Public evidence spans SWIFT, NIS, GDPR, ISO, NIST, CIS, and EBIOS or FAIR references
    - No public case pack quantifies audit pass rates or time-to-remediation
  - - Escalate a live security incident
    - Customers need immediate response support beyond periodic advisory
    - 24/7 CERT contact path plus SOC and CSIRT-linked services
    - Homepage and partner page both expose a direct CERT entry point
    - The public surface does not disclose retainer terms or forensic staffing levels
  - - Raise cyber maturity over multiple years
    - Large organizations need roadmap, change management, and technical rollout, not only tool resale
    - Consulting-to-operations model illustrated by the MOTUL program
    - Motul case shows roadmap work followed by EDR, SASE, DLP, MFA, and incident-response improvements
    - Single named case study is not enough to quantify repeatability across the customer base
  notes: The workflows translate service lines into customer jobs and use cases rather than restating generic capability labels.
