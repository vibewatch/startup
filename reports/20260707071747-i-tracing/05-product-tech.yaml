  evidenceGaps:
  - type: missing-source
    severity: material
    topic: external-certifications
    missingEvidence: A public trust-center style inventory of active ISO 27001, SOC 2, sectoral, or equivalent attestation documents for I-TRACING service operations.
    whyItMatters: Current trust evidence is meaningful but concentrated in PAMS, privacy-policy language, and partner collateral, which is weaker than a full attestation inventory for underwriting enterprise readiness.
    diligencePath: Request the current certification matrix, audit reports, scope statements, and renewal dates for all managed-service entities and major delivery sites.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: operational-metrics
    missingEvidence: Service KPIs such as SLA attainment, MTTR, false-positive rates, escalation mix, analyst utilization, and uptime by core managed-service module.
    whyItMatters: Without operating metrics, investors can validate scope and positioning but not the quality, efficiency, or repeatability of the delivery engine.
    diligencePath: Obtain an anonymized KPI pack for MDR, CERT, IAM managed services, and cloud operations, ideally split by region and service tier for the last 12 months.
    relatedQuestionRefs:
    - QE024
    - QE025
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: proprietary-platform-transparency
    missingEvidence: Internal architecture documents, reusable software module inventory, roadmap, and evidence showing what percentage of delivery is driven by proprietary tooling versus third-party platforms and human runbooks.
    whyItMatters: The central investment question is whether I-TRACING is merely a scaled expert-services operator or a services business with durable productized IP leverage.
    diligencePath: Request product architecture walkthroughs, engineering org materials, reusable automation asset lists, and module-level revenue or usage breakouts.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE003
