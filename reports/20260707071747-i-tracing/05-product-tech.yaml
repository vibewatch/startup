- id: iam-and-cloud-automation-delivery-stack
  title: IAM and cloud automation delivery stack
  body: 'Outside MDR, the next most productized areas are IAM and cloud automation. The IAM materials are unusually concrete for a services company: they enumerate IGA, access management, PAM, data-access governance, CIAM, PKI, and Active Directory protection, then connect those modules to roadmap design, integration work, and L2 or L3 managed support. A separate passwordless-authentication article widens the public scope further by discussing magic links, SMS one-time codes, and FIDO2 passkeys for customer journeys, which is consistent with the CIAM element on the IAM page and suggests identity delivery extends beyond workforce administration. The cloud practice is similarly specific. It references AWS, Azure, GCP, Kubernetes, OpenShift, AKS, EKS, and GKE, then names Terraform, Ansible, GitOps, CNAPP, CSPM or CWPP, zero trust, DevSecOps, and Cloud Detection and Response. The Apalia acquisition is important here because it added secure hosting, containerization, and automation-as-code depth that fits the public module story rather than distracting from it. The diligence-positive conclusion is breadth with real operator vocabulary. The diligence limit is that this breadth still looks services-led: there is no public reusable platform manual that would let an investor separate repeatable
    software leverage from expert labor.'
  claimRefs:
