company:
  name: I-TRACING
chapter:
  number: 5
  title: Product & Technology
  summary: 'I-TRACING’s product story is best understood as an operating stack of managed security and engineering services rather than a stand-alone software platform: MDR and CyberSOC, IAM, cloud automation and security, and consulting or GRC are all publicly evidenced, then extended through partner platforms and acquisitions. The strongest proof is around 24/7 operations, regulatory-readiness, and vendor-agnostic delivery depth; the weakest areas are public disclosure of proprietary software IP, product-performance metrics, and standardized trust attestations beyond the ANSSI PAMS signal.'
sections:
- id: service-portfolio-and-module-map
  title: Service portfolio and module map
  body: 'I-TRACING is not publicly selling a narrow packaged software SKU. The evidence instead points to a one-stop-shop cybersecurity operating model that begins with consulting and audit, moves through architecture and integration, and extends into managed detection and response, IAM, cloud automation and security, and ongoing support. That is an important distinction for diligence because the customer workflow is framed around solving operational security outcomes rather than licensing a proprietary platform. The module map is still specific enough to be useful: MDR and CyberSOC form the always-on operations core; IAM provides identity governance, privileged access, and directory protection; cloud automation and security handles Kubernetes, hyperscalers, and CNAPP-style controls; and consulting or GRC ties those modules to regulatory and resilience programs. Third-party confirmation from Oakley reinforces that the bundle is externally legible. The limit is equally clear: the public surface
    shows practice lines, partner depth, and service workflows much more clearly than it shows reusable software IP or internal product boundaries.'
