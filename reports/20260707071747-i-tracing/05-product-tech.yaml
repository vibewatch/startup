- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Key dependency
  - Main risk
  rows:
  - - Partner telemetry and control surfaces
    - Provide SIEM, EDR, NDR, IAM, CASB, CSPM or CWPP, and DLP data or enforcement hooks
    - Customer deployments plus partner APIs and licensing
    - Service quality depends on third-party tool health and access
  - - Google Security Operations and Cortex-linked detection plane
    - Supply major SecOps workflows for MSSP and co-managed MDR programs
    - Continued Google and Palo Alto platform support
    - Platform concentration can narrow visibility if buyers need broad open-stack proof
  - - SOAR and automation runbooks
    - Automate triage, correlation, and remediation across client and external data sources
    - Reliable integrations, playbooks, and customer approvals
    - Poorly tuned automation could create noise or operational friction
  - - Human analyst, CTI, and CSIRT layer
    - Validate alerts, investigate incidents, and adapt workflows to customer context
    - Talent density, training, and process discipline
    - A services-heavy model can become labor-intensive as scale increases
  - - IAM control layer
    - Govern identities, authorizations, privileges, and resilient directory operations
    - Integration with customer apps, directories, and business processes
    - Complex customer estates can slow deployment and reduce repeatability
  - - Cloud automation and DevSecOps layer
    - Industrialize secure deployment and guardrails across cloud-native environments
    - Hyperscaler patterns, Kubernetes expertise, and IaC pipelines
    - Public evidence does not separate reusable assets from bespoke engineering
  - - Governance and reporting layer
    - Map controls, risk, and resilience obligations into ongoing steering and audit output
    - Framework interpretation plus business stakeholder engagement
    - Adoption depends on customer process maturity, not just technology deployment
  notes: This architecture table describes the visible operating layers and dependencies from public materials; it does not claim access to undisclosed internal system diagrams.
