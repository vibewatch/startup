  - - SWIFT-certified assessment capability
    - Publicly marketed
    - Annual SWIFT CSP assessments and control updates for regulated financial buyers
    - Need proof of assessor roster, audit throughput, and reference clients
  - - GDPR governance and DPO model
    - Publicly documented
    - Data-controller disclosures, processor role clarity, transfer safeguards, and DPO contact path
