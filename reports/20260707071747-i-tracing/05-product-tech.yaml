- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary buyer or user
  - Current maturity
  - Differentiation signal
  - Diligence gap
  rows:
  - - MDR / CyberSOC / CERT
    - CISO, SOC manager, security operations team
    - Most mature public module
    - 24/7 follow-the-sun operations plus broad telemetry and response coverage; Google-powered MSS page cites 1M+ endpoints and 20TB+ of events analyzed daily
    - Need SLA, MTTR, detection-quality, and attach-rate metrics
  - - Identity and Access Management
    - IAM lead, infrastructure security, enterprise architecture
    - Mature specialist practice
    - Covers IGA, AM, PAM, CIAM, PKI, AD protection, managed support, and public passwordless or passkey patterns
    - Need evidence on repeatable accelerators versus bespoke integration work
  - - Automation & Cloud Security
    - Cloud platform lead, DevSecOps, infrastructure security
    - Mature and expanding
    - Combines hyperscaler, Kubernetes, IaC, CNAPP, zero trust, and cloud detection expertise
    - No public blueprint library or product documentation for reusable cloud modules
  - - Cybersecurity Consulting & GRC
    - CISO, risk committee, regulated-program owner
    - Mature advisory layer
    - Bridges ISO, NIST, CIS, EBIOS, FAIR, NIS, GDPR, and SWIFT into implementation roadmaps
    - Public materials do not quantify conversion from advisory into recurring managed revenue
  - - Partner-led integration layer
    - Enterprise buyers with heterogeneous stacks
    - Current and central
    - 89-partner ecosystem with strong concentration in detection, cloud, and identity categories
    - Partner concentration raises dependency on external platform roadmaps and certifications
  - - Acquisition-enabled expansion
    - European enterprise and mid-market buyers
    - Integration-stage growth vector
    - Apalia, doIT, and Bridewell extend cloud automation, managed SOC, OT, and AI-security depth
    - Need post-acquisition packaging, cross-sell, and common-operations evidence
  notes: Rows reflect the public practice lines and expansion modules visible on the reviewed official, partner, and third-party pages rather than undisclosed internal cost centers or hidden SKUs.
