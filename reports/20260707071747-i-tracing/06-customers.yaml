    {
      "id": "durability-opacity-and-adoption-constraints",
      "title": "Durability, opacity, and adoption constraints",
      "body": "The main underwriting weakness in the customer story is not absence of logos; it is absence of durability metrics. Across the reviewed official pages, partner materials, and investor statements, I-TRACING does not disclose NRR, GRR, logo churn, contract duration, renewal rates, customer lifetime, or top-customer concentration. Even the strongest named references do not show commercial terms. Motul proves a real transformation program, but it does not disclose spend, contract length, or whether I-TRACING became the long-term managed-service operator. The homepage logos likewise prove visibility without proving production scope or current status.\n\nPublic counts also use different vintages and definitions. Oakley discussion materials referenced 450 corporate clients in June 2024, while 2026 pages describe more than 600 customers or active customers. That directional increase is positive, but it does not establish whether the difference comes from net new logos, acquired entities, changed counting conventions, or lower-revenue project customers. Regulated sectors add another constraint. Swift’s CSP process requires mandatory controls, independent assessments, and attestation visibility to counterparties, while PAMS qualification highlights the burden of serving sensitive administration and managed-service scopes. Those requirements support stickiness once won, but they also slow procurement and make customer proof harder to scale publicly. The result is a promising but still partially opaque customer-quality picture that needs data-room validation on retention, concentration, segment mix, and partner-revenue dependency.",
