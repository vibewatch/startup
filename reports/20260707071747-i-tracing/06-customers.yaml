    "number": 6,
    "title": "Customers",
    "summary": "I-TRACING discloses a broad but still partly opaque customer base: 600 active customers worldwide, 9 international offices, and named references spanning CAC 40 and other French blue-chip groups, large regulated enterprises, mid-market DACH buyers, and global partner-led MDR clients. Public proof quality is uneven. Motul is the clearest deployment-level case study with concrete program steps and tooling, while the homepage logo wall, sector pages, and partner references demonstrate breadth rather than contract depth. Expansion logic is credible because I-TRACING sells consulting, integration, IAM, cloud, and 24/7 MDR in one stack and uses a large partner ecosystem plus acquisitions to widen coverage. The main adverse angle is disclosure opacity: public materials do not reveal NRR, GRR, churn, contract duration, or top-customer concentration, so reference quality does not yet translate cleanly into durable revenue quality."
  },
  "sections": [
    {
      "id": "customer-footprint-and-segmentation",
      "title": "Customer footprint and segment map",
      "body": "I-TRACING now publicly frames itself as a scaled European cybersecurity services platform rather than a narrow French consulting boutique. The current official surfaces converge around a 600-customer disclosure: the about-us page says more than 600 customers worldwide, while the careers page says more than 600 active customers worldwide and nine international offices. The homepage adds a broader operating footprint of protected users in roughly 200 countries and a logo wall that includes EssilorLuxottica, Michelin, Vinci, Nexans, FORVIA, Système U, Lefebvre Sarrut, Algeco, and the Paris Police Prefecture. Those references support explicit segmentation across CAC 40 or adjacent French blue-chip groups, large enterprise accounts, public-sector and regulated institutions, and international clients.\n\nThe same record also shows that I-TRACING serves more than one account tier. The IAM page says it addresses both large accounts and SMEs, while the Google Cloud solution page targets midsize businesses with enterprise-grade security. The doIT acquisition adds a clearer mid-market proof point because doIT’s SOC-in-a-Box built a foothold in Germany’s mid-sized enterprise market, and management explicitly says the acquisition should accelerate I-TRACING in Germany and the wider DACH region. External investor materials from Eurazeo and Oakley repeatedly describe blue-chip, enterprise, and mid-market customers, but they stop short of naming revenue contribution by segment or geography. The disclosed customer map is therefore broad and credible, but customer concentration remains undisclosed.",
