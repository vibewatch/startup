    {
      "id": "named-customer-proof-and-reference-quality",
      "title": "Named customer proof and reference quality",
      "body": "Public customer proof ranges from deep case-study evidence to logo-only references. Motul is the strongest disclosed named deployment. I-TRACING says Motul selected it in 2020 to build a risk-based cybersecurity roadmap for a group operating in more than 160 countries. The case study describes an initial risk assessment, roadmap integration into Motul’s information-systems transformation, deployment of EDR, SASE, DLP, and BEC controls, later work on MFA and privileged access discipline, and an eventual roadmap toward a Security Operations Center. That depth is materially stronger than a generic testimonial because it identifies a named executive sponsor, program sequence, and concrete controls.\n\nBy contrast, the homepage logos are useful but lower-quality proof. They show that I-TRACING is willing to publicly associate with large organizations such as EssilorLuxottica, Michelin, Vinci, Nexans, and FORVIA, but they do not disclose whether those references are consulting projects, production managed services, single-country scopes, or historical rather than current relationships. The Google Cloud and Palo Alto materials sit between those extremes. They validate that I-TRACING is trusted enough to co-market with major vendors and to describe always-on MDR operations at global scale, yet they still do not reveal named end-customer contract values or renewal behavior. Overall, public proof is strongest where a named customer explains what changed operationally, and weakest where the evidence is only a logo or vendor-authored positioning statement.",
