      "id": "regulated-sector-and-international-fit",
      "title": "Regulated-sector and international fit",
      "body": "I-TRACING’s strongest segment differentiation is in regulated and operationally demanding environments. The MDR page names banking, finance, insurance, healthcare, retail, luxury, and manufacturing as protected sectors, and the IAM page adds public administration, industry, and partner-heavy industrial workflows. The SWIFT audit page shows a direct offer for financial institutions that must complete annual independent security assessments against the Customer Security Controls Framework, while the PAMS qualification page frames security guarantees for sensitive sectors such as industry, energy, defense, and telecommunications. Those disclosures matter because they imply that I-TRACING is not only selling generic cyber tooling; it is selling services wrapped around sector-specific compliance and operating constraints.\n\nInternational proof is also meaningful even if country-level revenue detail is missing. Official figures show nine offices or subsidiaries worldwide, and the MDR surface claims coverage across more than 190 countries with follow-the-sun CyberSOC operations on three continents. Eurazeo’s 2024 exit-and-reinvestment announcement cites subsidiaries in Canada, Hong Kong, Malaysia, China, Switzerland, and the UK, while Bridewell and doIT materially deepen the UK/U.S. and DACH footprints. This is enough to treat international customers as a real segment rather than a marketing aspiration. What remains missing is the mix: public materials do not say how much of the 600-customer base sits in France versus outside France, nor how many of those customers buy managed services instead of project work.",
