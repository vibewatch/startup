    {
      "id": "sales-motion-upsell-and-partner-led-expansion",
      "title": "Sales motion, upsell logic, and partner leverage",
      "body": "The public record supports a consultative, land-and-expand sales motion. I-TRACING’s consulting page describes a model that starts with maturity assessments, strategy, governance, and crisis-management work, then moves into technical consulting, engineering, integration, support, and managed services. The IAM page mirrors that structure with three-year roadmaps, RFP support, implementation, and level-2/level-3 managed services. The cloud automation and security page extends the same pattern into cloud transformation, while the MDR pages show how I-TRACING can then become the 24/7 operating layer once architectures and controls are in place. That sequence matters because it creates multiple attach points: advisory can convert into integration; integration can convert into managed services; managed services can expand from IAM or cloud into MDR, CTI, or incident response.\n\nPartner and acquisition surfaces widen the top of funnel and the expansion pool. The partners page lists 89 partners across detection and response, IAM, OT, risk and compliance, cloud, and application security. Google Cloud and Palo Alto both present co-branded MSSP or co-managed MDR propositions, implying partner-assisted sourcing into enterprise and midsize clients. I-TRACING’s French Google Cloud MDR page adds direct client-facing proof of that offer by marketing a unified follow-the-sun CyberSOC across three continents, coverage in more than 190 countries, and more than 1 million secured endpoints. Acquisitions serve a similar role. Apalia adds secure cloud and DevSecOps relationships in luxury, retail, and banking-insurance; doIT adds German mid-market managed SOC reach; Bridewell adds UK and U.S. coverage plus OT and critical-infrastructure strength. Together, those facts suggest that customer growth is not supposed to come from one SKU but from cross-selling adjacent cyber domains into an installed base that increasingly spans France, DACH, the UK, and multinational accounts.