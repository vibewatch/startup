  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与变现能见度
        blocks:
          - type: paragraph
            body: >-
              I-TRACING 的公开资料看起来像一家服务占比较重的网络安全平台，而不是一家按席位定价透明的软件公司。公司明确营销战略咨询、审计、IAM 集成、云自动化，以及全天候 MDR / CyberSOC
              运营。这一组合至少支持三类变现来源：经常性托管安全合同、项目型咨询和集成工作，以及围绕大型供应商生态的伙伴转售或实施。最强经常性信号是
              日不落接力式托管检测模型，但公司没有发布价格手册、订阅层级、最低合同金额，也没有公开说明收入中经常性部分和项目型部分各占多少。这一点重要，因为收入质量和利润率耐久性高度取决于合同期限、人员密度，以及价值捕获有多少落在托管服务而非一次性集成工作中。因此，公开证据在服务广度上强，在实际定价或组合披露上弱。
