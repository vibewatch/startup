  - id: TI007
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 重要性
      - 当前公开状态
      - 具体尽调路径
    rows:
      - - 经常性收入占比和合同期限
        - 决定收入质量和估值可比性
        - 未公开披露
        - 按托管服务、项目、转售和合同期限分桶索取收入桥
      - - 实际定价 / ACV
        - 用于判断定价权和 GTM 效率
        - 无公开价目册或 ACV 数据
        - 索取合同样本、实际 ACV 分布和折扣政策
