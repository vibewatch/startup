      - number: '2.4'
        title: 增长驱动、采纳约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              正向需求逻辑很直接。MarketsandMarkets、The Business Research Company 和 Grand View 都把 MSS 增长与威胁强度上升、云和混合环境复杂化、人才稀缺以及
              24/7 运营需求相连。eSentire 对 Gartner 的摘要补上了实际买家逻辑：当攻击、混合环境、合规要求和 AI 加持的运营都更难靠内部管理时，自建安全的风险更高。I-TRACING
              自身规模主张、Google 合作关系和 Palo Alto 共管 MDR 定位，都能干净映射到这种结果导向的需求故事。


              难点在采纳摩擦。MarketsandMarkets 警告，外包安全可能降低买家的可见度和控制权，而强监管账户最在意这一点。Orange 和 IBM 显示了既有类别标准已经多高：广泛平台覆盖、AI
              融入的检测、响应、云、身份和生命周期支持都已是入场条件。Wavestone 的 2026 网络安全基准也警告，复杂度上升快过成熟度，第三方和工业系统安全尤其如此。需求可能很强，但销售、交付和举证负担同样重。


              这会影响估值。Clipperton、Finro、Clairfield、Aventis 和 Solganick
              都显示，市场仍可投资，但分化明显。平台领导者和增长更快的网络安全类别，获得的倍数显著优于增长较慢或服务占比较重的同业。对 I-TRACING 来说，云、IAM
              和监管韧性相邻业务有助于叙事；但投资人仍需要关于经常性收入组合、利润率结构和细分集中度的私有证据，才能把市场需求转化为精确的估值上行案例。
