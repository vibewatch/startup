      - number: '3.4'
        title: 商业模式、分销力量与切换成本
        blocks:
          - type: paragraph
            body: >-
              已审阅材料显示，这里的托管安全竞争更多靠服务范围、交付模式和既有关系来销售，而不是靠透明公开价目表。I-TRACING 描述了全托管和共管 CyberSOC 选项，以及可整合客户现有 SIEM
              或推荐合作伙伴工具的技术中立模型；这能降低希望保留既有投入的买家的迁移焦虑。Orange 受益于电信相邻触达、网络-云-安全融合定位，以及可把 MDR 带入更大基础设施交易的法国本土装机基础。IBM
              既能作为全托管服务销售，也能凭借既有全球云、身份和咨询关系，作为延展团队销售。Google Cloud 和 Palo Alto
              说明了另一种商业压力点：当买家希望把工具和运营服务打包购买时，平台可能成为替代品。运行手册、告警逻辑、特权工作流和监管报告流程一旦嵌入，切换成本就会上升。因此，服务质量、本地信任和集成广度至少与任何头部价目表同等重要；公开定价缺位本身就是尽调问题，而不是轻微文档缺口。
