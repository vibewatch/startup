  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 服务组合与模块图谱
        blocks:
          - type: paragraph
            body: >-
              I-TRACING 公开销售的不是狭窄打包软件
              SKU。证据反而指向一站式网络安全运营模型：从咨询和审计开始，延伸到架构和集成，再进入托管检测与响应、IAM、云自动化与安全，以及持续支持。这个区别对尽调重要，因为客户工作流围绕解决运营安全结果展开，而不是围绕授权一个自有平台展开。模块图谱仍具体到足够有用：MDR
              和 CyberSOC 构成全天候运营核心；IAM 提供身份治理、特权访问和目录保护；云自动化与安全处理 Kubernetes、超大规模云厂商 和 CNAPP 类控制；咨询或 GRC
              则把这些模块接到监管和韧性项目上。Oakley 的第三方确认进一步说明，这套组合在外部也看得懂。限制同样清楚：公开表层更清楚地展示了实践线、伙伴深度和服务工作流，而不是可复用软件 IP 或内部产品边界。
