      - number: '8.3'
        title: 可比区间与价格纪律：服务业倍数支撑价值，但不支持盲目外推软件倍数
        blocks:
          - type: paragraph
            body: >-
              可比分析是价格纪律进入的地方。Aventis 提供的服务业数据更适合其模式，远没有网络安全软件数据慷慨：已披露 MSP 交易集中在约 8.9x EV / EBITDA，较大 MSP 交易约 11.2x，上市
              MSP 收入倍数约 1.3x。相比之下，Finro 和 Clipperton 的网络安全数据集显示，产品主导的网络安全企业在公开和私募市场可获得 7.8x 到 18.5x 收入倍数，IAM
              和云安全细分甚至更高。这个差距有信息价值，但不能直接搬用。I-TRACING 不是狭窄产品公司，而是人力密集型网络安全服务平台，深耕咨询、IAM、MDR、云和数据保护。把传统 MSP 收入倍数套在扩大后的
              €210 million 至 €230 million 口径上，只得到约 €273 million 至 €299 million，明显低于公司自己 2024 年超过 €500 million
              的历史锚点。但一路跳到类似软件的 15x 到 18.5x 收入倍数，又会推出数十亿欧元估值；公开证据并不支持一个服务占比较高模式达到这种水平。合理推断是，除非利润率数据另有证明，价值大概率高于普通 MSP
              可比区间，低于纯软件公司的极端水平。
