  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 指示性估值逻辑
      - 概率信号
    rows:
      - - 乐观
        - 扩大后集团维持接近历史的增长，顺利整合 Bridewell 和 doIT，并在之后证明 EBITDA 利润率达到 15% 左右。
        - 在扩大后的业务边界上，按混合约 2.8x-3.5x 收入倍数，或按投资方风格、15x 左右 EBITDA 支撑，约为 €700m-€900m。
        - 需要利润率披露、交叉销售证明，以及投资方继续支持 M&A 执行。
      - - 基准
        - 收入规模守住，增长放缓，利润率质量不错但不像软件公司。
        - 按混合约 2.0x-2.8x 收入倍数，或十倍出头 EBITDA 框架，约为 €500m-€700m。
        - 最符合当前公开证据：规模已被证明，但经济性仍不透明。
      - - 悲观
        - 增长放缓，整合价值兑现不及预期，市场把资产重新定价到更接近传统 MSP 区间。
        - 按公开 MSP 收入和较低 EBITDA 服务区间，约为 €275m-€450m。
        - 较弱增长、没有利润率披露，或证据显示规模没有改善盈利能力，都会触发这一情景。
    notes: 这些是基于公开证据的指示性情景，不是管理层预测或目标价。
