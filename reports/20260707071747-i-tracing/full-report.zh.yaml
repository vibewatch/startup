  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 历史估值背景：公开证据最能支撑 >€500m 的底线，而不是当前精确估值
        blocks:
          - type: paragraph
            body: >-
              公开估值记录明显不对称。最清晰的价格信号不是已交割轮次条款清单或经审计资方文件，而是公司自己在 2024 年 6 月公告称，Oakley Capital 将与 Eurazeo 和 Sagard
              一同进入，管理团队和投资者预计投资超过 €420 million，条款隐含估值高于 €500 million。这是有用的历史锚点，因为它直接来自公司，并且早于后续资方滚动持有。下一步公开动作在结构上不同：2024
              年 11 月的延续基金流程披露了 €180 million 新承诺和强资方参与，但没有发布外部投资者今天可据以投资论证的最新公司层面企业价值。Oakley 后续组合材料确认 I-TRACING 成为 2024
              年平台投资，而公开媒体和公司帖子持续描述强增长和资方支持。因此，本章的结论是价值显然可观，但当前精确价格公开不可见。这个缺口很重要，因为延续基金证明的是资方信心，不一定是新少数股东可依赖的公平交易估值。
