  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序
        blocks:
          - type: paragraph
            body: >-
              I-TRACING 的公开档案支撑真实的品类实力，但最高投资风险不在需求创造，而在 PE 支持的并购整合下能否守住执行质量。公司现在把自己定位为泛欧洲网络安全服务平台，合并收入超过 €230
              million，专家超过 1,000 名，客户超过 600 名，并把多起收购叠加到跨时区接力的 MDR
              模型上。这可能带来规模优势，但也提高了守住服务质量、整合纪律以及法国、英国、德国、瑞士和其他子公司交付一致性的要求。公开材料还留下明显投资盲点：客户集中度、留存、收购后利润率桥接和整合 KPI
              都未在已审阅来源中披露。因此，头部风险按严重程度围绕并购整合、服务利润率可扩展性、敏感行业监管负担、伙伴 / 平台依赖、网络安全人才留存和披露不透明排序，而不是围绕基础市场需求。
