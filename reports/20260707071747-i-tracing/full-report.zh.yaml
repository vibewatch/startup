      - number: '4.4'
        title: 资本结构与融资能见度
        blocks:
          - type: paragraph
            body: >-
              资本支持可见，但当前合并杠杆不可见。2021 年第二次 LBO 引入 Eurazeo 和 Sagard 作为多数股东；Ardian 披露了 €60m 债务包，拆分为已提取 €40m 和 €20m
              收购额度。2024 年 6 月，Oakley 公告称 OCI 通过 Fund V 的间接承诺预计达到约 £39m；欧盟委员会的并购摘要显示，I-TRACING 100% 股本将转入一个 BidCo，其上是由
              Oakley 和 Eurazeo 共同控制的 TopCo。法国登记文件随后让所有权层级更清楚：I-Tracing Holding 于 2024 年 6 月 28 日成立，资本为 €67.5m；I-TRACING
              GROUP 在 2023 年有 €114.6m 资本、仅 4 名员工和 €75.2m 金融债务，之后在 2025 年末被折回运营公司。这些披露显示了真实的财务投资人支持和多层并购整合
              结构，但仍没有回答今天最重要的承销问题：交易后在手现金、总债务、净债务、利息负担、资金可维持时间，或杠杆现在落在哪个实体上。2023
              年独立账目看似净现金为正，但不能把它当作延续基金、控股公司重组、Bridewell、doIT 和截至 2025 年末登记口径变化之后扩大集团的资本状况。主要卡点不是绝对规模，而是口径能见度。
