  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 立场
      - 论点
      - 证据锚点
      - 什么会改变判断
    rows:
      - - 正方论点
        - 该集团已经跨过从本地专精服务商到规模化欧洲网络安全服务平台的门槛。
        - '>€210m 至 +€230m 收入、>1,000 名专家、600+ 客户，以及 Bridewell 和 doIT 扩张。'
        - 如果披露规模反转，或整合失败侵蚀服务质量，这一论点会被削弱。
      - - 正方论点
        - 服务广度和合作伙伴密度支撑交叉销售，也提升战略相关性。
        - 89 家合作伙伴、Google MSSP 协同、MDR、IAM、云、咨询和客户证明。
        - 如果证据显示服务广度不能转化为交叉销售或经常性托管服务密度，溢价就应下调。
      - - 正方论点
        - 投资方行为显示出信心和融资可得性。
        - 2024 年 6 月 >€500m 讨论、2024 年 11 月接续基金支持、2025 年 M&A 延续。
        - 外部融资若持平或下行，将大幅削弱对投资方标记价值的信心。
      - - 反方论点
        - 当前公司层面价格没有公开披露到投资测算所需的精度。
        - 接续基金结构、没有新的公开估值标记、没有二级报价、没有 IPO 流程。
        - 新一轮定价融资、二级报价或经审计的估值桥，将直接提升可投资测算性。
      - - 反方论点
        - 扩大后集团的实际 EBITDA 利润率未披露，因此历史底线之上的价值支撑尚未被证明。
        - 没有公开的公司特定 EBITDA、杠杆或经常性收入披露。
        - 经审计 EBITDA 利润率若在 10% 出头至 15% 左右，将显著增强投资理由。
      - - 反方论点
        - 软件式网络安全倍数可能高估了一个人力密集型服务平台的价值。
        - Aventis MSP 区间远低于 Finro 和 Clipperton 的网络安全软件区间。
        - 如果管理层证明经济性已产品化、利润率高且收入经常性强，倍数框架可以上移。
    notes: 每一行只围绕估值相关性展开；这不是通用的公司质量评分卡。
