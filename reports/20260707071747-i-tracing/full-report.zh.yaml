      - number: '3.3'
        title: 服务广度、SOC 规模与信任姿态
        blocks:
          - type: paragraph
            body: >-
              I-TRACING 的差异化不主要来自自有产品 IP，而来自运营深度与领域广度的组合。其 MDR 页面描述了 275 名工程师，其中包括 160 名 N2 和 N3 分析师；一个横跨三大洲、日不落接力式
              CyberSOC；以及对 190 多个国家、100 万个端点和 200 万受保护用户的覆盖。Google Cloud 佐证了基于 Google Security Operations 的 MSSP 模型中有
              150 多名 Tier-2 和 Tier-3 分析师、CSIRT 团队和 CTI 中心；Palo Alto 则把 I-TRACING 定位为跨云、网络、端点和身份的共管 Cortex SecOps 运营商。MDR
              之外，公司还有相当规模的 IAM、云安全和咨询实践，以及 89 家合作伙伴生态。最强信任信号是 ANSSI PAMS 资质，覆盖 SOC/CERT、PAM、Active Directory Tier 0
              和工业环境的支持及托管服务。反过来，Orange 公开宣传法国规模，IBM 以不被厂商锁定的话术匹配工具中立的 MDR 主张，Eviden 则具备更强的主权产品资质和 ANSSI 认证组件。Wavestone 与
              Bridewell 呈现的是非常不同的强项：前者是高管咨询和基准评估，后者是 OT 与 CNI 专精。
