  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入口径
        blocks:
          - type: paragraph
            body: >-
              分析 I-TRACING 时，应先把它看作托管安全服务和托管检测与响应提供商，而不是纯网络安全软件公司。其公开材料持续把 MDR、网络安全咨询、IAM、云自动化 / 安全放在同一个运营模型里；其 MDR
              页面强调全天候 CyberSOC，可跨 SIEM、EDR、NDR、IAM、CASB、CSPM/CWPP、DLP 和 SOAR 层摄取遥测。因此，核心可变现任务是为那些无法或不愿独自搭建完整栈的组织外包安全运营。


              因此，纳入口径应覆盖经常性的外包监控、检测、响应、云安全运营、托管 IAM 支持，以及与合规相连的运营服务。The Business Research Company 和 MarketsandMarkets
              的公开市场定义支持这种解释，因为它们把网络、应用、云、风险评估和托管 SOC/MDR 类能力放进同一个托管安全类别。I-TRACING 的合作伙伴目录也指向以集成为主的一站式服务模型，而不是单一工具 SKU。


              核心市场边界外应排除每一欧元网络安全软件、通用 IT 外包或一次性咨询。其中部分预算相邻，未来可能转化，但谨慎边界应是介于内部团队和供应商平台之间的经常性外包网络安全运营与安全工程层。
