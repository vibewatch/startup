  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代方案
        blocks:
          - type: paragraph
            body: >-
              欧洲托管安全采购已不再是简单的外包还是自建选择。ENISA 称，混合环境、更严格监管和资深网络安全人才短缺，让组织更难在内部维持 24/7 韧性，因此它们正转向外包托管安全服务。NIS2
              现在把风险管理和事件报告义务施加到 18 个关键行业；DORA 则为金融机构增加 ICT 第三方监督、测试和事件报告义务。这种环境扩大了 I-TRACING 周围的竞争集合。法国本土和泛欧洲直接标杆是
              Orange Cyberdefense，它公开宣传 IDC 对其欧洲 MDR 的认可，以及法国本土基础设施优势。IBM 在托管响应、云和身份等全生命周期上设定全球标杆。Eviden
              在主权身份、加密和工业信任重要的场景中竞争。Wavestone 替代的是优先考虑董事会层面战略和网络安全成熟度项目的买家。Bridewell 在 OT、CNI 和英国强监管项目中重要；与此同时，内部
              cyberSOC 自建，以及由合作伙伴主导的 Google Security Operations 或 Palo Alto Cortex 服务模型，也仍是实际替代方案，适合希望把更多工具控制权留在内部的买家。
