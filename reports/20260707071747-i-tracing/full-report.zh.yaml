      - number: '6.3'
        title: 销售动作、追加销售逻辑与伙伴杠杆
        blocks:
          - type: paragraph
            body: >-
              公开材料支持一种顾问式、先落地再扩张的销售动作。I-TRACING 的咨询页面描述的模型从成熟度评估、战略、治理和危机管理切入，再进入技术咨询、工程、集成、支持和托管服务。IAM
              页面也沿用这个结构，覆盖三年路线图、RFP 支持、实施，以及 level-2 / level-3 托管服务。云自动化与安全页面把同一套路延伸到云转型，而 MDR 页面说明，架构和控制措施落地后，I-TRACING
              可以继续成为 24/7 运营层。这个顺序很关键，因为它创造了多个挂载点：咨询可以转成集成；集成可以转成托管服务；托管服务可以从 IAM 或云扩展到 MDR、CTI 或事件响应。


              伙伴和收购界面把漏斗顶部和扩张池都做宽了。伙伴页面列出 89 个伙伴，覆盖检测与响应、IAM、OT、风险与合规、云和应用安全。Google Cloud 和 Palo Alto 都呈现了联合品牌 MSSP
              或共同管理 MDR 主张，意味着伙伴协助把企业和中型客户导入。I-TRACING 的法语 Google Cloud MDR 页面直接面向客户证明这套方案：跨三大洲统一运营跨时区接力的 CyberSOC，覆盖
              190 多个国家，保护 100 多万个端点。收购也起到类似作用。Apalia 带来奢侈品、零售和银行保险领域的安全云与 DevSecOps 关系；doIT 带来德国中端市场的托管 SOC 覆盖；Bridewell
              带来英国和美国覆盖，以及 OT 和关键基础设施能力。合在一起，这些事实说明，客户增长不应来自单一 SKU，而是把相邻网络安全领域交叉销售进既有客户群；这个客户群正从法国扩展到 DACH、英国和跨国账户。
