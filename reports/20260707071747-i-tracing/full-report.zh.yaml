      - number: '5.2'
        title: MDR、CyberSOC 与 CERT 运营模型
        blocks:
          - type: paragraph
            body: >-
              证据最充分的技术运营模型位于 MDR 内部。I-TRACING 自身 MDR 页面描述了日不落接力式 CyberSOC、定制或共管服务选项、基于 SIEM 和 SOAR
              的工作流，以及跨端点、网络、身份、云和数据防泄漏控制的多源遥测。外部伙伴材料让图像更清晰。Google Cloud 称该服务建立在 Google Security Operations 之上，包含 24/7
              SOC 和 CERT 层；Palo Alto Networks 则描述 Cortex SecOps 嵌入到跨云、网络、端点和身份的共管 MDR 中。一个专门的 Google 驱动 MSS
              页面补充了更多运营细节，点名 Google Threat Intelligence、Security Command Center 和 Gemini AI，同时引用 311 名工程师、160 名 L2 或 L3
              网络安全分析师、超过 100 万个受控端点，以及每天分析超过 20 TB 事件。这些来源合在一起，指向一套现代服务架构：伙伴平台提供数据平面，自动化和运行手册负责编排，分析师加 CTI
              做最终判断。这是可信的运营深度，不是 PPT 故事。主要尽调注意项是，公开证据仍未达到软件架构层面的完整证据包：没有公开数据模型、SLA 套件或量化的检测质量数据集。
