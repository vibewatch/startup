      - number: '2.3'
        title: 买家分层、监管需求与采纳路径
        blocks:
          - type: paragraph
            body: >-
              买家图谱比单一 SOC 预算更宽。公开来源显示，大型企业仍主导当前 MSS 支出；中小企业缺少内部人员时，可能成为增长更快的采纳池。I-TRACING 自身材料也指向多个经济买家：咨询触达 CISO
              和高管层；IAM 触达身份与合规负责人；云安全服务触达云平台和 DevSecOps 负责人；MDR 则触达安全运营团队。


              监管进一步拉紧需求。NIS2 把正式网络安全义务扩展到 18 个关键行业，并明确把公共行政部门以及范围行业内的中大型实体纳入更高合规运营模型。DORA 对金融实体也做了同样的事，把 ICT
              风险管理、事件报告、韧性测试和第三方监督写成规则。这对 I-TRACING 重要，因为它的垂直行业话术在金融、保险、医疗、工业、零售、公共行政和其他复杂组织中最强，而这些组织本来就背负治理和报告压力。


              采纳路径通常不是“买一个产品”，而是“外包一种能力”：先覆盖全天候监控和响应，再收紧身份、云态势以及证据密集的合规流程。Bridewell 和 Eurazeo 也把 I-TRACING
              定位为泛欧洲服务平台，而不是只服务法国的本地专家；这支持了欧洲范围服务市场的叙事，尽管精确的垂直行业收入组合仍是私有信息。
