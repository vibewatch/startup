        title: 图表
        blocks:
          - type: callout
            title: 当前公开证据支持跟踪，而不是为未披露当前估值背书
            body: 平台显然有价值，也大于 2024 年独立快照；但当前价格、EBITDA、杠杆和优先权结构缺失，买入建议会显得虚假精确。
