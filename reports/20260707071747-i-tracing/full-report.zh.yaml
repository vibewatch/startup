      - number: '7.4'
        title: 并购整合、人才与披露缺口
        blocks:
          - type: paragraph
            body: >-
              最影响投资论点的执行风险，是资方支持的 M&A、稀缺专家人才和薄弱公开披露之间的相互作用。Eurazeo、Oakley 及相关报道都把 I-TRACING 描述为买入并整合平台；公司也已经从 Apalia 走到
              Bridewell，再到 doIT，同时继续讨论更多收购。这创造了云安全、托管 SOC、英国和 DACH 覆盖以及交叉销售的明显机会，但也意味着文化、工具、资质、薪酬和客户服务必须快速收敛。实时招聘页面仍列出
              11 个空缺岗位，集中在 SOC、RSSI、IAM、补丁管理和服务交付，这符合一家必须持续补充稀缺资深从业者、才能维持当前增长的企业。与此同时，已审阅公开档案没有披露客户集中度、续约质量、经审计的 2024 或
              2025 年利润率桥接，或交易后 KPI 记分卡，所以投资者目前只能从资方和公司叙事中推断整合质量，而不是从硬运营证据中判断。
