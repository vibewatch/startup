  - id: TV005
    title: 推翻论点与否决触发器表
    columns:
      - 触发器
      - 阈值或证据
      - 对论点的传导
      - 行动含义
    rows:
      - - 增长压缩
        - 自然增长明显低于历史公开材料反复出现的约 30% 速度。
        - 稀缺性溢价下降，对低端 MSP 可比区间的依赖上升。
        - 将估值重切到更接近基准或悲观区间，并在推进前要求利润率披露。
      - - 整合滑坡
        - Bridewell 或 doIT 未能产生交叉销售、托管服务密度或地域杠杆。
        - 打破支撑溢价价值的欧洲冠军整合逻辑。
        - 暂停，直到披露协同看板和分部层面表现。
      - - 盈利能力不透明持续
        - 管理层仍无法展示扩大边界上的经审计 EBITDA 或经常性收入组合。
        - 无法支撑高于历史 €500m 底线的价值。
        - 维持跟踪或继续研究立场；不要拉伸到软件式倍数。
      - - 缺乏支撑的要价
        - 入场条款意味着大幅高于约 3x 收入，或在没有经审计利润率证明的情况下采用投资方风格 EBITDA 倍数。
        - 相对公开证据区间，安全边际消失。
        - 除非出现新证据或更低价格，否则放弃。
      - - 外部验证偏弱
        - 未来融资、二级流程或战略讨论的出清价格低于预期。
        - 将表明投资方热情没有转化为更广泛市场的出清。
        - 以新标记作为主要价格锚点，并修正下行情景假设。
    notes: 这些阈值是尽调触发器，不是自动预测。
    claimRefs:
      - CV040
      - CV041
      - CV049
      - CV050
      - CV051
  - id: TV006
    title: 最终尽调请求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 按边界拆分的收入桥
        - 经审计的 2024-2026 桥表，区分独立 I-TRACING、Bridewell 和 doIT 贡献。
        - 如果没有干净分母，EV/收入比较可能让资产误价数亿。
        - CFO 资料室请求，附月度管理账和备考口径对账。
      - - EBITDA 与毛利率披露
        - 扩大后集团的实际 EBITDA、EBITDA 利润率、毛利率和经常性收入组合。
        - 这些决定公司应适用传统 MSP 区间，还是应获得高溢价混合倍数。
        - 财务资料包加盈利质量审查。
      - - 资本结构
        - 净债务、杠杆契约包、清算优先权，以及任何优先回报或棘轮条款。
        - 真正决定投资结果的是当前入场条款，而不只是平台质量。
        - 股权结构表和法律尽调，配瀑布模型。
      - - 客户集中度与留存
        - 前 10 大客户、经常性托管服务组合，以及按主要服务线拆分的留存。
        - 上行空间取决于有粘性的托管安全经济性，而不是一次性集成收入。
        - 商业尽调和分群分析。
      - - 整合记分卡
        - Bridewell 和 doIT 的协同兑现、交叉销售管线，以及按地区或服务线拆分的利润率影响。
        - 整合论点需要证明规模正在转化为经济性。
        - 整合工作流审查，附月度 KPI 包。
      - - 当前价格发现
        - 任何 2025-2026 年二级市场迹象、贷款方估值工作，或超出公开叙事的投资方标记。
        - 这是强业务与可投资价格之间缺失的一块。
        - 董事会和投资者参考电话，加融资材料。
    notes: 每项请求都直接对应一个可能改变建议、风险评级或估值立场的变量。
    claimRefs:
      - CV041
      - CV042
      - CV044
      - CV047
      - CV048
      - CV050
