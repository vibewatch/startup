  - id: TV004
    title: 可比估值表
    columns:
      - 可比项
      - 类别
      - 公开指标或事件
      - 隐含倍数 / 价值信号
      - 与 I-TRACING 的相关性
      - 局限
    rows:
      - - I-TRACING 2024 年 6 月讨论
        - 历史公司事件
        - 已投资 >€420m；曾讨论 >€500m 估值
        - 直接历史底线
        - 最接近披露过的公司特定价格锚点。
        - 早于交易交割，且未披露当前外部投资者条款。
      - - I-TRACING 2024 年 11 月接续基金
        - 投资方流动性事件
        - €180m 接续基金；Oakley 加入共同控制；曾讨论 2024 年收入目标约 €150m
        - 确认投资方意愿，但未披露新的 EV
        - 显示融资支持和增长叙事仍然强劲。
        - 接续基金不是干净的公开定价事件。
      - - 扩大后的 I-TRACING 2025-2026 边界
        - 当前公司披露
        - 2025 年 10 月披露 2024 年合并收入 >€210m；2026 年合并收入 +€230m
        - 当前规模锚点
        - 为敏感性分析提供收入分母。
        - 把 M&A 后合并边界与更早的 2024 年独立主体引用混在一起。
      - - 大型 MSP 交易（Aventis）
        - 服务 M&A 基准
        - 中位数约 8.9x EV/EBITDA；大型交易约 11.2x EV/EBITDA
        - 传统服务区间
        - 对人力密集型平台最相关的公开基准。
        - 广义 MSP 集合不如 I-TRACING 这样偏纯网络安全。
      - - 公开 MSP（Aventis）
        - 公开服务基准
        - 2024 年下半年约 1.3x EV/收入
        - 低端公开服务收入区间
        - 说明为什么只看公开市场服务可比公司会低估网络安全专精资产的稀缺性。
        - 公开 MSP 样本不是纯粹的欧洲网络安全服务同行集合。
      - - 公开 / 私有 / M&A 网络安全数据集（Finro）
        - 网络安全交叉检查
        - 公开 7.8x；私有 15.2x；M&A 16.3x
        - 高端网络安全产品参照
        - 说明为什么网络安全资产可以高于通用服务定价。
        - 数据集混合了软件、基础设施和 M&A 细分，并不只包含服务。
      - - 公开网络安全高 / 低表现者（Clipperton）
        - 公开软件分化
        - 高表现者 18.5x EV/收入；低表现者 4.5x EV/收入
        - 软件上下界
        - 有助于理解高溢价产品群体与服务资产的差异。
        - 产品驱动的公开样本不能直接套到人力密集型模式上。
      - - 托管 IT / MSP 市场更新（Greenwich）
        - 市场活动参照
        - 2025 年上半年共 121 笔交易，总额 $1B+
        - 活跃度支撑持续需求
        - 证明 MSP 类资产的买入并整合需求仍然存在。
        - 活动数据不是估值倍数。
    notes: 这组可比项刻意匹配商业模式，而不是追求穷尽；它把直接公司锚点与服务、网络安全板块的参考区间放在一起。
