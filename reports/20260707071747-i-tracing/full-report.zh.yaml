        title: 财务结论与承销卡点
        blocks:
          - type: paragraph
            body: >-
              公开资料支持一个正面但不完整的财务结论。正面看，2020–2023 年独立账目显示收入强劲增长、毛利率稳定在 50% 中段、EBITDA 利润率改善，且现金生成符合优质服务提供商特征。2024–2026
              年披露也显示，财务投资人有足够信心继续资助扩张，收购迅速把集团推过 €210m，随后又推到披露合并收入 +€230m
              以上。负面看，公司现在更像多国服务整合平台，而不是单一披露运营实体；公开记录没有暴露经常性收入组合、当前合并 EBITDA、收购整合成本、杠杆、现金消耗、客户集中度，或从
              控股公司栈到当前运营口径的干净桥。因此，来自网络安全和 MSP 市场数据的估值背景只能提供方向。正确结论不是经济性弱，而是当前集团经济性相对公司扩大后的范围披露严重不足。
