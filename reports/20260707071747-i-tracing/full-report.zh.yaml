        - 无公开披露
        - 索取月度 KPI 包，覆盖 CAC、回本周期、总留存和 NRR
      - - 当前合并 EBITDA 和毛利率
        - 严谨套用行业倍数必须要有
        - 合并后未公开披露
        - 索取合并 P&L，拆分服务线利润率并列出整合调整
      - - 当前合并总债务和净债务
        - 用于评估基金和并购动作后的财务风险
        - 未公开披露
        - 索取债务明细表、贷款方条款、利息成本和贷款契约余量
      - - 顶层控股公司财务报表和债务位置
