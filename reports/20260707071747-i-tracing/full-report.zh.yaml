      - - 大型企业 / 关键客户
        - 买家是集团安全领导层或转型办公室；用户覆盖 SOC、IAM、云和基础设施团队
        - 关于我们页面、MDR、Google Cloud、Palo Alto 和投资者材料均描述大规模、持续运营以及蓝筹客户
