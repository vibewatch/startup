      - number: '6.4'
        title: 受监管行业与国际化适配
        blocks:
          - type: paragraph
            body: >-
              I-TRACING 最强的细分差异化来自受监管且运营要求高的环境。MDR 页面点名银行、金融、保险、医疗健康、零售、奢侈品和制造业等受保护行业，IAM 页面还加入公共行政、工业以及伙伴密集型工业流程。SWIFT
              审计页面显示，公司直接面向必须按 Customer Security Controls Framework（客户安全控制框架）完成年度独立安全评估的金融机构；PAMS
              资质页面则为工业、能源、国防和电信等敏感行业提供安全保证。这些披露很重要，因为它们说明 I-TRACING 不只是销售通用网络安全工具，而是把服务包在行业特定的合规和运营约束之中销售。


              即便缺少国家层面的收入明细，国际化证明也有意义。官方数字显示全球有 9 个办公室或子公司，MDR 入口声称在三大洲运营跨时区接力的 CyberSOC，覆盖 190 多个国家。Eurazeo 的 2024
              年退出并再投资公告提到加拿大、香港、马来西亚、中国、瑞士和英国子公司，而 Bridewell 与 doIT 显著加深了英国 / 美国和 DACH
              足迹。这足以把国际客户视为真实细分，而不是营销愿望。缺口在于结构：公开材料没有说明 600 个客户中多少在法国、多少在法国以外，也没有说明其中多少买的是托管服务而非项目制工作。
