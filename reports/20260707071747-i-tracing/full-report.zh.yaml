        blocks:
          - type: paragraph
            body: >-
              监管和法律负担很重，因为 I-TRACING 明确卖进客户要求可审计安全治理、跨境数据控制和行业特定证据的领域。法律声明和隐私声明把集团锚定在一家具体的法国 SAS 实体，并披露与 GDPR
              相关的控制者和处理者角色、跨境传输机制以及具名 DPO。咨询和 SWIFT 材料显示，I-TRACING 围绕 NIS、GDPR、SWIFT、ISO、NIST 和 CIS 框架定位；PAMS 公告又加入一项与
              ANSSI 相关的高保证资质，覆盖支持和托管服务。NIS2 和 DORA 扩大了关键行业和金融领域的事件报告、第三方监督和董事会问责预期，DORA 实施要求在 2025
              年继续扩展。这是需求的战略顺风，但也是负担：每个被收购实体、分析师小组和受监管客户流程，都必须与集团现在公开作出的陈述保持一致。
