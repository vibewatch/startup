      - number: '2.2'
        title: 规模测算视角与公开 SAM 逻辑的边界
        blocks:
          - type: paragraph
            body: >-
              公开市场规模测算在这里有方向性帮助，但只有把估算当作观察镜头，而不是干净 TAM 融资页，才有意义。MarketsandMarkets 预计全球托管安全服务市场将从 2025 年的 USD 39.47
              billion 增长到 2030 年的 USD 66.83 billion。The Business Research Company 给出的市场规模为 2025 年 USD 38.55 billion、2026
              年 USD 44.85 billion、2030 年 USD 80.42 billion。更早的 Grand View Research 视角从较低的 2022 年 USD 27.2 billion 基数出发，到
              2030 年达到 USD 87.51 billion。这些数字足够接近，能确认外包安全是一个庞大且扩张中的类别；但差距也足够大，把它们平均成一个“真实”TAM 会制造虚假精确。


              ENISA 的市场分析框架解释了差异从何而来：托管安全受需求模式、合规、事故、技能短缺和不断变化的服务组合驱动，而不是由一个稳定产品分类决定。已审阅来源也没有单独拆出独立的欧洲 MSSP
              楔形市场、法国特定市场，或 I-TRACING 自身可变现的份额。


              可防守结论应分层。TAM 是全球 MSS 类别，目前大致落在 USD 38–45 billion 区间，2030 年预测在 USD 67–88 billion 区间。SAM 更窄：法国和欧洲需要外包
              MDR/SOC，并配套 IAM、云和合规支持的企业及中型客户。SOM 仍属于私有数据范围，因为已审阅公开来源没有披露 I-TRACING 的服务线组合、合同数量或市场份额。
