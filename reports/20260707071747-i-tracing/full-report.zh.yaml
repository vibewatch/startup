              文件中最好的硬数字来自 Pappers 和登记系统披露的法国法人实体账目。这些账目显示，I-TRACING SAS 的收入从 2020 年 €45.3m 增至 2023 年 €112m，2021–2023
              年增长率分别为 49.8%、20.3% 和 37.3%。盈利能力也守住了：2023 年毛利率仍为 55.8%，EBITDA 达到 €15.4m，净利润达到 €9.6m。作为服务型业务，现金状况也值得注意。2023
              年独立实体有 €23m 现金，对应 €3.75m 金融债务，并呈现负营运资本，供应商实际上在帮助公司融资运营。主要注意项是口径。同一账目中的员工数只有 197
              人，因此在考虑后续收购和控股公司结构后，这显然不是完整集团数字。但它仍是观察历史收入质量和利润率纪律的最干净审计窗口。
