          label: 广度已验证
          detail: 89 家伙伴、MDR、IAM、云、咨询、客户证明
          tone: positive
        - id: n3
          label: 历史价格支撑
          detail: 2024 年 6 月 >€500m 讨论及资方后续跟进
          tone: neutral
        - id: n4
          label: 当前价格不透明
          detail: 没有新的公开外部投资人估值标记或股权结构条款
          tone: negative
        - id: n5
          label: 盈利能力不透明
          detail: 扩围后口径没有公开 EBITDA 或经常性收入结构
          tone: negative
        - id: n6
          label: 建议跟踪
          detail: 中等置信度；高风险；估值立场未知
          tone: warning
      edges:
        - to: n6
          label: 支撑关注
          from: n1
        - to: n6
          label: 支撑关注
          from: n2
        - to: n6
          label: 支撑历史价值
          from: n3
        - to: n6
          label: 阻止给出买入建议
          from: n4
        - to: n6
          label: 阻止精确公允价值判断
          from: n5
    approximationNotes: 该流程图展示作者对证据的综合判断，而非公司披露的决策模型。
    claimRefs:
      - CV009
      - CV015
      - CV043
      - CV044
      - CV047
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 以扩围后收入口径推算的企业价值，会随采用服务业倍数还是软件倍数而大幅变化。
    data:
      items:
        - label: €210m 按 1.3x
          value: 273
          unit: EURm
          tone: negative
        - label: €230m 按 1.3x
          value: 299
          unit: EURm
          tone: negative
        - label: €230m 按 2.2x
          value: 506
          unit: EURm
          tone: neutral
        - label: €230m 按 2.8x
          value: 644
          unit: EURm
          tone: positive
        - label: €230m 按 7.8x
          value: 1794
          unit: EURm
          tone: warning
        - label: €230m 按 15.2x
          value: 3496
          unit: EURm
          tone: warning
    approximationNotes: 图表固定收入，只调整基准倍数，说明模型选择为何主导估值区间。
    claimRefs:
      - CV009
      - CV034
      - CV036
      - CV039
      - CV045
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 乐观、基准、悲观区间反映扩围后平台能否跑出混合型网络安全服务经济性，还是被重估到传统 MSP 水平。
    data:
      items:
        - label: 悲观情形
          low: 275
          mid: 340
          high: 450
          unit: EURm
          detail: 增长放缓，整合交付不及预期。
        - label: 基准情形
          low: 500
          mid: 600
          high: 700
          unit: EURm
          detail: 规模守住，但利润率证据仍只有中等强度。
        - label: 乐观情形
          low: 700
          mid: 800
          high: 900
          unit: EURm
          detail: 执行表现和利润率披露支撑高端服务估值。
        - label: 历史公开下限
          low: 500
          mid: 500
          high: 500
          unit: EURm
          detail: 2024 年 6 月公司讨论。
    approximationNotes: 区间是基于公开证据的示例性结果，不是管理层指引，也不是外部目标价。
    claimRefs:
      - CV002
      - CV039
      - CV040
      - CV047
      - CV049
      - CV050
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 面向 IC 的评分，在运营质量、估值支撑和证据质量之间取平衡。
    data:
      items:
        - label: 市场需求
          value: 8/10
          detail: 网络安全服务需求与外包顺风仍强。
        - label: 平台规模
          value: 8/10
          detail: 收入、客户、员工和并购规模支撑其重要性。
        - label: 服务广度
          value: 8/10
          detail: MDR、IAM、咨询、云和伙伴密度都可见。
        - label: 竞争压力
          value: 5/10
          detail: IBM 等在位厂商能打包类似能力域。
        - label: 盈利可见度
          value: 3/10
          detail: 没有公开 EBITDA 或经常性收入结构。
        - label: 估值支撑
          value: 4/10
          detail: 历史上存在 >€500m 支撑，但当前价格发现不足。
        - label: 证据质量
          value: 5/10
          detail: 很多规模事实清晰；当前进入条款并不清楚。
    approximationNotes: 评分是作者面向 IC 的速记，不是公司披露框架。
    claimRefs:
      - CV009
      - CV015
      - CV024
      - CV041
      - CV043
      - CV047
      - CV052
