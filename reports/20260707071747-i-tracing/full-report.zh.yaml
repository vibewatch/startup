      - number: '5.3'
        title: IAM 与云自动化交付栈
        blocks:
          - type: paragraph
            body: >-
              MDR 之外，最产品化的领域是 IAM 和云自动化。IAM 材料对一家服务公司来说少见地具体：列举了 IGA、访问管理、PAM、数据访问治理、CIAM、PKI 和 Active Directory
              保护，再把这些模块接到路线图设计、集成工作和 L2 或 L3 托管支持上。一篇单独的无密码认证文章进一步扩大了公开范围，讨论面向客户旅程的魔法链接、短信一次性验证码和 FIDO2 passkeys；这与 IAM
              页面上的 CIAM 元素一致，也说明身份交付不止员工身份管理。云实践同样具体。它引用 AWS、Azure、GCP、Kubernetes、OpenShift、AKS、EKS 和 GKE，再点名
              Terraform、Ansible、GitOps、CNAPP、CSPM 或 CWPP、零信任、DevSecOps 以及云检测与响应。Apalia 收购在这里很重要，因为它增加了安全托管、容器化和自动化即代码
              深度，贴合公开模块故事，而不是分散焦点。尽调正面结论是：广度真实，并且使用的是运营者词汇。尽调限制是：这种广度仍然看起来由服务驱动；公开资料中没有可复用平台手册，无法让投资人把可重复软件杠杆与专家人工分开。
