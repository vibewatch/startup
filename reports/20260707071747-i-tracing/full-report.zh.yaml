              投资人和公司披露显示，2023 年独立账目发布后，故事发生了实质变化。Eurazeo 和 TPG 都为 I-TRACING 设定了约 €150m 的 2024 年收入目标，Oakley 则称前三年年有机增长约
              30%。随后口径进一步扩张。2025 年 2 月，Bridewell 带来 300 多名员工和英国 / 美国存在；2025 年 10 月 doIT 公告把 2024 年合并收入放到 €210m
              以上。法国登记和法律公告来源显示，在财务投资人所有权下，法律架构也持续变化：I-Tracing Invest 于 2025 年 11 月并入 I-Tracing Group，随后 I-Tracing Group
              又在 2025 年 12 月被吸收到 I-TRACING。到 2026 年公司网站，管理层披露 +€230m 合并收入、+1000 名专家、+600 名客户和 9
              家子公司。这些数字与收购驱动的规模扩张方向一致，但不能与 2020–2023 年 Pappers 序列直接比较，因为披露口径现在是更广集团，中间控股口径也在 2025
              年末再次简化。这个区别是本章财务解读的核心难点。
