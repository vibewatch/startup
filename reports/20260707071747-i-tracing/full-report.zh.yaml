      - number: '3.5'
        title: 护城河耐久性与负面证据
        blocks:
          - type: paragraph
            body: >-
              I-TRACING 的护城河在这些场景中最强：买家需要一家独立欧洲运营商，既具备法国本地信任、强监管环境背书，又能把 MDR、IAM、云、咨询和大型多供应商伙伴栈组合在一起。PAMS 资质和当前以
              Courbevoie 为中心的运营足迹，在敏感法国行业中最关键。Bridewell 与 doIT 强化了 I-TRACING 把该主张扩展成更广欧洲平台的论点，尤其是在 OT/CNI、英国和 DACH
              区域。负面证据也很清楚。在已审阅材料中，Orange 仍拥有最清晰的法国既有优势和泛欧洲规模优势。IBM 在全球生命周期服务层仍更宽。Eviden 在买家想要主权网络安全产品
              IP、而不只是托管集成时更强。Clipperton 的 2025 年和 2026 年初估值工作还表明，Palo Alto Networks 与 CrowdStrike
              等平台供应商正因规模、捆绑功能和高切换成本得到市场奖赏。因此，I-TRACING 的投资逻辑取决于一件事：它的服务驱动集成模型，能否在大型既有公司和产品平台吸收这些预算之前，更快赢下受监管欧洲账户。
