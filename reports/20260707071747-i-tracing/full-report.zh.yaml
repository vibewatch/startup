        - I-Tracing Holding 已公开，但 Pappers 未显示账目，公开资料也未按实体桥接债务
        - 索取最新实体架构图，以及控股公司 / 运营公司试算平衡表和公司间债务图
      - - 现金余额和资金续航期
        - 用于承保资本充足性和下一次融资触发点
        - 未公开披露
        - 索取现金瀑布、月度烧钱 / 现金生成，以及基准 / 下行情景资金续航期
      - - 客户集中度和续约经济性
        - 决定扩大后集团的韧性
        - 无公开客户集中度或续约数据
        - 索取前 20 大客户收入、客户 logo 留存和最大客户流失桥接
      - - 交易估值 / 交割倍数
