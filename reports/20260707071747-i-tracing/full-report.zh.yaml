  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户足迹与分层图谱
        blocks:
          - type: paragraph
            body: >-
              I-TRACING 现在公开把自己定位为有规模的欧洲网络安全服务平台，而不是狭窄的法国咨询精品店。当前官方页面围绕 600 客户披露相互印证：about-us 页面称全球客户超过 600
              家，招聘页面称全球活跃客户超过 600 家、国际办公室 9 个。首页又补充了更广运营足迹：近 200 个国家的受保护用户，以及包含
              EssilorLuxottica、Michelin、Vinci、Nexans、FORVIA、Système U、Lefebvre Sarrut、Algeco 和 Paris Police Prefecture
              的标识墙。这些引用支持明确分层：CAC 40 或相邻法国蓝筹集团、大型企业账户、公共部门和强监管机构，以及国际客户。


              同一记录也显示，I-TRACING 服务的不止一个账户层级。IAM 页面称它面向大型账户和中小企业；Google Cloud 解决方案页面则以企业级安全瞄准中型企业。doIT 收购增加了更清晰的中型市场证明，因为
              doIT 的 SOC-in-a-Box 已在德国中型企业市场建立立足点，管理层明确称这笔收购应加速 I-TRACING 在德国和更广 DACH 区域的发展。Eurazeo 和 Oakley
              的外部投资人材料反复描述蓝筹、企业和中型市场客户，但没有进一步点名各分层或地区的收入贡献。因此，已披露客户图谱广且可信，但客户集中度仍未披露。
