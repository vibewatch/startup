      - number: '6.2'
        title: 具名客户证明与参考质量
        blocks:
          - type: paragraph
            body: >-
              公开客户背书从深度客户案例到仅有 logo 的引用不等。Motul 是已披露具名部署中最强的一例。I-TRACING 称，Motul 于 2020 年选择它，为一个业务覆盖 160
              多个国家的集团制定基于风险的网络安全路线图。该客户案例写清了初始风险评估、路线图如何并入 Motul 的信息系统转型、EDR、SASE、DLP 和 BEC 控制的部署，后续 MFA
              和特权访问治理，以及最终走向安全运营中心的路线图。这种深度明显强于普通推荐语，因为它点出了具名高管发起人、项目顺序和具体控制措施。


              相比之下，首页 logo 有用，但证明质量更低。它们说明 I-TRACING 愿意公开绑定 EssilorLuxottica、Michelin、Vinci、Nexans 和 FORVIA
              等大型组织，但没有披露这些引用到底是咨询项目、生产级托管服务、单一国家范围，还是历史关系而非当前关系。Google Cloud 和 Palo Alto 材料介于两端之间。它们验证了 I-TRACING
              足够受信任，可以与大型厂商联合营销，并以全球规模描述全天候 MDR 运营；但仍没有披露具名终端客户合同金额或续约表现。总体看，公开证明在具名客户说明运营上发生了什么变化时最强；只有 logo
              或厂商撰写的定位材料时最弱。
