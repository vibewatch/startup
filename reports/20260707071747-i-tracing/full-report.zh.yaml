          - type: callout
            title: 没有利润率证据，就不要拉伸到软件倍数
            body: 公开网络安全软件数据集说明，数十亿结果在数学上可能成立；但除非管理层证明相反，公司仍更像服务主导型平台。
            calloutType: risk
            claimRefs:
              - CV045
              - CV046
          - type: callout
            title: 口径纪律很重要
            body: 本章把 ~€150m 视为 Bridewell 前 2024 年独立锚点，把 >€210m 到 +€230m 视为扩大后集团披露，因此所有收入倍数分析都对口径敏感。
            calloutType: assumption
            claimRefs:
              - CV004
