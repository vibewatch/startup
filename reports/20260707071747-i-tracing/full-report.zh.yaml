      - number: '8.4'
        title: 情景区间与退出逻辑：有上行空间，但前提是利润率证据和整合执行
        blocks:
          - type: paragraph
            body: >-
              情景分析必须明确真正缺什么。牛市情景假设扩大后集团基本维持历史上约 30% 的有机增长轨迹，把 Bridewell 和 doIT 规模转化为交叉销售和托管服务密度，并最终证明 EBITDA
              利润率足够强，能让服务型企业拿到高十几倍、资方风格的倍数。基准情景假设集团仍是可信的欧洲冠军，但估值更接近 2.0x 到 2.8x 的混合收入倍数，或低十几倍
              EBITDA，因为公开数据仍无法证明软件级经济性。熊市情景假设增长降温、整合拖累，市场把业务重新定价到更传统的 MSP 区间。退出选择权是真实的——延续基金、资方之间出售和战略组合，都与 2024 至 2025
              年历史一致——但没有公开来源指向正在推进的 IPO 流程或新的外部定价事件。这意味着情景结果高度依赖实际利润率披露，也依赖合并口径能否守住其客户、伙伴和地理足迹所暗示的质量。
