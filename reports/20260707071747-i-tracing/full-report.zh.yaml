      - number: '8.2'
        title: 当前规模与证据：相较 2024 年独立收入快照，公司已是更大的欧洲网络安全服务平台
        blocks:
          - type: paragraph
            body: >-
              运营规模上的证据基础远强于当前价格。公司 2026 年关于我们页面现在写明，合并收入超过 €230 million，专家超过 1,000 名，客户超过 600 名，子公司 9 家。2025 年 10 月 doIT
              收购帖子已经把合并集团的 2024 年收入放在 €210 million 以上、专家超过 1,000 名；2025 年 Bridewell 交易则解释了 doIT
              加入前口径如何扩张。这对估值很重要，因为常被引用的 ~€150 million 2024 年收入数字似乎指 Bridewell 前的 I-TRACING 口径，而后来的 €210 million 和 €230
              million 数字则对应扩大后的集团。公开服务广度数据也强化了质量论点：公司展示 89 个伙伴、275 名 MDR 工程师、120 多名 IAM 专家、广泛的咨询和云安全产品，以及 SWIFT CSP
              工作和多年 Motul 项目等具名客户证明。换句话说，问题不再是 I-TRACING 是否是有意义的平台；问题是最终入场价格是否恰当地反映了这个扩大后平台，而没有把软件公司式倍数过度外推。
