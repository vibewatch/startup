      - number: '6.5'
        title: 持久性、不透明度与采用约束
        blocks:
          - type: paragraph
            body: >-
              客户故事里的主要投资弱点不是没有 logo，而是没有持久性指标。在已审阅的官方页面、伙伴材料和投资人声明中，I-TRACING 没有披露 NRR、GRR、logo
              流失、合同期限、续约率、客户生命周期或大客户集中度。即便最强的具名引用也没有展示商业条款。Motul 证明了真实的转型项目，但没有披露支出、合同年限，也没有说明 I-TRACING
              是否成为长期托管服务运营方。首页 logo 同样只能证明可见度，不能证明生产范围或当前状态。


              公开客户数还使用了不同年份和定义。Oakley 讨论材料在 2024 年 6 月提到 450 家企业客户，而 2026 年页面描述的是 600 多名客户或活跃客户。这个方向性增长是好事，但不能证明差异来自净新增
              logo、被收购实体、计数口径变化，还是收入较低的项目客户。受监管行业又增加了一层约束。SWIFT 的 CSP 流程要求强制控制、独立评估，并向交易对手展示认证可见性；PAMS
              资质凸显服务敏感行政和托管服务范围的负担。这些要求一旦拿下客户会支撑粘性，但也会拖慢采购，并让客户证明更难公开规模化。结果是，客户质量图景有希望，但仍然部分不透明，需要在数据室验证留存、集中度、细分结构和伙伴收入依赖。
