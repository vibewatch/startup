        - 买家通常是区域 CIO 或安全负责人；用户是更精简、需要外包能力的内部团队；付款方是业务单元或集中 IT 预算
        - Google Cloud 面向中型企业；doIT 收购材料称 SOC-in-a-Box 已在中型企业站稳脚跟
        - 对法国以外可规模化 MDR 和托管 SOC 扩张很重要
        - 未公开中型市场客户数量或平均合同规模
      - - 受监管行业
        - 买家是金融、公共部门、关键基础设施或工业领域中对合规敏感的领导层；用户必须满足审计和控制要求
        - SWIFT 审计、PAMS 资质、IAM 和 MDR 页面点名金融、保险、公共行政、国防相邻、能源、电信和工业用例
        - 价值高，因为监管复杂度抬高切换成本，并利好专业服务商
        - 公开证据更强调能力和资质，而不是按分群披露的真实部署
      - - 国际客户
        - 买家是跨国安全领导层；用户是分布式 IT 和 SOC 团队；付款方可以是全球或区域安全组织
        - 官方材料提到 9 个办公室、覆盖 190+ 个国家、24/7 跟随太阳模式，以及遍布欧洲、亚洲和北美的子公司
        - 价值高，因为跟随太阳运营和并购支撑跨境托管服务
        - 未按地区披露收入，也未披露国家级客户数量
      - - 通过并购进入的行业邻近领域
