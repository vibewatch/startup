  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - PE 并购整合
        - Bridewell、doIT 和 Apalia 的整合 KPI 包
        - 管理层无法按收购项目提供 100 天计划、系统统一状态，或流失 / 交叉销售证据。
        - 将平台叙事视为未证实；按碎片化资产基础重新评估，并下调估值容忍度。
      - - 服务利润率可扩展性
        - 毛利率和利用率桥
        - 没有经审计的 2024/2025 桥，或有证据显示分析师密集型增长稀释利润率的速度快于收入组合改善。
        - 从增长倍数逻辑切换到下行情景现金转化逻辑，并要求更低入场价格。
      - - 监管 / 合规负担
        - 框架范围和审计结果
        - ANSSI / SWIFT / 受监管客户证据只对应个别实体、已经过期，或排除被收购业务。
        - 升级到专项法律合规尽调，并限制受监管行业上行假设。
      - - 客户集中度不透明
        - 头部客户和续约披露
        - 管理层不提供前 10 大客户收入、留存或损失事件数据。
        - 在证伪之前，把集中度视为可能推翻论点的风险，避免把高留存率写进投资测算。
      - - 合作伙伴 / 平台依赖
        - 供应商与超大云厂商敞口图
        - 少数合作伙伴技术栈或云服务商主导交付经济性或事故历史。
        - 上调依赖折扣；在认可规模优势前，要求看到应急 / 迁移计划。
      - - 网络安全人才留存
        - 流失率、空缺岗位账龄与后备深度
        - 高级 SOC / GRC / 集成岗位长期空缺，或整合期间流失率上升。
        - 下调对服务质量的信心，假设工资压力上行，并削减利润率扩张预期。
      - - 披露缺口
        - 尽调资料室质量与公开记录的差距
        - 私有尽调未能补上这里识别的集中度、诉讼、整合和利润率缺口。
        - 停下，不要把投资方叙事外推进本轮投资测算。
    notes: 这些否决标准设计成可以通过尽调材料、投资方报告、法律附表和经营看板持续监控，而不是只靠直觉判断。
