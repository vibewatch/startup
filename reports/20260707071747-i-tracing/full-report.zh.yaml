      - number: '8.5'
        title: 建议与尽调：在价格、利润率和股权结构透明度改善前，以中等信心跟踪
        blocks:
          - type: paragraph
            body: >-
              对价格敏感的结论强于泛泛质量评分，但弱于买入建议。公开证据清楚支撑可观的私募市场价值：公司在 2024 年 6 月讨论过超过 €500 million 的条款，随后吸引延续基金方案，并完成 Bridewell 和
              doIT 组合，把披露的集团收入抬到 €210 million 以上，后来又超过 €230
              million。这足以否定平台没有规模的看空观点。但它不足以支撑投资者面对任何实际价格时都能为当前估值做投资论证。公开来源没有披露公司特定
              EBITDA、杠杆、经常性收入结构或清算优先权，还模糊了独立收入和合并收入口径。缺少这些输入，诚实判断就是以中等信心跟踪、给出高风险评级，并承认估值立场未知，而不是用虚假精确给出买入或回避。只有当管理层提供干净的收入桥接、经审计利润率证据、资本结构条款，并证明并购整合把规模转成盈利能力而不只是更大分母时，建议才应上调。
