summary:
  headline: >-
    I-TRACING is a scaled French and increasingly pan-European MSSP with credible operating proof, historical
    profitability, and strong sponsor support, but the absence of a clean public current valuation and combined-group
    margin disclosure keeps the case in track rather than buy territory.
