  topStrengths:
    - >-
      I-TRACING has already reached meaningful scale, with current official disclosures of +€230 million in consolidated
      revenue, +1,000 experts, +600 customers, and 9 subsidiaries.
    - >-
      The company covers multiple high-value cyber workflows in one platform-like services stack, spanning MDR/CyberSOC,
      IAM, cloud security, consulting, and managed support.
    - >-
      Sponsor backing from Eurazeo, Oakley, Sagard, and continuation-fund co-leads gives the group capital and M&A
      capacity to keep consolidating European cyber-services assets.
    - >-
      Trust signals are stronger than for many regional MSSPs, including ANSSI PAMS qualification, Google Cloud MSSP
      alignment, Palo Alto proof points, and named blue-chip customer references.
  topRisks:
    - >-
      Public sources do not disclose a current company-level price, audited combined-group EBITDA, leverage, or
      liquidation preferences, limiting valuation underwriteability.
    - >-
      The Bridewell and doIT combinations create real integration risk across geography, service quality, sales motion,
      and margin conversion.
    - >-
      The business appears services-heavy rather than software-pure-play, so applying premium cybersecurity software
      multiples could materially overstate fair value.
    - >-
      Customer concentration, retention, and revenue mix by managed services versus project work remain opaque despite
      strong logo proof.
    - >-
      The platform depends on maintaining scarce cyber talent and productive relationships with key technology partners
      such as Google and Palo Alto Networks.
  unresolvedGaps:
    - Current company-level valuation or secondary-clearing price after the November 2024 continuation-fund close.
    - >-
      Audited combined-group EBITDA, leverage, cash generation, and bridge from standalone I-TRACING to the
      Bridewell/doIT perimeter.
    - Revenue mix across MDR/CyberSOC, IAM, cloud security, consulting, and other service lines.
    - Customer concentration, renewal behavior, and any NRR or multi-year managed-service retention metrics.
    - Detailed cap table, preference stack, debt package, and governance rights under the current sponsor structure.
