callouts:
  - calloutType: "recommendation"
    title: "Diligence Requirement on Series C Preference Terms"
    body: "Because General Atlantic injected $500 million into Nerdio at a $1.0B+ valuation, investors must verify the liquidation preference structure before committing capital. A 1x non-participating preferred structure preserves common equity upside in mid-tier exits, whereas participating preferred terms or guaranteed minimum IRR hurdles would severely impair common share realizations in sub-$1.5B exit scenarios."
    claimRefs:
      - "CV001"
      - "CV005"
      - "CV010"
  - calloutType: "risk"
    title: "Existential Microsoft Platform Dependency"
    body: "Nerdio's software suite generates 100% of its utility by optimizing Microsoft technologies (Azure Virtual Desktop, Windows 365, and Microsoft Intune), while influencing over $350 million in Microsoft revenue. Any shift in Microsoft's strategic direction—such as native feature parity within Azure Portal or restrictive API licensing—constitutes a primary thesis-break trigger."
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV010"
