  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "retention-and-concentration"
      missingEvidence: >-
        NRR, GRR, logo and revenue churn, renewal rates, contract duration, cohort retention,
        customer satisfaction, and expansion ARR by MSP and enterprise cohort.
      whyItMatters: >-
        Reported customer and user scale cannot establish durable recurring revenue or
        land-and-expand performance without cohort and renewal evidence.
      diligencePath: >-
        Obtain board-level cohort schedules and customer-success dashboards, reconcile them to
        billing data, and sample renewal records across MSP and enterprise cohorts.
      relatedQuestionRefs: ["QU005"]
    - type: "private-evidence-only"
      severity: "material"
      topic: "customer-concentration"
      missingEvidence: >-
        Top 1, top 5, and top 10 customer and partner shares of ARR, plus revenue by direct,
        MSP, and channel-sourced customer.
      whyItMatters: >-
