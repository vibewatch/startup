chapter:
  number: 6
  title: "Customers"
  summary: >-
    Nerdio reports substantial customer reach across MSP and enterprise channels, but the
    strongest precise scale disclosure in the assigned evidence remains its March 2025 claim
    of 15,000 customers and more than 5 million users. Named testimonials show real use, while
    retention, renewal, and revenue-concentration evidence remains unavailable in this pool.
sections:
  - id: "customer-segments-and-buyers"
    title: "Customer segments and buying routes"
    body: >-
      Nerdio serves two related buyer systems rather than a single homogeneous customer base.
      MSPs use the platform to operate Microsoft cloud environments for their own clients and
      to build recurring service revenue, while enterprise IT teams use it to manage virtual
      desktops and endpoints in their own Microsoft environments. Independent reporting also
      describes large enterprises with thousands of desktops as a target segment. A further
      route runs through Microsoft-aligned channel partners: Nerdio's program offers deal
      protection, implementation incentives, and joint work with sales and customer success.
      These channels broaden distribution, but the public evidence does not allocate customer
      count, users, or revenue among MSP, enterprise, and partner-sourced cohorts. The resulting
      segment mix is therefore strategically legible but not financially measurable.
    claimRefs: ["CU007", "CU010", "CU011"]
    tableRefs: ["TU001"]
  - id: "adoption-and-reference-proof"
    title: "Adoption trajectory and named proof"
    body: >-
      The available disclosures indicate meaningful adoption, with an important comparability
      caveat. Futurum reported more than 3,000 deployments and nearly one million users under
      management in 2021; Nerdio later stated that its platform served 15,000 customers and
      more than 5 million users across more than 50 countries in March 2025. Those figures
      differ in issuer, date, and metric definition, so they should not be treated as a cohort
      series or used to calculate growth. The named-customer evidence is also uneven. Nerdio
      listed major organizations and quoted Teleperformance describing a move from traditional
      VDI, while Recast quoted KNNS on faster, more consistent host delivery. These references
      go beyond logo display, but neither release supplies contract value, deployment scope,
      active-seat counts, or a quantified before-and-after outcome.
    claimRefs: ["CU001", "CU002", "CU003", "CU004", "CU005", "CU006", "CU008", "CU009"]
    tableRefs: ["TU002", "TU003"]
  - id: "durability-expansion-and-risk"
    title: "Durability, expansion, and customer risk"
    body: >-
      Expansion appears designed into Nerdio's partner and product motions, but observed
      retention economics are not disclosed. The company reported a 300% increase in deal
      registrations over an unspecified prior quarter, and its partner program explicitly
      combines implementation funding, lead distribution, and customer-success involvement on
      existing accounts. Recast separately framed its integration as supporting partner
      cross-sell and customer retention, an issuer claim rather than measured evidence. Nerdio
      also placed Customer Success under the chief revenue officer in January 2026, indicating
      organizational emphasis on post-sale outcomes. Against those signals, the assigned pool
      provides no NRR, GRR, churn, renewal-term, cohort, satisfaction, or customer-revenue
      concentration data. Built In's explicitly AI-generated and unreviewed page additionally
      flags pricing/value concerns for some AVD-focused scenarios; this is a weak adverse signal,
      not verified churn evidence.
    claimRefs: ["CU010", "CU011", "CU012", "CU013", "CU014", "CU015", "CU016"]
    figureRefs: ["FU001"]
