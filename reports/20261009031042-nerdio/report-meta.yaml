companyProfile:
  summary: >
    Nerdio is a Chicago-based enterprise SaaS company that provides automated management and optimization software for
    Microsoft Azure Virtual Desktop, Windows 365, Intune, and Microsoft 365. Founded in 2016 and spun out of Adar in
    2020, the company serves enterprise IT teams and managed service providers that need to operate Microsoft-centric
    end-user computing environments with less manual engineering overhead.
  founders:
    - name: Vadim Vladimirskiy
      role: Co-Founder and Chief Executive Officer
    - name: Joseph Landes
      role: Co-Founder and President
  headquarters: Chicago, Illinois, USA
  productSummary: >
    Subscription software that automates provisioning, scaling, policy governance, image management, monitoring, and
    cost optimization for Microsoft-centric end-user computing environments.
  customerFocus: >
    Enterprise IT teams and managed service providers operating Azure Virtual Desktop, Windows 365, Microsoft Intune,
    and related Microsoft cloud workloads.
  businessModel: |
