chapter:
  number: 1
  title: "Company Overview"
  summary: "Nerdio is an automated cloud and end-user computing management platform specializing in Microsoft Azure Virtual Desktop, Windows 365, and Intune for enterprises and managed service providers. Founded in 2016 and headquartered in Chicago, the company reached unicorn status following a $500 million Series C investment led by General Atlantic in March 2025 at a $1.0B+ to $1.2B valuation, scaling past $100 million in ARR while navigating severe single-ecosystem dependency on Microsoft."
sections:
  - id: "corporate-identity-and-mission"
    title: "Corporate Identity, Foundation, and Business Model"
    body: "Nerdio operates as an automated End-User Computing (EUC) management platform that automates the deployment, provisioning, scaling, policy governance, and cost optimization of Microsoft cloud environments. Headquartered in Chicago, Illinois, the company was established in 2016 by co-founders Vadim Vladimirskiy and Joseph Landes, later spinning out from IT-as-a-service provider Adar in 2020 as an independent SaaS entity. The company provides dual product offerings: Nerdio Manager for Enterprise (NME), which serves corporate IT teams seeking to manage Azure Virtual Desktop (AVD) and Windows 365 without dedicated Azure engineering overhead, and Nerdio Manager for MSP (NMM), tailored for managed service providers administering multi-tenant Microsoft environments. Nerdio monetizes via recurring software subscription licenses structured on a per-user or per-workload basis, delivering automated compute and storage right-sizing that can reduce customers' direct Azure virtual machine spending by up to 80%."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO008"
    tableRefs:
      - "TO001"
    figureRefs:
      - "FO001"
  - id: "leadership-and-governance"
    title: "Executive Leadership, Governance, and Microsoft Ties"
    body: "Nerdio is led by Co-Founder and Chief Executive Officer Vadim Vladimirskiy alongside Co-Founder Joseph Landes, who served as Chief Revenue Officer before transitioning to President in January 2026 to direct global partner strategy. The company's governance and technical strategy reflect deeply intertwined ties with Microsoft. In January 2026, Nerdio recruited Scott Manchester, a 25-year Microsoft veteran and principal creator of Azure Virtual Desktop and Windows 365, as Chief Product and Technology Officer (CPTO), while adding executive leaders across marketing, sales, and talent. Governance oversight includes General Atlantic managing director Aaron Goldman and principal Asher Hecht, who assumed board seats following the Series C transaction. While this personnel alignment provides unparalleled roadmap visibility into Microsoft's EUC architecture, it underscores material key-person dependence on the founders and an existential platform dependency on Microsoft's native packaging decisions."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO010"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-scale"
    title: "Capitalization Structure, Scale Trajectory, and Diligence Gaps"
    body: "Nerdio's capitalization history spans $625 million in total equity financing across three institutional rounds: an $8 million Series A in February 2020 led by MK Capital, a $117 million Series B in December 2022 led by Updata Partners, and a $500 million Series C growth equity round in March 2025 led by General Atlantic with participation from Lead Edge Capital and StepStone Group. Company statements document reaching $100 million in Annual Recurring Revenue (ARR) by June 2025 at an 85% year-over-year growth rate with profitable operations. Operational scale expanded from 15,000 customers and 5 million users in early 2025 to over 23,000 customers and 6.5 million users across 50 countries by 2026, with employee headcount growing 82% during 2025 to approximately 546 employees. Despite these achievements, Nerdio remains a private entity that keeps essential SaaS unit economics undisclosed; exact equity ownership percentages, liquidation preferences, gross margin, net revenue retention (NRR), and customer concentration figures remain material diligence gaps."
    claimRefs:
      - "CO004"
      - "CO008"
      - "CO009"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
    tableRefs:
      - "TO003"
