          label: '2. Operational Profitability: Profitable operations with zero debt prior to Series C'
          tone: positive
        - id: node-risk
          label: '3. Ecosystem Risk: Single-vendor Microsoft AVD/W365 concentration & opaque cap table'
          tone: warning
        - id: node-valuation
          label: '4. Valuation Discipline: $1.0B-$1.2B valuation at 10x-12x ARR provides fair entry'
          tone: neutral
