      - number: '1.3'
        title: Capitalization Structure, Scale Trajectory, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Nerdio's capitalization history spans $625 million in total equity financing across three institutional
              rounds: an $8 million Series A in February 2020 led by MK Capital, a $117 million Series B in December
              2022 led by Updata Partners, and a $500 million Series C growth equity round in March 2025 led by General
              Atlantic with participation from Lead Edge Capital and StepStone Group. Company statements document
              reaching $100 million in Annual Recurring Revenue (ARR) by June 2025 at an 85% year-over-year growth rate
              with profitable operations. Operational scale expanded from 15,000 customers and 5 million users in early
              2025 to over 23,000 customers and 6.5 million users across 50 countries by 2026, with employee headcount
              growing 82% during 2025 to approximately 546 employees. Despite these achievements, Nerdio remains a
              private entity that keeps essential SaaS unit economics undisclosed; exact equity ownership percentages,
              liquidation preferences, gross margin, net revenue retention (NRR), and customer concentration figures
              remain material diligence gaps.
