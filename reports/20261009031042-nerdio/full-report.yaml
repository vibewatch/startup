              - CI009
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI008
              - CI014
      - number: '4.2'
        title: Pricing and go-to-market economics
        blocks:
          - type: paragraph
            body: >-
              The retained sources establish a subscription model and a meaningful channel motion, but not list prices,
              realized prices, contract duration, discount depth, or partner take rates. Nerdio says partner-program
              tiers depend partly on partner revenue and product discounts, and it reported a 300% quarterly surge in
              deal registrations. These facts show active channel incentives and pipeline formation, not bookings,
              recognized revenue, CAC efficiency, or payback. No conversion rate or cohort economics are disclosed.
              Underwriting should therefore model channel leverage as a hypothesis until management supplies contract
              samples, discount waterfalls, sourced-pipeline conversion, implementation subsidies, renewal behavior, and
              direct-versus-partner acquisition costs.
            claimRefs:
              - CI001
              - CI008
              - CI009
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI008
              - CI009
      - number: '4.3'
        title: Cost structure and unit-economics gaps
        blocks:
          - type: paragraph
            body: >-
              Product breadth and operating scale are expanding: 2026 materials describe continued releases across
              real-time insights, Windows 365, hybrid Azure Virtual Desktop, global orchestration, and endpoint
              management, while Nerdio reported that employee headcount increased 82% during 2025. That combination
              points to engineering, customer-success, support, sales, and cloud-operating costs as likely margin
              drivers, but it does not quantify any expense line or cash burn. Company-reported profitability is
              encouraging but cannot substitute for gross margin, adjusted EBITDA reconciliation, operating cash flow,
              NRR, logo churn, CAC, LTV, or payback. The missing metrics prevent a reliable assessment of incremental
              margin and revenue quality.
            claimRefs:
              - CI002
              - CI005
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI013
              - CI014
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Nerdio announced a $500 million minority investment in March 2025 and said the proceeds would fund product
              innovation, geographic expansion, engineering, and customer success. The same release described the
              company as debt-free, but this remains company-issued evidence. Funding raised is not cash currently
              available: none of the reviewed sources discloses unrestricted cash, closing adjustments, secondary
              proceeds, operating burn, working-capital needs, or runway. Third-party databases also disagree on
              cumulative funding totals and round counts, while TechCrunch reported only that valuation was north of $1
              billion rather than a precise figure. The financial verdict is positive on growth signals but incomplete
              on revenue quality, margin durability, and forward capital sufficiency.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing is not runway
            body: >-
              The announced $500 million minority investment cannot be equated with unrestricted cash currently
              available. Primary closing, secondary proceeds, cash balance, burn, and runway are not disclosed in the
              retained evidence.
            calloutType: risk
            claimRefs:
              - CI011
              - CI014
          - type: callout
            title: Make financial data-room access a gating item
            body: >-
              Require audited statements, ARR and revenue reconciliations, cohort retention, gross margin, CAC/payback,
              cash, debt, and a downside runway model before assigning an investment-grade financial score.
            calloutType: recommendation
            claimRefs:
              - CI005
              - CI007
              - CI013
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Nerdio's product value is workflow compression for administrators operating Microsoft end-user computing
              estates. Independent reporting describes Nerdio Manager for Enterprise as a management layer for Azure
              Virtual Desktop and Windows applications that automates provisioning, application deployment, and
              demand-based scaling. Official documentation broadens that surface to image management, FSLogix profiles,
              application delivery, Intune, Windows 365, cost controls, reports, alerts, and AI-assisted features. The
              resulting product is best understood as an operations console and automation system spanning several
              Microsoft services, with separate enterprise and MSP surfaces. Public evidence supports broad capability
              coverage, but it does not disclose adoption or active-usage rates by module, so breadth should not be
              confused with proven depth across every SKU.
            claimRefs:
              - CE001
              - CE008
              - CE011
              - CE015
              - CE016
          - type: table
            tableRef: TE001
            claimRefs:
              - CE006
              - CE008
              - CE009
              - CE010
              - CE011
              - CE015
      - number: '5.2'
        title: Architecture and infrastructure dependencies
        blocks:
          - type: paragraph
            body: >-
              The enterprise edition is documented as a self-contained Azure Web App deployed with a dedicated
              application resource group and supporting Azure SQL, Key Vault, storage, Automation, Log Analytics, and
              Application Insights resources. It can address single-subscription, multi-subscription, and multi-tenant
              deployments through APIs, but depends on network reachability to domain and storage services. The service
              principal requires Graph API permissions plus Contributor access to managed resource groups, creating a
              meaningful privilege and change-control surface. This customer-hosted model may support data-location and
              control objectives, yet it also transfers architecture sizing, Azure limits, identity configuration, and
              portions of operational resilience to the customer's environment. The public materials do not
              independently validate the security outcomes of that model.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE007
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE007
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE009
              - CE016
      - number: '5.3'
        title: Deployment, integration, and operating model
        blocks:
          - type: paragraph
            body: >-
              Deployment is not a zero-touch SaaS onboarding flow. A practitioner walkthrough requires an Azure
              subscription owner, staged networking and DNS, and Global Administrator involvement at selected consent
              steps; it also warns that initial scripts may need to be rerun. Nerdio's GitHub integration adds
              extensibility by synchronizing scripted actions from Nerdio's or a customer's repository, with hourly
              automatic synchronization available and personal access tokens required for private repositories. Partner
              evidence shows that deployment design, governance, training, storage prerequisites, and policy tuning can
              require specialist help. These dependencies create a services and implementation burden, while the ability
              to version customer automation in GitHub provides a credible control point for repeatable operations.
            claimRefs:
              - CE009
              - CE010
              - CE012
              - CE013
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE009
              - CE010
              - CE012
              - CE013
              - CE016
      - number: '5.4'
        title: Maturity, differentiation, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Product maturity is most visible in the breadth of technical documentation and a monthly enterprise update
              cadence with public previews approximately one to two weeks before general availability. Differentiation
              appears to come from packaging Microsoft-cloud operations into opinionated automation: image staging,
              autoscaling, application delivery, profile storage, policy management, and an extensible scripted-action
              layer. That differentiation is constrained by platform concentration. The reference architecture follows
              Microsoft's 2,500-VM-per-subscription-per-region guidance, recommends no more than 100 session hosts per
              resource group for best performance, and calls for larger SQL and App Service tiers in bigger estates. No
              assigned independent source provides audited uptime, incident history, penetration-test results, security
              certifications, or comparative performance benchmarks, so reliability and security assurance remain
              unverified rather than negative.
            claimRefs:
              - CE006
              - CE007
              - CE009
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Security and reliability assurance remains evidence-limited
            body: >-
              Public documentation describes permissions, RBAC, logging, private-endpoint deployment, and staging, but
              the assigned pool contains no independent audit, certification, penetration test, status history, or
              incident record. This is a diligence gap, not evidence that controls are absent or ineffective.
            calloutType: risk
            claimRefs:
              - CE005
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying routes
        blocks:
          - type: paragraph
            body: >-
              Nerdio serves two related buyer systems rather than a single homogeneous customer base. MSPs use the
              platform to operate Microsoft cloud environments for their own clients and to build recurring service
              revenue, while enterprise IT teams use it to manage virtual desktops and endpoints in their own Microsoft
              environments. Independent reporting also describes large enterprises with thousands of desktops as a
              target segment. A further route runs through Microsoft-aligned channel partners: Nerdio's program offers
              deal protection, implementation incentives, and joint work with sales and customer success. These channels
              broaden distribution, but the public evidence does not allocate customer count, users, or revenue among
              MSP, enterprise, and partner-sourced cohorts. The resulting segment mix is therefore strategically legible
              but not financially measurable.
            claimRefs:
              - CU007
              - CU010
              - CU011
          - type: table
            tableRef: TU001
            claimRefs:
              - CU007
              - CU010
              - CU011
              - CU012
      - number: '6.2'
        title: Adoption trajectory and named proof
        blocks:
          - type: paragraph
            body: >-
              The available disclosures indicate meaningful adoption, with an important comparability caveat. Futurum
              reported more than 3,000 deployments and nearly one million users under management in 2021; Nerdio later
              stated that its platform served 15,000 customers and more than 5 million users across more than 50
              countries in March 2025. Those figures differ in issuer, date, and metric definition, so they should not
              be treated as a cohort series or used to calculate growth. The named-customer evidence is also uneven.
              Nerdio listed major organizations and quoted Teleperformance describing a move from traditional VDI, while
              Recast quoted KNNS on faster, more consistent host delivery. These references go beyond logo display, but
              neither release supplies contract value, deployment scope, active-seat counts, or a quantified
              before-and-after outcome.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
