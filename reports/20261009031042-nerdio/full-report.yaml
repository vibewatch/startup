chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Nerdio operates as an automated End-User Computing (EUC) management platform that automates the
              deployment, provisioning, scaling, policy governance, and cost optimization of Microsoft cloud
              environments. Headquartered in Chicago, Illinois, the company was established in 2016 by co-founders Vadim
              Vladimirskiy and Joseph Landes, later spinning out from IT-as-a-service provider Adar in 2020 as an
              independent SaaS entity. The company provides dual product offerings: Nerdio Manager for Enterprise (NME),
              which serves corporate IT teams seeking to manage Azure Virtual Desktop (AVD) and Windows 365 without
              dedicated Azure engineering overhead, and Nerdio Manager for MSP (NMM), tailored for managed service
              providers administering multi-tenant Microsoft environments. Nerdio monetizes via recurring software
              subscription licenses structured on a per-user or per-workload basis, delivering automated compute and
              storage right-sizing that can reduce customers' direct Azure virtual machine spending by up to 80%.
