      - number: '1.2'
        title: Executive Leadership, Governance, and Microsoft Ties
        blocks:
          - type: paragraph
            body: >-
              Nerdio is led by Co-Founder and Chief Executive Officer Vadim Vladimirskiy alongside Co-Founder Joseph
              Landes, who served as Chief Revenue Officer before transitioning to President in January 2026 to direct
              global partner strategy. The company's governance and technical strategy reflect deeply intertwined ties
              with Microsoft. In January 2026, Nerdio recruited Scott Manchester, a 25-year Microsoft veteran and
              principal creator of Azure Virtual Desktop and Windows 365, as Chief Product and Technology Officer
              (CPTO), while adding executive leaders across marketing, sales, and talent. Governance oversight includes
              General Atlantic managing director Aaron Goldman and principal Asher Hecht, who assumed board seats
              following the Series C transaction. While this personnel alignment provides unparalleled roadmap
              visibility into Microsoft's EUC architecture, it underscores material key-person dependence on the
              founders and an existential platform dependency on Microsoft's native packaging decisions.
            claimRefs:
