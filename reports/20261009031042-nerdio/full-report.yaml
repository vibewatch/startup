        - Detailed audited income statement and cash flow proof confirming sustained positive free cash flow
      - - Channel Moat
        - Over 300% surge in enterprise deal registrations and Microsoft Partner of the Year standing
        - Microsoft co-sell channel can pivot priorities to native tooling without contractual protection
        - Long-term OEM licensing agreement or formal joint go-to-market agreement with Microsoft
    notes: >-
      Evaluation of structural investment pillars against countervailing downside risks; what would change the view
      defines concrete due diligence test criteria.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating Assumptions
      - Terminal ARR & Multiple
      - Valuation & Return
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - 50%+ ARR CAGR; global enterprise adoption; NRR > 125%; sustained 25% FCF margin
        - $280M-$320M ARR @ 12.0x-14.0x
        - $3.5B-$4.5B valuation (3.5x-4.5x MOIC)
        - Multiple compression across high-growth software; enterprise sales elongation
        - 25% (requires flawless international GTM execution and enterprise migration momentum)
      - - Base Case
        - 35% ARR CAGR; stable MSP base; NRR ~ 115%; 15%-20% operating margin
        - $200M-$230M ARR @ 8.0x-10.0x
        - $1.8B-$2.3B valuation (1.8x-2.3x MOIC)
        - Moderate enterprise churn; slower Windows 365 migration adoption by SMBs
        - 55% (supported by current category tailwinds, profitability, and General Atlantic backing)
      - - Bear Case
        - Growth decelerates to <15% ARR; margin compression from sales ramp; Microsoft native tools
        - $130M-$150M ARR @ 4.0x-6.0x
        - $520M-$900M valuation (0.5x-0.9x MOIC)
        - Microsoft bundles competing AVD automation; liquidation preference overhang impairs common
        - 20% (heightened by single-vendor Microsoft dependency and unverified contract protections)
    notes: >-
      Modeled over a 3-5 year investment horizon from 2026 baseline of $100M ARR; valuation ranges assume fully diluted
      shares and enterprise value parity.
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV008
      - CV010
      - CV012
