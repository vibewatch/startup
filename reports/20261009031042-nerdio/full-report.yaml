      - number: '6.3'
        title: Durability, expansion, and customer risk
        blocks:
          - type: paragraph
            body: >-
              Expansion appears designed into Nerdio's partner and product motions, but observed retention economics are
              not disclosed. The company reported a 300% increase in deal registrations over an unspecified prior
              quarter, and its partner program explicitly combines implementation funding, lead distribution, and
              customer-success involvement on existing accounts. Recast separately framed its integration as supporting
              partner cross-sell and customer retention, an issuer claim rather than measured evidence. Nerdio also
              placed Customer Success under the chief revenue officer in January 2026, indicating organizational
              emphasis on post-sale outcomes. Against those signals, the assigned pool provides no NRR, GRR, churn,
              renewal-term, cohort, satisfaction, or customer-revenue concentration data. Built In's explicitly
              AI-generated and unreviewed page additionally flags pricing/value concerns for some AVD-focused scenarios;
              this is a weak adverse signal, not verified churn evidence.
