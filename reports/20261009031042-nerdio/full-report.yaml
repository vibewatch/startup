  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Nerdio's customer-hosted management plane layers user workflows over Azure identity, orchestration, data,
      automation, and observability services.
    data:
      layers:
        - label: Management experience
          detail: >-
            Nerdio web console for enterprise or MSP administrators managing AVD, Windows 365, Intune, applications,
            reports, and alerts.
        - label: Identity and authorization
          detail: >-
            Entra enterprise application with Graph API permissions and Contributor access to managed Azure resource
            groups.
        - label: Orchestration services
          detail: >-
            API-driven automation for host pools, session hosts, images, applications, profiles, autoscaling, and
            customer runbooks.
        - label: Application data and secrets
          detail: >-
            Dedicated Azure SQL, Key Vault, and storage resources supporting application state, encryption keys,
            scripts, and temporary VHDs.
        - label: Integration surface
          detail: >-
            Microsoft services and third-party integrations plus GitHub-synchronized scripted actions and customer-owned
            repositories.
        - label: Observability and operations
          detail: >-
            Log Analytics, Application Insights, activity reporting, notification conditions, update controls, and
            customer monitoring workflows.
    approximationNotes: >-
      Conceptual layer ordering is analyst-authored from the documented component list; it is not a network or data-flow
      diagram.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE009
      - CE016
