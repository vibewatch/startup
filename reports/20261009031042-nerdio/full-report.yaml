              - CV008
              - CV010
      - number: '8.2'
        title: Capital Structure, Series C Valuation, and Ownership Overhang
        blocks:
          - type: paragraph
            body: >-
              Nerdio has raised $625 million in cumulative institutional funding across three primary equity rounds
              since spinning out of IT-as-a-service provider Adar in 2020: an $8 million Series A in February 2020 led
              by MK Capital, a $117 million Series B in December 2022 led by Updata Partners, and a $500 million Series
              C in March 2025 led by General Atlantic with participation from StepStone Group and Lead Edge Capital
              [CV001, CV005, CV006]. The Series C investment quadrupled Nerdio's post-money valuation in two years to
              between $1.0 billion and $1.2 billion, implying a 10.0x to 12.0x revenue multiple on trailing $100 million
              ARR [CV001, CV003, CV005]. As part of the transaction, General Atlantic secured two board seats occupied
              by Aaron Goldman and Asher Hecht, while co-founders Vadim Vladimirskiy and Joseph Landes retain
              significant equity ownership alongside prior venture backers [CV001, CV006]. The sheer size of the $500
              million cash injection relative to a $1.0B–$1.2B valuation introduces potential structural overhang: if
              structured with senior liquidation preferences or guaranteed return hurdles, common equity and junior
              holders could face distribution compression in suboptimal liquidity outcomes [CV001, CV006, CV010].
              Furthermore, public disclosures omit exact cap table stakes, governance voting controls, and SaaS unit
              economics such as net revenue retention (NRR) and gross margins, leaving key financial parameters
              unresolved [CV010, CV011].
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV010
              - CV011
      - number: '8.3'
        title: Scenario Analysis, Peer Multiples, and Diligence Kill Triggers
        blocks:
          - type: paragraph
            body: >-
              Valuation underwriting requires evaluating Nerdio across bull, base, and bear operating cases against
              comparable public and private software peers. In the base case, Nerdio compounds ARR at 35%–45% over three
              years, sustaining 20%+ operating margins and maintaining enterprise net expansion, supporting an exit
              valuation of $1.8B–$2.5B at 8.0x–10.0x ARR [CV003, CV005, CV008, CV012]. The bull case models accelerated
              enterprise displacement of legacy Citrix/VMware environments, 50%+ ARR growth, and international expansion
              across APAC and EMEA, unlocking an IPO or strategic exit at $3.0B+ (12.0x–14.0x ARR) [CV001, CV003,
              CV008]. The bear case reflects downside multiple compression to 4.0x–6.0x ARR ($500M–$800M valuation)
              driven by Microsoft native feature encroachment into Nerdio Manager, decelerating ARR growth below 15%, or
              customer concentration churn [CV003, CV005, CV010]. Private and public trading benchmarks demonstrate wide
              multiple variance: private workflow and cloud peers trade between 10x and 16x revenue (e.g. Vention at
              16.4x), whereas slower-growth specialized engineering and software firms trade at 3.6x to 6.4x revenue
              (e.g. Imdex at 3.6x, Zwsoft at 6.4x) [CV005]. Investment thesis-break kill triggers include: (1) Microsoft
              releasing native Intune/AVD cost-optimization and autoscale parity at zero marginal license cost; (2)
              deceleration of ARR growth below 20% in two consecutive quarters; (3) senior executive defection following
              the 2026 C-suite reorganization; and (4) discovery of senior liquidation preferences exceeding 1x
              non-participating preferred terms [CV003, CV006, CV008, CV010].
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV008
              - CV010
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV008
              - CV010
              - CV012
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Diligence Requirement on Series C Preference Terms
            body: >-
              Because General Atlantic injected $500 million into Nerdio at a $1.0B+ valuation, investors must verify
              the liquidation preference structure before committing capital. A 1x non-participating preferred structure
              preserves common equity upside in mid-tier exits, whereas participating preferred terms or guaranteed
              minimum IRR hurdles would severely impair common share realizations in sub-$1.5B exit scenarios.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV010
          - type: callout
            title: Existential Microsoft Platform Dependency
            body: >-
              Nerdio's software suite generates 100% of its utility by optimizing Microsoft technologies (Azure Virtual
              Desktop, Windows 365, and Microsoft Intune), while influencing over $350 million in Microsoft revenue. Any
              shift in Microsoft's strategic direction—such as native feature parity within Azure Portal or restrictive
              API licensing—constitutes a primary thesis-break trigger.
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
              - CV010
