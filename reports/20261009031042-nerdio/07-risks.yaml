    title: Existential Single-Vendor Risk on Microsoft Ecosystem
    body: |
      Nerdio's software suite lacks architectural portability beyond Microsoft Azure. Any strategic pivot by Microsoft—whether introducing competing multi-tenant management features in native Intune or altering partner margin incentives—directly impairs Nerdio's core business model.
    claimRefs:
      - CR002
      - CR003
      - CR004
