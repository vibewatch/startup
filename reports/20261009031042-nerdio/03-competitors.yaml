    rows:
      - ["Nerdio", "Third-party commentary calls pricing transparent but not always cheap; no comparable list price retained", "Management and automation over Microsoft cloud services", "Realized subscription price, tier thresholds, services, discounts, renewal uplifts", "Request contract cohorts and normalized per-user or per-workload TCO"]
      - ["Microsoft native / Windows 365", "Pricing is visible but full economics vary with deployment and licensing choices", "Underlying cloud, identity, endpoint, and Cloud PC services", "Architecture-specific traffic, resilience, administration, and support costs", "Model the existing Microsoft agreement before assuming vendor removal saves money"]
      - ["Workspot", "Flat-rate per-user pricing is reported; cost can rise materially at scale", "DaaS delivery and support proposition", "Actual quote, workload assumptions, overages, and migration services", "Useful pricing contrast, but not enough for a realized-cost comparison"]
      - ["Citrix", "Packaging is described as powerful but difficult to compare apples-to-apples", "Mature VDI feature depth and enterprise delivery", "SKU mix, discounts, support tier, implementation, and renewal terms", "Require a bill-of-materials comparison rather than headline pricing"]
      - ["Azure Local infrastructure", "$10 per physical core per month base fee and $23.30 per core per month Windows Server guest add-on are stated by Nerdio", "Azure Local host software and optional unlimited Windows guest rights", "Nerdio subscription, hardware, networking, support, and eligibility for Azure Hybrid Benefit", "Do not present infrastructure list prices as Nerdio software pricing"]
    notes: "Prices are public list signals with different units and scopes; they are not realized customer prices and cannot be summed into a comparable TCO without architecture and contract data."
    claimRefs: ["CP009", "CP010", "CP011", "CP012"]
figures:
  - id: "FP001"
    title: "Ordinal positioning: Microsoft alignment versus operating-layer abstraction"
    type: "quadrant"
    summary: "Nerdio scores highly on both Microsoft alignment and abstraction, while substitutes trade platform fit, control, and operational burden differently."
    data:
      xAxis:
        label: "Microsoft ecosystem alignment"
        min: 1
        max: 5
      yAxis:
        label: "Operating-layer abstraction"
        min: 1
        max: 5
      points:
        - label: "Nerdio"
          x: 5
          y: 5
          rationale: "Microsoft-centered automation layer across enterprise, MSP, and emerging hybrid workflows."
        - label: "Microsoft native"
          x: 5
          y: 3
          rationale: "Maximum native alignment, but buyers still integrate multiple management surfaces."
        - label: "Windows 365"
          x: 5
          y: 4
          rationale: "Cloud PC abstraction is high, with scope tied to Microsoft's service model."
        - label: "Citrix"
          x: 3
          y: 4
          rationale: "Broad delivery layer with strong feature depth but less singular Microsoft focus."
        - label: "Workspot"
          x: 3
          y: 4
          rationale: "DaaS simplicity is emphasized; integration depth is less established in this pool."
        - label: "Internal build"
          x: 4
          y: 1
          rationale: "Can align tightly to Microsoft, but leaves abstraction and lifecycle work with the buyer."
    approximationNotes: "Scores are analyst-authored ordinal assessments from the cited capability evidence, not measured benchmarks; one-point differences should not be interpreted as quantitative performance gaps."
    claimRefs: ["CP005", "CP013", "CP014", "CP015", "CP016"]
callouts:
  - calloutType: "risk"
    title: "Platform concentration is the central competitive risk"
    body: >-
      Nerdio can deepen customer workflow lock-in while remaining dependent on Microsoft for
      the underlying platform, licensing, and product direction. Diligence should test whether
      customers pay for durable automation value or mainly for gaps Microsoft could narrow.
    claimRefs: ["CP003", "CP005", "CP014"]
