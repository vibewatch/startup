      - number: '7.2'
        title: 架构脆弱性、运营 SLA 缺口与安全认证
        blocks:
          - type: paragraph
            body: >
              从架构看，Nerdio Manager for Enterprise（NME）以 Azure 打包应用的形式运行在客户自己的 Azure 租户内，而不是外部多租户 SaaS
              控制平面。这种客户租户模式在数据驻留和零信任隔离上具有显著安全优势；Veracode Verified Standard 状态也表明静态分析未在一方代码中发现 Very High 缺陷。但它同样带来直接受客户
              Azure 环境配置、身份访问管理和区域云可用性影响的运营故障模式。


              独立基准分析显示，Nerdio 公开可验证的正常运行时间 SLA 有限，除标准供应商声明外也缺少广泛的公开合规认证。Nerdio 可以帮助组织监控 AVD
              会话主机指标和日志传输，但共享责任模式把基础设施韧性、备份和网络连接明确交给客户与 MSP
              团队。此外，终端用户反馈指出，日常管理虽然更顺畅，但复杂的初始设置、高级配置学习曲线以及高延迟连接下的会话退化，仍带来持续的运营和支持障碍。
            claimRefs:
              - CR005
