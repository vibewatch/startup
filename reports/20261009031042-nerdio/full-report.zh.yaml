  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开进展
        blocks:
          - type: paragraph
            body: >-
              Nerdio 似乎通过面向企业 IT 团队和托管服务商的 B2B 订阅平台变现，采用直销和伙伴协助两种市场通路。公开进展从方向上看很强：公司 2024 年公告称 ARR 翻倍，2025 年 3 月融资公告称
              ARR 年同比增长超过 85%，同时实现盈利增长。这些是公司声称的情况，而非经审计的财务报表。Multiples.vc 将 2025 年 3 月的“收入”记为 $100
              million，但其方法说明称该字段可能代表收入或 ARR，也可能是运行率或过去 12 个月数据。因此，这个数字不能视为 GAAP 收入、现金回款或干净的估值分母。
