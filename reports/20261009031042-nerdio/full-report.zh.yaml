      - number: '1.2'
        title: 管理层、治理与 Microsoft 关系
        blocks:
          - type: paragraph
            body: >-
              Nerdio 由联合创始人兼首席执行官 Vadim Vladimirskiy 领导；联合创始人 Joseph Landes 曾任首席营收官，2026 年 1
              月转任总裁，负责全球合作伙伴战略。公司的治理和技术战略都深度嵌入 Microsoft 生态。2026 年 1 月，Nerdio 聘请在 Microsoft 任职 25 年、Azure Virtual
              Desktop 和 Windows 365 主要创始架构师之一的 Scott Manchester 担任首席产品与技术官（CPTO），同时补充营销、销售和人才管理高管。General Atlantic 董事总经理
              Aaron Goldman 和负责人 Asher Hecht 在 Series C 交易后进入董事会。这样的人员配置带来对 Microsoft EUC
              架构和产品路线的超强可见度，但也凸显出公司对创始人的关键人物依赖，以及对 Microsoft 原生产品打包决策的生存级平台依赖。
