  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、成立背景与商业模式
        blocks:
          - type: paragraph
            body: >-
              Nerdio 是一个自动化终端用户计算（EUC）管理平台，自动处理 Microsoft 云环境的部署、配置、扩缩容、策略治理和成本优化。公司总部位于伊利诺伊州芝加哥，由 Vadim Vladimirskiy 和
              Joseph Landes 于 2016 年创立，2020 年从 IT-as-a-service 服务商 Adar 分拆为独立 SaaS 公司。公司提供两条产品线：Nerdio Manager for
              Enterprise（NME）面向需要管理 Azure Virtual Desktop（AVD）和 Windows 365、但不想配备专门 Azure 工程团队的企业 IT 部门；Nerdio Manager
              for MSP（NMM）面向管理多租户 Microsoft 环境的托管服务商。Nerdio 按用户或工作负载收取经常性软件订阅费，并自动调整计算与存储规格，最多可将客户直接承担的 Azure 虚拟机支出降低
              80%。
