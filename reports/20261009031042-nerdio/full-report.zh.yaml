  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 将规模、运营盈利、平台集中风险和估值倍数连接到可执行买入建议的决策路径。
    data:
      nodes:
        - id: node-scale
          label: 1. 规模与增长：ARR $100M+，同比增长 85%+，拥有 5M+ 用户和 15k+ 客户
          tone: positive
        - id: node-profit
          label: 2. 运营盈利：Series C 前已实现盈利运营且零债务
          tone: positive
        - id: node-risk
          label: 3. 生态风险：单一厂商 Microsoft AVD/W365 集中度高，股权结构表不透明
          tone: warning
        - id: node-valuation
          label: 4. 估值纪律：$1.0B-$1.2B 估值对应 10x-12x ARR，提供合理入场点
          tone: neutral
        - id: node-diligence
          label: 5. 尽调缺口：核实 Series C 清算优先权及经审计 NRR / 利润率指标
          tone: warning
        - id: node-decision
          label: 6. 建议：高风险评级下买入，前提是完成优先权尽调
          tone: positive
      edges:
        - from: node-scale
          to: node-profit
          label: 验证单位经济模型
        - from: node-profit
          to: node-risk
          label: 与风险暴露平衡
        - from: node-risk
          to: node-valuation
          label: 要求估值安全边际
        - from: node-valuation
          to: node-diligence
          label: 确立入场倍数
        - from: node-diligence
          to: node-decision
          label: 确认风险调整后买入
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV007
      - CV008
      - CV010
