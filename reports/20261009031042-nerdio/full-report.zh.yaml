      - number: '2.3'
        title: 买方分层、经济触发因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              Nerdio 的采用者分为两类：运营多租户环境的托管服务商，以及管理集中式云基础设施的企业 IT 团队。对 MSP 而言，Nerdio Manager for MSP
              提供多租户编排、自动客户上线、白标报告和按租户追踪利润率，让服务商无需组建大规模认证云工程师团队，也能交付可盈利的 Azure 云业务。对企业 IT 总监和基础设施架构师而言，Nerdio Manager for
              Enterprise 直接部署在客户自己的 Azure 租户内，保持数据治理和安全合规边界。采用 Nerdio 的首要经济理由是可验证的成本下降：动态自动扩缩容算法会关闭闲置虚拟机主机，并在非高峰时段将附加 OS
              磁盘从 Premium SSD 切换为 Standard HDD/SSD，使基础设施计算与存储成本降低 55% 至 75%，日常管理时间减少
              50%。但采用仍受多重约束：从业者反对涨价和每月最低消费门槛、熟练管理员可以直接使用 Azure 原生脚本，以及对 Microsoft 生态的生存级锁定。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM010
              - CM012
              - CM013
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: Azure 节省悖论
            body: >-
              Nerdio 的核心价值主张，是通过激进的自动扩缩容和存储层级切换消除 Microsoft Azure 基础设施浪费，据报道可将客户云基础设施成本降低 55% 至 75%。这虽然减少了即时 Azure
              计算消耗，但 Microsoft 等超大规模云厂商仍会支持并联合销售该平台，因为成本控制能稳定客户部署、提高留存，并加速企业从传统本地虚拟化迁移到 Azure。
            calloutType: insight
            claimRefs:
              - CM002
              - CM011
              - CM014
          - type: callout
            title: 平台排他性与生态脆弱性
            body: >-
              Nerdio 的商业模式根本上绑定 Microsoft Azure 和 Windows 虚拟桌面工作负载。跨 AWS WorkSpaces、Google Cloud 或非 Windows
              终端部署多云虚拟桌面的组织，无法用 Nerdio 覆盖整个设备群。此外，随着 Microsoft 逐步增强原生 Azure Virtual Desktop 管理能力，Nerdio 必须持续拓展 Microsoft
              365、Intune 和 AI agent 连接器等相邻能力，才能维持溢价。
            calloutType: risk
            claimRefs:
              - CM003
              - CM012
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 买方可以选择平台、管理层，或自行组装
        blocks:
          - type: paragraph
            body: >-
              竞争集合不只是同类软件供应商名单。独立目录将 Microsoft、Windows 365、Workspot、Citrix、VMware、Nutanix 以及其他 DaaS 或 VDI 提供商列在 Nerdio
              周边；内部团队也可以自行组合 Azure Virtual Desktop、Intune、脚本和运营流程，不使用第三方管理层。因此，Nerdio 最清晰的角色不是替代 Microsoft
              的计算或身份服务，而是减少运营这些服务所需的投入。买方有多条路径：采用 Nerdio 作为抽象层、购买更完整的传统 VDI 套件、选择更简单的 DaaS
              服务、扩展现有混合基础设施平台，或承担内部自建的人员与维护负担。公开比较网站有助于识别竞争集合，但不是独立技术基准，也不能证明某个选项在所有工作负载上都胜出。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
