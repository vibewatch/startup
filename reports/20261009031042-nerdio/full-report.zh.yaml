          'y': 3
          rationale: Maximum native alignment, but buyers still integrate multiple management surfaces.
        - label: Windows 365
          x: 5
          'y': 4
          rationale: Cloud PC abstraction is high, with scope tied to Microsoft's service model.
        - label: Citrix
          x: 3
          'y': 4
          rationale: Broad delivery layer with strong feature depth but less singular Microsoft focus.
        - label: Workspot
          x: 3
          'y': 4
          rationale: DaaS simplicity is emphasized; integration depth is less established in this pool.
        - label: 内部自建
          x: 4
          'y': 1
          rationale: Can align tightly to Microsoft, but leaves abstraction and lifecycle work with the buyer.
    approximationNotes: 分数是分析师根据引用的能力证据编制的序位评估，并非实测基准；相差一分不应解读为量化性能差距。
    claimRefs:
      - CP005
      - CP013
      - CP014
      - CP015
      - CP016
  - id: FI001
    title: 有公开证据支撑的收入模型桥接
    type: flow
    summary: 已披露的桥接能够落到经常性收入，但定价、毛利率和现金转化仍不在公开证据范围内。
    data:
      nodes:
        - id: buyers
          label: 企业和 MSP 买家
          detail: 留存材料中识别出两种 B2B 客户路径。
        - id: acquisition
          label: 直接获客与伙伴协助获客
          detail: 交易登记和伙伴激励支撑渠道路径。
        - id: contract
          label: 订阅合同
          detail: 定价单位、期限、实际折扣和合同金额均未披露。
        - id: delivery
          label: 产品发布与支持
          detail: 持续的工程和客户成功活动维持服务运转。
        - id: arr
          label: 经常性收入 / ARR
          detail: 已披露增长，但公开收入基数的会计标签含义不明。
        - id: cash
          label: 毛利与现金转化
          detail: 毛利率、CAC 回收期、运营现金流、烧钱速度和现金跑道均不可得。
      edges:
        - source: buyers
          target: acquisition
        - source: acquisition
          target: contract
        - source: contract
          target: delivery
        - source: delivery
          target: arr
        - source: arr
          target: cash
    approximationNotes: 这是定性机制图，不是量化瀑布图；未推断转化率或利润率。
    claimRefs:
      - CI001
      - CI002
      - CI007
      - CI008
      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Nerdio 的客户托管管理平面将用户工作流叠加在 Azure 身份、编排、数据、自动化和可观测性服务之上。
    data:
      layers:
        - label: 管理体验
          detail: 面向企业或 MSP 管理员的 Nerdio Web 控制台，用于管理 AVD、Windows 365、Intune、应用、报告和告警。
        - label: 身份与授权
          detail: 具备 Graph API 权限的 Entra 企业应用，并拥有受管 Azure 资源组的 Contributor 访问权限。
        - label: 编排服务
          detail: 由 API 驱动的自动化，覆盖主机池、会话主机、镜像、应用、配置文件、自动扩缩容和客户运行手册。
        - label: 应用数据与密钥
          detail: 专用 Azure SQL、Key Vault 和存储资源，承载应用状态、加密密钥、脚本和临时 VHD。
        - label: 集成层
          detail: Microsoft 服务和第三方集成，加上与 GitHub 同步的脚本操作及客户自有代码库。
        - label: 可观测性与运营
          detail: Log Analytics、Application Insights、活动报告、通知条件、更新控制和客户监控工作流。
    approximationNotes: 概念层级顺序由分析师根据已记录的组件清单编制，不是网络图或数据流图。
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE009
      - CE016
  - id: FU001
    title: 客户采用与扩张路径
    type: journey-map
    summary: 有证据支撑的触点展示以 Microsoft 为中心的需求如何经过部署、客户成功、伙伴扩张和续约，但持续性指标仍缺失。
    data:
      nodes:
        - id: need
          label: Microsoft 云复杂度
          detail: 企业和 MSP 团队寻求更简单的 AVD、Windows 365 和混合管理。
          touchpoints:
            - Enterprise IT
            - MSP technical teams
            - Legacy VDI migration
        - id: route
          label: 直接或伙伴路径
          detail: 客户直接接触 Nerdio，或通过与 Microsoft 协同的实施伙伴接入。
          touchpoints:
            - Deal registration
            - Co-selling
            - Partner implementation
        - id: deploy
          label: 部署
          detail: 自动化支持虚拟桌面配置和应用交付。
          touchpoints:
            - AVD host rollout
            - Windows 365
            - Hybrid environments
        - id: operate
          label: 运营使用
          detail: 具名参考资料描述了集中管理和更一致的交付。
          touchpoints:
            - Teleperformance
            - KNNS
            - Customer feedback
        - id: success
          label: 客户成功
          detail: 客户成功团队与收入负责人协同，并与伙伴共同经营现有账户。
          touchpoints:
            - Post-sale engagement
            - Customer outcomes
            - Lead distribution
        - id: expand
          label: 扩张或续约
          detail: 伙伴交叉销售和留存是目标结果，但实际留存指标未披露。
          touchpoints:
            - Cross-sell
            - Existing-account growth
            - Renewal evidence gap
    approximationNotes: 该序列描述已记录的商业触点，不代表实测转化率或统一客户队列。
    claimRefs:
      - CU007
      - CU009
      - CU011
      - CU012
      - CU013
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 按可能性和剩余严重度评估主要架构、运营、财务和伙伴风险的矩阵。
    data:
      columns:
        - 可能性
        - 剩余严重度
        - 风险类别
        - 缓解评级
      rows:
        - label: Microsoft 原生竞争与侵蚀
          values:
            - 高
            - 关键
            - 伙伴与生态
            - 中
        - label: 单云平台集中度（Azure）
          values:
            - 高
            - 高
            - 战略架构
            - 低
        - label: 私有财务不透明（NRR / 利润率）
          values:
            - 高
            - 高
            - 财务评估
            - 低
        - label: 缺少公开企业 SLA
          values:
            - 中
            - 中等
            - 运营合同
            - 中
        - label: 客户租户配置与停机暴露
          values:
            - 中
            - 中等
            - 安全与可靠性
            - 高
        - label: 快速扩员与国际化规模复杂度
          values:
            - 中
            - 中等
            - 执行与治理
            - 高
    notes: 对风险暴露的定性评估，映射其可能性、剩余严重度和缓解成熟度。
    claimRefs:
