  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、分类与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Nerdio 的可服务市场位于企业虚拟化和桌面即服务（DaaS）软件领域，重点是 Microsoft Azure Virtual Desktop（AVD）和 Windows 365
              环境的云原生管理与成本优化层。过去，终端用户计算（EUC）高度依赖 Citrix CVAD 或 VMware Horizon（现为
              Omnissa）等复杂的本地虚拟桌面基础设施（VDI）堆栈，需要专门的控制平面基础设施、高昂的硬件摊销和专业运营工程。企业工作负载转向公有云后，Microsoft 通过 AVD 建立原生托管控制平面，并通过
              Windows 365 的 Cloud PC SaaS 模式提供服务。但原生 Azure 管理工具仍让企业和托管服务商面临明显运营摩擦：手动扩展会话主机、复杂的镜像生命周期维护、FSLogix
              配置文件容器配置，以及波动的云计算支出。Nerdio 将自身商业边界严格定义为专业自动化与编排控制平面，抽象底层 Azure 管理任务，但不提供底层计算、存储或虚拟机监控程序许可证。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
      - number: '2.2'
        title: 市场规模、扩张动力与规模口径差异
        blocks:
          - type: paragraph
            body: >-
              评估 Nerdio 的市场机会，需要将宏观预测与企业在云管理软件上的有限自下而上支出对应起来。Nerdio 融资沟通中引用的行业分析师预测称，到 2037 年全球 DaaS 市场将超过 $60
              billion，企业以灵活、安全的数字工作空间替代传统硬件，年增速约 18%。但这个宏观数字代表终端用户工作空间的总支出，包含公有云基础设施、Microsoft Windows 365
              订阅许可证、身份治理、网络和外包 IT 专业服务。专用第三方管理软件的可服务市场（SAM）只是其中一个聚焦子市场，主要通过每用户每月 $6 至 $10 的许可费，或每月最低 $1,000
              的平台承诺变现。Nerdio 已在这一细分领域取得可观份额：ARR 超过 $100 million，年同比增长超过 85%，服务 15,000 家客户组织的 5 million
              多名用户。可获得市场（SOM）还会受到 Microsoft 原生功能快速迭代、客户自研自动化脚本以及 Hydra 等第三方工具的进一步限制。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
