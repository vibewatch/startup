      - number: '1.4'
        title: 展示项
        blocks:
          - type: callout
            title: 深度 Microsoft 生态联合工程的双刃剑
            body: >-
              Nerdio 在五年内达到 $100M+ ARR 和独角兽估值，直接受益于其与 Microsoft 无可比拟的产品协同，Scott Manchester
              的加入进一步印证了这一点。然而，这种深度绑定也带来结构性脆弱性：Nerdio 的全部收入引擎，都建立在 Microsoft 愿意把高级 EUC 管理和多租户工具留给合作伙伴生态方案，而不是将其捆绑进
              Windows 和 Azure 基础许可证之上的。
            calloutType: insight
            claimRefs:
              - CO001
              - CO006
              - CO015
          - type: callout
            title: 单位经济性与投资人流动性权利的不透明
            body: >-
              Nerdio 对外公布 ARR 和盈利等收入顶线信息，却对毛利率、净收入留存率和客户集中度保持严格的私有公司不透明。此外，General Atlantic 以 $1.0B+ 至 $1.2B 估值向公司投入
              $500 million 少数股权资金，暗示可能存在较高的清算优先权和治理条款，在下行或中等规模退出场景中会显著压缩普通股分配。
