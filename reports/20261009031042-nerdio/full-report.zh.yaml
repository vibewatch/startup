      - number: '3.2'
        title: 自动化与渠道触达构成 Nerdio 的差异化，但都在 Microsoft 轨道内
        blocks:
          - type: paragraph
            body: >-
              Nerdio 将自身价值描述为覆盖 Azure Virtual Desktop、Windows 365、Intune、Microsoft 365
              及新型混合基础设施的配置、自动扩缩容、镜像管理、监控和成本可见性层。对于原本需要维护脚本和多个原生控制台的 IT
              团队，这种运营聚焦可能很重要；产品同时服务企业部门和托管服务商。分销也是价值主张的一部分：Nerdio 报告了分级合作伙伴权益、资助实施、交易保护、线索分发，以及交易注册量季度增长
              300%。这些是公司发布的指标，而非经审计的市场份额证据。更重要的是，同一个 Microsoft 绑定既减少实施摩擦，也集中平台依赖：Microsoft 控制底层服务、核心许可和大部分市场通路。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP008
              - CP013
              - CP014
      - number: '3.3'
        title: 公开定价证据不足以证明成本优势
        blocks:
          - type: paragraph
            body: >-
              公开记录支持对定价模式的观察，却不足以做标准化总成本比较。第三方目录称 Nerdio 定价透明但未必便宜，将 Workspot 描述为按用户收取固定费率，并称 Microsoft 和 Citrix
              的打包方式难以比较。Nerdio 自己的 Azure Local 页面公布基础设施价格，营销材料声称自动化能带来显著节省，但两者都没有披露 Nerdio
              实际订阅价格、折扣、实施费或支持经济性。因此，迁移决策必须计入迁移人力、再培训、镜像与策略转换、支持边界，以及保留 Microsoft 或 Nutanix
              投资的价值。按工作负载组进行多平台部署在技术上可行，但运营碎片化可能抵消部分韧性收益。正确的尽调结论是存在定价缺口，而不是给出精确节省估算。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: 壁垒来自工作流与生态执行，而非拥有基础平台
        blocks:
          - type: paragraph
            body: >-
              Nerdio 新兴的 Nutanix 集成同时带来机会与脆弱性。跨 Azure、Azure Local 和 Nutanix
              的通用编排模型，可能通过嵌入策略、镜像、扩缩容和支持流程提高切换成本，也能让产品超越仅面向公有云的定位。但这层集成同时连接 AVD、Azure Arc、Nutanix 基础设施、Nerdio 编排和
              Microsoft 工具，使边界归属与生产支持变得关键。公司报告的招聘增长、新高管和大额融资表明其有投资能力，但不能证明差异化留存，也不能阻止 Microsoft、Citrix、Workspot
              或基础设施伙伴补齐功能缺口。因此，持久性取决于更快的运营创新、伙伴信任、可量化的成本结果，以及目前证据池尚未提供的客户参考。
            claimRefs:
