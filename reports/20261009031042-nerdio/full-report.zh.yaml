  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 对 Microsoft 平台与原生能力的结构性依赖
        blocks:
          - type: paragraph
            body: >
              Nerdio 本质上是直接叠加在 Microsoft Azure Virtual Desktop（AVD）、Windows 365 Cloud PC 和 Microsoft Intune
              之上的专业编排、自动化与成本管理层。单一聚焦帮助公司快速获得商业进展——ARR 年同比增长超过 85%，并影响超过 $350 million 的 Microsoft
              收入——但也暴露出生存级的交易对手依赖。Nerdio 的整条产品线都需要 Microsoft 云基础设施才能运行，在 Azure 之外几乎没有用途。


              首要论点风险是原生功能蔓延。Microsoft 持续迭代原生管理门户和工具，例如 AVD 扩缩容计划、Intune 管理工作流和 Azure 自动化。Nerdio 自己与原生 Intune
              的对比显示，目前差异化来自解决跨租户策略漂移、复杂应用打包和技术人员手工负担。但如果 Microsoft 将多租户 MSP 能力原生纳入产品，或在核心许可证中增强基础 AVD 自动扩缩容，Nerdio
              的价值主张将立即面临利润率压缩和定价压力。此外，Microsoft 许可模式、伙伴补偿结构或 Azure Marketplace 条款的变化，也构成 Nerdio 无法控制的系统性风险。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR008
