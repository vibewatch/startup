        title: 展示项
        blocks:
          - type: callout
            title: 平台集中度是核心竞争风险
            body: Nerdio 可以加深客户工作流锁定，但底层平台、许可和产品方向仍依赖 Microsoft。尽调应检验客户付费的是持久的自动化价值，还是主要在为 Microsoft 可能缩小的功能缺口买单。
            calloutType: risk
