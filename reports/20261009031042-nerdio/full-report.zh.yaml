      - number: '7.3'
        title: 财务不透明、独角兽估值压力与规模治理
        blocks:
          - type: paragraph
            body: >
              在 General Atlantic 领投、Lead Edge Capital 和 StepStone 参与的 $500 million Series C 成长股权轮之后，Nerdio 的官方估值超过 $1
              billion。交易让 General Atlantic 两名董事进入 Nerdio 董事会，带来更高的机构治理要求和激进增长目标。公司同时将员工人数从 300 人扩大到 540 多人，并拓展 EMEA 和
              APAC 国际业务。


              即使达到独角兽地位，Nerdio 仍对核心 SaaS 运营指标保持完全的私有公司不透明。公司没有公开披露毛利率、净收入留存率（NRR）、客户流失率、客户获取成本（CAC），或头部 MSP
              分销商和企业账户的收入集中度。独立评论和买方笔记经常指出，当 Nerdio 附加在底层 Microsoft 计算、存储和软件许可证之上时，其附加许可费用偏贵。在缺少 cohort
              扩张或合同期限的经审计披露时，私募股权估值倍数容易受到市场重新定价或 Azure 迁移速度放缓的冲击。
            claimRefs:
              - CR001
