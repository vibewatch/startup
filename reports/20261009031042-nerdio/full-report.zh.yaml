figures:
  - id: FO001
    title: Nerdio 公司演进与规模里程碑时间线
    type: timeline
    summary: 从 Nerdio 创立至 2026 年的关键组织、产品、融资和商业规模里程碑。
    data:
      items:
        - date: '2016'
          label: 在 Adar 内部创立
          details: Vadim Vladimirskiy 和 Joseph Landes 创立，最初是用于自动化云 IT 环境的专业技术。
          tone: positive
        - date: 2020-02
          label: Series A 融资与独立分拆
          details: 完成由 MK Capital 领投的 $8M Series A，并从 Adar 分拆成为独立云管理平台。
          tone: positive
        - date: 2022-12
          label: Series B 投资轮
          details: 两年 ARR 增长 2,000% 后，完成由 Updata Partners 领投的 $117M Series B。
          tone: positive
        - date: 2024-07
          label: Microsoft Americas 年度合作伙伴
          details: 推动受影响的 Microsoft 云收入超过 $350M 后，获评 Microsoft Americas 年度合作伙伴。
          tone: positive
        - date: 2025-03
          label: 独角兽 Series C 融资
          details: 以 $1B+ 估值完成由 General Atlantic 领投的 $500M Series C；Aaron Goldman 和 Asher Hecht 加入董事会。
          tone: positive
        - date: 2025-06
          label: ARR 突破 $100M
          details: 宣布 ARR 突破 $100M，同比增长 85%，覆盖 50 个国家的 15,000 家客户组织。
          tone: positive
        - date: 2025-11
          label: Microsoft Ignite 上的 AVD 混合合作
          details: 与 Microsoft 管理层共同宣布 Azure Virtual Desktop 支持多种本地 hypervisor（虚拟机监控程序）的混合部署。
          tone: neutral
        - date: 2026-01
          label: 高管扩充与任命 CPTO
          details: 2025 年员工人数增长 82% 后，任命 Scott Manchester 为 CPTO，并配齐 CMO、CRO 和 CPO。
          tone: positive
        - date: 2026-05
          label: NerdioCon 2026 规模聚会
          details: 在 Palm Springs 汇聚近 1,000 名 IT 负责人，展示 NME 8.0 统一 EUC 架构和 InTune Policy Studio。
          tone: positive
        - date: 2026-10
          label: 规模版图：23,000+ 个客户
          details: 运营客户基础达到 23,000+ 个组织和 6.5M 用户；对单一厂商 Microsoft 的依赖仍是持续的治理挑战。
          tone: warning
    approximationNotes: 里程碑日期和规模数据综合自公司原始公告、科技媒体和会议记录。
