      - number: '1.3'
        title: 资本结构、规模增长与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Nerdio 的融资历史包括三轮机构股权融资，总额 $625 million：MK Capital 领投的 $8 million Series A（2020 年 2 月）、Updata Partners 领投的
              $117 million Series B（2022 年 12 月），以及 General Atlantic 领投、Lead Edge Capital 和 StepStone Group 参与的 $500
              million Series C 成长股权轮（2025 年 3 月）。公司声明称，截至 2025 年 6 月 ARR 达到 $100 million，年同比增长 85%，并实现盈利运营。运营规模从 2025
              年初的 15,000 名客户和 5 million 名用户，扩大到 2026 年覆盖 50 个国家的 23,000 多名客户和 6.5 million 名用户；2025 年员工人数增长 82%，约为 546
              人。尽管如此，Nerdio 仍是私有公司，关键 SaaS 单位经济性没有披露；准确股权比例、清算优先权、毛利率、净收入留存率（NRR）和客户集中度仍是重大尽调缺口。
