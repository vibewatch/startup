      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: Series C 优先权条款的尽调要求
            body: >-
              由于 General Atlantic 以 $1.0B+ 估值向 Nerdio 注入 $500 million，投资者在承诺资金前必须核实清算优先权结构。1x
              不参与型优先股结构能在中等退出中保留普通股上行空间；参与型优先股或保证最低 IRR 门槛，则会严重损害低于 $1.5B 退出情景下普通股的实现价值。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV010
          - type: callout
            title: Microsoft 平台的生存级依赖
            body: >-
              Nerdio 软件套件 100% 的效用都来自优化 Microsoft 技术（Azure Virtual Desktop、Windows 365 和 Microsoft Intune），同时影响超过 $350
              million 的 Microsoft 收入。Microsoft 战略方向的任何变化——例如在 Azure Portal 内实现原生功能对等，或收紧 API 许可——都构成核心投资论点失效的触发条件。
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
              - CV010
