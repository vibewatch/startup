evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-retention
    missingEvidence: >-
      Audited SaaS cohort metrics including subscription gross margins, net revenue retention (NRR), customer
      acquisition cost (CAC), and customer lifetime value (LTV).
    whyItMatters: >-
      Without audited gross margins and NRR, investors cannot independently evaluate whether the 12.0x ARR valuation
      multiple reflects sustainable software unit economics or heavy service delivery overhead.
    diligencePath: >-
      Request confidential management financial review or standard subscription cohort reporting during confirmatory due
      diligence.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: cap-table-and-governance
    missingEvidence: >-
      Full capitalization table disclosing post-Series C ownership percentages, founder common stock holdings, option
      pool reserves, and General Atlantic liquidation preference multiples.
    whyItMatters: >-
      A $500 million investment on a $1.0B+ to $1.2B valuation represents 40-50% economic ownership; liquidation
      preference terms dictate downside return waterfalls for common shareholders.
    diligencePath: >-
      Obtain the definitive Series C investor rights agreement, voting agreement, and amended certificate of
      incorporation.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: customer-arr-concentration
    missingEvidence: >-
      Top 20 customer and MSP distributor ARR concentration breakdown, quantifying exposure to the largest managed
      service provider aggregators.
    whyItMatters: >-
      If a handful of large MSP partners account for a disproportionate share of ARR, partner disintermediation or
      contract renegotiation poses severe revenue volatility.
    diligencePath: Review customer revenue concentration schedules from company management accounts.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: market-sizing-diligence
    missingEvidence: >-
      Audited breakdown of Nerdio ARR between Managed Service Providers (Nerdio Manager for MSP) and direct enterprise
      accounts (Nerdio Manager for Enterprise).
    whyItMatters: >-
      Essential for determining whether market penetration is driven by small business aggregators or sticky high-ACV
      enterprise infrastructure budgets.
    diligencePath: Request customer cohort segmentation and ARR breakdown by product edition during confidential management review.
    relatedQuestionRefs:
      - QM008
  - id: GM002
    type: missing-source
    severity: material
    topic: market-sizing-diligence
    missingEvidence: >-
      Independent third-party analyst market share report isolating AVD management software spend from gross DaaS and
      Azure consumption.
    whyItMatters: >-
      Macro DaaS figures ($60B+) overstate the pure-play software opportunity, obscuring true SAM and realistic market
      saturation ceilings.
    diligencePath: Commission bespoke research with Gartner or IDC focusing on specialized Microsoft EUC management tooling spend.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Nerdio list and realized pricing by product, user or workload unit, discount cohort, services fees, and renewal
      uplift.
    whyItMatters: >-
      Without consistent units and realized terms, the apparent cost advantage cannot be compared with Microsoft-native,
      Workspot, or Citrix alternatives.
    diligencePath: >-
      Obtain current price books, ten representative customer contracts, renewal cohorts, and a normalized three-year
      TCO model.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitive-performance
    missingEvidence: >-
      Independent win-loss, churn, workload performance, support-SLA, and migration-outcome evidence across matched
      Nerdio and competitor deployments.
    whyItMatters: >-
      Vendor pages and comparison directories identify positioning but do not demonstrate superior outcomes or durable
      customer preference.
    diligencePath: >-
      Commission reference calls with wins and losses, inspect CRM win-loss data, and run a matched proof of concept
      against shortlisted alternatives.
    relatedQuestionRefs:
      - QP002
      - QP007
      - QP008
  - type: private-evidence-only
    severity: material
    topic: platform-dependency
    missingEvidence: >-
      Microsoft agreement protections, channel economics, attach rates, product-overlap roadmap, and customer
      multi-homing behavior.
    whyItMatters: >-
      These inputs determine whether ecosystem alignment creates a defensible distribution moat or exposes Nerdio to
      platform compression.
    diligencePath: >-
      Review Microsoft and partner agreements, quantify sourced pipeline and rebates, and interview customers about
      fallback and multi-provider strategies.
    relatedQuestionRefs:
      - QP005
      - QP006
      - QP008
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Realized prices, pricing units, contract terms, discount depth, and revenue-recognition policy are not public in
      the assigned evidence.
    whyItMatters: Revenue cannot be modeled by customer, user, tenant, workload, or contract cohort without these inputs.
    diligencePath: >-
      Request current price books, anonymized contracts, gross-to-net ARR waterfalls, and the revenue-recognition
      memorandum.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, NRR, GRR, churn, CAC, LTV, payback, sales cycle, and customer concentration are not disclosed.
    whyItMatters: Growth cannot be separated into durable recurring economics versus acquisition spending or concentrated expansion.
    diligencePath: >-
      Request audited statements, ARR cohort bridges, unit-economics schedules, and top-customer and top-partner
      concentration.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, primary versus secondary Series C proceeds, monthly burn, working capital, and downside
      runway are unavailable.
    whyItMatters: Funding raised cannot establish current liquidity or the timing and conditions of a future financing need.
    diligencePath: >-
      Obtain bank statements, the Series C funds-flow memorandum, monthly cash-flow statements, and a board-approved
      runway model.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: >-
      Independent security audit, penetration-test summary, certification scope, vulnerability-disclosure record, and
      verified privacy-control evidence.
    whyItMatters: >-
      The product receives privileged access to customer Azure and Microsoft environments, so documentation of
      permissions alone does not establish control effectiveness.
    diligencePath: >-
      Request current SOC 2 or equivalent reports, penetration-test executive summaries, subprocessor and data-flow
      documentation, and remediation evidence under NDA.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: >-
      Audited uptime, incident and outage history, recovery objectives, task success rates, and performance benchmarks
      at documented scale limits.
    whyItMatters: >-
      The management plane automates production desktop infrastructure, and public architectural limits do not
      demonstrate real-world reliability.
    diligencePath: >-
      Obtain status-page history, service-level commitments, incident postmortems, recovery test results, and production
      telemetry segmented by deployment size.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: module-adoption
    missingEvidence: Active usage, attach rate, retention, and support-ticket rates for each enterprise and MSP module.
    whyItMatters: A broad documented feature set may overstate commercially meaningful adoption and operational maturity.
    diligencePath: Review product analytics and support data by module, customer cohort, deployment size, and release version.
    relatedTableRefs:
      - TE001
  - type: missing-source
    severity: minor
    topic: developer-ecosystem
    missingEvidence: >-
      Public repository activity, release, contributor, package-download, or practitioner-community metrics for the
      scripted-action ecosystem.
    whyItMatters: GitHub synchronization establishes extensibility but not ecosystem scale, freshness, or community participation.
    diligencePath: >-
      Request repository inventory and contribution metrics, then inspect public release history and issue-resolution
      cadence.
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
      NRR, GRR, logo and revenue churn, renewal rates, contract duration, cohort retention, customer satisfaction, and
      expansion ARR by MSP and enterprise cohort.
    whyItMatters: >-
      Reported customer and user scale cannot establish durable recurring revenue or land-and-expand performance without
      cohort and renewal evidence.
    diligencePath: >-
      Obtain board-level cohort schedules and customer-success dashboards, reconcile them to billing data, and sample
      renewal records across MSP and enterprise cohorts.
    relatedQuestionRefs:
      - QU005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top 1, top 5, and top 10 customer and partner shares of ARR, plus revenue by direct, MSP, and channel-sourced
      customer.
    whyItMatters: >-
      A large reported customer count can coexist with material dependence on a small number of MSPs, enterprises, or
      implementation partners.
    diligencePath: >-
      Review anonymized customer-level ARR and renewal exports, calculate concentration by end customer and originating
      partner, and test changes over the last eight quarters.
    relatedQuestionRefs:
      - QU007
  - type: enumeration-incomplete
    severity: material
    topic: named-customers
    missingEvidence: >-
      Production status, active seats, contract value, deployment date, renewal history, and quantified outcomes for the
      broader named-customer list.
    whyItMatters: >-
      Names and testimonials demonstrate referenceability but do not quantify adoption depth or prove that every named
      organization remains in production.
    diligencePath: >-
      Request a customer reference schedule and verify deployment scope and outcomes directly with a stratified sample
      of enterprise, education, and MSP references.
    relatedTableRefs:
      - TU003
  - type: stale
    severity: material
    topic: customer-scale
    missingEvidence: >-
      A current, precisely defined 2026 customer count, active-user count, geographic mix, and reconciled bridge from
      the March 2025 disclosure.
    whyItMatters: >-
      The latest precise scale metrics in the assigned pool are from March 2025, and later broad statements do not
      establish current adoption trajectory.
    diligencePath: >-
      Obtain a dated operating dashboard with definitions for paying customers, active users, managed users, countries,
      and product-level cohort changes through September 2026.
  - type: private-evidence-only
    severity: material
    topic: financial-opacity
    missingEvidence: Audited GAAP financials, gross margins, Net Revenue Retention (NRR), customer churn, and CAC metrics.
    whyItMatters: >-
      Essential for evaluating underlying unit economics, recurring revenue durability, and post-money valuation
      multiple supportability.
    diligencePath: Request audited financial statements and standard SaaS cohort retention schedules under non-disclosure agreement.
    relatedQuestionRefs:
      - QR007
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal
    missingEvidence: >-
      Complete worldwide litigation registry, detailed foreign trademark registrations, and full FedRAMP/SOC2 Type II
      third-party audit reports.
    whyItMatters: >-
      Ensures all international data residency and jurisdictional regulatory obligations are documented across EMEA and
