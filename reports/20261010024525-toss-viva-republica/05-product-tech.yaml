callouts:
  - calloutType: "insight"
    title: "Regulatory Tailwinds as an Architectural Moat"
    body: "Unlike Western fintech platforms constrained by third-party data aggregation layers like Plaid, Toss leverages South Korea's statutory Open Banking and MyData mandates. These frameworks grant licensed entities bidirectional read-and-write API access across the entire national banking system, enabling seamless multi-account orchestration and instant fund transfers directly within a single application."
    claimRefs:
      - "CE001"
      - "CE002"
  - calloutType: "risk"
    title: "Credit Model Concentration in Subprime and Near-Prime Cohorts"
    body: "Toss Bank relies heavily on its proprietary machine learning risk engine to originate credit among borrowers traditionally categorized as subprime or thin-file by legacy institutions, with mid-to-low credit users comprising approximately 34% of its customer base. While backtesting demonstrated favorable delinquency divergence, this exposure creates elevated credit cycle vulnerability under sustained macroeconomic contraction."
    claimRefs:
      - "CE006"
      - "CE007"
