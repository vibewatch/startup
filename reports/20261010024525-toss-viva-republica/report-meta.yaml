companyProfile:
  summary: >-
    Viva Republica operates Toss, a Korean financial super app that began as a P2P money-transfer product and expanded
    into banking, brokerage, payments, insurance, loan comparison, and advertising. The platform now serves more than 30
    million registered users, generated $1.8 billion of consolidated revenue in 2025, and crossed into profitability,
    but it still faces unresolved questions around segment economics, credit quality, and regulatory
    conflict-of-interest risk.
  founders:
    - name: Seunggun Lee
      role: Founder & CEO
      background: Former dentist who founded Viva Republica in Seoul in 2011.
      claimRefs:
        - CO001
        - CO002
  foundingLocation: Seoul, South Korea
  headquarters: Seoul, South Korea
  productSummary: >-
    Integrated mobile financial super app spanning simple transfers, consumer banking, securities trading, merchant
    payments, loan comparison, insurance brokerage, and ad monetization.
  customerFocus: South Korean retail consumers, merchants, and enterprise advertisers
  businessModel: >-
    Freemium consumer acquisition followed by monetization through net interest margin, brokerage commissions, loan
    brokerage fees, payment processing, and advertising.
  stage: Series G
  fundingStatus: >-
    Last disclosed major financing was a 2021 Series G round that raised $410 million at a $7.4 billion valuation, with
    later disclosures indicating cumulative private funding of roughly $1.25 billion.
