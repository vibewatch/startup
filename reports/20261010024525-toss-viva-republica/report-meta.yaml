  topStrengths:
    - Massive domestic scale with 30M+ registered users and strong daily engagement.
    - 2025 consolidated profitability confirms the monetization model now clears the venture-burn phase.
    - Integrated banking, brokerage, payments, and advertising creates multiple cross-sell paths.
  topRisks:
    - Loan brokerage fees and direct-lending expansion face acute regulatory conflict-of-interest scrutiny.
    - Toss Bank asset quality, loss provisioning, and segment margins remain undisclosed.
    - IPO timing and valuation remain uncertain relative to compressed secondary pricing.
  unresolvedGaps:
