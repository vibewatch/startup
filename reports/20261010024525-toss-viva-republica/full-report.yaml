      - number: '4.2'
        title: Pricing Dynamics, GTM Motion, and Platform Distribution Economics
        blocks:
          - type: paragraph
            body: >-
              Toss's go-to-market strategy leverages aggressive consumer freemium pricing to drive cross-vertical
              conversion into fee-bearing and interest-bearing services. In consumer payments, peer-to-peer transfers
              remain permanently free without conditions, eliminating friction and establishing primary financial
              account relationships. Monetization shifts to high-value financial actions where Toss commands significant
              pricing power. In third-party loan comparison, Toss charges an average brokerage fee of approximately 1.8
              percent of originated loan value—a substantial premium compared to traditional commercial bank
              distribution costs of approximately 0.08 percent. On the merchant side, Toss Payments charges
              market-standard payment gateway take rates between 1.5 and 3.0 percent, bundled with operational
              management dashboards. In digital advertising, Toss Ads commands performance marketing budgets by offering
              granular targeting based on actual card spending and verified investment holdings, delivering proven
              return on ad spend for enterprise advertisers.
            claimRefs:
              - CI003
              - CI005
              - CI006
              - CI010
              - CI011
