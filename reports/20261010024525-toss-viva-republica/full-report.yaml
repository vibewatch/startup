      - number: '3.2'
        title: Capability Matrix and Multi-Vertical Product Differentiation
        blocks:
          - type: paragraph
            body: >-
              Toss differentiates itself from standalone challenger banks through its aggressive multi-vertical
              integration, consolidating banking, stock brokerage, retail payments, and insurance comparison under a
              single unified mobile application rather than fragmenting services across disconnected apps. Digital
              banking peer KakaoBank originally prioritized core retail banking, deposit gathering, and unsecured
              consumer lending, leaving brokerage and investment management to affiliate partnerships. In contrast, Toss
              Securities built an integrated mobile trading system that rapidly scaled by eliminating the friction and
              visual clutter inherent in legacy desktop Home Trading Systems. Furthermore, Toss leverages proprietary
              transaction data from twenty-four million registered mobile users to enhance credit risk scoring through
              machine-learning models developed in collaboration with Korea Credit Bureau, enabling Toss Bank to serve
              mid-tier credit borrowers often rejected by conservative tier-one commercial banks. This consolidated
              interface creates powerful cross-selling loops, allowing Toss to capture user financial workflows from
              daily wage deposits to active equity trading without external distribution leakage.
            claimRefs:
              - CP001
              - CP003
              - CP007
              - CP011
              - CP012
              - CP014
