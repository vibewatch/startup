            title: Regulatory scrutiny on loan brokerage fees and platform self-preferencing
            body: >-
              The platform's expansion from consumer utility into financial product distribution has triggered pushback
              from lawmakers and smaller fintech startups. Toss's 1.8% loan brokerage fee—substantially higher than
              traditional bank referral margins of approximately 0.08%—and its simultaneous entry into online
              investment-linked financing have generated conflict-of-interest allegations regarding algorithm bias and
