      - number: '5.4'
        title: Proprietary Underwriting, Trust Frameworks, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              Toss's core algorithmic differentiation centers on its proprietary credit scoring engine, engineered to
              address structural gaps in South Korea's retail lending market. Traditional domestic commercial banks
              heavily penalize thin-file or mid-tier credit borrowers with subprime interest rates. Toss Bank leverages
              granular transaction metadata—including transfer frequency, merchant spend timing, and consolidated cash
              balances—to supplement traditional bureau data. Validation by Korea Credit Bureau (KCB) across two million
              user records confirmed that Toss's engine achieved a 150% improvement in differential power and a 30%
              reduction in delinquency rates compared to conventional models, enabling mid-to-low credit cohorts
              (comprising ~34% of Toss Bank's borrowers) to lower refinancing interest rates by an average of 4.2
              percentage points.


              To safeguard users across high transaction velocity, Toss embeds security controls directly into the
              payment flow. Its automated Fraud Siren system cross-references destination accounts against police fraud
              databases in real time, issuing warnings prior to transaction completion. Furthermore, Toss provides a
              comprehensive compensation policy covering up to KRW 50 million for monetary loss resulting from financial
              fraud. However, significant structural constraints persist: South Korean banking regulations governing
              non-financial corporate ownership forced Toss to partner with institutions such as Standard Chartered
              rather than maintaining pure corporate autonomy, highlighting regulatory vulnerability that technical
              execution alone cannot fully resolve.
            claimRefs:
              - CE006
              - CE007
              - CE010
              - CE011
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory Tailwinds as an Architectural Moat
            body: >-
              Unlike Western fintech platforms constrained by third-party data aggregation layers like Plaid, Toss
              leverages South Korea's statutory Open Banking and MyData mandates. These frameworks grant licensed
              entities bidirectional read-and-write API access across the entire national banking system, enabling
              seamless multi-account orchestration and instant fund transfers directly within a single application.
            calloutType: insight
            claimRefs:
              - CE001
              - CE002
          - type: callout
            title: Credit Model Concentration in Subprime and Near-Prime Cohorts
            body: >-
              Toss Bank relies heavily on its proprietary machine learning risk engine to originate credit among
              borrowers traditionally categorized as subprime or thin-file by legacy institutions, with mid-to-low
              credit users comprising approximately 34% of its customer base. While backtesting demonstrated favorable
              delinquency divergence, this exposure creates elevated credit cycle vulnerability under sustained
              macroeconomic contraction.
            calloutType: risk
            claimRefs:
              - CE006
              - CE007
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Demographic Reach
        blocks:
          - type: paragraph
            body: >-
              Toss segments its user base across four primary customer classes: mainstream retail consumers, teen
              digital-native users, small business and offline merchants, and enterprise advertising clients. Mainstream
              retail consumers form the foundational tier, utilizing frictionless peer-to-peer money transfers, free
              credit score checks, multi-bank account aggregation, personal lending, and deposit accounts. To establish
              early brand attachment, Toss launched Toss Teens for users aged 7 to 18, scaling past 3 million verified
              teen users within 45 months. On the commercial side, Toss serves more than 100,000 business accounts,
              spanning online merchants using Toss Payments gateways, offline retailers deploying Toss Place
              point-of-sale hardware, and 200,000 business owners utilizing specialized bookkeeping services. Finally,
              large corporate enterprises engage Toss as brand advertisers to access proprietary transaction and
              spending behavioral signals.
