  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Addressable Verticals, and Scope
        blocks:
          - type: paragraph
            body: >
              South Korea's financial services market has historically been dominated by traditional commercial banking
              groups, fragmented payment gateways, and branch-heavy retail brokerages. Toss, operated by Viva Republica,
              addresses this market through an integrated "One App" financial super-app model that consolidates core
              retail banking, consumer credit, wealth management, mobile payment processing, and merchant point-of-sale
              operations. Rather than serving a single discrete software category, Toss competes across multiple
              financial pools: retail bank deposits and lending via internet-only Toss Bank, digital payment processing
              through Toss Payments, mobile retail stock trading through Toss Securities, and in-store merchant
              infrastructure via Toss Place.


              The addressable market boundary encompasses retail deposits, personal credit loans particularly targeting
              mid-to-low credit borrowers, equity brokerage commissions, and merchant checkout processing. Crucially,
              Viva Republica deliberately excludes capital-heavy commercial real estate lending, corporate investment
              banking, and physical bank branch management from its core operations. Status-quo substitutes include
              legacy commercial banking giants (such as KB Kookmin, Shinhan, Hana, and Woori), incumbent card issuers,
              and established PC-based Home Trading Systems (HTS). By replacing accredited digital certificates and
              multi-step security authentications with streamlined mobile workflows, Toss transformed basic money
              transfers from an administrative friction point into an acquisition funnel for high-margin financial
              products.
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
              - CM008
