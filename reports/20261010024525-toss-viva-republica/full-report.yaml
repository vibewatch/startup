chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Executive Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Viva Republica was incorporated in 2011 in Seoul, South Korea, by founder Seunggun Lee (SG Lee), a former
              dentist who established the venture to address structural friction in South Korean consumer financial
              transactions. Operating under the commercial brand name Toss, the enterprise has developed into South
              Korea's leading digital financial ecosystem, pioneering simplified peer-to-peer money transfers before
              expanding into full-scale digital banking, securities trading, and payment aggregation [CO001]. The
              executive leadership structure is anchored by founder and Chief Executive Officer Seunggun Lee, who
              maintains high key-person dependency due to his foundational role in shaping company culture, regulatory
              strategy, and aggressive multi-subsidiary expansion [CO002]. Senior operational and engineering
              responsibilities are distributed across executive officers, including Chief Operating Officer Juyoung
              Yang, who oversees platform-wide operations and affiliate alignment, and Chief Technology Officer Hyungsuk
              Lee, who directs core engineering architecture, information security, and distributed microservices
              [CO003]. Together, the management team oversees an integrated financial super-app that bundles more than
              40 discrete financial services into a single unified mobile application, minimizing customer acquisition
              costs across business lines while maintaining a flat, autonomous organizational structure [CO004].
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
      - number: '1.2'
        title: Capitalization History, Valuation Progression, and Secondary Markets
        blocks:
          - type: paragraph
            body: >-
              Viva Republica's capitalization trajectory illustrates rapid private capital accumulation backed by
              prominent domestic and international venture institutions. The company's early and expansion equity rounds
              attracted tier-one global venture firms, including Silicon Valley stalwart Kleiner Perkins, cross-border
              technology investor Qualcomm Ventures, regional specialist Altos Ventures, and Sequoia Capital China,
              alongside domestic sovereign backer Korea Development Bank [CO005]. In June 2021, Viva Republica executed
              its landmark Series G financing, raising $410 million in fresh capital at a post-money valuation of $7.4
              billion in a round led by US investment firm Alkeon Capital Management with participation from Greyhound
              Capital, lifting cumulative equity funding past $940 million [CO006]. Following broader global fintech
              valuation adjustments and consecutive IPO postponements, secondary market transaction indications on
              institutional trading venues such as Forge Global benchmarked Toss's estimated private valuation around
              $7.0 billion as of early 2026 [CO007]. Concurrently, company leadership and financial market reports have
              indicated ongoing preparations for an initial public offering in the United States, targeting market
              valuations between $10 billion and $15 billion and potential capital proceeds of $2 billion to $3 billion,
              although definitive filing timelines and exchange selection remain subject to market conditions [CO008].
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO003
            claimRefs:
              - CO002
              - CO005
              - CO006
      - number: '1.3'
        title: Operating Scale, Product Ecosystem, and Financial Milestones
        blocks:
          - type: paragraph
            body: >-
              Toss has demonstrated extraordinary domestic consumer market penetration in South Korea, expanding from
              early-adopter millennials to an omnipresent digital consumer platform. Official company operational
              metrics confirm that Toss surpassed 30 million registered users by 2025, representing more than 58 percent
              of South Korea's total population of 51.6 million individuals [CO009]. Across active usage dimensions,
              Toss Pay commands more than 19.1 million active monthly transacting users and processed cumulative cash
              transfers exceeding 30 trillion Korean won (approximately US$20 billion) through merchant acceptance
              networks spanning domestic retail and cross-border partnerships [CO010]. Financially, Viva Republica
              reached a critical inflection point in 2024 by posting consolidated annual revenues surpassing $1.4
              billion alongside its first group operational profit of approximately $62 million, advancing further to an
              estimated $1.8 billion in 2025 revenue [CO011]. To sustain transparency and public corporate engagement,
              Toss maintains structured corporate communication interfaces segmented into dedicated Company, Newsroom,
              and Careers surfaces, reflecting its maturation into an established financial institution [CO012].
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
