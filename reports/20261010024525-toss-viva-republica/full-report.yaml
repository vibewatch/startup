      - number: '5.3'
        title: Data Aggregation Architecture and Performance Optimization
        blocks:
          - type: paragraph
            body: >-
              Maintaining reliable real-time connectivity across dozens of financial institutions presents significant
              technical and operational hurdles. Prior to the maturation of standardized Open Banking APIs, Toss relied
              extensively on screen-scraping pipelines that were vulnerable to upstream banking portal layout updates,
              resulting in historical scraping failure rates between 10% and 20%. Dedicated engineering optimization and
              the transition toward regulated open-banking protocols reduced scraping and connection error rates down to
              approximately 1% while accelerating data loading latency by 50% across high-concurrency peak usage hours.


              On the merchant integration front, Toss Payments introduced an artificial-intelligence-integrated Model
              Context Protocol (MCP) server implementation in 2025. This tooling dynamically generates merchant checkout
              configurations, reducing the merchant onboarding and technical integration cycle from one to two weeks of
              manual developer effort down to approximately ten minutes. Concurrently, Toss Bank has explored
              experimental infrastructure partnerships, including evaluating Solana Foundation blockchain rails to test
              low-cost architecture for cross-border remittance transactions.
            claimRefs:
              - CE001
              - CE008
              - CE009
              - CE014
