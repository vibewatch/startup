      - number: '6.2'
        title: Adoption Trajectory, Engagement, and Biometric Scale
        blocks:
          - type: paragraph
            body: >-
              From its origin as a lightweight money transfer application in 2015, Toss expanded its registered user
              base from 20 million in 2021 to over 30 million by 2025, capturing nearly 60 percent of South Korea's
              total population of 51.6 million. Active engagement has remained intense, with platform monthly active
              users reaching between 19 million and 24 million, reflecting regular daily utility. Product expansion
              loops have demonstrated rapid customer onboarding: Toss Securities attracted 3.5 million retail trading
              accounts within three months of launching its mobile trading system, while Toss FacePay enrolled 1 million
              biometric payment users across 240,000 merchant store locations within its initial commercial rollout. The
              company has targeted deploying FacePay to one million offline merchant stores by late 2026, attempting to
              capture in-person checkout volume through one-second facial recognition technology.
