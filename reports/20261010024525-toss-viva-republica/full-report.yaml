      - number: '5.2'
        title: Core Operating Modules and Affiliate Ecosystem
        blocks:
          - type: paragraph
            body: >-
              The Toss ecosystem spans multiple operational entities and business lines coordinated under parent company
              Viva Republica. Its primary neobanking engine, Toss Bank, operates directly within the primary app
              interface rather than through a standalone download, with Viva Republica holding a 28% equity interest as
              its principal shareholder. Toss Bank focuses primarily on consumer lending, automated credit lines, and
              competitive deposit accounts designed with daily interest accrual mechanics.


              Capital markets access is delivered via Toss Securities, which introduced its mobile trading system (MTS)
              in March 2021. Designed specifically for retail investors intimidated by legacy home trading systems, Toss
              Securities attracted over 3.5 million registered accounts within three months by providing streamlined
              mobile charts, brand-oriented asset search, and real-time fractional US equity trading. Merchant acquiring
              and payment gateway infrastructure are managed through Toss Payments, which provides online settlement
              dashboards and accelerated merchant checkout integration. Meanwhile, Toss Ads monetizes customer
              engagement by leveraging opt-in transaction histories and offline merchant point-of-sale comparisons to
              verify whether promotional campaigns generate measurable in-store and online purchases.
