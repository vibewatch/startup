        title: Enterprise Deployments and Commercial Customer Evidence
        blocks:
          - type: paragraph
            body: >-
              Beyond consumer aggregation, Toss has established commercial traction with major enterprise advertisers
              and institutional infrastructure partners. Advertisers such as health and beauty retail giant Olive Young,
              telecommunications operator LG Uplus, and lifestyle e-commerce platform Ohouse (Bucketplace) utilize Toss
              Ads to target audiences using verified offline spending and financial profile indicators. Campaign case
              studies show tangible commercial outcomes: Ohouse reported a 62 percent reduction in customer acquisition
              costs under conversion-focused targeting, while an asset management campaign generated a 77 percent
              increase in ETF holdings among exposed Toss users. At the institutional infrastructure level, Toss Bank
              signed a memorandum of understanding with the Solana Foundation in June 2026 to pilot stablecoin
              cross-border remittances across 30 international corridors, positioning Toss for institutional blockchain
              settlement ahead of South Korea's revised Foreign Exchange Transactions Act.
