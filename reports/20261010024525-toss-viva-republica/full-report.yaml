            title: Super-App Cross-Subsidization Drives Operating Leverage
            body: >-
              Viva Republica's shift into positive profitability ($62 million in 2024 and $131.8 million in 2025)
              demonstrates that zero-fee consumer transfer services serve as an effective customer acquisition funnel
              for capital-efficient lending and brokerage operations, although segment-level profitability remains
              opaque.
