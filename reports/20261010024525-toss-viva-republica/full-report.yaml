      - number: '4.4'
        title: Capital Adequacy, Financing Dependency, and Diligence Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              With cumulative private equity funding totaling $1.25 billion across ten rounds, Viva Republica has
              established a formidable capital cushion. Following its peak Series F round of $410 million at a $7.4
              billion post-money valuation in 2021 and Series G extensions in 2022, the company has funded
              capital-intensive regulatory capital requirements for Toss Bank and Toss Securities. However, secondary
              pre-IPO markets reveal significant valuation compression: private share transactions in mid-2026 traded
              around $21 per share, representing a 74 percent discount from peak January 2022 levels of $81 per share.
              Furthermore, while an April 2026 SEC registration for a 2X leveraged ETF referencing Viva Republica ADRs
              reflects anticipation of public market liquidity, formal IPO timelines remain unfinalized. Compounding
              these capital uncertainties are regulatory headwinds: South Korean parliamentary audits have raised
              conflict-of-interest concerns regarding Toss's dual role as an independent loan comparison marketplace and
              a direct credit provider, alongside scrutiny of its 1.8 percent loan brokerage take rate. For
              institutional underwriting, confirmatory diligence must establish audited legal-entity margins and verify
              Toss Bank's asset quality before a comprehensive risk-adjusted valuation can be substantiated.
            claimRefs:
              - CI001
              - CI002
              - CI004
