            body: >-
              Toss's core customer acquisition engine leverages friction-free peer-to-peer transfers and gamified daily
              engagement to build a massive 30-million-user consumer base at low marginal acquisition cost. Once
              onboarded, users are cross-sold high-margin banking, securities, and payment products, evidenced by Toss
              Securities reaching 3.5 million accounts in three months and FacePay enrolling 1 million biometric users
              across 240,000 stores.
            calloutType: insight
