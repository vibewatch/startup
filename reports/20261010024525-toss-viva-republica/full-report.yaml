      - number: '2.2'
        title: Market Sizing, Sizing Lenses, and Penetration
        blocks:
          - type: paragraph
            body: >
              Evaluating the addressable opportunity for Toss requires multiple sizing lenses across its primary
              operating subsidiaries. In retail banking, Toss Bank operates as one of only three licensed internet-only
              banks in South Korea, competing directly for retail deposits and credit loans within an economy of
              approximately 51.6 million residents. Viva Republica reported reaching 28 million registered users by 2024
              and surpassing 30 million users by 2025, representing more than 58% of the national population, alongside
              19 million monthly active users and over 100,000 business customers.


              The total addressable market (TAM) spans the South Korean retail banking deposit and consumer credit
              market, alongside national digital commerce transaction flows. The serviceable addressable market (SAM)
              concentrates on smartphone-native retail banking, online investment brokerage, and digital merchant
              payment acceptance, where Toss's mobile trading system (MTS) and merchant payment solutions compete. The
              serviceable obtainable market (SOM) is demonstrated by Toss Bank's rapid accumulation of 7 million banking
              customers and over $1.2 billion in cumulative capital raised, paired with Toss Securities capturing 3.5
              million accounts within three months of inception. Consolidated group revenue expanded from $1.4 billion
              in 2024 to $1.8 billion in 2025, validating substantial market monetisation despite severe secondary
              pre-IPO market valuation compression from historical peaks.
            claimRefs:
              - CM001
              - CM002
