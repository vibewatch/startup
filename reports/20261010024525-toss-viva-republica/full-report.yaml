        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break test
            body: >-
              A repeat material privacy or privileged-access finding, failed compliance with the new group-supervision
              regime, sustained deterioration in bank credit quality beyond stated risk appetite, or an uncontained
              multi-product outage would invalidate the view that governance is converging with Toss's operating scale.
            calloutType: risk
