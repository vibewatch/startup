      - number: '1.4'
        title: Regulatory Oversight, Conflict-of-Interest Scrutiny, and Milestones
        blocks:
          - type: paragraph
            body: >-
              As Viva Republica expanded from an unbundled payment utility into a multifaceted financial conglomerate,
              its rapid growth attracted intensifying legislative and regulatory scrutiny. During the National Assembly
              Political Affairs Committee audit of the Financial Services Commission in October 2025, bipartisan
              lawmakers raised formal concerns regarding Toss's proposed entry into online investment-linked personal
              credit lending [CO013]. Lawmakers emphasized potential conflicts of interest, cautioning that operating a
              leading consumer loan comparison platform while simultaneously offering proprietary lending products
              resembles a referee actively competing as a player, with risks of algorithmic self-preferencing and
              competitor data exploitation [CO013]. Scrutiny also centered on commercial monetization practices, noting
              that Toss levies a 1.8 percent brokerage commission on loan originations—substantially higher than the
              traditional banking benchmark of approximately 0.08 percent—while prompting calls for regulatory
              evaluation of whether Viva Republica requires formal licensing as a financial holding company [CO014].
              Despite these regulatory headwinds, Toss's milestone trajectory reflects continuous product innovation,
              from inventing simple transfers in 2015 to launching neobank and brokerage affiliates in 2021, and
              deploying biometric FacePay and embedded Mini Apps by 2025 [CO015].
            claimRefs:
              - CO013
              - CO014
              - CO015
