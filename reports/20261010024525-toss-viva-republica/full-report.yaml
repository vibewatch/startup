      - number: '8.3'
        title: Bull, Base, and Bear Valuation Scenarios
        blocks:
          - type: paragraph
            body: >-
              Our valuation architecture evaluates Viva Republica across three probability-weighted operating
              trajectories anchored against its 2025 baseline revenue of $1.8 billion and prospective public market
              multiples. Under the bull case scenario, which carries a 25 percent probability, Viva Republica
              successfully prices its US IPO near the upper bound of $15.0 billion, translating to an 8.3x trailing
              sales multiple driven by accelerated Facepay biometric retail deployments and international traction. The
              base case scenario, modeled with a 50 percent probability, contemplates an IPO valuation range of $9.5
              billion to $11.0 billion, representing a 5.3x to 6.1x sales multiple that reflects solid double-digit
              expansion tempered by broader fintech sector re-rating and modest domestic loan growth. Conversely, the
              bear case scenario carries a 25 percent probability and models an equity valuation compressing to between
              $6.0 billion and $7.5 billion (3.3x to 4.2x sales), precipitated by extended IPO delays, persistent
              secondary market discounting, or adverse regulatory restrictions on loan comparison fees.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV012
