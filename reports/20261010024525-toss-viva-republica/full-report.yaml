  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Unified Super-App Model
        blocks:
          - type: paragraph
            body: >-
              Toss is architected as an integrated financial super app designed to eliminate friction across consumer
              financial management in South Korea. Rather than unbundling banking, brokerage, insurance, and payments
              into fragmented applications, Viva Republica consolidates all services into a single native mobile client.
              The foundation of this consumer experience is powered by South Korea's regulatory Open Banking and MyData
              frameworks, which require domestic financial institutions to expose standardized application programming
              interfaces (APIs) supporting both balance queries and direct payment initiation. This bi-directional
              capability allows Toss users to aggregate balances, monitor cash flow, and initiate instant funds
              transfers across accounts from dozens of commercial banks without departing the Toss interface.


              The convenience of this centralized financial control plane is evidenced by deep customer engagement, with
              the average active user linking 16 distinct financial accounts into Toss. Beyond core financial
              orchestration, Toss expanded its super-app surface in 2025 by deploying Mini Apps, a zero-installation
              runtime environment that hosts hundreds of everyday lifestyle tools, commerce utilities, and interactive
              services. By coupling daily utility workflows with real-time financial execution, Toss maintains high
              daily engagement metrics that traditional banking applications cannot replicate.
            claimRefs:
              - CE001
