      - number: '7.2'
        title: Operational reliability and control
        blocks:
          - type: paragraph
            body: >-
              Operational exposure is distributed across internal access controls, third-party financial integrations,
              and a culture designed for fast experimentation. Toss says one product team must track changes across
              dozens of banks and card companies and that those changes directly affect its service. The same company
              account reports reducing a historical scraping error rate from 10-20% to 1%, which is evidence of
              engineering mitigation but not an independent service-level history. Toss also describes execution over
              perfection and willingness to risk failure as cultural principles. That can accelerate learning, but in a
              national-scale financial platform it raises the value of centralized controls, change management, access
              reviews, and incident reporting. Emergency Payment Mode and customer compensation provide visible
              safeguards, while public outage frequency, recovery performance, and current privileged-access remediation
              remain unavailable.
