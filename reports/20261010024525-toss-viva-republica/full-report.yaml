      - number: '8.2'
        title: Financing History and Secondary Market Pricing
        blocks:
          - type: paragraph
            body: >-
              Understanding Viva Republica's valuation requires reconciling its private institutional financing pedigree
              with turbulent secondary market trading dynamics. In June 2021, the company completed a landmark $410
              million Series G equity financing round led by Alkeon Capital alongside Korea Development Bank, Altos
              Ventures, and Greyhound Capital, establishing an official post-money valuation benchmark of $7.4 billion
              and lifting total equity raised above $940 million. Although secondary private marketplace Forge Global
              continued to quote a $7.0 billion baseline as recently as February 2026, transactions across pre-IPO
              trading venues like Notice reflect severe price compression. Toss pre-IPO shares traded at approximately
              $21 per share in June 2026, marking an alarming 74 percent drawdown from their peak of $81 in January 2022
              and trading firmly below their 200-day exponential moving average. Meanwhile, unrelated early-stage
              activity—such as a seed round completed by a UK salad dressing company sharing the 'TOSS' trade
              name—underscores the necessity of distinguishing Viva Republica's mature capital structure from nominal
              venture headlines.
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV008
