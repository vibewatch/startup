      - number: '7.4'
        title: Mitigations, monitoring, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The public record shows tangible product-level mitigations: Toss reports automated fraud warnings and
              compensation for qualifying financial fraud, while Toss Place reports an emergency payment mode intended
              to preserve merchant acceptance during POS disruption. These controls reduce specific customer harms but
              do not demonstrate closure of the reported privacy, access-control, or group-governance findings.
              Investment monitoring should therefore prioritize evidence rather than assurances: obtain the underlying
              enforcement orders, independent remediation testing, privileged-access recertification,
              conglomerate-supervision milestones, bank credit-vintage data, and audited incident metrics. Thesis-break
              triggers are a repeat material privacy or access-control finding, failure to meet group-supervision
              requirements, sustained deterioration in bank arrears or provisions beyond risk appetite, or a severe
              multi-product outage without tested recovery. A less severe but still important warning would be rising
              dependence on one data, funding, merchant, or financial-institution partner without a documented fallback.
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR009
              - CR012
              - CR014
              - CR015
              - CR016
