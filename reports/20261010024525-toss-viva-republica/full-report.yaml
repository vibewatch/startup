      - number: '4.3'
        title: Cost Structure, Gross Margin Drivers, and Unit Economics Underwriting Gaps
        blocks:
          - type: paragraph
            body: >-
              Viva Republica's financial inflection from persistent venture-era losses to consolidated profitability
              highlights improving operational leverage across its core units. Consolidated net profit reached $62
              million in 2024 and expanded to $131.8 million in 2025, yielding a net margin of 7.3 percent. This margin
              expansion has been propelled by the rapid maturation of Toss Securities, which onboarded 3.5 million
              retail brokerage accounts within three months of inception, and Toss Bank's balance-sheet lending.
              However, the cost structure carries significant service delivery expenses, including interbank transfer
              network fees, payment infrastructure overhead, and advertising partner rev-share. More importantly, key
              unit economics metrics remain undisclosed to the public: blended customer acquisition cost (CAC), customer
              lifetime value (LTV), and standalone subsidiary EBITDA margins are not reported. Crucially, Toss Bank's
              credit risk profile—including non-performing loan (NPL) ratios, default provisioning, and credit allowance
              coverage for mid-to-low credit borrowers—is omitted from public releases, creating a material diligence
              barrier for institutional underwriting.
