      - number: '6.4'
        title: Customer Durability, Regulatory Friction, and Concentration Exposures
        blocks:
          - type: paragraph
            body: >-
              Despite formidable top-of-funnel customer adoption, significant durability and concentration questions
              remain unresolved. Viva Republica does not publicly disclose cohort-level retention rates, Gross Revenue
              Retention (GRR), Net Revenue Retention (NRR), or account-level churn across its core banking and brokerage
              subsidiaries, preventing independent assessment of lifetime customer profitability. Simultaneously, Toss
              faces escalating regulatory scrutiny regarding its commercial customer relationships. During an October
              2026 National Assembly audit, lawmakers and fintech trade groups challenged Toss's 1.8 percent loan
              comparison brokerage fee—substantially above commercial bank fee averages of roughly 0.08 percent—and
              alleged potential conflicts of interest as Toss prepares to supply proprietary online investment-linked
              financing products while operating the loan comparison marketplace, raising concerns over algorithmic
              self-preferencing and platform lock-in.
