  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Valuation Posture
        blocks:
          - type: paragraph
            body: >-
              Viva Republica stands at a pivotal valuation juncture as South Korea's premier financial super app
              prepares for an anticipated dual-listed initial public offering on a US exchange in 2026. The company has
              demonstrated formidable product-market fit, expanding its user base beyond 30 million registered users,
              representing nearly 60 percent of the South Korean population, with monthly active engagement between 19
              million and 24 million users. Crucially, Viva Republica crossed into sustained consolidated profitability,
              generating 1.96 trillion won ($1.4 billion) in revenue and $62 million in net profit in 2024, followed by
              rapid top-line growth to $1.8 billion and $131.8 million in net earnings in 2025. These operating results
              represent a dramatic turnaround from prior periods of heavy cash burn, validating the core cross-selling
              efficiency of unifying banking, payment processing, mobile stock trading, and credit comparison within a
              single frictionless interface. Nonetheless, the prospective valuation range of $10 billion to $15 billion
              demands rigorous scrutiny, warranting a disciplined track recommendation.
            claimRefs:
