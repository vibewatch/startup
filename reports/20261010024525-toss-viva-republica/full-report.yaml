      - number: '8.4'
        title: Regulatory Friction and Pre-IPO Diligence Directives
        blocks:
          - type: paragraph
            body: >-
              The principal barrier preventing an immediate buy recommendation is the emergence of acute regulatory
              friction surrounding Toss's most profitable monetization channels. During the National Assembly's October
              2026 parliamentary audit, bipartisan lawmakers raised sharp conflict-of-interest concerns regarding Viva
              Republica's dual role as both an independent loan comparison platform and a direct credit originator
              through Toss Bank and planned online investment-linked financing vehicles. Lawmakers specifically targeted
              Toss's 1.8 percent loan brokerage commission, contrasting it with traditional banking fee structures of
              approximately 0.08 percent and characterizing the dynamic as a referee competing as an active player. With
              Financial Services Commission Chairman Lee Eok-won formally committing to review these market-distortion
              risks and evaluate Viva Republica under financial holding company regulations, institutional investors
              face material regulatory overhang. Essential diligence asks prior to IPO participation must focus on
              statutory fee caps, corporate governance restructuring, and the non-performing loan trajectory across Toss
              Bank's credit portfolio.
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV011
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation Rationale: Track at Current Valuation'
            body: >-
              While Viva Republica has achieved significant financial milestones with $1.8 billion in 2025 revenue and
              $131.8 million in net profit, its targeted $10 billion to $15 billion US IPO valuation represents a rich
              6.9x midpoint sales multiple that is disconnected from pre-IPO secondary markets where shares trade 74
              percent below historical highs. Investors should maintain a track posture until an official S-1 filing
              confirms segment-level credit risk and regulatory clearance.
            calloutType: recommendation
            claimRefs:
