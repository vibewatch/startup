  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The most decision-relevant risk is not the existence of a broad regulated product set by itself, but
              whether group-wide controls have caught up with that breadth. EIS reports a roughly KRW 6 billion fine and
              corporate warning, data-combination and consent findings affecting millions of records or users, and
              access-control weaknesses involving 261 employees. It also reports that Viva Republica was designated a
              financial conglomerate in July 2026. Those claims come from a secondary review rather than the underlying
              regulator orders in this assigned source pool, so the events are treated as reported findings and the
              exact legal language remains a diligence item. Toss's own advertising materials confirm that spending and
              payment data are used in targeting and campaign measurement, making consent design and purpose limitation
              continuing operational requirements rather than historical clean-up alone.
