      - number: '7.3'
        title: Financial model and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Product breadth amplifies both revenue opportunity and correlated downside. Baillie Gifford describes more
              than 70 financial products in one interface, while EpicKor notes that banking, securities, payments,
              insurance, and advertising carry different regulatory and operating risks. Frontiers Global further
              reports that Toss Bank reduced mid-interest-rate lending in 2025 as arrears rose; because the assigned
              pool contains no bank filing or regulator dataset that quantifies delinquency, non-performing loans,
              provisioning, or vintage performance, this is a directional warning rather than a measured loss forecast.
              Dependence on banks, card issuers, merchants, regulated subsidiaries, and data permissions also means a
              counterparty rule change or control failure can affect several user journeys. Exact counterparty
              concentration and segment-level profitability are therefore material gaps, not quantities that can be
              inferred from user scale.
            claimRefs:
