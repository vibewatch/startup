company:
  name: "Toss (Viva Republica)"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    Toss's largest evidenced residual risk is governance maturity lagging the scale and breadth
    of a 30-million-user financial group. Publicly reported enforcement, new conglomerate
    supervision, credit-quality questions, partner-system dependencies, and limited independent
    remediation evidence make regulatory execution the primary thesis-break variable.
sections:
  - id: "regulatory-and-legal-exposure"
    title: "Regulatory and legal exposure"
    body: >-
      The most decision-relevant risk is not the existence of a broad regulated product set by
      itself, but whether group-wide controls have caught up with that breadth. EIS reports a
      roughly KRW 6 billion fine and corporate warning, data-combination and consent findings
      affecting millions of records or users, and access-control weaknesses involving 261
      employees. It also reports that Viva Republica was designated a financial conglomerate in
      July 2026. Those claims come from a secondary review rather than the underlying regulator
      orders in this assigned source pool, so the events are treated as reported findings and the
      exact legal language remains a diligence item. Toss's own advertising materials confirm
      that spending and payment data are used in targeting and campaign measurement, making
      consent design and purpose limitation continuing operational requirements rather than
      historical clean-up alone.
    claimRefs: [CR003, CR004, CR005, CR006, CR007, CR008, CR014]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: "operational-reliability-and-control"
    title: "Operational reliability and control"
    body: >-
      Operational exposure is distributed across internal access controls, third-party financial
      integrations, and a culture designed for fast experimentation. Toss says one product team
      must track changes across dozens of banks and card companies and that those changes directly
      affect its service. The same company account reports reducing a historical scraping error
      rate from 10-20% to 1%, which is evidence of engineering mitigation but not an independent
      service-level history. Toss also describes execution over perfection and willingness to risk
      failure as cultural principles. That can accelerate learning, but in a national-scale
      financial platform it raises the value of centralized controls, change management, access
      reviews, and incident reporting. Emergency Payment Mode and customer compensation provide
      visible safeguards, while public outage frequency, recovery performance, and current
      privileged-access remediation remain unavailable.
    claimRefs: [CR006, CR009, CR010, CR011, CR015, CR016]
    tableRefs: [TR002]
  - id: "financial-model-and-dependency-risk"
    title: "Financial model and dependency risk"
    body: >-
      Product breadth amplifies both revenue opportunity and correlated downside. Baillie Gifford
      describes more than 70 financial products in one interface, while EpicKor notes that
      banking, securities, payments, insurance, and advertising carry different regulatory and
      operating risks. Frontiers Global further reports that Toss Bank reduced mid-interest-rate
      lending in 2025 as arrears rose; because the assigned pool contains no bank filing or
      regulator dataset that quantifies delinquency, non-performing loans, provisioning, or
      vintage performance, this is a directional warning rather than a measured loss forecast.
      Dependence on banks, card issuers, merchants, regulated subsidiaries, and data permissions
      also means a counterparty rule change or control failure can affect several user journeys.
      Exact counterparty concentration and segment-level profitability are therefore material
      gaps, not quantities that can be inferred from user scale.
    claimRefs: [CR002, CR009, CR012, CR013, CR014]
    tableRefs: [TR003]
  - id: "mitigations-monitoring-and-kill-criteria"
    title: "Mitigations, monitoring, and kill criteria"
    body: >-
      The public record shows tangible product-level mitigations: Toss reports automated fraud
      warnings and compensation for qualifying financial fraud, while Toss Place reports an
      emergency payment mode intended to preserve merchant acceptance during POS disruption.
      These controls reduce specific customer harms but do not demonstrate closure of the reported
      privacy, access-control, or group-governance findings. Investment monitoring should therefore
      prioritize evidence rather than assurances: obtain the underlying enforcement orders,
      independent remediation testing, privileged-access recertification, conglomerate-supervision
      milestones, bank credit-vintage data, and audited incident metrics. Thesis-break triggers
      are a repeat material privacy or access-control finding, failure to meet group-supervision
      requirements, sustained deterioration in bank arrears or provisions beyond risk appetite,
      or a severe multi-product outage without tested recovery. A less severe but still important
      warning would be rising dependence on one data, funding, merchant, or financial-institution
      partner without a documented fallback.
    claimRefs: [CR003, CR006, CR007, CR009, CR012, CR014, CR015, CR016]
