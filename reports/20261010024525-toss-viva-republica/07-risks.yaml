      not evidence that exposure is diversified.
    claimRefs: [CR002, CR007, CR008, CR009, CR013, CR014]
figures:
  - id: "FR001"
    title: "Residual risk assessment matrix"
    type: "matrix"
    summary: >-
      Regulatory enforcement and group-governance implementation remain the highest residual
      exposures because mitigations are either unverified or too recent to establish a track record.
    data:
      columns:
        - "Likelihood"
        - "Impact"
        - "Mitigation maturity"
        - "Residual severity"
      rows:
        - label: "Data handling and consent recurrence"
          values: ["High: prior finding", "Critical", "Early-to-developing", "High"]
        - label: "Privileged access and log-control failure"
          values: ["High: prior finding", "Critical", "Unverified", "High"]
        - label: "Financial-conglomerate implementation"
          values: ["High: current obligation", "High", "Developing", "High"]
        - label: "Bank credit-quality deterioration"
          values: ["Medium: one independent report", "High", "Unknown", "Medium-high"]
        - label: "Partner integration disruption"
          values: ["High: stated dependency", "High", "Demonstrated but company-reported", "Medium"]
        - label: "Merchant payment interruption"
          values: ["Unknown", "High", "Preventive control disclosed", "Medium"]
    approximationNotes: >-
      Ordinal labels are analyst synthesis from the cited evidence, not calibrated probabilities;
      "unknown" is retained where no independent incident or performance series was available.
    claimRefs: [CR003, CR006, CR007, CR009, CR012, CR014, CR015, CR016]
callouts:
  - calloutType: "risk"
    title: "Thesis-break test"
    body: >-
      A repeat material privacy or privileged-access finding, failed compliance with the new
      group-supervision regime, sustained deterioration in bank credit quality beyond stated risk
      appetite, or an uncontained multi-product outage would invalidate the view that governance
      is converging with Toss's operating scale.
    claimRefs: [CR003, CR006, CR007, CR009, CR012, CR014]
