        - "Advertisers, merchants, users, and data processors"
        - "Targeting, campaign measurement, and offline-purchase attribution"
        - "Advertiser and processor concentration not disclosed"
        - "Consent, purpose, access, or partner-control failure limits the product or triggers enforcement"
        - "High"
        - "Creative review is disclosed; broader data controls are not described in the assigned source"
        - "Medium-high"
    notes: >-
      Public sources identify dependency categories but not revenue, traffic, funding, or
