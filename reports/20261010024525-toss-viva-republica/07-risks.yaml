        - "Toss Bank, Toss Securities, payments, insurance, and other group services"
        - "Delivery of the super-app's regulated product breadth"
        - "Structural dependence on several regulated entities"
        - "A group-control weakness propagates reputational or supervisory consequences across products"
        - "High"
        - "Financial-conglomerate supervision creates a formal group-control framework"
        - "High until implementation evidence is available"
