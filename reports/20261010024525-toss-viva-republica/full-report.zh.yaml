  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与估值立场
        blocks:
          - type: paragraph
            body: >-
              Viva Republica正处在估值的关键节点：这家韩国头部金融超级应用准备于2026年在美国交易所进行预期中的双重上市 IPO。公司已展现出很强的产品市场匹配度，注册用户超过30
              million，约占韩国人口的60%，月活跃用户在19 million 至24 million之间。更关键的是，Viva Republica已进入持续的合并盈利阶段：2024年收入1.96 trillion
              won（$1.4 billion）， 净利润$62 million；2025年收入迅速增至$1.8 billion，净利润达到$131.8 million。这些经营成果相较此前大规模
              烧钱时期实现了显著反转，也验证了在一个无摩擦界面中整合银行、支付处理、移动股票交易和信贷比较后，交叉销售的 核心效率。尽管如此，预期$10 billion至$15
              billion的估值区间仍需严格审视，因此应保持纪律性的观察建议。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV012
