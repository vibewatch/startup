  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层与人口覆盖
        blocks:
          - type: paragraph
            body: >-
              Toss 将用户分为四类主要客户：大众零售消费者、青少年数字原生用户、小企业与线下商户，以及企业广告客户。大众零售消费者构成基础层，使用无摩擦 P2P
              转账、免费信用评分查询、多银行账户聚合、个人贷款和存款账户。为培养早期品牌黏性，Toss 推出面向 7 至 18 岁用户的 Toss Teens，在 45 个月内将认证青少年用户规模扩大到超过
              3M。在商业端，Toss 服务超过 100,000 个企业账户，包括使用 Toss Payments 网关的线上商户、部署 Toss Place POS 硬件的线下零售商，以及使用专业记账服务的 200,000
              名企业主。最后，大型企业以品牌广告主身份使用 Toss，获取自有交易和消费行为信号。
            claimRefs:
              - CU001
              - CU003
              - CU005
              - CU006
              - CU014
