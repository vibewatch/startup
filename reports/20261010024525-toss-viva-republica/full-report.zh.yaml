      - number: '2.2'
        title: 市场规模、测算口径与渗透率
        blocks:
          - type: paragraph
            body: >
              评估 Toss 的可服务机会，需要从其主要运营子公司的不同口径出发。在零售银行领域，Toss Bank 是韩国仅有的三家持牌互联网银行之一，在约 5,160 万人口的经济体中直接争夺零售存款和信贷客户。Viva
              Republica 披露，注册用户数已从 2024 年的 2,800 万增至 2025 年超过 3,000 万，占全国人口 58% 以上；同时拥有 1,900 万月活用户和超过 100,000 家企业客户。

              总可服务市场（TAM）覆盖韩国零售银行存款和消费信贷市场，以及全国数字商务交易流量。可服务市场（SAM）集中在原生智能手机的零售银行、在线投资经纪和数字商户支付受理领域，Toss
              的移动交易系统（MTS）和商户支付解决方案在这些领域竞争。可获取市场（SOM）体现在 Toss Bank 快速积累 700 万银行客户、累计募资超过 $1.2 billion，以及 Toss Securities
              成立三个月内获得 350 万账户。集团收入从 2024 年的 $1.4 billion 增至 2025 年的 $1.8 billion，显示出显著的市场变现能力，尽管二级 IPO 前市场估值已较历史高点大幅压缩。
