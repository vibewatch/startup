      - number: '6.2'
        title: 采用轨迹、参与度与生物识别规模
        blocks:
          - type: paragraph
            body: >-
              Toss 2015 年从轻量级转账应用起步，注册用户从 2021 年的 20M 增至 2025 年超过 30M+，覆盖韩国 51.6 million 总人口的近 60%。活跃度一直很高，平台月活用户达到 19M
              至 24M，反映出稳定的日常使用。产品扩张循环带来了快速获客：Toss Securities 推出移动交易系统后三个月内吸引 3.5M 零售交易账户；Toss FacePay 在首次商业推广期间，于
              240,000 个商户门店招募了 1M 生物识别支付用户。公司计划在 2026 年底前将 FacePay 部署到 100 万家线下商户门店，试图凭借一秒人脸识别技术获取线下结账交易量。
            claimRefs:
