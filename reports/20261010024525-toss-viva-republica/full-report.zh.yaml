      - number: '1.3'
        title: 运营规模、产品生态与财务里程碑
        blocks:
          - type: paragraph
            body: >-
              Toss 在韩国本土消费市场的渗透率极高，已从早期采用者中的千禧一代扩展为无处不在的数字消费平台。公司官方运营指标显示，Toss 在 2025 年前注册用户已超过 30M+，相当于韩国 51.6 million
              人口的 58% 以上 [CO009]。按活跃使用情况看，Toss Pay 的月活交易用户超过 19.1M，并通过覆盖韩国零售和跨境合作的商户受理网络处理了累计超过 30T 韩元的现金转账（约 US$20
              billion）[CO010]。财务方面，Viva Republica 在 2024 年达到关键拐点：合并年收入超过 $1.4 billion，并首次实现约 $62 million 的集团经营利润；2025
              年收入进一步增至估计 $1.8 billion [CO011]。为保持透明度和公共企业沟通，Toss 将公司、新闻中心和招聘信息分别置于 Company、Newsroom 和 Careers
              页面，体现其已成长为成熟金融机构 [CO012]。
            claimRefs:
