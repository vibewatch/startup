      - number: '7.3'
        title: 财务模式与依赖风险
        blocks:
          - type: paragraph
            body: >-
              产品覆盖面既放大收入机会，也放大相关性下行风险。Baillie Gifford称，一个界面整合了70多种金融产品； EpicKor则指出，银行、证券、支付、保险和广告面临不同的监管与运营风险。Frontiers
              Global进一步报道称， 随着逾期上升，Toss Bank在2025年减少了中等利率贷款；但现有材料没有银行申报文件或监管数据，能够量化
              逾期、不良贷款、拨备或账龄表现，因此这只是方向性警示，并非经过计量的损失预测。公司依赖银行、 发卡机构、商户、受监管子公司和数据授权，这也意味着交易对手规则变化或控制失效可能影响多条用户旅程。
              因此，确切的交易对手集中度和分部盈利能力属于重大证据缺口，不能从用户规模推断。
            claimRefs:
              - CR002
              - CR009
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
