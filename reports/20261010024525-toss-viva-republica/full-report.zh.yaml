            - 内嵌 Mini Apps 与奖励
        - label: 变现（银行与信贷扩张）
          description: 转化为主银行业务、个人信用贷款、贷款比较市场和外币兑换。
          touchpoints:
            - Toss Bank 个人无抵押贷款
            - 多机构贷款比较引擎
            - 终身免费外汇兑换账户
        - label: 财富与投资（证券开户）
          description: 通过移动原生股票交易、实时美国股票零股交易和 ETF 投资拓展资本市场业务。
          touchpoints:
            - Toss Securities 移动交易系统（MTS）
            - 实时美国股票零股交易执行
            - 品牌股票搜索和自选列表提醒
        - label: 全渠道结账（FacePay 与线下 POS）
          description: 通过 1 秒生物识别人脸结账，从线上应用延伸至实体商户门店。
          touchpoints:
            - FacePay 生物识别摄像头终端
            - Toss Place 商户 POS 集成
            - 线下收据和奖励同步
        - label: B2B 与生态反馈闭环
          description: 通过消费者消费数据广告和商户财务运营软件实现企业变现。
          touchpoints:
            - Toss Ads 生活方式和购买定向
            - 商户记账和现金流账簿
            - Toss Payments PG 与 AI 集成
        - label: 机构与全球扩张
          description: 跨境汇款通道和国际市场进入将用户触达范围扩展至国内边界之外。
          touchpoints:
            - 30 国跨境汇款网络
            - Solana 区块链结算概念验证
            - 越南和澳大利亚市场计划
    approximationNotes: 旅程图阶段综合 Toss Consumer、Toss Bank、Toss Securities、Toss Place 和 Toss Ads 中已记录的客户触点。
