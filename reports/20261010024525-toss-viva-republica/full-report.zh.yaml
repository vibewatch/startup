              - CV012
      - number: '8.4'
        title: 监管摩擦与IPO前尽调要求
        blocks:
          - type: paragraph
            body: >-
              目前不能直接给出买入建议，主要障碍在于 Toss 最赚钱的变现渠道正遭遇尖锐监管摩擦。在国会2026年10月的 国政审计中，跨党派议员严厉质疑 Viva Republica
              的利益冲突：公司既是独立贷款比较平台，又通过 Toss Bank 以及计划中的线上投资关联融资工具直接发放信贷。议员特别针对 Toss 1.8 percent 的贷款经纪佣金，将其与传统 银行约0.08
              percent的收费结构对比，并称这种关系就像裁判同时下场当运动员。金融委员会主席 Lee Eok-won 已 正式承诺审查这些扭曲市场的风险，并依据金融控股公司监管规定评估 Viva
              Republica；机构投资者因此面临实质性 监管悬念。参与IPO前，关键尽调应聚焦法定费用上限、公司治理重组，以及 Toss Bank 信贷组合中的不良贷款走势。
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV011
              - CV014
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 建议依据：按当前估值继续观察
            body: >-
              Viva Republica 在2025年实现$1.8 billion收入和$131.8 million净利润，取得了重要财务里程碑；但其目标为$10 billion 至$15
              billion的美国IPO估值，对应中位数6.9x的高收入倍数，与IPO前二级市场形成脱节——后者的股份价格比历史高点 低74 percent。投资者应继续观察，直到正式 S-1
              申报文件确认分部层面的信贷风险并获得监管许可。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV012
