            body: >-
              Toss 的经济韧性建立在通过息差、经纪佣金和广告变现金融流程的能力上，而不是依赖微薄的银行卡交换费。西方市场的传统数字银行在支付交换费的单位经济性上举步维艰，Toss Bank
              则直接聚焦高毛利无抵押信贷和贷款比价佣金。Toss 于 2019
              年推出韩国首个多机构贷款比价市场后，已成为消费信贷发放的守门人，能在数秒内将零售借款人与数十家金融机构连接起来。每日余额查询、自动账单追踪和微型投资功能带来的高频使用，提升了用户留存；用户的主要金融记录都在
              Toss 面板中，平台转换成本也随之上升。不过，韩国消费者普遍同时在 KakaoBank 进行社交转账、在 Naver Pay 获取电商积分、在传统商业银行办理住房按揭，多平台使用仍很常见。
