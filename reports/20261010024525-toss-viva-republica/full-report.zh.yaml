      - number: '2.4'
        title: 监管约束、利益冲突与结构性瓶颈
        blocks:
          - type: paragraph
            body: >
              尽管消费者采用速度很快，Toss 仍面临监管阻力和市场结构摩擦，限制其在韩国无限扩张。Viva Republica
              是一家未上市金融控股公司，旗下管理银行、证券经纪、保险代理和支付实体，因此韩国监管机构与议员正严密审查其多产品生态。一次主要冲突发生在国会政治事务委员会审计金融服务委员会（FSC）期间，议员审查了 Toss
              进军面向中低信用借款人的线上投资关联金融（P2P 借贷）业务。

              议员和行业协会担心，Toss 进入线上投资关联金融会构成不公平竞争，并搭便车利用 47 家较小专业金融科技公司建立的生态。批评者还指出直接利益冲突：Toss
              一边运营独立贷款比价平台，一边分销自营贷款产品，像“裁判亲自下场参赛”。此外，Toss 的贷款经纪费约为贷款规模的 1.8%，而传统银行费率接近 0.08%；金融控股公司资本要求相关监管审查也仍在进行。
            claimRefs:
              - CM002
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 超级应用转化经济性
            body: >-
              Toss 在市场规模上的竞争优势，来自相邻垂直领域接近零的边际获客成本。韩国一半人口每天打开这款应用超过 10 次，Toss
              将互联网银行、证券交易和保险嵌入同一应用，由此绕过独立金融科技竞争者必须承担的高昂单独获客漏斗成本。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
          - type: callout
            title: 平台利益冲突与监管阻力
            body: Toss 在贷款比价领域的主导地位，使其进入直接放贷时面临严重渠道摩擦。议员和同业金融科技公司质疑 Toss 1.8% 的贷款经纪费和算法透明度，认为允许占主导地位的市场平台供应自营信贷产品会扭曲公平竞争。
            calloutType: risk
            claimRefs:
              - CM013
              - CM014
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与对手分类
        blocks:
          - type: paragraph
            body: >-
              韩国是全球数字化程度最高的金融服务生态之一，移动端普及率极高，消费金融竞争分为三个不同层级。Viva Republica 的 Toss 是领先的未上市消费金融科技超级应用，既挑战 KB
              Kookmin、Shinhan、Hana 和 Woori 等传统商业银行集团，也面对 KakaoBank 和 Naver Pay 等大科技平台对手。传统商业贷款机构依靠庞大的网点基础设施和企业关系，而 Toss
              完全靠移动用户体验建立分销体系：先以无摩擦 P2P 转账起步，再取得完整的银行和证券运营牌照。不过，Toss 仍受到 Kakao 和 Naver 的结构性竞争：前者通过 KakaoTalk
              掌握无处不在的消息分发，后者主导与搜索绑定的电商结账。此外，专业线上投资关联 P2P 借贷机构也在积极争夺次级和准优质借款人，使零售存款、无抵押信贷评估、商户支付和财富管理形成多线竞争战场。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP009
              - CP013
