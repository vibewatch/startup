  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 支柱
      - 投资论点
      - 反论点
      - 论点失效指标
    rows:
      - - 超级应用规模
        - 超过 30M 用户和 24M MAU 为金融交叉销售锚定了庞大的国内分发基础
        - 国内市场渗透率接近人口的 60%，限制新增用户增长
        - 月活用户停滞，或每日应用打开次数降至每位用户 10 次以下
      - - 盈利拐点
        - 2024 年扭亏至 $62M、2025 年盈利 $131.8M，显示银行和支付业务具备经营杠杆
        - 盈利仍易受信贷周期下行和 Toss Bank 贷款账簿拨备激增影响
        - 净利润反转，或不良贷款率升至高于一级商业银行平均水平
      - - 借贷引擎
        - 高毛利贷款经纪业务收取 1.8% 费用，捕获消费信贷中的丰厚中介价差
        - 国会审计关注贷款比较经纪费，FSC 反对平台自营交易和利益冲突
        - 监管限制贷款比较经纪佣金，或要求贷款关联方进行强制性结构隔离
      - - IPO 估值
        - 美国双重上市释放全球科技股估值套利，目标估值 $10B-$15B、募资 $2B-$3B
        - IPO 前二级市场交易价为每股 $21，较 2022 年高点下跌 74%
        - 二级市场股价无法收复 $23 的 200 日移动均线，或 IPO 目标估值下调至 $7.4B 以下
    notes: 将核心投资支柱与运营和监管反证对照；各行评估国内规模、盈利持久性、贷款利润率和退出定价。
