            body: >-
              Toss Bank 高度依赖自有机器学习风险引擎，为传统机构通常归类为次级或信用记录薄弱的借款人发放信贷；中低信用用户约占其客户群的
              34%。回测显示逾期表现较好，但在宏观经济持续收缩时，这种暴露会带来更高的信贷周期脆弱性。
            calloutType: risk
