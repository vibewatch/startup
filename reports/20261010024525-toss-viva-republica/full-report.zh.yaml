      - CR009
      - CR010
      - CR011
      - CR015
      - CR016
  - id: TR003
    title: 合作伙伴与依赖风险登记表
    columns:
      - 依赖项
      - 交易对手 / 层
      - 角色
      - 集中度
      - 失效情景
      - 严重程度
      - 缓解措施
      - 剩余暴露
    rows:
      - - 账户与银行卡连接
        - 数十家银行和银行卡公司
        - 账户 / 卡数据可用性与产品运营
        - 未披露各机构的具体占比
        - 上游接口或政策变更导致错误增加，或禁用某段用户旅程
        - 高
        - 已报告的历史抓取错误率下降
        - 中；缺少当前回退和集中度证据
      - - 多牌照集团运营
        - Toss Bank、Toss Securities、支付、保险及其他集团服务
        - 交付超级应用的受监管产品广度
        - 结构上依赖多个受监管实体
        - 集团控制薄弱会将声誉或监管后果扩散至各项产品
        - 高
        - 金融集团监管建立了正式的集团控制框架
        - 在取得实施证据前为高
      - - 广告与商户数据权限
        - 广告主、商户、用户和数据处理方
        - 定向投放、活动衡量和线下购买归因
        - 未披露广告主和处理方的集中度
        - 同意、目的、访问或合作伙伴控制失效，会限制产品或触发执法
        - 高
        - 已披露创意审查；指定来源未描述更广泛的数据控制
        - 中高
    notes: 公开来源识别了依赖类别，但没有按交易对手披露收入、流量、融资或交易集中度；因此，集中度为空是证据缺口，并不代表暴露已经分散。
