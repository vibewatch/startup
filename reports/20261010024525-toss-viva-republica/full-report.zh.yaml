      - number: '3.2'
        title: 能力矩阵与多垂直产品差异化
        blocks:
          - type: paragraph
            body: >-
              Toss 通过激进的多垂直整合区别于单一挑战者银行：它把银行、股票经纪、零售支付和保险比价集中在一个统一移动应用中，而非将服务拆散到互不相连的应用里。数字银行同业 KakaoBank
              起初优先发展核心零售银行、吸收存款和无抵押消费贷款，券商和投资管理则交给关联公司合作伙伴。相比之下，Toss Securities 建立了整合式移动交易系统，通过消除传统桌面 Home Trading
              Systems 固有的操作摩擦和视觉杂乱而快速扩大规模。Toss 还利用 2,400 万注册移动用户的自有交易数据，结合与 Korea Credit Bureau 合作开发的机器学习模型提升信用风险评分，使
              Toss Bank 能服务经常被保守的一线商业银行拒绝的中等信用借款人。这一整合界面形成强大的交叉销售循环，让 Toss 从日常工资入账一直延伸到主动股票交易，掌握用户的金融流程而不让分销价值流失到外部渠道。
