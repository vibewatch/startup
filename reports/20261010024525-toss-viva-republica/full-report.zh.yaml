      - number: '7.2'
        title: 运营可靠性与控制
        blocks:
          - type: paragraph
            body: >-
              运营风险分散在内部访问控制、第三方金融集成和追求快速试验的文化之中。Toss 表示，一个产品团队必须追踪数十家银行和卡公司的变更，而这些变更会直接影响其服务。同一份公司材料称，历史抓取错误率已从 10-20%
              降至 1%；这说明工程团队采取了缓解措施，但并非独立的服务水平历史记录。Toss
              还将执行优先于完美、愿意承担失败风险描述为文化原则。它们可以加快学习，但对于全国规模的金融平台，也会提升集中式控制、变更管理、访问审查和事件报告的价值。Emergency Payment Mode
              和客户赔付提供了可见的保障，但公开宕机频率、恢复表现和当前特权访问整改情况仍无法获得。
            claimRefs:
              - CR006
              - CR009
              - CR010
              - CR011
              - CR015
              - CR016
