      - number: '1.4'
        title: 监管监督、利益冲突审查与里程碑
        blocks:
          - type: paragraph
            body: >-
              随着 Viva Republica 从单一支付工具扩展为多元金融集团，其快速增长引来了日益严格的立法与监管审查。2025 年 10 月，国会政治事务委员会审计金融服务委员会期间，跨党派议员正式质疑 Toss
              计划进入线上投资关联个人信贷业务 [CO013]。议员强调了潜在利益冲突：Toss 一边运营领先的消费贷款比价平台，一边提供自营贷款产品，像是裁判亲自下场参赛，可能出现算法自我优待和利用竞争对手数据等风险
              [CO013]。审查还聚焦商业变现方式：Toss 对发放贷款收取 1.8% 的经纪佣金，远高于传统银行约 0.08% 的基准；议员也要求评估 Viva Republica 是否需要取得金融控股公司牌照
              [CO014]。尽管监管阻力加大，Toss 仍持续推出产品：2015 年发明便捷转账，2021 年上线数字银行和券商关联公司，2025 年部署生物识别 FacePay 和内置 Mini Apps [CO015]。
