      - number: '8.2'
        title: 融资历史与二级市场定价
        blocks:
          - type: paragraph
            body: >-
              理解 Viva Republica 的估值，需要把其私人机构融资履历与动荡的二级市场交易动态放在一起看。2021年6月， 公司完成了具有里程碑意义的$410 million Series G股权融资，由
              Alkeon Capital 领投，Korea Development Bank、 Altos Ventures 和 Greyhound Capital 共同参与；该轮融资确立了$7.4
              billion的官方投后估值，并使累计股权融资 超过$940 million。尽管私人二级市场 Forge Global 截至2026年2月仍给出$7.0 billion的基准估值，Notice等IPO前
              交易平台上的成交却反映出严重的价格压缩。Toss IPO前股份在2026年6月的交易价约为每股$21，较2022年1月$81的 峰值下跌74
              percent，并稳定位于其200日指数移动平均线下方。与此同时，一家使用“TOSS”商号的英国沙拉酱公司 完成种子轮等无关的早期活动，更凸显了区分 Viva Republica
              成熟资本结构与表面相关的创投标题的必要性。
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV008
              - CV013
