              Toss 已显示出强劲的财务拐点，经营利润从 2024 年的 90.7b 韩元增至 2025 年的 335.9b
              韩元，但监管与竞争反弹仍严重威胁其信贷分销护城河的持久性。国会审计金融服务委员会期间，执政党和在野党议员都尖锐质疑 Toss 的双重角色：既是开放式贷款比价市场，又通过 Toss Bank
