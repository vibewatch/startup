      - number: '8.3'
        title: 乐观、基准与悲观估值情景
        blocks:
          - type: paragraph
            body: >-
              我们的估值框架以 2025 年 $1.8 billion的基准收入和预期公开市场倍数为锚，评估 Viva Republica 的三条概率加权经营路径。乐观情景的概率为 25 percent：Viva
              Republica 成功将美国 IPO 定价在接近 $15.0 billion 上限的位置，在 Facepay 生物识别零售部署加速、国际市场取得进展的推动下，对应 8.3x 的历史收入倍数。基准情景的概率为
              50 percent，预计 IPO 估值为 $9.5 billion 至 $11.0 billion，对应 5.3x 至 6.1x 的收入倍数；这一情景反映稳健的
              两位数增长，但同时考虑更广泛的金融科技行业重估以及国内贷款增长温和。相反，悲观情景的概率为 25 percent，预计股权估值压缩至 $6.0 billion 至 $7.5 billion（收入倍数 3.3x 至
              4.2x），原因可能是 IPO 长期延迟、二级市场持续折价，或监管不利限制贷款比较费。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
