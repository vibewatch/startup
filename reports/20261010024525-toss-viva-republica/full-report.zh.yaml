      - number: '6.3'
        title: 企业部署与商业客户证据
        blocks:
          - type: paragraph
            body: >-
              除了聚合消费者，Toss 还与大型企业广告主和机构基础设施合作伙伴建立了商业牵引力。Olive Young、LG Uplus 和生活方式电商平台 Ohouse（Bucketplace）等广告主使用 Toss
              Ads，利用已验证的线下消费和财务画像指标进行受众定向。营销案例显示出切实的商业结果：Ohouse 报告称，以转化为导向的定向使获客成本降低 62%；某资产管理活动使接触到广告的 Toss 用户 ETF 持仓增加
              77%。在机构基础设施端，Toss Bank 于 2026 年 6 月与 Solana Foundation 签署谅解备忘录，试点覆盖 30 条国际走廊的稳定币跨境汇款，在韩国修订《外汇交易法》前，为 Toss
              布局机构级区块链结算。
            claimRefs:
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
      - number: '6.4'
        title: 客户韧性、监管摩擦与集中度暴露
        blocks:
          - type: paragraph
            body: >-
              尽管漏斗顶部获客能力很强，客户韧性和集中度仍有重要问题未解。Viva Republica 没有公开披露核心银行和券商子公司的 cohort 留存率、Gross Revenue Retention（GRR）、Net
              Revenue Retention（NRR）或账户层面流失率，因此无法独立评估客户生命周期盈利能力。与此同时，Toss 的商业客户关系正受到日益严格的监管审查。2026 年 10
              月国会审计期间，议员和金融科技行业组织质疑 Toss 1.8% 的贷款比价经纪费，该费率显著高于商业银行约 0.08% 的平均费率；他们还指称，Toss
              一边运营贷款比价市场，一边准备供应自营线上投资关联融资产品，可能产生利益冲突，引发对算法自我优待和平台锁定的担忧。
            claimRefs:
              - CU002
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 超级应用交叉销售飞轮推动多产品快速采用
            body: >-
              Toss 的核心获客引擎依靠无摩擦 P2P 转账和游戏化日常互动，以低边际获客成本建立庞大的消费用户基础。用户进入平台后，会被交叉销售高毛利银行、证券和支付产品；Toss Securities 三个月内达到
              3.5M 账户，FacePay 则在 240,000 家门店招募了 1M 生物识别用户，正是这一模式的证据。
            calloutType: insight
            claimRefs:
              - CU001
              - CU004
              - CU007
          - type: callout
            title: 贷款经纪费与平台自我优待引发监管审查
            body: >-
              平台从消费工具扩展到金融产品分销，已经遭到议员和小型金融科技创业公司的反弹。Toss 的 1.8% 贷款经纪费远高于传统银行约 0.08%
              的转介利润率；同时进入线上投资关联融资业务，也引发了关于算法偏向和自我优待的利益冲突指控。
            calloutType: risk
            claimRefs:
              - CU012
              - CU013
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险敞口
        blocks:
          - type: paragraph
            body: >-
              最需要影响决策的风险，不是产品本身受到广泛监管，而是集团层面的控制是否已经跟上业务广度。EIS 报告称，公司曾被处以约 KRW 6 billion
              罚款并收到企业警告，数百万条记录或用户受到数据合并和同意问题影响，另有 261 名员工涉及访问控制薄弱。EIS 还报告称，Viva Republica 于 2026 年 7
              月被认定为金融集团。这些说法来自本次指定来源池中的二手审查，而非监管机构原始命令，因此本报告将相关事件视为据报道的发现，准确法律措辞仍是尽调事项。Toss
              自有广告材料确认，公司会将消费和支付数据用于定向及活动衡量，因此同意设计和目的限制仍是持续的运营要求，而非仅需处理的历史遗留问题。
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR014
