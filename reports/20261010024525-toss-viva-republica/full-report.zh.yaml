      - number: '1.2'
        title: 资本化历程、估值演变与二级市场
        blocks:
          - type: paragraph
            body: >-
              Viva Republica 的资本化轨迹显示，在国内外知名风投机构支持下，公司快速积累了非公开资本。早期及扩张阶段的股权融资吸引了 Kleiner Perkins、Qualcomm Ventures、Altos
              Ventures、Sequoia Capital China 等一线全球风投，以及国内主权资金支持者 Korea Development Bank [CO005]。2021 年 6 月，Viva
              Republica 完成标志性的 Series G 融资，由美国投资公司 Alkeon Capital Management 领投，Greyhound Capital 参与，以 $7.4 billion
              的投后估值募得 $410 million 新资金，累计股权融资超过 $940 million [CO006]。随着全球金融科技估值普遍调整、IPO 连续推迟，Forge Global
              等机构交易平台的二级市场成交指示显示，截至 2026 年初，Toss 的估计非公开估值约为 $7.0 billion [CO007]。与此同时，公司管理层和金融市场报道显示，公司仍在准备赴美
              IPO，目标市场估值为 $10 billion 至 $15 billion，潜在募资额为 $2 billion 至 $3 billion；但具体申报时间和交易所选择仍取决于市场状况 [CO008]。
            claimRefs:
              - CO005
