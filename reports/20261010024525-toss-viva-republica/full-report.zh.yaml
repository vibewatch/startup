        title: 产品定义与统一超级应用模式
        blocks:
          - type: paragraph
            body: >-
              Toss 以一体化金融超级应用架构运营，目标是消除韩国消费者管理金融事务时的摩擦。Viva Republica 没有把银行、券商、保险和支付拆成互不相连的应用，而是将全部服务集中到一个原生移动客户端中。韩国监管的
              Open Banking 和 MyData 框架构成了这套消费体验的基础；这些框架要求国内金融机构开放标准化应用程序接口（API），支持余额查询和直接发起支付。借助双向能力，Toss 用户无需离开 Toss
              界面，就能汇总数十家商业银行账户的余额、监控现金流并即时转账。

              中央化金融控制平面的便利性体现在深度客户参与：活跃用户平均将 16 个不同金融账户连接到 Toss。除核心金融编排外，Toss 还在 2025 年部署 Mini
              Apps，提供无需安装的运行环境，承载数百种日常生活工具、购物工具和互动服务。Toss 把日常工具型流程与实时金融执行结合起来，维持了传统银行应用无法复制的高日活。
