chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、管理层与治理
        blocks:
          - type: paragraph
            body: >-
              Viva Republica 由创始人 Seunggun Lee（SG Lee）于 2011 年在韩国首尔注册成立。Lee 曾任牙医，创办公司是为了解决韩国消费者金融交易中的结构性摩擦。公司以 Toss
              这一商业品牌运营，先以简化 P2P 转账起家，随后扩展到全套数字银行、证券交易和支付聚合，最终成长为韩国领先的数字金融生态 [CO001]。管理层以创始人兼 CEO Seunggun Lee
              为核心；他深度参与公司文化、监管策略和激进的多子公司扩张，公司因此对关键人物存在较高依赖 [CO002]。高级运营和工程职责由多位高管分担，包括负责平台整体运营和关联公司协同的 COO Juyoung
              Yang，以及负责核心工程架构、信息安全和分布式微服务的 CTO Hyungsuk Lee [CO003]。管理团队共同负责一款整合式金融超级应用，将 40
              多项独立金融服务装进一个统一的移动应用，在维持扁平、自治组织结构的同时，压低各业务线的获客成本 [CO004]。
            claimRefs:
              - CO001
              - CO002
              - CO003
