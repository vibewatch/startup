      - number: '2.3'
        title: 买方画像、分部经济性与增长驱动
        blocks:
          - type: paragraph
            body: >
              Toss 产品组合的采用情况由不同客户群驱动，从大众数字原生零售消费者，到独立零售店商户和企业品牌广告主。在消费零售领域，用户通过便捷转账、免费信用评分查询和“Get Interest
              Now”日计复利存款等零费用工具获客。用户进入统一移动应用后，平台会交叉销售无抵押信贷、带实时碎股交易的国际股票交易，以及保险保障分析等高毛利金融产品。

              在商业领域，Toss Place 面向实体零售商户提供一体化 POS 硬件和应急支付模式，确保网络故障时交易仍能持续处理。与此同时，Toss Payments 借助 AI 集成的 Model Context
              Protocol（MCP）服务器接入，将商户线上结账集成周期从数周压缩到数分钟。此外，企业和消费品牌利用 Toss Ads，基于超过 3,000
              万应用用户的消费、账户持有和生活方式信号进行广告定向；在已曝光用户中，ETF 持仓增长 77% 等资产管理采用提升已有记录。
