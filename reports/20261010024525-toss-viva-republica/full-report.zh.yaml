          tone: neutral
        - label: Toss 简易转账上线
          date: '2015'
          detail: 推出无摩擦 P2P 转账，减少身份验证阻力。
          tone: positive
        - label: 免费查信用分
          date: '2017'
          detail: 在韩国率先提供全民免费移动信用分追踪，查询次数超过 10M。
          tone: positive
