              Viva Republica 从持续亏损的风投阶段转向合并盈利，显示核心业务的运营杠杆正在改善。合并净利润从 2024 年的 $62 million 增至 2025 年的 $131.8 million，净利率达到
              7.3%。利润率提升主要由 Toss Securities 快速成熟和 Toss Bank 的资产负债表放贷推动：Toss Securities 成立三个月内就获得 350
              万零售经纪账户。不过，成本结构仍包含大量服务交付费用，包括银行间转账网络费、支付基础设施开销和广告合作伙伴收入分成。更重要的是，关键单位经济性仍未向公众披露：综合 CAC、客户生命周期价值（LTV）和独立子公司的
              EBITDA 利润率均未报告。Toss Bank 的信用风险画像——包括不良贷款（NPL）比率、违约拨备以及中低信用借款人的信用损失准备覆盖率——也未出现在公开发布材料中，给机构投资评估造成实质性障碍。
