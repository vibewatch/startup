  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 这条决策路径把超级应用的规模和盈利拐点，与监管障碍及二级市场估值折价串联起来，最终得出“跟踪”建议。
    data:
      nodes:
        - id: scale
          label: 用户规模与参与度
          detail: 韩国拥有 3,000 万用户，MAU 为 2,400 万
        - id: profit
          label: 盈利反转
          detail: 营收 $1.8B，利润从 2024 年的 $62M 增至 2025 年的 $131.8M
        - id: regulatory
          label: 监管阻力
          detail: FSC 审查 1.8% 的贷款费用，以及 P2P 利益冲突
        - id: secondary
          label: 二级市场价格压缩
          detail: 注意到 IPO 前股份价格为 $21，较 2022 年高点下跌 74%
        - id: ipo-target
          label: 雄心勃勃的美国 IPO 目标
          detail: 目标估值 $10B-$15B，募资 $2B-$3B
        - id: decision
          label: 建议：跟踪
          detail: 估值偏高的判断仍待公开申报信息厘清
      edges:
        - from: scale
          to: profit
        - from: profit
          to: regulatory
        - from: regulatory
          to: secondary
        - from: secondary
          to: ipo-target
        - from: ipo-target
          to: decision
    approximationNotes: 展示综合运营指标、监管反弹和私募二级市场定价后的定性决策顺序。
