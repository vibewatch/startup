  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、可服务垂直领域与范围
        blocks:
          - type: paragraph
            body: >
              韩国金融服务市场长期由传统商业银行集团、碎片化支付网关和依赖网点的零售券商主导。Viva Republica 运营的 Toss 通过一体化“One
              App”金融超级应用切入该市场，把零售银行、消费信贷、财富管理、移动支付处理和商户 POS 运营整合在一起。Toss 并非只服务某一软件细分品类，而是在多个金融资金池中竞争：通过互联网银行 Toss Bank
              提供零售存款和贷款，通过 Toss Payments 处理数字支付，通过 Toss Securities 进行移动零售股票交易，并通过 Toss Place 提供门店商户基础设施。

              其可服务市场边界包括零售存款、尤其面向中低信用借款人的个人信贷、股票经纪佣金和商户结账处理。Viva Republica
              有意将资本密集型商业地产贷款、企业投资银行和实体银行网点管理排除在核心业务之外。现有替代方案包括传统商业银行巨头（如 KB Kookmin、Shinhan、Hana 和 Woori）、既有发卡机构，以及成熟的
              PC 端 Home Trading Systems（HTS）。Toss 用简化的移动流程取代认证数字证书和多步骤安全认证，把原本的基础转账从行政摩擦点变成高毛利金融产品的获客漏斗。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
              - CM008
