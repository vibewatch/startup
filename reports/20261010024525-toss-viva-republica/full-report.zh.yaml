      - number: '7.4'
        title: 缓释措施、监测与止损标准
        blocks:
          - type: paragraph
            body: >-
              公开记录显示，公司已采取一些具体的产品层面缓释措施：Toss称会自动发出欺诈警告，并为符合条件的金融 欺诈提供赔偿；Toss Place则称，其紧急支付模式旨在 POS 中断期间维持商户收款。这些控制措施能减少
              特定客户损害，但不能证明已解决此前披露的隐私、访问控制或集团治理问题。因此，投资监测应优先看证据， 而非听取保证：获取底层执法命令、独立整改测试、特权访问权限重新认证、集团监管里程碑、银行信贷账龄
              数据和经过审计的事件指标。触发投资逻辑失效的情形包括：隐私或访问控制问题再次达到重大程度、未满足 集团监管要求、银行逾期或拨备持续恶化并超出风险承受度，或多产品同时严重中断且没有经过测试的恢复方案。
              较轻但仍重要的警示是：公司越来越依赖单一数据、资金、商户或金融机构合作伙伴，却没有记录在案的备用方案。
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR009
              - CR012
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: 投资逻辑失效测试
            body: 隐私或特权访问问题再次达到重大程度、未能遵守新的集团监管制度、银行信贷质量持续恶化并超出既定风险承受度， 或多产品中断失去控制，都会推翻“治理水平正追上 Toss 运营规模”的判断。
            calloutType: risk
