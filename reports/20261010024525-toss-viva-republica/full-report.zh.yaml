  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 隐含估值
      - 倍数基础
      - 关键运营假设
      - 下行风险与概率
    rows:
      - - 乐观情景
        - $14.0B - $16.0B
        - 7.8x - 8.9x 2025 年收入
        - 美国双重上市按区间高端顺利完成；Facepay 覆盖 1M 商户；2026 年收入超过 $2.3B，净利润超过 $200M
        - 投资关联金融业务获得监管许可；概率 25%
      - - 基准情景
        - $9.5B - $11.0B
        - 5.3x - 6.1x 2025 年收入
        - IPO 定价接近 $10B 门槛；收入增长放缓至 15-20%；贷款比较费利润率略有压缩，但银行存款增长予以抵消
        - 上市推迟至 2026 年末，或 IPO 定价小幅让步；概率 50%
      - - 悲观情景
        - $6.0B - $7.5B
        - 3.3x - 4.2x 2025 年收入
        - IPO 推迟；二级市场疲弱（每股 $21）迫使公司进行私募延长轮或下调轮；FSC 施加严格的经纪费上限
        - 施加控股公司资本要求；贷款违约激增；概率 25%
    notes: 情景倍数以 2025 年集团合并收入 $1.8B 为基础建模；估值表示在不同公开市场反应和监管结果下的投后股权价值区间。
