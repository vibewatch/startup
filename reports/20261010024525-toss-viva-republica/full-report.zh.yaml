      - 影响
      - 已披露的缓解措施
      - 剩余暴露
      - 未解决缺口
    rows:
      - - 敏感数据访问或访问日志留存不完整
        - 高：EIS 报告称此前已有控制问题
        - 严重
        - 据报已有监管流程和内部纪律措施
        - 在有独立整改证据前为高
        - 当前最小权限覆盖、日志完整性、重新认证频率和独立审计
      - - 银行或银行卡集成变更导致账户查看服务降级
        - 高：Toss 称数十家机构可直接影响服务
        - 高
        - Toss 报告称已将抓取错误率从 10-20% 降至 1%
        - 中
        - 当前错误预算、机构层面的集中度、回退设计和外部测得的可用性
      - - 快速试验造成协调、控制或客户影响方面的缺陷
        - 中：速度和愿意承担失败风险是明确的文化选择
        - 对受监管产品变更而言为高
        - 已描述跨职能产品负责制和数据驱动测试
        - 中高
        - 中央合规门槛、回滚控制、模型风险审查和重大变更审批
      - - 商户支付或 POS 中断
        - 未知：没有独立的事件序列可供查阅
        - 对受影响商户而言为高
        - Toss Place 报告有 Emergency Payment Mode；公司称在发布时 POS 设备尚未经历此类故障
        - 中，但故障频率没有得到支持
        - 可用性历史、恢复时间结果、处理方依赖和灾难恢复测试证据
    notes: 严重程度反映客户和监管后果；可能性标签对应已报告的既往问题、明确的依赖关系或明确的证据缺口，公司描述的缓解措施不视为经过独立测试。
