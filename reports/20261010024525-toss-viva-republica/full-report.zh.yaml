      - number: '5.4'
        title: 自有信贷评估、信任框架与技术风险
        blocks:
          - type: paragraph
            body: >-
              Toss 的核心算法差异化来自自有信用评分引擎，专门应对韩国零售贷款市场的结构性缺口。传统国内商业银行往往以次级利率重罚信用记录薄弱或中等信用借款人。Toss Bank
              用细粒度交易元数据——包括转账频率、商户消费时间和合并现金余额——补充传统征信数据。Korea Credit Bureau（KCB）利用 200 万条用户记录核验后确认，Toss 引擎相比传统模型将区分能力提升
              150%，并将逾期率降低 30%；中低信用群体约占 Toss Bank 借款人的 ~34%，其再融资利率平均降低 4.2 个百分点。

              为保护高交易频率下的用户，Toss 将安全控制直接嵌入支付流程。其自动化 Fraud Siren 系统实时将收款账户与警方诈骗数据库交叉比对，在交易完成前发出警告。此外，Toss
              提供全面赔付政策，为金融诈骗造成的货币损失提供最高 KRW 50 million 的保障。然而，结构性约束依然存在：韩国关于非金融企业持股的银行监管规定迫使 Toss 与 Standard Chartered
              等机构合作，而不能保持完全的企业自主性，这说明仅靠技术执行无法彻底解决监管脆弱性。
            claimRefs:
              - CE006
              - CE007
              - CE010
              - CE011
