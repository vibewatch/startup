  title: "Valuation"
  summary: "Viva Republica is targeting a 2026 US IPO at an ambitious $10B to $15B valuation following its return to operating profitability, but secondary pre-IPO markets price shares at a steep 74% discount from peak levels amid intensifying regulatory scrutiny over credit platform conflicts of interest."
sections:
  - id: "investment-thesis"
    title: "Investment Thesis and Valuation Posture"
    body: "Viva Republica stands at a pivotal valuation juncture as South Korea's premier financial super app prepares for an anticipated dual-listed initial public offering on a US exchange in 2026. The company has demonstrated formidable product-market fit, expanding its user base beyond 30 million registered users, representing nearly 60 percent of the South Korean population, with monthly active engagement between 19 million and 24 million users. Crucially, Viva Republica crossed into sustained consolidated profitability, generating 1.96 trillion won ($1.4 billion) in revenue and $62 million in net profit in 2024, followed by rapid top-line growth to $1.8 billion and $131.8 million in net earnings in 2025. These operating results represent a dramatic turnaround from prior periods of heavy cash burn, validating the core cross-selling efficiency of unifying banking, payment processing, mobile stock trading, and credit comparison within a single frictionless interface. Nonetheless, the prospective valuation range of $10 billion to $15 billion demands rigorous scrutiny, warranting a disciplined track recommendation."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV012"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "valuation-context"
    title: "Financing History and Secondary Market Pricing"
    body: "Understanding Viva Republica's valuation requires reconciling its private institutional financing pedigree with turbulent secondary market trading dynamics. In June 2021, the company completed a landmark $410 million Series G equity financing round led by Alkeon Capital alongside Korea Development Bank, Altos Ventures, and Greyhound Capital, establishing an official post-money valuation benchmark of $7.4 billion and lifting total equity raised above $940 million. Although secondary private marketplace Forge Global continued to quote a $7.0 billion baseline as recently as February 2026, transactions across pre-IPO trading venues like Notice reflect severe price compression. Toss pre-IPO shares traded at approximately $21 per share in June 2026, marking an alarming 74 percent drawdown from their peak of $81 in January 2022 and trading firmly below their 200-day exponential moving average. Meanwhile, unrelated early-stage activity—such as a seed round completed by a UK salad dressing company sharing the 'TOSS' trade name—underscores the necessity of distinguishing Viva Republica's mature capital structure from nominal venture headlines."
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV013"
    tableRefs:
      - "TV002"
  - id: "scenario-analysis"
    title: "Bull, Base, and Bear Valuation Scenarios"
    body: "Our valuation architecture evaluates Viva Republica across three probability-weighted operating trajectories anchored against its 2025 baseline revenue of $1.8 billion and prospective public market multiples. Under the bull case scenario, which carries a 25 percent probability, Viva Republica successfully prices its US IPO near the upper bound of $15.0 billion, translating to an 8.3x trailing sales multiple driven by accelerated Facepay biometric retail deployments and international traction. The base case scenario, modeled with a 50 percent probability, contemplates an IPO valuation range of $9.5 billion to $11.0 billion, representing a 5.3x to 6.1x sales multiple that reflects solid double-digit expansion tempered by broader fintech sector re-rating and modest domestic loan growth. Conversely, the bear case scenario carries a 25 percent probability and models an equity valuation compressing to between $6.0 billion and $7.5 billion (3.3x to 4.2x sales), precipitated by extended IPO delays, persistent secondary market discounting, or adverse regulatory restrictions on loan comparison fees."
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV012"
    tableRefs:
      - "TV003"
  - id: "diligence-and-risks"
    title: "Regulatory Friction and Pre-IPO Diligence Directives"
    body: "The principal barrier preventing an immediate buy recommendation is the emergence of acute regulatory friction surrounding Toss's most profitable monetization channels. During the National Assembly's October 2026 parliamentary audit, bipartisan lawmakers raised sharp conflict-of-interest concerns regarding Viva Republica's dual role as both an independent loan comparison platform and a direct credit originator through Toss Bank and planned online investment-linked financing vehicles. Lawmakers specifically targeted Toss's 1.8 percent loan brokerage commission, contrasting it with traditional banking fee structures of approximately 0.08 percent and characterizing the dynamic as a referee competing as an active player. With Financial Services Commission Chairman Lee Eok-won formally committing to review these market-distortion risks and evaluate Viva Republica under financial holding company regulations, institutional investors face material regulatory overhang. Essential diligence asks prior to IPO participation must focus on statutory fee caps, corporate governance restructuring, and the non-performing loan trajectory across Toss Bank's credit portfolio."
    claimRefs:
      - "CV006"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV014"
