company:
  name: Toss (Viva Republica)
chapter:
  number: 2
  title: Market Analysis
  summary: Toss operates across South Korea's retail banking, payments, brokerage, and merchant POS markets, transforming an initial P2P transfer user base into a multi-vertical financial platform serving over 30 million registered users. While digital banking and consumer credit offer strong structural growth, expansion into merchant services and online investment-linked financing introduces regulatory friction, fee scrutiny, and platform conflict-of-interest challenges.
sections:
  - id: market-boundary-and-scope
    title: Market Boundary, Addressable Verticals, and Scope
    body: >
      South Korea's financial services market has historically been dominated by traditional commercial banking groups, fragmented payment gateways, and branch-heavy retail brokerages. Toss, operated by Viva Republica, addresses this market through an integrated "One App" financial super-app model that consolidates core retail banking, consumer credit, wealth management, mobile payment processing, and merchant point-of-sale operations. Rather than serving a single discrete software category, Toss competes across multiple financial pools: retail bank deposits and lending via internet-only Toss Bank, digital payment processing through Toss Payments, mobile retail stock trading through Toss Securities, and in-store merchant infrastructure via Toss Place.


      The addressable market boundary encompasses retail deposits, personal credit loans particularly targeting mid-to-low credit borrowers, equity brokerage commissions, and merchant checkout processing. Crucially, Viva Republica deliberately excludes capital-heavy commercial real estate lending, corporate investment banking, and physical bank branch management from its core operations. Status-quo substitutes include legacy commercial banking giants (such as KB Kookmin, Shinhan, Hana, and Woori), incumbent card issuers, and established PC-based Home Trading Systems (HTS). By replacing accredited digital certificates and multi-step security authentications with streamlined mobile workflows, Toss transformed basic money transfers from an administrative friction point into an acquisition funnel for high-margin financial products.
    claimRefs:
      - CM001
      - CM002
      - CM006
      - CM007
      - CM008
    tableRefs:
      - TM001
    figureRefs:
      - FM001
  - id: market-sizing-and-segments
    title: Market Sizing, Sizing Lenses, and Penetration
    body: >
      Evaluating the addressable opportunity for Toss requires multiple sizing lenses across its primary operating subsidiaries. In retail banking, Toss Bank operates as one of only three licensed internet-only banks in South Korea, competing directly for retail deposits and credit loans within an economy of approximately 51.6 million residents. Viva Republica reported reaching 28 million registered users by 2024 and surpassing 30 million users by 2025, representing more than 58% of the national population, alongside 19 million monthly active users and over 100,000 business customers.


      The total addressable market (TAM) spans the South Korean retail banking deposit and consumer credit market, alongside national digital commerce transaction flows. The serviceable addressable market (SAM) concentrates on smartphone-native retail banking, online investment brokerage, and digital merchant payment acceptance, where Toss's mobile trading system (MTS) and merchant payment solutions compete. The serviceable obtainable market (SOM) is demonstrated by Toss Bank's rapid accumulation of 7 million banking customers and over $1.2 billion in cumulative capital raised, paired with Toss Securities capturing 3.5 million accounts within three months of inception. Consolidated group revenue expanded from $1.4 billion in 2024 to $1.8 billion in 2025, validating substantial market monetisation despite severe secondary pre-IPO market valuation compression from historical peaks.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
      - CM007
      - CM008
      - CM009
      - CM010
