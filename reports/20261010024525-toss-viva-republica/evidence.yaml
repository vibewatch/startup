evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: Executive Leadership and Board Governance
    missingEvidence: >-
      Complete board of directors roster, independent director seats, and voting control distribution across Viva
      Republica common and preferred share classes.
    whyItMatters: >-
      Pre-IPO governance evaluation requires clarity on founder voting rights, super-voting structures, and board
      committee independence ahead of a projected US listing.
    diligencePath: >-
      Request Viva Republica's Certificate of Incorporation, shareholders agreement, and pre-IPO corporate governance
      disclosures.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: Stakeholder and Institutional Cap Table Breakdown
    missingEvidence: >-
      Exact percentage ownership breakdown by share class across Series A through Series G institutional investors and
      employee stock option pools.
    whyItMatters: >-
      Detailed cap table economics determine liquidation preference overhang, secondary market transfer constraints, and
      public float availability.
    diligencePath: >-
      Review company cap table disclosures in Korean corporate registry filings and prospective S-1/F-1 registration
      statements.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: Consolidated Group Financial Audits (2022-2025)
    missingEvidence: >-
      Complete audited IFRS consolidated financial statements detailing segment revenues, loan loss provisions for Toss
      Bank, and net margins across subsidiaries.
    whyItMatters: >-
      Sustained group profitability across banking, brokerage, and payments is essential to justify proposed $10B-$15B
      public market valuation targets.
    diligencePath: >-
      Examine DART (Data Analysis, Retrieval and Transfer System) annual audit filings in South Korea and SEC draft
      registration exhibits.
    relatedQuestionRefs:
      - QO004
      - QO009
  - type: private-evidence-only
    severity: material
    topic: banking-loan-book-quality
    missingEvidence: >-
      Audited non-performing loan (NPL) ratios, delinquency figures, and loan loss provisioning schedules for Toss
      Bank's credit portfolio.
    whyItMatters: >-
      Sizing the obtainable lending market requires assessing whether credit expansion among mid-to-low credit borrowers
      is generating sustainable net interest margin or escalating credit impairment.
    diligencePath: >-
