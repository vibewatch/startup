company:
  name: "Toss (Viva Republica)"
chapter:
  number: 6
  title: "Customers"
  summary: "Toss has established dominant consumer reach in South Korea with over 30 million registered users and 19 to 24 million monthly active users, converting peer-to-peer transfer volume into high-frequency banking, securities trading, and biometric FacePay adoption. However, durability is tempered by the lack of disclosed cohort retention or Net Revenue Retention metrics, coupled with emerging regulatory friction over loan comparison brokerage fees and potential self-preferencing conflicts."
sections:
  - id: "customer-segmentation"
    title: "Customer Base Segmentation and Demographic Reach"
    body: "Toss segments its user base across four primary customer classes: mainstream retail consumers, teen digital-native users, small business and offline merchants, and enterprise advertising clients. Mainstream retail consumers form the foundational tier, utilizing frictionless peer-to-peer money transfers, free credit score checks, multi-bank account aggregation, personal lending, and deposit accounts. To establish early brand attachment, Toss launched Toss Teens for users aged 7 to 18, scaling past 3 million verified teen users within 45 months. On the commercial side, Toss serves more than 100,000 business accounts, spanning online merchants using Toss Payments gateways, offline retailers deploying Toss Place point-of-sale hardware, and 200,000 business owners utilizing specialized bookkeeping services. Finally, large corporate enterprises engage Toss as brand advertisers to access proprietary transaction and spending behavioral signals."
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU005"
      - "CU006"
      - "CU014"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-engagement"
    title: "Adoption Trajectory, Engagement, and Biometric Scale"
    body: "From its origin as a lightweight money transfer application in 2015, Toss expanded its registered user base from 20 million in 2021 to over 30 million by 2025, capturing nearly 60 percent of South Korea's total population of 51.6 million. Active engagement has remained intense, with platform monthly active users reaching between 19 million and 24 million, reflecting regular daily utility. Product expansion loops have demonstrated rapid customer onboarding: Toss Securities attracted 3.5 million retail trading accounts within three months of launching its mobile trading system, while Toss FacePay enrolled 1 million biometric payment users across 240,000 merchant store locations within its initial commercial rollout. The company has targeted deploying FacePay to one million offline merchant stores by late 2026, attempting to capture in-person checkout volume through one-second facial recognition technology."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "enterprise-and-named-customer-proof"
    title: "Enterprise Deployments and Commercial Customer Evidence"
    body: "Beyond consumer aggregation, Toss has established commercial traction with major enterprise advertisers and institutional infrastructure partners. Advertisers such as health and beauty retail giant Olive Young, telecommunications operator LG Uplus, and lifestyle e-commerce platform Ohouse (Bucketplace) utilize Toss Ads to target audiences using verified offline spending and financial profile indicators. Campaign case studies show tangible commercial outcomes: Ohouse reported a 62 percent reduction in customer acquisition costs under conversion-focused targeting, while an asset management campaign generated a 77 percent increase in ETF holdings among exposed Toss users. At the institutional infrastructure level, Toss Bank signed a memorandum of understanding with the Solana Foundation in June 2026 to pilot stablecoin cross-border remittances across 30 international corridors, positioning Toss for institutional blockchain settlement ahead of South Korea's revised Foreign Exchange Transactions Act."
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU003"
  - id: "durability-retention-and-concentration-risks"
    title: "Customer Durability, Regulatory Friction, and Concentration Exposures"
    body: "Despite formidable top-of-funnel customer adoption, significant durability and concentration questions remain unresolved. Viva Republica does not publicly disclose cohort-level retention rates, Gross Revenue Retention (GRR), Net Revenue Retention (NRR), or account-level churn across its core banking and brokerage subsidiaries, preventing independent assessment of lifetime customer profitability. Simultaneously, Toss faces escalating regulatory scrutiny regarding its commercial customer relationships. During an October 2026 National Assembly audit, lawmakers and fintech trade groups challenged Toss's 1.8 percent loan comparison brokerage fee—substantially above commercial bank fee averages of roughly 0.08 percent—and alleged potential conflicts of interest as Toss prepares to supply proprietary online investment-linked financing products while operating the loan comparison marketplace, raising concerns over algorithmic self-preferencing and platform lock-in."
    claimRefs:
      - "CU002"
      - "CU012"
      - "CU013"
      - "CU014"
