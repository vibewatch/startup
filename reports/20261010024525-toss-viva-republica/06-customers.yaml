callouts:
  - calloutType: "insight"
    title: "Super-app cross-sell flywheel drives rapid multi-product adoption"
    body: "Toss's core customer acquisition engine leverages friction-free peer-to-peer transfers and gamified daily engagement to build a massive 30-million-user consumer base at low marginal acquisition cost. Once onboarded, users are cross-sold high-margin banking, securities, and payment products, evidenced by Toss Securities reaching 3.5 million accounts in three months and FacePay enrolling 1 million biometric users across 240,000 stores."
    claimRefs:
      - "CU001"
      - "CU004"
      - "CU007"
  - calloutType: "risk"
    title: "Regulatory scrutiny on loan brokerage fees and platform self-preferencing"
    body: "The platform's expansion from consumer utility into financial product distribution has triggered pushback from lawmakers and smaller fintech startups. Toss's 1.8% loan brokerage fee—substantially higher than traditional bank referral margins of approximately 0.08%—and its simultaneous entry into online investment-linked financing have generated conflict-of-interest allegations regarding algorithm bias and self-preferencing."
    claimRefs:
      - "CU012"
      - "CU013"
