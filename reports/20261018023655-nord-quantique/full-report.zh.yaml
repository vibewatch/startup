chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、运营阶段与商业模式
        blocks:
          - type: paragraph
            body: >-
              Nord Quantique 在公开资料中始终被描述为一家位于魁北克舍布鲁克、成立于 2020
              年的量子硬件公司。它的核心方案并非传统的高量子比特数处理器，而是开发将纠错保护编码进量子比特内部的超导玻色子量子比特，并宣称可实现 1:1
              的逻辑比特与物理比特比例。这套架构支撑了一种资本效率叙事：用更少设备实现机架级部署，并最终交付容错系统。公司的非上市状态比商业成熟度更清晰：2026 年 10 月的一份市场资料将其列为私营公司，尚未宣布 IPO
              或公开股票代码。现有证据无法证明其拥有经常性收入模式、量产客户基础，或舍布鲁克总部之外经过核实的地点布局，因此这些项目仍是尽调缺口，而不是零值。
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
              - CO012
      - number: '1.2'
        title: 资本结构、估值与利益相关方
        blocks:
          - type: paragraph
            body: >-
              Nord Quantique 于 2026 年 5 月 18 日宣布获得 $30 million 投资，披露的支持方包括 BDC 和 Fidelity Investments Canada
              管理的基金。独立资料还报道其 2026 年 5 月估值约为 $1.4
              billion，但指定证据中没有任何申报文件或已披露条款清单确认证券条款、稀释程度或投资者权利。更重要的是，“累计融资额”尚未成为统一口径。Multiples 报道三轮融资合计 $38 million，而
              Entangled Future 按不同轮次历史和汇率换算方法报告 $73 million。公司材料另行披露 Canadian Quantum Champions Program 提供 $16
              million，DARPA Stage B 提供 $5 million，且该阶段最多还可能获得 $10 million。因此，股权、拨款、分阶段奖励和汇率换算不应压缩为一个可用现金数字。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO005
              - CO008
      - number: '1.3'
        title: 领导层、创始人覆盖与治理
        blocks:
          - type: paragraph
            body: >-
              公开资料将 Julien Camirand Lemyre 和 Philippe St-Jean 认定为两位创始人，目前分别担任 CEO 和 CBO。可见的运营团队还包括技术负责人 Marc-Antoine
              Lemonde 和 Dany Lachance-Quirion；2026
              年新任命的财务、传播和营销负责人，说明公司正借融资和商业化推进组织职业化。这份名单有参考价值，但不等于治理证据。指定来源没有提供当前董事会名单、委员会结构、创始人投票控制权、投资者同意权或继任计划。公开叙事仍高度聚焦创始人，而缺少经核实的董事会图谱，也就无法对监督质量或关键人物风险缓释作出明确判断。
