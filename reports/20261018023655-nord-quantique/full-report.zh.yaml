  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 真正的竞争集是架构选择，而不只是一串初创公司
        blocks:
          - type: paragraph
            body: >-
              保留的资料将 Nord Quantique 的直接竞争定义为“容错量子计算如何构建”的竞争，而不是简单比拼量子比特数量。Nord 自身材料和 2024 年观点论文认为，超导电路中的玻色子网格 / GKP
              编码可以把量子纠错推进到单个物理单元层面；同一批资料则将 IBM 和 Google 的表面码项目视为现有替代方案，但后者仍承担巨大的冗余和控制开销。独立可比资料还显示，投资者已经把 Nord
              与一批私营和上市量子硬件公司归入同一组，而 Quantummarketcap 将 Rigetti 视为最接近的上市超导代理标的，并非直接替代持有
              Nord。本市场因此同时存在直接同行、上市市场代理和架构替代方案，它们都在争夺未来同一笔 FTQC 预算。
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP009
              - CP015
