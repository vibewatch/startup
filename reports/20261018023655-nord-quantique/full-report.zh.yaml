      - number: '8.3'
        title: 最终尽调问题、下行触发条件与退出准备度
        blocks:
          - type: paragraph
            body: >-
              退出准备度仍停留在概念阶段，没有文档支持。Quantum Market Cap 称 Nord Quantique 仍是私营公司，没有公开股票代码或已宣布 IPO，并明确警告买入 Rigetti 并不能获得
              Nord Quantique 的所有权敞口。因此，回报取决于后续私募轮、战略收购兴趣，或保留来源中尚不可见的未来 IPO
              流程。下一轮尽调应聚焦付费部署或签约试点、客户和利润率披露，以及当前优先股堆叠，因为这些缺失事实将决定今天的标题估值是否站得住。论点失效触发条件很明确：相对公司规模化目标的路线图延迟、融资事件暴露出比独角兽标题所暗示更严苛的稀释条款，或同业估值收缩时商业化数据持续缺失。
