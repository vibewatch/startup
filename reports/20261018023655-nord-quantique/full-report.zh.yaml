  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 当前最合适的决定是持续跟踪：融资验证和技术上行空间仍不足以抵消商业验证缺失及技术处于早期阶段的保留意见。
    data:
      nodes:
        - id: round
          label: 据报道的独角兽轮融资
          note: 独立追踪机构交叉验证了 $30M 轮融资和 $1.4B 估值。
        - id: optionality
          label: 融资选择权
          note: Quantum Champions 和 DARPA 支持拓宽了上行路径，但不能证明商业牵引力。
        - id: architecture
          label: 硬件效率上行空间
          note: 如果规模化说法成立，玻色码 / GKP 定位可能压低量子比特和资本需求。
        - id: validation
          label: 验证缺口
          note: 部分重点里程碑依赖后选择、公司论文，或仍落后于外部基准。
        - id: disclosure
          label: 商业不透明
          note: 保留的公开证据没有披露收入、客户、消耗或优先权结构细节。
        - id: recommendation
          label: 持续跟踪 / 估值偏高
          note: 保持关注，但在投资判断买入前等待更充分的证明或更好的价格。
      edges:
        - from: round
          to: recommendation
          label: 锚定价格
        - from: optionality
          to: recommendation
          label: 支撑上行空间
        - from: architecture
          to: recommendation
          label: 解释溢价
        - from: validation
          to: recommendation
          label: 限制信心
        - from: disclosure
          to: recommendation
          label: 阻止买入
    approximationNotes: 这是逻辑图，而非加权评分模型；节点顺序表示因果流，而非数值贡献。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV011
      - CV012
      - CV013
      - CV016
