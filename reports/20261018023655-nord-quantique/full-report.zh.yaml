  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 可见的商业化路径从技术验证走向未来的企业部署；当前证据在验证和融资阶段最为充分。
    data:
      items:
        - label: 研究实验室验证
          actor: 研究实验室
          tone: neutral
          touchpoints:
            - 原型机在加拿大研究实验室接受测试
            - 技术里程碑早于具名客户披露
        - label: 政府筛选与资助支持
          actor: DARPA 和加拿大项目
          tone: neutral
          touchpoints:
            - 参与 DARPA B 阶段
            - 加拿大 Quantum Champions 非稀释性资金
        - label: 投资者融资
          actor: VC 和战略投资者
          tone: positive
          touchpoints:
            - $30M 轮融资和据报道的 $1.4B 估值
            - 验证依据是资本市场，而不是客户数量
        - label: 目标工业用例
          actor: 潜在企业研发买家
          tone: opportunity
          touchpoints:
            - 材料科学、制药、化学、优化和密码学用例
            - 证据池未披露具名生产客户
        - label: 未来生产部署
          actor: 潜在付费客户
          tone: risk
          touchpoints:
            - 目标是在 2030 前实现有用的容错系统
            - 公开推出时间仍是路线图表述，而非已安装基数的表述
        - label: 扩张与留存循环
          actor: 同一批客户及相邻客户
          tone: risk
          touchpoints:
            - 先落地再扩张仍是假设
