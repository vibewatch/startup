              追逐的是快速变化的技术前沿，并未独占这项技术。对照 Multiples 的可比公司集合，报道中的 $1.4 billion 对一家稀缺的私营量子硬件公司而言并非不合理，但仅凭公开证据看，谈不上明显便宜。
