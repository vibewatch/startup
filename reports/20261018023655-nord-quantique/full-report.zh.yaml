        title: 买方、采用路径和约束仍是关键尽调缺口
        blocks:
          - type: paragraph
            body: >-
              资料支持一张初步买方图谱，但没有完整披露采购路径。第三方资料将 Nord Quantique 描述为 B2B
              产品公司，公司自身则列出材料科学、制药、密码学、优化和仿真等应用领域。由此看，最终用户可能是企业或政府研发机构；在现有证据中，公共项目和私人投资者是最明确的当前付款方。采用驱动因素很直接：如果 Nord
              Quantique
              能保持其宣称的效率优势，就可能降低实用容错系统所需的量子比特数量、资本负担和数据中心占地。约束同样清楚：公开披露仍缺少具名客户、预算负责人、合同结构，以及研究里程碑之外有来源支持的系统级基准，因此商业化时点更像投资假设，而非已证实的需求曲线。
