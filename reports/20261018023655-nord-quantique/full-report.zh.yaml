            - 优化
            - 密码学
        - label: 逻辑编码
          detail: 材料将 GKP 及相关玻色码描述为核心机制，把纠错嵌入每个逻辑量子比特。
          modules:
            - 单量子比特逻辑编码
            - 比特翻转与相位翻转纠错
            - 1:1 逻辑量子比特与物理量子比特目标
        - label: 多模扩展
          detail: Tesseract 概念将一个逻辑量子比特扩展到两个量子模式上，以捕捉比单模设置更多的错误类型。
          modules:
            - 双模腔体编码
            - 泄漏与控制错误检测
            - 32 周期公开验证点
        - label: 物理存储器
          detail: 高质量超导腔体或谐振器模式提供长寿命的玻色存储单元。
          modules:
            - 腔体或谐振器模式
            - 玻色态
            - 一份第三方简介提及光子接口
        - label: 控制与纠错
          detail: 辅助 transmon、微波脉冲以及反复的综合征提取或自主纠错周期，用于操纵并稳定编码状态。
          modules:
            - 辅助 transmon
            - 微波脉冲控制
            - 综合征提取与复位
        - label: 系统规模化
          detail: 公开路线图材料强调到 2030 实现实用规模的容错能力，但目前尚无已部署的生产系统。
          outputs:
            - 100 个逻辑量子比特里程碑说法
            - 2030 容错目标
            - 可兼容数据中心的规模化说法
    approximationNotes: 层级标签综合了公司和独立来源的描述；它们不代表已披露的生产物料清单或已部署的系统架构。
