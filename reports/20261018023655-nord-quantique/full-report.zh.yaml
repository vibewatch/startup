    rows:
      - - 投资逻辑：资本与战略稀缺性
        - 与公司相关的 2026 年 5 月融资及据报道达 $1.4B 的估值表明投资者愿意为路线图提供资金，DARPA / Quantum Champions 的支持也扩大了选择空间。
        - 独立证据确认未来融资按平价或升价完成，或非稀释性支持转化为具体技术进展。
      - - 投资逻辑：硬件效率上行空间
        - Nord Quantique 认为，相比蛮力方法，玻色子 GKP 方法可以大幅降低容错开销。
        - 同行评审、多量子比特且与客户相关的基准，证明效率优势在规模化后仍然成立。
      - - 反向逻辑：证明质量仍处早期
        - Entangled Future 称 2025 年 Tesseract 结果使用了后选择，2024 年寿命提升仍低于一个更简单的基准；PostQuantum 则指出外部来源已有超过盈亏平衡点的结果。
        - 经复现且独立评审的里程碑，能够消除后选择与基准测试方面的保留意见。
      - - 反向逻辑：公开投资判断输入缺失
        - 留存公开来源仍未披露收入、客户数量、毛利率、烧钱速度或优先股堆叠。
        - 经核实的商业化、单位经济效益及投资者保护披露。
    notes: 该表有意混合上行与下行情景；它不是评分卡，应作为价格敏感性核对清单阅读。
