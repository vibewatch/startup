              指定资料没有包含可核实的 Nord Quantique 目标市场 TAM、SAM 或 SOM 估算，因此最清晰的量化视角，是公司已经获得的资本，以及与其路线图挂钩、按里程碑拨付的公共项目。最具体的数字包括
              2026 年 5 月完成的 $30 million 私募轮、此前 $16 million 的 Quantum Champions 支持、DARPA Stage B 资金，以及最高达 $300 million
              的附条件 Stage C
              机会。这些数据说明投资者和公共项目赞助方愿意为迈向容错计算提供资金，但不能证明终端客户支出、经常性软件需求或分层可服务市场规模。聚合平台对累计融资额也存在分歧，进一步说明当前证据只是市场验证的替代指标，而非已确定的市场规模数据集。
