              融资，估值为 $1.4 billion，资金用于执行路线图和扩大工程团队。同一批来源还描述了 Canadian Quantum Champions Program 和 DARPA Quantum
              Benchmarking Initiative 提供的重要非稀释性支持，但公开描述并不完全可比：部分来源称 Quantum Champions 提供 $16 million USD，Entangled
              Future 则称最高达 CA$23
              million，并将该奖励与实验室扩张和员工增长联系起来。这种不一致很重要，因为公司销售的不只是产品论点，也是资本效率论点。其架构被描述为可降低量子比特和资本开销，但公开来源仍没有现金余额、消耗率、毛利率或资本开支披露，投资者无法据此把工程叙事换算成现金续航。
