  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 执行风险集中在技术规模化、商业验证和融资依赖上，而非任何单一已披露的法律案件。
    data:
      columns:
        - label: 可能性
          note: 以 2026 更新日期为基准的未来 12-24 个月。
        - label: 影响
          note: 若未妥善管理，可能对投资判断造成的损害。
        - label: 缓释成熟度
          note: 成熟度越高，说明已有积极应对措施的证据越充分。
        - label: 剩余敞口
          note: 扣除当前可见缓释措施后的敞口。
      rows:
        - label: 技术规模化
          note: 单量子比特和精选演示仍主导公开证明材料。
          values:
            - label: 高
              tone: high
              note: 公开路线图仍要从今天的验证点跨越到 2029 超过 100 个逻辑量子比特，以及 2030 的容错能力。
            - label: 高
              tone: high
              note: 这里若未达标，会同时削弱商业化时间表和估值逻辑。
            - label: 中
              tone: medium
              note: 公司已发布里程碑，但尚无客户级规模证明。
            - label: 高
              tone: high
              note: 即使完成 2024-2026 里程碑，独立来源的保留意见仍然重要。
        - label: 商业验证
          note: 保留来源未披露收入、ARR 或客户部署。
          values:
