  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：容错硬件，而非泛量子计算支出
        blocks:
          - type: paragraph
            body: >-
              指定资料中的公开记录将 Nord Quantique
              放在一个明确的市场边界内：通过玻色子纠错，让容错计算变得可行的超导量子硬件，而不是宽泛的“量子软件”或“所有量子计算”类别。公司及相关报道反复把机会归结为降低传统方案为可靠逻辑量子比特所需的量子比特和资本开销，因此相关替代方案包括仍依赖蛮力冗余的其他量子硬件架构，以及在许多仿真和优化任务上更便宜、更成熟的传统
              HPC 工作流。对估值而言，这一点很关键：市场主张取决于技术效率能否转化为商业上有用的容错能力，而不只是参与一个庞大但定义松散的量子 TAM 叙事。
