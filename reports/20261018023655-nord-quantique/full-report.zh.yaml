        - 上行来自 Nord Quantique 的重新定价，估值向稀缺量子硬件可比公司的高端靠拢，而不是来自短期现金流。
        - 商业采用仍需追上技术进展。
        - 同行评审的规模化里程碑、更有利的私募轮条款或客户试点。
      - - 基准
        - 公司看起来仍具技术差异化，但公开商业披露依然有限。
        - 只有后续证据填补当前披露缺口，当前 $1.4B 估值才站得住脚，因此回报取决于入场纪律。
        - 在产品市场证明出现前，投资者可能已经为预期买单。
        - 更详细的收入、客户与股权结构表披露。
      - - 悲观
        - 路线图延期、融资条款转弱或量子计算估值倍数压缩，在商业化显现前先行发生。
        - 由于没有公开收入或流动性锚点支撑，表面估值收缩。
        - 降价轮风险、稀释与议价能力下降可能相互强化。
        - 错过里程碑日期、平价 / 降价轮，或商业化持续不透明。
