      - number: '1.4'
        title: 技术里程碑与执行风险
        blocks:
          - type: paragraph
            body: >-
              技术时间线确有实质进展，但必须仔细限定含义。2024 年，公司和独立报道称，GKP 量子比特的逻辑寿命相较于未纠错的同类状态提升了 14%。Entangled Future 指出，纠错后的寿命仍低于更简单的模拟
              Fock 态编码，这削弱了将其笼统解读为“超过盈亏平衡点”的说法。2026 年 7 月，独立报道称网格态量子比特的制备和测量误差低于 0.1%。但该结果也经过后选择：制备运行中约 24%、测量运行中 39%
              通过各自筛选，合计仅约 9%。因此，证据支持一项有意义的单量子比特里程碑，却不能证明已有可扩展处理器或商业系统。多量子比特门、规模化吞吐，以及将实验室进展转化为客户工作负载，仍是核心执行考验。
            claimRefs:
              - CO013
              - CO014
              - CO015
              - CO016
