      - number: '6.3'
        title: Durability, expansion, and concentration are still diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The customer-quality questions that matter most to an investor remain largely unanswered in the assigned
              pool. None of the reviewed sources publish NRR, GRR, churn, renewal cadence, contract length, top-account
              exposure, or channel mix, so there is no public way to distinguish logo interest from durable recurring
              usage. Even the best third-party directories stay focused on partnerships, valuation, technical
              milestones, and employee growth rather than repeat commercial behavior. The practical implication is that
              a land-and-expand story may exist, but it is still hypothetical from public evidence; the burden of proof
              now shifts to private diligence on design partners, conversion to paying contracts, and concentration risk
              once the company starts disclosing revenue.
