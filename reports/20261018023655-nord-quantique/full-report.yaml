      - number: '5.2'
        title: Maturity, roadmap, and public proof
        blocks:
          - type: paragraph
            body: >-
              The best externally evidenced maturity signal remains technical milestone data, not commercial deployment.
              Nord Quantique's February 2024 announcement said the company extended a single qubit's lifetime by 14%
              without adding extra physical qubits, which is meaningful because it ties the product thesis to an
              experimentally claimed break-even-style improvement rather than pure concept marketing. An independent
              PostQuantum profile then describes a later multimode "Tesseract" experiment that used two quantum modes in
              one cavity and reported 32 consecutive correction cycles without measurable logical decay after discarding
              12.6% of runs. Those are credible prototype signals, but they still sit well short of a production system:
              the public roadmap points to useful fault-tolerant systems by 2030 and roughly 100 logical qubits around
              2028/2029, while one market-data profile labels the revenue model as product sales without surfacing
              pricing, support, or deployment documentation.
