      - number: '5.3'
        title: Differentiation, dependencies, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Nord Quantique's main differentiation claim is not higher near-term qubit count, but lower fault-tolerance
              overhead: public sources repeatedly describe a 1:1 logical-to-physical target, faster clock speeds, and a
              path that could use far fewer physical qubits than more brute-force superconducting approaches. That
              differentiation is plausible on paper, but the same independent analyses also make clear where the
              technical risk sits: high-quality cavities, auxiliary transmons, microwave calibration, packaging,
              crosstalk, and large-scale wiring all have to work together before the hardware-efficiency advantage
              becomes an operating system rather than a lab result. Enterprise-readiness evidence is thinner still. The
              assigned public pool does not establish external security certifications, privacy controls, public status
              reporting, or support SLAs, so trust and quality controls should be treated as a diligence gap, not as a
              verified product strength.
            claimRefs:
              - CE005
              - CE011
              - CE013
