  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: fault-tolerant hardware, not generic quantum spend'
        blocks:
          - type: paragraph
            body: >-
              The public record in the assigned pool places Nord Quantique in a specific market boundary:
              superconducting quantum hardware that tries to make fault tolerance practical through bosonic error
              correction, rather than a broad “quantum software” or “all quantum computing” category. The company and
              supporting coverage repeatedly frame the opportunity around reducing the qubit and capital overhead that
              conventional approaches need for reliable logical qubits, which makes the relevant substitute set other
              quantum-hardware architectures that still rely on brute-force redundancy, plus conventional HPC workflows
              that remain cheaper and more mature for many simulation and optimization tasks. This matters for valuation
              because the market claim depends on technical efficiency translating into commercially useful fault
              tolerance, not simply on participation in a large but loosely defined quantum TAM narrative.
