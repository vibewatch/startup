              - CV016
      - number: '8.2'
        title: Scenario framing and comparable context
        blocks:
          - type: paragraph
            body: >-
              The bull case rests on hardware efficiency and follow-on financing capacity. Nord Quantique's own
              materials argue that brute-force fault tolerance can consume 100-1,000 qubits for one working qubit, while
              its February 2024 article claims the bosonic GKP approach could need 1,000-10,000 times fewer physical
              qubits once scaled; Entangled Future says management is targeting utility-scale systems with more than 100
              logical qubits by 2029. That upside deserves attention, but the anti-thesis is equally important:
              Entangled Future says a 2025 Tesseract result relied on post-selection and a company technical paper, and
              that the 2024 autonomous GKP result improved logical lifetime by 14% but still sat below a simpler
              benchmark. PostQuantum also notes that other researchers had already demonstrated real-time GKP correction
              beyond break-even in a 2023 Nature paper, which means Nord Quantique is racing a fast-moving technical
              frontier rather than owning it outright. Against Multiples' comp set, the reported $1.4 billion mark is
              plausible for a scarce private quantum-hardware name, but it is not obviously cheap on public evidence
              alone.
            claimRefs:
              - CV002
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV005
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.3'
        title: Final diligence asks, downside triggers, and exit readiness
        blocks:
          - type: paragraph
            body: >-
              Exit readiness remains conceptual rather than documented. Quantum Market Cap says Nord Quantique is still
              private with no public ticker or announced IPO, and it explicitly warns that buying Rigetti does not
              provide ownership exposure to Nord Quantique. Returns therefore depend on later private rounds, strategic
              acquisition interest, or a future IPO process that is not yet visible in the retained sources. The next
              diligence cycle should focus on paid deployments or contracted pilots, customer and margin disclosure, and
              the current preference stack, because those are the missing facts that decide whether today's headline
              valuation is defensible. Thesis-break triggers are straightforward: roadmap slippage against the company's
              scaling ambitions, a financing event that exposes harsher dilution terms than the unicorn headline
              suggests, or persistent absence of commercialization data while peer valuations compress.
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV010
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: >-
              Track Nord Quantique rather than underwriting a buy at the current headline valuation, because public
              evidence validates the financing round more clearly than it validates commercialization or downside
              protection.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV016
          - type: callout
            title: Why risk remains high
            body: >-
              The most visible technical milestones still carry caveats on post-selection, peer review, or benchmark
              quality, so valuation can de-rate quickly if fundraising terms soften before product proof arrives.
            calloutType: risk
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
          - type: callout
            title: What would move the call
            body: >-
              The recommendation can improve only if Nord Quantique pairs independent scaling proof with hard
              commercialization disclosure such as customers, margins, and a cleaner view of preference terms.
            calloutType: assumption
            claimRefs:
              - CV007
              - CV010
              - CV016
