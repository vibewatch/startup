      - number: '1.4'
        title: Technical milestones and execution risk
        blocks:
          - type: paragraph
            body: >-
              The technical chronology contains substantive progress but needs careful qualification. In 2024, company
              and independent coverage reported a 14% logical-lifetime improvement for a GKP qubit relative to the same
              states without correction. Entangled Future notes that the corrected lifetime remained below a simpler
              simulated Fock-state encoding, challenging a broad "beyond break-even" interpretation. In July 2026,
              independent coverage reported state-preparation and measurement error below 0.1% for a grid-state qubit.
              That result was also postselected: roughly 24% of preparation runs and 39% of measurement runs survived
              their respective filters, leaving about 9% combined. The evidence therefore supports a meaningful
              single-qubit milestone, not proof of a scaled processor or commercial system. Multi-qubit gates,
              throughput at scale, and conversion of laboratory progress into customer workloads remain the central
              execution tests.
            claimRefs:
              - CO013
              - CO014
              - CO015
              - CO016
