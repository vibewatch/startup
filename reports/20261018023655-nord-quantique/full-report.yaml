  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Track is the right call because financing validation and technical upside are outweighed by missing commercial
      proof and early-stage technical caveats.
    data:
      nodes:
        - id: round
          label: Reported unicorn round
          note: $30M round and $1.4B valuation are corroborated by independent trackers.
        - id: optionality
          label: Financing optionality
          note: Quantum Champions and DARPA support extend upside paths without proving commercial traction.
        - id: architecture
          label: Hardware-efficiency upside
          note: Bosonic / GKP positioning could compress qubit and capital needs if scaling claims hold.
        - id: validation
          label: Validation gap
          note: Some highlighted milestones rely on post-selection, company papers, or still trail outside benchmarks.
        - id: disclosure
          label: Commercial opacity
          note: No retained public evidence discloses revenue, customer, burn, or preference-stack detail.
        - id: recommendation
          label: Track / stretched
          note: Maintain interest, but wait for better proof or a better price before underwriting a buy.
      edges:
        - from: round
          to: recommendation
          label: anchors price
        - from: optionality
          to: recommendation
          label: supports upside
        - from: architecture
          to: recommendation
          label: explains premium
        - from: validation
          to: recommendation
          label: caps conviction
        - from: disclosure
          to: recommendation
          label: blocks buy
    approximationNotes: Logic map rather than a weighted scoring model; node ordering shows causal flow, not numerical contribution.
    claimRefs:
