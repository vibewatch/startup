  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The real competitive set is architecture choice, not just a list of startups
        blocks:
          - type: paragraph
            body: >-
              The retained pool frames Nord Quantique's direct contest as a fight over how fault-tolerant quantum
              computing gets built, rather than a simple race on qubit count. Nord's own materials and 2024 perspective
              paper argue that bosonic grid/GKP codes in superconducting circuits can push quantum error correction down
              to the single physical-unit level, while the same retained evidence identifies surface-code programs at
              IBM and Google as the incumbent alternative that still carries large redundancy and control overhead.
              Independent comparables further show that investors already bucket Nord against a mixed set of private and
              public quantum-hardware names, while Quantummarketcap treats Rigetti as the closest listed superconducting
              proxy rather than a direct substitute for owning Nord itself. The result is a landscape with direct peers,
              listed market proxies, and architectural substitutes all competing for the same future FTQC budget.
