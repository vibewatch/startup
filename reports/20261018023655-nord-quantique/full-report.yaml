      - number: '6.2'
        title: Adoption proof is still indirect and validator-heavy
        blocks:
          - type: paragraph
            body: >-
              The clearest public signals are external validation and financing, not customer deployment. Nord
              Quantique's May 2026 funding release and its HPCwire syndication describe a roadmap toward useful
              fault-tolerant machines by 2030 and list investors plus government-backed funding programs, but they do
              not name customers, contracts, or installed systems. Independent commentary is more skeptical: TechVogue
              argues the company is still at early-stage lab validation and "not a product ready for enterprise
              deployment," while also calling the current qubits "nothing commercially useful." Taken together, the
              evidence supports a company with credible technical momentum and external screening, but not one that has
              publicly demonstrated production usage or outcome-bearing customer references.
            claimRefs:
              - CU001
