  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Capital, roadmap, and commercialization exposure
        blocks:
          - type: paragraph
            body: >-
              Nord Quantique has credible financing momentum, but the public proof package still points to a long path
              between today's capital formation and a commercial system. Independent and company-syndicated sources
              agree that the company closed a $30 million round in May 2026 and tied that financing to a fault-tolerance
              roadmap that reaches into 2029-2030. That supports near-term survival, yet it also sharpens price-to-proof
              risk: the same retained pool does not disclose revenue, ARR, contracted customers, or production
              deployments that would anchor a $1.4 billion valuation. Funding disclosure is itself noisy, with
              independent profiles disagreeing on cumulative capital raised, so investors should treat runway, burn, and
              cap-table reconstruction as first-order diligence items rather than administrative clean-up.
            claimRefs:
              - CR002
