  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and core architecture
        blocks:
          - type: paragraph
            body: >-
              In customer-workflow terms, Nord Quantique is not selling a point application; it is trying to deliver a
              general-purpose quantum computing platform whose central product claim is hardware-efficient fault
              tolerance. Public company materials frame the problem as conventional quantum error correction consuming
              large qubit redundancy, then position Nord Quantique's answer as bosonic/GKP encoding inside
              superconducting cavity hardware so each logical qubit carries more of its own error-correcting burden.
              Independent profiles and market-data summaries broadly agree on the modality: superconducting bosonic
              qubits, cavity or resonator memory, and transmon-assisted control, with some third-party descriptions also
              mentioning photonic interfaces around the lab prototype stack. This architecture story is specific enough
              to identify the platform's core modules, but not detailed enough to reconstruct an implementation-ready
              bill of materials or integration path.
            claimRefs:
