      - number: '1.2'
        title: Capitalization, valuation, and stakeholders
        blocks:
          - type: paragraph
            body: >-
              Nord Quantique announced a $30 million investment on May 18, 2026, with BDC and funds managed by Fidelity
              Investments Canada among the disclosed backers. Independent profiles also report a roughly $1.4 billion
              May 2026 valuation, but no filing or disclosed term sheet in the assigned evidence confirms the security
              terms, dilution, or investor rights. More importantly, "total raised" is not yet a normalized metric.
              Multiples reports $38 million across three rounds, while Entangled Future reports $73 million using a
              different round history and currency-conversion method. Company-issued material separately identifies $16
              million through the Canadian Quantum Champions Program and $5 million under DARPA Stage B, with up to
              another $10 million possible in that phase. Equity, grants, staged awards, and currency conversions
              therefore should not be collapsed into one cash-available figure.
            claimRefs:
              - CO004
              - CO005
