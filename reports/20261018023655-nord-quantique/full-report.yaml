        title: Nord's differentiation is clear, but durability still depends on scaling proof
        blocks:
          - type: paragraph
            body: >-
              Nord's competitive pitch is consistent across official and technical material: embed more error-correction
              capability into each physical unit, keep logical operations fast, and avoid the brute-force redundancy
              that surface-code roadmaps often require. Independent comparison material supports that this is a real
              architectural distinction, not just branding. The same independent evidence also narrows the moat.
              Entangled Future's Quantum Navigator profile notes that Nord's 2024 autonomous GKP milestone improved
              logical lifetime versus no QEC, but still sat below a simulated Fock benchmark and involved readout
              exclusions. PostQuantum likewise argues that bosonic/GKP approaches may still need second-layer codes and
              that the field has not converged on a single winner. That means Nord's advantage today is a promising
              efficiency thesis, not a settled industry standard.
