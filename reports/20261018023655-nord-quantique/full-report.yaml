      - number: '1.3'
        title: Leadership, founder coverage, and governance
        blocks:
          - type: paragraph
            body: >-
              Public profiles identify Julien Camirand Lemyre and Philippe St-Jean as the founding pair and currently
              list them as CEO and CBO, respectively. The visible operating bench adds technical leadership through
              Marc-Antoine Lemonde and Dany Lachance-Quirion, while 2026 appointments in finance, communications, and
              marketing suggest an effort to professionalize the organization around fundraising and commercialization.
              That roster is useful but not equivalent to governance evidence. The allocated sources do not provide a
              current board list, committee structure, founder voting control, investor consent rights, or succession
              plan. The public narrative remains strongly founder-centered, and the absence of a verified board map
              prevents a firm conclusion about oversight quality or key-person mitigation.
