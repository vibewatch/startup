  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment view and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The cleanest public valuation datapoint is a May 2026 financing that both company-linked releases and
              independent trackers describe as a $30 million round, with Multiples and Entangled Future tying it to a
              reported $1.4 billion valuation. Multiples also describes the round as straight equity capital rather than
              a structured earn-out, which helps anchor the headline price but does not solve the underwriting problem.
              The same retained evidence set still does not disclose revenue, customer counts, gross margins, burn, or
              liquidation preferences, and Quantum Market Cap says the company remained private with no announced IPO as
              of October 2026. That makes the current opportunity look more like an option on fault-tolerant quantum
              hardware than a buyable cash-flow story, so the disciplined call is track rather than buy at the current
              public headline valuation.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
