        title: Buyers, adoption path, and constraints remain the key diligence gap
        blocks:
          - type: paragraph
            body: >-
              The pool supports an early buyer map, but not a fully disclosed procurement path. Third-party surfaces
              describe Nord Quantique as a B2B product company and the company itself names application areas such as
              materials science, pharmaceuticals, cryptography, optimization, and simulation. That points to enterprise
              or government R&D organizations as eventual users, with public programs and private investors acting as
              the clearest current payers in the evidence. The adoption drivers are straightforward: if Nord Quantique
              can preserve its claimed efficiency advantage, it could lower the qubit count, capital burden, and
              data-center footprint needed for useful fault-tolerant systems. The constraints are equally clear: public
              disclosures still lack named customers, budget owners, contract structure, and a source-backed
              system-level benchmark set beyond research milestones, so commercialization timing remains more thesis
