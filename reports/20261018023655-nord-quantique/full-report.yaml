chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, operating stage, and business model
        blocks:
          - type: paragraph
            body: >-
              Nord Quantique is consistently identified as a Sherbrooke, Quebec quantum hardware company founded in
              2020. Its core proposition is not a conventional high-qubit-count processor: the company is developing
              superconducting bosonic qubits that encode error protection within the qubit, with a claimed path toward a
              1:1 logical-to-physical ratio. That architecture supports a capital-efficiency narrative built around
              fewer devices, rack-scale deployment, and eventual fault-tolerant systems. Public-company status is
              clearer than commercial maturity: an October 2026 market profile records the business as private, with no
              announced IPO or public ticker. The retained evidence does not establish a recurring-revenue model,
              production customer base, or verified location footprint beyond the Sherbrooke headquarters, so those
              fields remain diligence gaps rather than zero values.
            claimRefs:
              - CO001
              - CO002
              - CO003
