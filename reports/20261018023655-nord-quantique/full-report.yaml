      - number: '7.2'
        title: Technical validation and scale-up risk
        blocks:
          - type: paragraph
            body: >-
              The core technical promise is differentiated, but the evidence remains pre-commercial and partially
              caveated. Official materials and independent writeups both point to hardware-efficient bosonic error
              correction and a 14% improvement in single-qubit lifetime, which is meaningful as a research milestone.
              The risk is that the most bullish public claims still extrapolate from single-qubit or highly curated
              experiments into utility-scale systems. Entangled Future's profile is especially important here: it notes
              that the 2024 corrected lifetime was still below a simpler benchmark and that a later 2025 Tesseract
              result relied on post-selection and a company technical paper rather than a peer-reviewed or arXiv source.
              Until Nord Quantique shows reproducible multi-qubit or customer-relevant performance, execution risk
              remains high even if the underlying science is promising.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
