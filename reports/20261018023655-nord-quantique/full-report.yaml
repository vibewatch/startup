      - number: '7.3'
        title: Regulatory, disclosure, and ecosystem dependency risk
        blocks:
          - type: paragraph
            body: >-
              The retained sources do not show a near-term legal crisis, but they do show several unresolved governance
              and dependency exposures. Nord Quantique's funding mix ties part of the operating plan to Canadian and
              U.S. public programs, including DARPA QBI and the Canada Quantum Champions program, which implies
              milestone, security, and program compliance obligations even though the retained public materials do not
              disclose the underlying control framework. The same pool does not surface patents, university license
              terms, export-control procedures, security certifications, incident-response disclosures, or customer
              diligence artifacts. Because the company is also concentrated in the Sherbrooke/Institut Quantique
              ecosystem, investors should underwrite talent, lab, and ecosystem dependence alongside the better-known
              technical roadmap risk.
            claimRefs:
              - CR003
              - CR010
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR010
              - CR011
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break trigger
            body: >-
              If the next financing cycle arrives without independently supported multi-qubit proof, customer
              validation, or a clearer bridge from today's experiments to the 2029-2030 roadmap, the current valuation
              narrative becomes difficult to defend.
            calloutType: risk
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR012
          - type: callout
            title: Priority diligence asks
            body: >-
              Management should be asked for a reconciled funding history, current burn and runway, named customer or
              pilot evidence, patent and license schedules, and security or export-control compliance materials before
              underwriting anything beyond a watchlist view.
            calloutType: recommendation
            claimRefs:
