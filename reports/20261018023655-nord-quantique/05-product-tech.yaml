company:
  name: Nord Quantique
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Nord Quantique's public product story is a hardware-efficient fault-tolerant quantum computing architecture built around bosonic/GKP error correction in superconducting cavities rather than brute-force qubit redundancy. The strongest demonstrated maturity proof in this source pool is still prototype-stage: a 14% single-qubit lifetime improvement in 2024 and a later multimode "Tesseract" demo summarized by an independent profile, while product packaging, enterprise controls, and production deployment evidence remain materially under-disclosed.
sections:
  - id: product-definition-and-architecture
    title: Product definition and core architecture
    body: >-
      In customer-workflow terms, Nord Quantique is not selling a point application; it is trying to deliver a general-purpose quantum computing platform whose central product claim is hardware-efficient fault tolerance. Public company materials frame the problem as conventional quantum error correction consuming large qubit redundancy, then position Nord Quantique's answer as bosonic/GKP encoding inside superconducting cavity hardware so each logical qubit carries more of its own error-correcting burden. Independent profiles and market-data summaries broadly agree on the modality: superconducting bosonic qubits, cavity or resonator memory, and transmon-assisted control, with some third-party descriptions also mentioning photonic interfaces around the lab prototype stack. This architecture story is specific enough to identify the platform's core modules, but not detailed enough to reconstruct an implementation-ready bill of materials or integration path.
    claimRefs: [CE001, CE003, CE004, CE005, CE006]
    tableRefs: [TE001, TE003]
    figureRefs: [FE001]
  - id: maturity-roadmap-and-public-proof
    title: Maturity, roadmap, and public proof
    body: >-
      The best externally evidenced maturity signal remains technical milestone data, not commercial deployment. Nord Quantique's February 2024 announcement said the company extended a single qubit's lifetime by 14% without adding extra physical qubits, which is meaningful because it ties the product thesis to an experimentally claimed break-even-style improvement rather than pure concept marketing. An independent PostQuantum profile then describes a later multimode "Tesseract" experiment that used two quantum modes in one cavity and reported 32 consecutive correction cycles without measurable logical decay after discarding 12.6% of runs. Those are credible prototype signals, but they still sit well short of a production system: the public roadmap points to useful fault-tolerant systems by 2030 and roughly 100 logical qubits around 2028/2029, while one market-data profile labels the revenue model as product sales without surfacing pricing, support, or deployment documentation.
    claimRefs: [CE002, CE007, CE008, CE009, CE010, CE012]
    tableRefs: [TE002]
  - id: differentiation-dependencies-and-gaps
    title: Differentiation, dependencies, and diligence gaps
    body: >-
      Nord Quantique's main differentiation claim is not higher near-term qubit count, but lower fault-tolerance overhead: public sources repeatedly describe a 1:1 logical-to-physical target, faster clock speeds, and a path that could use far fewer physical qubits than more brute-force superconducting approaches. That differentiation is plausible on paper, but the same independent analyses also make clear where the technical risk sits: high-quality cavities, auxiliary transmons, microwave calibration, packaging, crosstalk, and large-scale wiring all have to work together before the hardware-efficiency advantage becomes an operating system rather than a lab result. Enterprise-readiness evidence is thinner still. The assigned public pool does not establish external security certifications, privacy controls, public status reporting, or support SLAs, so trust and quality controls should be treated as a diligence gap, not as a verified product strength.
    claimRefs: [CE005, CE011, CE013]
callouts:
  - calloutType: strength
    title: Hardware-efficient fault tolerance is the core product thesis
    body: >-
      Across company and independent sources, the consistent differentiator is embedding error correction into bosonic superconducting qubits so the platform can pursue fault tolerance with materially less qubit overhead than brute-force architectures.
    claimRefs: [CE001, CE005]
  - calloutType: risk
    title: Public evidence still describes a prototype roadmap, not an operating production platform
    body: >-
      The public milestones are technically interesting, but the decisive remaining work is scale-up: cavity and transmon integration, calibration, packaging, and enterprise-control disclosure are still not evidenced at production depth in this source set.
    claimRefs: [CE008, CE011, CE013]
