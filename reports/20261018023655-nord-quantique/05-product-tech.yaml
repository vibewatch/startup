      - ["GKP / bosonic error-correcting code", "Encodes the logical qubit so small errors can be corrected within the physical unit", "Reliable state preparation and decoding", "Public sources still emphasize milestone demonstrations over system-level benchmark series"]
      - ["Auxiliary transmon plus microwave control", "Manipulates the cavity state and supports syndrome extraction or autonomous correction", "Precise calibration, reset, and control electronics", "Control complexity and transmon-linked noise are recurring scale-up risks in independent analysis"]
      - ["System integration and packaging", "Combines many cavity-transmon units into a larger fault-tolerant machine", "Cryogenic wiring, crosstalk management, packaging, and software orchestration", "No public enterprise operations surface, support SLA, or deployment architecture is evidenced in this pool"]
    notes: Architecture rows reflect public descriptions of the stack and its dependencies; they do not imply public proof of production reliability or enterprise controls.
    claimRefs: [CE003, CE006, CE011, CE013]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Public evidence supports a bosonic-code architecture layered from logical encoding down to cavity hardware and transmon control, with system-scale claims still roadmap-stage.
    data:
      layers:
        - label: Workload targets
          detail: Public materials position the platform for simulation, optimization, and cryptography-style workloads rather than a single vertical appliance.
          outputs: ["Simulation", "Optimization", "Cryptography"]
        - label: Logical encoding
          detail: GKP and related bosonic codes are presented as the core mechanism that embeds error correction into each logical qubit.
          modules: ["Single-qubit logical encoding", "Bit-flip and phase-flip correction", "1:1 logical-to-physical target"]
        - label: Multimode extension
          detail: The Tesseract concept extends one logical qubit across two quantum modes to catch more error types than the single-mode setup.
          modules: ["Two-mode cavity encoding", "Leakage and control-error detection", "32-cycle public proof point"]
        - label: Physical memory
          detail: High-quality superconducting cavities or resonator modes provide the long-lived bosonic memory element.
          modules: ["Cavity or resonator modes", "Bosonic states", "Photonic interface mention in one third-party profile"]
        - label: Control and correction
          detail: Auxiliary transmons, microwave pulses, and repeated syndrome or autonomous-correction cycles manipulate and stabilize the encoded state.
          modules: ["Auxiliary transmon", "Microwave pulse control", "Syndrome extraction and reset"]
        - label: System scale-up
          detail: Public roadmap materials emphasize utility-scale fault tolerance by 2030, but not a currently deployed production system.
          outputs: ["100-logical-qubit milestone claim", "2030 fault-tolerance target", "Data-center-compatible scaling claim"]
    approximationNotes: Layer labels synthesize company and independent descriptions; they do not imply a disclosed production bill of materials or deployed system architecture.
    claimRefs: [CE001, CE003, CE005, CE007, CE008, CE009, CE010, CE011]
