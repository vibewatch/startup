  evidenceGaps:
    - type: missing-source
      severity: material
      topic: enterprise-controls
      missingEvidence: Public trust-center materials, security certifications, privacy/compliance documentation, service-status reporting, and support commitments.
      whyItMatters: Enterprise and government buyers cannot underwrite operational risk or vendor readiness from architecture claims alone.
      diligencePath: Request SOC 2 or ISO evidence, privacy/security policies, incident-response process, uptime commitments, and any public or private status reporting artifacts.
      relatedQuestionRefs: [QE006]
      relatedTableRefs: [TE003]
    - type: private-evidence-only
      severity: material
      topic: commercialization
      missingEvidence: Official product packaging, pricing, deployment architecture, implementation timeline, and post-sale support documentation.
      whyItMatters: The current source set proves technical ambition better than it proves what a customer can buy, deploy, or operate.
      diligencePath: Request a current product deck, SKU list, statement of work template, customer deployment references, and support playbook.
      relatedQuestionRefs: [QE001, QE004]
      relatedTableRefs: [TE001, TE002]
    - type: private-evidence-only
      severity: material
      topic: benchmark-depth
      missingEvidence: Latest qubit counts, logical error rates, coherence data, uptime, and benchmark methodology for single-mode and multimode systems.
      whyItMatters: The public milestones are promising, but investors still cannot judge whether the architecture is compounding into commercially relevant fault-tolerant performance.
      diligencePath: Request benchmark notebooks or papers, error-budget summaries, and the latest engineering roadmap with target thresholds and achieved values.
      relatedQuestionRefs: [QE004, QE007]
      relatedTableRefs: [TE001, TE002]
    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: Public practitioner-community or developer-signal evidence such as repositories, technical forums, conference engineering talks, or integration community activity.
      whyItMatters: The chapter brief asks for a developer or practitioner proxy when a direct public developer surface is absent, and this assigned pool does not supply one.
      diligencePath: Request the company's public publication list, community presentations, open technical materials, or partner engineering references that demonstrate practitioner engagement.
