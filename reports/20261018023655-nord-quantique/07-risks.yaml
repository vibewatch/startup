company:
  name: Nord Quantique
chapter:
  number: 7
  title: Risks
  summary: >-
    Nord Quantique's main risk is execution mismatch: a May 2026 unicorn valuation and
    2029-2030 fault-tolerance roadmap sit on top of early-stage technical proof, limited
    commercial disclosure, and meaningful dependence on government programs and future
    financing. The retained pool also leaves material diligence gaps around IP, security,
    export-control posture, and reconciled capitalization.
sections:
  - id: capital-roadmap-exposure
    title: Capital, roadmap, and commercialization exposure
    body: >-
      Nord Quantique has credible financing momentum, but the public proof package still
      points to a long path between today's capital formation and a commercial system.
      Independent and company-syndicated sources agree that the company closed a $30 million
      round in May 2026 and tied that financing to a fault-tolerance roadmap that reaches
      into 2029-2030. That supports near-term survival, yet it also sharpens price-to-proof
      risk: the same retained pool does not disclose revenue, ARR, contracted customers, or
      production deployments that would anchor a $1.4 billion valuation. Funding disclosure
      is itself noisy, with independent profiles disagreeing on cumulative capital raised,
      so investors should treat runway, burn, and cap-table reconstruction as first-order
      diligence items rather than administrative clean-up.
    claimRefs: [CR002, CR003, CR004, CR009, CR012, CR013, CR014]
    tableRefs: [TR003]
    figureRefs: [FR001]
  - id: technical-scale-up-risk
    title: Technical validation and scale-up risk
    body: >-
      The core technical promise is differentiated, but the evidence remains pre-commercial
      and partially caveated. Official materials and independent writeups both point to
      hardware-efficient bosonic error correction and a 14% improvement in single-qubit
      lifetime, which is meaningful as a research milestone. The risk is that the most
      bullish public claims still extrapolate from single-qubit or highly curated experiments
      into utility-scale systems. Entangled Future's profile is especially important here:
      it notes that the 2024 corrected lifetime was still below a simpler benchmark and that
      a later 2025 Tesseract result relied on post-selection and a company technical paper
      rather than a peer-reviewed or arXiv source. Until Nord Quantique shows reproducible
      multi-qubit or customer-relevant performance, execution risk remains high even if the
      underlying science is promising.
    claimRefs: [CR001, CR004, CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
  - id: regulatory-disclosure-and-dependency-risk
    title: Regulatory, disclosure, and ecosystem dependency risk
    body: >-
      The retained sources do not show a near-term legal crisis, but they do show several
      unresolved governance and dependency exposures. Nord Quantique's funding mix ties part
      of the operating plan to Canadian and U.S. public programs, including DARPA QBI and
      the Canada Quantum Champions program, which implies milestone, security, and program
      compliance obligations even though the retained public materials do not disclose the
      underlying control framework. The same pool does not surface patents, university
      license terms, export-control procedures, security certifications, incident-response
      disclosures, or customer diligence artifacts. Because the company is also concentrated
      in the Sherbrooke/Institut Quantique ecosystem, investors should underwrite talent,
      lab, and ecosystem dependence alongside the better-known technical roadmap risk.
    claimRefs: [CR003, CR010, CR011]
    tableRefs: [TR001]
