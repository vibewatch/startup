figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Execution risk is concentrated in technical scale-up, commercial proof, and financing
      dependencies rather than in any single disclosed legal case.
    data:
      columns:
        - label: Likelihood
          note: Next 12-24 months from the 2026 refresh date.
        - label: Impact
          note: Potential damage to underwriting if unmanaged.
        - label: Mitigation maturity
          note: Higher maturity reflects evidence of an active countermeasure.
        - label: Residual exposure
          note: Exposure after currently visible mitigations.
      rows:
        - label: Technical scale-up
          note: Single-qubit and curated demonstrations still dominate the public proof set.
          values:
            - label: High
              tone: high
              note: >-
                The public roadmap still stretches from today's proof points to >100 logical
                qubits by 2029 and fault tolerance by 2030.
            - label: High
              tone: high
              note: A miss here undermines both commercialization timing and the valuation case.
            - label: Medium
              tone: medium
              note: The company has published milestones, but not customer-grade scale proof.
            - label: High
              tone: high
              note: Independent caveats remain material even after the 2024-2026 milestones.
        - label: Commercial proof
          note: Retained sources do not disclose revenue, ARR, or customer deployments.
          values:
            - label: High
              tone: high
            - label: High
              tone: high
            - label: Low
              tone: low
              note: The retained pool provides little public mitigation beyond the roadmap itself.
            - label: High
              tone: high
        - label: Government-program dependency
          note: DARPA and Canadian non-dilutive support are positive but conditional.
          values:
            - label: Medium
              tone: medium
            - label: High
              tone: high
            - label: Medium
              tone: medium
              note: Private capital offsets some dependence, but not all milestone risk.
            - label: High
              tone: high
        - label: Compliance and disclosure opacity
          note: Export-control, security, incident, and IP materials are not visible in the pool.
          values:
            - label: Medium
              tone: medium
            - label: Medium
              tone: medium
            - label: Low
              tone: low
            - label: Medium-High
              tone: high
        - label: Financing and valuation support
          note: The $1.4B round is public, but the proof package behind it remains thin.
          values:
            - label: Medium
              tone: medium
            - label: High
              tone: high
            - label: Medium
              tone: medium
            - label: High
              tone: high
        - label: IP and freedom to operate
          note: The retained pool describes technical differentiation but not the patent or license perimeter around it.
          values:
            - label: Medium
              tone: medium
            - label: High
              tone: high
            - label: Low
              tone: low
            - label: High
              tone: high
    approximationNotes: >-
      Cells are qualitative judgments synthesized from retained claims; they are not
      probability estimates or externally benchmarked scores.
    claimRefs: [CR002, CR003, CR004, CR006, CR007, CR009, CR010, CR012]
callouts:
  - calloutType: risk
    title: Thesis-break trigger
    body: >-
      If the next financing cycle arrives without independently supported multi-qubit proof,
      customer validation, or a clearer bridge from today's experiments to the 2029-2030
      roadmap, the current valuation narrative becomes difficult to defend.
    claimRefs: [CR004, CR006, CR007, CR012]
  - calloutType: recommendation
    title: Priority diligence asks
    body: >-
      Management should be asked for a reconciled funding history, current burn and runway,
      named customer or pilot evidence, patent and license schedules, and security or
      export-control compliance materials before underwriting anything beyond a watchlist view.
    claimRefs: [CR009, CR010, CR013, CR014]
