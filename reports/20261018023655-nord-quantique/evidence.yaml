evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, committee structure, voting-control map, investor rights, and succession plan.
    whyItMatters: Founder dependence and oversight quality cannot be assessed from an executive roster alone.
    diligencePath: >-
      Request the current board materials, voting agreement, investor-rights agreement, and succession plan from
      management.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: operating-scale
    missingEvidence: Revenue, ARR, cash burn, runway, customer count, named production customers, and a management-confirmed headcount.
    whyItMatters: Funding and technical milestones do not establish commercial adoption or capital efficiency.
    diligencePath: Obtain management accounts, payroll records, customer contracts, and a reconciled operating KPI pack.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: total-funding
    missingEvidence: A financing schedule that separates equity, grants, staged awards, currencies, and cash received.
    whyItMatters: Funding raised is not cash available, and the $38 million and $73 million totals are not directly comparable.
    diligencePath: Reconcile the cap table, bank receipts, grant agreements, and foreign-exchange conventions with management.
    relatedQuestionRefs:
      - QO004
      - QO007
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map
    missingEvidence: Complete ownership percentages, check sizes, security classes, preferences, board rights, and grant conditions.
    whyItMatters: Named backers signal validation but do not reveal economic control, dilution, or downside protection.
    diligencePath: Review the current cap table, financing documents, side letters, and public-program award agreements.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: processor-scale
    missingEvidence: >-
      Independent multi-qubit gate, throughput, logical-error, and system-level benchmark evidence without success-only
      postselection.
    whyItMatters: >-
      Single-qubit laboratory milestones do not establish a scalable fault-tolerant processor or commercial workload
      readiness.
    diligencePath: >-
      Obtain raw benchmark protocols and results, then require independent replication and customer-relevant workload
      tests.
    relatedQuestionRefs:
      - QO008
      - QO009
  - type: missing-source
    severity: material
    topic: buyer-budget-ownership
    missingEvidence: >-
      Named customer segments, procurement workflow, and explicit budget-owner disclosure for eventual production
      deployments.
    whyItMatters: Without buyer and payer specificity, adoption timing and sales-efficiency assumptions remain mostly thesis-driven.
    diligencePath: >-
      Request customer pipeline, pilot list, procurement motion, and budget-owner detail in management interviews or
      data room materials.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: tam-sam-som
    missingEvidence: Auditable TAM, SAM, and SOM estimates segmented by geography, workload, and buyer class.
    whyItMatters: >-
      Capital formation is not a substitute for addressable-demand sizing when testing upside assumptions or valuation
      multiples.
    diligencePath: Request management's market model and reconcile it with third-party workload-specific quantum spending research.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-proof
    missingEvidence: >-
      Named design partners, pricing structure, contract terms, and system-level performance benchmarks tied to
      commercial workloads.
    whyItMatters: >-
      These disclosures determine whether the efficiency thesis converts into real willingness to buy rather than just
      willingness to fund.
    diligencePath: Obtain commercial pipeline materials, benchmark decks, and customer or partner references under NDA.
    relatedQuestionRefs:
      - QM003
      - QM007
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: funding-denominator
    missingEvidence: >-
      A single reconciled financing history that bridges venture rounds, grants, currencies, and contingent program
      awards.
    whyItMatters: >-
      Conflicting totals do not change the core market thesis, but they do affect how much external capital the roadmap
      has already consumed.
    diligencePath: >-
      Request a financing bridge from management or lead investors that separates closed equity, grants, and contingent
      awards.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-packaging
    missingEvidence: >-
      Public product pricing, contract terms, deployment model, and customer-access packaging for Nord Quantique and its
      closest substitutes.
    whyItMatters: Without it, buyers and investors cannot compare TCO, lock-in, or practical switching cost across architectures.
    diligencePath: Request product pricing, contract archetypes, and any cloud or pilot packaging from the company and direct peers.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: multi-qubit-benchmarking
    missingEvidence: >-
      Public multi-qubit logical-gate benchmarks and workload-level comparisons versus surface-code or other bosonic
      alternatives.
    whyItMatters: >-
      Nord's differentiation claim is strongest on efficiency, but durability depends on scaling proof beyond
      single-logical-qubit milestones.
    diligencePath: >-
      Track the company's next multi-qubit release and request benchmark-normalized comparisons on fidelity, runtime,
      and error-correction overhead.
    relatedQuestionRefs:
      - QP003
      - QP004
      - QP008
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: minor
    topic: distribution-lock-in
    missingEvidence: >-
      Named customers, channel partners, or supply-chain disclosures showing that Nord has commercial distribution power
      beyond technical credibility.
    whyItMatters: A technology moat can still be fragile if buyers can defer spend or multi-home across other architectures.
    diligencePath: Request customer references, partner disclosures, and commercialization milestones tied to production deployments.
    relatedQuestionRefs:
      - QP008
  - type: missing-source
    severity: material
    topic: gtm-efficiency
    missingEvidence: Public evidence for sales cycle, CAC, payback, pipeline conversion, and channel economics.
    whyItMatters: >-
      Without GTM efficiency data, investors cannot judge how fast technical progress can convert into repeatable
      bookings.
    diligencePath: >-
