chapter:
  number: 3
  title: "Competitors"
  summary: "Nord Quantique competes less on current commercial scale than on a technical thesis: bosonic/GKP error correction in superconducting hardware could deliver materially lower qubit overhead and faster logical clocks than surface-code incumbents. Retained independent evidence, however, still places the company in a proof-heavy, pre-scale field where single-logical-qubit milestones, post-selection caveats, and missing public pricing leave room for incumbents, adjacent bosonic programs, and listed public proxies to remain credible alternatives."
sections:
  - id: "competitive-set"
    title: "The real competitive set is architecture choice, not just a list of startups"
    body: "The retained pool frames Nord Quantique's direct contest as a fight over how fault-tolerant quantum computing gets built, rather than a simple race on qubit count. Nord's own materials and 2024 perspective paper argue that bosonic grid/GKP codes in superconducting circuits can push quantum error correction down to the single physical-unit level, while the same retained evidence identifies surface-code programs at IBM and Google as the incumbent alternative that still carries large redundancy and control overhead. Independent comparables further show that investors already bucket Nord against a mixed set of private and public quantum-hardware names, while Quantummarketcap treats Rigetti as the closest listed superconducting proxy rather than a direct substitute for owning Nord itself. The result is a landscape with direct peers, listed market proxies, and architectural substitutes all competing for the same future FTQC budget."
    claimRefs: ["CP001", "CP002", "CP007", "CP008", "CP009", "CP015"]
    tableRefs: ["TP001"]
  - id: "differentiation-tradeoffs"
    title: "Nord's differentiation is clear, but durability still depends on scaling proof"
    body: "Nord's competitive pitch is consistent across official and technical material: embed more error-correction capability into each physical unit, keep logical operations fast, and avoid the brute-force redundancy that surface-code roadmaps often require. Independent comparison material supports that this is a real architectural distinction, not just branding. The same independent evidence also narrows the moat. Entangled Future's Quantum Navigator profile notes that Nord's 2024 autonomous GKP milestone improved logical lifetime versus no QEC, but still sat below a simulated Fock benchmark and involved readout exclusions. PostQuantum likewise argues that bosonic/GKP approaches may still need second-layer codes and that the field has not converged on a single winner. That means Nord's advantage today is a promising efficiency thesis, not a settled industry standard."
    claimRefs: ["CP003", "CP004", "CP005", "CP006", "CP007", "CP012", "CP013", "CP014"]
    tableRefs: ["TP002"]
    figureRefs: ["FP001"]
  - id: "commercial-implications"
    title: "Commercial switching costs are still low because public packaging is thin"
    body: "The retained evidence does not show Nord winning on disclosed pricing, installed-base lock-in, or a visible commercial packaging model. Multiples labels the revenue model as product sales, but the assigned pool does not disclose a list price, contract model, cloud-access package, or customer workload benchmark for Nord or most peers. That keeps buyer switching costs low in practical terms: a technical buyer can still wait for more head-to-head proof, compare listed public proxies such as Rigetti, or watch other hardware cohorts without paying a visible penalty for delay. Until Nord publishes repeatable multi-qubit benchmarks, clearer commercial packaging, or customer deployment evidence, its moat looks more technological than commercial."
    claimRefs: ["CP010", "CP011", "CP012", "CP013", "CP014", "CP015"]
    tableRefs: ["TP003"]
