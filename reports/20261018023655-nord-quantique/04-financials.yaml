schemaVersion: report-v2
artifact: financials
slug: nord-quantique
runDate: 2026-10-18
company:
  name: Nord Quantique
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence for Nord Quantique's financial story is still dominated by financing events and technical
    roadmap milestones rather than operating metrics. The clearest underwriteable facts are the May 2026
    $30 million equity round, meaningful non-dilutive program support, and a commercialization target centered
    on fault-tolerant systems by 2030; revenue, pricing, cash, and margin data remain undisclosed.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and commercial visibility
    body: >-
      The assigned public record does not show a scaled, disclosed operating business yet. Independent coverage
      and company-issued materials consistently describe Nord Quantique as using new capital to advance the
      technical roadmap and engineering capacity, while public sources reviewed for this chapter do not disclose
      current revenue, ARR, customer count, list pricing, or standard contract terms. That does not prove those
      metrics do not exist internally; it means outside investors cannot verify them from the current public
      evidence pack. Third-party aggregator profiles point toward a future B2B product-sales model for
      fault-tolerant quantum systems, but those descriptions remain directional rather than a substitute for
      contracted backlog, deployment pricing, or revenue-recognition detail. Financially, the company still
      reads more like a capital-funded deep-tech program than a publicly measurable commercial scale-up.
    claimRefs: [CI003, CI004, CI005, CI006, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: capital-needs-and-cost-drivers
    title: Capital needs and cost drivers
    body: >-
      Nord Quantique's public financing case is easier to observe than its operating economics. FinSMEs,
      TechStartups, and the company-issued HPCwire wire all report a May 2026 $30 million round at a
      $1.4 billion valuation, with proceeds earmarked for roadmap execution and engineering scale-up. The same
      sources also describe material non-dilutive support through the Canadian Quantum Champions Program and
      DARPA's Quantum Benchmarking Initiative, but the public descriptions are not fully comparable: some sources
      cite $16 million USD for Quantum Champions, while Entangled Future cites up to CA$23 million and links the
      award to lab expansion and headcount growth. That inconsistency matters because the company is selling a
      capital-efficiency thesis as much as a product thesis. Its architecture is framed as reducing qubit and
      capital overhead, but public sources still offer no cash-balance, burn-rate, gross-margin, or capex
      disclosure that would let an investor translate the engineering narrative into runway.
    claimRefs: [CI001, CI002, CI007, CI008, CI009, CI010, CI011, CI015, CI016]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: Underwriting verdict
    body: >-
      The financial verdict is therefore mixed. Nord Quantique has demonstrated that investors and grant makers
      are willing to finance the platform, and the combination of equity plus non-dilutive programs lowers near-
      term funding concentration risk relative to a single-source venture story. At the same time, the adverse
      technical reading remains important: independent coverage stresses that the company's most visible quantum
      error-correction milestones are still early, and one skeptical profile notes the 14% lifetime improvement
      was not beyond break-even against a simpler simulated encoding. That leaves valuation support leaning on a
      long-dated technical roadmap rather than on revenue quality, margin evidence, or disclosed unit economics.
      For diligence, the gating asks are straightforward: verify current cash, monthly burn, committed grant cash,
      hiring plan, customer contracting model, and any near-term commercialization milestones that convert the
      roadmap into measurable revenue.
    claimRefs: [CI001, CI011, CI012, CI013, CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - ["Equity financing", "Private investment round", "USD raised", "$30M disclosed in May 2026", "Medium", "Confirm preference stack, remaining cash, and any tranched close conditions"]
      - ["Non-dilutive program funding", "Government and defense programs", "Grant / milestone funding", "Quantum Champions and DARPA support disclosed, but awarded versus contingent cash is not fully reconciled publicly", "Medium", "Confirm booked cash, milestone gates, and restrictions on use"]
      - ["Hardware / system sales", "Prospective B2B product sales", "System / contract", "Aggregator sources describe product sales, but no public contracts or revenue are disclosed", "Low", "Request pipeline, customer stage, and revenue-recognition policy"]
      - ["Software / cloud / services", "Not disclosed in assigned evidence", "N/A", "Unavailable publicly from this evidence pack", "Low", "Ask whether software, access fees, or services are part of the commercial model"]
    notes: >-
      Table separates disclosed financing inflows from potential operating revenue; null-equivalent "not disclosed"
      entries mean the assigned public evidence does not provide the metric.
    claimRefs: [CI001, CI003, CI004, CI006, CI008, CI009, CI015]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Item
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - ["Quantum computing systems", "Not publicly disclosed", "Unknown", "No public list price, seat price, or system price in assigned sources", "Official site and funding coverage"]
      - ["Commercial model", "B2B product sales (third-party classification)", "Directional only", "No disclosed contract length, deployment structure, or payment timing", "Multiples; QuantumMarketCap"]
      - ["Program funding", "Grant and milestone awards", "Award values reported; realized cash unclear", "Public sources mix USD and CAD framing and include contingent future phases", "FinSMEs; HPCwire; Entangled Future"]
    notes: >-
      Official pricing is absent; third-party model labels are directional classifications rather than evidence of
      realized selling price or commercial throughput.
    claimRefs: [CI005, CI006, CI008, CI009, CI011, CI015]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Cash on hand", null, "Low", "Runway cannot be underwritten without current liquidity", "Request latest balance sheet cash and restricted-cash detail"]
      - ["Monthly burn", null, "Low", "Determines how long the May 2026 round and grant cash actually last", "Request monthly net burn and planned hiring ramp"]
      - ["Gross margin", null, "Low", "Needed to test whether hardware-efficient error correction can become an economic moat", "Request expected unit BOM, service burden, and target gross margin by product stage"]
      - ["Headcount proxy", "~60 employees (third-party estimate)", "Low", "Useful as a rough burn proxy only if management validates it", "Confirm current FTE count, planned hiring, and loaded cost per employee"]
      - ["Capital-efficiency thesis", "Claimed lower qubit and capital overhead versus brute-force architectures", "Medium", "Capital intensity is central to valuation because public revenue data is absent", "Request capex plan, lab expansion budget, and cost per milestone toward fault tolerance"]
    notes: >-
      Null values indicate missing public disclosure rather than zero; the only non-null operating proxy in this
      table is a third-party estimate that should not be used as a finalized underwriting input.
    claimRefs: [CI007, CI010, CI016]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows funding and engineering scaling clearly, while the bridge from technical milestones to
      priced commercial revenue remains mostly undisclosed.
    data:
      nodes:
        - id: external-capital
          label: External capital
          value: "$30M equity + disclosed non-dilutive programs"
          note: Publicly disclosed funding sources are clearer than operating revenue.
        - id: engineering-scale-up
          label: Engineering scale-up
          detail: Funding is earmarked for roadmap execution, engineering growth, and lab expansion.
        - id: technical-milestones
          label: Technical milestones
          detail: The company ties commercialization to fault-tolerant quantum-computing progress.
        - id: commercial-systems
          label: Commercial systems
          detail: Public materials frame commercially viable fault-tolerant systems as a 2030 target.
        - id: monetization
          label: Prospective monetization
          detail: Third-party sources classify the model as B2B product sales, but no public pricing or contract template is disclosed.
        - id: gross-profit
          label: Gross profit visibility
          detail: Unknown until bill of materials, service burden, and realized customer pricing are disclosed.
          tone: risk
      edges:
        - from: external-capital
          to: engineering-scale-up
          relationship: Funds current execution.
        - from: engineering-scale-up
          to: technical-milestones
          relationship: Hiring and lab spend are meant to accelerate the roadmap.
        - from: technical-milestones
          to: commercial-systems
          relationship: Fault tolerance is the stated commercialization gate.
        - from: commercial-systems
          to: monetization
          relationship: Revenue depends on converting roadmap progress into sellable systems.
        - from: monetization
          to: gross-profit
          relationship: Margin cannot be estimated without realized pricing and delivery cost.
    approximationNotes: >-
      This is a public-source bridge, not a modeled P&L waterfall; the final two nodes remain hypothesis-level
      because pricing, contracts, and operating margins are undisclosed.
    claimRefs: [CI002, CI003, CI006, CI007, CI016]
callouts:
  - calloutType: insight
    title: Financing is public; monetization is not
    body: >-
      Nord Quantique's visible financial narrative is still dominated by capital raised and program support rather
      than by disclosed revenue mechanics, which means the next diligence step is data access, not multiple math.
    claimRefs: [CI001, CI004, CI005, CI016]
  - calloutType: risk
    title: Technical execution risk still underwrites the valuation
    body: >-
      Independent technical coverage still treats the platform as early proof-of-concept rather than as a mature,
      economically validated product, so future financing needs are likely to remain milestone-driven.
    claimRefs: [CI012, CI013, CI014]
