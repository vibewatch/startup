callouts:
  - calloutType: risk
    title: Valuation is better evidenced than capitalization
    body: >-
      Multiple independent profiles report a $1.4 billion valuation, but total
      funding ranges from $38 million to $73 million because sources use
      different round histories, currencies, and grant treatment.
    claimRefs: [CO005, CO006, CO007, CO008]
  - calloutType: insight
    title: Fidelity improved at a throughput cost
    body: >-
      The July 2026 sub-0.1% SPAM result is technically material, but the
      retained independent account says only about 9% of shots survived both
      postselection stages.
    claimRefs: [CO015, CO016]
