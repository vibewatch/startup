slug: nord-quantique
runDate: 2026-10-18
company:
  name: Nord Quantique
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Nord Quantique is a private Sherbrooke quantum-computing company founded in
    2020 around a hardware-efficient bosonic error-correction architecture. A
    May 2026 $30 million investment and reported $1.4 billion valuation are the
    strongest current scale signals, but total funding, governance, headcount,
    revenue, and customer traction remain unreconciled or private.
sections:
  - id: identity-and-operating-stage
    title: Identity, operating stage, and business model
    body: >-
      Nord Quantique is consistently identified as a Sherbrooke, Quebec quantum
      hardware company founded in 2020. Its core proposition is not a
      conventional high-qubit-count processor: the company is developing
      superconducting bosonic qubits that encode error protection within the
      qubit, with a claimed path toward a 1:1 logical-to-physical ratio. That
      architecture supports a capital-efficiency narrative built around fewer
      devices, rack-scale deployment, and eventual fault-tolerant systems.
      Public-company status is clearer than commercial maturity: an
      October 2026 market profile records the business as private, with no
      announced IPO or public ticker. The retained evidence does not establish
      a recurring-revenue model, production customer base, or verified location
      footprint beyond the Sherbrooke headquarters, so those fields remain
      diligence gaps rather than zero values.
    claimRefs: [CO001, CO002, CO003]
    tableRefs: [TO001]
  - id: capitalization-and-stakeholders
    title: Capitalization, valuation, and stakeholders
    body: >-
      Nord Quantique announced a $30 million investment on May 18, 2026, with
      BDC and funds managed by Fidelity Investments Canada among the disclosed
      backers. Independent profiles also report a roughly $1.4 billion May 2026
      valuation, but no filing or disclosed term sheet in the assigned evidence
      confirms the security terms, dilution, or investor rights. More
      importantly, "total raised" is not yet a normalized metric. Multiples
      reports $38 million across three rounds, while Entangled Future reports
      $73 million using a different round history and currency-conversion
      method. Company-issued material separately identifies $16 million through
      the Canadian Quantum Champions Program and $5 million under DARPA Stage B,
      with up to another $10 million possible in that phase. Equity, grants,
      staged awards, and currency conversions therefore should not be collapsed
      into one cash-available figure.
    claimRefs: [CO004, CO005, CO006, CO007, CO008]
    tableRefs: [TO003]
  - id: leadership-and-governance
    title: Leadership, founder coverage, and governance
    body: >-
      Public profiles identify Julien Camirand Lemyre and Philippe St-Jean as
      the founding pair and currently list them as CEO and CBO, respectively.
      The visible operating bench adds technical leadership through
      Marc-Antoine Lemonde and Dany Lachance-Quirion, while 2026 appointments in
      finance, communications, and marketing suggest an effort to professionalize
      the organization around fundraising and commercialization. That roster is
      useful but not equivalent to governance evidence. The allocated sources
      do not provide a current board list, committee structure, founder voting
      control, investor consent rights, or succession plan. The public narrative
      remains strongly founder-centered, and the absence of a verified board
      map prevents a firm conclusion about oversight quality or key-person
      mitigation.
    claimRefs: [CO009, CO010, CO011]
    tableRefs: [TO002]
  - id: technical-milestones-and-execution-risk
    title: Technical milestones and execution risk
    body: >-
      The technical chronology contains substantive progress but needs careful
      qualification. In 2024, company and independent coverage reported a 14%
      logical-lifetime improvement for a GKP qubit relative to the same states
      without correction. Entangled Future notes that the corrected lifetime
      remained below a simpler simulated Fock-state encoding, challenging a
      broad "beyond break-even" interpretation. In July 2026, independent
      coverage reported state-preparation and measurement error below 0.1% for a
      grid-state qubit. That result was also postselected: roughly 24% of
      preparation runs and 39% of measurement runs survived their respective
      filters, leaving about 9% combined. The evidence therefore supports a
      meaningful single-qubit milestone, not proof of a scaled processor or
      commercial system. Multi-qubit gates, throughput at scale, and conversion
      of laboratory progress into customer workloads remain the central
      execution tests.
    claimRefs: [CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
