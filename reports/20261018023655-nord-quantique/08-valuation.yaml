  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: commercialization
      missingEvidence: Named customers, paid deployments or contracted pilots, disclosed revenue, and gross-margin evidence tied to the current product roadmap.
      whyItMatters: Public price support is weak without proof that technical milestones are converting into repeatable commercial demand.
      diligencePath: Request current bookings, customer references, deployment status, and product-specific gross-margin disclosure under NDA.
      relatedQuestionRefs: [QV006, QV008]
    - type: private-evidence-only
      severity: material
      topic: capital-structure
      missingEvidence: Current post-money ownership, liquidation preferences, pro rata rights, board rights, and any venture debt or side letters.
      whyItMatters: Valuation discipline depends on knowing how much downside protection existing investors hold relative to new money.
      diligencePath: Review the latest financing documents, cap table, and investor rights agreements before underwriting any return case.
      relatedQuestionRefs: [QV002, QV004]
    - type: missing-source
      severity: material
      topic: comparables
      missingEvidence: Recent independent secondary marks, M&A references, or milestone-based private round data for closely comparable quantum-hardware companies.
      whyItMatters: Current public comp support is directionally useful but too thin to prove that $1.4 billion is attractive rather than merely plausible.
      diligencePath: Collect fresh private-market comp data from board materials, banker comps, or investor updates and reconcile it against the public tracker set.
      relatedQuestionRefs: [QV003]
