      - ["Thesis: hardware-efficiency upside", "Nord Quantique argues bosonic GKP methods can cut fault-tolerance overhead materially versus brute-force approaches.", "Peer-reviewed, multi-qubit, customer-relevant benchmarks that show the efficiency advantage survives at scale."]
      - ["Anti-thesis: proof quality is still early", "Entangled Future says the 2025 Tesseract result used post-selection and that the 2024 lifetime gain was still below a simpler benchmark, while PostQuantum points to an outside beyond-break-even result.", "A replicated, independently reviewed milestone that removes the post-selection and benchmarking caveats."]
      - ["Anti-thesis: public underwriting inputs are missing", "Retained public sources still do not disclose revenue, customer counts, gross margins, burn, or the preference stack.", "Verified disclosure on commercialization, unit economics, and investor protections."]
    notes: >-
      The table mixes upside and downside cases on purpose; it is not a scorecard and should be read as a
      price-sensitivity checklist.
    claimRefs: [CV001, CV004, CV005, CV010, CV012, CV013, CV014, CV015, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - ["Bull", "Independent proof lands on logical-qubit scaling, and financing optionality stays available through strategic or non-dilutive channels.", "Upside comes from Nord Quantique being repriced toward the top end of scarce quantum-hardware comps rather than from near-term cash flow.", "Commercial adoption still has to catch up with technical progress.", "Peer-reviewed scale milestone, stronger private-round terms, or customer pilots."]
      - ["Base", "The company continues to look technically differentiated, but public commercial disclosure stays limited.", "The current $1.4B mark is only defensible if later evidence fills today's disclosure gaps, so returns depend on entry discipline.", "Investors may pay for promise before product-market proof is visible.", "More detailed revenue, customer, and cap-table disclosure."]
      - ["Bear", "Roadmap slippage, weaker fundraising terms, or quantum multiple compression hits before commercialization is visible.", "Headline valuation compresses because there is no public revenue or liquidity anchor to defend it.", "Down-round risk, dilution, and loss of negotiating leverage can reinforce each other.", "Missed milestone dates, flat/down rounds, or continued opacity on commercialization."]
    notes: >-
      Scenario ranges remain qualitative because the retained public sources do not disclose enough operating
      data to support a defensible DCF, revenue-multiple bridge, or ownership-model return case.
    claimRefs: [CV002, CV005, CV007, CV008, CV010, CV011, CV012, CV013, CV016]
