company:
  name: Nord Quantique
chapter:
  number: 8
  title: Valuation
  summary: >-
    Nord Quantique's public valuation case is anchored by a reported $30 million May 2026 financing at a
    $1.4 billion valuation, but the retained evidence still prices technical promise more clearly than
    commercial proof. That mix supports a track recommendation with medium confidence, high risk, and a
    stretched valuation stance until commercialization and cap-table disclosure materially improve.
sections:
  - id: investment-view
    title: Investment view and entry discipline
    body: >-
      The cleanest public valuation datapoint is a May 2026 financing that both company-linked releases and
      independent trackers describe as a $30 million round, with Multiples and Entangled Future tying it to
      a reported $1.4 billion valuation. Multiples also describes the round as straight equity capital rather
      than a structured earn-out, which helps anchor the headline price but does not solve the underwriting
      problem. The same retained evidence set still does not disclose revenue, customer counts, gross margins,
      burn, or liquidation preferences, and Quantum Market Cap says the company remained private with no
      announced IPO as of October 2026. That makes the current opportunity look more like an option on
      fault-tolerant quantum hardware than a buyable cash-flow story, so the disciplined call is track rather
      than buy at the current public headline valuation.
    claimRefs: [CV001, CV002, CV003, CV004, CV006, CV007, CV016]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: scenario-framing
    title: Scenario framing and comparable context
    body: >-
      The bull case rests on hardware efficiency and follow-on financing capacity. Nord Quantique's own
      materials argue that brute-force fault tolerance can consume 100-1,000 qubits for one working qubit,
      while its February 2024 article claims the bosonic GKP approach could need 1,000-10,000 times fewer
      physical qubits once scaled; Entangled Future says management is targeting utility-scale systems with
      more than 100 logical qubits by 2029. That upside deserves attention, but the anti-thesis is equally
      important: Entangled Future says a 2025 Tesseract result relied on post-selection and a company
      technical paper, and that the 2024 autonomous GKP result improved logical lifetime by 14% but still
      sat below a simpler benchmark. PostQuantum also notes that other researchers had already demonstrated
      real-time GKP correction beyond break-even in a 2023 Nature paper, which means Nord Quantique is racing
      a fast-moving technical frontier rather than owning it outright. Against Multiples' comp set, the
      reported $1.4 billion mark is plausible for a scarce private quantum-hardware name, but it is not
      obviously cheap on public evidence alone.
    claimRefs: [CV002, CV005, CV008, CV009, CV010, CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV003]
  - id: diligence-and-exit
    title: Final diligence asks, downside triggers, and exit readiness
    body: >-
      Exit readiness remains conceptual rather than documented. Quantum Market Cap says Nord Quantique is
      still private with no public ticker or announced IPO, and it explicitly warns that buying Rigetti does
      not provide ownership exposure to Nord Quantique. Returns therefore depend on later private rounds,
      strategic acquisition interest, or a future IPO process that is not yet visible in the retained
      sources. The next diligence cycle should focus on paid deployments or contracted pilots, customer and
      margin disclosure, and the current preference stack, because those are the missing facts that decide
      whether today's headline valuation is defensible. Thesis-break triggers are straightforward: roadmap
      slippage against the company's scaling ambitions, a financing event that exposes harsher dilution terms
      than the unicorn headline suggests, or persistent absence of commercialization data while peer
      valuations compress.
    claimRefs: [CV006, CV007, CV009, CV010, CV016]
