callouts:
  - calloutType: recommendation
    title: Recommendation
    body: >-
      Track Nord Quantique rather than underwriting a buy at the current headline valuation, because public
      evidence validates the financing round more clearly than it validates commercialization or downside
      protection.
    claimRefs: [CV001, CV002, CV003, CV016]
  - calloutType: risk
    title: Why risk remains high
    body: >-
      The most visible technical milestones still carry caveats on post-selection, peer review, or benchmark
      quality, so valuation can de-rate quickly if fundraising terms soften before product proof arrives.
    claimRefs: [CV011, CV012, CV013, CV014]
  - calloutType: assumption
    title: What would move the call
    body: >-
      The recommendation can improve only if Nord Quantique pairs independent scaling proof with hard
      commercialization disclosure such as customers, margins, and a cleaner view of preference terms.
    claimRefs: [CV007, CV010, CV016]
