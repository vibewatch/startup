    summary: >-
      The visible commercialization path moves from technical validation to future enterprise
      rollout, with the current evidence strongest at the validation and financing stages.
    data:
      items:
        - label: Research-lab validation
          actor: Research labs
          tone: neutral
          touchpoints:
            - Prototypes tested in Canadian research labs
            - Technical milestones precede named customer disclosures
        - label: Government screening and grant support
          actor: DARPA and Canadian programs
          tone: neutral
          touchpoints:
            - DARPA Stage B participation
            - Canadian Quantum Champions non-dilutive funding
        - label: Investor financing
          actor: VC and strategic investors
          tone: positive
          touchpoints:
            - $30M round and reported $1.4B valuation
            - Validation is capital-market based rather than customer-count based
        - label: Targeted industrial use cases
          actor: Prospective enterprise R&D buyers
          tone: opportunity
          touchpoints:
            - Materials science, pharma, chemistry, optimization, and cryptography use cases
            - No named production customer disclosed in the pool
        - label: Future production deployment
          actor: Prospective paying accounts
          tone: risk
          touchpoints:
            - Useful fault-tolerant systems targeted by 2030
            - Public rollout timing remains roadmap language rather than installed-base language
        - label: Expansion and retention loop
          actor: Same accounts and adjacent accounts
          tone: risk
          touchpoints:
            - Land-and-expand remains hypothetical
            - No NRR, churn, renewal, or concentration metrics disclosed
    claimRefs: [CU001, CU003, CU009, CU010, CU011, CU012]
