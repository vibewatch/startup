  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: named-customer-proof
      missingEvidence: >-
        Named production customers, workload descriptions, deployment dates, and measured customer
        outcomes.
      whyItMatters: >-
        Without named production references, it is impossible to separate technical promise from
        real commercial adoption.
      diligencePath: >-
        Request a customer list segmented by pilot versus production, with at least three
        reference calls and one documented outcome metric.
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: retention-metrics
      missingEvidence: NRR, GRR, logo churn, renewal timing, and contract term by cohort.
      whyItMatters: >-
        Durability determines whether early design wins can compound into a credible recurring
        business.
      diligencePath: >-
        Request cohort-level booking and renewal data plus sample contract language on term,
        cancellation, and expansion rights.
    - type: private-evidence-only
      severity: material
      topic: concentration-risk
      missingEvidence: Top-customer revenue share, channel mix, and partner dependence by account.
      whyItMatters: >-
        Concentration can make early revenue look better than the underlying account diversity
        actually is.
      diligencePath: >-
        Request the top-ten account list, revenue share by customer and partner channel, and any
        procurement blocker or slip history for lighthouse accounts.
