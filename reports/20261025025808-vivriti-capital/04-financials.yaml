callouts:
  - calloutType: strength
    title: Scaled lending platform with operating leverage signals
    body: FY26 standalone revenue and PAT growth combine with a supplier case study showing materially faster loan-document execution, although the efficiency claim is not a substitute for audited unit economics.
    claimRefs: [CI004, CI006]
  - calloutType: risk
    title: Liquidity and loss economics remain underwritten gaps
    body: Borrowings, leverage, weaker cash balances, and ICRA's geographic-concentration warning make the absent maturity ladder, realized spread, and product-level loss curve material.
    claimRefs: [CI013, CI014, CI015, CI016]
  - calloutType: recommendation
    title: Require entity-level financial reconciliation before valuation
    body: Reconcile group, standalone, and post-scheme metrics before using AUM, revenue, PAT, cash, or capital ratios in an investment model.
    claimRefs: [CI003, CI004, CI011, CI015]
