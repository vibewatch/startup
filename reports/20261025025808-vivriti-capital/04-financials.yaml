artifact: financials
slug: vivriti-capital
runDate: 2026-10-25
company:
  name: Vivriti Capital
chapter:
  number: 4
  title: Financials
  summary: Vivriti Capital's lending business reached ₹1,645.9 crore of FY26 standalone revenue from operations and ₹264.3 crore of PAT, but reported borrowings of ₹9,319 crore, 3.87x debt/equity, and weaker cash balances make funding access and credit costs central to the case. Realized pricing, product-level margin, CAC, maturity ladders, and a post-scheme entity bridge remain material underwriting gaps.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Vivriti is a mid-market lender rather than a SaaS company: its disclosed products include enterprise term and structured loans, working-capital facilities, supply-chain finance, factoring, and co-lending. Unlisted Sahi Hai reports FY26 standalone revenue from operations of ₹1,645.9 crore, up 22%, and PAT of ₹264.3 crore, up 20%. The same source estimates the consolidated revenue mix at 90% interest income, 9% fees and commissions, and 1% treasury gains, making spread income and credit performance the dominant economics. A 2025 CFO interview separately reported group AUM of ₹13,181 crore and group revenue of ₹1,429.1 crore, up 28.9%; those group figures have a different scope and period and should not be combined with FY26 standalone metrics. No assigned source provides list pricing, realized loan yields, discount schedules, or product-level margins, so AUM growth cannot substitute for a revenue-quality bridge.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: operating-efficiency
    title: GTM motion and operating efficiency
    body: >-
      The public efficiency evidence is operational rather than economic. A Leegality supplier case study says digitized loan paperwork reduced execution time from three hours to five minutes, lifted productivity three- to four-fold, and allowed monthly loan volume to double. Because this is a supplier-published account using Vivriti management testimony, it is evidence of the claimed workflow change, not independent proof of lower CAC or better loss-adjusted returns. Foundit's company-job reposts show demand for underwriting, portfolio monitoring, treasury, regulatory reporting, reconciliation, loan servicing, and product-development skills. That breadth indicates a people- and control-intensive operating model despite automation, but it does not establish current headcount, payroll growth, or cost per account. Investors still need funnel conversion, sales cycle, channel CAC, servicing cost, repeat borrowing, and contribution margin by product before treating faster document execution as durable operating leverage.
    claimRefs: [CI006, CI007, CI016]
    tableRefs: [TI003]
  - id: capital-risk
    title: Capital adequacy, asset quality, and diligence blockers
    body: >-
      The funding model is wholesale and debt-dependent. The 2025 CFO interview attributes approximately 60% of the capital structure to banks, 7–8% to exchange-traded commercial deposits, and the remaining 30% to NCDs. Separate historical financings include a US$25 million ADB climate-bond loan reported in 2024 and a US$55 million Series C announced in 2022; neither amount represents cash still available in FY26. ICRA reported 9M FY2026 total income of ₹1,214 crore, PAT of ₹160 crore, managed assets of ₹12,171 crore, gross NPA of 2.4%, and CRAR of 20.5%. Its June 2026 securitization rationale also identified high geographic concentration, with three states representing about 44% of one unsecured personal/MSME pool. Unlisted Sahi Hai reports FY26 borrowings of ₹9,319 crore and debt/equity of 3.87x, while consolidated operating cash outflow was ₹1,569 crore as the loan book grew and cash and bank balances fell to ₹667 crore from ₹1,004 crore. That outflow is growth-related accounting cash flow, not a disclosed cash-burn rate.
    claimRefs: [CI008, CI009, CI010, CI011, CI012, CI013, CI014, CI015]
    tableRefs: []
    figureRefs: []
  - id: underwriting-verdict
    title: Financial verdict
    body: >-
      Vivriti shows genuine scale, profitability, institutional funding access, and a plausible automation benefit, but it remains a capital-intensive lender whose growth consumes funding capacity. FY26 standalone PAT and a reported 21.04% CRAR are constructive; 3.87x debt/equity, higher gross NPA indicators, falling cash balances, and dependence on wholesale lenders limit the inference that reported revenue growth will translate mechanically into distributable cash. The central issue is not a lack of revenue but the quality and durability of the spread after funding cost, impairment, servicing expense, and concentration risk. Before valuation, diligence should obtain audited post-scheme standalone and consolidated statements, product-level yield and fee bridges, credit-cost vintages, top exposures, ALM buckets, committed facilities, covenants, cash-flow conversion, CAC, and repeat-borrower cohorts. Until those denominators are available, the evidence supports a profitable lender with material refinancing and credit-cycle sensitivity, not a quantified margin-expansion thesis.
    claimRefs: [CI004, CI005, CI012, CI013, CI014, CI015, CI016]
    tableRefs: []
    figureRefs: []
