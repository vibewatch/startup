  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: entity-reconciliation
      missingEvidence: "An audited bridge from group AUM and revenue to the current operating entity, including post-scheme ownership and intercompany items."
      whyItMatters: "The assigned sources mix group, subsidiary, historical, and rated-pool metrics that cannot be combined into a single underwriting model without entity reconciliation."
      diligencePath: "Request audited standalone and consolidated statements, scheme accounting, segment notes, and a management bridge for FY2025-FY2026."
      relatedQuestionRefs: [QI009]
    - type: private-evidence-only
      severity: material
      topic: liquidity
      missingEvidence: "Cash balances, committed facilities, debt maturity ladder, weighted funding cost, covenant headroom, and stress-liquidity assumptions."
      whyItMatters: "A wholesale-funded lender can remain profitable while facing refinancing or asset-liability mismatch risk."
      diligencePath: "Obtain the latest ALM statement, lender schedule, liquidity policy, stress tests, and board-approved capital plan."
      relatedQuestionRefs: [QI010]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: pricing
      missingEvidence: "Realized interest yield, fee take rates, discounts, CAC, payback, and loss-adjusted contribution by product and channel."
      whyItMatters: "AUM and reported revenue growth do not establish revenue quality, pricing power, or unit economics."
      diligencePath: "Request product-level cohort economics, origination funnel, pricing waterfall, funding cost, servicing cost, and loss data."
      relatedQuestionRefs: [QI002, QI005]
      relatedTableRefs: [TI002, TI003]
    - type: conflicting-data
      severity: minor
      topic: scale
      missingEvidence: "A date- and entity-consistent reconciliation of the official group's ₹15,000+ crore AUM claim, the 2025 interview's ₹13,181 crore group AUM, and ICRA's ₹12,171 crore VCL managed assets."
      whyItMatters: "Different scopes and dates could otherwise create false growth or margin calculations."
      diligencePath: "Request monthly AUM definitions and entity-level roll-forward for the twelve months through the report date."
