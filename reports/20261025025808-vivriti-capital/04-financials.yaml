    title: Unit economics and capital adequacy checklist
    columns: [Metric, Value or null, Confidence, Why it matters, Diligence ask]
    rows:
      - [Standalone revenue from operations, "₹1,645.9 crore in FY26, +22%", medium, "Establishes current lending-business scale", "Reconcile to audited statements and product mix"]
      - [Standalone PAT, "₹264.3 crore in FY26, +20%", medium, "Shows accounting profitability but not cash conversion", "Provide audited PAT-to-cash bridge"]
      - [Gross NPA, "2.4% in 9M FY2026 per ICRA; 2.20% for FY26 per Unlisted Sahi Hai", medium, "Credit losses directly affect margin and capital", "Reconcile period definitions and provide vintage losses"]
      - [CRAR, "20.5% in 9M FY2026 per ICRA; 21.04% for FY26 per Unlisted Sahi Hai", medium, "Regulatory capital buffer constrains lending growth", "Provide current stress tests and capital plan"]
      - [Debt and liquidity, "₹9,319 crore borrowings; 3.87x debt/equity; ₹667 crore cash and bank balances", medium, "Wholesale leverage and liquidity determine growth capacity", "Provide ALM ladder, covenants, and committed lines"]
      - [CAC or payback, null, low, "Without acquisition cost, faster origination cannot be translated into returns", "Provide channel CAC, sales cycle, and payback by product"]
      - [Cash runway and liquidity buffer, null, low, "Wholesale funding dependence makes liquidity a core risk", "Provide cash, committed lines, maturities, and stress liquidity"]
      - [Borrower concentration and repeat usage, null, low, "Concentration and retention determine loss-adjusted durability", "Provide top exposures, sector mix, renewals, and repeat borrowing"]
    notes: "Values are not comparable without entity and period reconciliation; null means the assigned public sources did not disclose a usable metric, not that the metric is zero."
    claimRefs: [CI004, CI011, CI012, CI014, CI015, CI016]
