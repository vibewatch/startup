artifact: customers
slug: vivriti-capital
runDate: 2026-10-25
company:
  name: Vivriti Capital
chapter:
  number: 6
  title: Customers
  summary: Vivriti serves mid-market enterprises through tailored debt products, with public evidence of broad sector coverage, named borrower relationships, and rapid onboarding. The evidence supports real commercial reach, but public materials do not establish current borrower cohorts, repeat usage, revenue concentration, or the production status of every named relationship.
sections:
  - id: customer-segmentation-and-scale
    title: Customer segmentation and scale
    body: >-
      Vivriti's disclosed customer proposition is centered on Indian mid-market and corporate borrowers that need term debt, working-capital finance, supply-chain finance, factoring, co-lending, securitization, or other structured debt. The customer universe is broader than a single software-like ICP: Tracxn describes SMEs, mid-sized enterprises, large corporates, and retail NBFCs across multiple sectors, while the company surface separately lists mid corporates, large corporates, SMEs, and retail NBFCs. The public record therefore supports segmentation by borrower size and financing use case, but not a current revenue-band or payer-level mix. Built In reports a portfolio of INR 8,800+ crore across 300+ enterprises and 45+ sectors, whereas Vivriti Group's current surface reports 550+ mid-market enterprises and 55+ sectors; the differing scopes and vintages should not be treated as a single reconciled customer count.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU014, CU020]
    tableRefs: [TU001]
  - id: adoption-and-named-proof
    title: Adoption and named customer proof
    body: Public customer proof is strongest where a named borrower describes a concrete financing interaction. Cilicant describes funds arriving when needed for a business opportunity, SV Agri calls Vivriti a catalyst in its growth journey, RentoMojo cites tailored solutions, and Bizongo describes Vivriti as one of its largest lenders after more than two years of association. MediBuddy identifies Vivriti as its primary lender and emphasizes speed, while SUN Mobility describes Vivriti as an early partner in the EV and battery-swapping sector. These statements demonstrate named relationships and use cases, but they are company-selected testimonials and do not independently verify loan balances, repayment performance, renewal rates, or whether each relationship remains active as of the run date.
    claimRefs: [CU007, CU011, CU017, CU019]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-expansion-and-gaps
    title: Durability, expansion, and concentration gaps
    body: Vivriti reports 90%+ client retention in the Built In profile, and its operating model emphasizes continuous engagement, rapid turnaround, and customized products. Those signals are consistent with a relationship-lending model in which repeat borrowing and cross-product expansion could matter, but the public evidence does not define the retention denominator, measurement period, gross versus net retention, or treatment of inactive borrowers. The 2025 CFO interview says the company serves 300+ mid-market clients across a wider metropolitan footprint and intends to deepen on-ground presence, while also noting that young-business credit assessment is difficult. No assigned source provides top-customer exposure, channel concentration, cohort roll-forward, churn, renewal, or contract-length data. These are material diligence gaps for underwriting durability and concentration risk.
    claimRefs: [CU004, CU014, CU015, CU016, CU021, CU022]
    callouts:
      - calloutType: risk
        title: Retention is not yet cohort evidence
        body: The public 90%+ retention statement lacks a disclosed denominator, period, and cohort bridge, so it should not be used as NRR, GRR, or proof of recurring borrower expansion.
        claimRefs: [CU004, CU016]
      - calloutType: insight
        title: Relationship depth is visible, concentration is not
        body: Named borrowers describe repeated or strategically important financing relationships, but public materials do not quantify the exposure represented by those accounts or distinguish production deployments from reference relationships.
        claimRefs: [CU011, CU021]
