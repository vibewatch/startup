      - ["Client retention", "90%+", "Profile accessed for 2026 run; period and denominator not stated", "Built In", "medium", "Suggests relationship durability if defined consistently", "Cohort definition, observation window, gross/net basis, and inactive-account treatment"]
      - ["Mid-market client base", "300+ mid-market clients", "2025-07-02", "ETCFO", "high", "Supports current operating reach and planned local servicing", "Current active borrowers, balances, and repeat share"]
      - ["Group enterprise coverage", "550+ mid-market enterprises and 55+ sectors", "Current group page accessed 2026-10-25; page does not state a measurement date", "Vivriti Capital", "medium", "Indicates a larger group-level footprint than older profiles", "Entity scope, active status, and reconciliation to Capital-only figures"]
