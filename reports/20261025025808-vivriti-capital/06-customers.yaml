    claimRefs: [CU003, CU004, CU014, CU020]
  - id: TU003
    title: Named customer proof table
    columns: [Customer, Segment, Deployment or use case, Production vs pilot, Reported outcome, Limitation]
    enumerationScope:
      coverage: sample
      basis: Company-selected named testimonials and borrower financing announcements available in the assigned 2022-2026 source pool
    rows:
      - ["Cilicant", "Mid-market enterprise", "Financing for business opportunities and transactions", "Named customer relationship; production status not independently verified", "Founder says funds were made available when needed and the process was more seamless than banks or private equity", "Testimonial does not disclose facility size, dates, or current status"]
      - ["SV Agri", "Mid-market enterprise", "Growth financing", "Named customer relationship; production status not independently verified", "Founder calls Vivriti a catalyst in the company's growth journey", "No independently measured outcome or repayment history"]
      - ["RentoMojo", "Platform or growth company", "Tailored financing solutions", "Named customer relationship; production status not independently verified", "Head of Capital & Resourcing cites quick understanding of the business and tailored solutions", "No public facility, utilization, or renewal data"]
      - ["SUN Mobility", "EV and battery-swapping company", "Early financing partnership", "Named early partner; production status not independently verified", "CEO says Vivriti was among its first partners and links the relationship to sector traction", "No quantified causal outcome or current exposure"]
      - ["Bizongo", "Platform and supply-chain finance", "Platform/vendor onboarding and limits", "Named customer relationship; production status not independently verified", "Head of Supply Chain Finance cites more than two years, fast documentation, portfolio visibility, and data-informed limits", "No public share of Bizongo exposure or renewal terms"]
      - ["MediBuddy", "Venture-backed healthcare company", "Debt financing", "Named primary lender; production status not independently verified", "Head of Finance & Legal cites speed and a move from venture debt toward traditional lenders/NBFCs", "No facility size, tenor, or repayment data"]
      - ["Fashinza", "Platform or growth company", "Working-capital financing", "Named lender relationship; production status not independently verified", "Co-founder describes close to three years of association and support for working capital", "No current balance, churn, or expansion data"]
      - ["Care.fi", "Healthcare fintech borrower", "Debt financing for hospital revenue-cycle expansion", "Financing announcement; production use of Vivriti facility is reported, not independently audited", "Viestories and Incubees report INR 7.5 crore debt from Vivriti; Care.fi reported 300+ hospitals and 50,000+ claims on its platform", "Borrower operating metrics are Care.fi claims, not proof of Vivriti portfolio performance"]
    notes: The official page supplies the named testimonials; the two Care.fi articles corroborate the financing announcement but are related coverage of the same borrower release. Logos and testimonials do not establish retention, production scale, or portfolio concentration.
    claimRefs: [CU007, CU011, CU017, CU019]
figures:
  - id: FU001
    title: Customer journey from segment access to expansion
    summary: Vivriti's public customer evidence traces a path from sector-led outreach and underwriting to financing, ongoing engagement, and potential repeat or cross-product use; the final expansion loop remains only partly evidenced.
    type: journey-map
    data:
      items:
        - id: segment-access
          label: Segment access
          title: Segment access
          summary: Sector assessment teams and outreach target mid-market borrowers, corporates, SMEs, and financial institutions.
          touchpoints: ["Sector assessment teams", "Social-media outreach", "Mid-market and corporate focus"]
        - id: needs-definition
          label: Needs definition
          title: Needs definition
          summary: Product and finance teams work with the borrower to select a tailored debt solution.
          touchpoints: ["Customized product suite", "Working capital", "Term debt and supply-chain finance"]
        - id: underwriting
          label: Underwriting
          title: Underwriting
          summary: Public materials describe workplace diligence, digital underwriting, liquidity modelling, and early-warning monitoring.
          touchpoints: ["Data-driven credit assessment", "Client liquidity model", "Early-warning models"]
        - id: funding
          label: Funding
          title: Funding
          summary: Named customers describe capital arriving quickly for growth, transactions, and working capital.
          touchpoints: ["Less-than-10-day turnaround claim", "Cilicant", "MediBuddy"]
        - id: engagement
          label: Continuous engagement
          title: Continuous engagement
          summary: Vivriti describes ongoing responsiveness and named borrowers report multi-year relationships.
          touchpoints: ["Continuous engagement", "Bizongo: more than two years", "Fashinza: close to three years"]
        - id: expansion
          label: Expansion loop
          title: Expansion loop
          summary: Cross-product and repeat borrowing are plausible relationship outcomes, but public evidence does not quantify renewal, NRR, or borrower concentration.
          touchpoints: ["Tailored follow-on needs", "Potential repeat financing", "Public cohort data missing"]
    claimRefs: [CU006, CU007, CU011, CU016, CU021]
callouts:
  - calloutType: strength
    title: Real customer relationships are publicly evidenced
    body: Named borrowers describe concrete financing use cases, multi-year associations, and operational benefits; this is stronger than an undifferentiated logo wall.
    claimRefs: [CU007, CU011]
  - calloutType: risk
    title: Concentration and durability remain unquantified
    body: The assigned evidence does not disclose top-borrower exposure, cohort retention, churn, renewal, contract tenor, or the active status of every named relationship.
    claimRefs: [CU004, CU015, CU016, CU021, CU022]
