evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: A current company valuation, transaction price, or board-approved valuation after the April 2026 reorganisation.
    whyItMatters: Without a current valuation, investor returns and valuation stance cannot be assessed from the chapter evidence.
    diligencePath: Obtain the latest financing documents, cap table, or audited valuation support.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: disclosure-gaps
    missingEvidence: >-
      A post-demerger bridge for revenue, AUM, ownership, and funding between Vivriti Capital Limited and the successor
      entities.
    whyItMatters: Pre- and post-scheme figures may refer to different legal and economic perimeters.
    diligencePath: Request the scheme implementation accounts and management bridge for FY2026.
    relatedQuestionRefs:
      - QO001
      - QO008
  - type: missing-source
    severity: material
    topic: leadership
    missingEvidence: Current biographies, responsibilities, and succession coverage for the full board and executive team.
    whyItMatters: Key-person dependence and governance quality cannot be evaluated from titles alone.
    diligencePath: Obtain the current board pack, committee charters, and executive organisation chart.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: stale
    severity: minor
    topic: scale
    missingEvidence: A current audited headcount and customer/client count as of the run date.
    whyItMatters: >-
      The latest cited client count is from July 2025 and historical scale metrics are not interchangeable with current
      operating scale.
    diligencePath: Request current management KPIs or the latest audited operating review.
    relatedQuestionRefs:
      - QO005
      - QO008
  - type: missing-source
    severity: blocking
    topic: sizing-gap
    missingEvidence: >-
      An independent India mid-market debt stock and annual origination series segmented by borrower size, product,
      geography, and bank eligibility.
    whyItMatters: Without a market denominator, reported company AUM cannot establish TAM, SAM, SOM, or valuation headroom.
    diligencePath: >-
      Commission or obtain a dated market study triangulating RBI, bank, NBFC, bond, and private-credit origination
      data.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: access-blocked
    severity: material
    topic: private-credit
    missingEvidence: Usable underlying text from an independent sector source on NBFC and private-credit market structure.
    whyItMatters: >-
      One intended independent sector article returned only a 404 page and therefore cannot support claims about market
      growth.
    diligencePath: >-
      Locate a current, accessible original article or replace it with a regulator, industry association, or independent
      market-data source in the next refresh.
    relatedQuestionRefs:
      - QM003
      - QM007
  - type: enumeration-incomplete
    severity: material
    topic: buyer-map
    missingEvidence: Contract-level pricing, budget ownership, and adoption conversion data by borrower segment.
    whyItMatters: The buyer map is analytically plausible but cannot quantify willingness to pay, switching cost, or conversion.
    diligencePath: Review anonymized loan applications, win/loss records, pricing sheets, and borrower interviews by segment.
    relatedQuestionRefs:
      - QM005
      - QM006
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: competitive-proof
    missingEvidence: >-
      Current like-for-like pricing, borrower retention, repeat usage, default and recovery performance, and
      funding-cost data for Vivriti and the closest peers.
    whyItMatters: >-
      Without comparable risk-adjusted economics, the apparent specialization advantage cannot be translated into
      durable share or margin protection.
    diligencePath: >-
      Request current cohort retention, repeat-borrowing, realized pricing, vintage loss, recovery, and funding-cost
      schedules from Vivriti and selected peer lenders.
    relatedQuestionRefs:
      - QP004
      - QP005
      - QP006
  - type: enumeration-incomplete
    severity: material
    topic: competitor-landscape
    missingEvidence: >-
      A current, exhaustive list of Indian mid-market private-credit lenders, banks, and internal-build alternatives by
      segment and geography.
    whyItMatters: >-
      The assigned public sources support a useful competitor set but cannot establish market-wide completeness or
      competitor share.
    diligencePath: >-
      Obtain a lender universe from borrower interviews, bank and NBFC filings, debt arrangers, and procurement records,
      then classify overlap by ticket size and borrower type.
    relatedQuestionRefs:
      - QP001
  - type: stale
    severity: minor
    topic: pricing
    missingEvidence: Current Vivriti borrower pricing and current competitor price cards validated as of 2026-10-25.
    whyItMatters: The strongest Vivriti pricing observation is historical and could have changed with funding costs and regulation.
    diligencePath: >-
      Collect current term sheets or anonymized facility data and re-run the comparison using common ticket, tenor,
      collateral, and borrower-risk assumptions.
    relatedQuestionRefs:
      - QP004
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: entity-reconciliation
    missingEvidence: >-
      An audited bridge from group AUM and revenue to the current operating entity, including post-scheme ownership and
      intercompany items.
    whyItMatters: >-
      The assigned sources mix group, subsidiary, historical, and rated-pool metrics that cannot be combined into a
      single underwriting model without entity reconciliation.
    diligencePath: >-
      Request audited standalone and consolidated statements, scheme accounting, segment notes, and a management bridge
      for FY2025-FY2026.
    relatedQuestionRefs:
      - QI009
  - type: private-evidence-only
    severity: material
    topic: liquidity
    missingEvidence: >-
      Cash balances, committed facilities, debt maturity ladder, weighted funding cost, covenant headroom, and
      stress-liquidity assumptions.
    whyItMatters: A wholesale-funded lender can remain profitable while facing refinancing or asset-liability mismatch risk.
    diligencePath: Obtain the latest ALM statement, lender schedule, liquidity policy, stress tests, and board-approved capital plan.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Realized interest yield, fee take rates, discounts, CAC, payback, and loss-adjusted contribution by product and
      channel.
    whyItMatters: AUM and reported revenue growth do not establish revenue quality, pricing power, or unit economics.
    diligencePath: >-
      Request product-level cohort economics, origination funnel, pricing waterfall, funding cost, servicing cost, and
      loss data.
    relatedQuestionRefs:
      - QI002
      - QI005
    relatedTableRefs:
      - TI002
      - TI003
  - type: conflicting-data
    severity: minor
    topic: scale
    missingEvidence: >-
      A date- and entity-consistent reconciliation of the official group's ₹15,000+ crore AUM claim, the 2025
      interview's ₹13,181 crore group AUM, and ICRA's ₹12,171 crore VCL managed assets.
    whyItMatters: Different scopes and dates could otherwise create false growth or margin calculations.
    diligencePath: Request monthly AUM definitions and entity-level roll-forward for the twelve months through the report date.
