  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: >-
      Independent uptime, incident, disaster-recovery, penetration-testing, and service-level records for the lending
      and reporting stack.
    whyItMatters: >-
      Lending decisions and regulatory reporting depend on availability and data integrity, but the vendor case study
      does not independently verify operational resilience.
    diligencePath: >-
      Request the latest SOC reports, penetration-test summary, incident register, recovery objectives, uptime history,
      and reconciliations for production reporting.
    relatedQuestionRefs:
      - QE006
      - QE007
  - type: private-evidence-only
    severity: material
    topic: model-risk
    missingEvidence: >-
      Validation, drift monitoring, explainability, override, and false-positive/false-negative metrics for liquidity,
      fraud, de-duplication, and early-warning models.
    whyItMatters: >-
      Proprietary models influence borrower screening and portfolio monitoring, so model performance and governance
      affect credit losses and regulatory confidence.
    diligencePath: >-
      Obtain model inventories, validation reports, monitoring thresholds, exception logs, and board or risk-committee
      review materials.
    relatedQuestionRefs:
      - QE003
      - QE006
      - QE007
