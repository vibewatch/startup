company:
  name: Vivriti Capital
chapter:
  number: 1
  title: Company Overview
  summary: Vivriti Capital is an India-focused fintech NBFC serving mid-market enterprises through tailored debt, co-lending, supply-chain finance, and related private-credit infrastructure. Current evidence supports a scaled but structurally complex platform after the April 2026 reorganisation; public disclosure remains incomplete on valuation, leadership depth, and post-demerger economics.
sections:
  - id: identity-and-business
    title: Identity, business model, and current structure
    body: >-
      Vivriti Capital was established in 2017 as a fintech non-banking financial
      company focused on debt finance for mid-market enterprises in India. The
      official group profile distinguishes the lending company from Vivriti Asset
      Management, an asset manager established in 2019 for private-credit funds.
      The operating model is therefore broader than a single balance-sheet lender:
      the group combines direct and structured lending with fund-management
      capabilities. Independent coverage describes a technology-led underwriting
      model and a deliberate focus on mid-market borrowers, while the July 2025
      CFO interview reported more than 300 mid-market clients and operations in
      ten Indian metropolitan locations. Secondary analysis places the
      headquarters in Chennai, while the assigned evidence does not establish a
      complete current location roster after the reorganisation. The April 2026 ICRA rationale is the
      strongest current structural evidence: the scheme became effective April 1,
      2026, transferring the NBFC operations and associated assets and liabilities
      from Vivriti Capital Limited to Hari & Company Investments Madras Private
      Limited, with Vivriti Next holding the resulting entities. This separation
      makes pre- and post-reorganisation metrics non-interchangeable without a
      bridge.
    claimRefs: [CO001, CO002, CO003, CO004, CO016]
    tableRefs: [TO001]
  - id: leadership-and-stakeholders
    title: Leadership, governance, and stakeholder map
    body: >-
      The official leadership page identifies Vineet Sukumar as Founder &
      Managing Director and lists independent, nominee, and other director roles,
      including Anita Belani, Namrata Kaul, Santanu Paul, Lazar Zdravkovic, John
      Tyler Day, and Samir Abhyankar. The available evidence does not provide
      biographies for each director or a current executive succession plan. ICRA
      identifies Mr. Vineet Sukumar and Mr. Gaurav Kumar as the founders in June
      2017 and records a promoter equity infusion of INR 200 crore into Vivriti
      Next in Q4 FY2026. The financing structure is consequential: ICRA reports
      more than 66 lenders, with banks representing about 53% of overall funding,
      while the July 2025 CFO interview gave a different group-level mix of about
      60% banks, 7–8% exchange-traded commercial deposits, and about 30%
      non-convertible debentures. These are different disclosures and periods,
      not a single reconciled capital table.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002, TO003]
  - id: funding-scale-and-milestones
    title: Funding, scale, and milestone record
    body: >-
      Vivriti’s 2022 Series C announcement reported a US$55 million financing
      led by Creation Investments and Lightrock, taking cumulative fundraising to
      US$165 million since inception; the release said Creation remained the
      majority shareholder. The 2023 public-issue page separately described a
      proposed secured NCD issue with a base size of INR 250 crore and an overall
      issue limit of INR 500 crore, while the official newsroom records a US$25
      million ADB climate-finance announcement in October 2024. ICRA’s April 2026
      analysis provides the more current lending perimeter: INR 10,848 crore AUM at
      December 2025, INR 9,302 crore at March 2025, 2.4% gross stage 3 at
      December 2025, and a requirement for additional capital to keep managed
      gearing below 4.5 times. The company’s exact current valuation, total
      lifetime capital raised on a consistent perimeter, headcount, and customer
      count remain unresolved in the assigned evidence.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014]
    figureRefs: [FO001]
  - id: diligence-gaps
    title: What remains unverified
    body: >-
      The evidence establishes a substantial credit franchise but not a complete
      investor-grade company profile. The       current legal entity and asset perimeter
      changed in April 2026, and the reviewed ICRA document warns that further
      capital raising is important for the planned growth rate. Asset quality also
      needs continued monitoring: ICRA reports gross stage 3 rising from 1.9% in
      March 2025 to 2.4% in December 2025. The assigned sources do not provide a
      verified current valuation, a full cap table or preference stack, a
      consolidated post-demerger income bridge, a complete leadership biography
      set, or a current employee count. Those are material diligence gaps rather
      than reasons to infer that the metrics are zero or absent.
    claimRefs: [CO012, CO013, CO015]
    calloutRefs: []
