  researchQuestions:
    - id: QR001
      question: "What measurable credit-quality thresholds would indicate that Vivriti's risk profile is deteriorating?"
      type: adverse
      targets: ["contentRequirements/0"]
      status: answered
    - id: QR002
      question: "How exposed is Vivriti to unsecured, co-lending, and moderately rated enterprise credit?"
      type: quantification
      targets: ["contentRequirements/0", "contentRequirements/2"]
      status: answered
    - id: QR003
      question: "What regulatory changes affect co-lending, FLDG, provisioning, and reported delinquencies?"
      type: verification
      targets: ["contentRequirements/1"]
      status: answered
    - id: QR004
      question: "What legal-entity and creditor-protection risks remain in the composite restructuring scheme?"
      type: adverse
      targets: ["contentRequirements/1"]
      status: answered
    - id: QR005
      question: "How dependent are liquidity and growth on banks, NCDs, and other funding partners?"
      type: quantification
      targets: ["contentRequirements/2", "contentRequirements/4"]
      status: answered
    - id: QR006
      question: "What operational failure modes could arise from partner servicing and early-warning technology?"
      type: mechanism
      targets: ["contentRequirements/2", "contentRequirements/4"]
      status: answered
    - id: QR007
      question: "Which public indicators should be monitored as thesis-break or kill criteria?"
      type: comparison
      targets: ["contentRequirements/5"]
      status: answered
    - id: QR008
      question: "What current evidence is available on the effective date and post-scheme exposures?"
      type: freshness
      targets: ["contentRequirements/1", "contentRequirements/5"]
      status: partial
    - id: QR009
      question: "Are the reported liquidity buffers sufficient under a stressed refinancing scenario?"
      type: adverse
      targets: ["contentRequirements/2", "contentRequirements/5"]
      status: unresolved
    - id: QR010
      question: "Which counterparty and borrower concentration schedules are needed to close the risk assessment?"
      type: enumeration
      targets: ["contentRequirements/3", "contentRequirements/5"]
      status: answered
