schemaVersion: "report-v2"
artifact: risks
slug: vivriti-capital
runDate: 2026-10-25
company:
  name: Vivriti Capital
chapter:
  number: 7
  title: Risks
  summary: Vivriti Capital has adequate capital and liquidity for its current scale, but the risk profile is sensitive to portfolio seasoning, unsecured and co-lending exposures, rising credit costs, and the execution of its legal-entity restructuring. Independent rating evidence gives measurable monitoring thresholds, while public evidence does not fully disclose borrower, partner, or exposure-level concentration.
sections:
  - id: credit-and-capital
    title: Credit, capital, and earnings
    body: >-
      The principal financial risk is not an immediate solvency event in the available
      evidence, but the interaction of rapid historical growth, moderate seasoning, and
      riskier wholesale and co-lending exposures. CARE reported AUM of ₹9,302 crore at
      March 31, 2025, with about 33% unsecured loans through co-lending, while ICRA
      reported managed gearing of 3.9 times and gross stage 3 of 2.5% at September 2025.
      ICRA also reported profitability moderating to 1.8% in H1 FY2026 as credit costs and
      funding costs rose. These are observable pressure points, not forecasts: the public
      record does not provide a borrower-level vintage or loss bridge. CARE's explicit
      downgrade sensitivities are GNPA above 2.5%, gearing above 4.25x, and sustained
      profitability moderation; ICRA uses 90+ days past due above 3% and gearing above
      4.5x as negative triggers.
    claimRefs: [CR001, CR002, CR003, CR004, CR005]
    tableRefs: [TR001, TR002]
    figureRefs: [FR001]
  - id: regulatory-and-restructuring
    title: Regulatory and legal-entity execution
    body: >-
      Vivriti is an RBI-registered non-deposit-taking systemically important NBFC, so
      regulatory treatment of co-lending, first-loss guarantees, capital, and reporting
      directly affects economics. ICRA attributes the increase in reported gross stage 3
      and provisions partly to revised digital-lending guidance and the exclusion of FLDG
      coverage from expected-credit-loss calculations. The proposed composite scheme also
      separates the online platform, NBFC, and asset-management businesses; ICRA says the
      scheme received final NCLT approval but that the effective date was still to be
      determined in its December 2025 report. CARE expected no material credit-profile
      impact but identified successful completion as a key monitorable. The unresolved
      diligence issue is therefore implementation: updated legal-entity ownership,
      intercompany exposures, licenses, contracts, and post-effective-date reporting are
      not established by the assigned public texts.
    claimRefs: [CR006, CR007, CR008, CR009]
    tableRefs: [TR003]
  - id: operations-and-dependencies
    title: Operating, partner, and liquidity dependencies
    body: >-
      The operating model depends on partners for origination and servicing in
      co-lending, while the lender depends on continued access to banks, NCD markets,
      and other funders. ICRA says co-lending and partnership arrangements were
      principally consumer, small-business, vehicle-finance, and education loans, and
      that managing partnerships through cycles may require Vivriti to step in to service
      a portfolio. CARE reported more than 45 lender relationships and no negative
      cumulative ALM mismatch at March 31, 2025; ICRA later reported more than about 66
      lenders, ₹508 crore of free cash and liquid investments, ₹56 crore of undrawn bank
      lines, and scheduled collections exceeding near-term debt obligations at September
      30, 2025. These buffers reduce near-term liquidity risk but do not eliminate
      refinancing, servicing, partner-performance, or concentration risk. Public evidence
      does not identify the largest counterparties or contingency-servicing test results.
    claimRefs: [CR010, CR011, CR012, CR013]
  - id: monitoring-and-kill-criteria
    title: Monitoring plan and thesis-break triggers
    body: >-
      Monitoring should focus on the measurable thresholds already used by the rating
      agencies rather than an unsupported claim that no incident has occurred. At each
      reporting date, diligence should reconcile gross stage 3 and 90+ days past due,
      provision coverage, credit cost, cost of funds, managed gearing, CRAR, top-20 and
      single-group exposure, partner-level delinquency, and the completion status of the
      scheme. A thesis-break case is sustained deterioration beyond the agencies' stated
      thresholds, a failure to maintain adequate liquidity or capital after the
      restructuring, or evidence that partner servicing and FLDG arrangements do not
      absorb the expected losses assumed in reported economics. A second break case is
      material undisclosed concentration or a legal-entity transition that weakens
      creditor protections. Exact borrower and partner schedules remain diligence asks,
      not inferred facts.
    claimRefs: [CR004, CR005, CR008, CR012, CR014]

tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Rule or event, Jurisdiction, Status, Likelihood, Severity, Mitigation or monitor, Residual exposure, Diligence path]
    rows:
      - ["Revised digital-lending and co-lending reporting", "India", "Applied in reported ratings; effects visible in GS3/provisions", "Medium", "High", "Reconcile FLDG, ECL, partner contracts, and delinquency reporting", "Credit costs and reported delinquencies can rise", "Obtain current RBI compliance memo and partner-level loss bridge"]
      - ["Composite scheme separating platform, NBFC, and AMC", "India / NCLT", "NCLT approval reported; effective date not established in ICRA text", "Medium", "High", "Track effective date, entity ownership, licenses, and intercompany exposures", "Transition and creditor-protection uncertainty", "Collect sanctioned scheme, effective-date filing, and post-scheme audited structure"]
      - ["NBFC registration and capital requirements", "India / RBI", "Registered NBFC-ND-SI", "Low", "High", "Monitor CRAR, gearing, and regulatory reporting", "Capital or reporting breach could affect funding and ratings", "Obtain latest RBI registration, inspection outcomes, and capital plan"]
      - ["Unsecured/co-lending asset-quality deterioration", "India", "Observed risk; GS3 and provisions increased", "Medium", "High", "Track 90+ DPD, GS3, coverage, partner FLDG, and credit cost", "Losses may exceed partner protection or reduce profitability", "Request vintage, roll-rate, and partner recoveries by cohort"]
    notes: "Partial register based on assigned CARE and ICRA rating reports; it is not a complete inventory of all licenses, cases, or regulatory obligations."
    claimRefs: [CR005, CR006, CR009]
    enumerationScope:
      coverage: partial
      basis: "Publicly documented regulatory and legal risks in the assigned rating and company materials through the latest fetched dates."
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Unseasoned enterprise and longer-tenor book weakens with seasoning", "Medium", "High", "Established underwriting and exposure limits are described", "Loss emergence may lag origination", "Vintage-level delinquency and migration data are not public"]
      - ["Co-lending partner fails to originate, service, or recover", "Medium", "High", "Partner underwriting criteria, FLDG, and monitoring are described", "Vivriti may need to step in and absorb operating burden", "No partner concentration or contingency-servicing test is disclosed"]
      - ["Funding cost rises faster than asset yields", "Medium", "Medium", "Diversified lenders and capital-market access", "Margin compression and lower RoMA", "Current lender-by-lender repricing and maturity ladder are unavailable"]
      - ["Technology or early-warning model misses borrower stress", "Low to medium", "High", "Transaction-data liquidity model and early-warning systems are described by management", "Model risk and data-quality failures remain possible", "No independent validation, incident history, or model-performance metrics"]
      - ["Rapid geographic and organizational expansion strains controls", "Medium", "Medium", "Management plans on-ground functions and technology integration", "Execution and oversight complexity", "No public control-capacity or audit-plan evidence"]
    notes: "Risk register synthesized from CARE, ICRA, and management descriptions; likelihood and residual exposure are analytical assessments, not independently measured probabilities."
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Co-lending and partnership network", "Other NBFC partners", "Origination, servicing, and FLDG support", "Portfolio share about 37% in ICRA's September 2025 mix", "Partner underperformance or servicing failure increases losses and workload", "High", "Underwriting criteria, partner monitoring, and contractual FLDG", "FLDG can be limited to 5% of disbursements in some cases"]
      - ["Bank and financial-institution funding", "Banks, NBFCs, and financial institutions", "Term loans and liquidity", "Banks about 50% of borrowings in ICRA; over 45 lenders in CARE", "Credit-line withdrawal or repricing constrains growth", "High", "Diversified lender base, liquid assets, and undrawn lines", "Exact maturities and lender concentration are not public"]
      - ["NCD and capital-market funding", "Bond investors and market intermediaries", "Longer-term funding", "Bonds 25% of borrowings in CARE's FY25 mix", "Market access closes or refinancing becomes expensive", "Medium", "Rated instruments and multiple funding channels", "Interest-rate and rollover sensitivity remains"]
      - ["Group legal entities", "Vivriti Next, VAM, and CAPL", "Holding, AMC, and platform relationships", "VCL exposure to subsidiaries/associates reported at 8.2% of net worth by ICRA", "Scheme execution or intercompany exposures weaken ring-fencing", "Medium", "Proposed separation and expected exposure cap", "Effective date and final post-scheme exposures require verification"]
    notes: "Counterparty roles and concentration use reported portfolio or borrowing shares where available; missing schedules are explicitly treated as residual exposure."
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: The highest residual exposures combine credit-loss sensitivity with incomplete public transparency on partners, cohorts, and restructuring execution.
    data:
      columns: [Likelihood, Impact, Residual severity]
      rows:
        - label: "Unsecured/co-lending asset quality"
          values: ["Medium", "High", "High"]
        - label: "Portfolio seasoning and concentration"
          values: ["Medium", "High", "High"]
        - label: "Scheme implementation and ring-fencing"
          values: ["Medium", "High", "High"]
        - label: "Funding and refinancing"
          values: ["Medium", "Medium", "Medium"]
        - label: "Partner servicing dependency"
          values: ["Medium", "High", "High"]
        - label: "Technology/model control failure"
          values: ["Low to medium", "High", "Medium"]
    claimRefs: [CR002, CR006, CR010, CR014]

callouts:
  - calloutType: risk
    title: Credit quality is the primary thesis-break risk
    body: "The agencies' thresholds are already close to reported measures: ICRA reported gross stage 3 of 2.5% and gearing of 3.9x at September 2025, while both agencies identify further asset-quality deterioration, higher gearing, and weaker profitability as rating pressure points."
    claimRefs: [CR003, CR004, CR005]
  - calloutType: assumption
    title: Liquidity is adequate, not assured
    body: "Reported cash, undrawn lines, positive ALM, and scheduled collections support near-term liquidity, but they do not substitute for a current maturity ladder, stress test, or evidence on lender and partner concentration."
    claimRefs: [CR011, CR012, CR013]

