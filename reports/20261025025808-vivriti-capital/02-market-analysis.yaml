schemaVersion: "report-v2"
artifact: market-analysis
slug: vivriti-capital
runDate: 2026-10-25
company:
  name: Vivriti Capital
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Vivriti operates in an evidence-supported gap between bank lending and
    institutional private credit for Indian mid-market enterprises. The
    available sources support strong category growth and a broad borrower
    opportunity, but they do not disclose a clean, independent TAM/SAM/SOM;
    sizing is therefore presented as multiple dated lenses rather than a
    single market estimate.
sections:
  - id: market-boundary
    title: Boundary, substitutes, and market structure
    body: >-
      The relevant market is institutional debt for Indian mid-market
      enterprises: term debt, structured credit, supply-chain finance, and
      co-lending where a borrower is too large or complex for microfinance but
      may be too small, unrated, or operationally non-standard for a bank or
      bond-market process. This boundary excludes retail lending, pure equity
      finance, and Vivriti Asset Management's investor products, although those
      businesses affect the funding ecosystem. The best evidence for the
      status quo is the reported credit gap: banks are described as using
      rigid templates and having shifted toward retail lending, while
      mid-market borrowers generally obtain working capital from banks.
      Alternatives therefore include bank term loans, private-equity or
      venture-debt capital, direct private-credit funds, and internal
      working-capital financing. The boundary is commercially meaningful
      because speed, customization, data underwriting, and sector expertise
      are the proposed reasons to switch from a bank rather than generic
      “fintech” adoption.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and what they do not prove
    body: >-
      The sources provide several scales but no independently audited
      addressable-market bridge. A 2022 financing announcement described
      Vivriti's portfolio as INR 3,700 crore, while an independent
      private-market data publisher reports AUM rising from ₹5,836 crore in
      FY23 to ₹9,081 crore in FY25. An ETCFO interview reports group AUM of
      Rs. 13,181 crore, but that is a group metric rather than a pure Vivriti
      Capital market denominator. The current group page separately displays
      ₹15,000+ crore and ₹13,000+ crore of AUM, so even company-level scale
      needs entity and vintage reconciliation. RBI evidence establishes that
      NBFCs are a supervised sector and that digital-data and AI/ML adoption
      is a live regulatory and operating theme, not that the market is a
      particular size. The sizing table and figure consequently separate
      company scale, group scale, and sector context; they do not label any
      value TAM, SAM, or SOM. The key diligence gap is an independent India
      mid-market debt stock and annual origination series segmented by
      borrower size, geography, product, and bank eligibility.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM015, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyers, adoption path, and constraints
    body: >-
      The primary buyer is a mid-market enterprise's finance or treasury
      function; the user is management and operating teams that need growth or
      working-capital funding; and the payer is the borrowing company through
      interest, fees, and financing costs. Banks remain the incumbent funding
      relationship, while private-equity, venture-debt, and private-credit
      funds are alternative sources. Reported triggers are speed, tailored
      structures, sector understanding, and a willingness to underwrite
      transaction data rather than rely only on standard templates. Vivriti's
      own materials describe turnaround in less than 10 days and a tailored
      product suite, while the CFO describes proprietary liquidity models and
      early-warning systems. Constraints are equally material: young
      borrowers can be difficult to assess, the company is an RBI-registered
      NBFC, funding is concentrated in banks and debt instruments, and the
      sector's rules can change the economics of co-lending and AIF
      participation. Adoption should therefore be evaluated as a credit
      underwriting and funding-capacity decision, not merely as software
      adoption.
    claimRefs: [CM010, CM011, CM012, CM013, CM014]
    tableRefs: [TM003]
tables:
  - id: TM001
    title: Market definition and substitute map
    columns: [Segment or category, Included or excluded spend, Buyer / payer, Relevance]
    rows:
      - [Mid-market enterprise term debt, "Included: growth and working-capital term loans", "Finance / treasury; borrower pays", "Core market boundary"]
      - [Structured and supply-chain finance, "Included: receivables, supplier, and bespoke structures", "Finance / operations; borrower or platform pays", "Addresses non-standard cash flows"]
      - [Co-lending and partner-originated credit, "Included: institutional origination and co-funded loans", "Partner lender and end borrower", "Extends distribution and balance-sheet reach"]
      - [Bank lending, "Substitute / incumbent; standard templates and relationship credit", "Bank relationship manager; borrower pays", "Primary status-quo alternative"]
      - [Private equity and venture debt, "Excluded from debt-market sizing but a capital substitute", "Founder / board; equity or debt payer", "Competes for financing decisions"]
      - [Retail consumer lending, "Excluded: different borrower, underwriting, and use case", "Consumer; consumer pays", "Avoids category inflation"]
    notes: >-
      Boundary is an analytical classification based on the reviewed sources;
      the sources do not publish a complete market taxonomy or spend census.
    claimRefs: [CM001, CM002, CM003, CM004]
  - id: TM002
    title: Evidence-constrained sizing lenses
    columns: [Publisher and period, Geography, Value, Methodology, Confidence, Limitation]
    rows:
      - ["Creation Investments / PRNewswire, 2022", "India", "INR 3,700 crore portfolio", "Company financing announcement", "Medium", "Vivriti scale, not market size"]
      - ["PrivateCircle, FY23", "India", "₹5,836 crore AUM", "Private-market data narrative", "Medium", "Publisher methodology and audit scope are not fully disclosed"]
      - ["PrivateCircle, FY25", "India", "₹9,081 crore AUM", "Private-market data narrative", "Medium", "Company scale, not TAM/SAM/SOM"]
      - ["ETCFO, 2025", "Vivriti Group", "Rs. 13,181 crore AUM", "Management interview", "Medium", "Group metric, not independent market sizing"]
      - ["Vivriti Group, current page", "India", "₹15,000+ crore total AUM", "Company overview", "Low", "Company claim with no denominator or independent validation"]
      - ["Vivriti Group, same current page", "India", "₹13,000+ crore total AUM", "Company overview", "Low", "Conflicts with the ₹15,000+ crore value on the same page"]
    notes: >-
      Values are not interchangeable: portfolio, client asset base, AUM,
      revenue growth, and group AUM use different denominators and periods.
      The table intentionally preserves them as separate lenses rather than
      deriving a TAM, SAM, SOM, CAGR, or conversion rate.
    claimRefs: [CM005, CM006, CM007, CM008, CM015, CM016]
  - id: TM003
    title: Segment, buyer, payer, and adoption map
    columns: [Segment, Buyer, User, Payer, Workflow / trigger, Budget owner]
    rows:
      - [Mid-market corporates, "CFO / treasury", "Management and operations", "Borrower", "Growth capital, term debt, working capital", "Corporate finance"]
      - [MSME and supply-chain businesses, "Founder / finance lead", "Founder, procurement, suppliers", "Borrower or platform", "Receivables and supplier liquidity", "Finance / working capital"]
      - [Banks and NBFC co-lending partners, "Credit and partnerships teams", "Origination and risk teams", "Partner lender plus borrower economics", "Digital origination and co-funding", "Lending business"]
      - [Private-credit and AIF capital providers, "Investment committee", "Portfolio and risk teams", "Fund investors", "Access to performing-credit opportunities", "Fund / asset manager"]
    notes: >-
      Buyer and payer roles are inferred from the operating model described in
      the sources; the pool does not provide contract-level pricing or budget
      ownership data by segment.
    claimRefs: [CM010, CM011, CM012, CM014]
figures:
  - id: FM001
    title: Market sizing lenses, not TAM/SAM/SOM
    type: pyramid
    summary: >-
      Separate reported scale lenses show the market evidence available without
      implying that company and group metrics are nested market layers.
    data:
      nodes:
        - {label: "Vivriti portfolio (2022)", value: 3700, unit: "INR crore", note: "Historical company portfolio"}
        - {label: "Vivriti AUM (FY23)", value: 5836, unit: "₹ crore", note: "PrivateCircle-reported company AUM"}
        - {label: "Vivriti AUM (FY25)", value: 9081, unit: "₹ crore", note: "PrivateCircle-reported company AUM"}
        - {label: "Vivriti Group AUM (2025)", value: 13181, unit: "₹ crore", note: "ETCFO-reported group metric"}
        - {label: "Vivriti Group total AUM (current page)", value: 15000, unit: "₹ crore+", note: "Official company claim; not independently verified"}
        - {label: "Vivriti Group duplicate AUM (same page)", value: 13000, unit: "₹ crore+", note: "Conflicting official value on the same fetched page"}
    approximationNotes: >-
      No values are transformed. The pyramid is a presentation of distinct
      reported sizing lenses, not a proportional TAM/SAM/SOM waterfall or
      nested market calculation; entities and periods differ, and the two
      current-page group values conflict.
    claimRefs: [CM005, CM006, CM007, CM008, CM016]
callouts:
  - calloutType: insight
    title: Category opportunity is credible, but market size remains unproven
    body: >-
      Multiple sources describe an underserved mid-market credit segment and
      show Vivriti scaling within it, but no retained source provides an
      independent market denominator. Valuation work should underwrite
      origination, credit performance, funding access, and repeat usage rather
      than accept a broad TAM label.
    claimRefs: [CM001, CM002, CM005, CM015]
  - calloutType: risk
    title: Regulation and funding structure constrain adoption
    body: >-
      Borrower underwriting is difficult in the target segment, while RBI
      supervision, changing co-lending treatment, and reliance on bank and
      debt funding can affect both supply and margins.
    claimRefs: [CM012, CM013, CM014]
