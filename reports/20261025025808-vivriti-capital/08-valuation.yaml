callouts:
  - calloutType: recommendation
    title: "Price-sensitive conclusion"
    body: "Track rather than buy: the franchise evidence is credible, but the reviewed public record does not establish a current price, entity-level earnings bridge, or investor protections sufficient for a high-confidence entry."
    claimRefs: [CV019, CV020, CV021]
  - calloutType: risk
    title: "Primary thesis break"
    body: "A deterioration in credit performance or funding access would transmit quickly into equity value because the business is a leveraged lender and public evidence does not show a complete current loss and covenant history."
    claimRefs: [CV009, CV022]
