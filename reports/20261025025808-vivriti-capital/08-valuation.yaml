schemaVersion: "report-v2"
artifact: valuation
slug: vivriti-capital
runDate: 2026-10-25
company:
  name: Vivriti Capital
chapter:
  number: 8
  title: Valuation
  summary: "Public evidence supports a scaled, differentiated private-credit franchise, but it does not disclose enough current post-restructuring financial or preference-stack detail to underwrite a price-sensitive buy. The evidence-supported stance is track with an indeterminate valuation, with research-more warranted before new capital is committed."
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: "The positive thesis is that Vivriti has built a recognizable technology-enabled NBFC and private-credit platform in an underserved mid-market segment. The group reports 550+ mid-market enterprises, INR 15,000+ crore of total AUM and INR 68,000+ crore of finance enabled, while an independent trade interview reports 300+ mid-market clients and 28.9% year-on-year revenue growth for the group in the period it describes. The financing history also shows institutional support: a 2022 Series C release said Creation and Lightrock participated in a US$55 million round and that cumulative fundraising had reached US$165 million at that point. The anti-thesis is price and transparency: the refreshed public record does not establish a current equity valuation, revenue-to-equity bridge, realized credit-loss profile, preference stack, or post-demerger allocation between Vivriti Capital and Vivriti Asset Management. A large AUM or finance-enabled figure is not itself equity value, ARR, cash available, or distributable earnings. That evidence asymmetry argues for disciplined entry rather than a buy recommendation."
    claimRefs: [CV001, CV003, CV004]
    tableRefs: [TV001, TV002]
  - id: financing-and-entry
    title: Financing context and entry discipline
    body: "The current financing picture is mixed rather than cleanly markable. FundedIQ reports $74.4 million across two recorded rounds, including an undisclosed $22.0 million round announced in February 2026, while the company group page reports INR 1,400 crore of equity raised since inception and the 2022 Creation release reports US$165 million of cumulative fundraising at that historical point. These figures may reflect different entities, currencies, definitions, or subsequent restructuring; they cannot be added or treated as a current valuation. The independent CFO interview says banks supplied approximately 60% of the capital structure, with 7–8% from exchange-traded commercial deposits and about 30% from non-convertible debentures, which makes funding access and asset-liability discipline central to equity value. Public evidence also says management had no immediate IPO plans in the cited 2025 interview. Accordingly, entry should require a current priced-round or secondary mark, audited entity-level financials, debt maturities and covenants, preference and liquidation terms, and a bridge from the post-scheme entities to consolidated economics. Without those inputs, a precise target return or price is not supportable."
    claimRefs: [CV007, CV008, CV009, CV012]
    tableRefs: [TV003]
  - id: scenarios-and-comparables
    title: Scenarios and comparable discipline
    body: "A scenario framework is more defensible than a point valuation because the public evidence establishes operating direction but not the variables needed for a conventional lender or fintech multiple. The bull case requires continued mid-market AUM growth, stable asset quality, repeatable technology-enabled underwriting, and successful scaling of both the NBFC and managed private-credit book without disproportionate equity dilution. The base case assumes the franchise remains valuable but growth converts into only fair equity returns because leverage, concentration, funding costs, and governance complexity absorb part of the operating upside. The bear case is a combination of credit deterioration, funding-market repricing, concentration losses, or a down-round caused by opaque post-demerger economics. Public competitor pages for Northern Arc and UGRO expose no comparable current equity-mark data in the prefetched text, so they are useful diligence targets but not numerical valuation anchors. The comparison set should therefore remain qualitative until like-for-like AUM, net interest margin, credit costs, capital ratios, growth and ownership data are obtained."
    claimRefs: [CV013, CV014, CV015, CV018]
  - id: recommendation-and-diligence
    title: Recommendation, exit readiness, and thesis breaks
    body: "The recommendation is track, with medium confidence and an indeterminate valuation stance. This is not a judgment that the business lacks quality; it is a judgment that public evidence does not support paying an unknown price for a leveraged credit franchise whose current equity economics are not fully visible. A move toward buy would require a verified current price or valuation, entity-level audited statements, non-performing-asset and loss-given-default history, concentration tables, funding tenor and cost, governance and preference terms, and evidence that the post-demerger structure does not shift value or risk between operating entities. Thesis-break triggers are measurable: material deterioration in asset quality or capital adequacy, loss of bank or debt-market funding, a down-round, inability to reconcile consolidated and entity-level metrics, or a liquidity event that crystallizes a lower mark. Exit readiness is therefore conditional rather than imminent; a future secondary, strategic sale, or IPO path should be assessed only after those disclosures are available."
    claimRefs: [CV019, CV020, CV021, CV022, CV023]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Evidence basis, Decision implication]
    rows:
      - [Recommendation, track, "Scaled franchise evidence is positive but current price and equity economics are not public", "Do not underwrite a buy without a priced entry"]
      - [Confidence, medium, "Multiple sources support scale and financing history; current entity-level terms remain incomplete", "Refresh the call when primary financial evidence is obtained"]
      - [Risk rating, high, "Credit, funding, concentration and disclosure risks are material to equity value", "Require downside and covenant diligence"]
      - [Valuation stance, indeterminate, "No current public valuation or preference stack supports an attractive, fair, or stretched call", "Use entry discipline and scenario ranges"]
    notes: "Evidence combines company disclosures, a financing release, an independent trade interview, and a funding-data profile; historical totals and current group metrics are not interchangeable."
    claimRefs: [CV001, CV004, CV007, CV009, CV019]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Scaled differentiated platform", "550+ mid-market enterprises and INR 15,000+ crore total AUM are reported by the group", "Audited entity-level data shows materially lower scale or weak asset quality"]
      - ["Institutional financing validation", "Creation and Lightrock participated in a reported US$55 million Series C", "Terms reveal punitive preferences, excessive dilution, or inability to refinance"]
      - ["Technology can improve underwriting", "Management describes liquidity models and early-warning systems", "Verified loss and NPA data fail to show repeatable risk control"]
      - ["Price opacity is valuation risk", "Current valuation, preference stack and entity bridge are not disclosed in reviewed text", "A current priced transaction and complete cap table establish attractive downside protection"]
    notes: "Rows are analytical tests, not a complete cap-table or competitor enumeration; qualitative claims remain conditional on primary diligence."
    claimRefs: [CV004, CV012, CV020]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Operating assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "AUM and fee income compound while asset quality and funding access remain stable", "Potential rerating from scalable private-credit platform economics; no numeric target is supportable from public evidence", "Lower probability until audited loss, margin and ownership data are supplied", "Credit losses or funding costs rise materially"]
      - [Base, "Franchise grows but leverage, concentration and entity complexity absorb part of operating upside", "Fair returns at a disciplined price; track rather than buy at an unknown mark", "Most consistent with currently observable evidence", "Metrics cannot be reconciled across entities"]
      - [Bear, "Credit deterioration, funding repricing or a down-round exposes weak equity protection", "Capital impairment or materially lower mark; avoid new exposure until repaired", "Material but unquantified because public loss and terms data are incomplete", "Loss of bank/debt-market funding or covenant stress"]
      - [Research-more, "New primary evidence resolves current valuation and preference gaps", "Decision can move toward buy or avoid after a price-sensitive underwriting", "Required before a high-confidence investment call", "Diligence remains private or contradictory"]
    notes: "Scenarios are qualitative because public sources do not provide a current equity valuation, entity-level earnings bridge, preference stack, or complete credit-loss series; no probability-weighted price is invented."
    claimRefs: [CV013, CV014, CV015, CV021, CV022]
