    notes: Benefits are separated from limitations because the available evidence is a mixture of company descriptions, a vendor case study, and independent rating analysis.
    claimRefs: [CE002, CE006, CE009, CE010, CE011]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk or control question]
    rows:
      - ["Origination and partner APIs", "Ingest borrower and partner data for credit workflows", "External partner data and API availability", "Completeness, latency, and access controls need testing"]
      - ["Underwriting and fraud checks", "Identify borrowers, assess liquidity, detect fraud", "Transaction data and proprietary models", "Model drift, explainability, and override governance need evidence"]
      - ["Databricks lakehouse", "Governed storage, lineage, time travel, and analytics", "Cloud platform and migration configuration", "Recovery objectives, security testing, and data residency need evidence"]
      - ["Databricks SQL reporting", "Serve credit, finance, operations, bureau, and regulatory reporting", "Correct source tables and query workloads", "Reconciliation and report-SLA evidence need testing"]
      - ["Early-warning monitoring", "Flag stress scenarios and portfolio risks", "Monitoring models and refreshed data", "Alert precision, escalation, and remediation logs need evidence"]
      - ["Partner servicing and controls", "Originate and service co-lending exposures", "NBFC and lending partners", "Step-in capability and partner concentration need evidence"]
    notes: Architecture layers are synthesized only from the documented data migration, operating descriptions, and ICRA's partner-dependency analysis; undocumented infrastructure components remain out of scope.
    claimRefs: [CE004, CE005, CE007, CE009, CE010, CE011]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Vivriti's lending workflow connects partner data and underwriting controls to governed analytics, reporting, and portfolio monitoring.
    data:
      layers:
        - label: Customer and partner inputs
          detail: Borrower transaction data and partner APIs feed identification, reconciliation, and credit workflows.
        - label: Credit decisioning
          detail: Technology-enabled underwriting, fraud detection, and borrower de-duplication support lending decisions.
        - label: Governed data platform
          detail: Databricks lakehouse tables provide lineage and time travel for audit and reporting use cases.
        - label: Analytics and reporting
          detail: Databricks SQL separates analytics and reporting workloads from transactional application databases.
        - label: Monitoring and delivery
          detail: Early-warning models and reporting workflows support portfolio, bureau, and regulatory operations.
        - label: Product delivery
          detail: Co-lending and other tailored debt products connect the technology stack to customer capital access.
    approximationNotes: null
    claimRefs: [CE005, CE006, CE007, CE009]
