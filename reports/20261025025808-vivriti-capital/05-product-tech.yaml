company:
  name: Vivriti Capital
chapter:
  number: 5
  title: Product & Technology
  summary: Vivriti combines mid-market lending products with a technology-enabled underwriting, monitoring, and reporting stack. The strongest technical evidence is a Databricks migration that replaced Redshift and custom orchestration, while independent credit analysis shows that partner servicing, portfolio seasoning, and scale-up controls remain material operating dependencies.
sections:
  - id: customer-workflow
    title: Customer workflow and product surface
    body: >-
      Vivriti's product is debt capital delivered through a mid-market lending workflow rather than a standalone software subscription. Its public product surface includes term loans, working-capital demand loans, supply-chain finance, co-lending, securitisation, and non-convertible debentures, while the operating model targets SMEs, MFIs, NBFCs, and affordable-housing finance companies. The official homepage describes a customer journey built around outreach, sector assessment, a customised product suite, underwriting, and continuous engagement. It states that underwriting aims for a turnaround time of less than 10 days, but this is a company-published operating promise rather than an independently measured service-level result. Customer testimonials on the same official page describe fast funding and data-informed supply-chain limits; these are useful workflow illustrations, not evidence of portfolio-wide performance.
    claimRefs: [CE001, CE002, CE003, CE013]
    tableRefs: [TE001, TE002]
  - id: data-and-operating-architecture
    title: Data and operating architecture
    body: >-
      The clearest technical proof comes from Vivriti's Databricks case study. The company replaced Amazon Redshift plus an internally built stack using open-source Spark, Airflow, and custom orchestration after pipeline failures, compliance risk, and manual engineering intervention became constraints. The migration covered about 20 workflows and more than 50 pipelines, completed core workloads in eight weeks, and retired the prior platforms after final validation over a two-month conversion. Databricks SQL now separates analytics and reporting from transactional lending systems; the case study says the resulting environment supports tens of thousands of loan transactions per day and API-based ingestion for borrower identification, underwriting, fraud detection, and de-duplication. These are vendor case-study claims, so the architecture is evidenced but independent performance testing, uptime history, and production cost records remain diligence gaps.
    claimRefs: [CE004, CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-dependencies-and-controls
    title: Maturity, dependencies, and controls
    body: >-
      Vivriti's technology is mature enough to support regulated reporting and multi-party lending, but the operating model remains dependent on disciplined controls around data, partners, and portfolio growth. The CFO told ETCFO that Vivriti builds a proprietary client-liquidity model from publicly available transaction data and uses early-warning models to monitor stress scenarios. ICRA independently describes reliance on partners for origination and servicing; it says stepping in to service a portfolio when necessary is critical to sustainable scale. ICRA also flags the need to maintain underwriting, exposure limits, asset quality, and infrastructure as non-financial-enterprise lending expands. The apparent differentiation is therefore integrated workflow execution and monitoring rather than a publicly disclosed proprietary algorithm. A generic company profile on Uplers offers no role-level engineering or package-activity evidence, while the assigned ADB project URL returned only a generic ADB homepage. Independent developer maturity, security controls, incident response, external project proof, and roadmap delivery remain open diligence areas.
    claimRefs: [CE009, CE010, CE011, CE012, CE014, CE015, CE016]
    tableRefs: []
callouts:
  - calloutType: strength
    title: Integrated data foundation
    body: The migration consolidated analytics, reporting, lineage, and time-travel capabilities on a governed platform while reducing dependence on self-managed infrastructure.
    claimRefs: [CE004, CE005, CE007]
  - calloutType: risk
    title: Technology does not remove lending dependencies
    body: Partner origination and servicing, portfolio seasoning, model controls, and independent evidence of reliability remain material implementation and risk questions.
    claimRefs: [CE010, CE011, CE012]
