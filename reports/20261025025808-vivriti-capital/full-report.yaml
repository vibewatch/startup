chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, business model, and current structure
        blocks:
          - type: paragraph
            body: >-
              Vivriti Capital was established in 2017 as a fintech non-banking financial company focused on debt finance
              for mid-market enterprises in India. The official group profile distinguishes the lending company from
              Vivriti Asset Management, an asset manager established in 2019 for private-credit funds. The operating
              model is therefore broader than a single balance-sheet lender: the group combines direct and structured
              lending with fund-management capabilities. Independent coverage describes a technology-led underwriting
              model and a deliberate focus on mid-market borrowers, while the July 2025 CFO interview reported more than
              300 mid-market clients and operations in ten Indian metropolitan locations. Secondary analysis places the
              headquarters in Chennai, while the assigned evidence does not establish a complete current location roster
              after the reorganisation. The April 2026 ICRA rationale is the strongest current structural evidence: the
              scheme became effective April 1, 2026, transferring the NBFC operations and associated assets and
              liabilities from Vivriti Capital Limited to Hari & Company Investments Madras Private Limited, with
              Vivriti Next holding the resulting entities. This separation makes pre- and post-reorganisation metrics
              non-interchangeable without a bridge.
