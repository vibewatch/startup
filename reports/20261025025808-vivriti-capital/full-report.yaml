  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Boundary, substitutes, and market structure
        blocks:
          - type: paragraph
            body: >-
              The relevant market is institutional debt for Indian mid-market enterprises: term debt, structured credit,
              supply-chain finance, and co-lending where a borrower is too large or complex for microfinance but may be
              too small, unrated, or operationally non-standard for a bank or bond-market process. This boundary
              excludes retail lending, pure equity finance, and Vivriti Asset Management's investor products, although
              those businesses affect the funding ecosystem. The best evidence for the status quo is the reported credit
              gap: banks are described as using rigid templates and having shifted toward retail lending, while
              mid-market borrowers generally obtain working capital from banks. Alternatives therefore include bank term
              loans, private-equity or venture-debt capital, direct private-credit funds, and internal working-capital
              financing. The boundary is commercially meaningful because speed, customization, data underwriting, and
              sector expertise are the proposed reasons to switch from a bank rather than generic “fintech” adoption.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and what they do not prove
        blocks:
          - type: paragraph
            body: >-
              The sources provide several scales but no independently audited addressable-market bridge. A 2022
              financing announcement described Vivriti's portfolio as INR 3,700 crore, while an independent
              private-market data publisher reports AUM rising from ₹5,836 crore in FY23 to ₹9,081 crore in FY25. An
              ETCFO interview reports group AUM of Rs. 13,181 crore, but that is a group metric rather than a pure
              Vivriti Capital market denominator. The current group page separately displays ₹15,000+ crore and ₹13,000+
              crore of AUM, so even company-level scale needs entity and vintage reconciliation. RBI evidence
              establishes that NBFCs are a supervised sector and that digital-data and AI/ML adoption is a live
              regulatory and operating theme, not that the market is a particular size. The sizing table and figure
              consequently separate company scale, group scale, and sector context; they do not label any value TAM,
              SAM, or SOM. The key diligence gap is an independent India mid-market debt stock and annual origination
              series segmented by borrower size, geography, product, and bank eligibility.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM015
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM016
      - number: '2.3'
        title: Buyers, adoption path, and constraints
        blocks:
          - type: paragraph
            body: >-
              The primary buyer is a mid-market enterprise's finance or treasury function; the user is management and
              operating teams that need growth or working-capital funding; and the payer is the borrowing company
              through interest, fees, and financing costs. Banks remain the incumbent funding relationship, while
              private-equity, venture-debt, and private-credit funds are alternative sources. Reported triggers are
              speed, tailored structures, sector understanding, and a willingness to underwrite transaction data rather
              than rely only on standard templates. Vivriti's own materials describe turnaround in less than 10 days and
              a tailored product suite, while the CFO describes proprietary liquidity models and early-warning systems.
              Constraints are equally material: young borrowers can be difficult to assess, the company is an
              RBI-registered NBFC, funding is concentrated in banks and debt instruments, and the sector's rules can
              change the economics of co-lending and AIF participation. Adoption should therefore be evaluated as a
              credit underwriting and funding-capacity decision, not merely as software adoption.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Category opportunity is credible, but market size remains unproven
            body: >-
              Multiple sources describe an underserved mid-market credit segment and show Vivriti scaling within it, but
              no retained source provides an independent market denominator. Valuation work should underwrite
              origination, credit performance, funding access, and repeat usage rather than accept a broad TAM label.
