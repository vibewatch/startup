      Counterparty roles and concentration use reported portfolio or borrowing shares where available; missing schedules
      are explicitly treated as residual exposure.
  - id: TV001
    title: Recommendation summary
    columns:
      - Dimension
      - Assessment
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - track
        - Scaled franchise evidence is positive but current price and equity economics are not public
        - Do not underwrite a buy without a priced entry
      - - Confidence
        - medium
        - Multiple sources support scale and financing history; current entity-level terms remain incomplete
        - Refresh the call when primary financial evidence is obtained
      - - Risk rating
        - high
        - Credit, funding, concentration and disclosure risks are material to equity value
        - Require downside and covenant diligence
      - - Valuation stance
        - indeterminate
        - No current public valuation or preference stack supports an attractive, fair, or stretched call
        - Use entry discipline and scenario ranges
    notes: >-
      Evidence combines company disclosures, a financing release, an independent trade interview, and a funding-data
      profile; historical totals and current group metrics are not interchangeable.
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV009
      - CV019
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Supporting evidence
      - What would change the view
    rows:
      - - Scaled differentiated platform
        - 550+ mid-market enterprises and INR 15,000+ crore total AUM are reported by the group
        - Audited entity-level data shows materially lower scale or weak asset quality
      - - Institutional financing validation
        - Creation and Lightrock participated in a reported US$55 million Series C
        - Terms reveal punitive preferences, excessive dilution, or inability to refinance
      - - Technology can improve underwriting
        - Management describes liquidity models and early-warning systems
        - Verified loss and NPA data fail to show repeatable risk control
      - - Price opacity is valuation risk
        - Current valuation, preference stack and entity bridge are not disclosed in reviewed text
        - A current priced transaction and complete cap table establish attractive downside protection
    notes: >-
      Rows are analytical tests, not a complete cap-table or competitor enumeration; qualitative claims remain
      conditional on primary diligence.
    claimRefs:
      - CV004
      - CV012
      - CV020
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - AUM and fee income compound while asset quality and funding access remain stable
        - >-
          Potential rerating from scalable private-credit platform economics; no numeric target is supportable from
          public evidence
        - Lower probability until audited loss, margin and ownership data are supplied
        - Credit losses or funding costs rise materially
      - - Base
        - Franchise grows but leverage, concentration and entity complexity absorb part of operating upside
        - Fair returns at a disciplined price; track rather than buy at an unknown mark
        - Most consistent with currently observable evidence
        - Metrics cannot be reconciled across entities
      - - Bear
        - Credit deterioration, funding repricing or a down-round exposes weak equity protection
        - Capital impairment or materially lower mark; avoid new exposure until repaired
        - Material but unquantified because public loss and terms data are incomplete
        - Loss of bank/debt-market funding or covenant stress
      - - Research-more
        - New primary evidence resolves current valuation and preference gaps
        - Decision can move toward buy or avoid after a price-sensitive underwriting
        - Required before a high-confidence investment call
        - Diligence remains private or contradictory
    notes: >-
      Scenarios are qualitative because public sources do not provide a current equity valuation, entity-level earnings
      bridge, preference stack, or complete credit-loss series; no probability-weighted price is invented.
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV021
      - CV022
