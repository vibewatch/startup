              - CM015
          - type: callout
            title: Regulation and funding structure constrain adoption
            body: >-
              Borrower underwriting is difficult in the target segment, while RBI supervision, changing co-lending
              treatment, and reliance on bank and debt funding can affect both supply and margins.
            calloutType: risk
