              - CU019
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU006
              - CU007
              - CU011
              - CU016
              - CU021
      - number: '6.3'
        title: Durability, expansion, and concentration gaps
        blocks:
          - type: paragraph
            body: >-
              Vivriti reports 90%+ client retention in the Built In profile, and its operating model emphasizes
              continuous engagement, rapid turnaround, and customized products. Those signals are consistent with a
              relationship-lending model in which repeat borrowing and cross-product expansion could matter, but the
              public evidence does not define the retention denominator, measurement period, gross versus net retention,
              or treatment of inactive borrowers. The 2025 CFO interview says the company serves 300+ mid-market clients
              across a wider metropolitan footprint and intends to deepen on-ground presence, while also noting that
              young-business credit assessment is difficult. No assigned source provides top-customer exposure, channel
              concentration, cohort roll-forward, churn, renewal, or contract-length data. These are material diligence
              gaps for underwriting durability and concentration risk.
            claimRefs:
              - CU004
              - CU014
              - CU015
              - CU016
              - CU021
              - CU022
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Real customer relationships are publicly evidenced
            body: >-
              Named borrowers describe concrete financing use cases, multi-year associations, and operational benefits;
              this is stronger than an undifferentiated logo wall.
            calloutType: strength
            claimRefs:
              - CU007
              - CU011
          - type: callout
            title: Concentration and durability remain unquantified
            body: >-
              The assigned evidence does not disclose top-borrower exposure, cohort retention, churn, renewal, contract
              tenor, or the active status of every named relationship.
            calloutType: risk
            claimRefs:
              - CU004
              - CU015
              - CU016
              - CU021
              - CU022
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Credit, capital, and earnings
        blocks:
          - type: paragraph
            body: >-
              The principal financial risk is not an immediate solvency event in the available evidence, but the
              interaction of rapid historical growth, moderate seasoning, and riskier wholesale and co-lending
              exposures. CARE reported AUM of ₹9,302 crore at March 31, 2025, with about 33% unsecured loans through
              co-lending, while ICRA reported managed gearing of 3.9 times and gross stage 3 of 2.5% at September 2025.
              ICRA also reported profitability moderating to 1.8% in H1 FY2026 as credit costs and funding costs rose.
              These are observable pressure points, not forecasts: the public record does not provide a borrower-level
              vintage or loss bridge. CARE's explicit downgrade sensitivities are GNPA above 2.5%, gearing above 4.25x,
              and sustained profitability moderation; ICRA uses 90+ days past due above 3% and gearing above 4.5x as
              negative triggers.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR009
          - type: table
            tableRef: TR002
            claimRefs: []
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR006
              - CR010
              - CR014
      - number: '7.2'
        title: Regulatory and legal-entity execution
        blocks:
          - type: paragraph
            body: >-
              Vivriti is an RBI-registered non-deposit-taking systemically important NBFC, so regulatory treatment of
              co-lending, first-loss guarantees, capital, and reporting directly affects economics. ICRA attributes the
              increase in reported gross stage 3 and provisions partly to revised digital-lending guidance and the
              exclusion of FLDG coverage from expected-credit-loss calculations. The proposed composite scheme also
              separates the online platform, NBFC, and asset-management businesses; ICRA says the scheme received final
              NCLT approval but that the effective date was still to be determined in its December 2025 report. CARE
              expected no material credit-profile impact but identified successful completion as a key monitorable. The
              unresolved diligence issue is therefore implementation: updated legal-entity ownership, intercompany
              exposures, licenses, contracts, and post-effective-date reporting are not established by the assigned
              public texts.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR003
            claimRefs: []
      - number: '7.3'
        title: Operating, partner, and liquidity dependencies
        blocks:
          - type: paragraph
            body: >-
              The operating model depends on partners for origination and servicing in co-lending, while the lender
              depends on continued access to banks, NCD markets, and other funders. ICRA says co-lending and partnership
              arrangements were principally consumer, small-business, vehicle-finance, and education loans, and that
              managing partnerships through cycles may require Vivriti to step in to service a portfolio. CARE reported
              more than 45 lender relationships and no negative cumulative ALM mismatch at March 31, 2025; ICRA later
              reported more than about 66 lenders, ₹508 crore of free cash and liquid investments, ₹56 crore of undrawn
              bank lines, and scheduled collections exceeding near-term debt obligations at September 30, 2025. These
              buffers reduce near-term liquidity risk but do not eliminate refinancing, servicing, partner-performance,
              or concentration risk. Public evidence does not identify the largest counterparties or
              contingency-servicing test results.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Monitoring plan and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Monitoring should focus on the measurable thresholds already used by the rating agencies rather than an
              unsupported claim that no incident has occurred. At each reporting date, diligence should reconcile gross
              stage 3 and 90+ days past due, provision coverage, credit cost, cost of funds, managed gearing, CRAR,
              top-20 and single-group exposure, partner-level delinquency, and the completion status of the scheme. A
              thesis-break case is sustained deterioration beyond the agencies' stated thresholds, a failure to maintain
              adequate liquidity or capital after the restructuring, or evidence that partner servicing and FLDG
              arrangements do not absorb the expected losses assumed in reported economics. A second break case is
              material undisclosed concentration or a legal-entity transition that weakens creditor protections. Exact
              borrower and partner schedules remain diligence asks, not inferred facts.
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR012
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Credit quality is the primary thesis-break risk
            body: >-
              The agencies' thresholds are already close to reported measures: ICRA reported gross stage 3 of 2.5% and
              gearing of 3.9x at September 2025, while both agencies identify further asset-quality deterioration,
              higher gearing, and weaker profitability as rating pressure points.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR005
          - type: callout
            title: Liquidity is adequate, not assured
            body: >-
              Reported cash, undrawn lines, positive ALM, and scheduled collections support near-term liquidity, but
              they do not substitute for a current maturity ladder, stress test, or evidence on lender and partner
              concentration.
            calloutType: assumption
            claimRefs:
              - CR011
              - CR012
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is that Vivriti has built a recognizable technology-enabled NBFC and private-credit
              platform in an underserved mid-market segment. The group reports 550+ mid-market enterprises, INR 15,000+
              crore of total AUM and INR 68,000+ crore of finance enabled, while an independent trade interview reports
              300+ mid-market clients and 28.9% year-on-year revenue growth for the group in the period it describes.
              The financing history also shows institutional support: a 2022 Series C release said Creation and
              Lightrock participated in a US$55 million round and that cumulative fundraising had reached US$165 million
              at that point. The anti-thesis is price and transparency: the refreshed public record does not establish a
              current equity valuation, revenue-to-equity bridge, realized credit-loss profile, preference stack, or
              post-demerger allocation between Vivriti Capital and Vivriti Asset Management. A large AUM or
              finance-enabled figure is not itself equity value, ARR, cash available, or distributable earnings. That
              evidence asymmetry argues for disciplined entry rather than a buy recommendation.
            claimRefs:
              - CV001
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV009
              - CV019
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV012
              - CV020
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The current financing picture is mixed rather than cleanly markable. FundedIQ reports $74.4 million across
              two recorded rounds, including an undisclosed $22.0 million round announced in February 2026, while the
              company group page reports INR 1,400 crore of equity raised since inception and the 2022 Creation release
              reports US$165 million of cumulative fundraising at that historical point. These figures may reflect
              different entities, currencies, definitions, or subsequent restructuring; they cannot be added or treated
              as a current valuation. The independent CFO interview says banks supplied approximately 60% of the capital
              structure, with 7–8% from exchange-traded commercial deposits and about 30% from non-convertible
              debentures, which makes funding access and asset-liability discipline central to equity value. Public
              evidence also says management had no immediate IPO plans in the cited 2025 interview. Accordingly, entry
              should require a current priced-round or secondary mark, audited entity-level financials, debt maturities
              and covenants, preference and liquidation terms, and a bridge from the post-scheme entities to
              consolidated economics. Without those inputs, a precise target return or price is not supportable.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV021
              - CV022
      - number: '8.3'
        title: Scenarios and comparable discipline
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more defensible than a point valuation because the public evidence establishes
              operating direction but not the variables needed for a conventional lender or fintech multiple. The bull
              case requires continued mid-market AUM growth, stable asset quality, repeatable technology-enabled
              underwriting, and successful scaling of both the NBFC and managed private-credit book without
              disproportionate equity dilution. The base case assumes the franchise remains valuable but growth converts
              into only fair equity returns because leverage, concentration, funding costs, and governance complexity
              absorb part of the operating upside. The bear case is a combination of credit deterioration,
              funding-market repricing, concentration losses, or a down-round caused by opaque post-demerger economics.
              Public competitor pages for Northern Arc and UGRO expose no comparable current equity-mark data in the
              prefetched text, so they are useful diligence targets but not numerical valuation anchors. The comparison
              set should therefore remain qualitative until like-for-like AUM, net interest margin, credit costs,
              capital ratios, growth and ownership data are obtained.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV018
      - number: '8.4'
        title: Recommendation, exit readiness, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              The recommendation is track, with medium confidence and an indeterminate valuation stance. This is not a
              judgment that the business lacks quality; it is a judgment that public evidence does not support paying an
              unknown price for a leveraged credit franchise whose current equity economics are not fully visible. A
              move toward buy would require a verified current price or valuation, entity-level audited statements,
              non-performing-asset and loss-given-default history, concentration tables, funding tenor and cost,
              governance and preference terms, and evidence that the post-demerger structure does not shift value or
              risk between operating entities. Thesis-break triggers are measurable: material deterioration in asset
              quality or capital adequacy, loss of bank or debt-market funding, a down-round, inability to reconcile
              consolidated and entity-level metrics, or a liquidity event that crystallizes a lower mark. Exit readiness
              is therefore conditional rather than imminent; a future secondary, strategic sale, or IPO path should be
              assessed only after those disclosures are available.
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV019
              - CV020
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              Track rather than buy: the franchise evidence is credible, but the reviewed public record does not
              establish a current price, entity-level earnings bridge, or investor protections sufficient for a
              high-confidence entry.
            calloutType: recommendation
            claimRefs:
              - CV019
              - CV020
              - CV021
          - type: callout
            title: Primary thesis break
            body: >-
              A deterioration in credit performance or funding access would transmit quickly into equity value because
              the business is a leveraged lender and public evidence does not show a complete current loss and covenant
              history.
            calloutType: risk
            claimRefs:
              - CV009
              - CV022
