  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer workflow and product surface
        blocks:
          - type: paragraph
            body: >-
              Vivriti's product is debt capital delivered through a mid-market lending workflow rather than a standalone
              software subscription. Its public product surface includes term loans, working-capital demand loans,
              supply-chain finance, co-lending, securitisation, and non-convertible debentures, while the operating
              model targets SMEs, MFIs, NBFCs, and affordable-housing finance companies. The official homepage describes
              a customer journey built around outreach, sector assessment, a customised product suite, underwriting, and
              continuous engagement. It states that underwriting aims for a turnaround time of less than 10 days, but
              this is a company-published operating promise rather than an independently measured service-level result.
              Customer testimonials on the same official page describe fast funding and data-informed supply-chain
              limits; these are useful workflow illustrations, not evidence of portfolio-wide performance.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE006
              - CE009
              - CE010
              - CE011
      - number: '5.2'
        title: Data and operating architecture
        blocks:
          - type: paragraph
            body: >-
              The clearest technical proof comes from Vivriti's Databricks case study. The company replaced Amazon
              Redshift plus an internally built stack using open-source Spark, Airflow, and custom orchestration after
              pipeline failures, compliance risk, and manual engineering intervention became constraints. The migration
              covered about 20 workflows and more than 50 pipelines, completed core workloads in eight weeks, and
              retired the prior platforms after final validation over a two-month conversion. Databricks SQL now
              separates analytics and reporting from transactional lending systems; the case study says the resulting
              environment supports tens of thousands of loan transactions per day and API-based ingestion for borrower
              identification, underwriting, fraud detection, and de-duplication. These are vendor case-study claims, so
              the architecture is evidenced but independent performance testing, uptime history, and production cost
              records remain diligence gaps.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE005
