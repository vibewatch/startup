  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Vivriti's closest alternative set is not one homogeneous peer group. It includes Northern Arc's specialist
              debt and capital-markets platform, UGRO Capital's secured and unsecured MSME lending, Lendingkart's
              digitally originated business loans, and large incumbents such as Tata Capital and Hero FinCorp. The
              status quo is also material: banks remain the principal source of mid-market funding, while internal
              treasury teams can choose direct borrowing, receivables finance, or private-credit funds. Vivriti's own
              historical description says the bond market for mid-corporates was effectively unavailable and that
              specialised lenders filled an access and speed gap. That is a real customer problem, but it also means the
              addressable competitive set expands as banks, NBFCs, and funds improve underwriting and distribution.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP013
              - CP014
      - number: '3.2'
        title: Product, underwriting, and distribution differentiation
        blocks:
          - type: paragraph
            body: >-
              Vivriti's strongest disclosed differentiator is a combination of tailored debt instruments and
              technology-supported credit selection. The company describes term loans, structured working-capital lines,
              NCDs, receivables investments, leasing, factoring, and ecosystem financing, while its CFO describes
              liquidity models and early-warning systems built from transaction data. Northern Arc describes a similarly
              broad credit-and-capital-markets approach, including term loans, structured lines, NCDs, and securitised
              trade receivables. Digital lenders compete on application speed and low-friction processing instead:
              Lendingkart advertises online KYC and fast disbursal, while Tata Capital publishes transparent ranges,
              fees, tenures, and a 48–72 hour disbursal claim. The result is a differentiated mid-market underwriting
              and structuring proposition, but not a protected technology moat.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP013
              - CP014
      - number: '3.3'
        title: Pricing, packaging, and switching trade-offs
        blocks:
          - type: paragraph
            body: >-
              Public pricing is not directly comparable across the peer set. Business India reported Vivriti charging
              13–15% interest against bills receivable and described term-loan tenures of two to three years; that is a
              historical reported example, not a current price card or realized portfolio yield. Tata Capital publishes
              business-loan rates starting at 12% per annum, fees up to 3%, and tenures up to 60 months, while
              Lendingkart and Hero FinCorp emphasize unsecured access, digital processing, and flexible repayment rather
              than a public rate card in the reviewed text. Northern Arc's page emphasizes investor access and tailored
              instruments rather than borrower pricing. Borrowers can multi-home across lenders when collateral,
              covenants, and documentation permit, but switching costs rise once a lender has built a proprietary risk
              view, financed an ecosystem, or arranged a bespoke structure. The record does not establish Vivriti's
              retention, price premium, or comparative loss-adjusted returns.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Vivriti's potential moat is cumulative underwriting data, specialist sector knowledge, investor
              relationships, and the ability to combine lending with capital-markets access. Its official profile
              reports work with more than 550 mid-market enterprises across more than 55 sectors, while its CFO said the
              company had 300-plus mid-market clients and planned to stay focused on the segment. These facts support
              scale and focus, not exclusivity: Northern Arc reports a long operating history and hundreds of portfolio
              companies, and large lenders can bring cheaper funding, stronger brands, and broader distribution.
              Competitor pages also show that digital origination, unsecured products, collateralized loans, and
              customized repayment are widely marketed. A material adverse conclusion is therefore that Vivriti can be
              displaced at the product edge or squeezed on funding cost unless its loss performance, repeat usage,
              investor access, and post-restructuring economics remain demonstrably superior. Those comparative data are
              not public in the assigned evidence.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Specialist credit model is a credible wedge
            body: >-
              Vivriti combines mid-market focus, structured products, and technology-supported underwriting in a segment
              described as underserved by banks.
            calloutType: strength
            claimRefs:
              - CP001
              - CP005
              - CP013
          - type: callout
            title: The moat is not proven against scaled lenders
            body: >-
              Competitors can match pieces of the proposition through cheaper funding, digital origination, collateral
              choice, or investor connectivity; comparative retention and loss data remain unavailable.
            calloutType: risk
            claimRefs:
              - CP014
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Vivriti is a mid-market lender rather than a SaaS company: its disclosed products include enterprise term
              and structured loans, working-capital facilities, supply-chain finance, factoring, and co-lending.
              Unlisted Sahi Hai reports FY26 standalone revenue from operations of ₹1,645.9 crore, up 22%, and PAT of
              ₹264.3 crore, up 20%. The same source estimates the consolidated revenue mix at 90% interest income, 9%
              fees and commissions, and 1% treasury gains, making spread income and credit performance the dominant
              economics. A 2025 CFO interview separately reported group AUM of ₹13,181 crore and group revenue of
              ₹1,429.1 crore, up 28.9%; those group figures have a different scope and period and should not be combined
              with FY26 standalone metrics. No assigned source provides list pricing, realized loan yields, discount
              schedules, or product-level margins, so AUM growth cannot substitute for a revenue-quality bridge.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI016
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI005
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI005
              - CI008
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI002
              - CI004
              - CI005
              - CI008
              - CI014
              - CI016
      - number: '4.2'
        title: GTM motion and operating efficiency
        blocks:
          - type: paragraph
            body: >-
              The public efficiency evidence is operational rather than economic. A Leegality supplier case study says
              digitized loan paperwork reduced execution time from three hours to five minutes, lifted productivity
              three- to four-fold, and allowed monthly loan volume to double. Because this is a supplier-published
              account using Vivriti management testimony, it is evidence of the claimed workflow change, not independent
              proof of lower CAC or better loss-adjusted returns. Foundit's company-job reposts show demand for
              underwriting, portfolio monitoring, treasury, regulatory reporting, reconciliation, loan servicing, and
              product-development skills. That breadth indicates a people- and control-intensive operating model despite
              automation, but it does not establish current headcount, payroll growth, or cost per account. Investors
              still need funnel conversion, sales cycle, channel CAC, servicing cost, repeat borrowing, and contribution
              margin by product before treating faster document execution as durable operating leverage.
            claimRefs:
              - CI006
              - CI007
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI011
              - CI012
              - CI014
              - CI015
              - CI016
      - number: '4.3'
        title: Capital adequacy, asset quality, and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The funding model is wholesale and debt-dependent. The 2025 CFO interview attributes approximately 60% of
              the capital structure to banks, 7–8% to exchange-traded commercial deposits, and the remaining 30% to
              NCDs. Separate historical financings include a US$25 million ADB climate-bond loan reported in 2024 and a
              US$55 million Series C announced in 2022; neither amount represents cash still available in FY26. ICRA
              reported 9M FY2026 total income of ₹1,214 crore, PAT of ₹160 crore, managed assets of ₹12,171 crore, gross
              NPA of 2.4%, and CRAR of 20.5%. Its June 2026 securitization rationale also identified high geographic
              concentration, with three states representing about 44% of one unsecured personal/MSME pool. Unlisted Sahi
              Hai reports FY26 borrowings of ₹9,319 crore and debt/equity of 3.87x, while consolidated operating cash
              outflow was ₹1,569 crore as the loan book grew and cash and bank balances fell to ₹667 crore from ₹1,004
              crore. That outflow is growth-related accounting cash flow, not a disclosed cash-burn rate.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              Vivriti shows genuine scale, profitability, institutional funding access, and a plausible automation
              benefit, but it remains a capital-intensive lender whose growth consumes funding capacity. FY26 standalone
              PAT and a reported 21.04% CRAR are constructive; 3.87x debt/equity, higher gross NPA indicators, falling
              cash balances, and dependence on wholesale lenders limit the inference that reported revenue growth will
              translate mechanically into distributable cash. The central issue is not a lack of revenue but the quality
              and durability of the spread after funding cost, impairment, servicing expense, and concentration risk.
              Before valuation, diligence should obtain audited post-scheme standalone and consolidated statements,
              product-level yield and fee bridges, credit-cost vintages, top exposures, ALM buckets, committed
              facilities, covenants, cash-flow conversion, CAC, and repeat-borrower cohorts. Until those denominators
              are available, the evidence supports a profitable lender with material refinancing and credit-cycle
              sensitivity, not a quantified margin-expansion thesis.
            claimRefs:
              - CI004
              - CI005
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
