              - CE005
              - CE006
              - CE007
              - CE009
      - number: '5.3'
        title: Maturity, dependencies, and controls
        blocks:
          - type: paragraph
            body: >-
              Vivriti's technology is mature enough to support regulated reporting and multi-party lending, but the
              operating model remains dependent on disciplined controls around data, partners, and portfolio growth. The
              CFO told ETCFO that Vivriti builds a proprietary client-liquidity model from publicly available
              transaction data and uses early-warning models to monitor stress scenarios. ICRA independently describes
              reliance on partners for origination and servicing; it says stepping in to service a portfolio when
              necessary is critical to sustainable scale. ICRA also flags the need to maintain underwriting, exposure
              limits, asset quality, and infrastructure as non-financial-enterprise lending expands. The apparent
              differentiation is therefore integrated workflow execution and monitoring rather than a publicly disclosed
              proprietary algorithm. A generic company profile on Uplers offers no role-level engineering or
              package-activity evidence, while the assigned ADB project URL returned only a generic ADB homepage.
              Independent developer maturity, security controls, incident response, external project proof, and roadmap
              delivery remain open diligence areas.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated data foundation
            body: >-
              The migration consolidated analytics, reporting, lineage, and time-travel capabilities on a governed
              platform while reducing dependence on self-managed infrastructure.
            calloutType: strength
            claimRefs:
              - CE004
              - CE005
              - CE007
          - type: callout
            title: Technology does not remove lending dependencies
            body: >-
              Partner origination and servicing, portfolio seasoning, model controls, and independent evidence of
              reliability remain material implementation and risk questions.
            calloutType: risk
            claimRefs:
              - CE010
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and scale
        blocks:
          - type: paragraph
            body: >-
              Vivriti's disclosed customer proposition is centered on Indian mid-market and corporate borrowers that
              need term debt, working-capital finance, supply-chain finance, factoring, co-lending, securitization, or
              other structured debt. The customer universe is broader than a single software-like ICP: Tracxn describes
              SMEs, mid-sized enterprises, large corporates, and retail NBFCs across multiple sectors, while the company
              surface separately lists mid corporates, large corporates, SMEs, and retail NBFCs. The public record
              therefore supports segmentation by borrower size and financing use case, but not a current revenue-band or
              payer-level mix. Built In reports a portfolio of INR 8,800+ crore across 300+ enterprises and 45+ sectors,
              whereas Vivriti Group's current surface reports 550+ mid-market enterprises and 55+ sectors; the differing
              scopes and vintages should not be treated as a single reconciled customer count.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU014
              - CU020
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU011
              - CU014
      - number: '6.2'
        title: Adoption and named customer proof
        blocks:
          - type: paragraph
            body: >-
              Public customer proof is strongest where a named borrower describes a concrete financing interaction.
              Cilicant describes funds arriving when needed for a business opportunity, SV Agri calls Vivriti a catalyst
              in its growth journey, RentoMojo cites tailored solutions, and Bizongo describes Vivriti as one of its
              largest lenders after more than two years of association. MediBuddy identifies Vivriti as its primary
              lender and emphasizes speed, while SUN Mobility describes Vivriti as an early partner in the EV and
              battery-swapping sector. These statements demonstrate named relationships and use cases, but they are
              company-selected testimonials and do not independently verify loan balances, repayment performance,
              renewal rates, or whether each relationship remains active as of the run date.
            claimRefs:
              - CU007
              - CU011
              - CU017
              - CU019
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
