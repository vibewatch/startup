chapter:
  number: 6
  title: Customers
  summary: Prague Technology has no publicly named customers, no disclosed pilots, and no visible developer surface as of 2026-07-11. The chapter therefore focuses on likely early customer segments, partner-led routes to market, and peer deployment evidence from embodied-AI and open-model companies that show where demand may emerge once Prague exposes a product.
sections:
- id: current-customer-proof
  title: Current customer proof is essentially absent
  body: 'The most important customer fact about Prague is a negative one: no public source reviewed for this report named a current paying customer, production pilot, design partner, or recurring usage metric for the company. Even Tencent''s participation should be handled carefully. It is a reported strategic investment, not a disclosed customer contract. That distinction matters because embodied-AI businesses can look commercially promising long before any buyer has committed to a production deployment. Prague also lacks the surrounding surfaces that usually precede customer evidence: no pricing page, no API docs, no model access portal, no case studies, and no visible deployment footage. The company may still be in private conversations with prospective partners, but public diligence cannot assume those exist. As of the report date, the safest framing is that Prague has category relevance and founder credibility, but not public customer proof. Every later conclusion in this chapter should
    be read through that constraint.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU026
  - CU033
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: likely-segments
  title: Likely early segments can be inferred from where embodied AI is already landing
  body: 'Although Prague has not disclosed customers, the broader embodied-AI market offers a useful map of likely early buyers. Figure''s BMW deployment shows that automotive manufacturing will buy humanoid capability when the task is repetitive, tightly defined, and physically demanding. Apptronik''s Mercedes-Benz agreement points to similar intralogistics and assembly-support use cases. GXO''s Agility deployment extends the pattern into warehouses, where RaaS structures make adoption easier. NVIDIA''s use-case materials and GR00T task framing widen the lens further: material handling, packaging, inspection, retail, and healthcare are all emerging as practical environments for physical AI. These examples do not prove Prague will win those accounts. They do show that the likely first buyer set is not consumers. It is industrial operators, robotics developers, and institutions willing to co-design workflows in exchange for labor relief, efficiency gains, or strategic technical advantage.'
  claimRefs:
  - CU007
  - CU008
  - CU009
  - CU012
  - CU013
  - CU016
  - CU031
  - CU032
  tableRefs:
  - TU002
  - TU003
  figureRefs:
  - FU002
  - FU003
- id: routes-to-market
  title: The first route to customer may be partner-led rather than direct
  body: 'Peer evidence suggests Prague''s early go-to-market may rely more on partners than on standalone sales. Apptronik''s DeepMind partnership and Robot Park network show how customer and partner sites can also serve as data-generation and product-improvement loops. Reflection AI''s infrastructure partners and sovereign-factory ambitions show a similar pattern in frontier AI: alliances can create customer access, delivery capability, and proof simultaneously. Alibaba Cloud''s Model Studio history shows another China-relevant route: expose frontier capability first through APIs, evaluation tools, or enterprise access layers before expanding into broader packaged products. Prague could plausibly adopt any of these motions. For a pre-product lab, that means the first customer-facing surface may not be a robot at all. It could be a co-development relationship, a simulation/evaluation environment, a model API, or a strategic pilot with an enterprise or public-sector counterparty. Tencent''s
    presence increases that possibility but does not verify it.'
  claimRefs:
  - CU005
  - CU006
  - CU010
  - CU011
  - CU018
  - CU019
  - CU020
  - CU022
  - CU029
  - CU034
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: concentration-risks
  title: Even an early win would come with heavy concentration and proof risk
  body: 'The commercial challenge for Prague is not only finding a first buyer. It is finding a first buyer that creates repeatable proof. Embodied-AI deployments remain concentrated in a handful of lighthouse accounts, often in factories or logistics environments with unusually strong technical partners. That makes concentration risk high and expansion path uncertain. A single named pilot would improve Prague''s visibility, but it would not solve questions about retention, satisfaction, or broad willingness to pay. Those metrics remain fully unobservable today. In practical terms, investors should expect long sales cycles, bespoke integration, and ROI scrutiny centered on safety, uptime, and workflow fit. Prague''s strongest current demand signal comes from category analogs, not from its own pipeline. The market clearly exists. The unresolved issue is whether Prague has a privileged route into it or whether it still needs to earn that route from scratch. The burden of proof is therefore
    unusually high: Prague needs not only a first logo, but a buyer story that demonstrates repeatability beyond founder halo and investor signaling.'
  claimRefs:
