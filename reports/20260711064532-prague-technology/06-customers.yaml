  - id: GU001
    question: Does Prague have any signed design partner, pilot, or paid POC not yet publicly announced?
    impact: This is the single most important missing customer fact because it separates pure thesis from first demand capture.
    nextStep: Request a customer pipeline summary with stage, segment, and expected go-live dates.
    relatedClaimRefs:
