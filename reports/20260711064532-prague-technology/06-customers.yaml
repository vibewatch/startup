    - CU004
    - CU036
  - id: GU002
    question: What exactly does Tencent gain operationally from its strategic investment?
    impact: If Tencent contributes distribution, cloud, or downstream product access, Prague's customer motion could look materially stronger than the public record suggests.
    nextStep: Review commercial side letters, cloud credits, integration rights, and co-selling provisions.
    relatedClaimRefs:
    - CU002
    - CU029
    - CU030
