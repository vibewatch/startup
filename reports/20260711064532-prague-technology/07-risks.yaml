chapter:
  number: 7
  title: Risks
  summary: Prague Technology is risky in exactly the way elite founder-led AI labs usually are, but with extra fragility from China-related compute constraints and the embodied-AI execution burden. The current risk stack is dominated by founder concentration, zero-product proof, frontier technical complexity, talent competition, and geopolitical exposure.
sections:
- id: people-execution
  title: People and execution risks are already concentrated
  body: Prague starts with a paradox. The founder is the asset, and the founder dependency is also the risk. Lin Junyang's Qwen pedigree is the core reason investors took Prague seriously at inception, but that means the lab has little room for organizational redundancy while it is still forming. The public record does not yet show a broad leadership bench, a mature product organization, or a shipped artifact that can be evaluated independently of Lin's reputation. The abrupt nature of his early-2026 departure from Qwen reinforces the reality that Prague's current investability is heavily bound to one individual and his ability to recruit, align, and retain a world-class team fast. A normal seed startup can sometimes hide execution noise behind product iteration. Prague cannot. With a $2 billion valuation and no public product, every month without proof makes people risk and execution risk more visible rather than less visible.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR018
  - CR019
  - CR021
  - CR026
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: regulatory-compute
  title: Regulatory, compute, and safety burdens compound one another
  body: Frontier embodied AI is not only technically hard; it is governance-heavy. Prague faces Chinese generative-AI rules, filing expectations, and AI-agent governance signals at the same time it faces U.S. export-control pressure on advanced chips. Those are not separate issues. They interact. Compute shortages or procurement friction can slow technical progress; slower technical progress can delay artifacts; delayed artifacts can make fundraising more fragile. On the deployment side, embodied systems raise safety, monitoring, and sim-to-real reliability issues that software-only teams can postpone longer. NIST's risk-management framing is a reminder that trustworthy deployment requires governance, testing, and controls even when a lab is moving fast. Publicly, Prague has not yet shown how it will handle those burdens. That makes the chapter treat regulatory and operational risk as live current-state concerns, not merely future scale problems.
  claimRefs:
  - CR005
  - CR006
  - CR008
  - CR009
  - CR010
  - CR011
  - CR012
  - CR013
  - CR024
  - CR025
  - CR027
  - CR028
  tableRefs:
  - TR002
  - TR004
  figureRefs:
  - FR002
- id: competition-talent
  title: Competition and talent markets can overwhelm a thesis-led lab
  body: Prague is not racing in an empty category. It is stepping into a field populated by labs that already publish robot stacks, recruit globally, expose developer surfaces, or deploy into real customer environments. Gemini Robotics, Figure, Apptronik, Agility, GR00T, π0, Skild AI, SSI, Together AI, Anthropic, and Reflection all matter in different ways. Some are direct technical rivals in physical AI. Others are indirect rivals for compute, funding, and rare frontier talent. The careers pages and public hiring signals across these peers matter because they show the labor market Prague must compete inside, not because a jobs page proves quality by itself. Prague may be able to attract elite people around Lin, but it must do so against organizations with larger brands, richer tooling, stronger customer proof, or bigger compute pools. In that environment, being early is not enough. Prague must become legibly exceptional before the market decides that the frontier is already spoken for.
  claimRefs:
  - CR014
  - CR015
  - CR016
  - CR017
  - CR018
  - CR029
  - CR030
  tableRefs:
  - TR003
  figureRefs:
  - FR003
  - FR004
- id: mitigations
  title: The story de-risks only through proof conversion
  body: 'The good news is that Prague''s risk stack is interpretable. The bad news is that it cannot be papered over with narrative. The lab will de-risk only by converting capital into technical proof, technical proof into customer or partner proof, and that proof into a credible next financing or productization path. Investors do not need Prague to solve every risk immediately, but they do need the company to answer a few critical questions soon: what is the first Prague-native artifact, what compute and data base supports it, how is safety evaluated, who is the first external partner, and what milestones would justify the next round? If those answers appear, the risk profile can improve quickly because the current burden is mostly absence. If they do not appear, the same absence becomes evidence of stagnation. Prague is therefore a lab where mitigation and kill criteria are unusually close to each other in time. That is why timing itself is a core risk variable rather than a mere scheduling
    detail.'
  claimRefs:
  - CR020
  - CR022
  - CR023
  - CR031
