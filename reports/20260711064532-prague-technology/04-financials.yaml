- id: revenue-model-absence
  title: Revenue absence and the implied business model
  body: 'Financial analysis of Prague is constrained by what is missing. No public source reviewed disclosed current revenue, ARR, gross margin, customer count, pricing, or even a named commercial product. That means the chapter cannot evaluate Prague through ordinary software metrics. Instead, the best lens is comparative and structural. Frontier peers show that pre-product AI labs often commercialize later through enterprise licensing, infrastructure partnerships, sovereign deployments, or robotics-adjacent systems rather than through immediate broad-market subscriptions. Together AI illustrates the more mature end of that path: once a company packages open-model infrastructure at scale, customer density and bookings can rise quickly. Reflection AI illustrates the earlier end: investors may still fund a lab heavily before its first frontier release if they believe the team can reach technically scarce capability. Prague sits even earlier than both. Its current economics are therefore prospective,
    not observed. The company is buying time to discover a business model, not compounding a proven one.'
  claimRefs:
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
