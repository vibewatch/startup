- id: capital-adequacy
  title: Capital adequacy remains the central unresolved financial question
  body: 'The easiest mistake is to treat $220 million as either obviously huge or obviously insufficient. Both views oversimplify Prague''s position. For a normal Chinese startup with no product and no revenue, the round is enormous. For a lab that hopes to matter in world models and embodied intelligence, it may only be the opening bankroll needed to assemble a team, secure early compute, and buy time for follow-on capital. Peer evidence shows how quickly this frontier expands: Together AI paired an $800 million Series C with more than 500 megawatts of compute commitments, while Reflection AI raised $2 billion before its first frontier release and kept leaning on infrastructure partners to scale training. Prague does not yet disclose comparable procurement, customer validation, or capacity plans. That makes the current valuation intelligible as option value but difficult to underwrite as durable financial strength. Until the company discloses product, customers, or compute commitments,
    public diligence can only conclude that Prague is well financed for formation and poorly disclosed for forecasting.'
  claimRefs:
