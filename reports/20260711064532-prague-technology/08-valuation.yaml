  - FV004
- id: recommendation
  title: 'Recommendation: track, research more, and use explicit kill triggers'
  body: 'The appropriate investment stance is therefore not to wave Prague through as obviously cheap, nor to dismiss it as obviously impossible. The cleaner conclusion is stretched-but-not-incoherent. Prague is expensive today because there is too little current proof to justify a higher-confidence endorsement, yet the market context makes a $2 billion founder-led AI round explainable. That leaves a narrow actionable posture: keep the company on a close watchlist, demand explicit evidence before re-rating upward, and define kill triggers before the next financing cycle. The most important diligence asks are simple. What is the first Prague-native artifact? What compute and data path underpins it? Who is the first real partner or pilot? What safety and governance controls exist? Until those answers are concrete, valuation confidence should stay low and the recommendation should remain research-more / track rather than buy the story outright. Investors should insist on milestone-linked re-underwriting
    rather than drifting with sentiment.'
