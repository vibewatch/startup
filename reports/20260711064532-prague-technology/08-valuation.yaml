company:
  name: Prague Technology
chapter:
  number: 8
  title: Valuation
  summary: Prague Technology's $2 billion June 2026 valuation is not supported by current operating metrics; it is supported by founder scarcity, frontier-category optionality, and a market still willing to pay richly for AI labs before proof. The result is a valuation that is understandable under 2026 frontier-AI logic but still best described as stretched and low-confidence.
sections:
- id: headline-logic
  title: What the $2B price is really buying
  body: 'Prague''s valuation cannot be understood through normal startup math. There is no disclosed ARR, no customer count, no gross margin history, and no product revenue to capitalize. The June 2026 round instead priced an option: that Lin Junyang can translate Qwen-era credibility into a new Chinese leader in world models and embodied intelligence before the market settles around a winner. That logic is not irrational in the context of 2025-2026 frontier AI financing, but it is undeniably aggressive. Investors were paying for the possibility of future scarcity, not for a demonstrated business. In effect, Prague was valued less like a seed-stage software company and more like an elite technical asset in a supply-constrained market. That distinction matters because it raises the hurdle for what must happen next. If Prague delivers a credible artifact and partner proof, the round can look prescient. If it does not, the same price can quickly look like narrative overreach.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV017
  - CV018
  - CV019
  tableRefs:
  - TV001
  figureRefs:
  - FV003
- id: comparables
  title: Comparable valuations show the market logic, not automatic justification
  body: 'Peer valuations explain why Prague could clear $2 billion early, but they do not automatically make Prague inexpensive. Reflection AI, Together AI, and Mistral all demonstrate that 2026 investors still pay extreme prices for frontier-model or open-model narratives. Reflection shows willingness to fund elite technical teams before mature commercialization. Together AI shows what stronger proof looks like once bookings, customers, and infrastructure scale become visible. Mistral shows that even outside the United States, frontier-model scarcity can command enormous premia. These are useful anchors because Prague is clearly closer to the first category than to the second: it looks like a frontier thesis investment rather than an economically de-risked platform. That is why the chapter uses comparables as logic checks rather than as mechanical valuation anchors. Prague does not deserve a revenue-multiple framework yet because it does not have revenue. It deserves a milestone-probability
    framework shaped by which peers prove what, and when.'
  claimRefs:
  - CV004
  - CV005
  - CV006
  - CV007
  - CV008
  - CV009
  - CV010
  - CV011
  - CV031
  tableRefs:
