- id: scenarios
  title: The valuation range is dominated by milestone sensitivity
  body: Because Prague is pre-revenue, valuation sensitivity is mostly narrative sensitivity. If the company releases a differentiated artifact, names a meaningful partner, or raises a larger follow-on round from conviction investors, the current price can look merely aggressive. If those proof points slip while the broader market rotates toward harder fundamentals, the same price can look fragile very quickly. This is why the bull/base/bear framework matters more than precise math. The bull case imagines Prague becoming a recognized physical-AI leader in China with enough technical proof to justify another re-rating. The base case imagines continued intrigue but still-incomplete proof, leaving the company investable only to investors comfortable with low visibility. The bear case imagines no proof conversion and fast compression of founder-premium pricing. In all three cases, the current price is highly leveraged to a handful of events rather than to a smooth operating curve.
  claimRefs:
  - CV012
  - CV013
  - CV014
  - CV015
  - CV016
  - CV028
  - CV029
  - CV036
  - CV037
  - CV038
