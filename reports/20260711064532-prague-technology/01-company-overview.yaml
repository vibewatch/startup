company:
  name: Prague Technology
chapter:
  number: 1
  title: Company Overview
  summary: Prague Technology is a Shanghai-based inception-stage AI lab built around Lin Junyang's Qwen pedigree. Public reporting supports a roughly $220 million first round at a $2 billion valuation in June 2026 from HongShan, Gaorong, and Tencent, but it also shows a company with no announced product, no disclosed revenue, minimal public web presence, and unusually high founder concentration.
sections:
- id: identity-thesis
  title: Identity, stage, and public posture
  body: 'Prague Technology is best understood as an inception-stage Shanghai AI lab rather than a product company. The public record points to Shanghai Pragmatics Technology Co., Ltd. and related Shanghai entities controlled by Lin Junyang, but the company still presents almost none of the normal operating surfaces investors expect from a commercial software startup. The pragmatics.ai domain resolves, yet it does not provide a meaningful description of products, pricing, customers, or roadmap. That matters because the company nevertheless reached a reported $2 billion valuation in its first disclosed financing round. The cleanest one-line description supported by the evidence is therefore: a newly formed Shanghai research lab, built around Lin Junyang''s reputation from Qwen, pursuing world models and embodied intelligence while remaining pre-product and pre-revenue. Later chapters should inherit this distinction rather than flattening Prague into a normal seed software company with ordinary
    launch metrics.'
  claimRefs:
  - CO001
  - CO005
  - CO019
  - CO025
