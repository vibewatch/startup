- id: adverse-signals-gaps
  title: Adverse signals and disclosure gaps
  body: 'The most important adverse observation is not scandal but absence. Prague has raised an unusually large amount of capital for a company that still does not disclose headcount, customers, roadmap, board structure, or revenue base. The founder narrative is strong, but the same narrative creates concentration risk: Lin is simultaneously the reason the round happened and the principal dependency underwriting it. The abrupt nature of his March 2026 Qwen departure adds another cautionary note, because it shows how much of Prague''s investability depends on the continuity of one specific technical leader. There is also a more structural concern. The company is deliberately avoiding the most crowded general-purpose LLM lane, but that means it is entering an even less proven commercial category where the path from world-model research to repeatable revenue remains unclear. This chapter therefore treats Prague''s overview as credible but incomplete: a serious frontier lab in formation, financed
    on founder quality and category ambition, with almost every operating metric still unresolved.'
