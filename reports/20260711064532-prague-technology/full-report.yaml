      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The most plausible early buyers are not mass-market consumers but technical organizations already paying
              for experimentation in physical AI. Robotics OEMs, humanoid-robot startups, industrial automation groups,
              automotive or edge-device teams, cloud-model platforms, and corporate research labs all fit the pattern.
              Within those accounts, users are usually ML researchers, robotics engineers, simulation developers, and AI
              infrastructure teams; the payer is typically an R&D, CTO, or platform budget. Adoption tends to begin with
              narrow pilots in simulation or offline research, then move into constrained physical deployments where
              safety and failure costs are manageable, and only later expand into broader automation or robotic fleets.
              That path is important for Prague because it implies long pre-revenue cycles and high proof requirements:
              even if the category is exciting, budgets do not convert instantly from demos into deployment.
