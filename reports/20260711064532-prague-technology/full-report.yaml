        title: The thesis is a physical-world stack, not another text-only model
        blocks:
          - type: paragraph
            body: >-
              The most revealing technical clue is the shape of the adjacent Qwen-affiliated robotics research.
              Qwen-RobotWorld describes a language-conditioned video world model that predicts physically grounded
              futures across multiple embodied settings. Qwen-VLA then defines a unified action-and-trajectory framework
              spanning manipulation, navigation, and other embodiments with prompt-conditioned switching rather than
              robot-specific heads. Read together, these sources suggest the architecture Prague is likely chasing: a
              multimodal base model that understands scenes and language, a world model that simulates or predicts
              dynamics, and an action layer that turns semantics into robot behavior. This is also where peer systems
              matter. Gemini Robotics, Figure's Helix, and Physical Intelligence's π0 all point toward the same frontier
              direction: embodied intelligence is converging around generalist, cross-embodiment stacks rather than
              narrowly scripted policies. Prague therefore looks less like a hidden application startup and more like a
              lab trying to build a reusable physical-AI substrate.
