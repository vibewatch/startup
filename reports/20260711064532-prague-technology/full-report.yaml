      - number: '3.3'
        title: Switching cost, multi-homing, and what Prague's moat would need to be
        blocks:
          - type: paragraph
            body: >-
              The market structure favors multi-homing. A technical buyer can use one vendor for foundation models,
              another for simulation or synthetic data, and a third for deployment tooling. Open-source or internal
              build remains a credible substitute for advanced teams, especially before deployment standards harden and
              before Prague has named customers with sticky workflows. That means switching costs are currently low to
              medium for Prague. Its strongest imaginable moat is not current distribution but a specific physical-AI
              insight—something in world modeling, control, or embodied training that actually performs better in
              customer workflows than open tools or better-capitalized incumbent stacks. Founder pedigree alone is
              insufficient. It can open doors and justify valuation, but it does not create lock-in. Until Prague shows
              benchmark, partner, or deployment proof that rivals do not already own, the moat remains more thesis than
              fact.
