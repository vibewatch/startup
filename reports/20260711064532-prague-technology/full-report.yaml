      - number: '1.3'
        title: Funding, investors, and why the $2B mark happened early
        blocks:
          - type: paragraph
            body: >-
              Public reporting converges on one extraordinary funding fact: Prague's first disclosed round in June 2026
              was reported at about $220 million total, with HongShan and Gaorong each contributing about $100 million
              and Tencent adding about $20 million, at roughly a $2 billion post-money valuation. The round is notable
              not because it followed a product launch or measurable commercialization milestone, but because it did
              not. Sources repeatedly describe a company with no announced product, no disclosed revenue, and no mature
              website. That makes the financing a pure reputation-and-thesis transaction. Investors were effectively
              underwriting Lin Junyang's ability to translate Qwen-era model leadership into a new frontier category
              before anyone else in China built the dominant world-model lab. Reports that the company was already
              probing a new round immediately after the first close reinforce the interpretation that Prague entered the
              market as a premium talent asset rather than as a conventional startup moving through normal traction
              checkpoints.
