              views oversimplify Prague's position. For a normal Chinese startup with no product and no revenue, the
              round is enormous. For a lab that hopes to matter in world models and embodied intelligence, it may only
              be the opening bankroll needed to assemble a team, secure early compute, and buy time for follow-on
              capital. Peer evidence shows how quickly this frontier expands: Together AI paired an $800 million Series
              C with more than 500 megawatts of compute commitments, while Reflection AI raised $2 billion before its
              first frontier release and kept leaning on infrastructure partners to scale training. Prague does not yet
