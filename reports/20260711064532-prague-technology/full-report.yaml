              - CV026
              - CV036
              - CV039
              - CV040
      - number: '8.2'
        title: Comparable valuations show the market logic, not automatic justification
        blocks:
          - type: paragraph
            body: >-
              Peer valuations explain why Prague could clear $2 billion early, but they do not automatically make Prague
              inexpensive. Reflection AI, Together AI, and Mistral all demonstrate that 2026 investors still pay extreme
              prices for frontier-model or open-model narratives. Reflection shows willingness to fund elite technical
              teams before mature commercialization. Together AI shows what stronger proof looks like once bookings,
              customers, and infrastructure scale become visible. Mistral shows that even outside the United States,
              frontier-model scarcity can command enormous premia. These are useful anchors because Prague is clearly
              closer to the first category than to the second: it looks like a frontier thesis investment rather than an
              economically de-risked platform. That is why the chapter uses comparables as logic checks rather than as
              mechanical valuation anchors. Prague does not deserve a revenue-multiple framework yet because it does not
              have revenue. It deserves a milestone-probability framework shaped by which peers prove what, and when.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
