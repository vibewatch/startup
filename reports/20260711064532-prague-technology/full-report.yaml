            body: >-
              Prague has not published a budget, but its technical ambition gives the cost stack a recognizable shape.
              World models and embodied intelligence are not lightweight application categories. They combine
              frontier-model training with simulation environments, multimodal data pipelines, and iteration loops that
              are difficult to run cheaply. Official pricing pages from Lambda and CoreWeave show why. Even publicly
              listed cloud prices imply that hundreds of GPUs can produce high six-figure monthly bills, while thousands
              of GPUs push infrastructure spend into many millions per month before the company pays elite researchers,
              acquires data, or absorbs general overhead. Tools and platforms associated with world-model development —
              Genie 2, NVIDIA Cosmos, MuJoCo, and Isaac Sim — reinforce this direction: Prague is entering a part of the
              stack where experimentation itself is capital intensive. For a Chinese lab, export controls on advanced
              chips layer additional friction onto the equation. The result is not a precise burn estimate, but a strong
              directional conclusion: compute adequacy will matter more than superficial seed-round size headlines.
