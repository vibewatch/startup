      - number: '2.2'
        title: Sizing lenses and why estimates diverge
        blocks:
          - type: paragraph
            body: >-
              Public sizing lenses support the idea that Prague is chasing a meaningful market, but they do not justify
              false precision. Kaiso's dedicated world-model lens is useful because it recognizes the category directly,
              yet it likely captures only a small emerging core. Grand View's AI-in-robotics lens and broader simulation
              or digital-twin forecasts are much larger, but they are adjacent categories, not direct SAM. China's
              generative-AI growth forecasts and IDC's agentic-future framing add a supportive macro backdrop without
              telling us how much of that spend flows specifically to world models. The practical conclusion is that
              Prague's addressable market should be modeled through layers: a narrow world-model core, a larger
              embodied-AI software layer, and an even larger simulation-and-digital-twin adjacency. Those layers can
              support valuation narratives, but they cannot yet produce a clean Prague-specific SOM from public evidence
              alone.
