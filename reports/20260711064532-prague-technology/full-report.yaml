  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, adjacents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Prague does not compete in one clean product bucket. The direct-peer layer includes world-model and
              embodied-intelligence startups such as World Labs and Physical Intelligence, each of which has made its
              public product or technical thesis more legible than Prague. The incumbent frontier-lab layer includes
              DeepMind, OpenAI, and NVIDIA, which validate the strategic importance of world models while also setting a
              much higher bar on compute, ecosystem, and developer reach. The Chinese model-lab layer is different
              again: Zhipu, Moonshot, MiniMax, StepFun, DeepSeek, Qwen, ERNIE, and Doubao are not all building
              Prague-like world models, but they compete for capital, hiring, developer attention, and some enterprise
              AI budgets. The true substitute set is broader still. Advanced customers can assemble their own stack from
              open models, simulation frameworks, and internal engineering instead of committing to a single frontier
              startup vendor. That makes Prague's competitive field unusually multi-layered and unforgiving.
            claimRefs:
