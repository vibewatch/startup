              generative-AI rules, filing expectations, and AI-agent governance signals at the same time it faces U.S.
              export-control pressure on advanced chips. Those are not separate issues. They interact. Compute shortages
              or procurement friction can slow technical progress; slower technical progress can delay artifacts;
              delayed artifacts can make fundraising more fragile. On the deployment side, embodied systems raise
              safety, monitoring, and sim-to-real reliability issues that software-only teams can postpone longer.
              NIST's risk-management framing is a reminder that trustworthy deployment requires governance, testing, and
              controls even when a lab is moving fast. Publicly, Prague has not yet shown how it will handle those
              burdens. That makes the chapter treat regulatory and operational risk as live current-state concerns, not
