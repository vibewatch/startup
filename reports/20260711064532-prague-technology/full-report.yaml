  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Round structure and what investors actually financed
        blocks:
          - type: paragraph
            body: >-
              Prague's public financial story starts with a single extraordinary fact set: a June 2026 round of roughly
              $220 million at a reported $2 billion valuation, led in practice by HongShan and Gaorong with Tencent
              adding a smaller strategic check. That would already be notable for a company with an established product
              line. It is much more striking for Prague because the same reporting repeatedly emphasizes the absence of
              a launched product, revenue, or standard commercial disclosure. In other words, the first round was not
              underwriting a visible software business with bookings, pilots, or conversion funnels. It was underwriting
              a founder, a research thesis, and a timing window in Chinese AI. Lin Junyang's Qwen pedigree is therefore
              financially inseparable from the capitalization event. Investors were not merely backing a company entity;
              they were buying an option on whether a proven model architect could redirect his reputation and network
              into a new frontier category before the market settled around a winner.
