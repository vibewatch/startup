      - number: '3.4'
        title: 'Adverse evidence: commoditization, incumbent response, and category volatility'
        blocks:
          - type: paragraph
            body: >-
              The adverse competitive case is structural rather than personal. World models matter, but the category
              remains volatile and may standardize faster than Prague commercializes. Open tools and infrastructure
              vendors can commoditize large portions of the stack from below, while giants such as DeepMind, OpenAI, and
              NVIDIA can absorb valuable features into broader ecosystems from above. Inside China, the model price war
              and intense talent competition raise the bar further. Prague is competing not only with glamorous global
              labs but with richly funded domestic players that already have product surfaces and stronger channels. As
              a result, the current competitive read is cautious. Prague is directionally interesting and may be
              strategically right about physical AI, yet public evidence does not currently support treating it as a
              clear winner over the better-packaged, better-capitalized, or better-distributed alternatives. The next
              upgrade path is concrete: public benchmarks, product packaging, customer proof, and visible workflow
              adoption over time.
            claimRefs:
