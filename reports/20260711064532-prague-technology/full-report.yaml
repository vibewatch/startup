  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: People and execution risks are already concentrated
        blocks:
          - type: paragraph
            body: >-
              Prague starts with a paradox. The founder is the asset, and the founder dependency is also the risk. Lin
              Junyang's Qwen pedigree is the core reason investors took Prague seriously at inception, but that means
              the lab has little room for organizational redundancy while it is still forming. The public record does
              not yet show a broad leadership bench, a mature product organization, or a shipped artifact that can be
              evaluated independently of Lin's reputation. The abrupt nature of his early-2026 departure from Qwen
              reinforces the reality that Prague's current investability is heavily bound to one individual and his
              ability to recruit, align, and retain a world-class team fast. A normal seed startup can sometimes hide
              execution noise behind product iteration. Prague cannot. With a $2 billion valuation and no public
              product, every month without proof makes people risk and execution risk more visible rather than less
