  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what Prague is actually selling into
        blocks:
          - type: paragraph
            body: >-
              Prague is not entering the generic chatbot market. Its publicly reported focus on world models and
              embodied intelligence places it in a narrower but strategically important slice of AI: software that helps
              machines model physical environments, plan actions, and safely move from simulation into real-world
              behavior. That boundary matters because public market estimates vary enormously depending on whether one
              counts only pure world-model software, the wider AI-in-robotics stack, or even the broader digital-twin
              and simulation economy around physical systems. For diligence purposes, the cleanest boundary includes
              world-model training, embodied-AI control stacks, simulation environments, synthetic-data tooling, and
              deployment infrastructure for physical systems. It excludes hardware BOM, general consumer chat, and
              unrelated AI app categories. This framing also clarifies the status quo: buyers can still rely on
              conventional robotics software, bespoke simulation pipelines, or ungrounded LLMs instead of Prague-like
              offerings.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
