          - type: paragraph
            body: >-
              Prague's valuation cannot be understood through normal startup math. There is no disclosed ARR, no
              customer count, no gross margin history, and no product revenue to capitalize. The June 2026 round instead
              priced an option: that Lin Junyang can translate Qwen-era credibility into a new Chinese leader in world
              models and embodied intelligence before the market settles around a winner. That logic is not irrational
              in the context of 2025-2026 frontier AI financing, but it is undeniably aggressive. Investors were paying
              for the possibility of future scarcity, not for a demonstrated business. In effect, Prague was valued less
              like a seed-stage software company and more like an elite technical asset in a supply-constrained market.
              That distinction matters because it raises the hurdle for what must happen next. If Prague delivers a
              credible artifact and partner proof, the round can look prescient. If it does not, the same price can
              quickly look like narrative overreach.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV017
              - CV018
              - CV019
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
