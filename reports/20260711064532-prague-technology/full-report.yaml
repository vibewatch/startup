      - number: '1.2'
        title: Founder-market fit and the Qwen lineage
        blocks:
          - type: paragraph
            body: >-
              The founder story is the core asset. Lin Junyang's value to Prague is not generic 'ex-Big Tech' pedigree
              but a specific record inside Alibaba's Qwen program: joining DAMO in 2019, becoming the technical center
              of gravity for Qwen by late 2022, and contributing to a sequence of multilingual and multimodal model
              releases that gave him unusual credibility in China's open-model ecosystem. Official Qwen materials show
              why that reputation matters. Qwen2 scaled across multiple sizes and longer context, Qwen2.5 broadened the
              model family, and Qwen3-era materials leaned further into reasoning-plus-action framing. The adjacent
              research lineage also matters. Lin's name appears in work associated with M6, OFA, and Chinese-CLIP, which
              helps explain why investors treat him as a credible bridge from language models toward broader world-model
              and embodied-intelligence work. Prague is therefore being financed less as a blank shell than as a
              founder-led continuation of a proven frontier-model career.
