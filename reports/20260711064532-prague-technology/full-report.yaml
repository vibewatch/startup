      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The valuation is a bet on becoming special, not on being merely competent
            body: >-
              Prague does not need to be good to justify $2B; it needs to become category-defining or at least visibly
              scarce very quickly.
            calloutType: insight
            claimRefs:
