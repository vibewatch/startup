    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and public posture
        blocks:
          - type: paragraph
            body: >-
              Prague Technology is best understood as an inception-stage Shanghai AI lab rather than a product company.
              The public record points to Shanghai Pragmatics Technology Co., Ltd. and related Shanghai entities
              controlled by Lin Junyang, but the company still presents almost none of the normal operating surfaces
              investors expect from a commercial software startup. The pragmatics.ai domain resolves, yet it does not
              provide a meaningful description of products, pricing, customers, or roadmap. That matters because the
              company nevertheless reached a reported $2 billion valuation in its first disclosed financing round. The
              cleanest one-line description supported by the evidence is therefore: a newly formed Shanghai research
              lab, built around Lin Junyang's reputation from Qwen, pursuing world models and embodied intelligence
              while remaining pre-product and pre-revenue. Later chapters should inherit this distinction rather than
              flattening Prague into a normal seed software company with ordinary launch metrics.
