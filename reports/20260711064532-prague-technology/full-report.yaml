      - number: '3.2'
        title: Capability, packaging, pricing, and where rivals are stronger today
        blocks:
          - type: paragraph
            body: >-
              Public product surfaces suggest a split market rather than a winner-take-all race. World Labs has a named
              workflow in Marble. Physical Intelligence has a concrete robot-policy narrative. DeepMind and NVIDIA have
              broader ecosystem depth. The Chinese AI Tigers have public model, app, or platform surfaces, and several
              publish pricing or usage positioning that Prague cannot yet match. That matters because competitive buyers
              often reward packaging and workflow clarity before they reward abstract research prestige. The 2026
              Chinese API price war further sharpens the issue: if Prague tried to compete as just another cheap model
              endpoint, better-distributed labs such as DeepSeek, Qwen, MiniMax, StepFun, Moonshot, ERNIE, or Doubao
              could likely compress the economics. Prague therefore needs a more specific value proposition than generic
              model access. The present public record does not yet show that proposition clearly. Another implication is
              organizational: the buyers most likely to evaluate Prague already have alternatives on the shelf, so the
              startup is competing against existing procurement comfort as much as against raw model quality.
