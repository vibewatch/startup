        title: Milestones and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Prague's chronology is short, but it is still coherent enough to anchor later chapters. The prehistory
              starts with Lin's 2019 arrival at DAMO, his rise into Qwen leadership around late 2022, and the official
              Qwen technical milestones in 2023 through 2025. That sequence matters because it explains why investors
              interpret Prague as a continuation of real frontier work rather than as a resume-only story. The immediate
              Prague timeline then compresses sharply: public reporting says Lin organized embodied-intelligence efforts
              inside Alibaba in late 2025, stepped down from Qwen in early March 2026, surfaced in May 2026 with a
              reported $2 billion fundraising effort, and closed the $220 million round in mid-June. Public
              registry-style sources also show a cluster of Shanghai registrations aligned to that window. The result is
              a lab that moved from founder departure to multibillion-dollar valuation in roughly a quarter, with
              Shanghai as the evident operating base.
