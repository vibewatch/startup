chapter:
  number: 2
  title: Market Analysis
  summary: 'Prague is targeting a market that is strategically important but still poorly standardized: physical-world foundation-model software spanning world models, embodied-AI control, and simulation infrastructure. Public sources support strong macro and policy tailwinds in 2026, but they also show why Prague-specific SAM, pricing, and deployment timing remain under-evidenced.'
sections:
- id: market-boundary
  title: Market boundary and what Prague is actually selling into
  body: 'Prague is not entering the generic chatbot market. Its publicly reported focus on world models and embodied intelligence places it in a narrower but strategically important slice of AI: software that helps machines model physical environments, plan actions, and safely move from simulation into real-world behavior. That boundary matters because public market estimates vary enormously depending on whether one counts only pure world-model software, the wider AI-in-robotics stack, or even the broader digital-twin and simulation economy around physical systems. For diligence purposes, the cleanest boundary includes world-model training, embodied-AI control stacks, simulation environments, synthetic-data tooling, and deployment infrastructure for physical systems. It excludes hardware BOM, general consumer chat, and unrelated AI app categories. This framing also clarifies the status quo: buyers can still rely on conventional robotics software, bespoke simulation pipelines, or ungrounded
    LLMs instead of Prague-like offerings.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM021
  tableRefs:
  - TM001
- id: sizing-lenses
  title: Sizing lenses and why estimates diverge
  body: 'Public sizing lenses support the idea that Prague is chasing a meaningful market, but they do not justify false precision. Kaiso''s dedicated world-model lens is useful because it recognizes the category directly, yet it likely captures only a small emerging core. Grand View''s AI-in-robotics lens and broader simulation or digital-twin forecasts are much larger, but they are adjacent categories, not direct SAM. China''s generative-AI growth forecasts and IDC''s agentic-future framing add a supportive macro backdrop without telling us how much of that spend flows specifically to world models. The practical conclusion is that Prague''s addressable market should be modeled through layers: a narrow world-model core, a larger embodied-AI software layer, and an even larger simulation-and-digital-twin adjacency. Those layers can support valuation narratives, but they cannot yet produce a clean Prague-specific SOM from public evidence alone.'
  claimRefs:
  - CM005
  - CM006
  - CM007
  - CM008
