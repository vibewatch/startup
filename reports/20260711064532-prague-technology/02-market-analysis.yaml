- id: drivers-policy-tailwinds
  title: Growth drivers, policy support, and ecosystem tailwinds
  body: 'Several forces make the market newly credible in 2026. DeepMind''s Genie program and NVIDIA''s Cosmos show that frontier labs and infrastructure incumbents are investing directly in world-model and physical-AI stacks. The simulation survey and open frameworks such as MuJoCo, Isaac Sim, robosuite, and Infinigen show that the tooling layer around embodied AI is maturing rather than remaining a lab curiosity. On the budget side, Gartner still sees strong worldwide AI spending growth, while IDC argues China is becoming a defining arena for agentic AI competition. China''s own policy direction is also unusually relevant to Prague: the May 2026 AI-agent guidance and the humanoid-robot/embodied-intelligence standard push both signal that regulators want this category to grow, provided it grows inside formal governance rails. That combination of technical validation, ecosystem tooling, and state-backed standards is what turns Prague''s market from pure concept into a credible venture category.'
  claimRefs:
  - CM017
  - CM018
  - CM019
  - CM020
  - CM021
  - CM024
  - CM025
  - CM026
  - CM027
  - CM036
- id: constraints-and-diligence
  title: Constraints, contradictions, and why Prague-specific demand is still under-evidenced
  body: The same evidence that supports the category also identifies the reasons investors should avoid over-precision. Sim-to-real transfer remains difficult, safety benchmarks are not standardized, and ROI models for world-model platforms remain immature. Regulatory support in China is real, but it arrives alongside filing and labeling obligations. Most importantly, compute remains geopolitically exposed. BIS export-control updates and CNBC's reporting on Nvidia shipment restrictions illustrate how rapidly supply assumptions can change for Chinese frontier AI labs. These constraints do not make Prague's market unattractive; they make it timing-sensitive. The core diligence problem is not whether embodied intelligence matters—it almost certainly does—but whether Prague can convert an early, policy-shaped, compute-constrained market into repeatable customer demand before better-capitalized rivals do. That is why later chapters should treat broad TAM optimism as supportive context, not as
    proof that Prague has already found a commercial lane.
