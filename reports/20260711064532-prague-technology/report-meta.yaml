companyProfile:
  summary: Prague Technology is a founder-led Shanghai AI lab pursuing world models and embodied intelligence rather than another general-purpose LLM. Public evidence supports a roughly $220M first round at a $2B valuation in June 2026 from HongShan, Gaorong, and Tencent, but it also shows a company with no launched product, no disclosed revenue, no named customers, and limited primary-company disclosure. The core investment thesis is that Lin Junyang can carry Qwen-era frontier-model credibility into a less-settled physical-AI category before the market consolidates.
