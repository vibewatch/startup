- id: infrastructure-stack
  title: Any serious Prague stack will need data, simulation, and deployment infrastructure
  body: Embodied intelligence is not a single model checkpoint. It is an operating system of components. Public frontier stacks make that clear. NVIDIA's GR00T reference robot unifies teleoperation, simulation, evaluation, deployment, and onboard compute; MuJoCo and Isaac Sim represent mature simulation substrates; Cosmos and Genie 2 show that world-model tooling is becoming a real layer of the ecosystem rather than a one-off research curiosity. This matters for Prague because it changes the interpretation of its roadmap. A company targeting world models for robots cannot succeed with only a foundation model and a website. It also needs demonstration capture, embodiment coverage, simulation loops, evaluation harnesses, and a path to deploy or partner on physical systems. The policy environment in China helps validate the category, but export controls complicate the compute side of the stack. Technically, then, Prague's central challenge is full-stack integration under constrained disclosure
    and likely constrained hardware access.
  claimRefs:
  - CE018
  - CE019
  - CE020
  - CE021
  - CE022
