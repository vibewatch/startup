- id: stage-gaps-roadmap
  title: Stage, roadmap, and missing proof
  body: 'The honest product conclusion is that Prague is still pre-proof. The company has a credible technical thesis and unusually strong founder-market fit for that thesis, but it has not yet shown the outside world what form its first artifact will take. The most plausible early surfaces are not finished humanoid robots. They are research outputs or platform layers: synthetic-data generation, virtual evaluation environments, model APIs, or partner-facing embodied foundation models. Qwen''s prior commercialization through Model Studio shows one route from research to enterprise access, but Prague has not yet exposed a comparable developer surface. No public evaluation method, trust-and-safety frame, model card, benchmark portal, or deployment boundary was reviewed for this chapter. That leaves a narrow but important conclusion. Prague does not yet have a visible product. It has a technically coherent roadmap hypothesis whose value depends on how quickly it can convert lineage into a Prague-native
    artifact others can test.'
