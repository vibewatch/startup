chapter:
  number: 3
  title: Competitors
  summary: 'Prague competes against a layered field: direct world-model startups such as World Labs and Physical Intelligence, incumbent frontier programs such as DeepMind, OpenAI, and NVIDIA, and Chinese model labs such as Zhipu, Moonshot, MiniMax, StepFun, DeepSeek, Qwen, ERNIE, and Doubao that dominate talent, capital, pricing, and distribution. Prague''s thesis is directionally differentiated, but public evidence still favors rivals on productization, channel strength, and benchmark proof.'
sections:
- id: landscape
  title: 'Landscape: direct peers, incumbents, adjacents, and substitutes'
  body: 'Prague does not compete in one clean product bucket. The direct-peer layer includes world-model and embodied-intelligence startups such as World Labs and Physical Intelligence, each of which has made its public product or technical thesis more legible than Prague. The incumbent frontier-lab layer includes DeepMind, OpenAI, and NVIDIA, which validate the strategic importance of world models while also setting a much higher bar on compute, ecosystem, and developer reach. The Chinese model-lab layer is different again: Zhipu, Moonshot, MiniMax, StepFun, DeepSeek, Qwen, ERNIE, and Doubao are not all building Prague-like world models, but they compete for capital, hiring, developer attention, and some enterprise AI budgets. The true substitute set is broader still. Advanced customers can assemble their own stack from open models, simulation frameworks, and internal engineering instead of committing to a single frontier startup vendor. That makes Prague''s competitive field unusually
    multi-layered and unforgiving.'
  claimRefs:
  - CP001
  - CP002
  - CP004
  - CP006
  - CP008
  - CP009
  - CP019
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: capability-packaging
  title: Capability, packaging, pricing, and where rivals are stronger today
  body: 'Public product surfaces suggest a split market rather than a winner-take-all race. World Labs has a named workflow in Marble. Physical Intelligence has a concrete robot-policy narrative. DeepMind and NVIDIA have broader ecosystem depth. The Chinese AI Tigers have public model, app, or platform surfaces, and several publish pricing or usage positioning that Prague cannot yet match. That matters because competitive buyers often reward packaging and workflow clarity before they reward abstract research prestige. The 2026 Chinese API price war further sharpens the issue: if Prague tried to compete as just another cheap model endpoint, better-distributed labs such as DeepSeek, Qwen, MiniMax, StepFun, Moonshot, ERNIE, or Doubao could likely compress the economics. Prague therefore needs a more specific value proposition than generic model access. The present public record does not yet show that proposition clearly. Another implication is organizational: the buyers most likely to evaluate
    Prague already have alternatives on the shelf, so the startup is competing against existing procurement comfort as much as against raw model quality.'
  claimRefs:
  - CP010
  - CP011
  - CP012
  - CP013
  - CP014
  - CP015
  - CP016
  - CP017
  - CP018
  - CP022
