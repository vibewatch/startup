- id: switching-multihoming-moat
  title: Switching cost, multi-homing, and what Prague's moat would need to be
  body: The market structure favors multi-homing. A technical buyer can use one vendor for foundation models, another for simulation or synthetic data, and a third for deployment tooling. Open-source or internal build remains a credible substitute for advanced teams, especially before deployment standards harden and before Prague has named customers with sticky workflows. That means switching costs are currently low to medium for Prague. Its strongest imaginable moat is not current distribution but a specific physical-AI insight—something in world modeling, control, or embodied training that actually performs better in customer workflows than open tools or better-capitalized incumbent stacks. Founder pedigree alone is insufficient. It can open doors and justify valuation, but it does not create lock-in. Until Prague shows benchmark, partner, or deployment proof that rivals do not already own, the moat remains more thesis than fact.
  claimRefs:
  - CP020
  - CP021
  - CP024
  - CP025
  - CP026
  - CP030
  - CP031
  - CP032
  tableRefs:
  - TP004
- id: adverse-evidence
  title: 'Adverse evidence: commoditization, incumbent response, and category volatility'
  body: 'The adverse competitive case is structural rather than personal. World models matter, but the category remains volatile and may standardize faster than Prague commercializes. Open tools and infrastructure vendors can commoditize large portions of the stack from below, while giants such as DeepMind, OpenAI, and NVIDIA can absorb valuable features into broader ecosystems from above. Inside China, the model price war and intense talent competition raise the bar further. Prague is competing not only with glamorous global labs but with richly funded domestic players that already have product surfaces and stronger channels. As a result, the current competitive read is cautious. Prague is directionally interesting and may be strategically right about physical AI, yet public evidence does not currently support treating it as a clear winner over the better-packaged, better-capitalized, or better-distributed alternatives. The next upgrade path is concrete: public benchmarks, product packaging,
    customer proof, and visible workflow adoption over time.'
  claimRefs:
  - CP027
  - CP028
  - CP029
  - CP033
  - CP034
  - CP035
  - CP036
