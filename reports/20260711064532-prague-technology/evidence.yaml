evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A complete board roster, cap-table ownership percentages, and investor rights documents.
    whyItMatters: >-
      The company raised a large round before launch, so control rights and board influence matter for every later
      diligence question.
    diligencePath: >-
      Request current cap table, board minutes summary, and term-sheet rights package from the company or lead
      investors.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: An as-of-date employee count plus core team roster by research, infra, and business functions.
    whyItMatters: Headcount is necessary to estimate burn, hiring velocity, and execution depth beyond Lin Junyang himself.
    diligencePath: >-
      Request org chart, current employee count, and active hiring plan; cross-check with payroll or benefits vendor
      extracts.
    relatedQuestionRefs:
      - QO020
  - type: missing-source
    severity: material
    topic: roadmap
    missingEvidence: >-
      A dated product roadmap covering world-model research milestones, developer surfaces, and expected
      commercialization sequence.
    whyItMatters: Without a roadmap, the valuation cannot be tied to concrete execution checkpoints or timing assumptions.
    diligencePath: >-
      Ask management for internal roadmap, compute plan, and first external pilot milestones; verify with investor
      materials.
    relatedQuestionRefs:
      - QO018
      - QO025
  - type: missing-source
