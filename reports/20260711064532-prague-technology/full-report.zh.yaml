        - label: 信心
          value: 2
          unit: ordinal / 5
          claimRefs:
            - CV026
            - CV027
    claimRefs:
      - CV001
      - CV010
      - CV026
      - CV027
  - id: FV003
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 投资建议来自一条简单链条：创始人资产强、当前证明弱、敏感性高，因此立场谨慎。
    data:
      nodes:
        - id: a
          label: 创始人稀缺性
        - id: b
          label: 初始估值高
        - id: c
          label: 当前经营证明低
        - id: d
          label: 估值区间宽
        - id: e
          label: 继续研究 / 跟踪
    claimRefs:
      - CV002
      - CV003
      - CV026
      - CV036
      - CV039
      - CV040
  - id: FV004
    title: 估值回报区间
    type: quadrant
    layout: standard
    summary: 只有在 Prague 迅速变得异常特殊的少数未来里，它才提供高上行空间。
    data:
      points:
        - label: 牛市
          x: 9
          'y': 8
          detail: 产物 + 合作伙伴 + 重估
        - label: 基准
          x: 6
          'y': 5
          detail: 证明不完整，争议延续
        - label: 熊市
          x: 3
          'y': 4
          detail: 叙事压缩
        - label: 终止情形
          x: 1
          'y': 2
          detail: 没有证明，也没有通向需求的路径
    approximationNotes: X 近似表示上行空间；y 近似表示当前证据集下的可信程度。
    claimRefs:
      - CV012
      - CV013
      - CV014
      - CV037
      - CV038
