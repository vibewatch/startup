      - number: '2.5'
        title: 约束、矛盾，以及 Prague 专属需求为何仍缺证据
        blocks:
          - type: paragraph
            body: >-
              支持这一品类的同一批证据，也指出了投资人应避免过度精确的原因。Sim-to-real 迁移仍然困难，安全基准尚未标准化，世界模型平台的 ROI
              模型也不成熟。中国的监管支持真实存在，但它伴随备案和标识义务而来。最重要的是，算力仍暴露在地缘政治之下。BIS 出口管制更新和 CNBC 关于 Nvidia 出货限制的报道显示，中国前沿 AI
              实验室的供应假设可以多快改变。这些约束并不会让 Prague 的市场失去吸引力；它们让市场变得高度受时点影响。尽调的核心问题不是具身智能是否重要——它几乎肯定重要——而是 Prague
              能否在资本更雄厚的对手之前，把一个早期、政策塑形、算力受限的市场转成可重复客户需求。因此，后续章节应把广义 TAM 乐观视为支撑性背景，而不是 Prague 已找到商业赛道的证明。
