              展示了这条路径较成熟的一端：一旦公司把开放模型基础设施规模化包装，客户密度和 bookings 可以快速上升。Reflection AI
              展示了更早的一端：如果投资人相信团队能抵达技术稀缺能力，即使首个前沿发布尚未出现，实验室仍可能获得重金支持。Prague
              比两者还早。因此，它当前的经济性是预期中的，不是已观察到的。公司是在购买时间寻找商业模式，而不是复利增长一个已验证业务。
