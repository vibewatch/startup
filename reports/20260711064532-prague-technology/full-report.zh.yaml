    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段与公开姿态
        blocks:
          - type: paragraph
            body: >-
              Prague Technology 更应被理解为一家创立初期的上海 AI 实验室，而不是产品公司。公开记录指向上海众擎科技有限公司及 Lin Junyang
              控制的相关上海主体，但公司几乎没有呈现商业软件创业公司通常应有的运营界面。pragmatics.ai
              域名可以访问，却没有给出有意义的产品、定价、客户或路线图说明。这一点很关键，因为公司依然在首次公开披露的融资中达到据称 20 亿美元估值。证据能支撑的最干净一句话是：一家新成立的上海研究实验室，围绕 Lin
              Junyang 在 Qwen 建立的声誉，押注世界模型和具身智能，同时仍处于产品前、收入前阶段。后续章节应保留这个区分，不能把 Prague 拉平成一家按普通发布指标推进的种子期软件公司。
