      - number: '1.2'
        title: 创始人与市场匹配，以及 Qwen 谱系
        blocks:
          - type: paragraph
            body: >-
              创始人故事是核心资产。Lin Junyang 给 Prague 带来的价值，不是泛泛的「前大厂」履历，而是在 Alibaba Qwen 项目中的具体记录：2019 年加入 DAMO，2022 年末成为 Qwen
              的技术重心，并参与一系列多语言和多模态模型发布，这让他在中国开放模型生态中获得了少见的可信度。Qwen 官方材料解释了这份声誉为什么重要。Qwen2 扩展到多个尺寸和更长上下文，Qwen2.5
              拓宽模型家族，Qwen3 时代材料进一步转向推理加行动的叙事。相邻研究谱系同样重要。Lin 的名字出现在 M6、OFA 和 Chinese-CLIP
              相关工作中，这有助于解释投资人为什么把他视为从语言模型走向更广义世界模型和具身智能的可信桥梁。因此，Prague 获得融资，并非因为它是一具空壳，而是因为它像是由创始人主导、延续既有前沿模型职业生涯的一次新下注。
