companyProfile:
  summary: >-
    Prague Technology 是一家由创始人主导的上海 AI 实验室，押注世界模型和具身智能，而不是再做一个通用 LLM。公开证据支持这样一个事实：2026 年 6 月，公司以 20 亿美元估值完成约 $220M
    首轮融资，投资方包括 HongShan、Gaorong 和 Tencent；但证据同样显示，公司没有已发布产品、未披露收入、没有具名客户，来自公司本身的一手披露也有限。核心投资命题是：Lin Junyang 能否把 Qwen
    时代的前沿模型信誉带入一个格局尚未稳定的物理 AI 品类，并赶在市场整合前站住位置。
