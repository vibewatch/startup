  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界，以及 Prague 实际卖向哪里
        blocks:
          - type: paragraph
            body: >-
              Prague 不是进入通用聊天机器人市场。公开报道中的世界模型和具身智能方向，把它放进了 AI
              中更窄但战略重要的一层：帮助机器建模物理环境、规划动作，并安全地从仿真走向真实世界行为的软件。这条边界很重要，因为公开市场估算会随口径巨大波动：只计算纯世界模型软件、纳入更广 AI-in-robotics
              栈，或进一步扩展到围绕物理系统的数字孪生和仿真经济，数字都不同。尽调用的最清晰边界应包括世界模型训练、具身 AI 控制栈、仿真环境、合成数据工具，以及物理系统部署基础设施；排除硬件 BOM、通用消费者聊天和无关
              AI 应用品类。这个框架也澄清了现状：买家仍可以依赖传统机器人软件、定制仿真流水线或未接地的 LLM，而不是采用 Prague 这类方案。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM021
