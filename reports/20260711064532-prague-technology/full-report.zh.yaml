      - number: '2.2'
        title: 规模测算口径，以及估算为何分化
        blocks:
          - type: paragraph
            body: >-
              公开规模测算支持 Prague 正在追逐一个有意义的市场，但不能给出虚假的精确度。Kaiso 专门的世界模型口径有用，因为它直接承认了这一品类，但它很可能只覆盖一个正在形成的小核心。Grand View 的
              AI-in-robotics 口径，以及更广的仿真或数字孪生预测要大得多，但它们是相邻品类，不是直接 SAM。中国生成式 AI 增长预测和 IDC 的 agentic-future
              框架提供了有利宏观背景，却没有说明其中多少支出会具体流向世界模型。实际结论是，Prague 的可服务市场应分层建模：狭义世界模型核心、更大的具身 AI
              软件层，以及更大的仿真和数字孪生邻接市场。这些层次能支撑估值叙事，但仅靠公开证据，还无法给出干净的 Prague 专属 SOM。
