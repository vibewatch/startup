            body: >-
              前沿具身 AI 不只技术难，治理负担也重。Prague 同时面对中国生成式 AI 规则、备案预期和 AI agent
              治理信号，也面对美国对先进芯片的出口管制压力。这些不是彼此分离的问题，而是会相互作用。算力短缺或采购摩擦会放慢技术进展；技术进展放慢会推迟产物；产物推迟会让融资更脆弱。在部署侧，具身系统带来安全、监控和
              sim-to-real 可靠性问题，纯软件团队可以把这些问题往后放更久。NIST 的风险管理框架提醒我们，即便实验室跑得很快，可信部署仍需要治理、测试和控制。公开层面，Prague
              尚未展示它将如何处理这些负担。因此，本章把监管和运营风险视为当前状态下正在发生的问题，而不只是未来规模化问题。
