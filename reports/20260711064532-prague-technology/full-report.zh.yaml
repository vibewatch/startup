        - label: 核心风险簇
          value: 3
          unit: people/compute/proof
          claimRefs:
            - CR001
            - CR008
            - CR022
        - label: 当前信心
          value: 2
          unit: ordinal / 5
          claimRefs:
            - CR034
            - CR036
    claimRefs:
