      - number: '2.4'
        title: 增长驱动、政策支持与生态顺风
        blocks:
          - type: paragraph
            body: >-
              多股力量让这个市场在 2026 年新近变得可信。DeepMind 的 Genie 项目和 NVIDIA 的 Cosmos 表明，前沿实验室和基础设施巨头正直接投资世界模型和物理 AI 栈。仿真综述以及
              MuJoCo、Isaac Sim、robosuite、Infinigen 等开放框架显示，具身 AI 周边工具层正在成熟，不再只是实验室奇观。预算侧，Gartner 仍预计全球 AI 支出强劲增长，IDC
              则认为中国正成为 agentic AI 竞争的定义性战场。中国自身政策方向也与 Prague 异常相关：2026 年 5 月 AI agent 指导意见，以及人形机器人 /
              具身智能标准推进，都在释放监管希望该品类增长的信号，前提是增长要落在正式治理轨道内。技术验证、生态工具和国家支持标准叠加，才把 Prague 的市场从纯概念推成一个可信的风险投资品类。
            claimRefs:
              - CM017
