      - number: '8.4'
        title: 建议：跟踪、继续研究，并设置明确放弃触发器
        blocks:
          - type: paragraph
            body: >-
              因此，合适的投资态度既不是把 Prague 当成明显便宜而直接放行，也不是把它判为明显不可能。 更干净的结论是：估值被拉长，但并非不合逻辑。Prague 今天很贵，因为当前证据太少，不足以支持更高置信度的背书；
              但在市场语境里，一轮由创始人驱动、估值 $2 billion 的 AI 融资也说得通。可执行姿态很窄： 把公司放进密切观察名单，要求明确证据后再上调估值，并在下一轮融资周期前定义放弃触发器。
              最重要的尽调问题很简单。Prague 第一个原生成果是什么？背后的算力和数据路径是什么？第一个真实合作伙伴或试点是谁？ 安全与治理控制有哪些？这些答案具体之前，估值置信度应保持低位，建议也应维持在继续研究 /
              跟踪，而不是直接买入故事。 投资人应坚持按里程碑重新承销，而不是跟着情绪漂移。
