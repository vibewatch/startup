      - number: '2.3'
        title: 买家、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              最可能的早期买家不是大众消费者，而是已经为物理 AI 实验付费的技术型组织。机器人
              OEM、人形机器人创业公司、工业自动化集团、汽车或边缘设备团队、云模型平台和企业研究实验室都符合这一模式。在这些账户里，用户通常是 ML 研究员、机器人工程师、仿真开发者和 AI 基础设施团队；付费方通常是
              R&D、CTO 或平台预算。采用通常从仿真或离线研究中的窄 pilots 开始，再进入安全和失败成本可控的受限物理部署，之后才扩展到更广的自动化或机器人 fleet。这条路径对 Prague
              很重要，因为它意味着漫长的收入前周期和很高的证明要求：即便品类令人兴奋，预算也不会从 demo 立刻转成部署。
