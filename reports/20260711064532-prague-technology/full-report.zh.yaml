      - number: '1.4'
        title: 里程碑与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Prague 的时间线很短，但已足够连贯，可为后续章节提供锚点。前史从 Lin 2019 年进入 DAMO 开始，到他在 2022 年末左右进入 Qwen 领导核心，再到 2023 至 2025 年 Qwen
              的官方技术里程碑。这一序列重要，因为它解释了投资人为何把 Prague 视为真实前沿工作的延续，而不是只有履历的故事。Prague 本身的即时节奏则急剧压缩：公开报道称，Lin 于 2025 年末在
              Alibaba 内部组织具身智能工作，2026 年 3 月初卸任 Qwen，2026 年 5 月以据称 20 亿美元融资计划浮出水面，并在 6 月中旬完成 $220M
              融资。公开工商登记类来源也显示，与这一窗口相匹配的一组上海注册主体。结果是，从创始人离职到数十亿美元估值，实验室只用了大约一个季度，上海则是明确的运营基地。
