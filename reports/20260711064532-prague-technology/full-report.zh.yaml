  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接同行、巨头、邻接玩家与替代方案
        blocks:
          - type: paragraph
            body: >-
              Prague 并不在一个清晰的产品桶里竞争。直接同行层包括 World Labs 和 Physical Intelligence 等世界模型和具身智能创业公司，它们已经把公开产品或技术命题讲得比 Prague
              更清楚。前沿实验室巨头层包括 DeepMind、OpenAI 和
              NVIDIA，它们验证了世界模型的战略重要性，同时也把算力、生态和开发者触达门槛抬得更高。中国模型实验室层又不同：Zhipu、Moonshot、MiniMax、StepFun、DeepSeek、Qwen、ERNIE
              和 Doubao 未必都在构建 Prague 式世界模型，但它们争夺资本、招聘、开发者注意力和部分企业 AI
              预算。真正的替代集合还要更广。高级客户可以用开放模型、仿真框架和内部工程自己拼栈，而不是承诺采用单一前沿创业供应商。这让 Prague 的竞争场异常多层，也异常残酷。
