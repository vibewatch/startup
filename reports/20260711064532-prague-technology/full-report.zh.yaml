      - number: '1.3'
        title: 融资、投资方，以及为什么 20 亿美元估值来得这么早
        blocks:
          - type: paragraph
            body: >-
              公开报道汇聚到一个异常融资事实：Prague 2026 年 6 月首次披露的轮次据称总额约 $220M，HongShan 和 Gaorong 各投约 $100M，Tencent 追加约 $20M，投后估值约 20
              亿美元。这一轮值得注意，不是因为它跟在产品发布或可量化商业化里程碑之后，而恰恰因为没有。多个来源反复描述的是一家没有已宣布产品、未披露收入、也没有成熟网站的公司。因此，这笔融资本质上是声誉加命题交易。投资人实际上在承销
              Lin Junyang 把 Qwen 时代模型领导力转化为新前沿品类的能力，并赌在中国尚未有人建成主导性世界模型实验室之前抢占位置。报道还称，公司在首轮刚关闭后就已试探新一轮融资，这进一步说明 Prague
              进入市场时更像一个高溢价人才资产，而不是按常规 traction 节点推进的传统创业公司。
            claimRefs:
