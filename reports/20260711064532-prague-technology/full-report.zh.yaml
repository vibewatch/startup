            body: >-
              Prague 一开始就带着一个悖论。创始人是资产，创始人依赖也是风险。Lin Junyang 的 Qwen 履历，是投资人从一开始认真对待 Prague
              的核心原因；但这也意味着实验室仍在成形时，组织冗余空间很小。公开记录还没有显示宽厚的领导层、成熟产品组织，或能脱离 Lin 声誉独立评估的已发布产物。他在 2026 年初突然离开
              Qwen，进一步强化了一个现实：Prague 当前可投资性高度绑定于一个人，以及他能否快速招募、对齐并留住世界级团队的能力。普通种子期创业公司有时可以把执行噪音藏在产品迭代后面。Prague 不能。在 20
              亿美元估值且没有公开产品的情况下，每个月没有证明，都会让人和执行风险更可见，而不是更不显眼。
