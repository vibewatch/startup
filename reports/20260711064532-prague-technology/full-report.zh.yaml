  - id: FR001
    title: 当前风险热力图
    type: quadrant
    layout: standard
    summary: 当前最热的风险集中在执行、算力获取和证明转化，而不是成熟经营指标。
    data:
      points:
        - label: 创始人集中度
          x: 9
          'y': 8
          detail: 高严重度，近期风险
        - label: 无公开产物
          x: 9
          'y': 9
          detail: 高严重度，立即风险
        - label: 芯片管制
          x: 8
          'y': 7
          detail: 外部因素，但影响重大
        - label: 人才竞争
          x: 7
          'y': 7
          detail: 持续存在，且难以对冲
        - label: 客户证明缺口
          x: 8
          'y': 8
          detail: 商业脆弱性
    approximationNotes: X 近似表示严重度；y 近似表示紧迫性。
    claimRefs:
      - CR001
      - CR002
      - CR008
      - CR017
      - CR022
  - id: FR002
    title: 风险传导图
    type: flow
    layout: wide
    summary: 监管和算力冲击可能连锁传导到产品、融资和客户风险。
    data:
      nodes:
        - id: a
          label: 芯片管制 / 合规摩擦
        - id: b
          label: 训练和产品证明放慢
        - id: c
          label: 融资叙事变弱
        - id: d
          label: 合作伙伴或客户证明延迟
        - id: e
          label: 集中度和脆弱性上升
    claimRefs:
      - CR008
      - CR009
      - CR010
      - CR022
      - CR023
      - CR027
      - CR028
  - id: FR003
    title: Prague 依赖图
    type: bar
    layout: standard
    summary: Prague 最重度依赖少数不可替代投入：创始人领导力、算力，以及能产出证明的合作伙伴。
    data:
      items:
        - label: 创始人连续性
          value: 5
          unit: ordinal
        - label: 算力获取
          value: 5
          unit: ordinal
        - label: 招聘
          value: 4
          unit: ordinal
        - label: 首个外部证明
          value: 5
          unit: ordinal
    approximationNotes: 序数值反映依赖关键性，而不只是概率。
    claimRefs:
      - CR002
      - CR017
      - CR020
      - CR028
      - CR033
  - id: FR004
    title: 缓释杠杆点
    type: kpi
    layout: standard
    summary: 少数几个里程碑会不成比例地降低 Prague 当前风险负担。
    data:
      items:
