      - CR033
      - CR034
      - CR036
  - id: FV001
    title: 估值敏感性
    type: bar
    layout: standard
    summary: Prague 估值高度取决于证明能否在市场情绪冷却前出现。
    data:
      items:
        - label: 创始人稀缺性
          value: 5
          unit: ordinal
        - label: 产物证明
          value: 5
          unit: ordinal
        - label: 合作伙伴证明
          value: 4
          unit: ordinal
        - label: 市场倍数支撑
          value: 3
          unit: ordinal
    approximationNotes: 序数值表示对敏感性的贡献，而不是独立估值权重。
    claimRefs:
      - CV011
      - CV015
      - CV016
      - CV028
      - CV029
  - id: FV002
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Prague 的头部数字是融资数字，不是经营数字。
    data:
      items:
        - label: 估值
          value: 2000
          unit: USD M
          claimRefs:
            - CV001
        - label: 已融资
          value: 220
          unit: USD M
          claimRefs:
            - CV001
        - label: 收入
          value: 0
          unit: publicly disclosed USD M
          claimRefs:
            - CV001
