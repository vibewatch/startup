      - number: '1.5'
        title: 负面信号与披露缺口
        blocks:
          - type: paragraph
            body: >-
              最重要的负面观察不是丑闻，而是缺席。Prague 已为一家仍不披露员工数、客户、路线图、董事会结构或收入基础的公司筹得异常大额资本。创始人叙事很强，但同一叙事也制造了集中风险：Lin
              既是这一轮发生的原因，也是支撑这一轮的主要依赖项。他在 2026 年 3 月突然离开 Qwen，又增加了一层警示，因为这说明 Prague
              的可投资性有多大程度取决于某一位技术领导者能否持续在位。还有更结构性的担忧。公司有意避开最拥挤的通用 LLM
              赛道，但这意味着它进入了一个商业验证更少的品类，从世界模型研究走向可重复收入的路径仍不清楚。因此，本章将 Prague
              的概览视为可信但不完整：一家正在成形的严肃前沿实验室，融资基于创始人质量和品类雄心，几乎所有运营指标仍未解决。
