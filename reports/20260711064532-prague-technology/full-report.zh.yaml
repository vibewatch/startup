            body: >-
              Prague 仍处在收入前阶段，估值敏感度本质上就是叙事敏感度。公司如果发布差异化成果、公布有分量的合作伙伴，或从高信念投资人那里拿到更大一轮跟投，
              当前价格就可能只是激进而已。如果这些证据延后，而大盘又转向更硬的基本面，同一个价格会很快显得脆弱。 因此，牛市 / 基准 / 熊市框架比精确计算更重要。牛市情形下，Prague 成为中国公认的物理 AI
              领导者，技术证据足以支撑再次重估。 基准情形下，市场兴趣延续，但证据仍不完整，只有能接受低可见度的投资人会投。熊市情形下，证据无法转化，创始人溢价定价迅速压缩。
              三种情形里，当前价格都高度押注少数事件，而不是平滑的经营曲线。
            claimRefs:
