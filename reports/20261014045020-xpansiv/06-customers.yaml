chapter:
  number: 6
  title: "Customers"
  summary: "Xpansiv operates essential market infrastructure connecting over 125,000 distributed solar customers, 4,000 participating companies across international registries, and 15 GW of wholesale power resources, though voluntary carbon market contractions and undisclosed retention metrics present commercial diligence uncertainties."
sections:
  - id: "sec-customer-segmentation"
    title: "Customer Base Segmentation and Market Reach"
    body: "Xpansiv's customer and market participant base spans four distinct commercial and operational segments across global environmental and energy commodity markets. In compliance power and utility markets, electric utilities and clean energy producers rely on Xpansiv's North American Renewables Registry (NAR) and APX power systems for regulatory compliance and attribute issuance. In corporate sustainability markets, global enterprises and multinational corporations procure voluntary carbon offsets and International Renewable Energy Certificates (I-RECs) to satisfy ESG disclosure and emissions reduction frameworks. In distributed generation, Xpansiv Managed Solutions (formerly SRECTrade) provides administrative infrastructure to more than 125,000 residential and commercial solar owners managing approximately 2 GW of distributed capacity. Finally, in wholesale power and storage operations, independent power producers utilize Xpansiv Power across major U.S. independent system operators. While Xpansiv reports broad participant counts, consolidated revenue contribution and contract distribution across these four segments remain private."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU001"
  - id: "sec-adoption-trajectory"
    title: "Adoption Trajectory and Platform Utilization Scale"
    body: "Xpansiv demonstrates substantial transaction and transfer volume across its integrated software and exchange platforms, though adoption intensity varies widely by commodity class. The core Xpansiv Connect integration hub connects 16 environmental commodity registries and records approximately one billion asset transfers annually, with over 3.6 billion cumulative assets transferred since 2020. In renewable energy markets, Xpansiv's owned REC registries issued 31% of all renewable certificates globally in 2024, bolstered by the strategic acquisition of Evident Group, which expanded the network to over 300 GW of generation capacity and 4,000 participating organizations. On the spot execution front, CBL has transacted more than 330 million carbon credits and 14 million renewable energy certificates since 2020. Concurrently, Evolution Markets has executed over $800 billion in notional structured brokerage transactions. However, Xpansiv does not publish active daily user counts, repeat transaction rates, or volume breakdowns by counterparty tier."
    claimRefs:
      - "CU002"
      - "CU004"
      - "CU006"
      - "CU007"
      - "CU012"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "sec-named-customer-proof"
    title: "Named Enterprise Proof and Production Deployments"
    body: "Verified customer evidence confirms production-grade adoption among major energy producers, global trading houses, and financial market operators. In October 2025, Constellation Energy (Nasdaq: CEG), the largest producer of clean, reliable energy in the United States, announced a commercial initiative to offer annual emission-free energy certificates (EFECs) from its PJM nuclear and clean energy centers directly on CBL, with full-lifecycle issuance and tracking through Xpansiv's NAR registry starting December 2025. In commodity trading and financial data, global commodity merchant Trafigura executes transactions on CBL while MSCI integrates Xpansiv market data and analytics into carbon market assessment workflows. Furthermore, Evident's international registry network encompasses over 4,000 corporate participants purchasing and redeeming I-REC certificates across more than 60 countries. While these high-profile relationships validate technical capability and institutional trust, bilateral transaction volumes and revenue sharing terms remain confidential."
    claimRefs:
      - "CU005"
      - "CU008"
      - "CU009"
    tableRefs:
      - "TU003"
  - id: "sec-retention-concentration"
    title: "Retention Durability, Market Headwinds, and Concentration Risks"
    body: "Evaluating customer retention and revenue durability requires balancing robust registry infrastructure lock-in against severe external headwinds in voluntary carbon markets. Independent research by Ecosystem Marketplace indicates that voluntary carbon market transaction volumes dropped 25% in 2024 to their lowest level since 2018, while Reuters reports average spot prices declined by 20% amid persistent integrity concerns. This contraction directly impacts transactional liquidity and exchange fees on CBL, even as compliance REC issuances remain comparatively resilient. Structurally, Xpansiv faces potential concentration risks tied to dominant energy brokerage counterparties and major independent system operator integrations. Critically, Xpansiv does not publish standard SaaS durability metrics, including net revenue retention (NRR), gross retention rate (GRR), customer cohort churn, or top-customer revenue concentration, leaving platform stickiness as a central diligence unknown."
    claimRefs:
      - "CU010"
      - "CU011"
      - "CU013"
      - "CU014"
