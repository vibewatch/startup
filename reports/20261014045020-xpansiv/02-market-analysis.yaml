figures:
  - id: FM001
    title: Non-Additive Market Scale and Adoption Lenses
    type: pyramid
    summary: >-
      Six source-backed indicators show market activity, operating footprint, forecast demand, current carbon-market scale,
      and a customer ROI example without presenting them as TAM, SAM, and SOM.
    data:
      items:
        - label: Xpansiv-facilitated annual commodity and derivative movement
          value: 200
          unit: $B+
          detail: Company-reported gross notional flow; not revenue or TAM
          tone: neutral
        - label: Renewable generation capacity supported by Xpansiv registries
          value: 320
          unit: GW+
          detail: Company-issued 2026 disclosure covering more than 60 countries
          tone: neutral
        - label: Share of global 2025 REC issuance managed on Xpansiv registries
          value: 28
          unit: '%'
          detail: Company-issued operating share; not a revenue share
          tone: neutral
        - label: Carbon-credit market forecast for 2030
          value: 50
          unit: $B+
          detail: TSVCM estimate cited by Reuters Plus
          tone: neutral
        - label: Reported global carbon-credit market in 2024
          value: 1.4
          unit: $B
          detail: Reuters Plus reported flat retirements and a 20% average spot-price decline
          tone: risk
        - label: Procurement-cost reduction in one company case
          value: 12
          unit: '%'
          detail: Xpansiv-reported Fortune 100 energy-company example with undisclosed baseline
          tone: positive
    approximationNotes: >-
      Values retain unlike units and denominators and are not additive or proportional pyramid layers. The $50B forecast,
      $1.4B reported market, $200B platform notional, 320 GW capacity, 28% issuance share, and 12% case result are separate lenses.
    claimRefs:
      - CM007
      - CM008
      - CM009
      - CM010
      - CM014
callouts:
  - calloutType: insight
    title: Infrastructure Exposure Is Broader Than Voluntary Carbon
    body: >-
      Xpansiv's product scope includes renewable certificates, power, clean fuels, water, registries, execution, portfolio
      software, and data. That breadth reduces dependence on any single voluntary-carbon demand forecast, but product-level
      revenue exposure remains undisclosed.
    claimRefs:
      - CM001
      - CM002
      - CM003
  - calloutType: risk
    title: Market Activity Does Not Establish Monetizable Share
    body: >-
      Large notional flow, connected capacity, and certificate issuance can indicate infrastructure relevance, but without
      fee schedules, take rates, segment revenue, and retention data they cannot support a precise SAM, SOM, or valuation multiple.
    claimRefs:
      - CM006
      - CM007
      - CM008
