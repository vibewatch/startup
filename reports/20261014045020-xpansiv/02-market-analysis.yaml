  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: segment-revenue-and-market-capture
      missingEvidence: >-
        Audited revenue by registries, exchange, execution, power, managed solutions, portfolio software, and data; fee schedules;
        take rates; recurring mix; customer concentration; renewal rates; and segment margins.
      whyItMatters: >-
        Without monetization and retention evidence, commodity notional, registered capacity, and certificate volume cannot
        be converted into defensible TAM, SAM, SOM, revenue share, or valuation support.
      diligencePath: >-
        Request audited segment financials, cohort retention, pricing schedules, volume-to-revenue bridges, and management's
        bottoms-up market model with denominator definitions.
      relatedQuestionRefs:
        - QM009
      relatedTableRefs:
        - TM002
    - type: missing-source
      severity: material
      topic: buyer-budget-and-procurement
      missingEvidence: >-
        Independent evidence identifying contract owners, budget lines, procurement cycles, implementation costs, and realized
        ROI across multiple named customers.
      whyItMatters: >-
        Product-page personas and one anonymous cost-reduction example do not establish repeatable willingness to pay or sales-cycle
        duration.
      diligencePath: >-
        Review customer contracts and renewal cohorts, then interview named utility, trading, sustainability, and registry
        customers about budget ownership and measured outcomes.
      relatedQuestionRefs:
        - QM004
