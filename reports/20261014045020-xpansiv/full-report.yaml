              - CE010
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Technical and Market-Integrity Risks
        blocks:
          - type: paragraph
            body: >-
              The platform's value depends on reliable external registries and on confidence in the environmental assets
              represented by those systems. MSCI says integrity standards are rising while delivery delays and
              governance gaps continue to reshape carbon-credit markets, based on ratings coverage of more than 4,400
              registered projects and nearly 250 pipeline projects. Reuters Plus describes the voluntary market as
              fragmented and lacking uniform global standards, and Climate Focus says regulatory uncertainty and
              integrity concerns affected 2024 demand. These sources do not document an Xpansiv outage or control
              failure. They do show that product quality cannot be assessed only as software availability: changing
              methodologies, registry rules, and asset-quality judgments can alter which instruments remain usable,
              liquid, or acceptable to buyers.
            claimRefs:
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is the clearest product advantage
            body: >-
              The retained evidence supports a broad operating surface across registries, portfolio management, spot
              exchange activity, broker indications, wholesale-power operations, and market-data delivery.
            calloutType: strength
            claimRefs:
              - CE001
              - CE006
              - CE008
              - CE009
              - CE010
          - type: callout
            title: Control claims lack independent technical verification
            body: >-
              Xpansiv describes security and audit controls, but the assigned evidence includes no SOC report, uptime
              history, incident record, independent benchmark, or public developer adoption signal.
            calloutType: risk
            claimRefs:
              - CE004
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Market Reach
        blocks:
          - type: paragraph
            body: >-
              Xpansiv's customer and market participant base spans four distinct commercial and operational segments
              across global environmental and energy commodity markets. In compliance power and utility markets,
              electric utilities and clean energy producers rely on Xpansiv's North American Renewables Registry (NAR)
              and APX power systems for regulatory compliance and attribute issuance. In corporate sustainability
              markets, global enterprises and multinational corporations procure voluntary carbon offsets and
              International Renewable Energy Certificates (I-RECs) to satisfy ESG disclosure and emissions reduction
              frameworks. In distributed generation, Xpansiv Managed Solutions (formerly SRECTrade) provides
              administrative infrastructure to more than 125,000 residential and commercial solar owners managing
              approximately 2 GW of distributed capacity. Finally, in wholesale power and storage operations,
              independent power producers utilize Xpansiv Power across major U.S. independent system operators. While
              Xpansiv reports broad participant counts, consolidated revenue contribution and contract distribution
              across these four segments remain private.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
      - number: '6.2'
        title: Adoption Trajectory and Platform Utilization Scale
        blocks:
          - type: paragraph
            body: >-
              Xpansiv demonstrates substantial transaction and transfer volume across its integrated software and
              exchange platforms, though adoption intensity varies widely by commodity class. The core Xpansiv Connect
              integration hub connects 16 environmental commodity registries and records approximately one billion asset
              transfers annually, with over 3.6 billion cumulative assets transferred since 2020. In renewable energy
              markets, Xpansiv's owned REC registries issued 31% of all renewable certificates globally in 2024,
              bolstered by the strategic acquisition of Evident Group, which expanded the network to over 300 GW of
              generation capacity and 4,000 participating organizations. On the spot execution front, CBL has transacted
              more than 330 million carbon credits and 14 million renewable energy certificates since 2020.
              Concurrently, Evolution Markets has executed over $800 billion in notional structured brokerage
              transactions. However, Xpansiv does not publish active daily user counts, repeat transaction rates, or
              volume breakdowns by counterparty tier.
            claimRefs:
              - CU002
              - CU004
              - CU006
              - CU007
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU005
              - CU006
              - CU007
          - type: figure
            figureRef: FU001
            claimRefs:
