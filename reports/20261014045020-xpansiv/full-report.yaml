              - CE010
      - number: '5.3'
        title: Architecture, Integrations, and Controls
        blocks:
          - type: paragraph
            body: >-
              Public materials support an operating-layer map, not a detailed internal software architecture. Xpansiv
              describes Connect as cloud-native and SOC 2 certified, with token authentication, role-based permissions,
              encrypted transmission, and transaction audit logs; these are company claims, and the supplied pool
              contains neither the SOC report nor an independent penetration or availability assessment. Xpansiv Data is
              distributed through APIs, SFTP, cloud warehouses, and a secure portal. The May 2026 Enverus integration
              adds a concrete partner-validated distribution path by combining CBL exchange transactions with Evolution
              Markets forward indications inside MarketView. Together, the sources support a
              registry-to-workflow-to-execution-to-data operating model, while leaving the underlying services, data
              model, recovery design, and connector maintenance process undisclosed.
            claimRefs:
              - CE004
              - CE005
              - CE010
              - CE011
