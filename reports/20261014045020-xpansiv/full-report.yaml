              - CR013
              - CR014
      - number: '7.2'
        title: Operational resilience and integration risk
        blocks:
          - type: paragraph
            body: >-
              Xpansiv presents Connect as a high-throughput integration layer spanning registries, exchanges, reporting
              systems, and internal enterprise tools. Company materials say the system transfers about one billion
              assets annually, uses SOC 2-certified cloud infrastructure, and offers authentication, encryption, audit
              logs, and API connectivity. These controls reduce manual-processing and reconciliation risk, but their
              company-issued nature does not independently establish availability, recovery performance, or incident
              history. The decision to bring acquired businesses under one brand also raises execution complexity across
              registry, trading, brokerage, power, and data workflows. A material outage, reconciliation error, or
              delayed integration could affect several products at once; public assigned evidence does not quantify
              service-level performance or demonstrate that every acquired platform shares the same control environment.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
