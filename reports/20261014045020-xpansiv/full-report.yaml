chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Market-Infrastructure Role
        blocks:
          - type: paragraph
            body: >-
              Xpansiv operates as the premier global market infrastructure platform for environmental and energy
              transition commodities. Rather than acting merely as a localized brokerage or single-asset exchange,
              Xpansiv has assembled a comprehensive multi-asset operating stack that spans certificate registries, spot
              exchange execution, wholesale power software, and digital portfolio management. Headquartered in San
              Francisco with major operating hubs in Albuquerque, Seattle, and Sydney, the company serves over 100,000
              corporate, governmental, utility, and retail participants worldwide. Its technological core facilitates
              the issuance, trading, and retirement of renewable energy certificates, carbon offsets, clean fuels, and
              water attributes across five continents, positioning the business as a vital conduit for corporate
              net-zero compliance.
            claimRefs:
              - CO001
              - CO002
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO007
              - CO009
              - CO014
      - number: '1.2'
        title: Executive Leadership and Organizational Governance
        blocks:
          - type: paragraph
            body: >-
              Xpansiv is led by Chief Executive Officer John Melby, an experienced environmental commodities and power
              markets executive who oversaw the integration of APX, Evolution Markets, and Evident into a unified
              operational platform. Melby's strategic focus centers on platform convergence, standardizing disparate
              regional environmental registries into an interconnected transaction network. Commercial strategy is
              directed by Chief Commercial Officer Ben Stuart, who spearheads global institutional partnerships,
              international market data distribution, and cross-border exchange integrations such as the Tokyo-based
              enechain and JCEX initiative. Governance is heavily influenced by major institutional financial sponsors
              and specialized growth equity partners, including Verdane, ensuring continuity across disciplined
              acquisition execution.
            claimRefs:
              - CO005
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
      - number: '1.3'
        title: Capitalization Structure and Investor Syndicate
        blocks:
          - type: paragraph
            body: >-
              Xpansiv is backed by a syndicate of tier-one institutional investors, global investment banks, and
              strategic energy corporations. Lead institutional sponsors include Blackstone Group, alongside strategic
              balance-sheet investors such as Bank of America, Goldman Sachs, Macquarie Group, Aramco Ventures, S&P
              Global Ventures, BP Ventures, Aware Super, and the Australian Clean Energy Finance Corporation. In
              September 2026, European growth buyout specialist Verdane led a major strategic capital raise designed to
              accelerate Xpansiv's international acquisition program. While this elite backing underscores confidence in
              Xpansiv's infrastructure moats, the company maintains private financial opacity, leaving post-money
              valuation multiples, liquidity preferences, and segment profitability undisclosed.
            claimRefs:
              - CO003
              - CO007
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO007
      - number: '1.4'
        title: Platform Milestones, Integrations, and Integrity Challenges
        blocks:
          - type: paragraph
            body: >-
              Over the past four years, Xpansiv expanded aggressively through roll-up acquisitions, absorbing APX to
              secure leading wholesale power registry capabilities, Evolution Markets to capture over $800 billion in
              notional transaction execution, and Evident to operate the international I-REC registry. By late 2026,
              Xpansiv's network supported over 320 GW of registered renewable capacity, managing approximately 28% of
              global RECs issued in 2025. In May 2026, the company expanded in the Asia-Pacific region by deploying
              real-time data and order-routing links between CBL and enechain's JCEX. However, the broader environmental
              markets backdrop presents challenges: independent research from MSCI Carbon Markets underscores systemic
              headwinds in voluntary carbon credits, including delivery delays and integrity concerns, heightening the
              need for verifiable registry rigor.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO008
              - CO010
              - CO011
              - CO012
              - CO013
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Multi-Asset Registry and Exchange Architecture
            body: >-
              Xpansiv has successfully transitioned from an isolated spot trading venue into an essential infrastructure
              layer for environmental commodities. By controlling registries, market execution, and portfolio
              connectivity, the platform creates significant stickiness across institutional market participants.
            calloutType: insight
            claimRefs:
              - CO001
              - CO004
          - type: callout
            title: Consolidated Financial Opacity and Voluntary Carbon Headwinds
            body: >-
              While Xpansiv demonstrates unmatched operational scale across renewable registries, persistent private
              financial confidentiality and broader voluntary carbon market integrity challenges require thorough
              diligence on standalone unit economics and cash runway.
            calloutType: risk
            claimRefs:
              - CO013
              - CO014
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant market is the infrastructure used to issue, track, transfer, trade, settle, analyze, and
              retire environmental commodities. Xpansiv describes coverage across clean power and renewable energy
              certificates, carbon and emissions, clean fuels, water, and recycled materials, delivered through
              registries, marketplaces, execution services, portfolio software, power operations, and market data. This
              boundary includes fees for systems of record, connectivity, execution, managed workflows, and data; it
              excludes the value of physical electricity, fuels, generation assets, and abatement projects themselves.
              The primary status quo is fragmented workflow: direct registry logins, bilateral execution, manual
              transfers, spreadsheet reconciliation, and separate reporting systems. Xpansiv's reported annual commodity
              movement is therefore an activity proxy, not revenue or addressable software spend.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
      - number: '2.2'
        title: Sizing Lenses and Their Limits
        blocks:
          - type: paragraph
            body: >-
              No retained source provides a reliable TAM, SAM, or SOM for Xpansiv's combined registry, exchange,
              brokerage, power, software, and data businesses. The best available lenses have different denominators. A
              company fact sheet reports more than $200 billion of commodities and derivatives moving annually through
              Xpansiv infrastructure, but that is gross notional activity rather than revenue. A company-issued 2026
              release reports more than 320 GW of renewable capacity in its registries and 28% of global 2025 REC
              issuance, which indicates operating footprint rather than monetizable spend. Separately, an industry
              forecast cited by Reuters Plus projected a carbon-credit market above $50 billion in 2030, while Reuters
              Plus reported the market at about $1.4 billion in 2024 with flat retirements and a 20% spot-price decline.
              These lenses should not be added together.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM014
      - number: '2.3'
        title: Buyers, Users, Payers, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Xpansiv's disclosed users span energy traders, risk managers, corporate sustainability teams, analysts,
              investors, power market participants, and certificate-producing homeowners and businesses. The workflow
              begins with asset or project registration, continues through issuance and market access, and ends with
              transfer, settlement, retirement, reconciliation, and reporting. Buyers may adopt individual modules
              before consolidating more of the lifecycle: Connect links at least 15 registries and trading platforms,
              while Data is delivered through APIs, SFTP, cloud warehouses, and web tools. The economic case is
              plausible but thinly evidenced. Xpansiv cites one Fortune 100 energy-company example with a 12%
              procurement-cost reduction; it does not identify the customer, baseline, measurement period, contract
              value, or whether that result is representative.
            claimRefs:
              - CM004
              - CM005
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM014
              - CM015
      - number: '2.4'
        title: Growth Drivers, Constraints, and Diligence Implications
        blocks:
          - type: paragraph
            body: >-
              Reporting and compliance needs favor auditable infrastructure, while broader asset coverage and registry
              connectivity can reduce operational fragmentation. Carbon-market growth, however, is not a uniform demand
              tailwind. Reuters Plus describes a crisis of confidence, fragmented standards, and legal and reputational
              concerns; MSCI says integrity remains central to scaling and points to delivery delays and governance
              gaps. Higher-integrity demand may benefit registry, ratings, data, and audit workflows, but it can also
              suppress volumes when acceptable supply is scarce. The central valuation gap is conversion: none of the
              retained sources discloses revenue by product, fee schedules, take rates, recurring versus transactional
              mix, customer concentration, or renewal behavior. Without those data, market notional, certificate volume,
              and connected capacity cannot establish Xpansiv's revenue opportunity or attainable share.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Infrastructure Exposure Is Broader Than Voluntary Carbon
            body: >-
              Xpansiv's product scope includes renewable certificates, power, clean fuels, water, registries, execution,
              portfolio software, and data. That breadth reduces dependence on any single voluntary-carbon demand
              forecast, but product-level revenue exposure remains undisclosed.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: callout
            title: Market Activity Does Not Establish Monetizable Share
            body: >-
              Large notional flow, connected capacity, and certificate issuance can indicate infrastructure relevance,
              but without fee schedules, take rates, segment revenue, and retention data they cannot support a precise
              SAM, SOM, or valuation multiple.
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM008
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Direct Peers, Incumbent Exchanges, and Brokers'
        blocks:
          - type: paragraph
            body: >-
              The environmental commodity transaction landscape spans specialized spot platforms, incumbent derivatives
              exchanges, traditional interdealer brokers, and entrenched status-quo manual procurement. Xpansiv
              differentiates itself by consolidating physical spot execution through CBL with institutional voice
              brokerage through Evolution Markets and portfolio synchronization through Connect. Direct competitors such
              as AirCarbon Exchange (ACX) and Climate Impact X (CIX) focus primarily on digital spot carbon contracts,
              lacking Xpansiv's multi-registry infrastructure, renewable energy certificate (REC) scale, and power
              software capabilities. Meanwhile, incumbent commodity exchanges including Intercontinental Exchange (ICE)
              dominate standardized compliance emissions futures (such as European Union Allowances and California
              Carbon Allowances) with massive financial clearing liquidity, but they leave physical registry-level asset
              management and distributed renewable certificate aggregation to specialized infrastructure operators. For
              many enterprise procurement teams, bilateral over-the-counter transactions managed via spreadsheets and
              bespoke contracts remain the primary status-quo substitute, avoiding centralized exchange fees at the cost
              of high settlement friction and opaque price discovery.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
      - number: '3.2'
        title: 'Capability Differentiation: Multi-Registry Connectivity and Feature Matrix'
        blocks:
          - type: paragraph
            body: >-
              Xpansiv's primary operational barrier against specialized spot venues and voice brokers lies in its
              end-to-end software and registry integration. Through Xpansiv Connect, the platform natively links with
              more than 15 global registries covering voluntary carbon credits, compliance RECs, digital fuels, and
              water attributes. This multi-registry backbone automates certificate transfers, retirements, and balance
              reconciliations, eliminating the manual friction that characterizes status-quo spreadsheet workflows. In
              contrast, specialized spot venues like ACX provide order-matching engines but require participants to
              manage external registry transfers independently. Furthermore, Xpansiv's acquisition of APX (now Xpansiv
              Power) and SRECTrade (now Xpansiv Managed Solutions) broadens its operational footprint into wholesale
              electricity scheduling and distributed solar renewable certificate aggregation, serving over 125,000
              accounts. Standalone rating providers like Calyx Global, Sylvera, and MSCI Carbon Markets provide
              independent project integrity assessments but lack native execution and settlement rails. By embedding
              trade-based benchmark pricing from CBL and Evolution Markets directly into its data products, Xpansiv
              creates a cohesive workflow that bridges front-office trading with middle-office compliance and
              sustainability reporting.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP010
              - CP012
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP011
              - CP013
      - number: '3.3'
        title: Pricing Architecture, Packaging Models, and Switching Dynamics
        blocks:
          - type: paragraph
            body: >-
              Commercial monetization across environmental commodities reflects a combination of volume-based spot
              exchange fees, transactional brokerage commissions, and recurring enterprise software subscriptions.
              Xpansiv bundles its infrastructure by charging per-transaction fees on CBL spot trades, brokerage
              commissions via Evolution Markets, and annual subscription fees for Connect portfolio management and
              market data feeds. In contrast, incumbent derivatives venues like ICE enforce standardized per-contract
              clearing fees, while specialized carbon platforms like ACX rely primarily on per-ton execution fees for
              market makers and takers. While bilateral status-quo transactions avoid visible exchange technology fees,
              they incur wide bid-ask dealer spreads, elevated counterparty risk, and substantial legal overhead.
              Switching costs for established Xpansiv enterprise clients are structurally high: integrating
              multi-registry API connectors, establishing SOC 2-compliant automated audit trails, and synchronizing
              historical asset retirement logs into enterprise resource planning (ERP) systems create meaningful
              technological and administrative lock-in that discourages multi-homing across unintegrated spot venues.
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP006
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP006
              - CP012
      - number: '3.4'
        title: Moat Durability, Regulatory Shifts, and Market Integrity Headwinds
        blocks:
          - type: paragraph
            body: >-
              Although Xpansiv has built an expansive infrastructure footprint supported by $525 million in
              institutional capital and strategic backing from Blackstone, Bank of America, and Goldman Sachs, its moat
              durability faces severe macroeconomic and regulatory tests. The voluntary carbon market experienced a
              pronounced slowdown, with market value plateauing near $1.4 billion and average spot credit prices falling
              20% following integrity controversies and scrutiny over legacy project methodologies. Although Ecosystem
              Marketplace and MSCI report rising buyer demand for high-integrity carbon removals and Core Carbon
              Principles (CCP)-approved credits, transactional liquidity across secondary spot venues has contracted
              significantly from peak levels. Concurrently, heightened regulatory oversight—exemplified by California
              Assembly Bill 1305, which penalizes unsubstantiated offset marketing claims up to $2,500 per day—compels
              corporate buyers to demand rigorous, auditable verification before executing trades. While this regulatory
              climate reinforces demand for Xpansiv's auditable tracking software, prolonged stagnation in voluntary
              spot credit turnover risks compressing transaction-based exchange fee revenue.
            claimRefs:
              - CP005
              - CP007
              - CP008
              - CP009
              - CP010
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Dual Liquidity Moat vs. Regulatory and Market Fragility
            body: >-
              Xpansiv's multi-registry architecture and Evolution Markets brokerage network create high switching costs
              for enterprise market participants, but spot liquidity remains vulnerable to voluntary carbon market
              reputational shocks and evolving compliance disclosure rules under California AB 1305.
            calloutType: insight
            claimRefs:
              - CP001
              - CP007
              - CP010
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Commercial Monetization
        blocks:
          - type: paragraph
            body: >-
              Xpansiv monetizes its market infrastructure across three primary revenue streams: volume-based spot
              exchange execution fees, software-as-a-service (SaaS) and issuance fees for registry infrastructure, and
              recurring enterprise subscriptions for proprietary environmental market data [CI001, CI002]. Spot exchange
              execution is anchored by CBL, which serves as a leading liquidity venue where over 330 million carbon
              credits and 14 million renewable energy certificates (RECs) and Energy Attribution Certificates (EACs)
              have transacted since 2020 [CI003]. CBL operates on a transaction-fee model, capturing volume-based
              brokerage and trading commissions across voluntary carbon offsets and clean energy certificates [CI001].
              Parallel execution services are provided via Evolution Markets, which facilitates bilateral OTC
              transactions and structured environmental commodity trades [CI001]. Registry infrastructure revenue is
              generated through software licensing and asset lifecycle fees across compliance and voluntary registries,
              including NAR, TIGR, and the Evident I-REC(E) network [CI004, CI005]. Finally, Xpansiv Data generates
              recurring subscription revenue by delivering benchmark pricing, historical datasets, and real-time
              transaction feeds via API, SFTP, and cloud warehouses to corporate risk managers and commodity traders
              [CI006]. However, realization rates, fee schedules, and contract sizes remain private [CI007].
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
              - CI006
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI006
      - number: '4.2'
        title: Cost Structure, Gross Margin Drivers, and Go-to-Market
        blocks:
          - type: paragraph
            body: >-
              The cost structure reflects the operational realities of enterprise-grade financial and environmental
              market infrastructure. Delivery of registry services requires cloud-native hosting, high-throughput
              database operations, and SOC 2 Type II certified security controls to support the annual transfer of over
              one billion environmental assets [CI008]. Gross margin drivers divide between software-driven registry and
              data operations—which inherently enjoy high incremental software margins—and brokerage execution, which
              carries regulatory compliance overhead, broker personnel compensation, and licensing expenses through
              registered broker-dealer entities [CI001, CI002]. Xpansiv's go-to-market motion relies on direct
              institutional enterprise sales targeting compliance buyers, corporate sustainability teams, utility power
              traders, and commodity brokers [CI006]. Sales cycles for registry adoption and multi-asset Connect
              enterprise integrations typically span multiple quarters due to complex ERP, ETRM, and risk-management
              integrations [CI002, CI008]. Customer acquisition cost (CAC), sales cycle duration, and net revenue
              retention (NRR) remain undisclosed private metrics, representing an underwriting gap for institutional
              diligence [CI007].
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI007
              - CI008
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI006
              - CI008
      - number: '4.3'
        title: Capital Adequacy, Cash Burn, and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Xpansiv has relied heavily on external equity capital and strategic acquisition financing rather than
              self-funded cash generation to expand its footprint [CI009, CI010]. In July 2022, Blackstone Energy
              Partners committed $400 million in strategic capital to accelerate acquisitions and platform scaling
              [CI009]. Subsequent rounds included a capital raise led by Aramco Ventures' Sustainability Fund to advance
              international expansion, followed by a major strategic capital raise in September 2026 led by European
              growth investor Verdane [CI010, CI011]. Verdane's growth investment was specifically earmarked to support
              continued M&A expansion, product rollouts, and geographic reach [CI011]. While secondary market platform
              Forge reported a last known valuation of $1.4 billion as of April 2025, consolidated cash balances,
              operating cash burn rates, runway length, and debt covenants remain private [CI012, CI013]. Crucially, the
              voluntary carbon market continues to navigate reputational challenges, with independent reports
              highlighting systemic integrity concerns, delivery delays, and governance gaps across registered carbon
              offset projects that can directly compress spot transaction velocity [CI014, CI015]. Consequently, Xpansiv
              faces structural dependency on sustained investor funding or debt facilities if transaction volume slows
              across voluntary carbon segments [CI013, CI015].
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI011
              - CI013
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Financial Opacity Obscures Exposure to Voluntary Carbon Market Fluctuations
            body: >-
              While Xpansiv reports high operational metrics—including over 330 million carbon credits transacted on CBL
              and 1 billion assets transferred annually on Connect—the lack of disclosed revenue, EBITDA, and cash burn
              obscures true profitability [CI003, CI007, CI008]. Independent analyses from MSCI demonstrate that market
              integrity scrutiny and delivery delays continue to weigh on voluntary carbon credit trading dynamics
              [CI014, CI015]. Without segment reporting, institutional underwriters cannot verify whether registry and
              data software revenues sufficiently insulate the company from spot carbon transaction volatility [CI007,
              CI013].
            calloutType: risk
            claimRefs:
              - CI003
              - CI007
              - CI008
              - CI013
              - CI014
              - CI015
          - type: callout
            title: Strategic Acquisitions Drive Asset Scale but Impose Ongoing Financing Demands
            body: >-
              Xpansiv's rapid expansion across environmental commodities has been propelled by repeated strategic
              acquisitions, including APX, Evolution Markets, and Evident [CI005, CI010, CI011]. Sustaining this M&A
              pipeline has required multi-hundred-million-dollar equity capital infusions from Blackstone, Aramco
              Ventures, and most recently Verdane in September 2026 [CI009, CI010, CI011]. Diligence must evaluate
              post-acquisition integration costs and module-level profitability to ensure platform synergies outpace
              capital consumption [CI007, CI013].
            calloutType: insight
            claimRefs:
              - CI005
              - CI007
              - CI009
              - CI010
              - CI011
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Xpansiv is better understood as a collection of connected market-infrastructure workflows than as a single
              software application. A Carbon Market Institute directory profile identifies CBL, SRECTrade, APX, H2OX,
              market data, and multi-registry portfolio management as the principal surfaces. A separate
              investment-company profile describes the customer journey as registering, trading, settling, retiring,
              analysing, and reporting environmental commodities. Xpansiv Connect is the clearest integration layer in
              the supplied evidence: the company says it links more than 15 registries and trading platforms,
              synchronizes positions, automates transfers and retirements, and exposes data through APIs and reporting
              interfaces. This supports an end-to-end workflow thesis, but public evidence does not disclose
              module-level adoption, implementation effort, or renewal behavior.
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
