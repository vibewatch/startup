        - Manages 28% of global RECs and 320+ GW of renewable capacity, creating formidable workflow lock-in.
        - Registry administration yields utility-like low-margin fees rather than software multiples.
        - Verification of high software ARR conversion and registry integration software margins.
      - - Market Execution & M&A
        - Evolution Markets and APX acquisitions consolidate multi-asset cash spot and brokered transaction flow.
        - Trading commissions face fee compression and transaction volumes fluctuate with commodity volatility.
        - Audited financial disclosure proving counterparty retention and recurring brokerage fees.
      - - Growth Financing
        - September 2026 Verdane growth investment provides fresh expansion capital and acquisition runway.
        - Additional preference layers overhang common equity without verifiable valuation markup.
        - Public disclosure of round pre-money valuation, preference seniorities, and governance terms.
      - - Macro Carbon Integrity
        - Rising integrity standards drive market demand toward verified, high-quality registries and ratings.
        - VCM transaction volumes contracted 25% in 2024 with persistent buyer reputational hesitation.
        - Sustained rebound in compliance convergence and institutional carbon credit transaction volume.
    notes: Synthesized from company disclosures, Forge secondary data, and industry market reports across 2024-2026.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV009
  - id: TV002
    title: Recommendation summary table
    columns:
      - Metric / Decision Parameter
      - Assigned Posture
      - Supporting Evidence
      - Decision Implication
    rows:
      - - Recommendation
        - research-more
        - Extensive physical market registry share countered by zero public GAAP revenue or margin visibility.
        - Maintain active tracking; withhold direct capital allocation pending confidential financial review.
      - - Confidence Level
        - medium
        - Verified registry share and Verdane backing, but opaque secondary prints and financial terms.
        - Avoid sizing positions on secondary platforms without detailed cap-table disclosure.
      - - Risk Rating
        - high
        - Voluntary market cyclicality, regulatory disclosure burdens (AB1305), and acquisition integration overhead.
        - Apply higher discount rate (18-22%) to projected cash flows across all valuation models.
      - - Valuation Stance
        - fair
        - Last known benchmark of $1.4B in April 2025 aligns with peer platform revenue multiples if ARR exceeds $100M.
        - Do not pay valuation premiums above $1.4B without certified revenue run-rate audit.
    notes: Primary analytical framework synthesizing operational scale against disclosure opacity.
    claimRefs:
      - CV001
      - CV002
      - CV008
      - CV014
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Probability
      - Core Operating Assumptions
      - Implied Valuation Range
      - Key Downside / Thesis Triggers
    rows:
      - - Bull Case
        - 25%
        - VCM trading rebounds 30%+, Verdane acquisitions yield global scale, compliance carbon convergence accelerates.
        - $2.0B - $2.5B
        - Accelerated compliance market linkage; Article 6 operationalization boosts CBL exchange velocity.
      - - Base Case
        - 55%
        - Stable 10-15% REC registry growth, flat carbon trading volumes, modest M&A accretion, steady platform fees.
        - $1.2B - $1.5B
        - Prolonged VCM scrutiny offsets REC gains; secondary share prices trade sideways around $1.4B mark.
      - - Bear Case
        - 20%
        - Extended VCM liquidity contraction (-20%), corporate greenwashing pushback, cap-table preference dilution.
        - $700M - $900M
        - Down-round financing, key registry contract loss, or severe margin compression across brokerage.
    notes: Scenario probability signals and implied enterprise values based on peer infrastructure multiples.
    claimRefs:
      - CV001
      - CV005
      - CV007
