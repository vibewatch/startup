      - number: '5.2'
        title: Module Maturity and Operating Scale
        blocks:
          - type: paragraph
            body: >-
              The strongest maturity indicators are operating-volume claims rather than independent technical
              benchmarks. Xpansiv reported that its renewable-energy-certificate registry network issued 31% of global
              RECs in 2024 and that assets in its owned REC registries represented about 6% of global renewable-power
              capacity. It also reported more than 15 GW of resources served by Xpansiv Power, coverage of all seven
              U.S. independent system operators, and more than 330 million carbon credits plus over 14 million renewable
              and clean-energy certificates transacted through CBL since 2020. These figures indicate production use
              across multiple workflows, but they do not establish uptime, latency, customer retention, software
              margins, or independently measured reliability.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE002
