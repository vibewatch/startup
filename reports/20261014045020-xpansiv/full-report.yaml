              - CU004
              - CU007
              - CU012
      - number: '6.3'
        title: Named Enterprise Proof and Production Deployments
        blocks:
          - type: paragraph
            body: >-
              Verified customer evidence confirms production-grade adoption among major energy producers, global trading
              houses, and financial market operators. In October 2025, Constellation Energy (Nasdaq: CEG), the largest
              producer of clean, reliable energy in the United States, announced a commercial initiative to offer annual
              emission-free energy certificates (EFECs) from its PJM nuclear and clean energy centers directly on CBL,
              with full-lifecycle issuance and tracking through Xpansiv's NAR registry starting December 2025. In
              commodity trading and financial data, global commodity merchant Trafigura executes transactions on CBL
              while MSCI integrates Xpansiv market data and analytics into carbon market assessment workflows.
              Furthermore, Evident's international registry network encompasses over 4,000 corporate participants
              purchasing and redeeming I-REC certificates across more than 60 countries. While these high-profile
              relationships validate technical capability and institutional trust, bilateral transaction volumes and
              revenue sharing terms remain confidential.
            claimRefs:
              - CU005
              - CU008
              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU008
              - CU009
      - number: '6.4'
        title: Retention Durability, Market Headwinds, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Evaluating customer retention and revenue durability requires balancing robust registry infrastructure
              lock-in against severe external headwinds in voluntary carbon markets. Independent research by Ecosystem
              Marketplace indicates that voluntary carbon market transaction volumes dropped 25% in 2024 to their lowest
              level since 2018, while Reuters reports average spot prices declined by 20% amid persistent integrity
              concerns. This contraction directly impacts transactional liquidity and exchange fees on CBL, even as
              compliance REC issuances remain comparatively resilient. Structurally, Xpansiv faces potential
              concentration risks tied to dominant energy brokerage counterparties and major independent system operator
              integrations. Critically, Xpansiv does not publish standard SaaS durability metrics, including net revenue
              retention (NRR), gross retention rate (GRR), customer cohort churn, or top-customer revenue concentration,
              leaving platform stickiness as a central diligence unknown.
            claimRefs:
              - CU010
              - CU011
              - CU013
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Critical Registry and Power Market Distribution Moat
            body: >-
              Xpansiv's control of registries issuing 31% of global RECs alongside power operations across CAISO and
              ERCOT anchors deep customer workflow lock-in that pure-play spot carbon exchanges cannot replicate.
            calloutType: strength
            claimRefs:
              - CU003
              - CU004
              - CU005
          - type: callout
            title: Voluntary Carbon Market Contraction Pressures Commercial Trading
            body: >-
              A 25% drop in voluntary carbon market transaction volume and 20% spot price decline expose CBL exchange
              customer volumes to broader market skepticism, despite stability in core REC registry issuances.
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and market-integrity exposure
        blocks:
          - type: paragraph
            body: >-
              The most visible structural risk is not a documented enforcement action against Xpansiv, but dependence on
              rules and confidence that the company does not control. Xpansiv states that its Evolution Markets
              subsidiaries are registered with the CFTC, NFA, and UK FCA, while the acquired Evident registry remains
              subject to I-TRACK Foundation oversight. Those arrangements are mitigants, yet they also create continuing
              license, conduct, and accreditation dependencies. The voluntary carbon segment adds a separate
              demand-quality risk: MSCI identifies delivery delays and governance gaps, Ecosystem Marketplace reported a
              25% decline in 2024 transaction volume, and Reuters Plus described a market crisis of confidence. These
              market-level findings do not prove an Xpansiv-specific violation or revenue decline; they establish the
              adverse environment in which its carbon infrastructure operates.
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
