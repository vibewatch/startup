chapter:
  number: 5
  title: "Product & Technology"
  summary: "Xpansiv's public product surface links environmental-asset registries, portfolio workflows, spot execution, broker pricing, wholesale-power operations, and data delivery. The breadth and reported transaction scale are differentiating, but the evidence is mostly company or partner issued, while uptime, incident history, independent security assurance, API adoption, and a product roadmap remain diligence gaps."
sections:
  - id: "product-and-customer-workflow"
    title: "Product and Customer Workflow"
    body: "Xpansiv is better understood as a collection of connected market-infrastructure workflows than as a single software application. A Carbon Market Institute directory profile identifies CBL, SRECTrade, APX, H2OX, market data, and multi-registry portfolio management as the principal surfaces. A separate investment-company profile describes the customer journey as registering, trading, settling, retiring, analysing, and reporting environmental commodities. Xpansiv Connect is the clearest integration layer in the supplied evidence: the company says it links more than 15 registries and trading platforms, synchronizes positions, automates transfers and retirements, and exposes data through APIs and reporting interfaces. This supports an end-to-end workflow thesis, but public evidence does not disclose module-level adoption, implementation effort, or renewal behavior."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "module-maturity-and-scale"
    title: "Module Maturity and Operating Scale"
    body: "The strongest maturity indicators are operating-volume claims rather than independent technical benchmarks. Xpansiv reported that its renewable-energy-certificate registry network issued 31% of global RECs in 2024 and that assets in its owned REC registries represented about 6% of global renewable-power capacity. It also reported more than 15 GW of resources served by Xpansiv Power, coverage of all seven U.S. independent system operators, and more than 330 million carbon credits plus over 14 million renewable and clean-energy certificates transacted through CBL since 2020. These figures indicate production use across multiple workflows, but they do not establish uptime, latency, customer retention, software margins, or independently measured reliability."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
    tableRefs:
      - "TE002"
  - id: "architecture-integrations-and-controls"
    title: "Architecture, Integrations, and Controls"
    body: "Public materials support an operating-layer map, not a detailed internal software architecture. Xpansiv describes Connect as cloud-native and SOC 2 certified, with token authentication, role-based permissions, encrypted transmission, and transaction audit logs; these are company claims, and the supplied pool contains neither the SOC report nor an independent penetration or availability assessment. Xpansiv Data is distributed through APIs, SFTP, cloud warehouses, and a secure portal. The May 2026 Enverus integration adds a concrete partner-validated distribution path by combining CBL exchange transactions with Evolution Markets forward indications inside MarketView. Together, the sources support a registry-to-workflow-to-execution-to-data operating model, while leaving the underlying services, data model, recovery design, and connector maintenance process undisclosed."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE010"
      - "CE011"
    tableRefs:
      - "TE003"
  - id: "technical-and-market-integrity-risks"
    title: "Technical and Market-Integrity Risks"
    body: "The platform's value depends on reliable external registries and on confidence in the environmental assets represented by those systems. MSCI says integrity standards are rising while delivery delays and governance gaps continue to reshape carbon-credit markets, based on ratings coverage of more than 4,400 registered projects and nearly 250 pipeline projects. Reuters Plus describes the voluntary market as fragmented and lacking uniform global standards, and Climate Focus says regulatory uncertainty and integrity concerns affected 2024 demand. These sources do not document an Xpansiv outage or control failure. They do show that product quality cannot be assessed only as software availability: changing methodologies, registry rules, and asset-quality judgments can alter which instruments remain usable, liquid, or acceptable to buyers."
    claimRefs:
      - "CE012"
      - "CE013"
      - "CE014"
