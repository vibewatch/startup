    body: "Require license and accreditation confirmations, independent SOC 2 and uptime evidence, incident and reconciliation logs, counterparty concentration, and audited segment financials before concluding that public mitigations reduce residual exposure."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR004"
      - "CR016"
