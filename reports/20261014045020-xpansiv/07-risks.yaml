    title: "Market weakness is observable; Xpansiv-specific sensitivity is not"
    body: "Independent sources document lower voluntary-carbon transaction volume and persistent integrity concerns, but the assigned public evidence does not disclose Xpansiv's revenue mix or sensitivity to those conditions."
