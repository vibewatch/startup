    columns:
      - Buying Criteria & Workflow Capability
      - Xpansiv (CBL / Connect / Evolution)
      - Incumbent Futures Exchanges (ICE)
      - Specialized Spot Venues (ACX / CIX)
      - Bilateral OTC & Status Quo
    rows:
      - - Multi-Registry Portfolio Synchronization
        - Supported across 15+ global registries (Connect SaaS)
        - Unsupported (relies on external registry accounts)
        - Partial (limited to exchange-supported carbon registries)
        - Manual (spreadsheets and individual registry logins)
      - - Spot Physical Execution & Clearing
        - Supported (CBL spot exchange + Evolution Markets)
        - Limited (primarily cash-settled futures / derivatives)
        - Supported (digital spot exchange matching)
        - Bilateral only (custom contracts, high counterparty risk)
      - - Managed Renewable & Clean Fuel Services
        - Supported (Xpansiv Managed Solutions / 2 GW solar)
        - Unsupported (core exchange trading only)
        - Unsupported (exchange infrastructure only)
        - Internal build or specialized regional brokers
      - - Real-Time Trade-Based Benchmark Data
        - Supported (Xpansiv Data from CBL & Evolution trades)
        - Supported for futures curves; limited spot credit data
        - Limited to exchange-specific order book trades
        - Unavailable (opaque private bilateral transactions)
      - - Regulatory Disclosure & Audit Trail
        - Supported (SOC 2, automated logs, CSRD/SEC alignment)
        - Supported for exchange clearing; separate for credits
        - Partial (standard digital trade confirmations)
        - High operational risk (manual spreadsheets, audit exposure)
    notes: >-
      Evaluations reflect native workflow capabilities verified from product documentation, platform specifications, and
      regulatory compliance standards.
    claimRefs:
