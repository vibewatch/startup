      - CP002
      - CP004
      - CP010
      - CP012
      - CP014
  - id: TP003
    title: Pricing Models, Commercial Packaging, and Switching Cost Comparison
    columns:
      - Solution Model
      - Commercial Pricing Mechanism
      - Included Capabilities
      - Packaging Transparency & Discounts
      - Switching Cost & Participant Lock-in
    rows:
      - - Integrated Platform (Xpansiv)
        - Transaction fees on CBL spot + brokerage commissions + Connect annual SaaS license
        - Registry transfers, spot execution, portfolio reporting, audit logs
        - Custom enterprise contracts; tiered registry and data volume pricing
        - High switching cost due to multi-registry API integration and historical audit trails
      - - Financial Derivatives Exchanges (ICE)
        - Per-contract exchange and clearing fees on standardized futures lots
        - Central counterparty clearing, margin facilities, standardized futures
        - Public fee schedule per lot; exchange membership tiers
        - High liquidity lock-in for compliance futures; low lock-in for voluntary physical offsets
      - - Specialized Spot Marketplaces (ACX / CIX)
        - Per-ton spot execution fee (typically basis points or fixed cents per credit)
        - Digital order matching, wallet custody, trade confirmation
        - Published fee tiers for makers and takers; volume-based discounts
        - Low to moderate; participants multi-home across spot venues for price discovery
      - - Bilateral Over-the-Counter (Status Quo)
        - Broker markup or zero exchange fee; legal advisory and settlement overhead
        - Bespoke contract terms, direct counterparty delivery
        - Completely opaque; wide bid-ask spreads and hidden transaction friction
        - Low technological lock-in, but high relationship inertia and custom contract friction
    notes: >-
      Fee structures reflect prevailing commercial conventions in environmental commodity markets; private enterprise
      volume discounts are negotiated bilaterally.
    claimRefs:
      - CP001
      - CP003
      - CP005
      - CP006
      - CP012
