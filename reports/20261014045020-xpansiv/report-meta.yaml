companyProfile:
  summary: >-
    Xpansiv is a late-stage private environmental-commodities infrastructure company built around registries, CBL spot
    exchange execution, Evolution Markets brokerage, Connect portfolio management, wholesale power software, and market
    data. Public evidence supports broad operating scale, repeated institutional backing, and a continuing unicorn-level
    private valuation anchor, but not the current revenue, margin, liquidity, or preference-stack details needed for
    full underwriting.
  headquarters: San Francisco, CA, USA
  productSummary: >-
    Xpansiv sells market infrastructure for environmental commodities: registry software, certificate issuance and
    transfer workflows, Connect-based portfolio management, exchange and OTC settlement rails, brokerage and structured
    transactions, market data, wholesale power software, and managed-solution workflows.
  customerFocus: >-
    Corporates, traders and brokers, project and asset owners, registry participants, utilities and power-market
    operators, airlines and other compliance-linked buyers, and institutional participants using environmental
    commodities for trading, procurement, compliance, and portfolio management.
  businessModel: >-
    Multi-line infrastructure monetization across registry onboarding and volumetric fees, exchange and settlement fees,
    brokerage and advisory revenue, data licensing, power software contracts, and managed-solution workflow or
    revenue-share fees.
  stage: Late-stage private
  fundingStatus: >-
