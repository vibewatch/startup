evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Consolidated financial performance and margin bridge
    missingEvidence: >-
      Audited financial statements, consolidated 2024-2026 revenue breakdown, gross margin, EBITDA, cash burn, and
      runway.
    whyItMatters: >-
      Without segmented financial disclosures across registries, exchange trading, and brokerage, valuation multiples
      and standalone cash runway cannot be independently verified.
    diligencePath: >-
      Request confidential historical financial audits, board reporting decks, and 2024-2026 revenue bridges during
      diligence.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: Complete executive governance and equity cap table
    missingEvidence: >-
      Full board of directors roster, key-person equity vesting, complete cap table ownership percentages, and
      liquidation preferences.
    whyItMatters: >-
      Public sources disclose lead investors and select C-suite officers but omit complete voting control, board
      composition, and minority shareholder rights.
    diligencePath: Obtain fully diluted capitalization table, voting agreements, and board governance charters.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: segment-revenue-and-market-capture
    missingEvidence: >-
      Audited revenue by registries, exchange, execution, power, managed solutions, portfolio software, and data; fee
      schedules; take rates; recurring mix; customer concentration; renewal rates; and segment margins.
    whyItMatters: >-
      Without monetization and retention evidence, commodity notional, registered capacity, and certificate volume
      cannot be converted into defensible TAM, SAM, SOM, revenue share, or valuation support.
    diligencePath: >-
      Request audited segment financials, cohort retention, pricing schedules, volume-to-revenue bridges, and
      management's bottoms-up market model with denominator definitions.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-budget-and-procurement
    missingEvidence: >-
      Independent evidence identifying contract owners, budget lines, procurement cycles, implementation costs, and
      realized ROI across multiple named customers.
    whyItMatters: >-
      Product-page personas and one anonymous cost-reduction example do not establish repeatable willingness to pay or
      sales-cycle duration.
    diligencePath: >-
      Review customer contracts and renewal cohorts, then interview named utility, trading, sustainability, and registry
      customers about budget ownership and measured outcomes.
    relatedQuestionRefs:
      - QM004
      - QM006
  - type: private-evidence-only
    severity: material
    topic: competitor-unit-economics-and-take-rates
    missingEvidence: >-
      Disclosed transaction fee schedules, realized take rates, and customer retention metrics across rival spot
      exchanges (ACX, CIX) and OTC brokerage desks.
    whyItMatters: >-
      Without audited transaction volume breakdowns and fee realizations across competitors, evaluating pricing power
      and margin resilience against fee compression remains constrained.
    diligencePath: >-
      Request confidential fee cards, clearing revenue share schedules, and customer churn reports for CBL spot exchange
      and Evolution Markets brokerage operations.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: financial-underwriting
    missingEvidence: Consolidated audited income statement, revenue run rate by business line, gross margins, and EBITDA.
    whyItMatters: >-
      Without segmented revenue and margin data, underwriters cannot distinguish high-margin software ARR from cyclical
      transaction revenue or evaluate operational breakeven.
    diligencePath: Request confidential FY2023-FY2025 audited financial statements and board management presentations under NDA.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-burn-runway
    missingEvidence: >-
      Cash and cash equivalents on hand, quarterly cash burn rate, debt facility terms, and post-Verdane capitalization
      table.
    whyItMatters: >-
      Determines company solvency, liquidity runway, and reliance on future capital calls under depressed voluntary
      carbon trading volumes.
    diligencePath: Request latest month-end bank balance, cash flow statement, debt covenant schedules, and capitalization table.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: reliability-and-security-assurance
    missingEvidence: >-
      Independent uptime history, incident disclosures, recovery objectives, penetration-test results, and the scope and
      exceptions of the cited SOC 2 assessment.
    whyItMatters: >-
      Connect and data-delivery failures could interrupt asset transfers, retirements, reconciliation, pricing
      workflows, or reporting, while a certification label alone does not quantify operating reliability.
    diligencePath: >-
      Request the current SOC 2 report, trailing-24-month incident register, service-level performance, recovery tests,
      and security remediation log under NDA.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: roadmap-and-integration-maturity
    missingEvidence: >-
      A dated product roadmap, connector release history, implementation metrics, support response data, and independent
      customer evidence for the integrated platform.
    whyItMatters: >-
      The public product breadth may reflect connected commercial surfaces without proving uniform technical
      integration, deployment speed, or support quality.
    diligencePath: >-
      Review roadmap commitments, connector changelogs, implementation cohorts, support-ticket statistics, and reference
      calls with customers using multiple Xpansiv modules.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE001
      - TE002
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      A public developer surface or practitioner-community proxy showing API documentation depth, SDK usage, release
      cadence, integration activity, or engineer discussion.
    whyItMatters: >-
      Public developer evidence would help test whether the integration layer is broadly usable and actively maintained
      rather than accessible only through bespoke enterprise services.
    diligencePath: >-
      Request API documentation, sandbox usage, SDK distribution, release notes, integration-support staffing, and
      anonymized developer adoption metrics.
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-churn
    missingEvidence: >-
      Net revenue retention (NRR), gross retention rate (GRR), customer cohort churn rates, and average contract
      duration for Xpansiv Connect and APX/Power software customers.
    whyItMatters: >-
      Without disclosure of software retention and renewal metrics, it is impossible to evaluate whether growth is
      driven by expanding annual recurring revenue or masked by high customer turnover.
    diligencePath: >-
      Request audited SaaS revenue cohorts, software renewal rates, and customer expansion benchmarks under confidential
      diligence.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof table
    missingEvidence: >-
      Comprehensive customer master list, contract-level transaction volumes, and top-ten customer revenue concentration
      percentages.
    whyItMatters: >-
      Public customer references provide evidence of production usage but do not reveal revenue concentration across
      primary utilities, corporate buyers, or trading houses.
    diligencePath: >-
      Examine management customer concentration schedules, top 20 customer billing records, and long-term service
      agreements under NDA.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: regulatory-status
    missingEvidence: >-
      Primary regulator records confirming current permissions, capital requirements, and disciplinary history for each
      regulated brokerage entity.
    whyItMatters: >-
      Company-issued registration statements do not establish current license scope, compliance history, or capital
      adequacy.
    diligencePath: Retrieve and reconcile current NFA, CFTC, and FCA register entries, permissions, filings, and enforcement records.
    relatedQuestionRefs:
      - QR001
      - QR005
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: operational-resilience
    missingEvidence: >-
      Independent SOC 2 report details, uptime history, material incident log, recovery objectives, reconciliation
      breaks, and control exceptions.
    whyItMatters: >-
      Company-described controls do not quantify failure frequency, recovery performance, or losses across integrated
      platforms.
