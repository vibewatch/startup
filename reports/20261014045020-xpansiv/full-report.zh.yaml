  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与融资背景
        blocks:
          - type: paragraph
            body: >-
              Xpansiv 的投资论点建立在其作为全球能源和环境商品运营基础设施的结构性地位上。通过多年激进的平台收购，包括 APX、Evolution Markets 和
              Evident，公司已搭建覆盖注册表、批发电力软件、现货交易所和经纪执行的端到端多资产能力。其专有注册表网络覆盖 60 个国家、超过 320 gigawatts 的注册可再生能源容量，并管理全球约 28%
              的可再生能源证书签发量。Xpansiv Connect 投资组合管理系统还连接 16 个环境注册表，每年处理约 one billion 次资产转移。2026 年 9 月，Xpansiv 获得欧洲成长型公司
              Verdane 领投的重大成长资本投资，用于持续国际扩张和技术收购，进一步巩固这一地位。但反方论点指出，实体注册表规模不会自动带来高利润率 SaaS
              软件倍数，尤其是在注册表管理和经纪收入仍对周期性自愿交易量及监管不确定性敏感的情况下。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV009
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV009
      - number: '8.2'
        title: 估值基准与二级市场定价
        blocks:
          - type: paragraph
            body: >-
              评估 Xpansiv 估值时，需要将其实体市场份额与严重披露不透明及自愿碳市场的宏观阻力一并权衡。Forge Global 汇总的私有二级交易数据显示，截至 2025 年 4 月，Xpansiv
              已知最新基准估值为 $1.4 billion，但二级交易指示反映交易量有限，也没有经验证的撮合交易。碳商品宏观环境明显收缩：Ecosystem Marketplace 研究显示，自愿碳市场交易量在 2024
              年下降 25%，降至 2018 年以来最低，信用价格下降 5.5%。Reuters 同样报道称，在企业可信度审查下，自愿市场规模稳定在约 $1.4 billion，平均现货价格下降 20%。尽管新加坡
              Climate Impact X 等区域竞争者争夺已验证信用和 REC 的交易所订单流，Xpansiv 仍通过地域扩张寻求逆周期增长，例如 2026 年 2 月与 Macao International
              Carbon Emission Exchange 合作，连接亚洲和国际环境市场。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV014
      - number: '8.3'
        title: 情景分析：乐观、基准与悲观下行情景触发因素
        blocks:
          - type: paragraph
            body: >-
              情景模型显示，公司对碳市场可信度改革和企业可持续发展采购行为存在非对称敞口。乐观情景下，合规机制与自愿注册表加速趋同，加上 Verdane 支持的收购快速扩张，推动企业价值升至 $2.0 billion 至
              $2.5 billion。基准情景下，核心可再生能源证书追踪业务稳定增长 10 至 15%，抵消碳交易低迷，使企业价值围绕现有 Forge 基准维持在 $1.2 billion 至 $1.5
              billion。相反，悲观情景假设估值大幅收缩至 $700 million 至 $900 million，触发因素包括碳交易长期停滞、Evolution Markets
              经纪业务利润率受压，或高级清算优先权造成严重稀释。MSCI 的独立研究指出，超过 4,400 个评级项目中的系统性可信度风险、项目交付延迟和治理缺口仍在压制买方信心。此外，California AB1305
              等州级合规要求对抵消额度持久性和验证施加严格年度披露义务，提高了企业买方不合规的成本。
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV014
      - number: '8.4'
        title: 建议总结与尽调优先级
        blocks:
          - type: paragraph
            body: >-
              综合现有证据后，建议继续研究，信心评级为中等、风险评分为高，公允估值锚定在 2025 年 4 月的 $1.4 billion 基准。Xpansiv
              在全球可再生能源登记系统和批发电力系统中拥有无可争议的基础设施防御力；Verdane 于 2026 年 9
              月追加成长资本，进一步强化了这一点。不过，在合并收入运行率、毛利率、现金消耗和资本结构偏好都完全未向公众披露之前，投资决策不足以支持直接给出买入评级。对潜在投资者和二级市场买家而言，资本纪律意味着：在通过机构尽调确认按业务单元拆分的经审计损益表，以及
              Verdane 入股后的资本表瀑布机制之前，不应直接承诺股权投资。关键的论点失效触发因素包括失去主要登记系统特许经营授权、二级市场长期下调重估至 $1.0 billion
              以下，或监管执法行动削弱环境商品的可信度。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV009
              - CV012
              - CV014
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 以能源转型基础设施为锚的估值倍数可持续性
            body: Xpansiv 作为多登记系统关键基础设施的定位，使其具备类似公用事业的防御性特征；但要维持独角兽估值，仍需证明登记数据能够交叉销售为高毛利 SaaS 订阅，而不是停留在低费率托管交易。
            calloutType: insight
            claimRefs:
              - CV003
              - CV009
              - CV013
          - type: callout
            title: 监管对抵销项目审查带来的下行风险
            body: 加州 AB1305、ICVCM Core Carbon Principles 等框架收紧抵销项目验证规则，会推高行政和审计成本；在高完整性供给成熟前，志愿市场交易周转量可能因此承压。
            calloutType: risk
            claimRefs:
              - CV005
              - CV007
              - CV008
