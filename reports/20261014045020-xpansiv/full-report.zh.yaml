      - number: '7.3'
        title: 合作伙伴依赖与财务模型不确定性
        blocks:
          - type: paragraph
            body: >-
              平台价值取决于外部注册表、标准机构、受监管子公司和企业交付渠道。Xpansiv 称其交易工作流采用直通结算并整合超过 15 个注册表，Connect 和 Data 则通过
              API、SFTP、云数据仓库和连接的市场系统分发信息。这种广度可以分散接入渠道，但也扩大了可能因变更或故障而中断工作流的接口与交易对手数量。公开财务证据有限，进一步限制投资评估。Forge
              显示私有市场活动有限，其 2025 年 7 月页面快照没有提供当前价格或总融资额。这证明的是二级市场不透明，不是现金消耗、现金跑道或公允价值；这些数量仍属于私有证据缺口。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR015
              - CR016
