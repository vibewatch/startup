      - number: '4.2'
        title: 成本结构、毛利率驱动因素与市场进入
        blocks:
          - type: paragraph
            body: >-
              这套成本结构直接反映企业级金融和环境市场基础设施的运营现实。注册表服务需要云原生托管、高吞吐数据库运行和 SOC 2 Type II 认证的安全控制，以支持每年转移超过 10 亿个环境资产
              [CI008]。毛利率由两类业务拉开：软件驱动的注册表和数据运营天然拥有较高的增量软件毛利率；经纪执行则要承担监管合规、经纪人员薪酬和注册经纪交易商实体的许可成本 [CI001, CI002]。Xpansiv
              依靠直接机构企业销售，目标客户包括合规买方、企业可持续发展团队、公用事业电力交易员和商品经纪商 [CI006]。由于 ERP、ETRM 和风险管理整合复杂，注册表采用及多资产 Connect
              企业整合通常跨越多个季度 [CI002, CI008]。客户获取成本（CAC）、销售周期和净收入留存率（NRR）仍未披露，构成机构尽调的评估缺口 [CI007]。
            claimRefs:
