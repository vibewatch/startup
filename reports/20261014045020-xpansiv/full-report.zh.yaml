figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 塑造 Xpansiv 多资产环境商品基础设施平台的战略性公司里程碑。
    data:
      items:
        - label: 多资产登记规模（2020—2024）
          date: 2020-2024
          detail: Xpansiv 将其全球登记网络扩大到 2024 年全球 REC 签发量的 31%。
          tone: positive
        - label: APX 收购与电力扩张（2022）
          date: '2022'
          detail: 收购 APX，拓展到批发电力基础设施，为 ERCOT 和 CAISO 超过 20% 的储能提供服务。
          tone: positive
        - label: Evolution Markets 收购（2023）
          date: '2023'
          detail: 收购 Evolution Markets 经纪业务，累计名义交易价值超过 $800B。
          tone: positive
        - label: Evident I-REC 收购（2023）
          date: '2023'
          detail: 收购总部位于英国的 Evident，运营覆盖欧洲和亚洲的国际 I-REC(E) 登记网络。
          tone: positive
        - label: 品牌统一与平台里程碑（2025 年 12 月）
          date: 2025-12
          detail: 将登记处、电力、CBL 和 Connect 旗下的被收购实体统一到 Xpansiv 品牌之下。
          tone: neutral
        - label: MSCI 完整性标准评估（2025 年 9 月）
          date: 2025-09
          detail: MSCI 的独立研究指出，自愿碳市场存在交付延迟和治理缺口。
          tone: warning
        - label: enechain 与 JCEX 集成（2026 年 5 月）
          date: 2026-05
          detail: 上线实时市场数据和订单集成，将 CBL 与日本气候交易所连接起来。
          tone: positive
        - label: Verdane 战略融资（2026 年 9 月）
          date: 2026-09
          detail: Verdane 牵头大额融资，为持续全球收购和技术平台扩张提供资金。
          tone: positive
    approximationNotes: 里程碑日期和交易估值来自公开公告及投资者新闻稿。
    claimRefs:
      - CO008
      - CO010
      - CO011
      - CO012
      - CO013
  - id: FM001
    title: 非加总的市场规模与采用视角
    type: pyramid
    summary: 六项有来源支持的指标分别展示市场活动、运营覆盖、预测需求、当前碳市场规模和一个客户 ROI 示例，不将其 作为 TAM、SAM 和 SOM。
    data:
      items:
        - label: Xpansiv 促成的年度商品及衍生品流转
          value: 200
          unit: $B+
          detail: 公司报告的名义总流量；不是收入或 TAM
          tone: neutral
        - label: Xpansiv 登记处支持的可再生能源发电能力
          value: 320
          unit: GW+
          detail: 公司发布的 2026 年披露，覆盖 60 多个国家
          tone: neutral
        - label: Xpansiv 登记处管理的全球 2025 年 REC 签发份额
          value: 28
          unit: '%'
          detail: 公司发布的运营份额；不是收入份额
          tone: neutral
        - label: 2030 年碳信用市场预测
          value: 50
          unit: $B+
          detail: Reuters Plus 引用的 TSVCM 估计
          tone: neutral
        - label: 2024 年报告的全球碳信用市场
          value: 1.4
          unit: $B
          detail: Reuters Plus 报告称注销量持平，平均现货价格下降 20%
          tone: risk
        - label: 某公司案例中的采购成本降幅
          value: 12
          unit: '%'
          detail: Xpansiv 报告的《财富》100 强能源公司案例，基准未披露
          tone: positive
    approximationNotes: 数值保留各自不同的单位和分母，不构成可加总或成比例的金字塔层级。$50B 预测、报告的 $1.4B 市场、 $200B 平台名义交易额、320 GW 产能、28% 签发份额和案例中的 12% 结果，是彼此独立的观察视角。
    claimRefs:
