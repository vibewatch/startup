        title: 监管、法律与市场可信度敞口
        blocks:
          - type: paragraph
            body: >-
              最明显的结构性风险不是已有针对 Xpansiv 的执法行动，而是公司依赖自己无法控制的规则和市场信心。Xpansiv 称其 Evolution Markets 子公司已在 CFTC、NFA 和 UK FCA
              注册，而收购的 Evident 注册表仍受 I-TRACK Foundation 监督。这些安排能够缓释风险，但也带来持续的牌照、行为和认证依赖。自愿碳板块还面临独立的需求质量风险：MSCI
              指出交付延迟和治理缺口，Ecosystem Marketplace 报告 2024 年交易量下降 25%，Reuters Plus 则描述了市场信心危机。这些市场层面的发现不能证明 Xpansiv
              违规或收入下滑，但确立了其碳基础设施所处的不利环境。
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
