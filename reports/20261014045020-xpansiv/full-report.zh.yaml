chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司定位与市场基础设施角色
        blocks:
          - type: paragraph
            body: >-
              Xpansiv
              是全球领先的环境商品和能源转型商品市场基础设施平台。它并非只做本地经纪或单一资产交易所，而是搭建了覆盖证书注册表、现货交易执行、批发电力软件和数字化投资组合管理的完整多资产运营栈。公司总部位于旧金山，并在阿尔伯克基、西雅图和悉尼设有主要运营中心，为全球超过
              100,000 家企业、政府、公用事业和零售参与者提供服务。其技术核心支持在五大洲签发、交易和注销可再生能源证书、碳抵消额度、清洁燃料和水属性，使公司成为企业实现净零合规的重要通道。
            claimRefs:
              - CO001
              - CO002
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO007
              - CO009
              - CO014
      - number: '1.2'
        title: 管理层与组织治理
        blocks:
          - type: paragraph
            body: >-
              Xpansiv 由首席执行官 John Melby 领导。他是经验丰富的环境商品和电力市场高管，曾负责将 APX、Evolution Markets 和 Evident 整合为统一运营平台。Melby
              的战略重点是推动平台融合，把分散的区域环境注册表标准化为互联交易网络。首席商务官 Ben Stuart 负责商业战略，主导全球机构合作、国际市场数据分发，以及东京 enechain 和 JCEX
              等跨境交易所整合项目。主要机构金融赞助方和 Verdane 等专业成长股权合作伙伴对治理影响很大，确保收购执行保持连续性和纪律性。
            claimRefs:
              - CO005
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
      - number: '1.3'
        title: 资本结构与投资者联盟
        blocks:
          - type: paragraph
            body: >-
              Xpansiv 背后是一批一级机构投资者、全球投行和战略能源企业组成的投资者联盟。主要机构赞助方包括 Blackstone Group，战略资产负债表投资者还包括 Bank of America、Goldman
              Sachs、Macquarie Group、Aramco Ventures、S&P Global Ventures、BP Ventures、Aware Super 和 Australian Clean
              Energy Finance Corporation。2026 年 9 月，欧洲成长型收购专家 Verdane 领投一轮重大战略融资，用于加快 Xpansiv 的国际收购计划。这批顶级支持者说明市场认可
              Xpansiv 的基础设施护城河，但公司的私有财务仍不透明，投后估值倍数、流动性优先权和分部盈利能力均未披露。
            claimRefs:
              - CO003
              - CO007
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO007
      - number: '1.4'
        title: 平台里程碑、整合与可信度挑战
        blocks:
          - type: paragraph
            body: >-
              过去四年，Xpansiv 通过连续收购快速扩张：收购 APX 以获得领先的批发电力注册表能力，收购 Evolution Markets 以承接超过 $800 billion 的名义交易执行量，收购 Evident
              以运营国际 I-REC 注册表。到 2026 年末，Xpansiv 网络支持超过 320 GW 的注册可再生能源容量，管理着 2025 年全球签发 REC 的约 28%。2026 年 5 月，公司通过在 CBL
              与 enechain 的 JCEX 之间部署实时数据和订单路由连接，扩大了亚太业务。但更广泛的环境市场背景仍充满挑战：MSCI Carbon Markets
              的独立研究指出，自愿碳信用面临交付延迟和可信度问题等系统性阻力，进一步凸显可验证注册表严谨性的必要性。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO008
              - CO010
              - CO011
              - CO012
              - CO013
      - number: '1.5'
        title: 展示
        blocks:
          - type: callout
            title: 多资产注册表与交易所架构
            body: Xpansiv 已成功从孤立的现货交易场所转型为环境商品的重要基础设施层。平台掌控注册表、市场执行和投资组合连接，因此能让机构市场参与者形成很强的使用黏性。
            calloutType: insight
            claimRefs:
              - CO001
              - CO004
          - type: callout
            title: 综合财务不透明与自愿碳市场阻力
            body: Xpansiv 在可再生能源注册表领域展现出难以匹敌的运营规模，但持续存在的私有财务保密和更广泛的自愿碳市场可信度挑战，要求对单独业务单元经济性和现金跑道进行彻底尽调。
            calloutType: risk
            claimRefs:
              - CO013
              - CO014
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场是用于签发、跟踪、转移、交易、结算、分析和注销环境商品的基础设施。Xpansiv
              覆盖清洁电力和可再生能源证书、碳与排放、清洁燃料、水和再生材料，通过注册表、市场、执行服务、投资组合软件、电力运营和市场数据交付。这个市场边界包含记录系统、连接、执行、托管工作流和数据的费用，但不包括实体电力、燃料、发电资产和减排项目本身的价值。当前主流仍是碎片化工作流：直接登录注册表、双边执行、手工转移、电子表格对账和独立报告系统。因此，Xpansiv
              报告的年度商品流动量只是活动代理指标，不是收入或可服务软件支出。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
      - number: '2.2'
        title: 市场规模口径及其局限
        blocks:
          - type: paragraph
            body: >-
              留存资料没有为 Xpansiv 综合性的注册表、交易所、经纪、电力、软件和数据业务提供可靠的 TAM、SAM 或 SOM。现有最佳口径使用的分母各不相同。公司事实表称，每年有超过 $200 billion
              的商品和衍生品通过 Xpansiv 基础设施流动，但这只是总名义活动量，不是收入。公司发布的 2026 年公告称，其注册表覆盖超过 320 GW 的可再生能源容量，占 2025 年全球 REC 签发量的
              28%，这说明的是运营覆盖，而非可变现支出。另有 Reuters Plus 引述的行业预测预计，2030 年碳信用市场将超过 $50 billion；Reuters Plus 同时称，2024 年该市场规模约为
              $1.4 billion，注销量持平、现货价格下降 20%。这些口径不能相加。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM014
      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Xpansiv
              已披露的用户包括能源交易员、风险管理人员、企业可持续发展团队、分析师、投资者、电力市场参与者，以及生产证书的家庭和企业。工作流从资产或项目注册开始，经过签发和市场接入，最终完成转移、结算、注销、对账和报告。买方可能先采用单个模块，再整合更多生命周期环节：Connect
              至少连接 15 个注册表和交易平台，Data 则通过 API、SFTP、云数据仓库和网页工具交付。其经济价值逻辑合理，但证据很薄。Xpansiv 引用过一家《财富》100 强能源公司的案例，称采购成本下降
              12%；但未说明客户身份、基线、测量周期、合同金额，也未说明该结果是否具有代表性。
            claimRefs:
              - CM004
              - CM005
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM014
              - CM015
      - number: '2.4'
        title: 增长驱动、约束与尽调含义
        blocks:
          - type: paragraph
            body: >-
              报告和合规需求有利于可审计基础设施，更广的资产覆盖和注册表连接也能减少运营碎片化。但碳市场增长并不是统一的需求顺风。Reuters Plus 描述了信心危机、标准碎片化以及法律和声誉担忧；MSCI
              表示，可信度仍是扩大市场的核心，并指出交付延迟和治理缺口。对高可信度资产的需求可能利好注册表、评级、数据和审计工作流，但当合格供给稀缺时，也可能压低交易量。估值缺口的核心在于转化：留存资料没有披露按产品划分的收入、费率、抽成率、经常性与交易性收入结构、客户集中度或续约行为。没有这些数据，市场名义规模、证书数量和连接容量都无法证明
              Xpansiv 的收入机会或可实现份额。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 基础设施敞口不止于自愿碳市场
            body: Xpansiv 的产品范围包括可再生能源证书、电力、清洁燃料、水、注册表、执行、投资组合软件和数据。这种广度降低了公司对单一自愿碳需求预测的依赖，但各产品的收入敞口仍未披露。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: callout
            title: 市场活动不能证明可变现份额
            body: 大额名义流量、连接容量和证书签发量可以说明基础设施的重要性，但没有费率、抽成率、分部收入和留存数据，就无法支持精确的 SAM、SOM 或估值倍数。
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM008
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局：直接同行、现有交易所与经纪商
        blocks:
          - type: paragraph
            body: >-
              环境商品交易格局包括专业现货平台、现有衍生品交易所、传统银行间经纪商，以及根深蒂固的手工采购现状。Xpansiv 的差异化在于：通过 CBL 整合实体现货执行，通过 Evolution Markets
              提供机构级语音经纪，再通过 Connect 同步投资组合。AirCarbon Exchange（ACX）和 Climate Impact X（CIX）等直接竞争者主要聚焦数字化碳现货合约，缺少 Xpansiv
              的多注册表基础设施、可再生能源证书（REC）规模和电力软件能力。与此同时，Intercontinental Exchange（ICE）等现有商品交易所凭借巨大的金融清算流动性，主导标准化合规排放期货（如
              European Union Allowances 和 California Carbon
              Allowances），但实体注册表级资产管理和分布式可再生能源证书聚合仍交给专业基础设施运营商。对许多企业采购团队而言，通过电子表格和定制合同管理的双边场外交易仍是主要现状替代方案；它避开集中交易所费用，却付出结算摩擦高、价格发现不透明的代价。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
      - number: '3.2'
        title: 能力差异化：多注册表连接与功能矩阵
        blocks:
          - type: paragraph
            body: >-
              Xpansiv 对专业现货场所和语音经纪商的主要运营壁垒，在于端到端软件与注册表整合。平台通过 Xpansiv Connect 原生连接 15 个以上全球注册表，覆盖自愿碳信用、合规
              REC、数字燃料和水属性。这个多注册表骨干自动处理证书转移、注销和余额对账，消除了现状电子表格工作流中的手工摩擦。相比之下，ACX
              等专业现货场所提供订单撮合引擎，却要求参与者自行管理外部注册表转移。此外，Xpansiv 收购 APX（现为 Xpansiv Power）和 SRECTrade（现为 Xpansiv Managed
              Solutions）后，运营范围扩展到批发电力调度和分布式太阳能证书聚合，服务超过 125,000 个账户。Calyx Global、Sylvera 和 MSCI Carbon Markets
              等独立评级机构提供项目可信度评估，却没有原生执行和结算通道。Xpansiv 将 CBL 与 Evolution Markets
              的交易基准价格直接嵌入数据产品，打通前台交易、中台合规和可持续发展报告，形成连贯工作流。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP010
              - CP012
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP011
              - CP013
      - number: '3.3'
        title: 定价架构、打包模式与切换动态
        blocks:
          - type: paragraph
            body: >-
              环境商品的商业变现结合了按量计费的现货交易所费用、交易型经纪佣金和经常性企业软件订阅。Xpansiv 的基础设施打包方式包括对 CBL 现货交易收取单笔费用、通过 Evolution Markets
              收取经纪佣金，以及为 Connect 投资组合管理和市场数据源收取年度订阅费。相比之下，ICE 等现有衍生品场所按合约收取标准化清算费，ACX
              等专业碳平台则主要向做市商和吃单方收取按吨执行费。双边现状交易虽然避开了显性的交易所技术费，却要承担更宽的交易商买卖价差、更高的交易对手风险和大量法律成本。成熟 Xpansiv
              企业客户的切换成本在结构上很高：整合多注册表 API 连接器、建立符合 SOC 2
              的自动审计轨迹，并把历史资产注销日志同步到企业资源规划（ERP）系统，都会形成实质性的技术和行政锁定，降低客户在未整合现货场所之间多平台使用的意愿。
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP006
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP006
              - CP012
      - number: '3.4'
        title: 护城河持续性、监管变化与市场可信度阻力
        blocks:
          - type: paragraph
            body: >-
              尽管 Xpansiv 已在 $525 million 机构资本以及 Blackstone、Bank of America 和 Goldman Sachs
              战略支持下建立广泛基础设施，其护城河的持续性仍面临严峻的宏观经济和监管考验。自愿碳市场明显放缓，市场规模停留在约 $1.4 billion，平均现货信用价格在可信度争议和对历史项目方法论的审查后下跌
              20%。Ecosystem Marketplace 和 MSCI 虽报告买方对高可信度碳移除和获核心碳原则（CCP）认可的信用需求上升，但二级现货场所的交易流动性已从峰值大幅收缩。与此同时，以
              California Assembly Bill 1305 为代表的监管加强，规定未经证实的抵消营销声明每天最高罚款 $2,500，迫使企业买方在交易前要求严格、可审计的验证。这种监管环境强化了对 Xpansiv
              可审计追踪软件的需求，但自愿现货信用长期停滞可能压缩按交易收取的交易所费收入。
            claimRefs:
              - CP005
              - CP007
              - CP008
              - CP009
              - CP010
