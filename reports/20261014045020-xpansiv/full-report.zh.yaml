  - id: FP001
    title: 竞争定位：环境市场范围与基础设施深度
    type: quadrant
    summary: Xpansiv 将多登记处组合软件与多资产执行结合起来，形成差异化定位；传统金融交易所优先发展合规期货， 而细分现货同业仍然狭窄。
    xAxisLabel: 环境工作流与多登记处范围（低至高）
    yAxisLabel: 执行与流动性规模（低至高）
    data:
      points:
        - label: Xpansiv（集成式多资产基础设施）
          x: 8.5
          'y': 8
        - label: Intercontinental Exchange（合规期货领导者）
          x: 4
          'y': 9
        - label: AirCarbon Exchange（专业碳现货平台）
          x: 6.5
          'y': 4.5
        - label: 传统场外经纪商（语音执行台）
          x: 3.5
          'y': 6.5
        - label: Climate Impact X（区域现货交易所）
          x: 5.5
          'y': 4
        - label: 双边 OTC 与电子表格（现状基线）
          x: 2
          'y': 2
    approximationNotes: 坐标代表基于证据的序数评分，反映多登记处整合广度（X 轴）和交易执行量（Y 轴）。
    claimRefs:
      - CP001
      - CP005
      - CP006
      - CP011
      - CP013
  - id: FI001
    title: Xpansiv 商业价值实现架构
    type: flow
    summary: 展示环境商品生成如何经由 Xpansiv 基础设施转化为商业软件收入和交易收入的顺序流程。
    data:
      nodes:
        - id: origination
          label: 资产发起与生成
          unit: Clean Energy & Offsets
          detail: 可再生能源项目、碳项目和工业证书的生成。
        - id: issuance
          label: 登记注册与签发
          unit: Issuance Fees
          detail: 在自有登记处（NAR、TIGR、Evident I-REC）签发，按证书收取费用。
        - id: management
          label: 组合资产同步与管理
          unit: SaaS Subscriptions
          detail: Xpansiv Connect 同步多登记处组合资产，产生年度企业 SaaS 收入。
        - id: execution
          label: 现货交易所与 OTC 执行
          unit: Transaction Fees
          detail: CBL 现货交易和 Evolution Markets 结构化经纪业务，按交易量提取费率收入。
        - id: data-intel
          label: 市场数据与基准
          unit: Data Subscriptions
          detail: 汇总价格标记、实时数据流和基准许可，产生数据 ARR。
        - id: gross-profit
          label: 合并毛利率实现
          unit: Enterprise Gross Profit
          detail: 高毛利软件 / 数据流与可扩展的现货交易量结合。
      edges:
        - from: origination
          to: issuance
          label: 证书注册
        - from: issuance
          to: management
          label: 库存同步
        - from: management
          to: execution
          label: 流动性平台路由
        - from: execution
          to: data-intel
          label: 交易带汇总
        - from: data-intel
          to: gross-profit
          label: 商业变现
    approximationNotes: 展示软件、登记、执行和数据模块中各个顺序变现节点的运营流程。
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI006
      - CI008
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 从环境资产记录，到组合工作流、执行和企业数据消费的概念性运营栈。
    data:
      layers:
        - label: 企业消费
          detail: 交易、风险、可持续发展、会计和报告用户消费组合资产与市场信息。
        - label: 数据交付
          detail: Xpansiv Data 和合作伙伴渠道通过 API、SFTP、云仓库、门户及 Enverus MarketView 分发信息。
        - label: 市场执行与报价
          detail: CBL 提供交易所订单和交易，Evolution Markets 提供经纪现货及远期报价。
        - label: 组合工作流
          detail: Xpansiv Connect 展示持仓，并支持转移、注销、对账、分析和报告任务。
        - label: 登记处连接
          detail: Connect 连接 15 多个登记处和交易平台，覆盖多个环境资产类别。
        - label: 资产与标准基础
          detail: 登记记录、项目方法、保证标准和市场规则决定工具的状态与接受程度。
    approximationNotes: 层级顺序是分析师根据公开产品描述推断的，并非已披露的内部软件架构。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
      - CE010
      - CE011
  - id: FU001
    title: 客户旅程与多资产扩张循环
    type: journey-map
    summary: 展示从单一登记处接入，到自动化多资产组合管理和在 Xpansiv 上进行现货交易的六阶段进程。
    data:
      items:
        - label: 接入与资产登记
          touchpoints:
            - NAR / TIGR / Evident 登记处账户设置
            - 证书签发与项目验证
          action: Customer registers renewable energy or carbon assets in a single tracking registry
        - label: 系统集成
          touchpoints:
            - Xpansiv Connect API 连接
            - 单点登录与基于角色的权限
          action: Customer connects internal ETRM, ERP, and sustainability reporting systems
        - label: 组合管理与结算
          touchpoints:
            - Connect 统一仪表盘
            - 多登记处自动化转移与注销工作流
          action: Operations team tracks real-time positions and automates compliance retirements
        - label: 市场执行与交易
          touchpoints:
            - CBL 现货交易所界面
            - Evolution Markets 结构化经纪接入
          action: Customer executes spot purchases, bilateral contracts, and environmental hedging
        - label: 市场数据与分析
          touchpoints:
            - Xpansiv Data API 和 SFTP 数据流
            - 实时定价基准与远期曲线
          action: Treasury and risk teams evaluate price spreads and model carbon/REC market exposure
        - label: 跨商品扩张
          touchpoints:
            - 核能 EFEC/ZEC 新增品类
            - 水和数字燃料证书交易
          action: Customer expands from carbon or RECs into multi-asset energy transition commodities
    approximationNotes: 各阶段代表依据 Xpansiv Connect、CBL 和登记处产品文档建模的标准企业生命周期。
    claimRefs:
      - CU001
      - CU004
      - CU007
      - CU012
  - id: FR001
    title: 风险热力图：基于证据的剩余风险立场
    type: matrix
    summary: 定性评估将已观察到的市场压力，与无法依据公开证据估计发生可能性的风险区分开来。
    data:
      columns:
        - 可能性证据
        - 实现后的影响
        - 公开缓释证据
      rows:
        - label: VCM 完整性与流动性
          values:
            - 高：市场层面压力
            - 中高
            - 推进中
        - label: 平台中断或对账失败
          values:
            - Unknown
            - 高
            - 中等
        - label: 许可或认证限制
          values:
            - Unknown
            - 高
            - 中等
        - label: 收购整合延迟
          values:
            - Unknown
            - 中高
            - 推进中
        - label: 财务跑道或融资压力
          values:
            - Unknown
            - 高
            - 公开信息可见度低
        - label: 企业数据流中断
          values:
            - Unknown
            - 中高
            - 多个交付渠道
    approximationNotes: 序数标签是分析师仅依据留存来源作出的评估，不是概率、事件发生率或经审计的控制评分。
    claimRefs:
      - CR003
      - CR004
      - CR007
      - CR009
      - CR011
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 从已验证的运营规模和宏观逆风，到最终估值立场的分析链条。
    data:
      nodes:
        - id: scale-anchor
          label: 登记与市场规模
          description: 控制全球 REC 的 28% 和 320+ GW 发电能力，覆盖 60 个国家。
        - id: ma-aggregation
          label: 并购平台建设
          description: 将 APX、Evolution Markets 和 Evident 汇聚为统一的市场基础设施。
        - id: capital-infusion
          label: 增长资本伙伴
          description: Verdane 于 2026 年 9 月牵头大额融资，支持全球收购。
        - id: macro-headwinds
          label: VCM 市场收缩
          description: 2024 年碳交易量下降 25%，买方对完整性的审查持续。
        - id: financial-opacity
          label: 披露与损益表不透明
          description: 公开信息中没有经认证的收入、利润率或优先权结构披露。
        - id: final-posture
          label: 继续研究与公允立场
          description: 以 $1.4B 基准维持继续研究立场和公允估值立场。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV009
      - CV012
      - CV014
