      - number: '7.4'
        title: 缓释措施、监测指标与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              缓释措施的成熟度并不一致。监管注册、I-TRACK 监督、安全控制、审计日志和自动结算都是具体的公开指标，但大多由 Xpansiv
              或联合公司公告描述，而非独立保证。因此，应通过可能证伪投资论点的证据进行监测：重大牌照或注册表认证丧失或受限；反复发生重大中断或无法对账的转移；碳市场交易量持续收缩，却没有
              REC、电力、数据或托管解决方案增长抵消；或者融资条款显示流动性不足。指定证据没有显示这些事件已经发生。近期正确做法是在认定剩余风险已受控前，要求完成一手监管核查、独立控制报告、分部经济性、集中度明细和事件指标审查。
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR008
              - CR009
              - CR011
              - CR015
              - CR016
      - number: '7.5'
        title: 展示
        blocks:
          - type: callout
            title: 市场疲弱可观察，但 Xpansiv 的具体敏感性不可见
            body: 独立来源记录了自愿碳交易量下降和持续的可信度担忧，但指定公开证据没有披露 Xpansiv 的收入结构或对这些条件的敏感性。
            calloutType: risk
