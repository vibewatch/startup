      - number: '7.2'
        title: 运营韧性与整合风险
        blocks:
          - type: paragraph
            body: >-
              Xpansiv 将 Connect 定位为覆盖注册表、交易所、报告系统和内部企业工具的高吞吐整合层。公司材料称，该系统每年转移约 one billion 个资产，使用 SOC 2
              认证云基础设施，并提供认证、加密、审计日志和 API
              连接。这些控制能降低手工处理和对账风险，但由于它们来自公司自身，不能独立证明可用性、恢复表现或事件历史。将被收购业务纳入统一品牌，也增加了注册表、交易、经纪、电力和数据工作流的执行复杂度。重大中断、对账错误或整合延迟可能同时影响多个产品；公开指定证据没有量化服务水平表现，也没有证明所有收购平台共用相同控制环境。
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
