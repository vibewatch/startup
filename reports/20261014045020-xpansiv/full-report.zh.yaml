  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与商业变现
        blocks:
          - type: paragraph
            body: >-
              Xpansiv 的市场基础设施变现主要来自三类收入：按量收取的现货交易所执行费、注册表基础设施的软件即服务（SaaS）和签发费，以及面向专有环境市场数据的经常性企业订阅费 [CI001,
              CI002]。现货交易执行以 CBL 为核心；CBL 是主要流动性场所，自 2020 年以来已完成超过 330 million 个碳信用和 14 million
              个可再生能源证书（REC）及能源属性证书（EAC）交易 [CI003]。CBL 采用交易费模式，在自愿碳抵消额度和清洁能源证书交易中按量收取经纪及交易佣金 [CI001]。Evolution Markets
              提供并行执行服务，促成双边场外交易和结构化环境商品交易 [CI001]。注册表基础设施收入来自合规和自愿注册表的软件许可及资产生命周期费用，包括 NAR、TIGR 和 Evident I-REC(E) 网络
              [CI004, CI005]。最后，Xpansiv Data 通过 API、SFTP 和云数据仓库向企业风险管理人员和商品交易员提供基准价格、历史数据集和实时交易流，由此产生经常性订阅收入
              [CI006]。但实现费率、费率表和合同规模仍属私有信息 [CI007]。
