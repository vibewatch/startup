callouts:
  - calloutType: insight
    title: Multi-Asset Registry and Exchange Architecture
    body: >-
      Xpansiv has successfully transitioned from an isolated spot trading venue into an essential infrastructure layer
      for environmental commodities. By controlling registries, market execution, and portfolio connectivity, the
      platform creates significant stickiness across institutional market participants.
    claimRefs:
      - CO001
      - CO004
  - calloutType: risk
    title: Consolidated Financial Opacity and Voluntary Carbon Headwinds
    body: >-
      While Xpansiv demonstrates unmatched operational scale across renewable registries, persistent private financial
      confidentiality and broader voluntary carbon market integrity challenges require thorough diligence on standalone
      unit economics and cash runway.
    claimRefs:
      - CO013
      - CO014
