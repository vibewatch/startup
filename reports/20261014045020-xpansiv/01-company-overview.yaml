    title: Company Milestone Timeline
    type: timeline
    summary: Strategic corporate milestones shaping Xpansiv's multi-asset environmental commodities infrastructure platform.
    data:
      items:
        - label: Multi-Asset Registry Scale (2020-2024)
          date: 2020-2024
          detail: Xpansiv scaled its global registry network to issue 31% of worldwide RECs in 2024.
          tone: positive
        - label: APX Acquisition & Power Expansion (2022)
          date: '2022'
          detail: Acquired APX, expanding into wholesale power infrastructure serving over 20% of ERCOT and CAISO storage.
          tone: positive
        - label: Evolution Markets Acquisition (2023)
          date: '2023'
          detail: Acquired Evolution Markets brokerage, facilitating over $800B in cumulative notional transaction value.
          tone: positive
        - label: Evident I-REC Acquisition (2023)
          date: '2023'
          detail: Acquired UK-based Evident to operate the international I-REC(E) registry network across Europe and Asia.
          tone: positive
        - label: Brand Unification & Platform Milestones (Dec 2025)
          date: 2025-12
          detail: Unified acquired entities under the Xpansiv brand across registries, power, CBL, and Connect.
          tone: neutral
        - label: MSCI Integrity Standards Assessment (Sep 2025)
          date: 2025-09
          detail: Independent MSCI research highlights delivery delays and governance gaps in voluntary carbon markets.
          tone: warning
        - label: enechain & JCEX Integration (May 2026)
          date: 2026-05
          detail: Launched real-time market data and order integration connecting CBL with Japan Climate Exchange.
          tone: positive
        - label: Verdane Strategic Capital Raise (Sep 2026)
          date: 2026-09
          detail: Verdane led major capital raise to fund continued global acquisitions and technology platform scaling.
          tone: positive
