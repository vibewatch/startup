coverageNotes: >
  Public evidence is strong on Astrotalk's product scope, scale claims, named
  funding rounds, FY23-FY25 revenue and profitability, the August 2026 ESOP-buyback
  unicorn mark, and the competitive and regulatory backdrop (including the dismissed
  CCI Case No. 22 of 2024). Private-company filings on TheCompanyCheck and Tijori
  corroborate the FY25 revenue base. Evidence is materially weaker on audited unit
  economics, cohort retention, take-rate structure, and the final terms of the
  reported pre-IPO round; many operating metrics remain self-reported ahead of an
  IPO-grade audit. The $1B figure derives from an internal buyback rather than an
  arm's-length primary round, so it is best read as a defensible internal reference
  price rather than external price discovery.
