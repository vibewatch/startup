  topStrengths:
    - Astrotalk 已经稳稳盈利，FY25 收入约 Rs 1,176-1,214 crore（约 $141M），税前利润约 Rs 285 crore（PBT 利润率约 24%）；在印度高增长消费创业公司里，这很少见。
    - 公司主导印度在线占星市场，估计份额达 80-85%；行业仍以约 49% CAGR 复合增长，公司收入也还在同比增长约 80%。
    - 资本效率极高：外部融资只有约 $34M，却拼出约 $1B 价值；独角兽估值靠利润支撑，而不是靠持续稀释堆出来。
    - 平台已做出 60M+ 注册用户、100M+ 下载量和每月约 4M 次付费咨询；80%+ 收入来自复购用户，Google Play 评分为 4.6 星。
    - Astrotalk Store（灵性消费电商）和海外印度侨民市场把模型拉宽，不再只靠单一咨询收入线。
  topRisks:
    - 约 80% 收入集中在印度，需求又属于可选、信念驱动型消费，盈利容易受情绪、宏观周期和品类公信力牵动。
    - 多个核心运营指标在 IPO 级审计前仍靠公司自报；$1B 标记来自内部 ESOP 回购，不是独立定价轮。
    - 品类监管还在变化中，涉及 DPDP Act 2023、ASCI 广告规范和消费者保护；InstaAstro 在 2024 年向 CCI 提起反垄断投诉，虽然后来被 CCI 驳回。
    - 以约 7x FY25 收入计，Astrotalk 已按增长定价，明显高于上市服务型市场平台可比公司（Angi、Upwork 约 1-4x）；一旦放缓，倍数会被放大压缩。
    - 公司依赖创始人兼 CEO Puneet Gupta；产品质量和退款投诉反复出现，AWS/Agora 与应用商店平台依赖也增加运营和声誉风险。
  unresolvedGaps:
    - 审计财务报表尚未公开，FY25 收入、利润率和收入运行率仍来自公司自报，无法独立验证。
    - 支撑 80%+ 复购收入说法的队列留存、流失率和类 NRR 指标尚未披露。
    - 市场平台和电商商店的抽佣结构、单位经济模型没有公开拆分。
    - 据报道，公司拟以 $1.3-1.5B 估值完成 Rs 429 crore pre-IPO 轮；最终条款、稀释比例和优先股堆叠仍未确认。
    - 公司在 DPDP Act 和 ASCI 规范下的数据保护、广告合规安排没有公开文件说明。
