summary:
  headline: |
    Astrotalk 是少见的盈利型、品类主导型消费市场平台；基准情景下，$1B 独角兽估值站得住，但指标主要靠自报、收入集中在印度、品类建立在信念消费上，入场要守纪律，不能盲追。
