- id: adoption-journey
  title: Adoption trajectory and customer journey
  body: Astrotalk's adoption has scaled in step with its revenue, and the typical journey is well defined even if the underlying analytics are private. Users discover the app through free tools such as free Kundli, horoscopes and Panchang, through app-store search, and through word of mouth; they register via OTP, take a discounted first consultation with an AI-matched astrologer, and, for a large share, return for repeat sessions during subsequent life events. The company reports roughly 4 million paid sessions per month, and its cross-platform presence on both Google Play and the Apple App Store, including a US listing, supports both domestic and diaspora reach. Acquisition appears largely organic and content-and-brand led, which, combined with repeat-driven demand, keeps effective acquisition costs low because returning users require little re-acquisition spend. The Astrotalk Store adds an expansion step, with around 1.6 million orders in 2025 showing meaningful cross-sell from consultations into commerce. The trajectory is therefore one of broad top-of-funnel acquisition converting into a durable, repeat-spending core.
