chapter:
  number: 6
  title: Customers
  summary: Astrotalk serves a mass-market consumer base of more than 60 million registered users and 100 million+ downloads, skewing female (~54%) and toward the 25-34 age group, with roughly 20% of revenue from an international diaspora. Adoption is repeat-driven, with more than 80% of revenue said to come from returning users and about 4 million paid sessions a month, but customer proof is aggregate and review-based rather than named, and quality complaints temper the satisfaction picture.
sections:
- id: segmentation
  title: Customer base and segmentation
  body: Astrotalk is a mass-market consumer product rather than a B2B platform, so its customer base is best understood through demographics, geography and use case. The company reports more than 60 million registered users and over 100 million cumulative downloads across Google Play and the Apple App Store. The base skews female, at roughly 54%, and concentrates in the 25-34 age group, which forms about a third of users and aligns with life-decision moments around marriage and career that drive consultations. Geographically, roughly 80% of revenue is domestic Indian, with about 20% from an international diaspora spanning the US, UK, Canada, West Asia and Australia that tends to spend at higher effective rates. Functionally, users cluster into marriage and relationship seekers, career and finance decision-makers, wellbeing seekers and, increasingly, spiritual-commerce buyers who purchase gemstones and rudraksha. Most of these splits are company-claimed and only loosely corroborated by third-party traffic data, so they are treated as directional rather than precise, but the overall shape, a young, female-leaning, India-centric mass audience, is consistent across sources.
