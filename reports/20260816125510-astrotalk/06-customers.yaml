  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention and cohort metrics
    missingEvidence: Astrotalk does not disclose churn, cohort retention or NRR-equivalent metrics for its user base.
    whyItMatters: Repeat-revenue claims cannot be independently verified without cohort data, weakening durability assessment.
    diligencePath: Request cohort retention and repeat-purchase analytics from management.
    relatedQuestionRefs:
    - QU013
    - QU025
    relatedTableRefs:
    - TU004
  - type: enumeration-incomplete
    severity: minor
    topic: named customer proof
    missingEvidence: As a consumer marketplace, Astrotalk has no named enterprise references; proof is limited to ratings, testimonials and partner case studies.
    whyItMatters: The absence of named references makes proof harder to audit than in B2B contexts.
    diligencePath: Corroborate scale via third-party app-intelligence and traffic data.
    relatedQuestionRefs:
    - QU009
    - QU022
    relatedTableRefs:
    - TU003
  - type: conflicting-data
    severity: minor
    topic: self-reported user metrics
    missingEvidence: Headline user, session and repeat-rate figures are company-claimed and vary across sources.
    whyItMatters: Overstated metrics would inflate the perceived customer base and retention.
    diligencePath: Verify against Similarweb, app-store and Business of Apps data.
    relatedQuestionRefs:
    - QU021
acknowledgedWarnings:
- dimension: paywallRisk
  reason: Customer evidence draws on review and app-intelligence platforms (Trustpilot, Apple App Store, Similarweb, Business of Apps) that render client-side and register as JS-only; accessible Sitejabber testimonials, Google Play data and press reporting corroborate the same adoption and satisfaction picture, so the JS-only share is not material.
