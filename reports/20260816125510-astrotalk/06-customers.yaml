- id: proof-satisfaction
  title: Customer proof, satisfaction and retention
  body: 'Because Astrotalk is B2C, customer proof takes the form of aggregate ratings, testimonials and partner references rather than named enterprise customers. The strongest signals are a 4.6-star Google Play rating across a large review volume and Astrotalk''s role as a named customer in Agora''s real-time communication case study; independent review platforms such as Sitejabber and Trustpilot carry positive testimonials praising astrologer accuracy, ease of use and emotional reassurance. Retention is evidenced indirectly: management says more than 80% of revenue comes from repeat users, which points to durable engagement despite low switching costs, and repeat-driven demand is the backbone of the business. The evidence has real limits, however. Formal churn, cohort retention and NRR-equivalent metrics are not disclosed, headline user and session figures are self-reported and vary across sources, and review platforms plus community discussions on Reddit surface recurring complaints about consultation quality, billing and refunds. The net picture is a broadly satisfied, repeat-heavy base with genuinely positive sentiment, but one where proof is volume- and review-based and key retention metrics remain a diligence gap.'
