- id: expansion-concentration
  title: Expansion levers and concentration risk
  body: Astrotalk's customer economics point to clear expansion levers alongside real concentration risks. On the upside, revenue per user grows through repeat consultations and cross-sell into the commerce store, and the international diaspora, though only about 20% of revenue today, spends at higher effective rates and offers a growth vector that partially diversifies the base. On the downside, roughly 80% of revenue is concentrated in India, creating geographic dependency, and distribution runs through the Google and Apple app stores, exposing the business to platform-policy and fee risk. There is no customer-concentration risk in the classic sense, since no single user matters, but the flip side is that proof rests entirely on volume and ratings rather than referenceable accounts. Management can mitigate concentration by scaling the diaspora and commerce segments, but until churn and cohort data are disclosed, the durability of expansion remains partly assumed. Overall, the customer base is a strength, large, young and repeat-driven, tempered by India concentration, channel dependence and self-reported metrics that warrant verification.
  claimRefs:
