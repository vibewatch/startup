- id: architecture
  title: Architecture and operating model
  body: 'Astrotalk''s platform is a cloud-native, microservices application delivered through native iOS and Android apps. The defining technical component is real-time communication: live voice and video consultations are powered by Agora''s RTC platform, which Astrotalk highlights in a partner case study, while text chat provides a lighter-weight modality. The backend is reported to run on AWS with auto-scaling so the service can absorb demand spikes, and the platform is said to handle more than 10,000 concurrent consultation sessions. On top of this sits an intelligence layer: an AI-powered recommendation engine matches users to suitable astrologers, and the company says it applies AI to operational tasks such as routing, nudges and content generation to improve efficiency. Much of this detail is sourced from partner case studies and developer write-ups rather than direct company disclosure, and the official product pages are JS-rendered, so specifics should be treated as directional. Even so, the architecture described is a conventional, scalable consumer-marketplace stack augmented with real-time media and machine-learning matching.'
  claimRefs:
  - CE006
  - CE007
  - CE008
