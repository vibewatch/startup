company:
  name: Astrotalk
chapter:
  number: 5
  title: Product & Technology
  summary: 'Astrotalk is a native mobile astrology marketplace: users pick a verified astrologer and consult over chat, voice or video across Vedic astrology, Kundli, matching, tarot, numerology and Vastu, with free tools and an e-commerce store as on-ramps and cross-sells. The stack is AWS cloud-native and microservices-based, uses Agora for real-time voice/video, adds an AI recommendation and routing layer, and handles 10,000+ concurrent sessions with OTP auth and encrypted communications.'
sections:
- id: product-definition
  title: Product definition and module map
  body: 'In customer-workflow terms, Astrotalk is a native mobile app where a user with a question about marriage, career, relationships or wellbeing browses verified astrologers, checks ratings and price, and connects on demand over chat, voice or video. The service spans Vedic astrology, Kundli birth charts, Kundli matching for marriage compatibility, tarot, numerology, Vastu and palmistry, with dedicated reading categories for love, marriage, career and moon-sign guidance. A layer of free tools, notably free Kundli, daily horoscopes and Panchang, acts as the top of the funnel, drawing users in before they convert to paid sessions. Beyond consultations, Astrotalk runs an e-commerce store selling gemstones, rudraksha and spiritual products, plus a certified-gemstone line, so the product is best understood as three connected surfaces: a consultation marketplace, a free-content engagement layer, and a spiritual-commerce store that monetises the same intent. This breadth lets Astrotalk capture a user at the free-content stage and retain them across repeat consultations and product purchases.'
