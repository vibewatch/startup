- id: trust-safety
  title: Trust, safety, security and quality
  body: 'Astrotalk''s trust and safety posture centres on astrologer vetting, account security and published policies. The company states it verifies astrologers before listing them, maintaining a network of more than 13,000 vetted practitioners, and it secures accounts with OTP-based authentication and claims encrypted communications. It publishes a privacy policy, terms of service and a refund policy covering both consultations and store purchases, and it presents lab certification as a quality signal for gemstone sales. The main weaknesses are evidentiary: there is no public evidence of formal security certifications such as ISO 27001 or SOC 2, nor independent audits of the verification process, which is a notable gap for an IPO-track platform handling sensitive personal data. On the quality side, the app maintains a solid 4.6-star Google Play rating, but reviews nonetheless include recurring complaints about consultation quality, app experience and refund handling, and the physical commerce arm draws product complaints. Trust controls are therefore present and reasonable but only partially evidenced, leaving certification and quality-assurance detail as diligence items.'
