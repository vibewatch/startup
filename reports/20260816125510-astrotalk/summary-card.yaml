summary:
  headline: >
    Astrotalk is a rare profitable, category-dominant consumer marketplace whose $1B unicorn mark is defensible in the
    base case, but reliance on self-reported metrics, India concentration, and a belief-based category argue for entry
    discipline rather than a blind chase.
