company:
  name: Astrotalk
chapter:
  number: 7
  title: Risks
  summary: 'Astrotalk''s principal risks are regulatory and reputational rather than financial: it operates a belief-based service exposed to evolving Indian data-protection (DPDP Act 2023), advertising (ASCI) and consumer-protection rules, faced and won a CCI antitrust complaint in 2024, and carries heavy India revenue concentration (~80%), key-person dependence on CEO Puneet Gupta, dependence on cloud and communication partners (AWS, Agora) and app-store platforms, and recurring product-quality and refund complaints. Its profitability, low external capital and diversified consultation-plus-commerce model materially cushion these risks.'
sections:
- id: overview-ranking
  title: Risk overview and severity ranking
  body: 'Astrotalk''s risk profile is unusual for a fast-growing consumer startup because the binding constraints are regulatory, reputational and concentration risks rather than solvency. The company is profitable, reporting roughly Rs 285 crore of FY25 profit before tax, has raised only about $34 million externally, and funded its 2026 ESOP buyback entirely from profits, so it does not depend on continued dilutive fundraising to survive. That financial strength materially cushions downside and pushes the most consequential risks toward the regulatory and reputational domain: evolving data-protection, advertising and consumer-protection rules, a belief-based service model that attracts credibility scrutiny, heavy India revenue concentration near 80%, and key-person dependence on founder-CEO Puneet Gupta. Ranked by likelihood and impact, data-protection compliance and India concentration sit highest on combined severity, quality and refund complaints are the most frequent, and low-probability but high-impact tail risks include a platform outage at scale or loss of the founder. Residual exposure after mitigants is moderate, dominated by regulatory uncertainty rather than any near-term threat to the earnings base.'
