- id: regulatory-legal
  title: Regulatory and legal risk
  body: 'The regulatory perimeter around paid astrology is the single most important risk axis. In 2024 the Competition Commission of India examined Case No. 22 of 2024, an InstaAstro complaint alleging that Astrotalk poached astrologers, and dismissed it under Section 26(2) in December 2024 after finding no prima facie case; the outcome was favourable but confirmed that Astrotalk''s practices draw competitor and regulator attention. Looking forward, India''s Digital Personal Data Protection Act 2023 is the highest-impact live item: Astrotalk collects sensitive data including birth details and payment information, so consent, security and breach obligations will raise its compliance burden as rules are operationalised. Advertising is constrained by ASCI self-regulation and consumer-protection law against misleading claims, a real exposure for a faith-based service, and refund and billing disputes create ongoing consumer-protection risk. Astrology-specific regulation itself remains unsettled, leaving a latent, hard-to-size risk of future restrictions on paid predictive services. Finally, the planned 2026-27 IPO adds governance, disclosure and SEBI-compliance obligations that a private company avoids.'
