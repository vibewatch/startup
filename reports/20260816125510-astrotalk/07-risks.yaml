- id: financial-mitigation
  title: Financial, model risk and mitigations
  body: 'Astrotalk''s financial and model risks are comparatively contained. Revenue is concentrated roughly 80% in India and demand is discretionary and belief-based, so earnings are sensitive to sentiment and macro cycles, and many operating metrics remain self-reported ahead of IPO-grade audit. Competitive intensity is real given 900-plus spiritual-tech startups and funded rivals, even with Astrotalk''s 80-85% share. Against these, the mitigants are substantial: sustained profitability, low external capital, and a diversified model spanning consultations, the commerce store and international markets partially offset single-line concentration, while a governance build-out and a CFO hire with listing experience strengthen controls ahead of the IPO. For monitoring, investors should watch CCI or consumer-protection actions, app-store rating trends, and India revenue share, and treat clear thesis-break triggers as an adverse DPDP enforcement action, a sustained rating collapse, loss of the founder-CEO, or any slide into sustained losses. Priority diligence asks are audited financials, cohort retention data, astrologer-vetting policies and data-protection compliance documentation, which would resolve the largest remaining open questions.'
