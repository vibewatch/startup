- id: drivers-constraints
  title: Growth drivers and adoption constraints
  body: 'The market''s growth rests on several reinforcing drivers. Rising smartphone and cheap-data penetration keeps expanding the reachable audience, while astrology''s deep cultural embeddedness in Indian decisions around marriage, career and health sustains repeat demand. AI-driven personalization and better astrologer matching are widely cited as raising engagement and are a stated driver in global forecasts, and higher-ARPU diaspora demand adds international upside. More than 900 spiritual-tech startups are reported active in India, signalling both opportunity and intensifying competition. Against these, real constraints temper the story: the belief-based nature of the service creates persistent trust and credibility risk that caps conversion and retention, evolving consumer-protection and advertising norms limit how boldly outcomes can be marketed, and low switching costs with fragmented astrologer supply mean market growth does not automatically accrue to any single platform. Analyst forecasts near a 49% CAGR should also be treated cautiously, as they may bundle adjacent spiritual and wellness spend and overstate the pure online-astrology opportunity.'
