  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market sizing
    missingEvidence: Astrotalk's company-claimed ~$300M run-rate exceeds the ~$163M 2024 India online-astrology market estimate, implying definitional or timing mismatch.
    whyItMatters: Inconsistent denominators make share and TAM capture claims unreliable for valuation.
    diligencePath: Reconcile Astrotalk revenue against a consistent market definition and base year before using share metrics.
    relatedQuestionRefs:
    - QM020
    - QM023
  - type: missing-source
    severity: material
    topic: sizing methodology
    missingEvidence: The underlying methodology and segment definitions behind third-party market forecasts are not fully transparent.
    whyItMatters: Forecast CAGRs near 49% may bundle adjacent spend and overstate the addressable market.
    diligencePath: Obtain the full analyst reports and definitions to validate SAM boundaries.
    relatedQuestionRefs:
    - QM021
    - QM026
  - type: enumeration-incomplete
    severity: minor
    topic: user segmentation
    missingEvidence: Demographic splits (age, gender, geography) rest largely on company-claimed figures.
    whyItMatters: Segment mix affects ARPU and retention assumptions used downstream.
    diligencePath: Request third-party analytics or app-intelligence data to verify demographics.
    relatedQuestionRefs:
    - QM013
