  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited financials
    missingEvidence: No audited full-year P&L or balance sheet is public; figures come from press coverage of filings and company statements.
    whyItMatters: Valuation and margin conclusions rest on unverified numbers without audited accounts.
    diligencePath: Request audited FY25 financial statements and MCA filings.
    relatedQuestionRefs:
    - QI019
    - QI023
    relatedTableRefs:
    - TI005
  - type: conflicting-data
    severity: minor
    topic: FY25 revenue figure
    missingEvidence: FY25 revenue is reported between Rs 1,176 crore and Rs 1,214 crore depending on the source.
    whyItMatters: Different bases change growth and multiple calculations.
    diligencePath: Reconcile to the filed statutory revenue figure.
    relatedQuestionRefs:
    - QI021
  - type: missing-source
    severity: material
    topic: cash, burn and cost structure
    missingEvidence: Cash on hand, burn, runway and the marketing/payout cost split are not disclosed.
    whyItMatters: Capital adequacy and true unit economics cannot be confirmed without them.
    diligencePath: Obtain management accounts detailing cash and cost breakdown.
    relatedQuestionRefs:
    - QI011
    - QI025
    relatedTableRefs:
    - TI004
