chapter:
  number: 4
  title: Financials
  summary: 'Astrotalk is a rare profitable Indian consumer-tech scaler: operating revenue rose from about Rs 283 crore in FY23 to Rs 651 crore in FY24 and roughly Rs 1,176-1,214 crore in FY25, with FY25 profit before tax near Rs 285 crore (a ~24% margin). A high-margin marketplace model, a fast-growing commerce arm and only ~$34M raised let it self-fund growth, though several headline metrics are company-claimed and unaudited.'
sections:
- id: revenue-streams
  title: Revenue streams and pricing model
  body: Astrotalk earns the bulk of its revenue from per-minute paid astrology consultations delivered over chat, voice and video, with the platform retaining a marketplace take rate and astrologers keeping the balance. First sessions are typically free or discounted to acquire users, and repeat customers, said to drive more than 80% of revenue, provide durable monetisation. A second and fast-growing stream is the Astrotalk Store, launched in November 2024, which sells gemstones, rudraksha and other spiritual products and reportedly reached about Rs 140 crore in its first twelve months at roughly Rs 1 crore of daily GMV, implying an annualised run-rate near Rs 300 crore. International users across the US, UK, Middle East and Australia contribute about 20% of revenue at higher effective ARPU. The revenue mix is therefore diversifying from a near-pure high-margin consultation marketplace toward a blend that includes lower-margin physical commerce, a shift that supports growth but modestly dilutes blended margins over time.
