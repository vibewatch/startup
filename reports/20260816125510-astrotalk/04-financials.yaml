- id: traction-growth
  title: Traction and revenue growth trajectory
  body: 'Astrotalk''s financial story is one of rapid, sustained and profitable growth. Operating revenue climbed from about Rs 283 crore in FY23 to Rs 651 crore in FY24, roughly a 130% increase, and then to about Rs 1,176-1,214 crore in FY25, a further gain of around 80-85%. Management points to a current annualised run-rate above Rs 2,500 crore, and the Astrotalk Store reportedly processed around 1.6 million orders in 2025. These are among the freshest figures available at the run date, with FY25 the latest reported year. Two caveats temper the trajectory: third-party FY25 revenue is quoted inconsistently between Rs 1,176 crore and Rs 1,214 crore, and the run-rate and session-volume metrics are company-claimed rather than drawn from audited statements. Even allowing for these, the multi-year compounding, corroborated at the FY24 and FY25 revenue lines by multiple outlets, is unusually strong for a profitable consumer platform and anchors the investment case.'
  claimRefs:
  - CI006
  - CI007
  - CI009
  - CI013
  - CI012
  - CI036
  - CI022
  - CI025
  figureRefs:
  - FI003
- id: capital-verdict
  title: Capital adequacy and financial verdict
  body: 'Astrotalk''s balance-sheet posture is a standout. Having raised only about $34 million from Left Lane Capital, Elev8 Venture Partners and QED Investors, it created roughly $1 billion of value and, critically, funded its 2026 ESOP buyback from profits rather than fresh capital, signalling positive operating cash generation and low financing dependency. A planned pre-IPO round of about Rs 429 crore would add pre-listing growth capital rather than rescue cash. No debt or project-finance obligations are disclosed, consistent with an asset-light model. The principal weaknesses are informational rather than structural: cash on hand, burn and runway are not public, there are no audited statements, and the cost structure is opaque, all of which are diligence blockers. On balance the verdict is positive on revenue quality and margin path, supported by profitability, high repeat usage and capital efficiency, but conditioned on obtaining audited accounts and a reconciled revenue figure before relying on the headline multiples, which sit near 7x FY25 revenue at the $1 billion mark.'
