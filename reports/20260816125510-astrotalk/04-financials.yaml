- id: margins-unit-economics
  title: Cost structure, margins and unit economics
  body: 'Astrotalk runs an asset-light marketplace whose economics are attractive but only partly disclosed. Because the platform pays astrologers a share of each session and carries little cost of goods, gross margin is estimated near 85%, and reported profitability implies strong operating leverage: FY24 net profit was about Rs 100 crore on Rs 651 crore of revenue, and FY25 profit before tax reached roughly Rs 285 crore on about Rs 1,176 crore, an approximately 24% PBT margin. The largest cost buckets are inferred to be marketing and astrologer payouts, and the company credits AI-driven operational efficiency with helping contain costs. However, no audited cost breakdown, CAC or payback figure is public, so unit economics must be approximated from headline ratios. The growing commerce arm adds inventory and fulfilment working-capital needs absent from the consultation model, and its lower product margins will weigh on the blended figure as it scales. Overall the margin path looks genuinely strong, but the supporting detail is thin.'
