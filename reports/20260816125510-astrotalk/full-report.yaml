      - number: '2.3'
        title: Buyers, segments and adoption path
        blocks:
          - type: paragraph
            body: >-
              Demand concentrates in a handful of high-intent segments. Marriage and relationship seekers use Kundli
              matching and compatibility readings, career and finance users seek timing and decision guidance, and
              wellbeing users look for reassurance during stressful life events. Across these, the typical adoption path
              runs from free kundli or horoscope content into a first paid consultation and then, for a meaningful
              minority, into repeat usage that drives most revenue. Demographically, usage skews toward the 25-34 age
              group, which forms roughly a third of users, with a slight female majority around 54% on Astrotalk. A
              distinct and economically important segment is the non-resident Indian diaspora across the US, UK, Middle
              East and Australia, which Astrotalk says contributes around 20% of revenue at higher effective spend. A
              newer overlay is spiritual commerce, where consultation recommendations convert into gemstone and product
              purchases, extending customer value beyond the consultation itself. Several of these segment and mix
              figures are company-claimed and flagged accordingly.
            claimRefs:
              - CM010
              - CM011
              - CM013
