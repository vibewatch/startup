  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk overview and severity ranking
        blocks:
          - type: paragraph
            body: >-
              Astrotalk's risk profile is unusual for a fast-growing consumer startup because the binding constraints
              are regulatory, reputational and concentration risks rather than solvency. The company is profitable,
              reporting roughly Rs 285 crore of FY25 profit before tax, has raised only about $34 million externally,
              and funded its 2026 ESOP buyback entirely from profits, so it does not depend on continued dilutive
              fundraising to survive. That financial strength materially cushions downside and pushes the most
              consequential risks toward the regulatory and reputational domain: evolving data-protection, advertising
              and consumer-protection rules, a belief-based service model that attracts credibility scrutiny, heavy
              India revenue concentration near 80%, and key-person dependence on founder-CEO Puneet Gupta. Ranked by
              likelihood and impact, data-protection compliance and India concentration sit highest on combined
              severity, quality and refund complaints are the most frequent, and low-probability but high-impact tail
              risks include a platform outage at scale or loss of the founder. Residual exposure after mitigants is
              moderate, dominated by regulatory uncertainty rather than any near-term threat to the earnings base.
            claimRefs:
              - CR001
              - CR002
              - CR016
              - CR017
              - CR019
