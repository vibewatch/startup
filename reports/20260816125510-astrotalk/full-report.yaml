  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Astrotalk is an astrology consultation marketplace founded in 2017 by Puneet Gupta and Anmol Jain and
              headquartered in Noida, Uttar Pradesh. The platform connects tens of millions of users with verified
              astrologers through chat, voice and video sessions, spanning Vedic astrology, Kundli birth charts, Kundli
              matching, tarot, numerology, Vastu and palmistry. Monetisation is transactional: users pay per-minute or
              per-session fees, and the marketplace retains a take rate while astrologers earn the balance, producing
              high gross margins with minimal cost of goods. Astrotalk has extended the same spiritual intent into
              commerce through Astrotalk Store, selling gemstones, rudraksha and related products launched in November
              2024. The company positions itself as the leading online astrology platform in India, claiming roughly 80%
              share of the domestic online astrology consultation market, and increasingly serves diaspora demand across
              the US, UK, Middle East and Australia.
