      - number: '1.2'
        title: Founders, leadership and key-person profile
        blocks:
          - type: paragraph
            body: >-
              Astrotalk was co-founded by Puneet Gupta, who serves as chief executive and is the company's public face
              across media and fundraising, and Anmol Jain, who leads product. Puneet Gupta previously worked as an
              analyst at Nomura and BNP Paribas and had earlier founded CodeYeti, an IT-services startup, before
              pivoting into astrology technology; he is a Punjab Engineering College graduate. Anmol Jain was previously
              Director of Product Management at INDmoney, giving the founding pair a mix of financial-markets and
              consumer-product experience. As the company signals an eventual public listing, it has strengthened its
              finance function with an IPO-experienced CFO and broader governance. The main leadership caveat is
              key-person dependence: Puneet Gupta is the dominant external voice of the brand, and a full current board
              roster and committee structure are not publicly disclosed, which is notable for a company preparing to go
              public.
