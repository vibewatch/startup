  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and peer scale
        blocks:
          - type: paragraph
            body: >-
              Astrotalk sits at the top of a crowded but fragmented Indian online astrology market. Its direct peers are
              Astroyogi, which reported about Rs 84.3 crore of FY24 revenue on a bootstrapped, profitable model with
              roughly 27% overseas revenue; InstaAstro, a venture-funded challenger with about Rs 52.3 crore of FY25
              revenue and roughly $3.3 million raised including from Artha Venture Fund; and VAMA, a
              commerce-and-devotion focused player at about Rs 19.5 crore of FY25 revenue backed by roughly $7.36
              million from Wavemaker Partners. GaneshaSpeaks remains a legacy, content-first incumbent with no recent
              disclosed financials, while international apps such as Co-Star and Pattern pursue a different
              horoscope-first model aimed at Western and diaspora users. Against this field, Astrotalk's FY25 revenue
              near Rs 1,200 crore is more than ten times its nearest domestic rival, underlining a scale lead that
              shapes every other dimension of competition.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP009
              - CP010
              - CP011
