          - type: callout
            title: Profitability materially cushions downside
            body: >-
              We assume Astrotalk's FY25 profitability, low external capital and diversified consultation-plus-commerce
              model keep near-term solvency risk low, leaving regulatory and concentration risk as the binding
              constraints.
            calloutType: assumption
            claimRefs:
