  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams and pricing model
        blocks:
          - type: paragraph
            body: >-
              Astrotalk earns the bulk of its revenue from per-minute paid astrology consultations delivered over chat,
              voice and video, with the platform retaining a marketplace take rate and astrologers keeping the balance.
              First sessions are typically free or discounted to acquire users, and repeat customers, said to drive more
              than 80% of revenue, provide durable monetisation. A second and fast-growing stream is the Astrotalk
              Store, launched in November 2024, which sells gemstones, rudraksha and other spiritual products and
              reportedly reached about Rs 140 crore in its first twelve months at roughly Rs 1 crore of daily GMV,
              implying an annualised run-rate near Rs 300 crore. International users across the US, UK, Middle East and
              Australia contribute about 20% of revenue at higher effective ARPU. The revenue mix is therefore
              diversifying from a near-pure high-margin consultation marketplace toward a blend that includes
              lower-margin physical commerce, a shift that supports growth but modestly dilutes blended margins over
              time.
