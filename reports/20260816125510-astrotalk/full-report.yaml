      - number: '7.3'
        title: Operational, quality and dependency risk
        blocks:
          - type: paragraph
            body: >-
              On the execution side, Astrotalk runs a cloud-native architecture on AWS with real-time voice and video
              delivered through Agora, handling more than 10,000 concurrent sessions. That scale is well managed, but it
              concentrates infrastructure and communication risk in two external providers, and any outage or latency at
              peak load would directly interrupt paid consultations and revenue. Distribution through Google Play and
              the Apple App Store adds platform-policy, ranking and fee exposure that Astrotalk cannot fully control,
              while payment gateways and OTP-based authentication create fraud and account-security surfaces requiring
              continuous controls. The marketplace itself depends on vetting more than 13,000 astrologers, a two-sided
              supply that carries quality-control, fraud and content-moderation risk, and the CCI episode shows
              astrologer supply is contested. The newer Astrotalk Store introduces physical-product authenticity and
              logistics risk absent from the digital service. Reviews on MouthShut and community discussions surface
              recurring complaints about consultation quality, billing and refunds, making service reliability and
              support quality the softest operational spots even as core platform reliability appears robust.
            claimRefs:
              - CR008
              - CR009
              - CR010
