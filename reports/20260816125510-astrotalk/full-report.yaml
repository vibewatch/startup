      - number: '1.3'
        title: Funding history, valuation and capital structure
        blocks:
          - type: paragraph
            body: >-
              Astrotalk is unusual among unicorns for how little external capital it has consumed, having raised only
              about $34 million in total. Its first institutional round came in August 2021 in a deal involving QED
              Investors. The primary venture financing arrived in February 2024 with roughly $20 million led by Left
              Lane Capital, followed by a June 2024 extension of about $9.5 million from Left Lane Capital and Elev8
              Venture Partners that set a $300 million valuation. Rather than raise a traditional priced round to cross
              the unicorn threshold, Astrotalk conducted an ESOP buyback in August 2026 that valued the company at $1
              billion and, critically, was funded from its own profits rather than fresh investor money. That step-up
              represents roughly a 3.3x increase in about two years. Looking ahead, the company is reported to be
              planning a pre-IPO round seeking about Rs 429 crore at a $1.3-1.5 billion valuation, though ownership
              percentages across investors and founders remain private.
