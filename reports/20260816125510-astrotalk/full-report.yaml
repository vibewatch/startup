  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Astrotalk competes in the market for online, on-demand astrology consultations delivered through an app
              via chat, voice and video between users and verified astrologers. The served market spans Vedic astrology,
              Kundli matching, tarot, numerology, Vastu and palmistry, and increasingly astrology-linked commerce such
              as gemstones, rudraksha and pujas. It explicitly excludes the far larger pool of offline spiritual spend
              transacted through temples, priests and in-person family astrologers, as well as adjacent mainstream
              wellness and jewellery categories. The most important status-quo substitutes are free horoscopes,
              social-media astrologers and family astrologers consulted informally, which set a low reference price and
              mean the market must convert users from free habits to paid sessions. Monetisation is transactional,
              combining per-minute paid consultations, subscriptions and spiritual-product sales, so market boundaries
              are defined as much by willingness to pay for personalised guidance as by the underlying belief system.
            claimRefs:
              - CM001
              - CM018
              - CM019
              - CM026
              - CM020
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM018
              - CM019
              - CM020
              - CM026
      - number: '2.2'
        title: Market sizing and TAM/SAM/SOM lenses
        blocks:
          - type: paragraph
            body: >-
              Multiple lenses frame Astrotalk's opportunity. At the broadest level, India's faith and spiritual economy
              is estimated at around $35 billion in total spend, most of it offline, which represents the long-run
              digitisation opportunity rather than a directly addressable figure. Globally, the astrology app market is
              put near $3 billion in 2024 and is projected to reach roughly $9 billion by 2030 at more than a 20% CAGR.
              The most relevant served-available lens is India's online astrology app market, sized at about $163
              million in 2024 and forecast to approach $1.8 billion by 2030 at an approximately 49.2% CAGR, an almost
              ten-fold expansion. Against this, Astrotalk's company-claimed run-rate near $300 million and its claimed
              ~80% share sit awkwardly above the 2024 market estimate, which signals either rapid market growth beyond
              the 2024 base, a broader internal market definition, or optimistic self-reported figures. These sizing
              lenses are therefore best read as directional, with the definitional mismatch preserved as an explicit
              diligence gap.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM017
              - CM035
