      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory and reputational exposure dominates
            body: >-
              Astrotalk's belief-based model sits under evolving DPDP, ASCI and consumer-protection regimes and attracts
              competitor and regulator attention, as the 2024 CCI complaint showed, even though that case was dismissed.
            calloutType: risk
            claimRefs:
