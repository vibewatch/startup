companyProfile:
  summary: >
    Astrotalk (Astrotalk Services Private Limited) is a Noida-headquartered online astrology platform founded in 2017 by
    Puneet Gupta and Anmol Jain. It operates a two-sided marketplace connecting more than 60 million registered users
    with over 13,000 verified astrologers for paid consultations over chat, voice, and video, spanning Vedic astrology,
    Kundli, tarot, numerology, Vastu, and palmistry. The platform has expanded into spiritual commerce through the
    Astrotalk Store (gemstones, rudraksha, and spiritual products) launched in November 2024, and into international
    diaspora markets. Astrotalk is unusual among high-growth Indian consumer startups in being solidly profitable: FY25
    operating revenue reached roughly Rs 1,176-1,214 crore (~$141M) with about Rs 285 crore of profit before tax, and
    management cites a run-rate above Rs 2,500 crore (~$300M). In August 2026 it became India's 8th unicorn of the year
    at a $1 billion valuation set via an ESOP buyback funded entirely from profits, having raised only about $34 million
    externally.
  foundedDate: '2017-01-01'
  founders:
    - name: Puneet Gupta
      role: CEO and co-founder
      background: >
        Former Nomura and BNP Paribas analyst and Punjab Engineering College graduate who earlier founded the
        IT-services startup CodeYeti; he is the public face and strategic driver of Astrotalk.
      claimRefs:
        - CO001
        - CO012
    - name: Anmol Jain
      role: Co-founder
      background: |
        Previously Director of Product Management at INDmoney before co-founding Astrotalk in 2017.
      claimRefs:
        - CO001
  foundingLocation: Noida, Uttar Pradesh, India
  headquarters: Noida, Uttar Pradesh, India
  productSummary: >
    Astrotalk sells paid astrology consultations through an app-based marketplace, matching users to verified
    astrologers via an AI-powered recommendation engine and delivering real-time chat, voice, and video sessions
    (voice/video via Agora) on an AWS cloud-native, microservices architecture that handles 10,000+ concurrent sessions.
    Adjacent products include free tools (Kundli, horoscopes, Panchang), the Astrotalk Store for spiritual commerce, and
    a certified gemstone platform.
  keyProducts:
    - name: Astrology consultation marketplace
      description: >
        Chat, voice, and video consultations with 13,000+ verified astrologers across Vedic astrology, tarot,
        numerology, Vastu, and palmistry.
      claimRefs:
        - CO001
        - CE001
    - name: Astrotalk Store
      description: >
        Spiritual-commerce arm for gemstones, rudraksha, and spiritual products launched November 2024, with roughly 1.6
        million orders in 2025.
      claimRefs:
        - CU021
    - name: Free astrology tools
      description: >
        Free Kundli charts, daily horoscopes, and Panchang that anchor top-of-funnel acquisition ahead of paid
        consultations.
      claimRefs:
        - CU012
    - name: Certified gemstone platform
      description: >
        Standalone offering for precious and semi-precious stones with lab certification, extending the
        spiritual-commerce line.
      claimRefs:
        - CU021
  customerFocus: >
    Astrotalk serves a mass-market consumer base of more than 60 million registered users and 100 million+ downloads,
    skewing female (~54%) and toward the 25-34 age cohort, with roughly 80% of revenue domestic to India and about 20%
    from an international diaspora across the US, UK, Canada, West Asia, and Australia. Demand is repeat-driven, with
    80%+ of revenue said to come from returning users.
  businessModel: >
    Astrotalk monetizes primarily through paid per-minute and per-session astrology consultations on a marketplace
    take-rate model with high (~85%) gross margins, supplemented by spiritual-commerce sales through the Astrotalk
    Store. The marketplace structure keeps COGS low and, combined with repeat-driven demand and largely organic
    acquisition, produces genuine profitability at scale.
  stage: Profitable / unicorn (pre-IPO)
  fundingStatus: >
    Astrotalk raised a first institutional round from QED Investors in August 2021, $20 million from Left Lane Capital
    in February 2024, and about $9.4-9.5 million from Left Lane Capital and Elev8 Venture Partners in June 2024 at a
    $300 million valuation, for roughly $34 million total. In August 2026 it reached a $1 billion valuation via a
    profit-funded ESOP buyback, and is reported to be planning a pre-IPO round seeking about Rs 429 crore at a $1.3-1.5
    billion valuation ahead of a targeted 2026-27 IPO.
