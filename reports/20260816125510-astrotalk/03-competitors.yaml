- id: capabilities-pricing
  title: Capabilities, features and pricing
  body: 'Product capabilities across the leading Indian platforms have largely converged. Astrotalk, Astroyogi, InstaAstro and VAMA all offer chat, voice and video consultations, free tools such as Kundli and horoscopes, and per-minute paid pricing with promotional or free first sessions. Differentiation therefore concentrates on supply and breadth rather than core features: Astrotalk fields the largest verified astrologer network at more than 13,000 practitioners and the deepest download base, while VAMA leans distinctively into spiritual commerce and devotional services and Astroyogi maintains a disciplined, internationally weighted niche. Pricing is broadly similar and astrologer-set, so headline rates rarely differentiate platforms; instead, first-session discounts and marketing intensity drive trial. Because the underlying consultation product is easily replicated, competition increasingly turns on astrologer quality, brand trust and the ability to fund acquisition, all areas where Astrotalk''s scale and profitability give it an advantage.'
