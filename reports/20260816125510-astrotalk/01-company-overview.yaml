  - type: private-evidence-only
    severity: material
    topic: ownership and cap table
    missingEvidence: Investor ownership percentages and post-buyback founder holdings are not public.
    whyItMatters: Without the cap table it is hard to assess control, dilution and investor economics ahead of an IPO.
    diligencePath: Request the current cap table and shareholders' agreement from management.
    relatedQuestionRefs:
    - QO007
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: minor
    topic: leadership and governance
    missingEvidence: A complete board roster and named CFO with governance committees is not disclosed.
    whyItMatters: Governance depth matters for a company signalling an IPO within 1-2 years.
    diligencePath: Ask for the board composition and committee charters in management diligence.
