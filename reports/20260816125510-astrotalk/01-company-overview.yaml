- id: scale-metrics
  title: Scale and key metrics
  body: 'Astrotalk''s traction is anchored in profitable hyper-growth. FY24 operating revenue roughly doubled to Rs 651 crore (about $78 million) with net profit climbing to about Rs 100 crore, and FY25 revenue rose more than 85% to about Rs 1,176-1,214 crore (roughly $141 million) with profit before tax near Rs 285 crore, implying an approximately 24% PBT margin. Management indicates a current annualised run-rate above Rs 2,500 crore (about $300 million). On the demand side the company reports more than 60 million registered users, over 100 million app downloads, more than 13,000 verified astrologers and roughly 4 million paid sessions per month, with about 20% of revenue from international markets. These operating figures should be read with care: several are company-claimed rather than audited, and third-party astrologer counts vary between 13,000 verified and 45,000 registered, so the scale story is strong but not uniformly independently verified.'
  claimRefs:
