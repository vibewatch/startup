- id: milestones
  title: Milestones and unicorn event
  body: 'Astrotalk''s history runs from the founders'' earlier CodeYeti venture through the 2017 launch of the astrology marketplace, its first institutional round in 2021, the 2024 Left Lane-led financings, and the FY24-FY25 revenue acceleration. Product and regulatory milestones punctuate the timeline: the November 2024 launch of Astrotalk Store extended the company into spiritual e-commerce, and in December 2024 the Competition Commission of India dismissed a complaint filed by rival InstaAstro, clearing Astrotalk of anti-competitive allegations. The defining event is the August 2026 ESOP buyback that crowned Astrotalk a unicorn at a $1 billion valuation while returning liquidity to more than 100 employees, all financed from profit. As of the run date the $1 billion mark is the most recent public valuation, and Astrotalk is widely listed among India''s newly minted 2026 unicorns as it prepares a pre-IPO round and an eventual listing.'
