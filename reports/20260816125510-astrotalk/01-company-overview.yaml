- id: founders-leadership
  title: Founders, leadership and key-person profile
  body: 'Astrotalk was co-founded by Puneet Gupta, who serves as chief executive and is the company''s public face across media and fundraising, and Anmol Jain, who leads product. Puneet Gupta previously worked as an analyst at Nomura and BNP Paribas and had earlier founded CodeYeti, an IT-services startup, before pivoting into astrology technology; he is a Punjab Engineering College graduate. Anmol Jain was previously Director of Product Management at INDmoney, giving the founding pair a mix of financial-markets and consumer-product experience. As the company signals an eventual public listing, it has strengthened its finance function with an IPO-experienced CFO and broader governance. The main leadership caveat is key-person dependence: Puneet Gupta is the dominant external voice of the brand, and a full current board roster and committee structure are not publicly disclosed, which is notable for a company preparing to go public.'
  claimRefs:
  - CO012
  - CO013
  - CO028
  - CO030
  - CO022
  tableRefs:
  - TO002
- id: funding-valuation
  title: Funding history, valuation and capital structure
  body: Astrotalk is unusual among unicorns for how little external capital it has consumed, having raised only about $34 million in total. Its first institutional round came in August 2021 in a deal involving QED Investors. The primary venture financing arrived in February 2024 with roughly $20 million led by Left Lane Capital, followed by a June 2024 extension of about $9.5 million from Left Lane Capital and Elev8 Venture Partners that set a $300 million valuation. Rather than raise a traditional priced round to cross the unicorn threshold, Astrotalk conducted an ESOP buyback in August 2026 that valued the company at $1 billion and, critically, was funded from its own profits rather than fresh investor money. That step-up represents roughly a 3.3x increase in about two years. Looking ahead, the company is reported to be planning a pre-IPO round seeking about Rs 429 crore at a $1.3-1.5 billion valuation, though ownership percentages across investors and founders remain private.
  claimRefs:
  - CO008
  - CO009
  - CO010
