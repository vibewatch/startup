- id: valuation-context
  title: Valuation context and multiples
  body: 'At the $1 billion mark set in August 2026, Astrotalk trades at roughly 7x its FY25 revenue and about 3.3x its ~Rs 2,500 crore ARR run-rate. That is a full multiple: public service marketplaces such as Upwork and Angi trade at only about 1-4x revenue, reflecting slower growth and, in Astrotalk''s favour, less profitability per unit of growth. The premium is defensible because Astrotalk pairs ~80% revenue growth with genuine profitability and dominant share, a combination the listed comps lack, and because the sector''s ~49% CAGR lengthens the growth runway. Two caveats temper the read. First, the $1 billion figure came from an internal ESOP buyback rather than an arm''s-length primary round, so it reflects an internal reference price more than external price discovery; the reported pre-IPO round seeking Rs 429 crore at a $1.3-1.5 billion valuation, if confirmed, would be the truer market test. Second, the multiple rests on self-reported financials, though private-company filings on TheCompanyCheck and Tijori corroborate the FY25 revenue base. Relative to the June 2024 $300 million mark, the valuation has risen 3.3x in two years, broadly in line with revenue growth, which is a reassuring consistency check.'
