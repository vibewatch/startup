- id: scenarios
  title: Bull, base and bear scenarios
  body: 'The scenario range is wide because Astrotalk is priced for growth. In the base case, growth moderates from ~80% but margins hold and India leadership persists, comfortably supporting the current ~$1 billion valuation. The bull case assumes sustained high growth, deeper international penetration beyond the ~20% of revenue already earned abroad, and continued commerce cross-sell, carrying the valuation toward the reported $1.3-1.5 billion pre-IPO level and a successful IPO above it. The bear case is anchored on the anti-thesis: a growth slowdown below sector rates, an adverse data-protection or advertising enforcement action, a credibility shock to paid astrology, or erosion of India share. In that world the multiple compresses toward the public-comp band of roughly 2-4x revenue, valuing the company well below $1 billion on current revenue. Sensitivity analysis makes the asymmetry explicit: at 2x FY25 revenue the implied value is around $280 million, at 4x about $560 million, at the current 7x about $1 billion, and at 10x roughly $1.4 billion. Because so much value sits in the multiple, any deceleration would compress the price disproportionately, which is the central risk to an entry at today''s level.'
