- id: recommendation-exit
  title: Recommendation, comparables and exit
  body: The recommendation is a qualified positive at moderate confidence. Astrotalk offers a rare combination of profitable, category-leading growth in a structurally expanding market, which justifies a premium to listed service-marketplace comparables trading at ~1-4x revenue; its investment KPIs, a ~7x revenue multiple, ~3.3x ARR, ~24% PBT margin, ~80% growth and only ~$34 million raised, are internally consistent and unusually clean. Confidence is held at moderate rather than high because the valuation leans on self-reported metrics, an internal ESOP-buyback reference price, and press-reported round terms. The primary exit path is a 2026-27 IPO, for which the company has strengthened governance and hired a CFO with listing experience, and its profitability and low external capital give it optionality to time that listing from strength. Thesis-break triggers to monitor are a growth slowdown below the sector CAGR, adverse regulation, a category credibility shock, loss of India dominance, or founder departure. Final diligence asks, audited financials, cohort retention data, take-rate detail, the pre-IPO round's terms, and regulatory compliance documentation, would be the fastest route to moving confidence from moderate toward high.
