  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              Astrotalk 竞争的是在线、按需占星咨询市场：用户通过 App，以聊天、语音和视频方式与认证占星师互动。实际服务市场覆盖吠陀占星、Kundli 合盘、塔罗、数字命理、Vastu
              和手相，也越来越多纳入宝石、rudraksha 和 puja
              等占星相关电商。它明确不包括规模大得多的线下灵性消费，例如通过寺庙、祭司和线下家庭占星师完成的支出，也不包括相邻的主流健康和珠宝品类。最重要的现状替代品是免费运势、社交媒体占星师和非正式咨询的家庭占星师；它们设置了很低的参考价格，也意味着市场必须把用户从免费习惯转化为付费会话。变现是交易型的，结合按分钟付费咨询、订阅和灵性产品销售，因此市场边界既由底层信念体系决定，也由用户为个性化指引付费的意愿决定。
            claimRefs:
              - CM001
              - CM018
              - CM019
              - CM026
              - CM020
