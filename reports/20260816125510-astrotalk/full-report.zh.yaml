              Astrotalk 的历史从创始人早期的 CodeYeti 创业开始，随后是 2017 年占星市场平台上线、2021 年首个机构轮、2024 年 Left Lane 领投融资，以及 FY24-FY25
              收入加速。产品和监管里程碑穿插其中：2024 年 11 月，Astrotalk Store 上线，把公司延伸到灵性电商；2024 年 12 月，Competition Commission of India
              驳回竞争对手 InstaAstro 的投诉，未认定 Astrotalk 存在反竞争行为。定义性事件是 2026 年 8 月 ESOP 回购，它以 $1 billion 估值把 Astrotalk
