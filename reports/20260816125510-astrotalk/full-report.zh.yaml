  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与严重性排序
        blocks:
          - type: paragraph
            body: >-
              Astrotalk 的风险画像对高速增长消费创业公司来说并不常见，因为真正的约束不是偿付能力，而是监管、声誉和集中风险。公司盈利，FY25 税前利润约 Rs 285 crore，外部融资仅约 $34
              million，并且 2026 年 ESOP
              回购完全由利润出资，因此不依赖持续稀释性融资来活下去。这种财务强度显著垫住下行风险，也把最关键的风险推向监管和声誉领域：不断演进的数据保护、广告和消费者保护规则；基于信念的服务模式带来的可信度审视；接近 80%
              的印度收入集中；以及对创始人 CEO Puneet Gupta
              的关键人依赖。按概率和影响排序，数据保护合规与印度集中在综合严重性上最高，质量和退款投诉最常见；低概率但高影响的尾部风险包括大规模平台宕机或创始人流失。缓释后的剩余暴露为中等，主要由监管不确定性主导，而不是近期盈利基础受到威胁。
