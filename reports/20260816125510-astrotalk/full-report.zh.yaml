companyProfile:
  summary: >
    Astrotalk（Astrotalk Services Private Limited）是一家总部位于 Noida 的在线占星平台，由 Puneet Gupta 和 Anmol Jain 于 2017
    年创立。它经营双边市场，把超过 60 million 注册用户与 13,000+ 认证占星师连接起来，用户可通过聊天、语音和视频付费咨询，服务覆盖吠陀占星、Kundli、塔罗、数字命理、Vastu
    和手相。平台还把业务延伸到灵性电商，2024 年 11 月推出 Astrotalk Store，销售宝石、rudraksha 和灵性产品，并进入国际侨民市场。Astrotalk
    在印度高增长消费创业公司中并不常见：公司盈利扎实，FY25 营业收入约 Rs 1,176-1,214 crore（~$141M），税前利润约 Rs 285 crore，管理层称运行率已超过 Rs 2,500
    crore（~$300M）。2026 年 8 月，公司通过完全由利润出资的 ESOP 回购定出 $1 billion 估值，成为印度当年第 8 家独角兽；此前外部融资总额仅约 $34 million。
