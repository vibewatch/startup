            - 质量 / 退款投诉
            - '-'
        - label: 中等可能性
          values:
            - 竞争强度
            - 广告 / 消费者规则
            - 数据保护；印度集中度
        - label: 低可能性
          values:
            - 支付安全
            - 占星专项规则
            - 平台宕机；关键人物
    claimRefs:
      - CR002
      - CR004
      - CR008
      - CR016
      - CR017
  - id: FR002
    title: 风险传导图
    type: dag
    summary: 监管或声誉事件如何传导至 Astrotalk 收入。
    data:
      nodes:
