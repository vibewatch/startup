      - number: '3.3'
        title: 切换成本、多平台接单与分发
        blocks:
          - type: paragraph
            body: >-
              品类结构性经济特征会给 Astrotalk 的领先优势降温。用户切换成本低，因为占星咨询通常是偶发、一次性购买；用户会为了促销轻易尝试多个
              App。供给侧，占星师常在竞争平台上多平台接单，限制独家锁定，也意味着没有平台能完全控制人才池。Astrotalk
              真正握住的是分发能力：品牌、营销预算和市场流动性提高了占星师的收入潜力，进而吸引并留住更高质量供给，维持入驻和会话的正循环。盈利能力让它能自行给这只飞轮输血，而更小、依赖风投的对手必须为争夺同一批占星师和用户去募集外部资本。净结果是一家拥有强分发和供给触达优势的龙头，但合同锁定很弱，因此地位需要持续再投资，不能想当然。实际含义是，Astrotalk
              必须在占星师分成、发现效率和 App 体验上持续跟进，避免对手从市场任一侧挖走供给或用户。
            claimRefs:
