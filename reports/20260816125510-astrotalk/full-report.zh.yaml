        title: 成本结构、利润率与单位经济
        blocks:
          - type: paragraph
            body: >-
              Astrotalk 经营的是轻资产市场平台，经济性有吸引力，但披露不完整。平台向占星师支付每次会话的一部分分成，几乎没有商品成本，因此毛利率估计接近 85%；已披露盈利也说明经营杠杆很强：FY24 净利润约 Rs
              100 crore，收入 Rs 651 crore；FY25 税前利润约 Rs 285 crore，收入约 Rs 1,176 crore，对应约 24%
              税前利润率。最大的成本项推测是营销和占星师分成，公司也把成本控制归功于 AI 驱动的运营效率。但公司没有公开经审计的成本拆分、CAC
              或回本周期，因此单位经济只能从头部比率近似推导。不断扩大的电商业务增加了咨询模式没有的库存、履约和营运资金需求；随着规模扩大，较低的商品利润率会拖累综合毛利率。整体看，利润率路径确实强劲，但支撑细节偏薄。
