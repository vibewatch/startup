  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与定价模式
        blocks:
          - type: paragraph
            body: >-
              Astrotalk 的大部分收入来自聊天、语音和视频承载的按分钟付费占星咨询，平台保留市场抽成，占星师拿走余款。首单通常免费或打折以获客；据称贡献 80%+
              收入的复购客户，提供了更耐久的变现。第二条且快速增长的收入流是 Astrotalk Store。它于 2024 年 11 月上线，销售宝石、rudraksha 和其他灵性产品，据报道前十二个月达到约 Rs 140
              crore，日 GMV 约 Rs 1 crore，意味着年化运行率接近 Rs 300 crore。来自美国、英国、中东和澳大利亚的国际用户贡献约 20% 收入，且有效 ARPU
              更高。因此，收入结构正从近乎纯粹的高毛利咨询市场，走向包含低毛利实物电商的组合；这个变化支持增长，但会随时间小幅稀释综合利润率。
