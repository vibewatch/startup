      - number: '8.4'
        title: 建议、可比公司与退出
        blocks:
          - type: paragraph
            body: >-
              我们的建议是有条件看多，置信度中等。Astrotalk 在结构性扩张市场里兼具盈利、品类领先和高增长，足以支持相对上市服务型平台 可比公司（约 1-4x 收入）的溢价；核心投资 KPI——约 7x 收入、约
              3.3x ARR、约 24% PBT 利润率、约 80% 增长、累计融资仅约 $34 million——彼此吻合，也少见地干净。置信度停在中等而非高，是因为估值依赖自报指标、内部 ESOP
              回购参考价和媒体报道的融资条款。主要退出路径是 2026-27 年 IPO；公司已加强治理，并聘请有上市经验的
              CFO，盈利能力和外部融资少也让它可以从强势位置选择上市窗口。需要监测哪些情况会推翻投资逻辑：增速低于行业
              CAGR、不利监管、品类可信度冲击、印度主导地位丧失，或创始人离任。最后的尽调请求——审计财务、用户队列留存数据、抽佣率细节、pre-IPO 轮条款和监管合规文件——是将置信度从中等推向高的最快路径。
