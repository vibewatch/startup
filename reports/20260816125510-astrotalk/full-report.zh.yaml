        title: 能力、功能与定价
        blocks:
          - type: paragraph
            body: >-
              印度头部平台的产品能力已经基本趋同。Astrotalk、Astroyogi、InstaAstro 和 VAMA 都提供聊天、语音和视频咨询，Kundli
              和运势等免费工具，以及按分钟付费定价和促销或免费首单。因此，差异主要落在供给和广度，而不是核心功能：Astrotalk 拥有最大的认证占星师网络，超过 13,000 名从业者，也有最深的下载基本盘；VAMA
              更明显押注灵性电商和宗教服务，Astroyogi
              则守住纪律更强、国际收入占比更高的细分阵地。定价整体相似，并由占星师设定，所以标价很少能拉开平台差异；真正拉动试用的是首单折扣和营销强度。底层咨询产品容易复制，竞争越来越转向占星师质量、品牌信任和获客资金能力；这些领域
