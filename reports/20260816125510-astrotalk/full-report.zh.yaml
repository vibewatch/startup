          label: Astrotalk 创立
          detail: Puneet Gupta 和 Anmol Jain 在 Noida 创办占星咨询市场平台。
          tone: positive
        - date: 2021-08
          label: 首轮机构融资
          detail: QED Investors 参与公司首轮外部融资。
          tone: positive
        - date: 2024-02
          label: Series A 轮约 $20M
          detail: Left Lane Capital 领投这轮新股融资。
          tone: positive
