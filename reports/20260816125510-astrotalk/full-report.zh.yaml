      - number: '8.2'
        title: 估值背景与倍数
        blocks:
          - type: paragraph
            body: >-
              在 2026 年 8 月确立的 $1 billion 标记下，Astrotalk 约按 FY25 收入的 7x、按 ~Rs 2,500 crore ARR 运行率的 3.3x
              交易。倍数已经很满：Upwork、Angi 等上市服务型平台仅约 1-4x 收入，反映它们增长更慢，也反过来凸显 Astrotalk 单位增长的盈利性更强。溢价可以成立，因为 Astrotalk 同时有约 80%
              收入增长、真实盈利和主导份额，上市可比公司没有同样组合；行业约 49% CAGR 也拉长增长跑道。但有两点需要压低解读。第一，$1 billion 来自内部 ESOP
              回购，不是独立第三方新股融资轮，更像内部参考价而非外部价格发现；据报道公司寻求以 $1.3-1.5 billion 估值融资 Rs 429 crore 的 pre-IPO
              轮，如果确认，才是更真实的市场测试。第二，倍数建立在自报财务上，不过 TheCompanyCheck 和 Tijori 的非上市公司备案佐证了 FY25 收入基数。相较 2024 年 6 月 $300
              million 的标记，估值两年涨了 3.3x，整体与收入增长匹配，上述一致性让人安心。
            claimRefs:
              - CV002
              - CV003
