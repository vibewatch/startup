  foundingLocation: Noida, Uttar Pradesh, India
  headquarters: Noida, Uttar Pradesh, India
  productSummary: >
    Astrotalk 通过 App 型市场销售付费占星咨询，借助 AI 推荐引擎把用户匹配给认证占星师，并在 AWS 云原生、微服务架构上交付实时聊天、语音和视频会话（语音 / 视频通过 Agora），可承载 10,000+
    并发会话。相邻产品包括免费工具（Kundli、运势、Panchang）、用于灵性电商的 Astrotalk Store，以及认证宝石平台。
