  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              从客户工作流看，Astrotalk 是一款原生移动 App：用户带着婚姻、职业、关系或身心健康问题，浏览认证占星师，查看评分和价格，并按需通过聊天、语音或视频连接。服务覆盖吠陀占星、Kundli 命盘、婚姻匹配用
              Kundli 合盘、塔罗、数字命理、Vastu 和手相，并为爱情、婚姻、职业和月亮星座指引设置专门解读分类。免费工具层，尤其是免费 Kundli、每日运势和
              Panchang，充当漏斗顶端，在用户转为付费会话前把他们带进来。咨询之外，Astrotalk 还经营电商商店，销售宝石、rudraksha
              和灵性产品，并有认证宝石产品线；因此，产品最好理解为三个相连界面：咨询市场、免费内容互动层，以及变现同一需求的灵性电商商店。这种广度让 Astrotalk
              能在免费内容阶段捕获用户，并通过重复咨询和产品购买留住他们。
