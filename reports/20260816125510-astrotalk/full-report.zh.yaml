      - number: '1.2'
        title: 创始人、领导层与关键人画像
        blocks:
          - type: paragraph
            body: >-
              Astrotalk 由 Puneet Gupta 和 Anmol Jain 共同创办。Puneet Gupta 担任 CEO，是公司在媒体和融资中的主要对外面孔；Anmol Jain 负责产品。Puneet
              Gupta 曾任 Nomura 和 BNP Paribas 分析师，毕业于 Punjab Engineering College，此前还创办过 IT 服务创业公司 CodeYeti，之后转向占星科技。Anmol
              Jain 曾任 INDmoney 产品管理总监，让创始组合同时具备金融市场和消费产品经验。随着公司释放最终上市信号，它已引入有 IPO 经验的 CFO，并强化更广泛的治理。主要领导层风险是关键人依赖：Puneet
              Gupta 仍是品牌最强的外部声音，而公司并未公开完整的现任董事会名单和委员会结构；对于一家准备上市的公司，这一点值得注意。
