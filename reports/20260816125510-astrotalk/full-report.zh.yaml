  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              Astrotalk 是大众消费产品，不是 B2B 平台，因此更适合从人口结构、地域和使用场景理解客户基础。公司披露注册用户超过 60 million，Google Play 和 Apple App Store
              累计下载量超过 100 million。用户偏女性，约 54%；集中在 25-34 岁群体，约占三分之一，并与驱动咨询的婚姻和职业人生决策节点相吻合。地域上，约 80% 收入来自印度本土，约 20%
              来自覆盖美国、英国、加拿大、西亚和澳大利亚的国际侨民；这部分用户往往有效支出更高。按用途看，用户聚为婚恋人群、职业和财务决策者、身心健康寻求者，以及越来越多购买宝石和 rudraksha
              的灵性电商买家。多数拆分数据由公司自称，只被第三方流量数据松散佐证，因此应看作方向性而非精确数字；但整体画像——年轻、女性略占优、以印度为中心的大众受众——在各来源中一致。
