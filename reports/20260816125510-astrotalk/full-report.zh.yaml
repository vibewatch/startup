  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Astrotalk 的投资逻辑由四根柱子支撑，前文各章已经逐一展开：市场大且增长快、产品居于品类头部、复购客户黏性强、风险可控。印度在线占星市场年复合增速接近 49%，Astrotalk 估计持有 80-85%
              份额，收入仍以约 80% 的年增速增长。更关键的是，和多数高增长消费创业公司不同，Astrotalk 已经盈利；公司披露 FY25 税前利润约 Rs 285 crore，收入 Rs 1,176-1,214
              crore，PBT 利润率约 24%，平台毛利率约 85%。公司外部融资总额仅约 $34 million，并用利润支付 2026 年标志独角兽的 ESOP
              回购，因此股权故事少见地干净，没有太多稀释和优先权包袱。反向逻辑同样清楚：约 80% 收入集中在印度，许多核心经营指标在审计前由公司自行披露，需求基于信念且可选消费属性强，ESOP
              回购价不是独立第三方定价轮，品类还面临可信度和监管审视。整体看，投资逻辑压过反向逻辑，但后者压住置信度，也要求入场价格有纪律。
