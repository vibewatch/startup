  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与同业规模
        blocks:
          - type: paragraph
            body: >-
              Astrotalk 位于印度拥挤但分散的在线占星市场顶端。直接同业包括 Astroyogi，其 FY24 收入约 Rs 84.3 crore，模式自力更生且盈利，海外收入约 27%；InstaAstro 是 VC
              支持的挑战者，FY25 收入约 Rs 52.3 crore，累计融资约 $3.3 million，投资方包括 Artha Venture Fund；VAMA 则偏电商和宗教服务，FY25 收入约 Rs 19.5
              crore，获得 Wavemaker Partners 约 $7.36 million 支持。GaneshaSpeaks 仍是老牌、内容优先的既有玩家，但近期没有披露财务数据；Co-Star、Pattern
              等国际 App 采用不同的运势优先模式，面向西方和侨民用户。放在这个竞争场中，Astrotalk FY25 接近 Rs 1,200 crore
              的收入是最近印度本土对手的十倍以上，凸显出会塑造竞争所有维度的规模领先。
