      - number: '2.2'
        title: 市场规模与 TAM/SAM/SOM 口径
        blocks:
          - type: paragraph
            body: >-
              Astrotalk 的机会可以从多重口径看。最宽口径下，印度信仰与灵性经济总支出估计约 $35 billion，其中大部分在线下；它代表长期数字化机会，而不是可直接触达的市场规模。全球占星 App 市场 2024
              年约 $3 billion，预计 2030 年接近 $9 billion，CAGR 超过 20%。最相关的可服务市场口径是印度在线占星 App 市场，2024 年规模约 $163 million，预计 2030
              年接近 $1.8 billion，CAGR 约 49.2%，几乎扩大十倍。与此相比，Astrotalk 自称接近 $300 million 的运行率和 ~80% 份额，已经高于 2024
              年市场估算，口径并不协调；这意味着市场可能已在 2024 基数之上快速增长，或公司内部市场定义更宽，也可能是自报数字偏乐观。因此，这些规模口径最好按方向性理解，并把定义错配保留为明确的尽调缺口。
