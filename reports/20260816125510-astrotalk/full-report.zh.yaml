      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              情景区间很宽，因为 Astrotalk 的定价已经押注增长。基准情景下，增速从约 80% 放缓，但利润率守住、印度领先地位延续，足以支撑当前约 $1 billion
              估值。乐观情景假设高增长持续、海外渗透加深，超出已经来自海外的约 20% 收入，同时电商交叉销售延续，把估值推向据报道 $1.3-1.5 billion 的 pre-IPO 水平，并支持更高估值成功
              IPO。悲观情景锚定反向逻辑：增速跌到行业增速以下，数据保护或广告监管出现不利执法、付费占星遭遇可信度冲击，或印度份额流失。悲观情景下，倍数会向上市可比公司约 2-4x
              收入的区间压缩，按当前收入计，公司价值会明显低于 $1 billion。敏感性分析把不对称性摆明：按 FY25 收入 2x 估值，隐含价值约 $280 million；4x 约 $560 million；当前
              7x 约 $1 billion；10x 约 $1.4 billion。由于大量价值都压在倍数上，任何减速都会让价格超比例压缩，也是按当前水平入场的核心风险。
            claimRefs:
