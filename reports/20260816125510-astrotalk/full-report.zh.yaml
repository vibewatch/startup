      - number: '7.3'
        title: 运营、质量与依赖风险
        blocks:
          - type: paragraph
            body: >-
              执行侧，Astrotalk 在 AWS 上运行云原生架构，并通过 Agora 交付实时语音和视频，可处理 10,000+
              并发会话。这一规模管理得不错，但基础设施和通信风险集中在两个外部供应商上；峰值负载下任何宕机或延迟，都会直接打断付费咨询和收入。通过 Google Play 和 Apple App Store
              分发，又增加了平台政策、排名和费用暴露，Astrotalk 无法完全控制；支付网关和 OTP 认证也形成欺诈和账户安全攻击面，需要持续控制。市场本身依赖 13,000+
              占星师的审核，这是双边供给，带来质量控制、欺诈和内容审核风险；CCI 事件也显示占星师供给存在竞争。较新的 Astrotalk Store 引入了数字服务没有的实物产品真伪和物流风险。MouthShut
              评论和社区讨论反复提到咨询质量、计费和退款投诉，使服务可靠性和支持质量成为最软的运营点；即便核心平台可靠性看起来稳健，这一点仍需关注。
