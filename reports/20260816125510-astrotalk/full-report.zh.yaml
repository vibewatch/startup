  customerFocus: >
    Astrotalk 面向大众消费者，注册用户超过 60 million、下载量 100 million+，用户结构偏女性（~54%），并集中在 25-34 岁队列；约 80% 收入来自印度本土，约 20%
    来自美国、英国、加拿大、西亚和澳大利亚等国际侨民市场。需求由复购驱动，据称 80%+ 收入来自回访用户。
  businessModel: >
    Astrotalk 主要靠市场模式下按分钟和按会话收费的占星咨询变现，平台抽成，毛利率高（~85%），并通过 Astrotalk Store 的灵性电商销售补充收入。市场结构压低
    COGS，再叠加复购驱动的需求和以自然流量为主的获客，支撑了真实的规模化盈利。
