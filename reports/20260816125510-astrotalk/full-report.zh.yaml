      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              市场增长靠几项因素互相强化。智能手机和低价流量渗透率上升，不断扩大可触达受众；占星深度嵌入印度婚姻、职业和健康决策，支撑复购需求。AI
              驱动的个性化和更好的占星师匹配，被广泛认为能提高参与度，也是全球预测中的明确驱动因素；更高 ARPU 的侨民需求则带来国际上行空间。据报道，印度活跃的灵性科技创业公司超过 900
              家，既说明机会，也说明竞争正在加剧。反过来，真实约束也会压住故事：服务建立在信念之上，持续带来信任和可信度风险，限制转化与留存；不断演进的消费者保护和广告规范，限制平台对结果承诺的营销力度；切换成本低、占星师供给分散，意味着市场增长不会自动流向任何单一平台。接近
              49% CAGR 的分析师预测也应谨慎看待，因为它们可能把相邻灵性和健康支出打包进来，从而高估纯在线占星机会。
