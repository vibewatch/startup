      - number: '1.3'
        title: 融资历史、估值与资本结构
        blocks:
          - type: paragraph
            body: >-
              Astrotalk 在独角兽中少见地少用外部资本，累计仅融资约 $34 million。首个机构轮发生在 2021 年 8 月，交易涉及 QED Investors。主要风险融资来自 2024 年 2 月，由
              Left Lane Capital 领投，规模约 $20 million；2024 年 6 月又由 Left Lane Capital 和 Elev8 Venture Partners 延伸融资约 $9.5
              million，并给出 $300 million 估值。Astrotalk 没有通过传统定价融资跨过独角兽门槛，而是在 2026 年 8 月做了 ESOP 回购，把公司估值定在 $1
              billion；关键是，这笔回购来自自身利润，而不是新投资人资金。该估值台阶意味着约两年内提升约 3.3x。向前看，据报道公司计划进行 pre-IPO 融资，以 $1.3-1.5 billion 估值寻求约 Rs
              429 crore，但投资人和创始人的持股比例仍未公开。
