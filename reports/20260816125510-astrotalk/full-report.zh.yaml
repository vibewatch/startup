chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Astrotalk 是一个占星咨询市场平台，由 Puneet Gupta 和 Anmol Jain 于 2017 年创立，总部位于 Uttar Pradesh 的
              Noida。平台通过聊天、语音和视频会话，把数千万用户与认证占星师连接起来，服务覆盖吠陀占星、Kundli 命盘、Kundli 合盘、塔罗、数字命理、Vastu
              和手相。变现靠交易：用户按分钟或按会话付费，市场平台留存抽成，占星师获得余款；商品成本很低，因此毛利率高。Astrotalk 还把同一类灵性需求延伸到电商，通过 Astrotalk Store
              销售宝石、rudraksha 和相关产品，该商店于 2024 年 11 月上线。公司把自己定位为印度领先的在线占星平台，自称约占印度国内在线占星咨询市场 80%
              份额，并越来越多服务美国、英国、中东和澳大利亚的侨民需求。
