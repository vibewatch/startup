        title: 规模与关键指标
        blocks:
          - type: paragraph
            body: >-
              Astrotalk 的牵引力来自盈利型高速增长。FY24 营业收入约翻倍至 Rs 651 crore（约 $78 million），净利润升至约 Rs 100 crore；FY25 收入又增长超过 85%，达到约
              Rs 1,176-1,214 crore（约 $141 million），税前利润接近 Rs 285 crore，对应约 24% 税前利润率。管理层称当前年化运行率超过 Rs 2,500 crore（约 $300
              million）。需求侧，公司披露超过 60 million 注册用户、100 million+ App 下载、13,000+ 认证占星师，以及每月约 4 million 付费会话，约 20%
              收入来自国际市场。这些经营数字需要谨慎看待：多项指标来自公司自称而非审计，第三方占星师数量口径也从 13,000 认证到 45,000 注册不等，因此规模故事很强，但并非每个数字都得到独立验证。
