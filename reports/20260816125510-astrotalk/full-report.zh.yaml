      - number: '2.3'
        title: 买方、客群与采用路径
        blocks:
          - type: paragraph
            body: >-
              需求集中在少数高意向人群。婚恋人群使用 Kundli 合盘和匹配解读，职业和财务用户寻求时机与决策指引，身心健康用户在人生压力事件中寻找安慰。跨过这些人群，典型采用路径是先使用免费 Kundli
              或运势内容，再进入首次付费咨询；之后，相当一部分用户会重复使用，并贡献大部分收入。人口结构上，使用者偏向 25-34 岁群体，约占用户三分之一；Astrotalk 用户中女性略占多数，约
              54%。一个独立且经济价值重要的客群，是美国、英国、中东和澳大利亚等地的非居民印度侨民；Astrotalk 称其贡献约 20%
              收入，有效支出更高。新的叠加层是灵性电商，咨询建议转化为宝石和产品购买，把客户价值延伸到咨询本身之外。这些客群和结构数字中，有多项来自公司自称，并已相应标注。
