      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              付费占星周围的监管边界，是最重要的单一风险轴。2024 年，Competition Commission of India 审查了 Case No. 22 of 2024，即 InstaAstro 指控
              Astrotalk 挖角占星师的投诉；2024 年 12 月，CCI 依据 Section 26(2) 驳回该案，认定不存在 prima facie case。结果对 Astrotalk
              有利，但也确认其做法会吸引竞争对手和监管者关注。向前看，印度 Digital Personal Data Protection Act 2023 是影响最大的现实事项：Astrotalk
              收集出生信息和支付信息等敏感数据，随着规则落地实施，同意、安全和泄露义务都会增加合规负担。广告受 ASCI
              自律和反误导性声明的消费者保护法约束；对于基于信仰的服务，这是实质暴露，退款和计费纠纷也带来持续消费者保护风险。针对占星本身的监管仍未定型，使未来限制付费预测服务成为一种潜在且难量化的风险。最后，计划中的
              2026-27 IPO 会带来私营公司原本不用承担的治理、披露和 SEBI 合规义务。
            claimRefs:
