            body: >-
              Astrotalk 的信任和安全体系围绕占星师审核、账户安全和公开政策展开。公司称在上架前验证占星师，维持 13,000+ 经审核从业者网络；账户用 OTP
              认证保护，并声称通信加密。公司发布隐私政策、服务条款和退款政策，覆盖咨询和商店购买，并把实验室认证作为宝石销售的质量信号。主要弱点在证据：没有公开证据显示公司拥有 ISO 27001 或 SOC 2
