      - number: '7.4'
        title: 财务、模式风险与缓释因素
        blocks:
          - type: paragraph
            body: >-
              Astrotalk 的财务和模式风险相对可控。收入约 80% 集中在印度，需求又带有可选消费和信念属性，因此盈利对情绪和宏观周期敏感；IPO 级审计之前，许多经营指标仍由公司自报。竞争强度也是真实的，毕竟有
              900+ 灵性科技创业公司和获得融资的对手，即使 Astrotalk 自称有 80-85%
              份额。与之相对，缓释因素很强：持续盈利、外部资本少、咨询、电商商店和国际市场组成的多元模式，部分抵消了单一业务线集中；治理建设和有上市经验的 CFO 引入，也在 IPO 前强化控制。监测上，投资人应关注 CCI
              或消费者保护行动、应用商店评分趋势和印度收入占比；明确打破投资逻辑的触发器包括不利的 DPDP 执法行动、评分持续崩塌、创始人 CEO
              流失，或滑入持续亏损。优先尽调索取项是审计财务、队列留存数据、占星师审核政策和数据保护合规文件；这些能解决最大的剩余开放问题。
