  topStrengths:
    - Forterra 已打进真实军方项目，包括 Army UxS 工作和 Marine Corps ROGUE-Fires 的量产路径。
    - 产品栈不只是单一自主驾驶加装件，而是覆盖驾驶软件、通信、任务模块和数据基础设施合作。
    - Moore Strategic、Crescent Cove 以及可点名 crossover 投资人多次下注，说明内部资金仍有信心。
    - Oshkosh Defense、Volvo Defense、BAE Systems、Aeva、Hiab、Nominal 和 goTenna 等伙伴覆盖，增强了集成可信度。
  topRisks:
    - 公开资料仍未披露收入、毛利率、积压订单转化和客户集中度数据。
    - 最新一轮里的债务可能形成融资包袱，外部投资人无法凭公开资料定价。
    - 公司没有公开列明董事会，也没有完整解释领导层更替历史，治理可见度偏弱。
    - 防务预算节奏、项目集中度，以及安全或责任审查，都可能同时压住增长和估值。
  unresolvedGaps:
    - 当前收入、ARR、毛利率，以及按主要项目拆分的已获资金积压订单转化。
    - 准确的股权结构表、债务条款、清算优先权，以及据报道的独角兽估值是否对应新投资人的干净经济条款。
    - 完整董事会名单、创始人持股，以及 Alberto Lacaze 到 Josh Araujo 的领导层交接时间线。
    - 客户集中度、续约韧性，以及 Forterra 在 ROGUE-Fires 等主承包商主导项目中的经济分成。
