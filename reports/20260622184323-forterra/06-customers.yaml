    {
      "id": "named-customer-proof-and-adoption-trajectory",
      "title": "Named Customer Proof and Adoption Trajectory",
      "body": "Forterra's adoption trajectory has moved from military demonstrations to named program awards, prototype integrations, and at least one large production-scale award. Historically, the company demonstrated autonomous military convoys in Kuwait and trained soldiers to operate them, but the modern proof set is more concrete: the Marine Corps ROGUE-Fires relationship with Oshkosh progressed from earlier integration work to a January 2025 first-production-contract announcement and then to a June 2026 Block 2 award totaling $92 million with deliveries through 2031. The Army relationship is broader than one program, spanning UxS autonomy awards, planned May 2026 Infantry Squad Vehicle demonstrations, and separate ATV-S autonomous logistics truck prototyping reported by Breaking Defense. Around that defense core, Forterra has broadened its channel footprint through BAE for AMPV prototyping, Volvo Defense for DSEI 2025 transport-vehicle integration, Raytheon and Oshkosh for DeepFires launchers, and Hiab for load-handling automation. Nominal's March 2026 announcement adds an important maturity signal by describing Forterra as scaling production-rate delivery and fielding AutoDrive across more than a dozen vehicle platforms.",
