  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Forterra's strongest customer proof is in U.S. defense programs where the end user, platform partner, and delivery path are named: the Marine Corps' ROGUE-Fires program with Oshkosh, Army UxS autonomy work, and additional Army-oriented efforts with Raytheon, BAE, and logistics truck programs. Commercial demand is visible through Hiab and Kalmar channels, but public evidence remains partnership-led rather than end-fleet-led, leaving customer durability and concentration heavily tied to U.S. defense budgets and a small set of OEM/prime relationships."
  },
  "sections": [
    {
      "id": "customer-base-segmentation",
      "title": "Customer Base Segmentation",
      "body": "Forterra's disclosed customer map is best understood as a layered buyer-user-channel model rather than a simple logo list. The clearest current end users are defense organizations, especially the U.S. Marine Corps and U.S. Army, while the contracting and integration path often runs through primes or OEMs such as Oshkosh Defense, BAE Systems, Volvo Defense, and logistics-equipment partners. Independent analyses also show that Forterra is trying to reuse one autonomy stack across both military and industrial environments: military logistics convoys, autonomous launchers, and infantry support vehicles on one side, then container yards, distribution hubs, and load-handling workflows on the other. The commercial side is real in terms of public channel partnerships \u2014 especially Hiab and the Kalmar AutoTT page \u2014 but the reviewed evidence does not surface named civilian fleet operators actually buying and deploying Forterra systems at scale. That means defense is not just the most mature segment; it is also the only segment with repeated named end-user proof and program-level specificity today. Public segmentation also shows Forterra separating buyer economics from user economics: a prime or equipment maker may integrate and contract, while the warfighter or yard operator is the ultimate user. That architecture matters because concentration should be measured across end programs and across intermediary channels, not just by counting one layer of logos.",
