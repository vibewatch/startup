  topStrengths:
    - >-
      Forterra has real military program traction, including Army UxS work and the Marine Corps ROGUE-Fires production
      path.
    - >-
      The product stack is broader than a single autonomy applique, spanning driving software, communications, mission
      modules, and data infrastructure partnerships.
    - >-
      Repeated backing from Moore Strategic, Crescent Cove, and named crossover investors suggests continued insider
      conviction.
    - >-
      Partner coverage across Oshkosh Defense, Volvo Defense, BAE Systems, Aeva, Hiab, Nominal, and goTenna strengthens
      integration credibility.
  topRisks:
