      economics for new investors.
    - Full board roster, founder ownership, and the leadership-transition timeline from Alberto Lacaze to Josh Araujo.
    - >-
      Customer concentration, renewal durability, and Forterra’s economic share inside prime-contractor-led programs
      such as ROGUE-Fires.
