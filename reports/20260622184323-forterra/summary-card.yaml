      Debt inside the latest round may create financing overhang that outside investors cannot price from public
      sources.
    - >-
      Governance visibility is weak because the company does not publicly enumerate its board or explain
      leadership-transition history fully.
    - >-
      Defense-budget timing, program concentration, and safety or liability scrutiny could pressure both growth and
      valuation.
  unresolvedGaps:
