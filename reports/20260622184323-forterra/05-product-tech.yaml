- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Forterra solution
  - Measurable benefit
  - Limitation
  rows:
  - - Battlefield convoy or resupply lead
    - Crewed driving and ad hoc remote oversight
    - AutoDrive with TerraLink mission planning and Vektor/goTenna communications
    - Keeps humans out of vehicles while preserving reroute and intervention options
    - Public sources do not disclose disengagement or mission-completion rates
  - - Terminal yard manager
    - Human-driven shunting in mixed fleets
    - Kalmar AutoTT powered by AutoDrive and Kalmar fleet systems
    - Targets lower idle time, lower labor demand, and 24/7 operation
    - Commercial availability is still future-dated to 2027
  - - Load-handling fleet operator
    - Separate crane or hooklift operations after truck positioning
    - Hiab partnership to extend autonomy beyond movement into loading workflow
    - Potential to reduce operator workload and automate adjacent steps
    - No launched product or named customer yet
  - - Army or USMC fires/logistics planner
    - Crewed tactical vehicle missions with high exposure to risk
    - ROGUE-Fires, DeepFires, ISV, and AMPV integrations using AutoDrive
    - Extends reach and survivability while retaining modular weapon or payload integration
    - Program timing depends on government budgets and partner schedules
  - - EMSO or counter-UAS operator
    - Standalone sensing and communications kits
    - Tensor and CHAOS-integrated mobile payloads on AutoDrive platforms
    - Pairs mobility with spectrum sensing, resilient comms, and radar payloads
    - Public evidence does not show software interoperability documentation
  notes: Benefits are stated in customer-workflow language and are bounded by the public evidence available on launch, pilot, and program pages.
