tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - AutoDrive
    - Defense and industrial vehicle operators
    - Fielded autonomy core with multi-platform evidence
    - Vehicle and payload agnostic stack for off-road, on-road, mixed traffic, and GPS-denied operations
    - No public API, safety case, or validation dashboard
  - - TerraLink
    - Mission operators and command centers
    - Publicly marketed C2 layer with planning, oversight, and control functions
    - Single-pane command layer with smart alerts and operator intervention
    - No public admin guide or integration schema surfaced
  - - AutoTT
    - Terminal and yard operators
    - Pilots live with commercial launch targeted for 2027
    - Factory integration with Kalmar safety-rated drive-by-wire terminal tractors
    - Pilot economics and customer references remain sparse
  - - MESA
    - Defense logistics and force-protection teams
    - TRL 7 modular vehicle package derived from prior TRL 9 Lancer line
    - Combines autonomy, compute, comms, and payload mounting on a Polaris-based chassis
    - No public production-rate, price, or sustainment disclosures
  - - Tensor
    - EMSO and counter-UAS operators
    - 2025-2026 module packaging with published hardware specs
    - Combines Vertex RF sensing, Vektor routing, and goTenna mesh into a field package
    - No public doctrine, software release history, or operator training package
  notes: Rows synthesize product pages, partner releases, and product slicks; maturity labels reflect disclosed deployment evidence rather than
    audited fleet metrics.
