    - label: Payload and interface layer
      detail: OASIS, payload mounts, partner sensors, effectors, and mesh devices normalize integration across hosts.
    - label: Autonomy and supervision layer
      detail: AutoDrive executes movement while TerraLink handles planning, oversight, alerts, and intervention.
    - label: Connectivity and platform layer
      detail: Vektor, goTenna, radios, compute, and drive-by-wire host vehicles keep the stack operating in DDIL and GPS-denied environments.
