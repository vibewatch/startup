- id: architecture-building-blocks
  title: Architecture and technical building blocks
  body: 'The best public architecture evidence comes from Forterra''s 2025-2026 mission-module launches and the MESA and Tensor slicks. Those
    sources show a layered system: AutoDrive handles localization, perception, behavior generation, and mission execution; TerraLink provides
    command-and-control; Vektor manages routing, failover, and data transport across degraded links; goTenna contributes low-signature mesh networking;
    and OASIS standardizes how third-party sensors, effectors, and payloads attach. Tensor extends that same architecture into electromagnetic-spectrum
    operations by combining Vertex sensing, Vektor communications, and goTenna connectivity. The result is a credible edge stack for GPS-denied
    and DDIL operations, but the public surface still lacks the API references, ontology schemas, safety cases, or changelog history that would
    let an outside technical buyer inspect how open those integration claims really are. Versioning, admin controls, and developer ergonomics
    may exist privately, but they are not inspectable from the reviewed public surface.'
