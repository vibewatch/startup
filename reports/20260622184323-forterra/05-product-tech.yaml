- id: deployment-maturity
  title: Deployment maturity and ecosystem evidence
  body: 'Forterra''s maturity case depends on external integrations more than on self-contained factory production. Public evidence shows AutoDrive
    moving into Army ISV prototypes, ROGUE-Fires Block 2, DeepFires launcher prototypes, an AMPV prototype with BAE, and logistics partnerships
    with Kalmar, Hiab, and Volvo. MESA packages the stack into a Polaris-based autonomous vehicle, while Nominal and Aeva suggest Forterra is
    hardening both its test infrastructure and sensing stack as deployments scale. The pattern is consistent: Forterra enables autonomy and comms,
    then relies on OEMs, primes, and specialized suppliers for base vehicles, payloads, or major sensing subsystems. That keeps capital intensity
    lower and widens surface area quickly, but it also means product rollout timing depends on partner programs, defense budgets, and integration
    calendars that Forterra does not fully control. In other words, product maturity looks more like ecosystem orchestration than greenfield manufacturing
    ownership, which is powerful but structurally dependent.'
