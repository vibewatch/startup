- id: trust-controls-risks
  title: Trust posture, controls, and technical risks
  body: 'Forterra has some real public trust markers, but they are operational and manufacturing oriented rather than software-assurance heavy.
    The certifications page lists ISO 9001, ITAR registration, and IPC/WHMA cable-harness credentials, and the product pages repeatedly stress
    operator oversight, obstacle avoidance, and operation in degraded conditions. Careers and hiring surfaces also show a culture that foregrounds
    safety experts and measured shipping. What is missing is just as important: no public status page, no cyber accreditation package, no public
    security architecture, and no detailed validation metrics for disengagements, uptime, false positives, or fleet reliability. Independent coverage
    also highlights the downside of Forterra''s go-to-market model, namely budget volatility, compliance drag, and dependency on larger manufacturing
    and program partners. The chapter therefore supports a positive product-maturity view, but not a fully underwritten safety or cyber-assurance
    view. The current public record is enough to support process maturity, but not enough to complete a procurement-grade cyber or safety review
    without private diligence artifacts.'
