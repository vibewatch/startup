  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: partner-dependency
    missingEvidence: Partner agreements, sustainment SLAs, and program revenue concentration by OEM or prime.
    whyItMatters: Public sources show Forterra scaling through partners, but they do not show how concentrated roadmap or delivery risk is by
      a small set of programs.
    diligencePath: Request current revenue mix, pipeline by partner, termination clauses, and integration ownership for Kalmar, Oshkosh, BAE,
      and other top programs.
    relatedQuestionRefs:
    - QE018
  - type: missing-source
    severity: material
    topic: assurance-gap
    missingEvidence: Security architecture, accreditation status, privacy controls for deployed systems, and autonomy safety-case artifacts.
    whyItMatters: The public trust record is strong on manufacturing discipline but weak on software assurance, which matters for procurement
      and scale in defense environments.
    diligencePath: Request ATO or equivalent status, CMMC posture, safety-case summaries, penetration-test findings, and product security ownership.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: open-surface-gap
    missingEvidence: Public or customer-shareable API schemas, admin docs, integration guides, and ontology definitions for TerraLink or OASIS.
    whyItMatters: Forterra’s openness claims are strategically important, but the current public record does not let a technical buyer inspect
      interface maturity.
    diligencePath: Ask for SDK or API documentation, sample integrations, role-based access model details, and versioning or changelog evidence.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: validation-metrics
    missingEvidence: Fleet uptime, disengagement rates, false positive metrics, range-test results, and mission success KPIs for live programs.
    whyItMatters: Without hard validation metrics, the chapter can support product maturity directionally but cannot underwrite operational reliability.
    diligencePath: Request program-specific validation dashboards, test pass rates, failure taxonomies, and benchmark comparisons across vehicle
      classes.
    relatedQuestionRefs:
    - QE027
    relatedTableRefs:
    - TE005
