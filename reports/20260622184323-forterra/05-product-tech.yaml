- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - AutoDrive autonomy stack
    - Localization, perception, behavior generation, and mission execution
    - Drive-by-wire host vehicle plus sensing hardware
    - Public architecture granularity stops at marketing descriptions
  - - TerraLink C2
    - Planning, fleet oversight, video, alerts, and intervention
    - Network connectivity plus operator workstation
    - No public operator manual, uptime, or role-based access evidence
  - - Vektor communications suite
    - Link failover, routing, and smart data brokering in DDIL environments
    - Multiple radios, networking hardware, and waveform support
    - Cyber-hardening and accreditation details are not public
  - - goTenna mesh and low-signature comms
    - Off-grid, LPI/LPD connectivity for edge users and robots
    - Acquired communications hardware and Android/ATAK ecosystem fit
    - Integration success depends on Forterra preserving interoperability after acquisition
  - - OASIS and payload interfaces
    - Normalizes hardware and software integration for sensors, effectors, and payloads
    - Third-party systems and open interface discipline
    - No public schema, SDK, or ontology documentation
  - - Nominal data infrastructure
    - Unifies simulation, HIL, range, regression, and fleet analytics data
    - Third-party test and operations tooling
    - Validation workflow becomes partly dependent on an external data platform
  notes: Dependencies emphasize what has to work outside Forterra’s core autonomy code for the public architecture claims to hold in field programs.
