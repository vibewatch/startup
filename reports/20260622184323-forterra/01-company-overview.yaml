company:
  name: Forterra
chapter:
  number: 1
  title: Company Overview
  summary: Forterra is a Clarksburg, Maryland-based autonomy company founded in 2002 as Robotic Research that rebranded from RRAI to Forterra in February 2024. By June 2026 it had repositioned from a dual-use off-road autonomy supplier into a defense-first autonomous mission systems platform with disclosed 2021-2025 financing of at least $541 million, a first DoD production contract for ground vehicle autonomy, and a growing partner ecosystem spanning Oshkosh Defense, goTenna, Aeva, Nominal, Volvo Defense, Hiab, and BAE Systems. Core diligence gaps remain around valuation, board composition, revenue, and the exact CEO succession timeline from Alberto Lacaze to Josh Araujo.
sections:
- id: identity-business-model
  title: Identity and Business Model
  body: 'Forterra is the current brand for the autonomy company that began in 2002 as Robotic Research and later operated a commercial division branded RR.AI before rebranding the combined company to Forterra in February 2024. The current identity is defense-first: Forterra describes itself as the “autonomy backbone” for distributed, mission-aware operations, with software, communications, and mission modules that can be applied across multiple vehicle types instead of being tied to one proprietary chassis. The company’s product surface is modular. AutoDrive is the autonomous driving system, TerraLink is the vehicle-management and command layer, and complementary products such as Vektor, Oasis, and the acquired goTenna capability extend communications, data brokering, and mesh networking. Forterra still presents industrial and logistics use cases, but its public language from 2024 through 2026 shows an unmistakable center of gravity around military autonomy, contested environments, and rapid
    integration onto existing prime-contractor or OEM vehicle platforms.'
