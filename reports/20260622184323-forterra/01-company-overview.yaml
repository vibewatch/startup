- id: leadership-governance
  title: Leadership, Founders, and Governance
  body: 'Public materials support a partially reconstructed leadership story rather than a fully transparent governance picture. Josh Araujo is the clearly disclosed CEO in 2024-2026 press releases, while Joseph Putney is identified on the about page as Chief Technology Officer and a long-tenured operator who helped build early robo-shuttle, transit-bus, and yard-truck programs. A December 2021 article preserved on Forterra’s site describes the predecessor company as co-founded in 2002 by CEO Alberto Lacaze and vice president Karl Murphy, implying a leadership transition into the Josh Araujo era, but Forterra’s public site does not clearly document when that succession occurred or whether Lacaze and Murphy retain board or advisory roles. That missing timeline matters because the company’s current narrative relies heavily on continuity of mission and deployment experience. Governance disclosure is otherwise thin: the company’s public pages do not enumerate the board, independent directors,
    or formal committee structure. The result is meaningful key-person risk at the CEO and CTO layer plus a diligence need to verify board oversight, founder ownership, and executive succession planning before underwriting long-duration defense program exposure.'
