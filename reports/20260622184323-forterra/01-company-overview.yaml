  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Current valuation, latest term sheet, and ownership concentration by investor.
    whyItMatters: Capital efficiency and upside cannot be judged from round sizes alone.
    diligencePath: Request board deck, cap table, and last priced financing documents.
    relatedQuestionRefs:
    - QO015
  - type: private-evidence-only
    severity: material
    topic: revenue and backlog
    missingEvidence: Revenue, funded backlog, and program-level gross margin by defense and industrial customer.
    whyItMatters: Headline contract values do not show realized revenue timing or quality.
    diligencePath: Request audited financials, backlog schedule, and revenue-recognition policy by program.
    relatedQuestionRefs:
    - QO016
    - QO025
  - type: missing-source
    severity: material
    topic: board governance
    missingEvidence: Board roster, independent-director list, and committee structure.
    whyItMatters: Governance quality is central for a private company selling into long-cycle defense programs.
    diligencePath: Request governance documents, board bios, and observer-rights summary.
    relatedQuestionRefs:
    - QO009
    - QO024
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: minor
    topic: leadership transition
    missingEvidence: Exact succession timeline from Alberto Lacaze to Josh Araujo and any continuing founder roles.
    whyItMatters: Management continuity and founder influence affect risk assessment and culture.
    diligencePath: Request leadership chronology, founder shareholdings, and board minutes around the transition.
    relatedQuestionRefs:
    - QO008
    - QO024
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: contract economics
    missingEvidence: Forterra share of ROGUE-Fires economics, option structure, and concentration across DoD programs.
    whyItMatters: A prime-contractor production award does not automatically translate into high-margin recurring revenue for Forterra.
    diligencePath: Request contract summaries, statement-of-work economics, and program concentration analysis.
    relatedQuestionRefs:
    - QO020
    - QO025
    relatedTableRefs:
    - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: milestone table future completeness
    missingEvidence: A full dated chronology linking every pre-2021 milestone, leadership transition, and each defense program phase.
    whyItMatters: The milestone table is partial because public materials emphasize recent contracts over the full operating history.
    diligencePath: Request the internal company timeline or data room chronology and reconcile it against public announcements.
    relatedQuestionRefs:
    - QO008
    - QO025
    relatedTableRefs:
    - TO004
