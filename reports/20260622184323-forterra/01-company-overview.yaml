callouts:
- calloutType: strength
  title: Production proof point exists, not just prototype optics
  body: Forterra is no longer presenting itself as a lab-stage autonomy vendor. The company ties its story to production integration on Oshkosh Defense’s ROGUE-Fires program, Army UxS demonstrations, and a growing set of ecosystem integrations. That operating record is still narrower than a scaled prime’s, but it is materially stronger than pre-program pilot marketing.
  claimRefs:
  - CO029
  - CO030
  - CO031
  - CO033
- calloutType: risk
  title: Public transparency lags the ambition of the defense narrative
  body: The company discloses impressive contract wins and a broadening partner graph, yet it does not publicly disclose valuation, revenue, funded backlog, board composition, or a clean founder-to-current-CEO succession timeline. Those omissions make it difficult to translate headline momentum into underwriteable governance and cash-flow quality.
  claimRefs:
  - CO013
  - CO017
  - CO026
  - CO039
  - CO040
- calloutType: insight
  title: Forterra is becoming a systems-layer company, not just an ADS vendor
  body: The partner set from late 2025 to mid-2026 implies a strategic move up-stack. Forterra is pairing autonomy with communications, test-data infrastructure, and mission modules so it can sit at the orchestration layer across existing military and industrial vehicles rather than sell one narrow autonomy bolt-on.
  claimRefs:
  - CO006
  - CO007
  - CO034
  - CO035
  - CO036
  - CO037
