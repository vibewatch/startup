          tone: positive
        - label: 2025 launcher / armored-vehicle adjacencies
          detail: DeepFires and BAE AMPV show Forterra extending autonomy into additional platform categories
          tone: positive
        - label: 2026 production tooling
          detail: Nominal and Aeva selections support scaling, validation, and sensing for larger program execution
          tone: positive
        - label: 2026 production proof
