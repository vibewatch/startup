  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The financing headline is strong, but the underwriting file is still thin
        blocks:
          - type: paragraph
            body: >-
              Forterra’s financing narrative is easy to understand and hard to underwrite. On the positive side, the
              public record is unusually clear that the company raised real money from recognizable investors: the
              November 2025 Series C brought in $238 million of equity and debt, Moore Strategic led, several new
              crossover or venture-style backers joined, and Crescent Cove added both equity and debt. External coverage
              then pushed the story one step further by describing the round as a $1 billion-plus valuation event and a
              new unicorn. The problem is not the absence of interest. The problem is the absence of economics. The same
              public sources that trumpet the round do not disclose ARR, recognized revenue, gross margin, net
              retention, or debt terms. The use-of-proceeds language also implies a capital-intensive system business
              rather than a light software subscription model: communications, command-and-control, and edge-compute
              production capacity all need funding. That means the valuation debate cannot stop at the headline mark. It
              has to ask what the mark buys, how much seniority sits ahead of new money, and whether the company’s
              current revenue model looks more like premium software, defense systems integration, or a moving mix of
              both.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
