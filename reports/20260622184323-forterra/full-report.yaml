      - number: '7.2'
        title: Operational success depends on converting a partner-heavy stack into repeatable fielding
        blocks:
          - type: paragraph
            body: >-
              Forterra’s public momentum is real, but it is also highly conditional on partner and program execution.
              The company has a visible marquee path through Oshkosh and the Marine Corps: first the January 2025
              ROGUE-Fires production announcement, then the June 2026 Block 2 award worth $92 million and running
              through 2031. The Army OTA award adds a separate prototype-to-scale pathway, but that pathway is
              explicitly an evaluation process, not a guaranteed rollout. Around those two channels sits a dense
              dependency web. goTenna fills resilient mesh networking; Aeva fills long-range perception; Nominal fills
              production-rate validation; Raytheon, BAE, CHAOS, Volvo, Polaris, and Hiab extend Forterra into strike,
              armored vehicles, counter-UAS, transport, and load-handling workflows. This breadth strengthens the
              strategic story while raising execution complexity. Public materials show that Forterra is trying to solve
              the complexity with a common stack, real-time oversight through TerraLink, and open integration APIs. What
              they do not show is how reliably the stack performs at scale, how often integrations fail, or how many
              partner programs are moving from prototype theatre into durable production demand. That makes operational
              risk less about whether the company has ideas and more about whether it can industrialize validation,
              sustainment, and partner conversion simultaneously.
