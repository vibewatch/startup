      - number: '2.3'
        title: Buyer, User, and Budget Path
        blocks:
          - type: paragraph
            body: >-
              In defense, Forterra does not sell first to end consumers; it sells into acquisition systems. Buyers are
              Army and Marine Corps program offices and, often, the prime contractors or vehicle OEMs who control the
              base platform. Users are soldiers, Marines, and maintainers operating in logistics, launcher, breaching,
              reconnaissance, and convoy environments. Payers are defense acquisition budgets, often mediated by OTA
              demonstrations, platform integrations, evaluations, and then production awards. The Army’s August 2025 UxS
              autonomy awards show the workflow clearly: multiple autonomy vendors received small initial agreements to
              integrate onto Infantry Squad Vehicles for soldier demonstrations, creating a competitive funnel rather
              than an immediate winner-take-all outcome. The ROGUE-Fires path shows the next step: initial integration,
              production designation, then the 2026 Block 2 award with prime-contractor economics and a multi-year
              delivery window. Outside defense, adjacent industrial buyers include fleet operators and load-handling
              workflows, which is why Volvo Defense and Hiab matter as channels. Their budgets are governed more by
              safety, throughput, and labor substitution than by warfighting doctrine, but the adoption logic still
              requires ruggedization, integration, and trust in complex environments.
            claimRefs:
              - CM019
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
