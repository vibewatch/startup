  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Revenue quality
        - ARR, recognized revenue, gross margin, and retention
        - Needed to anchor valuation and compare software versus systems economics
        - CFO data room request + cohort review
      - - Cap table / terms
        - Debt terms, liquidation preferences, investor rights, and seniority
        - Determines real entry price and downside recovery
        - Legal diligence with financing docs
      - - Program conversion
        - Backlog, customer concentration, and award-to-revenue schedule
        - Separates momentum from monetization
        - COO / program finance workstream
      - - Safety and liability
        - Incident history, indemnities, and safety-case evidence
        - Can re-rate discount rate and exit odds quickly
        - Safety / legal specialist review
      - - Exit readiness
        - Audit readiness, controls, and board governance for later-stage capital
        - Determines whether IPO, strategic sale, or private hold is realistic
        - Controller + outside counsel review
    notes: >-
      These five asks are blocking because each one directly changes the entry-price debate rather than adding
      nice-to-have color.
    claimRefs:
      - CV035
      - CV036
