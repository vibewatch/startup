      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: This is a price-discipline call, not a quality dismissal
            body: >-
              Forterra may still become a highly valuable defense-autonomy platform. The issue is that public evidence
              today is much better at proving strategic relevance than at proving what a new investor should pay for
              that relevance.
            calloutType: recommendation
            claimRefs:
              - CV037
              - CV043
          - type: callout
            title: Without a revenue denominator, every multiple is fragile
            body: >-
              The public comp set shows that autonomy-adjacent companies can trade anywhere from roughly one times
              revenue to more than fifty times revenue. Without Forterra’s own revenue and term-sheet details, the
              reported unicorn mark is a headline, not yet a defensible underwriting anchor.
            calloutType: risk
            claimRefs:
              - CV034
              - CV036
