            body: >-
              The strongest public financial evidence is not revenue; it is contract and program momentum. Forterra’s
              June 2026 ROGUE-Fires Block 2 disclosure gives the cleanest proof because it describes a production award
              with deliveries expected through 2031, which is far more concrete than a prototype or lab demonstration.
              The Sandhills contract reference, the Army UxS cohort, and GEARS Phase II create additional demand
              proxies. They suggest Forterra is one of a small set of suppliers repeatedly invited into ground-autonomy
              programs. But the sales-efficiency picture is still incomplete because the most visible Army logistics
              opportunity, ATV-S, remains subject to budget timing and downselect risk. That nuance matters. A company
              can have strong technical momentum and still experience lumpy revenue if programs remain in prototype
              status or slide under continuing resolutions. Publicly, Forterra looks like a company with credible funnel
              quality and procurement relevance; privately, diligence still has to answer how quickly prototype wins
