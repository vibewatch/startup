  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Suite composition and user workflow
        blocks:
          - type: paragraph
            body: >-
              Forterra presents its product in workflow terms rather than as a monolithic robot. The public suite starts
              with AutoDrive for vehicle autonomy, TerraLink for planning and supervisory control, Vektor and goTenna
              for resilient communications, OASIS for interface normalization, and productized vehicle embodiments such
              as AutoTT and MESA. That framing matters because the same stack is shown moving from battlefield resupply
              and strike missions to yard tractors and load-handling automation. AutoDrive is the execution layer that
              turns a host vehicle into a self-driving asset, while TerraLink keeps a human operator in the loop through
              planning, live monitoring, alerts, and intervention. The commercial surfaces are thinner than the defense
              ones, but Forterra is consistently trying to sell modularity, mixed-fleet integration, and continuous
              operator oversight rather than a closed vehicle-only solution. That makes Forterra easier to slot into
              existing fleets, but it also means the operator experience depends on how cleanly the stack integrates
              with OEM vehicles and partner systems. That integration story is central to the product pitch.
