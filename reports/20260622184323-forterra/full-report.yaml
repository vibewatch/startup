      - number: '4.3'
        title: Cost structure, capital intensity, and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Forterra’s cost structure is easier to describe than to quantify. The retained evidence points to a
              hardware-and-services-heavy operating model: sensors and LiDAR from partners, embedded autonomy compute,
              communications hardware from goTenna, validation infrastructure through Nominal, field support, and
              integration work around partner carriers. That is not automatically bad; it can be exactly the right shape
              for a defense autonomy company. But it means gross margin is unlikely to look like pure software absent
              strong reuse and scale. The financing record reinforces the capital intensity. Forterra raised a $75
              million Series B, then a $238 million Series C, and SEC / NASAA filings show additional exempt-offering
              activity in late 2025 and early 2026. The combination suggests real capital access and investor
              confidence, yet also implies the company was still financing ahead of full public financial transparency.
              The key underwriting question is therefore not whether Forterra can raise money—it clearly can—but how
              efficiently that money converts into production revenue, support margins, and durable installed-base
              economics.
