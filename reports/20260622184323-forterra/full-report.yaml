      - number: '3.2'
        title: 'Capability comparison: kits, control layers, and software infrastructure'
        blocks:
          - type: paragraph
            body: >-
              Forterra’s public differentiation is strongest when compared feature-for-feature across the mission stack.
              AutoDrive is described as platform- and payload-agnostic, supports GPS-denied operation, and can handle
              waypoint navigation, convoying, and re-pathing, while TerraLink adds the mission-control layer that
              Forterra uses to argue it is more than a vehicle retrofit company. Overland’s story is narrower but
              potent: its public materials are relentlessly focused on off-road tactical autonomy, one-to-many
              orchestration, and fielded work with warfighters. Applied Intuition comes at the market from a different
              flank by trying to own the shared data engine, simulation, and validation environment around autonomy.
              Kodiak emphasizes hardened SensorPods and serviceability on many vehicle types, while Anduril frames the
              problem as collaborative mission autonomy across payloads rather than as a carrier-first vehicle kit. The
              net effect is that Forterra does not face one single rival archetype; it faces a portfolio of rivals each
              trying to own a different control point in the autonomy stack.
