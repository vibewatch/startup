      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Retrofit economics are more realistic than clean-sheet autonomy narratives
            body: >-
              Forterra’s strongest market position comes from integrating onto existing military and industrial vehicle
              families instead of asking buyers to redesign fleets around a new autonomous chassis. That shortens buyer
              education and helps primes turn autonomy into a capability kit rather than a moonshot platform bet.
            calloutType: strength
            claimRefs:
              - CM004
              - CM021
              - CM024
              - CM030
          - type: callout
            title: The TAM is real, but taxonomy inflation is a valuation trap
            body: >-
              Publisher estimates differ by more than 2x because they measure different slices of the UGV world.
              Investors should not add Forterra’s self-reported defense TAM to broad global UGV reports and call the sum
              an addressable market. The right lens is program-constrained, channel-constrained, and
              integration-constrained.
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM038
          - type: callout
            title: Communications and test infrastructure are now part of the market, not afterthoughts
            body: >-
              The goTenna acquisition and Nominal partnership show that the market for autonomy has widened beyond
              driving software. Buyers increasingly care about DDIL communications, telemetry, regression testing, and
              mission operations because those layers determine whether autonomy scales safely across fleets.
            calloutType: insight
            claimRefs:
              - CM024
              - CM025
              - CM034
          - type: callout
            title: Underwrite on conversion mechanics, not headline market size
            body: >-
              A credible diligence model for Forterra should follow how OTA demos become production awards, how prime
              contractors split economics, and how reusable the stack is across programs. That is more decision-useful
              than choosing one favorite global UGV forecast.
            calloutType: recommendation
            claimRefs:
