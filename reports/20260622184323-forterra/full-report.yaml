  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              Forterra’s market is best defined as autonomous ground mission systems, not as “self-driving” in the
              public-road robotaxi sense. Included spend centers on autonomy software, mission modules, communications,
              test-and-validation tooling, and retrofit integration applied to military ground vehicles and selected
              off-road or on-property industrial vehicles. In defense, the status-quo substitute is still the crewed
              tactical vehicle plus a human operator burdened with navigation, sensing, resupply, and remote-weapon
              tasks; tele-operated systems are the near-adjacent alternative but do not eliminate bandwidth or attention
              constraints. Forterra’s own 2024 framing explicitly says it is targeting defense vehicles and off-road or
              on-property commercial trucks rather than robotaxis or on-highway trucking. That means excluded spend
              should include public-road passenger autonomy, aerial and maritime unmanned systems, and broad C4ISR
              programs that are not tied to ground-vehicle autonomy. The cleanest way to think about Forterra is as the
              software, communications, and mission-integration layer that makes an existing vehicle platform
              autonomy-ready for dangerous logistics, resupply, launcher, breaching, or reconnaissance missions.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
