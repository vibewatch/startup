      - number: '1.4'
        title: Scale, Milestones, and Operating Risks
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows Forterra moving from a legacy autonomy specialist into a company with real
              program-of-record traction. Management said in early 2024 that the company had booked four large DoD
              contracts in 2023 and estimated the U.S. defense ground-autonomy market at more than $4 billion by 2026.
              In January 2025, Forterra announced that AutoDrive would be integrated into Oshkosh Defense’s ROGUE-Fires
              for what it described as the Department of Defense’s first production contract specifically for
              ground-vehicle autonomy. In August 2025, the Army awarded three UxS autonomy OTA agreements totaling about
              $15.5 million; Forterra’s role was to integrate AutoDrive onto four Infantry Squad Vehicles for soldier
              evaluation. In June 2026, Forterra and Oshkosh announced a two-delivery-order, $92 million ROGUE-Fires
              Block 2 production award extending through 2031. Around those contracts Forterra also added goTenna for
              mesh networking, launched the MESA vehicle, and announced partnerships with Volvo Defense, Hiab, BAE
              Systems, Aeva, Nominal, and CHAOS Industries. The adverse side of the record is not a public scandal but a
              disclosure problem: there is still no public revenue, backlog, board roster, or valuation, which means
              investors are asked to extrapolate scale from contract headlines and partner logos more than from audited
              operating evidence.
