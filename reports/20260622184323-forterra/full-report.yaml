      - number: '3.3'
        title: Distribution power, partner dependence, and switching costs
        blocks:
          - type: paragraph
            body: >-
              Forterra’s channel strategy both strengthens and constrains its market position. The strongest proof of
              scale in the retained evidence is not a public list-price catalog but the fact that Forterra is already
              embedded in partner-owned or customer-defined programs such as Army UxS and Oshkosh-backed ROGUE-Fires.
              That pattern creates stickiness because vehicle validation, safety cases, control interfaces, training,
              and mission data all become harder to unwind once a fleet is deployed. At the same time, the same
              architecture that speeds adoption also lowers exclusivity. Open APIs, retrofit kits, and modular payloads
              make multi-homing plausible if customers decide to combine one vendor’s driving stack with another
              vendor’s tooling, simulation, or carrier platform. Oshkosh therefore matters twice: it is Forterra’s most
              valuable route to production, and it is also the proof that the OEM layer can remain the system customer
              cares about most. Buyers appear to be procuring outcomes and program structures, not publicly standardized
              SKUs, which means whoever controls the prime relationship can capture a disproportionate share of the
              economic value.
            claimRefs:
