      - number: '8.4'
        title: The exit path and kill criteria hinge on disclosures management has not made publicly
        blocks:
          - type: paragraph
            body: >-
              Forterra’s public profile looks more ready for a strategic acquirer or specialist defense investor than
              for a public-market style underwriting process. The company can clearly point to mission relevance,
              contracts, and multi-product ambition. It cannot yet point to the financial controls and public disclosure
              density that outside investors typically need to underwrite a unicorn-round price with confidence. The
              strategic-acquisition path is easier to imagine because a buyer can diligence customer concentration,
              safety cases, and program economics behind closed doors. An IPO-style path is harder to imagine until
              audited metrics, governance depth, and financing transparency improve. That is why the final diligence
              asks are not optional clean-up items; they are the decision. If management can open revenue quality,
              cap-table structure, backlog conversion, and liability allocation, the recommendation can move quickly. If
              not, then the correct move is to preserve optionality, keep the company on the watchlist, and wait for
              either better evidence or a meaningfully cheaper entry point.
            claimRefs:
              - CV035
              - CV036
