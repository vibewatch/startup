  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing opacity
        blocks:
          - type: paragraph
            body: >-
              Forterra’s public materials describe a business that monetizes through deployed mission systems rather
              than through a simple software-seat model. AutoDrive, TerraLink, and mission modules are framed as pieces
              of a broader operating architecture that can be installed on defense vehicles, integrated with partner
              platforms, and supported through control, validation, and sustainment workflows. That is enough to
              conclude that Forterra has multiple revenue-bearing surfaces—autonomy kits, command layers, partner
              integration work, and newly added communications components after goTenna—but not enough to conclude how
              those surfaces are priced or recognized. The retained product pages expose no list pricing. Even the
              flagship program evidence is disclosed in operational terms rather than commercial terms. In practice,
              that means Forterra likely sells through negotiated program awards, partner channels, and custom scopes of
              work. The presence of multiple channels is positive for reach, but it also means the public record does
              not tell us which piece of the stack captures the highest margin or whether TerraLink is bundled into
              larger awards.
