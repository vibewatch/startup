      - number: '3.4'
        title: Moat durability and the adverse case
        blocks:
          - type: paragraph
            body: >-
              The bullish case for Forterra is straightforward: it has credible field evidence, a broad
              autonomy-plus-control narrative, and real channel partnerships around military carriers and mission
              systems. The bearish case is equally important. Better-capitalized rivals can own adjacent layers of the
              stack, and Army budget friction may delay the exact programs investors expect to turn technical breadth
              into durable revenue. Breaking Defense and National Defense are especially useful because they show the
              main near-term competitive risk is not that Forterra’s product suddenly stops working; it is that
              procurement timing, prime structure, and substitute offerings can blur or defer the monetization
              advantage. That is the subtle underwriting point. Forterra’s moat appears real in technical scope and
              current program credibility, but only partly durable at the budget layer because OEMs, enterprise-autonomy
              infrastructure vendors, and alternative retrofit companies can each capture slices of the same mission
              spend. Until public evidence shows realized win rates or retention after deployment, durability must be
              described as promising rather than proven.
