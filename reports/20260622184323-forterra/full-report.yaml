      - number: '8.3'
        title: Strategic upside is credible, but price discipline still points to research-more
        blocks:
          - type: paragraph
            body: >-
              A charitable bull case exists. Forterra has marquee defense traction, a broader product stack than many
              autonomy startups, and a credible ecosystem around sensing, communications, and mission software. If
              private diligence reveals strong recurring software economics and clean term-sheet structure, the company
              could deserve a premium private multiple. The base case from public evidence is weaker: strategic momentum
              is visible, but revenue quality and capitalization are opaque, so the reported $1 billion mark may be
              defendable for existing insiders without being attractive for a new investor. The bear case is not
              technological failure alone. It is a combination of procurement concentration, financing overhang, and
              valuation compression if economics lean more toward capital-heavy integration than premium software. That
              is why the best-supported recommendation is research-more or track rather than buy. This is not a
              dismissal of the business. It is a statement that the pricing case is materially less complete than the
              product and mission case.
            claimRefs:
