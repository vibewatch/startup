            body: >-
              Public evidence supports real adoption, but it does not yet support a broad or durable customer-base
              conclusion. No reviewed source disclosed NRR, GRR, churn, contract renewal rates, customer satisfaction
              scores, or a list of civilian fleet operators beyond OEM/channel partners. The most visible growth path
              still depends on defense appropriations and on partner-led fielding through primes and vehicle makers
              rather than direct fleet ownership by Forterra. Independent commentary makes that dependency explicit:
              Beehiiv's defense-tech analysis says Forterra's model 'enables the primes' to manufacture at scale, but
              also flags budget volatility, integration drag, and platform dependency as risks. Breaking Defense
              similarly notes the Army's ATV-S work is expected to move ahead only if budgets allow. Forterra does have
              credible expansion vectors — allied defense mobility via Volvo, load handling through Hiab, and 24/7 yard
              operations via Kalmar AutoTT — yet those opportunities remain earlier-stage than Marine Corps and Army
              work. The result is a customer profile with strong defense validation, incomplete retention disclosure,
              and material concentration around U.S. military programs plus a handful of OEM and prime relationships.
