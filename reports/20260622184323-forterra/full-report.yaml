  - id: FU001
    title: Customer Journey Map
    type: journey-map
    layout: wide
    summary: >-
      Shows how Forterra typically reaches end users through a partner-led path from requirement definition to scaled
      fielding.
    data:
      nodes:
        - label: 1. Mission Requirement
          detail: >-
            Army, Marine Corps, and logistics operators define autonomy needs in GPS-denied, high-risk, or
            labor-constrained environments
          tone: neutral
        - label: 2. OEM / Prime Integration
          detail: >-
            Forterra's stack is integrated onto partner vehicles from Oshkosh, BAE, Volvo, Hiab, or Kalmar rather than
            sold as a standalone fleet
          tone: neutral
        - label: 3. Prototype / Demo
          detail: Programs progress through demos such as Kuwait convoys, DSEI showcases, or Army evaluation vehicles
          tone: neutral
        - label: 4. Award / Program Selection
          detail: Examples include Army OTA awards, ATV-S prototyping, and the Marine Corps ROGUE-Fires award path
          tone: positive
        - label: 5. Production-Rate Delivery
          detail: >-
            Nominal's announcement and the June 2026 ROGUE-Fires Block 2 award indicate Forterra is building tooling for
            repeated delivery, not just experiments
          tone: positive
        - label: 6. Expansion / Concentration
          detail: >-
            Growth then depends on partner fielding success, defense budgets, and conversion of commercial channels into
            named fleet deployments
          tone: risk
    claimRefs:
      - CU004
      - CU009
      - CU017
      - CU019
      - CU023
      - CU037
      - CU038
    approximationNotes: >-
      Journey stages are generalized from disclosed program patterns and partner announcements; they do not imply every
      customer relationship follows exactly the same sequence.
  - id: FU002
    title: Adoption / Deployment Flow
    type: flow
    layout: standard
    summary: >-
      Illustrates Forterra's public progression from early field demonstrations to program awards and scaling
      infrastructure.
    data:
      nodes:
        - label: Historical field demos
          detail: Autonomous convoy training and demonstrations in Kuwait show early military usability
          tone: neutral
        - label: 2025 defense program broadening
