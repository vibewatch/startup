  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape overview and category boundaries
        blocks:
          - type: paragraph
            body: >-
              Forterra’s competitive set is wider than the handful of startups that also market autonomy kits for
              military ground vehicles. The company’s own positioning emphasizes an interoperable autonomy stack rather
              than a single carrier or a single sensor package, so the practical budget fight spans direct retrofit
              peers, autonomy-software layers, prime-owned military carriers, and the status quo of human-driven
              logistics plus prime-led integration. The Army’s 2025 UxS OTA cohort is the clearest direct peer signal
              because it named Forterra, Overland AI, and Scout AI for the same demonstration lane. But that direct
              cohort does not capture the larger substitute set. Applied Intuition attacks the shared data, simulation,
              and development layer; Kodiak attacks the vehicle-integrated virtual-driver lane; Oshkosh can package
              autonomy inside production-ready military carriers; Anduril competes from a mission-autonomy software
              layer. That is why the diligence question is not merely who else claims autonomy, but which layer of the
              stack can absorb the decision budget that Forterra needs to own.
            claimRefs:
