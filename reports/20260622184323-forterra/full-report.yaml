      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest driver is battlefield necessity. Forterra and its partners repeatedly frame autonomy as a
              way to remove warfighters from dangerous logistics, launcher, reconnaissance, and resupply missions while
              extending tempo in contested or GPS-denied conditions. Interoperability is the second major driver: OEMs
              and defense customers do not want a bespoke autonomous vehicle for every mission; they want a common stack
              that can move across carriers, launchers, logistics trucks, and last-tactical-mile assets. That is why
              Forterra keeps adding communications, data infrastructure, LiDAR, and mesh networking capabilities instead
              of only advertising driving software. But the same architecture creates constraints. Procurement cycles
              are long; production contracts are rare; and integration onto legacy platforms still requires
              certification, testing, and prime-contractor alignment. Market researchers also point to cybersecurity
              vulnerabilities, fragmented command-and-control standards, and power or endurance constraints as brakes on
              faster adoption. The spread between Mordor’s roughly $3 billion 2026 market and Verified’s much larger
              estimate is its own warning sign: investors should avoid pretending that all “UGV market” numbers are
              comparable. Forterra may be positioned in a good pocket of the market, but conversion from prototypes and
              announcements into recurring production revenue still depends on standards, budgets, and interoperability
              execution.
            claimRefs:
              - CM028
              - CM029
              - CM030
              - CM031
