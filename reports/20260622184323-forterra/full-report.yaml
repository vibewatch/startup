      - number: '1.3'
        title: Funding History and Capitalization
        blocks:
          - type: paragraph
            body: >-
              Forterra has disclosed at least three major capital events since 2021. In December 2021, then-Robotic
              Research / RR.AI was described as raising $228 million from SoftBank Vision Fund 2 and Enlightenment
              Capital. In September 2024, Forterra announced a $75 million Series B led by Moore Strategic Ventures, XYZ
              Venture Capital, and Hedosophia, with Standard Investments and existing investors including Enlightenment
              Capital, Crescent Cove Advisors, and Four More Capital. In November 2025, Forterra announced a $238
              million Series C comprising equity and debt, led by Moore Strategic Ventures and joined by Salesforce
              Ventures, Franklin Templeton, Balyasny Asset Management, 645 Ventures, Hanwha Asset Management, 9Yards
              Capital, NightDragon, and existing investors; Crescent Cove again provided both equity and debt. Summing
              only those disclosed events yields at least $541 million raised since late 2021, but public sources do not
              establish a complete lifetime total, current post-money valuation, or ownership concentration. The debt
              component inside the Series C matters because it indicates a more structured capitalization than the
              earlier equity-heavy rounds and suggests future performance will be judged against production and contract
              conversion rather than pure technology optionality.
