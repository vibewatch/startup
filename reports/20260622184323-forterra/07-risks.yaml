callouts:
- calloutType: risk
  title: The strongest evidence is momentum, not de-risking
  body: Forterra has enough official program and partnership evidence to show relevance, but the public record still lacks the failure-rate, covenant, and backlog data needed to conclude those wins are already low-risk economics rather than expensive progress markers.
  claimRefs:
  - CR021
  - CR024
  - CR025
  - CR028
- calloutType: recommendation
  title: Underwrite the conversion chain, not the announcement stream
  body: The practical diligence order is safety proof, program concentration, debt/preference terms, then partner conversion. If those four links are sound, the breadth of public announcements becomes a moat signal; if any one of them breaks, the same breadth becomes an overextension signal.
  claimRefs:
  - CR010
  - CR017
  - CR021
  - CR024
  - CR035
