  evidenceGaps:
  - type: access-blocked
    severity: material
    topic: debt-terms
    missingEvidence: Debt amount, covenants, collateral package, and liquidation preferences from the 2025 Series C financing.
    whyItMatters: Debt and preference terms can change downside recovery and whether new money is truly growth capital or quasi-bridge financing.
    diligencePath: Request financing documents, term sheets, and cap-table waterfall from management or counsel.
    relatedQuestionRefs:
    - QR015
    - QR026
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: incident-history
    missingEvidence: Public or private evidence on autonomy disengagements, field failures, near-misses, recalls, or safety incidents across Forterra deployments.
    whyItMatters: Without failure-rate data, investors cannot tell whether field scale is genuinely de-risked or only marketing-heavy.
    diligencePath: Ask for incident logs, safety case summaries, test reports, and customer reference calls focused on safety performance.
    relatedQuestionRefs:
    - QR025
  - type: missing-source
    severity: material
    topic: backlog-concentration
    missingEvidence: Booked backlog, customer concentration, and conversion cadence from awards to recognized revenue.
    whyItMatters: Program concentration is the central transmission path from operational delays into financing risk.
    diligencePath: Request backlog schedule by program, customer, and fiscal year together with conversion assumptions.
    relatedQuestionRefs:
    - QR023
    - QR027
  - type: missing-source
    severity: minor
    topic: export-controls
    missingEvidence: Program-specific export-license needs, foreign-customer constraints, and classified-handling burden beyond ITAR registration.
    whyItMatters: International scaling and partner interoperability may be slower than management messaging implies.
    diligencePath: Request export-compliance matrix by product, jurisdiction, and partner program.
    relatedQuestionRefs:
    - QR028
  - type: private-evidence-only
    severity: material
    topic: cyber-accreditation
    missingEvidence: Authority-to-operate status, cyber accreditation, red-team findings, and communications security certifications.
    whyItMatters: Counter-UAS, comms, and mission-software claims depend on cybersecurity assurance that is not visible in public materials.
    diligencePath: Request ATO status, pen-test summaries, and accreditation roadmap under NDA.
    relatedQuestionRefs:
    - QR025
