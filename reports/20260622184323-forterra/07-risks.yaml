- id: financial-and-execution-risk
  title: Capital intensity, disclosure gaps, and breadth of ambition are the underwriting bottlenecks
  body: 'The most important underwriting issue is that Forterra’s operating ambition is scaling faster than its public disclosure. The November 2025 Series C brought in $238 million of equity and debt, and the use-of-proceeds language is revealing: communications, command-and-control, and production capacity for edge-computing platforms. That is not the language of a light software company. It is the language of a systems builder carrying hardware, integration, and sustainment obligations. The same announcement links the round to multiple defense programs and partnerships, which is strategically positive but also makes concentration and working-capital risk more important. The goTenna purchase price remains undisclosed, and the debt terms, covenants, and preference stack from the round are also not public. Meanwhile Forterra is visibly still hiring engineers, safety experts, and field-oriented operators while expanding from mobility into strike, counter-UAS, and last-tactical-mile platforms.
    The company’s culture language favors deliberate shipping over perfection, which is sensible in defense iteration, but it also means investors need hard release-quality metrics rather than slogans. Until backlog conversion, debt terms, and safety evidence move from private to inspectable, the residual risk is that Forterra has built a strategically important ecosystem whose financing and execution complexity is still under-described to outside capital.'
