- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Program concentration
    - ROGUE-Fires or Army autonomy slip
    - Loss, material delay, or de-scope of a named marquee program
    - Pause underwriting until replacement pipeline and cash impact are clear
  - - Safety validation
    - Field incidents / autonomy reliability
    - Meaningful incident, recall, or poor customer reference on safety
    - Escalate to thesis-break unless failure is isolated and root-caused
  - - Communications resilience
    - Comms or cyber assurance
    - No credible EW / cyber accreditation path for goTenna-Vektor stack
    - Treat connectivity claims as marketing rather than moat
  - - Capital intensity
    - Financing behavior
    - Another insider-heavy or debt-heavy round before economics are disclosed
    - Assume dilution and financing risk are rising faster than execution
  - - Partner-to-production conversion
    - Demo to order progression
    - Major partnerships remain prototype-only after 12-18 months
    - Discount partner announcements from valuation and growth case
  - - Disclosure quality
    - Management willingness to open data room
    - No backlog, incident, cap-table, or covenant disclosure in diligence
    - Stop process or price only at heavy downside protection
  notes: These triggers are meant for investors, not operators; each is observable from diligence, company updates, or customer references without waiting for audited financials.
