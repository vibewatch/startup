chapter:
  number: 7
  title: Risks
  summary: 'Forterra’s biggest public risks are not concept risk but scale-conversion risk: proving safe autonomy in contested environments, converting marquee Army and Marine programs into durable economics, and managing a partner-heavy sensing, comms, and payload stack without overextending capital. Certifications, ITAR registration, and multiple partner wins show mitigation progress, but public evidence still leaves material gaps on incident history, debt terms, backlog conversion, and cyber assurance.'
sections:
- id: regulatory-legal-safety
  title: Regulatory, legal, and safety exposure still outruns public proof
  body: 'Forterra has credible baseline controls, but public evidence stops well short of a fully de-risked autonomy posture. The company is ISO 9001 certified and ITAR registered, and it keeps an up-to-date privacy notice that explicitly describes data handling and legal bases for processing. Those are useful hygiene markers, not proof that fielded autonomy risk is low. The sharper read comes from the government and legal-policy sources. The September 2025 DoD autonomy T&E guidebook says trusted mission capability requires iterative testing, data realism, and safety evidence, and it explicitly shifts safety responsibility from operators to designers, developers, and testers when autonomy acts without continuous human control. NHTSA likewise still describes automated-vehicle oversight through guidance and evolving resources rather than a closed compliance rulebook. The academic and Brookings sources matter because they show the same pattern from outside the company: liability, privacy, and
    compensation frameworks are still unsettled. That combination means Forterra can point to serious compliance intent without yet offering public evidence on incident rates, release assurance, or how legal risk is allocated across programs and customers. Even a supportive investor therefore has to diligence not just compliance posture but who bears blame, cost, and insurance consequences if autonomous behavior fails in the field or if a customer program asks for standards the company has not yet publicly documented.'
