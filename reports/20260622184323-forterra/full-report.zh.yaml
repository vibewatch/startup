      - number: '1.4'
        title: 规模、里程碑与运营风险
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，Forterra 正从传统自主技术专家，转向一家拥有真实正式项目牵引的公司。管理层在 2024 年初称，公司 2023 年拿下四个大型 DoD 合同，并估计美国防务地面自主市场到 2026
              年将超过 $4 billion。2025 年 1 月，Forterra 宣布 AutoDrive 将集成到 Oshkosh Defense 的 ROGUE-Fires 中，并称这是 Department of
              Defense 首个专门针对地面车辆自主的生产合同。2025 年 8 月，陆军授予三份 UxS 自主 OTA 协议，总额约 $15.5 million；Forterra 的角色是把 AutoDrive 集成到四辆
              Infantry Squad Vehicles 上，供士兵评估。2026 年 6 月，Forterra 与 Oshkosh 宣布一项两份交付订单、金额 $92 million 的 ROGUE-Fires
              Block 2 生产授标，延续到 2031 年。围绕这些合同，Forterra 还收购 goTenna 增强网状网络，推出 MESA 车辆，并宣布与 Volvo Defense、Hiab、BAE
              Systems、Aeva、Nominal 和 CHAOS Industries
              合作。记录中的不利面不是公开丑闻，而是披露问题：仍然没有公开收入、积压订单、董事会名单或估值，投资人被要求更多从合同标题和伙伴标识推断规模，而不是从经审计的运营证据推断规模。
