    claimRefs:
      - CV034
      - CV036
      - CV038
      - CV043
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 截至 2026 年 6 月，这张投委会风格评分卡显示，战略证据强于披露证据。
    data:
      items:
        - label: 市场需求
          score: 8
          max: 10
          note: 防务自主能力需求和标志性合同动能都已公开可见
        - label: 产品宽度
          score: 8
          max: 10
          note: 自主能力、通信、感知和新车模块都已公开可见
        - label: 客户 / 项目证据
          score: 7
          max: 10
          note: USMC 和 U.S. Army 信号很强，但仍然集中
        - label: 财务透明度
          score: 3
          max: 10
          note: 没有公开收入、利润率或股权结构细节
        - label: 估值支撑
          score: 3
          max: 10
          note: 独角兽名义估值存在，但经济锚点偏弱
        - label: 风险控制
          score: 5
          max: 10
          note: 质量和 ITAR 信号存在，但责任和安全证据仍不完整
        - label: 退出准备度
          score: 4
          max: 10
          note: 从公开证据看，战略出售路径比 IPO 路径更强
    claimRefs:
      - CV011
      - CV015
      - CV016
      - CV035
      - CV036
      - CV039
      - CV043
      - CV044
