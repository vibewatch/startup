      - number: '1.2'
        title: 领导层、创始人与治理
        blocks:
          - type: paragraph
            body: >-
              公开材料只能拼出一条部分复原的领导层故事，不能给出完整透明的治理图。2024–2026 年新闻稿中明确披露的 CEO 是 Josh Araujo；官网关于页面将 Joseph Putney
              列为首席技术官，并称其是长期运营者，参与搭建了早期 robo-shuttle、公交车和 yard-truck 项目。Forterra 网站保留的一篇 2021 年 12 月文章称，前身公司由 CEO
              Alberto Lacaze 和副总裁 Karl Murphy 于 2002 年共同创立，意味着公司后来过渡到 Josh Araujo 时代；但 Forterra 官网没有清楚记录交接发生时间，也没有说明
              Lacaze 和 Murphy 是否保留董事会或顾问角色。这条缺失时间线很重要，因为公司当前叙事高度依赖使命连续性和部署经验。治理披露同样偏薄：公司公开页面没有列出董事会、独立董事或正式委员会结构。结果是 CEO
              和 CTO 层面存在实质关键人风险，投资人在承销长期防务项目敞口前，还需要核验董事会监督、创始人持股和高管继任规划。
