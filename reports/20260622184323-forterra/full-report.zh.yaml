      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              2021 年以来，Forterra 至少披露了三次重大融资事件。2021 年 12 月，当时的 Robotic Research / RR.AI 被描述为从 SoftBank Vision Fund 2 和
              Enlightenment Capital 融资 $228 million。2024 年 9 月，Forterra 宣布 $75 million Series B，由 Moore Strategic
              Ventures、XYZ Venture Capital 和 Hedosophia 领投，Standard Investments 以及 Enlightenment Capital、Crescent Cove
              Advisors、Four More Capital 等现有投资者参投。2025 年 11 月，Forterra 宣布 $238 million Series C，由股权和债务组成，Moore Strategic
              Ventures 领投，Salesforce Ventures、Franklin Templeton、Balyasny Asset Management、645 Ventures、Hanwha Asset
              Management、9Yards Capital、NightDragon 和现有投资者加入；Crescent Cove 再次同时提供股权和债务。仅合计这些已披露事件，2021 年末以来融资至少 $541
              million，但公开来源不能证明完整累计融资、当前投后估值或股权集中度。Series C
              中的债务部分值得关注，因为它显示资本结构比早期偏股权的轮次更复杂，也意味着未来表现会更多按生产和合同转化来评判，而不是只看技术可选性。
