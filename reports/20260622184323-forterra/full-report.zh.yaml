    rows:
      - - 牛市
        - Rogue-Fires 和陆军项目按计划放量，合作伙伴栈转化为重复部署，且私下尽调显示强软件经济性。
        - 如果披露收入支撑高溢价自主技术倍数，独角兽以上估值可以守住或扩大。
        - 仍需要低稀释和可信的安全证明。
        - 需要私有数据室证据；这些证据今天在公开渠道看不到。
      - - 基准
        - 项目牵引继续，但收入和股权结构披露仍不完整，导致可比公司选择范围很宽。
        - 报道中的 $1B 标记对内部投资人或许能自圆其说，但对新投资人并不明显有吸引力。
        - 价格纪律和条款结构主导上行空间。
        - 最符合当前公开证据。
      - - 熊市
        - 原型到量产滑坡、融资包袱，或合同转化疲弱在尽调中暴露。
        - 如果经济性更像硬件占比高的防务集成，而不是高溢价软件，报道中的独角兽定价会大幅压缩。
        - 集中度、债务和责任折现率相互叠加。
        - 公开证据让这条下行情景非常可信。
