      - number: '8.3'
        title: 战略上行可信，但价格纪律仍指向继续研究
        blocks:
          - type: paragraph
            body: >-
              一个善意的牛市案例确实存在。Forterra
              有标杆防务牵引，产品栈比许多自主系统创业公司更宽，围绕感知、通信和任务软件也搭出可信生态。如果私下尽调显示经常性软件经济性强、条款结构干净，公司可能配得上更高的私募倍数。公开证据支撑的基准情形更弱：战略势能可见，但收入质量和资本结构不透明，因此报道中的
              $1 billion
              估值，对既有内部人或许守得住，对新投资人未必有吸引力。熊市情形也不只是技术失败，而是采购集中、融资悬而未解，以及当经济性更偏资本密集型集成而非高溢价软件时出现的估值压缩。因此，证据最能支撑的建议是继续研究或跟踪，而不是买入。这不是否定业务质量，而是说价格论证远没有产品和任务论证完整。
