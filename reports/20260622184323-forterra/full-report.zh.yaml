              最强的公开财务证据不是收入，而是合同和项目动能。Forterra 2026 年 6 月 ROGUE-Fires Block 2 披露给出最干净的证明，因为它描述的是一项生产授标，交付预计持续到 2031
              年，比原型或实验室演示具体得多。Sandhills 合同提及、陆军 UxS 队列和 GEARS Phase II 构成额外需求代理。它们表明，Forterra
              是少数反复受邀进入地面自主项目的供应商之一。但销售效率图仍不完整，因为最显眼的陆军物流机会 ATV-S 仍受预算时点和 downselect
              风险影响。这个细节很重要。即使技术动能很强，只要项目仍停留在原型状态或在持续决议下后移，公司收入也会波动。公开来看，Forterra
              像是一家漏斗质量和采购相关性都可信的公司；私下尽调仍要回答，原型获胜能多快转化成经常性生产经济性。
