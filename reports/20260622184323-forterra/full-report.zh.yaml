      - number: '5.3'
        title: 部署成熟度与生态证据
        blocks:
          - type: paragraph
            body: >-
              Forterra 的成熟度案例更多依赖外部集成，而不是自有封闭工厂生产。公开证据显示，AutoDrive 正进入陆军 ISV 原型、ROGUE-Fires Block 2、DeepFires 发射器原型、与
              BAE 合作的 AMPV 原型，以及与 Kalmar、Hiab、Volvo 的物流合作。MESA 把技术栈打包进一款基于 Polaris 的自主车辆；Nominal 和 Aeva
              则显示，随着部署扩展，Forterra 正在加固测试基础设施和感知技术栈。模式很一致：Forterra 赋能自主和通信，再依靠
              OEM、主承包商和专业供应商提供基础车辆、载荷或主要感知子系统。这会降低资本强度，并迅速扩大触达面；但也意味着产品推出时点取决于 Forterra
              不能完全控制的伙伴项目、防务预算和集成日程。换句话说，产品成熟度更像生态编排，而不是从零制造的所有权；这很有力量，但结构上也有依赖。
