            body: Forterra 最强的市场位置来自集成到既有军用和工业车辆家族，而不是要求买方围绕一款新自主底盘重建车队。这会缩短买方教育周期，也帮助主承包商把自主能力变成能力套件，而不是押注一款登月式平台。
