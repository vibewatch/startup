              Forterra 的渠道策略既强化也约束了市场位置。保留证据中最强的规模证明不是公开标价目录，而是 Forterra 已经嵌入 Army UxS、Oshkosh 支持的 ROGUE-Fires
              等伙伴拥有或客户定义的项目。这种模式带来粘性，因为车队部署后，车辆验证、安全案例、控制接口、训练和任务数据都会更难拆掉。与此同时，加速采用的同一架构也降低排他性。开放
              API、改装套件和模块化载荷让多归属变得可行：客户可能把一家供应商的驾驶技术栈，与另一家的工具、仿真或运载平台组合使用。因此，Oshkosh 有双重意义：它是 Forterra 最有价值的量产路径，也是 OEM
              层仍可能成为系统客户最在意对象的证据。买方看起来在采购结果和项目结构，而不是公开标准化 SKU；这意味着谁控制主承包关系，谁就可能拿走不成比例的经济价值。
