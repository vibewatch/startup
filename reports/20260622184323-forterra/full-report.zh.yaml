  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 套件构成与用户流程
        blocks:
          - type: paragraph
            body: >-
              Forterra 用工作流来呈现产品，而不是把产品讲成一台单体机器人。公开套件从负责车辆自主的 AutoDrive、负责规划和监督控制的 TerraLink 开始，再到用于韧性通信的 Vektor 和
              goTenna、用于接口标准化的 OASIS，以及 AutoTT、MESA 等产品化车辆形态。这个框架很重要，因为同一套技术栈被展示为可从战场补给和打击任务，迁移到 yard tractors
              和装卸自动化。AutoDrive 是执行层，把宿主车辆变成自驾资产；TerraLink 则通过规划、实时监控、警报和干预，把人类操作员留在闭环中。商业侧表面比防务侧更薄，但 Forterra
              始终在销售模块化、混合车队集成和持续操作员监督，而不是封闭的纯车辆方案。这让 Forterra 更容易嵌入既有车队，但也意味着操作员体验取决于技术栈与 OEM
              车辆和伙伴系统集成得有多干净。这条集成故事是产品叙事的中心。
