      - number: '2.3'
        title: 买方、用户与预算路径
        blocks:
          - type: paragraph
            body: >-
              在防务领域，Forterra 不是先卖给终端消费者，而是卖进采购系统。买方是陆军和海军陆战队项目办公室，往往还包括控制基础平台的主承包商或车辆
              OEM。用户是在物流、发射、破障、侦察和车队环境中操作的士兵、海军陆战队员和维护人员。付款方是防务采购预算，通常通过 OTA 演示、平台集成、评估，再进入生产授标。陆军 2025 年 8 月 UxS
              自主授标把流程展示得很清楚：多家自主供应商拿到小额初始协议，把系统集成到 Infantry Squad Vehicles 上做士兵演示，形成竞争漏斗，而不是立刻赢家通吃。ROGUE-Fires
              路径展示了下一步：先集成，再获得生产定性，然后是 2026 年 Block 2 授标，带有主承包商经济性和多年交付窗口。防务之外，邻近工业买方包括车队运营商和装卸流程运营方，这也是 Volvo Defense 与
              Hiab 作为渠道重要的原因。它们的预算更多由安全、吞吐量和劳动力替代驱动，而不是作战理论驱动；但采用逻辑仍然要求在复杂环境里完成加固、集成并建立信任。
