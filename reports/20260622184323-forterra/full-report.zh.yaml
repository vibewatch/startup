      - number: '7.2'
        title: 运营成功取决于把伙伴偏重的技术栈转化为可重复列装
        blocks:
          - type: paragraph
            body: >-
              Forterra 的公开势能确实存在，但能否兑现，很大程度取决于合作伙伴和项目执行。公司经由 Oshkosh 和 Marine Corps 已经跑出一条醒目的标杆路径：先是 2025 年 1 月宣布
              ROGUE-Fires 生产，再到 2026 年 6 月拿下价值 $92 million、延续至 2031 年的 Block 2 合同。Army OTA
              合同又打开一条从原型到规模化的路径，但这条路明确还是评估流程，不是确定铺开。两条通道之外，Forterra 还被一张密集依赖网包住。goTenna 补韧性 mesh 组网，Aeva 补远距感知，Nominal
              补生产节拍验证；Raytheon、BAE、CHAOS、Volvo、Polaris 和 Hiab 则把 Forterra 延伸到打击、装甲车辆、反
              UAS、运输和装卸流程。覆盖面越宽，战略叙事越强，执行复杂度也越高。公开材料显示，Forterra 想用一套通用技术栈、TerraLink 的实时监督，以及开放集成 API
              来压住复杂度。公开材料没有说明的是：技术栈在规模化时有多可靠，集成失败有多频繁，又有多少合作伙伴项目正从原型展示转成可持续生产需求。因此，运营风险的核心不是公司有没有想法，而是能否同时把验证、保障和伙伴转化工业化。
