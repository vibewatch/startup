      - number: '5.4'
        title: 信任姿态、控制与技术风险
        blocks:
          - type: paragraph
            body: >-
              Forterra 有一些真实的公开信任标记，但它们偏运营和制造，而不是重软件保障。认证页面列出 ISO 9001、ITAR 注册和 IPC/WHMA
              线束资质；产品页面也反复强调操作员监督、避障和降级条件下运行。招聘和职位页面同样显示，公司文化强调安全专家和有节奏发货。缺失项同样重要：没有公开状态页，没有网络认证包，没有公开安全架构，也没有关于脱离接管、正常运行时间、误报或车队可靠性的详细验证指标。独立报道还强调
              Forterra
              上市路径的下行面，也就是预算波动、合规拖累，以及对大型制造和项目伙伴的依赖。因此，本章支持积极的产品成熟度判断，但不支持已完整承销的安全或网络保障判断。当前公开记录足以支持流程成熟，但若没有私下尽调材料，仍不足以完成采购级网络或安全审查。
