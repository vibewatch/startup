  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律和安全敞口仍跑在公开证据前面
        blocks:
          - type: paragraph
            body: >-
              Forterra 有可信的基线控制，但公开证据远不足以说明自主风险已充分去风险。公司通过 ISO 9001 认证并完成 ITAR
              注册，也保持最新隐私通知，明确说明数据处理和处理法律基础。这些是有用的卫生指标，不是已部署自主风险较低的证明。更锋利的判断来自政府和法律政策来源。2025 年 9 月 DoD 自主 T&E
              指南称，可信任务能力需要迭代测试、数据真实性和安全证据；当自主系统在没有持续人类控制的情况下行动时，安全责任会明确从操作员转向设计者、开发者和测试者。NHTSA
              同样仍通过指南和演进资源描述自动驾驶车辆监管，而不是一套封闭合规规则。学术和 Brookings 来源重要，是因为它们从公司外部展示了同一模式：责任、隐私和赔偿框架仍未稳定。组合起来看，Forterra
              可以指向严肃的合规意图，但还没有公开给出事故率、发布保障，或法律风险如何在项目与客户之间分配的证据。因此，即便支持公司的投资人，也必须尽调的不只是合规姿态，还包括如果现场自主行为失效，或客户项目要求公司尚未公开记录的标准时，谁承担责任、成本和保险后果。
