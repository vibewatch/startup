              Defense 和 National Defense 尤其有用，因为它们显示，近期主要竞争风险不是 Forterra
              产品突然失效，而是采购时点、主承包结构和替代产品可能模糊或推迟货币化优势。这是更微妙的承销点。Forterra 的护城河在技术范围和当前项目可信度上看起来真实，但在预算层只具备部分耐久性，因为
