    type: flow
    layout: wide
    summary: 勾勒为什么战略牵引力足以支持关注，但披露缺口又不足以给出带价格的买入结论。
    data:
      nodes:
        - id: n1
          label: 市场：防务自主需求 + 标志性合同
        - id: n2
          label: 产品：集成自主、通信、传感、边缘计算
