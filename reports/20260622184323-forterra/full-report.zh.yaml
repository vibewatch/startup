          - type: callout
            title: 承销重点应是转化链，而不是公告流
            body: 实务尽调顺序应是安全证明、项目集中度、债务 / 优先权条款，再到合作伙伴转化。四个环节都稳，公开公告的宽度才是护城河信号；任何一环断掉，同样的宽度就会变成过度扩张信号。
