  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 比较最强公开客户或渠道证明的具体性和成熟度。
    data:
      columns:
        - 具名终端用户？
        - 部署成熟度
        - 期限可见度
        - 商业化可见度
      rows:
        - label: ROGUE-Fires / Oshkosh
          values:
            - 是——USMC
            - 量产授标
            - 高——持续到 2031 年
