  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Forterra 是一家自主技术公司的当前品牌。公司 2002 年以 Robotic Research 起步，之后以 RR.AI 品牌运营商业部门，并在 2024 年 2 月把合并后的公司更名为
              Forterra。当前身份明显以防务优先：Forterra 称自己是分布式、任务感知行动的「自主骨干」，用软件、通信和任务模块覆盖多类车辆，而不是绑定一款自有底盘。产品表面是模块化的。AutoDrive
              是自动驾驶系统，TerraLink 是车辆管理和指挥层，Vektor、Oasis 以及收购来的 goTenna 能力则扩展通信、数据中介和网状网络。Forterra 仍展示工业和物流用例，但 2024 至
              2026 年的公开表述已经很清楚：重心在军事自主、争议环境，以及快速集成到既有主承包商或 OEM 车辆平台。
