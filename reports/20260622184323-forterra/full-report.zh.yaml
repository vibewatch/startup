            title: 最强证据是势能，不是风险出清
            body: Forterra 已有足够的官方项目和合作证据来证明相关性，但公开记录仍缺少失败率、契约和 backlog 数据，无法判断这些胜利已经是低风险经济性，还是代价高昂的进展标记。
            calloutType: risk
