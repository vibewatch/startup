            body: >-
              仅看公开证据，Forterra 财务上可信，但还不能完整承销。公司有实质资本流入、强投资者名单、一个海军陆战队生产项目，以及多项其他军事需求信号。这些事实足以支持一个判断：Forterra
              不是投机性的前产品故事。但截至 2026-06-22，它们不足以支撑一套清晰的收入质量、毛利路径或 runway
              模型。缺失项很基础：确认收入、烧钱、现金、债务条款、客户集中度、合同毛利结构，以及经常性软件经济性与非经常性工程之间的清晰拆分。换句话说，看多逻辑有强融资和合同证据；谨慎逻辑则指出，这些证据与正常化单位经济性之间的会计桥仍是私有信息。正确的投资者结论不是「因为不透明而避开」，而是「除非管理层愿意打开运营模型，否则继续研究」。
