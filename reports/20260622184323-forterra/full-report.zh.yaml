      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强驱动是战场必要性。Forterra 及其伙伴反复把自主能力描述为一种方式：把作战人员从危险物流、发射、侦察和补给任务中移开，同时在争议或 GPS 受限条件下拉长行动节奏。互操作性是第二大驱动：OEM
              和防务客户不想为每个任务买一辆定制自主车；他们想要一套通用技术栈，能跨运载车、发射器、物流卡车和最后战术一英里资产迁移。因此，Forterra 不只宣传驾驶软件，还持续增加通信、数据基础设施、LiDAR
              和网状网络能力。但同一架构也带来约束。采购周期很长，生产合同稀缺，把系统集成到遗留平台仍需要认证、测试和主承包商协同。市场研究机构还指出，网络安全漏洞、碎片化指挥控制标准，以及电力或续航约束，都会拖慢采用。Mordor
              约 $3 billion 的 2026 年市场与 Verified 更大估计之间的差距，本身就是警示：投资人不应假装所有「UGV market」数字都可比。Forterra
              可能位于市场中的好口袋，但从原型和公告转化为经常性生产收入，仍取决于标准、预算和互操作执行。
