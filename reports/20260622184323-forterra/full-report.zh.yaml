      - number: '8.2'
        title: 公开可比区间太宽，收入缺失成了核心估值风险
        blocks:
          - type: paragraph
            body: >-
              可比公司分析的主要价值，是给估值贴上警示标签。被引用的公开同业都有当前 SEC 申报轨迹，但经济性差异极大。Aurora 几乎没有当前收入，因此倍数极端。Ouster
              展示了自动驾驶相邻硬件和感知公司在收入真实但仍不大的阶段，公开市场会如何定价。Oshkosh 则是另一端：规模化防务和特种车辆 OEM，交易价格接近一倍收入。Palantir
              展示了公开市场如何给高披露、任务关键型、有真实规模和利润杠杆的防务软件定价。Forterra
              的公开材料没有说明它落在这一区间的哪里，因为收入分母没有披露。因此，投资人不能在没有私下尽调的情况下，负责地把报道中的独角兽估值映射成隐含倍数。可比组并不能证明 Forterra 贵或便宜。它证明的是，同一个
              $1 billion 标题，含义会完全不同，取决于 Forterra 隐藏的经济性更像未规模化的自主系统、硬件很重的系统集成，还是高溢价防务软件。
