  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局概览与类别边界
        blocks:
          - type: paragraph
            body: >-
              Forterra
              的竞争集合比少数同样营销军用地面车辆自主套件的创业公司更宽。公司自己的定位强调可互操作自主技术栈，而不是单一运载平台或单一传感器包；因此，实际预算争夺横跨直接改装同业、自主软件层、主承包商自有军用运载平台，以及有人驾驶物流加主承包商主导集成的现状方案。陆军
              2025 年 UxS OTA 队列是最清晰的直接同业信号，因为它把 Forterra、Overland AI 和 Scout AI 放在同一演示赛道。但这个直接队列无法覆盖更大的替代集合。Applied
              Intuition 进攻共享数据、仿真和开发层；Kodiak 进攻车辆集成 virtual-driver 赛道；Oshkosh 能把自主能力打包进可生产的军用运载平台；Anduril
              则从任务自主软件层竞争。因此，尽调问题不只是还有谁声称自己做自主，而是哪一层技术栈能吸收 Forterra 需要拥有的决策预算。
