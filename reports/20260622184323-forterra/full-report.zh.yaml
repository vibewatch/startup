            body: >-
              Forterra 的成本结构比具体数值更容易描述。保留证据指向一个硬件和服务占比较高的运营模式：来自伙伴的传感器和 LiDAR、嵌入式自主计算、goTenna 的通信硬件、通过 Nominal
              获取的验证基础设施、现场支持，以及围绕伙伴运载平台的集成工作。这不自动是坏事；对防务自主公司来说，这可能正是合适形态。但这意味着，如果没有强复用和规模，毛利率不太可能像纯软件。融资记录进一步强化了资本强度。Forterra
              先融到 $75 million Series B，又融到 $238 million Series C；SEC / NASAA 申报还显示 2025 年末和 2026
              年初有额外豁免发行活动。组合起来看，公司确实能获得资本，投资者信心也真实存在；但也意味着公司在公开财务完全透明之前仍在超前融资。关键承销问题因此不是 Forterra
              能不能融资——显然能——而是这些钱多高效地转化为生产收入、支持毛利和耐久的装机基础经济性。
