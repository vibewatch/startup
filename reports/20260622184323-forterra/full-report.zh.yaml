            body: >-
              Forterra 的公开材料描述的是一门通过已部署任务系统变现的业务，而不是简单的软件席位模式。AutoDrive、TerraLink
              和任务模块被包装为更大运营架构的一部分，可安装到防务车辆上、与伙伴平台集成，并通过控制、验证和保障流程获得支持。这足以判断 Forterra 有多个承载收入的表面——自主套件、指挥层、伙伴集成工作，以及
              goTenna 之后新增的通信组件——但不足以判断这些表面如何定价或确认收入。保留的产品页面没有列出标价。即便旗舰项目证据，也以运营术语披露，而不是商业术语。实际情况可能是，Forterra
              通过协商项目授标、伙伴渠道和定制工作范围销售。多渠道有利于触达，但也意味着公开记录不能告诉我们技术栈哪一块获得最高毛利，或 TerraLink 是否被打包进更大的授标。
