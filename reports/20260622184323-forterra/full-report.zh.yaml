  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Forterra 的市场最好定义为自主地面任务系统，而不是公共道路 robotaxi
              意义上的「自动驾驶」。纳入的支出集中在自主软件、任务模块、通信、测试与验证工具，以及应用在军用地面车辆和部分越野或场内工业车辆上的改装集成。在防务领域，现状替代方案仍是有人驾驶战术车辆，加上一名承担导航、感知、补给和远程武器任务的人类操作员；遥操作系统是近邻替代方案，但无法消除带宽或注意力约束。Forterra
              自己在 2024 年的表述明确说，公司瞄准防务车辆和越野或场内商用卡车，而不是 robotaxi 或公路干线卡车。因此，排除支出应包括公共道路乘用车自主、空中和海上无人系统，以及不绑定地面车辆自主的大型
              C4ISR 项目。理解 Forterra 最清晰的方式，是把它看作软件、通信和任务集成层：这层能力让既有车辆平台可以为危险物流、补给、发射、破障或侦察任务做好自主化准备。
