  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群分层
        blocks:
          - type: paragraph
            body: >-
              Forterra 已披露的客户地图，最好理解为分层的买方—用户—渠道模型，而不是简单 logo 清单。当前最清晰的终端用户是防务组织，尤其是美国海军陆战队和美国陆军；合同和集成路径则往往经过 Oshkosh
              Defense、BAE Systems、Volvo Defense 等主承包商或 OEM，以及物流设备伙伴。独立分析也显示，Forterra
              试图在军事和工业环境中复用同一套自主技术栈：一边是军事物流车队、自主发射器和步兵支援车辆，另一边是集装箱堆场、配送中心和装卸流程。商业侧在公开渠道合作上真实存在——尤其是 Hiab 和 Kalmar AutoTT
              页面——但已审阅证据没有浮现出具名民用车队运营商大规模购买和部署 Forterra
              系统。因此，防务不只是最成熟的细分市场；它也是今天唯一拥有反复具名终端用户证据和项目级具体性的细分市场。公开分层还显示，Forterra
              把买方经济性与用户经济性分开：主承包商或设备制造商可能负责集成和签约，作战人员或堆场操作员才是最终用户。这个架构很重要，因为集中度应跨终端项目和中介渠道衡量，而不是只数某一层 logo。
