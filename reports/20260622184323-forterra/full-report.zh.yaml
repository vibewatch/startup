      - number: '8.4'
        title: 退出路径和否决标准，取决于管理层尚未公开的披露
        blocks:
          - type: paragraph
            body: >-
              从公开画像看，Forterra
              更像是已经适合战略收购方或专业防务投资人审视，而不是适合公开市场式承销流程。公司显然能指向任务相关性、合同和多产品野心；但还不能指向外部投资人通常需要的财务控制和公开披露密度，以便有信心承销独角兽轮价格。战略收购路径更容易想象，因为买方可以在闭门尽调里核验客户集中度、安全案例和项目经济性。IPO
              式路径更难想象，除非审计指标、治理深度和融资透明度提升。因此，最终尽调问题不是可选的清理项，而是投资决定本身。管理层如果能打开收入质量、股权结构、订单积压
              转化和责任分配，建议可以很快调整。否则，正确动作是保留选择权，把公司留在观察名单上，等待更好的证据，或明显更便宜的进入点。
