  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资标题很强，但承销材料仍然偏薄
        blocks:
          - type: paragraph
            body: >-
              Forterra 的融资叙事很容易理解，却很难承销。正面看，公开记录异常清楚地显示，公司确实从有辨识度的投资人手里融到真钱：2025 年 11 月 Series C 引入 $238 million
              股权和债务资金，Moore Strategic 领投，若干新的 crossover 或风险投资型支持者加入，Crescent Cove 同时提供股权和债务。外部报道又把故事往前推了一步，将这轮融资描述为估值超过
              $1 billion 的事件，并称其为新的独角兽。问题不是没有兴趣，而是缺少经济性。同样高调报道这轮融资的公开来源，没有披露
              ARR、确认收入、毛利率、净留存或债务条款。募资用途也指向资本密集型系统业务，而不是轻软件订阅模型：通信、指挥控制和边缘计算产能都需要资金。这意味着估值讨论不能停在标题估值上。必须问清这一定价买到什么，有多少优先级排在新钱之前，以及公司当前收入模型更像高溢价软件、防务系统集成，还是两者之间不断移动的组合。
