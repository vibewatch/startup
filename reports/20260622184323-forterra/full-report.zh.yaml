      - number: '6.3'
        title: 耐久性、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              公开证据支持真实采用，但还不能支持宽泛或耐久的客户基础结论。已审阅来源没有披露 NRR、GRR、流失、合同续约率、客户满意度分数，也没有列出 OEM /
              渠道伙伴之外的民用车队运营商。最显眼的增长路径仍依赖防务拨款，以及由主承包商和车辆制造商牵头的伙伴列装，而不是 Forterra 直接拥有车队。独立评论把这种依赖说得很明白：Beehiiv
              的防务科技分析称，Forterra 的模式「让主承包商能够」规模化制造，但也提示预算波动、集成拖累和平台依赖等风险。Breaking Defense 同样指出，陆军 ATV-S
              工作预计只有在预算允许时才会推进。Forterra 确实有可信扩张向量——通过 Volvo 进入盟友防务机动，通过 Hiab 进入装卸，通过 Kalmar AutoTT 进入 24/7
              堆场运营——但这些机会仍比海军陆战队和陆军工作更早期。结果是，客户画像有强防务验证，留存披露不完整，并围绕美国军事项目和少数
              OEM、主承包商关系存在实质集中度。已审阅材料因此支持一种谨慎的耐久性解读：Forterra 在相邻防务项目中反复出现，但公开证据仍没有揭示其中多少活动转化为经常性软件收入、已承诺后续规模或多年商业续约。
