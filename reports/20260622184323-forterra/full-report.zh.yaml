            - 原型 / 遴选
            - 低至中——FY2026 年中决策点
            - 项目胜出方和车队计划公开前为低
        - label: Volvo Defense
          values:
            - 未具名部委
            - 演示
            - 低
            - 盟友渠道扩张为中
        - label: Hiab / Kalmar 商业渠道
