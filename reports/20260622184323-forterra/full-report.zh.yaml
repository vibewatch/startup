      - number: '5.2'
        title: 架构与技术构件
        blocks:
          - type: paragraph
            body: >-
              最好的公开架构证据来自 Forterra 2025–2026 年的任务模块发布，以及 MESA 和 Tensor 宣传页。这些来源展示了一套分层系统：AutoDrive
              处理定位、感知、行为生成和任务执行；TerraLink 提供指挥控制；Vektor 管理降级链路上的路由、故障切换和数据传输；goTenna 贡献低特征网状网络；OASIS
              标准化第三方传感器、效应器和载荷接入方式。Tensor 通过组合 Vertex 感知、Vektor 通信和 goTenna 连接，把同一架构延展到电磁频谱行动中。结果是一套面向 GPS 受限和 DDIL
              行动、可信的边缘技术栈；但公开表面仍缺少 API 参考、ontology schema、安全案例或 changelog
              历史，外部技术买方无法检查这些集成主张到底有多开放。版本控制、管理员控制和开发者体验可能在私下存在，但从已审阅公开表面无法检视。
