      - number: '2.2'
        title: 用多重视角测算市场
        blocks:
          - type: paragraph
            body: >-
              没有任何单一公开估计能完美覆盖 Forterra 的可服务市场，所以正确做法是保留多套测算视角。Forterra 自己的公司视角认为，仅美国防务地面自主市场到 2026 年就可能超过 $4
              billion，而越野物流 / drayage / 私有道路商业邻近市场可能达到 $23 billion。第三方 UGV 研究机构给出更宽、但仍有关联的锚点区间。Mordor Intelligence
              估计无人地面车辆市场 2025 年为 $2.81 billion，2026 年为 $3.02 billion，2031 年在 8.06% CAGR 下达到 $4.45 billion。Global Market
              Insights 给出 2024 年 $3.1 billion、2034 年 $7.4 billion；Verified Market Reports 采用更宽泛口径，落在 2025 年 $6.4
              billion、2034 年 $14.8 billion。Global Growth Insights 更接近 Mordor，给出 2025 年 $3.01 billion、2026 年 $3.22
              billion、2035 年 $5.81 billion。这些差异不是装饰性的：有的发布方强调纯 UGV
              硬件，有的更积极纳入民用和商用机器人，还有的实际上捕捉了车辆周边自主技术栈的一部分。合理的工作结论是，Forterra 邻近 UGV 类别的近期全球 TAM 有数十亿美元，但 Forterra 实际可货币化的
              SAM 更窄，集中在少数防务现代化路径和车辆集成项目中。
