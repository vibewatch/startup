company:
  name: Forterra
chapter:
  number: 2
  title: Market Analysis
  summary: Forterra’s practical market is not generic autonomous vehicles; it is the narrower but rapidly formalizing market for autonomous ground mission systems in defense plus selected off-road industrial logistics adjacencies. Third-party UGV publishers place the global market anywhere from roughly $3.0 billion to $6.4 billion around 2025-2026, while Forterra itself pegs the U.S. defense ground-autonomy opportunity at more than $4 billion by 2026 and the off-road/logistics-private-road commercial adjacency at $23 billion. Buyer demand is concentrated in U.S. and allied defense acquisition programs and prime OEMs, while adoption is pulled by survivability, DDIL communications, and retrofit economics and constrained by long procurement cycles, integration complexity, standards fragmentation, and the gap between prototype wins and production-rate scale.
sections:
- id: market-boundary-definition
  title: Market Boundary and Status-Quo Alternatives
  body: Forterra’s market is best defined as autonomous ground mission systems, not as “self-driving” in the public-road robotaxi sense. Included spend centers on autonomy software, mission modules, communications, test-and-validation tooling, and retrofit integration applied to military ground vehicles and selected off-road or on-property industrial vehicles. In defense, the status-quo substitute is still the crewed tactical vehicle plus a human operator burdened with navigation, sensing, resupply, and remote-weapon tasks; tele-operated systems are the near-adjacent alternative but do not eliminate bandwidth or attention constraints. Forterra’s own 2024 framing explicitly says it is targeting defense vehicles and off-road or on-property commercial trucks rather than robotaxis or on-highway trucking. That means excluded spend should include public-road passenger autonomy, aerial and maritime unmanned systems, and broad C4ISR programs that are not tied to ground-vehicle autonomy. The cleanest
    way to think about Forterra is as the software, communications, and mission-integration layer that makes an existing vehicle platform autonomy-ready for dangerous logistics, resupply, launcher, breaching, or reconnaissance missions.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
