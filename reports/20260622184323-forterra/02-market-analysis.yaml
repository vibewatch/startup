  rows:
  - - Defense ground mission autonomy
    - Autonomy software, retrofit kits, mission modules, DDIL communications, sensing, validation tooling for Army/USMC/allied ground systems
    - Crewed vehicles without autonomy kits; generic ISR not tied to vehicle autonomy
    - Defense program offices, prime contractors, military acquisition budgets
    - Core current market and clearest production-revenue path
  - - Prime/OEM vehicle integration
    - Integration spend on existing carriers, trucks, launchers, armored vehicles, and engineering vehicles
    - Clean-sheet public-road AV vehicle programs
    - Vehicle OEMs and primes such as Oshkosh, Volvo Defense, and BAE Systems
    - Critical channel for scaling across multiple platforms
  - - Industrial/off-road autonomy
    - Private-road logistics, yards, load handling, and hazardous industrial operations
    - Public-road robotaxis and long-haul on-highway autonomy
    - Fleet operators, industrial logistics budgets, operations leaders
    - Secondary adjacency and diversification path
  - - Communications + orchestration layer
    - Mesh networking, command-and-control, data infrastructure, and test operations tied to autonomous fleets
    - Standalone radios or data software sold without vehicle autonomy use case
    - Military network buyers, integrators, autonomy program teams
    - Important differentiator but usually sold as part of an integrated stack
  notes: Boundary logic follows Forterra’s defense-first positioning and excludes public-road AV markets that have different regulation, economics, and buyer behavior.
