- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for Forterra
  - Diligence ask
  rows:
  - - Need to remove warfighters from hazardous logistics, launcher, and recon tasks
    - Driver
    - Now-2031
    - Strengthens willingness to fund production autonomy on existing fleets
    - Which missions are already budgeted for autonomy at brigade / Marine-littoral scale?
  - - GPS-denied and DDIL operating conditions
    - Driver
    - Now-2031
    - Rewards stacks that combine autonomy with resilient communications and sensing
    - How often has Forterra proven performance under EW-denied conditions outside demos?
  - - Common retrofit stack across multiple vehicle families
    - Driver
    - 2025-2030
    - Favors Forterra’s platform model over single-platform autonomy vendors
    - What share of Forterra code / hardware is reusable across programs?
  - - Prime and OEM channels (Oshkosh, Volvo, BAE, Hiab)
    - Driver
    - 2025-2030
    - Reduce go-to-market friction and widen platform access
    - Are these channel relationships revenue-bearing or demonstration-led?
  - - Long defense procurement cycles
    - Constraint
    - Ongoing
    - Prototype wins may take years to convert into durable production revenue
    - What is the average time from demo to funded production option?
  - - Legacy-platform integration complexity
    - Constraint
    - Ongoing
    - Engineering effort and certification burden can slow scaling
    - How much customization is required per platform and who pays for it?
  - - Fragmented C2 / cybersecurity / communications standards
    - Constraint
    - Ongoing
    - Raises technical risk and creates dependency on partners like goTenna and Nominal
    - What standards or accreditations are already cleared versus still program-specific?
  - - Divergent market taxonomies across publishers
    - Constraint
    - Now
    - Makes top-down TAM claims unreliable for valuation without scope discipline
    - Which exact subsegments does management use internally for planning and pipeline coverage?
  notes: The table mixes battlefield demand drivers with execution constraints because both determine whether Forterra’s claimed TAM converts into fundable programs.
