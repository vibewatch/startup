- id: market-sizing-lenses
  title: Sizing the Market with Multiple Lenses
  body: 'No single published estimate captures Forterra’s addressable market perfectly, so the right approach is to preserve multiple sizing lenses. Forterra’s own company view is that U.S. defense ground autonomy alone could exceed $4 billion by 2026, while the off-road logistics / drayage / private-road commercial adjacency could reach $23 billion. Third-party UGV researchers provide broader but still relevant anchor ranges. Mordor Intelligence estimates the unmanned ground vehicle market at $2.81 billion in 2025, $3.02 billion in 2026, and $4.45 billion by 2031 at an 8.06% CAGR. Global Market Insights sizes 2024 at $3.1 billion and 2034 at $7.4 billion, while Verified Market Reports uses a much broader framing and lands at $6.4 billion in 2025 and $14.8 billion by 2034. Global Growth Insights sits closer to Mordor at $3.01 billion in 2025, $3.22 billion in 2026, and $5.81 billion by 2035. The spread is meaningful rather than cosmetic: some publishers emphasize pure UGV hardware, some
    include civilian and commercial robots more aggressively, and some are effectively capturing pieces of the autonomy stack around the vehicle. A reasonable working conclusion is that the near-term global TAM for Forterra-adjacent UGV categories is several billion dollars, but the practically monetizable SAM for Forterra is narrower and concentrated in a small set of defense modernization pathways and vehicle-integration programs.'
  claimRefs:
  - CM009
  - CM010
  - CM011
  - CM012
