chapter:
  number: 3
  title: Competitors
  summary: Forterra appears stronger on current fielded U.S. military ground-autonomy proof and stack breadth than most startup
    peers, but it competes across several layers at once. The real pressure comes from better-capitalized tooling vendors,
    OEM-controlled vehicle channels, and procurement timing risk rather than from one single like-for-like rival.
sections:
- id: landscape-overview
  title: Landscape overview and category boundaries
  body: Forterra’s competitive set is wider than the handful of startups that also market autonomy kits for military ground
    vehicles. The company’s own positioning emphasizes an interoperable autonomy stack rather than a single carrier or a single
    sensor package, so the practical budget fight spans direct retrofit peers, autonomy-software layers, prime-owned military
    carriers, and the status quo of human-driven logistics plus prime-led integration. The Army’s 2025 UxS OTA cohort is the
    clearest direct peer signal because it named Forterra, Overland AI, and Scout AI for the same demonstration lane. But
    that direct cohort does not capture the larger substitute set. Applied Intuition attacks the shared data, simulation,
    and development layer; Kodiak attacks the vehicle-integrated virtual-driver lane; Oshkosh can package autonomy inside
    production-ready military carriers; Anduril competes from a mission-autonomy software layer. That is why the diligence
    question is not merely who else claims autonomy, but which layer of the stack can absorb the decision budget that Forterra
    needs to own.
  claimRefs:
  - CP001
  - CP002
  - CP008
  - CP009
  - CP017
