- id: TP001
  title: Competitive landscape by class
  columns:
  - Alternative
  - Category
  - Published scale / funding
  - Core mission fit
  - Differentiation
  - Limitation vs. Forterra
  rows:
  - - Forterra
    - direct benchmark / autonomy stack
    - 2025 $238M Series C; fielded ROGUE-Fires path; Army UxS cohort
    - Ground autonomy, C2, interoperable mission systems
    - Platform- and payload-agnostic stack spanning AutoDrive and TerraLink
    - Pricing and win-rate transparency remain limited
  - - Overland AI
    - direct tactical-autonomy peer
    - 2026 $100M raise incl. $20M venture debt
    - Off-road tactical resupply, ISR, breaching, counter-UAS
    - Strong GPS-denied off-road focus and one-to-many orchestration
    - Narrower published product surface than Forterra and less visible prime-channel depth
  - - Applied Intuition
    - software-layer substitute
    - 2026 claimed $15B valuation; 20+ integrated platforms
    - Autonomy development, simulation, data, test infrastructure
    - Shared enterprise infrastructure and Autonomy Factory position
    - Not the visible lead retrofit kit on current Army or Marine carrier programs
  - - Kodiak AI
    - vehicle-kit peer
    - Public defense push with GDLS collaboration and Marine contract
    - Autonomous ground vehicles and dual-use virtual driver
    - Hardened SensorPods and rapid serviceability on many vehicles
    - Less evidence of multi-program C2 layer than Forterra or Applied
  - - Anduril
    - mission-software substitute
    - Scale undisclosed in retained official sources
    - Cross-domain mission autonomy and land-systems software
    - Powerful software-defined mission-autonomy story across payloads
    - Less explicit ground-vehicle retrofit detail than Forterra or Overland in retained sources
  - - Oshkosh Defense
    - incumbent OEM and channel partner
    - Production-ready FMAV family; 18,000+ Oshkosh team members worldwide
    - Military carriers, long-range fires, logistics and sustainment
    - Owns carrier platforms and sustainment relationships with military customers
    - Could subsume autonomy value inside a larger OEM package
  - - Status quo / internal build
    - substitute
    - Army prototypes plus traditional manned fleets
    - Human-driven logistics and prime-led integration
    - Budget familiarity and existing fleet ownership
    - Slower capability growth and lower unmanned reach in contested environments
  notes: Rows mix disclosed capital, program status, and architecture evidence. Public win-rate and realized-pricing data
    are sparse, so the comparison emphasizes mission fit and channel position rather than unsupported market-share estimates.
