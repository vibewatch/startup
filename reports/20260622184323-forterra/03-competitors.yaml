- id: TP004
  title: Moat durability and competitive-risk register
  columns:
  - Moat claim
  - Why it matters
  - Primary threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Fielded U.S. military autonomy path
    - Real deployments improve trust and data feedback loops
    - Budget delays or downselect loss in Army programs
    - High
    - Track ATV-S and UxS decision timing and whether Forterra remains prime or becomes subsystem only
  - - Platform- and payload-agnostic architecture
    - Allows Forterra to span many carrier types
    - OEMs can internalize autonomy or multi-source software
    - High
    - Request customer examples showing Forterra survived OEM negotiation or swap risk
  - - TerraLink control layer
    - Raises switching cost above a single retrofit kit
    - Enterprise tooling rivals can own the data or simulation layer
    - Medium
    - Ask whether Forterra is system-of-record for mission planning or just the driving subsystem
  - - Partner network across carriers, sensing, and comms
    - Channels growth without owning every subsystem
    - Partner concentration can turn into dependency
    - Medium
    - Map revenue mix by prime/OEM/partner to see who captures the margin pool
  - - Open APIs and retrofit kits
    - Speed adoption across many fleets
    - Also makes multi-homing easier for customers
    - Medium
    - Demand retention evidence and post-deployment switching data, which public sources do not provide
  notes: Severity reflects procurement and margin risk, not only technical risk. Several cells intentionally convert missing
    public proof into diligence asks rather than unsupported optimism.
