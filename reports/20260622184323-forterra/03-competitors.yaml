- id: channels-and-switching
  title: Distribution power, partner dependence, and switching costs
  body: 'Forterra’s channel strategy both strengthens and constrains its market position. The strongest proof of scale in
    the retained evidence is not a public list-price catalog but the fact that Forterra is already embedded in partner-owned
    or customer-defined programs such as Army UxS and Oshkosh-backed ROGUE-Fires. That pattern creates stickiness because
    vehicle validation, safety cases, control interfaces, training, and mission data all become harder to unwind once a fleet
    is deployed. At the same time, the same architecture that speeds adoption also lowers exclusivity. Open APIs, retrofit
    kits, and modular payloads make multi-homing plausible if customers decide to combine one vendor’s driving stack with
    another vendor’s tooling, simulation, or carrier platform. Oshkosh therefore matters twice: it is Forterra’s most valuable
    route to production, and it is also the proof that the OEM layer can remain the system customer cares about most. Buyers
    appear to be procuring outcomes and program structures, not publicly standardized SKUs, which means whoever controls the
    prime relationship can capture a disproportionate share of the economic value.'
  claimRefs:
  - CP004
  - CP010
  - CP011
  - CP026
  - CP027
  - CP036
  - CP037
  - CP038
  tableRefs:
  - TP004
  figureRefs:
  - FP003
- id: moat-and-adverse
  title: Moat durability and the adverse case
  body: 'The bullish case for Forterra is straightforward: it has credible field evidence, a broad autonomy-plus-control narrative,
    and real channel partnerships around military carriers and mission systems. The bearish case is equally important. Better-capitalized
    rivals can own adjacent layers of the stack, and Army budget friction may delay the exact programs investors expect to
    turn technical breadth into durable revenue. Breaking Defense and National Defense are especially useful because they
    show the main near-term competitive risk is not that Forterra’s product suddenly stops working; it is that procurement
    timing, prime structure, and substitute offerings can blur or defer the monetization advantage. That is the subtle underwriting
    point. Forterra’s moat appears real in technical scope and current program credibility, but only partly durable at the
    budget layer because OEMs, enterprise-autonomy infrastructure vendors, and alternative retrofit companies can each capture
    slices of the same mission spend. Until public evidence shows realized win rates or retention after deployment, durability
    must be described as promising rather than proven.'
  claimRefs:
  - CP019
  - CP029
  - CP030
  - CP031
  - CP038
  - CP039
  - CP040
