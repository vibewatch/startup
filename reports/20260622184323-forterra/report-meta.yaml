  topStrengths:
    - Forterra has real military program traction, including Army UxS work and the Marine Corps ROGUE-Fires production path.
    - The product stack is broader than a single autonomy applique, spanning driving software, communications, mission modules, and data infrastructure partnerships.
    - Repeated backing from Moore Strategic, Crescent Cove, and named crossover investors suggests continued insider conviction.
    - Partner coverage across Oshkosh Defense, Volvo Defense, BAE Systems, Aeva, Hiab, Nominal, and goTenna strengthens integration credibility.
  topRisks:
    - Public revenue, gross margin, backlog-conversion, and customer-concentration data remain undisclosed.
    - Debt inside the latest round may create financing overhang that outside investors cannot price from public sources.
    - Governance visibility is weak because the company does not publicly enumerate its board or explain leadership-transition history fully.
    - Defense-budget timing, program concentration, and safety or liability scrutiny could pressure both growth and valuation.
  unresolvedGaps:
    - Current revenue, ARR, gross margin, and funded backlog conversion by major program.
    - Exact cap-table, debt terms, liquidation preferences, and whether the reported unicorn mark reflects clean economics for new investors.
    - Full board roster, founder ownership, and the leadership-transition timeline from Alberto Lacaze to Josh Araujo.
    - Customer concentration, renewal durability, and Forterra’s economic share inside prime-contractor-led programs such as ROGUE-Fires.
disclaimer: This report summarizes publicly available evidence as of 2026-06-22 and is not investment advice. Private diligence materials could materially change the view, especially on revenue quality, contract economics, liabilities, governance, and financing structure.
