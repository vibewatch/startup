  productSummary: Forterra sells modular ground-vehicle autonomy and mission-system software, communications, and sensor-integration products that can be installed across existing defense and industrial vehicle platforms.
  customerFocus: U.S. Army, U.S. Marine Corps, allied defense organizations, and selected industrial or logistics operators needing off-road or contested-environment autonomy.
  businessModel: Public evidence suggests a mix of autonomy software, mission modules, communications capability, integration work, and lifecycle support tied to defense and selected industrial deployments.
