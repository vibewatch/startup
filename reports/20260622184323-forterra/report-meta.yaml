companyProfile:
  summary: Forterra is the current brand of the autonomy company founded in 2002 as Robotic Research, now focused primarily on autonomous mission systems for defense. Its public stack centers on AutoDrive, TerraLink, Vektor, Oasis, and goTenna-enabled communications, and its disclosed traction includes Army UxS work, the Marine Corps ROGUE-Fires pathway, and partnerships with Oshkosh Defense, Volvo Defense, BAE Systems, Aeva, Hiab, and Nominal. The main diligence tension is that program and product proof have advanced faster than public financial and governance disclosure.
