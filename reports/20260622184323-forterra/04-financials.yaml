  - Diligence ask
  rows:
  - - Autonomy kit integration
    - AutoDrive hardware-software deployment on military vehicles
    - Army UxS, ROGUE-Fires, Sandhills references
    - Active; value undisclosed
    - High that the stream exists, low on magnitude
    - Request awarded CLINs or contract breakdown by hardware, software, and services
  - - Fleet command and control
    - TerraLink oversight, routing, and interoperability layer
    - Platform and TerraLink pages
    - Active; no public pricing
    - Existence is clear, economics are opaque
    - Ask whether TerraLink is separately priced or bundled inside program awards
  - - Mission modules and platform packages
    - MESA, sensors, edge compute, integrated mission payloads
    - MESA and Series C materials
    - Expanding in 2026
    - Medium; clear strategy, limited revenue proof
    - Request attachment rates and hardware margins by program
  - - Communications and networking
    - goTenna mesh networking integrated into Forterra stack
    - goTenna acquisition disclosures
    - Added in 2025
    - Medium; product addition clear, revenue contribution unknown
    - Request goTenna standalone revenue and integration milestones
  - - Partner-led integration work
    - OEM or subsystem integrations with Volvo, Aeva, Nominal, Higher Ground
    - Partner announcements
    - Active; program-specific
    - Medium; likely non-recurring and services-heavy
    - Ask what share of partner revenue is NRE, recurring support, or product pull-through
  notes: The retained sources clearly show multiple monetization paths but do not disclose revenue split, realized pricing,
    or recognition timing by stream.
