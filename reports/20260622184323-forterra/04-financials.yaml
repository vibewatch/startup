- id: TI004
  title: Capital adequacy and financing-dependency table
  columns:
  - Item
  - Public evidence
  - Value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Series B (2024)
    - Official company announcement
    - $75M oversubscribed
    - medium
    - Shows capital supply before defense scale-up
    - Request post-money valuation and debt terms, if any
  - - Series C (2025)
    - Official and news sources
    - $238M equity and debt
    - medium
    - Large liquidity event supporting production and comms build-out
    - Request equity/debt split and investor rights
  - - 2026 follow-on offering
    - SEC Form D
    - $58.5M offering / $48.5M sold / $10.0M remaining
    - high
    - Shows capital raising continued after the headline Series C
    - Clarify whether this was extension capital, employee liquidity, or strategic program financing
  - - 2025 exempt offering
    - SEC / NASAA filing
    - $188.3M offering / $93.3M sold / $95.0M remaining
    - high
    - Shows late-2025 fundraising cadence and potential overlap with Series C timing
    - Reconcile filing scope to the press-announced Series C round
  - - Production contracts as cash proxy
    - Rogue Fires, Sandhills, UxS, GEARS proxies
    - Strong pipeline, revenue timing undisclosed
    - medium
    - Awards support demand but not cash-conversion speed
    - Request backlog, milestone-payment schedule, and booked revenue to date
  - - Hard runway estimate
    - No public cash or burn disclosure
    - Not supportable from retained sources
    - low
    - Runway is a core underwriting question that remains unresolved
    - Request latest cash balance, monthly burn, and debt covenants
  notes: This table intentionally distinguishes capital raised from revenue earned. Public evidence supports capital access
    much more strongly than runway precision.
