- id: TI005
  title: Public financial gaps and exact diligence paths
  columns:
  - Missing metric
  - Impact
  - Why public evidence falls short
  - Exact diligence path
  - Severity
  rows:
  - - Revenue run rate / ARR
    - Cannot anchor valuation or software leverage
    - No retained source discloses recognized revenue or ARR
    - Request monthly revenue bridge by program and by recurring vs. non-recurring type
    - material
  - - Gross margin / COGS
    - Cannot judge hardware drag or software leverage
    - Partner and product disclosures reveal cost centers but no margin data
    - Request contribution margin by kit, platform, and support service
    - material
  - - Burn and runway
    - Cannot know capital-adequacy timing
    - Form D filings show raising activity but not cash-on-hand or burn
    - Request most recent board deck or cash forecast with covenant headroom
    - blocking
  - - Channel economics
    - Cannot know who captures value in OEM / prime-led sales
    - Announcements show many partners but no economic split
    - Request sample partner agreements or internal revenue-share assumptions
    - material
  - - Revenue-recognition timing
    - Cannot separate backlog from current cash conversion
    - Contract proxies exist without payment or accounting detail
    - Request milestone schedules, acceptance criteria, and recognition policy by program
    - material
  notes: These are the specific blockers that keep the chapter from claiming a fully underwritten financial model using public
    evidence alone.
