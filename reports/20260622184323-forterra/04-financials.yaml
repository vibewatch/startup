chapter:
  number: 4
  title: Financials
  summary: Forterra’s public record supports strong capital access and real contract momentum, but not a hard public model
    of revenue quality or runway. The financing trail is unusually rich for a private autonomy company; the revenue, margin,
    and burn disclosures are still too thin for full underwriting.
sections:
- id: revenue-model
  title: Revenue model and pricing opacity
  body: Forterra’s public materials describe a business that monetizes through deployed mission systems rather than through
    a simple software-seat model. AutoDrive, TerraLink, and mission modules are framed as pieces of a broader operating architecture
    that can be installed on defense vehicles, integrated with partner platforms, and supported through control, validation,
    and sustainment workflows. That is enough to conclude that Forterra has multiple revenue-bearing surfaces—autonomy kits,
    command layers, partner integration work, and newly added communications components after goTenna—but not enough to conclude
    how those surfaces are priced or recognized. The retained product pages expose no list pricing. Even the flagship program
    evidence is disclosed in operational terms rather than commercial terms. In practice, that means Forterra likely sells
    through negotiated program awards, partner channels, and custom scopes of work. The presence of multiple channels is positive
    for reach, but it also means the public record does not tell us which piece of the stack captures the highest margin or
    whether TerraLink is bundled into larger awards.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI013
  - CI020
  - CI021
  - CI026
  - CI036
  tableRefs:
