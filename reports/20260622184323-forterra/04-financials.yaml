- id: verdict-and-gaps
  title: Financial verdict and diligence blockers
  body: 'On public evidence alone, Forterra looks financially credible but not fully underwritable. The company has meaningful
    capital inflows, a strong investor roster, a production Marine program, and several other military demand signals. Those
    facts are enough to support the judgment that Forterra is not a speculative pre-product story. They are not enough to
    support a clean model of revenue quality, margin path, or runway as of 2026-06-22. The missing pieces are fundamental:
    recognized revenue, burn, cash, debt terms, customer concentration, contract margin structure, and a clear split between
    recurring software economics and non-recurring engineering. In other words, the bullish case has strong financing and
    contract proof, while the cautious case points out that the accounting bridge between those proofs and normalized unit
    economics is still private. The right investor takeaway is not “avoid because opaque,” but “research more unless management
    is willing to open the operating model.”'
  claimRefs:
  - CI027
  - CI032
  - CI038
  - CI039
  - CI040
