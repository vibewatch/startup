    - null
    - low
    - Determines whether hardware-heavy deployments can scale without margin compression
    - Request recent awarded program pricing and line-item scope
  - - Gross margin by program or product line
    - null
    - low
    - Separates software leverage from hardware and field-support burden
    - Request gross-margin bridge by autonomy kit, comms, and services
  - - Customer acquisition cost / payback
    - null
    - low
    - Essential for judging whether long procurement cycles are financially efficient
    - Request sales-cycle length, capture cost, and program-win conversion
  - - Validation and test overhead
    - Strategic but undisclosed
    - medium
    - Nominal evidence shows validation infrastructure is a real cost center
    - Request annual test, data, and field-support spend
  - - Sensor and communications BOM pressure
    - Strategic but undisclosed
    - medium
    - Aeva and goTenna suggest meaningful partner-component content in the stack
    - Request supplier concentration, hardware COGS, and integration cost
  - - Channel economics with primes / OEMs
    - Active but undisclosed
    - medium
    - Prime packaging can shift both margin share and cash-conversion timing
    - Request revenue split between direct sales, primes, and OEM channels
  notes: Null means no supportable public number was found. Each missing field maps to a specific diligence request rather
