- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue transparency remains absent after diligence
    - No audited revenue or gross-margin bridge
    - Valuation support remains narrative-only
    - Do not invest or demand heavy downside protection
  - - Financing stack is investor-unfriendly
    - Debt covenants, preferences, or seniority materially subordinate new money
    - Reported valuation overstates economic entry price
    - Recut terms or walk away
  - - Flagship programs slip or de-scope
    - ROGUE-Fires / Army autonomy milestones move materially right
    - Strategic-value story weakens and backlog conversion risk rises
    - Downgrade to avoid absent compensating price cut
  - - Safety or liability evidence deteriorates
    - Adverse incident history or weak indemnity posture emerges
    - Discount rate rises and strategic acquirers may hesitate
    - Pause process for specialist review
  - - Partner stack remains demo-heavy
    - Aeva / Nominal / Raytheon / BAE / Volvo / Hiab links do not convert into durable orders
    - Multiple expansion case disappears
    - Treat partner news as soft proof only
  notes: Each trigger is observable from diligence, customer references, or subsequent program updates and therefore suitable for IC monitoring.
