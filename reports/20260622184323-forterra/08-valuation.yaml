callouts:
- calloutType: recommendation
  title: This is a price-discipline call, not a quality dismissal
  body: Forterra may still become a highly valuable defense-autonomy platform. The issue is that public evidence today is much better at proving strategic relevance than at proving what a new investor should pay for that relevance.
  claimRefs:
  - CV037
  - CV043
- calloutType: risk
  title: Without a revenue denominator, every multiple is fragile
  body: The public comp set shows that autonomy-adjacent companies can trade anywhere from roughly one times revenue to more than fifty times revenue. Without Forterra’s own revenue and term-sheet details, the reported unicorn mark is a headline, not yet a defensible underwriting anchor.
  claimRefs:
  - CV034
  - CV036
