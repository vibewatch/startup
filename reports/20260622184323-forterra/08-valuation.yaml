- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Rogue-Fires and Army programs scale on schedule, partner stack converts into repeat deployments, and private diligence reveals strong software economics.
    - Unicorn-plus valuation can hold or expand if disclosed revenue supports premium autonomy multiples.
    - Still requires low dilution and credible safety proof.
    - Needs private data room evidence not visible publicly today.
  - - Base
    - Program traction continues but revenue and cap-table disclosure remain partial, keeping comp selection wide.
    - Reported $1B mark may be defendable for insiders but not clearly attractive for a new investor.
    - Price discipline and term structure dominate upside.
    - Most consistent with current public evidence.
  - - Bear
    - Prototype-to-production slippage, financing overhang, or weak contract conversion emerge in diligence.
    - Reported unicorn pricing compresses materially if economics resemble hardware-heavy defense integration rather than premium software.
    - Concentration, debt, and liability discount rates compound.
    - Public evidence leaves this downside path very plausible.
  notes: These scenarios are analytical frames, not management guidance; they intentionally separate strategic quality from priceability.
