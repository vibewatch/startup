  evidenceGaps:
  - type: missing-source
    severity: material
    topic: revenue-disclosure
    missingEvidence: ARR, recognized revenue, gross margin, and customer-retention metrics for Forterra.
    whyItMatters: Without a revenue base, any multiple-based valuation is more narrative than underwriting.
    diligencePath: Request monthly revenue bridge, ARR policy, gross-margin build, and cohort / renewal data.
    relatedQuestionRefs:
    - QV026
  - type: missing-source
    severity: material
    topic: capital-structure
    missingEvidence: Cap table, debt covenants, liquidation preferences, and investor rights from the 2025 round.
    whyItMatters: These terms control downside protection and whether the reported valuation is economically meaningful to new investors.
    diligencePath: Request full cap table, financing documents, and waterfall model from counsel.
    relatedQuestionRefs:
    - QV027
  - type: missing-source
    severity: material
    topic: backlog-conversion
    missingEvidence: Booked backlog, customer concentration, and schedule for converting awards into recognized revenue.
    whyItMatters: Contract headlines do not equal monetized software economics, especially in defense procurement.
    diligencePath: Request award-to-revenue conversion schedules by program and customer.
    relatedQuestionRefs:
    - QV025
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: exit-readiness
    missingEvidence: Audit readiness, board controls, export-compliance maturity, and disclosure discipline expected by public-market buyers.
    whyItMatters: Exit pathway dictates holding period and discount rate even if the technology is attractive.
    diligencePath: Run legal / finance readiness workstream and benchmark against late-stage defense-tech peers.
    relatedQuestionRefs:
    - QV021
    - QV022
  - type: missing-source
    severity: minor
    topic: secondary-pricing
    missingEvidence: Independent secondary transactions, external marks, or banker feedback on current clearing price.
    whyItMatters: A reported unicorn headline may not equal executable entry pricing for a new investor.
    diligencePath: Collect broker indications, recent secondary quotes, or investor reference checks.
    relatedQuestionRefs:
    - QV001
    - QV007
