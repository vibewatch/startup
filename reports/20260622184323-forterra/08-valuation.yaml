- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Latest filing marker
  - Market cap / revenue marker
  - Approx. market-cap / revenue
  - Relevance
  - Limitation
  rows:
  - - Aurora Innovation
    - 10-K filed 2026-02-11
    - Market cap $12.96B / revenue $0.003B
    - ~4320x
    - Autonomy platform with public mark on very early revenue base
    - Pre-scale economics make the multiple extreme and unstable
  - - Ouster
    - 10-K filed 2026-03-02
    - Market cap $3.07B / revenue $0.16B
    - ~19x
    - Public autonomy-adjacent sensing company with real revenue
    - Sensor economics are not the same as Forterra’s mission-system mix
  - - Oshkosh
    - 10-K filed 2026-02-17
    - Market cap $8.81B / revenue $10.42B
    - ~0.8x
    - Defense vehicle partner gives industrial / OEM anchor
    - OEM manufacturing multiple understates autonomy-software option value
  - - Palantir
    - 10-K filed 2026-02-17
    - Market cap $286.55B / revenue $5.22B
    - ~55x
    - Mission-critical defense software benchmark with public disclosure
    - Scale, margins, and software purity are far ahead of Forterra’s public profile
  notes: 'Comparable set is deliberately partial and cross-model: it brackets autonomy, sensing, OEM, and defense software because no single public peer cleanly matches Forterra.'
  enumerationScope:
    coverage: partial
    basis: Selected public comparables with current filings and market-data pages that bracket Forterra across autonomy, sensing, OEM, and defense software rather than a full peer universe.
