- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Direction
  - What would change the view
  rows:
  - - Defense autonomy demand and marquee programs create a real category tailwind.
    - Thesis
    - Confirm backlog conversion and customer expansion beyond flagship programs.
  - - Integrated autonomy, comms, and sensing partnerships widen product scope.
    - Thesis
    - Show repeatable unit economics and attach rates across products.
  - - Public revenue, margin, and retention are undisclosed.
    - Anti-thesis
    - Open revenue bridge, margin profile, and renewal evidence.
  - - Program concentration around Army / Marine / Oshkosh can distort value.
    - Anti-thesis
    - Demonstrate diversified revenue base and replacement pipeline.
  - - Debt inside the latest round may hide preference or covenant overhang.
    - Anti-thesis
    - Disclose financing stack and waterfall.
  - - Liability and evolving AV regulation raise discount-rate pressure.
    - Anti-thesis
    - Provide safety evidence and customer indemnity structure.
  notes: Arguments are ranked by how directly they change valuation confidence rather than by technology importance alone.
