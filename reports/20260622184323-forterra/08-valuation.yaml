- id: comparable-context
  title: Public comparable bands are so wide that missing revenue becomes the central valuation risk
  body: 'The comparable exercise is useful mainly as a warning label. The cited public peers all have current SEC filing trails, but they sit on wildly different economics. Aurora trades on almost no current revenue and therefore carries an extreme multiple. Ouster shows what a public autonomy-adjacent hardware and perception company can look like once revenue is real but still modest. Oshkosh offers the opposite pole: a scaled defense and specialty-vehicle OEM trading near one times revenue. Palantir shows how the public market values high-disclosure, mission-critical defense software with real scale and margin leverage. Forterra’s public materials do not say where it belongs inside that band because they do not disclose the revenue denominator. That means investors cannot responsibly map the reported unicorn valuation to an implied multiple without private diligence. The comp set therefore does not prove Forterra is expensive or cheap. It proves that the same $1 billion headline can mean
    very different things depending on whether Forterra’s hidden economics look like pre-scale autonomy, hardware-heavy systems integration, or premium defense software.'
