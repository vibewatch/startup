company:
  name: Forterra
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a strategically relevant defense-autonomy company that raised $238 million in late 2025 and is described by outside coverage as a new unicorn, but it does not support a precise entry price. Forterra’s contract momentum and partner breadth are real, yet missing revenue, margin, cap-table, and debt-term disclosure leave the reported valuation impossible to benchmark cleanly against public comps, supporting a research-more / track stance rather than buy.
sections:
- id: financing-and-disclosure
  title: The financing headline is strong, but the underwriting file is still thin
  body: 'Forterra’s financing narrative is easy to understand and hard to underwrite. On the positive side, the public record is unusually clear that the company raised real money from recognizable investors: the November 2025 Series C brought in $238 million of equity and debt, Moore Strategic led, several new crossover or venture-style backers joined, and Crescent Cove added both equity and debt. External coverage then pushed the story one step further by describing the round as a $1 billion-plus valuation event and a new unicorn. The problem is not the absence of interest. The problem is the absence of economics. The same public sources that trumpet the round do not disclose ARR, recognized revenue, gross margin, net retention, or debt terms. The use-of-proceeds language also implies a capital-intensive system business rather than a light software subscription model: communications, command-and-control, and edge-compute production capacity all need funding. That means the valuation debate
    cannot stop at the headline mark. It has to ask what the mark buys, how much seniority sits ahead of new money, and whether the company’s current revenue model looks more like premium software, defense systems integration, or a moving mix of both.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV007
  - CV008
  - CV035
  - CV038
