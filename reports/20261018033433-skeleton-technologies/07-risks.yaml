callouts:
  - calloutType: risk
    title: Kill criteria before underwriting a new round
    body: "Treat the pre-IPO case as thesis-breaking if management cannot produce audited 2025-2026 financials, post-money and preference-stack detail for the 2026 financing, customer concentration and renewal data, and independent validation of the flagship AI-power performance claims."
    claimRefs: [CR005, CR006, CR007, CR012, CR014]
  - calloutType: insight
    title: Mitigation exists, but it is mostly strategic rather than evidentiary
    body: "European manufacturing, strategic investors, and non-lithium positioning are real mitigants, but they do not substitute for operating proof on yield, deployment durability, and customer concentration."
    claimRefs: [CR003, CR004, CR009, CR010, CR011]
