company:
  name: Skeleton Technologies
chapter:
  number: 7
  title: Risks
  summary: >-
    Skeleton's highest residual risks are execution and underwriteability risks rather than a single known legal event: the company is scaling factories in Germany, Finland, and the U.S. while still relying heavily on company-issued performance claims and incomplete public financing disclosure. Public evidence supports real industrial momentum, but the missing valuation terms, customer concentration detail, certification evidence, and independently verified AI-data-center outcomes mean a pre-IPO entry still carries high diligence risk.
sections:
  - id: ranked-risk-profile
    title: Ranked risk profile and thesis-break signals
    body: >-
      The risk picture is driven by concurrency. Skeleton is trying to industrialize multiple product lines, ramp a €220 million Leipzig supercapacitor factory, scale a €50 million Varkaus SuperBattery site, and extend manufacturing into the United States while positioning itself for a 2027 U.S. IPO. That combination creates a classic mismatch between visible growth ambition and still-limited public operating disclosure. The residual risk is highest where the public record depends on company-controlled sources: AI-data-center efficiency claims, customer concentration, and the exact economics behind North American growth. The practical kill criteria are straightforward: if management cannot produce audited 2025-2026 segment economics, independently validated performance data, and concentration metrics for hyperscaler and OEM programs, investors should treat the pre-IPO narrative as ahead of the evidence.
    claimRefs: [CR003, CR004, CR005, CR007, CR008, CR012, CR014]
    figureRefs: [FR001]
  - id: regulatory-and-disclosure-risks
    title: Regulatory, legal, and disclosure risks are mostly about what is still not public
    body: >-
      The assigned source pool does not show an active lawsuit, recall, or public enforcement action, so the core legal risk today is disclosure risk rather than a proven legal breach. Independent funding coverage and the retained tear sheet confirm a May 2026 pre-IPO first close, but the public record still lacks pre-money, post-money, share-class, and preference-stack detail for that financing. That matters because a late-stage hardware company can look de-risked on headline fundraising while still leaving meaningful downside hidden in liquidation rights, customer commitments, or capex obligations. The same pattern appears in product qualification: the retained sources describe factory openings and deployments, but they do not provide an updated certificate pack, audit trail, or product-approval record that would let an outside investor independently confirm quality/compliance maturity after the 2025 expansion.
    claimRefs: [CR005, CR006, CR007, CR012]
    tableRefs: [TR001]
  - id: operational-and-technology-risks
    title: Operational risk comes from simultaneous scale-up and still-unverified performance claims
    body: >-
      Public sources show that Skeleton has moved beyond lab-stage commercialization, but they also show how much of the operating story is still assertion-led. Company, partner, and trade-press materials all describe rapid factory expansion, major grid and AI-infrastructure customers, and large efficiency improvements from GrapheneGPU and SuperBattery systems. What is missing is an independent operating bridge between those claims and sustained field performance at scale. That gap is important because the company is no longer selling an early pilot; it is asking the market to underwrite capital-intensive manufacturing and uptime-sensitive infrastructure programs. The headcount decline shown in the retained tear sheet, from 576 in 2024 to 494 by March 2026, does not prove strain on its own, but it does raise questions about whether process, quality, and service capacity are keeping pace with the physical footprint.
    claimRefs: [CR001, CR003, CR004, CR009, CR010, CR012, CR013]
    tableRefs: [TR002]
  - id: dependency-and-capital-risks
    title: Dependency risk spans hyperscalers, OEM channels, suppliers, and late-stage capital
    body: >-
      Skeleton's growth story is increasingly concentrated around a small number of powerful counterparties. Official and partner sources point to North America as the fastest-growing market, say that roughly half of revenue comes from North American customers, and highlight named counterparties such as Siemens, GE, Hitachi Energy, Marubeni, and CBMM. Those relationships are positive proof of commercial relevance, but they also increase exposure to partner reprioritization, qualification delays, and concentration in a few infrastructure programs. The financing model compounds that dependence: management is clearly scaling ahead of a larger pre-IPO raise or eventual listing, while public sources still do not disclose the unit economics, backlog visibility, or customer-renewal profile that would let an outside investor judge whether the current buildout is self-reinforcing or still subsidy-dependent.
    claimRefs: [CR002, CR005, CR008, CR009, CR010, CR011, CR014]
    tableRefs: [TR003]
