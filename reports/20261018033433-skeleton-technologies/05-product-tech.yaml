company:
  name: Skeleton Technologies
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Skeleton's public product stack is now specific enough to describe what the
    company is selling: GrapheneBBU modules and racks for AI data-center backup
    and power smoothing, backed by SuperBattery cells and newly expanded
    European/U.S. operating assets. The strongest evidence supports power
    specifications, retrofit fit, and factory expansion, while independent
    proof of field performance, developer/practitioner adoption, and formal
    control/compliance infrastructure remains thin.
sections:
  - id: delivered-products-and-user-jobs
    title: Delivered products and user jobs
    body: >-
      Skeleton's disclosed offering is not a generic "energy storage" pitch;
      the product page breaks it into GrapheneBBU modules, GrapheneBBU racks,
      and D35/D60 SuperBattery cells, with the modules and racks positioned as
      data-center battery backup units and the cells positioned for OEM or
      integrator use across data centers, grid, automotive, heavy trucks, and
      aerospace. The workflow target is AI infrastructure's short, sharp power
      volatility rather than long-duration storage: Siemens describes the load
      problem as millisecond-to-second swings created by synchronized AI chips,
      and Skeleton's own materials frame the product as a bridge/conditioning
      layer that can fit into existing AC facilities while preserving a path to
      800V DC architectures. Publicly disclosed specs make the top-level value
      proposition concrete—up to 90 seconds of backup, 100 kW module peak
      power, and 1.2 MW rack peak power—but those specs are still easier to
      verify than realized customer outcomes.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE008, CE009]
    tableRefs: [TE001, TE002]
  - id: architecture-and-operating-footprint
    title: Architecture and operating footprint
    body: >-
      The retained sources let the operating model be described as a layered
      stack rather than a marketing box diagram. At the product layer, the
      modules and racks combine DC/DC conversion, battery management, liquid
      cooling, and high-power cells; at the material layer, Skeleton links
      performance to proprietary Curved Graphene and CBMM niobium-oxide inputs.
      At the manufacturing layer, the company now has a clearer geographic
      footprint: the about page says Leipzig started deliveries to AI data
      center hyperscalers in 2025, the Varkaus site is described across three
      sources as a €50 million / 1GW SuperBattery asset, and the Houston
      engineering facility is presented as the lead-in to U.S. manufacturing.
      That combination suggests a real operating platform for AI-power
      infrastructure, but it also means execution now depends on multi-site ramp
      quality, materials supply, and the company converting launch-stage
      announcements into repeatable deployment programs.
    claimRefs: [CE002, CE004, CE011, CE012, CE013, CE014, CE015]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-maturity-and-risk
    title: Differentiation, maturity, and risk
    body: >-
      Skeleton's differentiation is strongest where the evidence is mechanical
      and contextual: high disclosed power density, short backup duration tuned
      for mission-critical compute, retrofit compatibility, and a partner
      channel with Siemens that plugs the product into a broader electrical
      infrastructure portfolio. Maturity is improving as the company adds
      factories and claims more than 100 MW deployed in the U.S., but the
      public diligence record still trails the manufacturing narrative. The
      reviewed source set does not provide independent before/after performance
      studies, public developer/practitioner signal, or formal trust/security/
      compliance artifacts such as a status page or certification surface.
      That does not invalidate the technical proposition, but it does mean
      underwriting product reliability, controls, and implementation friction
      still requires direct diligence rather than public-source confirmation.
    claimRefs: [CE009, CE010, CE013, CE015, CE016]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Product line
      - Primary user
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - [GrapheneBBU module, Data-center OEM or power-system integrator, Publicly specified, 800 VDC module with integrated DC/DC converter and BMS, No public install-base or failure-rate disclosure]
      - [GrapheneBBU rack, Hyperscaler or colo facility operator, Publicly specified, 1.2 MW peak rack with configurable ±400V interface for retrofit deployments, No public reference architecture or service SLA]
      - [D35 SuperBattery cell, Data-center or automotive integrator, Publicly specified, "Small-form-factor 6.3 kW/L cell rated up to 50,000 cycles", No public customer qualification data]
      - [D60 SuperBattery cell, Grid or heavy-duty integrator, Publicly specified, 7.1 kW/L cell with lower ESR than D35, No public field-life or pack-level BOM disclosure]
    notes: >-
      Status reflects what the retained public source set shows as specified or
      announced; it is not independent proof of production volume or field
      reliability.
    claimRefs: [CE001, CE002, CE003, CE004, CE005]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow pain
      - Company solution
      - Measurable benefit
      - Limitation
    rows:
      - [Absorb millisecond AI load spikes, Utility and UPS equipment are not designed for synchronized AI power surges, Supercapacitor-based shock absorber between facility power and white space, Company says power smoothing can cut energy use by up to 45%, No independent before/after study in retained sources]
      - [Provide sub-minute backup bridge for IT racks, Traditional battery/generator stacks are bulky for short-duration backup, GrapheneBBU modules and racks with up to 90 seconds backup duration, 100 kW module peak and 1.2 MW rack peak are publicly specified, No public degradation or maintenance curve]
      - [Localize sovereign EU AI power supply, Imported battery supply chains can weaken resilience for AI build-outs, Leipzig plus Varkaus manufacturing footprint for AI-power products, Varkaus is described as a 1GW site and Europe-first AI data-center battery factory, Ramp yield and quality metrics are undisclosed]
      - [Scale North American deployments, Customers need engineering and eventually manufacturing close to data-center demand, Houston engineering facility and planned U.S. manufacturing, Company says more than 100 MW is already deployed in the U.S., Planned 1H26 manufacturing outcome is not independently verified]
    notes: >-
      Benefits are company-claimed unless a row cites partner or independent
      corroboration; null-equivalent gaps reflect missing public proof rather
      than zero functionality.
    claimRefs: [CE008, CE009, CE010, CE011, CE012, CE013, CE014]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - [Grid/facility interface, Absorbs megawatt-scale AI load swings and supports retrofit deployments, Existing AC architectures and future 800V DC migration path, No public utility interconnection or reference-design validation]
      - [GrapheneBBU rack, Delivers site-scale backup and power buffering, Liquid-cooled power electronics with configurable ±400V interface, No public MTBF or service-interval disclosure]
      - [GrapheneBBU module, Provides rack building block with control electronics, Integrated DC/DC converter and battery management system, Public sources do not expose software/control-stack detail]
      - [SuperBattery cells, Supply the high-power electrochemical core, Curved Graphene-based D35 and D60 cell design, No retained pack-level safety test or abuse-testing artifact]
      - [CBMM niobium input, Supports safety/lifetime/performance claims, Access to NBXCELER niobium oxides from CBMM, Material concentration and dual-source plan are undisclosed]
      - [Manufacturing footprint, Scales supply for hyperscalers and North American customers, "Leipzig deliveries, Varkaus ramp, and Houston/U.S. build-out", "Yield, quality, and schedule proof is thinner than launch coverage"]
    notes: >-
      This table mixes product components with operating dependencies because
      the public source set discloses both together; control and compliance
      issues stay explicit gaps when no direct artifact is retained.
    claimRefs: [CE002, CE004, CE006, CE007, CE011, CE014, CE015, CE016]
