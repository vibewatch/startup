    claimRefs: [CE008, CE011, CE013, CE014, CE015]
callouts:
  - calloutType: strength
    title: Retrofit-friendly white-space power product
    body: >-
      The combination of configurable DC interfaces, short backup duration, and
      Siemens-backed positioning around existing AC architectures makes the
      product easier to map to AI data-center retrofits than many vague
      "battery for AI" announcements.
    claimRefs: [CE002, CE004, CE008]
  - calloutType: risk
    title: Operating proof still trails the expansion narrative
    body: >-
      Public evidence is much richer on announced factories and deployment
      ambitions than on independent outcome data, formal controls, or field
      reliability, so execution risk remains meaningful despite the technical
      specificity.
    claimRefs: [CE010, CE011, CE013, CE016]
