    notes: >-
      The table mixes disclosed operating proxies with explicitly missing underwriting inputs; unpublished metrics should be treated as diligence requests rather than model-ready facts.
    claimRefs: ["CI002", "CI003", "CI005", "CI008", "CI009", "CI016"]
