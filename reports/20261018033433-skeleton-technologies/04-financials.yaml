      - "Diligence ask"
    rows:
      - ["North America revenue mix", "~50% of company revenue comes from North American customers", "Medium", "Shows the current commercial center of gravity and potential customer or regional concentration", "Revenue by region and top-customer concentration"]
      - ["U.S. deployed base", ">100 MW deployed and operating in the U.S.", "Medium", "Useful installed-base proxy for commercial traction and referenceability", "MW by customer cohort, utilization, and follow-on conversion"]
      - ["Recent disclosed European factory capex", "At least €270 million across Leipzig (€220 million) and Varkaus (€50 million)", "High", "Factory capex drives depreciation, utilization risk, and financing need", "Capex schedule, subsidies, depreciation policy, and maintenance capex"]
      - ["Leipzig output capacity", "Up to 12 million cells annually", "High", "Cell throughput is a key driver of fixed-cost absorption and gross-margin potential", "Utilization, yield, scrap, and ramp timeline"]
      - ["Varkaus output capacity", "One gigawatt of battery power", "High", "Battery ramp influences product mix, inventory needs, and warranty exposure", "Bookings, yield, warranty accruals, and working-capital turns"]
