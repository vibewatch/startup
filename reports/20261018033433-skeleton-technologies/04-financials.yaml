      - ["SuperBattery products", null, "No public list pricing disclosed", "Pack-level ASPs, warranty terms, financing or leasing options, and discount schedules are undisclosed", "Official Finland launch and funding articles describe capacity and use of funds, not price realization"]
    notes: >-
      Null price cells mean the retained public evidence does not disclose list or realized pricing; they do not imply the offer is free or immaterial.
    claimRefs: ["CI016"]
