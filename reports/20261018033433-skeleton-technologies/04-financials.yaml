company:
  name: "Skeleton Technologies"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    Skeleton's public financial evidence supports a hardware-infrastructure revenue model with meaningful AI and grid traction, but not a clean software-style underwriting case. Public sources show major factory capex, a fresh pre-IPO raise, and North America contributing roughly half of revenue, while leaving absolute revenue, gross margin, burn, runway, pricing, and sales-efficiency inputs undisclosed.
sections:
  - id: "revenue-model-and-traction"
    title: "Revenue model and disclosed traction"
    body: >-
      Public evidence points to Skeleton monetizing high-power energy storage hardware and systems rather than a recurring software subscription. Independent coverage and company materials describe sales of supercapacitor cells, modules, larger systems, and GrapheneGPU or GrapheneBBU deployments into AI data centers and grid applications. The clearest revenue-mix datapoint is company-claimed: Skeleton says more than 100 MW is already deployed in the U.S. and that roughly half of company revenue comes from North American customers. That is meaningful traction, but the retained evidence does not disclose customer-level contract values, pricing structure, backlog, or service attachment, so current revenue quality must still be underwritten through diligence rather than public disclosures alone.
    claimRefs: ["CI001", "CI002", "CI003", "CI006", "CI016"]
    tableRefs: ["TI001", "TI002"]
    figureRefs: ["FI001"]
  - id: "manufacturing-and-capital-intensity"
    title: "Manufacturing footprint and capital intensity"
    body: >-
      Skeleton's economic profile looks much closer to capital-intensive industrial technology than to asset-light software. The company has publicly disclosed a €220 million Leipzig SuperFactory and a €50 million Varkaus SuperBattery factory, implying at least €270 million of recent European factory investment before any U.S. manufacturing buildout. Leipzig is positioned as a high-volume supercapacitor plant with up to 12 million cells of annual output, while Varkaus adds one gigawatt of battery-power output for AI, grid, mobility, and defense applications. Those assets can improve supply control and delivery credibility, but they also make utilization, yield, scrap, warranty accruals, and working-capital turns central to the margin case, and none of those variables are public in the retained evidence.
    claimRefs: ["CI004", "CI005", "CI007", "CI008", "CI009", "CI010", "CI016"]
    tableRefs: ["TI003"]
  - id: "financing-position-and-dependency"
    title: "Financing position and dependency"
    body: >-
      The latest retained third-party funding reports say Skeleton closed a €33 million first close of a larger pre-IPO round, bringing total venture funding to €392 million ahead of a planned U.S. IPO in 2027. Those same reports tie the new capital directly to U.S. production capacity and continued European manufacturing expansion, which reinforces that financing is still supporting industrial scale-up rather than simply polishing the balance sheet before listing. Batteries International also reports a further undisclosed Siemens investment tied to an exclusive data-center channel relationship. That may accelerate sales, but it also introduces concentration and pricing-power risk because a strategically important route to market is concentrated in one industrial partner.
    claimRefs: ["CI011", "CI012", "CI013", "CI014", "CI015"]
  - id: "financial-verdict"
    title: "Financial verdict and diligence blockers"
    body: >-
      The public case for Skeleton is strongest on commercial relevance and weakest on underwriting completeness. Named counterparties, factory openings, U.S. deployments, and current fundraising all support the view that demand is real and that the company has crossed beyond science-project status. The missing pieces are the ones that matter most for pricing risk and downside protection: absolute revenue, gross margin, burn, runway, debt or project-finance obligations, cohort-level sales efficiency, realized ASPs, and backlog by product line. Until management provides those numbers, the right framing is a promising but still financing-dependent hardware platform whose revenue quality and margin path remain only partially visible.
    claimRefs: ["CI002", "CI003", "CI006", "CI009", "CI011", "CI012", "CI013", "CI014", "CI015", "CI016"]
