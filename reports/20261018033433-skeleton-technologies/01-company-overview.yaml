artifact: company-overview
slug: skeleton-technologies
runDate: 2026-10-18
company:
  name: Skeleton Technologies
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Skeleton Technologies is publicly evidenced here as a late-stage private
    energy-storage company repositioning around AI-power infrastructure, with a
    credible manufacturing footprint and repeated strategic financing support.
    The strongest current signals are the May 2026 €33 million pre-IPO first
    close, an October 2026 Siemens-led round reported at a valuation above $1
    billion, and company-stated U.S. deployment traction, but key governance,
    valuation-detail, and scale metrics remain disclosure-limited.
sections:
  - id: identity-and-footprint
    title: Identity, footprint, and stage
    body: >-
      The assigned source pool supports Skeleton as a high-power energy-storage
      company built around supercapacitors and SuperBattery systems rather than
      a generic battery vendor. Company and independent sources consistently tie
      the business to AI data centers, grid applications, mobility, industry,
      and defense. The origin story is clearer than the present-day legal
      profile: founding is consistently placed in Estonia in 2009, but current
      headquarters support in this pool comes from a commercial profile rather
      than an official company disclosure. Stage is better evidenced than legal
      structure: management is openly discussing IPO preparation, hyperscaler
      deliveries, and U.S. manufacturing expansion, which together support a
      late-stage private / pre-IPO framing.
    claimRefs: [CO001, CO002, CO003, CO006, CO015]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance visibility, and key-person dependence
    body: >-
      Public leadership evidence is narrow but internally consistent. Taavi
      Madiberk appears as CEO and co-founder across company financing and
      expansion communications, while outside coverage pairs him with
      co-founder Oliver Ahlberg. What the assigned pool does not provide is a
      board roster, detailed control map, or a broader named executive slate
      beyond founders and one hiring reference. That makes founder-market fit
      easier to support than governance resilience. Until board composition,
      succession planning, and operating-bench depth are evidenced, the public
      narrative looks concentrated around Madiberk, implying meaningful
      key-person dependence in fundraising and commercial positioning.
    claimRefs: [CO004, CO005]
    tableRefs: [TO002]
  - id: funding-and-strategic-backing
    title: Funding history, investors, and current stage signal
    body: >-
      Capital formation is the clearest stage signal in the current pool.
      Skeleton announced a €33 million first close in May 2026, said total
      venture funding reached €392 million, and framed the round as preparation
      for a 2027 U.S. IPO. The disclosed new investors were Axon Partners
      Group, SmartCap, and Taiwania Capital, while Tech Funding News added that
      existing investor CBMM also joined that first close. By October 2026,
      Passive Components and toflow both described a Siemens-led strategic
      investment that took valuation above $1 billion and shifted the narrative
      from fundraising alone toward strategic distribution and manufacturing
      scale in AI infrastructure.
    claimRefs: [CO007, CO008, CO009, CO011, CO015]
    tableRefs: [TO003]
  - id: milestones-scale-and-disclosure-gaps
    title: Milestones, scale signals, and unresolved disclosure gaps
    body: >-
      The operating story is stronger than the disclosure set. Skeleton’s
      history materials show a long build from its 2009 founding through major
      manufacturing milestones, including the Leipzig Superfactory opening in
      2025 and the start of deliveries to AI data-center hyperscalers. The
      U.S.-expansion release adds operational color, claiming more than 100 MW
      already deployed in the United States and roughly half of revenue from
      North American customers. But the same pool still leaves important
      underwriting gaps: no verified absolute revenue, no official customer
      count, no confirmed current board composition, no exact October 2026 cash
      amount from Siemens, and no disclosed test boundary for headline
      performance claims. The chapter therefore supports relevance and momentum
      more confidently than precise financial scale.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO016]
    figureRefs: [FO001]
