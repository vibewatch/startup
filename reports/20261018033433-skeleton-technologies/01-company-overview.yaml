callouts:
  - calloutType: insight
    title: Narrative shift toward AI-power infrastructure
    body: >-
      The 2025-2026 evidence mix shows Skeleton moving from a supercapacitor
      manufacturing story to an AI-power infrastructure story, with U.S.
      manufacturing, hyperscaler deliveries, and strategic-channel access now
      foregrounded in public messaging.
    claimRefs: [CO001, CO006, CO009, CO010, CO013, CO015]
  - calloutType: risk
    title: Public disclosure still does not bridge valuation to underwriting
    body: >-
      Even with a >$1 billion valuation signal, the assigned pool does not
      disclose exact October 2026 financing proceeds, ownership changes,
      customer count, official headcount, or absolute revenue, so investors
      still cannot translate momentum into a clean underwriting model from
      public evidence alone.
    claimRefs: [CO009, CO011, CO012, CO014]
