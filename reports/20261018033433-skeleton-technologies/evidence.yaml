evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: scale-metrics
    missingEvidence: Official absolute revenue, customer count, backlog, and audited or management-confirmed headcount.
    whyItMatters: >-
      These figures determine operating scale, concentration risk, and whether the valuation signal is supported by
      commercial traction.
    diligencePath: >-
      Request the latest board pack or financing deck with revenue, gross margin, customer concentration, and headcount
      by geography.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Board composition, committee structure, and succession depth beyond the founder/CEO narrative.
    whyItMatters: Governance resilience and key-person dependency cannot be underwritten from founder-only visibility.
    diligencePath: Obtain the current board observer list, governance documents, and management roster with functional ownership.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-round-terms
    missingEvidence: Exact October 2026 cash proceeds, Siemens ownership percentage, exclusivity terms, and any board or veto rights.
    whyItMatters: >-
      The strategic round is the main valuation signal in the pool, but economics and control implications remain
      opaque.
    diligencePath: Review signed financing documents, cap-table bridge, and commercial side letters tied to the Siemens transaction.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO003
  - type: stale
    severity: minor
    topic: current-headquarters
    missingEvidence: Official current-headquarters disclosure or registry confirmation.
    whyItMatters: >-
      The assigned pool supports Tallinn only through a commercial profile, leaving a minor corporate-identity
      ambiguity.
    diligencePath: Verify the current registered office through company legal documents or registry extracts.
    relatedQuestionRefs:
      - QO002
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      Independent TAM, SAM, or SOM estimates for AI data-center power-smoothing and backup spend by geography and buyer
      segment.
    whyItMatters: Without a real market model, valuation relies on proxies that mix demand, deployed base, and factory output.
    diligencePath: >-
      Obtain third-party analyst datasets or direct customer-budget evidence that isolates this segment from broader
      battery and data-center spend.
    relatedQuestionRefs:
      - QM003
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: performance-claims
    missingEvidence: >-
      Third-party benchmark data comparing GrapheneGPU or GrapheneBBU against incumbent lithium-ion or UPS alternatives
      on energy savings and total cost.
    whyItMatters: >-
      The current adoption case depends heavily on company performance framing that is not independently validated in
      the assigned pool.
    diligencePath: >-
      Request customer pilot data, engineering validation packs, or utility-side measurement studies covering the same
      workloads described in public materials.
    relatedQuestionRefs:
      - QM005
      - QM006
  - type: missing-source
    severity: material
    topic: leipzig-capacity
    missingEvidence: Current Leipzig utilization and a bridge from annual cell capacity to shipped system-level MW and revenue.
    whyItMatters: Cell nameplate capacity alone cannot establish realized supply, demand, or factory economics.
    diligencePath: >-
      Ask management for plant utilization, yield, product-mix assumptions, and the translation from cells to shipped
      systems and recognized revenue.
    relatedQuestionRefs:
      - QM003
      - QM006
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Public list pricing, contract length, implementation fees, and service economics for Skeleton's AI power products
      and named substitute vendors.
    whyItMatters: Without price and contract structure, buyer-side TCO and switching-cost comparisons remain speculative.
    diligencePath: >-
      Request current price books, recent proposal redlines, and reseller or customer quote examples tied to named
      workloads.
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: named-peer-set
    missingEvidence: >-
      A current named peer matrix covering direct supercapacitor rivals, battery-backup incumbents, and disclosed
      hyperscaler or data-center wins and losses.
    whyItMatters: >-
      Moat durability, displacement risk, and multi-homing are hard to judge without a named competitive set and real
      procurement outcomes.
    diligencePath: >-
      Request current pipeline by named competitor, recent win-loss analysis, and customer reference calls covering the
      last twelve months.
    relatedQuestionRefs:
      - QP001
      - QP007
    relatedTableRefs:
      - TP001
      - TP002
