companyProfile:
  summary: >-
    Skeleton Technologies is a late-stage private energy-storage company based in Tallinn that sells
    supercapacitor-based GrapheneBBU modules/racks and SuperBattery systems for AI data centers, grid stability,
    mobility, industry, and defense. The company now has visible commercialization in the U.S. and Europe, but public
    disclosure still leaves valuation, revenue quality, customer concentration, and cap-table economics incomplete.
