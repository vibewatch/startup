figures:
  - id: FP001
    title: Solution-class positioning around AI power bottlenecks
    type: quadrant
    summary: >-
      Ordinal map of the competitive positions explicit in the assigned evidence, using response-fit versus visible
      channel/manufacturing leverage rather than unsupported price or market-share estimates.
    data:
      xAxis:
        label: Fit for rapid AI-load balancing (ordinal)
        min: 1
        max: 5
        low: Low fit for rapid load balancing
        high: High fit for rapid load balancing
        description: Evidence-backed ordinal assessment from assigned public sources only
        scale: ordinal
      yAxis:
        label: Visible channel / manufacturing leverage (ordinal)
        min: 1
        max: 5
        low: Limited visible leverage
        high: Strong visible leverage
        description: Ordinal assessment based on retained public evidence rather than market-share data
        scale: ordinal
      points:
        - label: Skeleton AI power systems
          x: 5
          y: 4
          tone: positive
          note: Microsecond rack-to-grid response, 100+ kW rack design point, and 100+ MW deployed in the U.S.
          claimRefs: [CP001, CP005, CP006]
        - label: Skeleton SuperBattery / GrapheneBBU
          x: 4
          y: 3
          tone: positive
          note: 1 GW Varkaus output and explicit positioning for mission-critical backup power rather than long-duration storage.
          claimRefs: [CP005, CP013]
        - label: Battery-backed substitute
          x: 2
          y: 3
          tone: warning
          note: Retained evidence compares Skeleton mainly against conventional lithium-ion backup batteries at the chemistry/class level.
          claimRefs: [CP007, CP008]
        - label: Utility / equipment buildout
          x: 1
          y: 5
          tone: neutral
          note: Official company framing says AI spikes can also be handled by building more plants and upgrading equipment.
          claimRefs: [CP009]
        - label: Partner-led infrastructure channel
          x: 3
          y: 5
          tone: opportunity
          note: Partner and OEM references expand route to market, but the exclusive-rights detail is low-confidence.
          claimRefs: [CP011, CP012]
        - label: Sovereign-supply positioning
          x: 3
          y: 4
          tone: opportunity
          note: European manufacturing independence and non-lithium positioning are part of the procurement story.
          claimRefs: [CP007, CP010]
    approximationNotes: >-
      Coordinates are ordinal synthesis values anchored in source-backed qualitative evidence; they are not market-share,
      price, or benchmark scores.
    claimRefs: [CP001, CP005, CP007, CP009, CP010, CP011, CP012, CP013]
callouts:
  - calloutType: strength
    title: Response-speed wedge is the clearest supportable differentiator
    body: >-
      The strongest public differentiation is not a broad cost claim but a high-power response-speed claim: rack-to-grid
      stabilization in microseconds or under a millisecond, backed by system-level integration rather than cells alone.
    claimRefs: [CP001, CP003, CP013]
  - calloutType: risk
    title: Public moat proof still depends on missing commercial detail
    body: >-
      Even with visible partner proof and manufacturing scale-up, public evidence still omits standard pricing, a named
      direct-peer set, and customer-specific switching-cost data, so moat durability cannot be treated as fully proven.
    claimRefs: [CP012, CP014]
