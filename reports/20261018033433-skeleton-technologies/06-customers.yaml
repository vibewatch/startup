    claimRefs: [CU004, CU005, CU006, CU010, CU012]
figures:
  - id: "FU001"
    title: "Customer journey map"
    type: "journey-map"
    summary: "Skeleton's public journey runs from early technical validation toward channel-led AI-infrastructure expansion, with the strongest recent momentum in North America."
    data:
      items:
        - label: "Technical beachhead"
          actor: "Public-sector engineering buyer"
          stage: "validation"
          touchpoints: ["ESA first customer", "space-capacitor development"]
          detail: "The earliest named proof is technical adoption by the European Space Agency, which validates product credibility but not present revenue scale."
        - label: "Commercial transport proof"
          actor: "Transport OEMs and operators"
          stage: "commercialization"
          touchpoints: ["Škoda Electric deal", "engine-start and rail references"]
          detail: "Public transport and OEM references show Skeleton can convert demanding technical use cases into commercial programs."
        - label: "North America operating footprint"
          actor: "Mission-critical infrastructure operators"
          stage: "deployment"
          touchpoints: [">100 MW deployed in the U.S.", "~50% of revenue from North America"]
          detail: "The clearest operating-scale evidence is regional rather than logo based, pointing to meaningful North American demand concentration."
        - label: "Named U.S. references"
          actor: "Rail, motorsport, fusion, and truck programs"
          stage: "proof of use"
          touchpoints: ["Amtrak", "IndyCar", "large truck OEM", "leading fusion company"]
          detail: "Named U.S. examples broaden proof beyond AI, but several of the largest accounts are still described only by category."
        - label: "AI data-center entry"
          actor: "Hyperscalers and operators"
          stage: "early production"
          touchpoints: ["2025 hyperscaler deliveries", "GrapheneUPS / GrapheneGPU power-smoothing use cases"]
          detail: "AI adoption is strategically central, yet end-customer disclosure trails the intensity of the market narrative."
        - label: "Channel-led expansion loop"
          actor: "Siemens plus large data-center ecosystem"
          stage: "scale-up"
          touchpoints: ["Exclusive global data-center sales rights", "Siemens reach into 9 of the top 10 providers", "US manufacturing and Silicon Valley R&D"]
          detail: "Expansion now depends heavily on Siemens-enabled channel access and local manufacturing rather than direct public customer references."
    approximationNotes: "This journey map represents sequence and expansion logic from assigned sources; it does not imply conversion rates or equal-sized customer cohorts."
    claimRefs: [CU003, CU004, CU006, CU007, CU008, CU009, CU010, CU011, CU012, CU013]
callouts:
  - calloutType: "insight"
    title: "Installed-base proof is stronger than logo proof"
    body: "More than 100 MW deployed in the U.S. and roughly half of revenue from North America are more persuasive than the thin public roster of named hyperscaler customers."
    claimRefs: [CU002, CU003, CU012]
  - calloutType: "risk"
    title: "AI customer concentration may be partner mediated"
    body: "Siemens is both strategic investor and exclusive global seller into data centers, so the fastest-growing segment could also become the most channel-concentrated one."
    claimRefs: [CU007, CU008, CU013]
