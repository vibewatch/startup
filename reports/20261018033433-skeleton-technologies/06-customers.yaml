      - ["Rail and public mobility", "Buyer: OEM or operator; user: engineering and operations; payer: OEM or transit owner", "Train power quality and energy modules", "Amtrak via Siemens Mobility US; IndyCar and historical OEM references", "Shows mission-critical transport credibility beyond AI", "Fleet size, expansion cadence, and economics undisclosed"]
      - ["Commercial vehicles and industrial OEMs", "Buyer: OEM / industrial customer; user: engineering and maintenance teams; payer: OEM or asset owner", "Engine starting and transient-power support", "Škoda Electric commercial deal history; unnamed large U.S. truck OEM", "Diversifies end-market exposure", "Named truck OEM still undisclosed"]
