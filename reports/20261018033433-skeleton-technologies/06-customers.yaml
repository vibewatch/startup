      - "Missing denominator"
    rows:
      - ["U.S. deployed base", ">100 MW of systems deployed and operating", "Current statement in assigned source", "Skeleton U.S. expansion release", "Medium", "Shows a real installed footprint in the company's fastest-growing market", "No split by customer, site, or product family"]
