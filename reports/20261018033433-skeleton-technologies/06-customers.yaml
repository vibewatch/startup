      - "Limitation"
    rows:
      - ["European Space Agency", "Public-sector / space", "Space capacitors development", "Historical customer proof", "Company history identifies ESA as Skeleton's first customer", "Old reference; no current spend, renewal, or product status disclosed"]
      - ["Škoda Electric", "Transport OEM", "Large-scale commercial deal", "Commercial claim (2019)", "Shows OEM adoption beyond lab testing", "No contract size, deployment scope, or current status disclosed"]
      - ["Amtrak trains (via Siemens Mobility US)", "Rail / mobility", "Energy modules for train systems", "Production deployment claimed", "Named U.S. reference broadens proof beyond AI", "No fleet size, contract term, or expansion data disclosed"]
      - ["AI data-center hyperscalers (unnamed)", "AI infrastructure", "Power smoothing / data-center systems", "Production deliveries claimed starting 2025", "Most strategically important current segment", "End customers remain unnamed, so proof is only partial"]
    notes: "This enumeration is intentionally partial because the assigned sources do not provide an exhaustive list of named customers or production AI deployments. Rows prioritize the clearest public proof points and keep unnamed strategic accounts visible rather than overstating certainty."
