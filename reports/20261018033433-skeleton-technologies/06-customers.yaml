artifact: "customers"
slug: "skeleton-technologies"
runDate: "2026-10-18"
company:
  name: "Skeleton Technologies"
chapter:
  number: 6
  title: "Customers"
  summary: "Skeleton shows credible adoption across transport, public-sector, and mission-critical infrastructure accounts, and its U.S. installed base is already material. The strongest current growth narrative is AI data-center power systems, but public proof remains channel-led through Siemens and still lacks named hyperscaler references or retention disclosure."
sections:
  - id: "customer-segments"
    title: "Customer segments and who appears to pay"
    body: "Public evidence points to a mixed customer base rather than a single monoline buyer. Skeleton positions its power systems for AI data centers, grids, mobility, industry, and defense, while official disclosures also point to rail, truck, motorsport, fusion, and public-sector use cases. That breadth matters because it shows the company is not relying only on speculative AI demand. The tradeoff is that buyer, user, and payer roles vary by segment, so cross-segment comparability is weak and the company does not publish a clean customer-count or segment-revenue bridge."
    claimRefs: [CU001, CU008, CU009, CU010]
    tableRefs: [TU001]
  - id: "adoption-trajectory"
    title: "Adoption trajectory favors North America and AI infrastructure"
    body: "The assigned sources give more proof of operating footprint than of logo count. Skeleton says more than 100 MW of systems are deployed and operating in the United States and that roughly half of company revenue comes from North American customers, which makes the region strategically material already rather than only aspirational. The AI-infrastructure push is also capital backed: official and external October 2026 sources tie more than $200 million of scale-up and Silicon Valley R&D to direct work with hyperscalers, while Siemens brings a large installed enterprise route into data-center operators."
    claimRefs: [CU002, CU003, CU006, CU007, CU008, CU011, CU013]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: "named-proof"
    title: "Named customer proof is real but uneven"
    body: "Named proof exists, but it is stronger in earlier transport and public-sector references than in the newest AI data-center story. The company history page names the European Space Agency as Skeleton's first customer and cites large-scale commercial deals with Škoda Electric, while the U.S. expansion release adds Amtrak, IndyCar, a large truck OEM, and a nuclear-fusion customer. By contrast, the most strategically important AI accounts are still described as hyperscalers or leading operators rather than by name, so production evidence is improving faster than public reference quality."
    claimRefs: [CU004, CU005, CU006, CU010, CU012]
    tableRefs: [TU003]
  - id: "durability-and-concentration"
    title: "Durability and concentration remain the biggest public gaps"
    body: "Retention quality is the least documented part of the chapter. None of the assigned sources disclose NRR, GRR, churn, renewal rates, contract lengths, or top-customer share, so durability has to be inferred from continued manufacturing expansion and repeat strategic partnerships rather than measured directly. Concentration risk also looks real: Siemens is simultaneously investor, automation partner, and exclusive global seller into data centers, while North America already contributes about half of revenue. That combination may accelerate growth, but it also raises dependence on a small number of channels and end markets that public materials do not quantify."
    claimRefs: [CU003, CU007, CU012, CU013, CU014]
