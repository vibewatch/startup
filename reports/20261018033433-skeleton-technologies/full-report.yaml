              - CE015
      - number: '5.3'
        title: Differentiation, maturity, and risk
        blocks:
          - type: paragraph
            body: >-
              Skeleton's differentiation is strongest where the evidence is mechanical and contextual: high disclosed
              power density, short backup duration tuned for mission-critical compute, retrofit compatibility, and a
              partner channel with Siemens that plugs the product into a broader electrical infrastructure portfolio.
              Maturity is improving as the company adds factories and claims more than 100 MW deployed in the U.S., but
              the public diligence record still trails the manufacturing narrative. The reviewed source set does not
              provide independent before/after performance studies, public developer/practitioner signal, or formal
              trust/security/ compliance artifacts such as a status page or certification surface. That does not
              invalidate the technical proposition, but it does mean underwriting product reliability, controls, and
              implementation friction still requires direct diligence rather than public-source confirmation.
            claimRefs:
              - CE009
              - CE010
              - CE013
              - CE015
              - CE016
