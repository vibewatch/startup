      - number: '3.2'
        title: Skeleton's public wedge is response speed plus system integration, not disclosed price
        blocks:
          - type: paragraph
            body: >-
              Across official pages and independent coverage, Skeleton presents itself as a system supplier rather than
              a component vendor. The recurring differentiators are microsecond or sub-millisecond response, power
              electronics plus controls, and the ability to stabilize highly variable AI loads from rack level through
              grid connection. Publicly visible scale also supports credibility: Leipzig and Varkaus add manufacturing
              heft, while official and independent U.S. expansion coverage points to more than 100 MW already deployed
              and roughly half of revenue coming from North American customers. What the pool does not disclose is
              equally important for underwriting: there is no buyer-visible list pricing, no standard contract
              structure, and no public TCO benchmark that lets a buyer cleanly compare Skeleton against backup-battery
              or incumbent-infrastructure options.
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP006
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP008
              - CP009
              - CP013
      - number: '3.3'
        title: Distribution leverage is promising, but moat durability is still hard to prove
        blocks:
          - type: paragraph
            body: >-
              Skeleton's public trust story is broader than raw cell chemistry. The company points to recognized
              partners and reference relationships such as Siemens, GE, Amtrak/Siemens Mobility US, BMW, and IndyCar,
              while partner and company sources emphasize European manufacturing independence and transatlantic supply
              chains. Those signals can help with procurement and regulatory comfort, especially when infrastructure
              buyers dislike China-centric critical materials exposure. Even so, moat durability remains under-specified
              in public materials. A low-reputation sales-intel profile says Siemens received exclusive global
              data-center sales rights; if true, that expands route to market but also concentrates leverage with one
              channel. Combined with simultaneous German, Finnish, and planned U.S. ramp-ups, execution risk still sits
              in manufacturing, customer acquisition, and channel coordination rather than in laboratory performance
              alone.
            claimRefs:
              - CP004
              - CP011
              - CP012
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Response-speed wedge is the clearest supportable differentiator
            body: >-
              The strongest public differentiation is not a broad cost claim but a high-power response-speed claim:
              rack-to-grid stabilization in microseconds or under a millisecond, backed by system-level integration
              rather than cells alone.
            calloutType: strength
            claimRefs:
              - CP001
              - CP003
              - CP013
          - type: callout
            title: Public moat proof still depends on missing commercial detail
            body: >-
              Even with visible partner proof and manufacturing scale-up, public evidence still omits standard pricing,
              a named direct-peer set, and customer-specific switching-cost data, so moat durability cannot be treated
              as fully proven.
            calloutType: risk
            claimRefs:
              - CP012
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and disclosed traction
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to Skeleton monetizing high-power energy storage hardware and systems rather than a
              recurring software subscription. Independent coverage and company materials describe sales of
              supercapacitor cells, modules, larger systems, and GrapheneGPU or GrapheneBBU deployments into AI data
              centers and grid applications. The clearest revenue-mix datapoint is company-claimed: Skeleton says more
              than 100 MW is already deployed in the U.S. and that roughly half of company revenue comes from North
              American customers. That is meaningful traction, but the retained evidence does not disclose
              customer-level contract values, pricing structure, backlog, or service attachment, so current revenue
              quality must still be underwritten through diligence rather than public disclosures alone.
            claimRefs:
