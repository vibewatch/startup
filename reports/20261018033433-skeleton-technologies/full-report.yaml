      - number: '5.2'
        title: Architecture and operating footprint
        blocks:
          - type: paragraph
            body: >-
              The retained sources let the operating model be described as a layered stack rather than a marketing box
              diagram. At the product layer, the modules and racks combine DC/DC conversion, battery management, liquid
              cooling, and high-power cells; at the material layer, Skeleton links performance to proprietary Curved
              Graphene and CBMM niobium-oxide inputs. At the manufacturing layer, the company now has a clearer
              geographic footprint: the about page says Leipzig started deliveries to AI data center hyperscalers in
              2025, the Varkaus site is described across three sources as a €50 million / 1GW SuperBattery asset, and
              the Houston engineering facility is presented as the lead-in to U.S. manufacturing. That combination
              suggests a real operating platform for AI-power infrastructure, but it also means execution now depends on
              multi-site ramp quality, materials supply, and the company converting launch-stage announcements into
              repeatable deployment programs.
            claimRefs:
              - CE002
              - CE004
