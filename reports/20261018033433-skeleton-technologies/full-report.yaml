        title: Exhibits
        blocks:
          - type: callout
            title: Retrofit-friendly white-space power product
            body: >-
              The combination of configurable DC interfaces, short backup duration, and Siemens-backed positioning
              around existing AC architectures makes the product easier to map to AI data-center retrofits than many
              vague "battery for AI" announcements.
            calloutType: strength
            claimRefs:
              - CE002
