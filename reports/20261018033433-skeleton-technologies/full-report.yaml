  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and who appears to pay
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a mixed customer base rather than a single monoline buyer. Skeleton positions
              its power systems for AI data centers, grids, mobility, industry, and defense, while official disclosures
              also point to rail, truck, motorsport, fusion, and public-sector use cases. That breadth matters because
              it shows the company is not relying only on speculative AI demand. The tradeoff is that buyer, user, and
              payer roles vary by segment, so cross-segment comparability is weak and the company does not publish a
              clean customer-count or segment-revenue bridge.
            claimRefs:
              - CU001
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU008
              - CU009
              - CU010
              - CU013
      - number: '6.2'
        title: Adoption trajectory favors North America and AI infrastructure
        blocks:
          - type: paragraph
            body: >-
              The assigned sources give more proof of operating footprint than of logo count. Skeleton says more than
              100 MW of systems are deployed and operating in the United States and that roughly half of company revenue
              comes from North American customers, which makes the region strategically material already rather than
              only aspirational. The AI-infrastructure push is also capital backed: official and external October 2026
              sources tie more than $200 million of scale-up and Silicon Valley R&D to direct work with hyperscalers,
              while Siemens brings a large installed enterprise route into data-center operators.
            claimRefs:
              - CU002
              - CU003
              - CU006
              - CU007
              - CU008
              - CU011
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU006
              - CU008
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.3'
        title: Named customer proof is real but uneven
        blocks:
          - type: paragraph
            body: >-
              Named proof exists, but it is stronger in earlier transport and public-sector references than in the
              newest AI data-center story. The company history page names the European Space Agency as Skeleton's first
              customer and cites large-scale commercial deals with Škoda Electric, while the U.S. expansion release adds
              Amtrak, IndyCar, a large truck OEM, and a nuclear-fusion customer. By contrast, the most strategically
              important AI accounts are still described as hyperscalers or leading operators rather than by name, so
              production evidence is improving faster than public reference quality.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU010
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU010
              - CU012
      - number: '6.4'
        title: Durability and concentration remain the biggest public gaps
        blocks:
          - type: paragraph
            body: >-
              Retention quality is the least documented part of the chapter. None of the assigned sources disclose NRR,
              GRR, churn, renewal rates, contract lengths, or top-customer share, so durability has to be inferred from
              continued manufacturing expansion and repeat strategic partnerships rather than measured directly.
              Concentration risk also looks real: Siemens is simultaneously investor, automation partner, and exclusive
              global seller into data centers, while North America already contributes about half of revenue. That
              combination may accelerate growth, but it also raises dependence on a small number of channels and end
              markets that public materials do not quantify.
            claimRefs:
              - CU003
              - CU007
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Installed-base proof is stronger than logo proof
            body: >-
              More than 100 MW deployed in the U.S. and roughly half of revenue from North America are more persuasive
              than the thin public roster of named hyperscaler customers.
            calloutType: insight
            claimRefs:
              - CU002
              - CU003
              - CU012
          - type: callout
            title: AI customer concentration may be partner mediated
            body: >-
              Siemens is both strategic investor and exclusive global seller into data centers, so the fastest-growing
              segment could also become the most channel-concentrated one.
            calloutType: risk
            claimRefs:
              - CU007
              - CU008
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk profile and thesis-break signals
        blocks:
          - type: paragraph
            body: >-
              The risk picture is driven by concurrency. Skeleton is trying to industrialize multiple product lines,
              ramp a €220 million Leipzig supercapacitor factory, scale a €50 million Varkaus SuperBattery site, and
              extend manufacturing into the United States while positioning itself for a 2027 U.S. IPO. That combination
              creates a classic mismatch between visible growth ambition and still-limited public operating disclosure.
              The residual risk is highest where the public record depends on company-controlled sources: AI-data-center
              efficiency claims, customer concentration, and the exact economics behind North American growth. The
              practical kill criteria are straightforward: if management cannot produce audited 2025-2026 segment
              economics, independently validated performance data, and concentration metrics for hyperscaler and OEM
              programs, investors should treat the pre-IPO narrative as ahead of the evidence.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR007
              - CR008
              - CR012
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR008
              - CR009
              - CR010
              - CR012
              - CR014
      - number: '7.2'
        title: Regulatory, legal, and disclosure risks are mostly about what is still not public
        blocks:
          - type: paragraph
            body: >-
              The assigned source pool does not show an active lawsuit, recall, or public enforcement action, so the
              core legal risk today is disclosure risk rather than a proven legal breach. Independent funding coverage
              and the retained tear sheet confirm a May 2026 pre-IPO first close, but the public record still lacks
              pre-money, post-money, share-class, and preference-stack detail for that financing. That matters because a
              late-stage hardware company can look de-risked on headline fundraising while still leaving meaningful
              downside hidden in liquidation rights, customer commitments, or capex obligations. The same pattern
              appears in product qualification: the retained sources describe factory openings and deployments, but they
              do not provide an updated certificate pack, audit trail, or product-approval record that would let an
              outside investor independently confirm quality/compliance maturity after the 2025 expansion.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR012
      - number: '7.3'
        title: Operational risk comes from simultaneous scale-up and still-unverified performance claims
        blocks:
          - type: paragraph
            body: >-
              Public sources show that Skeleton has moved beyond lab-stage commercialization, but they also show how
              much of the operating story is still assertion-led. Company, partner, and trade-press materials all
              describe rapid factory expansion, major grid and AI-infrastructure customers, and large efficiency
              improvements from GrapheneGPU and SuperBattery systems. What is missing is an independent operating bridge
              between those claims and sustained field performance at scale. That gap is important because the company
              is no longer selling an early pilot; it is asking the market to underwrite capital-intensive manufacturing
              and uptime-sensitive infrastructure programs. The headcount decline shown in the retained tear sheet, from
              576 in 2024 to 494 by March 2026, does not prove strain on its own, but it does raise questions about
              whether process, quality, and service capacity are keeping pace with the physical footprint.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR009
              - CR010
              - CR012
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR009
              - CR010
              - CR012
              - CR013
      - number: '7.4'
        title: Dependency risk spans hyperscalers, OEM channels, suppliers, and late-stage capital
        blocks:
          - type: paragraph
            body: >-
              Skeleton's growth story is increasingly concentrated around a small number of powerful counterparties.
              Official and partner sources point to North America as the fastest-growing market, say that roughly half
              of revenue comes from North American customers, and highlight named counterparties such as Siemens, GE,
              Hitachi Energy, Marubeni, and CBMM. Those relationships are positive proof of commercial relevance, but
              they also increase exposure to partner reprioritization, qualification delays, and concentration in a few
              infrastructure programs. The financing model compounds that dependence: management is clearly scaling
              ahead of a larger pre-IPO raise or eventual listing, while public sources still do not disclose the unit
              economics, backlog visibility, or customer-renewal profile that would let an outside investor judge
              whether the current buildout is self-reinforcing or still subsidy-dependent.
            claimRefs:
              - CR002
              - CR005
              - CR008
              - CR009
              - CR010
              - CR011
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR005
              - CR008
              - CR009
              - CR010
              - CR011
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Kill criteria before underwriting a new round
            body: >-
              Treat the pre-IPO case as thesis-breaking if management cannot produce audited 2025-2026 financials,
              post-money and preference-stack detail for the 2026 financing, customer concentration and renewal data,
              and independent validation of the flagship AI-power performance claims.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR012
              - CR014
          - type: callout
            title: Mitigation exists, but it is mostly strategic rather than evidentiary
            body: >-
              European manufacturing, strategic investors, and non-lithium positioning are real mitigants, but they do
              not substitute for operating proof on yield, deployment durability, and customer concentration.
            calloutType: insight
            claimRefs:
              - CR003
              - CR004
              - CR009
              - CR010
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Skeleton has crossed an important signaling threshold: the company said a Siemens-led October 2026
              investment brought valuation above $1 billion, while independent coverage said the same deal also gave
              Siemens exclusive rights to sell Skeleton's data-center products. That combination proves outside investor
              appetite and strategic relevance to AI-power infrastructure, but it also concentrates commercial leverage
              in one counterparty. The same retained public pack still does not disclose current revenue, gross margin,
              cash burn, runway, signed backlog, or the May 2026 preference stack. On today's public evidence, the right
              call is research-more rather than buy, with medium confidence, high risk, and price discipline around the
              latest private mark.
            claimRefs:
              - CV001
              - CV002
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV011
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV011
              - CV013
      - number: '8.2'
        title: What the upside case gets right
        blocks:
          - type: paragraph
            body: >-
              The bull thesis is not fictional. Skeleton says more than 100 MW of systems are deployed in the United
              States, roughly half of revenue comes from North American customers, and 2025 brought both the Leipzig
              Superfactory ramp and the first deliveries to AI data-center hyperscalers. The Varkaus SuperBattery
              factory adds another one-gigawatt manufacturing asset, while management continues to frame power smoothing
              as a core bottleneck for AI-cluster deployment. Those are meaningful commercialization and capacity
              signals. They support the argument that Skeleton may be evolving from a promising component vendor into a
              strategic infrastructure supplier, even if most performance and customer-concentration evidence remains
              company-led rather than independently disclosed.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV012
      - number: '8.3'
        title: Scenarios, exit readiness, and the gating diligence asks
        blocks:
          - type: paragraph
            body: >-
              The scenario spread is wide because the public evidence mixes strong strategic signaling with thin
              underwriting data. The upside case needs hyperscaler pilots to convert into repeat revenue, Siemens to
              scale rather than constrain distribution, and the manufacturing build-out to keep pace with AI
              infrastructure demand. The base case is that Skeleton deserves close tracking around the latest public
              mark, but not aggressive entry, until revenue quality and backlog visibility improve. The bear case is
              straightforward: if commercialization slips, IPO timing slides, or preference terms are more
              investor-protective than common shareholders expect, the current mark can compress quickly. Before
              treating the 2027 IPO language as a real exit clock, investors still need cap-table, backlog, and
              unit-economics detail.
            claimRefs:
              - CV003
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation stays research-more
            body: >-
              The evidence now supports paying attention to Skeleton, not paying through the latest private mark.
              Strategic validation improved materially in October 2026, but the public pack still does not clear the
              underwriting bar for a buy decision.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV011
              - CV013
          - type: callout
            title: Main diligence asks before underwriting
            body: >-
              Request the May and October round documents, the current cap table, liquidation preferences, FY2025 and
              2026 YTD financials, customer concentration, and signed backlog by product line. Those items decide
              whether the >$1B strategic mark is deserved or simply the latest private signal.
            calloutType: risk
            claimRefs:
              - CV003
              - CV011
              - CV012
              - CV014
