            body: >-
              Even with a >$1 billion valuation signal, the assigned pool does not disclose exact October 2026 financing
              proceeds, ownership changes, customer count, official headcount, or absolute revenue, so investors still
              cannot translate momentum into a clean underwriting model from public evidence alone.
