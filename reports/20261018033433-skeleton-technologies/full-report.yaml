chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and stage
        blocks:
          - type: paragraph
            body: >-
              The assigned source pool supports Skeleton as a high-power energy-storage company built around
              supercapacitors and SuperBattery systems rather than a generic battery vendor. Company and independent
              sources consistently tie the business to AI data centers, grid applications, mobility, industry, and
              defense. The origin story is clearer than the present-day legal profile: founding is consistently placed
              in Estonia in 2009, but current headquarters support in this pool comes from a commercial profile rather
              than an official company disclosure. Stage is better evidenced than legal structure: management is openly
              discussing IPO preparation, hyperscaler deliveries, and U.S. manufacturing expansion, which together
              support a late-stage private / pre-IPO framing.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO006
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
