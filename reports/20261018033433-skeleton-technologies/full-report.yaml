      - - Base
        - Demand remains real, but disclosure stays partial and manufacturing ramps with normal friction.
        - >-
          Worth tracking near the latest strategic mark, not chasing through it, because proof is better than price
          visibility.
        - Opaque unit economics and dilution risk in a larger IPO-prep round.
        - Current public evidence best fits this case.
      - - Bear
        - >-
          IPO timing slips, hyperscaler conversion stalls, or hidden preference terms make the financing stack more
          investor-protective than common shareholders expect.
        - >-
          Entry should be below the latest public mark because financing leverage and disclosure risk would dominate the
          strategic story.
        - Down-round risk, margin compression, and cap-table overhang.
        - Public data gaps leave this downside plausible.
    notes: >-
      Scenario framing is qualitative because the retained public evidence does not disclose revenue, margin, or
      cash-flow inputs for a hard model.
    claimRefs:
      - CV001
      - CV003
      - CV011
      - CV012
      - CV013
      - CV014
