      - number: '4.3'
        title: Financing position and dependency
        blocks:
          - type: paragraph
            body: >-
              The latest retained third-party funding reports say Skeleton closed a €33 million first close of a larger
              pre-IPO round, bringing total venture funding to €392 million ahead of a planned U.S. IPO in 2027. Those
              same reports tie the new capital directly to U.S. production capacity and continued European manufacturing
              expansion, which reinforces that financing is still supporting industrial scale-up rather than simply
              polishing the balance sheet before listing. Batteries International also reports a further undisclosed
              Siemens investment tied to an exclusive data-center channel relationship. That may accelerate sales, but
              it also introduces concentration and pricing-power risk because a strategically important route to market
              is concentrated in one industrial partner.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The public case for Skeleton is strongest on commercial relevance and weakest on underwriting
              completeness. Named counterparties, factory openings, U.S. deployments, and current fundraising all
              support the view that demand is real and that the company has crossed beyond science-project status. The
              missing pieces are the ones that matter most for pricing risk and downside protection: absolute revenue,
              gross margin, burn, runway, debt or project-finance obligations, cohort-level sales efficiency, realized
              ASPs, and backlog by product line. Until management provides those numbers, the right framing is a
              promising but still financing-dependent hardware platform whose revenue quality and margin path remain
              only partially visible.
            claimRefs:
              - CI002
              - CI003
              - CI006
              - CI009
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial relevance is visible even without full financial disclosure
            body: >-
              Named counterparties, U.S. deployment scale, and current funding tied to AI-power demand suggest Skeleton
              is selling into real industrial programs rather than only pilot projects.
            calloutType: strength
            claimRefs:
              - CI002
              - CI006
              - CI011
          - type: callout
            title: Underwriting still hinges on non-public industrial metrics
            body: >-
              Major disclosed factory capex, a fresh pre-IPO raise, and Siemens channel concentration all matter more
              because public sources do not disclose gross margin, burn, runway, or price realization.
            calloutType: risk
            claimRefs:
              - CI009
              - CI011
              - CI013
              - CI015
