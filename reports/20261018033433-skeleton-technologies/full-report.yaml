  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered products and user jobs
        blocks:
          - type: paragraph
            body: >-
              Skeleton's disclosed offering is not a generic "energy storage" pitch; the product page breaks it into
              GrapheneBBU modules, GrapheneBBU racks, and D35/D60 SuperBattery cells, with the modules and racks
              positioned as data-center battery backup units and the cells positioned for OEM or integrator use across
              data centers, grid, automotive, heavy trucks, and aerospace. The workflow target is AI infrastructure's
              short, sharp power volatility rather than long-duration storage: Siemens describes the load problem as
              millisecond-to-second swings created by synchronized AI chips, and Skeleton's own materials frame the
              product as a bridge/conditioning layer that can fit into existing AC facilities while preserving a path to
              800V DC architectures. Publicly disclosed specs make the top-level value proposition concrete—up to 90
              seconds of backup, 100 kW module peak power, and 1.2 MW rack peak power—but those specs are still easier
              to verify than realized customer outcomes.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE008
              - CE009
          - type: table
            tableRef: TE001
            claimRefs:
