      - number: '4.2'
        title: Manufacturing footprint and capital intensity
        blocks:
          - type: paragraph
            body: >-
              Skeleton's economic profile looks much closer to capital-intensive industrial technology than to
              asset-light software. The company has publicly disclosed a €220 million Leipzig SuperFactory and a €50
              million Varkaus SuperBattery factory, implying at least €270 million of recent European factory investment
              before any U.S. manufacturing buildout. Leipzig is positioned as a high-volume supercapacitor plant with
              up to 12 million cells of annual output, while Varkaus adds one gigawatt of battery-power output for AI,
              grid, mobility, and defense applications. Those assets can improve supply control and delivery
              credibility, but they also make utilization, yield, scrap, warranty accruals, and working-capital turns
              central to the margin case, and none of those variables are public in the retained evidence.
            claimRefs:
