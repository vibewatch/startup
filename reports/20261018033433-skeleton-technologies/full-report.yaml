  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Skeleton's disclosed AI-power stack runs from facility integration down to cell chemistry and manufacturing
      footprint.
    data:
      layers:
        - label: Grid / facility interface
          detail: Handles millisecond-to-second AI power swings without requiring full facility redesign.
          modules:
            - Existing AC architecture retrofit
            - Path toward future 800V DC standards
          outputs:
            - Lower utility-side disturbances
        - label: GrapheneBBU rack
          detail: Site-scale white-space backup and power-smoothing enclosure.
          modules:
            - label: Interface
              value: Configurable ±400V DC
            - label: Power
              value: 1.2 MW peak / 800 kW nominal
            - Liquid-cooled
          outputs:
            - Rack-level AI power buffer
        - label: GrapheneBBU module
          detail: Building block for short-duration backup inside data-center deployments.
          modules:
            - Integrated DC/DC converter
            - Battery management system
            - label: Backup duration
              value: Up to 90 seconds
          outputs:
            - 100 kW peak module power
        - label: SuperBattery cells
          detail: High-power electrochemical core sold as D35 and D60 formats.
          modules:
