            title: Narrative shift toward AI-power infrastructure
            body: >-
              The 2025-2026 evidence mix shows Skeleton moving from a supercapacitor manufacturing story to an AI-power
              infrastructure story, with U.S. manufacturing, hyperscaler deliveries, and strategic-channel access now
              foregrounded in public messaging.
