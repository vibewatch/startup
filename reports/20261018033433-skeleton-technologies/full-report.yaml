  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not generic energy storage or all data-center infrastructure spend. Skeleton's
              retained public materials place the core job in mission-critical power systems for AI data centers, with
              adjacent exposure to grid stability, mobility, industry, and defense. Within that frame, the most relevant
              spend buckets are short-duration peak shaving, power smoothing, and backup power hardware that can react
              quickly to GPU load swings. Traditional lithium-ion backup systems, generic UPS architectures, and utility
              grid upgrades remain the main status-quo substitutes, so the market boundary should be defined by the
              buyer's need to manage fast power transients rather than by all battery or server capex.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM013
      - number: '2.2'
        title: Buyer path and adoption drivers
        blocks:
          - type: paragraph
            body: >-
              The buyer path spans several stakeholders. In AI data centers, the user is the site power and operations
              team, but the payer is typically an infrastructure or electrical-capex budget owner trying to add compute
              capacity without waiting for outsized grid upgrades. The public demand case is consistent across sources:
              AI data-center loads are peaky, data-center electricity demand is rising, and grid strain is becoming a
              deployment bottleneck. Skeleton's own materials go further by arguing that this pain makes the U.S. its
              fastest-growing market, with more than 100 MW already deployed and roughly half of revenue tied to North
              America, which connects market urgency directly to current commercial traction.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM011
              - CM013
      - number: '2.3'
        title: Evidence-constrained sizing and supply proxies
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports several sizing lenses, but none of them is a true TAM, SAM, or SOM. The strongest
              demand-side lens is the broader rise in data-center electricity use and AI-specific load growth; the
              strongest company-side lenses are deployed megawatts, North American revenue share, and factory output.
              Those proxies show that the category is commercially meaningful and capital intensive, but they are not
              additive, and they mix market demand, installed base, and manufacturing capacity. Investors can therefore
              treat them as boundary markers for adoption and scale, not as a substitute for a reconciled market model.
            claimRefs:
              - CM003
              - CM009
              - CM010
              - CM011
              - CM012
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM009
              - CM010
              - CM012
              - CM014
              - CM015
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM005
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM016
      - number: '2.4'
        title: Adoption constraints, contradictions, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The main constraint is not lack of a market need; it is the limited precision of public proof. The
              assigned pool contains no independent budget model for AI power-smoothing or backup spend, no third-party
              benchmark that validates Skeleton's energy-savings claims against incumbent battery systems, and no
              reconciled bridge between cell output and system-level revenue. Public materials also use unreconciled 40
              percent versus 45 percent energy-reduction framing, while the Leipzig capacity disclosure does not
              translate cells into shipped systems, utilization, or revenue. Those limitations do not negate the
              adoption thesis, but they reduce confidence in valuation-ready market sizing until management or customers
              provide reconciled commercial evidence.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Real adoption driver, weak public market model
            body: >-
              The demand problem is tangible and current, but the public evidence set is better at proving urgency than
              at proving a defensible serviceable market size.
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM009
          - type: callout
            title: Public contradictions lower valuation confidence
            body: >-
              Without independent benchmarking and reconciled factory-capacity data, investors are being asked to price
              the market partly from company framing and partially conflicting operating metrics.
            calloutType: risk
            claimRefs:
              - CM008
              - CM009
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Solution classes matter more than named peers in the assigned evidence
        blocks:
          - type: paragraph
            body: >-
              The strongest competitive picture in the assigned pool is class-based rather than vendor-based. Official
              and third-party descriptions repeatedly frame Skeleton around high-power smoothing, backup, and
              grid-stability jobs for AI infrastructure, then contrast that positioning with conventional lithium-ion
              batteries or with infrastructure buildout rather than with a fully named list of direct supercapacitor
              rivals. That means buyers can solve the same problem through at least four routes visible in this pool:
              Skeleton's rack-to-grid power systems, Skeleton's short-duration SuperBattery backup layer, battery-backed
              substitutes, and status-quo utility or equipment upgrades. The absence of a clean named-peer set is itself
              informative: the public posture emphasizes job-to-be-done competition and procurement alternatives more
              than head-to-head vendor comparison.
            claimRefs:
