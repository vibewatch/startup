      - number: '3.3'
        title: 分销杠杆有潜力，但护城河持久性仍难证明
        blocks:
          - type: paragraph
            body: >-
              Skeleton 的公开信任故事不止是电芯化学。公司列举 Siemens、GE、Amtrak/Siemens Mobility US、BMW 和 IndyCar
              等知名合作伙伴与参考客户关系；合作伙伴和公司来源强调欧洲制造独立性及跨大西洋供应链。这些信号有助于采购和监管接受度，尤其是基础设施买家不愿暴露于以中国为中心的关键材料供应。不过，公开材料对护城河持久性的说明仍不充分。一份可信度较低的销售情报资料称
              Siemens 获得数据中心业务的全球独家销售权；若属实，这会扩大市场通路，但也把杠杆集中到一个渠道。德国、芬兰和计划中的美国扩产同时推进，执行风险仍在制造、客户获取和渠道协同，而不只是实验室性能。
            claimRefs:
              - CP004
              - CP011
              - CP012
              - CP014
      - number: '3.4'
        title: 图表
        blocks:
          - type: callout
            title: 响应速度切入口是最明确、最可支持的差异化
            body: 最有力的公开差异化不是泛泛的成本声明，而是高功率响应速度：在微秒级或不到一毫秒内完成从机架到电网的稳定，背后是系统级集成，而非单靠电芯。
            calloutType: strength
            claimRefs:
