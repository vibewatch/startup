chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、足迹与阶段
        blocks:
          - type: paragraph
            body: >-
              指定来源池支持将 Skeleton 定义为一家围绕超级电容器和 SuperBattery 系统打造的高功率储能公司，而非普通电池供应商。公司和独立来源都持续将其业务与 AI
              数据中心、电网应用、交通、工业和国防联系起来。其起源比当前法律主体情况更清晰：各来源一致认为公司于 2009
              年在爱沙尼亚创立，但本来源池中关于当前总部的依据来自商业资料，而非公司官方披露。公司所处阶段的证据强于其法律结构：管理层公开讨论 IPO 准备、向超大规模云厂商交付以及美国制造扩张，这些共同支持“后期私有 /
              IPO 前”的定位。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO006
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO003
