      - number: '1.4'
        title: 里程碑、规模信号与未解决的披露缺口
        blocks:
          - type: paragraph
            body: >-
              运营故事强于披露集合。Skeleton 的历史资料显示，公司自 2009 年创立以来持续建设，经历了多项重大制造里程碑，包括 2025 年莱比锡 Superfactory 开业以及开始向 AI
              数据中心超大规模云厂商交付。美国扩张公告进一步称，公司在美国已部署超过 100
              MW，北美客户贡献约一半收入。但同一来源池仍留下重要投资判断缺口：没有经过验证的绝对收入、官方客户数量、确认的当前董事会构成、Siemens 在 2026 年 10
              月的确切现金投入，也没有披露核心性能声明的测试边界。因此，本章对公司的相关性和发展势头更有把握，对精确财务规模则不足。
