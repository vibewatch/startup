      - number: '8.2'
        title: 上行案例判断正确之处
        blocks:
          - type: paragraph
            body: >-
              看涨论点并非虚构。Skeleton 称美国已部署超过 100 MW 系统，北美客户贡献约一半收入；2025 年既有莱比锡 Superfactory 爬坡，也首次向 AI 数据中心超大规模云厂商交付。Varkaus
              SuperBattery 工厂又增加 1 GW 制造资产，管理层持续把功率平滑描述为 AI 集群部署的核心瓶颈。这些都是有意义的商业化和产能信号，支持 Skeleton
              可能从有潜力的零部件供应商演变为战略基础设施供应商，尽管大部分性能和客户集中度证据仍来自公司，而非独立披露。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
