            body: >-
              公开证据显示，Skeleton 通过销售高功率储能硬件和系统变现，而不是依靠经常性软件订阅。独立报道和公司材料描述了超级电容器电芯、模块、大型系统，以及 GrapheneGPU 或 GrapheneBBU 在
              AI 数据中心和电网应用中的部署。最清晰的收入结构数据来自公司自述：Skeleton 称美国已部署超过 100
              MW，北美客户贡献约一半公司收入。这是有意义的商业进展，但保留证据没有披露客户层面的合同金额、定价结构、订单积压或服务附加收入，因此当前收入质量仍需通过尽调判断，不能只依赖公开披露。
