        title: 制造足迹与资本密集度
        blocks:
          - type: paragraph
            body: >-
              Skeleton 的经济画像更接近资本密集型工业科技，而非轻资产软件。公司公开披露了 €220 million 的莱比锡 SuperFactory 和 €50 million 的 Varkaus
              SuperBattery 工厂；在美国扩产前，近期欧洲工厂投资至少达到 €270 million。莱比锡定位为高产量超级电容器工厂，年产量最高 12 million 个电芯；Varkaus 则为
              AI、电网、交通和国防应用增加 1 GW 电池功率产能。这些资产可以改善供应控制和交付可信度，但也使利用率、良率、报废、保修计提和营运资本周转成为利润率判断的核心，而保留证据没有公开这些变量。
