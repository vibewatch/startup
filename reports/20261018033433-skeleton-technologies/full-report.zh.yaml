      - number: '8.3'
        title: 情景、退出准备度与门槛式尽调要求
        blocks:
          - type: paragraph
            body: >-
              情景区间很宽，因为公开证据把强烈的战略信号与薄弱的投资判断数据混在一起。上行情景需要超大规模云厂商试点转化为重复收入，Siemens 扩大而非限制分销，制造建设跟上 AI
              基础设施需求。基准情景是，在收入质量和订单积压可见度改善前，Skeleton 值得密切跟踪最新公开估值，但不宜激进入场。悲观情景很直接：如果商业化延迟、IPO
              时点推迟，或优先权条款比普通股股东预期的更保护投资者，当前估值可能迅速压缩。在把 2027 年 IPO 表述当作真实退出时钟前，投资者仍需股权结构、订单积压和单位经济性细节。
            claimRefs:
