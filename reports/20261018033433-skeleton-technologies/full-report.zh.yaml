        blocks:
          - type: paragraph
            body: >-
              Skeleton
              的公开案例最能证明商业相关性，最难证明投资判断的完整性。点名的交易对手、工厂开业、美国部署和当前融资都支持需求真实、公司已超越科研项目阶段。但缺失的恰恰是定价风险和下行保护最关键的数据：绝对收入、毛利率、现金消耗、资金续航、债务或项目融资义务、分批次销售效率、实际
              ASP，以及按产品线划分的订单积压。在管理层提供这些数字前，更准确的定位是：这是一个有潜力但仍依赖融资的硬件平台，收入质量和利润率路径仍只能部分看清。
