      - number: '4.3'
        title: 融资状况与依赖
        blocks:
          - type: paragraph
            body: >-
              最新保留的第三方融资报道称，Skeleton 完成了更大规模 IPO 前轮融资的首轮交割，金额为 €33 million，使计划于 2027 年赴美 IPO 前的风险投资总额达到 €392
              million。同一批报道将新资本直接与美国生产能力及欧洲制造持续扩张联系起来，说明融资仍在支持工业规模化，而不只是为上市前的资产负债表润色。Batteries International 还报道 Siemens
              进行了另一笔未披露金额的投资，并与数据中心独家渠道关系绑定。这可能加速销售，但也带来集中度和定价权风险，因为一条战略性市场通路集中在一个工业合作伙伴手中。
