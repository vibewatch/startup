        - 微秒级；独立报道低于 1 毫秒
        - 面向关键任务计算的高功率备用电源
        - 指定证据池没有显示该类别具备微秒级能力这一主张
        - 电厂和设备升级靠扩建基础设施应对负载，而非即时缓冲
        - 当痛点是快速负载波动而非纯粹续航时，Skeleton 更有优势
      - - 首要待解决任务
        - 机架到电网平滑、电能质量、基础设施利用率
        - 短时备用和正常运行时间保护
        - 备用能源替代方案类别
        - 增加或升级资产，提高容量和稳健性
        - 比较集合针对具体工作负载，而非单一通用电池市场
      - - 化学体系 / 供应链叙事
        - 官方美国扩张页面称不含锂、钴或锰
        - 来自 Varkaus 的氧化铌 SuperBattery 电芯
        - 指定证据提及传统锂离子电池和原有 LFP 电池资产
        - 以设备为主的电网路径，而非电芯化学体系
        - 供应链独立性是 Skeleton 采购叙事的一部分
      - - 可见部署证明
        - 100+ kW 机架，且在美国已部署 100+ MW
        - 工厂年产 1 GW，且 AI 电池工厂已启动
        - 该证据池未保留具名供应商证明
        - 保留来源暗示已有装机基础，但没有量化
        - Skeleton 的公开部署细节多于其保留的替代方案类别
      - - 渠道与信任支持
        - 超大规模云厂商交付，以及 Siemens / GE / Amtrak / OEM 引用
        - CBMM 和 InnoEnergy 围绕制造与材料提供的可信度
        - 保留证据未知
        - 熟悉的龙头企业路径，但没有保留的直接来源描述
        - 买方对伙伴背书的看重程度可能不亚于原始技术指标
    notes: Unknown 表示指定公开证据池没有提供可支持的品类级证据；不表示该能力不存在于市场。
