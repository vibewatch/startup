  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 公开证据显示，这是一条由硬件驱动的桥接链：从 AI 和电网电力瓶颈，经过工厂产出和渠道交付，最终到收入披露不完整。
    data:
      nodes:
        - id: demand
          label: AI 与电网电力瓶颈
          detail: AI 工作负载造成剧烈功率波动，公用事业则面临快速响应的电网需求。
        - id: products
          label: 电芯、模块和电力系统
          detail: 保留的来源描述了超级电容器电芯、模块、更大型系统、GrapheneGPU 和 SuperBattery 产品。
        - id: factories
          label: Leipzig 与 Varkaus 制造
          detail: 已披露的欧洲工厂投资在 Leipzig 和 Varkaus 合计至少达到 €270 million。
        - id: channels
          label: 直接 OEM 与合作伙伴渠道
          detail: 已点名的交易对手包括 Siemens、General Electric、Hitachi Energy 和美国主要超大规模云厂商；Siemens 还拥有数据中心独家权。
        - id: deployments
          label: 装机基数与出货
          detail: Skeleton 称其在美国部署了超过 100 MW，并已向一家美国大型超大规模云厂商交付数百万颗电芯。
        - id: revenue
          label: 收入与毛利结果
          detail: 据称约一半收入来自北美，但实际定价、毛利率、现金消耗和订单积压仍未披露。
    approximationNotes: 该流程是定性且有序的；由于保留的证据没有披露这些经济性，图中没有量化节点之间的转化率。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI006
      - CI009
      - CI015
      - CI016
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Skeleton 披露的 AI 电力栈从设施集成一路延伸到电芯化学体系和制造布局。
    data:
      layers:
        - label: 电网 / 设施接口
          detail: 应对毫秒至秒级的 AI 功率波动，无需彻底改造整个设施。
          modules:
            - 现有 AC 架构改造
            - 面向未来 800V DC 标准的路径
          outputs:
            - 降低公用事业侧扰动
        - label: GrapheneBBU 机架
          detail: 面向站点规模的白空间备用电力与平滑功率机柜。
          modules:
            - label: 接口
              value: Configurable ±400V DC
            - label: 电力
              value: 1.2 MW peak / 800 kW nominal
            - 液冷
          outputs:
            - 机架级 AI 电力缓冲
        - label: GrapheneBBU 模块
          detail: 数据中心部署中短时备用电力的构件。
          modules:
            - 集成 DC/DC 转换器
            - 电池管理系统
            - label: 备用时长
              value: Up to 90 seconds
          outputs:
            - 100 kW 峰值模块功率
        - label: SuperBattery 电芯
          detail: 以 D35 和 D60 规格销售的高功率电化学核心。
          modules:
            - label: D35
              value: 6.3 kW/L; 148 Wh/L; up to 50,000 cycles
            - label: D60
              value: 7.1 kW/L; 148 Wh/L; up to 50,000 cycles
          outputs:
            - 面向任务关键型环境的电芯级功率密度
        - label: 材料体系
          detail: 性能叙事与专有 Curved Graphene 和氧化铌材料投入绑定。
          modules:
            - Curved Graphene
            - CBMM NBXCELER 氧化铌
          outputs:
            - 安全性、寿命和充电速率定位
        - label: 制造布局
          detail: 商业化依赖欧洲工厂以及美国本地化。
          modules:
            - 向 AI 数据中心超大规模云厂商交付的 Leipzig 超级工厂
            - Varkaus 1GW SuperBattery 工厂
            - 休斯顿工程团队和计划中的美国制造
          outputs:
            - 欧洲 / 美国扩产路径
    claimRefs:
      - CE008
      - CE011
      - CE013
      - CE014
      - CE015
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Skeleton 的公开发展路径从早期技术验证走向渠道驱动的 AI 基础设施扩张，近期最强势的势头在北美。
    data:
      items:
        - label: 技术切入口
          actor: 公共部门工程采购方
          stage: 验证
          touchpoints:
            - ESA 首个客户
            - 太空电容器开发
          detail: 最早被点名的验证是 European Space Agency 的技术采用，证明产品可信度，但不能证明当前收入规模。
        - label: 商业交通验证
          actor: 交通 OEM 和运营商
          stage: 商业化
          touchpoints:
            - Škoda Electric 交易
            - 发动机启动和铁路参考案例
          detail: 公共交通和 OEM 参考案例显示，Skeleton 能把要求严苛的技术用例转化为商业项目。
        - label: 北美运营覆盖
          actor: 任务关键型基础设施运营商
          stage: 部署
          touchpoints:
            - 美国部署 >100 MW
            - 北美收入约 50%
          detail: 最清晰的运营规模证据来自区域而非客户名称，显示北美需求集中度较高。
        - label: 已点名的美国参考案例
          actor: 铁路、赛车、聚变和卡车项目
          stage: 使用验证
          touchpoints:
            - Amtrak
            - IndyCar
            - 大型卡车 OEM
            - 领先聚变公司
          detail: 已点名的美国案例将验证范围扩展到 AI 之外，但其中几家最大客户仍只以类别描述。
        - label: 进入 AI 数据中心
          actor: 超大规模云厂商和运营商
          stage: 初期生产
          touchpoints:
            - 2025 年超大规模云厂商交付
            - GrapheneUPS / GrapheneGPU 功率平滑用例
          detail: AI 采用在战略上居于核心位置，但终端客户披露落后于市场叙事的强度。
        - label: 渠道驱动的扩张循环
          actor: Siemens 加大型数据中心生态
          stage: 扩产
          touchpoints:
            - 全球数据中心独家销售权
            - Siemens 覆盖前十大供应商中的 9 家
            - 美国制造和硅谷研发
          detail: 当前扩张高度依赖 Siemens 带来的渠道覆盖和本地制造，而不是直接公开的客户参考案例。
    approximationNotes: 这张旅程图根据指定来源呈现顺序和扩张逻辑；不代表转化率或规模相同的客户群。
    claimRefs:
      - CU003
      - CU004
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险集中在制造爬坡、披露不透明、商业集中度以及仍未验证的运营主张。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 缓释成熟度
        - label: 剩余严重度
      rows:
        - label: 多地点制造爬坡
          note: 德国、芬兰和计划中的美国扩产都要求执行节奏紧密衔接。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: high
            - label: 中
              tone: medium
              note: 工厂已经开工，但公开运营指标仍然有限。
            - label: 高
              tone: high
        - label: IPO 前披露不透明
          note: 估值、优先权和经审计的分部经济性仍未充分披露。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: high
            - label: 低
              tone: low
              note: 缓释取决于管理层开放更完整的数据室。
            - label: 高
              tone: high
        - label: 客户与合作伙伴集中
          note: 北美、超大规模云厂商、OEM 和主要工业交易对手是增长故事的核心。
          values:
            - label: 中高
              tone: high
            - label: 高
              tone: high
            - label: 中
              tone: medium
            - label: 中高
              tone: high
        - label: 供应商 / 特种材料依赖
          note: SuperBattery 定位公开绑定于 CBMM 氧化铌合作。
          values:
            - label: 中
              tone: medium
            - label: 中高
              tone: high
            - label: 中
              tone: medium
            - label: 中
              tone: medium
        - label: AI 电力主张缺少独立验证
          note: 公开结果证据仍落后于公司和合作伙伴的业绩主张。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 低中
              tone: medium
              note: 垂直整合有所帮助，但第三方基准测试仍然缺失。
            - label: 高
              tone: high
        - label: 组织承压
          note: 在制造版图和市场范围扩大的同时，公开员工人数却下降。
          values:
            - label: 中
              tone: medium
            - label: 中高
              tone: high
            - label: 低中
              tone: medium
            - label: 中
              tone: medium
    approximationNotes: 序数评级总结有证据支持的承保风险，并非模型化概率。
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR005
      - CR008
      - CR009
      - CR010
      - CR012
      - CR014
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 可见的商业和制造验证改善了故事，但最新公开估值指标仍然跑在已披露的投资判断数据之前。
    data:
      nodes:
        - id: demand
          label: 商业规模信号
          summary: '>100 MW deployed in the U.S.; roughly half of revenue from North American customers.'
        - id: product
          label: 产品验证信号
          summary: 2025 hyperscaler deliveries and company-claimed energy savings for AI clusters.
        - id: manufacturing
          label: 制造准备度
          summary: Leipzig Superfactory plus the Varkaus 1 GW SuperBattery plant.
        - id: valuation
          label: 最新估值锚点
          summary: October 2026 strategic round said to value Skeleton above $1B.
        - id: risks
          label: 门槛风险
          summary: Exclusive Siemens data-center rights and missing revenue, burn, backlog, and preference data.
        - id: recommendation
          label: 推荐
          summary: research-more / high risk / stretched until price or disclosure improves.
      edges:
        - from: demand
          to: product
          label: 支持
        - from: product
          to: manufacturing
          label: 通过……扩张
        - from: manufacturing
          to: valuation
          label: 强化
        - from: valuation
          to: risks
          label: 受到……制约
        - from: risks
          to: recommendation
          label: 导向
    approximationNotes: null
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV011
      - CV013
