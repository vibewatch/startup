              - CO009
              - CO010
              - CO014
              - CO015
      - number: '1.2'
        title: 领导层、治理透明度与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              公开领导层证据范围有限，但前后一致。Taavi Madiberk 在公司的融资和扩张沟通中均以 CEO、联合创始人身份出现，外部报道则将他与联合创始人 Oliver Ahlberg
              并列。本来源池没有提供董事会名单、详细控制权图谱，也没有创始人和一条招聘信息以外的完整高管名单。因此，创始人与市场的匹配度比治理韧性更容易得到支持。在董事会构成、继任规划和运营团队深度得到证实之前，
              Madiberk 仍是公开叙事的核心，公司在融资和商业定位上存在较明显的关键人物依赖。
            claimRefs:
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
      - number: '1.3'
        title: 融资历史、投资者与当前阶段信号
        blocks:
          - type: paragraph
            body: >-
              在当前来源池中，资本形成是最清晰的阶段信号。Skeleton 宣布 2026 年 5 月首轮交割为 €33 million，称风险投资总额达到 €392 million，并将本轮定位为准备 2027 年美国
              IPO。披露的新投资者包括 Axon Partners Group、SmartCap 和 Taiwania Capital；Tech Funding News 补充称，现有投资者 CBMM 也参与了首轮交割。截至
              2026 年 10 月，Passive Components 和 toflow 均称 Siemens 主导的战略投资使估值超过 $1 billion，叙事也从单纯融资转向 AI 基础设施的战略分销和制造规模化。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO011
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
