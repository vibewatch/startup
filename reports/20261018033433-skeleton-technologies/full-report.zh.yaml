      - number: '3.2'
        title: Skeleton 的公开切入口是响应速度加系统集成，而非已披露价格
        blocks:
          - type: paragraph
            body: >-
              在官方页面和独立报道中，Skeleton 都把自己呈现为系统供应商，而非零部件供应商。反复出现的差异化因素包括微秒级或亚毫秒级响应、功率电子与控制，以及从机架到电网连接稳定高度波动 AI
              负载的能力。公开可见的规模也增强了可信度：莱比锡和 Varkaus 提供制造分量，官方及独立的美国扩张报道则称公司已部署超过 100
              MW，北美客户贡献约一半收入。对投资判断同样重要的是来源池未披露的内容：没有买家可见的目录价格、标准合同结构，也没有公开 TCO 基准让买家清楚比较 Skeleton 与备用电池或现有基础设施方案。
