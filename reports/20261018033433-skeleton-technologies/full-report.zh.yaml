            body: >-
              Skeleton 已跨过重要信号门槛：公司称 Siemens 主导的 2026 年 10 月投资使估值超过 $1 billion，独立报道则称同一交易还赋予 Siemens 销售 Skeleton
              数据中心产品的独家权利。这一组合证明外部投资者的兴趣及其对 AI 电力基础设施的战略相关性，但也把商业杠杆集中在一个交易对手手中。同一批保留的公开材料仍未披露当前收入、毛利率、现金消耗、资金续航、已签订单积压或
              2026 年 5 月的优先股堆叠。根据当前公开证据，正确结论是继续研究而非买入；信心中等、风险高，并应围绕最新私有估值保持价格纪律。
            claimRefs:
              - CV001
              - CV002
              - CV011
              - CV012
              - CV013
