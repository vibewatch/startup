          'y': 3
          tone: warning
          note: 保留证据主要按化学体系和产品类别，将 Skeleton 与传统锂离子备用电池作比较。
          claimRefs:
            - CP007
            - CP008
        - label: 公用事业 / 设备扩建
          x: 1
          'y': 5
          tone: neutral
          note: 公司官方口径称，应对 AI 峰值负载也可以增建电厂、升级设备。
          claimRefs:
            - CP009
        - label: 合作伙伴主导的基础设施渠道
          x: 3
          'y': 5
          tone: opportunity
          note: 合作伙伴和 OEM 参考扩大了市场进入路径，但独家权利细节的可信度较低。
          claimRefs:
            - CP011
            - CP012
        - label: 主权供应定位
          x: 3
          'y': 4
          tone: opportunity
          note: 欧洲制造独立性和非锂定位是其采购叙事的一部分。
          claimRefs:
            - CP007
            - CP010
    approximationNotes: 坐标是锚定来源定性证据的序数综合值，不是市场份额、价格或基准评分。
    claimRefs:
