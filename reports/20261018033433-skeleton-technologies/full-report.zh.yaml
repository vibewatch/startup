  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场不是泛化的储能市场，也不是所有数据中心基础设施支出。Skeleton 保留的公开材料将核心需求定位为 AI
              数据中心的关键任务电力系统，同时延伸至电网稳定、交通、工业和国防。按此口径，最相关的支出包括短时削峰、功率平滑，以及能快速应对 GPU 负载波动的备用电力硬件。传统锂离子备用系统、通用 UPS
              架构和公用事业电网升级仍是主要现状替代方案，因此市场边界应由买家管理快速功率瞬变的需求界定，而不是由所有电池或服务器资本支出界定。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM013
      - number: '2.2'
        title: 买家路径与采用驱动因素
        blocks:
          - type: paragraph
            body: >-
              买家路径涉及多个利益相关方。在 AI 数据中心，使用者是现场电力和运营团队，但付款方通常是基础设施或电气资本支出预算负责人，他们希望增加算力，而不必等待规模巨大的电网升级。各来源对公开需求逻辑的描述一致：AI
              数据中心负载峰值明显，数据中心用电需求上升，电网压力正成为部署瓶颈。Skeleton 自有材料进一步称，这一痛点使美国成为其增长最快的市场；公司在美国已部署超过 100
              MW，约一半收入来自北美，从而把市场紧迫性直接连接到当前商业进展。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM011
              - CM013
      - number: '2.3'
        title: 受证据约束的规模估算与供给代理指标
        blocks:
          - type: paragraph
            body: >-
              公开证据支持多种规模观察角度，但没有一种是真正的 TAM、SAM 或 SOM。需求侧最有力的角度是数据中心用电量整体上升和 AI
              专属负载增长；公司侧最有力的角度是已部署兆瓦数、北美收入占比和工厂产量。这些代理指标表明该品类具有商业意义且资本密集，但彼此不可相加，并混合了市场需求、已安装基础和制造能力。因此，投资者应将其视为采用和规模的边界标记，而非经过协调的市场模型替代品。
            claimRefs:
              - CM003
              - CM009
              - CM010
              - CM011
              - CM012
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM009
              - CM010
              - CM012
              - CM014
              - CM015
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM005
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM016
      - number: '2.4'
        title: 采用约束、矛盾与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              主要约束不是市场需求不足，而是公开证明的精确度有限。指定来源池没有 AI 功率平滑或备用电力支出的独立预算模型，没有第三方基准验证 Skeleton
              相对于现有电池系统的节能声明，也没有把电芯产量与系统级收入衔接起来的协调桥接。公开材料还分别使用 40% 和 45%
              的节能表述，彼此未协调；莱比锡产能披露也没有把电芯换算为出货系统、利用率或收入。这些限制并不否定采用逻辑，但在管理层或客户提供协调一致的商业证据前，会降低对可用于估值的市场规模的信心。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
              - CM016
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 真实采用驱动，薄弱的公开市场模型
            body: 需求问题真实且迫切，但公开证据更能证明紧迫性，而非可辩护的可服务市场规模。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM009
          - type: callout
            title: 公开矛盾降低估值信心
            body: 没有独立基准和协调一致的工厂产能数据，投资者只能部分依据公司口径和彼此冲突的运营指标为市场定价。
            calloutType: risk
            claimRefs:
              - CM008
              - CM009
              - CM016
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 在指定证据中，解决方案类别比点名的同业更重要
        blocks:
          - type: paragraph
            body: >-
              指定来源池展现的竞争格局以类别为主，而非以供应商为主。官方和第三方描述反复将 Skeleton 定位于 AI
              基础设施的高功率平滑、备用和电网稳定需求，并将其与传统锂离子电池或基础设施建设对比，而不是与一份完整列出的直接超级电容器竞争者名单对比。买家至少有四条可见路径解决同一问题：Skeleton
              的机架到电网电力系统、Skeleton 的短时 SuperBattery
              备用层、电池支持的替代方案，以及现有公用事业或设备升级。缺少清晰的点名同业集合本身就有信息量：公开定位更强调待解决任务的竞争和采购替代，而非供应商之间的正面比较。
