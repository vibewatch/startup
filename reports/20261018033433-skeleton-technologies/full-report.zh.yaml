          - type: callout
            title: 投资判断前的主要尽调要求
            body: >-
              索取 5 月和 10 月轮次文件、当前股权结构表、清算优先权、FY2025 和 2026 年年初至今财务数据、客户集中度，以及按产品线划分的已签订单积压。这些材料将决定 >$1B
              的战略估值是否合理，还是仅是最新一轮私募市场信号。
            calloutType: risk
