              - CP003
              - CP013
          - type: callout
            title: 公开护城河证明仍取决于缺失的商业细节
            body: 即使已有可见的合作伙伴证明和制造扩张，公开证据仍缺少标准价格、点名的直接同业集合以及按客户划分的转换成本数据，因此不能认为护城河持久性已充分证明。
            calloutType: risk
