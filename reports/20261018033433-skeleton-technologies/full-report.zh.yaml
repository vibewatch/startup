  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 已交付产品与用户任务
        blocks:
          - type: paragraph
            body: >-
              Skeleton 披露的产品并非泛泛的“储能”概念，而是分为 GrapheneBBU 模块、GrapheneBBU 机架和 D35/D60 SuperBattery
              电芯。模块和机架定位为数据中心电池备用单元，电芯则面向数据中心、电网、汽车、重卡和航空航天领域的 OEM 或集成商。产品针对的是 AI 基础设施短促而剧烈的功率波动，而非长时储能：Siemens
              将负载问题描述为同步 AI 芯片造成的毫秒至秒级波动，Skeleton 自有材料则将产品定位为桥接 / 调节层，可接入现有交流设施，并保留通往 800V 直流架构的路径。公开规格让顶层价值主张更具体：备用时间最高
              90 秒，模块峰值功率 100 kW，机架峰值功率 1.2 MW；但这些规格仍比实际客户结果更容易验证。
