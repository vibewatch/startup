company:
  name: Skeleton Technologies
chapter:
  number: 8
  title: Valuation
  summary: >-
    Skeleton now has a fresh strategic valuation marker above $1 billion and more visible AI-infrastructure
    traction than it had earlier in 2026, but the public evidence pack is still too thin on economics and
    capital structure to price that mark with conviction. The current evidence supports a research-more
    recommendation, medium confidence, a high risk rating, and a stretched valuation stance until diligence
    closes revenue, backlog, burn, and preference-stack gaps.
sections:
  - id: recommendation-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      Skeleton has crossed an important signaling threshold: the company said a Siemens-led October 2026
      investment brought valuation above $1 billion, while independent coverage said the same deal also gave
      Siemens exclusive rights to sell Skeleton's data-center products. That combination proves outside
      investor appetite and strategic relevance to AI-power infrastructure, but it also concentrates commercial
      leverage in one counterparty. The same retained public pack still does not disclose current revenue,
      gross margin, cash burn, runway, signed backlog, or the May 2026 preference stack. On today's public
      evidence, the right call is research-more rather than buy, with medium confidence, high risk, and
      price discipline around the latest private mark.
    claimRefs: [CV001, CV002, CV011, CV012, CV013]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: upside-case-and-what-is-real
    title: What the upside case gets right
    body: >-
      The bull thesis is not fictional. Skeleton says more than 100 MW of systems are deployed in the United
      States, roughly half of revenue comes from North American customers, and 2025 brought both the Leipzig
      Superfactory ramp and the first deliveries to AI data-center hyperscalers. The Varkaus SuperBattery
      factory adds another one-gigawatt manufacturing asset, while management continues to frame power
      smoothing as a core bottleneck for AI-cluster deployment. Those are meaningful commercialization and
      capacity signals. They support the argument that Skeleton may be evolving from a promising component
      vendor into a strategic infrastructure supplier, even if most performance and customer-concentration
      evidence remains company-led rather than independently disclosed.
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV009]
    tableRefs: [TV002]
  - id: scenarios-exit-readiness-and-gaps
    title: Scenarios, exit readiness, and the gating diligence asks
    body: >-
      The scenario spread is wide because the public evidence mixes strong strategic signaling with thin
      underwriting data. The upside case needs hyperscaler pilots to convert into repeat revenue, Siemens to
      scale rather than constrain distribution, and the manufacturing build-out to keep pace with AI
      infrastructure demand. The base case is that Skeleton deserves close tracking around the latest public
      mark, but not aggressive entry, until revenue quality and backlog visibility improve. The bear case is
      straightforward: if commercialization slips, IPO timing slides, or preference terms are more
      investor-protective than common shareholders expect, the current mark can compress quickly. Before
      treating the 2027 IPO language as a real exit clock, investors still need cap-table, backlog, and
      unit-economics detail.
    claimRefs: [CV003, CV010, CV011, CV012, CV013, CV014]
    tableRefs: [TV003]
