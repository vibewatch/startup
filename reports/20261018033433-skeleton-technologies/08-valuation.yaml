      - ["Anti-thesis: valuation opacity", "Weakens if investors get audited FY2025 and 2026 YTD financials plus the current cap-table waterfall and liquidation preferences."]
      - ["Anti-thesis: channel concentration", "Weakens if Skeleton proves direct hyperscaler pull, multi-channel distribution, or non-exclusive economics in data centers."]
    notes: "Rows summarize the main evidence-backed arguments and the diligence events that would move the call."
    claimRefs: [CV004, CV005, CV006, CV008, CV009, CV010, CV012]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Case, Assumptions, "Valuation / return logic", "Key risks", "Probability signal"]
    rows:
      - ["Bull", "Hyperscaler pilots convert into repeat programs, U.S. capacity ramps, and the Siemens partnership scales demand without margin loss.", "Can justify paying above the latest public >$1B marker because strategic scarcity and capacity proof both improve.", "Execution delays, channel lock-in, and AI-power spending slowdowns still matter.", "Needs independent revenue or backlog disclosure showing pilots became production orders."]
      - ["Base", "Demand remains real, but disclosure stays partial and manufacturing ramps with normal friction.", "Worth tracking near the latest strategic mark, not chasing through it, because proof is better than price visibility.", "Opaque unit economics and dilution risk in a larger IPO-prep round.", "Current public evidence best fits this case."]
      - ["Bear", "IPO timing slips, hyperscaler conversion stalls, or hidden preference terms make the financing stack more investor-protective than common shareholders expect.", "Entry should be below the latest public mark because financing leverage and disclosure risk would dominate the strategic story.", "Down-round risk, margin compression, and cap-table overhang.", "Public data gaps leave this downside plausible."]
    notes: "Scenario framing is qualitative because the retained public evidence does not disclose revenue, margin, or cash-flow inputs for a hard model."
    claimRefs: [CV001, CV003, CV011, CV012, CV013, CV014]
