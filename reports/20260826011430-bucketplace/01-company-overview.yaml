company:
  name: Bucketplace
chapter:
  number: 1
  title: Company Overview
  summary: Bucketplace, operator of Ohouse (오늘의집), is a Seoul-headquartered home-and-living platform founded in July 2014 by Seungjae Lee. Public evidence consistently shows a content-led model that connects user-generated inspiration, commerce, remodeling, moving, and repair services; the company raised a $182 million Series D in May 2022 at roughly a $1.4 billion to $1.6 billion valuation band and reached its first annual operating profit in 2024 on KRW 287.9 billion revenue. The strongest current proof points are Ohouse’s 10 million monthly active users in 2024, 30 million cumulative installs claimed in 2025, visible international expansion into Japan, Indonesia, and the U.S., and a broadening service stack that now includes transparent-estimate remodeling, logistics, and 3D room simulation. The main open items are board composition, precise cap-table economics, and reconciling conflicting public headcount estimates.
sections:
- id: company-identity
  title: Identity, platform scope, and business model
  body: 'Bucketplace is the Seoul-based company behind Ohouse, a lifestyle super-app built around the idea that home inspiration, discovery, transaction, and execution should live in one workflow. The company’s English corporate site and app-store descriptions consistently describe a chain that starts with user-generated inspiration, routes into tagged commerce, and expands into higher-friction services such as remodeling, moving, installation, and repair. Official pages show the company was incorporated in July 2014 and launched Ohouse Store in 2016; independent reporting says the service initially emerged from a community where users shared interior photos and later evolved into a content-to-commerce engine. That origin still matters strategically: rather than selling furniture through search alone, Ohouse lets users browse homes, identify tagged items, request interior quotes, and book home services inside the same ecosystem. The current product surface also includes Binaryshop for premium
    brands, transparent-estimate remodeling, direct-installation and repair services, and 3D room simulation. Ohouse’s U.S. web presence and shop pages indicate that the company is now testing a translated version of the same inspiration-plus-commerce model outside Korea, rather than exporting only a single retail vertical.'
