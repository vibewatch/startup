- id: capital-and-stakeholders
  title: Funding history, stakeholder map, and ownership signals
  body: 'Bucketplace’s public funding record is unusually concentrated for a unicorn-scale consumer platform, with current accessible profile sources surfacing two clearly disclosed late-stage rounds rather than a long list of small financings. TechCrunch, Business Wire, Forbes, and Tracxn all agree on the May 2022 Series D amount of $182 million and list a broadly similar investor syndicate: Vertex Growth, SoftBank Ventures Asia/SBVA, BRV Capital Management, Korea Development Bank, Mirae Asset, IMM Investment, and Bond Capital among the notable names. Tracxn also records a $70 million Series C in November 2020 with Bond Capital, Mirae Asset, NAVER, and IMM Investment, taking its disclosed total to roughly $252 million. Forbes reports a slightly higher total of $261.2 million and a valuation of approximately $1.6 billion, while TechCrunch and Tracxn frame the post-money closer to $1.4 billion. The difference is small enough to treat as a valuation band rather than a contradiction about unicorn
    status. What matters more is the quality of the investor set: the round combined Korean financial institutions with global growth investors and gave Bucketplace enough capital to pursue international expansion, product investment, and M&A. Public evidence also indicates that Bucketplace acquired Singapore furniture platform HipVan and later invested in U.S. residential-commerce startup InHouse, signaling that management is willing to use capital and strategic transactions to broaden its geographic reach.'
