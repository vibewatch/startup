- id: leadership-governance
  title: Founder leadership, public governance surface, and key-person dependence
  body: 'Public leadership evidence is concentrated around founder and CEO Seungjae Lee, which is both a strength and a diligence gap. Bucketplace’s team-culture page identifies Lee as representative director, while Business Wire, Forbes, TechCrunch, and RocketReach all name him as founder and CEO. Forbes adds useful background, describing Lee as a Seoul National University graduate with chemical and electrical engineering training who turned a personal fascination with interior design into the company’s core product thesis. That founder continuity matters because Ohouse’s strategy still looks highly product-led: recent official posts focus on search-and-recommendation product ownership, UX research, serving-platform architecture, and neural rendering, suggesting the company has continued to invest in differentiated discovery rather than merely operating as a retailer. The weakness is that Bucketplace does not publicly disclose a detailed board roster or a complete executive bench. There
    is enough evidence to show the founder remains central, but not enough to assess governance independence, formal investor board rights, or whether the next layer of management is institutionally durable if Lee steps back. That leaves clear key-person concentration risk for a company whose public narrative, capital-raising history, and global expansion plans are still strongly tied to one founder.'
