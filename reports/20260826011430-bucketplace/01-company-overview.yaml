  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-composition
    missingEvidence: Current board roster, observer rights, and committee structure.
    whyItMatters: Governance independence, investor control rights, and refresh capacity cannot be evaluated from the public record.
    diligencePath: Request the latest board deck and board composition schedule from the company or lead investor.
    relatedQuestionRefs:
    - QO022
    - QO025
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Exact ownership, liquidation preferences, secondaries, and any debt or structured financing.
    whyItMatters: Unclear preference overhang can materially change common-equity attractiveness even if operating momentum is improving.
    diligencePath: Review the cap table, last round documents, and any secondary-transfer summary from counsel.
    relatedQuestionRefs:
    - QO008
    - QO022
    - QO025
    relatedTableRefs:
    - TO003
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: Verified employee count by region and function as of the run date.
    whyItMatters: Profile-site inconsistency makes it hard to benchmark operating leverage and hiring intensity.
    diligencePath: Confirm active payroll headcount directly with company HR or finance and reconcile against public profile providers.
    relatedQuestionRefs:
    - QO015
    - QO025
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: audited-financials
    missingEvidence: Primary-source financial statements or equivalent management accounts for 2024 revenue and profit.
    whyItMatters: Public profitability reporting currently depends on secondary media and is not independently auditable from public filings.
    diligencePath: Request audited statements or board-approved management accounts covering FY2024.
    relatedQuestionRefs:
    - QO011
    - QO025
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: minor
    topic: country-mix
    missingEvidence: Revenue, orders, and user split by Korea, Japan, Indonesia, and U.S. operations.
    whyItMatters: The expansion narrative is visible, but public evidence does not show whether international markets are strategically meaningful yet.
    diligencePath: Ask management for country-level KPIs, launch cohorts, and contribution margins by geography.
