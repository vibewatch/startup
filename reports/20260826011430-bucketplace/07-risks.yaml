- id: TR003
  title: Partner / dependency risk register
  columns:
  - Dependency
  - Risk
  - Impact
  - Diligence path
  rows:
  - - Contractor / remodeling partner base
    - Quality-control and coordination risk
    - High-value service growth can backfire if partner quality varies
    - Request partner scorecards and churn / dispute metrics
  - - Merchants and product catalog
    - Selection and fulfillment inconsistency
    - Can hurt commerce conversion and repeat usage
    - Review merchant concentration and product-return data
  - - Domestic Korean demand
    - Usage concentration by home market
    - International optionality may be overstated
    - Request geography-level MAU and order mix
  - - General-marketplace logistics expectations
    - Coupang-style convenience can reset user expectations
    - Simple baskets may shift to horizontal platforms
    - Benchmark delivery time and repeat by category
  - - Localization / global operations
    - Hard-to-reproduce service quality abroad
    - Expansion could consume capital without durable traction
    - Review international acquisition and retention cohorts
  notes: Ohouse depends on coordinated external ecosystems, not only on its own app quality.
