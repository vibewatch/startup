  figureRefs:
  - FR002
- id: dependency-risks
  title: Partner, market, and dependency risks
  body: 'Ohouse depends on more than software quality. It depends on merchants, contractors, logistics expectations, consumer confidence, and domestic network effects. TechCrunch’s reference to thousands of remodeling firms highlights both scale and dependency: wide partner supply can broaden choice, but it also multiplies quality control and coordination risk. On the market side, Statista and public ecommerce benchmarks reinforce that home spending is tied to discretionary budgets and housing conditions, especially for large projects. Competitively, general marketplaces like Coupang can pressure simple home-goods baskets through speed and convenience, while retailers like IKEA and Hanssem can compete on furniture trust. Internationally, Ohouse has shown signs of U.S. and other expansion, but localized service quality is much harder to reproduce than curated commerce or translated content. These dependencies mean the business can continue growing, but only if it manages an unusually broad
    set of external relationships and operating assumptions. Monitoring must stay continuous.'
  claimRefs:
  - CR018
  - CR019
  - CR020
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: people-and-kill-criteria
  title: People, governance, and what would break the thesis
  body: Founder concentration and disclosure opacity remain material risks even after Ohouse’s 2024 financial progress. Public sources clearly identify Seungjae Lee as founder and CEO, but do not provide a full board roster, detailed executive bench, or clear succession picture. That matters because the company’s story still appears highly founder-led across product strategy, fundraising history, and international ambition. The most important thesis-break conditions are not abstract. If service quality or dispute rates prove materially worse than implied, if profitability reverses under modest expansion investment, if international markets consume capital without meaningful retention, or if public trust is damaged by a security or support failure, the investment case weakens quickly. These are manageable risks for a disciplined operator, but they require deeper diligence on metrics the public record does not currently disclose. Governance detail, service-quality KPIs, and geography-level
    economics should therefore be treated as gating diligence asks before high-conviction underwriting. Those unknowns are manageable only if private diligence closes them decisively.
  claimRefs:
