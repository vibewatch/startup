- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Scenario
  - Why it matters
  - Impact
  - Probability view
  - Mitigation / kill criterion
  rows:
  - - Service disputes materially exceed management narrative
    - Would undermine the highest-value expansion layer
    - Severe
    - Medium
    - Kill if dispute or cancellation rates reveal structurally weak contractor-quality controls
  - - 2024 profitability reverses quickly under modest expansion
    - Would suggest economics were fragile or one-off
    - High
    - Medium
    - Kill if expansion markets require sustained burn without strong retention
  - - Security or payment failure causes trust event
    - Could damage brand across commerce and services
    - Severe
    - Low/Medium
    - Require audit readiness, incident response, and payment reliability evidence
  - - International customers show low repeat / poor unit economics
    - Would cap global upside and dilute capital efficiency
    - High
    - Medium
    - Kill if international cohorts do not show credible retention path
  - - Governance opacity hides adverse balance-sheet or control issues
    - Could change downside unexpectedly
    - Severe
    - Low/Medium
    - Kill if board, cap-table, or debt disclosures reveal adverse surprises
  notes: Kill criteria are analyst-constructed thresholds for diligence discipline, not predictions that these events will happen.
