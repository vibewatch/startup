- id: operational-quality-security
  title: Operational, quality, and security risks
  body: Operational execution is the single biggest risk theme. Ohouse is no longer just ranking decor items; it is coordinating catalogs, support, quote requests, contractors, moving, repair, installation, and increasingly international surfaces. That complexity means small digital failures can compound into trust failures. Recent App Store reviews already show payment resets and UI freezes reaching real users. On the service side, any dispute or poor contractor outcome could be more damaging than a simple product return because home projects are emotionally and financially high stakes. Security and privacy are another area where public evidence is mixed. ISMS certification helps, but public sources do not disclose detailed architecture, incident history, or privacy controls around recommendation or user data. Ohouse’s risk profile therefore looks manageable only if internal systems, support operations, and contractor-quality processes are significantly stronger than the public record can
    confirm.
  claimRefs:
  - CR009
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  tableRefs:
