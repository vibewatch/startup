company:
  name: Bucketplace
chapter:
  number: 7
  title: Risks
  summary: 'Ohouse’s main risks are operational, executional, and disclosure-driven rather than existential category risk. The business is attractive precisely because it has expanded beyond content into commerce, remodeling, and adjacent services, but that also exposes it to contractor-quality issues, support friction, housing-cycle sensitivity, and international replication challenges. Governance opacity is a second major theme: public evidence clearly identifies founder Seungjae Lee but does not reveal a full board or detailed executive bench. The good news is that 2024 profitability and ISMS certification suggest a maturing platform; the bad news is that neither prove durable service quality, margin stability, or global portability. Investors should treat Ohouse as a promising but still operationally fragile compound system.'
sections:
- id: regulatory-legal
  title: Regulatory and legal risk surfaces
  body: 'Public evidence does not show current litigation or enforcement actions against Bucketplace in accessible sources, which is constructive. But the absence of visible legal trouble should not be confused with low legal exposure. Ohouse operates in consumer commerce, payments, personal-data handling, contractor matching, and home-improvement workflows, all of which create meaningful consumer-protection and dispute risk if execution slips. The official chronology’s ISMS certification is a helpful positive signal, yet it is only a baseline proof of process maturity rather than a full legal shield. Because the company also intermediates quotes and contractor relationships, misrepresentation, refund disputes, or service-quality complaints could become regulatory or legal issues even if they first appear as customer-support problems. The legal-risk conclusion is therefore moderate rather than acute: no red flag is visible publicly, but the business model creates multiple potential points
    of consumer complaint and regulatory attention. Public policy surfaces exist, but complaint and incident data remain opaque.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  tableRefs:
  - TR001
