- id: TR004
  title: People / execution risk register
  columns:
  - Risk
  - Current signal
  - Impact
  - Diligence path
  rows:
  - - Founder key-person dependence
    - Founder still central in public narrative
    - Leadership transition could disrupt strategy or culture
    - Review succession depth and executive bench
  - - Board opacity
    - Public board roster not visible
    - Hard to assess governance independence
    - Request board composition and investor rights
  - - Cross-functional execution strain
    - Content + commerce + services + global adds complexity
    - Could overwhelm org capacity or slow product quality
    - Review org structure and operating cadence
  - - Headcount visibility gap
    - Public profile sites conflict on employee count
    - Makes efficiency benchmarking difficult
    - Confirm payroll headcount by region and function
  - - AI / tooling adoption risk
    - Many recent posts highlight AI-enabled workflows
    - Could create execution distraction if not tied to value
    - Review internal ROI from AI tooling and priorities
  notes: The people risk is not founder weakness; it is the combination of founder centrality and limited external governance visibility.
