  - - Advertising / promoted discovery transparency
    - No public controversy identified
    - Content-commerce blending can create disclosure expectations
    - Low/Medium
    - Review ad labeling and merchant-promotion controls
  notes: No acute legal red flag was identified, but the operating model creates real consumer and data-governance exposure.
