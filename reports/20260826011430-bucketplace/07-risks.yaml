- id: TR002
  title: Operational / quality / security risk register
  columns:
  - Risk
  - Evidence
  - Impact
  - Severity
  - Diligence ask
  rows:
  - - Service-quality slippage
    - Complex remodeling and services workflow
    - Can damage trust in highest-value cohorts
    - High
    - Review dispute, cancellation, and referral rates
  - - Product UX reliability
    - App reviews cite payment resets and freezes
    - Can reduce conversion and repeat engagement
    - Medium
    - Review crash, payment-failure, and abandonment metrics
  - - Support-latency risk
    - Service-heavy model requires strong support operations
    - Poor support can turn routine issues into churn
    - Medium
    - Review ticket rate and resolution SLA
  - - Security / privacy opacity
    - ISMS is helpful but deeper controls undisclosed
    - Could cause reputational and regulatory damage if weak
    - Medium/High
    - Request architecture, audit, and incident data
  - - Owned-brand / premium complexity
    - More product breadth adds operational burden
    - Could create inventory or quality-control problems
    - Medium
    - Review margin and return-rate by owned-brand line
  notes: Operational risk is the most important chapter-wide theme because Ohouse’s highest-value categories are also the hardest to execute well.
