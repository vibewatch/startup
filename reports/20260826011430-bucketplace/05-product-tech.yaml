chapter:
  number: 5
  title: Product & Technology
  summary: Ohouse’s product is best understood as a content-to-commerce-to-services operating system for the home. Official surfaces and engineering posts show a stack that starts with inspiration content and user-generated photos, routes through search, recommendations, product catalogs, 3D planning, and contractor marketplaces, and then depends on internal serving, research, and support tooling to keep the whole workflow usable at scale. The strongest visible differentiators are a large content corpus, dedicated search-and-recommendation investment, neural-rendering and 3D room-design work, and productized service layers such as transparent-estimate remodeling and premium assortments. The biggest technology risks are not frontier-model novelty; they are service complexity, cross-border localization, trust controls for offline execution, and the challenge of translating internal product craft into durable economics outside Korea.
sections:
- id: workflow-definition
  title: Customer workflow and product module map
  body: Ohouse’s product is not a single SKU. It is a coordinated customer workflow that starts with inspiration, moves into product discovery, and can end in purchase, project planning, or contractor engagement. The official homepage, projects feed, guide surfaces, store layer, premium content pages, and experts marketplace show a modular system rather than a monolithic app. Users can browse home tours and self-interior advice, click into tagged items, compare ranked products, experiment with 3D room layouts, request transparent remodeling estimates, and manage related services such as moving, repair, and installation. That combination matters because it creates more first-party behavioral signals than a retailer-only catalog would collect. It also means Ohouse’s product breadth has to support both low-friction browsing and high-intent project execution. Product maturity appears strongest in content discovery and commerce, while some newer branded or service-heavy modules—such as premium
    curation, kitchen remodeling, or expansion-market variants—should still be treated as earlier in operational maturity from a diligence perspective.
  claimRefs:
