- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Content and inspiration surfaces
    - Acquire attention and shape taste
    - UGC supply, tagging quality, moderation
    - Engagement falls if content quality weakens
  - - Search and recommendation systems
    - Personalize discovery across content and products
    - Behavioral data, ranking models, experimentation
    - Poor relevance or feedback loops can hurt trust
  - - Commerce and service orchestration
    - Connect products, merchants, quotes, and support flows
    - Catalog quality, service partners, workflow tooling
    - Operational complexity rises faster than catalog complexity
  - - Serving platform / internal logic tools
    - Reduce service inefficiency and visualize complex logic
    - Internal developer tooling and process discipline
    - Underinvestment creates hidden scaling friction
  - - 3D / neural rendering and planning
    - Improve spatial understanding and planning confidence
    - Computer-vision and rendering workflows
    - Feature may be expensive without proven conversion lift
  - - Localization and global app surfaces
    - Adapt the Korean workflow across languages and markets
    - Translation, app architecture, market-specific operations
    - Global expansion may break assumptions that work in Korea
  notes: Public engineering signals indicate real systems investment, but not enough to validate architecture quality quantitatively.
