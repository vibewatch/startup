- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Ohouse solution
  - Measurable benefit
  - Limitation
  rows:
  - - Get inspiration for a room refresh
    - Browse social content and search multiple retailers
    - Browse projects, guides, and shoppable content in one app
    - Lower discovery friction and higher intent density
    - Still requires enough content quality and tagging accuracy
  - - Buy a product seen in inspiration
    - Screenshot or search manually across stores
    - Tagged commerce and store links inside content
    - Shorter path from idea to checkout
    - Can still fail if checkout UX or fulfillment disappoints
  - - Plan a remodeling project
    - Collect referrals and quotes offline
    - Experts marketplace plus transparent estimates and guarantees
    - Faster project initiation and more structured comparison
    - Quality control remains harder than product checkout
  - - Experiment with room layout
    - Imagine fit mentally or use separate tools
    - 3D room-design workflow inside Ohouse
    - Better visualization before purchase or project start
    - Public evidence does not quantify design-tool ROI
  - - Manage post-purchase or service friction
    - Manual support escalation
    - Internal support and serving-platform process improvements
    - Potentially faster response and reduced friction
    - No public SLA or satisfaction score disclosure
  notes: Ohouse’s workflow strength is cross-step integration. The weakest public evidence is on measured ROI per workflow stage.
