- id: sizing-lenses
  title: Sizing lenses and online-addressable spend
  body: 'The strongest public market-size source in this run is IMARC, which estimates the South Korean furniture market at USD 13.1 billion in 2025, reaching USD 17.8 billion by 2034 at a 3.35% CAGR. That is not a perfect Ohouse TAM because Ohouse also monetizes services and media, but it is the clearest anchored category lens. Statista adds important definition and methodology detail by treating the B2C furniture market as including lighting and home decor, then describing online shopping as a major market trend. For Ohouse, the most relevant addressable layer is the online-and-digitally-influenced portion of that spend: IMARC explicitly lists online stores as a distribution channel, and Ohouse’s whole model is built around converting digital inspiration into product and service intent. A second sizing lens is Ohouse’s own scale within that broader market. Business Wire said annualized GMV reached $1.7 billion around the 2022 Series D, while Seoulz said management was targeting more than
    KRW 2 trillion GMV in 2024. Those are platform GMV and not pure furniture revenue, but they imply that Ohouse already intermediates a meaningful slice of Korea’s online home-living demand. The result is a market that is large enough for unicorn outcomes, but still bounded enough that execution quality and category share matter more than top-down TAM theater.'
