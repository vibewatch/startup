- id: drivers-and-constraints
  title: Growth drivers, trust friction, and structural constraints
  body: South Korea’s home-living market gives Ohouse several real tailwinds. Statista highlights online shopping, smart furniture adoption, limited living space, rising disposable income, and aging-population comfort needs as demand drivers. IMARC separately emphasizes urbanization, interior aesthetics, multifunctional design, sustainability, and e-commerce expansion. Ohouse is well aligned to these drivers because its product catalog, 3D design tools, educational content, and service marketplace all benefit when consumers are actively redesigning apartments and seeking better use of limited space. At the same time, the market is constrained by trust and operational execution. Higher-value interior work still depends on contractor quality, scheduling, after-sales service, and dispute handling; app-store reviews show that even digital checkout and saved-category experiences can frustrate users. The category is also housing-cycle sensitive, and expansion beyond Korea raises localization risk
    because service-marketplace quality control is difficult to transplant country by country. The strategic takeaway is that Ohouse’s market is attractive because it is digitally influenceable and still fragmented, but the company only earns the right to keep expanding if it proves that content-led demand generation can scale without service-quality slippage.
