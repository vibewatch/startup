chapter:
  number: 2
  title: Market Analysis
  summary: 'Ohouse participates in a broad South Korean home-living market that spans inspiration content, furniture and decor commerce, and higher-friction home-improvement services. The most defensible public sizing lens is the South Korea furniture and home-furnishings market rather than the entire construction stack: IMARC estimates the furniture market at USD 13.1 billion in 2025 growing to USD 17.8 billion by 2034, while Statista frames the B2C category as including furniture, lighting, and home decor with strong online-shopping, compact-living, and smart-furniture demand drivers. Ohouse is attractive because it addresses multiple layers of this spend—content, tagged commerce, premium assortments, interior contracting, moving, repair, and planning—while using community discovery to lower search and trust friction. The main constraints are housing-cycle sensitivity, contractor quality control, logistics and service complexity, and the challenge of expanding beyond Korea without losing
    local network effects.'
sections:
- id: market-boundary
  title: Market boundary and status-quo substitutes
  body: 'The relevant market for Ohouse is not generic e-commerce and not the full construction economy. Public sources show Bucketplace sits at the intersection of home inspiration media, furniture and decor retail, home-improvement planning, and contractor matching. Statista’s South Korea furniture outlook is useful because it explicitly includes furniture, lamps, lighting, and home decor sold to consumers across living room, bedroom, kitchen, bathroom, outdoor, and home-office use cases. Ohouse’s own pages extend that consumer-spend boundary by layering in remodeling quotes, installation, repairs, moving services, and 3D planning tools, which means the platform competes not only with furniture retailers but also with discovery-first design platforms and fragmented offline contractors. Status-quo substitutes therefore include visiting physical furniture stores such as IKEA Korea and Hanssem, shopping generic marketplaces such as Coupang, relying on search and blogs for inspiration, or
    hiring local contractors directly without a marketplace intermediary. The excluded market should be explicit: Ohouse does not appear to own primary home construction, real-estate brokerage, or large-scale B2B building materials procurement. That makes the best analytical frame a consumer home-living and home-improvement demand layer with adjacent service-brokerage economics rather than a general construction TAM.'
