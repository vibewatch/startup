- id: growth-and-adoption
  title: Growth, adoption trajectory, and public proof of scale
  body: 'The clearest customer-scale story is that Ohouse reached national relevance in Korea before attempting global extension. TechCrunch and Forbes both said Ohouse had more than 20 million cumulative downloads and 10 million monthly users around the 2022 growth phase. Chosun later reported 10 million MAU in 2024, while a 2025 partner announcement claimed more than 30 million cumulative downloads. Apple metadata shows nearly 700,000 ratings for the Korean iOS app in August 2026, and AppBrain estimates roughly 19 million Android downloads, giving strong direct evidence that user engagement did not disappear after the unicorn-funding period. Public engagement proof also appears inside the product: guides carry high view counts, the shoppable feed keeps generating commercial touchpoints, and today-deals or rankings pages imply frequent repeat shopping behavior. These signals are not the same as audited retention data, but they are enough to say Ohouse behaves like a scaled consumer platform
    rather than a niche design community.'
  claimRefs:
