- id: satisfaction-and-repeat
  title: Satisfaction, repeat usage, and what the product footprint implies
  body: 'Public customer satisfaction evidence is directionally positive but incomplete. App-store metadata is impressive on its face: hundreds of thousands of ratings and a very strong average rating on iOS. AppBrain likewise shows a sizable rating base on Android. The product footprint suggests repeat usage should exist even without disclosed cohorts because Ohouse spans inspiration, shopping, planning, and services rather than one-off transactions. Commerce rankings, guide hubs, shoppable feeds, and today-deals are all structures that only matter if users come back. But the available proof remains circumstantial. Neither public sources nor the app stores reveal cohort curves, purchase frequency by segment, or repeat-order contribution to GMV. Reviews also surface operational pain points such as payment resets and category-page freezes, which matter because customer trust in home purchases can be fragile. The right conclusion is that Ohouse likely has strong repeat engagement at the top
    of funnel and in content browsing, but the public record is too thin to underwrite long-term retention by monetized cohort.'
  claimRefs:
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  tableRefs:
  - TU004
  figureRefs: []
- id: expansion-and-concentration
  title: Expansion vectors and concentration risks
  body: 'Customer upside and customer risk are tightly linked for Ohouse. The upside is that customer acquisition can compound across multiple needs: a user who starts with inspiration may later furnish an apartment, then request moving or repair services, and eventually run a remodeling project. Internationally, Ohouse can probably extend inspiration and curated commerce faster than contractor-heavy service layers; the localization posts suggest management understands this. The risks are equally clear. Customer concentration almost certainly remains heavily Korea-centric because the strongest public usage metrics come from the domestic app. Large-ticket service demand is likely more cyclical and quality-sensitive than browsing or smaller-basket commerce, and the company does not publicly disclose cohort retention, category concentration, or geography mix. If Ohouse’s most profitable cohorts come from a narrow set of categories or domestic behaviors, international expansion could dilute
    rather than deepen economics. That makes segment- and geography-level cohort disclosure a major next-step diligence ask.'
