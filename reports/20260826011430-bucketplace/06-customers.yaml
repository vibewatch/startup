chapter:
  number: 6
  title: Customers
  summary: 'Ohouse is a mass-market consumer platform rather than an enterprise company, so the best public customer evidence comes from usage scale, app-store proof, public content engagement, and visible adoption across shopping and service workflows. The strongest reported customer-scale signals are 10 million monthly active users in 2024, more than 20 million downloads by 2022, and more than 30 million downloads claimed in 2025. Direct proof from Apple and AppBrain shows heavy ongoing usage in 2026, while Ohouse’s projects, advice, rankings, and today-deals surfaces show continued customer engagement across inspiration, commerce, and project planning. Customer quality is more mixed than topline adoption: reviews remain mostly positive but do surface checkout and UI-friction complaints, and public sources still do not disclose cohort retention, segment economics, or customer concentration by category or geography.'
sections:
- id: segments-and-journey
  title: Customer segments and the household journey
  body: 'Ohouse serves households rather than procurement teams, but its customer base is not homogeneous. Public surfaces suggest at least five recurring segments: inspiration-led browsers exploring house tours and guides; decor or furnishing shoppers converting through tagged commerce; DIY or self-interior users consuming how-to content before purchasing products; homeowners entering higher-ticket remodeling workflows; and international shoppers or Korean-design enthusiasts using the U.S. storefront. The same household can move among these states over time, which is a meaningful strategic advantage because discovery, purchase, and project execution all live in one app. That journey is visible across the projects feed, advice hub, shoppable content, rankings pages, and experts marketplace. Customer value therefore comes not only from gross downloads but from the ability to re-engage a household through different home-lifecycle moments: browsing inspiration, furnishing a room, moving homes,
    or managing a renovation. The biggest gap is not identifying the segments; it is quantifying the revenue and retention contribution of each segment from public sources.'
