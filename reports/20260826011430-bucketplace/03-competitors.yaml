  - - Search and recommendation systems
    - Moat
    - Public engineering posts
    - Improves discovery quality across content and products
    - Request experimentation and relevance metrics
  - - Service layer complexity
    - Risk
    - Experts, remodeling, moving, repair surfaces
    - Raises wallet share but also operational fragility
    - Review dispute and cancellation rates
  - - Coupang logistics substitution
    - Risk
    - Rocket Delivery and broad marketplace reach
    - Can compress convenience advantage on simple baskets
    - Compare repeat purchase share where speed matters most
  - - Furniture-brand trust of IKEA / Hanssem
    - Risk
    - Established home-furnishing brands
    - Can win customers who prioritize brand or physical experience
    - Benchmark branded conversion and return behavior
  - - International portability
    - Risk
    - U.S. shop and localization efforts only early proof
    - Moat may be Korea-specific if service layer does not travel
    - Request country-level KPI and retention data
  notes: Ohouse’s moat is operational and data-driven, not protected by a visible hard regulatory barrier.
