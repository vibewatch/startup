company:
  name: Bucketplace
chapter:
  number: 3
  title: Competitors
  summary: 'Ohouse competes across three overlapping arenas: inspiration-led design platforms, furniture and home-goods retailers, and service-enabled home-improvement marketplaces. Its strongest local differentiation is the combination of user-generated inspiration, commerce, and remodeling workflows in one Korean consumer app. The toughest competitors are not perfect one-for-one substitutes: IKEA Korea and Hanssem bring furniture brand and physical retail credibility; Coupang brings horizontal marketplace reach and logistics expectations; Houzz is the closest conceptual global analog on remodeling and inspiration; and Wayfair is a useful benchmark for scaled online home retail. Ohouse’s moat looks real but operational rather than unassailable: content and recommendation depth help, but logistics, service quality, and international portability remain the main competitive questions.'
sections:
- id: competitive-set
  title: Competitive set and overlap logic
  body: 'Ohouse does not have one clean rival because it sits across content, retail, and services simultaneously. The closest conceptual competitor is Houzz, which also combines design inspiration with remodeling and home-decision support. IKEA Korea, Hanssem, and Hyundai Livart represent more traditional furniture and home-furnishing competitors with stronger physical-retail or brand heritage. Coupang represents the strongest horizontal digital substitute because it can absorb home-goods demand inside a much larger marketplace and pair it with fast logistics. Wayfair is a more useful global benchmark than a direct Korean rival: it shows how large a pure-play online home retailer can become, but it lacks Ohouse’s community-led Korean identity and service-marketplace angle. This fragmented field helps Ohouse because no single competitor fully duplicates its workflow, but it also means Ohouse can be attacked from multiple directions by players with stronger logistics, deeper brand budgets,
    or more focused category expertise. This multidirectional pressure is central to the investment case.'
