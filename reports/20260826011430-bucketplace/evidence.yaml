evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-composition
    missingEvidence: Current board roster, observer rights, and committee structure.
    whyItMatters: Governance independence, investor control rights, and refresh capacity cannot be evaluated from the public record.
    diligencePath: Request the latest board deck and board composition schedule from the company or lead investor.
    relatedQuestionRefs:
      - QO022
      - QO025
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Exact ownership, liquidation preferences, secondaries, and any debt or structured financing.
    whyItMatters: >-
      Unclear preference overhang can materially change common-equity attractiveness even if operating momentum is
      improving.
    diligencePath: Review the cap table, last round documents, and any secondary-transfer summary from counsel.
    relatedQuestionRefs:
      - QO008
      - QO022
      - QO025
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: Verified employee count by region and function as of the run date.
    whyItMatters: Profile-site inconsistency makes it hard to benchmark operating leverage and hiring intensity.
    diligencePath: >-
      Confirm active payroll headcount directly with company HR or finance and reconcile against public profile
      providers.
    relatedQuestionRefs:
      - QO015
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: audited-financials
    missingEvidence: Primary-source financial statements or equivalent management accounts for 2024 revenue and profit.
    whyItMatters: >-
      Public profitability reporting currently depends on secondary media and is not independently auditable from public
      filings.
    diligencePath: Request audited statements or board-approved management accounts covering FY2024.
    relatedQuestionRefs:
      - QO011
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: country-mix
    missingEvidence: Revenue, orders, and user split by Korea, Japan, Indonesia, and U.S. operations.
    whyItMatters: >-
      The expansion narrative is visible, but public evidence does not show whether international markets are
      strategically meaningful yet.
    diligencePath: Ask management for country-level KPIs, launch cohorts, and contribution margins by geography.
    relatedQuestionRefs:
      - QO017
      - QO025
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: sam-som-precision
    missingEvidence: >-
      A reliable externally verified split between offline furniture spending, online furniture spending, and the
      services layer most relevant to Ohouse.
    whyItMatters: >-
      Without a tighter digital-share and services-share view, market capture assumptions can overstate what Ohouse can
      actually intermediate.
    diligencePath: Request management’s category mix, online share assumptions, and service revenue/GMV split by line of business.
    relatedQuestionRefs:
      - QM004
      - QM006
      - QM024
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: buyer-segment-quantification
    missingEvidence: Public customer counts by segment, room category, project size, and cohort behavior.
    whyItMatters: Segment logic is observable qualitatively but not strong enough for weighted bottom-up sizing.
    diligencePath: Request segment-level order mix, AOV, and retention by commerce versus remodeling use case.
    relatedQuestionRefs:
      - QM009
      - QM010
      - QM025
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: housing-cycle-sensitivity
    missingEvidence: Historical Ohouse category performance through different Korean housing and consumer-confidence conditions.
    whyItMatters: Large-project demand could prove much more cyclical than the current public narrative implies.
    diligencePath: Stress-test category GMV and quote volume against housing turnover and macro softness.
    relatedQuestionRefs:
      - QM018
      - QM025
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: international-localization
    missingEvidence: Country-level KPI and economics for Japan, Indonesia, and the U.S.
    whyItMatters: >-
      Cross-border upside is central to the long-term market story but public evidence does not show repeatable
