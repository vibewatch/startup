companyProfile:
  summary: Bucketplace is the Seoul-based company behind Ohouse (오늘의집), a home-living platform that started as a community for interior inspiration and expanded into tagged commerce, remodeling, moving, installation, repair, premium brands, and 3D room-planning tools. Public evidence shows the company reached unicorn status in 2022 and materially de-risked its story in 2024 with KRW 287.9B revenue and its first annual operating profit. Ohouse appears to be one of the few Korean consumer internet companies with visible scale across content, commerce, and services, but the public record still leaves key questions on segmented economics, governance structure, and the true portability of the model outside Korea.
  founders:
    - name: Seungjae Lee
      role: Founder, CEO / Representative Director
      background: Former chemical and electrical engineer trained at Seoul National University; still the main public operator associated with Bucketplace's strategy and growth.
      claimRefs: [CO003, CO013]
  foundingLocation: Seoul, South Korea
  headquarters: Seoul, South Korea
  productSummary: Ohouse lets users browse community-generated room inspiration, identify tagged products, buy home goods, and book remodeling or home services inside one platform, with additional features such as premium-brand curation and 3D room simulation.
  customerFocus: Mass-market households and home-improvement consumers in Korea, with early international expansion into Japan, Indonesia, and the U.S.
  businessModel: Consumer commerce, advertising, and interior/home-service monetization layered on top of a content and community discovery flywheel.
  stage: late-stage private / profitable unicorn
  fundingStatus: Latest clearly disclosed primary round was a $182M Series D in May 2022 at a public valuation band around $1.4B-$1.6B; Tracxn reports about $252M disclosed total funding across visible public rounds.
  disclosureProfile: private-disclosed
  claimRefs: [CO001, CO002, CO003, CO004, CI010, CI011, CI016, CU010, CV011, CV012]
summary:
  headline: Bucketplace has stronger fundamentals than many consumer unicorns because Ohouse now pairs category-leading home-living reach with real profitability, but the public record still does not justify paying confidently above the prior unicorn band without deeper diligence.
