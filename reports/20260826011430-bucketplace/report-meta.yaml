  topStrengths:
    - Ohouse has visible category leadership in Korean home-living with a differentiated content-to-commerce-to-services flywheel.
    - 2024 revenue of KRW 287.9B and first annual operating profit materially de-risk the story versus narrative-only consumer unicorns.
    - User scale is substantial, with 10M MAU in 2024, 20M+ historical downloads by 2022, and 30M+ downloads claimed in 2025.
    - Product breadth spans inspiration, shopping, remodeling, logistics-adjacent fulfillment, and 3D planning rather than a single retail vertical.
    - Public funding history and blue-chip backers provide credible capital-market validation even if the company remains private.
  topRisks:
    - Public disclosure is still too thin on take rate, gross margin, contribution margin, CAC, cash generation, and balance-sheet strength.
    - Governance visibility is weak because board composition, investor-rights detail, and preference overhang are not publicly clear.
    - International optionality remains mostly narrative because public cohort retention and contribution economics outside Korea are absent.
    - Service-quality or trust failures in remodeling and home services could damage repeat behavior in the platform's most valuable workflows.
    - A large premium above the 2022 $1.4B-$1.6B valuation context would be hard to defend without private evidence that margins and repeat behavior are stronger than the public record suggests.
  unresolvedGaps:
    - Segmented economics by commerce, ads, services, and owned-brand lines, including take rate and gross margin.
    - Current cash balance, debt, working-capital position, and free-cash-flow profile.
    - Board composition, investor rights, preference stack, and any secondary or control overhang.
    - International cohort retention, CAC, and contribution margin by market.
    - Service-quality metrics such as dispute, cancellation, refund, and referral rates for interior/remodeling workflows.
