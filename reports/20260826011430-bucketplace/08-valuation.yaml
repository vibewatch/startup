- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Service-quality metrics disappoint
    - High disputes / cancellations / poor referrals
    - Undermines highest-value growth layer and trust moat
    - Pause or reprice materially lower
  - - Profitability reverses under normal expansion
    - 2025-2026 burn resumes without strong cohort quality
    - Shows 2024 profit was fragile or mix-driven
    - Re-underwrite as lower-multiple risk asset
  - - International cohorts underperform
    - Low retention / poor contribution margin abroad
    - Removes global optionality from thesis
    - Anchor valuation to domestic-only case
  - - Governance or preference overhang emerges
    - Board or cap-table terms materially disadvantage new money
    - Compresses risk-adjusted return even if business quality is good
    - Require stronger terms or walk away
  - - Security / trust event occurs
    - Material payment, privacy, or service trust breakdown
    - Damages brand and customer repeat willingness
    - Pause diligence until remediation evidence exists
  notes: Kill triggers are explicit because the company can remain fundamentally interesting while becoming a poor investment at a given price or structure.
