company:
  name: Bucketplace
chapter:
  number: 8
  title: Valuation
  summary: 'Bucketplace looks like a real business with unicorn-scale proof, but the public record supports disciplined interest rather than an aggressive mark-up from the 2022 unicorn valuation. The company now has stronger evidence than it did at Series D—2024 revenue of KRW 287.9 billion, first annual operating profit, large user scale, and clear product breadth—but still lacks the line-item economics and governance visibility needed to pay confidently for blue-sky global upside. The best investment posture is conditional: attractive at or below a disciplined band around the prior $1.4 billion to $1.6 billion valuation context, potentially more valuable if private diligence confirms strong take rates, repeat behavior, and service quality, but too evidence-thin to underwrite a large premium today. Recommendation: flag / conditional invest, medium confidence, elevated risk, valuation stance cautious-to-selective.'
sections:
- id: thesis-vs-antithesis
  title: Thesis, anti-thesis, and recommendation logic
  body: 'The core thesis for Bucketplace is straightforward: Ohouse has built a scaled Korean home-living platform with visible network effects across inspiration content, commerce, and services; it is no longer just a growth story because 2024 brought both meaningful revenue and first annual operating profit. That combination is rare and valuable in consumer internet. The anti-thesis is equally important: public evidence still leaves major blind spots on margin quality, repeat economics, board governance, and the true portability of the model outside Korea. A business can be good and still be a poor investment at the wrong price or under weak governance terms. The right recommendation therefore is not a reflexive pass or buy. It is a conditional invest / flag stance: strong enough to deserve serious diligence and potentially attractive at disciplined entry, but not supported well enough by public evidence to justify a big step-up from prior unicorn marks.'
