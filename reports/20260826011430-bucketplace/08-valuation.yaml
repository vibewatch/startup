- id: scenarios-and-downside
  title: Bull, base, and bear scenarios
  body: 'The bull case is that Ohouse’s content-to-commerce flywheel, service expansion, and first-year profitability mark the early stage of a durable Korean category leader that can eventually transplant curated commerce and selected service workflows abroad. In that case, private diligence would reveal stronger take rates, repeat behavior, and contribution margins than the public record suggests. The base case is more conservative: Ohouse remains a strong domestic platform, keeps improving profitability, and grows selectively, but international upside takes longer and the business deserves only a modest premium to the 2022 mark until disclosures improve. The bear case is not that the company collapses; it is that service complexity, margin opacity, or weak international unit economics make the 2022 unicorn valuation look full. That scenario could still leave Ohouse as a good company but a mediocre new-money entry. Because the public record cannot resolve these scenarios cleanly, valuation
    should be expressed as a range, not a point. It should also stay explicitly tied to what new private diligence can prove or disprove rather than to generic category enthusiasm.'
  claimRefs:
  - CV021
  - CV022
  - CV023
  - CV024
