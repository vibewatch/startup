    - Ops diligence + partner scorecards
  - - Cash-flow and balance-sheet detail
    - Cash, debt, working capital, and burn/cash generation
    - Needed for entry discipline and dilution risk
    - Finance diligence + counsel review
  notes: These asks are the minimum needed to move from strategic interest to priced conviction.
