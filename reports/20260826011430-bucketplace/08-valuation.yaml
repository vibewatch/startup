- id: valuation-context
  title: Valuation context, prior marks, and entry discipline
  body: 'The most concrete public valuation context remains the 2022 Series D. TechCrunch and Tracxn cluster the round around a $1.4 billion valuation, while Forbes reports approximately $1.6 billion. On 2024 revenue of roughly KRW 287.9 billion, that implies a historical valuation-to-revenue ratio in the rough range of about 6.5x to 7.4x using the user-provided USD translation baseline. That is not automatically unreasonable for a scaled, profitable, still-growing category leader, but it is also not obviously cheap given the remaining opacity around mix, margins, and repeat behavior. Public comparables help only directionally: CompaniesMarketCap places Coupang at about $30 billion and Wayfair at about $14.31 billion in August 2026, showing the size of public-market outcomes in ecommerce, while their SEC-filed status reminds us how much more disclosure those businesses provide. The investment implication is that Bucketplace can likely support continued private-market relevance, but entry
    price discipline matters more than narrative excitement.'
