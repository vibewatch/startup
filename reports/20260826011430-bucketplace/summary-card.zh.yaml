  headline: Bucketplace 基本面强于许多消费独角兽，因为 Ohouse 已把品类领先的家居生活触达和真实盈利能力结合起来；但公开记录仍不足以支撑在没有更深尽调时，笃定支付高于既有独角兽区间的价格。
