  topStrengths:
    - Ohouse 在韩国家居生活市场有可见的品类领导力，并跑出了差异化的内容到电商再到服务飞轮。
    - 2024 年收入 KRW 287.9B，且首次实现全年经营利润，相比只靠叙事的消费独角兽，故事明显去风险。
    - 用户规模可观：2024 年 MAU 达 10M，2022 年历史下载量超过 20M，2025 年声称下载量超过 30M。
    - 产品宽度覆盖灵感、购物、改造、邻近物流的履约和 3D 规划，而不是单一零售垂直。
    - 公开融资历史和一线投资方背书提供了可信的资本市场验证，即使公司仍未上市。
  topRisks:
    - 公开披露在抽佣率、毛利率、贡献利润率、CAC、现金生成和资产负债表强度上仍太薄。
    - 治理可见度偏弱，因为董事会构成、投资者权利细节和优先权包袱都不够公开清晰。
    - 国际化可选性大多还停留在叙事，因为韩国以外市场的公开队列留存和贡献经济性缺失。
    - 改造和家居服务中的服务质量或信任失败，可能损害平台最有价值工作流里的复购行为。
    - 若价格大幅高于 2022 年 $1.4B-$1.6B 估值背景，除非私有证据显示利润率和复购行为强于公开记录，否则很难辩护。
  unresolvedGaps:
    - 按电商、广告、服务和自有品牌线拆分的经济性，包括抽佣率和毛利率。
    - 当前现金余额、债务、营运资本状况和自由现金流画像。
    - 董事会构成、投资者权利、优先股堆叠，以及任何二级交易或控制权包袱。
    - 按市场拆分的国际化队列留存、CAC 和贡献利润率。
    - 室内 / 改造工作流的服务质量指标，例如纠纷、取消、退款和转介绍率。
