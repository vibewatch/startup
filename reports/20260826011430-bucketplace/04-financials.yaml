company:
  name: Bucketplace
chapter:
  number: 4
  title: Financials
  summary: 'Public financial evidence for Bucketplace is limited but materially better than for many private consumer startups because multiple sources now point to a 2024 inflection: KRW 287.9 billion of revenue, 22.3% growth, and roughly KRW 570 million of operating profit. The strongest interpretation is that Ohouse is no longer just a growth narrative; it has demonstrated at least one year of annual profitability while continuing to run a large commerce and services platform. The caveat is that the public record is still missing the core underwriting metrics investors actually need—gross margin, take rate by business line, CAC, payback, NRR-equivalent household repeat metrics, cash balance, and free cash flow. As a result, the company looks financially promising but still under-disclosed.'
sections:
- id: revenue-model
  title: Revenue streams and monetization surfaces
  body: 'Ohouse monetizes more like a layered consumer platform than a single retailer. Official surfaces and reported company descriptions indicate at least four revenue engines: commerce take from furniture and home-goods transactions, advertising or merchandised placement inside the content-to-commerce loop, service economics from remodeling and related home services, and newer owned-brand or premium assortment expansion. The app description and company pages also show adjacent value surfaces such as moving, repair, installation, and 3D planning, which may not all be individually material today but deepen monetization optionality. What is most important financially is that these lines likely carry very different margin structures. Product commerce has fulfillment and merchant economics; advertising should be structurally higher margin; and service brokerage or contractor workflows may be higher ticket but operationally messier. The public record is enough to map the model conceptually,
    but not enough to quantify business-line mix or contribution margins.'
  claimRefs:
