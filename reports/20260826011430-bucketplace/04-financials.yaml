    - Still limited vs public peers
    - Normal for private company, but underwriting remains incomplete
    - Low disclosure can mask working-capital or margin stress
    - Request management accounts and debt schedule
  notes: Capital adequacy looks better than survival-stage startups, but public proof remains incomplete without current balance-sheet data.
