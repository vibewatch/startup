      - CV030
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考价值
      - 局限
    rows:
      - - Bucketplace Series C
        - 后期私募定价
        - ~$890M 估值（TechCrunch / Tracxn 口径）
        - 给出 Series D 前的估值基线
        - 早于 2024 年盈利，定价偏旧
      - - Bucketplace Series D
        - 后期私募定价
        - ~$1.4B-$1.6B 估值区间
        - 最直接的公开定价锚
        - 早于 2024 年盈利和后续全球试验
      - - Wayfair
        - 公开市值
        - ~$14.31B（2026 年 8 月）
        - 有用的家居电商基准
        - 地域、披露和模式组合不同
      - - Coupang
        - 公开市值
        - ~$30.0B（2026 年 8 月）
        - 有用的韩国电商规模基准
        - 横向电商平台，业务广度差异很大
      - - Houzz
        - 商业模式类比
        - 私有基准 / 本次未捕捉到当前公开市值
        - 有用的灵感内容 + 改造类比对象
        - 此处未捕捉到当前公开估值锚
    notes: 可比组混合了直接历史定价、公开电商基准和商业模式类比，因为没有单一可比公司能完全匹配 Ohouse。
    enumerationScope:
