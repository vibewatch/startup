      - number: '1.3'
        title: 融资历史、利益相关方地图与股权信号
        blocks:
          - type: paragraph
            body: >-
              对一家独角兽级消费平台来说，Bucketplace 的公开融资记录异常集中；目前可查资料只浮现出两轮明确披露的后期融资，而不是一长串小额融资。TechCrunch、Business Wire、Forbes 和
              Tracxn 均确认 2022 年 5 月 Series D 轮金额为 $182M，并列出大体相似的投资人组合：Vertex Growth、SoftBank Ventures Asia/SBVA、BRV
              Capital Management、Korea Development Bank、Mirae Asset、IMM Investment、Bond Capital 等。Tracxn 还记录 2020 年 11
              月一轮 $70M Series C，投资方包括 Bond Capital、Mirae Asset、NAVER 和 IMM Investment，使其披露融资总额约为 $252M。Forbes
              报道的累计融资略高，为 $261.2M，估值约 $1.6B；TechCrunch 和 Tracxn 则把投后估值放在更接近 $1.4B
              的位置。差异足够小，更适合视为估值区间，而不是对独角兽地位的矛盾。更重要的是投资人质量：这一轮同时集结韩国金融机构和全球成长投资人，为 Bucketplace
              追求国际扩张、产品投入和并购提供了资本。公开证据还显示，Bucketplace 收购了新加坡家具平台 HipVan，随后投资美国住宅交易初创公司 InHouse，说明管理层愿意用资本和战略交易扩大地域覆盖。
