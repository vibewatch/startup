      - number: '6.3'
        title: 满意度、重复使用与产品足迹意味着什么
        blocks:
          - type: paragraph
            body: >-
              公开客户满意度证据方向上积极，但并不完整。应用商店元数据表面上很亮眼：iOS 有数十万个评分，平均评分很高。AppBrain 同样显示 Android
              上有相当大的评分基数。即便没有披露队列，产品足迹也暗示重复使用应当存在，因为 Ohouse
              横跨灵感、购物、规划和服务，而不是一次性交易。交易榜单、指南中心、可购物信息流和今日特价这些结构，只有用户回来才有意义。但现有证明仍属间接。公开来源和应用商店都没有披露队列曲线、各分层购买频率，或复购对 GMV
              的贡献。评论也暴露了支付重置、品类页面卡死等运营痛点；这很重要，因为客户对家居购买的信任可能很脆弱。合理结论是，Ohouse
              在漏斗顶部和内容浏览上的重复参与很可能较强，但公开记录太薄，无法承保变现队列的长期留存。
