      - number: '1.4'
        title: 规模指标、盈利里程碑、扩张路径与反向信号
        blocks:
          - type: paragraph
            body: >-
              最近最清楚的里程碑来自财务端：Chosun 和 Seoulz 均报道，Bucketplace 2024 年收入达到 KRW 287.9B，同比增长 22.3%，并实现约 KRW 570M
              营业利润——这是成立以来首次年度营业利润。这些来源还把改善归因于更成熟的变现组合，尤其是广告、商品销售和增长中的室内服务吞吐。Chosun 补充了两个尤其重要的规模数据：Ohouse 2024 年月活用户为
              10M；室内设计服务的累计交易额在 2024 年翻倍后超过 KRW 1T。公司关联来源给出的规模图景更宽，但也更偏宣传：Business Wire 和 Forbes 称，2022 年 Series D 轮前后每
              7 秒就有一件家具被购买；2025 年 InHouse 公告则称累计安装量 30M，累计交易额约 $5B。AppBrain 和 iOS App Store 证实，2026 年该应用仍被高频使用，Android
              下载量达数千万，iOS 评分接近 700,000 个，且版本更新频繁。官方里程碑页面显示，业务持续拓宽：从 2016 年上线商店，到 2019 年进入装修，2021 年获得信息安全认证，2022
              年获独角兽称号，2023 年推出 Binaryshop，2025 年开设线下展厅和自有厨房装修品牌，2026 年推出装修咨询休息区。主要反向信号没有到生死攸关的程度：近期 iOS 评价抱怨结账重置和 UI
              卡死，公开来源也仍未披露董事会构成、准确员工数和分国家收入结构。
