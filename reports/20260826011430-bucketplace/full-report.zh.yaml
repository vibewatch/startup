      - number: '6.4'
        title: 扩张路径与集中风险
        blocks:
          - type: paragraph
            body: >-
              Ohouse 的客户上行空间和客户风险紧密相连。上行空间在于，获客可以围绕多种需求复利：用户从灵感开始，之后可能布置公寓，再申请搬家或维修服务，最终进入装修项目。国际上，Ohouse
              很可能比承包商重的服务层更快延展灵感和精选交易；本地化文章显示管理层理解这一点。风险同样清楚。客户集中几乎肯定仍高度偏韩国，因为最强的公开使用指标来自国内应用。高客单服务需求可能比浏览或小篮子交易更受周期和质量影响，公司也没有公开披露队列留存、品类集中度或地域组合。如果
              Ohouse 利润最高的队列来自一组狭窄品类或国内行为，国际扩张可能稀释而不是加深经济性。因此，分层和地域层面的队列披露是下一步尽调的主要问题。
