      basis: >-
        Covers the most decision-relevant references available publicly in this run: Bucketplace prior rounds, two
        public ecommerce benchmarks, and the closest business-model analog. Korean listed furniture retailers were not
        included as valuation anchors because equally clean public market-cap evidence was not gathered here.
