      - number: '7.4'
        title: 人才、治理与打破投资逻辑的条件
        blocks:
          - type: paragraph
            body: >-
              即便 Ohouse 在 2024 年取得财务进展，创始人集中和披露不透明仍是实质风险。公开来源清楚把 Seungjae Lee 标识为创始人兼
              CEO，但没有提供完整董事会名单、详细高管梯队或清晰接班图景。这很重要，因为公司的故事从产品战略、融资历史到国际抱负，看起来仍高度由创始人驱动。最重要的投资逻辑破坏条件并不抽象：如果服务质量或纠纷率明显差于暗示水平，如果盈利能力在温和扩张投入下逆转，如果国际市场消耗资本却没有形成有意义留存，或如果安全或支持故障伤害公众信任，投资案例都会迅速走弱。这些风险对纪律严明的运营者来说可管理，但需要更深入尽调公开记录目前没有披露的指标。因此，在高确信度承保前，治理细节、服务质量
              KPI 和地域层面经济性应作为门槛式尽调问题。只有私人尽调能果断补上这些未知项，它们才算可管理。
