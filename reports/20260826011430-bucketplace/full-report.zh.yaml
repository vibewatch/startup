      - number: '3.2'
        title: 能力宽度与价值打包
        blocks:
          - type: paragraph
            body: >-
              从公开展示的能力看，在消费者家居平台里，Ohouse 覆盖异常宽。它提供社区内容、指南、可购物灵感、商店层、3D 设计、榜单、高端策展和装修服务。IKEA 和 Hanssem
              显然覆盖了家具旅程的大部分环节，但公开呈现更像零售商驱动，而不是社区驱动。Coupang 在选择丰富度和配送速度上竞争，却不把家居设计灵感作为主要身份。Houzz 仍是内容加装修逻辑的最佳参照，Wayfair
              则更适合作为家居交易规模对标。按打包方式看，Ohouse
              的优势不是简单低价或会员机制，而是工作流便利：在一个环境里从想法走到商品，再走到项目。这有战略价值；但如果用户更在意最低到手价、最快履约或品牌家具信任，而不是一体化灵感，防守难度就会提高。
