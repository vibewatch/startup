      - number: '3.3'
        title: 护城河耐久性与竞争风险清单
        blocks:
          - type: paragraph
            body: >-
              Ohouse
              的护城河在内容、数据和服务编排相互强化的地方最强。庞大的用户生成灵感语料可以改善发现、推荐和转化；交易和服务又会产生更多用户行为，以及更多可展示的家庭案例。这形成的循环，比静态家具店更难轻易复制。但在竞争者可以用蛮力优势替代的地方，Ohouse
              的护城河较弱：Coupang 可以靠物流和便利性赢，IKEA 或 Hanssem 可以靠家具品牌信任赢，类似 Houzz 的平台则可以在国际市场挑战「灵感 +
              装修」叙事。服务层尤其是双刃剑。它提高钱包份额和差异化，却也让 Ohouse 暴露于质控失败；这种失败破坏信任的速度可能快过一次零售订单延误。因此，竞争耐久性不取决于新奇感，而取决于 Ohouse
              能否一边保持内容到交易飞轮运转，一边避免服务崩盘，并证明跨境可复制性。
