chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、平台边界与商业模式
        blocks:
          - type: paragraph
            body: >-
              Bucketplace 总部位于首尔，旗下 Ohouse
              是一款围绕「家」搭建的生活方式超级应用：家居灵感、发现、交易和落地执行都应在同一条工作流里完成。公司英文官网和应用商店描述反复呈现同一条链路：从用户生成的灵感内容出发，进入带标签的商品交易，再延伸到装修、搬家、安装和维修等高摩擦服务。官方页面显示，公司成立于
              2014 年 7 月，并在 2016 年上线 Ohouse Store；独立报道则称，该服务最早来自用户分享室内照片的社区，后来演进为内容到交易引擎。这个起点至今仍有战略意义：Ohouse
              不是只靠搜索卖家具，而是让用户在同一生态里浏览真实家庭、识别带标签商品、申请室内报价，并预约上门服务。当前产品版图还包括面向高端品牌的 Binaryshop、透明报价装修、直接安装和维修服务，以及 3D
              房间模拟。Ohouse 在美国的网站和商店页面说明，公司正在韩国以外测试同一套「灵感 + 交易」模式的本地化版本，而不是只输出单一零售垂类。
