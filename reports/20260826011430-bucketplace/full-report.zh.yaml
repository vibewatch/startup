        - 可能压垮组织能力，或拖慢产品质量
        - 审查组织结构和运营节奏
      - - 员工数可见性缺口
        - 公开资料网站对员工数说法冲突
        - 让效率对标变难
        - 按地区和职能确认工资单员工数
      - - AI / 工具采用风险
        - 近期多篇帖子强调 AI 赋能工作流
        - 若不绑定价值，可能分散执行注意力
        - 审查 AI 工具的内部 ROI 和优先级
    notes: 人员风险不是创始人能力弱，而是创始人中心性叠加外部治理能见度有限。
    claimRefs:
      - CR027
      - CR028
      - CR029
      - CR030
      - CR031
      - CR032
  - id: TR005
    title: 缓释和否决标准表
    columns:
      - 情景
      - 为什么重要
      - 影响
      - 概率判断
      - 缓释措施 / 否决标准
    rows:
      - - 服务纠纷显著超过管理层叙事
        - 会削弱最高价值的扩张层
        - 严重
        - 中
        - 如果纠纷率或取消率暴露承包商质量控制存在结构性短板，放弃投资
      - - 轻度扩张下，2024 年盈利能力迅速反转
        - 说明经济模型脆弱，或 2024 年利润只是一次性结果
        - 高
        - 中
        - 如果扩张市场需要持续烧钱，却没有强留存，放弃投资
      - - 安全或支付故障引发信任事件
        - 可能同时伤害电商和服务业务的品牌
        - 严重
        - 低 / 中
        - 要求提供审计就绪、事件响应和支付可靠性的证据
      - - 国际客户复购低 / 单位经济差
        - 会封顶全球上行空间，并摊薄资本效率
        - 高
        - 中
        - 如果国际队列看不到可信留存路径，放弃投资
      - - 治理不透明掩盖不利资产负债表或控制权问题
        - 可能突然改变下行情形
        - 严重
        - 低 / 中
        - 如果董事会、股权结构表或债务披露暴露反向意外，放弃投资
    notes: 放弃标准是分析师为尽调纪律设定的阈值，不是对这些事件会发生的预测。
    claimRefs:
      - CR030
      - CR031
      - CR032
      - CR033
      - CR034
      - CR035
  - id: TV001
    title: 建议摘要表
    columns:
      - 建议
      - 置信度
      - 风险评级
      - 估值判断
      - 决策含义
    rows:
      - - 风险标记 / 有条件投资
        - 中
        - 风险偏高，但可通过尽调管理
        - 谨慎到选择性出手；此前独角兽估值区间大致站得住，但公开证据不足以支撑大幅溢价
        - 只有在价格克制，并深化经济模型、治理和全球队列尽调后才推进
    notes: 该判断刻意绑定价格和证据，不是泛泛的质量评分。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - 韩国规模化家居生活平台，覆盖内容、电商和服务
        - 若服务质量或复购表现不佳，逻辑会削弱
      - - 2024 年收入表现和首次年度经营利润，让公司风险显著下降
        - 若 2025-2026 年现金生成能力和业务线利润率得到确认，逻辑会增强
      - - 产品广度和客户证据说明 Ohouse 仍有需求黏性
        - 若用户规模无法转化为强变现队列，逻辑会削弱
      - - 全球选择权可能带来韩国以外的上行空间
        - 若国际队列留存低或单位经济差，逻辑会削弱
      - - 治理和经济模型不透明，目前压低投资确信度
        - 若披露董事会、股权结构表和分部 P&L，判断会改善
    notes: 反向逻辑更多针对信息披露不足下的估值确信度，而不是公司质量本身。
    claimRefs:
      - CV002
      - CV006
