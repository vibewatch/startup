  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险暴露面
        blocks:
          - type: paragraph
            body: >-
              可查公开来源没有显示 Bucketplace 目前面临诉讼或执法行动，这是建设性信号。但没有可见法律麻烦，不应被误读为法律暴露低。Ohouse
              涉及消费交易、支付、个人数据处理、承包商匹配和家装工作流；一旦执行滑坡，这些都会带来实质消费者保护和纠纷风险。官方时间线中的 ISMS
              认证是有帮助的正向信号，但它只是流程成熟度的基线证明，不是完整法律护盾。由于公司还中介报价和承包商关系，虚假陈述、退款争议或服务质量投诉，即便最初表现为客服问题，也可能演变成监管或法律问题。因此，法律风险结论是中等而不是急迫：公开层面看不到红旗，但商业模式创造了多个可能引发消费者投诉和监管关注的点。公开政策页面存在，但投诉和事故数据仍不透明。
