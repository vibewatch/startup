  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: Bucketplace 在相关性验证上得分高，在估值精度和证据完整性上只属中等。
    data:
      items:
        - label: 市场 / 品类相关性
          value: High
          sublabel: Large Korean home-living demand with online and service adjacency
        - label: 产品 / 客户验证
          value: High
          sublabel: 10M MAU, broad app proof, community plus services
        - label: 经济性可见度
          value: Low-Medium
          sublabel: Profitability proof exists, but unit economics stay private
        - label: 治理可见度
          value: Low
          sublabel: Board and preference details still opaque
        - label: 估值信心
          value: Medium
          sublabel: Prior unicorn band plausible; large premium unsupported publicly
