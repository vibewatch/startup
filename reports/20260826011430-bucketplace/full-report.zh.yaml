      - number: '3.4'
        title: 定位展望与强竞争者画像
        blocks:
          - type: paragraph
            body: >-
              最大的战略问题不是 Ohouse 是否有竞争，而是更强的既有玩家能否拼出足够多的 Ohouse
              工作流，从而压缩其优势。一个难缠对手会同时具备家居设计灵感、可信货盘、快速配送、强服务网络和稳健的跨境选品能力。公开观察到的韩国对手里，还没有一家清楚具备全套能力。这给 Ohouse
              留下空间，继续赢得看重灵感和一体化规划的家庭。不过，平台很可能还需要继续加深网络效应或执行质量，才能守住位置。如果通用市场继续抬高物流预期，或服务质量成为大件品类的决定因素，而 Ohouse
              又不能把内容和数据优势转化为更好的信任和结果，而不只是发现量，那么竞争边缘可能收窄。因此，竞争尽调应关注切换触发点和服务结果，而不只是品牌知名度或目录规模。公开证据支持这一担忧。
