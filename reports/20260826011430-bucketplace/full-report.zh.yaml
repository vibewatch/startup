      - number: '2.4'
        title: 增长驱动、信任摩擦与结构性约束
        blocks:
          - type: paragraph
            body: >-
              韩国家居生活市场给了 Ohouse 几个真实顺风因素。Statista 强调线上购物、智能家具采用、居住空间有限、可支配收入上升和老龄人口舒适需求等需求驱动；IMARC
              另外强调城市化、室内美学、多功能设计、可持续性和电商扩张。Ohouse 与这些驱动因素契合度很高，因为消费者主动重新设计公寓、寻求更好利用有限空间时，其商品目录、3D
              设计工具、教育内容和服务市场都会受益。与此同时，市场受制于信任和运营执行。高价值室内工程仍依赖承包商质量、排期、售后服务和纠纷处理；应用商店评论也显示，即便是数字结账和已保存品类体验，也会让用户受挫。这个品类还受住房周期影响，韩国以外扩张则带来本地化风险，因为服务市场的质控很难逐国移植。战略结论是，Ohouse
              的市场有吸引力，因为需求可被数字渠道影响且仍然碎片化；但公司只有证明内容驱动的获客可以在不牺牲服务质量的情况下扩张，才有资格继续扩大边界。
