      - number: '7.3'
        title: 伙伴、市场与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Ohouse 依赖的不只是软件质量。它还依赖商家、承包商、物流预期、消费者信心和国内网络效应。TechCrunch
              提到数千家装修公司，这同时凸显规模和依赖：广泛伙伴供给可以扩大选择，也会放大质控和协调风险。市场侧，Statista
              和公开电商参照都强化了一个事实：家居支出与可选消费预算和住房条件绑定，大项目尤其如此。竞争上，Coupang 这类通用市场可以靠速度和便利性挤压简单家居用品篮子，IKEA、Hanssem
              这类零售商可以靠家具信任竞争。国际上，Ohouse
              已显示美国和其他扩张迹象，但本地化服务质量比精选交易或翻译内容更难复刻。这些依赖并不阻止业务继续增长，但前提是公司能管理一组异常宽的外部关系和运营假设。监控必须持续。
