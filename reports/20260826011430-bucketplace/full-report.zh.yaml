      - number: '2.2'
        title: 规模测算视角与线上可触达支出
        blocks:
          - type: paragraph
            body: >-
              本次研究中最强的公开市场规模来源是 IMARC，其估计韩国家具市场 2025 年为 USD 13.1B，到 2034 年将以 3.35% CAGR 增至 USD 17.8B。这不是完美的 Ohouse
              TAM，因为 Ohouse 也从服务和媒体变现，但它是锚点最清晰的品类视角。Statista 通过把照明和家居装饰纳入 B2C 家具市场，并将线上购物描述为主要市场趋势，补充了重要的定义和方法论细节。对
              Ohouse 来说，最相关的可触达层是这部分支出中线上以及受数字渠道影响的部分：IMARC 明确把线上商店列为分销渠道，而 Ohouse 整个模式就是把数字灵感转化为商品和服务意图。第二个规模视角是 Ohouse
              在更广市场中的自身规模。Business Wire 称，2022 年 Series D 轮前后，年化 GMV 达到 $1.7B；Seoulz 则称管理层 2024 年目标 GMV 超过 KRW 2T。这些是平台
              GMV，不是纯家具收入，但意味着 Ohouse 已经中介了韩国线上家居生活需求中相当一部分。结论是：这个市场足以支撑独角兽结果，但边界也足够清楚，执行质量和品类份额比自上而下的 TAM 叙事更关键。
