  - id: TV005
    title: 投资逻辑破裂和放弃触发表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 服务质量指标不及预期
        - 纠纷多 / 取消率高 / 转介绍差
        - 削弱最高价值增长层和信任护城河
        - 暂停，或大幅下调定价
      - - 正常扩张下盈利能力反转
        - 2025-2026 年重新烧钱，且队列质量不强
        - 说明 2024 年利润脆弱，或由结构组合驱动
        - 作为低倍数风险资产重新测算
      - - 国际队列表现不及预期
        - 海外留存低 / 贡献利润率差
        - 从投资逻辑中拿掉全球选择权
        - 估值锚定仅国内情景
      - - 治理或优先权包袱浮现
        - 董事会或股权结构条款明显不利于新股资金
        - 即使业务质量不错，也会压缩风险调整后回报
        - 要求更强条款，否则退出
      - - 发生安全 / 信任事件
        - 支付、隐私或服务信任出现重大失守
        - 伤害品牌和客户复购意愿
        - 暂停尽调，直到看到补救证据
    notes: 放弃触发因素需要明示，因为公司基本面可以仍然有吸引力，但在某个价格或结构下变成一笔差投资。
    claimRefs:
      - CV027
      - CV029
      - CV032
      - CV033
      - CV034
      - CV037
      - CV039
  - id: TV006
    title: 最终尽调事项表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 分部经济模型
        - 按工作流拆分的抽佣率、毛利率、复购行为和支持成本
        - 真实盈利质量的核心决定因素
        - 管理账 + 财务尽调
      - - 治理 / 董事会
        - 董事会构成、投资者权利、接班梯队深度
        - 测算控制权风险和下行情形所必需
        - 董事会材料 + 法律尽调
      - - 国际队列
        - 按市场拆分的留存、CAC 和贡献利润率
        - 支撑全球选择权所必需
        - 增长 / 市场扩张复核
      - - 服务质量控制
        - 纠纷、取消和转介绍指标
        - 验证最高价值客户体验所必需
        - 运营尽调 + 合作伙伴记分卡
      - - 现金流和资产负债表明细
        - 现金、债务、营运资本，以及烧钱 / 现金生成情况
        - 入场纪律和稀释风险判断所必需
        - 财务尽调 + 律师复核
    notes: 这些事项是从战略兴趣走向可定价确信度所需的最低证据。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036
      - CV038
      - CV040
