companyProfile:
  summary: >-
    Bucketplace 总部位于首尔，旗下运营 Ohouse（오늘의집）。Ohouse 起步于室内灵感社区，后来扩展到带标签的商品交易、装修、搬家、安装、维修、高端品牌和 3D 房间规划工具。公开证据显示，公司在 2022
    年跻身独角兽，并在 2024 年以 KRW 287.9B 收入和首次年度营业利润显著降低了投资叙事风险。Ohouse
    看起来是少数在内容、交易和服务三条线上都有可见规模的韩国消费互联网公司之一，但公开记录仍留下几个关键问题：分部经济性、治理结构，以及这一模式在韩国以外真正可复制到什么程度。
