  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 客户工作流与产品模块地图
        blocks:
          - type: paragraph
            body: >-
              Ohouse 的产品不是单一
              SKU，而是一条协调好的客户工作流：从灵感开始，进入商品发现，最终可能落到购买、项目规划或承包商接洽。官网首页、项目信息流、指南入口、商店层、高端内容页面和专家市场共同呈现出一个模块化系统，而不是一个单体应用。用户可以浏览居家案例和自助装修建议，点进带标签商品，比较榜单产品，尝试
              3D 房间布局，申请透明装修报价，并管理搬家、维修、安装等相关服务。这种组合很重要，因为它能产生比纯零售目录更多的第一方行为信号。它也意味着，Ohouse
              的产品宽度必须同时支撑低摩擦浏览和高意图项目执行。产品成熟度看起来在内容发现和交易上最强；从尽调角度看，高端策展、厨房装修或扩张市场版本等更新的品牌化或重服务模块，仍应视为运营成熟度更早期。
