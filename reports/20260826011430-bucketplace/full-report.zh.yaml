      - number: '7.2'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              运营执行是最大的单一风险主题。Ohouse 已不只是给装饰品排序；它在协调目录、客服、报价请求、承包商、搬家、维修、安装，以及日益国际化的触点。这种复杂度意味着，小的数字故障可能叠加成信任故障。近期 App
              Store 评论已经显示，支付重置和 UI
              卡死触达了真实用户。服务侧，任何纠纷或糟糕承包商结果都可能比一次简单退货更具破坏性，因为家庭项目在情感和财务上都是高风险决策。安全和隐私则是另一个公开证据混杂的领域。ISMS
              认证有帮助，但公开来源没有披露围绕推荐或用户数据的详细架构、事故历史或隐私控制。因此，只有内部系统、支持运营和承包商质量流程显著强于公开记录所能确认的水平，Ohouse 的风险画像才算可控。
