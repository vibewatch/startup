      - number: '4.3'
        title: 单位经济性、资本充足性与仍缺失的信息
        blocks:
          - type: paragraph
            body: >-
              最难的财务问题不是 Ohouse 是否足够大，而是分部经济性是否耐久。公开来源没有披露毛利率、抽佣率、交易与服务的贡献利润率、营销效率、家庭重复购买经济性或现金生成能力。投资人因此无法判断 2024
              年盈利来自结构性更健康的单位经济性、临时效率提升，还是有利的业务组合效应。资本充足性看起来比几年前更好。Bucketplace 在 2022 年完成 $182M Series D
              轮，已经达到独角兽估值，如今又有公开盈利证明——这些因素在公司需要再次投入增长时，应能改善融资韧性。但如果没有公布现金余额、烧钱桥或营运资本披露，资本充足性仍无法直接用公开数据承保。与
              Coupang、Wayfair 等上市电商参照相比，Ohouse 的外部报告纪律很可能弱得多；这对私人公司很正常，但仍构成实质尽调限制。
