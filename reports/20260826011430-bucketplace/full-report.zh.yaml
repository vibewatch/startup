        title: 最终尽调问题、投资逻辑破坏触发点与退出准备度
        blocks:
          - type: paragraph
            body: >-
              最终是否投资，应取决于少数尚未回答的问题。第一，投资人需要按板块拆开看经济性：电商、广告、服务，以及较新的自有品牌或高端线，各自的抽佣率、毛利率、复购行为和客服负担。第二，需要看清治理：董事会构成、投资人权利、接班梯队，以及既往融资是否留下优先权压力。第三，国际化证据要足够硬，才能把可选性和叙事区分开——各市场的队列留存、CAC
              和贡献毛利率。退出准备有可取之处：Ohouse
              已经盈利，在所属品类里也足够重要；但信息披露质量落后于上市同行，全球化故事仍早，准备还不完整。要做高确信度投资，要么先补上这些缺口，要么价格已经充分补偿缺口。否则，审慎做法是选择性接触，而不是自动给出确信。
