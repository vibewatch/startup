  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与变现场景
        blocks:
          - type: paragraph
            body: >-
              Ohouse
              的变现方式更像分层消费平台，而不是单一零售商。官方页面和已报道的公司描述显示，它至少有四个收入引擎：从家具和家居用品交易中抽佣，在内容到交易闭环内出售广告或商品化展示位，从装修及相关上门服务中获取服务经济性，以及更新的自有品牌或高端货盘扩张。应用描述和公司页面还显示，搬家、维修、安装和
              3D
              规划等相邻变现场景也存在；这些业务今天未必都足够重大，但会加深变现可选项。财务上最重要的是，这些业务线很可能有截然不同的利润率结构。商品交易有履约和商家经济性；广告结构上应有更高利润率；服务撮合或承包商工作流客单价可能更高，但运营更复杂。公开记录足以概念性画出模式，但不足以量化业务线组合或贡献利润率。
