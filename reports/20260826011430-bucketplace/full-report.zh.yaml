      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景是，Ohouse
              的内容到交易飞轮、服务扩张和首年盈利，标志着一个耐久的韩国品类领导者进入早期阶段，未来可以把精选交易和部分服务工作流移植到海外。在这种情况下，私人尽调会揭示比公开记录显示更强的抽佣率、重复行为和贡献利润率。基准情景更保守：Ohouse
              仍是强大的国内平台，持续改善盈利能力，并选择性增长；但国际上行需要更长时间，在披露改善之前，业务只应相对 2022 年标记获得温和溢价。悲观情景不是公司崩盘，而是服务复杂度、利润率不透明或较弱的国际单位经济性，让
              2022 年独角兽估值显得已经很满。即便如此，Ohouse
              仍可能是一家好公司，却不是一个出色的新钱入场机会。由于公开记录无法干净判定这些情景，估值应表达为区间，而不是单点。估值也应明确绑定新一轮私人尽调能证明或推翻什么，而不是泛泛的品类热情。
