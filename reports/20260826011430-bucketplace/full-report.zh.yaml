      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              Ohouse
              看起来至少服务四类经济属性不同的买方旅程。第一类是灵感驱动型消费者：浏览照片、指南和可购物信息流，然后以相对低的决策摩擦购买家具或装饰品。第二类是小空间优化者——在韩国城市公寓市场很常见——他们看重模块化、省空间和多功能家具，这也是
              Statista 强调的模式。第三类是意图更强的装修客户，他们在承诺更大项目之前，需要发现承包商、拿到透明报价和服务保障。第四类是高端或追求品牌的客户，可能更适合由 Binaryshop 这类精选货盘，或
              Ohouse
              美国门店上的进口韩国设计产品来服务。预算通常由家庭掌握，但采用路径因使用场景而异：简单交易可以从灵感和标签开始，装修则需要信任、报价和线下执行。这里的关键在于，用户可以低成本地通过内容或小篮子交易进入，之后再迁移到高客单服务时，Ohouse
              的交叉销售逻辑最强。反过来，平台也暴露在不同分层的服务预期下：从快速商品履约，到承包商协调和设计规划，要求完全不同。
