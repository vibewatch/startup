    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与家庭旅程
        blocks:
          - type: paragraph
            body: >-
              Ohouse 服务的是家庭，而不是采购团队，但客户群并不同质。公开产品与页面暗示至少五类反复出现的分层：浏览家居案例和指南的灵感驱动型用户；通过带标签交易转化的装饰或家具购物者；购买产品前先消费教程内容的 DIY
              或自助装修用户；进入高客单装修工作流的业主；以及使用美国门店的国际购物者或韩国设计爱好者。同一个家庭可以随时间在这些状态之间切换，这是一项有意义的战略优势，因为发现、购买和项目执行都在同一个应用里完成。这个旅程横跨项目信息流、建议中心、可购物内容、榜单页面和专家市场。客户价值因此不只来自总下载量，还来自在不同家居生命周期节点重新触达一个家庭的能力：浏览灵感、布置房间、搬家，或管理翻新。最大的缺口不是识别这些分层，而是用公开来源量化每个分层对收入和留存的贡献。
