      - number: '6.2'
        title: 增长、采用轨迹与公开规模证明
        blocks:
          - type: paragraph
            body: >-
              最清楚的客户规模故事是，Ohouse 在尝试全球延伸前，已经先在韩国形成全国性影响力。TechCrunch 和 Forbes 均称，Ohouse 在 2022 年增长阶段前后累计下载超过 20M，月活用户
              10M。Chosun 后来报道 2024 年 MAU 为 10M；2025 年一份合作伙伴公告则称累计下载超过 30M。Apple 元数据显示，2026 年 8 月，韩国 iOS 应用已有近 700,000
              个评分；AppBrain 估计 Android 下载约
              19M，这给出强直接证据：独角兽融资期之后，用户参与并未消失。产品内部也有公开参与度证明：指南拥有高浏览量，可购物信息流持续产生商业触点，今日特价或榜单页面暗示重复购物行为频繁。这些信号不同于经审计留存数据，但足以说明
              Ohouse 像一个已具规模的消费者平台，而不是小众设计社区。
