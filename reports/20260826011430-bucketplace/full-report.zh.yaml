  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合与重叠逻辑
        blocks:
          - type: paragraph
            body: >-
              Ohouse 没有一个干净对应的单一对手，因为它同时横跨内容、零售和服务。概念上最接近的是 Houzz，后者同样把设计灵感与装修、家庭决策支持结合起来。IKEA Korea、Hanssem 和 Hyundai
              Livart 代表更传统的家具和家居用品竞争者，实体零售或品牌积淀更强。Coupang 是最强的横向数字替代，因为它可以在更大的市场中吸收家居用品需求，并配合快速物流。Wayfair
              比直接韩国对手更适合作为全球参照：它说明纯线上家居零售商可以做到多大，但缺少 Ohouse 在韩国的社区驱动身份和服务市场角度。这个碎片化竞争场对 Ohouse
              有利，因为没有一个对手能完整复制它的工作流；但也意味着 Ohouse 会被物流更强、品牌预算更深或品类专注度更高的玩家从多个方向攻击。这种多方向压力是投资判断的核心。
            claimRefs:
