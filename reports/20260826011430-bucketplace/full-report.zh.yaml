      - number: '4.2'
        title: 当前规模、增长与盈利证据
        blocks:
          - type: paragraph
            body: >-
              核心公开财务数据点如今在多个来源之间一致：Bucketplace 报告 2024 年收入 KRW 287.9B，并实现约 KRW 570M 营业利润，标志着成立以来首次年度营业利润。Chosun 和 Seoulz
              都呈现了这一叙事，相关报道还把它归因于电商变现、广告和服务扩张的组合。Business Wire 和 Forbes 此前把 Ohouse 描述为高 GMV 平台，2022 年 Series D 轮前后年化 GMV
              约为 $1.7B。Seoulz 后来称管理层 2024 年目标 GMV 超过 KRW 2T，Chosun 则称仅室内服务交易额累计就超过 KRW
              1T。这些数字都不能替代经审计报表，但合在一起指向一家有相当交易吞吐、且至少证明过一年运营纪律的公司。与仍完全依赖资本市场续命的典型私人消费独角兽相比，Ohouse 明显更强。
