      - number: '8.2'
        title: 估值背景、既往标记与入场纪律
        blocks:
          - type: paragraph
            body: >-
              最具体的公开估值背景仍是 2022 年 Series D 轮。TechCrunch 和 Tracxn 将该轮聚集在约 $1.4B 估值附近，Forbes 则报道约 $1.6B。按 2024 年收入约 KRW
              287.9B，并采用用户提供的 USD 换算基线计算，这意味着历史估值 / 收入倍数大致落在约 6.5x 至
              7.4x。对一家已具规模、已盈利且仍在增长的品类领导者来说，这并非自动不合理；但考虑到业务组合、利润率和重复行为仍不透明，也不能说明显便宜。公开可比公司只能提供方向性帮助：CompaniesMarketCap
              显示，2026 年 8 月 Coupang 市值约 $30B，Wayfair 约 $14.31B，说明电商在公开市场能做出的结果规模；而它们提交 SEC
              文件的上市公司身份，也提醒我们这些企业披露多得多。投资含义是，Bucketplace 很可能可以继续支撑私人市场相关性，但入场价格纪律比叙事兴奋更重要。
