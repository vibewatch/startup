      - CV031
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 国内领导地位延续，服务质量强，国际精选电商选择性扩张，利润率改善
        - 估值可显著高于此前独角兽区间；优于公开口径的经济模型支撑溢价
        - 执行摊子过大和全球复杂度
        - 可能发生，但需要私有证据
      - - 基准
        - 国内平台强劲，盈利能力稳步改善，选择性扩张，治理小幅改善
        - 估值集中在此前独角兽区间附近或略高
        - 披露仍不完整；上行空间主要来自国内
        - 公开证据下最站得住脚
      - - 悲观
        - 2024 年盈利被证明脆弱，服务复杂度压缩利润率，全球队列令人失望
        - 估值跌破此前独角兽区间；新股回报被压缩
        - 利润率不透明、复购弱、扩张成本高
        - 若私有指标不及预期，该情景可信
    notes: 这些情景锚定公开证据和明确披露缺口，不追求虚假的精确度。
    claimRefs:
