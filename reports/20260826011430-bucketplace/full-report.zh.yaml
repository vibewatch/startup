  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Ohouse 面向的相关市场既不是泛电商，也不是整个建筑经济。公开来源显示，Bucketplace 位于家居灵感媒体、家具与装饰零售、家装规划和承包商匹配的交叉点。Statista
              的韩国家具展望有参考价值，因为它明确把面向消费者销售的家具、灯具、照明和家居装饰纳入统计，覆盖客厅、卧室、厨房、浴室、户外和居家办公等使用场景。Ohouse
              自身页面又在这个消费支出边界上叠加装修报价、安装、维修、搬家服务和 3D 规划工具，因此平台不只和家具零售商竞争，也和发现优先的设计平台以及碎片化线下承包商竞争。现状替代方案包括去 IKEA
              Korea、Hanssem 等实体家具店，去 Coupang 等通用市场购物，靠搜索和博客找灵感，或绕过市场中介直接雇本地承包商。需要明确排除的市场是：Ohouse 似乎不拥有一手住宅建设、房地产经纪或大规模
              B2B 建材采购。因此，最合适的分析框架不是泛建筑 TAM，而是一个消费者家居生活与家装需求层，并带有相邻的服务撮合经济性。
