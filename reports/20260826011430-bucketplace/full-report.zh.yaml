      - number: '1.2'
        title: 创始人领导力、公开治理轮廓与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              公开领导层证据高度集中在创始人兼 CEO Seungjae Lee 身上，这既是优势，也是尽调缺口。Bucketplace 的团队文化页面将 Lee 标注为代表董事，Business
              Wire、Forbes、TechCrunch 和 RocketReach 也都称其为创始人兼 CEO。Forbes 还补充了有用背景：Lee 毕业于 Seoul National
              University，受过化学和电气工程训练，并把个人对室内设计的兴趣转化为公司的核心产品命题。创始人连续性很重要，因为 Ohouse 的战略看起来仍然强产品驱动：近期官方文章聚焦搜索与推荐产品负责制、UX
              研究、服务平台架构和神经渲染，说明公司仍在投入差异化发现能力，而不只是做零售运营。弱点在于，Bucketplace
              没有公开披露详细董事会名单或完整高管梯队。现有证据足以说明创始人仍处中心位置，但不足以评估治理独立性、正式投资人董事权利，或 Lee
              退居幕后后下一层管理团队是否足够制度化。这给公司留下清晰的关键人物集中风险，因为其公开叙事、融资历史和全球扩张计划仍强烈绑定一位创始人。
