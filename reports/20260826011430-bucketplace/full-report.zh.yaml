    title: 估值 / 回报区间
    type: range
    summary: 公开证据只能支撑围绕上一轮独角兽估值带的宽区间，不能给出精准点估值。
    data:
      items:
        - label: 悲观估值区间
          low: 1
          high: 1.3
          unit: $B
          note: 利润韧性不足，服务经济性偏弱，全球上行空间打折
        - label: 基准估值区间
          low: 1.4
          high: 1.8
          unit: $B
          note: 上一轮独角兽估值带，加上对 2024 年盈利的温和溢价
        - label: 乐观估值区间
          low: 1.9
          high: 2.4
          unit: $B
          note: 需要隐藏利润率强、复购质量好，并在重点海外市场打赢
