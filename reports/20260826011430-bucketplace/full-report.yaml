chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform scope, and business model
        blocks:
          - type: paragraph
            body: >-
              Bucketplace is the Seoul-based company behind Ohouse, a lifestyle super-app built around the idea that
              home inspiration, discovery, transaction, and execution should live in one workflow. The company’s English
              corporate site and app-store descriptions consistently describe a chain that starts with user-generated
              inspiration, routes into tagged commerce, and expands into higher-friction services such as remodeling,
              moving, installation, and repair. Official pages show the company was incorporated in July 2014 and
              launched Ohouse Store in 2016; independent reporting says the service initially emerged from a community
              where users shared interior photos and later evolved into a content-to-commerce engine. That origin still
              matters strategically: rather than selling furniture through search alone, Ohouse lets users browse homes,
              identify tagged items, request interior quotes, and book home services inside the same ecosystem. The
              current product surface also includes Binaryshop for premium brands, transparent-estimate remodeling,
              direct-installation and repair services, and 3D room simulation. Ohouse’s U.S. web presence and shop pages
              indicate that the company is now testing a translated version of the same inspiration-plus-commerce model
              outside Korea, rather than exporting only a single retail vertical.
