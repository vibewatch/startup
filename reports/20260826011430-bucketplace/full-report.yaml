            body: >-
              Operational execution is the single biggest risk theme. Ohouse is no longer just ranking decor items; it
              is coordinating catalogs, support, quote requests, contractors, moving, repair, installation, and
              increasingly international surfaces. That complexity means small digital failures can compound into trust
              failures. Recent App Store reviews already show payment resets and UI freezes reaching real users. On the
