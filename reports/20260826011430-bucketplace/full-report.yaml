  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis, anti-thesis, and recommendation logic
        blocks:
          - type: paragraph
            body: >-
              The core thesis for Bucketplace is straightforward: Ohouse has built a scaled Korean home-living platform
              with visible network effects across inspiration content, commerce, and services; it is no longer just a
              growth story because 2024 brought both meaningful revenue and first annual operating profit. That
              combination is rare and valuable in consumer internet. The anti-thesis is equally important: public
              evidence still leaves major blind spots on margin quality, repeat economics, board governance, and the
              true portability of the model outside Korea. A business can be good and still be a poor investment at the
              wrong price or under weak governance terms. The right recommendation therefore is not a reflexive pass or
              buy. It is a conditional invest / flag stance: strong enough to deserve serious diligence and potentially
              attractive at disciplined entry, but not supported well enough by public evidence to justify a big step-up
              from prior unicorn marks.
