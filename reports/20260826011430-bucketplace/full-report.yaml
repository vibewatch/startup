              because home projects are emotionally and financially high stakes. Security and privacy are another area
              where public evidence is mixed. ISMS certification helps, but public sources do not disclose detailed
              architecture, incident history, or privacy controls around recommendation or user data. Ohouse’s risk
              profile therefore looks manageable only if internal systems, support operations, and contractor-quality
