companyProfile:
  summary: >-
    Bucketplace is the Seoul-based company behind Ohouse (오늘의집), a home-living platform that started as a community for
    interior inspiration and expanded into tagged commerce, remodeling, moving, installation, repair, premium brands,
    and 3D room-planning tools. Public evidence shows the company reached unicorn status in 2022 and materially
    de-risked its story in 2024 with KRW 287.9B revenue and its first annual operating profit. Ohouse appears to be one
    of the few Korean consumer internet companies with visible scale across content, commerce, and services, but the
    public record still leaves key questions on segmented economics, governance structure, and the true portability of
    the model outside Korea.
