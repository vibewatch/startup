      - number: '4.3'
        title: Unit economics, capital adequacy, and what is still missing
        blocks:
          - type: paragraph
            body: >-
              The hardest financial problem is not whether Ohouse is large; it is whether its economics are durable by
              segment. Public sources do not disclose gross margin, take rate, contribution margin by commerce versus
              services, marketing efficiency, household repeat-rate economics, or cash generation. That leaves investors
              unable to tell whether 2024 profitability came from structurally healthier unit economics, temporary
              efficiency gains, or favorable mix effects. Capital adequacy looks better than it did a few years ago.
              Bucketplace raised a $182 million Series D in 2022, had already reached unicorn valuation, and now has a
              public profitability proof point—factors that should improve financing resilience if growth investment is
              needed again. Yet without a published cash balance, burn bridge, or working-capital disclosures, capital
              adequacy still cannot be underwritten directly from public data. Compared with public ecommerce benchmarks
              like Coupang and Wayfair, Ohouse likely operates with far less external reporting discipline, which is
              normal for a private company but still a real diligence limitation. materially.
