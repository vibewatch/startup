  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams and monetization surfaces
        blocks:
          - type: paragraph
            body: >-
              Ohouse monetizes more like a layered consumer platform than a single retailer. Official surfaces and
              reported company descriptions indicate at least four revenue engines: commerce take from furniture and
              home-goods transactions, advertising or merchandised placement inside the content-to-commerce loop,
              service economics from remodeling and related home services, and newer owned-brand or premium assortment
              expansion. The app description and company pages also show adjacent value surfaces such as moving, repair,
              installation, and 3D planning, which may not all be individually material today but deepen monetization
              optionality. What is most important financially is that these lines likely carry very different margin
              structures. Product commerce has fulfillment and merchant economics; advertising should be structurally
              higher margin; and service brokerage or contractor workflows may be higher ticket but operationally
              messier. The public record is enough to map the model conceptually, but not enough to quantify
              business-line mix or contribution margins.
