  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set and overlap logic
        blocks:
          - type: paragraph
            body: >-
              Ohouse does not have one clean rival because it sits across content, retail, and services simultaneously.
              The closest conceptual competitor is Houzz, which also combines design inspiration with remodeling and
              home-decision support. IKEA Korea, Hanssem, and Hyundai Livart represent more traditional furniture and
              home-furnishing competitors with stronger physical-retail or brand heritage. Coupang represents the
              strongest horizontal digital substitute because it can absorb home-goods demand inside a much larger
              marketplace and pair it with fast logistics. Wayfair is a more useful global benchmark than a direct
              Korean rival: it shows how large a pure-play online home retailer can become, but it lacks Ohouse’s
              community-led Korean identity and service-marketplace angle. This fragmented field helps Ohouse because no
              single competitor fully duplicates its workflow, but it also means Ohouse can be attacked from multiple
              directions by players with stronger logistics, deeper brand budgets, or more focused category expertise.
              This multidirectional pressure is central to the investment case.
