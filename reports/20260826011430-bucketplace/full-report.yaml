      - number: '4.4'
        title: What the current financial readout does and does not prove
        blocks:
          - type: paragraph
            body: >-
              The right financial conclusion is balanced. Ohouse has clearly crossed an important credibility threshold
              by producing first annual operating profit in 2024 while maintaining broad consumer scale and service
              activity. That likely reflects real product-market fit and cost discipline. It does not, however, prove
              that every major line of business is attractive or that the company is already optimized for international
              expansion. Profitability in a single year can still coexist with weak cash conversion, thin take rates, or
              high volatility in service-driven cohorts. Public comparisons to larger public peers also cut both ways:
              they show that home-commerce can be scaled into very large businesses, but they also remind investors how
              cyclical and execution-sensitive the category can be. Ohouse therefore looks financially investable, but
              only with a strong follow-on diligence focus on line-item quality rather than topline momentum alone.
