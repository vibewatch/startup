      - number: '2.3'
        title: Buyer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >-
              Ohouse appears to serve at least four economically distinct buyer journeys. The first is the
              inspiration-led consumer who browses photos, guides, and shoppable feeds, then buys furniture or decor
              items with relatively low consideration friction. The second is the small-space optimizer—common in South
              Korea’s urban apartment market—who values modular, space-efficient, and multifunctional furnishings, a
              pattern emphasized by Statista. The third is the higher-intent remodeling customer who wants contractor
              discovery, transparent estimates, and service guarantees before committing to a larger project. The fourth
              is a premium or brand-seeking customer who may be better served by curated assortments such as Binaryshop
              or by imported Korean-design products on Ohouse’s U.S. storefront. Budget ownership usually sits with the
              household, but the adoption path differs by use case: simple commerce can start with inspiration and tags,
              while remodeling requires trust, quotes, and offline execution. This matters because Ohouse’s cross-sell
              logic is strongest when a user can enter cheaply through content or small-basket commerce and later move
              into higher-ticket services. It also means the platform is exposed to very different service expectations
              across segments, from quick product fulfillment to contractor coordination and design planning.
            claimRefs:
