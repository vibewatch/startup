      - number: '1.4'
        title: Scale metrics, profitability milestone, expansion path, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The clearest recent milestone is financial: Chosun and Seoulz both report that Bucketplace generated KRW
              287.9 billion of revenue in 2024, up 22.3% year over year, and produced roughly KRW 570 million of
              operating profit—its first annual operating profit since founding. Those sources also tie the improvement
              to a maturing monetization mix, especially advertising, product sales, and growing interior-service
              throughput. Chosun adds two especially important scale datapoints: Ohouse had 10 million monthly active
              users in 2024, and cumulative transaction volume for interior-design services exceeded KRW 1 trillion
              after doubling during 2024. Company-linked sources paint a broader but more promotional scale picture:
              Business Wire and Forbes say a furniture item was being purchased every seven seconds around the 2022
              Series D, while the 2025 InHouse announcement claims 30 million installs and about $5 billion in
              cumulative transaction volume. AppBrain and the iOS App Store confirm that the app remains heavily used in
              2026, with tens of millions of Android downloads, almost 700,000 iOS ratings, and frequent releases. The
              official milestone page shows a steady broadening of the business from store launch (2016) to remodeling
              (2019), information-security certification (2021), unicorn designation (2022), Binaryshop (2023), offline
              showroom and in-house kitchen remodeling brand (2025), and a remodeling consultation lounge (2026). The
              main adverse signals are softer than existential: recent iOS reviews include complaints about checkout
              resets and UI freezes, and public sources still leave board composition, exact headcount, and
              country-level revenue mix opaque.
