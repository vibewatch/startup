  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer workflow and product module map
        blocks:
          - type: paragraph
            body: >-
              Ohouse’s product is not a single SKU. It is a coordinated customer workflow that starts with inspiration,
              moves into product discovery, and can end in purchase, project planning, or contractor engagement. The
              official homepage, projects feed, guide surfaces, store layer, premium content pages, and experts
              marketplace show a modular system rather than a monolithic app. Users can browse home tours and
              self-interior advice, click into tagged items, compare ranked products, experiment with 3D room layouts,
              request transparent remodeling estimates, and manage related services such as moving, repair, and
              installation. That combination matters because it creates more first-party behavioral signals than a
              retailer-only catalog would collect. It also means Ohouse’s product breadth has to support both
              low-friction browsing and high-intent project execution. Product maturity appears strongest in content
              discovery and commerce, while some newer branded or service-heavy modules—such as premium curation,
              kitchen remodeling, or expansion-market variants—should still be treated as earlier in operational
