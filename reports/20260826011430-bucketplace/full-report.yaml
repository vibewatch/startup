  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market for Ohouse is not generic e-commerce and not the full construction economy. Public
              sources show Bucketplace sits at the intersection of home inspiration media, furniture and decor retail,
              home-improvement planning, and contractor matching. Statista’s South Korea furniture outlook is useful
              because it explicitly includes furniture, lamps, lighting, and home decor sold to consumers across living
              room, bedroom, kitchen, bathroom, outdoor, and home-office use cases. Ohouse’s own pages extend that
              consumer-spend boundary by layering in remodeling quotes, installation, repairs, moving services, and 3D
              planning tools, which means the platform competes not only with furniture retailers but also with
              discovery-first design platforms and fragmented offline contractors. Status-quo substitutes therefore
              include visiting physical furniture stores such as IKEA Korea and Hanssem, shopping generic marketplaces
              such as Coupang, relying on search and blogs for inspiration, or hiring local contractors directly without
              a marketplace intermediary. The excluded market should be explicit: Ohouse does not appear to own primary
              home construction, real-estate brokerage, or large-scale B2B building materials procurement. That makes
              the best analytical frame a consumer home-living and home-improvement demand layer with adjacent
              service-brokerage economics rather than a general construction TAM.
