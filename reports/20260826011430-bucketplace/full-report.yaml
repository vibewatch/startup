      - number: '3.3'
        title: Moat durability and competitive risk register
        blocks:
          - type: paragraph
            body: >-
              Ohouse’s moat looks strongest where content, data, and service orchestration reinforce each other. A large
              user-generated inspiration corpus can improve discovery, recommendations, and conversion; commerce and
              services then generate more user behavior and more homes to feature. This creates a more defensible loop
              than a static furniture store can easily match. But Ohouse’s moat is weaker where competitors can
              substitute with brute-force strengths: Coupang can win on logistics and convenience, IKEA or Hanssem can
              win on furniture brand trust, and Houzz-like platforms can challenge the inspiration-plus-remodeling
              narrative internationally. The service layer is particularly double-edged. It increases wallet share and
              differentiation, but also exposes Ohouse to quality-control failures that can damage trust faster than a
              missed retail order. Competitive durability therefore depends less on novelty and more on whether Ohouse
              can keep the content-to-commerce flywheel working while avoiding service breakdowns and proving
              cross-border portability.
