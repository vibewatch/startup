              - CV026
      - number: '8.4'
        title: Final diligence asks, thesis-break triggers, and exit readiness
        blocks:
          - type: paragraph
            body: >-
              The final investment call should hinge on a short list of unanswered questions. First, investors need
              segmented economics: take rate, gross margin, repeat behavior, and support burden across commerce,
              advertising, services, and newer owned-brand or premium lines. Second, they need governance clarity: board
              composition, investor rights, succession depth, and any preference overhang from prior rounds. Third, they
              need international evidence strong enough to justify optionality rather than storytelling—cohort
              retention, CAC, and contribution margin by market. Exit readiness is promising because Ohouse is now
              profitable and category-relevant, but still incomplete because disclosure quality lags public peers and
              the global story is early. A high-conviction investment would require those gaps to close or a price that
              already compensates for them. Without that, the prudent stance is selective engagement rather than
              automatic conviction.
            claimRefs:
