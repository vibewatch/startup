      - number: '4.2'
        title: Current scale, growth, and profitability evidence
        blocks:
          - type: paragraph
            body: >-
              The core public financial datapoint is now consistent across multiple sources: Bucketplace reported KRW
              287.9 billion of revenue in 2024 and produced approximately KRW 570 million of operating profit, marking
              its first annual operating profit since founding. Chosun and Seoulz both present that narrative, while
              related reporting ties it to a mix of ecommerce monetization, advertising, and services expansion.
              Business Wire and Forbes previously framed Ohouse as a high-GMV platform, with annualized GMV of about
              $1.7 billion around the 2022 Series D. Seoulz later said management was targeting more than KRW 2 trillion
              of GMV in 2024, and Chosun said interior-services transaction volume alone exceeded KRW 1 trillion
              cumulatively. None of these numbers substitute for audited statements, but together they imply a business
              with meaningful transaction throughput and at least one demonstrated year of operating discipline. That
              makes Ohouse notably stronger than a typical private consumer unicorn still relying entirely on capital
