        title: Expansion vectors and concentration risks
        blocks:
          - type: paragraph
            body: >-
              Customer upside and customer risk are tightly linked for Ohouse. The upside is that customer acquisition
              can compound across multiple needs: a user who starts with inspiration may later furnish an apartment,
              then request moving or repair services, and eventually run a remodeling project. Internationally, Ohouse
              can probably extend inspiration and curated commerce faster than contractor-heavy service layers; the
              localization posts suggest management understands this. The risks are equally clear. Customer
              concentration almost certainly remains heavily Korea-centric because the strongest public usage metrics
              come from the domestic app. Large-ticket service demand is likely more cyclical and quality-sensitive than
              browsing or smaller-basket commerce, and the company does not publicly disclose cohort retention, category
              concentration, or geography mix. If Ohouse’s most profitable cohorts come from a narrow set of categories
