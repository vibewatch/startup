        title: Customer segments and the household journey
        blocks:
          - type: paragraph
            body: >-
              Ohouse serves households rather than procurement teams, but its customer base is not homogeneous. Public
              surfaces suggest at least five recurring segments: inspiration-led browsers exploring house tours and
              guides; decor or furnishing shoppers converting through tagged commerce; DIY or self-interior users
              consuming how-to content before purchasing products; homeowners entering higher-ticket remodeling
              workflows; and international shoppers or Korean-design enthusiasts using the U.S. storefront. The same
              household can move among these states over time, which is a meaningful strategic advantage because
              discovery, purchase, and project execution all live in one app. That journey is visible across the
              projects feed, advice hub, shoppable content, rankings pages, and experts marketplace. Customer value
              therefore comes not only from gross downloads but from the ability to re-engage a household through
              different home-lifecycle moments: browsing inspiration, furnishing a room, moving homes, or managing a
              renovation. The biggest gap is not identifying the segments; it is quantifying the revenue and retention
              contribution of each segment from public sources.
