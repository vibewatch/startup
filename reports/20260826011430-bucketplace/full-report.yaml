  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk surfaces
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not show current litigation or enforcement actions against Bucketplace in accessible
              sources, which is constructive. But the absence of visible legal trouble should not be confused with low
              legal exposure. Ohouse operates in consumer commerce, payments, personal-data handling, contractor
              matching, and home-improvement workflows, all of which create meaningful consumer-protection and dispute
              risk if execution slips. The official chronology’s ISMS certification is a helpful positive signal, yet it
              is only a baseline proof of process maturity rather than a full legal shield. Because the company also
              intermediates quotes and contractor relationships, misrepresentation, refund disputes, or service-quality
              complaints could become regulatory or legal issues even if they first appear as customer-support problems.
              The legal-risk conclusion is therefore moderate rather than acute: no red flag is visible publicly, but
              the business model creates multiple potential points of consumer complaint and regulatory attention.
              Public policy surfaces exist, but complaint and incident data remain opaque.
