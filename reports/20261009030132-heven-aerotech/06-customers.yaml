callouts:
  - calloutType: "risk"
    title: "Procurement Access vs. Committed Program Funding"
    body: "Inclusion on the DIU Blue UAS Select list and receipt of an Army Basic Ordering Agreement are essential prerequisites for federal adoption, but they are not equivalent to multi-year program-of-record funding. Investors and underwriting partners must verify whether task orders under the BOA are actively converting into funded delivery milestones."
    claimRefs:
      - "CU008"
      - "CU009"
      - "CU013"
  - calloutType: "insight"
    title: "Hydrogen Ground Logistics as Customer Expansion Constraint"
    body: "Heven's customer expansion depends as much on hydrogen fueling availability as on airframe flight performance. While a 10-hour flight endurance is highly compelling for persistent ISR, field adoption across austere forward operating locations requires repeatable hydrogen generation, safe storage, and mobile refueling infrastructure."
    claimRefs:
      - "CU002"
      - "CU006"
      - "CU014"
