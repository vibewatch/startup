company:
  name: "Heven AeroTech"
chapter:
  number: 6
  title: "Customers"
  summary: "Heven AeroTech's customer traction is anchored by high-visibility defense positioning—notably an Army Basic Ordering Agreement, Blue UAS Select status for its Z1 platform, and a 56,000-square-foot production facility in Winchester, Virginia—yet verifiable production adoption remains heavily shielded behind procurement access mechanisms. While the company targets defense ISR, tactical logistics, emergency response, and critical infrastructure, the public diligence record contains zero disclosed customer counts, ARR, NRR, or repeat-order volumes, leaving substantial adoption and concentration risks for institutional underwriting."
sections:
  - id: "customer-segmentation"
    title: "Customer Base Segmentation and Target Demand"
    body: "Heven AeroTech segments its target market across national security defense agencies, civilian emergency and public safety authorities, and critical infrastructure inspection operators. The primary paying customer segment is the federal defense sector, represented by the U.S. Army, U.S. Special Operations Command (USSOCOM), combatant commands, and allied armed forces requiring long-endurance, runway-independent unmanned aerial systems (UAS) for persistent intelligence, surveillance, reconnaissance (ISR), and tactical logistics. Secondary commercial and humanitarian segments encompass disaster response, aerial firefighting, environmental monitoring, and perimeter security where runway independence and extended airborne persistence are critical. However, commercial adoption remains primarily positioning rather than quantified operating revenue, with defense relationships acting as the central demand driver."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory"
    title: "Adoption Trajectory and Manufacturing Industrialization"
    body: "The adoption trajectory of Heven AeroTech has transitioned from early prototyping in Israel to accelerated industrial deployment within the United States. To meet federal defense requirements, the company expanded its full-time workforce from 38 employees at year-end 2025 to 88 by mid-2026 (a 132% increase) and stood up a 56,000-square-foot production plant in Winchester, Virginia, in just 90 days. The facility establishes East Coast manufacturing for the Z1 platform and serves as the operational model for a planned nationwide production network. Despite these substantial capacity investments, operational adoption metrics such as flight hours under operational payload, delivered airframe volume, and active customer account totals remain undisclosed, preventing definitive confirmation of fleet-scale deployment beyond pre-procurement evaluations."
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
    tableRefs:
      - "TU002"
  - id: "named-customer-proof"
    title: "Named Customer Proof and Defense Procurement Vehicles"
    body: "Publicly identifiable customer proof centers on formal government procurement access and strategic distribution channels rather than conventional enterprise SaaS or commercial sales. The flagship Z1 hydrogen VTOL UAS achieved DIU Blue UAS Select inclusion, validating the platform against strict Department of Defense cybersecurity, component provenance, and mission readiness standards. In addition, Heven secured a U.S. Army Basic Ordering Agreement (BOA) and established a distribution partnership with defense logistics specialist SupplyCore. Although a BOA provides an authorized contractual conduit for federal task orders, it does not guarantee appropriated funding or binding purchase commitments, leaving exact backlog, order values, and delivery schedules unverified."
    claimRefs:
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU003"
  - id: "retention-and-concentration"
    title: "Contract Durability, Retention, and Concentration Vulnerabilities"
    body: "Evaluating customer retention and revenue durability is severely constrained by private defense-market opacity. Core recurring metrics—including Net Revenue Retention (NRR), Gross Revenue Retention (GRR), cohort renewal rates, and average contract values—are absent from public disclosures. Furthermore, customer concentration risk is exceptionally high: Heven’s near-term revenue trajectory is disproportionately exposed to U.S. Army program appropriations, task order issuances under its BOA, and defense spending cycles. Durability is further tied to hydrogen field support logistics; if austere fuel supply chains or fuel-cell field maintenance prove economically or logistically impractical, end-user renewal and expansion across frontline operating units could stall."
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
