callouts:
  - calloutType: "insight"
    title: "Hydrogen Market Viability Hinges on Whole-Product Logistics"
    body: "In the unmanned systems sector, selling an airframe with superior endurance is insufficient to capture recurring spend if fueling infrastructure is neglected. Heven AeroTech's strategic inclusion of hydrogen generation, safe storage, and mobile trailer support addresses the primary barrier preventing commercial and military operators from adopting hydrogen technology. Customer willingness to deploy Heven's Z1 or Raider depends directly on whether these ancillary support systems eliminate the operational friction of sourcing industrial hydrogen."
    claimRefs:
      - "CM002"
      - "CM007"
      - "CM015"
  - calloutType: "risk"
    title: "Valuation Divergence from Commercial Procurement Reality"
    body: "Heven AeroTech's $1 billion post-money valuation following its Series B round reflects strong venture capital and strategic enthusiasm for sovereign defense technology and quantum integration. However, tangible public procurement records show adoption is still in prototype demonstration and initial basic ordering agreement phases. Without audited disclosures of recurring commercial fleet sales or large-scale multi-year production contracts, there is significant risk of valuation compression if defense task-order conversions lag."
    claimRefs:
      - "CM008"
      - "CM010"
      - "CM016"
