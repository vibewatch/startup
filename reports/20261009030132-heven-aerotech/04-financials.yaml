      - [Advanced and quantum-enabled systems, "Funded product-development priority", "Feature, integration, or program milestone; not disclosed", null, "No disclosed revenue contribution", "Provide contracted versus internally funded roadmap spend and associated customer commitments"]
    notes: "Partial public-evidence map as of 2026-10-09; null means no monetary value was disclosed, and mechanisms are not treated as confirmed accounting revenue streams."
    claimRefs: [CI002, CI008, CI009, CI010, CI011]
  - id: TI002
    title: Pricing and monetization disclosure
    columns: [Offering, Price, Unit or contract model, List versus realized, Discounts or unknowns, Source status]
    rows:
      - [Z1 and other aircraft platforms, null, "Not publicly disclosed", "Neither list nor realized pricing disclosed", "Volume, configuration, acceptance, and discount terms unknown", "Assigned official and independent sources"]
      - [Hydrogen generation and logistics, null, "Not publicly disclosed", "No standalone price disclosed", "Bundling, reimbursement, fuel, and service terms unknown", "Company financing announcement"]
      - [Deployment and field support, null, "Not publicly disclosed", "No service rate disclosed", "Duration, utilization, renewal, and pass-through terms unknown", "Company descriptions and careers evidence"]
      - [Advanced systems and integrations, null, "Not publicly disclosed", "No feature or integration price disclosed", "Customer funding, milestones, and intellectual-property terms unknown", "Company financing announcement"]
    notes: "Null prices mean unavailable in the eight assigned source texts, not zero; no list-price observation is used as realized revenue."
    claimRefs: [CI008, CI009, CI010]
  - id: TI003
    title: Unit economics and capital-efficiency diligence matrix
    columns: [Metric, Public value, Confidence, Why it matters, Specific diligence request]
    rows:
      - [Revenue and recurring revenue, null, "High confidence that assigned sources do not disclose it", "Establishes commercial scale and revenue quality", "Monthly recognized revenue by product, customer, and contract type; reconcile any ARR definition"]
      - [Funded backlog and conversion, null, "High confidence that assigned sources do not disclose it", "Separates procurement access from funded demand", "Task orders, funded backlog, cancellations, delivery schedule, and acceptance history"]
      - [Gross margin, null, "High confidence that assigned sources do not disclose it", "Tests whether production scale improves economics", "Gross margin bridge by platform including labor, materials, hydrogen, warranty, and field support"]
      - [Aircraft and hydrogen-system unit cost, null, "No public cost data", "Determines contribution margin and learning curve", "Bill of materials, direct labor hours, yield, rework, scrap, and supplier commitments by production lot"]
      - [Sales efficiency and payback, null, "No public CAC or cycle data", "Measures cost and duration of defense capture", "Pipeline conversion, bid cost, sales cycle, CAC proxy, contribution margin, and payback by buyer class"]
      - [Working capital and capex, null, "No public balance or commitment data", "Quantifies cash absorbed by facilities and inventory", "Inventory days, receivable milestones, payables, deposits, capex paid, and remaining facility commitments"]
      - [Cash burn and runway, null, "No public cash-flow data", "Determines financing dependency and next-round timing", "Monthly cash balance, operating and investing cash outflow, restricted cash, debt, and base/downside runway"]
    notes: "All nulls are explicit evidence gaps in the assigned public pool; confidence describes disclosure status, not confidence in the underlying economic performance."
    claimRefs: [CI003, CI004, CI005, CI006, CI007, CI010, CI011, CI012, CI015]
