        - {id: acceptance, label: Delivery and acceptance, detail: "Delivery counts, acceptance timing, and cancellation history are not disclosed."}
        - {id: revenue, label: Recognized revenue, detail: "Revenue, recurring revenue, mix, and recognition policy are not disclosed."}
        - {id: gross-profit, label: Gross profit, detail: "Materials, labor, hydrogen, warranty, field-support cost, and gross margin are not disclosed."}
    approximationNotes: "Conceptual diligence bridge only; no values, conversion rates, or accounting treatment are estimated."
    claimRefs: [CI007, CI008, CI009, CI010, CI011, CI014]
callouts:
  - calloutType: risk
    title: Funding cannot substitute for an operating model
    body: >-
      The disclosed round supports expansion, but without cash, burn, backlog conversion,
      revenue recognition, and gross-margin data it does not establish runway or economic durability.
    claimRefs: [CI001, CI011, CI012, CI015]
