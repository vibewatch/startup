company:
  name: Heven AeroTech
chapter:
  number: 4
  title: Financials
  summary: >-
    Heven AeroTech has disclosed a $100 million Series B and visible manufacturing and
    workforce expansion, but the assigned public evidence does not disclose revenue,
    pricing, gross margin, backlog, cash, burn, or runway. The financing is therefore a
    scale-up signal, not evidence that revenue quality, unit economics, or capital adequacy
    are underwritten.
sections:
  - id: capital-and-runway
    title: Capital raised is not runway
    body: >-
      Heven AeroTech announced a $100 million Series B at a $1 billion valuation, and the
      Washington Business Journal independently reported the $100 million investment led by
      IonQ. The company allocated the new capital across domestic manufacturing, hydrogen
      generation and logistics infrastructure, and advanced systems development. Those uses
      indicate that the round must support both industrial capacity and continued product
      development rather than a single, low-capital software expansion. The historical round
      chronology belongs in Company Overview; for financial underwriting, the decisive issue
      is forward adequacy. No assigned source discloses current cash, accounting loss, cash
      burn, runway, debt, project-finance obligations, or committed capital expenditures.
      Funding raised consequently cannot be treated as cash available or translated into
      months of runway.
    claimRefs: [CI001, CI002, CI012, CI015]
  - id: revenue-and-pricing
    title: Revenue model is visible only at the activity level
    body: >-
      Public materials describe Heven as designing, manufacturing, and deploying unmanned
      aerial systems, while the financing plan also includes hydrogen generation and logistics
      infrastructure. That evidence supports an activity-level model spanning aircraft,
      deployment, and enabling infrastructure, but it does not establish whether customers
      purchase units, pay milestone-based contracts, reimburse development, subscribe to
      support, or buy hydrogen services separately. The assigned sources disclose no list or
      realized pricing, contract unit, discounting, revenue-recognition policy, revenue mix,
      or recurring-revenue measure. Advanced systems and quantum integration are funded
      product priorities, not disclosed revenue streams. Any forecast should therefore keep
      price, volume, acceptance timing, and service attach rate as management-supplied inputs
      rather than inferred public facts.
    claimRefs: [CI002, CI008, CI009, CI010, CI011]
    tableRefs: [TI001, TI002]
  - id: cost-and-scale
    title: Expansion signals a rising cost base without unit-cost disclosure
    body: >-
      The operating footprint is expanding. A company-issued July release said full-time
      workforce increased from 38 at year-end 2025 to 88 by July 14, 2026; the current careers
      page separately displays 154 employees and active roles across manufacturing,
      engineering, flight operations, procurement, contracts, and business development. The
      company also announced a 56,000-square-foot Virginia production facility and continued
      manufacturing recruitment. These period-specific company disclosures should not be
      collapsed into a verified payroll bridge, but together they indicate exposure to labor,
      facilities, tooling, inventory, quality systems, supply-chain, flight-test, and field
      support costs. Public evidence does not provide bill of materials, yield, utilization,
      capex, working capital, warranty, service-delivery cost, or gross margin, so operating
      leverage remains unquantified.
    claimRefs: [CI003, CI004, CI005, CI006, CI007, CI011]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: Financial verdict and diligence blockers
    body: >-
      The financial case is presently capital-enabled but not economically demonstrated.
      The Series B and physical buildout make continued execution plausible, while the absence
      of revenue, backlog, pricing, margin, burn, and runway prevents assessment of revenue
      quality or self-funding potential. Caplight's public page identifies the Series B date
      but leaves the amount and valuation fields blank and reserves detailed records for
      institutional access, illustrating the limited independent financial record. The core
      diligence package should reconcile bookings, funded backlog, delivery acceptance,
      recognized revenue, gross profit, cash movement, and remaining obligations monthly.
      Until that bridge is available, valuation work should use explicit scenarios rather
      than present unsupported point estimates, and the next-round trigger should be treated
      as an open management diligence item.
    claimRefs: [CI011, CI012, CI013, CI014, CI015]
    figureRefs: [FI001]
