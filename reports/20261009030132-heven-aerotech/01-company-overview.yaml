callouts:
  - calloutType: insight
    title: Strategic Transition from Regional Drone Maker to Dual-Use Defense Unicorn
    body: >-
      Heven AeroTech's rapid repositioning from an Israeli agricultural and commercial drone developer (Heven Drones)
      into a U.S.-headquartered defense unicorn reflects deliberate strategic alignment with Department of Defense
      procurement mandates. By acquiring Zepher Flight Labs for runway-independent airframes, securing DIU Blue UAS
      Select status for the Z1, and partnering with IonQ on quantum navigation in GPS-denied theaters, Heven has built
      significant strategic defensibility around long-endurance tactical UAS. However, underwriting the $1.0 billion
      valuation requires verifying whether recent manufacturing expansion in Virginia translates into funded military
      programs of record and recurring revenue.
    claimRefs:
      - CO001
      - CO004
      - CO009
      - CO011
      - CO012
