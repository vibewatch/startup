company:
  name: Heven AeroTech
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Heven AeroTech is a hydrogen-powered dual-use unmanned aerial systems manufacturer headquartered in Sterling,
    Virginia, that achieved unicorn status in December 2025 following a $100 million Series B financing led by IonQ at a
    $1.0 billion post-money valuation. While the company has demonstrated strong technical momentum through DIU Blue UAS
    Select designation and domestic manufacturing expansion, comprehensive revenue and operational reliability metrics
    remain private.
sections:
  - id: corporate-identity-and-operating-footprint
    title: Corporate Identity & Operating Footprint
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO014
    tableRefs:
      - TO001
    body: >-
      Heven AeroTech, Inc. is an American aerospace and defense technology company specializing in hydrogen-powered,
      runway-independent unmanned aerial systems (UAS) engineered for extended-endurance operational missions.
      Originally established in Israel in 2019 as Heven Drones by founder Benzion Levinson, the company rebranded to
      Heven AeroTech in 2025 following the acquisition of Zepher Flight Labs and relocated its global corporate
      headquarters to Sterling, Virginia. Today, the company maintains a distributed geographic operating footprint that
      combines executive leadership and regulatory affairs in Northern Virginia with an advanced 56,000-square-foot
      manufacturing and testing campus in Winchester, Virginia, runway-independent flight integration facilities in
      Bingen, Washington, and specialized research operations in Mevo Carmel, Israel. The company's primary operational
      focus centers on deploying its flagship Group 2/3-class Z1 platform alongside specialized heavy-lift systems,
      integrating proprietary hydrogen fuel cell propulsion and on-demand refueling hardware to deliver critical
      multi-hour persistence for defense, border surveillance, public safety, and tactical logistics customers across
      contested and infrastructure-constrained operating environments.
  - id: executive-leadership-and-governance
    title: Executive Leadership & Governance Structure
    claimRefs:
      - CO005
      - CO006
      - CO007
      - CO008
    tableRefs:
      - TO002
    body: >-
      Heven AeroTech is guided by an executive team combining military operational domain expertise, institutional
      defense industrial leadership, and seasoned federal growth experience. The enterprise was founded by Chief
      Executive Officer Ben Levinson, a former Israel Defense Forces combat officer and Stanford Graduate School of
      Business alumnus who established the business to address critical limitations in low-tech tactical counter-UAS and
      long-endurance aerial surveillance. Levinson is supported by President of Israel Operations Yossi Weiss, the
      former Chief Executive Officer of Israel Aerospace Industries, who contributes more than four decades of tier-one
      defense aerospace manufacturing and international program execution. In July 2026, Heven significantly
      strengthened its federal acquisition and operational scaling capabilities by appointing Lexi Alexander as Chief
      Growth Officer, alongside senior technical leaders including Dr. Karen Swider-Lyons as Vice President of Hydrogen,
      Samantha Hamilton as Vice President of Artificial Intelligence, and Gaston Paz as Head of Manufacturing. This
      executive expansion coincided with rapid organizational growth, during which Heven more than doubled its domestic
      workforce from 38 full-time personnel at year-end 2025 to 88 employees by mid-2026, while coordinating a wider
      global technical team across U.S. and Israeli facilities.
  - id: capitalization-and-stakeholder-ecosystem
    title: Capitalization History & Investor Ecosystem
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO014
    tableRefs:
      - TO003
    body: >-
      Heven AeroTech achieved defense-tech unicorn status in December 2025 following the completion of a $100 million
      Series B financing round that valued the business at a $1.0 billion post-money anchor. The round was led by
      commercial quantum computing provider IonQ, marking an uncommon convergence of quantum hardware development and
      tactical unmanned aviation, with continuing participation from early venture backer Texas Venture Partners. Total
      disclosed institutional equity capital exceeds $104.5 million, anchored by the Series B proceeds and an initial
      $4.5 million Series A investment completed in 2024. In addition to financial backing, Heven maintains strategic
      corporate alignments across the defense industrial base, including a joint production arrangement with Mach
      Industries at its California manufacturing facility and an ongoing technology co-development initiative with IonQ
      to integrate quantum sensing and navigation algorithms. Nevertheless, because Heven AeroTech remains a closely
      held private enterprise, fundamental operating metrics—including annual recurring revenue, GAAP net revenue, gross
      margin performance, and cash burn dynamics—remain undisclosed, making external underwriting dependent on verifying
      contractual delivery schedules and Department of Defense procurement task orders.
  - id: operational-milestones-and-quantum-scaling-trajectory
    title: Operational Milestones & Scaling Trajectory
    claimRefs:
      - CO004
      - CO007
      - CO011
      - CO012
      - CO013
    figureRefs:
      - FO001
    body: >-
      Since inception, Heven AeroTech has transitioned from early multi-rotor prototyping into industrialized domestic
      manufacturing and formal federal program qualification. A pivotal strategic milestone occurred in November 2025
      when the company's flagship Z1 hydrogen tactical UAS was designated as Blue UAS Select by the Defense Innovation
      Unit, validating its supply chain compliance and clearing the platform for streamlined procurement across
      Department of Defense entities. To satisfy anticipated delivery requirements from U.S. Special Operations Command
      and international defense allies, Heven opened a regional 56,000-square-foot production plant in Winchester,
      Virginia in September 2026, establishing its first East Coast assembly network. Concurrently, the company has
      initiated development of a dedicated quantum engineering division to embed IonQ navigation and sensor-fusion
      capabilities for contested, GPS-denied tactical environments. However, operationalizing quantum processors on
      tactical aerial platforms introduces formidable engineering hurdles: quantum components demand rigorous thermal
      management, dynamic vibration isolation, and strict electromagnetic shielding that conflict with the weight,
      acoustic, and aerodynamic constraints of tactical unmanned aviation.
