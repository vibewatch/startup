  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Concept and Customer Mission Profiles
        blocks:
          - type: paragraph
            body: >-
              Heven AeroTech designs and manufactures hydrogen-powered unmanned aerial systems engineered to overcome
              the endurance and operational limitations of conventional battery-electric and combustion drones. By
              pairing proton-exchange membrane hydrogen fuel cells with modular airframe architectures, the company
              targets mission profiles across persistent intelligence, surveillance, and reconnaissance (ISR), tactical
              resupply, and specialized payload deployment. Tactical defense users operating in contested environments
              face severe endurance constraints with battery-powered multirotors, which typically require battery swaps
              every thirty to forty-five minutes, while conventional fixed-wing aircraft require runways or complex
              launch rails. Heven's vertical takeoff and landing systems eliminate runway dependency while seeking to
              deliver multi-hour station time without reliance on vulnerable field electrical power grids. These
              capabilities position the platform for forward-deployed resupply, casualty evacuation logistics, and
              electronic warfare payload integration across maneuver formations.
            claimRefs:
              - CE001
              - CE002
              - CE005
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE007
              - CE008
      - number: '5.2'
        title: Product Line Portfolio and Platform Maturity
        blocks:
          - type: paragraph
            body: >-
              The company's product architecture spans distinct operational tiers centered around its flagship Z1
              unmanned aircraft system. The Z1 is a multirotor platform that has achieved Defense Innovation Unit Blue
              UAS Select certification, verifying its cybersecurity compliance and supply chain security for immediate
              Department of Defense and federal agency procurement. Beyond the Z1, Heven operates the Atlas heavy-lift
              drone, which provides a seventy-pound payload capacity for tactical logistics, battlefield cargo delivery,
              and equipment transport, with roadmap plans to expand into one-hundred-pound lift capacity. In
              development, the company has introduced the Raider platform, designed as a higher-capacity carrier
              expected to deliver up to nine kilowatts of onboard fuel cell power generation. While the Z1 represents
              Heven's primary production asset, the broader portfolio emphasizes modular payload bays allowing rapid
              reconfiguration between sensor pods, cargo racks, and electronic warfare emitters.
            claimRefs:
              - CE003
              - CE006
              - CE007
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE006
              - CE007
      - number: '5.3'
        title: Propulsion Architecture and Systems Integration
        blocks:
          - type: paragraph
            body: >-
              At the technical core of Heven's systems is a hybrid-electric propulsion architecture powered by
              lightweight gaseous hydrogen fuel cells rather than liquid hydrocarbons or lithium batteries. On the
              flagship Z1, a 1.2 kilowatt fuel cell stack operates on less than one pound of compressed hydrogen stored
              in an ultra-high-pressure carbon-composite tank, generating electric power in flight with negligible
              acoustic noise and zero thermal exhaust signature. This low-observable profile provides tactical
              survivability in contested operating domains compared to internal combustion engines. Systems engineering
              practices at Heven West in Bingen, Washington utilize Model-Based Systems Engineering, Autopilot flight
              telemetry analysis, and MATLAB modeling to execute trade studies, Failure Modes and Effects Analysis
              (FMEA), and hardware integration. The platform's software and avionics adhere to the Modular Open Systems
              Approach (MOSA) and applicable military airworthiness standards, enabling rapid integration of avionics,
              third-party sensors, and ground control stations.
            claimRefs:
              - CE004
              - CE010
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE009
              - CE010
              - CE011
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE003
              - CE004
              - CE010
              - CE011
              - CE013
              - CE014
      - number: '5.4'
        title: Manufacturing Scaling, Airworthiness, and Technical Risk
        blocks:
          - type: paragraph
            body: >-
              To transition hydrogen UAS from boutique fabrication to serialized industrial manufacturing, Heven
              AeroTech launched a nationwide multi-site manufacturing network anchored by a newly opened
              56,000-square-foot production facility in Winchester, Virginia, complementing its engineering and
              manufacturing operations in the Columbia River Gorge. Company leadership has recruited senior aerospace
              and alternative energy executives, including Dr. Karen Swider-Lyons, former head of fuel cell UAV research
              at the U.S. Naval Research Laboratory, to direct hydrogen propulsion scaling. However, material
              engineering and operational diligence risks persist. The company's public positioning of its airframes as
              potential motherships for airborne high-energy laser weapons contrasts sharply with twenty years of
              Pentagon directed-energy research, which has struggled with extreme weight, beam jitter, and thermal
              dissipation challenges. Furthermore, real-world deployment of hydrogen UAS introduces expeditionary
              logistics burdens, requiring specialized high-pressure field fueling infrastructure and disciplined
              hydrogen supply chains.
            claimRefs:
              - CE008
              - CE009
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Energy Density Trade-off in Tactical UAS
            body: >-
              By replacing heavy lithium battery packs with lightweight compressed hydrogen fuel cells delivering up to
              1.2 kW continuous output on the Z1 and targeting 9 kW on the Raider, Heven achieves multi-hour persistence
              (up to 10–15 hours claimed) while eliminating thermal and acoustic signatures crucial for tactical
              survivability.
            calloutType: insight
            claimRefs:
              - CE001
              - CE004
              - CE005
          - type: callout
            title: Airborne Directed Energy Hype vs. Integration Reality
            body: >-
              While Heven positions its airframes as motherships for airborne laser weapons, airborne directed energy
              has faced two decades of Pentagon technical setbacks over size, weight, power, and atmospheric beam
              turbulence. With the Atlas payload currently capped at 70 pounds, operational airborne laser deployment
              remains a distant, speculative roadmap item.
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Target Demand
        blocks:
          - type: paragraph
            body: >-
              Heven AeroTech segments its target market across national security defense agencies, civilian emergency
              and public safety authorities, and critical infrastructure inspection operators. The primary paying
              customer segment is the federal defense sector, represented by the U.S. Army, U.S. Special Operations
              Command (USSOCOM), combatant commands, and allied armed forces requiring long-endurance,
              runway-independent unmanned aerial systems (UAS) for persistent intelligence, surveillance, reconnaissance
              (ISR), and tactical logistics. Secondary commercial and humanitarian segments encompass disaster response,
              aerial firefighting, environmental monitoring, and perimeter security where runway independence and
              extended airborne persistence are critical. However, commercial adoption remains primarily positioning
              rather than quantified operating revenue, with defense relationships acting as the central demand driver.
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: table
            tableRef: TU001
            claimRefs:
