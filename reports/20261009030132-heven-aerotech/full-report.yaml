      - number: '1.2'
        title: Executive Leadership & Governance Structure
        blocks:
          - type: paragraph
            body: >-
              Heven AeroTech is guided by an executive team combining military operational domain expertise,
              institutional defense industrial leadership, and seasoned federal growth experience. The enterprise was
              founded by Chief Executive Officer Ben Levinson, a former Israel Defense Forces combat officer and
              Stanford Graduate School of Business alumnus who established the business to address critical limitations
              in low-tech tactical counter-UAS and long-endurance aerial surveillance. Levinson is supported by
              President of Israel Operations Yossi Weiss, the former Chief Executive Officer of Israel Aerospace
              Industries, who contributes more than four decades of tier-one defense aerospace manufacturing and
              international program execution. In July 2026, Heven significantly strengthened its federal acquisition
              and operational scaling capabilities by appointing Lexi Alexander as Chief Growth Officer, alongside
              senior technical leaders including Dr. Karen Swider-Lyons as Vice President of Hydrogen, Samantha Hamilton
              as Vice President of Artificial Intelligence, and Gaston Paz as Head of Manufacturing. This executive
              expansion coincided with rapid organizational growth, during which Heven more than doubled its domestic
              workforce from 38 full-time personnel at year-end 2025 to 88 employees by mid-2026, while coordinating a
              wider global technical team across U.S. and Israeli facilities.
