      - number: '7.3'
        title: Supply-chain, partner, and financial-model exposure
        blocks:
          - type: paragraph
            body: >-
              The procurement role explicitly assigns management of lead times, capacity constraints, supplier
              performance, audits, disruption mitigation, and contingency planning, which confirms that scaling depends
              on a controlled component and services base. Heven also describes operations across the United States,
              Israel, and other locations, increasing export-control, coordination, and continuity demands. IonQ's
              announcement adds technology and governance coupling: its executive was slated to join Heven's board,
              while quantum networking, computing, sensing, and security initiatives were framed as possibilities, not
              delivered capabilities. No assigned source quantifies supplier concentration, backlog, customer
              concentration, burn, working capital, margin, or runway, so financial resilience cannot be ranked with
              false precision.
            claimRefs:
              - CR005
              - CR011
              - CR012
              - CR013
              - CR016
          - type: table
