      unicorn.
    data:
      items:
        - date: '2019-12-01'
          label: Company Founding in Israel
          detail: >-
            Bentzion Levinson founds Heven Drones in Israel, developing hydrogen-powered propulsion for unmanned aerial
            systems.
        - date: '2024-01-01'
          label: Series A Financing
          detail: Secures Series A investment from Texas Venture Partners with an initial $4.5M institutional commitment.
        - date: '2025-03-01'
          label: Mach Industries Partnership
