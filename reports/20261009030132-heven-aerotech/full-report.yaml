  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The addressable market for Heven AeroTech lies at the intersection of tactical unmanned aerial systems
              (UAS) and specialized zero-emission long-endurance flight. Unmanned aviation has historically been
              polarized between small lithium-battery multirotors constrained by 20 to 45 minutes of operational flight
              time and large hydrocarbon-fueled tactical fixed-wing or rotary platforms that require specialized
              airstrips, emit substantial thermal and acoustic signatures, and impose burdensome logistics chains. Heven
              defines its boundary around vertical takeoff and landing (VTOL) and heavy-lift multirotor platforms
              utilizing hydrogen fuel cell propulsion to achieve flight times of 3 to 12 hours without runways. Included
              spend encompasses defense tactical intelligence, surveillance, and reconnaissance (ISR), border and
              perimeter security, tactical resupply, public safety aerial monitoring, and industrial infrastructure
              inspection. Crucially excluded from addressable spend are high-volume consumer recreation drones, urban
              air mobility passenger transport, heavy strategic cargo aircraft exceeding 500 kilograms, and commodity
              low-cost agricultural mapping. Status-quo substitutes include existing Group 1 to Group 3 battery drones
              such as Skydio and Teal, internal combustion tactical UAVs like the Insitu ScanEagle or Textron Shadow,
              and manned rotary-wing aviation like Bell helicopters. While lithium-battery systems offer low unit
              acquisition cost and simple electrical recharging, their short loiter times require operators to purchase
              and rotate multiple airframes and battery sets to maintain continuous coverage. Conversely, hydrocarbon
              platforms deliver endurance but incur heavy acoustic footprints, complex fuel logistics, and high total
              cost per flight hour. Hydrogen propulsion attempts to solve this compromise by combining silent electric
              motor operation with high energy density and rapid five-minute refueling.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Market Sizing Lenses and Addressable Spend Estimates
        blocks:
          - type: paragraph
            body: >-
              Evaluating the addressable market for hydrogen-powered tactical and commercial UAS requires multiple
              analytical lenses rather than a single aggregated top-down projection. Across global defense and
              commercial aerospace, overall unmanned systems expenditure exceeds tens of billions annually, but
              hydrogen-specific platforms occupy an early demonstration and initial procurement niche. The broader Group
              1 through Group 3 tactical UAS spend represents the theoretical Total Addressable Market (TAM), driven by
              expanding Western defense budgets and accelerating counter-drone and persistent ISR requirements. Within
              this total, the Serviceable Addressable Market (SAM) is bounded by missions requiring long endurance
              (exceeding two hours) combined with runway independence and acoustic stealth, specifically tactical
              military ISR, forward resupply, and large-scale utility corridor inspection. The Serviceable Obtainable
              Market (SOM) is tightly restricted to defense and sovereign public-safety buyers possessing domestic
              procurement authorities such as NDAA compliance and Blue UAS certification, alongside deployed hydrogen
              fuel access. Independent market research and industry reports emphasize that while overall enterprise
              drone adoption expands steadily, hydrogen propulsion adoption remains constrained by fueling
              infrastructure and specialized airframe unit economics. Heven's $100 million Series B financing at a $1
              billion valuation reflects an aggressive investor bet that hydrogen VTOL will capture a decisive share of
              tactical defense procurement; however, independent transaction and backlog records demonstrating scaled
              commercial fleet purchases remain absent from the public record.
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
