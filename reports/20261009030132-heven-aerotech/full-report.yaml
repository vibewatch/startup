  - id: TV002
    title: Core Investment Thesis and Anti-Thesis Breakdown
    columns:
      - Pillar
      - Investment Thesis Argument
      - Anti-Thesis Counter-Risk
      - Thesis-Break Diligence Trigger
    rows:
      - - Propulsion & Endurance
        - Hydrogen fuel cell propulsion delivers 10+ hours endurance and 600+ mile range, 5x typical lithium-ion drones
        - Hydrogen generation and transport logistics create severe friction and vulnerability at forward tactical bases
        - Inability to demonstrate field-deployable hydrogen generation or failure in contested field logistics trials
      - - Defense Accreditation
        - DIU Blue UAS Select designation provides formal DoD authorization and streamlined federal procurement pathway
        - Programmatic designation does not guarantee funded procurement budget lines or multi-year task order volume
        - Lapse or revocation of Blue UAS status or failure to secure firm funded task orders under the Army BOA
      - - Strategic Technology
        - >-
          IonQ partnership provides quantum-enabled navigation, secure communications, and PNT in GPS-denied
          environments
        - Quantum integration into tactical aircraft involves immense thermal, vibration, and software packaging hurdles
        - Failure of quantum prototype payloads to operate reliably outside controlled laboratory testbeds
      - - Manufacturing Scale
        - >-
          Domestic multi-site network expansion (Winchester, VA and Bingen, WA) satisfies national security supply
          mandates
        - Rapid factory stand-up generates severe operational cash burn ahead of confirmed defense production contracts
        - >-
          Monthly operating cash burn accelerating beyond $4.0M without corresponding growth in customer cash
          collections
    notes: >-
      Qualitative thesis balance evaluated against public press disclosures, technical publications, and defense
      procurement structures.
