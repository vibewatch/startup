      - number: '3.3'
        title: Scale, distribution, and buying friction
        blocks:
          - type: paragraph
            body: >-
              Capital and manufacturing can amplify Heven's competitive position, but the evidence is still mostly
              company-issued. Multiples reports a $100 million Series B and a $1 billion valuation, while a paid company
              release reported that full-time headcount rose from 38 at year-end 2025 to 88 in July 2026. Another
              company release describes a 56,000-square-foot Virginia facility as the first East Coast node in a planned
              national manufacturing network. These indicators show capacity-building, not shipped volume, unit cost,
              delivery reliability, or channel power. Public list prices, realized contract prices, support charges,
              hydrogen-system costs, discount structures, and competitor packaging were not disclosed in the retained
              evidence. Buyers' switching costs, lock-in, multi-homing behavior, and internal-build economics
              consequently remain material underwriting gaps.
            claimRefs:
              - CP006
              - CP011
              - CP012
              - CP013
