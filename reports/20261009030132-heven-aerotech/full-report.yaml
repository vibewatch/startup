    title: Product Architecture Map
    type: stack
    summary: >-
      Hierarchical architectural stack of the Heven AeroTech hydrogen UAS platform from tactical hydrogen fueling to
      mission autonomy.
    data:
      layers:
        - label: Mission & Autonomy Layer
          detail: >-
            Mission planning software, autonomous waypoint navigation, Autopilot telemetry logging, and modular open
            systems architecture (MOSA) compliance.
        - label: Payload & Sensor Integration Layer
          detail: >-
            Tactical quick-swap modular interface supporting gimbaled EO/IR ISR turrets, RF/EW disruption packages, or
            tactical cargo pods.
        - label: Flight Control & Avionics Layer
          detail: >-
            Triple-redundant flight computer, MIL-STD compliant wiring harness, GPS-denied navigation sensors, and Blue
            UAS cybersecurity hardening.
        - label: Electric Propulsion & Aerodynamics Layer
          detail: >-
            High-efficiency brushless DC electric motors, custom carbon-composite multirotor arms and propellers, and
            lightweight aerodynamic airframe.
        - label: Hydrogen Fuel Cell Power System Layer
          detail: >-
            1.2 kW proton-exchange membrane (PEM) fuel cell converting gaseous hydrogen into continuous electric power
            with zero acoustic or thermal signature.
        - label: Hydrogen Storage & Ground Support Layer
          detail: >-
            Ultra-lightweight pressurized carbon-fiber composite hydrogen fuel tank (sub-1 lb H2 mass) paired with
            tactical mobile field refueling units.
    approximationNotes: >-
