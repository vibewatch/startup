      - number: '7.2'
        title: Regulatory, legal, and security exposure
        blocks:
          - type: paragraph
            body: >-
              The public record identifies relevant obligations but does not establish their operating status. Heven's
              privacy policy addresses U.S. and international privacy frameworks, acknowledges transfers of EEA, UK, and
              Swiss personal data to the United States, and says appropriate safeguards may include standard contractual
              clauses. It also states that no transmission or storage method is completely secure. A company-authored
              technical-writing role covers FAA or other civil authorities, ITAR/EAR awareness, airworthiness, safety,
              and traceable verification documentation. These are sensible control-building activities, but a job
              specification is not evidence of registrations, approvals, completed audits, certifications, or an
              incident-free operating history.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR016
          - type: table
