            California.
        - date: '2025-04-01'
          label: Zepher Flight Labs Acquisition
          detail: Acquires VTOL drone developer Zepher Flight Labs, adding Bingen, Washington manufacturing operations.
        - date: '2025-09-01'
          label: U.S. Rebranding and HQ Establishment
          detail: Rebrands from Heven Drones to Heven AeroTech and establishes corporate headquarters in Sterling, Virginia.
        - date: '2025-11-01'
          label: DIU Blue UAS Select Designation
          detail: Flagship Z1 hydrogen-powered tactical drone is designated Blue UAS Select by Defense Innovation Unit.
        - date: '2025-12-01'
