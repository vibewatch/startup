              subscribe to support, or buy hydrogen services separately. The assigned sources disclose no list or
              realized pricing, contract unit, discounting, revenue-recognition policy, revenue mix, or
              recurring-revenue measure. Advanced systems and quantum integration are funded product priorities, not
              disclosed revenue streams. Any forecast should therefore keep price, volume, acceptance timing, and
