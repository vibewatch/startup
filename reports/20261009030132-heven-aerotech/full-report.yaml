      - number: '1.3'
        title: Capitalization History & Investor Ecosystem
        blocks:
          - type: paragraph
            body: >-
              Heven AeroTech achieved defense-tech unicorn status in December 2025 following the completion of a $100
              million Series B financing round that valued the business at a $1.0 billion post-money anchor. The round
              was led by commercial quantum computing provider IonQ, marking an uncommon convergence of quantum hardware
              development and tactical unmanned aviation, with continuing participation from early venture backer Texas
              Venture Partners. Total disclosed institutional equity capital exceeds $104.5 million, anchored by the
              Series B proceeds and an initial $4.5 million Series A investment completed in 2024. In addition to
              financial backing, Heven maintains strategic corporate alignments across the defense industrial base,
              including a joint production arrangement with Mach Industries at its California manufacturing facility and
              an ongoing technology co-development initiative with IonQ to integrate quantum sensing and navigation
              algorithms. Nevertheless, because Heven AeroTech remains a closely held private enterprise, fundamental
              operating metrics—including annual recurring revenue, GAAP net revenue, gross margin performance, and cash
              burn dynamics—remain undisclosed, making external underwriting dependent on verifying contractual delivery
              schedules and Department of Defense procurement task orders.
