chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity & Operating Footprint
        blocks:
          - type: paragraph
            body: >-
              Heven AeroTech, Inc. is an American aerospace and defense technology company specializing in
              hydrogen-powered, runway-independent unmanned aerial systems (UAS) engineered for extended-endurance
              operational missions. Originally established in Israel in 2019 as Heven Drones by founder Benzion
              Levinson, the company rebranded to Heven AeroTech in 2025 following the acquisition of Zepher Flight Labs
              and relocated its global corporate headquarters to Sterling, Virginia. Today, the company maintains a
              distributed geographic operating footprint that combines executive leadership and regulatory affairs in
              Northern Virginia with an advanced 56,000-square-foot manufacturing and testing campus in Winchester,
              Virginia, runway-independent flight integration facilities in Bingen, Washington, and specialized research
              operations in Mevo Carmel, Israel. The company's primary operational focus centers on deploying its
              flagship Group 2/3-class Z1 platform alongside specialized heavy-lift systems, integrating proprietary
              hydrogen fuel cell propulsion and on-demand refueling hardware to deliver critical multi-hour persistence
              for defense, border surveillance, public safety, and tactical logistics customers across contested and
              infrastructure-constrained operating environments.
            claimRefs:
