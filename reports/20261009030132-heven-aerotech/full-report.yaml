      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The strongest potential moat is the integration of long-endurance hydrogen propulsion, airframe and
              payload engineering, autonomy software, and domestic manufacturing. The same breadth creates execution
              risk: each layer must work under operational constraints, and an incumbent or well-funded entrant can
              attack individual layers without reproducing the entire stack. Tectonic Defense reported Heven's Z1 claims
              of ten-hour endurance and 600-mile range and its Blue UAS Select status, but also quoted management
              describing thermal, vibration, shielding, and software-validation challenges for quantum integration.
              Heven's own 2026 content agenda extends toward airborne laser weapons, emergency response, and regional
              manufacturing, increasing strategic option value while also widening the execution surface. Without
              independent comparative trials, renewal behavior, win-loss records, and mission-level cost data, the
              differentiation is credible in concept but not yet demonstrated as durable.
            claimRefs:
              - CP005
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation has not yet been benchmarked
            body: >-
              Public evidence supports a distinctive architecture and scaling effort, but it does not show independent
              win rates, comparative mission reliability, total mission cost, or switching behavior. Treat the moat as a
              diligence thesis rather than a demonstrated outcome.
            calloutType: risk
            claimRefs:
              - CP011
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Capital raised is not runway
        blocks:
          - type: paragraph
            body: >-
              Heven AeroTech announced a $100 million Series B at a $1 billion valuation, and the Washington Business
              Journal independently reported the $100 million investment led by IonQ. The company allocated the new
              capital across domestic manufacturing, hydrogen generation and logistics infrastructure, and advanced
              systems development. Those uses indicate that the round must support both industrial capacity and
              continued product development rather than a single, low-capital software expansion. The historical round
              chronology belongs in Company Overview; for financial underwriting, the decisive issue is forward
              adequacy. No assigned source discloses current cash, accounting loss, cash burn, runway, debt,
              project-finance obligations, or committed capital expenditures. Funding raised consequently cannot be
              treated as cash available or translated into months of runway.
            claimRefs:
              - CI001
              - CI002
              - CI012
              - CI015
