      - number: '7.4'
        title: Mitigations, monitors, and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              Visible mitigations include procurement ownership, supplier metrics, proposed compliance documentation,
              new manufacturing leadership, a dedicated facility, export-compliance hiring, and a named technology
              partner. Their maturity is best described as developing because the available sources document roles and
              intentions rather than audited control effectiveness. The investment thesis should break if management
              cannot provide current airworthiness and export-control status, hydrogen-system safety and reliability
              records, supplier concentration and on-time delivery data, production yield and rework history, customer
              or program concentration, and a monthly liquidity bridge. It should also break if the quantum roadmap is
              represented as deployed product capability without acceptance evidence, or if rapid hiring and facility
              expansion are not matched by traceable quality and delivery performance.
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR009
              - CR012
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence threshold for underwriting the ramp
            body: >-
              Facility size, hiring, policies, and partner announcements are inputs, not proof of safe, compliant,
              repeatable delivery. Underwriting should remain conditional on operating, concentration, compliance,
              reliability, and liquidity records.
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Anti-Thesis, and Recommendation Stance
        blocks:
          - type: paragraph
            body: >-
              Heven AeroTech's core investment thesis rests on establishing a defensible franchise in hydrogen fuel cell
              unmanned aerial systems (UAS) engineered for extreme flight endurance and contested operational
              environments. The company's flagship Z1 platform claims flight times exceeding 10 hours and operational
              ranges beyond 600 miles, solving persistent battery limitations for critical Department of Defense
              missions. Its Blue UAS Select designation by the Defense Innovation Unit provides immediate procurement
              clearance across federal mission partners. However, the anti-thesis centers on unverified commercial unit
              economics, an unproven secondary market, and heavy execution risk across domestic factory rollouts.
              Despite sovereign manufacturing tailwinds, public disclosures omit audited annual recurring revenue,
              signed firm order backlogs, and multi-year production gross margins. Weighing rapid strategic positioning
              against opaque fundamentals, our diligence yields a recommendation of research-more with medium
              confidence, high risk rating, and a stretched valuation stance.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV008
              - CV011
              - CV012
      - number: '8.2'
        title: Financing History, Cap Table Dynamics, and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              Heven AeroTech reached unicorn status on December 1, 2025, closing a $100M Series B equity financing round
              led by NYSE-listed quantum computing company IonQ, with participation from returning institutional backer
              Texas Venture Partners. The round established a post-money valuation anchor of $1.0B on $900M pre-money
              valuation, bringing total disclosed lifetime equity funding to approximately $100M to $115.2M. While
              private secondary liquidity trackers like Forge Global note limited trading activity and no established
              matched pricing, the primary price per share remains undisclosed. Institutional entry discipline demands
              caution: at an implied $1.0B market capitalization with estimated employee headcount between 50 and 100
              expanding toward 150, the company trades at an enterprise valuation of $10M to $20M per employee. Without
              audited revenue figures or task-order receipts from the U.S. Army Basic Ordering Agreement, investors face
              severe liquidation preference overhang and multiple-compression risk should production ramp slower than
              capital burn.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: Valuation Scenarios, Defense Tech Comparables, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Evaluating Heven AeroTech requires benchmarking against defense autonomy and uncrewed aviation peers such
              as Anduril Industries, Mach Industries, and Brinc. While venture-backed defense hardware firms command
              forward revenue multiples between 12.0x and 25.0x during rapid program of record transitions, Heven
              AeroTech's lack of disclosed revenue necessitates scenario-based underwriting. In our base case, the
              company achieves $50M in annual revenue by 2027 through Army task orders and sovereign manufacturing
              delivery, supporting a fair-value valuation between $600M and $750M (12.0x to 15.0x forward multiple),
              suggesting the current $1.0B round priced in substantial forward execution. Downside triggers include
              hydrogen logistics bottlenecks, field-support failure under contested conditions, or loss of Blue UAS
              status, which would re-rate the business toward its liquidation value under $250M. Final diligence asks
              require access to audited trial results, task-order delivery schedules, and hydrogen fuel cell unit
              manufacturing costs.
            claimRefs:
              - CV012
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV008
              - CV011
              - CV014
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Capital Discipline Over Hype: Avoid Chasing the $1.0B Unicorn Mark'
            body: >-
              While Heven AeroTech has assembled impressive defense credentials and blue-chip strategic backing from
              IonQ, underwriting a $1.0B post-money valuation without audited financial disclosures exposes growth
              investors to severe valuation compression. Prospective investors should condition participation on direct
              access to task-order delivery schedules, unit bill-of-materials costs, and verified customer retention.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV008
              - CV012
