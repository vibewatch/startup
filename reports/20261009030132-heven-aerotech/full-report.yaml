              - CU014
      - number: '6.2'
        title: Adoption Trajectory and Manufacturing Industrialization
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory of Heven AeroTech has transitioned from early prototyping in Israel to accelerated
              industrial deployment within the United States. To meet federal defense requirements, the company expanded
              its full-time workforce from 38 employees at year-end 2025 to 88 by mid-2026 (a 132% increase) and stood
              up a 56,000-square-foot production plant in Winchester, Virginia, in just 90 days. The facility
              establishes East Coast manufacturing for the Z1 platform and serves as the operational model for a planned
              nationwide production network. Despite these substantial capacity investments, operational adoption
              metrics such as flight hours under operational payload, delivered airframe volume, and active customer
              account totals remain undisclosed, preventing definitive confirmation of fleet-scale deployment beyond
              pre-procurement evaluations.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
      - number: '6.3'
        title: Named Customer Proof and Defense Procurement Vehicles
        blocks:
          - type: paragraph
            body: >-
              Publicly identifiable customer proof centers on formal government procurement access and strategic
              distribution channels rather than conventional enterprise SaaS or commercial sales. The flagship Z1
              hydrogen VTOL UAS achieved DIU Blue UAS Select inclusion, validating the platform against strict
              Department of Defense cybersecurity, component provenance, and mission readiness standards. In addition,
              Heven secured a U.S. Army Basic Ordering Agreement (BOA) and established a distribution partnership with
              defense logistics specialist SupplyCore. Although a BOA provides an authorized contractual conduit for
              federal task orders, it does not guarantee appropriated funding or binding purchase commitments, leaving
              exact backlog, order values, and delivery schedules unverified.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
      - number: '6.4'
        title: Contract Durability, Retention, and Concentration Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Evaluating customer retention and revenue durability is severely constrained by private defense-market
              opacity. Core recurring metrics—including Net Revenue Retention (NRR), Gross Revenue Retention (GRR),
              cohort renewal rates, and average contract values—are absent from public disclosures. Furthermore,
              customer concentration risk is exceptionally high: Heven’s near-term revenue trajectory is
              disproportionately exposed to U.S. Army program appropriations, task order issuances under its BOA, and
              defense spending cycles. Durability is further tied to hydrogen field support logistics; if austere fuel
              supply chains or fuel-cell field maintenance prove economically or logistically impractical, end-user
              renewal and expansion across frontline operating units could stall.
            claimRefs:
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Procurement Access vs. Committed Program Funding
            body: >-
              Inclusion on the DIU Blue UAS Select list and receipt of an Army Basic Ordering Agreement are essential
              prerequisites for federal adoption, but they are not equivalent to multi-year program-of-record funding.
              Investors and underwriting partners must verify whether task orders under the BOA are actively converting
              into funded delivery milestones.
            calloutType: risk
            claimRefs:
              - CU008
              - CU009
              - CU013
          - type: callout
            title: Hydrogen Ground Logistics as Customer Expansion Constraint
            body: >-
              Heven's customer expansion depends as much on hydrogen fueling availability as on airframe flight
              performance. While a 10-hour flight endurance is highly compelling for persistent ISR, field adoption
              across austere forward operating locations requires repeatable hydrogen generation, safe storage, and
              mobile refueling infrastructure.
            calloutType: insight
            claimRefs:
              - CU002
              - CU006
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              Production scale-up is the highest residual exposure in the assigned evidence. Heven says it opened a
              56,000-square-foot Virginia facility as the first node in a national manufacturing network, while a
              separate company release reported workforce growth from 38 people at year-end 2025 to 88 in July 2026 and
              the current careers page displays 154 employees. Those signals establish speed and organizational change,
              not repeatable output. The company also says the new site is still establishing quality systems,
              supply-chain infrastructure, and operational discipline while recruiting continues. Compliance,
              reliability, and supplier risks therefore remain high-impact until management supplies outcome records
              rather than plans, roles, or facility capacity.
            claimRefs:
              - CR006
              - CR007
