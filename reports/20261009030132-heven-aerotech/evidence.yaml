evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-transparency
    missingEvidence: >-
      Audited GAAP financial statements, detailed monthly revenue figures, annual recurring revenue (ARR), gross margin
      percentages, and cash burn rate.
    whyItMatters: >-
      Without financial disclosures, Heven AeroTech's $1 billion Series B valuation anchor cannot be validated against
      underlying commercial traction or fundamental revenue multiples.
    diligencePath: >-
      Request confidential management financial presentations, audited income statements, and backlog task order
      schedules under NDA during private diligence.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map
    missingEvidence: >-
      Comprehensive cap table detailing exact percentage equity ownership, voting share classes, liquidation
      preferences, and secondary transaction records.
    whyItMatters: >-
      Understanding the exact division of economic control between founder Ben Levinson, lead investor IonQ, and early
      backer Texas Venture Partners is critical for assessing corporate governance and future dilution.
    diligencePath: Obtain certified capitalization table and investor rights agreement during confirmatory legal diligence.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: flight-reliability
    missingEvidence: >-
      Independent flight test telemetry, operational reliability logs, and mean-time-between-failure (MTBF) data across
      extreme weather conditions.
    whyItMatters: >-
      Company-reported flight hours (18,642 hours) and marketing range metrics lack independent third-party verification
      in contested tactical operational environments.
    diligencePath: >-
      Review Department of Defense testing evaluation reports, DIU Blue UAS testing logs, and customer field evaluation
      records.
  - type: private-evidence-only
    severity: material
    topic: contracted-revenue-backlog
    missingEvidence: >-
      Audited figures detailing contracted task-order backlog under U.S. Army Basic Ordering Agreements, firm commercial
      fleet purchase orders, and annual recurring revenue.
    whyItMatters: >-
      Without backlog and delivery figures, investors cannot determine whether customer interest has translated into
      commercial revenue or if the $1 billion valuation is supported by tangible adoption.
    diligencePath: >-
      Request military contract award documentation, BOA task-order delivery schedules, and customer revenue retention
      metrics under NDA.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Buyer-comparable quotes, contract structures, discounts, support fees, and hydrogen-system operating costs for
      Heven and named alternatives.
    whyItMatters: >-
      Without normalized mission pricing, lower endurance alternatives may be cheaper or Heven's total mission economics
      may offset a higher aircraft price.
    diligencePath: >-
      Request recent proposals, task orders, bills of material, support schedules, and three lost-deal price comparisons
      normalized to the same mission.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-and-lock-in
    missingEvidence: >-
      Customer renewal, fleet expansion, multi-homing, retraining, payload migration, hydrogen logistics, and
      internal-build cost evidence.
    whyItMatters: >-
      The strength of switching costs determines whether technical differentiation can translate into retention and
      pricing power.
    diligencePath: >-
      Interview at least five operators and obtain cohort-level reorder, renewal, support, and fleet-standardization
      data.
    relatedQuestionRefs:
      - QP007
  - type: missing-source
    severity: material
    topic: independent-benchmarking
    missingEvidence: >-
      Independent, mission-matched trials comparing endurance, reliability, payload effectiveness, detectability,
      deployment burden, and cost.
    whyItMatters: >-
      Company claims and category descriptions cannot establish superiority or moat durability against direct and
      incumbent alternatives.
    diligencePath: >-
      Obtain government test reports, operator after-action records, and controlled competitor trials using common
      mission profiles.
    relatedQuestionRefs:
      - QP002
      - QP008
      - QP009
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Monthly bookings, funded backlog, deliveries, recognized revenue, revenue mix, pricing, gross margin, CAC proxy,
      and payback.
    whyItMatters: >-
      Without these data, revenue quality, demand conversion, contribution economics, and operating leverage cannot be
      assessed.
    diligencePath: >-
      Obtain management accounts and contract-level cohort schedules, then reconcile them to bank statements, invoices,
      acceptance records, and customer confirmations.
    relatedQuestionRefs:
