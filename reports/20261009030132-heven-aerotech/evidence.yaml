      trade-offs when mounting directed-energy payloads on hydrogen UAS.
    whyItMatters: >-
      High-energy laser claims remain notional concepts; without empirical airborne test records or power-budget
      validation, platform feasibility for directed energy cannot be underwritten.
    diligencePath: >-
