company:
  name: Heven AeroTech
chapter:
  number: 7
  title: Risks
  summary: >-
    Heven AeroTech's most visible near-term risk is execution across a rapid manufacturing,
    workforce, and supplier ramp, while aviation, export-control, privacy, security, and
    hydrogen-system outcome evidence remains largely private. Public hiring, policy, facility,
    and partnership records show mitigations being built, but not yet independently verified
    reliability, compliance, concentration, or financial outcomes.
sections:
  - id: ranked-risk-posture
    title: Ranked risk posture
    body: >-
      Production scale-up is the highest residual exposure in the assigned evidence. Heven says
      it opened a 56,000-square-foot Virginia facility as the first node in a national
      manufacturing network, while a separate company release reported workforce growth from
      38 people at year-end 2025 to 88 in July 2026 and the current careers page displays 154
      employees. Those signals establish speed and organizational change, not repeatable output.
      The company also says the new site is still establishing quality systems, supply-chain
      infrastructure, and operational discipline while recruiting continues. Compliance,
      reliability, and supplier risks therefore remain high-impact until management supplies
      outcome records rather than plans, roles, or facility capacity.
    claimRefs:
      - CR006
      - CR007
      - CR008
      - CR009
      - CR010
      - CR015
      - CR016
    tableRefs:
      - TR002
    figureRefs:
      - FR001
  - id: regulatory-legal-security
    title: Regulatory, legal, and security exposure
    body: >-
      The public record identifies relevant obligations but does not establish their operating
      status. Heven's privacy policy addresses U.S. and international privacy frameworks,
      acknowledges transfers of EEA, UK, and Swiss personal data to the United States, and says
      appropriate safeguards may include standard contractual clauses. It also states that no
      transmission or storage method is completely secure. A company-authored technical-writing
      role covers FAA or other civil authorities, ITAR/EAR awareness, airworthiness, safety, and
      traceable verification documentation. These are sensible control-building activities, but
      a job specification is not evidence of registrations, approvals, completed audits,
      certifications, or an incident-free operating history.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR016
    tableRefs:
      - TR001
  - id: supply-chain-partner-financial
    title: Supply-chain, partner, and financial-model exposure
    body: >-
      The procurement role explicitly assigns management of lead times, capacity constraints,
      supplier performance, audits, disruption mitigation, and contingency planning, which
      confirms that scaling depends on a controlled component and services base. Heven also
      describes operations across the United States, Israel, and other locations, increasing
      export-control, coordination, and continuity demands. IonQ's announcement adds technology
      and governance coupling: its executive was slated to join Heven's board, while quantum
      networking, computing, sensing, and security initiatives were framed as possibilities,
      not delivered capabilities. No assigned source quantifies supplier concentration, backlog,
      customer concentration, burn, working capital, margin, or runway, so financial resilience
      cannot be ranked with false precision.
    claimRefs:
      - CR005
      - CR011
      - CR012
      - CR013
      - CR016
    tableRefs:
      - TR003
  - id: mitigations-monitors-kill-criteria
    title: Mitigations, monitors, and thesis-break criteria
    body: >-
      Visible mitigations include procurement ownership, supplier metrics, proposed compliance
      documentation, new manufacturing leadership, a dedicated facility, export-compliance
      hiring, and a named technology partner. Their maturity is best described as developing
      because the available sources document roles and intentions rather than audited control
      effectiveness. The investment thesis should break if management cannot provide current
      airworthiness and export-control status, hydrogen-system safety and reliability records,
      supplier concentration and on-time delivery data, production yield and rework history,
      customer or program concentration, and a monthly liquidity bridge. It should also break
      if the quantum roadmap is represented as deployed product capability without acceptance
      evidence, or if rapid hiring and facility expansion are not matched by traceable quality
      and delivery performance.
    claimRefs:
      - CR004
      - CR005
      - CR007
      - CR009
      - CR012
      - CR015
      - CR016
