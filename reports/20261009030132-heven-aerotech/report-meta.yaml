companyProfile:
  summary: >-
    Heven AeroTech is a private aerospace and defense company developing hydrogen-powered, runway-independent unmanned
    aerial systems and supporting hydrogen infrastructure for defense, public-safety, and selected commercial missions.
    The company pairs a Blue UAS Select-eligible product line with domestic manufacturing expansion and strategic
    capital from IonQ, but the public record still does not disclose the revenue, backlog, margin, or burn evidence
    needed to underwrite its current valuation anchor with confidence.
