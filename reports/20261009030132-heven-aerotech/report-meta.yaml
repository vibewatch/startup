  topStrengths:
    - Blue UAS Select, Army BOA, and other procurement-access signals reduce initial adoption friction.
    - Hydrogen propulsion and runway independence create a differentiated endurance proposition.
    - Domestic manufacturing expansion and strategic backing support continued execution capacity.
  topRisks:
    - Revenue, backlog, margin, and burn remain undisclosed, limiting underwriting confidence.
    - Hydrogen logistics and field-reliability evidence remain thin relative to the operating claims.
    - Rapid production and workforce scaling could outpace quality control and delivery consistency.
  unresolvedGaps:
    - >-
      Need monthly revenue, backlog, gross-margin, burn, and runway bridges to determine whether the Series B actually
      bought enough time to reach funded-order proof.
    - >-
      Need BOA task-order history, top-customer mix, current customer count, and repeat-order or retention metrics to
      separate procurement access from durable adoption.
    - >-
      Need independent reliability, manufacturing-readiness, and HyTEC field-performance data to test whether hydrogen
      support systems work economically and repeatably in deployed conditions.
