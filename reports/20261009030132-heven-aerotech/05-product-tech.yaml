      whyItMatters: High-energy laser claims remain notional concepts; without empirical airborne test records or power-budget validation, platform feasibility for directed energy cannot be underwritten.
      diligencePath: Request telemetry logs and technical demonstrator results from joint DoD or contractor trials evaluating high-power payloads on the Z1 or Raider airframes.
      relatedQuestionRefs:
        - QE008
    - type: private-evidence-only
      severity: minor
      topic: software-stack-verification
      missingEvidence: Public codebase, SDK documentation, or open developer repository metrics detailing Heven's proprietary mission autonomy and flight software architecture.
      whyItMatters: As a defense hardware and systems provider, software surfaces are proprietary and closed-source, precluding direct open-source practitioner inspection.
      diligencePath: Review software architecture documentation and MOSA interface definitions under NDA during technical due diligence.
