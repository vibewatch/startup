  - id: TE002
    title: Workflow / Use-Case Table
    columns:
      - User Mission
      - Legacy Workflow Constraint
      - Heven Solution
      - Measurable Benefit
      - Operational Limitation
    rows:
      - - Persistent Tactical ISR
        - Battery multirotors limited to 30–45 min flight time; fixed-wing lacks hover
        - Z1 hydrogen multirotor with 10–15 hr endurance and vertical takeoff
        - Up to 4x flight persistence over batteries without runways
        - Weather sensitivity in extreme winds and hydrogen tank refilling requirements
      - - Tactical Resupply / Medevac
        - Ground convoys vulnerable to ambush; manned helicopters costly and high-risk
        - Atlas heavy-lift drone transporting up to 70 lb payloads autonomously
        - Rapid autonomous delivery directly to dispersed tactical units
        - Payload weight directly degrades total operational radius and hover duration
      - - Electronic Warfare / Signals
        - High onboard power draw depletes standard drone batteries rapidly
        - Modular payload bay powered directly from 1.2 kW fuel cell bus
        - Extended on-station RF jamming or signals intelligence without battery swap
        - Payload thermal management and RF interference with avionics
      - - Airborne Directed Energy Carrier
        - High-energy lasers require massive continuous power unavailable on small UAS
        - Raider platform targeting 9 kW fuel cell power generation
        - Magazine depth limited only by onboard fuel rather than kinetic ammunition
        - Severe weight, size, and atmospheric beam jitter constraints remain unsolved
    notes: Mission benefits and constraints derived from defense operational concepts and CEO interview disclosures; laser carrier role represents a prospective technology concept.
