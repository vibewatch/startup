        - Transition from low-rate initial production to high-rate serialized manufacturing
      - - Autonomy & Mission Avionics
        - Autopilot flight control, MOSA compliance, FMEA safety assessments, MATLAB modeling
        - U.S. person systems engineers, Blue UAS compliant electronics, ITAR controls
        - Software validation across complex flight envelopes and GPS-denied environments
