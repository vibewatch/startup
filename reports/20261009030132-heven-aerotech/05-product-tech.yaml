callouts:
  - calloutType: insight
    title: The Energy Density Trade-off in Tactical UAS
    body: By replacing heavy lithium battery packs with lightweight compressed hydrogen fuel cells delivering up to 1.2 kW continuous output on the Z1 and targeting 9 kW on the Raider, Heven achieves multi-hour persistence (up to 10–15 hours claimed) while eliminating thermal and acoustic signatures crucial for tactical survivability.
    claimRefs:
      - CE001
      - CE004
      - CE005
  - calloutType: risk
    title: Airborne Directed Energy Hype vs. Integration Reality
    body: While Heven positions its airframes as motherships for airborne laser weapons, airborne directed energy has faced two decades of Pentagon technical setbacks over size, weight, power, and atmospheric beam turbulence. With the Atlas payload currently capped at 70 pounds, operational airborne laser deployment remains a distant, speculative roadmap item.
    claimRefs:
      - CE007
      - CE008
