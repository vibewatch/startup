figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Heven AeroTech 从以色列无人机初创公司成长为美国总部氢能国防独角兽的时间演进。
    data:
      items:
        - date: '2019-12-01'
          label: 在以色列创立公司
          detail: Bentzion Levinson 在以色列创办 Heven Drones，开发用于无人机系统的氢能推进。
        - date: '2024-01-01'
          label: Series A 融资
          detail: 获得 Texas Venture Partners 的 Series A 投资，机构初始承诺 $4.5M。
        - date: '2025-03-01'
          label: 与 Mach Industries 合作
          detail: 签署战略制造合作协议，在 Mach Industries 的 Forge 工厂提升产量。
        - date: '2025-04-01'
          label: 收购 Zepher Flight Labs
          detail: 收购垂直起降无人机开发商 Zepher Flight Labs，新增位于华盛顿州 Bingen 的制造业务。
        - date: '2025-09-01'
          label: 美国品牌重塑与总部设立
          detail: 从 Heven Drones 更名为 Heven AeroTech，并在弗吉尼亚州 Sterling 设立公司总部。
        - date: '2025-11-01'
          label: DIU Blue UAS Select 认证
          detail: 旗舰 Z1 氢能战术无人机获 Defense Innovation Unit 认证为 Blue UAS Select。
        - date: '2025-12-01'
          label: Series B 独角兽融资
          detail: 完成由 IonQ 领投的 $100M Series B 融资，投后估值 $1.0B，用于扩大国内制造。
        - date: '2026-07-14'
          label: 高管团队扩充
          detail: 任命 Lexi Alexander 为 CGO、Dr. Karen Swider-Lyons 为 VP Hydrogen、Samantha Hamilton 为 VP AI；团队规模达到 88 人。
        - date: '2026-09-02'
          label: 东海岸生产启动
          detail: 在弗吉尼亚州 Winchester 开设 56,000 平方英尺的制造与测试工厂，以扩大国内生产。
    approximationNotes: 日期反映公开披露的日历月份和新闻稿公告；实际注册与交割日期可能略有不同。
    claimRefs:
      - CO001
      - CO004
      - CO007
      - CO009
      - CO011
      - CO012
