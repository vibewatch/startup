  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品概念与客户任务画像
        blocks:
          - type: paragraph
            body: >-
              Heven AeroTech
              设计和制造氢能无人机系统，旨在突破传统电池电动和燃油无人机的续航与运营限制。公司把质子交换膜氢燃料电池与模块化机体结合，瞄准持续情报、监视与侦察（ISR）、战术补给和专用载荷部署。受争夺环境中的战术国防用户使用电池多旋翼时，通常每三十至四十五分钟就要换电池；传统固定翼则需要跑道或复杂发射导轨。Heven
              的垂直起降系统无需跑道，并试图在不依赖脆弱现场电网的情况下提供多小时滞空。这些能力适合前沿补给、伤员后送物流和机动作战编队中的电子战载荷集成。
            claimRefs:
              - CE001
              - CE002
              - CE005
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE007
              - CE008
      - number: '5.2'
        title: 产品线组合与平台成熟度
        blocks:
          - type: paragraph
            body: >-
              公司产品架构覆盖多个运营层级，核心是旗舰 Z1 无人机系统。Z1 是多旋翼平台，已取得国防创新部门 Blue UAS Select 认证，验证网络安全和供应链安全，可立即面向国防部及联邦机构采购。除 Z1
              外，Heven 还有 Atlas 重载无人机，载荷能力为七十磅，用于战术物流、战场货运和装备运输，路线图计划扩至一百磅。在开发中的 Raider 是更高载荷平台，预计可提供最高九千瓦机载燃料电池发电。Z1 是
              Heven 主要生产资产，但更广泛的产品组合强调模块化载荷舱，可在传感器舱、货架和电子战发射器之间快速重构。
            claimRefs:
              - CE003
              - CE006
              - CE007
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE006
              - CE007
      - number: '5.3'
        title: 推进架构与系统集成
        blocks:
          - type: paragraph
            body: >-
              Heven 系统的技术核心是混合电推进架构，使用轻质气态氢燃料电池，而非液态烃或锂电池。旗舰 Z1 配备 1.2
              千瓦燃料电池堆，使用不到一磅压缩氢，储存在超高压碳复合材料罐中，飞行中发电，声学噪声和热排放信号几乎为零。与内燃机相比，这种低可探测特征能提升受争夺运营域的战术生存能力。Heven West 位于华盛顿州
              Bingen 的系统工程团队使用基于模型的系统工程、自动驾驶仪飞行遥测分析和 MATLAB
              建模，开展权衡研究、失效模式与影响分析（FMEA）及硬件集成。平台软件和航电遵循模块化开放系统方法（MOSA）及适用军用适航标准，便于快速接入航电、第三方传感器和地面控制站。
            claimRefs:
              - CE004
              - CE010
              - CE011
