  - id: FE001
    title: 产品架构图
    type: stack
    summary: Heven AeroTech 氢能无人机平台从战术加氢到任务自主的分层架构。
    data:
      layers:
        - label: 任务与自主层
          detail: 任务规划软件、自主航点导航、Autopilot 遥测记录，以及模块化开放系统架构（MOSA）合规。
        - label: 载荷与传感器集成层
          detail: 支持云台 EO/IR ISR 炮塔、RF/EW 干扰套件或战术货舱的战术级快速换装模块接口。
        - label: 飞控与航空电子层
          detail: 三重冗余飞控计算机、符合 MIL-STD 的线束、GPS 受限导航传感器和 Blue UAS 网络安全加固。
        - label: 电推进与空气动力学层
          detail: 高效无刷直流电机、定制碳复合材料多旋翼机臂与螺旋桨，以及轻量化气动机身。
        - label: 氢燃料电池动力系统层
          detail: 1.2 kW 质子交换膜（PEM）燃料电池，将气态氢转化为持续电力，且没有声学或热特征。
        - label: 氢储存与地面支持层
          detail: 超轻型加压碳纤维复合氢燃料罐（H2 质量低于 1 lb），搭配战术移动现场加氢单元。
    approximationNotes: 层级结构基于公开系统工程披露和高管访谈，代表 Z1 平台的逻辑系统拆解。
    claimRefs:
      - CE003
