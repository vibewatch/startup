      - number: '2.4'
        title: 采用驱动因素、结构性瓶颈与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Heven AeroTech 的氢能无人机架构受到三股运营顺风推动：地缘限制升级后，对主权化本土制造的需求上升；近期地区冲突凸显了多小时自主战术 ISR
              的必要性；联邦机构持续提出零排放运营要求。公司为响应本土制造需求，在弗吉尼亚州 Winchester 建成 56,000 平方英尺工厂，90
              天内落地，作为计划中的全国制造网络首个枢纽。但结构性约束仍严重压制采用速度。最大瓶颈是氢能物流：电池可从商业电网充电，柴油可用既有军方库存，而氢燃料电池需要专用制氢、加压储存拖车和前沿阵地认证操作流程。更高的前期购机资本、专门技师培训和不确定的二手残值也是限制。尽调缺口很大：公开信息没有披露单位交付量、每小时飞行历史维护成本或商业客户留存率。投资人必须确认
              HyTEC 制氢和补氢系统能否以经济方式在军方规模部署，还是氢能物流会把应用限制在专用演示机上；投资人还必须判断这套系统能否支撑 $1 billion 估值。
            claimRefs:
              - CM007
              - CM008
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 专题
        blocks:
          - type: callout
            title: 氢能市场能否成立取决于完整产品物流
            body: >-
              在无人系统领域，如果忽视补氢基础设施，仅销售续航更强的机体不足以获得经常性支出。Heven AeroTech
              把制氢、安全储存和移动拖车支持纳入产品，正面回应了商业和军方运营者采用氢能技术的主要障碍。客户是否愿意部署 Heven 的 Z1 或 Raider，直接取决于这些配套系统能否消除工业氢源获取的运营摩擦。
            calloutType: insight
            claimRefs:
              - CM002
              - CM007
              - CM015
          - type: callout
            title: 估值与商业采购现实的偏离
            body: >-
              Heven AeroTech 在 B 轮后的 $1 billion
              投后估值，反映了风险资本和战略投资人对主权国防技术及量子集成的强烈热情。但具体的公开采购记录显示，采用仍处于原型演示和首次基本订购协议阶段。若没有经审计的商业机队重复销售或大规模多年生产合同披露，一旦国防任务单转化滞后，估值就面临明显压缩风险。
            calloutType: risk
            claimRefs:
              - CM008
              - CM010
              - CM016
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              竞争格局很广，尚未形成清晰分层。一家市场数据源将 Forterra、Roark Aerospace、Dominion Dynamics、ideaForge、Swarmer 和 Xtend AI Robotics
              列为可比公司；另一家则追踪十个替代方案，覆盖军用生产、公共安全、战术 ISR、企业 UAS、测绘和通用无人机。Mach Industries
              尤其关键：留存证据同时把它描述为美国生产伙伴和相邻直接竞争者，因此双方关系既有赋能性也有竞争性。BRINC、Vantage Robotics、Parrot 和 DJI 代表其他买方路径。内部开发、现有飞机、电池
              UAS 和继续人工操作也是合理替代方案，但指定来源没有量化其采用率或经济性，因此将其视为尽调缺口，而非计分竞争者。
            claimRefs:
              - CP007
