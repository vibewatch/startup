      - number: '2.2'
        title: 市场规模测算视角与可触达支出估算
        blocks:
          - type: paragraph
            body: >-
              评估氢能战术及商业 UAS 的可触达市场，不能只看单一自上而下预测，而要结合多个分析视角。全球国防和商业航空航天的无人系统支出每年超过数百亿美元，但氢能平台仍处于早期演示和首次采购阶段。Group 1 至
              Group 3 战术 UAS 支出构成理论 TAM，受西方国防预算扩张、反无人机需求和持续 ISR 需求推动。SAM 则限定在同时需要超过两小时航时、无需跑道和低声学特征的任务，具体包括战术军事
              ISR、前线补给和大型公用设施走廊巡检。SOM 更窄，只覆盖具备 NDAA 合规、Blue UAS
              认证等国内采购权限且已有氢能燃料接入的国防和主权公共安全买家。独立研究和行业报告认为，企业无人机总体采用稳步扩大，但氢能推进仍受加氢基础设施和专用机体单位经济性限制。Heven 以 $100 million B
              轮和 $1 billion 估值融资，体现投资人押注氢能 VTOL 将在战术国防采购中占据决定性份额；但公开记录仍没有独立交易及订单积压证据证明商业机队采购已规模化。
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
