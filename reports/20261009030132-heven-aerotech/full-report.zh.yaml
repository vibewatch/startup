      - number: '1.3'
        title: 资本化历程与投资者生态
        blocks:
          - type: paragraph
            body: >-
              Heven AeroTech 于 2025 年 12 月完成 $100 million B 轮融资，投后估值达到 $1.0 billion，成为国防科技独角兽。领投方是商业量子计算公司 IonQ，早期投资者
              Texas Venture Partners 继续跟投。公司披露的机构股权资本超过 $104.5 million，包括 B 轮资金和 2024 年完成的 $4.5 million A 轮。除资金支持外，Heven
              还与国防工业体系建立企业合作：在加州制造基地与 Mach Industries 联合生产，并与 IonQ 持续共同开发量子传感和导航算法。由于 Heven 仍是股权高度集中的非上市公司，年经常性收入、GAAP
              净收入、毛利率和现金消耗等基本运营指标仍未披露；外部投资判断因此依赖对合同交付计划和国防部采购任务单的核验。
