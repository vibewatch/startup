              - CE014
      - number: '5.4'
        title: 制造扩张、适航与技术风险
        blocks:
          - type: paragraph
            body: >-
              为把氢能 UAS 从小批量制造转为工业化连续生产，Heven AeroTech 启动全国多地点制造网络，并以弗吉尼亚州 Winchester 新开的 56,000 平方英尺工厂为核心，补充其在 Columbia
              River Gorge 的工程和制造业务。公司还招募了包括 Dr. Karen Swider-Lyons 在内的资深航空航天和替代能源高管；她曾负责美国海军研究实验室的燃料电池 UAV
              研究，现负责氢能推进扩张。但材料工程和运营尽调风险仍在。公司把机体定位为搭载空中高能激光武器的潜在母机，这与五角大楼二十年定向能研究形成鲜明反差；后者长期受重量、光束抖动和散热难题困扰。此外，氢能 UAS
              的现实部署会增加远征物流负担，需要高压现场补氢设施和有纪律的氢能供应链。
            claimRefs:
              - CE008
              - CE009
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: 专题
        blocks:
          - type: callout
            title: 战术 UAS 的能量密度权衡
            body: >-
              用轻质压缩氢燃料电池替代沉重锂电池组，Z1 可持续输出最高 1.2 kW，Raider 的目标是 9 kW；Heven 因此实现多小时持续任务（声称最高 10–15
              小时），同时消除对战术生存至关重要的热和声学信号。
            calloutType: insight
            claimRefs:
              - CE001
              - CE004
              - CE005
          - type: callout
            title: 空中定向能武器热潮与集成现实
            body: >-
              Heven 将机体定位为空中激光武器的母机，但空中定向能技术过去二十年一直受五角大楼技术挫折拖累，问题包括尺寸、重量、功率和大气光束湍流。Atlas 当前载荷上限为 70
              磅，因此可实际部署的空中激光仍是遥远且带有投机性的路线图项目。
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
  - number: 6
    title: 客户
    sections:
