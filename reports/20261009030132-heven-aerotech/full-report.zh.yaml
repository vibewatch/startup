        title: 客户群分层与目标需求
        blocks:
          - type: paragraph
            body: >-
              Heven AeroTech
              将目标市场分为国家安全国防机构、民间应急和公共安全部门，以及关键基础设施巡检运营商。主要付费客户是联邦国防部门，包括美国陆军、美国特种作战司令部（USSOCOM）、战区司令部和盟军，需要长航时、无需跑道的 UAS
