        blocks:
          - type: paragraph
            body: >-
              Heven AeroTech 的采用轨迹已从以色列早期原型转向美国境内的快速工业部署。为满足联邦国防要求，公司把全职员工从 2025 年底的 38 人增至 2026 年年中的 88 人（增长 132%），并在
              90 天内建成弗吉尼亚州 Winchester 的 56,000 平方英尺工厂。该设施为 Z1
