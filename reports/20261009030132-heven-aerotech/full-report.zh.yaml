      - number: '1.2'
        title: 高管团队与治理结构
        blocks:
          - type: paragraph
            body: >-
              Heven AeroTech 的高管团队结合了军事行动经验、国防工业管理能力和联邦业务拓展经验。公司由 CEO Ben Levinson 创立；他曾任以色列国防军作战军官，毕业于 Stanford
              Graduate School of Business，创办公司是为了解决低技术战术反无人机和长航时空中监视的关键限制。以色列业务总裁 Yossi Weiss 曾任 Israel Aerospace
              Industries CEO，带来四十多年一线国防航空制造和国际项目执行经验。2026 年 7 月，公司任命 Lexi Alexander 为首席增长官，显著增强联邦采购和运营扩张能力；技术团队还包括氢能副总裁
              Dr. Karen Swider-Lyons、人工智能副总裁 Samantha Hamilton 和制造负责人 Gaston Paz。扩张期间，公司把美国本土全职员工从 2025 年底的 38 人增至 2026
              年年中的 88 人，并协调分布在美国和以色列设施的全球技术团队。
