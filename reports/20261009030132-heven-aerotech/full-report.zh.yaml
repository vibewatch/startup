        title: 风险排序
        blocks:
          - type: paragraph
            body: >-
              在指定证据中，生产放量是最大剩余暴露。Heven 称其开设了 56,000 平方英尺弗吉尼亚工厂，作为全国制造网络首个节点；另一份公司公告称，员工从 2025 年底的 38 人增至 2026 年 7 月的 88
              人，当前招聘页面则显示 154
              名员工。这些信号证明速度和组织变化，却不证明产出可重复。公司还表示新基地仍在建立质量体系、供应链基础设施和运营纪律，同时继续招聘。因此，在管理层拿出结果记录而非计划、岗位或产能之前，合规、可靠性和供应商风险仍然具有高影响。
