  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、反论点与建议立场
        blocks:
          - type: paragraph
            body: >-
              Heven AeroTech 的核心投资论点，是在氢燃料电池无人机系统（UAS）中建立可防御的特许经营地位，为极端航时和受争夺运营环境服务。旗舰 Z1 声称航时超过 10 小时、作战航程超过 600
              英里，解决关键国防部任务的电池续航限制。其 DIU Blue UAS Select
              资质为联邦任务伙伴提供即时采购通行证。但反论点在于：商业单位经济性未经验证，二手市场尚未证明，国内工厂铺开伴随很高执行风险。尽管主权制造顺风明显，公开披露仍缺少经审计的年经常性收入、已签署的确定订单积压和多年生产毛利。权衡快速战略定位与不透明基本面后，本次尽调建议继续研究，信心中等、风险高，估值立场偏贵。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
