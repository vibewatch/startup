            tableRef: TP003
            claimRefs:
              - CP011
      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              最有潜力的护城河，是把长航时氢能推进、机体与载荷工程、自主软件和本土制造整合起来。但同样的广度也带来执行风险：每一层都要在运营约束下工作，而现有厂商或资金充足的新进入者可以单攻其中一层，无需复刻全栈。Tectonic
              Defense 报道了 Heven 对 Z1 十小时续航和 600 英里航程的说法，以及其 Blue UAS Select 资质；同时也引用管理层对量子集成中热、振动、屏蔽和软件验证难题的描述。Heven
              2026 年内容议程还延伸到空中激光武器、应急响应和区域制造，提升了战略期权价值，也扩大了执行面。没有独立对比试验、续约行为、胜负记录和任务级成本数据，差异化概念可信，但尚未证明具备持久性。
            claimRefs:
              - CP005
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: 专题
        blocks:
          - type: callout
            title: 差异化尚未完成基准对比
            body: 公开证据支持其架构独特且在扩张，但没有展示独立获胜率、任务可靠性对比、任务总成本或客户转换行为。应把护城河视为待尽调的投资假设，而不是已经证明的结果。
            calloutType: risk
            claimRefs:
              - CP011
              - CP015
              - CP016
