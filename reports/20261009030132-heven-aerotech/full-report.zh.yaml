      - number: '8.2'
        title: 融资历程、股权结构表动态与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Heven AeroTech 于 2025 年 12 月 1 日成为独角兽，完成由纽约证券交易所上市量子计算公司 IonQ 领投、早期机构投资人 Texas Venture Partners 跟投的 $100M
              B 轮股权融资。该轮以 $900M 投前估值建立 $1.0B 投后锚点，使公开披露的累计股权融资约为 $100M 至 $115.2M。Forge Global
              等私募二级流动性追踪机构指出交易活动有限、尚无确定的撮合价格，而一级市场每股价格仍未披露。机构入场必须谨慎：按隐含 $1.0B 市值、估计员工 50 至 100 人并向 150
              人扩张计算，公司每名员工对应的企业估值为 $10M 至 $20M。若没有经审计收入或美国陆军 BOA 的任务单回款，生产放量慢于现金消耗时，投资人将面临严重的清算优先权悬置和倍数压缩风险。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: 估值情景、国防科技可比公司与尽调要求
        blocks:
          - type: paragraph
            body: >-
              评估 Heven AeroTech，需要拿 Anduril Industries、Mach Industries 和 Brinc
              等国防自主系统及无人航空同业做基准比较。风险投资支持的国防硬件公司在项目定型快速转换期的远期收入倍数为 12.0x–25.0x，而 Heven AeroTech
              未披露收入，因此必须采用情景法评估。基准情景下，公司靠陆军任务订单和主权制造交付，在 2027 年实现 $50M 年收入，对应 $600M–$750M 的公允价值估值（12.0x–15.0x 远期倍数）；当前
              $1.0B 轮融资已计入较高的未来执行预期。氢能物流瓶颈、争议环境下的现场支持失效，或失去 Blue UAS 资质，都可能触发下行，使公司估值向低于 $250M
              的清算价值重估。最终尽调需要取得经审计的试验结果、任务订单交付排期，以及氢燃料电池单机制造成本。
            claimRefs:
              - CV012
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV008
              - CV011
              - CV014
              - CV016
      - number: '8.4'
        title: 展品
        blocks:
          - type: callout
            title: 资本纪律胜过炒作：不要追逐 $1.0B 独角兽标志
            body: >-
              Heven AeroTech 已经积累了亮眼的国防履历，也获得 IonQ 等头部战略方支持；但在没有经审计财务披露的情况下，仍按 $1.0B
              投后估值做投资判断，会让成长型投资者暴露于严重的估值压缩风险。潜在投资者应把直接查阅任务订单交付排期、单机物料清单成本和经核实客户留存情况作为参与前提。
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV008
              - CV012
