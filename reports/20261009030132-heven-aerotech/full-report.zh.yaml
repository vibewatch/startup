  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、范围与现有替代方案
        blocks:
          - type: paragraph
            body: >-
              Heven AeroTech 的可触达市场位于战术无人机系统（UAS）与专用零排放长航时飞行的交叉地带。无人航空长期分化为两类：受 20 至 45
              分钟航时限制的小型锂电多旋翼，以及需要专用跑道、热和声信号明显、物流链沉重的化石燃料战术固定翼或旋翼平台。Heven 的市场边界聚焦垂直起降（VTOL）和重载多旋翼平台，以氢燃料电池推进实现 3 至 12
              小时航时且无需跑道。可计入支出的场景包括国防战术情报、监视与侦察（ISR）、边境与周界安防、战术补给、公共安全空中监测和工业基础设施巡检；不包括消费娱乐无人机、城市空中客运、超过 500
              千克的重型战略货机及低价农业测绘。现有替代品包括 Skydio、Teal 等 Group 1 至 Group 3 电池无人机，Insitu ScanEagle、Textron Shadow 等内燃机战术
              UAV，以及 Bell
              直升机等有人旋翼航空。锂电系统采购成本低、充电简单，但短滞空时间迫使运营者购置并轮换多套机体和电池；化石燃料平台续航长，却带来噪声、复杂燃料物流和高小时飞行总成本。氢能推进试图用安静的电机、高能量密度和五分钟快速补氢化解这一矛盾。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
          - type: table
