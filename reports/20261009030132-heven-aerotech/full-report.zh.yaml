      - number: '6.4'
        title: 合同持久性、留存与集中度脆弱性
        blocks:
          - type: paragraph
            body: >-
              私营国防市场不透明，严重限制了客户留存和收入持久性的判断。净收入留存率（NRR）、总收入留存率（GRR）、群组续约率和平均合同金额等核心经常性指标均未在公开披露中出现。客户集中风险也极高：Heven
              近期收入轨迹高度暴露于美国陆军项目拨款、BOA 下任务单的发出和国防支出周期。持久性还取决于氢能现场支持物流；若简陋前沿阵地的燃料供应链或燃料电池现场维护在经济或物流上不可行，一线作战单位的续约和扩张可能停滞。
            claimRefs:
              - CU012
              - CU013
              - CU014
