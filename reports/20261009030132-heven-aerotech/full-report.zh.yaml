              million
              投资。公司将新资金投向本土制造、制氢与物流基础设施及先进系统研发，说明本轮融资既要支撑工业产能，也要继续开发产品，而非只做低资本软件扩张。历史融资时间线应放在公司概览；财务判断的关键是未来资金是否足够。指定来源没有披露现金、会计亏损、现金消耗、现金跑道、债务、项目融资义务或已承诺资本支出。因此，融资额不能视为可用现金，也不能换算成几个月的现金跑道。
