            title: 采购准入与已承诺项目资金
            body: DIU Blue UAS Select 名单和陆军基本订购协议是联邦采用的必要前置条件，但不等于多年正式项目资金。投资人和投资判断合作方必须核实 BOA 下的任务单是否正在转化为有资金保障的交付里程碑。
