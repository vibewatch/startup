      - number: '3.3'
        title: 规模、分销与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              资本和制造能力可以放大 Heven 的竞争地位，但证据仍主要来自公司。Multiples 报道了 $100 million B 轮和 $1 billion 估值；付费公司新闻稿称，全职员工从 2025 年底的
              38 人增至 2026 年 7 月的 88 人。另一份公司公告将 56,000
              平方英尺的弗吉尼亚设施描述为计划中的全国制造网络首个东海岸节点。这些指标证明了扩容投入，却不能证明出货量、单位成本、交付可靠性或渠道力量。留存证据没有披露公开报价、实际合同价格、支持费、氢能系统成本、折扣结构或竞争者套餐。买方转换成本、锁定、多归属行为及自建经济性因此仍是重要的投资判断缺口。
            claimRefs:
              - CP006
              - CP011
              - CP012
              - CP013
