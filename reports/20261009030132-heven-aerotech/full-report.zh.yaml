      - number: '1.4'
        title: 运营里程碑与扩张轨迹
        blocks:
          - type: paragraph
            body: >-
              自成立以来，Heven AeroTech 已从早期多旋翼原型转向美国工业化制造和正式联邦项目资质。2025 年 11 月，旗舰 Z1 氢能战术 UAS 被国防创新部门列为 Blue UAS
              Select，验证供应链合规，并为国防部各机构的简化采购扫清障碍。为满足美国特种作战司令部和国际盟友的预期交付，公司于 2026 年 9 月在弗吉尼亚州 Winchester 启用 56,000
              平方英尺区域工厂，建立首个东海岸装配网络。同时，公司启动量子工程部门，为受争夺、无 GPS 的战术环境嵌入 IonQ
              导航和传感器融合能力。但把量子处理器装上战术飞行平台会带来严峻工程难题：量子组件需要严格热管理、动态减振和电磁屏蔽，这些要求与战术无人机的重量、噪声和气动约束相冲突。
