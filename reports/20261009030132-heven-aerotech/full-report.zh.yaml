      - number: '3.2'
        title: 能力差异化与产品范围
        blocks:
          - type: paragraph
            body: >-
              Heven
              的可观察定位把氢能飞行器与不断扩展的任务栈结合起来。公司招聘信息显示，其工作覆盖感知、跟踪、传感器融合、任务级决策、规划、飞控、机载计算、载荷和指挥系统；另一则工程招聘强调可制造复合材料机体、结构验证、载荷集成及从原型转向生产。这些信号支持“系统集成”差异化逻辑，而不只是推进系统故事。但它们不能证明
              Heven 在受争夺环境、可靠性、载荷效果或任务总成本上胜过竞争者。因此，功能矩阵把没有依据的竞争者单元标为未知，避免把招聘意图或供应商说法当成已验证的实地表现。
