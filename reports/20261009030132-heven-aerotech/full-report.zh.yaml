    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与运营版图
        blocks:
          - type: paragraph
            body: >-
              Heven AeroTech, Inc. 是一家美国航空航天与国防科技公司，专注开发氢能、无需跑道的无人机系统（UAS），用于长航时任务。公司由创始人 Benzion Levinson 于 2019
              年在以色列创立，当时名为 Heven Drones；2025 年收购 Zepher Flight Labs 后更名，并将全球总部迁至弗吉尼亚州 Sterling。如今，公司把北弗吉尼亚的管理和监管事务、弗吉尼亚州
              Winchester 的 56,000 平方英尺制造测试园区、华盛顿州 Bingen 的无跑道飞行集成设施，以及以色列 Mevo Carmel 的专项研发串成分布式运营网络。其重点是部署旗舰 Group 2/3
              级 Z1 和重载系统，以自研氢燃料电池推进及按需补氢硬件，为国防、边境监视、公共安全和战术物流客户提供关键的多小时滞空能力，覆盖受争夺且基础设施受限的环境。
