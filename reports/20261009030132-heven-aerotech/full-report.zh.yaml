  - id: FV001
    title: 建议决策链与资本配置逻辑
    type: flow
    summary: 将技术证明、主权级国防认证、估值定价和最终投资立场串联起来的系统性多阶段闸门逻辑。
    data:
      nodes:
        - id: step-1
          label: 飞行续航证明
          detail: Z1 平台通过氢燃料电池验证 10+ 小时续航和 600+ 英里航程
        - id: step-2
          label: 联邦采购准入
          detail: DIU Blue UAS Select 认证打开即时 DoD 采购路径
        - id: step-3
          label: 战略资本流入
          detail: IonQ 领投的 Series B 融资额为 $100M，估值 $1.0B，用于工厂建设
        - id: step-4
          label: 估值与基本面闸门
          detail: ARR 为零披露、订单积压缺失且二级流动性未经证明，考验入场纪律
        - id: step-5
          label: 下行情景压力测试
          detail: 在合同回款未披露的情况下，评估现金消耗相对于清算阈值的状况
        - id: step-6
          label: 最终两难决策
          detail: 估值偏高且现金消耗未经验证，因此建议继续研究
      edges:
        - from: step-1
          to: step-2
        - from: step-2
          to: step-3
        - from: step-3
          to: step-4
        - from: step-4
          to: step-5
        - from: step-5
          to: step-6
    approximationNotes: 流程展示作者从已验证硬件性能走向价格纪律型建议的逻辑推进。
