      - number: '2.3'
        title: 买方分层、预算归属与采购路径
        blocks:
          - type: paragraph
            body: >-
              Heven AeroTech
              不同客户群的采用路径和预算归属差异很大。国防领域的主要买方是美国国防部及盟国国防部，预算由战术航空项目执行办公室、特种作战司令部（USSOCOM）和战区司令部掌握。采用触发点是：在受争夺或无 GPS
              环境下，需要持续自主 ISR，且不能依赖易受攻击的中央跑道。采购受 NDAA 和 DIU Blue UAS 等联邦合规要求严格把关。Z1 获 Blue UAS Select
              资质后，军方单位可直接下达任务单，无需定制适航豁免，采购摩擦下降。公共安全和应急响应买家包括州和地方执法部门、联邦灾害机构及区域消防服务；其预算负责人关注自然灾害、搜救和危险品泄漏监测中的长时间空中监视，但预算高度价格敏感、常依赖拨款，采购周期比国防项目更长且更难预测。工业基础设施巡检的经济买家是能源、公用事业和电信企业资产所有者，关注每小时飞行总成本、传感器稳定性和停机时间。氢能无人机虽能减少巡检管线或输电线路所需机体数量，但在没有区域氢能供应协议保障前，企业买家极不愿采用非标准加氢生态。
            claimRefs:
