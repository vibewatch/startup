            title: 从区域无人机制造商到军民两用国防独角兽的战略转型
            body: >-
              Heven AeroTech 从以色列农业及商业无人机开发商 Heven Drones 快速转向总部在美国的国防独角兽，说明公司在主动贴合国防部采购要求。公司收购 Zepher Flight Labs
              取得无需跑道的机体，为 Z1 拿到 DIU Blue UAS Select 资质，并与 IonQ 合作开发无 GPS 战区的量子导航，由此围绕长航时战术 UAS 建立了显著的战略防御性。但要支撑 $1.0
              billion 估值，仍需核验弗吉尼亚制造扩张是否转化为有资金保障的军方正式项目和经常性收入。
