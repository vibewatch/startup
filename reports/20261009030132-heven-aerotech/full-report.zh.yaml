      - number: '6.3'
        title: 具名客户证明与国防采购工具
        blocks:
          - type: paragraph
            body: >-
              公开可识别的客户证明，主要来自正式政府采购准入和战略分销渠道，而非传统企业 SaaS 或商业销售。旗舰 Z1 氢能 VTOL UAS 被纳入 DIU Blue UAS
              Select，证明其符合国防部严格的网络安全、零部件来源和任务就绪标准。此外，Heven 取得美国陆军基本订购协议（BOA），并与国防物流专业公司 SupplyCore 建立分销合作。BOA
              只是联邦任务单的授权合同通道，不保证拨款或具有约束力的采购承诺，因此具体订单积压、订单金额和交付计划仍未核实。
            claimRefs:
