              的公告又带来技术和治理耦合：其高管计划加入 Heven
              董事会，量子网络、计算、传感和安全计划被描述为可能性，而非已交付能力。指定来源没有量化供应商集中度、订单积压、客户集中度、现金消耗、营运资本、利润率或现金跑道，因此不能用虚假精度给财务韧性排序。
