      - [Mach Industries, "Not disclosed", "Not disclosed", "Production relationship noted; package unknown", "Partner economics and channel margin unknown", "Separate partner value from competitive overlap"]
      - [BRINC, "Not disclosed", "Not disclosed", "Public-safety and tactical focus only", "Hardware, software, and service split unknown", "Request comparable mission configuration"]
