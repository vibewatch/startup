callouts:
  - calloutType: risk
    title: Differentiation has not yet been benchmarked
    body: >-
      Public evidence supports a distinctive architecture and scaling effort, but it does not show
      independent win rates, comparative mission reliability, total mission cost, or switching
      behavior. Treat the moat as a diligence thesis rather than a demonstrated outcome.
    claimRefs: [CP011, CP015, CP016]
