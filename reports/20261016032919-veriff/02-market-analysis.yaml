callouts:
  - calloutType: insight
    title: The category is widening from point KYC into ongoing trust infrastructure
    body: >-
      The most important market change is not only more demand for onboarding IDV; it is the shift
      toward repeat authentication and adjacent trust workflows that raise lifetime budget relevance
      for vendors that can stay in the transaction flow after signup.
    claimRefs: [CM003, CM004, CM012]
  - calloutType: risk
    title: Public evidence still does not isolate a priced SAM
    body: >-
      The assigned pool is strong enough to show footprint, segment mix, and demand intensity, but
      not strong enough to price Veriff's monetizable slice by buyer, geography, or workflow. That
      keeps market-size confidence below what a valuation model would ideally require.
    claimRefs: [CM014, CM015]
