schemaVersion: "report-v2"
artifact: market-analysis
slug: veriff
runDate: 2026-10-16
company:
  name: Veriff
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Veriff's public evidence supports a focused identity-verification and trust-infrastructure
    thesis, not a generic cybersecurity TAM. The strongest public sizing lenses are observable
    adoption metrics - 6sense's 485 current customers and 2.62% category share, Veriff's claim
    of 30x authentication growth, and third-party reporting that the company now serves 3,000+
    enterprise customers - while the main remaining gap is a third-party TAM/SAM/SOM estimate
    tied to buyer budgets.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Veriff's clearest public category anchor is identity verification and protection, with the
      company selling a workflow that starts at document and selfie capture but extends into
      liveness, sanctions, PEP, adverse-media, and ongoing monitoring. That places the core
      addressable market inside digital trust, KYC, fraud prevention, and authentication budgets
      rather than inside all cybersecurity or generic compliance software spend. The boundary also
      excludes broader case-management, AML analyst tooling, and unrelated payments or cloud
      infrastructure. Status-quo substitutes still matter: manual review, branch or in-person
      identification, and legacy point solutions remain viable when buyers do not yet need
      persistent authentication or global document coverage.
    claimRefs: [CM001, CM002, CM013]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Observable sizing lenses and public market position
    body: >-
      The chapter can size Veriff's market only through observable footprint and demand lenses, not
      through a defensible public TAM/SAM/SOM stack. 6sense estimates 485 current customers, 2.62%
      market share, and the #9 position in its Identity Verification and Protection category, while
      the same dataset clusters visible customers in fintech, technology, blockchain, and financial
      services. Third-party and company sources also show demand expanding geographically, with
      Latin America called out as a fast-growth region and expansion continuing across the Middle
      East, Africa, and APAC. Those signals show a large and widening category, but they still stop
      short of a clean dollar-denominated market model for Veriff's monetizable spend.
    claimRefs: [CM005, CM006, CM007, CM008, CM014]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-budget
    title: Buyers, users, and budget ownership
    body: >-
      The observable buyer map is enterprise-first and workflow-specific. Public examples place
      Veriff across financial services, marketplaces, mobility, gig-economy, gaming, and other
      digital-native sectors where a business must onboard a user, decide whether to trust that
      user, and often re-authenticate them later. The user is the end customer taking a document
      photo and selfie, but the buyer and payer are the enterprise teams choosing fraud controls,
      onboarding friction, compliance scope, and verification economics. That strongly suggests
      budgets sit with compliance, fraud/risk, trust-and-safety, or onboarding operations leaders,
      not with end-user consumers or centralized CIO line items alone.
    claimRefs: [CM009, CM010, CM011]
    tableRefs: [TM003]
  - id: drivers-and-constraints
    title: Demand drivers, adjacencies, and constraints
    body: >-
      Demand is being pulled by two linked shifts: AI-enabled fraud is increasing the cost of weak
      identity controls, and buyers increasingly want identity tools that persist after onboarding
      into repeat authentication and broader trust infrastructure. Independent coverage ties this
      shift to synthetic identities, deepfakes, and reusable-digital-identity workflows, while
      recent 2026 update signals show Veriff stretching into address verification and right-to-work
      checks. The same market remains constrained by trust and regulatory sensitivity. Buyers still
      need evidence on how much spend sits in recurring authentication versus first-time KYC, what
      budgets are segment specific, and whether regulation or implementation friction slows adoption
      in more conservative sectors.
    claimRefs: [CM003, CM004, CM012, CM015]
