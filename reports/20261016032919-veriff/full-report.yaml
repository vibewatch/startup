      - number: '1.4'
        title: Milestones that still matter for refresh work
        blocks:
          - type: paragraph
            body: >-
              The milestone arc in the evidence pool is coherent: Veriff was founded in 2015, financed aggressively from
              2018 through 2022, added certification and risk-scoring milestones in 2023, and in late 2025 publicly
              claimed a new operating threshold of profitability and revenue above $100M. For a refresh reader, the key
              takeaway is that product and commercial momentum still looks real, but public-company-style disclosure has
              not caught up. The most current operating update is company-issued, while the most current valuation
              signal remains a stale 2022 financing benchmark. Separately, Wikipedia's current article reports that a
              late-2025 incident exposed identity-document images and personal information of about 8,583 Total Wireless
              customers and led to class-action claims. That secondary account makes incident scope and legal status a
              live diligence item, but the assigned pool does not contain the underlying regulator notice or case
              docket. Without fresher primary capital-market and incident evidence, later chapters should avoid false
              precision on valuation or liability.
