              - CR013
              - CR014
              - CR015
      - number: '7.2'
        title: Regulatory, legal, and privacy exposure
        blocks:
          - type: paragraph
            body: >-
              The regulatory risk is structural because Veriff's own materials frame identity verification as a moving
              target: its education center says businesses struggle to keep up with evolving global regulations, and its
              product page adds sanctions screening, adverse media, and ongoing monitoring into the offering. That
              widens the control surface from onboarding accuracy to ongoing compliance monitoring, which raises the
              cost of stale rules, stale watchlists, or incomplete jurisdictional coverage. The sharpest adverse signal
              in the assigned pool is a Wikipedia summary of late-2025 Total Wireless notices and follow-on class-action
              litigation tied to data stored in Veriff systems. Because the pool does not include the underlying
              notices, complaints, or any company postmortem, the issue is important but not yet cleanly bounded; the
              practical diligence posture is to treat it as a high-severity legal and privacy exposure until primary
              records prove otherwise.
            claimRefs:
              - CR002
              - CR003
              - CR008
              - CR009
              - CR010
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR008
              - CR009
              - CR010
              - CR015
      - number: '7.3'
        title: Operating and dependency risks
        blocks:
          - type: paragraph
            body: >-
              Operating risk sits at the junction of accuracy, speed, and enterprise integration. Veriff advertises a
              6-second average verification time, 98% automation, and 95% first-try success for genuine users, but AI
              Scanner still lists verification-speed variability as a weakness and explicitly recommends SLA review
              before commitment. That pattern suggests the key execution risk is not whether Veriff can verify
              identities at all, but whether it can keep latency, manual-review load, and false decisions inside
              customer tolerances as fraud tactics shift. Dependency risk is also meaningful. The company highlights
              recent wins with Western Union, Instacart, Uber, and Bumble, while Alloy markets Veriff as a partner
              inside broader AML/KYC workflows. Those signals support real enterprise reach, but public evidence in the
              assigned pool does not disclose top-customer revenue share, contract duration, renewal dependence, or how
              much of the compliance workflow depends on third-party channels and data feeds. That keeps counterparty
              and concentration downside materially underwritten by private diligence rather than by public proof.
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR009
              - CR013
              - CR014
      - number: '7.4'
        title: Diligence gates and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The investment implication is that Veriff's public mitigations are credible enough to keep the company in
              diligence, but not yet strong enough to shrink downside into a routine operating risk. The most important
              near-term kill criteria are measurable: failure to produce primary incident and litigation records for the
              reported late-2025 breach; inability to show customer concentration, retention, and contract-lock-in data
              for major enterprise accounts; and lack of hard service-quality evidence such as uptime, latency
              distributions, or false-accept/false-reject trends by vertical and geography. If those disclosures are
              clean, the existing mitigation narrative can support a manageable-risk view. If they are missing or reveal
              concentrated exposure, the same scale advantages that drive Veriff's growth can amplify the downside from
              a single security, regulatory, or enterprise-account failure.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR011
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Sensitive-data operator with incomplete public incident bounding
            body: >-
              The assigned pool contains an adverse signal around a late-2025 breach and class-action litigation, but
              not the underlying notices or complaints, so breach/legal downside remains high severity and incompletely
              quantified.
            calloutType: risk
            claimRefs:
              - CR009
              - CR015
          - type: callout
            title: Mitigations are broad, but mostly self-described
            body: >-
              Veriff publicly documents certifications, sanctions/PEP tooling, ongoing monitoring, human-in-the-loop
              review, and high automation, yet the assigned pool still lacks the independent service-level and
              incident-response data needed to validate those controls under stress.
            calloutType: insight
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR009
          - type: callout
            title: Require incident, concentration, and SLA evidence before underwriting downside
            body: >-
              The public record supports continuing diligence, but not underwriting concentration or legal downside;
              obtain primary breach records, customer concentration and renewal data, and operating-service metrics
              before moving to conviction.
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR007
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Veriff's business quality looks better than it did at the 2022 round: the company said in December 2025
              that it had doubled revenue to more than $100M, reached profitability, tripled verification volumes year
              over year, and added large customers including Western Union, Instacart, Uber, and
              Bumble.[CV005][CV006][CV009] The product surface still looks premium as well, with the company marketing a
              6-second average verification time, 98% automation, 95% first-try success, and document coverage across
              230+ countries and territories.[CV007] The problem is price support: the retained public valuation anchors
              are still Jan 2022 references to a $1.5B Series C, and the public multiple framing around that round is
              inconsistent across third-party datasets.[CV001][CV002][CV003][CV004] Because the operating trend is
              positive but the price signal is stale and the downside record now includes breach-related litigation, the
              evidence supports tracking the company and engaging only if a fresher mark or tighter private diligence
              closes the valuation gap.[CV012][CV013][CV014]
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: Thesis versus anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is straightforward: identity verification remains strategically important, Veriff
              now presents itself as trust infrastructure spanning verification, authentication, and fraud prevention,
              and the company has fresh evidence of scale, customer relevance, and improved operating
              efficiency.[CV005][CV006][CV008][CV009] Those facts can justify paying for quality if the 2025 improvement
              is durable and if the business has indeed grown beyond the 2022 revenue base embedded in the last known
              priced round.[CV002][CV005] The anti-thesis is just as clear: the only explicit valuation anchor still
              sits in 2022, the public multiple references do not reconcile, and the late-2025 breach and lawsuits
              create a real execution and reputation overhang for a trust-sensitive vendor.[CV001][CV003][CV004] Without
              refreshed price discovery, concentration data, or cap-table detail, the anti-thesis is strong enough to
              block a public-evidence buy recommendation today.[CV012][CV013][CV014]
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV008
              - CV012
              - CV013
      - number: '8.3'
        title: Scenario framing and final diligence
        blocks:
          - type: paragraph
            body: >-
              The bull, base, and bear cases should be framed relative to the stale 2022 unicorn mark rather than around
              false precision. A bull case needs the 2025 profitability and >$100M revenue claim to hold through 2026
              while customer additions, fraud-product breadth, and geographic expansion continue to
              compound.[CV005][CV006][CV008][CV009] A base case assumes the business is stronger operationally but still
              deserves only flat-to-modest repricing against the old mark until investors see a current round, secondary
              mark, or audited revenue bridge.[CV001][CV013] A bear case assumes the breach/litigation overhang,
              multiple compression, or weaker-than-expected concentration and margin quality force a material reset
              below the old anchor.[CV004][CV012][CV014] The practical diligence ask is therefore not just "is Veriff a
              good company?" but "what current price, stack, and customer-quality evidence would convert this from track
              to invest?"[CV013][CV014]
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, don't stretch
            body: >-
              Veriff may deserve premium attention, but the retained public evidence does not yet justify paying off a
              three-year-stale unicorn mark.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV013
              - CV014
          - type: callout
            title: Price risk matters more than company-quality risk here
            body: >-
              The central blocker is not whether Veriff has momentum; it is whether investors can price that momentum
              confidently after a breach overhang and without a fresh valuation reference.
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
              - CV012
              - CV013
