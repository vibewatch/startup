      - number: '5.2'
        title: Architecture and delivery model
        blocks:
          - type: paragraph
            body: >-
              The disclosed operating model is a layered capture-to-decision architecture. Entry points span web SDK,
              mobile SDK, API, and webhooks, so Veriff can sit directly inside customer onboarding and transaction flows
              rather than forcing a separate user experience. Inside the stack, the company emphasizes document
              recognition, biometric analysis, liveness, and device or network analytics, with outputs such as
              decisions, decision scores, and session insights. The assigned pool also supports that Veriff offers two
              delivery modes: a fully automated path optimized for speed and a hybrid path that escalates higher-risk
              sessions to trained specialists, which matters because it shifts the product from pure software into an
              operationally backed service.
            claimRefs:
              - CE002
              - CE004
              - CE007
              - CE008
