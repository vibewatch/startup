  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Veriff's clearest public category anchor is identity verification and protection, with the company selling
              a workflow that starts at document and selfie capture but extends into liveness, sanctions, PEP,
              adverse-media, and ongoing monitoring. That places the core addressable market inside digital trust, KYC,
              fraud prevention, and authentication budgets rather than inside all cybersecurity or generic compliance
              software spend. The boundary also excludes broader case-management, AML analyst tooling, and unrelated
              payments or cloud infrastructure. Status-quo substitutes still matter: manual review, branch or in-person
              identification, and legacy point solutions remain viable when buyers do not yet need persistent
              authentication or global document coverage.
            claimRefs:
              - CM001
              - CM002
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM013
      - number: '2.2'
        title: Observable sizing lenses and public market position
        blocks:
          - type: paragraph
            body: >-
              The chapter can size Veriff's market only through observable footprint and demand lenses, not through a
              defensible public TAM/SAM/SOM stack. 6sense estimates 485 current customers, 2.62% market share, and the
              #9 position in its Identity Verification and Protection category, while the same dataset clusters visible
              customers in fintech, technology, blockchain, and financial services. Third-party and company sources also
              show demand expanding geographically, with Latin America called out as a fast-growth region and expansion
              continuing across the Middle East, Africa, and APAC. Those signals show a large and widening category, but
              they still stop short of a clean dollar-denominated market model for Veriff's monetizable spend.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM014
