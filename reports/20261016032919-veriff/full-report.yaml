  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - - thesis
        - >-
          2025 operating proof improved meaningfully: management says Veriff doubled revenue to over $100M, became
          profitable, and tripled verification volumes.
        - Audited or investor-grade financials confirming the durability of that step-up would strengthen conviction.
      - - thesis
        - >-
          The platform still looks premium, spanning verification, authentication, and fraud prevention with broad
          global document coverage and low-friction onboarding.
        - >-
          Evidence that these product advantages translate into sticky economics such as NRR, concentration resilience,
          or lower fraud loss would strengthen the moat case.
      - - anti-thesis
        - >-
          The explicit public valuation anchor still points to the Jan 2022 $1.5B Series C, so current entry price is
          not externally refreshed.
        - A new priced round, 409A, or credible secondary mark would refresh the valuation anchor.
      - - anti-thesis
        - >-
          Trust-sensitive downside risk rose after the reported late-2025 breach and related class actions, while public
          multiple references remain inconsistent.
        - Containment evidence on breach impact plus reconciled current valuation inputs would reduce this objection.
    notes: >-
      These rows summarize the strongest retained support and disconfirming evidence rather than a weighted scoring
      model.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV007
      - CV008
