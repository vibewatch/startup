  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - bull
        - >-
          Profitability and >$100M revenue persist through 2026, customer wins keep compounding, and the broader
          trust-infrastructure story expands beyond onboarding.
        - >-
          Could justify pricing at or above the stale 2022 $1.5B mark once a fresh financing or credible secondary mark
          confirms durability.
        - Fresh growth may prove more marketing-led than cohort-led if concentration or churn is weak.
        - Needs new price discovery plus private financial diligence.
      - - base
        - >-
          Operating quality improved, but no fresh public price signal appears and investors still underwrite off
          2022-era valuation references.
        - Best framed as hold/track around the old mark rather than as an immediate step-up in fair value.
        - Multiple compression and stale cap-table information keep entry discipline tight.
        - Most consistent with the current retained evidence.
      - - bear
        - >-
          Breach fallout, litigation, or weaker-than-expected economics reduce willingness to pay a premium
          trust-software multiple.
        - Supports a material discount to the 2022 mark until trust, margin, and concentration questions are resolved.
        - >-
          Reputational damage or slower conversion in regulated verticals could matter more than headline revenue
          growth.
        - Activated if new diligence weakens the 2025 improvement narrative.
      - - price-clearing trigger
        - A fresh primary round, 409A, or credible secondary mark is disclosed or shared in diligence.
        - Lets investors reset valuation on current rather than 2022 assumptions.
        - Without it, public anchors remain stale.
        - Missing today.
      - - no-go trigger
        - >-
          Private diligence shows adverse concentration, aggressive preferences, or breach costs that erase the
          profitability upgrade.
        - Would make even the old 2022 anchor too rich for new money.
        - These items are not visible in retained public evidence.
        - Must be ruled out before an invest recommendation.
    notes: >-
      Scenario bands are intentionally qualitative and anchored to the stale 2022 mark because the retained public
      evidence does not support precise 2026 valuation math.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV008
