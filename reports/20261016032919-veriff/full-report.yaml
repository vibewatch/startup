  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product surface, and present scale
        blocks:
          - type: paragraph
            body: >-
              Veriff presents itself as an AI-native trust infrastructure platform for digital identity, biometric, and
              business verification rather than a point compliance tool. Its official surfaces consistently describe a
              globally deployable product built around SDKs, APIs, workflows, assisted capture, liveness, and
              device/network analytics, which matters because it supports later chapters' assumptions about integration
              depth and buyer workflow fit. The same official sources also make the strongest public scale claims in
              this pool: 3,000+ businesses served, support across 230+ countries and territories, 50 languages and
              dialects, 12,500+ supported identity documents, and decisioning measured in seconds rather than minutes.
              Those are company-authored metrics, but third-party profiles broadly echo the same positioning and
              geography, making Veriff look like a scaled late-stage vendor rather than an earlier experimental product.
