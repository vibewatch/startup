      - number: '5.3'
        title: Differentiation and maturity
        blocks:
          - type: paragraph
            body: >-
              Veriff's differentiation pitch is not a novel public model architecture disclosure; it is a practical
              operating claim about broad document coverage, low-friction conversion, and ongoing learning. The product
              page ties that to 12.5K-plus supported documents, 230-plus countries and territories, 50 localized
              languages and dialects, and reinforced learning from human feedback that is supposed to speed support for
              newly issued document specimens. The 2025 company release and the Y Combinator profile both frame the
              platform as trust infrastructure that extends beyond initial onboarding into authentication and fraud
              prevention, which is strategically important because it broadens the product surface from one-time
              verification into recurring transaction controls.
            claimRefs:
              - CE005
              - CE009
              - CE010
      - number: '5.4'
        title: Trust controls, security posture, and open product risk
        blocks:
          - type: paragraph
            body: >-
              The strongest trust-control evidence in the assigned pool is still company-authored: Veriff advertises
              sanctions and PEP screening, adverse-media screening, ongoing monitoring, webhook HMAC signatures, and
              multiple compliance or certification badges. That is enough to show that security and compliance are
              integral to the product surface, but not enough to underwrite technical resilience. The pool does not
              contain independent evidence on uptime SLAs, false-positive or false-negative trade-offs,
              customer-incident postmortems, or developer-community telemetry such as open-source activity, package
              usage, or forum traction. For diligence, that means the product looks mature and broad on paper, but the
              technical-risk assessment remains partly dependent on vendor-described controls.
            claimRefs:
              - CE011
              - CE012
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public proof is broad but still vendor-led
            body: >-
              The assigned pool shows meaningful product breadth and trust controls, yet most technical evidence is
              company-authored or partner-adjacent. Diligence still needs independent proof on reliability, model-error
              trade-offs, and practitioner adoption before product defensibility can be treated as fully underwritten.
            calloutType: risk
            claimRefs:
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segment mix and where Veriff sits in the workflow
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports a broad but still product-led customer footprint rather than a
              single-vertical concentration story. Partner and company materials consistently place Veriff inside
              regulated onboarding and fraud-prevention workflows for financial services, fintech, crypto, gaming,
              mobility, marketplaces, and adjacent digital platforms. The more important customer-shape insight is that
              Veriff is not presented as a point tool used once at signup: Authsignal and Veriff both describe flows
              that start with document-and-selfie identity verification and then extend into biometric
              re-authentication, sanctions checks, adverse media screening, and ongoing monitoring. That expands the
              likely buyer set from compliance teams to product, fraud, and authentication owners, while also making
              partner-led distribution meaningful because platforms such as Authsignal and Alloy package Veriff inside a
              broader onboarding and trust stack.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU008
              - CU009
              - CU014
      - number: '6.2'
        title: Public proof of adoption and customer outcomes
        blocks:
          - type: paragraph
            body: >-
              Public proof of adoption is materially better than a logo wall but still mixed in quality. Veriff's own
              materials and syndicated releases name recognizable accounts such as Western Union, Instacart, Uber,
              Bumble, Bolt, Deel, Trustpilot, and Wise, which is stronger than anonymous enterprise references because
              it anchors the product in live, external brands. Review-led signals are also positive: the June 2026
              G2-based release cites a 4.5/5 rating, 98% of reviewers giving four or five stars, and 91% willing to
              recommend the product, while an October 2026 syndicated release reports similarly strong ease-of-business
              and support scores. On the operating side, company materials claim a 95% first-try verification success
              rate, a 6-second average decision time, and sharply rising usage intensity, including verification volumes
              tripling year over year and authentication volumes growing more than 30x year over year.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
