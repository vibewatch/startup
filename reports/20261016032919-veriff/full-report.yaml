      - number: '4.3'
        title: Capital adequacy, funding visibility, and forward dependence
        blocks:
          - type: paragraph
            body: >-
              Public trackers still frame Veriff through the lens of the 2022 Series C and a stale unicorn valuation
              anchor rather than current balance-sheet disclosure. StartupHub.ai says total funding is $192 million,
              while Tracxn lists $200 million and separately notes Veriff OÜ revenue in the €50 million to €100 million
              range for the legal entity as of December 31, 2025. The right synthesis is not that one source is
              necessarily wrong, but that entity-level turnover, consolidated company revenue, and total-funding
              trackers are not reconciled publicly. If Veriff's claimed profitability is durable, near-term financing
              dependency is likely lower than in 2022; however, without cash on hand, burn, debt obligations, covenant
              detail, or working-capital data, the company still cannot be underwritten on liquidity resilience from
              public evidence alone.
            claimRefs:
              - CI001
              - CI002
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The positive read is that Veriff looks like a scaled, usage-driven identity platform with public evidence
              of profitable growth, fast verification throughput, and room to monetize higher-value compliance
              workflows. The negative read is that the price floor is public while the realization layer is opaque: no
              public source here provides realized ASPs, gross margin, sales efficiency, concentration, burn, or runway.
              A late-2025 breach affecting data stored within Veriff's systems is also relevant because remediation,
              compliance, and insurance costs can weigh on margin even when topline remains healthy. Netting those
              points, the chapter supports a view that revenue quality is promising but still underdocumented, and that
              cash sufficiency should be treated as an open diligence item rather than an earned conclusion.
            claimRefs:
              - CI001
              - CI002
              - CI010
              - CI011
              - CI015
