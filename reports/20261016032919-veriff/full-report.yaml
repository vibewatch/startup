              - CM012
              - CM014
      - number: '2.3'
        title: Buyers, users, and budget ownership
        blocks:
          - type: paragraph
            body: >-
              The observable buyer map is enterprise-first and workflow-specific. Public examples place Veriff across
              financial services, marketplaces, mobility, gig-economy, gaming, and other digital-native sectors where a
              business must onboard a user, decide whether to trust that user, and often re-authenticate them later. The
              user is the end customer taking a document photo and selfie, but the buyer and payer are the enterprise
              teams choosing fraud controls, onboarding friction, compliance scope, and verification economics. That
              strongly suggests budgets sit with compliance, fraud/risk, trust-and-safety, or onboarding operations
              leaders, not with end-user consumers or centralized CIO line items alone.
            claimRefs:
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM015
      - number: '2.4'
        title: Demand drivers, adjacencies, and constraints
        blocks:
          - type: paragraph
            body: >-
              Demand is being pulled by two linked shifts: AI-enabled fraud is increasing the cost of weak identity
              controls, and buyers increasingly want identity tools that persist after onboarding into repeat
              authentication and broader trust infrastructure. Independent coverage ties this shift to synthetic
              identities, deepfakes, and reusable-digital-identity workflows, while recent 2026 update signals show
              Veriff stretching into address verification and right-to-work checks. The same market remains constrained
              by trust and regulatory sensitivity. Buyers still need evidence on how much spend sits in recurring
              authentication versus first-time KYC, what budgets are segment specific, and whether regulation or
              implementation friction slows adoption in more conservative sectors.
            claimRefs:
              - CM003
              - CM004
              - CM012
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The category is widening from point KYC into ongoing trust infrastructure
            body: >-
              The most important market change is not only more demand for onboarding IDV; it is the shift toward repeat
              authentication and adjacent trust workflows that raise lifetime budget relevance for vendors that can stay
              in the transaction flow after signup.
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM012
          - type: callout
            title: Public evidence still does not isolate a priced SAM
            body: >-
              The assigned pool is strong enough to show footprint, segment mix, and demand intensity, but not strong
              enough to price Veriff's monetizable slice by buyer, geography, or workflow. That keeps market-size
              confidence below what a valuation model would ideally require.
            calloutType: risk
            claimRefs:
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The market has widened beyond point IDV into suites, incumbents, and control-first substitutes
        blocks:
          - type: paragraph
            body: >
              The assigned evidence supports three practical competitor classes around Veriff. First are direct
              enterprise IDV rivals such as Jumio and Entrust IDV (Onfido), which compete on high-assurance onboarding,
              mobile experience, and broader enterprise-security distribution. Second are breadth-first compliance
              suites such as Sumsub and Ondato, which try to win by reducing vendor count across KYC, KYB, AML, and
              monitoring rather than by selling a standalone verification step. Third are workflow- and
              infrastructure-oriented substitutes such as Persona and Microblink, which appeal when a buyer wants more
              control over logic, UX, privacy, or deployment than a managed IDV vendor exposes. The pool is materially
              thinner on manual-review status quo and quantified in-house-build economics, so those paths should be
              treated as under-documented alternatives rather than closed questions.
            claimRefs:
              - CP004
              - CP006
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP011
              - CP012
      - number: '3.2'
        title: Veriff's wedge is global, low-friction IDV; challengers attack breadth and control
        blocks:
          - type: paragraph
            body: >
              Veriff's own product surface still documents the core reasons it wins: broad document coverage, a guided
              onboarding flow, optional sanctions and adverse-media checks, and authentication and fraud signals that
              can extend beyond sign-up. That creates a real product wedge for teams whose first problem is conversion
              plus fraud capture. The challenge is that competitor-authored comparisons repeatedly frame Veriff as
              narrower than broader compliance platforms and less controllable than workflow or privacy-first
              alternatives. In other words, Veriff is defending not just technical accuracy, but the proposition that
              buyers should accept a specialized, managed verification layer instead of a larger compliance operating
              system or a more configurable identity stack.
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP007
              - CP008
              - CP010
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
