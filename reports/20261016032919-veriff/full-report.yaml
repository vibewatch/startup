      - number: '4.2'
        title: Unit economics proxies and service-delivery cost drivers
        blocks:
          - type: paragraph
            body: >-
              Veriff discloses useful operating proxies but not enough direct unit economics to model contribution
              margin. The product page says average verification time is 6 seconds, 98% of checks are automated, and 95%
              of genuine users succeed on the first attempt. Those indicators matter because faster decisions, fewer
              retries, and higher automation should reduce support overhead and manual review cost per approved user.
              Veriff also positions sanctions, PEP, adverse-media, and ongoing monitoring checks as optional compliance
              modules, which suggests attach-rate upside beyond the core IDV session. Even so, none of the assigned
              sources disclose gross margin, cloud/investigation cost per session, CAC, payback, or
              customer-concentration effects, so the public case is strongest on revenue mechanics and weakest on true
              economic quality.
