              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU010
              - CU011
      - number: '6.3'
        title: Durability looks plausible, but retention and concentration remain open
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a credible land-and-expand motion but not a closed durability case. Veriff appears
              to have multiple ways to deepen account value: broader KYC modules, ongoing authentication after initial
              enrollment, and partner-channel embedding into other compliance stacks. Named customer outcomes also show
              production-style deployments rather than only pilots. Even so, the retained evidence does not disclose
              GRR, NRR, logo churn, contract length, renewal rates, or top-customer revenue share, so the chapter cannot
              convert customer breadth into a clean concentration or retention judgment. The only clearly adverse
              customer signal in the assigned pool comes from BeVerified's mixed review, which praises transparency but
              flags premium pricing versus cheaper rivals and cites complaints about archive access and low-bandwidth
              performance. That is enough to show some adoption friction, but not enough to size churn risk.
            claimRefs:
              - CU003
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              The strongest public evidence points to a business whose downside comes from operating a sensitive
              identity and compliance control plane at very large scale, not from a lack of product demand. Veriff says
              it combines AI with human-in-the-loop review, covers 12.5K+ identity documents across 230+ countries and
              territories, and handles optional sanctions, PEP, adverse-media, and ongoing-monitoring checks, which
              means failures can carry legal, fraud-loss, and reputational spillovers across multiple regulated
              workflows. At the same time, the assigned independent review evidence flags verification-speed variability
              and volume-based pricing, while the company says authentication and liveness volumes grew more than 30x
              year over year. That combination makes model-evasion, latency, and unit-economics control the core
              monitorable risks: Veriff appears to have strong mitigation levers, but public evidence does not yet prove
              how those levers hold up under fraud spikes, large customer traffic bursts, or adverse incident response.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
              - CR011
              - CR012
