              - CP013
              - CP014
      - number: '3.3'
        title: Pricing and packaging shape the attack surface more than feature checklists do
        blocks:
          - type: paragraph
            body: >
              Public pricing evidence is fragmentary, but it is directionally clear. Sacra describes Veriff as a
              usage-based business with self-serve per-verification pricing and separate charges for AML and ongoing
              monitoring, while competitor pages position Ondato, Persona, and integrated suites as easier to evaluate
              or broader per contract. That matters because buyers do not compare verification accuracy in isolation;
              they compare all-in cost, vendor count, implementation overhead, and who owns downstream compliance
              operations. Veriff can still win when the buyer optimizes for conversion and global document support, but
              opaque realized enterprise pricing makes it easier for suite vendors to tell a simpler procurement story.
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
              - CP009
      - number: '3.4'
        title: Durability depends on whether fraud-network effects outrun commoditization
        blocks:
          - type: paragraph
            body: >
              Veriff is not a small niche tool anymore: the assigned sources point to 3,000-plus customers, revenue
              above $100 million, profitability, and more than 30x authentication-volume growth in 2025. That scale
              matters because it can reinforce cross-session fraud signals, product expansion, and enterprise
              referenceability. The counter-risk is equally clear in the same pool: Persona-style workflow builders can
              make document and biometric verification feel interchangeable, while bundle vendors can move the buying
              center from onboarding conversion to vendor consolidation. The moat therefore looks strongest where
              Veriff's networked fraud and authentication layers matter, and weakest where verification is treated as a
              component that can be swapped into a broader compliance or workflow stack.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Veriff's strongest documented edge is scaled identity plus growing authentication
            body: >
              The cleanest evidence-backed advantage is not generic KYC breadth; it is a scaled, low-friction IDV core
              that is being extended into authentication and cross-session fraud signals.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP011
              - CP014
          - type: callout
            title: The competitive threat comes from both above and below
            body: >
              Sumsub- and Ondato-style suites attack Veriff from above by bundling monitoring and AML, while Persona and
              Microblink attack from below by making verification look like a configurable infrastructure component.
            calloutType: risk
            claimRefs:
              - CP006
              - CP007
              - CP013
          - type: callout
            title: Public pricing is useful for direction, not for underwriting realized margins
            body: >
              The assigned pool exposes enough public pricing to show that transparency is a selling point for rivals,
              but not enough contract-level evidence to know whether Veriff's enterprise discounts erase that gap in
              practice.
            calloutType: assumption
            claimRefs:
              - CP003
