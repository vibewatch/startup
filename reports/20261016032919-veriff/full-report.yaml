        title: Funding history, stakeholder map, and public-data tensions
        blocks:
          - type: paragraph
            body: >-
              Public market-data pages still frame Veriff primarily through its January 2022 Series C, where multiple
              secondary sources align on a $100M round and a $1.5B valuation. The more important diligence nuance is not
              the existence of that round but the absence of any newer public valuation marker in the assigned pool.
              Independent sources also disagree on total capital raised: StartupHub and the Multiples summary record
              $192M, while the detailed Series C narrative on Multiples says that round brought total funding to $200M.
              That disagreement is modest enough to preserve the broad funding story—well-capitalized, venture-backed,
              post-Series C—but material enough that the chapter should carry a range rather than a false single-figure
              precision until cap-table support or management confirmation closes the gap.
