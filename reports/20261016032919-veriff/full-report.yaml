              The assigned evidence pool gives clear visibility into founder leadership but only partial visibility into
              present-day governance. Kaarel Kotkas is directly confirmed on official pages as founder and CEO, while
              Janer Gorohhov appears in independent profile and news-aggregation surfaces as co-founder and chief
              product officer. That split suggests Veriff remains founder-led across both commercial narrative and
              product direction, which raises ordinary key-person concentration around Kotkas even though the product
              organization appears to have a named co-founder counterpart. Governance detail is thinner: Multiples
              preserves board-seat disclosures tied to the 2021 financing, but the current full board, any observer
