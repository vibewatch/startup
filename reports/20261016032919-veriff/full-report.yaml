  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a transaction-led monetization model built around identity verification sessions,
              with visible self-serve list prices and enterprise negotiation above that floor. CheckThat.ai lists
              Essential, Plus, and Premium pricing at $0.80, $1.39, and $1.89 per verification respectively, while Tech
              Insider separately describes a $209 monthly self-serve minimum and usage-based pricing. Veriff's own 2025
              release says the company doubled revenue to above $100 million, tripled verification volumes year over
              year, and reached profitability, which frames the current model as scaled transactional revenue rather
              than pre-scale experimentation. The caution is that all of the public price points appear to be list
              prices or comparison-site summaries, not realized net pricing, discounts, or cohort-level revenue quality.
