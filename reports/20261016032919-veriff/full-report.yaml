  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Veriff's current public product is an identity and document verification service sold into onboarding,
              fraud-mitigation, and compliance workflows rather than a single narrow KYC point solution. The visible
              workflow starts with document and selfie capture, guides the user through image quality issues in real
              time, and returns a decision within the customer's chosen risk policy. Public product surfaces also show
              that Veriff has expanded the offer beyond one core check into adjacent modules such as age estimation,
              proof of address, AML screening, and registries, which suggests a platform upsell motion around the trust
              workflow instead of a one-feature API.
            claimRefs:
