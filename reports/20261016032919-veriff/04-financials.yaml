      - ["Plus", "$1.39 per verification", "Mid-tier self-serve pricing appears publicly listed.", "Feature bundle and realized discounting not disclosed in assigned pool.", "CheckThat.ai 2026 pricing summary."]
      - ["Premium", "$1.89 per verification", "Higher self-serve list price appears publicly listed.", "No public evidence here on uptake or retention by tier.", "CheckThat.ai 2026 pricing summary."]
      - ["Enterprise", "Custom pricing", "Flexible contract terms and lower per-verification pricing at scale are described externally.", "Actual volume commitments, overage rules, and services revenue are undisclosed.", "CheckThat.ai 2026 pricing summary."]
    notes: >-
      This table captures list or comparison-site pricing only; it should not be read as
      realized pricing, revenue recognition, or margin evidence.
    claimRefs: [CI008, CI009, CI010]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Average verification time", "6 seconds", "High", "A faster decision should improve customer conversion and reduce manual follow-up cost.", "Provide conversion uplift and manual-review deflection by customer cohort."]
      - ["Check automation rate", "98%", "High", "Higher automation is a direct proxy for lower service-delivery cost per verification.", "Provide reviewer touch rate, cost per exception, and automation trend by quarter."]
      - ["First-attempt success rate", "95%", "High", "Fewer failed first tries should reduce drop-offs, support load, and resubmission friction.", "Provide pass-rate split by geography, document type, and customer segment."]
      - ["Published entry price", "$0.80 per verification", "Medium", "Sets the visible monetization floor for self-serve demand generation.", "Provide realized ASP by tier and discount band."]
      - ["Gross margin", null, "Low", "Gross margin is required to judge whether automation gains convert into durable economic quality.", "Provide audited gross margin definition, hosted-service cost, and human-review cost allocation."]
      - ["CAC / payback", null, "Low", "Sales efficiency determines whether strong topline growth can compound without new financing.", "Provide blended CAC, payback, and sales-cycle by segment."]
      - ["Cash / burn / runway", null, "Low", "Liquidity determines whether profitability is durable or still financing-dependent.", "Provide current cash, monthly burn or cash generation, debt, and covenant package."]
    notes: >-
      Nulls mean the assigned public evidence does not disclose the metric. The populated rows are
      public operating proxies, not complete unit economics.
    claimRefs: [CI005, CI006, CI007, CI008]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a usage-based IDV core, optional compliance upsell, and
      negotiated enterprise expansion, but not the realized gross-margin layer.
    data:
      nodes:
        - id: demand
          label: "Customer verification demand"
          value: "Regulated online businesses need identity checks during onboarding and authentication."
        - id: idv
          label: "Core IDV session"
          value: "$0.80-$1.89 published self-serve list pricing."
        - id: efficiency
          label: "Operational efficiency"
          value: "6-second decisions, 98% automation, 95% first-try success."
        - id: addons
          label: "Compliance upsell"
          value: "Optional PEP, sanctions, adverse-media, and ongoing-monitoring modules."
        - id: enterprise
          label: "Enterprise contracts"
          value: "$209 self-serve floor plus custom negotiated terms for larger buyers."
        - id: profit
          label: "Gross profit / cash generation"
          value: "Company says revenue topped $100M and 2025 was profitable, but public gross-margin and cash data are absent."
      edges:
        - from: demand
          to: idv
          label: "creates paid sessions"
        - from: idv
          to: efficiency
          label: "delivery model affects cost"
        - from: idv
          to: addons
          label: "cross-sell opportunity"
        - from: idv
          to: enterprise
          label: "volume expands contract scope"
        - from: efficiency
          to: profit
          label: "supports margin potential"
        - from: addons
          to: profit
          label: "raises revenue per customer"
        - from: enterprise
          to: profit
          label: "improves account value"
    approximationNotes: >-
      The bridge is directional. Public sources disclose list pricing and operating proxies, but
      not realized margin, discounts, or cash conversion.
    claimRefs: [CI001, CI002, CI004, CI005, CI006, CI008, CI010, CI015]
callouts:
  - calloutType: strength
    title: Profitable scale now appears plausible
    body: >-
      The strongest reader-facing signal is Veriff's own statement that revenue doubled to more
      than $100 million while the business was profitable in 2025.
    claimRefs: [CI001, CI002]
  - calloutType: risk
    title: Capital adequacy is still not publicly underwritable
    body: >-
      Public trackers disagree on total funding, and none of the assigned sources disclose cash,
      burn, debt, or runway, so the liquidity conclusion is still a diligence ask rather than a
      public fact.
    claimRefs: [CI013, CI014]
  - calloutType: insight
    title: List-price transparency does not equal revenue quality
    body: >-
      Public pricing makes Veriff easier to benchmark than many peers, but without realized ASP,
      discounting, or concentration data, underwriting still depends on private evidence.
    claimRefs: [CI008, CI009, CI010, CI015]
