artifact: financials
slug: veriff
runDate: 2026-10-16
company:
  name: Veriff
chapter:
  number: 4
  title: Financials
  summary: >-
    Veriff's public financial picture has improved on the surface: the company says 2025
    revenue doubled to more than $100 million and that it was profitable, while independent
    sources show transparent self-serve list pricing and continued enterprise contract motion.
    The underwriting gap is that public evidence still stops well short of cash, burn, gross
    margin, realized pricing, and concentration, so capital adequacy remains directionally
    better but not investment-grade underwritable from public data alone.
sections:
  - id: revenue-model
    title: Revenue model and public traction
    body: >-
      Public evidence supports a transaction-led monetization model built around identity
      verification sessions, with visible self-serve list prices and enterprise negotiation above
      that floor. CheckThat.ai lists Essential, Plus, and Premium pricing at $0.80, $1.39, and
      $1.89 per verification respectively, while Tech Insider separately describes a $209
      monthly self-serve minimum and usage-based pricing. Veriff's own 2025 release says the
      company doubled revenue to above $100 million, tripled verification volumes year over
      year, and reached profitability, which frames the current model as scaled transactional
      revenue rather than pre-scale experimentation. The caution is that all of the public price
      points appear to be list prices or comparison-site summaries, not realized net pricing,
      discounts, or cohort-level revenue quality.
    claimRefs: [CI001, CI002, CI003, CI008, CI009, CI010, CI015]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: unit-economics
    title: Unit economics proxies and service-delivery cost drivers
    body: >-
      Veriff discloses useful operating proxies but not enough direct unit economics to model
      contribution margin. The product page says average verification time is 6 seconds, 98% of
      checks are automated, and 95% of genuine users succeed on the first attempt. Those
      indicators matter because faster decisions, fewer retries, and higher automation should
      reduce support overhead and manual review cost per approved user. Veriff also positions
      sanctions, PEP, adverse-media, and ongoing monitoring checks as optional compliance
      modules, which suggests attach-rate upside beyond the core IDV session. Even so, none of
      the assigned sources disclose gross margin, cloud/investigation cost per session, CAC,
      payback, or customer-concentration effects, so the public case is strongest on revenue
      mechanics and weakest on true economic quality.
    claimRefs: [CI004, CI005, CI006, CI007, CI011]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy, funding visibility, and forward dependence
    body: >-
      Public trackers still frame Veriff through the lens of the 2022 Series C and a stale
      unicorn valuation anchor rather than current balance-sheet disclosure. StartupHub.ai says
      total funding is $192 million, while Tracxn lists $200 million and separately notes
      Veriff OÜ revenue in the €50 million to €100 million range for the legal entity as of
      December 31, 2025. The right synthesis is not that one source is necessarily wrong, but
      that entity-level turnover, consolidated company revenue, and total-funding trackers are
      not reconciled publicly. If Veriff's claimed profitability is durable, near-term financing
      dependency is likely lower than in 2022; however, without cash on hand, burn, debt
      obligations, covenant detail, or working-capital data, the company still cannot be
      underwritten on liquidity resilience from public evidence alone.
    claimRefs: [CI001, CI002, CI012, CI013, CI014]
  - id: risks-verdict
    title: Financial verdict and diligence blockers
    body: >-
      The positive read is that Veriff looks like a scaled, usage-driven identity platform with
      public evidence of profitable growth, fast verification throughput, and room to monetize
      higher-value compliance workflows. The negative read is that the price floor is public
      while the realization layer is opaque: no public source here provides realized ASPs, gross
      margin, sales efficiency, concentration, burn, or runway. A late-2025 breach affecting
      data stored within Veriff's systems is also relevant because remediation, compliance, and
      insurance costs can weigh on margin even when topline remains healthy. Netting those
      points, the chapter supports a view that revenue quality is promising but still
      underdocumented, and that cash sufficiency should be treated as an open diligence item
      rather than an earned conclusion.
    claimRefs: [CI001, CI002, CI010, CI011, CI015, CI016]
