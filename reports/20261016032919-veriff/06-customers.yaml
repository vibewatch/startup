schemaVersion: report-v2
artifact: customers
slug: veriff
runDate: 2026-10-16
company:
  name: Veriff
chapter:
  number: 6
  title: Customers
  summary: >-
    Veriff's public customer proof shows real adoption across fintech, marketplaces, mobility,
    crypto, and trust-and-safety use cases, with evidence that the product extends from initial
    onboarding into ongoing authentication. The evidence is strongest on named deployments and
    review sentiment, but still weak on renewal, NRR, churn, contract duration, and top-customer
    concentration.
sections:
  - id: customer-footprint
    title: Segment mix and where Veriff sits in the workflow
    body: >-
      The retained evidence supports a broad but still product-led customer footprint rather than a
      single-vertical concentration story. Partner and company materials consistently place Veriff
      inside regulated onboarding and fraud-prevention workflows for financial services, fintech,
      crypto, gaming, mobility, marketplaces, and adjacent digital platforms. The more important
      customer-shape insight is that Veriff is not presented as a point tool used once at signup:
      Authsignal and Veriff both describe flows that start with document-and-selfie identity
      verification and then extend into biometric re-authentication, sanctions checks, adverse
      media screening, and ongoing monitoring. That expands the likely buyer set from compliance
      teams to product, fraud, and authentication owners, while also making partner-led
      distribution meaningful because platforms such as Authsignal and Alloy package Veriff inside a
      broader onboarding and trust stack.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU014
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: proof-and-adoption
    title: Public proof of adoption and customer outcomes
    body: >-
      Public proof of adoption is materially better than a logo wall but still mixed in quality.
      Veriff's own materials and syndicated releases name recognizable accounts such as Western
      Union, Instacart, Uber, Bumble, Bolt, Deel, Trustpilot, and Wise, which is stronger than
      anonymous enterprise references because it anchors the product in live, external brands.
      Review-led signals are also positive: the June 2026 G2-based release cites a 4.5/5 rating,
      98% of reviewers giving four or five stars, and 91% willing to recommend the product, while
      an October 2026 syndicated release reports similarly strong ease-of-business and support
      scores. On the operating side, company materials claim a 95% first-try verification success
      rate, a 6-second average decision time, and sharply rising usage intensity, including
      verification volumes tripling year over year and authentication volumes growing more than 30x
      year over year.
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
    tableRefs:
      - TU002
      - TU003
  - id: durability-and-concentration
    title: Durability looks plausible, but retention and concentration remain open
    body: >-
      The evidence supports a credible land-and-expand motion but not a closed durability case.
      Veriff appears to have multiple ways to deepen account value: broader KYC modules, ongoing
      authentication after initial enrollment, and partner-channel embedding into other compliance
      stacks. Named customer outcomes also show production-style deployments rather than only
      pilots. Even so, the retained evidence does not disclose GRR, NRR, logo churn, contract
      length, renewal rates, or top-customer revenue share, so the chapter cannot convert customer
      breadth into a clean concentration or retention judgment. The only clearly adverse customer
      signal in the assigned pool comes from BeVerified's mixed review, which praises transparency
      but flags premium pricing versus cheaper rivals and cites complaints about archive access and
      low-bandwidth performance. That is enough to show some adoption friction, but not enough to
      size churn risk.
    claimRefs:
      - CU003
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale / strategic value
      - Gap
    rows:
      - - Financial services and fintech
        - Compliance, risk, fraud, and onboarding teams evaluating regulated users
        - KYC onboarding, document verification, sanctions / adverse media checks, and re-KYC
        - Repeated across Veriff, Alloy, and Authsignal materials; Western Union is a named 2025 win
        - No public disclosure of contract length, ACV, or renewal economics by segment
      - - Marketplaces and mobility
        - Operations, trust-and-safety, and platform teams onboarding drivers, couriers, riders, or sellers
        - Identity verification at signup plus recurring trust checks as activity scales
        - Bolt, Uber, Instacart, Starship, and Trustpilot appear in retained materials
        - Public sources do not separate active production accounts from older logos
      - - Crypto, gaming, and online platforms
        - Compliance and fraud teams handling higher-risk or age-restricted flows
        - Fraud prevention, secure onboarding, and user authentication
        - Alloy and CaseStudies.com both place Veriff in crypto, gaming, and online-platform contexts
        - No public retention or take-rate data for these verticals
      - - Embedded partner channels
        - Identity or orchestration platforms buying Veriff as a component and reselling it downstream
        - Document IDV plus biometric authentication within broader onboarding stacks
        - Authsignal and Alloy show Veriff embedded in third-party stacks, expanding reach beyond direct sales
        - Channel mix, reseller economics, and dependence on partners are undisclosed
    notes: >-
      Segment mapping combines company, partner, and directory evidence; it shows where Veriff is
      publicly positioned, not disclosed revenue mix or customer concentration.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - G2 overall rating
        - 4.5 / 5
        - "2026-06-02"
        - Veriff G2 Summer 2026 release
        - Medium
        - Third-party review sentiment is positive and current
        - Total review count and customer segment mix are not disclosed
      - - Reviewer recommendation rate
        - 91%
        - "2026-06-02"
        - Veriff G2 Summer 2026 release
        - Medium
        - Suggests reference quality is stronger than a logo-only customer page
        - Base sample size and cohort mix are undisclosed
      - - Ease of doing business
        - 99%
        - "2026-10-08"
        - Yahoo Finance syndicated G2 editorial release
        - Medium
        - Implies relatively low implementation or vendor-friction among surveyed users
        - No disclosed respondent count or enterprise mix
      - - Support quality
        - 94%
        - "2026-10-08"
        - Yahoo Finance syndicated G2 editorial release
        - Medium
        - Indicates post-sale support is a customer strength in current review data
        - No disclosed support volume or SLA context
      - - Genuine-user first-try verification success
        - 95%
        - "2026-10-16"
        - Veriff product page
        - Medium
        - Strong onboarding UX claim if representative across customer cohorts
        - No cohort definition or independent audit
      - - Average verification decision time
        - 6 seconds
        - "2026-10-16"
        - Veriff product page
        - Medium
        - Supports a low-friction onboarding narrative
        - No percentile distribution or workflow exclusions
      - - Verification volume growth
        - Tripled year over year
        - "2025-12-10"
        - Veriff 2025 performance release
        - Medium
        - Indicates expanding customer usage, not just more signed logos
        - No absolute customer or merchant cohort denominator
      - - Authentication and liveness volume growth
        - More than 30x year over year
        - "2025-12-10"
        - Veriff 2025 performance release
        - Medium
        - Supports an expansion path beyond onboarding into repeated authentication
        - No breakout by customer count versus usage per customer
    notes: >-
      These are mixed review, company, and syndicated metrics rather than a single normalized cohort
      funnel; values are shown separately because denominators and populations differ.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Western Union
        - Financial services
        - Named 2025 customer win in identity verification
        - Production-style named win, but go-live scope not disclosed
        - Shows reach into large regulated payment flows
        - No deployment date, volume, or contract economics
      - - Instacart and Uber
        - Marketplaces / mobility
        - Named 2025 customer wins tied to online verification demand
        - Production-style named wins, but evidence is still press-release level
        - Demonstrates relevance to high-scale consumer platforms
        - No disclosed seat count, geography, or spend
      - - Bumble
        - Consumer platform
        - Named as a new sector example for verification demand
        - Production intent is implied rather than independently verified
        - Suggests expansion beyond classic KYC buyers
        - No public implementation detail or outcome metric
      - - JTI
        - Enterprise / regulated consumer goods
        - CaseStudies.com lists a Veriff deployment
        - Production-style case-study reference
        - 223% higher conversions
        - Directory listing does not provide methodology or date on-page
      - - Mintos
        - Fintech
        - CaseStudies.com lists onboarding and fraud-prevention use
        - Production-style case-study reference
        - 90%+ conversion and robust fraud prevention
        - Directory listing does not disclose cohort or time window
      - - Uphold
        - Crypto / fintech
        - CaseStudies.com lists verification use in a regulated onboarding flow
        - Production-style case-study reference
        - Reduced fraud and 87% verification success rate
        - Outcome is not independently corroborated in the retained pool
    notes: >-
      Coverage is intentionally partial: this table includes only publicly named deployments and
      outcome anecdotes retained in the assigned pool, not a complete Veriff customer list.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly retained named deployments and case-study references from the assigned 2025-2026
        source pool; not a complete installed-base export.
    claimRefs:
      - CU004
      - CU010
      - CU011
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Veriff appears to expand from onboarding verification into repeat authentication and adjacent compliance modules.
    data:
      nodes:
        - label: Segment entry points
          touchpoints:
            - Financial services, fintech, crypto, gaming, mobility, and online marketplaces recur in public positioning
            - Buyers appear to include compliance, fraud, product, and trust teams
        - label: Initial onboarding
          touchpoints:
            - Document-plus-selfie or document-only verification at signup
            - SDK, web, and API deployment options support merchant integration
        - label: Verification decision
          touchpoints:
            - Company materials claim 6-second average decisions and 95% first-try success for genuine users
            - Human review sits behind automated checks where needed
        - label: Ongoing authentication
          touchpoints:
            - Authsignal describes biometric authentication built on an approved Veriff IDV session
            - Returning users can be challenged without resubmitting documents each time
        - label: Compliance expansion
          touchpoints:
            - Optional PEP, sanctions, adverse media, and ongoing monitoring modules deepen scope
            - Proof-of-address recognition broadens regulated workflow coverage
        - label: Account expansion loop
          touchpoints:
            - Higher verification and authentication volumes suggest usage expansion after initial land
            - Partner platforms such as Alloy and Authsignal can create indirect channel growth
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU008
      - CU009
      - CU014
