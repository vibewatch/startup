  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-and-concentration-gap
      missingEvidence: Public NRR, GRR, churn, renewal, average contract length, and top-customer revenue-share disclosures.
      whyItMatters: >-
        Without retention and concentration data, customer breadth cannot be converted into a clean
        durability or downside-risk judgment.
      diligencePath: >-
        Request cohort retention, renewal, average contract term, and top-10-customer concentration
        from management or customer references; cross-check against board materials and pipeline
        conversion data.
      relatedQuestionRefs:
        - QU006
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof coverage
      missingEvidence: A fuller production customer list with go-live dates, usage scope, and independently sourced outcomes.
      whyItMatters: >-
        Public case studies are marketing-selected and can overstate reference quality if the reader
        cannot distinguish live scaled deployments from pilots or legacy logos.
      diligencePath: >-
        Obtain a customer reference list ranked by revenue and deployment maturity, then confirm a
        sample through procurement records, customer press releases, or direct diligence calls.
      relatedTableRefs:
        - TU003
