chapter:
  number: 5
  title: Product & Technology
  summary: "Veriff's public product surface is a configurable identity-verification stack that starts with document and selfie capture, runs automated decisioning with optional specialist review, and extends into authentication and compliance screening. The assigned evidence supports breadth, workflow, and trust controls, but it still leaves underwriting gaps around independent technical performance, incident detail, and developer-signal proof."
sections:
  - id: product-scope
    title: Product scope and customer workflow
    body: "Veriff's current public product is an identity and document verification service sold into onboarding, fraud-mitigation, and compliance workflows rather than a single narrow KYC point solution. The visible workflow starts with document and selfie capture, guides the user through image quality issues in real time, and returns a decision within the customer's chosen risk policy. Public product surfaces also show that Veriff has expanded the offer beyond one core check into adjacent modules such as age estimation, proof of address, AML screening, and registries, which suggests a platform upsell motion around the trust workflow instead of a one-feature API."
    claimRefs: [CE001, CE003, CE006, CE009]
    tableRefs: [TE001, TE002]
  - id: architecture-and-delivery
    title: Architecture and delivery model
    body: "The disclosed operating model is a layered capture-to-decision architecture. Entry points span web SDK, mobile SDK, API, and webhooks, so Veriff can sit directly inside customer onboarding and transaction flows rather than forcing a separate user experience. Inside the stack, the company emphasizes document recognition, biometric analysis, liveness, and device or network analytics, with outputs such as decisions, decision scores, and session insights. The assigned pool also supports that Veriff offers two delivery modes: a fully automated path optimized for speed and a hybrid path that escalates higher-risk sessions to trained specialists, which matters because it shifts the product from pure software into an operationally backed service."
    claimRefs: [CE002, CE004, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-maturity
    title: Differentiation and maturity
    body: "Veriff's differentiation pitch is not a novel public model architecture disclosure; it is a practical operating claim about broad document coverage, low-friction conversion, and ongoing learning. The product page ties that to 12.5K-plus supported documents, 230-plus countries and territories, 50 localized languages and dialects, and reinforced learning from human feedback that is supposed to speed support for newly issued document specimens. The 2025 company release and the Y Combinator profile both frame the platform as trust infrastructure that extends beyond initial onboarding into authentication and fraud prevention, which is strategically important because it broadens the product surface from one-time verification into recurring transaction controls."
    claimRefs: [CE005, CE009, CE010]
  - id: trust-controls-and-risks
    title: Trust controls, security posture, and open product risk
    body: "The strongest trust-control evidence in the assigned pool is still company-authored: Veriff advertises sanctions and PEP screening, adverse-media screening, ongoing monitoring, webhook HMAC signatures, and multiple compliance or certification badges. That is enough to show that security and compliance are integral to the product surface, but not enough to underwrite technical resilience. The pool does not contain independent evidence on uptime SLAs, false-positive or false-negative trade-offs, customer-incident postmortems, or developer-community telemetry such as open-source activity, package usage, or forum traction. For diligence, that means the product looks mature and broad on paper, but the technical-risk assessment remains partly dependent on vendor-described controls."
    claimRefs: [CE011, CE012]
callouts:
  - calloutType: risk
    title: Public proof is broad but still vendor-led
    body: "The assigned pool shows meaningful product breadth and trust controls, yet most technical evidence is company-authored or partner-adjacent. Diligence still needs independent proof on reliability, model-error trade-offs, and practitioner adoption before product defensibility can be treated as fully underwritten."
    claimRefs: [CE011, CE012]
