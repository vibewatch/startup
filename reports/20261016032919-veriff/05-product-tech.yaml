      - ["Decision engine", "Combine document analysis, biometrics, liveness, and session scoring", "Veriff's own models, document database, and rule configuration", "No independent view into model architecture, drift management, or error rates"]
      - ["Risk enrichment", "Analyze 1,000+ data points plus network/device signals and optional compliance screening", "Signal quality, watchlist coverage, and policy tuning", "Public evidence does not show hit quality, false alerts, or edge-case handling"]
      - ["Delivery and operations", "Return decisions, scores, and insights through API/webhooks with optional manual review", "Webhook security, support operations, and specialist workforce", "No public uptime SLA, support SLA, or incident-response evidence in assigned pool"]
    notes: "Architecture table uses only publicly visible surfaces in the assigned pool; internal model design, hosting topology, and SRE practices remain undisclosed."
    claimRefs: [CE002, CE004, CE007, CE008, CE011, CE012]
