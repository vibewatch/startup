evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-founder-table
    missingEvidence: A current official leadership page or board roster naming all executives and directors.
    whyItMatters: Founder dependence and governance quality cannot be judged cleanly from financing-era references alone.
    diligencePath: >-
      Request the latest board deck or governance schedule and reconcile it against investor rights from the Series B
      and Series C documents.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: cumulative-funding
    missingEvidence: >-
      A round-by-round financing ledger or cap-table excerpt that reconciles whether smaller bridge or pre-seed checks
      are counted in total capital raised.
    whyItMatters: Valuation framing and ownership dilution analysis both depend on a clean funding baseline.
    diligencePath: Ask management for a dated capitalization summary from inception through the last priced or secondary event.
    relatedQuestionRefs:
      - QO004
      - QO008
  - type: missing-source
    severity: material
    topic: office-footprint-and-headcount
    missingEvidence: A current primary source for exact headcount and active office locations.
    whyItMatters: >-
      Later operating-leverage and international-execution analysis should not rely on a single-directory employee
      proxy.
    diligencePath: Request a current org summary showing FTE count, office list, and major geographic hubs.
    relatedQuestionRefs:
      - QO005
      - QO009
  - type: stale
    severity: material
    topic: current-valuation
    missingEvidence: A post-2022 financing, tender, 409A, or other market-based valuation reference.
    whyItMatters: >-
      The public $1.5B mark is now old enough that it should not be treated as a current pricing signal without a
      refresh.
    diligencePath: Ask management or major investors for any later financing, tender, secondary, or internal valuation marker.
    relatedQuestionRefs:
      - QO007
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: A current shareholder list and revenue concentration view for named customers.
    whyItMatters: >-
      The stakeholder map is directionally useful but does not reveal present ownership concentration or customer
      dependence.
    diligencePath: Request the current cap table, top-customer revenue mix, and any side letters affecting investor control.
    relatedQuestionRefs:
      - QO004
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: data-breach
    missingEvidence: >-
      The underlying regulator notice, incident-forensics summary, and current class-action docket for the reported
      late-2025 Total Wireless customer-data incident.
    whyItMatters: >-
      A secondary summary establishes a live adverse issue but cannot determine final scope, remediation cost,
      liability, or whether additional customers were affected.
    diligencePath: >-
      Obtain the cited New Hampshire notice, management's incident report, cyber-insurance correspondence, and the
      current pleadings and motions in each related case.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      An independent 2025-2026 TAM/SAM/SOM estimate that isolates remote identity verification, repeat authentication,
      and adjacent compliance workflows relevant to Veriff.
    whyItMatters: >-
      Without a buyer-specific dollar market model, the chapter can show footprint and demand intensity but cannot
      cleanly tie valuation to monetizable category spend.
    diligencePath: >-
      Request current third-party analyst market maps or customer procurement data that separate core IDV, recurring
      authentication, and compliance-extension budgets by geography and segment.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: >-
      A split of revenue or gross margin between first-time onboarding checks, repeat authentication, and adjacent
      compliance products.
    whyItMatters: >-
      The current sources show that the category is broadening, but they do not quantify which adjacencies are
      meaningful enough to change Veriff's addressable market or margin profile.
    diligencePath: >-
      Ask management for product-line revenue, attach-rate, and gross-margin disclosure by onboarding, authentication,
      and compliance-extension workflows.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: adoption-constraints
    missingEvidence: >-
      Independent evidence on churn, implementation failures, regulatory objections, or incident-driven adoption
      slowdowns by customer segment.
    whyItMatters: >-
      The market case depends on trust-sensitive adoption; without downside operating evidence, the chapter cannot tell
      whether rising fraud demand fully offsets implementation and regulatory friction.
    diligencePath: >-
      Collect customer references, renewal data, incident histories, and sector-specific compliance objections from
      enterprise buyers and regulators.
    relatedQuestionRefs:
      - QM006
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Recent enterprise contracts, discount schedules, and attach rates for AML, proof-of-address, authentication, and
      ongoing-monitoring modules.
    whyItMatters: >-
      Public list pricing shows the shape of the attack surface, but underwriting premium durability requires knowing
      whether Veriff's realized enterprise pricing closes the gap against integrated suites.
    diligencePath: Request 2026 order forms, realized ASP by segment, and attach-rate data for monitoring and KYB modules.
    relatedQuestionRefs:
      - QP005
  - type: missing-source
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Win/loss notes, implementation timelines, churn drivers, and evidence of whether customers multi-home or replace
      Veriff outright.
    whyItMatters: >-
      The chapter can see control and bundle-based attack vectors, but it cannot yet quantify how sticky Veriff is once
      embedded in production onboarding or authentication workflows.
    diligencePath: >-
      Request sales win-loss analysis, top-20 customer expansion histories, and migration case studies from recent
      competitive deals.
    relatedQuestionRefs:
      - QP006
  - type: missing-source
    severity: material
    topic: regional-performance
    missingEvidence: >-
      Independent benchmark data comparing pass rates, fraud-capture, and non-Latin document performance across Veriff,
      Sumsub, Jumio, Shufti Pro, and Onfido.
    whyItMatters: >-
      Several adverse sources criticize Veriff's coverage or breadth, but competitor-authored comparisons are not a
      substitute for an independent benchmark on quality or regional conversion.
    diligencePath: >-
      Obtain buyer-side scorecards or third-party benchmark studies with matched cohorts by geography, document type,
      and fraud prevalence.
    relatedQuestionRefs:
      - QP007
      - QP008
  - type: private-evidence-only
    severity: material
    topic: liquidity
    missingEvidence: Current cash balance, debt facilities, covenant package, and monthly burn or cash generation.
    whyItMatters: These are the minimum inputs required to judge runway and whether profitability is durable or temporary.
    diligencePath: Request monthly management accounts, latest balance sheet, debt agreements, and 13-week cash forecast.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Realized ASP, discount schedules, refunds, and net revenue retention by cohort or customer segment.
    whyItMatters: List pricing alone cannot establish revenue quality, price power, or margin durability.
    diligencePath: Request price book, discount policy, top-customer invoices, and cohort retention bridge.
    relatedQuestionRefs:
      - QI001
    relatedTableRefs:
      - TI001
      - TI002
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: A reconciled cap table and round-by-round proceeds schedule explaining the $192M versus $200M public totals.
    whyItMatters: Inconsistent public funding totals make it harder to triangulate dilution history and capital consumed to date.
    diligencePath: >-
      Request cap table, closing proceeds by round, and bridge from primary financing to any secondary or debt
      components.
    relatedQuestionRefs:
      - QI006
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, manual-review cost, CAC, payback, and customer concentration.
    whyItMatters: >-
      These metrics determine whether profitable growth is driven by true operating leverage or by mix and accounting
      artifacts.
    diligencePath: >-
      Request audited gross-margin walk, support/review staffing economics, CAC-payback cohort analysis, and top-10
      customer concentration.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: reliability-metrics
    missingEvidence: >-
      Independent evidence on uptime SLA, latency distribution by geography, false-positive/false-negative rates, and
      escalation rates between Full Auto and hybrid review.
    whyItMatters: >-
      Without operating metrics, it is hard to judge whether Veriff's conversion and fraud claims hold across high-risk
      customer segments or only in selected cases.
    diligencePath: >-
      Request enterprise SLA terms, model-quality dashboards, and anonymized production performance cut by vertical,
      geography, and risk tier.
    relatedQuestionRefs:
      - QE003
      - QE004
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A genuine developer-signal source such as public GitHub activity, package telemetry, API forum traffic, or
      practitioner discussion.
    whyItMatters: >-
      Developer and practitioner telemetry is a useful outside-in proxy for integration maturity, implementation
      friction, and ecosystem pull.
    diligencePath: >-
      Collect product-specific GitHub, package-registry, forum, or implementation-partner evidence and compare it with
      competitor developer surfaces.
    relatedQuestionRefs:
      - QE004
      - QE008
  - type: missing-source
    severity: material
    topic: security-incidents
    missingEvidence: >-
      Primary incident reporting, customer notices, or regulator filings covering material product or data-handling
      failures.
    whyItMatters: >-
      Security and privacy are part of the product promise, so the diligence team needs incident-grade evidence rather
      than only company badges and certifications.
    diligencePath: >-
      Ask for incident history, audit reports, customer notification examples, and any regulator correspondence tied to
      identity-verification operations.
    relatedQuestionRefs:
      - QE006
      - QE008
  - type: missing-source
    severity: material
    topic: retention-and-concentration-gap
    missingEvidence: Public NRR, GRR, churn, renewal, average contract length, and top-customer revenue-share disclosures.
    whyItMatters: >-
      Without retention and concentration data, customer breadth cannot be converted into a clean durability or
      downside-risk judgment.
    diligencePath: >-
      Request cohort retention, renewal, average contract term, and top-10-customer concentration from management or
      customer references; cross-check against board materials and pipeline conversion data.
    relatedQuestionRefs:
      - QU006
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof coverage
    missingEvidence: A fuller production customer list with go-live dates, usage scope, and independently sourced outcomes.
    whyItMatters: >-
      Public case studies are marketing-selected and can overstate reference quality if the reader cannot distinguish
      live scaled deployments from pilots or legacy logos.
    diligencePath: >-
      Obtain a customer reference list ranked by revenue and deployment maturity, then confirm a sample through
      procurement records, customer press releases, or direct diligence calls.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: breach-litigation
    missingEvidence: Primary incident notices, court complaints, or a Veriff postmortem for the late-2025 Total Wireless event.
    whyItMatters: Without first-party incident documents, legal reserve, remediation cost, and root-cause severity stay unbounded.
    diligencePath: >-
      Pull the customer notices, any filed complaints, and incident-response communications from Veriff and affected
      customers.
    relatedQuestionRefs:
      - QR002
      - QR008
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Customer concentration, contract length, renewal behavior, and revenue share of top enterprise accounts.
    whyItMatters: Named wins alone do not show whether one lost enterprise relationship can impair growth or margin.
    diligencePath: Request top-10 customer revenue share, NRR/GRR, contract terms, and reference calls by vertical.
    relatedQuestionRefs:
      - QR005
      - QR006
      - QR008
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: Uptime, P95 latency, false-accept and false-reject rates, and incident history by region and vertical.
    whyItMatters: >-
      Speed claims and security marketing do not prove that Veriff sustains conversion and risk controls under real
      production stress.
    diligencePath: Obtain SLA dashboards, historical incident logs, and fraud-loss / manual-review trend data from management.
    relatedQuestionRefs:
      - QR003
      - QR004
      - QR008
    relatedTableRefs:
      - TR002
  - type: missing-source
    severity: material
    topic: current-valuation-mark
    missingEvidence: A 2026 priced round, 409A, board-approved secondary mark, or similarly current valuation reference.
    whyItMatters: >-
      Without a fresh mark, the recommendation has to anchor on a January 2022 unicorn valuation that may no longer
      reflect market conditions.
    diligencePath: >-
      Request the latest board deck, 409A package, or secondary-mark memo and reconcile it to current revenue and
      profitability.
    relatedQuestionRefs:
      - QV001
      - QV007
      - QV008
  - type: conflicting-data
    severity: material
    topic: valuation-precision
    missingEvidence: >-
      A reconciled explanation for why public third-party sources show 15.0x revenue in one place and 41.6x EV/Revenue
      in another around the same financing anchor.
    whyItMatters: >-
      Unreconciled multiple math makes it risky to defend precise fair-value ranges or target returns from public
      evidence alone.
    diligencePath: >-
      Rebuild the financing bridge from management or investor materials, including revenue basis, EV definitions, and
      whether figures are run-rate or trailing.
    relatedQuestionRefs:
      - QV002
      - QV006
      - QV007
  - type: private-evidence-only
    severity: material
    topic: stack-and-concentration
    missingEvidence: >-
      Current customer concentration, NRR, gross margin, liquidation preferences, and any structured financing or senior
      claims.
    whyItMatters: >-
      These inputs determine whether the 2025 profitability upgrade is durable and whether new investors sit behind
      meaningful overhang.
    diligencePath: >-
      Request cohort retention, top-customer exposure, gross-margin trend, and the latest cap table with all preference
      terms.
    relatedQuestionRefs:
      - QV003
      - QV008
