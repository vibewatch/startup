        blocks:
          - type: paragraph
            body: >-
              证据池中的里程碑脉络一致：Veriff 于 2015 年成立，2018 至 2022 年积极融资，2023 年增加认证与风险评分里程碑，并在 2025 年末公开宣称达到盈利且收入超过
              $100M。对刷新报告的读者而言，关键结论是产品和商业势头仍然真实，但公开公司式披露尚未跟上。最新运营更新来自公司，最新估值信号却仍是过时的 2022 年融资基准。另据 Wikipedia 当前条目，2025
              年末的一起事件暴露了身份文件图片和个人信息，涉及约 8,583 名 Total Wireless
