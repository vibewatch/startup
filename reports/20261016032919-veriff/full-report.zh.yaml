            body: >-
              公开市场数据页面仍主要通过 2022 年 1 月的 Series C 描述 Veriff，多家二级来源对 $100M 融资额和 $1.5B
              估值一致。尽调上更重要的不是该轮融资是否存在，而是本次证据池没有更新的公开估值标记。独立来源对累计融资额也存在分歧：StartupHub 与 Multiples 摘要记为 $192M，而 Multiples 的
              Series C 详细叙述称该轮后累计融资达到 $200M。差异虽不妨碍保留“资本充足、由风险资本支持、已过 Series
              C”的大框架，但在股权表或管理层确认弥合差异前，章节应保留区间，而不是制造虚假的单点精度。
