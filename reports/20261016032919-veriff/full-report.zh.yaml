              - CP007
              - CP009
      - number: '3.4'
        title: 持久性取决于欺诈网络效应能否跑赢商品化
        blocks:
          - type: paragraph
            body: >-
              Veriff 已不再是小众工具：本次来源指向 3,000 多家客户、超过 $100M 的收入、盈利，以及 2025 年认证量超过 30
              倍的增长。规模很重要，因为它能强化跨会话欺诈信号、产品扩展和企业参考价值。相同证据池也清楚显示反向风险：Persona
              式工作流构建器可能让证件和生物核验看起来可以互换，而打包供应商可能把采购中心从接入转化转向供应商整合。因此，Veriff
              的护城河在其网络化欺诈与认证层发挥作用的地方最强；当核验只是可以插入更广合规或工作流技术栈的组件时最弱。
            claimRefs:
