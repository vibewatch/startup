              $100M，核验量同比增长三倍并实现盈利，这说明当前模式已经是规模化交易收入，而非仍在验证规模的实验。需要谨慎的是，所有公开价格点看起来都是目录价格或比价网站摘要，而不是实际净价、折扣或按客户群拆分的收入质量。
