      - number: '1.2'
        title: 创始人、管理层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              本次证据池能清楚确认创始人领导层，但对当前治理的可见度有限。官方页面直接确认 Kaarel Kotkas 是创始人兼 CEO；独立资料与新闻聚合页面则将 Janer Gorohhov
              列为联合创始人兼首席产品官。这种分工表明 Veriff 的商业叙事与产品方向都仍由创始团队主导，也意味着 Kotkas
              存在通常的关键人集中度风险，尽管产品组织似乎有一位明确的联合创始人搭档。治理细节更薄弱：Multiples 保留了与 2021
              年融资相关的董事席位披露，但本章证据池看不到当前完整董事会、观察员权利或之后的治理变化。
