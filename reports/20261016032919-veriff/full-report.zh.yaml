chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品边界与当前规模
        blocks:
          - type: paragraph
            body: >-
              Veriff 将自己定位为面向数字身份、生物识别和企业核验的 AI 原生信任基础设施平台，而不是单点合规工具。其官方页面持续描述一套可全球部署的产品，核心包括 SDK、API、工作流、辅助采集、活体检测，以及设备
              / 网络分析；这也支撑后续章节关于集成深度和买方工作流匹配度的判断。同一批官方来源给出了本组证据中最强的公开规模主张：服务 3,000 多家企业，覆盖 230 多个国家和地区、50 种语言及方言，支持
              12,500 多份身份文件，并以秒而非分钟计量决策速度。这些是公司自述指标，但第三方资料大体复述了相同定位与覆盖范围，因此 Veriff 更像一家已规模化的后期供应商，而非仍在试验阶段的早期产品。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
