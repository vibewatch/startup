            body: >-
              Veriff 披露了有用的运营代理指标，但缺少直接单位经济性，无法建模贡献利润率。产品页面称平均核验耗时为 6 秒、98% 的检查自动完成、95%
              的真实用户首次尝试即可通过。这些指标很重要：更快决策、更少重试和更高自动化应当降低每位获批用户的支持开销与人工审核成本。Veriff 还将制裁、PEP、负面媒体和持续监控检查定位为可选合规模块，说明核心 IDV
              会话之外存在附加销售空间。但本次证据池没有任何来源披露毛利率、每次会话的云 / 调查成本、CAC、回本期或客户集中度影响，因此公开案例在收入机制上最强，在真实经济质量上最弱。
