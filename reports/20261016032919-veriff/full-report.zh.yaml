              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              可投资论点很直接：身份核验仍具战略重要性，Veriff
              现在把自己定位为覆盖核验、认证和反欺诈的信任基础设施，公司也有关于规模、客户相关性和运营效率改善的新证据。[CV005][CV006][CV008][CV009] 如果 2025
              年的改善具有持续性，且业务确实已经超越上一轮定价融资中隐含的 2022 年收入基础，这些事实可以支持为质量付费。[CV002][CV005] 反论点同样清楚：唯一明确的估值锚点仍在 2022
              年，公开倍数彼此无法核对，2025 年末泄露与诉讼则给这家对信任敏感的供应商带来真实的执行和声誉拖累。[CV001][CV003][CV004]
              在没有更新价格发现、客户集中度数据或股权表细节的情况下，反论点足以阻止今天基于公开证据给出买入建议。[CV012][CV013][CV014]
            claimRefs:
              - CV001
