      - number: '4.4'
        title: 财务结论与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              正面判断是，Veriff
              看起来是一家规模化、按使用量驱动的身份平台，有公开证据显示其增长并实现盈利，核验吞吐快，也有机会变现更高价值的合规工作流。负面判断是，价格底线公开，实际实现层却不透明：本处未见公开来源提供实际
              ASP、毛利率、销售效率、集中度、烧钱速度或现金跑道。2025 年末影响 Veriff
              系统内存储数据的泄露事件也很重要，因为即使收入保持健康，整改、合规和保险成本仍可能压低利润。综合来看，本章支持“收入质量有希望但仍缺少公开记录”的判断；现金是否充足应视为待解决的尽调事项，而不是已经获得的结论。
