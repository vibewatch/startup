            body: >-
              本章只能通过可观察的覆盖范围和需求视角估算 Veriff 的市场，无法建立有说服力的公开 TAM / SAM / SOM 体系。6sense 估计其当前客户为 485 家、市场份额
              2.62%，在身份核验与保护品类中排名第 9；同一数据集显示可见客户主要集中在金融科技、科技、区块链和金融服务。第三方与公司来源还显示需求在地域上扩张，拉美被称为高速增长地区，中东、非洲和 APAC
              的扩张也在继续。这些信号说明品类庞大且不断拓宽，但仍不足以形成 Veriff 可变现支出的清晰美元市场模型。
