  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Veriff
              最明确的公开品类锚点是身份核验与保护。公司销售的工作流从证件和自拍采集开始，并延伸到活体检测、制裁名单、PEP、负面媒体和持续监控。因此，其核心可服务市场属于数字信任、KYC、反欺诈和认证预算，而不是全部网络安全或泛合规软件支出。边界也不包括更广义的案件管理、AML
              分析师工具，以及无关的支付或云基础设施。现状替代方案仍然重要：当买方尚不需要持续认证或全球证件覆盖时，人工审核、网点或线下身份识别，以及传统单点方案仍然可行。
            claimRefs:
              - CM001
              - CM002
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM013
