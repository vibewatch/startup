              - CV013
      - number: '8.3'
        title: 情景框架与最终尽调
        blocks:
          - type: paragraph
            body: >-
              乐观、基准和悲观情景都应以已经过时的 2022 年独角兽估值为参照，不要假装能精确测算。乐观情景要成立，2025 年实现盈利、收入超过 $100M 的说法必须延续到 2026
              年，新增客户、反欺诈产品线和地域扩张也要继续叠加增长。[CV005][CV006][CV008][CV009]
              基准情景假设公司运营已经增强，但在投资者看到新一轮融资、二级交易估值或经审计的收入衔接表之前，相对旧估值仍只值得持平至温和的重估。[CV001][CV013]
              悲观情景则假设数据泄露和诉讼的阴影、估值倍数压缩，或不及预期的集中度与利润率质量，迫使估值大幅跌破旧锚点。[CV004][CV012][CV014] 因此，实际尽调不只要问“Veriff
              是不是一家好公司”，还要问“什么样的当前价格、资本结构和客户质量证据，能让它从跟踪对象变成投资对象？”[CV013][CV014]
            claimRefs:
              - CV001
