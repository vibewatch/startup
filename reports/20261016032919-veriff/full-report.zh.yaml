  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开增长
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一种以交易为导向的变现模式：身份核验会话是核心，企业价格则在公开自助目录价之上协商。CheckThat.ai 列出 Essential、Plus 和 Premium 三档，单次核验价格分别为
