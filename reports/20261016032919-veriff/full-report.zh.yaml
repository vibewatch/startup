        title: 资本充足性、融资可见度与未来依赖
        blocks:
          - type: paragraph
            body: >-
              公开追踪数据仍以 2022 年 Series C 和过时的独角兽估值锚点描述 Veriff，而不是披露当前资产负债表。StartupHub.ai 称累计融资 $192M，Tracxn 列为
              $200M，并另行指出截至 2025 年 12 月 31 日，法人实体 Veriff OÜ 的收入区间为 €50M 至
              €100M。正确的综合判断不是某一来源必然错误，而是公开资料还无法把实体层营业额、合并公司收入和累计融资追踪数据对上。如果 Veriff 宣称的盈利具有持续性，近期融资依赖可能低于 2022
              年；但没有现金余额、烧钱速度、债务义务、契约细节或营运资金数据，仅凭公开证据仍无法评估公司的流动性韧性。
