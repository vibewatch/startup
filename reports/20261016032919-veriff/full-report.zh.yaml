      - number: '2.3'
        title: 买方、用户与预算归属
        blocks:
          - type: paragraph
            body: >-
              可观察到的买方图谱以企业为先，并且高度贴合工作流。公开案例显示 Veriff
              服务金融服务、市场平台、出行、零工经济、游戏及其他数字原生行业；这些企业需要接入用户、判断是否信任用户，且往往还要在之后再次认证。用户是拍摄证件和自拍的终端客户，但买方和付款方是负责选择反欺诈控制、接入摩擦、合规范围与核验经济性的企业团队。因此预算很可能归合规、欺诈
              / 风险、信任与安全或接入运营负责人，而不只是终端消费者或集中的 CIO 预算。
            claimRefs:
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM015
      - number: '2.4'
        title: 需求驱动、相邻领域与约束
        blocks:
          - type: paragraph
            body: >-
              需求受到两个相互关联的变化拉动：AI
              驱动的欺诈提高了薄弱身份控制的代价，而买方越来越希望身份工具在接入之后继续用于重复认证和更广泛的信任基础设施。独立报道将这一变化与合成身份、深度伪造和可复用数字身份工作流联系起来；近期 2026 年更新信号显示
              Veriff 正延伸至地址核验和工作权检查。市场同时受信任与监管敏感性约束。买方仍需要知道经常性认证与首次 KYC 各占多少支出、预算在细分市场间如何分配，以及监管或实施摩擦是否会拖慢更保守行业的采用。
            claimRefs:
              - CM003
              - CM004
              - CM012
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 品类正从单点 KYC 拓宽到持续信任基础设施
            body: 最重要的市场变化不只是接入身份核验需求增加，而是转向重复认证及相邻信任工作流；这会让能够在注册后继续留在交易流程中的供应商，拥有更高的长期预算相关性。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM012
          - type: callout
            title: 公开证据仍无法单独确定有价格依据的 SAM
            body: 本次证据池足以展示覆盖范围、细分组合和需求强度，却不足以按买方、地域或工作流为 Veriff 的可变现部分定价。因此，市场规模的可信度仍低于估值模型理想所需水平。
            calloutType: risk
            claimRefs:
              - CM014
              - CM015
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 市场已从单点 IDV 拓宽到套件、既有厂商与控制优先型替代方案
        blocks:
          - type: paragraph
            body: >-
              现有证据支持将 Veriff 周围的竞争者分为三类。第一类是 Jumio 和 Entrust IDV（Onfido）等直接企业 IDV 对手，竞争重点是高保证度接入、移动体验和更广的企业安全分销。第二类是
              Sumsub、Ondato 等广度优先的合规套件，试图在 KYC、KYB、AML 和监控之间减少供应商数量，而不是销售独立核验步骤。第三类是 Persona、Microblink
              等工作流与基础设施导向的替代方案，适合希望比托管式 IDV
              供应商提供更多逻辑、用户体验、隐私或部署控制的买方。本次证据池对人工审核现状和量化的内部构建经济性描述较少，因此这些路径应视为资料不足的替代方案，而非已解决的问题。
            claimRefs:
              - CP004
              - CP006
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP011
              - CP012
      - number: '3.2'
        title: Veriff 的切入口是全球化、低摩擦 IDV；挑战者从广度和控制权发起进攻
        blocks:
          - type: paragraph
            body: >-
              Veriff
              自身产品页面仍记录了其获胜的核心理由：广泛的证件覆盖、引导式接入流程、可选制裁与负面媒体检查，以及能够延伸到注册之外的认证和欺诈信号。这为首要问题是转化和反欺诈捕捉的团队创造了真实产品切口。挑战在于，竞争者撰写的对比内容反复将
              Veriff 描述为比广泛合规平台更窄、比工作流或隐私优先替代方案更难控制。换句话说，Veriff 不仅要证明技术准确，还要让买方接受专用的托管式核验层，而不是更大的合规操作系统或更可配置的身份技术栈。
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP007
              - CP008
              - CP010
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP010
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP007
              - CP013
              - CP014
      - number: '3.3'
        title: 定价与包装比功能清单更能决定攻击面
        blocks:
          - type: paragraph
            body: >-
              公开定价证据零散，但方向清楚。Sacra 将 Veriff 描述为按使用量计费的业务，提供按次核验的自助价格，并另行收取 AML 与持续监控费用；竞争者页面则把 Ondato、Persona
              和集成套件定位为更容易评估，或在单份合同中覆盖更广。这一点很重要，因为买方比较的不是孤立的核验准确率，而是总成本、供应商数量、实施负担以及谁负责下游合规运营。买方若优化的是转化率与全球证件支持，Veriff
              仍能获胜；但实际企业价格不透明，会让套件供应商更容易讲出简单的采购故事。
            claimRefs:
              - CP003
              - CP005
