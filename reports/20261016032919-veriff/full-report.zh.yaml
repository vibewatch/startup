            claimRefs:
              - CR009
              - CR015
          - type: callout
            title: 缓释措施广泛，但大多由公司自述
            body: Veriff 公开记录了认证、制裁 / PEP 工具、持续监控、人工参与审核和高自动化，但本次证据池仍缺少独立的服务水平和事件响应数据来验证这些控制在压力下是否有效。
            calloutType: insight
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR009
          - type: callout
            title: 在评估下行前要求事件、集中度和 SLA 证据
            body: 公开记录支持继续尽调，却不足以评估集中度或法律下行；在形成明确判断前，应取得一级泄露记录、客户集中度与续约数据，以及运营服务指标。
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR007
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Veriff 的业务质量看起来好于 2022 年那一轮：公司称 2025 年 12 月收入翻倍至超过 $100M，实现盈利，核验量同比增长三倍，并新增 Western Union、Instacart、Uber 和
              Bumble 等大客户。[CV005][CV006][CV009] 产品本身看起来也有溢价，公司的宣传包括平均核验耗时 6 秒、98% 自动化、首次尝试成功率 95%，以及覆盖 230
              多个国家和地区的证件。[CV007] 问题在于价格支撑：保留的公开估值锚点仍是 2022 年 1 月的 $1.5B Series
              C，第三方数据集对该轮公开倍数的表述也不一致。[CV001][CV002][CV003][CV004]
              运营趋势向好，但价格信号过时，且下行记录如今包含与泄露有关的诉讼，因此证据支持继续跟踪公司；只有更近的估值标记或更扎实的私有尽调弥合估值缺口后，才应接洽。[CV012][CV013][CV014]
            claimRefs:
              - CV001
