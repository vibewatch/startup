        - date: '2018-06-18'
          label: Series A 融资
          detail: Multiples 记录了一轮约 $8M、由 Mosaic Ventures 领投的 Series A，另有多位知名天使和风投参与。
          tone: positive
          claimRefs:
            - CO008
        - date: 2020-07
