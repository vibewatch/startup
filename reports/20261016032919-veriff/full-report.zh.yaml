    title: 客户旅程图
    type: journey-map
    summary: Veriff 似乎正从入驻验证扩展到重复身份认证及相邻合规模块。
    data:
      nodes:
        - label: 细分领域入口
          touchpoints:
            - Financial services, fintech, crypto, gaming, mobility, and online marketplaces recur in public positioning
            - Buyers appear to include compliance, fraud, product, and trust teams
        - label: 初始入驻
          touchpoints:
            - Document-plus-selfie or document-only verification at signup
            - SDK, web, and API deployment options support merchant integration
        - label: 验证决策
          touchpoints:
            - Company materials claim 6-second average decisions and 95% first-try success for genuine users
            - Human review sits behind automated checks where needed
        - label: 持续身份认证
          touchpoints:
            - Authsignal describes biometric authentication built on an approved Veriff IDV session
            - Returning users can be challenged without resubmitting documents each time
        - label: 合规扩展
          touchpoints:
            - Optional PEP, sanctions, adverse media, and ongoing monitoring modules deepen scope
            - Proof-of-address recognition broadens regulated workflow coverage
        - label: 客户账户扩展循环
          touchpoints:
            - Higher verification and authentication volumes suggest usage expansion after initial land
            - Partner platforms such as Alloy and Authsignal can create indirect channel growth
