  - id: TV003
    title: 乐观情景 / 基准情景 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观情景
        - 盈利能力和超过 $100M 的收入延续至 2026 年，客户赢单持续累积，更广义的信任基础设施故事也从入驻扩展出去。
        - 一旦最新融资或可信二级市场估值标记确认其持续性，估值可能达到或超过过时的 2022 年 $1.5B 标记。
        - 如果客户集中度或流失情况不佳，最新增长可能更多由营销推动，而非客户群表现推动。
        - 需要新的价格发现和私人财务尽调。
      - - 基准
        - 经营质量有所改善，但没有出现新的公开价格信号，投资人仍依据 2022 年前后的估值参考进行投资判断。
        - 在新的定价信号出现前，应继续以旧估值标记为跟踪基准，不宜先按公允价值上调处理。
        - 倍数压缩和过时的资本结构表信息要求严格控制入场价格。
        - 这与当前留存证据最为一致。
      - - 悲观情景
        - 漏洞后果、诉讼或弱于预期的经济性，会降低市场为高溢价信任软件倍数付费的意愿。
        - 在信任、利润率和集中度问题解决前，支持相对 2022 年估值标记大幅折价。
        - 在受监管垂直领域，声誉受损或转化放缓的影响可能超过收入增长 headline 数字。
        - 如果新的尽调削弱 2025 年改善的叙事，就会触发该情景。
      - - 价格出清触发条件
        - 最新一轮原始融资、409A 或可信二级市场估值标记得到披露或在尽调中分享。
        - 投资人可以依据当前假设而非 2022 年假设重置估值。
        - 没有这一信息，公开锚点仍然过时。
        - 当前缺失。
      - - 否决触发条件
        - 私人尽调显示客户集中度不利、优先权条款激进，或漏洞成本抹平了盈利改善。
        - 这会让旧的 2022 年锚点对新资金而言也过于昂贵。
        - 留存公开证据中看不到这些事项。
        - 在提出投资建议前，必须排除这些风险。
    notes: 情景区间有意保持定性，并锚定过时的 2022 年估值标记，因为留存公开证据不足以支持精确的 2026 年估值计算。
