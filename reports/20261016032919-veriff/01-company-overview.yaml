      - ["Tiger Global & Alkeon", "Series C co-leads", "Most visible late-stage financial sponsors in public data.", "Secondary datasets tie both firms to the Jan 2022 $100M round and $1.5B valuation.", "Confirm pro-rata rights, liquidation preferences, and any later secondary activity."]
