  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: leadership-and-founder-table
      missingEvidence: A current official leadership page or board roster naming all executives and directors.
      whyItMatters: Founder dependence and governance quality cannot be judged cleanly from financing-era references alone.
      diligencePath: Request the latest board deck or governance schedule and reconcile it against investor rights from the Series B and Series C documents.
      relatedQuestionRefs: [QO009]
      relatedTableRefs: [TO002]
    - type: conflicting-data
      severity: material
      topic: cumulative-funding
      missingEvidence: A round-by-round financing ledger or cap-table excerpt that reconciles whether smaller bridge or pre-seed checks are counted in total capital raised.
      whyItMatters: Valuation framing and ownership dilution analysis both depend on a clean funding baseline.
      diligencePath: Ask management for a dated capitalization summary from inception through the last priced or secondary event.
      relatedQuestionRefs: [QO004, QO008]
    - type: missing-source
      severity: material
      topic: office-footprint-and-headcount
      missingEvidence: A current primary source for exact headcount and active office locations.
      whyItMatters: Later operating-leverage and international-execution analysis should not rely on a single-directory employee proxy.
      diligencePath: Request a current org summary showing FTE count, office list, and major geographic hubs.
      relatedQuestionRefs: [QO005, QO009]
    - type: stale
      severity: material
      topic: current-valuation
      missingEvidence: A post-2022 financing, tender, 409A, or other market-based valuation reference.
      whyItMatters: The public $1.5B mark is now old enough that it should not be treated as a current pricing signal without a refresh.
      diligencePath: Ask management or major investors for any later financing, tender, secondary, or internal valuation marker.
      relatedQuestionRefs: [QO007, QO009]
    - type: enumeration-incomplete
      severity: minor
      topic: stakeholder-or-investor-map
      missingEvidence: A current shareholder list and revenue concentration view for named customers.
      whyItMatters: The stakeholder map is directionally useful but does not reveal present ownership concentration or customer dependence.
      diligencePath: Request the current cap table, top-customer revenue mix, and any side letters affecting investor control.
      relatedQuestionRefs: [QO004, QO009]
      relatedTableRefs: [TO003]
    - type: missing-source
      severity: material
      topic: data-breach
      missingEvidence: The underlying regulator notice, incident-forensics summary, and current class-action docket for the reported late-2025 Total Wireless customer-data incident.
      whyItMatters: A secondary summary establishes a live adverse issue but cannot determine final scope, remediation cost, liability, or whether additional customers were affected.
      diligencePath: Obtain the cited New Hampshire notice, management's incident report, cyber-insurance correspondence, and the current pleadings and motions in each related case.
      relatedQuestionRefs: [QO007]
