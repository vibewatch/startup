      - ["Mosaic, Y Combinator, NordicNinja, Change Ventures, Superangel", "Earlier-stage backers", "Provide historical cap-table layering and early validation.", "Multiples attributes these investors to the 2018-2020 rounds and extension financing.", "Request clean round-by-round ownership bridge from seed through Series C."]
      - ["Western Union, Uber, Instacart, Bumble", "Named customer references", "Commercial proof points that support enterprise relevance more than control rights.", "Veriff's 2025 announcement cites them as recent wins during the move past $100M revenue.", "Validate revenue concentration, contract duration, and whether wins represent pilots or scaled deployments."]
    notes: >-
      Partial map focused on stakeholders explicitly named in the assigned
