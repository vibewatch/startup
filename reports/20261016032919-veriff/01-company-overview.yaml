figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      The public record shows an early financing sprint through 2022, visible
      product/regulatory milestones in 2023, and a company-reported step-up to
      profitability and $100M+ revenue in 2025.
    data:
      items:
        - date: "2015"
          label: "Founded in Tallinn"
          detail: "Independent profiles and market-data pages describe Veriff as founded in 2015 in Tallinn, Estonia."
          tone: neutral
          claimRefs: [CO001]
        - date: "2018-06-18"
          label: "Series A financing"
          detail: "Multiples records a roughly $8M Series A led by Mosaic Ventures, with several notable angel and venture participants."
          tone: positive
          claimRefs: [CO008]
        - date: "2020-07"
          label: "Extension funding before scale-up"
          detail: "Secondary data records a July 2020 extension round of about $15.5M-$16M ahead of the larger 2021 Series B."
          tone: positive
          claimRefs: [CO008, CO009]
        - date: "2021-04-12"
          label: "Series B and board additions"
          detail: "Independent market-data sources record a $69M Series B and name IVP and Accel board representation after the round."
          tone: positive
          claimRefs: [CO010]
        - date: "2022-01-26"
          label: "Series C at unicorn valuation"
          detail: "Public secondary sources align on a $100M Series C at a $1.5B valuation, which remains the latest visible market mark in this pool."
          tone: positive
          claimRefs: [CO006, CO009]
        - date: "2023-07-11"
          label: "UK identity-framework certification"
          detail: "Parsers.vc surfaces Veriff's UK Government Digital Identity and Attributes Trust Framework certification announcement."
          tone: positive
          claimRefs: [CO013]
        - date: "2023-10-24"
          label: "RiskScore launch"
          detail: "Parsers.vc also surfaces the October 2023 launch of RiskScore for fraud-risk calculation during IDV sessions."
          tone: positive
          claimRefs: [CO013]
        - date: "Late 2025"
          label: "Total Wireless customer-data incident"
          detail: "Wikipedia reports that a Veriff-system incident exposed identity-document images and personal data of approximately 8,583 Total Wireless customers, followed by class-action claims."
          tone: negative
          claimRefs: [CO016]
        - date: "2025-12-10"
          label: "Profitability and $100M+ revenue claim"
          detail: "Veriff's own 2025 announcement says revenue doubled to above $100M, the company became profitable, and verification volumes tripled year over year."
          tone: positive
          claimRefs: [CO012]
    claimRefs: [CO006, CO008, CO009, CO010, CO012, CO013, CO016]
    approximationNotes: null
callouts:
  - calloutType: strength
    title: Scaled product surface is clearer than capital-market freshness
    body: >-
      The official product record is unusually specific on coverage, workflow
      components, and decision speed, while the best public valuation evidence
      is still the January 2022 round.
    claimRefs: [CO002, CO003, CO004, CO006]
  - calloutType: risk
    title: Public-data precision degrades once the analysis shifts from identity to ownership
    body: >-
      Secondary datasets disagree modestly on cumulative funding and do not
      expose a refreshed board, debt picture, or post-2022 market mark. The
      assigned pool also lacks the primary notice and docket behind a reported
      late-2025 customer-data incident, so later valuation and risk analysis
      should preserve both financial and legal uncertainty.
    claimRefs: [CO009, CO010, CO014, CO015, CO016]
