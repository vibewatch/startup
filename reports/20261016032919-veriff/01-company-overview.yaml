schemaVersion: report-v2
artifact: company-overview
slug: veriff
runDate: 2026-10-16
company:
  name: Veriff
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Veriff remains a Tallinn-founded identity-verification company with strong
    current product-scale signals on its own surfaces—3,000+ businesses, 230+
    country coverage, 50 languages, and a 2025 company statement that revenue
    exceeded $100M while the business turned profitable. Independent profile and
    market-data pages broadly corroborate the company's identity and financing
    arc, but they still anchor public valuation to the January 2022 Series C
    and reproduce conflicting cumulative-capital totals; a secondary source also
    reports a late-2025 data breach affecting Total Wireless customers. The
    current board, exact headcount, debt, secondary marks, and primary incident
    record remain only partially visible.
sections:
  - id: identity-and-platform
    title: Identity, product surface, and present scale
    body: >-
      Veriff presents itself as an AI-native trust infrastructure platform for
      digital identity, biometric, and business verification rather than a
      point compliance tool. Its official surfaces consistently describe a
      globally deployable product built around SDKs, APIs, workflows, assisted
      capture, liveness, and device/network analytics, which matters because it
      supports later chapters' assumptions about integration depth and buyer
      workflow fit. The same official sources also make the strongest public
      scale claims in this pool: 3,000+ businesses served, support across 230+
      countries and territories, 50 languages and dialects, 12,500+ supported
      identity documents, and decisioning measured in seconds rather than
      minutes. Those are company-authored metrics, but third-party profiles
      broadly echo the same positioning and geography, making Veriff look like
      a scaled late-stage vendor rather than an earlier experimental product.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Founders, leadership, and governance visibility
    body: >-
      The assigned evidence pool gives clear visibility into founder leadership
      but only partial visibility into present-day governance. Kaarel Kotkas is
      directly confirmed on official pages as founder and CEO, while Janer
      Gorohhov appears in independent profile and news-aggregation surfaces as
      co-founder and chief product officer. That split suggests Veriff remains
      founder-led across both commercial narrative and product direction, which
      raises ordinary key-person concentration around Kotkas even though the
      product organization appears to have a named co-founder counterpart.
      Governance detail is thinner: Multiples preserves board-seat disclosures
      tied to the 2021 financing, but the current full board, any observer
      rights, and any later governance changes are not visible in this chapter's
      source pool.
    claimRefs: [CO010, CO011, CO014]
    tableRefs: [TO002]
  - id: capital-base-and-stakeholders
    title: Funding history, stakeholder map, and public-data tensions
    body: >-
      Public market-data pages still frame Veriff primarily through its January
      2022 Series C, where multiple secondary sources align on a $100M round
      and a $1.5B valuation. The more important diligence nuance is not the
      existence of that round but the absence of any newer public valuation
      marker in the assigned pool. Independent sources also disagree on total
      capital raised: StartupHub and the Multiples summary record $192M, while
      the detailed Series C narrative on Multiples says that round brought total
      funding to $200M. That disagreement is modest enough to preserve
      the broad funding story—well-capitalized, venture-backed, post-Series
      C—but material enough that the chapter should carry a range rather than a
      false single-figure precision until cap-table support or management
      confirmation closes the gap.
    claimRefs: [CO006, CO007, CO008, CO009, CO014, CO015]
    tableRefs: [TO003]
  - id: milestones-and-refresh-takeaways
    title: Milestones that still matter for refresh work
    body: >-
      The milestone arc in the evidence pool is coherent: Veriff was founded in
      2015, financed aggressively from 2018 through 2022, added certification
      and risk-scoring milestones in 2023, and in late 2025 publicly claimed a
      new operating threshold of profitability and revenue above $100M. For a
      refresh reader, the key takeaway is that product and commercial momentum
      still looks real, but public-company-style disclosure has not caught up.
      The most current operating update is company-issued, while the most
      current valuation signal remains a stale 2022 financing benchmark.
      Separately, Wikipedia's current article reports that a late-2025 incident
      exposed identity-document images and personal information of about 8,583
      Total Wireless customers and led to class-action claims. That secondary
      account makes incident scope and legal status a live diligence item, but
      the assigned pool does not contain the underlying regulator notice or case
      docket. Without fresher primary capital-market and incident evidence,
      later chapters should avoid false precision on valuation or liability.
    claimRefs: [CO012, CO013, CO014, CO016]
    figureRefs: [FO001]
