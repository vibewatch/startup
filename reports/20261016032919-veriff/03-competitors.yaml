callouts:
  - calloutType: "strength"
    title: "Veriff's strongest documented edge is scaled identity plus growing authentication"
    body: >
      The cleanest evidence-backed advantage is not generic KYC breadth; it is a scaled, low-friction IDV core that
      is being extended into authentication and cross-session fraud signals.
    claimRefs: ["CP001", "CP002", "CP011", "CP014"]
  - calloutType: "risk"
    title: "The competitive threat comes from both above and below"
    body: >
      Sumsub- and Ondato-style suites attack Veriff from above by bundling monitoring and AML, while Persona and
      Microblink attack from below by making verification look like a configurable infrastructure component.
    claimRefs: ["CP006", "CP007", "CP013"]
  - calloutType: "assumption"
    title: "Public pricing is useful for direction, not for underwriting realized margins"
    body: >
      The assigned pool exposes enough public pricing to show that transparency is a selling point for rivals, but
      not enough contract-level evidence to know whether Veriff's enterprise discounts erase that gap in practice.
    claimRefs: ["CP003", "CP009"]
