company:
  name: "Veriff"
chapter:
  number: 3
  title: "Competitors"
  summary: >
    Veriff still looks strongest as a scaled, low-friction identity-verification specialist, but the assigned
    evidence shows buyers can now defect in three directions: suite vendors that bundle KYC/KYB/AML and
    monitoring, incumbent IDV brands that can ride broader enterprise-security distribution, and infrastructure
    players that offer more deployment or workflow control. The moat looks most durable where customers value
    authentication growth and cross-session fraud intelligence; it looks weakest where pricing transparency,
    post-verification operations, or data-sovereignty control drive the purchase.
sections:
  - id: "competitive-set"
    title: "The market has widened beyond point IDV into suites, incumbents, and control-first substitutes"
    body: >
      The assigned evidence supports three practical competitor classes around Veriff. First are direct enterprise
      IDV rivals such as Jumio and Entrust IDV (Onfido), which compete on high-assurance onboarding, mobile
      experience, and broader enterprise-security distribution. Second are breadth-first compliance suites such as
      Sumsub and Ondato, which try to win by reducing vendor count across KYC, KYB, AML, and monitoring rather
      than by selling a standalone verification step. Third are workflow- and infrastructure-oriented substitutes
      such as Persona and Microblink, which appeal when a buyer wants more control over logic, UX, privacy, or
      deployment than a managed IDV vendor exposes. The pool is materially thinner on manual-review status quo and
      quantified in-house-build economics, so those paths should be treated as under-documented alternatives rather
      than closed questions.
    claimRefs: ["CP004", "CP006", "CP007"]
    tableRefs: ["TP001"]
  - id: "capability-breadth"
    title: "Veriff's wedge is global, low-friction IDV; challengers attack breadth and control"
    body: >
      Veriff's own product surface still documents the core reasons it wins: broad document coverage, a guided
      onboarding flow, optional sanctions and adverse-media checks, and authentication and fraud signals that can
      extend beyond sign-up. That creates a real product wedge for teams whose first problem is conversion plus
      fraud capture. The challenge is that competitor-authored comparisons repeatedly frame Veriff as narrower than
      broader compliance platforms and less controllable than workflow or privacy-first alternatives. In other
      words, Veriff is defending not just technical accuracy, but the proposition that buyers should accept a
      specialized, managed verification layer instead of a larger compliance operating system or a more configurable
      identity stack.
    claimRefs: ["CP001", "CP002", "CP005", "CP007", "CP008", "CP010", "CP014"]
    tableRefs: ["TP002"]
    figureRefs: ["FP001"]
  - id: "pricing-packaging"
    title: "Pricing and packaging shape the attack surface more than feature checklists do"
    body: >
      Public pricing evidence is fragmentary, but it is directionally clear. Sacra describes Veriff as a
      usage-based business with self-serve per-verification pricing and separate charges for AML and ongoing
      monitoring, while competitor pages position Ondato, Persona, and integrated suites as easier to evaluate or
      broader per contract. That matters because buyers do not compare verification accuracy in isolation; they
      compare all-in cost, vendor count, implementation overhead, and who owns downstream compliance operations.
      Veriff can still win when the buyer optimizes for conversion and global document support, but opaque realized
      enterprise pricing makes it easier for suite vendors to tell a simpler procurement story.
    claimRefs: ["CP003", "CP005", "CP006", "CP009", "CP010"]
    tableRefs: ["TP003"]
  - id: "durability-and-risk"
    title: "Durability depends on whether fraud-network effects outrun commoditization"
    body: >
      Veriff is not a small niche tool anymore: the assigned sources point to 3,000-plus customers, revenue above
      $100 million, profitability, and more than 30x authentication-volume growth in 2025. That scale matters
      because it can reinforce cross-session fraud signals, product expansion, and enterprise referenceability. The
      counter-risk is equally clear in the same pool: Persona-style workflow builders can make document and
      biometric verification feel interchangeable, while bundle vendors can move the buying center from onboarding
      conversion to vendor consolidation. The moat therefore looks strongest where Veriff's networked fraud and
      authentication layers matter, and weakest where verification is treated as a component that can be swapped
      into a broader compliance or workflow stack.
    claimRefs: ["CP011", "CP012", "CP013", "CP014"]
