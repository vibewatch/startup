figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: The most material public risks combine high impact with incomplete independent proof of mitigation.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual exposure
      rows:
        - label: Regulatory and privacy drift
          note: Global AML, sanctions, privacy, and age-assurance obligations move by jurisdiction.
          values: [High, High, Medium, High]
        - label: Breach and litigation fallout
          note: The assigned pool contains an adverse signal but lacks the primary incident record.
          values: [Medium, High, Medium, High]
        - label: Fraud-model evasion
          note: AI-native attacks are rising while authentication and liveness usage is scaling quickly.
          values: [High, High, Medium, High]
        - label: SLA and conversion variance
          note: Independent review flags speed variability despite strong official performance claims.
          values: [Medium, High, Medium, Medium-High]
        - label: Customer concentration opacity
          note: Named enterprise wins exist, but public revenue concentration is undisclosed.
          values: [Medium, High, Low, High]
        - label: External dataset and partner dependency
          note: Watchlists, adverse-media feeds, and embedded workflows remain supplier-dependent.
          values: [Medium, Medium-High, Medium, Medium-High]
    approximationNotes: >-
      Ordinal ratings synthesize the assigned evidence and are not company-reported scores; they
      express relative underwriting priority rather than measured probabilities.
    claimRefs: [CR002, CR006, CR007, CR008, CR012, CR013, CR014, CR015]
