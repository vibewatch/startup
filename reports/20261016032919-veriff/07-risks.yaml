company:
  name: Veriff
chapter:
  number: 7
  title: Risks
  summary: >-
    Veriff's public risk profile is driven by the combination of sensitive identity data,
    cross-border compliance obligations, and enterprise-scale dependency risk rather than by
    obvious demand weakness. Official materials show a broad mitigation stack, but the assigned
    evidence still leaves primary-document gaps around incident fallout, customer concentration,
    and operating-service durability.
sections:
  - id: ranked-risk-posture
    title: Ranked risk posture
    body: >-
      The strongest public evidence points to a business whose downside comes from operating a
      sensitive identity and compliance control plane at very large scale, not from a lack of
      product demand. Veriff says it combines AI with human-in-the-loop review, covers 12.5K+
      identity documents across 230+ countries and territories, and handles optional sanctions,
      PEP, adverse-media, and ongoing-monitoring checks, which means failures can carry legal,
      fraud-loss, and reputational spillovers across multiple regulated workflows. At the same
      time, the assigned independent review evidence flags verification-speed variability and
      volume-based pricing, while the company says authentication and liveness volumes grew more
      than 30x year over year. That combination makes model-evasion, latency, and unit-economics
      control the core monitorable risks: Veriff appears to have strong mitigation levers, but
      public evidence does not yet prove how those levers hold up under fraud spikes, large
      customer traffic bursts, or adverse incident response.
    claimRefs: [CR001, CR002, CR003, CR004, CR006, CR011, CR012]
    tableRefs: [TR002, TR003]
    figureRefs: [FR001]
  - id: regulatory-legal-and-privacy-exposure
    title: Regulatory, legal, and privacy exposure
    body: >-
      The regulatory risk is structural because Veriff's own materials frame identity
      verification as a moving target: its education center says businesses struggle to keep up
      with evolving global regulations, and its product page adds sanctions screening, adverse
      media, and ongoing monitoring into the offering. That widens the control surface from
      onboarding accuracy to ongoing compliance monitoring, which raises the cost of stale rules,
      stale watchlists, or incomplete jurisdictional coverage. The sharpest adverse signal in the
      assigned pool is a Wikipedia summary of late-2025 Total Wireless notices and follow-on
      class-action litigation tied to data stored in Veriff systems. Because the pool does not
      include the underlying notices, complaints, or any company postmortem, the issue is
      important but not yet cleanly bounded; the practical diligence posture is to treat it as a
      high-severity legal and privacy exposure until primary records prove otherwise.
    claimRefs: [CR002, CR003, CR008, CR009, CR010, CR015]
    tableRefs: [TR001]
  - id: operating-and-dependency-risks
    title: Operating and dependency risks
    body: >-
      Operating risk sits at the junction of accuracy, speed, and enterprise integration.
      Veriff advertises a 6-second average verification time, 98% automation, and 95% first-try
      success for genuine users, but AI Scanner still lists verification-speed variability as a
      weakness and explicitly recommends SLA review before commitment. That pattern suggests the
      key execution risk is not whether Veriff can verify identities at all, but whether it can
      keep latency, manual-review load, and false decisions inside customer tolerances as fraud
      tactics shift. Dependency risk is also meaningful. The company highlights recent wins with
      Western Union, Instacart, Uber, and Bumble, while Alloy markets Veriff as a partner inside
      broader AML/KYC workflows. Those signals support real enterprise reach, but public evidence
      in the assigned pool does not disclose top-customer revenue share, contract duration,
      renewal dependence, or how much of the compliance workflow depends on third-party channels
      and data feeds. That keeps counterparty and concentration downside materially underwritten
      by private diligence rather than by public proof.
    claimRefs: [CR004, CR006, CR007, CR009, CR013, CR014]
  - id: diligence-gates-and-kill-criteria
    title: Diligence gates and kill criteria
    body: >-
      The investment implication is that Veriff's public mitigations are credible enough to keep
      the company in diligence, but not yet strong enough to shrink downside into a routine
      operating risk. The most important near-term kill criteria are measurable: failure to
      produce primary incident and litigation records for the reported late-2025 breach; inability
      to show customer concentration, retention, and contract-lock-in data for major enterprise
      accounts; and lack of hard service-quality evidence such as uptime, latency distributions,
      or false-accept/false-reject trends by vertical and geography. If those disclosures are
      clean, the existing mitigation narrative can support a manageable-risk view. If they are
      missing or reveal concentrated exposure, the same scale advantages that drive Veriff's
      growth can amplify the downside from a single security, regulatory, or enterprise-account
      failure.
    claimRefs: [CR005, CR006, CR007, CR011, CR015]
callouts:
  - calloutType: risk
    title: Sensitive-data operator with incomplete public incident bounding
    body: >-
      The assigned pool contains an adverse signal around a late-2025 breach and class-action
      litigation, but not the underlying notices or complaints, so breach/legal downside remains
      high severity and incompletely quantified.
    claimRefs: [CR009, CR015]
  - calloutType: insight
    title: Mitigations are broad, but mostly self-described
    body: >-
      Veriff publicly documents certifications, sanctions/PEP tooling, ongoing monitoring,
      human-in-the-loop review, and high automation, yet the assigned pool still lacks the
      independent service-level and incident-response data needed to validate those controls under
      stress.
    claimRefs: [CR001, CR002, CR003, CR004, CR009]
  - calloutType: recommendation
    title: Require incident, concentration, and SLA evidence before underwriting downside
    body: >-
      The public record supports continuing diligence, but not underwriting concentration or
      legal downside; obtain primary breach records, customer concentration and renewal data, and
      operating-service metrics before moving to conviction.
    claimRefs: [CR006, CR007, CR015]
