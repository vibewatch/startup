        - Western Union, Instacart, Uber, Bumble, and similar accounts
        - Transaction volume, reference logos, and workflow embed
        - Named wins are public, but revenue share and renewal dependence are undisclosed
        - A major account loss or stricter procurement standard slows growth and weakens proof points
        - High
        - Diverse vertical coverage and broader authentication use cases reduce single-use-case dependence
        - High
      - - Embedded compliance and channel partners
        - Alloy and comparable workflow or onboarding partners
        - Distribution and integration inside broader AML/KYC stacks
        - Partner page confirms workflow embedding, but breadth and economics are undisclosed
        - Partner reprioritization, substitution, or pricing pressure reduces channel leverage
        - Medium-High
        - Broad direct product suite plus one-integration positioning supports direct and indirect sales
        - Medium
      - - External watchlists, adverse-media, and document datasets
        - Sanctions lists, PEP watchlists, adverse-media feeds, and document libraries
        - Compliance signal and fraud-coverage inputs
        - Official pages stress real-time updates and 12.5K+ document support, but supplier stack is private
        - Stale or incomplete inputs create false clears, false rejects, or uneven regional coverage
        - High
        - Ongoing monitoring, RLHF, and human review provide partial backstops
        - Medium-High
    notes: >-
      Concentration is inferred from named wins and partner positioning, not from disclosed
