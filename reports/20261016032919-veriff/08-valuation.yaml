company:
  name: Veriff
chapter:
  number: 8
  title: Valuation
  summary: >-
    The public record supports a **track** recommendation rather than a buy call: Veriff's
    2025 operating proof improved materially, but the explicit valuation anchor still traces back
    to the January 2022 $1.5B Series C and the retained public multiple references do not
    reconcile cleanly. The combination of stronger scale signals, a late-2025 breach/litigation
    overhang, and missing current cap-table or price-discovery evidence argues for strict entry
    discipline and more diligence before underwriting upside.
sections:
  - id: recommendation-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      Veriff's business quality looks better than it did at the 2022 round: the company said in
      December 2025 that it had doubled revenue to more than $100M, reached profitability, tripled
      verification volumes year over year, and added large customers including Western Union,
      Instacart, Uber, and Bumble.[CV005][CV006][CV009] The product surface still looks premium as
      well, with the company marketing a 6-second average verification time, 98% automation, 95%
      first-try success, and document coverage across 230+ countries and territories.[CV007] The
      problem is price support: the retained public valuation anchors are still Jan 2022 references
      to a $1.5B Series C, and the public multiple framing around that round is inconsistent across
      third-party datasets.[CV001][CV002][CV003][CV004] Because the operating trend is positive but
      the price signal is stale and the downside record now includes breach-related litigation, the
      evidence supports tracking the company and engaging only if a fresher mark or tighter private
      diligence closes the valuation gap.[CV012][CV013][CV014]
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV009, CV012, CV013, CV014]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-versus-anti-thesis
    title: Thesis versus anti-thesis
    body: >-
      The investable thesis is straightforward: identity verification remains strategically
      important, Veriff now presents itself as trust infrastructure spanning verification,
      authentication, and fraud prevention, and the company has fresh evidence of scale, customer
      relevance, and improved operating efficiency.[CV005][CV006][CV008][CV009] Those facts can
      justify paying for quality if the 2025 improvement is durable and if the business has indeed
      grown beyond the 2022 revenue base embedded in the last known priced round.[CV002][CV005]
      The anti-thesis is just as clear: the only explicit valuation anchor still sits in 2022, the
      public multiple references do not reconcile, and the late-2025 breach and lawsuits create a
      real execution and reputation overhang for a trust-sensitive vendor.[CV001][CV003][CV004]
      Without refreshed price discovery, concentration data, or cap-table detail, the anti-thesis
      is strong enough to block a public-evidence buy recommendation today.[CV012][CV013][CV014]
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV008, CV009, CV012, CV013, CV014]
    tableRefs: [TV002]
  - id: scenario-framing-and-final-diligence
    title: Scenario framing and final diligence
    body: >-
      The bull, base, and bear cases should be framed relative to the stale 2022 unicorn mark
      rather than around false precision. A bull case needs the 2025 profitability and >$100M
      revenue claim to hold through 2026 while customer additions, fraud-product breadth, and
      geographic expansion continue to compound.[CV005][CV006][CV008][CV009] A base case assumes
      the business is stronger operationally but still deserves only flat-to-modest repricing
      against the old mark until investors see a current round, secondary mark, or audited revenue
      bridge.[CV001][CV013] A bear case assumes the breach/litigation overhang, multiple
      compression, or weaker-than-expected concentration and margin quality force a material reset
      below the old anchor.[CV004][CV012][CV014] The practical diligence ask is therefore not just
      "is Veriff a good company?" but "what current price, stack, and customer-quality evidence
      would convert this from track to invest?"[CV013][CV014]
    claimRefs: [CV001, CV004, CV005, CV006, CV008, CV009, CV012, CV013, CV014]
    tableRefs: [TV003]
