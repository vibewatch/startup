      current trading multiple.
    claimRefs: [CV001, CV004, CV005, CV012, CV013, CV014]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - ["thesis", "2025 operating proof improved meaningfully: management says Veriff doubled revenue to over $100M, became profitable, and tripled verification volumes.", "Audited or investor-grade financials confirming the durability of that step-up would strengthen conviction."]
      - ["thesis", "The platform still looks premium, spanning verification, authentication, and fraud prevention with broad global document coverage and low-friction onboarding.", "Evidence that these product advantages translate into sticky economics such as NRR, concentration resilience, or lower fraud loss would strengthen the moat case."]
      - ["anti-thesis", "The explicit public valuation anchor still points to the Jan 2022 $1.5B Series C, so current entry price is not externally refreshed.", "A new priced round, 409A, or credible secondary mark would refresh the valuation anchor."]
      - ["anti-thesis", "Trust-sensitive downside risk rose after the reported late-2025 breach and related class actions, while public multiple references remain inconsistent.", "Containment evidence on breach impact plus reconciled current valuation inputs would reduce this objection."]
    notes: >-
      These rows summarize the strongest retained support and disconfirming evidence rather than a
      weighted scoring model.
    claimRefs: [CV001, CV004, CV005, CV007, CV008, CV012, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - ["bull", "Profitability and >$100M revenue persist through 2026, customer wins keep compounding, and the broader trust-infrastructure story expands beyond onboarding.", "Could justify pricing at or above the stale 2022 $1.5B mark once a fresh financing or credible secondary mark confirms durability.", "Fresh growth may prove more marketing-led than cohort-led if concentration or churn is weak.", "Needs new price discovery plus private financial diligence."]
      - ["base", "Operating quality improved, but no fresh public price signal appears and investors still underwrite off 2022-era valuation references.", "Best framed as hold/track around the old mark rather than as an immediate step-up in fair value.", "Multiple compression and stale cap-table information keep entry discipline tight.", "Most consistent with the current retained evidence."]
      - ["bear", "Breach fallout, litigation, or weaker-than-expected economics reduce willingness to pay a premium trust-software multiple.", "Supports a material discount to the 2022 mark until trust, margin, and concentration questions are resolved.", "Reputational damage or slower conversion in regulated verticals could matter more than headline revenue growth.", "Activated if new diligence weakens the 2025 improvement narrative."]
      - ["price-clearing trigger", "A fresh primary round, 409A, or credible secondary mark is disclosed or shared in diligence.", "Lets investors reset valuation on current rather than 2022 assumptions.", "Without it, public anchors remain stale.", "Missing today."]
      - ["no-go trigger", "Private diligence shows adverse concentration, aggressive preferences, or breach costs that erase the profitability upgrade.", "Would make even the old 2022 anchor too rich for new money.", "These items are not visible in retained public evidence.", "Must be ruled out before an invest recommendation."]
    notes: >-
      Scenario bands are intentionally qualitative and anchored to the stale 2022 mark because the
      retained public evidence does not support precise 2026 valuation math.
    claimRefs: [CV001, CV004, CV005, CV006, CV008, CV009, CV012, CV013, CV014]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Stronger 2025 operating proof improves quality, but stale price discovery and trust-risk
      overhang still resolve to a track call.
    data:
      nodes:
        - label: "2025 quality step-up"
          detail: "Company said revenue doubled to >$100M and profitability was reached."
        - label: "Scale and demand proof"
          detail: "Verification volumes tripled YoY and large customers were named."
        - label: "Product breadth"
          detail: "6-second average verification time, 98% automation, and broad global document coverage."
        - label: "Valuation anchor is stale"
          detail: "Explicit public mark still points to the Jan 2022 $1.5B Series C."
        - label: "Downside overhang remains"
          detail: "Breach/litigation risk and unreconciled multiple references weaken price confidence."
        - label: "Recommendation: track"
          detail: "Wait for a fresh mark or stronger private diligence before paying up."
    claimRefs: [CV001, CV004, CV005, CV006, CV007, CV009, CV012, CV013, CV014]
callouts:
  - calloutType: recommendation
    title: Track, don't stretch
    body: >-
      Veriff may deserve premium attention, but the retained public evidence does not yet justify
      paying off a three-year-stale unicorn mark.
    claimRefs: [CV001, CV005, CV013, CV014]
  - calloutType: risk
    title: Price risk matters more than company-quality risk here
    body: >-
      The central blocker is not whether Veriff has momentum; it is whether investors can price that
      momentum confidently after a breach overhang and without a fresh valuation reference.
    claimRefs: [CV004, CV005, CV012, CV013]
