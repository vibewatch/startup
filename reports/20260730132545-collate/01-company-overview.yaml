company:
  name: Collate
chapter:
  number: 1
  title: Company Overview
  summary: >
    Collate is a San Francisco life-sciences software startup founded in 2024 to automate regulatory,
    clinical, quality, and development documentation with AI. Public evidence shows a rapid funding arc
    from a $30 million seed in January 2025 to a $95 million Series B in June 2026, taking total funding
    to $125 million and valuation close to $1 billion, but also leaves major gaps around revenue,
    headcount, customer names, and formal governance.
sections:
  - id: identity-product-stage
    title: Identity, product scope, and current stage
    body: >
      Collate presents itself as an AI platform built specifically for life sciences paperwork rather than
      a generic document assistant. On its homepage and about materials, the company says it helps
      diagnostic, medical-device, and drug-development teams create and streamline documentation from
      concept through commercialization, with explicit emphasis on research, preclinical and clinical
      workflows, quality management, and product launch. The positioning matters because regulated
      submissions are both large and structured: FDA guidance and the eCTD standard require formally
      organized submissions for NDAs, BLAs, ANDAs, INDs, and related amendments, creating a complex,
      rules-bound environment where automation must coexist with auditability and human review.

      Public company materials also show that Collate is still a private, disclosure-light business.
      The website offers marketing, security, privacy, and terms pages, but no revenue, pricing,
      headcount, or customer-logo disclosure. Legal and investor references consistently place the company
      in San Francisco, and the privacy policy names the operating entity as Collate Software, Inc.
      The net result is a company with clear category ambition and concrete product language, but a thin
      public operating-data footprint typical of an aggressively funded Series B startup.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO005
      - CO007
      - CO009
      - CO028
      - CO036
    tableRefs:
      - TO001
    figureRefs:
      - FO002
  - id: founders-leadership-fit
    title: Founders, leadership, and founder-market fit
    body: >
      The founding team is unusually strong for this niche because it combines deep life-sciences workflow
      experience with enterprise software scale. CEO Surbhi Sarna previously founded nVision Medical,
      built an ovarian-cancer detection device company through clinical trials and FDA clearances, and sold
      the business to Boston Scientific for $275 million. She later served as a General Partner at Y
      Combinator focused on healthcare. That background directly explains Collate's thesis: Sarna has said
      her prior operating experience exposed how paperwork slows life-sciences development at nearly every
      stage. CTO Nate Smith brings the complementary software side; multiple sources identify him as Lever's
      cofounder and former CEO/CTO, and official acquisition coverage says Employ bought Lever in 2022.

      Collate's public leadership page adds more technical depth than most early private companies. It lists
      founder and chief architect Jigish Patel, plus senior AI and engineering hires from NVIDIA, Amazon,
      Hippocratic AI, Google, PicnicHealth, ArsenalBio, Square, Facebook, and TikTok. That does not remove
      key-person dependence—Sarna remains the public face, domain expert, and fundraising anchor—but it does
      show the company has staffed beyond a two-founder story and is deliberately building for regulated,
      enterprise-grade deployment.
    claimRefs:
      - CO016
      - CO017
      - CO018
      - CO019
      - CO020
      - CO021
      - CO030
      - CO032
    tableRefs:
      - TO002
  - id: funding-customers-momentum
    title: Funding history, investor backing, and traction signals
    body: >
      Collate's funding trajectory is the clearest public proof point. Forbes reported that the company
      emerged from stealth in January 2025 with a $30 million seed led by Redpoint and participation from
      First Round, Conviction Partners, and Y Combinator, at a valuation above $100 million despite having
      no commercial product or customers at the time. Eighteen months later, Forbes, Ventureburn, SaaS
      News, and other follow-on coverage reported a $95 million June 2026 round led by Redpoint that
      brought total funding to $125 million and valued the company at roughly or approaching $1 billion.
      Redpoint's own portfolio page says it first partnered with Collate at the seed stage in 2025,
      confirming repeat-lead support rather than a one-off financing event.

      Traction claims are promising but selective. Forbes says Collate signed its first customer in May 2025
      and had added roughly 50 more by June 2026 across large pharma, medtech, and public biotech accounts.
      The company also claims 50% to 90% time savings, documents compressed from roughly seven months to a
      month or less, and accuracy often above 90% with mandatory human verification before export. Those are
      meaningful adoption signals, but none of the reviewed public sources disclose revenue, ACV, retention,
      named customers, or audited operating metrics, which limits underwriting confidence.
    claimRefs:
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
      - CO023
      - CO024
      - CO025
      - CO027
      - CO031
      - CO037
      - CO039
      - CO040
    tableRefs:
      - TO003
    figureRefs:
      - FO003
  - id: milestones-context-risks
    title: Milestones, market context, and early diligence flags
    body: >
      The milestone record is short but coherent. Collate was founded in 2024, emerged from stealth at the
      January 2025 J.P. Morgan Healthcare Conference with a large seed round, landed its first customer in
      May 2025, updated core legal and security materials in early 2025 and mid-2026, and announced its
      $95 million Series B on June 3, 2026. Dealroom's June 2026 new-unicorn list includes Collate, which
      is directionally consistent with press reports that the round valued the business near the $1 billion
      mark. The company has therefore moved from concept-stage founder thesis to scaled venture-backed
      platform narrative in less than two years.

      The biggest diligence flags are not existential, but they are material. Collate still does not publish
      customer references, revenue, headcount, pricing, or board composition. Competitor and regulator
      sources show the company is entering a market with established RIM, content-management, and submission
      incumbents that already emphasize compliance controls, audit trails, and explainable workflows.
      Competitor messaging from Rimsys and other regulatory vendors is implicitly skeptical of generic AI
      overlays, underscoring that Collate must prove not just drafting speed but production-grade compliance,
      validation discipline, and change control. In short, public evidence supports momentum, but not yet a
      fully de-risked operating story.
    claimRefs:
