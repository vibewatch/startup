  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: integration-depth
    missingEvidence: Named integrations, connector inventory, validated export workflow, and migration tooling details.
    whyItMatters: Enterprise adoption in regulated systems depends on moving from draft assistance to dependable workflow interoperability.
    diligencePath: Request architecture diagrams, integration map, validation SOPs, and production deployment references.
  - type: private-evidence-only
    severity: material
    topic: reliability-metrics
    missingEvidence: Uptime history, disaster-recovery posture, support SLAs, and quality metrics for production deployments.
    whyItMatters: Regulated workflow software is judged on operational reliability as much as on AI capability.
    diligencePath: Request customer-facing SLAs, incident history, DR architecture, and support model.
  - type: missing-source
    severity: minor
    topic: module-catalog
    missingEvidence: A public module/SKU map tied to concrete workflow steps.
    whyItMatters: Without a clearer module taxonomy, outsiders must infer platform breadth from broad marketing language.
    diligencePath: Request product brief, admin guide, or implementation overview with feature taxonomy.
