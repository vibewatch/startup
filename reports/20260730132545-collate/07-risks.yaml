  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: production-risk-evidence
    missingEvidence: Production error rates, review escapes, validation procedures, incident history, and DR posture.
    whyItMatters: The top risk is controlled regulated-AI execution, and policy text alone cannot clear it.
    diligencePath: Request customer-facing quality metrics, validation SOPs, incident log, and disaster-recovery documentation.
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration-risk
    missingEvidence: Retention, renewal, margin, and concentration data by customer cohort.
    whyItMatters: Financial/model risk cannot be separated from customer durability and services burden.
    diligencePath: Request cohort dashboard, revenue concentration, gross-margin bridge, and support-load metrics.
  - type: missing-source
    severity: minor
    topic: benchmark-risk-disclosures
    missingEvidence: Comparable risk-factor disclosures from multiple category leaders beyond Veeva.
    whyItMatters: A broader benchmark set would improve confidence in how much of Collate’s risk is startup-specific versus category-normal.
    diligencePath: Add direct filing risk sections from more public comparables in a later update.
