        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              On balance, Collate looks financeable rather than financially proven. The company has credible sponsor
              support, rapid early customer acquisition, and a business model that appears compatible with high-ACV
              recurring software. Those are valuable ingredients. Yet every serious underwriting question about revenue
              quality remains open: revenue concentration, renewal behavior, services intensity, gross margin,
              implementation effort, pipeline conversion, and cash burn. An investor can reasonably believe the model
              works, but cannot validate that belief from public disclosures alone.


              The best way to interpret the current state is asymmetry between promise and proof. The market is clearly
              willing to fund the story, and the customer problem is real. The risk is that regulatory AI economics can
              look excellent before the burden of validation, customer-specific configuration, and procurement drag
              fully surfaces. The next diligence layer should therefore focus on cohort quality and unit economics
              rather than headline customer count. If management can show expanding usage, limited services drag, and
              disciplined burn against the new capital base, the financial case strengthens materially. If not, the
