companyProfile:
  summary: |
    Collate is a San Francisco–based private startup founded in 2024 by Surbhi Sarna and Nate
    Smith to automate the paperwork and workflow burden that life sciences companies face across
    research, clinical development, quality, regulatory submission, and commercialization. The
    company positions its software as an AI platform for every step of the product lifecycle and
    publicly emphasizes secure, human-verified, enterprise-grade handling of regulated content.
    Public reporting suggests unusually rapid early customer adoption among large pharmaceutical,
    medical-device, and public biotech organizations, while the June 2026 financing marked a
    major validation event by bringing total funding to about $125M and valuation near $1B.
