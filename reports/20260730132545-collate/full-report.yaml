      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >
              The buyer is rarely a single persona. Regulatory affairs and regulatory-operations leaders usually own the
              problem because they are accountable for submission readiness, correspondence, and lifecycle tracking, but
              the user base spans medical writers, clinical teams, quality specialists, CMC authors, labeling staff, and
              outside partners. IT and security functions enter early because these systems must satisfy access control,
              auditability, and integration requirements, while finance or operations leaders effectively become payers
              when the contract is framed around time-to-market, headcount leverage, or global submission throughput.
              That multi-stakeholder buying motion explains why vendors emphasize both collaboration features and
              compliance controls.

              Adoption typically starts where the paperwork burden is heaviest: IND-enabling packages, major global
              submission sequences, post-approval change control, and quality documentation in regulated device or
              pharma environments. Smaller biotech companies may begin with point tools such as eCTD publishing or a
              lightweight RIM layer, while larger enterprises favor integrated platforms and phased rollouts. Collate's
              public traction narrative around big pharma, medtech, and public biotech suggests it is aiming above the
              smallest SMB segment and selling into accounts where the documentation burden is painful enough to fund a
              specialized platform.
            claimRefs:
