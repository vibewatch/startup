      - number: '7.5'
        title: Financial/model risk, mitigations, and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              Financial risk at Collate is mostly a function of unknowns rather than visible distress. The company is
              well funded after its 2026 round, but public evidence still does not disclose burn, runway, gross margin,
              concentration, or renewal quality. That matters because enterprise AI companies can look efficient early
              when design-partner enthusiasm is high, only to discover heavy implementation costs, slower renewals, or
              concentrated revenue later. The model risk is therefore that customer excitement outruns durable
              economics.


              The visible mitigations are sensible. The team has strong domain and infrastructure backgrounds, the
              product problem is real, customer interest appears genuine, and the public trust posture is stronger than
              many startups publish. The main monitoring indicators should be named production references, expansion
              inside live accounts, stability of human-review and permission workflows, evidence of low
              hallucination/error rates in production, and eventually retention and gross-margin data. The thesis breaks
              if Collate remains unreferenceable, if customers confine it to pilot use, or if incumbents absorb the same
              workflow into broader suites faster than Collate can prove embedded value.
            claimRefs:
              - CR021
              - CR022
