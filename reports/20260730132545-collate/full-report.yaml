              - CR014
              - CR033
      - number: '7.4'
        title: Dependency, platform, and competition risk
        blocks:
          - type: paragraph
            body: >-
              Dependency risk shows up in two forms. First, Collate depends on enterprise willingness to embed AI into
              regulated document workflows. Even if that willingness is growing quickly, budget owners may still prefer
              vendors that already own the system of record or can bundle validation, migration, and lifecycle control.
              Second, the company appears to rely on third-party AI providers under zero-retention policies, which is
              sensible but still leaves a dependence on external model infrastructure and ongoing vendor governance.


              Competition amplifies both risks. Veeva, IQVIA, OpenText, MasterControl, and Generis already market
              compliant workflows, enterprise controls, and increasingly AI-enhanced features. They also have larger
              installed bases, richer public customer proof, and in several cases much deeper implementation ecosystems.
              If incumbents can make regulated authoring faster without asking customers to change vendors, Collate’s
              wedge narrows. The company’s best defense is that buyers may still want a more usable and specialized
              workflow layer than incumbents provide. The risk is that this window closes before Collate reaches enough
              depth and referenceability.
            claimRefs:
              - CR016
              - CR017
              - CR018
              - CR019
              - CR020
              - CR034
