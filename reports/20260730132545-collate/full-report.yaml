              - CR031
      - number: '7.2'
        title: Regulatory, legal, and privacy risk
        blocks:
          - type: paragraph
            body: >-
              The central regulatory risk is not that Collate needs its own FDA approval, but that its software operates
              inside documentation processes governed by FDA, EMA, and ICH submission expectations. In these workflows,
              process integrity, traceability, and change control matter because submission packages can be large,
              highly structured, and consequential to patient-facing programs. Any AI-generated error that survives
              review can create rework, delay, or worse. The company’s public controls—AES-256 at rest, TLS 1.2+, secure
              backend access, isolated storage, and authenticated requests—help, but they do not substitute for
              validated operational accuracy in production.


              Privacy and contractual exposure matter as well. Collate’s privacy and terms materials create an
              enterprise-legal frame, while the security page stresses zero-retention treatment with third-party AI
              providers. Those are good signals, but they also underscore that the company is handling sensitive
              regulated content and must maintain customer trust across data handling, access control, and vendor
              management. A future privacy incident, export error, or contract dispute in a major enterprise account
              could have outsized reputational impact relative to current scale.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR032
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
