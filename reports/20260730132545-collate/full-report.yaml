              same enterprise, which is consistent with how documentation pain spreads across the product lifecycle. If
              that expansion pattern is real, Collate’s customer economics could improve materially as the company moves
              from point workflow wins toward embedded operational usage. The product’s broad positioning—from concept
              to market and across quality, clinical, and commercialization paperwork—also creates several plausible
