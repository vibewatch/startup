      - number: '3.4'
        title: Switching costs, moat durability, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Switching costs are meaningful because regulatory tooling becomes part of the product lifecycle record.
              Once submissions, registrations, quality events, or controlled documents sit inside a platform, the buyer
              must think about migration, validation, retraining, and integration to ERP, CTMS, QMS, or gateway
              workflows. This favors incumbents and weakens the odds of clean rip-and-replace sales. It also creates
              room for modular adoption: buyers may layer Collate on top of an incumbent system rather than removing
              that system, especially if procurement, quality, or IT teams treat the system of record as too risky to
              swap.


              Collate’s moat argument therefore cannot rely only on being AI-first. Veeva, IQVIA, MasterControl,
              ArisGlobal, and Rimsys all now market AI or automation in some form, while agency-facing or long-tenured
