      - number: '1.3'
        title: Funding history, investor backing, and traction signals
        blocks:
          - type: paragraph
            body: >
              Collate's funding trajectory is the clearest public proof point. Forbes reported that the company emerged
              from stealth in January 2025 with a $30 million seed led by Redpoint and participation from First Round,
              Conviction Partners, and Y Combinator, at a valuation above $100 million despite having no commercial
              product or customers at the time. Eighteen months later, Forbes, Ventureburn, SaaS News, and other
              follow-on coverage reported a $95 million June 2026 round led by Redpoint that brought total funding to
              $125 million and valued the company at roughly or approaching $1 billion. Redpoint's own portfolio page
              says it first partnered with Collate at the seed stage in 2025, confirming repeat-lead support rather than
              a one-off financing event.

              Traction claims are promising but selective. Forbes says Collate signed its first customer in May 2025 and
              had added roughly 50 more by June 2026 across large pharma, medtech, and public biotech accounts. The
              company also claims 50% to 90% time savings, documents compressed from roughly seven months to a month or
              less, and accuracy often above 90% with mandatory human verification before export. Those are meaningful
              adoption signals, but none of the reviewed public sources disclose revenue, ACV, retention, named
              customers, or audited operating metrics, which limits underwriting confidence.
