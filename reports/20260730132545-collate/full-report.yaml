      - number: '5.3'
        title: Operating model and architecture
        blocks:
          - type: paragraph
            body: >-
              Collate’s public architecture story is sparse but coherent. The security page says documents are encrypted
              at rest with AES-256, all server interactions use TLS 1.2+, document access is restricted to Collate’s
              secure backend, and each customer gets isolated database and file storage. It also says third-party AI
              interactions are ephemeral and governed by zero-retention policies. These disclosures imply a
              server-mediated enterprise architecture in which regulated content is stored and processed inside a
              controlled application boundary rather than passed through public endpoints or unmanaged client-side
              tools. The careers page adds some technology context by stating that the team works with AI/ML, Python,
              Go, TypeScript, and React, which is consistent with a modern cloud application stack.


              The architecture seems designed to balance acceleration with control. Human verification before export,
              authenticated data requests, admin-managed access, and restricted approval actions all suggest a workflow
              in which AI assists but does not autonomously publish regulated content. That makes technical sense for
              this market. FDA eCTD processes and major incumbent platforms alike assume structured review, validated
              workflow, and traceable ownership. The likely operating model is therefore AI-assisted drafting wrapped in
              auditable enterprise controls and customer-specific storage boundaries.
