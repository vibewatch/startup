      - number: '3.3'
        title: Capability breadth, packaging, and trust posture
        blocks:
          - type: paragraph
            body: >-
              Capability comparisons favor incumbents on breadth and governance rather than on simplicity. Veeva, IQVIA,
              OpenText, and ArisGlobal all market integrated lifecycle control, cross-functional workflows, and
              regulatory traceability. OpenText highlights 21 CFR Part 11 support, audit trails, e-signatures,
              integrations, and a repository that spans clinical, regulatory, quality, and manufacturing documents.
              IQVIA markets SmartSolve RIM as AI-enabled, Azure-based, and unified with quality workflows, while also
              offering regulatory intelligence across more than 110 countries. MasterControl positions around
              quality-system control with 1,100-plus customers and explicit human-in-the-loop AI. Generis stresses
              simultaneous editing, workflow automation, configurable content services, and compliance aligned with
              standards including 21 CFR Part 11 and HIPAA.


              Pricing, by contrast, is largely opaque. The reviewed official pages generally push buyers toward demos,
              contact forms, or quote-led enterprise sales rather than transparent seat-based list prices. That opacity
              usually advantages incumbents with bundle leverage and makes it difficult for a new entrant to win purely
              on sticker price. Collate therefore likely needs to sell on workflow compression, implementation speed, or
              better user experience, because the market’s most credible vendors already claim secure cloud delivery,
              compliance controls, and enterprise integration. Publicly, there is no evidence that competitors are
              leaving trust or control unaddressed; the real question is where buyers feel over-served by heavyweight
              systems or underserved by poor authoring UX.
