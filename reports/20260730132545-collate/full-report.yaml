  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >
              The cleanest way to define Collate's market is not “AI for biotech” or even “regtech,” but regulated
              documentation and submission operations for life sciences. FDA and EMA materials show that sponsors must
              organize, validate, and lifecycle-manage large electronic submission packages across NDAs, BLAs, ANDAs,
              INDs, MAAs, and related post-approval activities. Industry sources then map the operating stack around
              those obligations: Regulatory Information Management (RIM), eCTD publishing, controlled document
              repositories, workflow automation, labeling, and cross-functional review tools. OpenText, Veeva, IQVIA,
              EXTEDO, Ennov, Rimsys, and others all position their products around this regulated-document problem,
              confirming that the category is real and already budgeted.

              The market boundary should exclude adjacent but distinct domains. Pure drug-discovery AI, generic LLM
              copilots, broad clinical-trial software, and horizontal content-management tools are only partial
              substitutes unless they solve validation, audit trails, lifecycle control, and regulator-specific
              formatting. The status quo substitute remains a combination of email, shared drives, consultants, CROs,
              and legacy EDMS/RIM systems. That is important for Collate: it is competing both for net-new AI spend and
              for workflow dollars already attached to regulatory operations, quality, and submission publishing.
            claimRefs:
              - CM001
              - CM002
