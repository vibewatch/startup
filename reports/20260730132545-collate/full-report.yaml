  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk framework
        blocks:
          - type: paragraph
            body: >-
              Collate’s risks rank highest where regulated workflow meets probabilistic AI. The company is selling into
              life-sciences documentation, where a hallucinated statement, omitted control, or misrouted approval can
              have consequences well beyond an ordinary software bug. That makes accuracy, human oversight,
              auditability, and deployment discipline core investment variables rather than implementation details. The
              strongest positive is that Collate publicly acknowledges this reality through human verification,
              authentication, isolated customer storage, and permission controls. The risk is that public trust language
              is easier to publish than to operationalize consistently at scale, especially as the customer base
              expands.


              A practical severity ranking therefore puts regulated-AI correctness and compliance first;
              customer-deployment depth and retention second; incumbent-platform and integration dependency third; and
              capital/organizational execution fourth. None of these risks invalidates the company. Together, they
              explain why the opportunity can be attractive while still requiring proof that usage is controlled,
              referenceable, and economically durable.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR031
          - type: table
            tableRef: TR001
            claimRefs:
