chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and current stage
        blocks:
          - type: paragraph
            body: >
              Collate presents itself as an AI platform built specifically for life sciences paperwork rather than a
              generic document assistant. On its homepage and about materials, the company says it helps diagnostic,
              medical-device, and drug-development teams create and streamline documentation from concept through
              commercialization, with explicit emphasis on research, preclinical and clinical workflows, quality
              management, and product launch. The positioning matters because regulated submissions are both large and
              structured: FDA guidance and the eCTD standard require formally organized submissions for NDAs, BLAs,
              ANDAs, INDs, and related amendments, creating a complex, rules-bound environment where automation must
              coexist with auditability and human review.

              Public company materials also show that Collate is still a private, disclosure-light business. The website
              offers marketing, security, privacy, and terms pages, but no revenue, pricing, headcount, or customer-logo
              disclosure. Legal and investor references consistently place the company in San Francisco, and the privacy
              policy names the operating entity as Collate Software, Inc. The net result is a company with clear
              category ambition and concrete product language, but a thin public operating-data footprint typical of an
              aggressively funded Series B startup.
