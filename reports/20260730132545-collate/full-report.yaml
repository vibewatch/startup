      - number: '1.2'
        title: Founders, leadership, and founder-market fit
        blocks:
          - type: paragraph
            body: >
              The founding team is unusually strong for this niche because it combines deep life-sciences workflow
              experience with enterprise software scale. CEO Surbhi Sarna previously founded nVision Medical, built an
              ovarian-cancer detection device company through clinical trials and FDA clearances, and sold the business
              to Boston Scientific for $275 million. She later served as a General Partner at Y Combinator focused on
              healthcare. That background directly explains Collate's thesis: Sarna has said her prior operating
              experience exposed how paperwork slows life-sciences development at nearly every stage. CTO Nate Smith
              brings the complementary software side; multiple sources identify him as Lever's cofounder and former
              CEO/CTO, and official acquisition coverage says Employ bought Lever in 2022.

              Collate's public leadership page adds more technical depth than most early private companies. It lists
              founder and chief architect Jigish Patel, plus senior AI and engineering hires from NVIDIA, Amazon,
              Hippocratic AI, Google, PicnicHealth, ArsenalBio, Square, Facebook, and TikTok. That does not remove
              key-person dependence—Sarna remains the public face, domain expert, and fundraising anchor—but it does
              show the company has staffed beyond a two-founder story and is deliberately building for regulated,
              enterprise-grade deployment.
