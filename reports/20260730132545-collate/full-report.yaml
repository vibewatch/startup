              - CR008
              - CR009
              - CR032
      - number: '7.3'
        title: Operational, product, and reliability risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk centers on whether Collate can turn promising workflow acceleration into a repeatable
              production system. Public evidence supports secure architecture and strong technical talent, but does not
              disclose uptime history, disaster recovery, validated workflow procedures, connector coverage, or
              implementation burden. That makes it difficult to judge whether the platform behaves like a dependable
              enterprise system or a still-maturing high-value application layer. In regulated settings, buyers often
              care about migration plans, audit history, permissions, document lineage, and export fidelity as much as
              about AI output quality.


              There is also classic product risk around scope. If Collate expands too slowly, customers may treat it as
              a narrow drafting tool with limited strategic value. If it expands too quickly, implementation complexity
              and quality risk can rise faster than the team can control. The public product narrative is broad enough
              to create upside, but also broad enough to invite execution slippage if modules, integrations, and support
              motions mature unevenly across customer segments.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR033
          - type: table
            tableRef: TR003
            claimRefs:
