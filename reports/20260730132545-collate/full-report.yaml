        title: Milestones, market context, and early diligence flags
        blocks:
          - type: paragraph
            body: >
              The milestone record is short but coherent. Collate was founded in 2024, emerged from stealth at the
              January 2025 J.P. Morgan Healthcare Conference with a large seed round, landed its first customer in May
              2025, updated core legal and security materials in early 2025 and mid-2026, and announced its $95 million
              Series B on June 3, 2026. Dealroom's June 2026 new-unicorn list includes Collate, which is directionally
              consistent with press reports that the round valued the business near the $1 billion mark. The company has
              therefore moved from concept-stage founder thesis to scaled venture-backed platform narrative in less than
              two years.

              The biggest diligence flags are not existential, but they are material. Collate still does not publish
              customer references, revenue, headcount, pricing, or board composition. Competitor and regulator sources
              show the company is entering a market with established RIM, content-management, and submission incumbents
              that already emphasize compliance controls, audit trails, and explainable workflows. Competitor messaging
              from Rimsys and other regulatory vendors is implicitly skeptical of generic AI overlays, underscoring that
              Collate must prove not just drafting speed but production-grade compliance, validation discipline, and
              change control. In short, public evidence supports momentum, but not yet a fully de-risked operating
              story.
