  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and solution classes
        blocks:
          - type: paragraph
            body: >-
              Collate is not entering a blank category. The market already contains at least four competitor classes:
              broad life-sciences cloud platforms such as Veeva and IQVIA; regulated content-management and
              quality-heavy platforms such as OpenText and MasterControl; lifecycle-oriented RIM suites such as
              ArisGlobal, Ennov, Generis, Freyr, and Rimsys; and lighter workflow or publishing tools such as Kivo.
              Across these categories, the common job is similar: manage regulated content, keep submissions and
              registrations synchronized, and preserve auditability across product changes, health-authority
              interactions, and multi-team review cycles. Collate’s differentiator is its AI-native framing, but nearly
              every serious incumbent now also markets automation, cloud collaboration, or domain-specific AI.


              That means the most useful competitive cut is not vendor count but replacement mode. Some rivals are
              direct head-to-head platforms for regulatory operations, some are incumbent systems of record that Collate
              may need to coexist with, and some are status-quo substitutes that buyers might keep for publishing or
              quality control while testing Collate for drafting and workflow acceleration. In practice, buyers can
              multi-home. A large sponsor could use Veeva or IQVIA for canonical RIM while evaluating Collate as a
              documentation layer, which makes displacement harder but creates a wedge if Collate materially improves
              authoring speed without weakening compliance.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
