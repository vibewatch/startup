      - number: '2.2'
        title: Sizing lenses and the serviceable wedge
        blocks:
          - type: paragraph
            body: >
              Public market sizing is directionally useful but too inconsistent to use as a single-point answer. Grand
              View Research sizes the global regulatory information management system market at about $2.02 billion in
              2023 growing 10.4% CAGR through 2030, while Dimension Market Research puts the market at roughly $3.11
              billion in 2025 growing 10.9% CAGR through 2034. Those differences likely reflect scope choices—pure RIM
              software versus broader regulatory-information workflows—but both point to a category large enough to
              support multiple scaled vendors. Dimension also estimates a 2025 U.S. market of about $943 million and a
              European market of about $467 million, while Grand View says North America held more than 34% of the
              market in 2023 and pharma represented the largest end-use share.

              For Collate, the serviceable opportunity is narrower than the full market-report TAM. The company is
              positioned at the intersection of documentation automation, submission management, and quality or
              lifecycle workflows, which means the reachable wedge likely starts inside enterprise accounts already
              spending on regulatory software. The most realistic near-term SAM is therefore the subset of large pharma,
              medtech, and biotech organizations that are upgrading from manual or legacy systems and are willing to add
              AI-assisted authoring under controlled review conditions.
