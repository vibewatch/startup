        title: Revenue model and pricing signals
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to an enterprise SaaS model, but not to disclosed price points. In Forbes' January
              2025 seed profile, Redpoint’s Satish Dharmaraj described the category as low velocity and high contract
              value, suggesting large-account sales rather than self-serve monetization. Collate’s product and customer
              language also fit that pattern: the company is selling into pharmaceutical, device, and biotech
              organizations with complex documentation burdens and regulated workflows, not into individual researchers.
              The official site emphasizes workflow transformation, security, and enterprise controls, while the contact
              and privacy-request surfaces route buyers into direct engagement rather than published pricing tiers.


              That said, the revenue stack is still inferential. No reviewed source discloses subscription structure,
              services revenue mix, usage-based charges, implementation fees, or renewal mechanics. Even the strongest
              traction sources stop at customer count and productivity claims. The practical conclusion is that Collate
              likely earns recurring subscription revenue with some implementation and support component, but investors
              cannot yet underwrite revenue quality or pricing power from public evidence alone. That uncertainty
              matters because early enterprise AI companies can mask weak core monetization behind large logos, pilots,
              or professional-services intensity.
