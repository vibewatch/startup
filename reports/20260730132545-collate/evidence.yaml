evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-and-arr
    missingEvidence: Revenue, ARR, gross margin, and contract-value disclosures or audited investor materials.
    whyItMatters: >-
      Without commercial metrics, the financing and customer-count narrative cannot be translated into capital
      efficiency or repeatability.
    diligencePath: Request board materials or investor updates showing ARR, net retention, expansion, and implementation backlog.
    relatedQuestionRefs:
      - QO017
  - type: private-evidence-only
    severity: material
    topic: headcount-and-capacity
    missingEvidence: A supportable headcount figure by function and geography.
    whyItMatters: Delivery capacity, burn expectations, and post-Series-B hiring needs are hard to assess without staffing data.
    diligencePath: Request HRIS export or leadership-prepared org snapshot with engineering, implementation, sales, and G&A split.
    relatedQuestionRefs:
      - QO018
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Board roster, committee structure, and any investor-control rights.
    whyItMatters: Governance determines how much strategic and financing control founders retain after rapid financing.
    diligencePath: Request the current board deck, cap table, and financing documents including board observer rights.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: customer-proof
    missingEvidence: Named customer references, deployment scope, and renewal or ROI data.
    whyItMatters: >-
      Public customer counts are directionally positive but do not prove production criticality, depth of usage, or
      stickiness.
    diligencePath: >-
      Seek three customer reference calls spanning pharma, biotech, and medtech plus anonymized cohort retention
      metrics.
    relatedQuestionRefs:
      - QO016
      - QO024
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: bottom-up-sam
    missingEvidence: >-
      A bottom-up buyer universe for pharma, biotech, medtech, and diagnostics accounts segmented by submission volume
      and readiness.
    whyItMatters: Without an account-level view, TAM remains too broad to translate into realistic pipeline and share expectations.
    diligencePath: >-
      Build a prospect universe from sponsor lists, recent filers, and target-account submissions volume, then size by
      workflow and ACV.
    relatedQuestionRefs:
      - QM022
      - QM025
  - type: missing-source
    severity: material
    topic: segment-adoption-by-company-size
    missingEvidence: >-
      Public adoption-rate data comparing large pharma, commercial biotech, and device companies for AI-assisted
      regulatory tooling.
    whyItMatters: Segment uptake likely varies materially, which affects Collate's practical SAM and sales-cycle assumptions.
    diligencePath: Request internal pipeline segmentation or survey data from vendors, consultants, or channel partners.
    relatedQuestionRefs:
      - QM023
  - type: conflicting-data
    severity: minor
    topic: market-size-scope
    missingEvidence: Publisher scope definitions explaining why current RIM market estimates differ by more than $1 billion.
    whyItMatters: Scope drift can make market-share and valuation math appear stronger or weaker than reality.
    diligencePath: Compare methodology notes across market reports and restate TAM by scope bucket.
    relatedQuestionRefs:
      - QM022
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Public price points, module pricing, and implementation-fee disclosures for major competitors.
    whyItMatters: >-
      Without transparent pricing, it is hard to know whether Collate wins because it is cheaper, faster to deploy, or
      simply easier to use.
    diligencePath: Collect procurement quotes or customer interviews across Veeva, IQVIA, OpenText, and specialist vendors.
    relatedQuestionRefs:
      - QP014
      - QP025
  - type: private-evidence-only
    severity: material
    topic: replacement-dynamics
    missingEvidence: Live account-level evidence showing whether Collate displaces systems of record or attaches alongside them.
    whyItMatters: Coexistence versus replacement materially changes ACV, sales cycle, expansion potential, and moat durability.
    diligencePath: Request customer deployment diagrams and at least three migration or coexistence case studies.
    relatedQuestionRefs:
      - QP018
      - QP024
  - type: missing-source
    severity: minor
    topic: competitive-pricing-bands
    missingEvidence: Benchmark pricing bands for focused specialists such as Rimsys, Ennov, Generis, Freyr, and Kivo.
    whyItMatters: Specialist pricing can shape how much room a new entrant has to monetize a documentation-only wedge.
    diligencePath: Request price sheets or analyst notes covering module and user-based packaging across specialist competitors.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: material
    topic: arr-and-margin
    missingEvidence: ARR, gross margin, services mix, and customer concentration by cohort.
    whyItMatters: >-
      Without those metrics, investors cannot test whether customer growth is translating into durable, high-quality
      software revenue.
    diligencePath: Request monthly recurring revenue, churn, expansion, and gross-margin bridge by quarter.
  - type: private-evidence-only
    severity: material
    topic: burn-and-runway
    missingEvidence: Current burn, cash balance, hiring plan, and runway assumptions post-Series B.
    whyItMatters: Capital adequacy depends on spending discipline, not just headline capital raised.
    diligencePath: Request board materials or finance operating plan showing burn, cash, and hiring by function.
  - type: missing-source
    severity: material
    topic: team-and-founding-signals
    missingEvidence: A reconciled company-provided headcount and founding-date statement.
    whyItMatters: >-
      Third-party previews currently conflict with stronger press reporting, limiting confidence in public team-size
      proxies.
    diligencePath: Request management-confirmed headcount, geography, and founding timeline.
  - type: private-evidence-only
    severity: material
    topic: integration-depth
    missingEvidence: Named integrations, connector inventory, validated export workflow, and migration tooling details.
    whyItMatters: >-
      Enterprise adoption in regulated systems depends on moving from draft assistance to dependable workflow
      interoperability.
    diligencePath: Request architecture diagrams, integration map, validation SOPs, and production deployment references.
  - type: private-evidence-only
    severity: material
    topic: reliability-metrics
    missingEvidence: Uptime history, disaster-recovery posture, support SLAs, and quality metrics for production deployments.
    whyItMatters: Regulated workflow software is judged on operational reliability as much as on AI capability.
