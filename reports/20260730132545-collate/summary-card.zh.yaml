  topRisks:
    - 接近独角兽的估值更多压在战略潜力上，而不是公开披露的收入、留存或利润率证明。
    - 具名客户引用、部署深度和续约指标大多仍未公开，限制了对持久性的信心。
    - Veeva、IQVIA、OpenText、MasterControl 和 Generis 等既有厂商已占住相邻工作流，并且越来越多推出 AI 化替代方案。
    - 在受监管客户环境中，一次重大的隐私、准确性或权限失败都会造成不成比例的伤害。
  unresolvedGaps:
