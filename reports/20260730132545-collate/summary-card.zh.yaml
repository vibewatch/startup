  topStrengths:
    - 生命科学监管文件工作流体量大、痛点重，自动化价值清楚，AI 采用时点也给了强顺风。
    - 创始团队同时具备创始人市场匹配、企业软件经验，以及早期公司少见的深厚 AI / 基础设施人才。
