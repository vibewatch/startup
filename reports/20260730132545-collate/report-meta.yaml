companyProfile:
  summary: |
    Collate is a San Francisco–based private startup founded in 2024 by Surbhi Sarna and Nate
    Smith to automate the paperwork and workflow burden that life sciences companies face across
    research, clinical development, quality, regulatory submission, and commercialization. The
    company positions its software as an AI platform for every step of the product lifecycle and
    publicly emphasizes secure, human-verified, enterprise-grade handling of regulated content.
    Public reporting suggests unusually rapid early customer adoption among large pharmaceutical,
    medical-device, and public biotech organizations, while the June 2026 financing marked a
    major validation event by bringing total funding to about $125M and valuation near $1B.
  foundedDate: "2024-01-01"
  founders:
    - name: Surbhi Sarna
      role: CEO and Co-founder
      background: "Former founder of nVision Medical and former Y Combinator healthcare partner."
      claimRefs: [CO016, CO017]
    - name: Nate Smith
      role: CTO and Co-founder
      background: "Lever cofounder and former CEO/CTO with enterprise software scaling experience."
      claimRefs: [CO018, CO019]
  foundingLocation: "San Francisco, California"
  headquarters: "San Francisco, California"
  productSummary: |
    Collate sells an AI-assisted workflow platform for life sciences documentation. Public sources
    describe software for creating and streamlining regulatory, clinical, quality, and related
    paperwork from concept to market, with security controls such as encryption, isolated customer
    storage, authentication, and human verification before export.
  customerFocus: |
    Large pharmaceutical companies, major medical-device manufacturers, and publicly traded biotech
    firms that need to accelerate controlled documentation, submission preparation, and related
    regulatory operations.
  businessModel: |
    Enterprise SaaS sold through a high-touch, contact-led motion, with likely recurring platform
    subscriptions and some implementation or support burden; precise pricing, services mix, and
    renewal mechanics are not publicly disclosed.
  stage: Series B
  fundingStatus: "$125M total funding reported; $95M June 2026 Series B led by Redpoint; valuation near $1B."
  disclosureProfile: private-undisclosed
  claimRefs: [CO013, CO016, CO017, CO018, CO022]

