  topStrengths:
    - "Large, painful regulatory-document workflow in life sciences with clear automation value and strong timing tailwinds from AI adoption."
    - "Founding team combines founder-market fit, enterprise software experience, and unusually deep AI/infrastructure talent for an early-stage company."
    - "Independent coverage supports rapid early customer uptake across pharma, medtech, and biotech, which is strong validation for a regulated workflow product."
    - "Public trust posture is stronger than many AI startups disclose, including encryption, isolated customer storage, authentication, and human-review controls."
  topRisks:
    - "Near-unicorn valuation rests on strategic promise more than publicly disclosed revenue, retention, or margin proof."
    - "Named customer references, deployment depth, and renewal metrics remain largely private, limiting confidence in durability."
    - "Incumbents such as Veeva, IQVIA, OpenText, MasterControl, and Generis already own adjacent workflows and increasingly market AI-enabled alternatives."
    - "A material privacy, accuracy, or permissioning failure in a regulated customer environment would be disproportionately damaging."
  unresolvedGaps:
    - "Current ARR or revenue run rate and the 2026 revenue growth curve are not publicly disclosed."
    - "Customer concentration, ACV distribution, and renewal behavior remain private."
    - "Implementation burden, services mix, and gross-margin profile are not publicly auditable."
    - "Detailed round terms, preference stack, and effective economic entry price for the 2026 financing are not public."

