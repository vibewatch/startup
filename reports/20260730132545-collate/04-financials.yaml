- id: traction-gaps-and-capital-adequacy
  title: Public traction gaps and capital adequacy
  body: 'The capital side is more visible than the operating side. The company raised a $30 million seed in January 2025 and then a $95 million 2026 round that brought total funding to $125 million, with the new capital earmarked to scale operations against surging demand. That level of capitalization gives Collate room to hire, expand infrastructure, and absorb enterprise implementation friction. It also reduces near-term financing pressure relative to a seed-funded startup attempting the same market. However, capital adequacy cannot be reduced to cash raised. There is no public burn figure, no headcount disclosure from the company, and no statement of runway.


    One third-party database preview adds texture but not certainty: Dealroom publicly shows one-country team presence, twenty-nine employees, and a profile that still lists founding as 2025, conflicting with the 2024 founding used in press coverage and earlier chapters. That conflict is a useful warning. Public databases can provide directional signals on team shape and investor count, but they are not a substitute for management reporting. The prudent financial read is therefore that Collate is well funded for its stage, yet still dependent on private evidence to assess burn discipline, hiring pace, and the timing of the next round trigger.'
