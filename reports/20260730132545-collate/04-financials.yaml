- id: gtm-motion-and-efficiency-proxies
  title: GTM motion and sales-efficiency proxies
  body: 'The available GTM proxies are directionally positive. Forbes reported that Collate had no commercial product or customers at the January 2025 launch, signed its first customer in May 2025, and by June 2026 had added roughly 50 more customers across large pharma, medtech, and public biotech. If those reports are accurate, Collate moved from zero to a meaningful enterprise account base in roughly thirteen months—fast for a regulated, multi-stakeholder sale. The same source also frames the opportunity as one where a vendor can land with one project and then expand from department to department, implying an embedded land-and-expand logic rather than a one-off software sale.


    But public GTM efficiency is still impossible to quantify cleanly. There is no disclosed CAC, sales-cycle length, payback period, win rate, NRR, or implementation backlog. The contrast with public incumbents is stark: Veeva, IQVIA, and OpenText publish enough operating detail to show scale, bookings, and cash flow, while Collate publishes only marketing and fundraising signals. That does not make the business weak; it means the current evidence supports a momentum narrative, not a fully diligenced efficiency narrative.'
