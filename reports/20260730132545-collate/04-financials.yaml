  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: arr-and-margin
    missingEvidence: ARR, gross margin, services mix, and customer concentration by cohort.
    whyItMatters: Without those metrics, investors cannot test whether customer growth is translating into durable, high-quality software revenue.
    diligencePath: Request monthly recurring revenue, churn, expansion, and gross-margin bridge by quarter.
  - type: private-evidence-only
    severity: material
    topic: burn-and-runway
    missingEvidence: Current burn, cash balance, hiring plan, and runway assumptions post-Series B.
    whyItMatters: Capital adequacy depends on spending discipline, not just headline capital raised.
    diligencePath: Request board materials or finance operating plan showing burn, cash, and hiring by function.
  - type: missing-source
    severity: material
    topic: team-and-founding-signals
    missingEvidence: A reconciled company-provided headcount and founding-date statement.
    whyItMatters: Third-party previews currently conflict with stronger press reporting, limiting confidence in public team-size proxies.
    diligencePath: Request management-confirmed headcount, geography, and founding timeline.
