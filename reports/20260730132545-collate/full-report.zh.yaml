  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险框架
        blocks:
          - type: paragraph
            body: >-
              Collate 的风险在受监管流程与概率式 AI
              交汇处最高。公司卖进生命科学文档流程；幻觉语句、遗漏控制项或审批路由错误，造成的后果可能远超普通软件缺陷。因此，准确性、人工监督、可审计性和部署纪律不是实施细节，而是核心投资变量。最强的正面信号是，Collate
              公开承认这一现实，强调人工核验、认证、客户隔离存储和权限控制。风险在于，公开发布信任话术比在规模化中持续落地容易得多，尤其客户基础还在扩大。


              因此，务实的严重程度排序应把受监管 AI
              的正确性和合规放在第一；客户部署深度与留存第二；既有平台和集成依赖第三；资本与组织执行第四。这些风险没有单独推翻公司。合在一起，它们解释了为什么机会有吸引力，同时仍需要证明使用可控、客户可引用，且经济性经得起时间检验。
            claimRefs:
              - CR001
