      - number: '2.3'
        title: 买方、用户与付费方分层
        blocks:
          - type: paragraph
            body: >
              买方很少只有一个画像。监管事务和监管运营负责人通常拥有问题，因为他们要对申报就绪、往来函件和生命周期跟踪负责；但用户群横跨医学写作者、临床团队、质量专家、CMC 撰写人员、标签人员和外部伙伴。IT
              与安全职能会很早介入，因为系统必须满足访问控制、可审计性和集成要求；当合同围绕上市时间、人员杠杆或全球申报吞吐量来包装时，财务或运营负责人实际上成为付费方。这种多利益相关方采购动作，也解释了为什么厂商同时强调协作功能和合规控制。

              采用通常从文书负担最重的地方开始：支持 IND 的材料包、重大全球申报序列、获批后变更控制，以及受监管器械或制药环境中的质量文档。较小的生物科技公司可能从 eCTD 发布或轻量 RIM
              层等点工具起步，大型企业则偏好集成平台和分阶段上线。Collate 围绕大型药企、MedTech 和上市生物科技的公开牵引叙事，说明它瞄准的不是最小 SMB
              细分，而是那些文档负担已经痛到足以为专门平台付费的账户。
