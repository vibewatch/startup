      - number: '5.2'
        title: 模块图谱与用户任务
        blocks:
          - type: paragraph
            body: >-
              Collate
              没有发布传统模块目录，但公开信息足以拼出一张实用任务图。平台似乎至少支持四项核心任务：文档创建、审阅加速、质量与变更协同，以及商业化或获批后文档。官网描述从概念到上市的支持；安全材料显示审批、发布和培训控制，暗示产品是一个按角色感知的运营环境，而不是单一起草界面。公司背景材料也强调，产品源自创始人对生命科学公司旅程各阶段文书工作的挫败感。


              这种宽度具备战略意义。如果产品只会起草文字，存量厂商可以复制这个功能。如果它能管理文字周边的受监管工作流——谁能访问、审阅、批准、导出并留存——平台就有更持久的存在权。公开证据仍未说明其中多少今天已经生产就绪、多少仍在路线图上。但营销语言和信任语言合在一起，说明
              Collate 想拥有的是文档工作闭环，而不是其中某个单次撰写时刻。
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE032
