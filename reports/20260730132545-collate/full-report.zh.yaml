      - number: '4.2'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              可用的 GTM 代理指标方向上偏正面。Forbes 报道称，Collate 在 2025 年 1 月发布时没有商业产品或客户，2025 年 5 月签下首个客户，到 2026 年 6 月已在大型药企、MedTech
              和上市生物科技中又新增约 50 家客户。如果报道准确，Collate 约 13
              个月就从零走到有意义的企业账户基础——对一个受监管、多利益相关方销售来说很快。同一来源还把机会描述为厂商能先用一个项目落地，再从部门到部门扩张，暗示内嵌的“先落地、再扩张”逻辑，而不是一次性软件销售。


              但公开 GTM 效率仍无法干净量化。没有披露 CAC、销售周期长度、回本期、赢单率、NRR 或实施积压。与公开存量厂商的对比很鲜明：Veeva、IQVIA 和 OpenText
              公布的运营细节足以显示规模、订单和现金流，而 Collate 只公布营销与融资信号。这并不说明业务弱；它说明当前证据支持的是动能叙事，而不是经过充分尽调的效率叙事。
