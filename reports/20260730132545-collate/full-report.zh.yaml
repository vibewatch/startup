      - number: '6.3'
        title: 具名客户证明与参考质量
        blocks:
          - type: paragraph
            body: >-
              具名客户证明，是 Collate 公开客户证据里最大的短板。已审阅的官方页面只笼统写到服务全球企业、提升团队生产力，却没有列出客户标识、发布案例研究，也没有点名已部署账户。Forbes 和 Ventureburn
              从独立角度支撑了客户数量和细分覆盖，但这些报道同样没有说出它们所描述的大客户是谁。外部投资人因此缺少通常可以引用级验证的几件事：客户是否已经投产、哪些流程在跑、多少业务单元在用，以及是否有任何客户能说明实施复杂度或审计就绪表现。


              和既有厂商相比，差距很明显。Veeva 有专门的客户故事页面；OpenText 则在生命科学产品页直接营销客户故事、培训成果和文档处理基准。这并不推翻 Collate
              的牵引力。客户敏感时，私营创业公司常常不披露名称。但这也意味着，当前证据更能支撑“客户存在”和“细分匹配”，对企业级可引用客户质量的支撑弱得多。投资人应把缺少具名证明视为尽调缺口，而不是反证；同时也要承认，公开论据的可信度因此被削弱。
