      - number: '7.5'
        title: 财务 / 模型风险、缓释因素与论点失效条件
        blocks:
          - type: paragraph
            body: >-
              Collate 的财务风险主要来自未知项，而不是看得见的困境。2026 年融资后，公司资金充足；但公开证据仍没有披露烧钱速度、资金续航、毛利率、集中度或续约质量。这很重要，因为企业 AI
              公司在设计伙伴热情高涨时，早期看起来可能很高效，之后才发现实施成本重、续约变慢或收入集中。模型风险因此在于：客户兴奋度跑在了耐久经济性前面。


              可见的缓释因素是合理的。团队有很强的领域和基础设施背景，产品问题真实，客户兴趣看起来真切，公开信任姿态也比许多创业公司更强。主要监测指标应包括具名生产引用、上线账户内扩张、人工审核和权限流程稳定性、生产环境低幻觉
              / 低错误率证据，以及最终的留存和毛利率数据。如果 Collate 仍无法被客户引用，客户只把它限制在试点使用，或既有厂商在 Collate 证明嵌入价值前就把同一流程吸收到更大套件里，投资论点就会失效。
