      - number: '1.4'
        title: 里程碑、市场背景与早期尽调警讯
        blocks:
          - type: paragraph
            body: >
              里程碑记录很短，但脉络连贯。Collate 于 2024 年创立，在 2025 年 1 月 J.P. Morgan Healthcare Conference 上随大额种子轮走出隐身模式，2025 年 5
              月拿下首个客户，2025 年初和 2026 年中更新核心法律与安全材料，并于 2026 年 6 月 3 日宣布 $95 million B 轮。Dealroom 的 2026 年 6 月新独角兽名单包括
              Collate，与媒体报道称该轮融资把公司估值推近 $1 billion 的说法方向一致。因此，公司不到两年就从概念阶段的创始人命题，走到规模化风投支持平台的叙事。

              最大的尽调警讯不是生死问题，但很实质。Collate 仍不公开客户引用、收入、员工数、定价或董事会构成。竞争对手和监管来源显示，公司进入的是一个已有
              RIM、内容管理和申报存量厂商的市场，这些厂商已经强调合规控制、审计追踪和可解释工作流。Rimsys 等监管供应商的竞品表述也隐含着对通用 AI 叠加层的怀疑，凸显 Collate
              必须证明的不只是起草速度，还包括生产级合规、验证纪律和变更控制。简言之，公开证据支持动能，但还不足以证明运营风险已充分释放。
