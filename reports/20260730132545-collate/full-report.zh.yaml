      - number: '8.5'
        title: 建议、退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              站在公开证据角度，正确姿态是有选择地谨慎。Collate 比许多 AI
              工作流创业公司更有意思，因为痛点真实、客户细分有吸引力，创始人也有不寻常的可信度。但公开证据对市场兴奋度的支撑仍强于对价格纪律的支撑。因此，估值立场应被视为偏高，而不是明显非理性。按当前估值附近买入的投资人，本质上是在预付未来工作流主导权，而不是买入可见基本面。


              提升信念的路径很清楚。管理层需要提供收入轨迹、ACV
              分布、续约行为、头部客户集中度、实施负担，以及上线部署正在跨部门扩展的证据。退出准备度也应谨慎框定。公司位于有价值的工作流缝隙，战略相关性已经说得通；但真正的退出准备度需要可引用规模、耐久经济性，以及产品从“被欣赏”走向“被嵌入”的证据。在这些数据出现前，正确建议是
              research-more，并设定有纪律的入场要求，而不是无保留兴奋。
