chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与当前阶段
        blocks:
          - type: paragraph
            body: >
              Collate 把自己定位为专为生命科学文书打造的 AI
              平台，而不是通用文档助手。公司在官网和介绍材料中称，它帮助诊断、医疗器械和药物开发团队从概念到商业化创建并简化文档，并明确强调研究、临床前和临床工作流、质量管理以及产品上市。这个定位很关键：受监管申报既庞大又结构化。FDA
              指南和 eCTD 标准要求 NDA、BLA、ANDA、IND 及相关修订都按正式结构组织提交，因此自动化必须和可审计性、人工审阅并存，才能进入这个规则密集的环境。

              公司公开材料也显示，Collate 仍是一家未上市、披露很轻的企业。网站提供营销、安全、隐私和条款页面，但不披露收入、定价、员工数或客户标识。法律与投资人引用都把公司地点指向 San
              Francisco，隐私政策将运营实体列为 Collate Software, Inc.。结果是：公司有清晰的品类野心和具体产品语言，但公开运营数据很薄，符合一家激进融资的 B 轮初创公司的典型状态。
