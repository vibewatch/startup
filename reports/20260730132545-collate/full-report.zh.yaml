      - number: '6.4'
        title: 留存、耐久性与扩张
        blocks:
          - type: paragraph
            body: >-
              公开证据里，最能支撑耐久性的仍是叙事，而不是指标。创始人和投资人的表述显示，产品可能从一个项目或一个团队扩展到同一企业的其他部门；这也符合文档痛点在产品生命周期各环节扩散的方式。如果这种扩张模式真实存在，Collate
              从单点流程胜利走向嵌入式运营使用后，客户经济性可能明显改善。产品定位也足够宽——从概念到上市，并横跨质量、临床和商业化文书——一旦打入初始切口，就有多条合理路径做跨职能扩张。


              但硬留存指标没有一个公开。净收入留存、毛留存、客户流失、续约率、合同期限、满意度分数、队列视图都未披露。缺少这些数据，就无法清楚判断客户基础到底是粘性强，还是只是 AI
              采用周期早期的热情高。采购风险也被遮住了：如果部分客户只是广泛试验 AI，Collate 之后可能遇到短试点周期、预算复审摩擦，或供应商整合压力。扩张故事说得通；留存故事仍是开放尽调项。
            claimRefs:
              - CU016
              - CU017
              - CU018
              - CU019
              - CU020
