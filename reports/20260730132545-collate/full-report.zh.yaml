      - number: '4.4'
        title: 公开牵引缺口与资本充足度
        blocks:
          - type: paragraph
            body: >-
              资本侧比运营侧更可见。公司在 2025 年 1 月完成 $30 million 种子轮，又在 2026 年完成 $95 million 融资，使总融资达到 $125
              million；新资金被用于在需求激增下扩张运营。这样的资本化水平给 Collate
              留出招聘、扩基础设施、吸收企业实施摩擦的空间。相较于试图进入同一市场的种子轮初创公司，它也降低了近期融资压力。不过，资本充足度不能简化为已募现金。公开资料没有烧钱数字，公司也没有披露资金可支撑时间。


              一个第三方数据库预览增加了背景，但不能给出确定性：Dealroom 公开显示团队只在一个国家存在、员工 29 人，并且资料仍将创立时间列为 2025 年，与媒体报道和前文采用的 2024
              年创立相冲突。这种冲突本身就是有用警示。公开数据库可以提供团队形态和投资人数量的方向性信号，但不能替代管理层报告。审慎的财务解读因此是：Collate
              在当前阶段资金充足，但评估烧钱纪律、招聘节奏和下一轮触发时点，仍依赖私有证据。
