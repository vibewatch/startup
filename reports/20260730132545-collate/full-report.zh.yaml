      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              已审阅来源中反复出现五个市场驱动。第一，监管机构正从宽松 AI 试验转向可审计 AI 治理，这更利好专用厂商，而非通用工具。第二，eCTD v4.0
              采用和以数据为中心的申报模型，会提高结构化平台的价值。第三，申报工作跨全球团队和合作伙伴网络展开，云协作正成为标准。第四，FDA、EMA、PMDA
              及相关主管机构之间的协调努力，让集中式生命周期管理更有价值。第五，生物制剂、器械和上市后义务越来越复杂，推高文档量和错误成本。

              约束同样真实。高实施成本、验证开销、工作流再培训、网络安全审查，以及与现有 RIM、EDMS、QMS 和标签系统集成，都会拖慢采用。竞争对手来源还警示，监管运营中的 AI
              必须可信、可解释、可控。也就是说，市场在增长，但并非没有摩擦：像 Collate 这样的厂商可能因为买方需要更快撰写和审阅而赢，也可能因为被视为一个新奇但缺少合规证明、客户引用或流程验证的叠加层而输。
