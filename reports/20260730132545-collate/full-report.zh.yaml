      - number: '3.4'
        title: 切换成本、护城河耐久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              切换成本很实质，因为监管工具会成为产品生命周期记录的一部分。一旦提交、注册、质量事件或受控文档进入某个平台，买方就必须考虑迁移、验证、再培训，以及与 ERP、CTMS、QMS
              或网关工作流的集成。这利好存量厂商，也降低了干净整套替换销售的概率。同时，它也为模块化采用创造空间：买方可能把 Collate 叠在存量系统之上，而不是移除该系统，尤其当采购、质量或 IT
              团队认为记录系统替换风险太高时。


              Collate 的护城河论点因此不能只靠 AI 优先。Veeva、IQVIA、MasterControl、ArisGlobal 和 Rimsys 如今都在某种形式上营销 AI 或自动化，而 EXTEDO
              这类面向机构或长期深耕的厂商，也能可信地诉诸合规熟悉度。最强反命题是商品化：如果文档起草、摘要和一致性检查成为存量套件里的标准附加功能，Collate 的差异化就会被压缩到 UI
              和速度。最强正命题是，存量厂商仍然碎片化、实施重，或为了控制优化而牺牲可用性，从而给更快、更容易采用的层留下切入口。买方很可能会按 Collate 能否证明更安全的加速，而不是新奇感来选择。
