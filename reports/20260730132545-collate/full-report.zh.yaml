      - number: '6.2'
        title: 采用轨迹与部署深度
        blocks:
          - type: paragraph
            body: >-
              最重要的采用信号是速度。Collate 据称在 2025 年 5 月签下首个商业客户，到 2026 年 6 月又新增约 50
              家。在实施、信任和采购通常很慢的市场里，这是有意义的动能。公开报道还称，公司在发布同年就开始与部分最大型生命科学公司合作，说明客户兴趣没有停留在新兴生物科技公司。如果准确，大企业客户标识与快速新增账户的组合，就是支持产品命题的最强证据之一。


              缺失的一块是部署深度。已审阅公开来源没有披露这些账户中有多少是试点、有多少是规模化生产上线，使用是否只在单一部门还是跨多个职能，每个账户有多少活跃用户，或者客户多频繁从草稿加速走向更广的工作流采用。这个缺口很重要，因为早期企业
              AI 公司积累客户标识的速度可能快于形成持久工作流嵌入。公开采用证据因此真实但不完整：市场拉力看起来强，生产渗透程度仍属私有。
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU032
