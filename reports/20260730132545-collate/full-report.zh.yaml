      - number: '7.4'
        title: 依赖、平台与竞争风险
        blocks:
          - type: paragraph
            body: >-
              依赖风险有两种。第一，Collate 依赖企业愿意把 AI
              嵌入受监管文档流程。即使这种意愿快速增强，预算负责人仍可能偏好已经掌握记录系统，或能打包验证、迁移和生命周期控制的厂商。第二，公司似乎在零留存政策下依赖第三方 AI
              供应商；这很合理，但仍意味着它依赖外部模型基础设施，并要持续治理供应商。


              竞争会放大这两类风险。Veeva、IQVIA、OpenText、MasterControl 和 Generis 已经在营销合规流程、企业控制，以及越来越多 AI
              增强功能。它们还有更大的装机基础、更丰富的公开客户证明，在若干案例中还拥有深得多的实施生态。如果既有厂商能让受监管撰写更快，又不要求客户更换供应商，Collate
              的切口会收窄。公司的最佳防线在于，买家可能仍想要比既有厂商更好用、更专门的流程层。风险在于，Collate 还没达到足够深度和可引用性，这个窗口就先关闭。
            claimRefs:
              - CR016
              - CR017
