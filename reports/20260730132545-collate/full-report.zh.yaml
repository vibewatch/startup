      - number: '4.5'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              总体看，Collate 更像是可融资，而不是财务已被证明。公司有可信的赞助方支持、快速早期客户获取，以及看似兼容高 ACV
              经常性软件的商业模式。这些都是有价值的要素。但所有严肃的收入质量承销问题仍然开放：收入集中度、续约行为、服务强度、毛利率、实施工作量、销售管线转化和现金消耗。投资人可以合理相信模型能跑通，却无法只靠公开披露验证这一判断。


              解读当前状态的最佳方式，是承诺与证明之间的不对称。市场显然愿意为这个故事买单，客户问题也真实存在。风险在于，验证负担、客户特定配置和采购拖慢充分显现前，监管 AI
              的经济性可能看起来很好。下一层尽调应聚焦客户分组质量和单位经济，而不是表层客户数。如果管理层能证明用量扩张、服务拖累有限，并且在新资本基础上烧钱克制，财务案例会显著增强。否则，近独角兽估值就会跑在证据前面。
