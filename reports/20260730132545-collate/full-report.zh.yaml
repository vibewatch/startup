companyProfile:
  summary: >
    Collate 是一家位于 San Francisco 的未上市初创公司，Surbhi Sarna 和 Nate Smith 于 2024
    年创办，目标是自动化生命科学公司在研究、临床开发、质量、监管申报和商业化中背负的文书与工作流负担。公司把软件定位为覆盖产品生命周期每一步的 AI
    平台，并公开强调其能以安全、人工核验、企业级方式处理受监管内容。公开报道显示，大型药企、医疗器械公司和上市生物科技机构在早期采用速度异常快；2026 年 6 月的融资把总融资推至约 $125M、估值推近 $1B，也成为一次重要背书。
