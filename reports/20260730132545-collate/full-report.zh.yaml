  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价信号
        blocks:
          - type: paragraph
            body: >-
              公开证据指向企业 SaaS 模式，但没有披露价格点。Forbes 2025 年 1 月种子轮报道中，Redpoint 的 Satish Dharmaraj
              将该品类描述为销售推进慢、合同价值高，暗示大账户销售，而非自助式变现。Collate
              的产品和客户语言也符合这一模式：公司卖给的是背负复杂文档和受监管工作流的制药、器械和生物科技组织，而不是个体研究人员。官网强调工作流转型、安全和企业控制；联系与隐私请求入口也把买方导向直接接触，而不是公开价格层级。


              也就是说，收入栈仍然只能推断。已审阅来源没有披露订阅结构、服务收入组合、按用量收费、实施费或续约机制。即便牵引最强的来源，也停留在客户数量和生产力主张。实际结论是：Collate
              很可能赚取经常性订阅收入，并带有一定实施和支持成分；但投资人还无法仅凭公开证据承销收入质量或定价权。这种不确定性很重要，因为早期企业 AI 公司可能用大客户标识、试点或专业服务强度掩盖核心变现薄弱。
