          - type: callout
            title: 收入质量仍是黑箱
            body: 客户数量和融资动能无法揭示 ARR、毛利率、集中度或续约行为，而这些才是企业软件承销的决定性变量。
            calloutType: risk
            claimRefs:
              - CI005
              - CI012
              - CI023
              - CI025
          - type: callout
            title: 模型可能混合软件经济性与受监管服务拖累
            body: 人工核验、集成和合规控制很可能提升信任，但会推迟早年纯软件利润率兑现。
            calloutType: insight
            claimRefs:
              - CI013
              - CI014
              - CI016
              - CI017
          - type: callout
            title: 尽调应从表层牵引转向客户分组和烧钱
            body: 接下来真正影响决策的问题，是账户扩张、实施工作量、CAC 回本、烧钱率和资金可支撑时间，而不是品类是否有趣。
            calloutType: recommendation
            claimRefs:
              - CI026
