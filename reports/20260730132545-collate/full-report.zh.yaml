  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与解决方案类别
        blocks:
          - type: paragraph
            body: >-
              Collate 进入的不是空白品类。市场中至少已有四类竞争者：Veeva 和 IQVIA 等宽生命科学云平台；OpenText 和 MasterControl
              等受监管内容管理与质量属性很重的平台；ArisGlobal、Ennov、Generis、Freyr 和 Rimsys 等面向生命周期的 RIM 套件；以及 Kivo
              等更轻的工作流或发布工具。跨这些类别，核心任务相似：管理受监管内容，让提交和注册保持同步，并在产品变更、卫生主管机构互动和多团队审阅周期中保住可审计性。Collate 的差异化在于 AI
              原生框架，但几乎每个严肃存量厂商如今也在营销自动化、云协作或领域专用 AI。


              因此，最有用的竞争切法不是数厂商，而是看替代模式。有些对手是监管运营的直接正面平台，有些是 Collate 可能必须共存的存量记录系统，还有一些是买方在测试 Collate
              的起草和工作流加速能力时，可能继续保留用于发布或质量控制的现状替代方案。现实中，买方可以多栖。大型申办方可能用 Veeva 或 IQVIA 管规范 RIM，同时评估 Collate
              作为文档层；这会让替换更难，但如果 Collate 能在不削弱合规的前提下显著提高撰写速度，也会创造切入口。
