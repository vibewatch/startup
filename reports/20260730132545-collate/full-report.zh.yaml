      - number: '5.3'
        title: 运营模式与架构
        blocks:
          - type: paragraph
            body: >-
              Collate 的公开架构叙事很少，但内在一致。安全页面称，文档静态加密采用 AES-256，所有服务器交互使用 TLS 1.2+，文档访问限制在 Collate
              的安全后端，每个客户都有隔离的数据库和文件存储。页面还称，第三方 AI
              交互是临时的，并受零留存政策约束。这些披露指向一种经服务器中介的企业架构：受监管内容在受控应用边界内存储和处理，而不是流经公共端点或非托管客户端工具。招聘页面补充了一些技术背景，称团队使用
              AI/ML、Python、Go、TypeScript 和 React，符合现代云应用栈。


              架构看起来是为平衡加速与控制而设计的。导出前人工核验、经过身份验证的数据请求、管理员管理访问权限，以及受限审批动作，都指向一个 AI 辅助但不会自主发布受监管内容的工作流。这对该市场有技术合理性。FDA eCTD
              流程和主要存量平台同样假设结构化审阅、验证过的工作流和可追溯权属。因此，可能的运营模式是：AI 辅助起草，外层包裹可审计企业控制和客户特定存储边界。
            claimRefs:
              - CE011
