  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层
        blocks:
          - type: paragraph
            body: >-
              Collate 的公开客户分层比具名参考名单清晰。Forbes 和 Ventureburn
              均报道，公司已经签下大型制药公司、主要医疗器械制造商和上市生物科技公司客户。这是有用的分层信号，因为它横跨三个不同但相邻的买方类型，共同背负监管文档负担。在这些组织内部，经济买方很可能是监管运营、质量、临床运营或相邻文档密集团队中的高管或职能负责人；日常用户则更可能是处理受控内容的撰写者、审阅者、提交者或批准者。付费方几乎肯定是企业预算所有者，而不是部门里的个人。


              这很重要，因为该品类不是靠自下而上的病毒式传播取胜，而是靠在高度受监管、跨职能工作流中证明时间节省和控制能力取胜。Collate
              的公开定位和销售界面符合自上而下的企业销售动作，也与报道中的大型客户存在感匹配。但公开来源仍未披露这约 50 个账户如何分布在制药、MedTech 和生物科技之间，也没有说明平台是否集中在某个子行业或用例。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU031
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
