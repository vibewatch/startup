      - number: '7.3'
        title: 运营、产品与可靠性风险
        blocks:
          - type: paragraph
            body: >-
              运营风险集中在一个问题：Collate
              能否把有前景的流程提速，变成可复制的生产系统。公开证据支持其安全架构和强技术人才，但没有披露正常运行时间历史、灾备、验证过的流程程序、连接器覆盖或实施负担。因此很难判断，这个平台更像可靠的企业系统，还是仍在成熟中的高价值应用层。在受监管场景里，买家往往同样看重迁移计划、审计历史、权限、文档血缘和导出保真度，而不只是
              AI 输出质量。


              这里还存在经典的产品范围风险。如果 Collate
              扩张太慢，客户可能只把它当成战略价值有限的窄口径起草工具。如果扩张太快，实施复杂度和质量风险可能比团队控制能力上升得更快。公开产品叙事足够宽，能打开上行空间；但也足够宽，如果模块、集成和支持动作在不同客户细分里成熟不均，就会诱发执行滑坡。
            claimRefs:
