      - number: '7.2'
        title: 监管、法律与隐私风险
        blocks:
          - type: paragraph
            body: >-
              核心监管风险不是 Collate 自己需要 FDA 批准，而是它的软件运行在受 FDA、EMA 和 ICH
              申报预期约束的文档流程里。在这些流程中，流程完整性、可追溯性和变更控制很关键，因为申报包可能庞大、高度结构化，并直接影响面向患者的项目。任何 AI
              生成错误只要穿过审核，就可能造成返工、延误，甚至更糟。公司公开的控制项——静态 AES-256、TLS 1.2+、安全后端访问、隔离存储、认证请求——都有帮助，但不能替代生产环境里经过验证的运营准确性。


              隐私和合同暴露同样重要。Collate 的隐私与条款材料搭出了企业法律框架；安全页面则强调第三方 AI
              供应商的零留存处理。这些是好信号，但也反过来说明，公司在处理敏感受监管内容，必须在数据处理、访问控制和供应商管理上持续守住客户信任。未来如果某个大型企业账户发生隐私事件、导出错误或合同纠纷，以当前规模看，声誉冲击可能被放大。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR032
