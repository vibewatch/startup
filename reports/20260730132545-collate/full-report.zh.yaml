      - number: '1.2'
        title: 创始人、领导层与创始人-市场匹配
        blocks:
          - type: paragraph
            body: >
              在这个细分市场里，创始团队异常强：既有深度生命科学工作流经验，也有企业软件规模化能力。CEO Surbhi Sarna 此前创办 nVision Medical，带领这家卵巢癌检测设备公司走过临床试验和 FDA
              批准，并以 $275 million 出售给 Boston Scientific。之后，她在 Y Combinator 担任聚焦医疗健康的普通合伙人。这段履历直接解释了 Collate 的命题：Sarna
              曾说，过去的运营经历让她看到文书工作几乎在生命科学开发的每个阶段拖慢进度。CTO Nate Smith 补上软件一侧；多方来源将他列为 Lever 联合创始人和前 CEO/CTO，官方收购报道也称 Employ
              于 2022 年收购 Lever。

              Collate 的公开领导层页面比多数早期未上市公司更有技术厚度。页面列出创始人兼首席架构师 Jigish Patel，以及来自 NVIDIA、Amazon、Hippocratic
              AI、Google、PicnicHealth、ArsenalBio、Square、Facebook 和 TikTok 的资深 AI 与工程人才。这不能消除关键人物依赖——Sarna
              仍是公开门面、领域专家和融资锚点——但说明公司已经超出“两位创始人”的故事，正有意为受监管、企业级部署组建团队。
