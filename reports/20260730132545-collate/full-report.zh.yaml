      - number: '6.5'
        title: 集中度、采购与 GTM 含义
        blocks:
          - type: paragraph
            body: >-
              客户集中度很可能是核心商业风险。一家据称约有 50
              家企业客户的公司，收入、引用客户、产品反馈或未来扩张，仍可能高度依赖少数超大账户。公开来源没有披露早期牵引是否偏向少数大型药企项目、流程相近的医疗科技买家，或尤其像设计伙伴的关系。渠道依赖同样不透明：没有证据显示存在分销渠道或服务驱动分发，也没有详细说明客户采用有多少是自包含完成，多少需要重实施支持。


              实际含义是，Collate
              的客户故事在漏斗顶部很亮眼，在漏斗下部只得到部分验证。市场需求看起来真实，尤其考虑到账户获取速度和已报道细分的质量。但生命科学买家行动可能很慢，要求深度验证，并会围绕已拥有相邻受监管系统的平台做整合。下一步尽调因此不是证明
              Collate 有客户，而是弄清这些客户究竟有多集中、部署多深、能否引用，以及扩张潜力多大。
