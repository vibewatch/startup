        - 需求真实，但部署逐步拓宽，服务负担仍有分量
        - 当前估值只有在耐心持有且执行强劲时才站得住
        - 留存和 ACV 数据转为中度正面
      - - 空头
        - 产品仍只是既有厂商旁边的窄型加速器
