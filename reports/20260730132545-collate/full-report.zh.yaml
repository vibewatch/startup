              - CI028
              - CI029
              - CI035
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              Collate
              的产品最好理解为受监管工作流平台，而不是生命科学通用聊天机器人。官网称，软件为产品生命周期每一步打造，专门面向诊断、医疗器械和药物开发公司的文书创建与审阅。这个表述很重要，因为它把产品放在科学工作和监管输出之间的运营路径上：R&D、临床前、临床、质量和商业化都会产生文档，这些文档必须在内部接受审阅、完成格式化、被跟踪，并最终为合规目的提交或留存。公开报道也强化了这一定位：产品自动化的是生命科学文书周边的起草和编辑负担，而不是直接替代科学判断或监管责任。


              工作流重点与市场结构一致。FDA 和 EMA 的电子申报制度要求严格的文档打包、可追溯性和传输；IQVIA、OpenText、Generis 和 Veeva
              等存量平台也围绕受控内容和生命周期编排定位。Collate 的切入口因此不只是语言生成，而是承诺 AI 能在受监管工作流中加速文档，同时仍符合检查就绪、受控审阅和卫生主管机构提交格式的预期。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE031
