      - number: '2.2'
        title: 规模测算视角与可服务切入口
        blocks:
          - type: paragraph
            body: >
              公开市场规模测算有方向价值，但口径差异太大，不能拿来当单点答案。Grand View Research 估算，全球监管信息管理系统市场 2023 年约 $2.02 billion，到 2030 年 CAGR 为
              10.4%；Dimension Market Research 则估算该市场 2025 年约 $3.11 billion，到 2034 年 CAGR 为 10.9%。差异可能来自范围选择——纯 RIM
              软件，或更宽的监管信息工作流——但两者都指向一个足以支撑多家规模化厂商的品类。Dimension 还估算 2025 年美国市场约 $943 million、欧洲市场约 $467 million；Grand
              View 则称 2023 年北美占市场超过 34%，制药是最大终端使用份额。

              Collate 可服务机会比市场报告里的完整 TAM 更窄。公司站在文档自动化、申报管理、质量或生命周期工作流的交叉点，这意味着可触达切入口很可能从已经购买监管软件的企业账户内部开始。近期最现实的 SAM
              因此是大型药企、MedTech 和生物科技组织中的一个子集：它们正从手工或旧系统升级，并愿意在受控审阅条件下加入 AI 辅助撰写。
