      - number: '4.3'
        title: 成本结构、服务负担与利润率路径
        blocks:
          - type: paragraph
            body: >-
              Collate 的毛利率路径很可能好于服务很重的监管咨询，但初期大概率不如纯横向 SaaS 应用。产品用 AI
              压缩文档工作，长期应能降低每份交付物的边际人工。同时，公司自身强调人工核验、安全后端访问、客户隔离存储、身份验证控制，以及第三方 AI
              提供商的零留存政策。这些功能在受监管生命科学里有商业必要性，但相比通用聊天机器人产品，也意味着更多工程、合规、客户成功，甚至基础设施成本。


              因此，经济性可比组不应只看 AI 软件，还应看受监管系统厂商和质量管理平台。IQVIA、OpenText 和 MasterControl
              都把合规与生命周期支持描述为核心价值驱动，而非免费功能。如果撰写自动化能在大账户中规模化，Collate
              最终可能获得有吸引力的软件利润率；但在当前阶段，业务很可能背负实质性的实施、验证、集成和审阅成本。缺少云支出、服务组合或支持负担披露，利润率路径仍是命题，而不是已验证指标。
