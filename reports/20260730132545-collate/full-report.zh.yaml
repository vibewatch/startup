  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、邻近领域与现状替代方案
        blocks:
          - type: paragraph
            body: >
              定义 Collate 市场最干净的方式，不是“面向生物科技的 AI”，甚至也不是“regtech”，而是生命科学里的受监管文档与申报运营。FDA 和 EMA 材料显示，申办方必须围绕
              NDA、BLA、ANDA、IND、MAA 及相关获批后活动，组织、验证并全生命周期管理大型电子提交包。行业来源随后把运营栈映射到这些义务周边：监管信息管理（RIM）、eCTD
              发布、受控文档库、工作流自动化、标签以及跨职能审阅工具。OpenText、Veeva、IQVIA、EXTEDO、Ennov、Rimsys 等厂商都围绕这一受监管文档问题定位产品，说明品类真实存在，且已有预算。

              市场边界应排除相邻但不同的领域。纯药物发现 AI、通用 LLM
              copilot、宽泛临床试验软件和横向内容管理工具，只有在解决验证、审计追踪、生命周期控制和监管机构特定格式时，才算部分替代品。现状替代方案仍是电子邮件、共享硬盘、顾问、CRO，以及旧式 EDMS/RIM
              系统的组合。Collate 要吃的因此有两块：一块是新增 AI 支出，另一块是已经绑定在监管运营、质量和申报发布上的工作流预算。
