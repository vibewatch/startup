      - number: '8.3'
        title: 可比公司背景与公开市场倍数
        blocks:
          - type: paragraph
            body: >-
              公开可比公司提供护栏，而不是直接答案。Veeva、IQVIA 和 OpenText 是差异很大的企业，但能框定市场如何给生命科学和信息管理里的规模化、可信流程厂商定价。CompaniesMarketCap
              显示，截至 2026 年 7 月，Veeva 市值约 $32.17B，过去 12 个月收入约 $3.31B；IQVIA 市值约 $38.84B，过去 12 个月收入 $16.63B；OpenText 市值约
              $6.04B，过去 12 个月收入 $5.20B。粗略按市值 / 收入计算，对应 OpenText 约 1.2x、IQVIA 约 2.3x、Veeva 约 9.7x。Veeva
              因品类领导、软件占比和生命科学专业化拿到溢价；OpenText 和 IQVIA 因业务组合、规模轮廓和市场预期，交易倍数更低。


              这些并不是 Collate 的严格可比对象；Collate 是私营公司，收入极小，生命周期也早得多。但它们厘清了估值负担。如果 Collate 值约
              $1B，投资人承销的是极高未来收入、极高战略价值，或两者兼有。没有 2026 年公开收入披露，当前价格无法严密三角定位。只有相信 Collate
              最终可能更像一家高溢价的生命科学工作流平台，而不是一个细分功能层，这个价格才算说得通。
