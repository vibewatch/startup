      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景假设 Collate
              已报道的客户动能转化为深账户扩张、强续约表现，并在受监管职能中持续扩大流程足迹。在那个世界里，当前估值会显得有先见之明，因为公司将走在成为生命科学原生平台的路上，具备高溢价软件经济性，也拥有可信退出集合，包括战略买家或公开市场就绪。基准情景更混合：客户需求真实，但部署深度需要更久，服务负担仍然显著，增长质量也难以判断。在这种情景下，当前价格最终仍可能跑通，但容错率更薄，也需要耐心。


              悲观情景是，Collate 被证明有价值，但比估值所暗示的范围窄。如果客户把它当作起草或审核加速器，放在既有系统旁边，而不是替代或掌握工作流，每客户收入和留存耐久性可能令人失望。在那个世界里，$1B
              价格相对于公开证明和未来可能稀释都开始显得吃紧。正确结论不是估值不可能，而是这个估值是一场执行下注：上行不对称，但公开证据垫子有限。
