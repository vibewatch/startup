      - number: '3.3'
        title: 能力宽度、打包方式与信任姿态
        blocks:
          - type: paragraph
            body: >-
              能力对比更偏向存量厂商的宽度和治理，而不是简单性。Veeva、IQVIA、OpenText 和 ArisGlobal 都营销集成生命周期控制、跨职能工作流和监管可追溯性。OpenText 强调 21 CFR
              Part 11 支持、审计追踪、电子签名、集成，以及覆盖临床、监管、质量和制造文档的资料库。IQVIA 把 SmartSolve RIM 定位为 AI 加持、基于 Azure，并与质量工作流统一，同时提供覆盖
              110 多个国家的监管情报。MasterControl 围绕质量体系控制定位，拥有 1,100 多家客户，并明确采用人在回路 AI。Generis 强调同步编辑、工作流自动化、可配置内容服务，以及符合 21
              CFR Part 11 和 HIPAA 等标准的合规。


              相比之下，定价基本不透明。已审阅的官方页面通常把买方推向演示、联系表单或报价驱动的企业销售，而不是透明的按席位标价。这种不透明通常有利于拥有打包杠杆的存量厂商，也让新进入者很难只靠标价取胜。因此，Collate
              很可能需要卖工作流压缩、实施速度或更好的用户体验，因为市场中最可信的厂商已经声称能提供安全云交付、合规控制和企业集成。公开层面没有证据显示竞争对手没有处理信任或控制；真正的问题是，买方在哪里觉得重型系统供给过度，或被糟糕的撰写
              UX 服务不足。
