      - number: '8.2'
        title: 融资背景与当前价格支撑
        blocks:
          - type: paragraph
            body: >-
              公开融资背景有支撑，但不完整。Forbes、Ventureburn、SaaS News 和其他报道称，Collate 在 2026 年 6 月完成 $95M 融资，总融资达到 $125M，估值在或接近
              $1B。Dealroom 也单独把 Collate 列入 2026 年 6 月新晋独角兽队列。这些都是有意义的外部标记：强风险资本背书、充足资本，以及市场愿意把公司视为医疗健康和生命科学里突破型 AI
              应用之一。2025 年 Forbes Next Billion-Dollar Startups 专访又给了一个有用锚点，说明投资人多早就愿意出高价：报道写到 $30M 种子资本，并称 2025 年收入预计仅约
              $1M。


              最后这一点说明，估值支撑仍是有条件的。如果 2026
              年客户增长正快速转化为扩张收入，并带来陡峭的前瞻收入爬坡，近独角兽价格可能合理。但这些都没有公开披露。没有收入或留存指标时，当前价格更应被理解为对未来市场领导地位的索取权，而不是一个今天就能由公开财务产出扎实支撑的估值。
