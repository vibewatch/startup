      - number: '1.3'
        title: 融资历程、投资人背书与牵引信号
        blocks:
          - type: paragraph
            body: >
              Collate 的融资轨迹是最清晰的公开证明点。Forbes 报道称，公司在 2025 年 1 月走出隐身模式，完成由 Redpoint 领投、First Round、Conviction Partners 和
              Y Combinator 参投的 $30 million 种子轮；彼时公司还没有商业产品或客户，估值已超过 $100 million。18 个月后，Forbes、Ventureburn、SaaS News
              等后续报道又称，Redpoint 领投 2026 年 6 月 $95 million 融资，使总融资达到 $125 million，公司估值大约或接近 $1 billion。Redpoint
              自己的投资组合页面称其在 2025 年种子阶段首次与 Collate 合作，证明这是重复领投支持，而不是一次性融资事件。

              牵引主张有吸引力，但披露有选择性。Forbes 称 Collate 在 2025 年 5 月签下首个客户，到 2026 年 6 月又在大型药企、MedTech 和上市生物科技账户中新增约 50
              家客户。公司还声称节省 50% 到 90% 时间，把文档周期从约七个月压到一个月或更短，准确率常高于
              90%，且导出前必须人工核验。这些都是有意义的采用信号，但已审阅的公开来源都没有披露收入、ACV、留存、具名客户或经审计运营指标，因此承销信心受限。
