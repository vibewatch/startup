      - number: '3.2'
        title: 存量厂商画像、规模与战略方向
        blocks:
          - type: paragraph
            body: >-
              最大的竞争风险来自已经掌握相邻工作流的厂商。Veeva 是最清晰的基准，因为它既有规模化生命科学云足迹，也有集成监管模块和明确 AI 野心。其 2026 财年业绩显示收入超过 $3.19
              billion、总客户超过 1,500 家；公司还称，其记录系统和数据集让它能交付行业专用 AI。IQVIA 的威胁画像不同：它把 RIM
              软件与咨询服务、监管情报、验证和生产力工具配在一起，对偏好合规与服务打包伙伴的买方很有吸引力。OpenText 和 MasterControl
              不那么纯粹聚焦监管，但两者都有强文档控制和质量叙事，能打动已经优先考虑审计追踪、培训和闭环变更控制的受监管买方。


              在头部梯队之下，聚焦型专家会缩小差距。Rimsys 强调产品注册、提交、UDI 和监管影响评估，尤其聚焦 MedTech。EXTEDO 强调长期经验和监管机构使用，强化其在 eCTD
              重度场景中的信任。Ennov、Generis 和 Freyr 向看重配置和全球流程控制的买方销售结构化 RIM、内容和合规支持。这些厂商未必拥有 Veeva 的规模，但会约束 Collate
              的定价权，因为它们能用更成熟的引用满足许多相同采购清单。
