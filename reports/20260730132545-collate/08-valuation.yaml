  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-and-retention-support
    missingEvidence: Current ARR, growth rate, renewal quality, and revenue concentration.
    whyItMatters: These metrics determine whether a ~$1B valuation is merely exciting or actually disciplined.
    diligencePath: Request current ARR bridge, top-customer concentration, cohort retention, and ACV distribution.
  - type: private-evidence-only
    severity: material
    topic: margin-and-services-burden
    missingEvidence: Gross margin, services intensity, and implementation burden by customer cohort.
    whyItMatters: Premium workflow-software outcomes require scalable economics rather than labor-heavy deployments.
    diligencePath: Request gross-margin bridge, services mix, and implementation effort by account type.
  - type: missing-source
    severity: minor
    topic: private-round-terms
    missingEvidence: Detailed preference stack, dilution terms, and any secondary or structured terms in the 2026 financing.
    whyItMatters: Headline valuation alone can obscure investor protections and true economic entry price.
    diligencePath: Request term sheet summary or cap-table memo covering preferences, dilution, and liquidation structure.
