  - TV003
  figureRefs:
  - FV003
- id: bull-base-bear-scenarios
  title: Bull, base, and bear scenarios
  body: 'The bull case assumes that Collate’s reported customer momentum translates into deep account expansion, strong renewal behavior, and a widening workflow footprint across regulated functions. In that world, the current valuation could look prescient because the company would be on a path toward becoming a life-sciences-native platform with premium software economics and a credible exit set that includes strategic buyers or public-market readiness. The base case is more mixed: customer demand is real, but deployment depth takes longer, services burden remains material, and growth quality stays hard to read. Under that scenario, the current price may still work eventually, but it offers thinner margin for error and requires patience.


    The bear case is that Collate proves valuable but narrower than the valuation implies. If customers treat it as a drafting or review accelerator that sits beside incumbent systems rather than displacing or owning the workflow, revenue per customer and retention durability could disappoint. In that world, a $1 billion price begins to look stretched relative to both public proof and likely future dilution. The right conclusion is not that the valuation is impossible. It is that the valuation is an execution bet with asymmetric upside but limited public evidence cushion.'
  claimRefs:
  - CV016
  - CV017
  - CV018
  - CV019
  - CV020
  - CV039
