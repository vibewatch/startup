callouts:
  - calloutType: insight
    title: This is a budgeted market, not a greenfield category
    body: "The presence of established RIM, eCTD, and life-sciences content vendors means buyers already fund this problem, which lowers education cost but raises the standard for differentiation."
    claimRefs: [CM001, CM020, CM022, CM025]
  - calloutType: assumption
    title: Collate's practical SAM is narrower than headline RIM TAM
    body: "The near-term opportunity is the subset of enterprise accounts upgrading from manual or legacy workflows and willing to add AI-assisted authoring under controlled review."
    claimRefs: [CM007, CM008, CM028, CM031, CM033]
  - calloutType: risk
    title: Adoption depends on trust more than novelty
    body: "Multiple sources say AI in regulatory operations must be traceable, explainable, and secure, so speed alone will not win enterprise procurement."
    claimRefs: [CM018, CM019, CM023, CM024, CM030]
