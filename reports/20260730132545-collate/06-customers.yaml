- id: named-proof-and-reference-quality
  title: Named customer proof and reference quality
  body: 'Named customer proof is Collate’s biggest public customer weakness. The reviewed official pages speak in broad terms about powering global enterprises and transforming team productivity, but they do not list customer logos, publish case studies, or name deployed accounts. Forbes and Ventureburn provide independent support for customer count and segment breadth, but even those stories stop short of naming the major customers they describe. That leaves outsiders without the usual reference-quality checks: whether customers are in production, which workflows are live, how many business units use the product, and whether any reference can speak to implementation complexity or audit-readiness performance.


    The contrast with incumbents is sharp. Veeva operates a dedicated customer-stories surface, and OpenText markets customer stories, training outcomes, and document-processing benchmarks directly on its life-sciences product page. This does not invalidate Collate’s traction. Private startups often withhold names when customers are sensitive. But it does mean the current evidence supports customer existence and segment fit more strongly than it supports enterprise-reference quality. Investors should treat the lack of named proof as a diligence gap, not as a disproof, while still recognizing that it weakens confidence in the public case.'
  claimRefs:
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU033
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: retention-durability-and-expansion
  title: Retention, durability, and expansion
  body: 'The best public evidence for durability is narrative rather than metric-based. Founder and investor commentary suggest the product can expand from one project or team to additional departments inside the same enterprise, which is consistent with how documentation pain spreads across the product lifecycle. If that expansion pattern is real, Collate’s customer economics could improve materially as the company moves from point workflow wins toward embedded operational usage. The product’s broad positioning—from concept to market and across quality, clinical, and commercialization paperwork—also creates several plausible avenues for cross-functional expansion once an initial wedge is established.


    But none of the hard durability metrics are public. There is no disclosed net revenue retention, gross retention, logo churn, renewal rate, contract length, satisfaction score, or cohort view. That absence prevents a clean read on whether the customer base is sticky or simply enthusiastic early in the AI adoption cycle. It also obscures procurement risk: if some customers are experimenting with AI broadly, Collate may face short pilot cycles, budget review friction, or vendor-consolidation pressure later. The expansion story is plausible; the retention story is still an open diligence item.'
  claimRefs:
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU034
