  - TU004
  figureRefs:
  - FU004
- id: concentration-and-go-to-market-implications
  title: Concentration, procurement, and GTM implications
  body: 'Customer concentration is likely the central commercial risk. A company with around 50 reported enterprise customers can still be highly dependent on a small number of very large accounts for revenue, references, product feedback, or future expansion. Public sources do not disclose whether early traction is skewed toward a handful of large pharma programs, medtech buyers with similar workflows, or especially design-partner-style relationships. The same opacity applies to channel dependence: there is no evidence of reseller channels or services-led distribution, but no detailed explanation of how much customer adoption is self-contained versus supported by hands-on implementation.


    The practical implication is that Collate’s customer story is impressive at the top of the funnel and only partially validated lower in the funnel. Market demand appears real, especially given the speed of account acquisition and the caliber of reported segments. Yet buyers in life sciences can move slowly, demand deep validation, and consolidate around platforms that already own adjacent regulated systems. The next diligence step is therefore not to prove that Collate has customers; it is to determine how concentrated, deployed, referenceable, and expandable those customers really are.'
