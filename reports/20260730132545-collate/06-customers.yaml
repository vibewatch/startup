  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: named-references
    missingEvidence: Named customer references, deployed use cases, and production-versus-pilot status by account.
    whyItMatters: Without referenceable deployments, public customer traction is difficult to audit despite encouraging logo-quality claims.
    diligencePath: Request customer reference calls, case studies, and deployment stage by top accounts.
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: NRR, GRR, churn, contract length, ACV distribution, and top-customer revenue share.
    whyItMatters: These metrics determine whether the customer base compounds or merely looks impressive on a logo-count basis.
    diligencePath: Request cohort dashboard, renewal schedule, and revenue concentration by customer and segment.
  - type: missing-source
    severity: minor
    topic: geographic-mix
    missingEvidence: Public detail on customer geography and country mix.
    whyItMatters: Cross-border regulatory operations can change implementation requirements and support burden materially.
    diligencePath: Request customer map by region and regulatory jurisdiction.
