company:
  name: "PointClickCare"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >
    PointClickCare is a cloud-native SaaS EHR platform built on Microsoft Azure with a
    microservices architecture and 400+ marketplace integrations. The 2026 product strategy
    centers on AI-powered workflow automation (Advisor Suite: Referral, Chart, Billing Advisors)
    and a next-generation Practitioner EHR. The platform is ONC-certified, HITRUST-certified,
    and SOC 2 Type II audited. The technology differentiation is the combination of mission-critical
    EHR embedded deeply in clinical workflows with a growing AI layer and the industry's largest
    LTPAC data network for training and inference.

sections:
  - id: S-E-01
    title: "Product Architecture and Module Overview"
    body: >
      PointClickCare's platform is organized into five product pillars: (1) Clinical Management
      (EHR core: MDS assessments, care plans, eMAR, progress notes, vital tracking, medication
      management); (2) Financial & Revenue Cycle Management (billing, claims, eligibility
      verification, RCM automation); (3) Care Coordination & Interoperability (Collective Medical
      ADT feeds, Audacious Inquiry HIE connections, FHIR/HL7 APIs, 400+ marketplace partners);
      (4) Analytics & Insights (operational dashboards, clinical quality metrics, PDPM and
      value-based care analytics, regulatory reporting); and (5) AI & Automation (Advisor Suite:
      Referral Advisor, Chart Advisor, Billing Advisor; Ambient Scribe; AI-generated clinical summaries).

      The platform also includes workforce management modules (staff scheduling, Apploi-powered
      recruiting/onboarding), telehealth integration, infection prevention, wound care, and
      family engagement/communication modules. The modular architecture allows operators to
      adopt only the modules needed while maintaining a unified patient record across all
      deployed modules. The 400+ marketplace partner integrations span pharmacy, lab, RPM,
      telehealth, staffing, analytics, and payment vendors, making PointClickCare's ecosystem
      the broadest in the LTPAC market.

      In 2026, PointClickCare launched its Advisor Suite — a native AI product layer embedding
      AI-powered automation directly into high-friction clinical and financial workflows including
      admissions (Referral Advisor), clinical documentation (Chart Advisor), and revenue cycle
      management (Billing Advisor). This launch represents a significant maturation of the AI
      product strategy beyond pilot features to a generally available AI product line.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006]
    tableRefs: [TE001, TE002]
    figureRefs: [FE001]

  - id: S-E-02
    title: "Platform Architecture and Technology Stack"
    body: >
      PointClickCare's technical architecture is cloud-native and multi-tenant, deployed on
      Microsoft Azure with Kubernetes-based container orchestration and Docker microservices.
      The backend uses a multi-language microservices approach: primarily .NET/C# and Java for
      core EHR services, Node.js for API gateway and event-driven services, and Python for AI/ML
      model serving. The frontend is built with TypeScript, React, and Angular, delivering
      responsive web and native iOS/Android mobile applications.

      Data persistence uses a hybrid approach: Azure SQL for transactional EHR data, Azure
      Cosmos DB (NoSQL) for event logging, audit trails, and data lake storage. The interoperability
      layer implements HL7 v2, FHIR R4, and SMART on FHIR standards for data exchange with
      hospital EMRs, payers, laboratories, pharmacies, and HIEs. The integration broker supports
      direct ADT (admit/discharge/transfer) feeds, lab and imaging orders, and bi-directional
      medication data exchange.

      The AI/ML layer utilizes Azure Cognitive Services for NLP processing (Ambient Scribe),
      with custom-trained models for patient risk scoring, referral complexity assessment, and
      billing anomaly detection. The platform processes data from 150M+ patient encounters,
      giving PointClickCare one of the largest LTPAC-specific training datasets in the industry.
      This proprietary data advantage accelerates AI model accuracy compared to competitors
      training on general healthcare data or smaller LTPAC datasets.
    claimRefs: [CE007, CE008, CE009, CE010, CE011, CE012]
    tableRefs: [TE003]
    figureRefs: [FE002, FE003]

  - id: S-E-03
    title: "AI Differentiation and the Advisor Suite"
    body: >
      PointClickCare launched the Advisor Suite in June 2026, an AI-native workflow automation
      product line embedded directly in the EHR. The three initial products are: (1) Referral
      Advisor — AI-powered intake automation that extracts clinical, financial, and regulatory
      data from referral documents (often 70+ pages per patient), prioritizes referral queues,
      and surfaces capacity-aware bed management; (2) Chart Advisor — AI documentation assistance
      that reduces clinician manual note entry and generates MDS-compliant clinical summaries;
      and (3) Billing Advisor — AI-powered revenue cycle automation that flags billing anomalies,
      optimizes claims, and surfaces underbilling alerts.

      The strategic importance of the Advisor Suite is twofold: (1) it differentiates
      PointClickCare from competitors who lack comparable LTPAC-trained AI products at GA stage;
      and (2) it creates a high-value upsell path from core EHR customers to AI modules,
      potentially increasing ARPU by $50–$150/month per facility. The Advisor Suite was also
      recognized as the Best EHR Solution at the 2026 MedTech Breakthrough Awards, validating
      the AI product strategy.

      PointClickCare also launched a Next-Generation EHR for Practice Groups in 2026, targeting
      the practitioner workflow (physicians, PAs, NPs visiting SNFs) with bi-directional data
      exchange, AI-driven clinical certainty tools, and a mobile-first interface. This addresses
      a historically underserved user segment (SNF-visiting practitioners) and expands the
      addressable user base within existing customer facilities.
    claimRefs: [CE013, CE014, CE015, CE016, CE017, CE018]

  - id: S-E-04
    title: "Deployment, Integration, and Roadmap"
    body: >
      PointClickCare is deployed as a pure-cloud SaaS with no on-premises option. Implementation
      timelines range from 60–90 days for single-facility deployments to 6–18 months for large
      multi-site chains, driven by data migration, staff training, and regulatory reporting
      integration requirements. The company provides dedicated implementation services and
      customer success managers for accounts above 10 facilities.

      Integration reliability is supported by a 99.9%+ SLA (industry standard for enterprise
      healthcare SaaS) backed by Azure's multi-region redundancy. The platform supports role-based
      access control, multi-factor authentication, and full audit logging for all EHR access
      and changes. A Trust Center (trust.pointclickcare.com) provides customers with
      real-time security and compliance documentation for vendor onboarding requirements.

      The product roadmap for 2026–2027 is focused on: (1) expanding the Advisor Suite to
      additional workflow modules; (2) deepening the Next-Gen Practitioner EHR with more AI
      capabilities; (3) expanding into home health and home care workflows (historically a
      weaker product area vs. MatrixCare); and (4) further developing the value-based care and
      payer analytics modules. A key technical challenge is the integration of Collective Medical
      and Audacious Inquiry onto a single unified data platform while maintaining operational
      stability for 30,000+ active customer facilities.
    claimRefs: [CE019, CE020, CE021, CE022, CE023]
    tableRefs: [TE005]

  - id: S-E-05
    title: "Trust, Security, Compliance, and Quality"
    body: >
      PointClickCare maintains a comprehensive compliance and trust posture required for
      healthcare SaaS: (1) ONC Health IT Certification — required for Medicare/Medicaid
      reimbursement; ensures compliance with 21st Century Cures Act interoperability requirements
      including FHIR R4; (2) HITRUST CSF Certification — industry gold standard for healthcare
      security, validating controls across HIPAA, NIST, and ISO frameworks; (3) SOC 2 Type II
      Audit — annual independent verification of security, availability, and confidentiality
      controls; (4) HIPAA compliance — full Privacy, Security, and Breach Notification Rule
      compliance for all PHI handling; and (5) CMS Quality Reporting integration — MDS (Minimum
      Data Set) submission, PDPM calculations, and state regulatory reporting.

      The security architecture uses layered controls: Azure infrastructure security, application-
      layer WAF and API security, identity and access management (IAM/SSO), mobile device
      management, and role-based access down to individual chart entries. The company's Trust
      Center provides customers with compliance documentation, security questionnaire responses,
      and audit reports on-demand for vendor onboarding.

      A residual compliance risk is the Real Time Medical Systems court ruling in 2025, which
      found PointClickCare's data-access restrictions likely violated the 21st Century Cures Act
      information-blocking provisions. This ruling requires PointClickCare to revise certain
      API access policies, with potential implications for the open availability of its data
      network to third-party analytics vendors. The company is managing compliance with the
      ruling while maintaining platform security.
    claimRefs: [CE024, CE025, CE026, CE027, CE028, CE029, CE030]
    tableRefs: [TE004]
    figureRefs: [FE004]

