callouts:
  - calloutType: strength
    title: "AI Advisor Suite Creates First-Mover Advantage in LTPAC AI Workflows"
    body: >
      PointClickCare's June 2026 GA launch of the Advisor Suite (Referral, Chart, Billing Advisors)
      embedded natively in the EHR gives it a first-mover advantage in LTPAC AI automation.
      With 150M+ patient records, the proprietary training data moat makes it difficult for
      competitors to match model accuracy. The Advisor Suite is an ARPU-expanding product layer
      that increases the value of the core EHR subscription.
    claimRefs: [CE013, CE014, CE015, CE016]

  - calloutType: risk
    title: "Information-Blocking Ruling Requires API Policy Changes"
    body: >
      The 2025 Real Time Medical Systems court ruling requires PointClickCare to revise its
      API access policies, reducing its ability to restrict third-party analytics vendors from
      accessing its data network. This erodes one dimension of the product moat — the data
      exclusivity advantage — and requires compliance investments in API infrastructure.
    claimRefs: [CE028, CE029, CE030]

  - calloutType: insight
    title: "Home Health Gap is the Key Product Roadmap Risk"
    body: >
      PointClickCare's historically SNF-centric product set creates a gap in home health and
      hospice workflows where MatrixCare leads. As care delivery shifts increasingly toward
      home-based settings, closing this gap is a strategic imperative. The 2026–2027 home
      health module expansion will be a key indicator of execution capability.
    claimRefs: [CE017, CE018, CE022, CE023]

