callouts:
  - calloutType: recommendation
    title: "Research-More: Compelling Business, Unresolved Financial Metrics"
    body: >
      PointClickCare has the structural attributes of a buy-grade business: dominant market
      position, regulatory moat, data network, improving AI product portfolio, and IPO readiness.
      The research-more call reflects not business weakness but evidence gaps — unconfirmed revenue
      baseline, undisclosed NRR/churn, pending information-blocking litigation, and cybersecurity
      forensic disclosure. If formal diligence confirms: (1) revenue ~$600M+ USD, (2) NRR 110%+,
      (3) OIG no-action or limited penalty, and (4) breach fully remediated — the recommendation
      upgrades to buy at $4–5B. At $5B without these confirmations, it is priced to near-perfection.
    claimRefs: [CV024, CV025, CV026, CV027]

  - calloutType: risk
    title: "Revenue Baseline Conflict Makes Multiple Calculation Unreliable"
    body: >
      The unresolved $480M CAD (Globe and Mail) vs. $673M USD (company brief) revenue
      discrepancy creates a 20–30% valuation uncertainty. At $5B, this is the difference
      between a stretched 10.4x and a reasonable 7.4x EV/Revenue multiple. This is the
      highest-priority blocking diligence ask — without revenue baseline confirmation, the
      valuation stance cannot be confirmed.
    claimRefs: [CV007, CV008, CV025]

  - calloutType: insight
    title: "Data Network Moat Is Both the Strongest Asset and the Most at-Risk"
    body: >
      PointClickCare's 150M+ patient record network is simultaneously the company's most
      valuable asset (creates compounding analytics value and switching costs) and the
      most legally at-risk (information-blocking ruling threatens the data-access exclusivity
      that makes the network defensible). How PointClickCare navigates post-ruling compliance
      — whether it strengthens the moat through open APIs and TEFCA participation or loses
      data advantage to third-party analytics — will be the single most important determinant
      of the 3–5 year value trajectory.
    claimRefs: [CV004, CV005, CV006, CV029]

  - calloutType: assumption
    title: "NRR of 110-115% Assumed for Base Case — Confirmation Required"
    body: >
      The base case valuation and research-more recommendation assume NRR of 110–115%, which
      is consistent with structural switching cost analysis and enterprise healthcare SaaS
      benchmarks. If formal diligence reveals NRR below 100% (implying contraction within the
      installed base), the business case changes fundamentally and the recommendation would
      shift to track or pass. NRR disclosure is a non-negotiable first-page diligence ask.
    claimRefs: [CV003, CV016, CV028]

