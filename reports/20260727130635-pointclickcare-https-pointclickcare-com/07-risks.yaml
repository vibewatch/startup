company:
  name: "PointClickCare"
chapter:
  number: 7
  title: "Risks"
  summary: >
    PointClickCare faces a multi-dimensional risk profile spanning legal/regulatory (information-blocking
    ruling, HIPAA/ONC compliance), cybersecurity (July 2024 data breach, 150M+ patient record exposure),
    operational (Azure single-cloud dependency, CMS reimbursement reform), and strategic (IPO execution,
    PE exit pressure, key-person concentration) categories. The most material near-term risk is the
    Real Time Medical Systems information-blocking ruling (4th Circuit, March 2025), which found PCC
    violated the 21st Century Cures Act and exposed the company to civil monetary penalties up to $1M
    per violation. The IPO timeline and PE exit structure introduce execution risk. Dave Wessinger's
    founder-CEO dependency is a structural vulnerability. Mitigation requires formal compliance overhaul,
    cybersecurity investment, contract renewal planning, and a clear IPO path.

sections:
  - id: S-R-01
    title: "Legal and Regulatory Risk"
    body: >
      PointClickCare's most acute near-term risk is the legal and regulatory exposure arising from
      the Real Time Medical Systems v. PointClickCare litigation. In March 2025, the U.S. Court of
      Appeals for the Fourth Circuit affirmed that PointClickCare's use of CAPTCHAs and technical
      restrictions to block Real Time Medical's access to its EHR data network likely constituted
      information blocking under the 21st Century Cures Act. The court rejected PCC's security
      defense due to insufficient, inconsistent evidence and noted that the timing of restrictions
      aligned with PCC developing competing analytics products. The ruling allowed Real Time's
      unfair competition and tortious interference claims under Maryland law to proceed.

      Information blocking violations expose health IT developers and health information networks
      (which PointClickCare qualifies as) to civil monetary penalties of up to $1 million per
      violation from the HHS Office of Inspector General (OIG). Given the breadth of PointClickCare's
      data network (150M+ patient records, 30,000+ providers), the potential exposure is material.
      Regulators have also intensified enforcement in 2025-2026, with ONC and OIG issuing clearer
      guidance on prohibited practices.

      Additional regulatory risks include ongoing ONC certification maintenance obligations (21st
      Century Cures Act requires annual certification updates), HIPAA compliance across 150M+
      patient records, and Canadian PIPEDA compliance for the domestic market. The company must
      also maintain compliance with CMS Conditions of Participation requirements that govern its
      SNF customers' Medicare/Medicaid participation, creating a secondary regulatory exposure
      through customer non-compliance scenarios.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006]
    tableRefs: [TR001]
    figureRefs: [FR001]

  - id: S-R-02
    title: "Cybersecurity and Data Security Risk"
    body: >
      PointClickCare experienced a material cybersecurity incident in July 2024 in which compromised
      credentials were used to access patient data across the EHR platform, exposing sensitive
      information including patient names, Social Security numbers, Medicare/Medicaid IDs, dates
      of birth, medical records, and health insurance information across multiple long-term care
      facility customers. The breach triggered HIPAA breach notification requirements for affected
      customers and created regulatory, reputational, and potential class-action legal exposure.

      Healthcare data breaches are at an all-time high in 2025-2026: the average cost of a
      healthcare data breach is $7.42 million, and ransomware attacks on healthcare SaaS vendors
      are increasing in frequency and severity. PointClickCare's operational footprint — 150M+
      patient records, integration with 9,000+ facilities' clinical workflows, Azure cloud
      infrastructure — makes it a high-value target. A successful ransomware attack could
      disrupt billing operations across thousands of facilities, with cascading CMS reimbursement
      impacts.

      PointClickCare holds HITRUST CSF Certification and SOC 2 Type II audit status, which
      represent credible security frameworks. However, these certifications are process-level
      assurances, not guarantees against breach. The 2024 incident demonstrates that technical
      defenses were insufficient to prevent credential-based access. Pre-IPO, the SEC's new
      cybersecurity disclosure rules require detailed disclosure of material incidents and
      ongoing risk posture, adding a disclosure obligation risk layer.

      Given the mission-critical nature of the platform (24/7 clinical documentation for
      Medicare-participating facilities), even a short outage during billing cycles has
      disproportionate impact. Business continuity and disaster recovery infrastructure must
      be tested and certified before IPO.
    claimRefs: [CR007, CR008, CR009, CR010, CR011, CR012]
    tableRefs: [TR002]
    figureRefs: [FR002]

  - id: S-R-03
    title: "Operational and Technology Risk"
    body: >
      PointClickCare's primary operational risk is its Azure single-cloud dependency. The platform
      runs on Microsoft Azure with Kubernetes and Docker orchestration — a modern, scalable architecture
      that creates a single point of operational failure. An Azure regional outage affecting PointClickCare's
      infrastructure would disrupt SNF clinical operations across thousands of facilities simultaneously.
      Given that SNF staff document clinical assessments and submit MDS data through PointClickCare,
      even a 4–8 hour outage during a shift could result in documentation gaps, delayed MDS submissions,
      and CMS audit exposure for customer facilities.

      CMS FY2026 SNF PPS regulations include ICD-10 mapping updates, PDPM weighting revisions,
      and new quality reporting requirements. PointClickCare must implement regulatory updates
      within the CMS compliance timeline or its customers face coding errors and reimbursement
      risk. Any delay in compliance update rollout creates a systemic risk across the customer base.

      Technology execution risk: The 2026 launch of the Next-Gen Practitioner EHR and Advisor Suite
      represents significant development execution risk. UI updates have already generated customer
      complaints. Complex AI product launches in a clinical workflow environment carry patient
      safety adjacent risks — if AI-generated billing recommendations are erroneous, customers
      may face Medicare over-billing allegations.

      Infrastructure security, SLA compliance (Azure offers 99.99% uptime SLA for most services),
      and disaster recovery planning are core operational requirements. PointClickCare's enterprise
      customers in contract negotiations increasingly request evidence of SOC 2 audit results,
      Azure SLA documentation, and business continuity plans.
    claimRefs: [CR013, CR014, CR015, CR016, CR017, CR018]
    tableRefs: [TR003]
    figureRefs: [FR003]

  - id: S-R-04
    title: "Partner, Dependency, and Financial Risk"
    body: >
      PointClickCare's partner and dependency risks are concentrated in two dimensions: (1)
      infrastructure dependency on Microsoft Azure, which represents a single critical vendor
      relationship with no disclosed multi-cloud fallback; and (2) customer concentration in
      the top-tier SNF chain enterprise segment, where the loss of a few large accounts could
      have disproportionate revenue impact.

      Financial risks center on the PE ownership structure and IPO execution. Hellman & Friedman
      (minority investor since 2021) and JMI Equity together hold significant equity stakes.
      As PE investment cycles mature, there will be increasing pressure to achieve a liquidity
      event, either through IPO or strategic sale. The confidential S-1 filing indicates IPO
      preparation is underway, but market conditions (healthcare tech multiples, interest rate
      environment), SEC review timelines, and investor appetite create material execution uncertainty.

      If the IPO is delayed or withdrawn, PE investors may pursue alternative liquidity options
      (secondary sales, PE recap, or strategic M&A) that could introduce management disruption,
      valuation downside, or strategic direction changes. Any large M&A transaction with a
      strategic acquirer (Epic, Oracle, Microsoft) could fundamentally change PointClickCare's
      competitive positioning.

      Revenue model risk: PointClickCare's subscription revenue is tied to facility operational
      status. SNF closures (driven by staffing shortages, low Medicare reimbursement, or operator
      financial distress) reduce the active facility count. The U.S. SNF market is consolidating,
      with smaller independent facilities closing at higher rates. While PCC's per-facility revenue
      may increase through upsell, the total addressable facility count is declining modestly.
    claimRefs: [CR019, CR020, CR021, CR022, CR023, CR024]
    tableRefs: [TR004]

  - id: S-R-05
    title: "People, Execution, and Strategic Risk"
    body: >
      PointClickCare's people risk is concentrated in founder-CEO dependency. Dave Wessinger
      (CEO) and Mike Wessinger (Executive Chairman) are brothers who co-founded the company in
      2000. Dave's operational and strategic centrality is high: enterprise customer relationships,
      product strategy, and the IPO narrative are closely linked to his leadership. Any unexpected
      leadership transition at the CEO level — through departure, health, or conflict — would
      likely cause investor concern and customer uncertainty.

      CFO turnover risk: PointClickCare appointed Brian Gannon as CFO in December 2024 (replacing
      an earlier appointment), then saw Nicolette Turner take the CFO role in May 2025. Two CFO
      transitions in six months during IPO preparation creates execution risk around financial
      reporting quality, investor relations, and S-1 preparation. CFO continuity is critical
      for IPO readiness.

      Execution risk in AI product launch: The Advisor Suite (Referral, Chart, Billing Advisors)
      launched in June 2026. AI billing advisory tools carry a specific risk: if the AI generates
      incorrect billing recommendations that customers implement and later face Medicare recoupment
      audits, PointClickCare may face liability and customer backlash. Clinical AI deployments
      in regulated healthcare settings require rigorous validation and clear liability frameworks.

      Market/thesis risk: If Epic Systems accelerates its LTPAC market entry with a full-featured
      SNF EHR offering, PointClickCare's moat could erode faster than expected. Epic's long-term
      care investments have increased and its ability to offer seamless hospital-to-SNF care
      continuity could challenge PCC's cross-continuum integration value proposition.
    claimRefs: [CR025, CR026, CR027, CR028, CR029, CR030]
    tableRefs: [TR005]

  - id: S-R-06
    title: "Mitigations, Kill Criteria, and Diligence Path"
    body: >
      The most actionable risk mitigations and thesis-break triggers for PointClickCare are as
      follows. For information-blocking risk: monitor the Real Time Medical Systems case outcome
      on remand; a final court judgment imposing injunctive relief or penalties would be a material
      adverse development. OIG enforcement actions against PointClickCare for information blocking
      would be a thesis-break trigger.

      For cybersecurity risk: request the post-incident forensic report from the July 2024 breach
      in formal diligence. Verify HITRUST recertification date and scope. Test incident response
      procedures. A second material breach in the 12-month pre-IPO window would be a thesis-break
      trigger.

      For IPO execution risk: confirm S-1 filing timeline, underwriter engagement, and management
      roadshow readiness. If the IPO is delayed beyond Q4 2026, assess whether PE pressure creates
      strategic M&A alternatives. An involuntary strategic sale at a depressed multiple would be
      a risk for investors at current secondary market prices.

      For key person risk: verify succession planning and employment agreements for Dave Wessinger
      and the CFO. Assess whether the next CFO is in stable tenure. A CEO departure within 12 months
      of IPO would be a thesis-break trigger.

      For CMS regulatory risk: the FY2027 SNF PPS rule (expected August 2026) should be monitored
      for material payment cuts. CMS has signaled value-based care direction through SNF Value-Based
      Purchasing (VBP) program; PointClickCare's platform is generally well-positioned but any
      significant PDPM restructuring could require expensive platform updates.
    claimRefs: [CR031, CR032, CR033, CR034, CR035, CR036, CR037, CR038, CR039, CR040]

