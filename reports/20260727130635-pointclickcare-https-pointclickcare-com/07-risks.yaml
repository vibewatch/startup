callouts:
  - calloutType: risk
    title: "Information Blocking Ruling Is the Most Material Near-Term Legal Risk"
    body: >
      The 4th Circuit's March 2025 ruling that PointClickCare likely violated information blocking
      provisions is the single highest-severity legal risk. OIG civil monetary penalties of up to
      $1M per violation are authorized, and the anti-competitive framing of the ruling invites
      antitrust scrutiny. For a company preparing an IPO, an active OIG enforcement proceeding
      or injunctive data-sharing order would be a material adverse event requiring disclosure
      and could delay or complicate the listing.
    claimRefs: [CR001, CR002, CR003]

  - calloutType: risk
    title: "Cybersecurity: 2024 Breach and 150M+ Patient Records Create Ongoing Exposure"
    body: >
      PointClickCare's July 2024 data breach and the healthcare sector's record breach frequency
      in 2025-2026 represent a sustained, material operational risk. The average healthcare breach
      now costs $7.42M. At IPO scale, a second material breach would likely require SEC disclosure,
      customer notification, and class-action exposure. HITRUST certification is necessary but
      insufficient — the 2024 incident demonstrates that credential-based attacks can bypass
      perimeter controls.
    claimRefs: [CR007, CR008, CR009]

  - calloutType: recommendation
    title: "Prioritize Three Diligence Asks Before Commitment"
    body: >
      Before any investment commitment, three diligence items are blocking: (1) obtain PCC's
      post-incident forensic report and OIG correspondence on the information-blocking ruling;
      (2) verify Dave Wessinger's employment agreement and succession plan; (3) confirm CFO
      Nicolette Turner's tenure stability and S-1 preparation status. These address the three
      highest-severity unresolved risks identified in this chapter.
    claimRefs: [CR031, CR032, CR033, CR034]

