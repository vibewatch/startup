companyProfile:
  summary: >
    PointClickCare is the leading North American cloud-based electronic health record (EHR)
    and care coordination platform for long-term and post-acute care (LTPAC) providers.
    Founded in 2000 by brothers Dave Wessinger (CEO) and Mike Wessinger (Executive Chairman)
    in Mississauga, Ontario, Canada, the platform serves 30,000+ provider organizations
    across skilled nursing facilities, assisted living, continuing care retirement communities,
    and home health agencies. The company's data network encompasses 150M+ patient records
    and 375+ marketplace partner integrations, creating a cross-continuum HIE platform.
    PointClickCare holds ~60–80% of the U.S. SNF EHR market, has won KLAS Best in KLAS
    for SNF/LTC seven consecutive years, and is in active IPO preparation with a
    confidential S-1 reportedly filed in 2024-2025.
  foundedDate: "2000-01-01"
  founders:
    - name: "Dave Wessinger"
      role: "CEO"
      background: "Co-founder and CEO of PointClickCare since 2000; leads product strategy, enterprise customer relationships, and company direction."
      claimRefs: [CO002]
    - name: "Mike Wessinger"
      role: "Executive Chairman"
      background: "Co-founder and Executive Chairman; transitioned from CEO role; provides strategic governance and industry leadership."
      claimRefs: [CO002]
  foundingLocation: "Mississauga, Ontario, Canada"
  headquarters: "Mississauga, Ontario, Canada"
  productSummary: >
    Core EHR platform for SNF/LTC/assisted living/home health clinical documentation, MDS
    automation, and regulatory compliance; Collective Medical cross-continuum care coordination
    network; Audacious Inquiry HIE and government agency connectivity; AI Advisor Suite
    (Referral Advisor, Chart Advisor, Billing Advisor — launched June 2026); Next-Gen
    Practitioner EHR (launched May 2026); 375+ marketplace partner integrations.
  customerFocus: >
    Long-term and post-acute care (LTPAC) providers: primarily U.S. skilled nursing facilities
    (9 of 10 largest chains), assisted living communities, CCRCs, and home health agencies.
    Also U.S. federal government agencies and state HIEs through Audacious Inquiry.
  businessModel: >
    Annual recurring SaaS subscription (per-facility or per-bed pricing); implementation
    services; analytics and AI module upsell; marketplace integration revenue; government
    HIE contracts. 90%+ recurring revenue; 3–5 year enterprise contracts.
  stage: "late-stage private"
  fundingStatus: >
    ~$283M disclosed equity (2011-2018); 2021 H&F + Dragoneer secondary ($4B valuation);
    2024 H&F + JMI Equity secondary ($5B valuation). Confidential S-1 filed 2024-2025 for
    potential IPO. Total disclosed equity is low relative to valuation; most capital was
    secondary (PE buying existing shares, not new capital to company).
  disclosureProfile: private-disclosed
  claimRefs: [CO001, CO002, CO003, CO005, CO006, CO014, CO021]

