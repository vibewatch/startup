      - number: '7.5'
        title: People, Execution, and Strategic Risk
        blocks:
          - type: paragraph
            body: >
              PointClickCare's people risk is concentrated in founder-CEO dependency. Dave Wessinger (CEO) and Mike
              Wessinger (Executive Chairman) are brothers who co-founded the company in 2000. Dave's operational and
              strategic centrality is high: enterprise customer relationships, product strategy, and the IPO narrative
              are closely linked to his leadership. Any unexpected leadership transition at the CEO level — through
              departure, health, or conflict — would likely cause investor concern and customer uncertainty.

              CFO turnover risk: PointClickCare appointed Brian Gannon as CFO in December 2024 (replacing an earlier
              appointment), then saw Nicolette Turner take the CFO role in May 2025. Two CFO transitions in six months
              during IPO preparation creates execution risk around financial reporting quality, investor relations, and
              S-1 preparation. CFO continuity is critical for IPO readiness.

              Execution risk in AI product launch: The Advisor Suite (Referral, Chart, Billing Advisors) launched in
              June 2026. AI billing advisory tools carry a specific risk: if the AI generates incorrect billing
              recommendations that customers implement and later face Medicare recoupment audits, PointClickCare may
              face liability and customer backlash. Clinical AI deployments in regulated healthcare settings require
              rigorous validation and clear liability frameworks.

              Market/thesis risk: If Epic Systems accelerates its LTPAC market entry with a full-featured SNF EHR
              offering, PointClickCare's moat could erode faster than expected. Epic's long-term care investments have
              increased and its ability to offer seamless hospital-to-SNF care continuity could challenge PCC's
              cross-continuum integration value proposition.
            claimRefs:
              - CR025
              - CR026
              - CR027
              - CR028
              - CR029
              - CR030
          - type: table
            tableRef: TR005
