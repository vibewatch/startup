      - number: '1.5'
        title: Key Milestones and Corporate History
        blocks:
          - type: paragraph
            body: >
              PointClickCare's corporate timeline spans more than two decades of growth in the LTPAC technology sector.
              The company was founded in 2000 by the Wessinger brothers as a clinical documentation tool for long-term
              care facilities. Early growth was organic, building out core EHR capabilities for skilled nursing through
              the 2000s and early 2010s.

              Meaningful external financing began with early growth rounds circa 2011–2018, culminating in a $146
              million growth round in 2018. The company then pursued an aggressive M&A strategy: acquiring Collective
              Medical in December 2020 for approximately $650 million to add care-transitions capabilities across the
              acute-to-post-acute care interface; and completing the acquisition of Audacious Inquiry in March 2022 for
              approximately $250 million to add nationwide health information exchange capabilities across state and
              government networks.

              In 2021, Hellman & Friedman acquired a significant stake via secondary transaction, crystallizing a $4
              billion valuation. In December 2024, the company appointed Brian Gannon as CFO (pre-IPO signal), later
              replaced by Nicolette Turner in May 2025. In May 2026, Taylor Rhodes joined the Board of Directors as an
              independent tech-experienced director. The company has been named Best in KLAS seven consecutive years. In
              2025, PointClickCare faced and lost a significant federal court ruling in the Real Time Medical Systems
              information-blocking litigation, which found that certain data access practices likely violated the 21st
              Century Cures Act and ordered the company to allow competitor access to patient data on its platform.

              The confidential S-1 filing dates to 2024–2025 per external reporting, positioning the company for a
              potential IPO when market conditions are favorable.
