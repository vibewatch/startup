      - number: '7.6'
        title: Mitigations, Kill Criteria, and Diligence Path
        blocks:
          - type: paragraph
            body: >
              The most actionable risk mitigations and thesis-break triggers for PointClickCare are as follows. For
              information-blocking risk: monitor the Real Time Medical Systems case outcome on remand; a final court
              judgment imposing injunctive relief or penalties would be a material adverse development. OIG enforcement
              actions against PointClickCare for information blocking would be a thesis-break trigger.

              For cybersecurity risk: request the post-incident forensic report from the July 2024 breach in formal
              diligence. Verify HITRUST recertification date and scope. Test incident response procedures. A second
              material breach in the 12-month pre-IPO window would be a thesis-break trigger.

              For IPO execution risk: confirm S-1 filing timeline, underwriter engagement, and management roadshow
              readiness. If the IPO is delayed beyond Q4 2026, assess whether PE pressure creates strategic M&A
              alternatives. An involuntary strategic sale at a depressed multiple would be a risk for investors at
              current secondary market prices.

              For key person risk: verify succession planning and employment agreements for Dave Wessinger and the CFO.
              Assess whether the next CFO is in stable tenure. A CEO departure within 12 months of IPO would be a
              thesis-break trigger.

              For CMS regulatory risk: the FY2027 SNF PPS rule (expected August 2026) should be monitored for material
              payment cuts. CMS has signaled value-based care direction through SNF Value-Based Purchasing (VBP)
              program; PointClickCare's platform is generally well-positioned but any significant PDPM restructuring
              could require expensive platform updates.
            claimRefs:
              - CR031
              - CR032
              - CR033
              - CR034
              - CR035
              - CR036
              - CR037
              - CR038
              - CR039
              - CR040
      - number: '7.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Information Blocking Ruling Is the Most Material Near-Term Legal Risk
            body: >
              The 4th Circuit's March 2025 ruling that PointClickCare likely violated information blocking provisions is
              the single highest-severity legal risk. OIG civil monetary penalties of up to $1M per violation are
              authorized, and the anti-competitive framing of the ruling invites antitrust scrutiny. For a company
              preparing an IPO, an active OIG enforcement proceeding or injunctive data-sharing order would be a
              material adverse event requiring disclosure and could delay or complicate the listing.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: 'Cybersecurity: 2024 Breach and 150M+ Patient Records Create Ongoing Exposure'
            body: >
              PointClickCare's July 2024 data breach and the healthcare sector's record breach frequency in 2025-2026
              represent a sustained, material operational risk. The average healthcare breach now costs $7.42M. At IPO
              scale, a second material breach would likely require SEC disclosure, customer notification, and
              class-action exposure. HITRUST certification is necessary but insufficient — the 2024 incident
              demonstrates that credential-based attacks can bypass perimeter controls.
            calloutType: risk
            claimRefs:
              - CR007
              - CR008
              - CR009
          - type: callout
            title: Prioritize Three Diligence Asks Before Commitment
            body: >
              Before any investment commitment, three diligence items are blocking: (1) obtain PCC's post-incident
              forensic report and OIG correspondence on the information-blocking ruling; (2) verify Dave Wessinger's
              employment agreement and succession plan; (3) confirm CFO Nicolette Turner's tenure stability and S-1
              preparation status. These address the three highest-severity unresolved risks identified in this chapter.
            calloutType: recommendation
            claimRefs:
              - CR031
              - CR032
              - CR033
              - CR034
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >
              The investment thesis for PointClickCare rests on five pillars: (1) Market leadership moat — 60–80%
              SNF/LTC market share in a compliance-driven, regulatory-sticky vertical with high switching costs; (2)
              Network effect — 150M+ patient records across 30,000+ providers creates a data network that compounds over
              time (critical mass HIE); (3) Revenue quality — 90%+ recurring subscription revenue, 3–5 year enterprise
              contracts, estimated <5% annual churn, and structural retention from Medicare/Medicaid documentation
              dependency; (4) TAM expansion — $11B+ LTPAC HIT market growing at 6–8% CAGR with AI upside from Advisor
              Suite and cross-continuum analytics; (5) IPO catalyst — confidential S-1 provides a near-term liquidity
              event with institutional investor validation.

              The anti-thesis is equally specific: (1) Revenue baseline conflict — $480M CAD vs. $673M USD (unresolved;
              affects multiple calculation by 20–30%); (2) NRR undisclosed — without confirmed net revenue retention,
              customer quality assessment relies on structural proxies; (3) Information-blocking exposure — the 4th
              Circuit ruling exposes the data-network moat to OIG penalty and competitive erosion; (4) Valuation at $5B
              is stretched — 10x EV/Revenue is at or above the premium healthcare SaaS range; and (5) Execution risk —
              dual CFO transitions, AI product early-stage, and PE exit pressure reduce confidence in smooth IPO
              execution.

              The balance between thesis and anti-thesis resolves to a research-more recommendation: the business
              fundamentals are attractive but the unresolved revenue baseline, undisclosed retention metrics, and
              litigation tail require resolution before a definitive buy call can be made at the current $5B secondary
              market price.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
