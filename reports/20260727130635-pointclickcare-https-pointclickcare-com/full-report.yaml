      - number: '4.6'
        title: 'Financial Verdict: Revenue Quality, Margin Path, and Diligence Blockers'
        blocks:
          - type: paragraph
            body: >
              PointClickCare presents as a high-quality recurring-revenue SaaS business with structural characteristics
              that support premium valuation: mission-critical software, deep workflow integration, high switching
              costs, regulatory compliance lock-in, and a dominant market position. The estimated 70–75% gross margin
              and <5% churn are consistent with the upper range of vertical SaaS performance.

              However, several material diligence blockers must be resolved before financial modeling can be completed:
              (1) the $480M vs. $673M revenue discrepancy requires reconciliation — the higher figure, if GAAP-audited,
              would imply an EV/Revenue multiple of ~6× at $4B valuation (attractive); at $480M USD, it would be ~8×
              (fair to stretched); (2) absence of audited financials, EBITDA disclosure, or cash flow statements makes
              it impossible to confirm margin claims; (3) lack of leverage/debt disclosure creates opacity around the
              true net debt position post-acquisitions; and (4) the Real Time Medical Systems court ruling may have
              ongoing financial implications (potential remediation costs, API access infrastructure, competitive
              pressure on data-monetization revenue).

              The financial quality score is high for the subscription/retention characteristics but medium-low for
              transparency, given private company disclosure constraints. The IPO pathway, if executed, will resolve
              these gaps.
