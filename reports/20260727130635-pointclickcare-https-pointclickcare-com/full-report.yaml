      - number: '7.3'
        title: Operational and Technology Risk
        blocks:
          - type: paragraph
            body: >
              PointClickCare's primary operational risk is its Azure single-cloud dependency. The platform runs on
              Microsoft Azure with Kubernetes and Docker orchestration — a modern, scalable architecture that creates a
              single point of operational failure. An Azure regional outage affecting PointClickCare's infrastructure
              would disrupt SNF clinical operations across thousands of facilities simultaneously. Given that SNF staff
              document clinical assessments and submit MDS data through PointClickCare, even a 4–8 hour outage during a
              shift could result in documentation gaps, delayed MDS submissions, and CMS audit exposure for customer
              facilities.

              CMS FY2026 SNF PPS regulations include ICD-10 mapping updates, PDPM weighting revisions, and new quality
              reporting requirements. PointClickCare must implement regulatory updates within the CMS compliance
              timeline or its customers face coding errors and reimbursement risk. Any delay in compliance update
              rollout creates a systemic risk across the customer base.

              Technology execution risk: The 2026 launch of the Next-Gen Practitioner EHR and Advisor Suite represents
              significant development execution risk. UI updates have already generated customer complaints. Complex AI
              product launches in a clinical workflow environment carry patient safety adjacent risks — if AI-generated
              billing recommendations are erroneous, customers may face Medicare over-billing allegations.

              Infrastructure security, SLA compliance (Azure offers 99.99% uptime SLA for most services), and disaster
              recovery planning are core operational requirements. PointClickCare's enterprise customers in contract
              negotiations increasingly request evidence of SOC 2 audit results, Azure SLA documentation, and business
              continuity plans.
