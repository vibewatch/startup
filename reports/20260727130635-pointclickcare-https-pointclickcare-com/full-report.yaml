      - number: '3.2'
        title: 'MatrixCare: Primary Direct Competitor'
        blocks:
          - type: paragraph
            body: >
              MatrixCare, a subsidiary of ResMed (NYSE: RMD) since 2020, is PointClickCare's closest direct competitor
              in the LTPAC EHR market. MatrixCare serves approximately 15,000+ provider organizations and is
              particularly strong in home health, hospice, and home care management software. In the SNF segment,
              MatrixCare ranked second in the 2026 KLAS Skilled Nursing Facilities category behind PointClickCare.

              MatrixCare's key product strengths include its MatrixConnect interoperability platform (competing with
              PointClickCare's Collective Medical network), strong analytics and dashboarding capabilities, and robust
              regulatory compliance and billing automation. It competes on lower total cost of ownership for mid-size
              operators and stronger home health/hospice workflow support than PointClickCare's historically SNF-centric
              platform.

              ResMed's ownership provides MatrixCare with significant capital resources (ResMed is a ~$20B+ market cap
              public company) and strategic connectivity to the broader respiratory and remote patient monitoring
              space—a potential differentiator as post-acute care moves toward more home-based and remote monitoring
              models. MatrixCare's estimated pricing is $255–$425 per user per month, slightly lower than
              PointClickCare's $300–$500 range, making it more competitive for cost-conscious mid-size operators.
