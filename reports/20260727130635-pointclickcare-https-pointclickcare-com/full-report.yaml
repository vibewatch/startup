              The key expansion risk is revenue concentration: with nine of ten largest U.S. SNF chains as customers,
              the enterprise segment represents significant revenue concentration. The loss of one or two large chain
              accounts could have a material revenue impact. No publicly confirmed large-account churn events have been
              identified as of July 2026, but the Real Time Medical Systems information-blocking ruling creates a
              scenario where large chains may demand more open data access or evaluate alternative analytics vendors.

              Channel dependence is limited: PointClickCare's go-to-market is primarily direct sales with enterprise
              account managers. The 375+ marketplace partners support co-sell and integration stickiness but do not
              represent a material customer acquisition channel. Government contracts (Audacious Inquiry + CNI) are a
              small but growing diversification into the public-sector customer base.

              Geographic concentration (U.S. and Canada) creates risk if U.S. SNF market consolidation or regulatory
              changes (e.g., CMS reimbursement reform) reduce the operator count or purchasing power of the core
