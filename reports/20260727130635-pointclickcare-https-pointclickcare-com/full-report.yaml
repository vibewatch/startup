      - number: '2.5'
        title: Regulatory Environment and Disconfirming Evidence
        blocks:
          - type: paragraph
            body: >
              The regulatory environment for LTPAC EHR is among the most complex in healthcare software. SNFs
              participate in both Medicare and Medicaid, requiring compliance with CMS Conditions of Participation,
              annual cost reports, MDS (Minimum Data Set) assessments, and state licensure surveys. EHR vendors must
              maintain ONC certification for their software to qualify for regulatory incentives and to be used in
              certified beds. PointClickCare holds ONC certification, which is a significant barrier to entry for new
              competitors.

              Disconfirming evidence and market headwinds: (1) The information-blocking ruling against PointClickCare in
              2025 signals that regulators and courts are willing to force data access, which could reduce the data-moat
              advantage that justified premium pricing; (2) Several SNF chains have reported operator financial stress,
              bankruptcies, and closure rates increasing in 2024–2026, reducing the total number of facilities available
              to serve; (3) Epic's increasing interest in extending its EHR footprint into post-acute settings
              represents a medium-term competitive threat from a well-resourced incumbent; (4) Medicare Advantage rate
              pressure in 2024–2026 has squeezed SNF margins, potentially limiting technology investment budgets; (5)
              Workforce shortages mean fewer trained staff to adopt new EHR features, limiting upsell potential.

              Despite these headwinds, the structural tailwinds (aging, regulatory mandates, VBC adoption) are expected
              to outweigh near-term constraints. The market's 11–12% CAGR growth consensus implies sustained demand
              expansion that creates multiple years of organic growth opportunity for market leaders like
              PointClickCare.
            claimRefs:
              - CM028
              - CM029
              - CM030
              - CM031
              - CM032
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Secular Demographic Tailwind Creates Multi-Decade Growth
            body: >
              The U.S. 85+ population—the primary SNF and post-acute care user—is the fastest-growing demographic
              cohort. With baby boomers turning 80 in 2026, demand for skilled nursing and senior care will accelerate
              through the 2030s. This is the most durable demand driver in PointClickCare's market and creates a
              long-visibility growth runway that is relatively insensitive to economic cycles.
            calloutType: strength
            claimRefs:
              - CM020
              - CM021
          - type: callout
            title: SNF Facility Closures Reduce Total Addressable Facilities
            body: >
              Higher labor costs from staffing mandates, Medicare Advantage rate pressure, and the ongoing aftermath of
              COVID-19 occupancy disruption have contributed to elevated SNF closure and consolidation rates in
              2024–2026. A shrinking total facility count reduces the new-logo opportunity and may increase dependency
              on upsell/cross-sell within existing customers. Concentration among large chains (top 10 chains control
              ~20% of SNF beds) creates counterparty risk.
            calloutType: risk
            claimRefs:
              - CM025
              - CM026
              - CM029
          - type: callout
            title: Value-Based Care Transition Expands Revenue Per Facility
            body: >
              As facilities move into value-based care contracts with Medicare Advantage plans and ACOs, they require
              analytics, care-transition, and network management tools that go beyond basic EHR functionality.
              PointClickCare's acquisitions of Collective Medical and Audacious Inquiry have positioned it to capture
              this next layer of spend—potentially doubling revenue per customer from basic EHR (~$40–60K/yr) to full
              care-platform (~$80–120K+/yr).
            calloutType: insight
            claimRefs:
              - CM023
              - CM024
              - CM003
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Overview and Market Structure
        blocks:
          - type: paragraph
            body: >
              The LTPAC EHR and care-coordination market in North America is a concentrated oligopoly dominated by three
              to four specialized vendors, with PointClickCare holding the clear number-one position. The market is
              characterized by high switching costs (deep workflow integration, staff training, regulatory reporting
              integration), multi-year contracts (3–5 years), and strong network effects from care-coordination data
              sharing. These structural features make it extremely difficult for new entrants to displace installed-base
              vendors and create a defensible moat for incumbents.

              PointClickCare's core competitive advantages are: (1) its dominant SNF market share creating the largest
              care-coordination data network; (2) network effects from Collective Medical and Audacious Inquiry
              integrations connecting 2,700+ hospitals and 75+ government agencies; (3) ONC certification and KLAS
              leadership providing third-party validation; (4) a 375+ partner ecosystem creating integration moat; and
              (5) first-mover advantage in AI-powered clinical workflows in LTPAC.

              The primary competitive threats are: (1) MatrixCare in the SNF/home health overlap; (2) Netsmart in
              behavioral health and specialty post-acute; (3) Epic in hospital-owned SNFs and integrated delivery
              networks; and (4) potential new entrants leveraging cloud-native AI platforms to undercut legacy vendors
              on price or usability. The information-blocking court ruling against PointClickCare in 2025 partially
              erodes its data-access moat by requiring more open data sharing with third-party analytics vendors.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
