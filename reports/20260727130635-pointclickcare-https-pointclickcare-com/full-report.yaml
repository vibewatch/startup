  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Revenue Streams
        blocks:
          - type: paragraph
            body: >
              PointClickCare generates revenue primarily through subscription-based SaaS fees for its cloud EHR,
              care-coordination, financial management, billing, and analytics modules. The revenue model is primarily
              per-bed/per-month or per-facility/per-month, with pricing negotiated by facility size and selected
              modules. Third-party sources estimate pricing at $300–$500 per user per month for the full platform, while
              per-facility estimates range from $500–$2,000/month for small facilities to $5,000–$15,000+/month for
              large 200-bed+ facilities. Implementation fees, professional services, and training represent a smaller
              non-recurring component of revenue.

              The primary revenue streams are: (1) EHR subscription (core platform), estimated to represent ~60–65% of
              total revenue; (2) care-coordination analytics (Collective Medical and Audacious Inquiry-derived),
              estimated at ~20–25%; (3) payer and financial management modules ~10–15%; and (4) professional
              services/implementation ~5–10%. The recurring subscription component is estimated at 90%+ of total
              revenue, consistent with a mature SaaS business model. Revenue growth of 69% over three years (2021–2024)
              implies a CAGR of approximately 19% annually.

              The company's revenue is primarily denominated in USD (U.S. market) and CAD (Canadian operations). Globe
              and Mail's annual ranking data disclosed $480.3M CAD (~$355–360M USD at prevailing exchange rates) for
              2024, based on public self-reported data for the ranking submission. The company's background information
              cites $673M USD, possibly reflecting a broader definition including Collective Medical and Audacious
              Inquiry. These figures are inconsistent and represent a key diligence gap — audited GAAP revenue figures
              are not public.
            claimRefs:
              - CI001
