      - number: '5.2'
        title: Platform Architecture and Technology Stack
        blocks:
          - type: paragraph
            body: >
              PointClickCare's technical architecture is cloud-native and multi-tenant, deployed on Microsoft Azure with
              Kubernetes-based container orchestration and Docker microservices. The backend uses a multi-language
              microservices approach: primarily .NET/C# and Java for core EHR services, Node.js for API gateway and
              event-driven services, and Python for AI/ML model serving. The frontend is built with TypeScript, React,
              and Angular, delivering responsive web and native iOS/Android mobile applications.

              Data persistence uses a hybrid approach: Azure SQL for transactional EHR data, Azure Cosmos DB (NoSQL) for
              event logging, audit trails, and data lake storage. The interoperability layer implements HL7 v2, FHIR R4,
              and SMART on FHIR standards for data exchange with hospital EMRs, payers, laboratories, pharmacies, and
              HIEs. The integration broker supports direct ADT (admit/discharge/transfer) feeds, lab and imaging orders,
              and bi-directional medication data exchange.

              The AI/ML layer utilizes Azure Cognitive Services for NLP processing (Ambient Scribe), with custom-trained
              models for patient risk scoring, referral complexity assessment, and billing anomaly detection. The
              platform processes data from 150M+ patient encounters, giving PointClickCare one of the largest
              LTPAC-specific training datasets in the industry. This proprietary data advantage accelerates AI model
