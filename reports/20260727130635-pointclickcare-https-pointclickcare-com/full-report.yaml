      - number: '4.2'
        title: GTM Motion and Sales Efficiency Proxies
        blocks:
          - type: paragraph
            body: >
              PointClickCare's go-to-market approach is enterprise direct sales to SNF operators, assisted living
              chains, and home health networks, supplemented by channel partnerships with pharmacy, lab, and RPM vendors
              in its 375+ marketplace. The sales cycle for large enterprise accounts (50+ facility chains) is typically
              6–18 months given the deep integration requirements of EHR replacement. For mid-market accounts (10–50
              facilities), cycles range 3–9 months.

              Customer acquisition cost (CAC) is not publicly disclosed but can be proxied from industry benchmarks for
              enterprise healthcare SaaS: $10,000–$30,000 per net new facility added. Assuming 30,000+ facilities and
              revenue of $480M, average revenue per facility is approximately $13,000–$16,000/year
              ($1,083–$1,333/month). At estimated gross margins of 70–75%, the gross margin per facility is
              ~$9,000–$12,000 per year. Payback on a $15,000–$25,000 CAC would be approximately 18–30 months, consistent
              with enterprise SaaS norms.

              Key efficiency drivers include: (1) low churn (<5% estimated) from deep EHR workflow integration and
              regulatory compliance reporting dependencies; (2) upsell motion through the analytics and value-based care
              module portfolio; (3) a partner marketplace that drives stickiness and indirect co-sell revenue from
              integrated vendors; and (4) the KLAS #1 ranking that functions as an external validation signal in
              procurement.
