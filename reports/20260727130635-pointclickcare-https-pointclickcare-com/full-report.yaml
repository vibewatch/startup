  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and Regulatory Risk
        blocks:
          - type: paragraph
            body: >
              PointClickCare's most acute near-term risk is the legal and regulatory exposure arising from the Real Time
              Medical Systems v. PointClickCare litigation. In March 2025, the U.S. Court of Appeals for the Fourth
              Circuit affirmed that PointClickCare's use of CAPTCHAs and technical restrictions to block Real Time
              Medical's access to its EHR data network likely constituted information blocking under the 21st Century
              Cures Act. The court rejected PCC's security defense due to insufficient, inconsistent evidence and noted
              that the timing of restrictions aligned with PCC developing competing analytics products. The ruling
              allowed Real Time's unfair competition and tortious interference claims under Maryland law to proceed.

              Information blocking violations expose health IT developers and health information networks (which
              PointClickCare qualifies as) to civil monetary penalties of up to $1 million per violation from the HHS
              Office of Inspector General (OIG). Given the breadth of PointClickCare's data network (150M+ patient
              records, 30,000+ providers), the potential exposure is material. Regulators have also intensified
              enforcement in 2025-2026, with ONC and OIG issuing clearer guidance on prohibited practices.

              Additional regulatory risks include ongoing ONC certification maintenance obligations (21st Century Cures
              Act requires annual certification updates), HIPAA compliance across 150M+ patient records, and Canadian
              PIPEDA compliance for the domestic market. The company must also maintain compliance with CMS Conditions
              of Participation requirements that govern its SNF customers' Medicare/Medicaid participation, creating a
              secondary regulatory exposure through customer non-compliance scenarios.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
