      - number: '5.4'
        title: Deployment, Integration, and Roadmap
        blocks:
          - type: paragraph
            body: >
              PointClickCare is deployed as a pure-cloud SaaS with no on-premises option. Implementation timelines range
              from 60–90 days for single-facility deployments to 6–18 months for large multi-site chains, driven by data
              migration, staff training, and regulatory reporting integration requirements. The company provides
              dedicated implementation services and customer success managers for accounts above 10 facilities.

              Integration reliability is supported by a 99.9%+ SLA (industry standard for enterprise healthcare SaaS)
              backed by Azure's multi-region redundancy. The platform supports role-based access control, multi-factor
              authentication, and full audit logging for all EHR access and changes. A Trust Center
              (trust.pointclickcare.com) provides customers with real-time security and compliance documentation for
              vendor onboarding requirements.

              The product roadmap for 2026–2027 is focused on: (1) expanding the Advisor Suite to additional workflow
              modules; (2) deepening the Next-Gen Practitioner EHR with more AI capabilities; (3) expanding into home
              health and home care workflows (historically a weaker product area vs. MatrixCare); and (4) further
              developing the value-based care and payer analytics modules. A key technical challenge is the integration
              of Collective Medical and Audacious Inquiry onto a single unified data platform while maintaining
              operational stability for 30,000+ active customer facilities.
