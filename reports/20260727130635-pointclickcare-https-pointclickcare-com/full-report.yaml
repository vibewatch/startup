      - number: '8.2'
        title: Valuation Context and Comparable Analysis
        blocks:
          - type: paragraph
            body: >
              PointClickCare's most recent disclosed valuation data points are: (1) $4B implied valuation from the March
              2021 Hellman & Friedman secondary transaction; (2) ~$5B from 2023-2024 secondary market transactions by
              H&F and JMI Equity; and (3) Forge Global's pre-IPO secondary market data also reflecting approximately $5B
              as of 2025-2026.

              At the $4B mark, the implied EV/Revenue multiple is 8.3x using the $480M CAD baseline or approximately
              5.9x using the $673M USD baseline — a wide range driven by the revenue uncertainty. At the $5B mark,
              multiples are 10.4x and 7.4x respectively.

              Comparable company analysis: Veeva Systems (healthcare SaaS leader) trades at 6.9x EV/Revenue (Q1 2026).
              Phreesia (patient intake healthcare SaaS) trades at 5–8x. Inovalon (healthcare analytics, PE take-private
              2022) was taken private at ~7x EV/Revenue. nCino (vertical SaaS, fintech) trades at 5–10x. The public SaaS
              median is 6.1–8.5x EV/Revenue in 2025-2026.

              Within this comp set, PointClickCare's $5B secondary market implied 10x multiple is above the healthcare
              SaaS median. A justifiable premium exists for PCC's regulatory moat, market dominance, and data network —
              but this premium is typically 1–2x above the median, suggesting a fair value range of $4–5.5B (8–11x
              EV/Revenue) contingent on revenue baseline confirmation.

              A critical data gap: the revenue baseline conflict ($480M CAD vs $673M USD) makes precise multiple
              calculation impossible without formal diligence. The implied $673M USD revenue would make the $5B
              valuation look more modest (7.4x) and defensible; the $480M CAD baseline makes it more stretched (10.4x).
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
