            title: 7× KLAS Best in KLAS and 60–80% SNF Market Share are Durable Moats
            body: >
              The combination of dominant installed-base market share, 7 consecutive KLAS #1 rankings in SNF/LTC, and
              the network effect of 30,000+ connected providers creates a self-reinforcing moat. Procurement decisions
              at SNF chains are heavily influenced by KLAS rankings and peer references, making PointClickCare the
              default choice in most competitive evaluations.
