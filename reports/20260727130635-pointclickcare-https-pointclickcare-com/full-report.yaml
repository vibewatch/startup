      - number: '2.4'
        title: Growth Drivers and Market Constraints
        blocks:
          - type: paragraph
            body: >
              The most powerful demand driver for PointClickCare's market is demographic: the first wave of baby boomers
              turned 80 in 2026, accelerating demand for skilled nursing and senior care. The U.S. 65+ population is
              projected to double from ~52 million to ~95 million by 2060, with the 85+ "oldest old" segment—the primary
              SNF user—growing fastest. This creates a structural multi-decade tailwind for the LTPAC software market
              regardless of short-term economic cycles.

              Regulatory mandates are the second major driver. The 21st Century Cures Act's information blocking
              provisions require EHR vendors to enable data sharing, creating pressure on legacy on-premise vendors to
              upgrade to cloud-native, FHIR-compliant platforms—a structural advantage for PointClickCare. CMS's
              Interoperability and Patient Access Final Rule (CMS- 9115-F) mandates FHIR API adoption across Medicare
              and Medicaid programs. The 2024 Minimum Staffing Final Rule requires SNFs to maintain minimum staffing
              ratios, increasing labor costs and driving demand for workflow automation software that can document and
              optimize staffing compliance.

              The transition to value-based care (VBC) in Medicare and Medicaid is a third secular driver. As Medicare
              Advantage (MA) enrollment exceeds Traditional Medicare in several states, payers are increasingly
              requiring SNF partners to share quality data, integrate into care networks, and measure outcome
              metrics—all capabilities where PointClickCare's platform adds direct value. By 2030, CMS aims to have all
              Medicare beneficiaries in accountable care relationships.

              Key market constraints include: (1) long sales cycles and implementation timelines in the regulated
              healthcare sector; (2) chronic workforce shortages in SNFs limiting technology adoption capacity; (3) high
              Medicaid reimbursement concentration creating margin pressure at facilities; (4) pricing sensitivity among
              smaller/independent SNF operators who may resist enterprise SaaS pricing; and (5) the Real Time Medical
              Systems information-blocking ruling, which may reduce PointClickCare's ability to use data-access controls
              as a competitive moat.
            claimRefs:
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
