              Key private metrics that are unavailable without formal disclosure include: (a) audited GAAP revenue by
              segment, (b) net revenue retention rate, (c) ARR by product line, (d) gross and net churn rates, (e)
              customer lifetime value, (f) cost of customer acquisition by channel, (g) EBITDA and operating income, (h)
