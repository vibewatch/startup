      - number: '7.4'
        title: Partner, Dependency, and Financial Risk
        blocks:
          - type: paragraph
            body: >
              PointClickCare's partner and dependency risks are concentrated in two dimensions: (1) infrastructure
              dependency on Microsoft Azure, which represents a single critical vendor relationship with no disclosed
              multi-cloud fallback; and (2) customer concentration in the top-tier SNF chain enterprise segment, where
              the loss of a few large accounts could have disproportionate revenue impact.

              Financial risks center on the PE ownership structure and IPO execution. Hellman & Friedman (minority
              investor since 2021) and JMI Equity together hold significant equity stakes. As PE investment cycles
              mature, there will be increasing pressure to achieve a liquidity event, either through IPO or strategic
              sale. The confidential S-1 filing indicates IPO preparation is underway, but market conditions (healthcare
              tech multiples, interest rate environment), SEC review timelines, and investor appetite create material
              execution uncertainty.

              If the IPO is delayed or withdrawn, PE investors may pursue alternative liquidity options (secondary
              sales, PE recap, or strategic M&A) that could introduce management disruption, valuation downside, or
              strategic direction changes. Any large M&A transaction with a strategic acquirer (Epic, Oracle, Microsoft)
              could fundamentally change PointClickCare's competitive positioning.

              Revenue model risk: PointClickCare's subscription revenue is tied to facility operational status. SNF
              closures (driven by staffing shortages, low Medicare reimbursement, or operator financial distress) reduce
              the active facility count. The U.S. SNF market is consolidating, with smaller independent facilities
              closing at higher rates. While PCC's per-facility revenue may increase through upsell, the total
              addressable facility count is declining modestly.
            claimRefs:
