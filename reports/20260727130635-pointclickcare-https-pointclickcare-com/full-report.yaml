      - number: '2.3'
        title: Market Segments and Buyer Map
        blocks:
          - type: paragraph
            body: >
              PointClickCare's primary market segments by end-user type are: (1) Skilled Nursing Facilities (SNFs) — the
              core segment, serving ~16,850–18,400 certified U.S. facilities; (2) Assisted Living and Senior Living
              communities — approximately 28,900 licensed U.S. facilities; (3) Home Health Agencies — ~11,600
              Medicare-certified agencies; (4) Hospitals and Health Systems — as buyers of care-coordination tools for
              post-acute discharge management; (5) Managed Care Organizations / Medicare Advantage Plans — as analytics
              and network partners; and (6) Life Sciences companies — as buyers of real-world evidence data derived from
              PointClickCare's clinical network.

              The buyer and user within most facilities differ. The economic buyer (budget owner) is typically the
              facility's Administrator, CFO, or Chief Nursing Officer (CNO) — or at chain level, the VP of IT or Chief
              Information Officer (CIO) of a multi-facility operator. The end-user is bedside clinical staff (nurses,
              CNAs) who interact with the EHR daily. The payer (for the EHR subscription cost) is the facility operator,
              while the payer for underlying care services is primarily Medicaid (~63% of SNF residents) and Medicare
              (~20–25%).

              Adoption triggers include: regulatory requirements for Medicare/Medicaid participation (requiring
              certified EHR systems); value-based care contract requirements from managed care plans; State survey and
              inspection readiness mandates; and staffing mandates (Minimum Staffing Final Rule, 2024) that increase
              workflow automation demand. Budget cycle is annual with multi-year software contracts typical (3–5 years).
              High switching costs once installed create very sticky revenue with implied high NRR.
