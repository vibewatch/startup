      - number: '5.5'
        title: Trust, Security, Compliance, and Quality
        blocks:
          - type: paragraph
            body: >
              PointClickCare maintains a comprehensive compliance and trust posture required for healthcare SaaS: (1)
              ONC Health IT Certification — required for Medicare/Medicaid reimbursement; ensures compliance with 21st
              Century Cures Act interoperability requirements including FHIR R4; (2) HITRUST CSF Certification —
              industry gold standard for healthcare security, validating controls across HIPAA, NIST, and ISO
              frameworks; (3) SOC 2 Type II Audit — annual independent verification of security, availability, and
              confidentiality controls; (4) HIPAA compliance — full Privacy, Security, and Breach Notification Rule
              compliance for all PHI handling; and (5) CMS Quality Reporting integration — MDS (Minimum Data Set)
              submission, PDPM calculations, and state regulatory reporting.

              The security architecture uses layered controls: Azure infrastructure security, application- layer WAF and
              API security, identity and access management (IAM/SSO), mobile device management, and role-based access
              down to individual chart entries. The company's Trust Center provides customers with compliance
              documentation, security questionnaire responses, and audit reports on-demand for vendor onboarding.

              A residual compliance risk is the Real Time Medical Systems court ruling in 2025, which found
              PointClickCare's data-access restrictions likely violated the 21st Century Cures Act information-blocking
              provisions. This ruling requires PointClickCare to revise certain API access policies, with potential
              implications for the open availability of its data network to third-party analytics vendors. The company
              is managing compliance with the ruling while maintaining platform security.
