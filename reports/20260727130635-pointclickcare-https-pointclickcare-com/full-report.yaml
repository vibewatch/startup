            body: >
              PointClickCare's publicly available operational metrics include: 30,000+ provider organizations, 150M+
              patient lives in its data network, 2,700+ hospital connections, 375+ marketplace partners, and a 7th
              consecutive KLAS #1 ranking. Revenue per employee (~$200K CAD/year) and the 69% three-year revenue growth
