      - number: '5.3'
        title: AI Differentiation and the Advisor Suite
        blocks:
          - type: paragraph
            body: >
              PointClickCare launched the Advisor Suite in June 2026, an AI-native workflow automation product line
              embedded directly in the EHR. The three initial products are: (1) Referral Advisor — AI-powered intake
              automation that extracts clinical, financial, and regulatory data from referral documents (often 70+ pages
              per patient), prioritizes referral queues, and surfaces capacity-aware bed management; (2) Chart Advisor —
              AI documentation assistance that reduces clinician manual note entry and generates MDS-compliant clinical
              summaries; and (3) Billing Advisor — AI-powered revenue cycle automation that flags billing anomalies,
              optimizes claims, and surfaces underbilling alerts.

              The strategic importance of the Advisor Suite is twofold: (1) it differentiates PointClickCare from
              competitors who lack comparable LTPAC-trained AI products at GA stage; and (2) it creates a high-value
              upsell path from core EHR customers to AI modules, potentially increasing ARPU by $50–$150/month per
              facility. The Advisor Suite was also recognized as the Best EHR Solution at the 2026 MedTech Breakthrough
              Awards, validating the AI product strategy.

              PointClickCare also launched a Next-Generation EHR for Practice Groups in 2026, targeting the practitioner
              workflow (physicians, PAs, NPs visiting SNFs) with bi-directional data exchange, AI-driven clinical
              certainty tools, and a mobile-first interface. This addresses a historically underserved user segment
              (SNF-visiting practitioners) and expands the addressable user base within existing customer facilities.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
              - CE017
