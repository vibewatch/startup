      - number: '3.4'
        title: Epic, Meditech, and Acute-Care Incumbent Threats
        blocks:
          - type: paragraph
            body: >
              Epic Systems Corporation (private, ~$50B estimated value) and Oracle Cerner (post-Oracle acquisition)
              represent potential market entrants from the acute-care EHR space into post-acute settings. Epic's
              EpicCare platform serves ~60% of U.S. hospitals by beds and is increasingly deployed in hospital-owned
              SNFs and post-acute units as health systems vertically integrate. Epic's primary competitive advantage
              over PointClickCare is its seamless data continuity for patients transitioning from an Epic-based hospital
              into an Epic-managed SNF.

              However, Epic's weakness in standalone LTPAC settings is well-documented: Epic was designed for acute-care
              workflows (physician orders, complex clinical documentation) and lacks the deep MDS assessment automation,
              SNF-specific billing, and Medicare/Medicaid compliance workflows that purpose-built LTPAC vendors provide.
              PointClickCare's purpose- built platform and domain expertise create a durable advantage vs. Epic in the
              majority of standalone SNF and LTPAC settings.

              MEDITECH Expanse is present in some hospital-affiliated post-acute settings but has minimal standalone
              LTPAC presence. The primary risk scenario is that as health systems acquire or partner with SNF chains,
              they may mandate Epic or Oracle Cerner as the EHR standard, displacing PointClickCare through a top-down
              health system decision rather than a facility-level competitive win. This risk is medium-term (2027+) and
              concentrated in health-system-owned SNF chains.
            claimRefs:
              - CP019
              - CP020
              - CP021
              - CP022
              - CP023
      - number: '3.5'
        title: Competitive Position Assessment and Adverse Signals
        blocks:
          - type: paragraph
            body: >
              PointClickCare maintains a defensible competitive moat in 2026, supported by the structural stickiness of
              EHR platform adoption in regulated healthcare settings. The company's dominant SNF market share, KLAS
              leadership, and breadth of platform features give it a strong competitive position in its core market.

              However, several adverse competitive signals require monitoring: (1) The Real Time Medical Systems v.
              PointClickCare court ruling in 2025 erodes one of PointClickCare's moat dimensions—the ability to restrict
              data access for third-party analytics vendors. This opens the door for competitors like Real Time Medical
              and other analytics providers to access PointClickCare's data network and offer competing analytics
              products. (2) MatrixCare's ResMed backing provides long-term capital to sustain competitive investment.
              (3) Epic's continued post-acute expansion, though early-stage, must be monitored as health system
              consolidation accelerates. (4) User reviews in 2026 cite the recent UI update negatively, suggesting
              potential near-term churn risk if usability deteriorates. (5) New AI-native startups (smaller,
              well-funded) targeting SNF workflow automation represent a potential disruptive threat that bypasses the
              installed EHR base with point solutions.
