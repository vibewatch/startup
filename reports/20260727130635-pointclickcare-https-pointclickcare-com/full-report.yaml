      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Dominant SNF Market Share Creates Deep Moat
            body: >
              Serving 60–80% of U.S. skilled nursing facilities with a deeply embedded SaaS platform creates exceptional
              switching costs. Long onboarding cycles, regulatory compliance workflows, and staff training dependencies
              make displacing PointClickCare from an established facility extremely difficult, supporting high NRR and
              predictable subscription revenue.
            calloutType: strength
            claimRefs:
              - CO022
              - CO024
              - CO025
          - type: callout
            title: Information-Blocking Litigation Sets Adverse Legal Precedent
            body: >
              The 2025 4th Circuit ruling in Real Time Medical Systems v. PointClickCare found the company likely
              violated the 21st Century Cures Act's information-blocking provisions. This adverse ruling exposes the
              company to further regulatory scrutiny, potential fines up to $1M per violation, and challenges its
              ability to use data-access controls as a competitive moat—a risk that must be weighed in any IPO
              valuation.
            calloutType: risk
            claimRefs:
              - CO033
              - CO034
          - type: callout
            title: Obtain Audited Financials Before IPO Valuation
            body: >
              Revenue estimates range from $480M to $673M across sources, and gross margin, NRR, and ARR composition are
              not publicly disclosed. Any serious diligence or IPO participation requires access to audited GAAP
              financials, recurring vs. services revenue split, and customer concentration data. The confidential S-1
              filing makes this accessible to registered investors in the IPO process.
            calloutType: recommendation
            claimRefs:
              - CO026
              - CO027
          - type: callout
            title: Dual CFO Appointments Signal Accelerated IPO Readiness
            body: >
              The appointment of Brian Gannon (December 2024) followed quickly by Nicolette Turner (May 2025) as CFO,
              combined with board additions like Taylor Rhodes (May 2026), suggests active and accelerating preparation
              for a public market event. The pace of executive appointments at the C-suite and board level is consistent
              with a 12–18 month IPO horizon from mid-2026.
            calloutType: insight
            claimRefs:
              - CO010
              - CO011
              - CO014
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Boundaries
        blocks:
          - type: paragraph
            body: >
              PointClickCare operates primarily within the long-term and post-acute care (LTPAC) software market—a
              segment defined by technology solutions serving skilled nursing facilities (SNFs), assisted living
              communities, home health agencies, senior living operators, inpatient rehabilitation facilities, and
              hospice providers. The market boundary is distinguished from acute-care EHR (dominated by Epic and Oracle
              Cerner) by the specialized regulatory, reimbursement, and care-documentation requirements of post-acute
              settings.

              The LTPAC EHR sub-segment is PointClickCare's core market. Beyond the EHR, the company's acquisitions of
              Collective Medical and Audacious Inquiry have expanded its boundary to include: (1) care-transitions and
              care-coordination technology spanning acute-to-post-acute hand-offs; (2) health information exchange (HIE)
              and government data-sharing platforms; and (3) payer analytics and value-based care contract management
              tools. These adjacencies are faster-growing and higher-margin than the core EHR, and represent
              PointClickCare's long-term expansion thesis.

              The relevant buyer universe includes approximately 16,850–18,400 SNFs in the United States, 15,000+
              nursing homes, 28,900+ assisted living facilities, and thousands of home health agencies and hospice
              providers. In Canada, PointClickCare has meaningful market presence as well, serving provincial health
              authorities and long-term care homes. The combined North American provider population eligible for
              PointClickCare's platform is estimated at 50,000+ organizations, of which the company currently serves
              ~30,000.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and SOM'
        blocks:
          - type: paragraph
            body: >
              Multiple market research sources provide estimates for the global LTPAC software market in 2026. Grand
              View Research estimates the global long-term care software market at approximately $6.1 billion in 2026
              and forecasts growth to over $9 billion by 2032 at an 11.1% CAGR. Research Nester estimates the global
              LTPAC software market at $3.17–6.53 billion for 2026 depending on scope definition. Credence Research
              estimates the LTPAC software market at approximately $6 billion with similar growth rates. Despite
              variation in methodology, the consensus 2026 global TAM is in the $3–7 billion range.

              North America accounts for approximately 37–50% of the global market, implying a North American TAM of
              $1.5–3.3 billion for all LTPAC software in 2026. PointClickCare's Serviceable Addressable Market (SAM) is
              the subset focused on SNF/LTC EHR plus care-coordination software in North America, estimated at $2–3
              billion based on market size and PointClickCare's estimated 60–80% SNF market share implying per-facility
              ARPU of ~$40,000–60,000 per year.

              PointClickCare's Serviceable Obtainable Market (SOM) as a function of revenue at ~$480–500M suggests
              approximately 20–25% of the North American SAM is already captured. Expansion paths to new sub-segments
              (payer analytics, home health, Canada expansion, life sciences real-world data) represent the incremental
              addressable market opportunity. The total broader healthcare data and analytics market adds hundreds of
              billions in TAM, but PointClickCare's near-term capture is limited to the LTPAC-specific segments.
            claimRefs:
