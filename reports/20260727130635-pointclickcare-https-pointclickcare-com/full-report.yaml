companyProfile:
  summary: >
    PointClickCare is the leading North American cloud-based electronic health record (EHR) and care coordination
    platform for long-term and post-acute care (LTPAC) providers. Founded in 2000 by brothers Dave Wessinger (CEO) and
    Mike Wessinger (Executive Chairman) in Mississauga, Ontario, Canada, the platform serves 30,000+ provider
    organizations across skilled nursing facilities, assisted living, continuing care retirement communities, and home
    health agencies. The company's data network encompasses 150M+ patient records and 375+ marketplace partner
    integrations, creating a cross-continuum HIE platform. PointClickCare holds ~60–80% of the U.S. SNF EHR market, has
    won KLAS Best in KLAS for SNF/LTC seven consecutive years, and is in active IPO preparation with a confidential S-1
    reportedly filed in 2024-2025.
