            body: >
              PointClickCare's primary expansion motion is module upsell within the installed base: customers who adopt
              only the core EHR are cross-sold care coordination analytics (Collective Medical, Audacious Inquiry), the
              Advisor Suite AI products, and payer/VBC analytics modules. Given that 90%+ of PointClickCare's revenue is
