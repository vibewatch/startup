      - number: '7.2'
        title: Cybersecurity and Data Security Risk
        blocks:
          - type: paragraph
            body: >
              PointClickCare experienced a material cybersecurity incident in July 2024 in which compromised credentials
              were used to access patient data across the EHR platform, exposing sensitive information including patient
              names, Social Security numbers, Medicare/Medicaid IDs, dates of birth, medical records, and health
              insurance information across multiple long-term care facility customers. The breach triggered HIPAA breach
              notification requirements for affected customers and created regulatory, reputational, and potential
              class-action legal exposure.

              Healthcare data breaches are at an all-time high in 2025-2026: the average cost of a healthcare data
              breach is $7.42 million, and ransomware attacks on healthcare SaaS vendors are increasing in frequency and
              severity. PointClickCare's operational footprint — 150M+ patient records, integration with 9,000+
              facilities' clinical workflows, Azure cloud infrastructure — makes it a high-value target. A successful
              ransomware attack could disrupt billing operations across thousands of facilities, with cascading CMS
              reimbursement impacts.

              PointClickCare holds HITRUST CSF Certification and SOC 2 Type II audit status, which represent credible
              security frameworks. However, these certifications are process-level assurances, not guarantees against
              breach. The 2024 incident demonstrates that technical defenses were insufficient to prevent
              credential-based access. Pre-IPO, the SEC's new cybersecurity disclosure rules require detailed disclosure
              of material incidents and ongoing risk posture, adding a disclosure obligation risk layer.

              Given the mission-critical nature of the platform (24/7 clinical documentation for Medicare-participating
              facilities), even a short outage during billing cycles has disproportionate impact. Business continuity
              and disaster recovery infrastructure must be tested and certified before IPO.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
