      - number: '8.5'
        title: Recommendation, Confidence, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >
              Recommendation: research-more. The investment thesis is commercially compelling — PointClickCare is the
              dominant platform in a large, compliance-driven, growing market with strong retention characteristics and
              an active AI product strategy. However, the current $5B secondary market pricing implies approximately 10x
              EV/Revenue at the lower revenue baseline, which is above the healthcare SaaS median and is not yet
              justified by confirmed financial metrics.

              The five blocking diligence items that must be resolved before a buy commitment: (1) Revenue baseline
              confirmation — reconcile $480M CAD vs. $673M USD through CFO-level financial disclosure in formal
              diligence; (2) NRR and churn data — net revenue retention, gross churn, and cohort tables from the finance
              team's management reporting; (3) Information-blocking litigation resolution — OIG correspondence,
              litigation status, and counsel's penalty exposure estimate; (4) Cybersecurity forensic report and
              remediation status from the July 2024 breach; (5) CEO and CFO employment agreements, succession plans, and
              equity vesting schedules.

              If all five items resolve favorably (revenue ~$650M+, NRR 110%+, OIG no action, breach remediated,
              leadership stable), the thesis moves to buy at $5B ($3.5–4B would represent attractive entry). If revenue
              is confirmed at $480M CAD and OIG enforcement is active, the $5B valuation is materially stretched and a
              20–30% discount would be warranted.

              Confidence: medium. The structural case for PointClickCare is clear, but financial metric uncertainty and
              pending litigation reduce conviction from the available evidence base. Risk rating: high (multiple
              simultaneous risks require resolution). Valuation stance: stretched at $5B secondary; fair at $3.5–4B.
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Research-More: Compelling Business, Unresolved Financial Metrics'
            body: >
              PointClickCare has the structural attributes of a buy-grade business: dominant market position, regulatory
              moat, data network, improving AI product portfolio, and IPO readiness. The research-more call reflects not
              business weakness but evidence gaps — unconfirmed revenue baseline, undisclosed NRR/churn, pending
              information-blocking litigation, and cybersecurity forensic disclosure. If formal diligence confirms: (1)
              revenue ~$600M+ USD, (2) NRR 110%+, (3) OIG no-action or limited penalty, and (4) breach fully remediated
              — the recommendation upgrades to buy at $4–5B. At $5B without these confirmations, it is priced to
              near-perfection.
            calloutType: recommendation
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV027
          - type: callout
            title: Revenue Baseline Conflict Makes Multiple Calculation Unreliable
            body: >
              The unresolved $480M CAD (Globe and Mail) vs. $673M USD (company brief) revenue discrepancy creates a
              20–30% valuation uncertainty. At $5B, this is the difference between a stretched 10.4x and a reasonable
              7.4x EV/Revenue multiple. This is the highest-priority blocking diligence ask — without revenue baseline
              confirmation, the valuation stance cannot be confirmed.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV025
          - type: callout
            title: Data Network Moat Is Both the Strongest Asset and the Most at-Risk
            body: >
              PointClickCare's 150M+ patient record network is simultaneously the company's most valuable asset (creates
              compounding analytics value and switching costs) and the most legally at-risk (information-blocking ruling
              threatens the data-access exclusivity that makes the network defensible). How PointClickCare navigates
              post-ruling compliance — whether it strengthens the moat through open APIs and TEFCA participation or
              loses data advantage to third-party analytics — will be the single most important determinant of the 3–5
              year value trajectory.
            calloutType: insight
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV029
          - type: callout
            title: NRR of 110-115% Assumed for Base Case — Confirmation Required
            body: >
              The base case valuation and research-more recommendation assume NRR of 110–115%, which is consistent with
              structural switching cost analysis and enterprise healthcare SaaS benchmarks. If formal diligence reveals
              NRR below 100% (implying contraction within the installed base), the business case changes fundamentally
              and the recommendation would shift to track or pass. NRR disclosure is a non-negotiable first-page
              diligence ask.
            calloutType: assumption
            claimRefs:
              - CV003
              - CV016
              - CV028
