      - number: '6.3'
        title: Retention, Renewal, and Customer Satisfaction
        blocks:
          - type: paragraph
            body: >
              PointClickCare's customer retention is structurally reinforced by three mechanisms: (1) deep EHR workflow
              integration — MDS assessment automation, CMS reporting, state regulatory reporting, and billing are deeply
              embedded in daily operations making replacement extremely disruptive; (2) 3–5 year contract structures for
              enterprise accounts that lock in revenue and set high switching cost barriers; and (3) regulatory
              compliance dependency — operators cannot operate without an ONC-certified EHR for Medicare/Medicaid
              participation, creating a platform floor for retention.

              Third-party review sources and industry commentary estimate PointClickCare's annual churn at less than 5%
              of customer facilities, consistent with enterprise healthcare SaaS norms. KLAS scored PointClickCare at
              84.0 for SNF/LTC and 83.4 for Senior Living in 2026 (KLAS scores above 80 are considered Best in Class).
              G2 users rate the Skilled Nursing Platform at 4.3/5 across 46 reviews as of 2026.

              NRR (net revenue retention) is not publicly disclosed. Based on the enterprise healthcare SaaS benchmark
              range of 110–120% and PointClickCare's active upsell motion (analytics, AI Advisor Suite, payer modules),
              a 110–120% NRR estimate is plausible. However, the recent UI update has received mixed user reviews, with
              some productivity complaints — suggesting a short-term retention risk if usability issues are not
              resolved.

              An adverse signal: negative reviews from some customers in 2026 specifically citing the UI update
              experience as disruptive. While this does not appear to have caused significant churn, it may affect
              renewal rates for smaller, less embedded accounts.
