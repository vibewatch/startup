  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Architecture and Module Overview
        blocks:
          - type: paragraph
            body: >
              PointClickCare's platform is organized into five product pillars: (1) Clinical Management (EHR core: MDS
              assessments, care plans, eMAR, progress notes, vital tracking, medication management); (2) Financial &
              Revenue Cycle Management (billing, claims, eligibility verification, RCM automation); (3) Care
              Coordination & Interoperability (Collective Medical ADT feeds, Audacious Inquiry HIE connections, FHIR/HL7
              APIs, 400+ marketplace partners); (4) Analytics & Insights (operational dashboards, clinical quality
              metrics, PDPM and value-based care analytics, regulatory reporting); and (5) AI & Automation (Advisor
              Suite: Referral Advisor, Chart Advisor, Billing Advisor; Ambient Scribe; AI-generated clinical summaries).

              The platform also includes workforce management modules (staff scheduling, Apploi-powered
              recruiting/onboarding), telehealth integration, infection prevention, wound care, and family
              engagement/communication modules. The modular architecture allows operators to adopt only the modules
              needed while maintaining a unified patient record across all deployed modules. The 400+ marketplace
              partner integrations span pharmacy, lab, RPM, telehealth, staffing, analytics, and payment vendors, making
              PointClickCare's ecosystem the broadest in the LTPAC market.

              In 2026, PointClickCare launched its Advisor Suite — a native AI product layer embedding AI-powered
              automation directly into high-friction clinical and financial workflows including admissions (Referral
              Advisor), clinical documentation (Chart Advisor), and revenue cycle management (Billing Advisor). This
              launch represents a significant maturation of the AI product strategy beyond pilot features to a generally
              available AI product line.
