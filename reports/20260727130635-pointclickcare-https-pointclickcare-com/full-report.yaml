      - number: '4.5'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >
              PointClickCare has raised approximately $283M in disclosed equity rounds: $50M from JMI Equity (2011),
              $1.88M (2016), $85M from Dragoneer/JMI (2017), and $146M from Dragoneer (2018). The 2021 Hellman &
              Friedman investment was a secondary transaction (H&F purchasing existing shares from founders/early
              investors) rather than a primary capital raise, meaning no new cash was injected into the company's
              balance sheet at that time. The company thus relies on its own operating cash flow and any credit
              facilities for operational capital.

              The $650M Collective Medical acquisition (2020) and the $250M–$400M Audacious Inquiry acquisition (2022)
              required significant capital. These were funded through a combination of operating cash, potential credit
              facility drawdowns, and possibly secondary transactions. Given that the H&F secondary was in January 2021
              (between the two acquisitions), it is possible that H&F provided debt or credit facility support as part
              of the overall transaction structure.

              Capital adequacy appears adequate given the recurring revenue model (~90%+ SaaS), high gross margins
              (70–75%), and strong customer retention. The IPO trajectory (confidential S-1 filed) suggests management
              and investors view public market access as the next capital event. However, an outstanding
              information-blocking court ruling and market timing risks create potential delays. No publicly disclosed
              debt maturity schedule or covenant concerns have been identified, but this data is unavailable for private
              companies.
