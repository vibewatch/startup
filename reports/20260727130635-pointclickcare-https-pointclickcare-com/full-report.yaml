chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Business Model
        blocks:
          - type: paragraph
            body: >
              PointClickCare Technologies Inc. is a privately held healthcare technology company headquartered at 5570
              Explorer Drive, Mississauga, Ontario, Canada L4W 0C4, with significant U.S. operations based in
              Bloomington, Minnesota. Founded in 2000 by brothers Dave Wessinger and Mike Wessinger, the company
              operates a purpose-built, cloud-native SaaS platform serving the long-term and post-acute care (LTPAC)
              continuum. Its primary product is an ONC-certified Electronic Health Record (EHR) tailored for skilled
              nursing facilities (SNFs), assisted living communities, home health agencies, senior living operators, and
              increasingly, payers and acute-care systems.

              The company's business model is subscription-based SaaS, with per-facility or per-user annual recurring
              licenses bundled with implementation, training, and support services. Revenue is highly recurring given
              deep workflow integration and high switching costs in the regulated healthcare environment. PointClickCare
              has expanded its addressable market through two major acquisitions—Collective Medical (December 2020,
              ~$650M) and Audacious Inquiry (March 2022, ~$250M)—that extended its reach into care transitions across
              acute, ambulatory, and payer networks. The combined network now includes 2,700+ hospitals, 2,000+
              ambulatory sites, 180+ health plans, and 75+ state/government agencies, touching an estimated 150 million
              patient lives annually in the United States.

              As of mid-2026, PointClickCare describes itself as the largest senior-care data network in North America
              and has been named Best in KLAS for Skilled Nursing Facilities/Long-Term Care for the seventh consecutive
              year in 2026. The company's stage is late-stage private with an indicated IPO trajectory, having filed a
              confidential S-1 with the SEC.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              PointClickCare was co-founded by Dave Wessinger and Mike Wessinger. Dave Wessinger serves as Chief
              Executive Officer, having transitioned into the CEO role as the company scaled from a clinical
              documentation startup to a dominant LTPAC platform. Mike Wessinger serves as Executive Chair of the Board,
              having previously held the CEO role. Both founders remain actively involved in company strategy and
              governance, giving the company a founder-led culture that investors often view favorably given the
              founders' deep domain expertise in senior care technology.

              The current executive leadership team includes: Nicolette Turner as Chief Financial Officer (appointed May
              2025, replacing Brian Gannon who was appointed December 2024); David Pessis as Chief Product and
              Technology Officer; and Annie McBride as Chief Marketing Officer. Brian Drozdowicz serves as Chief Revenue
              Officer. In May 2026, the Board appointed Taylor Rhodes—a three-time CEO with extensive technology
              experience including as CEO of Applied Systems and former CEO of Rackspace—as a new independent director.
              Betsy Atkins concluded her six-year board tenure around the same time.

              The rapid succession of CFOs (Gannon in December 2024, Turner in May 2025) reflects active preparation for
              a potential public market event. PE sponsor Hellman & Friedman (H&F) holds board representation, and JMI
              Equity retains a minority position. Key-person dependence is moderate: the Wessinger brothers are the
              symbolic and strategic anchors, but the professional management team is maturing with experienced
              enterprise-software executives, reducing single point-of-failure risk. No adverse governance events (e.g.,
              founder removal, board disputes) have been publicly reported as of 2026.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
      - number: '1.3'
        title: Funding History, Valuation, and Investors
        blocks:
          - type: paragraph
            body: >
              PointClickCare has raised an estimated $230–$283 million in external equity funding across multiple rounds
              since at least 2011, with private equity firm Hellman & Friedman leading a major growth investment in
              2021. Notably, the 2021 H&F transaction was structured primarily as a secondary—H&F and JMI Equity
              acquired stakes from early investors and employees rather than injecting primary capital into the
              company's balance sheet. This structure implies the company had sufficient internal cash generation to
              fund operations without needing significant primary dilution.

              Post the 2021 H&F transaction, PointClickCare's implied valuation was cited at approximately $4 billion.
              Secondary-market data from Forge Global indicates a more recent valuation of over $5 billion. Given
              estimated 2026 annual revenue of ~$480–500 million, the implied EV/Revenue multiple is approximately
              8–10x, which is in line with the public healthcare SaaS sector median of ~9.5x but below premium
              clinical-software multiples of 11–14x.

              The company filed a confidential S-1 with the SEC, indicating preparation for a potential Initial Public
              Offering. No confirmed public offering date has been announced as of July 2026. The appointment of
              experienced SaaS-company CFOs and board directors with public-company experience is consistent with IPO
              readiness preparations. Total capital raised does not include the acquisition consideration paid for
              Collective Medical (~$650M) and Audacious Inquiry (~$250M), which would have required substantial debt or
              balance-sheet cash.
            claimRefs:
              - CO016
              - CO017
              - CO018
              - CO019
              - CO020
              - CO021
      - number: '1.4'
        title: Cover Metrics and Scale
        blocks:
          - type: paragraph
            body: >
              PointClickCare's key cover metrics as of mid-2026 are as follows. The company serves more than 30,000
              provider organizations, including approximately 80% of U.S. skilled nursing facilities (per company
              claims) or approximately 60% per independent analyst estimates—both figures represent dominant market
              leadership in the LTPAC EHR segment. Revenue is estimated at approximately $480–500 million annually; the
              company has not published audited financials as a private company. In its press release from the
              background briefing, revenue was cited at $673M in 2024, but this figure has not been publicly confirmed
              through audited filings.

              Headcount is approximately 2,300 employees, primarily located in Mississauga, Ontario and Bloomington,
              Minnesota, with additional offices and remote workers across North America. The company operates entirely
              within the North American market. The network also includes over 375 integrated technology partners on its
              marketplace, representing a significant ecosystem moat.

              Key metrics with explicit confidence gaps: exact ARR and Net Revenue Retention (NRR) are not disclosed
              publicly; gross margin is not publicly reported (industry comps for clinical SaaS suggest 65–75%); total
              acquisition consideration for Collective Medical and Audacious Inquiry was partially funded by debt that
              has not been quantified publicly. Valuation of ~$4B is based on the 2021 H&F secondary transaction;
              secondary markets show ~$5B, but neither figure reflects a current arms-length primary raise.
            claimRefs:
