  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation
        blocks:
          - type: paragraph
            body: >
              PointClickCare's customer base is segmented into four primary buyer types: (1) Large multi-site SNF chains
              (50+ facilities) — enterprise accounts representing the highest revenue concentration; nine of the ten
              largest U.S. SNF chains are PointClickCare customers. (2) Mid-market SNF operators (10–50 facilities) —
              the largest segment by count, typically buying the core EHR with billing and analytics modules. (3) Small
              independent SNFs and assisted living facilities (<10 facilities) — the broadest segment by facility count,
              buying primarily the core EHR at lower pricing tiers. (4) Home health and hospice agencies — a growing but
              historically under-penetrated segment where MatrixCare leads.

              Geographically, PointClickCare's customer base is predominantly U.S.-based (~85–90% of revenue) with a
              meaningful Canadian presence (home market, founded in Mississauga, Ontario). The platform does not appear
              to have significant international presence outside North America as of 2026. The primary use cases driving
              adoption are: (1) Medicare/Medicaid regulatory compliance (MDS, PDPM), making EHR adoption mandatory; (2)
              billing automation and revenue cycle management; (3) care coordination and care transition management
              across acute and post-acute settings; and (4) AI-powered workflow automation (emerging, Advisor Suite
              2026).

              The revenue composition by segment is not publicly disclosed, but the concentration in large enterprise
              chains (9 of top 10) implies meaningful revenue concentration in the top tier of accounts. The company's
              Forrester Total Economic Impact study found that SNF customers average $1.3M in benefits over three years
              from the platform.
