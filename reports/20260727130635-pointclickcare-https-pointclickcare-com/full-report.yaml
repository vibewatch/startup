      - number: '3.3'
        title: Netsmart, WellSky, and Other Direct Competitors
        blocks:
          - type: paragraph
            body: >
              Netsmart Technologies (backed by Centerbridge Partners private equity) is the third major LTPAC EHR
              vendor, with particular strength in behavioral health, LTACH, and multi-setting post-acute organizations.
              Netsmart's myUnity platform supports integrated EHR and care management across multiple care settings
              (SNF, home health, hospice, behavioral health) with a focus on clinical workflow extensibility and
              compliance. Netsmart serves tens of thousands of providers across its combined portfolio, with its
              LTPAC-focused brands including myUnity Care Management and NetSolutions.

              WellSky (also private equity-backed by TPG) has emerged as a significant competitor in home health and
              home care software, with a platform addressing the growing shift toward home-based and community care.
              WellSky's acquisition of Careficient and other home-health vendors gives it a competitive position in the
              home health segment where PointClickCare has historically been less dominant.

              American HealthTech (part of netsmart ecosystem) targets cost-conscious mid-size SNF operators. AxisCare,
              ranked Best in KLAS for Personal Care in 2026, addresses the personal care and home care adjacency.
              Smaller niche competitors include HealthMEDX (part of MatrixCare), PointCare, and various regional
              vendors. The market is gradually consolidating as PE-backed platforms roll up smaller regional vendors.
