            title: Information-Blocking Ruling Erodes Data-Access Moat
            body: >
              The 2025 Real Time Medical Systems court ruling forces PointClickCare to allow third-party analytics
              vendors access to its data network. This is a meaningful competitive vulnerability: PointClickCare's data
              breadth was a structural advantage against analytics competitors. If that access must now be shared
              broadly, competing analytics products can potentially offer comparable insights without requiring the full
              EHR platform, weakening the upsell and retention argument.
