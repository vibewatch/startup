      - number: '8.3'
        title: Bull / Base / Bear Scenarios
        blocks:
          - type: paragraph
            body: >
              Bull case ($6.5–8B valuation, 12–15x EV/Revenue): Assumes confirmation of $600–700M+ USD revenue baseline,
              NRR of 115–120%, successful IPO in Q3–Q4 2026 at healthcare SaaS premium multiples, resolution of
              information-blocking litigation without OIG penalties, and Advisor Suite AI product gaining traction with
              20%+ penetration of installed base by 2027. In this scenario, PCC trades as a premium vertical SaaS
              platform comparable to Veeva at its growth peak, with the data network creating defensible compounding
              value.

              Base case ($3.5–5B valuation, 7–10x EV/Revenue): Assumes revenue in the $480–550M range, NRR of 105–115%,
              IPO executed in 2026–2027 at median healthcare SaaS multiples, information-blocking litigation settled
              with limited penalty, and Advisor Suite gaining moderate traction. This is the most probable scenario
              given available evidence and represents the current secondary market pricing range.

              Bear case ($2–3.5B valuation, 4–7x EV/Revenue): Assumes revenue closer to $480M CAD baseline, OIG
              enforcement action with material penalties, IPO delay or withdrawal, NRR below 105%, competitive pressure
              from Epic and MatrixCare accelerating market share erosion, and AI product launch complications. In this
              scenario, PCC trades as a mature, slower-growth healthcare IT platform without premium multiple support.

              Probability signals: The base case is best supported by current evidence. The bull case requires
              confirmation of the higher revenue baseline and litigation resolution. The bear case requires
              materialization of multiple adverse events simultaneously — low probability but not negligible given the
              information-blocking exposure.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
          - type: table
            tableRef: TV003
            claimRefs:
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exit Readiness and IPO Path
        blocks:
          - type: paragraph
            body: >
              PointClickCare's IPO readiness markers as of July 2026: (1) Confidential S-1 filed with SEC (reported
              2024-2025); (2) CFO appointment (Nicolette Turner, May 2025) signals financial organization for public
              company disclosure requirements; (3) Board independence improved with Taylor Rhodes addition in May 2026;
              (4) Seven consecutive KLAS Best in KLAS wins provide strong institutional marketing narrative; (5) HITRUST
              + SOC 2 Type II provide cybersecurity compliance credentials for institutional investor diligence.

              Readiness gaps: (1) CFO tenure is short (14 months by IPO if executed mid-2026) — investor relations and
              roadshow experience may be limited; (2) The July 2024 data breach requires mandatory S-1 disclosure and
              will be a focus of IPO roadshow Q&A; (3) The information-blocking ruling creates a pending legal matter
              that must be disclosed and may concern some institutional investors with ESG governance mandates; (4)
              Revenue baseline conflict ($480M CAD vs $673M USD) must be resolved in the S-1 to provide a clean
              financial narrative.

              PE exit structure: H&F and JMI Equity will seek meaningful liquidity at IPO. The degree of primary vs.
              secondary share offering will affect post-IPO float and investor perception. A heavy secondary offering
              (founders and PE selling at IPO) creates an adverse signal about insider confidence in near-term upside. A
              mixed primary/secondary offering is preferred for market reception.

              Post-IPO trading dynamics will be influenced by healthcare tech sector sentiment, interest rate
              environment, and SaaS multiple expansion/compression. At $5B, PCC enters the public market as a mid-large
              cap healthcare IT company, likely joining the Russell 1000 and S&P healthcare index, which would support
              institutional buying.
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
