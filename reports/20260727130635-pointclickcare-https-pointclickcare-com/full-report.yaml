      - number: '4.3'
        title: Cost Structure and Margin Profile
        blocks:
          - type: paragraph
            body: >
              As a cloud SaaS business, PointClickCare's cost structure is dominated by: R&D (estimated 12–18% of
              revenue based on comparable vertical SaaS companies), sales & marketing (~20–25% of revenue), general &
              administrative (~10–15%), and cost of revenue (cloud hosting, customer support, implementation services)
              (~25–30%). These benchmarks imply an operating margin (EBITDA) in the range of 15–30%, consistent with a
              mature vertical SaaS business at scale.

              Gross margin is estimated at 70–75% by third-party analysts, reflecting the predominantly software
              subscription nature of revenue. However, the Collective Medical and Audacious Inquiry acquisitions
              introduced service-delivery and data-infrastructure costs that may have modestly diluted gross margins
              from a pure EHR-only baseline. The two acquisitions together cost an estimated $900M–$1.1B, introducing
              significant amortization of intangible assets on the balance sheet.

              PointClickCare has ~2,400 employees (per Globe and Mail 2024 data) with revenue per employee of
              approximately $200,000 CAD (~$149,000 USD), which is modest relative to pure-play SaaS peers but
              reasonable for healthcare software with significant services and support operations. R&D headcount likely
              represents 40–50% of total employees given the platform-unification strategy underway. Capital expenditure
              is relatively low for a cloud SaaS company; principal capex is cloud infrastructure and data center costs,
              likely <5% of revenue.
            claimRefs:
