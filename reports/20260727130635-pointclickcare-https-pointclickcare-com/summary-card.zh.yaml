  topStrengths:
    - 在美国 SNF EHR 市场占有率 60–80%，前十大连锁机构中九家是客户
    - 150M+ 患者记录数据网络持续加厚 HIE 和分析护城河
    - 连续七年获 KLAS Best in KLAS，验证行业领先的客户满意度
    - 结构性留存护城河：3–5 年合同、深度依赖监管合规、估计流失率 <5%
    - AI 产品线积极扩张（Advisor Suite 2026），带来 land-and-expand 可选性
    - LTPAC HIT 市场以 6–8% CAGR 增长，既有格局被颠覆的风险较低
  topRisks:
    - Real Time Medical Systems v. PointClickCare（第 4 巡回法院，2025 年 3 月）：信息封锁裁决让公司面临 OIG CMPs， 最高 $1M/violation
    - 2024 年 7 月网络安全事件：凭据导致多家机构数据被访问；医疗数据泄露平均成本 $7.42M
    - 收入基线冲突：$480M CAD vs. $673M USD——EV/Revenue 倍数存在 20–30% 不确定性
    - NRR 和流失率未公开披露：没有正式尽调，客户质量无法确认
    - IPO 准备期间六个月内两次 CFO 交接：财务执行风险
    - CEO/创始人关键人集中：Dave + Mike Wessinger 双家庭领导结构
  unresolvedGaps:
    - 收入基线确认（USD、GAAP、FY2024-2025）
    - 按年份拆分的净收入留存瀑布和 cohort 留存表
    - OIG 对信息封锁裁决的执法状态
    - 2024 年 7 月事件后的取证报告和 OCR 往来函件
    - CEO 雇佣协议和继任计划
    - 含 H&F 和 JMI 优先权条款及 IPO 配售计划的股权结构表
