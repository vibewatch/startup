  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律与监管风险
        blocks:
          - type: paragraph
            body: >
              PointClickCare 最迫近的短期风险，是 Real Time Medical Systems v. PointClickCare 诉讼带来的法律和监管敞口。2025 年 3
              月，美国第四巡回上诉法院确认，PointClickCare 使用 CAPTCHA 和技术限制阻止 Real Time Medical 访问其 EHR 数据网络，很可能构成 21st Century Cures
              Act 下的信息阻断。法院因证据不足且前后不一致，驳回了 PCC 的安全抗辩，并指出限制措施的时间点与 PCC 开发竞争性分析产品相吻合。该裁决允许 Real Time 根据 Maryland
              法继续推进不正当竞争和侵权干扰主张。

              信息阻断违规会让健康 IT 开发商和健康信息网络（PointClickCare 符合该身份）面临 HHS Office of Inspector General（OIG）最高每项违规 $1M 的民事罚款。考虑到
              PointClickCare 数据网络的广度（150M+ 患者记录、30,000+ 家提供方），潜在敞口重大。2025–2026 年监管机构也加大执法力度，ONC 和 OIG 对禁止行为给出更清晰指引。

              其他监管风险包括持续维持 ONC 认证的义务（21st Century Cures Act 要求每年更新认证）、150M+ 患者记录上的 HIPAA 合规，以及加拿大本土市场的 PIPEDA
              合规。公司还必须保持符合 CMS Conditions of Participation 要求，这些要求约束其 SNF 客户参与 Medicare/Medicaid，并通过客户不合规场景形成第二层监管敞口。
