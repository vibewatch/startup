  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争概览与市场结构
        blocks:
          - type: paragraph
            body: >
              北美 LTPAC EHR 和护理协同市场是集中型寡头市场，由三到四家专门厂商主导，PointClickCare 处于明确第一的位置。市场特征包括
              高切换成本（深度工作流集成、员工培训、监管报告集成）、多年合同（3–5 年），以及护理协同数据共享带来的强网络效应。上述结构特征 使新进入者极难替换已部署厂商，也为既有厂商构筑可防守护城河。

              PointClickCare 的核心竞争优势包括：（1）主导 SNF 市占率带来最大的护理协同数据网络；（2）Collective Medical 和 Audacious Inquiry 集成产生网络效应，连接
              2,700+ 家医院和 75+ 个政府机构；（3）ONC 认证和 KLAS 领先地位提供第三方背书；（4）375+ 个 伙伴生态构成集成护城河；（5）在 LTPAC 的 AI 驱动临床工作流上拥有先发优势。

              主要竞争威胁包括：（1）SNF/居家健康重叠场景中的 MatrixCare；（2）行为健康和专门急性后期领域的 Netsmart；（3）医院自有 SNF 和整合交付网络中的 Epic；（4）潜在新进入者用云原生
              AI 平台在价格或易用性上冲击传统厂商。2025 年针对 PointClickCare 的 信息阻断法院裁定要求公司更开放地与第三方分析厂商共享数据，部分侵蚀了其数据访问护城河。
