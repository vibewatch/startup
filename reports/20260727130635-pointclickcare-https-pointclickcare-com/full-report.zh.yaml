            body: >
              机构与 Medicare Advantage 计划和 ACO 签署价值型护理合同时，需要超出基础 EHR 功能的分析、护理转接和网络管理工具。 PointClickCare 收购 Collective
              Medical 和 Audacious Inquiry 后，已经具备捕获下一层支出的条件——单客户收入可能从基础 EHR（约 $40–60K/yr）提高到完整护理平台（约 $80–120K+/yr）。
