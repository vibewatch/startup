  - id: FR001
    title: 风险热力图
    type: matrix
    summary: |
      按发生可能性（横轴）和影响（纵轴）给 PointClickCare 的主要风险打分。右上角风险（高可能性、高影响）是尽调和监控的优先关注点。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 极高影响
          values:
            - ONC 认证丢失；Azure 重大宕机
            - 数据泄露再发生；IPO 前 CFO 离职；CMS PDPM 改革
            - 信息阻断 OIG 处罚；医疗数据泄露（行业趋势）
        - label: 高影响
          values:
            - Epic 全面进入 SNF 市场；战略出售折价
            - IPO 撤回；CEO 离任；AI 产品错误（Advisor Suite）
            - 网络安全凭证泄露（模式）；SNF 市场整合
        - label: 中等影响
          values:
            - TEFCA 合规缺口；PIPEDA 隐私暴露
            - PE 退出结构错配；人才流失
            - 监管更新延迟；UI 引发客户流失
        - label: 低影响
          values:
            - 单个客户投诉；轻微集成失败
            - 孤立的合作伙伴 API 变更
            - G2 评价口碑；轻微 CMS 账单错误
