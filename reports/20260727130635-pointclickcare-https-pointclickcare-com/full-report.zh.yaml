      - number: '2.3'
        title: 市场细分与买方地图
        blocks:
          - type: paragraph
            body: >
              按最终用户类型划分，PointClickCare 的主要市场细分包括：（1）专业护理机构（SNF）——核心细分，覆盖约 16,850–18,400 家 美国认证机构；（2）辅助生活和老年生活社区——约
              28,900 家美国持牌机构；（3）居家健康机构——约 11,600 家 Medicare 认证 机构；（4）医院和卫生系统——购买急性后期出院管理护理协同工具；（5）管理式护理组织 / Medicare
              Advantage 计划——作为分析和 网络伙伴；（6）生命科学公司——购买源自 PointClickCare 临床网络的真实世界证据数据。

              大多数机构里，买方和用户不同。经济买方（预算所有者）通常是机构管理员、CFO 或首席护理官（CNO）；在连锁层面， 则是多机构运营商的 IT 副总裁或首席信息官（CIO）。最终用户是每天使用 EHR
              的床旁临床人员（护士、CNA）。EHR 订阅成本由 机构运营商支付，而底层护理服务的支付方主要是 Medicaid（约 63% 的 SNF 住民）和 Medicare（约 20–25%）。

              采用触发因素包括：Medicare/Medicaid 参与所需的监管要求（要求认证 EHR 系统）；管理式护理计划提出的价值型护理合同要求；
              州级调查和检查准备要求；以及提高工作流自动化需求的用工规定（Minimum Staffing Final Rule，2024）。预算按年编制， 软件合同通常为多年期（3–5
              年）。系统一旦安装，切换成本很高，收入粘性强，隐含 NRR 较高。
            claimRefs:
              - CM013
              - CM014
              - CM015
