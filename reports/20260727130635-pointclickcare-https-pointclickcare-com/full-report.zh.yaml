  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与收入来源
        blocks:
          - type: paragraph
            body: >
              PointClickCare 的收入主要来自云端 EHR、护理协同、财务管理、计费和分析模块的订阅式 SaaS 费用。收入模式以按床位/月或按机构/月为主，
              具体定价按机构规模和所选模块谈判。第三方来源估计，完整平台价格为每用户每月 $300–$500；按机构估算，小型机构每月 $500–$2,000，大型 200 床以上机构每月
              $5,000–$15,000+。实施费、专业服务和培训构成较小的非经常性收入部分。

              主要收入流包括：（1）EHR 订阅（核心平台），估计占总收入约 60–65%；（2）护理协同分析（源自 Collective Medical 和 Audacious Inquiry），估计约
              20–25%；（3）支付方和财务管理模块约 10–15%；（4）专业服务/实施约 5–10%。经常性订阅部分估计占总收入 90%+， 与成熟 SaaS 商业模式一致。2021–2024 年三年收入增长
              69%，意味着年 CAGR 约 19%。

              公司收入主要以 USD（美国市场）和 CAD（加拿大运营）计价。Globe and Mail 的年度排名数据披露 2024 年收入为 $480.3M CAD（按当时汇率 约 $355–360M
              USD），基于排名申报的公开自报数据。公司背景资料引用 $673M USD，可能反映了包括 Collective Medical 和 Audacious Inquiry
              在内的更宽口径。两组数字不一致，是关键尽调缺口——经审计 GAAP 收入数字未公开。
