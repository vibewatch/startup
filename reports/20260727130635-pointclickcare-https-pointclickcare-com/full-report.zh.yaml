      - number: '5.5'
        title: 信任、安全、合规与质量
        blocks:
          - type: paragraph
            body: >
              PointClickCare 维持医疗 SaaS 所需的一整套合规与信任资质：（1）ONC Health IT Certification——Medicare/Medicaid 报销所需，确保符合 21st
              Century Cures Act 互操作要求，包括 FHIR R4；（2）HITRUST CSF Certification——医疗安全行业金标准，验证 HIPAA、NIST 和 ISO
              框架下的控制；（3）SOC 2 Type II Audit——每年由独立方验证安全、可用性和保密控制；（4）HIPAA 合规——所有 PHI 处理均符合 Privacy、Security 和 Breach
              Notification Rule；（5）CMS Quality Reporting 集成——MDS（Minimum Data Set）提交、PDPM 计算和州级监管报告。

              安全架构采用分层控制：Azure 基础设施安全、应用层 WAF 和 API 安全、身份与访问管理（IAM/SSO）、移动设备管理，以及细到单个病历条目的基于角色访问。公司的 Trust Center
              按需向客户提供合规文档、安全问卷回复和审计报告，用于供应商准入。

              剩余合规风险来自 2025 年 Real Time Medical Systems 法院裁决。法院认定 PointClickCare 的数据访问限制很可能违反 21st Century Cures Act
              信息阻断条款。该裁决要求 PointClickCare 修订部分 API 访问政策，并可能影响其数据网络向第三方分析供应商开放的程度。公司一边遵守裁决，一边维护平台安全。
