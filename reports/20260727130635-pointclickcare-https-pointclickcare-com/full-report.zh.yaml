            title: 投资前优先完成三项尽调请求
            body: >
              在作出任何投资承诺前，有三项尽调事项构成堵点：（1）取得 PCC 事件后取证报告，以及 OIG 就信息阻断裁决的往来函件；（2）核实 Dave Wessinger 的雇佣协议和继任计划；（3）确认 CFO
              Nicolette Turner 的任期稳定性和 S-1 准备状态。这三项对应本章识别出的三个最高严重度未解决风险。
