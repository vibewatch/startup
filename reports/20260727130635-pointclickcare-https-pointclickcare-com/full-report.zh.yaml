  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >
              PointClickCare 主要处在长期和急性后期护理（LTPAC）软件市场——这一细分市场由服务专业护理机构（SNF）、辅助生活社区、
              居家健康机构、老年生活运营商、住院康复机构和临终关怀服务商的技术方案构成。与由 Epic 和 Oracle Cerner 主导的急性护理 EHR
              相比，急性后期场景的监管、报销和护理文档要求更专门化，构成清晰市场边界。

              LTPAC EHR 子细分是 PointClickCare 的核心市场。EHR 之外，Collective Medical 和 Audacious Inquiry 两笔收购把公司边界
              扩展到三块相邻市场：（1）跨急性到急性后期交接的护理转接与护理协同技术；（2）健康信息交换（HIE）和政府数据共享平台； （3）支付方分析和价值型护理合同管理工具。这些相邻领域增速更快、利润率更高，构成
              PointClickCare 的长期扩张逻辑。

              买方群体包括美国约 16,850–18,400 家 SNF、15,000+ 家护理院、28,900+ 家辅助生活机构，以及数千家居家健康 机构和临终关怀服务商。加拿大市场里，PointClickCare
              也有实质存在，服务省级卫生主管部门和长期护理之家。估计北美合计有 50,000+ 家机构适配 PointClickCare 平台，其中公司目前服务约 30,000 家。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
      - number: '2.2'
        title: 市场规模：TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >
              多家市场研究机构给出了 2026 年全球 LTPAC 软件市场估计。Grand View Research 估计，2026 年全球长期护理软件市场约为 $6.1 billion，并预计到 2032 年增长至超过
              $9 billion，CAGR 为 11.1%。Research Nester 按口径不同，将 2026 年全球 LTPAC 软件市场估计为 $3.17–6.53 billion。Credence
              Research 估计 LTPAC 软件市场约 $6 billion，增速类似。虽然方法论 不同，但 2026 年全球 TAM 的共识区间为 $3–7 billion。

              北美约占全球市场的 37–50%，对应 2026 年所有 LTPAC 软件的北美 TAM 为 $1.5–3.3 billion。PointClickCare 的可服务可获得 市场（SAM）是北美 SNF/LTC
              EHR 加护理协同软件子集，按市场规模及 PointClickCare 估计 60–80% 的 SNF 市占率推导， 每机构年 ARPU 约 $40,000–60,000，SAM 估计为 $2–3
              billion。

              若按约 $480–500M 收入测算 PointClickCare 的可服务可获取市场（SOM），公司已拿下北美 SAM 的约 20–25%。向新子细分市场
              扩张（支付方分析、居家健康、加拿大扩张、生命科学真实世界数据）构成增量可服务市场机会。更广义的医疗数据和分析市场为 TAM 增加数千亿美元，但 PointClickCare 近期能捕获的部分仍限于 LTPAC
              专属细分。
