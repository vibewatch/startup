      - number: '8.2'
        title: 估值背景与可比分析
        blocks:
          - type: paragraph
            body: >
              PointClickCare 最近披露的估值数据点包括：（1）2021 年 3 月 Hellman & Friedman 二级交易隐含 $4B 估值；（2）H&F 和 JMI Equity 在 2023–2024
              年二级市场交易中约 $5B；（3）Forge Global 的 IPO 前二级市场数据也显示，截至 2025–2026 年约为 $5B。

              在 $4B 标记下，若使用 $480M CAD 基线，隐含 EV/Revenue 倍数为 8.3x；若使用 $673M USD 基线，则约为 5.9x——收入不确定性拉出了很宽区间。在 $5B 标记下，倍数分别为
              10.4x 和 7.4x。

              可比公司分析：Veeva Systems（医疗 SaaS 龙头）交易在 6.9x EV/Revenue（2026 年 Q1）。Phreesia（患者接收医疗 SaaS）交易在
              5–8x。Inovalon（医疗分析，2022 年 PE 私有化）以约 7x EV/Revenue 私有化。nCino（垂直 SaaS，金融科技）交易在 5–10x。2025–2026 年公开 SaaS 中位数为
              6.1–8.5x EV/Revenue。

              在这一可比组合中，PointClickCare $5B 二级市场隐含 10x 倍数，高于医疗 SaaS 中位数。PCC 的监管护城河、市场主导地位和数据网络可以支撑一定溢价——但该溢价通常只比中位数高
              1–2x，意味着公允价值区间为 $4–5.5B（8–11x EV/Revenue），前提是收入基线得到确认。

              一个关键数据缺口：收入基线冲突（$480M CAD 与 $673M USD）让精确倍数计算在正式尽调前不可能完成。若 $673M USD 收入隐含值成立，$5B 估值看起来更温和（7.4x）且可辩护；$480M
              CAD 基线则让估值更吃紧（10.4x）。
