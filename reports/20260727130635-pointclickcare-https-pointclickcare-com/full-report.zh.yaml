companyProfile:
  summary: >
    PointClickCare 是北美领先的云端电子健康记录（EHR）和护理协同平台，服务长期和急性后期护理（LTPAC） 机构。公司 2000 年由 Dave Wessinger（CEO）和 Mike
    Wessinger（执行董事长）兄弟在加拿大安大略省密西沙加 创立，平台覆盖 30,000+ 家服务机构，场景包括专业护理机构、辅助生活社区、持续护理退休社区和居家健康机构。 公司的数据网络覆盖 150M+ 份患者记录、375+
    个市场伙伴集成，拼出跨护理连续体的 HIE 平台。PointClickCare 约占美国 SNF EHR 市场 60–80%，连续七年拿下 SNF/LTC 的 KLAS Best in KLAS，并在积极准备 IPO；据称公司已 在
    2024–2025 年秘密提交 S-1。
