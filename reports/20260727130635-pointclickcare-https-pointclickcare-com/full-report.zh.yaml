      - number: '5.2'
        title: 平台架构与技术栈
        blocks:
          - type: paragraph
            body: >
              PointClickCare 的技术架构是云原生、多租户，部署在 Microsoft Azure 上，采用 Kubernetes 容器编排和 Docker 微服务。后端采用多语言微服务：核心 EHR 服务以
              .NET/C# 和 Java 为主，API 网关和事件驱动服务使用 Node.js，AI/ML 模型服务使用 Python。前端使用 TypeScript、React 和 Angular，交付响应式 Web
              以及原生 iOS/Android 移动应用。

              数据持久化采用混合路径：Azure SQL 承载交易型 EHR 数据，Azure Cosmos DB（NoSQL）承载事件日志、审计轨迹和数据湖存储。互操作层实现 HL7 v2、FHIR R4 和 SMART
              on FHIR 标准，用于与医院 EMR、支付方、实验室、药房和 HIE 交换数据。集成代理支持直接 ADT（admit/discharge/transfer）feeds、实验室和影像医嘱，以及双向用药数据交换。

              AI/ML 层使用 Azure Cognitive Services 处理 NLP（Ambient Scribe），并用定制训练模型做患者风险评分、转诊复杂度评估和计费异常检测。平台处理来自 150M+
              次患者就诊的数据，让 PointClickCare 拥有业内最大的 LTPAC 专用训练数据集之一。与使用通用医疗数据或更小 LTPAC 数据集训练的竞争对手相比，这一专有数据优势提升了 AI 模型准确率。
