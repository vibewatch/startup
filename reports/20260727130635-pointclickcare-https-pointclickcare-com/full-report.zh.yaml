        - 管理层报告显示 NRR < 100%
        - 客户基数在收缩；增长叙事失去支撑
        - 论点破坏：增长叙事不成立；全面重评
      - - CEO 离任
        - Dave Wessinger 辞职且未指定继任者
        - 客户关系、产品策略、IPO 叙事受冲击
        - 论点破坏：暂停承诺；观察 6 个月交接
      - - 第二次重大数据泄露
        - IPO 窗口内发生重大 HIPAA 泄露
        - 需要在 S-1 披露；IPO 延迟；集体诉讼风险
        - 论点复核：需追加网络安全控制尽调
      - - IPO 撤回
        - IPO 申报撤回或无限期推迟
        - PE 退出压力上升；可能折价卖给战略买家
        - 估值影响：二级市场定价可能下跌 20–30%
      - - Epic 从 PCC 手中拿下 2+ 家大型 SNF 连锁
        - 已点名企业客户流失至 Epic 的消息获公开确认
        - 市场份额开始流失；护城河叙事受挑战
        - 论点复核：重评竞争定位章节
    notes: 止损标准是针对投资论点的重评阈值，不是预测；它们监控基准情景建议背后的假设。
