      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >
              PointClickCare 由 Dave Wessinger 和 Mike Wessinger 共同创立。Dave Wessinger 担任首席执行官，在公司 从临床文档创业公司扩展为主导性 LTPAC
              平台的过程中接任 CEO。Mike Wessinger 担任董事会执行主席，此前曾任 CEO。两位创始人仍深度参与公司战略和治理，使公司保留创始人主导的文化；考虑到他们在老年护理技术领域的深厚
              经验，投资者通常会正面看待这种创始人背景。

              现任高管团队包括：Nicolette Turner 任首席财务官（2025 年 5 月任命，接替 2024 年 12 月任命的 Brian Gannon）；David Pessis 任首席产品与技术官；Annie
              McBride 任首席营销官。Brian Drozdowicz 任首席收入官。 2026 年 5 月，董事会任命 Taylor Rhodes 为新的独立董事；他曾三次担任 CEO，拥有深厚技术经验，包括担任
              Applied Systems CEO 以及 Rackspace 前 CEO。Betsy Atkins 大约同期结束了六年董事任期。

              CFO 快速更替（Gannon 于 2024 年 12 月上任，Turner 于 2025 年 5 月接任）反映公司正积极准备潜在公开市场 事件。PE 赞助方 Hellman &
              Friedman（H&F）拥有董事会席位，JMI Equity 保留少数股权。关键人依赖中等： Wessinger 兄弟是象征和战略锚点，但职业管理团队正由经验丰富的企业软件高管补强，单点失效风险下降。截至
              2026 年，公开信息未显示不利治理事件（如创始人被移除、董事会争议）。
            claimRefs:
