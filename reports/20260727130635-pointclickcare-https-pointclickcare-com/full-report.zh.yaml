      - number: '7.3'
        title: 运营与技术风险
        blocks:
          - type: paragraph
            body: >
              PointClickCare 的主要运营风险，是对 Azure 的单云依赖。平台运行在 Microsoft Azure 上，采用 Kubernetes 和 Docker
              编排——架构现代、可扩展，但也形成单一运营故障点。一旦 Azure 区域故障影响 PointClickCare 基础设施，将同时扰乱数千家机构的 SNF 临床运营。SNF 员工通过 PointClickCare
              记录临床评估并提交 MDS 数据，即便一个班次内停机 4–8 小时，也可能造成文档缺口、MDS 提交延迟，以及客户机构面临 CMS 审计敞口。

              CMS FY2026 SNF PPS 规则包含 ICD-10 映射更新、PDPM 权重修订和新的质量报告要求。PointClickCare 必须在 CMS
              合规时间线内上线监管更新，否则客户会面临编码错误和报销风险。任何合规更新推出延迟，都会在客户基础中形成系统性风险。

              技术执行风险：2026 年 Next-Gen Practitioner EHR 和 Advisor Suite 发布，代表显著开发执行风险。UI 更新已经引发客户抱怨。复杂 AI
              产品进入临床工作流，会牵连患者安全：如果 AI 生成的计费建议有误，客户可能面临 Medicare 超额计费审计指控。

              基础设施安全、SLA 合规（Azure 对多数服务提供 99.99% 正常运行时间 SLA）和灾难恢复规划，是核心运营要求。PointClickCare 的企业客户在合同谈判中，越来越多地要求提供 SOC 2
              审计结果、Azure SLA 文档和业务连续性计划证据。
