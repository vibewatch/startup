      - number: '1.6'
        title: 展示要点
        blocks:
          - type: callout
            title: 主导 SNF 市占率构筑深护城河
            body: >
              以深度嵌入的 SaaS 平台服务 60–80% 的美国专业护理机构，带来极高切换成本。漫长上线周期、监管合规工作流和员工 培训依赖，使既有机构很难替换 PointClickCare，并支撑高 NRR
              和可预测订阅收入。
            calloutType: strength
            claimRefs:
              - CO022
              - CO024
              - CO025
          - type: callout
            title: 信息阻断诉讼形成不利法律先例
            body: >
              2025 年第 4 巡回法院在 Real Time Medical Systems v. PointClickCare 案中的裁定认为，公司可能违反 21st Century Cures Act
              的信息阻断条款。裁定使公司面临进一步监管审查、每次违规最高 $1M 的潜在罚款，并削弱 其把数据访问控制用作竞争护城河的能力——任何 IPO 估值都必须计入这一风险。
            calloutType: risk
            claimRefs:
              - CO033
              - CO034
          - type: callout
            title: IPO 估值前先拿到经审计财务
            body: >
              不同来源给出的收入估计从 $480M 到 $673M 不等，毛利率、NRR 和 ARR 构成也未公开披露。任何严肃尽调或 IPO 参与， 都需要取得经审计 GAAP
              财务、经常性收入与服务收入拆分，以及客户集中度数据。秘密提交的 S-1 会让注册投资者在 IPO 流程中取得这些信息。
            calloutType: recommendation
            claimRefs:
              - CO026
              - CO027
          - type: callout
            title: 两次 CFO 任命显示 IPO 准备提速
            body: >
              Brian Gannon（2024 年 12 月）出任 CFO 后，Nicolette Turner（2025 年 5 月）很快接任；再叠加 Taylor Rhodes 等董事会成员加入（2026 年 5
              月），显示公司正在积极且加速准备公开市场事件。高管层和董事会层面的任命节奏， 与自 2026 年中起 12–18 个月的 IPO 窗口相符。
