      - number: '7.2'
        title: 网络安全与数据安全风险
        blocks:
          - type: paragraph
            body: >
              PointClickCare 在 2024 年 7 月发生重大网络安全事件：被攻陷的凭证被用于访问 EHR
              平台上的患者数据，暴露的信息包括多个长期护理机构客户的患者姓名、社会安全号码、Medicare/Medicaid ID、出生日期、病历和健康保险信息。该泄露触发受影响客户的 HIPAA
              泄露通知义务，并带来监管、声誉和潜在集体诉讼法律敞口。

              2025–2026 年，医疗数据泄露处在历史高位：一次医疗数据泄露的平均成本为 $7.42M，针对医疗 SaaS 供应商的勒索软件攻击频率和严重程度都在上升。PointClickCare 的运营足迹——150M+
              患者记录、与 9,000+ 家机构临床工作流集成、Azure 云基础设施——使其成为高价值目标。一次成功的勒索软件攻击可能扰乱数千家机构的计费运营，并连锁影响 CMS 报销。

              PointClickCare 持有 HITRUST CSF Certification 和 SOC 2 Type II 审计状态，这些是可信的安全框架。不过，这些认证只是流程层保证，并不保证不会被攻破。2024
              年事件表明，技术防线未能阻止凭证型访问。IPO 前，SEC 新网络安全披露规则要求对重大事件和持续风险状态做详细披露，又增加了一层披露义务风险。

              鉴于平台承担关键任务（为参与 Medicare 的机构提供 24/7 临床文档），哪怕计费周期中短暂停机，也会造成不成比例的影响。IPO 前，业务连续性和灾难恢复基础设施必须完成测试和认证。
