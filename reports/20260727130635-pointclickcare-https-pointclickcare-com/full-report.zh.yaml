      - number: '3.2'
        title: MatrixCare：主要直接竞争对手
        blocks:
          - type: paragraph
            body: >
              MatrixCare 自 2020 年起成为 ResMed（NYSE: RMD）子公司，是 PointClickCare 在 LTPAC EHR 市场最接近的直接竞争者。 MatrixCare 服务约
              15,000+ 家机构，在居家健康、临终关怀和居家照护管理软件上尤其强。在 SNF 细分中，MatrixCare 在 2026 年 KLAS 专业护理机构类别排名第二，仅次于 PointClickCare。

              MatrixCare 的关键产品优势包括 MatrixConnect 互操作平台（与 PointClickCare 的 Collective Medical 网络竞争）、强分析和
              仪表盘能力，以及扎实的监管合规与计费自动化。它以中型运营商更低总体拥有成本，以及比 PointClickCare 历史上更偏 SNF 的平台 更强的居家健康/临终关怀工作流支持来竞争。

              ResMed 所有权为 MatrixCare 提供大量资本资源（ResMed 是市值 $20B+ 的上市公司），并让其与更广泛的呼吸和远程患者监测领域
              建立战略连接。急性后期护理向更多居家和远程监测模式迁移后，战略连接或可成为差异化因素。MatrixCare 估计定价为每用户每月 $255–$425，略低于 PointClickCare 的 $300–$500
              区间，对成本敏感的中型运营商更有竞争力。
