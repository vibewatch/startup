      - number: '3.4'
        title: Epic、Meditech 与急性护理既有厂商威胁
        blocks:
          - type: paragraph
            body: >
              Epic Systems Corporation（私营，估值约 $50B）和 Oracle Cerner（被 Oracle 收购后）代表来自急性护理 EHR 领域、可能进入急性后期 场景的厂商。Epic 的
              EpicCare 平台按床位服务约 60% 的美国医院；卫生系统纵向整合后，EpicCare 也越来越多部署在医院自有 SNF 和急性后期 单元。相较 PointClickCare，Epic
              的主要竞争优势是患者从基于 Epic 的医院转入 Epic 管理的 SNF 时，数据连续性更顺畅。

              但 Epic 在独立 LTPAC 场景中的弱点有充分记录：Epic 为急性护理工作流而设计（医嘱、复杂临床文档），缺少专为 LTPAC 打造的厂商所 提供的深度 MDS 评估自动化、SNF 专属计费和
              Medicare/Medicaid 合规工作流。在大多数独立 SNF 和 LTPAC 场景中，PointClickCare 的 定制平台和领域经验对 Epic 形成持久优势。

              MEDITECH Expanse 出现在一些医院附属急性后期场景中，但在独立 LTPAC 中存在感很低。主要风险情景是，卫生系统收购 SNF 连锁或 与其建立伙伴关系后，可能自上而下要求 Epic 或
              Oracle Cerner 成为 EHR 标准，而不是在机构层面竞争胜出后替换 PointClickCare。 风险偏中期（2027+），集中在卫生系统拥有的 SNF 连锁。
            claimRefs:
