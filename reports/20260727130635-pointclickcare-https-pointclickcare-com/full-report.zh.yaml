  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品架构与模块概览
        blocks:
          - type: paragraph
            body: >
              PointClickCare 平台分为五个产品支柱：（1）临床管理（EHR 核心：MDS 评估、照护计划、eMAR、进展记录、生命体征跟踪、用药管理）；（2）财务与收入周期管理（计费、理赔、资格验证、RCM
              自动化）；（3）照护协调与互操作（Collective Medical ADT 数据流、Audacious Inquiry HIE 连接、FHIR/HL7 API、400+
              个生态市场合作伙伴）；（4）分析与洞察（运营仪表盘、临床质量指标、PDPM 和价值医疗分析、监管报告）；（5）AI 与自动化（Advisor Suite：Referral Advisor、Chart
              Advisor、Billing Advisor；Ambient Scribe；AI 生成临床摘要）。

              平台还包括劳动力管理模块（排班、由 Apploi 支撑的招聘 / 入职）、远程医疗集成、感染预防、伤口护理，以及家庭参与 /
              沟通模块。模块化架构让运营商只采用所需模块，同时在所有已部署模块之间保持统一患者记录。400+ 个生态市场合作伙伴覆盖药房、实验室、RPM、远程医疗、人员配置、分析和支付供应商，使 PointClickCare
              的生态成为 LTPAC 市场中最广的体系。

              2026 年，PointClickCare 推出 Advisor Suite——原生 AI 产品层，把 AI 驱动的自动化直接嵌入高摩擦临床和财务工作流，包括入院（Referral
              Advisor）、临床文档（Chart Advisor）和收入周期管理（Billing Advisor）。这次发布标志着 AI 产品战略从试点功能进入正式可售产品线，成熟度明显提升。
