      - number: '4.2'
        title: GTM 路径与销售效率代理指标
        blocks:
          - type: paragraph
            body: >
              PointClickCare 的市场进入方式是面向 SNF 运营商、辅助生活连锁和居家健康网络的企业直销，并由其 375+ 伙伴市场中的药房、实验室和 RPM 厂商渠道伙伴补充。大型企业客户（50+
              机构连锁）的销售周期通常为 6–18 个月，因为 EHR 替换需要深度集成。中端市场客户（10–50 家 机构）的周期为 3–9 个月。

              客户获取成本（CAC）未公开披露，但可用企业医疗 SaaS 行业基准代理估算：每新增一家净新机构 $10,000–$30,000。假设 30,000+ 家机构、 收入 $480M，平均每机构收入约
              $13,000–$16,000/年（$1,083–$1,333/月）。按估计 70–75% 毛利率计算，每机构毛利约 $9,000–$12,000/年。 若 CAC 为 $15,000–$25,000，回本期约
              18–30 个月，符合企业 SaaS 常态。

              关键效率驱动包括：（1）EHR 深度嵌入工作流、监管合规报告依赖带来低流失（估计 <5%）；（2）通过分析和价值型护理模块组合推进加购； （3）伙伴市场提升粘性，并从集成厂商带来间接协同销售收入；（4）KLAS
              #1 排名在采购中充当外部背书信号。
