chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >
              PointClickCare Technologies Inc. 是一家私营医疗科技公司，总部位于加拿大安大略省密西沙加 Explorer Drive 5570 号，邮编 L4W 0C4，并在美国明尼苏达州
              Bloomington 拥有重要运营基地。公司 2000 年由 Dave Wessinger 和 Mike Wessinger 兄弟创立，运营一套为长期和急性后期护理（LTPAC）连续体 定制的云原生 SaaS
              平台。主产品是 ONC 认证的电子健康记录（EHR），面向专业护理机构（SNF）、辅助生活 社区、居家健康机构、老年生活运营商，以及越来越多的支付方和急性护理系统。

              公司商业模式是订阅式 SaaS，按机构或用户收取年度经常性许可费，并打包实施、培训和支持服务。监管严格的 医疗环境里，平台深度嵌入工作流、切换成本高，收入因此高度经常性。PointClickCare
              通过两笔大型收购扩展了 可服务市场：2020 年 12 月以约 $650M 收购 Collective Medical，2022 年 3 月以约 $250M 收购 Audacious
              Inquiry，把触达面延伸到急性、门诊和支付方网络之间的护理转接。合并后的网络如今覆盖 2,700+ 家医院、 2,000+ 个门诊点、180+ 个健康计划和 75+ 个州级/政府机构，每年在美国触达估计
              150M 患者。

              截至 2026 年中，PointClickCare 自称是北美最大的老年护理数据网络，并在 2026 年连续第七年获评专业护理机构/长期护理类别的 Best in KLAS。公司处于私营后期阶段，IPO
              路径明确，已向 SEC 秘密 提交 S-1。
            claimRefs:
