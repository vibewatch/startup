    summary: |
      典型 PointClickCare SNF 客户的旅程阶段：从初始认知，到采购、上线、稳定运营、扩展和续约。
    data:
      items:
        - label: 认知
          description: SNF 运营商在 CMS 合规压力、同行转介或 KLAS 研究中发现 EHR 需求。PointClickCare 通常是默认入围候选。
        - label: 评估
          description: RFP 流程 3–12 个月；评估标准包括监管合规、KLAS 排名、同行背书、集成广度和 TCO。
        - label: 采购
          description: 签署 3–5 年企业合同；确定实施计划和数据迁移范围。典型交易规模为 $50K–$200K 设置费 + 经常性 SaaS。
        - label: 实施
          description: 单设施 60–90 天；多站点 6–18 个月。包括员工培训、数据迁移、MDS 集成、药房 / 实验室设置。
        - label: 稳定运营
          description: 日常临床 EHR 使用、账单自动化、监管报告和护理协调流程都跑起来。高切换成本在这一阶段嵌入。
        - label: 扩展
          description: 增购护理协调分析、Advisor Suite AI 模块和支付方分析。合同期内 ARPU 平均扩张 10–20%。
        - label: 续约
          description: 3–5 年合同续约；高留存由监管锁定、员工培训投入和数据网络依赖驱动。
