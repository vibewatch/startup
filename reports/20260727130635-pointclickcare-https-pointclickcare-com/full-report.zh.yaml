      - number: '7.5'
        title: 人员、执行与战略风险
        blocks:
          - type: paragraph
            body: >
              PointClickCare 的人员风险集中在创始人 CEO 依赖上。Dave Wessinger（CEO）和 Mike Wessinger（Executive Chairman）是兄弟，二人于 2000
              年共同创办公司。Dave 在运营和战略上高度居中：企业客户关系、产品战略和 IPO 叙事都与其领导力紧密绑定。CEO 层面若因离职、健康或冲突发生意外交接，很可能引发投资者担忧和客户不确定性。

              CFO 更替风险：PointClickCare 于 2024 年 12 月任命 Brian Gannon 为 CFO（替换此前任命），随后 Nicolette Turner 于 2025 年 5 月接任
              CFO。IPO 准备期间六个月内两次 CFO 过渡，给财务报告质量、投资者关系和 S-1 准备带来执行风险。CFO 连续性对 IPO 准备至关重要。

              AI 产品发布执行风险：Advisor Suite（Referral、Chart、Billing Advisors）于 2026 年 6 月推出。AI 计费建议工具有一项特定风险：如果 AI
              生成错误计费建议，客户采纳后又遭遇 Medicare 追缴审计，PointClickCare 可能面临责任和客户反弹。临床 AI 部署在受监管医疗场景中，必须有严格验证和清晰责任框架。

              市场 / 论点风险：如果 Epic Systems 加速进入 LTPAC 市场，推出功能完整的 SNF EHR，PointClickCare 护城河可能比预期更快被侵蚀。Epic
              对长期护理的投入已增加，其提供无缝医院到 SNF 照护连续性的能力，可能挑战 PCC 跨连续体集成价值主张。
