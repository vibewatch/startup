      - number: '5.3'
        title: AI 差异化与 Advisor Suite
        blocks:
          - type: paragraph
            body: >
              PointClickCare 于 2026 年 6 月推出 Advisor Suite，这是一条直接嵌入 EHR 的 AI 原生工作流自动化产品线。首批三个产品是：（1）Referral Advisor——AI
              驱动的接收自动化，从转诊文件（常常每位患者 70+ 页）中提取临床、财务和监管数据，给转诊队列排序，并呈现考虑床位容量的床位管理；（2）Chart Advisor——AI
              文档辅助，减少临床人员手工录入记录，并生成符合 MDS 的临床摘要；（3）Billing Advisor——AI 驱动的收入周期自动化，标记计费异常、优化理赔，并提示少收费风险。

              Advisor Suite 的战略重要性有两层：（1）在 GA 阶段，竞争对手缺少可比的 LTPAC 训练 AI 产品，PointClickCare 因此拉开差异；（2）它把核心 EHR 客户向 AI
              模块上行销售，可能让每家机构每月 ARPU 增加 $50–$150。Advisor Suite 还获得 2026 MedTech Breakthrough Awards 的 Best EHR
              Solution，验证了 AI 产品战略。

              PointClickCare 还在 2026 年推出面向执业团队的 Next-Generation EHR，瞄准医生、PA、NP 访问 SNF 时的工作流，提供双向数据交换、AI
              驱动的临床确定性工具，以及移动优先界面。该产品覆盖了过去服务不足的用户群（到访 SNF 的执业者），并在现有客户机构内扩大可触达用户基础。
