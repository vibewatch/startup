      - number: '7.7'
        title: 展品
        blocks:
          - type: callout
            title: 信息阻断裁决是近期最重大的法律风险
            body: >
              第四巡回法院 2025 年 3 月认定 PointClickCare 很可能违反信息阻断条款，这是单项严重程度最高的法律风险。OIG 可按每项违规处以最高 $1M
              民事罚款，而裁决中的反竞争表述也可能引来反垄断审查。对一家准备 IPO 的公司来说，活跃的 OIG 执法程序或禁令式数据共享命令，都将成为必须披露的重大不利事件，并可能推迟或复杂化上市。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: 网络安全：2024 年泄露和 150M+ 患者记录造成持续敞口
            body: >
              PointClickCare 2024 年 7 月数据泄露，加上 2025–2026 年医疗行业创纪录的泄露频率，构成持续、重大的运营风险。当前一次医疗泄露的平均成本为 $7.42M。在 IPO
              规模下，第二次重大泄露很可能要求 SEC 披露、客户通知，并带来集体诉讼敞口。HITRUST 认证必要但不充分——2024 年事件说明，凭证型攻击可以绕过边界控制。
