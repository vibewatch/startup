      - number: '6.3'
        title: 留存、续约与客户满意度
        blocks:
          - type: paragraph
            body: >
              PointClickCare 的客户留存由三套机制结构性加固：（1）EHR 工作流深度嵌入——MDS 评估自动化、CMS 报告、州级监管报告和计费深植日常运营，替换成本极高；（2）企业账户采用 3–5
              年合同结构，锁定收入并抬高切换成本；（3）监管合规依赖——运营商参与 Medicare/Medicaid 必须使用 ONC 认证 EHR，这为留存提供平台底线。

              第三方评论来源和行业评论估算，PointClickCare 年度流失率低于客户机构的 5%，符合企业医疗 SaaS 常态。2026 年，KLAS 给 PointClickCare 的 SNF/LTC 打分为
              84.0，Senior Living 为 83.4（KLAS 分数超过 80 被视为 Best in Class）。截至 2026 年，G2 用户在 46 条评价中给 Skilled Nursing
              Platform 评分 4.3/5。

              NRR（net revenue retention）未公开披露。参考企业医疗 SaaS 110–120% 的基准区间，以及 PointClickCare 正在推进的上行销售（分析、AI Advisor
              Suite、支付方模块），110–120% NRR 估算具有合理性。不过，近期 UI 更新获得的用户评价不一，部分用户抱怨生产率受损——如果可用性问题不能解决，短期留存会承压。

              一个反向信号：部分客户在 2026 年负面评价中特别提到 UI 更新体验扰乱工作流。虽然目前看这并未造成显著流失，但可能影响较小、嵌入程度较低账户的续约率。
