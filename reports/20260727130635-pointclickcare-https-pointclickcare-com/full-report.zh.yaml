      - number: '4.4'
        title: 公开牵引力与私有指标缺口
        blocks:
          - type: paragraph
            body: >
              PointClickCare 公开可得的运营指标包括：30,000+ 家服务机构、数据网络覆盖 150M+ 患者、连接 2,700+ 家医院、375+ 个市场伙伴，以及 连续第 7 年 KLAS
              #1。每员工收入（约 $200K CAD/年）和三年收入增长率 69%（2021–2024）来自 Globe and Mail Top Growing Companies 申报中的自报数据。

              没有正式披露就无法取得的关键私有指标包括：（a）按细分划分的经审计 GAAP 收入，（b）净收入留存率，（c）按产品线划分的 ARR，（d）毛流失
              和净流失率，（e）客户生命周期价值，（f）按渠道划分的客户获取成本，（g）EBITDA 和经营利润，（h）自由现金流和账面现金，（i）债务义务， 包括与 Hellman & Friedman 2021
              年二级交易有关的任何杠杆收购债务。2024–2025 年秘密提交的 S-1 表明上述指标最终会披露，但目前仍无法 用于尽调。

              Globe and Mail 报告的 $480.3M CAD（约 $360M USD）收入与公司背景简报引用的 $673M USD 之间存在重大差异。差距可能来自：（1）年份不同， （2）CAD vs.
              USD，（3）收入定义不同（仅平台 vs. 合并口径），或（4）是否纳入被收购实体。该差异是财务建模的尽调阻碍。
