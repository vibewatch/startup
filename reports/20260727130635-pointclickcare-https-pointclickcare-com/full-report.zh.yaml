      - number: '4.3'
        title: 成本结构与利润率画像
        blocks:
          - type: paragraph
            body: >
              作为云端 SaaS 公司，PointClickCare 的成本结构主要由几块构成：R&D（按可比垂直 SaaS 公司估计为收入的 12–18%）、销售与营销（约 20–25%）、一般与行政（约
              10–15%），以及收入成本（云托管、客户支持、实施服务）（约 25–30%）。这些基准意味着经营利润率（EBITDA） 约 15–30%，符合成熟且规模化垂直 SaaS 公司的水平。

              第三方分析师估计毛利率为 70–75%，反映收入主要来自软件订阅。但 Collective Medical 和 Audacious Inquiry 收购引入了服务交付和 数据基础设施成本，可能相较纯 EHR
              基线小幅稀释毛利率。两笔收购合计花费估计 $900M–$1.1B，也在资产负债表上带来大量无形资产摊销。

              PointClickCare 约有 2,400 名员工（据 Globe and Mail 2024 数据），每员工收入约 $200,000 CAD（约 $149,000 USD），低于纯 SaaS
              同业，但考虑到医疗软件需要大量服务和支持运营，仍属合理。鉴于平台统一策略正在推进，R&D 人员可能占总员工 40–50%。云 SaaS 公司的资本开支
              相对较低；主要资本开支是云基础设施和数据中心成本，可能低于收入 5%。
