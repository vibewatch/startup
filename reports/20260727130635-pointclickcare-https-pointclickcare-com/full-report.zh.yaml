      - number: '8.5'
        title: 建议、信心与最终尽调请求
        blocks:
          - type: paragraph
            body: >
              建议：继续研究。投资逻辑在商业上很有吸引力——PointClickCare 主导着一个大型、合规驱动且仍在增长的市场，留存特征强，也在积极推进 AI 产品策略。不过，当前二级市场 $5B
              的定价，在较低收入基准下约等于 10x EV/Revenue，高于医疗 SaaS 中位数，现有已确认财务指标还不足以支撑这一水平。

              买入承诺前必须解决五个阻断性尽调问题：（1）收入基准确认——在正式尽调中取得 CFO 级财务披露，调和 $480M CAD 与 $673M USD 的差异；（2）NRR
              与流失数据——财务团队管理报表中的净收入留存率、总流失率和 cohort 表；（3）信息阻断诉讼结果——OIG 往来函件、诉讼状态，以及律师对罚款敞口的估计；（4）2024 年 7
              月数据泄露后的网络安全取证报告和整改状态；（5）CEO 与 CFO 雇佣协议、继任计划和股权归属安排。

              如果五项均有利落地（收入约 $650M+、NRR 110%+、OIG 不采取行动、数据泄露已整改、领导层稳定），投资结论可在 $5B 估值下上调为买入（$3.5–4B 会是有吸引力的入场价）。如果收入确认仅为
              $480M CAD，且 OIG 执法仍在推进，$5B 估值就明显偏高，应要求 20–30% 折价。

              信心：中等。PointClickCare 的结构性逻辑清晰，但财务指标不确定、诉讼仍未了结，削弱了现有证据基础能给出的确信度。风险评级：高（多项风险需要同时解决）。估值立场：$5B 二级价格偏高；$3.5–4B
              较合理。
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 继续研究：业务有吸引力，财务指标仍待确认
            body: >
              PointClickCare 具备买入级公司的结构特征：市场地位主导、监管护城河、数据网络、持续改善的 AI 产品组合，以及 IPO
              准备度。继续研究的结论不是因为业务弱，而是证据缺口仍在——收入基准未确认、NRR / 流失未披露、信息阻断诉讼未了结、网络安全取证披露不足。若正式尽调确认：（1）收入约 $600M+ USD，（2）NRR
              110%+，（3）OIG 不采取行动或罚款有限，（4）数据泄露已完全整改——建议可在 $4–5B 上调为买入。若没有这些确认，$5B 的定价几乎要求一切完美。
            calloutType: recommendation
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV027
          - type: callout
            title: 收入基准冲突使倍数计算不可靠
            body: >
              $480M CAD（Globe and Mail）与 $673M USD（公司简报）之间的收入差异尚未解决，带来 20–30% 的估值不确定性。在 $5B 估值下，EV/Revenue 可能落在偏高的
              10.4x，也可能落在较合理的 7.4x，两者差异足以改变判断。收入基准确认因此是优先级最高的阻断性尽调事项——没有收入基准确认，就无法确认估值立场。
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV025
          - type: callout
            title: 数据网络护城河既是最强资产，也是风险最高的资产
            body: >
              PointClickCare 的 150M+
              患者记录网络，一方面是公司最有价值的资产（带来持续叠加的分析价值和切换成本），另一方面也是法律风险最高的资产（信息阻断裁决威胁了该网络赖以防守的独家数据访问权）。裁决之后，PointClickCare
              如何应对合规——是靠开放 API 和参与 TEFCA 加固护城河，还是把数据优势让给第三方分析公司——将成为未来 3–5 年价值轨迹的最重要变量。
            calloutType: insight
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV029
          - type: callout
            title: 基准情景假设 NRR 为 110–115%——仍需确认
            body: >
              基准情景估值和继续研究建议假设 NRR 为 110–115%，这一水平与结构性切换成本分析和企业医疗 SaaS 基准一致。如果正式尽调显示 NRR 低于
              100%（意味着装机客户群内发生收缩），商业逻辑会发生根本变化，建议也会转为跟踪或放弃。NRR 披露是第一页尽调清单里的硬性要求。
            calloutType: assumption
            claimRefs:
              - CV003
              - CV016
              - CV028
