  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >
              PointClickCare 投资论点建立在五个支柱上：（1）市场领导护城河——在合规驱动、监管粘性强、切换成本高的垂直领域，拥有 60–80% SNF/LTC 市占率；（2）网络效应——覆盖 30,000+
              家提供方的 150M+ 患者记录，形成会随时间复利的数据网络（临界规模 HIE）；（3）收入质量——90%+ 经常性订阅收入、3–5 年企业合同、预计 <5% 年流失率，以及 Medicare/Medicaid
              文档依赖带来的结构性留存；（4）TAM 扩张——$11B+ LTPAC HIT 市场以 6–8% CAGR 增长，Advisor Suite 和跨连续体分析带来 AI 上行空间；（5）IPO 催化——保密 S-1
              提供近期流动性事件，并带来机构投资者验证。

              反论点同样具体：（1）收入基线冲突——$480M CAD 与 $673M USD 未解决，会让倍数计算相差 20–30%；（2）NRR
              未披露——没有经确认的净收入留存，客户质量评估只能依赖结构性代理指标；（3）信息阻断敞口——第四巡回法院裁决让数据网络护城河暴露在 OIG 罚款和竞争侵蚀之下；（4）$5B 估值偏高——10x
              EV/Revenue 位于或高于优质医疗 SaaS 区间；（5）执行风险——两次 CFO 过渡、AI 产品仍在早期，以及 PE 退出压力，削弱顺利 IPO 执行的确定性。

              正反论点权衡后，结论是继续研究：业务基本面有吸引力，但收入基线未解决、留存指标未披露、诉讼尾部风险仍在；在当前 $5B 二级市场价格下，必须先解决这些问题，才能给出明确买入判断。
