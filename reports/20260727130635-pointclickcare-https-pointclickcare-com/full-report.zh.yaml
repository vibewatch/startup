  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层
        blocks:
          - type: paragraph
            body: >
              PointClickCare 客户基础分为四类主要买方：（1）大型多站点 SNF 连锁（50+ 家机构）——企业账户，代表最高收入集中度；美国前十大 SNF 连锁中有九家是 PointClickCare
              客户。（2）中端 SNF 运营商（10–50 家机构）——按数量计的最大分层，通常购买核心 EHR，搭配计费和分析模块。（3）小型独立 SNF 和辅助生活机构（<10
              家机构）——按机构数量计最广，主要以较低价格层购买核心 EHR。（4）居家医疗和临终关怀机构——正在增长但历史渗透不足，MatrixCare 在该分层领先。

              从地域看，PointClickCare 客户基础以美国为主（约 85–90% 收入），同时在加拿大有重要存在（本土市场，公司创立于安大略省 Mississauga）。截至 2026
              年，平台在北美以外似乎没有显著国际业务。推动采用的主要用例包括：（1）Medicare/Medicaid 监管合规（MDS、PDPM），使 EHR
              采用成为刚需；（2）计费自动化和收入周期管理；（3）急性和急性后期场景之间的照护协调和转衔管理；（4）AI 驱动的工作流自动化（新兴用例，Advisor Suite 2026）。

              公司未公开披露按分层划分的收入构成，但大型企业连锁高度集中（前十中九家）意味着最高层级账户贡献了可观收入。公司的 Forrester Total Economic Impact 研究显示，SNF
              客户使用平台三年平均获得 $1.3M 收益。
