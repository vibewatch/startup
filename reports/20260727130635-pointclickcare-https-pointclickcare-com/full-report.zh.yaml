      - number: '4.6'
        title: 财务结论：收入质量、利润率路径与尽调阻碍
        blocks:
          - type: paragraph
            body: >
              PointClickCare 是一家高质量、经常性收入驱动的 SaaS 公司，具备支撑溢价估值的结构特征：软件承担关键任务、深度嵌入工作流、切换成本高、监管合规形成锁定，并在市场中占据主导位置。估算 70–75%
              毛利率和 <5% 流失率，处在垂直 SaaS 表现的高端区间。

              不过，在完成财务建模前，仍有几个重大尽调堵点必须解决：（1）$480M 与 $673M 收入口径差异需要对账——若较高数字经过 GAAP 审计确认，在 $4B 估值下意味着 EV/Revenue 约
              6×（有吸引力）；若按 $480M USD，则约 8×（合理到偏高）；（2）缺少经审计财务、EBITDA 披露或现金流量表，无法确认利润率说法；（3）没有披露杠杆 /
              债务，收购后的真实净债务位置不透明；（4）Real Time Medical Systems 法院裁决可能继续带来财务影响，包括潜在整改成本、API 访问基础设施投入，以及数据变现收入面临的竞争压力。

              订阅和留存特征让财务质量评分偏高；但受私营公司披露限制影响，透明度只能评为中低。若 IPO 路径落地，这些缺口会通过公开披露得到解决。
