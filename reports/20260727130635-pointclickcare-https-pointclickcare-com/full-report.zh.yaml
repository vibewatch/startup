      - number: '6.5'
        title: 反向客户信号与尽调问题
        blocks:
          - type: paragraph
            body: >
              尽调中需要跟踪几类反向客户信号。第一，Real Time Medical Systems v. PointClickCare 裁决认定，PCC 的数据访问限制很可能违反 21st Century Cures
              Act。对客户而言，这意味着部分 SNF 运营商偏好的第三方分析供应商，将从 PointClickCare 获得扩大的数据访问权。如果可比第三方替代品可用，该裁决可能降低客户升级到 PointClickCare
              自有分析产品的动力。

              第二，2026 年 G2 用户评价明确提到，近期 PointClickCare UI 更新造成工作流扰动和生产率损失。大型 EHR UI
              迁移期间出现这类抱怨并不罕见，但它打开了一个客户不满窗口，竞争对手可能趁机切入。

              第三，公司不公开披露 NRR、流失率或队列留存数据——这些是标准 SaaS 尽调指标。缺少这些指标，就无法独立验证客户基础质量。正式尽调中，应优先索取这些数据。

              第四，行为健康和居家医疗运营商在 PointClickCare
              产品组合中服务不足，而竞争平台（Netsmart、MatrixCare）在这些分层有产品优势。业务多元且拥有大量居家医疗或行为健康业务的急性后期运营商，可能更偏好竞争平台。
            claimRefs:
