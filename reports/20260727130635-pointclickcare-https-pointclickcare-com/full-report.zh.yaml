      - number: '3.3'
        title: Netsmart、WellSky 与其他直接竞争者
        blocks:
          - type: paragraph
            body: >
              Netsmart Technologies（由 Centerbridge Partners 私募股权支持）是第三大 LTPAC EHR 厂商，在行为健康、LTACH 和多场景急性后期
              机构中尤其强。Netsmart 的 myUnity 平台支持跨多种护理场景（SNF、居家健康、临终关怀、行为健康）的集成 EHR 和护理管理，重点放在 临床工作流可扩展性和合规。Netsmart
              通过合并后的产品组合服务数万家提供方，其 LTPAC 重点品牌包括 myUnity Care Management 和 NetSolutions。

              WellSky（同样由 TPG 私募股权支持）已成为居家健康和居家照护软件领域的重要竞争者，平台面向不断增长的居家和社区护理迁移趋势。 WellSky 收购 Careficient 和其他居家健康厂商后，在
              PointClickCare 历来优势较弱的居家健康细分获得竞争位置。

              American HealthTech（Netsmart 生态的一部分）面向成本敏感的中型 SNF 运营商。AxisCare 在 2026 年获评个人护理类别的 Best in
              KLAS，切入个人护理和居家照护相邻市场。更小的利基竞争者包括 HealthMEDX（MatrixCare 的一部分）、PointCare 和多家区域厂商。 PE
              支持的平台不断整合小型区域厂商，市场正在逐步集中。
