      - number: '3.6'
        title: 展示要点
        blocks:
          - type: callout
            title: 7 次 KLAS Best in KLAS 与 60–80% SNF 市占率是耐久护城河
            body: >
              主导性的已安装客户基础、SNF/LTC 连续 7 年 KLAS #1，以及 30,000+ 家连接机构形成的网络效应，共同构成自我强化的护城河。SNF 连锁的 采购决策高度受 KLAS
              排名和同业推荐影响，PointClickCare 因此在多数竞争评估中成为默认选择。
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP005
          - type: callout
            title: 信息阻断裁定侵蚀数据访问护城河
            body: >
              2025 年 Real Time Medical Systems 法院裁定迫使 PointClickCare 允许第三方分析厂商访问其数据网络。竞争脆弱点不小： PointClickCare
              的数据广度原本是相对分析竞争者的结构性优势。访问若必须广泛共享，竞争性分析产品可能在不要求完整 EHR 平台的 情况下提供可比洞察，从而削弱加购和留存逻辑。
            calloutType: risk
            claimRefs:
              - CP024
              - CP025
              - CP026
          - type: callout
            title: 评估 MatrixCare 在 ResMed 支持下的竞争投入速度
            body: >
              ResMed 的上市公司资源让 MatrixCare 相比 PE 支持的 PointClickCare 拥有显著资本优势。尽调应评估 MatrixCare 在 2024–2026 年的 R&D
              投入率、产品路线图推进，以及居家健康/临终关怀市场份额提升，以判断关键子细分中的竞争差距是否正在收窄。
