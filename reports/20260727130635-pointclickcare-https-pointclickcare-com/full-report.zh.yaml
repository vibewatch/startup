      - number: '6.4'
        title: 扩张与集中度风险
        blocks:
          - type: paragraph
            body: >
              PointClickCare 的主要扩张动作，是在现有客户基础内做模块上行销售：只采用核心 EHR 的客户，会被交叉销售照护协调分析（Collective Medical、Audacious
              Inquiry）、Advisor Suite AI 产品，以及支付方 / VBC 分析模块。考虑到 PointClickCare 90%+ 收入来自经常性订阅，先落地再扩张模式是现有账户中的主要增长引擎。

              关键扩张风险是收入集中度：美国前十大 SNF 连锁中有九家是客户，企业分层代表显著收入集中。失去一到两个大型连锁账户，可能对收入造成重大影响。截至 2026 年 7 月，尚未发现公开确认的大账户流失事件；但
              Real Time Medical Systems 信息阻断裁决创造了一种场景：大型连锁可能要求更开放的数据访问，或评估替代分析供应商。

              渠道依赖有限：PointClickCare 销售路径主要靠直销和企业客户经理。375+ 个生态市场合作伙伴支持联合销售和集成粘性，但并不是重要获客渠道。政府合同（Audacious Inquiry +
              CNI）规模较小，但正在把客户基础扩展到公共部门。

              地域集中（美国和加拿大）带来风险：如果美国 SNF 市场整合或监管变化（如 CMS 报销改革）减少运营商数量或削弱核心客户基础的购买力，公司会受到冲击。
