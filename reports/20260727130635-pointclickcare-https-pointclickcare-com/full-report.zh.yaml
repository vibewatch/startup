      - number: '2.5'
        title: 监管环境与反证
        blocks:
          - type: paragraph
            body: >
              LTPAC EHR 的监管环境是医疗软件中最复杂的一类。SNF 同时参与 Medicare 和 Medicaid，必须遵守 CMS Conditions of
              Participation、年度成本报告、MDS（Minimum Data Set）评估和州级执照调查。EHR 厂商必须维持 ONC 软件认证，才能让软件符合
              监管激励资格并用于认证床位。PointClickCare 持有 ONC 认证，这对新竞争者构成重要进入壁垒。

              反证和市场逆风包括：（1）2025 年针对 PointClickCare 的信息阻断裁定表明，监管机构和法院愿意强制数据访问，这可能削弱支撑 溢价定价的数据护城河；（2）多家 SNF 连锁在 2024–2026
              年报告运营商财务压力、破产和关闭率上升，可服务机构总数下降； （3）Epic 对把 EHR 足迹延伸到急性后期场景的兴趣增强，形成来自资本雄厚既有厂商的中期竞争威胁；（4）2024–2026 年 Medicare
              Advantage 费率压力挤压 SNF 利润率，可能限制技术投资预算；（5）劳动力短缺意味着采用新 EHR 功能的受训人员更少， 限制加购潜力。

              尽管存在上述逆风，结构性顺风（老龄化、监管要求、VBC 采用）预计会压过近期约束。市场 11–12% CAGR 的增长共识意味着需求将 持续扩张，为 PointClickCare
              这类市场领导者创造多年自然增长机会。
            claimRefs:
              - CM028
              - CM029
              - CM030
              - CM031
              - CM032
      - number: '2.6'
        title: 展示要点
        blocks:
          - type: callout
            title: 长期人口顺风带来数十年增长
            body: >
              美国 85 岁以上人口——SNF 和急性后期护理的主要用户——是增长最快的人口群体。婴儿潮一代在 2026 年步入 80 岁，专业护理和 老年护理需求将在 2030 年代持续加速。人口结构是
              PointClickCare 所在市场最耐久的需求驱动，也给公司带来可见度长、相对不受经济 周期影响的增长跑道。
            calloutType: strength
            claimRefs:
              - CM020
              - CM021
          - type: callout
            title: SNF 机构关闭压缩总可服务机构数
            body: >
              用工规定带来的更高劳动力成本、Medicare Advantage 费率压力，以及 COVID-19 入住率冲击的持续余波，共同推高了 2024–2026 年 SNF
              关闭和整合率。总机构数收缩会减少新客户机会，并可能提高对现有客户加购/交叉销售的依赖。大型连锁集中度提升（前 10 大 连锁控制约 20% 的 SNF 床位）也带来交易对手风险。
