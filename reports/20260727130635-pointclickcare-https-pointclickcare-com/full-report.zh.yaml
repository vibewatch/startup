      - number: '2.4'
        title: 增长驱动与市场约束
        blocks:
          - type: paragraph
            body: >
              PointClickCare 所在市场最强的需求驱动来自人口结构：第一波婴儿潮一代在 2026 年步入 80 岁，加速专业护理和老年护理需求。 美国 65 岁以上人口预计到 2060 年将从约 52
              million 翻倍至约 95 million，其中 85 岁以上“高龄老人”细分——也是 SNF 的 主要用户——增长最快。无论短期经济周期如何，LTPAC 软件市场都将获得持续数十年的结构性顺风。

              监管要求是第二大驱动因素。21st Century Cures Act 的信息阻断条款要求 EHR 厂商支持数据共享，迫使传统本地部署厂商升级到 云原生、FHIR 合规平台——PointClickCare
              因此获得结构性优势。CMS 的 Interoperability and Patient Access Final Rule （CMS- 9115-F）要求 Medicare 和 Medicaid 项目采用
              FHIR API。2024 年 Minimum Staffing Final Rule 要求 SNF 维持最低 人员配比，推高劳动力成本，也带动能记录并优化人员合规的工作流自动化软件需求。

              Medicare 和 Medicaid 向价值型护理（VBC）转型，是第三个长期驱动。Medicare Advantage（MA）登记人数在多个州超过 Traditional Medicare
              后，支付方越来越要求 SNF 伙伴共享质量数据、接入护理网络并衡量结果指标——PointClickCare 平台正能提供这些能力。CMS 的目标是到 2030 年让所有 Medicare
              受益人进入责任制护理关系。

              关键市场约束包括：（1）受监管医疗行业销售周期和实施时间长；（2）SNF 长期劳动力短缺，限制技术采用能力；（3）Medicaid 报销占比高，给机构利润率施压；（4）小型/独立 SNF
              运营商价格敏感，可能抵触企业级 SaaS 定价；（5）Real Time Medical Systems 信息阻断裁定可能削弱 PointClickCare 把数据访问控制用作竞争护城河的能力。
