      - number: '5.4'
        title: 部署、集成与路线图
        blocks:
          - type: paragraph
            body: >
              PointClickCare 以纯云 SaaS 形式部署，不提供本地部署选项。单机构部署通常需要 60–90 天，大型多站点连锁需要 6–18 个月，时间主要由数据迁移、员工培训和监管报告集成要求决定。对于 10
              家以上机构的账户，公司提供专门实施服务和客户成功经理。

              集成可靠性由 99.9%+ SLA 支撑（企业医疗 SaaS 的行业标准），背后是 Azure 多区域冗余。平台支持基于角色的访问控制、多因素认证，并对所有 EHR 访问和变更保留完整审计日志。Trust
              Center（trust.pointclickcare.com）向客户实时提供安全和合规文档，满足供应商准入要求。

              2026–2027 年产品路线图聚焦四件事：（1）把 Advisor Suite 扩展到更多工作流模块；（2）为 Next-Gen Practitioner EHR 加深 AI
              能力；（3）扩展到居家医疗和居家护理工作流（相对 MatrixCare，历史上较弱）；（4）进一步开发价值医疗和支付方分析模块。关键技术挑战在于，把 Collective Medical 和 Audacious
              Inquiry 整合到单一统一数据平台上，同时保持 30,000+ 家活跃客户机构的运营稳定。
