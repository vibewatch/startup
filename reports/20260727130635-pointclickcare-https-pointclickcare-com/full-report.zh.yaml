      - number: '8.3'
        title: 牛市 / 基准 / 熊市情景
        blocks:
          - type: paragraph
            body: >
              牛市情景（$6.5–8B 估值，12–15x EV/Revenue）：假设确认 $600–700M+ USD 收入基线，NRR 达 115–120%，2026 年 Q3–Q4 以医疗 SaaS 溢价倍数成功
              IPO，信息阻断诉讼在没有 OIG 罚款的情况下解决，且 Advisor Suite AI 产品到 2027 年在现有客户基础中渗透率达到 20%+。在该情景下，PCC 会像增长高峰期的 Veeva
              一样，作为优质垂直 SaaS 平台交易，数据网络创造可防御的复利价值。

              基准情景（$3.5–5B 估值，7–10x EV/Revenue）：假设收入在 $480–550M 区间，NRR 为 105–115%，2026–2027 年按医疗 SaaS 中位倍数完成
              IPO，信息阻断诉讼以有限罚金和解，Advisor Suite 获得中等牵引力。根据现有证据，这是最可能情景，也对应当前二级市场定价区间。

              熊市情景（$2–3.5B 估值，4–7x EV/Revenue）：假设收入更接近 $480M CAD 基线，OIG 执法带来重大罚款，IPO 延迟或撤回，NRR 低于 105%，Epic 和 MatrixCare
              竞争压力加速市占率侵蚀，且 AI 产品发布出现复杂问题。在该情景下，PCC 会作为成熟、低增长医疗 IT 平台交易，缺少溢价倍数支撑。

              概率信号：当前证据最支持基准情景。牛市情景需要确认更高收入基线并解决诉讼。熊市情景需要多个反向事件同时兑现——概率低，但鉴于信息阻断敞口，并非可以忽略。
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
          - type: table
            tableRef: TV003
            claimRefs:
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 退出准备度与 IPO 路径
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 7 月，PointClickCare 的 IPO 准备度标志包括：（1）已向 SEC 保密提交 S-1（报道时间为 2024–2025 年）；（2）CFO 任命（Nicolette
              Turner，2025 年 5 月）显示公司在为上市公司披露要求搭建财务组织；（3）2026 年 5 月 Taylor Rhodes 加入后，董事会独立性改善；（4）连续七次获得 KLAS Best in
              KLAS，为机构营销叙事提供强支撑；（5）HITRUST + SOC 2 Type II 为机构投资者尽调提供网络安全合规凭证。

              准备度缺口：（1）CFO 任期较短（若 2026 年中执行 IPO，则只有 14 个月）——投资者关系和路演经验可能有限；（2）2024 年 7 月数据泄露要求在 S-1 中强制披露，并会成为 IPO
              路演问答焦点；（3）信息阻断裁决是一项待决法律事项，必须披露，也可能让带有 ESG 治理要求的机构投资者担忧；（4）收入基线冲突（$480M CAD 与 $673M USD）必须在 S-1
              中解决，才能形成干净的财务叙事。

              PE 退出结构：H&F 和 JMI Equity 会寻求在 IPO 时获得有意义的流动性。一级发行与二级出售的比例，会影响 IPO 后流通盘和投资者观感。如果二级出售比重过高（创始人和 PE 在 IPO
              时出售），会释放内部人对近期上行空间信心不足的反向信号。一级 / 二级混合发行更有利于市场接受。

              IPO 后交易动态将受医疗科技板块情绪、利率环境，以及 SaaS 倍数扩张 / 压缩影响。按 $5B 估值，PCC 将以中大型市值医疗 IT 公司身份进入公开市场，可能纳入 Russell 1000 和 S&P
              医疗保健指数，从而支撑机构买盘。
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV022
