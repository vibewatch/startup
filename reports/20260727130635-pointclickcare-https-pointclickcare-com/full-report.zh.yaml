        - 投资逻辑破裂：领导层风险显著上升；客户不确定性
      - - CMS 报销改革——PDPM 重组
        - FY2027 SNF PPS 拟议规则对 PDPM 作出重大调整
        - Medicare 净费率削减 >5%，或 PDPM 结构性改革
        - 重审投资逻辑：SNF 运营商收入承压 → PCC 定价承压
      - - Epic 全面进入 SNF EHR 市场
        - Epic 宣布推出完整 SNF/LTC EHR 产品
        - Epic 从 PCC 手中拿下 3+ 个前 10 大 SNF 连锁账户
        - 投资逻辑破裂：护城河加速侵蚀；市场份额承压
      - - 影响 PCC 的 Azure 重大故障
        - Azure 导致 PCC 宕机 >8 小时
        - CMS MDS 提交窗口期宕机，导致客户申报延误
        - 重审投资逻辑：运营韧性缺口；客户信任受损
    notes: 否决标准是基于截至 2026 年 7 月风险分析的定性阈值；正式尽调应与 PCC 管理层自有的否决标准框架核对。
