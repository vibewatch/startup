      - number: '7.4'
        title: 合作伙伴、依赖与财务风险
        blocks:
          - type: paragraph
            body: >
              PointClickCare 的合作伙伴和依赖风险集中在两个维度：（1）对 Microsoft Azure 的基础设施依赖，这是一项关键单一供应商关系，且没有披露多云备份；（2）客户集中在顶级 SNF
              连锁企业分层，少数大型账户流失就可能对收入造成不成比例的影响。

              财务风险集中在 PE 所有权结构和 IPO 执行。Hellman & Friedman（自 2021 年起为少数股投资者）和 JMI Equity 合计持有重要股权。随着 PE
              投资周期走向成熟，流动性事件压力会越来越大，路径可能是 IPO，也可能是战略出售。保密 S-1 申报显示 IPO 准备正在推进，但市场环境（医疗科技倍数、利率环境）、SEC
              审核时间线和投资者胃口，都会带来重大执行不确定性。

              如果 IPO 延迟或撤回，PE 投资者可能追求替代流动性方案（二级转让、PE recap 或战略
              M&A），从而引入管理层扰动、估值下行或战略方向变化。与战略收购方（Epic、Oracle、Microsoft）的任何大型 M&A 交易，都可能根本改变 PointClickCare 的竞争定位。

              收入模型风险：PointClickCare 订阅收入与机构运营状态绑定。SNF 关闭（由人员短缺、Medicare 报销偏低或运营商财务困境驱动）会减少活跃机构数量。美国 SNF
              市场正在整合，小型独立机构关闭率更高。虽然 PCC 可以通过上行销售提高单机构收入，但总体可触达机构数量在温和下降。
