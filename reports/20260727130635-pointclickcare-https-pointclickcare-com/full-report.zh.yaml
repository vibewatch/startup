              - CP022
              - CP023
      - number: '3.5'
        title: 竞争位置评估与不利信号
        blocks:
          - type: paragraph
            body: >
              2026 年，PointClickCare 仍拥有可防守的竞争护城河，支撑来自受监管医疗场景中 EHR 平台采用的结构性粘性。公司在 SNF 的主导市占率、 KLAS
              领先地位和平台功能广度，使其在核心市场具备强竞争位置。

              但几项不利竞争信号需要持续跟踪：（1）2025 年 Real Time Medical Systems v. PointClickCare 法院裁定侵蚀了 PointClickCare 护城河
              的一个维度——限制第三方分析厂商访问数据的能力。裁定为 Real Time Medical 等竞争者和其他分析提供商打开通道，让它们访问 PointClickCare
              的数据网络并提供竞争性分析产品。（2）MatrixCare 背后有 ResMed 支持，长期资本足以维持竞争投入。（3）Epic 的 急性后期扩张虽处早期，但在卫生系统整合加速时必须监测。（4）2026
              年用户评论负面评价近期 UI 更新，若易用性恶化，可能带来近期 流失风险。（5）面向 SNF 工作流自动化的 AI 原生创业公司（规模较小但融资充足）可能以点解决方案绕过已安装 EHR 基础，构成潜在颠覆威胁。
