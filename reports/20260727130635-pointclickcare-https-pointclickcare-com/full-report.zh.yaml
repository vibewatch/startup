      - number: '7.6'
        title: 缓释措施、终止标准与尽调路径
        blocks:
          - type: paragraph
            body: >
              PointClickCare 最可执行的风险缓释措施和推翻论点触发点如下。针对信息阻断风险：跟踪 Real Time Medical Systems
              案件发回后的结果；若最终判决施加禁令救济或罚款，将构成重大不利进展。OIG 若因信息阻断对 PointClickCare 采取执法行动，将触发推翻论点。

              针对网络安全风险：在正式尽调中索取 2024 年 7 月泄露后的事件取证报告。核实 HITRUST 再认证日期和范围。测试事件响应流程。IPO 前 12 个月窗口内若发生第二次重大泄露，将触发推翻论点。

              针对 IPO 执行风险：确认 S-1 申报时间线、承销商参与和管理层路演准备度。如果 IPO 延迟到 2026 年 Q4 之后，需要评估 PE 压力是否会催生战略 M&A
              替代方案。在低迷倍数下被迫战略出售，会对以当前二级市场价格买入的投资者构成风险。

              针对关键人物风险：核实 Dave Wessinger 和 CFO 的继任计划及雇佣协议。评估下一任 CFO 任期是否稳定。IPO 前后 12 个月内 CEO 离任，将触发推翻论点。

              针对 CMS 监管风险：应跟踪 FY2027 SNF PPS 规则（预计 2026 年 8 月），看是否出现重大支付削减。CMS 已通过 SNF Value-Based
              Purchasing（VBP）项目释放价值医疗方向信号；PointClickCare 平台总体位置较好，但任何重大 PDPM 重构都可能要求昂贵的平台更新。
