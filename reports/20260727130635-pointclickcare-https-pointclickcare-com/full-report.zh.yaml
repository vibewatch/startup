      - number: '6.2'
        title: 具名客户验证与案例研究
        blocks:
          - type: paragraph
            body: >
              PointClickCare 已在客户基础中发布多项客户案例研究和推荐。最强的具名推荐包括：

              Marquis Companies（俄勒冈州 LTPAC，多机构）：已发布案例研究显示，使用 PointClickCare 和 Collective Medical 集成后，医院再入院率下降
              60%。这是公司营销中最常引用的量化结果指标之一，也是带有临床结果证据的高质量生产环境推荐。

              American Senior Communities（ASC）：印第安纳州 102 家机构的 SNF 连锁。ASC 已将 PointClickCare 标准化为核心 EHR
              平台，并使用该平台的集成生态市场（包括用于转诊管理的 Olio）支持照护转衔。ASC 是大型企业、高信任度客户推荐。

              Fort Hudson Nursing Center：已发布推荐称，PointClickCare EHR 实施后，纸质临床流程减少超过 75%。

              Forrester Consulting Total Economic Impact 研究（由 PointClickCare 委托）显示，Skilled Nursing Solution 带来 418% 三年
              ROI，三年总收益 $1.3M，包括减少护理记录时间（$698K）、避免 PDPM 罚金（$397K）、降低员工流失（$126K）和提升运营效率（$53K）。回收期不到六个月。

              这些具名推荐质量较高（生产环境部署且有量化结果），但多数来自 PointClickCare 自有营销材料，而不是独立第三方验证。例外是 Forrester TEI 研究；虽由公司委托，但方法论可信。
