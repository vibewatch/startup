callouts:
  - calloutType: strength
    title: "Secular Demographic Tailwind Creates Multi-Decade Growth"
    body: >
      The U.S. 85+ population—the primary SNF and post-acute care user—is the fastest-growing
      demographic cohort. With baby boomers turning 80 in 2026, demand for skilled nursing and
      senior care will accelerate through the 2030s. This is the most durable demand driver in
      PointClickCare's market and creates a long-visibility growth runway that is relatively
      insensitive to economic cycles.
    claimRefs: [CM020, CM021]

  - calloutType: risk
    title: "SNF Facility Closures Reduce Total Addressable Facilities"
    body: >
      Higher labor costs from staffing mandates, Medicare Advantage rate pressure, and the
      ongoing aftermath of COVID-19 occupancy disruption have contributed to elevated SNF
      closure and consolidation rates in 2024–2026. A shrinking total facility count reduces
      the new-logo opportunity and may increase dependency on upsell/cross-sell within existing
      customers. Concentration among large chains (top 10 chains control ~20% of SNF beds)
      creates counterparty risk.
    claimRefs: [CM025, CM026, CM029]

  - calloutType: insight
    title: "Value-Based Care Transition Expands Revenue Per Facility"
    body: >
      As facilities move into value-based care contracts with Medicare Advantage plans and
      ACOs, they require analytics, care-transition, and network management tools that go
      beyond basic EHR functionality. PointClickCare's acquisitions of Collective Medical and
      Audacious Inquiry have positioned it to capture this next layer of spend—potentially
      doubling revenue per customer from basic EHR (~$40–60K/yr) to full care-platform
      (~$80–120K+/yr).
    claimRefs: [CM023, CM024, CM003]

