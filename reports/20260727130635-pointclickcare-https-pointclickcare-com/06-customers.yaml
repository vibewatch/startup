figures:
  - id: FU001
    title: "Customer Journey Map"
    type: journey-map
    summary: >
      Customer journey stages from initial awareness through procurement, onboarding,
      steady-state operations, expansion, and renewal for a typical PointClickCare SNF customer.
    data:
      items:
        - label: "Awareness"
          description: "SNF operator identifies EHR need via CMS compliance pressure, peer referral, or KLAS research. PointClickCare is default shortlist candidate."
        - label: "Evaluation"
          description: "RFP process 3–12 months; evaluation criteria: regulatory compliance, KLAS ranking, peer references, integration breadth, and TCO."
        - label: "Procurement"
          description: "3–5 year enterprise contract signed; implementation plan and data migration scope defined. Typical deal size $50K–$200K setup + recurring SaaS."
        - label: "Implementation"
          description: "60–90 days single facility; 6–18 months multi-site. Staff training, data migration, MDS integration, pharmacy/lab setup."
        - label: "Steady-State"
          description: "Daily clinical EHR use, billing automation, regulatory reporting, care coordination flows active. High switching cost embedded at this stage."
        - label: "Expansion"
          description: "Upsell to care coordination analytics, Advisor Suite AI modules, payer analytics. Average 10–20% ARPU expansion over contract term."
        - label: "Renewal"
          description: "3–5 year contract renewal; high retention driven by regulatory lock-in, staff training investment, and data network dependency."
    claimRefs: [CU003, CU005, CU012, CU013, CU018, CU019]

