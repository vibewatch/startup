callouts:
  - calloutType: strength
    title: "Marquis Companies and Forrester TEI Data Demonstrate Quantified Clinical and Financial ROI"
    body: >
      PointClickCare's strongest customer evidence combines clinical outcomes (60% readmission
      reduction at Marquis Companies) with financial ROI validation (418% three-year ROI from
      Forrester TEI). These are high-quality, production-stage references with quantified outcomes.
      The Forrester methodology — even if commissioned — uses credible customer interviews and
      provides a reproducible ROI framework that buyers can adapt to their own facilities.
    claimRefs: [CU007, CU010, CU011]

  - calloutType: risk
    title: "NRR and Churn Not Publicly Disclosed — Critical Diligence Gap"
    body: >
      PointClickCare does not publicly disclose net revenue retention, gross churn, or cohort
      retention data. For a SaaS business in IPO preparation, this is a notable transparency
      gap. These metrics are typically disclosed in S-1 filings and are the primary indicators
      of customer base health. Until these are available, customer retention quality remains
      supported only by structural analysis, not confirmed data.
    claimRefs: [CU025, CU026, CU027]

  - calloutType: risk
    title: "2026 G2 User Reviews Flag UI Update Disruption"
    body: >
      Multiple 2026 G2 user reviews cite the recent PointClickCare UI update as causing
      productivity disruption and workflow friction. While UI updates are common in SaaS
      platform evolution, healthcare workflow disruption in a 24/7 clinical environment has
      higher stakes than in typical enterprise software. This adverse signal should be monitored
      in diligence for any near-term churn or renewal negotiation impacts.
    claimRefs: [CU028, CU029]

