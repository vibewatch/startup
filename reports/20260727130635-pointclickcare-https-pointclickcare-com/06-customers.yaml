company:
  name: "PointClickCare"
chapter:
  number: 6
  title: "Customers"
  summary: >
    PointClickCare serves 30,000+ provider organizations across North America, representing
    approximately 60–80% of the U.S. skilled nursing facility (SNF) market. The customer base
    spans the full spectrum of LTPAC operators: large multi-site SNF chains (nine of ten largest),
    assisted living communities, continuing care retirement communities (CCRCs), and home health
    agencies. Retention is structurally strong: 3–5 year contracts, deep EHR workflow integration,
    regulatory reporting dependencies, and an estimated <5% churn rate. A Forrester TEI study
    documents 418% ROI over three years for SNF customers. The primary adverse signal is the
    Real Time Medical Systems ruling, which may affect data-sharing dynamics and third-party
    analytics options for customers.

sections:
  - id: S-U-01
    title: "Customer Base Segmentation"
    body: >
      PointClickCare's customer base is segmented into four primary buyer types: (1) Large
      multi-site SNF chains (50+ facilities) — enterprise accounts representing the highest
      revenue concentration; nine of the ten largest U.S. SNF chains are PointClickCare customers.
      (2) Mid-market SNF operators (10–50 facilities) — the largest segment by count, typically
      buying the core EHR with billing and analytics modules. (3) Small independent SNFs and
      assisted living facilities (<10 facilities) — the broadest segment by facility count,
      buying primarily the core EHR at lower pricing tiers. (4) Home health and hospice agencies —
      a growing but historically under-penetrated segment where MatrixCare leads.

      Geographically, PointClickCare's customer base is predominantly U.S.-based (~85–90% of
      revenue) with a meaningful Canadian presence (home market, founded in Mississauga, Ontario).
      The platform does not appear to have significant international presence outside North America
      as of 2026. The primary use cases driving adoption are: (1) Medicare/Medicaid regulatory
      compliance (MDS, PDPM), making EHR adoption mandatory; (2) billing automation and revenue
      cycle management; (3) care coordination and care transition management across acute and
      post-acute settings; and (4) AI-powered workflow automation (emerging, Advisor Suite 2026).

      The revenue composition by segment is not publicly disclosed, but the concentration in
      large enterprise chains (9 of top 10) implies meaningful revenue concentration in the top
      tier of accounts. The company's Forrester Total Economic Impact study found that SNF
      customers average $1.3M in benefits over three years from the platform.
    claimRefs: [CU001, CU002, CU003, CU004, CU005]
    tableRefs: [TU001, TU002]
    figureRefs: [FU002]

  - id: S-U-02
    title: "Named Customer Proof and Case Studies"
    body: >
      PointClickCare has published multiple customer case studies and references across its
      customer base. The strongest named references include:

      Marquis Companies (Oregon-based LTPAC, multiple facilities): Published case study
      demonstrating a 60% decrease in hospital readmissions using the PointClickCare and
      Collective Medical integration. This is one of the most cited quantified outcome metrics
      in the company's marketing and represents a high-quality, production reference with
      clinical outcome evidence.

      American Senior Communities (ASC): 102-facility Indiana-based SNF chain. ASC has standardized
      on PointClickCare as its core EHR platform and has used the platform's integration
      marketplace (including Olio for referral management) for care transitions. ASC represents
      a large-enterprise, high-trust customer reference.

      Fort Hudson Nursing Center: Published reference citing over 75% reduction in paper-based
      clinical processes after PointClickCare EHR implementation.

      A Forrester Consulting Total Economic Impact study (commissioned by PointClickCare) found
      that the Skilled Nursing Solution delivers a 418% three-year ROI, comprising $1.3M in
      total benefits over three years from reduced nursing charting time ($698K), PDPM penalty
      avoidance ($397K), staff turnover reduction ($126K), and operational efficiency gains ($53K).
      The payback period was less than six months.

      These named references are of high quality (production deployments with quantified outcomes),
      though most are sourced from PointClickCare's own marketing materials rather than independent
      third-party validation. The exception is the Forrester TEI study, which while commissioned
      represents a credible methodology.
    claimRefs: [CU006, CU007, CU008, CU009, CU010, CU011]
    tableRefs: [TU003]
    figureRefs: [FU003]

  - id: S-U-03
    title: "Retention, Renewal, and Customer Satisfaction"
    body: >
      PointClickCare's customer retention is structurally reinforced by three mechanisms:
      (1) deep EHR workflow integration — MDS assessment automation, CMS reporting, state
      regulatory reporting, and billing are deeply embedded in daily operations making replacement
      extremely disruptive; (2) 3–5 year contract structures for enterprise accounts that lock in
      revenue and set high switching cost barriers; and (3) regulatory compliance dependency —
      operators cannot operate without an ONC-certified EHR for Medicare/Medicaid participation,
      creating a platform floor for retention.

      Third-party review sources and industry commentary estimate PointClickCare's annual churn
      at less than 5% of customer facilities, consistent with enterprise healthcare SaaS norms.
      KLAS scored PointClickCare at 84.0 for SNF/LTC and 83.4 for Senior Living in 2026 (KLAS
      scores above 80 are considered Best in Class). G2 users rate the Skilled Nursing Platform
      at 4.3/5 across 46 reviews as of 2026.

      NRR (net revenue retention) is not publicly disclosed. Based on the enterprise healthcare
      SaaS benchmark range of 110–120% and PointClickCare's active upsell motion (analytics,
      AI Advisor Suite, payer modules), a 110–120% NRR estimate is plausible. However, the
      recent UI update has received mixed user reviews, with some productivity complaints —
      suggesting a short-term retention risk if usability issues are not resolved.

      An adverse signal: negative reviews from some customers in 2026 specifically citing
      the UI update experience as disruptive. While this does not appear to have caused significant
      churn, it may affect renewal rates for smaller, less embedded accounts.
    claimRefs: [CU012, CU013, CU014, CU015, CU016, CU017]
    tableRefs: [TU004]
    figureRefs: [FU001, FU004]

  - id: S-U-04
    title: "Expansion and Concentration Risk"
    body: >
      PointClickCare's primary expansion motion is module upsell within the installed base:
      customers who adopt only the core EHR are cross-sold care coordination analytics
      (Collective Medical, Audacious Inquiry), the Advisor Suite AI products, and payer/VBC
      analytics modules. Given that 90%+ of PointClickCare's revenue is recurring subscription,
      the land-and-expand model is the primary growth driver within existing accounts.

      The key expansion risk is revenue concentration: with nine of ten largest U.S. SNF chains
      as customers, the enterprise segment represents significant revenue concentration. The
      loss of one or two large chain accounts could have a material revenue impact. No publicly
      confirmed large-account churn events have been identified as of July 2026, but the
      Real Time Medical Systems information-blocking ruling creates a scenario where large chains
      may demand more open data access or evaluate alternative analytics vendors.

      Channel dependence is limited: PointClickCare's go-to-market is primarily direct sales
      with enterprise account managers. The 375+ marketplace partners support co-sell and
      integration stickiness but do not represent a material customer acquisition channel.
      Government contracts (Audacious Inquiry + CNI) are a small but growing diversification
      into the public-sector customer base.

      Geographic concentration (U.S. and Canada) creates risk if U.S. SNF market consolidation
      or regulatory changes (e.g., CMS reimbursement reform) reduce the operator count or
      purchasing power of the core customer base.
    claimRefs: [CU018, CU019, CU020, CU021, CU022, CU023]
    tableRefs: [TU005]

  - id: S-U-05
    title: "Adverse Customer Signals and Diligence Questions"
    body: >
      Several adverse customer signals require monitoring during diligence. First, the Real Time
      Medical Systems v. PointClickCare ruling found that PCC's data-access restrictions likely
      violated the 21st Century Cures Act. For customers, this means that third-party analytics
      vendors — which some SNF operators prefer for specialized analytics — will gain expanded
      data access rights from PointClickCare. The ruling may reduce customers' incentive to
      upgrade to PointClickCare's own analytics products if comparable third-party alternatives
      become available.

      Second, G2 user reviews in 2026 explicitly cite the recent PointClickCare UI update as
      causing workflow disruption and productivity loss. While this is a common complaint during
      major EHR UI transitions, it creates a window of customer dissatisfaction that competitors
      could exploit.

      Third, the company does not publicly disclose NRR, churn rates, or cohort retention data —
      standard SaaS diligence metrics. Without these, it is impossible to independently verify
      the quality of the customer base. In formal diligence, these metrics are priority requests.

      Fourth, behavioral health and home health operators are underserved by PointClickCare's
      product set, representing segments where competitor platforms (Netsmart, MatrixCare) have
      product advantages. Diversified post-acute operators with significant home health or
      behavioral health components may prefer competing platforms.
    claimRefs: [CU024, CU025, CU026, CU027, CU028, CU029, CU030]

