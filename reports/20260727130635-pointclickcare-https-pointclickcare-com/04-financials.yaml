company:
  name: "PointClickCare"
chapter:
  number: 4
  title: "Financials"
  summary: >
    PointClickCare is a high-growth private SaaS healthcare technology company with an estimated
    revenue of $480M CAD (~$360M USD) per Globe and Mail data, while the company's own background
    materials cite $673M USD for 2024 — a material discrepancy attributable to definition differences
    (CAD vs. USD; total vs. platform-only). The business model is predominantly recurring-subscription
    with estimated gross margins of 70–75%, strong switching costs, and a manageable capital structure
    following $230M in disclosed equity raises plus undisclosed Hellman & Friedman secondary investment
    in 2021 that valued the company at ~$4B. The IPO pipeline (confidential S-1) is the primary exit
    mechanism for current investors.

sections:
  - id: S-I-01
    title: "Revenue Model and Revenue Streams"
    body: >
      PointClickCare generates revenue primarily through subscription-based SaaS fees for its
      cloud EHR, care-coordination, financial management, billing, and analytics modules. The
      revenue model is primarily per-bed/per-month or per-facility/per-month, with pricing
      negotiated by facility size and selected modules. Third-party sources estimate pricing
      at $300–$500 per user per month for the full platform, while per-facility estimates range
      from $500–$2,000/month for small facilities to $5,000–$15,000+/month for large 200-bed+
      facilities. Implementation fees, professional services, and training represent a smaller
      non-recurring component of revenue.

      The primary revenue streams are: (1) EHR subscription (core platform), estimated to
      represent ~60–65% of total revenue; (2) care-coordination analytics (Collective Medical
      and Audacious Inquiry-derived), estimated at ~20–25%; (3) payer and financial management
      modules ~10–15%; and (4) professional services/implementation ~5–10%. The recurring
      subscription component is estimated at 90%+ of total revenue, consistent with a mature
      SaaS business model. Revenue growth of 69% over three years (2021–2024) implies a
      CAGR of approximately 19% annually.

      The company's revenue is primarily denominated in USD (U.S. market) and CAD (Canadian
      operations). Globe and Mail's annual ranking data disclosed $480.3M CAD (~$355–360M USD at
      prevailing exchange rates) for 2024, based on public self-reported data for the ranking
      submission. The company's background information cites $673M USD, possibly reflecting
      a broader definition including Collective Medical and Audacious Inquiry. These figures are
      inconsistent and represent a key diligence gap — audited GAAP revenue figures are not public.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001, FI003]

  - id: S-I-02
    title: "GTM Motion and Sales Efficiency Proxies"
    body: >
      PointClickCare's go-to-market approach is enterprise direct sales to SNF operators,
      assisted living chains, and home health networks, supplemented by channel partnerships
      with pharmacy, lab, and RPM vendors in its 375+ marketplace. The sales cycle for large
      enterprise accounts (50+ facility chains) is typically 6–18 months given the deep
      integration requirements of EHR replacement. For mid-market accounts (10–50 facilities),
      cycles range 3–9 months.

      Customer acquisition cost (CAC) is not publicly disclosed but can be proxied from
      industry benchmarks for enterprise healthcare SaaS: $10,000–$30,000 per net new facility
      added. Assuming 30,000+ facilities and revenue of $480M, average revenue per facility
      is approximately $13,000–$16,000/year ($1,083–$1,333/month). At estimated gross margins
      of 70–75%, the gross margin per facility is ~$9,000–$12,000 per year. Payback on a
      $15,000–$25,000 CAC would be approximately 18–30 months, consistent with enterprise SaaS norms.

      Key efficiency drivers include: (1) low churn (<5% estimated) from deep EHR workflow
      integration and regulatory compliance reporting dependencies; (2) upsell motion through
      the analytics and value-based care module portfolio; (3) a partner marketplace that drives
      stickiness and indirect co-sell revenue from integrated vendors; and (4) the KLAS #1
      ranking that functions as an external validation signal in procurement.
    claimRefs: [CI007, CI008, CI009, CI010, CI011]
    tableRefs: [TI003]
    figureRefs: [FI002]

  - id: S-I-03
    title: "Cost Structure and Margin Profile"
    body: >
      As a cloud SaaS business, PointClickCare's cost structure is dominated by: R&D (estimated
      12–18% of revenue based on comparable vertical SaaS companies), sales & marketing (~20–25%
      of revenue), general & administrative (~10–15%), and cost of revenue (cloud hosting,
      customer support, implementation services) (~25–30%). These benchmarks imply an operating
      margin (EBITDA) in the range of 15–30%, consistent with a mature vertical SaaS business
      at scale.

      Gross margin is estimated at 70–75% by third-party analysts, reflecting the predominantly
      software subscription nature of revenue. However, the Collective Medical and Audacious
      Inquiry acquisitions introduced service-delivery and data-infrastructure costs that may
      have modestly diluted gross margins from a pure EHR-only baseline. The two acquisitions
      together cost an estimated $900M–$1.1B, introducing significant amortization of intangible
      assets on the balance sheet.

      PointClickCare has ~2,400 employees (per Globe and Mail 2024 data) with revenue per
      employee of approximately $200,000 CAD (~$149,000 USD), which is modest relative to
      pure-play SaaS peers but reasonable for healthcare software with significant services
      and support operations. R&D headcount likely represents 40–50% of total employees given
      the platform-unification strategy underway. Capital expenditure is relatively low for a
      cloud SaaS company; principal capex is cloud infrastructure and data center costs, likely
      <5% of revenue.
    claimRefs: [CI012, CI013, CI014, CI015, CI016]
    tableRefs: [TI004]

  - id: S-I-04
    title: "Public Traction and Private Metric Gaps"
    body: >
      PointClickCare's publicly available operational metrics include: 30,000+ provider
      organizations, 150M+ patient lives in its data network, 2,700+ hospital connections,
      375+ marketplace partners, and a 7th consecutive KLAS #1 ranking. Revenue per employee
      (~$200K CAD/year) and the 69% three-year revenue growth rate (2021–2024) are self-reported
      via the Globe and Mail Top Growing Companies submission.

      Key private metrics that are unavailable without formal disclosure include: (a) audited
      GAAP revenue by segment, (b) net revenue retention rate, (c) ARR by product line,
      (d) gross and net churn rates, (e) customer lifetime value, (f) cost of customer acquisition
      by channel, (g) EBITDA and operating income, (h) free cash flow and cash on hand, and
      (i) debt obligations, including any leveraged buyout debt associated with Hellman &
      Friedman's 2021 secondary transaction. The confidential S-1 filing in 2024–2025 suggests
      these metrics will eventually be disclosed, but they remain unavailable for diligence.

      A material discrepancy exists between the Globe and Mail-reported revenue of $480.3M CAD
      (~$360M USD) and the $673M USD figure cited in the company background brief. This gap
      may reflect: (1) different years, (2) CAD vs. USD, (3) different revenue definitions
      (platform-only vs. consolidated), or (4) inclusion/exclusion of acquired entities. This
      discrepancy is a diligence blocker for financial modeling.
    claimRefs: [CI017, CI018, CI019, CI020, CI021, CI022]
    tableRefs: [TI005]

  - id: S-I-05
    title: "Capital Adequacy and Financing Dependency"
    body: >
      PointClickCare has raised approximately $283M in disclosed equity rounds: $50M from
      JMI Equity (2011), $1.88M (2016), $85M from Dragoneer/JMI (2017), and $146M from
      Dragoneer (2018). The 2021 Hellman & Friedman investment was a secondary transaction
      (H&F purchasing existing shares from founders/early investors) rather than a primary
      capital raise, meaning no new cash was injected into the company's balance sheet at that
      time. The company thus relies on its own operating cash flow and any credit facilities
      for operational capital.

      The $650M Collective Medical acquisition (2020) and the $250M–$400M Audacious Inquiry
      acquisition (2022) required significant capital. These were funded through a combination
      of operating cash, potential credit facility drawdowns, and possibly secondary transactions.
      Given that the H&F secondary was in January 2021 (between the two acquisitions), it is
      possible that H&F provided debt or credit facility support as part of the overall
      transaction structure.

      Capital adequacy appears adequate given the recurring revenue model (~90%+ SaaS), high
      gross margins (70–75%), and strong customer retention. The IPO trajectory (confidential
      S-1 filed) suggests management and investors view public market access as the next capital
      event. However, an outstanding information-blocking court ruling and market timing risks
      create potential delays. No publicly disclosed debt maturity schedule or covenant concerns
      have been identified, but this data is unavailable for private companies.
    claimRefs: [CI023, CI024, CI025, CI026, CI027, CI028]
    figureRefs: [FI004]

  - id: S-I-06
    title: "Financial Verdict: Revenue Quality, Margin Path, and Diligence Blockers"
    body: >
      PointClickCare presents as a high-quality recurring-revenue SaaS business with structural
      characteristics that support premium valuation: mission-critical software, deep workflow
      integration, high switching costs, regulatory compliance lock-in, and a dominant market
      position. The estimated 70–75% gross margin and <5% churn are consistent with the upper
      range of vertical SaaS performance.

      However, several material diligence blockers must be resolved before financial modeling
      can be completed: (1) the $480M vs. $673M revenue discrepancy requires reconciliation
      — the higher figure, if GAAP-audited, would imply an EV/Revenue multiple of ~6× at $4B
      valuation (attractive); at $480M USD, it would be ~8× (fair to stretched); (2) absence
      of audited financials, EBITDA disclosure, or cash flow statements makes it impossible to
      confirm margin claims; (3) lack of leverage/debt disclosure creates opacity around the
      true net debt position post-acquisitions; and (4) the Real Time Medical Systems court
      ruling may have ongoing financial implications (potential remediation costs, API access
      infrastructure, competitive pressure on data-monetization revenue).

      The financial quality score is high for the subscription/retention characteristics
      but medium-low for transparency, given private company disclosure constraints. The
      IPO pathway, if executed, will resolve these gaps.
    claimRefs: [CI029, CI030, CI031, CI032, CI033, CI034, CI035]

