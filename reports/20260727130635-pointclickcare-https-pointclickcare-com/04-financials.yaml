callouts:
  - calloutType: strength
    title: "90%+ Recurring Revenue with <5% Churn Creates Predictable Cash Flow"
    body: >
      PointClickCare's SaaS subscription model, with an estimated 90%+ recurring revenue
      mix and less than 5% annual customer churn, creates a highly predictable cash flow
      profile. Combined with 70–75% estimated gross margins and deep EHR workflow integration,
      the business should generate substantial free cash flow at its scale, supporting both
      debt service capacity and future product investment without relying on new equity.
    claimRefs: [CI011, CI013, CI014]

  - calloutType: risk
    title: "Material Revenue Discrepancy Requires Reconciliation Before Modeling"
    body: >
      A $293M gap between the Globe and Mail-reported $480M CAD ($360M USD) revenue figure
      and the $673M USD figure from company background materials represents a ~87% discrepancy.
      Until this is reconciled with audited GAAP financials, revenue-based valuation models
      carry significant uncertainty. This is the primary financial diligence blocker.
    claimRefs: [CI017, CI018, CI019, CI022]

  - calloutType: risk
    title: "Unknown Debt Load from Acquisition Activity is an Adverse Signal"
    body: >
      The ~$900M–$1.1B total acquisition spend on Collective Medical and Audacious Inquiry,
      against disclosed primary equity raises of ~$283M, implies significant acquisition financing
      from credit facilities or debt. The absence of any public balance sheet disclosure makes
      it impossible to assess true net leverage — a material gap for diligence.
    claimRefs: [CI025, CI026, CI027, CI028]

