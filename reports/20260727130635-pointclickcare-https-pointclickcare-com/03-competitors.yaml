callouts:
  - calloutType: strength
    title: "7× KLAS Best in KLAS and 60–80% SNF Market Share are Durable Moats"
    body: >
      The combination of dominant installed-base market share, 7 consecutive KLAS #1 rankings
      in SNF/LTC, and the network effect of 30,000+ connected providers creates a self-reinforcing
      moat. Procurement decisions at SNF chains are heavily influenced by KLAS rankings and peer
      references, making PointClickCare the default choice in most competitive evaluations.
    claimRefs: [CP001, CP002, CP005]

  - calloutType: risk
    title: "Information-Blocking Ruling Erodes Data-Access Moat"
    body: >
      The 2025 Real Time Medical Systems court ruling forces PointClickCare to allow third-party
      analytics vendors access to its data network. This is a meaningful competitive vulnerability:
      PointClickCare's data breadth was a structural advantage against analytics competitors.
      If that access must now be shared broadly, competing analytics products can potentially
      offer comparable insights without requiring the full EHR platform, weakening the upsell
      and retention argument.
    claimRefs: [CP024, CP025, CP026]

  - calloutType: recommendation
    title: "Assess MatrixCare's ResMed-Backed Competitive Investment Rate"
    body: >
      ResMed's public-company resources give MatrixCare a significant capital advantage vs.
      PointClickCare's PE-backed structure. Diligence should assess MatrixCare's R&D investment
      rate, product roadmap advancement, and home health/hospice market share gains in 2024–2026
      to understand if the competitive gap is narrowing in key sub-segments.
    claimRefs: [CP010, CP011, CP012]

