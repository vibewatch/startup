callouts:
  - calloutType: strength
    title: "Dominant SNF Market Share Creates Deep Moat"
    body: >
      Serving 60–80% of U.S. skilled nursing facilities with a deeply embedded SaaS platform
      creates exceptional switching costs. Long onboarding cycles, regulatory compliance
      workflows, and staff training dependencies make displacing PointClickCare from an established
      facility extremely difficult, supporting high NRR and predictable subscription revenue.
    claimRefs: [CO022, CO024, CO025]

  - calloutType: risk
    title: "Information-Blocking Litigation Sets Adverse Legal Precedent"
    body: >
      The 2025 4th Circuit ruling in Real Time Medical Systems v. PointClickCare found the
      company likely violated the 21st Century Cures Act's information-blocking provisions.
      This adverse ruling exposes the company to further regulatory scrutiny, potential fines
      up to $1M per violation, and challenges its ability to use data-access controls as
      a competitive moat—a risk that must be weighed in any IPO valuation.
    claimRefs: [CO033, CO034]

  - calloutType: recommendation
    title: "Obtain Audited Financials Before IPO Valuation"
    body: >
      Revenue estimates range from $480M to $673M across sources, and gross margin, NRR, and
      ARR composition are not publicly disclosed. Any serious diligence or IPO participation
      requires access to audited GAAP financials, recurring vs. services revenue split, and
      customer concentration data. The confidential S-1 filing makes this accessible to
      registered investors in the IPO process.
    claimRefs: [CO026, CO027]

  - calloutType: insight
    title: "Dual CFO Appointments Signal Accelerated IPO Readiness"
    body: >
      The appointment of Brian Gannon (December 2024) followed quickly by Nicolette Turner
      (May 2025) as CFO, combined with board additions like Taylor Rhodes (May 2026), suggests
      active and accelerating preparation for a public market event. The pace of executive
      appointments at the C-suite and board level is consistent with a 12–18 month IPO horizon
      from mid-2026.
    claimRefs: [CO010, CO011, CO014]

