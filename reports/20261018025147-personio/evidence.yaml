evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding
    missingEvidence: An official cap-table or corporate-history document that definitively names the full founding roster.
    whyItMatters: Founder identity supports founder-market-fit analysis and affects later leadership/governance attribution.
    diligencePath: >-
      Request the current corporate history / leadership deck or formation documents from management and reconcile them
      against public profiles.
    relatedQuestionRefs:
      - QO002
      - QO004
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: operating-scale
    missingEvidence: A management-confirmed current employee count with date stamp and reporting basis.
    whyItMatters: Headcount is a key scale proxy and is already inconsistent across official and third-party sources.
    diligencePath: Request a board or monthly operating pack showing FTE headcount and geographic split as of 2026-09 or later.
    relatedQuestionRefs:
      - QO003
  - type: private-evidence-only
    severity: material
    topic: funding-and-valuation
    missingEvidence: Current cap table, investor rights, board-seat allocation, and any 2025-2026 secondary clearing data.
    whyItMatters: >-
      Public valuation headlines are contradictory and do not reveal control rights or the quality of the current
      pricing signal.
    diligencePath: >-
      Request the latest financing docs, option pool summary, shareholder register, and any recent secondary transaction
      memo.
    relatedQuestionRefs:
      - QO005
      - QO007
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: ARR, revenue, gross margin, burn, and cash runway disclosures for 2025-2026.
    whyItMatters: >-
      Without current financial outputs, the $8.5B valuation anchor and 2026 profitability commentary cannot be
      stress-tested.
    diligencePath: >-
      Request the audited financial statements plus a monthly SaaS KPI bridge covering revenue, ARR, gross margin, and
      burn.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-size
    missingEvidence: >-
      Independent 2026 European HRIS or SMB HR-software TAM, SAM, and SOM estimates with explicit methodology and spend
      denominators.
    whyItMatters: >-
      Without a defensible spend-based denominator, valuation work should not underwrite top-down market size claims
      from this chapter.
    diligencePath: >-
      Add current analyst-market-data or public-company disclosure sources that isolate European SMB HRIS, payroll, or
      HCM spend with methodology notes.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: target-segment
    missingEvidence: >-
      A current company or independent disclosure reconciling whether Personio's real ICP is closer to 20-500 employees,
      11-1,000 employees, or the broader 10-5,000 historical range.
    whyItMatters: ICP width changes both serviceable-market sizing and the competitive set used in valuation.
    diligencePath: >-
      Validate current customer-size distribution from sales collateral, case-study mix, or management commentary rather
      than relying on mixed review-site framing.
    relatedQuestionRefs:
      - QM002
  - type: private-evidence-only
    severity: minor
    topic: buyer-committee
    missingEvidence: >-
      Module attach rates, average contract value by customer band, and signed budget-authority patterns across HR,
      finance, and legal.
    whyItMatters: These inputs determine how much of the adjacent planning, payroll, and EOR surface converts into realized spend.
    diligencePath: >-
      Request sales collateral, pricing proposals, or cohort-level customer references that show who signs and expands
      Personio deployments.
    relatedQuestionRefs:
      - QM003
      - QM004
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Itemized Personio quotes, renewal terms, and realized net pricing across Core/Core Pro and add-on modules.
    whyItMatters: >-
      Without closed-won quote evidence, the chapter can compare list and directional pricing but cannot quantify how
      much negotiated discounts narrow Personio's premium versus HiBob or Factorial.
    diligencePath: >-
      Collect current customer quotes or procurement benchmarks segmented by headcount, modules, contract length, and
      geography.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-disclosure
    missingEvidence: Current ARR, gross margin, NRR, CAC, payback, burn, and current cash balance by major product line.
    whyItMatters: >-
      Without those metrics, underwriting cannot distinguish healthy software expansion from growth supported by
      discounting, services intensity, or capital burn.
    diligencePath: Request current board KPI pack, monthly management accounts, and cohort-level sales-efficiency reporting.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Current quote sheets, implementation SOWs, discount schedules, and paid-module attach by customer segment.
    whyItMatters: Public list anchors conflict and do not show realized net price, renewal uplift, or gross-to-net revenue quality.
    diligencePath: Request recent signed order forms for SMB, mid-market, and multi-country customers plus renewal histories.
    relatedQuestionRefs:
      - QI001
      - QI002
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, debt facilities, covenant package, and management runway scenario to the next financing or liquidity
      event.
    whyItMatters: >-
      Historical funding depth does not prove present capital sufficiency, especially if growth, payroll expansion, or
      M&A spending is still cash consumptive.
    diligencePath: Request treasury summary, debt documents, and base / downside runway model from finance leadership.
    relatedQuestionRefs:
      - QI006
      - QI008
  - type: missing-source
    severity: material
    topic: ai-governance
    missingEvidence: >-
      Public EU AI Act conformity materials, model-governance documentation, or accuracy/error disclosures for AI
      Assistant, AI payslip parsing, and aurio-enabled recruiting workflows.
    whyItMatters: >-
      The chapter can confirm that AI features are marketed, but not whether high-risk employment use cases have the
      controls, assessments, or limitations needed for diligence comfort.
    diligencePath: >-
      Request the Trust Centre AI documentation pack, employment-AI risk assessments, and any customer-facing accuracy
      or human-override policies.
    relatedQuestionRefs:
      - QE007
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: architecture-and-reliability
    missingEvidence: >-
      Reference architecture, uptime/SLA history, incident disclosure, scalability benchmarks, and implementation
      telemetry.
    whyItMatters: >-
      Public evidence is strong on feature scope but weak on whether the platform's internals, observability, and
      reliability support larger or more regulated deployments.
    diligencePath: >-
      Request architecture diagrams, status history, uptime commitments, major-incident summaries, and deployment
      references segmented by customer size and geography.
    relatedQuestionRefs:
      - QE006
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Assigned evidence contains no direct developer-signal source such as public repository activity, package usage, or
      practitioner-community metrics.
    whyItMatters: >-
      Without a developer or practitioner proxy, the chapter cannot independently gauge API adoption, external builder
      engagement, or technical community pull.
    diligencePath: >-
      Request current API/developer-program metrics, public changelog cadence, partner build stats, and any community or
      certification-program disclosures.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: durability-gap
    missingEvidence: >-
      Cohort-level GRR, NRR, logo churn, renewal rate, contract length, and segment retention by core HR, payroll, and
      EOR.
    whyItMatters: >-
      Customer-count scale without durability metrics does not show whether Personio's installed base is sticky,
      efficiently expanding, or at risk of hidden churn.
    diligencePath: >-
      Request cohort retention tables, renewal dashboards, and product-attach by vintage from management or the data
      room.
    relatedQuestionRefs:
      - QU004
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      More named production customers with deployment details, quantified outcomes, and freshness newer than the 2022
      Mindful Chef quote.
    whyItMatters: Named proofs are the clearest bridge between logo-level demand and production, referenceable customer value.
    diligencePath: >-
      Ask for current reference customers by segment, signed case studies, and at least three live payroll or recruiting
      deployments.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: Top-customer concentration, partner-channel contribution, payroll/EOR revenue mix, and attach rates by module.
    whyItMatters: >-
      Expansion narratives can mask concentration or low-quality cross-sell if the customer and product mix is
      undisclosed.
    diligencePath: Request customer concentration schedules, partner-sourced pipeline mix, and module-level attach by account band.
    relatedQuestionRefs:
      - QU005
  - type: missing-source
    severity: material
    topic: country-payroll-coverage
    missingEvidence: >-
      A current country-by-country matrix showing where Personio runs native payroll, where it only exports data, and
      where EOR or third-party providers are required.
    whyItMatters: >-
      The largest residual underwriting risk is scope slippage across jurisdictions rather than absence of a core
      product.
    diligencePath: >-
      Request the live payroll coverage matrix, target-country implementation plan, and two customer references in
      matching jurisdictions.
    relatedQuestionRefs:
      - QR002
      - QR009
    relatedTableRefs:
      - TR001
      - TR002
  - type: missing-source
    severity: material
    topic: eor-service-terms
    missingEvidence: >-
      The current supported-country list, service-language commitments, and responsibility split between Personio and
      Remote for compliance, support, and escalation.
    whyItMatters: >-
      Remote dependence is manageable only if the legal and operating boundary is explicit before international hiring
      begins.
    diligencePath: Obtain current EOR documentation, support SLAs, and target-country exclusions directly from Personio and Remote.
    relatedQuestionRefs:
      - QR006
      - QR009
    relatedTableRefs:
      - TR001
      - TR003
  - type: private-evidence-only
    severity: material
    topic: renewal-economics
    missingEvidence: >-
      Real renewal cohorts, average realized uplift, module attach rates, and reference-customer evidence on reporting
      and performance-module satisfaction.
    whyItMatters: >-
      Opaque pricing and reported renewal friction can impair ACV quality and increase churn or downsell risk even if
      the product is adopted.
    diligencePath: >-
      Request anonymized renewal data, template commercial paper, and customer references that match the intended module
      mix and company size.
    relatedQuestionRefs:
      - QR005
      - QR009
  - type: missing-source
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Verified 2026 revenue, gross margin, retention, burn, and cash-generation disclosures tied to the profitability
      claim.
    whyItMatters: >-
      Without current operating metrics, the public record cannot test whether the 2022 valuation anchor remains
      defensible.
    diligencePath: >-
      Request current board or lender reporting, KPI definitions, and any investor updates that bridge Q1 2026
      profitability to full-year economics.
    relatedQuestionRefs:
      - QV003
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: >-
      Fresh financing or secondary pricing, current cap-table ownership, liquidation preferences, and investor-rights
      terms.
    whyItMatters: >-
      Entry discipline depends on knowing both today's clearing price and the downside asymmetry created by dilution or
      preference stacks.
    diligencePath: >-
      Obtain the current cap table, most recent financing documents, and any 2025 to 2026 shareholder-mark or
      secondary-trade evidence from the data room.
