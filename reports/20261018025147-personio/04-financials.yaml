  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: unit-economics-disclosure
      missingEvidence: Current ARR, gross margin, NRR, CAC, payback, burn, and current cash balance by major product line.
      whyItMatters: Without those metrics, underwriting cannot distinguish healthy software expansion from growth supported by discounting, services intensity, or capital burn.
      diligencePath: Request current board KPI pack, monthly management accounts, and cohort-level sales-efficiency reporting.
      relatedQuestionRefs: [QI004, QI008]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: pricing-transparency
      missingEvidence: Current quote sheets, implementation SOWs, discount schedules, and paid-module attach by customer segment.
      whyItMatters: Public list anchors conflict and do not show realized net price, renewal uplift, or gross-to-net revenue quality.
      diligencePath: Request recent signed order forms for SMB, mid-market, and multi-country customers plus renewal histories.
      relatedQuestionRefs: [QI001, QI002]
      relatedTableRefs: [TI002]
    - type: private-evidence-only
      severity: material
      topic: capital-adequacy
      missingEvidence: Current cash, debt facilities, covenant package, and management runway scenario to the next financing or liquidity event.
      whyItMatters: Historical funding depth does not prove present capital sufficiency, especially if growth, payroll expansion, or M&A spending is still cash consumptive.
      diligencePath: Request treasury summary, debt documents, and base / downside runway model from finance leadership.
