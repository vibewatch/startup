schemaVersion: "report-v2"
artifact: financials
slug: personio
runDate: 2026-10-18
company:
  name: Personio
chapter:
  number: 4
  title: Financials
  summary: >-
    Personio's public financial picture supports a broad, layered monetization model but not a
    clean underwriting case. Official and independent sources show per-employee subscription
    pricing, app upsell, payroll and partner-led international hiring, yet public evidence still
    omits ARR, gross margin, CAC/payback, burn, and current cash, leaving capital adequacy and
    revenue quality only partially observable.
sections:
  - id: monetization-architecture
    title: Monetization architecture and pricing transparency
    body: >-
      Personio clearly sells recurring HR software rather than project licenses, with the official
      website framing pricing as per-employee and modular. The current public anchor is "Starts from
      €7.60 per month/employee," but that is not a complete rate card: independent procurement
      coverage says buyers still receive tailored quotes, and third-party reviews cite lower or
      older entry bands such as €3-€5 per person or €3-€12 depending on plan coverage. That spread
      matters because it separates official list anchors from realized contract economics. Public
      evidence also shows monetization breadth beyond core HR: Recruiting, Payroll, Performance,
      Compensation, Surveys, and EOR are sold as add-ons or adjacent modules, while integrations
      and APIs deepen workflow lock-in and likely raise account value over time.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI009
      - CI012
      - CI013
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: traction-and-unit-economics-visibility
    title: Public traction exists, but unit economics remain mostly private
    body: >-
      Personio's public demand signals are directionally strong. The current platform page says the
      company is trusted by more than 16,000 companies, and independent coverage places the base
      above 15,000 customers with payroll adoption past 1,500 customers. Employsome also reports a
      first profitable quarter in Q1 2026, which is a constructive operating signal, but it is not
      a substitute for audited revenue quality. None of the retained public sources provide ARR,
      gross margin, NRR, CAC, payback, burn, or current cash. That leaves investors able to see
      market penetration and some product attach, but unable to test whether growth is efficient,
      whether support and implementation are margin dilutive, or whether payroll and EOR upsell are
      accretive at the gross-profit line.
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI009
      - CI012
      - CI013
      - CI014
    tableRefs:
      - TI003
  - id: capital-adequacy-and-underwriting-view
    title: Capital adequacy is the core diligence blocker
    body: >-
      Public evidence confirms that Personio has historically relied on large venture rounds, but
      it does not provide the balance-sheet facts needed to underwrite the next financing trigger.
      Forbes still anchors the company to the 2022 $8.5 billion round and $720 million cumulative
      funding, while a 2026 private-company tracker lists a lower $6.3 billion latest valuation and
      undisclosed 2025 round pricing. That inconsistency is manageable on its own; the harder issue
      is that the public pack still lacks current cash, debt, runway, covenant, and discounting
      detail. Procurement commentary also points to setup fees, annual commitments, and upgrade
      paths that can raise customer acquisition recovery periods. Net: Personio looks like a scaled
      recurring software business with monetization breadth, but not one whose margin path or
      capital sufficiency can be confidently underwritten from public evidence alone.
    claimRefs:
      - CI008
      - CI010
      - CI011
      - CI013
      - CI014
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - [Core HRIS subscription, "Recurring software subscription for Core/CorePro", "Per employee / month", "Official site shows per-employee pricing and Core/CorePro packaging", "High confidence on mechanism; low confidence on realized ASP", "Provide current SKU sheet, minimum contract size, and segment-level discount bands."]
      - [Add-on apps, "Upsell beyond base HRIS (Recruiting, Performance, Compensation, Surveys, related modules)", "Module add-on", "Public sources describe separately priced apps rather than one all-inclusive bundle", "Mechanism visible; attach rates undisclosed", "Provide paid module attach by customer cohort and renewal uplift."]
      - [Payroll, "Preliminary payroll on plan, native payroll in selected markets, integrations elsewhere", "Per employee / payroll workflow", "Payroll is positioned as a strategic moat and public traction signal, but public revenue contribution is undisclosed", "Visible product lever; margin contribution unknown", "Provide payroll revenue mix, country mix, and service/support cost profile."]
      - [International hiring / EOR, "Partner-mediated Employer of Record via Remote surfaced inside Personio", "Per worker / country contract", "Public sources confirm embedded EOR but not Personio's take rate", "Useful revenue adjacency; economics likely shared with partner", "Provide take rate, gross margin split, and attach rate versus core HR customers."]
      - [Integration ecosystem, "Marketplace/APIs deepen lock-in and can support cross-sell or higher-tier packaging", "Workflow / ecosystem attach", "By Apr 2022 Personio said 70% of customers used apps or APIs and the marketplace hit 100 integrations", "Historical proof of ecosystem pull, not direct revenue disclosure", "Provide monetized API / integration packaging and churn effect from ecosystem usage."]
    notes: "Rows mix official disclosures, independent reviews, and historical marketplace data; current revenue mix percentages are not public."
    claimRefs:
      - CI001
      - CI004
      - CI005
      - CI012
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Price / contract element
      - Public signal
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - ["Official entry price", "Starts from €7.60 per month/employee", "List anchor only", "No public full rate card or realized net price", "Personio homepage / pricing"]
      - ["Third-party low-end estimates", "€3-€5 per person / month", "Likely estimate or older plan reference", "Term, module scope, geography, and renewal terms unclear", "Employsome review"]
      - ["Third-party range estimate", "€3-€12 per employee / month", "Plan-specific list estimate", "Not evidence of current realized ASP", "Softabase review"]
      - ["Apps and advanced features", "Recruiting, Payroll, Performance, Compensation, Surveys, EOR and related modules priced beyond core package", "Upsell / module pricing", "Public add-on list prices not fully disclosed", "Platform page, Employsome, RFP Wiki"]
      - ["Commercial structure", "One-time setup fee and common 12-month annual commitment", "Contracting/TCO lever, not headline list price", "Implementation, services, and upgrade costs remain quote-dependent", "RFP Wiki"]
    notes: "This table separates headline list anchors from quote-led realized pricing; public signals conflict and should not be treated as ARR or net revenue evidence."
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI009
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / public proxy
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Customer count, "16,000+ customers / growing companies", Medium, "Shows distribution scale and installed-base monetization opportunity", "Provide paid customer count by segment, geography, and product attach."]
      - [Employees managed, "1.5M+ employees managed (vendor-shaped third-party review)", Medium, "Useful activity proxy for seat-based monetization", "Provide active seats, paid seats, and net adds by quarter."]
      - [Payroll traction, "1,500+ payroll customers; 80% YoY payroll growth", Medium, "Indicates whether the payroll wedge is becoming a material upsell", "Provide payroll ARR / revenue, contribution margin, and country split."]
      - [Profitability signal, "First profitable quarter reported for Q1 2026", Medium, "Helpful milestone but not enough to model steady-state free cash flow", "Provide quarterly EBITDA / operating cash flow bridge and sustainability drivers."]
      - [Total funding, "$720M cumulative funding by Sep 2025", Medium, "Frames historical financing dependence and dilution risk", "Provide cap table, net proceeds remaining, and any debt or preferred rights."]
      - [Employee count, "1,700-1,800 public range across trackers", Low, "Headcount is a rough opex proxy and highlights cost base ambiguity", "Provide current FTE by function and post-layoff hiring plan."]
      - [ARR, null, Low, "Missing ARR blocks valuation and payback benchmarking", "Provide current ARR, ARR by module, and churn assumptions."]
      - [Gross margin, null, Low, "Missing gross margin blocks software versus service mix analysis", "Provide gross margin by core HR, payroll, and EOR."]
      - [CAC / payback, null, Low, "Missing CAC and payback block sales-efficiency underwriting", "Provide blended and segment CAC, payback, and sales cycle by channel."]
      - [Cash / runway, null, Low, "Missing current cash and burn block capital adequacy analysis", "Provide cash balance, monthly burn, debt facilities, and minimum runway covenant."]
    notes: "Null means the metric is not disclosed in the retained public pack, not that the value is zero."
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI010
      - CI011
      - CI014
figures:
