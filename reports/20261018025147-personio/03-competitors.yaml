  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Vendor
      - Public pricing signal
      - Contract / packaging model
      - Included capabilities signaled
      - Unknowns / negotiation points
      - Implication
    rows:
      - [
          "Personio",
          "Starts from €7.60 per month/employee; full-stack 100-person example ~€17k-28k/year before payroll fees",
          "12-month minimum, implementation fee, modular apps, quote-based realized pricing",
          "Core or Core Pro plus optional recruiting, performance, surveys, compensation, payroll, EOR",
          "Realized discounts, renewal uplifts, minimum-license floors, EOR markup",
          "The buyer gets breadth, but price predictability is weaker than self-serve competitors"
        ]
      - [
          "HiBob",
          "Typically €15-25/user/month",
          "Custom quote required",
          "International HRIS with compensation, workforce planning, analytics",
          "Realized pricing, contract minimums, implementation costs",
          "Closest direct peer for scale-ups, but not a transparency answer"
        ]
      - [
          "BambooHR",
          "Quote-based catalog pricing; retained comparison estimates ~$10-17/user/month",
          "Tiered HRIS pricing with performance on Pro tier",
          "Employee records, hiring, onboarding, time off, performance",
          "EU-specific add-ons, realized discounts, payroll-partner costs",
          "Better fit when US SMB core HR matters more than EU payroll/compliance"
        ]
      - [
          "Factorial",
          "~€5-7/user/month",
          "Self-serve tiers available",
          "Recruitment, time tracking, performance, payroll",
          "Scale-up pricing, services, and reliability tradeoffs",
          "Cheaper EU breadth is one of the clearest pricing attacks on Personio"
        ]
      - [
          "Rippling",
          "From $8/user/month base",
          "Modular pricing that increases with stacked modules",
          "Unified HR + IT + finance plus global payroll",
          "True all-in cost once apps, devices, and finance modules are added",
          "Can undercut Personio's scope argument if IT and finance are in the buying center"
        ]
      - [
          "Taito.ai",
          "€8/user/month annual or €10/user/month monthly",
          "Self-serve signup; no sales call",
          "Slack-native people ops plus performance",
          "Payroll processing not included",
          "A focused substitute can look materially simpler and cheaper than Personio when the job is performance + workflow"
        ]
    notes: >-
      Public price signals mix official list pricing, independent catalog pricing, and competitor-authored
      comparison ranges; retained sources do not reveal realized Personio or HiBob net pricing after discounts.
    claimRefs: [CP004, CP006, CP010, CP011, CP012, CP013]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      The retained evidence clusters Personio as the strongest Europe-centric integrated HR suite, while
      alternatives win by narrowing the job-to-be-done or expanding into US payroll and adjacent operations.
    data:
      xAxis:
        label: Breadth of workforce operating scope (1=narrow HRIS, 5=HR+IT/finance/global payroll)
        min: 1
        max: 5
      yAxis:
        label: Fit for Europe-centric compliance and payroll needs (1=US-first, 5=Europe-first)
        min: 1
        max: 5
      points:
        - label: Personio
          x: 3.6
          y: 4.8
          tone: positive
          note: Europe-first HRIS breadth, German payroll adjacency, and integration ecosystem.
        - label: HiBob
          x: 3.2
          y: 4.0
          tone: opportunity
          note: Close direct peer for scale-ups with stronger international coverage but similar pricing opacity.
        - label: Factorial
          x: 3.4
          y: 4.4
          tone: risk
          note: EU-oriented platform with cheaper self-serve pricing and broader baseline modules.
        - label: BambooHR
          x: 2.2
          y: 1.6
          tone: neutral
          note: Friendly US starter HRIS rather than a Europe-first payroll/compliance stack.
        - label: Gusto
          x: 2.5
          y: 1.2
          tone: risk
          note: Payroll-first US small-business alternative when tax filings and benefits are central.
        - label: Rippling
          x: 5.0
          y: 2.4
          tone: opportunity
          note: Broadest operating-system scope, especially where HR, IT, and finance buy together.
    approximationNotes: >-
      Coordinates are ordinal 1-5 scores synthesized from retained evidence on product scope, geography,
      payroll orientation, and adjacent operational breadth; they are not benchmark survey results.
    claimRefs: [CP005, CP007, CP010, CP011, CP012, CP013]
callouts:
  - calloutType: strength
    title: Compliance-led differentiation is still real
    body: >-
      Personio keeps a defendable edge when the buyer wants Europe-first HR operations, German payroll
      adjacency, EU data residency, and a single platform rather than stitched-together point tools.
    claimRefs: [CP005, CP007, CP009]
  - calloutType: risk
    title: The weakest module opens a narrow replacement path
    body: >-
      The retained comparisons repeatedly point to performance management and pricing opacity as the easiest
      entry points for competitors, including vendors that do not try to replace the whole HRIS.
    claimRefs: [CP004, CP006, CP008, CP011]
  - calloutType: insight
    title: Multi-homing cuts both ways
    body: >-
      Personio's marketplace helps it stay embedded, but the same integration posture also makes partial
      substitutions viable, reducing the need for customers to execute a risky full rip-and-replace.
    claimRefs: [CP008, CP009]
