      - [Base, "Company quality remains solid while disclosure remains partial and no fresh priced round resets expectations.", "Track posture: wait for better evidence or better price rather than force a valuation.", "Old round remains the only hard anchor and overstates fair value.", "Best supported by the assigned evidence."]
      - [Bear, "Seat growth weakens, per-employee monetization compresses with layoffs, and the 2022 anchor never clears against current software multiples.", "Downside is multiple compression and weak entry economics, not necessarily franchise failure.", "Investors confuse operational quality with price support.", "Independent sources explicitly keep this risk live."]
    notes: >-
