    title: Recommendation
    body: >-
      Track Personio as a credible European HR-software leader, but do not underwrite a new entry
      near the old valuation anchor until management or investors provide fresher financial and
      financing evidence.
    claimRefs:
      - CV001
      - CV010
      - CV013
      - CV016
  - calloutType: assumption
    title: What would move the call upward
    body: >-
      A better recommendation needs new information, not a new narrative: audited or management
      quality revenue disclosure, margin and retention evidence, and corroborated financing or
      secondary-market pricing from 2025 to 2026.
    claimRefs:
      - CV012
      - CV013
      - CV016
