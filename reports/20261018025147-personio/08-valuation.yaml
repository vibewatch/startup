figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Track follows from strong product proof colliding with weak price discovery.
    data:
      nodes:
        - id: moat
          label: European compliance moat
          note: Official and independent sources both frame Personio around Europe-specific HR, payroll, and data-control complexity.
          tone: positive
        - id: scale
          label: Scaled customer proof
          note: Public sources show 6,000 customers in 2022 and 15,000 to 16,000 plus by 2026.
          tone: positive
        - id: monetization
          label: Monetization and ecosystem depth
          note: Per-employee pricing, marketplace breadth, and prior app adoption indicate real commercial breadth.
          tone: positive
        - id: anchor
          label: Valuation anchor still peak-era
          note: The clearest hard price in the pool is still the June 2022 $8.5 billion Series E close.
          tone: risk
        - id: disclosure
          label: Financial disclosure gap
          note: Revenue is described as third-party estimated rather than company-disclosed, limiting underwriting precision.
          tone: risk
        - id: call
          label: Recommendation = track
          note: Wait for better revenue, terms, and fresh pricing evidence before upgrading the call.
          tone: neutral
      edges:
        - from: moat
          to: scale
          relationship: Differentiation translated into adoption.
        - from: scale
          to: monetization
          relationship: Scale matters because it can support cross-sell and workflow depth.
        - from: monetization
          to: anchor
          relationship: Commercial proof helps, but the price reference remains old.
        - from: anchor
          to: disclosure
          relationship: An old anchor needs fresher operating data to remain credible.
        - from: disclosure
          to: call
          relationship: Missing underwriting inputs keep the recommendation below invest.
    approximationNotes: null
    claimRefs:
