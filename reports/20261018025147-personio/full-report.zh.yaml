  - id: FM001
    title: 可服务市场视角
    type: pyramid
    summary: 指定证据显示，可服务市场呈楔形，核心是欧洲 SMB 和中型市场 HR 运营，而不是单一的自上而下 HR 软件 TAM。
    data:
