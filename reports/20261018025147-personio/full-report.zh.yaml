  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 保留证据将 Personio 聚类为最强的欧洲中心型一体化 HR 套件；替代方案则靠收窄待办工作，或扩展到美国薪资及相邻运营领域取胜。
    data:
      xAxis:
        label: 劳动力运营范围广度（1=窄 HRIS，5=HR+IT/财务/全球薪资）
        min: 1
        max: 5
      yAxis:
        label: 对欧洲中心型合规和薪资需求的匹配度（1=美国优先，5=欧洲优先）
        min: 1
        max: 5
      points:
        - label: Personio
          x: 3.6
          'y': 4.8
          tone: positive
          note: 欧洲优先的 HRIS 广度、德国薪资相邻能力和集成生态。
        - label: HiBob
          x: 3.2
          'y': 4
          tone: opportunity
          note: 面向规模化企业的直接近邻，国际覆盖更强，但定价同样不透明。
        - label: Factorial
          x: 3.4
          'y': 4.4
          tone: risk
          note: 面向欧盟的平台，自助定价更便宜，基础模块更广。
        - label: BambooHR
          x: 2.2
          'y': 1.6
          tone: neutral
          note: 友好的美国入门 HRIS，而非欧洲优先的薪资 / 合规技术栈。
        - label: Gusto
          x: 2.5
          'y': 1.2
          tone: risk
          note: 当税务申报和福利是核心时，以薪资为先的美国小企业替代方案。
        - label: Rippling
          x: 5
          'y': 2.4
          tone: opportunity
          note: 运营系统范围最广，尤其适合 HR、IT 和财务共同采购的场景。
    approximationNotes: 坐标是根据保留证据中的产品范围、地域、薪资导向和相邻运营广度综合出的序数 1-5 分；不是基准调查结果。
    claimRefs:
      - CP005
      - CP007
      - CP010
      - CP011
      - CP012
      - CP013
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 公开证据指向分层经常性收入模型，但无法观察每一层的单位经济性。
    data:
      nodes:
        - label: 基础 HRIS 订阅
          value: Per employee
          unit: pricing basis
          note: Core/CorePro 按员工计费的套餐是变现锚点。
        - label: 附加应用
          value: Upsell
          note: 招聘、绩效、薪酬、调查及相关模块扩大客户账户价值。
        - label: 薪资切入口
          value: Selected-country monetization
          note: 原生及初步薪资能力加深工作流依赖，但公开收入拆分未披露。
        - label: 生态 / API 附加
          value: Expansion
          note: 市场使用和集成创造工作流锁定，可支撑更高阶套餐。
        - label: 合作伙伴驱动的 EOR
          value: International hiring
          note: Remote 驱动的 EOR 扩大产品集合，但可能与合作伙伴共享经济收益。
        - label: 毛利可见度
          value: Opaque
          note: 公开证据没有展示实际 ARPU、折扣、支持成本吸收或分层毛利率。
    approximationNotes: 该顺序反映观察到的变现层级，不是量化的转化率或贡献利润率。
    claimRefs:
      - CI013
  - id: FE001
    title: 公开可见的产品架构图
    type: stack
    summary: 可见技术栈以核心 HR 系统为基础，向外延伸到工作流自动化、附加应用和依赖合作伙伴的执行层。
    data:
      layers:
        - label: 核心 HR 数据层
          detail: 记录员工画像、文档、缺勤、权限和报表输入的系统。
          modules:
            - 员工画像
            - 文档和电子签名
            - 缺勤管理
            - 访问和权限
        - label: 工作流和分析层
          detail: 围绕核心记录自动处理审批、报表以及员工或经理自助服务。
          modules:
            - 工作流自动化
            - 分析和报表
            - 员工自助服务
            - AI 助手
        - label: 应用扩展层
          detail: 可选或相邻模块将套件从记录管理延伸到人才和薪资工作流。
          modules:
            - 招聘
            - 绩效
            - 薪酬管理
            - 调查
            - 举报
            - Personio Payroll
        - label: 信任和控制层
          detail: 横向控制措施管理访问、可审计性、数据驻留和隐私敏感工作流。
          modules:
            - GDPR 就绪控制
            - 审计日志
            - 单点登录
            - 应用审批
        - label: 外部执行层
          detail: 端到端体验的关键部分依赖市场、API、薪资服务商和 Remote。
          outputs:
            - 市场集成
            - 移交给薪资服务商
            - 通过 Remote 提供的名义雇主
            - 基于 API 的定制集成
        - label: 实施和支持层
          detail: 客户结果仍取决于部署质量、合作伙伴深度，以及对各国特定工作流的本地支持。
          outputs:
            - 合作伙伴生态配置
            - 各国薪资设置
            - 客户支持响应
    approximationNotes: 这是基于公开产品和评价页面抽象出的运营模型，不是供应商提供的基础设施图。
    claimRefs:
      - CE002
      - CE004
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Personio 的扩张路径从欧洲优先的 HR 整合，延伸到相邻应用、集成和薪资，随后在可靠性和续约价值上接受再检验。
    data:
      items:
        - label: 诊断碎片化的欧洲 HR 运营
          actor: HR / 运营买方
          stage: 评估
          touchpoints:
            - 核心 HR、文档、缺勤和薪资碎片化
            - GDPR 和本地流程匹配
        - label: 为成长型组织落地核心平台
          actor: HR 负责人和人事运营
          stage: 初始部署
          touchpoints:
            - Core 或 Core Pro 按员工计价
            - 员工记录、工作流、分析和报表
        - label: 增加招聘、绩效和工作流应用
          actor: HRIS 管理员 / 人才团队
          stage: 应用扩展
          touchpoints:
            - 招聘、调查、薪酬、绩效
            - 按报价增加模块范围
        - label: 连接周边软件体系
          actor: 人事系统负责人
          stage: 集成扩展
          touchpoints:
            - 100 个集成里程碑
            - 劳动力规划和分析市场合作伙伴
        - label: 延伸到薪资和国际招聘
          actor: 薪资、财务和国际团队
          stage: 交叉销售
          touchpoints:
            - 截至 2026 年第一季度已有 1,500+ 个薪资客户
            - 覆盖 100+ 个国家、由 Remote 驱动的 EOR
        - label: 在续约时重新检验价值
          actor: HR 负责人、IT 和财务审批人
          stage: 续约审视
          touchpoints:
            - 经核实评价中的报表、速度和 SSO 投诉
            - 自 2022 年 2 月以来记录到 824+ 次 Payroll DE 中断
    claimRefs:
      - CU001
      - CU004
      - CU007
      - CU008
      - CU010
      - CU012
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 当范围边界与合作伙伴或定价依赖相交时，剩余严重性最高。
    data:
      columns:
        - 可能性
        - 影响
        - 缓解成熟度
        - 剩余严重性
      rows:
        - label: 薪资地域
          values:
            - label: 高
            - label: 高
            - label: 中
            - label: 高
              note: 原生薪资仅限部分市场。
        - label: Remote / EOR 依赖
          values:
            - label: 中
            - label: 高
            - label: 中
            - label: 高
              note: 覆盖范围、语言和经济性仍由合作伙伴中介。
        - label: 定价 / 续约机制
          values:
            - label: 高
            - label: 高
            - label: 低
            - label: 高
              note: 报价不透明和续约条款可能显著改变总成本。
        - label: 报表 / 模块深度
          values:
            - label: 高
            - label: 中
            - label: 低
            - label: 中
              note: 对分析密集型或以绩效为导向的部署而言，风险尤为突出。
        - label: 安全 / 隐私执行
          values:
            - label: 低
            - label: 高
            - label: 中
            - label: 中
              note: 公开控制措施较强，但尽调仍需要近期运营证据。
        - label: 集成 / 配置延迟
          values:
            - label: 中
            - label: 中
            - label: 低
            - label: 中
              note: 轮询和单向集成可能造成访问或工作流延迟。
    approximationNotes: 序数标签概括公开证据，不代表概率评分。
    claimRefs:
      - CR006
      - CR007
      - CR009
      - CR011
      - CR013
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 产品证据很强，但价格发现疲弱，因此建议继续跟踪。
    data:
      nodes:
        - id: moat
          label: 欧洲合规护城河
          note: 官方和独立来源都将 Personio 的核心竞争力归因于欧洲特有的人力资源、薪资和数据控制复杂性。
          tone: positive
        - id: scale
          label: 客户规模证明
          note: 公开来源显示，Personio 在 2022 年拥有 6,000 家客户，到 2026 年增至 15,000 至 16,000 多家。
          tone: positive
        - id: monetization
          label: 变现与生态深度
          note: 按员工计价、广泛的市场生态以及此前的应用采用情况，都说明其商业覆盖面确实不浅。
          tone: positive
        - id: anchor
          label: 估值锚点仍停留在高峰期
          note: 现有资料中最明确的硬价格，仍是 2022 年 6 月完成的 $8.5 billion E 轮融资。
          tone: risk
        - id: disclosure
          label: 财务披露缺口
          note: 收入被描述为第三方估算值，而非公司披露值，因此难以精确评估其收入质量。
          tone: risk
        - id: call
          label: 建议 = 跟踪
          note: 等待更好的收入、交易条款和最新定价证据，再上调判断。
          tone: neutral
      edges:
        - from: moat
          to: scale
          relationship: 差异化转化为客户采用。
        - from: scale
          to: monetization
          relationship: 规模很重要，因为它可以支撑交叉销售和更深的工作流。
        - from: monetization
          to: anchor
          relationship: 商业证明有帮助，但价格参考仍然过时。
        - from: anchor
          to: disclosure
          relationship: 旧锚点需要更新的运营数据，才能继续保持可信。
        - from: disclosure
          to: call
          relationship: 缺失的投资判断输入，使建议仍低于投资级别。
    approximationNotes: null
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV010
      - CV011
      - CV013
      - CV016
