      - number: '4.3'
        title: 资本充足性是核心尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              公开证据确认 Personio 历来依赖大额风险融资，但没有提供判断下一融资触发点所需的资产负债表事实。Forbes 仍将公司锚定在 2022 年 $8.5 billion 轮融资和累计 $720 million
              融资上，而一份 2026 年私营公司追踪资料给出较低的 $6.3 billion 最新估值，并称 2025
              年融资定价未披露。单独看，这一不一致尚可处理；更难的问题是公开资料仍缺少当前现金、债务、现金跑道、契约和折价细节。采购评论还提到设置费、年度承诺和升级路径可能拉长客户获取成本回收周期。结论是：Personio
              看起来像一家规模化、经常性收入广泛的软件公司，但仅凭公开证据，无法有把握地判断其利润路径或资本充足性。
