      - - 回答员工 HR 问题
        - 日常问题和报告请求带来的 HR 工单流量
        - AI 助手加上报告和自助服务界面
        - 公司声称能更快回答问题，并减少报告处理时间
        - 指定证据中没有公开的模型治理材料包或错误率披露
