            body: 当买方需要以欧洲为先的 HR 运营、德国薪酬相邻能力、欧盟数据驻留和单一平台，而不是拼接多个单点工具时，Personio 仍保持可守住的优势。
            calloutType: strength
            claimRefs:
              - CP005
              - CP007
              - CP009
          - type: callout
            title: 薄弱模块打开了狭窄的替换路径
            body: 保留的比较材料反复把绩效管理和价格不透明视为竞争者最容易切入的入口，包括那些并不打算替换整套 HRIS 的供应商。
            calloutType: risk
            claimRefs:
              - CP004
              - CP006
              - CP008
              - CP011
          - type: callout
            title: 多栖使用有利有弊
            body: Personio 的 marketplace 帮助它嵌入客户流程，但同样的集成姿态也让部分替换变得可行，降低了客户进行高风险全量替换的必要性。
            calloutType: insight
            claimRefs:
              - CP008
