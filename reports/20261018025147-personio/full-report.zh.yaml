      - - HiBob
        - 通常为 €15-25 / 用户 / 月
        - 需要定制报价
        - 具备薪酬、劳动力规划、分析能力的国际 HRIS
        - 实际价格、合同最低量、实施成本
        - 最接近成长型企业的直接同行，但无法解决透明度问题
      - - BambooHR
        - 按报价的目录定价；保留对比估算为 ~$10-17 / 用户 / 月
        - 分层 HRIS 定价，Pro 层级含绩效
        - 员工档案、招聘、入职、休假、绩效
        - 欧盟特定附加模块、实际折扣、薪资合作伙伴成本
        - 当美国 SMB 核心 HR 比欧盟薪资 / 合规更重要时更适合
      - - Factorial
        - ~€5-7 / 用户 / 月
        - 提供自助层级
        - 招聘、时间记录、绩效、薪资
        - 成长型定价、服务和可靠性之间的权衡
        - 更便宜的欧盟广度，是对 Personio 最明确的定价攻击之一
      - - Rippling
        - 基础价格从 $8/user/month 起
        - 随叠加模块增加的模块化定价
        - 统一 HR + IT + 财务，加上全球薪资
        - 加入应用、设备和财务模块后的真实全包成本
        - 如果 IT 和财务进入采购中心，可以削弱 Personio 关于能力范围的论点
