      - number: '4.2'
        title: 公开牵引力存在，但单位经济大多不公开
        blocks:
          - type: paragraph
            body: >-
              Personio 的公开需求信号总体强劲。当前平台页面称有超过 16,000 家公司信任该产品，独立报道则称客户基础超过 15,000 家，采用薪酬模块的客户超过 1,500 家。Employsome
              还报道称公司在 2026 年第一季度首次实现季度盈利，这是积极的运营信号，但不能替代经审计的收入质量。保留的公开来源没有提供
              ARR、毛利率、NRR、CAC、回收期、现金消耗或当前现金。因此，投资人能看到市场渗透和部分产品附加，却无法检验增长是否高效、支持与实施是否稀释利润率，或薪酬和 EOR 增购是否能增厚毛利。
