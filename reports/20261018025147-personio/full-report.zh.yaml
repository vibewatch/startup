  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Personio 的公开时间线从 2015 年成立延伸至 2026 年的盈利、收购和平台扩张。
    data:
      items:
        - date: '2015'
          label: 公司在慕尼黑成立
          detail: 官方及二手创始人故事显示，两位联合创始人在慕尼黑 CDTM 结识后，Personio 于 2015 年启动。
          tone: positive
          claimRefs:
            - CO002
        - date: 2016-03
          label: 记录到种子融资
          detail: 融资追踪器记录 2016 年 3 月种子轮为首次外部融资。
          tone: positive
          claimRefs:
            - CO011
        - date: 2017-06
          label: 记录到 A 轮融资
          detail: 融资追踪器记录 2017 年 6 月 A 轮，彼时 Personio 已走出创立阶段并开始扩张。
          tone: positive
          claimRefs:
            - CO011
        - date: 2018-11
          label: 记录到 B 轮融资
          detail: 融资追踪器记录 2018 年 11 月 B 轮，显示独角兽前仍在持续积累资本。
          tone: positive
          claimRefs:
            - CO011
        - date: 2021-10
          label: $270M E 轮，估值 $6.3B
          detail: 公司和追踪器来源均指向 2021 年 10 月融资，该轮融资让 Personio 进入欧洲顶尖初创公司行列。
          tone: positive
          claimRefs:
            - CO013
        - date: '2022-04-26'
          label: 市场达到 100 个集成
          detail: Personio 称，市场上线一年后已有 70% 的客户在使用应用和 API。
          tone: positive
          claimRefs:
            - CO007
        - date: 2022-06
          label: E 轮扩展，名义估值 $8.5B
          detail: 独立报道和追踪器数据将 2022 年 6 月扩展轮与 $8.5B 估值锚点联系起来，2026 年材料仍在引用该锚点。
          tone: positive
          claimRefs:
            - CO011
        - date: 2025-Q1
          label: 与 Remote 推出嵌入式 EOR
          detail: 独立评价证据将 Remote 驱动的 Personio EOR 定位于 2025 年第一季度。
          tone: positive
          claimRefs:
            - CO008
        - date: 2026-Q1
          label: 首个盈利季度并收购 aurio
          detail: 独立来源称，Personio 在实现首个盈利季度的同时完成了对 aurio 的收购，并评论了薪资业务增长。
          tone: positive
          claimRefs:
            - CO009
            - CO010
    approximationNotes: 季度和月份标签遵循指定来源给出的精度；若干早期轮次日期来自二手融资追踪器，而非申报文件。
    claimRefs:
