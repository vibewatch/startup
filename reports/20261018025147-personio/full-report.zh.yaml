  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 变现架构与价格透明度
        blocks:
          - type: paragraph
            body: >-
              Personio 明确销售的是经常性 HR 软件，而不是项目制许可；官网将价格表述为按员工、按模块计价。当前公开锚点是“每月每员工起价
              €7.60”，但这并不是完整价目表：独立采购报道称买方仍会收到定制报价，第三方评测还引用了 €3-€5/人等更低或更早的入门区间，或按方案覆盖范围报
              €3-€12。这一差距很重要，因为它区分了官方列表锚点和实际合同经济。公开证据还显示，核心 HR
              之外存在广泛变现面：Recruiting、Payroll、Performance、Compensation、Surveys 和 EOR 作为增值组件或相邻模块销售，而集成与 API
              会加深工作流锁定，并可能随时间推高账户价值。
