      - ["Profitability status", "First profitable quarter reported in Q1 2026", "2026", "medium", "Claim is independent-review based rather than company-authored in this source pack."]
    notes: "Combines official positioning with secondary tracker and review evidence; null means the assigned public evidence does not disclose a supportable value."
    claimRefs: [CO001, CO003, CO004, CO005, CO006, CO009, CO011, CO012, CO013]
  - id: TO002
    title: Leadership and founder table
    columns:
      - Person
      - Public role
      - Background / evidence
      - Founder-market fit or functional coverage
      - Key-person dependency
    rows:
      - ["Hanno Renner", "Co-founder and CEO", "Named in official founder story and secondary profiles.", "Founder-led continuity anchors identity and go-to-market narrative.", "High; CEO visibility is concentrated on Renner in the assigned sources."]
      - ["Roman Schumacher", "Co-founder", "Named in official founder story and secondary profiles.", "Founding-team continuity is clear, but current functional scope is not disclosed in the assigned pack.", "Medium; ongoing executive remit is not visible here."]
      - ["Arseniy Vershinin", "Co-founder", "Named in official founder story and secondary profiles.", "Signals technical / founding continuity, but no current leadership scope is disclosed in the assigned pack.", "Medium; evidence supports origin story more than present-day operating role."]
      - ["Jonas Rieke / Ignaz Forstmeier", "Conflicted fourth co-founder record", "Official/about, Tracxn, and one tracker name Jonas Rieke; a 2026 independent review names Ignaz Forstmeier instead.", "Founder roster inconsistency weakens precision on founding-team composition.", "Medium; resolve directly before relying on founder-specific biographies."]
      - ["Thomas Seifert", "Audit committee member (reported)", "Independent review cites a Cloudflare CFO joining the audit committee, but broader board composition is not disclosed in the assigned evidence.", "Suggests governance professionalisation ahead of a possible IPO path.", "Medium; board-level disclosure remains too thin for stronger governance conclusions."]
    notes: "Coverage is partial and limited to leaders or founders explicitly named in the assigned sources; current board composition is not publicly disclosed here."
    enumerationScope:
      coverage: partial
      basis: "Rows include only founders or governance figures explicitly named in the assigned public evidence as of 2026-10-18."
    claimRefs: [CO002, CO014, CO016]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control / economic importance
      - Diligence ask
    rows:
      - ["Greenoaks", "Lead / repeat growth investor", "Named as lead on the Oct 2021 $270M round and again on the Jun 2022 $200M extension.", "Confirm board seat, pro-rata rights, and any valuation-protection terms still in force."]
      - ["Index Ventures", "Early institutional investor", "Listed among Personio investors in Tracxn and tracker pages; likely important historical cap-table holder.", "Request entry ownership, follow-on participation, and remaining influence rights."]
      - ["Accel", "Growth investor", "Named on the Series B and later investor lists in secondary sources.", "Confirm dilution path and whether any governance rights survived later rounds."]
      - ["Global Founders Capital", "Growth / follow-on investor", "Listed among investors in Tracxn's overview of the company profile.", "Confirm current ownership and whether the fund retains information or consent rights."]
      - ["Remote", "Strategic partner for embedded EOR", "Partner, not equity investor; critical to Personio's 2025 EOR launch and international-employment offer.", "Review exclusivity, economics, service-level dependence, and portability if the partnership changes."]
    notes: "Map is a partial public readout of capital and strategic stakeholders, not an exhaustive cap table or governance register."
    enumerationScope:
      coverage: partial
      basis: "Rows capture the most visible investors and one strategically material partner explicitly referenced in the assigned sources."
    claimRefs: [CO008, CO011, CO013, CO015]
