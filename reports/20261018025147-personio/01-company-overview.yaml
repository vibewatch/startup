      - ["Product / business model", "AI-powered HR platform / HRIS for growing organisations", "2026", "high", "Official positioning is corroborated by independent reviews."]
      - ["Customers", "16,000 (company-claimed); 15,000+ to 16,000+ in independent reviews", "2026", "medium", "Customer scale is directionally corroborated, but the exact current count is still a marketing claim."]
