      - ["Offices", "8 offices", "2026", "medium", "Official about page names eight office locations."]
      - ["Latest valuation anchor", "$8.5B headline persists from the 2022 extension; some trackers still show $6.3B as the latest figure", "2026", "low", "Secondary valuation records conflict on what is 'latest'."]
