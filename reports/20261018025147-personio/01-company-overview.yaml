schemaVersion: "report-v2"
artifact: company-overview
slug: personio
runDate: 2026-10-18
company:
  name: Personio
chapter:
  number: 1
  title: Company Overview
  summary: >
    Personio remains easy to identify as a Munich-founded, Europe-first HR software platform with
    a large SME customer base, visible office footprint, and an expanding payroll / marketplace
    narrative. The harder underwriting inputs are still noisy: public sources conflict on founder
    roster, headcount, total funding, and latest valuation, while ARR, margins, cap-table terms,
    and fuller board composition remain undisclosed in the assigned evidence.
sections:
  - id: identity-and-scale
    title: Identity, footprint, and operating posture
    body: >
      The official product positioning is consistent across Personio's own surfaces: the company
      markets an AI-powered platform spanning Core HR, Talent, Payroll, and Employee Finance for
      growing organisations, and it continues to frame itself around small and mid-sized European
      employers rather than global enterprise HCM. The strongest current identity facts are still
      company-authored rather than independently audited: Munich roots, a 2015 founding date, a
      Europe-centric compliance narrative, and self-reported operating scale of 16,000 customers,
      1,500 employees, eight offices, and 88 nationalities. Independent reviewers broadly support
      the product category and customer-count story, but the scale data is not perfectly aligned,
      so later chapters should reuse the category framing while treating exact headcount as
      directional rather than settled.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person dependence
    body: >
      Public leadership disclosure in the assigned source pack is thinner than Personio's scale
      would suggest. The founder set is visible, and Hanno Renner is identifiable as the CEO in a
      secondary profile, but the evidence bundle does not provide a clean board roster or a robust
      executive-governance page that can be cited directly. That matters because the current public
      record already shows a founder-roster inconsistency: official and database-style sources name
      Jonas Rieke as the fourth co-founder, while an independent 2026 review substitutes Ignaz
      Forstmeier. The practical implication is not that the business identity is unclear, but that
      founder-market-fit and governance diligence still require direct cap-table and board
      materials from the company rather than inference from marketing or tracker pages.
    claimRefs: [CO002, CO014, CO016]
    tableRefs: [TO002]
  - id: capital-base-and-stakeholders
    title: Capital base, valuation anchors, and stakeholder map
    body: >
      Personio's funding history is well established in outline but not cleanly underwritten in
      public detail. Company and third-party materials agree on the 2021 large round at a $6.3
      billion valuation and on a June 2022 extension that pushed the headline valuation to $8.5
      billion, but secondary data providers diverge on what counts as the latest valuation and the
      total capital raised through 2025-2026. That makes the capital narrative reusable as
      chronology, not as a single precise underwriting datum. The stakeholder picture is similarly
      clear at the top level—Greenoaks, Index Ventures, Accel, Global Founders Capital, Northzone,
      and the Remote partnership all matter—but the evidence pack does not disclose investor rights,
      board seats, liquidation terms, or secondary clearing prices, so control analysis remains a
      diligence follow-up rather than a closed conclusion.
    claimRefs: [CO011, CO012, CO013, CO015]
    tableRefs: [TO003]
  - id: milestone-readout
    title: Milestones since founding
    body: >
      The chronology shows a business that has kept adding surface area after the 2021-2022 funding
      surge rather than freezing into a single-point HRIS product. The assigned evidence supports a
      progression from founding and early financing, to marketplace scale and payroll expansion, to
      the 2025 embedded EOR launch, and then to 2026 profitability and AI/recruiting moves. That
      supports the "late-stage but still expanding" framing used in later diligence, while also
      surfacing the key caution from independent sources: product breadth and partner leverage are
      growing faster than public financial disclosure, so visible momentum does not by itself
      resolve valuation or governance uncertainty.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO013]
    figureRefs: [FO001]
