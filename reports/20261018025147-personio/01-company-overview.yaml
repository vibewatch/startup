callouts:
  - calloutType: strength
    title: Europe-first identity is still clear
    body: >
      Even with noisy financial disclosure, Personio's company identity remains unusually legible:
      the official surfaces, product copy, and marketplace evidence consistently describe a
      Europe-first HR operating system with tangible scale, compliance positioning, and ecosystem
      breadth.
    claimRefs: [CO001, CO003, CO006, CO007]
  - calloutType: risk
    title: Public underwriting data is materially thinner than the market profile
    body: >
      The assigned evidence does not support a clean current underwriting picture. Headcount,
      founder roster, total funding, and latest valuation all conflict across public sources, while
      ARR, margins, investor rights, and fuller board composition remain unavailable.
    claimRefs: [CO005, CO011, CO012, CO014, CO016]
