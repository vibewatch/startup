      - number: '1.3'
        title: Capital base, valuation anchors, and stakeholder map
        blocks:
          - type: paragraph
            body: >
              Personio's funding history is well established in outline but not cleanly underwritten in public detail.
              Company and third-party materials agree on the 2021 large round at a $6.3 billion valuation and on a June
              2022 extension that pushed the headline valuation to $8.5 billion, but secondary data providers diverge on
              what counts as the latest valuation and the total capital raised through 2025-2026. That makes the capital
              narrative reusable as chronology, not as a single precise underwriting datum. The stakeholder picture is
              similarly clear at the top level—Greenoaks, Index Ventures, Accel, Global Founders Capital, Northzone, and
              the Remote partnership all matter—but the evidence pack does not disclose investor rights, board seats,
              liquidation terms, or secondary clearing prices, so control analysis remains a diligence follow-up rather
              than a closed conclusion.
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO015
