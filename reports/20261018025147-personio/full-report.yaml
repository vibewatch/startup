            figureRef: FI001
            claimRefs:
              - CI013
      - number: '4.2'
        title: Public traction exists, but unit economics remain mostly private
        blocks:
          - type: paragraph
            body: >-
              Personio's public demand signals are directionally strong. The current platform page says the company is
              trusted by more than 16,000 companies, and independent coverage places the base above 15,000 customers
              with payroll adoption past 1,500 customers. Employsome also reports a first profitable quarter in Q1 2026,
              which is a constructive operating signal, but it is not a substitute for audited revenue quality. None of
              the retained public sources provide ARR, gross margin, NRR, CAC, payback, burn, or current cash. That
              leaves investors able to see market penetration and some product attach, but unable to test whether growth
              is efficient, whether support and implementation are margin dilutive, or whether payroll and EOR upsell
              are accretive at the gross-profit line.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI010
              - CI011
              - CI014
      - number: '4.3'
        title: Capital adequacy is the core diligence blocker
        blocks:
          - type: paragraph
            body: >-
              Public evidence confirms that Personio has historically relied on large venture rounds, but it does not
              provide the balance-sheet facts needed to underwrite the next financing trigger. Forbes still anchors the
              company to the 2022 $8.5 billion round and $720 million cumulative funding, while a 2026 private-company
              tracker lists a lower $6.3 billion latest valuation and undisclosed 2025 round pricing. That inconsistency
              is manageable on its own; the harder issue is that the public pack still lacks current cash, debt, runway,
              covenant, and discounting detail. Procurement commentary also points to setup fees, annual commitments,
              and upgrade paths that can raise customer acquisition recovery periods. Net: Personio looks like a scaled
              recurring software business with monetization breadth, but not one whose margin path or capital
              sufficiency can be confidently underwritten from public evidence alone.
            claimRefs:
              - CI008
              - CI010
              - CI011
              - CI013
              - CI014
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad monetization, narrow disclosure
            body: >-
              Personio looks commercially broad enough to drive ARPU expansion, but the retained public evidence is
              better at naming monetization surfaces than quantifying revenue quality or efficiency.
            calloutType: insight
            claimRefs:
              - CI004
              - CI008
              - CI013
          - type: callout
            title: Financing dependence is still a live underwriting risk
            body: >-
              Historical funding depth is clear, but current cash, debt, and runway are not, so the next financing
              trigger cannot be stress-tested from public evidence alone.
            calloutType: risk
            claimRefs:
              - CI010
              - CI011
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered product scope
        blocks:
          - type: paragraph
            body: >-
              Personio's own surfaces consistently describe the product as an AI-assisted HR platform that combines Core
              HR, Talent, Payroll, and Employee Finance for growing organisations. The operational packaging is modular
              rather than monolithic: buyers start with Core or Core Pro, then add apps across payroll, talent
              acquisition, talent management, and employee experience. That packaging matters because the product
              promise is broad, but several higher-value capabilities sit behind optional apps or country-specific
              payroll coverage instead of inside a single universally available SKU. Independent reviews broadly confirm
              the same full-lifecycle positioning for European SMBs, especially around personnel records, time tracking,
              recruiting, and payroll preparation.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE011
          - type: table
            tableRef: TE001
            claimRefs:
