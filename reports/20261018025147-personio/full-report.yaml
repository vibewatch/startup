          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP006
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.3'
        title: Distribution, switching costs, and multi-homing
        blocks:
          - type: paragraph
            body: >-
              Personio has real distribution power through workflow depth and ecosystem reach, but the switching-cost
              evidence is mixed rather than absolute. Official sources show a substantial marketplace footprint, with
              70% of customers using Personio apps or APIs in the 2022 marketplace update and current category pages
              listing many workforce-planning integrations. That expands the surface area where Personio can remain
              system-of-record even when adjacent tools win a category. At the same time, competitor-authored evidence
              explicitly markets "keep Personio for HRIS and replace performance" as a viable path, showing buyers do
              not always need a full rip-and-replace to defect on a weak module.
            claimRefs:
              - CP008
              - CP009
              - CP011
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Personio's moat looks durable when the purchase is framed as Europe-first HR administration plus
              compliance plus payroll workflows, especially for SMBs that want one vendor and value data residency and
              auditability. It looks less durable when the job-to-be-done shifts. Retained competitor evidence points
              buyers to Gusto or Rippling for US payroll and operating breadth, to Factorial for lower cost EU coverage,
              to HiBob for more international scale-up posture, and to Taito.ai when the real dissatisfaction sits in
              performance management and user workflow. The displacement risk is therefore segmentation-driven rather
              than a single head-to-head knockout.
            claimRefs:
              - CP006
              - CP010
              - CP011
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP007
