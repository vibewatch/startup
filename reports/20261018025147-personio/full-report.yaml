  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      The retained evidence clusters Personio as the strongest Europe-centric integrated HR suite, while alternatives
      win by narrowing the job-to-be-done or expanding into US payroll and adjacent operations.
    data:
      xAxis:
        label: Breadth of workforce operating scope (1=narrow HRIS, 5=HR+IT/finance/global payroll)
        min: 1
        max: 5
      yAxis:
        label: Fit for Europe-centric compliance and payroll needs (1=US-first, 5=Europe-first)
        min: 1
        max: 5
      points:
        - label: Personio
          x: 3.6
          'y': 4.8
          tone: positive
          note: Europe-first HRIS breadth, German payroll adjacency, and integration ecosystem.
        - label: HiBob
          x: 3.2
          'y': 4
          tone: opportunity
          note: Close direct peer for scale-ups with stronger international coverage but similar pricing opacity.
        - label: Factorial
          x: 3.4
          'y': 4.4
          tone: risk
          note: EU-oriented platform with cheaper self-serve pricing and broader baseline modules.
        - label: BambooHR
          x: 2.2
          'y': 1.6
          tone: neutral
          note: Friendly US starter HRIS rather than a Europe-first payroll/compliance stack.
        - label: Gusto
          x: 2.5
          'y': 1.2
          tone: risk
          note: Payroll-first US small-business alternative when tax filings and benefits are central.
        - label: Rippling
          x: 5
          'y': 2.4
          tone: opportunity
          note: Broadest operating-system scope, especially where HR, IT, and finance buy together.
    approximationNotes: >-
      Coordinates are ordinal 1-5 scores synthesized from retained evidence on product scope, geography, payroll
      orientation, and adjacent operational breadth; they are not benchmark survey results.
    claimRefs:
      - CP005
      - CP007
      - CP010
      - CP011
      - CP012
      - CP013
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence points to a layered recurring model, but not to observable unit economics at each layer.
    data:
      nodes:
        - label: Base HRIS subscription
          value: Per employee
          unit: pricing basis
          note: Core/CorePro per-employee packaging is the monetization anchor.
        - label: Add-on applications
          value: Upsell
          note: Recruiting, performance, compensation, surveys, and related modules expand account value.
        - label: Payroll wedge
          value: Selected-country monetization
          note: Native and preliminary payroll deepen workflow dependence but public revenue split is undisclosed.
        - label: Ecosystem / API attach
          value: Expansion
          note: Marketplace usage and integrations create workflow lock-in that can support higher-tier packaging.
        - label: Partner-led EOR
          value: International hiring
          note: Remote-powered EOR broadens the product set but likely shares economics with the partner.
        - label: Gross profit visibility
          value: Opaque
          note: Public evidence does not show realized ARPU, discounting, support cost absorption, or gross margin by layer.
    approximationNotes: Sequence reflects observed monetization layers, not quantified conversion rates or contribution margins.
    claimRefs:
      - CI013
  - id: FE001
    title: Publicly visible product architecture map
    type: stack
    summary: >-
      The visible stack is a core HR system extended by workflow automation, add-on apps, and partner-dependent
      execution layers.
    data:
      layers:
        - label: Core HR data layer
          detail: System of record for profiles, documents, absences, permissions, and reporting inputs.
          modules:
            - Employee profiles
            - Documents and eSignatures
            - Absence management
            - Access and permissions
        - label: Workflow and analytics layer
          detail: Automates approvals, reporting, and employee or manager self-service around the core record.
          modules:
            - Workflow automation
            - Analytics and reporting
            - Employee self-service
            - AI assistant
        - label: Application expansion layer
          detail: Optional or adjacent modules extend the suite beyond record-keeping into talent and payroll workflows.
          modules:
            - Recruiting
            - Performance
            - Compensation Management
            - Surveys
            - Whistleblowing
            - Personio Payroll
        - label: Trust and control layer
          detail: Cross-cutting controls govern access, auditability, data residency, and privacy-sensitive workflows.
          modules:
            - GDPR-ready controls
            - Audit logs
            - Single sign-on
            - App approvals
        - label: External execution layer
          detail: Critical parts of the end-to-end experience depend on marketplaces, APIs, payroll providers, and Remote.
          outputs:
            - Marketplace integrations
            - Payroll-provider handoff
            - Employer of Record via Remote
            - API-based custom integrations
        - label: Implementation and support layer
          detail: >-
            Customer outcomes still depend on deployment quality, partner depth, and local support for country-specific
            workflows.
          outputs:
            - Partner ecosystem configuration
            - Country-specific payroll setup
            - Customer support response
    approximationNotes: >-
      This is an operating-model abstraction from public product and review surfaces, not a vendor-supplied
      infrastructure diagram.
    claimRefs:
