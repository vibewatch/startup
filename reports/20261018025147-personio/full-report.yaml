      - number: '3.2'
        title: Capability and pricing tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Personio's strongest comparison points are still core HR breadth, German payroll adjacency, and
              Europe-centric trust posture, but those strengths come with visible tradeoffs. Official materials show
              modular per-employee pricing and multiple add-on apps, while independent review evidence says buyers still
              face quote-led packaging, weak pricing transparency, and a performance module that is commonly treated as
              the product's weakest area. The result is a competitive map where Personio is compelling for regulated
              European HR operations, but weaker when the buyer prioritizes low-friction self-serve setup, performance
              management depth, or transparent SMB pricing.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP011
              - CP012
