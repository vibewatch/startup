  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Profitability becomes repeatable, customer scale keeps compounding, and Europe-first compliance remains hard
          to replicate.
        - Would justify revisiting premium software pricing, but this pool does not support a numeric range.
        - Growth slows before new financial disclosure arrives.
        - Possible, but dependent on data not yet public here.
      - - Base
        - Company quality remains solid while disclosure remains partial and no fresh priced round resets expectations.
        - 'Track posture: wait for better evidence or better price rather than force a valuation.'
        - Old round remains the only hard anchor and overstates fair value.
        - Best supported by the assigned evidence.
      - - Bear
        - >-
          Seat growth weakens, per-employee monetization compresses with layoffs, and the 2022 anchor never clears
          against current software multiples.
        - Downside is multiple compression and weak entry economics, not necessarily franchise failure.
        - Investors confuse operational quality with price support.
        - Independent sources explicitly keep this risk live.
    notes: >-
      Scenario logic is qualitative because the assigned pool lacks audited 2026 revenue, margin, retention, and
      cash-flow inputs needed for defendable numeric ranges.
