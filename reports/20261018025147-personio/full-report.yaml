              - CP011
              - CP012
              - CP013
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Compliance-led differentiation is still real
            body: >-
              Personio keeps a defendable edge when the buyer wants Europe-first HR operations, German payroll
              adjacency, EU data residency, and a single platform rather than stitched-together point tools.
            calloutType: strength
            claimRefs:
              - CP005
              - CP007
              - CP009
          - type: callout
            title: The weakest module opens a narrow replacement path
            body: >-
              The retained comparisons repeatedly point to performance management and pricing opacity as the easiest
              entry points for competitors, including vendors that do not try to replace the whole HRIS.
            calloutType: risk
            claimRefs:
              - CP004
              - CP006
              - CP008
              - CP011
          - type: callout
            title: Multi-homing cuts both ways
            body: >-
              Personio's marketplace helps it stay embedded, but the same integration posture also makes partial
              substitutions viable, reducing the need for customers to execute a risky full rip-and-replace.
            calloutType: insight
            claimRefs:
              - CP008
              - CP009
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization architecture and pricing transparency
        blocks:
          - type: paragraph
            body: >-
              Personio clearly sells recurring HR software rather than project licenses, with the official website
              framing pricing as per-employee and modular. The current public anchor is "Starts from €7.60 per
              month/employee," but that is not a complete rate card: independent procurement coverage says buyers still
              receive tailored quotes, and third-party reviews cite lower or older entry bands such as €3-€5 per person
              or €3-€12 depending on plan coverage. That spread matters because it separates official list anchors from
              realized contract economics. Public evidence also shows monetization breadth beyond core HR: Recruiting,
              Payroll, Performance, Compensation, Surveys, and EOR are sold as add-ons or adjacent modules, while
              integrations and APIs deepen workflow lock-in and likely raise account value over time.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI009
              - CI012
              - CI013
