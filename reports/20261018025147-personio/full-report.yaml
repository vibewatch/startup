    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and operating posture
        blocks:
          - type: paragraph
            body: >
              The official product positioning is consistent across Personio's own surfaces: the company markets an
              AI-powered platform spanning Core HR, Talent, Payroll, and Employee Finance for growing organisations, and
              it continues to frame itself around small and mid-sized European employers rather than global enterprise
              HCM. The strongest current identity facts are still company-authored rather than independently audited:
              Munich roots, a 2015 founding date, a Europe-centric compliance narrative, and self-reported operating
              scale of 16,000 customers, 1,500 employees, eight offices, and 88 nationalities. Independent reviewers
              broadly support the product category and customer-count story, but the scale data is not perfectly
              aligned, so later chapters should reuse the category framing while treating exact headcount as directional
              rather than settled.
