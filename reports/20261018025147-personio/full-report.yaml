      - number: '5.2'
        title: Operating model and workflow coverage
        blocks:
          - type: paragraph
            body: >-
              The most supportable operating-model view is a central employee-data system with workflow automation and
              reporting at the core, surrounded by payroll, recruiting, and specialist apps. Personio's support
              documentation shows the payroll product as a data-synchronised workflow with validations, payslip preview,
              payroll document generation, and authority communication, while independent review material says final
              payroll execution remains concentrated in Germany and selected European markets. Recruiting, performance,
              surveys, compensation, and whistleblowing extend the system into adjacent workflows, but they increase
              diligence on which functions are native, which are add-ons, and which depend on external providers or
              local integrations.
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE006
              - CE009
              - CE010
