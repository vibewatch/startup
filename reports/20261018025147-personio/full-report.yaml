  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Residual severity is highest where scope boundaries intersect with partner or pricing dependencies.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Payroll geography
          values:
            - label: High
            - label: High
            - label: Medium
            - label: High
              note: Native payroll is limited to selected markets.
        - label: Remote / EOR dependency
          values:
            - label: Medium
            - label: High
            - label: Medium
            - label: High
              note: Coverage, language, and economics remain partner-mediated.
        - label: Pricing / renewal mechanics
          values:
            - label: High
            - label: High
            - label: Low
            - label: High
              note: Quote opacity and renewal terms can change total cost materially.
        - label: Reporting / module depth
          values:
            - label: High
            - label: Medium
            - label: Low
            - label: Medium
              note: Risk is acute for analytics-heavy or performance-led deployments.
        - label: Security / privacy execution
          values:
            - label: Low
            - label: High
            - label: Medium
            - label: Medium
              note: Public controls are strong, but diligence still needs recent operating evidence.
        - label: Integration / provisioning latency
          values:
            - label: Medium
            - label: Medium
            - label: Low
            - label: Medium
              note: Polling and one-way integrations can create access or workflow lag.
