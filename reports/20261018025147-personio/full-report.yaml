  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The boundary is clearest when defined from product scope rather than from a top-down HR software market
              estimate. Personio presents itself as a unified HR operating layer: employee records, time tracking,
              absence, workflow automation, analytics, payroll-adjacent workflows, and selected talent modules sit
              inside the core market it is trying to capture. That makes the relevant spend bucket broader than a point
              ATS or point performance tool, but narrower than enterprise HCM transformation budgets. The credible
              substitutes in the assigned evidence are spreadsheets, fragmented SMB HR tooling, and larger enterprise
              suites; the latter solve adjacent problems but also pull Personio outside its strongest documented fit.
            claimRefs:
              - CM001
              - CM002
              - CM012
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM008
              - CM011
              - CM014
              - CM016
      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The pool does not contain a defensible independent 2026 European HRIS spend estimate, so sizing has to
              stay evidence-constrained and range-based. Official and third-party sources do agree that Personio is not
              a mass-market microbusiness tool or a universal global-enterprise HCM platform; they disagree on how wide
              the practical middle is. Current product packaging points to bands below 200 employees, 200-1,000
              employees, and 1,000+ employees, while one independent review compresses the "best-fit" zone to 11-1,000
              employees and another third-party profile narrows the ICP further to 20-500 employees. That disagreement
              is informative: it implies the serviceable market should be framed as a wedge, not a single TAM.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM013
          - type: figure
