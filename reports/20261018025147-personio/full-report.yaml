              - CM003
              - CM004
              - CM012
              - CM013
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buying center is HR-led, but the assigned evidence suggests finance becomes more involved as payroll,
              workforce planning, and international hiring enter the scope. Official pricing is per employee and
              module-based, which usually makes headcount growth and app attach the main budget multipliers. At the user
              layer, HR operators, managers, and employees each appear in the workflow: employee self-service, manager
              approvals, payroll prep, and reporting are all part of the operating loop. Personio's adjacent value also
              expands when a buyer wants EOR or a planning-and-integration layer, because those workflows tie hiring and
              budget decisions to HR system adoption rather than to a single standalone feature comparison.
            claimRefs:
              - CM006
              - CM007
              - CM011
              - CM014
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM011
              - CM014
              - CM016
      - number: '2.4'
        title: Adoption drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest recurring driver is European compliance complexity combined with the need to reduce manual
              HR administration. Personio's own materials stress GDPR, regional compliance, and workflow automation,
              while third-party reviews consistently frame that compliance depth as the product's main differentiation
              for European SMBs and midmarket companies. The constraint side matters just as much for valuation: final
              payroll execution remains country-limited and integration-dependent outside supported markets, pricing
              becomes meaningfully higher once paid modules are layered on, and the source set does not expose a
              trustworthy 2026 spend-based TAM or attach-rate model. That combination supports a focused
              serviceable-market thesis, not a blanket claim that all HR-software spend is realistically addressable.
            claimRefs:
              - CM005
              - CM007
              - CM008
              - CM009
              - CM010
              - CM012
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Compliance depth is the clearest adoption wedge
            body: >-
              The most consistent reason Personio can win budget is not generic HR digitization alone but a specifically
              European compliance-and-workflow bundle that removes manual admin and connects payroll-adjacent processes
              to one HR operating layer.
            calloutType: insight
            claimRefs:
              - CM005
              - CM012
              - CM015
          - type: callout
            title: Broad market language can overstate the practical serviceable scope
            body: >-
              Official and third-party sources disagree on the true employee-size sweet spot, and the same evidence
              shows payroll execution and module breadth are narrower than a universal global HCM pitch, so valuation
              work should underwrite a focused serviceable market rather than a blanket TAM.
            calloutType: risk
            claimRefs:
              - CM008
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and substitute set
        blocks:
          - type: paragraph
            body: >-
              Personio is not competing against a single peer. The retained sources place it in a broad substitute set
              that includes direct European HRIS peers such as HiBob and Factorial, US starter-HRIS alternatives such as
              BambooHR, payroll-first suites such as Gusto, broader workforce operating systems such as Rippling, and
              partial substitutes such as Taito.ai that replace only a weak module instead of the full HR stack. That
              matters because Personio's own fit is narrower than "all SMB HR": the retained review evidence repeatedly
              centers it on European companies that need recruiting, payroll-adjacent workflows, and compliance in one
              system, while smaller teams or non-DACH multinationals can solve the same job through lighter, cheaper, or
              more geographically aligned tools.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP010
              - CP013
