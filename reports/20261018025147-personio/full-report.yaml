              - CO015
      - number: '1.4'
        title: Milestones since founding
        blocks:
          - type: paragraph
            body: >
              The chronology shows a business that has kept adding surface area after the 2021-2022 funding surge rather
              than freezing into a single-point HRIS product. The assigned evidence supports a progression from founding
              and early financing, to marketplace scale and payroll expansion, to the 2025 embedded EOR launch, and then
              to 2026 profitability and AI/recruiting moves. That supports the "late-stage but still expanding" framing
              used in later diligence, while also surfacing the key caution from independent sources: product breadth
              and partner leverage are growing faster than public financial disclosure, so visible momentum does not by
              itself resolve valuation or governance uncertainty.
