      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >
              Public leadership disclosure in the assigned source pack is thinner than Personio's scale would suggest.
              The founder set is visible, and Hanno Renner is identifiable as the CEO in a secondary profile, but the
              evidence bundle does not provide a clean board roster or a robust executive-governance page that can be
              cited directly. That matters because the current public record already shows a founder-roster
              inconsistency: official and database-style sources name Jonas Rieke as the fourth co-founder, while an
              independent 2026 review substitutes Ignaz Forstmeier. The practical implication is not that the business
              identity is unclear, but that founder-market-fit and governance diligence still require direct cap-table
              and board materials from the company rather than inference from marketing or tracker pages.
            claimRefs:
              - CO002
              - CO014
              - CO016
