  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Personio's expansion story progresses from Europe-first HR consolidation into adjacent apps, integrations, and
      payroll, then gets re-tested on reliability and renewal value.
    data:
      items:
        - label: Diagnose fragmented European HR operations
          actor: HR / operations buyer
          stage: Evaluate
          touchpoints:
            - Core HR, document, absence, and payroll fragmentation
            - GDPR and local process fit
        - label: Land on core platform for growing organisations
          actor: HR leader and people ops
          stage: Initial deployment
          touchpoints:
            - Core or Core Pro per-employee pricing
            - Employee records, workflows, analytics, and reporting
        - label: Add recruiting, performance, and workflow apps
          actor: HRIS admin / talent team
          stage: App expansion
          touchpoints:
            - Recruiting, surveys, compensation, performance
            - Quote-based modular scope increase
        - label: Connect the surrounding software estate
          actor: People systems owner
          stage: Integration expansion
          touchpoints:
            - 100 integrations milestone
            - Workforce-planning and analytics marketplace partners
        - label: Extend into payroll and international hiring
          actor: Payroll, finance, and international teams
          stage: Cross-sell
          touchpoints:
            - 1,500+ payroll customers by Q1 2026
            - Remote-powered EOR for 100+ countries
        - label: Re-test value at renewal
          actor: HR leader, IT, and finance approver
          stage: Renewal scrutiny
          touchpoints:
