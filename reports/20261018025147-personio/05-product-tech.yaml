            - "Documents and eSignatures"
            - "Absence management"
            - "Access and permissions"
        - label: "Workflow and analytics layer"
          detail: "Automates approvals, reporting, and employee or manager self-service around the core record."
          modules:
            - "Workflow automation"
            - "Analytics and reporting"
            - "Employee self-service"
            - "AI assistant"
        - label: "Application expansion layer"
          detail: "Optional or adjacent modules extend the suite beyond record-keeping into talent and payroll workflows."
          modules:
            - "Recruiting"
            - "Performance"
            - "Compensation Management"
            - "Surveys"
            - "Whistleblowing"
            - "Personio Payroll"
        - label: "Trust and control layer"
          detail: "Cross-cutting controls govern access, auditability, data residency, and privacy-sensitive workflows."
          modules:
            - "GDPR-ready controls"
            - "Audit logs"
            - "Single sign-on"
            - "App approvals"
        - label: "External execution layer"
          detail: "Critical parts of the end-to-end experience depend on marketplaces, APIs, payroll providers, and Remote."
          outputs:
            - "Marketplace integrations"
            - "Payroll-provider handoff"
            - "Employer of Record via Remote"
            - "API-based custom integrations"
        - label: "Implementation and support layer"
          detail: "Customer outcomes still depend on deployment quality, partner depth, and local support for country-specific workflows."
          outputs:
            - "Partner ecosystem configuration"
            - "Country-specific payroll setup"
            - "Customer support response"
    approximationNotes: "This is an operating-model abstraction from public product and review surfaces, not a vendor-supplied infrastructure diagram."
    claimRefs: ["CE002", "CE004", "CE008", "CE009", "CE010", "CE011", "CE012"]
callouts:
  - calloutType: "risk"
    title: "The product is broad, but several critical capabilities are partner- or market-dependent"
    body: >-
      Personio's strongest product narrative is a unified HR platform, yet payroll execution, EOR,
      and parts of the integration surface rely on external rails, country-specific support, or
      partner ecosystems. Underwriting should test where the implementation burden moves from native
      product into partners, payroll providers, or customer configuration work.
    claimRefs: ["CE007", "CE009", "CE010", "CE012", "CE014"]
tables:
  - id: "TE001"
    title: "Product module / asset matrix"
    columns:
      - "Module / product line"
      - "Primary user"
      - "Status / maturity"
      - "Differentiation"
      - "Diligence gap"
    rows:
      - ["Core HR", "HR admins and managers", "Current core platform", "Single employee-data system plus workflows, analytics, permissions, and self-service", "Need customer evidence on implementation time and data-model flexibility"]
      - ["Core Pro extensions", "Larger or more complex HR teams", "Current upsell tier", "Adds position management, workforce planning, unlimited legal entities, API access, and advanced permissions", "Need current price deltas and attach rates by segment"]
      - ["Payroll", "HR and payroll operators", "Current but country-scoped", "Built-in data sync, validations, and payslip/document workflows inside the HR system", "Need exact country-by-country execution scope, SLAs, and error-handling workflow"]
      - ["Recruiting", "Talent acquisition teams", "Current add-on", "ATS workflow inside the same HR record system, with tiered job-posting capacity", "Need proof of production outcomes versus specialist ATS alternatives"]
      - ["Talent and employee-experience apps", "Managers, HRBP, employees", "Current add-ons", "Performance, compensation, surveys, conversations, and whistleblowing extend the suite", "Need adoption and retention data for each add-on, not just launch availability"]
      - ["Employer of Record", "HR and international hiring teams", "Current but partner-powered", "Embedded cross-border hiring workflow inside Personio menus", "Need economics, service quality, and responsibility split between Personio and Remote"]
    notes: "Rows combine company-issued product packaging with independent review context; maturity reflects public availability, not validated customer adoption depth."
    claimRefs: ["CE001", "CE003", "CE004", "CE005", "CE006", "CE009"]
  - id: "TE002"
    title: "Workflow / use-case table"
    columns:
      - "User job"
      - "Current workflow"
      - "Personio solution"
      - "Measurable benefit"
      - "Limitation"
    rows:
      - ["Centralise employee records", "Multiple spreadsheets, documents, and ad hoc approvals", "Single HR record system with permissions, audit logs, and employee self-service", "Less manual HR administration and cleaner data handoff across teams", "Public evidence does not quantify migration effort or data-cleanup burden"]
      - ["Run payroll preparation", "Collect payroll inputs manually and re-enter data into payroll systems", "Sync employee data with payroll, validate entries, preview payslips, generate payroll documents, and communicate data to authorities", "Lower data re-entry and compliance risk in supported flows", "Final execution remains market-specific and often external"]
      - ["Manage recruiting", "Use standalone ATS plus separate HR onboarding", "Publish jobs and manage recruiting workflow inside the HR suite", "Potentially fewer tool handoffs from candidate to employee record", "Need evidence on candidate-experience quality and recruiter productivity"]
      - ["Answer employee HR questions", "HR ticket traffic for routine questions and reporting requests", "AI assistant plus reporting and self-service surfaces", "Company claims faster answers and less reporting time", "No public model-governance pack or error-rate disclosure in assigned evidence"]
      - ["Automate cross-tool HR processes", "Manual status updates across messaging, payroll, and analytics tools", "Marketplace apps and APIs connect Personio with adjacent tools", "Broader workflow automation across HR-adjacent systems", "Value depends on partner depth and configuration quality"]
    notes: "Benefits are directional and sourced from company or reviewer descriptions; public evidence in this pool does not provide audited ROI or uptime outcomes."
    claimRefs: ["CE002", "CE004", "CE005", "CE007", "CE011"]
  - id: "TE003"
    title: "Technology / operating architecture table"
    columns:
      - "Layer / component"
      - "Role"
      - "Key dependency"
      - "Key risk"
    rows:
      - ["Core employee-data layer", "System of record for profiles, documents, org data, absences, and permissions", "Personio application and data model", "No public reference architecture or scalability disclosure in assigned evidence"]
      - ["Workflow and automation layer", "Approvals, task routing, reporting, and employee/manager self-service", "Personio workflow logic and reporting surfaces", "Independent review says reporting remains less advanced than specialist analytics tools"]
      - ["Payroll operating layer", "Prepare payroll inputs, validations, payslip previews, and authority communication", "Country-specific payroll scope plus provider or advisor workflows", "Execution coverage is not universal and diligence needs exact country support map"]
      - ["Add-on application layer", "Recruiting, performance, compensation, surveys, conversations, and whistleblowing", "Optional app activation and product packaging", "Suite breadth can mask uneven module maturity or add-on sprawl"]
      - ["Integration and API layer", "Connect Personio with collaboration, analytics, payroll, and identity systems", "Marketplace partners, APIs, and partner maintenance", "Customer value depends on third-party connector quality and upgrade compatibility"]
      - ["Embedded EOR layer", "Global hiring and employment administration from the HRIS menu", "Remote as legal-employer and execution infrastructure", "Commercial and service risk sits partly outside Personio's directly owned stack"]
    notes: "This is an operating-model map, not a software-code architecture diagram; the assigned evidence is strong on workflow layers and weak on infrastructure internals, observability, and performance benchmarks."
    claimRefs: ["CE002", "CE007", "CE009", "CE010", "CE012", "CE013"]
