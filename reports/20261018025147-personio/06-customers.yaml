  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / proof item
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Mindful Chef
        - European SMB customer
        - Workflow automation and personalised HR process design
        - Production customer quote in company press release
        - Sarah Thomas said Personio offered automation and personalization suited to unique processes
        - Single company-issued quote from 2022; no renewal, seat count, or quantified ROI
      - - Microsoft Teams and Slack customer cohort
        - Existing Personio customers using collaboration tools
        - Automatic notifications, updates, and out-of-office workflow syncing
        - Aggregate production-usage description, not a named account
        - Press release says these are the most common tools used by Personio customers for workflow updates
        - Useful attach evidence, but not a named end-customer deployment
      - - Workforce-planning marketplace cohort
        - Customers extending beyond core HR into planning and analytics
        - Partner apps such as bdg ONE | People, Orgnostic, and peopleIX
        - Production ecosystem inventory, not direct customer references
        - Shows Personio can sit inside broader planning workflows
        - Proves ecosystem breadth rather than customer retention or deployment depth
    notes: Publicly named proof in the assigned pool is sparse, so this table mixes one named customer quote with the closest adjacent ecosystem evidence rather than pretending a broader named-customer census exists.
    enumerationScope:
      coverage: sample
      basis: Publicly visible proof items in the assigned pool only; includes one named customer quote plus two ecosystem proxies, not an exhaustive customer list.
