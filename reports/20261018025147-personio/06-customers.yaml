callouts:
  - calloutType: strength
    title: Clear European SMB wedge
    body: The assigned pool consistently shows Personio selling into compliance-sensitive European SMB workflows, which makes customer identity clearer than customer durability.
    claimRefs:
      - CU004
      - CU005
      - CU011
  - calloutType: insight
    title: Expansion proof is product-led
    body: Public evidence supports marketplace, payroll, and app attach, but it still says more about product-surface breadth than about cohort retention or account-level expansion economics.
    claimRefs:
      - CU007
      - CU008
      - CU010
  - calloutType: risk
    title: Durability is still under-disclosed
    body: Without NRR, GRR, logo churn, contract length, or concentration data, a large customer base does not yet translate into underwritten customer quality.
    claimRefs:
      - CU009
      - CU013
      - CU014
