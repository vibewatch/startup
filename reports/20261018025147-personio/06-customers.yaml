        - No public split by country, active seats, or revenue band
      - - Compliance-heavy DACH and wider European employers
        - HR and payroll leadership
        - HR, payroll, managers
        - Employer operations budget
        - GDPR-ready HR core plus local payroll/process support
        - Independent reviews repeatedly frame Personio as Europe-first and compliance-led
        - Strongest competitive wedge versus US-first HR suites
        - No disclosed retention or win-rate by region
      - - Modular app and integration adopters
        - HRIS admin / people systems owner
        - HR team plus adjacent finance and operations users
        - Employer software budget
        - Add recruiting, performance, payroll, workflows, and integrations over time
        - 70% of customers used apps and APIs in 2022; workforce-planning marketplace shows many adjacent tools
        - Suggests land-and-expand through product surface rather than one-time seat sales
        - Public materials do not quantify attach rates by module
      - - Payroll and international expansion cohort
        - Payroll, HR, finance
        - Payroll teams, managers, international hires
        - Employer payroll / people operations budget
        - Native payroll where supported plus Remote-powered EOR for international hiring
        - Employsome says payroll passed 1,500 customers by Q1 2026
        - Shows cross-sell path beyond core HR into higher-stakes workflows
        - No public renewal, gross margin, or country-mix disclosure for payroll or EOR
    notes: Official and third-party sources are mixed; scale figures are directional public proofs rather than audited cohort disclosures, and missing denominators remain explicit.
