  evidenceGaps:
    - type: missing-source
      severity: material
      topic: durability-gap
      missingEvidence: Cohort-level GRR, NRR, logo churn, renewal rate, contract length, and segment retention by core HR, payroll, and EOR.
      whyItMatters: Customer-count scale without durability metrics does not show whether Personio's installed base is sticky, efficiently expanding, or at risk of hidden churn.
      diligencePath: Request cohort retention tables, renewal dashboards, and product-attach by vintage from management or the data room.
      relatedQuestionRefs:
        - QU004
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: More named production customers with deployment details, quantified outcomes, and freshness newer than the 2022 Mindful Chef quote.
      whyItMatters: Named proofs are the clearest bridge between logo-level demand and production, referenceable customer value.
      diligencePath: Ask for current reference customers by segment, signed case studies, and at least three live payroll or recruiting deployments.
      relatedQuestionRefs:
        - QU003
      relatedTableRefs:
        - TU003
    - type: missing-source
      severity: material
      topic: concentration-risk
      missingEvidence: Top-customer concentration, partner-channel contribution, payroll/EOR revenue mix, and attach rates by module.
      whyItMatters: Expansion narratives can mask concentration or low-quality cross-sell if the customer and product mix is undisclosed.
      diligencePath: Request customer concentration schedules, partner-sourced pipeline mix, and module-level attach by account band.
      relatedQuestionRefs:
        - QU005
