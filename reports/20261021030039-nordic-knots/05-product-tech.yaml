callouts:
  - calloutType: risk
    title: Brand strength does not establish operating repeatability
    body: >-
      The public record verifies assortment, materials, and design intent, but it does
      not quantify factory capacity, supplier concentration, defect rates, delivery
      performance, returns, or service levels. Underwriting should treat these as
      missing operating evidence rather than infer reliability from premium positioning.
    claimRefs: [CE002, CE011, CE012]
