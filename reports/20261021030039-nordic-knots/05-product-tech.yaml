    columns: [Layer or control, Role, Public dependency, Principal risk, Diligence request]
    rows:
      - [Stockholm atelier, "Design system, collection direction, and product specification", "Internal creative team and external collaborators", "Key-person and taste concentration", "Product-development calendar, approval gates, and collaborator economics"]
      - [Material sourcing, "Wool, jute, linen, cotton, and blended textile inputs", "New Zealand wool and unspecified material suppliers", "Fiber quality, traceability, price volatility, and chemical-treatment uncertainty", "Bills of material, certifications by SKU, restricted-substance testing, and dual-source coverage"]
      - [India rug production, "Hand-crafted and handwoven rug manufacturing", "Master artisans and supplier facilities in India", "Capacity, labor compliance, consistency, and geopolitical or logistics disruption", "Factory list, concentration, GoodWeave scope, audit results, capacity, and contingency plan"]
      - [Italian fabric mills, "Weaving curtain, upholstery, and other fabrics", "Unnamed select mills in Italy", "Mill concentration, minimum runs, color consistency, and lead time", "Mill roster, contractual capacity, quality rejects, and alternate-source qualification"]
      - [Quality and ESG controls, "Supplier requirements and audit framework", "Supplier code, GoodWeave, SMETA assessments, and B Corp certification", "Company-led disclosure lacks findings and remediation detail", "Independent certificates, audit population, exceptions, remediation aging, and product-test records"]
      - [Commerce and fulfillment, "Configuration, checkout, inventory allocation, delivery, returns, and support", "E-commerce storefront, carriers, stores, and service team", "Stockouts, last-mile failures, response latency, privacy, and platform resilience", "Architecture, uptime, incident log, service SLAs, return reasons, and on-time-in-full data"]
    notes: "Architecture is reconstructed only from cited public descriptions; unnamed systems, suppliers, capacities, test results, and service levels remain diligence gaps."
    claimRefs: [CE002, CE003, CE004, CE005, CE009, CE016]
