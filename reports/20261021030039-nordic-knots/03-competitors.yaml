    rows:
      - - Nordic Knots US sampled rugs
        - Starting prices from $395 to $1,995 across displayed examples
        - Finished premium rug; materials and construction vary
        - Realized price, promotions, returns, and freight mix unknown
        - Establishes premium positioning but not average selling price
      - - Nordic Knots EU sampled rugs
        - Starting prices from €295 to €1,895 across displayed examples
        - Finished premium rug; materials and construction vary
        - VAT treatment, promotions, returns, and realized price mix unknown
        - Shows regional list-price architecture, not currency-adjusted parity
      - - Nordic Knots curtains and shades
        - US displayed examples start around $195 to $645
        - Curtain or Roman shade; fabric and lining vary
        - Width, length, lining, hardware, and installation alter delivered cost
        - Broadens wallet share but raises configuration complexity
      - - Ruggable
        - Prices start at $89
        - Two-layer system with rug cover and pad options
        - Like-for-like size, texture, and replacement-cover economics not normalized
        - Lower entry point and washability can pressure functional use cases
      - - Loloi
        - Unknown in assigned evidence
        - Rugs plus adjacent home accessories and collaborations
        - Wholesale, retail, designer, and promotional pricing unavailable
        - Distribution breadth is visible, but price pressure cannot be quantified
      - - Designer, showroom, or multi-supplier route
        - Project-specific / unknown
        - Curation, tactile evaluation, and multi-brand sourcing
        - Fees, trade discounts, lead times, and installation vary
        - Preserves multi-homing and limits brand lock-in
    notes: >-
