  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: switching-and-retention
      missingEvidence: >-
        Comparable repeat-purchase, retention, cross-category attachment, trade-account activity,
        customer acquisition cost, and competitor-switching data.
      whyItMatters: >-
        These measures determine whether product breadth creates durable relationship value or merely
        allows customers to multi-home across brands without meaningful switching cost.
      diligencePath: >-
        Request cohort retention, repeat-order, cross-category basket, trade-account, and customer
        survey data segmented by geography and acquisition channel.
      relatedQuestionRefs: [QP005]
    - type: missing-source
      severity: material
      topic: competitor-economics
      missingEvidence: >-
        Current competitor revenue, gross margin, funding, market share, channel mix, realized
        pricing, discounting, return rates, and store productivity on a common period basis.
      whyItMatters: >-
        Without normalized operating data, scale and pricing power cannot be compared and the
        positioning map remains directional rather than an underwriting benchmark.
      diligencePath: >-
        Obtain competitor filings or lender materials where available, retailer sell-through data,
        channel checks, matched-SKU price histories, and third-party market-share estimates.
      relatedQuestionRefs: [QP010]
