figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Analyst ordinal placement separates luxury-design positioning from functional convenience
      and distribution breadth; scores are directional evidence syntheses, not market measurements.
    data:
      xAxis:
        label: Functional convenience and distribution breadth (ordinal)
        min: 1
        max: 5
      yAxis:
        label: Luxury design positioning (ordinal)
        min: 1
        max: 5
      points:
        - label: Nordic Knots
          x: 4
          y: 5
          detail: Broad textile assortment, consultation, trade access, and expanding stores support reach while preserving premium design.
        - label: Ruggable
          x: 5
          y: 2
          detail: Washable two-layer utility and a lower starting price emphasize functional convenience.
        - label: Loloi
          x: 4
          y: 3
          detail: Mature rug assortment, adjacent categories, collaborations, and broad customer distribution support breadth.
        - label: Traditional multi-category retailers
          x: 4
          y: 3
          detail: Established stores and bundled room shopping are directional archetype advantages; direct assigned benchmarks are absent.
        - label: Local showroom or designer route
          x: 3
          y: 4
          detail: Tactile curation and multi-brand sourcing can support premium projects, but economics are fragmented.
        - label: Internal multi-supplier build
          x: 2
          y: 3
          detail: Flexible multi-homing offsets high search and coordination effort; no standardized offer exists.
    approximationNotes: >-
      Ordinal 1-5 scores are analyst synthesis from cited product, price, channel, and positioning
      evidence. They are not revenue-weighted, customer-surveyed, or statistically benchmarked;
      archetype positions are directional and carry lower confidence than named-brand positions.
    claimRefs: [CP016]
callouts:
  - calloutType: risk
    title: Differentiation is brand-led, not lock-in-led
    body: >-
      Nordic Knots can deepen preference through design, materials, collaborations, and stores, but
      households and designers can still multi-home across rug and textile suppliers. Functional
      washability and established distribution attack different parts of the buying decision.
    claimRefs: [CP001, CP012, CP014, CP016]
