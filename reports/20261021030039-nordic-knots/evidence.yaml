evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current capitalization table, board roster, voting rights, investor consent rights, liquidation preferences, and
      founder vesting or succession terms.
    whyItMatters: >-
      The reported minority investment cannot be translated into control, dilution, or downside economics without the
      underlying ownership and security terms.
    diligencePath: >-
      Request the fully diluted cap table, charter, shareholder agreement, financing documents, board minutes, and
      founder employment and vesting agreements.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-scale
    missingEvidence: >-
      Audited 2025 and 2026 revenue, gross margin, EBITDA or EBIT, cash flow, cash balance, debt, valuation, headcount,
      and customer count.
    whyItMatters: >-
      Management-reported growth and a revenue target do not establish realized scale, profitability, liquidity,
      valuation, or operating leverage.
    diligencePath: >-
      Obtain audited financial statements, monthly management accounts, bank and debt schedules, payroll records,
      customer cohorts, and the March 2026 financing close package.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: >-
      Complete executive-team and board roster, current role of Felix Berglund, reporting lines, succession coverage,
      and leadership-change history.
    whyItMatters: >-
      Founder concentration and an incomplete public leadership map prevent assessment of governance depth and
      key-person resilience.
    diligencePath: >-
      Request the organization chart, board materials, executive biographies, employment agreements, retention plan, and
      a three-year leadership-change log.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: adverse-history
    missingEvidence: >-
      Independent litigation, regulatory, recall, labor, outage, and adverse-event chronology matched to all operating
      jurisdictions.
    whyItMatters: >-
      The assigned pool contains no independent adverse record, so absence of a cited incident cannot be read as
      evidence that none occurred.
    diligencePath: >-
      Run jurisdiction-specific court, regulator, labor, recall, and sanctions checks and obtain management's claims and
      incident register.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: market-scale
    missingEvidence: >-
      A current independent estimate for premium rugs and home textiles using a geography and category boundary
      comparable to Nordic Knots.
    whyItMatters: >-
      Without aligned category and geography denominators, TAM, SAM, SOM and market share cannot be calculated
      defensibly.
    diligencePath: >-
      Commission or obtain underlying analyst datasets for premium rugs, window textiles and bedding in the United
      States and core European markets, then reconcile definitions.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-segments
    missingEvidence: >-
      Revenue, gross margin, repeat purchase and cohort retention split across direct consumer, designer or trade,
      hospitality and retail-store channels.
    whyItMatters: Customer share alone does not show channel economics, concentration, durability or wallet expansion.
    diligencePath: >-
      Request audited channel revenue and contribution-margin schedules plus anonymized customer cohort exports for 2024
      through 2026.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: retail-expansion
    missingEvidence: >-
      Store-level sales density, four-wall margin, acquisition lift and payback for Stockholm, New York, London and Los
      Angeles.
    whyItMatters: >-
      The evidence establishes a flagship strategy but not whether physical expansion creates attractive incremental
      returns.
    diligencePath: Review monthly store P&Ls, pre- and post-opening digital cohorts and approved investment cases for every location.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: sourcing-constraints
    missingEvidence: >-
      Supplier count, capacity, lead times, country and mill concentration, audit exceptions, tariff exposure and
      contingency coverage.
    whyItMatters: >-
      International artisan and mill sourcing may support differentiation while also creating capacity, cost and
      disruption risk.
    diligencePath: >-
      Obtain the supplier master, purchase-order concentration, audit reports, landed-cost bridges and documented
      alternate-source plans.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: switching-and-retention
    missingEvidence: >-
      Comparable repeat-purchase, retention, cross-category attachment, trade-account activity, customer acquisition
      cost, and competitor-switching data.
    whyItMatters: >-
      These measures determine whether product breadth creates durable relationship value or merely allows customers to
      multi-home across brands without meaningful switching cost.
    diligencePath: >-
      Request cohort retention, repeat-order, cross-category basket, trade-account, and customer survey data segmented
      by geography and acquisition channel.
    relatedQuestionRefs:
      - QP005
  - type: missing-source
    severity: material
    topic: competitor-economics
    missingEvidence: >-
      Current competitor revenue, gross margin, funding, market share, channel mix, realized pricing, discounting,
      return rates, and store productivity on a common period basis.
    whyItMatters: >-
      Without normalized operating data, scale and pricing power cannot be compared and the positioning map remains
      directional rather than an underwriting benchmark.
    diligencePath: >-
      Obtain competitor filings or lender materials where available, retailer sell-through data, channel checks,
      matched-SKU price histories, and third-party market-share estimates.
    relatedQuestionRefs:
      - QP010
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: >-
      Cohort-level CAC, paid versus organic acquisition, repeat purchase, retention, returns, LTV, payback, and channel
      economics.
    whyItMatters: >-
      The public growth rate cannot distinguish durable brand demand from acquisition-intensive growth or quantify
      contribution profit.
    diligencePath: >-
      Obtain monthly 2024-2026 customer and order cohorts by geography and channel, reconcile them to the general
      ledger, and test CAC and payback definitions.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: financial-statements
    missingEvidence: >-
      Audited FY2025-FY2026 income statements, balance sheets, cash-flow statements, gross-margin schedules, and
      revenue-recognition policies.
    whyItMatters: >-
      Reported revenue and EBIT cannot establish gross-profit quality, working-capital consumption, cash conversion, or
      comparability without primary financial records.
    diligencePath: >-
      Request audited accounts, monthly management accounts, trial-balance support, and a quality-of-earnings
      reconciliation for all reported metrics.
    relatedQuestionRefs:
      - QI004
      - QI010
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Primary-versus-secondary financing proceeds, post-close cash, monthly burn, debt and lease obligations, restricted
      cash, use-of-funds budget, and downside runway.
    whyItMatters: A financing headline does not show cash available to fund expansion or the trigger for another capital raise.
    diligencePath: >-
      Reconcile closing documents to bank statements and build base, downside, and expansion cases through at least 24
      months.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: store-economics
    missingEvidence: >-
      Store-level revenue, contribution margin, capex, lease terms, inventory allocation, cannibalization, and payback
      for New York, Los Angeles, London, and Stockholm.
    whyItMatters: Physical expansion could deepen brand reach while also adding fixed costs and working-capital requirements.
    diligencePath: >-
      Review four-wall P&Ls and investment memos by location, then compare actual ramp curves with original
      underwriting.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Revenue mix, discounts, returns, refunds, custom-order deposits, trade pricing, wholesale terms, customer
      concentration, and geographic concentration.
    whyItMatters: >-
      List prices and product breadth do not establish realized revenue, revenue recognition, repeatability, or net
      margin.
    diligencePath: >-
      Obtain order-line and invoice data by SKU, channel, customer, and geography and reconcile gross billings through
      returns to recognized revenue.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI010
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: supplier-controls
    missingEvidence: >-
      Named supplier and factory roster, spend and capacity concentration, audit population and findings, remediation
      history, and tested contingency capacity.
    whyItMatters: >-
      A distributed craft model cannot be underwritten for continuity, labor compliance, or scale without facility-level
      evidence.
    diligencePath: >-
      Request the supplier master, contracts, GoodWeave scope, recent SMETA reports, corrective-action logs, capacity
      plans, and alternate-source qualifications.
    relatedQuestionRefs:
      - QE003
      - QE006
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: >-
      On-time-in-full delivery, stockout, defect, return, remake, warranty, support-response, and custom-order
      cycle-time metrics by product line and cohort.
    whyItMatters: >-
      Dated customer complaints identify plausible failure modes but cannot establish their current frequency or
      financial impact.
    diligencePath: >-
      Obtain monthly operating dashboards, return-reason data, carrier claims, support tickets, quality-control records,
      and cohort trends for 2024-2026.
    relatedQuestionRefs:
      - QE004
      - QE008
    relatedTableRefs:
      - TE001
      - TE002
      - TE003
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      A public developer surface or credible practitioner-community proxy for production engineering, quality systems,
      or commerce infrastructure.
    whyItMatters: The assigned pool provides no external operating-community signal beyond consumer reviews and editorial features.
    diligencePath: >-
      Request engineering and operations recruiting materials, systems architecture, vendor references,
      quality-community presentations, and practitioner references.
    relatedQuestionRefs:
