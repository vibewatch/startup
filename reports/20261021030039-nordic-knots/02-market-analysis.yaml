    columns: ["Segment or category", "Included spend", "Excluded spend", "Buyer or payer", "Relevance to Nordic Knots"]
    rows:
      - ["Premium rugs", "Standard, designer-collaboration and high-craft rugs", "Mass-market commodity rugs and antique resale", "Consumer or designer on behalf of client", "Core entry category and brand foundation"]
      - ["Custom floor textiles", "Custom-sized rugs and wall-to-wall carpet", "Floor installation, hard flooring and construction", "Homeowner, designer or project buyer", "Extends rugs into project-led spend"]
      - ["Curtains and shades", "Ready-made and custom curtains, Roman shades, hardware and samples", "General window construction and unrelated smart-home systems", "Consumer, designer or project buyer", "Adjacent room-envelope category"]
      - ["Bedding and decor", "Bedding, headboards, pillows, throws and bedspreads", "Mattresses, bedroom furniture and general household goods", "Consumer or designer", "Raises room-level wallet share"]
      - ["Fabric and consultation", "Fabric by the yard, samples and design consultation", "Full-service interior-design fees and furniture manufacturing", "Designer, upholsterer or consumer", "Supports trade adoption and future category extension"]
    notes: "Boundary is based on the live Nordic Knots assortment and independent descriptions of its positioning; exclusions prevent broad home-furnishings spend from being treated as addressable."
    claimRefs: [CM001, CM002, CM003, CM004, CM005]
  - id: "TM002"
    title: "Evidence-constrained sizing lenses"
    columns: ["Lens", "Period and geography", "Observed value", "Methodology", "Confidence and limitation"]
    rows:
      - ["Company revenue target", "2026; global company revenue", "> $100 million", "Management target reported by WWD", "Medium; target is not realized revenue, TAM or market share"]
      - ["Designer channel", "Reported March 2026; customer base", "Roughly 30% of customers", "Founder interview reported by Business of Home", "Medium; customer share is not revenue share"]
      - ["Broader market direction", "Q1 2026; Williams-Sonoma reference market", "Low-single-digit decline", "Public competitor management commentary", "Low for Nordic Knots sizing; category boundary and issuer differ"]
    notes: "Values preserve each source's metric, period and denominator. They are triangulation lenses only; none is presented as Nordic Knots TAM, SAM or SOM."
    claimRefs: [CM006, CM008, CM013]
  - id: "TM003"
    title: "Segment, buyer and adoption map"
    columns: ["Segment", "Buyer", "User", "Payer", "Workflow and budget owner", "Adoption trigger"]
    rows:
      - ["Direct consumer", "Design-conscious homeowner or renter", "Household occupants", "Consumer", "Online discovery, sample or consultation, then direct purchase from home-furnishings budget", "Distinctive design, material quality and room refresh"]
      - ["Interior designer and trade", "Interior designer", "Designer client", "Client or design practice", "Designer specifies products and orders through the trade program or portal", "Curated assortment, trade support and project fit"]
      - ["Flagship-assisted consumer", "Local or visiting consumer", "Household occupants", "Consumer", "In-person product evaluation followed by store or online order", "Need to experience texture, scale and brand environment"]
      - ["Custom textile project", "Consumer or designer", "Household or project occupant", "Consumer or project client", "Measure, sample and consultation before custom rug, carpet or window-treatment order", "Nonstandard dimensions or coordinated room treatment"]
      - ["Whole-room textile buyer", "Consumer or designer", "Household occupants", "Consumer or client", "Cross-category purchase spanning rug, window and bedroom textiles", "Desire for a coordinated premium interior"]
    notes: "The map combines observed channels and assortment with explicit analytical workflow interpretation; hospitality and contract demand are excluded because retained sources do not quantify Nordic Knots participation."
    claimRefs: [CM001, CM006, CM007, CM010, CM011, CM012, CM016]
figures:
  - id: "FM001"
    title: "Evidence-constrained addressability hierarchy"
    type: "pyramid"
    summary: "A scope hierarchy distinguishes the broad adjacency from Nordic Knots' evidenced product, buyer and geographic footholds; it is not a value-proportional TAM chart."
    data:
      items:
        - label: "Premium home furnishings"
          value: "Broad adjacency"
          detail: "Useful only as macro context; retained evidence does not isolate Nordic Knots' share of this broad arena."
        - label: "Premium home textiles"
          value: "Defensible category"
          detail: "Rugs, curtains, shades, bedding, decor and fabric form the evidenced category boundary."
        - label: "Premium rugs and custom floor textiles"
          value: "Core market"
          detail: "The founding category spans standard, designer and custom or wall-to-wall offerings."
        - label: "Direct consumer demand"
          value: "Primary route"
          detail: "Online and flagship selling address design-conscious consumers directly."
        - label: "Designer and trade demand"
          value: "~30% of customers"
          detail: "Business of Home reported that designers represent roughly 30% of the customer base."
        - label: "Demonstrated company-scale proxy"
          value: "> $100m 2026 target"
          detail: "The management revenue target is evidence of intended scale, not a market-size estimate."
    approximationNotes: "Conceptual hierarchy only. Layer widths and order do not encode market values; the two numeric labels retain their original company-level denominators."
    claimRefs: [CM006, CM007, CM008, CM010, CM011, CM016]
callouts:
  - calloutType: "insight"
    title: "The strongest sizing evidence is bottom-up"
    body: "Company revenue ambition, US concentration and designer participation establish meaningful demand, but they cannot be divided into a broad market estimate to infer share without aligned category and geography denominators."
    claimRefs: [CM006, CM007, CM008]
  - calloutType: "risk"
    title: "Macro resilience is not yet proven"
    body: "The company's revenue ambition coexists with competitor-reported home-furnishings softness and exposure to tariffs, fuel costs, rates and international sourcing; cohort and margin data are needed before treating expansion as cycle-resistant."
    claimRefs: [CM008, CM013, CM014, CM015]
