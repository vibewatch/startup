figures:
  - id: FU001
    title: Customer journey and observable expansion surfaces
    type: journey-map
    summary: >-
      Public surfaces support a path from design discovery to direct or partner purchase and
      cross-category expansion, while post-purchase retention remains unmeasured.
    data:
      items:
        - label: Design discovery
          detail: Editorial coverage, collaborations, and styled placements introduce the brand.
          touchpoints: ["Design press", "Collaborator collections", "Social and showroom imagery"]
        - label: Product exploration
          detail: Shoppers browse rugs, curtains, shades, bedding, decor, and fabric.
          touchpoints: ["Direct storefront", "Moda Operandi", "Physical stores"]
        - label: Specification support
          detail: Samples, consultations, custom sizing, and Pro Account benefits support considered purchases.
          touchpoints: ["Design consultation", "Samples", "Trade account"]
        - label: Purchase
          detail: Orders can flow through the direct channel or selected retail partners.
          touchpoints: ["Nordic Knots online", "Moda Operandi", "Harvey Nichols"]
        - label: Delivery and installation
          detail: The company advertises standard delivery and offers physical spaces for product experience.
          touchpoints: ["Home delivery", "Store visit", "Hospitality placement"]
        - label: Category expansion
          detail: Rugs can lead into curtains, bedding, decor, and fabric, but repeat behavior is not disclosed.
          touchpoints: ["Whole-room textiles", "Professional projects", "Unverified repeat purchase"]
    approximationNotes: "The ordered stages synthesize observed customer-facing surfaces; they do not measure conversion rates or prove a shared funnel population."
    claimRefs: [CU001, CU007, CU008, CU011]
callouts:
  - calloutType: risk
    title: Customer durability is still a private-data question
    body: >-
      Growth and channel expansion are visible, but no retained source quantifies repeat
      purchase, retention, churn, satisfaction, or top-account concentration. The US-heavy
      mix and company-described operating-system buildout increase the importance of cohort,
      service-level, and channel-profitability diligence.
    claimRefs: [CU002, CU003, CU004, CU014]
