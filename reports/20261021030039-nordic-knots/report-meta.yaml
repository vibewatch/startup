companyProfile:
  summary: >-
    Nordic Knots is a founder-led, Stockholm-based premium home-textiles company founded in 2016. It has expanded from
    rugs into curtains, shades, bedding, decor, fabrics, and custom products, with the United States reported as its
    largest market. A March 2026 minority investment near $100 million supports continued category and retail expansion,
    but ownership terms and audited scale remain undisclosed.
