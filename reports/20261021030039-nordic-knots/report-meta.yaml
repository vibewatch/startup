  topStrengths:
    - Reported 85% sales growth in 2025 and a 2026 revenue target above $100 million indicate strong brand momentum.
    - >-
      The assortment has broadened from rugs into a multi-category premium home platform across direct, retail, trade,
      and selected wholesale channels.
    - >-
      Founder continuity, a near-$100 million reported minority investment, and wider international retail visibility
      support the expansion thesis.
  topRisks:
    - Audited revenue, gross margin, cash flow, working capital, and capital availability are not publicly established.
    - >-
      Caplight's $2.2 billion estimate implies a stretched entry context without verified transaction terms or
      comparable valuation evidence.
    - >-
      Customer retention, acquisition efficiency, channel concentration, store payback, and repeat-purchase durability
      remain unverified.
    - Supplier concentration, factory-level audit findings, quality metrics, and contingency capacity are not disclosed.
    - Rapid category and physical-retail expansion increases inventory, quality, fixed-cost, and execution risk.
  unresolvedGaps:
    - >-
      Audited FY2024-FY2026 financial statements, gross margin, EBITDA or EBIT bridge, cash flow, working capital, cash,
      debt, and revenue-recognition policies.
    - >-
      Current capitalization table, primary and secondary proceeds, liquidation preferences, participation and
      anti-dilution rights, and option-pool obligations.
    - >-
      Customer cohorts, repeat purchase, retention, acquisition cost, returns, satisfaction, channel economics, and
      account or geographic concentration.
    - >-
      Supplier and factory roster, production concentration, subcontractor coverage, audit findings, remediation
      history, capacity, and alternate-source plans.
    - >-
      Store-level contribution, capex, lease terms, inventory allocation, cannibalization, and payback across New York,
      Los Angeles, London, and Stockholm.
