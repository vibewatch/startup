  topStrengths:
    - 2025 年销售额据报道增长 85%，2026 年收入目标超过 $100 million，显示品牌势头强劲。
    - 产品组合已从地毯扩展为多品类高端家居平台，覆盖直营、零售、设计师渠道和精选批发渠道。
    - 创始团队保持稳定，据报道接近 $100 million 的少数股权投资，以及不断扩大的国际零售曝光度，共同支撑扩张逻辑。
  topRisks:
    - 经审计的收入、毛利率、现金流、营运资本和可用资金，尚未有公开依据。
    - Caplight 的 $2.2 billion 估值意味着入场价格可能偏高，但交易条款和可比估值证据都未获核实。
    - 客户留存、获客效率、渠道集中度、门店回本和复购持续性仍未得到验证。
    - 供应商集中度、工厂层面的审计结果、质量指标和应急产能均未披露。
    - 品类和实体零售扩张过快，会放大库存、质量、固定成本和执行风险。
  unresolvedGaps:
    - 经审计的 FY2024-FY2026 财务报表、毛利率、EBITDA 或 EBIT 变动桥、现金流、营运资本、现金、债务及收入确认政策。
    - 当前资本表、原始发行和老股转让所得、清算优先权、参与权、反稀释权及期权池义务。
    - 客户 cohort、复购、留存、获客成本、退货、满意度、渠道经济性，以及客户或地域集中度。
    - 供应商和工厂名单、生产集中度、分包商覆盖范围、审计结果、整改历史、产能及替代供应来源计划。
    - 纽约、洛杉矶、伦敦和斯德哥尔摩各门店的贡献、资本开支、租约条款、库存分配、内部蚕食和回本情况。
