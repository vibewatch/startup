  - id: FV001
    title: Recommendation logic from operating proof to entry decision
    type: flow
    summary: >-
      The evidence chain ends at research-more because growth and product proof do not close the valuation, cash-flow,
      or preference-term gaps.
    data:
      nodes:
        - id: reported-growth
          label: Reported growth
          value: 85% sales growth in 2025
          detail: WWD attribution, not audited financial disclosure
        - id: revenue-target
          label: Scale target
          value: More than $100M 2026 revenue
          detail: Company target reported by WWD
        - id: valuation-anchor
          label: Valuation anchor
          value: $2.2B estimate
          detail: Caplight estimate based on funding-round data
        - id: ratio-sensitivity
          label: Mixed-source sensitivity
          value: Below 22x target revenue
          detail: Estimate divided by the minimum stated target; not an audited multiple
        - id: diligence-gap
          label: Missing underwriting proof
          value: Margins, cash flow, retention, cap table
          detail: Public sources reviewed do not disclose the required inputs
        - id: decision
          label: Decision
          value: Research-more
          detail: Low confidence, high risk, stretched valuation stance
    approximationNotes: >-
      The below-22x ratio combines Caplight's $2.2B estimate with a company target above $100M; it is a directional
      ceiling, not a transaction or audited trailing-revenue multiple.
    claimRefs:
      - CV004
      - CV005
      - CV009
      - CV013
      - CV014
      - CV015
      - CV016
