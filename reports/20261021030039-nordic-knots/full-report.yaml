  - id: FM001
    title: Evidence-constrained addressability hierarchy
    type: pyramid
    summary: >-
      A scope hierarchy distinguishes the broad adjacency from Nordic Knots' evidenced product, buyer and geographic
      footholds; it is not a value-proportional TAM chart.
    data:
      items:
        - label: Premium home furnishings
          value: Broad adjacency
          detail: Useful only as macro context; retained evidence does not isolate Nordic Knots' share of this broad arena.
        - label: Premium home textiles
          value: Defensible category
          detail: Rugs, curtains, shades, bedding, decor and fabric form the evidenced category boundary.
        - label: Premium rugs and custom floor textiles
          value: Core market
          detail: The founding category spans standard, designer and custom or wall-to-wall offerings.
        - label: Direct consumer demand
          value: Primary route
          detail: Online and flagship selling address design-conscious consumers directly.
        - label: Designer and trade demand
          value: ~30% of customers
          detail: Business of Home reported that designers represent roughly 30% of the customer base.
        - label: Demonstrated company-scale proxy
          value: '> $100m 2026 target'
          detail: The management revenue target is evidence of intended scale, not a market-size estimate.
    approximationNotes: >-
      Conceptual hierarchy only. Layer widths and order do not encode market values; the two numeric labels retain their
      original company-level denominators.
    claimRefs:
      - CM006
      - CM007
      - CM008
      - CM010
      - CM011
      - CM016
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Analyst ordinal placement separates luxury-design positioning from functional convenience and distribution
      breadth; scores are directional evidence syntheses, not market measurements.
    data:
      xAxis:
        label: Functional convenience and distribution breadth (ordinal)
        min: 1
        max: 5
      yAxis:
        label: Luxury design positioning (ordinal)
        min: 1
        max: 5
      points:
        - label: Nordic Knots
          x: 4
          'y': 5
          detail: >-
            Broad textile assortment, consultation, trade access, and expanding stores support reach while preserving
            premium design.
        - label: Ruggable
          x: 5
          'y': 2
          detail: Washable two-layer utility and a lower starting price emphasize functional convenience.
        - label: Loloi
          x: 4
          'y': 3
          detail: Mature rug assortment, adjacent categories, collaborations, and broad customer distribution support breadth.
        - label: Traditional multi-category retailers
          x: 4
          'y': 3
          detail: >-
            Established stores and bundled room shopping are directional archetype advantages; direct assigned
            benchmarks are absent.
        - label: Local showroom or designer route
          x: 3
          'y': 4
          detail: Tactile curation and multi-brand sourcing can support premium projects, but economics are fragmented.
        - label: Internal multi-supplier build
          x: 2
          'y': 3
          detail: Flexible multi-homing offsets high search and coordination effort; no standardized offer exists.
    approximationNotes: >-
      Ordinal 1-5 scores are analyst synthesis from cited product, price, channel, and positioning evidence. They are
      not revenue-weighted, customer-surveyed, or statistically benchmarked; archetype positions are directional and
      carry lower confidence than named-brand positions.
    claimRefs:
      - CP016
  - id: FI001
    title: Revenue model bridge with unverified economics
    type: flow
    summary: >-
      The public storefront shows how demand can convert to transactional revenue, while every step from realized price
      to gross profit remains undisclosed.
    data:
      nodes:
        - id: discovery
          label: Brand and product discovery
          detail: Editorial exposure, collaborations, ecommerce, and physical retail attract demand.
        - id: selection
          label: Category and configuration
          detail: Customers select standard or custom rugs, curtains, bedding, decor, or fabric.
        - id: order
          label: List-price order
          detail: A direct transaction is placed; discounts and trade terms are not disclosed.
        - id: fulfillment
          label: Production and fulfillment
          detail: Artisan and mill production, inventory, delivery, and returns create variable costs.
        - id: net-revenue
          label: Net revenue
          detail: Realized price less discounts, returns, taxes, and channel effects is unavailable.
        - id: gross-profit
          label: Gross profit
          detail: Product, freight, fulfillment, and channel costs are unavailable, so no public bridge is possible.
    approximationNotes: >-
      This is a mechanism map, not a quantitative funnel or waterfall; it makes no conversion-rate, revenue-mix, or
      margin assumption.
    claimRefs:
      - CI002
      - CI014
