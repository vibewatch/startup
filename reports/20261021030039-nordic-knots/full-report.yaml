        - WWD reported 85% sales growth in 2025
        - Audited revenue and cash conversion would strengthen the thesis
      - - Thesis
        - Broader premium-home platform
        - The current site spans rugs, curtains, shades, bedding, decor, and fabric
        - Category-level revenue and repeat purchase would show whether breadth is productive
      - - Anti-thesis
        - Price may outrun proof
        - Caplight estimates $2.2B, but no audited economics or disclosed priced secondary are public
        - A lower entry price or audited profitable scale could resolve this concern
      - - Anti-thesis
        - DTC durability is unproven
        - A 5W study of 50 failed DTC brands cites acquisition, loyalty, founder-transition, and channel risks
        - Nordic Knots-specific CAC, retention, channel mix, and governance evidence could rebut the category risk
    notes: >-
      The 5W DTC cohort is a directional adverse category signal issued by a communications firm, not an independent
      benchmark or evidence that Nordic Knots shares each failure pattern.
    claimRefs:
      - CV005
      - CV009
      - CV012
      - CV013
      - CV015
  - id: TV003
    title: Bull, base, and bear scenario framework
    columns:
      - Scenario
      - Operating assumptions
      - Valuation and return logic
      - Probability signal
    rows:
      - - Bull
        - >-
          More than $100M 2026 revenue target achieved; audited margins and cash conversion are strong; retention and
          stores validate efficient growth
        - >-
          The $2.2B estimate may become underwritable only after a diligence-derived range and target return are
          established
        - Positive only after audited target achievement and durable unit economics
      - - Base
        - Growth continues but margins, repeat purchase, store payback, and preference terms remain mixed
        - Require a material discount to the $2.2B estimate; no public dollar range is defensible
        - Most consistent with the current mix of momentum and missing economics
      - - Bear
        - Revenue target miss, acquisition pressure, weak repeat purchase, poor retail payback, or adverse preferences
        - No public valuation floor is supportable; assume substantial markdown risk and impaired common-equity returns
        - Triggered by any material miss or negative cash conversion despite growth
    notes: >-
      Scenario ranges and probabilities are intentionally qualitative because the retained sources do not provide
      audited revenue, margin, cash-flow, net-debt, cap-table, preference, or transaction-price data.
    claimRefs:
      - CV004
      - CV005
      - CV009
      - CV013
      - CV014
      - CV015
