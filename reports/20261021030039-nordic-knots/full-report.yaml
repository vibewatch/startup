chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Nordic Knots was founded in Stockholm in 2016 by Liza Berglund Laserow, Fabian Berglund, and Felix
              Berglund. The company presents itself as a direct-to-consumer Scandinavian design house for the modern
              home. Its assortment now spans rugs, curtains, bedding, decor, fabrics by the yard, and custom or
              made-to-order products rather than a single rug category. Company materials locate the head office and a
              flagship store in central Stockholm and describe the United States as the largest market. The operating
              footprint is therefore international but still concentrated around a premium, design-led brand and a
              physical-goods supply chain: products are designed in Stockholm, rugs are hand-crafted in India, and
              fabrics are woven in Italian mills. The public record supports the positioning and geography, but not a
              complete legal-entity or location inventory.
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Leadership remains visibly founder-centered. Surface identifies Liza Berglund Laserow as co-founder and
              chief creative director and Fabian Berglund as co-founder and CEO; company recruiting pages continue to
              name Felix Berglund as the third founder but do not state his current operating title. This combination
              gives the company direct creative, brand, and commercial continuity, while also creating key-person
              exposure around the founders. The evidence pool does not identify a board, independent directors,
              executive succession plan, voting arrangements, or the current role held by Felix. The disclosed search
              for a vice president of operations reporting alongside the Stockholm COO also indicates that operational
              leadership and systems are still being built for the next phase of scale, rather than demonstrating that
              the platform is already mature.
            claimRefs:
              - CO001
              - CO002
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO010
      - number: '1.3'
        title: Financing and scale
        blocks:
          - type: paragraph
            body: >-
              WWD, syndicated by Yahoo Finance, reported a March 2026 minority investment with a financial amount close
              to $100 million, led by Imaginary Ventures and joined by Creades, Iris Ventures, and St. Dominique
              Capital. That figure is the reported size of the investment, not verified total funding raised, cash on
              the balance sheet, or primary proceeds available to the company. The same report attributes 85% sales
              growth in 2025 to Fabian Berglund and says the company was targeting more than $100 million in 2026
              revenue; a current operations job posting repeats the $100 million target. These are forward-looking or
              management-supplied indicators, not audited actual revenue. No retained source substantiates a valuation,
              capitalization table, financing preferences, debt, profitability, headcount, or customer count, so those
              quantities remain explicit diligence gaps.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO009
      - number: '1.4'
        title: Milestones and diligence readout
        blocks:
          - type: paragraph
            body: >-
              The observable milestone sequence shows a company widening both category and channel: a home collection
              arrived in 2025, a London showroom followed, and 2026 brought a reported minority financing, B Corp
              certification, a planned Los Angeles store, a Harvey Nichols department-store debut, and a new Grand Open
              rug collection. This is coherent with the stated ambition to become a broader Scandinavian design house,
              but much of the chronology comes from the company's own press archive and should not be treated as an
              independent performance record. The strongest adverse signal in the assigned evidence is operational
              rather than legal: the company says its production setup, ERP ecosystem, global supply chain,
              working-capital discipline, and management routines need to support materially greater scale. Investors
              should therefore separate brand momentum and planned expansion from verified store economics, realized
              revenue, governance rights, and execution capacity.
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
