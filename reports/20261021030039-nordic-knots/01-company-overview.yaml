  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: Current capitalization table, board roster, voting rights, investor consent rights, liquidation preferences, and founder vesting or succession terms.
      whyItMatters: The reported minority investment cannot be translated into control, dilution, or downside economics without the underlying ownership and security terms.
      diligencePath: Request the fully diluted cap table, charter, shareholder agreement, financing documents, board minutes, and founder employment and vesting agreements.
      relatedQuestionRefs: [QO009]
      relatedTableRefs: [TO003]
    - type: private-evidence-only
      severity: material
      topic: financial-scale
      missingEvidence: Audited 2025 and 2026 revenue, gross margin, EBITDA or EBIT, cash flow, cash balance, debt, valuation, headcount, and customer count.
      whyItMatters: Management-reported growth and a revenue target do not establish realized scale, profitability, liquidity, valuation, or operating leverage.
      diligencePath: Obtain audited financial statements, monthly management accounts, bank and debt schedules, payroll records, customer cohorts, and the March 2026 financing close package.
      relatedQuestionRefs: [QO010]
      relatedTableRefs: [TO001]
    - type: enumeration-incomplete
      severity: material
      topic: leadership
      missingEvidence: Complete executive-team and board roster, current role of Felix Berglund, reporting lines, succession coverage, and leadership-change history.
      whyItMatters: Founder concentration and an incomplete public leadership map prevent assessment of governance depth and key-person resilience.
      diligencePath: Request the organization chart, board materials, executive biographies, employment agreements, retention plan, and a three-year leadership-change log.
      relatedQuestionRefs: [QO009]
      relatedTableRefs: [TO002]
    - type: missing-source
      severity: material
      topic: adverse-history
      missingEvidence: Independent litigation, regulatory, recall, labor, outage, and adverse-event chronology matched to all operating jurisdictions.
      whyItMatters: The assigned pool contains no independent adverse record, so absence of a cited incident cannot be read as evidence that none occurred.
      diligencePath: Run jurisdiction-specific court, regulator, labor, recall, and sanctions checks and obtain management's claims and incident register.
      relatedQuestionRefs: [QO008]
