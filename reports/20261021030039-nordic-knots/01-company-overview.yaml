callouts:
  - calloutType: risk
    title: Scale claims are not audited outcomes
    body: >-
      The retained evidence supports an 85% management-reported sales-growth
      figure, a greater-than-$100 million 2026 revenue target, and a near-$100
      million investment amount. It does not support audited revenue, valuation,
      cash available, profitability, or ownership terms.
    claimRefs: [CO006, CO007, CO008]
  - calloutType: insight
    title: Operational build-out is a live diligence issue
    body: >-
      The vice-president-of-operations search explicitly frames production,
      supply-chain design, ERP, working capital, and management routines as
      capabilities that must be built for the next phase of scale.
    claimRefs: [CO010]
