  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与投资论点
        blocks:
          - type: paragraph
            body: >-
              当前结论是继续研究，而不是买入。投资论点是 Nordic Knots 确有品牌势头：WWD 报道 2025 年销售增长
              85%，当前店面也已覆盖地毯、窗帘、遮阳帘、床品、家居装饰和面料，不再是单一产品目录。反论点是价格与持久性。Caplight 的估值是估算值，不是披露的交易价格；一项针对 50 家失败 DTC
              品牌的行业推广研究，将付费获客依赖、忠诚度薄弱和渠道集中列为反复出现的失败模式。这些品类层面的发现不能证明 Nordic Knots
              也存在同样弱点，但使留存、获客效率和渠道组合证据成为决定建议的关键。没有这些证据，优秀的设计资质和增长并不足以证明可投资的风险调整后回报。
            claimRefs:
              - CV005
              - CV009
              - CV012
              - CV013
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV006
              - CV009
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV009
              - CV012
              - CV013
              - CV015
      - number: '8.2'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              WWD 报道 Imaginary Ventures 领投一笔接近 $100 million 的少数股权投资，Creades、Iris Ventures 和 St. Dominique Capital
              参与。Caplight 另将 2026 年 3 月轮次标为成长型股权投资，报告总融资 $100 million，并估算公司价值为 $2.2
              billion。这些数字不能视为独立佐证：它们可能描述同一笔融资，分母和方法均未披露，而已筹资金不等于可用现金。如果公司实现超过 $100 million 的 2026 年收入目标，估值对目标收入的比率将低于
              22x；这是混合来源的敏感性测算，不是经审计的收入倍数。因此，入场应以已验证的收入、毛利率、EBITDA、自由现金流、营运资金、净债务、所有权、清算优先权，以及原始发行与老股转让所得为条件。
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV005
              - CV009
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              公开证据足以定义情景触发条件，但不足以支持可辩护的美元估值区间或概率百分比。乐观情景要求公司在经审计利润率、复购和门店经济性支持下超过 2026
              年收入目标，并证明增长不是靠低效获客或营运资金扩张买来的。基准情景接受品牌继续增长，但在现金转换和优先权条款明确前，要求相对 $2.2 billion 估值有明显折价。悲观情景假设目标未达成、DTC
              获客压力或零售回本较弱，因此没有可靠的公开估值底线。情景权重、目标回报和持有期应保持未设定，而不能被换算成虚假的精确度。
            claimRefs:
              - CV004
              - CV005
              - CV009
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV009
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 退出准备度、论点破裂与最终尽调
        blocks:
          - type: paragraph
            body: >-
              业务存在定性的退出准备信号：LeadIQ 将美国描述为其最大业务重点；WWD 报道已有纽约门店和计划中的洛杉矶开店；官方新闻页面记录了 Harvey Nichols
              百货首发。这些信号扩大了战略可见度，但不能证明买方意愿、公开市场准备度或可实现的退出倍数。投资前应取得经审计的 FY2024-FY2026
              财务报表、群组留存、付费与自然获客经济性、渠道集中度、门店层面贡献和回本、库存库龄、资本结构表、全部优先权和老股条款，以及管理层退出计划。论点破裂触发条件包括 2026
              年目标明显未达成、增长同时出现负现金转换、复购较弱、门店持续表现不佳，或优先权条款损害普通股回报。
            claimRefs:
              - CV003
              - CV008
              - CV012
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 价格纪律才是决策关键
            body: 在没有基于尽调的入场区间、经审计的现金经济性和完整的优先权条款前，不要把强劲的品牌势头直接转化为买入建议。
            calloutType: recommendation
            claimRefs:
              - CV009
              - CV014
              - CV015
              - CV016
