chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营版图
        blocks:
          - type: paragraph
            body: >-
              Nordic Knots 由 Liza Berglund Laserow、Fabian Berglund 和 Felix Berglund 于 2016
              年在斯德哥尔摩创立。公司将自己定位为服务现代家居的斯堪的纳维亚直营设计品牌。如今产品已覆盖地毯、窗帘、床品、家居装饰、按码销售的面料，以及定制或按单生产的产品，不再只是单一地毯品类。公司材料显示，总部和旗舰店位于斯德哥尔摩市中心，并称美国是最大市场。因此，其运营版图虽已国际化，仍集中在一个高端、设计驱动的品牌和实体商品供应链上：产品在斯德哥尔摩设计，地毯在印度手工制作，面料在意大利织厂生产。公开记录支持其定位和地域信息，但不足以还原完整的法律实体或地点清单。
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              领导层仍明显由创始人主导。Surface 将 Liza Berglund Laserow 列为联合创始人兼首席创意总监，将 Fabian Berglund 列为联合创始人兼 CEO；公司招聘页面仍称 Felix
              Berglund 是第三位创始人，但没有说明其当前运营职务。这种组合让创始人直接掌握创意、品牌和商业连续性，同时也带来围绕创始人的关键人物风险。现有证据没有披露董事会、独立董事、高管继任计划、表决安排，或
              Felix 当前担任的职务。公司公开招聘与斯德哥尔摩 COO 并行汇报的运营副总裁，也说明运营领导和系统仍在为下一阶段规模化搭建，而不能证明平台已经成熟。
            claimRefs:
              - CO001
              - CO002
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO010
      - number: '1.3'
        title: 融资与规模
        blocks:
          - type: paragraph
            body: >-
              WWD 经 Yahoo Finance 联合转载报道称，2026 年 3 月公司获得一笔金额接近 $100 million 的少数股权投资，由 Imaginary Ventures 领投，Creades、Iris
              Ventures 和 St. Dominique Capital 参与。该数字是报告中的投资规模，不等于已验证的累计融资、资产负债表现金或公司可用的原始发行所得。同一报道将 2025 年 85% 的销售增长归因于
              Fabian Berglund，并称公司目标是 2026 年收入超过 $100 million；当前运营岗位招聘也重复了这一 $100 million
              目标。这些是前瞻性或管理层提供的指标，不是经审计的实际收入。没有保留来源能够证实估值、资本结构表、融资优先权、债务、盈利能力、员工人数或客户数，因此这些数量都属于明确的尽调缺口。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO009
      - number: '1.4'
        title: 里程碑与尽调判断
        blocks:
          - type: paragraph
            body: >-
              可观察到的里程碑显示，公司正在同时拓展品类和渠道：2025 年推出家居系列，随后开设伦敦展厅；2026 年出现据报道的少数股权融资、B Corp 认证、计划中的洛杉矶门店、Harvey Nichols
              百货首发，以及新的 Grand Open
              地毯系列。这与其扩展为更完整的斯堪的纳维亚设计品牌这一目标一致，但其中很多时间线来自公司自己的新闻档案，不能当作独立的业绩记录。指定证据中最强的不利信号不是法律问题，而是运营问题：公司称其生产体系、ERP
              生态、全球供应链、营运资金纪律和管理流程都需要支撑显著更大的规模。因此，投资者应把品牌势头和计划中的扩张，与已验证的门店经济性、实现收入、治理权利和执行能力分开看待。
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO008
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 规模口径不是经审计结果
            body: 保留的证据支持 85% 的管理层报告销售增长、超过 $100 million 的 2026 年收入目标，以及接近 $100 million 的投资金额，但不支持经审计的收入、估值、可用现金、盈利能力或所有权条款。
            calloutType: risk
            claimRefs:
              - CO006
              - CO007
              - CO008
          - type: callout
            title: 运营搭建仍是当前尽调问题
            body: 运营副总裁招聘明确将生产、供应链设计、ERP、营运资金和管理流程列为下一阶段规模化必须搭建的能力。
            calloutType: insight
            claimRefs:
              - CO010
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：高端纺织品，而非全部家居用品
        blocks:
          - type: paragraph
            body: >-
              Nordic Knots
              可守住的市场边界是高端、设计驱动的家居纺织品，以地毯为核心，并延伸到窗帘、遮阳帘、床品、家居装饰和面料。当前产品还包括定制尺寸地毯、满铺地毯和咨询驱动的窗饰，这让品牌更接近项目型支出，但并不意味着家具、安装或完整室内设计预算属于当前核心市场。当前展示的起售价显示，抽样地毯、窗饰和卧室产品明显高于大众市场基础款；Business
              of Home 报道称，创始人有意瞄准便宜地毯与极昂贵定制替代品之间的空间。因此，相关支出池应是高端地毯、纺织品及相关设计服务；把宽泛的家具、建筑和无差别家居用品市场估算纳入，会高估可触达市场。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
      - number: '2.2'
        title: 用可观察的公司与渠道代理变量测算规模
        blocks:
          - type: paragraph
            body: >-
              没有保留来源提供可比、独立的品类估算，能够单独拆出 Nordic Knots 实际可争取的高端地毯和家居纺织品支出。因此，当前最好的规模锚点是公司和渠道代理变量，而不是自上而下的 TAM。WWD 报道公司
              2026 年收入目标超过 $100 million；Business of Home 报道设计师约占客户群的 30%。WWD
              还指出美国按销售额计是最大市场。这些数字说明公司已经具备一定商业规模，并触达两类重要需求池，但没有披露市场份额、按品类拆分的收入、客户支出、复购率或各地区渗透率。一家公开竞争对手称更广泛的家居用品市场在 2026
              年第一季度仅个位数低位下滑，这也提醒我们不能把 Nordic Knots 的增长直接换算成品类增长率。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM008
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM010
              - CM011
              - CM016
      - number: '2.3'
        title: 买方、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              已有证据显示买方体系有两个中心。注重设计的消费者直接在线上或通过旗舰店购买；室内设计师和贸易客户则影响客户决策，或替客户下项目订单。Business of Home 估计设计师约占客户的
              30%。美国是最大销售地域；2026 年 3 月的报道称纽约已有门店、洛杉矶计划开设直营门店，Business of Home
              还报道了伦敦和斯德哥尔摩的地点。因此，实体展厅既像是转化基础设施，也是高客单价、需要触摸体验的产品建立信任的机制。公司招聘电商、美国销售、展厅和运营岗位，说明公司同时投入数字化发现和线下辅助销售，但岗位招聘展示的是计划建设的能力，而不是已经实现的需求或门店经济性。
            claimRefs:
              - CM006
              - CM007
              - CM012
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM010
              - CM011
              - CM012
              - CM016
      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              品类扩张是最清晰的增长驱动：独立媒体 Surface 在 2025 年记录了公司从地毯扩展到床品、盖毯和床头板；Business of Home
              则把窗帘、床品和按码面料描述为走向更广泛生活方式定位的步骤。设计师参与和旗舰店扩张可以提高订单频率，并支持辅助销售。反向约束同样明显。Williams-Sonoma
              描述了疲软的大盘市场、持续的住房不确定性、关税、燃料成本和利率波动；这些是竞争对手披露，不是独立市场基准，但确实指出了可能的需求和利润率约束。Nordic Knots
              还称地毯由印度工匠生产、面料由意大利织厂生产，使执行集中在跨境采购上。在缺乏品类级毛利率、群组留存、供应商产能、门店回本周期和外部市场规模数据的情况下，估值可以认可已展示的公司增长，但不应采信精确的市场份额或
              TAM 叙事。
            claimRefs:
              - CM010
              - CM011
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 最强的规模证据来自自下而上观察
            body: 公司收入目标、美国市场集中度和设计师参与度证明需求具有一定规模，但没有一致的品类和地域分母，不能据此除出一个宽泛市场估算来推断份额。
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM008
          - type: callout
            title: 宏观韧性尚未得到验证
            body: 公司的收入目标与竞争对手报告的家居用品市场疲软，以及对关税、燃料成本、利率和国际采购的暴露同时存在；在拿到群组和利润率数据前，不能把扩张视为能够抵御周期。
            calloutType: risk
            claimRefs:
              - CM008
              - CM013
              - CM014
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与替代方案
        blocks:
          - type: paragraph
            body: >-
              竞争集合比高端斯堪的纳维亚地毯品牌更广。直接替代品包括设计驱动的地毯品牌，以及 Ruggable；后者用可机洗的双层系统，通过便利性而非工匠定位解决同一地面覆盖需求。Loloi
              是较成熟的现有品牌，拥有中高端地毯、相邻家居品类、联名合作和广泛客户分销。RH、West Elm
              等传统零售商、本地展厅和其他斯堪的纳维亚设计品牌，也在保留证据中被列为替代品。维持现有地毯、通过室内设计师购买，或从多家专业供应商拼装房间，也属于现状行为。这些路线在经济上相关，但缺乏可比的公开规模和定价数据，因此格局表将其未经支持的属性标为未知，而不是给出虚假的精确度。
            claimRefs:
              - CP001
              - CP012
              - CP014
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.2'
        title: 产品与价格定位
        blocks:
          - type: paragraph
            body: >-
              Nordic Knots 定位为高端全屋纺织品品牌，而不只是地毯商。其当前官方页面覆盖地毯、窗帘、罗马帘、床品、家居装饰、面料、定制尺寸、满铺地毯、咨询服务和贸易账户。抽样的美国地毯起售价从 $395 到
              $1,995；抽样的欧盟页面从 €295 到 €1,895。这些是挂牌价格快照，不是实现的平均售价。Ruggable 以可洗罩面、可重复使用的垫层和 $89
              起售价，提供了不同的价值主张。对有儿童、宠物、行动需求或经常清洁需求的家庭而言，便利性和入门价格构成可信的替代路径。指定证据没有公开完全可比的尺寸、折扣、退货和到手成本。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP012
              - CP013
