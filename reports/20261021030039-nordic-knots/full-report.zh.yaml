    approximationNotes: 日期依据出版日期或公司所述里程碑日期；洛杉矶项目在报道日期仍是计划，不代表已经开业。
    claimRefs:
      - CO001
      - CO008
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
  - id: FM001
    title: 受证据约束的可触达市场层级
    type: pyramid
    summary: 层级图将广泛相邻市场与 Nordic Knots 已有证据支持的产品、买方和地域立足点区分开来；它不是按价值比例绘制的 TAM 图。
    data:
      items:
        - label: 高端家居用品
          value: Broad adjacency
          detail: 仅可作为宏观背景；保留的证据无法单独识别 Nordic Knots 在这一广阔领域中的份额。
        - label: 高端家纺
          value: Defensible category
          detail: 地毯、窗帘、遮阳帘、床品、家饰和面料构成已有证据支持的品类边界。
        - label: 高端地毯与定制地面纺织品
          value: Core market
          detail: 创始品类涵盖标准、设计师款、定制和满铺产品。
        - label: 直接消费者需求
          value: Primary route
          detail: 线上渠道和旗舰店直接触达注重设计的消费者。
        - label: 设计师与专业渠道需求
          value: ~30% of customers
          detail: Business of Home 报道，设计师约占客户群的 30%。
        - label: 已展现的公司规模代理指标
          value: '> $100m 2026 target'
          detail: 管理层收入目标反映意图中的规模，不是市场规模估算。
    approximationNotes: 仅为概念层级。层宽和顺序不代表市场价值；两个数字标签保留原始的公司层面分母。
    claimRefs:
      - CM006
      - CM007
      - CM008
      - CM010
      - CM011
      - CM016
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 分析师的序数定位将奢华设计定位与功能便利性、分销广度区分开来；分数是方向性证据综合，不是市场测量值。
    data:
      xAxis:
        label: 功能便利性与分销广度（序数）
        min: 1
        max: 5
      yAxis:
        label: 奢华设计定位（序数）
        min: 1
        max: 5
      points:
        - label: Nordic Knots
          x: 4
          'y': 5
          detail: 丰富的纺织品类、咨询服务、专业渠道和不断扩大的门店网络扩大了触达，同时保留高端设计定位。
        - label: Ruggable
          x: 5
          'y': 2
          detail: 可水洗的双层实用设计与更低起售价突出功能便利性。
        - label: Loloi
          x: 4
          'y': 3
          detail: 成熟的地毯品类、相邻品类、合作系列和广泛客户分布共同支撑覆盖广度。
        - label: 传统多品类零售商
          x: 4
          'y': 3
          detail: 成熟门店和整屋搭配购物是方向性原型优势；没有直接对应的基准。
        - label: 本地展厅或设计师渠道
          x: 3
          'y': 4
          detail: 触感式选品和多品牌采购可以承接高端项目，但经济性较为分散。
        - label: 内部多供应商体系
          x: 2
          'y': 3
          detail: 灵活的多重采购抵消了较高的搜索与协调成本；尚无标准化方案。
    approximationNotes: 1-5 序数分数由引用的产品、价格、渠道和定位证据综合得出。它们没有按收入加权、没有经过客户调查，也没有经过统计基准检验；原型位置的信心低于具名品牌位置。
    claimRefs:
      - CP016
  - id: FI001
    title: 未验证经济性的收入模型桥接
    type: flow
    summary: 公开门店展示了需求如何转化为交易收入，但从成交价到毛利的每一步都未披露。
    data:
      nodes:
        - id: discovery
          label: 品牌与产品发现
          detail: 编辑内容曝光、合作系列、电商和实体零售吸引需求。
        - id: selection
          label: 品类与配置
          detail: 客户选择标准或定制地毯、窗帘、床品、家饰或面料。
        - id: order
          label: 标价订单
          detail: 直接交易下单；折扣和专业渠道条款未披露。
        - id: fulfillment
          label: 生产与履约
          detail: 工匠和纺织厂生产、库存、配送和退货带来变动成本。
        - id: net-revenue
          label: 净收入
          detail: 扣除折扣、退货、税费和渠道影响后的实际价格不可得。
        - id: gross-profit
          label: 毛利
          detail: 产品、货运、履约和渠道成本不可得，因此没有公开依据可以建立桥接。
    approximationNotes: 这是机制图，不是定量漏斗或瀑布图；不作转化率、收入组合或利润率假设。
    claimRefs:
      - CI002
      - CI014
  - id: FE001
    title: Nordic Knots 产品交付链
    type: stack
    summary: 客户选品如何变成已交付的纺织品和支持关系的来源约束视图。
    data:
      layers:
        - label: 客户选品
          detail: 系列、房间品类、样品、图片、门店和专业账户入口
          items:
            - 按风格、颜色、尺寸或房间浏览
            - 索取样品
            - 到店或咨询
        - label: 配置
          detail: 标准产品，以及定制尺寸地毯、窗帘、遮阳帘、面料和五金
          items:
            - 选择尺寸和材料
            - 指定定制处理
            - 确认项目要求
        - label: 斯德哥尔摩设计
          detail: 内部工作室和精选外部合作方确定形态、色盘、比例和系列
          items:
            - 系列概念
            - 材料规格
            - 设计审批
        - label: 材料与生产网络
          detail: 新西兰羊毛和天然黄麻供应印度地毯生产；意大利纺织厂织造面料
          items:
            - 采购纤维
            - 在印度手工制作地毯
            - 在意大利织造面料
        - label: 商务与履约
          detail: 电商和门店协调库存、付款、发货和退货
          items:
            - 分配库存
            - 交付订单
            - 处理退货或问题
        - label: 支持与管控
          detail: 电话、电子邮件、聊天、供应商准则、GoodWeave、SMETA 评估和 B Corp 框架
          items:
            - 客户支持
            - 供应商监督
            - 合规与整改
    approximationNotes: 该顺序反映公开可见的工作流界面，不是已披露的系统图；软件、物流供应商、工厂和管控归属尚未公开绘制。
    claimRefs:
      - CE002
      - CE003
      - CE015
      - CE016
  - id: FU001
    title: 客户旅程与可观察扩张面
    type: journey-map
    summary: 公开触点支持从设计发现到直营或合作伙伴购买，再到跨品类扩张的路径，但购买后的留存尚未量化。
    data:
      items:
        - label: 设计发现
          detail: 设计媒体报道、合作系列和造型陈列让消费者认识品牌。
          touchpoints:
            - 设计媒体
            - 合作者系列
            - 社交媒体与展厅图片
        - label: 产品探索
          detail: 购物者浏览地毯、窗帘、遮阳帘、床品、家饰和面料。
          touchpoints:
            - 直营门店
            - Moda Operandi
            - 实体门店
        - label: 规格支持
          detail: 样品、咨询、定制尺寸和 Pro Account 权益支持需要考虑的购买决策。
          touchpoints:
            - 设计咨询
            - 样品
            - 专业账户
        - label: 购买
          detail: 订单可以通过直营渠道或精选零售合作伙伴完成。
          touchpoints:
            - Nordic Knots 在线渠道
            - Moda Operandi
            - Harvey Nichols
        - label: 配送与安装
          detail: 公司宣传标准配送，并提供实体空间供客户体验产品。
          touchpoints:
            - 送货上门
            - 到店
            - 酒店及餐饮空间陈列
        - label: 品类扩张
          detail: 地毯可以带动窗帘、床品、家饰和面料，但复购行为未披露。
          touchpoints:
            - 全屋纺织品
            - 专业项目
            - 未验证的复购
    approximationNotes: 阶段顺序综合了观察到的面向客户的触点；它不衡量转化率，也不证明所有阶段来自同一漏斗人群。
    claimRefs:
      - CU001
      - CU007
      - CU008
      - CU011
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 定性排序将影响与缓释成熟度分开；公开分母未知，使若干可能性判断仍属暂定。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
      rows:
        - label: 供应链劳工与分包商
          values:
            - 中
            - 高
            - 发展中
        - label: 供应商与材料集中度
          values:
            - 中
            - 高
            - 披露较少
        - label: 品类质量与库存
          values:
            - 中
            - 高
            - 发展中
        - label: 零售与渠道扩张
          values:
            - 中
            - 高
            - 初期
        - label: 财务与营运资金韧性
          values:
            - Unknown
            - 高
            - 披露较少
        - label: 法律、隐私与事故风险
          values:
            - Unknown
            - 中高
            - 披露较少
    approximationNotes: 这是基于保留披露和明确证据缺口作出的定性分析师判断，不是测量得出的概率模型。
    claimRefs:
      - CR004
      - CR009
      - CR011
      - CR013
      - CR016
  - id: FV001
    title: 从经营证据到入场决策的建议逻辑
    type: flow
    summary: 证据链最终指向继续研究，因为增长和产品证据尚未填补估值、现金流或优先权条款缺口。
    data:
      nodes:
        - id: reported-growth
          label: 报道中的增长
          value: 85% sales growth in 2025
          detail: WWD 的归因报道，不是经审计的财务披露
        - id: revenue-target
          label: 规模目标
          value: More than $100M 2026 revenue
          detail: WWD 报道的公司目标
        - id: valuation-anchor
          label: 估值锚点
          value: $2.2B estimate
          detail: 基于融资轮数据的 Caplight 估算
        - id: ratio-sensitivity
          label: 混合来源敏感性
          value: Below 22x target revenue
          detail: 估算值除以陈述的最低目标值；不是经审计的倍数
        - id: diligence-gap
          label: 缺失的投资判断证据
          value: Margins, cash flow, retention, cap table
          detail: 已审阅的公开来源没有披露所需输入
        - id: decision
          label: 决策
          value: Research-more
          detail: 低信心、高风险、估值偏高
    approximationNotes: 低于 22 倍的比率将 Caplight 的 $2.2B 估算与公司超过 $100M 的目标结合起来；这是方向性上限，不是交易倍数，也不是经审计的历史收入倍数。
    claimRefs:
      - CV004
      - CV005
      - CV009
      - CV013
      - CV014
      - CV015
      - CV016
