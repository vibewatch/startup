      - number: '3.3'
        title: 分销、信任与转换动态
        blocks:
          - type: paragraph
            body: >-
              分销正在成为 Nordic Knots 竞争策略的一部分。WWD 报道美国按销售额计是最大市场，洛杉矶门店计划于 2026 年 6 月开设，纽约门店已经运营；公司新闻页面还描述了 2026 年在 Harvey
              Nichols 百货首发。品牌将实体扩张与贸易项目和设计咨询结合。关于信任，Nordic Knots 称其于 2026 年依据 Standards V1.6 获得 B Corporation 认证，与
              GoodWeave 合作，要求供应商遵守行为准则，并定期进行 SMETA
              评估。这些信号可以降低买方不确定性，但证据没有量化它们是否推动转化或留存。由于地毯、窗帘和床品可以分别采购，家庭或设计师层面的多品牌购买仍然容易；没有发现合同型锁定。
            claimRefs:
              - CP005
              - CP010
              - CP011
      - number: '3.4'
        title: 差异化持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Nordic Knots 的品牌势头不弱：EU-Startups 报道一笔约 €86 million 的投资、€1.9 billion 估值和投资者提供的 €61 million 追踪收入；WWD 报道 2025
              年销售增长 85%，公司目标是 2026 年收入超过 $100
              million。这些数字说明公司有资源开设门店、开发产品和建设品牌，但不能证明持久的市场份额或更优的单位经济性。最有力的差异化来自斯德哥尔摩主导的设计、天然材料定位、工匠和织厂关系、联名合作，以及不断扩大的家居纺织品组合。替代风险有两个方向：功能型专业品牌可以在可洗性和价格上胜出，成熟现有品牌则可以凭借品类广度、批发关系和联名触达来竞争。因此，定位图是分析师的序数判断，不是经过测量的市场基准。
