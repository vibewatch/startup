            body: >
              现有证据支持对需求和报告称的经营盈利能力持正面看法，但对财务持久性的判断只能暂定。产品广度和高端挂牌价带来合理的毛利空间，2025 年收入和 EBIT
              报告也说明增长并非显然靠会计亏损买来。然而，没有证据证明毛利率、实现价格、复购、退货率、CAC、渠道费用、营运资金需求或现金转换。对 50 家失败 DTC 品牌的 5W
              不利研究将该群体与付费获客依赖和忠诚度基础薄弱联系起来；这不是 Nordic Knots 的特定证据，却准确指出了本案必须验证的指标。投资判断应以经审计的 FY2025-FY2026
              报表、月度渠道和群组数据、资金用途与流动性桥接，以及门店层面的经济性为前提。在这些材料到位前，利润率路径看起来有希望，但收入质量未验证，扩大后的零售版图也带来了尚未量化的资本密集度风险。
