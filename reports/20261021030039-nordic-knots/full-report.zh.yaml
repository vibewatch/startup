            body: >-
              品类与渠道扩张会相互放大。当前店面覆盖地毯、窗帘、床品、家居装饰和面料；Vogue 报道推出 65 件家居产品，并计划按季更新。WWD
              报道美国按销售额计是最大市场，并描述了在现有纽约门店之外直接运营的洛杉矶门店；Nordic Knots 自己的新闻页面随后描述了 Harvey Nichols
              百货首发。这让公司依赖材料可得性、跨境物流、批发执行和门店生产率。公开证据没有量化地域集中度、渠道组合、退货、库存库龄或门店回本周期，因此投资含义应是把快速扩张视为尚未验证的经营杠杆假设，而不是假定收入增长会转化为现金。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR003
              - CR007
              - CR010
              - CR011
              - CR016
      - number: '7.4'
        title: 监控、止损标准与尽调路径
        blocks:
          - type: paragraph
            body: >-
              如果证据显示重大劳工或分包商控制失败且未及时整改；如果经审计的增长明显落后于报告称的 2026
              年目标，同时库存或营运资金占用上升；如果新门店无法达到管理层批准的回本门槛；或者如果产品组合扩张后质量问题、退货、召回或交付表现恶化，投资论点就应被打破。月度监控应包括审计例外及关闭时间、供应商和国家集中度、全量准时交付、缺陷率和退货率、库存库龄、按品类和渠道拆分的贡献利润率，以及门店群组回本周期。由于没有保留来源能够证明不存在诉讼、隐私事故、产品安全事件或召回，法律顾问和管理层陈述必须与登记记录和第三方记录核对，不能从沉默中解读。
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR007
              - CR008
              - CR009
              - CR011
              - CR012
              - CR013
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 首要止损标准
            body: 重大劳工控制失败、反复出现且未整改的审计例外，或证据显示品类和门店快速扩张在缺乏可接受群组经济性的情况下持续消耗现金，都会推翻当前的增长质量论点。
            calloutType: risk
            claimRefs:
