  - id: TV002
    title: 正题与反题
    columns:
      - 立场
      - 论点
      - 证据
      - 哪些事实会改变判断
    rows:
      - - 正题
        - 报道中的快速增长
        - WWD 报道 2025 年销售额增长 85%
        - 经审计的收入和现金转化数据会强化这一论点
      - - 正题
        - 更广泛的高端家居平台
        - 当前网站覆盖地毯、窗帘、遮阳帘、床品、家饰和面料
        - 品类收入与复购数据将显示这种广度是否带来产出
      - - 反题
        - 价格可能跑在证据前面
        - Caplight 估算为 $2.2B，但公开信息中没有经审计的经济数据或披露的定价老股交易
        - 更低的入场价格或经审计的盈利规模可以化解这一担忧
      - - 反题
        - DTC 持久性尚未验证
        - 一项关于 50 个失败 DTC 品牌的 5W 研究提到获客、忠诚度、创始人交接和渠道风险
        - Nordic Knots 特有的 CAC、留存、渠道组合和治理证据可能反驳这一类别风险
    notes: 5W 的 DTC 样本是传播公司发布的方向性不利类别信号，不是独立基准，也不能证明 Nordic Knots 具备每一种失败模式。
