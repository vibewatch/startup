  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入架构与定价
        blocks:
          - type: paragraph
            body: >
              Nordic Knots
              是交易型高端家居纺织品业务，而不是经常性收入公司。当前直营店覆盖地毯、窗帘和罗马帘、床品、家居装饰、按码面料、定制尺寸地毯、满铺地毯和贸易账户。这种广度提供了多种凑单和交叉销售路径；2026 年 7 月在
              Harvey Nichols 的百货首发，又在电商和自营店之外增加了间接分销路线。公开挂牌价处于高端但跨度较大：当前产品页面包括约 $90 的枕套套装、约 $195 起的窗帘，以及约 $395 起、至少达到
              $1,995 的地毯；WWD 另称 2026 年 3 月更宽的地毯价格区间为 $495 至 $5,000，中位区间为 $800 至
              $2,000。这些是挂牌价，不是实现的平均订单价值、净收入或贡献利润。折扣、退货、定制订单定金、贸易价格和渠道收入分成均未披露，因此无法可靠地还原收入质量。
