      - number: '4.3'
        title: 资本充足性与成本结构
        blocks:
          - type: paragraph
            body: >
              Imaginary Ventures 领投的接近 $100 million 少数股权投资显著扩大了融资能力，但已筹资金不等于可用现金。WWD
              称新投资方将支持全球扩张、产品开发和品牌定位；但没有披露原始发行与老股转让所得、交割成本、当前现金、烧钱、债务或受限用途。成本暴露目前只能定性观察。地毯在印度手工制作，面料在意大利织厂生产；美国标准配送承诺三个至六个工作日；公司还在增加产品品类和实体分销。这些选择会带来库存、运费、退货、供应商、租赁、人员和装修要求。美国是最大销售市场，已报告的纽约门店和计划中的洛杉矶门店，使门店层面的贡献利润率、库存周转和回本周期成为核心问题。在没有这些明细前，融资或许能支持加速，但不能证明现金跑道或资本充足。
            claimRefs:
