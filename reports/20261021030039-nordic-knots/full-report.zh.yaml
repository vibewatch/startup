  - id: TV003
    title: 乐观、基准与悲观情景框架
    columns:
      - 情景
      - 经营假设
      - 估值与回报逻辑
      - 概率信号
    rows:
      - - 乐观
        - 实现超过 $100M 的 2026 年收入目标；经审计的利润率和现金转化能力强；留存与门店验证增长效率
        - 只有在通过尽调建立估值区间和目标回报后，$2.2B 估算才可能纳入投资判断
        - 只有在经审计的目标达成和单位经济模型持久后才为正面
      - - 基准
        - 增长延续，但利润率、复购、门店回本和优先权条款仍然混杂
        - 要求相对 $2.2B 估算有大幅折价；公开信息无法支持一个有依据的美元区间
        - 与当前增长势头和经济数据缺失并存的组合最一致
      - - 悲观
        - 收入目标未达成、获客压力、复购疲弱、零售回本差或不利优先权
        - 公开信息无法支持估值下限；假设存在显著下调风险和普通股回报受损
        - 任何重大未达标或增长伴随现金转化为负都会触发
    notes: 情景区间和概率刻意保持定性，因为保留的来源没有提供经审计的收入、利润率、现金流、净债务、股权结构、优先权或交易价格数据。
