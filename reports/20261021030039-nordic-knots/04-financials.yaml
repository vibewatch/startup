company:
  name: "Nordic Knots"
chapter:
  number: 4
  title: "Financials"
  summary: "Nordic Knots combines premium transactional pricing with reported 2025 revenue of EUR 61 million, 85% growth, and a 20% EBIT margin, but those figures are not backed here by audited accounts. The March 2026 capital raise can finance product and store expansion, yet cash, burn, runway, gross margin, working capital, customer acquisition, repeat purchase, and store payback remain material underwriting gaps."
sections:
  - id: "revenue-architecture"
    title: "Revenue architecture and pricing"
    body: |
      Nordic Knots is a transactional premium home-textiles business rather than a recurring-revenue company. Its current direct storefront spans rugs, curtains and Roman shades, bedding, decor, fabric by the yard, custom-sized rugs, wall-to-wall carpet, and a trade account. That breadth creates multiple basket-building and cross-sell paths, while the July 2026 department-store debut at Harvey Nichols adds an indirect distribution route alongside ecommerce and owned stores. Public list prices are premium but broad: current product pages include roughly $90 pillowcase sets, curtains starting around $195, and rugs starting near $395 and reaching at least $1,995; WWD separately reported a broader rug range of $495 to $5,000 and a median range of $800 to $2,000 in March 2026. These are list prices, not realized average order values, net revenue, or contribution margins. Discounts, returns, custom-order deposits, trade pricing, and channel revenue shares are not disclosed, preventing a reliable revenue-quality bridge.
    claimRefs: ["CI001", "CI002", "CI003", "CI004", "CI012"]
    tableRefs: ["TI001", "TI002"]
    figureRefs: ["FI001"]
  - id: "traction-and-profitability"
    title: "Reported traction and profitability"
    body: |
      The strongest public operating datapoint is Nordic Tech's report of EUR 61 million of 2025 revenue, 85% year-over-year growth, and a 20% EBIT margin. WWD independently repeats the 85% sales-growth statement as founder-reported and says the company targeted more than $100 million of revenue for 2026. The combination suggests meaningful operating leverage for a premium consumer brand, but the evidence is still journalistic and management-sourced rather than audited. No income statement, revenue-recognition policy, gross-margin bridge, EBITDA-to-EBIT reconciliation, tax profile, cash-flow statement, or balance sheet appears in the assigned evidence. Investors should therefore treat the reported EBIT margin as a promising screening indicator, not a substitute for quality-of-earnings work. The more-than-$100 million target is guidance, not achieved revenue, ARR, contracted backlog, or cash collection.
    claimRefs: ["CI005", "CI006", "CI007", "CI008"]
    tableRefs: ["TI003"]
  - id: "capital-and-cost-structure"
    title: "Capital adequacy and cost structure"
    body: |
      The close-to-$100 million minority investment led by Imaginary Ventures materially expands financing capacity, but funding raised is not equivalent to cash available. WWD says the new partners will support global expansion, product development, and brand positioning; it does not disclose primary versus secondary proceeds, closing costs, current cash, burn, debt, or restricted uses. Cost exposure is visible qualitatively. Rugs are handcrafted in India, fabrics are woven in Italian mills, free U.S. standard delivery is promised in three to six business days, and the company is adding product categories and physical distribution. Those choices introduce inventory, freight, returns, supplier, lease, staffing, and fit-out requirements. The U.S. being the largest sales market and the reported New York and planned Los Angeles stores make store-level contribution margin, inventory turns, and payback central. Without those schedules, the financing may fund acceleration, but it cannot establish runway or capital sufficiency.
    claimRefs: ["CI009", "CI010", "CI011", "CI013", "CI014", "CI016"]
  - id: "financial-verdict"
    title: "Financial verdict and underwriting blockers"
    body: |
      The available evidence supports a positive view of demand and reported operating profitability, but only a provisional view of financial durability. Product breadth and premium list pricing provide plausible gross-profit headroom, while the 2025 revenue and EBIT reports indicate that growth was not obviously purchased through accounting losses. However, there is no evidence for gross margin, realized pricing, repeat purchase, return rates, CAC, channel fees, working-capital needs, or cash conversion. An adverse 5W study of 50 failed DTC brands links the cohort to paid-acquisition dependence and weak loyalty infrastructure; it is not Nordic Knots-specific proof, but it identifies precisely the metrics that must be tested here. Underwriting should remain conditional on audited FY2025-FY2026 statements, monthly channel and cohort data, a proceeds and liquidity bridge, and store-level economics. Until those arrive, the margin path looks promising, revenue quality is unverified, and the enlarged retail footprint raises an unquantified capital-intensity risk.
    claimRefs: ["CI005", "CI006", "CI015", "CI016"]
