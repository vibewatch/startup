callouts:
  - calloutType: "risk"
    title: "Funding is not runway"
    body: "More than €3 billion of reported financing for the gigafactory and innovation center does not reveal current unrestricted cash, remaining draw availability, covenant headroom, or operating runway. Treating the headline total as liquidity would overstate capital adequacy."
    claimRefs:
