company:
  name: "Verkor"
chapter:
  number: 4
  title: "Financials"
  summary: "Verkor has financed the first Dunkirk gigafactory with a large blend of equity, subsidies, and project debt and now reports on-site battery deliveries, but the retained public evidence still omits revenue, realized pricing, gross margin, cash, burn, and covenant headroom. The financing base supports industrialization; it does not establish profitable production or adequate runway."
sections:
  - id: "commercial-model-and-traction"
    title: "Commercial Model and Traction"
    body: "Verkor's visible commercial model is contracted battery-cell supply rather than a published price list. Renault anchors demand through a reported 12 GWh annual offtake, while an EnerSys agreement adds a separate industrial battery format; neither disclosure provides realized price, indexation, acceptance, or revenue-recognition terms. The operating evidence has advanced beyond plans: Verkor reported more than 30,000 cells produced and delivered in 2024, and its August 2026 news index described delivery of the first batteries produced entirely at Dunkirk alongside commissioning of a second production line. Those milestones support physical execution, but they are not revenue or utilization measures. Public sources also describe a 16 GWh initial design capacity, which should not be treated as output, sales, or absorbed fixed cost. The revenue bridge therefore remains contract-to-production evidence with the decisive price, recognized volume, warranty, and gross-profit steps unavailable."
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI016"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "capital-stack-and-adequacy"
    title: "Capital Stack and Adequacy"
    body: "The capital stack is substantial but highly project-specific. In 2023, stakeholders reported a minimum €850 million Series C, roughly €650 million of French subsidies, and €600 million of EIB debt support. A later financing closed more than €1.3 billion of green financing with 16 commercial and three public banks, including €961 million of senior commercial-bank loans, €282 million of which Mercom reported as government-guaranteed, plus bridge and subordinated lending. Verkor and Mercom describe more than €3 billion as secured for the Dunkirk gigafactory and Grenoble innovation center. That is funding raised or committed for defined assets, not evidence of unrestricted cash available at the run date. The retained record gives no current cash balance, draw schedule, covenant tests, debt-service profile, working-capital facility, burn, or remaining construction requirement. Capital adequacy therefore cannot be underwritten from headline financing totals."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI016"
    tableRefs:
      - "TI003"
  - id: "margin-path-and-verdict"
    title: "Margin Path and Financial Verdict"
    body: "The principal margin risks are industrial rather than software-like. Verkor identifies raw-material and equipment dependence, skills availability, and regulation-driven capital and production costs as material constraints. Its 2024 sustainability report also states that, because the gigafactory was not yet operational in that reporting period, business-wide performance indicators relied on theoretical assumptions; this limits their use for a steady-state margin model. The same report records that Northvolt's Chapter 11 filing made investors more cautious, a relevant warning that financing and contracted demand do not by themselves prove stable yields or solvent ramp economics. The financial verdict is therefore mixed: contracted demand, physical commissioning, and committed project funding are strengths, while revenue quality, customer concentration, yield, scrap, gross margin, cash conversion, debt headroom, and runway remain unresolved. Investment underwriting requires management accounts, customer contracts, production dashboards, and financing agreements rather than extrapolation from capacity or funding announcements."
    claimRefs:
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
