callouts:
  - calloutType: "risk"
    title: "Northvolt is a warning, not a forecast"
    body: "Northvolt's late-2024 Chapter 11 filing increased investor caution around European battery platforms. It demonstrates sector execution and financing risk but does not prove that Verkor will follow the same path; Verkor-specific yield and cost evidence is still required."
    claimRefs:
      - "CP010"
  - calloutType: "insight"
    title: "Renault anchors volume and bargaining power"
    body: "Renault's long-term agreement improves demand visibility for initial production, but public sources do not disclose price, indexation, minimum-take protections, or remedies. The same anchor can therefore be both a commercialization advantage and a concentration risk."
    claimRefs:
      - "CP004"
      - "CP005"
      - "CP016"
