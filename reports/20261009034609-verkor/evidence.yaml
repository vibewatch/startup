evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: A complete post-September-2026 executive, Supervisory Board and committee roster with delegated authorities.
    whyItMatters: The leadership transition changes accountability during the highest-risk industrial ramp period.
    diligencePath: >-
      Request the current organization chart, board register, committee charters, succession plan and reserved-matters
      schedule.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Current cap table, preference stack, option pool, shareholder rights and fully diluted ownership.
    whyItMatters: Public investor names and financing totals do not establish control, dilution or common-equity value.
    diligencePath: Obtain the fully diluted cap table, shareholder agreement, articles and all preferred-equity term sheets.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue, gross margin, cash balance, burn, working-capital needs and runway.
    whyItMatters: Secured project capital cannot be converted into operating liquidity or enterprise value without these figures.
    diligencePath: Review monthly management accounts, audited statements, cash forecast, debt draw schedule and covenant model.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: gigafactory-ramp
    missingEvidence: Independently verified qualified yield, scrap, utilization, customer acceptance and unit-production economics.
    whyItMatters: Commissioning and first deliveries do not establish repeatable commercial-scale output or margin.
    diligencePath: Inspect line-level MES data, qualification packs, customer acceptance records and monthly cost/yield bridges.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: customer-diversification
    missingEvidence: Verification and contracted offtake volumes for commercial automotive customers beyond Renault Group.
    whyItMatters: >-
      Verkor's 16 GWh initial capacity is predominantly absorbed by Renault (12 GWh); secondary OEM offtake commitments
      govern long-term utilization and pricing resilience.
    diligencePath: >-
      Review commercial press releases, bilateral supplier contracts, and French automotive industry filings for
      announced series offtake partnerships.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing-and-unit-economics
    missingEvidence: >-
      Comparable per-kWh realized prices, raw-material indexation, discounts, take-or-pay protections, qualification
      yield, scrap, utilization, and unit cost.
    whyItMatters: >-
      Without these terms, Verkor's price competitiveness, contract quality, switching cost, and margin durability
      cannot be compared with incumbent suppliers.
    diligencePath: >-
      Request executed customer contracts, pricing waterfalls, raw-material pass-through clauses, audited yield and
      scrap cohorts, and a normalized competitor quote set.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP002
      - TP003
  - type: missing-source
    severity: material
    topic: customer-diversification
    missingEvidence: >-
      Identity, program, start-of-production timing, and committed annual volume for the additional customer reported in
      2024.
    whyItMatters: >-
      The evidence cannot show whether Renault concentration has materially declined or whether a second serial
      automotive program is qualified.
    diligencePath: >-
      Obtain the signed offtake schedule, OEM nomination letter, qualification milestones, and program-level volume ramp
      for every non-Renault customer.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP001
      - TP003
  - type: missing-source
    severity: material
    topic: independent-performance-benchmark
    missingEvidence: >-
      Independent lifecycle-carbon, safety, energy-density, fast-charge, warranty, and production-quality benchmarks
      against named incumbent cells.
    whyItMatters: >-
      Company and investor descriptions establish positioning but do not prove superior performance or a durable
      technical moat.
    diligencePath: >-
      Commission third-party cell teardown, lifecycle assessment, qualification comparison, and warranty-normalized
      performance testing.
    relatedQuestionRefs:
      - QP003
      - QP009
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure-gaps
    missingEvidence: Audited revenue, realized pricing, customer mix, revenue-recognition policy, cost of goods sold, and gross margin.
    whyItMatters: >-
      Without these inputs, revenue quality, concentration, and the path to positive gross profit cannot be
      underwritten.
    diligencePath: >-
      Review audited monthly management accounts and executed customer contracts, then reconcile shipments, invoices,
      and cash receipts.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI007
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, undrawn facilities, construction commitments, burn, runway, debt service, security, and
      covenant headroom.
    whyItMatters: >-
      Historical financing totals cannot establish whether Verkor can fund the remaining ramp or absorb commissioning
      delays.
    diligencePath: >-
      Review bank statements, a 13-week cash forecast, capex-to-complete schedule, facility agreements, draw notices,
      and covenant certificates.
    relatedQuestionRefs:
      - QI004
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Qualified output, line utilization, cell yield, scrap, bill of materials, labor and energy cost per kWh, warranty
      reserves, and inventory aging.
    whyItMatters: >-
      These inputs determine fixed-cost absorption, gross margin, working-capital consumption, and the cash cost of
      ramping Dunkirk.
    diligencePath: >-
      Inspect line-level manufacturing dashboards and reconcile operating metrics to inventory, cost accounting, and
      customer acceptance records.
    relatedQuestionRefs:
      - QI003
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: manufacturing-yields
    missingEvidence: >-
      Audited production scrap rates, first-pass mechanical yields, and electrochemical formation failure percentages
      for Dunkirk production lines.
    whyItMatters: >-
      Battery gigafactory economics and gross margins depend heavily on keeping scrap rates below 10%; high early scrap
      severely erodes working capital.
    diligencePath: >-
      Request facility inspection logs, monthly scrap rate data by manufacturing step, and OEM factory acceptance test
      records during technical diligence.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: developer-and-open-source-signal
    missingEvidence: Public developer community repositories, software SDK adoption metrics, or public API usage statistics.
    whyItMatters: >-
      Verkor is a physical hardware and industrial cell manufacturer whose digital assets are proprietary internal
      MES/telemetry tools rather than public software.
    diligencePath: >-
      Evaluate internal industrial software architecture and engineering recruitment quality during management
      interviews and technical discussions.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: second-oem-offtake
    missingEvidence: >-
      Binding commercial supply agreements or multi-year offtake contracts with a major automotive OEM other than
      Renault Group.
    whyItMatters: >-
      Verkor's initial 16 GWh plant is 75% committed to Renault, creating extreme customer concentration and dependency
      on Alpine/Renault premium EV market reception.
    diligencePath: >-
      Review future commercial disclosures, EU project finance compliance filings, or OEM procurement announcements for
      verified secondary offtake terms.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: offtake-pricing-mechanics
    missingEvidence: >-
      Detailed contractual pricing collar, indexing to raw metal price volatility (NMC cathode metals), and take-or-pay
      enforcement terms in the Renault contract.
    whyItMatters: >-
      Determines whether cell price adjustments protect Verkor's operating margins during battery raw material price
      fluctuations or volume reductions.
    diligencePath: Request confidential contract excerpts or project finance syndicate covenants during management diligence.
    relatedQuestionRefs:
      - QU002
    relatedTableRefs:
      - TU001
  - type: private-evidence-only
    severity: material
    topic: Debt Covenants and Cash Sweep Mechanics
    missingEvidence: >-
      Non-public credit facility documentation defining minimum debt service coverage ratios (DSCR), loan life coverage
      ratios (LLCR), mandatory cash sweep thresholds, and event-of-default conditions for the €1.2B senior debt.
    whyItMatters: >-
      Without visibility into bank covenants, investors cannot model downside cash-bleed scenarios or identify early
      debt acceleration triggers if commissioning or ramp milestones slip.
    diligencePath: >-
      Review lender compliance certificates, credit agreement disclosure schedules, and bank agent quarterly compliance
      reports during confirmatory dataroom review.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: Dunkirk Production Yield and Environmental Authorizations
    missingEvidence: >-
      Verified third-party engineering audit records on production scrap rates, cell formation cycle yields, and
      prefectural environmental operating authorization monitoring reports for the Dunkirk facility.
    whyItMatters: >-
      Battery gigafactory economics are exceptionally sensitive to initial yield ramps; high scrap rates rapidly consume
      operating cash reserves and impair customer qualification schedules.
    diligencePath: >-
      Request independent engineer (IE) technical reports prepared for the senior lending syndicate and prefectural
      environmental agency compliance inspection logs.
    relatedQuestionRefs:
