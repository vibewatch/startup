callouts:
  - calloutType: "risk"
    title: "Critical Reliance on Single Anchor OEM"
    body: "Verkor's 12 GWh commitment to Renault Group accounts for three-quarters of its initial 16 GWh Dunkirk production capacity. While this contract provides crucial baseline demand to underwrite more than €3 billion in public and private capital, it exposes Verkor to binary customer risk. Any delay in vehicle rollouts, downward revision in EV production targets by Renault, or technical integration friction directly threatens the plant's capacity utilization and operational cash flows."
    claimRefs:
