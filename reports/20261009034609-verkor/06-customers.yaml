chapter:
  number: 6
  title: "Customers"
  summary: "Verkor has anchored its commercial strategy on a binding 12 GWh per year long-term offtake partnership with anchor backer Renault Group for premium electric vehicles such as the Alpine A390, while also pursuing commercial mobility, off-highway equipment, and stationary energy storage. However, extreme customer concentration around Renault, absence of a second validated automotive OEM at equal scale, and macro EV demand softening in Europe present critical volume and pricing risks during the Dunkirk ramp."
sections:
  - id: "customer-segmentation-and-targeting"
    title: "Customer Segmentation and Value Proposition"
    body: "Verkor segments its addressable market across passenger electric vehicles, commercial vehicles, off-highway industrial machinery, and utility-scale stationary energy storage. In passenger electric mobility, Verkor positions itself as an upstream supplier of high-performance nickel-manganese-cobalt (NMC) battery cells and modules, leaving pack integration and final vehicle assembly to original equipment manufacturers (OEMs). The core value proposition combines high energy density, low internal resistance for fast charging, and a drastically reduced carbon footprint—claimed to be four to five times lower than Chinese equivalents by leveraging France's low-carbon nuclear grid and local industrial waste-heat networks. Beyond passenger cars, Verkor targets stationary storage and specialized mobility through industrial partnerships such as Startec Energy to develop recyclable packs for niche applications."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "anchor-customer-adoption-and-production-proof"
    title: "Anchor Customer Proof and Deployment Trajectory"
    body: "Commercial traction at Verkor is defined almost entirely by its strategic relationship with Renault Group, which initially acquired a stake in Verkor in June 2021 before executing a long-term commercial partnership in April 2023. Under the agreement, Verkor is contracted to supply Renault with the equivalent of 12 GWh of battery cells annually from the Dunkirk Gigafactory, primarily designated for upper vehicle segments and its performance brand Alpine, starting with the Alpine A390 (previously designated C-Crossover GT). Verkor and Renault validated product technical quality and manufacturing feasibility through the Grenoble Innovation Centre (VIC) with an A-sample concept freeze, progressing toward first commercial deliveries in 2026 following steady-state line commissioning at Dunkirk. While earlier long-term projections targeted 10 GWh to Renault in 2026 expanding to 20 GWh by 2030, these milestones remain single-customer dependent."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "customer-concentration-and-retention-risks"
    title: "Customer Concentration, Procurement Dynamics, and Offtake Durability"
    body: "The central commercial vulnerability for Verkor is its extreme revenue concentration in Renault Group. The 12 GWh annual binding offtake represents 75% of the Dunkirk Gigafactory's initial 16 GWh nameplate capacity, leaving Verkor highly exposed to Renault's EV volume realization, model launch timing, and broader retail demand fluctuations. European Investment Bank analysts and lenders have highlighted that European EV demand faces volatility from subsidy rollbacks and uneven charging infrastructure rollouts across the continent. Although Verkor's multi-tier governance includes Renault representation on its supervisory board, creating mutual alignment, Verkor has not yet disclosed a second binding serial automotive offtake agreement of comparable scale. If EV adoption in premium segments slows or Alpine volumes underperform expectations, Verkor lacks diversified high-volume automotive offtake buffers."
    claimRefs:
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
