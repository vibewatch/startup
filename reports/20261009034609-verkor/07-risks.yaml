callouts:
  - calloutType: "risk"
    title: "The Single-Customer Trap: Renault Offtake Dependence"
    body: "While Renault Group's anchor offtake provides essential demand visibility to unlock €1.2B in non-recourse senior project debt, it creates acute commercial concentration. Any downward revision in Renault EV volume targets directly jeopardizes debt service coverage ratios."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR014"
  - calloutType: "risk"
    title: "Capital Structure Fragility in Capex Overrun Scenarios"
    body: "Following Northvolt's cautionary insolvency trajectory, European gigafactory economics leave minimal tolerance for industrial scrap or commissioning delays. Because Verkor's €1.2B debt carries strict non-recourse project covenants, operational cash burn during ramp-up could force dilutive equity injections if commercial yields lag projections."
    claimRefs:
      - "CR001"
      - "CR004"
      - "CR014"
      - "CR015"
