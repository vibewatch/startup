chapter:
  number: 2
  title: "Market Analysis"
  summary: "Verkor targets European electric vehicle and stationary storage lithium-ion battery demand, anchored by EU decarbonisation mandates and French industrial policy. While projected European EV battery demand expands from 180 GWh in 2024 to over 790 GWh in 2030, growth is tempered by EV purchase subsidy rollbacks, high interest rates, volatile raw-material costs, and intense Chinese competition."
sections:
  - id: market-boundary-and-scope
    title: "Market Boundary, Category Scope, and Industry Taxonomy"
    body: "Verkor operates as a dedicated developer and manufacturer of low-carbon lithium-ion battery cells and modules tailored specifically for automotive electric mobility and utility-scale stationary energy storage. The boundary of Verkor's addressable spend includes advanced cathode chemistry formulation, proprietary cell design, cell manufacturing, and module packaging for passenger electric vehicles and commercial fleet powertrains. The category explicitly excludes raw upstream mineral mining, active materials chemical synthesis prior to cell manufacturing, pack-level chassis structural integration handled directly by OEMs, end-user vehicle assembly, and independent post-industrial recycling infrastructure. While adjacent sectors such as stationary grid energy storage offer secondary diversification, passenger electric vehicles represent the foundational commercial demand driver for Verkor's initial production lines in Dunkirk."
    claimRefs:
      - CM001
      - CM002
      - CM003
    tableRefs:
      - TM001
  - id: market-sizing-lenses
    title: "Market Sizing Lenses: Global Trajectory, European Demand, and Captive Capacity"
    body: "According to the International Energy Agency (IEA) Global EV Outlook cited in Verkor's 2024 disclosures, worldwide demand for electric vehicle batteries is projected to expand threefold from 1 TWh in 2023 to more than 3 TWh by 2030. Within Europe, annual demand is forecasted to surge from 180 GWh in 2024 to over 790 GWh by 2030, representing an estimated CAGR of approximately 27.9%. In France, the national low-carbon strategy (SNBC) establishes statutory targets for electric vehicles to comprise 66% of new car sales by 2030 and 100% by 2035, increasing the EV penetration of total fleet stock on French roads from 2.2% in early 2024 to 15% in 2030. Against this regional TAM of 790 GWh, Verkor's planned Dunkirk Gigafactory initial nominal capacity of 16 GWh per year represents an initial serviceable addressable volume share of roughly 2.0% of projected 2030 European EV battery demand, with 12 GWh allocated to long-term commercial offtake with Renault Group."
    claimRefs:
      - CM004
      - CM005
      - CM006
      - CM007
      - CM008
      - CM009
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyer-segmentation-procurement
    title: "Buyer Segmentation, Budget Ownership, and Strategic Adoption Constraints"
    body: "Adoption within the automotive segment is governed by automotive OEM central powertrain procurement and vehicle platform engineering leadership, characterized by multi-year development cycles, rigorous A-sample to C-sample qualification testing, and long-term bilateral volume offtake agreements. Batteries account for 30% to 50% of an electric vehicle's total production cost, making battery cell sourcing the single largest cost determinant for carmaker platform profitability. Commercial traction is reinforced by strategic industrial joint ventures and equity-linked supply partnerships, as demonstrated by Renault Group's co-investment and 12 GWh offtake commitment. However, adoption across broader OEM tiers faces substantial constraints: the rollback of consumer EV purchase incentives in major markets like Germany in late 2023, uneven charging infrastructure concentration across France, Germany, and the Netherlands, volatile raw-material pricing for critical cathode minerals, and cost competition from Asian cell producers whose scale and integrated supply chains exert acute pricing pressure on nascent European gigafactories."
    claimRefs:
      - CM010
      - CM011
      - CM012
      - CM013
      - CM014
      - CM015
    tableRefs:
      - TM003
