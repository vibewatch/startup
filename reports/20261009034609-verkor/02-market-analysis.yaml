callouts:
  - calloutType: risk
    title: "Market Demand Volatility and Subsidies Contraction Across Europe"
    body: "The European electric vehicle market is navigating headwinds stemming from political uncertainty, high capital costs, and the termination of consumer EV purchase subsidies in key markets including Germany in late 2023. These macro factors, alongside Northvolt's Chapter 11 filing in late 2024, have intensified investor scrutiny over capital-intensive European gigafactory ramp-ups."
    claimRefs:
      - CM013
      - CM014
  - calloutType: insight
    title: "Downstream Commercial Anchoring as Risk Mitigation"
    body: "Unlike pure merchant battery startups that face unhedged capacity utilization risks, Verkor's operational model pre-allocates 12 GWh of its initial 16 GWh Dunkirk capacity to Renault Group under a bilateral offtake agreement. This direct automotive partnership significantly lowers commercial volume absorption risk during early manufacturing ramp-up."
    claimRefs:
      - CM009
      - CM011
