  - id: TE002
    title: Verkor Workflow and Manufacturing Operating Sequence
    columns:
      - Manufacturing Phase
      - Industrial Unit Operations
      - Key Process Equipment & Controls
      - Technical Specifications & Output
      - Primary Operating Risk
    rows:
      - - Electrode Slurry Preparation
        - Active materials, conductive carbon, and binder precision mixing
        - Automated vacuum planetary mixers with viscosity and solids monitoring
        - Homogeneous high-viscosity active material slurry for cathode and anode
        - Inconsistent slurry rheology causing coating agglomerations and pinhole defects
      - - Electrode Coating & Drying
        - Continuous slot-die slurry coating onto aluminum and copper current collectors
        - Multi-zone flotation drying ovens with solvent condensation recovery
        - Calendered electrode rolls with tightly controlled areal mass loading
        - Solvent entrapment, uneven coating thickness, and binder migration across substrate
      - - Electrode Calendering & Notching
        - High-pressure roller compaction followed by precision laser/mechanical tab notching
        - Heated hydraulic calender rolls with continuous laser thickness gauges
        - Densified electrode strips with precise porosity and micro-welding tabs
        - Electrode foil tearing, active layer delamination, and edge burrs causing internal shorts
      - - Cell Stacking & Assembly
        - Separator interleaving, electrode sheet stacking, tab welding, and pouch/can encasement
        - High-speed multi-layer pick-and-place stackers and ultrasonic tab welders
        - Dry cell assembly sealed in moisture-impermeable casing under dry-room air
        - Stack misalignment, separator puncture, and defective tab weld electrical resistance
      - - Electrolyte Filling & Sealing
        - Deep vacuum electrolyte injection, wetting soaking, and hermetic pre-sealing
        - Automated precision metering vacuum dosing pumps in ultra-low dew-point enclosure
        - Electrolyte-saturated cell core ready for electrochemical activation
        - Incomplete electrode wetting, localized dry spots, and seal micro-leakage
      - - Formation & Aging Finishing
        - Controlled electrochemical charging cycles, degassing, and extended high-temp aging
        - Automated formation channels with per-cell voltage, current, and temperature logging
        - Stable Solid Electrolyte Interphase (SEI) layer; final cell sorting and grading
        - Protracted cycle times, high cell rejection rates, and post-formation gas expansion
    notes: >-
      Process stages follow standard lithium-ion electrode, assembly, and formation sequences detailed in Verkor
      industrial and sustainability documentation.
    claimRefs:
      - CE006
      - CE007
      - CE008
