        title: Exhibits
        blocks:
          - type: callout
            title: Northvolt is a warning, not a forecast
            body: >-
              Northvolt's late-2024 Chapter 11 filing increased investor caution around European battery platforms. It
              demonstrates sector execution and financing risk but does not prove that Verkor will follow the same path;
              Verkor-specific yield and cost evidence is still required.
