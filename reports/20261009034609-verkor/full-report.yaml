      - - Base Case
        - >-
          Dunkirk reaches commercial output with moderate delays; scrap rates 10-15%; Renault absorbs bulk of cell
          output; margins near breakeven.
        - >-
          Enterprise value protects senior debt and preferred tranches; common equity yields modest internal rate of
          return (1.0x-1.3x).
        - Extended cash burn during yield stabilization requiring intermediate dilutive equity injections.
        - 50% — Supported by strong French sovereign backing and committed EIB/commercial bank debt facilities.
      - - Bear Case
        - >-
          Persistent cell defect rates (>20%); Renault slows off-take; debt covenants breached under EIB or commercial
          facilities.
        - Debt restructuring or rescue financing; substantial impairment or total loss for junior equity holders.
        - European EV demand slump, cell chemistry obsolescence, or Northvolt-style liquidity crisis.
        - 25% — High operational and capital expenditure sensitivity common to capital-intensive gigafactory ramp-ups.
    notes: >-
      Probabilities and valuation logic reflect institutional scenario analysis grounded in verified capital structure
      and execution dependencies.
    claimRefs:
      - CV002
      - CV008
      - CV011
      - CV012
      - CV013
      - CV014
