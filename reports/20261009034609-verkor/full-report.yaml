      - number: '2.2'
        title: 'Market Sizing Lenses: Global Trajectory, European Demand, and Captive Capacity'
        blocks:
          - type: paragraph
            body: >-
              According to the International Energy Agency (IEA) Global EV Outlook cited in Verkor's 2024 disclosures,
              worldwide demand for electric vehicle batteries is projected to expand threefold from 1 TWh in 2023 to
              more than 3 TWh by 2030. Within Europe, annual demand is forecasted to surge from 180 GWh in 2024 to over
              790 GWh by 2030, representing an estimated CAGR of approximately 27.9%. In France, the national low-carbon
              strategy (SNBC) establishes statutory targets for electric vehicles to comprise 66% of new car sales by
              2030 and 100% by 2035, increasing the EV penetration of total fleet stock on French roads from 2.2% in
              early 2024 to 15% in 2030. Against this regional TAM of 790 GWh, Verkor's planned Dunkirk Gigafactory
              initial nominal capacity of 16 GWh per year represents an initial serviceable addressable volume share of
              roughly 2.0% of projected 2030 European EV battery demand, with 12 GWh allocated to long-term commercial
              offtake with Renault Group.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
