      - number: '3.3'
        title: Moat durability and displacement pressure
        blocks:
          - type: paragraph
            body: >-
              Verkor's differentiation is based more on industrial configuration than on a publicly benchmarkable
              chemistry advantage. The company says new lines will be committed only after its first gigafactory has
              started and customer contracts are secured, and it plans to differentiate through low-carbon cells.
              Macquarie attributes that proposition to France's low-carbon electricity, proposed use of nearby waste
              heat, and supply-chain traceability, with a company aim for a carbon footprint around three times below
              batteries produced at the time of the statement. No retained independent lifecycle benchmark validates
              that comparison. Long-term offtake and customer-linked sourcing can increase integration and reduce
              near-term volume risk, yet they also concentrate bargaining power and make the undisclosed pricing and
              indexation terms important. The Northvolt precedent and Chinese competitive pressure make factory ramp,
              yield, cost, and additional serial customers the decisive tests of durability rather than announced
              capacity or financing alone.
