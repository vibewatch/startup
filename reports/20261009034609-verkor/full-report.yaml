  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Industry Taxonomy
        blocks:
          - type: paragraph
            body: >-
              Verkor operates as a dedicated developer and manufacturer of low-carbon lithium-ion battery cells and
              modules tailored specifically for automotive electric mobility and utility-scale stationary energy
              storage. The boundary of Verkor's addressable spend includes advanced cathode chemistry formulation,
              proprietary cell design, cell manufacturing, and module packaging for passenger electric vehicles and
              commercial fleet powertrains. The category explicitly excludes raw upstream mineral mining, active
              materials chemical synthesis prior to cell manufacturing, pack-level chassis structural integration
              handled directly by OEMs, end-user vehicle assembly, and independent post-industrial recycling
              infrastructure. While adjacent sectors such as stationary grid energy storage offer secondary
              diversification, passenger electric vehicles represent the foundational commercial demand driver for
              Verkor's initial production lines in Dunkirk.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
