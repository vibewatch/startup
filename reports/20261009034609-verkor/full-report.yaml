      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Verkor announced a consequential leadership handoff in August 2026: Laurent Debrue, previously Deputy
              Managing Director and COO, was to become President and CEO on 1 September, while co-founder and CEO Benoit
              Lemaignan was to move to the Supervisory Board as vice-chairman. That arrangement preserves founder
              involvement while transferring operating authority to the executive who oversaw industrialisation and
              early ramp-up. The latest detailed governance roster in the assigned evidence, however, is the company's
              2024 sustainability report. It described an eight-member Supervisory Board with three observers and five
              specialist committees, alongside a seven-member Executive Committee. Because the current site names
              founder advisers but does not provide a complete post-transition board and executive roster, committee
              membership, reserved matters and succession depth require direct confirmation.
            claimRefs:
              - CO006
