  - id: FE001
    title: Verkor Integrated Battery Manufacturing Stack
    type: stack
    summary: >-
      Architectural overview of Verkor's multi-layered industrial manufacturing platform, from raw materials and
      physical gigafactory infrastructure to digital control backbones and automotive customer integration.
    data:
      layers:
        - label: 'Layer 1: Upstream Active Materials & Substrates'
          detail: Procurement, refining, and qualification of critical battery precursor materials
          modules:
            - label: Cathode Active Materials (CAM)
              detail: High-nickel lithium nickel-manganese-cobalt (NMC) formulations
            - label: Anode Materials
              detail: High-purity natural and synthetic graphite substrates
            - label: Current Collector Foils
              detail: Battery-grade aluminum cathode foil and copper anode foil
        - label: 'Layer 2: Core Physical Manufacturing Operations'
          detail: Three-stage conversion process from chemical slurry to finished electrochemical cell
          modules:
            - label: Electrode Fabrication
              detail: Continuous automated slurry mixing, precision slot-die coating, drying, and calendering
            - label: Cell Assembly
              detail: Precision electrode tab notching, separator stacking, ultrasonic welding, and packaging
            - label: Cell Formation & Finishing
              detail: Controlled electrochemical formation, high-temperature aging, degassing, and sorting
        - label: 'Layer 3: Digital Automation & Quality Control'
          detail: Data-driven industrial operating system engineered in partnership with Capgemini
          modules:
            - label: Industrial IoT & MES Integration
              detail: Unified telemetry ingestion linking line PLCs, SCADA, and factory MES systems
            - label: Machine Learning Analytics
              detail: Predictive process tuning, visual defect recognition, and scrap reduction algorithms
            - label: Compliance & Traceability
              detail: Automated digital lot tracking, ISO 9001/27001 controls, and EU Battery Passport readiness
        - label: 'Layer 4: Downstream Deployment & Circularity'
          detail: Commercial customer integration, stationary energy storage, and materials recycling
          modules:
            - label: OEM Vehicle Integration
              detail: Serial supply to Renault Group and Alpine electric vehicle platforms
            - label: Stationary Storage Applications
              detail: Containerized utility-scale and commercial BESS installations
            - label: Closed-Loop Recycling
              detail: In-line production scrap recycling and hydrometallurgical metals recovery partnerships
        - label: 'Layer 5: Primary Gigafactory Physical Infrastructure'
          detail: Utility-scale Dunkirk production site engineered for 16 GWh initial annual output
          modules:
            - label: Clean & Dry Room Environments
              detail: Ultra-low dew-point atmospheric controls for moisture-free electrolyte handling
            - label: High-Voltage Electrical Substation
              detail: Dedicated 225 kV grid substation connected by RTE for high-load operations
            - label: Automated Logistics & Warehousing
              detail: Port-connected automated material transport and finished cell handling
        - label: 'Layer 6: Industrial Proving & Pilot Operations'
          detail: Verkor Innovation Centre (VIC) in Grenoble dedicated to agile qualification
          modules:
            - label: 150 MWh Pilot Prototyping Line
              detail: Small-batch sample fabrication fulfilling customer specification freezes
            - label: Advanced Analytical R&D Labs
              detail: Chemical analysis, degradation modeling, and non-destructive testing suites
            - label: Ecole de la Batterie Training
              detail: Technical workforce skill development and operator qualification center
    approximationNotes: >-
      Diagram synthesizes Verkor's published industrial operating model, supplier partnerships, and Capgemini digital
      architecture.
    claimRefs:
      - CE002
      - CE006
      - CE008
      - CE010
      - CE012
