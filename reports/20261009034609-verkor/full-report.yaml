      - number: '4.3'
        title: Margin Path and Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              The principal margin risks are industrial rather than software-like. Verkor identifies raw-material and
              equipment dependence, skills availability, and regulation-driven capital and production costs as material
              constraints. Its 2024 sustainability report also states that, because the gigafactory was not yet
              operational in that reporting period, business-wide performance indicators relied on theoretical
              assumptions; this limits their use for a steady-state margin model. The same report records that
              Northvolt's Chapter 11 filing made investors more cautious, a relevant warning that financing and
              contracted demand do not by themselves prove stable yields or solvent ramp economics. The financial
              verdict is therefore mixed: contracted demand, physical commissioning, and committed project funding are
              strengths, while revenue quality, customer concentration, yield, scrap, gross margin, cash conversion,
              debt headroom, and runway remain unresolved. Investment underwriting requires management accounts,
              customer contracts, production dashboards, and financing agreements rather than extrapolation from
              capacity or funding announcements.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
