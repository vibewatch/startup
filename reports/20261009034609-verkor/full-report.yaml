      - number: '1.4'
        title: Industrial milestones and diligence boundary
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows rapid progression from founding through the Renault partnership, pilot-line
              build-out, large financing rounds and the December 2025 gigafactory inauguration. By August 2026, Verkor
              said the Dunkirk site's second production line had been commissioned and that the first batteries produced
              entirely on-site had been delivered. This is stronger evidence of physical progress than an announced
              construction schedule, but it remains company-issued and does not disclose qualified yield, scrap,
              utilization, customer acceptance or production economics. The EIB's own project narrative underscores that
              battery megaprojects face volatile EV demand and raw-material prices alongside technology, market and
              construction risks. No precise valuation is supportable from this pool, and no absence-of-incident
              conclusion should be drawn from the limited adverse record. Investment underwriting therefore still
              depends on operational data-room evidence and financing documents.
