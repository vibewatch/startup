chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Verkor is a Grenoble-based French battery manufacturer founded in July 2020. Its model combines the
              Grenoble Verkor Innovation Centre, which the company describes as its pilot-line, R&D and headquarters
              site, with a Dunkirk gigafactory intended for mass manufacture. The current corporate site describes
              low-carbon lithium-ion cells and modules for passenger and commercial vehicles, off-road mobility and
              stationary storage, so the business is an industrial supplier rather than a software-like recurring
              revenue company. The company reports more than 1,000 employees and a 16 GWh target annual cell-production
              capacity. Those metrics establish physical scale, but neither is a proxy for utilization, qualified
              output, revenue or cash generation. The current public evidence also does not disclose revenue, margins or
              a customer count suitable for a cover metric.
