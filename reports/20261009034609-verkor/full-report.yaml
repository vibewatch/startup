      - number: '4.2'
        title: Capital Stack and Adequacy
        blocks:
          - type: paragraph
            body: >-
              The capital stack is substantial but highly project-specific. In 2023, stakeholders reported a minimum
              €850 million Series C, roughly €650 million of French subsidies, and €600 million of EIB debt support. A
              later financing closed more than €1.3 billion of green financing with 16 commercial and three public
              banks, including €961 million of senior commercial-bank loans, €282 million of which Mercom reported as
              government-guaranteed, plus bridge and subordinated lending. Verkor and Mercom describe more than €3
              billion as secured for the Dunkirk gigafactory and Grenoble innovation center. That is funding raised or
              committed for defined assets, not evidence of unrestricted cash available at the run date. The retained
              record gives no current cash balance, draw schedule, covenant tests, debt-service profile, working-capital
              facility, burn, or remaining construction requirement. Capital adequacy therefore cannot be underwritten
