      - number: '1.3'
        title: Capital architecture and stakeholder influence
        blocks:
          - type: paragraph
            body: >-
              Verkor's capital stack is unusually policy- and project-finance-heavy. In September 2023 the company
              announced a package exceeding €2 billion, comprising at least €850 million of Series C equity, €600
              million of EIB debt support and about €650 million of French subsidies, with stated approvals and
              conditions applying at that date. The round brought Macquarie and Meridiam alongside strategic and public
              investors including Renault, EIT InnoEnergy and Bpifrance's SPI fund. The 2024 sustainability report
              subsequently said a €1.3 billion green loan had closed and that secured financing for the first
              gigafactory and innovation centre exceeded €3 billion. "Secured financing" combines equity, debt and
              subsidy commitments; it must not be read as cash available, enterprise valuation or unencumbered runway.
              Cap-table percentages, preference terms, draw conditions and covenants are not disclosed in the assigned
              public record.
