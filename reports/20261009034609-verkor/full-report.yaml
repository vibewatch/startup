        title: Capability and commercial position
        blocks:
          - type: paragraph
            body: >-
              Verkor's disclosed operating footprint combines a 150 MWh pilot line at the Verkor Innovation Centre with
              a Dunkirk gigafactory designed for 16 GWh. Its August 2026 news page says the second Dunkirk production
              line had been commissioned and the first batteries produced entirely on-site had been delivered, but this
              is company-issued evidence and does not disclose utilization, automotive qualification yield, scrap, or
