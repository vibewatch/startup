    title: "Capital Structure Seniority Masks Junior Equity Exposure"
    body: "While headline financing figures of over €3B suggest strong institutional consensus, prospective equity co-investors must recognize that the majority of committed capital consists of EIB project debt, French state subsidies, and asset-backed bank facilities that rank senior to common equity. Without access to common share pricing, liquidation preference cascades, and audited manufacturing yields from Dunkirk, underwriting a venture or growth equity valuation remains unsupportable."
    claimRefs:
