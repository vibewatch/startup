  - id: FI001
    title: 收入与毛利证据桥
    type: flow
    summary: 公开证据已覆盖合同和初始生产，但价格、确认收入、单位成本及毛利转化仍未披露。
    data:
      nodes:
        - id: contracted-demand
          label: 已签约需求
          detail: Renault 年承购量 12 GWh；EnerSys 协议未披露数量
        - id: qualified-production
          label: 已认证产量
          detail: 2024 年生产并交付超过 30,000 个 VIC 电芯
        - id: dunkirk-ramp
          label: 敦刻尔克爬坡
          detail: 截至 2026 年 8 月已报告首批完全现场生产的电池及第二条产线投产
        - id: accepted-shipments
          label: 已接受的批量出货
          detail: 数量和客户验收情况未公开披露
        - id: realized-price
          label: 实现价格
          detail: 价格、指数化、折扣和保修经济性未公开披露
        - id: recognized-revenue
          label: 确认收入
          detail: 收入和客户构成未公开披露
        - id: gross-profit-cash
          label: 毛利与现金转化
          detail: 毛利率、营运资本、现金消耗和资金可支撑期限未公开披露
      edges:
        - from: contracted-demand
          to: qualified-production
          label: 认证
        - from: qualified-production
          to: dunkirk-ramp
          label: 工业规模化
        - from: dunkirk-ramp
          to: accepted-shipments
          label: 客户验收
        - from: accepted-shipments
          to: realized-price
          label: 合同条款
        - from: realized-price
          to: recognized-revenue
          label: 会计确认
        - from: recognized-revenue
          to: gross-profit-cash
          label: 成本与营运资本转化
