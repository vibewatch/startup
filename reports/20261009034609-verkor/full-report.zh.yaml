      - number: '1.4'
        title: 工业里程碑与尽调边界
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，公司从成立到 Renault 合作、试验线建设、大额融资，再到 2025 年 12 月超级工厂启用，推进速度很快。到 2026 年 8 月，Verkor
              称敦刻尔克基地的第二条生产线已经投产，首批完全在厂内生产的电池也已交付。这比宣布施工计划更能证明物理进展，但信息仍由公司发布，未披露合格率、废品率、利用率、客户验收或生产经济性。EIB
              自身的项目叙述强调，电池大型项目同时面临波动的电动车需求和原材料价格，以及技术、市场和施工风险。根据这组资料无法支持精确估值，也不能从有限的不利记录推断没有事故。因此，投资判断仍取决于运营数据室证据和融资文件。
