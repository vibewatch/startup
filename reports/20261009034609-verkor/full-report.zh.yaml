      - number: '7.4'
        title: 风险热图、缓释措施与论点失效标准
        blocks:
          - type: paragraph
            body: >-
              为监测和管理多面的风险，Verkor 维持与 ISO 31000 对齐的内部企业风险管理框架，由 Supervisory Board 的 Audit and Risk committee 按季度监督，并由
              2026 年 3 月任命 Jacques Esculier 为 Supervisory Board President
              加强治理。不过，机构投资者必须监测会推翻平台股权论点的明确触发条件。主要失效标准包括：（1）完整基地投产后 12 个月内无法达到可持续的生产合格率目标，导致现金消耗无法挽回；（2）Renault Group
              大幅向下重谈销量或取消车型且没有替代的一级汽车买家；（3）债务偿付覆盖率违约触发优先债务契约加速；（4）监管机构暂停敦刻尔克环境运营许可。通过与 EDF 的 12 年期
              核电合同，能源供应的缓释成熟度最高；但矿产价格传导和未对冲的资本开支超支仍很脆弱。
            claimRefs:
              - CR001
              - CR004
              - CR007
              - CR009
              - CR013
              - CR014
