chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Verkor 是一家总部位于 Grenoble、成立于 2020 年 7 月的法国电池制造商。公司将其所称的试验线、研发和总部基地 Grenoble Verkor Innovation
              Centre，与计划用于量产的敦刻尔克超级工厂结合起来。公司当前官网称其产品为面向乘用车、商用车、越野出行和固定式储能的低碳锂离子电芯与模组，因此它是工业供应商，而非类似软件的经常性收入公司。公司披露员工超过
              1,000 人，目标年电芯产能为 16 GWh。这些指标说明了物理规模，但都不能代表利用率、合格产量、收入或现金创造能力。当前公开证据也未披露收入、利润率或可用于封面指标的客户数量。
