      - number: '6.2'
        title: 锚定客户证明与部署轨迹
        blocks:
          - type: paragraph
            body: >-
              Verkor 的商业牵引几乎完全由其与 Renault Group 的战略关系定义。Renault 于 2021 年 6 月首次收购 Verkor 股份，随后在 2023 年 4 月
              签署长期商业合作。协议规定，Verkor 每年从敦刻尔克 Gigafactory 向 Renault 供应相当于 12 GWh 的电芯，主要用于更高端车型和其性能品牌 Alpine，首款车型为 Alpine
              A390（此前称 C-Crossover GT）。Verkor 与 Renault 在 Grenoble Innovation Centre（VIC）通过 A-sample
              概念冻结验证了产品技术质量和制造可行性，并在敦刻尔克生产线稳定投产后，推进 2026 年首次商业交付。尽管较早的长期预测是 2026 年向 Renault 供应 10 GWh、2030 年增至 20
              GWh，这些里程碑仍依赖单一客户。
