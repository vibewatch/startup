        blocks:
          - type: callout
            title: 已落实资本不等于可用现金
            body: Verkor 报告的总额混合了条件和优先级各不相同的股权、债务及补贴承诺。投资判断需要股权结构表、提款计划、契约包、补贴里程碑和当前流动性。
            calloutType: risk
            claimRefs:
