      - number: '3.3'
        title: 护城河韧性与替代压力
        blocks:
          - type: paragraph
            body: >-
              Verkor 的差异化更多来自工业配置，而非公开可基准比较的化学体系优势。公司称，只有在首座超级工厂启动且客户合同落实后，才会承诺新生产线；公司还计划以低碳电芯形成差异。Macquarie
              将这一主张归因于法国低碳电力、拟使用附近余热和供应链可追溯性；公司目标是让碳足迹约为当时电池的三分之一。现有留存资料中没有独立生命周期基准验证这一比较。长期供货和客户绑定的采购可以提升整合度并降低短期销量风险，但也会集中议价权，使未披露的定价和指数化条款变得关键。Northvolt
              的先例和中国竞争压力意味着，工厂爬坡、合格率、成本以及新增连续客户才是检验韧性的关键，而不是已宣布的产能或融资规模。
            claimRefs:
              - CP004
              - CP007
              - CP008
              - CP010
              - CP011
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP009
              - CP016
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: Northvolt 是警示，不是预测
            body: >-
              Northvolt 在 2024 年末申请 Chapter 11，提高了投资者对欧洲电池平台的警惕。这证明了行业执行和融资风险，但不能证明 Verkor 会走同样的路；Verkor
              自身的合格率和成本证据仍不可缺。
            calloutType: risk
            claimRefs:
              - CP010
          - type: callout
            title: Renault 锚定销量，也带来议价压力
            body: Renault 的长期协议提高了初期产量的需求可见度，但公开来源未披露价格、指数化、最低采购保护或救济条款。因此，同一锚定客户既是商业化优势，也可能构成集中度风险。
            calloutType: insight
            claimRefs:
              - CP004
              - CP005
              - CP016
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 商业模式与牵引力
        blocks:
          - type: paragraph
            body: >-
              Verkor 可见的商业模式是签约供应电芯，而不是公开价目表。Renault 通过报道中的 12 GWh 年度供货量锚定需求，EnerSys
              协议则增加了另一种工业电池规格；两项披露都没有给出实际价格、指数化、验收或收入确认条款。运营证据已超出规划阶段：Verkor 报告 2024 年生产并交付超过 30,000 个电芯，2026 年 8 月
              新闻索引称第二条生产线投产的同时，首批完全在敦刻尔克生产的电池已交付。这些里程碑证明了实体执行，但不是收入或利用率指标。公开来源还称初始设计产能为 16
              GWh，不能把它当成产量、销售额或已吸收的固定成本。因此，收入桥仍停留在合同到生产的证据链上，关键的价格、确认销量、保修和毛利润环节都不可见。
