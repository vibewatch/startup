        - 通过欧洲清洁技术 IPO 或战略收购实现较高企业价值倍数（>2.0x 投入资本）。
        - 受补贴的中国电池进口产品压低欧洲价格；原材料供应中断。
        - 25% —— 取决于制造执行毫无差错，以及欧洲 EV 购车补贴保持稳定。
      - - 基准情景
        - 敦刻尔克经过中等程度延误后达到商业产出；废料率为 10-15%；Renault 消化大部分电芯产量；利润率接近盈亏平衡。
        - 企业价值足以保障高级债务和优先档位；普通股获得温和的内部回报率（1.0x-1.3x）。
        - 良率稳定期间现金消耗延长，需要阶段性、会造成稀释的股权注资。
        - 50% —— 得到法国强力主权支持，以及已承诺的 EIB / 商业银行债务额度支撑。
      - - 悲观情景
        - 电芯缺陷率持续偏高（>20%）；Renault 放缓承购；违反 EIB 或商业融资额度下的债务契约。
        - 债务重组或救助融资；次级股权持有人遭受大幅减值或全部损失。
        - 欧洲 EV 需求低迷、电芯化学体系过时，或出现 Northvolt 式流动性危机。
        - 25% —— 资本密集型超级工厂爬坡通常对运营支出和资本支出高度敏感。
    notes: 概率和估值逻辑反映机构情景分析，基础是已验证的资本结构和执行依赖关系。
