  - id: FE001
    title: Verkor 一体化电池制造栈
    type: stack
    summary: Verkor 多层工业制造平台的架构概览，覆盖从原材料、实体超级工厂基础设施，到数字控制骨干和汽车客户整合。
    data:
      layers:
        - label: 第 1 层：上游活性材料与基材
          detail: 关键电池前驱材料的采购、精炼与认证
          modules:
            - label: 正极活性材料（CAM）
              detail: 高镍锂镍锰钴（NMC）配方
            - label: 负极材料
              detail: 高纯度天然及合成石墨基材
            - label: 集流体箔材
              detail: 电池级铝正极箔和铜负极箔
        - label: 第 2 层：核心实体制造运营
          detail: 从化学浆料到成品电化学电芯的三阶段转化流程
          modules:
            - label: 电极制造
              detail: 连续自动化浆料混合、精密狭缝涂布、干燥和辊压
            - label: 电芯组装
              detail: 精密电极极耳冲切、隔膜叠片、超声波焊接和封装
            - label: 电芯化成与后处理
              detail: 受控电化学生成、高温老化、脱气和分选
        - label: 第 3 层：数字自动化与质量控制
          detail: 与 Capgemini 合作打造的数据驱动工业操作系统
          modules:
            - label: 工业 IoT 与 MES 集成
              detail: 统一采集遥测数据，连接产线 PLC、SCADA 和工厂 MES 系统
            - label: 机器学习分析
              detail: 预测性工艺调校、视觉缺陷识别和减废算法
            - label: 合规与可追溯性
              detail: 自动化数字批次追踪、ISO 9001/27001 控制和欧盟电池护照准备
        - label: 第 4 层：下游部署与循环利用
          detail: 商业客户整合、固定式储能和材料回收
          modules:
            - label: OEM 车辆整合
              detail: 向 Renault Group 和 Alpine 电动车平台批量供货
            - label: 固定式储能应用
              detail: 集装箱式公用事业级和商业 BESS 部署
            - label: 闭环回收
              detail: 产线内生产废料回收，以及与合作伙伴开展湿法冶金金属回收
        - label: 第 5 层：主超级工厂实体基础设施
          detail: 敦刻尔克公用事业规模生产基地，设计初始年产能为 16 GWh
          modules:
            - label: 洁净与干燥室环境
              detail: 超低露点大气控制，支持无水分电解液处理
            - label: 高压变电站
              detail: 由 RTE 接入的专用 225 kV 电网变电站，用于高负载运营
            - label: 自动化物流与仓储
              detail: 港口连接的自动化物料运输和成品电芯处理
        - label: 第 6 层：工业验证与试点运营
          detail: 位于格勒诺布尔的 Verkor Innovation Centre（VIC），专用于灵活认证
          modules:
            - label: 150 MWh 试点原型线
              detail: 小批量样品制造，满足客户规格冻结要求
            - label: 高级分析研发实验室
              detail: 化学分析、降解建模和无损检测套件
            - label: Ecole de la Batterie 培训
              detail: 技术劳动力技能培养和操作员认证中心
    approximationNotes: 图示综合了 Verkor 发布的工业运营模式、供应商合作关系和 Capgemini 数字架构。
    claimRefs:
      - CE002
      - CE006
      - CE008
      - CE010
      - CE012
  - id: FU001
    title: Verkor 客户商业化与承购历程
    type: journey-map
    summary: Verkor 汽车客户管线中的商业认证、合同执行和工业扩张阶段。
    data:
      items:
        - label: 技术评估与股权合作
          touchpoints:
            - Renault Group 持有 Verkor 股权（2021 年 6 月）
            - 在 Verkor Innovation Centre（格勒诺布尔）测试
            - A 样品概念冻结，满足 OEM 技术规格
        - label: 商业承购签约
          touchpoints:
            - 执行有约束力的长期商业合作（2023 年 4 月）
            - 多年期、每年 12 GWh 的数量承诺
            - 确保供应可追溯性并符合低碳合规要求
        - label: 试点验证与产线投产
          touchpoints:
            - Renault 工程团队验证 A 样品
            - VIC 格勒诺布尔试点线 24/7 验证（100-150 MWh 产能）
            - 敦刻尔克超级工厂投产并完成产线平衡
        - label: 批量工业交付
          touchpoints:
            - 首批商业电池包供应至 Alpine A390（2026 年）
            - 敦刻尔克 1 号产线爬坡，目标初始年产能 16 GWh
            - 敦刻尔克工厂第二条产线投产
        - label: 多客户扩张前景
          touchpoints:
            - 拓展至商业移动和固定式储能
            - 锁定第二批 OEM 承购协议
            - 到 2030 年将敦刻尔克工业区产能扩大至 50 GWh
        - label: 长期工业成熟
          touchpoints:
            - 通过 DROPS 系统整合闭环废料回收
            - 借助合作伙伴生态直接供应回收的正极矿物
            - 在 Grand Port Maritime 各地运营多座超级工厂
    approximationNotes: 这些阶段概括了从早期与 Renault 联合开发到商业超级工厂交付的已验证商业时间线里程碑。
    claimRefs:
      - CU002
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
