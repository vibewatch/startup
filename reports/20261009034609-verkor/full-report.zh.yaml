  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、许可与环境合规暴露
        blocks:
          - type: paragraph
            body: >-
              Verkor 所处的是监管密集的欧洲工业生态，化学品处理、能源消耗和环境披露决定设施能否运营。公司正在应对 European Union Battery Regulation（EU
              2023/1542）逐步实施，该法规要求严格的全生命周期碳足迹上限和强制再生材料配额。同时，European Corporate Sustainability Reporting
              Directive（CSRD）义务因 2025 年 4 月 Omnibus delegated act 而延至 2028 年覆盖 2027
              财年，管理层因此暂时有时间建立可审计的非财务控制。敦刻尔克设施必须严格遵守法国 ICPE 工业与化学环境安全许可，包括与地方政府签订的废水排放协议及危险材料围堵要求。长期合规暴露还包括 EU Critical
              Raw Materials Act；该法案会对欧洲供应链的国内加工和回收目标进行基准管理，而上游矿产精炼产能仍受限制。
            claimRefs:
              - CR003
              - CR005
              - CR009
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR005
              - CR009
              - CR013
      - number: '7.2'
        title: 工业执行、合格率爬坡与供应链脆弱性
        blocks:
          - type: paragraph
            body: >-
              Verkor 面临的核心运营风险，是从 Grenoble 150 MWh 的 Verkor Innovation Centre（VIC）试验设施爬坡到敦刻尔克超级工厂商业规模。Verkor 虽在 2026 年 8
              月 2026
              宣布第二条生产线投产并交付早期电芯，但欧洲早期超级工厂历来会在初始制造阶段遭遇严重合格率折损和较高废品率。高废品率会迅速消耗运营流动性并抬高单位电芯成本，欧洲电池行业同行的破产已证明这一点。此外，Verkor
              的高镍电极配方依赖专业化关键矿产供应链，需要与 Renault 协同采购锂、镍和钴。上游精炼、国际正极材料运输或高精度电池制造设备进口的任何中断，都会带来即时投产延误和成本超支风险。
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR012
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
