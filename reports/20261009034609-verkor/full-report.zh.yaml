      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Verkor 在 2026 年 8 月宣布了一次重要的领导交接：此前担任 Deputy Managing Director and COO 的 Laurent Debrue 将于 9 月 1 日出任
              President and CEO；联合创始人兼 CEO Benoit Lemaignan 则转任 Supervisory Board
              副主席。该安排保留创始人参与，同时把经营权交给负责工业化和早期爬坡的高管。不过，所分配证据中最新的详细治理名单仍是公司 2024 年可持续发展报告。报告称 Supervisory Board
              有八名成员、三名观察员和五个专业委员会，Executive Committee 有七名成员。由于当前官网提到创始人顾问，却没有完整披露交接后的董事会和管理层名单，委员会成员、保留事项和继任梯队仍需直接确认。
            claimRefs:
              - CO006
              - CO007
