              - CR012
      - number: '7.3'
        title: 交易对手依赖、供货集中度与资本结构
        blocks:
          - type: paragraph
            body: >-
              Verkor 的财务架构由 €1.2 billion 的优先无追索权绿色项目债务支撑，该债务由 16 家商业银行和 European Investment Bank 提供支持，另有 Caisse des
              Dépôts 的 €150 million 次级债务。无追索权结构使公司发起人的资产负债表免于直接承担设施追索，但贷款方很大程度上是基于 Renault Group
              长期商业供货协议批准债务银团，该协议覆盖敦刻尔克初始 16 GWh 产量的大部分。这造成结构性的单一客户集中：欧洲电动车采用停滞或 Renault
              车辆组装量下降，都会压缩可用于强制偿债的现金流。此外，EnerSys 潜在美国设施的非约束性探索性 MOU 等次级合作没有法律交易确定性，不能依靠它们分散近期欧洲商业风险。
            claimRefs:
              - CR001
