    title: 欧洲锂离子电池需求与规模层级（2030 年展望）
    type: pyramid
    summary: 从 2030 年全球及欧洲 EV 电池需求，逐层拆解至 Verkor 敦刻尔克超级工厂的初始产能分配。
    data:
      items:
        - label: 全球 EV 电池需求（2030 年展望）
          value: '>3,000 GWh (>3 TWh)'
          detail: 按 IEA 展望，电动出行各领域预计的全球总需求。
        - label: 欧洲 EV 电池需求（2030 年 TAM）
          value: '>790 GWh/year'
          detail: 由欧盟《净零工业法案》和排放要求驱动的区域可服务市场。
        - label: 欧洲 EV 电池需求（2024 年基准）
          value: 180 GWh/year
          detail: 基准安装需求，构成截至 2030 年约 27.9% CAGR 的增长轨迹。
        - label: 已承诺的欧洲产能管线
          value: ~4x 2024 Base
          detail: 欧洲各地已宣布、正在建设或已作出 FID 的超级工厂项目。
        - label: Verkor 敦刻尔克初始产能（目标 SOM）
          value: 16 GWh/year
          detail: 初始 4 条产线的产能，每年最多覆盖 300,000 辆汽车。
        - label: Verkor 合同承购量（Renault 承诺）
          value: 12 GWh/year
          detail: 锚定型长期商业合同，为基础产线锁定订单。
    approximationNotes: 市场规模数据来自 Verkor 2024 年年报引用的 IEA《全球 EV 展望》；公司数据取自 EIB 和企业项目融资公告。
