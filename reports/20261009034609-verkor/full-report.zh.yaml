  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 机构决策链条，串联资本规模、运营证明、股权结构表悬垂和最终的“继续研究”立场。
    data:
      nodes:
        - id: capital-scale
          label: 资本规模：通过股权、EIB 贷款和补贴锁定 €3B+ 融资
        - id: pilot-validation
          label: 试点验证：VIC 自 2023 年起在格勒诺布尔运营
        - id: operational-proof
          label: 运营爬坡：敦刻尔克 2 号产线投产并交付首批电芯
        - id: market-headwinds
          label: 市场背景：EV 补贴退出与激烈的电芯价格竞争
        - id: seniority-overhang
          label: 结构性风险：债务优先级高、普通股未定价、客户集中
        - id: decision-stance
          label: 立场：建议继续研究，并对偏高估值保持纪律
      edges:
        - from: capital-scale
          to: pilot-validation
        - from: pilot-validation
          to: operational-proof
        - from: operational-proof
          to: market-headwinds
        - from: market-headwinds
          to: seniority-overhang
        - from: seniority-overhang
          to: decision-stance
    approximationNotes: 按顺序展示从证据到最终投资立场的分析决策门槛。
