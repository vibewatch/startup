      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: “单一客户陷阱”：依赖 Renault 供货
            body: Renault Group 的锚定供货为获得 €1.2B 无追索权优先项目债务提供关键需求可见度，但也造成严重商业集中。Renault 下调电动车销量目标，会直接危及债务偿付覆盖率。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR014
          - type: callout
            title: 资本开支超支情景下的资本结构脆弱性
            body: >-
              Northvolt 的警示性破产轨迹表明，欧洲超级工厂经济性几乎无法容忍工业废品或投产延误。Verkor 的 €1.2B
              债务带有严格的无追索权项目契约；如果商业合格率落后于预测，爬坡期间的运营现金消耗可能迫使公司注入稀释性股权。
            calloutType: risk
            claimRefs:
              - CR001
              - CR004
              - CR014
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、立场与建议背景
        blocks:
          - type: paragraph
            body: >-
              Verkor 以法国旗舰低碳锂离子超级工厂项目的身份，呈现出有吸引力的工业叙事；公司已通过股权轮、银行银团和主权开发工具获得超过 €3B 的承诺融资。Renault Group 的锚定汽车需求、Grenoble
              的 Verkor Innovation Centre
              试验设施，以及敦刻尔克超级工厂的投产，使公司跨过了关键早期工业门槛。然而，电芯制造本质上资本密集且高度依赖执行，资本开支上升、合格率稳定化难题和全球价格竞争，都可能迅速侵蚀次级股权。更广泛的欧洲电池制造生态已承受明显压力，说明主权工业支持和
              公告中的资本承诺并不能保证风险投资级股权回报。因此，在可验证的生产合格率和透明股权条款出现前，我们仍建议继续研究，风险高，估值偏紧。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV010
              - CV015
      - number: '8.2'
        title: 资本结构、估值现实与稀释悬置
        blocks:
          - type: paragraph
            body: >-
              要评估 Verkor 的隐含股权估值，必须拆开其混合融资基础。公告称 Series C 融资超过 €2 billion，后续项目贷款额度为 €1.3 billion；但其中绝大多数是补贴银行贷款、European
              Investment Bank 债务工具和政府开发补助，而不是纯普通风险股权。独立私募市场平台指出，二级市场定价和正式 post-money valuation marks
              仍未披露，流动性被归为有限。项目融资债务分层、设备租赁抵押和机构优先权都位于普通股之上；因此任何利润率压缩或爬坡延迟，都会直接吸收股权价值。如果敦刻尔克需要额外资本，从初始生产线扩展到完整名义产能，投资者将面对显著的清算优先权悬置和未来稀释风险。
            claimRefs:
              - CV002
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV008
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: 情景投资判断、可比对象与尽调标准
        blocks:
          - type: paragraph
            body: >-
              在乐观、基准和悲观情景下评估 Verkor，会看到由运营合格率、汽车供货执行和全球电芯价格动态驱动的显著不对称性。乐观情景中，Verkor 在敦刻尔克成功达到设计产能，把工业供货合同从 Renault 扩展到
              EnerSys
              等伙伴，并以更高估值倍数进入欧洲公开股权市场或接受主权整合。基准情景中，运营爬坡稳步推进，但利润率压缩限制运营现金创造，迫使公司持续依赖项目债务和私人资本注入。悲观情景中，电池废品率持续偏高，电动车供货放缓，高额偿债触发重组，早期股权类别遭到严重稀释或被清零。在经审计的财务披露、单位电芯制造成本和明确普通股权利出现前，纪律严明的投资者应把
              Verkor 视为需要密切跟踪的资产，而不是可立即投资的股权标的。
            claimRefs:
              - CV003
              - CV005
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 资本结构优先级掩盖次级股权风险
            body: >-
              公告中的超过 €3B 融资数字似乎显示机构共识强劲，但潜在股权共同投资者必须认识到，已承诺资本的大部分是 EIB
              项目债务、法国政府补贴和资产抵押银行融资，它们的偿付顺序高于普通股。在无法取得普通股定价、清算优先权级联和敦刻尔克经审计制造合格率的情况下，无法支持风险投资或成长股权估值判断。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV010
