              - CO006
              - CO007
      - number: '1.3'
        title: 资本架构与利益相关者影响
        blocks:
          - type: paragraph
            body: >-
              Verkor 的资本结构高度依赖政策资金和项目融资。公司在 2023 年 9 月宣布一项超过 €2 billion 的方案，包括至少 €850 million 的 Series C 股权、€600 million
              的 EIB 债务支持和约 €650 million 的法国补贴，并说明当时适用的审批和条件。此轮融资引入 Macquarie 和 Meridiam，并与 Renault、EIT InnoEnergy 及
              Bpifrance's SPI fund 等战略和公共投资者并列。2024 年可持续发展报告随后称 €1.3 billion 的绿色贷款已经完成，首座超级工厂和 innovation centre
              的已落实融资超过 €3 billion。“已落实融资”混合了股权、债务和补贴承诺，不能理解为可用现金、企业估值或无负担跑道。所分配的公开记录未披露股权结构表比例、优先权条款、提款条件和契约。
            claimRefs:
