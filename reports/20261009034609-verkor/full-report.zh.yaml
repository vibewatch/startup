      - number: '3.2'
        title: 能力与商业位置
        blocks:
          - type: paragraph
            body: >-
              Verkor 披露的运营足迹包括 Verkor Innovation Centre 的 150 MWh 试验线，以及设计产能为 16 GWh 的敦刻尔克超级工厂。其 2026 年 8 月
              新闻页称敦刻尔克第二条生产线已投产，首批完全在厂内生产的电池已交付，但这仍是公司发布的证据，未披露利用率、汽车资格合格率、废品率或单位成本。Renault 是最清晰的商业锚点：Macquarie
              描述了一项长期协议，Renault 计划承接大部分初始产量，面向更大型和高端电动车；一则行业汇总则称绑定供货量为 12 GWh。2024 年报告
              还称新增了另一家客户，却未说明其身份或供货量。这些事实提高了需求可见度，但不能证明客户已广泛分散或价格具备竞争力。
            claimRefs:
