      - number: '6.3'
        title: 客户集中度、采购动态与供货韧性
        blocks:
          - type: paragraph
            body: >-
              Verkor 的核心商业脆弱点是收入极度集中于 Renault Group。12 GWh 的年度绑定供货量相当于敦刻尔克 Gigafactory 初始 16 GWh 名义产能的 75%，因此 Verkor
              高度暴露于 Renault 的电动车销量兑现、车型上市时点和更广泛的零售需求波动。European Investment Bank
              分析师和贷款方都指出，欧洲电动车需求会受到补贴退坡和全洲充电基础设施铺设不均的影响。虽然 Verkor 的多层治理包括 Renault 在监事会中的代表，形成相互协同，但 Verkor
              尚未披露第二份同等规模的绑定连续汽车供货协议。如果高端市场电动车采用放缓，或 Alpine 销量低于预期，Verkor 缺少多元化的高销量汽车供货缓冲。
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: 展示项
        blocks:
          - type: callout
            title: 高度依赖单一锚定 OEM
            body: >-
              Verkor 向 Renault Group 承诺的 12 GWh 占敦刻尔克初始 16 GWh 产能的四分之三。该合同为超过 €3 billion 的公共和私人资本提供关键基础需求，但也让 Verkor
              暴露于二元客户风险。车型上市延误、Renault 下调电动车生产目标，或技术集成摩擦，都会直接威胁工厂利用率和运营现金流。
            calloutType: risk
            claimRefs:
              - CU005
              - CU010
