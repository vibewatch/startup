      - number: '4.2'
        title: 资本结构与充足性
        blocks:
          - type: paragraph
            body: >-
              资本结构规模可观，但高度项目化。2023 年，利益相关者披露至少 €850 million 的 Series C、约 €650 million 的法国补贴和 €600 million 的 EIB
              债务支持。后续融资由 16 家商业银行和三家公共银行完成超过 €1.3 billion 的绿色融资，其中包括 €961 million 的商业银行优先贷款；Mercom 报告其中 €282 million
              有政府担保，另有过桥贷款和次级贷款。Verkor 和 Mercom 称，敦刻尔克超级工厂及 Grenoble 创新中心已落实超过 €3
              billion。这是为特定资产筹集或承诺的资金，不代表报告日可用的不受限制现金。留存记录没有当前现金余额、提款计划、契约测试、偿债情况、营运资金额度、消耗速度或剩余建设需求。因此，不能从融资总额判断资本是否充足。
            claimRefs:
