              - CM008
              - CM009
      - number: '2.3'
        title: 买方分层、预算归属与战略采用约束
        blocks:
          - type: paragraph
            body: >-
              汽车领域的采用由 OEM 中央动力总成采购部门和车型平台工程负责人主导，特点是多年开发周期、严格的 A-sample 到 C-sample 资格测试，以及长期双边量产供货协议。电池占电动车总生产成本的 30% 至
              50%，使电芯采购成为决定车企车型平台盈利能力的最大单项成本。Renault Group 的共同投资和 12 GWh 供货承诺说明，战略工业合资和股权关联的供应合作也在强化商业牵引。但更广泛的 OEM
              层级仍受多重约束：2023 年末
              德国等主要市场取消消费者电动车购车激励，法国、德国和荷兰的充电基础设施分布不均，关键正极矿产原料价格波动，以及亚洲电芯厂商凭借规模和一体化供应链带来的成本竞争，都在挤压新生的欧洲超级工厂。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 欧洲市场需求波动与补贴收缩
            body: >-
              欧洲电动车市场正受到政治不确定性、高资本成本和 2023 年末德国等关键市场终止消费者购车补贴的拖累。Northvolt 在 2024 年末申请 Chapter
              11，加上这些宏观因素，进一步提高了投资者对资本密集型欧洲超级工厂爬坡的审视。
            calloutType: risk
            claimRefs:
              - CM013
              - CM014
          - type: callout
            title: 下游商业锚定可降低风险
            body: >-
              与承担未对冲产能利用率风险的纯市场化电池初创公司不同，Verkor 的运营模式已将敦刻尔克初始 16 GWh 产能中的 12 GWh 预先分配给 Renault
              Group，采用双边供货协议。这种直接的汽车合作关系显著降低了早期制造爬坡期间的商业消化风险。
            calloutType: insight
            claimRefs:
              - CM009
              - CM011
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              相关格局不只是获得风险投资的欧洲超级工厂名单。车企可以签约规模化亚洲供应商、选择另一家欧洲生产商、与下一代开发商合作、在多个供应商之间分散采购，或采取更封闭的自供策略。历史报道称亚洲企业主导电池供应，Verkor
              自身的 2024 年可持续发展报告也将中国电池和电动车制造商的激烈竞争列为明确挑战。同一报告记录，欧洲本土先行者 Northvolt 在 2024 年末进入美国 Chapter 11
              保护程序，投资者谨慎程度随之上升。Tracxn 的对比集合还包括成熟的汽车锂离子制造商 A123 Systems，以及 QuantumScape 和 SES
              等技术开发商，说明数据库定义的同行并非都是真正同类的量产竞争者。因此，比较应区分当前电芯供应、新兴化学体系、欧洲本地化和自制或外购替代方案，而不能假定存在单一同质市场。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
