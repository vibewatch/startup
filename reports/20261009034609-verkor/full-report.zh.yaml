  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、类别范围与行业分类
        blocks:
          - type: paragraph
            body: >-
              Verkor
              是低碳锂离子电芯和模组的专门开发商与制造商，产品面向汽车电动出行和公用事业级固定式储能。其可服务支出的边界包括先进正极配方、专有电芯设计、电芯制造，以及乘用电动车和商用车动力系统的模组封装。该类别明确排除上游原矿开采、电芯制造前的活性材料化学合成、由
              OEM 直接负责的电池包级车身结构集成、终端车辆组装，以及独立的工业后回收基础设施。固定式电网储能等相邻领域可以带来次级多元化，但乘用电动车才是 Verkor 敦刻尔克首批生产线的基础商业需求来源。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 市场规模视角：全球轨迹、欧洲需求与自用产能
        blocks:
          - type: paragraph
            body: >-
              根据 Verkor 2024 年披露中引用的 International Energy Agency（IEA）Global EV Outlook，全球电动车电池需求预计将从 2023 年的 1 TWh 增至
              2030 年的超过 3 TWh，扩大三倍。欧洲年需求预计从 2024 年的 180 GWh 飙升至 2030 年的超过 790 GWh，预计 CAGR 约为
              27.9%。在法国，国家低碳战略（SNBC）规定电动车应占新车销量的 66%（2030 年）和 100%（2035 年），法国道路上的电动车在全部车队中的渗透率也将从 2024 年初的 2.2% 升至 2030
              年的 15%。相对于 790 GWh 的区域 TAM，Verkor 规划的敦刻尔克 Gigafactory 初始名义产能为每年 16 GWh，相当于预计 2030 年欧洲电动车电池需求约 2.0%
              的初始可服务规模，其中 12 GWh 分配给与 Renault Group 的长期商业供货。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
