      - number: '4.3'
        title: 利润率路径与财务判断
        blocks:
          - type: paragraph
            body: >-
              主要利润率风险来自工业环节，而不是软件式业务。Verkor 将原材料和设备依赖、技能供应，以及监管驱动的资本和生产成本列为重大约束。2024 年可持续发展报告
              还称，由于报告期内超级工厂尚未投产，全公司绩效指标依赖理论假设；这限制了它们对稳态利润模型的参考价值。同一报告记录 Northvolt 的 Chapter 11
              申请令投资者更加谨慎，提醒我们融资和签约需求本身不能证明合格率稳定或爬坡经济性足以维持偿付。财务判断因此是混合的：签约需求、实体投产和已承诺的项目资金是优势；收入质量、客户集中度、合格率、废品率、毛利率、现金转化、债务余量和跑道仍未解决。投资判断需要管理账、客户合同、生产仪表盘和融资协议，不能从产能或融资公告外推。
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: 展示项
        blocks:
          - type: callout
            title: 融资不是现金跑道
            body: 超过 €3 billion 的超级工厂和创新中心融资报道，并不能说明当前不受限制的现金、剩余提款额度、契约余量或经营跑道。把公告总额当作流动性，会高估资本充足性。
            calloutType: risk
            claimRefs:
              - CI004
              - CI016
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 电芯产品组合与技术规格
        blocks:
          - type: paragraph
            body: >-
              Verkor 专注于高性能低碳锂离子电芯和多电芯模组的工业设计与规模化制造，主要面向高端电动车和固定式储能系统。公司明确采取“fast follower”技术路线，有意部署成熟的锂离子化学体系，主要是高镍 NMC
              正极配方配合石墨负极，而不是率先押注未经验证的固态或新型活性材料。该策略优先追求快速工业化、汽车验证和高制造合格率，而非实验室理论能量密度。公司电芯开发从最初 A-sample 概念冻结推进到战略锚定客户
              Renault Group 的正式验证，最终在 2024 年由试验设施生产并商业交付超过 30,000
              个电芯。电芯封装规格可无缝集成到汽车电池包、结构式车身舱体和商用集装箱储能架，同时满足严格的机械、热和电气耐久标准。
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
      - number: '5.2'
        title: 工业足迹与三阶段制造模式
        blocks:
          - type: paragraph
            body: >-
              Verkor 的工业运营分布在法国两座专用设施：Grenoble 的 Verkor Innovation Centre（VIC）和敦刻尔克的商业超级工厂。Grenoble 基地约有 10,000
              平方米工业地面空间，试验线年产能为 150 MWh，用于原型、小批量制造、化学体系优化和员工培训。位于法国北部“Battery Valley”的敦刻尔克 Gigafactory
              是平台扩张到公用事业规模的资产，初始名义年产能设计为 16 GWh，长期场地扩展潜力最高 50
              GWh。实体电芯制造遵循标准三阶段工业流程：电极生产（浆料混合、精密涂布、干燥和辊压）、电芯组装（电极冲切、叠片、超声极耳焊接、软包或罐体封装，以及真空电解液干燥和注液），以及电芯收尾（电气化成、高温老化和质量分级）。敦刻尔克工厂配备由电网运营商
              RTE 接入的 225 kV 高压变电站，并与 EDF 签有 12 年期 Nuclear Power Allocation Contract，以锁定低碳基荷电力。
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE002
            claimRefs:
              - CE006
              - CE007
              - CE008
      - number: '5.3'
        title: 数字架构、自动化与运营整合
        blocks:
          - type: paragraph
            body: >-
              为加快制造爬坡并降低规模化阶段废品堆积的灾难性风险，Verkor 采用与 Capgemini 通过战略工业合作共同开发的“digital by design”运营框架。这一技术底座把车间自动化（SCADA
              和可编程逻辑控制器）、Manufacturing Execution
              Systems（MES）、企业资源规划（ERP）和机器学习遥测接入统一数据架构。电极涂层厚度、辊压辊隙压力、真空含水量和化成循环阻抗等实时传感器数据持续流入系统，用于优化设备表现、侦测异常和追踪数字批次谱系。该架构把
              Grenoble 试验线直接连接到敦刻尔克高速生产线，实现闭环参数调节并降低生产波动。公司还利用这套数字基础设施准备符合 EU Battery Passport
              要求的机制，把从摇篮到工厂大门的碳追踪、材料来源和安全认证嵌入组件元数据。
            claimRefs:
              - CE008
              - CE009
              - CE010
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE006
              - CE008
              - CE010
              - CE012
      - number: '5.4'
        title: 竞争差异化、质量治理与规模化风险
        blocks:
          - type: paragraph
            body: >-
              Verkor 的主要竞争差异化来自欧洲生产自主权、低碳制造强度，以及与欧洲汽车原始设备制造商（OEM）的深度战略协同。利用法国脱碳后的核电与可再生能源组合，公司计划到 2032
              年把电芯从摇篮到工厂大门的碳足迹降至每 kWh 电芯容量 30 kg CO2e，约为典型中国煤电电芯制造基准的四分之一。质量和信息治理由通过认证的 ISO 9001 与 ISO 27001 体系支撑，并规划汽车
              IATF 16949、工业 IEC 62443 和 NIS2 网络安全标准。尽管有这些制度控制，Verkor 仍面临急迫的规模化运营风险。全球电池超级工厂在最初多吉瓦爬坡阶段，废品率通常会维持在 20% 至
              40%，并持续较长时间。此外，公司还暴露于锂、钴、镍和天然石墨等关键投入品的原料开采风险，以及上游设备交付延误和 Northvolt 重组所体现的技术执行障碍。
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE009
              - CE010
              - CE013
              - CE014
      - number: '5.5'
        title: 展示项
        blocks:
          - type: callout
            title: Fast-Follower 策略降低化学体系研发踩坑
            body: >-
              Verkor 选择将经过验证的高镍 NMC
              软包和方形电芯商业化，而不是以专有固态或新型活性材料跳过市场，这显著降低了早期技术失败风险。通过统一采用经过验证的化学配方，公司把工程资金集中到制造合格率优化、数字流程自动化和低碳运营执行上。
            calloutType: insight
            claimRefs:
              - CE002
              - CE003
          - type: callout
            title: 超级工厂废品率与投产瓶颈
            body: >-
              任何电池超级工厂初创企业的核心脆弱点，都是从机械完工到稳定商业合格率之间漫长的爬坡曲线。设备校准、干燥室湿度控制和电极涂层均匀性往往导致初期废品率偏高，消耗营运资金并挤压供货协议，这也说明敦刻尔克分阶段投产期间必须严格监控合格率。
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
              - CE014
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与价值主张
        blocks:
          - type: paragraph
            body: >-
              Verkor 将可服务市场分为乘用电动车、商用车、非道路工业机械和公用事业级固定式储能。在乘用车电动出行领域，Verkor
              将自身定位为高性能镍锰钴（NMC）电芯和模组的上游供应商，把电池包集成和最终整车组装留给原始设备制造商（OEM）。核心价值主张包括高能量密度、低内阻快充，以及大幅降低的碳足迹；公司称，借助法国低碳核电电网和本地工业余热网络，其碳足迹比中国同类产品低四至五倍。除乘用车外，Verkor
              还通过 Startec Energy 等工业合作伙伴，面向细分应用开发可回收电池包，布局固定式储能和专业化出行。
            claimRefs:
