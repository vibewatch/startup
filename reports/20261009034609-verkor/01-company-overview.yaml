callouts:
  - calloutType: risk
    title: Secured capital is not available cash
    body: >-
      Verkor's reported total combines equity, debt and subsidy commitments with
      different conditions and seniority. Underwriting requires the cap table,
      draw schedule, covenant package, subsidy milestones and current liquidity.
    claimRefs: [CO011, CO013]
  - calloutType: insight
    title: Physical progress is ahead of public operating disclosure
    body: >-
      Commissioned lines and first on-site deliveries indicate tangible ramp
      progress, while yield, scrap, utilization, customer acceptance and unit
      economics remain undisclosed.
    claimRefs: [CO015, CO016]
