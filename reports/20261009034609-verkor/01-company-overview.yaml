slug: verkor
runDate: "2026-10-09"
company:
  name: Verkor
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Verkor has moved from a July 2020 founding to a company-reported large-scale
    production phase, with more than 1,000 employees, two strategic sites and a
    16 GWh annual-capacity target. Its Renault-linked demand and more than €3
    billion of reported secured financing support credibility, but current
    valuation, liquidity, revenue, ramp yield and post-transition governance
    remain material diligence gaps.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Verkor is a Grenoble-based French battery manufacturer founded in July
      2020. Its model combines the Grenoble Verkor Innovation Centre, which the
      company describes as its pilot-line, R&D and headquarters site, with a
      Dunkirk gigafactory intended for mass manufacture. The current corporate
      site describes low-carbon lithium-ion cells and modules for passenger and
      commercial vehicles, off-road mobility and stationary storage, so the
      business is an industrial supplier rather than a software-like recurring
      revenue company. The company reports more than 1,000 employees and a 16
      GWh target annual cell-production capacity. Those metrics establish
      physical scale, but neither is a proxy for utilization, qualified output,
      revenue or cash generation. The current public evidence also does not
      disclose revenue, margins or a customer count suitable for a cover metric.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Verkor announced a consequential leadership handoff in August 2026:
      Laurent Debrue, previously Deputy Managing Director and COO, was to become
      President and CEO on 1 September, while co-founder and CEO Benoit
      Lemaignan was to move to the Supervisory Board as vice-chairman. That
      arrangement preserves founder involvement while transferring operating
      authority to the executive who oversaw industrialisation and early
      ramp-up. The latest detailed governance roster in the assigned evidence,
      however, is the company's 2024 sustainability report. It described an
      eight-member Supervisory Board with three observers and five specialist
      committees, alongside a seven-member Executive Committee. Because the
      current site names founder advisers but does not provide a complete
      post-transition board and executive roster, committee membership,
      reserved matters and succession depth require direct confirmation.
    claimRefs: [CO006, CO007]
    tableRefs: [TO002]
  - id: capital-and-stakeholders
    title: Capital architecture and stakeholder influence
    body: >-
      Verkor's capital stack is unusually policy- and project-finance-heavy. In
      September 2023 the company announced a package exceeding €2 billion,
      comprising at least €850 million of Series C equity, €600 million of EIB
      debt support and about €650 million of French subsidies, with stated
      approvals and conditions applying at that date. The round brought
      Macquarie and Meridiam alongside strategic and public investors including
      Renault, EIT InnoEnergy and Bpifrance's SPI fund. The 2024 sustainability
      report subsequently said a €1.3 billion green loan had closed and that
      secured financing for the first gigafactory and innovation centre exceeded
      €3 billion. "Secured financing" combines equity, debt and subsidy
      commitments; it must not be read as cash available, enterprise valuation
      or unencumbered runway. Cap-table percentages, preference terms, draw
      conditions and covenants are not disclosed in the assigned public record.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO003]
  - id: industrial-milestones-and-risk
    title: Industrial milestones and diligence boundary
    body: >-
      The milestone record shows rapid progression from founding through the
      Renault partnership, pilot-line build-out, large financing rounds and the
      December 2025 gigafactory inauguration. By August 2026, Verkor said the
      Dunkirk site's second production line had been commissioned and that the
      first batteries produced entirely on-site had been delivered. This is
      stronger evidence of physical progress than an announced construction
      schedule, but it remains company-issued and does not disclose qualified
      yield, scrap, utilization, customer acceptance or production economics.
      The EIB's own project narrative underscores that battery megaprojects face
      volatile EV demand and raw-material prices alongside technology, market
      and construction risks. No precise valuation is supportable from this
      pool, and no absence-of-incident conclusion should be drawn from the
      limited adverse record. Investment underwriting therefore still depends
      on operational data-room evidence and financing documents.
    claimRefs: [CO008, CO009, CO010, CO011, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
