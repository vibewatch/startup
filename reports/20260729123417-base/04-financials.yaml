  - id: financial-gaps
    title: Financial Gaps and Underwriting Blockers
    body: >-
      Base Power presents a significant information asymmetry between what investors appear to know and
      what is publicly verifiable. Top-line traction metrics (revenue estimates, deployment pace, customer
      count, MWh deployed) are available through analyst sources and press releases, but every unit
      economics metric that would confirm the business model—gross margin, EBITDA, battery utilization
      rate, actual arbitrage revenue per MWh dispatched, contribution margin per customer, and CAC/payback
      data—is private and unverified. This creates a category of "company-claimed" unit economics
      (3.5-year payback, near-zero churn) that are plausible and consistent with the structural model but
      are not independently corroborated.


      Several specific financial risks deserve emphasis for underwriting. First, ERCOT wholesale revenue
      depends on market structure remaining favorable: the ADER program is still maturing (only 15 MW
      actively dispatched as of mid-2025 across all participants), and QSE fees, distribution tariffs on
      charging, and telemetry costs create a floor threshold of approximately 15–20 MW before aggregation
      economics are attractive. Second, the regulated-market expansion path (El Paso Electric pilot, Illinois)
      strips the retail margin and wholesale arbitrage layers, leaving only utility capacity payments, which
      have not been demonstrated sufficient for a 4-year payback. Third, battery manufacturing ramp is
      operationally risky: Gen 3 production at Factory One is expected to be "difficult" through mid-2026
      per the CEO, and cost overruns or delays would directly compress the margin available to finance
      fleet deployment at scale.


      The 80%/20% grid-versus-backup allocation, while disclosed in contract terms, creates an ongoing
      reputational and regulatory risk: homeowners expecting full backup capability may discover only
      20% charge available during a real outage if a grid trading event has occurred within hours prior.
      This mismatch between marketed value proposition ("48-hour backup") and actual available backup
      under normal operating conditions is the most commonly cited adverse concern in independent homeowner
      reviews and could generate regulatory scrutiny if PUCT revisits consumer protection rules for
      distributed energy resource aggregators.
