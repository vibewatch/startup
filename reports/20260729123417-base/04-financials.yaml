  - id: capital-adequacy
    title: Capital Adequacy and Financing Architecture
    body: >-
      Base Power has raised approximately $1.3 billion in total equity financing across its first two
      and a half years of operation, positioning it as one of the best-capitalized early-stage distributed
      energy platforms in the United States. The April 2025 Series B closed at $200 million, co-led by
      Addition, Andreessen Horowitz, Lightspeed Venture Partners, and Valor Equity Partners, with
      participation from Thrive Capital, Altimeter, and others. Six months later, the October 2025 Series C
      closed at $1 billion led by Addition at a $3 billion pre-money / $4 billion post-money valuation,
      with new investors including CapitalG, Ribbit, Spark, BOND, and Lowercarbon alongside the full
      returning roster. Total disclosed funding now stands at approximately $1.3 billion. The company has
      not disclosed project finance or debt facilities, though the asset-heavy fleet model is structurally
      amenable to asset-backed financing analogous to solar lease securitization, which could extend
      runway significantly if accessed.


      The capital deployment rate is substantial. At the late-2025 pace of 20 MW per month—approximately
      800 batteries monthly at the 25 kWh tier—and a net cost of $7,000 per unit, Base Power was burning
      roughly $5–8 million per month on hardware alone before operating expenses. With $1 billion in
      fresh Series C proceeds and an estimated $12 million in 2025 revenue, the company has meaningful
      runway even at aggressive deployment targets but is not yet self-funding. The primary announced uses
      for Series C capital are: national expansion beyond Texas, construction of Factory One (former
      Austin American-Statesman site), planning for a second factory, and scaling Gen 3 battery production.
      The Austin Energy tolling agreement ($4.08M/year) and CoServ partnership (100 MW in Denton County)
      provide partial revenue visibility but remain a small fraction of the capital deployed.


      The financing architecture is pure equity today, meaning dilution risk is the primary capital-structure
      concern rather than debt covenants or refinancing triggers. However, the model's long-term scalability
      depends on either (a) reaching cash-flow breakeven from the existing Texas fleet, (b) accessing
      project-finance or securitization capital to fund fleet growth off-balance-sheet, or (c) continuing
      to raise equity at favorable valuations. Option (c) depends on maintaining the $4 billion post-money
      trajectory, which requires the 2026 $70 million revenue target to be met and gross margins to
      improve materially.
    claimRefs:
