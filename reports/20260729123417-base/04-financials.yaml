  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: unit-economics
      missingEvidence: >-
        Gross margin, EBITDA, contribution margin per unit, and segment-level P&L for retail
        electricity, lease fees, and wholesale arbitrage revenue streams
      whyItMatters: >-
        Without unit economics, the 3.5-year payback period and financial viability of the gentailer
        model cannot be independently verified; a negative-contribution revenue mix is possible
        at current scale
      diligencePath: >-
        Require audited or reviewed financial statements with revenue and cost broken down by
        stream; obtain data room access from management
      relatedQuestionRefs:
        - QI010
        - QI023

    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: >-
        Monthly burn rate, cash balance as of most recent quarter, and detailed use-of-funds
        breakdown for the $1 billion Series C
      whyItMatters: >-
        Capital runway is the primary near-term solvency constraint; without burn rate data,
        it is impossible to assess whether the Series C is sufficient to reach cash-flow breakeven
      diligencePath: >-
        Request cash flow statement, treasury balance, and 24-month financial model from management
      relatedQuestionRefs:
        - QI011
        - QI025

    - type: private-evidence-only
      severity: material
      topic: customer-acquisition
      missingEvidence: >-
        Customer acquisition cost broken down by channel (direct, homebuilder, utility partnership,
        organic) and associated payback contribution
      whyItMatters: >-
        CAC determines scale efficiency; if utility/homebuilder channel CAC is significantly lower
        than direct, the channel strategy materially affects how capital should be allocated
      diligencePath: >-
        Require sales and marketing spend by channel and conversion rate data from data room
      relatedQuestionRefs:
        - QI023

    - type: missing-source
      severity: material
      topic: regulated-market
      missingEvidence: >-
        Actual P&L or unit economics for the El Paso Electric pilot; utility capacity payment rate
        per kW-month from El Paso Electric
      whyItMatters: >-
        Without the El Paso pilot economics, the scalability of the B2B2C model in regulated
        markets—representing the majority of US territory—is entirely unproven
      diligencePath: >-
        Request El Paso Electric contract terms, utility capacity payment schedule, and pilot-to-date
        financial results from management
      relatedQuestionRefs:
        - QI026

    - type: private-evidence-only
      severity: material
      topic: revenue-recognition
      missingEvidence: >-
        Revenue recognition policy for installation fees, 36-month contracts, and utility tolling
        agreements; accounting method (accrual vs. deferred revenue treatment)
      whyItMatters: >-
        Front-loaded vs. deferred recognition materially affects reported revenue and timing of
        profitability; important for comparing reported $12M 2025 figure to economic performance
      diligencePath: >-
        Request accounting policy memo, auditor engagement letter, and audited or reviewed
        financial statements
      relatedQuestionRefs:
        - QI026

