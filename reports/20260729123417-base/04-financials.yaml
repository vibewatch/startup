runDate: "2026-07-29"
company:
  name: Base Power

chapter:
  number: 4
  title: Financials
  summary: >-
    Base Power operates a vertically integrated "gentailer" model that stacks three revenue streams—monthly
    lease fees, retail electricity margin, and ERCOT wholesale arbitrage—across a fleet of homeowner-sited
    batteries it permanently owns. Sacra estimates $12 million in 2025 annualized revenue scaling to a
    company-projected $70 million in 2026, but the model is profoundly capital-intensive: each battery
    costs the company roughly $7,000 net after tax credits, and ~$1.3 billion has been raised to finance
    a fleet whose unit payback depends entirely on unverified grid-services revenue. Gross margins,
    EBITDA, contribution margins, and burn rate are not publicly disclosed, leaving underwriting reliant
    on top-line proxies and analogical cost benchmarks.

sections:
  - id: revenue-model
    title: Revenue Model and Monetization Stack
    body: >-
      Base Power's revenue architecture is deliberately layered across four distinct streams, each serving
      a different financial function. The first and thinnest layer is the homeowner lease fee: a one-time
      installation charge of $695 (25 kWh) or $995 (50 kWh) plus a monthly subscription of $19 or $29
      depending on battery size, creating a predictable but modest recurring cash flow. At $228–$348 per
      year in subscription revenue per household, these fees alone would imply a 20+ year payback on the
      roughly $7,000 net per-unit capital deployment, making the lease layer insufficient on its own.


      The second and more material layer is retail electricity margin. Base Power serves as its customers'
      Retail Electric Provider, billing a fixed rate of 8.5 cents/kWh plus standard local delivery charges
      (approximately 5.8 cents in Oncor territory, totaling ~13.8 cents all-in). As of April 2026, the
      company extended this value proposition to non-battery customers through a new "Base Energy" plan
      priced at 13.2–15.7 cents/kWh on 36-month contracts, widening the addressable population to apartment
      dwellers and those unwilling to host hardware. Base buys wholesale power from ERCOT and captures the
      spread above the fixed retail rate it charges customers.


      The third and likely highest-margin layer is wholesale grid arbitrage. Base Power's software charges
      the distributed battery fleet during periods of low or negative ERCOT spot prices, then discharges
      aggregated capacity during peak price windows. The retail and wholesale businesses structurally hedge
      each other: when intraday spot spikes compress the retail margin (fixed-rate customers still pay 8.5
      cents while Base pays elevated wholesale prices), those same spikes simultaneously increase battery
      discharge revenue. Base Power qualified for ERCOT's Aggregated Distributed Energy Resource (ADER)
      program, allowing it to bid the combined fleet into the wholesale market as a single virtual power
      plant. A fourth emerging layer is utility tolling: in May 2026 Austin Energy contracted for 40 MW of
      battery capacity at a fixed non-escalating price per kilowatt-month, worth up to $4.08 million per
      year and $40.8 million over ten years. This tolling agreement can be layered on top of existing
      retail and arbitrage streams for the same installed fleet, improving fleet economics at no marginal
      hardware cost. Outside ERCOT in regulated markets, only the tolling layer is available, fundamentally
      changing the payback calculus.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI007
      - CI008
      - CI009
      - CI035
