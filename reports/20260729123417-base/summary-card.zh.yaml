  topStrengths:
    - Base Power 扩张很快，到 2026 年中已覆盖 20,000+ 户家庭，部署户用电池容量超过 100+ MWh，并打开首个 Illinois 市场。
    - 公司把硬件、电力零售和 ERCOT 电网服务参与接在一起，做成垂直整合模式，单层竞争者很难直接复制。
    - 顶级投资人组合，以及与 Lennar 和多家 Texas 公用事业公司的渠道合作，验证了强劲的早期市场入口。
  topRisks:
    - 相比公开储能和 DER 可比公司，$4B 估值隐含极高收入倍数，几乎不给执行失误留空间。
    - 储能容量趋于饱和后，ERCOT 电池市场收入已大幅压缩，直接威胁 Base Power 单位经济性里的电网服务层。
    - 备用电力承诺可能与 Base Power 为电网交易放电的权利冲突；一旦停电，就会带来声誉和留存风险。
    - 2026 年 6 月 Illinois 上线时间太短，尚不能证明 Base 能在 ERCOT 之外复制 Texas 模式，或在其他零售电力制度下维持类似经济性。
  unresolvedGaps:
    - 经审计收入、毛利率和单客户单位经济性未公开披露。
    - 股权结构稀释、清算优先权和当前二级市场隐含估值仍不够透明，难以支撑后期入场定价。
    - 经验证员工数、董事会构成，以及正式治理 / 控制权披露仍不完整。
    - Illinois 上线经济性、获客成本和留存数据太新，还看不出 Base 能否在第二个市场复制 Texas 式结果。
