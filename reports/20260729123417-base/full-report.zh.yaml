        title: 渠道伙伴与安装商生态
        blocks:
          - type: paragraph
            body: >
              Base Power 围绕两类渠道设计了商业化路径：公用事业 / 合作社伙伴关系（B2B2C）和建商集成（B2B2C 新建住宅）。到 2026 年 3 月，公司已宣布五个德州 公用事业合作，2026 年 5
