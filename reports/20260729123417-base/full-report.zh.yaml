          - type: callout
            title: ADER 试点依赖是集中度最高的监管风险
            body: >-
              Base Power 能否参与批发市场，取决于 ERCOT ADER 试点；该项目只是 PUCT 授权的试点，并没有永久法定地位。PUCT 或 ERCOT 可以修改准入规则、冻结容量，或终止试点。50% 的
              QSE 集中度上限意味着，随着 Base Power 机群扩张，公司在 ADER 容量达到 100 MW 时就会碰顶（200 MW 总量的 50%）。ADER
              解散或永久冻结容量，将拿走公司的主要差异化收入机制，也是这一风险谱系中最大的“一票否决”风险。
