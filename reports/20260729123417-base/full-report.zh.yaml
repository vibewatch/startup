            title: 投资前的关键尽调优先项
            body: >-
              （1）确认 PUCT Project 53911 下的 ADER 注册情况及任何容量使用数据。（2）获取 ERCOT SOC 合规记录，以及任何违规事件或待决罚款。（3）审查 Base Power 的 PUCT
              REP 案卷，包括投诉历史和财务申报。（4）索取机群管理平台的网络安全审计结果（SOC 2 或同等标准）。（5）获取 Factory One
              生产数据——产能、良率、出货台数——以验证供应链独立性假设。（6）审查客户合同中的备电可用性披露措辞，并检索 PUCT 投诉数据库中与 Base Power 有关的文件。
