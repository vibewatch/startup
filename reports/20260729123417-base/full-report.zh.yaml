          - type: callout
            title: ERCOT ADER 监管成熟是关键路径事项
            body: >
              Base Power 已用满可通过 ERCOT ADER 试点投标的 20 MW。ERCOT 正在审查将上限扩至 160 MW，待 2026 年 6 月董事会批准，但节点调度和结算规则—— Base
              变现电池队列的核心机制——截至 2026 年 5 月仍在 ERCOT 内部审查。上限和结算框架是 Base 在德州电网服务收入天花板的硬约束；其解决结果将 决定 ADER 渠道能否扩展到支撑 Base
              的增长野心。
