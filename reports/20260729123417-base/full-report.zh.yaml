      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: ERCOT 收入饱和对当前倍数构成生存级威胁
            body: >
              本章最重要的不利信号不是 Base Power 的执行——执行确实令人印象深刻——而是 ERCOT 电网服务收入的结构性崩塌。BESS 年均收入从 2023 年 $149/kW 降至 2025 年
              $29/kW（Modo Energy），下降 80%，背后是装机容量增加 70×。在 $29/kW 下，一块 25 kWh 的 Base Power 电池每年电网服务收入约
              $73，远低于支撑有利可图单元经济性所需的零售利润和租赁费，除非接受很长回收期。除非 RTC+B 改革显著提高每 kW 补偿，或 Base 真正建立零售利润主导地位，否则核心收入多元化论点正承受严重压力。任何按
              $4B 入场的投资人，都必须拿出具体且有证据的观点，说明电网服务收入如何回升到 $50/kW 以上；否则这一风险不能解除。
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV031
              - CV033
              - CV037
              - CV038
          - type: callout
            title: $4B 价格是平台期权溢价，不是收入倍数
            body: >
              Base Power 的 $4B
              估值无法用传统收入倍数和任何合理可比折扣率解释。更准确地说，这是市场隐含的期权：公司将成为美国放松管制市场中占主导地位的住宅电池和电力平台——类似在基础设施网络尚未成规模前先给它定价。这并非天然不理性：Sunrun
              在太阳能资产所有权建设完成前也曾获得类似定价。但投资人必须显性给这个期权定价，给全国规模结果分配现实概率，并接受一点：按当前证据质量，基准情景在当前入场价下是亏损。领投或共同领投四轮融资的五家顶级 VC
              并没有看错潜力；不过他们可能已经把潜力价格打满了。
            calloutType: insight
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV016
              - CV020
              - CV021
          - type: callout
            title: 任何资本承诺前的尽调门槛
            body: >
              在缺少以下信息前，不应承诺超过 $5M 的资本：（1）数据室访问，确认截至 2026 年 Q3 的 2026 年收入轨迹达到或超过 $50M；（2）四轮融资完整股权结构表和优先权结构文件；（3）独立 Gen 3
              制造评估。只有入场价在 $2.5B 或以下，基准情景才能产生正期望回报。若缺少上述三项数据，入场价高于 $3B 就属于投机。
            calloutType: recommendation
            claimRefs:
              - CV001
