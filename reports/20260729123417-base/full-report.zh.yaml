      - number: '5.5'
        title: 技术差异化与产品风险
        blocks:
          - type: paragraph
            body: >
              Base Power 的差异化建立在四个相互叠加、单独难复制且几乎无法同时复制的因素上：（1）垂直整合的硬件设计，使 Base 能控制成本和路线图， 不依赖第三方电池产品品牌；（2）专有 BaseOS
              软件栈，贯穿固件、云端和 SCADA，在住宅规模实现公用事业级调度；（3）专门打造的部署运营 引擎（许可、物流、安装），可放大到每周数百套系统；（4）新型发电零售一体化商业模式，Base 同时扮演发电方（ADER
              聚合商）和零售电力 供应商，从电网服务、能源套利和客户订阅中同时获取收入。

              80/20 公用事业调度 / 屋主保留分配，是产品最大的张力。合同允许 Base Power 将电池放电至 20% 荷电状态，以履行电网交易义务。如果停电
              紧跟峰值定价调度事件发生，屋主可用备电容量可能远低于全量。这是商业模式的结构性特征，不是漏洞；CleanTechnica 和独立电气承包商 Epic Electrical
              都已公开提示，这是客户容易低估的风险。对希望在多日长时间停电中获得有保障全屋备电的屋主，20% 底线叠加最坏情况下的重 HVAC 负荷，会把单块电池备电时间压到不足 1 小时。

              电芯目前从中国进口，带来关税敞口。Austin 工厂将于 2026 年 Q1 开始制造模组、电池包和电力电子，但在 Base 锁定美国本土或非中国电芯 供应商前，电芯仍是中国来源投入。ERCOT ADER 试点
              80 MW 上限（拟扩至 160 MW）仍是 Base 在 ERCOT 电网服务收入的监管天花板；截至 2026 年 5 月，上限如何解决，包括节点调度规则和结算框架，仍在 ERCOT
              内部审查。德州之外的地理扩张需要二选一：要么进入放松管制市场（支撑完整 发电零售一体化模式），要么与公用事业合作（支撑受监管公用事业的电池即服务模式）；Base FAQ 提到伊利诺伊州的 ComEd
              计费，说明早期扩张已在 推进。
            claimRefs:
              - CE031
              - CE032
              - CE033
