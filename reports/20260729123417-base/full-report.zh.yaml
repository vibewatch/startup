      - number: '7.2'
        title: 财务、资本与收入风险
        blocks:
          - type: paragraph
            body: >-
              ERCOT 电池经济性急剧恶化。ERCOT 年均 BESS 收入从 2023 年 $149/kW 降至 2025 年估计 $17/kW，跌幅约 90%；原因是装机容量从 2023 年中约 3.3 GW 增至
              2026 年初超过 14 GW，辅助服务市场被快速挤满。同期辅助服务占 BESS 总收入的比例从 84% 降至 48%。2025 年，多数大型 BESS 运营商年初至今盈利率低于 2.2%。这些变化直接挤压
              Base Power 低于市场价客户定价模型所依赖的批发套利收入。

              Base Power 的商业模式天然做空批发电价：客户在 3 年合同中支付约 $0.085/kWh 外加输配费的固定电价，而 Base Power 需要持续管理这一固定价与 ERCOT
              实际市场成本之间的价差，并靠电网交易收入补足。如果批发电价飙升——ERCOT 的 energy-only 市场经常如此——而电网交易收入不足以对冲，Base Power 自己承担亏损。反过来，如果批发电价跌破
              Base Power 的成本结构，固定客户电价又没有同步重定价机制，利润率就会蒸发。

              租赁模式（硬件由 Base Power 持有、部署在客户住宅）要求持续投入资本：每新增一个安装点，就是一笔需要在资产生命周期内靠未来收入收回的资本承诺。2025 年 10 月 $1 billion C
              轮、投前估值 $3 billion，以及 2023 年以来累计融资 $1.3 billion，为公司提供了充足跑道；但 Base Power 向全国扩张时，资本强度会继续叠加。2025
              年上半年，储能公司企业融资同比下降 41%，说明未来融资轮可能更苛刻。

              ERCOT 的 energy-only 市场不像 CAISO 或 PJM，没有容量费，也没有长期资源充足性合同。因此 ERCOT 电池运营商不能用签约容量收入平滑现金流，Base Power
              的经济性几乎完全押在市场波动和稀缺事件上，而这些事件取决于天气、难以预测。Ascend Analytics（2025 年 5 月）预计，负荷增长快于供给建设，ERCOT 到 2027
              年都将走在「依赖天气的刀锋」上，年份之间大起大落。2025 年 12 月 RTC+B 落地后，alpha 也从结构性的市场设计缝隙转向系统基本面的稀缺性，低算法能力运营商的回报被压缩。

              监管成本敞口进一步放大财务风险：并网补贴超支、PUCT 信用证要求、NERC 合规审计成本，以及潜在 ERCOT 违规罚款，都是随着机群规模扩大而增加的持续固定成本。
