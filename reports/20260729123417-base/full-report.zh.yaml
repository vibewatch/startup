      - number: '7.3'
        title: 运营、安全、网络与执行风险
        blocks:
          - type: paragraph
            body: >-
              Base Power 的租赁模式内含客户利益冲突：公司可以合法地把客户电池调度至 20% SOC，用于向 ERCOT
              批发市场售电。这意味着停电发生时，电池未必是满电。消费者论坛和电工咨询网站都明确记录了这一风险：在全屋交流负载下，25 kWh 电池满电也只能提供 2–5
              小时备电；如果近期被调度，时长会更短。社区论坛讨论显示，一些客户认为备电时长保证带有误导，而 20% 底线会实质性降低有效备电上限。未来若极端天气中客户以为有备电却实际断电，声誉风险和监管投诉风险会急剧上升。

              电池消防安全是真实但可管理的风险。Base Power 使用 LFP（磷酸铁锂）化学体系，热失控风险显著低于 NMC 锂电池，但并非不会起火。CPSC 2026 年因第三方电芯缺陷导致过热、火灾和烧伤危险，召回约
              10,500 套 Tesla Powerwall 2 系统——这说明即使工程水平较高的住宅电池系统也可能需要召回。Texas 各县消防许可要求不一，形成分散的合规负担。Clean Energy Group
              指出，正确安装的电池储能是安全的，但热失控会产生高强度火灾和有毒气体，扑救困难。Base Power 扩张到数万户并进行日常循环后，产品责任敞口会按比例上升。

              云端管理的住宅电池机群让网络安全风险升高。NERC 的 Howard Gugel
              指出，对逆变器型资源进行大规模软件更新有双重风险：一方面带来运营灵活性，另一方面一旦更新通道被攻破，可能造成灾难性电网影响。EPRI 研究员 Sai Ram Ganti
              警告，带双向云连接的电池可被厂商远程操作；如果云服务器被攻破，威胁会显著放大。Base Power 的机群管理模式依赖这种双向云连接来实时管理 SOC 并执行 ERCOT 调度。针对 Base Power
              机群管理平台的协同网络攻击，可能同时瘫痪数千块客户电池，构成重大电网可靠性事件和声誉灾难。Brattle/Dragos BESS 网络安全报告（2025 年 12 月）发现，美国 BESS 部署每年增长
              30%，但网络安全标准和监管要求没有跟上。

              Base Power 全国扩张时，安装商和供应链风险很重要。美国住宅电池安装能力已承压：专业劳动力需求旺盛，中国电芯关税压缩库存可得性并推高成本。市场预测 2026 年美国住宅电池储能部署将下降
              12%，显示短期逆风。Base Power 的本土制造策略（位于原 Austin American-Statesman 场址的 Factory
              One）从结构上应对供应链风险，但也给一家此前没有工厂运营经验的公司增加了制造执行风险。

              考虑到 Base Power 的年龄（2023 年 8 月成立）、目标范围（全国扩张、本土制造、ERCOT 市场参与、REP 运营）以及领导层在运营大规模能源公用事业或工厂方面的经验相对有限，执行风险偏高。CEO
              Zach Dell 具备金融和风险投资背景；COO Justin Lopas 有 Anduril 和 SpaceX 制造经验，但两人都没有带领如此规模的公用事业级电池机群穿越完整市场周期的经历。
