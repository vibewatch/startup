      - number: '1.5'
        title: 不利因素与关键风险
        blocks:
          - type: paragraph
            body: >
              独立评测和分析师评论暴露出几项实质风险。最突出的是，Base Power 客户合约赋予公司法定权利：在高需求时段，公司可将电池放电至低至 20%
              荷电状态，把电卖回电网。实际效果是，依赖电池防停电的房主，可能在电网失效那一刻只剩部分电量——而高需求场景恰恰最容易触发停电。DFW 承包商 Epic Electrical 详细审阅 Base
              条款后，将其称为「大多数人漏掉的一件事」，并建议真正想做全屋保护的房主，把 Base 电池与补充发电机和联锁套件（$300–$700）搭配使用。

              单位经济能否持续是第二个担忧。Green Car Future 的独立分析按 25 kWh 系统测算，单机年收入约 $2,075，按现行定价意味着简单回本期为八到九年——只有在电池循环假设成立、ERCOT
              市场波动延续且资本成本不升的情况下才可接受。该分析师指出，>100 名员工、约 $150,000 全包人力成本，意味着每年 $15 M+ 的人工开销没有计入单机模型。收入预测高度依赖波动的 ERCOT
              辅助服务和能源套利收入；随着更多分布式储能入场，这部分收入可能被压缩。

              关税和供应链暴露是第三项风险：CNBC 2025 年 4 月报道称，Base Power 电池在中国制造，公司预期美国关税会带来实质影响。本土工厂明确用于应对这一点，但制造爬坡时间表仍缺少独立来源核验。

              最后，Base 依托 ERCOT ADER 试点运营，该试点受 PUCT 监管审查；项目的市场上限（160 MW 能源、80 MW
              non-spin/ECRS）和准入规则，可能被委员会命令收紧、修订或终止。本轮研究未发现针对 Base Power 的诉讼、制裁或消费者保护执法行动。
            claimRefs:
              - CO036
              - CO037
              - CO038
              - CO039
              - CO040
      - number: '1.6'
        title: 证据要点
        blocks:
          - type: callout
            title: 高波动市场中的快速放量
            body: >
              Base Power 在首批部署后约 18 个月内完成 >100 MWh 住宅电池容量部署，通过 ERCOT 的 ADER 批发市场项目资格，并截至 2026 年 3 月拿下五个德州公用事业合作。住宅许可捷径和
              Lennar 住宅建商渠道支撑了这种执行速度，也形成了分布式储能领域可持续的先发优势。
            calloutType: strength
            claimRefs:
              - CO029
              - CO031
              - CO032
              - CO035
          - type: callout
            title: 放电条款削弱备用电价值主张
            body: >
              Base Power 合约允许公司在需求高峰期将客户电池放电至 20%，把电卖回电网——而这恰恰是电网最可能停摆的条件。DFW 一位独立电工评测将其称为「大多数人漏掉的一件事」，并建议把 Base
              与补充发电机搭配，才能实现真正的全屋保护。商业 VPP 用途与客户备用电预期之间存在结构性张力，尤其在一次高关注度停电事件之后，会带来声誉和流失风险。
            calloutType: risk
            claimRefs:
              - CO036
              - CO037
          - type: callout
            title: 单位经济依赖 ERCOT 波动套利
            body: >
              第三方分析估计，在现行定价下，每个 25 kWh 单元简单回本期为八到九年，盈利取决于 ERCOT 批发价波动能否持续。更多储能资产入场后，套利价差可能被压缩。此外，此前依赖中国制造电池带来关税暴露，而
              Austin 工厂尚未具备完全替代能力。
            calloutType: risk
            claimRefs:
