      - number: '1.4'
        title: 里程碑、牵引力与规模
        blocks:
          - type: paragraph
            body: >
              Base Power 很快做出了显著规模。公司 2023 年 8 月成立，当年即完成首批部署；2024 年初拿下 Hill Country 公用事业合作（Bandera Electric
              Cooperative），作为首个公用事业合作；2024 年 12 月宣布标志性的 Lennar 住宅建商合作，在 Firefly Pointe（Hutto）、Rancho del Cielo（Jarrell）和
              Rancho Canyon（Haslet）社区试点。到 2025 年 4 月，公司已完成 $200 M Series B，并以「最高每天 20 块电池」的速度部署。2025 年 8 月进入 Dallas-Fort
              Worth 主城区；公司在 Grapevine 开设仓库和办公室，覆盖 Fort Worth、Arlington、Plano 和 Irving。

              2025 年夏季，Base 通过 ERCOT 的 Aggregated Distributed Energy
              Resource（ADER）试点资格——该项目正式允许分布式电池聚合后作为单一可调度资源投标批发市场。公司预计到 2025 年秋季成为 ADER 项目最大贡献方。Series C 与工厂公告在 2025 年 10
              月同时到来；位于原 Austin American-Statesman 印刷楼的工厂开始改造为储能和电力电子制造线，目标是在 2026 年初全面投产。

              后续公用事业合作密集公布：GVEC（Guadalupe Valley Electric Cooperative）于 2025 年 6 月启动公用事业管理电池队列；Farmers Electric
              Cooperative 于 2025 年 12 月签约，目标部署 20 MW 住宅侧容量；El Paso Electric Company（EPE）于 2026 年 2 月宣布最高 10 MW
              试点，赶在夏季高峰前启动；CoServ（Denton County Electric Cooperative）于 2026 年 3 月宣布签下 100 MW 协议——这是 Base
              迄今最大交易，也被称为德州最大分布式储能项目之一。到 2025 年中，客户数已超过 10,000 户住宅，总部署容量超过 100 MWh。2026 年预计收入约 $70M。
