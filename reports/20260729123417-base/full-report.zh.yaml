      - number: '3.3'
        title: 能力与价格对比
        blocks:
          - type: paragraph
            body: >
              相比硬件 OEM 阵营，Base Power 的竞争定位建立在三项结构性优势上：资产所有权（Base 承担资本开支，而不是消费者）、电池超配（25 kWh，对比 Tesla 13.5 kWh 或 Enphase
              5 kWh 模块），以及直接公用事业合作集成。


              **价格差：**Base 收取 $695（单电池）或 $995（双电池）安装费，后续 $19/月（双电池 $29）会员费。GVEC 会员支付更低——$295 或 $445——且 Base
              完全免收月度会员费。竞争硬件购买模式需要消费者前置支付：Tesla Powerwall 3 为 $7,500–$13,500，FranklinWH aPower 2 为 $6,500–$8,500，Sonnen
              零售购买路径为 $8,000–$11,000。即使计入 Oncor $4,500 返利（Oncor 覆盖区域可用），硬件购买竞争者仍要求消费者投入高出 Base 入口价 5–10 倍。联邦住宅 ITC 25D
              税收抵免在 2025 年底到期，使这一差距在 2026 年进一步扩大。


              **容量和电网价值：**Base 的 25 kWh / 11.4 kW 电池提供的储能约为 Tesla Powerwall 3（13.5 kWh）的两倍、Enphase IQ Battery 5P
              模块的五倍。更大的电池容量意味着每台更多能源套利、ERCOT 每节点更多收入，以及更长备用时长。Base 双电池安装（50 kWh）可为普通 GVEC 客户提供最高约 12 小时备用，对比单块 Powerwall
              3 约 3–4 小时。


              **公用事业集成 vs. 消费者控制模型：**Base 模型默认把 80% 电池容量留给公用事业调度，20%
              留给房主备用。竞争性硬件购买模型把控制权完全交给房主，公用事业公司会将其视为可靠性较弱的电网资产。GVEC 特别指出，表后资产（Base
              模型）能带来输电成本降低收益，而注册为发电机的公用事业级电池做不到。Sonnen/Solrite 提供类似 Base 的 10–20% 备用预留，反映同一权衡。Tesla VPP
              允许房主在停电期间退出，降低了电网运营商可依赖的调度可靠性。


              **软件和控制栈：**Base 声称其自有并自营电池队列具备亚秒级遥测和三个 9 的可用性。依赖房主覆盖控制的竞争者（智能恒温器、Sunrun 的客户控制系统）会面临 Base CEO Zach Dell
              在投资人评论中明确提到的「DR 1.0」可靠性批评：「资产归我们所有，也由我们控制。我们的可用性是三个 9。」AutoGrid 和 Fluence
              向公用事业公司提供可比的软件复杂度，但自身不持有硬件资产，因此在房主入网层存在执行风险。
