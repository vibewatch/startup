              具名客户证言覆盖多个德州市场。在 Base Power 官方评论页，Michael O. 称自己从 Reliant 切换后账单下降 39%（从全包 $0.22/kWh 降至 Base 透明定价）。 David
              C. 称从 Green Mountain Energy 切换后下降 40%。Magnolia, TX 的 Zac 称，最近一场风暴中电池让家里持续供电超过 18 小时且没有中断。Matt M. 称邻居 停电 7
