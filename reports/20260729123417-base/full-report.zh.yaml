chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >
              Base Power Company 于 2023 年注册成立，总部位于 Texas 州 Austin 的 305 S. Congress Avenue。公司在德州放松管制的 ERCOT
              市场以持牌零售电力供应商（REP）身份运营，并称自己是美国首个同类垂直整合分布式能源平台。其商业网站是 basepowercompany.com。

              这套商业模式有时被称作 "gentailer" 结构：在一个主体内同时持有硬件、零售供电、软件运营和批发电力交易。Base 以 $595–$995 的一次性安装费，在房主住宅安装 25 kWh（Gen
              1：11.4 kW 连续功率）或 50 kWh 电池系统；电池由 Base 持有，公司每月收 $19–$29 会员费，并以约 8.0–8.5 ¢/kWh
              的固定电价（另加按实转嫁的输配电费）成为房主的供电商。公司为停电保留电池备用电力，同时调度电池吃 ERCOT 批发价差——夜间低价买电，早晚高峰向住户和电网放电。客户需签三年供电合约。约一半 Base
              客户装有屋顶太阳能；客户回售电力时，Base 按实时批发价另加 3 ¢/kWh 补偿。

              公司先打德州，是因为约 85% 德州居民住在放松管制的电力区域，零售商可以直接签客户。德州批发电价在北美波动最高，套利窗口更宽。在受监管市场（其他州），Base
              计划通过公用事业公司合作扩张，而不是直接面向消费者建立 REP 关系。截至 2026 年 5 月，公司称已为 Texas 和 Illinois 超过 20,000
              户住宅供电；直接零售可用区域仍集中在德州，早期非德州扩张已延伸到 Chicagoland 地区。
