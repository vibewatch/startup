        title: 留存、耐久性与合同条款
        blocks:
          - type: paragraph
            body: >
              披露流失率接近零：Sacra 记录截至 2025 年 8 月仅有一名客户离开；对于这个增长阶段的任何订阅服务，这都是异常低的数字。结构性驱动来自双合同锁定：10 年 电池服务协议和 3 年电力供应商协议（36
              个月）。能源合同保证注册和续约时低于市场价格——Base 服务条款称，续约时将在 powertochoose.org 上 匹配或优于市场平均价格，否则允许客户免费退出电池协议。


              搬家的屋主可把电池协议转给下一任屋主，从而降低房屋出售带来的流失。拆除需要支付 $500 人工移除费。硬件全程归 Base 所有，由 Base 负责维护和保修。备电明确
              排除用于生命关键医疗设备，也无法在长时间事件中保证。公用事业合作社项目条款不同：GVEC 成员支付 $295 固定购买费（无持续电池订阅），El Paso Electric 参与者
              无需付款——电池使用和备电不附带直接电力协议。


              截至 2026 年 5 月，除近零流失这一轶事外，没有公开披露 NRR、GRR 或队列留存百分比。独立评论聚合器（TrustBurn）显示，自选择回应者情绪一致为正， 且没有记录退款或法律纠纷模式。本次未搜索
