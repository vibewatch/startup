      - number: '8.2'
        title: 估值背景与融资结构
        blocks:
          - type: paragraph
            body: >
              Base Power 的融资历史显示轮次间隔被快速压缩：种子轮（$7.8M，2023 年 8 月）、A 轮（$68M，推定 2024 年）、B 轮（$200M，2025 年 4 月）、C 轮（$1B，2025 年
              10 月），不到两年半累计融资 $1.3B。C 轮由 Addition 的 Lee Fixel 领投；他在 B 轮加入董事会。B 到 C 只隔 6 个月，金额从 $200M 跳至
              $1B，是美国能源初创公司史上最快的连续加注周期之一，也显示投资人对近期部署动能的信心很强。TechCrunch 援引 The New York Times 称，C 轮投前估值为 $3B，意味着 $1B
              投资在未稀释口径下买入约 25% 股权；实际经济权益取决于未公开的优先权条款。

              累计投入资本（$1.3B）相对 $4B 投后估值，意味着总融资额到估值约 3.1× 的轮次加价；对这个阶段的高增长创业公司而言并不异常夸张。但从 LP 回报角度看，关键约束是：任何低于 $5–6B 的 IPO 或
              M&A 退出（约为投入资本 4–5×）都可能让后期投资人失望，尤其是在计入四轮优先清算权叠加之后。累计 $1.3B 资本带来的优先权悬顶（假设 1× 清算优先）意味着，普通股股东要等前 $1.3B
              返还后才有收益；后期优先股投资人也很可能持有参与型或高级优先结构。这些条款未公开，是重大尽调缺口。

              二级市场信号提供的价格发现有限：截至 2026 年 5 月，Notice.co 挂出的 Base Power 股价约为每股 $10.65–$11.04。由于不知道股权结构表中的总股数，无法直接反推出总估值；不过
              Forge、Hiive 和 EquityZen 上有活跃二级交易，说明投资人有流动性需求，也暗示当前一级轮次价格在二级市场没有明显压缩。Forge Global 将 Base Power 的 IPO
              状态里程碑列为「Confidential Filing」，若收入扩张至 $150–300M，2026–2028 年 IPO 窗口具有合理性。

              在 $4B 价格入场，投资人必须相信 Base Power 退出时能维持 5–10× 收入倍数——对应 $400M–$800M 终局收入。到 2027–2028
              年实现这一点，只有在以下条件同时成立时才可行：（1）ERCOT 每 kW 收入稳定在 $40/kW 以上；（2）Gen 3 制造计划将电池成本降低 30–40%；（3）全国扩张到 2027
              年至少新增两个市场；（4）Texas 以外客户群组经济性跑通，流失率接近零。每一项单独看都合理；四项同时成立才是核心论点。
