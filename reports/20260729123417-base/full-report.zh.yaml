  - id: FR001
    title: 风险热力图——按可能性和影响划分 Base Power 风险宇宙
    type: matrix
    layout: standard
    summary: 按发生可能性（低 / 中 / 高）和业务影响（中等 / 高 / 关键）映射 10 项已识别风险， 并显示现有缓释后的剩余严重度。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 关键影响
          values:
            - 电池起火 / 热失控；车队管理遭网络攻击
            - ADER 试点容量冻结或解散
            - ERCOT 收入压缩 / 饱和
        - label: 高影响
          values:
            - 并网成本超支；关键高管离职
            - 电池衰减 / 质保成本；软件误调度；Factory One 爬坡失败
            - 客户利益冲突（SOC 消耗 vs 备电）
        - label: 中等影响
          values:
            - ''
            - 安装商短缺拖慢部署
            - ''
    approximationNotes: 可能性和影响评估是分析师基于公开证据的判断；未获得专有运营或财务数据。
    claimRefs:
      - CR001
      - CR011
      - CR018
      - CR022
      - CR026
      - CR035
  - id: FR002
    title: 风险传导图——ERCOT 和监管风险如何传导至 Base Power 经济性
    type: dag
    layout: wide
    summary: 有向无环图，展示 ERCOT 市场饱和、NPRR 1186、ADER 试点风险和 REP 认证风险 如何传导至 Base Power 的收入、利润率和客户结果。
    data:
      nodes:
        - id: n1
          label: ERCOT 辅助服务市场饱和
        - id: n2
          label: NPRR 1186 SOC 合规规则
        - id: n3
          label: ADER 试点容量限制
        - id: n4
          label: RTC+B 算法复杂性
        - id: n5
          label: REP 牌照要求
        - id: n6
          label: 批发收入压缩
        - id: n7
          label: ERCOT 罚款敞口
        - id: n8
          label: ADER 市场准入风险
        - id: n9
          label: 合规成本负担
        - id: n10
          label: 零售利润率压力
        - id: n11
          label: 客户定价可持续性
        - id: n12
          label: 投资逻辑破裂风险
      edges:
