  - id: TM004
    title: 增长驱动与采用约束
    columns:
      - 驱动 / 约束
      - 方向
      - 时间
      - 对 Base Power 的影响
      - 尽调问题
    rows:
      - - IRA 30% 住宅电池 ITC（独立储能自 2023 年起符合条件）
        - 增长驱动
        - 当前（持续至 2032 年）
        - 有效硬件成本下降约 30%；电池部署单元经济性改善
        - 确认 IRA 抵免是否适用于 Base Power 所有权 / 订阅模式，而非仅适用于房主持有
      - - ERCOT ADER 试点扩容（第 3 阶段，160/80/80 MW 上限）
        - 增长驱动
        - 当前（第 3 阶段于 2025 年中启动）
        - 为 Base Power 聚合电池集群打开更大的 ERCOT 批发收入池
        - 跟踪 PUCT 制定永久 ADER 规则以取代试点；存在时间风险
      - - 德州人口与负荷增长（数据中心、电气化）
        - 增长驱动
        - 当前且在加速
        - 公用事业公司对 DER 容量替代方案的需求上升；Base Power 公用事业合作管线改善
        - 核验 Base Power 在现有五家德州合作社之外的公用事业合作管线
      - - 电池成本下降（2025 年约 $117/kWh，较 2023 年低约 67%）
        - 增长驱动
        - 当前且仍在持续
        - 单次安装硬件 capex 降低；可触达房主收入区间扩大
        - 评估 Base Power 电池采购协议与成本路径；进口电芯关税风险
      - - ERCOT 电网级 BESS 收入压缩（辅助服务收入 2023–2025 年下降约 90%）
        - 采用约束（反向）
        - 当前；部分为结构性
        - 可用于抵减客户订阅价的电网服务收入减少；利润率承压
        - 建模 2026 年夏季 ERCOT 未出现重大稀缺事件的下行情境
      - - 2021 年 Uri 后的停电风险与德州电网可靠性焦虑
        - 增长驱动
        - 持续存在；每次夏季峰值或冬季事件都会放大
        - 房主细分的主要需求拉力；自然口碑渠道强
        - 跟踪市场成熟后获客成本以及自然 / 付费组合
      - - IRA 政策不确定性（电芯关税、ITC 可能回撤）
        - 采用约束
        - 近期风险（2025–2026 年联邦政策行动）
        - SEIA 指出，新联邦政策会给德州规划中的太阳能 / 储能容量带来 "severe risk"
        - 评估 Base Power 本土制造（Austin 工厂）能否对冲关税；核验时间表与规模
      - - 房主切换成本与注册摩擦
        - 采用约束
        - 持续
        - 降低自然流失风险，但也拖慢初始注册转化
        - 审查取消率与合同期限；多年锁定形成 LTV 底线
      - - ERCOT ADER 遥测与互操作要求（2 秒遥测强制要求）
        - 采用约束
        - 当前
        - 技术门槛抬高运营复杂度；规模化时可能成为瓶颈
        - 确认 Base Power 的 ADER 资质状态及任何遥测合规缺口
      - - 来自 Tesla Powerwall / Tesla Electric VPP、Sunrun、Bandera ADER 的竞争
        - 采用约束
        - 当前
        - 装机基础或品牌认知更强的聚合商挤压可触达池
