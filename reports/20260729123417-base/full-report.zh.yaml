  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 电池硬件与产品组合
        blocks:
          - type: paragraph
            body: >
              Base Power 的 Gen 1 户用电池采用 LFP（磷酸铁锂）体系，额定连续输出 11.4 kW，总容量 25 kWh（可用 22.5 kWh）。 两台可并联安装，形成 22.8 kW / 50
              kWh（可用 44 kWh）配置。公司有意选择 LFP，而不是 NMC 或 NCA：发电零售一体化模式 要求高频日循环——夜间低价电网充电、尖峰价格放电——LFP
              比其他化学体系更能承受。系统采用地面安装的一体化户外机柜； 工作温度范围 14°F 至 122°F，噪音 ≤40 dB（相当于家用冰箱），电网停电切换时间记录低于 0.5 秒——快到多数屋主感知不到。
              设备可承受最高 88–100 堵转电流（LRA），覆盖多数住宅 HVAC 系统且无需改造；更大机组可选软启动套件。 设计寿命 15 年。

              Base 面向客户推出三项产品：（1）Backup + Energy——旗舰方案，把电池安装与 Base 作为零售电力供应商绑定；（2） Backup
              Only——屋主保留现有公用事业关系，只购买电池备电，部分地区可用；（3）Base Energy——2026 年 4 月在德州 主要 TDU 区域（Oncor、CenterPoint、AEP
              Central、AEP North、TNMP）推出的无电池、VPP 支撑零售电力计划，面向无法 安装硬件的公寓和共管公寓住户。电池系统归 Base Power 所有，不属于屋主；服务协议为 10 年，拆除费
              $500，五年后或 Base 将费率提高到市场价以上时免收。公司正在 90,000 平方英尺的原 Austin American-Statesman 场址建设第一座自有制造工厂， 目标产能爬坡至 4
              GWh/年；电芯目前来自中国，带来关税敞口，而本土工厂只能在模组、电池包和电力电子环节部分抵消这一风险。
