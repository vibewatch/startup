      - number: '1.2'
        title: 创始人与领导团队
        blocks:
          - type: paragraph
            body: >
              Base Power 由 Zach Dell（CEO）和 Justin Lopas（COO）于 2023 年 8 月联合创立。Dell 当时 29 岁，是 Dell Technologies 创始人
              Michael Dell 之子。他在 University of Southern California 学习社会科学、心理学和经济学（2019 届），之后先后在 Blackstone 和 Thrive
              Capital 做投资，并在那里形成了对分布式能源命题的判断。Lopas 曾任 Anduril Industries 制造负责人，也是 SpaceX 项目的首席制造工程师。多家投资人把两人的互补能力——Dell
              的融资与战略、Lopas 的硬件运营——视为关键降风险因素。

              扩展领导班子高度来自高精度制造和软件密集型消费硬件背景。Dino Sasaridis（硬件负责人）曾带领 Tesla Powerwall 工程团队。Jared Greene（软件负责人）开发过 SpaceX
              Starlink 的激光网状通信系统。Cole Jones（增长负责人）负责过 Starlink 的市场进入。Dana Paz（部署负责人）曾在 Anduril 带制造工程团队。Travis
              Kavulla（政策负责人）曾任 R Street Institute 能源与环境政策主任，并曾担任 Montana 公用事业委员。Zina Bash（首席法务官）曾是 Keller Postman 高级合伙人。

              管理层经验集中在 SpaceX、Tesla、Anduril、Blackstone 和 Thrive，也带来可见的关键人依赖：Dell 或 Lopas 离职，都会冲击投资人关系，以及支撑快速制造爬坡的运营执行力。
