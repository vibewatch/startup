      - number: '5.3'
        title: 控制架构、软件栈与 VPP 调度
        blocks:
          - type: paragraph
            body: >
              Base Power 已构建一套名为 BaseOS 的专有端到端软件和控制系统。系统覆盖固件（管理电芯级 BMS、传感器、电力电子和 OTA 更新）、
              后端服务（协调电池队列调度、能源交易、计费和运营物流），以及公用事业伙伴用于管理聚合资源的原生 SCADA 层。后端主要用 Golang 和 Python 编写，跑在 AWS
              上，采用容器化服务（Kubernetes）和 Terraform 管理基础设施，并用 Temporal 编排现实世界的部署和设备控制 流程。固件在嵌入式 Linux 或微控制器目标上用 C、C++ 或 Rust
              编写。软件负责人 Jared Greene 曾任 SpaceX Starlink 软件团队成员； 工程团队大量来自 Anduril、SpaceX 和 Tesla。

              现场连接采用三重冗余：（1）客户 WiFi 作为主链路；（2）4G 虚拟蜂窝芯片作为备份；（3）公用事业已经铺设光纤时，使用电表处的光纤连接。 这套架构让 Base 可以宣称连接加硬件的强制停运率低于
              5%——这是公用事业级可靠性口径。ERCOT 调度指令在亚秒级执行；实际送电功率与指令 功率误差在 1% 以内。公用事业伙伴可通过网页仪表盘控制电池聚合，也可通过 API 直接接入自身能源管理系统。

              在 ERCOT 放松管制市场，Base 的交易算法实时监控批发价格：低价时给电池充电（高风电 / 光伏时段常为负价），峰价时向电网放电。Base 已获 Texas Aggregated Distributed
              Energy Resource（ADER）试点资格，可以把分布式电池队列作为单一虚拟电厂投标进入 ERCOT 批发市场。截至 2025 年 10 月，Base 已用满 ADER 试点允许其投标的 20 MW
              容量，并推动提高上限。ERCOT 于 2026 年 4 月与 Base Power 召开工作会议，处理 节点调度、结算处理、计量、配电服务商协调等设计问题——这表明项目监管框架仍在成熟。
