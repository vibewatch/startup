  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与变现栈
        blocks:
          - type: paragraph
            body: >-
              Base Power 有意把收入架构叠成四层，每层承担不同财务功能。第一层、也是最薄的一层，是屋主租赁费：一次性 安装费 $695（25 kWh）或 $995（50 kWh），再按电池大小每月收 $19 或
              $29 订阅费，形成可预测但规模不大的 经常性现金流。每户每年订阅收入只有 $228–$348；相比单台约 $7,000 的净资本投入，仅靠这一层回本要 20 年 以上，因此租赁费本身撑不起模型。


              第二层更关键，是零售电力价差。Base Power 作为客户的零售电力供应商，按 8.5 美分/kWh 的固定 电价计费，并叠加标准本地输配电费用（Oncor 区域约 5.8 美分，合计约 13.8 美分）。截至
              2026 年 4 月，公司 通过新的「Base Energy」计划把这套价值主张扩展到无电池客户，36 个月合约价格为 13.2–15.7 美分/kWh，把 可服务人群扩大到公寓住户和不愿安装硬件的客户。Base
              从 ERCOT 采购批发电力，赚取固定零售电价与批发采购价 之间的价差。


              第三层、也可能是毛利最高的一层，是批发电网套利。Base Power 的软件会在 ERCOT 现货价格低甚至为负时给分布式
              电池队列充电，再在尖峰电价窗口聚合放电。零售和批发业务在结构上相互对冲：日内现货价格飙升会压缩零售毛利 （固定费率客户仍支付 8.5 美分，而 Base
              支付更高批发电价），同一轮价格尖峰又会抬高电池放电收入。Base Power 已获得 ERCOT Aggregated Distributed Energy
              Resource（ADER）项目资格，可以把合并后的电池队列作为单一 虚拟电厂投标进入批发市场。第四层正在成形，是公用事业容量租用：2026 年 5 月，Austin Energy 以每千瓦/月固定且
              不递增的价格签下 40 MW 电池容量，最高价值每年 $4.08M、十年 $40.8M。容量租用可叠加在同一批已 安装资产的零售和套利收入之上，在不增加边际硬件成本的情况下改善电池队列经济性。离开 ERCOT
              进入受监管市场后， 只有容量租用这一层可用，回本计算会被根本改写。
