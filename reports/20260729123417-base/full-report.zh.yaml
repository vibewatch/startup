      - number: '4.2'
        title: 硬件成本结构与单元经济
        blocks:
          - type: paragraph
            body: >-
              Base Power 的单元经济由每台已安装电池的大额前期资本投入决定，公司需要在 36 个月或更长服务期内靠混合收入收回 成本。Sacra 估计，在扣除 $3,000 联邦投资税收抵免前，Base Power
              每块电池全包安装成本约 $10,000；扣除后， 公司侧净成本约 $7,000/台。面向消费者的安装费（$695–$995）覆盖不到公司净硬件成本的 15%，意味着 Base Power 每次安装要先垫付约
              $6,000–$6,300 补贴。这个补贴驱动的模型类似 SolarCity 开创的光伏租赁打法：规模和长周期 合同是经济可持续的前提。


              NREL 2024 Annual Technology Baseline（ATB）把 2023 年款、采用 LFP 化学体系的户用电池储能包成本基准定在 $283/kWh
              DC；若计入逆变器、系统平衡、人工、许可和销售成本，安装口径约升至 $1,300/kWh。25 kWh 系统对应 市场化安装成本约 $32,500，远高于 Base Power 的消费者价格。Base Power
              的垂直整合策略——自研设计、自建制造 （Austin Factory One 的 Gen 3）、自有安装——旨在把硬件成本压到市场基准以下，但 Gen 3 到 2026 年中期的爬坡 带来制造执行风险。


              Sacra 估计回本期约 3.5 年，主要由零售电力价差和批发套利驱动，而不是仅靠租赁费。这个 3.5 年假设建立在 ERCOT 批发电价波动稳定、客户留存持续、ADER
              市场监管准入不断、且电池衰减没有显著不达标之上。接近零的披露流失率 （截至 2025 年 8 月仅流失 1 名客户）是正向先行指标，但毛利率、EBITDA 和单台贡献利润仍未披露，外部无法独立
              验证回本模型。系统为屋主备电预留 20% 电池容量（每 25 kWh 单元约 5 kWh），剩余 80% 可用于每日电网交易；这项 结构性承诺压缩了备电深度，但最大化可变现调度容量。
