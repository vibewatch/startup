        title: 客户分层与服务区域
        blocks:
          - type: paragraph
            body: >
              Base Power 目前服务单一主客户原型：位于放松管制 ERCOT 区域的德州屋主，他们想要停电保护和更低电费，但不愿为全屋发电机或自有电池支付前期
              资本。公司进一步按获客渠道切分客户基础——直接零售注册（Oncor、CenterPoint、TNMP、AEP Central 和 AEP North 区域可用）和公用事业伙伴转介 （Bandera
              Electric、GVEC、Farmers Electric、CoServ、El Paso Electric 和 Austin Energy 成员）。


              第三条渠道是 Lennar 建商集成，瞄准 Austin 和 Dallas-Fort Worth 的新建住宅买家：截至 2025 年中，电池在约 20 个 Lennar 社区的施工阶段安装， 包括 Firefly
              Pointe（Hutto）、Rancho del Cielo（Jarrell）和 Rancho Canyon（Haslet）。这些买家把电池作为住宅套餐的一部分获得，并自动加入 Base 的电力服务。


              完整「发电零售一体化」模式严格受 ERCOT 地理边界约束。El Paso Electric（ERCOT 外的受监管公用事业）和 Austin Energy（ERCOT 内的市政公用事业， 但不是放松管制 REP
              市场）需要不同的、仅容量租用模式：屋主不从 Base 获得电力零售服务，且通常无需前期付款。CNBC 称，Base Power 约 50% 直接零售 客户已经安装光伏板，使光伏+储能屋主成为关键子细分。2026
