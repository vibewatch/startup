      - number: '3.4'
        title: 护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >
              Base Power 的可持续竞争优势集中在五个会相互叠加的因素：公用事业合作社合作合约（切换成本）、ADER 资格（监管护城河）、自有硬件 + 软件垂直栈、本土制造（Austin
              工厂）和部署速度。不过，几类替代风险需要认真加权。


              **锁定与切换成本：**一旦 Base
              电池安装在合作社成员电表之后，由公用事业公司调度电池队列、房主获得备用服务，切换供应商就需要拆除并更换硬件——摩擦很高。三年最低合约进一步锚定客户。公用事业合作（CoServ 100 MW、GVEC 50
              MW、Bandera、Farmers Electric）也形成 B2B 切换成本：合作社需要重新认证并把新的 DERMS 供应商接入其运营和 ERCOT 注册。不过，这些合约有期限，续约并不保证。


              **ADER 监管护城河：**Base 获得 ERCOT Aggregated Distributed Energy Resource 试点资格，允许其把聚合住宅储能直接投标至 ERCOT
              批发和辅助服务市场。该监管资格并不容易复制——ADER 试点总容量上限为 200 MW，遥测和合规要求会劝退小型运营商，互操作壁垒甚至被 ERCOT ADER Task Force
              称为「亟待解决的关键问题」。Sonnen/Solrite 正瞄准同一 200 MW 上限中的 144 MW，因此这条监管通道的竞争压力已经升温。


              **大宗电池替代风险：**ERCOT 电池收入已经崩塌——根据 Enverus 数据，平均年收入从 2023 年 $149/kW 降至 2025 年预计 $17/kW，降幅 89%，原因是市场饱和（进入 2026
              年时已安装 14 GW）。能源套利策略已经普及，却未能抵消回报下降，主要运营商年初至今盈利率低于 2.2%。如果辅助服务和套利收入继续受压，Base 单位经济（估计每 25 kWh 系统总年收入约
              $2,075）可能变得很薄，尤其是在 100+ 名员工带来超过 $15M/年人员开销的情况下。一位批评者指出，在基准收入下 Base 回本期为「8–9 年」，只有在高波动年份才缩短至 5–6 年。


              **Tesla 和 Sunrun 价格战风险：**Tesla 和 Sunrun 都有内部电池制造通道（CATL/Panasonic 合作）和既有安装商 / 房主渠道，规模远大于 Base
              当前足迹。一位批评者特别警告：「Tesla 或 Sunrun 复制他们的成功并不需要太多投入。这些公司，尤其是 Tesla，已经能接触到内部电池制造，任何与 Base 的价格战都会赢。」Base 2025 年
              10 月 $1 B Series C 和计划中的 Austin 本土工厂，正是对这一风险的明确回应。


              **监管和政策逆风：**联邦住宅 ITC 25D 于 2025 年底到期，削弱了竞争性太阳能加储能安装的经济性，也可能降低消费者对任何家庭能源投资的需求。2025 年的 "One Big Beautiful
              Bill Act" 压缩了开发商时间线，并提高了合规负担。Deloitte 2026 Power and Utilities Outlook
              指出，容量采购、电价设计不确定性和并网延误仍是该行业最高层级风险——这些都会影响 Base 在德州之外签下新受监管市场公用事业合约的能力。
