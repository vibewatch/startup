      - number: '4.3'
        title: 资本充足性与融资架构
        blocks:
          - type: paragraph
            body: >-
              Base Power 在运营前两年半已累计募得约 $1.3B 股权融资，使其成为美国资本最充足的早期分布式能源平台之一。 2025 年 4 月 Series B 融资 $200M，由
              Addition、Andreessen Horowitz、Lightspeed Venture Partners 和 Valor Equity Partners 共同领投，Thrive
              Capital、Altimeter 等参投。六个月后，2025 年 10 月 Series C 由 Addition 领投，以 $3B 投前 / $4B 投后估值完成 $1B 融资，新投资方包括
              CapitalG、Ribbit、Spark、BOND 和 Lowercarbon，原有投资方全数跟投。已披露总融资额目前约 $1.3B。公司尚未披露项目融资或债务工具，不过重资产
              电池队列模型天然适合类似光伏租赁证券化的资产支持融资；一旦打通，跑道可显著拉长。


              资本投放速度很快。按 2025 年末每月 20 MW 的节奏——在 25 kWh 档位约等于每月 800 块电池——以及每台 $7,000 净成本计算，Base Power 仅硬件就在每月消耗约
              $5–8M，且未计入运营费用。公司刚拿到 $1B Series C， 2025 年收入估计为 $12M；即便部署目标激进，跑道仍有余量，但尚未能自我造血。Series C 资金的主要披露用途
              包括：走出德州做全国扩张、建设 Factory One（原 Austin American-Statesman 场址）、规划第二座工厂、扩大 Gen 3 电池生产。Austin Energy
              容量租用协议（$4.08M/年）和 CoServ 合作（Denton County 100 MW）提供了部分收入可见度， 但相对已投放资本仍只是小数。


              当前融资架构几乎纯股权，因此资本结构上的主要风险是稀释，而不是债务契约或再融资触发。但模型的长期可扩展性取决于
              三条路之一：（a）现有德州电池队列达到现金流盈亏平衡；（b）拿到项目融资或证券化资金，把电池队列增长从资产负债表 中剥离；或（c）继续以有利估值融资。选项（c）取决于能否守住 $4B 投后估值轨迹，而这要求
              2026 年 $70M 收入目标兑现，且毛利率显著改善。
