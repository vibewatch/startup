  - id: TV005
    title: 假设破裂与终止触发因素
    columns:
      - 触发因素
      - 门槛 / 事件
      - 对投资假设的传导
      - 行动含义
    rows:
      - - ERCOT 电网服务收入坍塌
        - 到 2026 年 Q4，收入跌破 $20/kW/年
        - 单位回本期超过电池可用寿命（~10 年）；叠加收入模型失效；2026 年预测无法达成
        - 退出或减仓；确认悲观情形
      - - Gen 3 制造成本超支
        - 到 2026 年底，单台电池净成本仍高于 $10,000
        - 指向工厂执行失败；全国铺开后资本强度成倍放大；已投入 $1.3B 可能不够
        - 暂停跟投；任何后续投资前要求制造审计
      - - 全国扩张停滞
        - 到 2026 年 Q4，ERCOT 以外仍无确认商业部署
        - 乐观情形收入增长需要多州扩张；按当前安装速度，仅 ERCOT 会把 2027 年收入压在 $50M 以下
        - 建议从观察名单下调为放弃
      - - 流失加速
        - 任一 12 个月 cohort 客户流失率超过 5%
        - 收入耐久性受质疑；零售电力合约执行存在风险；竞品替代侵蚀模型
        - 深入客户级尽调；可能说明产品市场匹配存在结构性上限
      - - 降估值轮或困境融资
        - 新股权轮估值低于 $3B，或债务融资票息 >15%
        - 优先权结构侵蚀；说明投资人对近期路径失去信心；高管留任风险上升
        - 从零重估假设；即便恢复，优先权结构也可能损害回报
      - - ERCOT ADER 或 VPP 补偿政策逆转
        - PUCT 修改规则，降低 ADER 计划参与度或补偿费率
        - 直接冲击主要电网服务收入层；影响所有客户的 ERCOT 经济模型
        - 必须重跑情景分析；折现率需加入监管风险溢价
    notes: 阈值基于判断，并来自 GreenCarFuture 单位经济分析、Modo Energy ERCOT 收入预测和可比资本强度研究。 监测需要持续获得 ERCOT 市场数据和公司财务。
