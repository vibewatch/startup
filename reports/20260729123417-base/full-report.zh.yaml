  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - ADER 试点解散或容量冻结
        - PUCT Project 53911 申报；ERCOT 市场通知
        - 试点终止通知，或上限连续 2 个以上季度冻结在低于 Base Power 注册容量的水平
        - 投资逻辑破裂——批发收入机制被移除；重新评估商业模式可行性
      - - ERCOT 辅助服务收入压缩到零售成本基准以下
        - 每月 ERCOT BESS 收入指数（Enverus/Modo Energy）
        - 平均 BESS 收入连续 2 个季度 < $10/kW-year
        - 重大——跟踪套利或 RTC+B 收入能否补足；需要利润率分析
      - - PUCT REP 许可执法或客户投诉升级
        - PUCT 案卷搜索 Base Power 案卷；BBB 投诉数量
        - PUCT 启动正式投诉程序或发出违规通知
        - 投资逻辑破裂风险——REP 许可暂停会叫停客户增长；立即尽调
      - - 客户家中发生电池起火事件
        - 新闻监测；CPSC Saferproducts.gov 申报；NFPA 报告
        - Base Power 安装地点出现任何已确认热失控事件
        - 重大触发项——立即调查；评估产品责任和召回风险
      - - 车队管理平台网络安全被攻破
        - SOC 2 审计状态；NERC 合规沟通；公开事故披露
        - 确认有人未经授权访问车队管理系统，或出现大规模调度事件
        - 严重——电网可靠性事件；ERCOT 罚金；声誉受损；监管调查
      - - Factory One 未达到部署容量目标
        - 每月设备部署率（已部署 MWh）相对计划
        - 工厂投产后连续 3 个月部署速度低于 10 MWh/月
        - 重大——影响供应链独立假设；退回进口硬件采购
      - - 核心高管离职（CEO 或 COO）
        - LinkedIn / 公关监测；投资人沟通
        - CEO 或 COO 离职且没有既定接班安排
        - 投资假设风险——评估继任者质量和组织知识交接
      - - 固定费率合约亏损超过准备金缓冲
        - 季度财务披露或投资人报告（如有）
        - REP 利润率连续 2 个以上季度转负
        - 假设破裂——当前批发电价环境下，固定费率模型不可持续
    notes: 终止标准指一旦发生就必须立即重估投资假设的事件。行动含义从「监测」（低严重性） 到「假设破裂」（高严重性，需要考虑退出）不等。
