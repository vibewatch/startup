      - number: '8.5'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >
              Base Power 最可能的退出路径是 2027–2029 年上市（IPO），前提是公司证明年收入达到 $150–300M，并在多个市场持续实现正向单元经济性。Forge Global
              二级市场挂牌标注「Confidential Filing」状态，与 IPO 准备工作一致，但截至 2026 年 5 月并不等同于已确认提交 S-1。2026 年气候科技 IPO 窗口正在打开——X-energy
              $1B IPO（首日上涨 25%）和 Fervo Energy 约 $3B IPO 申请显示机构对能源基础设施叙事有胃口——但 K 型市场现实（核能和地热更受青睐，重硬件气候科技则弱一些）意味着 Base
              Power 必须证明盈利或接近盈利，公募市场才会支撑增长溢价。

              战略收购是次级退出路径。潜在买方包括：寻求 DER/VPP 资产的大型美国公用事业公司（NRG、Exelon、Dominion）；希望把能源做成住宅配套差异化的全国住宅建造商（Lennar
              已是渠道伙伴）；或希望搭建住宅能源平台的能源巨头（Shell、BP）。Uplight/Octopus 交易和 OhmConnect/Nest 合并，为 VPP 相邻资产在 $1–2B
              估值区间的非上市市场收购提供了先例；这意味着，收购方若要给出高于当前 $4B 价格的溢价，需要 Base Power 拥有很大规模或独特战略契合度。

              任何投资决策前的关键尽调缺口包括：（1）完整客户群组的经审计单元经济性，包括当前市场价格下每块电池的 ERCOT 电网服务收入；（2）四轮融资的股权结构表和优先权结构细节；（3）Gen 3
              制造计划状态——时间表、单台成本和规划产能；（4）非 ERCOT 市场的全国扩张计划，包括监管路径和市场进入细节；（5）单一已报告流失案例之外的客户级流失数据，包括 12 个月和 24 个月群组留存曲线。

              打破投资论点的触发器包括：ERCOT 电网服务收入跌破 $20/kW/year（单位回收期超过电池有效寿命的阈值）；到 2026 年底，单台制造净成本仍高于 $10,000（说明 Gen 3 偏离轨道）；18
              个月以上客户群组流失率加速至 5% 以上；以及到 2026 年 Q4 仍未拿下任何非 ERCOT 市场。任何单一触发器都会实质性削弱乐观情景；两个或更多同时出现，则悲观情景就会成为基准情景。
