      - number: '3.2'
        title: 直接竞争对手画像
        blocks:
          - type: paragraph
            body: >
              **Tesla（Powerwall + Autobidder + Tesla Electric）**是 Base Power 最可信的多维度对手。Tesla Powerwall 3 容量 13.5
              kWh、连续输出 11.5 kW，在 Texas 每台安装价 $10,000–$13,500（未计 Oncor $4,500 返利）。Tesla 在 ERCOT 以 REP 身份运营 Tesla
              Electric，其 Autobidder 软件把住宅 Powerwall 聚合成电网服务资产——与 Base 是同一商业模式。Tesla 德州 VPP 项目给房主的补偿约为每台 Powerwall 每月 $33
              账单抵扣，外加出口电量约 $0.05/kWh，典型参与者总补偿约 $786/年。Tesla 的优势是品牌认知、内部电芯制造、EV 集成和深厚 Autobidder
              市场经验。劣势是前期成本高、市场进入以太阳能为中心，且 13.5 kWh 电池小于 Base 的 25 kWh 单元——这会影响 ERCOT 4CP 输电成本管理和单机电网收入。Tesla
              架构还要求房主购买资产（消费者侧重资产），不是 Base 提供的轻资产订阅。


              **Sunrun（NASDAQ: RUN）**是美国最大住宅太阳能加储能提供商，拥有超过 100 万太阳能客户和 116,000+ 已安装储能系统。在 Texas，Sunrun 已与
              NRG/Reliant（目标到 2035 年建成 1 GW VPP，初始推出 150 MW）和 Vistra/TXU Energy 建立合作。Sunrun 的 California CalReady 项目在
              16,000 户住宅中实现平均 48 MW 峰值调度，是住宅聚合规模化的强证明。Sunrun 的竞争弱点是高债务（负债 $14 B+）、约
              $7,000/客户的获客成本，以及据报较低的净推荐值，反映安装延误和售后服务问题。Sunrun 要求房主已有或安装太阳能，因此结构上无法服务非太阳能住宅——Base 的纯电池模型覆盖两个细分。


              **Sonnen（SOLRITE VPP）**于 2026 年 2 月与 SOLRITE Energy 在 ERCOT 启动，目标到 2026 年底达到 10,000 名客户和 600 MWh/144 MW
              容量。Sonnen 的方案——60 kWh 储能、$20/月、12¢/kWh 全包零售电价——在每 kWh 备用容量价格上直接竞争 Base 会员方案。Sonnen 由 Shell 持有（2019
              年收购），拥有强资产负债表支持。Sonnen 电池（ecoLinx generation）面向零售买家提供 15,000 次循环 / 15 年质保，安装成本 $1,200–$1,500/kWh——在订阅 VPP
              语境中重新定位的高端硬件。Sonnen 第 11 代电池正随 Solrite 部署，根据堆叠数量提供 6/12/18 kW 功率输出。200 MW ADER 试点上限是共同约束；Sonnen 144 MW 目标与
              Base 直接争夺这部分监管空间。


              **Generac（PWRcell + Enbala/Concerto DERMS）**是美国备用发电机主导品牌（约 75% 市场份额），并通过 PWRcell 住宅储能和 Enbala/Concerto
              DERMS 平台转向清洁能源。截至 2026 年初，Generac 清洁能源部门约占总收入 60%。Generac 住宅电池容量可扩展至 9–18+ kWh，具备强浪涌能力，并支持太阳能 DC 耦合。不同于
              Base，Generac 通过经销商网络销售，而不是直接持有资产；它争夺同一批 Texas 安装商心智和房主注意力。Generac Power Systems 还销售备用丙烷 / 天然气发电机（安装后
              $10,000–$20,000+），这是 Base 正在替代的主要现状方案。


              **Fluence/AutoGrid（软件层竞争者）**瞄准公用事业 DERMS 和 VPP 软件市场。Fluence（NASDAQ: FLNC）约有 1,670
              名员工，运营成熟的公用事业级和电网服务软件栈；AutoGrid 被 Schneider Electric 收购后现归入 Fluence，为公用事业公司提供 VPP 编排和 DERMS
              软件。这些玩家不争夺房主，而是争夺 Base 在受监管市场扩张中也想拿到的公用事业合约——如果公用事业公司采购 AutoGrid 作为 DERMS，就可能把电池队列管理内化，而不是外包给 Base。
