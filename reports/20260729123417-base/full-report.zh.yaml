      - number: '4.5'
        title: 图表
        blocks:
          - type: callout
            title: 资本强度与收入规模错配，使公司结构性依赖持续股权融资
            body: >-
              Base Power 已融资约 $1.3B，而 2025 年收入仅 $12M，资本效率比约 108:1——也就是每 $1 年收入背后， 公司已投入超过 $100
              投资人资本。这个比例符合早期硬件平台特征，并不天然构成否决项，但意味着近期生存必须以有利估值 持续获得股权融资。若投资人风险偏好恶化——无论由利率变化、政策风险（ITC 退出或 FEOC
              限制）还是收入目标落空驱动—— 电池队列达到现金流盈亏平衡前，公司就可能遭遇融资危机。
            calloutType: risk
            claimRefs:
              - CI005
              - CI016
              - CI017
              - CI032
          - type: callout
            title: 批发套利是回本引擎，但仍未验证且依赖市场
            body: >-
              Base Power 单元经济被归因于 3.5 年回本，前提是批发套利成为主导收入贡献者；但这一收入流在单台层面未经验证，并依赖 ERCOT 价格波动持续、ADER 项目成熟和 QSE 成本结构。截至 2025
              年中，所有参与方合计只有 15 MW ADER 容量处于活跃调度， 单一聚合的盈亏平衡规模约 15–20 MW。若新增输电或发电资产降低 ERCOT 电网波动，或监管变化限制 ADER 参与，套利层可能
              显著收缩。
            calloutType: risk
            claimRefs:
              - CI007
              - CI027
              - CI028
              - CI029
          - type: callout
            title: 公用事业容量租用协议形成第四层收入，可改善电池队列经济性
            body: >-
              Austin Energy 交易提供了战略模板：同一批硬件在既有零售和套利收入之外，还能为 Base Power 带来稳定、非波动的容量付款。 40 MW 每年 $4.08M，隐含费率为
              $8.50/kW-month，带来温和但稳定的增量收益。若在 ERCOT 内更多市政公用事业和合作社 复制，容量租用协议可在 200–400 MW 签约容量下贡献每年 $20–$40M
              收入，在不增加额外硬件部署的情况下显著改善混合 资本回本。
            calloutType: insight
            claimRefs:
              - CI008
              - CI009
              - CI036
          - type: callout
            title: $70M 的 2026 年收入预测，取决于 Gen 3 制造爬坡成功
            body: >-
              公司 2026 年 $70M 收入预测取决于 Factory One 能否放大 Gen 3 电池生产。CEO 已公开承认，制造爬坡到 2026 年中期 都会「困难」。若 Gen 3 产量低于目标，每月 20 MW
              的部署速度就无法靠进口或外包硬件维持，除非承受显著成本冲击。2026 年 安装量若短缺 50%，收入将约为 $40–$45M，而不是 $70M 目标；这可能迫使公司早于 Series C 跑道原本可支撑的
              时间再次股权融资。
            calloutType: assumption
            claimRefs:
