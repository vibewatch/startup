          - type: callout
            title: 电池调度中的客户利益冲突带来诉讼和监管敞口
            body: >-
              Base Power 可以合法地把客户电池放电至 20% SOC 用于电网交易。社区论坛记录了客户在停电时无法完全获得备电的意外和不满。如果类似 Winter Storm Uri 的恶劣天气事件中，Base
              Power 客户在电池已被调度创收的情况下没有拿到预期备电，声誉损害可能很严重，PUCT 投诉或集体诉讼也可能随之而来。这是最清晰的不利客户影响场景，应列为尽调重点。
