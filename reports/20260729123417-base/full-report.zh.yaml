      - number: '2.5'
        title: 证据要点
        blocks:
          - type: callout
            title: ERCOT 辅助服务收入崩塌重塑 VPP 经济模型
            body: >-
              ERCOT 电网级电池收入从 $149/kW（2023）降至 2025 年预计约 $17/kW（Enverus），跌幅约 90%。同期，辅助服务占 BESS 收入的比例从 84% 降至 48%。住宅 VPP
              还有独立于批发价格的客户账单平滑价值，但在当前 ERCOT 环境下，Base Power 的电网服务收入上行空间已被实质压缩。稀缺事件高度不稳定；2026 年夏季高峰将是收入模型的关键测试。
            calloutType: insight
            claimRefs:
              - CM027
              - CM028
          - type: callout
            title: 相互矛盾的市场规模估算显示高度不确定性
            body: >-
              美国住宅储能 TAM 在不同分析师报告中的跨度达到两个数量级——从 $174M（P&S Intelligence，2025，纯硬件）到 $3.5B（Emergen
              Research，2024，更宽口径）——取决于是否计入 VPP 电网服务收入、订阅变现和公用事业容量合约。投资人不应使用单一「大市场」估算；对 Base Power 当前模式而言，真正可服务市场更接近
              ERCOT SOM（1% 渗透率下 $42–$84M/年），而不是 $3.5B 美国头部数字。
            calloutType: risk
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM031
          - type: callout
            title: IRA 30% ITC 提供持续到 2032 年的顺风
            body: >-
              Inflation Reduction Act 的 30% 住宅电池投资税收抵免（Investment Tax Credit）适用于 2023 年至至少 2032 年安装的独立电池系统（≥3
              kWh），无论是否搭配太阳能。这大幅降低住宅电池部署的有效硬件成本，并支撑 Base Power 所安装系统的经济性。本土制造（Base Power 计划中的 Austin 工厂）也可能获得额外 IRA
              制造抵免，进一步改善利润率。
            calloutType: strength
            claimRefs:
              - CM023
              - CM024
          - type: callout
            title: ERCOT 2026 年夏季稀缺事件是重大收入变量
            body: >-
              Base Power 订阅模型部分依赖 ERCOT 批发市场电网服务收入，以补贴较低客户价格。历史上，极端夏季高温事件（2023 年峰值价格 $5,000/MWh）在短短几天内带来超额 BESS 收入。如果
              2026 年夏季偏温和，电网服务收入将很少，模型的独立订阅经济性会受到检验。这是一个未解尽调问题，需要等 2026 年夏季复盘。
            calloutType: assumption
            claimRefs:
              - CM026
              - CM027
              - CM029
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Base Power 在住宅储能市场的位置很少见：它同时是资产所有者、零售电力供应商（REP）、软件平台和公用事业服务公司。这种垂直整合意味着其竞争格局横跨四个不同集群。


              **直接 VPP 聚合商和电池即服务提供商**是最接近的替代品，因为它们追求同一类家庭场景——部署电池获取电网套利收入，同时以较低自付成本给房主提供备用电价值。Sonnen（Shell 子公司）及其德州零售伙伴
              SOLRITE Energy 于 2026 年 2 月在 ERCOT 推出纯电池 VPP，提供 60 kWh 储能、$20/月会员费，以及 12¢/kWh 的「全包」零售电价——直接撞上 Base
              $19–$29/月会员模型。Sunrun（NASDAQ: RUN）是美国最大住宅太阳能加储能公司，正通过与 NRG/Reliant 的多年合作在 Texas 建设 1 GW VPP，并另与 Vistra/TXU
              Energy 推进电池聚合项目。截至 2026 年，Sunrun 已在全美部署超过 116,000 套储能系统，CalReady VPP 向 California 电网交付 51 MW
              峰值——验证了住宅聚合模型，也让 Sunrun 成为 Texas 公用事业合作社带宽和房主入网的直接竞争对手。


              **争夺同一安装位置的硬件 OEM**包括 Tesla（Powerwall 3）、Enphase（IQ Battery 5P）、Generac（PWRcell）、LG Energy Solution（RESU
              Prime）和 FranklinWH（aPower 2）。这些公司通过第三方安装商销售，而不是自己持有并直接运营资产。Tesla 还通过 Tesla Electric 以 REP 身份运营，并借
              Autobidder 运行自己的 VPP，使其在 ERCOT 成为 OEM+聚合商混合型竞争者。Tesla Powerwall 3 单机 13.5 kWh，而 Base 单机 25 kWh；Tesla 在
              Texas 的安装成本为每台 $10,000–$13,500，相比 Base $695 安装费，Base 在消费者经济性上优势明显。


              **需求响应和智能恒温器替代方案**不部署电池，却争夺同一组电网服务价值。Renew Home（由 Google Nest Renew 与 OhmConnect 合并而成）按入网住宅数计算，是北美最大住宅
              VPP，依靠智能恒温器、智能插座、热水器和 EV。截至 2026 年 5 月，OhmConnect 已把 Texas 客户迁移至 Direct Energy，并以 Renew Home 品牌运营。这些平台竞争同一
              ERCOT ADER 试点容量上限（总计 200 MW），也争夺房主注意力，但无法在停电时提供全屋备用电——这正是 Base 的核心差异化。


              **现状替代和既有电网**仍是主流选择。多数德州房主完全没有备用电源，接受停电风险。丙烷或天然气备用发电机（来自 Generac 和 Kohler）是传统韧性方案，安装成本超过 $15,000——Base 用
              $695 入口价攻击这一价格缺口。NRG/Reliant 和 TXU/Vistra 等既有企业通过 130+ REP 服务 3,100 万 Texas
              居民；理论上它们可以在内部打包电池项目，但当前更倾向于与聚合商（Sunrun、Renew Home、Base）合作，而不是直接持有分布式硬件。
