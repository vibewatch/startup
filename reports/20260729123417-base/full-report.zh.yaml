      - - BaseOS 后端
        - 车队编排、能源交易、计费、部署物流
        - Golang/Python；AWS 云；Kubernetes；Terraform IaC；Temporal 工作流
        - 单一云服务商集中（AWS）；宕机可能削弱远程调度
      - - 原生 SCADA / 公用事业 API
        - 公用事业实时调度控制；仪表盘 + API 集成
        - 自研 SCADA；Web 仪表盘；REST/API；可选接入公用事业 EMS
        - 监管风险：ERCOT ADER 节点结算规则审查中；调度规则未定
      - - 连接层
        - 向每块电池下发指令
        - 三重冗余：WiFi（主链路）、4G 蜂窝（备用）、光纤（可用时）
        - <5% 强制停机率（公司声称）；灾害中依赖蜂窝网络
      - - 客户应用
        - 停电通知、SOC 监控、账单查看
        - 移动 / Web 应用；客户可监控但不能控制电池
        - 客户无法手动覆盖控制；调度时 SOC 是否向用户透明呈现
    notes: 技术栈按招聘信息（Built In、Ashby HQ）和公司公用事业页面推断；并非所有组件都有官方技术文档确认。Austin Factory 产能目标为公司口径。
