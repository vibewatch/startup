  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资正反论点
        blocks:
          - type: paragraph
            body: >
              Base Power 的投资论点立在四根结构性支柱上。第一，它在 ERCOT 历史上交出了最快的住宅电池部署速度：截至 2026 年 5 月已覆盖 10,000+ 户、100+ MWh，并称截至 2025
              年末流失率接近零。在资本密集型硬件业务中，这样的执行速度很罕见，也验证了运营模型。第二，垂直整合的“gentailer”结构——制造、安装、持有并运营电池，同时担任零售电力供应商——相较公用事业级 BESS
              形成结构性 CapEx 优势。CEO Zach Dell 的表述是，去掉土地、并网排队等待和传统项目开发开销后，Base 按每部署 kWh 计算可低于公用事业级经济性。第三，Base 已获得 ERCOT
              的聚合分布式能源资源（ADER）资格，分布式机群可以向批发市场投标容量，在零售利润之上叠加一层由政策支持的经常性收入。第四，投资人联盟——Addition（领投）、a16z、Lightspeed、CapitalG（Google）、Thrive
              Capital、Ribbit、Valor、Altimeter、Spark、BOND、Lowercarbon——是美国能源初创公司中少见的高可信跨行业组合，说明其尽调能力强，后续跟投意愿也高。

              反论点同样具体。按 $4B 投后估值、2025 年收入 $12M（333× 倍数）和 2026 年预计收入 $70M（57× 倍数）计算，几乎所有低于 10–20×
              远期收入结果的情景，都意味着入场即亏。ERCOT 电网服务市场——主要可扩张收入层——两年内下跌 90%（Modo Energy 数据显示，电池平均收入从 2023 年 $149/kW 降至 2025 年
              $29/kW，原因是已装 BESS 容量激增 70×）。Base Power Gen 1 系统净成本约 $17,500，在当前市场条件下每年总收入约 $2,053，未计融资成本前回收期已达 8.5
              年。Austin 市 2026 年 3 月与公司共同撤回 $265M 制造激励协议，使国内电池工厂的执行不确定性上升，而该工厂是 Gen 3 降本假设的核心。最后，全国扩张计划依赖复制 ERCOT
              的放松管制零售选择市场结构；这种结构只在少数美国州存在，受监管公用事业市场需要一套根本不同且尚未验证的市场进入打法。

              综合来看，建议是有条件观察名单 / 共同投资立场：模型有差异化，团队也很强，但当前入场价格假设公司能同时兑现多个尚未验证的维度。若投资人能以 ≤$3B 估值进入，并验证 2026 年收入 $70M、且至少一个
              Texas 以外市场成功启动，风险回报才更站得住脚。按当前 $4B 轮次价格进入，只适合长周期、高信念的能源基础设施投资人，并且要把它当作平台押注，而非近期回报交易。
