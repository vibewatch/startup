      - number: '3.5'
        title: 现状方案与替代选择
        blocks:
          - type: paragraph
            body: >
              最大竞争集合并不是其他 VPP 公司，而是德州房主在遇到 Base 之前会选择的现状方案：没有备用电源（接受停电风险）、丙烷 / 天然气备用发电机、可与电网互动的智能恒温器，以及完全没有储能的零售电力计划。


              **无备用电现状：**大多数德州住宅客户经历过一次或多次重大停电事件（Winter Storm Uri 2021、Summer 2023 heat events、Winter Storm Fern
              2024），但尚未安装备用电源。硬件购买的经济门槛是主要阻碍——Base 用 $695 入口价直接解决这一点，而可比发电机或电池替代方案需要 $15,000+。


              **丙烷 / 天然气备用发电机（Generac、Kohler）：**Generac 在美国家用备用发电机市场占有约 75% 份额。安装成本为
              $10,000–$20,000+，停电期间还有持续燃料成本和维护要求。发电机只要有燃料就能无限期运行，但会排放 CO，且需要室外安装位置。Base 面向 GVEC
              会员，将自身方案宣传为相较发电机等类似备用方案「便宜 95%」。在持续多日停电期间，发电机续航优于电池；但对于典型德州停电（根据 Base 电池队列数据，97%+ 少于 3 小时），Base 25 kWh
              电池几乎覆盖所有事件。


              **需求响应项目（Renew Home/OhmConnect、Voltus、Leap）：**Renew Home——由 Google Nest Renew 与 OhmConnect
              合并而成——现在按入网住宅数计算是北美最大住宅 VPP，使用智能恒温器和可控负荷，而不是电池。这些项目提供电网价值（削峰、负荷转移），且没有硬件安装负担，但无法在电网停电时提供全屋备用电，而这是 Base
              最强的消费者价值主张。截至 2026 年 5 月，OhmConnect 已将 Texas 客户迁移至 Direct Energy，并在 Renew Home 平台下运营。


              **分时电价零售电力计划：**Texas 放松管制市场（130+
              REP）提供分时、免费夜间和太阳能回购计划，让房主无需电池也能部分套利电网电价波动。随着太阳能回购价值下降（「太阳能孤儿」），这些计划吸引力减弱，Sonnen/Solrite 的 VPP
              正是切入这一开口。Base 作为 REP，与其他 Texas REP 直接争夺电费账单关系，其竞争性费率取决于电网条件和电池调度收入分享。


              **既有公用事业公司扩张电池项目：**目前作为 Base 合作方的合作社和投资者所有公用事业公司，理论上可以用公用事业级电池采购加 AutoGrid 这类 DERMS 供应商，把分布式电池项目内化。GVEC
              CEO 指出，该合作社评估过「公用事业级、配电网接入电池」，并认为表后资产能提供更优的输电成本降低价值——这目前验证了 Base 模型，但也表明公用事业公司正积极评估所有选项。
            claimRefs:
              - CP031
              - CP032
              - CP033
              - CP034
              - CP035
      - number: '3.6'
        title: 证据要点
        blocks:
          - type: callout
            title: ERCOT 收入压缩对单位经济构成重大威胁
            body: |
              ERCOT 电池辅助服务和套利收入在 2023 至 2025 年下降了 89%（Enverus 数据）。
              Base 对每块 25 kWh 电池的单位收入估算为约 $2,075/年，意味着基准情形下回本期为
              8–9 年——对一家每年员工开支超过 $15M 的重资产公司，这个回报只能算勉强。若 ERCOT
              长期维持低波动，Base 将被迫更多依赖固定的公用事业容量租用合同，而不是现货市场收入；
              这会加快公司转向受监管公用事业模式，但也要求合同期限长于目前 3 年的最低门槛。
            calloutType: risk
            claimRefs:
              - CP025
              - CP026
              - CP028
              - CP029
          - type: callout
            title: 电力合作社伙伴模式筑起耐久分销护城河
            body: |
              Base 的五个德州电力合作社伙伴关系（CoServ 100 MW、GVEC 50 MW、Bandera、
              Farmers Electric 等），给了它一条硬件 OEM 难以复制的 B2B 获客通道。GVEC CEO 称，
              表后资产相比公用事业级电池，能更有效降低输电成本——这是监管和运营层面对 Base 模型的
              验证，也说明它在技术上不同于纯硬件打法。ERCOT 目前没有竞争对手拿到同等规模的合作社合同。
            calloutType: strength
            claimRefs:
              - CP006
              - CP007
              - CP024
          - type: callout
            title: 价格战下，Tesla 和 Sunrun 是规模威胁
            body: |
              Tesla 和 Sunrun 都已经有屋主渠道、自有或合约电池供应，以及监管准入（ERCOT REP 牌照、
              ADER 资格）。如果 VPP 经济性足以支撑激进定价，它们有能力压低价格挑战 Base。一位行业
              分析师指出，Tesla 或 Sunrun「复制 Base 的成功不需要太多条件」，而且这些公司「会赢下任何
              与 Base 的价格战」。Base 的 $1B Series C 和 Austin 制造战略就是为对冲这一场景，但对一家
              2023 年才成立的公司来说，制造执行风险真实存在。
            calloutType: risk
            claimRefs:
              - CP013
              - CP016
              - CP027
          - type: callout
            title: Sonnen/Solrite VPP 是结构最接近、短期最直接的对手
            body: |
              Sonnen 2026 年 2 月推出的 SOLRITE VPP，是结构上最接近 Base 的竞争方案：平台持有电池，
              消费者无前期成本，通过 ERCOT VPP 调度，并设置备电保留上限。主要差异在规模（10,000 户
              vs. Base 更大的覆盖面）、母体实力（Shell 资产负债表 vs. Base VC 资本）和容量（60 kWh
              vs. 25 kWh）。两个项目都瞄准同一个 200 MW ADER 上限，Sonnen 明确计划拿下其中 144 MW。
              这是 Base 在 ERCOT ADER 扩张上最直接的竞争约束。
