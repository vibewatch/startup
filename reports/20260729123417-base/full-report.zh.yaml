      - number: '2.3'
        title: 买方与细分市场图谱
        blocks:
          - type: paragraph
            body: >-
              Base Power 的市场包含三类不同的买方—用户—付款方关系，每一类采用触发因素和预算归属都不同。

              第一类、也是核心细分，是处于放松管制 ERCOT 市场的德州住宅房主。该客户既是用户（受益于停电保护和账单平滑），也是付款方（在 PowerToChoose.org
              上选择竞争性零售电力供应商）。关键采用触发因素是停电焦虑——Winter Storm Uri（2021）和反复出现的夏季峰值进一步放大了这种焦虑——叠加电费波动。2026 年初，德州平均住宅电费达到
              $174/月，电价 15.41 cents/kWh，同比上涨 6.4%。Base Power 针对这一细分市场，将
              $19–$29/月订阅费加一次性安装费（$695–$995）定位为同时对冲停电和夏季高账单的保险产品。

              第二类是与 Base Power 合作部署公用事业控制住宅 BESS
              的电力公用事业公司或合作社。这里付款方是公用事业公司（容量递延价值），用户是房主（备用电力），买方决策者是负责资源规划的公用事业高管。采用由负荷增长、基础设施约束和 ERCOT
              夏季可靠性要求触发。CoServ（330,000+ 电表，North Texas）和 El Paso Electric（465,000 客户）代表这一细分；El Paso Electric 10 MW 试点和
              CoServ 100 MW 项目是两个最大的已运行实例。该细分的预算归属是公用事业公司的资本规划团队，经济逻辑是容量递延，相对于新建发电或输电投资更划算。

              第三类仍处早期，由 Lennar 等住宅建商构成，它们希望把具备电网韧性的住宅作为新房差异化卖点。这里建商充当分销渠道伙伴，房主是最终用户和长期付款方，采用触发因素是住宅销售市场中的竞争差异化。该渠道降低
              Base Power 的获客成本，并扩大其地理触达。
