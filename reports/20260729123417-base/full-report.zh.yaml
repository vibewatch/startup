      - number: '5.6'
        title: 图表
        blocks:
          - type: callout
            title: 垂直整合栈构成可防守护城河
            body: >
              Base Power 把硬件设计、本土制造、专有固件和软件（BaseOS）、自有部署运营和零售电力供应放在同一家公司里。这种整合在 VPP 或电池即服务
              供应商中少见；多数同行依赖第三方硬件（Tesla、Enphase）和第三方软件（AutoGrid、Itron）。这套栈让 Base 不依赖供应商即可迭代成本、可靠性和 调度速度，并在每一层捕获利润。
            calloutType: strength
            claimRefs:
              - CE017
              - CE018
              - CE021
              - CE031
          - type: callout
            title: 20% SOC 底线意味着备电并非全量保证
            body: >
              合同允许 Base Power 为履行 ERCOT 电网交易义务，将屋主电池放至 20% 荷电状态。如果重大停电开始时屋主电池处于 20% SOC——高峰需求热浪中最 可能出现的场景——可用电量约 4.5
              kWh，按重空调负荷计算，相当于约 1–2 小时全屋备电。这正是产品核心张力：让经济性成立的机制（电网套利）， 也是降低备电可靠性的机制。独立电气承包商 Epic Electrical
              已公开指出这一缺口，并建议用补充发电机联锁装置补上。
            calloutType: risk
            claimRefs:
              - CE032
              - CE037
          - type: callout
            title: 中国电芯采购带来关税和供应链敞口
            body: >
              电芯目前来自中国。截至 2025 年 4 月，Base Power CEO 已直接承认关税敞口。Austin 工厂通过在美国本土生产模组、电池包和电力电子，缓解部分
              成本敞口；但在建立非中国供应链前，电芯仍是中国来源投入。美中关税升级（Section 301 等措施）可能显著抬高电芯成本、压缩利润，或迫使公司在锁定 本土电芯来源前调整电池定价。
            calloutType: risk
            claimRefs:
              - CE033
