      - number: '8.4'
        title: 乐观 / 基准 / 悲观情景分析
        blocks:
          - type: paragraph
            body: >
              情景框架以 2027 年收入为主要估值驱动，并用上市和非上市可比组校准退出倍数。概率权重为：乐观 20%、基准 45%、悲观 35%——鉴于执行依赖很重，且 ERCOT 电网服务经济性存在结构性逆风，权重偏向基准
              / 悲观。

              在乐观情景中，Base Power 2027 年收入达到 $250M，路径是扩张到另外三个放松管制市场（如 PJM/Pennsylvania、Illinois、New York），以 $5,000 净成本部署
              Gen 3 电池（较 Gen 1 下降 40%），并在 2025 年 12 月 RTC+B 计划创造新优化机会后，将 ERCOT 电网服务收入维持在 $50/kW/year 以上。按 20–25×
              远期收入计算，隐含退出估值为 $5–6.25B。对 C 轮投资人而言，这只意味着温和正回报（基于 $4B 投后为 1.25–1.56×），凸显即便乐观情景，在当前入场价下也无法给后期投资人带来风险投资级回报。

              在基准情景中，Base Power 2027 年收入达到 $100–130M，主要来自 Texas 扩张外加一个新市场；Gen 3 电池以 $7,000–8,000 净成本部署，制造端逐步改善；ERCOT
              电网服务收入稳定在 $35–45/kW/year（与 Modo Energy 和 GreenCarFuture 预测一致）。按 15–20× 远期收入计算，隐含退出估值为 $1.5–2.6B，低于当前 $4B C
              轮价格。这确认：如果没有规模或战略收购方溢价带来的显著倍数重估，当前价格在基准情景下站不住脚。

              在悲观情景中，RTC+B 计划未能有效抵消持续容量饱和，ERCOT 电池收入进一步降至 $15–20/kW/year；Gen 3 工厂延期，全国扩张又受非 ERCOT 市场监管复杂性限制。2027 年收入停在
              $30–50M，Base 被迫下轮降估值融资或陷入运营困境。按 $40M 收入基数和 10× 远期收入计算，隐含估值为 $400M——较当前入场价亏损 90%。

              跨情景概率加权期望值约为 $2.2–2.5B，明显低于当前 $4B 入场价。这确认了根本投资张力：Base Power 确实是创新平台，但 $4B 入场价已经打包了 5 到 7 年尚未在全国规模上证明的执行成果。
