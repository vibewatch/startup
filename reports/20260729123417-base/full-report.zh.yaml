      - number: '5.2'
        title: 安装流程与部署运营
        blocks:
          - type: paragraph
            body: >
              Base Power 的部署运营被组织为一座「Deployment Factory」——一套可复制的自有流程，为各个 AHJ（属地主管机构）辖区协调
              许可、物流、排期和电气安装。流程从虚拟现场勘查开始，评估配电盘配置、可用户外空间和 HVAC 负荷；多个主配电盘或异常配置的 房屋可能被拒。合格住宅由 Base 自有电工团队排期安装；截至 2025 年 10
              月，团队约每天完成 20 套系统，是 2025 年 3 月速度的 两倍。公司披露的部署速度是每年覆盖已上线都市区 1–2% 的独栋住宅；按每次部署平均 20 kW 计算，Base 理论上可在拥有 500,000+
              独栋住宅的市场（规模接近 Denver、Charlotte 或 San Diego）一年内达到 100 MW 容量。这比传统公用事业级并网周期快 10 倍。

              对 Lennar 等住宅建商渠道伙伴，Base 直接把电池安装嵌入住宅建造流程，让电池从第一天起成为房屋电气系统的一部分——消除标准 渠道面临的改装许可摩擦。截至 2025 年 4 月，Base 已服务约 20
              个 Lennar 社区，覆盖停电高发的德州市场。协议期内服务和维护 均由 Base Power 负责；屋主无法控制电池，也不能把第三方电池或储能系统（如 Tesla Powerwall、Enphase IQ
              Battery）接入受管 电池队列。

              2026 年 3 月签署的 CoServ 100 MW 项目是 Base 迄今最大项目，代表约 5,000 次部署，平均每户两块电池（50 kWh）。El Paso Electric DESPP 试点（2026
              年 2 月）采用「表前」拓扑，Base 电池连接在电表的公用事业侧，而不是表后；这让 EPE 可以在高峰需求时直接服务家庭 和电网，结构上不同于 Base 标准的表后模式。
