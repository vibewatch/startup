      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              Base Power 所在市场最强的增长驱动，是德州结构性用电需求增长与住宅 VPP 变现监管支持同时出现。人口增长、数据中心建设和电气化让 ERCOT
              电力需求快速上升，促使州监管机构一边简化住宅电池许可，一边扩大 ADER 试点。IRA 对独立住宅电池储能提供 30% 联邦投资税收抵免（Investment Tax Credit，ITC，至少有效至 2032
              年），把电池采购的有效成本降低近三分之一，并直接改善 Base Power 硬件端单位经济。

              FERC Order 2222 于 2020 年最终确定，到 2026 年进入高级实施阶段，清除了聚合 DER 参与 FERC 管辖 ISO 批发市场的障碍（ERCOT 不在其中，因其属州级市场）。尽管 Base
              Power 当前德州市场不受 FERC 管辖，Order 2222 仍为 Base Power 计划进入的扩张市场提供全国模板。在 ERCOT 内部，由 Public Utility Commission of
              Texas（PUCT）监督的 ADER 试点承担同样功能，并在 2025 年中通过 Phase 3 将上限扩至 160/80/80 MW。

              关键约束包括：（1）ERCOT 电网级 BESS 收入压缩——平均电池收入从 2023 年 $149/kW 降至 2025 年预计约 $17/kW，压缩电网服务收入池，住宅 VPP
              能够汲取的空间随之缩小；（2）房主切换成本和入网摩擦，客户必须承诺多年电池生命周期协议；（3）联邦政府更迭下的 IRA 政策风险，可能削减 30%
              ITC，或对上游电池部件加征关税；（4）快速部署的资本强度——部署 100 MW 住宅储能需要大规模硬件、人工和资产负债表融资；（5）ERCOT 2 秒级 ADER
              遥测要求下的互操作和遥测门槛，抬高了聚合商技术标准。

              一个重要负面信号是：ESS News 和 Enverus 在 2025 年末报道，ERCOT BESS 运营商年初至今盈利率低于 2.2%，能源套利未能抵消辅助服务价格崩塌。这直接约束 Base Power
              可抵扣客户账单、维持有竞争力订阅价格的电网服务收入。如果 2026 年夏季高峰没有出现稀缺事件，Base Power 收入模型将面临利润率压力。
