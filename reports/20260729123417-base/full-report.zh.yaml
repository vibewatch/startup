      - number: '6.5'
        title: 扩张与集中度风险
        blocks:
          - type: paragraph
            body: >
              Base Power 目前客户集中度极高：基本 100% 收入来自 ERCOT 内的德州屋主。其中，放松管制的「发电零售一体化」模式（叠加租赁、零售和套利收入）只在五个放松
              管制公用事业区域可用（Oncor、CenterPoint、TNMP、AEP Central、AEP North）。公用事业伙伴渠道触达不同客户池——无法使用零售 REP 产品的合作社成员——但这些容量
              租用或仅批发交易为 Base 带来的经济性，显著薄于完整发电零售一体化栈。


              2026 年 4 月推出的无电池「Base Energy」计划，把可服务客户池扩大到租户和公寓住户，这是超越独栋屋主原型的第一个分层扩张信号。德州之外的地理扩张目前包括 伊利诺伊州初步上线，但关键问题是 Base
              能否在 ERCOT 外复制其放松管制客户获取和电池经济性打法。El Paso Electric 受监管区域试点是公用事业容量租用经济性的一个 实地测试；2026 年 6
              月芝加哥都会区上线则是第二个零售地理市场的首次实地测试；结果尚未披露。


              在合作社层面，头部客户风险中等：CoServ（330,000 个电表）是一项 100 MW 单一协议，若丢失或表现不佳，可能实质影响 2026 年部署目标。同样，Austin Energy 40
              MW、$4.08M/年的容量租用协议是一项集中机构收入承诺，取决于年度预算批准。进入新的德州区域还部分依赖 ERCOT Strategic Transmission Expansion Plan
              （STEP），而该计划需要多年执行。
