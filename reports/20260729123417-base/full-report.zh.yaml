  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与市场规则风险
        blocks:
          - type: paragraph
            body: >-
              Base Power 夹在三套监管框架之间：ERCOT 市场规则、PUCT 零售电力供应商（REP）认证，以及 ADER 试点。任一框架都可能单方面改写公司的经济性或运营权限。

              ERCOT NPRR 1186 于 2024 年 4 月 11 日获批、6 月 27 日生效，要求提供辅助服务的储能资源在荷电状态（SOC）上留足余量，覆盖完整一小时义务期。电池运营商若未维持规定
              SOC，将面临最高每五分钟 $25,000 的执法罚款。批评者认为这套罚则有歧视性：火电机组只有实际交付失败才受罚。PUCT 2024 年 1 月最初发回 NPRR
              1186，担心规则即使在电池完全履行调度义务时也可能处罚，从而压制储能投资；委员会 2024 年 4 月批准了较缓和版本。Eolian 等行业参与者警告，NPRR 1186
              将「大幅减少储能参与辅助服务市场，并削弱竞争」。2025 年 12 月上线的 RTC+B（Real-Time Co-optimization plus
              Batteries）用协同优化调度取代了这套临时框架，但也抬高了算法能力门槛，并压缩了依靠市场设计缝隙获得的结构性 alpha 收入。

              Base Power 通过 ADER（聚合分布式能源资源）试点把住宅电池池化后参与批发市场；该项目仍只是 PUCT Project No. 53911 约束下的试点。到 2025 年 10 月，ERCOT
              将全系统 ADER 容量上限从 160 MW 提至 200 MW，并把 QSE 集中度上限从 20% 提至 50%。但 ADER 仍是试点，ERCOT 与 PUCT
              可以在相对短通知期内修改准入规则、调整容量上限，或终止试点——这直接威胁 Base Power 的主要创收机制。据报道 Base Power 参与了 ADER 试点，但未能在 PUCT Project No.
              53911 公开文件中找到确认。

              作为 Texas 持牌 REP，Base Power 必须在 3 月 5 日前提交年度报告、8 月 15 日前提交半年度报告，维持信用证（少于 50,000 个 ESI ID 为 $750,000；超过则为
              $1.5 million），并在 15 天内回应提交至 PUCT 的客户投诉。PUCT 可因违反 Public Utility Regulatory Act 或委员会规则而暂停或撤销 REP 牌照。Winter
              Storm Uri 之后的立法改革（SB 6、SB 7、SB 1287 及相关法案）也让 PUCT 的监管姿态更积极；ERCOT Protocol Revisions 现在需要 PUCT 批准。

              并网成本风险也在上升：PUCT 修订后的 16 TAC §25.195（2026 年 1 月 1 日生效）把超过 $14 million（≤138 kV）或 $20 million（138 kV
              以上）的并网成本直接分摊给接入的发电资源。Base Power 扩大工厂直供硬件装机时，这会形成成本敞口。NERC 的 Texas RE 已把包括电池在内的逆变器型资源合规列为 2026
              年重点审计领域，进一步增加合规成本和文档负担。
