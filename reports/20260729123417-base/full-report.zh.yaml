  - id: FV001
    title: 投资建议逻辑流
    type: flow
    layout: standard
    summary: 从证据支柱到有条件正面建议的决策链，追踪市场、产品、单位经济和估值输入。
    data:
      nodes:
        - id: n1
          label: 部署速度（强）
          description: 截至 2026 年 5 月进入 10,000+ 户住宅、100+ MWh；到 2025 年底接近零流失；2025 年末运行速度约 20 MW / 月
        - id: n2
          label: 电网服务收入（反向）
          description: 2025 年 ERCOT 电池收入下降 90% 至约 $29/kW；结构性饱和可能持续到 2026 年
        - id: n3
          label: 垂直一体化模式（有希望）
          description: 自有并运营电池，同时零售电力；若制造规模化，CapEx 有结构性优势
        - id: n4
          label: 制造执行（未验证）
          description: 城市激励交易于 2026 年 3 月告吹；Gen 3 工厂尚无确认租约；本土成本曲线未验证
        - id: n5
          label: 全国扩张（未验证）
          description: ERCOT 特有的放松管制；非得州市场尚无确认上线；PJM / NY 监管更复杂
        - id: n6
          label: 估值信号（偏贵）
          description: 2025 年收入 $12M 对应 $4B 估值（333x）；概率加权 EV 约 $2.2–2.5B，低于当前进入价格； 基准情景意味着投资亏损
        - id: n7
          label: 有条件观察名单 / 跟投
          description: 进入估值需 ≤$3B，并验证 2026 年收入和一个非 ERCOT 市场上线；若估值高于 $4B 且无法进入 尽调资料室，则放弃
        - id: n8
          label: 必要证据门槛
          description: 经审计的单位经济；股权结构表和优先权栈；Gen 3 成本曲线；非 ERCOT 市场计划
      edges:
        - from: n1
          to: n7
          label: 支撑
        - from: n2
          to: n6
          label: 施压
        - from: n3
          to: n7
          label: 有条件支撑
        - from: n4
          to: n6
          label: 引发疑虑
        - from: n5
          to: n6
          label: 限制牛市情景
        - from: n6
          to: n7
          label: 约束进入估值
        - from: n8
          to: n7
          label: 设置进入门槛
    claimRefs:
      - CV007
      - CV008
      - CV014
      - CV015
      - CV017
      - CV018
      - CV033
  - id: FV002
    title: Base Power 估值对收入倍数和 2026 年收入的敏感性
    type: bar
    layout: standard
    summary: 在不同 2026 年收入情景和退出倍数假设下，测算 Base Power 隐含估值，并以 $4B Series C 估值为锚。
    data:
      series:
        - name: 10x 远期收入
          points:
            - label: $40M 收入
              value: 0.4
            - label: $70M 收入
              value: 0.7
            - label: $100M 收入
              value: 1
            - label: $150M 收入
              value: 1.5
        - name: 20x 远期收入
          points:
            - label: $40M 收入
              value: 0.8
            - label: $70M 收入
              value: 1.4
            - label: $100M 收入
              value: 2
            - label: $150M 收入
              value: 3
        - name: 30x 远期收入
          points:
            - label: $40M 收入
              value: 1.2
            - label: $70M 收入
              value: 2.1
            - label: $100M 收入
              value: 3
            - label: $150M 收入
              value: 4.5
        - name: 57x 当前远期收入（隐含 $4B 进入估值）
          points:
            - label: $40M 收入
              value: 2.3
            - label: $70M 收入
              value: 4
            - label: $100M 收入
              value: 5.7
            - label: $150M 收入
              value: 8.6
    approximationNotes: >-
      收入情景是分析师估算，基于 Sacra 2025 年实际收入（$12M）和公司预计 2026 年收入（$70M）。 倍数参考
      Sunrun（5.6x）、Fluence（1.5–2.5x）和高溢价私营成长可比公司（20–30x）。$4B 进入估值 参考线对应 $70M 的 57x。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV020
      - CV021
  - id: FV003
    title: 各情景下的估值与回报区间
    type: range
    layout: standard
    summary: 从熊市到牛市情景的隐含退出估值区间，锚定 2027 年收入和退出倍数假设，并相对于 $4B Series C 进入估值比较。
    data:
      items:
        - label: 熊市情景退出（35% 概率）
          low: 0.24
          mid: 0.37
          high: 0.5
          unit: $B
        - label: 基准情景退出（45% 概率）
          low: 1.5
          mid: 2.05
          high: 2.6
          unit: $B
        - label: 牛市情景退出（20% 概率）
          low: 5
          mid: 5.63
          high: 6.25
          unit: $B
        - label: 概率加权期望价值
          low: 1.8
          mid: 2.3
          high: 2.7
          unit: $B
        - label: $4B Series C 进入估值（参考）
          low: 4
          mid: 4
          high: 4
          unit: $B
    approximationNotes: >-
      退出倍数：熊市按 2027E 收入 $30–50M 给 8–10x；基准按 $100–130M 给 15–20x；牛市按 $250M 给 20–25x。概率权重：牛市 20%，基准 45%，熊市
      35%。优先权栈和清算条款未公开披露； 高级优先股悬置可能进一步削弱回报。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
      - CV033
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: standard
    summary: 面向 IC 的八维评分，覆盖市场机会、执行证据、竞争护城河、单位经济、监管风险、 估值、资本强度和证据质量。
    data:
      items:
        - label: 市场机会
          note: 强：住宅 DER / VPP 市场年增 21%；住宅电池入网量 2025 年增长 153%；AI 数据中心需求顺风放大 ERCOT 电网压力
        - label: 部署执行
          note: 强：两年内进入 10,000+ 户住宅 / 100+ MWh；2025 年末运行速度约 20 MW / 月；接近零流失；ADER 项目资质已确认
        - label: 商业模式新颖性
          note: 良好：垂直一体化发电零售商具备结构差异化；叠加收入（零售利润率 + 电网服务 + 租赁） 提供部分底线；零售合同带来持久收入
        - label: 单位经济
          note: 弱–中等：Gen 1 回本期按 ERCOT 收入假设不同为 3.5–8.5 年；估算相互冲突； 电网服务收入较 2023 年峰值下降 90%；规模化后未经独立验证
        - label: 竞争护城河
          note: 中等：聚合车队产生的网络效应和数据是真实的，但仍处早期；Tesla Powerwall、Sunrun Battery 和公用事业公司赞助项目构成可信威胁；3 年电力合同嵌入转换成本
        - label: 监管与市场风险
          note: 偏高：ERCOT 辅助服务收入结构性塌陷；RTC+B 改革是不确定的上行；全国扩张需要不同监管关系； 迄今没有不利监管事件，但敞口很高
        - label: 估值与证据
          note: 弱：2025 年收入 333x；2026E 收入 57x；概率加权 EV 为 $2.2–2.5B，低于 $4B 进入估值； 无经审计财务；上市可比公司为 1.5–5.6x；当前倍数只有在赢家通吃大半的情景下才说得通
        - label: 资本强度与融资风险
          note: 高风险：已部署 $1.3B；全国规模化需要数十亿美元 CapEx；城市激励交易告吹； Gen 3 工厂时间表未确认；普通股之前有 $1.3B 优先权悬置
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV020
      - CV021
