  - id: TV006
    title: 最终尽调要求
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 全队列单位经济性
        - 按当前（非峰值）市场费率审计：每块电池每 kW 的 ERCOT 收入、每位客户的月度零售利润、每部署 MWh 的混合全包成本
        - 当前公开估算（Sacra、GreenCarFuture）差异很大；8.5 年与 3.5 年的回本区间让估值完全无法确定
        - 要求访问数据室；用 ERCOT 结算数据和公用事业账单记录交叉核验
      - - 股权结构和优先权结构
        - Series C 后完整股权结构，包括优先股类别、清算优先权倍数（1x 或 2x）、参与权和反稀释条款
        - 以 $4B 入场且有 $1.3B 优先股悬置时，普通股在分配瀑布中结构性劣后；没有这些条款就无法分析回报
        - 法务审阅 COI 和投资人权利协议；Wilson Sonsini 为所有融资轮提供顾问服务
      - - Gen 3 制造计划
        - 已签署的厂房租约或建设合同、设备采购时间表、目标产能（MWh/年）以及至 2027 年的单台成本曲线
        - 整个乐观情形和降本假设都靠它支撑；城市激励协议流产且截至 2026 年 5 月没有确认工厂，是重大反向信号
        - 现场走访；独立制造顾问评审；TDLR 注册数据
      - - 全国扩张监管地图
        - 至少两个 ERCOT 以外零售选择州的入市计划，包括监管要求、并网规则和公用事业合作状态
        - ERCOT 去监管有独特性；PJM、ComEd 和 NY 市场规则差异重大，可能需要不同模式或更长获客周期
        - 目标州监管律师；入市可行性研究
      - - 队列留存曲线
        - 按地域、安装队列和客户分层（新建 / 改造）拆分的客户级流失与留存数据
        - 单一已报告客户流失（2025 年 8 月）不足以支撑统计评估；全国扩张让队列留存成为 LTV 的核心指标
        - 数据室中的 CRM 和账单数据；跨队列独立访谈 50+ 名客户
      - - 应对竞品的准备度
