      - number: '2.2'
        title: 市场规模与 TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              多家分析机构对美国住宅储能市场的估算差异很大，取决于它们计入的是硬件收入、全生命周期服务收入，还是更广泛的能源服务。P&S Intelligence 以较窄口径统计硬件和服务，估计美国住宅储能市场 2025 年为
              $174M，2030 年增至 $604M（CAGR 约 28%）。Emergen Research 采用更宽口径——包括电网服务合约和软件——将 2024 年美国住宅细分市场估值为 $3.5B，并预计到 2034
              年达到 $15.2B，CAGR 为 15.9%。估算差异主要来自是否纳入 VPP 电网服务收入和订阅变现路径。根据 SEIA/Benchmark Mineral Intelligence Energy
              Storage Market Outlook Q1 2026，截至 2026 年初，美国住宅电池储能累计安装约 9 GWh，仅 2025 年就部署 3.1 GWh，同比增长 51%。

              单看 ERCOT，Texas 有望在 2026 年超过 California，成为美国最大电池储能市场；进入 2026 年时，电网级 BESS 容量达到 14 GW，较 2025
              年翻倍。住宅和分布式储能体量小得多，但增长很快。Base Power 已获得资格的 ERCOT ADER 试点，在 2025 年中把全系统上限从 80 MW 扩到能源 160 MW、non-spin 和 ECRS
              各 80 MW。在德州家庭层面，电池价格已降至约 $117/kWh——约为 2023 年成本的三分之一——潜在可服务基数由此扩大。

              对 Base Power 在 Texas 的自下而上 SOM 估算：ERCOT 服务约 1,200 万个住宅电表。若按 1–2% 年渗透率（Base Power 公开目标）计算，对应
              120,000–240,000 户住宅。按平均 20 kW 系统（两块 11.4 kW/25 kWh 电池）和 $29/月订阅费计算，每年每 1% 渗透率可转化为约 $42–$84M
              年化订阅收入，未计电网服务收入。若 ERCOT 达到 1% 渗透率，ADER 容量将约为 2.4 GW 聚合住宅电池队列，远超当前试点上限，说明监管扩容空间才是市场捕获的关键约束，而不是需求或硬件成本。

              全球 VPP 市场——Base Power 的参照同业组——2026 年估值约 $6–7B；根据 GMInsights，仅美国市场到 2035 年预计达到 $11.5B，住宅细分市场 CAGR 为
              22.5%。相互矛盾的估算需要保留：分析师报告对 2026 年全球市场规模的区间从 $4.1B 到 $6.7B，分歧很大，真实反映了「市场规模」究竟统计 VPP 平台收入、DER
              硬件，还是电网服务交易额的口径差异。
