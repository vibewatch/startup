      - number: '7.4'
        title: 附录
        blocks:
          - type: callout
            title: ERCOT 收入压缩是近期商业模式威胁
            body: >-
              ERCOT BESS 辅助服务收入在 2023 至 2025 年间下降 90%，多数运营商盈利率低于 2.2%。Base Power 的低于市场价客户定价依赖持续的电网交易收入。如果 RTC+B
              和市场饱和继续压缩利润率，用电池套利补贴客户电价的经济性将明显走弱。RTC+B 下未来 12–18 个月运营数据，对验证模型至关重要。
