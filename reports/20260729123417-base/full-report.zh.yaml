  - id: FM001
    title: 住宅 VPP / 储能市场规模金字塔（TAM / SAM / SOM）
    type: pyramid
    layout: standard
    summary: 三层市场金字塔，从全球 VPP 市场 TAM 推到美国住宅储能 SAM，再到 Base Power 在 ERCOT 的估算 SOM；SOM 依据公司的渗透率目标和公开定价测算。
    data:
      nodes:
        - label: TAM：全球 VPP 市场
          value: $6–7B annual revenue (2026)
          description: 全球 VPP 平台、DER 聚合和电网服务收入；按 Wood Mackenzie / energy-solutions.co 估算，聚合容量为 75 GW。
        - label: TAM（美国住宅储能）：$3.5B（2024）→ $15.2B（2034）
          value: $3.5B–$15.2B (10-year window)
          description: 美国住宅电池储能硬件、软件和服务；Emergen Research 估算口径包含 VPP 电网服务。更窄的纯硬件估算：$174M–$604M（P&S Intelligence，2025–2030 年窗口）。
        - label: SAM：美国放开零售电力市场的住宅储能 + VPP
          value: ~$1–5B (2026 estimate)
          description: ERCOT、CAISO、NYISO、PJM 范围内，拥有零售电力选择权且可参与 VPP 变现的住宅业主。这是电池订阅模式在财务上可跑通的 TAM 子集。
        - label: SOM：ERCOT 德州住宅市场（Base Power 当前范围）
          value: $42M–$84M/yr (at 1% penetration)
          description: 12M 个 ERCOT 住宅电表 × 1–2% 年渗透率目标（Base Power 披露）× $19–$29/月订阅费。电网服务收入另计；未独立核验。
    approximationNotes: TAM 数字是分析师估算，方法差异很大；美国住宅 SAM 由分析师推算。ERCOT SOM 采用自下而上测算，依据 Base Power 公开披露的渗透率目标和已发布定价，并非公司披露的收入预测。
