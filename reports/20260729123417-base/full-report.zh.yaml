      - number: '8.3'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >
              Base Power 处在住宅太阳能+储能、VPP/DER 软件和能源零售商的交叉点，干净可比公司很难选。最相关的上市可比是 Sunrun (RUN)、Fluence Energy (FLNC) 和 Stem
              (STEM)。Sunrun 是美国最大的住宅太阳能加储能公司，市值约 $3.5B、企业价值 $17.7B，LTM 收入 $2.96B，EV/收入约 5.6×。Fluence Energy
              是公用事业级电池软件与服务平台，FY2025 收入 $2.3B，并指引 FY2026 收入 $3.4B；其交易倍数约为 1.5–2.5× 远期收入。Stem (STEM) 是最警示性的可比：2025 年收入
              $156M、净资产为负，Macroaxis 截至 2026 年中估计破产概率 >80%。Stem 的轨迹说明，资本强度高但缺少粘性的经常性收入模型会带来什么后果——Base Power
              的零售电力订阅能部分缓解，但不能消除这一风险。

              在非上市可比中，Uplight（整合 AutoGrid 的 DER 软件平台）2021 年最后估值约 $1.5B；后来经过出售流程，由 Octopus Energy 持有多数股权，据报道该流程曾寻求约 $1B
              估值——这说明 2021 至 2026 年间，纯 DER 软件公司的估值被压缩。Renew Home（OhmConnect + Google Nest 合并）控制约 3 GW 住宅 VPP 容量，背后有
              Sidewalk Infrastructure Partners，但未披露合并后估值。非上市可比给出的隐含结论是：没有内嵌硬件资产的 VPP 软件公司估值远低于 $1B；Base Power
              以硬件为牵引的模型相对软件同行享有溢价，但也必须承受重资本业务固有的倍数压缩风险。

              Base Power 的 2025 年隐含收入倍数（333×）在任何阶段的可比能源公司中都没有先例；即便早期纯软件 SaaS 公司，也很少在短暂炒作窗口之外长期维持 50–100× 以上倍数。2026
              年远期收入倍数（57×）对超高速增长平台更可辩护，但仍意味着 Base Power 退出时要以其上市可比公司组中位数的 5–10×
              交易。更准确地说，这个估值是平台期权溢价：投资人在为美国放松管制市场中的赢家通吃式住宅电池网络定价，而不是为当前收入定价。只有当网络效应（客户数据、优化算法、规模化低成本制造）能真正抵御 Tesla
              Energy、Sunrun Battery 以及潜在公用事业赞助项目等资本充足对手时，这一溢价才成立。
