      - number: '1.3'
        title: 融资历程与投资人
        blocks:
          - type: paragraph
            body: >
              Base Power 自 2023 年成立以来，已在三轮披露融资中累计募集约 $1.3B。种子 / Series A 阶段提供了初始营运资金，具体细节未公开。公司首个大额披露轮次是 2025 年 4 月完成的
              $200M Series B，主要参与方包括 Thrive Capital、Valor Equity Partners、Andreessen Horowitz（a16z）、Lightspeed Venture
              Partners、Altimeter Capital 和 Trust Ventures。住宅建商 Lennar 也在这一阶段投资。

              六个月后，2025 年 10 月，Base Power 宣布完成由 New York 机构 Addition 领投的 $1B Series C。老股东 Andreessen
              Horowitz、Lightspeed、Thrive Capital、Valor Equity Partners 和 Altimeter 继续参与。新投资人包括 CapitalG（Google
              的独立成长基金）、Ribbit Capital、Lowercarbon Capital、Elad Gil、Spark Capital、BOND、StepStone Group、137 Ventures 和
              Salesforce Ventures。The New York Times 报道称该轮对应 $3B 投前估值；投后估值约 $4B。Dallas Innovates 将 Series C 称为「当年最大
              Series C 轮之一」。

              累计融资约 $1.3B。这些资金正投向 Austin 工厂的本土电池制造、团队扩张，以及德州之外逐州扩张。二级交易或可转债安排尚未公开披露，仍是尽调缺口。
