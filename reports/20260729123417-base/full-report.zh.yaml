      - number: '4.4'
        title: 财务缺口与承保阻碍
        blocks:
          - type: paragraph
            body: >-
              Base Power 在投资人可能掌握的信息与公开可验证信息之间存在显著不对称。收入估算、部署速度、客户数、已部署 MWh 等
              顶线牵引指标可以从分析师来源和新闻稿中获得，但用于确认商业模式的每一项单元经济指标——毛利率、EBITDA、电池利用率、 实际每 MWh
              调度套利收入、单客贡献利润、CAC/回本数据——都未公开且未验证。这形成了一类「公司自称」单元经济指标 （3.5 年回本、近零流失）：从结构模型看合理，但没有独立佐证。


              承保时有几项具体财务风险需要重点看。第一，ERCOT 批发收入取决于市场结构继续有利：ADER 项目仍在成熟期（截至 2025 年中，所有参与方合计仅 15 MW 处于活跃调度），QSE
              费用、充电侧配电电价和遥测成本共同构成门槛，聚合规模约达到 15–20 MW 后经济性才有吸引力。第二，受监管市场扩张路径（El Paso Electric 试点、伊利诺伊州）会剥离零售电力价差和批发
              套利两层，只剩公用事业容量付款；这尚未证明足以支撑 4 年回本。第三，电池制造爬坡有运营风险：CEO 称 Factory One 的 Gen 3 生产到 2026
              年中期会「困难」，成本超支或延误会直接压缩用于规模化部署电池队列的利润空间。


              合同条款披露的 80%/20% 电网与备电分配，会持续带来声誉和监管风险：如果数小时前刚发生电网交易事件，期待全量备电的 屋主可能在真实停电时发现仅有 20% 电量可用。营销价值主张（「48
              小时备电」）与常规运行条件下实际可用备电之间的错配， 是独立屋主评论中最常被提及的负面担忧；如果 PUCT 重新审视分布式能源资源聚合商的消费者保护规则，也可能引发监管审查。
