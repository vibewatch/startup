      - number: '5.4'
        title: 信任、安全、合规与可靠性
        blocks:
          - type: paragraph
            body: >
              Base Power 的 Gen 1 电池系统已完成完整 UL 认证栈：UL 1973（固定应用电池模组安全）、UL 1741（分布式能源逆变器和并网设备安全）、 UL 9540（集成式储能系统级安全）以及 UL
              9540A（热失控火势传播测试证据）。这四项标准组合满足北美市场 AHJ 验收、公用事业并网和屋主 保险的主要要求。地方安装许可遵循各 AHJ 执行的 NEC（National Electrical
              Code）规则；Base 的 Deployment Factory 软件在不同辖区压缩 许可流程。

              Base Power 的运营可靠性指标均为公司自称，尚未经过独立审计：<5% 强制停运率（包括连接和硬件）、亚秒级停电切换、MW 交付与指令功率 误差在 1% 以内。公司称其系统可防护 97%
              的常见电网停电——这个数字来自如下观察：即使在电池可被放至最低 20% 荷电状态时，仍有 3 小时备电， 覆盖 97% 的停电时长。该数字假设家庭负荷适中；德州夏季重度使用 HVAC 时，单块 25 kWh
              电池可在 3–4 小时内耗尽。

              Base 电池队列的网络安全攻击面并不小：数千套联网电池系统，每套都可经 API 控制，可能形成聚合电网扰动向量。NFPA 855 和 NEC 安装标准 适用于安装层面。UL 2900 系列和 IEC 62443
              标准与连接栈相关，但 Base 公开披露中没有具体提及。截至 2026 年 5 月，公开记录未发现监管或 执法行动、召回通知或安全事故。
