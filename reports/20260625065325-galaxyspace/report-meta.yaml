  topStrengths:
    - Real vertical integration from satellite bus and payload design to factory production, terminals, and broadband demonstrations.
    - Strong policy alignment and strategic capital support, culminating in a February 2026 C round and March 2026 IPO-counseling filing.
    - Visible operator and channel proof through PCCW, True, and Thai institutional partnerships that validate real use cases beyond lab tests.
    - Credible technical ambition in phased-array, Q/V-band, inter-satellite, and direct-to-cell architectures.
  topRisks:
    - Revenue, gross margin, cash burn, and exact 2026 round proceeds remain undisclosed, limiting true underwriting.
    - Scaling from an eight-satellite test constellation to a commercial 1,000-satellite-class network is capital intensive and launch dependent.
    - Spectrum, orbital-slot coordination, and deployment timing pressure increase the risk of being outpaced by state-backed and global rivals.
    - Founder control and special voting arrangements concentrate governance risk ahead of any public listing.
  unresolvedGaps:
    - Exact C-round cash proceeds, cap-table economics, and any liquidation or anti-dilution protections are not public.
    - Audited revenue, gross margin, backlog, and recurring-service mix remain unavailable.
    - Public customer evidence is mostly pilot, channel, and demo based rather than contract-value and renewal based.
    - Headcount and legal-entity scope are still ambiguous between group-level company claims and main-entity disclosure.
