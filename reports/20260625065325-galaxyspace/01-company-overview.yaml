company:
  name: GalaxySpace (银河航天)
chapter:
  number: 1
  title: Company Overview
  summary: 'GalaxySpace is a Beijing-based commercial space company that frames itself as China''s leading satellite-internet solutions provider and satellite manufacturer, with a mission built around low-cost mass production, LEO broadband communications, and direct-to-cell connectivity. Official and third-party sources corroborate a progression from the 2020 GS-1a proof satellite to the 2022 six-satellite batch launch, the eight-satellite “Mini-Spider” test constellation, and a 2026 IPO-preparation cycle after a fresh C-round. The main overview tension is not strategic ambition but disclosure quality: public sources support the technical and industrial arc, but still leave gaps on exact lifetime capital raised, exact current customer count, and how group-level headcount maps to the main listing entity.'
sections:
- id: identity-and-mission
  title: Identity, Mission, and Strategic Framing
  body: 'GalaxySpace presents itself as a satellite-internet infrastructure company rather than a narrow component supplier. On its English about and home pages, the company says it is a leading provider of satellite internet solutions and a satellite manufacturer in China, built around independent R&D and low-cost mass production of communication payloads, core components, and satellite platforms. The same official materials frame the addressable product stack broadly: broadband communications, optical remote sensing, SAR, navigation augmentation, spectrum sensing, and eventual 5G/6G integration. Public footprint evidence shows a Beijing headquarters with development or manufacturing capabilities in Xi’an, Chengdu, and Nantong, which matters because the strategy is industrial as much as orbital. The one material identity wrinkle is timing and scale disclosure. EqualOcean dates the venture’s origin to December 2016 and names a five-person founding team, while GalaxySpace’s own about page
    narrates growth from April 2018. Officially, the company says it has grown to over 1,000 employees, but QCC reports only 198 insured staff for the main Beijing entity in the 2024 annual report, so the safer overview conclusion is that GalaxySpace operates as a larger group than the single listing entity alone reveals.'
