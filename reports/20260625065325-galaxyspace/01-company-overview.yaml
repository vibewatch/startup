- id: orbital-architecture-and-industrial-base
  title: Orbital Architecture and Manufacturing Strategy
  body: 'GalaxySpace’s orbital approach is best understood as an iterative pathway from single-satellite proof to manufacturable constellation logic. The first proof point was GS-1a, launched on 2020-01-16 from Jiuquan; official and independent sources align that it was China’s first Q/V/Ka-band LEO broadband communications satellite, reached 48 Gbps measured throughput, and completed the country’s first 5G communications test over LEO satellite internet. The next step came on 2022-03-05, when GalaxySpace launched six independently developed LEO broadband satellites that official materials describe as China’s first mass-produced LEO broadband communications satellites. Official narrative then shifts from one-off engineering to constellation economics: stackable flat-panel architectures, flexible solar arrays, phased-array and digital payload integration, and the eight-satellite Mini-Spider test constellation built for persistent communications through inter-satellite handovers. The newest
    public architecture signal is the G3 communication satellite, which combines solar arrays and phased-array antennas into a more than 100-square-meter direct-to-cell platform. This orbital logic is matched by industrial logic. GalaxySpace’s Nantong factory is not a side asset; it is the mechanism that turns low-cost constellation rhetoric into a plausible deployment strategy.'
