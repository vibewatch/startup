  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A reconciled headcount bridge between the official group-level “over 1,000 employees” claim and the QCC-reported 198 insured staff for the main Beijing listing entity.
    whyItMatters: Execution capacity, fixed-cost absorption, and listing-entity readiness depend on whether headcount sits in the core issuer or in affiliates and factory subsidiaries.
    diligencePath: Request the 2024 and 2025 group-org chart, legal-entity employee breakdown, and insured-employee counts by subsidiary from management or IPO working papers.
    relatedQuestionRefs:
    - QO007
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: 2026-c-round
    missingEvidence: Exact February 2026 C-round amount, exact post-money valuation, and a fully sourced pre- and post-round cap table.
    whyItMatters: This chapter can confirm timing and listing momentum but cannot yet underwrite dilution, pricing discipline, or how much runway the fresh round actually bought.
    diligencePath: Obtain the IPO counseling materials, shareholder register, and signed financing documents or management-provided cap-table summary for the February 2026 round.
    relatedQuestionRefs:
    - QO018
    - QO024
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: material
    topic: customer-count
    missingEvidence: Exact current customer count, active accounts, and revenue split by government, telecom, and overseas partner channels.
    whyItMatters: Without customer-count and mix disclosure, investors cannot cleanly separate strategic demo activity from repeatable commercial demand.
    diligencePath: Ask management for a customer cohort table, signed-contract backlog by channel, and the latest internal KPI deck used for board or IPO-prep reporting.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-roster
    missingEvidence: A complete executive and board roster with committee responsibilities and biographies beyond the selectively disclosed founder and international-business roles.
    whyItMatters: Key-person dependence is central to the company-overview chapter, and a fuller org view is needed to judge succession depth and governance maturity before listing.
    diligencePath: Request the current executive committee list, board roster, and IPO governance deck from counsel or management.
    relatedQuestionRefs:
    - QO005
    relatedTableRefs:
    - TO002
