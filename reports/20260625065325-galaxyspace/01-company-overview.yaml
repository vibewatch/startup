- id: capital-investors-and-ipo-window
  title: Capital History, Investor Base, and IPO Preparation
  body: 'GalaxySpace’s financing history shows both classic venture backing and a growing layer of state-linked capital. EqualOcean identifies early backers including JIC Technology Investment, Shunwei Capital, and IDG Capital, while Tencent’s IPO feature adds 5Y Capital, Gaorong, Source Code, and Legend to the 2018 A-round syndicate. The same Tencent piece is useful for directional valuation markers: above RMB 3.5 billion in 2018, above RMB 5 billion in 2019, near RMB 8 billion in 2020, and roughly RMB 11 billion in 2022, with Hurun marking RMB 11.5 billion in 2024. What public sources do not cleanly disclose in the fetched corpus is the exact amount or exact post-money valuation of the fresh February 2026 C round, even though both Tencent and Caixin say the round was completed shortly before the IPO process accelerated. What is clearer is the governance and listing transition. Caixin, People’s Daily, Reuters, and the SSE-hosted Global Times article all report that GalaxySpace filed for
    A-share IPO counseling with the Beijing CSRC on 2026-03-30, with Huatai United Securities as counselor. QCC’s financing page also shows a 2026-03-06 equity transfer involving multiple funds, suggesting cap-table reshuffling right before the listing push.'
