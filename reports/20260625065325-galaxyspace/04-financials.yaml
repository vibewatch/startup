- id: TI005
  title: Capital adequacy and financing dependency table
  columns:
  - Item
  - Public value / status
  - Underwriting implication
  - Source-backed comment
  rows:
  - - Latest disclosed post-money valuation
    - ~RMB32bn
    - Valuation is visible; liquidity is not.
    - C-round valuation is widely reported, but proceeds remain undisclosed.
  - - Exact C-round cash proceeds
    - Undisclosed
    - Cannot convert valuation into runway.
    - Public sources name investors and valuation but not amount.
  - - Current cash on hand
    - Undisclosed
    - Runway cannot be validated.
    - IPO tutoring right after the C round implies continued financing focus.
  - - Direct monthly burn
    - Undisclosed
    - No public runway math possible.
    - Best public proxy is “cash-flow tight / still burning cash” commentary.
  - - Factory capex / scale burden
    - High and still expanding
    - More capacity can dilute fixed costs only if utilization rises.
    - 22 satellites shipped in 2025 versus ~20/month target shows major scale-up still ahead.
  - - Hardware-only constellation capital need
    - ~$100M-$1.5B per 100 satellites; ~$300M-$4.5B per 300 satellites
    - A real network would require far more capital than today’s test system.
    - Estimate uses 2026 smallsat manufacturing benchmarks and excludes launch, gateways, and terminals.
  - - Next funding trigger
    - Convert batch orders into repeat revenue and paid service adoption
    - Valuation depends on execution, not just technology.
    - Adverse commentary explicitly ties downside to delivery slips and weak order conversion.
  - - Debt / project finance obligations
    - No public debt or project-finance schedule found
    - Cannot assess downside liquidity obligations.
    - Public reporting emphasizes equity financing and IPO route, not debt facilities.
  notes: This table intentionally separates what is publicly visible (valuation, capacity targets) from what is still opaque (cash, burn, proceeds, debt).
