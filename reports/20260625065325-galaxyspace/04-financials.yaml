  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-and-margin-disclosure
    missingEvidence: Audited 2025 or latest twelve-month revenue, gross margin, and any backlog-to-revenue bridge.
    whyItMatters: Without revenue and margin disclosure, valuation, burn, and service-quality underwriting all rest on proxies rather than operating fact.
    diligencePath: Request audited income statements, backlog roll-forward, and product-line gross margin by satellite manufacturing, components, and services.
    relatedQuestionRefs:
    - QI017
    - QI026
    relatedTableRefs:
    - TI004
    - TI006
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current cash balance, monthly burn, capex plan, and runway bridge after the 2026 C round.
    whyItMatters: Capital adequacy is the chapter’s core diligence question, and current public sources do not reveal whether recent funding is enough to bridge to scaled service revenue.
    diligencePath: Obtain board budget, treasury statement, capex calendar, and monthly actual-vs-budget cash burn for 2025-YTD 2026.
    relatedQuestionRefs:
    - QI018
    - QI026
    relatedTableRefs:
    - TI004
    - TI005
    - TI006
  - type: private-evidence-only
    severity: material
    topic: c-round-amount-and-terms
    missingEvidence: Exact 2026 C-round proceeds, security terms, dilution, and formal use-of-funds language.
    whyItMatters: The chapter can verify the reported post-money valuation but not the amount of fresh cash or the financing terms that determine runway and ownership dilution.
    diligencePath: Request the signed term sheet, cap table bridge, and board materials approving the C round.
    relatedQuestionRefs:
    - QI025
    - QI026
    relatedTableRefs:
    - TI001
    - TI005
    - TI006
  - type: access-blocked
    severity: material
    topic: official-filing-row
    missingEvidence: Direct retrieval of the company’s CSRC辅导企业 filing row or equivalent official disclosure record.
    whyItMatters: Secondary news sources consistently report the tutoring filing, but direct inspection of the underlying official row would increase confidence in advisor list, filing date, and legal entity details.
    diligencePath: Re-run from a network that can access the CSRC disclosure platform or obtain a screenshot/PDF export of the row from counsel.
    relatedQuestionRefs:
    - QI001
    - QI027
    relatedTableRefs:
    - TI001
    - TI006
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-order-economics
    missingEvidence: Named customer mix, contract gross margins, payment terms, and cancellation rights for GW-related work, antenna orders, and SAR deliveries.
    whyItMatters: The biggest public downside is concentration and low-margin state manufacturing; without contract economics, the margin path remains narrative-driven.
    diligencePath: Request top-customer schedule, contract summaries, gross margin by contract family, and aging of receivables/deposits.
    relatedQuestionRefs:
    - QI019
    - QI020
    - QI021
    relatedTableRefs:
    - TI003
    - TI005
    - TI006
  - type: missing-source
    severity: material
    topic: full-constellation-capex-plan
    missingEvidence: Management’s own satellite-count target, launch schedule, and total capital plan for any constellation beyond the current eight-satellite test network.
    whyItMatters: Public benchmarks can bound hardware-only capital, but they cannot replace the company’s own target architecture or launch/ground-segment financing plan.
    diligencePath: Request constellation architecture, launch procurement plan, gateway/terminal capex, and consolidated funding plan by phase.
    relatedQuestionRefs:
    - QI022
    - QI026
    relatedTableRefs:
    - TI005
    - TI006
