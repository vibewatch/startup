- id: SI-revenue-model
  title: Manufacturing-first revenue model with pilot-stage service monetization
  body: 'Public evidence supports a manufacturing-first revenue model, not a mature subscription connectivity business. GalaxySpace openly describes itself as both a satellite manufacturer and a satellite internet solution provider, and the observable revenue anchors today are batch satellite production, SAR delivery work, component and terminal supply, and integration of network demonstrations into customer trials. The clearest near-term cash engine is still state-linked manufacturing work: GW-07 and the 19th low-orbit group point to ongoing production revenue, while media reports of an approximately RMB1.8 billion order for 12,000 phased-array antennas create a rare disclosed price proxy on the hardware side.


    Service revenue is real in the sense that GalaxySpace has built and demonstrated usable connectivity. Official pages describe 7×24 off-grid broadband service, 100 Mbps-class connectivity, and a sequence of Thailand, Hong Kong, robot, and drone-use demonstrations. But these are still mostly proofs of performance and early market-shaping exercises. They demonstrate technical viability and enterprise interest; they do not yet demonstrate recurring service ARPU, renewal rates, or a disclosed mix of manufacturing versus service gross profit.


    The strategic direction is still important. The 2026 business-scope expansion explicitly added satellite communication services and terminal manufacturing, which is exactly what an eventual manufacturing-to-service transition would require. In underwriting terms, though, the company remains earlier in monetization maturity than the valuation headline implies. Today’s public data set looks like a company using manufacturing, state programs, and component supply to fund the bridge toward future higher-margin services — not a company already earning scaled recurring service fees.'
