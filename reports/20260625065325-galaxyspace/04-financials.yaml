- id: TI006
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Audited revenue and backlog recognition
    - Cannot assess revenue quality, growth, or conversion from orders to cash.
    - Request audited revenue bridge, backlog roll-forward, and milestone-recognition policy.
  - - Gross margin by product and service line
    - Cannot test whether manufacturing is subsidizing service experiments or vice versa.
    - Request segment gross margin for satellites, components, terminals, and connectivity services.
  - - Current cash and monthly burn
    - Cannot validate runway after the C round or before IPO.
    - Request treasury statement plus monthly actual-vs-budget cash bridge.
  - - Exact C-round amount, dilution, and terms
    - Cannot underwrite ownership, dilution, or true financing sufficiency.
    - Obtain signed term sheet, cap table, and board approval package.
  - - Customer concentration and contract economics
    - Cannot judge whether GW or other national programs dominate the P and L.
    - Request top-customer list, margin by contract family, payment milestones, and renewal schedule.
  - - Constellation architecture and total capex plan
    - Cannot replace industry benchmarks with company-specific capital planning.
    - Request satellite-count target, launch plan, gateway capex, and multi-phase funding model.
  - - Direct official filing row export
    - Cannot independently verify tutoring-row details from primary disclosure in-run.
    - Retrieve screenshot or PDF export from CSRC disclosure platform via counsel or alternative network.
  notes: Each row is a concrete blocker to full underwriting rather than a generic curiosity item.
