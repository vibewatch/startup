  evidenceGaps:
  - type: missing-source
    severity: material
    topic: galaxyspace-spectrum-rights
    missingEvidence: Direct public ITU or MIIT filings that map GalaxySpace’s current live shell geometry and exact frequency-rights status by band and altitude.
    whyItMatters: Spectrum and orbital rights determine whether GalaxySpace’s technical proof can turn into scaled commercial coverage before domestic rivals lock in priority resources.
    diligencePath: Request GalaxySpace’s current ITU/MIIT filing identifiers, live shell maps, and regulator correspondence for Q/V and Ka-band use.
    relatedQuestionRefs:
    - QP004
    - QP025
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: peer-pricing-realization
    missingEvidence: Signed contracts, list-to-realized discounts, and per-user or per-Mbps economics for GalaxySpace, Qianfan, AST wholesale deals, and SatSure enterprise bundles.
    whyItMatters: Public marketing pages show architecture, not realized monetization quality, which is the core issue when comparing capex-heavy constellations against software-led alternatives.
    diligencePath: Ask for recent contracts, pricing sheets, gross-margin bridges, and customer reference calls by product lane.
    relatedQuestionRefs:
    - QP021
    - QP025
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: casspace-manifest-depth
    missingEvidence: A public, mission-by-mission future launch manifest for CAS Space and Kinetica-2 that shows how much constellation demand is actually contracted rather than aspirational.
    whyItMatters: GalaxySpace’s deployment speed depends on the real, not theoretical, throughput of domestic launch suppliers and their paying customers.
    diligencePath: Request signed backlog, vehicle-specific cadence plans, and target customer manifests from CAS Space or launch brokers.
    relatedQuestionRefs:
    - QP020
    - QP025
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: minor
    topic: satsure-unit-economics
    missingEvidence: Unit economics for SatSure’s analytics products, including the cost mix between owned assets, third-party imagery, and software subscriptions.
    whyItMatters: The downstream benchmark matters only if asset-light monetization actually converts into superior margins or faster sales cycles than constellation-heavy peers.
    diligencePath: Request product-level gross margins, data-procurement costs, and retention by agriculture, insurance, and banking accounts.
    relatedQuestionRefs:
    - QP017
    - QP021
    relatedTableRefs:
    - TP003
