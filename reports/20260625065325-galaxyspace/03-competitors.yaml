    - Mission-based launch contracts and launch-service packaging
    - Public mission pricing is sparse in retained set
    - Launch vehicles, launch operations, and constellation deployment capacity
    - Signed backlog, realized ASPs, and customer concentration remain private
    - They monetize deployment throughput rather than end-user connectivity, but their pace still affects GalaxySpace.
