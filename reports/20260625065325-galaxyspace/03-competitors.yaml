- id: deployment-cadence-and-launch-power
  title: Deployment cadence and launch power
  body: 'Cadence is where GalaxySpace looks most exposed. Jonathan McDowell’s June 2026 Starlink statistics page records 12,342 launched satellites and 10,682 in orbit, giving SpaceX a scale base that no other retained source pack approaches. The launch benchmark behind that installed base is equally important: the Asahi reporting on LandSpace quotes Falcon 9 at roughly 150 launches per year, or about three per week. Qianfan is far smaller, but its pace is still meaningful because Jonathan’s June 2026 snapshot records 200 launched satellites, while the retained NewSpace and State Council material shows the program was designed from the start for triple-digit annual deployment and a 15,000-satellite end state. GalaxySpace’s own retained public footprint is smaller by an order of magnitude, with 8 launched Yinhe satellites and a 100-satellite factory-capacity claim rather than a demonstrated high-frequency launch engine. This is why launch suppliers matter strategically. LandSpace already
    demonstrated a 13-day cycle and a 900 km constellation-test mission, while CAS Space’s Kinetica-1 had reached its 11th launch. But the adverse evidence matters too: LandSpace itself is still planning 10 launches next year, and New Space Economy notes that no Chinese operator had routine orbital-booster reuse on public proof by June 2026. The competitive bottom line is that GalaxySpace’s technical proof is ahead of its orbital replenishment tempo.'
