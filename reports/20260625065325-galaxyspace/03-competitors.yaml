- id: TP005
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - evidence
  - mitigation / diligence ask
  rows:
  - - Domestic manufacturing and 100-satellite capacity
    - Qianfan and Starlink can still outrun GalaxySpace if launch access, orbit rights, or demand conversion lag
    - High
    - GalaxySpace’s factory claim is real, but deployed-satellite evidence remains much smaller than Qianfan and Starlink
    - Request signed backlog, factory utilization, and production-to-launch conversion metrics by quarter.
  - - 5G-standard Q/V and Ka proof
    - AST can win direct-to-phone mindshare using lower-frequency spectrum with stronger handset compatibility
    - Medium-high
    - GalaxySpace proved Q/V and Ka links, but AST explicitly centers low- and mid-band cellular spectrum
    - Request link-budget comparisons, handset support, and target use cases by spectrum layer.
  - - Domestic policy alignment
    - State-backed Qianfan can absorb policy oxygen and orbital-resource urgency more effectively
    - High
    - Qianfan combines Shanghai backing with explicit Ku/Q/V and 1,160 km architecture
    - Request regulator correspondence, filing priority, and government-program share of demand.
  - - Future launch throughput via Chinese suppliers
    - LandSpace and CAS Space are improving, but China still lacks public proof of routine orbital-class reuse
    - High
    - LandSpace is still far from Falcon 9 cadence; New Space Economy says routine Chinese reuse is not yet public
    - Request committed launch slots, launch-provider SLAs, and contingency manifests across vehicles.
  - - Application-layer monetization optionality
    - SatSure-like software layers can capture customer budgets before broadband-capacity providers prove unit economics
    - Medium
    - SatSure already sells agriculture, insurance, banking, and utilities decisions at scale
    - Request packaged analytics products, partner APIs, and evidence of value-added services beyond transport.
  - - Starlink not immune to regulation
    - Spectrum waivers and EPFD disputes can still reshape competitive economics even for the leader
    - Medium
    - SatNews shows Gen2 waiver benefits and interference battles around Starlink power limits
    - Track FCC/ITU proceedings and model downside cases where power or coexistence limits tighten.
  notes: Severity reflects the likely effect on GalaxySpace’s ability to convert technical proof into durable commercial advantage over the next 24–36 months.
