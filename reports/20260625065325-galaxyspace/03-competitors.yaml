company:
  name: GalaxySpace (银河航天)
chapter:
  number: 3
  title: Competitors
  summary: 'GalaxySpace’s real competitive burden is multi-layered: Starlink is the global benchmark for scale and launch cadence, Qianfan is the clearest domestic broadband megaconstellation peer, AST SpaceMobile attacks the direct-to-phone use case with lower-frequency spectrum, and SatSure shows how downstream software can capture space budgets without winning the launch race. GalaxySpace’s moat is therefore more about 5G-standard technical proof and domestic manufacturing than about current fleet size, and its main strategic risk is that deployment cadence and commercialization lag the stronger benchmarks.'
sections:
- id: competitive-landscape
  title: Competitive landscape and benchmark classes
  body: 'GalaxySpace does not face one clean peer set. The most important direct benchmark is Starlink, because it is the only operator in the retained corpus already proving what a scaled low-Earth-orbit broadband network looks like in practice: multi-band spectrum, a very large in-orbit fleet, and a launch machine that other players still measure themselves against. Qianfan is the closest domestic comparator because it combines Shanghai state backing, a disclosed Ku/Q/V architecture at 1,160 km, and a launched-satellite count already far above GalaxySpace’s public footprint. AST SpaceMobile competes differently, but not trivially, because it attacks the same “connect ordinary phones everywhere” narrative with low- and mid-band direct-to-cell instead of Q/V or Ka-heavy broadband capacity. SatSure is a different substitute again: it captures value from space data through analytics and sector workflows rather than through consumer broadband coverage. LandSpace and CAS Space are not retail
    connectivity brands, yet they still belong in the competitor map because launch cadence is a gating input to constellation competitiveness in China. In short, GalaxySpace is competing simultaneously against a global deployment benchmark, a domestic state-backed broadband benchmark, a lower-frequency direct-to-cell challenger, asset-light monetizers, and the launch ecosystem that determines who reaches orbit fastest.'
