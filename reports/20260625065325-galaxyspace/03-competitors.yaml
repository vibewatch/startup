    - Strong technical proof exists, but deployment evidence remains thin relative to benchmarks.
  - - Qianfan / SpaceSail
    - Ku, Q, and V band
    - 1,160 km; 36 polar planes x 36 satellites
    - 108 launched in Jan-2026 snapshot; 200 launched by 2026-06-24; 648 first-phase target by end-2025
    - Most explicit domestic architecture and one of the clearest cadence threats to GalaxySpace.
  - - Starlink
    - Ku, Ka, E-band, with V-band expansion
    - Multi-shell LEO; orbital-distribution tracking updated through 2026
    - 12,342 launched by 2026-06-24; Falcon 9 benchmark ~150 launches/year
    - Global benchmark for replenishment power and network scale.
  - - AST SpaceMobile
    - Premium low- and mid-band cellular spectrum
    - LEO direct-to-cell architecture for ordinary phones
    - Launches throughout 2025 and 2026; 6 launched in Jan-2026 snapshot
    - Different radio strategy creates a separate but credible competitive lane.
  - - SatSure
    - Not a core retail-spectrum comparison in retained set
    - Orbit matters upstream through EO supply, not through a public connectivity shell
    - Software-led scaling instead of constellation-launch cadence
    - Competes on application economics rather than on orbit-by-orbit deployment.
  - - LandSpace
    - Launcher, not a service-spectrum actor
    - Demonstrated 900 km constellation-test mission on ZQ-2E Y5
    - 13-day launch cycle; 10 launches planned next year
    - Relevant because domestic launch throughput constrains or enables GalaxySpace’s rollout.
  - - CAS Space
    - Launcher, not a service-spectrum actor
    - Sun-synchronous-orbit constellation mission on Kinetica-1 Y11
    - 11th Kinetica-1 launch; Kinetica-2 among first-tier reusable contenders
    - Cadence exists, but reusable maturity is still behind SpaceX-style routine operations.
  notes: Orbit and cadence fields mix declared architecture, current launched counts, and reported launch tempo because these are the most public proxies available. Unknown exact live shells should be treated as diligence asks, not hidden assumptions.
