- id: TP001
  title: Competitor profile table
  enumerationScope:
    coverage: partial
    basis: Profiles the direct, adjacent, substitute, and launch-ecosystem actors most relevant to GalaxySpace’s 2026 competitive positioning rather than every Chinese or global space company.
  columns:
  - competitor
  - category
  - scale / funding
  - target segment
