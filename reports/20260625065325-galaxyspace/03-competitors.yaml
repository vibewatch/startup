  rows:
  - - GalaxySpace
    - Constellation and satellite-internet solutions; manufacturing plus network programs
    - Not publicly disclosed in retained set
    - LEO broadband / 5G-oriented constellation, payload and platform capability
    - Realized contract pricing, customer mix, and margin profile are not public
    - Economic quality is much harder to underwrite than the technical narrative.
  - - Starlink
    - Integrated hardware plus recurring connectivity service
    - Visible public pricing exists by market, but retained set does not normalize it across geographies
    - Terminal, managed connectivity, and expanding direct-to-cell capability
    - Enterprise realized pricing and country-level comparability remain uneven in retained set
