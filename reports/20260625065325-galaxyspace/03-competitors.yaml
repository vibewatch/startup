- id: spectrum-orbit-and-architecture
  title: Spectrum, orbital altitude, and architecture
  body: 'The most consequential technical divide is not simply ‘LEO versus not-LEO’; it is what each player is trying to optimize with its radio layer. GalaxySpace’s retained public corpus positions Yinhe as a 5G-standard LEO mobile-communication constellation that has already verified Q/V and Ka-band links. Qianfan’s retained corpus is more explicit on the architectural side: the disclosed SAILSPACE-1 geometry uses 36 polar planes, Ku/Q/V bands, and a 1,160 km orbit. That places it closer to a state-backed broadband megaconstellation play than to a narrow experiment. Starlink’s stack is broader still, with Ku, Ka, and E-band use plus recently approved V-band expansion, which makes it the most capacity-oriented public benchmark in the set. AST SpaceMobile is the clearest contrast case because it says the key to direct-to-phone service is premium low- and mid-band spectrum, not the higher-frequency broadband strategy emphasized by the broadband constellations. SatSure sits outside the spectrum
    race altogether in this chapter’s core comparison because its value proposition is application-layer decision intelligence. The technical implication for GalaxySpace is that its strongest differentiation is not merely ‘Chinese LEO broadband,’ but specifically a 5G-oriented Q/V-and-Ka proof set whose propagation, device, and regulatory trade-offs differ from both Starlink’s broadband stack and AST’s direct-to-cell spectrum posture.'
