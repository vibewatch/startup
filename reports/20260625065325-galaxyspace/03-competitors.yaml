- id: commercial-models-and-monetization
  title: Commercial models, packaging, and value capture
  body: 'The competitor set also separates cleanly by monetization path. Starlink is the most vertically integrated: its value capture comes from selling service, hardware, and now direct-to-cell capacity on top of a giant installed base. AST is different because its retained public positioning is partner-centric and wholesale-friendly; it is designed to slot into mobile-network operators rather than replicate a consumer broadband offering. Qianfan and GalaxySpace are harder to underwrite on public pricing because the retained corpus is rich on architecture and scale targets but thin on realized contract structure. That matters because capex-heavy systems can look strategically important long before they prove durable pricing power. SatSure again changes the frame: its business sells sector workflows, risk models, and EO-enabled decisions rather than Mbps or handset coverage. That makes it an important substitute for some space-tech budget pools even though it is not a like-for-like broadband
    operator. For GalaxySpace, the monetization challenge is therefore dual. It must prove that a domestically built broadband-and-5G satellite stack can command attractive economics, while also showing that software- and data-led alternatives are not capturing the faster, lighter-margin opportunity upstream of the same customer demand.'
