- id: moat-durability-and-adverse-case
  title: Moat durability and adverse case
  body: 'GalaxySpace’s moat is real but not yet settled. The strongest elements in the retained corpus are domestic manufacturing capacity, an explicit satellite-internet identity, and proof that Yinhe has already tested Q/V and Ka-band communications inside a 5G-standard LEO framework. That gives the company a more concrete technical identity than a generic ‘space internet’ slogan. But moat durability depends on layers where the public record is weaker: exact live shell geometry, realized contract pricing, and future launch manifests. Starlink shows the hardest version of the adverse case because it already couples high-frequency launch access with a massive in-orbit fleet and visible regulatory muscle. Qianfan shows the domestic version of the same risk: a more clearly disclosed megaconstellation architecture, Shanghai backing, and faster visible scaling. AST shows that low-frequency direct-to-cell can compete for the same narrative without imitating GalaxySpace’s radio layer. LandSpace
    and CAS Space add a subtler risk, because China still has not publicly demonstrated routine orbital-class reuse, meaning GalaxySpace remains partly hostage to launch-ecosystem maturity. The chapter’s adverse conclusion is therefore that GalaxySpace is differentiated, but its durable advantage still depends more on converting technical proof into scaled deployment and commercial contracts than on any already-unassailable installed base.'
