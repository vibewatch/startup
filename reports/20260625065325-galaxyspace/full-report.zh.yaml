      - number: '1.3'
        title: 轨道架构与制造策略
        blocks:
          - type: paragraph
            body: >-
              GalaxySpace 的轨道打法，最好理解为从单星验证走向可制造星座逻辑的迭代路径。第一个验证点是 GS-1a，于 2020-01-16 在酒泉发射；官方和独立来源均显示，它是中国首颗 Q/V/Ka 频段
              LEO 宽带通信卫星，实现 48 Gbps 实测吞吐，并完成中国首次基于 LEO 卫星互联网的 5G 通信测试。下一步发生在 2022-03-05，GalaxySpace 发射六颗自主研制 LEO
              宽带卫星；官方材料称其为中国首批批量生产的 LEO 宽带通信卫星。随后官方叙事从一次性工程转向星座经济性：可堆叠平板架构、柔性太阳翼、相控阵与数字载荷集成，以及为星间切换下持续通信打造的八星
              Mini-Spider 试验星座。最新公开架构信号是 G3 通信卫星，它把太阳翼和相控阵天线组合进一个展开面积超过 100 平方米的直连手机平台。这套轨道逻辑对应着工业逻辑。GalaxySpace
              的南通工厂不是边缘资产；它是把低成本星座叙事转成可信部署策略的机制。
