    type: flow
    layout: wide
    summary: 公开工作流从偏远或移动连接问题开始，最后进入网关连接的应用闭环，而不是简单的一次卫星过境。
    approximationNotes: 该流程概括了解决方案页面和第三方演示报道中描述的偏远站点、移动平台和指挥控制场景。
