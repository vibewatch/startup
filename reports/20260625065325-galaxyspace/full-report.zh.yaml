      - number: '4.2'
        title: 制造优先收入模型，服务变现仍在试点阶段
        blocks:
          - type: paragraph
            body: >-
              公开证据支持的是制造优先收入模型，而不是成熟订阅连接业务。GalaxySpace 公开把自己描述为卫星制造商和卫星互联网解决方案提供商；今天可观察的收入锚点是批量卫星生产、SAR
              交付工作、部件和终端供应，以及把网络演示整合进客户试用。最清楚的短期现金引擎仍是国资关联制造工作：GW-07 和第 19 低轨组指向持续生产收入，而媒体报道一笔约人民币 18 亿元、12,000
              套相控阵天线订单，在硬件侧提供了罕见的公开价格代理。


              服务收入在公司已经建成并演示可用连接的意义上是真实的。官方页面描述 7×24 离网宽带服务、100 Mbps
              级连接，以及泰国、香港、机器人和无人机场景的一系列演示。但这些大多仍是性能证明和早期市场塑形动作。它们证明技术可行和企业兴趣；还没有证明经常性服务 ARPU、续约率，或制造与服务毛利之间的已披露结构。


              战略方向仍然重要。2026
              年经营范围扩展明确加入卫星通信服务和终端制造，这正是未来从制造走向服务所需要的能力。但从承销角度看，公司变现成熟度仍早于估值标题所暗示的阶段。今天的公开数据集看起来像是一家公司用制造、国家项目和部件供应为通往未来更高毛利服务的桥梁融资——而不是一家已经赚取规模化经常性服务费的公司。
