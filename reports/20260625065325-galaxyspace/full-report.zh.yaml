      - number: '3.5'
        title: 护城河耐久性与负面情景
        blocks:
          - type: paragraph
            body: >-
              GalaxySpace 的护城河真实存在，但尚未定型。保留语料中最强的元素是国内制造产能、明确的卫星互联网身份，以及银河已经在 5G 标准 LEO 框架内测试 Q/V 和 Ka
              频段通信的证据。这让公司拥有比泛泛“太空互联网”口号更具体的技术身份。但护城河耐久性取决于公开记录较弱的层面：准确的在役壳层几何、已实现合同定价和未来发射清单。Starlink
              展示了最难的负面情景，因为它已经把高频发射通道、庞大在轨舰队和可见监管肌肉结合起来。千帆展示了同一风险的国内版本：更清楚披露的巨型星座架构、上海支持和更快的可见扩张。AST 则说明，低频直连手机不复制
              GalaxySpace 的无线层，也能争夺同一个叙事。LandSpace 和 CAS Space 增加了更微妙的风险，因为中国仍未公开证明常态化轨道级复用，意味着 GalaxySpace
              仍部分受制于发射生态成熟度。因此，本章的负面结论是：GalaxySpace 有差异化，但其持久优势仍更取决于把技术验证转成规模化部署和商业合同，而不是依靠任何已经不可撼动的装机基座。
