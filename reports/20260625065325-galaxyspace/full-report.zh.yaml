chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与战略定位
        blocks:
          - type: paragraph
            body: >-
              GalaxySpace
              把自己定位为卫星互联网基础设施公司，而不是单一零部件供应商。在英文关于页和首页，公司称自己是中国领先的卫星互联网解决方案提供商和卫星制造商，核心是自主研发以及通信载荷、核心部件和卫星平台的低成本量产。同一套官方材料把可服务产品栈铺得很宽：宽带通信、光学遥感、SAR、导航增强、频谱感知，以及最终接入
              5G/6G。公开足迹显示，公司总部在北京，并在西安、成都、南通具备研发或制造能力；这一点重要，因为战略同样是工业化战略，而不只是轨道战略。一个实质性的身份褶皱在于时间和规模披露。EqualOcean
              将创业起点追溯到 2016 年 12 月，并提到五人创始团队；GalaxySpace 自己的关于页则从 2018 年 4 月讲起。官方称公司已发展到 1,000 多名员工，但企查查在 2024
              年年报中仅为北京主体列出 198 名参保员工，因此更稳妥的概览结论是：GalaxySpace 按集团运作，规模大于单一拟上市主体能显示的部分。
