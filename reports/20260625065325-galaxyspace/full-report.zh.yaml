      - number: '8.5'
        title: 最终尽调问题和投资逻辑断裂触发器
        blocks:
          - type: paragraph
            body: >-
              本章不是以「回避」收尾，因为 GalaxySpace 显然有产业实体；而是以「research-more」收尾，因为公开证据仍缺少真正决定 $4.4 billion
              是否有吸引力的变量。第一块缺口是财务：经审计收入、毛利率、烧钱和客户集中度。第二块是资本结构：确切募资额、稀释、优先权，以及 Series C
              的经济价格是否匹配标题估值。第三块是公开市场准备度：管理层到底会使用哪条 STAR 路径，集中投票控制下如何处理少数股东治理，以及 2026-2027
              年商业化能否赶在上市审核前被文档化。如果收入远低于即便保守公开可比公司所隐含的门槛，如果商业服务变现仍主要停留在演示，或如果条款清单显示下行保护使经济价格远低于新闻标题，投资逻辑就会断裂。没有这些答案，当前标记应被视为尽调基准，而不是绿灯。
            claimRefs:
              - CV040
              - CV041
              - CV042
              - CV043
              - CV044
