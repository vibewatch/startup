  - id: TP004
    title: 频段、轨道高度和发射节奏对比
    enumerationScope:
      coverage: partial
      basis: >-
        Compares the frequency/orbit/cadence dimensions that most directly affect GalaxySpace’s strategic position;
        exact live shell data are not public for every actor in the retained corpus.
    columns:
      - 参与方
      - 公开频段定位
      - 公开轨道 / 高度信号
      - 公开节奏信号
      - 含义
    rows:
      - - GalaxySpace
        - Q/V 频谱范围；Q/V 和 Ka-band 通信已验证
        - LEO 移动通信星座；保留材料中未公开在轨壳层的精确几何
        - 已发射 8 颗卫星；工厂产能声称 100 颗卫星
        - 技术验证很强，但相对基准，部署证据仍偏薄。
      - - Qianfan / SpaceSail
        - Ku、Q 和 V band
        - 1,160 km；36 个极轨面 x 36 颗卫星
        - 2026 年 1 月快照为已发射 108 颗；截至 2026-06-24 已发射 200 颗；2025 年底一期目标 648 颗
        - 国内最明确的架构之一，也是 GalaxySpace 面临的最清晰节奏威胁之一。
      - - Starlink
        - Ku、Ka、E-band，并扩展 V-band
        - 多壳层 LEO；轨道分布跟踪更新至 2026 年
        - 截至 2026-06-24 已发射 12,342 颗；Falcon 9 基准约 150 次发射 / 年
        - 补网能力和网络规模的全球基准。
      - - AST SpaceMobile
        - 优质低频和中频蜂窝频谱
        - 面向普通手机的 LEO 直连手机架构
        - 2025 年和 2026 年持续发射；2026 年 1 月快照为已发射 6 颗
        - 无线电策略不同，开出一条独立且可信的竞争车道。
      - - SatSure
        - 在保留材料中，不属于核心零售频谱对比对象
        - 轨道通过 EO 供给影响上游，而不是通过公开连接壳层产生影响
        - 靠软件扩张，而不是靠星座发射节奏
        - 竞争焦点是应用经济性，而不是逐轨道部署。
      - - LandSpace
        - 发射方，不是服务频谱参与方
        - 在 ZQ-2E Y5 上展示 900 km 星座测试任务
        - 13 天发射周期；明年计划 10 次发射
        - 国内发射吞吐会约束或释放 GalaxySpace 的部署，因此重要。
      - - CAS Space
        - 发射方，不是服务频谱参与方
        - Kinetica-1 Y11 执行太阳同步轨道星座任务
        - Kinetica-1 第 11 次发射；Kinetica-2 位列第一梯队可复用竞争者
        - 节奏已经存在，但可复用成熟度仍落后于 SpaceX 式常态化运营。
    notes: 轨道和节奏字段混合了已披露架构、当前已发射数量和报道中的发射速度，因为这些是最公开的替代指标。精确在轨壳层未知，应作为尽调问题处理，而不是藏进假设里。
