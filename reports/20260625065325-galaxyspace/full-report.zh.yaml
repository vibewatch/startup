              最强的概览信号是，GalaxySpace 现在把真实轨道里程碑和已披露的工厂体系放在了一起。GS-1a、2022 年批量发射、Mini-Spider
              切换测试以及南通公开年产能叠加后，公司更像一家早期星座制造商，而不是纯实验型创业公司。
