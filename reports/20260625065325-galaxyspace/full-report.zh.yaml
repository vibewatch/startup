      - number: '2.2'
        title: 规模测算视角：全球服务收入与中国星座规模
        blocks:
          - type: paragraph
            body: >-
              公开规模数据分成两个很不一样的类别，不应直接平均。第一类是服务市场收入：The Business Research Company 估算，全球卫星互联网市场 2026 年为 $7.42B，高于 2025 年的
              $6.48B，并将在 2030 年达到 $12.69B。第二类是基础设施或轨道足迹规模：Orbital Radar 称，国网和千帆合计规划超过 28,000 颗卫星，到 2026 年中已发射超过 350
              颗；China Daily 和 IEEE ComSoc 则描述了一波规模更大的中国 ITU 申报，覆盖超过 200,000 颗卫星，包括两项接近 97,000 颗卫星的申请，以及一项归属于 GalaxySpace
              的 187 颗卫星申报。全球基准能看清战略野心与运营规模之间的差距：FCC 在 2026 年 1 月批准后，SpaceX 的 Gen2 Starlink 授权提升至 15,000 颗卫星；Eutelsat 则把
              OneWeb 描述为一个 600 多颗卫星的商业星座，服务陆地、海洋和空中。因此，对承销最有用的是分层视角：短期全球服务市场不大，中国主权建设野心很大，而 GalaxySpace
              在该建设中的实际切口更窄，不是一个已单独披露的零售 TAM。
