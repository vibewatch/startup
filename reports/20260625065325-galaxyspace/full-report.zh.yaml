      - 与 GalaxySpace 的相关性
      - 主要限制
    rows:
      - - SpaceX / Starlink
        - 2025 年末讨论约 $800B 的要约式估值；2026 年 IPO 语境显示规模巨大
        - Reuters 图表显示 SpaceX 2025 年收入 $18.7B；Forbes 讨论 Starlink 2026 年估算 $15.9B
        - 按 Starlink 式估算约 ~50x；若使用整合后的 2025 年收入则高得多
        - 战略和服务网络的上限标杆
        - 混合了发射和卫星经济性，且仍包含重度亏损
      - - AST SpaceMobile
        - 2026 年 6 月下旬公开市值约 $20.3B-$26.4B
        - 过去 12 个月收入约 $84.9M
        - 视数据商而定，EV / 收入约 ~239x-310x
        - 最好的公开直连手机可选性可比公司
        - 仍深度亏损，且稀释压力大
      - - Telesat
        - 2026 年 6 月下旬市值约 $0.66B、EV 约 $2.86B
        - 过去 12 个月收入约 $388.3M
        - Yahoo 口径 EV / 收入约 ~10.5x；若仅看市值，股权价值 / 销售额更低
        - 对卫星经济性有用的基础设施和杠杆底线
        - 传统业务结构和债务结构不同
      - - GalaxySpace 当前估值
        - 由 320 亿元人民币 Series C 轮隐含约 $4.4B
        - 收入未公开披露
        - AST 式倍数需要约 $18M 收入；Starlink 式 50x 需要约 $88M；Telesat 式 10.5x 需要约 $421M
        - 显示现有价格隐含要求了什么
        - 没有经审计收入或利润率披露
      - - GalaxySpace 公开基准情景
        - 作者承销区间，而非市场价格
        - 收入约 $120M-$180M，制造与服务经济性混合
        - 约 10x-14x 收入
        - 代表一条更能被公开证据支撑的路径
        - 仍依赖收入假设，而不是披露
    notes: 可比集合有意保持不完整：它覆盖最相关的公开和准公开视角，而不是所有全球卫星或航天发行人。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the most decision-relevant public comparison lenses available in this run: an upper-bound
        Starlink-style growth benchmark, a direct-to-cell public comp, a levered satellite-operator floor, and two
        GalaxySpace translation rows for the current and base-case pricing question.
    claimRefs:
      - CV010
      - CV012
      - CV013
      - CV014
      - CV015
      - CV018
      - CV022
      - CV023
      - CV024
      - CV025
      - CV034
      - CV035
  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 收入被证明太小
        - 到 2027 年，经审计年收入低于约 $100M
        - 即便按慷慨的公开可比公司逻辑，当前估值也无法再被支撑
        - 除非价格重置，否则从继续研究切换为回避
      - - 利润率仍像制造业务
        - 毛利率仍接近低十位数合同制造水平，服务没有抬升
        - 稀缺叙事不再转化为有吸引力的单位经济性
        - 把估值区间下调到 Telesat / 基础设施路径
      - - 商业服务变现仍停留在展示
        - 试点之外，没有出现实质付费终端或连接合同
        - 牛市论点失去利润率扩张引擎
        - 把公司视为低倍数制造商
      - - IPO 路径停滞
        - 科创板或 A 股进程滑到 2027 年之后，或治理问题升级
        - 流动性时间线拉长，资本需求仍然高企
        - 要求私募市场折价和更强下行保护
      - - C 轮经济性弱于标题
        - 条款清单显示沉重清算优先权、棘轮条款或激进反稀释
        - 标题估值夸大普通股价值
        - 按有效价格而非名义价格重新承销
    notes: 触发项选择可观察、与价格相关的因素，而不是泛泛的公司质量担忧。
    claimRefs:
      - CV006
      - CV029
      - CV037
      - CV040
      - CV041
      - CV045
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计收入和毛利率
        - 2025 年和最近 12 个月收入、毛利率和分部结构
        - 没有这些，当前价格无法映射到任何站得住的倍数路径
        - 要求提供经审计财务包或投行数据室摘要
      - - C 轮经济性
        - 准确募资额、股价、清算优先权、反稀释和期权池处理
        - 标题投后估值可能与普通股经济性存在重大差异
        - 要求提供已签署条款清单和完全摊薄股权结构表
      - - 客户集中度
        - GW 或国资相关方在订单、积压订单和现金回款中的占比
        - 集中度决定规模会改善还是压制利润率
        - 要求提供头部客户桥接和合同期限表
      - - 服务变现证明
        - 已签服务合同、终端 ASP、ARPU、续约逻辑和利润率贡献
        - 牛市情景依赖更高价值的经常性收入，而不只是制造吞吐
        - 要求提供服务管线和队列经济性
      - - 上市路径
        - 准确科创板或 A 股路径、治理清理计划，以及从辅导到申报的时间线
        - IPO 时间和公开市场资格直接影响流动性和估值支撑
        - 要求提供律师备忘录和董事会批准的上市路线图
    notes: 所有问题都旨在压缩当前估值区间，而不只是收集有趣背景。
    claimRefs:
      - CV040
      - CV041
      - CV042
      - CV043
