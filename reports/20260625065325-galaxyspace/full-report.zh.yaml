  - id: TP001
    title: 竞争者画像表
    enumerationScope:
      coverage: partial
      basis: >-
        Profiles the direct, adjacent, substitute, and launch-ecosystem actors most relevant to GalaxySpace’s 2026
        competitive positioning rather than every Chinese or global space company.
    columns:
      - 竞争者
      - 类别
      - 规模 / 融资
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - GalaxySpace
        - 中国 LEO 宽带 / 5G 星座建设商
        - 已发射 8 颗卫星；工厂产能 100 颗卫星；星座规划雄心为 1,000 颗
        - 国内卫星互联网、5G NTN、星座制造
        - 5G 标准 LEO 定位；Q/V 和 Ka 频段验证；自有制造
        - 公开部署规模仍小，实时壳层几何或合同定价披露仍稀少。
      - - Starlink
        - 全球宽带基准
        - 截至 2026-06-24，已发射 12,342 颗 / 在轨 10,682 颗；Falcon 9 基准约每年 150 次发射
        - 消费者、企业、海事、政府、直连手机延伸
        - 部署规模最大，多频段技术栈、发射节奏和一体化服务模式可见
        - 面临频谱 / 功率限制争议，后进入者很难在节奏上追平。
      - - Qianfan / SpaceSail
        - 国内国家支持宽带巨型星座同业
        - 到 2026-06-24 已发射 200 颗；初始架构 1,296 颗；长期计划 15,000 颗
        - 中国及未来全球宽带 / 直连覆盖
        - 上海支持；Ku/Q/V 披露；1,160 km 极轨架构
        - 商业包装和实际需求仍远不如架构公开。
      - - AST SpaceMobile
        - 直连手机架构对手
        - 已发射 6 颗；2026 年 1 月快照显示计划 60 颗；发射仍在推进
        - 移动网络运营商和基站覆盖外的普通智能手机用户
        - 优质低频和中频频谱匹配；直连手机叙事；BlueBird 路线图
        - 进度已延期，经济性依赖运营商合作，而不是可见零售 ARPU。
      - - SatSure
        - 下游 EO / 分析替代方案
        - 已分析 210 万+ 农户地块；8,500 万公顷；19.5 万个村庄；聚焦行业的工作流产品
        - 农业、保险、银行、航空、公用事业、林业
        - 靠软件、分析和 EOaaS 捕获价值，而不是星座资本开支
        - 不是一一对应的宽带运营商；基础设施敞口与 GalaxySpace 差异很大。
      - - LandSpace
        - 发射供应赋能方和相邻竞争约束
        - 明年计划 10 次发射；已验证 13 天周期；新建 23 亿元工厂
        - 需要更快或更便宜发射通道的中国星座建设商
        - 液氧甲烷领先；高频发射雄心；可复用路线图
        - 距 Falcon 9 工作节奏仍很远，也尚未公开证明可常态化复用。
      - - CAS Space
        - 发射供应赋能方和相邻竞争约束
        - 力箭一号完成第 11 次发射；力箭二号处于可复用竞争者第一梯队
        - 需要国内发射吞吐量的星座任务
        - 在 SSO 发射中已有任务节奏；与星座部署吞吐量相关
        - 中国仍缺少轨道级常态化复用的公开证据。
      - - 地面 5G + 光纤 + 国家集成商
        - 现状替代方案
        - 已部署网络和政府支持的集成预算
        - 回传、农村覆盖、企业连接和主权基础设施项目
        - 采购渠道成熟，轨道执行风险更低
        - 无法像规模化 LEO 网络一样提供无处不在的离网覆盖。
    notes: 各行比较的是与 GalaxySpace 2026 年战略位置最相关的方案形态；规模指标混用了已发射卫星数、 工厂产能和运营指标，因为不同竞争者类别的公开披露差异很大。
