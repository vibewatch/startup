      - number: '3.3'
        title: 部署节奏与发射能力
        blocks:
          - type: paragraph
            body: >-
              节奏是 GalaxySpace 最显短板的地方。Jonathan McDowell 2026 年 6 月 Starlink 统计页记录了 12,342 颗已发射卫星和 10,682 颗在轨卫星，使 SpaceX
              拥有保留来源包中没有任何其他对象接近的规模基座。支撑这一装机基座的发射基准同样重要：Asahi 关于 LandSpace 的报道引用 Falcon 9 约每年 150
              次发射，约每周三次。千帆小得多，但其速度仍有意义，因为 Jonathan 2026 年 6 月快照记录了 200 颗已发射卫星，而保留的 NewSpace 和国务院材料显示，该项目从一开始就按三位数年部署和
              15,000 颗终局设计。GalaxySpace 自己保留的公开足迹小一个数量级：8 颗已发射银河卫星和 100 颗卫星工厂产能声称，而不是已证明的高频发射机器。因此发射供应商具有战略意义。LandSpace
              已经展示 13 天周期和 900 km 星座测试任务，CAS Space 的 Kinetica-1 也已完成第 11 次发射。但负面证据也重要：LandSpace 自身仍计划明年 10 次发射，New Space
              Economy 指出，截至 2026 年 6 月，没有中国运营商在公开证据上实现常态化轨道级助推器复用。竞争底线是，GalaxySpace 的技术验证领先于其轨道补网速度。
