companyProfile:
  summary: >-
    GalaxySpace（银河航天）是一家总部位于北京的民营商业航天公司，建设低地球轨道卫星宽带基础设施。公司的公开战略把自研卫星与载荷制造、相控阵与 Q/V
    频段通信硬件，以及通过电信运营商、企业和公共服务试点逐步商业化结合起来。公司从 2020 年 GS-1a 验证星推进到八星宽带试验星座，建成大型南通制造基地，2026 年 2 月完成 Series C，估值约人民币 320
    亿元，并于 2026 年 3 月进入 A 股 IPO 辅导。
  foundedDate: '2018-04-01'
  founders:
    - name: Xu Ming
      role: 创始人、董事长兼 CEO
      background: 哈尔滨工业大学毕业；曾在 360 和 Cheetah Mobile 担任高级技术与运营职务。
      claimRefs:
        - CO009
        - CO010
        - CO011
  foundingLocation: Beijing, China
  headquarters: Beijing, China
  productSummary: 模块化 LEO 通信卫星、通信载荷及核心部件、相控阵终端、宽带与直连手机方案，以及面向运营商、企业和公共服务场景的相关网络演示。
  customerFocus: 电信运营商、政府与公共服务用户、研究机构、海事及航空相关场景，以及其他需要离网或偏远宽带连接的企业或区域合作伙伴。
  businessModel: 短期变现似乎来自卫星制造、载荷与终端供应、SAR 与国资关联批量生产工作；运营商试点转为合约化使用后，最终有望贡献毛利更高的卫星通信服务。
  stage: Growth-stage private company in IPO preparation
