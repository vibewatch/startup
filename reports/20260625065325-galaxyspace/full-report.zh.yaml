  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 监管时点、同业规模、发射可靠性和融资都会传导到服务证明、变现能力和估值信心。
    data:
      nodes:
        - id: n1
          label: 申报 / 频谱延迟
          detail: GalaxySpace 专属权利或审批落后于部署雄心。
        - id: n2
          label: Qianfan / Starlink 规模差距
          detail: 同业持续拉开发射、轨道和频谱优势。
        - id: n3
          label: 发射或调试异常
          detail: 在轨壳层规模小，每次任务的经济权重都很高。
        - id: n4
          label: 芯片 / 工具摩擦
          detail: 受控投入或重新设计会拖慢载荷和终端进度。
        - id: n5
          label: 付费部署滑坡
          detail: 演示和工厂证明未能更快转化为真实服务证明。
        - id: n6
          label: 融资压力
          detail: 星座证明能被资本市场买单之前，公司需要 IPO 或新资本续桥。
        - id: n7
          label: 商业信心流失
          detail: 合作伙伴和投资人会按时点风险案例给公司定价。
        - id: n8
          label: 估值压缩
          detail: 投资逻辑从平台上行切换为执行折价。
      edges:
        - from: n1
          to: n5
        - from: n2
          to: n5
        - from: n3
          to: n5
        - from: n4
          to: n5
        - from: n5
          to: n6
        - from: n5
          to: n7
        - from: n6
          to: n8
        - from: n7
          to: n8
    approximationNotes: 这张图强调风险如何传导到商业化和估值，而非穷尽中国航天产业链的每个运营依赖。
    claimRefs:
      - CR001
      - CR008
      - CR013
      - CR021
      - CR022
      - CR031
      - CR040
      - CR042
      - CR043
      - CR045
      - CR046
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: GalaxySpace 要把工厂规模变成真实星座，离不开监管机构、发射方、出口敏感供应商、资本方和客户预算分配。
    data:
      nodes:
        - id: d1
          label: ITU / 无线电主管机构
          detail: 申报、协调和频谱许可。
        - id: d2
          label: 中国发射生态
          detail: 发射窗口、运载工具，以及最终更便宜的可复用准入。
        - id: d3
          label: 半导体 / 工具供应商
          detail: 载荷、处理、终端和设备投入。
        - id: d4
          label: 国资背景资本 / IPO 市场
          detail: 从工厂证明到更大壳层部署之间的现金桥。
        - id: d5
          label: 国际许可交易对手
          detail: 落地权和跨境服务伙伴。
        - id: d6
          label: GalaxySpace 产业基地
          detail: 工厂产出、集成和调试执行。
        - id: d7
          label: 付费网络证明
          detail: 已部署的真实服务和合同转化。
        - id: d8
          label: 战略可选性
          detail: 能否靠时间表竞争，而不只是讲故事。
      edges:
        - from: d1
          to: d7
        - from: d2
          to: d6
        - from: d3
          to: d6
        - from: d4
          to: d8
        - from: d5
          to: d7
        - from: d6
          to: d7
        - from: d7
          to: d8
    approximationNotes: 这张依赖图刻意以投资人为中心，排除留存公开资料中不可见的未披露涉密客户或供应商。
    claimRefs:
      - CR003
      - CR008
      - CR011
      - CR021
      - CR022
      - CR036
      - CR037
      - CR042
      - CR045
      - CR046
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 2026 年融资、公开可比公司分化、披露缺口和 IPO 路径如何共同指向 research-more 立场。
    data:
      nodes:
        - id: series-c
          label: C 轮估值约 RMB32B / ~$4.4B
        - id: valuation-jump
          label: 较 2024 年参考值跳升 2.8x
        - id: comp-dispersion
          label: 公开可比公司横跨约 10x 至 >200x EV/收入
        - id: no-revenue
          label: 未公开披露收入或利润率
        - id: ipo-path
          label: IPO 路径可行，但仍偏早
        - id: recommendation
          label: 建议：research-more / 偏高
      edges:
        - from: series-c
          to: recommendation
        - from: valuation-jump
          to: recommendation
        - from: comp-dispersion
          to: recommendation
        - from: no-revenue
          to: recommendation
        - from: ipo-path
          to: recommendation
    approximationNotes: 这条流程由作者综合搭建，让建议可以回溯到最强的公开证据支柱，而不是落在泛泛的公司质量评分上。
    claimRefs:
      - CV002
      - CV003
      - CV022
      - CV034
      - CV038
      - CV044
  - id: FV002
    title: 在选定倍数下支撑当前估值所需收入
    type: bar
    layout: wide
    summary: 投资人采用 AST 式、Starlink 式还是 Telesat 式倍数，会让 GalaxySpace 的隐含收入门槛大幅变化。
    data:
      items:
        - label: AST 式 238.8x EV/收入
          value: 18.4
          unit: USD millions revenue
        - label: Starlink 式 50x 销售额
          value: 88
          unit: USD millions revenue
        - label: 基准情形 12x 收入支撑
          value: 366.7
          unit: USD millions revenue
        - label: Telesat 式 10.5x EV/收入
          value: 420.7
          unit: USD millions revenue
        - label: 熊市情形 5x 收入支撑
          value: 880
          unit: USD millions revenue
    approximationNotes: 收入门槛是对 ~$4.4B 估值的代数换算，并非公司指引或预测收入。
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV035
      - CV037
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 纳入 IPO 准备度和变现不确定性后，GalaxySpace 在熊市、基准和牛市情形下的示意估值区间。
    data:
      items:
        - label: 熊市情形估值（USD M）
          low: 600
          mid: 1000
          high: 1500
          unit: USD millions
        - label: 基准情形估值（USD M）
          low: 1200
          mid: 1800
          high: 2500
          unit: USD millions
        - label: 牛市情形估值（USD M）
          low: 4000
          mid: 5000
          high: 6000
          unit: USD millions
        - label: 当前公开标记估值（USD M）
          low: 4400
          mid: 4400
          high: 4400
          unit: USD millions
    approximationNotes: GalaxySpace 尚未公开披露核心运营输入，因此情形边界由作者根据可比倍数和所需收入门槛编码得出。
    claimRefs:
      - CV024
      - CV025
      - CV035
      - CV036
      - CV037
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 在公开市场或后期私募投资决策之前，最值得跟踪的六个估值监测 KPI。
    data:
      items:
        - label: 公开 C 轮标记估值
          value: ~$4.4B
          detail: 2026 年 2 月报道给出的当前公开估值锚。
        - label: 已披露当前收入
          value: Not public
          detail: 建议无法上调的核心原因。
        - label: 12x 支撑所需收入
          value: ~$367M
          detail: 更可辩护的成长硬件倍数需要跨过的简单门槛。
        - label: 最早可信 IPO 窗口
          value: '2027'
          detail: 辅导真实存在，但路径和合规问题仍未解决。
        - label: 创始人投票控制权
          value: 72.87%
          detail: 治理集中度会影响公开市场少数股东。
        - label: 当前服务组合证明
          value: Early / unproven
          detail: 公开资料里，制造证明强于服务变现证明。
    approximationNotes: KPI 刻意混合财务、治理和流程指标，因为估值风险不只由单一运营指标驱动。
    claimRefs:
      - CV002
      - CV025
      - CV027
      - CV038
      - CV041
      - CV047
