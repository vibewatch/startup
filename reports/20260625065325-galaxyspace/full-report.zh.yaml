  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 频谱、轨道和出口管制时钟是不可让步的顶层风险
        blocks:
          - type: paragraph
            body: >-
              GalaxySpace 的一阶风险是监管时点，而不是野心不足。公开证据显示，低轨频谱和轨道资源稀缺，先到先得的优先规则给按时部署带来真实压力；随着申报增加，大型 NGSO
              系统如今还面临紧迫的五到七年可持续性挑战。这个问题关键在于，GalaxySpace 正试图从仍然很小的 Yinhe
              在轨壳扩张，而更广的中国市场已经把频轨合规当作竞赛条件。与此同时，法律栈也在变宽。中国军民两用出口管制制度现在明确覆盖技术、服务和技术数据；美国先进计算管制仍对中国相关实体有效。在这个语境里，GalaxySpace
              不只是普通卫星制造商：它已经把范围扩到半导体相关业务，使组件获取和许可问题更具商业相关性。地缘政治层又把赌注抬高。公开分析现在把轨道基础设施框定为军民叙事日益模糊的双用途领域。缓释因素是政策支持和中国对卫星互联网的产业优先级，但残余风险仍高，因为申报延误、芯片获取摩擦或跨境许可延迟，都可能直接传导到公司的铺开时间表。
