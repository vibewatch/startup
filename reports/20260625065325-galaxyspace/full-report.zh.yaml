      - number: '7.2'
        title: Yinhe 达到逃逸速度前，Qianfan 和 Starlink 可能先挤压 GalaxySpace
        blocks:
          - type: paragraph
            body: >-
              对 GalaxySpace 来说，竞争风险异常结构化，因为最强对手不只是相邻同行。国内方面，Qianfan 已经把国家支持的规模计划和可见在轨进展结合起来：官方和独立来源显示，它采用 648 加 648
              的分阶段架构，目标最终达到 15,000 颗卫星；到 2026 年 6 月初，约 200 颗卫星已在轨。这不意味着 Qianfan
              没有风险——据报道，部分卫星未能抬升轨道——但它确实为发射时隙、产业注意力和频谱心智建立了明显更快的国内标尺。国际上，SpaceX 是更严酷的参照。公开市场数据和行业报道显示，Starlink 已发射规模超过
              12,000 颗卫星，2025 年发射节奏达到 165 次任务，2028 年前任务清单排得很满。意义不只在规模。围绕 EPFD
              功率限制的频谱争议显示，全球领导者能影响规则手册，而竞争者仍在证明基本部署速度。再叠加 SatSure 这类资产轻替代方案，它们卖的是决策智能，而不是资本开支很重的连接，GalaxySpace
              同时面对重量级星座对手和软件牵头的预算竞争者。缓释因素是 GalaxySpace 的产业基础比当前 Yinhe 壳更宽，但残余敞口仍高，因为能否摆脱基准压缩，取决于部署滞后，而不只取决于技术身份。
