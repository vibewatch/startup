      - number: '2.3'
        title: 买方、用户与付款方地图
        blocks:
          - type: paragraph
            body: >-
              与 GalaxySpace 相关服务最可信的买方是机构、运营商和基础设施项目，而不是城市零售家庭。国内侧，买方地图包括国资支持的星座运营商、可能用 D2D
              扩展覆盖的电信运营商、海事与近海用户、航空与科学考察用户、应急与公共安全机构，以及地面覆盖薄弱或昂贵地区的偏远工业站点。GSMA 的 D2D
              指南有助于解释预算逻辑：卫星移动服务最适合作为补充覆盖和韧性能力，在运营商控制的频谱安排下采购，而不是作为密集市场中地面网络的替代品。这也补充了中国特定证据：卫星互联网预计支撑
              6G、韧性和一体化基础设施。在国际市场，最清楚的出口式证据目前在千帆而不是 GalaxySpace，因为千帆已经披露了在巴西、马来西亚、哈萨克斯坦和土耳其的试用服务协议。由此可见，GalaxySpace 的实际
              SAM 可能是主权采购、运营商合作、移动连接和偏远地区基础设施支出的混合池。GalaxySpace 尚未披露已签约客户量、ARPU 或合同吞吐，因此还无法拆出一个准确的公开公司级服务 SAM。
