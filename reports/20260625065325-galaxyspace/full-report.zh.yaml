      - number: '8.3'
        title: 盈利路径与正反投资逻辑
        blocks:
          - type: paragraph
            body: >-
              公开档案不支持一个干净的「已经盈利」故事。它支持的是转型故事。GalaxySpace 的估值逻辑是：公司能用国家支持的制造量把产线填满，再用终端和服务在以后扩大利润率。这个逻辑合理，但尚未被证明。China
              Industry Report 最重要的提醒是，同样的国家订单集中度有助于利用率；但如果商业组合没有出现，也可能把利润率困在制造水平。SpaceX、AST 和 Telesat
              以不同方式强化同一课：规模仍可能亏钱，公开投资者可通过稀释为卫星可选性融资，资本结构会在增长证明减弱时压缩倍数。因此，牛市逻辑不是「卫星有战略价值，所以估值不重要」。牛市逻辑是 GalaxySpace 仍可能在
              2026-2027 年，从政策支持交付迁移到价值更高的服务经济性。反逻辑是，今天公开证据显示的制造证明远多于变现证明，因此在投资者观察到成功转型之前，估值可能已经提前折现了这件事。
            claimRefs:
