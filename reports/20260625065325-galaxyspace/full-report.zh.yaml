              潜在住宅宽带是 GalaxySpace 故事的一部分，但证据尚不能支撑一个已上线的零售产品。公司和合作伙伴官方材料反复把直连手机和手机到卫星服务称为技术演示、实验、验证或验证项目。泰国尤其说明问题，因为 MUT
