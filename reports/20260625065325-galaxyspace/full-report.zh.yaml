      - number: '1.5'
        title: 里程碑、国际化与负面视角
        blocks:
          - type: paragraph
            body: >-
              里程碑模式显示，公司正试图从概念验证走向塑造市场的基础设施。2020 年 GS-1a 验证宽带与 LEO 承载 5G 的概念；2022 年六星批量发射证明可制造部署；2023 年灵犀 03
              为可堆叠平板架构和柔性太阳翼增加在轨验证；2024-2025 年 PCCW 合作为 GalaxySpace 带来香港网关、面向海外的商业化表述，以及外部证据，证明其试验星座可支持高清视频和自动驾驶车辆控制。到
              2026 年，公开叙事再次扩展到 IPO 准备和直连手机野心。Reuters 称该公司是中国缩小与美国能力差距这一更大努力中的重要本土 LEO 制造商；PCCW 材料则显示，GalaxySpace
              不只做国内演示，也在尝试商业化跨境服务场景。负面视角比丑闻或发射失败更微妙。可访问来源中最清晰的怀疑框架来自 AInvest 和一篇 Starlink 竞赛评论，两者都认为，IPO
              故事仍更多依赖执行、资本强度和国家支持的战略叙事，而不是完整披露的经常性经济性。因此，公司战略弧线令人印象深刻，但风险尚未完全出清。
