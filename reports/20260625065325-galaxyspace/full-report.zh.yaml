      - number: '3.2'
        title: 频谱、轨道高度与架构
        blocks:
          - type: paragraph
            body: >-
              最关键的技术分野不只是“LEO 与非 LEO”，而是每个玩家想用无线层优化什么。GalaxySpace 的保留公开语料把银河定位为一个 5G 标准 LEO 移动通信星座，并且已经验证 Q/V 和 Ka
              频段链路。千帆的保留语料在架构侧更明确：已披露的 SAILSPACE-1 几何采用 36 个极轨面、Ku/Q/V 频段和 1,160 km 轨道。这让它更接近国资支持的宽带巨型星座，而不是窄实验。Starlink
              的栈更宽，使用 Ku、Ka 和 E 频段，且近期获批扩展 V 频段，因此成为这一组中最偏容量导向的公开基准。AST SpaceMobile
              是最清晰的对照，因为它称直连手机服务的关键是优质低频和中频频谱，而不是宽带星座强调的更高频宽带策略。SatSure 在本章核心比较中完全置身频谱竞赛之外，因为它的价值主张是应用层决策智能。对
              GalaxySpace 的技术含义是，其最强差异化不只是“中国 LEO 宽带”，而是一组面向 5G 的 Q/V 与 Ka 验证成果，其传播、设备和监管取舍都不同于 Starlink 的宽带栈，也不同于 AST
              的直连手机频谱姿态。
