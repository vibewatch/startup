      - number: '7.4'
        title: 只有申报、发射、芯片和资金一起改善，投资逻辑才成立
        blocks:
          - type: paragraph
            body: >-
              正确的承销姿态，是把缓释质量视为有条件，而不是绝对。GalaxySpace 确实有可触摸的缓释因素：可扩展工厂、支持性政策话语、可见的国际商务拓展，以及能拓宽融资选项的 IPO
              流程。这些因素单独都不能让业务变成低风险。它们只有在几个监测项同时成立时才有意义。第一，公司需要证明自己的申报栈和频轨协调正按计划推进。第二，Yinhe
              部署必须加速，且不能出现发射失败、调试拉长或可见冗余缺口。第三，出口敏感组件和半导体工具必须保持可得，或有可信替代。第四，C 轮后到 IPO
              的资金桥必须支持实际星座增长，而不是只延长制造故事。最后，GalaxySpace 必须证明预算不会先被 Qianfan 更快的国内壳，或 SatSure
              式资本需求更轻的软件竞争者拿走。如果多个压力源聚集，投资逻辑就会断裂——例如发射或调试问题发生时，申报仍不清楚，融资还依赖未来市场窗口。这种组合会把有前景的工业平台变成时间风险案例，而不是可扩展网络赢家。
