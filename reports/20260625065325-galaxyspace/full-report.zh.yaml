  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：主权优先，消费者零售其次
        blocks:
          - type: paragraph
            body: >-
              对 GalaxySpace 而言，相关市场边界既不是泛卫星制造，也不是中国大众家庭宽带。中国工信部 2026 年 3 月自己的解读把卫星互联网界定为战略性的空天地一体化基础设施层，用来填补光纤和 5G
              在经济性或物理条件上无法覆盖的缺口，例如海洋、沙漠、高原、偏远村庄和灾区。该解读还把海事作业、科学考察和航空宽带列为即时需求方向，并把卫星互联网视作 6G
              的核心组成部分。这一框架重要，是因为中国已经实现村村通宽带和县级 5G，削弱了 LEO
              宽带成为城市固定宽带主流替代品的理由。更近的替代集合反而是政府牵头的星座基础设施、直连设备的移动覆盖延伸、应急通信，以及船舶和飞机的移动连接。GalaxySpace 2026 年 1 月发射活动和所报道的 40
              多颗具备直连设备能力的卫星基础，说明其公开定位契合这个更窄的叠加市场：在对齐 Starlink 式中国零售消费者叙事之前，它先对齐非地面移动覆盖和主权通信基础设施。
