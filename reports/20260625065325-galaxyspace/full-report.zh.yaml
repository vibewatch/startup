  - id: TM004
    title: 监管批准和轨道权利路径
    columns:
      - 层级
      - 当前规则 / 状态
      - 决策者
      - 释放的能力
      - 对 GalaxySpace 的约束
    rows:
      - - ITU 申报 / 协调请求
        - 中国主管部门申报了 200,000 多颗卫星，GalaxySpace 似乎对应一项 187 颗卫星的申报
        - 中国申报主管部门 + ITU 无线电通信局
        - 让申请方进入国际频率 / 轨道协调流程
        - 申报不是运营牌照，也不保证收入
      - - 启用期限
        - 已申报资源必须在七年内启用，否则到期失效
        - ITU
        - 保住频谱和轨道资源的监管优先权
        - 启动倒计时，让发射节奏和首星时点在经济上变得关键
      - - 非 GSO 里程碑部署
        - BIU 后两年部署 10%，五年部署 50%，七年完成全量部署
        - ITU / WRC-19 框架
        - 抑制囤积资源，倒逼分阶段执行
        - 大型纸面星座会变成资本和发射执行力测试
      - - 国内标准体系
        - 中国在 2026 年批准成立卫星互联网系统与服务全国专业标准化技术委员会
        - 国家市场监督管理总局 / 标准制定机构
        - 建立通用术语、性能评估和产品标准
        - 标准化能减少混乱，但也会提高合规成本和协调要求
      - - 国内频谱 / 市场准入
        - MERICS 称，尽管政策支持增强，民营企业在牌照、频谱权利和市场优先级上仍面临不确定性
        - 中国监管机构和国家体系运营商
        - 决定哪些民营企业能从部件供应商转向服务运营商
        - 民营玩家结构性依赖国家控制的轨道和频谱通道
      - - 外国落地权和运营商合作
        - 千帆已披露海外试验；GalaxySpace 尚未公开披露同等外国落地权突破
        - 外国监管机构、电信运营商和伙伴政府
        - 把轨道容量转化为可计费的海外服务
        - 没有披露市场准入批准或合同，出口 TAM 很难承销
    notes: 监管路径重要，因为关键稀缺资产不只是硬件，而是频谱 / 轨道资源的合法、协调使用。 本表把监管主张和商业化里程碑拆开看。
