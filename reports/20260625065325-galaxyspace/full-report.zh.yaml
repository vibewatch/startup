      - number: '4.4'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              从财务上看，GalaxySpace
              更像一个工业能力故事，而不是一家已经可完整承销的运营公司。积极因素真实存在：公司有可信制造基地、可见的国资支持生产工作、一项已披露的大型天线订单代理，以及一组不断扩大的服务试点，未来可能支撑毛利更高的下游组合。这些信号足以让市场认真看待它作为中国领先卫星互联网制造商的地位。


              负面因素同样真实，而且对承销更重要。公开来源没有披露准确 C
              轮募资额、当前现金、直接烧钱、经审计收入、毛利率或客户集中度。偏负面评论的中心不是欺诈或产品失败，而是一个更简单的问题：估值假设产能、国家订单和演示能在融资依赖变得惩罚性之前转化为稳定收入和可接受毛利。如果批量交付延误，如果
              GW 集中度继续过高，或服务变现仍偏演示，公开估值叙事可能迅速重定价。


              因此，本章结论是混合的。收入质量在改善，但仍偏制造、与政策相关；毛利扩张取决于技术上可信但财务上未证明的服务；没有私有现金、积压订单和合同经济性数据，就无法确认资本充足性。正确的尽调姿态不是否定这个故事，而是拒绝只凭公开证据承销。
