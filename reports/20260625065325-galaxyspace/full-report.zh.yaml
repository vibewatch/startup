      - number: '1.4'
        title: 资本历史、投资人基础与 IPO 准备
        blocks:
          - type: paragraph
            body: >-
              GalaxySpace 的融资历史同时呈现典型创投资本支持和越来越厚的国资关联资本层。EqualOcean 提到早期投资方包括国投创业、顺为资本和 IDG Capital；腾讯 IPO 特稿又把 5Y
              Capital、高榕、源码资本和联想加入 2018 年 A 轮联合投资方。同一篇腾讯文章可用于把握估值方向：2018 年超过人民币 35 亿元，2019 年超过人民币 50 亿元，2020 年接近人民币 80
              亿元，2022 年约人民币 110 亿元；胡润在 2024 年标注为人民币 115 亿元。公开来源在已抓取语料中没有清楚披露 2026 年 2 月新 C 轮的准确金额或准确投后估值，尽管腾讯和财新均称该轮在
              IPO 进程加速前不久完成。更清楚的是治理和上市转段。财新、人民日报、Reuters 以及上交所托管的 Global Times 文章均报道，GalaxySpace 于 2026-03-30 向北京证监局提交 A
              股 IPO 辅导备案，辅导机构为华泰联合证券。企查查融资页也显示，2026-03-06 出现涉及多只基金的股权转让，说明上市推进前夕股权结构可能在重整。
