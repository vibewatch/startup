        - 索取监管沟通记录、申报优先级，以及政府项目在需求中的占比。
      - - 未来发射吞吐依赖中国供应商
        - LandSpace 和 CAS Space 正在进步，但中国仍缺乏轨道级常态化复用的公开证据
        - 高
        - LandSpace 距 Falcon 9 节奏仍很远；New Space Economy 称，中国常态化复用尚未公开
        - 索取已承诺发射窗口、发射供应商 SLA，以及跨运载工具的备份 manifest。
      - - 应用层变现选择权
        - 类 SatSure 软件层可在宽带容量提供商证明单位经济性之前，先拿走客户预算
        - 中
