      - number: '7.3'
        title: IPO 时点、创始人控制和制造到入轨的转换定义执行风险
        blocks:
          - type: paragraph
            body: >-
              GalaxySpace 的执行风险，不在于它能不能造卫星，而在于它能否足够快地把工厂产能、融资渠道和政策支持转成可持续部署网络。Xinhua 和 News.cn 描述了真实产业足迹：三天一颗的生产节奏、150
              颗中型卫星年产能，以及跨项目发射超过 40 颗自研卫星。但同一批来源也暗示了问题：2025 年实现产出仍只有 22 颗中型卫星，而 Jonathan McDowell 的 Yinhe 统计页仍只显示 8
              颗星座卫星。换句话说，制造叙事跑在了在轨宽带壳前面。资本和治理加剧这种错配。GalaxySpace 在完成新一轮 C 轮后，于 2026 年 3 月进入 IPO
              辅导，但公开来源仍未披露从工厂证明到更大星座部署之间的现金桥。治理也高度集中，创始人保留约 72.87%
              投票权。这可能加快决策，但如果定价、伙伴选择或节奏假设出错，也会集中下行。缓释因素是政策支持、国家相关资本和制造深度都真实存在。残余风险维持中高，因为公司仍要在时间压力下，把产业就绪转成已发射、已调试、可收费的网络容量。
