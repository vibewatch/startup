  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 融资时间线与估值重定价
        blocks:
          - type: paragraph
            body: >-
              GalaxySpace 的融资故事最好拆成两条弧线。第一条从 2018 年 A/A+ 序列延伸到 2022 年 B++
              轮，顺为、IDG、君联、经纬等创投机构，以及后来的建银国际和合肥关联基金，逐步把公司估值从超过人民币 35 亿元推高到约人民币 110 亿元。第二条是 2026 年 C 轮，公开来源将其投后估值置于约人民币
              320 亿元，并且通过京国瑞、亦庄产业投资、渤华资本，以及全国社保基金和中央汇金载体的间接参与，实质性地把股东结构推向国资支持或政策邻近资金。


              两个尽调提示很重要。第一，公开来源对 GalaxySpace 到底完成了多少次融资存在冲突：有的说八轮，有的说 11
              次融资。最可能的解释是统计口径不同——一些来源把子轮次合并为一个阶段，另一些则逐笔统计每次股权事件。第二，公开来源持续报道 2026 年估值，但公司评论和已审阅二级报道都没有披露 C
              轮准确现金募资额。因此，最可靠的公开事实是估值重定价，而不是新增净流动性。


              投资人验证也比用户简报暗示的更窄。已检索的 2026 年公开投资人名单清楚支持 IDG、顺为、君联、经纬、高瓴、中金资本、建银国际和多只国资基金。它们没有在已审阅来源集中点名云锋或 GIC
              Singapore。在招股书或官方股权结构披露出现前，这两个名字应视为未验证，而不是悄悄复述。财务信号是，GalaxySpace 已经从经典创投联合投资跨入战略性和国资支持融资，但准确稀释和现金跑道影响仍未公开。
