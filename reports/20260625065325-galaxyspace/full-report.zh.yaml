  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚点和建议
        blocks:
          - type: paragraph
            body: >-
              GalaxySpace 的公开估值锚点，标题很强，承销深度很弱。Caixin、SSE 托管的 Global Times 转引，以及中文财经媒体，都指向同一事实模式：2026 年 2 月 Series
              C，投后估值约 RMB 320 亿元，以及 2026-03-30 在北京由 Huatai United 辅导备案。这足以把「约 $4.4
              billion」视为真实当前标记。但仅凭公开证据，还不足以把这个标记视为可投资。公开材料仍未披露当前收入、毛利率、自由现金流，或该轮中嵌入的经济保护。由于估值从 2024 年 Hurun 参照到 2026 年 C
              轮的跃升，明显跑过任何已发布经营里程碑，建议必须保持价格敏感：research-more，中等信心，高风险，且公开证据下估值偏紧。正确起点不是假设它提供安全边际，而是检验该轮是否已经在给牛市情景定价。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
