      - number: '2.4'
        title: 审批、轨道权利与采用约束
        blocks:
          - type: paragraph
            body: >-
              监管审批是变现核心，因为轨道和频谱申报不等于可部署服务。ITU 框架要求申报在七年内投入使用，随后让非 GSO 星座接受部署里程碑约束，以防止频谱囤积；ITU
              也强调，申报数量不能直接等同于最终实际运行的物理卫星数。在中国，2026
              年政策信号偏支持：工信部把卫星互联网提升为战略增长引擎，国家技术委员会获批，将标准化卫星互联网系统和服务。但支持性政策不会消除结构性瓶颈。MERICS
              认为，民营玩家仍会面临牌照、测试、频谱权利和市场优先级摩擦，因为轨道位置和频谱高度由国家中介协调。Deloitte 显示，LEO 经济性仍受终端成本和密集市场容量上限约束；SatNews 的负面评论则认为，中国
              244,000 个轨道位置预留足迹远远领先于当前发射基础设施。对 GalaxySpace
              而言，这意味着估值相关性来自在受监管步骤中证明执行力——申报、标准、发射、运营商合作，最后是经常性服务收入——而不是只引用中国轨道野心的标题规模。
