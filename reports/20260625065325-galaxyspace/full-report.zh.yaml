      - number: '8.4'
        title: 牛市、基准和熊市情景，加上 IPO 准备度
        blocks:
          - type: paragraph
            body: >-
              情景分析把价格纪律问题变得具体。牛市情景可以支撑接近当前标记的估值，但前提是 GalaxySpace 把 GW
              参与转成已披露经常性收入，证明服务或终端能把利润率抬到合同制造水平以上，并让上市流程足够干净，使公开市场接受这个故事。基准情景明显更低，因为公开档案尚未证明收入规模。熊市情景更低，因为反向报道强调的交付风险、商业化滞后和治理审查，会同时打击经营预期和倍数选择。IPO
              时点上，公开记录显示有进展，但不是必然。辅导和政策变化让 2026-2027 年具备可能性，但 2027 年是更安全的承销假设，因为管理层尚未点名将采用的具体标准；盈利能力、股东合规和估值合理性，对 STAR
              式审核仍是活问题。
            claimRefs:
              - CV006
