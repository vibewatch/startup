      - number: '8.2'
        title: 可比估值组和收入倍数视角
        blocks:
          - type: paragraph
            body: >-
              可比组在方向上有用，但结构上很乱，这正是 GalaxySpace 当前价格难以签字的原因。SpaceX 或 Starlink 是向往的上界：Reuters 的 2026 IPO
              图表显示收入巨大，但仍有数十亿美元亏损；Forbes 对 Starlink 的讨论则指出，只有投资者相信电信规模服务经济性时，估值才有支撑。AST SpaceMobile
              是公开市场最慷慨的直连手机可比公司，尽管持续亏损和稀释，仍以三位数收入倍数交易。Telesat
              位于光谱另一端：它是有真实收入的上市卫星运营商，但杠杆、较慢增长和基础设施经济性主导叙事，因此倍数低得多。这三副镜头说明 GalaxySpace 估值正在隐含什么。按约 $4.4 billion
              的当前标记，如果投资者给予 AST 式可选性，只需要温和收入即可支撑；但如果市场最终把业务更像基础设施而非稀缺技术来对待，就需要数亿美元收入。
