  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: GalaxySpace 公开呈现的是一套分层通信栈，从卫星平台架构和 RF 载荷延伸到网关、终端和规划软件。
    approximationNotes: 这套栈由产品页面和公开技术资料综合而来，不是官方内部模块图。
    data:
      layers:
        - id: bus-layer
          label: 卫星平台架构层
          detail: G1 2.0 模块化硬件加灵活软件、G2 一体化平板平台，以及 G3 翼阵直连蜂窝平台，共同奠定物理和控制基线。
        - id: payload-layer
          label: 通信载荷层
          detail: 集成处理载荷、星间激光终端兼容性、导航增强载荷，以及直连蜂窝基站概念，位于卫星平台之上。
        - id: rf-layer
          label: RF 前端和天线层
          detail: Ka 多波束相控阵、Q/V 馈电天线、V/S 收发器、LNA、SSPA 和 Q/V 控制电子设备构成高频链路。
        - id: ground-layer
          label: 地面、网关和终端层
          detail: Q/V 网关站、专网 5G 集成、相控阵用户终端、SD-WAN 和智能网络管理，把星座接入用户工作流。
        - id: ops-layer
          label: 仿真和运营层
          detail: Digital Satellite 和 GalaxySim 提供数字孪生、服务、轨道和 ITU 干扰仿真能力，用于部署规划和验证。
    claimRefs:
      - CE001
