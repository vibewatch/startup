      - - 海事、航空、远征和应急连接
        - 面向船舶、飞机、灾害响应、科学考察和偏远任务的卫星回传与移动连接
        - 城市室内连接和商品化家庭宽带套餐
        - 公共安全机构、航空和海事运营商、研究机构、应急管理预算
        - 中国官方来源把这些识别为地面网络失效或难以经济建设时的紧迫需求池
      - - 全球商业 LEO 宽带服务基准
        - 全球市场报告覆盖的住宅、企业、工业、军用和移动卫星互联网服务收入
        - 泛太空经济活动、卫星电视和无关 GEO 通信服务
        - 消费者、企业、政府、军方、工业买方
        - 有用的外部 TAM 基准，但比 GalaxySpace 已披露位置更宽，也更商业成熟
      - - 卫星制造和发射相邻领域
        - 低成本卫星生产、柔性太阳能硬件和支撑星座经济性的发射相关基础设施
        - 纯软件电信服务和非太空数字基础设施
        - 星座运营商和发射生态买方
        - 重要的相邻价值池，因为发射节奏和批量生产决定申报能否变成服务收入
      - - 现状替代方案
        - 光纤、县域 5G、地面应急网络、GEO satcom 和现有运营商漫游安排
        - 无关消费应用和非连接软件支出
        - 现有电信和通信预算
        - 这些替代方案约束 GalaxySpace，因为中国已有广泛地面覆盖，卫星最适合作为补充层
