  - id: TU001
    title: 客户分层表
    columns:
      - 细分市场
      - 买方 / 用户 / 付款方
      - 用例
      - 规模 / 战略价值
      - 缺口
    rows:
      - - 电信运营商 / 运营商渠道
        - 买方且可能是付款方：True、PCCW Global 和 China Mobile 等电信运营商；用户是运营商工程团队和下游订户
        - LEO 回传、D2C 验证、网络覆盖扩展、企业或偏远地区分销
        - 战略价值最高，因为运营商可以聚合大量企业、政府和家庭端点
        - 公开证据以框架和试点为主；未披露生产收入或订户数
      - - 大学 / 研究机构
        - 买方或托管方：Mahanakorn University of Technology；用户是研究人员、学生和技术团队
        - 地面站托管、LEO 验证、劳动力培训、卫星网络实验
        - 直接收入中等，本地化和监管教育的战略价值高
        - 机构证据很强，但不能证明大额重复服务收入
      - - 政府相邻公共安全
        - 可能用户：应急响应人员和指挥中心；付款方不清楚或未披露
        - UAV 消防、远程指挥、无覆盖区域灾害响应
        - 战略重要，因为它展示了难服务的关键任务场景
        - 未披露具名采购授予或机构预算
      - - 海事 / 近海作业
        - 潜在买方：运营商、航运、渔业、近海机构或类似海警的用户；用户是船舶和近海团队
        - 公海连接、近海通信、远程监测
        - 叙事价值强，因为合作伙伴材料反复点名海事
        - 公开来源中没有具名商业航运客户
      - - 航空 / 空中移动
        - 潜在买方：运营商、政府或无人机运营方；用户是飞机、UAV 和移动平台运营方
        - 航空连接、空中移动测试、无人机作业
        - 对证明移动性能和未来交通用例很重要
        - 未披露具名航空公司或机场合同
      - - 偏远社区 / 机构
        - 潜在买方：运营商、政府或 NGO；用户是乡村诊所、学校、村庄、岛屿或沙漠社区
        - 地面网络稀疏地区的远程医疗、远程教育、宽带接入
        - 战略上行空间大，因为这是最清晰的社会价值叙事
        - 大多数证据仍是演示级，而不是订户级
      - - 住宅家庭（潜在）
        - 潜在未来付款方：通过运营商渠道或 D2C 产品触达的家庭订户
        - 家庭宽带或 direct-to-cell 消费连接
        - 如果监管、定价和终端简易度对齐，TAM 叙事巨大
        - 未公开定价、注册门户或活跃住宅订户证明
    notes: 分层把当前具名交易对手和未来终端用户目标分开；公开证据在运营商、大学和试点渠道上最强，在零售家庭上最弱。
