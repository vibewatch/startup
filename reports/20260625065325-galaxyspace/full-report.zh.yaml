  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与基准类别
        blocks:
          - type: paragraph
            body: >-
              GalaxySpace 没有一个干净的同业集合。最重要的直接基准是
              Starlink，因为在保留语料中，它是唯一已经证明规模化低地球轨道宽带网络实际形态的运营商：多频段频谱、极大的在轨舰队，以及其他玩家仍用来对标的发射机器。千帆是最接近的国内可比对象，因为它结合了上海国资支持、已披露的
              1,160 km Ku/Q/V 架构，以及已发射卫星数量明显高于 GalaxySpace 公开足迹。AST SpaceMobile 的竞争方式不同，但并不轻，因为它用低频和中频直连手机，而不是 Q/V 或 Ka
              侧重的宽带容量，攻击同一个“让普通手机处处可连”的叙事。SatSure 又是另一类替代品：它靠分析和行业工作流从空间数据中捕获价值，而不是靠消费者宽带覆盖。LandSpace 和 CAS Space
              不是零售连接品牌，但仍应放入竞争地图，因为发射节奏是中国星座竞争力的闸门输入。简言之，GalaxySpace
              同时面对全球部署基准、国内国资支持宽带基准、低频直连手机挑战者、轻资产变现者，以及决定谁能最快入轨的发射生态。
