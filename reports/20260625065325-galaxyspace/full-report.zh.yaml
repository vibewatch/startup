      - number: '6.4'
        title: 留存、扩张和集中度大多只能推断
        blocks:
          - type: paragraph
            body: >-
              留存和耐久性是公开客户档案里最弱的部分。公司没有披露任何 NRR、GRR、流失率、合同期限、续约或满意度指标。唯一能推断耐久性的方法，是看具名关系是否在推进。PCCW 是最好例子：关系明显从 MoU
              推到已安装网关站、已测试服务，再到战略框架。这个推进是正面的，但不等于披露经常性收入或续约日程。集中度风险同样明显。公开记录被很少几个具名对手方主导：True、PCCW、MUT、China Mobile，以及
              Dian Ke No.1 或消防演练等少数试点场景。这意味着客户集中度目前本质上是渠道集中度问题：如果某个运营商关系停滞，可见商业故事会随之消失一大块。反面是扩张潜力。True 可打开海事或联网车辆等 ASEAN
              板块，PCCW 可分销到香港和 Belt and Road 企业或政府相邻市场。但在 GalaxySpace 发布更多具名账户或已签生产合同之前，集中度仍高，扩张仍靠承诺牵引。
