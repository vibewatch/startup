      - number: '4.3'
        title: 成本结构、烧钱代理与星座资本需求
        blocks:
          - type: paragraph
            body: >-
              GalaxySpace 的公开运营故事先是资本强度，其次才是收入透明度。南通工厂不是边缘资产：它是估值论点成立的核心原因。新华社对工厂的报道描述了一个 15,000
              平方米工厂，拥有两条整星产线和四条子系统产线，三天生产节奏，并将周期缩短 80%。公开来源将当前年产能置于 100-150 颗卫星区间，并称 2025 年产出达到 22 颗；2026 年评论则把目标提升至约每月
              20 颗低轨卫星。今天已实现产出与明天目标节奏之间的差距，意味着即便还未考虑发射、网关和用户终端融资，公司也将继续承受 capex、营运资本和执行压力。


              难点在于 GalaxySpace 不披露现金、收入、毛利率或直接烧钱数字。最好的公开烧钱代理是定性的：公司在 IPO 辅导前立即完成新 C
              轮，评论者仍称该行业现金流紧张，多条偏负面来源称，从“烧钱”转向自我融资很可能要到 2027-2028 年，而不是今天。换句话说，市场承销的是未来利用率和未来服务，而不是当前披露的盈利能力。


              对任何超出当前八星 “Small Spiderweb” 测试网络的星座而言，行业基准都意味着巨大资本需求。NewSpaceEconomy 的 2026 年小卫星基准约为每颗 $1M 到
              $15M，由此得到纯硬件口径：100 颗卫星建设约需 $100M 到 $1.5B，300 颗卫星网络约需 $300M 到
              $4.5B，且尚未计入发射、网关和用户终端。即便考虑中国成本优势，方向也非常清楚：完整生产型星座所需融资，将远超服务演示，也远超公开来源披露的当前内部现金生成能力。
