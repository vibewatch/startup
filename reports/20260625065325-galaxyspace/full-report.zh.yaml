        - GalaxySpace 验证了 Q/V 和 Ka 链路，但 AST 明确把低频和中频蜂窝频谱放在核心位置
        - 按频谱层索取链路预算对比、手机支持情况和目标用例。
      - - 国内政策协同
        - 国家支持的 Qianfan 能更有效吸收政策注意力和轨道资源紧迫性
