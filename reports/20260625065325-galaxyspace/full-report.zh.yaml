  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 买方、用户与付费方分层
        blocks:
          - type: paragraph
            body: >-
              GalaxySpace 公开客户图谱仍以渠道为主，而不是以订阅用户为主。最清楚的具名买方和付费方是电信运营商，例如泰国 True Corporation、香港 PCCW Global，以及直连手机技术验证侧的
              China Mobile。最清楚的具名机构用户是 Mahanakorn University of
              Technology，它承载泰国地面站和研究合作。公共安全和海事情景也有证据，但更像试点使用证明，而非已披露的合同收入基础：Dian Ke No.1
              近海测试和北京—成都消防演练说明网络可能在哪些场景有用，不说明谁已经规模化付费。横跨这些细分场景，终端用户往往不同于商业合同方。True 和 PCCW 是运营商渠道，可继续向企业、政府和偏远社区销售；MUT
              是研究和验证伙伴；China Mobile 是运营商侧技术锚点；最终零售家庭用户则位于尚未完成的直连手机路线图末端。这个分层很关键：GalaxySpace
              今天可见的牵引力，更应理解为战略分销和能力证明，而不是多元化的经常性消费或企业账户组合。
