      - number: '3.4'
        title: 商业模式、包装与价值捕获
        blocks:
          - type: paragraph
            body: >-
              竞争集合也能按变现路径清楚拆分。Starlink 垂直整合最深：它在巨大装机基座之上销售服务、硬件和如今的直连手机容量来捕获价值。AST
              不同，因为其保留公开定位以合作伙伴为中心、适合批发；它设计成嵌入移动网络运营商，而不是复制消费者宽带产品。千帆和 GalaxySpace
              在公开定价上更难承销，因为保留语料在架构和规模目标上丰富，但在已实现合同结构上薄弱。这一点重要，因为重资本系统可以在证明持久定价权之前很久就显得具有战略重要性。SatSure
              再次改变框架：它卖的是行业工作流、风险模型和 EO 支持的决策，而不是 Mbps 或手机覆盖。因此，尽管它不是同类宽带运营商，却会在一些空间技术预算池中构成重要替代。对 GalaxySpace
              而言，变现挑战是双重的。它既要证明国产宽带与 5G 卫星栈能拿到有吸引力的经济性，也要证明软件和数据驱动的替代方案没有在同一客户需求上游抢走更快、更轻毛利的机会。
