            title: AST 和 Telesat 框定公开倍数区间
            body: AST 展示可选性能把估值拉多远，Telesat 则显示，一旦增长放缓且资产负债表压力主导，倍数会多快压缩。
            calloutType: insight
            claimRefs:
              - CV022
