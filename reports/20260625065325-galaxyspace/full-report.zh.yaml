      - number: '1.2'
        title: 徐鸣、创立故事与控制权
        blocks:
          - type: paragraph
            body: >-
              徐鸣是 GalaxySpace 不可替代的公开面孔。公司官方材料称其为创始人、董事长兼 CEO；财新、企查查和腾讯报道则把他与哈尔滨工业大学、Cheetah Mobile 以及更早在 360
              的产品开发工作联系起来。这组经历对创始人—市场匹配很关键：徐鸣把消费互联网规模化经验带到一家试图用软件式迭代速度工业化航天硬件的公司。腾讯的长篇 IPO
              报道尤其有助于还原创立故事，因为它描述了徐鸣想建设一个低成本、高性能 LEO 通信星座，并让其能与 OneWeb、SpaceX
              以及中国国有航天力量并列的野心。治理权仍然集中。财新和腾讯均称，徐鸣直接和间接持有公司 22.04% 股权，但通过特殊安排控制 72.87%
              表决权；企查查也列其为主体公司的法定代表人。更广泛管理层的公开证据薄得多。Craft 和 PCCW
              材料只露出部分国际业务角色，没有完整披露运营组织架构或投资人可用的董事会地图，因此即便不进入后文分析，关键人集中仍是概览层面的真实考量。
