  - id: TP003
    title: 定价 / 打包方式对比
    columns:
      - 公司
      - 公开合同模式
      - 公开价格 / 单位信号
      - 包含能力
      - 未知项
      - 含义
    rows:
      - - GalaxySpace
        - 星座与卫星互联网解决方案；制造叠加网络项目
        - 保留材料中未公开披露
        - LEO 宽带 / 面向 5G 的星座、载荷和平台能力
        - 实际合同定价、客户结构和利润率画像未公开
        - 经济质量比技术叙事难承保得多。
      - - Starlink
        - 硬件一体化叠加持续连接服务
        - 各市场有可见公开价格，但保留材料没有按地区口径归一
        - 终端、托管连接，以及扩展中的直连手机能力
        - 保留材料中，企业实际定价和国家层面的可比性仍不均衡
        - 本章最强的可见变现闭环和买方认知优势。
      - - Qianfan / SpaceSail
        - 国家支持的宽带平台；商业打包仍在成形
        - 保留材料中看不到公开零售或批发价格
        - 巨型星座架构和直连野心
        - 真实客户合同、ARPU 和补贴强度仍不清楚
        - 公开变现证据出现之前，运营规模可能已经快速做大。
      - - AST SpaceMobile
        - 移动网络运营商合作，批发式直连手机打包
        - 单用户经济性未公开
        - 与 MNO 伙伴整合的低 / 中频段天基蜂窝宽带
        - 收入分成、运营商经济性和手机侧变现仍不透明
        - 不必照搬 Starlink 零售模式，也能靠电信伙伴拿到分发。
      - - SatSure
        - EO 分析、决策智能和 EOaaS 解决方案组合
        - 没有带宽式单价；企业解决方案定价未公开
        - 农业、保险、银行、航空、公用事业和林业工作流
        - 自有数据与第三方数据的成本结构、产品级毛利率未公开
        - 相比宽带运营商，展示了一条更低 capex 的空间价值捕获路径。
      - - LandSpace / CAS Space
        - 按任务签发射合同，并打包发射服务
        - 保留材料中公开任务定价很少
        - 运载火箭、发射运营和星座部署能力
        - 已签 backlog、实际 ASP 和客户集中度仍未公开
        - 它们变现的是部署吞吐，而不是终端用户连接，但发射节奏仍会影响 GalaxySpace。
    notes: 本表比较的是打包模式，不是逐项可比价目表。保留语料对架构和节奏披露较多，对实际商业条款披露较弱，中国星座和发射合同尤其如此。
