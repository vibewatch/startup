  - id: TM005
    title: 增长驱动因素和约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 含义
      - 尽调问题
    rows:
      - - 覆盖缺口补位和韧性需求
        - 上行
        - 当前
        - 偏远地区、海洋、沙漠、高原和灾害场景，持续支撑对补充连接层的需求
        - 要求 GalaxySpace 拆分应急 / 公共安全、移动场景和近消费端需求
      - - 海事、探险和航空需求
        - 上行
        - 当前
        - 中国官方来源把海事作业、科学考察和航空宽带列为紧迫的卫星通信使用场景
        - 要求按垂直行业、以及政府客户与商业客户类型披露管线
      - - 6G 和融合网络政策支持
        - 上行
        - 中期
        - 卫星互联网在中国被定位为核心 6G 层和战略基础设施类别
        - 要求说明 GalaxySpace 如何把 6G 对齐转化为收入，而不只是供应基础设施
      - - 全球商业卫星互联网 CAGR
        - 上行
        - 当前至 2030 年
        - TBRC 从 2026 年 $7.42B 到 2030 年 $12.69B 的增长视角，支撑真实的外部市场背景
        - 要求 GalaxySpace 说明其对服务、硬件和基础设施收入份额的目标
      - - 量产和更轻硬件
        - 上行
        - 当前
        - GalaxySpace 的可展开柔性太阳翼设计，以及官方对量产的强调，说明硬件改进可提升发射效率
        - 要求披露实际卫星制造吞吐量和单位成本走势
      - - 终端成本门槛
        - 下行
        - 当前
        - Deloitte 的 $200-$500 终端成本区间，在买方预算薄弱的市场会压制采用
        - 要求 GalaxySpace 说明终端 ASP 假设和补贴依赖
      - - 密集市场容量限制
        - 下行
        - 当前
        - GSMA 和 Deloitte 都暗示，D2D 与 LEO 在密集或室内环境里只是补充层，不能完全替代全容量网络
        - 要求说明 GalaxySpace 目标需求中有多大比例真正位于密集市场地面覆盖之外
      - - 民营部门监管不确定性
        - 下行
        - 当前
        - MERICS 称，民营企业围绕频谱权利、牌照和市场优先级仍存在不确定性
        - 要求提供证据，证明 GalaxySpace 能在硬件供应和试验发射之外拿到权利
      - - 发射节奏和里程碑执行
        - 下行
        - 当前至中期
        - 负面评论认为，中国申报规模超过了近期发射场和发射能力
        - 要求给出现实部署节奏，并对照 ITU 里程碑和融资能力
      - - 申报版图被过度解读
        - 下行
        - 当前
        - ITU 申报头条数字可能夸大经济机会，因为申报只是主张，不是批准，也不是已获资金支持的需求
        - 承销应基于已披露合同和服务经济性，而不能只看轨道版图头条
