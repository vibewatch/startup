      - number: '2.2'
        title: 'Sizing lenses: global service revenue versus China constellation scale'
        blocks:
          - type: paragraph
            body: >-
              Public sizing data points split into two very different categories that should not be averaged together.
              The first category is service-market revenue: The Business Research Company sizes the global satellite
              internet market at $7.42 billion in 2026, up from $6.48 billion in 2025 and reaching $12.69 billion by
              2030. The second category is infrastructure or orbital-footprint scale: Orbital Radar says Guowang and
              Qianfan together plan more than 28,000 satellites and had launched more than 350 by mid-2026, while China
              Daily and IEEE ComSoc describe a much larger Chinese ITU filing wave covering more than 200,000
              satellites, including two nearly 97,000-satellite applications and a separate 187-satellite filing
              attributed to GalaxySpace. Global benchmarks clarify the gap between strategic ambition and operating
              scale: FCC approval in January 2026 lifted SpaceX’s Gen2 Starlink authorization to 15,000 satellites,
              while Eutelsat describes OneWeb as a 600-plus-satellite commercial constellation serving land, sea, and
              air. For underwriting, the most useful lens is therefore a layered one: a modest near-term global service
              market, a very large Chinese sovereign buildout ambition, and a narrower practical GalaxySpace wedge
              inside that buildout rather than a standalone disclosed retail TAM.
