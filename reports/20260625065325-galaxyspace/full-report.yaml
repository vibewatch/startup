  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Spectrum, orbital, and export-control clocks are the non-negotiable top-layer risk
        blocks:
          - type: paragraph
            body: >-
              GalaxySpace’s first-order risk is regulatory timing, not lack of ambition. The public evidence set says
              low-orbit spectrum and orbital resources are scarce, that first-come priority rules create real pressure
              to deploy on time, and that large NGSO systems now face an urgent five-to-seven-year sustainability
              challenge as filings multiply. That matters because GalaxySpace is trying to scale from a still-small
              Yinhe live shell while the broader Chinese market is already treating frequency-orbit compliance as a race
              condition. The legal stack is widening at the same time. China’s dual-use export-control regime now
              explicitly covers technology, services, and technical data, while U.S. advanced-computing controls remain
              active for China-linked entities. GalaxySpace is not just a generic satellite maker in this context: it
              has already broadened its scope into semiconductor-related businesses, which makes component-access and
              licensing questions more commercially relevant. The geopolitical layer raises the stakes again. Public
              analysis now frames orbital infrastructure as an increasingly dual-use domain where civilian and military
              narratives blur. The mitigation is policy support and China’s industrial prioritization of satellite
              internet, but the residual risk stays high because filing slippage, chip-access frictions, or cross-border
              permit delays can all transmit directly into the company’s rollout timetable.
            claimRefs:
