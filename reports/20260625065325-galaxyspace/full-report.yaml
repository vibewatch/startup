companyProfile:
  summary: >-
    GalaxySpace (银河航天) is a Beijing-based private commercial-space company building low-Earth-orbit satellite broadband
    infrastructure. Its public strategy combines in-house satellite and payload manufacturing, phased-array and Q/V-band
    communications hardware, and gradual commercialization through telecom-operator, enterprise, and public-service
    pilots. The company has progressed from its 2020 GS-1a proof satellite to an eight-satellite broadband test
    constellation, built a large Nantong manufacturing base, completed a February 2026 Series C that valued it at
    roughly RMB 32 billion, and entered A-share IPO counseling in March 2026.
  foundedDate: '2018-04-01'
  founders:
    - name: Xu Ming
      role: Founder, Chairman & CEO
      background: Harbin Institute of Technology graduate; former senior technical and operating roles at 360 and Cheetah Mobile.
      claimRefs:
        - CO009
        - CO010
        - CO011
  foundingLocation: Beijing, China
  headquarters: Beijing, China
  productSummary: >-
    Modular LEO communication satellites, communication payloads and core components, phased-array terminals, broadband
    and direct-to-cell solutions, and related network demonstrations for carrier, enterprise, and public-service use
    cases.
  customerFocus: >-
    Telecom operators, government and public-service users, research institutions, maritime and aviation-adjacent use
    cases, and other enterprise or regional partners needing off-grid or remote broadband connectivity.
  businessModel: >-
    Near-term monetization appears to come from satellite manufacturing, payload and terminal supply, SAR and
    state-linked batch production work, and eventually higher-margin satellite communication services as operator pilots
    convert into contracted usage.
  stage: Growth-stage private company in IPO preparation
  fundingStatus: >-
    Completed a February 2026 Series C at roughly RMB 32 billion post-money (about $4.4 billion) and began Beijing CSRC
    IPO counseling with Huatai United on 2026-03-30.
