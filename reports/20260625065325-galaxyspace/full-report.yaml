      - number: '8.5'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              This chapter does not end in “avoid” because GalaxySpace clearly has industrial substance; it ends in
              “research-more” because public evidence is still missing the variables that actually determine whether
              $4.4 billion is attractive. The first missing block is financial: audited revenue, gross margin, burn, and
              customer concentration. The second is capital structure: exact proceeds, dilution, preferences, and
              whether the Series C economic price matches the headline valuation. The third is public-market readiness:
              which STAR route management will actually use, how minority governance will be handled under concentrated
              voting control, and whether 2026-2027 commercialization can be documented in time for listing review. The
              thesis breaks if revenue turns out to be far below the thresholds implied by even conservative public
              comps, if commercial service monetization remains mostly demonstrative, or if the term sheet reveals
              downside protections that make the economic price much lower than the press headline. Without those
              answers, the current mark should be treated as a diligence benchmark rather than a green light.
            claimRefs:
