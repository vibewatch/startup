      - number: '2.4'
        title: Approvals, orbital rights, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Regulatory approvals are central to monetization because orbital and spectrum claims do not equal
              deployable service. ITU’s framework requires filings to be brought into use within seven years and then
              subjects non-GSO constellations to deployment milestones intended to prevent spectrum warehousing; ITU
              also stresses that filing counts are not direct proxies for the number of physical satellites that will
              ultimately operate. In China, 2026 policy signals are supportive: MIIT elevated satellite internet as a
              strategic growth engine, and a national technical committee was approved to standardize satellite internet
              systems and services. But supportive policy does not remove structural bottlenecks. MERICS argues that
              private players still face licensing, testing, spectrum-right, and market-priority frictions because
              orbital slots and spectrum remain highly state-mediated. Deloitte shows that LEO economics remain
              constrained by terminal cost and dense-market capacity limits, while adverse commentary from SatNews
              argues that China’s 244,000-slot reservation footprint is far ahead of current launch infrastructure. For
              GalaxySpace, this means valuation relevance comes from proving execution through regulated steps —
              filings, standards, launches, operator partnerships, and finally recurring service revenue — not from
              citing the headline size of China’s orbital ambition alone.
