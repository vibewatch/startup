chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Strategic Framing
        blocks:
          - type: paragraph
            body: >-
              GalaxySpace presents itself as a satellite-internet infrastructure company rather than a narrow component
              supplier. On its English about and home pages, the company says it is a leading provider of satellite
              internet solutions and a satellite manufacturer in China, built around independent R&D and low-cost mass
              production of communication payloads, core components, and satellite platforms. The same official
              materials frame the addressable product stack broadly: broadband communications, optical remote sensing,
              SAR, navigation augmentation, spectrum sensing, and eventual 5G/6G integration. Public footprint evidence
              shows a Beijing headquarters with development or manufacturing capabilities in Xi’an, Chengdu, and
              Nantong, which matters because the strategy is industrial as much as orbital. The one material identity
              wrinkle is timing and scale disclosure. EqualOcean dates the venture’s origin to December 2016 and names a
              five-person founding team, while GalaxySpace’s own about page narrates growth from April 2018. Officially,
              the company says it has grown to over 1,000 employees, but QCC reports only 198 insured staff for the main
              Beijing entity in the 2024 annual report, so the safer overview conclusion is that GalaxySpace operates as
              a larger group than the single listing entity alone reveals.
