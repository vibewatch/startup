            title: The differentiator is industrialization, not just one-off launches
            body: >-
              The strongest overview signal is that GalaxySpace now pairs real orbital milestones with a disclosed
              factory system. The combination of GS-1a, the 2022 batch launch, the Mini-Spider handover tests, and
              Nantong’s published annual capacity makes the company look more like a nascent constellation manufacturer
