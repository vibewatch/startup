  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation anchor and recommendation
        blocks:
          - type: paragraph
            body: >-
              GalaxySpace’s public valuation anchor is strong on headline and weak on underwriting depth. Caixin, the
              SSE-hosted Global Times relay, and Chinese financial media all line up around the same fact pattern: a
              February 2026 Series C, a roughly RMB 32 billion post-money valuation, and a 2026-03-30 Beijing counseling
              filing with Huatai United. That is enough to treat “about $4.4 billion” as a real current mark. It is not
              enough to treat the mark as investable on public evidence alone. Public materials still do not disclose
              current revenue, gross margin, free cash flow, or the economic protections embedded in the round. Because
              the valuation leap from the 2024 Hurun reference to the 2026 C round materially outran any published
              operating milestone, the recommendation has to remain price-sensitive: research-more, medium confidence,
              high risk, and stretched on public evidence. The right starting posture is to test whether the round is
              already pricing a bull case rather than to assume it offers a margin of safety.
