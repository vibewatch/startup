          - type: callout
            title: Orbital rights, launch cadence, and undisclosed economics are the gating risks
            body: >-
              The core risk is not whether China wants satellite internet; it clearly does. The risk is whether filings
              become deployed capacity quickly enough, whether private players like GalaxySpace can move through a
              state-mediated approvals stack, and whether the company can disclose pricing and revenue data that justify
              a bottom-up SAM or SOM rather than a thematic narrative.
