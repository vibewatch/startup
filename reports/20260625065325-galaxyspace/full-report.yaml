  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: sovereignty first, consumer retail second'
        blocks:
          - type: paragraph
            body: >-
              The relevant market boundary for GalaxySpace is not generic satellite manufacturing and not mass-market
              Chinese home broadband. China’s own March 2026 MIIT explainer frames satellite internet as a strategic,
              integrated space-air-ground infrastructure layer that fills coverage gaps where fiber and 5G are
              uneconomic or physically unavailable, such as oceans, deserts, plateaus, remote villages, and disaster
              zones. It also identifies maritime operations, scientific expeditions, and aviation broadband as immediate
              demand vectors and treats satellite internet as a core component of 6G. That framing matters because China
              has already achieved village broadband and county-level 5G, which weakens the case for LEO broadband as a
              mainstream urban substitute for fixed-line internet. Instead, the closer substitute set is government-led
              constellation infrastructure, direct-to-device mobile coverage extension, emergency communications, and
              mobility connectivity for ships and aircraft. GalaxySpace’s January 2026 launch activity and reported base
              of more than 40 direct-to-device-capable satellites indicate that its public positioning fits this
              narrower overlay market: it is aligned to non-terrestrial mobile coverage and sovereign communications
              infrastructure before it is aligned to a Starlink-style Chinese retail consumer narrative.
            claimRefs:
