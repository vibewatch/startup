      - number: '2.3'
        title: Buyer, user, and payer map
        blocks:
          - type: paragraph
            body: >-
              The most credible buyers for GalaxySpace-relevant services are institutions, operators, and infrastructure
              programs rather than urban retail households. On the domestic side, the buyer map includes state-backed
              constellation operators, telecom operators that may use D2D to extend coverage, maritime and offshore
              users, aviation and scientific-expedition users, emergency and public-safety agencies, and remote
              industrial sites in areas where terrestrial coverage is weak or expensive. GSMA’s D2D guidance helps
              explain the budget logic: satellite-mobile services work best as supplemental coverage and resilience
              purchased under operator-controlled spectrum arrangements, not as dense-market replacements for
              terrestrial networks. That complements China-specific evidence that satellite internet is expected to
              support 6G, resilience, and integrated infrastructure. Internationally, the clearest export-style evidence
              currently sits with Qianfan rather than GalaxySpace, because Qianfan has already disclosed trial service
              agreements in Brazil, Malaysia, Kazakhstan, and Turkey. The implication is that GalaxySpace’s practical
              SAM is likely a mixed pool of sovereign procurement, operator partnerships, mobility connectivity, and
              remote-area infrastructure spending. It is not yet possible to isolate an exact public company-specific
              service SAM because GalaxySpace has not disclosed signed customer volumes, ARPU, or throughput under
              contract.
