              GalaxySpace's public product surface is broader than a bus catalog. The company explicitly merchandises
              G1, G2, and G3 communication-satellite families; separate RF subsystems such as Ka-band phased arrays, Q/V
              feeder antennas, LNAs, SSPAs, and TT&C hardware; and networked solutions such as LEO-plus-5G private
              networking, mobile-platform remote control, digital-satellite simulation, and GalaxySim constellation
              planning. That mix matters because it shows a company trying to own the workflow from satellite design
              through user-terminal access and operational planning. The workflow claims are also fairly concrete rather
              than purely aspirational. Official solution pages describe smartphone or CPE access, SD-WAN and 5G
              slicing, phased-array terminals for mobile platforms, and deterministic remote-control links for vehicles
              and drones. External reporting strengthens that read-through: People’s Daily/Xinhua and Global Times both
              describe Beijing gateway or command-center loops, while the recruiting pages show the company is staffing
              across payloads, networks, intelligent manufacturing, and solutions. Product-wise, GalaxySpace looks more
              like a vertically integrated satellite-internet stack than a component-only supplier, even though the
              commercial proof remains demo-heavy.
