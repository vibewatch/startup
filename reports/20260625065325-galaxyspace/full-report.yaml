      - number: '4.3'
        title: Cost structure, burn proxies, and constellation capital needs
        blocks:
          - type: paragraph
            body: >-
              GalaxySpace’s public operating story is capital intensity first, revenue transparency second. The Nantong
              factory is not a side asset: it is the core reason the valuation case exists. Xinhua’s factory reporting
              describes a 15,000-square-meter plant with two full-satellite lines and four subsystem lines, a three-day
              production cadence, and an 80% cycle-time reduction. Public sources place current annual capacity in a
              100-150 satellite range and say 2025 output reached 22 satellites, while 2026 commentary lifts the target
              to roughly 20 low-orbit satellites per month. That gap between today’s realized output and tomorrow’s
              targeted cadence implies continuing capex, working-capital, and execution burden even before launch,
              gateway, and user-terminal financing are considered.


              The challenge is that GalaxySpace does not disclose cash, revenue, gross margin, or a direct burn number.
              The best public burn proxy is qualitative: the company raised a fresh C round immediately before IPO
              tutoring, commentators still describe the sector as cash-flow tight, and multiple adverse-leaning sources
              say the shift from “burning cash” to self-funding likely sits in 2027-2028 rather than today. In other
              words, the market is underwriting future utilization and future services, not current disclosed
              profitability.


              For any constellation beyond the current eight-satellite “Small Spiderweb” test network, industry
              benchmarks imply large capital needs. NewSpaceEconomy’s 2026 smallsat benchmark of roughly $1 million to
              $15 million per satellite yields a hardware-only envelope of about $100 million to $1.5 billion for a
              100-satellite build, and $300 million to $4.5 billion for a 300-satellite network, before launch,
              gateways, and user terminals. Even allowing for Chinese cost advantages, the direction is unmistakable: a
              full production constellation would require financing well beyond the service demos and beyond what public
              sources reveal about current internal cash generation.
