      - number: '7.3'
        title: IPO timing, founder control, and manufacturing-to-orbit conversion define execution risk
        blocks:
          - type: paragraph
            body: >-
              GalaxySpace’s execution risk is less about whether it can build satellites than whether it can convert
              factory capacity, financing access, and policy support into a durable deployed network quickly enough.
              Xinhua and News.cn describe a real industrial footprint: three-day production cadence, 150-satellite
              annual mid-size capacity, and more than forty self-developed satellites launched across programs. But
              those same sources also imply the problem: realized output in 2025 was still only 22 mid-size satellites,
              while Jonathan McDowell’s Yinhe statistics page still shows only eight constellation satellites. In other
              words, the manufacturing narrative is ahead of the live broadband shell. Capital and governance intensify
              that mismatch. GalaxySpace entered IPO tutoring in March 2026 after completing a fresh C round, but public
              sources still do not disclose the cash bridge from factory proof to larger constellation deployment.
              Governance is concentrated as well, with the founder retaining roughly 72.87% of voting rights. That may
              speed decisions, but it also concentrates downside if pricing, partner choice, or pace assumptions are
              wrong. The mitigation is that policy support, state-linked capital, and manufacturing depth are all real.
              The residual risk stays medium-high because the company still has to turn industrial readiness into
              launched, commissioned, paying network capacity under time pressure.
