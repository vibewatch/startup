      - number: '7.4'
        title: The thesis survives only if filings, launches, chips, and funding all improve together
        blocks:
          - type: paragraph
            body: >-
              The right underwriting posture is to treat mitigation quality as conditional rather than absolute.
              GalaxySpace does have tangible mitigants: a scalable factory, supportive policy rhetoric, visible
              international business development, and an IPO process that can widen financing options. None of these
              make the business low risk by themselves. They only matter if several monitors hold at the same time.
              First, the company needs proof that its own filing stack and spectrum-orbit coordination are progressing
              on schedule. Second, Yinhe deployment has to accelerate without a failed launch, elongated commissioning,
              or a visible redundancy gap. Third, export-sensitive components and semiconductor tooling must remain
              available or be credibly substituted. Fourth, the post-C-round and IPO bridge has to fund actual
              constellation growth rather than just extend a manufacturing story. Finally, GalaxySpace has to show that
              budgets are not being won first by Qianfan’s faster domestic shell or by SatSure-style software
              competitors with lighter capital needs. The thesis breaks if multiple stressors cluster—for example a
              launch or commissioning issue that lands while filings are unclear and financing still depends on a future
              market window. That combination would turn a promising industrial platform into a timing-risk case rather
              than a scalable network winner.
