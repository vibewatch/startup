  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Funding chronology and valuation repricing
        blocks:
          - type: paragraph
            body: >-
              GalaxySpace’s financing story is best read as two separate arcs. The first arc runs from the 2018 A/A+
              sequence through the 2022 B++ round, when venture investors such as Shunwei, IDG, Junlian, Jingwei, and
              later CCB International and Hefei-linked funds progressively repriced the company from above RMB3.5
              billion to about RMB11 billion. The second arc is the 2026 C round, which public sources place at roughly
              RMB32 billion post-money and which materially shifts the cap table mix toward state-backed or
              policy-adjacent money through Jingguorui, Yizhuang Industrial Investment, Bohua Capital, and indirect
              participation from National Social Security Fund and Central Huijin vehicles.


              Two diligence caveats matter. First, public sources conflict on how many financings GalaxySpace has
              actually completed: some say eight rounds, while others say 11 financings. The most likely explanation is
              counting methodology — some sources collapse sub-rounds into one stage while others count each equity
              event separately. Second, public sources consistently report the 2026 valuation, but neither company
              comments nor reviewed secondary reporting disclose the exact cash proceeds of the C round. That means the
              best verified public fact is valuation repricing, not net-new liquidity.


              Investor verification is also narrower than the user brief implied. The retrieved 2026 public investor
              lists clearly support IDG, Shunwei, Junlian, Jingwei, Gaoling, CICC Capital, CCB International, and
              multiple state-backed funds. They do not, however, name Yunfeng or GIC Singapore in the reviewed source
              set. Until a prospectus or official cap-table disclosure appears, those two names should be treated as
              unverified rather than quietly repeated. Financially, the signal is that GalaxySpace has crossed from
              classic venture syndication into strategic and state-backed financing, but the precise dilution and cash
              runway effects remain private.
