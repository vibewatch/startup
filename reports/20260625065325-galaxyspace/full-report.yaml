        title: Differentiation is real, but the trust surface and SDR-orbital disclosure remain thin
        blocks:
          - type: paragraph
            body: >-
              The product thesis is strongest where GalaxySpace can show vertical integration and repeated component
              maturity. Few public Chinese commercial-space companies expose, in one place, stackable flat-panel buses,
              Q/V feeder hardware, Ka multibeam phased arrays, onboard computing and TT&C components, phased-array user
              terminals, private-5G integration, and constellation simulation tools. That is the clearest product-level
              moat in the public record. Quality signals also exist: multiple device pages mention qualification tests,
              in-orbit validation, cold backup, cross redundancy, or second-generation production maturity. The weaker
              part of the package is the trust and software disclosure surface. The company does not publish a
              board-level SDR architecture, customer-facing API documentation, uptime commitments, or named
              cybersecurity certifications for these networked products. Likewise, GalaxySim and third-party
              constellation databases imply serious orbital and spectrum planning, but public sources stop short of
              revealing actual shell geometry, ITU filing identifiers, or gateway-topology detail. Investors can
              credibly underwrite engineering depth; they cannot yet fully underwrite communications-software assurance
              or orbital-rights execution from public evidence alone.
