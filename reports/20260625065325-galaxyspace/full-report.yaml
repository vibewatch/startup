      - number: '1.5'
        title: Milestones, Internationalization, and Adverse Framing
        blocks:
          - type: paragraph
            body: >-
              The milestone pattern shows a company trying to move from proof-of-concept into market-shaping
              infrastructure. GS-1a in 2020 proved broadband and 5G-over-LEO concepts; the 2022 six-satellite batch
              demonstrated manufacturable deployment; Lingxi-03 in 2023 added in-orbit validation for stackable
              flat-panel architecture and flexible solar arrays; and the PCCW partnership in 2024-2025 gave GalaxySpace
              a Hong Kong gateway, overseas-facing commercialization language, and external proof that its test
              constellation could support HD video and autonomous-vehicle control. By 2026, the public narrative
              broadened again to IPO preparation and direct-to-cell ambition. Reuters describes the company as an
              important domestic LEO manufacturer in China’s wider effort to close the US capability gap, while PCCW
              materials show that GalaxySpace is trying to commercialize cross-border service scenarios, not just
              domestic demos. The adverse lens is subtler than a scandal or launch failure. The clearest skeptical
              framing in accessible sources comes from AInvest and a Starlink-race commentary, both of which argue that
              the IPO story still depends on execution, capital intensity, and state-backed strategic narrative more
              than on fully disclosed recurring economics. That makes the company’s strategic arc impressive, but still
              not fully derisked.
