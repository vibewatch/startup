      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: China’s practical SAM is much narrower than its orbital filing ambition
            body: >-
              China’s more-than-200,000-satellite ITU filing footprint is strategically important, but it is not a proxy
              for near-term monetizable demand. The practical GalaxySpace wedge is in D2D, emergency resilience,
              mobility connectivity, and sovereign infrastructure programs — a real market, but far narrower than the
              headline orbital claim count.
            calloutType: insight
            claimRefs:
              - CM010
              - CM018
              - CM048
              - CM050
          - type: callout
            title: Demand exists wherever terrestrial coverage breaks or sovereignty matters
            body: >-
              Chinese official sources and GSMA’s D2D analysis converge on the same point: satellite connectivity is
              most valuable where terrestrial networks fail, where resilience matters, or where sovereignty and
              strategic independence justify non-terrestrial capacity. That fits GalaxySpace’s direct-to-device and
              constellation-infrastructure positioning better than a retail-home-broadband thesis does.
            calloutType: strength
            claimRefs:
