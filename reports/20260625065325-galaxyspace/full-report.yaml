    title: Investment KPIs
    type: kpi
    layout: wide
    summary: >-
      The six valuation-monitoring KPIs that matter most before a public-market or late-stage private investment
      decision.
    data:
      items:
        - label: Headline Series C mark
          value: ~$4.4B
          detail: Current public valuation anchor from February 2026 reporting.
        - label: Disclosed current revenue
          value: Not public
          detail: Core reason the recommendation cannot upgrade.
        - label: Revenue needed at 12x support
          value: ~$367M
          detail: Simple threshold for a more defensible growth-hardware multiple.
        - label: Earliest credible IPO window
          value: '2027'
