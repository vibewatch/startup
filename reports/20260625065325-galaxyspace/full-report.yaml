      - number: '1.2'
        title: Xu Ming, Founding Story, and Control
        blocks:
          - type: paragraph
            body: >-
              Xu Ming is the indispensable public face of GalaxySpace. Official company materials identify him as
              founder, chairman, and CEO, while Caixin, QCC, and Tencent coverage tie him to Harbin Institute of
              Technology, Cheetah Mobile, and earlier 360 product-development work. That combination matters for
              founder-market fit: Xu brings consumer-internet scaling experience to a company that is trying to
              industrialize space hardware with software-style iteration speed. Tencent’s long-form IPO coverage is
              especially useful for the founding story because it describes Xu’s ambition to build a low-cost,
              high-performance LEO communications constellation that could stand alongside OneWeb, SpaceX, and Chinese
              state aerospace incumbents. Governance is still concentrated. Caixin and Tencent both report that Xu
              directly and indirectly owns 22.04 percent of the company but controls 72.87 percent of voting rights via
              special arrangements, while QCC lists him as the legal representative of the main entity. Public evidence
              on the broader executive bench is much thinner. Craft and PCCW materials expose selective international
              business roles, but not a fully disclosed operating org chart or an investor-grade board map, so
              key-person concentration remains a real overview-level consideration even before later chapter analysis.
