      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Financially, GalaxySpace looks stronger as an industrial capability story than as a fully underwritable
              operating company. The positives are real: the company has a credible manufacturing base, visible
              state-backed production work, one disclosed large antenna-order proxy, and a widening set of service
              pilots that can eventually support a higher-margin downstream mix. Those signals justify taking the
              company seriously as a leading Chinese satellite-internet manufacturer.


              The negatives are also real and are more important for underwriting. Public sources do not reveal exact
              C-round proceeds, current cash, direct burn, audited revenue, gross margin, or customer concentration.
              Adverse-leaning commentary is not centered on fraud or product failure; it is centered on a simpler
              problem: the valuation assumes that capacity, state orders, and demonstrations can turn into stable
              revenue and acceptable gross margin before financing dependence becomes punitive. If batch delivery slips,
              if GW concentration stays too high, or if service monetization remains demo-heavy, the public valuation
              narrative can reprice quickly.


              The chapter verdict is therefore mixed. Revenue quality is improving but still manufacturing-heavy and
              policy-linked; margin expansion depends on services that are technically credible but financially
              unproven; and capital adequacy cannot be signed off without private cash, backlog, and contract-economics
              data. The right diligence posture is not to reject the story, but to refuse to underwrite it on public
              evidence alone.
