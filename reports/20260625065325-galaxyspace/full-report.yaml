  - id: TP001
    title: Competitor profile table
    enumerationScope:
      coverage: partial
      basis: >-
        Profiles the direct, adjacent, substitute, and launch-ecosystem actors most relevant to GalaxySpace’s 2026
        competitive positioning rather than every Chinese or global space company.
    columns:
      - competitor
      - category
      - scale / funding
      - target segment
      - differentiation
      - limitation
    rows:
      - - GalaxySpace
        - Chinese LEO broadband / 5G constellation builder
        - 8 launched satellites; 100-satellite factory capacity; 1,000 planned constellation ambition
        - Domestic satellite internet, 5G NTN, constellation manufacturing
        - 5G-standard LEO positioning; Q/V and Ka-band proof; in-house manufacturing
        - Public deployed scale is still small and live shell geometry or contract pricing remains sparse.
      - - Starlink
        - Global broadband benchmark
        - 12,342 launched / 10,682 in orbit by 2026-06-24; Falcon 9 benchmark ~150 launches per year
        - Consumer, enterprise, maritime, government, direct-to-cell extensions
        - Largest deployed scale, visible multi-band stack, launch cadence, and integrated service model
        - Faces spectrum/power-limit disputes and is difficult for late entrants to match on cadence.
      - - Qianfan / SpaceSail
        - Domestic state-backed broadband megaconstellation peer
        - 200 launched by 2026-06-24; 1,296 initial architecture; 15,000 long-term plan
        - Chinese and eventual global broadband / direct-connect coverage
        - Shanghai backing; Ku/Q/V disclosure; 1,160 km polar architecture
        - Commercial packaging and realized demand are still far less public than the architecture.
      - - AST SpaceMobile
        - Direct-to-cell architecture rival
        - 6 launched; 60 planned in January 2026 snapshot; launches ongoing
        - Mobile-network operators and ordinary smartphone users outside tower coverage
        - Premium low- and mid-band spectrum fit; direct-to-phone story; BlueBird roadmap
        - Schedule slipped and economics depend on operator partnerships rather than visible retail ARPU.
      - - SatSure
        - Downstream EO / analytics substitute
        - 2.1M+ farmer plots analysed; 85M hectares; 1.95 lakh villages; sector-focused workflow products
        - Agriculture, insurance, banking, aviation, utilities, forestry
        - Captures value through software, analytics, and EOaaS rather than constellation capex
        - Not a like-for-like broadband operator; infrastructure exposure differs sharply from GalaxySpace.
      - - LandSpace
        - Launch-supply enabler and adjacent competitive constraint
        - 10 launches planned next year; 13-day cycle demonstrated; new 2.3bn yuan factory
        - Chinese constellation builders needing faster or cheaper launch access
        - LOX-methane leadership; high-frequency launch ambition; reusable roadmap
        - Still far from Falcon 9 work rate and not yet on public proof of routine reuse.
      - - CAS Space
        - Launch-supply enabler and adjacent competitive constraint
        - Kinetica-1 reached its 11th launch; Kinetica-2 in first tier of reusable contenders
        - Constellation missions needing domestic launch throughput
        - Established mission cadence in SSO launches; relevant to constellation deployment throughput
        - Public proof of routine orbital-class reuse is still absent in China.
      - - Terrestrial 5G + fiber + state integrators
        - Status-quo substitute
        - Already deployed networks and government-backed integration budgets
        - Backhaul, rural coverage, enterprise connectivity, and sovereign infrastructure projects
        - Known procurement channels and lower orbital execution risk
        - Cannot offer the same ubiquitous off-grid coverage as a scaled LEO network.
    notes: >-
      Rows compare the solution shapes most relevant to GalaxySpace’s 2026 strategic position; scale mixes
      launched-satellite counts, factory capacity, and operating metrics because public disclosure differs sharply by
