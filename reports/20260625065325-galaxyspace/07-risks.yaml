  evidenceGaps:
  - type: missing-source
    severity: material
    topic: galaxyspace-specific-filings
    missingEvidence: GalaxySpace-specific ITU filing identifiers, domestic radio approvals, orbital-slot declarations, and coordination milestones for the Yinhe constellation.
    whyItMatters: Without the company’s own filing stack, investors cannot tell whether regulatory urgency is mostly generic sector pressure or an immediate schedule risk unique to GalaxySpace.
    diligencePath: Request the company’s ITU filing numbers, domestic frequency authorizations, and any milestone correspondence with Chinese radio authorities and launch regulators.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: launch-resilience
    missingEvidence: Launch insurance coverage, spare-satellite inventory, commissioning contingency plans, and recovery timelines after a failed Yinhe launch.
    whyItMatters: The live Yinhe footprint is still small enough that one failed launch or delayed commissioning could materially change service proof and investor confidence.
    diligencePath: Ask management for launch insurance terms, spare-satellite count, commissioning SLAs, and scenario analysis for a lost or delayed mission.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: blocking
    topic: capital-runway
    missingEvidence: Exact C-round proceeds, current cash, monthly burn, launch capex schedule, backlog cash-conversion profile, and IPO use-of-proceeds bridge.
    whyItMatters: Public sources show capital intensity and IPO timing but do not show whether GalaxySpace can finance the next shell without another dilutive raise or strategic funding event.
    diligencePath: Request board materials or a management bridge covering cash runway, committed capex, backlog milestones, and downside financing triggers through the next 24 months.
    relatedQuestionRefs:
    - QR026
    - QR029
    relatedTableRefs:
    - TR005
  - type: missing-source
    severity: material
    topic: export-sensitive-suppliers
    missingEvidence: A controlled-component BOM for payload, onboard processing, phased-array terminals, and semiconductor tooling showing exposure to U.S.-licensed items or equivalent domestic substitutes.
    whyItMatters: Without supplier-level detail, the export-control risk can only be framed directionally rather than underwritten quantitatively.
    diligencePath: Request procurement maps, ECCN/export-control classifications, substitution plans, and evidence of domestic supplier qualification for controlled components.
    relatedQuestionRefs:
    - QR006
    - QR007
    relatedTableRefs:
    - TR003
