- id: scale-launch-and-competition
  title: Qianfan and Starlink can squeeze GalaxySpace before Yinhe reaches escape velocity
  body: 'Competition risk is unusually structural for GalaxySpace because the strongest rivals are not merely adjacent peers. Domestically, Qianfan already combines state-backed scale plans with visible in-orbit progress: official and independent sources show a 648-plus-648 staged architecture toward a 15,000-satellite end state and roughly 200 satellites already in orbit by early June 2026. That does not make Qianfan risk-free—some satellites reportedly failed to raise orbit—but it does create a materially faster domestic benchmark for launch slots, industrial attention, and spectrum mindshare. Internationally, SpaceX is an even harsher reference point. Public market-data and industry reporting show Starlink operating at a launched scale above twelve thousand satellites and at a launch cadence of 165 missions in 2025, with packed manifests through 2028. The significance is not just size. Spectrum disputes around EPFD power limits show that the global leader can influence the rulebook while
    rivals are still proving basic deployment pace. Add SatSure-type asset-light substitutes, which sell decision intelligence rather than capex-heavy connectivity, and GalaxySpace faces both heavyweight constellation rivals and software-led budget competitors. The mitigation is that GalaxySpace’s industrial base is broader than its current Yinhe shell, but the residual exposure remains high because deployment lag, not technical identity alone, determines whether the company escapes benchmark compression.'
