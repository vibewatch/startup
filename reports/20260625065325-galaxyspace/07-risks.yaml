- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Filing and orbital-slot slippage
    - GalaxySpace-specific filing evidence
    - No credible evidence of company-specific ITU or domestic radio milestones versus launch plan
    - Move the case from execution-risk to regulatory-risk and require filing proof before underwriting more shell capex.
  - - Launch or commissioning failure
    - Yinhe mission anomaly
    - Failed launch, elongated commissioning, or publicly visible orbit-raising problem on a new Yinhe mission
    - Shift to downside case and ask for insurance, spare capacity, and revised service-proof timeline.
  - - Qianfan gap widening
    - Domestic peer scale delta
    - Qianfan keeps compounding launches while GalaxySpace’s live Yinhe count stays roughly flat
    - Assume lower strategic optionality and higher domestic benchmark pressure in valuation.
  - - Chip or tooling restriction
    - Controlled-component disruption
    - Named license issue, redesign cycle, or supplier substitution that affects payloads or terminals
    - Increase timeline risk and assume higher capex or lower performance until substitution is proven.
  - - Financing dependence
    - Capital bridge strain
    - IPO timing slips, fresh equity is needed earlier than expected, or management cannot show a 24-month runway to next shell milestones
    - Treat capital intensity as a core thesis risk and re-price dilution probability.
  - - Asset-light budget capture
    - Customer mix migration
    - New public wins cluster in EO/AI workflow vendors while GalaxySpace remains demo-heavy on broadband services
    - Cut commercialization confidence and demand clearer evidence of paid connectivity contracts.
  notes: Kill criteria are designed to translate the risk chapter into investability discipline rather than restate generic sector concerns.
