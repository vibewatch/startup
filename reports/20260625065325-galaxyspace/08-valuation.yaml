chapter:
  order: 8
  number: 8
  title: Valuation
summary: GalaxySpace’s February 2026 Series C established a real public headline valuation of about RMB 32 billion, or roughly $4.4 billion, but not a public operating case strong enough to prove that price. Public comps show that satellite valuations can range from AST-style triple-digit revenue multiples to Telesat-style infrastructure compression, and GalaxySpace has not disclosed the revenue, margin, or round-term data needed to know where it belongs inside that spread. The recommendation is research-more with medium confidence, high risk, and a stretched valuation stance until audited financials, cap-table economics, and clearer service monetization evidence appear.
sections:
- id: valuation-anchor
  title: Valuation anchor and recommendation
  body: 'GalaxySpace’s public valuation anchor is strong on headline and weak on underwriting depth. Caixin, the SSE-hosted Global Times relay, and Chinese financial media all line up around the same fact pattern: a February 2026 Series C, a roughly RMB 32 billion post-money valuation, and a 2026-03-30 Beijing counseling filing with Huatai United. That is enough to treat “about $4.4 billion” as a real current mark. It is not enough to treat the mark as investable on public evidence alone. Public materials still do not disclose current revenue, gross margin, free cash flow, or the economic protections embedded in the round. Because the valuation leap from the 2024 Hurun reference to the 2026 C round materially outran any published operating milestone, the recommendation has to remain price-sensitive: research-more, medium confidence, high risk, and stretched on public evidence. The right starting posture is to test whether the round is already pricing a bull case rather than to assume it
    offers a margin of safety.'
