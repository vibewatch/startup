- id: comparable-set
  title: Comparable valuation set and revenue-multiple lens
  body: 'The comp set is directionally useful but structurally messy, which is exactly why GalaxySpace’s current price is hard to sign off. SpaceX or Starlink is the aspirational upper bound: Reuters’ 2026 IPO graphic shows enormous revenue but still a multibillion-dollar loss, while Forbes’ Starlink discussion points to valuation support only if investors believe in telecom-scale service economics. AST SpaceMobile is the public market’s most generous direct-to-cell comp, trading at triple-digit revenue multiples despite persistent losses and dilution. Telesat is the opposite end of the spectrum: a public satellite operator with real revenue but much lower multiples because leverage, slower growth, and infrastructure economics dominate the story. Those three lenses show what GalaxySpace’s valuation is implicitly claiming. At roughly $4.4 billion, the current mark only needs modest revenue if investors award AST-like optionality, but it needs hundreds of millions in revenue if the market
    eventually treats the business more like infrastructure than scarcity technology.'
