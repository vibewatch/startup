- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Valuation / status
  - Revenue anchor
  - Multiple lens
  - Relevance to GalaxySpace
  - Key limitation
  rows:
  - - SpaceX / Starlink
    - ~$800B tender-style valuation discussion in late 2025; 2026 IPO context shows massive scale
    - Reuters graphic shows $18.7B 2025 SpaceX revenue; Forbes discusses $15.9B 2026 Starlink estimate
    - ~50x on Starlink-style estimate; much higher if using integrated 2025 revenue
    - Upper-bound strategic and service-network benchmark
    - Mixes launch and satellite economics and still includes heavy losses
  - - AST SpaceMobile
    - ~$20.3B-$26.4B public market cap in late June 2026
    - ~$84.9M trailing revenue
    - ~239x-310x EV/revenue depending on data vendor
    - Best public direct-to-cell optionality comp
    - Still deeply loss-making and dilution-heavy
  - - Telesat
    - ~$0.66B market cap and ~$2.86B EV in late June 2026
    - ~$388.3M trailing revenue
    - ~10.5x EV/revenue on Yahoo; lower equity-value-to-sales on pure market cap
    - Useful infrastructure and leverage floor for satellite economics
    - Different legacy mix and debt structure
  - - GalaxySpace current mark
    - ~$4.4B implied from a RMB 32B Series C
    - Revenue not publicly disclosed
    - ~$18M revenue needed at AST-like multiples; ~$88M at Starlink-like 50x; ~$421M at Telesat-like 10.5x
    - Shows what the existing price is implicitly demanding
    - No audited revenue or margin disclosure
  - - GalaxySpace public base case
    - Author underwriting range rather than market price
    - ~$120M-$180M revenue with mixed manufacturing and service economics
    - ~10x-14x revenue
    - Represents a more defensible public-evidence lane
    - Still depends on revenue assumptions rather than disclosures
  notes: 'Comparable set is intentionally partial: it covers the most relevant public and quasi-public lenses, not every global satellite or aerospace issuer.'
