- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence supporting it
  - Anti-thesis / limitation
  - What would change the view
  rows:
  - - Scarcity and policy tailwind
    - GW participation and STAR-policy expansion make GalaxySpace strategically relevant
    - Strategic relevance does not by itself reveal revenue quality or margin depth
    - Audited revenue plus signed commercial conversion data
  - - Manufacturing moat is real
    - Public sources support real batch-manufacturing capability and listing preparation
    - Manufacturing proof is stronger than service-monetization proof
    - Recurring service contracts and disclosed mix shift
  - - Service optionality could lift value
    - Business scope now includes terminals and satellite communication services
    - Public evidence still treats services mainly as future option value
    - Contracted ARPU, renewal, and contribution-margin data
  - - Public comps allow premium outcomes
    - AST and Starlink show that markets can reward satellite-growth narratives very aggressively
    - Those same comps also tolerate major losses and future financing needs
    - A disclosed path to self-funding or accretive public-market access
  - - Infrastructure downside is visible
    - Telesat shows how leverage and slower growth compress the multiple
    - GalaxySpace could land in this lane if the business stays manufacturing-heavy
    - Evidence of diversified customer mix and higher-value software/services
  - - IPO path is plausible but not closed
    - Counseling, policy change, and aerospace listing momentum all help
    - Exact listing standard, compliance quality, and valuation reasonableness are still undisclosed
    - Management naming the route and clearing governance questions
  notes: The table separates company quality from price quality so that the recommendation stays explicitly valuation-sensitive.
