- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Revenue / mix assumption
  - Multiple assumption
  - Implied valuation range
  - Probability signal / trigger
  rows:
  - - Bull
    - 2027 revenue roughly $220M-$300M with visible terminal or service monetization and better than manufacturing-only margins
    - 18x-22x forward revenue
    - ~$4.0B-$6.6B
    - Requires GW conversion, commercial-service proof, and clean IPO path
  - - Base
    - 2027 revenue roughly $120M-$180M with mixed manufacturing-plus-service economics and no major disclosure shock
    - 10x-14x revenue
    - ~$1.2B-$2.5B
    - Most realistic if production scales but service monetization remains early
  - - Bear
    - 2027 revenue below $90M, low-margin manufacturing concentration, and slower or messier listing progress
    - 4x-8x revenue
    - ~$0.6B-$1.5B
    - Triggered by delivery slippage, concentration, or financing overhang
  - - Current headline mark
    - About $4.4B post-money today
    - Equivalent to ~50x on $88M revenue or ~10.5x on $421M revenue
    - Requires investors to assume a very specific future revenue lane
    - Public evidence cannot yet show which lane is real
  notes: Scenario math is author-coded sensitivity, not company guidance; values are designed to show what the public headline already assumes.
