- id: profitability-path
  title: Path to profitability and thesis / anti-thesis
  body: 'The public file does not support a clean “already profitable” story. It supports a transition story. GalaxySpace is being valued as a company that can use state-backed manufacturing volume to keep lines full, then use terminals and services to expand margins later. That logic is plausible; it is not yet proven. China Industry Report’s most important caution is that the same state-order concentration that helps utilization can also trap margins at manufacturing levels if commercial mix does not appear. SpaceX, AST, and Telesat all reinforce the same lesson in different ways: scale can still lose money, public investors can finance satellite optionality with dilution, and capital structure can compress multiples if growth proof weakens. The bull thesis is therefore not “satellites are strategic, so valuation does not matter.” It is that GalaxySpace could still migrate from policy-backed delivery into higher-value service economics during 2026-2027. The anti-thesis is that public evidence
    today shows far more manufacturing proof than monetization proof, so the valuation may already be discounting the successful transition before investors can observe it.'
  claimRefs:
