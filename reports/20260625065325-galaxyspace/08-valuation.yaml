  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - research-more
    - Current valuation is real, but revenue, margin, and round-term disclosure are still missing
    - Do not underwrite the 320亿元 mark without private diligence
  - - Confidence
    - medium
    - Funding and IPO trail are well corroborated, but operating KPIs are not public
    - Keep the stance provisional rather than definitive
  - - Risk rating
    - high
    - Commercialization, capital intensity, customer concentration, and governance concentration all remain material
    - Demand downside protection or better disclosure before entry
  - - Valuation stance
    - stretched on public evidence
    - The mark jumped far faster than published operating metrics and already assumes meaningful future monetization
    - Treat current pricing as a ceiling to test
  - - Earliest credible IPO window
    - 2027 more credible than late 2026
    - Counseling is real, but profitability, compliance, and valuation-reasonableness questions remain open
    - Model a longer path to liquidity
  - - Primary catalyst
    - Revenue and term-sheet transparency
    - Audited sales, margin, and cap-table evidence would resolve the largest unknowns
    - Upgrade only if public or private proof closes the gap
  notes: This summary converts the public record into an investment stance; recommendation values are author judgments, not company guidance.
