  - CV045
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Audited revenue and gross margin
    - 2025 and latest-twelve-month revenue, gross margin, and segment mix
    - Without them, the current price cannot be mapped to any defensible multiple lane
    - Request audited financial pack or banker data room summary
  - - C-round economics
    - Exact proceeds, share price, liquidation preferences, anti-dilution, and option pool treatment
    - Headline post-money may differ materially from common-equity economics
    - Request executed term sheet and fully diluted cap table
  - - Customer concentration
    - GW or state-linked share of bookings, backlog, and cash receipts
    - Concentration determines whether scale improves or suppresses margins
    - Request top-customer bridge and contract-duration table
  - - Service monetization proof
    - Signed service contracts, terminal ASPs, ARPU, renewal logic, and margin contribution
    - The bull case depends on higher-value recurring revenue, not just manufacturing throughput
    - Request service-pipeline and cohort economics
  - - Listing pathway
    - Exact STAR or A-share route, governance clean-up plan, and timeline from counseling to filing
    - IPO timing and public-market eligibility directly affect liquidity and valuation support
    - Request counsel memo and board-approved listing roadmap
  notes: All asks are designed to collapse the current valuation range rather than merely collect interesting context.
