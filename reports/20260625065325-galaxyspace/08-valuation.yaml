- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue proves too small
    - Audited annual revenue lands below roughly $100M by 2027
    - Current valuation can no longer be defended even on generous public comp logic
    - Switch from research-more to avoid unless price resets
  - - Margins stay manufacturing-like
    - Gross margin remains near low-teens contract-manufacturing levels with no service lift
    - Scarcity narrative stops translating into attractive unit economics
    - Cut valuation range toward the Telesat/infrastructure lane
  - - Commercial service monetization remains demonstrative
    - No material paid terminal or connectivity contracts appear beyond pilots
    - Bull thesis loses its margin-expansion engine
    - Treat the company as a lower-multiple manufacturer
  - - IPO route stalls
    - STAR or A-share process slips beyond 2027 or governance issues escalate
    - Liquidity timeline lengthens while capital needs remain high
    - Demand a private-market discount and stronger downside protection
  - - C-round economics are weaker than headline
    - Term sheet reveals heavy liquidation preference, ratchets, or aggressive anti-dilution
    - Headline valuation overstates common-equity value
    - Re-underwrite on effective, not nominal, price
  notes: Triggers are chosen to be observable and price-relevant rather than generic company-quality concerns.
  claimRefs:
