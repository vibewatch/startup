- id: TM005
  title: Growth drivers and constraints table
  columns:
  - driver / constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Coverage-gap relief and resilience demand
    - up
    - current
    - Remote areas, oceans, deserts, plateaus, and disaster scenarios sustain demand for a supplemental connectivity layer
    - Request GalaxySpace segmentation between emergency/public-safety, mobility, and consumer-adjacent demand
  - - Maritime, expedition, and aviation demand
    - up
    - current
    - Official Chinese sources identify maritime operations, scientific expeditions, and aviation broadband as urgent satellite communications use cases
    - Request any disclosed pipeline by vertical and by government versus commercial customer type
  - - 6G and integrated network policy support
    - up
    - medium term
    - Satellite internet is positioned as a core 6G layer and strategic infrastructure category in China
    - Request product roadmap detail for how GalaxySpace monetizes 6G alignment versus pure infrastructure supply
  - - Global commercial satellite internet CAGR
    - up
    - current to 2030
    - TBRC’s $7.42B 2026 to $12.69B 2030 growth lens supports a real external market backdrop
    - Request GalaxySpace’s share of service, hardware, and infrastructure revenue aspiration
  - - Mass production and lighter hardware
    - up
    - current
    - GalaxySpace’s rollable solar-panel design and official emphasis on mass production suggest hardware improvements can expand launch efficiency
    - Request actual satellite manufacturing throughput and unit-cost trend
  - - Terminal-cost barrier
    - down
    - current
    - Deloitte’s $200-$500 terminal-cost range can suppress adoption where buyer budgets are thin
    - Request GalaxySpace terminal ASP assumptions and subsidy dependence
  - - Dense-market capacity limits
    - down
    - current
    - GSMA and Deloitte both imply D2D and LEO are supplemental rather than full-capacity substitutes in dense or indoor environments
    - Request the percentage of GalaxySpace’s target demand that is truly outside dense-market terrestrial coverage
  - - Private-sector regulatory ambiguity
    - down
    - current
    - MERICS describes ongoing ambiguity around spectrum rights, licensing, and market priorities for private firms
    - Request evidence that GalaxySpace can secure rights beyond hardware supply and pilot launches
  - - Launch cadence and milestone execution
    - down
    - current to medium term
    - Adverse commentary argues China’s filing scale outruns near-term pad and launch capacity
    - Request realistic deployment cadence relative to ITU milestones and financing capacity
  - - Filing-footprint overinterpretation
    - down
    - current
    - Headline ITU filing numbers can overstate economic opportunity because filings are claims, not approvals or funded demand
    - Underwrite to disclosed contracts and service economics, not to orbital-footprint headlines alone
  notes: Drivers and constraints are sequenced from demand pull to execution gating. Several constraints are structural rather than temporary, which is why public SAM/SOM must stay conservative absent contract and pricing disclosure.
