- id: TM004
  title: Regulatory approvals and orbital-rights path
  columns:
  - layer
  - current rule / status
  - decision-maker
  - what it enables
  - constraint for GalaxySpace
  rows:
  - - ITU filing / coordination request
    - Chinese administrations filed 200,000-plus satellites and GalaxySpace appears with a 187-satellite filing
    - Chinese filing administration + ITU Radiocommunication Bureau
    - Places a claimant into the international frequency / orbital coordination process
    - A filing is not an operating license or a revenue guarantee
  - - Bring-into-use deadline
    - Filed resources must be brought into use within seven years or expire
    - ITU
    - Preserves regulatory priority over spectrum and orbital resources
    - Creates a clock that makes launch cadence and first-satellite timing economically critical
  - - Non-GSO milestone deployment
    - 10% two years after BIU, 50% in five years, full deployment in seven years
    - ITU / WRC-19 framework
    - Discourages warehousing and forces staged execution
    - Large paper constellations become capital and launch execution tests
  - - Domestic standards regime
    - China approved a national satellite internet systems and services technical committee in 2026
    - State Administration for Market Regulation / standard-setting bodies
    - Creates common terminology, performance assessment, and product standards
    - Standardization can reduce chaos but also raises compliance overhead and coordination requirements
  - - Domestic spectrum / market access
    - MERICS describes licensing, spectrum-right, and market-priority ambiguity for private firms despite stronger policy support
    - Chinese regulators and state system operators
    - Determines which private firms can move from component supplier to service operator
    - Private players remain structurally dependent on state-controlled orbital and spectrum channels
  - - Foreign landing rights and operator partnerships
    - Qianfan has disclosed foreign trials; GalaxySpace has not publicly disclosed equivalent foreign landing-right wins
    - Foreign regulators, telecom operators, and partner governments
    - Converts orbital capacity into billable overseas service
    - Export TAM remains hard to underwrite without disclosed market-access approvals or contracts
  notes: The regulatory path matters because the key scarce asset is not just hardware but legal and coordinated use of spectrum/orbital resources. This table separates regulatory claims from monetization milestones.
