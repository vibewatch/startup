company:
  name: GalaxySpace (银河航天)
chapter:
  number: 2
  title: Market Analysis
  summary: GalaxySpace operates in a China-led LEO satellite internet market whose near-term economics are driven less by retail household broadband and more by sovereign infrastructure, direct-to-device overlays, emergency resilience, and mobility use cases. Public evidence supports a large strategic buildout lens — more than 28,000 planned Guowang and Qianfan satellites and more than 200,000 Chinese ITU-filed satellite slots — but the monetizable service market remains much narrower, with the global satellite internet market at $7.42 billion in 2026 and practical adoption constrained by launch cadence, terminal cost, spectrum/orbital milestones, and dense-market capacity limits. GalaxySpace’s demonstrated direct-to-device hardware and more than 40 launched compatible satellites make it relevant to this wedge, but the company has not publicly disclosed pricing, paying users, or contracted throughput, so exact SAM/SOM remains inferential.
sections:
- id: s1
  title: 'Market boundary: sovereignty first, consumer retail second'
  body: 'The relevant market boundary for GalaxySpace is not generic satellite manufacturing and not mass-market Chinese home broadband. China’s own March 2026 MIIT explainer frames satellite internet as a strategic, integrated space-air-ground infrastructure layer that fills coverage gaps where fiber and 5G are uneconomic or physically unavailable, such as oceans, deserts, plateaus, remote villages, and disaster zones. It also identifies maritime operations, scientific expeditions, and aviation broadband as immediate demand vectors and treats satellite internet as a core component of 6G. That framing matters because China has already achieved village broadband and county-level 5G, which weakens the case for LEO broadband as a mainstream urban substitute for fixed-line internet. Instead, the closer substitute set is government-led constellation infrastructure, direct-to-device mobile coverage extension, emergency communications, and mobility connectivity for ships and aircraft. GalaxySpace’s
    January 2026 launch activity and reported base of more than 40 direct-to-device-capable satellites indicate that its public positioning fits this narrower overlay market: it is aligned to non-terrestrial mobile coverage and sovereign communications infrastructure before it is aligned to a Starlink-style Chinese retail consumer narrative.'
