tables:
- id: TM001
  title: Market definition table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer/payer
  - relevance
  rows:
  - - China sovereign LEO satellite internet infrastructure
    - Constellation payloads, launches, gateways, spectrum/orbital coordination work, user terminals, and state or telecom procurement tied to national broadband and D2D buildout
    - Earth observation, unrelated launch services, navigation, and non-communications satellites
    - China SatNet, Shanghai Spacecom-style operators, telecom operators, central and local government programmes
    - Closest infrastructure layer for GalaxySpace because China’s public evidence is launch and constellation led rather than subscriber led
  - - Direct-to-device mobile coverage extension
    - Satellite payloads, mobile-spectrum integration, base-station-in-space functions, operator partnerships, emergency/SMS/data overlays
    - Standalone urban fixed broadband replacement and dense-area primary mobile capacity
    - Mobile network operators, regulators, public-safety authorities, handset ecosystem partners
    - Best fit with GalaxySpace’s reported smartphone-satellite architecture and 40-plus launched compatible satellites
  - - Maritime, aviation, expedition, and emergency connectivity
    - Satellite backhaul and mobility connectivity for ships, aircraft, disaster response, scientific expeditions, and remote missions
    - Urban indoor connectivity and commodity household broadband bundles
    - Public-safety agencies, aviation and maritime operators, research organizations, emergency-management budgets
    - Chinese official sources identify these as urgent demand pools where terrestrial networks fail or cannot be built economically
  - - Global commercial LEO broadband services benchmark
    - Residential, enterprise, industrial, military, and mobility satellite internet service revenues captured in global market reports
    - Generic space economy activity, satellite TV, and unrelated GEO communications services
    - Consumers, enterprises, governments, military, industrial buyers
    - Useful external TAM benchmark, but broader and more commercially mature than GalaxySpace’s disclosed position
  - - Satellite manufacturing and launch adjacency
    - Low-cost satellite production, flexible solar hardware, and launch-related infrastructure that enable constellation economics
    - Software-only telecom services and non-space digital infrastructure
    - Constellation operators and launch ecosystem buyers
    - Important adjacent value pool because launch cadence and mass production determine whether filings can become service revenue
  - - Status-quo substitutes
    - Fiber, county-level 5G, terrestrial emergency networks, GEO satcom, and existing operator roaming arrangements
    - Unrelated consumer apps and non-connectivity software spend
    - Existing telecom and communications budgets
    - These substitutes constrain GalaxySpace because China already has broad terrestrial coverage and satellite works best as a supplemental layer
  notes: Included spend is deliberately limited to communications infrastructure and service layers that can plausibly monetize LEO broadband or D2D capability; China’s existing terrestrial coverage argues against treating all household broadband spend as GalaxySpace-relevant TAM.
