callouts:
- calloutType: insight
  title: China’s practical SAM is much narrower than its orbital filing ambition
  body: China’s more-than-200,000-satellite ITU filing footprint is strategically important, but it is not a proxy for near-term monetizable demand. The practical GalaxySpace wedge is in D2D, emergency resilience, mobility connectivity, and sovereign infrastructure programs — a real market, but far narrower than the headline orbital claim count.
  claimRefs:
  - CM010
  - CM018
  - CM048
  - CM050
- calloutType: strength
  title: Demand exists wherever terrestrial coverage breaks or sovereignty matters
  body: 'Chinese official sources and GSMA’s D2D analysis converge on the same point: satellite connectivity is most valuable where terrestrial networks fail, where resilience matters, or where sovereignty and strategic independence justify non-terrestrial capacity. That fits GalaxySpace’s direct-to-device and constellation-infrastructure positioning better than a retail-home-broadband thesis does.'
  claimRefs:
  - CM002
  - CM003
  - CM004
  - CM035
  - CM036
  - CM048
- calloutType: risk
  title: Orbital rights, launch cadence, and undisclosed economics are the gating risks
  body: The core risk is not whether China wants satellite internet; it clearly does. The risk is whether filings become deployed capacity quickly enough, whether private players like GalaxySpace can move through a state-mediated approvals stack, and whether the company can disclose pricing and revenue data that justify a bottom-up SAM or SOM rather than a thematic narrative.
  claimRefs:
  - CM014
  - CM026
  - CM043
  - CM044
  - CM049
  - CM050
