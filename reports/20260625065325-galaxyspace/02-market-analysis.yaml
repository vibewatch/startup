  evidenceGaps:
  - type: missing-source
    severity: material
    topic: galaxyspace-sam
    missingEvidence: Segment-level signed pipeline, contracted throughput, terminal ASP, and buyer mix for GalaxySpace's service and infrastructure business.
    whyItMatters: Without contract and pricing disclosure, the report can only infer a practical SAM from policy and use-case evidence instead of isolating a company-specific public market.
    diligencePath: Ask management for current pipeline by segment, average selling price per terminal or service plan, and disclosed split between infrastructure sales and recurring service revenue.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
    - TM003
  - type: private-evidence-only
    severity: material
    topic: galaxyspace-som
    missingEvidence: Paying user counts, recurring revenue, capacity utilization, backlog, and gross margin by service layer.
    whyItMatters: No public data supports a bottom-up SOM or near-term revenue-share estimate, so public underwriting cannot translate launched satellites into billable economics.
    diligencePath: Request monthly active terminals, paying accounts, contracted backlog, ARPU, and utilized versus installed network capacity from management.
    relatedQuestionRefs:
    - QM024
  - type: conflicting-data
    severity: minor
    topic: filing-footprint
    missingEvidence: A constellation-by-constellation official rollup reconciling 200,000-plus versus 244,000 reported filing counts and GalaxySpace's exact priority rights within those filings.
    whyItMatters: The filing headline is strategically relevant but secondary summaries are not directly comparable; using one undifferentiated number could overstate or understate regulatory ambition.
    diligencePath: Pull the underlying ITU BR IFIC entries or the Chinese administration's filing list for each constellation and reconcile totals before treating a single filing count as canonical.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
    - TM004
