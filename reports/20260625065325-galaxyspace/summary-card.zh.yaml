  topStrengths:
    - 从卫星平台、载荷设计到工厂生产、终端和宽带演示，公司已经拼出真正的纵向一体化能力。
    - 政策方向高度一致，战略资本持续加持，并在 2026 年 2 月 C 轮融资和 2026 年 3 月 IPO 辅导备案中集中体现。
    - PCCW、True 以及泰国机构合作伙伴提供了可见的运营商和渠道证据，证明应用场景不止停在实验室测试。
    - 相控阵、Q/V 频段、星间链路和直连手机架构上的技术野心有可信度。
  topRisks:
    - 收入、毛利率、烧钱速度和 2026 年融资的精确到账金额仍未披露，限制了真正可承销的判断。
    - 从 8 颗卫星测试星座扩到 1,000 颗级别商业网络，需要重资本投入，也受制于发射节奏。
    - 频谱、轨道位置协调和部署窗口压力叠加，提高了被国家队和全球竞争对手拉开的风险。
    - 创始人控制权和特别表决权安排，让上市前治理风险更集中。
  unresolvedGaps:
    - C 轮精确现金到账、股权结构经济条款，以及任何清算优先权或反稀释保护均未公开。
    - 经审计收入、毛利率、订单积压和经常性服务收入结构仍不可得。
    - 公开客户证据主要来自试点、渠道和演示，而不是合同金额和续约记录。
    - 员工数和法律实体范围仍在集团层面公司口径与主体公司披露之间存在模糊。
