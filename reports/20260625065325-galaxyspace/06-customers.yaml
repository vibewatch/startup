- calloutType: risk
  title: Retail residential upside should not be mistaken for current customer traction
  body: Direct-to-cell and future household broadband are central to GalaxySpace’s long-term narrative, but the public proof base still points to technical verification, operator-led pilots, and regulatory preparation rather than to live residential products. Until the company or partners publish pricing, sign-up, and subscriber data, the household thesis remains optionality, not proof of adoption.
