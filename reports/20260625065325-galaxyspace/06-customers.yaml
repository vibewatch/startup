- id: u602
  title: 'Named customer proof: Thailand and Hong Kong are the strongest public references'
  body: 'The deepest named customer-proof is in Thailand and Hong Kong. In Thailand, GalaxySpace’s June 2024 seminar with MUT combined a real ground station, a live remote-health video call from Rayong province, and follow-on tests involving backhaul, vehicle-mounted connectivity, and airborne moving scenarios. MUT’s own page adds a valuable customer-side nuance: the collaboration was real and technically functional, but still pre-commercial and subject to Thai regulatory work before service launch. The February 2025 True Corporation memorandum takes that Thai beachhead a step further by moving from academic and demo proof into operator-channel planning. True’s own blog and Thai press coverage show the parties discussing Thai consumers, Thai enterprises, business-case analysis, enterprise-solution testing, and direct-to-cell validation. In Hong Kong, PCCW Global provides the clearest evidence that GalaxySpace can plug into an established enterprise carrier. The relationship moved from a
    2024 MoU to a 2025 gateway-station installation and 100 Mbps verification tests, then to a broader framework for Hong Kong and Belt-and-Road deployment. Even so, all named proofs remain pilot-, framework-, or validation-oriented. None of the public materials disclose contracted revenue, subscriber counts, or production-service volumes for these accounts.'
