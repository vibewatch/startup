- id: u605
  title: Retail residential broadband is plausible, but still pre-commercial and exposed to commercialization risk
  body: 'Potential residential broadband is part of the GalaxySpace story, but the evidence does not yet support a live retail product. Official company and partner materials repeatedly describe direct-to-cell and mobile-to-satellite services as technical demonstrations, experiments, verifications, or validation programs. Thailand is especially revealing because MUT states outright that LEO commercial service still needs regulatory study and testing before commercial launch. Third-party coverage likewise describes GalaxySpace’s handset-oriented satellites as early development and as dependent on managed terminals or partner channels rather than on a direct self-serve consumer funnel. That means the most defensible framing today is that GalaxySpace is building optionality for future household or mass-market connectivity—especially in remote areas—but has not yet converted that optionality into public pricing, sign-up infrastructure, or disclosed subscribers. The adverse case comes from outside
    the company: MERICS argues that China’s satellite-internet build-out has underdelivered so far and still faces launch and deployment bottlenecks, while also carrying dual-use security concerns that can slow foreign procurement. For this chapter, that means retail upside should be treated as a future possibility layered on top of current operator and institutional validation, not as an existing customer base.'
