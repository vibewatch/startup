tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - segment
  - buyer / user / payer
  - use case
  - scale / strategic value
  - gap
  rows:
  - - Telecom operators / carrier channels
    - 'Buyer and likely payer: telecom operators such as True, PCCW Global, and China Mobile; users are operator engineering teams and downstream subscribers'
    - LEO backhaul, D2C validation, network coverage extension, enterprise or remote-area distribution
    - Highest strategic value because operators can aggregate many enterprise, government, and household endpoints
    - Public evidence is framework- and pilot-led; no disclosed production revenue or subscriber counts
  - - Universities / research institutions
    - 'Buyer or host: Mahanakorn University of Technology; users are researchers, students, and technical teams'
    - Ground-station hosting, LEO validation, workforce training, satellite-network experimentation
    - Moderate direct revenue, high strategic value for localization and regulator education
    - Institutional proof is strong, but it is not proof of large recurring service revenue
  - - Government-adjacent public safety
    - 'Likely user: emergency responders and command centers; payer unclear or undisclosed'
    - UAV firefighting, remote command, disaster response in no-coverage zones
    - Strategically important because it showcases hard-to-serve mission-critical scenarios
    - No named procurement award or agency budget disclosure
  - - Maritime / offshore operations
    - 'Potential buyers: carriers, shipping, fisheries, offshore agencies, or coast-guard-like users; users are vessels and offshore teams'
    - Open-sea connectivity, offshore communications, remote monitoring
    - Strong narrative value because maritime is repeatedly named in partner materials
    - No named commercial shipping customer in public sources
  - - Aviation / airborne mobility
    - 'Potential buyers: carriers, governments, or drone operators; users are aircraft, UAVs, and moving-platform operators'
    - Aero connectivity, airborne moving tests, drone operations
    - Important proof of mobility performance and future transport use cases
    - No named airline or airport contract disclosed
  - - Remote communities / institutions
    - 'Potential buyers: operators, governments, or NGOs; users are rural clinics, schools, villages, islands, or desert communities'
    - Telemedicine, remote education, broadband access where terrestrial networks are sparse
    - Large strategic upside because this is the clearest social-value narrative
    - Most proof is still demo-grade rather than subscriber-grade
  - - Residential households (potential)
    - 'Potential future payer: household subscribers via operator channels or D2C offer'
    - Home broadband or direct-to-cell consumer connectivity
    - Huge TAM narrative if regulation, pricing, and terminal simplicity align
    - No public pricing, sign-up portal, or active residential subscriber proof
  notes: Segmentation separates current named counterparties from future end-user targets; public evidence is strongest for carrier, university, and pilot channels and weakest for retail households.
