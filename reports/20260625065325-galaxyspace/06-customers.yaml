company:
  name: GalaxySpace (银河航天)
chapter:
  number: 6
  title: Customers
  summary: As of 2026-06-25, GalaxySpace’s best public customer proof is concentrated in carrier and institutional channels rather than in disclosed end-user scale. Thailand provides the clearest remote-area and operator evidence through MUT and True Corporation, while Hong Kong provides the strongest enterprise-carrier proof through PCCW Global’s installed gateway station and 100 Mbps LEO tests. The customer story is therefore credible at the pilot and channel-partner layer, but still thin on recurring revenue, retention, military procurement, and retail residential commercialization.
sections:
- id: u601
  title: Buyer, user, and payer segmentation
  body: 'GalaxySpace’s public customer map is still channel-led rather than subscriber-led. The clearest named buyers and payers are telecom operators such as True Corporation in Thailand, PCCW Global in Hong Kong, and China Mobile on the direct-to-cell technology-validation side. The clearest named institutional user is Mahanakorn University of Technology, which hosts the Thai ground-station and research collaboration. Public-safety and maritime evidence exists too, but it appears as pilot usage proof rather than as a disclosed contracted revenue base: the Dian Ke No.1 offshore test and the Beijing-Chengdu firefighting drill show where the network could matter, not who already pays at scale. Across these segments, the end user often differs from the commercial counterparty. True and PCCW are carrier channels that can sell onward to enterprises, governments, and remote communities; MUT is a research and validation partner; China Mobile is a carrier-side technology anchor; and the eventual
    retail household sits at the far end of a still-unfinished direct-to-cell roadmap. That segmentation matters because it means GalaxySpace’s visible traction today is best understood as strategic distribution and proof-of-capability, not as a diversified portfolio of recurring consumer or enterprise accounts.'
