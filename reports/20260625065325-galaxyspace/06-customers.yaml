- id: u603
  title: Government-adjacent, maritime, aviation, and remote-area use cases exist, but mostly as pilots
  body: 'The user specifically asked about government or military contracts, aviation partners, maritime customers, enterprise broadband trials, and remote-area pilots. The public record supports pilot evidence across most of those categories, but not a named military procurement contract. Maritime relevance is explicit in both the True and PCCW narratives, and the South China Sea test aboard Dian Ke No.1 gives GalaxySpace a named offshore validation setting. Aviation or airborne relevance appears through Thailand’s moving-platform tests, PCCW’s explicit aero use case, and the company’s repeated focus on drones and direct-to-cell mobility. Government-adjacent demand is visible through public-safety applications such as the 2025 firefighting drill and through policy-linked visibility at the Hong Kong forum, but public sources stop short of naming a defense buyer or publishing an award document. Remote-area proof is stronger: the Rayong nursing-home telemedicine call, the talk of islands,
    deserts, and mountain villages, and the carrier framing around enterprise and government users in remote areas all show why satellite broadband could matter. The key limitation is stage. These are proofs of operational relevance and network feasibility, not yet a disclosed book of production government, maritime, or aviation accounts.'
