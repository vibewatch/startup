callouts:
- calloutType: insight
  title: Thailand and Hong Kong provide the clearest named customer proof, but both are still validation-led
  body: 'GalaxySpace’s strongest public customer evidence comes from two geographies: Thailand, where MUT and True validate remote-area and carrier use cases, and Hong Kong, where PCCW provides a tested gateway station and enterprise distribution channel. In both cases the record is materially stronger than a logo wall, yet still weaker than a production customer book because contract values, subscriber counts, and renewals remain undisclosed.'
