- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - True Corporation opens ASEAN sectors such as maritime, agriculture, education, and connected vehicles
    - High reliance on a single disclosed Thai carrier channel for ASEAN narrative
    - Could unlock a wide regional footprint if pilot work converts, but failure would weaken the Southeast Asia thesis
    - Request milestone plan, commercial launch schedule, and budget commitments from both sides
  - - PCCW Global can distribute into Hong Kong and Belt-and-Road enterprise or government-adjacent markets
    - Public record is heavily concentrated in one Hong Kong carrier relationship
    - Carrier channel could scale faster than direct sales, but over-reliance would keep proof concentrated
    - Request paying-customer numbers behind the PCCW channel and any government/enterprise pilots
  - - China Mobile D2C validation can anchor domestic carrier relevance
    - Validation-stage evidence may not translate into recurring service revenue
    - Important for signaling domestic carrier fit, but weak as current revenue proof
    - Request service-roadmap, trial conversion, and procurement detail from the China Mobile program
  - - International partnership list now spans multiple countries
    - Most countries outside Thailand and Hong Kong are unnamed by counterparty and stage
    - Breadth story is stronger than monetization story
    - Request country-by-country partner roster with stage and economics
  - - Government-adjacent pilots show mission-critical relevance
    - No named military contract or public-sector budget line is disclosed
    - Can help credibility in emergency response, but cannot yet support a defense-revenue thesis
    - Request procurement notices, contract values, or agency reference letters
  - - Retail broadband remains optional future upside
    - Lack of pricing, subscribers, and regulatory clarity means current concentration rests on channel partners
    - Retail could diversify revenue later, but it does not diversify today
    - Request launch timing, tariffs, and regulatory approvals by geography
  notes: This table treats concentration as channel concentration because so few named accounts are public; impacts are strategic until revenue values are disclosed.
