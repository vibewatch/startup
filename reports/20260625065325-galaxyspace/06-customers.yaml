- id: u604
  title: Retention, expansion, and concentration remain mostly inferential
  body: 'Retention and durability are the weakest parts of the public customer file. No public NRR, GRR, churn, contract length, renewal, or satisfaction metrics are disclosed. The only way to infer durability is to look for progression within named relationships. PCCW is the best example: the relationship clearly advanced from MoU to installed gateway station to tested service and then to a strategic framework. That progression is positive, but it is not the same as disclosed recurring revenue or a renewal schedule. Concentration risk is also evident. A very small number of named counterparties dominate the public record: True, PCCW, MUT, China Mobile, and a handful of pilot contexts such as Dian Ke No.1 or the firefighting exercise. That means customer concentration is currently a channel-concentration question: if one operator relationship stalls, a disproportionate share of the visible commercial story disappears with it. The flip side is expansion potential. True can open ASEAN sectors
    such as maritime or connected vehicles, while PCCW can distribute into Hong Kong and Belt-and-Road enterprise or government-adjacent markets. But until GalaxySpace publishes more named accounts or signed production contracts, concentration remains high and expansion remains promise-led.'
