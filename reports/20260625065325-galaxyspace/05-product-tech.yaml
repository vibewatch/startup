callouts:
- calloutType: strength
  title: GalaxySpace's product signal is vertical integration, not a single hero satellite
  body: The strongest product signal is the visible stack from buses and RF subsystems through private-5G integration, phased-array terminals, and simulation tools. That makes the company look more like an integrated LEO communications platform builder than a one-satellite developer.
  claimRefs:
  - CE023
  - CE024
  - CE025
  - CE026
  - CE038
- calloutType: insight
  title: Beijing appears to be the operations and payload node while Nantong is the disclosed serial-production node
  body: Public demos and recruiting repeatedly point to Beijing for gateway operations, payload or network work, and command loops, but all quantified production metrics in the reviewed set sit in Nantong. That split is strategically coherent and analytically important.
  claimRefs:
  - CE029
  - CE031
  - CE032
  - CE033
  - CE039
- calloutType: risk
  title: The SDR story is still architecture-level, not board-level
  body: GalaxySpace clearly discloses flexible software architectures and digital processing payloads, but the reviewed public record never names a standalone SDR card, FPGA partition, or reconfiguration workflow. That matters because direct-to-cell and multibeam systems usually turn on those implementation details.
  claimRefs:
  - CE001
  - CE004
  - CE025
  - CE040
- calloutType: risk
  title: Orbit and trust execution still need private diligence
  body: GalaxySim and third-party constellation profiles imply serious filing and shell planning, while hardware pages expose several quality controls. But public materials still stop short of showing exact orbital rights, gateway topology, uptime commitments, or named cybersecurity certifications.
  claimRefs:
  - CE026
  - CE041
  - CE042
  - CE044
