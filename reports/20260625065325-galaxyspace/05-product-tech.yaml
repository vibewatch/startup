- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Modular bus hardware plus flexible application software
    - Core platform abstraction for G1 2.0 and later communications buses
    - Onboard compute, power, thermal, and payload interfaces must stay stable across revisions
    - No public software-reconfiguration or update-governance detail
  - - Integrated processing payloads and onboard computing
    - Handle payload processing, bus control, and potentially direct-to-cell functions
    - Depends on high-performance onboard compute and verified software logic
    - Board-level SDR or FPGA partitioning is not disclosed publicly
  - - Phased-array antenna layer
    - Creates multi-beam user or payload connectivity and underpins mobile or D2C links
    - Depends on microsystem integration, beam control, and RF front-end maturity
    - No public array-gain, scan-loss, or thermal-derating tables
  - - Q/V feeder-link chain
    - Moves high-capacity feeder traffic between satellite and gateway through antenna, controller, and V/S conversion
    - Depends on steerable Q/V antennas, V/S conversion, and reliable control electronics
    - End-to-end feeder efficiency and weather-margin disclosure are absent
  - - TT&C and platform-management layer
    - Runs telemetry, telecommand, ranging, payload management, and encryption on control links
    - Depends on integrated bus computer and S/V-band transponder
    - System-level assurance boundaries are not publicly described
  - - Power and structures layer
    - Provides stowage, deployment, energy, and stacked-launch mechanics
    - Depends on flexible solar wings, separation systems, and production quality
    - No public deployed-power or lifecycle degradation curves
  - - Ground/gateway/network layer
    - Bridges satellites into private 5G, command centers, and user terminals
    - Depends on gateway stations, SD-WAN, slicing, and terminal availability
    - No public API, NOC, or service-credit documentation
  - - Simulation and planning layer
    - Supports digital twin work, constellation design, and interference planning
    - Depends on real onboard logic models and ITU-rule assumptions
    - No public model-validation benchmark or customer-reference base
  notes: The table focuses on architecture layers explicitly visible in retained sources; unpublished supplier chains and filing details are intentionally excluded.
