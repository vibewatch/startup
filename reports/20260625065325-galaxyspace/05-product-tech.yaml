  approximationNotes: This stack is synthesized from product pages and public technical references rather than an official internal block diagram.
  data:
    layers:
    - id: bus-layer
      label: Bus architecture layer
      detail: G1 2.0 modular hardware plus flexible software, G2 integrated flat-panel bus, and G3 wing-array direct-to-cell platform set the physical and control baseline.
    - id: payload-layer
      label: Communications payload layer
      detail: Integrated processing payloads, inter-satellite laser terminal compatibility, navigation enhancement payloads, and direct-to-cell base-station concepts sit above the bus.
    - id: rf-layer
      label: RF front-end and antenna layer
      detail: Ka multibeam phased arrays, Q/V feeder antennas, V/S transceivers, LNAs, SSPAs, and Q/V control electronics form the high-frequency link chain.
    - id: ground-layer
      label: Ground, gateway, and terminal layer
      detail: Q/V gateway station, private-5G integration, phased-array user terminals, SD-WAN, and smart network management connect the constellation into user workflows.
    - id: ops-layer
      label: Simulation and operations layer
      detail: Digital Satellite and GalaxySim provide digital-twin, service, orbit, and ITU interference simulation capabilities for deployment planning and verification.
