- id: satellite-bus-and-rf-architecture
  title: The public architecture is specific on buses, feeder links, phased arrays, and digital processing
  body: 'GalaxySpace discloses more technical detail than a typical commercial-space homepage. G1 2.0 is described as a modular hardware platform with flexible application software, onboard integrated processing, inter-satellite laser terminal support, phased-array antennas, and Q/V feeder payloads. G2 then moves the architecture toward constellation economics: an integrated multifunctional frame, high-integration electronics, flexible solar arrays, active thermal-control loops, digital processing payloads, phased arrays, and stacked-launch compatibility. G3 pushes the architecture again by integrating solar arrays and phased arrays into a wing-array direct-to-cell platform larger than 100 square meters when deployed. The RF chain pages make the architecture more legible. Public device pages describe a Ka-band multibeam phased array with four controllable beams, a Q/V feeder antenna with 14 on-orbit units and third-generation evolution, V/S transceivers, cold-backup Q/V controllers, second-generation
    Ka and V LNAs and SSPAs, and a combined bus-management computer plus encrypted S/V TT&C. The company''s digital-satellite tool then shows that software and simulation are part of the engineering stack, even though a named board-level SDR product is not publicly documented.'
