- id: manufacturing-ground-infrastructure-and-constellation-ops
  title: Manufacturing scale is concentrated in Nantong, while Beijing is most visible as a payload, gateway, and operations node
  body: 'Public evidence draws a fairly sharp line between where GalaxySpace appears to engineer communications systems and where it quantifies industrial output. Beijing is clearly important to the operational stack: the 2025 mobile-to-satellite demo used a rooftop terminal and gateway station in Beijing to connect with Thailand, Global Times described Beijing operators remotely controlling a firefighting drone in Chengdu over a GalaxySpace LEO link, and recruiting pages place communications-network and payload work in Beijing. But the public record does not show a quantified Beijing payload-factory line. Every hard capacity metric in the reviewed set points to Nantong. Xinhua and Nantong government reporting both describe 100 to 150 medium satellites of annual capacity, with more than 30 satellites produced simultaneously, average cadence of two satellites every five days, and a 100-to-2000-kilogram manufacturing chain. On constellation and orbital strategy, official materials and third-party
    databases describe Mini-Spider as an eight-satellite low-orbit test constellation, while third-party sources cite pathways toward 144 and even 1,000 satellites. GalaxySim''s ITU-rule interference tooling makes the strategic direction legible, but not the exact shell design or filing identifiers.'
