- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow challenge
  - GalaxySpace solution
  - Measurable benefit
  - Limitation
  rows:
  - - Remote industrial-site connectivity
    - Ground fiber or microwave is unavailable in remote plants or mines
    - LEO-plus-5G private network with smartphone/CPE access, slicing, and Mini-Spider backhaul
    - Public page claims 100 Mbps-class large-volume transfer and lower deployment cost for remote sites
    - No public uptime, spectrum-cost, or customer case benchmark
  - - Vehicle, vessel, rail, or aircraft connectivity
    - Moving platforms need broadband without relying on one terrestrial network
    - Phased-array mobile terminal plus intelligent network management over LEO
    - Public page claims hundreds of Mbps and low-latency/high-reliability control links
    - No public jitter or handover-failure statistics
  - - Drone remote command in uncovered terrain
    - Operators need real-time video and command without terrestrial coverage
    - LEO phased-array terminal on the drone with Beijing command-center backhaul
    - Global Times reports HD video return and closed-loop command from Beijing to Chengdu
    - Still a demo rather than a published production service
  - - Mobile-to-satellite consumer connectivity demo
    - Handset connections usually require terrestrial base stations
    - Rooftop terminal plus Beijing gateway station linking Beijing and Thailand over the constellation
    - People’s Daily/Xinhua reports successful video connection and direct-to-cell collaboration with True
    - Public handset compatibility and service economics are not disclosed
  - - Satellite-system test and integration
    - Traditional AIT and software verification are slow and hardware-heavy
    - Digital Satellite product with real onboard software logic and semi-physical simulation
    - Reduces dependence on full hardware for function, interface, and state simulation
    - No public evidence on simulation-to-flight correlation accuracy
  - - Constellation design and filing analysis
    - NGSO networks must balance service, interference, and regulatory constraints
    - GalaxySim operation, service, and frequency-interference simulation under ITU rules
    - Makes orbit/service design and interference analysis part of the commercial tool surface
    - Actual filing identifiers and final shell design remain undisclosed
  notes: Benefits are limited to what public pages and third-party reporting explicitly describe; commercial rollout quality is still only partly visible.
