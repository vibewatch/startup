  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: software-defined-radio
    missingEvidence: A board-level architecture pack showing whether GalaxySpace uses SDR or software-reconfigurable baseband chains on the communications payload and terminals.
    whyItMatters: Direct-to-cell and multibeam communications economics depend heavily on how much waveforms, beamforming, and baseband processing can be reconfigured after launch or deployment.
    diligencePath: Request payload or terminal architecture diagrams, FPGA or ASIC partitioning notes, and a change log for in-orbit software reconfiguration.
    relatedQuestionRefs:
    - QE019
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: orbital-rights-and-shells
    missingEvidence: Exact orbital-shell geometry, filing identifiers, priority rights, and gateway topology for the constellation strategy.
    whyItMatters: Without concrete filing and shell data, it is difficult to judge whether the visible hardware roadmap can actually scale into protected spectrum and usable service windows.
    diligencePath: Request ITU filing references, shell tables, gateway-site map, and any domestic coordination approvals that back the 144 or 1000 satellite narratives.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: commercial-trust-surface
    missingEvidence: Customer-facing API documentation, uptime SLA, service-credit policy, and named cybersecurity or quality certifications for networked products.
    whyItMatters: The company is moving from hardware proof into network services; public trust artifacts are needed to underwrite enterprise or government deployment risk.
    diligencePath: Request API docs, SOC or ISO or equivalent security certifications, NOC processes, and standard service terms for private-network or direct-to-cell offerings.
    relatedQuestionRefs:
    - QE023
    - QE026
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: beijing-payload-output
    missingEvidence: A quantified public line on Beijing payload or subsystem production throughput, not just role descriptions or demo locations.
    whyItMatters: The chapter can place Beijing in payload and gateway work, but not size its output or compare it precisely with Nantong.
    diligencePath: Request site-by-site capacity, headcount, and work-scope breakdown for Beijing, Xi’an, Chengdu, and Nantong facilities.
    relatedQuestionRefs:
    - QE028
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: network-performance-benchmarks
    missingEvidence: Public throughput, jitter, handover-failure, and weather-margin benchmarks for the mobile-platform, direct-to-cell, and private-5G solutions.
    whyItMatters: Workflow claims are credible, but investors still need performance bounds to underwrite service quality and customer experience.
    diligencePath: Request benchmark reports or named customer deployments with latency, availability, throughput, and handover statistics.
    relatedQuestionRefs:
    - QE002
    - QE003
    - QE015
    relatedTableRefs:
