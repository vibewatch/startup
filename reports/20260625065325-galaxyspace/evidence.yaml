    severity: material
    topic: 2026-c-round
    missingEvidence: Exact February 2026 C-round amount, exact post-money valuation, and a fully sourced pre- and post-round cap table.
    whyItMatters: >-
      This chapter can confirm timing and listing momentum but cannot yet underwrite dilution, pricing discipline, or
      how much runway the fresh round actually bought.
    diligencePath: >-
