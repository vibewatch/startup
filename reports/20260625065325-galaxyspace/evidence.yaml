evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: >-
      A reconciled headcount bridge between the official group-level “over 1,000 employees” claim and the QCC-reported
      198 insured staff for the main Beijing listing entity.
    whyItMatters: >-
      Execution capacity, fixed-cost absorption, and listing-entity readiness depend on whether headcount sits in the
      core issuer or in affiliates and factory subsidiaries.
    diligencePath: >-
      Request the 2024 and 2025 group-org chart, legal-entity employee breakdown, and insured-employee counts by
      subsidiary from management or IPO working papers.
