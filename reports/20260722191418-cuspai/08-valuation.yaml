    "number": 8,
    "title": "Valuation",
    "summary": "CuspAI is strategically impressive, but the public record does not yet support treating the June 2026 $2.6 billion valuation as obviously cheap. The best-supported stance is track / diligence-only: the upside is real if the Foundry becomes a repeatable platform, but current public evidence leaves too little room for error at the headline price."
  },
  "sections": [
    {
      "id": "recommendation-and-price-sensitive-view",
      "title": "Recommendation and price-sensitive view",
      "body": "CuspAI is easy to like strategically and difficult to underwrite cleanly at price. The company has assembled a rare combination of capital, elite partners, strong scientific ambition, and at least one credible industrial proof point. If the AI Materials Foundry becomes a repeatable enterprise platform with multiple validated customer programs, private deployments, and durable data advantages, the upside could be substantial. The problem is that the public evidence still stops well before that conclusion. There is no retained public revenue base, no disclosed retention or margin profile, no broad production deployment set, and no public proof that the company has yet turned flagship relationships into diversified recurring economics. At a $2.6 billion post-money valuation after a $450 million round, investors are already paying for a meaningful portion of that future. That does not make the company overvalued in absolute terms, but it does make the investment case highly evidence-sensitive. On public evidence alone, the right stance is not an outright buy; it is track / diligence-only unless proprietary diligence or better entry terms close the key unknowns.",
