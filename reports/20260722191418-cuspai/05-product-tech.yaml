    {
      "id": "architecture-stack-and-critical-dependencies",
      "title": "Architecture stack and critical technical dependencies",
      "body": "CuspAI\u2019s public architecture looks like an orchestration layer built on top of multiple external and internal technical components. CuspAI says the Foundry needs four things: high-quality training data, powerful compute, synthesis infrastructure, and deep scientific expertise. pv magazine then makes the stack more concrete, saying MIRA orchestrates the workflow, kUPS handles molecular simulation in collaboration with NVIDIA\u2019s ALCHEMI team, and Meta\u2019s UMA model is used for atomistic simulation. Those dependencies matter because they show that CuspAI is not claiming a self-contained monolith; it is composing a discovery system from proprietary orchestration plus best-in-class external infrastructure. The broader market reinforces the pattern. NVIDIA now distributes ALCHEMI as chemistry-and-materials microservices, Meta has published UMA, Microsoft exposes MatterGen and MatterSim, and Google DeepMind released a large materials-discovery dataset and code. CuspAI\u2019s moat therefore depends less on possessing every primitive and more on how well it integrates them into industrial validation loops.",
