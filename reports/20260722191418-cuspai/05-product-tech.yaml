    {
      "id": "deployment-maturity-and-trust-controls",
      "title": "Deployment maturity, roadmap, and trust controls",
      "body": "The maturity picture is uneven. Discovery and candidate-generation capabilities look the most mature publicly: CuspAI and Kemira describe an end-to-end PFAS-remediation program that advanced from a huge search space to a short candidate list in six months, while the Foundry itself launched with dozens of strategic members. But public evidence on operational maturity is much thinner. The retained sources do not show a public API reference, uptime history, status page, SOC 2 or ISO security certification, or detailed support commitments. Trust instead comes indirectly through private deployment, large partners, and named industrial collaborations. The jobs page also suggests active product construction, with open roles in agents, force fields and simulation, and engineering. That is not a negative by itself, but it signals a platform still moving quickly rather than a frozen, compliance-heavy enterprise product. In practical terms, the public record supports strong technical ambition and moderate workflow maturity, but incomplete proof on support, security, and production operating controls.",
