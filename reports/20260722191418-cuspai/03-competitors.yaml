    {
      "id": "moat-durability-and-adverse-evidence",
      "title": "Moat durability and the main adverse evidence",
      "body": "The strongest case for CuspAI\u2019s moat is not that \u201cAI for materials discovery\u201d is unique; that category is already crowded and increasingly legitimized by hyperscalers, incumbents, and open scientific programs. The stronger argument is that CuspAI could accumulate proprietary closed-loop data and workflow know-how if its lab-network strategy produces faster, higher-quality real-world validation than software-only competitors can obtain. But the adverse evidence matters. C&EN\u2019s 2026 reporting on self-driving labs argues that these systems remain costly and are still not fully autonomous, while Microsoft and Azure are rapidly productizing agentic scientific workflows and DeepMind\u2019s GNoME work demonstrates how discovery-scale model generation can expand outside startups. In other words, the generic AI layer is commoditizing, while the physical-execution layer is capital intensive. CuspAI may still win, but only if it proves that its foundry model yields materially better customer outcomes than lower-friction software or better-capitalized platform alternatives. It also means diligence should focus less on AI branding and more on measurable cycle-time, validation, utilization, and conversion advantages that survive contact with enterprise procurement.",
