      "id": "market-boundary-and-what-counts",
      "title": "Market boundary: what counts as CuspAI\u2019s market and what does not",
      "body": "The cleanest way to define CuspAI\u2019s market is to start narrow and then widen only with explicit caveats. At the narrowest level, CuspAI competes in AI-driven materials discovery and materials informatics platforms: software, models, simulation workflows, and data infrastructure that compress early-stage R&D. That is not the same thing as the downstream value of semiconductors, batteries, catalysts, or water-treatment chemicals whose performance depends on better materials. Those huge end markets matter because they create buyer urgency, but counting them directly as CuspAI TAM would overstate monetizable demand. A more defensible market boundary therefore includes three concentric rings: direct platform spend, adjacent industrial R&D budgets where buyers pay to improve materials programs, and still-broader downstream industries where the economic benefit of better materials is very large but only indirectly monetizable. This distinction matters because public sources show CuspAI selling into industrial R&D workflows and public-lab programs, not into the full revenue pools of the industries it hopes to influence.",
