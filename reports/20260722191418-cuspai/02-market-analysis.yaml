      "id": "sizing-lenses-and-public-budget-proxies",
      "title": "Sizing lenses and public-budget proxies",
      "body": "Public evidence supports several useful sizing lenses, but they operate at different levels and should not be merged into one fake TAM. Emergen Research describes a direct AI-driven materials discovery platforms market of $2.0 billion in 2025 with a 26.1% revenue CAGR, which is the closest thing to a direct vendor-revenue lens in the public sources reviewed. Future Markets adds a broader materials informatics lens that spans software, consulting, and in-house implementations across batteries, semiconductors, catalysts, polymers, and more. Government and industry budgets then show why the buyer base is larger than the direct software category: CHIPS for America is putting $11 billion into semiconductor R&D infrastructure, the Department of Commerce awarded SandboxAQ $500 million specifically for AI-driven semiconductor materials discovery, and DOE\u2019s FY2026 Science request includes $7.092 billion overall and $2.241 billion for Basic Energy Sciences alone. Finally, PwC\u2019s semiconductor outlook shows the downstream economic prize: a $627 billion semiconductor market in 2024 projected to exceed $1 trillion by 2030. The right interpretation is layered demand, not a single headline market number.",
