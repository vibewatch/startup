    "number": 2,
    "title": "Market Analysis",
    "summary": "CuspAI sits inside a narrow but fast-growing AI-for-materials-discovery tooling market, while selling into much larger industrial and public R&D budgets tied to semiconductors, energy, chemicals, and advanced manufacturing. The most defensible public-market lens is therefore layered: roughly low-single-digit billions for direct discovery platforms, multi-billion public and industrial R&D pools for near-term buyers, and far larger downstream end markets whose materials bottlenecks create urgency but should not be mistaken for CuspAI\u2019s direct TAM. Adoption demand is real, but commercialization is constrained by data quality, GPU cost, validation throughput, and long qualification cycles."
  },
  "sections": [
