    {
      "id": "cost-structure-and-unit-economics-pressure-points",
      "title": "Cost structure and the main unit-economics pressure points",
      "body": "Public evidence implies a cost structure that is meaningfully heavier than pure software. CuspAI itself says software-led materials discovery requires high-quality training data, powerful compute, synthesis infrastructure, and domain expertise. Its Foundry narrative adds access to laboratories, while public case studies emphasize simulation, candidate screening, synthesis-route planning, and experimental validation. Those inputs all create delivery cost. The same is true of the broader competitive set: self-driving-lab coverage describes expensive automation and incomplete autonomy, while hyperscaler and discovery-platform competitors are investing heavily in HPC and scientific tooling. That means CuspAI may ultimately capture more value than a narrow SaaS vendor if it owns more of the workflow, but it also means gross margin will likely depend on the balance between software reuse and high-touch program cost. Because no public source discloses utilization, per-program cost, or gross profit, unit-economics underwriting remains mostly qualitative.",
