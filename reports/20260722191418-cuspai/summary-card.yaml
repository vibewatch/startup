  topStrengths:
    - >-
      CuspAI addresses a strategically large industrial bottleneck at the intersection of AI, materials discovery,
      semiconductors, energy, and advanced manufacturing.
    - >-
      The company has assembled an unusually strong partner and investor ecosystem for its age, including marquee
      technical, industrial, and institutional participants.
    - >-
      Kemira provides a credible named public proof point with specific discovery outputs rather than only logo-level
      validation.
    - >-
      The AI Materials Foundry model could become a differentiated platform if private deployments and multi-program
      customer loops deepen over time.
  topRisks:
    - >-
      Public proof still stops well before broad production-grade commercialization, leaving major translation risk
      between discovery success and industrial deployment.
    - >-
      Revenue, retention, margin, and customer-concentration disclosure are too sparse for clean underwriting at the
      current valuation.
    - >-
      Execution depends on partner data, partner labs, compute infrastructure, and flagship relationships, making
      dependency risk a core part of the story.
    - >-
      The current valuation leaves limited margin for error if customer breadth, trust maturity, or commercial
      conversion arrive more slowly than expected.
  unresolvedGaps:
    - Revenue model, booked contracts, gross margin, and burn/runway detail needed to anchor valuation more rigorously.
    - Retention, renewal, and pilot-to-production conversion data across named customer programs.
    - Customer concentration by revenue and the economic value of Foundry members versus strategic logos.
    - Data-rights, IP, regulatory-responsibility, and contract structure across private Foundry deployments.
    - Cap table, liquidation preferences, investor protections, and other downside-shaping round terms.
