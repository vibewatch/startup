evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Standardized revenue, gross margin, and contracted backlog disclosure are not public.
    whyItMatters: >-
      The reported $2.6 billion valuation cannot be underwritten cleanly without understanding revenue quality and
      durability.
    diligencePath: Request monthly revenue bridge, gross margin by program, and FY2025/FY2026 management accounts.
    relatedQuestionRefs:
      - QO023
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: No precise current headcount is corroborated across reliable public sources.
    whyItMatters: Headcount informs burn, productivity, and whether the company’s network model is software-like or services-heavy.
    diligencePath: Request HRIS headcount by geography and function, plus historical monthly hiring data.
    relatedQuestionRefs:
      - QO024
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Full board composition, voting rights, liquidation preferences, and control terms are not visible in reviewed
      public materials.
    whyItMatters: >-
      Governance and preference structure affect downside protection, dilution risk, and practical control after a fast
      valuation step-up.
    diligencePath: Request the board deck cover page, current cap table, financing documents, and shareholder rights summary.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-enumeration
    missingEvidence: The public leadership table does not fully resolve the entire executive org chart or all independent directors.
    whyItMatters: Key-person dependence and functional gaps are easier to miss when only founders and marquee advisers are public.
    diligencePath: Request an org chart showing direct reports, board observers, and critical hiring plans.
    relatedQuestionRefs:
      - QO005
      - QO025
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: customer-economics
    missingEvidence: >-
      Named customers and partners are public, but contract values, renewal status, and commercialization milestones are
      not.
    whyItMatters: >-
      Strategic logos can overstate traction if they are pilots, R&D collaborations, or non-recurring programs rather
      than expanding revenue accounts.
    diligencePath: >-
      Request customer-by-customer contract summary, milestone plan, and expansion pipeline for ASML, Hyundai, Kemira,
      and other anchor programs.
    relatedQuestionRefs:
      - QO017
      - QO022
  - type: private-evidence-only
    severity: material
    topic: sam-pricing
    missingEvidence: Public sources do not disclose CuspAI pricing, average contract value, or recurring program size by segment.
    whyItMatters: >-
      Without pricing and contract structure, the first commercial wedge can only be described conceptually, not modeled
      as a precise SAM.
    diligencePath: >-
      Request price cards, sample statements of work, and annual contract value ranges for semiconductor, chemicals, and
      public-lab accounts.
    relatedQuestionRefs:
      - QM024
      - QM025
    relatedTableRefs:
      - TM002
      - TM005
  - type: conflicting-data
    severity: material
    topic: market-definition
    missingEvidence: >-
      Public market reports blend pharma, chemicals, semiconductors, and research institutions differently, making
      cross-report totals non-comparable.
    whyItMatters: >-
      Uncritical use of blended market reports can materially overstate CuspAI’s addressable market or hide the real
      segment mix relevant to its current GTM.
    diligencePath: >-
      Build a bottoms-up segment model from named customer verticals, budget owners, and comparable deal sizes instead
      of relying on one headline TAM.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-conversion
    missingEvidence: >-
      Public sources do not show how often AI-generated candidates become qualified materials and then recurring
      commercial programs by customer segment.
    whyItMatters: >-
      Commercial outcomes depend on conversion from prediction to validation to deployment, not just on
      candidate-generation speed.
    diligencePath: >-
      Request funnel metrics from candidate generation through validation, pilot, qualification, and expansion for each
      key vertical.
    relatedQuestionRefs:
      - QM023
      - QM025
    relatedTableRefs:
      - TM005
  - type: missing-source
    severity: minor
    topic: qualification-cycles
    missingEvidence: >-
      Segment-specific qualification timelines are not consistently public across semiconductors, water-treatment
      chemicals, and mobility materials.
    whyItMatters: Adoption speed and payback differ sharply if qualification takes months in one segment and years in another.
    diligencePath: >-
      Request customer timelines for first result, pilot sign-off, product qualification, and deployed material
      insertion by vertical.
    relatedQuestionRefs:
      - QM021
      - QM024
    relatedTableRefs:
      - TM004
      - TM005
  - type: private-evidence-only
    severity: material
    topic: public-lab-economics
    missingEvidence: >-
      Public-lab and government program pages show large infrastructure budgets but do not reveal how much is available
