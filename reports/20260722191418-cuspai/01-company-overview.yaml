      "id": "leadership-footprint-and-governance-signals",
      "title": "Leadership bench, operating footprint, and governance signals",
      "body": "The founder story is unusually strong for a two-year-old European deep-tech company because the founders combine chemistry, industrial commercialization, and frontier machine-learning pedigrees. Chad Edwards is consistently described as the commercial co-founder of Cambridge Quantum/Quantinuum and the company\u2019s current CEO, while Max Welling is described as a co-founder and core technical leader with prior roles at Microsoft Research, Qualcomm, and the University of Amsterdam. Public leadership visibility widened further in 2026 as John Giannandrea, formerly of Apple and Google, was reported to be helping set up U.S. operations. Companies House records add useful but incomplete governance evidence: the officer page shows six officers and two resignations, while filing-history records multiple 2026 share-class and allotment actions. That is enough to confirm real corporate activity, but not enough to fully understand board composition, voting control, or investor rights. Geographic signals are broader than Cambridge alone, with visible hiring or cited teams in London, Amsterdam, Singapore, Berlin, Tokyo, the United States, and Cambridge.",
