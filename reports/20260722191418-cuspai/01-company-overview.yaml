      "id": "capital-investors-and-valuation-step-up",
      "title": "Funding history, investor quality, and valuation acceleration",
      "body": "CuspAI\u2019s financing pace is now one of the defining facts of the company. Public sources support a $30 million seed in June 2024, a $100 million-plus Series A in September 2025 led by Temasek and NEA, and a $450 million Series B announced in July 2026 at a reported $2.6 billion valuation. The round leadership also upgraded materially: Reuters, CNBC, and EU-Startups all describe the Series B as led by Kleiner Perkins and NEA with significant participation from Bezos Expeditions, plus a long list of new and returning investors. That makes the cap table notable not only for capital depth but also for strategic signaling from U.S. venture firms, sovereign capital, semiconductor-linked investors, and prior backers. The key caveat is valuation speed. Several 2026 articles explicitly note how quickly CuspAI moved from a reported $520 million Series A mark to $2.6 billion in under a year. For diligence, that speed is not disqualifying, but it raises the bar on customer proof and financial disclosure.",
