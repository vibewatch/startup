    {
      "id": "milestones-traction-and-disclosure-gaps",
      "title": "Milestones, commercial signals, and what is still missing",
      "body": "The visible milestone path from 2024 to mid-2026 is credible enough to support later chapters. CuspAI progressed from incorporation and seed financing, to a >$100 million Series A, to 2026 corporate filings and a Foundry launch that assembled more than 45 founding members. The commercial side is more promising than fully proven. Investor and industry coverage names ASML, Hyundai Motor Group, Kemira, Meta, and A*STAR as meaningful counterparties, while solar and semiconductor partners add breadth to the network. Still, much of that evidence is partnership-heavy rather than contract-heavy. Public materials make clear that the company has strategic interest and technical prestige, but they do not provide audited revenue, precise headcount, contract value, or full governance detail. That leaves CuspAI in an unusual diligence posture: strong proof of ecosystem relevance and fundraising power, but only partial proof of repeatable economics commensurate with a $2.6 billion valuation. The open questions are therefore mostly about monetization quality, not about whether the company exists or has attracted serious attention.",
