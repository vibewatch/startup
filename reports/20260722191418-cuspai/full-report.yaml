      - number: '8.3'
        title: Scenario ranges and what moves the mark
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more defensible than a traditional multiple or DCF because the crucial public
              inputs are missing. The base case is that CuspAI continues converting high-profile relationships into
              additional validated programs, preserves its strategic narrative, and avoids major setbacks, but still
              does not disclose enough economics for investors to claim a large margin of safety. In that world, the
              current $2.6 billion mark can be defended, but not with much upside cushion for new investors. The bull
              case requires more than general excitement around AI for science. It needs a second and third customer
              proof point on par with Kemira, clearer repeat-use evidence, visible trust and operating maturity, and
              enough commercial traction that the Foundry starts looking like a platform rather than a consortium-led
              experiment. The bear case is straightforward: if technical translation stalls, flagship proof remains
              narrow, or public/private capital markets cool toward pre-revenue AI science platforms, the valuation can
              compress sharply even if the core science remains promising. In short, most of the valuation sensitivity
              sits in commercialization proof, not in whether the underlying story is interesting.
