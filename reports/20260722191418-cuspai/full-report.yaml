      - number: '8.2'
        title: Thesis, anti-thesis, and comparable context
        blocks:
          - type: paragraph
            body: >-
              The bullish thesis is coherent. Materials discovery is a large and strategically important problem; public
              sources show CuspAI has serious customers or partners in chemicals, mobility, and institutional R&D; the
              Foundry has broad member participation; and the company has raised enough capital to pursue an
              execution-heavy strategy rather than a lightweight software demo. SandboxAQ’s 2025 valuation and 2026
              CHIPS-backed expansion also demonstrate that capital markets can award high values to
              AI-for-physical-world platforms before conventional software metrics are disclosed. The anti-thesis is
              equally strong. Several public comparables with real public-market marks — Schrödinger, Recursion, Ginkgo
              Bioworks, and Simulations Plus — trade at market caps ranging from roughly $0.36 billion to $1.58 billion
              in July 2026, while CuspAI’s latest round already implies a $2.6 billion value. Those companies are
              imperfect comps, but together they show how brutally public markets can discount scientific-platform
              stories when commercialization, durability, or margins stay opaque. CuspAI could deserve a premium to many
              of them if it truly becomes infrastructure, but public evidence alone does not yet prove that premium.
            claimRefs:
