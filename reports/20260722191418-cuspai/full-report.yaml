      - number: '2.4'
        title: Growth drivers, constraints, and what will determine adoption speed
        blocks:
          - type: paragraph
            body: >-
              The tailwinds behind AI-driven materials discovery are credible and unusually cross-sector. Open databases
              such as NOMAD and OQMD, public programs under the Materials Genome Initiative, and new AI infrastructure
              from NVIDIA, Microsoft, and Google DeepMind all reduce the technical friction of running inverse-design
              and simulation-heavy workflows. Semiconductor complexity, electrification, PFAS substitution, and
              supply-chain resilience add real budget pressure behind the search for new materials. But the constraint
              stack is just as important. Emergen explicitly says only about 10% of AI-predicted candidates move to
              successful experimental synthesis in current workflows, and that GPU-heavy infrastructure adds material
              per-experiment cost for smaller organizations. Future Markets highlights data quality, standards, ROI, and
              expertise barriers. PatSnap shows the field moving toward autonomous labs and closed loops, which is
              promising, but it also implies significant lab, data, and orchestration complexity before software alone
              can capture value. Market adoption will therefore depend less on broad enthusiasm for AI and more on
              whether vendors can repeatedly move from model output to qualified material in commercially acceptable
              timeframes.
