        - No public NRR, GRR, or renewal cadence
        - Durability is the biggest gap between strategic interest and investable quality
        - Request cohort analysis and top-account renewal schedule
      - - Pilot-to-production conversion
        - No public multi-customer production conversion data
        - Decides whether scientific proof is maturing into industrial value
        - Request stage-by-stage program funnel and failure reasons
      - - Data rights, IP, and regulatory ownership
        - Foundry relationships likely split responsibilities in complex ways
        - Moat, legal exposure, and commercialization economics all depend on this
        - Request standard customer / member contract templates and counsel summary
      - - Preference stack and downside protection
        - Public round coverage omits detailed terms
        - Entry discipline requires understanding downside before paying up
        - Request cap table, liquidation preferences, and investor rights
    notes: These are the minimum asks needed to move from fascination to disciplined underwriting.
    claimRefs:
      - CV003
      - CV005
      - CV032
      - CV033
      - CV034
      - CV036
      - CV040
      - CV042
