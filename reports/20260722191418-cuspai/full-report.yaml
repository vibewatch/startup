companyProfile:
  summary: >-
    CuspAI is a Cambridge-headquartered private company founded in 2024 by Chad Edwards and Max Welling to use AI for
    industrial materials discovery. Public evidence supports an ambitious platform strategy built around the AI
    Materials Foundry, which combines MIRA-driven design, simulation, private deployments, and experimental validation
    with a strong partner ecosystem. The company has raised a reported $450 million Series B at a $2.6 billion valuation
    and over $650 million in total, but public disclosure remains thin on economics, leaving the core diligence question
    centered on whether elite scientific positioning is converting into diversified, durable commercialization.
