              combine chemistry, industrial commercialization, and frontier machine-learning pedigrees. Chad Edwards is
              consistently described as the commercial co-founder of Cambridge Quantum/Quantinuum and the company’s
              current CEO, while Max Welling is described as a co-founder and core technical leader with prior roles at
