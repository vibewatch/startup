  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founding, and product thesis
        blocks:
          - type: paragraph
            body: >-
              Public records and company-facing materials consistently place CuspAI in Cambridge, UK and show a company
              formed in 2024 to use AI for materials discovery. The simplest consistent product description is not a
              generic AI lab but a materials-search platform: the company says customers specify target properties,
              while CuspAI generates candidate materials, simulates them, plans synthesis routes, and coordinates
              experimental validation. The same framing appears across official, investor, and press sources, which
              matters because it anchors the later diligence question around whether CuspAI is selling software,
              scientific services, or a networked R&D platform. The July 2026 Foundry launch pushes the company beyond a
              point-solution narrative by combining its MIRA platform with partner labs, data, compute, and industrial
              programs in semiconductors, clean energy, water, and advanced manufacturing. The identity story is
              therefore coherent: CuspAI is positioning itself as infrastructure for industrial materials discovery
              rather than only a model vendor.
