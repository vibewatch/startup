      - number: '7.3'
        title: Customer, financial, and people risk
        blocks:
          - type: paragraph
            body: >-
              Commercial risk remains closely tied to concentration and opacity. The public customer story is dominated
              by Kemira, Hyundai, A*STAR, and the Foundry member ecosystem, with limited evidence on active paid account
              count, retention, renewal, or customer diversification. That means a few marquee relationships could be
              carrying most of the strategic value while revenue concentration remains hidden. Financially, the June
              2026 round gives CuspAI unusual balance-sheet strength for a two-year-old company, but it also raises the
              burden of proof. A $2.6 billion valuation implies investors are underwriting not just scientific promise
              but eventual large-scale commercialization. Public disclosures still do not provide revenue, gross margin,
              burn, or runway detail. If commercialization slips, the company may still have capital, but the next
              financing or liquidity event could reprice sharply. People risk is also meaningful: CuspAI is expanding
              globally, hiring specialized talent across agents, force fields, and simulation, and still relies heavily
              on founder credibility and scarce scientific leadership. In short, money buys time, but not evidence of
              repeatability.
