        title: Milestones, commercial signals, and what is still missing
        blocks:
          - type: paragraph
            body: >-
              The visible milestone path from 2024 to mid-2026 is credible enough to support later chapters. CuspAI
              progressed from incorporation and seed financing, to a >$100 million Series A, to 2026 corporate filings
              and a Foundry launch that assembled more than 45 founding members. The commercial side is more promising
              than fully proven. Investor and industry coverage names ASML, Hyundai Motor Group, Kemira, Meta, and
