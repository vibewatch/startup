      - number: '3.3'
        title: Switching cost, distribution power, and the likelihood of multi-homing
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a market that is more multi-homed than winner-take-all. The retained sources
              show distinct control points: Uncountable and MaterialsZone manage R&D data and collaboration, Schrödinger
              provides deep simulation, Microsoft and Azure provide orchestration plus cloud/HPC, and Atinary automates
              experiment loops. Those layers can coexist in one account, which reduces the chance that any one category
              monopolizes discovery workflows. The more immediate competitive threat to CuspAI is therefore not a single
              identical startup, but better-distributed stacks that can occupy adjacent budgets and procurement paths
              first. Microsoft foregrounds governance, auditability, and secure enterprise deployment; Citrine
              foregrounds AWS hosting and ISO 27001; Schrödinger benefits from incumbent simulation credibility;
              Uncountable and MaterialsZone show broad industrial customer references. Public pricing is mostly opaque,
              reinforcing the view that these tools are sold through enterprise negotiation, pilots, and custom
              packaging rather than transparent self-serve list prices. Buyer committees can therefore phase adoption
              over time.
