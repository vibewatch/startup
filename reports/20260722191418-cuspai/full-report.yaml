  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: What is public about monetization, and what is still opaque
        blocks:
          - type: paragraph
            body: >-
              Public sources support a fairly clear commercial shape but not a full financial model. CuspAI’s retained
              materials describe bilateral projects with customers such as Kemira and Hyundai, a private-instance
              deployment model inside customer R&D environments, and a new AI Materials Foundry that pools data, labs,
              compute, and expertise across more than 45 founding members. Those are all enterprise-style monetization
              signals. What public sources do not disclose is equally important: no list pricing, no contract sizes, no
              recognized revenue, no ARR, and no margin profile. The Foundry reframes prior customer relationships into
              a shared infrastructure layer, which may improve distribution and lock-in, but it also makes pricing
              harder to observe because members can be customers, contributors, or both. As of the run date, the safest
              underwriting assumption is that CuspAI monetizes through bespoke strategic programs, private deployments,
              and expansion work, not through transparent self-serve software plans. Public accounting evidence also
              lags the fundraising narrative by months.
