              Public evidence suggests that CuspAI’s early customer base is concentrated in large enterprises,
              industrial R&D groups, and research institutions rather than broad horizontal software buyers. The named
              examples cluster in four segments: chemicals and water treatment (Kemira), automotive and mobility
              materials (Hyundai Motor Group), public-sector or national-lab style R&D infrastructure (A*STAR), and a
