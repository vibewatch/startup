  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Product definition: what the customer is actually using'
        blocks:
          - type: paragraph
            body: >-
              Public materials describe CuspAI less as a single SaaS screen and more as a layered discovery system. The
              core offer is the AI Materials Foundry coordinated by MIRA, CuspAI’s agentic platform, which brings
              together partner data, labs, compute, and domain expertise to discover materials for semiconductors, clean
              energy, advanced manufacturing, and water treatment. In customer-workflow terms, the user defines desired
              material properties, MIRA generates and screens candidates, simulation tools score those candidates,
              synthesis routes are planned, and then experiments validate a smaller shortlist. pv magazine adds an
              important operational detail: the discovery platform can run as a private instance inside a customer’s
              existing R&D process. That makes the product easier to understand as enterprise workflow infrastructure
              rather than just a hosted demo. The strongest public proof point, Kemira, also reinforces that the product
              is used to compress the early discovery stage, not yet to guarantee commercialized materials at scale.
