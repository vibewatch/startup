  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, adjacencies, and status-quo alternatives'
        blocks:
          - type: paragraph
            body: >-
              CuspAI does not face a single neat competitor set. The closest software-first peers are vendors such as
              Citrine Informatics, MaterialsZone, NobleAI, and Uncountable that help industrial R&D organizations
              structure data, run machine-learning-guided experiments, and shorten formulation cycles. A second layer
              includes self-driving-lab or physical-loop players such as Atinary, which focus on automating experiment
              design and execution rather than building a broader materials foundry. A third layer includes scaled
              incumbents and adjacencies such as Schrödinger, SandboxAQ, Microsoft Discovery, and Azure Quantum
              Elements, which combine simulation, high-performance computing, or agentic orchestration with stronger
              enterprise distribution. Orbital Industries sits closest to CuspAI’s strategic ambition because it
              explicitly combines frontier AI with materials, hardware, and manufacturing. The practical takeaway is
              that buyers can solve the same job through several routes: data backbone first, simulation first,
              automated experimentation first, or a more vertically integrated foundry model.
