  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格敏感视角
        blocks:
          - type: paragraph
            body: >-
              从战略上看，CuspAI 很容易让人喜欢；但按这个价格做投资判断并不干净。公司聚合了罕见组合：资本、 顶级伙伴、强科学雄心，以及至少一个可信工业验证点。如果 AI Materials Foundry
              成为可复制企业平台， 拥有多个经验证客户项目、私有化部署和持久数据优势，上行空间可能可观。问题在于，公开证据离这个结论还很远。
              没有公开披露的留存收入基础，没有披露留存或利润率画像，没有广泛生产部署组合，也没有公开证明公司已把旗舰关系 转成多元化的经常性收入基础。以 $450 million 轮后 $2.6 billion
              投后估值，投资者已经为相当一部分未来买单。 这不代表公司绝对意义上高估，但让投资逻辑对证据极敏感。仅凭公开证据，正确立场不是直接买入； 除非专有尽调或更好入场条款关闭关键未知，否则应为观察 / 仅尽调。
