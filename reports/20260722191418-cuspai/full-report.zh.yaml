    title: 部署与采用路径表
    columns:
      - 工作流层
      - 客户需求
      - 可能的产品形态
      - 替换难点
      - 公开信息缺口
    rows:
      - - 数据层
        - 经过整理、有权限、可查询的材料数据
        - 托管数据服务或私有数据集成
        - 历史实验室和文献数据分散，清洗难
        - 无法公开看到 CuspAI 在各垂直领域的具体排他性数据覆盖
      - - 筛选层
        - 快速生成候选物并排序
        - 模型 API、平台工作流或托管发现项目
        - 速度提升只有接上可用工作流才有价值
        - 公开定价和吞吐量经济性未披露
      - - 模拟层
        - 性能预测和更高保真度验证
        - GPU 加速模拟栈
        - 算力成本和工作流调优与模型质量同样关键
        - 计算密集型项目没有公开单位经济性
      - - 实验室验证层
        - 物理合成和测试能力
        - 合作实验室、自驱动实验室或编排后的发现工厂网络
        - 没有验证，买家会把输出视为探索性结果，而不是可投入生产
        - 公开来源没有按客户展示已验证转化率
      - - 认证层
        - 证明候选物能经受工业部署
        - 共同开发、试点认证、规模化支持
        - 在受监管或高性能行业，认证周期可能主导收入兑现时间
        - CuspAI 从试点到已部署材料所需时间，没有公开基准
    notes: 本表关注实际商业化路径，而不是理论上的 AI 工作流；买家付费，是因为材料通过了认证，而不是因为模型只生成了候选物。
