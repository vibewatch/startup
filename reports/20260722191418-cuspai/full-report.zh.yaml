        - 在化学品和先进材料领域拥有广泛客户基础
        - 化学品、先进材料、QC、PLM、多站点 R&D
        - 摩擦更低的知识骨干，并有大量工业案例研究
        - 主要不是物理模拟平台或自有实验室发现平台
      - - Atinary
        - 自驱动实验室 / 实验邻近
