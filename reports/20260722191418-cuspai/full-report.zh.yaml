  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：哪些算 CuspAI 的市场，哪些不算
        blocks:
          - type: paragraph
            body: >-
              定义 CuspAI 市场的最干净方式，是先从窄口径开始，只在明确附带保留条件时再放宽。最窄口径下，CuspAI 竞争的是 AI
              驱动材料发现和材料信息学平台：用软件、模型、模拟工作流和数据基础设施压缩早期研发。这并不等于半导体、电池、催化剂或水处理化学品的下游价值，尽管这些行业的性能依赖更好的材料。这些巨大终端市场很重要，因为它们制造了买方紧迫感；但若直接把它们算作
              CuspAI 的
              TAM，会高估可变现需求。更站得住脚的市场边界应包含三个同心圆：直接平台支出、买方愿意为改善材料项目付费的相邻工业研发预算，以及更广的下游行业；更好材料带来的经济收益在那里很大，但只能被间接变现。这个区分很关键，因为公开来源显示
              CuspAI 卖进的是工业研发工作流和公共实验室项目，而不是它希望影响的全部行业收入池。
