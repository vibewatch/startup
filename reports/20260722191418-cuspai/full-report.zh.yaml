              CuspAI 的公开架构像是一个搭在多种外部和内部技术组件之上的编排层。CuspAI 称 Foundry 需要四样东西：高质量训练数据、强算力、合成基础设施和深厚科学专业能力。pv magazine
              进一步把技术栈具体化：MIRA 编排工作流，kUPS 与 NVIDIA 的 ALCHEMI 团队合作处理分子模拟，Meta 的 UMA 模型用于原子级模拟。这些依赖很重要，因为它们表明 CuspAI
              并未宣称自己是自给自足的单体系统；它是在用专有编排加一流外部基础设施，组合出一个发现系统。更广市场也强化了这一模式。NVIDIA 现在把 ALCHEMI 作为化学与材料微服务分发，Meta 发布了
              UMA，Microsoft 暴露 MatterGen 和 MatterSim，Google DeepMind 发布了大型材料发现数据集和代码。因此，CuspAI
              的护城河不在于拥有每一种基础原语，而在于能否把它们有效整合进工业验证闭环。
