  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与披露风险
        blocks:
          - type: paragraph
            body: >-
              CuspAI 的法律和监管风险，不是由某一起已知诉讼或执法行动塑造，而是来自它身处受监管工业工作流且公开披露很薄。Companies House
              确认公司年轻、活跃，备案历史仍处早期；公开网站强调客户隐私联系和活动营销，却没有呈现大型企业买方常期待的信任中心、安全认证或详细政策包。这很重要，因为 CuspAI
              希望处理专有研发数据，在客户工作流内部部署私有实例，并生成未来可能进入化学、环境或出口管制审查行业的候选材料。UK GDPR 指引明确，安全处理数据的组织必须实施合适的技术和组织措施。UK REACH
              等化学制度以及 PFAS 相关审查，在发现材料从模拟走向真实测试和商业化时，又叠加了第二层下游监管负担。这些都不能证明迫在眉睫的监管失败，但意味着公开记录中的法律与合规层更多是被假设，而不是被展示出来。
