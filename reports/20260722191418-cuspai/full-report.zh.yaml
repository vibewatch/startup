            body: >-
              CuspAI 的融资速度已经成为定义公司的核心事实之一。公开来源支持其 2024 年 6 月获得 $30 million 种子轮，2025 年 9 月获得由 Temasek 和 NEA 领投的 $100
              million-plus Series A 轮，并在 2026 年 7 月宣布 $450 million Series B 轮，报道估值为 $2.6 billion。领投方质量也明显升级：Reuters、CNBC
              和 EU-Startups 都称 Series B 由 Kleiner Perkins 和 NEA 领投，Bezos Expeditions
              大额参与，另有一长串新老投资人跟投。这张股东表值得关注，不只因为资金厚，还因为美国风投、主权资本、半导体相关投资人和既有股东同时给出战略信号。关键保留项是估值速度。多篇 2026 年文章明确指出，CuspAI
              在不到一年内从报道中的 $520 million Series A 估值跳到 $2.6 billion。尽调上，这个速度本身不构成否决，但会大幅抬高客户验证和财务披露的门槛。
