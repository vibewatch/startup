      - number: '2.3'
        title: 买方、用户、付费方与最可能的第一商业切口
        blocks:
          - type: paragraph
            body: >-
              公开买方证据指向 CuspAI
              头几年最现实的四类细分市场：半导体和电子研发团队、化学和水处理创新者、汽车或能源材料团队，以及公共研究实验室或政府支持项目。每一类里，用户通常是材料科学家、计算化学家、工艺工程师或先进研究团队。但付费方通常不是同一个人。半导体交易对应技术开发、工艺整合或先进制程研发预算。化学和水项目对应创新、配方和可持续预算，Kemira
              以 PFAS 为重点的合作就是例子。Hyundai 的公告展示了第三条路径：下一代产品和材料负责人为 AI for science
              项目买单，因为耐久性、效率和成本最终都流经材料选择。公共部门和国家实验室需求又用另一种模型：用户是研究团队，付费方是 DOE、NIST、CHIPS 或类似机构资金流。这样的组合意味着，CuspAI 初始 SAM
              最适合被理解为一组高价值工业研发项目，而不是大众化软件席位生意。
