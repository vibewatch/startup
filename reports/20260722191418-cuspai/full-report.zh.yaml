              内更广泛的战略创始成员，覆盖半导体、清洁能源、先进制造和电子。这些账户看起来由高级技术或创新层级购买或赞助，而不是由去中心化个人用户推动。最强证据也指向多方工作流：买方、科学用户和预算所有者可能不同。这与
              CuspAI 的产品形态一致：私有部署、数据敏感性和伙伴牵引验证，都更适合长周期企业研发销售，而不是快速自助采用。代价是公开数量指标很薄，因此客户基础看起来战略价值高，但仍处早期。
