      - CV027
      - CV031
      - CV038
      - CV039
      - CV041
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入模型与订单
        - 没有公开收入、增长或已签合同基础
        - 决定估值锚在真实经济性，还是主要锚在战略期权
        - 索取 CFO 材料包或董事会级运营复盘
      - - 留存与续约
        - 没有公开 NRR、GRR 或续约节奏
        - 耐久性是战略兴趣与可投资质量之间最大的缺口
        - 索取队列分析和头部账户续约计划
      - - 试点到生产转化
        - 没有公开的多客户生产转化数据
        - 决定科学证据是否正走向工业价值
        - 索取逐阶段项目漏斗和失败原因
      - - 数据权利、IP 与监管归属
        - Foundry 关系很可能以复杂方式拆分责任
        - 护城河、法律敞口和商业化经济性都取决于此
        - 索取标准客户 / 成员合同模板和律师摘要
      - - 优先权结构与下行保护
        - 公开融资报道缺少详细条款
        - 进场纪律要求先看清下行，再决定是否加价
        - 索取股权结构表、清算优先权和投资人权利
    notes: 问题清单是从好奇走向有纪律承销所需的最低要求。
    claimRefs:
