        title: 退出就绪度、投资逻辑失效点与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              仅凭公开证据，CuspAI 还不是传统后期意义上的可退出公司。它更像一个战略平台候选者，需要先证明广度、转化和经济持久性，
              公开市场式承销才合适。这不阻止投资，只是改变尽调负担。最终问题很实际。管理层能否展示一条客户漏斗， 把限定范围项目转成生产或长期收入？能否说明 Foundry 关系中谁承担监管责任、IP
              和数据权利？能否证明成员网络的价值 不只是声誉？能否披露足够的财务和优先股堆叠信息，用来判断下行？如果答案清晰，且新的经验证客户成果到来，
              投资逻辑应迅速增强。若下一个里程碑主要是品牌动作，客户集中度仍被遮住，或估值复合速度继续快过商业证明， 投资逻辑也应同样快速走弱。因此，投资者在这笔交易中应把价格纪律和尽调纪律视为一体。
