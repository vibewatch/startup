      - number: '2.4'
        title: 增长驱动、约束与采用速度的决定因素
        blocks:
          - type: paragraph
            body: >-
              AI 驱动材料发现背后的顺风可信，而且少见地跨行业。NOMAD 和 OQMD 等开放数据库、Materials Genome Initiative 旗下公共项目，以及 NVIDIA、Microsoft 和
              Google DeepMind 的新 AI 基础设施，都在降低运行逆向设计和重模拟工作流的技术摩擦。半导体复杂度、电气化、PFAS
              替代和供应链韧性，也给新材料搜索带来真实预算压力。但约束堆栈同样重要。Emergen 明确称，在当前工作流中，只有约 10% 的 AI 预测候选材料走到成功实验合成；GPU
              密集型基础设施还会给小型组织带来可观的单次实验成本。Future Markets 强调数据质量、标准、ROI 和专业能力门槛。PatSnap
              显示行业正走向自主实验室和闭环，这很有前景，但也意味着在软件单独捕获价值之前，还要解决大量实验室、数据和编排复杂度。因此，市场采用速度与其说取决于广泛的 AI
              热情，不如说取决于供应商能否在商业可接受的时间内，反复把模型输出推进到合格材料。
