  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛
        - Foundry 转化出多个已验证企业项目；客户证据变宽；信任控制成熟；平台叙事更稳
        - 示意估值区间 US$4.0B-US$6.0B；本轮投资人可获得有意义但并不极端的上行
        - 执行复杂度仍高，但证据扩张快于质疑
        - 需要至少两个新增旗舰成果，以及更强的商业披露
      - - 基准
        - 科学进展继续；标杆关系保持；公开经济数据仍少；没有重大风险事件发生
        - 示意估值区间 US$2.0B-US$3.0B；当前标记可被守住，但上行缓冲有限
        - 风险 / 回报均衡，并非不对称吸引
        - 最符合当前公开证据
      - - 熊
        - 向生产转化滑坡；集中或依赖风险浮现；AI 科学热情降温，或披露仍弱
        - 示意估值区间 US$0.9B-US$1.6B；本轮投资人面临偏弱或负的总回报
        - 估值压缩可能快于科学可信度受损
        - 任何旗舰项目停滞、续约信号偏弱或下轮降价压力，都会把公司推向这一情形
    notes: 情景区间以里程碑为基础，意在表达承销纪律，而非精确预测。
