      - 类型
      - 什么会改变判断
    rows:
      - - Foundry 可能成为一个有防御力的平台，横跨多个工业垂直领域，推动 AI 引导的材料发现。
        - 正方
        - 更多已验证客户成果和更清晰的重复使用经济性，会显著强化这一判断。
      - - Kemira、Hyundai、A*STAR 和 45+ 成员显示出高质量战略拉力。
        - 正方
        - 如果上述关系转化为多元化经常性收入，信心会上升。
      - - $450M 轮融资买来足够时间，可执行雄心勃勃的商业化计划。
        - 正方
        - 烧钱速度、现金续航和优先权条款披露，会说明实际买到多少时间。
      - - 相对于本轮已经嵌入的估值，公开证据仍然偏窄。
        - 反方
        - 再落地两三个旗舰部署，可削弱这一质疑。
      - - 公开经济数据过少，无法证明 $2.6B 提供安全边际。
        - 反方
        - 收入、留存和毛利率披露，会直接改善判断。
      - - 公开科学平台可比公司表明，商业化持续不透明时，市场会大幅压缩估值。
        - 反方
        - 持续的平台采用和更好披露，会支撑其相对这组可比公司享有溢价。
    notes: 正方论点有吸引力；反方主要卡在时点和价格。
