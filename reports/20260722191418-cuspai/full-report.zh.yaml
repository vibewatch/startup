        - Large Quantitative Models 加联邦级商业化项目
        - 可能偏向大型战略项目，而不是通用型日常实验室工作流
      - - Schrödinger
        - 模拟现有厂商 / 替代方案
        - 上市公司现有厂商，拥有广泛材料科学套件
        - 需要模拟、筛选和多尺度建模的 R&D 团队
        - 覆盖聚合物、催化、半导体、能源和无机材料
        - 定位并非网络化外部实验室运营商
      - - Microsoft Discovery / Azure Quantum Elements 产品线
        - 超大规模云发现栈
        - Azure 分发、企业云、HPC 和私有预览发现工具
        - 企业 R&D、平台所有者、科学家、计算团队
        - 智能体式编排、治理、HPC、生成式化学、加速 DFT
        - 现有公开证据仍更强调平台赋能，而非发现工厂执行
