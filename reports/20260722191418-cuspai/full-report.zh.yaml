  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 科学进展滑坡、集中度或披露失误，会直接传导到收入质量、融资筹码和估值支撑。
    data:
      nodes:
        - id: science
          label: 从发现到生产的转化延误
        - id: customers
          label: 背书变弱 / 扩张变慢
        - id: revenue
          label: 收入质量降低
        - id: funding
          label: 后续融资更难或被重估
        - id: valuation
          label: 估值支撑减弱
      edges:
        - from: science
          to: customers
          label: 降低信任和转化
        - from: customers
          to: revenue
          label: 让订单更集中
        - from: revenue
          to: funding
          label: 推高融资负担
        - from: funding
          to: valuation
          label: 压缩入场估值支撑
        - from: science
          to: valuation
          label: 直接损伤投资论点
    claimRefs:
      - CR012
      - CR023
      - CR027
      - CR030
      - CR034
      - CR040
      - CR042
  - id: FR003
    title: 依赖图
    type: dag
    layout: standard
    summary: CuspAI 依赖算力、外部科学基础模块、伙伴数据、验证实验室和旗舰客户背书。
    data:
      nodes:
        - id: compute
          label: 算力 / 模拟伙伴
        - id: models
          label: 外部模型基础能力
        - id: data
          label: 伙伴数据权利
        - id: labs
          label: 验证实验室 / 合成能力
        - id: refs
          label: 旗舰客户背书
        - id: commercial
          label: 商业可信度
      edges:
        - from: compute
          to: commercial
          label: 受限时拖慢吞吐
        - from: models
          to: commercial
          label: 影响工作流质量
        - from: data
          to: commercial
          label: 影响护城河和相关性
        - from: labs
          to: commercial
          label: 控制证据出现节奏
        - from: refs
          to: commercial
          label: 锚定企业信任
    claimRefs:
      - CR014
      - CR018
      - CR019
      - CR020
      - CR024
      - CR033
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 推荐逻辑看重容错空间：证据窄、企业级就绪度有缺口很关键，因为当前估值已经预支了相当一部分未来成功。
    data:
      nodes:
        - id: scale
          label: 大型战略机会
          detail: 材料发现 + 工业 R&D 平台
        - id: proof
          label: 真实但狭窄的证据
          detail: Kemira + 头部伙伴 + Foundry
        - id: risk
          label: 高执行与披露风险
          detail: 商业化、集中度与信任缺口
        - id: price
          label: 当前估值 $2.6B
          detail: 要求未来证据兑现，而当前价格已部分买单
        - id: rec
          label: 跟踪 / 仅做尽调
          detail: 需要更好数据或更好条款
      edges:
        - from: scale
          to: proof
          label: 支撑关注
        - from: proof
          to: risk
          label: 广度仍不足
        - from: risk
          to: price
          label: 压缩容错空间
        - from: price
          to: rec
          label: 推动推荐结论
        - from: scale
          to: rec
          label: 留在观察名单
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV008
      - CV031
      - CV038
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 少数里程碑和披露变量，比市场对 AI 科学的泛泛热情更能左右估值。
    data:
      items:
        - label: 第二 / 第三个旗舰客户成果
          value: 95
          detail: 主要重估驱动
        - label: 收入和留存披露
          value: 90
          detail: 填上最大的投资判断缺口
        - label: 头部客户之外的客户多元化
          value: 84
          detail: 提升收入质量信心
        - label: 信任 / 合规运营成熟度
          value: 76
          detail: 影响企业级就绪度
        - label: 资本市场对 AI 科学的胃口
          value: 72
          detail: 外部倍数 / 叙事驱动
    claimRefs:
      - CV003
      - CV005
      - CV024
      - CV027
      - CV031
      - CV038
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开财务输入稀少，用情景推导估值区间比精确倍数更站得住。
    data:
      items:
        - label: 悲观估值区间（US$B）
          low: 0.9
          mid: 1.2
          high: 1.6
          displayValue: 0.9-1.6
          detail: 证据仍窄，或宏观环境转向
          tone: risk
        - label: 基准估值区间（US$B）
          low: 2
          mid: 2.6
          high: 3
          displayValue: 2.0-3.0
          detail: 当前估值大体站得住，但缓冲有限
          tone: neutral
        - label: 乐观估值区间（US$B）
          low: 4
          mid: 5
          high: 6
          displayValue: 4.0-6.0
          detail: 平台证据显著变宽
          tone: opportunity
        - label: 以 2.6B 入场的潜在投资人结果
          low: 0.35
          mid: 1
          high: 2.3
          displayValue: 0.35x-2.3x
          detail: 各情景下的示意性总回报区间
          tone: warning
    approximationNotes: 这些区间基于情景，反映里程碑概率、可比公司框架和容错空间，而不是已披露收入或 DCF 输入。
    claimRefs:
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 按当前价格看，CuspAI 战略质量得分高，但公开投资判断可见度得分低。
    data:
      items:
        - label: 市场重要性
          value: High
          detail: 材料和工业 R&D 是战略上足够大的问题
        - label: 产品 / 技术雄心
          value: High
          detail: Foundry + 私有部署 + 验证闭环
        - label: 客户证据广度
          value: Medium
          detail: 有具名证据，但仍集中
        - label: 经济性可见度
          value: Low
          detail: 没有公开收入、留存或利润率数据
        - label: 风险画像
          value: High
          detail: 执行、集中度、依赖、信任
        - label: 估值吸引力
          value: Low-Medium
          detail: 当前价格留下的容错空间有限
        - label: 证据质量
          value: Medium
          detail: 战略证据强，财务证据弱
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV013
      - CV020
      - CV031
      - CV042
