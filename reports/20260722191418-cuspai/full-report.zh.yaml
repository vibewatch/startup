  - id: TV005
    title: 论点破裂与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 商业证据停滞
        - 下一个主要融资窗口内，没有第二或第三个带具体结果的旗舰客户成果
        - 削弱平台溢价，并强化证据偏窄的担忧
        - 不要加价追；下调估值支撑
      - - 多元化迟迟不出现
        - 多数公开证据仍集中在同一小组关系里
        - 抬高集中度和收入质量担忧
        - 把成员数量视作品牌，而非广度证据
      - - 信任 / 合规成熟度持续不透明
        - 企业足迹扩大，但隐私、安全、支持或合同披露仍无实质内容
        - 伤害企业级就绪度论点
        - 加大尽调负担并降低信心
      - - 资本市场降温或融资条款恶化
        - 未来融资或二级交易暗示价格承压，并低于当前叙事预期
        - 表明本轮可能提前透支了未来上行
        - 避免激进进场定价
      - - 出现依赖冲击
        - 关键计算、模型、实验室或旗舰伙伴削弱或退出
        - 直接拖慢证据速度并削弱客户信心
        - 重评时间表、下行区间和护城河耐久性
    notes: 触发项把定性担忧转成可监测的承销纪律。
    claimRefs:
