      - number: '8.2'
        title: 投资逻辑、反向逻辑与可比背景
        blocks:
          - type: paragraph
            body: >-
              乐观逻辑是自洽的。材料发现是一个巨大且具战略意义的问题；公开资料显示，CuspAI 在化学、出行和机构 R&D 领域拥有严肃客户或伙伴；Foundry
              成员参与广泛；公司也筹到足够资本，可以推进重执行策略，而不只是做轻量软件 demo。 SandboxAQ 2025 年估值和 2026 年 CHIPS
              支持扩张也说明，在传统软件指标披露之前，资本市场可以给面向物理世界的 AI 平台高估值。反向逻辑同样有力。几个有真实公开市场定价的可比公司——Schrödinger、Recursion、Ginkgo
              Bioworks 和 Simulations Plus——2026 年 7 月市值大约在 $0.36 billion 到 $1.58 billion 之间，而 CuspAI 最新一轮已隐含 $2.6
              billion 价值。这些公司不是完美可比，但合在一起说明，一旦商业化、持久性或利润率保持不透明，公开市场会多么严厉地折价科学平台故事。 如果 CuspAI
              真成为基础设施，它可能配得上高于许多可比公司的溢价，但仅凭公开证据尚未证明这份溢价。
