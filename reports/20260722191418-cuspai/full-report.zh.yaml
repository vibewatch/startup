        - 闭环 AI 加机器人，实验吞吐量主张强
        - 自驱动实验室的经济性和自主性边界仍是行业约束
    notes: 画像行混合了直接同业、邻近现有厂商和替代方案，因为买家可以用多种架构选择解决同一个发现问题。
