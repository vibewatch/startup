      - number: '5.4'
        title: 差异化、耐久性与主要技术风险
        blocks:
          - type: paragraph
            body: >-
              CuspAI
              最强的差异化主张，是把生成式设计、模拟、合成规划和实验验证整合进同一个工业工作流。这比纯软件数据工具更有野心，也比开放研究资料库更面向外部。问题在于，许多基础能力正在快速扩散。UMA、MatterGen、GNoME、ALCHEMI、Azure
              Quantum Elements 以及其他公开或半公开资产，让底层发现原语更容易获取。同时，SandboxAQ、Schrödinger、Atinary 和 Orbital
              等竞争对手各自覆盖同一技术栈中有意义的部分。因此，公开证据指向的是更细的护城河：如果 CuspAI 的数据权利、客户专属工作流和验证闭环优于替代方案，它可以形成差异；但不能仅凭“使用 AI
              做材料发现”这句话。最大的技术风险是对外部基础设施的依赖、公开信任控制不完整，以及发现阶段成功能否转化为可重复商业部署这个仍未关闭的问题。
