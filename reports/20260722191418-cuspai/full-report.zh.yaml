            body: >-
              成熟度图景并不均衡。公开层面看，发现和候选生成能力最成熟：CuspAI 和 Kemira 描述了一个端到端 PFAS 修复项目，用六个月从巨大搜索空间推进到短候选清单；Foundry
              本身也带着数十名战略成员发布。但运营成熟度的公开证据薄得多。保留来源没有展示公开 API 文档、运行时间历史、状态页、SOC 2 或 ISO
              安全认证，也没有详细支持承诺。信任更多通过私有部署、大型伙伴和具名工业合作间接建立。招聘页面还显示产品仍在积极搭建，开放岗位覆盖 agents、force fields and simulation 和
              engineering。这本身不是负面，但说明平台还在快速移动，而不是一个冻结且合规很重的企业产品。实际来看，公开记录支持强技术野心和中等工作流成熟度，但对支持、安全和生产运营控制的证明仍不完整。
