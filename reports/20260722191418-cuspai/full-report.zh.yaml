        - 中
        - 高
        - 相对公开证据偏贵；只有强基准情形下才算合理
        - 不要仅凭公开证据承销 2026 年 6 月这一价格；只有专有尽调显著提高可见度，或条款提供更多下行保护时才投资
    notes: 建议反映价格敏感性，不只是公司质量。
