  - id: TR005
    title: 缓释措施与终止标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 技术转化风险
        - 生产级材料成果
        - 到下一个主要融资窗口前，没有新的重大客户验证成果
        - 下调信心；假设商业化更慢
      - - 客户集中风险
        - 证据中绑定头部少数账户的比例
        - 旗舰账户流失或停滞，且没有新的抵消性证据
        - 按比成员数量暗示更窄的商业护城河处理
      - - 信任 / 合规风险
        - 隐私、安全和合同控制的公开披露
        - 企业足迹扩大，但信任披露仍无实质内容
        - 加大尽调负担，并下调企业级就绪度
      - - 依赖风险
        - 伙伴或平台流失
        - 关键计算、模型或验证伙伴流失
        - 重新评估执行时间表和成本结构
      - - 估值风险
        - 商业指标与价格
        - 收入、留存和转化仍未披露，而估值保持高位
        - 避免激进进场价格，或等待数据
    notes: 触发项设计成可从未来公司更新或尽调材料中监测。
