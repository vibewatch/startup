companyProfile:
  summary: >-
    CuspAI 是一家总部在英国 Cambridge 的私营公司，由 Chad Edwards 和 Max Welling 于 2024 年创立，目标是用 AI 做工业材料发现。公开证据支持其雄心很大的平台策略：以 AI
    Materials Foundry 为核心，把 MIRA 驱动的设计、模拟、私有部署、实验验证和强伙伴生态拼在一起。公司据报完成 $450 million Series B 轮，估值 $2.6 billion，累计融资超过 $650
    million；但公开披露中的经济指标仍很薄，核心尽调问题因此落在一点上：顶级科学定位能否转化为多元且持久的商业化。
