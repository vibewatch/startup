      - 指标
      - 倍数 / 估值 / 状态
      - 参照意义
      - 局限
    rows:
      - - Schrödinger
        - 公开市值
        - 截至 2026 年 7 月为 US$1.12B
        - 最接近的公开科学软件 / 仿真相邻标的
        - 公开公司折价和业务组合不同于 CuspAI
      - - Recursion Pharmaceuticals
        - 公开市值
        - 截至 2026 年 7 月为 US$1.58B
        - AI 驱动的科学平台，具备扎实数据 / 计算叙事
        - 药物发现经济性不同于材料发现工作流
      - - Ginkgo Bioworks
        - 公开市值
        - 截至 2026 年 7 月为 US$0.51B
        - 平台叙事遭遇公开市场压缩时的有用警示可比
        - 合成生物学属性和上市历程并不完全可比
      - - Simulations Plus
        - 公开市值
        - 截至 2026 年 7 月为 US$0.36B
        - 说明成熟细分科学软件仍可能以温和估值交易
        - 规模更小，也比 CuspAI 的 Foundry 模型更像纯软件
      - - SandboxAQ
        - 私募估值 / 战略资金
        - 2025 年 4 月估值 US$5.75B；之后获得 US$500M CHIPS 奖励
        - 面向物理世界的 AI 平台可获得溢价估值的最佳私募证据
        - 规模更大、领域更广，且有政府支持，降低可比性
      - - Ansys
        - 最后已知公开市值
        - 2025 年 8 月为 US$32.9B
        - 仿真龙头给出上限参照，说明完全商业化的工程软件能值多少钱
        - 成熟度远高于 CuspAI，不是创业阶段可比
    notes: 可比集合混合了公开相邻标的和私募战略参照，因为 CuspAI 缺少公开财务输入，无法搭出更干净的可比框架。
    enumerationScope:
