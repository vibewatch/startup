      - - 商业化领导力
        - 科学成果还需要可复制的 GTM 和账户扩张纪律
        - 中
        - 高
        - Foundry 伙伴带来强劲漏斗顶部
        - 索取销售领导履历、转化漏斗和续约负责人
    notes: 人员风险集中在：一家很年轻的科学公司能否扩成全球工业平台。
