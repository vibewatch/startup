            body: >-
              商业风险仍与集中度和不透明度绑在一起。公开客户叙事主要由 Kemira、Hyundai、A*STAR 和 Foundry 成员生态撑起；
              关于活跃付费账户数、留存、续约或客户多元化的证据有限。也就是说，少数标杆关系可能承载大部分战略价值， 而收入集中度仍被遮住。财务上，2026 年 6 月这一轮让 CuspAI 拥有两年公司少见的资产负债表强度，
              但也抬高了举证门槛。$2.6 billion 估值意味着投资者买入的不只是科学潜力，还包括未来大规模商业化。 公开披露仍没有收入、毛利率、烧钱速度或现金跑道细节。如果商业化延后，公司或许仍有资本，
              但下一轮融资或流动性事件可能会大幅重定价。人才风险也不小：CuspAI 在全球扩张，招募覆盖智能体、 力场和模拟的专门人才，同时仍高度依赖创始人信用和稀缺科学领导力。简言之，钱买来时间， 买不来可复制性的证据。
