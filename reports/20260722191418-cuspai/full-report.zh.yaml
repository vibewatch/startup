            body: >-
              对一家成立两年的欧洲深科技公司来说，CuspAI 的创始人故事异常强。两位创始人把化学、工业商业化和前沿机器学习履历合在了一起。Chad Edwards 一直被描述为 Cambridge Quantum /
              Quantinuum 的商业联合创始人，也是公司现任 CEO；Max Welling 则被描述为联合创始人和核心技术负责人，曾任职 Microsoft Research、Qualcomm 和 University
              of Amsterdam。2026 年，领导层的公开能见度进一步提高：曾在 Apple 和 Google 任职的 John Giannandrea 据报正协助搭建美国业务。Companies House
              记录提供了有用但不完整的治理证据：高管页面显示六名高管和两次辞任，备案历史则记录了 2026 年多次股份类别和配发动作。这足以确认真实公司活动，但还不足以完整理解董事会构成、投票控制权或投资人权利。地域信号也不止
              Cambridge：公开招聘或被提及团队覆盖 London、Amsterdam、Singapore、Berlin、Tokyo、United States 和 Cambridge。
