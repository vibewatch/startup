    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立与产品主张
        blocks:
          - type: paragraph
            body: >-
              公开记录和面向公司的材料一致指向：CuspAI 位于英国 Cambridge，2024 年成立，目标是用 AI 做材料发现。最简单且一致的产品描述不是通用 AI
              实验室，而是材料搜索平台：客户提出目标属性，CuspAI 生成候选材料、模拟候选项、规划合成路线，并协调实验验证。官方、投资人和媒体资料都采用同一套叙事，这一点很重要，因为后续尽调要回答的是 CuspAI
              到底在卖软件、科学服务，还是一个网络化研发平台。2026 年 7 月 Foundry 发布后，公司不再只是点状解决方案：它把 MIRA
              平台与伙伴实验室、数据、算力，以及半导体、清洁能源、水和先进制造中的工业项目合在一起。因此，身份故事是连贯的：CuspAI 把自己定位成工业材料发现基础设施，而不只是模型供应商。
