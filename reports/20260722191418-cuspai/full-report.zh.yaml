      - number: '2.2'
        title: 规模测算镜头与公共预算代理指标
        blocks:
          - type: paragraph
            body: >-
              公开证据支持几个有用的规模测算镜头，但它们处在不同层级，不能合并成一个虚假的 TAM。Emergen Research 描述了一个直接 AI 驱动材料发现平台市场：2025 年规模为 $2.0
              billion，收入 CAGR 为 26.1%；在所审阅公开来源中，它最接近直接供应商收入口径。Future Markets
              又给出更广的材料信息学口径，横跨软件、咨询和企业内部实施，覆盖电池、半导体、催化剂、聚合物等领域。政府和行业预算则解释了为什么买方基础大于直接软件品类：CHIPS for America 正把 $11
              billion 投入半导体研发基础设施，Department of Commerce 专门授予 SandboxAQ $500 million 用于 AI 驱动的半导体材料发现，DOE 的 FY2026
              Science 预算申请总额为 $7.092 billion，其中 Basic Energy Sciences 单项为 $2.241 billion。最后，PwC 的半导体展望展示了下游经济奖池：2024
              年半导体市场为 $627 billion，预计到 2030 年超过 $1 trillion。正确解读应是分层需求，而不是一个头条市场数字。
