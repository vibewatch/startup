  topStrengths:
    - CuspAI 切中 AI、材料发现、半导体、能源和先进制造交叉处的重大工业瓶颈。
    - 以公司阶段看，CuspAI 已拼出少见的伙伴和投资人生态，技术、产业和机构参与方都有头部名字。
    - Kemira 是可信的具名公开验证，披露的是具体发现产出，不只是 logo 背书。
    - AI Materials Foundry 模式若能深化私有部署和多项目客户循环，可能长成差异化平台。
  topRisks:
    - 公开证据离大规模生产级商业化仍有距离，发现成功到工业部署之间还有重大转化风险。
    - 收入、留存、毛利率和客户集中度披露太稀，难以按当前估值干净承销。
    - 执行依赖伙伴数据、伙伴实验室、算力基础设施和旗舰关系，依赖风险就是故事核心。
    - 当前估值容错空间有限；客户广度、信任成熟度或商业转化若慢于预期，回撤会很快。
  unresolvedGaps:
    - 需要收入模型、已签合同、毛利率、烧钱速度和现金跑道细节，才能更扎实锚定估值。
    - 具名客户项目的留存、续约和试点转生产转化数据。
    - 按收入划分的客户集中度，以及 Foundry 成员相对战略 logo 的经济价值。
    - 私有 Foundry 部署中的数据权利、IP、监管责任和合同结构。
    - 股权结构表、清算优先权、投资人保护条款及其他影响下行的轮次条款。
