    "title": "Customers",
    "summary": "CuspAI\u2019s public customer evidence is real but narrow: the clearest proof is Kemira, followed by strategic partnerships with Hyundai and A*STAR and a broad Foundry member roster. That supports meaningful early adoption in industrial R&D, but not yet a broad, well-disclosed base with public retention or expansion metrics."
  },
  "sections": [
    {
      "id": "who-the-early-customer-base-appears-to-be",
      "title": "Who the early customer base appears to be",
      "body": "Public evidence suggests that CuspAI\u2019s early customer base is concentrated in large enterprises, industrial R&D groups, and research institutions rather than broad horizontal software buyers. The named examples cluster in four segments: chemicals and water treatment (Kemira), automotive and mobility materials (Hyundai Motor Group), public-sector or national-lab style R&D infrastructure (A*STAR), and a much broader set of strategic founding members inside the AI Materials Foundry spanning semiconductors, clean energy, advanced manufacturing, and electronics. Those accounts appear to be bought or sponsored at a senior technical or innovation level rather than through decentralized individual users. The strongest evidence also points to multi-party workflows, where the buyer, scientific user, and budget owner may differ. That is consistent with CuspAI\u2019s product shape: private deployment, data sensitivity, and partner-led validation all fit long-cycle enterprise R&D sales more than fast self-serve adoption. The trade-off is that public volume metrics are thin, so the customer base looks strategically valuable but still early.",
