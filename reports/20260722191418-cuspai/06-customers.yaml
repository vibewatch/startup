    {
      "id": "expansion-loops-and-concentration-risk",
      "title": "Expansion loops and concentration risk",
      "body": "Expansion potential is visible even though quantitative proof is not. Kemira\u2019s 2026 release says further projects are already being scoped under the partnership framework, while the Foundry model creates a path from one-off collaboration to multi-program participation, private instances, partner data contributions, and deeper use of the network\u2019s lab infrastructure. A*STAR also illustrates geographic expansion into Singapore and the Asia-Pacific customer base. At the same time, concentration risk appears material. Public proof is dominated by a small set of marquee relationships and by the Foundry ecosystem itself. If a few large members drive most usage, data, or revenue, customer concentration and partner dependence could become a hidden risk. The broader implication is that CuspAI may have a strong land-and-expand design, but investors should not confuse high-profile names with broad diversification. The diligence priority is to separate strategic value from actual revenue concentration and repeat usage.",
