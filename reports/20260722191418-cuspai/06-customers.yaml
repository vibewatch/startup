    {
      "id": "durability-retention-and-what-is-not-public",
      "title": "Durability and retention: what is not public",
      "body": "The main customer-analytics gap is durability. No retained source discloses net revenue retention, gross retention, churn, renewal rates, average contract term, reference-to-production conversion, or customer satisfaction benchmarks. That does not mean the signals are bad; it means they are hidden. In fact, several public features could support stickiness: private deployment, partner-specific data loops, long-cycle discovery programs, and integration with existing R&D infrastructure. But those same features can also lengthen procurement and concentrate revenue in a few strategic accounts. The available proof is therefore freshness-heavy and relationship-heavy. Most named evidence comes from 2025\u20132026 announcements, and even the strongest case studies remain in development or validation rather than clear long-term production operation. CuspAI looks like a company that may earn durable customers if technical results keep landing, but the public evidence stops before anyone can test that directly. That missing visibility is the central customer diligence obstacle today.",
      "claimRefs": [
