    {
      "id": "named-customer-proof-and-what-it-actually-proves",
      "title": "Named customer proof: what is proven versus still ambiguous",
      "body": "The public proof hierarchy is uneven. Kemira is by far the strongest named case because both parties describe a specific use case, a defined search problem, and a measurable output: a 300-trillion-structure search that produced over 5,000 designs and about 20 priority PFAS-remediation candidates in six months. Hyundai is meaningful but earlier-stage: it proves strategic engagement, relevance to mobility materials, and willingness to integrate CuspAI into a manufacturing-led innovation roadmap, but it does not disclose a finished material or quantified deployment outcome. A*STAR adds a different form of proof: not end-customer revenue, but institutional validation of the model in autonomous synthesis and applied materials programs. The Foundry roster is also important, yet it should be treated carefully. Named members and partner quotes show demand and ecosystem pull, but logos alone do not prove paid production use, repeat purchases, or retention. So the public record proves strategic adoption and workflow relevance, not mature production penetration.",
