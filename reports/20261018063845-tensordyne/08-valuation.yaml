  - id: "TV001"
    title: "Recommendation summary table"
    columns:
      - "Case"
      - "Recommendation"
      - "Confidence"
      - "Risk rating"
      - "Valuation stance"
      - "Decision implication"
    rows:
      - ["Today", "Research more / Track", "Low", "High", "Public marks are informative but not underwritten", "Do not stretch on price until primary financial and cap-table evidence is available"]
      - ["At or below the Aug-2025 Forge reference", "Conditional interest", "Low-Medium", "High", "Potentially actionable only after proof improves", "Could justify deeper diligence if commercialization, pricing, and customer conversion evidence arrives"]
      - ["Near the Jun-2026 Forge reference", "Pass for now", "Low", "High", "Too rich for current public proof", "Do not underwrite a ~$1.34B step-up on marketplace data plus vendor benchmarks alone"]
      - ["If primary docs validate conversion and preferences", "Re-open", "Medium", "Medium-High", "Price can move with proof", "Only revisit after signed financing terms, paid deployments, and margin evidence close the current gaps"]
    notes: "Forge references are marketplace financing datapoints rather than audited fair-value proofs, and Tracxn's lower total-funding tally remains unresolved."
    claimRefs: ["CV001", "CV002", "CV003", "CV004", "CV011", "CV012", "CV013", "CV015"]
  - id: "TV002"
    title: "Thesis / anti-thesis table"
    columns:
      - "Lens"
      - "Argument"
      - "What would change the view"
    rows:
      - ["Thesis", "Commercial momentum exists: Yespress reports $200M+ expected orders and theCUBE says production is underway ahead of systems going live before year-end.", "Convert order expectations into paid deployments, reference calls, and independent benchmark data."]
      - ["Thesis", "The product is positioned for a specific buyer pain point: more inference throughput without expanding data-center footprint.", "Show that the positioning leads to durable pricing power and not just technical curiosity."]
      - ["Anti-thesis", "Marketplace marks span from $569.02M to $1.34B while Tracxn still shows a much smaller cumulative funding picture, so price discovery is noisy.", "Provide the signed 2025/2026 financing documents, exact round sizes, and current ownership stack."]
      - ["Anti-thesis", "Public evidence does not disclose revenue, ASP, gross margin, or cap-table overhang, so upside is mostly narrative until management opens the books.", "Disclose booked backlog, realized pricing, gross-margin bridge, and current liquidation stack."]
    notes: "The table intentionally mixes positive and negative arguments because the recommendation is price-sensitive rather than a simple quality score."
    claimRefs: ["CV004", "CV006", "CV007", "CV008", "CV011", "CV012", "CV014"]
  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns:
      - "Scenario"
      - "Assumptions"
      - "Valuation / return logic"
      - "Key risks"
      - "Probability signal"
    rows:
      - ["Bull", "Napier systems go live on schedule, order interest converts to paid deployments, and independent testing validates the claimed throughput and efficiency edge.", "A valuation at or above Forge's $1.34B June 2026 reference is only supportable if the proof set expands materially beyond marketplace and management signals.", "Benchmark slippage, slower customer conversion, or structured terms in the next round.", "Possible, but not yet evidenced in the assigned public pool."]
      - ["Base", "The company shows some deployments and financing access, but pricing, margins, and preference overhang remain only partly disclosed.", "The more defensible public anchor is around the older ~$569M 2025 reference or only a modest step-up from it until underwriting data improves.", "A soft next round, delayed deployments, or lower-than-advertised economic advantage.", "Most consistent with today's mixed market signals and incomplete financial disclosure."]
      - ["Bear", "Performance claims fail independent validation, deployments slip, or the next financing must clear with heavier investor protections.", "Value compresses below the 2025 Forge reference or becomes unattractive regardless of headline valuation because downside protections absorb the upside.", "Down round, preference stack complexity, customer pushout, or gross-margin disappointment.", "A real downside path because public evidence is still heavier on story than on realized economics."]
    notes: "Ranges are expressed as anchored valuation logic rather than false precision because the assigned pool does not disclose revenue, margin, or comparable-multiple inputs needed for a clean model."
    claimRefs: ["CV001", "CV002", "CV006", "CV007", "CV009", "CV010", "CV011", "CV012", "CV013", "CV014"]
