              公开商业证据是本章最薄弱的部分。公司及外部简介提供了订单预期、生产时间表和大致买方类别，
              但没有实际定价、赢单率、续约数据，或针对其点名在位者的独立验证基准包。就连基本公司信息也尚未完全确定：
              第三方简介对总部标注存在分歧，公开人才信号也仅限于 Levels.fyi 上的一个薪资族群。
              这并不否定产品主张，但意味着护城河判断依赖未来客户证明和验证，而不是已展现的市场力量。
