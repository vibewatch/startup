        - 将订单预期转化为付费部署、参考客户访谈和独立基准数据。
      - - 正论
        - 产品瞄准明确的买方痛点：在不扩建数据中心占地的情况下提高推理吞吐量。
        - 证明这一定位带来持久定价权，而不只是技术好奇。
      - - 反论
        - 市场估值标记从 $569.02M 到 $1.34B 不等，而 Tracxn 仍显示累计融资规模小得多，因此价格发现噪声很大。
        - 提供已签署的 2025 / 2026 融资文件、准确轮次规模和当前持股结构。
      - - 反论
        - 公开证据没有披露收入、ASP、毛利率或股权结构的潜在稀释，因此在管理层打开账本前，上行空间主要还是叙事。
        - 披露已确认订单积压、实现价格、毛利桥接和当前清算优先权结构。
