chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、业务版图与产品定位
        blocks:
          - type: paragraph
            body: >-
              Tensordyne 是 Recogni 在 2025 年 9 月后的名称，官方及独立来源都将其追溯至 2017 年成立。公司如今将自己定位为私营 AI
              推理基础设施供应商，而非早期的计算机视觉公司；官方和第三方描述都指向加州总部及德国工程团队。产品主张不是单点芯片，而是围绕对数数学、由定制芯片、互连和软件组成的集成推理栈，服务超大规模、neo-cloud
              和企业数据中心工作负载。后续章节应谨慎复用这一身份：公司真实存在且已进入后期阶段，但保留的来源池仍无法证明估值、收入和客户规模。
