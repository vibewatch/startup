        title: 融资历史、利益相关方与可支持的实际规模
        blocks:
          - type: paragraph
            body: >-
              公司有一个明确核实的融资锚点，也有几个较弱的规模信号。官方信息显示，Recogni 于 2024 年 2 月完成 $102 million C 轮融资，股权投资方和 HSBC
              债务支持均有点名。独立报道后来称公司融资约 $176 million、正在筹备 D 轮；另一家简介网站则称已融资 $211 million，并在 2025 年 7
              月完成一轮融资。由于这些累计金额无法从保留证据中勾稽一致，不应把它们当作已经确定的封面事实。运营规模也应同样谨慎：150 人的描述和单薄的薪资数据只能作为方向性信号，不能证明员工数、收入或客户基础。
