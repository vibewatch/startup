      - number: '2.3'
        title: 采用驱动、约束与未解问题
        blocks:
          - type: paragraph
            body: >-
              保留证据中的采购逻辑是连贯的，但仍处于发布前阶段。Stash Media 引述合作伙伴的报道称，Tensordyne 正与希望在不扩大机房占地的情况下增加处理能力的数据中心所有者沟通；TweakTown
              则称公司通过支持 Hugging Face 托管模型、PyTorch、Triton 和定制 Python
              SDK，力求降低迁移摩擦。这些是有意义的采用驱动，因为它们把硬件性能连接到平台团队的真实迁移路径，而不只是芯片级基准。约束同样重要：TweakTown 明确警告，核心吞吐和能效差异仍是发布前的供应商主张，beta
              系统计划于 2027 年第一季度推出，更广泛的出货要到 2027 年第二季度末。薪资和员工数代理指标可以帮助判断 Tensordyne
              是一家中型运营商，但不能替代签约部署、公开定价或独立市场研究。因此，本章可以证明市场相关性和买方逻辑，却不能支持完整的基准化 TAM、SAM 或转化预测。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM013
              - CM014
              - CM015
