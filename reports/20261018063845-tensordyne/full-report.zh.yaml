  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买方定义
        blocks:
          - type: paragraph
            body: >-
              指定来源池中最有力的证据指向一个相对狭窄的市场边界，而不是泛半导体或 AI 软件类别。LeadIQ 将 Tensordyne 描述为“面向超大规模和 Neo Cloud 数据中心的多模态 GenAI
              推理集成平台”；IndexBox 和 TweakTown 都把 Napier 定义为以速度、能效和机架密度为目标的推理基础设施。因此，相关比较集合应是面向大模型服务的机架级推理部署，而不是完整的 AI 训练
              GPU 市场、通用企业软件，或公司作为 Recogni 时的汽车视觉业务。YesPress 进一步以芯片、计算托盘、互连和软件一体化来强化系统级边界。买方证据也一致：公开信息面向关注电力、机房空间和机架级吞吐的
              AI 云、超大规模云厂商和数据中心运营商。对尽调而言，这一较窄的定义很重要，因为笼统的“AI 硬件 TAM”会夸大当前可触达市场，也模糊最初预算究竟由谁掌控。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM015
      - number: '2.2'
        title: 市场规模视角与近期需求信号
        blocks:
          - type: paragraph
            body: >-
              指定证据不足以支持经典的公开 TAM/SAM/SOM 分层，因此可用的规模分析必须自下而上。最清晰的数量化需求信号来自 IndexBox：Tensordyne 预计未来需求超过 $200
              million，并且已经有十多份用于 beta 评估的意向书。同一报道点名 Cirrascale 和 BlueSky Compute 为有兴趣的各方，这比泛泛的“大型 AI
              市场”更有决策价值，因为它指向了具体买方类别。TweakTown 补充了部署单位：TDN72 机架包含 288 颗芯片、608 PFLOPS FP8 算力，采用 120kW 风冷方案。合起来看，这些数据说明
              Tensordyne 正在向按每瓦 token
              数、机房占地和可部署系统密度衡量价值的买方销售机架级算力。但这些信息没有提供独立的市场份额分母，所以当前证据支持的是采用管线规模，而不是经过外部基准验证的市场规模主张。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM012
