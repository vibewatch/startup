  summary: >-
    Tensordyne 是 Recogni 在 2025 年后的名称。这是一家 2017 年成立的私营 AI 基础设施公司，围绕面向大型数据中心运营商的集成推理栈展开。公司以 Napier
    为核心，将定制芯片、互连和软件结合起来，运营覆盖加州和德国，目标客户包括超大规模云厂商、neocloud 服务商、主权 AI
