        title: 定价披露单薄，公开经济性只能用买方侧代理指标衡量
        blocks:
          - type: paragraph
            body: >-
              Tensordyne 披露了性能和买方经济性主张，却没有披露卖方定价。发布材料称每个机架每年最多可增加 $33 million 收入，并可在单个机架内为每位用户提供每秒超过 1,000 个
              token；但没有公布机架价格、pod 价格、合同期限、维护费或折扣结构。独立的 YesPress 文章之所以有用，正因为它持怀疑态度：文章称 13x 吞吐和 17x
              能效数据属于供应商基准，独立测试仍待完成。对尽调而言，因此当前公开记录可以说明变现模式的形状，却无法确认实际 ASP、客户 ROI 或每次部署带来的利润贡献。
