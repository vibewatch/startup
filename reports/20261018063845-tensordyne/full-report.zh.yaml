  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 公开记录显示，公司从 Recogni 时代的成立与融资，走到 2025 年更名，再推进到 2026 年 Napier 商业化。
    data:
      items:
        - year: 2017
          label: Recogni 成立
          detail: 官方与独立来源均指向 Recogni 以该名称于 2017 年成立。
          tone: neutral
        - year: 2019
          label: 首轮融资到账
          detail: 2024 年公司融资公告称，公司于 2019 年拿到首轮融资。
          tone: neutral
        - year: 2022
          label: Marc Bolitho 出任 CEO
          detail: 独立报道显示，Bolitho 于 2022 年出任 CEO，早于品牌重塑和当前商业化推进。
          tone: neutral
        - date: '2024-02-20'
          label: $102M C 轮融资完成
          detail: Recogni 宣布完成 $102 million 的 C 轮融资，由 Celesta Capital 与 GreatPoint Ventures 共同领投，并获得 HSBC 债务支持。
          tone: positive
        - date: '2025-09-08'
          label: Recogni 更名为 Tensordyne
          detail: 官方留存材料称，Recogni 自 2025 年 9 月 8 日起更名为 Tensordyne。
          tone: positive
        - date: '2026-06-15'
          label: Napier 首次亮相
          detail: 独立报道将 Napier 的发布日期定为 2026 年 6 月 15 日，并称其已在 TSMC 完成流片。
          tone: positive
        - date: '2026-07-07'
          label: 品牌叙事瞄准数据中心运营商
          detail: 2026 年 7 月的一场营销活动将 Tensordyne 定位为面向机房空间受限的数据中心运营商、提供高能效算力。
          tone: warning
        - date: '2026-09-03'
          label: Napier 白皮书发布
          detail: Napier 官方白皮书在 Tensordyne 网站上汇总了系统架构与商业化叙事。
          tone: positive
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO007
      - CO009
      - CO015
