            body: >-
              即使当前规模指标尚不明确，里程碑路径仍然连贯。公司从 Recogni 时期的成立和首轮融资，走到 2025 年品牌重塑；随后在 2026 年集中宣传 Napier
              系统、生产准备度，以及面向受电力和占地约束的数据中心运营商的品牌叙事。这一叙事具有商业相关性，但投资者要把故事和证据分开：公开访谈和营销材料显示信心在增强，而独立评论仍将核心性能数据视为等待外部验证的供应商基准。简言之，执行节奏清晰，但收入和部署证据还没有跟上。
