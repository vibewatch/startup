          - type: paragraph
            body: >-
              情景区间之所以很宽，是因为执行与投资判断证据仍然脱节。乐观情景的依据是，theCUBE 访谈称芯片已经进入生产，系统预计在年末前上线；Stash
              引述合作伙伴的报道则显示，数据中心运营商无需扩建机房也能增加处理能力，这是买方关注的核心。限制因素是，Levels.fyi 和 LeadIQ
              只能提供粗略的运营规模代理指标，无法替代建立真正模型所需的卖方经济性。因此，只有当订单兴趣转化为付费部署，且独立基准验证所谓性能优势时，乐观情景才站得住脚；否则估值区间会迅速回落到较早的低位参考点。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 退出准备度仍是二级市场可见性，而非上市公司准备度
        blocks:
          - type: paragraph
            body: >-
              指定来源池中可见的资本市场路径是私募和二级市场，而不是有文件支持的上市流程。Forge 和 EquityZen 都将 Tensordyne 描述为拥有活跃私募市场参考信息的上市前公司；Forge
              的轮次表披露了一些优先权条款，却没有完整展示决定稀释、下行保护或新投资者相对现有持有人位置的条款体系。因此，最后一公里尽调格外重要：在判断是否进行一笔原始投资前，投资者需要已签署的轮次文件、当前股权结构表、已签订单积压、付费客户转化数据、毛利证据和独立性能证明。在此之前，实际退出路径仍是等待更好证据，而不是自信地持有至
              IPO。
            claimRefs:
              - CV005
              - CV012
              - CV014
              - CV015
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 当前判断：继续研究 / 跟踪
            body: Tensordyne 有足够证据留在观察名单上，但没有足够证据支持按 2026 年后期成长轮估值买入，除非先由第一手资料确认收入质量、客户转化和资本结构条款。
            calloutType: recommendation
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV015
          - type: callout
            title: 最大估值风险是证据滑坡，而不是缺少故事
            body: 如果所谓性能优势未能通过独立验证，或下一轮融资加入大量结构性条款，公开估值区间可能很快压回较早的低位参考点。
            calloutType: risk
            claimRefs:
              - CV006
              - CV012
              - CV013
              - CV014
