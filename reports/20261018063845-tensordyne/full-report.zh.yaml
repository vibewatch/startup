        - 基准延误、客户转化较慢，或下一轮融资采用结构化条款。
        - 可能发生，但指定公开资料池尚未提供证据。
      - - 基准
        - 公司展示出一些部署和融资渠道，但定价、利润率和优先权潜在稀释仍只披露了一部分。
        - 在投资判断数据改善前，更站得住脚的公开锚点是 2025 年较早的约 $569M 参考值，或仅在其基础上小幅上调。
        - 下一轮偏软、部署延期，或经济优势低于宣传。
        - 与当前混杂的市场信号和不完整财务披露最一致。
      - - 悲观
        - 性能主张未通过独立验证，部署延期，或下一轮融资必须在更重的投资者保护条款下完成。
        - 价值跌破 2025 年 Forge 参考值；即使宣传口径的估值不变，也可能因下行保护条款吞噬上行空间而失去吸引力。
        - 下轮融资、优先股堆叠复杂、客户推迟采购，或毛利率令人失望。
        - 这是现实的下行情景，因为公开证据仍更多是故事，而非已实现的经济结果。
