  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险主要集中在影响重大的事项上，而公开证据显示，对这些风险的缓释措施仍不完整或尚未落地。
    data:
      columns:
        - label: 发生可能性
          note: 根据指定证据作出的分析排名。
        - label: 影响
          note: 风险一旦发生，可能对投资判断造成多大损害。
        - label: 缓释成熟度
          note: 公开证据是否显示出可信的风险缓释组合。
      rows:
        - label: 基准验证
          note: 独立验证仍在等待中。
          values:
            - label: 高
              tone: critical
              note: 公司公开声称的性能仍跑在独立验证的系统之前。
            - label: 高
              tone: critical
              note: 如果这些数字经不起验证，核心价值主张就会失效。
            - label: 部分
              tone: high
              note: beta 时间表可见，但证明尚未公开。
        - label: 出货时间
          note: 客户出货证明仍超出当前公开记录。
          values:
            - label: 中高
              tone: high
              note: 流片已经完成，但出货仍是未来事项。
            - label: 高
              tone: high
              note: 重大延期会同时推迟收入和客户证明。
            - label: 部分
              tone: medium
              note: 里程碑已披露，但没有公开执行看板。
        - label: 合作伙伴技术栈集中度
          note: 制造、芯片、网络和 pod 架构都依赖一小批外部参与方。
          values:
            - label: 中高
              tone: high
              note: 产品叙事要成立，多项依赖必须同时兑现。
            - label: 高
              tone: critical
              note: 一个关键合作伙伴失误，就可能拖慢整个系统。
            - label: 部分
              tone: medium
              note: 已点名的交易对手提供了一定帮助，但看不到冗余安排。
        - label: 资本密集度
          note: 扩张看起来仍与外部融资绑定。
          values:
            - label: 中
              tone: medium
              note: 当前融资支持可见，但看不到自筹资金扩张。
            - label: 高
              tone: high
              note: 融资缺口可能同时拖慢生产和市场进入。
            - label: 部分
              tone: medium
              note: 投资人支持能缓释风险，但不能替代运营现金证明。
        - label: 买方集中度
          note: 可见需求仍来自一小圈基础设施买方。
          values:
            - label: 中高
              tone: high
              note: 被点名的意向方很少，广泛的买方多元化尚未公开。
            - label: 高
              tone: high
              note: 设计赢单缺失或延迟，会在早期同时打击证明和定价权。
            - label: 开放
              tone: high
              note: 证据池没有公开集中度数据或多元化部署案例。
        - label: 合规可见度
          note: 信任、隐私、事件和出口管制尽调仍是资料请求，不是已清除的事实。
          values:
            - label: 中
              tone: medium
              note: 风险未必会兑现，但买方通常很早就会要求相关材料。
            - label: 中高
              tone: high
              note: 资料包缺失，即使产品可用，也可能卡住企业采购。
            - label: 开放
              tone: high
              note: 指定证据池没有呈现完整的公开缓释方案。
    approximationNotes: 各单元根据指定证据池总结影响和缓释成熟度；色调是分析排名，不是外部审计的风险评分。
    claimRefs:
      - CR001
      - CR003
      - CR005
      - CR006
      - CR007
      - CR008
      - CR011
      - CR012
      - CR013
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 估值判断先从真实的私募市场参考点出发，再经过证明质量和资本结构缺口，最终落到继续跟踪 / 继续研究的建议。
    data:
      nodes:
        - id: private-market-references
          label: 私募市场参考点
          detail: Forge 公布了 2025 年 8 月 $569.02M 的估值标记，以及 2026 年 6 月 $1.34B 的估值标记。
        - id: secondary-liquidity
          label: 二级流动性信号
          detail: EquityZen 展示了卖方驱动的私募市场交易机会，有助于价格发现，但不能为运营提供融资。
        - id: commercialization-proof
          label: 商业化证明
          detail: 生产和上线时间可见，但付费客户转化尚未公开。
        - id: validation-gap
          label: 验证缺口
          detail: Yespress 称，独立基准确认仍在等待中。
        - id: capital-structure-gap
          label: 资本结构缺口
          detail: Forge 上可以看到优先权片段，但看不到完整的当前资本结构。
        - id: recommendation
          label: 推荐
          detail: 继续跟踪 / 继续研究；只有证明和条款同步改善后，才重新考虑激进定价。
      edges:
        - from: private-market-references
          to: secondary-liquidity
          label: 提供依据
        - from: secondary-liquidity
          to: commercialization-proof
          label: 仍需
        - from: commercialization-proof
          to: validation-gap
          label: 取决于
        - from: validation-gap
          to: capital-structure-gap
          label: 以及
        - from: capital-structure-gap
          to: recommendation
          label: 驱动
    approximationNotes: 本图编码的是决策逻辑，不是定价 DCF 或可比倍数模型。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV006
      - CV011
      - CV012
      - CV014
      - CV015
