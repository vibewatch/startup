        title: 领导层、治理与关键人物集中度
        blocks:
          - type: paragraph
            body: >-
              管理层信息集中在规模不大的创始人和高管班底上。独立来源及市场平台持续将 R.K. Anand 和 Gilles Backhus 置于产品和 AI 领导岗位；Marc Bolitho 则是外部可见的 CEO，负责
              2022 年领导层交接及后续品牌重塑。指定来源池中最清晰的治理信息来自 2024 年融资公告：公告称 Celesta Capital 的 Sriram Viswanathan
              当时担任董事会主席。这足以确认投资方对治理的影响，但不足以还原当前完整董事会名单。因此，尽调应把创始人 / 高管集中视为真实依赖，而不是假定公司已有广泛的机构治理。
