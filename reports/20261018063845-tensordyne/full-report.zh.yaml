  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 商业模式与需求信号
        blocks:
          - type: paragraph
            body: >-
              保留来源一致将 Tensordyne 描述为销售机架级 AI 推理硬件，而不是经常性 SaaS 产品。官方发布称 Napier 是面向超大规模云厂商、neocloud 和企业 AI 运营商的机架级系统；AI
              Market Watch 及 Stash/Found
              也强调，目标买方是在既有机房占地内寻求更高处理能力的数据中心运营商。公开需求证据仍处于收入前阶段：公司称与演示和早期访问相关的意向书超过十份，并将这些机会描述为超过 $200 million
              的预测系统需求，而非已确认收入。需求故事因此可信，但从评估管线走到付费机架出货仍是关键商业转化风险。
            claimRefs:
              - CI002
