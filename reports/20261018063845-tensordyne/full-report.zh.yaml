      layers:
        - label: 客户工作负载
          detail: 目标用户包括超大规模云厂商、neo-cloud、前沿模型开发商、企业和基础设施合作伙伴，它们运行高要求的 GenAI 推理。
          items:
            - label: 模型类别
              detail: 稠密和 MoE LLM，以及 VLM、语音和扩散模型。
            - label: 部署场景
              detail: 超大规模、neo-cloud、企业和基础设施合作伙伴的推理环境。
        - label: 模型使能
          detail: 客户模型必须在 Tensordyne 软件栈上完成画像、启动、验证和优化。
          modules:
            - label: 核心技术栈
              detail: 编译器、运行时、内核、SDK、推理服务器和 KV-cache 管理。
        - label: 服务与编排
          detail: 软件层预计会把框架和部署优化接起来，落到可在客户环境中重复执行的流程。
          modules:
            - label: 服务技术
              detail: PyTorch、vLLM、SGLang、Triton、量化和分布式推理技术。
            - label: 邻接能力
              detail: KV-cache 管理、编排和可观测性被列为产品反馈重点。
        - label: 评估框架
          detail: 技术客户团队把架构评审转化为基准设计和可量化的验收标准。
          outputs:
            - label: Evaluation KPIs
              detail: >-
                Throughput, tokens/sec/user, TTFT, memory utilization, power efficiency, system density, and model
                accuracy/quality.
        - label: 部署与上线
          detail: PoC、beta 部署和生产就绪工作，把基准测试叙事接到实际客户运营。
          outputs:
            - label: Rollout stages
              detail: Silicon bring-up, customer validation, beta deployments, and production rollout.
            - label: Field motion
              detail: Remote evaluations, on-prem beta deployments, integration programs, and production readiness.
        - label: 系统集成
          detail: 机架与 pod 设计把专用芯片、新型 AI 数学、网络、内存和散热约束整合成一个风冷部署单元。
          outputs:
            - label: System claims
              detail: 3nm Napier system; 72 accelerators per pod; 608 PFLOPS per rack; air-cooled operation.
            - label: Benchmark caveat
              detail: Claimed throughput and efficiency gains versus Nvidia still await independent benchmarks.
    approximationNotes: 本图是公开证据构成的技术栈，不是电路图；只展示留存来源明确描述的层级和依赖关系。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE006
      - CE009
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据显示，客户路径从细分定位和演示走向 LOI 与基础设施规划，但续约证明仍然缺失。
    data:
      items:
        - label: 目标账户
          actor: 超大规模云厂商、neocloud、主权 AI 运营商、企业
          stage: 目标定位
          tone: neutral
          touchpoints:
            - 超大规模云厂商和主权运营商管线
            - 存量数据中心部署推介
        - label: 演示与早期访问
          actor: 潜在基础设施运营商
          stage: 评估
          tone: neutral
          touchpoints:
            - 系统演示
            - 早期访问合作
        - label: LOI 信号
          actor: 不同类型的运营商潜客
          stage: 商业验证
          tone: positive
          touchpoints:
            - 十多份 LOI
            - 多账户兴趣的早期证据
        - label: 基准测试与 beta 规划
          actor: 潜客与内部团队
          stage: 技术转化
          tone: positive
          touchpoints:
            - 生产工作正在推进
            - 目标是在年底前上线系统
        - label: 机架规划
          actor: 已点名和未点名的运营商
          stage: 容量规划
          tone: positive
          touchpoints:
            - 超过 $200M 的预测需求
            - Cirrascale 与 BlueSky Compute 的兴趣
        - label: 生产与续约证明
          actor: 未来的装机客户
          stage: 持续性缺口
          tone: risk
          touchpoints:
            - 没有公开 GRR、NRR 或流失数据
            - 没有点名的线上生产部署案例
    approximationNotes: 该顺序反映披露的商业阶段，不代表观察到的转化率、停留时间或独立验证的扩张里程碑。
