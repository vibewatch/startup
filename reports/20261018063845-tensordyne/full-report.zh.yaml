      - number: '3.2'
        title: 差异化以推理为先，但在位者优势仍然重要
        blocks:
          - type: paragraph
            body: |-
              Tensordyne 的差异化主张在官网和投资者访谈中前后一致：将对数数学、定制芯片、
              scale-up 网络和软件兼容性整合进一套专用推理栈。对于更看重吞吐、每 token 功耗
              和机架密度，而非训练吞吐的运营商，因此产品故事可信。更难回避的竞争事实是分销能力。
              Celesta 访谈一方面认为推理降低了门槛，另一方面也承认训练领域的在位者仍有强护城河，
              CUDA 仍是一道高墙。换句话说，Tensordyne 的切入点在技术和经济性，而在位者的护城河来自
              装机基础、工具链和买方熟悉度。
