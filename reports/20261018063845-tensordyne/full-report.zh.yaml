  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争版图不止一个芯片对手
        blocks:
          - type: paragraph
            body: |-
              指定证据将 Tensordyne 定义为系统级挑战者，而非普通半导体初创公司：
              它挑战的是超大规模云厂商、neocloud 和企业 AI 运营商当前服务推理工作负载的方式。
              公开材料中的直接比较对象是 Nvidia 的 GB300 NVL72；替代方案还包括
              Nvidia 与 Groq 的混合部署、继续使用现有 PyTorch 和 Triton 栈的内部构建路径，
              以及公司自身已经放弃的传统视觉路线。买方不是在两颗孤立芯片之间做选择，
              而是在机架级架构、迁移摩擦和新供应商风险之间权衡，以降低每 token 成本和数据中心占地。
            claimRefs:
