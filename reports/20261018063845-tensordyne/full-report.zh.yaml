      - number: '4.3'
        title: 成本结构代理指标显示收入质量尚未显现前就会先承受资本密集度
        blocks:
          - type: paragraph
            body: >-
              公开数据指向资本密集型硬件爬坡。Tensordyne 称 Napier 已完成流片，并在 TSMC 3nm 工艺上生产；即使记录中还看不到大规模客户出货，这也意味着昂贵的芯片、封装和供应链承诺。Levels
              报告软件工程师薪酬中位数为 $97,959，LeadIQ 则将公司置于宽泛的 51-200 人区间，两者合起来只能给出粗略的运营费用底线。EquityZen
              补充了一个重要的融资区分：现有持有人可能有二级流动性，但这些出售不会为公司提供资金。公司同时释放出筹备 D 轮的信号，公开证据因此显示，在任何经披露的经常性收入或利润证明出现前，资本需求可能正在上升。
