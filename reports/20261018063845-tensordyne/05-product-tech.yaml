            - label: "Adjacencies"
              detail: "KV-cache management, orchestration, and observability are named as product-feedback priorities."
        - label: "Evaluation framework"
          detail: "The technical customer organization translates architecture review into benchmark design and measurable acceptance criteria."
          outputs:
            - label: "Evaluation KPIs"
              detail: "Throughput, tokens/sec/user, TTFT, memory utilization, power efficiency, system density, and model accuracy/quality."
        - label: "Deployment and rollout"
          detail: "PoCs, beta deployments, and production-readiness work connect the benchmark story to actual customer operations."
          outputs:
            - label: "Rollout stages"
              detail: "Silicon bring-up, customer validation, beta deployments, and production rollout."
            - label: "Field motion"
              detail: "Remote evaluations, on-prem beta deployments, integration programs, and production readiness."
        - label: "System integration"
          detail: "Rack and pod design combine purpose-built silicon, new AI math, networking, memory, and cooling constraints into one air-cooled deployment unit."
          outputs:
            - label: "System claims"
              detail: "3nm Napier system; 72 accelerators per pod; 608 PFLOPS per rack; air-cooled operation."
            - label: "Benchmark caveat"
              detail: "Claimed throughput and efficiency gains versus Nvidia still await independent benchmarks."
    approximationNotes: "This figure is a public-evidence stack, not a circuit diagram; it shows only the layers and dependencies explicitly described in the retained sources."
