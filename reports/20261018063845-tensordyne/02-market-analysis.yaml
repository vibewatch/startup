    title: "Boundary discipline matters more than headline AI TAMs"
    body: "The retained sources support Tensordyne as a rack-scale inference-system play for large data-center buyers, so broad AI-chip or semiconductor market figures would be a misleading valuation anchor."
    claimRefs: ["CM001", "CM002", "CM003"]
  - calloutType: "risk"
    title: "Public demand evidence is still pipeline-level"
    body: "The strongest sizing datapoints are management-guided orders, letters of intent, and pre-launch system specifications, which means adoption proof still hinges on 2027 deployment and external validation."
    claimRefs: ["CM005", "CM006", "CM008", "CM014"]
