      - ["TDN72 pod deployment", "Pod-level deployment used for benchmarking, beta, or rack build-out", "72-chip pod", "Technical form factor is public; stand-alone commercial pricing is not", "Low: product unit is clear, monetization terms are not", "Request pod pricing, attach rate into full racks, and installation scope"]
      - ["Benchmarking / early access", "Pre-sales demos and early-access engagement that may convert into hardware contracts", "Engagement / LOI", "More than a dozen LOIs tied to demos and early access", "Medium: demand signal, not revenue recognition", "Request LOI-to-paid-deployment conversion and any deposits or milestone payments"]
      - ["Secondary share liquidity", "Existing shareholders sell stock through an external marketplace", "Secondary share", "Available via EquityZen; proceeds go to selling holders rather than Tensordyne", "High on mechanism, not operating revenue", "Separate shareholder liquidity from primary financing in the funding model"]
    notes: "Mixes operating-revenue candidates with a non-operating liquidity channel to show what is and is not company cash."
    claimRefs: ["CI002", "CI003", "CI010", "CI013"]
  - id: "TI002"
    title: "Pricing / monetization table"
    columns:
      - "Price / unit / contract"
      - "List vs realized pricing"
      - "Discounts / unknowns"
      - "Source"
    rows:
      - ["Napier rack", "No public list price; company cites up to $33M more annual revenue per rack as a customer-economics claim", "Realized selling price, support bundle, and contract length are undisclosed", "Tensordyne launch release; Yespress skepticism"]
      - ["TDN72 pod", "No public pod price; public disclosures focus on 72-chip configuration and air-cooled technical design", "Unknown whether pods are sold stand-alone or only inside full-rack deployments", "Tensordyne launch release; Yespress profile"]
      - ["Early-access / demo pipeline", "LOIs tied to demos and early access, not disclosed purchase orders", "Unknown deposits, pilot fees, cancellation rights, and timing from evaluation to booked revenue", "Tensordyne launch release; AI Market Watch summary"]
    notes: "Public monetization evidence is buyer-side economics and pipeline status, not published Tensordyne price sheets or contract terms."
    claimRefs: ["CI003", "CI007", "CI014"]
  - id: "TI003"
    title: "Unit economics table"
    columns:
      - "Metric"
      - "Value / null"
      - "Confidence"
      - "Why it matters"
      - "Diligence ask"
    rows:
      - ["Software-engineer compensation proxy", "$97,959 median total compensation", "Medium", "Provides a rough labor-cost floor for technical headcount, but not loaded payroll or non-engineering mix", "Request current compensation bands and loaded payroll by function and geography"]
      - ["Employee-base proxy", "51-200 employees", "Low", "A wide headcount range constrains any public opex estimate for a hardware company approaching scale-up", "Request current headcount, open requisitions, and planned quarterly hiring"]
      - ["Gross margin", null, "Low", "Hardware underwriting depends on silicon, packaging, networking, manufacturing yield, and service-delivery cost", "Request BOM, manufacturing yield assumptions, and gross margin by rack or pod"]
      - ["CAC / payback / runway", null, "Low", "No public source discloses sales efficiency, burn, cash balance, debt facilities, or runway", "Request pipeline conversion, quarterly burn, cash on hand, debt terms, and next-round trigger"]
    notes: "Null means the retained public sources do not disclose the metric; the table distinguishes public proxies from missing private underwriting inputs."
    claimRefs: ["CI008", "CI009", "CI015", "CI016"]
