companyProfile:
  summary: >-
    Tensordyne is the post-2025 name for Recogni, a private AI-infrastructure company founded in 2017 and organized
    around an integrated inference stack for large data-center operators. The company combines custom silicon,
    interconnect, and software around Napier, with a California-and-Germany operating footprint, and it is targeting
    hyperscalers, neocloud providers, sovereign AI operators, and large enterprise inference teams. The retained pool
    supports a real company with late-stage commercialization momentum, but not a clean read on current valuation,
    revenue, or durable customer scale.
