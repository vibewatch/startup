        title: 'Financial verdict: credible demand, incomplete underwriting inputs'
        blocks:
          - type: paragraph
            body: >-
              The current evidence is good enough to say Tensordyne appears to have a real commercial offer and some
              early market pull, but not good enough to underwrite revenue quality or capital adequacy. The assigned
              pool even includes one apparently relevant financial-news URL that, when fetched, yielded only the
              publisher's generic commercial-content disclaimer and no Tensordyne-specific facts, which removes a
              potential independent corroborator rather than strengthening the case. As a result, the investable
              question is not whether the company can tell a compelling story; it is whether management can produce
