          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR007
              - CR008
              - CR011
              - CR012
              - CR013
      - number: '7.3'
        title: Capital intensity and narrow buyer concentration keep residual exposure high
        blocks:
          - type: paragraph
            body: |-
              The business model still looks capital hungry and commercially concentrated from
              public evidence. YesPress says Tensordyne has raised roughly $176 million and is
              preparing a Series D, while the official site frames influential venture and
              private-equity backing as enabling production. EquityZen reinforces that outside
              investors face private-market price discovery rather than public liquidity, and
              the buyer set that appears in public evidence is still concentrated in
              hyperscalers, neoclouds, AI infrastructure providers, and a short list of named
              interested parties. Workforce visibility is also incomplete: Hugging Face lists
              36 team members, LeadIQ shows a broader 51-200 employee band, and Levels.fyi
              provides only a single salary family. None of that disproves execution, but it
              does mean investors should monitor financing cadence, customer diversification,
              and leadership hiring before underwriting a clean scale-up.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary kill criteria
            body: >-
              Walk away or materially reprice if Tensordyne cannot show customer-usable beta evidence, third-party
              benchmark reproducibility, or stable shipment timing before large production commitments are expected.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR009
          - type: callout
            title: Mitigation maturity is real but still pre-proof
            body: >-
              Named leaders, investors, and partners reduce execution risk versus a bare laboratory project, yet public
              evidence still shows a scale-up story that must be proven in market rather than assumed.
            calloutType: insight
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Public financing references are real, but they are not enough to clear price risk
        blocks:
          - type: paragraph
            body: >-
              Tensordyne has credible public signals that private-market investors and secondary buyers are tracking it,
              but those signals are not the same thing as an underwritable fair value. Forge publishes two recent round
              reference points: August 2025 financings totaling $35.0 million at a $569.02 million post-money valuation,
              and a June 2026 Series C Prime Plus round of $50 million at a $1.34 billion post-money valuation. That is
              useful as financing context, yet the broader picture is still unsettled because Tracxn separately presents
              Tensordyne as a Series C company with $102 million raised across two rounds. The result is a real market
              signal, but not a clean consensus valuation bridge that justifies paying up without primary diligence.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV011
              - CV012
              - CV013
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV011
              - CV012
              - CV014
              - CV015
      - number: '8.2'
        title: 'Recommendation: track or research more until price and proof move together'
        blocks:
          - type: paragraph
            body: >-
              The public record is strong enough to justify continued attention and weak enough to reject a price-taking
              recommendation. EquityZen shows that existing shareholders can sell through private-market funds, which is
              helpful for liquidity signaling but does not finance company operations. Meanwhile, Yespress repeats
              management's $200 million-plus order expectation and planned Series D, while also emphasizing that the
              headline throughput and efficiency numbers remain company benchmarks pending independent validation. That
              combination produces the right investment stance for this chapter: recommendation = research more / track,
              confidence = low, risk rating = high, and valuation stance = only consider a step-up valuation after
              verified commercialization, benchmark, and cap-table proof arrive together.
            claimRefs:
              - CV005
              - CV006
              - CV011
              - CV012
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV014
      - number: '8.3'
        title: Bull, base, and bear cases all hinge on commercialization proof rather than narrative
        blocks:
          - type: paragraph
            body: >-
              The scenario spread is wide because execution and underwriting evidence are still decoupled. On the
              constructive side, the theCUBE interview says the chip has entered production and systems are expected to
              go live before year-end, while partner-sourced Stash coverage shows a buyer narrative centered on
              data-center operators that need more processing power without a facility expansion. On the constraining
              side, Levels.fyi and LeadIQ provide only rough operating-scale proxies rather than the seller-side
              economics needed for a true model. As a result, a bull case can only be justified if order interest turns
              into paid deployments and independent benchmarks validate the claimed performance edge; otherwise the
              range collapses quickly toward the older lower valuation reference.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exit readiness is still secondary-market visibility, not public-company readiness
        blocks:
          - type: paragraph
            body: >-
              The visible capital-markets path in the assigned pool is private and secondary, not a documented public
              listing process. Forge and EquityZen both frame Tensordyne as a pre-IPO company with active private-market
              references, while Forge's round table exposes some preference terms but not the full stack that would
              determine dilution, downside protection, or how a new investor sits relative to existing holders. That
              means the last diligence mile is unusually important: before underwriting a primary check, investors need
              the signed round documents, current cap table, booked backlog, paid-customer conversion data, gross-margin
              evidence, and independent performance proof. Until then, the practical exit path remains a wait for better
              proof, not a confident hold-to-IPO plan.
            claimRefs:
              - CV005
              - CV012
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Current call: research more / track'
            body: >-
              Tensordyne has enough evidence to stay on the list and not enough evidence to justify paying at a
              late-2026 growth-round mark without primary confirmation of revenue quality, customer conversion, and
              capital-structure terms.
            calloutType: recommendation
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV015
          - type: callout
            title: The biggest valuation risk is proof slippage, not lack of narrative
            body: >-
              If the claimed performance edge fails independent validation or if the next round adds structure-heavy
              terms, the public range can compress back toward the older lower reference point very quickly.
            calloutType: risk
            claimRefs:
              - CV006
              - CV012
              - CV013
              - CV014
