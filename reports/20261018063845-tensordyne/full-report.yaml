          - type: paragraph
            body: >-
              Tensordyne discloses performance and buyer-economics claims, but not seller-side pricing. The launch
              release cites up to $33 million more annual revenue per rack and more than 1,000 tokens per second per
              user within a single rack, yet it does not publish a rack price, pod price, contract length, maintenance
              fee, or discount structure. The independent Yespress write-up is useful precisely because it is skeptical:
              it says the 13x throughput and 17x efficiency figures are vendor benchmarks and that independent testing
              is still pending. For diligence, this means the current public record supports the shape of the
