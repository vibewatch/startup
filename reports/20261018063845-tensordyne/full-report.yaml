      - number: '6.3'
        title: Retention, renewal, and concentration remain major diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Durability is the weakest part of the public customer record. None of the reviewed sources disclose
              customer count, NRR, GRR, renewal rates, contract length, churn, cohort behavior, or top-customer revenue
              share. That absence matters because Tensordyne's disclosed customer base appears concentrated in a small
              number of sophisticated infrastructure buyers, and adoption still depends on software readiness,
              benchmarking results, and conversion from interest into live clusters. The Register's warning that
              software can make or break a chipmaker is especially relevant here: without verified production references
              or retention metrics, investors should treat the current customer story as promising but unproven.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Narrow pipeline, potentially large ACVs
            body: >-
              The target buyer set is small but economically meaningful, so a few successful conversions could move
              revenue faster than a broad SMB motion.
            calloutType: insight
            claimRefs:
              - CU001
              - CU011
          - type: callout
            title: Named proof stops short of production references
            body: >-
              Publicly named customers and prospects support interest and evaluation, but not yet a verified list of
              production deployments, renewals, or expansion cohorts.
            calloutType: risk
            claimRefs:
              - CU002
              - CU006
              - CU007
              - CU013
          - type: callout
            title: Ask for cohort-style pipeline and renewal evidence
            body: >-
              Management should provide named deployment stages, conversion rates, contract values, and top-customer
              concentration so the current forecast can be tied to real commercial durability.
            calloutType: recommendation
