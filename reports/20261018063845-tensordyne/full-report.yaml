      - number: '2.2'
        title: Sizing lenses and near-term demand signals
        blocks:
          - type: paragraph
            body: >-
              The chapter cannot support a classic public TAM/SAM/SOM stack from the assigned evidence, so the usable
              sizing work has to stay bottom-up. The clearest numerical demand signal is IndexBox's report that
              Tensordyne expects more than $200 million in future demand and already has over a dozen letters of intent
              for beta evaluations. The same report names Cirrascale and BlueSky Compute as interested parties, which is
              more decision-relevant than a generic "large AI market" statement because it identifies concrete buyer
              classes. TweakTown adds the deployment unit: a TDN72 rack with 288 chips, 608 PFLOPS of FP8 compute, and a
              120kW air-cooled envelope. Together these datapoints show that Tensordyne is trying to sell rack-scale
              capacity into buyers that measure value in tokens per watt, facility footprint, and deployable system
              density. What they do not provide is an independent denominator for market share, so the current evidence
              supports adoption-pipeline sizing rather than externally benchmarked market-size claims.
