  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer definition
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence in the assigned pool points to a tight market boundary rather than a broad
              semiconductor or AI-software category. LeadIQ describes Tensordyne as an "integrated platform for
              multimodal GenAI inference intended for hyperscale and Neo Cloud data centers," while IndexBox and
              TweakTown both frame Napier as inference infrastructure aimed at speed, power efficiency, and rack
              density. That means the relevant comparison set is rack-scale inference deployment for large-model
              serving, not the full AI training-GPU market, general enterprise software, or the company's earlier
              automotive-vision heritage as Recogni. YesPress further reinforces a system-level boundary by describing
              chips, compute trays, interconnect, and software as one offering. Buyer evidence is also consistent: the
              public messaging targets AI clouds, hyperscalers, and data-center operators that care about power, floor
              space, and throughput at rack scale. For diligence, that narrower framing matters because a generic "AI
              hardware TAM" would overstate current addressability and blur who actually controls the initial budget.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
