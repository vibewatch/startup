  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: System scope and customer workflow
        blocks:
          - type: paragraph
            body: >-
              The strongest product signal is that Tensordyne is not presenting itself as a single accelerator component
              sale. Across both official hiring posts, the company describes a tightly integrated inference platform
              that spans silicon, AI math, networking, memory architecture, and the software teams needed to optimize
              customer models on top of it. Third-party descriptions are directionally consistent: LeadIQ calls
              Tensordyne an integrated multimodal GenAI inference platform for hyperscale and neo-cloud data centers,
              while YesPress describes the offer as chips, compute trays, interconnect, and software sold together. The
              customer workflow also looks unusually hands-on for this stage: profiling workloads, benchmarking
              performance, bringing up models, running PoCs, integrating with customer environments, and then turning
              repeated learnings into reusable tooling and documentation. That points to an initial GTM motion built
              around technical co-development and evaluation rigor rather than a plug-and-play hardware sale.
            claimRefs:
