        title: Cost structure proxies point to capital intensity before revenue quality is visible
        blocks:
          - type: paragraph
            body: >-
              The public data points to a capital-intensive hardware ramp. Tensordyne says Napier has taped out and is
              in production at TSMC's 3nm node, which implies expensive silicon, packaging, and supply-chain commitments
              even before large customer shipments are visible in the record. Levels reports median software-engineer
              compensation of $97,959, and LeadIQ places the company in a broad 51-200 employee band, which together
              provide only a rough operating-expense floor. EquityZen adds an important financing distinction: secondary
              liquidity for existing holders may exist, but those sales do not fund the company. With the company also
              signaling an anticipated Series D, public evidence suggests capital needs are rising ahead of any
              disclosed recurring revenue or margin proof.
