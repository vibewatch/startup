      - number: '2.3'
        title: Adoption drivers, constraints, and unresolved gaps
        blocks:
          - type: paragraph
            body: >-
              The buying logic in the retained evidence is coherent but still pre-launch. Stash Media's partner-sourced
              coverage says Tensordyne is speaking to data-center owners that need more processing power without
              increasing facility footprint, and TweakTown says the company is aiming to lower switching friction by
              supporting Hugging Face-hosted models, PyTorch, Triton, and a custom Python SDK. Those are meaningful
              adoption drivers because they link hardware performance to an actual migration path for platform teams,
              not just to chip-level benchmarks. The constraints are just as important: TweakTown explicitly warns that
              the headline throughput and efficiency deltas are still pre-launch vendor claims, with beta systems
              planned for Q1 2027 and broader shipments only by the end of Q2 2027. Additional public datapoints such as
              salary and employee-count proxies help show Tensordyne is a mid-sized operator, but they are not
              substitutes for signed deployments, public pricing, or independent market studies. As a result, this
              chapter can justify market relevance and buyer logic, but not a fully benchmarked TAM, SAM, or conversion
              forecast.
