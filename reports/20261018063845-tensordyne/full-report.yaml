  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual exposure remains concentrated in high-impact risks whose mitigations are only partial or still open in
      public evidence.
    data:
      columns:
        - label: Likelihood
          note: Analytical ranking from the assigned evidence.
        - label: Impact
          note: How badly the risk could damage underwriting if it lands.
        - label: Mitigation maturity
          note: Whether public evidence shows a credible mitigation package.
      rows:
        - label: Benchmark substantiation
          note: Independent validation is still pending.
          values:
            - label: High
              tone: critical
              note: Public claims still outpace independently validated systems.
            - label: High
              tone: critical
              note: If the numbers do not hold up, the core value proposition breaks.
            - label: Partial
              tone: high
              note: Beta timing is visible, but proof is not yet public.
        - label: Shipment timing
          note: Customer shipment proof is still ahead of the present public record.
          values:
            - label: Medium-high
              tone: high
              note: Tape-out is real, but shipments remain future-dated.
            - label: High
              tone: high
              note: A material slip would postpone revenue and customer proof together.
            - label: Partial
              tone: medium
              note: Milestones are disclosed, but no execution dashboard is public.
        - label: Partner stack concentration
          note: Manufacturing, silicon, networking, and pod architecture touch a narrow set of external parties.
          values:
            - label: Medium-high
              tone: high
              note: Multiple dependencies must all execute for the product story to hold.
            - label: High
              tone: critical
              note: A miss by one key partner can delay the whole system.
            - label: Partial
              tone: medium
              note: Named counterparties help, but redundancy is not visible.
        - label: Capital intensity
          note: Scale-up still appears tied to external funding.
          values:
            - label: Medium
              tone: medium
              note: Current fundraising support is visible, but self-funded scale is not.
            - label: High
              tone: high
              note: A financing shortfall could slow production and go-to-market together.
            - label: Partial
              tone: medium
              note: Investor backing is a mitigation, but not a substitute for operating cash proof.
        - label: Buyer concentration
          note: Visible demand still sits with a narrow infrastructure cohort.
          values:
            - label: Medium-high
              tone: high
              note: Named interested parties are few and broad buyer diversity is not public.
            - label: High
              tone: high
              note: Missing or delayed design wins would hit proof and pricing power early.
            - label: Open
              tone: high
              note: No public concentration data or diversified deployment references are in the pool.
        - label: Compliance visibility
          note: Trust, privacy, incident, and export-control diligence remain document requests, not cleared facts.
          values:
            - label: Medium
              tone: medium
              note: The risk may not crystallize, but buyers often ask for it early.
            - label: Medium-high
              tone: high
              note: A missing dossier can block enterprise procurement even if the product works.
            - label: Open
              tone: high
              note: The assigned pool does not surface a complete public mitigation package.
    approximationNotes: >-
      Cells summarize impact and mitigation maturity from the assigned pool; tones are analytical rankings rather than
      externally audited risk scores.
    claimRefs:
      - CR001
      - CR003
      - CR005
      - CR006
      - CR007
      - CR008
      - CR011
      - CR012
      - CR013
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The valuation call starts with real private-market references, then runs through proof quality and
      capital-structure gaps before landing on a track / research-more recommendation.
    data:
      nodes:
        - id: private-market-references
          label: Private-market references
          detail: Forge publishes a $569.02M Aug-2025 mark and a $1.34B Jun-2026 mark.
        - id: secondary-liquidity
          label: Secondary liquidity signal
          detail: >-
            EquityZen shows seller-driven private-market access, which helps price discovery but does not finance
            operations.
        - id: commercialization-proof
          label: Commercialization proof
          detail: Production and go-live timing are visible, but paid-customer conversion is not.
        - id: validation-gap
          label: Validation gap
          detail: Yespress says independent benchmark confirmation is still pending.
        - id: capital-structure-gap
          label: Capital-structure gap
          detail: Preference snippets are visible on Forge, but the full current stack is not.
        - id: recommendation
          label: Recommendation
          detail: Track / research more; only revisit aggressive pricing after proof and terms improve together.
      edges:
        - from: private-market-references
          to: secondary-liquidity
          label: Informs
        - from: secondary-liquidity
          to: commercialization-proof
          label: Still needs
        - from: commercialization-proof
          to: validation-gap
          label: Depends on
        - from: validation-gap
          to: capital-structure-gap
          label: And
        - from: capital-structure-gap
          to: recommendation
          label: Drives
    approximationNotes: The chart encodes decision logic, not a priced DCF or comparable-multiple model.
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV006
      - CV011
      - CV012
      - CV014
      - CV015
