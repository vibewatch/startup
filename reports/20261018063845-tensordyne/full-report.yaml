chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and product stance
        blocks:
          - type: paragraph
            body: >-
              Tensordyne is the post-September-2025 name for Recogni, which official and independent sources trace back
              to a 2017 founding. The company now presents itself as a private AI-inference infrastructure vendor rather
              than its earlier computer-vision positioning, with official and third-party descriptions converging on a
              California base plus German engineering presence. The product thesis is not a point chip but an integrated
              inference stack—custom silicon, interconnect, and software—built around logarithmic math for hyperscale,
              neo-cloud, and enterprise data-center workloads. Later chapters should reuse this identity carefully: the
              company is clearly real and late-stage, but the retained pool still leaves valuation, revenue, and
              customer scale unproven.
