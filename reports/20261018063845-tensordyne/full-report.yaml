            body: >-
              The strongest public demand signals are still pre-production. Tensordyne says it has built a pipeline of
              hyperscaler, neocloud, and sovereign AI operators, including more than a dozen LOIs tied to demos and
              early access, and it frames those opportunities as more than $200 million of forecast system demand.
              Independent reporting partly corroborates market interest by naming Cirrascale and BlueSky Compute as
              prospective deployers, and event coverage says production is underway with systems targeted to go live
              before year-end. Even so, the public record does not show signed order values, deployed production sites,
              utilization metrics, or customer benchmarks that would turn this from pipeline evidence into durable
              adoption proof.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
