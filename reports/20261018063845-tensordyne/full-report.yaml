            body: >-
              Management visibility is concentrated around a small founding and executive bench. Independent and
              marketplace sources consistently place R.K. Anand and Gilles Backhus in product and AI leadership roles,
              while Marc Bolitho is the externally visible chief executive credited with the 2022 leadership transition
              and the later rebrand. The cleanest governance datapoint in the assigned pool is from the 2024 financing
              announcement, which identifies Celesta Capital's Sriram Viswanathan as board chair at the time. That is
              enough to establish investor governance influence, but not enough to reconstruct a current full board
