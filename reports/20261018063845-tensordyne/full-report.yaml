              operating architecture. Official materials point to a stack that starts with purpose-built silicon and new
              AI math, then extends upward into compiler, runtime, kernel, SDK, inference server, KV-cache, and adjacent
              serving systems. The customer-facing team is expected to validate models and workloads against concrete
              deployment KPIs such as throughput, tokens per second per user, TTFT, memory utilization, power
