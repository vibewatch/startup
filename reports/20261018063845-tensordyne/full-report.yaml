figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      The public record shows a clear march from Recogni-era founding and financing to a 2025 rebrand and a 2026 Napier
      commercialization push.
    data:
      items:
        - year: 2017
          label: Recogni is founded
          detail: Official and independent sources converge on a 2017 founding under the Recogni name.
          tone: neutral
        - year: 2019
          label: First funding arrives
          detail: The 2024 company financing release says the business received its first round of funding in 2019.
          tone: neutral
        - year: 2022
          label: Marc Bolitho becomes CEO
          detail: >-
            Independent coverage says Bolitho took the CEO role in 2022, preceding the rebrand and current
            commercialization push.
          tone: neutral
        - date: '2024-02-20'
          label: $102M Series C closes
          detail: >-
            Recogni announced a $102 million Series C co-led by Celesta Capital and GreatPoint Ventures, with HSBC debt
            support.
          tone: positive
        - date: '2025-09-08'
          label: Recogni becomes Tensordyne
          detail: Official retained materials state that Recogni became Tensordyne as of September 8, 2025.
          tone: positive
        - date: '2026-06-15'
          label: Napier is unveiled
          detail: Independent coverage dates the Napier announcement to June 15, 2026 and says tape-out was complete at TSMC.
          tone: positive
        - date: '2026-07-07'
          label: Brand narrative targets data-center operators
          detail: >-
            A July 2026 campaign positioned Tensordyne around power-efficient compute for footprint-constrained
            data-center owners.
          tone: warning
        - date: '2026-09-03'
          label: Napier whitepaper published
          detail: >-
            The official Napier whitepaper consolidated the system architecture and commercialization narrative on
            Tensordyne's site.
          tone: positive
    claimRefs:
