        title: Differentiation is inference-first, but incumbency still matters
        blocks:
          - type: paragraph
            body: |-
              Tensordyne's differentiation claim is internally consistent across the official site
              and investor interview: it sells a purpose-built inference stack that ties logarithmic
              math, custom silicon, scale-up networking, and software compatibility into one offer.
              That supports a credible product story for operators who care about throughput, watts
              per token, and rack density more than training throughput. The harder competitive fact
              is distribution power. The same Celesta interview that argues inference lowers barriers
              also admits that training incumbents retain strong moats and that CUDA remains a high
              wall. In other words, Tensordyne's wedge is technical and economic, but the incumbent's
              moat is installed base, tooling, and buyer comfort.
