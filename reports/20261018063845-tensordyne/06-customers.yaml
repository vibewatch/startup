        - More than $200M
        - "2026-06-15"
        - Company press release and YesPress profile
        - Medium
        - Suggests the pipeline could be commercially meaningful if it converts
        - Forecast demand is not contracted revenue or backlog
      - - First systems targeted to go live
        - Before year-end
        - 2026 event coverage
        - theCube interview summaries
        - Medium
        - Implies near-term beta or initial deployment planning
        - No named site, customer, uptime, or utilization proof
      - - Broad commercial release timing
        - Q2 or Q3 2027
        - "2026-06-19"
        - The Register
        - Medium
        - Independent coverage frames broad shipment as still ahead
        - No shipment backlog, acceptance criteria, or install base disclosed
    notes: >-
      Pipeline and timing data mix company-issued signals with independent event
      coverage; none of these rows disclose a customer denominator, conversion
      rate, or booked-revenue bridge.
    claimRefs: [CU003, CU004, CU005, CU006, CU012]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / prospect
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Cirrascale Cloud Services
        - Neocloud provider
        - Introduce Napier to cloud customers seeking energy-efficient inference
        - Prospect / early commercial interest
        - Named external quote supports active evaluation
        - Quote appears in company-issued material, with no live deployment date
      - - BlueSky Compute
        - Neocloud provider
        - Evaluate ultra-efficient AI infrastructure at global scale
        - Prospect / planning
        - Named external quote supports relevance with AI infrastructure buyers
        - No benchmark result, contract value, or production reference disclosed
      - - Undisclosed hyperscaler, neocloud, and sovereign operators
