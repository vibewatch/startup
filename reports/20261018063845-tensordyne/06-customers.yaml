        - Demos, early access, benchmarking, and infrastructure planning
        - Evaluation / LOI stage
        - More than a dozen LOIs suggest breadth beyond the two named prospects
        - Counterparties are anonymous, so durability and concentration remain opaque
    notes: >-
      Partial enumeration of publicly named or described customer proof as of
