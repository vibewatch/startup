evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      A cap table or board-approved financing chronology covering 2024-2026, including any July 2025 round and debt
      facility details.
    whyItMatters: >-
      The retained public sources disagree on total capital raised, which affects runway, ownership dilution, and any
      valuation narrative.
    diligencePath: >-
      Request the latest cap table, financing memo, and debt schedule from management and lead investors before
      publishing a definitive funding total.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: Current valuation, revenue/run-rate, paying-customer count, deployment count, and verified headcount.
    whyItMatters: >-
      These are the cover metrics most likely to drive valuation and diligence judgment, but the assigned pool only
      provides directional or conflicting public signals.
    diligencePath: >-
      Request a current board deck or KPI sheet with valuation marks, revenue, customer deployments, and headcount by
      function.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: board-composition
    missingEvidence: A current board roster with committee structure and observer rights.
    whyItMatters: >-
      The chapter can identify a 2024 board chair, but not the full present governance structure or how investor
      oversight is distributed now.
    diligencePath: >-
      Request the current board list, committee charter, and any side-letter governance rights from counsel or
      management.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: public-market-sizing
    missingEvidence: >-
      Independent analyst, trade-association, or public-company disclosure that quantifies inference-system TAM, SAM, or
      SOM for Tensordyne's specific rack-scale niche.
    whyItMatters: >-
      Without an external denominator, current sizing remains a launch-pipeline view and cannot support market-share or
      long-term revenue penetration claims.
    diligencePath: >-
      Obtain analyst-market-data, hyperscaler capex segmentation, or public-company disclosures on inference-system
      spending and map them to Tensordyne's deployment boundary.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: customer-pipeline
    missingEvidence: >-
      Signed design wins, purchase commitments, or customer deployment case studies behind the reported $200M+ order
      expectation and 12+ LOIs.
    whyItMatters: Pipeline quality is currently management-guided, so conversion timing and pricing power remain uncertain.
    diligencePath: >-
      Request customer references, redacted LOIs or contracts, pilot success criteria, and expected deployment timelines
      from management.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: budget-owner-validation
    missingEvidence: >-
      Public procurement, budget, or implementation evidence showing which named buyer function actually owns spend for
      rack-scale inference deployments.
    whyItMatters: >-
      The chapter can infer likely budget owners, but buyer-journey certainty affects sales-cycle length and channel
      strategy.
    diligencePath: >-
      Collect procurement pages, customer implementation stories, or integrator documentation that names the purchasing
      team and deployment workflow.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-disclosure
    missingEvidence: >-
      Realized system pricing, contract structure, support terms, and customer discounting versus incumbent or hybrid
      alternatives.
    whyItMatters: >-
      Without commercial terms, the chapter can compare economic framing but cannot underwrite switching ROI or
      gross-margin durability.
    diligencePath: >-
      Request customer proposals or redacted quotes covering system price, support, deployment scope, and performance
      commitments.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: independent-benchmarks
    missingEvidence: >-
      Third-party benchmark data that tests Tensordyne's throughput, efficiency, and space claims against the named
      Nvidia and hybrid baselines.
    whyItMatters: >-
      The competitive wedge currently depends on vendor-authored comparisons, which is not enough to prove moat
      durability.
    diligencePath: >-
      Obtain lab validation, customer pilot data, or neutral analyst testing that reproduces the published benchmark
      setup.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP002
  - type: conflicting-data
    severity: minor
    topic: headquarters
    missingEvidence: Authoritative current company headquarters and legal-entity location disclosure.
    whyItMatters: >-
      Inconsistent company metadata is not central to the moat case, but it weakens confidence in third-party profile
      hygiene.
    diligencePath: >-
      Confirm the current HQ and entity footprint from corporate filings, the company, or a more authoritative business
      registry.
    relatedQuestionRefs:
      - QP006
  - type: private-evidence-only
    severity: blocking
    topic: pricing-transparency
    missingEvidence: >-
      Rack and pod price sheets, customer contract structure, realized ASP, discount policy, and support/maintenance
      terms.
    whyItMatters: >-
      Without actual commercial terms, demand claims cannot be converted into a revenue model or compared against buyer
      ROI claims.
    diligencePath: >-
      Request current customer proposals, signed order forms, and any standard commercial terms for pilots, beta
      deployments, and production racks.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: missing-unit-economics
    missingEvidence: Gross margin by product, BOM/yield assumptions, quarterly burn, cash on hand, debt facilities, and runway.
    whyItMatters: >-
      These are the minimum inputs needed to judge whether the company can finance manufacturing scale-up before durable
      revenue arrives.
    diligencePath: >-
      Request board-approved operating plan, manufacturing cost model, latest cash/burn bridge, and any lender or
      project-finance documentation.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: benchmark-risk
    missingEvidence: Independent benchmark results and customer deployment proof for throughput, efficiency, and per-rack economics.
    whyItMatters: The public investment case currently leans on vendor-authored performance and infrastructure-economics claims.
    diligencePath: >-
      Request third-party benchmark reports, customer pilot results, and signed deployment references that tie technical
      performance to commercial conversion.
    relatedQuestionRefs:
      - QI006
  - type: missing-source
    severity: material
    topic: independent-validation
    missingEvidence: >-
      Independent benchmark reports, customer beta results, or named deployment case studies that validate performance,
      efficiency, and scaling claims outside company-controlled material.
    whyItMatters: >-
      Without third-party validation, the differentiation story can inform diligence questions but cannot be treated as
      production-grade proof of product superiority.
    diligencePath: >-
      Request benchmark methodology, external evaluation reports, customer references, and post-bring-up performance
      readouts for Napier deployments.
    relatedQuestionRefs:
      - QE004
      - QE005
      - QE006
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Public documentation or auditable materials covering security, privacy, compliance, reliability, status, or
      quality-control practices for the platform.
    whyItMatters: >-
      Enterprise and infrastructure buyers need trust and operational controls alongside raw benchmark claims,
      especially before production rollout.
    diligencePath: >-
      Ask management for trust-center materials, certifications, SDLC and incident-response policies, uptime/status
      reporting, and customer security-review artifacts.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Public SDK, docs, repo, package, or release telemetry showing how external engineers actually interact with
      Tensordyne's stack.
    whyItMatters: >-
      Hiring intensity and salary data show technical ambition, but they do not prove a usable developer surface or a
      repeatable onboarding path for customers.
    diligencePath: >-
      Obtain developer documentation, release notes, API references, package artifacts, or customer enablement portals
      that demonstrate the software surface in practice.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE002
      - TE003
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: Customer count, NRR, GRR, churn, renewal cadence, and contract length by cohort.
    whyItMatters: >-
      Without durability metrics, it is impossible to judge whether early design wins convert into sticky recurring
      demand.
    diligencePath: >-
      Request cohort tables, renewal schedules, and at least three customer references with deployment age and expansion
      history.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: Named customer list with deployment stage, benchmark status, contract value, and production start date.
    whyItMatters: >-
      The current public record mixes named prospects with anonymous operators, so concentration and proof-of-production
      cannot be verified.
    diligencePath: Obtain a pipeline export or customer reference pack that separates prospect, pilot, beta, and production accounts.
    relatedQuestionRefs:
      - QU009
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: concentration-risk
    missingEvidence: Top-customer revenue share, channel mix, and dependence on any single hyperscaler, neocloud, or sovereign program.
    whyItMatters: >-
      A concentrated infrastructure-buyer mix can create sharp revenue volatility if one flagship account slips or
      churns.
    diligencePath: >-
      Ask management for customer concentration by pipeline stage and expected first-year revenue contribution from the
      top five accounts.
  - type: missing-source
    severity: material
    topic: benchmark-validation
    missingEvidence: Independent benchmark reports, customer beta results, and first production deployment metrics for Napier.
    whyItMatters: >-
      Without third-party validation, the central throughput, efficiency, and cost claims remain procurement-risky
      rather than underwritten operating facts.
    diligencePath: Request the benchmark methodology pack, customer beta references, and the first production deployment scorecards.
    relatedQuestionRefs:
      - QR001
      - QR002
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: A fuller legal and regulatory register covering export controls, IP, privacy, security, and any dispute history.
    whyItMatters: >-
      The visible public sample may miss country, customer, or IP constraints that would change both addressable demand
      and diligence cost.
    diligencePath: >-
      Collect counsel-backed export-control, sanctions, IP, and dispute materials and rebuild the risk register against
      those documents.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: security-compliance
    missingEvidence: >-
      Trust-center, incident-response, privacy, and certification materials appropriate for enterprise datacenter
      procurement.
    whyItMatters: >-
      Large buyers may block or delay deployment if operational security and compliance controls are not documented
      early.
    diligencePath: >-
      Request security program summaries, audit/certification evidence, privacy documentation, and customer-facing
      incident procedures.
    relatedQuestionRefs:
      - QR008
  - type: missing-source
    severity: material
    topic: commercial-proof
    missingEvidence: >-
      Signed customer contracts, deployment references, concentration data, and revenue conversion from interested
      parties to live systems.
    whyItMatters: >-
      Early buyer concentration and pre-shipment status can make the revenue curve highly sensitive to a small number of
      counterparties.
    diligencePath: >-
      Review customer pipeline by stage, signed design wins, expected deployment timing, and concentration by buyer
      class.
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Signed 2025-2026 financing documents, full cap table, and any SAFE, warrant, or side-letter obligations.
    whyItMatters: >-
      Without the current stack, a new investor cannot quantify dilution, downside protection, or where a new preferred
      share would sit.
    diligencePath: >-
      Request the latest cap-table package, stock purchase agreements, and board-approved financing summaries from
      management.
    relatedQuestionRefs:
      - QV005
  - type: private-evidence-only
    severity: blocking
    topic: commercial-conversion
    missingEvidence: Booked backlog, paid deployments, realized ASP, gross margin, and customer conversion from LOIs or pilots.
    whyItMatters: These are the core inputs that would turn a marketplace valuation reference into an underwritable investment case.
    diligencePath: >-
      Review sales pipeline by stage, signed orders, shipped systems, and gross-margin bridge with management and at
      least two customers.
    relatedQuestionRefs:
      - QV002
      - QV006
  - type: missing-source
    severity: material
    topic: independent-benchmark-validation
    missingEvidence: >-
      Third-party benchmarks or customer acceptance data validating Tensordyne's throughput, efficiency, and uptime
      claims.
    whyItMatters: >-
      The bull case depends on the performance edge being real in production rather than only in company-authored
      comparisons.
    diligencePath: >-
      Obtain lab reports, customer test results, and reference calls tied to the same system configuration cited in
      public materials.
    relatedQuestionRefs:
      - QV004
      - QV008
      - QV009
