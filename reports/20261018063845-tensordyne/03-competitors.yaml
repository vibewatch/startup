chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Tensordyne is positioning Napier against Nvidia-centered inference deployments as a
    full-system alternative built for generative-AI serving rather than training, but the
    public comparison set is still dominated by company-authored or partner-amplified claims.
    The competitive wedge is clear on power, networking, and stack compatibility; pricing,
    trust proof, and independent benchmark validation remain the largest holes.
sections:
  - id: "competitive-landscape"
    title: "The landscape is broader than a single chip rival"
    body: |-
      The assigned evidence frames Tensordyne less as a generic semiconductor startup and
      more as a system challenger to the way hyperscalers, neoclouds, and enterprise AI
      operators currently serve inference workloads. Its direct comparison target in public
      materials is Nvidia's GB300 NVL72, while the substitute set also includes hybrid
      Nvidia-plus-Groq deployments, internal build paths that stay on existing PyTorch and
      Triton stacks, and the company's own abandoned legacy-vision trajectory. That means
      buyers are not choosing between two isolated chips; they are choosing among rack-level
      architectures, migration friction, and how much new vendor risk they will accept to
      lower cost-per-token and datacenter footprint.
    claimRefs: ["CP001", "CP002", "CP007", "CP008", "CP009", "CP010", "CP015"]
    tableRefs: ["TP001"]
  - id: "differentiation-vs-lock-in"
    title: "Differentiation is inference-first, but incumbency still matters"
    body: |-
      Tensordyne's differentiation claim is internally consistent across the official site
      and investor interview: it sells a purpose-built inference stack that ties logarithmic
      math, custom silicon, scale-up networking, and software compatibility into one offer.
      That supports a credible product story for operators who care about throughput, watts
      per token, and rack density more than training throughput. The harder competitive fact
      is distribution power. The same Celesta interview that argues inference lowers barriers
      also admits that training incumbents retain strong moats and that CUDA remains a high
      wall. In other words, Tensordyne's wedge is technical and economic, but the incumbent's
      moat is installed base, tooling, and buyer comfort.
    claimRefs: ["CP003", "CP004", "CP005", "CP006", "CP007", "CP011"]
    tableRefs: ["TP002"]
    figureRefs: ["FP001"]
  - id: "commercial-proof-and-moat-risk"
    title: "Commercial proof is still thinner than the benchmark rhetoric"
    body: |-
      Public commercial evidence is the weakest part of the chapter. The company and outside
      profiles provide order expectations, production timing, and broad buyer categories, but
      not realized pricing, win rates, renewal data, or an independently validated benchmark
      pack against the incumbents it names. Even basic company metadata is not fully settled:
      third-party profiles disagree on headquarters labeling, and the public talent signal is
      limited to a single salary family on Levels.fyi. That does not invalidate the product
      thesis, but it does mean the moat case depends on future customer proof and validation
      rather than on already-demonstrated market power.
    claimRefs: ["CP008", "CP009", "CP010", "CP012", "CP013", "CP014"]
    tableRefs: ["TP003"]
