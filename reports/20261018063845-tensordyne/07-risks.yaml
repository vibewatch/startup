company:
  name: "Tensordyne"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    Tensordyne's biggest residual risks are still proof-of-performance, partner-stack
    execution, and capital-backed commercialization rather than any single known
    legal event. Public evidence shows real-system validation and customer shipment
    proof remain ahead of the company, while manufacturing, networking, and early
    buyer concentration all sit on a narrow set of external counterparties.
sections:
  - id: "substantiation-and-compliance"
    title: "Proof-of-performance and compliance visibility are the first thesis-breakers"
    body: |-
      The assigned pool does not show a company in crisis, but it does show a company
      whose public diligence case is still earlier than its headline performance claims.
      IEEE Spectrum says the Napier system's claimed power and throughput advantages
      over Nvidia rest on simulations and that real systems would not be around to
      validate those numbers until later in 2026. That matters because Tensordyne is
      selling a rack-scale datacenter system into sophisticated operators that will
      likely require reproducible benchmark packs, export-control clarity, IP comfort,
      and security/compliance diligence before committing meaningful production spend.
      The top legal/regulatory kill criterion is therefore not a known lawsuit; it is
      failure to convert marketing-grade claims into verifiable operating proof and a
      documented compliance dossier before customer procurement windows open.
    claimRefs: ["CR001", "CR002", "CR009", "CR013"]
    tableRefs: ["TR001"]
  - id: "operational-and-partner-execution"
    title: "Operational execution depends on a narrow manufacturing and systems stack"
    body: |-
      Tensordyne is attempting a hard systems problem: the official site itself calls
      building a datacenter inference platform from scratch and taking it to production
      "a monumental feat." Public materials show why. Napier depends on TSMC 3nm
      production, Broadcom on the silicon side, Juniper in networking, Intel CPUs in
      the pod architecture, and the company's own unproven claims that dense air-cooled
      racks can meet customer expectations on reliability, thermals, and performance.
      Leadership depth in finance, operations, hardware, software, and sales is a real
      mitigation, but it is not the same thing as customer-proven field reliability.
      The operational kill criterion is any visible slippage in beta availability,
      shipment timing, or partner readiness that pushes commercial proof materially to
      the right.
    claimRefs: ["CR001", "CR003", "CR004", "CR005", "CR010"]
    tableRefs: ["TR002", "TR003"]
    figureRefs: ["FR001"]
  - id: "capital-talent-and-commercial-concentration"
    title: "Capital intensity and narrow buyer concentration keep residual exposure high"
    body: |-
      The business model still looks capital hungry and commercially concentrated from
      public evidence. YesPress says Tensordyne has raised roughly $176 million and is
      preparing a Series D, while the official site frames influential venture and
      private-equity backing as enabling production. EquityZen reinforces that outside
      investors face private-market price discovery rather than public liquidity, and
      the buyer set that appears in public evidence is still concentrated in
      hyperscalers, neoclouds, AI infrastructure providers, and a short list of named
      interested parties. Workforce visibility is also incomplete: Hugging Face lists
      36 team members, LeadIQ shows a broader 51-200 employee band, and Levels.fyi
      provides only a single salary family. None of that disproves execution, but it
      does mean investors should monitor financing cadence, customer diversification,
      and leadership hiring before underwriting a clean scale-up.
    claimRefs: ["CR006", "CR007", "CR008", "CR011", "CR012", "CR013"]
