company:
  name: "Tensordyne"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Tensordyne is the renamed continuation of Recogni, a private AI-infrastructure company
    building logarithmic-math-based inference systems for large data centers from a
    California-and-Germany operating footprint. The strongest verified anchors are the
    September 2025 rebrand, the February 2024 $102 million Series C, and the 2026 Napier
    launch; total capital raised, valuation, headcount, revenue, and customer counts remain
    materially under-documented in the assigned pool.
sections:
  - id: "identity-and-positioning"
    title: "Identity, footprint, and product stance"
    body: >-
      Tensordyne is the post-September-2025 name for Recogni, which official and independent
      sources trace back to a 2017 founding. The company now presents itself as a private
      AI-inference infrastructure vendor rather than its earlier computer-vision positioning,
      with official and third-party descriptions converging on a California base plus German
      engineering presence. The product thesis is not a point chip but an integrated
      inference stack—custom silicon, interconnect, and software—built around logarithmic
      math for hyperscale, neo-cloud, and enterprise data-center workloads. Later chapters
      should reuse this identity carefully: the company is clearly real and late-stage, but
      the retained pool still leaves valuation, revenue, and customer scale unproven.
    claimRefs: ["CO001", "CO002", "CO005", "CO006", "CO007"]
    tableRefs: ["TO001"]
  - id: "leadership-and-governance"
    title: "Leadership, governance, and key-person concentration"
    body: >-
      Management visibility is concentrated around a small founding and executive bench.
      Independent and marketplace sources consistently place R.K. Anand and Gilles Backhus
      in product and AI leadership roles, while Marc Bolitho is the externally visible chief
      executive credited with the 2022 leadership transition and the later rebrand. The
      cleanest governance datapoint in the assigned pool is from the 2024 financing
      announcement, which identifies Celesta Capital's Sriram Viswanathan as board chair at
      the time. That is enough to establish investor governance influence, but not enough to
      reconstruct a current full board roster, so diligence should treat founder/executive
      concentration as a real dependency rather than assume broad institutional governance.
    claimRefs: ["CO003", "CO004", "CO008", "CO013"]
    tableRefs: ["TO002"]
  - id: "capital-base-and-stakeholders"
    title: "Funding history, stakeholders, and what scale is actually supportable"
    body: >-
      The company has one clearly verified financing anchor and several weaker scale signals.
      Officially, Recogni closed a $102 million Series C in February 2024 with named equity
      investors and HSBC debt support. Independent coverage later described roughly $176
      million raised with a Series D being prepared, while a separate profile site reported
      $211 million raised and a July 2025 round. Because those cumulative totals do not
      reconcile from the retained evidence set, they should not be treated as settled cover
      facts. The same caution applies to operational scale: a 150-person description and a
      thin salary footprint are directional signals, not a verified headcount, revenue, or
      customer base.
    claimRefs: ["CO009", "CO010", "CO011", "CO012", "CO013", "CO016"]
    tableRefs: ["TO003"]
  - id: "milestones-and-near-term-readthrough"
    title: "Milestones and near-term readthrough"
    body: >-
      The milestone pattern is coherent even where current scale metrics are not. The company
      moved from Recogni-era founding and first financing into a 2025 rebrand, then spent
      2026 publicizing the Napier system, production readiness, and a brand narrative aimed
      squarely at data-center operators constrained by power and footprint. That narrative is
      commercially relevant, but investors should separate storytelling from proof: public
      interviews and marketing materials show increasing confidence, while independent
      commentary still frames the headline performance numbers as vendor benchmarks awaiting
      outside validation. In short, the execution tempo is clear; the revenue and deployment
      proof points are not.
    claimRefs: ["CO002", "CO007", "CO010", "CO012", "CO014", "CO015", "CO016"]
    figureRefs: ["FO001"]
