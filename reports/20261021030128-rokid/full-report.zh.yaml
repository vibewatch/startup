              生态，但留存来源没有说明软件是单独定价、捆绑在硬件中，还是通过订阅或服务变现。 众筹提供了最清晰的公开需求信号：独立报道记录了 14 天内超过 US$2 million 的金额，Rokid
              澳大利亚网站随后又报告称， 45 天内有超过 5,000 名支持者、筹得超过 US$3.6 million。这些金额是活动承诺或所得，不是经审计的确认收入、ARR 或经常性需求。 公司声称活跃用户超过
