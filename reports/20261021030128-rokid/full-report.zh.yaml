      - number: '3.2'
        title: 能力、定价与分销
        blocks:
          - type: paragraph
            body: >-
              Rokid 最鲜明的产品差异，是把轻量显示屏和模型选择结合起来。公司材料描述了一款 49-gram 波导产品，支持翻译、导航、 提词、拍摄和多个助手；Wareable 则称，38.5-gram 的无屏 Style
              可在多个 AI 模型间切换，录制时间也长于 Meta 当前硬件。 公开价格覆盖创作者获客优惠（免费或 $199）、$259 的促销底价、$299 的 Style 标价，以及 $599 或 $698
              的带显示屏眼镜配置。 这些是标价或促销价，不是实际平均售价。分销证据指向电商、眼科合作伙伴、欧洲本地零售、开发者工具和创作者种子计划。
              这带来了多条市场路径，但来源池没有渠道生产率、售罄率、折扣深度、支持成本或合同证据，无法据此比较其与 Meta 或其他既有厂商的分销能力。
