            body: >-
              公开出货领先不能替代经济性。MIXED 指出，引用的 41% 份额只适用于带显示屏 AI 眼镜，而无屏产品占全部 AI 眼镜出货量的 96%； 它还发现没有公开的 Counterpoint
              表格、总出货量、收入数字或第二名排名。创作者促销价、赠送设备和第二副折扣表明公司在市场 推广上投入，但没有揭示售罄或贡献利润率。如果承诺的控制措施实施后隐私事件仍复发、重要合作伙伴退出、现场故障或
              退货率超过管理层目标，或者经核实的毛利率和现金需求无法支撑硬件继续扩张，投资论点就应失效。
            claimRefs:
              - CR006
              - CR007
              - CR010
              - CR011
              - CR016
      - number: '7.5'
        title: 展示
        blocks:
          - type: callout
            title: 隐私回应不是预防证明
            body: Rokid 的清理、配件下架行动和计划中的技术控制都是相关缓解措施，但投资信心应建立在重复事件数据和独立测试上， 不能只依赖政策声明。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资决策与价格纪律
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，合适的结论是继续跟踪并深入研究，信心为低至中等，风险高。Rokid 的商业化案例有一定可信度：公司材料描述 已量产 11 代眼镜、覆盖 100
              多个国家、拥有庞大活跃用户群、存在众筹需求并声称在品类中领先。这些信号证明产品活跃， 但不等于可投资的经济性，也没有独立验证收入、毛利率、营运资本需求、保修成本、可用现金或留存率。
              因此，价格纪律应主导公司质量评估。在将当前证券价格和完全摊薄资本结构与经审计经营结果、下行保护和可信退出路径进行检验前， 不能支持买入决策。隐私争议还带来治理和采用风险，应计入投资判断，而不能当作边缘的传播问题。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV011
              - CV013
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV008
              - CV010
              - CV013
              - CV015
      - number: '8.2'
        title: 融资背景与可比公司局限
        blocks:
          - type: paragraph
            body: >-
              指定来源池中最新的估值证据属于历史记录，并非当前估值：Multiples 记录了 2024 年 1 月 Series C 的 $1 billion 估值， SiliconANGLE 则报道 2023 年 11 月
              Series C 募得 $112 million，并按 $1 billion 估值 Rokid。数据库对累计融资的描述 也彼此矛盾：一处称十二轮合计 $643 million，另一处在某轮叙述中称累计融资超过
              $228 million。两者都不是今天可用的现金。 指定来源没有披露 2026 年融资价格、完全摊薄股数、清算优先权、债务、二级市场估值、经审计收入或 EBITDA。 Multiples
              列出的可比公司来自机器人和自动化行业，但它们的商业模式并不是消费级 AI-AR 眼镜的直接替代品，页面也没有给出 Rokid 的收入分母。这些记录可作参考点，却不足以支撑基于倍数的估值。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV011
              - CV013
              - CV016
      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              情景分析应以里程碑为基础，因为给出数值股权区间会制造公开记录无法支持的精确感。乐观情景下，如果出货领先得到独立验证， 众筹需求转化为有利润的售罄，且国际增长经过审计，就有理由重新评估相对于陈旧 $1
              billion 参考值的溢价。 基准情景只把该估值视为谈判上限，等待经审计收入、利润率、现金和资本结构。悲观情景由售罄疲弱、硬件经济性差、
              隐私导致渠道受阻、上市证据延迟，或惩罚性优先权与稀释条款触发；在这些条件下，正确的公开证据价值不是编造一个更低数字， 而是不进行交易。在缺失分母补齐前，概率信号仍只能定性判断。
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV007
              - CV011
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 退出准备、尽调要求与论点失效
        blocks:
          - type: paragraph
            body: >-
              BigGo 报道称，公司为准备 IPO 进行了重组，并将 2026 年香港上市作为目标窗口，但指定证据没有交易所申报或招股书。
              因此，退出准备尚未核实。在进行投资判断前，应取得经审计财务报表，按产品和地域拆分的月度出货与售罄，扣除退货和保修成本后的毛利率，渠道库存，客户队列留存，当前现金和债务，完全摊薄股权结构表，优先权和反稀释条款，
              以及任何上市材料草稿。确认任何被引用估值对应的发行方和证券。若历史融资记录无法对账、无法证明规模化正贡献利润率、 出现实质性隐私或监管限制、IPO
              在没有足够跑道的情况下反复延迟，或即使经营达标也有阻碍目标回报的条款，投资论点就会失效。
            claimRefs:
              - CV003
              - CV004
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.5'
        title: 展示
        blocks:
          - type: callout
            title: 对价格敏感的结论
            body: 继续跟踪 Rokid，但在当前证券条款和经审计经营经济性足以支撑目标回报前，不要把产品热情转化为买入建议。
            calloutType: recommendation
            claimRefs:
              - CV013
              - CV015
              - CV016
          - type: callout
            title: 历史融资不等于流动性
            body: 报道中的累计融资额不能视为可用现金，指定数据库还包含需要对账的相互矛盾的累计总额。
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
