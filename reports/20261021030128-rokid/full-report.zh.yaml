      - number: '1.4'
        title: 估值证据、品类位置与信任风险
        blocks:
          - type: paragraph
            body: >-
              留存证据中的 2025 年 9 月公司文章和 2026 年 6 月第三方报道都提到约 $1 billion 的估值，但两者都没有给出融资日期、 轮次条款、投后基础、股份数、债务明细或投资者名单。2026 年 9
              月的一份公司公告还转述 Counterpoint 的排名，称其在 带显示屏 AR 和 AI 眼镜细分市场的出货份额为 41%。MIXED 提醒，无屏型号占全部 AI 眼镜出货量的 96%，而底层细分市场表、
              出货量总数和竞争者排名并未公开。另据 BigGo 报道，隐蔽录制引发反弹，Rokid 于 6 月 8 日作出清理回应。综合来看，
              这些事实支持产品具有相关性，但不足以得出广义市场领先或融资结论；隐私控制和资本结构仍是尽调核心问题。
            claimRefs:
              - CO007
              - CO008
              - CO011
              - CO012
              - CO013
              - CO014
      - number: '1.5'
        title: 展示
        blocks:
          - type: callout
            title: 隐私治理是经营问题，不是假设风险
            body: BigGo 报道称，Rokid 社区内出现了隐蔽录制内容，随后公司清理了相关内容并作出技术治理回应。在把消费级摄像头视为可无摩擦采用之前，尽调应测试指示灯的防篡改能力、内容审核控制、事件升级机制和区域隐私合规。
            calloutType: risk
            claimRefs:
              - CO013
              - CO014
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              可投资市场应限定为普通眼镜形态的智能眼镜，再拆分为无屏 AI 眼镜和带显示屏 AR/AI 眼镜。更宽泛的品类还包括消费级拍摄、音频、助手、翻译、导航、提词和企业免手操作工作流；不能自动把笨重的 XR
              头显、通用智能手机或所有空间计算支出算进去。这一边界很重要：无屏产品占 2026 年上半年 AI 眼镜出货量的 96%，而 Rokid 所称的 41%
              领先只适用于更小的带显示屏细分市场。智能手机、耳机、相机、智能手表、手持扫描器和现有远程协助流程仍是替代品。因此，估值案例需要按细分市场拆解的采用和收入证据，不能直接把广义可穿戴计算预测套到 Rokid 身上。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM010
              - CM014
              - CM015
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              现有规模数据只能支持方向性增长判断，不能直接拼成 TAM/SAM/SOM。MarketsandMarkets 预计全球智能眼镜收入将从 2025 年的 $1.2237 billion 增至 2030 年的
              $4.1293 billion；另一份报告则称 2025 年全球智能眼镜销量为 700 万副。增长估计也分别对应不同期间和品类：据报道，2026 年第一季度 AR 和无屏产品出货量同比增长 136% 和
              210%，而 2026 年上半年 AI 眼镜和 AR/AI 眼镜出货量同比增长 263% 和 449%。这些数字不可互换，也没有拆出 Rokid
              覆盖的地域、价格带、渠道经济性或可附加的软件收入。最可靠的结论是：该品类正从小基数扩张；自下而上的 SAM 和可实现 SOM 仍是尽调缺口。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM006
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM006
              - CM015
              - CM016
      - number: '2.3'
        title: 买方、用户与预算归属
        blocks:
          - type: paragraph
            body: >-
              Rokid 面向多种购买场景，而不是单一同质客户。消费者和创作者可以把无屏 AI 眼镜作为可选消费电子购买，$299 的 Style
              定位接近主流智能眼镜价格。旅行者和移动办公人士可能愿意为带显示屏的翻译、导航和提词付费，但这些功能必须足够频繁地
              替代手机或耳机，才能支撑更高价格。企业现场服务、工业、物流和医疗部署会把付款方转移到运营、IT、临床或创新预算，
              同时要求工作流集成、设备管理、安全审查以及可量化的人工或质量收益。由于来源未披露细分收入或采购转化率， 这些预算归属只是分析性推断，需要逐客户验证。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM014
              - CM016
      - number: '2.4'
        title: 采用驱动、约束与时点
        blocks:
          - type: paragraph
            body: >-
              需求驱动因素包括更轻的设计、更低的入门价、模型选择、处方支持、免手翻译和导航，以及 Rokid 称已达到 35,000 名成员的
              开发者生态。供应链成熟和更高的零部件良率可能压低成本；与泛消费新奇体验相比，工业和医疗工作流提供的任务级价值更清晰。 约束同样重要。Rokid CEO
              表示，行业尚未找到同时具备高频使用和强需求的场景；分析师则认为端侧性能、热管理、电池续航、 显示质量和成本控制仍未解决。2026 年的隐蔽录制争议又增加了信任和监管采用壁垒：即使出货增长强劲，指示灯可见性、
              社区治理、用户同意和企业隐私控制仍会影响渠道接受度。
            claimRefs:
              - CM002
              - CM011
              - CM012
              - CM013
              - CM016
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 品类领先不等于市场领先
            body: Rokid 所称的 41% 份额适用于带显示屏 AR 和 AI 眼镜，而无屏设备占 2026 年上半年 AI 眼镜出货量的 96%；已披露数字 不足以证明其在全部智能眼镜市场领先。
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM008
          - type: callout
            title: 采用仍缺少普适的日常场景
            body: 出货量快速增长并没有解决行业所承认的难题：找不到同时高频且不可或缺的工作流；隐私、电池、热管理、显示和成本约束 仍可能拖慢转化。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM013
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与替代品
        blocks:
          - type: paragraph
            body: >-
              竞争边界比品牌 AR 眼镜更宽。Rokid Glasses 面向带显示屏的翻译、导航、提词、视觉辅助和第一视角拍摄； Rokid Style 则向下延伸到无屏环境式眼镜。Wareable 称后一个品类目前由
              Meta 主导，因此 Meta 是现有证据中最明确的 直接竞争者。对于导航、翻译、通知、搜索和拍摄，智能手机和耳机仍是现状；企业买方也可以继续使用手持设备、单用途观影器
              或内部集成的工作流。大型平台拥有者很可能入场，因为 Rokid 自己公开将 Meta 的参与描述为推动品类建设。 现有来源不足以支持完整的竞争者名单、竞争者融资对比或超出 Rokid
              狭窄显示屏细分市场的份额表，因此这里只展示品类级替代方案， 不把它们包装成已核实的竞争者画像。
            claimRefs:
