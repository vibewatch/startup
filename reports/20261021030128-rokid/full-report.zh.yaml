      - number: '4.2'
        title: 利润结构与单位经济性缺口
        blocks:
          - type: paragraph
            body: >-
              实体智能眼镜销售让 Rokid 承担零部件、组装、库存、物流、退货、保修和售后服务成本。来源描述了光学显示屏、摄像头、处理器、
              处方适配和企业部署，但没有提供物料清单、净平均售价、渠道折扣、毛利率、退货率、保修准备金或服务成本。 因此，$299 的 Style 标价不能代表可靠的综合 ASP：Rokid
              还销售硬件和支持要求不同的带显示屏产品及工业产品。 众筹效率也不能换算成 CAC 或回收期，因为活动营销支出、平台费、履约成本、取消订单和后续复购都没有披露。
              正确的投资判断应把公开价格和活动总额视为需求及定位证据；管理层提供产品和渠道数据前，不对贡献利润率、销售效率和营运资本转换建模。
