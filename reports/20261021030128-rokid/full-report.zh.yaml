    approximationNotes: X 轴为序数：1 表示来源所称的无屏使用，5 表示视野内显示。Y 轴按公开价格分档：$299 或以下为 5，$599 为 3，$698 为 2，约 $800 为 1。促销价是独立观察值，不是独立产品；Meta 点位明确属于传闻。
    claimRefs:
      - CP001
      - CP005
      - CP006
      - CP008
      - CP009
  - id: FI001
    title: 收入到毛利的证据桥接
    type: flow
    summary: 公开证据覆盖需求和标价，但确认毛利所需的会计和成本环节仍未披露。
    data:
      nodes:
        - id: demand
          label: 消费者或企业需求
          detail: 众筹支持、活跃用户说法、产品发布和企业使用场景
        - id: order
          label: 订单或合同
          detail: 众筹认捐、零售购买或企业协议
        - id: billings
          label: 毛账单额或认捐价值
          detail: 可观察到公开活动总额和 US$299 标价
        - id: recognized-revenue
          label: 确认收入
          detail: 时点、取消、履约和收入确认均未披露
        - id: delivery-costs
          label: 产品与服务成本
          detail: 零部件、渠道费用、云使用、退货、保修和支持均未披露
        - id: gross-profit
          label: 毛利
          detail: 无法根据留存的公开证据计算
      edges:
        - from: demand
          to: order
        - from: order
          to: billings
        - from: billings
          to: recognized-revenue
        - from: recognized-revenue
          to: delivery-costs
        - from: delivery-costs
          to: gross-profit
    approximationNotes: 该序列是概念框架，不包含任何估算转化率、收入数值或利润率。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI009
      - CI010
      - CI013
      - CI016
  - id: FE001
    title: Rokid 产品架构图
    type: stack
    summary: 六个有证据支持的层级把感知硬件连接到客户和开发者体验，同时暴露出芯片组、光学、模型、云和支持方面的依赖。
    data:
      layers:
        - label: 客户体验
          items:
            - 翻译与导航
            - 第一视角拍摄
            - 远程协作
            - AI 检查
          detail: 使用场景因消费者、创作者、无障碍和工业工作流而异。
        - label: 应用与分发
          items:
            - Rokid AI App
            - Rokid AR App
            - Agent Store
            - AIUI Studio
          detail: 配置、内容传输、AI 服务激活、开发和智能体分发。
        - label: 操作系统与模型层
          items:
            - YodaOS
            - ChatGPT
            - Gemini
            - DeepSeek
            - Qwen
          detail: 公司材料将该平台定位为模型无关，但路由和数据治理细节不可得。
        - label: AI 与影像计算
          items:
            - Qualcomm AR1
            - Style 上的 NXP RT600
          detail: Style 的设计将高强度影像和 AI 任务与低功耗语音任务分开。
        - label: 光学与呈现
          items:
            - Micro-LED
            - 衍射光波导
            - 音频输出
            - 无显示屏 Style 版本
          detail: 产品组合同时支持视野内显示和环境式无屏交互。
        - label: 感知、镜架与电源
          items:
            - 第一视角摄像头
            - 麦克风
            - 处方镜片支持
            - 充电配件
          detail: 舒适度、电池续航、录制提示和组件耐久性需要独立验证。
    approximationNotes: 这是根据公开点名的组件拼出的功能栈，不是已披露的物料清单、网络图、安全架构或供应商地图。
    claimRefs:
      - CE002
      - CE005
      - CE006
      - CE013
      - CE016
  - id: FU001
    title: 有证据支持的客户采用旅程
    type: journey-map
    summary: Rokid 在认知、试用、购买、使用和生态扩张各阶段都有公开信号，但公开信息仍无法衡量续购和客户集中度。
    data:
      items:
        - label: 认知
          detail: 全球 $299 的 Style 发布扩大了可触达的消费者范围。
          touchpoints:
            - CES 2026 首发
            - 独立发布报道
        - label: 试用与获客
          detail: 创作者补贴降低试用成本，但不能证明付费转化。
          touchpoints:
            - Thousand Creator Program
            - 免费资格或 $199 创作者价格
        - label: 购买意向
          detail: 在留存尚未知晓前，众筹提供了类似交易的需求证据。
          touchpoints:
            - Kickstarter
            - 台湾众筹
        - label: 公司所称的活跃使用
          detail: 公司报告的活跃用户和日均时长显示出参与度，但没有队列定义。
          touchpoints:
            - 250,000+ 活跃用户
            - 日均使用 2.75 小时
        - label: 生态扩张
          detail: 开发者会员规模和欧洲零售渠道扩大了应用与分发范围。
          touchpoints:
            - 35,000 名全球开发者会员
            - 德国和法国零售
        - label: 信任与续购
          detail: 隐私滥用和缺少留存指标，无法得出客户长期留存的结论。
          touchpoints:
            - 社区内容清理
            - NRR、GRR、流失率和续购率未披露
    approximationNotes: 各阶段概括不同的公开信号，不是转化漏斗；目前没有阶段转化率、共享队列或收入分母。
    claimRefs:
      - CU004
      - CU005
      - CU008
      - CU009
      - CU010
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 定性矩阵区分有证据支持的可能性与影响，并显示缓解措施的说法尚未降低剩余敞口。
    data:
      columns:
        - 可能性
        - 影响
        - 缓解措施成熟度
        - 剩余严重程度
      rows:
        - label: 隐私滥用
          values:
            - 中
            - 高
            - 被动响应
            - 高
        - label: 安全或数据控制失效
          values:
            - 未量化
            - 高
            - 公司声称
            - 高
        - label: 核心供应商中断
          values:
            - 未量化
            - 高
            - 未披露
            - 高
        - label: 模型平台条款变化
          values:
            - 未量化
            - 高
            - 多供应商
            - 中高
        - label: 硬件质量或退货负担
          values:
            - 未量化
            - 中高
            - 未披露
            - 中高
        - label: 促销需求无法转化
          values:
            - 未量化
            - 中
            - 早期铺量
            - 中
    approximationNotes: 序数标签是分析师基于引用证据作出的判断，不是实测概率；“未量化”表示没有留存任何可辩护的公开分母。
    claimRefs:
      - CR001
      - CR004
      - CR006
      - CR010
      - CR012
      - CR013
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 商业验证前景不错，但经济性和当前条款缺失，使判断止步于继续跟踪，而不是投资。
    data:
      nodes:
        - id: product
          label: 产品验证
          detail: 十一代公司报告的量产 AI 和 AR 眼镜
        - id: reach
          label: 覆盖信号
          detail: 公司报告的国际覆盖、用户、众筹和出货份额
        - id: quality
          label: 证据质量
          detail: 当前大多数规模信号由公司发布，未经独立验证
        - id: economics
          label: 经济性缺口
          detail: 没有指定的经审计收入、利润率、现金或单位经济性证据
        - id: price
          label: 价格缺口
          detail: 最近一次指定估值参考是 2024 年 1 月的 $1B
        - id: decision
          label: 继续跟踪
          detail: 只有在当前条款、经审计经济性和退出证据齐备后，才重新评估
      edges:
        - from: product
          to: reach
        - from: reach
          to: quality
        - from: quality
          to: economics
        - from: economics
          to: price
        - from: price
          to: decision
    approximationNotes: 该序列用于组织决策，不是概率模型，也不是量化估值桥接。
    claimRefs:
      - CV008
      - CV010
      - CV013
      - CV015
