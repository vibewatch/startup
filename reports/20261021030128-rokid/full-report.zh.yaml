            body: >-
              历史融资证明公司能获得资本，但不能证明当前流动性。Forbes 报道称，2024 年有一笔近 US$70 million 的政府主导轮次， 并将交易与合肥的企业办公区、生态枢纽和研发中心联系起来；Rokid
              官方文章则另称公司已完成 13 轮融资并处于 C+ 阶段。 2026 年 6 月，创始人称公司弹药储备充足，但同一报道没有给出现金余额、月度消耗、债务、现金跑道或已承诺 IPO 所得。
              隐私争议及相关内容清理也说明，在敏感资本市场时点可能出现合规和审核成本渠道，但没有提供可量化的财务影响。
              因此财务结论是混合的：市场需求和融资能力可能是优势，但收入质量、毛利率持久性、营运资本强度和未来资本充足性无法依据 公开数据进行投资判断。经审计报表和当前流动性桥接表，是形成估值信心的前提。
