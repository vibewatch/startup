            body: >-
              证据显示 Misa Zhu 是创始人兼首席执行官，Zoro Shao 是集团副总裁兼全球总经理。这说明公司由创始人主导战略，
              也有明确的全球商业负责人，但不足以证明管理团队完整、董事会名单、投票结构、投资者权利或继任计划。 面向公众的增长势头还让公司依赖管理层之外的利益相关方：Kickstarter
              支持者、用户、开发者、分销伙伴以及可能被第一视角 录制的人，都会影响产品采用和信任。留存来源没有列出当前机构投资者、贷款方、董事或控股股东。因此，尽调应将治理和资本结构
