  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与经营范围
        blocks:
          - type: paragraph
            body: >-
              Rokid 官方公司历史记载其于 2014 年 7 月在杭州成立，并将业务描述为覆盖大语言模型工具、计算机视觉、YodaOS、
              硬件和解决方案的产品平台。这一定位比单一设备厂商更宽：它把眼镜、操作层和面向开发者的能力结合在一起。 公司材料称其已量产 11 代 AI 和 AR 眼镜，拥有 300 多项专利，服务覆盖 100
              多个国家、触达数百万用户。 这些是发行方自报的规模指标，不是经审计的经营统计。当前来源池未披露收入、ARR、员工数、经验证的客户数或法人实体所在地清单，
              因此这些指标仍为空值，不能从用户、支持者、国家数或开发者注册量推导。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
