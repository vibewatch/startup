      - number: '3.3'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              防御性来自一体化的软硬件栈、显示光学、处方支持、开发者工具和开放助手策略，而不是已被证明的客户锁定。 如果第三方应用和工作流变得有价值，YodaOS、AIUI 和 Agent Store
              可能提高切换成本；但公开开发者数量由公司自报， 没有留存、应用使用、开发者付费经济性或迁移成本证据。出货量标题也容易被过度解读：Mixed News 报道，无屏设备 占 2026 年上半年 AI 眼镜出货量的
              96%，并指出 Rokid 所称的 41% 份额只适用于剩余的带显示屏细分市场，且没有公开的细分表 或出货量。隐私是另一个竞争变量。BigGo 报道的隐蔽录制和 Rokid
              随后的清理表明，技术能力也可能带来信任成本；来源池没有跨厂商 基准证明 Rokid 的防护更强。基于当前证据，产品层面的差异化可信，但护城河持久性仍未经证明。
