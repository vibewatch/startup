            body: >-
              Rokid 官方时间线显示，公司从语音交互设备一路发展到 AR 眼镜、YodaOS-XR、工业混合现实硬件、消费级观影设备和 AI 眼镜。 独立报道补充了两个有用的商业信号：MarketsandMarkets
