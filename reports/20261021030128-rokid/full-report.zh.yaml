        - 执行、硬件毛利和估值倍数压缩
        - 独立运营证据通过所有核心尽调门槛
      - - 基准
        - 商业势头延续，但经济性和退出时点仍未验证
        - 以过时 $1B 参考值为上限或低于该值，可能是谈判上限，而非评估价
