        - OpenAI, Google, DeepSeek, and Qwen
        - AI inference and assistant capabilities
        - Four named providers; traffic mix and contract terms undisclosed
        - Access, policy, latency, or pricing change degrades product utility
        - High
        - Multi-model support
        - Medium-high because switching quality and data routes are untested publicly
      - - Core silicon and imaging
        - Qualcomm, NXP, and Sony
        - High-intensity processing, low-power tasks, and camera sensor
        - Named components but no dual-sourcing data
