  evidenceGaps:
    - type: missing-source
      severity: material
      topic: regulatory-legal-status
      missingEvidence: >-
        Authoritative licenses, regulator correspondence, litigation schedule, enforcement
        history, privacy impact assessments, and current security or product certifications.
      whyItMatters: >-
        A camera-equipped wearable operating across jurisdictions can carry material privacy,
        recording-consent, AI-data, product-safety, and listing-disclosure exposure.
      diligencePath: >-
        Obtain a counsel-signed jurisdiction matrix and search regulator, court, certification,
        and recall databases against every Rokid legal entity and current product.
      relatedQuestionRefs: [QR002]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: privacy-controls
      missingEvidence: >-
        Independent penetration tests, secure-development audit results, subprocessor inventory,
        data-flow maps, retention schedules, and repeat-incident statistics.
      whyItMatters: >-
        Company descriptions of local processing and encryption do not establish control design
        effectiveness or operating effectiveness.
      diligencePath: >-
        Commission technical security review and privacy-control testing, including attempts to
        bypass recording indicators and alter capture hardware.
      relatedQuestionRefs: [QR003, QR004]
    - type: private-evidence-only
      severity: material
      topic: financial-model
      missingEvidence: >-
        Audited revenue, gross margin by SKU, bill of materials, cash use, working capital, return
        rates, warranty costs, channel sell-through, and supplier or customer concentration.
      whyItMatters: >-
        Shipment-share and promotional activity cannot establish contribution margin, cash
        durability, or the capital required to scale a multi-SKU hardware business.
      diligencePath: >-
        Reconcile audited financial statements to SKU cohorts, channel inventory, warranty
        reserves, purchase commitments, and a monthly cash forecast.
      relatedQuestionRefs: [QR010]
    - type: enumeration-incomplete
      severity: material
      topic: regulatory-legal-risk-register
      missingEvidence: >-
        A complete jurisdiction-by-jurisdiction register of licenses, disputes, enforcement,
        certifications, safety events, privacy incidents, and remediation status.
      whyItMatters: >-
        The public sample cannot establish the full population of legal and regulatory exposure.
      diligencePath: >-
        Require management and external counsel to certify a complete register and reconcile it
        to legal-entity, product, and geographic launch records.
      relatedQuestionRefs: [QR002]
      relatedTableRefs: [TR001]
