      - - Developer ecosystem
        - YodaOS, Agent Store, AIUI, and registered developers
        - Applications and agent experiences
        - Company reports more than 30,000 registered developers
        - Low active-developer conversion limits ecosystem value
        - Medium
        - Open platform and U.S. launch
        - Medium because active usage and app economics are undisclosed
      - - Retail and creator channels
        - Amazon, company webstore, local retailers, airport retail, and creators
        - Demand generation and distribution
        - No revenue or sell-through concentration disclosed
        - Promotional demand fails to convert or a key channel changes terms
        - Medium
        - Multiple named channels and geographic rollout
        - Medium pending channel-level revenue, returns, and acquisition-cost data
    notes: >-
      Counterparties are those named in retained sources; concentration, contractual protections,
