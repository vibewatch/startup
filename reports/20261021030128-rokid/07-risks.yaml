company:
  name: Rokid
chapter:
  number: 7
  title: Risks
  summary: >-
    Rokid's clearest evidenced risk is privacy misuse: covert footage captured with its glasses
    appeared in the company's community, prompting content removal and promised technical
    safeguards. The residual investment risk remains high because public evidence does not
    independently validate privacy controls, hardware reliability, partner concentration, or
    unit economics.
sections:
  - id: ranked-risk-posture
    title: Ranked risk posture
    body: >-
      Privacy misuse ranks first because the assigned evidence documents a concrete incident,
      not merely a hypothetical concern. BigGo reported that covert footage of flight attendants
      was uploaded to Rokid's community and that similar videos were found, while Rokid responded
      with content removal, community oversight, and planned sensor and algorithm changes. Those
      actions show mitigation activity, but planned controls do not demonstrate prevention.
      Multi-jurisdiction privacy, recording-consent, and AI-data obligations therefore remain
      material. Public evidence in the assigned pool did not establish licenses, enforcement
      outcomes, litigation status, or independent security certifications, so those items are
      diligence gaps rather than evidence of a clean record.
    claimRefs: [CR001, CR002, CR003, CR004, CR016]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: operational-quality-security
    title: Operational, quality, and security exposure
    body: >-
      Rokid's product design combines cameras, waveguide displays, two processors, prescription
      optics, batteries, and several AI services. That architecture expands the number of
      integration and post-sale failure points even though the reviewed material did not document
      a recall or systemic outage. Company-issued material says data is processed locally where
      possible, minimized before AI workflows, encrypted in transit, and access-controlled; no
      independent audit in the assigned pool tests those claims. Independent coverage also calls
      battery life, comfort, and privacy continuing considerations. Warranty incidence, returns,
      field failure rates, security test results, and after-sale costs are therefore essential
      monitoring inputs.
    claimRefs: [CR004, CR009, CR012, CR013, CR016]
    tableRefs: [TR002]
  - id: ecosystem-counterparty-dependencies
    title: Ecosystem and counterparty dependencies
    body: >-
      Rokid's open-platform positioning reduces dependence on one language model but does not
      remove external dependency. The glasses are described as supporting ChatGPT, Gemini,
      DeepSeek, and Qwen, while independent product coverage identifies Qualcomm, NXP, and Sony
      components. Changes in model access, cloud terms, chip availability, export controls, or
      component economics could affect functionality or margin. The U.S. rollout of YodaOS and
      Agent Store, local European retail partnerships, and creator subsidies broaden distribution
      but add execution surfaces. No assigned evidence quantifies supplier concentration,
      distributor concentration, minimum commitments, or switching time.
    claimRefs: [CR005, CR010, CR011, CR012, CR014, CR015, CR016]
    tableRefs: [TR003]
  - id: financial-model-and-kill-criteria
    title: Financial-model risk and thesis-break criteria
    body: >-
      Public shipment leadership is not a substitute for economics. MIXED notes that the cited
      41% share applies only to display-equipped AI glasses, while displayless products represented
      96% of all AI-glasses shipments; it also found no public Counterpoint table, unit total,
      revenue figure, or runner-up ranking. Promotional creator pricing, complimentary units, and
      a second-pair discount demonstrate go-to-market investment but do not reveal sell-through or
      contribution margin. The thesis should break if privacy incidents recur after promised
      controls, material partners withdraw, field-failure or return rates exceed management targets,
      or verified gross margin and cash requirements cannot support continued hardware expansion.
    claimRefs: [CR006, CR007, CR010, CR011, CR016]
