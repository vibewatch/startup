    claimRefs: [CR005, CR008, CR009, CR010, CR011, CR012, CR014, CR015, CR016]
figures:
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Qualitative matrix separates evidenced likelihood from impact and shows where mitigation
      claims have not yet reduced residual exposure.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Privacy misuse
          values: [Medium, High, Reactive, High]
        - label: Security or data-control failure
          values: [Unquantified, High, Company-claimed, High]
        - label: Core supplier disruption
          values: [Unquantified, High, Undisclosed, High]
        - label: Model-platform terms change
          values: [Unquantified, High, Multi-provider, Medium-high]
        - label: Hardware quality or return burden
          values: [Unquantified, Medium-high, Undisclosed, Medium-high]
        - label: Promotional demand fails to convert
          values: [Unquantified, Medium, Early rollout, Medium]
    approximationNotes: >-
      Ordinal labels are analyst judgments from the cited evidence, not measured probabilities;
      unquantified means no defensible public denominator was retained.
    claimRefs: [CR001, CR004, CR006, CR010, CR012, CR013]
callouts:
  - calloutType: risk
    title: Privacy response is not prevention proof
    body: >-
      Rokid's cleanup, accessory-delisting effort, and planned technical controls are relevant
      mitigations, but investment confidence should depend on repeat-incident data and independent
      testing rather than policy statements alone.
    claimRefs: [CR001, CR002, CR003, CR004]
