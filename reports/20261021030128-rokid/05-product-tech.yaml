    title: "Workflow and use-case assessment"
    columns: ["User job", "Current workflow", "Rokid solution", "Measurable benefit disclosed", "Limitation"]
    rows:
      - ["Understand surroundings and information", "Look at a phone or request human assistance", "In-view translation, navigation, contextual Q&A, and audio description", "No independently measured task-time or accuracy result in retained sources", "Accuracy, latency, model routing, and accessibility validation are undisclosed"]
      - ["Capture first-person content", "Hold a phone or camera while working or creating", "Hands-free camera capture with creator-oriented Style hardware", "Style specifications include 4K capture and up to ten-minute continuous recording", "Privacy controls, low-light quality, heat, battery impact, and consent behavior need testing"]
      - ["Inspect equipment and obtain expert help", "Pause work, consult manuals, or call a remote expert", "X-Craft remote collaboration and AI-assisted inspection", "LeadIQ and Rokid's LinkedIn profile describe the workflow but publish no outcome denominator", "Production references, certification, network fallback, and support SLA are unavailable"]
      - ["Build glasses-specific AI experiences", "Develop against vendor tools and distribute through separate channels", "YodaOS, AIUI Studio, and Agent Store", "Rokid reported a 35,000-member developer community", "Active builders, agents published, downloads, retention, and revenue share are not disclosed"]
    notes: >-
      Benefits are limited to metrics or capabilities explicitly stated in the assigned
      evidence; a missing value does not imply that no internal measurement exists.
    claimRefs: [CE003, CE006, CE007, CE008, CE009, CE010, CE016]
  - id: "TE003"
    title: "Technology and operating architecture"
    columns: ["Layer / component", "Role", "Key dependency", "Technical or operating risk"]
    rows:
      - ["Camera and sensors", "Capture first-person visual context and user commands", "Sensor supply, recording indicator, calibration", "Covert capture, tampering, image quality, and consent controls"]
      - ["Low-power compute", "Handle always-on voice and background tasks on Style", "NXP RT600 and firmware optimization", "Power claims and wake-word behavior lack independent testing"]
      - ["AI and imaging compute", "Run higher-intensity imaging and AI workloads", "Qualcomm AR1, thermal envelope, battery", "Vendor concentration, heat, sustained performance, and component continuity"]
      - ["Optics and display", "Project contextual information into the user's field of view", "Micro-LED and diffraction-waveguide components", "Yield, brightness, field of view, prescription fit, and long-term durability"]
      - ["Operating and agent platform", "Coordinate device experiences and enable agent development", "YodaOS, AIUI, Agent Store, external model APIs", "Platform adoption, model cost, data governance, and backward compatibility"]
      - ["Apps, cloud, and accessories", "Configuration, media management, AI activation, power, and device expansion", "Rokid AI App, Rokid AR App, charging cases, mobile and cloud services", "Cloud availability, data residency, accessory lock-in, and support lifecycle"]
    notes: >-
      The architecture is reconstructed only from components and services named in the
      retained sources; interfaces, suppliers, redundancy, security boundaries, and
      production service levels are not publicly established.
    claimRefs: [CE002, CE006, CE007, CE009, CE013, CE014]
figures:
  - id: "FE001"
    title: "Rokid product architecture map"
    type: "stack"
    summary: >-
      Six evidence-backed layers connect sensing hardware to customer and developer
      experiences, while exposing chipset, optics, model, cloud, and support dependencies.
    data:
      layers:
        - label: "Customer experiences"
          items: ["Translation and navigation", "First-person capture", "Remote collaboration", "AI inspection"]
          detail: "Use cases differ by consumer, creator, accessibility, and industrial workflow."
        - label: "Applications and distribution"
          items: ["Rokid AI App", "Rokid AR App", "Agent Store", "AIUI Studio"]
          detail: "Configuration, content transfer, AI-service activation, development, and agent distribution."
        - label: "Operating and model layer"
          items: ["YodaOS", "ChatGPT", "Gemini", "DeepSeek", "Qwen"]
          detail: "Company materials position the platform as model-agnostic, but routing and data-governance details are unavailable."
        - label: "AI and imaging compute"
          items: ["Qualcomm AR1", "NXP RT600 on Style"]
          detail: "High-intensity imaging and AI tasks are separated from low-power voice tasks on the Style design."
        - label: "Optics and presentation"
          items: ["Micro-LED", "Diffraction waveguide", "Audio output", "Displayless Style variant"]
          detail: "The portfolio supports both in-view display and ambient screenless interaction."
        - label: "Sensing, frame, and power"
          items: ["First-person camera", "Microphones", "Prescription lens support", "Charging accessories"]
          detail: "Comfort, battery endurance, recording indication, and component durability require independent validation."
    approximationNotes: >-
      This is a functional stack assembled from named public components, not a disclosed
      bill of materials, network diagram, security architecture, or supplier map.
    claimRefs: [CE002, CE005, CE006, CE013, CE016]
