company:
  name: "Rokid"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Rokid has a broad smart-glasses stack spanning display-equipped AI/AR glasses,
    screenless creator glasses, industrial hardware, companion apps, YodaOS, AIUI,
    and an Agent Store. The clearest technical differentiation is lightweight
    hardware combined with a multi-model software layer, but public evidence remains
    thin on reliability, security certification, privacy-by-design controls, and
    independent developer adoption.
sections:
  - id: "portfolio-and-workflows"
    title: "Portfolio and customer workflows"
    body: >-
      Rokid delivers more than one glasses form factor. Its current public portfolio
      spans display-equipped Rokid Glasses, the screenless AI Glasses Style, consumer
      AR viewers and accessories, and the enterprise-oriented X-Craft line. The
      customer workflow is hands-free access to translation, navigation, teleprompting,
      first-person capture, remote collaboration, or guided inspection, depending on
      the device. That breadth creates cross-selling potential but also makes maturity
      uneven: some products are current retail launches, while enterprise performance
      and certifications are described mainly through company-controlled pages and
      profile aggregators. Buyers therefore need SKU-level proof rather than treating
      the whole portfolio as one mature platform. The module and workflow tables
      separate observed products from the operating metrics still required in diligence.
    claimRefs: [CE001, CE003, CE004, CE005, CE008, CE009, CE013]
    tableRefs: [TE001, TE002]
  - id: "architecture-and-dependencies"
    title: "Architecture and technical dependencies"
    body: >-
      The best-documented display-glasses design combines a first-person camera,
      Snapdragon AR1 compute, and a Micro-LED diffraction-waveguide display in a
      49-gram frame. The Style line takes a different route: an independent report
      describes a 38.5-gram, displayless device using an NXP RT600 for low-power voice
      tasks and a Qualcomm AR1 for imaging and AI workloads. Above the hardware,
      YodaOS, AIUI, companion apps, and the Agent Store form the software and
      distribution layer. This architecture is specific enough to show where value
      can accrue, but it also exposes dependencies on chipset vendors, optical
      components, mobile connectivity, external model providers, app distribution,
      and battery accessories. No retained source quantifies component redundancy,
      field failure rates, or service-level performance.
    claimRefs: [CE002, CE005, CE006, CE013, CE014]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: "maturity-and-differentiation"
    title: "Maturity, ecosystem, and differentiation"
    body: >-
      Rokid's strongest defensible product thesis is full-stack integration rather
      than a single component. The company says it has mass-produced 11 generations
      of glasses, holds more than 300 patents, and serves more than 100 countries;
      those figures are useful maturity signals but remain unaudited company claims.
      A 2026 rollout of YodaOS, AIUI Studio, and the Agent Store, plus a creator
      program, shows an active attempt to make the hardware extensible. Rokid also
      reported 35,000 developer-community members, yet the retained evidence does not
      disclose active developers, published agents, downloads, retention, or third-party
      repository activity. Similarly, a reported 41% shipment share applies only to
      display-equipped AR and AI glasses, not the overall AI-glasses market, and the
      underlying Counterpoint table and unit volume were not public in the evidence set.
    claimRefs: [CE006, CE007, CE012, CE015, CE016]
  - id: "trust-reliability-and-roadmap-risk"
    title: "Trust, reliability, and roadmap risk"
    body: >-
      Privacy is the most concrete product-risk signal in the retained material. BigGo
      reported that users had posted covert recordings made with Rokid glasses and
      that the company removed the content, tightened community oversight, and
      described future sensor and algorithm changes. This is evidence of a response,
      not proof that misuse is prevented. The source set contains no independent
      security audit, privacy certification, vulnerability-disclosure policy, software
      support period, uptime record, warranty-claim rate, return rate, battery-degradation
      data, or field-failure statistics. Roadmap underwriting should therefore depend
      on test reports and operating data rather than feature announcements. The
      technical diligence priority is to verify recording indicators and tamper
      resistance, then assess update support, cloud/model data flows, component
      continuity, and after-sales performance for each major SKU.
    claimRefs: [CE010, CE011, CE014]
callouts:
  - calloutType: "strength"
    title: "A credible full-stack product thesis"
    body: >-
      Rokid combines differentiated glasses hardware with operating-system,
      agent-development, app, and accessory layers instead of competing only as a
      display accessory vendor.
    claimRefs: [CE001, CE002, CE006, CE013]
  - calloutType: "risk"
    title: "Trust and reliability remain under-evidenced"
    body: >-
      A documented covert-recording controversy makes preventive privacy controls
      material, while public reliability, security-audit, and support-lifecycle data
      remain unavailable.
    claimRefs: [CE010, CE011, CE014]
