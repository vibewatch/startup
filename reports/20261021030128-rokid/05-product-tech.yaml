  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "reliability-and-support"
      missingEvidence: >-
        SKU-level battery tests, field-failure and return rates, warranty claims,
        repair turnaround, support SLAs, component redundancy, and software-support periods.
      whyItMatters: >-
        These metrics determine whether lightweight hardware and a broad SKU portfolio
        can deliver acceptable gross margin, customer experience, and lifecycle cost.
      diligencePath: >-
        Obtain twelve months of cohort-level quality data, warranty and return logs,
        battery-cycle tests, supplier continuity plans, and contractual support terms.
      relatedQuestionRefs: [QE008]
      relatedTableRefs: [TE001, TE003]
    - type: "missing-source"
      severity: "material"
      topic: "privacy-and-security-controls"
      missingEvidence: >-
        Independent security and privacy assessments covering recording indicators,
        tamper resistance, application permissions, cloud/model data flows, retention,
        vulnerability handling, and compliance certifications.
      whyItMatters: >-
        The reported covert-recording incident demonstrates misuse risk, while a
        reactive cleanup does not verify preventive technical controls.
      diligencePath: >-
        Commission a device and cloud security review, test indicator bypass paths,
        inspect data-flow diagrams and retention controls, and review certification
        reports and the vulnerability-disclosure process.
      relatedQuestionRefs: [QE007, QE010]
      relatedTableRefs: [TE002, TE003]
    - type: "missing-source"
      severity: "material"
      topic: "developer-adoption"
      missingEvidence: >-
        Active developer counts, published and approved agent totals, app or agent
        downloads, retention, API usage, repository activity, and developer economics.
      whyItMatters: >-
        Community membership and platform launches do not establish that third parties
        are building durable applications that strengthen hardware differentiation.
      diligencePath: >-
        Request monthly active-developer cohorts, Agent Store inventory and usage,
        API telemetry, review times, revenue share, and third-party developer references.
      relatedQuestionRefs: [QE006]
      relatedTableRefs: [TE002]
