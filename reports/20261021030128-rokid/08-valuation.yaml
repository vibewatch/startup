  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: valuation
      missingEvidence: Current financing documents, fully diluted capitalization, debt, liquidation preferences, anti-dilution rights, and secondary marks.
      whyItMatters: Without the security price and waterfall, neither dilution nor target return can be calculated.
      diligencePath: Obtain the latest cap table, financing agreements, debt schedule, and board-approved transaction documents from management and counsel.
      relatedQuestionRefs: [QV003]
    - type: missing-source
      severity: material
      topic: exit-readiness
      missingEvidence: An HKEX filing, prospectus, exchange correspondence, or other primary evidence of listing status and timetable.
      whyItMatters: A reported internal target does not establish exit readiness, timing, or public-market disclosure quality.
      diligencePath: Verify the issuer directly in HKEX records and obtain any confidential filing or draft prospectus under NDA.
      relatedQuestionRefs: [QV008]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Audited revenue, gross margin, sell-through, returns, warranty costs, channel inventory, operating cash flow, and cash balance.
      whyItMatters: Product demand cannot be translated into enterprise value or runway without operating and cash denominators.
      diligencePath: Reconcile audited statements to monthly product, geography, channel, and cohort schedules in a management data room.
    - type: missing-source
      severity: minor
      topic: comparables
      missingEvidence: Direct AI-eyewear public-company, private-round, and M&A references with consistent revenue, margin, growth, and security-term data.
      whyItMatters: The available cross-sector robotics set cannot support a reliable valuation multiple for Rokid.
      diligencePath: Commission a transaction screen and normalize direct eyewear and wearable-device peers for business model, growth, margin, and control terms.
