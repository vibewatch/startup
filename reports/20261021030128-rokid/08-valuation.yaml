company:
  name: Rokid
chapter:
  number: 8
  title: Valuation
  summary: >-
    Rokid merits tracking rather than an investment recommendation at an undisclosed current
    price. Public evidence shows product and distribution traction, but the latest assigned
    financing mark is a January 2024 $1 billion valuation and the evidence set does not disclose
    current revenue, margins, cash, capitalization, preferences, or an IPO prospectus.
sections:
  - id: decision
    title: Investment decision and price discipline
    body: >-
      The appropriate public-evidence decision is track and research more, with low-to-medium
      confidence and high risk. Rokid presents a credible commercialization case: company-issued
      materials describe eleven generations of mass-produced glasses, reach across more than 100
      countries, a large active-user base, crowdfunding demand, and claimed category leadership.
      Those signals establish product activity, not investable economics. They do not independently
      verify revenue, gross margin, working-capital needs, warranty costs, cash available, or
      retention. Price discipline therefore dominates company-quality assessment. No buy decision
      is supportable until a current security price and fully diluted capitalization can be tested
      against audited operating results, downside protections, and a credible exit path. The
      privacy controversy also raises a governance and adoption risk that should be reflected in
      underwriting rather than treated as a peripheral communications issue.
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV010, CV011, CV015, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-context
    title: Financing context and comparable limits
    body: >-
      The most recent valuation evidence in the assigned pool is historical, not current:
      Multiples records a $1 billion January 2024 Series C valuation, while SiliconANGLE reported
      that the November 2023 Series C reached $112 million and valued Rokid at $1 billion. The
      database also contains internally inconsistent aggregate-funding descriptions, stating both
      $643 million across twelve rounds and, within a round narrative, total funding exceeding
      $228 million. Neither amount is cash available today. No assigned source discloses a 2026
      financing price, fully diluted share count, liquidation preferences, debt, secondary mark,
      audited revenue, or EBITDA. Multiples lists robotics and automation companies as comparables,
      but their business models are not direct substitutes for consumer AI-AR eyewear and the page
      supplies no Rokid revenue denominator. Those records are useful reference points, not a
      defensible multiple-based appraisal.
    claimRefs: [CV001, CV002, CV003, CV004, CV013, CV014]
    tableRefs: [TV002]
  - id: scenarios
    title: Bull, base, and bear cases
    body: >-
      Scenario analysis should be milestone-based because a numeric equity range would imply
      precision the public record cannot support. In the bull case, independently verified
      shipment leadership, conversion of crowdfunding demand into profitable sell-through, and
      audited international growth would justify revisiting a premium to the stale $1 billion
      reference. The base case treats that mark only as a negotiation ceiling pending audited
      revenue, margins, cash, and capitalization. The bear case is triggered by weak sell-through,
      poor hardware economics, privacy-driven channel friction, delayed listing evidence, or
      punitive preference and dilution terms; under those conditions the correct public-evidence
      value is not a lower invented number but no transaction. Probability signals remain
      qualitative until the missing denominators are supplied.
    claimRefs: [CV001, CV006, CV007, CV011, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: diligence-and-exit
    title: Exit readiness, diligence asks, and thesis breaks
    body: >-
      BigGo reported restructuring associated with IPO preparation and a targeted 2026 Hong Kong
      listing window, but the assigned evidence contains no exchange filing or prospectus. Exit
      readiness is therefore unverified. Before underwriting, obtain audited financial statements,
      monthly unit shipments and sell-through by product and geography, gross margin after returns
      and warranty costs, channel inventory, cohort retention, current cash and debt, a fully
      diluted cap table, preference and anti-dilution terms, and any draft listing materials.
      Confirm the issuer and security to which any quoted valuation applies. Thesis-break triggers
      are failure to reconcile historical funding records, inability to demonstrate positive
      contribution margin at scale, material privacy or regulatory restrictions, repeated IPO
      delay without adequate runway, or terms that prevent target returns even if operations meet
      plan.
    claimRefs: [CV003, CV004, CV011, CV012, CV013, CV015]
