      - [Risk rating, High, "Require governance, hardware-economics, financing, and exit diligence"]
      - [Valuation stance, "Unsupported at an undisclosed current price", "Use the January 2024 $1B mark only as a stale reference"]
      - [Decision gate, "Audited economics plus current cap table and security terms", "Re-underwrite only when denominators and downside rights are available"]
    notes: >-
      Assessments are analytical judgments based on the assigned public evidence; the January 2024
      valuation is historical and is not a current offer price or appraisal.
    claimRefs: [CV011, CV013, CV015, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Argument, What would change the view]
    rows:
      - [Thesis, "Rokid reports meaningful active-user engagement and an established developer base", "Independent usage, retention, and paid-conversion evidence"]
      - [Thesis, "Company releases report category shipment leadership and international crowdfunding demand", "Third-party shipment data and profitable sell-through by geography"]
      - [Anti-thesis, "The latest assigned valuation mark is from 2024 and current terms are undisclosed", "A current financing document, cap table, and preference schedule"]
      - [Anti-thesis, "Privacy controversy may impair adoption, regulation, and listing readiness", "Verified controls, incident metrics, and regulator or exchange clearance"]
    notes: >-
      Traction rows preserve issuer attribution: shipment, user, and crowdfunding metrics are
      company-issued claims rather than independently verified benchmarks.
    claimRefs: [CV005, CV006, CV007, CV011, CV013, CV016]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Assumptions, Valuation and return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Independent shipment leadership; profitable sell-through; audited international growth", "Revisit a premium to the stale $1B reference only after current capitalization and target-return modeling", "Execution, hardware margin, and multiple compression", "Independent operating evidence clears all core diligence gates"]
      - [Base, "Commercial traction continues but economics and exit timing remain unverified", "At or below the stale $1B reference may be a negotiation ceiling, not an appraisal", "Dilution, preferences, cash needs, and IPO delay", "Audited economics and current terms are still pending"]
      - [Bear, "Weak sell-through or margins; privacy friction; listing delay; investor-unfriendly terms", "Defer with no defensible public-evidence equity value", "Down round, channel retrenchment, regulation, and liquidity", "Any thesis-break trigger occurs or core records cannot be reconciled"]
    notes: >-
      No numeric current equity ranges or return probabilities are stated because current price,
      capitalization, audited revenue, margins, cash, and security terms are unavailable.
    claimRefs: [CV006, CV007, CV011, CV013, CV014, CV015]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Commercial proof is promising, but missing economics and current terms stop the chain at track rather than invest.
    data:
      nodes:
        - id: product
          label: Product proof
          detail: Eleven company-reported generations of mass-produced AI and AR glasses
        - id: reach
          label: Reach signals
          detail: Company-reported international reach, users, crowdfunding, and shipment share
        - id: quality
          label: Evidence quality
          detail: Most current scale signals are company-issued rather than independently verified
        - id: economics
          label: Economics gap
          detail: No assigned audited revenue, margin, cash, or unit-economics evidence
        - id: price
          label: Price gap
          detail: Latest assigned valuation reference is $1B from January 2024
        - id: decision
          label: Track
          detail: Re-underwrite only with current terms, audited economics, and exit evidence
      edges:
        - from: product
          to: reach
        - from: reach
          to: quality
        - from: quality
          to: economics
        - from: economics
          to: price
        - from: price
          to: decision
    approximationNotes: >-
      The sequence is a decision framework, not a probability model or a quantified valuation
      bridge.
    claimRefs: [CV008, CV010, CV013, CV015]
callouts:
  - calloutType: recommendation
    title: Price-sensitive conclusion
    body: >-
      Track Rokid, but do not convert product enthusiasm into a buy recommendation until current
      security terms and audited operating economics support a target return.
    claimRefs: [CV013, CV015, CV016]
  - calloutType: risk
    title: Historical funding is not liquidity
    body: >-
      Reported cumulative funding cannot be treated as cash available, and the assigned database
      contains conflicting aggregate totals that require reconciliation.
    claimRefs: [CV003, CV004]
