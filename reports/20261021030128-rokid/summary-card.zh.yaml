  topStrengths:
    - 产品持续出货，公司披露的 AI 与 AR 眼镜已迭代 11 代，覆盖多种消费级和企业级形态。
    - 众筹、进入欧洲零售渠道、创作者计划，以及公司披露的覆盖 100 多个国家，显示其市场拓展路径较广。
