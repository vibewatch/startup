    notes: >-
      Values retain each publisher's metric, period, unit, and denominator.
      Rows are separate lenses rather than additive TAM/SAM/SOM layers; no CAGR,
      revenue conversion, or Rokid share of total smart glasses is inferred.
    claimRefs: [CM001, CM003, CM004, CM005, CM006, CM007, CM008, CM015]
  - id: TM003
    title: Segment, user, payer, and adoption map
    columns:
      - Segment
      - Buyer and user
      - Payer or budget owner
      - Workflow and trigger
      - Adoption constraint
    rows:
      - - Consumer creators
        - Individual buyer and wearer
        - Personal electronics budget
        - Hands-free capture, audio, and social content at a $299 entry price
        - Privacy acceptance, quality, battery life, and competition from phones and cameras
      - - Travelers and mobile professionals
        - Individual or employer-sponsored user
        - Personal productivity, travel, or departmental budget
        - Translation, navigation, teleprompting, and contextual assistance
        - Infrequent use may not justify price or wearing another device
      - - Industrial and field service
        - Technician and operations team
        - Operations, IT, or transformation budget
        - Hands-free guidance, remote expertise, and digital overlays
        - Integration, security, ruggedness, device management, and demonstrable ROI
      - - Healthcare and accessibility
        - Clinician, patient, or visually impaired user
        - Clinical operations, institutional, insurer, or personal budget
        - Remote-clinic translation, contextual awareness, and hands-free information
        - Safety validation, privacy, reimbursement, and workflow approval are not evidenced
      - - Developers and solution partners
        - Application developer or integrator
        - R&D, product, or partner-development budget
        - Build applications through Rokid's browser-based AIUI Studio
        - A claimed 35,000-member community does not disclose active-developer or monetization rates
    notes: >-
      Use cases are source-backed, while payer and budget-owner assignments are
      analytical inferences. No retained source provides segment revenue,
      conversion rates, procurement cycle length, or customer concentration.
    claimRefs: [CM009, CM010, CM011, CM014, CM016]
