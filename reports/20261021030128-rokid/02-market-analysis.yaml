        - Market estimate; underlying model not available in the fetched article
        - Medium; broad category and not a Rokid-specific addressable market
      - - MarketsandMarkets, 2030 forecast
        - Global smart-glasses market revenue
        - $4,129.3 million
        - Publisher forecast; CAGR not stated in the fetched article
        - Low-to-medium; forecast uncertainty and category scope remain
      - - BigGo Finance citing industry data, 2025
        - Global smart-glasses unit sales
        - 7 million units
        - Annual unit comparison with smartwatches and smartphones
        - Medium; no revenue, price-band, or geography split
      - - BigGo Finance citing Counterpoint, Q1 2026
        - Global AR glasses and displayless smart-glasses shipment growth
        - 136% and 210% YoY
        - Year-over-year shipment growth by two categories
        - Medium; one quarter and no absolute shipment counts
      - - Rokid release citing Counterpoint, H1 2026
        - Global AI glasses and AR/AI-glasses shipment growth
        - 263% and 449% YoY
        - Year-over-year shipment growth for differently named categories
        - Low-to-medium; company-selected excerpts and no public segment table
      - - MIXED analysis of Counterpoint figures, H1 2026
