company:
  name: Rokid
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Smart-glasses demand is growing quickly from a small base, but the available
    evidence mixes revenue, units, displayless devices, and display-enabled AR
    products. Rokid addresses consumer and enterprise use cases, yet mainstream
    adoption still depends on frequent must-have workflows, battery and thermal
    performance, cost, comfort, and credible privacy safeguards.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The investable market should be bounded as smart glasses worn in ordinary
      eyewear form factors, then split into displayless AI glasses and
      display-enabled AR/AI glasses. The broader category includes consumer
      capture, audio, assistant, translation, navigation, teleprompting, and
      enterprise hands-free workflows; it should not automatically include
      bulky XR headsets, generic smartphones, or all spatial-computing spend.
      This boundary matters because displayless products represented 96% of AI
      glasses shipments in H1 2026, while Rokid's reported 41% leadership
      applied only to the smaller display-carrying segment. Smartphones,
      earbuds, cameras, smartwatches, handheld scanners, and existing remote-
      assistance processes remain substitutes. A valuation case therefore
      needs segment-specific adoption and revenue evidence rather than applying
      a broad wearable-computing forecast directly to Rokid.
    claimRefs: [CM006, CM007, CM008, CM009, CM015]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Evidence-constrained sizing
    body: >-
      Available sizing supports directional growth, not a clean TAM/SAM/SOM.
      MarketsandMarkets projects global smart-glasses revenue from $1.2237
      billion in 2025 to $4.1293 billion in 2030, while a separate report puts
      2025 global smart-glasses sales at seven million units. Growth estimates
      are also period- and category-specific: Q1 2026 AR and displayless
      shipments reportedly rose 136% and 210% year over year, whereas H1 2026
      AI-glasses and AR/AI-glasses shipments reportedly rose 263% and 449%.
      These figures are not interchangeable and do not isolate Rokid's served
      geographies, price bands, channel economics, or attachable software
      revenue. The strongest conclusion is that the category is expanding from
      a small base; a bottom-up SAM and attainable SOM remain diligence gaps.
    claimRefs: [CM001, CM003, CM004, CM005, CM006, CM015]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-budgets
    title: Buyers, users, and budget ownership
    body: >-
      Rokid spans several buying motions rather than one homogeneous customer.
      Consumers and creators can buy screenless AI glasses as a discretionary
      electronics purchase, with the $299 Style positioned near mainstream
      smart-glasses pricing. Travelers and mobile professionals may pay for
      display-enabled translation, navigation, and teleprompting, but those
      benefits must displace a phone or headset often enough to justify a
      higher price. Enterprise field-service, industrial, logistics, and
      healthcare deployments move the payer to operations, IT, clinical, or
      innovation budgets and require workflow integration, device management,
      security review, and measurable labor or quality gains. Because the
      sources do not disclose segment revenue or procurement conversion, these
      budget assignments are analytical inferences that require customer-level
      validation.
    claimRefs: [CM009, CM010, CM011, CM014]
    tableRefs: [TM003]
  - id: adoption-and-constraints
    title: Adoption drivers, constraints, and timing
    body: >-
      Demand drivers include lighter designs, lower entry prices, model choice,
      prescription support, hands-free translation and navigation, and a
      developer ecosystem that Rokid says has reached 35,000 members. Supply-
      chain maturation and better component yields could lower costs, while
      industrial and healthcare workflows offer clearer task-level value than
      general consumer novelty. The constraints are equally material. Rokid's
      CEO said the industry has not found a use case that is both high-frequency
      and strongly demanded, and analysts identify on-device performance,
      thermal management, battery life, display quality, and cost control as
      unresolved. A 2026 covert-recording controversy adds a trust and
      regulatory adoption barrier: indicator visibility, community governance,
      consent, and enterprise privacy controls can affect channel acceptance
      even if shipment growth remains strong.
    claimRefs: [CM002, CM011, CM012, CM013, CM016]
callouts:
  - calloutType: insight
    title: Category leadership is narrower than market leadership
    body: >-
      Rokid's reported 41% share applies to display-enabled AR and AI glasses,
      while displayless devices accounted for 96% of AI-glasses shipments in
      H1 2026; the disclosed figures do not establish leadership across all
      smart glasses.
    claimRefs: [CM006, CM007, CM008]
  - calloutType: risk
    title: Adoption still lacks a universal daily use case
    body: >-
      Rapid shipment growth does not resolve the industry's stated difficulty
      finding a workflow that is both frequent and essential, while privacy,
      battery, thermal, display, and cost constraints can slow conversion.
    claimRefs: [CM011, CM012, CM013]
tables:
  - id: TM001
    title: Market definition and substitution boundary
    columns:
      - Segment or category
      - Included spend
      - Excluded spend or substitute
      - Buyer or payer
      - Relevance to Rokid
    rows:
      - - Display-enabled AR and AI glasses
        - Eyewear hardware, optical display, companion software, accessories
        - XR headsets and generic display accessories without everyday-eyewear positioning
        - Consumers, professionals, enterprise teams
        - Core category for Rokid Glasses and the reported 41% H1 2026 shipment-share claim
      - - Displayless AI glasses
        - Camera, audio, assistant, capture, and connectivity hardware
        - Earbuds, action cameras, and smartphone-only assistants
        - Consumers and creators
        - Addressed by the $299 Rokid AI Glasses Style; represented most AI-glasses shipments in H1 2026
      - - Enterprise hands-free workflows
        - Devices, deployment software, integration, support, and workflow applications
        - Handheld scanners, tablets, phones, and existing remote-assistance processes
        - Operations, IT, clinical, and innovation budgets
        - Potentially clearer ROI in industrial and healthcare use cases, but no segment revenue was disclosed
      - - Consumer display use cases
        - Translation, navigation, teleprompting, notifications, and contextual assistance
        - Smartphones, smartwatches, and single-purpose translation devices
        - Individual consumers and professionals
        - Differentiates display-enabled products but must overcome price and frequency constraints
      - - Adjacent spatial-computing market
        - High-end headsets, immersive entertainment, and specialized mixed-reality systems
        - Not included in the core everyday smart-glasses boundary
        - Enterprises, developers, enthusiasts
        - Useful as technology adjacency, not a direct basis for Rokid's smart-glasses TAM
    notes: >-
      Analytical boundary based on product categories and use cases in the
      retained sources; budget owners are inferred and require procurement
      validation. Null segment revenue is not treated as zero.
    claimRefs: [CM006, CM008, CM009, CM010, CM014, CM015]
