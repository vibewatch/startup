company:
  name: "Rokid"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Rokid is a Hangzhou-founded AI and AR product-platform company with a company-reported
    11 generations of mass-produced glasses and an expanding consumer product line. The
    refreshed evidence shows product momentum and a meaningful privacy-governance test,
    while audited operating metrics, financing history, board composition, and cap-table
    economics remain unavailable.
sections:
  - id: "identity-and-operating-scope"
    title: "Identity and operating scope"
    body: >-
      Rokid's official company history places its founding in Hangzhou in July 2014 and
      describes the business as a product platform spanning large-language-model tooling,
      computer vision, YodaOS, hardware, and solutions. That framing is more expansive than
      a single-device vendor: it combines eyewear, an operating layer, and developer-facing
      capabilities. Company materials claim 11 generations of mass-produced AI and AR
      glasses, more than 300 patents, and service across more than 100 countries reaching
      millions of users. These are issuer-reported scale indicators rather than audited
      operating statistics. The current source pool does not disclose revenue, ARR,
      headcount, a verified customer count, or a legal-entity location list, so those
      metrics remain null rather than being inferred from users, backers, countries, or
      developer registrations.
    claimRefs: ["CO001", "CO002", "CO003", "CO004"]
    tableRefs: ["TO001"]
  - id: "leadership-and-stakeholders"
    title: "Leadership, governance, and stakeholder dependence"
    body: >-
      The evidence identifies Misa Zhu as founder and chief executive and Zoro Shao as group
      vice president and global general manager. This establishes founder-led strategic
      control and a named global commercial leader, but it does not establish a complete
      executive team, board roster, voting structure, investor rights, or succession plan.
      Public-facing traction also creates stakeholder dependence beyond management:
      Kickstarter backers, users, developers, distribution partners, and people exposed to
      first-person recording all affect product adoption and trust. No retained source names
      current institutional investors, lenders, directors, or controlling shareholders.
      Diligence should therefore treat governance and capitalization as material private-
      evidence requests rather than fill the gaps from older reporting or company momentum.
    claimRefs: ["CO005", "CO006", "CO009", "CO013", "CO014", "CO016"]
    tableRefs: ["TO002", "TO003"]
  - id: "product-evolution-and-commercial-signals"
    title: "Product evolution and commercial signals"
    body: >-
      Rokid's official chronology shows a long progression from voice-interaction devices
      into AR glasses, YodaOS-XR, industrial mixed-reality hardware, consumer viewers, and
      AI glasses. Independent coverage adds two useful commercial markers: MarketsandMarkets
      reported more than $1 million of Kickstarter pledges in four days in September 2025,
      while Wareable reported a global $299 launch for the displayless AI Glasses Style in
      January 2026. The timeline demonstrates repeated product shipping, but it is not a
      revenue bridge and does not establish margins, repeat purchase, returns, or channel
      sell-through. Crowdfunding pledges and backer counts are demand signals, not customer
      counts or cash available for corporate operations.
    claimRefs: ["CO009", "CO010", "CO015", "CO016"]
    figureRefs: ["FO001"]
  - id: "valuation-position-and-trust-risk"
    title: "Valuation evidence, category position, and trust risk"
    body: >-
      The retained evidence contains approximate $1 billion valuation references in a
      September 2025 company article and June 2026 third-party coverage, but neither source
      supplies a financing date, round terms, post-money basis, share count, debt schedule,
      or investor list. A September 2026 company release also relayed a Counterpoint ranking
      of 41% shipment share in the display-enabled AR and AI glasses segment. MIXED cautioned
      that displayless models represented 96% of all AI-glasses shipments and that the
      underlying segment table, unit totals, and competitor ranking were not public. Separately,
      BigGo reported backlash over covert recordings and Rokid's June 8 cleanup response.
      Together, these facts support product relevance but not a broad-market leadership or
      financing conclusion; privacy controls and capital structure remain central diligence
      issues.
    claimRefs: ["CO007", "CO008", "CO011", "CO012", "CO013", "CO014"]
callouts:
  - calloutType: "risk"
    title: "Privacy governance is an operating issue, not a hypothetical"
    body: >-
      BigGo reported covert-recording content inside Rokid's community and a subsequent
      company cleanup and technical-governance response. Diligence should test indicator
      tamper resistance, moderation controls, incident escalation, and regional privacy
      compliance before treating consumer-camera adoption as frictionless.
    claimRefs: ["CO013", "CO014"]
