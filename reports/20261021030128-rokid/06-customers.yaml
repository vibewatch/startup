schemaVersion: "report-v2"
artifact: customers
slug: rokid
runDate: "2026-10-21"
company:
  name: Rokid
chapter:
  number: 6
  title: Customers
  summary: >-
    Rokid shows real consumer adoption signals through company-reported active use,
    crowdfunding, display-enabled shipment share, developer growth, and expanding
    retail and creator channels. The evidence does not disclose named production
    customers with measured outcomes, retention metrics, or customer concentration,
    so adoption breadth is more visible than durability or revenue quality.
sections:
  - id: customer-segments
    title: Customer segments and buying surfaces
    body: >-
      Rokid addresses several distinct populations rather than one homogeneous
      customer base. Consumer buyers span display-enabled AI/AR glasses and the
      screenless $299 AI Glasses Style, while museum and cultural-tourism operators
      represent an older enterprise use case. Developers are both users and
      ecosystem suppliers, and the 2026 creator program adds a subsidized
      acquisition cohort rather than a proven recurring customer segment. The
      official Australia page claims service in more than 100 countries and
      millions of users, but does not define active users, paying customers, or
      geographic revenue. Segment economics, payer identity, and revenue mix
      therefore remain undisclosed even though route-to-market breadth is visible.
    claimRefs: [CU006, CU011, CU013, CU014]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory is visible but denominator-light
    body: >-
      The strongest adoption indicators point in the same direction but measure
      different populations. A September 2025 company article claimed more than
      250,000 active users and 2.75 hours of average daily usage, while a September
      2026 company release said the developer community had reached 35,000 members.
      Crowdfunding supplied transaction-like demand evidence: Rokid reports more
      than 5,000 Kickstarter backers and over $3.6 million raised, plus 2,454 Taiwan
      backers and NT$62.3 million. Separately, Rokid relayed Counterpoint's 41%
      shipment share for display-enabled AR and AI glasses in H1 2026. These are not
      a common funnel, and none discloses recognized revenue, repeat purchase, or
      cohort retention.
    claimRefs: [CU001, CU003, CU004, CU005, CU008, CU009, CU010]
    tableRefs: [TU002]
  - id: named-proof
    title: Public proof stops short of named customer outcomes
    body: >-
      Publicly retained evidence identifies buyer cohorts, campaigns, and channels,
      not named production customers with independently measured results. Kickstarter
      and Taiwan crowdfunding demonstrate willingness to pre-order, but backer counts
      do not prove sustained use. The Thousand Creator Program is a customer-
      acquisition initiative offering 1,000 packs free or at a creator price; it
      does not yet establish paid conversion or creator retention. Retail entry in
      Germany and France demonstrates distribution availability rather than sell-
      through. Accordingly, the named-proof table is a sample of disclosed adoption
      surfaces, not an exhaustive customer roster, and every row preserves the
      distinction between campaign participation, channel availability, and
      production use.
    claimRefs: [CU009, CU010, CU012, CU014, CU016]
    tableRefs: [TU003]
  - id: durability-expansion-risk
    title: Expansion channels are emerging; durability remains unproven
    body: >-
      Rokid is widening acquisition through European retail, a lower-priced global
      Style launch, and a U.S. creator program. Developer growth from a
      company-reported 6,200 members in 2025 to 35,000 in 2026 may enlarge the
      application ecosystem, but the figures lack a consistent definition and do
      not show developer activity or monetization. More importantly, no retained
      source provides GRR, NRR, churn, renewal, contract length, repeat purchase, or
      top-customer concentration. The privacy controversy reported by BigGo also
      exposes a trust risk in the adoption journey: community misuse prompted
      cleanup and promised safeguards, but the customer impact is unquantified.
      Expansion evidence is therefore credible at the channel level while revenue
      durability and concentration remain material diligence gaps.
    claimRefs: [CU007, CU008, CU012, CU013, CU014, CU015, CU016]
    figureRefs: [FU001]
tables:
  - id: TU001
    title: Customer segmentation by buyer, user, and route to market
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Public scale evidence
      - Strategic or revenue value
      - Diligence gap
    rows:
      - - Display-enabled consumer
        - Individual buyer and wearer
        - Translation, navigation, teleprompting, and contextual overlays
        - "41% company-relayed H1 2026 share within display-enabled AR and AI glasses"
        - Consumer hardware sales and ecosystem entry
        - Unit shipments, repeat purchase, returns, and recognized revenue are not disclosed
      - - Screenless creator / consumer
        - Individual consumer or creator; creator packs may be subsidized
        - First-person capture, audio, and AI assistance
        - "AI Glasses Style launched globally at $299; 1,000-pack creator program announced"
        - Lower-price acquisition surface and creator-led awareness
        - Paid conversion, promotion economics, and retained use are not disclosed
      - - Museums and cultural tourism
        - Venue or solution buyer; visitor is the end user
        - Guided and immersive AR experiences
        - "Rokid claimed 99% museum AR market share in a September 2025 article"
        - Enterprise reference base and vertical specialization
        - Customer names, contract values, renewals, and methodology are absent
      - - Developers and ecosystem builders
        - Developer or partner builds applications; end customers consume them
        - AI agents, wearable applications, and localized experiences
        - "Company-reported community grew from 6,200+ in 2025 to 35,000 in 2026"
        - Ecosystem breadth and potential software distribution
        - Active-developer definition, retention, and monetization are not disclosed
    notes: >-
      Segment boundaries combine company disclosures and independent launch coverage;
      scale figures use different dates and denominators and must not be summed.
    claimRefs: [CU001, CU006, CU007, CU008, CU013, CU014]
  - id: TU002
    title: Customer growth and adoption indicators
    columns:
      - Metric
      - Reported value
      - Period / date
      - Attribution
      - Confidence
      - Implication and missing denominator
    rows:
      - - Active users
        - "250,000+"
        - "September 2025 article"
        - Rokid company article
        - Low
        - Indicates claimed use at scale; active-user definition, geography, and paying share are absent
      - - Average daily usage
        - "2.75 hours"
        - "September 2025 article"
        - Rokid company article
        - Low
        - Suggests engagement; cohort, observation window, and measurement method are absent
      - - Developer community
        - "6,200+ to 35,000"
        - "2025 article to September 2026 release"
        - Rokid company disclosures
        - Medium
        - Indicates ecosystem growth; definitions and active-developer rate are not disclosed
      - - Kickstarter demand
        - "Over $3.6 million from more than 5,000 backers"
        - "45-day campaign disclosed on current Australia page"
        - Rokid Australia
        - Medium
        - Transaction-like pre-order signal; fulfillment, returns, and repeat demand are absent
      - - Taiwan crowdfunding
        - "NT$62,267,104 from 2,454 backers"
        - "December 2025"
        - Rokid Australia
        - Medium
        - Localized demand signal; net revenue and delivered-unit count are absent
      - - Display-enabled shipment share
        - "41%"
        - "H1 2026"
        - Counterpoint ranking relayed by Rokid and discussed by MIXED
        - Medium
        - Segment leadership signal; unit count, category table, and total-market share are absent
    notes: >-
      Metrics describe different populations, periods, currencies, and units; they
      are presented independently and do not form a conversion funnel.
    claimRefs: [CU001, CU004, CU005, CU007, CU008, CU009, CU010]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / cohort
      - Segment
      - Deployment or use case
      - Production vs. pilot
      - Public outcome
      - Limitation
    rows:
      - - Kickstarter backers
        - Consumer early adopters
        - Pre-order funding for Rokid Glasses
        - Commercial crowdfunding campaign
        - "More than 5,000 backers and over $3.6 million"
        - Backers are not named references; fulfillment and retained use are not disclosed
      - - Taiwan crowdfunding backers
        - Consumer early adopters in Taiwan
        - Local pre-order campaign
        - Commercial crowdfunding campaign
        - "2,454 backers and NT$62,267,104"
        - Net sales, delivery status, returns, and repeat purchase are not disclosed
      - - Thousand Creator Program participants
        - U.S. established and emerging creators
        - First-person content creation with AI Glasses Style
        - Acquisition program announced in August 2026
        - "1,000 packs offered free or at a creator price"
        - Enrollment, content output, paid conversion, and retention are not yet disclosed
      - - Germany and France retail channels
        - European consumers
        - Local retail discovery and purchase
        - Retail availability reported in September 2026
        - Local retailer partnerships and dedicated websites
        - Retailers, sell-through, returns, and channel concentration are not disclosed
    notes: >-
      Sample covers only customer-like cohorts and channels named in the assigned
      public sources; it is not a list of named production customers.
    enumerationScope:
      coverage: sample
      basis: >-
        Public customer and channel evidence retained for this chapter through
        2026-10-21, excluding undisclosed private customer relationships.
    claimRefs: [CU009, CU010, CU012, CU014, CU016]
figures:
  - id: FU001
    title: Evidence-backed customer adoption journey
    type: journey-map
    summary: >-
      Rokid has public signals across awareness, trial, purchase, use, and ecosystem
      expansion, but renewal and concentration are not publicly measurable.
    data:
      items:
        - label: Awareness
          detail: Global $299 Style launch broadens the addressable consumer surface.
          touchpoints:
            - CES 2026 debut
            - Independent launch coverage
        - label: Trial and acquisition
          detail: Creator subsidies lower trial cost but do not establish paid conversion.
          touchpoints:
            - Thousand Creator Program
            - Free eligibility or $199 creator price
        - label: Purchase intent
          detail: Crowdfunding provides transaction-like demand evidence before retention is known.
          touchpoints:
            - Kickstarter
            - Taiwan crowdfunding
        - label: Claimed active use
          detail: Company-reported active users and daily time suggest engagement without cohort definitions.
          touchpoints:
            - "250,000+ active users"
            - "2.75 hours average daily usage"
        - label: Ecosystem expansion
          detail: Developer membership and European retail widen applications and distribution.
          touchpoints:
            - "35,000 global developer members"
            - Germany and France retail
        - label: Trust and renewal
          detail: Privacy misuse and missing retention metrics prevent a durable-customer conclusion.
          touchpoints:
            - Community content cleanup
            - NRR, GRR, churn, and renewal not disclosed
    approximationNotes: >-
      Stages summarize distinct public signals and are not a conversion funnel;
      no transition rates, shared cohort, or revenue denominator are available.
    claimRefs: [CU004, CU005, CU008, CU009, CU010, CU012, CU013, CU014, CU015, CU016]
callouts:
  - calloutType: strength
    title: Multiple demand signals exist
    body: >-
      Crowdfunding, company-reported active use, developer growth, and display-enabled
      shipment share provide multiple but non-comparable indicators of adoption.
    claimRefs: [CU001, CU004, CU008, CU009, CU010]
  - calloutType: risk
    title: Customer quality is not yet auditable
    body: >-
      No retained source discloses named production outcomes, retention, recognized
      revenue by segment, or customer and channel concentration.
    claimRefs: [CU016]
