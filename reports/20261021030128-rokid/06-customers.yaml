  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: >-
        GRR, NRR, churn, repeat-purchase rate, renewal rate, contract duration,
        cohort retention, satisfaction, and product return data by customer segment.
      whyItMatters: >-
        Acquisition and shipment indicators cannot establish durable demand,
        customer lifetime value, or recurring revenue quality.
      diligencePath: >-
        Request management's monthly cohort tables, renewal schedules, return and
        warranty data, and reconciliations from users to paying accounts and revenue.
      relatedQuestionRefs: [QU004]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: >-
        Named production customers, deployment dates, paid versus pilot status,
        measured outcomes, contract scope, and references authorized for diligence.
      whyItMatters: >-
        Public campaigns and channels show demand surfaces but cannot validate
        enterprise production use or customer-level realized value.
      diligencePath: >-
        Obtain a customer roster and select references across consumer distribution,
        museums, enterprise deployments, developers, and international channels.
      relatedQuestionRefs: [QU003, QU006]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: >-
        Revenue by top customer, channel, geography, product line, and cohort,
        including distributor sell-through and returns.
      whyItMatters: >-
        Retail and geographic expansion cannot be valued without knowing channel
        productivity, dependence, working-capital exposure, and concentration.
      diligencePath: >-
        Request audited customer and channel concentration schedules, geographic
        revenue, sell-in versus sell-through, receivable aging, and return rights.
      relatedQuestionRefs: [QU005]
    - type: missing-source
      severity: material
      topic: adoption-denominators
      missingEvidence: >-
        Counterpoint's underlying category table, Rokid unit shipments, active-user
        definitions, developer activity, and a reconciliation of backers to deliveries.
      whyItMatters: >-
        Current public metrics use different populations and cannot be translated
        into revenue, market-wide share, or a comparable adoption funnel.
      diligencePath: >-
        Obtain the Counterpoint dataset or methodology and management schedules
        reconciling shipments, activated devices, active users, and paying customers.
      relatedQuestionRefs: [QU002]
