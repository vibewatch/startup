company:
  name: Rokid
chapter:
  number: 4
  title: Financials
  summary: >-
    Rokid has credible demand indicators across crowdfunding, active-use claims, global
    product launches, and display-glasses shipment share, but those indicators do not
    establish recognized revenue or durable gross profit. The retained public evidence
    does not disclose audited revenue, gross margin, unit economics, current cash, burn,
    or runway, making financial underwriting dependent on private diligence.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and public traction
    body: >-
      The observable model is hardware-led and spans consumer display glasses, a $299
      screenless AI Glasses Style product, and enterprise-oriented industrial devices.
      Rokid also describes a software and cloud-AI ecosystem, but the retained sources do
      not establish whether software is separately priced, bundled into hardware, or
      monetized through subscriptions or services. Crowdfunding offers the clearest public
      demand signal: independent reporting recorded more than US$2 million in 14 days,
      while Rokid's Australian site later reported more than US$3.6 million from over
      5,000 backers in 45 days. These amounts are campaign commitments or proceeds, not
      audited recognized revenue, ARR, or recurring demand. Official claims of more than
      250,000 active users and an externally framed 41% share of display-equipped AI
      glasses strengthen the traction case, but neither source supplies units, revenue,
      cohort retention, or a reconciled reporting perimeter.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI010, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: margin-and-unit-economics
    title: Margin structure and unit-economics gaps
    body: >-
      Physical smart-glasses sales expose Rokid to component, assembly, inventory,
      logistics, returns, warranty, and after-sales service costs. The sources describe
      optical displays, cameras, processors, prescription fulfillment, and enterprise
      deployments, but they provide no bill of materials, net average selling price,
      channel discount, gross margin, return rate, warranty reserve, or service cost.
      The $299 Style list price is therefore not a reliable blended ASP: Rokid also sells
      display-equipped and industrial products with different hardware and support
      requirements. Nor can crowdfunding efficiency be converted into CAC or payback,
      because campaign marketing spend, platform fees, fulfillment costs, cancellations,
      and subsequent repeat purchases are absent. The correct underwriting posture is to
      treat public pricing and campaign totals as demand and positioning evidence while
      leaving contribution margin, sales efficiency, and working-capital conversion
      unmodeled until management supplies product- and channel-level data.
    claimRefs: [CI003, CI009, CI010, CI013, CI016]
    tableRefs: [TI003]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      Historical financing demonstrates access to capital but does not prove current
      liquidity. Forbes reported a nearly US$70 million government-led round in 2024 and
      linked the transaction to an enterprise office, ecosystem hub, and R&D center in
      Hefei; an official Rokid article separately described 13 rounds and C+ stage status.
      In June 2026, the founder characterized the company's ammunition reserves as ample,
      yet the same account supplied no cash balance, monthly burn, debt, runway, or
      committed IPO proceeds. The privacy controversy and related content cleanup also
      illustrate a plausible compliance and moderation cost channel at a sensitive
      capital-markets moment, without providing a quantifiable financial impact. The
      financial verdict is therefore mixed: market demand and financing access are
      plausible strengths, but revenue quality, gross-margin durability, working-capital
      intensity, and forward capital sufficiency cannot be underwritten from public data.
      Audited statements and a current liquidity bridge are prerequisites for valuation
      conviction.
    claimRefs: [CI007, CI008, CI011, CI012, CI014, CI015]
