      - [Screenless AI Glasses Style, "One-time hardware sale per device", "US$299 global list price", "Independent launch coverage; realized pricing undisclosed", "Units, discounts, net ASP, gross margin, and attach revenue"]
      - [Enterprise and industrial products, "Hardware plus possible deployment or service contract", "Commercial availability described; contract value undisclosed", "Independent financing coverage and company product descriptions", "Contract samples, backlog, renewal terms, concentration, and service burden"]
      - ["Software, cloud AI, and ecosystem", "Bundled or separately monetized basis not established", null, "Company describes the ecosystem but not monetization", "Software revenue, subscription terms, inference costs, developer economics, and attach rate"]
    notes: "Campaign amounts and list prices are public demand or positioning signals, not audited recognized revenue; null means no value was found in the eight retained sources."
    claimRefs: [CI001, CI002, CI003, CI004, CI010, CI016]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Offer, Public price or value, Basis, Realized-pricing limitation, Underwriting implication]
    rows:
      - [Rokid AI Glasses Style, "US$299", "Global list price reported at launch", "Discounts, returns, taxes, and channel take are undisclosed", "Useful for positioning only; not a net ASP"]
      - [Rokid Glasses campaign, "More than US$2M in 14 days", "Independent Kickstarter reporting", "Campaign proceeds are not reconciled to shipped units or recognized revenue", "Evidence of demand velocity, not recurring revenue"]
      - [Rokid Glasses campaign, "More than US$3.6M from 5,000+ backers in 45 days", "Company-issued campaign result", "Pledges, refunds, fulfillment costs, and accounting treatment are undisclosed", "Corroborates campaign scale but not margin"]
      - [Display and enterprise portfolio, null, "Products described in official and independent sources", "No retained source provides current SKU or contract pricing", "Blended ASP and mix cannot be modeled"]
    notes: "Values retain their original campaign windows and denominators; company-issued and independent observations are labeled separately, and null denotes unavailable pricing."
    claimRefs: [CI001, CI002, CI003, CI010, CI016]
  - id: TI003
    title: Unit economics and capital adequacy checklist
    columns: [Metric, Public value, Confidence, Why it matters, Specific diligence request]
    rows:
      - [Recognized revenue and revenue mix, null, Low, "Separates campaign demand from accounting revenue and recurring components", "Audited monthly revenue by product, geography, channel, and hardware/software/service mix"]
      - [Gross and contribution margin, null, Low, "Tests whether optical hardware and service obligations can produce durable profit", "SKU-level COGS, freight, channel fees, cloud costs, warranty, returns, and contribution margin"]
      - [Net ASP and discounting, null, Low, "Connects list prices to actual monetization and mix", "Invoices or cohort data showing list price, discount, refund, tax, and realized ASP"]
      - ["CAC, sales cycle, and payback", null, Low, "Determines whether consumer campaigns and enterprise selling scale efficiently", "Paid acquisition spend, campaign fees, enterprise sales cycle, win rate, CAC, and payback by channel"]
      - [Working capital and inventory, null, Low, "Hardware growth can consume cash before revenue collection", "Inventory aging, supplier terms, deposits, receivables, purchase commitments, and cash-conversion cycle"]
      - ["Cash, burn, debt, and runway", null, Low, "Determines financing dependency and next-round timing", "Current unrestricted cash, monthly net burn, debt schedule, capex plan, minimum cash, and downside runway"]
    notes: "All values are null because the retained public sources do not disclose the metric; confidence describes public-data availability, not management's internal measurement quality."
    claimRefs: [CI009, CI012, CI013, CI016]
figures:
  - id: FI001
    title: Revenue-to-gross-profit evidence bridge
    type: flow
    summary: Public evidence reaches demand and list pricing, while the accounting and cost steps required to establish gross profit remain undisclosed.
    data:
      nodes:
        - id: demand
          label: Consumer or enterprise demand
          detail: "Campaign backing, active-user claims, product launches, and enterprise use cases"
        - id: order
          label: Order or contract
          detail: "Crowdfunding pledge, retail purchase, or enterprise agreement"
        - id: billings
          label: Gross billings or pledged value
          detail: "Public campaign totals and a US$299 list price are observable"
        - id: recognized-revenue
          label: Recognized revenue
          detail: "Timing, cancellations, fulfillment, and revenue recognition are not disclosed"
        - id: delivery-costs
          label: Product and service costs
          detail: "Components, channel fees, cloud use, returns, warranty, and support are not disclosed"
        - id: gross-profit
          label: Gross profit
          detail: "Cannot be calculated from retained public evidence"
      edges:
        - from: demand
          to: order
        - from: order
          to: billings
        - from: billings
          to: recognized-revenue
        - from: recognized-revenue
          to: delivery-costs
        - from: delivery-costs
          to: gross-profit
    approximationNotes: "The sequence is conceptual and contains no estimated conversion rates, revenue values, or margins."
    claimRefs: [CI001, CI002, CI003, CI009, CI010, CI013, CI016]
callouts:
  - calloutType: risk
    title: Public traction is not a financial statement
    body: >-
      Campaign proceeds, active-user counts, and category shipment share cannot substitute
      for recognized revenue, gross margin, cash generation, or audited balance-sheet data.
    claimRefs: [CI001, CI002, CI005, CI006, CI009, CI010]
  - calloutType: recommendation
    title: Require a current liquidity and margin bridge
    body: >-
      Before underwriting valuation, obtain audited revenue and COGS by product plus a
      current cash-to-runway bridge that includes debt, inventory, capex, and downside burn.
    claimRefs: [CI009, CI012, CI013]
