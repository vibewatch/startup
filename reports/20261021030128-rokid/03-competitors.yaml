      - ["AI model choice", "ChatGPT, Gemini, DeepSeek, and Qwen reported", "ChatGPT, DeepSeek, and Qwen reported", "Unknown in assigned evidence", "Unknown on a controlled comparable basis"]
      - ["Translation and navigation", "Both claimed as core uses", "Google Maps and Microsoft translation reported", "Unknown in assigned evidence", "Available through phones, but no pooled workflow comparison"]
      - ["First-person capture", "12 MP camera described in company material", "12 MP sensor and up to 10-minute recording reported", "Meta three-minute recording limit reported by Wareable", "Phone capture is visible and handheld; no quantitative comparison"]
      - ["Developer surface", "YodaOS, AIUI, and developer community claimed", "Agent Store and AIUI support reported", "Unknown in assigned evidence", "Internal integration remains possible; cost and complexity unknown"]
      - ["Privacy and trust", "Recording indicator and protection upgrades reported after controversy", "Company claims local minimization and encrypted communication", "Unknown in assigned evidence", "No cross-vendor privacy benchmark in pool"]
    notes: >-
      Cells summarize retained sources as of the run date; "unknown" means the
