company:
  name: "Rokid"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Rokid competes across two different jobs: display-enabled AI+AR utility and
    screenless ambient capture, where the assigned evidence identifies Meta as
    the category incumbent. Rokid's open-model positioning, display capability,
    developer stack, and optical-channel expansion are plausible differentiators,
    but public competitor-level shipment, funding, retention, and switching data
    are too sparse to establish a durable moat.
sections:
  - id: "landscape-and-substitutes"
    title: "Competitive landscape and substitutes"
    body: >-
      The competitive boundary is wider than branded AR eyewear. Rokid Glasses
      addresses display-enabled translation, navigation, teleprompting, visual
      assistance, and first-person capture, while Rokid Style moves down-market
      into screenless ambient glasses. Wareable describes that latter category
      as currently dominated by Meta, making Meta the clearest named direct
      competitor in the assigned evidence. Smartphones and earbuds remain the
      status quo for navigation, translation, notifications, search, and capture;
      enterprise buyers can also continue with handheld devices, single-purpose
      viewers, or internally integrated workflows. Large platform owners are
      likely entrants because Rokid itself publicly frames Meta's participation
      as category-building. The available sources do not support a complete
      named roster, competitor funding comparison, or market-share table beyond
      Rokid's narrow display segment, so category-level alternatives are shown
      as such rather than presented as verified competitor profiles.
    claimRefs: ["CP001", "CP003", "CP005", "CP010", "CP016"]
    tableRefs: ["TP001"]
    figureRefs: ["FP001"]
  - id: "capability-pricing-and-distribution"
    title: "Capability, pricing, and distribution"
    body: >-
      Rokid's sharpest product distinction is the combination of a lightweight
      display and model choice. Its company materials describe a 49-gram
      waveguide product with translation, navigation, teleprompting, capture,
      and multiple assistants, while Wareable reports that the 38.5-gram
      screenless Style can switch among several AI models and record for longer
      than Meta's current hardware. Public pricing spans creator acquisition
      offers from free or $199, a $259 promotional floor, a $299 Style list
      price, and $599 or $698 display-glasses configurations. Those are list or
      promotional prices, not realized average selling prices. Distribution
      evidence points to e-commerce, optical partners, local European retail,
      developer tools, and a creator-seeding program. This creates multiple
      routes to market, but the pool provides no channel productivity,
      sell-through, discount depth, support-cost, or contract evidence with
      which to compare distribution power against Meta or another incumbent.
    claimRefs: ["CP002", "CP003", "CP006", "CP007", "CP008", "CP009", "CP012", "CP013", "CP015"]
    tableRefs: ["TP002", "TP003"]
  - id: "durability-and-displacement-risk"
    title: "Moat durability and displacement risk"
    body: >-
      The defensibility case rests on an integrated hardware-software stack,
      display optics, prescription support, developer tooling, and an open
      assistant strategy rather than on demonstrated customer lock-in. YodaOS,
      AIUI, and the Agent Store could raise switching costs if third-party
      applications and workflows become valuable, yet public developer counts
      are company-issued and no retention, application usage, paid developer
      economics, or migration-cost evidence is available. The shipment headline
      is also easy to overread: Mixed News reports that displayless devices were
      96% of H1 2026 AI-glasses shipments and notes that Rokid's claimed 41%
      share applies only to the remaining display segment, without a published
      segment table or unit count. Privacy is a further competitive variable.
      BigGo's report of covert recordings and Rokid's subsequent cleanup shows
      that technical capability can create trust costs; the pool contains no
      cross-vendor benchmark proving Rokid's safeguards are stronger. On current
      evidence, differentiation is credible at product level but moat durability
      remains unproven.
    claimRefs: ["CP007", "CP010", "CP011", "CP012", "CP014", "CP015", "CP016"]
