      - ["Rokid Style spring sale", "March 24-April 30, 2026", "$279", "Company website and Amazon promotion", "Temporary discount; not evidence of steady-state pricing"]
      - ["Rokid Style with code", "March 24-April 30, 2026", "$259", "Additional $20 promotional code", "Shows acquisition discounting; redemption and margin unknown"]
      - ["Creator Style Pack", "Thousand Creator Program, August 2026", "$199", "Emerging creators; includes Capsule Battery Pack", "Subsidized creator acquisition rather than normal consumer price"]
      - ["Creator Style Pack", "Thousand Creator Program, August 2026", "Free on application", "Creators with more than 1,000 followers; eligibility and availability apply", "Seeding strategy; no conversion or earned-media ROI disclosed"]
      - ["Rokid Glasses", "New York launch coverage, September 2025", "$599 / $698", "Base glasses / glasses with case", "Display premium over Style; no realized ASP or return-rate data"]
      - ["Rumored Meta display model", "September 2025 comparison", "About $800 (rumored)", "Unreleased comparison point", "Directional only; not verified list pricing"]
    notes: >-
      Prices are public list, bundle, or promotional figures from dated sources;
      they are not revenue, realized ASP, gross margin, or contract pricing, and
      the Meta value is explicitly a rumor.
    claimRefs: ["CP005", "CP008", "CP009"]
figures:
  - id: "FP001"
    title: "Display functionality versus public price tier"
    type: "quadrant"
    summary: >-
      Rokid spans low-priced screenless acquisition offers and higher-priced
      display products, while the only external display comparison is rumored.
    data:
      xAxis:
        label: "Display functionality"
        min: 1
        max: 5
        low: "Screenless / ambient"
        high: "In-view overlay"
        description: "Ordinal score from source-documented display presence"
        scale: "ordinal"
      yAxis:
        label: "Price accessibility"
        min: 1
        max: 5
        low: "Higher or less accessible"
        high: "Lower or more accessible"
        description: "Ordinal bins based on cited public price points"
        scale: "ordinal"
      points:
        - label: "Style creator free"
          x: 1
          y: 5
          detail: "Conditional creator-seeding offer; not a standard retail price."
        - label: "Style creator $199"
          x: 1
          y: 5
          detail: "Creator-program pack for applicants below the free threshold."
        - label: "Style promo $259"
          x: 1
          y: 5
          detail: "Time-limited spring campaign after checkout code."
        - label: "Style list $299"
          x: 1
          y: 5
          detail: "Global screenless product list price reported by Wareable."
        - label: "Glasses base $599"
          x: 5
          y: 3
          detail: "Display-enabled Rokid Glasses public starting price."
        - label: "Glasses bundle $698"
          x: 5
          y: 2
          detail: "Display glasses with case."
        - label: "Meta display rumor $800"
          x: 5
          y: 1
          detail: "Rumored comparison only; not a verified or released price."
    approximationNotes: >-
      X is ordinal: 1 means source-described screenless use and 5 means an
      in-view display. Y buckets public prices: 5 for $299 or less, 3 for $599,
      2 for $698, and 1 for about $800. Promotions are separate observations,
      not separate products; the Meta point is explicitly rumored.
    claimRefs: ["CP001", "CP005", "CP006", "CP008", "CP009"]
callouts:
  - calloutType: "strength"
    title: "A two-lane portfolio"
    body: >-
      Rokid can compete in display-led AR utility and in lower-priced screenless
      ambient AI without abandoning its operating-system and developer strategy.
    claimRefs: ["CP001", "CP005", "CP007", "CP015"]
  - calloutType: "risk"
    title: "Leadership is narrower than the headline"
    body: >-
      The 41% figure concerns the display segment, while an independent analysis
      says displayless products represented 96% of all H1 2026 AI-glasses
      shipments and the underlying ranking table was not public.
    claimRefs: ["CP010", "CP011"]
