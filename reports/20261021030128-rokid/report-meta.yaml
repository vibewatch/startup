summary:
  headline: >-
    Rokid has credible product and channel momentum, but privacy-control questions and the absence of audited economics,
    current capitalization, and primary exit evidence make it a high-risk company to track rather than underwrite today.
  overallScore: 5.4
  recommendation: track
  confidence: low
  riskRating: high
  valuationStance: unknown
  keyMetrics:
    valuationUsdM: 1000
    revenueRunRateUsdM: null
    arrUsdM: null
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: null
    customerCount: null
    headcount: null
  topStrengths:
    - >-
      A long product-shipping history spans eleven company-reported generations of AI and AR glasses and multiple
      current consumer and enterprise form factors.
    - >-
      Crowdfunding, European retail entry, creator programs, and company-reported reach across more than 100 countries
      show broad go-to-market activity.
    - >-
      YodaOS, AIUI, the Agent Store, and a growing developer community create a plausible full-stack differentiation
      thesis beyond standalone eyewear hardware.
  topRisks:
    - >-
      No audited revenue, gross margin, contribution margin, cash, burn, runway, or working-capital data is available
      for underwriting.
    - >-
      A documented covert-recording controversy exposed privacy and trust risk, while preventive controls have not been
      independently validated.
    - >-
      The reported 41% shipment share applies to a narrow display-enabled category and lacks a public underlying table
      or unit denominator.
    - >-
      Hardware quality, warranty, return, battery, supplier-concentration, and software-support evidence is not publicly
      established.
    - >-
      Current security terms, fully diluted capitalization, debt, and primary evidence of an HKEX process are
      unavailable.
  unresolvedGaps:
    - >-
      Audited financial statements and SKU-, channel-, and geography-level revenue, gross margin, contribution margin,
      cash-flow, and working-capital schedules.
    - >-
      Current cap table, financing agreements, debt schedule, liquidation preferences, anti-dilution rights, cash
      balance, burn, and downside runway.
    - >-
      Cohort retention, repeat purchase, returns, warranty claims, customer concentration, channel sell-through, and
      named production-customer outcomes.
    - >-
      Independent security and privacy testing, data-flow and retention documentation, recording-indicator bypass tests,
      and a complete legal and regulatory register.
    - >-
      Counterpoint's underlying category definitions, shipment units, and full vendor table, reconciled to Rokid
      shipments, activations, active users, and paying customers.
    - An HKEX filing, prospectus, exchange correspondence, or other primary evidence of listing status and timetable.
