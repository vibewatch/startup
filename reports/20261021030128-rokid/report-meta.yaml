companyProfile:
  summary: >-
    Founded in Hangzhou in 2014, Rokid develops consumer and enterprise smart glasses, companion software, YodaOS, AI
    tooling, and a developer distribution layer. Its public record shows repeated product launches, international
    campaigns, retail expansion, and ecosystem investment, but most scale metrics are company-issued and the retained
    evidence does not disclose audited revenue, margins, cash, retention, or a current financing price.
