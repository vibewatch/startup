  productSummary: >-
    Display-equipped and screenless AI glasses, consumer AR viewers, enterprise industrial glasses, accessories,
    companion applications, YodaOS, AIUI tooling, and an Agent Store.
  customerFocus: >-
    Consumers, creators, developers, retailers, cultural-tourism operators, and enterprise frontline teams using
