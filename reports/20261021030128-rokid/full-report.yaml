      - number: '5.2'
        title: Architecture and technical dependencies
        blocks:
          - type: paragraph
            body: >-
              The best-documented display-glasses design combines a first-person camera, Snapdragon AR1 compute, and a
              Micro-LED diffraction-waveguide display in a 49-gram frame. The Style line takes a different route: an
              independent report describes a 38.5-gram, displayless device using an NXP RT600 for low-power voice tasks
              and a Qualcomm AR1 for imaging and AI workloads. Above the hardware, YodaOS, AIUI, companion apps, and the
              Agent Store form the software and distribution layer. This architecture is specific enough to show where
              value can accrue, but it also exposes dependencies on chipset vendors, optical components, mobile
              connectivity, external model providers, app distribution, and battery accessories. No retained source
              quantifies component redundancy, field failure rates, or service-level performance.
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE013
              - CE014
