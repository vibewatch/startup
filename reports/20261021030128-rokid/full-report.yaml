      - CE006
      - CE013
      - CE016
  - id: FU001
    title: Evidence-backed customer adoption journey
    type: journey-map
    summary: >-
      Rokid has public signals across awareness, trial, purchase, use, and ecosystem expansion, but renewal and
      concentration are not publicly measurable.
    data:
      items:
        - label: Awareness
          detail: Global $299 Style launch broadens the addressable consumer surface.
          touchpoints:
            - CES 2026 debut
            - Independent launch coverage
        - label: Trial and acquisition
          detail: Creator subsidies lower trial cost but do not establish paid conversion.
          touchpoints:
            - Thousand Creator Program
            - Free eligibility or $199 creator price
        - label: Purchase intent
          detail: Crowdfunding provides transaction-like demand evidence before retention is known.
          touchpoints:
            - Kickstarter
            - Taiwan crowdfunding
        - label: Claimed active use
          detail: Company-reported active users and daily time suggest engagement without cohort definitions.
          touchpoints:
            - 250,000+ active users
            - 2.75 hours average daily usage
        - label: Ecosystem expansion
          detail: Developer membership and European retail widen applications and distribution.
          touchpoints:
            - 35,000 global developer members
            - Germany and France retail
        - label: Trust and renewal
          detail: Privacy misuse and missing retention metrics prevent a durable-customer conclusion.
          touchpoints:
            - Community content cleanup
            - NRR, GRR, churn, and renewal not disclosed
    approximationNotes: >-
      Stages summarize distinct public signals and are not a conversion funnel; no transition rates, shared cohort, or
      revenue denominator are available.
    claimRefs:
      - CU004
      - CU005
      - CU008
      - CU009
      - CU010
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
