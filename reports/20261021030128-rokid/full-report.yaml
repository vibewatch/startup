              - CO012
      - number: '1.2'
        title: Leadership, governance, and stakeholder dependence
        blocks:
          - type: paragraph
            body: >-
              The evidence identifies Misa Zhu as founder and chief executive and Zoro Shao as group vice president and
              global general manager. This establishes founder-led strategic control and a named global commercial
              leader, but it does not establish a complete executive team, board roster, voting structure, investor
              rights, or succession plan. Public-facing traction also creates stakeholder dependence beyond management:
              Kickstarter backers, users, developers, distribution partners, and people exposed to first-person
              recording all affect product adoption and trust. No retained source names current institutional investors,
              lenders, directors, or controlling shareholders. Diligence should therefore treat governance and
              capitalization as material private- evidence requests rather than fill the gaps from older reporting or
              company momentum.
            claimRefs:
              - CO005
              - CO006
