      - number: '5.3'
        title: Maturity, ecosystem, and differentiation
        blocks:
          - type: paragraph
            body: >-
              Rokid's strongest defensible product thesis is full-stack integration rather than a single component. The
              company says it has mass-produced 11 generations of glasses, holds more than 300 patents, and serves more
              than 100 countries; those figures are useful maturity signals but remain unaudited company claims. A 2026
              rollout of YodaOS, AIUI Studio, and the Agent Store, plus a creator program, shows an active attempt to
              make the hardware extensible. Rokid also reported 35,000 developer-community members, yet the retained
              evidence does not disclose active developers, published agents, downloads, retention, or third-party
              repository activity. Similarly, a reported 41% shipment share applies only to display-equipped AR and AI
              glasses, not the overall AI-glasses market, and the underlying Counterpoint table and unit volume were not
              public in the evidence set.
            claimRefs:
              - CE006
              - CE007
              - CE012
              - CE015
              - CE016
      - number: '5.4'
        title: Trust, reliability, and roadmap risk
        blocks:
          - type: paragraph
            body: >-
              Privacy is the most concrete product-risk signal in the retained material. BigGo reported that users had
              posted covert recordings made with Rokid glasses and that the company removed the content, tightened
              community oversight, and described future sensor and algorithm changes. This is evidence of a response,
              not proof that misuse is prevented. The source set contains no independent security audit, privacy
              certification, vulnerability-disclosure policy, software support period, uptime record, warranty-claim
              rate, return rate, battery-degradation data, or field-failure statistics. Roadmap underwriting should
              therefore depend on test reports and operating data rather than feature announcements. The technical
              diligence priority is to verify recording indicators and tamper resistance, then assess update support,
              cloud/model data flows, component continuity, and after-sales performance for each major SKU.
            claimRefs:
              - CE010
              - CE011
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: A credible full-stack product thesis
            body: >-
              Rokid combines differentiated glasses hardware with operating-system, agent-development, app, and
              accessory layers instead of competing only as a display accessory vendor.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE013
          - type: callout
            title: Trust and reliability remain under-evidenced
            body: >-
              A documented covert-recording controversy makes preventive privacy controls material, while public
              reliability, security-audit, and support-lifecycle data remain unavailable.
            calloutType: risk
            claimRefs:
              - CE010
              - CE011
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying surfaces
        blocks:
          - type: paragraph
            body: >-
              Rokid addresses several distinct populations rather than one homogeneous customer base. Consumer buyers
              span display-enabled AI/AR glasses and the screenless $299 AI Glasses Style, while museum and
              cultural-tourism operators represent an older enterprise use case. Developers are both users and ecosystem
              suppliers, and the 2026 creator program adds a subsidized acquisition cohort rather than a proven
              recurring customer segment. The official Australia page claims service in more than 100 countries and
              millions of users, but does not define active users, paying customers, or geographic revenue. Segment
              economics, payer identity, and revenue mix therefore remain undisclosed even though route-to-market
              breadth is visible.
            claimRefs:
              - CU006
              - CU011
              - CU013
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU006
              - CU007
              - CU008
              - CU013
              - CU014
      - number: '6.2'
        title: Adoption trajectory is visible but denominator-light
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption indicators point in the same direction but measure different populations. A
              September 2025 company article claimed more than 250,000 active users and 2.75 hours of average daily
              usage, while a September 2026 company release said the developer community had reached 35,000 members.
              Crowdfunding supplied transaction-like demand evidence: Rokid reports more than 5,000 Kickstarter backers
              and over $3.6 million raised, plus 2,454 Taiwan backers and NT$62.3 million. Separately, Rokid relayed
              Counterpoint's 41% shipment share for display-enabled AR and AI glasses in H1 2026. These are not a common
              funnel, and none discloses recognized revenue, repeat purchase, or cohort retention.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU007
              - CU008
              - CU009
              - CU010
      - number: '6.3'
        title: Public proof stops short of named customer outcomes
        blocks:
          - type: paragraph
            body: >-
              Publicly retained evidence identifies buyer cohorts, campaigns, and channels, not named production
              customers with independently measured results. Kickstarter and Taiwan crowdfunding demonstrate willingness
              to pre-order, but backer counts do not prove sustained use. The Thousand Creator Program is a customer-
              acquisition initiative offering 1,000 packs free or at a creator price; it does not yet establish paid
              conversion or creator retention. Retail entry in Germany and France demonstrates distribution availability
              rather than sell- through. Accordingly, the named-proof table is a sample of disclosed adoption surfaces,
              not an exhaustive customer roster, and every row preserves the distinction between campaign participation,
              channel availability, and production use.
            claimRefs:
              - CU009
              - CU010
              - CU012
              - CU014
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU012
              - CU014
              - CU016
      - number: '6.4'
        title: Expansion channels are emerging; durability remains unproven
        blocks:
          - type: paragraph
            body: >-
              Rokid is widening acquisition through European retail, a lower-priced global Style launch, and a U.S.
              creator program. Developer growth from a company-reported 6,200 members in 2025 to 35,000 in 2026 may
              enlarge the application ecosystem, but the figures lack a consistent definition and do not show developer
              activity or monetization. More importantly, no retained source provides GRR, NRR, churn, renewal, contract
              length, repeat purchase, or top-customer concentration. The privacy controversy reported by BigGo also
              exposes a trust risk in the adoption journey: community misuse prompted cleanup and promised safeguards,
              but the customer impact is unquantified. Expansion evidence is therefore credible at the channel level
              while revenue durability and concentration remain material diligence gaps.
            claimRefs:
              - CU007
              - CU008
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU004
              - CU005
              - CU008
              - CU009
              - CU010
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Multiple demand signals exist
            body: >-
              Crowdfunding, company-reported active use, developer growth, and display-enabled shipment share provide
              multiple but non-comparable indicators of adoption.
            calloutType: strength
            claimRefs:
              - CU001
              - CU004
              - CU008
              - CU009
              - CU010
          - type: callout
            title: Customer quality is not yet auditable
            body: >-
              No retained source discloses named production outcomes, retention, recognized revenue by segment, or
              customer and channel concentration.
            calloutType: risk
            claimRefs:
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              Privacy misuse ranks first because the assigned evidence documents a concrete incident, not merely a
              hypothetical concern. BigGo reported that covert footage of flight attendants was uploaded to Rokid's
              community and that similar videos were found, while Rokid responded with content removal, community
              oversight, and planned sensor and algorithm changes. Those actions show mitigation activity, but planned
              controls do not demonstrate prevention. Multi-jurisdiction privacy, recording-consent, and AI-data
              obligations therefore remain material. Public evidence in the assigned pool did not establish licenses,
              enforcement outcomes, litigation status, or independent security certifications, so those items are
              diligence gaps rather than evidence of a clean record.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR010
              - CR012
              - CR013
      - number: '7.2'
        title: Operational, quality, and security exposure
        blocks:
          - type: paragraph
            body: >-
              Rokid's product design combines cameras, waveguide displays, two processors, prescription optics,
              batteries, and several AI services. That architecture expands the number of integration and post-sale
              failure points even though the reviewed material did not document a recall or systemic outage.
              Company-issued material says data is processed locally where possible, minimized before AI workflows,
              encrypted in transit, and access-controlled; no independent audit in the assigned pool tests those claims.
              Independent coverage also calls battery life, comfort, and privacy continuing considerations. Warranty
              incidence, returns, field failure rates, security test results, and after-sale costs are therefore
              essential monitoring inputs.
            claimRefs:
              - CR004
              - CR009
              - CR012
              - CR013
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR009
              - CR012
              - CR013
              - CR016
      - number: '7.3'
        title: Ecosystem and counterparty dependencies
        blocks:
          - type: paragraph
            body: >-
              Rokid's open-platform positioning reduces dependence on one language model but does not remove external
              dependency. The glasses are described as supporting ChatGPT, Gemini, DeepSeek, and Qwen, while independent
              product coverage identifies Qualcomm, NXP, and Sony components. Changes in model access, cloud terms, chip
              availability, export controls, or component economics could affect functionality or margin. The U.S.
              rollout of YodaOS and Agent Store, local European retail partnerships, and creator subsidies broaden
              distribution but add execution surfaces. No assigned evidence quantifies supplier concentration,
              distributor concentration, minimum commitments, or switching time.
            claimRefs:
              - CR005
              - CR010
              - CR011
              - CR012
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: Financial-model risk and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              Public shipment leadership is not a substitute for economics. MIXED notes that the cited 41% share applies
              only to display-equipped AI glasses, while displayless products represented 96% of all AI-glasses
              shipments; it also found no public Counterpoint table, unit total, revenue figure, or runner-up ranking.
              Promotional creator pricing, complimentary units, and a second-pair discount demonstrate go-to-market
              investment but do not reveal sell-through or contribution margin. The thesis should break if privacy
              incidents recur after promised controls, material partners withdraw, field-failure or return rates exceed
              management targets, or verified gross margin and cash requirements cannot support continued hardware
              expansion.
            claimRefs:
              - CR006
              - CR007
              - CR010
              - CR011
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Privacy response is not prevention proof
            body: >-
              Rokid's cleanup, accessory-delisting effort, and planned technical controls are relevant mitigations, but
              investment confidence should depend on repeat-incident data and independent testing rather than policy
              statements alone.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment decision and price discipline
        blocks:
          - type: paragraph
            body: >-
              The appropriate public-evidence decision is track and research more, with low-to-medium confidence and
              high risk. Rokid presents a credible commercialization case: company-issued materials describe eleven
              generations of mass-produced glasses, reach across more than 100 countries, a large active-user base,
              crowdfunding demand, and claimed category leadership. Those signals establish product activity, not
              investable economics. They do not independently verify revenue, gross margin, working-capital needs,
              warranty costs, cash available, or retention. Price discipline therefore dominates company-quality
              assessment. No buy decision is supportable until a current security price and fully diluted capitalization
              can be tested against audited operating results, downside protections, and a credible exit path. The
              privacy controversy also raises a governance and adoption risk that should be reflected in underwriting
              rather than treated as a peripheral communications issue.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV011
              - CV013
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV008
              - CV010
              - CV013
              - CV015
      - number: '8.2'
        title: Financing context and comparable limits
        blocks:
          - type: paragraph
            body: >-
              The most recent valuation evidence in the assigned pool is historical, not current: Multiples records a $1
              billion January 2024 Series C valuation, while SiliconANGLE reported that the November 2023 Series C
              reached $112 million and valued Rokid at $1 billion. The database also contains internally inconsistent
              aggregate-funding descriptions, stating both $643 million across twelve rounds and, within a round
              narrative, total funding exceeding $228 million. Neither amount is cash available today. No assigned
              source discloses a 2026 financing price, fully diluted share count, liquidation preferences, debt,
              secondary mark, audited revenue, or EBITDA. Multiples lists robotics and automation companies as
              comparables, but their business models are not direct substitutes for consumer AI-AR eyewear and the page
              supplies no Rokid revenue denominator. Those records are useful reference points, not a defensible
              multiple-based appraisal.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV011
              - CV013
              - CV016
      - number: '8.3'
        title: Bull, base, and bear cases
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis should be milestone-based because a numeric equity range would imply precision the
              public record cannot support. In the bull case, independently verified shipment leadership, conversion of
              crowdfunding demand into profitable sell-through, and audited international growth would justify
              revisiting a premium to the stale $1 billion reference. The base case treats that mark only as a
              negotiation ceiling pending audited revenue, margins, cash, and capitalization. The bear case is triggered
              by weak sell-through, poor hardware economics, privacy-driven channel friction, delayed listing evidence,
              or punitive preference and dilution terms; under those conditions the correct public-evidence value is not
              a lower invented number but no transaction. Probability signals remain qualitative until the missing
              denominators are supplied.
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV007
              - CV011
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              BigGo reported restructuring associated with IPO preparation and a targeted 2026 Hong Kong listing window,
              but the assigned evidence contains no exchange filing or prospectus. Exit readiness is therefore
              unverified. Before underwriting, obtain audited financial statements, monthly unit shipments and
              sell-through by product and geography, gross margin after returns and warranty costs, channel inventory,
              cohort retention, current cash and debt, a fully diluted cap table, preference and anti-dilution terms,
              and any draft listing materials. Confirm the issuer and security to which any quoted valuation applies.
              Thesis-break triggers are failure to reconcile historical funding records, inability to demonstrate
              positive contribution margin at scale, material privacy or regulatory restrictions, repeated IPO delay
              without adequate runway, or terms that prevent target returns even if operations meet plan.
            claimRefs:
              - CV003
              - CV004
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              Track Rokid, but do not convert product enthusiasm into a buy recommendation until current security terms
              and audited operating economics support a target return.
            calloutType: recommendation
            claimRefs:
              - CV013
              - CV015
              - CV016
          - type: callout
            title: Historical funding is not liquidity
            body: >-
              Reported cumulative funding cannot be treated as cash available, and the assigned database contains
              conflicting aggregate totals that require reconciliation.
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
