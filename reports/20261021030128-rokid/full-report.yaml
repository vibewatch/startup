chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating scope
        blocks:
          - type: paragraph
            body: >-
              Rokid's official company history places its founding in Hangzhou in July 2014 and describes the business
              as a product platform spanning large-language-model tooling, computer vision, YodaOS, hardware, and
              solutions. That framing is more expansive than a single-device vendor: it combines eyewear, an operating
              layer, and developer-facing capabilities. Company materials claim 11 generations of mass-produced AI and
              AR glasses, more than 300 patents, and service across more than 100 countries reaching millions of users.
              These are issuer-reported scale indicators rather than audited operating statistics. The current source
              pool does not disclose revenue, ARR, headcount, a verified customer count, or a legal-entity location
              list, so those metrics remain null rather than being inferred from users, backers, countries, or developer
              registrations.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
