      - number: '1.4'
        title: Valuation evidence, category position, and trust risk
        blocks:
          - type: paragraph
            body: >-
              The retained evidence contains approximate $1 billion valuation references in a September 2025 company
              article and June 2026 third-party coverage, but neither source supplies a financing date, round terms,
              post-money basis, share count, debt schedule, or investor list. A September 2026 company release also
              relayed a Counterpoint ranking of 41% shipment share in the display-enabled AR and AI glasses segment.
              MIXED cautioned that displayless models represented 96% of all AI-glasses shipments and that the
              underlying segment table, unit totals, and competitor ranking were not public. Separately, BigGo reported
              backlash over covert recordings and Rokid's June 8 cleanup response. Together, these facts support product
              relevance but not a broad-market leadership or financing conclusion; privacy controls and capital
              structure remain central diligence issues.
            claimRefs:
              - CO007
              - CO008
              - CO011
              - CO012
              - CO013
              - CO014
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Privacy governance is an operating issue, not a hypothetical
            body: >-
              BigGo reported covert-recording content inside Rokid's community and a subsequent company cleanup and
              technical-governance response. Diligence should test indicator tamper resistance, moderation controls,
              incident escalation, and regional privacy compliance before treating consumer-camera adoption as
              frictionless.
            calloutType: risk
            claimRefs:
              - CO013
              - CO014
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market should be bounded as smart glasses worn in ordinary eyewear form factors, then split
              into displayless AI glasses and display-enabled AR/AI glasses. The broader category includes consumer
              capture, audio, assistant, translation, navigation, teleprompting, and enterprise hands-free workflows; it
              should not automatically include bulky XR headsets, generic smartphones, or all spatial-computing spend.
              This boundary matters because displayless products represented 96% of AI glasses shipments in H1 2026,
              while Rokid's reported 41% leadership applied only to the smaller display-carrying segment. Smartphones,
              earbuds, cameras, smartwatches, handheld scanners, and existing remote- assistance processes remain
              substitutes. A valuation case therefore needs segment-specific adoption and revenue evidence rather than
              applying a broad wearable-computing forecast directly to Rokid.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM010
              - CM014
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Available sizing supports directional growth, not a clean TAM/SAM/SOM. MarketsandMarkets projects global
              smart-glasses revenue from $1.2237 billion in 2025 to $4.1293 billion in 2030, while a separate report
              puts 2025 global smart-glasses sales at seven million units. Growth estimates are also period- and
              category-specific: Q1 2026 AR and displayless shipments reportedly rose 136% and 210% year over year,
              whereas H1 2026 AI-glasses and AR/AI-glasses shipments reportedly rose 263% and 449%. These figures are
              not interchangeable and do not isolate Rokid's served geographies, price bands, channel economics, or
              attachable software revenue. The strongest conclusion is that the category is expanding from a small base;
              a bottom-up SAM and attainable SOM remain diligence gaps.
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM006
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
