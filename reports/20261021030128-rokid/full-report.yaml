      - number: '1.3'
        title: Product evolution and commercial signals
        blocks:
          - type: paragraph
            body: >-
              Rokid's official chronology shows a long progression from voice-interaction devices into AR glasses,
              YodaOS-XR, industrial mixed-reality hardware, consumer viewers, and AI glasses. Independent coverage adds
              two useful commercial markers: MarketsandMarkets reported more than $1 million of Kickstarter pledges in
              four days in September 2025, while Wareable reported a global $299 launch for the displayless AI Glasses
              Style in January 2026. The timeline demonstrates repeated product shipping, but it is not a revenue bridge
              and does not establish margins, repeat purchase, returns, or channel sell-through. Crowdfunding pledges
              and backer counts are demand signals, not customer counts or cash available for corporate operations.
            claimRefs:
              - CO009
