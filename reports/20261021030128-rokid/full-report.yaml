  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              The observable model is hardware-led and spans consumer display glasses, a $299 screenless AI Glasses
              Style product, and enterprise-oriented industrial devices. Rokid also describes a software and cloud-AI
              ecosystem, but the retained sources do not establish whether software is separately priced, bundled into
              hardware, or monetized through subscriptions or services. Crowdfunding offers the clearest public demand
              signal: independent reporting recorded more than US$2 million in 14 days, while Rokid's Australian site
              later reported more than US$3.6 million from over 5,000 backers in 45 days. These amounts are campaign
              commitments or proceeds, not audited recognized revenue, ARR, or recurring demand. Official claims of more
              than 250,000 active users and an externally framed 41% share of display-equipped AI glasses strengthen the
              traction case, but neither source supplies units, revenue, cohort retention, or a reconciled reporting
              perimeter.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
