  - id: FP001
    title: Display functionality versus public price tier
    type: quadrant
    summary: >-
      Rokid spans low-priced screenless acquisition offers and higher-priced display products, while the only external
      display comparison is rumored.
    data:
      xAxis:
        label: Display functionality
        min: 1
        max: 5
        low: Screenless / ambient
        high: In-view overlay
        description: Ordinal score from source-documented display presence
        scale: ordinal
      yAxis:
        label: Price accessibility
        min: 1
        max: 5
        low: Higher or less accessible
        high: Lower or more accessible
        description: Ordinal bins based on cited public price points
        scale: ordinal
      points:
        - label: Style creator free
          x: 1
          'y': 5
          detail: Conditional creator-seeding offer; not a standard retail price.
        - label: Style creator $199
          x: 1
          'y': 5
          detail: Creator-program pack for applicants below the free threshold.
        - label: Style promo $259
          x: 1
          'y': 5
          detail: Time-limited spring campaign after checkout code.
        - label: Style list $299
          x: 1
          'y': 5
          detail: Global screenless product list price reported by Wareable.
        - label: Glasses base $599
          x: 5
          'y': 3
          detail: Display-enabled Rokid Glasses public starting price.
        - label: Glasses bundle $698
          x: 5
          'y': 2
          detail: Display glasses with case.
        - label: Meta display rumor $800
          x: 5
          'y': 1
          detail: Rumored comparison only; not a verified or released price.
    approximationNotes: >-
      X is ordinal: 1 means source-described screenless use and 5 means an in-view display. Y buckets public prices: 5
      for $299 or less, 3 for $599, 2 for $698, and 1 for about $800. Promotions are separate observations, not separate
      products; the Meta point is explicitly rumored.
    claimRefs:
      - CP001
      - CP005
      - CP006
      - CP008
      - CP009
  - id: FI001
    title: Revenue-to-gross-profit evidence bridge
    type: flow
    summary: >-
      Public evidence reaches demand and list pricing, while the accounting and cost steps required to establish gross
      profit remain undisclosed.
    data:
      nodes:
        - id: demand
          label: Consumer or enterprise demand
          detail: Campaign backing, active-user claims, product launches, and enterprise use cases
        - id: order
          label: Order or contract
          detail: Crowdfunding pledge, retail purchase, or enterprise agreement
        - id: billings
          label: Gross billings or pledged value
          detail: Public campaign totals and a US$299 list price are observable
        - id: recognized-revenue
          label: Recognized revenue
          detail: Timing, cancellations, fulfillment, and revenue recognition are not disclosed
        - id: delivery-costs
          label: Product and service costs
          detail: Components, channel fees, cloud use, returns, warranty, and support are not disclosed
        - id: gross-profit
          label: Gross profit
          detail: Cannot be calculated from retained public evidence
      edges:
        - from: demand
          to: order
        - from: order
          to: billings
        - from: billings
          to: recognized-revenue
        - from: recognized-revenue
          to: delivery-costs
        - from: delivery-costs
          to: gross-profit
    approximationNotes: The sequence is conceptual and contains no estimated conversion rates, revenue values, or margins.
