      - number: '4.2'
        title: Margin structure and unit-economics gaps
        blocks:
          - type: paragraph
            body: >-
              Physical smart-glasses sales expose Rokid to component, assembly, inventory, logistics, returns, warranty,
              and after-sales service costs. The sources describe optical displays, cameras, processors, prescription
              fulfillment, and enterprise deployments, but they provide no bill of materials, net average selling price,
              channel discount, gross margin, return rate, warranty reserve, or service cost. The $299 Style list price
              is therefore not a reliable blended ASP: Rokid also sells display-equipped and industrial products with
              different hardware and support requirements. Nor can crowdfunding efficiency be converted into CAC or
              payback, because campaign marketing spend, platform fees, fulfillment costs, cancellations, and subsequent
              repeat purchases are absent. The correct underwriting posture is to treat public pricing and campaign
              totals as demand and positioning evidence while leaving contribution margin, sales efficiency, and
              working-capital conversion unmodeled until management supplies product- and channel-level data.
            claimRefs:
              - CI003
              - CI009
              - CI010
              - CI013
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI012
              - CI013
              - CI016
      - number: '4.3'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Historical financing demonstrates access to capital but does not prove current liquidity. Forbes reported
              a nearly US$70 million government-led round in 2024 and linked the transaction to an enterprise office,
              ecosystem hub, and R&D center in Hefei; an official Rokid article separately described 13 rounds and C+
              stage status. In June 2026, the founder characterized the company's ammunition reserves as ample, yet the
              same account supplied no cash balance, monthly burn, debt, runway, or committed IPO proceeds. The privacy
              controversy and related content cleanup also illustrate a plausible compliance and moderation cost channel
              at a sensitive capital-markets moment, without providing a quantifiable financial impact. The financial
              verdict is therefore mixed: market demand and financing access are plausible strengths, but revenue
              quality, gross-margin durability, working-capital intensity, and forward capital sufficiency cannot be
              underwritten from public data. Audited statements and a current liquidity bridge are prerequisites for
              valuation conviction.
            claimRefs:
              - CI007
              - CI008
              - CI011
              - CI012
              - CI014
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public traction is not a financial statement
            body: >-
              Campaign proceeds, active-user counts, and category shipment share cannot substitute for recognized
              revenue, gross margin, cash generation, or audited balance-sheet data.
            calloutType: risk
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI006
              - CI009
              - CI010
          - type: callout
            title: Require a current liquidity and margin bridge
            body: >-
              Before underwriting valuation, obtain audited revenue and COGS by product plus a current cash-to-runway
              bridge that includes debt, inventory, capex, and downside burn.
            calloutType: recommendation
            claimRefs:
              - CI009
              - CI012
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Portfolio and customer workflows
        blocks:
          - type: paragraph
            body: >-
              Rokid delivers more than one glasses form factor. Its current public portfolio spans display-equipped
              Rokid Glasses, the screenless AI Glasses Style, consumer AR viewers and accessories, and the
              enterprise-oriented X-Craft line. The customer workflow is hands-free access to translation, navigation,
              teleprompting, first-person capture, remote collaboration, or guided inspection, depending on the device.
              That breadth creates cross-selling potential but also makes maturity uneven: some products are current
              retail launches, while enterprise performance and certifications are described mainly through
              company-controlled pages and profile aggregators. Buyers therefore need SKU-level proof rather than
              treating the whole portfolio as one mature platform. The module and workflow tables separate observed
              products from the operating metrics still required in diligence.
            claimRefs:
