              - CP007
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP008
              - CP009
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The defensibility case rests on an integrated hardware-software stack, display optics, prescription
              support, developer tooling, and an open assistant strategy rather than on demonstrated customer lock-in.
              YodaOS, AIUI, and the Agent Store could raise switching costs if third-party applications and workflows
              become valuable, yet public developer counts are company-issued and no retention, application usage, paid
              developer economics, or migration-cost evidence is available. The shipment headline is also easy to
              overread: Mixed News reports that displayless devices were 96% of H1 2026 AI-glasses shipments and notes
              that Rokid's claimed 41% share applies only to the remaining display segment, without a published segment
              table or unit count. Privacy is a further competitive variable. BigGo's report of covert recordings and
              Rokid's subsequent cleanup shows that technical capability can create trust costs; the pool contains no
              cross-vendor benchmark proving Rokid's safeguards are stronger. On current evidence, differentiation is
              credible at product level but moat durability remains unproven.
            claimRefs:
              - CP007
              - CP010
              - CP011
              - CP012
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: A two-lane portfolio
            body: >-
              Rokid can compete in display-led AR utility and in lower-priced screenless ambient AI without abandoning
              its operating-system and developer strategy.
            calloutType: strength
            claimRefs:
              - CP001
              - CP005
              - CP007
              - CP015
          - type: callout
            title: Leadership is narrower than the headline
            body: >-
              The 41% figure concerns the display segment, while an independent analysis says displayless products
              represented 96% of all H1 2026 AI-glasses shipments and the underlying ranking table was not public.
            calloutType: risk
            claimRefs:
              - CP010
