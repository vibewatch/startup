          values:
            - Unquantified
            - High
            - Undisclosed
            - High
        - label: Model-platform terms change
          values:
            - Unquantified
            - High
            - Multi-provider
            - Medium-high
        - label: Hardware quality or return burden
          values:
            - Unquantified
            - Medium-high
            - Undisclosed
