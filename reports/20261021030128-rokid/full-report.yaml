      - CR010
      - CR012
      - CR013
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Commercial proof is promising, but missing economics and current terms stop the chain at track rather than invest.
    data:
      nodes:
        - id: product
          label: Product proof
          detail: Eleven company-reported generations of mass-produced AI and AR glasses
        - id: reach
          label: Reach signals
          detail: Company-reported international reach, users, crowdfunding, and shipment share
        - id: quality
          label: Evidence quality
          detail: Most current scale signals are company-issued rather than independently verified
        - id: economics
          label: Economics gap
          detail: No assigned audited revenue, margin, cash, or unit-economics evidence
        - id: price
          label: Price gap
          detail: Latest assigned valuation reference is $1B from January 2024
        - id: decision
          label: Track
          detail: Re-underwrite only with current terms, audited economics, and exit evidence
      edges:
        - from: product
          to: reach
        - from: reach
          to: quality
        - from: quality
          to: economics
        - from: economics
          to: price
        - from: price
          to: decision
    approximationNotes: The sequence is a decision framework, not a probability model or a quantified valuation bridge.
    claimRefs:
      - CV008
      - CV010
      - CV013
      - CV015
