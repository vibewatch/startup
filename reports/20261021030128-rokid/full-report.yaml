              - CM016
      - number: '2.3'
        title: Buyers, users, and budget ownership
        blocks:
          - type: paragraph
            body: >-
              Rokid spans several buying motions rather than one homogeneous customer. Consumers and creators can buy
              screenless AI glasses as a discretionary electronics purchase, with the $299 Style positioned near
              mainstream smart-glasses pricing. Travelers and mobile professionals may pay for display-enabled
              translation, navigation, and teleprompting, but those benefits must displace a phone or headset often
              enough to justify a higher price. Enterprise field-service, industrial, logistics, and healthcare
              deployments move the payer to operations, IT, clinical, or innovation budgets and require workflow
              integration, device management, security review, and measurable labor or quality gains. Because the
              sources do not disclose segment revenue or procurement conversion, these budget assignments are analytical
              inferences that require customer-level validation.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM014
              - CM016
      - number: '2.4'
        title: Adoption drivers, constraints, and timing
        blocks:
          - type: paragraph
            body: >-
              Demand drivers include lighter designs, lower entry prices, model choice, prescription support, hands-free
              translation and navigation, and a developer ecosystem that Rokid says has reached 35,000 members. Supply-
              chain maturation and better component yields could lower costs, while industrial and healthcare workflows
              offer clearer task-level value than general consumer novelty. The constraints are equally material.
              Rokid's CEO said the industry has not found a use case that is both high-frequency and strongly demanded,
              and analysts identify on-device performance, thermal management, battery life, display quality, and cost
              control as unresolved. A 2026 covert-recording controversy adds a trust and regulatory adoption barrier:
              indicator visibility, community governance, consent, and enterprise privacy controls can affect channel
              acceptance even if shipment growth remains strong.
            claimRefs:
              - CM002
              - CM011
              - CM012
              - CM013
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Category leadership is narrower than market leadership
            body: >-
              Rokid's reported 41% share applies to display-enabled AR and AI glasses, while displayless devices
              accounted for 96% of AI-glasses shipments in H1 2026; the disclosed figures do not establish leadership
              across all smart glasses.
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM008
          - type: callout
            title: Adoption still lacks a universal daily use case
            body: >-
              Rapid shipment growth does not resolve the industry's stated difficulty finding a workflow that is both
              frequent and essential, while privacy, battery, thermal, display, and cost constraints can slow
              conversion.
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and substitutes
        blocks:
          - type: paragraph
            body: >-
              The competitive boundary is wider than branded AR eyewear. Rokid Glasses addresses display-enabled
              translation, navigation, teleprompting, visual assistance, and first-person capture, while Rokid Style
              moves down-market into screenless ambient glasses. Wareable describes that latter category as currently
              dominated by Meta, making Meta the clearest named direct competitor in the assigned evidence. Smartphones
              and earbuds remain the status quo for navigation, translation, notifications, search, and capture;
              enterprise buyers can also continue with handheld devices, single-purpose viewers, or internally
              integrated workflows. Large platform owners are likely entrants because Rokid itself publicly frames
              Meta's participation as category-building. The available sources do not support a complete named roster,
              competitor funding comparison, or market-share table beyond Rokid's narrow display segment, so
              category-level alternatives are shown as such rather than presented as verified competitor profiles.
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP010
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
