      - number: '3.2'
        title: Capability, pricing, and distribution
        blocks:
          - type: paragraph
            body: >-
              Rokid's sharpest product distinction is the combination of a lightweight display and model choice. Its
              company materials describe a 49-gram waveguide product with translation, navigation, teleprompting,
              capture, and multiple assistants, while Wareable reports that the 38.5-gram screenless Style can switch
              among several AI models and record for longer than Meta's current hardware. Public pricing spans creator
              acquisition offers from free or $199, a $259 promotional floor, a $299 Style list price, and $599 or $698
              display-glasses configurations. Those are list or promotional prices, not realized average selling prices.
              Distribution evidence points to e-commerce, optical partners, local European retail, developer tools, and
              a creator-seeding program. This creates multiple routes to market, but the pool provides no channel
              productivity, sell-through, discount depth, support-cost, or contract evidence with which to compare
              distribution power against Meta or another incumbent.
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP007
              - CP008
              - CP009
              - CP012
              - CP013
              - CP015
