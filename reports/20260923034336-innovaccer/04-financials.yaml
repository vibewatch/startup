  "sections": [
    {
      "id": "capital-structure-and-valuation",
      "title": "Capital Structure and Valuation",
      "body": "The capital stack is unusually visible for a private healthcare company. Recent market data and company coverage point to a 2025 Series F, a multibillion valuation, and a total capital base that now sits well above earlier unicorn-era marks. The important nuance is that the public record mixes primary financing, secondary-liquidity language, and market-data estimates, so a single number can look more precise than the evidence really is. For diligence, that means the company should be treated as expensive and well-backed, but not as a business whose price is nailed down to the last dollar. The broader read is that investors still believe the platform can scale materially, which is why the premium has held up across multiple sources.",
      "claimRefs": [
        "CI001",
        "CI002",
        "CI003",
        "CI010"
      ],
      "tableRefs": [
        "TI001"
      ]
    },
    {
      "id": "revenue-and-operating-signals",
      "title": "Revenue and Operating Signals",
      "body": "Public revenue signals are strong enough to show real scale, but they are still best treated as indicative rather than audited fact. Fortune says the company has crossed $200M ARR, while other market-data sources keep the business in the broad low-to-mid hundreds of millions of revenue or run-rate territory. That is consistent with a company that has moved beyond venture experimentation and into a large enterprise-software profile. The signal is not just absolute size; it is also the fact that the platform keeps attracting strategic investors, partner attention, and product investment. Put differently, the company is still spending and still growing, which is what you would expect from a platform that is trying to justify a premium valuation band.",
      "claimRefs": [
        "CI004",
        "CI005",
        "CI006",
        "CI011"
      ],
      "tableRefs": [
        "TI002"
      ],
      "figureRefs": [
        "FI001"
      ]
    },
    {
      "id": "what-is-still-missing",
      "title": "What Is Still Missing",
      "body": "The remaining financial gaps are the ones that matter most for quality-of-earnings diligence: audited margins, burn, retention, concentration, and cash conversion. The public sources do not resolve those questions, and that is why this chapter stays cautious even though the growth signal is strong. The company may well deserve the premium implied by current market-data snapshots, but the evidence set does not yet let an analyst model the quality of that premium with confidence. That makes the next diligence step straightforward: ask for management accounts and the operating bridge that explains how revenue, margin, and cash are moving together.",
      "claimRefs": [
        "CI007",
        "CI008",
        "CI009",
        "CI012"
      ],
      "tableRefs": [
        "TI003"
      ]
    }
  ],
