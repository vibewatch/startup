  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界
        blocks:
          - type: paragraph
            body: >-
              Innovaccer 位于一个狭窄但重要的类别：医疗数据基础设施加工作流自动化。最清晰的市场定义不是泛医疗
              IT，而是连接碎片化临床、理赔和运营系统，再把数据转成风险、质量、准入和文档等智能体工作流的一层。这个界定很重要，因为买家很少只买分析。他们买的是能支撑全企业行动的数据底座，包括预授权、联络中心工作和人群健康干预。图表和表格合起来显示，市场不是靠新概念驱动，而是靠反复出现的工作流痛点和集成压力驱动。因此，市场边界取决于买家能否证明平台级转型比再买一个仪表盘更划算。把可寻址市场描述成工作流转型问题，比描述成纯软件品类更容易。
            claimRefs:
              - CM001
              - CM002
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs: []
      - number: '2.2'
        title: 买方与采用逻辑
        blocks:
          - type: paragraph
            body: >-
              买方范围很宽，但预算归属很具体：提供方、支付方、政府和生命科学团队都会参与，最紧迫预算来自运营、人群健康、风险-质量和收入周期负责人。当平台能快速证明 ROI，尤其是节省人力或改善报销时，采用率会提升。AWS 和
              B Capital 材料呈现同一模式：统一数据层能缩短原本需要 EHR、理赔系统和员工手工协调的周期时，平台更容易赢。最强需求信号仍是具体工作流的
              ROI，不是抽象的平台整合。实际决策往往取决于买家能否看到近期人力或报销影响。
            claimRefs:
              - CM003
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM010
      - number: '2.3'
        title: 驱动因素、约束与替代品
        blocks:
          - type: paragraph
            body: >-
              需求驱动很直接：互操作压力、行政负担，以及从仪表盘转向工作流自动化。限制也同样清楚：集成成本、安全审查，以及必须足够早地证明节省，才能撑过医疗系统采购周期。替代品仍然重要。EHR
              原生模块、单点解决方案和人工护理协调团队可以覆盖部分待完成工作，因此 Innovaccer
              必须销售更宽的经济账，而不是功能清单。仍未确定的是，这个市场会成为耐久的平台品类，还是一组相邻单点解决方案。市场不只是大；它在运营上也有粘性，因为每完成一次集成，下一个工作流就更容易被论证。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM011
              - CM012
