chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与规模
        blocks:
          - type: paragraph
            body: >-
              Innovaccer 是一家总部位于旧金山的医疗数据与 AI 公司，成立于 2014
              年。公司最新公开材料将业务定位为一个平台：先把临床、理赔和运营数据标准化，医疗系统、支付方和生命科学团队再基于同一份记录跑工作流。公司现在更像医疗运营层，而不是单点产品；覆盖美国医疗系统、公共部门客户，也有一组不断扩展的
              AI 产品。公开来源显示，业务已从数据集成故事推进到更宽的智能体 AI 平台。2026 年 AWS 合作说明，渠道伙伴已把 Innovaccer 视为严肃的企业平台，而不只是单点分析供应商。2026 年 AWS
              合作说明，渠道伙伴已把 Innovaccer 视为严肃的企业平台，而不只是单点分析供应商。
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO008
