  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集合
        blocks:
          - type: paragraph
            body: >-
              竞品集合跨越不止一个品类。Innovaccer 要应对 EHR 原生模块、企业数据平台供应商、人群健康专家、CRM 和收入周期供应商，以及拿下狭窄工作流的单点解决方案。公开来源持续指向 Epic、Oracle
              Cerner、Optum、Health Catalyst、Salesforce、Verily、IQVIA 和 Veeva
              等相关标杆；这意味着公司既在比宽度，也在比能从客户现有技术栈中拿掉多少工作。买方教育和实施可信度因此也是竞争的一部分，不是另一个销售动作。
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
      - number: '3.2'
        title: 差异化
        blocks:
          - type: paragraph
            body: >-
              多数来源给出的差异化一致：公司试图先占住数据层，再在其上挂接 AI 驱动的工作流。这让它不止是分析产品，但也不是完整 EHR 替代品。公开材料强调，它位于记录系统之上，是一个智能系统；Gravity 和 AI
              Studio 是这一路线当前的表达。如果数据层足够强，Innovaccer 可以跨多个工作流获胜，而不必把每个工作流都当单点产品销售。因此，护城河主张是宽度加医疗语境，而不是某个单一基准分数。
            claimRefs:
              - CP004
              - CP006
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP006
              - CP009
          - type: figure
            figureRef: FP001
            claimRefs:
