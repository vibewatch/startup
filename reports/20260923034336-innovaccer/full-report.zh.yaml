      - number: '6.2'
        title: 采用与路由
        blocks:
          - type: paragraph
            body: >-
              采用路径看起来由伙伴协助，且实施很重。AWS 和 B Capital
              显示，公司销售进入的环境重视数据激活、云部署和垂直整合；这通常意味着销售周期长、以解决方案为导向。这与公开证据一致：大型医疗系统、支付方相邻工作流，以及希望平台先规范化数据、AI
              层才有用的客户基础。实际看，客户旅程很可能从集成工作开始，而不是自助试用。对一个靠企业信任销售、而不是靠病毒式传播增长的平台来说，这是合理模式。换句话说，采用路径可能很长，但并不随机；它似乎沿着重集成企业软件的形态推进。
            claimRefs:
              - CU002
              - CU003
              - CU007
              - CU008
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU007
              - CU008
              - CU010
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU010
      - number: '6.3'
        title: 公开证据缺了什么
        blocks:
          - type: paragraph
            body: >-
              公开证据足以证明真实企业使用，但不足以量化客户集中度或续约质量。Out-of-Pocket
              的价值恰恰在于它持怀疑态度：它指出，公司仍然很难用白话讲清楚。这种怀疑并不推翻客户故事；它只是意味着尽调标准应保持高位。大型买方认可公司，但我们还不知道每个部署有多粘、足迹中有多少集中在少数旗舰账户。剩下的问题不再是有没有客户，而是这些关系在经济上有多耐久。关键尽调议题是，可见客户标识能否转化为宽泛、粘性的安装基础，而不是少数展示性胜利。
            claimRefs:
              - CU003
              - CU009
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU011
              - CU012
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与数据风险
        blocks:
          - type: paragraph
            body: >-
              公司处在市场中监管最重的软件环境之一。隐私博客明确表明，HIPAA 和 ARRA
              不是可选附加项；数据挑战博客也显示，仅仅安全处理碎片化医疗信息就需要大量工作。因此，公司始终暴露于合规漂移、流程缺口和文档风险。即便平台很强，如果底层数据处理不严密，也会显得脆弱，所以监管尽调应始终放在中心位置。尽调含义很直接：公司越能展示控制，这些风险对投资论点的压力就越小。实际风险未必是头条级合规事故，而是小流程失误不断累积，伤害买方信心。
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
      - number: '7.2'
        title: 交付与实施风险
        blocks:
          - type: paragraph
            body: >-
              交付风险在于，客户价值可能依赖大量实施工作，而不是干净的纯产品上线。AWS 案例研究材料、AWS
              合作公告和招聘列表都指向很重的集成动作。这对企业医疗软件很正常，但也意味着部署可能耗时、需要专业人员，并制造隐藏服务负荷。如果公司不谨慎，实施摩擦可能表现为扩张更慢，或毛利率弱于营销叙事。只要公司能证明其扩张不带隐藏服务拖累，这种负担仍可接受。如果这些负担增长快过产品复用，公司最终会比叙事中更像服务型公司。
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR010
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR009
      - number: '7.3'
        title: 商业与声誉风险
        blocks:
          - type: paragraph
            body: >-
              公开市场仍有足够怀疑，以至于外部解读者需要先讲清公司到底做什么。这不致命，但说明故事比简单单点方案更难传播。再叠加高速变化的市场、强竞争对手，以及客户证据仍依赖少数大名，风险画像就成了典型后期企业软件：势头不错，但执行失误空间很大。最佳防守是反复证明平台持续赢得大型买家信任。因此，公司需要反复证明客户和伙伴不用大量“翻译”也能理解故事。这也是为什么叙事简单度和可重复证据本身就是风险缓释手段，不只是营销问题。
            claimRefs:
              - CR001
              - CR007
              - CR009
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR007
              - CR009
              - CR011
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值锚点
        blocks:
          - type: paragraph
            body: >-
              最新公开锚点仍是 2025 年 Series F 轮及其周边市场数据快照。TechCrunch 报道该轮为 $275M，Tracxn 则把总融资放在数亿美元高段，估值区间约
              $3.45B。这足以说明，公司按私募市场标准仍很贵，但不足以说明市场已收敛到单一数字。实际结论是，业务定价仍像一家已具规模的成长公司，而不是陷入困境或停滞的公司。其含义是，市场仍奖励增长，但还没有用一个干净数字奖励确定性。宽区间在这里不是弱点；面对多个并不完全一致的市场数据快照，这是诚实呈现方式。
            claimRefs:
              - CV001
              - CV002
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
      - number: '8.2'
        title: 可比对象与退出路径
        blocks:
          - type: paragraph
            body: >-
              可比集合很乱，因为它混合了融资历史、二级市场报价和 IPO 观察名单评论。因此估值必须按区间阅读。Forge 称没有正式 IPO 承诺，Forbes、EquityZen 和医疗数字化综述则都把
              Innovaccer
              放在后期私营公司讨论中。合起来看，这些来源意味着可选性，而不是临近性：公司仍可能通过公开市场退出，但尚未从候选者跨到已承诺发行人。这个可选性有用，但不应被误读成绑定退出时间表。在公司给出更清晰的退出信号前，IPO
              观察名单报道只是方向性指标，不是承诺。
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV009
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV009
      - number: '8.3'
        title: 区间意味着什么
        blocks:
          - type: paragraph
            body: >-
              估值区间之所以重要，是因为它让尽调问题保持落地。如果公司真的值数十亿美元溢价，收入质量、客户耐久度和经营杠杆就必须支撑这一判断。如果市场仍使用宽泛私募区间，精确数字就不如围绕它的故事重要：增长、留存、治理和退出可选性。公开证据支持溢价增长故事，但不支持精确退出时间故事。因此，这里正确产出是谨慎论点，而不是伪装成确定性的点估值。尽调上，只有运营证据跟上叙事，溢价才站得住。这意味着溢价论点应由运营证据承载，而不是只靠估值动量。
            claimRefs:
              - CV003
              - CV006
              - CV008
              - CV010
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV008
              - CV010
