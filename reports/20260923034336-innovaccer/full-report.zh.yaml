              轮、数十亿美元估值，以及如今远高于早期独角兽时期的总资本基础。关键细节是，公开记录混合了一级融资、二级流动性表述和市场数据估算，因此单一数字可能显得比证据更精确。尽调上，应把公司视为价格昂贵且资金充足，但不能当成价格精确到最后一美元的业务。更宽的判断是，投资者仍相信平台能显著扩张，这也是多个来源中溢价仍能维持的原因。
