      - CO004
      - CO006
      - CO009
      - CO010
      - CO011
      - CO013
  - id: FM001
    title: 市场价值栈金字塔
    type: pyramid
    layout: standard
    summary: 用六层结构说明平台价值在市场中沉淀在哪里。
    data:
      items:
        - label: 互操作压力
          value: 6
          detail: 医疗买方需要数据跨系统流动。
        - label: 工作流自动化
          value: 5
          detail: 买方要的是动作，而不只是报表。
        - label: 数据激活层
          value: 4
          detail: 统一记录和标准化能撬动下游使用。
        - label: 人群健康 / 风险 / 质量
          value: 3
          detail: 企业级主要预算集中在这里。
        - label: EHR 原生替代层
          value: 2
          detail: 内嵌模块可以满足部分用例。
        - label: 人工协调层
          value: 1
          detail: 自动化尚未落地时，这就是现状。
        - label: 扩张潜力
          value: 0.5
          detail: 更多模块和 AI 层可以扩大单个账户价值
  - id: FP001
    title: 竞争定位图
    type: quadrant
    layout: standard
    summary: 展示 Innovaccer 与既有厂商、单点方案、内部自建和通用 AI 工具相比的相对位置。
    data:
      points:
        - label: Innovaccer
          x: 4
          'y': 4
          detail: 平台范围宽，医疗专属工作流深
        - label: EHR 既有厂商
          x: 5
          'y': 3
          detail: 掌握核心记录系统控制权，但推进慢
        - label: 单点方案
          x: 2
          'y': 3
          detail: 能力窄，更容易采购，也更容易被替换
        - label: 内部自建
          x: 3
          'y': 2
          detail: 定制化且脆弱，但大型买方有时仍偏好它
        - label: 通用 AI 工具
          x: 1
          'y': 1
          detail: 演示很快，但在受监管医疗工作流上偏弱
        - label: 邻近工作流平台
          x: 3
          'y': 4
          detail: 可以蚕食部分用例，但缺少完整数据上下文
    claimRefs:
      - CP001
      - CP003
      - CP005
      - CP006
      - CP011
  - id: FI001
    title: 资本与估值桥
    type: flow
    layout: standard
