      nodes:
        - label: Series D / E 基础
          detail: 早期融资确立平台基础。
        - label: Series F 重定价
          detail: 2025 年融资刷新估值区间。
        - label: 年经常性收入（ARR）扩张
          detail: 收入进入 $200M 出头区间。
        - label: 企业级规模
          detail: 大型体系采纳支撑增长。
