              轮；Tracxn 报道为 $179M，更广泛新闻报道为 $275M，因为该轮同时包含一级发行和二级转让。当前估值参考点约 $3.45B。B Capital 和 AWS
              合作阶段的材料显示，公司仍在用战略资本和客户关系，把业务从核心分析扩展到 AI
              智能体和企业工作流。持怀疑态度的第三方报道也指出，产品面足够宽，公司很难用一句话讲清楚。持怀疑态度的第三方报道也指出，产品面足够宽，公司很难用一句话讲清楚。
