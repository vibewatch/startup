              - CP003
              - CP005
              - CP006
              - CP011
      - number: '3.3'
        title: 竞争风险
        blocks:
          - type: paragraph
            body: >-
              最大的替代风险不是另一家创业公司，而是客户认定 EHR 原生模块、小型单点方案或人工团队已经足够。因此，产品近期转向支付方风险、质量和 AI
              驱动自动化：这些工作流更难用一个嵌入式模块解决。招聘和路线图信号显示，公司知道这一点，并正向集成痛点最高的地方转舵。负面是，这也让公司暴露在大型既有厂商的采购压力下，也暴露给偏好留在现有平台内的买家。报告其余部分持续检验的核心竞争动态就在这里。
