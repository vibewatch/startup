figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: standard
    summary: 公司重大融资、产品和合作伙伴里程碑的时间线。
    data:
      items:
        - label: '2014'
          body: Company founded by the current leadership team.
        - label: 2021-12
          body: $150M Series E at a $3.2B valuation.
        - label: 2025-01
          body: Latest disclosed round and valuation anchor.
        - label: 2026-04
          body: Black Book recognition in revenue cycle and PHM.
        - label: 2026-06
          body: AWS collaboration expands cloud and channel leverage.
        - label: 2026-06
          body: Agentic AI push raises the weight of AI Studio and Gravity.
        - label: 2026-07
          body: Fortune reports the company crossed $200M ARR.
        - label: 2026-09
          body: Design-system refresh shows active frontend investment.
