      - number: '6.2'
        title: Adoption and Routing
        blocks:
          - type: paragraph
            body: >-
              The adoption path looks partner-assisted and implementation-heavy. AWS and B Capital indicate that the
              company sells into environments where data activation, cloud deployment, and vertical integration matter,
              which typically means sales are long and solution-led. That is consistent with the public evidence: large
              health systems, payer-adjacent workflows, and a customer base that wants the platform to normalize data
              before the AI layer becomes useful. In practical terms, the customer journey likely starts with
              integration work, not a self-serve trial. That is a reasonable pattern for a platform that is sold through
              enterprise trust, not viral adoption. In other words, the adoption path is likely long but not random; it
              seems to follow the shape of integration-heavy enterprise software.
            claimRefs:
              - CU002
              - CU003
              - CU007
              - CU008
              - CU010
