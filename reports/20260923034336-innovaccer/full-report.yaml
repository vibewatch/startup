              - CP005
              - CP006
              - CP011
      - number: '3.3'
        title: Competitive Risks
        blocks:
          - type: paragraph
            body: >-
              The biggest substitution risk is not another startup; it is the customer deciding that an EHR-native
              module, a small point solution, or a manual team is good enough. That is why the product has recently
              shifted toward payer risk, quality, and AI-driven automation: those workflows are harder to solve with a
              single embedded module. Hiring and roadmap signals suggest the company knows this and is steering toward
              where integration pain is highest. The downside is that this also leaves the company exposed to
              procurement pressure from larger incumbents and to buyers who prefer to stay within an existing platform.
              That is the core competitive dynamic the rest of the report keeps testing.
            claimRefs:
