      - number: '6.3'
        title: What the Public Proof Misses
        blocks:
          - type: paragraph
            body: >-
              The public proof set is good enough to establish real enterprise usage, but not good enough to quantify
              customer concentration or renewal quality. Out-of-Pocket is useful precisely because it is skeptical: it
              highlights how hard the company can still be to explain in plain English. That skepticism does not negate
              the customer story; it simply means that the diligence standard should stay high. We know the company has
              credibility with large buyers, but we do not yet know how sticky every deployment is or how much of the
              footprint is concentrated in a few flagship accounts. The remaining question is less about whether
              customers exist and more about how economically durable those relationships are. The key diligence issue
              is whether the visible logos translate into a broad, sticky install base rather than a few showcase wins.
            claimRefs:
