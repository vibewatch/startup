      - number: '1.1'
        title: Identity and Scale
        blocks:
          - type: paragraph
            body: >-
              Innovaccer is a San Francisco-based healthcare data and AI company founded in 2014. Its current public
              materials frame the business as a platform that normalizes clinical, claims, and operational data so
              health systems, payers, and life sciences teams can run workflows on a shared record. The company now
              describes itself less like a point product and more like a healthcare operating layer, with a footprint
              that spans U.S. health systems, public-sector customers, and a growing set of AI products. Public sources
              point to a business that has moved from a data-integration story to a broader agentic AI platform. The
              2026 AWS collaboration shows that channel partners now treat it as a serious enterprise platform rather
              than just a point analytics vendor. The 2026 AWS collaboration shows that channel partners now treat it as
              a serious enterprise platform rather than just a point analytics vendor.
