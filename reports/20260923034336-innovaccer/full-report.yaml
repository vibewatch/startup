  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Data Risk
        blocks:
          - type: paragraph
            body: >-
              The company operates in one of the most regulated software environments in the market. The privacy blog
              makes clear that HIPAA and ARRA are not optional extras, and the data-challenges blog shows how much work
              is required just to handle fragmented healthcare information safely. That means the company is always
              exposed to compliance drift, process gaps, and documentation risk. Even a strong platform can look fragile
              if the underlying data handling is not tight, so regulatory diligence should stay front and center. The
              diligence implication is straightforward: the better the company can show controls, the less these risks
              should weigh on the thesis. The practical risk is less about a headline compliance failure and more about
              the accumulation of small process misses that hurt buyer confidence.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
      - number: '7.2'
        title: Delivery and Implementation Risk
        blocks:
          - type: paragraph
            body: >-
              The delivery risk is that customer value may depend on substantial implementation work rather than a clean
              product-only rollout. AWS case study material, the AWS collaboration announcement, and the job listings
              all point to a heavy integration motion. That is normal for enterprise healthcare software, but it also
              means deployments can take time, require specialist staff, and create hidden services load. If the company
              is not careful, implementation friction could show up as slower expansion or weaker gross margin than the
              marketing narrative suggests. That burden can still be acceptable, but only if the company can prove it
              scales without hidden services drag. If those burdens grow faster than product reuse, the company can end
              up looking more services-heavy than its narrative suggests.
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR010
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR009
      - number: '7.3'
        title: Commercial and Reputation Risk
        blocks:
          - type: paragraph
            body: >-
              The public market is still skeptical enough that external explainers feel the need to clarify what the
              company actually does. That is not fatal, but it is a sign that the story is harder to communicate than a
              simple point solution. Add in a fast-moving market, strong competitors, and the fact that customer proof
              still leans on a few big names, and the risk profile becomes a classic late-stage enterprise software one:
              good momentum, but plenty of room for execution miss. The best defense is repeated proof that the platform
              keeps earning trust with large buyers. The company therefore needs repeated proof that customers and
              partners can understand the story without a lot of translation. That is why narrative simplicity and
              repeatable proof are themselves risk mitigants, not just marketing concerns.
            claimRefs:
              - CR001
              - CR007
              - CR009
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
