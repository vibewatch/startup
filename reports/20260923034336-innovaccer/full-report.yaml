        title: Proof of Engineering Investment
        blocks:
          - type: paragraph
            body: >-
              The external proof of engineering investment comes from developer-facing pages, job posts, and market
              recognition. GitHub, APIs.io, and Vaia listings show that the company still maintains public technical
              artifacts and hires for implementation engineering work, which is consistent with an enterprise platform
              that must integrate deeply into healthcare operations. The Black Book 2026 recognition adds a
              market-facing corroboration that the company is still active in revenue-cycle and population-health
              workflows. This is enough to say the product is alive and actively maintained, even if the internal
              service boundaries remain partly hidden. In other words, the public evidence shows sustained
              build-and-ship motion rather than a stalled product surface. The engineering signal is therefore less
              about a single flashy launch and more about sustained maintenance of a real platform surface.
