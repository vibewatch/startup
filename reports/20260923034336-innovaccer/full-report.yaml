              - CV009
      - number: '8.3'
        title: What the Range Means
        blocks:
          - type: paragraph
            body: >-
              The valuation range matters because it keeps the diligence question grounded. If the company is really
              worth a multibillion premium, then revenue quality, customer durability, and operating leverage need to
              support that view. If the market is still using a broad private-market range, then the exact number
              matters less than the story that surrounds it: growth, retention, governance, and exit optionality. Public
              evidence supports the premium-growth story, but not a precise exit timing story. That is why the right
              output here is a guarded thesis, not a point estimate masquerading as certainty. In diligence terms, the
              premium survives only if the operational evidence keeps up with the narrative. That means the premium
              thesis should be carried by operating evidence, not by valuation momentum alone.
            claimRefs:
              - CV003
              - CV006
              - CV008
              - CV010
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV008
              - CV010
