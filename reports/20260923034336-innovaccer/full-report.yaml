  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Logos and Segments
        blocks:
          - type: paragraph
            body: >-
              The public customer story is strongest at the enterprise and large-system end of the market. AWS
              materials, the company's own partnership announcement, and Fortune all point to a large-health-system use
              case rather than a small-practice one. Belitsoft adds a broader footprint claim that mentions more than
              1,600 hospitals and clinics, while Black Book recognition suggests the platform is active across
              revenue-cycle and population-health use cases. The overall picture is of a company serving institutions
              that need data integration at scale, not lightweight SMB workflows. The customer base therefore looks
              broad enough to matter, but narrow enough to remain enterprise-led. That pattern is consistent with
              large-scale deployments that start with a concrete use case and then broaden into adjacent workflows.
            claimRefs:
              - CU001
