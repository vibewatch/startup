  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current Valuation Anchor
        blocks:
          - type: paragraph
            body: >-
              The latest public anchor is still the 2025 Series F and the market-data snapshots around it. TechCrunch
              puts the round at $275M and Tracxn keeps the total funding picture in the high hundreds of millions with a
              valuation band around $3.45B. That is enough to say the company remains expensive by private-market
              standards, but it is not enough to say the market has converged on a single number. The practical takeaway
              is that the business is still priced like a scaled growth company rather than a distressed or stalled one.
              The implication is that the market still rewards growth, but it has not rewarded certainty with a single
              clean number. A broad range is not a weakness here; it is the honest way to represent multiple market-data
              snapshots that do not fully agree.
            claimRefs:
              - CV001
              - CV002
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
