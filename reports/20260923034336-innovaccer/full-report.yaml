  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Surface
        blocks:
          - type: paragraph
            body: >-
              Public materials show a product stack that is broader than a single application. Innovaccer describes AI
              Studio as a place to build, deploy, and monitor healthcare AI workflows, while the homepage frames the
              company as a healthcare data and AI platform rather than a point solution. The design system and UI Engine
              documentation suggest the company has invested in reusable front-end primitives, which usually matters
              when an enterprise vendor has to ship consistent workflows across multiple modules. Taken together, the
              public surface looks like a platform, not a feature overlay. The public stack is therefore usable for
              diligence, even though it does not fully expose the internal service map. This matters because reuse
              usually shows up first in the UI and workflow scaffolding, not the model layer.
            claimRefs:
              - CE001
              - CE002
              - CE007
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE010
      - number: '5.2'
        title: Data, AI, and Governance
        blocks:
          - type: paragraph
            body: >-
              The strongest technical signal is not model hype; it is the combination of healthcare data, workflow
              orchestration, and governance controls. The privacy blog and AI Studio materials point to HIPAA and
              ARRA-conscious operations, while the product docs highlight guardrails, monitoring, and controlled reuse
              of enterprise data. That makes the architecture look more like a regulated operating layer than a generic
              chatbot wrapper. The open question is still how much of that governance is automated versus manually
              administered, and how portable the internal AI patterns are across customers with different data
              contracts. That distinction matters because governance that is only procedural is harder to scale than
              governance that is built into the product itself. The public docs do not prove every control, but they do
              show the company is thinking about regulated deployment from the start.
            claimRefs:
              - CE004
              - CE006
              - CE008
              - CE012
