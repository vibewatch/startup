      - number: '8.2'
        title: Comps and Exit Path
        blocks:
          - type: paragraph
            body: >-
              The comparison set is messy because it mixes financing history, secondary-market quotes, and IPO watchlist
              commentary. That is exactly why the valuation must be read as a range. Forge says there is no official IPO
              commitment, while Forbes, EquityZen, and the healthcare-digital roundup all keep Innovaccer in the
              late-stage private-company conversation. Together, those sources imply optionality rather than imminence:
              a company that could still exit through a public market, but that has not yet crossed the line from
              candidate to committed issuer. That optionality is useful, but it should not be mistaken for a binding
              exit schedule. Until the company gives a cleaner exit signal, IPO watchlist coverage is only a directional
              indicator, not a commitment.
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV009
          - type: figure
            figureRef: FV001
            claimRefs:
