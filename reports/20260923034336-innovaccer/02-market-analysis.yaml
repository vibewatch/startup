  - - ROI proof
    - Procurement needs near-term savings
    - MedCity News frames the pricing strategy around successful task completion
  - - Regulatory and reimbursement volatility
    - Can accelerate or slow buyer urgency
    - market context
  notes: Constraint table focused on adoption friction; the evidence is strong enough
    to define the buying cycle even where hard market sizing is not.
