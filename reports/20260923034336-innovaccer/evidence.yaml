    diligencePath: Request management accounts or audited financial statements during the next diligence cycle
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: distribution
    missingEvidence: A clean buyer-side comparison of win/loss rates against EHR-native and point-solution alternatives
    whyItMatters: This would sharpen the substitute-vs-platform thesis.
    diligencePath: Request competitive win-loss notes or RFP summaries from management.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: margins
    missingEvidence: Audited margin, burn, runway, and cohort-retention disclosure
    whyItMatters: Valuation quality cannot be nailed down without unit-economics proof.
    diligencePath: Request management accounts or an investor deck with operating metrics.
    relatedQuestionRefs:
      - QI006
      - QI008
  - type: missing-source
    severity: moderate
    topic: architecture
    missingEvidence: Internal architecture diagrams, model governance policy, and uptime evidence
    whyItMatters: Those artifacts would show how product claims translate into operational controls.
    diligencePath: Request architecture overview, reliability summary, and governance policy documents.
    relatedQuestionRefs:
