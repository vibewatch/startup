chapter:
  number: 6
  title: Customers
  summary: Innovaccer has visible enterprise proof points, but the public evidence
    still skews toward named-logo and partner narratives rather than full customer
    economics.
sections:
- id: customer-logos-and-segments
  title: Customer Logos and Segments
  body: The public customer story is strongest at the enterprise and large-system
    end of the market. AWS materials, the company's own partnership announcement,
    and Fortune all point to a large-health-system use case rather than a small-practice
    one. Belitsoft adds a broader footprint claim that mentions more than 1,600 hospitals
    and clinics, while Black Book recognition suggests the platform is active across
    revenue-cycle and population-health use cases. The overall picture is of a company
    serving institutions that need data integration at scale, not lightweight SMB
    workflows. The customer base therefore looks broad enough to matter, but narrow
    enough to remain enterprise-led. That pattern is consistent with large-scale deployments
    that start with a concrete use case and then broaden into adjacent workflows.
  claimRefs:
  - CU001
  - CU002
  - CU004
  - CU005
  - CU006
  tableRefs:
  - TU001
- id: adoption-and-routing
  title: Adoption and Routing
  body: 'The adoption path looks partner-assisted and implementation-heavy. AWS and
    B Capital indicate that the company sells into environments where data activation,
    cloud deployment, and vertical integration matter, which typically means sales
    are long and solution-led. That is consistent with the public evidence: large
    health systems, payer-adjacent workflows, and a customer base that wants the platform
    to normalize data before the AI layer becomes useful. In practical terms, the
    customer journey likely starts with integration work, not a self-serve trial.
    That is a reasonable pattern for a platform that is sold through enterprise trust,
    not viral adoption. In other words, the adoption path is likely long but not random;
    it seems to follow the shape of integration-heavy enterprise software.'
  claimRefs:
  - CU002
  - CU003
  - CU007
  - CU008
  - CU010
  tableRefs:
  - TU002
  figureRefs:
  - FU001
- id: what-the-public-proof-misses
  title: What the Public Proof Misses
  body: 'The public proof set is good enough to establish real enterprise usage, but
    not good enough to quantify customer concentration or renewal quality. Out-of-Pocket
    is useful precisely because it is skeptical: it highlights how hard the company
    can still be to explain in plain English. That skepticism does not negate the
    customer story; it simply means that the diligence standard should stay high.
    We know the company has credibility with large buyers, but we do not yet know
    how sticky every deployment is or how much of the footprint is concentrated in
    a few flagship accounts. The remaining question is less about whether customers
    exist and more about how economically durable those relationships are. The key
    diligence issue is whether the visible logos translate into a broad, sticky install
    base rather than a few showcase wins.'
  claimRefs:
  - CU003
  - CU009
  - CU011
  - CU012
  tableRefs:
  - TU003
