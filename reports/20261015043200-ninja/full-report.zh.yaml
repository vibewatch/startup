      - number: '2.3'
        title: 买方、付款方与采用机制
        blocks:
          - type: paragraph
            body: >-
              指定证据中最清晰的需求模式是家庭便利消费。Ninja 围绕补充型杂货篮子、预制食品以及有时效性的家庭或药房需求设计服务，同一个移动端结账流程还在延伸到美容、宠物护理和远程医疗关联配送等品类。PaySpace
              补充了一个重要商业细节：平台要求用户在结账时在线付款，并支持银行卡、电子钱包和 Tabby
              BNPL。因此，典型买方、用户和付款方是同一个消费者家庭账户，而不是获得报销的机构或企业预算负责人。速度和扩篮构成快速采用的逻辑，但采用率也会受到重复下单行为和消费者为便利服务付费意愿的影响。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM006
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM006
      - number: '2.4'
        title: 约束、矛盾与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              本章最大的约束不是对需求的怀疑，而是证据质量。大多数保留来源强调融资、独角兽地位、IPO 时间表或扩张野心，而没有披露按品类拆分的支出、城市经济性或细分渗透率。即使市场检索池也存在发现噪音：一条指定的
              “Ninja” 市场结果其实是印度的 SharkNinja
              家电发布，说明朴素的市场研究很容易被相邻但无关的数据污染。公开收入评论也不够干净，不能直接当作市场份额，因为来源没有调和收入、GMV、毛利率或品类盈利能力。在管理层或直接分析师数据集填补这些缺口前，本章应被视为有证据支撑的市场框架，而不是最终规模模型。
            claimRefs:
              - CM009
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: Ninja 争夺的是家庭快速补货，不是全部零售支出
            body: 这里更重要的是即时零售速度、暗仓密度和品类相邻扩张，而不是泛化的电商 TAM，因为相关替代方案是本地紧急出行或较慢的当日订单。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM004
          - type: callout
            title: 公开市场规模化分析仍落后于公司野心
            body: 指定材料可以展示广义即时零售增长和 Ninja 自身的规模锚点，但仍无法按品类、城市或买方群体拆出公开的沙特或海湾合作委员会 SAM/SOM。
            calloutType: risk
            claimRefs:
              - CM009
