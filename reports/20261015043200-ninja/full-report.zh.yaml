      - number: '3.3'
        title: 分销能力掌握在 incumbent 和资产所有者手中
        blocks:
          - type: paragraph
            body: >-
              TechStartups 是证据池中关于结构性竞争最有力的来源。它称 Delivery Hero 仍控制该地区的 HungerStation 和 Talabat，并报道 Ninja 正考虑收购其中部分资产，而
              Uber、Prosus，甚至 DoorDash 也在关注同一资产组合。这使竞争问题不只是产品重叠：所有权集中度可能比一家创业公司发布新功能更快地改变资本配置、促销强度和市场准入。             
              Ninja 与 HungerStation 的创始人联系，可能降低其对抗行业巨头的执行摩擦；但同一篇文章也描述了整合浪潮和利润率压力，这对任何轻易建立护城河或稳定市场结构的叙事都构成反向证据。
