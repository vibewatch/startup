              $250M；多篇报道将这轮融资描述为有意为资产负债表补强，以支持新垂直领域、技术、物流和区域增长。这种表述支持公司是在为规模扩张和潜在上市筹资，而不是应对公开披露的流动性危机。不过，同一证据集也解释了为什么投资判断仍受阻：没有公开现金余额、烧钱、债务到期表、营运资本状况或经审计利润率桥接，且由于
              “Ninja” 裸词检索仍会出现无关 SharkNinja 家电报道，开放网络发现比通常更嘈杂。结论是，融资故事可信，但披露不足以判断跑道、稀释风险或 IPO 后盈利质量。
