  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              保留来源一致将 Ninja
              放在即时零售而非广义电商之内：报道将其描述为一个快速配送平台，提供杂货、餐厅订单、药房产品、家庭必需品及相邻便利品类。这个边界很重要，因为相关替代支出并不是所有零售消费，而是家庭原本可能通过附近杂货店、餐厅自取、到药房购买，或用更慢的市场订单解决的紧急或便利型需求。证据也显示边界正在外扩。公开简介越来越多地提到化妆品、香水、宠物产品和远程医疗，这会扩大钱包份额，但也使单一、清晰的市场定义更难成立；核心补货需求与新近押注的相邻品类必须分开看。
            claimRefs:
              - CM001
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM012
