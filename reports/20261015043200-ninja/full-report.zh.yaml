        - TechStartups 称 HungerStation 和 Talabat 都在 Delivery Hero 的区域业务组合中
        - 共享所有权可以比初创公司更快地重新分配资本、促销资源和退出路径
        - 交易完成后的实际战略仍未知
      - - 创始人历史关联
        - TechStartups 称 Ninja 创始人在创办 Ninja 前创建了 HungerStation
        - 内部熟悉度可能降低对抗现有平台打法的执行风险
        - 没有关于独家商户、骑手或供应商关系的公开数据
