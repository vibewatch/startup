        - label: 履约核心
          detail: 有公开证据支持的运营模式。
          modules:
            - 技术驱动的暗店
            - 靠近高密度需求的本地库存
        - label: 配送执行
          detail: 公开渠道声称的服务水平和规模逻辑。
          modules:
            - 25 分钟配送主张
            - 以运营密度为护城河的论点
        - label: 扩张引擎
          detail: 现有 2025-2026 年报道中由资本支撑的规模化路径。
          modules:
            - 基础设施和物流投资
            - IPO 前的扩张纪律
        - label: 地理扩张
          detail: 现有报道验证的运营覆盖范围。
          outputs:
            - 利雅得、吉达、东部省
            - 沙特、巴林、卡塔尔、科威特
            - 与 IPO 前资本挂钩的扩张
    approximationNotes: 图中仅综合公开的运营栈；它不是经过验证的软件、安全或集成架构图。
