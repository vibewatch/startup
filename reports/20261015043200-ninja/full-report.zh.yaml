        - 密度可以带来可复制性并缩短配送时间，但不能证明价格领先
        - 没有披露城市层面的利用率或留存数据
      - - 市场拥挤
        - The Ouut 称市场正变得更加拥挤
        - 如果资金充足的挑战者持续进入邻近品类，护城河的持久性会减弱
        - 没有披露竞争对手的单位经济性
      - - 品牌独特性
        - Indian Retailer 在印度推广无关的“Shark and Ninja”产品
        - 如果品类发现依赖搜索记忆，一个通用品牌词的护城河很弱
        - 没有公开数据将这种歧义与沙特应用的直接客户混淆联系起来
    notes: 本表汇总有证据支持的压力点，并明确保留证据尚不足以量化切换成本模型的部分。
