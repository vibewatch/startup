  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争范围与解决同一任务的参与者
        blocks:
          - type: paragraph
            body: >-
              保留证据指向的竞争范围比单一即时零售同业集合更广。Menabytes 和 Tech in Asia 都将 Ninja
              的覆盖范围放在沙特阿拉伯、巴林、科威特和卡塔尔，品类包括杂货、家庭必需品、药房及日常需求配送。Menabytes 还称 Ninja
              去年扩展到餐饮配送，公司由此不再只与小型杂货应用竞争，而是在同一消费篮子和便利任务上，对抗餐饮配送巨头、多品类区域平台，以及线下或商户自营的现状方案。范围扩大很重要，因为买方可以同时使用多个应用；当平台经济性变差时，商户也可以把订单转回自有渠道或实体店。
            claimRefs:
              - CP001
