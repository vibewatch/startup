  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 公开证据支持一条由密度驱动、从购物篮需求通向毛利的即时零售经营链路，但没有披露 GMV、净收入、费用和履约成本的确切构成。
    data:
      nodes:
        - label: 客户购物篮需求
          description: 杂货、家居用品、药品和日常必需品构成持续的需求输入。
        - label: 暗店 / 微型履约库存
          description: 超本地库存和拣货能力让订单能够快速备货。
        - label: 20-30 分钟末端配送
          description: 快速履约是核心客户承诺，也是主要运营成本驱动因素。
        - label: 确认收入
          description: 公开来源暗示收入来自商品和服务，但没有披露 GMV 到净收入的拆分。
        - label: 履约与促销成本
          description: 拣货、仓储、骑手支出和促销决定规模能否转化为利润。
        - label: 毛利路径
          description: 在标题式增长转化为可持续利润率前，密度和复购需求必须抵消服务成本。
