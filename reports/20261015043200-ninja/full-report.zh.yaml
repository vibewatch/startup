  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 价格敏感性来自一连串真实信号，但其后仍接着实质性的证据缺口。
    data:
      nodes:
        - id: scale
          label: 区域运营覆盖
          detail: 官方和独立来源都指向四个海湾市场及快速配送品类。
          claimRefs:
            - CV003
            - CV004
        - id: financing
          label: 2025 年轮次，估值 $1.5B
          detail: 私募市场验证存在，但这仍只是新闻标题中的估值标记，不是完整的公允价值证明。
          claimRefs:
            - CV001
        - id: exit
          label: IPO 选择权
          detail: 多篇 2026 年文章将 Ninja 与 Tadawul 准备工作联系起来。
          claimRefs:
            - CV002
        - id: gaps
          label: 经济性披露缺口
          detail: 经审计的收入质量、利润率、留存和股权结构条款，在公开证据中仍未得到证实。
          claimRefs:
            - CV009
            - CV010
        - id: downside
          label: 整合与利润率风险
          detail: 战略野心确实存在，但行业环境仍有利润率压力和资本配置风险。
          claimRefs:
            - CV006
            - CV007
        - id: outcome
          label: 跟踪，不买入
          detail: 更好的价格或明显更强的披露，可能让投资判断上调。
          claimRefs:
            - CV014
    claimRefs:
      - CV014
