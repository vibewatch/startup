        title: 重叠与差异化来自运营，而不是价格
        blocks:
          - type: paragraph
            body: >-
              这组来源支持的最清晰差异化是执行架构，而不是专有功能清单或透明的价格优势。Gulf Wire 称 Ninja 的模式依靠速度、规模和运营密度，而不是促销驱动的经济性；Tech in Asia
              则称新增资本将用于改善物流并筹备 IPO。综合来看，证据显示 Ninja 试图靠履约可复制性、品类相邻扩张和资本支持的网络建设取胜。但材料没有展示的内容同样重要：其中没有 Ninja
              或其所列竞争对手的价目表、合同模式或补贴结构，因此断言 Ninja 靠价格获胜只是猜测，不是尽调结论。
