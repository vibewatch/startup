        title: 定价、切换与护城河耐久性仍缺少证据
        blocks:
          - type: paragraph
            body: >-
              本章对竞争者类别的比较，比对商业条款更有把握。保留的竞争者来源没有一家公布 Ninja、HungerStation、Talabat 或 Jahez
              在海湾合作委员会地区的公开价目表、商户佣金表、订阅层级或折扣阶梯。因此，切换成本只能作定性判断：运营密度和所有权规模可能重要，但证据没有显示用户是否只用一个平台、商户是否受到合同锁定，或补贴是否仍按城市驱动行为。即使名称环境也很嘈杂；印度
              SharkNinja 发布会说明，围绕 “Ninja” 的裸词检索本身并不具备区分度，这构成弱信号的护城河风险，而不是核心竞争证明。
