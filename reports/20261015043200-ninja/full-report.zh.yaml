  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 牛市
        - IPO 准备推进，区域规模转化为经过验证的收入质量，治理披露也有所加强。
        - 如果公开市场认可 Ninja 是具备可信经济性的规模化海湾快速商业领导者，上一轮私募估值可能被证明偏保守。
        - IPO 准备执行、治理审查和单位经济性证明。
        - 需要经交叉验证的收入质量，以及比当前指定材料更清晰的治理证据。
      - - 基准
        - 公司真实存在，已具规模且能够融资，但公开证据仍集中在融资轮和 IPO 头条报道。
        - $1.5 billion 作为私募参考点是合理的，但在经济性披露改善前不应追价。
        - 倍数压缩、未披露条款和披露质量不均。
        - 与当前证据最为吻合。
      - - 熊市
        - 单一来源的规模主张经不起验证，或者利润率和优先股堆叠被证明明显差于头条叙事。
        - 更严格评估经济性后，业务可能被重新定价至上一轮私募估值以下，从而产生下行。
        - 盈利能力弱、隐藏的优先股堆叠或 IPO 窗口延后。
        - 若尽调无法验证收入质量和贡献利润，发生的可能性会上升。
    notes: 情景体现的是估值纪律，而非点估计；指定材料不足以支持精确目标价或模型化 IRR 结果。
    claimRefs:
      - CV002
      - CV006
      - CV008
      - CV009
      - CV010
      - CV013
      - CV014
