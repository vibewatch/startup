  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据显示，消费者旅程从城市便利起步，随后扩展到更多品类、更多城市，再走向区域铺开。
    data:
      nodes:
        - label: 城市补充型杂货订单
          actor: Saudi household shopper
          phase: Initial adoption
          channels:
            - Direct app
            - Dark-store delivery
          touchpoints:
            - Groceries
            - Household essentials
            - 25-minute delivery promise
          note: 公开证据支持速度和品类丰富度，但没有披露活跃用户数。
          tone: positive
        - label: 家居必需品交叉销售
          actor: Repeat convenience shopper
          phase: Repeat basket expansion
          channels:
            - Same app
            - Last-mile network
          touchpoints:
            - Beauty
            - Pet supplies
            - Everyday replenishment
          note: 品类广度已公开，但复购节奏尚未公开。
          tone: neutral
        - label: 预制食品加购
          actor: Convenience-led consumer
          phase: Frequency expansion
          channels:
            - Food delivery
            - Same-account ordering
          touchpoints:
            - Restaurant orders
            - Incremental frequency
          note: 来源提到餐饮配送，但没有说明食品订单占总需求的比例。
          tone: neutral
        - label: 数字药房延伸
          actor: Health and urgent-needs shopper
          phase: Higher-need category expansion
          channels:
            - Pharmacy fulfillment
            - App ordering
          touchpoints:
            - Medical products
            - Pharmacy orders
          note: 融资和 IPO 报道反复将药房定位为增长方向。
          tone: positive
        - label: 沙特新城市扩张
          actor: Multi-city household base
          phase: Geographic expansion
          channels:
            - Riyadh
            - Jeddah
            - Eastern Province
          touchpoints:
            - Density build-out
            - Operations scaling
          note: 公开的扩张信号很强，但城市层面的集中度尚未披露。
          tone: neutral
        - label: GCC 区域扩张
          actor: Gulf household base
          phase: Regional expansion
          channels:
            - Bahrain
            - Qatar
            - Kuwait
          touchpoints:
            - Cross-border replication
            - Convenience demand
          note: 四国覆盖范围已公开，但各市场的留存和盈利能力尚未公开。
          tone: risk
    approximationNotes: 旅程阶段是根据公开的品类和地理信息推断的；该顺序展示的是采用入口和扩张循环，不是实测转化率。
