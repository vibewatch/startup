    title: 正论 / 反论表
    columns:
      - 论点
      - 证据
      - 哪些事实会改变判断
    rows:
      - - 正论：可信的私募市场验证
        - 据报道 2025 年融资轮约为 $250 million，估值 $1.5 billion。
        - 若融资条款和投资者构成显示结构清晰、优先权溢价负担低，判断会改善。
      - - 正论：存在退出选择权
        - 多篇 2026 年文章将公司与 Tadawul IPO 准备联系起来，而非仅停留在遥远愿景。
        - 若银行、申报路径和时间表得到更强来源确认，判断会改善。
      - - 正论：运营覆盖已具区域性
        - 官方和独立来源均称 Ninja 在沙特、巴林、卡塔尔和科威特提供快速必需品配送。
        - 若披露按地理区域划分的经济性和留存，判断会改善。
      - - 反论：治理图景并不清晰
        - 现有来源对创始人归属的说法不一致，说明治理和运营控制仍需尽调。
        - 若董事会、创始人和管理层职责在公开材料中得到统一说明，问题可解决。
      - - 反论：经济性证据薄弱
        - 材料中最有力的收入数字仅来自单一来源，公开报道也未披露经审计利润率、留存或优先股堆叠。
        - 若经审计财务数据或可信二手报道验证收入质量和利润率，判断会改善。
      - - 反论：行业整合有两面性
        - 对 Delivery Hero 资产的战略兴趣显示其有野心，但偏负面的报道也将该行业描述为利润率承压、由整合驱动。
        - 若证明具备收购纪律和交易后的融资能力，判断会改善。
    notes: 各行将有证据支持的正面因素与限制分开；它们不是评分权重，不应被理解为机械化投资模型。
