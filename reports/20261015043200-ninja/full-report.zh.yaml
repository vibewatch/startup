        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              2026 年公开报道一致将 Ninja
              描述为一家总部位于利雅得的沙特即时零售平台，重点覆盖杂货、药品、家庭用品和日常必需品，并从沙特阿拉伯扩展到巴林、卡塔尔和科威特。现有报道呈现出的运营逻辑不是追求广泛的市场品类，而是速度加本地密度：一篇专题称
              Ninja 在 28 座城市运营 100 家暗仓，并以约 20 分钟的配送窗口为目标。仅凭 “Ninja” 这个词无法安全确认尽调对象：证据池里有一篇无关的 SharkNinja 文章，而一条带 Ninja
              标签的 Riyadh Tech Week 结果只有非官方指南免责声明，没有实质性的公司信息。因此，涉及身份的判断必须明确限定为沙特即时零售及其域名语境。
