        title: 规模化视角与区域覆盖
        blocks:
          - type: paragraph
            body: >-
              现有材料足以搭建规模化视角，但不足以为 Ninja 建立可辩护的公开 TAM/SAM/SOM。Tech in Asia 转述了海湾合作委员会和沙特即时零售的快速扩张预测；其他多个来源则确认 Ninja
              当前覆盖沙特阿拉伯、巴林、卡塔尔和科威特，并将近期融资与进一步区域增长联系起来。这些公司规模锚点有助于提供背景，但不能替代有方法论支撑的可服务市场估算，因为它们没有拆分品类结构、城市密度或买方群体的消费。结论是，本章可以展示方向和合理规模，但仍必须将
              SAM/SOM 标记为未解决。
