      - number: '8.3'
        title: 入场纪律应偏向跟踪和升级尽调
        blocks:
          - type: paragraph
            body: >-
              实际建议是，在尽调将证据基础从 headline 估值支持推进到可用于投资判断的经济性和治理之前，继续把 Ninja
              放在跟踪名单中。融资条款是否带来隐藏的优先权或稀释悬念，需要核验；创始人和董事会披露需要调和；报道的收入规模也需要验证能否转化为有吸引力的净收入、贡献利润和现金转化，而不只是订单量。指定材料池也展示了通用公司名称会让发现过程多么嘈杂：一条结果讲的是
              SharkNinja
              家电，另一条抓取后只得到单薄的网站页眉，因此可比公司和披露信息的发现仍需仔细筛选。更好的价格、经审计的单位经济或更强的公开治理证据可能改善结论；没有这些，倍数压缩的下行风险仍然过于真实，不能给出买入评级。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV006
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 建议
            body: 跟踪 Ninja，而不要按最近报道的 $1.5B 估值买入，因为退出选择权可见，但为估值投资判断所需的经济性和治理证据仍不完整。
            calloutType: recommendation
            claimRefs:
              - CV013
          - type: callout
            title: 价值最高的尽调要求
            body: 最重要的一套尽调材料是经审计的财务和股权结构表披露，能够区分 GMV 与净收入、展示贡献利润，并说明 2025 年融资带来的任何清算或稀释悬念。
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
