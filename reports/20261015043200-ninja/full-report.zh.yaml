companyProfile:
  summary: >-
    Ninja 是一家沙特即时零售和按需零售平台，2022
    年在利雅得成立。公开报道如今将其描述为覆盖沙特阿拉伯及更广泛海湾合作委员会地区。平台通过本地化履约，销售杂货、家庭必需品、药品及相邻的日常需求品类；近期公开报道越来越多地把它塑造成一家准备
    IPO、已具规模的公司，而不再只是小众杂货应用。
  founders:
    - name: Saud Al Qahtani
      role: 联合创始人
      background: 此前共同创办 HungerStation，因此具备直接的沙特配送市场运营经验。
      claimRefs:
        - CO003
        - CO004
    - name: Canberk Donmez
      role: 联合创始人
      claimRefs:
        - CO003
  foundingLocation: Riyadh, Saudi Arabia
  headquarters: Riyadh, Saudi Arabia
  productSummary: 面向消费者的快速配送市场，覆盖杂货、药房、家庭必需品及相邻的紧急需求品类。
  customerFocus: 在短时配送窗口内购买日常必需品的沙特及海湾合作委员会消费者。
  businessModel: 交易型即时零售，依靠本地履约和最后一公里配送实现单位经济。
  stage: Late-stage private
  fundingStatus: 2025 年融资约 $250M，估值约 $1.5B，目前正在筹备潜在的 Tadawul 上市。
