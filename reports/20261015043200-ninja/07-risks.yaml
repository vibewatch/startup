figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual risk remains highest where public growth evidence is strongest
      but underwriting-grade operating or compliance detail is still missing.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Density economics / dark-store utilization
          values: [High, High, Moderate, High]
        - label: Multi-jurisdiction licensing and pharmacy compliance
          values: [Medium-High, High, Low-Moderate, High]
        - label: IPO disclosure and governance readiness
          values: [Medium, High, Low, Medium-High]
        - label: Potential HungerStation transaction distraction
          values: [Medium, Medium-High, Low, Medium-High]
        - label: Metric quality and unit-economics opacity
          values: [High, High, Low, High]
        - label: Search / public-data ambiguity for remaining diligence
          values: [Low, Medium, Moderate, Low]
    approximationNotes: >-
      Qualitative ratings synthesize the cited source record; they do not claim
      a probabilistic model or independent incident frequency.
    claimRefs: [CR003, CR006, CR007, CR008, CR010, CR013]
callouts:
  - calloutType: risk
    title: Kill criteria before underwriting an IPO entry
    body: >-
      Move the risk rating higher if Ninja cannot produce audited revenue-to-
      margin bridges, country-by-country licensing evidence, and a clear answer
      on whether any HungerStation process is exploratory or capital-committed.
      Those three items are the fastest path from an exciting growth story to an
      avoidable underwriting mistake.
    claimRefs: [CR006, CR007, CR008, CR010]
  - calloutType: insight
    title: The visible mitigation is capital, not verification
    body: >-
      The evidence pool repeatedly shows that Ninja has raised capital and is
      preparing for a listing, but it does not yet provide equivalent public
      proof on unit economics, governance depth, or compliance operations. That
      asymmetry is the central risk judgment for this chapter.
    claimRefs: [CR001, CR010, CR011, CR012]
