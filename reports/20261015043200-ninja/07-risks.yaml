  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / system
      - Role
      - Concentration signal
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - External capital and IPO ecosystem
        - Riyad Capital, prospective IPO banks, and public-market investors
        - Balance-sheet support and listing execution
        - 2025 round and IPO reports are central to the public mitigation story
        - IPO window shuts or capital-market appetite weakens before disclosure gaps close
        - High
        - >-
            Test runway, covenant headroom, and whether the business can slow
            rollout without breaking the service proposition.
        - Medium-High
      - - Merchant, dark-store, and rider operating network
        - Local merchants, inventory system, and last-mile fleet
        - Fulfillment density and service reliability
        - Model depends on dense local execution rather than a pure marketplace
        - Utilization or service levels slip as the footprint broadens
        - High
        - >-
            Demand route-density, rider productivity, inventory turns, and
            order-time SLA evidence by city cohort.
        - High
      - - Strategic transaction path around HungerStation
        - Delivery Hero assets and any financing or consortium partner
        - Expansion shortcut and competitive repositioning
        - Reported as a possible option, not a completed transaction
        - Management pursues M&A before the base business is fully evidenced for IPO investors
        - Medium-High
        - >-
            Underwrite M&A only with ring-fenced capital, integration owners,
            and downside cases separate from the core thesis.
        - Medium-High
    notes: >-
      Dependency register distinguishes funding, operating-network, and
      transaction-path exposures because each fails for different reasons.
