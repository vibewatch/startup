  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue-scale
      missingEvidence: Audited 2025 and year-to-date 2026 statements separating GMV, net revenue, gross profit, EBITDA, and contribution margin.
      whyItMatters: Without audited economics, the last private valuation can only be treated as a price signal rather than validated fair value.
      diligencePath: Request audited financial statements plus cohort or city-level unit economics from management and lead investors.
      relatedQuestionRefs:
        - QV005
    - type: private-evidence-only
      severity: material
      topic: governance-clarity
      missingEvidence: Board composition, founder roles, independent directors, and any governance rights tied to the 2025 financing.
      whyItMatters: Governance ambiguity affects IPO readiness, control risk, and whether public investors would accept the same multiple as the private round.
      diligencePath: Request the current board deck, org chart, financing term sheet, and cap-table governance side letters.
      relatedQuestionRefs:
        - QV006
    - type: private-evidence-only
      severity: material
      topic: recommendation
      missingEvidence: Full cap table showing liquidation preferences, anti-dilution terms, and any structured instruments around the 2025 round.
      whyItMatters: Entry discipline depends on whether the headline valuation overstates common-equity value available to new investors.
      diligencePath: Obtain the latest cap table, preferred share terms, and any debt or warehouse facilities before underwriting price.
      relatedQuestionRefs:
        - QV008
