callouts:
  - calloutType: recommendation
    title: Recommendation
    body: >-
      Track Ninja rather than buying into the last reported $1.5 billion mark, because exit
      optionality is visible but the economics and governance evidence needed to underwrite price
      remain incomplete.
    claimRefs:
      - CV013
  - calloutType: risk
    title: Highest-value diligence ask
    body: >-
      The single most important diligence package is audited financial and cap-table disclosure that
      separates GMV from net revenue, shows contribution margins, and details any liquidation or
      dilution overhang from the 2025 round.
    claimRefs:
      - CV009
      - CV010
