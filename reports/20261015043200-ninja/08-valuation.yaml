      - Evidence
      - What would change the view
    rows:
      - ["Thesis: credible private-market validation", "2025 round reported at about $250 million and $1.5 billion valuation.", "Improves if round terms and investor mix show clean structure and low preference overhang."]
      - ["Thesis: exit optionality exists", "Multiple 2026 articles connect the company to Tadawul IPO preparation rather than only distant aspiration.", "Improves if banks, filing path, and timeline are confirmed with stronger sources."]
      - ["Thesis: operating footprint is already regional", "Official and independent sources place Ninja across Saudi Arabia, Bahrain, Qatar, and Kuwait in fast essentials delivery.", "Improves if geography-level economics and retention are disclosed."]
      - ["Anti-thesis: governance picture is not clean", "Founder attribution differs across retained sources, which implies diligence is still needed on governance and operating control.", "Resolves if board, founders, and management responsibilities are publicly reconciled."]
      - ["Anti-thesis: economics evidence is thin", "The strongest revenue figure in the pool is single-source and public coverage does not disclose audited margins, retention, or preference stack.", "Improves if audited financials or credible secondary reporting validate revenue quality and margins."]
      - ["Anti-thesis: consolidation can cut both ways", "Strategic interest in Delivery Hero assets shows ambition, but adverse-leaning coverage also frames the sector as margin-pressured and consolidation-driven.", "Improves if acquisition discipline and post-deal funding capacity are demonstrated."]
    notes: >-
      Rows separate evidence-backed positives from evidence-backed constraints; they are not scored
      weights and should not be read as a mechanical investment model.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation/return logic
      - Key risks
      - Probability signal
    rows:
      - ["Bull", "IPO preparation advances, regional scale converts into validated revenue quality, and governance disclosure strengthens.", "The last private mark could prove conservative if public markets accept Ninja as a scaled Gulf quick-commerce leader with credible economics.", "Execution on IPO prep, governance scrutiny, and unit-economics proof.", "Needs corroborated revenue quality plus cleaner governance evidence than the assigned pool currently offers."]
      - ["Base", "The company is real, scaled, and financeable, but public evidence remains concentrated in round and IPO headlines.", "The $1.5 billion mark is plausible as a private reference point but should not be chased without better economics disclosure.", "Multiple compression, undisclosed terms, and uneven disclosure quality.", "Best fit with current evidence."]
      - ["Bear", "Single-source scale claims do not hold up, or margins and preferences prove materially worse than headline narratives imply.", "Downside comes from repricing the business below the last private mark once economics are underwritten more rigorously.", "Weak profitability, hidden preference stack, or delayed IPO window.", "Becomes more likely if diligence cannot validate revenue quality and contribution margins."]
    notes: >-
      Scenarios express valuation discipline, not point estimates; the assigned pool is insufficient
      for precise price targets or modeled IRR outputs.
    claimRefs:
      - CV002
      - CV006
      - CV008
      - CV009
      - CV010
      - CV013
      - CV014
