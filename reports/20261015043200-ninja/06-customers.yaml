  evidenceGaps:
    - type: missing-source
      severity: material
      topic: named-customer-proof
      missingEvidence: Named customer references, anonymized customer cohorts, or public case studies showing repeat production use by city or category.
      whyItMatters: Without direct customer references, investors must rely on rollout proxies instead of validated user outcomes and reference quality.
      diligencePath: Ask management for cohort-level dashboards, anonymized top-customer examples, and any consumer NPS or complaint-resolution reporting segmented by category.
      relatedQuestionRefs: [QU003, QU008]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: retention-gap
      missingEvidence: Retention metrics such as NRR, GRR, churn, repeat-order frequency, and category-specific customer cohorts.
      whyItMatters: Customer durability cannot be underwritten from growth alone; repeat use is the key test for quick-commerce economics.
      diligencePath: Request monthly cohorts by city and category, including repeat-order frequency, churn, and reactivation rates for 2024-2026.
      relatedQuestionRefs: [QU004]
    - type: private-evidence-only
      severity: material
      topic: concentration-gap
      missingEvidence: City-, country-, and category-level order mix, gross profit contribution, and any top-market concentration thresholds.
      whyItMatters: Public expansion stories do not reveal whether the business is diversified or still dependent on a small set of dense Saudi markets.
      diligencePath: Request contribution margin and order density by city, country, and major category, plus any internal concentration limits used by management.
      relatedQuestionRefs: [QU006]
      relatedTableRefs: [TU001, TU002]
    - type: conflicting-data
      severity: material
      topic: revenue-denominator
