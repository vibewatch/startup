      - number: '2.3'
        title: Buyer, payer, and adoption mechanics
        blocks:
          - type: paragraph
            body: >-
              The clearest demand pattern in the assigned evidence is household convenience spending. Ninja's offer is
              built around top-up grocery baskets, prepared food, and time-sensitive household or pharmacy needs, with
              the same mobile checkout increasingly extending into categories such as beauty, pet care, and
              telemedicine-linked delivery. PaySpace adds an important commercial detail: the platform requires online
              payment at checkout and supports cards, wallets, and Tabby BNPL, which implies that the typical buyer,
              user, and payer are the same consumer household account rather than a reimbursed institution or enterprise
              budget owner. That supports a rapid-adoption thesis around speed and basket expansion, but it also means
              adoption is sensitive to repeat-order behavior and willingness to pay for convenience.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM006
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM006
      - number: '2.4'
        title: Constraints, contradictions, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The largest constraint in this chapter is not demand skepticism; it is evidence quality. Most retained
              sources emphasize funding, unicorn status, IPO timing, or expansion ambition rather than disclosing
              category-level spend, city economics, or segment-specific penetration. Even the market-search pool shows
              discovery noise: one assigned "Ninja" market result is actually a SharkNinja appliance launch in India,
              which demonstrates how easily adjacent but irrelevant data can contaminate naive market work. Public
              revenue commentary is also not clean enough to stand in for market share because the sources do not
              reconcile revenue, GMV, gross margin, or category profitability. Until management or a direct analyst
              dataset closes those gaps, this chapter should be read as evidence-backed market framing rather than a
              final sizing model.
            claimRefs:
              - CM009
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Ninja is competing for rapid household replenishment, not all retail spend
            body: >-
              Quick-commerce speed, dark-store density, and category adjacency matter more here than a generic
              e-commerce TAM because the relevant substitute is the urgent local trip or slower same-day order.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM004
          - type: callout
            title: Public market sizing still trails company ambition
            body: >-
              The assigned pool can show broad q-commerce growth and Ninja's own scale anchors, but it still cannot
              isolate a public Saudi or GCC SAM/SOM by category, city, or buyer cohort.
            calloutType: risk
            claimRefs:
