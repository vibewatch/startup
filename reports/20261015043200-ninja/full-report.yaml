      - number: '4.2'
        title: Unit economics and cost drivers
        blocks:
          - type: paragraph
            body: >-
              The strongest public positive is not disclosed margin math but the narrative that Riyad Capital backed
              Ninja because of "strong unit economics" and a scalable model. Independent commentary adds the more
              important caveat: public-market scrutiny will turn on whether the company can keep growth without relying
              on promotions and whether operational density can offset picking, warehousing, and rider costs. In other
              words, the mechanism looks plausible for a fast-delivery operator, but the underwriting inputs that matter
              most -- CAC, payback, contribution margin, retention, basket economics, and city-by-city profitability --
              remain undisclosed in the retained public evidence. That keeps margin path analysis directional rather
              than investment-grade.
            claimRefs:
