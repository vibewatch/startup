  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal map of the publicly supported field, emphasizing distribution power on one axis and category breadth on
      the other.
    data:
      xAxis:
        label: Distribution power
        min: 1
        max: 5
        lowLabel: Limited
        highLabel: Strong
        description: Ordinal score based on owned assets, incumbent position, and capital or M&A leverage in the retained evidence.
      yAxis:
        label: Category breadth
        min: 1
        max: 5
        lowLabel: Narrow
        highLabel: Broad
        description: Ordinal score based on how many adjacent convenience missions the retained evidence explicitly supports.
      points:
