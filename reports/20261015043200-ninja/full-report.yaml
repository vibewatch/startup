    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Public 2026 coverage consistently describes Ninja as a Riyadh-based Saudi quick-commerce platform focused
              on groceries, medicines, household goods, and daily essentials, with regional expansion beyond Saudi
              Arabia into Bahrain, Qatar, and Kuwait. The operating thesis presented in the available coverage is speed
              plus local density rather than broad marketplace assortment: one feature profile says Ninja runs 100 dark
              stores across 28 cities and targets roughly 20-minute delivery windows. The bare word "Ninja" is not
              identity-safe for diligence: the assigned evidence pool included an unrelated SharkNinja article, while a
              Ninja-labeled Riyadh Tech Week result yielded only an unofficial-guide disclaimer rather than substantive
              company information. Identity claims therefore require explicit Saudi quick-commerce and domain
              qualifiers.
