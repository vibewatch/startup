      - number: '6.2'
        title: Public customer proof is mostly production-signal by category, not named references
        blocks:
          - type: paragraph
            body: >-
              The chapter’s core diligence limitation is that public customer proof remains broad but shallow. Retained
              sources repeatedly describe production services and funded expansion, yet they do not disclose named
              consumer cohorts, enterprise accounts, institutional customers, or durable reference stories that would
              prove retention quality. Even the more detailed articles anchor on product breadth, delivery speed,
              regional expansion, funding, and IPO preparation rather than on named users or case studies. That is
              workable for a B2C quick-commerce business where individual end users are naturally anonymous, but it
              still leaves investors relying on proxy proof rather than explicit customer references. Search quality
              also needs manual filtering because “Ninja” returns unrelated SharkNinja appliance coverage, and a
              startup-directory page retained in the pool did not expose usable company/customer detail in fetched form.
            claimRefs:
              - CU005
              - CU006
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU007
              - CU011
              - CU012
      - number: '6.3'
        title: Expansion logic is visible; durability and concentration remain under-disclosed
        blocks:
          - type: paragraph
            body: >-
              The clearest expansion loop in public evidence is more cities plus more categories on the same convenience
              stack. Funding coverage ties new capital to logistics expansion, AI-led operations, and digital pharmacy
              growth, while IPO-related articles describe regional rollout and increasingly scaled revenue ambition.
              Tech Startups’ report that Ninja was considering HungerStation or Talabat-related assets also suggests
              management values customer density and installed demand pools, not just top-line growth. The missing piece
              is durability. None of the retained sources provides NRR, GRR, churn, renewal, cohort, satisfaction, or
              top-market concentration metrics, so the public record still cannot show whether customer demand is sticky
              enough to support the reported revenue scale or whether growth depends on a small number of dense cities
              or heavily promoted categories.
            claimRefs:
              - CU004
              - CU007
              - CU009
              - CU010
              - CU013
              - CU014
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Real demand is visible, but mostly through rollout proxies
            body: >-
              Saudi multi-city rollout, GCC expansion, and category breadth are credible adoption signals, but public
              materials still stop short of disclosing active users or cohort data.
            calloutType: insight
            claimRefs:
              - CU002
              - CU003
              - CU005
          - type: callout
            title: Customer durability is still the key missing proof
            body: >-
              The retained pool does not disclose retention, concentration, or named reference-customer evidence strong
              enough to underwrite long-term customer quality on its own.
            calloutType: risk
            claimRefs:
              - CU006
              - CU013
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and disclosure risk
        blocks:
          - type: paragraph
            body: >-
              The public risk picture is not that Ninja faces one binary legal blocker, but that it is layering several
              regulated activities and jurisdictions on top of a delivery network that is already operationally complex.
              Sacra explicitly flags "Saudi mandatory home-delivery permits effective July 2025, SFDA rules on online
              drug sales, and Qatar's new 2026 e-commerce licensing framework" as a fragmentation risk, and the same
              source notes that Ninja's Saudi storefront already exposes a Ministry of Health license number for Ninja
              Care. That means pharmacy expansion is not just a growth upside; it is also a compliance surface that must
              stay synchronized with last-mile execution and cross-border rollout. Separately, 2026 media reports
              suggest an IPO process is active, but the assigned evidence still provides only light public detail on
              governance, adviser selection, and audited operating metrics. For an investor, that combination makes
              disclosure execution part of the risk register rather than a late-stage formality.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR010
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR012
      - number: '7.2'
        title: Operating and model risk
        blocks:
          - type: paragraph
            body: >-
              Ninja's core operating risk remains the classic quick-commerce density problem: dark stores, riders,
              inventory, and service guarantees create a fixed-cost base that only works when order concentration is
              high enough in each micro-market. Sacra calls this out directly, warning that expansion across new Saudi
              cities, new GCC markets, and new categories can build infrastructure faster than demand density matures.
              The concern matters more because public articles emphasize growth scale and headline revenue, but the
              assigned pool does not provide audited net revenue, gross profit, EBITDA, or city-level contribution data.
              A reported $1 billion 2025 revenue figure and $1.6 billion 2026 target can signal impressive demand while
              still leaving margin quality unresolved. The operating question is therefore not whether Ninja is growing,
              but whether rapid growth is translating into durable unit economics rather than capital-intensive volume.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR008
              - CR010
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR008
              - CR010
              - CR013
      - number: '7.3'
        title: Dependency triggers and diligence path
        blocks:
          - type: paragraph
            body: >-
              The 2026 risk profile also includes distraction and dependency risk. One report says Ninja is considering
              a bid for some of Delivery Hero's Middle East assets, with immediate interest in HungerStation; even if a
              deal does not close, evaluating or financing that path can consume management bandwidth during an
              IPO-preparation window. More broadly, the company's public mitigation story is still financing-heavy: the
              2025 round is consistently framed as balance-sheet support for logistics, expansion, and listing
              preparation. That is helpful, but it is not the same as proof that compliance systems, governance, or
              city-level economics are already robust enough for public-market scrutiny. A smaller but real diligence
              hazard is public-data ambiguity around the name "Ninja": the assigned pool itself contained unrelated
              SharkNinja appliance coverage, so remaining open items should be verified against issuer- or
              regulator-matched domains rather than keyword search alone.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR011
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR003
              - CR008
              - CR009
              - CR011
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Kill criteria before underwriting an IPO entry
            body: >-
              Move the risk rating higher if Ninja cannot produce audited revenue-to- margin bridges, country-by-country
              licensing evidence, and a clear answer on whether any HungerStation process is exploratory or
              capital-committed. Those three items are the fastest path from an exciting growth story to an avoidable
              underwriting mistake.
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR010
          - type: callout
            title: The visible mitigation is capital, not verification
            body: >-
              The evidence pool repeatedly shows that Ninja has raised capital and is preparing for a listing, but it
              does not yet provide equivalent public proof on unit economics, governance depth, or compliance
              operations. That asymmetry is the central risk judgment for this chapter.
            calloutType: insight
            claimRefs:
              - CR001
              - CR010
              - CR011
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation context is real, but public support is narrow
        blocks:
          - type: paragraph
            body: >-
              The assigned pool gives a coherent top line on financing and exit optionality. Multiple retained news
              sources report that Ninja raised about $250 million in 2025 at a $1.5 billion valuation, and several 2026
              articles frame the company as preparing or exploring a Tadawul IPO rather than simply floating an
              aspirational long-term idea. The same pool also aligns on the operating footprint: official and
              independent sources place Ninja across Saudi Arabia, Bahrain, Qatar, and Kuwait in quick delivery for
              groceries and everyday essentials. What the pool does not yet give is the evidence layer that would let an
              investor underwrite the mark with confidence: audited net revenue, contribution margins, retention, or
              liquidation preferences are not disclosed in the retained public coverage. That means the round is a real
              price signal, but not yet a validated fair-value anchor.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV010
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV010
              - CV013
      - number: '8.2'
        title: The thesis exists, but so does a disciplined anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investable case is straightforward: Ninja appears to have achieved meaningful Gulf scale unusually
              quickly, tied that scale to a fresh private mark, and built enough strategic relevance to surface in
              consolidation and IPO conversations. Those are not trivial signals. The anti-thesis is equally material.
              Public founder attribution is inconsistent across retained articles, which weakens governance clarity. The
              strongest quantified scale claim in the assigned pool, roughly $1 billion of 2025 revenue with a $1.6
              billion 2026 target, comes from a single low-reputation source and is not corroborated elsewhere in the
              pool. The same adverse-leaning coverage that highlights strategic ambition also describes a delivery
              market where consolidation and margin pressure matter, so scale alone should not be mistaken for durable
              economics. On balance, the evidence supports interest and monitoring, not conviction at the last reported
              price.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV014
      - number: '8.3'
        title: Entry discipline should favor tracking and diligence escalation
        blocks:
          - type: paragraph
            body: >-
              The practical recommendation is to keep Ninja in track territory until diligence moves the evidence base
              from headline valuation support to underwritten economics and governance. That means validating whether
              the round terms created hidden preference or dilution overhang, reconciling founder and board disclosures,
              and confirming whether the reported revenue scale translates into attractive net revenue, contribution
              margin, and cash conversion rather than just order volume. The assigned pool also shows how noisy
              discovery can be around a generic company name: one result was about SharkNinja appliances and another
              yielded only a thin site header after fetch, so comparable and disclosure discovery still needs careful
              curation. A better price, audited unit economics, or stronger public governance evidence could improve the
              call; without them, the downside from multiple compression remains too real for a buy rating.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV006
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: >-
              Track Ninja rather than buying into the last reported $1.5 billion mark, because exit optionality is
              visible but the economics and governance evidence needed to underwrite price remain incomplete.
            calloutType: recommendation
            claimRefs:
              - CV013
          - type: callout
            title: Highest-value diligence ask
            body: >-
              The single most important diligence package is audited financial and cap-table disclosure that separates
              GMV from net revenue, shows contribution margins, and details any liquidation or dilution overhang from
              the 2025 round.
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
