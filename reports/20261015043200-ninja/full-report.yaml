  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The retained sources consistently place Ninja inside quick commerce rather than broad e-commerce: the
              company is described as a rapid-delivery platform for groceries, restaurant orders, pharmacy products,
              household essentials, and adjacent convenience categories. That boundary matters because the relevant
              substitute set is not all retail spend; it is the urgent or convenience-led trip that a household might
              otherwise solve through a nearby grocer, restaurant pickup, pharmacy visit, or a slower marketplace order.
              The evidence also shows boundary creep. Public profiles increasingly mention cosmetics, perfumes, pet
              products, and telemedicine, which expands wallet share but also makes it harder to present one clean
              market definition without separating core replenishment demand from newer adjacency bets.
            claimRefs:
              - CM001
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM012
      - number: '2.2'
        title: Sizing lenses and regional reach
        blocks:
          - type: paragraph
            body: >-
              The pool contains enough evidence to build sizing lenses, but not a defensible public TAM/SAM/SOM stack
              for Ninja. Tech in Asia relays category forecasts showing rapid q-commerce expansion in both the GCC and
              Saudi Arabia, while multiple other sources anchor Ninja's current footprint across Saudi Arabia, Bahrain,
              Qatar, and Kuwait and tie recent funding to further regional growth. Those company-scale anchors are
              useful for context, but they are not substitutes for a methodology-backed serviceable market because they
              do not isolate category mix, city density, or spend by buyer segment. The result is a chapter that can
              show direction and plausible scale, but must still flag SAM/SOM as unresolved.
            claimRefs:
              - CM005
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
