      - number: '3.4'
        title: Pricing, switching, and moat durability remain under-evidenced
        blocks:
          - type: paragraph
            body: >-
              The chapter can compare competitor classes more confidently than it can compare commercial terms. None of
              the retained competitor-oriented sources publish GCC list pricing, merchant commission schedules,
              subscription tiers, or discount ladders for Ninja, HungerStation, Talabat, or Jahez. That means
              switching-cost analysis has to stay qualitative: operational density and ownership scale may matter, but
              the evidence set does not show whether users are single-homing, whether merchants face contractual
              lock-in, or whether subsidies still drive behavior by city. Even the naming environment is noisy; the
              unrelated SharkNinja launch in India shows that bare-word discovery around "Ninja" is not distinctive on
