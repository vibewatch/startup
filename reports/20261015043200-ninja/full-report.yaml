  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape scope and who solves the same job
        blocks:
          - type: paragraph
            body: >-
              The retained evidence points to a broader field than a single quick-commerce peer set. Menabytes and Tech
              in Asia both place Ninja across Saudi Arabia, Bahrain, Kuwait, and Qatar, with groceries, household
              essentials, pharmacy, and daily-needs delivery in scope. Menabytes also says Ninja expanded into food
              delivery last year, which means the company is no longer competing only with small grocery apps; it is
              contesting the same basket and convenience mission against food-delivery incumbents, multi-category
              regional platforms, and the offline or merchant-run status quo. That broadening matters because buyers can
              multi-home across several apps while merchants can still route orders through their own channels or
              physical stores when platform economics weaken.
