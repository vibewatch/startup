      - CE007
      - CE008
      - CE009
      - CE010
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence points to a consumer journey that starts with urban convenience and expands through more
      categories, more cities, and then regional rollout.
    data:
      nodes:
        - label: Urban top-up grocery order
          actor: Saudi household shopper
          phase: Initial adoption
          channels:
            - Direct app
            - Dark-store delivery
          touchpoints:
            - Groceries
            - Household essentials
            - 25-minute delivery promise
          note: Public proof is speed plus assortment, not disclosed active-user counts.
          tone: positive
        - label: Household essentials cross-sell
          actor: Repeat convenience shopper
          phase: Repeat basket expansion
          channels:
            - Same app
            - Last-mile network
          touchpoints:
            - Beauty
            - Pet supplies
            - Everyday replenishment
          note: Category breadth is public; repeat-order cadence is not.
          tone: neutral
        - label: Prepared-food add-on
          actor: Convenience-led consumer
          phase: Frequency expansion
          channels:
            - Food delivery
            - Same-account ordering
          touchpoints:
            - Restaurant orders
            - Incremental frequency
          note: Sources cite food delivery, but not the share of food orders in total demand.
          tone: neutral
        - label: Digital-pharmacy extension
          actor: Health and urgent-needs shopper
          phase: Higher-need category expansion
          channels:
            - Pharmacy fulfillment
            - App ordering
          touchpoints:
            - Medical products
            - Pharmacy orders
          note: Funding and IPO coverage repeatedly frame pharmacy as a growth vector.
          tone: positive
        - label: New-city Saudi rollout
          actor: Multi-city household base
          phase: Geographic expansion
          channels:
            - Riyadh
            - Jeddah
            - Eastern Province
          touchpoints:
            - Density build-out
            - Operations scaling
          note: Public rollout markers are strong, but city-level concentration is undisclosed.
          tone: neutral
        - label: GCC regional rollout
          actor: Gulf household base
          phase: Regional expansion
          channels:
            - Bahrain
            - Qatar
            - Kuwait
          touchpoints:
            - Cross-border replication
            - Convenience demand
          note: Four-country footprint is public; retention and profitability by market are not.
          tone: risk
    approximationNotes: >-
      Journey stages are inferred from public category and geography references; the sequence shows adoption surfaces
      and expansion loops, not measured conversion rates.
