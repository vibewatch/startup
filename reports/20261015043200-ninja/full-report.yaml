            body: >-
              The retained evidence points to a quick-commerce transaction model rather than a recurring software model:
              Ninja sells or facilitates rapid delivery of groceries, household goods, medicines, and other daily
              essentials across Saudi Arabia and nearby Gulf markets, with reported fulfillment times under 30 minutes
              and operations built around dark stores or micro-fulfillment nodes. Public coverage is directionally
              consistent that Ninja reached large scale quickly, with multiple 2026 outlets citing roughly $1 billion of
              2025 revenue and a $1.6 billion 2026 target, but those figures are media-reported and not accompanied by
              audited statements, revenue-recognition policy, or category mix. That makes the scale signal meaningful
              for diligence, while keeping revenue quality, repeatability, and net-take-rate questions open.
