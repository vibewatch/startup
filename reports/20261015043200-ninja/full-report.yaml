        title: Overlap and differentiation are operational, not yet price-led
        blocks:
          - type: paragraph
            body: >-
              The clearest supported differentiation in this source set is execution architecture, not a proprietary
              feature checklist or a transparent pricing edge. The Gulf Wire says Ninja's model relies on speed, scale,
              and operational density rather than promotion-led economics, while Tech in Asia says fresh capital is
              being used to improve logistics and prepare for an IPO. Taken together, the evidence suggests Ninja is
              trying to win on fulfillment repeatability, category adjacency, and capital-backed network buildout. What
              the bundle does not show is equally important: it does not provide list pricing, contract models, or
              subsidy structures for Ninja or its named rivals, so any claim that Ninja wins on price would be guesswork
              rather than diligence.
