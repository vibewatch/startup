        title: Operating model and expansion logic
        blocks:
          - type: paragraph
            body: >-
              The evidence that does exist points to an operations-led product stack. The 2022 company release tied
              growth to a "technology driven dark stores" network and claimed 25-minute delivery timing, while 2025-2026
              coverage kept emphasizing logistics, infrastructure, speed, and operational density. Independent reports
              also extend the operating footprint beyond core Saudi cities into Bahrain, Qatar, and Kuwait, and link
              recent funding to logistics improvement plus adjacent vertical expansion such as medical products and
              digital services. The underwritable takeaway is that Ninja's moat appears to sit in city density,
