  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer promise and product scope
        blocks:
          - type: paragraph
            body: >-
              In the assigned official and company-issued evidence, Ninja positions itself as a Saudi rapid-delivery
              service with a 24/7 convenience promise rather than as a disclosed developer platform or deep-tech stack.
              The strongest retained product proof is still category breadth: the 2022 company release described
              thousands of items spanning fresh produce, skincare, beauty, and pet food, while later independent
              coverage kept describing the offer as fast delivery of groceries, food, household goods, daily essentials,
              and pharmacy-adjacent needs. That makes the publicly evidenced product legible as a high-frequency urban
              convenience app with expanding basket breadth, but not as a software architecture story with verified
              APIs, integrations, or technical benchmarks.
