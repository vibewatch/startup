        - label: Demand surface
          detail: Consumer-facing promise visible in assigned official and media evidence.
          items:
            - Quick delivery 24 / 7
            - One-app convenience positioning
        - label: Core basket
          detail: Everyday categories repeatedly named in retained sources.
          modules:
            - Groceries, food, household essentials
            - Fresh produce, skincare, beauty, pet food
        - label: Urgent adjacency
          detail: Non-core but urgency-linked categories named in public coverage.
          modules:
            - Pharmacy products and medicines
            - Shopping and home-services positioning
            - Medical products and digital services roadmap
        - label: Fulfilment core
          detail: Publicly evidenced operating model.
          modules:
            - Technology driven dark stores
            - Local inventory near dense demand
        - label: Delivery execution
          detail: Publicly claimed service-level and scale logic.
          modules:
            - 25-minute delivery claim
            - Operational density as the moat thesis
        - label: Expansion engine
          detail: Capital-backed scale path in retained 2025-2026 coverage.
          modules:
