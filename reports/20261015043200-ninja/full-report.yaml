      - number: '4.3'
        title: Capital adequacy and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              Capital access is the clearest verified strength. Multiple sources align that Ninja raised about $250
              million in 2025 at around a $1.5 billion valuation, and several describe that round as deliberate pre-IPO
              balance-sheet preparation to fund expansion into new verticals, technology, logistics, and regional
              growth. That framing supports the idea that the company is financing scale-up and potential listing
              preparation rather than covering an openly disclosed liquidity crisis. Still, the same evidence set also
              shows why underwriting remains blocked: no public cash balance, burn, debt schedule, working-capital
              profile, or audited margin bridge is disclosed, and even open-web discovery is noisier than usual because
              bare "Ninja" searches still surface unrelated SharkNinja appliance coverage. The result is a credible
              capital-raising story without enough disclosure to judge runway, dilution risk, or post-IPO earnings
              quality.
            claimRefs:
              - CI003
              - CI006
              - CI007
              - CI012
              - CI014
