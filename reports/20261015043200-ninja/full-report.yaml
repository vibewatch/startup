              Ninja’s customer base is best understood as a direct-to-consumer household convenience platform rather
              than a channel-led or enterprise-led business. Across the retained 2025-2026 coverage, the recurring user
              is an urban household shopper buying groceries, household goods, beauty/personal care, pet supplies,
