      - number: '3.3'
        title: Distribution power sits with incumbents and asset owners
        blocks:
          - type: paragraph
            body: >-
              TechStartups is the strongest evidence in the pool on structural rivalry. It says Delivery Hero still
              controls HungerStation and Talabat in the region, and reports that Ninja is considering buying some of
              those assets while Uber, Prosus, and even DoorDash circle the same portfolio. That turns the competitive
              problem into more than product overlap: ownership concentration can change capital allocation, promotional
              intensity, and market access faster than a startup can ship a new feature. Ninja's founder link to
              HungerStation may lower execution friction against that incumbent playbook, but the same article also
              describes a wave of consolidation and pressured margins, which is adverse evidence against any easy moat
