            body: >-
              The strongest repeated founder narrative names Saud Al Qahtani and Canberk Donmez, with Gulf Wire adding
              that Al Qahtani previously co-founded HungerStation and therefore brought direct Saudi delivery operating
              context into Ninja's launch. Capital formation is clearer than governance: multiple 2025-2026 reports
              converge on a roughly $250 million-$254 million Riyad Capital-led round at about a $1.5 billion valuation,
              and one Tech in Asia summary also cites a January 2023 Bunat Ventures-led pre-seed round. The gap is
