callouts:
  - calloutType: insight
    title: Operational density appears to be the current moat
    body: >-
      The retained 2025-2026 sources keep describing logistics, infrastructure, speed, and city
      density, which makes the underwritten moat look operational first and technical second.
    claimRefs: [CE009, CE010]
  - calloutType: risk
    title: Public product-tech proof is thinner than the growth narrative
    body: >-
      This worker corpus supports product breadth and fulfilment posture, but not the reliability,
      trust, security, privacy, or compliance controls needed to underwrite a higher-confidence
      technology thesis.
    claimRefs: [CE011, CE012, CE013]
