      - ["Adjacency expansion layer", "Medical products and digital services are cited as expansion verticals", "Regulatory readiness and product design adaptation", "No public go-live timeline, compliance framework, or success metric is retained here"]
    notes: >-
      This table maps the operating architecture supported by retained public text, not a verified
      software-system blueprint; null architecture details remain open diligence asks.
    claimRefs: [CE004, CE005, CE008, CE009, CE010]
