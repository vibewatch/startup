  evidenceGaps:
    - type: missing-source
      severity: material
      topic: trust-and-controls
      missingEvidence: Public security, privacy, compliance, and trust-control documentation, including any status history, incident archive, SLA framing, or pharmacy-handling controls.
      whyItMatters: Without control evidence, investors cannot distinguish a strong convenience brand from a repeatable and governed delivery system.
      diligencePath: Request a trust center, privacy and security policies, status-page history, incident-postmortem archive, and any SOPs for medicine or regulated-category fulfilment.
      relatedQuestionRefs: [QE007]
      relatedTableRefs: [TE003]
    - type: private-evidence-only
      severity: material
      topic: technical-architecture
      missingEvidence: System architecture, dispatch and inventory tooling overview, integration surfaces, APIs, or engineering documentation that shows how fulfilment actually works.
      whyItMatters: The current public record supports an operating model, but it does not show whether the software and integration layer is proprietary, scalable, or easily replicated.
      diligencePath: Request architecture diagrams, product and engineering walkthroughs, integration documentation, and any internal reliability or latency dashboards.
      relatedQuestionRefs: [QE007]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: Public developer or practitioner signal such as repositories, package footprints, engineering talks, stack-specific recruiting evidence, or published integration docs.
      whyItMatters: Without a developer-signal proxy, this chapter cannot independently test whether Ninja has meaningful builder traction or a visible technical hiring footprint.
      diligencePath: Request public or private engineering materials, stack-specific recruiting packets, partner integration docs, or a documented rationale that the business is intentionally ops-led rather than developer-led.
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: minor
      topic: source-discovery-noise
      missingEvidence: Clearer product-specific third-party documentation that separates Ninja the Saudi platform from unrelated Ninja-branded businesses in generic web search.
      whyItMatters: Brand collision increases the risk of misattributed product, technology, or competitive claims during lightweight diligence.
      diligencePath: Use company-specific source packs, named customer or partner references, and first-party product documentation instead of broad brand-keyword discovery alone.
