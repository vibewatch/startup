callouts:
  - calloutType: insight
    title: Ninja is competing for rapid household replenishment, not all retail spend
    body: Quick-commerce speed, dark-store density, and category adjacency matter more here than a generic e-commerce TAM because the relevant substitute is the urgent local trip or slower same-day order.
    claimRefs: [CM001, CM002, CM004]
  - calloutType: risk
    title: Public market sizing still trails company ambition
    body: The assigned pool can show broad q-commerce growth and Ninja's own scale anchors, but it still cannot isolate a public Saudi or GCC SAM/SOM by category, city, or buyer cohort.
    claimRefs: [CM009, CM012, CM013]
