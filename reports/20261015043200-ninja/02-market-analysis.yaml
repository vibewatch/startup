  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sam-som-gap
      missingEvidence: Independent Saudi or GCC datasets that isolate quick-commerce spend by category, geography, and customer cohort instead of only publishing broad market forecasts.
      whyItMatters: Without a methodology-backed serviceable-market breakdown, this chapter can frame direction and scale but cannot defend a public SAM or SOM for Ninja.
      diligencePath: Obtain the underlying analyst methodology or management deck with city-by-city and category-by-category spend, order frequency, and penetration assumptions.
      relatedQuestionRefs: [QM003]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Audited 2025 and year-to-date 2026 disclosures separating GMV, net revenue, gross profit, and category-level profitability.
      whyItMatters: Public revenue commentary is being used as a market-scale anchor, but it does not show how much of Ninja's demand is durable, profitable, or concentrated in specific verticals.
      diligencePath: Request audited financial statements or board materials that reconcile revenue definitions, margin by category, and repeat-order economics.
      relatedQuestionRefs: [QM006]
    - type: enumeration-incomplete
      severity: minor
      topic: search-ambiguity
      missingEvidence: A filtered market-evidence pack that removes unrelated SharkNinja appliance results and other homonym noise before category sizing work.
      whyItMatters: Name collisions can accidentally pull adjacent consumer-appliance market data into a quick-commerce thesis and distort the chapter's market boundary.
      diligencePath: Run the next discovery pass with the company domain, quick-commerce qualifiers, and a verified competitor list to reduce ambiguous "Ninja" matches.
      relatedQuestionRefs: [QM008]
