slug: ninja
runDate: 2026-10-15
company:
  name: Ninja
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Ninja has scaled from a 2022 launch to a publicly reported $1.5 billion
    valuation and active Tadawul IPO preparation unusually quickly for a Saudi
    quick-commerce company. The public record supports strong momentum on
    funding, footprint, and revenue targets, but founder attribution,
    governance visibility, and audited financial quality remain incomplete.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Public 2026 coverage consistently describes Ninja as a Riyadh-based Saudi
      quick-commerce platform focused on groceries, medicines, household goods,
      and daily essentials, with regional expansion beyond Saudi Arabia into
      Bahrain, Qatar, and Kuwait. The operating thesis presented in the
      available coverage is speed plus local density rather than broad
      marketplace assortment: one feature profile says Ninja runs 100 dark
      stores across 28 cities and targets roughly 20-minute delivery windows.
      The bare word "Ninja" is not identity-safe for diligence: the assigned
      evidence pool included an unrelated SharkNinja article, while a
      Ninja-labeled Riyadh Tech Week result yielded only an unofficial-guide
      disclaimer rather than substantive company information. Identity claims
      therefore require explicit Saudi quick-commerce and domain qualifiers.
    claimRefs: [CO001, CO002, CO009, CO010, CO013, CO014, CO016]
    tableRefs: [TO001]
  - id: leadership-financing-and-control
    title: Leadership, financing, and control signals
    body: >-
      The strongest repeated founder narrative names Saud Al Qahtani and
      Canberk Donmez, with Gulf Wire adding that Al Qahtani previously
      co-founded HungerStation and therefore brought direct Saudi delivery
      operating context into Ninja's launch. Capital formation is clearer than
      governance: multiple 2025-2026 reports converge on a roughly $250
      million-$254 million Riyad Capital-led round at about a $1.5 billion
      valuation, and one Tech in Asia summary also cites a January 2023
      Bunat Ventures-led pre-seed round. The gap is control and board detail:
      TechStartups attributes the company's founding to Ebrahim Al-Jassim,
      while the rest of the public record does not reconcile whether that
      reflects legal founder status, controlling ownership, or a later
      strategic role, and none of the retained public sources disclose board
      composition or independent-governance structure.
    claimRefs: [CO003, CO004, CO005, CO006, CO007, CO012]
    tableRefs: [TO002, TO003]
  - id: milestones-and-current-trajectory
    title: Milestones and current trajectory
    body: >-
      The visible milestone path is compressed and still largely media-driven:
      public summaries place the company in 2022, a pre-seed round in January
      2023, unicorn status in July 2025, and active IPO exploration by March
      2026. The same 2026 reporting also claims approximately $1.0 billion of
      2025 revenue and a $1.6 billion 2026 target, but those scale numbers are
      not backed by audited statements in the retained record. A June 2026
      report that Ninja considered bidding for parts of Delivery Hero's Middle
      East assets points to strategic ambition, yet it also reinforces that
      public narrative is moving faster than public disclosure on economics,
      governance, and deal discipline.
    claimRefs: [CO006, CO008, CO011, CO012, CO015]
    figureRefs: [FO001]
