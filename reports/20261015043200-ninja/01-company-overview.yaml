figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Publicly visible milestones show a compressed path from 2022 launch to
      unicorn funding and IPO preparation, but major scale claims remain
      media-driven rather than audited.
    data:
      items:
        - date: "2022"
          label: Founded
          detail: >-
            Coverage consistently places Ninja's launch in 2022, although one
            later report conflicts on which founder should receive primary
            attribution.
          tone: neutral
          claimRefs: [CO002, CO003, CO005]
        - date: "2023-01"
          label: Pre-seed financing
          detail: >-
            Tech in Asia's cited summary says Bunat Ventures led a January 2023
            pre-seed round.
          tone: positive
          claimRefs: [CO007]
        - date: "2025-07-06"
          label: Unicorn round
          detail: >-
            Public funding coverage says Riyad Capital led a roughly
            $250 million-$254 million round that marked a $1.5 billion
            valuation.
          tone: positive
          claimRefs: [CO006]
        - date: "2025"
          label: Reported revenue scale
          detail: >-
            2026 articles say Ninja generated about $1.0 billion of revenue in
            2025, but no audited statement is in the retained pool.
          tone: opportunity
          claimRefs: [CO008]
        - date: "2026-03-24"
          label: IPO exploration publicized
          detail: >-
            Multiple March 2026 reports say Ninja was evaluating a Tadawul IPO
            and selecting banks.
          tone: opportunity
          claimRefs: [CO012]
        - date: "2026-03"
          label: London investor outreach
          detail: >-
            Gulf Wire says executives met investors at a London banking
            conference to test IPO appetite.
          tone: opportunity
          claimRefs: [CO012]
        - date: "2026-06-08"
          label: Delivery Hero asset interest reported
          detail: >-
            TechStartups reported that Ninja was considering a bid for parts of
            Delivery Hero's Middle East assets, including HungerStation-related
            options.
          tone: risk
          claimRefs: [CO015]
        - date: "2027 target"
          label: Tadawul target window
          detail: >-
            Funding and IPO coverage ties the current public listing ambition to
            a 2026-2027 window, with 2027 the clearest repeated target year.
          tone: opportunity
          claimRefs: [CO011, CO012]
    approximationNotes: >-
      Several milestones are year or month-level because the retained public
      evidence did not always provide an exact filing-style date.
    claimRefs: [CO006, CO007, CO008, CO011, CO012, CO015]
callouts:
  - calloutType: insight
    title: Scale narrative is public and investable, but not yet ledger-grade
    body: >-
      Funding, valuation, regional footprint, and IPO intent are all repeated
      publicly; revenue quality, board structure, and unit economics are not.
    claimRefs: [CO006, CO008, CO009, CO012]
  - calloutType: risk
    title: Founder and control narrative still needs primary-document cleanup
    body: >-
      One retained 2026 report attributes the company to Ebrahim Al-Jassim,
      while most other public coverage names Saud Al Qahtani and Canberk
      Donmez; control rights and board structure are still not visible.
    claimRefs: [CO003, CO005, CO012]
