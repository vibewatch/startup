evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: Board composition, independent-director status, management-bench depth, and any formal governance committees.
    whyItMatters: >-
      IPO readiness and control-risk assessment are weak without knowing who actually governs the company and how
      decisions are escalated.
    diligencePath: >-
      Request the current board list, committee structure, executive org chart, and any governance memorandum prepared
      for IPO banks.
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-quality
    missingEvidence: >-
      Audited 2025 and current-year financial statements separating GMV, net revenue, gross profit, EBITDA, and cash
      burn.
    whyItMatters: >-
      The public revenue and profitability narrative is central to valuation and IPO readiness, but current support is
      media coverage rather than audited financial reporting.
    diligencePath: Obtain audited FY2025 statements, latest management accounts, and unit-economics bridges by city and category.
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: cap-table-and-terms
    missingEvidence: Full cap table, liquidation preferences, any structured debt or credit, and any secondaries from the 2025 round.
    whyItMatters: >-
      Valuation alone does not show dilution, downside protection, or who can control a future IPO or strategic
      transaction.
    diligencePath: >-
      Request financing documents, shareholder register, term sheets, and any side letters tied to the Riyad Capital-led
      round.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: operating-scale-gaps
    missingEvidence: Public customer-count and headcount disclosures.
    whyItMatters: >-
      These are standard scale markers for benchmarking execution quality against peers and for checking
      revenue-per-employee and customer-density claims.
    diligencePath: Request current customer-count, order-frequency, and employee-base disclosures or internal KPI dashboards.
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sam-som-gap
    missingEvidence: >-
      Independent Saudi or GCC datasets that isolate quick-commerce spend by category, geography, and customer cohort
      instead of only publishing broad market forecasts.
    whyItMatters: >-
      Without a methodology-backed serviceable-market breakdown, this chapter can frame direction and scale but cannot
      defend a public SAM or SOM for Ninja.
    diligencePath: >-
      Obtain the underlying analyst methodology or management deck with city-by-city and category-by-category spend,
      order frequency, and penetration assumptions.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited 2025 and year-to-date 2026 disclosures separating GMV, net revenue, gross profit, and category-level
      profitability.
    whyItMatters: >-
      Public revenue commentary is being used as a market-scale anchor, but it does not show how much of Ninja's demand
      is durable, profitable, or concentrated in specific verticals.
    diligencePath: >-
      Request audited financial statements or board materials that reconcile revenue definitions, margin by category,
      and repeat-order economics.
    relatedQuestionRefs:
      - QM006
  - type: enumeration-incomplete
    severity: minor
    topic: search-ambiguity
    missingEvidence: >-
      A filtered market-evidence pack that removes unrelated SharkNinja appliance results and other homonym noise before
      category sizing work.
    whyItMatters: >-
      Name collisions can accidentally pull adjacent consumer-appliance market data into a quick-commerce thesis and
      distort the chapter's market boundary.
    diligencePath: >-
      Run the next discovery pass with the company domain, quick-commerce qualifiers, and a verified competitor list to
      reduce ambiguous "Ninja" matches.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Public or investor-shareable pricing schedules, merchant commission structures, delivery-fee ladders, and
      subscription packages for Ninja, HungerStation, Talabat, and Jahez in Saudi and GCC markets.
    whyItMatters: >-
      Without price and packaging evidence, the chapter cannot underwrite whether switching is driven by economics,
      bundling, or operational convenience.
    diligencePath: >-
      Collect current app screenshots by market, merchant onboarding terms, subscription pages, and any procurement or
      investor materials that disclose monetization mechanics.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-cost-metrics
    missingEvidence: >-
      City-level retention, order frequency, customer acquisition economics, and merchant multi-homing data for Ninja
      and direct incumbents.
    whyItMatters: >-
      Operational-density claims are more credible when tied to repeat usage and merchant lock-in rather than expansion
      headlines alone.
    diligencePath: >-
      Request cohort retention, repeat-rate, and merchant concentration cuts by city and category; cross-check with any
      disclosed SLA, cancellation, or promo-spend data.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: minor
    topic: status-quo-and-internal-build
    missingEvidence: >-
      Independent evidence on how often Saudi grocers, pharmacies, and restaurants still route the same jobs through
      self-fulfillment or offline channels.
    whyItMatters: The substitute set is strategically important, but the assigned pool describes it only indirectly.
    diligencePath: >-
      Add merchant case studies, procurement disclosures, or trade reporting focused on self-delivery economics and
      channel mix in Saudi quick commerce.
    relatedQuestionRefs:
      - QP001
      - QP004
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
