companyProfile:
  summary: >-
    Ninja is a Saudi quick-commerce and on-demand retail platform founded in 2022 in Riyadh and now described in public
    coverage as operating across Saudi Arabia and the wider GCC. It sells groceries, household essentials, medicines,
    and adjacent daily-needs categories through hyperlocal fulfillment, and public reporting increasingly frames it as a
    pre-IPO scale story rather than a niche grocery app.
