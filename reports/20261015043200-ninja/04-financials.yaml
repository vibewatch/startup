      - ["Pharmacy / medical products", "Rapid delivery expansion vertical", "Per regulated order", "Expansion vertical cited in 2026 reporting", "Potentially valuable adjacency, but current revenue share and compliance economics are not public", "Revenue share, licensing basis, and unit economics for medical orders"]
      - ["Digital services / new verticals", "Adjacency funded from pre-IPO round", "Service or transaction revenue", "Planned / expanding rather than quantified", "Could diversify revenue, but there is no public contribution disclosure", "SKU-level roadmap, monetization design, and recognition policy"]
