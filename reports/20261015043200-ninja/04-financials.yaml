schemaVersion: "report-v2"
artifact: "financials"
slug: "ninja"
runDate: "2026-10-15"
company:
  name: "Ninja"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    Public reporting consistently supports that Ninja raised roughly $250 million in 2025 at
    about a $1.5 billion valuation and is now framing that capital as pre-IPO fuel for expansion,
    with some 2026 media reports also citing about $1 billion of 2025 revenue and a $1.6 billion
    2026 target. What remains missing for underwriting is the quality of that top line: the
    retained evidence does not publish audited GMV-to-net-revenue, gross profit, EBITDA, or
    cohort-level unit economics.
sections:
  - id: "revenue-model-and-traction"
    title: "Revenue model and public traction"
    body: >-
      The retained evidence points to a quick-commerce transaction model rather than a recurring
      software model: Ninja sells or facilitates rapid delivery of groceries, household goods,
      medicines, and other daily essentials across Saudi Arabia and nearby Gulf markets, with
      reported fulfillment times under 30 minutes and operations built around dark stores or
      micro-fulfillment nodes. Public coverage is directionally consistent that Ninja reached
      large scale quickly, with multiple 2026 outlets citing roughly $1 billion of 2025 revenue
      and a $1.6 billion 2026 target, but those figures are media-reported and not accompanied by
      audited statements, revenue-recognition policy, or category mix. That makes the scale signal
      meaningful for diligence, while keeping revenue quality, repeatability, and net-take-rate
      questions open.
    claimRefs: ["CI001", "CI002", "CI004", "CI005", "CI008"]
    tableRefs: ["TI001", "TI002"]
    figureRefs: ["FI001"]
  - id: "unit-economics-and-cost-drivers"
    title: "Unit economics and cost drivers"
    body: >-
      The strongest public positive is not disclosed margin math but the narrative that Riyad
      Capital backed Ninja because of "strong unit economics" and a scalable model. Independent
      commentary adds the more important caveat: public-market scrutiny will turn on whether the
      company can keep growth without relying on promotions and whether operational density can
      offset picking, warehousing, and rider costs. In other words, the mechanism looks plausible
      for a fast-delivery operator, but the underwriting inputs that matter most -- CAC, payback,
      contribution margin, retention, basket economics, and city-by-city profitability -- remain
      undisclosed in the retained public evidence. That keeps margin path analysis directional
      rather than investment-grade.
    claimRefs: ["CI009", "CI010", "CI011", "CI013", "CI015"]
    tableRefs: ["TI003"]
  - id: "capital-adequacy-and-underwriting-blockers"
    title: "Capital adequacy and underwriting blockers"
    body: >-
      Capital access is the clearest verified strength. Multiple sources align that Ninja raised
      about $250 million in 2025 at around a $1.5 billion valuation, and several describe that
      round as deliberate pre-IPO balance-sheet preparation to fund expansion into new verticals,
      technology, logistics, and regional growth. That framing supports the idea that the company
      is financing scale-up and potential listing preparation rather than covering an openly
      disclosed liquidity crisis. Still, the same evidence set also shows why underwriting remains
      blocked: no public cash balance, burn, debt schedule, working-capital profile, or audited
      margin bridge is disclosed, and even open-web discovery is noisier than usual because bare
      "Ninja" searches still surface unrelated SharkNinja appliance coverage. The result is a
      credible capital-raising story without enough disclosure to judge runway, dilution risk, or
      post-IPO earnings quality.
    claimRefs: ["CI003", "CI006", "CI007", "CI012", "CI014"]
