      - "Discounts / unknowns"
      - "Source-backed implication"
    rows:
      - ["Delivery / service fee", "No public fee schedule appears in the retained evidence", "Realized customer charge is unknown", "Delivery-fee economics cannot be underwritten from the public source set alone"]
      - ["Merchandise markup / net-take-rate", "No public markup or commission structure disclosed", "Mix between gross merchandise value and recognized revenue is unknown", "Revenue quality depends on recognition policy that is not publicly shown here"]
      - ["Promotions / incentives", "No disclosed promotion cadence or budget", "Promotional intensity is unknown", "A 2026 adverse market note explicitly warns the model weakens if promotions substitute for operating leverage"]
      - ["Merchant / partner economics", "No public contracts or partner fee examples retained", "Settlement terms and rebates are unknown", "Prepared-food or partner-assisted revenue may exist, but public evidence does not quantify realized economics"]
    notes: "Undisclosed means not visible in the retained public evidence, not that the company charges nothing; direct contract examples or internal pricing exports are still needed."
    claimRefs: ["CI005", "CI008", "CI010", "CI013", "CI014"]
  - id: "TI003"
    title: "Unit economics and capital adequacy table"
    columns:
      - "Metric"
      - "Value / public status"
      - "Confidence"
      - "Why it matters"
      - "Diligence ask"
    rows:
      - ["2025 revenue", "Approximately $1 billion in 2026 media reporting", "Medium", "Signals unusual scale for a 2022-founded regional quick-commerce operator", "Audited 2025 financial statements and revenue bridge by market / category"]
      - ["2026 revenue target", "Approximately $1.6 billion target in 2026 media reporting", "Medium", "Sets growth expectations and IPO narrative", "Monthly run-rate bridge and assumptions behind the target"]
      - ["2025 funding round", "About $250 million at roughly $1.5 billion valuation", "Medium", "Primary public evidence of external capital support and dilution benchmark", "Full cap table, preferences, and closing-date cash balance"]
      - ["Delivery-capacity expansion", "Company aims to triple delivery capacity by 2026", "Medium", "Implies continued fulfillment and technology investment needs", "Micro-fulfillment count, rider productivity, and associated ramp spend"]
      - ["CAC / payback / contribution margin / retention", null, "Low", "Core proof of durable unit economics and margin path is absent", "City-, cohort-, and category-level unit economics pack plus retention cohorts"]
    notes: "Public values are media-reported rather than audited; null marks a missing underwriting input that must come from management materials or data room evidence."
    claimRefs: ["CI003", "CI004", "CI007", "CI009", "CI010", "CI011", "CI012", "CI013"]
figures:
  - id: "FI001"
    title: "Revenue model bridge"
    type: "flow"
    summary: >-
      Public evidence supports a density-driven quick-commerce bridge from basket demand to gross
      profit, but it does not disclose the exact mix between GMV, net revenue, fees, and
      fulfillment cost.
    data:
      nodes:
        - label: "Customer basket demand"
          description: "Groceries, household goods, medicines, and daily essentials are the recurring demand inputs."
        - label: "Dark-store / micro-fulfillment inventory"
          description: "Hyperlocal inventory and picking capacity enable rapid order preparation."
        - label: "20-30 minute last-mile delivery"
          description: "Fast fulfillment is the core customer promise and the main operating-cost driver."
        - label: "Recognized revenue"
          description: "Public sources imply merchandise and service revenue, but do not disclose the GMV-to-net-revenue split."
        - label: "Fulfillment and promotion costs"
          description: "Picking, warehousing, rider expense, and promotions determine whether scale becomes profitable."
        - label: "Gross-profit path"
          description: "Density and repeat demand must offset cost-to-serve before headline growth becomes durable margin."
      edges:
        - from: "Customer basket demand"
          to: "Dark-store / micro-fulfillment inventory"
        - from: "Dark-store / micro-fulfillment inventory"
          to: "20-30 minute last-mile delivery"
        - from: "20-30 minute last-mile delivery"
          to: "Recognized revenue"
        - from: "Recognized revenue"
          to: "Fulfillment and promotion costs"
        - from: "Fulfillment and promotion costs"
          to: "Gross-profit path"
    approximationNotes: "This is a qualitative operating bridge derived from public descriptions; it is not a declared accounting waterfall."
    claimRefs: ["CI002", "CI008", "CI009", "CI010", "CI015"]
