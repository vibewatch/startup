  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Public or investor-shareable pricing schedules, merchant commission structures, delivery-fee ladders, and subscription packages for Ninja, HungerStation, Talabat, and Jahez in Saudi and GCC markets.
    whyItMatters: Without price and packaging evidence, the chapter cannot underwrite whether switching is driven by economics, bundling, or operational convenience.
    diligencePath: Collect current app screenshots by market, merchant onboarding terms, subscription pages, and any procurement or investor materials that disclose monetization mechanics.
    relatedQuestionRefs:
    - QP008
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-cost-metrics
    missingEvidence: City-level retention, order frequency, customer acquisition economics, and merchant multi-homing data for Ninja and direct incumbents.
    whyItMatters: Operational-density claims are more credible when tied to repeat usage and merchant lock-in rather than expansion headlines alone.
    diligencePath: Request cohort retention, repeat-rate, and merchant concentration cuts by city and category; cross-check with any disclosed SLA, cancellation, or promo-spend data.
    relatedQuestionRefs:
    - QP005
    relatedTableRefs:
    - TP004
