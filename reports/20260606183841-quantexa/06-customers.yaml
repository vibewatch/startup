tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public scale / proof
  - Strategic value
  - Gap
  rows:
  - - Global tier-1 banks
    - Buyer=CIO/CDO/head of financial crime; users=investigators, analysts, relationship teams; payer=bank
    - AML, KYC, fraud, customer 360, enterprise data foundation
    - Over 25% of world’s 50 largest banks deployed by FY24; HSBC, ABN AMRO, Standard Chartered, Danske, Novobanco are named
    - Large ACV, multi-year deployments, multi-use-case expansion potential
    - No public count of total tier-1-bank customers or ARR share
  - - Regional / mid-size banks
    - Buyer=head of AML / operations; users=AML teams; payer=bank
    - Cloud AML for detection, investigation, and case management
    - Cloud AML page targets U.S. mid-size and community banks; Azure-marketplace distribution highlighted
    - Down-market expansion widens TAM and reduces dependence on global banks only
    - No named mid-size bank customer references in retained sources
  - - Insurance carriers
    - Buyer=data, risk, or fraud leaders; users=claims, fraud, and analytics teams; payer=insurer
    - Risk, fraud, entity resolution, customer insight
    - FY24 and 2025 disclosures explicitly name insurance as a live revenue vertical
    - Shows Quantexa is not confined to classic bank AML budgets
    - No named insurer case study in retained sources
  - - Telecom / media / technology enterprises
    - Buyer=chief data / transformation leads; users=sales, support, data teams; payer=enterprise
    - Customer 360, prospecting, data modernization, AI-ready data estate
    - Vodafone case plus FY24 vertical disclosures support live adoption
    - Creates non-financial-services expansion path with customer-intelligence value
    - No disclosed customer count within TMTE
  - - Public-sector agencies
    - Buyer=program or data leaders; users=fraud, tax, service, and intelligence teams; payer=government agency
    - Counter-fraud, citizen/business entity views, data-led operational decisioning
    - Quantexa repeatedly describes government-agency customers and public-sector revenue contribution
    - Can add large strategic programs and diversify buyer base
    - Named public-sector deployments are not comprehensively enumerated here
  - - Customer-intelligence / growth programs
    - Buyer=commercial, data, or CX leadership; users=sales, marketing, service, analytics; payer=enterprise
    - Prospecting, cross-sell, upsell, retention, single customer view
    - Customer-intelligence page and Vodafone/HSBC proof show this budget exists beyond AML
    - Supports land-and-expand beyond compliance into growth budgets
    - Named revenue contribution by use case is undisclosed
  - - Partner-influenced channel programs
    - Buyer=enterprise or agency, but sourcing often influenced by partners; payer=end customer
    - Marketplace, SI-led, cloud-led, or alliance-led deployments
    - More than half of customer wins involved partners; Microsoft and Accenture are explicit routes to market
    - Accelerates access to accounts and broadens distribution capacity
    - Creates channel dependence and obscures direct vs partner-led economics
  notes: Mixes vertical, size, and channel segmentation because Quantexa discloses customers by all three lenses but not by a single clean customer-count taxonomy.
