- id: named-public-customer-proof
  title: Named public customer proof
  body: 'The named proof set is strongest when Quantexa or the customer speaks in detail about a live workflow and measurable outcome. HSBC is the clearest example: its public materials name executives, scale, savings, and case-volume improvement. ABN AMRO, Standard Chartered, Vodafone, Novobanco, and Danske Bank also provide stronger-than-average proof because the public materials describe the deployment path, the workflow, and at least one practical operational benefit. The proof quality drops when the source becomes a customer list rather than a case study. Prudential appears only as a TechCrunch customer-list mention in the retained evidence, and Accenture is better evidenced as an alliance and go-to-market partner than as a clearly described production user. That distinction is important. Quantexa has enough public proof to establish real enterprise adoption, especially in banking and data modernization, but not enough public proof to treat every named logo as equally durable or equally
    revenue-relevant.'
