figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: standard
  summary: Quantexa typically lands in a high-friction workflow such as AML or data quality, proves value in production, then expands into broader decisioning, customer intelligence, and AI modules.
  data:
    items:
    - id: land
      label: Land on a painful workflow
      actor: CIO / CDO / head of financial crime
      description: The initial entry point is usually a high-value problem such as AML, KYC, fraud, or fragmented customer data.
      channels:
      - Direct enterprise sales
      - Partner-led discovery
      - Board-level transformation mandate
    - id: integrate
      label: Integrate data foundation
      actor: Data and analytics teams
      description: Quantexa connects internal and external data, resolves entities, and builds contextual graphs inside the customer’s environment.
      channels:
      - Implementation program
      - Cloud / hybrid deployment
      - Existing infrastructure integration
    - id: prove
      label: Prove production value
      actor: Investigators, analysts, sales, service teams
      description: Reference accounts report lower case volumes, better customer views, faster investigation work, or more efficient commercial workflows.
      channels:
      - Case-management workflow
      - Customer 360 UI
      - Operational dashboards
    - id: expand
      label: Expand across use cases
      actor: Enterprise sponsors and adjacent functions
      description: Accounts can broaden from financial crime into customer intelligence, AI-ready data estates, and cross-functional decisioning programs.
      channels:
      - Customer Intelligence
      - Microsoft Fabric / Unify
      - Data modernization
    - id: upsell
      label: Upsell modules and channels
      actor: Installed base plus partner ecosystem
      description: Growth can continue through Q Assist, Cloud AML, partner-led wins, and broader regional or functional rollout inside existing accounts.
      channels:
      - Q Assist
      - Cloud AML
      - Azure Marketplace
      - Alliance partners
