- calloutType: strength
  title: Named production proof is real, especially in tier-1 banks and enterprise data modernization
  body: 'Quantexa has stronger-than-average public customer proof for a private infrastructure company. HSBC, ABN AMRO, Standard Chartered, Vodafone, Novobanco, and Danske Bank are not just logo mentions: the retained evidence describes live workflows, named executives, and, in several cases, measurable outcomes. That is enough to conclude adoption is real rather than aspirational.'
  claimRefs:
