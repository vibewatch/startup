  evidenceGaps:
  - type: missing-source
    severity: material
    topic: customer-count-gap
    missingEvidence: Current total customer count, active production-account count, and customer mix by vertical and geography.
    whyItMatters: Without a denominator, the strong growth and bank-penetration claims cannot be translated into concentration or saturation risk.
    diligencePath: Request an account bridge showing total customers, active customers, and ARR by vertical, region, and account size.
    relatedQuestionRefs:
    - QU019
    relatedTableRefs:
    - TU002
    - TU005
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: GRR, gross logo retention, churn, cohort retention, renewal cadence, and contract terms.
    whyItMatters: Public NRR is constructive, but underwriting durability still requires the gross-retention and cohort view underneath it.
    diligencePath: Request cohort retention tables, renewal history for top accounts, and gross-retention metrics by vertical and product suite.
    relatedQuestionRefs:
    - QU020
    - QU027
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: blocking
    topic: concentration-gap
    missingEvidence: Top-customer revenue share, top-10 account share, median contract length, and ARR exposure by buyer type.
    whyItMatters: A small number of large banks or agencies could dominate ARR, but public materials do not allow investors to size that risk.
    diligencePath: Request top-10 customer concentration, contract expiries, renewal cliff analysis, and direct-vs-partner booking mix.
    relatedQuestionRefs:
    - QU021
    - QU027
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: material
    topic: proof-quality-gap
    missingEvidence: Named public deployment detail for lower-quality logos such as Prudential and a clearer distinction between partner proof and end-customer proof for Accenture.
    whyItMatters: Logo-level mentions can inflate perceived adoption breadth if they are not separated from production case studies with named workflows and outcomes.
    diligencePath: Request a referenceable customer list split into production, pilot, partner-led, and quote-only references, with freshness dates and approved spokespeople.
    relatedQuestionRefs:
    - QU027
    relatedTableRefs:
    - TU003
