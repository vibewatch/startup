- id: adoption-trajectory-and-scale-proxies
  title: Adoption trajectory and scale proxies
  body: Quantexa discloses more adoption trajectory than most private infrastructure companies, but the dataset is still skewed toward milestones rather than a clean customer waterfall. The strongest scale markers are that over 25% of the world’s 50 largest banks had deployed the platform by FY24, Quantexa completed FY24 with 40% Decision Intelligence ARR growth and 16,000 active platform users, and it later crossed the $100 million ARR threshold. The company also said it gained 30 top-tier global clients since the start of its 2024 fiscal year and added 23 new customers during calendar 2024. Those are real signals of adoption, and they matter because they go beyond a static logo wall. Still, the company does not publicly disclose the total customer count, the number of active production accounts, or the split between large incumbent-bank deployments and smaller newer buyers. Investors should therefore treat the adoption curve as clearly positive but still missing its denominator.
  claimRefs:
  - CU007
  - CU008
  - CU010
  - CU011
