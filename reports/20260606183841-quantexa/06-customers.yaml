  - CU019
  - CU021
  - CU023
  - CU024
  - CU026
  - CU028
- calloutType: risk
  title: Durability looks promising, but concentration and customer-count disclosure are still missing
  body: The customer base appears sticky from the outside because NRR is 120%+, more than half of new DI ARR comes from existing customers, and blended ACV grew in FY24. But Quantexa still does not publicly disclose total customer count, GRR, churn, contract length, or top-customer revenue share. That leaves a meaningful underwriting gap on concentration and renewal quality.
  claimRefs:
  - CU009
  - CU013
  - CU035
  - CU045
  - CU046
  - CU049
