- id: retention-repeat-usage-and-durability
  title: Retention, repeat usage, and durability
  body: 'Durability is where Quantexa looks unusually good for a private company, but still not fully underwriteable. The headline signal is the disclosed 120%+ FY24 net revenue retention, which is a strong enterprise-software outcome in its own right. That signal is reinforced by two adjacent facts: more than half of new Decision Intelligence ARR came from existing customers, and blended average contract value increased 15% in FY24. Those points together imply real account expansion rather than a business driven only by new-logo acquisition. Public product evidence also fits the expansion story: customer-intelligence, Fabric, Q Assist, and Cloud AML all widen the attach surface. The limitation is that Quantexa still does not disclose GRR, churn, renewal cadence, contract term, or cohort curves. Public durability therefore rests on a strong NRR lens plus selective module-adoption evidence, not on a full renewal dataset. That is good enough to support a constructive read, but not good enough
    to eliminate diligence risk.'
  claimRefs:
