- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / durability risk
  - Impact
  - Diligence path
  rows:
  - - Financial-crime to customer-intelligence cross-sell
    - Customer count by use case is undisclosed
    - Supports larger ACV and broader stickiness if proven
    - Request account-level module maps for top 50 customers
  - - AI module upsell via Q Assist
    - Early-adopter evidence is selective rather than broad
    - Could deepen wallets inside existing accounts if paid conversion is real
    - Request paid pilots, conversion rates, and attach by installed account
  - - Partner and marketplace distribution
    - More than half of wins involve partners
    - Improves reach but raises channel dependence and potential margin sharing
    - Request direct-vs-partner bookings mix and win rates
  - - Down-market Cloud AML
    - No named mid-size bank references are public yet
    - Can widen TAM and smooth concentration if traction appears
    - Request logo list, pilots, and first production customers for Cloud AML
  - - Enterprise data-modernization programs
    - Deployments may be complex and resource intensive
    - Large budgets are attractive but procurement cycles can be long
    - Request median deployment time, services intensity, and implementation burden
  - - Opaque pricing and implementation complexity
    - Low-transparency commercial model can slow procurement
    - Can raise CAC, elongate sales cycles, and cap self-serve expansion
    - Request discounting policy, proof-of-value conversion, and services-to-software mix
  - - Top-account concentration
    - Public top-customer revenue share and contract length are not disclosed
    - A few large banks or agencies could dominate ARR without investors knowing
    - Request top-10 customer share, segment concentration, and renewal cliff exposure
  notes: Expansion logic is credible, but concentration remains a real diligence issue because public disclosure stops before account-level economics and renewal concentration.
