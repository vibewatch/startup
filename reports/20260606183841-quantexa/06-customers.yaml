company:
  name: Quantexa
chapter:
  number: 6
  title: Customers
  summary: Quantexa has credible named production adoption in tier-1 banking and enterprise data modernization, with HSBC, ABN AMRO, Standard Chartered, Vodafone, Novobanco, and Danske Bank providing the strongest public proof. Durability signals are unusually good for a private infrastructure company—120%+ FY24 NRR, more than half of new DI ARR from existing customers, and 23 new customers added in 2024—but exact total customer count, GRR/churn, contract length, and concentration remain undisclosed.
sections:
- id: customer-segmentation-and-buyer-map
  title: Customer segmentation and buyer map
  body: 'Quantexa sells into organizations that treat data quality, entity resolution, and network context as operational infrastructure rather than an isolated analytics project. In practice that means the economic buyer is often a chief data officer, chief information officer, head of financial crime, or transformation leader; the day-to-day users are investigators, compliance analysts, data teams, relationship teams, and frontline operational staff; and the payer is the enterprise or public-sector institution rolling out the program. The customer mix is broader than a pure AML niche. FY24 disclosures explicitly named banking, insurance, telecommunications, media, technology, and the public sector, while product pages show a second segmentation axis by organization size: global tier-1 institutions at the high end and newer cloud AML offers for U.S. mid-size and community banks at the lower end. The segmentation story is therefore well evidenced by vertical, use case, and buyer type. What
    remains opaque is the segment-level revenue mix and the total number of paying accounts inside each bucket.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
