- id: TU003
  title: Named customer proof table
  columns:
  - Customer
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome / public signal
  - Limitation
  rows:
  - - HSBC
    - Global tier-1 bank
    - GSNA / financial crime, single customer view, supply-chain resilience
    - Production
    - ≈39M customers in 62 countries, c£4m potential savings, 60% case-volume reduction, transformational false-positive improvement
    - All proof comes from Quantexa-hosted materials rather than HSBC filings
  - - ABN AMRO
    - Global / European bank
    - KYC onboarding and investigation modernization
    - Pilot to production
    - 2019 PoC moved into production by June 2021; investigators spend less time gathering data and focus more on real crime
    - No contract size, renewal history, or quantified ROI disclosed
  - - Standard Chartered
    - Global bank
    - Financial-crime investigations and contextual client view
    - Production
    - Bank says Quantexa improves contextual information and yields better suspicious-activity cases across 60 markets
    - Outcome is credible but mostly qualitative
  - - Vodafone
    - Telecom enterprise
    - Customer360, Prospect360, MDM, Explorer
    - Production multi-phase
    - Phase 1 delivered in nine months; users access customer view in two clicks; sales and support work more efficiently
    - No contract value, module attach rate, or renewal evidence
  - - Novobanco
    - European bank
    - Financial-crime data layer plus Microsoft Fabric data estate
    - Production expansion
    - Uses Quantexa for compliance foundation and says around 50 AI models now run on the unified estate
    - Vendor-authored and no commercial metrics disclosed
  - - Danske Bank
    - European bank
    - Markets-business transaction monitoring and financial-crime investigations
    - Pilot to production
    - Successful 2018 pilot moved into integrated production monitoring and investigations
    - No quantitative ROI or duration of rollout disclosed
  - - BNY Mellon
    - Global financial institution
    - Enterprise data trust, AML/KYC/fraud innovation
    - Production likely
    - Quoted as using Quantexa for enterprise-ready data-at-scale and improved digital resiliency
    - Featured-customer quote lacks deployment timeline and hard outcome numbers
  - - ING
    - Global bank
    - KYC / AML model and process improvement
    - Production likely
    - Quoted as using contextual insights to strengthen detection models and automate key processes
    - No date, scope, or quantified output disclosed
  - - Prudential
    - Insurer
    - Unnamed enterprise customer relationship
    - Production unclear
    - TechCrunch listed Prudential in Quantexa’s customer roster
    - No public case study, executive quote, deployment detail, or freshness beyond the news mention
  - - Accenture
    - Services / SI / partner boundary
    - Alliance around AML, credit risk, and customer insight
    - Production unclear / partner-led
    - Featured-customer quote and Accenture newsroom release validate commercial relevance and client delivery intent
    - Better read as partner proof than as a fully described end-customer deployment
  notes: 'Enumeration is partial and intentionally tiered by proof quality: detailed production cases first, then quote-level references, then lower-quality logo-list mentions.'
  enumerationScope:
    coverage: partial
    basis: Rows cover the named public customer and partner-adjacent references retained in reviewed sources; Quantexa does not publish a complete customer list or equal-detail case study for every named logo.
