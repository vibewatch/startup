- id: architecture-and-deployment
  title: Architecture, operating model, and integration surfaces
  body: 'The operating model is concrete enough to describe beyond marketing. Quantexa''s public platform pages describe schema-agnostic ingestion and enrichment, parsing and normalization, a hierarchical model, dynamic entity resolution, graph generation and analytics, and then workflow outputs that range from analyst workbenches to AI-assisted recommendations and automated actions. The core engineering story is that data gets ingested once, reused across multiple use cases, and processed either in batch or dynamically without duplicating records for every workflow. Entity Resolution is the anchor because it creates the trusted objects that graph analytics, risk models, and AI assistants then act on. The company also advertises open deployment and integration surfaces: on-premises, preferred cloud, supported APIs and libraries, and interoperability with data lakes and warehouses. The Microsoft Fabric and Unify materials make the architecture more specific by showing Quantexa as a matching
    and unification layer sitting above OneLake, Power BI, Copilot Studio, and Azure OpenAI. Novobanco''s case study is especially useful because it shows how this architecture can move from financial-crime data layers into broader AI and customer workflows. The dependency tradeoff is that the product becomes more valuable as it plugs into existing ecosystems, but also more exposed to data quality, cloud-platform, LLM, and customer-governance dependencies that are only partly visible in public materials.'
