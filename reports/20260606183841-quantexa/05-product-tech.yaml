- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow pain
  - Quantexa solution
  - Measurable / public benefit
  - Limitation
  rows:
  - - AML investigator
    - Siloed customer, transaction, and watchlist data create false positives and slow casework
    - Contextual monitoring, entity resolution, graph investigation, and case workflows
    - Cloud AML page claims up to 75% fewer false positives, 50%+ less effort, and 90% of work staying in-platform
    - Methodology and customer denominator are not disclosed publicly
  - - Financial-crime program lead
    - Legacy rules and fragmented views miss network-level risk
    - Cloud AML plus financial-crime workflows with customer risk rating, SAR/CTR, and 314(b) sharing
    - Cloud AML claims up to 40% of risks it flags were missed by legacy systems
    - This remains a company proof point rather than an independent benchmark
  - - Customer-intelligence team
    - CRM, product, and household data are fragmented across systems
    - Customer Intelligence solution plus Entity Resolution and graph context
    - Novobanco and IDC materials show AI-driven customer insights and 50+ deployed AI models on a unified data estate
    - Case-study evidence is curated and not a broad sample
  - - Fraud or security team
    - Hidden entity links and repeated false positives slow prevention and investigation
    - Fraud solution built on entity resolution and graph technology
    - Product pages position more targeted detection and faster investigations
    - Public corpus lacks open comparative testing versus peers
  - - Credit / risk analyst
    - Single-entity borrower views miss indirect exposure and supply-chain relationships
    - Holistic counterparty and portfolio risk views with connected borrower context
    - Risk page claims earlier warnings and broader borrower understanding
    - No public model-card or back-test detail is retained
  - - Data-modernization team
    - Enterprise ontology or Fabric semantic layers are undermined by dirty, unmatched source data
    - Unify for Microsoft Fabric to match, unify, and contextualize data before AI workloads
    - Demo material shows Enterprise 360 in Microsoft Fabric and Novobanco shows OneLake + Power BI + Azure OpenAI workflows
    - The 36-minute benchmark is demo-led and not independently audited
  notes: Benefit cells preserve public claims and case-study outcomes, while limitations note where methodology remains opaque.
