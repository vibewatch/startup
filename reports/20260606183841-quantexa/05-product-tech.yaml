- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Key dependency
  - Main risk
  rows:
  - - Ingestion and enrichment
    - Bring structured, semi-structured, and unstructured internal or external data into the platform with cleansing, parsing, and normalization
    - Data availability, source-system quality, and mapping effort
    - Time-to-value can slow if enterprise source data is poor or governance is weak
  - - Hierarchical model and Entity Resolution
    - Convert raw records into trusted entities and 360-degree views in batch or dynamic mode
    - Model tuning, country-specific training, and third-party reference data
    - Public proof points are strong, but benchmark methodology is not fully exposed
  - - Graph generation and analytics
    - Represent resolved entities as relationship graphs for visualization, scoring, Graph ML, and RAG
    - Entity quality upstream and graph compute infrastructure
    - Weak upstream matching or high graph-compute cost would degrade downstream value
  - - AI and decisioning layer
    - Provide recommendations, next best actions, copilots, and agentic workflows on top of contextual data
    - LLM choice, governance design, and customer workflow integration
    - Newest AI modules have less public production evidence than the core data foundation
  - - Integration and deployment layer
    - Connect to data lakes, warehouses, APIs, Microsoft Fabric, Power BI, Copilot Studio, and customer systems
    - Customer cloud stack, open APIs, and partner ecosystem
    - Platform value increases with integration breadth but so does ecosystem dependency
  - - Packaged solution layer
    - Wrap the core stack into workflow-specific offers such as Cloud AML and Unify for Microsoft Fabric
    - Vertical content, regulatory fit, and partner distribution
    - Commercial packaging appears ahead of fully transparent pricing and SLA disclosure
  notes: This table maps the operating stack from data onboarding to packaged workflows using retained public technical descriptions only.
