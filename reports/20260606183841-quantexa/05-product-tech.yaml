  evidenceGaps:
  - type: missing-source
    severity: material
    topic: reliability-gap
    missingEvidence: A public status page, historical uptime metrics, service-level commitments, or named ISO 27001 / SOC 2 credentials for the platform and newer AI modules.
    whyItMatters: Without external assurance or service-history evidence, technical diligence cannot independently judge production reliability or security maturity.
    diligencePath: Request the security package, uptime history, incident summaries, and customer contractual SLA language directly from Quantexa.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: benchmark-methodology
    missingEvidence: Independent methodology or reproducible benchmark detail behind the 99% accuracy, 90%+ improvement, 60x speed, and 228% ROI claims.
    whyItMatters: Headline metrics shape product quality perception and commercial ROI, but without methodology they cannot be underwritten as hard technical proof.
    diligencePath: Ask for benchmark design, baseline definitions, customer cohort size, and any third-party validation decks used in sales or board reporting.
    relatedQuestionRefs:
    - QE027
    relatedTableRefs:
    - TE004
  - type: access-blocked
    severity: material
    topic: public-developer-docs
    missingEvidence: Open API references, public documentation depth, public sample code, and broader external developer activity outside Quantexa's gated community.
    whyItMatters: Integration-heavy platforms are easier to diligence when external developers can inspect docs, repos, release notes, and examples without a commercial relationship.
    diligencePath: Request partner or developer documentation, API specs, SDK examples, and evidence of external developer adoption during technical diligence.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: new-ai-module-adoption
    missingEvidence: Production customer counts, attach rates, and implementation burden for Q Assist, Agent Gateway, and Unify for Microsoft Fabric.
    whyItMatters: These newer layers shape the future expansion story, but public evidence does not yet show how widely or deeply they are deployed.
    diligencePath: Ask for live reference customers, module-level ARR or attach-rate disclosures, and implementation timelines for recent AI and Fabric products.
    relatedQuestionRefs:
    - QE016
    - QE017
    - QE026
    relatedTableRefs:
    - TE001
    - TE005
