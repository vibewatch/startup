      mix.
    relatedQuestionRefs:
      - QU021
      - QU027
    relatedTableRefs:
      - TU005
  - type: enumeration-incomplete
    severity: material
    topic: proof-quality-gap
    missingEvidence: >-
      Named public deployment detail for lower-quality logos such as Prudential and a clearer distinction between
