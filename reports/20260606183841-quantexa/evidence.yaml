    whyItMatters: >-
      Logo-level mentions can inflate perceived adoption breadth if they are not separated from production case studies
      with named workflows and outcomes.
    diligencePath: >-
      Request a referenceable customer list split into production, pilot, partner-led, and quote-only references, with
