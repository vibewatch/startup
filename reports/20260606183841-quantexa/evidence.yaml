evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership-and-founder-table coverage gap
    missingEvidence: Current full board roster, ownership percentages, and committee structure.
    whyItMatters: Governance influence and investor control cannot be underwritten from public press releases alone.
    diligencePath: Request current board deck, cap table, and shareholder rights summary from management.
    relatedQuestionRefs:
      - QO008
      - QO025
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: stakeholder-or-investor-map coverage gap
    missingEvidence: >-
      Debt facilities, secondaries, liquidation preferences, exact ownership percentages, and secondary volume in later
      rounds.
    whyItMatters: Headline valuation can misstate investor economics if preference stacks or secondary components are material.
    diligencePath: Review financing documents, shareholder agreements, and the latest cap table waterfall.
    relatedQuestionRefs:
      - QO014
      - QO025
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: customer-count
    missingEvidence: Exact total customer count and segmentation by vertical, geography, and revenue concentration.
    whyItMatters: Public additions and logos do not show concentration risk or actual breadth of paying accounts.
    diligencePath: Obtain cohort-level customer counts, top-account concentration, and logo list with production status.
    relatedQuestionRefs:
      - QO024
  - type: stale
    severity: minor
    topic: headcount-precision
    missingEvidence: A single precise employee count current to June 2026.
    whyItMatters: >-
      Public materials show directionally strong scale but use floor statements rather than a synchronized current
      number.
    diligencePath: Request current HR headcount by geography and function from management.
    relatedQuestionRefs:
      - QO024
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table coverage gap
    missingEvidence: >-
      A fully exhaustive public chronology covering every round, launch, governance event, and adverse event since
      founding.
    whyItMatters: >-
      The retained timeline is strong enough for overview analysis but not complete enough to claim exhaustive
      historical coverage.
    diligencePath: Request an internal corporate timeline and compare it with public newsroom history before final IC diligence.
    relatedQuestionRefs:
      - QO019
      - QO021
      - QO023
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: sam-som-gap
    missingEvidence: A segmented SAM/SOM model by vertical, geography, and deployment motion.
    whyItMatters: Valuation cannot rely only on broad DI rhetoric if Quantexa's realistically reachable budgets are smaller.
    diligencePath: Request management TAM/SAM/SOM model with conversion assumptions and segment-by-segment win-rate history.
    relatedQuestionRefs:
      - QM006
      - QM026
  - type: private-evidence-only
    severity: material
    topic: government-budget-gap
    missingEvidence: A consolidated public-sector budget pool and procurement conversion funnel relevant to Quantexa.
    whyItMatters: Individual flagship wins do not reveal repeatable government market size or sales efficiency.
    diligencePath: Obtain pipeline by agency, deal stage, expected ACV, and procurement timeline.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: deployment-conversion-gap
    missingEvidence: Win-rate, deployment-rate, and segment attach-rate data by buyer cohort.
    whyItMatters: Top-down opportunity means little without evidence of repeatable commercial conversion.
    diligencePath: Review funnel analytics by segment, channel partner, and region.
    relatedQuestionRefs:
      - QM022
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: Like-for-like price, contract-length, and implementation-cost comparisons across the competitor set.
    whyItMatters: Competitive positioning changes materially if Quantexa is more expensive or slower to deploy than peers.
    diligencePath: Request recent bake-off analyses and procurement comparisons from management and customers.
    relatedQuestionRefs:
      - QP022
  - type: private-evidence-only
    severity: material
    topic: share-gap
    missingEvidence: Comparable customer counts, deployment counts, and win-rate data across key competitors.
    whyItMatters: Public category narratives do not reveal actual share or displacement momentum.
    diligencePath: Review competitor shortlists and win-loss data by segment.
    relatedQuestionRefs:
      - QP023
      - QP026
  - type: private-evidence-only
    severity: material
    topic: cash-runway-gap
    missingEvidence: Cash balance, monthly burn, runway, and financing covenants.
    whyItMatters: Headline capital raised does not show how much liquidity remains or how fast it is being consumed.
    diligencePath: Request current cash-flow statement, runway model, and debt/covenant schedule.
    relatedQuestionRefs:
      - QI016
  - type: private-evidence-only
    severity: material
    topic: margin-gap
    missingEvidence: Gross margin, implementation cost, support cost, and revenue mix by product line.
    whyItMatters: >-
      Valuation and capital-efficiency judgments depend on whether Quantexa is software-heavy or delivery-heavy in
      practice.
    diligencePath: Request revenue and gross-margin bridge split by subscription, license, services, and partner channels.
    relatedQuestionRefs:
      - QI017
      - QI025
  - type: private-evidence-only
    severity: material
    topic: balance-sheet-gap
    missingEvidence: Debt, working-capital obligations, and any project-finance or contract-liability exposure.
    whyItMatters: Balance-sheet obligations can materially change downside risk despite strong growth equity backing.
    diligencePath: Review latest balance sheet and debt schedule with management.
    relatedQuestionRefs:
      - QI018
  - type: missing-source
    severity: material
    topic: reliability-gap
    missingEvidence: >-
      A public status page, historical uptime metrics, service-level commitments, or named ISO 27001 / SOC 2 credentials
      for the platform and newer AI modules.
    whyItMatters: >-
      Without external assurance or service-history evidence, technical diligence cannot independently judge production
      reliability or security maturity.
    diligencePath: >-
      Request the security package, uptime history, incident summaries, and customer contractual SLA language directly
      from Quantexa.
    relatedQuestionRefs:
      - QE023
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: benchmark-methodology
    missingEvidence: >-
      Independent methodology or reproducible benchmark detail behind the 99% accuracy, 90%+ improvement, 60x speed, and
      228% ROI claims.
    whyItMatters: >-
      Headline metrics shape product quality perception and commercial ROI, but without methodology they cannot be
      underwritten as hard technical proof.
    diligencePath: >-
      Ask for benchmark design, baseline definitions, customer cohort size, and any third-party validation decks used in
      sales or board reporting.
    relatedQuestionRefs:
      - QE027
    relatedTableRefs:
      - TE004
  - type: access-blocked
    severity: material
    topic: public-developer-docs
    missingEvidence: >-
      Open API references, public documentation depth, public sample code, and broader external developer activity
      outside Quantexa's gated community.
    whyItMatters: >-
      Integration-heavy platforms are easier to diligence when external developers can inspect docs, repos, release
      notes, and examples without a commercial relationship.
    diligencePath: >-
      Request partner or developer documentation, API specs, SDK examples, and evidence of external developer adoption
      during technical diligence.
    relatedQuestionRefs:
      - QE024
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: new-ai-module-adoption
    missingEvidence: >-
      Production customer counts, attach rates, and implementation burden for Q Assist, Agent Gateway, and Unify for
      Microsoft Fabric.
    whyItMatters: >-
      These newer layers shape the future expansion story, but public evidence does not yet show how widely or deeply
      they are deployed.
    diligencePath: >-
      Ask for live reference customers, module-level ARR or attach-rate disclosures, and implementation timelines for
      recent AI and Fabric products.
    relatedQuestionRefs:
      - QE016
      - QE017
      - QE026
    relatedTableRefs:
      - TE001
      - TE005
  - type: missing-source
    severity: material
    topic: customer-count-gap
    missingEvidence: Current total customer count, active production-account count, and customer mix by vertical and geography.
    whyItMatters: >-
      Without a denominator, the strong growth and bank-penetration claims cannot be translated into concentration or
      saturation risk.
    diligencePath: >-
      Request an account bridge showing total customers, active customers, and ARR by vertical, region, and account
      size.
    relatedQuestionRefs:
      - QU019
    relatedTableRefs:
      - TU002
      - TU005
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: GRR, gross logo retention, churn, cohort retention, renewal cadence, and contract terms.
    whyItMatters: >-
      Public NRR is constructive, but underwriting durability still requires the gross-retention and cohort view
      underneath it.
    diligencePath: >-
      Request cohort retention tables, renewal history for top accounts, and gross-retention metrics by vertical and
      product suite.
    relatedQuestionRefs:
      - QU020
      - QU027
    relatedTableRefs:
      - TU004
  - type: private-evidence-only
    severity: blocking
    topic: concentration-gap
    missingEvidence: Top-customer revenue share, top-10 account share, median contract length, and ARR exposure by buyer type.
