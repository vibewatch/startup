- id: scenarios-and-comparables
  title: Bull, base, and bear scenarios plus comparable set
  body: 'The scenario work should be framed as bounded and illustrative rather than precise. Public evidence is strong enough to bracket outcomes, but not strong enough to claim a single “correct” value. In the bear case, Quantexa is only modestly above the $100 million ARR floor, margin structure looks more services-heavy than premium software, and the market compresses its multiple toward mature financial-crime or analytics software levels. That points to roughly $1.3-1.9 billion of value and material downside from the latest round. In the base case, Quantexa grows into roughly $125-140 million of ARR with solid retention, partner-led upsell, and continued customer expansion, supporting a band around $2.3-3.1 billion — essentially a hold-or-breakeven underwriting outcome at the current price. In the bull case, ARR reaches roughly $150-175 million, product expansion via Cloud AML, Fabric, and Q Assist converts into meaningful monetization, and the market still awards a premium private multiple,
    producing a $3.6-5.3 billion range. The comparable set reinforces why the recommendation must stay price-sensitive: Quantexa''s disclosed multiple is already rich versus mature public incumbents and can only be defended if investors believe it deserves to move closer to premium AI-data outcomes despite far thinner disclosure.'
