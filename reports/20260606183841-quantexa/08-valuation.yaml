- id: exit-readiness-and-final-asks
  title: Exit readiness, thesis-break triggers, and final diligence asks
  body: 'On public evidence, Quantexa looks more ready for a strategic sale, structured secondary, or heavily diligenced growth round than for a clean IPO narrative. The strategic logic is real: Quantexa touches bank compliance, public-sector data, customer intelligence, and AI-governance-adjacent workflows that larger software, analytics, or platform companies could value. But public-evidence exit readiness is held back by the same issues constraining the investment call: under-disclosed revenue quality, thin visibility on margins and cash conversion, and no clean view into the late-stage capital stack. That means thesis-break triggers should center on verified ARR quality, retention, margins, and preferences — not on category rhetoric. If diligence reveals ARR materially below roughly $110 million, NRR below 100%, or a preference structure that captures most upside before new capital, the thesis breaks even if product relevance remains intact. Conversely, if diligence shows materially
    higher ARR, software-like margins, and a clean preference stack, the call can move from track to proceed. The key point is that Quantexa remains investable, but only with disciplined valuation terms and a full private-data package.'
