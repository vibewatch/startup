tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Public-evidence basis
  - What changes the view
  rows:
  - - Recommendation
    - TRACK / CONDITIONAL DILIGENCE ONLY
    - Scaled and strategically relevant business, but public evidence does not justify paying the last disclosed $2.6B price without deeper private underwriting.
    - Proceed only if verified ARR, margins, retention, and preferences support the premium multiple.
  - - Confidence
    - Medium
    - Multiple sources corroborate scale, customer relevance, and valuation history, but too many return-critical inputs remain private.
    - Moves higher with audited ARR bridge, gross-margin split, and cohort retention detail.
  - - Risk rating
    - High
    - Meaningful downside exists if current ARR is only modestly above the public floor or if the capital stack is investor-unfriendly.
    - Falls toward medium if NRR is comfortably above 100%, margins are software-like, and runway is strong.
  - - Valuation stance
    - Full to slightly rich at $2.6B
    - The disclosed price implies at least 26x the public ARR floor and already assumes premium-software economics.
    - Could become fair if current ARR is materially above $140M and preference terms are clean.
  - - Target return / hold view
    - Base case is near hold; bull case exists but is not yet underwritten publicly
    - Public evidence points to limited upside in the base case and clear downside in the bear case at the latest mark.
    - A lower entry price or strong downside protection materially improves expected return.
  - - Preferred exit path
    - Strategic sale or structured secondary ahead of IPO
    - Strategic relevance is visible, but IPO-grade disclosure on margins, cash generation, and governance is not.
    - IPO path improves only with cleaner audited economics and a well-understood capital stack.
  notes: Recommendation is based on public evidence only; scenario values are bounded illustrations rather than a fairness opinion.
