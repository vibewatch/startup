company:
  name: Quantexa
chapter:
  number: 8
  title: Valuation
  summary: Quantexa's latest disclosed valuation is $2.6 billion from the 2025 Series F, and the public file is strong enough to prove scale but not strong enough to underwrite that price cleanly. A $100 million ARR floor, 120%+ NRR signal, and clear strategic relevance support a real business, but thin disclosure on exact ARR, margins, burn, and preferences means the most defensible public-evidence call is medium-confidence, high-risk, and track or conditional diligence only at a full-to-slightly-rich valuation stance.
sections:
- id: investment-thesis-and-call
  title: Investment thesis, anti-thesis, and recommendation
  body: 'Quantexa is good enough to stay on an investor''s board agenda, but not transparent enough for a clean proceed-at-price recommendation. The positive case is straightforward: the company has crossed $100 million ARR, publicly reported 120%+ NRR, described nearly 40% license growth and 23 new customers in 2024, and continues to expand from core bank financial-crime work into public sector, customer intelligence, and AI-assisted workflows. IDC and Chartis recognition, plus case studies with HSBC, ABN AMRO, Standard Chartered, Novobanco, and Vodafone, support the view that Quantexa is strategically relevant rather than a niche point tool. The anti-thesis is just as important. The public record is still thin on exact current ARR, revenue mix, gross margin, burn, and the economics of the late-stage capital stack. Sifted''s £76 million FY2024 revenue and $55 million loss figures are directionally useful, but they increase rather than close the underwriting gap. The most realistic public-evidence
    call is therefore track or conduct conditional diligence only: medium confidence in company quality, high risk on return realization, and a valuation stance that looks full to slightly rich at the latest disclosed $2.6 billion mark unless private diligence proves materially better ARR and margin quality than the public file shows.'
