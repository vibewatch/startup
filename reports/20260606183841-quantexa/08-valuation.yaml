- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric anchor
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Quantexa Series F (2025)
    - $175M round; $100M ARR floor already public
    - $2.6B valuation; at least 26x ARR floor
    - Latest price-setting reference and the right starting point for entry discipline.
    - Private terms, exact ARR, and preference stack are undisclosed.
  - - Quantexa Series E (2023)
    - $129M round
    - $1.8B valuation
    - Shows the step-up path into the current mark and confirms strong private demand in 2023.
    - No public ARR or margin bridge tied to that round.
  - - Palantir (public)
    - June 2026 market cap and TTM revenue
    - ~62x market-cap / revenue proxy
    - Useful upside-ceiling reference for a premium AI/data platform narrative.
    - Much larger, more disclosed, and not a direct AML/decision-intelligence comp.
  - - FICO (public)
    - June 2026 market cap and TTM revenue
    - ~11.7x market-cap / revenue proxy
    - Shows what a durable analytics/decisioning software franchise can command with stronger economics.
    - Diversified and more mature than Quantexa.
  - - NICE (public, Actimize parent)
    - June 2026 market cap and TTM revenue
    - ~1.9x market-cap / revenue proxy
    - Useful floor-style reference for mature, diversified financial-crime software exposure.
    - Parent-level multiple is not the standalone value of NICE Actimize.
  - - Direct operating peer set
    - NICE Actimize, Oracle, Verafin, Feedzai, Featurespace, FICO, and Pega pages
    - Strategic-status reference set rather than a normalized price set
    - Helps define buyer-choice reality and why Quantexa cannot be valued in a vacuum.
    - Retained public pack does not provide a clean, current private-valuation set for each peer.
  notes: 'The comparable set is intentionally model-appropriate rather than perfectly normalized: latest private rounds plus selected public market-data proxies and operating references.'
  enumerationScope:
    coverage: partial
    basis: Rows cover the latest disclosed Quantexa rounds, three public market-data proxies, and the most relevant operating-peer reference set visible in retained public sources.
