      - number: '1.3'
        title: Funding history, valuation trajectory, and investor base
        blocks:
          - type: paragraph
            body: >-
              Quantexa's financing trajectory is one of the strongest public parts of the story. The company moved from
              a $153 million Series D in 2021 to a $129 million Series E in 2023 at a $1.8 billion valuation, then to a
              $175 million Series F in March 2025 at a $2.6 billion valuation led by Teachers' Venture Growth. Across
              those later rounds alone, disclosed capital is substantial, and the public round ladder strongly implies
              more than $640 million of lifetime capital when earlier rounds are included. The investor mix is also
              notable: late-stage growth capital, strategic financial institutions, and long-time venture backers all
              remain visible in the public stack. Warburg Pincus, Evolution Equity Partners, Dawn Capital, British
              Patient Capital, AlbionVC, HSBC, and BNY all recur in the narrative. The adverse overlay is not that
              Quantexa lacks capital; it is that public investors still cannot see ownership percentages, secondaries,
              debt exposure, or preference terms. UKTN's 2023 coverage usefully reminds readers that the Series E
              up-round happened during a harder private-market window, which strengthens Quantexa's momentum story but
              also raises the bar for future execution at a $2.6 billion mark.
