    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and business model
        blocks:
          - type: paragraph
            body: >-
              Quantexa is best understood as a London-headquartered enterprise software company that has expanded from
              financial-crime analytics into a broader Decision Intelligence platform. Official materials consistently
              describe the business as an AI, data, and analytics software provider that helps enterprises and
              government agencies unify fragmented data, resolve entities, create graph context, and use that connected
              foundation for customer intelligence, fraud, risk, and compliance decisions. That description matters
              because the company no longer markets itself as only an AML vendor. The homepage and Series F release
              frame Decision Intelligence as the umbrella category, while the platform narrative explicitly links data
              ingestion, entity resolution, graph generation, AI, and decision support. The company remains private, but
              the public record is strong enough to anchor basic identity facts: Quantexa was founded in 2016, is
              headquartered in London, and is currently a late-stage Series F company. What the public record still does
              not provide is an audited revenue statement or a precise 2026 customer count, so the overview must
              separate broad platform identity from still-private operating detail.
