      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              Buyer segmentation in Quantexa's market depends on workflow ownership. In global banks, the buyer may sit
              with financial-crime, compliance, risk, or enterprise-data leaders, while the users span investigators,
              analysts, operations teams, and frontline decision-makers. In customer intelligence, the budget can shift
              toward growth or transformation teams, even though the technical and governance stakeholders still sit in
              data functions. Public-sector demand adds another buyer path entirely: sovereign-data, fraud, tax, and
              national-security programs can become anchor accounts with centralized procurement and long deployment
              cycles. Cloud AML introduces yet another segment by targeting U.S. mid-size and community banks that have
              similar pain points but fewer internal resources. These differences matter because the market is not sold
              through one universal pitch. The same contextual-data platform can land as a compliance tool, a
              customer-analytics engine, a data-modernization layer, or a public-sector fraud and intelligence platform
              depending on who owns the budget and what outcomes matter most.
