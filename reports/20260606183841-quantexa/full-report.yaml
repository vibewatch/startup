      - number: '7.3'
        title: Operational, partner, and customer-dependency risk
        blocks:
          - type: paragraph
            body: >-
              Quantexa's operational risk is less about one acute failure mode than about the breadth of systems and
              stakeholders that must work together. Its own materials show a platform spanning entity resolution,
              graph-driven investigations, Cloud AML, Microsoft Fabric deployments, and newer agentic-AI workflows. That
              breadth is strategically attractive, but it also increases the number of places where data quality,
              governance, or implementation sequencing can break. Microsoft is the most obvious public dependency
              because Azure Marketplace and Fabric are central to the latest productization story, while Databricks is
              another visible ecosystem route. Customer proof provides mitigation in one sense—it shows real deployments
              at HSBC, Novobanco, ABN AMRO, and Vodafone—but it also concentrates the public evidence on a relatively
              small set of large regulated accounts. That creates a familiar enterprise-software risk: marquee
              references can coexist with concentration, long sales cycles, and unpredictable expansion timing. The
              community surface adds another wrinkle. Release and training infrastructure exists, but some documentation
              pathways are gated and the public GitHub surface is effectively closed, which makes external validation of
              product maturity harder than the company's broad platform claim might imply.
