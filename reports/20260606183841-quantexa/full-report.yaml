  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Dimension
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Market and urgency
        - AMLR, fragmented data, and AI governance needs keep the decision-intelligence category relevant.
        - Large market rhetoric does not guarantee realized budgets or premium multiples.
        - Show that regulated and public-sector demand is converting into durable ARR growth, not just pipeline.
      - - Product and moat
        - >-
          Entity resolution, graph context, Cloud AML, Fabric, and Q Assist create a broader platform story than classic
          AML point tools.
        - Competitors and adjacent platforms can still absorb budget or bundle enough functionality to narrow the moat.
        - Confirm paid adoption and ACV uplift from the newer product surfaces.
      - - Customer proof
        - >-
          HSBC, ABN AMRO, Standard Chartered, Novobanco, and Vodafone validate strategic relevance across multiple use
          cases.
        - Case studies are curated and do not disclose total customer count, churn, or cohort-level economics.
        - Request cohort retention, expansion, and top-customer concentration detail.
      - - Financial quality
        - $100M+ ARR, 120%+ NRR, and 2024 growth signals indicate real recurring-software momentum.
        - >-
          Sifted's revenue/loss figures and missing gross-margin data mean quality of earnings is still underwritten
          indirectly.
        - Provide audited ARR bridge, gross-margin split, and cash-burn profile.
      - - Competition
        - IDC and Chartis recognition plus customer proof imply Quantexa belongs in the strategic vendor set.
        - >-
          Public incumbents and premium AI-data platforms frame either a lower-multiple floor or a much
          higher-disclosure bar.
        - Demonstrate differentiated win rates and pricing power against incumbent and platform alternatives.
      - - Capital stack and governance
        - Blue-chip investors and current filings suggest Quantexa remains financeable and active.
        - >-
          No public source discloses dilution, liquidation preferences, or how the late-stage stack affects new-money
          returns.
        - Obtain cap table, preference waterfall, and any side-letter or ratchet terms.
    notes: >-
      This table pairs the strongest public-evidence bull argument with the most material underwriting counterpoint for
      each dimension.
