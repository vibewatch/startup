      - number: '2.2'
        title: Sizing lenses and contradictory public estimates
        blocks:
          - type: paragraph
            body: >-
              Public market-sizing evidence is directionally supportive but not cleanly additive. On the broadest lens,
              Quantexa's own IDC-related materials point to Decision Intelligence as a roughly $496-$500 billion
              opportunity by 2030. That number is useful because it explains the ambition investors are underwriting,
              but it remains too broad to use as a stand-alone TAM for valuation. The narrower adjacent lens is AML
              software, where IMARC pegs the market at $3.2 billion in 2025 and $9.1 billion by 2034. Those figures are
              much smaller, but arguably more concrete because they tie directly to regulated workflows. The key problem
              is that public evidence does not isolate a Quantexa-specific SAM or SOM from either lens. There is no
              clean public bridge from broad DI rhetoric to the subset of budgets Quantexa can actually win by segment,
              geography, and deployment model. That is why the market chapter should preserve sizing uncertainty instead
              of smoothing it away with one headline number.
