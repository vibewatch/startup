  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Explicit public-evidence assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          ARR grows to roughly $150-175M, product expansion and public-sector traction monetize, and retention stays
          premium.
        - $3.6-5.3B using 24-30x ARR; roughly 1.4-2.0x gross value vs the $2.6B reference.
        - Requires evidence that newer products are becoming meaningful revenue contributors, not just roadmap proof.
        - Bull fails if cross-sell remains mostly narrative or if margins look services-heavy.
      - - Base
        - >-
          ARR reaches roughly $125-140M, NRR remains healthy, and Quantexa keeps its current strategic narrative without
          major disclosure improvement.
        - $2.3-3.1B using 18-22x ARR; essentially a hold-to-modest-upside underwriting case at the latest price.
        - >-
          Best supported by current public evidence: scale is real, but disclosure is still too thin for a bigger
          premium.
        - Base slips if ARR is nearer the public floor or if preference terms materially subordinate new capital.
      - - Bear
        - >-
          ARR is only roughly $105-120M, retention softens, and the market prices Quantexa closer to mature or more
          diversified public software references.
        - $1.3-1.9B using 12-16x ARR; implies meaningful downside from the 2025 mark.
        - >-
          Triggered by weaker retention, lower gross margin, or a financing overhang that reduces equity value to new
          money.
        - A down-round, weak cohorts, or an investor-unfriendly preference stack would move valuation toward this band.
    notes: >-
      Scenario ranges are illustrative and assumption-based; they are bounded by public ARR, growth, and market-data
      anchors rather than by complete private financials.
    claimRefs:
      - CV031
      - CV034
      - CV035
