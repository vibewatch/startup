            body: >-
              Quantexa sells into organizations that treat data quality, entity resolution, and network context as
              operational infrastructure rather than an isolated analytics project. In practice that means the economic
              buyer is often a chief data officer, chief information officer, head of financial crime, or transformation
              leader; the day-to-day users are investigators, compliance analysts, data teams, relationship teams, and
              frontline operational staff; and the payer is the enterprise or public-sector institution rolling out the
              program. The customer mix is broader than a pure AML niche. FY24 disclosures explicitly named banking,
              insurance, telecommunications, media, technology, and the public sector, while product pages show a second
              segmentation axis by organization size: global tier-1 institutions at the high end and newer cloud AML
              offers for U.S. mid-size and community banks at the lower end. The segmentation story is therefore well
              evidenced by vertical, use case, and buyer type. What remains opaque is the segment-level revenue mix and
