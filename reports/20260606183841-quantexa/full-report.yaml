      - number: '4.4'
        title: Financial verdict and adverse context
        blocks:
          - type: paragraph
            body: >-
              The adverse view is not that Quantexa lacks scale; it is that late-stage scale and valuation are easier to
              verify than margin durability. UKTN's 2023 reporting made clear that Quantexa was an outlier up-round
              winner during a tougher venture market, which means later investors are underwriting continued execution
              at increasingly demanding expectations. Sifted added the sharpest negative public financial datapoint: for
              the 12 months to 31 March 2024 it reported £76 million of revenue and $55 million of losses. Because that
              article is a media summary rather than a direct statutory-note extract reproduced in this chapter, it
              should be treated as adverse context rather than the chapter's canonical audited KPI set; still, it points
              to a business that had not yet converted scale into profitability. Even so, the public record still
              supports a constructive financial conclusion. Quantexa has crossed $100 million ARR, posted 120%+ NRR,
              disclosed strong growth, and raised enough capital to keep investing. The missing diligence items are
              burn, gross margin, revenue split, and the exact current ARR level—not whether the business has genuine
              revenue momentum.
