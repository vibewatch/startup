      - number: '8.2'
        title: Financing context, valuation mechanics, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The financing ladder is one of the better-documented parts of the story. Quantexa moved from a $153
              million Series D in 2021 to a $129 million Series E at $1.8 billion in 2023, then to a $175 million Series
              F at $2.6 billion in March 2025. Companies House confirms that filing cadence is current and that
              statements of capital continued into 2026, but those filings do not reveal the preference stack, ownership
              percentages, or whether new money is meaningfully subordinated by late-stage terms. That matters because
              the disclosed valuation is only the headline price, not the real entry economics. Public evidence is
              strongest on scale and weakest on economic quality. Using the $100 million ARR floor, the latest price
              implies at least a 26x ARR multiple. That is still below Palantir's premium public AI-data multiple, but
              far above mature public incumbent proxies such as NICE and well above FICO. The right interpretation is
              not that Quantexa is obviously mispriced; it is that the last round already bakes in a premium software
              outcome while disclosure remains private-company thin. Entry discipline should therefore require a
              verified ARR bridge, gross-margin split, customer-cohort retention, burn and runway detail, and the full
              preference stack before matching the 2025 mark. Without that package, an investor is paying for upside
              that public evidence does not yet underwrite.
            claimRefs:
              - CV002
              - CV003
              - CV008
