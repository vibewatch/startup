      - number: '5.4'
        title: Trust, privacy, compliance, and unresolved product risks
        blocks:
          - type: paragraph
            body: >-
              The trust story is stronger than the reliability story. Quantexa's AI, Q Assist, and Agent Gateway pages
              all emphasize explainability, privacy and security, monitoring, access control, prompt management,
              approvals, and immutable audit trails, which is consistent with how the company sells into heavily
              regulated financial-crime and public-sector environments. The privacy policy also shows a real
              legal/governance surface rather than pure marketing language: it covers service, website, and employment
              data; mentions internal group entities and external processors; and points users to the UK ICO for
              complaints. At the same time, public gaps are important. Across the retained legal, community, and
              developer surfaces, there is no named public status page, uptime history, service-level commitment, or
              explicit ISO 27001 or SOC 2 disclosure. The community surface proves Quantexa has releases, user groups,
              academy content, and events, but the documentation category redirects to sign-in and the GitHub
              organization has no public repositories or public members. That means customers appear to get structured
              enablement, but outsiders get limited technical transparency compared with more open enterprise platforms.
              The product risk is therefore less about whether Quantexa has a trust narrative and more about whether
              diligence can independently verify security maturity, developer readiness, and production reliability for
              the newest AI layers.
