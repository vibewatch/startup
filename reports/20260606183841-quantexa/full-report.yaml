  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and vendor classes
        blocks:
          - type: paragraph
            body: >-
              Quantexa does not compete inside one narrow vendor bucket. The most useful landscape starts with four
              classes: incumbent bank-suite vendors such as NICE Actimize and Oracle, AI-native or cloud-first
              challengers such as Feedzai, Featurespace, Verafin, and ComplyAdvantage, adjacent data and governance
              platforms such as IBM, Informatica, and SAS, and internal-build or compose-it-yourself substitutes built
              on cloud and data stacks. That framing matters because Quantexa's category position itself spans AML,
              fraud, risk, customer intelligence, and broader data-led decisioning. A buyer can therefore reject
              Quantexa for very different reasons depending on the use case: staying with an incumbent, choosing a
              specialized fraud vendor, relying on an existing customer-data platform, or building on a cloud ecosystem.
              The chapter should not overstate direct one-to-one rivalry with every name on the long list, but it should
              also avoid pretending the only contest is with classic AML vendors. Quantexa's broadened product surface
              is a strength, yet it widens the set of alternatives buyers will consider.
