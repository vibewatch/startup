  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - ARR quality miss
        - Verified current ARR materially below roughly $110M
        - Implies the 2025 round multiple was even richer than the public floor suggests.
        - Stop at last price or re-underwrite only at a materially lower entry.
      - - Retention deterioration
        - NRR below 100% or weak gross retention in key cohorts
        - Breaks the recurring-software expansion story that supports premium multiples.
        - Treat as thesis break unless price resets sharply.
      - - Services-heavy margin profile
        - Gross margin or delivery mix looks materially below software-like expectations
        - Pulls Quantexa toward lower-multiple implementation-heavy comparables.
        - Demand a lower valuation or structured downside protection.
      - - Preference overhang
        - Liquidation preferences, ratchets, or seniority materially subordinate new money
        - Reduces true economic upside even if the headline valuation looks unchanged.
        - Do not match the last round price without stack simplification.
      - - New-product monetization stall
        - Cloud AML / Fabric / Q Assist remain narrative-only with little paid traction
        - Weakens the bull case that Quantexa can grow into a higher ARR and multiple band.
        - Keep to base-or-bear case and avoid paying for roadmap optionality.
    notes: >-
      Kill triggers are designed to be monitorable in diligence rather than generic concerns about competition or market
      size.
    claimRefs:
      - CV021
      - CV022
      - CV031
      - CV042
      - CV046
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Current ARR bridge
        - Monthly or quarterly ARR by product and by major cohort
        - Determines whether the latest valuation is base-case fair or still too rich.
        - Finance data room and auditor-backed KPI package.
      - - Gross margin and services mix
        - Software, services, support, and partner-delivery margin split
        - Separates premium software economics from implementation-heavy economics.
        - Finance and operating review.
      - - Retention and concentration
        - GRR/NRR by top cohorts plus top-customer exposure
        - Validates recurring quality and resilience against a few large accounts.
        - Revenue ops and customer-success diligence.
      - - Cash, burn, and runway
        - Cash balance, monthly burn, covenant package, and financing plan
        - Shows whether investors are buying growth or bridging risk.
        - Finance, board materials, and lender review if any.
      - - Cap table and preferences
        - Full ownership table, liquidation waterfall, side letters, and any ratchets
        - Headline valuation is not enough to judge real return economics.
        - Legal and financing counsel review.
      - - New-product monetization
        - Paid customer count and ACV for Cloud AML, Fabric, Q Assist, and public-sector upsell
        - Determines whether the bull case is real or mostly roadmap.
        - Product, sales, and customer-reference diligence.
    notes: >-
      These asks are sequenced to answer valuation first: price support, downside protection, and what would genuinely
      move the recommendation.
    claimRefs:
      - CV003
      - CV011
      - CV021
      - CV022
      - CV043
