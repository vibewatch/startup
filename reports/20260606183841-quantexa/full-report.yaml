      - number: '1.2'
        title: Founder, leadership, and governance structure
        blocks:
          - type: paragraph
            body: >-
              Quantexa remains visibly founder-led. Vishal Marria is still the central public executive, and the
              retained leadership evidence continues to tie the company's early wedge to his anti-financial-crime and
              banking-technology background. That founder-market-fit story is attractive, but it also creates real
              key-person dependence because Marria is the dominant external face for the company's strategy, product
              vision, and financing narrative. The broader public leadership picture is improving but still incomplete.
              Public releases identify Dan Higgins as Chief Product Officer and document recent governance additions:
              HSBC Group CIO Stuart Riley joined the board in January 2025, while Teachers' Venture Growth added Ara
              Yeromian in connection with Series F. Quantexa also expanded its advisory bench in 2025 with Steven
              Guggenheimer, Franck Petitgas, and Lucy Frazer. Even so, public sources still do not provide a clean,
              current cap-table-weighted board roster, ownership percentages, or liquidation terms. Investors therefore
              get a reasonable picture of who is influential around the table, but not a full view of control rights or
              board dynamics.
