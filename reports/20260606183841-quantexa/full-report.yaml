      - number: '2.4'
        title: Growth drivers, adoption constraints, and what could slow the category
        blocks:
          - type: paragraph
            body: >-
              The category has real tailwinds. Fragmented enterprise data, increasingly connected financial-crime
              threats, and the need for governed AI all create demand for platforms that can join data and explain
              decisions. AML reform, FATF standards, and the EU's AI policy approach all reinforce the case for more
              structured, trustworthy decisioning. Partner ecosystems with Microsoft and Databricks also expand the
              market by linking Quantexa-like platforms to cloud and data modernization budgets. But the adverse
              evidence is equally important. Finextra's survey of UK financial-services firms found that AI adoption is
              widespread, yet many institutions still have only partial understanding of deployed models and remain
              worried about privacy, quality, security, bias, and third-party dependence. Quantexa's own FinCrime Pulse
              data shows mid-size banks feel confident about threats while still struggling with outdated systems and
              staffing gaps. In other words, the market is real, but implementation complexity, procurement friction,
              and governance burdens can easily slow realized adoption even when top-down TAM narratives look large.
