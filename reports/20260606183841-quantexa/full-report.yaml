  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and relevance
        blocks:
          - type: paragraph
            body: >-
              Quantexa's market should not be defined as the entire AI economy. The more defensible boundary is Decision
              Intelligence software that helps large organizations connect fragmented data, resolve entities, understand
              relationships, and then use that context for operational decisions across financial crime, fraud, risk,
              customer intelligence, and adjacent transformation workflows. That framing matters because Quantexa is
              neither a pure data-quality tool nor a generic AI model vendor. Its own platform and solution pages show a
              category that sits between data unification and downstream decisions. This boundary also clarifies
              substitutes. The company competes not only with specialist AML vendors, but also with legacy rule engines,
              point fraud tools, manual investigations, and internal build paths that use cloud data stacks without a
              dedicated DI layer. The result is a market definition that is narrower than enterprise AI but broader than
              classic AML, with especially important adjacencies in customer intelligence and public-sector data
              modernization.
