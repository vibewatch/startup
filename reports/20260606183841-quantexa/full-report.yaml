    Quantexa is a London-headquartered private software company founded in 2016 that sells a Decision Intelligence
    platform for enterprise and government customers. Its core product ingests fragmented data, resolves entities,
    generates graph context, and then layers analytics, AI, and workflow automation on top for AML, fraud, risk,
    customer-intelligence, and public-sector use cases. Public evidence shows the business has scaled to $100M+ ARR,
