  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: 平台夹在云生态、大型受监管客户、监管机构和创始人主导的技术核心之间；任一节点变弱，都可能传导到商业表现。
    data:
      nodes:
        - id: D1
          label: Quantexa 平台
          detail: Decision Intelligence、AML、客户智能和 AI 产品面。
          tone: neutral
        - id: D2
          label: Microsoft Fabric / Azure
          detail: 近期高曝光发布依赖云、封装和分发。
          tone: risk
        - id: D3
          label: Databricks 与生态合作伙伴
          detail: 支持联合方案叙事的数据与 AI 扩展合作伙伴。
          tone: risk
        - id: D4
          label: 大型银行和企业客户
          detail: HSBC、ABN AMRO、Novobanco、Vodafone 以及类似锚点背书。
          tone: risk
        - id: D5
          label: 公共部门买家
          detail: 政府机构切入点能验证品类宽度，但周期较长。
          tone: risk
        - id: D6
          label: 监管机构和隐私义务
          detail: 部署周围存在 AML、AI 治理、隐私和申报控制预期。
          tone: risk
        - id: D7
          label: 创始人与技术负责人
          detail: Marria 和 Hutton 在公开战略和架构可信度上仍居核心。
          tone: risk
        - id: D8
          label: 社区与文档界面
          detail: 外部发布、培训和验证界面对市场可见。
          tone: risk
        - id: D9
          label: 资金提供方
          detail: 后期投资者的支持取决于持续执行质量。
          tone: neutral
      edges:
        - from: D2
          to: D1
          label: 云与 Marketplace 路径
        - from: D3
          to: D1
          label: 生态集成路径
        - from: D4
          to: D1
          label: 部署和续约需求
        - from: D5
          to: D1
          label: 公共部门增长切入点
        - from: D6
          to: D1
          label: 控制预期
        - from: D7
          to: D1
          label: 战略和架构所有权
        - from: D8
          to: D4
          label: 验证和上线质量
        - from: D9
          to: D1
          label: 融资支持和定价纪律
    claimRefs:
      - CR020
      - CR021
      - CR029
      - CR030
      - CR032
      - CR034
      - CR037
      - CR038
      - CR044
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 从规模和证据走向估值纪律与最终判断的推荐路径。
    data:
      nodes:
        - label: 具规模的战略资产
          detail: ARR 已超过 $100M，客户证据覆盖银行、公共部门和客户智能。
          tone: positive
        - label: 质量信号值得关注
          detail: 120%+ NRR、分析师认可和新产品封装，支撑了真实的软件增长论证。
          tone: positive
        - label: 披露缺口仍大
          detail: 公开来源仍未显示准确 ARR、毛利率、烧钱速度或优先股堆叠。
          tone: risk
        - label: 最新价格已有溢价
          detail: $2.6B 标记至少意味着公开 ARR 下限的 26x，需要高端软件经济性支撑。
          tone: risk
        - label: 只有拿到私有证据才推进
          detail: 在匹配价格前，需要验证 ARR、利润率、现金跑道和清算条款。
          tone: neutral
        - label: 建议：仅观察 / 有条件尽调
          detail: 基于公开证据，中等信心、高风险，估值立场为已足到略偏贵。
          tone: risk
      edges:
        - from: Scaled strategic asset
          to: Quality signals support attention
          label: 证据
        - from: Quality signals support attention
          to: Disclosure gap remains large
          label: 但
        - from: Disclosure gap remains large
          to: Latest price already premium
          label: 因此
        - from: Latest price already premium
          to: Only proceed with private proof
          label: 进入纪律
        - from: Only proceed with private proof
          to: 'Recommendation: track / conditional diligence only'
          label: 当前结论
    claimRefs:
      - CV005
      - CV006
      - CV020
      - CV031
      - CV033
      - CV044
      - CV047
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 基于公开证据锚定 ARR 与倍数组合，展示示意性估值结果。
    data:
      items:
        - label: $110M ARR × 12x 情景
          value: 1320
          detail: 偏悲观结果：如果 ARR 刚越过公开下限，且私募市场倍数压缩。
          tone: risk
        - label: $120M ARR × 16x 情景
          value: 1920
          detail: 悲观上沿 / 基准下沿的交叉点，仍低于 2025 年标记。
          tone: risk
        - label: $130M ARR × 20x 情景
          value: 2600
          detail: 如果 Quantexa 已明显高于公开 ARR 下限，这大致对应最新披露估值。
          tone: neutral
        - label: $140M ARR × 22x 情景
          value: 3080
          detail: 基准到乐观的交叉点，需要更强质量和变现证据。
          tone: positive
        - label: $160M ARR × 24x 情景
          value: 3840
          detail: 乐观情景，需要高端增长延续，并有更强私有证据支撑。
          tone: positive
    approximationNotes: 这些数值是使用 ARR 区间和倍数区间做出的示意性企业价值代理，并非报告的当前 ARR 或公平性意见。
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV031
      - CV034
      - CV035
      - CV036
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 相对于最新披露参考价，展示悲观、基准和乐观结果下的示意性估值区间。
    data:
      items:
        - label: 悲观情景
          low: 1300
          value: 1600
          high: 1900
          detail: 若增长和质量不及预期，约为 $2.6B 参考价的 0.5-0.7x。
          tone: risk
        - label: 基准情景
          low: 2300
          value: 2600
          high: 3100
          detail: 约为当前参考价的 0.9-1.2x；本质上是持有到小幅上涨结果。
          tone: neutral
        - label: 乐观情景
          low: 3600
          value: 4300
          high: 5300
          detail: 若 ARR、利润率和新产品变现都超预期，约为当前参考价的 1.4-2.0x。
          tone: positive
    approximationNotes: 区间受公开 ARR、增长和市场数据锚定限制，应按情景带而非单点估计理解。
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV037
      - CV044
      - CV047
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: IC 风格评分卡，解释公司质量为什么可投，但估值支撑仍不完整。
    data:
      items:
        - label: 市场紧迫性
          value: 4/5
          detail: 监管、数据割裂和 AML 现代化需求仍是真实需求驱动。
          tone: positive
        - label: 客户证据
          value: 4/5
          detail: 参考客户和多用例案例研究支撑战略相关性。
          tone: positive
        - label: 产品护城河
          value: 4/5
          detail: 实体解析加图谱上下文和更新的封装，构成差异化故事。
          tone: positive
        - label: 经济性披露
          value: 2/5
          detail: 准确 ARR、毛利率、烧钱速度和优先股条款仍缺失于公开证据。
          tone: risk
        - label: 竞争缓冲
          value: 3/5
          detail: 护城河有意义，但面对既有厂商和平台卖家并非赢者通吃。
          tone: neutral
        - label: 估值支撑
          value: 2/5
          detail: 当前价格已经计入高溢价情景，但公开记录还不足以充分证明这些情景。
          tone: risk
        - label: 证据质量
          value: 3/5
          detail: 规模已有旁证，但决定回报的承销输入仍大多未公开。
          tone: neutral
    claimRefs:
      - CV017
      - CV020
      - CV021
      - CV025
      - CV032
      - CV041
      - CV045
      - CV047
