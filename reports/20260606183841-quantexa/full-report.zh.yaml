      - number: '4.3'
        title: 资本充足性、披露质量与融资依赖
        blocks:
          - type: paragraph
            body: >-
              尽管现金细节不可得，公开证据显示 Quantexa 的资本位置稳健。已披露融资阶梯包括 $153 million Series D、$129 million Series E，以及估值 $2.6 billion
              的 $175 million Series F。把更早轮次计入后，累计融资显然远超 $640 million；2025 年 Series F 也明确把下一步资金用途放在平台创新、合作伙伴、北美扩张和选择性
              M&A，而不是救急融资。从这个意义上说，Quantexa 看起来是在为增长和品类扩张融资，而不是填补显眼的资产负债表漏洞。披露问题在别处：Companies House
              提供法定备案证据，但没有投资人完整承销所需的分部级收入、毛利率或现金消耗细节。因此，公开证据足以得出 Quantexa
              目前资本充足的结论，却不足以判断精确现金跑道、资产负债表弹性，或资本效率是否改善得足够快，能支撑当前估值点位。
