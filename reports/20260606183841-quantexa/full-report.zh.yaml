      - number: '1.4'
        title: 规模、牵引力与里程碑时间线
        blocks:
          - type: paragraph
            body: >-
              Quantexa 的里程碑记录显示，公司同时拓宽了市场范围和产品覆盖面。公开披露支撑出清晰时间线：截至 2024 年 6 月，公司报告 DI ARR 增长 40%、NRR 超过 120%、活跃 DI 用户
              16,000 名，并渗透进全球前 50 大银行中超过 25%。到 2024 年 10 月，公司已跨过 $100 million ARR，自财年开始以来新增 30 家顶级全球客户，并称超过一半新增 DI ARR
              来自既有客户。此后的里程碑进一步把叙事从核心银行合规外扩。2024 年 9 月，公司设立专门的全球公共部门业务单元并获得 USSOCOM 合同；2025 年新增 Cloud AML、Microsoft
              Fabric 工作负载、Quantexa Unify 正式可用和更大的顾问委员会；2026 年 5 月又拿下 £175 million 的 HMRC 转型项目。这些里程碑共同支撑一个判断：Quantexa
              现在已作为更宽的数据和 AI 平台运作，横跨金融服务、政府和客户智能。仍较薄弱的是精确客户数、利润率质量和 2026 年准确员工数等硬披露。
