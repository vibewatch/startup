      - number: '1.2'
        title: 创始人、领导层与治理结构
        blocks:
          - type: paragraph
            body: >-
              Quantexa 仍明显由创始人驱动。Vishal Marria
              依然是最核心的公开高管，保留下来的领导层证据继续把公司的早期切入点与他的反金融犯罪和银行技术背景联系起来。这个创始人—市场匹配故事有吸引力，但也带来真实的关键人依赖，因为 Marria
              是公司战略、产品愿景和融资叙事最主要的外部面孔。更广义的公开领导层图景正在改善，但仍不完整。公开新闻稿确认 Dan Higgins 为首席产品官，并记录了近期治理层补强：HSBC Group CIO Stuart
              Riley 于 2025 年 1 月加入董事会，Teachers' Venture Growth 则在 Series F 相关安排中加入 Ara Yeromian。Quantexa 还在 2025
              年扩充顾问阵容，加入 Steven Guggenheimer、Franck Petitgas 和 Lucy
              Frazer。即便如此，公开资料仍没有给出清晰、当前、按股权结构权重呈现的董事会名单、持股比例或清算条款。投资人因此能大致看清桌边哪些人有影响力，却看不到控制权或董事会动态的全貌。
