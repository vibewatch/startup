    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              Quantexa 最适合被理解为一家总部位于伦敦的企业软件公司，它从金融犯罪分析起步，已经扩展成更宽的决策智能平台。官方材料持续把公司描述为
              AI、数据和分析软件提供商，帮助企业和政府机构统一碎片化数据、解析实体、创建图谱语境，并把这个互联基础用于客户智能、欺诈、风险和合规决策。这个定位很关键，因为公司不再只把自己包装成 AML 供应商。官网和
              Series F 新闻稿把决策智能放在伞状品类下，平台叙事也明确串起数据接入、实体解析、图谱生成、AI 和决策支持。公司仍未上市，但公开记录足以锚定基本身份事实：Quantexa 成立于 2016
              年，总部在伦敦，目前是一家后期 Series F 公司。公开记录仍不给出的，是经审计收入报表或精确的 2026 年客户数，因此公司概况必须区分宽平台身份和尚未公开的运营细节。
