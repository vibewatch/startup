      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Quantexa
              所在市场的买方分层取决于工作流归属。在全球银行，买方可能是金融犯罪、合规、风险或企业数据负责人；用户则横跨调查员、分析师、运营团队和一线决策者。在客户智能场景，预算可能转向增长或转型团队，尽管技术和治理利益相关者仍在数据职能内。公共部门需求又增加了一条完全不同的购买路径：主权数据、欺诈、税务和国家安全项目可能通过集中采购和长部署周期，成为锚定账户。Cloud
              AML
              又引入一个细分市场，目标是痛点相似但内部资源更少的美国中型和社区银行。这些差异重要，因为这个市场不是靠一套通用话术销售。同一套上下文数据平台，可以作为合规工具、客户分析引擎、数据现代化层，或公共部门欺诈与情报平台落地，取决于谁掌握预算、哪些结果最重要。
