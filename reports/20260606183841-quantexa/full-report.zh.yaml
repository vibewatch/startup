  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反向逻辑与建议
        blocks:
          - type: paragraph
            body: >-
              Quantexa 已足够成熟，值得留在投资人董事会的议程上；但公开透明度还不够，不能给出干净的按当前价格推进建议。正向逻辑很直接：公司已跨过 $100 million ARR，公开披露 NRR 超过 120%，称
              2024 年许可收入增长接近 40%、新增 23 个客户，并继续从核心银行金融犯罪场景扩展到公共部门、客户智能和 AI 辅助工作流。IDC 和 Chartis 的认可，加上 HSBC、ABN
              AMRO、Standard Chartered、Novobanco 和 Vodafone 的案例，支撑了一个判断：Quantexa 不是小众单点工具，而是有战略相关性的平台。反向逻辑同样重要。公开资料对当前精确
              ARR、收入结构、毛利率、烧钱速度以及后期资本堆叠的经济条款仍然披露不足。Sifted 披露的 FY2024 收入 £76 million、亏损 $55 million
              有方向性参考价值，但它们不是补上承销缺口，反而放大了缺口。因此，基于公开证据最现实的判断只能是观察，或仅做有条件尽调：对公司质量给中等信心，对回报兑现给高风险判断；除非私下尽调证明 ARR
              和利润率质量明显好于公开档案，否则按最新披露的 $2.6 billion 估值看，价格已偏满到略贵。
