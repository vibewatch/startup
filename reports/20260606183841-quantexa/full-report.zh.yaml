      - number: '2.4'
        title: 增长驱动、采用约束与可能拖慢品类的因素
        blocks:
          - type: paragraph
            body: >-
              这个品类确有顺风。企业数据碎片化、日益相互连接的金融犯罪威胁，以及对可治理 AI 的需求，都在推高对能够连接数据并解释决策的平台的需求。AML 改革、FATF 标准和欧盟 AI
              政策路径，也都强化了更结构化、可信决策的必要性。与 Microsoft 和 Databricks 的合作伙伴生态，还把类似 Quantexa
              的平台接到云和数据现代化预算上，从而扩大市场。但反向证据同样重要。Finextra 对英国金融服务公司的调查发现，AI
              采用已经广泛，但许多机构仍只部分理解已部署模型，并持续担忧隐私、质量、安全、偏见和第三方依赖。Quantexa 自己的 FinCrime Pulse
              数据显示，中型银行对威胁有信心，却仍受制于过时系统和人员缺口。换句话说，市场是真实的，但实施复杂性、采购摩擦和治理负担很容易拖慢实际采用，即便自上而下的 TAM 叙事看起来很大。
