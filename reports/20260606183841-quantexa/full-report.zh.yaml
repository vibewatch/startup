            body: >-
              Quantexa
              的公开财务图景，最强处在经常性收入信号，而不是经审计报表。公司没有发布完整公开损益表，但披露了成长型投资人最在意的指标：ARR、NRR、客户新增和许可证收入增长。这些信号强烈暗示它是经常性软件模式，而非一次性项目生意。产品覆盖面也支持这个解读。Quantexa
              围绕金融犯罪、客户智能、风险和数据现代化，将更宽的决策智能平台变现；Cloud AML 为美国中型银行加入明确的 SaaS 套件；Microsoft Fabric
              集成让平台更容易通过合作伙伴生态打包和分发。话虽如此，公开资料没有揭示订阅、许可证、实施或合作伙伴收入的精确组合。因此，正确结论是收入质量方向上看起来有吸引力且具经常性，但公开记录仍无法完全拆解，已报告规模中有多少来自高毛利软件，又有多少来自服务占比更重的部署工作。
