              120%，这本身就是强企业软件结果。两个相邻事实又强化了这个信号：超过一半新增决策智能 ARR 来自既有客户，混合平均合同价值在 FY24 增长
              15%。这些点合在一起，意味着真实账户扩张，而不是只靠新客户获取驱动的业务。公开产品证据也符合扩张故事：客户智能、Fabric、Q Assist 和 Cloud AML
              都扩大了可增购范围。限制在于，Quantexa 仍未披露 GRR、流失率、续约节奏、合同期限或队列曲线。因此，公开耐久性建立在强 NRR
              视角和选择性模块采用证据之上，而不是完整续约数据集。这足以支撑建设性解读，但不足以消除尽调风险。
