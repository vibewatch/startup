  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Quantexa 在客户工作流中交付什么
        blocks:
          - type: paragraph
            body: >-
              Quantexa 销售的不是通用 AI
              聊天机器人，也不是狭窄合规单点工具。公开产品记录显示一套可重复工作流：客户先接入碎片化内外部数据，再跨人员、组织、账户、供应商、交易对手和地点解析实体，随后生成图谱语境，最后用这个互联基础做决策支持、决策增强和决策自动化。这套工作流被复用到多个商业套件。在金融犯罪和
              AML 中，Quantexa 连接客户、交易、观察名单和登记数据，让调查员带着更多语境完成发现、调查和报告。在客户智能中，同一基础用于为客户和潜客创建 360
              度视图，以支持个性化和增长。在欺诈和风险中，Quantexa 强调隐藏网络分析、交易对手语境和更早信号。Cloud AML 展示公司如何把该栈打包成更产品化的云产品，面向美国中型和社区银行；与 Fabric
              关联的 Unify 则显示，公司希望接入企业数据现代化预算，而不仅仅销售给合规部门。共同点是一套构建语境的平台，试图让人类和 AI 决策更安全、更可执行。
