        blocks:
          - type: paragraph
            body: >-
              运营模式足够具体，已经可以跳出营销语言来描述。Quantexa 的公开平台页面描述了不依赖特定数据模式的接入和增强、解析和标准化、分层模型、动态实体解析、图谱生成和分析，以及从分析师工作台到 AI
              辅助建议和自动动作的一系列工作流输出。核心工程故事是：数据接入一次，跨多个用例复用，并以批处理或动态方式处理，而无需为每个工作流复制记录。Entity Resolution
              是锚点，因为它创建可信对象，随后图谱分析、风险模型和 AI 助手都在这些对象上运行。公司还宣传开放部署和集成界面：本地部署、首选云、受支持 API 和库，以及与数据湖和数据仓库互操作。Microsoft
              Fabric 和 Unify 材料让架构更具体：Quantexa 是位于 OneLake、Power BI、Copilot Studio 和 Azure OpenAI 之上的匹配与统一层。Novobanco
              案例研究尤其有用，因为它展示了这套架构如何从金融犯罪数据层扩展到更宽的 AI 和客户工作流。依赖性的取舍在于，产品接入既有生态越深，价值越高；但它也更暴露于数据质量、云平台、LLM
              和客户治理依赖，而这些依赖在公开材料中只部分可见。
