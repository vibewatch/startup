  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序视角与投资含义
        blocks:
          - type: paragraph
            body: >-
              公开记录支持清晰排序。第一是披露不透明和财务模型风险：Quantexa 在融资、客户牵引力和平台野心上证据很强，但最尖锐的公开经济数据点仍是 Sifted 的 FY2024
              收入和亏损快照，而不是毛利率、烧钱速度或合作伙伴经济性的清晰公开桥梁。第二是合作伙伴和云依赖。Quantexa 当前产品化故事严重依赖 Microsoft Fabric、Azure 分发，以及
              Databricks 等生态渠道；这些有助于放大销售推进，也会让公司共同依赖第三方路线图和共同销售执行。第三是监管和法律敞口。公司销售到 AML、欺诈、KYC 和公共部门决策场景，同时营销可解释和智能体
              AI，因此欧盟 AML、FATF、隐私和 AI 信任预期都很重要。第四是客户集中度和执行。公开证据最强处在大型受监管账户和经过筛选的标杆赢单，而不是广泛的账户级分散化。第五是关键人和产品透明度风险：Vishal
              Marria 和 Jamie Hutton 是公开故事的核心，而公开文档、正常运行时间和保证披露比公司的品类野心更薄。投资含义不是自动放弃，而是必须先完成尽调驱动的承销，才能接受当前估值或长期上行叙事。
