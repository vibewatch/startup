      - number: '7.2'
        title: 监管、法律与治理风险
        blocks:
          - type: paragraph
            body: >-
              Quantexa 不只是销售通用分析。它销售到受监管的金融犯罪和客户决策工作流，而买方预期正越来越受正式 AML/CFT 标准、隐私义务和 AI
              信任要求塑造。重要的是，公开法律边界可见但不完整。公司发布隐私政策、网站条款和公司备案轨迹，产品页面也反复强调可解释性、隐私和 AI
              治理。这些都是有意义的缓释信号。但同一组来源没有提供公开状态页、公开安全认证包，或把这些承诺连接到外部保证的直接公开桥梁。与此同时，监管背景正朝相反方向移动：欧盟 AML 套件、AMLR、FATF 标准和欧洲
              AI 信任框架，都提高了受监管买方在控制出错时的成本。因此，正确解读不是 Quantexa
              缺少治理语言，而是投资仍需要对数据处理协议、模型治理控制、安全保证和实体层级合规责任做硬尽调，之后才能把法律和监管风险视为已成熟缓释。
