    type: dag
    layout: wide
    summary: Quantexa 的主要风险经由披露、合作伙伴集中和信任治理负担，传导至增长质量、融资杠杆和估值。
    data:
      nodes:
        - id: R1
          label: 披露不透明
          detail: 公开证据对利润率、烧钱和集中度的展示，仍比增长叙事薄。
          tone: risk
        - id: R2
          label: 合作伙伴与云依赖
          detail: Microsoft、Fabric、Azure 和其他生态路径承担了市场开拓重任。
          tone: risk
        - id: R3
          label: 监管与隐私负担
          detail: 买家要求更高后，AML、AI 信任和隐私预期都会上升。
          tone: risk
        - id: R4
          label: 实施与保证摩擦
          detail: 若控制证据和可靠性证明仍薄，尽调和部署都会变慢。
          tone: risk
        - id: R5
          label: 扩张质量下降
          detail: 如果集中度或部署质量不及预期，扩张和续约都会走弱。
          tone: risk
        - id: R6
          label: 利润率与现金疑虑
          detail: 投资者会假设交付强度更高，软件杠杆低于预期。
          tone: risk
        - id: R7
          label: 融资杠杆走弱
          detail: 下一轮或老股交易支持会对价格更敏感。
          tone: risk
        - id: R8
          label: 估值下修
          detail: 高溢价 DI 叙事不再能按此前倍数通过检验。
          tone: risk
      edges:
        - from: R1
          to: R6
          label: 经济性仍未证实
        - from: R2
          to: R4
          label: 共享路线图和渠道
        - from: R3
          to: R4
          label: 买家要求更强保证
        - from: R4
          to: R5
          label: 部署和续约放慢
        - from: R5
          to: R6
          label: 增长质量走弱
        - from: R6
          to: R7
