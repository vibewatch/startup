      - number: '8.3'
        title: 乐观、基准、悲观情景及可比公司组
        blocks:
          - type: paragraph
            body: >-
              情景分析应当被视为有边界的示意，而不是精确估值。公开证据足以给结果划区间，但不足以声称存在一个「正确」价值。悲观情景下，Quantexa 只略高于 $100 million ARR
              下限，利润率结构更像服务占比高的业务，而不是高溢价软件，市场把倍数压到成熟金融犯罪或分析软件水平。对应价值约 $1.3-1.9 billion，相比最新一轮有实质下行。基准情景下，Quantexa 增长到约
              $125-140 million ARR，留存稳健，合作伙伴带动增购，客户继续扩张，支撑约 $2.3-3.1 billion 的区间——按当前价格看，本质上是持有或打平的承销结果。乐观情景下，ARR 达到约
              $150-175 million，Cloud AML、Fabric 和 Q Assist 带来的产品扩展转化为有意义的变现，市场仍给高溢价私营倍数，价值区间达到 $3.6-5.3
              billion。可比公司组进一步说明，推荐意见必须对价格敏感：Quantexa 披露的倍数相对成熟公开同业已经偏贵，只有投资人相信它在披露远更薄的情况下仍值得向高溢价 AI 数据结果靠拢，这个倍数才站得住。
