  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相关性
        blocks:
          - type: paragraph
            body: >-
              Quantexa 的市场不应被定义成整个 AI
              经济。更站得住脚的边界，是帮助大型组织连接碎片化数据、解析实体、理解关系，并把这些语境用于金融犯罪、欺诈、风险、客户智能和相邻转型工作流中运营决策的决策智能软件。这个框架很重要，因为 Quantexa
              既不是纯数据质量工具，也不是通用 AI 模型供应商。它自己的平台和解决方案页面显示的品类，位于数据统一和下游决策之间。这个边界也澄清了替代方案。公司不仅与专业 AML
              供应商竞争，也与传统规则引擎、单点欺诈工具、手工调查，以及不使用专门 DI 层、直接基于云数据栈自建的路径竞争。结果是：市场定义窄于企业 AI，但宽于传统
              AML；客户智能和公共部门数据现代化是尤其重要的相邻领域。
