        - $1.8B 估值
        - 展示估值抬升至当前标记的路径，并确认 2023 年私募需求强劲。
        - 没有与该轮绑定的公开 ARR 或利润率桥接。
      - - Palantir（上市）
        - 2026 年 6 月市值和 TTM 收入
        - ~62x 市值 / 收入代理倍数
        - 可作为高端 AI / 数据平台叙事的上行天花板参照。
        - 规模大得多、披露更充分，且不是直接 AML / 决策智能可比公司。
      - - FICO（上市）
        - 2026 年 6 月市值和 TTM 收入
        - ~11.7x 市值 / 收入代理倍数
        - 说明经济性更强、可持续的分析 / 决策软件业务能拿到什么定价。
        - 比 Quantexa 更多元、更成熟。
      - - NICE（上市，Actimize 母公司）
        - 2026 年 6 月市值和 TTM 收入
        - ~1.9x 市值 / 收入代理倍数
        - 可作为成熟、多元金融犯罪软件敞口的底部参照。
        - 母公司层面倍数不是 NICE Actimize 的独立价值。
      - - 直接运营同业组
        - NICE Actimize、Oracle、Verafin、Feedzai、Featurespace、FICO 和 Pega 页面
        - 战略地位参照组，而非标准化价格组
        - 帮助界定买方选择的现实，也说明 Quantexa 不能脱离同业真空估值。
        - 保留的公开资料包没有提供每个同业干净、最新的私募估值可比组。
    notes: 可比组有意按模型适配，而不是追求完全标准化：最新私募融资轮，加上选定公开市场数据代理和运营参照。
