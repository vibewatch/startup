  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与供应商类别
        blocks:
          - type: paragraph
            body: >-
              Quantexa 并不在一个狭窄供应商篮子里竞争。最有用的版图从四类开始：NICE Actimize 和 Oracle 等银行套件既有厂商；Feedzai、Featurespace、Verafin 和
              ComplyAdvantage 等 AI 原生或云优先挑战者；IBM、Informatica 和 SAS 等相邻数据与治理平台；以及基于云和数据栈搭建的内部自建或自行组合替代方案。这个框架重要，因为
              Quantexa 的品类位置本身横跨 AML、欺诈、风险、客户智能和更宽的数据驱动决策。因此，买方可能出于非常不同的原因拒绝
              Quantexa：留在既有厂商体系内，选择专门欺诈供应商，依赖现有客户数据平台，或在云生态上自建。本章不应夸大长名单上每个名字与 Quantexa 的一对一直接竞争，但也不能假装唯一战场只是传统 AML
              供应商。Quantexa 扩宽后的产品覆盖面是一项优势，却也扩大了买方会考虑的替代方案集合。
