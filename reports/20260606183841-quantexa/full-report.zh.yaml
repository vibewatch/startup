companyProfile:
  summary: >-
    Quantexa 是一家总部位于伦敦的私营软件公司，成立于 2016 年，面向企业和政府客户销售决策智能平台。核心产品接入碎片化数据，完成实体解析，生成图谱语境，再叠加分析、AI
    和工作流自动化，用于反洗钱（AML）、欺诈、风险、客户智能和公共部门场景。公开证据显示，公司已扩张至 $100M+ ARR、120%+ NRR、超过 15,000 名平台用户，并在 Series F 中达到 $2.6B 估值；但当前
    ARR、利润率画像和资本结构条款等关键经济细节仍未公开。
