      - number: '2.2'
        title: 规模测算视角与相互矛盾的公开估计
        blocks:
          - type: paragraph
            body: >-
              公开市场规模证据方向上有支撑，但不能简单相加。用最宽的视角看，Quantexa 自己与 IDC 相关的材料指向决策智能到 2030 年约 $496-$500 billion
              的机会。这个数字有用，因为它解释了投资人押注的野心，但作为估值的独立 TAM 仍过于宽泛。更窄的相邻视角是 AML 软件，IMARC 估计该市场 2025 年为 $3.2 billion，到 2034 年达到
              $9.1 billion。这些数字小得多，但可以说更具体，因为它们直接绑定受监管工作流。关键问题在于，公开证据没有从任一视角中隔离出 Quantexa 专属的 SAM 或
              SOM。公开资料没有搭出一座清晰桥梁，把宽泛 DI 叙事落到 Quantexa 真实可赢取、按细分市场、地区和部署模式划分的预算子集。因此，市场章节应保留规模测算不确定性，而不是用一个头条数字把它抹平。
