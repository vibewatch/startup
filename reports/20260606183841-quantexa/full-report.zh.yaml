      - number: '5.4'
        title: 信任、隐私、合规与未解决的产品风险
        blocks:
          - type: paragraph
            body: >-
              信任故事强于可靠性故事。Quantexa 的 AI、Q Assist 和 Agent Gateway
              页面都强调可解释性、隐私与安全、监控、访问控制、提示词管理、审批和不可篡改审计轨迹，这与公司销售给高度受监管的金融犯罪和公共部门环境相一致。隐私政策也显示出真实法律和治理表面，而不只是营销语言：它覆盖服务、网站和雇佣数据；提到内部集团实体和外部处理方；并指向英国
              ICO 作为投诉渠道。与此同时，公开缺口很重要。在保留的法律、社区和开发者界面中，没有具名的公开状态页、正常运行时间历史、服务等级承诺，或明确的 ISO 27001 或 SOC 2 披露。社区界面证明
              Quantexa 有发布、用户组、学院内容和活动，但文档类别会跳转到登录，GitHub
              组织没有公开仓库或公开成员。这意味着客户似乎能获得结构化赋能，但与更开放的企业平台相比，外部人士得到的技术透明度有限。因此，产品风险并不在于 Quantexa 是否有信任叙事，而在于尽调能否独立验证最新 AI
              层的安全成熟度、开发者就绪度和生产可靠性。
