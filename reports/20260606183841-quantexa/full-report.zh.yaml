      - number: '8.4'
        title: 退出准备度、投资逻辑破裂触发点与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              从公开证据看，Quantexa 更适合战略出售、结构化老股交易，或经过重度尽调的成长轮，而不是一个干净的 IPO 叙事。战略逻辑真实存在：Quantexa 触达银行合规、公共部门数据、客户智能，以及 AI
              治理相邻的工作流，大型软件、分析或平台公司都可能重视这些资产。但同样限制投资判断的问题，也压住了公开证据层面的退出准备度：收入质量披露不足，利润率与现金转化能见度低，后期资本堆叠也看不清。因此，投资逻辑破裂触发点应围绕经核验的
              ARR 质量、留存、利润率和优先权，而不是品类话术。若尽调发现 ARR 明显低于约 $110 million、NRR 低于
              100%，或优先权结构在新资本之前吃掉大部分上行，即使产品相关性仍在，投资逻辑也会破裂。反过来，若尽调显示 ARR 明显更高、利润率更像软件、优先股堆叠干净，判断就可以从观察转为推进。关键在于，Quantexa
              仍具备可投性，但前提是估值条款有纪律，并拿到完整私有数据包。
