    rows:
      - - 建议
        - 观察 / 仅限有条件尽调
        - 业务已有规模且具战略价值，但公开证据不足以支撑在没有更深入私下承销的情况下支付上一轮披露的 $2.6B 价格。
        - 只有在已验证 ARR、利润率、留存和优先权支持高溢价倍数时才推进。
      - - 信心
        - 中
        - 多方来源互相印证规模、客户价值和估值历史，但太多决定回报的输入仍未公开。
        - 若拿到经审计 ARR 桥接、毛利率拆分和队列留存细节，信心上调。
      - - 风险评级
        - 高
        - 如果当前 ARR 只是略高于公开下限，或资本结构对投资人不友好，下行风险显著。
        - 若 NRR 明显高于 100%、利润率接近软件公司、现金跑道充足，风险可降至中等。
      - - 估值立场
        - $2.6B 已充分定价至略偏贵
        - 披露价格意味着至少 26x 公开 ARR 下限，且已经假设高端软件经济性。
        - 如果当前 ARR 显著高于 $140M 且优先权条款干净，估值可能变得合理。
      - - 目标回报 / 持有判断
        - 基准情景接近持有；乐观情景存在，但公开证据尚不足以承销
        - 以最新估值标记看，公开证据指向基准情景上行有限、悲观情景下行清晰。
        - 更低进入价格或强下行保护会显著改善预期回报。
      - - 优先退出路径
        - IPO 前战略出售或结构化老股交易
        - 战略价值可见，但利润率、现金生成和治理还没有达到 IPO 级披露。
        - 只有经审计经济性更清晰、资本结构被充分理解后，IPO 路径才会改善。
    notes: 建议仅基于公开证据；情景估值是有边界的示例，不是公平性意见。
