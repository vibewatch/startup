      - number: '8.2'
        title: 融资背景、估值机制与入场纪律
        blocks:
          - type: paragraph
            body: >-
              融资阶梯是这个故事里披露较完整的一块。Quantexa 从 2021 年 $153 million Series D，走到 2023 年估值 $1.8 billion 的 $129 million Series
              E，再到 2025 年 3 月估值 $2.6 billion 的 $175 million Series F。Companies House 确认申报节奏仍在更新，资本声明延续到 2026
              年，但这些文件没有披露优先股堆叠、持股比例，也没有说明新钱是否被后期条款实质性劣后。这很关键，因为披露估值只是头条价格，不是真正的入场经济性。公开证据最强的是规模，最弱的是经济质量。按 $100 million
              ARR 下限计算，最新价格至少对应 26x ARR 倍数。这个倍数仍低于 Palantir 的高溢价公开 AI 数据倍数，但远高于 NICE 这类成熟公开同业，也明显高于 FICO。正确解读不是 Quantexa
              显然定价错误，而是上一轮已经把高溢价软件结果计入价格，而披露仍然是私营公司的稀薄水平。因此，若要匹配 2025 年估值，入场纪律必须先拿到经核验的 ARR
              桥接、毛利率拆分、客户队列留存、烧钱与现金跑道细节，以及完整优先股堆叠。没有这套材料，投资人就是在为公开证据尚未能承销的上行空间买单。
