      - number: '1.3'
        title: 融资历史、估值轨迹与投资人基础
        blocks:
          - type: paragraph
            body: >-
              Quantexa 的融资轨迹是这个故事中公开证据最强的部分之一。公司从 2021 年 $153 million Series D，走到 2023 年估值 $1.8 billion 的 $129 million
              Series E，再到 2025 年 3 月由 Teachers' Venture Growth 领投、估值 $2.6 billion 的 $175 million Series
              F。仅这些后期轮次披露的资本就已相当可观；把更早轮次计入后，公开轮次阶梯强烈暗示累计融资超过 $640
              million。投资人组合也值得注意：后期成长资本、战略性金融机构和长期风险投资支持者都在公开资本结构中可见。Warburg Pincus、Evolution Equity Partners、Dawn
              Capital、British Patient Capital、AlbionVC、HSBC 和 BNY 反复出现在叙事里。反向视角并不是 Quantexa
              缺资本，而是公开市场仍看不到持股比例、老股交易、债务敞口或优先权条款。UKTN 2023 年报道有价值地提醒读者，Series E 的升估值融资发生在更艰难的私募市场窗口，这增强了 Quantexa
              的动能故事，也把未来以 $2.6 billion 估值继续执行的门槛抬高。
