        - 竞争者和相邻平台仍可能吸收预算，或打包足够功能来压窄护城河。
        - 确认较新产品界面的付费采用和 ACV 提升。
      - - 客户证据
        - HSBC、ABN AMRO、Standard Chartered、Novobanco 和 Vodafone 验证了多用例的战略价值。
        - 案例研究经过筛选，未披露总客户数、流失或队列级经济性。
        - 索取队列留存、扩张和头部客户集中度细节。
      - - 财务质量
        - $100M+ ARR、120%+ NRR 和 2024 增长信号表明真实的经常性软件动能。
        - Sifted 的收入 / 亏损数字和缺失的毛利率数据意味着盈利质量仍靠间接证据承销。
