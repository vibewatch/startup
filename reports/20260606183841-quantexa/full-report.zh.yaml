        - 会打断支撑高估值倍数的经常性软件扩张叙事。
        - 除非价格大幅重置，否则视为投资逻辑破裂。
      - - 服务占比偏高的利润率结构
        - 毛利率或交付组合明显低于软件化预期
        - 会把 Quantexa 拉向实施占比高、估值倍数更低的可比公司。
        - 要求更低估值或带下行保护的结构。
      - - 优先权包袱
        - 清算优先权、反稀释调价或优先顺位让新资金明显居后
        - 即便名义估值不变，真实经济上行空间也会被压低。
        - 堆叠结构未简化前，不应按上一轮价格跟投。
      - - 新产品商业化停滞
        - Cloud AML / Fabric / Q Assist 仍停留在叙事层，付费牵引很弱
        - 会削弱 Quantexa 能进入更高 ARR 和更高估值倍数区间的乐观情景。
        - 维持基准或悲观情景，不为路线图可选性付费。
    notes: 这些否决触发项设计成尽调中可监测的信号，而不是泛泛担心竞争或市场规模。
    claimRefs:
      - CV021
      - CV022
      - CV031
      - CV042
      - CV046
  - id: TV006
    title: 最终尽调需求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 当前 ARR 桥接
        - 按产品和主要队列拆分的月度或季度 ARR
        - 决定最新估值在基准情景下是否合理，还是仍然过贵。
        - 财务资料室和经审计师背书的 KPI 包。
      - - 毛利率和服务组合
        - 软件、服务、支持和合作伙伴交付的利润率拆分
        - 区分高溢价软件经济性和实施密集型经济性。
        - 财务和运营复核。
      - - 留存和集中度
        - 头部队列的总留存率（GRR）/ 净留存率（NRR），以及头部客户敞口
        - 验证经常性收入质量，以及面对少数大客户时的韧性。
        - 收入运营和客户成功尽调。
      - - 现金、烧钱和现金跑道
        - 现金余额、月度烧钱、契约条款包和融资计划
        - 说明投资人买到的是增长，还是在承接过桥风险。
        - 财务、董事会材料，以及如有则做贷款方复核。
      - - 股权结构表和优先权
        - 完整持股表、清算瀑布、附函和任何反稀释调价条款
        - 只看名义估值不足以判断真实回报经济性。
        - 法务和融资顾问复核。
      - - 新产品商业化
        - Cloud AML、Fabric、Q Assist 和公共部门增购的付费客户数与 ACV
        - 决定乐观情景是真实存在，还是主要停留在路线图。
        - 产品、销售和客户访谈尽调。
    notes: 这些需求按顺序先回答估值：价格支撑、下行保护，以及什么因素会真正改变建议。
    claimRefs:
      - CV003
      - CV011
      - CV021
      - CV022
      - CV043
