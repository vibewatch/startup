  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 明确公开证据假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发项
    rows:
      - - 乐观
        - ARR 增至约 $150-175M，产品扩张和公共部门牵引开始变现，留存保持高水平。
        - 按 24-30x ARR 计为 $3.6-5.3B；相对 $2.6B 参考值，账面总价值约 1.4-2.0x。
        - 需要证据说明较新产品正在成为有意义的收入贡献项，而不只是路线图证明。
        - 如果交叉销售仍主要停留在叙事，或利润率看起来偏服务化，乐观情景失效。
      - - 基准
        - ARR 达到约 $125-140M，NRR 保持健康，Quantexa 维持当前战略叙事且披露没有重大改善。
        - 按 18-22x ARR 计为 $2.3-3.1B；按最新价格，本质上是持有至小幅上行的承销情景。
        - 当前公开证据最支持这一情景：规模真实，但披露仍太薄，撑不起更高溢价。
        - 如果 ARR 更接近公开下限，或优先权条款显著压低新资金地位，基准情景下滑。
      - - 悲观
        - ARR 仅约 $105-120M，留存走软，市场按更成熟或更多元的上市软件参照给 Quantexa 定价。
        - 按 12-16x ARR 计为 $1.3-1.9B；意味着较 2025 年估值标记有明显下行。
        - 留存转弱、毛利率更低，或融资悬而未决并压低新资金的股权价值，都会触发该情景。
        - 估值下调轮、疲弱队列或对投资人不友好的优先权堆叠，会把估值推向该区间。
    notes: 情景区间是基于假设的示例；边界来自公开 ARR、增长和市场数据锚点，而不是完整私下财务。
