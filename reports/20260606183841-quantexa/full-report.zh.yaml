        title: 销售推进动作与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              Quantexa 的销售推进动作看起来是混合型，而非纯直接销售。公司明确称，合作伙伴参与的赢单占近期赢单一半以上，Microsoft 和 Databricks
              关系也让这个说法可信。领导层页面还提供了有用的成本线索：Quantexa 现在区分全球销售、解决方案工程、现场联盟、技术客户合作伙伴、产品战略和全球 R&D 组织；Tech Funding News 则描述公司在
              2025 年有 16 个办公室和 800+ 员工。大型案例研究也暗示一种咨询式企业销售模型，带有显著部署和变革管理工作。这对单位经济很重要：Quantexa
              可能受益于经常性软件收入和高价值企业合同，但也很可能承担有意义的销售、实施、支持和工程开销。即便没有披露利润率，公开客户证据也有助于约束经济性。HSBC 提到替换遗留系统带来的节省，Novobanco
              提到在统一基础上规模化部署 AI 模型，其他参考客户也暗示平台落地后可带来可观运营杠杆。结果是，公司看起来比纯服务集成商更产品化，但远不像消费者 SaaS
              那样低摩擦或自助。投资人应把它视为拥有经常性收入、交付强度不低的企业软件。
