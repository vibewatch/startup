              都展示了这种更宽动作。公司自己的数据进一步支撑这个论点：超过一半新增 DI ARR 来自既有客户，超过一半赢单涉及合作伙伴，30% 的 DI 收入来源在金融服务之外。但集中度图景仍未解决。Quantexa
              没有公开披露总客户数、头部客户收入占比、合同期限或续约集中度。渠道依赖也重要，因为受合作伙伴影响的赢单可以加速增长，同时遮蔽 Quantexa
