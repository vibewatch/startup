- id: gtm-and-unit-economics-proxies
  title: GTM motion and unit-economics proxies
  body: 'Quantexa''s go-to-market motion appears hybrid rather than purely direct. The company explicitly said partner-involved wins represent more than half of recent wins, and the Microsoft and Databricks relationships make that believable. Leadership pages add a useful cost clue: Quantexa now separates global sales, solution engineering, field alliances, technology account partners, product strategy, and a global R&D organization, while Tech Funding News described 16 offices and 800+ employees in 2025. Large case studies also imply a consultative enterprise-sales model with significant deployment and change-management work. That is important for unit economics: Quantexa likely benefits from recurring software revenue and high-value enterprise contracts, but it probably also carries meaningful sales, implementation, support, and engineering overhead. Public customer-proof helps bound the economics even if it does not reveal margins. HSBC referenced legacy-system replacement savings, Novobanco referenced scaled AI-model deployment on a unified foundation, and other reference customers imply substantial operational leverage once the platform is in place. The result is a company that screens more productized than a pure services integrator, but not as frictionless or self-serve as consumer SaaS. Investors should read it as enterprise software with recurring revenue and non-trivial delivery intensity.'
