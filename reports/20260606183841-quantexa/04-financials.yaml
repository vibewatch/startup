- id: capital-and-disclosure
  title: Capital adequacy, disclosure quality, and financing dependency
  body: 'Quantexa''s capital position looks robust from public evidence even though cash detail is unavailable. The disclosed financing ladder runs through a $153 million Series D, $129 million Series E, and $175 million Series F at a $2.6 billion valuation. That implies well over $640 million of lifetime capital when earlier rounds are included, and the 2025 Series F explicitly framed the next use of funds around platform innovation, partnerships, North America expansion, and selective M&A rather than rescue financing. In that sense, Quantexa appears to be financing growth and category expansion, not plugging an obvious balance-sheet hole. The disclosure problem is different: Companies House provides statutory filing evidence, but not the kind of segment-level revenue, gross-margin, or cash-burn detail an investor would need for full underwriting. The public evidence is therefore enough to conclude Quantexa is well capitalized for now, but not enough to determine exact runway, balance-sheet
    flexibility, or whether capital efficiency is improving fast enough to support the current valuation mark.'
  claimRefs:
  - CI024
  - CI025
  - CI026
  - CI027
  - CI028
