- id: TI005
  title: Public financial gaps table
  columns:
  - Gap
  - What is known
  - What is missing
  - Why it matters
  - Diligence ask
  rows:
  - - Cash / runway
    - Late-stage capital raised is substantial
    - No cash balance or runway figure
    - Needed to assess financing dependency
    - Request latest cash-flow bridge
  - - Gross margin
    - Recurring software signals are strong
    - No gross-margin disclosure
    - Needed to judge operating leverage
    - Request margin bridge by product and services
  - - Profitability
    - Sifted reported £76M of FY2024 revenue and $55M of losses
    - No direct filed P&L bridge or EBITDA disclosure in this chapter
    - Needed to judge the path from scale to break-even
    - Request statutory accounts plus management P&L bridge
  - - Revenue split
    - ARR, NRR, and product breadth are public
    - No split among subscription, license, services, partner revenue
    - Needed to assess quality of revenue
    - Request revenue mix by product and service line
  - - Debt / obligations
    - Companies House provides filings
    - No debt or project-finance disclosures
    - Needed to understand downside risk
    - Request debt schedule and covenants
  - - Current ARR precision
    - $100M+ floor and prior growth exist
    - No exact 2025/2026 ARR figure
    - Needed for current valuation math
    - Request monthly ARR bridge
  notes: These gaps are normal for a private late-stage company, but they are material enough to block full underwriting confidence.
