chapter:
  number: 4
  title: Financials
  summary: Quantexa's public financial evidence is strongest on recurring-revenue signals and capital raised, not on audited profit detail. The company has crossed $100 million ARR, disclosed 40% DI ARR growth and 120%+ NRR, and raised enough capital to fund productization and expansion, but it still does not disclose cash, gross margin, runway, or a clean revenue split. The financial verdict is constructive on momentum and capital adequacy, but still blocked on margin quality and burn visibility.
sections:
- id: revenue-model-and-traction
  title: Revenue model, recurring-revenue evidence, and public traction
  body: 'Quantexa''s public financial picture is strongest on recurring-revenue signals rather than on audited statements. The company does not publish a full public P&L, but it does disclose the metrics growth investors care about most: ARR, NRR, customer additions, and license revenue growth. Those signals strongly imply a recurring software model rather than a one-time project business. The product surface also supports that interpretation. Quantexa monetizes a broader Decision Intelligence platform across financial crime, customer intelligence, risk, and data modernization; Cloud AML adds an explicit SaaS package for U.S. mid-size banks; Microsoft Fabric integrations make the platform easier to package and distribute through partner ecosystems. That said, public sources do not reveal the exact blend of subscription, license, implementation, or partner revenue. The right conclusion is therefore that revenue quality looks directionally attractive and recurring, but the public record still
    cannot fully decompose how much of reported scale comes from high-margin software versus services-heavy deployment work.'
