- id: regulatory-legal-and-governance
  title: Regulatory, legal, and governance risk
  body: 'Quantexa is not just selling generic analytics. It is selling into regulated financial-crime and customer-decision workflows where buyer expectations are increasingly shaped by formal AML/CFT standards, privacy obligations, and trust requirements for AI. That matters because the public legal perimeter is visible but incomplete. The company publishes a privacy policy, website terms, and corporate filing trail, and its product pages repeatedly emphasize explainability, privacy, and AI governance. Those are meaningful mitigation signals. But the same source set does not provide a public status page, a public security-certification pack, or a direct public bridge from those commitments to external assurance. Meanwhile, the regulatory backdrop is moving in the opposite direction: the EU AML package, AMLR, FATF standards, and Europe''s AI-trust framework all raise the cost of getting controls wrong for regulated buyers. The right interpretation is therefore not that Quantexa lacks governance
    language, but that the investment still needs hard diligence on data-processing agreements, model-governance controls, security assurance, and entity-level compliance ownership before investors treat the legal and regulatory risk as maturely mitigated.'
