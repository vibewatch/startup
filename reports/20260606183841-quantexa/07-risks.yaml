  evidenceGaps:
  - type: missing-source
    severity: material
    topic: security-transparency
    missingEvidence: Public or diligence-room evidence for uptime history, security certifications, penetration testing, and any incident timeline.
    whyItMatters: Without external-assurance evidence, investors cannot judge whether Quantexa's trust-and-governance messaging is matched by operational resilience.
    diligencePath: Request SOC/ISO-equivalent materials, customer security questionnaires, uptime history, and incident-response governance documentation.
    relatedQuestionRefs:
    - QR011
    - QR014
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: blocking
    topic: economic-bridge
    missingEvidence: Audited 2025 revenue, gross margin, cash burn, cash balance, ARR-to-revenue bridge, and partner-revenue split.
    whyItMatters: Disclosure opacity is the highest-ranked risk because late-stage valuation support depends on proving economics, not just growth and logos.
    diligencePath: Obtain audited 2025 accounts, board pack KPI bridge, and management commentary on services mix, deferred revenue, and implementation intensity.
    relatedQuestionRefs:
    - QR003
    - QR022
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: Microsoft-, Databricks-, and partner-influenced revenue mix, rev-share economics, pipeline conversion, and contract protections.
    whyItMatters: Public evidence clearly shows ecosystem relevance, but not whether those partnerships are concentrated or economically attractive.
    diligencePath: Request partner-sourced pipeline, closed-won mix, concentration by counterparty, and commercial terms for major alliance programs.
    relatedQuestionRefs:
    - QR015
    - QR016
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer and public-sector ARR concentration, renewal timing, contract length, and deployment-stage distribution.
    whyItMatters: Public case studies prove real deployments, but they do not reveal whether a handful of accounts dominate revenue or strategic outcomes.
    diligencePath: Obtain top-10 customer mix, public-sector exposure, renewal calendar, and concentration-adjusted NRR analysis.
    relatedQuestionRefs:
    - QR018
    - QR032
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: succession-and-control-ownership
    missingEvidence: Succession planning, delegated leadership bench, and named control ownership across security, compliance, product, and delivery.
    whyItMatters: Founder and architect centrality is manageable only if scaled second-line leadership and control ownership are already in place.
    diligencePath: Request org chart, board and committee cadence, succession documentation, and senior leader responsibilities below the founders.
    relatedQuestionRefs:
    - QR019
    - QR028
    relatedTableRefs:
    - TR004
