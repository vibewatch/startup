chapter:
  number: 7
  title: Risks
  summary: 'Quantexa''s risk stack is investable but materially elevated: the hardest issues are disclosure opacity around margin and burn, dependence on Microsoft-led and partner-led delivery paths, and rising regulatory expectations around AML, privacy, and trustworthy AI. Public mitigations exist in the form of legal documents, governance-oriented product messaging, marquee customers, and capital raised, but residual exposure remains high because public external-assurance, concentration, and economic-detail disclosure is still thin.'
sections:
- id: ranked-risk-view
  title: Ranked risk view and investment implication
  body: 'The public record supports a clear ranking. First is disclosure opacity and financial-model risk: Quantexa has strong proof of fundraising, customer traction, and platform ambition, but the sharpest public economic datapoint is still Sifted''s FY2024 revenue-and-loss snapshot rather than a clean public bridge for gross margin, burn, or partner economics. Second is partner and cloud dependence. Quantexa''s current productization story leans heavily on Microsoft Fabric, Azure distribution, and ecosystem channels such as Databricks, which help scale go-to-market but also create shared dependency on third-party roadmaps and co-sell execution. Third is regulatory and legal exposure. The company sells into AML, fraud, KYC, and public-sector decisioning while simultaneously marketing explainable and agentic AI, so EU AML, FATF, privacy, and AI-trust expectations all matter. Fourth is customer concentration and execution. Public proof is strongest around large regulated accounts and curated
    marquee wins, not broad account-level diversification. Fifth is key-person and product-transparency risk: Vishal Marria and Jamie Hutton are central to the public story, while public documentation, uptime, and assurance disclosure remain thinner than the company''s category ambitions suggest. The investment implication is not an automatic pass, but a demand for diligence-led underwriting before accepting the current valuation or long-duration upside narrative.'
