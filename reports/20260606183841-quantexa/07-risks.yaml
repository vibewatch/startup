- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Disclosure opacity and margin uncertainty
    - Audited 2025 economic bridge
    - Management cannot provide audited 2025 revenue, gross margin, burn, cash, and partner-revenue bridge during diligence
    - Treat the current price as unsupported and re-underwrite to a materially lower valuation or walk
  - - Microsoft and ecosystem dependence
    - Partner concentration and joint-sell conversion
    - Microsoft-related or broader partner-influenced business is too concentrated or converts materially below plan
    - Reduce conviction in repeatable go-to-market leverage and haircut the growth case
  - - Regulatory, privacy, and AI-governance risk
    - Control and assurance pack completeness
    - No credible DPA, subprocessor, model-governance, or assurance pack for regulated customer use cases
    - Pause investment because legal and regulatory risk remains structurally underwritten by hope
  - - Customer and public-sector concentration
    - Top-account mix and renewal exposure
    - Top customers or public-sector programs account for an outsized share of ARR with weak renewal visibility
    - Reframe Quantexa as a concentration-risk story rather than a diversified platform story
  - - Security and product-transparency gap
    - External-assurance and reliability disclosure
    - No SOC/ISO equivalent evidence, no uptime history, and no incident-response narrative are available under NDA
    - Keep residual risk high and apply a sharper governance and legal diligence discount
  - - Key-person and execution dependence
    - Succession and operating-bench depth
    - Management cannot show delegated ownership below Marria/Hutton or clear delivery/compliance leadership coverage
    - Treat scale claims as brittle and move to a research-more or pass posture
  - - Competition and valuation pressure
    - Win-rate and expansion quality versus peers
    - Growth slows while competitive alternatives remain abundant and margins are still opaque
    - Assume multiple compression and avoid underwriting a premium category-leadership multiple
  notes: These are monitorable triggers that convert public concerns into investment actions; they are not forecasts.
