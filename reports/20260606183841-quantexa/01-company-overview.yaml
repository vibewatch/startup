  - type: private-evidence-only
    severity: material
    topic: stakeholder-or-investor-map coverage gap
    missingEvidence: Debt facilities, secondaries, liquidation preferences, exact ownership percentages, and secondary volume in later rounds.
    whyItMatters: Headline valuation can misstate investor economics if preference stacks or secondary components are material.
    diligencePath: Review financing documents, shareholder agreements, and the latest cap table waterfall.
