    missingEvidence: Current full board roster, ownership percentages, and committee structure.
    whyItMatters: Governance influence and investor control cannot be underwritten from public press releases alone.
    diligencePath: Request current board deck, cap table, and shareholder rights summary from management.
    relatedQuestionRefs:
