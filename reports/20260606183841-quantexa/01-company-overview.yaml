company:
  name: Quantexa
chapter:
  number: 1
  title: Company Overview
  summary: Quantexa is a London-based Decision Intelligence software company that has evolved from financial-crime roots into a broader AI, data, and analytics platform serving banks, enterprises, and government agencies. Public funding evidence supports a rapid late-stage rise from a 2023 unicorn round at $1.8 billion to a $2.6 billion Series F valuation in 2025, while operational disclosures show $100 million-plus ARR, strong FY24 growth, and expanding public-sector traction. The biggest remaining blind spots are not identity or momentum but exact ownership, customer count, and the full economic terms behind the late-stage capital stack.
sections:
- id: identity-and-business-model
  title: Identity, headquarters, and business model
  body: 'Quantexa is best understood as a London-headquartered enterprise software company that has expanded from financial-crime analytics into a broader Decision Intelligence platform. Official materials consistently describe the business as an AI, data, and analytics software provider that helps enterprises and government agencies unify fragmented data, resolve entities, create graph context, and use that connected foundation for customer intelligence, fraud, risk, and compliance decisions. That description matters because the company no longer markets itself as only an AML vendor. The homepage and Series F release frame Decision Intelligence as the umbrella category, while the platform narrative explicitly links data ingestion, entity resolution, graph generation, AI, and decision support. The company remains private, but the public record is strong enough to anchor basic identity facts: Quantexa was founded in 2016, is headquartered in London, and is currently a late-stage Series F
    company. What the public record still does not provide is an audited revenue statement or a precise 2026 customer count, so the overview must separate broad platform identity from still-private operating detail.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO022
  - CO034
  - CO046
  tableRefs:
  - TO001
