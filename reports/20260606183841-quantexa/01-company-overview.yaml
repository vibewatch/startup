- id: scale-traction-and-milestones
  title: Scale, traction, and milestone chronology
  body: 'Quantexa''s milestone record shows a company broadening in both market scope and product surface. Public disclosures support a clear timeline: by June 2024 the company reported 40% DI ARR growth, 120%+ NRR, 16,000 active DI users, and penetration into more than 25% of the world''s 50 largest banks. By October 2024 it had crossed $100 million ARR, added 30 top-tier global clients since the start of the fiscal year, and said more than half of new DI ARR was coming from existing customers. Milestones after that point further widen the narrative beyond core banking compliance. September 2024 brought a dedicated global public-sector business unit and a USSOCOM contract; 2025 added Cloud AML, Microsoft Fabric workloads, Quantexa Unify general availability, and a larger advisory board; May 2026 brought a £175 million HMRC transformation win. These milestones collectively support the idea that Quantexa is now operating as a broader data-and-AI platform spanning financial services, government,
    and customer intelligence. What remains thinner is hard disclosure on exact customer count, margin quality, and precise 2026 headcount.'
