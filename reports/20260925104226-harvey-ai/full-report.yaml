      Chronological milestone progression from corporate founding in 2022 through late 2026 growth rounds and enterprise
      agent expansion.
    data:
      items:
        - date: '2022'
          label: Founding Year and Seed Round
          details: >-
            Harvey was founded in 2022 by Winston Weinberg and Gabriel Pereyra; the company profile records a $5M seed
            round led by the OpenAI Startup Fund in November 2022.
          tone: positive
        - date: '2023-04-26'
          label: Series A Financing
          details: >-
            Harvey secures $21M in Series A funding led by Sequoia Capital to build domain-specific AI workflows for
            major global law firms.
          tone: positive
        - date: '2023-12-19'
          label: Series B Growth
          details: >-
            Company raises $80M Series B at a $715M post-money valuation led by Kleiner Perkins and Elad Gil, onboarding
            Allen & Overy and PwC.
          tone: positive
        - date: '2024-07-23'
          label: Series C Unicorn Milestone
          details: Harvey attains unicorn status with a $100M Series C round at a $1.5B valuation led by GV (Google Ventures).
          tone: positive
        - date: '2025-06-15'
          label: Series E Expansion
          details: >-
            Company raises $300M at a $5.0B post-money valuation co-led by Kleiner Perkins and Coatue, launching custom
            legal workflow agents.
          tone: positive
        - date: '2025-12-20'
          label: Series F Valuation Step-Up
          details: >-
            Harvey completes $160M Series F led by Andreessen Horowitz at an $8.0B valuation, crossing $195M in
            estimated ARR.
          tone: positive
        - date: '2026-01-15'
          label: Hexus Acquisition & Global Footprint
