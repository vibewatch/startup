  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Workflows, and Spend Definition
        blocks:
          - type: paragraph
            body: >-
              The addressable market for legal artificial intelligence occupies a strategic subset of the broader $600
              billion global legal services industry. Historically, corporate legal departments and large law firms
              dedicated roughly 30% to 40% of junior associate and paralegal hours to repetitive, document-intensive
              tasks such as contract due diligence, regulatory review, and routine drafting. Harvey established its core
              market footprint by automating these high-volume transactional workflows rather than chasing consumer
              legal tech or generic conversational tools. By focusing strictly on enterprise-grade security and
              Microsoft Azure infrastructure, Harvey captured substantial mindshare across Tier-1 corporate practices.
              However, the market boundary remains sharply delineated between corporate transactional workflows and
              courtroom litigation. While transactional work tolerates iterative refinement, litigation demands strict
              element-by-element evidentiary mapping and zero-hallucination guarantees under court scrutiny.
              Consequently, Harvey's current market boundary centers heavily on corporate contracting, M&A due
              diligence, and institutional compliance, leaving specialized dispute workflows as an adjacent,
              high-friction frontier.
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM012
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM012
      - number: '2.2'
        title: TAM, SAM, and Evidence-Constrained Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              Sizing the market for Harvey requires disaggregating macro legal expenditure from actionable enterprise
              software budgets. While total global legal spend stands at approximately $600 billion, specialized
              enterprise legal software represents a narrower $15 billion addressable market. Within this software
              universe, the emergence of generative AI and autonomous workflow agents has established a rapidly
              expanding serviceable available market (SAM) estimated between $1.2 billion and $1.5 billion across
              top-tier law firms and Global 2000 legal departments. Harvey's serviceable obtainable market (SOM)
              currently centers on the largest 200 law firms and major multinational legal teams, where third-party
              evidence estimated approximately $190 million in ARR in January 2026. The March 2026 $11 billion valuation
              divided by that January estimate yields a historical ratio of approximately 57.9x. The later September
              $15.5 billion valuation requires an updated ARR denominator and must not be described using the March
              ratio. Sustaining this valuation trajectory requires converting initial seat deployments into firm-wide
              operating standards while defending against bundled incumbent solutions.
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM006
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM006
              - CM014
      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Trajectory
        blocks:
          - type: paragraph
            body: >-
              Harvey's go-to-market motion navigates a bifurcated customer landscape divided between global law firm
              partnerships and corporate general counsel. In law firms, economic purchasing authority rests with
              executive committees, managing partners, and practice group heads who evaluate technology investments
              against billable-hour realization and client competitive pressures. Conversely, the everyday users are
              associates, counsel, and legal engineers whose productivity gains drive seat expansion. In corporate
              enterprises, procurement is governed by Chief Legal Officers and Legal Operations directors managing fixed
              departmental G&A budgets under strict outside-counsel cost reduction mandates. Adoption paths differ
              markedly across firm tiers: while AmLaw 100 firms absorb six-figure enterprise contracts to retain marquee
              corporate clients, mid-sized and boutique firms face significant budgetary hurdles. These smaller
              organizations frequently encounter pricing friction with Harvey and gravitate toward integrated practice
              suites like Clio, which embed research intelligence directly into standard matter management workflows
              without dedicated enterprise engineering overhead.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM011
      - number: '2.4'
        title: Structural Growth Drivers, Regulatory Hurdles, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Industry expansion in legal AI is propelled by powerful economic incentives: enterprise buyers are eager
              to substitute expensive associate billable hours with scalable AI workflows that save an estimated 25+
              hours monthly per professional. Nevertheless, several critical regulatory and technical headwinds govern
              the pace of institutional adoption. Chief among these is professional liability: bar associations across
              the US, UK, and EU have issued stringent rules mandating lawyer supervision and competence, explicitly
              holding licensed attorneys accountable for algorithmic work product. Furthermore, documented court cases
              involving AI hallucinations have exceeded 700 worldwide, resulting in formal judicial sanctions and
              heightened evidentiary scrutiny under Rule 11. In litigation contexts, where lawyers must link case facts
              to statutory causes of action, generic LLM summarization introduces intolerable malpractice risks. From a
              diligence perspective, critical unknowns remain regarding Harvey's cohort net revenue retention and
              multi-year contract renewals, which are necessary to confirm whether its $190 million ARR represents
              durable enterprise lock-in or pilot-stage expansion.
            claimRefs:
              - CM004
              - CM009
              - CM010
              - CM011
              - CM012
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Premium Dependent on Workflow Expansion
            body: >-
              The March 2026 $11B valuation against the January 2026 $190M ARR estimate produced a historical
              valuation-to-ARR ratio of approximately 57.9x. The later $15.5B valuation cannot use that ratio without an
              updated ARR denominator, reinforcing the need for current financial evidence.
            calloutType: risk
            claimRefs:
