  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Architecture and Core Workflow Modules
        blocks:
          - type: paragraph
            body: >-
              Harvey AI functions as an enterprise AI platform specifically engineered for law firms, corporate legal
              departments, and professional services organizations. Rather than deploying horizontal foundation models
              with generic prompt engineering, Harvey provides a purpose-built workspace organized around four primary
              product modules: Harvey Assistant, Harvey Vault, Harvey Workflows, and Harvey Knowledge. Harvey Assistant
              acts as a conversational co-pilot for legal research, initial drafting, and analytical summarization,
              operating directly within practicing attorneys' primary environments via dedicated Microsoft Word and
              Outlook add-ins. Harvey Vault provides high-capacity, multi-document ingestion and structured extraction,
              accommodating up to 100,000 documents per vault with automated OCR and key-clause tagging. Together with
              Harvey Workflows, which standardizes repeatable attorney tasks through Playbooks and thread-based Review
              Tables, the platform addresses high-friction document analysis and transactional due diligence across
              major global legal institutions.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
      - number: '5.2'
        title: Legal Practice Workflows and Use-Case Automation
        blocks:
          - type: paragraph
            body: >-
              In customer practice, Harvey transforms four core legal workflows: complex M&A due diligence, primary
              legal research, transactional document drafting, and ongoing regulatory compliance monitoring. In
              transactional matters, deal teams leverage Harvey Review Tables to ingest hundreds of contracts from
              virtual data rooms, extracting change-of-control triggers, indemnification provisions, and non-compete
              covenants into structured comparison matrices in hours rather than days. For primary research, Harvey
              translates plain-English factual inquiries into structured citations across more than 500 authoritative
              legal databases, including LexisNexis, EUR-Lex, and SEC EDGAR filings. However, the platform operates
              under a strict human-in-the-loop requirement: professional responsibility rules and bar guidelines dictate
              that AI-generated citations and draft memoranda cannot substitute for licensed attorney judgment.
              Furthermore, platform access remains restricted to custom enterprise contracts, with unspecified primary
              legal database synchronization intervals and hard document caps per vault.
            claimRefs:
              - CE002
              - CE003
              - CE005
