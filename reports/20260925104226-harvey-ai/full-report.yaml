              is neither a year-over-year rate nor a completed first-half-period comparison. Harvey separately reports
              2,400+ organizations, 200,000+ professionals, and adoption by at least 80% of the Am Law 100. Audited GAAP
              revenue, comparable year-earlier ARR, churn, and cohort NDR remain unavailable, so the observed milestone
              sequence cannot establish revenue growth YoY.
