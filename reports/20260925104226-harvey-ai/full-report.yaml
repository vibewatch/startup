      - number: '4.3'
        title: Cost Structure and Gross Margin Disclosure Gaps
        blocks:
          - type: paragraph
            body: >-
              No reviewed source discloses Harvey's gross margin, cost of revenue, model-inference expense, cloud
              expense, or operating-expense mix. Independent analysis does identify dependence on third-party frontier
              models as a qualitative defensibility and pricing risk, while Harvey's product architecture uses
              customized and task-specific models. That dependency may create variable inference-cost exposure, but the
