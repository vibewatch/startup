chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Leadership Dyad
        blocks:
          - type: paragraph
            body: >-
              Harvey AI Corporation was established in 2022 as a Delaware C-corporation headquartered in San Francisco,
              California. Winston Weinberg is identified in Harvey's March 2026 funding announcement as CEO and
              co-founder. Gabriel Pereyra is identified as the other co-founder by the chapter's independent
              company-profile source, but the admissible evidence assigned to this chapter does not establish his
              current executive title or either founder's prior employers. Harvey develops domain-specific products for
              legal and knowledge-intensive professional services, spanning contract analysis, due diligence,
              compliance, litigation, and repeatable workflow agents. Leadership diligence should therefore rely on the
              verified founder identities and Weinberg's stated CEO role while treating other title and biography
              details as unresolved.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
      - number: '1.2'
        title: Capitalization History and Strategic Governance
        blocks:
          - type: paragraph
            body: >-
              Since its inception in 2022, Harvey has raised more than $1 billion across institutional venture rounds.
              The company-profile evidence records a $5 million seed round led by the OpenAI Startup Fund in November
              2022, while Harvey identifies Sequoia Capital, Kleiner Perkins, GV, Coatue, and Andreessen Horowitz among
              its backers. On March 25, 2026, Harvey announced a $200 million financing co-led by GIC and Sequoia
              Capital at an $11 billion valuation. An independent June 2026 analysis compared that March valuation with
              a January 2026 estimate of roughly $190 million ARR, producing a historical valuation-to-ARR ratio of
              approximately 58x. That dated comparison is useful evidence of valuation risk but should not be presented
              as Harvey's current entry multiple.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO008
      - number: '1.3'
        title: Operating Scale and Financial Verification
        blocks:
          - type: paragraph
            body: >-
              Harvey has demonstrated rapid commercial adoption, establishing flagship partnerships across elite global
              law firms that subsequently served as reference accounts for broader market penetration. In March 2026,
              Harvey reported more than 100,000 lawyers across 1,300 organizations, including a majority of the AmLaw
              100. As of September 25, 2026, Harvey's website displayed more than 2,400 organizations, more than 200,000
              professionals, and 75+ AmLaw 100 firms. Third-party benchmarks estimate ARR at approximately $190 million
              in January 2026 and approximately $350 million by July 2026. Harvey remains private without audited income
              statements, certified gross-margin disclosures, or public customer-retention cohorts. One independent
              profile reports 860+ employees for 2026 and separately labels 1,261 as a Q1 2026 peak estimate, so neither
              figure should be treated as a verified current headcount.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO001
            claimRefs:
              - CO006
              - CO007
              - CO010
              - CO011
              - CO012
      - number: '1.4'
        title: Platform Milestones and Professional Regulatory Constraints
        blocks:
          - type: paragraph
            body: >-
              Harvey's product and corporate trajectory reflects a deliberate evolution from domain-specific
              conversational assistants toward autonomous multi-step legal agents. In early 2026, the company completed
              the strategic acquisition of demo automation platform Hexus, integrating its technical team to establish
              an engineering facility in Bangalore while scaling to over 25,000 active custom agents operating across
              corporate clients. Concurrently, judicial bodies and bar associations across the United States and Europe
              have intensified professional conduct guidance regarding generative artificial intelligence between 2023
              and 2026. These regulatory standards mandate strict attorney competence, rigorous confidentiality
              safeguards, and non-delegable duties of human supervision over machine-generated work product. Harvey's
              long-term sustainability hinges on enabling attorneys to satisfy these ethical and supervisory obligations
              without degrading efficiency.
            claimRefs:
              - CO005
              - CO006
              - CO014
              - CO015
