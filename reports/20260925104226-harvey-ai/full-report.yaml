      - number: '5.3'
        title: Technical Architecture, Integrations, and Model Dependencies
        blocks:
          - type: paragraph
            body: >-
              Harvey's technical architecture is structured as a multi-tier operating system that decouples user
              interfaces from underlying generative model providers. At the foundational inference layer, Harvey
              orchestrates requests across external foundation models—including OpenAI, Anthropic Claude, Mistral, and
              xAI architectures—routing tasks dynamically based on reasoning depth and prompt complexity. The platform's
              proprietary value concentrates in its middle-tier retrieval and grounding pipeline, which synchronizes
              firm-specific templates from enterprise document management systems like iManage, SharePoint, and Google
              Drive with authoritative statutory and case law corpora. To measure agentic reasoning across long-horizon
              legal tasks, Harvey open-sourced its Legal Agent Benchmark (LAB) in May 2026, establishing 1,250
              multi-step client matter scenarios across 24 legal practice areas. Because the platform relies on
              commercial foundation models rather than proprietary frontier weights, its technical defensibility depends
              on its retrieval accuracy, workflow connectors, and domain-specific evaluation harness.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
