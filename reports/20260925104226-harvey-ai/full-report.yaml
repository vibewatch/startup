            body: >-
              Harvey's commercialization began with highly customized deployments for large law firms. In May 2024, the
              founders said they planned to leave early access during the third quarter, introduce more affordable
              versions for firms of different sizes, and offer case-law products, Vault, and discounted bundles. The
