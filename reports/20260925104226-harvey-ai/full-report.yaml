  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Six-tier architectural stack illustrating Harvey AI's client interaction surfaces, workflow orchestration,
      document ingestion, legal knowledge grounding, multi-model inference, and enterprise governance.
    approximationNotes: >-
      Architectural layers reflect published product capabilities, technical integration documentation, and third-party
      IT architecture reviews as of 2026-09.
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE006
      - CE007
      - CE009
      - CE010
      - CE011
    data:
      layers:
        - label: 'Tier 1: Client Application & Add-In Surfaces'
          detail: >-
            Native Microsoft Word add-in, Microsoft Outlook add-in, browser-based web application, and mobile
            applications (iOS/Android) for in-workflow attorney interaction.
        - label: 'Tier 2: Workflow Orchestration & Agent Runtime'
          detail: >-
            No-code Workflow Agent builder, natural-language automation, thread-based Review Tables, and
            firm-standardized Playbook templates.
        - label: 'Tier 3: Document Processing & Vault Storage'
          detail: >-
            Secure document vault supporting up to 100,000 files per vault, automated OCR, bulk key-term extraction, and
            structured multi-document comparisons.
        - label: 'Tier 4: Enterprise Knowledge & DMS Connectors'
          detail: >-
            Direct enterprise document management system integrations (iManage, SharePoint, Google Drive) and 500+
            curated legal databases (LexisNexis, EUR-Lex, EDGAR).
        - label: 'Tier 5: Multi-Model Inference & Evaluation Engine'
          detail: >-
            Dynamic request routing across commercial foundation models (OpenAI, Anthropic Claude, Mistral, xAI)
            benchmarked against the open-source Legal Agent Benchmark (LAB).
        - label: 'Tier 6: Enterprise Security & Governance Boundary'
          detail: >-
            SOC 2 Type II and ISO 27001 certified security perimeter, regional data residency (US, EU, AU), SAML SSO,
            and contractual zero-training guarantees on client data.
  - id: FU001
    title: Customer Journey Map
    type: journey-map
    summary: >-
      Multi-stage expansion loop showing how legal organizations progress from specialized practice pilots to
      wall-to-wall enterprise deployments.
    claimRefs:
      - CU009
      - CU010
      - CU014
    data:
      items:
        - label: 'Stage 1: Initial Evaluation'
          actor: Practice Group Innovation Leads & Managing Partners
          touchpoints:
            - Security and compliance review
            - NDA and pilot scoping
            - Restricted Vault sandbox testing
          driver: High billable-hour overhead on transactional due diligence and contract review
        - label: 'Stage 2: Targeted Pilot'
          actor: M&A and Transactional Associate Cohorts
          touchpoints:
            - Harvey for Word integration
            - Precedent-grounded clause drafting
            - Vault bulk document analysis
          driver: Immediate 25+ hours monthly time savings on repetitive agreement review
        - label: 'Stage 3: Practice Group Rollout'
          actor: Full Transactional & Litigation Practice Groups
          touchpoints:
            - Custom Workflow Agent creation
            - LexisNexis case law grounding
            - Team-level shared spaces
          driver: Standardization of institutional precedent across matter teams
        - label: 'Stage 4: Cross-Practice Expansion'
          actor: Firm Executive Committee & IT Leadership
          touchpoints:
            - DMS integration with iManage and NetDocuments
            - Enterprise billing agreements
            - Centralized admin governance
          driver: Firm-wide demand following proven associate productivity and partner advocacy
        - label: 'Stage 5: In-House Client Integration'
          actor: Corporate Legal Operations & General Counsel
          touchpoints:
            - First-pass supplier contract triage
            - Shared Spaces with outside counsel
            - Custom playbook enforcement
          driver: Need for rapid business contract velocity without increasing legal headcount
        - label: 'Stage 6: Institutional Standardization'
          actor: Global Managing Partners & C-Suite Executives
          touchpoints:
            - Autonomous workflow orchestration
            - Multi-practice agent suites
            - Enterprise contracts; duration undisclosed
          driver: Embedding Harvey as the default AI operating system across all legal matters
