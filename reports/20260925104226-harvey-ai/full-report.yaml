      - number: '4.4'
        title: Traction Trajectory and Financial Benchmarking
        blocks:
          - type: paragraph
            body: >-
              Third-party tracking places Harvey at an estimated $5M ARR in 2023, $50M at the end of 2024, $100M in
              August 2025, $195M at the end of 2025, and approximately $350M by July 2026. The change from end-2025 to
