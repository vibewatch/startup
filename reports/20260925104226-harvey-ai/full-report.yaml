              - CE006
              - CE007
              - CE009
              - CE010
              - CE011
      - number: '5.4'
        title: Differentiation, Enterprise Security, and Trust Controls
        blocks:
          - type: paragraph
            body: >-
              Harvey's competitive differentiation rests on three pillars: deep vertical integration with legal document
              management systems, an extensive proprietary legal knowledge index, and an enterprise compliance posture
              designed for highly confidential client matters. Operating in a domain governed by strict confidentiality
              and evidentiary privilege, Harvey maintains comprehensive SOC 2 Type II, ISO 27001, GDPR, and CCPA
              certifications, alongside regional data residency options across the United States, Europe, and Australia.
              Most critically, Harvey contractually guarantees that client matter documents, prompts, and extracted
              metadata are never used to train or fine-tune public foundation models by default. While horizontal AI
              assistants offer lower pricing and broader general reasoning, Harvey's native DMS integrations,
              contractual zero-training guarantees, and citable legal database integrations create significant switching
              costs and defensibility across AmLaw 100 law firms and Fortune 500 corporate legal departments.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Deep Workflow Grounding in Enterprise Legal Systems
            body: >-
              Harvey's primary technical advantage stems from deep integration into existing legal software
              stacks—integrating iManage, SharePoint, Google Drive, Microsoft Word, and 500+ primary legal databases.
              This vertical grounding and strict zero-training compliance posture create meaningful switching costs
              compared to horizontal foundation models.
            calloutType: strength
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE006
              - CE011
              - CE012
          - type: callout
            title: Frontier Foundation Model Dependency
            body: >-
              Because Harvey orchestrates commercial third-party foundation models (OpenAI, Anthropic Claude, Mistral)
              rather than training proprietary frontier weights, its technical moat relies on workflow orchestration,
              custom evaluation benchmarks, and database connectors. Rapid improvements in native tool use by base model
              providers pose a persistent margin and defensibility risk.
            calloutType: risk
            claimRefs:
              - CE009
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Profiles
        blocks:
          - type: paragraph
            body: >-
              Harvey organizes its commercial go-to-market and product capabilities around four primary customer
              segments: elite AmLaw 100 and global law firms, mid-sized and boutique regional practices, corporate
              in-house legal departments, and multi-disciplinary professional services firms. Within law firms, the
              primary economic buyer is typically the firm managing partner, executive committee, or innovation steering
              group, while daily active users comprise transactional and litigation associates, counsel, and paralegals.
              In contrast, corporate in-house adoption is spearheaded by general counsel and legal operations directors
              aiming to control outside legal spend, triage high-volume supplier agreements, and streamline corporate
              compliance. Professional services organizations, most visibly global accounting and deal advisory
              networks, deploy the platform across cross-border tax, transaction structuring, and audit diligence
              practices. Commercial arrangements combine seat-based licensing tied to fee-earning headcount with
              platform-wide enterprise access agreements for specialized modules such as Vault and custom Workflow
              Agents.
            claimRefs:
              - CU001
              - CU003
              - CU007
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU007
      - number: '6.2'
        title: Adoption Trajectory and Scale Dynamics
        blocks:
          - type: paragraph
            body: >-
              Public snapshots show substantial adoption, but their dates and population definitions are not fully
              comparable. A third-party company profile reports 100,000+ lawyers, while Harvey's use-case article
              reports more than 142,000 lawyers; neither reviewed excerpt establishes the observation date needed to
              treat those figures as a cohort-consistent time series. Harvey's current homepage, accessed on September
              25, 2026, displays 200,000+ professionals, 2,400+ legal organizations, and 75+ AmLaw 100 firms. "Lawyers"
              and "professionals" may cover different populations, and the homepage does not define the activity
              threshold. Harvey also reports a 92% monthly adoption rate, but the qualifying usage denominator remains
              undisclosed. Separately, Clinkbill estimates that ARR reached roughly $350 million by July 2026, citing
              The Information and Sacra; this is a third-party estimate rather than audited revenue or a company filing.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU013
              - CU015
              - CU016
          - type: table
            tableRef: TU002
            claimRefs:
