company:
  name: Harvey AI
chapter:
  number: 6
  title: Customers
  summary: Harvey has established deep enterprise market penetration across more than 2,400 legal organizations, 200,000 legal professionals, and over 75 of the AmLaw 100. Growth is propelled by seat-based and enterprise licensing across elite law firms and in-house corporate legal teams, though the March 2026 financing price was approximately 57.9x the January 2026 ARR estimate, magnifying sensitivity to seat churn and long-term model commoditization.
sections:
- id: customer-segmentation
  title: Customer Base Segmentation and Buyer Profiles
  body: 'Harvey organizes its commercial go-to-market and product capabilities around four primary customer segments: elite AmLaw 100 and global law firms, mid-sized and boutique regional practices, corporate in-house legal departments, and multi-disciplinary professional services firms. Within law firms, the primary economic buyer is typically the firm managing partner, executive committee, or innovation steering group, while daily active users comprise transactional and litigation associates, counsel, and paralegals. In contrast, corporate in-house adoption is spearheaded by general counsel and legal operations directors aiming to control outside legal spend, triage high-volume supplier agreements, and streamline corporate compliance. Professional services organizations, most visibly global accounting and deal advisory networks, deploy the platform across cross-border tax, transaction structuring, and audit diligence practices. Commercial arrangements combine seat-based licensing tied
    to fee-earning headcount with platform-wide enterprise access agreements for specialized modules such as Vault and custom Workflow Agents.'
  claimRefs:
  - CU001
  - CU003
  - CU007
  tableRefs:
  - TU001
- id: adoption-trajectory
  title: Adoption Trajectory and Scale Dynamics
  body: 'Public snapshots show substantial adoption, but their dates and population definitions are not fully comparable. A third-party company profile reports 100,000+ lawyers, while Harvey''s use-case article reports more than 142,000 lawyers; neither reviewed excerpt establishes the observation date needed to treat those figures as a cohort-consistent time series. Harvey''s current homepage, accessed on September 25, 2026, displays 200,000+ professionals, 2,400+ legal organizations, and 75+ AmLaw 100 firms. "Lawyers" and "professionals" may cover different populations, and the homepage does not define the activity threshold. Harvey also reports a 92% monthly adoption rate, but the qualifying usage denominator remains undisclosed. Separately, Clinkbill estimates that ARR reached roughly $350 million by July 2026, citing The Information and Sacra; this is a third-party estimate rather than audited revenue or a company filing.'
  claimRefs:
  - CU002
  - CU003
  - CU004
  - CU013
  - CU015
  - CU016
  tableRefs:
  - TU002
- id: named-customer-proof
  title: Company-Reported Named Use Cases
  body: Harvey's public references provide a sample of company-reported named use cases, not independent verification of customer contracts, rollout scope, or business outcomes. Harvey's use-case article says GSK Stockmann co-designed an end-to-end due-diligence workflow and describes PwC's deal team in live M&A engagements, without establishing firm-wide deployment or quantified impact for either organization. The same article says HubSpot's Legal Operations team selected Harvey for a first-pass contract-review pattern covering NDAs, supplier agreements, customer contracts, and partner agreements; it does not quantify sales-cycle acceleration, outside-counsel savings, or rollout size. Repsol reported 96% adoption across its legal department, but the reviewed excerpt does not independently verify that figure or disclose cost outcomes. The Glean-hosted interview is vendor-hosted management commentary about Harvey's own governance practices, not customer-outcome verification.
  claimRefs:
  - CU005
  - CU006
  - CU008
  tableRefs:
  - TU003
- id: expansion-retention-risks
  title: Expansion Loops, Retention Durability, and Concentration Risks
  body: Harvey's expansion motion relies on a classic land-and-expand dynamic reinforced by institutional workflow codification. Accounts frequently initiate access through a high-pressure practice group, such as public company M&A or securities litigation, where manual due diligence creates immediate operational bottlenecks. As users build reusable custom Workflow Agents—with over 25,000 agents reported across 500 practice groups—firm-specific drafting templates and institutional precedent may become embedded in the platform and raise switching costs. Significant strategic risks remain. The historical March 2026 financing price of $11 billion was approximately 57.9x the January 2026 ARR estimate of $190 million; this was a valuation-to-ARR ratio, not recognized revenue and not a current trading multiple. Harvey also depends on upstream frontier base models from third-party providers. That dependence creates commoditization and pricing risk, but it is distinct from Harvey's post-training, workflow, integration, and application-level intellectual property, whose scope the reviewed evidence does not establish.
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  - CU014
  figureRefs:
  - FU001
