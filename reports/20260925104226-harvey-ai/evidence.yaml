evidenceGaps:
  - type: missing-source
    severity: material
    topic: financial-transparency
    missingEvidence: Audited financial statements confirming revenue, gross margins, net burn rate, and contract-level net retention.
    whyItMatters: >-
      The January and July 2026 ARR figures are third-party estimates, while the approximately 58x ratio compares the
      March 2026 valuation with the January 2026 denominator and is not a current multiple.
    diligencePath: >-
      Request confidential audited income statements and cohort billing schedules under non-disclosure agreement during
      private diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance-investors
    missingEvidence: >-
      Fully diluted capitalization table, preferred stock liquidation preferences, senior debt covenants, and formal
      board voting rights.
    whyItMatters: >-
      Public sources identify lead investors like GIC and Sequoia but obscure investor seniority, protective vetoes, and
      secondary liquidation terms.
    diligencePath: >-
      Review certificate of incorporation amendments and investor rights agreements filed in corporate Delaware records
      or request direct cap table access via Carta.
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
