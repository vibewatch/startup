company:
  name: Harvey AI
chapter:
  number: 8
  title: Valuation
  summary: Harvey AI commands a $15.5 billion valuation after rapid repricing across 2025 and 2026. The valuation chapter's assigned evidence supports approximately $190 million ARR as of January 2026, which yields an 81.6x valuation-to-ARR ratio when paired with the September mark; this is an older denominator, not a current revenue multiple. The historical March 2026 $11 billion mark was approximately 57.9x the same January estimate, while the late-2025 $8 billion mark was discussed at roughly 80x then-reported revenue. With no current ARR, cash, debt, or GAAP revenue in this chapter's pool, the risk-reward profile warrants a track recommendation.
sections:
- id: valuation-context
  title: Financing Trajectory and Valuation Context
  body: Harvey advanced through several private valuation marks across 2025 and 2026. Third-party sources place the company at $3.0 billion in early 2025, $5.0 billion in June 2025, and $8.0 billion by late 2025. In March 2026, Harvey completed a $200 million growth round co-led by GIC and Sequoia Capital at an $11.0 billion valuation. Most recently, Harvey announced a $550 million financing at a $15.5 billion valuation in September 2026, co-led by Diffusion and Lightspeed Venture Partners. Third-party tracking places cumulative funding above $1.5 billion, though the precise investor stack is not fully disclosed in the reviewed sources. The reviewed financing announcement does not disclose preference seniority, liquidation rights, ratchets, debt, or secondary mechanics, so their effect on common or earlier preferred equity cannot be quantified.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV014
  tableRefs:
  - TV001
- id: investment-thesis-antithesis
  title: Investment Thesis and Anti-Thesis
  body: The investment thesis for Harvey centers on category leadership across tier-one law firms and corporate legal departments, creating an enterprise operating layer for legal knowledge work. Harvey's current homepage reports 2,400+ legal organizations, 200,000+ professionals, and 75+ AmLaw 100 firms. Embedding into due diligence, contract review, regulatory research, and litigation workflows may create switching costs that generic AI tools struggle to match. The anti-thesis highlights valuation inflation, model dependency, and vulnerability to frontier-lab advances. Harvey's own guidance says legal AI augments rather than replaces lawyers and cannot assume responsibility for legal advice, so valuation downside diligence should not rely on full labor-replacement economics; this evidence does not quantify compliance costs or commercial pricing. At the $15.5 billion September valuation, the chapter can calculate 81.6x only by using the older January 2026 ARR estimate of $190 million; its assigned evidence does not provide a current ARR denominator. Historical 57.9x and 80x observations belong to the March 2026 and late-2025 marks, respectively, and must not be described as current.
  claimRefs:
  - CV006
  - CV007
  - CV008
  - CV009
  - CV015
  tableRefs:
  - TV002
- id: scenario-analysis
  title: Return Scenarios and Comparable Multiple Analysis
  body: Evaluating prospective investment returns requires modeling operational growth against underwriting assumptions for exit multiples across a three-year horizon. In January 2026, third-party benchmarks indicated Harvey generated approximately $190 million in annual recurring revenue, up from $100 million in August 2025. Under our base-case scenario, Harvey achieves $450 million in ARR over three years as enterprise legal adoption matures, but multiple contraction to an assumed 22x exit multiple results in a terminal valuation of approximately $9.9 billion. This outcome implies negative returns for investors entering at the prevailing $15.5 billion headline mark. In the bull-case scenario, rapid platform expansion into tax, finance, and corporate compliance propels ARR to $850 million, supporting a $25.5 billion terminal valuation at an assumed 30x multiple and delivering a 1.65x return. Under the bear case, growth decelerates to $250 million ARR amidst commoditization pressures and
    customer churn, driving the assumed exit multiple down to 12x and terminal value to $3.0 billion. Those 12x, 22x, and 30x figures are underwriting assumptions rather than verified public-comparable calculations.
  claimRefs:
  - CV004
  - CV005
  - CV010
  - CV012
  tableRefs:
  - TV003
- id: recommendation-diligence-framework
  title: Recommendation Stance and Diligence Framework
  body: Synthesizing market traction against valuation extremes leads to a clear recommendation of track with a high risk rating and stretched valuation stance. Harvey shows strong disclosed adoption in legal AI, but late-stage capital discipline still requires separating business quality from investment entry price. The 20x to 25x entry range is an analyst-assumed underwriting condition applied to a hypothetical $400 million ARR denominator, not a verified comparable-company statistic. Investors should defer new capital commitments until an entry price consistent with that assumption is available or management provides verifiable GAAP audits confirming gross margin durability and net revenue retention. Prior to capital deployment, institutional diligence must examine unverified financial schedules, customer retention cohorts, and compute gross margins, while evaluating liquidation preference overhang across prior financing tranches. A structural breakdown in thesis would occur if annual ARR growth falls below 50%, if frontier model providers release native legal agent workflows that disintermediate Harvey's core tools, or
    if down-round mechanics emerge.
  claimRefs:
  - CV005
  - CV011
  - CV012
  - CV013
  - CV015
  figureRefs:
  - FV001
