company:
  name: Harvey AI
chapter:
  number: 4
  title: Financials
  summary: Third-party estimates chart Harvey's ARR from $5M in 2023 to approximately $350M by July 2026, while Harvey announced a $550M financing at a $15.5B valuation in September 2026 and reported adoption by 80% of the Am Law 100. The available evidence does not disclose gross margin, net retention, CAC payback, contract values, current cash, net burn, or runway. The current valuation equates to approximately 44.3x the July 2026 ARR estimate and 81.6x the older January 2026 estimate; these are valuation-to-ARR ratios, not enterprise-value or GAAP-revenue multiples.
sections:
- id: revenue-streams-and-pricing-architecture
  title: Revenue Streams and Monetization Architecture
  body: 'The reviewed evidence describes four monetization mechanisms: licenses for legal professionals, enterprise agreements for firm-wide and in-house deployments, workflow products for specific practice areas, and account expansion into additional offices, practices, and geographies. A May 2024 founder interview also described custom models, commercial bundles, Vault, and standalone products jointly sold with PwC. The evidence does not disclose the percentage of ARR contributed by any mechanism, contract duration, realized pricing, or segment revenue. Accordingly, these mechanisms show how Harvey can monetize its platform but do not support a company-specific revenue mix or dollar allocation.'
  claimRefs:
  - CI005
  - CI006
  - CI007
  - CI012
  tableRefs:
  - TI001
- id: pricing-tiers-and-customer-segmentation
  title: Pricing Tiers and Enterprise Packaging Dynamics
  body: Harvey's commercialization began with highly customized deployments for large law firms. In May 2024, the founders said they planned to leave early access during the third quarter, introduce more affordable versions for firms of different sizes, and offer case-law products, Vault, and discounted bundles. The same interview said development of a complex custom project could exceed $5 million, but that is a development-cost example rather than a disclosed customer price or average contract value. The reviewed evidence does not verify 2026 list prices, per-seat rates, contract terms, seat counts, discounts, or realized ACVs. Pricing diligence must therefore distinguish the dated commercialization plan from current realized commercial terms.
  claimRefs:
  - CI005
  - CI006
  - CI013
  tableRefs:
  - TI002
- id: cost-structure-and-gross-margin-profile
  title: Cost Structure and Gross Margin Disclosure Gaps
  body: 'No reviewed source discloses Harvey''s gross margin, cost of revenue, model-inference expense, cloud expense, or operating-expense mix. Independent analysis does identify dependence on third-party frontier models as a qualitative defensibility and pricing risk, while Harvey''s product architecture uses customized and task-specific models. That dependency may create variable inference-cost exposure, but the available evidence cannot quantify its effect on gross margin or establish that model expense is Harvey''s largest cost item. The appropriate underwriting conclusion is a disclosure gap: obtain audited COGS schedules and vendor contracts before making any company-specific margin claim.'
  claimRefs:
  - CI008
  - CI010
  - CI012
  figureRefs:
  - FI001
- id: traction-metrics-and-unit-benchmarks
  title: Traction Trajectory and Financial Benchmarking
  body: Third-party tracking places Harvey at an estimated $5M ARR in 2023, $50M at the end of 2024, $100M in August 2025, $195M at the end of 2025, and approximately $350M by July 2026. The change from end-2025 to July 2026 is approximately 79.5%, calculated as ($350M / $195M - 1) × 100, over roughly seven months. It is neither a year-over-year rate nor a completed first-half-period comparison. Harvey separately reports 2,400+ organizations, 200,000+ professionals, and adoption by at least 80% of the Am Law 100. Audited GAAP revenue, comparable year-earlier ARR, churn, and cohort NDR remain unavailable, so the observed milestone sequence cannot establish revenue growth YoY.
  claimRefs:
  - CI002
  - CI003
  - CI004
  - CI014
  tableRefs:
  - TI003
- id: capital-adequacy-and-underwriting-verdict
  title: Capital Adequacy, Valuation Multiples, and Diligence Blockers
  body: Harvey announced a $550M financing at a $15.5B valuation co-led by Diffusion and Lightspeed in September 2026. That financing adds capital, but it does not disclose Harvey's post-close cash balance, prior spending, net burn, debt, or runway; cumulative financing cannot be treated as current liquidity. Dividing the equity valuation by the July 2026 third-party ARR estimate of approximately $350M yields 44.3x, while dividing it by the older January 2026 estimate of approximately $190M yields 81.6x. These are dated valuation-to-ARR ratios, not enterprise-value multiples or trailing GAAP-revenue multiples because debt, cash, and recognized revenue are unknown. Audited financials, retention cohorts, model-vendor pricing, and cash-flow evidence remain essential underwriting requirements.
  claimRefs:
  - CI001
  - CI009
  - CI010
  - CI011
  - CI014
