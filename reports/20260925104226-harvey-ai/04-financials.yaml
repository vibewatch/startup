  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited GAAP income statements, balance sheets, and cash flow statements detailing verified revenue, gross margin, and operating expenses.
    whyItMatters: Current revenue disclosures rely on leaked milestones and third-party estimates; underwriting an investment at a $15.5B valuation requires verified revenue realization and gross margin data.
    diligencePath: Request audited GAAP financial statements and quarterly board reporting packages directly from Harvey management during confirmatory diligence.
    relatedQuestionRefs:
    - QI009
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: retention-and-churn
    missingEvidence: Cohort-level net dollar retention (NDR), gross dollar retention, and account-level logo churn segmented by law firm size and corporate in-house legal departments.
    whyItMatters: Without cohort retention data, investors cannot separate new-logo growth from durable account expansion or validate the recurring quality of estimated ARR.
    diligencePath: Obtain annual and quarterly cohort ARR retention schedules and expansion waterfall analyses from company management.
    relatedQuestionRefs:
    - QI009
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: minor
