chapter:
  number: 7
  title: Risks
  summary: Harvey faces malpractice exposure from incorrect or fabricated citations if law firms fail to enforce human verification. Public reviews describe Microsoft Azure and OpenAI in the stack, but the reviewed evidence does not establish Harvey's current provider allocation or exclusivity. Fast.io, a competing workspace vendor, reports pricing assumptions that imply a $288,000 illustrative annual commitment, but Harvey's official pricing is undisclosed and those terms are not independently verified.
sections:
- id: regulatory-ethics-malpractice-risks
  title: Regulatory, Ethics, and Malpractice Liability Risks
  body: The central risk facing law firms adopting Harvey AI is professional malpractice liability stemming from incorrect or fabricated citations and insufficient review. Under American Bar Association (ABA) Model Rule 1.1, attorneys maintain a non-delegable duty of technological competence, while Rule 1.6 mandates strict client confidentiality and Rules 5.1 and 5.3 require rigorous supervision of technical tools. Judicial precedents such as the 2023 Mata v. Avianca decision establish that courts sanction practicing counsel rather than software vendors when artificial intelligence generates fabricated legal precedents or inaccurate jurisdictional holdings. The Grow Law review warns qualitatively that Harvey may produce incorrect citations or fabricated case law. No independently evaluated Harvey-specific accuracy benchmark was inspected, so the report does not assign Harvey a hallucination rate. Defensible adoption requires formal written AI governance policies, verification against primary sources, and documented human review before any deliverable reaches a client or tribunal.
  claimRefs:
  - CR002
  - CR003
  - CR007
  - CR008
  tableRefs:
  - TR001
- id: operational-scalability-vector-ingestion
  title: Operational Scalability, Vector Ingestion, and Reliability Risks
  body: As Harvey has shifted from an ad hoc drafting assistant into a primary enterprise system of record, operational bottlenecks have migrated into document processing and retrieval infrastructure. Across 2025 and 2026, Harvey's processing volume surged 26-fold from 0.94 million to 24.8 million documents per week, representing 56 terabytes of customer data across complex formats including scanned PDFs, data-room exports, and litigation eDiscovery archives. Under this bursty enterprise ingestion load, document processing ceases to operate as a single unified pipeline and fragments across distinct failure modes. Initial format extraction is bottlenecked by optical character recognition (OCR) complexity and document conversion hangs, while chunking and embedding are constrained by model throughput and CPU allocation. Crucially, vector store indexing encounters downstream write backpressure, blob read timeouts, and rate limits. Harvey mitigated catastrophic batch collapses by transitioning
    from legacy job queues to an internal Job Framework that provides activity timeouts, queue isolation, and durable state resumption. Additionally, introducing Unified Document Format (UDF) boundaries and replacing JSON serialization with Apache Arrow IPC reduced serialization memory overhead, while dual-writing and shadow reads supported live vector database migration without customer-facing downtime.
  claimRefs:
  - CR001
  - CR007
  - CR010
  tableRefs:
  - TR002
- id: partner-ecosystem-platform-concentration
  title: Partner Ecosystem and Platform Concentration Risks
  body: Counterparty and infrastructure dependency remains a material diligence risk, but the public evidence does not quantify current concentration. Grow Law and Fast.io reviews describe Microsoft Azure and OpenAI in Harvey's stack, while Value Add VC discusses upstream frontier-model dependence through OpenAI and Anthropic. Those dated descriptions do not establish Harvey's current provider allocation, exclusivity, portability, or commercial terms. Pricing evidence is similarly limited. Fast.io, which markets competing AI document workspaces, states that Harvey does not publish pricing and then reports a 20-seat minimum, a commonly cited $1,200 monthly seat price, onboarding ranges, and renewal uplifts from industry reporting or alleged contract data. Its $288,000 figure is only 20 seats multiplied by $1,200 and 12 months, not a verified universal annual floor. Grow Law separately gives a rough $1,000-$1,200 monthly estimate. These claims may indicate affordability pressure, but they do not prove that all smaller firms are excluded. Official pricing, vendor mix, concentration, and SLA terms remain diligence gaps.
  claimRefs:
  - CR004
  - CR005
  - CR009
  - CR012
  - CR013
  tableRefs:
  - TR003
- id: risk-heatmap-thesis-break-triggers
  title: Enterprise Risk Heatmap, Mitigation Architecture, and Thesis-Break Triggers
  body: 'Synthesizing legal, operational, and commercial risk factors demonstrates that Harvey''s primary vulnerabilities lie in upstream model and infrastructure dependency and user verification complacency rather than basic technical feasibility. Enterprise risk mitigation necessitates institutionalized training, such as the certifications provided by Harvey Academy, and formal quality control checklists that treat AI output as unverified associate drafting. For institutional investors and enterprise customers, monitoring risk trajectory requires establishing explicit thesis-break triggers tied to measurable operational and market milestones. An investment thesis break is triggered if: first, a major Am Law 100 customer incurs public judicial sanctions or court reprimands attributable to unflagged Harvey citation errors, demonstrating supervisory failure; second, third-party foundation model providers alter API commercial terms or access, degrading Harvey''s economics or capabilities; third, Thomson
    Reuters CoCounsel or LexisNexis bundles equivalent agentic capabilities at zero marginal cost, sparking enterprise seat contraction; or fourth, recurring vector ingestion bottlenecks result in multi-hour data-room outages during live M&A transaction deadlines. Continued diligence must focus on private vector database isolation metrics and formal SLA commitments.'
  claimRefs:
  - CR006
  - CR008
  - CR011
  - CR014
  figureRefs:
  - FR001
