      - number: '3.2'
        title: 竞品画像与核心功能矩阵
        blocks:
          - type: paragraph
            body: >-
              深入评估各家产品架构，可见其在功能深度、领域适配与平台延展性上分歧显著。Harvey AI 的核心壁垒在于 Assistant、Vault、Knowledge 与自动化 Workflows
              构成的整合套件，辅以深度集成的 Microsoft Word 与 Outlook 原生插件。其关键技术护城河在于：模型生成直接严密对齐律所私有知识库及权威法律法条，同时具备 SOC2 Type II 与 ISO
              27001 等企业级数据隔离安全认证。相比之下，Thomson Reuters CoCounsel 等老牌选手倚仗 Westlaw KeyCite 等独家先例判托体系与法学专著库构建排他壁垒；Robin AI
              等合同工具则专注于合同红线比对与谈判指引的精细化单点突破。通用大模型虽能提供常规起草辅助，但在法律管辖区精确度、企业治理合规栅栏及满足诉讼尽调归档要求的文档审查保险库等核心指标上，仍无法支撑严肃的生产级诉讼与交易尽调。
            claimRefs:
