      - number: '3.3'
        title: 包装形态、定价隐秘性与企业切换成本
        blocks:
          - type: paragraph
            body: >-
              法律 AI 行业的企业商务安排通常定价信息高度不透明、销售流程阻力较大，合同捆绑也较复杂。Harvey AI
              采用销售主导的年度企业许可模式，未公开分层价格，客户筛选流程较长，且往往设有较高的年度最低承诺，顶尖律所的最低金额常达六位数。传统软件巨头则反向布局，将生成式 AI
              作为现有多年期企业协议的增购附加模块，Thomson Reuters 与 LexisNexis 借此充分激活既有供应商主服务协议（MSA）的存量红利。尽管面临老牌巨头的围追堵截，Harvey
              在顶级律所中形成了较高的切换成本，这与其深度融入组织流程有关。数以万计的定制工作流智能体适配不同业务组；替换 Harvey 会涉及律师再培训、模板重构和行政流程中断。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
