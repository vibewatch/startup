          - type: paragraph
            body: >-
              Harvey AI 是面向律所、企业法务部门和专业服务机构的企业级 AI 平台。它不只是为通用基础模型编写提示词，而是提供由 Harvey Assistant、Harvey Vault、Harvey
              Workflows 和 Harvey Knowledge 组成的专用工作空间。Assistant 用于法律检索、初稿起草和分析摘要，并通过 Microsoft Word 与 Outlook
              插件嵌入律师的常用工具。Vault 支持多文档导入和结构化提取，每个库最多容纳 100,000 份文件，并提供 OCR 和核心条款标注。Workflows 通过 Playbooks 和线程式 Review
              Tables 将可重复的律师任务标准化；平台面向法律机构的复杂文档分析和交易尽调需求。
