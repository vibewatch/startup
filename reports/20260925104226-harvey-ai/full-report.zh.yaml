      - number: '2.3'
        title: 客户细分、预算归属与落地路径
        blocks:
          - type: paragraph
            body: >-
              Harvey 的商业化落地直面全球大型律所合伙体系与企业总法律顾问（General
              Counsel）两大截然不同的采购决策阵营。在律所内部，商业采购决策权握在执行委员会、管理合伙人以及业务群组负责人手中，他们评估技术投资的核心标准在于可计费工时变现率与同业竞争压力；日常实际用户则是初级律师、顾问律师及法律工程师，其生产力的实际提升直接带动席位增购。在企业端，采购由首席法律官与法务运营总监把关，他们在外部律所控费指标的严控下管理固定的部门管理费用预算。不同梯队机构的落地路径分化明显：AmLaw
              100 头部大所为保住标杆企业大客户，甘愿承担六位数的企业级大额采购；中型及精品所则面临切实的预算门槛，在 Harvey 的定价面前多有犹豫，往往更青睐 Clio
              等一体化实务套件，后者无需承担高昂的企业工程适配成本，即可将检索智能原生嵌合进常规办案流程。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
