              等企业文档管理系统（DMS）中的律所私有模板，与权威法规法条及判例先例库进行精准挂载校准。为评测智能体在复杂长链条法律场景中的推理能力，Harvey 于 2026 年 5 月开源了法律智能体基准（Legal
