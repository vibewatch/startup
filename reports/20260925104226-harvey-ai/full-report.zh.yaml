      - number: '5.2'
        title: 法律执事实践与高频场景自动化
        blocks:
          - type: paragraph
            body: >-
              客户使用 Harvey 改造四类核心法律工作：复杂并购尽调、一手法律资料检索、交易文书起草及持续的监管合规监测。交易团队用 Harvey Review Tables
              从虚拟数据室导入数百份合同，提取控制权变更触发条件、赔偿条款和竞业限制约定，整理成结构化对照矩阵，耗时由数天缩短至数小时。检索时，Harvey 将日常英语表述的事实问题转为结构化引文，覆盖
              LexisNexis、EUR-Lex、SEC EDGAR 申报资料等 500 多个权威法律数据库。平台必须保留严格的人工监督：职业责任规则和律师协会指引要求，AI
              生成的引文与备忘录草稿不能替代持证律师的判断。平台仍仅向签订定制企业合同的客户开放，一手法律数据库的同步间隔未披露，每个文档库也有文档数量硬上限。
