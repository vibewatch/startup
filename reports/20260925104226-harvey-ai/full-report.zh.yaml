              月的创始人访谈还提及定制模型、商业捆绑包、Vault 独立收费，以及与 PwC 联合销售的独立产品。证据未披露各项机制在 ARR 中的具体占比、合同平均账期、实际落地客单价或细分客户群收入。因此，上述机制勾勒出了
              Harvey 平台实现货币化的路径形态，但无法推导出品种明确的收入结构或具体的金额拆分。
