  - id: FV001
    title: 投资决策逻辑推导路径
    type: flow
    summary: 串联市场商业验证、估值溢价风险及尽调披露盲区的阶梯式分析框架，清晰推导给出观察（track）评级。
    data:
      nodes:
        - id: n1
          label: 业务规模与市场领先地位
          description: 覆盖 2,400+ 家机构、200,000+ 名专业人士，以及 75+ 家 AmLaw 100 顶尖大所
        - id: n2
          label: 现行估值合理性测算
          description: $15.5B 估值对标 2026 年 1 月较早的 $190M ARR 估计为 ~81.6x；最新分母尚不可得
        - id: n3
          label: 竞品夹击与模型商品化风险
          description: 前沿大模型能力商品化与传统厂商的产品打包
        - id: n4
          label: 关键财务信息披露盲区
          description: 未经审计的利润率、净烧钱速度及客户队列流失
        - id: n5
          label: 决策门槛审慎研判
          description: 现行标价是否提供充足的风险调整后收益空间？
        - id: n6
          label: 最终建议结论：观察（Track）
          description: 持续跟踪运营执行；在估值倍数出现实质性回调前暂缓注资
      edges:
        - from: n1
          to: n2
          label: 确证业务体量
        - from: n2
          to: n3
          label: 揭示倍数风险
        - from: n3
          to: n4
          label: 加剧前景不确定性
        - from: n4
          to: n5
          label: 构成尽调阻碍
        - from: n5
          to: n6
          label: 最终导向观察评级
    approximationNotes: 决策流图系统整合了多项定性与定量评估准则，为最终投资决策提供依据。
    claimRefs:
      - CV007
      - CV008
      - CV011
      - CV013
