  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、工作流与预算范畴
        blocks:
          - type: paragraph
            body: >-
              法律 AI 的目标市场是全球 $600B 法律服务行业中具有战略价值的一部分。以往，企业法务部门和大型律所将初级律师及律师助理约 30% 至 40%
              的工时用于合同尽调、监管审查和常规起草等重复、文档密集的工作。Harvey 选择自动化这些高频交易工作流，而非消费级法律科技或通用对话工具，由此建立核心市场。企业级安全能力和 Microsoft Azure
              基础设施帮助其赢得头部商事业务团队的关注。不过，商事交易与法庭诉讼的要求不同：交易工作允许反复修改，诉讼则要求在法院审查下逐项对应证据，并确保没有幻觉。因此，Harvey
              的核心市场仍是企业合同、并购尽调和机构合规；专业争议解决工作流属于相邻市场，进入阻力较大。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM012
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM012
      - number: '2.2'
        title: TAM、SAM 与受限证据下的测算视角
        blocks:
          - type: paragraph
            body: >-
              测算 Harvey 的市场空间，需要区分法律行业总开支和企业实际可支配的软件预算。全球法律支出约 $600B，专业企业法律软件的可触达市场则较窄，约为 $15B。生成式 AI
              与自主工作流智能体带动其中的可服务市场（SAM）快速扩大；顶级律所和 Global 2000 企业法务部门的规模估计为 $1.2B 至 $1.5B。Harvey 当前可获取的市场（SOM）集中在前 200
              大律所及大型跨国企业法务团队。第三方证据估计，其 2026 年 1 月 ARR 约为 $190M；用 2026 年 3 月的 $11B 估值相除，得到约 57.9x 的历史比例。9 月更晚的 $15.5B
              估值需要新的 ARR 分母，不能沿用 3 月的倍数。要支撑这条估值轨迹，Harvey 需要将初步席位部署转为全所操作标准，并抵御传统厂商捆绑方案的竞争。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM006
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
