      - number: '1.4'
        title: 平台里程碑与行业监管约束
        blocks:
          - type: paragraph
            body: >-
              Harvey 的产品与商业演进路径清晰：从特定领域的对话助手逐步迈向多步骤自主法律智能体。2026 年初，公司完成对演示自动化平台 Hexus
              的战略收购，整合其技术团队在班加罗尔建立工程研发中心，并在企业客户中铺开超 25,000 个活跃定制智能体。与此同时，美欧司法机构与律师协会在 2023 至 2026
              年间密集出台针对生成式人工智能的执业规范指引，严格要求律师具备专业胜任力、恪守保密红线，并对机器生成成果承担不可转授的人工监督职责。Harvey
              能否在不损耗作业效率的前提下协助律师履行上述伦理与合规义务，决定了其商业模式的长期韧性。
