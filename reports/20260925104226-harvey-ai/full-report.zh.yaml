    title: 公司概况
    sections:
      - number: '1.1'
        title: 实体架构与创始人分工
        blocks:
          - type: paragraph
            body: >-
              Harvey AI Corporation 于 2022 年在特拉华州注册成立为 C 类公司，总部位于加利福尼亚州旧金山。Harvey 2026 年 3 月的融资公告称 Winston Weinberg 为
              CEO 兼联合创始人。独立公司档案将 Gabriel Pereyra 列为另一位联合创始人，但本章可采信证据未说明其现任高管职务，也未确认两位创始人此前的雇主。Harvey
              面向法律及知识密集型专业服务开发垂直产品，覆盖合同分析、尽职调查、合规、诉讼和可复用工作流智能体。评估管理层时，应以已核实的创始人身份及 Weinberg 的 CEO 职务为依据；其他职务和履历仍待确认。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
      - number: '1.2'
        title: 股本沿革与战略治理
        blocks:
          - type: paragraph
            body: >-
              自 2022 年成立以来，Harvey 通过多轮机构风投累计筹资超过 $1B。公司资料显示 OpenAI Startup Fund 于 2022 年 11 月领投其 $5M 种子轮；Harvey 披露的资方还包括
              Sequoia Capital、Kleiner Perkins、GV、Coatue 和 Andreessen Horowitz。2026 年 3 月 25 日，Harvey 宣布完成由 GIC 与 Sequoia
              Capital 联合领投的 $200M 融资，投后估值达 $11B。2026 年 6 月的一份独立分析将该笔 3 月估值与 2026 年 1 月约 $190M 的 ARR 估计进行对比，得出约 58x
              的历史估值/ARR 比例。该静态对比揭示了当时的估值风险，但不可当作 Harvey 当前的入场估值倍数。
            claimRefs:
              - CO005
              - CO006
