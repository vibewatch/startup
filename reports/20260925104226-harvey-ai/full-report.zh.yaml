  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群细分与采购画像
        blocks:
          - type: paragraph
            body: >-
              Harvey 围绕四大核心客群组织其商业化拓展与产品矩阵：AmLaw 100
              头部及全球顶级大所、中型及区域精品所、企业内部法务部门，以及综合性专业服务机构。在律所内部，核心采购出资人通常是律所管理合伙人、执行委员会或创新领导小组，而日常高频用户由交易及诉讼业务组的资深律师、普通律师及助理构成。相比之下，企业法务端的落地由总法律顾问（General
              Counsel）及法务运营总监牵头，主旨在于削减外部律所咨询费、批量预审供应商合同并提升合规流转效率。在专业服务机构中，全球会计师事务所与并购顾问网络应用最为广泛，深度嵌入跨境税务分析、交易架构设计及审计底稿复核环节。其商业模式采用与创收执业人数绑定的席位费，叠加大客户访问特定模块（如
              Vault 和定制工作流智能体）的企业级年费框架。
            claimRefs:
              - CU001
