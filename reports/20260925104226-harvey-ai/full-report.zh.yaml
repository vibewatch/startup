    title: 客户落地与全所渗透全景动线图
    type: journey-map
    summary: 多阶段客户拓展生命周期，描绘法律机构如何从特定业务组轻量试点逐步演进为全所级深度标准化部署。
    claimRefs:
      - CU009
      - CU010
      - CU014
    data:
      items:
        - label: 第一阶段：早期技术评估
          actor: 业务群组创新负责人与律所管理合伙人
          touchpoints:
            - 安全与合规审查
            - 签署保密协议（NDA）并划定小范围试点边界
            - 在受限的 Vault 沙盒中测试
          driver: High billable-hour overhead on transactional due diligence and contract review
        - label: 第二阶段：聚焦核心场景试点
          actor: 并购组与商事交易业务骨干律师群
          touchpoints:
            - 部署 Harvey for Word 原生插件
            - 依据律所先例起草条款
            - 使用 Vault 批量分析文档
          driver: Immediate 25+ hours monthly time savings on repetitive agreement review
        - label: 第三阶段：业务群组横向铺开
          actor: 交易及诉讼业务组全员
          touchpoints:
            - 搭建业务组专有定制工作流智能体
            - 接入 LexisNexis 判例检索
            - 设立业务团队协同共享协作空间
          driver: Standardization of institutional precedent across matter teams
        - label: 第四阶段：跨业务拓展
          actor: 律所执行委员会与 IT 管理层
          touchpoints:
            - 打通 iManage 与 NetDocuments 等底层 DMS 系统
            - 企业计费协议
            - 集中式管理治理
          driver: Firm-wide demand following proven associate productivity and partner advocacy
        - label: 第五阶段：切入企业法务直连协同
          actor: 企业法务运营主管与总法律顾问
          touchpoints:
            - 批量承担企业供应商协议的首轮分流初审
            - 与外部律师共享空间
            - 使用定制 Playbook
          driver: Need for rapid business contract velocity without increasing legal headcount
        - label: 第六阶段：机构制度化标准成型
          actor: 全球管理合伙人与企业最高决策管理层
          touchpoints:
            - 自主工作流编排
            - 部署覆盖多专业领域的复合智能体集群
            - 企业合同；期限未披露
          driver: Embedding Harvey as the default AI operating system across all legal matters
