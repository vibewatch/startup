      - number: '3.4'
        title: 护城河韧性、模型商品化与颠覆风险
        blocks:
          - type: paragraph
            body: >-
              Harvey AI 的长期防御力，取决于应用层工作流编排、企业信任和工作流黏性能否跑赢基础模型厂商的垂直化。Harvey 没有自有基础模型，而是使用 OpenAI、Anthropic 和 Google 的商业
              API 并进行微调，因此仍会受到上游模型进步的影响。前沿模型厂商推出原生智能体工具、更长的推理上下文和专业插件，也会持续压缩通用基础模型与垂直法律应用之间的技术差异。企业客户越来越多地要求多供应商部署，或探索自有
              AI 工具；Harvey 需要持续证明工作流集成、合规水平和垂直场景 ROI，才能在模型商品化和传统厂商整合的压力下支撑企业软件溢价。
            claimRefs:
              - CP001
              - CP003
              - CP012
              - CP013
      - number: '3.5'
        title: 支撑图表
        blocks:
          - type: callout
            title: 底层基础模型商品化侵蚀风险
            body: Harvey 依赖 OpenAI 和 Anthropic 等第三方前沿基础模型，而非自有模型权重。随着模型厂商扩展原生工具调用与上下文能力，垂直应用层长期面临毛利率受压及功能被复制的风险。
