      - number: '2.4'
        title: 结构性增长动能、监管阻力与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              法律 AI 行业的快速扩张受到强劲经济动能的驱使：企业买方迫切希望借助可规模化的 AI 工作流替代昂贵的初级律师计费工时，据估算每位专业人员每月可借此节省 25
              小时以上。但行业落地的推进节奏依然受制于严苛的监管与技术阻力，首当其冲的便是执业责任风险：美、英、欧各律协相继颁布严格的专业胜任力与执业监管准则，明确执业律师须对算法生成的工作成果承担不可免除的法律责任。此外，全球法院记录在案的
              AI 虚构判例（幻觉）纠纷已超 700 起，引发正式司法惩戒并招致更严苛的《联邦民事诉讼规则》第 11
              条证据审查。在诉讼场景下，律师必须将案件事实与法定请求权基础严密锚定，通用大模型的概要归纳难免引入无法承受的执业疏忽风险。从尽调视角看，Harvey
              的留存队列净收入留存率（NDR）与多年期合同续约表现仍属未知，需获取这部分核心数据方能确认其 $190M 的 ARR 究竟代表着稳固的企业级壁垒，抑或仅停留在试点期的尝鲜式扩张。
            claimRefs:
              - CM004
              - CM009
              - CM010
              - CM011
              - CM012
