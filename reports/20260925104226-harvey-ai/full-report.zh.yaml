  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 法律 AI 竞争生态与技术路径分化
        blocks:
          - type: paragraph
            body: >-
              步入 2026 年，法律人工智能赛道已快速分化为四大核心阵营：风投支持的垂直领域初创公司、根基深厚的传统法律数据库巨头、聚焦细分工作流的单点工具方案，以及底层通用大模型厂商。Harvey AI 早期以 AmLaw
              100 律所及大型企业法务部门为突破口，成功夺得企业级桥头堡，但如今在各细分战线均面临激烈的正面抗衡。在垂直挑战者阵营中，发源于瑞典的 Legora
              展现出强劲的独角兽扩张势头，以数十亿美元估值连续融资，并迅速从欧洲腹地杀入北美大本营。与此同时，传统法律信息巨头 Thomson Reuters 和 LexisNexis 亦步步为营，分别依托 CoCounsel
              和 Lexis+ AI 将生成式能力直接植入核心工作流，稳固其软件基本盘。律所及企业买方并未盲目全盘替代现有系统，而是身处一个混合采购生态中，单点工具、自研工程模块与巨头现成的订阅全家桶彼此争夺有限的 IT
              预算。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
