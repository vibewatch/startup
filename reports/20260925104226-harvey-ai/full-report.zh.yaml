      - number: '1.3'
        title: 业务规模与财务核验
        blocks:
          - type: paragraph
            body: >-
              Harvey 商业化拓展迅速，先后拿下多家全球顶尖律所的标杆合作，并以此为示范效应撬动更广泛的市场渗透。2026 年 3 月，Harvey 披露其服务覆盖 1,300 家机构的超 10 万名律师，囊括 AmLaw
              100 律所的大多数。截至 2026 年 9 月 25 日，Harvey 官网展示其已进入 2,400 多家机构，服务超 20 万名专业人士，覆盖 75 家以上 AmLaw 100 律所。第三方基准估算其 ARR
              在 2026 年 1 月约为 $190M，到 2026 年 7 月增至约 $350M。Harvey 仍为非上市公司，未披露经审计利润表、官方核定毛利率或公开客户留存队列。一份独立档案记录其 2026 年员工数为
              860+ 人，另将 1,261 人标注为 2026 年一季度的峰值估计，两项数据均不能视作经核实的现时员工数。
