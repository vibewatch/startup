            title: AmLaw 100 顶级客户构筑深厚切换壁垒
            body: >-
              Harvey 已进入 75 家以上 AmLaw 100 律所，并部署了 25,000 个定制工作流智能体，带来显著的组织惯性；这可能缓解短期流失风险，但 Thomson Reuters 和 LexisNexis
              等传统厂商仍构成激烈竞争。
            calloutType: insight
            claimRefs:
              - CP003
