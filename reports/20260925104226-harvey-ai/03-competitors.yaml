  title: High Enterprise Switching Barriers in AmLaw 100
  body: Harvey's early penetration across more than 75 AmLaw 100 firms and 25,000 deployed custom workflow agents creates substantial organizational inertia, mitigating immediate churn risk despite intense incumbent competition from Thomson Reuters and LexisNexis.
