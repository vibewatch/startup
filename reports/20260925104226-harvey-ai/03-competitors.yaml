  title: Underlying Foundation Model Commoditization Risk
  body: Harvey relies on underlying frontier foundation models from OpenAI and Anthropic rather than proprietary weights. As model creators expand native tool use and context capabilities, vertical application layers face long-term gross margin pressure and risk feature replication.
