  data:
    layers:
    - label: 'Tier 1: Client Application & Add-In Surfaces'
      detail: Native Microsoft Word add-in, Microsoft Outlook add-in, browser-based web application, and mobile applications (iOS/Android) for in-workflow attorney interaction.
    - label: 'Tier 2: Workflow Orchestration & Agent Runtime'
      detail: No-code Workflow Agent builder, natural-language automation, thread-based Review Tables, and firm-standardized Playbook templates.
    - label: 'Tier 3: Document Processing & Vault Storage'
      detail: Secure document vault supporting up to 100,000 files per vault, automated OCR, bulk key-term extraction, and structured multi-document comparisons.
    - label: 'Tier 4: Enterprise Knowledge & DMS Connectors'
      detail: Direct enterprise document management system integrations (iManage, SharePoint, Google Drive) and 500+ curated legal databases (LexisNexis, EUR-Lex, EDGAR).
    - label: 'Tier 5: Multi-Model Inference & Evaluation Engine'
      detail: Dynamic request routing across commercial foundation models (OpenAI, Anthropic Claude, Mistral, xAI) benchmarked against the open-source Legal Agent Benchmark (LAB).
    - label: 'Tier 6: Enterprise Security & Governance Boundary'
      detail: SOC 2 Type II and ISO 27001 certified security perimeter, regional data residency (US, EU, AU), SAML SSO, and contractual zero-training guarantees on client data.
callouts:
- calloutType: strength
  title: Deep Workflow Grounding in Enterprise Legal Systems
  body: Harvey's primary technical advantage stems from deep integration into existing legal software stacks—integrating iManage, SharePoint, Google Drive, Microsoft Word, and 500+ primary legal databases. This vertical grounding and strict zero-training compliance posture create meaningful switching costs compared to horizontal foundation models.
  claimRefs:
  - CE001
  - CE004
  - CE005
  - CE006
  - CE011
  - CE012
- calloutType: risk
  title: Frontier Foundation Model Dependency
  body: Because Harvey orchestrates commercial third-party foundation models (OpenAI, Anthropic Claude, Mistral) rather than training proprietary frontier weights, its technical moat relies on workflow orchestration, custom evaluation benchmarks, and database connectors. Rapid improvements in native tool use by base model providers pose a persistent margin and defensibility risk.
  claimRefs:
  - CE009
  - CE013
