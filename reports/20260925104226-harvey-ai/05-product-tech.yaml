- id: TE002
  title: Workflow / use-case table
  columns:
  - User Job
  - Current / Baseline Workflow
  - Harvey AI Solution
  - Measurable Benefit
  - Technical Limitation
  rows:
  - - Contract Due Diligence
    - Manual associate review of hundreds of agreements in virtual data rooms
    - Vault bulk extraction, structured field comparison, and change-of-control provision identification
    - Reduces initial contract review cycle times by estimated 60-80% across high-volume sets
    - Requires mandatory licensed attorney verification to prevent missed jurisdictional carve-outs
  - - Primary Legal Research
    - Manual Boolean query formulation across legal search terminals
    - Natural-language query decomposition across 500+ databases with citable primary authority
    - Eliminates syntax overhead and surfaces relevant case law and statutory references rapidly
    - Index refresh cadence for newly released slip opinions and orders is not publicly disclosed
  - - Transactional Drafting
    - Adapting prior firm precedents and manually updating standard clauses
    - Microsoft Word add-in generating first drafts grounded in firm Playbooks and Vault files
    - Clears initial drafting blank-page bottleneck within minutes while preserving firm style
    - AI cannot evaluate client commercial risk tolerance or negotiate bespoke concessions
  - - Regulatory Compliance Monitoring
    - Manual periodic tracking of regulatory registers and administrative dockets
    - Custom workflow agents monitoring agency updates and surfacing scheduled summaries
    - Automates repetitive docket tracking and notifies compliance officers of statutory shifts
    - Automated alerts require human legal triage to distinguish material enforcement changes
  notes: Workflow comparisons and operational impact metrics synthesized from attorney practice guides, enterprise reviews, and benchmark matter evaluations as of 2026-09.
