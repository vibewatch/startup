chapter:
  number: 5
  title: Product & Technology
  summary: Harvey AI delivers a vertically integrated AI operating system for legal and professional services, combining document vault ingestion, workflow agent orchestration, and multi-model inference grounded in over 500 vetted legal databases. While the platform demonstrates category-leading enterprise adoption and rigorous compliance controls, it operates without a proprietary foundation model, relying on third-party commercial LLMs and remaining constrained by enterprise-only distribution.
sections:
- id: product-service-definition
  title: Product Architecture and Core Workflow Modules
  body: 'Harvey AI functions as an enterprise AI platform specifically engineered for law firms, corporate legal departments, and professional services organizations. Rather than deploying horizontal foundation models with generic prompt engineering, Harvey provides a purpose-built workspace organized around four primary product modules: Harvey Assistant, Harvey Vault, Harvey Workflows, and Harvey Knowledge. Harvey Assistant acts as a conversational co-pilot for legal research, initial drafting, and analytical summarization, operating directly within practicing attorneys'' primary environments via dedicated Microsoft Word and Outlook add-ins. Harvey Vault provides high-capacity, multi-document ingestion and structured extraction, accommodating up to 100,000 documents per vault with automated OCR and key-clause tagging. Together with Harvey Workflows, which standardizes repeatable attorney tasks through Playbooks and thread-based Review Tables, the platform addresses high-friction document
    analysis and transactional due diligence across major global legal institutions.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE014
  tableRefs:
  - TE001
- id: workflow-solutions-and-use-cases
  title: Legal Practice Workflows and Use-Case Automation
  body: 'In customer practice, Harvey transforms four core legal workflows: complex M&A due diligence, primary legal research, transactional document drafting, and ongoing regulatory compliance monitoring. In transactional matters, deal teams leverage Harvey Review Tables to ingest hundreds of contracts from virtual data rooms, extracting change-of-control triggers, indemnification provisions, and non-compete covenants into structured comparison matrices in hours rather than days. For primary research, Harvey translates plain-English factual inquiries into structured citations across more than 500 authoritative legal databases, including LexisNexis, EUR-Lex, and SEC EDGAR filings. However, the platform operates under a strict human-in-the-loop requirement: professional responsibility rules and bar guidelines dictate that AI-generated citations and draft memoranda cannot substitute for licensed attorney judgment. Furthermore, platform access remains restricted to custom enterprise contracts,
    with unspecified primary legal database synchronization intervals and hard document caps per vault.'
  claimRefs:
  - CE002
  - CE003
  - CE005
  - CE008
  - CE013
  tableRefs:
  - TE002
- id: technical-architecture-and-operating-model
  title: Technical Architecture, Integrations, and Model Dependencies
  body: Harvey's technical architecture is structured as a multi-tier operating system that decouples user interfaces from underlying generative model providers. At the foundational inference layer, Harvey orchestrates requests across external foundation models—including OpenAI, Anthropic Claude, Mistral, and xAI architectures—routing tasks dynamically based on reasoning depth and prompt complexity. The platform's proprietary value concentrates in its middle-tier retrieval and grounding pipeline, which synchronizes firm-specific templates from enterprise document management systems like iManage, SharePoint, and Google Drive with authoritative statutory and case law corpora. To measure agentic reasoning across long-horizon legal tasks, Harvey open-sourced its Legal Agent Benchmark (LAB) in May 2026, establishing 1,250 multi-step client matter scenarios across 24 legal practice areas. Because the platform relies on commercial foundation models rather than proprietary frontier weights, its
    technical defensibility depends on its retrieval accuracy, workflow connectors, and domain-specific evaluation harness.
  claimRefs:
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  - CE010
  tableRefs:
  - TE003
  figureRefs:
  - FE001
- id: differentiation-trust-and-governance
  title: Differentiation, Enterprise Security, and Trust Controls
  body: 'Harvey''s competitive differentiation rests on three pillars: deep vertical integration with legal document management systems, an extensive proprietary legal knowledge index, and an enterprise compliance posture designed for highly confidential client matters. Operating in a domain governed by strict confidentiality and evidentiary privilege, Harvey maintains comprehensive SOC 2 Type II, ISO 27001, GDPR, and CCPA certifications, alongside regional data residency options across the United States, Europe, and Australia. Most critically, Harvey contractually guarantees that client matter documents, prompts, and extracted metadata are never used to train or fine-tune public foundation models by default. While horizontal AI assistants offer lower pricing and broader general reasoning, Harvey''s native DMS integrations, contractual zero-training guarantees, and citable legal database integrations create significant switching costs and defensibility across AmLaw 100 law firms and Fortune
    500 corporate legal departments.'
  claimRefs:
  - CE010
  - CE011
  - CE012
  - CE013
