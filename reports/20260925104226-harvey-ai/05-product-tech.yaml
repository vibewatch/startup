- id: TE003
  title: Technology / operating architecture table
  columns:
  - Architecture Layer / Component
  - Functional Role
  - Key Technical Dependency
  - Primary Technical / Operational Risk
  rows:
  - - Multi-Model Inference Layer
    - Routes user queries to optimal LLMs based on task complexity and practice area
    - Commercial model API availability (OpenAI, Anthropic Claude, Mistral, xAI)
    - Upstream provider API price changes, rate limits, latency spikes, or model deprecations
  - - Legal Knowledge Grounding
    - Retrieval and citation pipeline connecting queries to primary legal databases
    - Licensed external data feeds (LexisNexis, EUR-Lex, EDGAR, Gyldendal Rettsdata)
    - Contractual data-access licensing renewals, proprietary data silos, and feed outages
  - - Enterprise DMS Connectors
    - Bi-directional synchronization of client matter files and firm templates
    - DMS APIs and enterprise access controls (iManage, SharePoint, Google Drive)
    - Enterprise permission desynchronization, VPN network timeouts, and large upload stalls
  - - Security & Isolation Boundary
    - Multi-tenant data isolation, regional processing, and zero-training enforcement
    - Cloud infrastructure compliance controls (SOC 2, ISO 27001, AWS/Azure regions)
    - Accidental cross-tenant metadata leakage or cloud provider regional compliance shifts
  notes: Operating architecture components, dependencies, and risks evaluated from corporate security disclosures, IT directory reviews, and investor analysis as of 2026-09.
