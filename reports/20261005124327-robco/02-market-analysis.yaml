company:
  name: "RobCo"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    RobCo addresses flexible industrial automation for manufacturers whose variable workflows,
    limited engineering capacity, or capital constraints make conventional robot cells difficult
    to deploy. Available evidence shows a large and growing installed base plus strong
    company-reported U.S. adoption intent, but it does not isolate RobCo's serviceable or
    obtainable market.
sections:
  - id: "market-boundary"
    title: "Market boundary and substitutes"
    body: >-
      RobCo's relevant market is not the roughly $15 trillion of global manufacturing activity
      cited by Greenfield Partners; that figure is an economic backdrop rather than addressable
      robotics spend. The investable boundary is narrower: recurring spending on flexible
      industrial automation for repetitive or dangerous production tasks, particularly where
      product mix, changeovers, limited engineering capacity, or capital approval impede
      conventional robot cells. RobCo positions its offer around modular hardware, software,
      deployment, and service, with machine tending, palletizing, dispensing, and welding as
      current workflow examples. Adjacent opportunities include embedded robotics for equipment
      makers and increasingly autonomous work in variable environments. Excluded from the core
      boundary are total manufacturing output, general enterprise software, fixed-purpose
      automation that does not require RobCo's platform, and future autonomous use cases not yet
      commercially demonstrated. The principal substitutes remain manual labor, an internal
      automation team, and integrator-led capital equipment.
    claimRefs: ["CM001", "CM009", "CM010", "CM011", "CM012"]
    tableRefs: ["TM001"]
  - id: "sizing-evidence"
    title: "Sizing evidence without a false TAM"
    body: >-
      The available sources provide market-activity lenses rather than a bottom-up TAM. An
      independent article citing the International Federation of Robotics reports 603,000
      industrial robots installed worldwide in 2025, an operational stock of 5.079 million, and
      a forecast of 655,000 installations in 2026. These figures establish category scale and
      direction, but they do not identify how many installations fit RobCo's workflows, service
      model, geography, payload range, or acceptable contract economics. RobCo's September 2025
      release separately says its survey found 61% of U.S. industrial companies accelerating
      automation, 95% planning additions within one to three years, and 42% considering
      robotics-as-a-service. Those percentages are useful demand signals, not independent market
      sizing: the fetched material does not disclose sample size, respondent mix, question
      wording, or fieldwork method. No precise SAM or SOM is therefore stated.
    claimRefs: ["CM001", "CM003", "CM004", "CM005", "CM006", "CM007", "CM008"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001"]
  - id: "buyers-and-adoption"
    title: "Buyer, user, payer, and adoption path"
    body: >-
      The core buyer appears to be a plant or production leader seeking to automate a defined
      workflow, while operators and maintenance personnel are the daily users. Under RobCo's
      stated robotics-as-a-service model, the manufacturer pays a predictable monthly rate and
      RobCo owns, deploys, maintains, and improves the equipment; this can shift approval from a
      large capital purchase toward an operating-expense decision. Budget ownership is not
      disclosed in the sources, so assignments to plant operations, manufacturing engineering,
      or an enterprise automation program remain diligence hypotheses rather than verified facts.
      Adoption should progress from workflow qualification and safety review to deployment,
      measured production performance, and replication across cells or sites. Larger enterprises
      offer multi-site expansion potential, while midsize manufacturers may value reduced
      integration burden more acutely. Equipment makers form an adjacent buyer class for RobCo's
      embedded-robotics stack rather than the same end-user funnel.
    claimRefs: ["CM009", "CM010", "CM013", "CM016"]
    tableRefs: ["TM003"]
  - id: "drivers-constraints-and-valuation"
    title: "Drivers, constraints, and valuation relevance"
    body: >-
      Structural labor pressure, reshoring, and rising operational complexity support automation
      demand. Greenfield Partners estimates that more than two million manufacturing jobs in the
      EU and United States could go unfilled by 2030, while RobCo's own survey indicates strong
      U.S. purchase intent. The counterweight is execution risk. Traditional automation can
      require costly integration, stable production, and specialist support; RobCo's model seeks
      to reduce those barriers but transfers hardware ownership, utilization, service density,
      and redeployment risk to the vendor. A self-published market-entry analysis also identifies
      OSHA, UL, and insurance requirements as U.S. deployment gatekeepers and warns that churn,
      truck rolls, and spare-parts usage can erode robotics-as-a-service economics. Those cautions
      are directionally relevant but low-confidence until contracts, fleet utilization, uptime,
      service cost, safety certifications, and cohort payback are reviewed. Valuation should
      therefore depend on verified repeatable unit economics and expansion, not broad
      manufacturing output or unaudited adoption intent.
    claimRefs: ["CM002", "CM006", "CM007", "CM012", "CM014", "CM015", "CM016"]
