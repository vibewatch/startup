callouts:
  - calloutType: "insight"
    title: "De-risking Industrial Adoption via Zero-CapEx Robotics-as-a-Service"
    body: "RobCo's primary commercial catalyst is inverting the traditional industrial robotics purchasing paradigm. By eliminating upfront capital expenditure and providing fully integrated modular cells under an operational monthly subscription, RobCo overcomes the internal budget hurdles that typically stall factory automation investments in mid-market manufacturing."
    claimRefs:
      - "CU002"
      - "CU004"
      - "CU006"
  - calloutType: "risk"
    title: "Balance-Sheet Asset Exposure from RaaS Hardware Retention"
    body: "While Robotics-as-a-Service dramatically accelerates customer acquisition, it shifts equipment capitalization and asset depreciation directly onto RobCo's balance sheet. If industrial customers face cyclical demand contractions or cancel subscription contracts, RobCo must absorb the carrying costs and redeployment friction of returned hardware, necessitating substantial equity capitalization."
    claimRefs:
      - "CU002"
      - "CU006"
      - "CU010"
