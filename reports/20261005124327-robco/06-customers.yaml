    title: "RobCo Customer Lifecycle and RaaS Expansion Journey Map"
    type: "journey-map"
    summary: "Visual mapping of customer adoption stages from initial labor friction to multi-cell RaaS fleet expansion."
    data:
      nodes:
        - label: "1. Problem Discovery"
          detail: "Plant encounters severe second/third-shift staffing shortages or high scrap rates on repetitive lines."
          tone: "risk"
        - label: "2. Application Scoping"
          detail: "RobCo delivery team conducts rapid virtual or on-site evaluation of machine tending or palletizing cell."
          tone: "neutral"
        - label: "3. Fast Deployment"
          detail: "Modular hardware kit deployed in days to weeks with no-code RobCo Studio; zero upfront CapEx."
          tone: "positive"
        - label: "4. Initial Cell Go-Live"
          detail: "Robot runs on monthly RaaS subscription; on-site operators supervise cell without programming skills."
          tone: "positive"
        - label: "5. Production Optimization"
          detail: "Physical AI models adapt to parts variability; agentic software monitors uptime and catches operational risks."
          tone: "positive"
        - label: "6. Multi-Line Expansion"
          detail: "Customer expands RaaS subscription across additional CNC machines, palletizing stations, or sister plants."
          tone: "opportunity"
    approximationNotes: "Journey stages model the operational transition from single-cell evaluation to enterprise fleet deployment under RobCo's zero-upfront Robotics-as-a-Service commercial framework."
