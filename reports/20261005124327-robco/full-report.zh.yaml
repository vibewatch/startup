      - number: '1.4'
        title: 展示项
        blocks:
          - type: callout
            title: 借助 Robotics-as-a-Service 把劳动力稀缺转化为机会
            body: >-
              RobCo 的核心商业差异化，在于把工业自动化与高额前期资本开支拆开。公司将模块化 Physical AI
              机器人打包成交钥匙订阅服务（RaaS），为面临严重制造业劳动力短缺的中型制造商扫除传统障碍，从而在欧洲和美国工厂快速部署。
            calloutType: insight
            claimRefs:
              - CO002
              - CO004
              - CO008
          - type: callout
            title: 美国工厂部署的执行与扩张风险
            body: >-
              RobCo 虽已达到 $1 billion 估值，但其跨大西洋扩张至美国十多个州后，现场集成、装配物流和客户支持都变得更复杂。Nitin Gupta 的任命针对交付运营模式，但毛利率、单元回本期和 ARR
              等私有运营指标仍未得到核验。
            calloutType: risk
            claimRefs:
              - CO003
              - CO005
              - CO007
              - CO011
              - CO012
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              RobCo 的相关市场并不是 Greenfield Partners 所引用的约 $15 trillion
              全球制造业活动；那只是经济背景，不是可服务的机器人支出。可投资边界更窄：面向重复性或危险生产任务的柔性工业自动化经常性支出，尤其是产品组合、换线、工程能力有限或资本审批阻碍传统机器人工作单元的场景。RobCo
              围绕模块化硬件、软件、部署和服务构建方案，当前工作流包括机床上下料、码垛、点胶和焊接。相邻机会包括面向设备制造商的嵌入式机器人，以及在多变环境中的更高程度自主作业。核心边界不包括制造业总产出、通用企业软件、不需要
              RobCo 平台的固定用途自动化，以及尚未商业验证的未来自主应用。主要替代方案仍是人工、内部自动化团队和集成商主导的资本设备。
            claimRefs:
              - CM001
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.2'
        title: 不虚构 TAM 的市场规模证据
        blocks:
          - type: paragraph
            body: >-
              现有来源提供的是市场活动视角，而不是自下而上的 TAM。引用 International Federation of Robotics 的独立文章称，2025 年全球安装工业机器人 603,000 台，运营存量
              507.9 万台，预计 2026 年安装 655,000 台。这些数据说明了品类规模和方向，但无法说明其中有多少符合 RobCo 的工作流、服务模式、地理范围、负载区间或可接受的合同经济性。RobCo 另在
              2025 年 9 月发布称，其调查发现 61% 的美国工业企业正在加速自动化，95% 计划在一至三年内增加部署，42% 正考虑
              Robotics-as-a-Service。这些比例是有用的需求信号，不是独立的市场规模测算：抓取材料未披露样本量、受访者构成、题目措辞或调研方法。因此，本文不提出精确的 SAM 或 SOM。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
