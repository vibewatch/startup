      - number: '1.3'
        title: 资本结构、规模指标与估值轨迹
        blocks:
          - type: paragraph
            body: >-
              RobCo 通过连续的机构融资轮和老股交易迅速扩大资本规模 [CO001, CO007]。2026 年 1 月，公司宣布完成 $85 million（€85M）至 $100 million 的 C 轮融资，由
              Lightspeed Venture Partners 和 Lingotto Innovation 共同领投，Sequoia Capital、Greenfield Partners、Kindred
              Capital、Leitmotif 及 The Friedkin Group 参投 [CO001, CO006]。此前，公司还完成了由 Sequoia Capital 于 2022 年 12 月领投的 A
              轮，以及由 Lightspeed 于 2024 年 2 月领投的 B 轮 [CO001, CO009]。2026 年末，RobCo 通过结合新增资本与员工老股出售的结构化交易，将估值推过 $1
              billion，正式成为独角兽，并在九个月内将估值翻倍 [CO007, CO010]。Cherry Ventures 和 European Tech Collective 也参与了这笔交易 [CO007]。

              随着资本化推进，运营规模同步加速，部署已覆盖欧洲制造业中心和美国十多个州 [CO005, CO007]。已披露客户包括 BMW、Rosenberger、T-Systems
              International、Fabricated Extrusion Company 和 DynaEnergetics 等头部工业制造商 [CO001, CO002]。截至 2026 年年中，员工人数约 202
              人，分布在慕尼黑总部、奥斯汀装配工厂和旧金山实验室 [CO007, CO009]。但公司管理层尚未披露 ARR、月度现金消耗、毛利率和已部署机器人总数等私有商业指标，这些是尽调中优先需要核验的项目 [CO011,
              CO012]。
