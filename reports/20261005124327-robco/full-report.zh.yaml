      - number: '6.3'
        title: 已披露客户验证、企业部署与客户背书质量
        blocks:
          - type: paragraph
            body: >-
              已公开确认的客户账户证明 RobCo 能在要求严苛的一级制造和技术环境中运营，但公开披露把规模化生产案例与仍在推进的多工厂部署混在一起 [CU002, CU003,
              CU004]。德国头部工业客户的生产使用提供了客户验证：Rosenberger CNC 加工技术副总裁 Georg Grabner 确认部署 RobCo 系统以自动化精密加工工作流
              [CU004]。同样，T-Systems International 汽车与制造业务副总裁兼负责人 Thomas Jenne 提到，其 Industry X 制造客户工作单元已部署 RobCo 模块化机器人和自主
              AI 软件平台 [CU004]。自动化集成商和机器制造商 Tiskens Steuerungs- und Antriebstechnik 正与 RobCo 合作，为终端客户交付模块化机器人工作单元
              [CU004]。在知名汽车制造企业中，BMW Group 被列为主要生产客户，此外还有工业材料供应商 DynaEnergetics 和食品制造商 DE-VAU-GE [CU002,
              CU003]。在美国，Wildpack Beverage 正与 RobCo 合作自动化劳动密集型包装和罐装产线，但该客户明确表示合作仍在推进，尚未完全投入运营 [CU002]。这些已披露客户证明 RobCo
              已能落地 CNC 机床上下料、码垛、点胶和焊接，但商业合同仍是双方保密事项，详细单元经济性和多工厂扩张比例也未公开 [CU002, CU003, CU004]。
