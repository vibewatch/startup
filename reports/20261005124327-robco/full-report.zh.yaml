      - number: '5.3'
        title: 商业方案、安全控制与技术风险
        blocks:
          - type: paragraph
            body: >-
              RobCo 将技术打包成三条主要商业路线：交钥匙 Integrated Solutions、Embedded Robotics 和 Alfie [CE001, CE009]。Integrated
              Solutions 在 Robotics-as-a-Service 运营框架下，以零前期资本开支提供机床上下料、码垛、点胶和焊接的一站式自动化 [CE001, CE005]。在 Embedded Robotics
              项目下，原始设备制造商（OEM）基于 RobCo 经现场验证的模块化硬件和 AI 栈共同开发品牌设备，保留自身品牌主导权，同时采用 RobCo 的运动基础 [CE001, CE003]。在技术前沿，RobCo
              正开发自主工业机器人 Alfie，将双臂操作与自学习 Physical AI 结合，用于非结构化且安全关键的生产任务；计划于 2027 年 3 月在慕尼黑 RobCoN 峰会上商业发布 [CE001,
              CE009, CE010]。从功能安全角度看，RobCo 模块化机器人内置符合 ISO 10218-1:2025 的安全功能 [CE002,
              CE012]。关键是，该系统不包含功率与力限制（PFL）安全功能，因此禁止通过 PFL 缓解风险；若部署需要人与机器人协作接触，除非另行设置外部防护，否则不予支持 [CE002,
              CE012]。手动引导控制和降速手动模式被合并为一个操作模式，手动操作时只有指定操作员可以进入危险区域 [CE002]。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE009
              - CE010
              - CE012
      - number: '5.4'
        title: 展示项
        blocks:
          - type: callout
            title: 分散式运动学与即插即用重构能力
            body: >-
              RobCo
              的主要技术护城河在于模块化硬件连接架构。公司把分散式驱动电子设备直接嵌入每个关节模块，并使用标准化机电连接端子；新接入的模块在通电后会自动检测并参数化。这样无需手工校准运动学，工业工厂也能随生产需求变化调整机械臂的工作范围和负载能力。
            calloutType: insight
            claimRefs:
              - CE002
              - CE007
              - CE008
          - type: callout
            title: 缺少功率与力限制，无法采用无笼协作机器人
            body: >-
              官方产品文档规定，RobCo 模块化机器人遵循 ISO 10218-1:2025，但明确缺少功率与力限制（PFL）安全功能。部署不能依赖 PFL 缓解碰撞风险，因此 RobCo
              机械臂不能在与工人直接接触的情况下作为无防护协作机器人运行。工厂必须安装光学围栏、实体防护或虚拟安全区域，这会压缩其在密集工厂通道中的占地效率。
            calloutType: risk
            claimRefs:
              - CE002
              - CE012
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群细分与目标画像
        blocks:
          - type: paragraph
            body: >-
              RobCo 将工业客户集中在离散制造领域：技术工人严重短缺、重复性生产瓶颈和回流制造要求，共同推动了紧迫的自动化需求 [CU001, CU002,
              CU006]。主要目标行业包括中型合同制造商、汽车一级和二级供应商、电子及精密加工企业，以及消费品包装业务 [CU002, CU004,
              CU007]。经济买方通常是工厂经理、制造运营副总裁或董事总经理，他们长期招不到人去做不受欢迎的二班和三班工厂任务 [CU002, CU005, CU006]。RobCo 以零前期资本开支的运营支出型
              Robotics-as-a-Service 提供交钥匙机器人，消除了过去阻碍小型工厂部署机器人工作单元的六位数至七位数预算门槛和多供应商系统集成复杂度 [CU002, CU004,
              CU006]。与已部署工作单元交互的技术用户包括现场生产线操作员、工作单元主管和车间技术员，他们通过直观的无代码示教界面配置工作流，而不是编写复杂底层代码，从而降低客户运营对专业机器人程序员的依赖 [CU002,
              CU003, CU005]。
