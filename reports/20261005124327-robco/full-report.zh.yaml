      - number: '4.2'
        title: 成本结构与单元经济性
        blocks:
          - type: paragraph
            body: >-
              RobCo 称其将硬件和软件作为一个垂直整合平台开发。结合公司持有已部署系统这一点，该模式使硬件采购、装配、部署、维护和正常运行时间风险都留在 RobCo，而不是在交付时全部转给客户。Teardown
              特别指出，持有设备需要投入可靠性、远程监控和现场服务。毛利率的主要变量因此包括车队利用率、设备寿命、重新部署成本、故障和服务频率、安装人工及合同期限。指定来源没有量化任何一项。仅凭经常性计费措辞无法评估经济性：月度付款不是回本良好的证据，已部署机器人也不是收入已确认的证据。必须获得客户群层面的现金回本期和贡献毛利，才能判断增长是在复合创造现金，还是在消耗更多融资。
            claimRefs:
