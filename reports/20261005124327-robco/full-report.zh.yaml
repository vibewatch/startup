  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块化硬件架构
        blocks:
          - type: paragraph
            body: >-
              RobCo 提供工业自动化平台，旨在降低制造工厂的部署摩擦和资本需求 [CE001, CE003]。硬件层面，系统采用可扩展的模块化架构，通过互连离散功能模块构建运动学组件 [CE002,
              CE007]。客户工作单元不是采用单体、固定几何结构的机械臂，而是由固定在工厂基础上的基座驱动单元、中间连接模块、驱动模块和特定应用末端执行器法兰配置而成 [CE002,
              CE008]。每个执行器模块都集成自身的驱动和控制电子设备，并与专用传感器模块协同，采集环境和工艺遥测数据，实现实时自适应运动控制 [CE002,
              CE008]。标准化连接端子同时负责物理连接以及电力和数据总线传输 [CE002]。新模块接入并通电后，RobCo 系统架构会自动检测、参数化并将其初始化到当前运动学模型，无需手工校准关节 [CE002,
              CE007]。这种模块化装配模式允许中型制造商随着工厂产品组合和节拍变化，重新部署并重构机器人几何形态 [CE001, CE003]。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE007
              - CE008
