      - number: '6.2'
        title: 采用轨迹、运行时长与地理覆盖
        blocks:
          - type: paragraph
            body: >-
              RobCo 的商业采用已从德国精密工程工厂的初始试点工作单元，扩展到欧洲和北美多州企业部署 [CU001, CU002, CU006]。截至 2026 年年中，公司现场累计运行时间超过 250 万
              小时，全球员工超过 200 人；这一运营规模扩张得到 2026 年 1 月 $100 million C 轮股权融资及后续 $1 billion 估值的支持 [CU001, CU003, CU007,
              CU008]。RobCo 在美国发展的关键催化剂，是战略收购美国 Rapid Robotics 的资产、硬件库存和客户合同，同时在得克萨斯州奥斯汀设立制造和装配双基地，并在旧金山设立应用工程实验室 [CU002,
              CU007, CU008]。这笔交易让 RobCo 在进入美国市场八个月内，将美国客户运营扩展至十多个州 [CU002, CU007, CU008]。公司发布的调查显示，61%
              的美国制造商正在加速自动化计划，95% 计划在三年内新部署，42% 正评估订阅制 RaaS 融资 [CU002]。不过，合同下活跃机器人总数、客户群层面的部署节奏和月度设备利用率仍是未披露的私有指标，需要审计核验
              [CU009, CU011]。
