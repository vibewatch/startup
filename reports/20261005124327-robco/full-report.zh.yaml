            body: >-
              指定证据中唯一的收入数字来自历史且间接：Teardown 报道称 Forbes 在 2024 年 2 月描述其收入接近 $10 million。同一分析称，当时已部署约 1,000 个模块，客户超过 100
              家。这些数字说明早期商业化已经启动，但不能证明 2026 年收入、ARR、活跃付费机器人、留存、利用率或客户集中度。RobCo 2026 年发布会列出 BMW、DynaEnergetics、Fabricated
              Extrusion Company、T-Systems 和 Rosenberger 的部署，但没有按客户提供合同价值或部署数量。指定来源未量化
              CAC、销售周期、销售生产率、回本期、渠道经济性或扩张收入。因此，在没有客户级订单和客户群证据前，不应把客户标识的质量和已安装模块数直接转化为销售效率结论。
