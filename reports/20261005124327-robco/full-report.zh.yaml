      - number: '5.2'
        title: 软件栈、控制架构与 Physical AI
        blocks:
          - type: paragraph
            body: >-
              RobCo 的计算架构采用分散控制原则，并配合集中协调 [CE002, CE004]。指定为控制单元的中央处理单元负责高层传感器数据处理、全局运动规划和外部工业通信；各模块控制器则在每个关节独立执行闭环电机驱动
              [CE002, CE008]。在需要更大电气容量的重载配置中，辅助电源单元（BD193）提供额外驱动电力，但仍依靠主控制单元处理数据 [CE002]。在低层运动内核之上，RobCo 提供 RobFlow
              进行机器人工作单元工作流编排，并配套 Profinet、ROS 2 等标准工业现场总线接口和实时流接口，使用户可以直接通过可编程逻辑控制器（PLC）或外部代码驱动机械臂 [CE004, CE011]。RobCo
              的高层 Physical AI 栈加入感知、运动规划和自学习能力，使机器人可以通过示范和自动试错获得特定任务技能，而不必逐行手工编程 [CE005,
              CE006]。软件界面提供图形化运动可视化、模块参数化、运动学仿真和故障诊断，为异构工厂自动化任务提供统一控制平面 [CE002, CE005]。
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE006
              - CE008
              - CE011
