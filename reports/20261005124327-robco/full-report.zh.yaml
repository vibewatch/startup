      - number: '6.4'
        title: 留存持续性、扩张摩擦与集中度风险
        blocks:
          - type: paragraph
            body: >-
              评估 RobCo 的客户留存持续性，需要先理解工业场景下 Robotics-as-a-Service 的结构性机制 [CU002, CU004, CU006]。RaaS
              的核心价值是让供应商收入与机器人持续运行时间挂钩，同时把客户支出变成可预测的月度运营费用，这大幅降低了初始客户摩擦并加快早期采用 [CU002, CU004]。此外，RobCo
              正在项目解决方案交付的各环节开发内部代理工作流，从自动收集需求、工程检查到运营风险评分，以简化客户工作单元调试并降低交付摩擦 [CU001]。但 RaaS 合同也让 RobCo
              暴露于较大的交易对手、利用率和客户集中度风险 [CU002, CU009,
              CU010]。客户采用订阅而非直接购买设备，因此客户工厂产量严重下滑、季节性罐装线停工或班次取消，都可能引发合同重新谈判或硬件退回，使折旧中的机器人资产滞留在 RobCo 资产负债表上 [CU002,
              CU006, CU010]。关键是，RobCo 尚未公开披露 NRR、GRR、客户群流失率、平均合同期限，或前五大客户贡献的收入占比 [CU009, CU010,
              CU011]。要实现高毛利车队扩张，还取决于计划于 2027 年 3 月发布 Alfie；短期扩张仍依赖标准化机械臂 [CU007, CU008, CU012]。
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 通过零前期资本开支的 Robotics-as-a-Service 降低工业采用风险
            body: RobCo 的主要商业催化剂，是颠覆传统工业机器人采购模式。公司免除前期资本开支，以运营月度订阅提供完全集成的模块化工作单元，从而跨过中端制造业工厂自动化投资经常遇到的内部预算障碍。
            calloutType: insight
            claimRefs:
              - CU002
              - CU004
              - CU006
          - type: callout
            title: RaaS 硬件留存带来的资产负债表资产暴露
            body: >-
              Robotics-as-a-Service 虽大幅加快客户获取，却把设备资本化和资产折旧直接放到 RobCo 的资产负债表上。如果工业客户遭遇周期性需求收缩或取消订阅合同，RobCo
              就必须承担退回硬件的持有成本和重新部署摩擦，因此需要大量股权资本。
            calloutType: risk
            claimRefs:
              - CU002
              - CU006
              - CU010
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 证据边界与法律归属
        blocks:
          - type: paragraph
            body: >-
              不利搜索结果池特别容易发生错误归属。分配到的两条 Reddit 结果涉及虚构的 Fallout 公司或游戏修改，而不是慕尼黑工业机器人公司；联邦诉状则指向一家据称拥有 Kenner
              购物中心的路易斯安那州有限责任公司 [CR001, CR002]。另一个 robco.technology 结果描述了喷漆线自动化项目，但没有把该发布方与 rob.co 目标公司联系起来
              [CR003]。这些记录可以作为实体解析风险的证据，却不能作为目标公司产品质量不佳或涉及诉讼的证据。因此，本文审阅的公开来源记录无法证明 RobCo
              没有诉讼、监管、安全、隐私或网络安全风险；目标公司的法定名称、子公司和按司法辖区划分的案卷仍是必须补充的尽调输入 [CR016]。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR016
      - number: '7.2'
        title: 运营与产品执行
        blocks:
          - type: paragraph
            body: >-
              RobCo 称公司从第一天起就垂直整合，将硬件和软件作为一个全栈平台开发 [CR004]。其网站也将公司定位为单一供应商，负责设计、部署、维护并持续改进每个工作单元
              [CR005]。这种架构可能简化客户采购，但也会带来相关执行风险：硬件缺陷、软件故障、集成延误、备件短缺或现场服务瓶颈，都可能损害同一订阅关系
              [CR013]。扩张负担不轻，因为公司发布的证据显示其在旧金山和奥斯汀运营，并已披露多个工业客户，而独立报道称客户运营覆盖美国十多个州 [CR007, CR008,
              CR009]。指定来源没有提供正常运行时间、事故、维修时长、服务能力或独立安全性能数据 [CR016]。
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR008
              - CR009
              - CR013
              - CR016
