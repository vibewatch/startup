      - number: '3.2'
        title: 集成广度是最明确的自称差异化
        blocks:
          - type: paragraph
            body: >-
              RobCo
              称其将硬件和软件共同开发为全栈平台，公开方案整合了硬件、软件、集成、部署、服务和持续改进。公司还称，机器人可以通过示范和自学习获得特定任务技能，而无需手工编程。这些能力可能相较多供应商工作单元减少协调和重新编程摩擦，但指定证据没有独立的节拍时间、正常运行时间、人工干预率、安全性或适应性基准。已披露部署证明的是公司所称的生产覆盖面，不是相对性能。因此，对竞争对手缺乏支持的单元标记为未知，不将其打成劣势。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
