  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >-
              RobCo 将 Integrated Solutions 描述为零前期资本开支的端到端 Robotics-as-a-Service。公司网站称，客户按可预测的月费支付，RobCo
              持有、部署、维护并改进机器人。Teardown
              补充了更具体但未经证实的商业细节：客户只按机器人运行小时计费，且由于没有公开价目表，价格按应用报价。该结构可能带来经常性收入，但指定证据无法证明合同期限、最低承诺、实际价格、续约、折扣或收入确认方式。RobCo
              也推广 Embedded Robotics 联合开发，但没有来源披露该业务产生的是许可、工程、特许权使用费还是硬件收入。因此，收入构成仍未量化，不能证明订阅收入占主导。
