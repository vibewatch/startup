      - number: '4.4'
        title: 资本充足性与财务结论
        blocks:
          - type: paragraph
            body: >-
              RobCo 于 2026 年 1 月宣布完成 $100 million C 轮融资，用于 Physical AI 路线图、企业部署和美国扩张。这是融资额，不是收入、可用现金或现金跑道。10 月，Tech
              Funding News 报道一笔交易将新投资与员工老股流动性结合；Trending Topics 则称 RobCo 未披露融资金额。因此，公开证据无法拆分公司新增融资所得与老股部分。FundedIQ
              数据库只记录 $100 million C
              轮，说明其所称总额是受覆盖范围限制的记录，而非完整资本历史。在现金、消耗、债务、车队融资工具和资本承诺都未披露的情况下，资本充足性无法衡量。财务结论因此保持谨慎：融资渠道似乎较强，但收入质量、利润率路径、资本密集度和下一轮融资依赖仍是重要投资判断障碍。
