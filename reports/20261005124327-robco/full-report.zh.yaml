      - number: '1.2'
        title: 领导层、治理与组织扩张
        blocks:
          - type: paragraph
            body: >-
              RobCo 的高管团队仍以技术创始团队为核心，同时配备负责全球扩张的资深运营高管 [CO001, CO003]。CEO Roman Hölzl 负责商业战略和国际运营，近期已迁居美国，主导美国企业业务扩张
              [CO001, CO007]。联合创始人 Paul Maroldt 和 Constantin Dresel 分别主导核心机器人硬件工程及软件系统架构，其技术积累源自 TUM 的学术研究 [CO001,
              CO006]。2026 年 8 月，运营领导层明显加强：Nitin Gupta 出任总裁兼首席解决方案与交付官，这是新设职位，专门负责欧洲及美国客户部署的工业交付运营模式 [CO003]。

              公司治理得到头部风险资本和产业投资者支持，这些投资者拥有董事会席位并参与战略顾问监督 [CO001, CO006]。主要机构股东包括由合伙人 Alexander Schmitt 共同负责的 Lightspeed
              Venture Partners、由管理合伙人 Morgan Samet 领导的 Lingotto Innovation，以及 Sequoia Capital 合伙人 Luciana Lixandru
              [CO001, CO006, CO007]。由于 RobCo 的模块化运动学组件和 Physical AI 训练模型具有专有性质，公司对 CEO Roman Hölzl
              和技术创始团队的关键人物依赖度中等偏高；不过，Gupta 等企业运营人才的加入及知名机构投资者参与董事会治理，有助于降低对单一高管的运营暴露 [CO001, CO003]。
            claimRefs:
              - CO001
              - CO003
              - CO006
              - CO007
