  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集合不止机器人厂商
        blocks:
          - type: paragraph
            body: >-
              买方可以通过 RobCo 的一体化服务、获得融资的工业机器人新进入者、聚焦仓储的相邻平台、项目集成商，或用采购设备自行搭建的内部工程项目来解决自动化任务。独立报道将 Standard Bots、Walden
              Robotics 和 Dexory
              列为资金日益充足的竞争者，但三者面向的应用边界不同。另一家自动化供应商的项目说明展示了传统集成商方案：设计、电气工程、控制柜预制、控制、测试、培训和调试可以作为一个定制项目采购。因此，竞争核心是运营模式、部署所有权和应用适配度，而非某个可互换的机器人规格。
            claimRefs:
              - CP011
              - CP013
              - CP015
