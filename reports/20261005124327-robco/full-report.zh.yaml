  - id: TV001
    title: RobCo 投资建议与决策参数
    columns:
      - 评估维度
      - 当前立场
      - 关键证据与分析依据
      - 投资判断的尽调含义
    rows:
      - - 建议
        - 跟进
        - Physical AI 技术扎实、顶级投资人阵容强，但私有 SaaS/RaaS 指标不透明，估值溢价超过 $1B。
        - 在投入成长股权资本前，先观察商业进展和客户群扩张。
      - - 信心
        - 低
        - ARR、毛利率、烧钱速度和单位经济等关键财务驱动因素均属未披露的私有数据。
        - 只有取得经审计财务报表和已部署机器人的遥测数据，才纳入投资判断。
      - - 风险评级
        - 高
        - 硬件带来的资产负债表资本密集度、RaaS 资产折旧、美国快速扩张的管理费用，以及资金充足的竞争对手。
        - 在客户严重延期和设备退回情景下，对营运资金需求做压力测试。
      - - 估值立场
        - 偏高
        - 2026 年末在二级交易中突破 $1B 独角兽门槛，收入未披露但估值在 9 个月内翻倍。
        - 需要激进的前瞻增长假设，且 Alfie 必须在 2027 年成功商业化。
      - - 目标回报 / 期限
        - 2.0x - 3.0x（3-5 年）
        - 若全球 Physical AI 自主化领导地位确立，可能以 $2B-$3B+ 估值 IPO 或通过战略并购退出。
        - 根据清算优先权级别和未来潜在股权稀释测算股权回报。
      - - 退出准备度
        - 早期 / 中期
        - 在 Munich 和美国设有双总部，治理支持度高，但缺乏公开报告和规模化盈利。
        - 评估迈向商业规模的路径，以及为公开市场上市或 OEM 收购做准备的程度。
    notes: 建议参数反映公开的风险投资披露、二级市场公告，以及未披露的单位经济数据缺口。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV006
      - CV007
  - id: TV002
    title: RobCo 投资论点与反论点框架
    columns:
      - 分析视角
      - 论点（看多驱动因素）
      - 反论点（看空风险）
      - 改变判断的关键证据
    rows:
      - - 市场需求与宏观环境
        - 制造业熟练劳动力严重短缺，加上制造业回流倡议，推动欧洲和美国工厂迫切需要自动化。
        - 工业中小企业资本开支容易受到宏观经济放缓、工厂利用率下降和制造业衰退冲击。
        - 中小企业自动化采用率持续上升，同时工厂取消和冻结率居高不下。
      - - 产品与 Physical AI
        - 可拼接模块化机械臂和自学习 Physical AI 支持快速部署；Alfie 承诺在 2027 年实现双臂自主。
        - 多品种、非结构化任务仍然技术难度很高；自学习能力的说法仍需工程师持续现场介入。
        - 在没有人类程序员介入的情况下，经过独立验证的自主任务完成率。
      - - 商业模式与 RaaS
        - 零首付 RaaS 订阅消除客户的资本开支阻力，释放可预测的软件和硬件经常性收入。
        - RaaS 将资产折旧和资产负债表融资压力转移给 RobCo，机队扩张时会造成大量现金消耗。
        - 建立专门用于硬件租赁融资的非稀释性银行债务额度。
      - - 竞争护城河
        - 硬件与 AI 操作系统全栈垂直整合；现场布局覆盖十多个美国州。
        - 面临 Standard Bots（估值 $1B）、Walden Robotics（估值 $1.1B）及传统巨头（FANUC、KUKA、ABB）的激烈竞争。
        - 在标准化基准测试中，相对于协作机器人和自主机器人竞争对手的合同赢单率。
      - - 资本结构与估值
        - 顶级投资人阵容（Sequoia、Lightspeed、Lingotto）提供雄厚资金和战略 OEM 渠道（Exor、BMW）。
        - 二级股票出售将估值推至 $1B 独角兽水平，股价已按近乎完美定价，也叠加了下行时折价融资的风险。
        - 披露经审计 ARR 超过 $30M-$40M，且单位贡献利润为正。
    notes: 这些论点将风险投资伙伴的观点与运营硬件经济学及竞争对手已披露的融资情况进行对照。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
  - id: TV003
    title: RobCo 情景估值与回报投资判断分析
    columns:
      - 情景
      - 概率
      - 运营与增长假设
      - 隐含估值区间
      - 估值 / 回报逻辑
      - 下行触发因素与脆弱点
    rows:
      - - 乐观情景
        - 15%
        - Alfie 于 2027 年 3 月成功商业化；美国扩张迅速放量；ARR 超过 $100M，毛利率达到 65%+。
        - $2,000M - $3,000M
        - 20x-30x 前瞻 ARR 倍数，反映定义品类的 Physical AI 平台领导地位。
        - Alfie 发布延期、双臂操作软件出现缺陷，或未能赢得多工厂企业推广。
      - - 基准情景
        - 45%
        - 模块化 RaaS 单元在机床上下料和码垛场景中稳步扩张；ARR 达到 $35M-$50M；利润率稳定在 45%-55%。
        - $600M - $800M
        - 12x-16x ARR 倍数，计入硬件资产负债表资本密集度和现场服务管理费用。
        - RaaS 营运资金受限、美国中端市场销售周期更长，或竞争对手定价挤压利润率。
      - - 悲观情景
        - 40%
        - 机队利用率落后；客户在合同续约时流失；现场支持管理费用高；ARR 停滞在 $20M 以下且持续烧钱。
        - $300M - $450M
        - 6x-9x ARR 倍数或清算价值，相当于较当前 $1B 估值折价 55%-70%。
        - 客户取消合同、无法获得债务融资而被迫进行稀释性结构化股权重组，或现金紧张。
    notes: 概率和隐含估值是基于市场倍数、硬件 RaaS 资本结构及已披露融资轮次的分析估计。
    claimRefs:
      - CV002
      - CV005
      - CV006
      - CV007
      - CV008
figures:
  - id: FO001
    title: RobCo 公司发展与融资里程碑时间线
    type: timeline
    summary: RobCo 从学术分拆公司发展为独角兽工业机器人平台的时间演进（2020–2027）。
    data:
      items:
        - label: 2020-01：成立与 TUM 分拆
          detail: Roman Hölzl、Paul Maroldt 和 Constantin Dresel 依托 TUM Robotics & AI Chair 在慕尼黑创立公司。
          tone: positive
        - label: 2022-12：Series A 融资
          detail: 完成 Sequoia Capital 领投、Kindred Capital 参与的 Series A 融资。
          tone: positive
        - label: 2024-02：Series B 融资
          detail: 完成由 Lightspeed Venture Partners 领投的 Series B 股权融资，用于扩大模块化机器人业务。
          tone: positive
        - label: 2025-06：美国市场扩张
          detail: 进入美国市场，在加州旧金山和得州奥斯汀设立设施。
          tone: positive
        - label: 2025-12：自动化准备度指数
          detail: 发布研究显示 95% 的美国工业企业计划自动化；凸显 RaaS 需求。
          tone: neutral
        - label: 2026-01：$100M Series C 轮
          detail: 完成 $100M（€85M）Series C 融资，由 Lightspeed 和 Lingotto 共同领投，用于拓展 Physical AI 平台。
          tone: positive
        - label: 2026-08：任命交付负责人
          detail: 任命 Nitin Gupta 为总裁兼首席解决方案与交付官，以标准化部署。
          tone: positive
        - label: 2026-10：独角兽估值与二级交易
          detail: 借助员工二级股份出售以及与 Cherry Ventures、European Tech Collective 的交易，估值超过 $1B。
          tone: positive
        - label: 2027-03：Alfie 商业发布（计划）
          detail: 计划在慕尼黑的 RobCoN 峰会上发布并商业化自主工业机器人 Alfie。
          tone: opportunity
    approximationNotes: 时间线综合已核实的公司公告、融资轮新闻稿和媒体报道。2020 年的具体成立月份依据公司历史记录。
