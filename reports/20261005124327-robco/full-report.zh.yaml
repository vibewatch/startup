      - number: '7.3'
        title: 财务模式与依赖项
        blocks:
          - type: paragraph
            body: >-
              零前期费用方案既是客户福利，也是一项融资义务。RobCo 称客户按可预测月费支付，而 RobCo 持有、部署、维护并改进机器人 [CR005,
              CR006]。该模式把资产融资、利用率、正常运行时间和服务成本风险转移给 RobCo，因此客户采用本身不能证明单元经济性有吸引力 [CR014]。公司宣布为产品路线图、企业部署和美国扩张完成 $100
              million C 轮融资，但已融资额并不等于当前可用现金或现金跑道 [CR012]。独立报道后来称一笔交易结合了新投资与员工老股流动性，并令估值超过 $1
              billion；报道没有披露主要募资与老股部分的拆分，也没有披露运营流动性 [CR011]。指定来源没有消耗、毛利率、回本期、损失率、营运资金或集中度数据 [CR016]。
            claimRefs:
              - CR005
              - CR006
              - CR011
              - CR012
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR011
              - CR012
              - CR014
              - CR016
      - number: '7.4'
        title: 排序、缓释措施与终止标准
        blocks:
          - type: paragraph
            body: >-
              最高的剩余风险是全栈服务义务彼此耦合、RobCo 为部署提供融资的经济性，以及缺乏针对目标公司的独立安全、信息安全和可靠性证据 [CR013, CR014, CR016]。最醒目的带日期执行测试是
              Alfie：独立报道称商业发布计划在 2027 年 3 月 4 日，因此准备情况和发布后的转化仍是未来依赖项，而不是当前商业可用性的证据 [CR010,
              CR015]。投资前，管理层应提供法律实体清单、认证档案、事故和正常运行时间日志、服务水平表现、车队融资、客户群经济性及客户集中度。若 Alfie
              发布无合理解释地延期、无法证明安全生产运行、服务故障反复出现且维修时间不改善，或部署增长仍依赖负面的售后服务单元经济性，都应触发投资论点失效。
            claimRefs:
              - CR010
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 公开证据不足以评估剩余风险
            body: >-
              不要把没有找到与目标公司匹配的不利记录，转化为清白的法律或安全结论。投资批准仍应以实体已核验的法律搜索、安全、信息安全证据、车队可靠性、服务经济性、客户集中度，以及计划中的 Alfie
              发布能否转化为安全的付费生产使用为条件。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR010
              - CR015
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              RobCo 提出了一套雄心勃勃的 Physical AI 论点，核心是为欧洲和美国的多品种制造业实现车间自动化 [CV001,
              CV002]。投资论点认为，人口结构导致的工业劳动力短缺叠加回流制造计划，催生了柔性自动化需求；这种自动化可以免去高额前期资本开支和漫长系统集成 [CV002, CV003]。RobCo 通过零前期费用的
              Robotics-as-a-Service（RaaS）订阅，将模块化机器人硬件与自主 Physical AI 操作系统结合，既打开了服务不足的中小企业市场，也进入了
              BMW、T-Systems、Rosenberger 和 DynaEnergetics 等蓝筹企业客户 [CV001, CV004]。平台路线图还得到 Alfie
              的推动：这款即将推出的自主机器人结合多模态感知、推理和双臂执行，计划于 2027 年 3 月在 RobCoN 上首次商业亮相 [CV002, CV005]。

              反过来，反投资论点强调估值压力、资产负债表资本占用和激烈的竞争拥挤 [CV002, CV006, CV007]。在零前期费用的 RaaS 模式下，RobCo
              保留全部实体资产所有权，因此在订阅现金流摊销前期硬件投入之前，公司需要投入大量资本制造、部署和服务机器人车队 [CV004, CV007]。此外，Standard Bots（$200M C 轮，$1B 估值）和
              Walden Robotics（$300M 种子轮，$1.1B 估值）等风险资本支持的同行，正积极争夺机床上下料和制造自动化市场 [CV002]。在审计后的
              ARR、车队毛利率、净收入留存率和客户回本速度等私有商业指标受到严格保护的情况下，以 $1B 独角兽价格入场，就必须对资本密集型硬件领域极高且近乎无瑕的运营执行作出投资判断。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
