    rows:
      - - CNC 机床上下料
        - 人工装卸工件，操作员空闲时间较长
        - 与机门和卡盘集成的交钥匙模块化机械臂
        - 无人值守班次持续利用主轴
        - 受限于开放工作区域附近缺乏功率和力限制（PFL）
      - - 末端码垛
        - 人工搬运重箱，以及刚性的固定工位码垛机
        - 可重构模块化机械臂，适配定制托盘高度
        - 消除人体工学伤害，并适配混合 SKU 箱体尺寸
        - 有效载荷上限由基础驱动模块和 XL 电源输出决定
      - - 工业点胶与密封
        - 人工涂胶容易造成胶条不一致和材料浪费
        - RobFlow 路径规划实现恒速运动学轨迹跟踪
        - 重复性流体点胶，减少化学材料用量
        - 需要经 Profinet 或 I/O 集成第三方流体计量设备
      - - 工业弧焊 / 点焊
        - 熟练焊工短缺，且专用机器人焊接单元刚性较高
        - 与焊接电源和焊枪集成的模块化机械臂
        - 可在不同小批量焊接组件之间快速切换
        - 实时焊接放电期间不支持协作式手动引导
      - - 非结构化装配（Alfie）
        - 由于组件存在差异且需要料箱拣选，必须人工组装
        - 由自学习 Physical AI 感知引导双手操作
        - 将复杂、高混合度且此前协作机器人无法处理的任务自动化
        - 商用版本要到 2027 年 3 月 RobCoN 峰会才会发布
    notes: 应用映射反映了已披露的部署工作流和技术边界，依据为安全手册及商业产品简报。
