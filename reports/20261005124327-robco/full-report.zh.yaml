    data:
      layers:
        - label: 应用与编排层
          detail: RobFlow 单元编排、无代码图形化工作流 UI，以及通过演示获取 Physical AI 技能
        - label: 工业通信与边缘层
          detail: Profinet 工业现场总线、ROS 2 节点集成，以及连接 PLC 的实时流接口
        - label: 中央计算与运动规划层
          detail: 控制单元处理环境遥测数据，生成全局轨迹设定值并监控安全
        - label: 电源管理与辅助驱动层
          detail: 高输出电源单元（BD193 XL）负责分配电驱功率
        - label: 分布式关节执行层
          detail: 嵌入式电机驱动器和连杆控制器执行本地位置、速度闭环调节
        - label: 模块化运动学硬件层
          detail: 基础驱动模块、连杆模块、连接端子、末端执行器法兰和双臂 Alfie 机械臂
    approximationNotes: 基于 RobCo 技术文档、模块手册和商业方案披露的逻辑架构表示。
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE006
      - CE008
      - CE011
  - id: FU001
    title: RobCo 客户生命周期与 RaaS 扩张旅程图
    type: journey-map
    summary: 可视化呈现客户从最初的劳动力瓶颈到多单元 RaaS 机队扩张的采用阶段。
    data:
      nodes:
        - label: 1. 发现问题
          detail: 工厂在重复性生产线上遭遇第二、第三班次严重缺员或高报废率。
          tone: risk
        - label: 2. 应用范围界定
          detail: RobCo 交付团队快速远程或现场评估机床上下料或码垛单元。
          tone: neutral
        - label: 3. 快速部署
          detail: 模块化硬件套件借助无需编码的 RobCo Studio，可在数天到数周内部署；无需前期资本开支。
          tone: positive
        - label: 4. 初始单元上线
          detail: 机器人以月度 RaaS 订阅运行；现场操作员无需编程技能即可监管单元。
          tone: positive
        - label: 5. 生产优化
          detail: Physical AI 模型适应零件差异；智能体软件监测正常运行时间并捕捉运营风险。
          tone: positive
        - label: 6. 多产线扩展
          detail: 客户将 RaaS 订阅扩展至更多 CNC 机床、码垛工作站或姊妹工厂。
          tone: opportunity
    approximationNotes: 旅程阶段刻画了在 RobCo 零前期投入的 Robotics-as-a-Service 商业框架下，从单元评估到企业级机群部署的运营转变。
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU005
      - CU006
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 凡是 RobCo 的运营模式把责任集中在自身、而指定证据又没有提供独立概率或缓解记录的领域，剩余风险敞口最高。
    data:
      columns:
        - id: likelihood-evidence
          label: 可能性证据
        - id: impact
          label: 影响
        - id: mitigation-maturity
          label: 缓解成熟度
        - id: residual-trigger
          label: 剩余风险 / 触发条件
      rows:
        - id: legal-attribution
          label: 法律归属
          values:
            - label: 同名误报
            - label: 归属错误时为高风险
            - label: 已识别实体不匹配
            - label: 在完成实体核实的案卷审查前保持开放
        - id: safety-security-proof
          label: 安全与安保证明
          values:
            - label: 证据池没有目标公司特定记录
            - label: 潜在影响高
            - label: 无公开证据
            - label: 若无法提供认证和事故日志则终止
        - id: full-stack-execution
          label: 全栈执行
          values:
            - label: 无故障率分母
            - label: 高
            - label: 公司声称已实现集成
            - label: 在获得独立生产证明前保持高位
        - id: raas-financing
          label: RaaS 融资
          values:
            - label: 无现金或单位经济数据
            - label: 高
            - label: 已宣布融资 1 亿美元
            - label: 若服务后经济效益仍结构性为负则终止
        - id: us-field-service
          label: 美国现场服务
          values:
            - label: 据报道覆盖十多个州
            - label: 中高
            - label: 奥斯汀和旧金山布局
            - label: 监测维修时间和服务能力
        - id: alfie-launch
          label: Alfie 发布
          values:
            - label: 据报道计划于 2027 年 3 月 4 日
            - label: 对增长论点而言为高风险
            - label: 仅有发布前证据
            - label: 若出现无法解释的延迟或转化疲弱则终止
    approximationNotes: 该矩阵为定性分析，因为指定来源未披露目标特定的事件频率、损失规模或经独立验证的缓解措施表现。
    claimRefs:
      - CR002
      - CR008
      - CR010
      - CR013
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: RobCo 投资判断与建议逻辑流程
    type: flow
    summary: 按顺序展示技术验证、市场顺风、RaaS 资本结构和估值倍数如何共同导向继续跟踪的建议。
    data:
      nodes:
        - id: tech-proof
          label: 模块化硬件与 Physical AI
          detail: 已在 BMW、DynaEnergetics 和 Rosenberger 实现部署；Alfie 仍在开发。
          tone: positive
        - id: market-tailwinds
          label: 宏观劳动力短缺与回流
          detail: 制造业人口结构性短缺，以及 IFR 预计全球将安装 655,000 台机器人。
          tone: positive
        - id: capital-intensity
          label: 零前期资本支出 RaaS 财务模型
          detail: 消除客户资本支出障碍，但将资产折旧和营运资金转移至 RobCo 资产负债表。
          tone: neutral
        - id: data-gaps
          label: 未披露的 ARR 与单位经济
          detail: 未披露的私有指标包括：ARR、毛利率、现金消耗和机群利用率。
          tone: warning
        - id: valuation-premium
          label: 超过 10 亿美元独角兽门槛
          detail: 通过二级出售让估值在 9 个月内翻倍；相对估算收入的隐含倍数较高。
          tone: warning
        - id: recommendation-track
          label: 跟踪建议（低信心）
          detail: 维持跟踪立场；等待经审计的客户群组经济数据、债务工具验证和 Alfie 发布。
          tone: neutral
      edges:
        - from: tech-proof
          to: market-tailwinds
        - from: market-tailwinds
          to: capital-intensity
        - from: capital-intensity
          to: data-gaps
        - from: data-gaps
          to: valuation-premium
        - from: valuation-premium
          to: recommendation-track
    approximationNotes: 该框架刻画技术验证、资产负债表资本压力与估值之间的定性决策逻辑。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV006
      - CV007
      - CV008
