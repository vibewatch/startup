      - number: '3.3'
        title: 订阅和嵌入式路径切入不同控制点
        blocks:
          - type: paragraph
            body: >-
              RobCo 推广无需前期设备采购、按月支付可预测费用的
              Robotics-as-a-Service；其发布材料称，客户在机器人运行时付费，并可在数周内完成部署。这些都是公司口径，合同期限、利用率公式、服务水平承诺、折扣和实际价格均未披露。RobCo
              还提供嵌入式路径：合作伙伴保留品牌主导权和客户关系，同时使用 RobCo 的硬件和 AI 基础。这可以扩大分销，但也把客户所有权转给合作伙伴，使渠道经济性和依赖度可能与产品能力同样重要。
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP013
              - CP014
      - number: '3.4'
        title: 资本与品类趋同削弱对护城河持久性的信心
        blocks:
          - type: paragraph
            body: >-
              RobCo 于 2026 年 1 月宣布的 $100 million C 轮融资，为自主能力开发和美国扩张提供资源，但已融资额不是可用现金，也不能证明产品领先。独立报道显示 Standard
              Bots、Walden Robotics 和 Dexory 也获得了规模相近的融资；更广泛的报道则描述了 Physical AI 领域的大量资本流入。RobCo 计划于 2027 年商业推出
              Alfie，意味着一项重要的自主能力主张仍是未来事项。因此，护城河取决于已部署工作单元能否积累专有学习、靠服务质量留住客户，并以比资金充足的新进入者或传统集成商更快的速度扩展工作流；公开信息无法回答这些问题。
