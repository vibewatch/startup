chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立背景与商业模式
        blocks:
          - type: paragraph
            body: >-
              RobCo 是一家总部位于德国慕尼黑的自主工业机器人企业，在加利福尼亚州旧金山和得克萨斯州奥斯汀设有运营机构 [CO001, CO005]。Roman Hölzl、Paul Maroldt 和
              Constantin Dresel 于 2020 年将公司从慕尼黑工业大学（TUM）机器人与人工智能讲席分拆出来；公司开发模块化、可重构的机器人硬件，并配套云连接 Physical AI 软件栈 [CO001,
              CO006]。部分第三方企业注册信息聚合商将其起源追溯到 2013 年，或称其于 2019 年 12 月以 RobCo GmbH 名义完成法律注册，但商业运营和正式分拆身份均可追溯至 2020 年 [CO001,
              CO009]。RobCo 面向工业制造，重点应对中小企业（SME）和大型原始设备制造商（OEM）普遍面临的严重技术工人短缺及回流制造压力 [CO002, CO008]。

              公司的核心商业方案采用端到端 Robotics-as-a-Service（RaaS）运营支出模式，免去工业自动化通常需要的六位数至七位数前期资本开支和第三方系统集成负担 [CO002, CO008]。RobCo
              负责设计、部署、维护并持续更新整套机器人工作单元，客户按可预测的月费订阅 [CO002]。产品组合包括面向机床上下料、码垛、点胶和焊接等标准化高混合任务的交钥匙 Integrated
              Solutions；用于共同开发 OEM 硬件方案的 Embedded Robotics；以及下一代自主机器人 Alfie，后者借助自学习 Physical AI 处理非结构化、多变的生产流程 [CO002,
              CO004, CO007]。
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
