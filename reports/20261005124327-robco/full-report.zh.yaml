            tableRef: TM002
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              核心买方似乎是希望自动化某一明确工作流的工厂或生产负责人，操作员和维护人员则是日常用户。按照 RobCo 所述的 robotics-as-a-service 模式，制造商支付可预测的月费，RobCo
              持有、部署、维护并改进设备；这可能使审批从大额资本采购转为运营支出决策。来源未披露预算归属，因此将预算归于工厂运营、制造工程或企业自动化项目，目前都只是尽调假设而非已核实事实。采用路径应从工作流筛选和安全审查开始，经过部署和生产表现测量，再复制到更多工作单元或工厂。大型企业具备多工厂扩张潜力，中型制造商则可能更看重较低的集成负担。设备制造商是
              RobCo 嵌入式机器人栈的相邻买方群体，不属于同一终端用户漏斗。
            claimRefs:
              - CM009
              - CM010
              - CM013
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM013
              - CM016
      - number: '2.4'
        title: 驱动因素、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              结构性劳动力压力、回流制造和运营复杂度上升都在支撑自动化需求。Greenfield Partners 估计，到 2030 年，欧盟和美国可能有超过 200 万个制造业岗位无人填补；RobCo
              自身调查也显示美国采购意愿较强。反向因素是执行风险。传统自动化可能需要昂贵集成、稳定生产和专业支持；RobCo
              的模式试图降低这些门槛，却把硬件所有权、利用率、服务密度和重新部署风险转给供应商。公司自行发布的市场进入分析还将 OSHA、UL 和保险要求列为美国部署的守门条件，并警告客户流失、现场服务出勤和备件消耗会侵蚀
              RaaS
              经济性。在审阅合同、车队利用率、正常运行时间、服务成本、安全认证和客户群回本期之前，这些警示只能作为方向性参考，置信度较低。因此，估值应建立在经过核验、可重复的单元经济性和扩张能力上，而不是制造业总产出或未经审计的采用意愿。
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM012
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 可服务市场的分母仍然缺失
            body: 没有任何留存来源在统一口径下量化符合条件的工作流、目标工厂、年度合同价值、可实现部署能力或可服务地理范围。因此，精确的 SAM/SOM 会制造虚假精确度。
            calloutType: risk
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM008
