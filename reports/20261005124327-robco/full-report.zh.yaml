      - number: '8.2'
        title: 融资背景、入场纪律与流动性动态
        blocks:
          - type: paragraph
            body: >-
              RobCo 的资本化进程在 2026 年大幅提速 [CV001, CV002]。2026 年 1 月，公司完成 $100M C 轮融资，由 Lightspeed Venture Partners 和
              Lingotto Innovation（Exor N.V.）联合领投，Sequoia Capital、Greenfield Partners、Kindred Capital、Leitmotif 和 The
              Friedkin Group 参投，使累计股权融资达到约 $160M [CV001, CV006]。早期私人数据库曾按约 $500M 投后估值衡量 RobCo；但在 2026
              年末，公司通过将新增成长资本与员工老股转让结合的结构化交易，官方估值突破 $1B（约 €855M）[CV002, CV005, CV006]。既有投资方
              Sequoia、Lightspeed、Greenfield、Kindred、Lingotto 和 Promus Ventures，与新加入的 Cherry Ventures 及 European Tech
              Collective 一同参与 [CV002, CV005]。


              从机构投资判断看，二级流动性交易的性质让入场纪律更复杂 [CV002, CV007]。二级股份出售让早期员工和创始人兑现公司自 2020
              年成立以来创造的股权价值，但所得资金不会进入公司金库，不能用于营运资金或实体机器人车队生产 [CV002,
              CV007]。二级轮的总融资额和确切新增股权稀释并未公开披露，因此资本结构表的悬置事项和优先清算权仍未验证 [CV005, CV007]。在无法取得私人订阅留存曲线或设备融资仓储额度的情况下，以 $1B
              或更高估值基准入场；若工业资本开支放缓，下行估值倍数风险将很大 [CV002, CV006, CV007]。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV007
      - number: '8.3'
        title: 可比基准、情景分析与下行触发因素
        blocks:
          - type: paragraph
            body: >-
              RobCo 的估值基准需要综合风投支持的 Physical AI 同业、仓储机器人专业厂商和上市自动化设备供应商 [CV002, CV008]。直接可比公司 Standard Bots 于 2026 年 6 月以
              $200M C 轮融资达到 $1B 估值；Walden Robotics 则于 2026 年 7 月融资 $300M、估值 $1.1B，其机器人已在 Toyota 工厂运行，由此为先进 AI 机器人平台建立了
              $1.0B 至 $1.1B 的主流私人市场基准 [CV002]。在仓储自动化领域，英国公司 Dexory 融资 $165M，用于在全球扩展自主智能
              [CV002]。与此同时，全球工业自动化活动扩大：International Federation of Robotics（IFR）记录 2025 年安装工业机器人 603,000 台（增长 11%），并预测
              2026 年安装 655,000 台（增长 9%），显示宏观需求稳健 [CV002]。


              我们用乐观、基准和悲观三条经营路径评估 RobCo [CV002, CV007]。乐观情景下，Alfie 于 2027 年 3 月成功商业化，推动欧洲和北美的企业客户采用，年化收入运行率超过 $100M，并支撑
              $2.0B+ 估值（概率 15%）[CV002, CV005]。基准情景下，RobCo 稳步扩大机器上下料和码垛 RaaS 订阅，ARR 达到 $35M–$50M，毛利率稳定在约 45% 至 55%，合理价值为
              $600M–$800M（概率 45%）[CV006, CV007]。悲观情景下，RaaS 营运资金压力、合同续约时的客户流失和现场服务开支压缩现金续航，迫使公司以 $300M–$450M
              进行降价轮融资或结构化资本重组（概率 40%）[CV006, CV007]。在所有情景下，关键下行触发因素包括合同取消激增、Alfie 商业化延期和车队融资瓶颈 [CV002, CV007]。
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.4'
        title: 投资建议、风险评级与投资判断路线图
        blocks:
          - type: paragraph
            body: >-
              我们给 RobCo 的投资建议是低置信度跟踪，风险评级为高，估值判断偏紧 [CV002, CV006, CV007]。RobCo 的工程执行、顶级风投支持和地理扩张速度都很突出，业务已覆盖德国及美国十多个州；但在
              Alfie 计划于 2027 年商业部署之前，10 亿美元以上的二级估值已计入近乎完美的预期 [CV001, CV002, CV005]。零前期费用订阅模式把资产折旧和资产负债表压力转移给
              RobCo，带来无法通过公开申报审计的现金消耗风险 [CV004, CV007]。


              机构投资人应将成长资本投资与明确的尽调门槛绑定 [CV006, CV007]。关键尽调要求包括：(1) 审计按客户群划分的 RaaS 单位经济模型，包括安装资本开支、硬件物料清单、月度维护费和客户流失率；(2)
              审查用于车队融资的表外或银行债务仓储额度；(3) 在计划于 2027 年 3 月发布 Alfie 前，核实其现场试验表现和自主性基准；(4) 确认资本结构表中普通股与二级股份类别之间的清算优先权 [CV002,
              CV005, CV007]。任何降价轮重组、失去 BMW 等旗舰企业客户，或美国现场运营中硬件保修大幅增加，都会触发论点失效 [CV001, CV002, CV007]。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV007
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 二级流动性与一级成长资本
            body: >-
              RobCo 在 2026 年末达到 10 亿美元以上独角兽估值，靠的是员工老股转让与新增成长资本并行，而不是纯粹的公司一级融资 [CV002, CV005]。二级交易为吸引和激励 Physical AI
              工程人才提供了关键流动性，但不会扩大公司现金储备，无法为客户工厂车间内资本密集型机器人硬件提供资金 [CV002, CV007]。投资人必须区分创始人和员工股权流动性与资产负债表上的现金续航 [CV002,
              CV007]。
            calloutType: insight
            claimRefs:
              - CV002
              - CV005
              - CV007
          - type: callout
            title: 10 亿美元基准下的下行倍数脆弱性
            body: >-
              RobCo 在 2026 年 1 月 C 轮融资时估值为 5 亿美元，随后在 2026 年末二级交易中突破 10 亿美元，估值在九个月内翻倍 [CV002, CV005, CV006]。在 ARR
              未披露的情况下，即便按历史 1,000 万美元年化收入运行率做出慷慨估计，远期倍数也意味着大幅超过 20 倍至 30 倍 [CV006, CV007]。如果企业部署放缓或硬件毛利率收缩，RobCo
              将在未来股权轮中面临显著的降价轮或结构化资本重组风险 [CV002, CV007]。
            calloutType: risk
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
          - type: callout
            title: 投资入场所需的尽调条件
            body: >-
              按当前估值评估 RobCo 的机构投资人，在投资前应要求三项不可妥协的披露：(1) 多班次 RaaS 部署的客户群流失率和净收入留存率审计结果；(2) 用于车队生产的非股权债务仓储额度证明；(3)
              客户部署遥测数据，以确认 Alfie 的自主性能基准 [CV002, CV004, CV007]。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV004
              - CV007
