callouts:
  - calloutType: "insight"
    title: "Secondary Liquidity Versus Primary Growth Capital"
    body: "RobCo's achievement of a $1B+ unicorn valuation in late 2026 was executed through an employee secondary share sale alongside new growth capital, rather than a pure primary corporate financing [CV002, CV005]. While secondary transactions provide critical liquidity to attract and reward engineering talent in physical AI, they do not expand corporate cash reserves needed to fund capital-intensive robot hardware on customer factory floors [CV002, CV007]. Underwriters must differentiate between founder/staff equity liquidity and balance-sheet cash runway [CV002, CV007]."
    claimRefs:
      - "CV002"
      - "CV005"
      - "CV007"
  - calloutType: "risk"
    title: "Downside Multiple Vulnerability at $1B Benchmark"
    body: "With RobCo valued at $500M in its January 2026 Series C and subsequently surpassing $1B in late 2026 secondary trading, the company's valuation has doubled in nine months [CV002, CV005, CV006]. In the absence of disclosed ARR, even generous estimates based on historic $10M run rates imply a forward multiple well in excess of 20x-30x [CV006, CV007]. If enterprise deployments slow or hardware gross margins compress, RobCo faces significant down-round or structured recapitalization vulnerability in future equity rounds [CV002, CV007]."
    claimRefs:
      - "CV002"
      - "CV005"
      - "CV006"
      - "CV007"
  - calloutType: "recommendation"
    title: "Required Diligence Conditions for Investment Entry"
    body: "Institutional investors evaluating RobCo at current valuation levels should require three non-negotiable disclosures prior to investment: (1) audited cohort churn and net revenue retention across multi-shift RaaS installations; (2) proof of non-equity debt warehouse lines to fund fleet manufacturing; and (3) customer deployment telemetry confirming Alfie's autonomous performance benchmarks [CV002, CV004, CV007]."
    claimRefs:
      - "CV002"
      - "CV004"
      - "CV007"
