        - "Company claims a vertically integrated full-stack platform"
        - "Unknown in assigned evidence"
        - "Project page shows controls and system design; hardware ownership unclear"
        - "Requires customer-managed architecture and suppliers"
      - - Adaptation to variable work
        - "Company claims demonstration and self-learning for task-specific skills"
        - "AI positioning reported, but comparable capability is unknown"
        - "Custom controls shown; ongoing adaptation is unknown"
        - "Depends on internal engineering capacity; evidence unavailable"
      - - Deployment and service
        - "Company claims one partner for deployment, maintenance, and improvement"
        - "Deployment model unknown"
        - "Testing, training, and commissioning documented in one project"
        - "Customer coordinates delivery and support"
      - - Application proof
        - "Company names BMW, DynaEnergetics, Fabricated Extrusion, T-Systems, and Rosenberger"
        - "Walden is reported in Toyota factories; other proof is not detailed"
        - "One paint-line automation project is described"
        - "Private and site-specific"
      - - Independent comparative benchmark
        - Unknown
        - Unknown
        - Unknown
        - Unknown
    notes: >-
      This matrix records only capabilities stated in the assigned sources. Company and
      competitor claims are not treated as independent validation; unknown means no
      eligible evidence was available, not that the capability is absent.
    claimRefs: [CP003, CP004, CP005, CP006, CP011, CP013, CP016]
  - id: TP003
    title: Pricing, packaging, and control comparison
    columns:
      - Route
      - Public commercial model
      - Included scope
      - Undisclosed or uncertain term
      - Buyer implication
    rows:
      - - RobCo Robotics-as-a-Service
        - "Predictable monthly rate; company claims $0 upfront"
        - "Ownership, deployment, maintenance, and continuous improvement"
        - "Rate, minimum term, utilization formula, SLA, and discounts"
        - "Moves the entry case from CapEx toward OpEx but creates service-provider dependency"
      - - RobCo launch framing
        - "Company says customers pay when robots are running"
        - "End-to-end support and a claimed weeks-long deployment"
        - "Definition of running time and remedies for downtime"
        - "Outcome alignment is plausible but cannot be underwritten from public terms"
      - - RobCo embedded robotics
        - "Not disclosed"
        - "Hardware and AI foundation; partner retains brand and customer relationship"
        - "License, margin split, exclusivity, support, and data rights"
        - "Extends distribution while ceding the direct customer relationship"
      - - Traditional equipment purchase
        - "RobCo comparison claims $500K+ upfront before output"
        - "Purchased equipment plus separately coordinated vendors and service"
        - "Independent total-cost benchmark and residual value"
        - "Greater asset control with upfront capital and integration burden"
      - - Project integrator / internal build
        - "Unknown"
        - "Custom engineering can span design through commissioning"
        - "Project fee, change orders, lifecycle support, and internal labor"
        - "Potential customization advantage; economics cannot be compared"
    notes: >-
      All RobCo commercial terms are company-issued marketing statements, not observed
      contracts or realized prices. No eligible source disclosed rival pricing.
    claimRefs: [CP001, CP002, CP007, CP008, CP013, CP014]
figures:
  - id: FP001
    title: Evidence-constrained competitive positioning
    type: quadrant
    summary: >-
      Ordinal placement separates documented solution-scope breadth from documented
      commercial-model flexibility; it does not rank actual performance.
    data:
      points:
        - label: RobCo current platform
          x: 5
          y: 5
          detail: "Full-stack scope plus recurring and embedded models are documented by RobCo."
        - label: Standard Bots
          x: 2
          y: 1
          detail: "Industrial-robot focus is reported; breadth and commercial terms are not available."
        - label: Walden Robotics
          x: 2
          y: 1
          detail: "Toyota factory activity is reported; scope and commercial terms are not available."
        - label: Dexory
          x: 2
          y: 1
          detail: "Warehouse robotics scope is reported; commercial terms are not available."
        - label: Project integrator
          x: 4
          y: 2
          detail: "Broad custom project scope is documented; recurring or outcome pricing is not."
        - label: Traditional purchased stack
          x: 3
          y: 1
          detail: "RobCo describes multi-vendor scope and upfront purchase; no independent benchmark is available."
    approximationNotes: >-
      Analyst-authored ordinal scale: x=1 narrow or undocumented scope to x=5 documented
      full-stack scope; y=1 undisclosed or upfront model to y=5 multiple documented
      low-upfront routes. Scores describe evidence coverage and stated models, not
      measured product quality, market share, or deployment performance.
    claimRefs: [CP001, CP003, CP011, CP013, CP014, CP015, CP016]
callouts:
  - calloutType: risk
    title: No public basis for a performance winner
    body: >-
      The strongest differentiation claims come from RobCo itself, while independent
      sources establish funding and category activity rather than comparative uptime,
      cycle time, safety, intervention rate, or total cost.
    claimRefs: [CP004, CP005, CP011, CP015, CP016]
