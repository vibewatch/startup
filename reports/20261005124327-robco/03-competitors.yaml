  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: competitive-benchmark
      missingEvidence: >-
        Comparable uptime, cycle time, intervention rate, safety record, deployment time,
        and total cost for RobCo and named alternatives.
      whyItMatters: >-
        Without normalized operating data, full-stack and autonomy claims cannot be
        converted into a defensible performance advantage.
      diligencePath: >-
        Obtain cohort-level production telemetry and three reference calls, then run a
        matched-workflow benchmark against at least one integrator and one robot vendor.
      relatedQuestionRefs: [QP007]
      relatedTableRefs: [TP002]
    - type: missing-source
      severity: material
      topic: competitor-pricing
      missingEvidence: >-
        Rival list prices, realized subscription or project fees, minimum terms,
        utilization formulas, service levels, discounting, and lifecycle support costs.
      whyItMatters: >-
        RobCo's low-upfront framing cannot be compared with alternatives or translated
        into retention and margin expectations without contract economics.
      diligencePath: >-
        Collect redacted RobCo and competitor proposals for the same workflow and
        normalize five-year cost, downtime remedies, change orders, and exit terms.
      relatedQuestionRefs: [QP004, QP005]
      relatedTableRefs: [TP003]
    - type: enumeration-incomplete
      severity: material
      topic: competitor-landscape
      missingEvidence: >-
        A complete geography- and application-specific roster of robot OEMs, integrators,
        internal-build suppliers, and emerging physical-AI entrants considered in deals.
      whyItMatters: >-
        The assigned pool names only a sample, so omitted incumbents or local channel
        leaders could change the apparent competitive density.
      diligencePath: >-
        Review the last 20 won and lost opportunities, record every alternative named by
        the buyer, and reconcile the roster with distributor and integrator pipelines.
      relatedQuestionRefs: [QP001]
      relatedTableRefs: [TP001]
    - type: stale
      severity: minor
      topic: scale
      missingEvidence: >-
        Dated and methodologically transparent RobCo revenue, employee, cumulative
        funding, cash, and deployment counts.
      whyItMatters: >-
        Owler's undated estimates predate or fail to reconcile with the January 2026
        financing and cannot support current scale comparisons.
      diligencePath: >-
        Request management accounts, current headcount by function, financing proceeds
        and uses, cash balances, and live deployments as of the run date.
      relatedQuestionRefs: [QP002]
