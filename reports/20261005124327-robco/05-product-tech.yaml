chapter:
  number: 5
  title: "Product & Technology"
  summary: "RobCo engineers a vertically integrated industrial automation platform coupling reconfigurable modular robot hardware with a Physical AI software stack. Its modular architecture features decentralized joint controllers, standardized mechanical and electrical bus interfaces, and automated module detection, while its commercial portfolio spans turnkey integrated solutions, embedded OEM co-development, and Alfie, a bimanual self-learning robot scheduled for commercial release in 2027."
sections:
  - id: "product-definition-and-modular-hardware"
    title: "Product Definition and Modular Hardware Architecture"
    body: "RobCo delivers an industrial automation platform designed to lower deployment friction and capital requirements for manufacturing facilities [CE001, CE003]. At the hardware foundation, the system is engineered around a scalable modular architecture where kinematic assemblies are constructed by interconnecting discrete functional modules [CE002, CE007]. Rather than deploying a monolithic, fixed-geometry robotic arm, customer workcells are configured using a base drive unit secured to the factory foundation, intermediary link modules, drive modules, and application-specific end effector flanges [CE002, CE008]. Each actuator module integrates its own built-in drive and control electronics, operating alongside dedicated sensor modules that capture environmental and process telemetry for real-time adaptive motion control [CE002, CE008]. Standardized connecting terminals handle simultaneous physical coupling and electrical transmission of power and data buses [CE002]. When a new module is physically attached and the system is powered on, RobCo's system architecture automatically detects, parameterizes, and initializes the module into the active kinematic model without manual joint calibration [CE002, CE007]. This modular assembly model allows mid-sized manufacturers to re-deploy and reconfigure physical robot geometries as factory product mixes and cycle times evolve [CE001, CE003]."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE007"
      - "CE008"
    tableRefs:
      - "TE001"
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "software-stack-physical-ai-and-workflow"
    title: "Software Stack, Control Architecture, and Physical AI"
    body: "RobCo's computational architecture implements a decentralized control principle paired with centralized coordination [CE002, CE004]. A central processing unit designated as the control unit handles high-level sensor data processing, global motion planning, and external industrial communications, while individual module controllers execute closed-loop motor actuation independently at each joint [CE002, CE008]. In heavy-duty configurations requiring expanded electrical capacity, an auxiliary power unit (BD193) provides supplemental drive power while relying on the primary control unit for processing [CE002]. Above the low-level motion kernel, RobCo provides RobFlow for robotic cell workflow orchestration, complemented by standard industrial fieldbus interfaces including Profinet, ROS 2, and real-time streaming interfaces that enable driving the manipulator directly from programmable logic controllers (PLCs) or external code [CE004, CE011]. RobCo's higher-level Physical AI stack introduces perception, motion planning, and self-learning capabilities that allow robots to acquire task-specific skills through demonstration and automated trial rather than manual line-by-line programming [CE005, CE006]. The software interface provides graphical movement visualization, module parameterization, kinematic simulation, and fault diagnostics, presenting a unified control plane across heterogeneous factory automation tasks [CE002, CE005]."
    claimRefs:
      - "CE002"
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE008"
      - "CE011"
    tableRefs:
      - "TE002"
  - id: "commercial-maturity-safety-and-technical-risks"
    title: "Commercial Offerings, Safety Controls, and Technical Risks"
    body: "RobCo packages its technology into three primary commercial vectors: turnkey Integrated Solutions, Embedded Robotics, and Alfie [CE001, CE009]. Integrated Solutions deliver single-source automation across machine tending, palletizing, dispensing, and welding under a Robotics-as-a-Service operating framework with zero upfront capital expenditure [CE001, CE005]. Under the Embedded Robotics program, original equipment manufacturers (OEMs) co-develop branded machinery atop RobCo's field-validated modular hardware and AI stack, preserving their brand sovereignty while adopting RobCo's motion foundation [CE001, CE003]. At the technology frontier, RobCo is developing Alfie, an autonomous industrial robot pairing bimanual manipulation with self-learning Physical AI to tackle unstructured and safety-critical production tasks; commercial release is scheduled for March 2027 at the RobCoN summit in Munich [CE001, CE009, CE010]. From a functional safety perspective, RobCo's modular robots incorporate built-in safety functions complying with ISO 10218-1:2025 [CE002, CE012]. Crucially, the system does not include power and force limiting (PFL) safety functions, meaning risk mitigation via PFL is prohibited and deployments requiring collaborative human-robot contact are excluded without external safeguarding [CE002, CE012]. Hand-guided control and reduced-speed manual mode are unified into a single operating mode, restricting danger zone entry during manual operation strictly to designated operators [CE002]."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE005"
      - "CE009"
      - "CE010"
      - "CE012"
