callouts:
  - calloutType: "insight"
    title: "Decentralized Kinematics With Plug-and-Play Reconfigurability"
    body: "RobCo's primary technical moat lies in its modular hardware connection architecture. By embedding decentralized drive electronics directly within each joint module and utilizing standardized electromechanical connecting terminals, newly attached modules are automatically detected and parameterized upon power-up. This eliminates manual kinematics calibration and allows industrial plants to adapt manipulator reach and payload as production needs shift."
    claimRefs:
      - "CE002"
      - "CE007"
      - "CE008"
  - calloutType: "risk"
    title: "Absence of Power and Force Limiting Excludes Cage-Free Cobot Use"
    body: "Official product documentation specifies that RobCo's modular robots adhere to ISO 10218-1:2025 but explicitly lack power and force limiting (PFL) safety functions. Deployments cannot rely on PFL to mitigate collision hazards, meaning RobCo manipulators cannot operate as unshielded collaborative robots in direct contact with workers. Facilities must install optical fences, physical guarding, or virtual safety zones, constraining footprints in dense factory aisles."
    claimRefs:
      - "CE002"
      - "CE012"
