company:
  name: "RobCo"
chapter:
  number: 7
  title: "Risks"
  summary: "RobCo's disclosed full-stack, zero-upfront Robotics-as-a-Service model concentrates hardware, software, deployment, maintenance, and financing execution inside one provider. The assigned evidence supports meaningful scale and a funded 2027 product milestone, but it does not establish target-specific safety certification, cyber and reliability history, unit economics, cash availability, or customer concentration; even the adverse-search results require careful entity disambiguation."
sections:
  - id: "evidence-perimeter-and-legal-attribution"
    title: "Evidence Perimeter and Legal Attribution"
    body: "The adverse-search pool is unusually vulnerable to false attribution. Two allocated Reddit results concern the fictional Fallout corporation or a game modification, not the Munich industrial-robotics company, while the federal complaint names a Louisiana limited liability company that allegedly owns a Kenner shopping center [CR001, CR002]. A further result on robco.technology describes a paint-line automation project but does not connect that issuer to the target at rob.co [CR003]. These records are useful as evidence of entity-resolution risk, not evidence of poor product quality or litigation involving the target. The public-source record reviewed here therefore cannot establish that RobCo has no litigation, enforcement, safety, privacy, or cybersecurity exposure; target legal names, subsidiaries, and jurisdiction-specific dockets remain mandatory diligence inputs [CR016]."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR016"
    tableRefs:
      - "TR001"
  - id: "operational-and-product-execution"
    title: "Operational and Product Execution"
    body: "RobCo says it has been vertically integrated from day one and develops hardware and software as one full-stack platform [CR004]. Its website also positions the company as the single provider that designs, deploys, maintains, and continuously improves each cell [CR005]. That architecture may simplify customer procurement, but it creates correlated execution exposure: a hardware defect, software failure, integration delay, spare-parts shortage, or field-service bottleneck can all impair the same subscription relationship [CR013]. The scaling burden is material because company-issued evidence places operations in San Francisco and Austin and names several deployed industrial customers, while independent reporting says customer operations span more than a dozen US states [CR007, CR008, CR009]. No assigned source supplies uptime, incident, repair-time, service-capacity, or independent safety-performance data [CR016]."
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR013"
      - "CR016"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "financial-model-and-dependencies"
    title: "Financial Model and Dependencies"
    body: "The zero-upfront offer is a customer benefit and a financing obligation. RobCo says customers pay a predictable monthly rate while RobCo owns, deploys, maintains, and improves the robotics [CR005, CR006]. That model shifts asset funding, utilization, uptime, and service-cost exposure toward RobCo, so customer adoption alone does not establish attractive unit economics [CR014]. The company announced a $100 million Series C for its product roadmap, enterprise deployments, and US expansion, but funding raised is not the same as cash currently available or runway [CR012]. Independent reporting later described a transaction combining new investment with employee secondary liquidity and a valuation above $1 billion; it did not disclose the primary-versus-secondary split or operating liquidity [CR011]. The assigned sources contain no burn, gross-margin, payback, loss-rate, working-capital, or concentration data [CR016]."
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR011"
      - "CR012"
      - "CR014"
      - "CR016"
    tableRefs:
      - "TR003"
  - id: "ranking-mitigation-and-kill-criteria"
    title: "Ranking, Mitigation, and Kill Criteria"
    body: "The highest residual risks are the coupled full-stack service obligation, the economics of RobCo-financed deployments, and the absence of independent target-specific safety, security, and reliability proof [CR013, CR014, CR016]. The most visible dated execution test is Alfie: independent reporting describes a commercial launch planned for March 4, 2027, making readiness and post-launch conversion forward-looking dependencies rather than evidence of current commercial availability [CR010, CR015]. Before investment, management should provide legal-entity schedules, certification dossiers, incident and uptime logs, service-level performance, fleet financing, cohort economics, and customer concentration. Thesis-break triggers should include an unexplained missed Alfie launch, inability to substantiate safe production operation, recurring service failures without improving repair times, or deployment growth that remains dependent on negative post-service unit economics."
    claimRefs:
      - "CR010"
      - "CR013"
      - "CR014"
      - "CR015"
      - "CR016"
