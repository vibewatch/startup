evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-traction
    missingEvidence: >-
      Audited financial statements or verified management accounts disclosing current ARR, subscription contract
      lengths, and gross margins.
    whyItMatters: >-
      Without ARR and gross margin data, underwriting RobCo's $1.0B+ secondary valuation relies exclusively on private
      fundraising marks rather than fundamental operating cash flow.
    diligencePath: >-
      Request confidential subscription cohort schedules, audited income statements, and SaaS retention metrics under
      NDA.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: installed-fleet-count
    missingEvidence: Exact global active deployed robot cell count broken down across European and U.S. client production lines.
    whyItMatters: >-
      Deployment totals differentiate whether customer references represent limited factory pilot cells or full-scale
      facility automation commitments.
    diligencePath: Request fleet deployment telemetry and customer contract schedules during technical diligence.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-size
    missingEvidence: >-
      A bottom-up count of eligible sites and workflows by geography, paired with supported annual contract values,
      deployment capacity, and attainable penetration.
    whyItMatters: >-
      Without common denominators, broad manufacturing and robot-installation metrics cannot establish RobCo's SAM or
      SOM.
    diligencePath: >-
      Obtain management's market model and reconcile site counts, workflow eligibility, pricing, deployment throughput,
      churn, and capacity to customer contracts and fleet data.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: automation-survey
    missingEvidence: >-
      Survey sample size, respondent roles, company-size mix, fieldwork dates, question wording, weighting, and the
      underlying response distribution.
    whyItMatters: >-
      The reported 61%, 95%, and 42% figures cannot be assessed for representativeness or converted into demand without
      the survey methodology.
    diligencePath: >-
      Request the complete RobCo survey instrument and data tables, then compare results with an independent
      manufacturing automation survey.
    relatedQuestionRefs:
      - QM004
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: raas-economics
    missingEvidence: >-
      Cohort-level contract value, gross margin, utilization, uptime, churn, redeployment time, field-service cost,
      spare-parts cost, and customer payback.
    whyItMatters: >-
      Demand growth may not create durable value if hardware ownership and service obligations consume the recurring
      revenue economics.
    diligencePath: >-
      Review anonymized contracts and monthly fleet cohorts, then interview customers about procurement, uptime,
      realized savings, renewal, and expansion.
    relatedQuestionRefs:
      - QM007
  - type: private-evidence-only
    severity: material
    topic: competitive-benchmark
    missingEvidence: >-
      Comparable uptime, cycle time, intervention rate, safety record, deployment time, and total cost for RobCo and
      named alternatives.
    whyItMatters: >-
      Without normalized operating data, full-stack and autonomy claims cannot be converted into a defensible
      performance advantage.
    diligencePath: >-
      Obtain cohort-level production telemetry and three reference calls, then run a matched-workflow benchmark against
      at least one integrator and one robot vendor.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: competitor-pricing
    missingEvidence: >-
      Rival list prices, realized subscription or project fees, minimum terms, utilization formulas, service levels,
      discounting, and lifecycle support costs.
    whyItMatters: >-
      RobCo's low-upfront framing cannot be compared with alternatives or translated into retention and margin
      expectations without contract economics.
    diligencePath: >-
      Collect redacted RobCo and competitor proposals for the same workflow and normalize five-year cost, downtime
      remedies, change orders, and exit terms.
    relatedQuestionRefs:
      - QP004
      - QP005
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: material
    topic: competitor-landscape
    missingEvidence: >-
      A complete geography- and application-specific roster of robot OEMs, integrators, internal-build suppliers, and
      emerging physical-AI entrants considered in deals.
    whyItMatters: >-
      The assigned pool names only a sample, so omitted incumbents or local channel leaders could change the apparent
      competitive density.
    diligencePath: >-
      Review the last 20 won and lost opportunities, record every alternative named by the buyer, and reconcile the
      roster with distributor and integrator pipelines.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
