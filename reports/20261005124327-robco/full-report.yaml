              - CP008
              - CP013
              - CP014
      - number: '3.4'
        title: Capital and category convergence limit confidence in moat durability
        blocks:
          - type: paragraph
            body: >-
              The $100 million Series C announced in January 2026 gives RobCo resources to develop autonomy and expand
              in the United States, but funding raised is not cash available and does not establish product leadership.
              Independent coverage reports similarly large financings for Standard Bots, Walden Robotics, and Dexory,
              while broader reporting describes heavy capital inflows into physical AI. RobCo's planned 2027 commercial
              launch of Alfie also means an important autonomy claim is still forward-looking. The moat case therefore
              rests on whether deployed cells accumulate proprietary learning, retain customers through service quality,
              and expand across workflows faster than funded entrants or incumbent integrators can respond; the public
              pool does not resolve those tests.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP015
              - CP016
