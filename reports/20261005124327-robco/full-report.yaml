      - - Product & Physical AI
        - >-
          Modular snap-together arms and self-learning Physical AI enable rapid deployment; Alfie promises bimanual
          autonomy in 2027.
        - >-
          High-mix unstructured tasks remain technically difficult; self-learning claims require ongoing engineering
          field intervention.
        - Independently verified autonomous task completion rates without human programmer intervention.
      - - Commercial & RaaS Model
        - >-
          Zero-upfront RaaS subscription eliminates customer CapEx friction, unlocking predictable recurring software
          and hardware revenues.
        - >-
          RaaS shifts asset depreciation and balance-sheet financing onto RobCo, causing heavy cash burn as fleet
          expands.
        - Establishment of dedicated non-dilutive bank debt facilities for hardware lease financing.
      - - Competitive Moat
        - >-
          Full-stack vertical integration across hardware and AI operating system; field footprint across more than a
          dozen US states.
        - >-
          Fierce competition from Standard Bots ($1B valuation), Walden Robotics ($1.1B valuation), and legacy giants
          (FANUC, KUKA, ABB).
