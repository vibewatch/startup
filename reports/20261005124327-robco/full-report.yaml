      - number: '1.3'
        title: Capitalization, Scale Metrics, and Valuation Trajectory
        blocks:
          - type: paragraph
            body: >-
              RobCo’s capital structure has expanded rapidly through consecutive institutional financing rounds and
              secondary transactions [CO001, CO007]. In January 2026, the company announced an $85 million (€85M) to
              $100 million Series C financing round co-led by Lightspeed Venture Partners and Lingotto Innovation, with
              participation from Sequoia Capital, Greenfield Partners, Kindred Capital, Leitmotif, and The Friedkin
              Group [CO001, CO006]. This followed earlier institutional equity rounds including a Series A round led by
              Sequoia Capital in December 2022 and Series B financing led by Lightspeed in February 2024 [CO001, CO009].
              In late 2026, RobCo surpassed a $1 billion valuation through a structured transaction combining fresh
              capital with an employee secondary share sale, formally establishing unicorn status and doubling its
              valuation mark within nine months [CO007, CO010]. New backers participating in this transaction included
              Cherry Ventures and the European Tech Collective [CO007].


              Operational scale has accelerated in tandem with capitalization, with deployments extending across
              European manufacturing centers and more than a dozen U.S. states [CO005, CO007]. Named customer
              deployments span premier industrial manufacturers such as BMW, Rosenberger, T-Systems International,
              Fabricated Extrusion Company, and DynaEnergetics [CO001, CO002]. Headcount reached approximately 202
              employees by mid-2026, expanding across Munich headquarters, an Austin assembly facility, and a San
              Francisco laboratory [CO007, CO009]. However, private commercial traction metrics—specifically Annual
              Recurring Revenue (ARR), monthly cash burn rates, gross margins, and total deployed robot unit
              counts—remain undisclosed by company management, representing primary diligence verification priorities
              [CO011, CO012].
