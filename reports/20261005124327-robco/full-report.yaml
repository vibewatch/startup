chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Business Model
        blocks:
          - type: paragraph
            body: >-
              RobCo is an autonomous industrial robotics enterprise headquartered in Munich, Germany, with operating
              presences in San Francisco, California, and Austin, Texas [CO001, CO005]. Founded in 2020 as a spin-out
              from the Chair of Robotics and Artificial Intelligence at the Technical University of Munich (TUM) by
              Roman Hölzl, Paul Maroldt, and Constantin Dresel, the company engineers modular, reconfigurable robotic
              hardware combined with a cloud-connected physical AI software stack [CO001, CO006]. While certain
              third-party company registry aggregators cite a 2013 genesis or December 2019 legal registration under
              RobCo GmbH, commercial operations and formal spin-out identity trace to 2020 [CO001, CO009]. RobCo targets
              industrial manufacturing, specifically addressing severe skilled labor shortages and reshoring pressures
              across small and medium-sized enterprises (SMEs) and large original equipment manufacturers (OEMs) [CO002,
              CO008].


              The company’s core commercial offering is delivered through an end-to-end Robotics-as-a-Service (RaaS)
              operational expenditure model, eliminating the six- to seven-figure upfront capital expenditure and
              third-party systems integration burdens traditionally associated with industrial automation [CO002,
              CO008]. RobCo designs, deploys, maintains, and continuously updates the entire robotic cell under
              predictable monthly subscription fees [CO002]. Its product portfolio spans turnkey Integrated Solutions
              for standardized high-mix tasks like machine tending, palletizing, dispensing, and welding; Embedded
              Robotics for co-developing OEM hardware solutions; and Alfie, its next-generation autonomous robot
              designed to tackle unstructured, variable production workflows via self-learning physical AI [CO002,
              CO004, CO007].
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
