      - number: '3.3'
        title: Subscription and embedded routes attack different control points
        blocks:
          - type: paragraph
            body: >-
              RobCo markets a predictable monthly Robotics-as-a-Service payment with no upfront equipment purchase,
              while its launch material says customers pay when robots are running and can deploy within weeks. These
              are company claims, and neither contract duration nor utilization formula, service-level commitment,
              discounting, or realized price is disclosed. RobCo also offers an embedded route under which a partner
              keeps brand sovereignty and the customer relationship while using RobCo's hardware and AI foundation. That
              can widen distribution, but it also shifts customer ownership to the partner and may make channel
              economics and dependency as important as product capability.
            claimRefs:
              - CP001
              - CP002
