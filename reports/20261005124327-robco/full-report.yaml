      - number: '5.2'
        title: Software Stack, Control Architecture, and Physical AI
        blocks:
          - type: paragraph
            body: >-
              RobCo's computational architecture implements a decentralized control principle paired with centralized
              coordination [CE002, CE004]. A central processing unit designated as the control unit handles high-level
              sensor data processing, global motion planning, and external industrial communications, while individual
              module controllers execute closed-loop motor actuation independently at each joint [CE002, CE008]. In
              heavy-duty configurations requiring expanded electrical capacity, an auxiliary power unit (BD193) provides
              supplemental drive power while relying on the primary control unit for processing [CE002]. Above the
              low-level motion kernel, RobCo provides RobFlow for robotic cell workflow orchestration, complemented by
              standard industrial fieldbus interfaces including Profinet, ROS 2, and real-time streaming interfaces that
              enable driving the manipulator directly from programmable logic controllers (PLCs) or external code
              [CE004, CE011]. RobCo's higher-level Physical AI stack introduces perception, motion planning, and
              self-learning capabilities that allow robots to acquire task-specific skills through demonstration and
              automated trial rather than manual line-by-line programming [CE005, CE006]. The software interface
              provides graphical movement visualization, module parameterization, kinematic simulation, and fault
              diagnostics, presenting a unified control plane across heterogeneous factory automation tasks [CE002,
              CE005].
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE006
              - CE008
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE009
              - CE012
      - number: '5.3'
        title: Commercial Offerings, Safety Controls, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              RobCo packages its technology into three primary commercial vectors: turnkey Integrated Solutions,
              Embedded Robotics, and Alfie [CE001, CE009]. Integrated Solutions deliver single-source automation across
              machine tending, palletizing, dispensing, and welding under a Robotics-as-a-Service operating framework
              with zero upfront capital expenditure [CE001, CE005]. Under the Embedded Robotics program, original
              equipment manufacturers (OEMs) co-develop branded machinery atop RobCo's field-validated modular hardware
              and AI stack, preserving their brand sovereignty while adopting RobCo's motion foundation [CE001, CE003].
              At the technology frontier, RobCo is developing Alfie, an autonomous industrial robot pairing bimanual
              manipulation with self-learning Physical AI to tackle unstructured and safety-critical production tasks;
              commercial release is scheduled for March 2027 at the RobCoN summit in Munich [CE001, CE009, CE010]. From
              a functional safety perspective, RobCo's modular robots incorporate built-in safety functions complying
              with ISO 10218-1:2025 [CE002, CE012]. Crucially, the system does not include power and force limiting
              (PFL) safety functions, meaning risk mitigation via PFL is prohibited and deployments requiring
              collaborative human-robot contact are excluded without external safeguarding [CE002, CE012]. Hand-guided
              control and reduced-speed manual mode are unified into a single operating mode, restricting danger zone
              entry during manual operation strictly to designated operators [CE002].
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE009
              - CE010
              - CE012
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Decentralized Kinematics With Plug-and-Play Reconfigurability
            body: >-
              RobCo's primary technical moat lies in its modular hardware connection architecture. By embedding
              decentralized drive electronics directly within each joint module and utilizing standardized
              electromechanical connecting terminals, newly attached modules are automatically detected and
              parameterized upon power-up. This eliminates manual kinematics calibration and allows industrial plants to
              adapt manipulator reach and payload as production needs shift.
            calloutType: insight
            claimRefs:
              - CE002
              - CE007
              - CE008
          - type: callout
            title: Absence of Power and Force Limiting Excludes Cage-Free Cobot Use
            body: >-
              Official product documentation specifies that RobCo's modular robots adhere to ISO 10218-1:2025 but
              explicitly lack power and force limiting (PFL) safety functions. Deployments cannot rely on PFL to
              mitigate collision hazards, meaning RobCo manipulators cannot operate as unshielded collaborative robots
              in direct contact with workers. Facilities must install optical fences, physical guarding, or virtual
              safety zones, constraining footprints in dense factory aisles.
            calloutType: risk
            claimRefs:
              - CE002
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Target Profiles
        blocks:
          - type: paragraph
            body: >-
              RobCo segments its industrial customer base across discrete manufacturing sectors where acute technical
              labor shortages, repetitive production bottlenecks, and reshoring imperatives drive urgent automation
              demand [CU001, CU002, CU006]. The company's primary target segments encompass mid-sized contract
              manufacturers, automotive tier-1 and tier-2 suppliers, electronics and precision machining producers, and
              consumer packaging operations [CU002, CU004, CU007]. Economic buyers are typically plant managers, vice
              presidents of manufacturing operations, or managing directors who face persistent recruiting shortfalls
              for unglamorous second- and third-shift factory tasks [CU002, CU005, CU006]. By providing turnkey robotics
              under an operating-expense Robotics-as-a-Service model with zero upfront capital expenditure, RobCo
              removes the traditional six-to-seven-figure budgetary hurdle and multi-vendor systems integration
              complexity that historically blocked smaller factories from deploying robotic workcells [CU002, CU004,
              CU006]. The technical users interacting with the deployed cells are on-site line operators, cell
              supervisors, and shop-floor technicians who configure workflows through intuitive no-code teaching
              interfaces rather than writing complex low-level code, thereby insulating customer operations from the
              scarcity of specialized robotics programmers [CU002, CU003, CU005].
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU001
