      - number: '3.2'
        title: Integration breadth is the clearest claimed differentiator
        blocks:
          - type: paragraph
            body: >-
              RobCo says it has developed hardware and software together as a full-stack platform, and its public
              offering combines hardware, software, integration, deployment, service, and continuous improvement. It
              further claims that robots can acquire task-specific skills through demonstration and self-learning rather
              than manual programming. Those attributes could reduce coordination and reprogramming friction relative to
              a multi-vendor cell, but the assigned evidence contains no independent cycle-time, uptime,
              intervention-rate, safety, or adaptation benchmark. Named deployments demonstrate claimed production
              reach, not comparative performance. Unsupported competitor cells are consequently marked unknown rather
              than scored as inferior.
            claimRefs:
