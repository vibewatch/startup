      - number: '7.3'
        title: Financial Model and Dependencies
        blocks:
          - type: paragraph
            body: >-
              The zero-upfront offer is a customer benefit and a financing obligation. RobCo says customers pay a
              predictable monthly rate while RobCo owns, deploys, maintains, and improves the robotics [CR005, CR006].
              That model shifts asset funding, utilization, uptime, and service-cost exposure toward RobCo, so customer
              adoption alone does not establish attractive unit economics [CR014]. The company announced a $100 million
              Series C for its product roadmap, enterprise deployments, and US expansion, but funding raised is not the
              same as cash currently available or runway [CR012]. Independent reporting later described a transaction
              combining new investment with employee secondary liquidity and a valuation above $1 billion; it did not
              disclose the primary-versus-secondary split or operating liquidity [CR011]. The assigned sources contain
              no burn, gross-margin, payback, loss-rate, working-capital, or concentration data [CR016].
            claimRefs:
              - CR005
              - CR006
              - CR011
              - CR012
              - CR014
              - CR016
