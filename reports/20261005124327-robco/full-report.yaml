  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing
        blocks:
          - type: paragraph
            body: >-
              RobCo describes Integrated Solutions as an end-to-end Robotics-as-a-Service offering with zero upfront
              capital expenditure. Its website says customers pay a predictable monthly rate while RobCo owns, deploys,
              maintains, and improves the robotics. Teardown adds a more specific but uncorroborated commercial detail:
              it reports that customers are billed only for hours the robot is running and that pricing is quoted per
              application because no public rate card exists. This structure could create recurring revenue, but the
              assigned evidence does not establish contract duration, minimum commitments, realized price, renewal,
              discounts, or revenue recognition. RobCo also markets Embedded Robotics co-development, yet no source
              discloses whether that offer produces license, engineering, royalty, or hardware revenue. Revenue mix
              therefore remains unquantified rather than demonstrably subscription-dominant.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI006
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI006
      - number: '4.2'
        title: Cost Structure and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              RobCo says it develops hardware and software as one vertically integrated platform. Combined with company
              ownership of deployed systems, that model places hardware procurement, assembly, deployment, maintenance,
              and uptime exposure on RobCo rather than transferring all equipment risk to the customer at delivery.
              Teardown specifically argues that ownership requires investment in reliability, remote monitoring, and
              field service. The main gross-margin variables are therefore fleet utilization, equipment life,
              redeployment cost, failure and service frequency, installation labor, and contract duration. None is
              quantified in the assigned sources. The economics cannot be underwritten from recurring billing language
              alone: a monthly payment is not evidence of attractive payback, and a deployed robot is not evidence of
              recognized revenue. Cohort-level cash payback and contribution margin are required to test whether growth
              compounds cash generation or consumes additional financing.
            claimRefs:
              - CI002
              - CI005
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI010
              - CI011
              - CI012
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI002
              - CI005
              - CI010
              - CI011
      - number: '4.3'
        title: Traction and Sales-Efficiency Evidence
        blocks:
          - type: paragraph
            body: >-
              The only revenue quantity in the assigned evidence is historical and indirect: Teardown reports that
              Forbes described revenue as approaching $10 million in February 2024. The same analysis reports
              approximately 1,000 modules deployed at more than 100 customers at that time. These figures are useful
              evidence of early commercialization, but they do not establish 2026 revenue, ARR, active paying robots,
              retention, utilization, or customer concentration. RobCo's 2026 release identifies deployments at BMW,
              DynaEnergetics, Fabricated Extrusion Company, T-Systems, and Rosenberger, but provides neither contract
              values nor deployment counts by customer. No assigned source quantifies CAC, sales cycle, sales
              productivity, payback, channel economics, or expansion revenue. Logo quality and installed modules
              therefore should not be converted into a sales-efficiency conclusion without customer-level bookings and
              cohort evidence.
            claimRefs:
              - CI004
              - CI007
              - CI008
              - CI012
      - number: '4.4'
        title: Capital Adequacy and Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              RobCo announced a $100 million Series C in January 2026 for its Physical AI roadmap, enterprise
              deployments, and U.S. expansion. That is funding raised, not revenue, cash available, or runway. In
              October, Tech Funding News reported that a transaction combined new investment with employee secondary
              liquidity, while Trending Topics reported that RobCo did not disclose how much money was raised. The
              primary proceeds and secondary component therefore cannot be separated from public evidence. FundedIQ
              records only the $100 million Series C in its database, demonstrating that its stated total is a
              coverage-limited record rather than a complete capital history. With cash, burn, debt, fleet-financing
              facilities, and capital commitments undisclosed, capital adequacy is not measurable. The financial verdict
              is consequently cautious: financing access appears strong, while revenue quality, margin path, capital
              intensity, and next-round dependence remain material underwriting blockers.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding is not runway
            body: >-
              The disclosed $100 million round and later valuation transaction do not reveal unrestricted cash, monthly
              burn, primary proceeds from the October transaction, debt obligations, or fleet-financing capacity.
            calloutType: risk
            claimRefs:
