      - number: '6.3'
        title: Named Customer Proof, Enterprise Deployments, and Reference Quality
        blocks:
          - type: paragraph
            body: >-
              Publicly confirmed customer accounts validate RobCo's ability to operate in demanding Tier-1 manufacturing
              and technology environments, though public disclosures blend scaled production references with in-progress
              multi-plant rollouts [CU002, CU003, CU004]. At premier German industrial accounts, customer validation is
              evidenced by production usage: Georg Grabner, Vice President of CNC Machining Technology at Rosenberger,
              confirmed deploying RobCo systems to automate precision machining workflows [CU004]. Similarly, Thomas
              Jenne, Vice President and Head of Automotive & Manufacturing at T-Systems International, cited the
              deployment of RobCo's modular robots and autonomous AI software platform within Industry X manufacturing
              client cells [CU004]. Automation integrator and machine builder Tiskens Steuerungs- und Antriebstechnik
              actively partners with RobCo to deliver modular robotic cells to end customers [CU004]. Among prominent
              automotive manufacturing enterprises, BMW Group is listed as a major production client, alongside
              industrial materials supplier DynaEnergetics and food manufacturer DE-VAU-GE [CU002, CU003]. In the United
              States, Wildpack Beverage is actively collaborating with RobCo to automate labor-intensive packaging and
              canning lines, although the customer explicitly noted the engagement remains in progress toward full
              operational impact [CU002]. These named references establish credible technical feasibility across CNC
              machine tending, palletizing, dispensing, and welding, but commercial contracts remain bilateral and
              detailed unit economics or multi-facility expansion ratios are guarded under confidentiality [CU002,
              CU003, CU004].
            claimRefs:
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
              - CU004
      - number: '6.4'
        title: Retention Durability, Expansion Friction, and Concentration Exposures
        blocks:
          - type: paragraph
            body: >-
              Evaluating RobCo's customer durability requires assessing the structural mechanics of
              Robotics-as-a-Service in industrial settings [CU002, CU004, CU006]. The core value proposition of
              RaaS—aligning vendor revenue with ongoing robot uptime under predictable monthly operating
              expenses—greatly reduces initial customer friction and accelerates initial adoption [CU002, CU004].
              Furthermore, RobCo is developing internal agentic workflows across project solution delivery—from
              automated requirements intake and engineering checks to operational risk scoring—to streamline customer
              cell commissioning and lower delivery friction [CU001]. Nevertheless, RaaS contracts expose RobCo to
              substantial counterparty, utilization, and customer concentration risks [CU002, CU009, CU010]. Because
              customers subscribe rather than purchasing equipment outright, any severe downturn in a client's factory
              production volume, seasonal canning line stoppage, or shift cancellation can trigger contract
              renegotiations or return of hardware, stranding depreciating robotic assets on RobCo's balance sheet
              [CU002, CU006, CU010]. Crucially, RobCo has not publicly disclosed Net Revenue Retention (NRR), Gross
              Revenue Retention (GRR), cohort churn rates, average contract durations, or the revenue share generated by
              its top five customer accounts [CU009, CU010, CU011]. Unlocking high-margin fleet expansion also hinges on
              the commercial release of Alfie, scheduled for March 2027, leaving near-term expansion dependent on
              standardized robotic arms [CU007, CU008, CU012].
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: De-risking Industrial Adoption via Zero-CapEx Robotics-as-a-Service
            body: >-
              RobCo's primary commercial catalyst is inverting the traditional industrial robotics purchasing paradigm.
              By eliminating upfront capital expenditure and providing fully integrated modular cells under an
              operational monthly subscription, RobCo overcomes the internal budget hurdles that typically stall factory
              automation investments in mid-market manufacturing.
            calloutType: insight
            claimRefs:
              - CU002
              - CU004
              - CU006
          - type: callout
            title: Balance-Sheet Asset Exposure from RaaS Hardware Retention
            body: >-
              While Robotics-as-a-Service dramatically accelerates customer acquisition, it shifts equipment
              capitalization and asset depreciation directly onto RobCo's balance sheet. If industrial customers face
              cyclical demand contractions or cancel subscription contracts, RobCo must absorb the carrying costs and
              redeployment friction of returned hardware, necessitating substantial equity capitalization.
            calloutType: risk
            claimRefs:
              - CU002
              - CU006
              - CU010
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Evidence Perimeter and Legal Attribution
        blocks:
          - type: paragraph
            body: >-
              The adverse-search pool is unusually vulnerable to false attribution. Two allocated Reddit results concern
              the fictional Fallout corporation or a game modification, not the Munich industrial-robotics company,
              while the federal complaint names a Louisiana limited liability company that allegedly owns a Kenner
              shopping center [CR001, CR002]. A further result on robco.technology describes a paint-line automation
              project but does not connect that issuer to the target at rob.co [CR003]. These records are useful as
              evidence of entity-resolution risk, not evidence of poor product quality or litigation involving the
              target. The public-source record reviewed here therefore cannot establish that RobCo has no litigation,
              enforcement, safety, privacy, or cybersecurity exposure; target legal names, subsidiaries, and
              jurisdiction-specific dockets remain mandatory diligence inputs [CR016].
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR016
