  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive set is broader than robot vendors
        blocks:
          - type: paragraph
            body: >-
              Buyers can solve the automation job through RobCo's integrated service, a funded industrial-robot entrant,
              a warehouse-focused adjacent platform, a project integrator, or an internal engineering program assembled
              from purchased equipment. Independent coverage names Standard Bots, Walden Robotics, and Dexory as
              increasingly well-funded rivals, but the three address different application boundaries. A separate
              automation provider's project description illustrates the incumbent integrator alternative: design,
              electrical engineering, cabinet prefabrication, controls, testing, training, and commissioning can be
              procured as one custom project. The resulting contest is therefore over operating model, deployment
              ownership, and application fit, not a single interchangeable robot specification.
            claimRefs:
              - CP011
              - CP013
              - CP015
              - CP016
