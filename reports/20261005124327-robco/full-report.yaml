      - number: '7.2'
        title: Operational and Product Execution
        blocks:
          - type: paragraph
            body: >-
              RobCo says it has been vertically integrated from day one and develops hardware and software as one
              full-stack platform [CR004]. Its website also positions the company as the single provider that designs,
              deploys, maintains, and continuously improves each cell [CR005]. That architecture may simplify customer
              procurement, but it creates correlated execution exposure: a hardware defect, software failure,
              integration delay, spare-parts shortage, or field-service bottleneck can all impair the same subscription
              relationship [CR013]. The scaling burden is material because company-issued evidence places operations in
              San Francisco and Austin and names several deployed industrial customers, while independent reporting says
              customer operations span more than a dozen US states [CR007, CR008, CR009]. No assigned source supplies
              uptime, incident, repair-time, service-capacity, or independent safety-performance data [CR016].
            claimRefs:
