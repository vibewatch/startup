      - number: '6.2'
        title: Adoption Trajectory, Operating Hours, and Geographic Footprint
        blocks:
          - type: paragraph
            body: >-
              RobCo's commercial adoption trajectory has expanded from initial pilot cells in German precision
              engineering facilities into multi-state enterprise deployments across Europe and North America [CU001,
              CU002, CU006]. By mid-2026, the company accumulated over 2.5 million operating hours in the field and
              expanded global organizational headcount to over 200 employees, reflecting an operational ramp supported
              by its $100 million Series C equity round in January 2026 and subsequent $1 billion valuation mark [CU001,
              CU003, CU007, CU008]. A pivotal catalyst in RobCo's American trajectory was the strategic acquisition of
              the assets, hardware inventory, and customer contracts of U.S.-based Rapid Robotics, alongside the
              establishment of dual manufacturing and assembly facilities in Austin, Texas, and an applications
              engineering laboratory in San Francisco [CU002, CU007, CU008]. This strategic transaction accelerated
              RobCo's U.S. customer operations across more than a dozen states within eight months of market entry
              [CU002, CU007, CU008]. Survey research published by the company highlights that 61% of U.S. manufacturers
              are actively accelerating automation initiatives and 95% plan new deployments within three years, with 42%
              evaluating subscription-based RaaS financing [CU002]. However, total active robot unit counts under
              contract, cohort-level deployment pacing, and monthly machine utilization rates remain undisclosed private
              metrics that require audit verification [CU009, CU011].
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU006
              - CU007
              - CU008
              - CU009
              - CU011
