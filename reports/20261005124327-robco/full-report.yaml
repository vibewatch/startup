  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Modular Hardware Architecture
        blocks:
          - type: paragraph
            body: >-
              RobCo delivers an industrial automation platform designed to lower deployment friction and capital
              requirements for manufacturing facilities [CE001, CE003]. At the hardware foundation, the system is
              engineered around a scalable modular architecture where kinematic assemblies are constructed by
              interconnecting discrete functional modules [CE002, CE007]. Rather than deploying a monolithic,
              fixed-geometry robotic arm, customer workcells are configured using a base drive unit secured to the
              factory foundation, intermediary link modules, drive modules, and application-specific end effector
              flanges [CE002, CE008]. Each actuator module integrates its own built-in drive and control electronics,
              operating alongside dedicated sensor modules that capture environmental and process telemetry for
              real-time adaptive motion control [CE002, CE008]. Standardized connecting terminals handle simultaneous
              physical coupling and electrical transmission of power and data buses [CE002]. When a new module is
              physically attached and the system is powered on, RobCo's system architecture automatically detects,
              parameterizes, and initializes the module into the active kinematic model without manual joint calibration
              [CE002, CE007]. This modular assembly model allows mid-sized manufacturers to re-deploy and reconfigure
              physical robot geometries as factory product mixes and cycle times evolve [CE001, CE003].
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE007
              - CE008
