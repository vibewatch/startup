      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The core buyer appears to be a plant or production leader seeking to automate a defined workflow, while
              operators and maintenance personnel are the daily users. Under RobCo's stated robotics-as-a-service model,
              the manufacturer pays a predictable monthly rate and RobCo owns, deploys, maintains, and improves the
              equipment; this can shift approval from a large capital purchase toward an operating-expense decision.
              Budget ownership is not disclosed in the sources, so assignments to plant operations, manufacturing
              engineering, or an enterprise automation program remain diligence hypotheses rather than verified facts.
              Adoption should progress from workflow qualification and safety review to deployment, measured production
              performance, and replication across cells or sites. Larger enterprises offer multi-site expansion
              potential, while midsize manufacturers may value reduced integration burden more acutely. Equipment makers
              form an adjacent buyer class for RobCo's embedded-robotics stack rather than the same end-user funnel.
            claimRefs:
              - CM009
              - CM010
              - CM013
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM013
              - CM016
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Structural labor pressure, reshoring, and rising operational complexity support automation demand.
              Greenfield Partners estimates that more than two million manufacturing jobs in the EU and United States
              could go unfilled by 2030, while RobCo's own survey indicates strong U.S. purchase intent. The
              counterweight is execution risk. Traditional automation can require costly integration, stable production,
              and specialist support; RobCo's model seeks to reduce those barriers but transfers hardware ownership,
              utilization, service density, and redeployment risk to the vendor. A self-published market-entry analysis
              also identifies OSHA, UL, and insurance requirements as U.S. deployment gatekeepers and warns that churn,
              truck rolls, and spare-parts usage can erode robotics-as-a-service economics. Those cautions are
              directionally relevant but low-confidence until contracts, fleet utilization, uptime, service cost, safety
              certifications, and cohort payback are reviewed. Valuation should therefore depend on verified repeatable
              unit economics and expansion, not broad manufacturing output or unaudited adoption intent.
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM012
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The addressable-market denominator is still missing
            body: >-
              No retained source quantifies eligible workflows, target sites, annual contract value, attainable
              deployment capacity, or serviceable geography on a common basis. A precise SAM/SOM would therefore be
              false precision.
            calloutType: risk
