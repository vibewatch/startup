  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              RobCo's relevant market is not the roughly $15 trillion of global manufacturing activity cited by
              Greenfield Partners; that figure is an economic backdrop rather than addressable robotics spend. The
              investable boundary is narrower: recurring spending on flexible industrial automation for repetitive or
              dangerous production tasks, particularly where product mix, changeovers, limited engineering capacity, or
              capital approval impede conventional robot cells. RobCo positions its offer around modular hardware,
              software, deployment, and service, with machine tending, palletizing, dispensing, and welding as current
              workflow examples. Adjacent opportunities include embedded robotics for equipment makers and increasingly
              autonomous work in variable environments. Excluded from the core boundary are total manufacturing output,
              general enterprise software, fixed-purpose automation that does not require RobCo's platform, and future
              autonomous use cases not yet commercially demonstrated. The principal substitutes remain manual labor, an
              internal automation team, and integrator-led capital equipment.
            claimRefs:
              - CM001
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.2'
        title: Sizing evidence without a false TAM
        blocks:
          - type: paragraph
            body: >-
              The available sources provide market-activity lenses rather than a bottom-up TAM. An independent article
              citing the International Federation of Robotics reports 603,000 industrial robots installed worldwide in
              2025, an operational stock of 5.079 million, and a forecast of 655,000 installations in 2026. These
              figures establish category scale and direction, but they do not identify how many installations fit
              RobCo's workflows, service model, geography, payload range, or acceptable contract economics. RobCo's
              September 2025 release separately says its survey found 61% of U.S. industrial companies accelerating
              automation, 95% planning additions within one to three years, and 42% considering robotics-as-a-service.
              Those percentages are useful demand signals, not independent market sizing: the fetched material does not
              disclose sample size, respondent mix, question wording, or fieldwork method. No precise SAM or SOM is
              therefore stated.
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
