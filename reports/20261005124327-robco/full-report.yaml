      - number: '7.4'
        title: Ranking, Mitigation, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              The highest residual risks are the coupled full-stack service obligation, the economics of RobCo-financed
              deployments, and the absence of independent target-specific safety, security, and reliability proof
              [CR013, CR014, CR016]. The most visible dated execution test is Alfie: independent reporting describes a
              commercial launch planned for March 4, 2027, making readiness and post-launch conversion forward-looking
              dependencies rather than evidence of current commercial availability [CR010, CR015]. Before investment,
              management should provide legal-entity schedules, certification dossiers, incident and uptime logs,
              service-level performance, fleet financing, cohort economics, and customer concentration. Thesis-break
              triggers should include an unexplained missed Alfie launch, inability to substantiate safe production
              operation, recurring service failures without improving repair times, or deployment growth that remains
              dependent on negative post-service unit economics.
            claimRefs:
              - CR010
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence is insufficient to underwrite residual risk
            body: >-
              Do not convert the absence of a target-matched adverse record into a clean legal or safety conclusion.
              Investment approval should remain conditional on entity-resolved legal searches, safety and security
              evidence, fleet reliability, service economics, customer concentration, and proof that the planned Alfie
              launch translates into safe paid production use.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR010
