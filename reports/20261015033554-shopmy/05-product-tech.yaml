chapter:
  number: 5
  title: "Product & Technology"
  summary: "ShopMy now spans creator storefronts, brand-side affiliate software, and a newer consumer discovery surface rather than a single link tool. The strongest public evidence supports a live creator/brand workflow with layered partner-network integrations and improving shopper-facing discovery, while trust, uptime, and developer-signal evidence remain thin relative to the company’s product ambition."
sections:
  - id: "product-surface-and-users"
    title: "What the product delivers today"
    body: |-
      ShopMy’s core product is still a creator-commerce workflow: creators build curated storefronts, collections, and posts; shoppers browse or click those recommendations; and brands pay for attributed commerce rather than only top-of-funnel reach. The official creator guide and partner documentation show live surfaces for collections, hidden collections, consults, shoppable posts, and Amazon link import, while creator testimony confirms that storefront building, gifting, payouts, and link sharing are everyday usage patterns rather than roadmap concepts. The 2025 consumer launch broadened that footprint with Circles, search, and wishlisting, so ShopMy is no longer only a creator back-office tool; it is also trying to become a shopper destination that preserves creator attribution after the initial recommendation moment.
    claimRefs: ["CE001", "CE002", "CE007", "CE008", "CE009"]
    tableRefs: ["TE001"]
  - id: "operating-model-and-architecture"
    title: "Operating model and dependency stack"
    body: |-
      Public evidence points to an operating model with several linked layers rather than a monolithic app. On the supply side, creators maintain storefront inventory and generate commissionable links. On the monetization side, ShopMy runs affiliate tracking, payouts, and brand dashboards, but the Make Influence comparison and The Folklore integration guide both show that some commerce still depends on pre-existing affiliate-network or partner-storefront rails. That layered design lowers direct-integration burden and helps ShopMy scale assortment quickly, but it also means product quality can vary with partner integrations, external commission logic, and brand onboarding quality. Brand tools appear commercially meaningful already: external reporting says subscriptions, creator discovery, real-time sales data, and direct collaboration tooling are live and increasingly central to the platform’s revenue mix.
    claimRefs: ["CE003", "CE004", "CE005", "CE006", "CE011"]
    tableRefs: ["TE002", "TE003"]
    figureRefs: ["FE001"]
  - id: "differentiation-and-maturity"
    title: "Differentiation, fit, and maturity"
    body: |-
      ShopMy’s differentiation is not just storefront creation; it is the combination of creator distribution, attribution, gifting, and increasingly brand workflow software in a taste-led environment. The product appears strongest where that model fits fast-moving discretionary categories: apparel, beauty, lifestyle, and adjacent creator-led verticals. Public sources also show maturity expansion over time, from creator link monetization to subscription software for brands and then to shopper-facing discovery via Circles and improved storefront search. Even so, much of the brand-retention, direct creator-to-shopper engagement, and deeper analytics story is still presented as rollout or roadmap language, so the product is clearly broadening but not yet fully evidenced as a finished end-to-end operating system in public materials.
    claimRefs: ["CE005", "CE007", "CE010", "CE011", "CE012"]
  - id: "trust-controls-and-open-risks"
    title: "Trust, controls, and open product risk"
    body: |-
      The weakest part of the public record is not feature breadth but operating assurance. The assigned pool documents pricing, network design, storefront behavior, and creator monetization in detail, yet it does not surface a public trust center, uptime/status disclosures, audited security certifications, or formal privacy/compliance controls for buyers to inspect. That matters because ShopMy sits in transaction attribution, shopper discovery, and brand analytics workflows where operational reliability and data handling are material. Competitive/legal friction is also visible: Modern Retail reported that LTK sued ShopMy over false advertising, trademark infringement, and unfair competition before later dropping the case. The product thesis is credible, but diligence still needs direct proof on control maturity rather than feature marketing.
    claimRefs: ["CE013", "CE014"]
