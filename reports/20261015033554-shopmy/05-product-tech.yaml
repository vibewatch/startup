callouts:
  - calloutType: "strength"
    title: "Cross-sided workflow breadth is real"
    body: "The strongest product signal is breadth across creators, brands, and shoppers: ShopMy is no longer only a link generator, because public sources show live storefronts, brand dashboards, gifting workflows, and a consumer discovery surface."
    claimRefs: ["CE001", "CE005", "CE007", "CE011"]
  - calloutType: "insight"
    title: "Partner rails accelerate coverage but add dependency"
    body: "ShopMy’s ability to sit above existing affiliate-network and storefront infrastructure helps assortment scale faster, but it also makes attribution rules, commissions, and merchant readiness partly dependent on third-party systems."
    claimRefs: ["CE003", "CE004", "CE011"]
  - calloutType: "risk"
    title: "Control maturity is under-documented"
    body: "Public product evidence is much stronger on monetization and discovery than on uptime, security, privacy, or formal compliance controls, so buyer diligence still needs direct operating-assurance proof."
    claimRefs: ["CE013", "CE014"]
