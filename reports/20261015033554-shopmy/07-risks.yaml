          "Medium-High",
          "High",
          "Current documentation says merchants control validation and reversals rather than ShopMy dictating every outcome.",
          "Publisher/merchant disputes or network-term conflicts can still surface if order-level reconciliation is weak.",
          "Review duplicate-order SOPs, top-network contracts, reversal logs, and any merchant escalations by platform."
        ]
      - [
          "Contract ambiguity for Commissionable Partners routed through third-party networks",
          "ShareASale, Impact, Rakuten, CJ, and similar partner networks",
          "ShopMy's own guide and Make Influence both describe a layered model where some merchants participate through external networks instead of direct platform access.",
          "High",
          "Medium-High",
          "Discount codes and merchant-side validation provide partial control over attribution and payout decisions.",
          "Inconsistent network rules or override logic can create disputes, delayed payouts, or hard-to-audit exceptions.",
          "Obtain the top-20 brand contract stack, code precedence rules, and exception handling for duplicate or returned orders."
        ]
      - [
          "Valuation-level disclosure and reserve risk",
          "Investor disclosure / underwriting surface",
          "Public refresh evidence confirms the $1.5B valuation and growth claims but not revenue, take rate, gross margin, reserve policy, or litigation accrual detail.",
          "High",
          "Medium",
          "Recent funding and claimed profitability imply some buffer, but the evidence remains management-shaped.",
          "Investors cannot stress-test downside if disputes, churn, CAC, or loss reserves worsen.",
          "Request audited 2024-2026 revenue, gross margin, take-rate, reserve, and legal-memo packages before underwriting price."
