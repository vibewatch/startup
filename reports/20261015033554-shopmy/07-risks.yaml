    notes: >-
      Rows are severity-ranked using only retained public evidence; "status" distinguishes verified
      public facts from still-unquantified exposure, and null economics are treated as diligence
      gaps rather than as zero risk.
    enumerationScope:
      coverage: partial
      basis: >-
        Severity-ranked subset of the legal and contractual risks that were materially evidenced in
        the assigned public-source pool for the 2026-10-15 refresh.
    claimRefs: [CR001, CR003, CR004, CR006, CR007, CR011]
