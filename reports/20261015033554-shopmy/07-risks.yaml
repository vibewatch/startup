callouts:
  - calloutType: risk
    title: Attribution integrity is the lead blocker
    body: >-
      The underwriting hinge is whether ShopMy can prove cross-network commission decisions are
      consistent, contractual, and auditable at the order level rather than just explained through
      marketing language or merchant discretion.
    claimRefs: [CR001, CR003, CR004, CR011]
  - calloutType: recommendation
    title: Kill criteria before underwriting the refresh valuation
    body: >-
      Do not underwrite the $1.5 billion price without audited revenue and gross-margin bridges,
      creator and brand concentration tables, and duplicate-order reversal logs segmented by direct
      versus network-routed merchant programs.
    claimRefs: [CR006, CR007, CR008, CR014]
