schemaVersion: report-v2
artifact: risks
slug: shopmy
runDate: 2026-10-15
company:
  name: ShopMy
chapter:
  number: 7
  title: Risks
  summary: >-
    ShopMy's biggest underwritten risk is not demand creation but control: the company still
    layers part of its merchant base onto legacy affiliate networks while asking investors to
    underwrite a $1.5 billion platform outcome without public revenue, margin, or concentration
    disclosure. The refresh cycle also shows rising execution pressure from native-commerce
    platforms and from tier-gated creator quality, so the thesis depends on proving attribution
    integrity, durable unit economics, and broad creator/brand retention rather than just recent
    growth.
sections:
  - id: ranked-risk-view
    title: Ranked risk view
    body: >-
      The clearest public red flag is attribution conflict across channels that ShopMy does not
      fully control. Affiverse reported archived guidance that favored preserving the ShopMy
      commission when an order also appeared in another affiliate network, and the same report
      identified 527 merchants with overlapping network exposure without proving how each case
      resolved. That matters more in a refresh because the company now carries a $1.5 billion
      post-money valuation and a larger employee base, while public revenue, take rate, and margin
      detail still remain undisclosed. As a result, legal/process risk and financial-underwriting
      risk compound one another: if attribution disputes or merchant dissatisfaction rise, there is
      not enough public economic detail to show how much buffer the business has.
    claimRefs: [CR003, CR004, CR006, CR007]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: platform-model-and-execution
    title: Platform model and execution pressure
    body: >-
      ShopMy's own materials show both the product's strength and its control weakness. The company
      distinguishes direct Brand Partners from Commissionable Partners that still ride external
      networks, and its own guide concedes affiliate marketing is a "leaky bucket" unless brands
      use stronger attribution tools such as codes. That design can scale supply quickly: Bloomberg
      showed a small creator monetizing within weeks, while Inc. and company materials show rapid
      creator and brand growth. But it also leaves ShopMy exposed to payout-settlement lag, return
      adjustments, cross-network reconciliation, and the need to keep storefronts compelling enough
      to pull shoppers away from native commerce environments.
    claimRefs: [CR001, CR002, CR005, CR009, CR010, CR011, CR014]
    tableRefs: [TR002]
  - id: dependency-and-concentration
    title: Dependency and concentration risk
    body: >-
      The next-order risk is concentration inside the supply side that gives ShopMy its premium
      brand promise. Mission Media says Noir is restricted to gold and black tier creators, which
      it characterizes as roughly the top 1-5% of a 200,000-creator network, while creator-review
      evidence shows gifting access, visibility, and workflow advantages also rise with tier. If
      the best-performing cohort is narrow, ShopMy's premium positioning could depend on a small
      set of creators and brands even as the broader network grows. Affiverse's valuation critique
      adds the external side of that risk: large commerce ecosystems and affiliate infrastructure
      players are still improving their own creator-commerce tooling.
    claimRefs: [CR008, CR009, CR012, CR013]
    tableRefs: [TR003]
  - id: mitigations-and-kill-criteria
    title: Mitigations, monitoring, and kill criteria
    body: >-
      The mitigation case is visible but incomplete. Current public guidance says merchants control
      reversals, weekly creator payouts exist despite long settlement windows, and new storefront
      surfaces are supposed to improve shopper retention and repeat monetization. Those are helpful
      controls, but they are not enough to underwrite the refresh without deeper diligence. The
      investment breaks if ShopMy cannot provide order-level reversal evidence across external
      networks, audited revenue and margin bridges against the valuation, and creator/brand
      concentration data showing that GMV and retention are not overly dependent on a thin elite
      tier. Until then, the right stance is to treat attribution integrity, network dependency, and
      undisclosed unit economics as live diligence blockers rather than as solved scaling details.
    claimRefs: [CR002, CR003, CR006, CR007, CR011, CR014]
tables:
