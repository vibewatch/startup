companyProfile:
  summary: >-
    ShopMy is a founder-led creator-commerce platform that helps premium brands, creators, and shoppers discover
    products, build storefronts, run affiliate and gifting workflows, and increasingly activate paid-media and
    consumer-shopping surfaces. The public record supports strong growth and profitability claims, but it still leaves
    the core diligence questions around audited economics, concentration, and cap-table terms unresolved.
