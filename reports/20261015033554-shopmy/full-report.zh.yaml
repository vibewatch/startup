  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: ShopMy 的客户闭环从付费品牌入驻和创作者激活开始；只有店面发现、已保存链接和归因销售持续让双方参与，闭环才会复利增长。
    data:
      nodes:
        - label: 品牌签约联盟 + 送礼服务
          actor: Brand marketing / ecommerce team
          phase: Acquisition
          tone: positive
          touchpoints:
