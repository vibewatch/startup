              还通过叠加在现有联盟网络之上的 “Commissionable Partners”
              扩大商品目录，这在战略上有用，因为它把直接平台客户与仍可被链接的庞大品牌商品宇宙区分开来。创作者端的客户证明显示，其准入比老式邀请制店铺应用开放得多，但仍无法证明已注册创作者中有多少保持活跃或真正变现。
