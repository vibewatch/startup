            title: 多条收费渠道降低对单一产品的依赖
            body: ShopMy 并非只从市场一侧变现：公开证据指向订阅收入、交易关联费用、付费营销费用、送礼相关费用和创作者佣金分成。如果某一种产品动作放缓，这种组合能增强收入韧性。
