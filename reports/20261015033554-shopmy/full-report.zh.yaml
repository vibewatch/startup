        title: 运营模式与依赖栈
        blocks:
          - type: paragraph
            body: >-
              公开证据指向多层联动的运营模式，而非单体应用。在供给侧，创作者维护店铺库存并生成可赚取佣金的链接；在变现侧，ShopMy 负责联盟跟踪、付款和品牌仪表盘，但 Make Influence 的比较及 The
              Folklore 的集成指南都显示，部分交易仍依赖已有联盟网络或合作伙伴店铺的底层通道。这种分层设计降低了直接集成负担，有助于快速扩大商品供给，但也意味着产品质量会随合作伙伴集成、外部佣金规则和品牌
              onboarding 质量变化。品牌工具看起来已有商业意义：外部报道称订阅、创作者发现、实时销售数据和直接合作工具均已上线，并日益成为平台收入组合的核心。
