  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: ShopMy 在同一商业闭环的多个节点变现，覆盖创作者工具、品牌订阅、活动费、交易费和佣金留存。
    data:
      nodes:
        - label: 创作者搭建店面和链接
          note: 浏览器扩展、店面和追踪链接构成可变现入口。
        - label: 购物者发现并收藏产品
          note: Circles、愿望清单和店面浏览旨在将购物延伸到短暂社交帖文之外。
        - label: 交易流向品牌
          note: 购买会流入品牌直连项目或第三方联盟网络。
        - label: 品牌向 ShopMy 支付软件费
          note: 品牌工具的公开价格约为 $399/月至 $2,799+/月。
        - label: ShopMy 收取交易费和活动费
          note: 拆解报告称，品牌直连 GMV 费用最高为 2.9%，次级联盟费用约为 3.9%，Opportunities 费用为 15%。
        - label: 创作者获得净佣金
          note: 创作者每周可收取超过 $11 的款项；ShopMy 留存佣金的 18%，支付 82%。
