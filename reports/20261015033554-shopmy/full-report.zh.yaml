      - number: '5.4'
        title: 信任、控制与开放产品风险
        blocks:
          - type: paragraph
            body: >-
              公开记录最薄弱的部分不是功能广度，而是运营保障。现有材料详细记录了定价、网络设计、店铺行为和创作者变现，却没有公开信任中心、正常运行时间 / 状态披露、经审计安全认证，或供买方检查的正式隐私 /
              合规控制。ShopMy 参与交易归因、消费者发现和品牌分析流程，因此运营可靠性与数据处理很重要。竞争和法律摩擦也已显现：Modern Retail 报道称 LTK 曾以虚假广告、商标侵权和不正当竞争起诉
              ShopMy，之后撤诉。产品论点可信，但尽调仍需直接证明控制成熟度，而非只看功能营销。
