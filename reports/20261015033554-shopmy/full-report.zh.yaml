  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              最有力的公开证据把 ShopMy 放在创作者电商基础设施，而非单一用途联盟链接工具中。官方 onboarding
              材料把核心流程定义为：将推荐转成可赚取佣金的链接，由创作者跨平台分享；第三方评测则将同一套产品描述为数字店铺、联盟引擎、送礼流程和品牌合作场景。这个边界涵盖创作者店铺、链接变现、送礼和品牌发现，但不包括更广泛的网红代理软件、纯社交网络和通用结账工具。最接近的现状替代方案是传统联盟网络和手工创作者—品牌对接；二者都留下归因和流程碎片化问题，而
              ShopMy 正在解决这些问题。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
