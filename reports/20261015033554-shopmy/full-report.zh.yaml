              - CR012
              - CR013
      - number: '7.4'
        title: 缓释措施、监控与退出标准
        blocks:
          - type: paragraph
            body: >-
              缓释逻辑可见，但并不完整。当前公开指南称商户控制冲销，尽管结算窗口很长，创作者仍能每周收到付款；新的店铺场景也应改善消费者留存和重复变现。这些是有帮助的控制，但不足以在缺少更深尽调时支撑本次更新估值。若
              ShopMy 无法提供外部网络逐单冲销证据、与估值对应的经审计收入和利润率桥接表，以及能证明 GMV 和留存不过度依赖少数精英层的创作者 /
              品牌集中度数据，投资逻辑就会失效。在此之前，应把归因完整性、网络依赖和未披露的单位经济视为仍在进行的尽调阻碍，而不是已经解决的规模化细节。
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR007
              - CR011
              - CR014
      - number: '7.5'
        title: 展示
        blocks:
          - type: callout
            title: 归因完整性是首要阻碍
            body: 投资判断的关键是，ShopMy 能否证明跨网络佣金决策逐笔订单都保持一致、有合同依据且可审计，而不是只用营销话术解释，或任由商户自行决定。
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR011
          - type: callout
            title: 在承保更新估值前的退出标准
            body: 在没有经审计收入和毛利桥接表、创作者及品牌集中度表，以及按直接商户项目和网络路由商户项目拆分的重复订单冲销日志前，不要承保 $1.5B 的价格。
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR014
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资判断与价格纪律
        blocks:
          - type: paragraph
            body: >-
              ShopMy 有可信的商业规模证据：公司称平台年销售额超过 $1B，收入同比增长 200%，并自 2024 年起持续盈利。独立报道也确认投资人在 2025 年两轮融资中合计投入
              $147.5M。这些信号足以支持继续尽调，却不足以在没有条件的情况下按最新 headline 价格买入。$1.5B
              估值可观察；经审计收入质量、利润率、留存、集中度和融资优先权不可观察。因此当前判断是跟踪：信心中等、风险高，在证据改善或入场条款重置前，估值偏高。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV009
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV009
              - CV016
      - number: '8.2'
        title: 融资背景与可比限制
        blocks:
          - type: paragraph
            body: >-
              2025 年 10 月融资以 $1.5B 估值带来 $70M，此前当年早些时候还有 $77.5M 融资。第三方档案用融资额除以投后估值，估算最新一轮出售公司约
              5%；但这一算式不是股权表替代品，也无法揭示清算优先权、期权池变化或老股出售。同一档案称，没有任何一轮披露企业价值 / 收入倍数。Inc. 提到 LTK 2021 年 $2B
              估值，说明品类存在投资人兴趣，但年份更早、平台策略不同，只能作为较弱的直接参照，不能验证 ShopMy 的价格。
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
      - number: '8.3'
        title: 不制造虚假精确度的情景承保
        blocks:
          - type: paragraph
            body: >-
              Sacra 估算 2025 年收入为 $80M；将该估算与已披露估值结合，可得 18.75x 的示意性估值 /
              估算收入比。这不是公司报告的倍数，不能当作公司口径。乐观情景要求公司报告的增长和盈利信号经得起尽调，并转化为持久的群组经济；基准情景承认运营故事强劲，但因分母是估算值而不提供公允价值区间；悲观情景围绕倍数压缩、社交平台依赖和可能削弱普通股保护的融资条款。因而公开证据支持情景触发条件，而不支持数值概率权重或目标回报。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV009
              - CV015
              - CV016
      - number: '8.4'
        title: 证明缺口、退出准备度与论点破坏触发条件
        blocks:
          - type: paragraph
            body: >-
              运营案例支持产品相关性，但证据强弱不一。ShopMy 称 2025 年 7 月品牌销售额超过 $500M；Inc. 则转述公司更早声称品牌销售额超过 $352M、投资回报率为
              500%。一项公司案例研究和一则联盟关联创作者评测提供了方向性证据，但都不是代表性群组。最终尽调应取得经审计财务、留存与集中度明细及完整融资文件。论点破坏触发条件包括相对公开增长叙事出现重大短缺、平台依赖恶化、群组持久性弱，或优先股堆叠使
              headline 估值产生误导。没有任何现有来源确定退出时间或流动性。
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 展示
        blocks:
          - type: callout
            title: 跟踪，不追逐 headline 估值
            body: 保持尽调权限，并根据已验证的经济性谈判；公开记录更有力地支持业务质量，而不是最新价格。
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV009
              - CV016
          - type: callout
            title: 分母仍是估算值
            body: 示意性估值比使用 Sacra 的收入估算，而非公司经审计收入，因此它界定了尽调负担，却没有确定公允价值。
            calloutType: risk
            claimRefs:
              - CV006
