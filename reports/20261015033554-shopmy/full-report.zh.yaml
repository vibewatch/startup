            - Creator discovery
            - Affiliate + gifting setup
        - label: 创作者加入或通过推荐加入
          actor: Creator
          phase: Onboarding
          tone: neutral
          touchpoints:
            - Application review or referral link
            - Storefront setup
            - Snapshop or link creation
        - label: 创作者发布产品推荐
          actor: Creator
          phase: Activation
          tone: positive
          touchpoints:
            - Collections
            - Discount codes
            - Lookbooks or gifting
        - label: 购物者通过 Circles 或已保存链接发现产品
          actor: Shopper
          phase: Discovery
          tone: positive
          touchpoints:
            - Circles
