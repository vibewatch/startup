      - number: '2.2'
        title: 买方、用户与付费路径
        blocks:
          - type: paragraph
            body: >-
              ShopMy
              是多方产品，但现金预算主要似乎来自品牌及其代理商，而不是创作者。面向创作者的资料一再强调免费使用、每周结算和送礼流程是拉新抓手，说明创作者是供给侧而非付费客户。现有材料中最清晰的预算信号来自品牌定价：第三方公开评测称月订阅费为
              $399 至 $2,799+，另加交易费。因此，预算通常归增长、联盟、网红或电商团队；他们看重 ROI 和创作者覆盖。2025 年购物平台上线后，消费者的重要性上升，但变现仍依靠创作者精选和品牌需求生成。
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM012
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
