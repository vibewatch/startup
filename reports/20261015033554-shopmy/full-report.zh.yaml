      - number: '4.2'
        title: 公开销售效率代理指标与牵引力
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一种围绕可衡量电商结果构建的收入引擎，而非泛泛的品牌认知。使用或评测该平台的品牌运营者会查看创作者层面的 GMV、客单价、送礼接受率和可归因销售仪表盘；Fortune 和 Inc.
              也都把产品描述为能把创作者变成品牌可衡量销售渠道的基础设施。这正是高端创作者电商平台应有的证据形态，尽管多数硬数字仍来自公司或第三方估算。

              牵引力口径足够大，值得重视，但相互印证并不充分。2025 年 10 月融资公告称平台年销售额超过 $1B、拥有 185,000+ tastemakers、1,200+ 品牌合作方、收入增长 200%，并自
              2024 年起持续盈利；Inc. 则在 2025 年 1 月产品周期附近单独报道 150,000 名创作者、1,000 家品牌合作方和 $352M 品牌销售额。Teardown 还给出约 $80M 的 2025
              年收入外部估算，并称收入结构从 2024 年订阅 / 交易 65/35 转向 2025 年 50/50；这一信息有用，却仍不能替代按收入来源拆分的经审计收入。
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI012
