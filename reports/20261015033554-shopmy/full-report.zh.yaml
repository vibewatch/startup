              - CM012
              - CM016
      - number: '2.3'
        title: 采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              公开来源指向三个采用驱动因素。第一，创作者端摩擦低：免费
              onboarding、链接可在现有渠道分享、结算频繁，送礼还能为新内容提供商品。第二，公司对品牌的卖点是经济回报而非单纯品牌曝光；官方材料强调更好的归因、折扣码捕获、绩效分析以及高意向消费者触达。第三，垂直行业集中似乎是有意选择：多家第三方来源称，产品最适合时尚、美妆、健康和生活方式领域，因为视觉陈列、送礼和基于品味的发现本来就是这些领域的行为。约束同样清晰：高端定价需询价，额外费用可能侵蚀
              ROI，品牌端公开评测较少；即使是正面评价，也提醒其在核心垂直领域之外或复杂营销环境中的流程较弱。
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM014
              - CM016
      - number: '2.4'
        title: 受证据约束的市场规模与剩余缺口
        blocks:
          - type: paragraph
            body: >-
              现有材料支持受约束的规模判断，而不是干净的 TAM / SAM / SOM 框架。公司关联来源和独立来源共同证明了与估值相关的变现层：创作者佣金通常约为 10-30%，部分案例中的创作者收入高达每月
              $50K，品牌软件月支出为 $399 至 $2,799+；公司还称，截至 2025 年 1 月平台已带动品牌销售额
              $352M，之后才在当年晚些时候拓展到消费者购物场景。这些是需求和吞吐量视角，却不是第三方对高端品牌创作者电商软件总可寻址支出的估算。公开分子使用的分母也不同：公司公告称品牌合作方超过 1,000
              家，而创作者评测称可触达品牌达数万家，因此公开证据仍无法区分活跃付费品牌与更广泛的商户目录。
