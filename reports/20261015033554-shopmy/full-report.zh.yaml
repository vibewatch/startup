        title: 展示
        blocks:
          - type: callout
            title: 品牌预算驱动变现，创作者驱动供给
            body: 公开证据中最清晰的现金预算来自品牌和代理商，他们为归因、送礼及创作者运营软件付费；创作者则被免费 onboarding、佣金和送礼机会吸引，而不是订阅费。
