        title: 当前产品能交付什么
        blocks:
          - type: paragraph
            body: >-
              ShopMy
              的核心产品仍是一套创作者电商流程：创作者搭建精选店铺、合集和帖子；消费者浏览或点击推荐；品牌为可归因交易付费，而不只是为漏斗顶端曝光付费。官方创作者指南和合作伙伴文档显示，合集、隐藏合集、咨询、可购物帖子和
              Amazon 链接导入等场景已经上线；创作者证言也确认搭店、送礼、结算和分享链接是日常使用，而非路线图概念。2025 年消费者产品发布通过 Circles、搜索和愿望单扩大了范围，因此 ShopMy
              已不只是创作者后台工具，也在尝试成为消费者入口，在最初推荐之后保留创作者归因。
