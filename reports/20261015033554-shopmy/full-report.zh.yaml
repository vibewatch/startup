  - id: FE001
    title: 产品架构图
    type: stack
    summary: ShopMy 的公开产品栈以创作者店面编排为上层，底下连接链接变现、合作伙伴网络基础设施、品牌工作流软件和较新的消费者发现入口。
    data:
      layers:
        - label: 创作者编排层
          detail: 创作者组装合集、帖子、咨询内容和店面页面。
          modules:
            - 合集 / 分区
            - 可购物帖子
          outputs:
            - 持续运营的创作者店面
        - label: 链接与归因层
          detail: ShopMy 将产品 URL 转为可赚取佣金的链接，并追踪由此产生的交易。
          modules:
            - 联盟链接生成
            - 订单 / 佣金追踪
          outputs:
            - 可追踪的创作者驱动销售
        - label: 合作伙伴网络层
          detail: Commissionable Partner 通过现有联盟和店面合作伙伴扩大商品覆盖。
          modules:
            - 基于网络的佣金基础设施
            - 合作伙伴店面集成
          outputs:
            - 更广的商户覆盖
        - label: 品牌工作流层
          detail: 订阅将创作者发现、实时销售数据和协作工具打包提供给品牌。
          modules:
            - 创作者发现
            - 品牌分析
          outputs:
            - 项目管理动作
        - label: 送礼与活动层
          detail: Lookbooks、送礼和效果活动协同推动创作者激活。
          modules:
            - 自动送礼
            - 效果活动
          outputs:
            - 产品种草与活动支出
        - label: 消费者发现层
          detail: Circles、搜索和愿望清单试图把创作者推荐变成可重复访问的购物目的地。
          modules:
            - Circles
            - 搜索 / 最新发现
          outputs:
            - 购物者发现与已保存需求
    approximationNotes: 分层反映公开的运营模式证据，不是公司披露的内部系统图。
