        - from: Shoppers discover and save products
          to: Commerce flows to brands
          label: 点击、愿望清单和购买
        - from: Commerce flows to brands
          to: Brands pay ShopMy software fees
          label: 工作流与归因价值
        - from: Brands pay ShopMy software fees
          to: ShopMy takes transaction and campaign fees
          label: 订阅加使用关联变现
        - from: ShopMy takes transaction and campaign fees
          to: Creators receive net commissions
          label: 结算与留存佣金分成
