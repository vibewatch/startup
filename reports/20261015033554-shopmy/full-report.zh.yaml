              最清晰的公开红旗，是 ShopMy 无法完全控制的跨渠道归因冲突。Affiverse 报道称，存档指南倾向于在订单同时出现在另一联盟网络时保留 ShopMy 的佣金；同一报道还指出有 527
              家商户存在网络重叠，但没有证明每个案件如何解决。公司如今承载 $1.5B 投后估值且员工规模更大，而公开收入、抽成率和利润率细节仍未披露，这使问题在本次更新中更重要。因此法律 /
              流程风险和财务承保风险相互叠加：若归因争议或商户不满上升，公开经济数据又不足以显示业务拥有多大缓冲。
