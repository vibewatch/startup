        - 结果高于 $1.5B 估值变得合理，但公开信息仍无法支持精确区间或回报。
        - 执行和倍数压缩风险仍在。
        - 审计后的收入、利润率和留存达到或超过公开叙事。
      - - 基准
        - 运营故事的方向大体正确，但披露仍不完整，收入分母仍是估算值。
        - 要求以不高于最新估值的价格入场并获得权利保护；公允价值仍无法精确支持。
        - 按示意性的 18.75x 估算收入倍数，容错空间有限。
        - 证据仍混杂着公司强势说法和未经验证的私有输入。
      - - 悲观情景
        - 增长或群组质量不及预期、平台依赖加剧，或优先股堆叠拖累普通股。
        - 低于 $1.5B 估值或发生下轮融资变得合理；无法估计下行底线。
        - 倍数压缩、集中度和优先权悬压。
        - 审计结果低于叙事或融资文件对投资者不利时触发。
    notes: 情景估值边界有意保持定性，因为公开证据没有提供经审计的当前收入、标准化利润率或完整融资条款。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV009
      - CV015
      - CV016
