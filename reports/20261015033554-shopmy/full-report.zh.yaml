    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              ShopMy
              一贯把自己定位为创作者电商基础设施，而不是简单的联盟链接工具。官方品牌端和创作者端页面描述了一个三方模式：帮助高端品牌发现并衡量创作者，让创作者通过店铺和联盟链接变现，并逐步为消费者提供精选发现入口。身份信息大体清晰，但公开记录并不完全一致：Tracxn
              列出的成立年份为 2020 年，而 Inc 称 Harry Rein 和 Tiffany Lopinsky 于 2021 年与 Chris Tinsley
              共同创办公司。总部信息都指向纽约市，足以供后续章节沿用；成立年份不一致则应继续标记，直到注册文件或内部材料予以澄清。
