      - number: '4.3'
        title: 成本结构、营运资金画像与资本需求
        blocks:
          - type: paragraph
            body: >-
              ShopMy 已披露及推算出的经济性表明，公司或许能实现有吸引力的毛利率，但公开证据仍薄弱，尚不足以有把握地评估。最强的正面信号来自结构：软件订阅应是高毛利业务；Teardown
              认为营销预算和联盟余额在向创作者付款前可以留在 ShopMy 资产负债表上。公司还称自 2024 年起盈利，并以 $1.5B 估值完成 $70M 融资，原则上减轻了即时融资压力。

              尽调难点在于，留存的公开来源都没有披露当前现金、现金消耗、现金跑道、债务、各收入来源的毛利率或服务交付成本强度。投资人只能依靠平台销售代理指标、公司声称的增长和估算收入，而不是经审计的单位经济。同时，Teardown
              提出两个直接影响毛利耐久性的财务风险：零售商 / 平台去中介化可能压缩 ShopMy 的抽成位置；若付款争议或价格变化让平台显得过度榨取，创作者信任也会下降。
            claimRefs:
              - CI006
              - CI009
              - CI010
              - CI011
              - CI013
              - CI014
      - number: '4.4'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              如果把 ShopMy
              看作拥有多重变现层且销售效率工具可信的高端创作者电商操作系统，财务逻辑最强。只要公司能在维持交易、营销和创作者经济抽成率的同时继续增加品牌订阅，公开证据就与其已经从品类叙事走向真实收入生成的判断相符。

              但本章仍达不到投资承保级结论。公开材料无法证明经审计 GAAP
              收入、各收入来源毛利率、激励后的实际定价、按品牌或创作者群组划分的集中度或当前流动性。因此正确结论是：收入质量看起来有希望，利润率路径合理但未经证明；没有现金、现金消耗、营运资金和集中度方面的管理层数据室证据，就无法排除融资依赖。
            claimRefs:
              - CI008
              - CI010
              - CI013
              - CI014
