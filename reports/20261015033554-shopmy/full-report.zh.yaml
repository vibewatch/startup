  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 残余风险最高的领域集中在归因完整性、原生平台竞争和单位经济性披露缺失，而非某个单一的二元法律事件。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 跨网络归因争议
          note: 如果订单级对账或商户覆盖规则薄弱，风险将非常关键。
          values:
            - ''
            - ''
            - label: 已归档指引叠加重合的网络暴露，可能造成佣金冲突和商户不信任。
              tone: adverse
        - label: 披露 / 单位经济性缺口
          note: 估值已公开，但收入和利润率尚未披露，因此风险关键。
          values:
            - ''
            - label: 公开的增长和盈利论断仍缺少收入、利润率、抽成率和准备金披露。
              tone: warning
            - ''
        - label: 结算与冲回滞后
          note: 如果结算展示掩盖了现金实现缓慢或调整率高，风险将非常关键。
          values:
            - ''
            - label: 每周结算承诺仍建立在 30-120 天结算、退货和欺诈调整之上。
              tone: warning
            - ''
        - label: 原生平台转化压力
          note: 风险高，因为更大的生态可以让创作者和购物者留在原生流程内。
          values:
            - ''
            - ''
            - label: TikTok、Instagram、Amazon 及相邻生态可能降低对独立目的地的需求。
              tone: adverse
        - label: 头部创作者集中度
          note: 如果高端表现由狭窄的顶层群体驱动，风险高。
          values:
            - ''
            - label: Noir 权限和送礼优势随等级提升，表明价值可能集中在小型群组中。
              tone: warning
            - ''
        - label: 高端品牌集中度
          note: 如果护城河依赖狭窄的奢侈品牌名录，且流失披露有限，风险高。
          values:
            - label: 公开证据突出高端定位，但未披露品牌流失或头部品牌 GMV 占比。
              tone: warning
            - ''
            - ''
    approximationNotes: 位置表达留存公开证据中的相对严重性，不代表精确的量化概率。
    claimRefs:
      - CR001
      - CR003
      - CR006
      - CR007
      - CR008
      - CR011
      - CR012
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 已报告的规模和融资证明先经过估值与披露风险筛选，再得出跟踪立场。
    data:
      nodes:
        - id: financing
          label: 融资证明
          summary: $70M at a $1.5B valuation, following another substantial 2025 round.
          claimRefs:
            - CV001
            - CV002
        - id: scale
          label: 规模论断
          summary: More than $1B in annual platform sales and 200% reported revenue growth.
          claimRefs:
            - CV003
            - CV004
        - id: earnings
          label: 盈利信号
          summary: Company-reported profitability since 2024, repeated by an analyst source.
          claimRefs:
            - CV005
        - id: valuation
          label: 估值检验
          summary: 18.75x the analyst's estimated 2025 revenue, not audited revenue.
          claimRefs:
            - CV006
        - id: gaps
          label: 披露缺口
          summary: No disclosed round EV/revenue multiple and no complete public financing terms.
          claimRefs:
            - CV009
        - id: stance
          label: 跟踪立场
          summary: High risk and stretched valuation pending diligence or a better price.
          claimRefs:
            - CV016
      edges:
        - from: financing
          to: scale
          label: 建立资本支持
        - from: scale
          to: earnings
          label: 检验运营可信度
        - from: earnings
          to: valuation
          label: 界定价格敏感性
        - from: valuation
          to: gaps
          label: 暴露缺失输入
        - from: gaps
          to: stance
          label: 限制建议
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV009
      - CV016
