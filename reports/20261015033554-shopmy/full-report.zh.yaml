              现有证据仍指向高度由创始人主导的运营结构。ShopMy 2025 年 10 月融资公告称 Harry Rein 任 CEO、Tiffany Lopinsky 任总裁、Chris Tinsley 任
              CBDO；独立报道也把 Rein 和 Lopinsky
              描述为战略、消费者产品扩张及变现方面最常见的发言人。这种连续性有帮助，但也把执行风险集中在创始团队。由于现有材料没有披露董事会构成、投资人控制权或高管变动记录，治理透明度仍有限。对尽调而言，领导班子足以描绘，但没有直接董事会和股权表材料，尚不足以评估治理韧性。
