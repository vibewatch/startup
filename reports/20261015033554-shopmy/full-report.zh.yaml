              ShopMy 最强的公开证据是融资和产品节奏。最明确且相互印证的事件是 2025 年 C 轮：公司宣布 10 月以 $1.5B 估值融资 $70M，而 Tracxn 将该轮日期记为 8 月 8 日。Avenir
