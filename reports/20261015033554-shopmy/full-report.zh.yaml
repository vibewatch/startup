        - label: 品牌看到可归因的销售信号
          actor: Brand
          phase: Measurement
          tone: positive
          touchpoints:
            - SKU-level attribution
            - Click and order visibility
            - ROI optimization
        - label: 重复收入取决于已披露的留存质量
          actor: Brand + creator
          phase: Expansion
          tone: warning
          touchpoints:
            - Wishlisted items remain commissionable
