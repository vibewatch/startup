      - number: '7.3'
        title: 依赖与集中度风险
        blocks:
          - type: paragraph
            body: >-
              下一层风险在于支撑 ShopMy 高端品牌定位的供给侧集中。Mission Media 称 Noir 只对金牌和黑牌创作者开放，并将其描述为 200,000 名创作者网络中约前
              1-5%；创作者评测也显示，送礼权限、曝光度和工作流优势会随等级提高。若表现最好的群组很窄，即使整体网络增长，ShopMy 的高端定位仍可能依赖少数创作者和品牌。Affiverse
              的估值批评又指出风险的外部一面：大型电商生态和联盟基础设施参与者仍在改进自己的创作者电商工具。
            claimRefs:
              - CR008
