  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集合覆盖创作者电商老牌平台、工作流套件和传统联盟体系
        blocks:
          - type: paragraph
            body: >
              可观察的竞争集合远不止“ShopMy 对 LTK”。LTK 是创作者电商店铺和发现领域最清晰的直接老牌平台：留存来源称其是较早的联盟购物平台，也是更大的消费者购物入口；ShopMy
              则把自己定位成叠加在创作者既有内容上的可变现店铺，而不是原生信息流社交应用。但品牌买方也会把 ShopMy 与 Influencer Hero 或 GRIN
              等一体化网红运营系统比较，尤其在需要发现、触达、送礼、跟踪、付款和审批的一体化流程时。第三种替代方案是继续使用现有联盟网络体系。Make Influence 的比较尤其重要，因为它称 ShopMy 的
              “Commissionable Partners” 仍可通过 ShareASale、Impact、Rakuten 和 CJ 运行；因此，部分品牌可以把 ShopMy
              作为分发层，或继续采用传统网络模式，而不是彻底重构平台。公开证据没有单独评估定制化内部建设，因此最接近的可观察内部建设 / 现状代理指标，是已经叠加在这些网络之上的品牌自营联盟体系。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP008
              - CP010
      - number: '3.2'
        title: ShopMy 以可变现店铺和归因形成差异化，但定价与编排能力仍有取舍
        blocks:
          - type: paragraph
            body: >
              留存来源一致认为，ShopMy 的产品优势在创作者店铺、可赚取佣金的链接、送礼流程和直接收入归因，而不是企业级营销编排。独立评测和竞争对手撰写的评测都描述了分层品牌经济性：月费 $399 起，高级层级需询价，另有
              GMV 费用，以及按付费 Opportunities 预算收取 15%
              的单独费用。对主要需要联盟驱动需求和精选创作者的时尚、美妆、生活方式品牌，这种结构可能很有吸引力；但当买方需要多方审批、广泛品类覆盖或可预测的全包定价时，吸引力会下降。近期官方发布也显示 ShopMy 正通过
              Circles、愿望单和品味档案从联盟工具走向消费者发现，这强化了其相对纯联盟网络的差异化，却也扩大了它需要与 LTK 式发现产品及已把自己定位为端到端系统的工作流套件竞争的场景。
            claimRefs:
              - CP004
              - CP007
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP008
              - CP010
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP007
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP004
              - CP008
              - CP010
              - CP011
      - number: '3.3'
        title: 护城河耐久性更多取决于分发和数据循环，而非硬性排他
        blocks:
          - type: paragraph
            body: >
              对持久护城河最有力的反证，是创作者和品牌很容易多平台经营。现有创作者评测明确称，即使创作者已经使用 LTK，ShopMy
              仍值得使用；“我认识的大多数创作者，包括我自己，都同时使用两者”，这削弱了店铺参与具有排他性的假设。品牌端也有同样现象：传统联盟网络仍可作为 Commissionable Partners
              的底层，因此切换决定可能是叠加而非替换。竞争对手评测还暴露了较软的不利信号——公开 B2B
              评测稀少、创作者抱怨付款透明度或延迟，以及核心垂直领域之外的工作流深度不足。合并来看，证据支持其在高端创作者电商中的真实细分优势，但尚未证明赢家通吃的护城河。最大的未决尽调缺口，是相对 LTK
              或重工作流网红套件的中立正面胜率、流失率、实际企业定价和转化提升对比。
            claimRefs:
              - CP003
              - CP009
              - CP012
              - CP013
      - number: '3.4'
        title: 展示
        blocks:
          - type: callout
            title: ShopMy 是叠加在传统联盟体系之上竞争，而不只是与其对抗
            body: 最重要的替代风险不只是另一款店铺应用。ShopMy 可与 Commissionable Partners 的传统联盟网络共存，因此品牌采用可能是叠加，而不是干净的平台替换。
            calloutType: insight
            claimRefs:
              - CP003
              - CP009
          - type: callout
            title: 多平台经营削弱强锁定
            body: 公开创作者证据显示 ShopMy 和 LTK 经常并用；而当品牌团队更需要审批、CRM 和编排，而不是店铺主导的收入层时，重工作流平台仍显得更强。
            calloutType: risk
            claimRefs:
              - CP009
              - CP010
              - CP013
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入架构与定价逻辑
        blocks:
          - type: paragraph
            body: >-
              ShopMy 的变现似乎足够多元，不依赖单一收费渠道。独立分析和公司材料都描述了同一体系：从创作者店铺和跟踪链接起步，再通过软件订阅、交易关联费用、营销费用、送礼流程和创作者佣金分成向品牌变现。这种组合让
              ShopMy 同时拥有经常性软件收入，以及品牌支出和创作者转化增长带来的使用量上行空间。

              关键限制是，公开资料对挂牌价格和机制的说明多于对实际经济性的说明。Teardown 称订阅收入与交易收入并行增长；ShopMy
              自己的联盟平台说明也确认，这类平台可以同时收取按交易计费、营销费和订阅费。创作者端的证据还表明，结算机制并非纸上谈兵：低门槛以上的每周付款和清晰的单品佣金让模式在运营上可信，但没有披露实际抽成率、折扣或退款损耗。
