evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: GAAP revenue, gross margin by stream, burn, cash balance, and runway.
    whyItMatters: >-
      These determine whether the $1.5B valuation is supported by durable economics rather than directional growth
      claims.
    diligencePath: Request audited or board-approved monthly financials plus cash-bridge detail.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Board composition, committee structure, and a documented executive change history.
    whyItMatters: Governance resilience and investor control cannot be evaluated from founder titles alone.
    diligencePath: Request the board deck, current board observer list, and cap-table governance schedule.
    relatedQuestionRefs:
      - QO002
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale-metrics
    missingEvidence: >-
      A reconciled KPI glossary covering creators, tastemakers, brand partners, commissionable brands, customers, and
      headcount.
    whyItMatters: Inconsistent public scale definitions make it hard to trend adoption or compare the business against peers.
    diligencePath: Request the internal KPI dictionary and the latest operating dashboard with historical time series.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: financing-terms
    missingEvidence: Share count, ownership by investor, liquidation preferences, pro rata terms, and any secondary sale component.
    whyItMatters: Round size and headline valuation alone do not show dilution, downside protection, or investor control.
    diligencePath: Request the latest cap table, financing docs, and board approvals for the Series C.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: Independent TAM, SAM, or SOM estimates for premium-brand creator-commerce software by geography and segment.
    whyItMatters: >-
      Proxy lenses support adoption but do not show how large the defendable software market is or how fast it can
      expand beyond current vertical concentration.
    diligencePath: >-
      Obtain independent analyst or public-company category work that separates creator-commerce software from broader
      influencer marketing and affiliate spend.
    relatedQuestionRefs:
      - QM008
  - type: conflicting-data
    severity: material
    topic: denominator-ambiguity
    missingEvidence: A reconciled definition of accessible brands, active brand partners, and paying software customers.
    whyItMatters: >-
      Public denominators range from 1,000+ brand partners to tens of thousands of brands, which changes take-rate,
      retention, and market-share interpretation.
    diligencePath: >-
      Request cohort definitions for merchants, active paying brands, GMV-contributing brands, and churned logos from
      management or audited investor materials.
    relatedQuestionRefs:
      - QM007
  - type: private-evidence-only
    severity: material
    topic: outside-core-verticals
    missingEvidence: Retention, ROI, and sales-efficiency data for categories outside fashion, beauty, wellness, and lifestyle.
    whyItMatters: >-
      Multiple reviews imply strong product-market fit in core taste-led categories but weaker fit elsewhere, which
      limits market-expansion confidence.
    diligencePath: >-
      Ask for vertical cohort performance, logo retention, and sales payback by category, AOV band, and campaign
      complexity.
    relatedQuestionRefs:
      - QM004
      - QM006
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-retention
    missingEvidence: >-
      Negotiated enterprise pricing, GMV fee concessions, creator payout terms, logo churn, and win/loss data against
      LTK and workflow-heavy influencer suites.
    whyItMatters: >-
      These datapoints determine whether ShopMy's public $399 entry point and storefront differentiation translate into
      durable economic advantage or just a thin wedge into larger brand programs.
    diligencePath: >-
      Request recent brand contracts, cohort retention by brand and creator segment, and a structured win/loss summary
      against LTK, GRIN, and all-in-one influencer SaaS peers.
    relatedQuestionRefs:
      - QP003
      - QP008
  - type: missing-source
    severity: material
    topic: neutral-head-to-head-benchmark
    missingEvidence: >-
      Independent conversion, shopper engagement, or workflow-efficiency benchmarks that compare ShopMy directly with
      LTK, classic affiliate networks, and workflow-heavy influencer suites.
    whyItMatters: >-
      Without a neutral benchmark, the strongest public comparisons remain competitor-authored reviews, creator
      anecdotes, and company-issued growth claims.
    diligencePath: >-
      Obtain third-party case studies, brand references willing to compare pre/post platform performance, or internal
      A/B analyses on creator sales, campaign labor, and shopper retention.
    relatedQuestionRefs:
      - QP007
      - QP008
  - type: private-evidence-only
    severity: blocking
