company:
  name: ShopMy
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    ShopMy's addressable market is better described as creator-commerce infrastructure for
    fashion, beauty, lifestyle, and other recommendation-heavy brands than as a generic
    social-commerce TAM. Public evidence supports real adoption and monetization proxies—free
    creator onboarding, $399-$2,799+/month brand pricing, hundreds of millions of brand-sales
    throughput, and a six-figure creator network—but the assigned source pool still cannot
    isolate an independent TAM/SAM/SOM estimate for premium-brand creator-commerce software.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The strongest public evidence places ShopMy in creator-commerce infrastructure rather than
      a single-purpose affiliate-link tool. Official onboarding materials define the core
      workflow as turning recommendations into commissionable links that creators share across
      platforms, while third-party reviews describe the same stack as a digital storefront,
      affiliate engine, gifting workflow, and brand-collaboration surface. That boundary matters
      because it includes creator storefronts, link monetization, gifting, and brand discovery,
      but excludes broader influencer-agency software, pure social networks, and generic checkout
      tooling. The nearest status-quo substitutes are legacy affiliate networks and manual
      creator-brand outreach, both of which leave attribution and workflow fragmentation problems
      that ShopMy explicitly tries to solve.
    claimRefs: [CM001, CM002, CM004, CM005]
    tableRefs: [TM001]
  - id: buyer-and-budget
    title: Buyer, user, and payer path
    body: >-
      ShopMy is a multi-sided product, but the cash budget appears to sit primarily with brands
      and their agencies, not with creators. Creator-facing sources consistently describe free
      access, weekly payouts, and gifting workflows as adoption hooks, which makes creators the
      supply side rather than the paying customer. The brand-side pricing evidence is the
      clearest budget signal in the assigned pool: public third-party reviews describe monthly
      subscriptions from $399 to $2,799+ plus transaction fees, which implies ownership by
      growth, affiliate, influencer, or e-commerce teams evaluating ROI and creator coverage.
      Consumers matter more after the 2025 shopping-platform launch, but the monetization logic
      still runs through creator curation and brand demand generation.
    claimRefs: [CM002, CM003, CM005, CM012, CM016]
    tableRefs: [TM003]
  - id: drivers-and-constraints
    title: Adoption drivers and constraints
    body: >-
      Public sources point to three adoption drivers. First, creator-side friction is low:
      onboarding is free, links can be shared across existing channels, payouts are frequent,
      and gifting can generate inventory for new content. Second, the company pitch to brands is
      economic rather than purely branding-led; official materials emphasize better attribution,
      discount-code capture, performance analytics, and access to high-intent shoppers. Third,
      vertical concentration appears deliberate: multiple third-party sources describe strongest
      fit in fashion, beauty, wellness, and lifestyle, where visual merchandising, gifting, and
      taste-based discovery are already native behaviors. The main constraints are equally clear:
      upper-tier pricing is quote-based, extra fees can erode ROI, brand-side public review
      depth is thin, and even favorable reviewers warn that the workflow is weaker outside core
      verticals or more complex campaign environments.
    claimRefs: [CM004, CM006, CM007, CM014, CM016]
  - id: sizing-and-gaps
    title: Evidence-constrained sizing and remaining gaps
    body: >-
      The assigned pool supports a constrained sizing view, not a clean TAM/SAM/SOM stack.
      Company-linked and independent sources establish monetization layers that matter for
      valuation: typical creator commissions of roughly 10-30%, some case-study creator earnings
      as high as $50K per month, monthly brand software spend from $399 to $2,799+, and company
      claims that the platform had already driven $352 million in brand sales by January 2025
      before expanding to a consumer shopping surface later that year. Those are useful demand
      and throughput lenses, but they are not the same as a third-party estimate of total
      addressable spend for premium-brand creator-commerce software. Public numerators also use
      different denominators—1,000+ brand partners in company releases versus tens of thousands
      of accessible brands in creator reviews—so public evidence still cannot separate the active
      paying brand base from the broader merchant catalog.
    claimRefs: [CM003, CM008, CM009, CM010, CM011, CM012, CM013, CM014, CM015]
    tableRefs: [TM002]
    figureRefs: [FM001]
