figures:
  - id: FM001
    title: Evidence-constrained adoption and monetization stack
    type: pyramid
    summary: >-
      Public evidence supports creator-economics, brand-budget, throughput, and network-scale
      lenses, but the layers are non-additive proxies rather than a clean TAM/SAM/SOM stack.
    data:
      items:
        - label: Creator commission baseline
          value: 10-30%
          unit: Typical creator commission range
          note: Third-party creator reviews; creator-side earning lens, not market size.
          claimRefs: [CM002, CM016]
        - label: Creator income upside example
          value: $50K/month
          unit: Reported upside for some influencers
          note: Company-selected case-study signal from ShopMy's affiliate-landscape post.
          claimRefs: [CM007]
        - label: Brand entry spend
          value: $399/month
          unit: Entry-level affiliate access
          note: Public brand-pricing floor from a July 2026 competitor review.
          claimRefs: [CM003]
        - label: Brand full-platform spend
          value: $2,799+/month
          unit: Full-platform access before extra fees
          note: Upper tier is quote-based and layered with transaction fees.
          claimRefs: [CM003, CM014]
        - label: Reported 2025 throughput
          value: $352M
          unit: Brand sales cited by ShopMy as of January 2025
          note: Independent article quoting company-supplied operating data.
          claimRefs: [CM008]
        - label: Expanded ecosystem scale
          value: 175K+ / 1K+
          unit: Creators / brand partners in July 2025 launch release
          note: Network-scale lens; this is not the same as active paying brand count.
          claimRefs: [CM012, CM013]
    approximationNotes: >-
      Mixed units are intentional because the assigned pool lacks an independent TAM/SAM/SOM
      decomposition. The figure stacks creator economics, brand software budget, and platform
      throughput proxies in authored order without implying that the layers are additive.
    claimRefs: [CM003, CM007, CM008, CM012, CM013, CM014, CM016]
callouts:
  - calloutType: insight
    title: Brand budgets drive monetization, creators drive supply
    body: >-
      The clearest cash budget in public evidence sits with brands and agencies paying for
      attribution, gifting, and creator-operations software, while creators are pulled in by
      free onboarding, commissions, and gifting access rather than subscription fees.
    claimRefs: [CM002, CM003, CM005, CM016]
  - calloutType: risk
    title: Market-size confidence is still proxy-based
    body: >-
      The assigned sources prove real adoption and monetization, but they stop short of an
      independent market-size model and they use inconsistent denominators for brand coverage, so
      valuation work still needs a cleaner split between accessible merchants, active paying
      brands, and multi-year retention.
    claimRefs: [CM013, CM014, CM015]
