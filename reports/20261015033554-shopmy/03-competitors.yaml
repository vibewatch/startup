      - ["Influencer Hero", "Adjacent all-in-one influencer SaaS", "$649/month entry, $1,049/month mid tier, and $2,490/month advanced plan per retained review", "DTC brands and agencies that want one system from discovery through payout", "Broader workflow stack: discovery, outreach, CRM, gifting, affiliate tracking, payments, and reporting", "No retained evidence of a built-in creator shopping destination comparable to LTK"]
