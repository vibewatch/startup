    title: "ShopMy competes on top of, not only against, the incumbent affiliate stack"
    body: "The most important substitute risk is not just another storefront app. ShopMy can coexist with incumbent affiliate networks for Commissionable Partners, so brand adoption can be additive rather than a clean platform replacement."
    claimRefs: ["CP003", "CP009"]
  - calloutType: "risk"
    title: "Multi-homing weakens hard lock-in"
    body: "Public creator evidence shows ShopMy and LTK are often used side by side, while workflow-heavy platforms still look stronger where brand teams need approvals, CRM, and orchestration more than a storefront-led revenue layer."
    claimRefs: ["CP009", "CP010", "CP013"]
