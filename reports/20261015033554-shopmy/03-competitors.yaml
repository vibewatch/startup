      - ["ShopMy Network Access Package", "Custom pricing", "2.9% GMV fee; creator commissions separate", "Access to vetted creator network, messaging, discovery, analytics", "Quote-based pricing obscures mid-market fit before a sales process"]
      - ["ShopMy Opportunities", "No standalone subscription quoted", "15% platform fee on campaign budget on top of subscription", "Paid creator campaigns with tracked deliverables and bonuses", "Makes ShopMy more than an affiliate tool, but adds another cost layer"]
      - ["Influencer Hero", "$649 / $1,049 / $2,490 per month in retained review", "No GMV transaction fee stated in retained review", "Discovery, outreach, CRM, gifting, affiliate tracking, payments, reporting", "Higher visible software price but more workflow bundled into list pricing"]
      - ["LTK / traditional network baseline", "Commission economics vary by retailer or brand; Make Influence cites typical LTK creator commissions and notes network-led payouts vary", "Brand sets creator commission; network economics vary", "Storefront distribution on LTK or pure tracking rails on classic networks", "Public evidence supports directional comparison, not a like-for-like enterprise contract benchmark"]
    notes: "Pricing rows mix list pricing and directional public signals; retained sources do not provide negotiated enterprise contracts, discounting, or realized take rates."
    claimRefs: ["CP003", "CP007", "CP012"]
