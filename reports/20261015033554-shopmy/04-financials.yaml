  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: Current cash balance, monthly burn or free cash flow, debt facilities, covenant thresholds, and management runway case.
      whyItMatters: Without liquidity data, the public record cannot establish whether the October 2025 round fully funds the current expansion plan or only postpones the next financing decision.
      diligencePath: Request monthly cash bridge, debt schedule, board-approved operating plan, and downside runway scenario from management.
      relatedQuestionRefs: [QI006]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: revenue-quality
      missingEvidence: Audited GAAP revenue by stream, revenue-recognition policy, gross margin by stream, and reconciliation from GMV to recognized revenue.
      whyItMatters: Public GMV and growth claims are not enough to underwrite valuation or margin durability without knowing how much of platform activity becomes high-quality revenue.
      diligencePath: Obtain audited financial statements, stream-level P&L, and revenue-recognition memo covering subscriptions, campaigns, gifting, and affiliate flows.
      relatedQuestionRefs: [QI004, QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: concentration-and-retention
      missingEvidence: Top-brand revenue concentration, top-creator GMV concentration, cohort retention, logo churn, and realized pricing after discounts or make-goods.
      whyItMatters: A creator-commerce platform can look efficient on aggregate while remaining dependent on a narrow set of brands or tastemakers.
      diligencePath: Request brand and creator cohort tables, NRR or gross retention by segment, and realized pricing waterfall for the top 20 accounts.
      relatedQuestionRefs: [QI003, QI008]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: working-capital
      missingEvidence: Reserve policy for creator payouts, refund and chargeback rates, payable timing to creators, and any merchant-funding or pass-through cash restrictions.
      whyItMatters: Positive working-capital timing can support growth, but payout disputes or reserve needs can also consume cash and damage trust.
      diligencePath: Review payout policy, reserve calculations, cash-control account structure, and historical dispute or clawback metrics.
      relatedQuestionRefs: [QI004, QI007]
      relatedTableRefs: [TI003]
