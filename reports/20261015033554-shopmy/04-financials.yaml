schemaVersion: report-v2
artifact: financials
slug: shopmy
runDate: 2026-10-15
company:
  name: ShopMy
chapter:
  number: 4
  title: Financials
  summary: >-
    ShopMy's public financial story is a hybrid of software subscriptions,
    transaction fees, campaign fees, and creator-commission economics layered on
    top of a creator-commerce network that now also includes a consumer shopping
    surface. Public traction signals are directionally strong, but the most
    important underwriting inputs—audited revenue quality, gross margin by
    stream, and current cash runway—remain undisclosed, so the chapter can only
    support a qualified read on margin path and capital needs.
sections:
  - id: revenue-architecture
    title: Revenue architecture and pricing logic
    body: |-
      ShopMy's monetization appears diversified enough to avoid dependence on a single fee rail. Independent analysis and company-authored materials both describe a system that starts with creator storefronts and tracked links, then monetizes brands through software subscriptions, transaction-linked fees, campaign fees, gifting workflows, and a share of creator commissions. That mix matters because it gives ShopMy both recurring software revenue and usage-linked upside when brand spend and creator conversions increase.

      The quality caveat is that list pricing and mechanism are more visible than realized economics. Teardown describes subscriptions moving alongside transaction revenue, while ShopMy's own affiliate-platform explainer confirms that platforms like this can combine per-transaction fees, campaign fees, and subscription pricing. Creator-side proof also shows the payout mechanics are concrete rather than theoretical: weekly disbursements above a low threshold and visible per-product commissions make the revenue model operationally credible, but they do not disclose realized take rate, discounting, or refund leakage.
    claimRefs: [CI001, CI002, CI003, CI004, CI008]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: sales-efficiency-and-traction
    title: Public sales-efficiency proxies and traction
    body: |-
      The public record supports a revenue engine built around measurable commerce outcomes, not generic brand awareness. Brand operators using or reviewing the platform describe creator-level GMV, average order value, gifting acceptance, and attributable sales dashboards, while Fortune and Inc. both frame the product as infrastructure that turns creators into measurable sales channels for brands. That is the right shape of evidence for a premium creator-commerce platform, even if most hard numbers still originate with the company or with third-party estimation.

      Traction claims are large enough to matter but unevenly corroborated. The October 2025 financing release cites more than $1 billion in annual platform sales, 185,000+ tastemakers, 1,200+ brand partners, 200% revenue growth, and sustained profitability since 2024; Inc. separately reported 150,000 creators, 1,000 brand partners, and $352 million in brand sales around the January 2025 product cycle. Teardown adds an external estimate of roughly $80 million 2025 revenue and a shift from a 65/35 subscription-to-transaction mix in 2024 toward 50/50 in 2025, which is useful but still not a substitute for audited revenue by stream.
    claimRefs: [CI005, CI006, CI007, CI008, CI012]
    tableRefs: [TI003]
  - id: cost-structure-and-capital
    title: Cost structure, working-capital profile, and capital needs
    body: |-
      ShopMy's disclosed and inferred economics point to a business that can plausibly generate attractive gross margins, but the public evidence is still too thin to underwrite that confidently. The strongest positive signal is structural: software subscriptions should be high-margin, and Teardown argues that campaign budgets and affiliate balances can sit on ShopMy's balance sheet before creator disbursement. The company also says it has been profitable since 2024 and raised a $70 million round at a $1.5 billion valuation, which reduces immediate financing pressure in principle.

      The underwriting problem is that none of the retained public sources disclose current cash, burn, runway, debt, gross margin by stream, or service-delivery cost intensity. That leaves investors relying on platform-sales proxies, company-claimed growth, and estimated revenue rather than audited unit economics. At the same time, Teardown surfaces two financial risks that matter directly to margin durability: retailer/platform disintermediation can compress ShopMy's take-rate position, and creator trust can erode if payout disputes or pricing changes make the platform feel extractive.
    claimRefs: [CI006, CI009, CI010, CI011, CI013, CI014]
  - id: verdict
    title: Financial verdict and diligence blockers
    body: |-
      The financial case for ShopMy is strongest when framed as a premium creator-commerce operating system with multiple monetization layers and credible sales-efficiency instrumentation. If the business can keep growing brand subscriptions while sustaining transaction, campaign, and creator-economics take rates, then the public evidence is consistent with a company that has already crossed from category narrative into real revenue generation.

      The chapter still stops short of an underwriting-grade conclusion. Public materials do not establish audited GAAP revenue, gross margin by stream, realized pricing after incentives, concentration by brand or creator cohort, or current liquidity. That means the right verdict is that revenue quality looks promising, margin path is plausible but unproven, and financing dependency cannot be cleared without management data-room evidence on cash, burn, working capital, and concentration.
    claimRefs: [CI008, CI010, CI013, CI014]
callouts:
  - calloutType: insight
    title: Multiple fee rails reduce single-product dependence
    body: >-
      ShopMy is not monetizing only one side of the marketplace: public evidence
      points to subscription revenue, transaction-linked fees, paid campaign
      fees, gifting-related fees, and a share of creator commissions. That mix
      improves revenue resilience if any one product motion slows.
    claimRefs: [CI002, CI003, CI004]
  - calloutType: risk
    title: Revenue quality is still harder to prove than topline momentum
    body: >-
      The company and third-party commentary provide meaningful growth proxies,
      but underwriting is still blocked by missing audited revenue, margin, and
      liquidity disclosure, while adverse evidence points to possible take-rate
      and trust pressure around payout disputes and disintermediation.
    claimRefs: [CI006, CI008, CI013, CI014]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - [Brand software subscriptions, "Brands pay for discovery, analytics, campaign, and workflow tooling.", per brand per month, "$399/month entry tier to $2,799+/month full tooling list pricing cited by Teardown.", "Good evidence on list pricing; no realized ASP disclosure.", "Provide realized ASP by brand cohort, discounting, and renewal rates."]
      - [Direct-brand affiliate fees, "ShopMy takes a percentage of GMV on direct-brand affiliate sales.", "% of GMV", "Up to 2.9% of GMV per Teardown.", "Mechanism is clear; realized blended take rate undisclosed.", "Provide net take rate after refunds, reversals, and incentives."]
      - [Subaffiliate network fees, "ShopMy routes commerce through third-party affiliate networks and retains a higher network-style fee.", "% of GMV", "~3.9% on subaffiliate sales per Teardown.", "Estimate from third-party analysis, not company filing.", "Break out direct vs subaffiliate mix and associated gross margin."]
      - [Paid Opportunities fees, "Brands pay flat fees plus performance budgets for paid creator campaigns.", "% of campaign budget", "15% platform fee on campaign budgets per Teardown.", "Publicly described but not reconciled to revenue.", "Provide campaign-budget volume, attach rate, and retention by brand cohort."]
      - [Lookbooks / gifting facilitation, "Automated gifting workflows can generate facilitation fees and follow-on paid campaigns.", gifting program volume / fee, "$10M in gifting volume in the first six months per Teardown; exact fee terms undisclosed.", "Supports demand but not monetization yield.", "Disclose fee schedule, fulfillment costs, and conversion from gifting to paid campaigns."]
      - [Creator commission share, "ShopMy retains part of tracked creator commissions before remittance.", "% of creator commission", "ShopMy keeps 18% and remits 82%; weekly payouts above $11 threshold.", "Supported by creator-facing materials and creator review.", "Show payout reversal rates, reserve policy, and creator churn by earnings cohort."]
    notes: >-
      Combines company-controlled and independent sources; list pricing and fee
      mechanics are more visible than realized monetization, and several values
      are third-party estimates rather than audited disclosures.
    claimRefs: [CI001, CI002, CI003, CI004, CI008]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer / fee rail
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - [Brand affiliate access, "$399/month entry subscription", list pricing, "Unknown realized net price, contract length, and ramp concessions.", "Teardown estimate cited by independent analysis"]
      - [Full brand tooling, "$2,799+/month for discovery, analytics, and campaign tooling", list pricing, "Unknown enterprise custom pricing and multi-product bundle terms.", "Teardown estimate cited by independent analysis"]
      - [Direct-brand transactions, "Up to 2.9% of GMV", list pricing / ceiling, "Unknown blended take rate by category, refund behavior, and top-brand concentration.", "Teardown"]
      - [Third-party network transactions, "~3.9% of GMV", estimated effective rate, "Unknown network-specific economics and pass-through costs.", "Teardown"]
      - [Opportunities campaigns, "15% platform fee on campaign budgets", public platform fee, "Unknown minimum spends, creator payout terms, and attach rate.", "Teardown"]
      - [Creator earnings payout, "82% creator share, 18% retained by ShopMy; weekly payout above $11", operating policy, "Unknown reserves, clawbacks, and dispute resolution costs.", "Teardown and Salty Vagabonds review"]
    notes: >-
      This is a pricing-mechanics table, not a realized revenue table; public
      sources do not disclose discounting, contract duration, or net revenue
      recognition by fee rail.
    claimRefs: [CI002, CI003, CI004, CI012]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Annual platform sales", "$1B+ annual platform sales", medium, "Shows marketplace throughput but is GMV, not revenue.", "Reconcile GMV to recognized revenue by stream and take rate."]
      - ["Estimated 2025 revenue", "~$80M estimate", medium, "Useful external framing for valuation and scale, but not audited.", "Provide monthly revenue bridge and audited FY2025 statements."]
      - ["Revenue growth", "200% YoY company claim", medium, "Suggests operating leverage if repeatable.", "Provide base-period revenue, cohort drivers, and organic vs acquired growth."]
      - ["Revenue mix", "65/35 subscription-to-transaction in 2024, moving toward 50/50 in 2025", low, "Mix determines gross-margin durability and sensitivity to GMV swings.", "Provide actual stream mix and gross margin by stream."]
      - ["Campaign efficiency", "3.3x ROAS and 53% lower CPC than Instagram ads in Teardown's cited metrics", low, "Supports sales efficiency positioning if repeatable.", "Provide cohort-level campaign ROAS distribution and methodology."]
      - ["Creator productivity proof point", "$34 volume yielding $4 commission in one creator example", low, "Shows the unit-level economics are observable to creators.", "Provide creator earnings distribution and active-creator monetization cohorts."]
      - ["Current cash / runway", null, low, "Capital adequacy cannot be underwritten without liquidity.", "Provide ending cash, monthly burn or free cash flow, debt, and minimum cash covenant."]
      - ["Gross margin by stream", null, low, "Margin path depends on software mix, payout operations, and paid-campaign servicing.", "Provide gross margin for subscriptions, transaction revenue, and services."]
      - ["Brand / creator concentration", null, low, "Top-customer or top-creator dependence can distort revenue durability.", "Provide top-10 brand revenue share, top-creator GMV share, and cohort retention."]
    notes: >-
      Nulls mark missing public data rather than zeroes. Company-reported,
      estimated, and anecdotal metrics are intentionally separated because they
      are not equally reliable for underwriting.
    claimRefs: [CI005, CI006, CI007, CI008, CI010, CI011, CI012, CI013, CI014]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      ShopMy monetizes the same commerce loop at several points, from creator
      tools to brand subscriptions, campaign fees, transaction fees, and
      commission retention.
    data:
      nodes:
        - label: Creators build storefronts and links
          note: >-
            Browser extension, storefronts, and tracked links create the
            monetizable surface.
        - label: Shoppers discover and save products
          note: >-
            Circles, wishlists, and storefront browsing aim to extend shopping
            beyond short-lived social posts.
        - label: Commerce flows to brands
          note: >-
            Purchases route to direct-brand programs or third-party affiliate
            networks.
        - label: Brands pay ShopMy software fees
          note: >-
            Public pricing ranges from roughly $399/month to $2,799+/month for
            brand tooling.
        - label: ShopMy takes transaction and campaign fees
          note: >-
            Teardown cites up to 2.9% direct-brand GMV fees, ~3.9%
            subaffiliate fees, and a 15% Opportunities fee.
        - label: Creators receive net commissions
          note: >-
            Creator payouts are weekly above $11, with ShopMy retaining 18% of
            commissions and remitting 82%.
      edges:
        - from: Creators build storefronts and links
          to: Shoppers discover and save products
          label: Recommendations and discovery
        - from: Shoppers discover and save products
          to: Commerce flows to brands
          label: Clicks, wishlists, and purchases
        - from: Commerce flows to brands
          to: Brands pay ShopMy software fees
          label: Workflow and attribution value
        - from: Brands pay ShopMy software fees
          to: ShopMy takes transaction and campaign fees
          label: Subscription plus usage-linked monetization
        - from: ShopMy takes transaction and campaign fees
          to: Creators receive net commissions
          label: Payout and retained commission split
    approximationNotes: >-
      This is a mechanics bridge rather than a value-proportional waterfall; it
      shows where monetization occurs, not audited stream proportions.
    claimRefs: [CI003, CI004, CI009, CI011]
