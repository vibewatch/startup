  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      ShopMy monetizes the same commerce loop at several points, from creator tools to brand subscriptions, campaign
      fees, transaction fees, and commission retention.
    data:
      nodes:
        - label: Creators build storefronts and links
          note: Browser extension, storefronts, and tracked links create the monetizable surface.
        - label: Shoppers discover and save products
          note: Circles, wishlists, and storefront browsing aim to extend shopping beyond short-lived social posts.
        - label: Commerce flows to brands
          note: Purchases route to direct-brand programs or third-party affiliate networks.
        - label: Brands pay ShopMy software fees
          note: Public pricing ranges from roughly $399/month to $2,799+/month for brand tooling.
        - label: ShopMy takes transaction and campaign fees
          note: Teardown cites up to 2.9% direct-brand GMV fees, ~3.9% subaffiliate fees, and a 15% Opportunities fee.
        - label: Creators receive net commissions
          note: Creator payouts are weekly above $11, with ShopMy retaining 18% of commissions and remitting 82%.
      edges:
        - from: Creators build storefronts and links
          to: Shoppers discover and save products
          label: Recommendations and discovery
        - from: Shoppers discover and save products
          to: Commerce flows to brands
          label: Clicks, wishlists, and purchases
        - from: Commerce flows to brands
          to: Brands pay ShopMy software fees
          label: Workflow and attribution value
        - from: Brands pay ShopMy software fees
          to: ShopMy takes transaction and campaign fees
          label: Subscription plus usage-linked monetization
        - from: ShopMy takes transaction and campaign fees
          to: Creators receive net commissions
          label: Payout and retained commission split
    approximationNotes: >-
      This is a mechanics bridge rather than a value-proportional waterfall; it shows where monetization occurs, not
      audited stream proportions.
    claimRefs:
      - CI003
      - CI004
      - CI009
      - CI011
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      ShopMy’s public product stack layers creator storefront authoring on top of link monetization, partner-network
      rails, brand workflow software, and newer consumer discovery surfaces.
    data:
      layers:
        - label: Creator authoring layer
          detail: Creators assemble collections, posts, consults, and storefront pages.
          modules:
            - Collections / sections
            - Shoppable posts
          outputs:
            - Persistent creator storefront
        - label: Link and attribution layer
          detail: ShopMy converts product URLs into commissionable links and tracks resulting commerce.
          modules:
            - Affiliate link generation
            - Order / commission tracking
          outputs:
            - Tracked creator-driven sales
        - label: Partner-network layer
          detail: Commissionable Partner coverage extends assortment through existing affiliate and storefront partners.
          modules:
            - Network-based commission rails
            - Partner storefront integrations
          outputs:
            - Broader merchant coverage
        - label: Brand workflow layer
          detail: Subscriptions package creator discovery, real-time sales data, and collaboration tooling for brands.
          modules:
            - Creator discovery
            - Brand analytics
          outputs:
            - Program management actions
        - label: Gifting and campaign layer
          detail: Lookbooks, gifting, and performance campaigns coordinate creator activation.
          modules:
            - Automated gifting
            - Performance campaigns
          outputs:
            - Product seeding and campaign spend
        - label: Consumer discovery layer
          detail: Circles, search, and wishlisting try to turn creator recommendations into a repeat shopping destination.
          modules:
            - Circles
            - Search / latest finds
          outputs:
            - Shopper discovery and saved demand
    approximationNotes: Layering reflects public operating-model evidence, not a disclosed internal systems diagram.
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE007
      - CE008
      - CE009
