  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture and pricing logic
        blocks:
          - type: paragraph
            body: >-
              ShopMy's monetization appears diversified enough to avoid dependence on a single fee rail. Independent
              analysis and company-authored materials both describe a system that starts with creator storefronts and
              tracked links, then monetizes brands through software subscriptions, transaction-linked fees, campaign
              fees, gifting workflows, and a share of creator commissions. That mix matters because it gives ShopMy both
              recurring software revenue and usage-linked upside when brand spend and creator conversions increase.


              The quality caveat is that list pricing and mechanism are more visible than realized economics. Teardown
              describes subscriptions moving alongside transaction revenue, while ShopMy's own affiliate-platform
              explainer confirms that platforms like this can combine per-transaction fees, campaign fees, and
              subscription pricing. Creator-side proof also shows the payout mechanics are concrete rather than
              theoretical: weekly disbursements above a low threshold and visible per-product commissions make the
              revenue model operationally credible, but they do not disclose realized take rate, discounting, or refund
              leakage.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI008
          - type: table
            tableRef: TI001
            claimRefs:
