  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set spans creator-commerce incumbents, workflow suites, and the incumbent affiliate stack
        blocks:
          - type: paragraph
            body: >
              The observable competitive set is broader than “ShopMy versus LTK.” LTK is the clearest direct incumbent
              in creator-commerce storefronts and discovery: retained sources describe it as the older
              affiliate-shopping platform and the larger consumer-shopping destination, while ShopMy positions itself as
              a monetizable storefront layered onto creators’ existing content rather than a feed-native social app. But
              brand buyers can also compare ShopMy against all-in-one influencer operating systems such as Influencer
              Hero or GRIN when they want discovery, outreach, gifting, tracking, payments, and approvals in one
              workflow. A third substitute is simply keeping the existing affiliate-network stack. Make Influence’s
              comparison is especially important here because it says ShopMy’s “Commissionable Partners” can still run
              through ShareASale, Impact, Rakuten, and CJ, which means some brands can add ShopMy as a distribution
              layer or stay with the incumbent network model instead of fully replatforming. Public evidence does not
              separately benchmark a bespoke in-house build, so the closest observable internal-build/status-quo proxy
              is the brand-operated affiliate stack that already sits on top of those networks.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP008
              - CP010
      - number: '3.2'
        title: >-
          ShopMy differentiates on monetizable storefronts and attribution, but pricing and orchestration remain
          trade-offs
        blocks:
          - type: paragraph
            body: >
              Retained sources consistently place ShopMy’s product edge in creator storefronts, commissionable links,
              gifting workflows, and direct revenue attribution rather than in enterprise campaign orchestration. The
              independent and competitor-authored reviews both describe layered brand economics: entry access at $399
              per month, quote-based higher tiers, GMV fees, and a separate 15% fee on paid Opportunities budgets. That
              structure can be attractive for fashion, beauty, and lifestyle brands that mainly want affiliate-led
              demand with curated creators, but it becomes less compelling when a buyer needs multi-stakeholder
              approvals, broad-category coverage, or predictable all-in list pricing. Recent official launches also show
              ShopMy moving beyond affiliate tooling toward consumer discovery through Circles, wishlists, and taste
              profiles, which strengthens its differentiation from pure networks but also expands the number of surfaces
              where it must compete with LTK-style discovery and with workflow suites that already sell themselves as
              end-to-end systems.
            claimRefs:
              - CP004
              - CP007
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP008
              - CP010
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP007
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP004
              - CP008
              - CP010
              - CP011
      - number: '3.3'
        title: Moat durability depends more on distribution and data loops than on hard exclusivity
        blocks:
          - type: paragraph
            body: >
              The strongest counterpoint to a durable moat is how often creators and brands can multi-home. The creator
              review in the assigned pool explicitly says ShopMy is worth using even if a creator already uses LTK and
              that “most creators I know, myself included, run both,” which weakens any assumption that storefront
              participation is exclusive. The same pattern shows up on the brand side: traditional affiliate networks
              can still remain underneath ShopMy for Commissionable Partners, so the switching decision may be additive
              rather than replacement. Competitor-authored reviews also surface softer adverse signals — sparse public
              B2B reviews, creator complaints around payment transparency or delays, and lighter workflow depth outside
              core verticals. Taken together, the evidence supports a real niche advantage in premium creator commerce,
              but not a proven winner-take-most moat. The biggest unresolved diligence gap is a neutral head-to-head
              benchmark on win rates, churn, realized enterprise pricing, and conversion uplift versus LTK or
              workflow-heavy influencer suites.
            claimRefs:
              - CP003
              - CP009
              - CP012
              - CP013
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: ShopMy competes on top of, not only against, the incumbent affiliate stack
            body: >-
              The most important substitute risk is not just another storefront app. ShopMy can coexist with incumbent
              affiliate networks for Commissionable Partners, so brand adoption can be additive rather than a clean
              platform replacement.
            calloutType: insight
            claimRefs:
              - CP003
              - CP009
          - type: callout
            title: Multi-homing weakens hard lock-in
            body: >-
              Public creator evidence shows ShopMy and LTK are often used side by side, while workflow-heavy platforms
              still look stronger where brand teams need approvals, CRM, and orchestration more than a storefront-led
              revenue layer.
            calloutType: risk
            claimRefs:
