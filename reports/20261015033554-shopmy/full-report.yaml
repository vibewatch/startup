      - number: '5.3'
        title: Differentiation, fit, and maturity
        blocks:
          - type: paragraph
            body: >-
              ShopMy’s differentiation is not just storefront creation; it is the combination of creator distribution,
              attribution, gifting, and increasingly brand workflow software in a taste-led environment. The product
              appears strongest where that model fits fast-moving discretionary categories: apparel, beauty, lifestyle,
              and adjacent creator-led verticals. Public sources also show maturity expansion over time, from creator
              link monetization to subscription software for brands and then to shopper-facing discovery via Circles and
              improved storefront search. Even so, much of the brand-retention, direct creator-to-shopper engagement,
              and deeper analytics story is still presented as rollout or roadmap language, so the product is clearly
              broadening but not yet fully evidenced as a finished end-to-end operating system in public materials.
            claimRefs:
              - CE005
              - CE007
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Trust, controls, and open product risk
        blocks:
          - type: paragraph
            body: >-
              The weakest part of the public record is not feature breadth but operating assurance. The assigned pool
              documents pricing, network design, storefront behavior, and creator monetization in detail, yet it does
              not surface a public trust center, uptime/status disclosures, audited security certifications, or formal
              privacy/compliance controls for buyers to inspect. That matters because ShopMy sits in transaction
              attribution, shopper discovery, and brand analytics workflows where operational reliability and data
              handling are material. Competitive/legal friction is also visible: Modern Retail reported that LTK sued
              ShopMy over false advertising, trademark infringement, and unfair competition before later dropping the
              case. The product thesis is credible, but diligence still needs direct proof on control maturity rather
              than feature marketing.
            claimRefs:
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Cross-sided workflow breadth is real
            body: >-
              The strongest product signal is breadth across creators, brands, and shoppers: ShopMy is no longer only a
              link generator, because public sources show live storefronts, brand dashboards, gifting workflows, and a
              consumer discovery surface.
            calloutType: strength
            claimRefs:
              - CE001
              - CE005
              - CE007
              - CE011
          - type: callout
            title: Partner rails accelerate coverage but add dependency
            body: >-
              ShopMy’s ability to sit above existing affiliate-network and storefront infrastructure helps assortment
              scale faster, but it also makes attribution rules, commissions, and merchant readiness partly dependent on
              third-party systems.
            calloutType: insight
            claimRefs:
              - CE003
              - CE004
              - CE011
          - type: callout
            title: Control maturity is under-documented
            body: >-
              Public product evidence is much stronger on monetization and discovery than on uptime, security, privacy,
              or formal compliance controls, so buyer diligence still needs direct operating-assurance proof.
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segment mix and the paying customer are clear
        blocks:
          - type: paragraph
            body: >-
              The public record consistently shows ShopMy as a three-sided system in which brands are the paying
              software and campaign customers, creators are the monetizing supply side, and shoppers are the demand
              layer that the company added more explicitly with Circles and wishlists. The strongest documented fit
              remains premium beauty, fashion, skincare, and lifestyle, where both official materials and independent
              writeups describe a dense supply of vetted micro and nano creators plus direct attribution for brand
              teams. ShopMy also appears to widen catalog breadth through "Commissionable Partners" that sit on top of
              existing affiliate networks, which is strategically useful because it separates direct platform customers
              from the much larger universe of brands whose products can still be linked. On the creator side,
              customer-proof sources portray access as materially more open than older invite-gated storefront apps, but
              they stop short of proving what share of registered creators stay active or meaningfully monetize.
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU006
              - CU016
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU005
              - CU007
              - CU013
              - CU015
              - CU016
      - number: '6.2'
        title: Adoption proof is real, but it still skews to case studies
        blocks:
          - type: paragraph
            body: >-
              ShopMy clears the "real usage" bar more convincingly than the "durable cohort quality" bar. Inc and
              ShopMy's own 2025 launch materials converge on a base of roughly 150,000 to 175,000 creators and about
              1,000 direct brand partners, while later third-party review material pushes those figures to around
              200,000 creators and 1,200 brand partners. Named or attributable usage examples also exist on both sides
              of the marketplace: the company's own brand stories cite Furtuna Skin and an unnamed luxury ecommerce
              customer with measured sales lift, while creator-authored reviews document repeated weekly payouts,
              gifting, and collaborations over time. The caveat is that the best outcome data remain either
              company-issued or self-reported by creators, so the evidence proves operational deployment, but not
              necessarily median customer economics across the broader brand base.
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU010
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
      - number: '6.3'
        title: Durability, expansion quality, and concentration remain underdisclosed
        blocks:
          - type: paragraph
            body: >-
              The most important customer diligence gap is not whether ShopMy can win logos or attract creators; it is
              whether those users persist, expand, and diversify cleanly enough to support late-stage expectations. The
              assigned pool does not disclose NRR, GRR, logo churn, renewal rates, contract length, shopper
              repeat-purchase behavior, or top-brand and top-creator concentration. Independent review coverage is also
              thin on the brand side, and the available review source flags workflow limits, stacked fees, and
              payment-transparency complaints that could matter more as ShopMy pushes beyond beauty and fashion into
              broader enterprise use cases. That leaves the current customer story as credible on adoption and
              product-market fit in its core niches, but still partially unproven on retention quality and concentration
              risk.
            claimRefs:
              - CU012
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Core wedge looks strongest in premium beauty / fashion
            body: >-
              Across official materials, Inc, and competitive review coverage, ShopMy's cleanest fit is still premium
              beauty, fashion, skincare, and lifestyle programs that value micro-creator depth plus attributable sales.
            calloutType: strength
            claimRefs:
              - CU002
              - CU003
              - CU007
          - type: callout
            title: Retention quality is still weaker than adoption proof
            body: >-
              The assigned pool shows real deployment, but it still does not publish the retention, concentration, or
              cohort data needed to judge whether the current customer base can support a late-stage valuation without
              significant fragility.
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk view
        blocks:
          - type: paragraph
            body: >-
              The clearest public red flag is attribution conflict across channels that ShopMy does not fully control.
              Affiverse reported archived guidance that favored preserving the ShopMy commission when an order also
              appeared in another affiliate network, and the same report identified 527 merchants with overlapping
              network exposure without proving how each case resolved. That matters more in a refresh because the
              company now carries a $1.5 billion post-money valuation and a larger employee base, while public revenue,
              take rate, and margin detail still remain undisclosed. As a result, legal/process risk and
              financial-underwriting risk compound one another: if attribution disputes or merchant dissatisfaction
              rise, there is not enough public economic detail to show how much buffer the business has.
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR006
              - CR007
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR007
              - CR008
              - CR011
              - CR012
      - number: '7.2'
        title: Platform model and execution pressure
        blocks:
          - type: paragraph
            body: >-
              ShopMy's own materials show both the product's strength and its control weakness. The company
              distinguishes direct Brand Partners from Commissionable Partners that still ride external networks, and
              its own guide concedes affiliate marketing is a "leaky bucket" unless brands use stronger attribution
              tools such as codes. That design can scale supply quickly: Bloomberg showed a small creator monetizing
              within weeks, while Inc. and company materials show rapid creator and brand growth. But it also leaves
              ShopMy exposed to payout-settlement lag, return adjustments, cross-network reconciliation, and the need to
              keep storefronts compelling enough to pull shoppers away from native commerce environments.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR009
              - CR010
              - CR011
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR014
      - number: '7.3'
        title: Dependency and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The next-order risk is concentration inside the supply side that gives ShopMy its premium brand promise.
              Mission Media says Noir is restricted to gold and black tier creators, which it characterizes as roughly
              the top 1-5% of a 200,000-creator network, while creator-review evidence shows gifting access, visibility,
              and workflow advantages also rise with tier. If the best-performing cohort is narrow, ShopMy's premium
              positioning could depend on a small set of creators and brands even as the broader network grows.
              Affiverse's valuation critique adds the external side of that risk: large commerce ecosystems and
              affiliate infrastructure players are still improving their own creator-commerce tooling.
            claimRefs:
              - CR008
              - CR009
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR012
              - CR013
      - number: '7.4'
        title: Mitigations, monitoring, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The mitigation case is visible but incomplete. Current public guidance says merchants control reversals,
              weekly creator payouts exist despite long settlement windows, and new storefront surfaces are supposed to
              improve shopper retention and repeat monetization. Those are helpful controls, but they are not enough to
              underwrite the refresh without deeper diligence. The investment breaks if ShopMy cannot provide
              order-level reversal evidence across external networks, audited revenue and margin bridges against the
              valuation, and creator/brand concentration data showing that GMV and retention are not overly dependent on
              a thin elite tier. Until then, the right stance is to treat attribution integrity, network dependency, and
              undisclosed unit economics as live diligence blockers rather than as solved scaling details.
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR007
              - CR011
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Attribution integrity is the lead blocker
            body: >-
              The underwriting hinge is whether ShopMy can prove cross-network commission decisions are consistent,
              contractual, and auditable at the order level rather than just explained through marketing language or
              merchant discretion.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR011
          - type: callout
            title: Kill criteria before underwriting the refresh valuation
            body: >-
              Do not underwrite the $1.5 billion price without audited revenue and gross-margin bridges, creator and
              brand concentration tables, and duplicate-order reversal logs segmented by direct versus network-routed
              merchant programs.
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment call and price discipline
        blocks:
          - type: paragraph
            body: >-
              ShopMy has credible evidence of commercial scale: the company reported more than $1 billion of annual
              platform sales, 200% year-over-year revenue growth, and sustained profitability since 2024. Independent
              reporting also confirms that investors supplied $147.5 million across two 2025 rounds. Those signals
              justify continued diligence, but they do not justify buying at the latest headline price without
              conditions. The $1.5 billion valuation is observable; audited revenue quality, margins, retention,
              concentration, and financing preferences are not. The resulting call is track, with medium confidence,
              high risk, and a stretched valuation stance until either evidence improves or entry terms reset.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV009
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV009
              - CV016
      - number: '8.2'
        title: Financing context and comparable limits
        blocks:
          - type: paragraph
            body: >-
              The October 2025 round contributed $70 million at a $1.5 billion valuation after a $77.5 million round
              earlier that year. A third-party profile estimates that the latest round sold roughly 5% of the company
              using round size divided by post-money valuation, but that arithmetic is not a cap-table substitute and
              cannot reveal liquidation preferences, option-pool changes, or secondary sales. The same profile says no
              enterprise-value-to-revenue multiple is disclosed for any round. Inc.'s reference to LTK's $2 billion 2021
              valuation shows category-level investor appetite, yet its older vintage and different platform strategy
              make it a weak direct benchmark rather than validation of ShopMy's price.
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
      - number: '8.3'
        title: Scenario underwriting without false precision
        blocks:
          - type: paragraph
            body: >-
              Sacra estimates $80 million of 2025 revenue; combining that estimate with the disclosed valuation produces
              an illustrative 18.75x valuation-to-estimated-revenue ratio. This is not a company-reported multiple and
              should not be treated as one. The bull case requires the company-reported growth and profitability signals
              to survive diligence and translate into durable cohort economics. The base case recognizes a strong
              operating story but withholds a fair-value range because the denominator is estimated. The bear case
              centers on multiple compression, social-platform dependency, and financing terms that may weaken common
              equity protection. Public evidence therefore supports scenario triggers, not numeric probability weights
              or a target return.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV009
              - CV015
              - CV016
      - number: '8.4'
        title: Proof gaps, exit readiness, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Operating examples support product relevance but remain uneven evidence. ShopMy reported more than $500
              million of brand sales in July 2025; Inc. separately relayed earlier company claims of more than $352
              million of brand sales and 500% return on investment. A company case study and one affiliate-linked
              creator review add directional proof, but neither is a representative cohort. Final diligence should
              therefore obtain audited financials, retention and concentration schedules, and complete round documents.
              Thesis-break triggers are a material shortfall versus the public growth narrative, worsening platform
              dependence, weak cohort durability, or a preference stack that makes the headline valuation misleading. No
              assigned source establishes exit timing or liquidity.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, do not chase the headline mark
            body: >-
              Maintain diligence access and negotiate from verified economics; the public record supports business
              quality more strongly than it supports the latest price.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV009
              - CV016
          - type: callout
            title: The denominator is still estimated
            body: >-
              The illustrative valuation ratio uses Sacra's revenue estimate rather than audited company revenue, so it
              frames the diligence burden rather than establishing fair value.
            calloutType: risk
            claimRefs:
              - CV006
