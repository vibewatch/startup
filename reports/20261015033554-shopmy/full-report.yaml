      - number: '5.2'
        title: Operating model and dependency stack
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to an operating model with several linked layers rather than a monolithic app. On
              the supply side, creators maintain storefront inventory and generate commissionable links. On the
              monetization side, ShopMy runs affiliate tracking, payouts, and brand dashboards, but the Make Influence
              comparison and The Folklore integration guide both show that some commerce still depends on pre-existing
              affiliate-network or partner-storefront rails. That layered design lowers direct-integration burden and
              helps ShopMy scale assortment quickly, but it also means product quality can vary with partner
              integrations, external commission logic, and brand onboarding quality. Brand tools appear commercially
              meaningful already: external reporting says subscriptions, creator discovery, real-time sales data, and
              direct collaboration tooling are live and increasingly central to the platform’s revenue mix.
            claimRefs:
