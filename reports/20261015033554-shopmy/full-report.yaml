      - CV001
      - CV002
      - CV006
      - CV009
      - CV016
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Evidence-based argument
      - What would change the view
    rows:
      - - Thesis
        - Reported platform sales, growth, and profitability indicate a scaled commercial business.
        - Audited results materially below the public claims would weaken the thesis.
      - - Thesis
        - Two substantial 2025 financings demonstrate investor demand and access to growth capital.
        - A future insider-led or down round would reduce confidence in external price support.
      - - Anti-thesis
        - The latest valuation lacks a disclosed EV/revenue multiple and complete cap-table terms.
        - A clean preference stack plus verified revenue and margin data would improve price support.
      - - Anti-thesis
        - Category comparables differ in vintage, model, and scale, limiting direct multiple transfer.
        - A transaction set normalized for business model, growth, and margins would narrow the range.
    notes: >-
      This is a selective thesis test, not an exhaustive comparable-company set; differences in business model and
      valuation date limit comparability.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV008
      - CV009
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - Reported growth and profitability validate in audited diligence; cohort quality remains durable.
        - Outcomes above the $1.5B mark become plausible, but no precise range or return can be supported publicly.
        - Execution and multiple-compression risk remain.
        - Audited revenue, margins, and retention meet or exceed the public narrative.
      - - Base
        - >-
          The operating story is directionally right, but disclosure stays incomplete and the revenue denominator
          remains estimated.
        - Require entry at or below the latest mark with rights protection; exact fair value remains unsupported.
        - Limited margin for error at an illustrative 18.75x estimated-revenue ratio.
        - Evidence remains mixed between strong company claims and unverified private inputs.
      - - Bear
        - >-
          Growth or cohort quality misses expectations, platform dependency worsens, or preferences burden common
          equity.
        - A value below the $1.5B mark or a down round becomes plausible; a downside floor cannot be estimated.
        - Multiple compression, concentration, and preference overhang.
        - Triggered by audited results below the narrative or investor-unfriendly round documents.
    notes: >-
      Scenario valuation boundaries are deliberately qualitative because public evidence does not provide audited
      current revenue, normalized margins, or full financing terms.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV009
      - CV015
      - CV016
