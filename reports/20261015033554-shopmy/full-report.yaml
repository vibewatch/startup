  - id: TV001
    title: Recommendation summary table
    columns:
      - Decision factor
      - Current view
      - Decision implication
    rows:
      - - Recommendation
        - Track
        - Continue diligence, but do not underwrite a buy at the headline valuation from public evidence alone.
      - - Confidence
        - Medium
        - Financing and scale signals are corroborated, while core financial and financing-term inputs remain private.
      - - Risk rating
        - High
        - Estimated fundamentals and incomplete preference disclosure leave material downside uncertainty.
      - - Valuation stance
        - Stretched
        - The $1.5B mark implies a demanding ratio to the available analyst revenue estimate.
      - - Target return / hold / exit
        - Not supportable publicly
        - Set return and liquidity targets only after audited economics, ownership, and exit pathways are verified.
    notes: >-
      Views combine disclosed financing, company-reported operating metrics, and clearly labeled third-party estimates;
      no audited fair-value range is available.
