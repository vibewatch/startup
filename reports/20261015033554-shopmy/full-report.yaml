    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              ShopMy consistently presents itself as creator-commerce infrastructure rather than a simple affiliate-link
              tool. The official brand and creator surfaces describe a three-sided model that helps premium brands
              discover and measure creators, lets creators monetize through storefronts and affiliate links, and
              increasingly gives shoppers a destination for curated discovery. Identity details are directionally clear,
              but the public record is not perfectly clean: Tracxn lists a 2020 founded year, while Inc says Harry Rein
              and Tiffany Lopinsky co-founded the business with Chris Tinsley in 2021. Headquarters references do
              converge on New York City, which is stable enough for downstream chapters to reuse, while the
              founding-year mismatch should stay flagged until incorporation records or internal documents resolve it.
