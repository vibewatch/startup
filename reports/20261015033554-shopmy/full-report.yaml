      - number: '1.3'
        title: Funding, scale signals, and milestone cadence
        blocks:
          - type: paragraph
            body: >-
              ShopMy's strongest public proof points are financing and product cadence. The clearest corroborated event
              is the 2025 Series C: the company announced a $70 million round at a $1.5 billion valuation in October,
              while Tracxn dates the round to August 8. Avenir led, with Bain Capital Ventures, Bessemer Venture
              Partners, and Menlo Ventures participating. After that, the product roadmap continued from the July 2025
              storefront and Circles refresh to the September 2026 Spotlights launch, which adds paid-media execution to
              the existing affiliate, gifting, and partnership stack. The harder part is interpreting scale and
              economics. Public materials cite strong growth, profitability since 2024, and large creator or brand
              networks, but the numbers vary across company surfaces and remain unsupported by audited revenue, margin,
              burn, or customer-count disclosures in the assigned pool.
