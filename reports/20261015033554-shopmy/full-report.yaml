      - number: '1.2'
        title: Leadership, governance, and stakeholder concentration
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence still points to a tightly founder-led operating structure. ShopMy's October 2025
              financing release names Harry Rein as CEO, Tiffany Lopinsky as President, and Chris Tinsley as CBDO, while
              independent coverage quotes Rein and Lopinsky as the most visible spokespeople for strategy, shopper
              product expansion, and monetization. That continuity helps, but it also concentrates execution risk in the
              founding team. Governance visibility remains limited because the assigned pool does not disclose board
              composition, investor control rights, or a documented executive change log. For diligence, that means the
              leadership bench is observable enough to map, but not enough to underwrite governance resilience without
              direct board and cap-table materials.
