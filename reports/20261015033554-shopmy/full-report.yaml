      - number: '4.2'
        title: Public sales-efficiency proxies and traction
        blocks:
          - type: paragraph
            body: >-
              The public record supports a revenue engine built around measurable commerce outcomes, not generic brand
              awareness. Brand operators using or reviewing the platform describe creator-level GMV, average order
              value, gifting acceptance, and attributable sales dashboards, while Fortune and Inc. both frame the
              product as infrastructure that turns creators into measurable sales channels for brands. That is the right
              shape of evidence for a premium creator-commerce platform, even if most hard numbers still originate with
              the company or with third-party estimation.


              Traction claims are large enough to matter but unevenly corroborated. The October 2025 financing release
              cites more than $1 billion in annual platform sales, 185,000+ tastemakers, 1,200+ brand partners, 200%
              revenue growth, and sustained profitability since 2024; Inc. separately reported 150,000 creators, 1,000
              brand partners, and $352 million in brand sales around the January 2025 product cycle. Teardown adds an
              external estimate of roughly $80 million 2025 revenue and a shift from a 65/35 subscription-to-transaction
              mix in 2024 toward 50/50 in 2025, which is useful but still not a substitute for audited revenue by
              stream.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.3'
        title: Cost structure, working-capital profile, and capital needs
        blocks:
          - type: paragraph
            body: >-
              ShopMy's disclosed and inferred economics point to a business that can plausibly generate attractive gross
              margins, but the public evidence is still too thin to underwrite that confidently. The strongest positive
              signal is structural: software subscriptions should be high-margin, and Teardown argues that campaign
              budgets and affiliate balances can sit on ShopMy's balance sheet before creator disbursement. The company
              also says it has been profitable since 2024 and raised a $70 million round at a $1.5 billion valuation,
              which reduces immediate financing pressure in principle.


              The underwriting problem is that none of the retained public sources disclose current cash, burn, runway,
              debt, gross margin by stream, or service-delivery cost intensity. That leaves investors relying on
              platform-sales proxies, company-claimed growth, and estimated revenue rather than audited unit economics.
              At the same time, Teardown surfaces two financial risks that matter directly to margin durability:
              retailer/platform disintermediation can compress ShopMy's take-rate position, and creator trust can erode
              if payout disputes or pricing changes make the platform feel extractive.
            claimRefs:
              - CI006
              - CI009
              - CI010
              - CI011
              - CI013
              - CI014
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial case for ShopMy is strongest when framed as a premium creator-commerce operating system with
              multiple monetization layers and credible sales-efficiency instrumentation. If the business can keep
              growing brand subscriptions while sustaining transaction, campaign, and creator-economics take rates, then
              the public evidence is consistent with a company that has already crossed from category narrative into
              real revenue generation.


              The chapter still stops short of an underwriting-grade conclusion. Public materials do not establish
              audited GAAP revenue, gross margin by stream, realized pricing after incentives, concentration by brand or
              creator cohort, or current liquidity. That means the right verdict is that revenue quality looks
              promising, margin path is plausible but unproven, and financing dependency cannot be cleared without
              management data-room evidence on cash, burn, working capital, and concentration.
            claimRefs:
              - CI008
              - CI010
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Multiple fee rails reduce single-product dependence
            body: >-
              ShopMy is not monetizing only one side of the marketplace: public evidence points to subscription revenue,
              transaction-linked fees, paid campaign fees, gifting-related fees, and a share of creator commissions.
              That mix improves revenue resilience if any one product motion slows.
            calloutType: insight
            claimRefs:
              - CI002
              - CI003
              - CI004
          - type: callout
            title: Revenue quality is still harder to prove than topline momentum
            body: >-
              The company and third-party commentary provide meaningful growth proxies, but underwriting is still
              blocked by missing audited revenue, margin, and liquidity disclosure, while adverse evidence points to
              possible take-rate and trust pressure around payout disputes and disintermediation.
            calloutType: risk
            claimRefs:
              - CI006
              - CI008
              - CI013
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What the product delivers today
        blocks:
          - type: paragraph
            body: >-
              ShopMy’s core product is still a creator-commerce workflow: creators build curated storefronts,
              collections, and posts; shoppers browse or click those recommendations; and brands pay for attributed
              commerce rather than only top-of-funnel reach. The official creator guide and partner documentation show
              live surfaces for collections, hidden collections, consults, shoppable posts, and Amazon link import,
              while creator testimony confirms that storefront building, gifting, payouts, and link sharing are everyday
              usage patterns rather than roadmap concepts. The 2025 consumer launch broadened that footprint with
              Circles, search, and wishlisting, so ShopMy is no longer only a creator back-office tool; it is also
              trying to become a shopper destination that preserves creator attribution after the initial recommendation
              moment.
            claimRefs:
