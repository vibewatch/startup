  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: audited-economics
      missingEvidence: Audited current revenue, gross margin by stream, cash generation or burn, runway, retention, and brand and creator concentration.
      whyItMatters: These inputs determine whether reported scale and the analyst revenue estimate support the latest valuation.
      diligencePath: Obtain audited statements, monthly management accounts, cohort retention schedules, and top-account concentration data.
      relatedQuestionRefs: [QV001, QV002, QV004, QV007]
    - type: private-evidence-only
      severity: material
      topic: financing-terms
      missingEvidence: Post-money share count, liquidation preferences, participation and pro rata rights, option-pool changes, and any secondary sales in the 2025 rounds.
      whyItMatters: Headline post-money valuation does not establish the economic position or downside protection of new common-equity exposure.
      diligencePath: Review the capitalization table, stock purchase agreements, investor rights agreement, side letters, and secondary-sale documentation.
      relatedQuestionRefs: [QV002, QV003, QV007]
    - type: missing-source
      severity: material
      topic: representative-cohorts
      missingEvidence: Independent cohort evidence for brand retention, creator earnings durability, customer concentration, and incremental return on investment.
      whyItMatters: Company examples and one incentivized creator review cannot establish platform-wide economic durability.
      diligencePath: Sample brand and creator cohorts, reconcile platform data to customer records, and conduct independent reference calls.
      relatedQuestionRefs: [QV001, QV004, QV006]
    - type: missing-source
      severity: material
      topic: exit-readiness
      missingEvidence: A credible exit pathway, timing window, likely acquirer or public-market benchmark, and evidence of secondary liquidity.
      whyItMatters: Without an exit path, target return and holding period cannot be underwritten from the assigned public evidence.
      diligencePath: Review board planning, banker materials, secondary transaction history, and model-adjusted M&A and public-company comparables.
      relatedQuestionRefs: [QV008]
