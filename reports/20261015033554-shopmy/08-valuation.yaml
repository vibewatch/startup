schemaVersion: report-v2
artifact: valuation
slug: shopmy
runDate: 2026-10-15
company:
  name: ShopMy
chapter:
  number: 8
  title: Valuation
  summary: >-
    ShopMy's latest disclosed financing establishes a $1.5 billion valuation,
    but public fundamentals remain a mix of company claims and analyst
    estimates. The evidence supports a price-sensitive track stance with high
    risk and a stretched valuation view, not a precise fair-value conclusion.
sections:
  - id: investment-call
    title: Investment call and price discipline
    body: >-
      ShopMy has credible evidence of commercial scale: the company reported
      more than $1 billion of annual platform sales, 200% year-over-year revenue
      growth, and sustained profitability since 2024. Independent reporting
      also confirms that investors supplied $147.5 million across two 2025
      rounds. Those signals justify continued diligence, but they do not justify
      buying at the latest headline price without conditions. The $1.5 billion
      valuation is observable; audited revenue quality, margins, retention,
      concentration, and financing preferences are not. The resulting call is
      track, with medium confidence, high risk, and a stretched valuation
      stance until either evidence improves or entry terms reset.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-and-comparables
    title: Financing context and comparable limits
    body: >-
      The October 2025 round contributed $70 million at a $1.5 billion
      valuation after a $77.5 million round earlier that year. A third-party
      profile estimates that the latest round sold roughly 5% of the company
      using round size divided by post-money valuation, but that arithmetic is
      not a cap-table substitute and cannot reveal liquidation preferences,
      option-pool changes, or secondary sales. The same profile says no
      enterprise-value-to-revenue multiple is disclosed for any round. Inc.'s
      reference to LTK's $2 billion 2021 valuation shows category-level investor
      appetite, yet its older vintage and different platform strategy make it
      a weak direct benchmark rather than validation of ShopMy's price.
    claimRefs: [CV001, CV002, CV007, CV008, CV009]
    tableRefs: [TV002]
  - id: scenario-underwriting
    title: Scenario underwriting without false precision
    body: >-
      Sacra estimates $80 million of 2025 revenue; combining that estimate with
      the disclosed valuation produces an illustrative 18.75x
      valuation-to-estimated-revenue ratio. This is not a company-reported
      multiple and should not be treated as one. The bull case requires the
      company-reported growth and profitability signals to survive diligence
      and translate into durable cohort economics. The base case recognizes a
      strong operating story but withholds a fair-value range because the
      denominator is estimated. The bear case centers on multiple compression,
      social-platform dependency, and financing terms that may weaken common
      equity protection. Public evidence therefore supports scenario triggers,
      not numeric probability weights or a target return.
    claimRefs: [CV003, CV004, CV005, CV006, CV015, CV016]
    tableRefs: [TV003]
  - id: proof-gaps-and-exit-readiness
    title: Proof gaps, exit readiness, and thesis-break triggers
    body: >-
      Operating examples support product relevance but remain uneven evidence.
      ShopMy reported more than $500 million of brand sales in July 2025; Inc.
      separately relayed earlier company claims of more than $352 million of
      brand sales and 500% return on investment. A company case study and one
      affiliate-linked creator review add directional proof, but neither is a
      representative cohort. Final diligence should therefore obtain audited
      financials, retention and concentration schedules, and complete round
      documents. Thesis-break triggers are a material shortfall versus the
      public growth narrative, worsening platform dependence, weak cohort
      durability, or a preference stack that makes the headline valuation
      misleading. No assigned source establishes exit timing or liquidity.
    claimRefs: [CV010, CV011, CV012, CV013, CV014, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Track, do not chase the headline mark
    body: >-
      Maintain diligence access and negotiate from verified economics; the
      public record supports business quality more strongly than it supports
      the latest price.
    claimRefs: [CV006, CV009, CV016]
  - calloutType: risk
    title: The denominator is still estimated
    body: >-
      The illustrative valuation ratio uses Sacra's revenue estimate rather
      than audited company revenue, so it frames the diligence burden rather
      than establishing fair value.
    claimRefs: [CV006]
tables:
  - id: TV001
    title: Recommendation summary table
    columns: [Decision factor, Current view, Decision implication]
    rows:
      - [Recommendation, Track, "Continue diligence, but do not underwrite a buy at the headline valuation from public evidence alone."]
      - [Confidence, Medium, "Financing and scale signals are corroborated, while core financial and financing-term inputs remain private."]
      - [Risk rating, High, "Estimated fundamentals and incomplete preference disclosure leave material downside uncertainty."]
      - [Valuation stance, Stretched, "The $1.5B mark implies a demanding ratio to the available analyst revenue estimate."]
      - [Target return / hold / exit, Not supportable publicly, "Set return and liquidity targets only after audited economics, ownership, and exit pathways are verified."]
    notes: Views combine disclosed financing, company-reported operating metrics, and clearly labeled third-party estimates; no audited fair-value range is available.
    claimRefs: [CV001, CV002, CV006, CV009, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Side, Evidence-based argument, What would change the view]
    rows:
      - [Thesis, "Reported platform sales, growth, and profitability indicate a scaled commercial business.", "Audited results materially below the public claims would weaken the thesis."]
      - [Thesis, "Two substantial 2025 financings demonstrate investor demand and access to growth capital.", "A future insider-led or down round would reduce confidence in external price support."]
      - [Anti-thesis, "The latest valuation lacks a disclosed EV/revenue multiple and complete cap-table terms.", "A clean preference stack plus verified revenue and margin data would improve price support."]
      - [Anti-thesis, "Category comparables differ in vintage, model, and scale, limiting direct multiple transfer.", "A transaction set normalized for business model, growth, and margins would narrow the range."]
    notes: This is a selective thesis test, not an exhaustive comparable-company set; differences in business model and valuation date limit comparability.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV008, CV009]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Reported growth and profitability validate in audited diligence; cohort quality remains durable.", "Outcomes above the $1.5B mark become plausible, but no precise range or return can be supported publicly.", "Execution and multiple-compression risk remain.", "Audited revenue, margins, and retention meet or exceed the public narrative."]
      - [Base, "The operating story is directionally right, but disclosure stays incomplete and the revenue denominator remains estimated.", "Require entry at or below the latest mark with rights protection; exact fair value remains unsupported.", "Limited margin for error at an illustrative 18.75x estimated-revenue ratio.", "Evidence remains mixed between strong company claims and unverified private inputs."]
      - [Bear, "Growth or cohort quality misses expectations, platform dependency worsens, or preferences burden common equity.", "A value below the $1.5B mark or a down round becomes plausible; a downside floor cannot be estimated.", "Multiple compression, concentration, and preference overhang.", "Triggered by audited results below the narrative or investor-unfriendly round documents."]
    notes: Scenario valuation boundaries are deliberately qualitative because public evidence does not provide audited current revenue, normalized margins, or full financing terms.
    claimRefs: [CV003, CV004, CV005, CV006, CV009, CV015, CV016]
