      - ["Bain Capital Ventures", "Returning venture investor", "Participated in the 2025 Series C and is also cited in prior financings.", "Confirm current stake, reserve capacity, and governance influence."]
      - ["Bessemer Venture Partners", "Returning venture investor", "Named in prior financings and in the 2025 Series C syndicate.", "Confirm ownership, board or observer rights, and support expectations."]
      - ["Menlo Ventures", "Continuing institutional investor", "Participated in the 2025 Series C syndicate and earlier financings per public trackers.", "Confirm economic ownership and follow-on appetite."]
