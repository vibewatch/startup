callouts:
  - calloutType: insight
    title: Scale is real, but public KPIs are not yet canonical
    body: >-
      The evidence supports a substantial network and platform-sales base, but company
      surfaces cite different creator and brand counts across dates and page types. That
      is enough to establish scale, not enough to treat any single count as the canonical
      operating KPI without management reconciliation.
    claimRefs: [CO007, CO012]
  - calloutType: risk
    title: Governance and unit economics remain the main diligence blind spots
    body: >-
      Public materials support fundraising momentum and product cadence, but they do not
      disclose board composition, detailed financing terms, audited revenue, margin, burn,
      runway, or customer concentration. Competitor criticism and creator anecdotes are
      useful prompts, not substitutes for primary diligence.
    claimRefs: [CO014, CO015, CO016]
