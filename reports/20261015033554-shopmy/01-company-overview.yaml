artifact: company-overview
slug: shopmy
runDate: 2026-10-15
company:
  name: ShopMy
chapter:
  number: 1
  title: Company Overview
  summary: >-
    ShopMy remains a founder-led creator-commerce platform centered on premium-brand,
    creator, and shopper workflows, with public evidence supporting a 2025 Series C at
    a $1.5 billion valuation and continued product expansion into consumer discovery and
    paid-media activation. The public record shows real scale, but it is not harmonized:
    company surfaces cite different creator and brand counts, while governance, audited
    revenue, burn, and exact cap-table terms remain undisclosed in the assigned evidence.
sections:
  - id: identity-and-model
    title: Identity and operating model
    body: >-
      ShopMy consistently presents itself as creator-commerce infrastructure rather than a
      simple affiliate-link tool. The official brand and creator surfaces describe a
      three-sided model that helps premium brands discover and measure creators, lets
      creators monetize through storefronts and affiliate links, and increasingly gives
      shoppers a destination for curated discovery. Identity details are directionally
      clear, but the public record is not perfectly clean: Tracxn lists a 2020 founded
      year, while Inc says Harry Rein and Tiffany Lopinsky co-founded the business with
      Chris Tinsley in 2021. Headquarters references do converge on New York City, which
      is stable enough for downstream chapters to reuse, while the founding-year mismatch
      should stay flagged until incorporation records or internal documents resolve it.
    claimRefs: [CO001, CO002, CO003, CO004, CO006, CO007]
    tableRefs: [TO001]
  - id: leadership-and-stakeholders
    title: Leadership, governance, and stakeholder concentration
    body: >-
      The assigned evidence still points to a tightly founder-led operating structure.
      ShopMy's October 2025 financing release names Harry Rein as CEO, Tiffany Lopinsky
      as President, and Chris Tinsley as CBDO, while independent coverage quotes Rein and
      Lopinsky as the most visible spokespeople for strategy, shopper product expansion,
      and monetization. That continuity helps, but it also concentrates execution risk in
      the founding team. Governance visibility remains limited because the assigned pool
      does not disclose board composition, investor control rights, or a documented
      executive change log. For diligence, that means the leadership bench is observable
      enough to map, but not enough to underwrite governance resilience without direct
      board and cap-table materials.
    claimRefs: [CO005, CO014]
    tableRefs: [TO002, TO003]
  - id: funding-scale-and-milestones
    title: Funding, scale signals, and milestone cadence
    body: >-
      ShopMy's strongest public proof points are financing and product cadence. The
      clearest corroborated event is the 2025 Series C: the company announced a $70
      million round at a $1.5 billion valuation in October, while Tracxn dates the round
      to August 8. Avenir led, with Bain Capital Ventures, Bessemer Venture Partners,
      and Menlo Ventures participating. After that, the product roadmap continued from the July 2025
      storefront and Circles refresh to the September 2026 Spotlights launch, which adds
      paid-media execution to the existing affiliate, gifting, and partnership stack. The
      harder part is interpreting scale and economics. Public materials cite strong growth,
      profitability since 2024, and large creator or brand networks, but the numbers vary
      across company surfaces and remain unsupported by audited revenue, margin, burn, or
      customer-count disclosures in the assigned pool.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO015, CO016]
    figureRefs: [FO001]
