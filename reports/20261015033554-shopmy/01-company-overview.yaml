      - ["Tiffany Lopinsky", "Co-founder and President", "Quoted publicly on creator monetization, sales attribution, and shopper-product direction.", "Covers go-to-market and monetization logic linking creator activity to brand ROI.", "High: operating and commercial messaging remain concentrated in Lopinsky and Rein."]
      - ["Chris Tinsley", "Co-founder and CBDO", "Named as the third co-founder in public materials and still presented in a business-development role.", "Anchors ecosystem and partnership coverage on the commercial side.", "Medium: founder continuity is a strength, but institutional depth beyond the founding team is not visible here."]
    notes: >-
      Partial enumeration limited to founders and public executive spokespeople surfaced
      in the assigned pool; it is not a complete management-team roster.
    enumerationScope:
      coverage: partial
      basis: >-
        Named founders and public operating leaders visible in the assigned 2025-2026
        source pool, rather than the full executive team or board roster.
    claimRefs: [CO004, CO005, CO011, CO013, CO014]
