      - [Stage and valuation, "Series C; $70M at a $1.5B valuation.", "Tracxn: 2025-08-08; company announcement: 2025-10-22", high, "Round-close date, share count, dilution, liquidation preferences, and any secondary component are not public here."]
      - [Total raised, "Tracxn reports $169M across four rounds through Aug. 2025.", "2025-08-08", medium, "No official cumulative capital table in the assigned evidence."]
      - [Revenue and profitability, "No audited revenue disclosed; company says 200% YoY growth and profitability since 2024.", "2025-10-22", medium, "Need GAAP revenue, gross margin, burn, cash balance, and runway."]
      - [Network scale, "Company surfaces cite 185k-250k creators/tastemakers, 1,200+ premium brand partners, and 47k-50k commissionable brands.", "2025-09 to 2025-10", medium, "Definitions are not harmonized across public surfaces."]
      - [Customers and headcount, "Paying customer count is not public; assigned evidence does not provide a standardized current headcount.", "2025-10", low, "Need customer count, concentration, logo churn, and org chart metrics."]
    notes: >-
      Public scale and economics are partially disclosed and sometimes non-harmonized;
      null-equivalent narrative cells mark diligence gaps rather than model estimates.
    claimRefs: [CO002, CO003, CO004, CO007, CO008, CO009, CO010, CO012, CO016]
