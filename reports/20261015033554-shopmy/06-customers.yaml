  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-metrics
      missingEvidence: Brand NRR, GRR, logo churn, renewal rates, contract length, and creator cohort-retention data.
      whyItMatters: These metrics determine whether visible adoption compounds into durable revenue or masks churn behind continued top-of-funnel acquisition.
      diligencePath: Request cohort tables by brand vintage and creator vintage, plus renewal and churn definitions used in board reporting.
      relatedQuestionRefs: [QU005]
    - type: missing-source
      severity: material
      topic: concentration-risk
      missingEvidence: Revenue or GMV concentration by top brands, top creators, and core verticals such as fashion and beauty.
      whyItMatters: Late-stage marketplace quality depends on whether demand and supply are diversified rather than concentrated in a small elite cohort.
      diligencePath: Obtain top-10 brand share, top-10 creator share, and GMV mix by vertical and customer cohort from management.
      relatedQuestionRefs: [QU008]
      relatedTableRefs: [TU001, TU002]
    - type: private-evidence-only
      severity: material
      topic: shopper-retention
      missingEvidence: MAU, repeat-purchase, wishlist reuse, and conversion-funnel metrics for Circles and the shopper-facing storefront experience.
      whyItMatters: The investment case increasingly depends on whether the shopper layer creates repeat demand instead of just supporting one-off affiliate clicks.
      diligencePath: Request post-launch shopper cohort dashboards, repeat-purchase curves, and attribution of saved-item purchases to creator storefronts.
      relatedQuestionRefs: [QU006]
    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof
      missingEvidence: A broader, independently corroborated list of named brand customers and creator accounts using ShopMy in production.
      whyItMatters: The chapter can prove deployment with several examples, but the public sample is still too narrow to treat as exhaustive coverage of the installed base.
      diligencePath: Ask management for a dated top-customer reference list with vertical, deployment status, spend or GMV bands, and at least a few consented customer references.
      relatedQuestionRefs: [QU004]
      relatedTableRefs: [TU003]
    - type: conflicting-data
      severity: minor
      topic: denominator-consistency
      missingEvidence: A reconciled bridge between direct brand partners, commissionable brands, registered creators, and active creators.
      whyItMatters: Public scale claims are directionally positive but use different bases, which can overstate comparable growth if read as a single metric family.
      diligencePath: Ask management to reconcile every public creator and brand count to consistent definitions and reporting dates.
