company:
  name: ShopMy
chapter:
  number: 6
  title: Customers
  summary: >-
    ShopMy has credible two-sided adoption in premium creator commerce: company and media
    sources support a 150,000+ creator network with roughly 1,000 direct brand partners by
    mid-2025, while creator case studies show repeated gifting, payout, and storefront usage.
    The weakness is durability proof, not surface-level adoption: the assigned evidence still
    does not disclose NRR, churn, concentration, or broad brand-side satisfaction at a level
    that would prove expansion quality across the installed base.
sections:
  - id: segment-mix-and-paying-customer
    title: Segment mix and the paying customer are clear
    body: >-
      The public record consistently shows ShopMy as a three-sided system in which brands are
      the paying software and campaign customers, creators are the monetizing supply side, and
      shoppers are the demand layer that the company added more explicitly with Circles and
      wishlists. The strongest documented fit remains premium beauty, fashion, skincare, and
      lifestyle, where both official materials and independent writeups describe a dense supply
      of vetted micro and nano creators plus direct attribution for brand teams. ShopMy also
      appears to widen catalog breadth through "Commissionable Partners" that sit on top of
      existing affiliate networks, which is strategically useful because it separates direct
      platform customers from the much larger universe of brands whose products can still be
      linked. On the creator side, customer-proof sources portray access as materially more open
      than older invite-gated storefront apps, but they stop short of proving what share of
      registered creators stay active or meaningfully monetize.
    claimRefs: [CU001, CU002, CU005, CU006, CU016]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof-is-real-but-skews-to-case-studies
    title: Adoption proof is real, but it still skews to case studies
    body: >-
      ShopMy clears the "real usage" bar more convincingly than the "durable cohort quality"
      bar. Inc and ShopMy's own 2025 launch materials converge on a base of roughly 150,000 to
      175,000 creators and about 1,000 direct brand partners, while later third-party review
      material pushes those figures to around 200,000 creators and 1,200 brand partners. Named
      or attributable usage examples also exist on both sides of the marketplace: the company's
      own brand stories cite Furtuna Skin and an unnamed luxury ecommerce customer with measured
      sales lift, while creator-authored reviews document repeated weekly payouts, gifting, and
      collaborations over time. The caveat is that the best outcome data remain either
      company-issued or self-reported by creators, so the evidence proves operational
      deployment, but not necessarily median customer economics across the broader brand base.
    claimRefs: [CU003, CU004, CU007, CU008, CU009, CU010, CU011, CU012, CU013]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-concentration-remain-underdisclosed
    title: Durability, expansion quality, and concentration remain underdisclosed
    body: >-
      The most important customer diligence gap is not whether ShopMy can win logos or attract
      creators; it is whether those users persist, expand, and diversify cleanly enough to
      support late-stage expectations. The assigned pool does not disclose NRR, GRR, logo churn,
      renewal rates, contract length, shopper repeat-purchase behavior, or top-brand and
      top-creator concentration. Independent review coverage is also thin on the brand side, and
      the available review source flags workflow limits, stacked fees, and payment-transparency
      complaints that could matter more as ShopMy pushes beyond beauty and fashion into broader
      enterprise use cases. That leaves the current customer story as credible on adoption and
      product-market fit in its core niches, but still partially unproven on retention quality
      and concentration risk.
    claimRefs: [CU012, CU014, CU015, CU016]
