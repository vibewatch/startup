figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      ShopMy's customer loop starts with paid brand onboarding and creator activation, then
      compounds only if storefront discovery, saved links, and attributed sales keep both sides
      engaged.
    data:
      nodes:
        - label: Brand signs on for affiliate + gifting
          actor: Brand marketing / ecommerce team
          phase: Acquisition
          tone: positive
          touchpoints:
            - Demo or paid plan
            - Creator discovery
            - Affiliate + gifting setup
        - label: Creator joins or is referred
          actor: Creator
          phase: Onboarding
          tone: neutral
          touchpoints:
            - Application review or referral link
            - Storefront setup
            - Snapshop or link creation
        - label: Creator publishes product recommendations
          actor: Creator
          phase: Activation
          tone: positive
          touchpoints:
            - Collections
            - Discount codes
            - Lookbooks or gifting
        - label: Shopper discovers through Circles or saved links
          actor: Shopper
          phase: Discovery
          tone: positive
          touchpoints:
            - Circles
            - Search
            - Wishlists
        - label: Brand sees attributable sales signals
          actor: Brand
          phase: Measurement
          tone: positive
          touchpoints:
            - SKU-level attribution
            - Click and order visibility
            - ROI optimization
        - label: Repeat revenue depends on disclosed retention quality
          actor: Brand + creator
          phase: Expansion
          tone: warning
          touchpoints:
            - Wishlisted items remain commissionable
            - Paid campaigns / Opportunities
            - Retention and concentration still undisclosed
    approximationNotes: null
    claimRefs: [CU001, CU005, CU007, CU013, CU015, CU016]
callouts:
  - calloutType: strength
    title: Core wedge looks strongest in premium beauty / fashion
    body: >-
      Across official materials, Inc, and competitive review coverage, ShopMy's cleanest fit is
      still premium beauty, fashion, skincare, and lifestyle programs that value micro-creator
      depth plus attributable sales.
    claimRefs: [CU002, CU003, CU007]
  - calloutType: risk
    title: Retention quality is still weaker than adoption proof
    body: >-
      The assigned pool shows real deployment, but it still does not publish the retention,
      concentration, or cohort data needed to judge whether the current customer base can support
      a late-stage valuation without significant fragility.
    claimRefs: [CU014, CU015, CU016]
