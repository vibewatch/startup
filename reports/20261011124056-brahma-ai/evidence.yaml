evidenceGaps:
  - type: missing-source
    severity: material
    topic: standalone-headcount
    missingEvidence: >-
      Audited headcount breakdown distinguishing standalone Brahma AI full-time employees from shared DNEG and Prime
      Focus visual effects contractor staff.
    whyItMatters: >-
      Reported headcount band of 1,001–5,000 employees reflects shared conglomerate infrastructure; true standalone
      software engineering run-rate expenses cannot be isolated without discrete payroll data.
    diligencePath: Request statutory payroll records and FTE census from company management during technical diligence.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: leadership-governance
    missingEvidence: >-
      Formal board of directors committee charters, independent director appointments, and executive employment
      agreements.
    whyItMatters: >-
      Key-person dependence on founder-CEO Prabhu Narasimhan and CTO Jo Plaete is substantial, and formal management
      retention packages remain unverified.
    diligencePath: Review board minutes, voting agreement schedules, and key executive employment contracts in the virtual data room.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: equity-ownership-structure
    missingEvidence: >-
      Detailed fully diluted capitalization table detailing series-level liquidation preferences, voting covenants, and
      secondary redemption rights.
    whyItMatters: >-
      Decoupling of Prime Focus economic ownership (66%) from voting control (25%) creates complex corporate governance
      dynamics that may constrain future exit flexibility.
    diligencePath: >-
      Inspect Brahma AI's Articles of Association and shareholders' agreement governing the Series / Preferred equity
      issuance.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Comparable definitions, geographies, spend categories, and calculation methods for the company-linked USD 130
      billion projection and the external AI-generated-content forecast.
    whyItMatters: >-
      The headline estimates cannot be reconciled or used as interchangeable valuation inputs without a common market
      boundary.
    diligencePath: >-
      Obtain the underlying Grand View Research methodology and management's TAM model, then normalize both to the same
      products, geography, and period.
    relatedQuestionRefs:
      - QM002
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Product pricing, target-account counts, attach rates, deployment volumes, contract values, and disclosed budget
      ownership by vertical.
    whyItMatters: Without these inputs, neither a bottom-up SAM and SOM nor a reliable buyer-level adoption model can be calculated.
    diligencePath: >-
      Request price books, anonymized contracts, vertical pipeline data, usage cohorts, renewal data, and buyer
      interviews tied to the four stated verticals.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: adoption-constraints
    missingEvidence: >-
      Independent customer ROI, implementation-cycle, switching-cost, privacy, rights-clearance, and regulatory evidence
      for production deployments.
    whyItMatters: >-
      Company statements identify trust requirements but do not quantify adoption friction, deployment economics, or
      regulated-market readiness.
    diligencePath: >-
      Interview reference customers and review security, rights, privacy, implementation, and outcome documentation for
      representative deployments.
    relatedQuestionRefs:
      - QM005
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable price books, order forms, usage units, discount schedules, implementation fees, minimum commitments,
      and realized contract values for Brahma AI and named alternatives.
    whyItMatters: >-
      Without normalized commercial terms, diligence cannot determine whether platform breadth supports premium pricing
      or whether bundled incumbents can undercut it.
    diligencePath: >-
      Request recent proposals and executed contracts, then normalize annualized software, services, compute,
      implementation, and support costs against named alternatives.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Renewal cohorts, churn reasons, integration inventories, migration timelines, exclusivity clauses, multi-homing
      rates, and customer-level workflow dependency.
    whyItMatters: >-
      The durability of an integrated platform depends on whether customers face genuine workflow and data migration
      friction rather than merely preferring current features.
    diligencePath: >-
      Review renewal and churn cohorts, interview reference and former customers, and inspect contracts plus
      architecture diagrams for portability and exclusivity terms.
    relatedQuestionRefs:
      - QP005
  - type: missing-source
    severity: material
    topic: benchmark-gap
    missingEvidence: >-
      Independent tests comparing Brahma AI with Adobe, Microsoft, OpenAI, and specialist audiovisual-AI vendors on
      quality, latency, cost, provenance, security, and deployment.
    whyItMatters: Reported breadth and industry recognition do not establish technical superiority or a durable moat.
    diligencePath: >-
      Commission a blinded proof-of-concept on representative enterprise workflows and obtain customer-scored results
      with identical inputs and acceptance criteria.
    relatedQuestionRefs:
      - QP003
      - QP006
      - QP007
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: unit-economics-retention
    missingEvidence: >-
      Audited cohort-level net revenue retention (NRR), customer acquisition cost (CAC) payback periods, and software
      gross margins excluding cloud compute pass-through.
    whyItMatters: >-
      Without segmented software gross margin and NRR data, underwriters cannot distinguish high-margin enterprise SaaS
      from compute-intensive post-production services.
    diligencePath: >-
      Request management's SaaS cohort retention tables, customer-level gross margin analyses, and compute hosting
      vendor invoices for the preceding eight quarters.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: contract-economics
    missingEvidence: >-
      Granular contract values (ACVs) and software versus professional services mix for the top 24 enterprise customers
      representing 80% of revenue.
    whyItMatters: >-
      High customer concentration means the loss of or down-sell in two or three marquee contracts could drastically
      compress growth and cash flow.
    diligencePath: >-
      Obtain an anonymized customer revenue schedule detailing contract start/end dates, annual recurring license value,
      and professional service attachments.
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: inference-latency-benchmarks
    missingEvidence: >-
      Empirical latency metrics (time-to-first-frame, render latency per token) for interactive multi-turn ATMAN digital
      human queries under enterprise load.
    whyItMatters: >-
      Determines whether interactive physician digital twins and sports concierge avatars can operate in real-time
      without conversational lag.
    diligencePath: >-
      Request production performance benchmarks, GPU profiling logs, and SLA commitments for interactive ATMAN API
      endpoints.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE002
  - type: private-evidence-only
    severity: material
    topic: model-agnostic-portability
    missingEvidence: >-
      Architectural documentation detailing the abstraction layer enabling Brahma AI to decouple from Google Veo and
      Gemini across alternative hyperscalers.
    whyItMatters: >-
      Validates management's claims of model-agnostic independence and determines exposure to Google Cloud commercial
      lock-in.
    diligencePath: Review technical architecture specifications, adapter interfaces, and multi-cloud fallback deployment tests.
    relatedQuestionRefs:
      - QE005
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: Customer concentration and retention cohorts
    missingEvidence: >-
      Audited cohort-level net revenue retention (NRR), gross revenue retention (GRR), and individual customer revenue
      concentration percentages for the top 24 accounts.
    whyItMatters: >-
      While management reports that 80% of revenue is derived from 24 large enterprise accounts, specific account
      concentration, churn history, and cohort expansion rates are undisclosed, masking potential customer churn or
      single-account dependency.
    diligencePath: >-
      Request customer-level revenue waterfall and contract schedules under NDA, specifically breaking out annual
      contract value (ACV) and renewal dates for the top 10 accounts.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: Named customer proof table
    missingEvidence: >-
      Comprehensive contract-level verification for all 24 enterprise accounts and formal case study disclosures for
      healthcare and advertising deployments.
    whyItMatters: >-
      Public disclosure only confirms a sample of anchor accounts (Warner Bros, NBA, Mayo Clinic, Paramount, ESPN,
      Channel 4); production scale versus pilot scope cannot be independently audited for undisclosed customers.
    diligencePath: >-
      Verify master services agreements (MSAs) and statement of work (SOW) deliverables for named commercial accounts
      during management diligence.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: trademark-licensing-coverage
    missingEvidence: >-
      Comprehensive audit of registered trademarks, international likeness licensing clearances, and third-party
      software bill of materials (SBOM) documentation.
    whyItMatters: >-
      Unregistered trademark conflicts or open-source namespace collisions create brand dilution risks, while
      undisclosed likeness agreements could trigger statutory privacy claims in regulated markets.
    diligencePath: >-
      Obtain corporate trademark docket records from USPTO/WIPO, audit Metaphysic likeness consent agreements, and
      review client master services agreements for indemnification limits.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-margins-and-cash-burn
    missingEvidence: Audited GAAP/IFRS financial statements detailing Brahma AI's gross margins, EBITDA, and exact net burn rate.
    whyItMatters: >-
      While management reports high gross margins and near-break-even operations, absence of audited cash burn figures
      obscures the runway provided by the $150M preferred round.
    diligencePath: >-
      Request confidential data room access to review historical audited financials, gross margin schedules by customer
      cohort, and monthly cash flow statements.
    relatedQuestionRefs:
      - QV009
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preference-structure
    missingEvidence: >-
      Complete capitalization table detailing liquidation preferences, dividend covenants, and exact voting control
      rights between Prime Focus Limited, Multiples, and minority investors.
    whyItMatters: >-
      The divergence between Prime Focus's 66% economic ownership and 25% voting power indicates potential structural
      governance complexity and preference overhang for incoming common equity.
    diligencePath: >-
      Examine the Series A preferred share purchase agreement, investor rights agreement, and voting agreement from the
      September 2026 round.
    relatedQuestionRefs:
      - QV003
