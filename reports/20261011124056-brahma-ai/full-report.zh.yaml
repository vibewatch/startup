        title: 资本充足性与所有权治理
        blocks:
          - type: paragraph
            body: >-
              2026 年 9 月，Brahma AI 宣布完成 $150 million 成长融资，采用优先股结构，由印度私募股权公司 Multiples Alternate Asset Management 领投 $100
              million。交易确立 $2 billion 投后估值，高于 2025 年记录的 $1.43 billion。 注资重塑了公司治理与所有权架构：母公司 Prime Focus Limited 通过视觉特效公司
              DNEG 保有约 66% 经济所有权， 但投票权从 89.2% 降至 24.9%，使 Brahma AI 按财务会计准则从受控子公司转为联营公司。外部机构投资者获得
              有意义的监督权，公司将资金用于加速研发、扩大国际销售团队并建立大型硅谷运营中心。管理层报告另有 $100 million 潜在投资兴趣，最终文件完成后总融资额可能扩大至 $200 million。
