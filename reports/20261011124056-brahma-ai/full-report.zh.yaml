      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Brahma AI 最可信的护城河假设，是视听制作血统、企业工作流集成、垂直行业关系和声称的模型无关架构的组合。 这套组合可能比单一生成功能更难复制。但反面压力很大：Adobe 和 Microsoft
              可将生成式功能捆绑进成熟软件体系， OpenAI 可在模型层推进生成质量，Nvidia 则能塑造专业应用所依赖的基础设施层。一份独立来源明确警告， Brahma AI
              必须证明技术优越性或占据持久利基。当前证据池没有独立基准、胜负分析、留存 cohort 或转换研究， 因此护城河仍合理但未获验证，商品化风险仍然显著。
            claimRefs:
