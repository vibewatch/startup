  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争边界与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              可守住的竞争边界是企业视听内容工作流，而非整个 AI 市场。Brahma AI 表示，它将内容智能与管理层和视觉 AI、
              数字人、语音、多语种表演等创作能力结合，服务媒体与娱乐、体育、医疗和广告行业。在指定证据中，竞争压力 主要来自几类方向：Adobe 和 Microsoft 代表的嵌入式创意及生产力生态，OpenAI
              代表的前沿文生视频能力， Nvidia 代表的基础设施杠杆，以及买方用不同工具和服务自行拼接内部工作流的能力。最后一类仍是尽调假设， 因为证据池没有比较自建、采购和维持现状的买方研究或采购记录。
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
