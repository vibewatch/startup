  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Brahma AI 披露的业务范围分为相互连接的两层：Core 吸收企业内容、建立可搜索索引并执行 AI 工作流；Studio 支持视觉
              AI、数字人、语音和多语种表演。因此，可投资市场应界定为企业视听内容智能与创作，而不是整个生成式 AI 经济。通过该平台销售时，可计入媒体资产智能、本地化、合成媒体制作和工作流自动化支出。云基础设施、
              传统制作服务、通用存储和消费级创作工具属于相邻市场或替代方案，除非 Brahma AI 直接获取这部分支出。公司 声称管理着超过 100 million 项资产和 100 petabytes
              的档案，说明其工作流具有相关性，但这些运营数量本身不能 证明以美元计价的市场规模。
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM010
              - CM013
              - CM016
      - number: '2.2'
        title: 市场测算口径与可比性限制
        blocks:
          - type: paragraph
            body: >-
              现有市场估算采用了不同边界。Mint 援引 Grand View Research 称，全球 AI 生成内容市场 2024 年为 USD 12.9 billion-USD 14.8 billion，预计到
              2030 年代初为 USD 53.8 billion-USD 80.1 billion。Prime Focus 由 TipRanks 转发的公告则预计，到 2030 年 Brahma AI
              围绕交互式数字人及更广泛客户参与解决方案的可服务市场将超过 USD 130 billion。公司关联口径大于外部类别预测，但两者都没有提供足够方法论，无法调和所含产品、地域或
              支出池。这些数字应作为彼此独立的视角，而不是计算出的 TAM-to-SOM 漏斗阶段。要得到可靠的可服务市场估算， 还需要产品定价、目标账户数量、附着率和部署量；指定证据中均未出现这些数据。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
