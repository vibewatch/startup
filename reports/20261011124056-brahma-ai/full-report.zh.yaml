      - number: '5.3'
        title: 技术架构、基础设施依赖与工程栈
        blocks:
          - type: paragraph
            body: >-
              Brahma AI 将平台原生构建在 Google Cloud 上，以支持计算密集型生成式渲染和行星级媒体流传输 [CE002]。软件栈 体现混合企业架构：后端服务采用 GoLang、Python 和
              .NET，通过 React 构建微服务和微前端 [CE003, CE005]。 数据持久化和目录索引依赖异构数据库层，包括 PostgreSQL、SQL Server、MongoDB 以及
              Elasticsearch/OpenSearch 集群，用于查询 petabyte 级档案中的密集元数据 [CE003]。生成式工作负载深度整合 Google Cloud 的高性能 AI
              基础设施和先进基础模型，包括用于视觉生成的 Google Veo，以及用于多模态推理和文本转语音对齐的 Gemini [CE002]。生产跟踪和任务工作流服务记录全球分布式工程团队的实证数据，优化 GPU
              计算调度、艺术家工时和运营 交付成本 [CE005]。云原生架构可为高吞吐渲染需求提供快速弹性，但也带来对 Google Cloud 计算定价、TPU/GPU 加速器可用性和第三方基础模型 API 的重大运营依赖
              [CE002, CE008]。
