            tableRef: TO002
            claimRefs:
              - CO003
              - CO005
              - CO007
      - number: '1.3'
        title: 资本结构、估值与利益相关者分布
        blocks:
          - type: paragraph
            body: >-
              2026 年 9 月，Brahma AI 完成 $150 million 优先股融资，由印度本土私募股权公司 Multiples Alternate Asset Management 领投，投后估值为 $2.0
              billion。Multiples 直接承诺 $100 million，欧洲、西亚和美国的金融及战略 投资者追加机构配额，使初始轮次扩大，潜在总募资额最高可达 $200 million。现有资本结构正是
              Brahma AI 公司起源的结果：媒体集团 Prime Focus Limited 通过视觉特效子公司 DNEG 保有约 66% 的经济所有权；Metaphysic 的 历史股东及阿布扎比投资公司 United
              Al Saqer Group 持有少数股权。以 $2.0 billion 估值对比预计 2026 年 超过 $130 million 的收入，Brahma AI 的预估远期销售倍数为 15x。
