      - number: '2.4'
        title: 驱动因素、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              大型企业内容资产、多语种交付需求以及与 Google 的分销关系支持采用。Brahma AI 表示其交互式数字人已接近 上线，因此部分机会仍属前景判断，尚未在规模化运营中得到证明。CEO
              强调安全性、真实性和来源，说明信任与 权利管理是设计要求；但指定证据没有独立 ROI 研究、监管许可、实施周期基准或转换成本测量。2026 年 9 月的 USD 150 million
              融资为研发和全球市场拓展提供资源，但募资额不等于市场获取或可用现金的证据。估值方面， 最有力的信号是企业客户集中度和多年期关系；最大不确定性在于，能否把可重复的平台经济性与定制制作和集成 工作区分开来。
