            body: >-
              Brahma AI 的企业客户基础快速扩张：合并前身的备考口径收入从 2024 年约 $45 million 增至 2025 年估计 $74 million，并朝 2026 财年超过 $130 million 的
              run rate 迈进。这一轨迹反映媒体、体育、广告和医疗行业 深度企业渗透带来的营收复合增长。但商业风险高度集中：约 80% 的总收入来自仅 24 个核心企业账户。三至五年的
              多年期合同提高收入可见度并降低短期流失，但关键账户若推迟续约，客户集中度会造成显著下行风险。不同于 Runway 等披露净收入留存率超过 300% 且拥有自助式客户量的独立生成式视频供应商，Brahma AI
              的财务表现仍依赖 高接触企业采用和年度合同金额扩大。
