              - CM008
              - CM016
      - number: '2.3'
        title: 买方细分与采用路径
        blocks:
          - type: paragraph
            body: >-
              Brahma AI 将媒体与娱乐、体育、医疗和广告列为四个目标垂直领域，并点名 Warner Bros、NBA 和 Mayo Clinic
              为核心客户。这些案例支持跨行业企业需求存在，但没有披露合同金额、席位数、使用量或采购预算负责人。 Mint 报道称，约 80% 的收入来自 24
              个大型企业客户，合作关系通常持续三至五年。这说明公司采用高接触、集中 度高的销售模式：技术验证、内容集成和多年期签约比自助式获客更重要。下方买方地图因此区分有来源支持的客户
              细分与工作流，以及关于可能用户和预算负责人的分析假设；后者在投资判断前仍需客户访谈和合同审阅。
            claimRefs:
              - CM002
