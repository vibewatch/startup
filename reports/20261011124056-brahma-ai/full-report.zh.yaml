      - number: '4.2'
        title: 成本结构与交付单位经济性
        blocks:
          - type: paragraph
            body: >-
              Brahma AI 的运营成本呈混合特征：一边是软件平台交付，一边是计算密集型人工智能推理工作负载。Core 媒体 资产管理具有传统企业软件的经济性，运营杠杆高，托管基础设施成本可预测。相反，Studio
              工作负载——包括 高保真神经人脸替换、数字人渲染（ATMAN）和声音克隆（VAANI）——会因 GPU 集群利用率及基础模型推理而产生 可变基础设施费用。管理层称 Brahma AI
              保持较高毛利，并在大力投入研发和国际市场拓展的同时接近盈亏平衡。 平台的模型无关架构可将计算任务分配到外部基础模型和内部专有管线，从而降低供应商锁定；但私有合同掩盖了
              重度客户使用情况下的准确利润转嫁和计算成本吸收情况。
            claimRefs:
              - CI007
              - CI012
              - CI014
