            body: >-
              Prime Focus 持有 66% 经济股权却仅保有 25% 投票权，结构性分离带来严重代理冲突风险。若成长型股权投资者与传统企业发起方在战略并购、资本追加或股息分配上意见不一，Brahma AI
              可能陷入董事会瘫痪，拖慢产品路线图。
