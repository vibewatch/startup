  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与变现架构
        blocks:
          - type: paragraph
            body: >-
              Brahma AI 通过两层主要应用商业化其企业视听操作系统：Brahma AI Core 提供集中式内容智能和媒体资产管理， Brahma AI Studio
              提供生成式合成媒体、数字人创作和自动本地化。商业引擎源自 Prime Focus Technologies 的 CLEAR 软件栈，为工作室、体育联盟和广播机构提供企业媒体管理，并叠加 Metaphysic
              的神经性能和人脸合成技术。 定价主要采取私下协商的企业年度订阅，期限为三至五年；另有按使用量计费的层级，与合成媒体渲染量、音频本地化 分钟数和定制数字头像资产挂钩。战略渠道协议，例如与 Hakuhodo
              Technologies 在日本及亚太市场的区域商业化 合作，通过代理客户网络扩大分销。包括 Warner Bros、NBA 和 Mayo Clinic 在内的企业客户可使用内容标记、
