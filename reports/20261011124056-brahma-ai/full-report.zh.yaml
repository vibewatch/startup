          - type: paragraph
            body: >-
              Brahma AI 以 $2.0 billion 投后估值快速完成资本化，带来需要投资者严格监督的重大结构和执行风险。治理层面最 突出的担忧，是经济股权与投票控制权明显分离。Multiples Alternate
              Asset Management 领投 $150 million 优先股成长融资后，创始企业发起方 Prime Focus Limited（通过 VFX 子公司 DNEG 运营）保有约 66% 经济所有权，
              但实际投票权预计降至约 25%。这种不对称治理架构埋下委托代理摩擦：传统媒体服务集团仍承担大部分财务风险， 但运营和战略决策权转向成长型股权投资者。在资本追加、稀释性下轮融资或退出时间表受争议等不利情景下，这种
              分离可能引发董事会僵局，阻碍管理层执行。此外，公司约 15x 的远期销售倍数建立在 2026 年预计 $130 million 收入基础上，等同于把 Brahma AI
              按高增长软件基础设施而非科技赋能的后期制作服务估值。若新企业垂直领域未能 达到激进的收入扩张目标，后续融资时估值和倍数都可能严重收缩。
            claimRefs:
