      - number: '3.2'
        title: 范围、集成与差异化
        blocks:
          - type: paragraph
            body: >-
              Brahma AI 的核心差异化主张是贯通多个工作流阶段。公司将平台追溯至 DNEG、Metaphysic 和 Prime Focus Technologies 开发的技术与能力；独立报道则介绍了 Core 以及
              ATMAN、VAANI 等生成式功能。这一血统可能减少 视听企业所需的集成工作，但不能证明技术优越性。点名客户和 Emmy 奖提供商业与行业信号，却都不是受控基准。
              证据也没有比较其与具体竞争者的模型质量、延迟、来源控制、部署架构或监管保障。因此，能力矩阵区分已报道 的范围与未知的相对表现，而不是把营销表述直接转成评分。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP008
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP012
      - number: '3.3'
        title: 定价、分销与转换经济性
        blocks:
          - type: paragraph
            body: >-
              分销可能具有战略意义：Brahma AI 将 Google、Hakuhodo 和 DNEG 列为伙伴，并将 Warner Bros、NBA 和 Mayo Clinic
              列为核心客户。近期融资也为研究、全球市场拓展和硅谷布局提供资源。但现有材料没有披露目录价格、计费单位、 最低承诺、折扣结构、合同期限、实施费或产品层面的收入贡献，也没有证明客户数据、工作流编排、来源元数据或
              集成会产生可量化的转换成本。在审阅合同和续约证据前，应把伙伴网络视为触达与信誉，而非渠道排他性或客户锁定的证明。
            claimRefs:
              - CP004
              - CP005
              - CP009
              - CP010
              - CP011
              - CP012
