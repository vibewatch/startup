              等非娱乐行业的头部客户验证，以及接近盈亏平衡的运营状态，都 对商业模式形成支撑。但在充分验证这一估值前，仍有关键尽调障碍。第一，已完成融资目前确认的是 Multiples 的 $100 million，剩余
              $50 million 至 $100 million 的扩配仍取决于待定文件和监管批准。第二，24 个账户贡献 80% 销售额，严重客户集中使公司暴露于企业续约波动。最后，公开资料未披露 cohort
