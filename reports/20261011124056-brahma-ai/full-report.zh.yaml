        title: 产品定义、客户工作流架构与服务交付
        blocks:
          - type: paragraph
            body: >-
              Brahma AI 将其平台定位为 AI 原生操作系统，面向广播和工作室规模吸收、组织、转换并合成生成企业视听媒体 [CE001,
              CE002]。在实际客户工作流中，企业客户通过两个核心运营环境使用该平台：Brahma AI Core 和 Brahma AI Studio [CE001, CE002]。Brahma AI Core
              提供内容智能和媒体资产管理基础层，吸收海量非结构化视频、 多轨音频、脚本和制作元数据 [CE001, CE003]。内容在 Core 中完成索引后，企业创意与运营团队通过 Brahma AI Studio
              编排生成式工作流，创建高保真数字人（“ATMANs”），并利用 VAANI 引擎生成保留表演真实性的多语种 音频 [CE002,
              CE004]。平台不使用通用生成式头像，而是把数字身份锚定在真实人物经验证的外貌和行为人格上， 并在创作全周期执行以同意为基础的控制 [CE002]。服务交付既包括云原生自动渲染管线，也包括高接触制作工程服务，
              将企业软件自动化与好莱坞级后期制作标准衔接起来 [CE001, CE005]。
