chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、起源与运营架构
        blocks:
          - type: paragraph
            body: >-
              Brahma AI 是一家面向企业、专注生成式媒体基础设施和视听操作系统的人工智能公司。公司成立于 2023 年， 汇集了奥斯卡获奖视觉特效工作室 DNEG、数字媒体管理服务商 Prime Focus
              Technologies 以及合成媒体开发商 Metaphysic 的成熟制作技术、知识产权和专业工程人才。公司在英国伦敦和美国加州洛杉矶设有双总部及主要 运营办公室，并在印度孟买开展专业技术交付。Brahma
              AI 主要提供两层企业平台：Brahma AI Core 管理资产 来源、知识产权跟踪和内容治理；Brahma AI Studio 部署高保真神经渲染模型、名为 ATMAN 的专有数字人头像，
              以及多语种语音合成。
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO008
              - CO011
              - CO012
              - CO013
      - number: '1.2'
        title: 高管、治理与关键人物暴露
        blocks:
          - type: paragraph
            body: >-
              公司由英印企业家及科技投资人 Prabhu Narasimhan 领导；他统筹 DNEG、Prime Focus 和 Metaphysic 的资产整合，
              现任创始人兼首席执行官。技术和人工智能研究由联合创始人兼首席技术官 Jo Plaete 负责；这位计算机视觉和 神经合成专家领导公司的研究部门。管理团队还吸收了前身公司的运营骨干，包括收购 Metaphysic
              后担任联合创始人 及前首席运营官的 Martin Adams。治理层包括 Multiples Alternate Asset Management 创始人兼董事总经理 Renuka Ramnath，她在
              Multiples 领投 $100 million 后加入。治理结构与历史母公司 Prime Focus Limited 已明显 分离：Prime Focus Limited 的投票控制权稀释至约
              25%，但仍保有重要经济利益。
            claimRefs:
              - CO003
              - CO005
              - CO006
              - CO007
