        title: 商业规模、里程碑与客户集中度
        blocks:
          - type: paragraph
            body: >-
              Brahma AI 完成公司整合后商业规模快速扩大：备考口径收入从 2024 年约 $45 million 增至 2025 年 $74 million， 2026 财年的前瞻年化 run-rate 超过 $130
              million。企业收入高度集中，约 80% 的营收来自 24 个签约核心企业客户， 合同期限通常为三至五年。公开商业案例包括大型娱乐工作室 Warner Bros、National Basketball
              Association （NBA）和医疗系统 Mayo Clinic。Google Cloud 及总部位于东京的广告集团 Hakuhodo Technologies 等战略生态伙伴
              进一步加强商业分销；在高关注度广播项目落地后，Hakuhodo Technologies 在亚太地区共同商业化 ATMAN 数字人。 公司专有的人脸替换和性能保真技术获得了行业验证，并赢得 2026
              Technology & Engineering Emmy Award。
