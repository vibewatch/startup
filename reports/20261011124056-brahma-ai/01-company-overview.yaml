company:
  name: "Brahma AI"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Brahma AI is an enterprise AI audiovisual content platform formed through the consolidation of capabilities and teams from DNEG, Prime Focus Technologies, and Metaphysic. In September 2026, the company raised a $150 million preferred share growth round led by Multiples Alternate Asset Management at a $2.0 billion post-money valuation, tracking over $130 million in projected 2026 revenue with 80% concentrated among 24 large enterprise accounts."
sections:
  - id: "corporate-identity-and-foundations"
    title: "Corporate Identity, Genesis, and Operating Architecture"
    body: "Brahma AI is an enterprise-focused artificial intelligence company specializing in generative media infrastructure and audiovisual operating systems. Founded in 2023, the organization was created by bringing together established production technology, intellectual property, and specialized engineering personnel from Academy Award-winning visual effects studio DNEG, digital media management provider Prime Focus Technologies, and synthetic media developer Metaphysic. The company maintains dual headquarters and principal operating offices in London, United Kingdom, and Los Angeles, California, alongside specialized technical delivery operations in Mumbai, India. Brahma AI develops two primary enterprise platform tiers: Brahma AI Core, which manages asset provenance, intellectual property tracking, and content governance, and Brahma AI Studio, which deploys high-fidelity neural rendering models, proprietary digital human avatars known as ATMANs, and multilingual vocal synthesis."
    claimRefs: [CO001, CO002, CO003]
    tableRefs: [TO001]
  - id: "leadership-and-governance"
    title: "Executive Leadership, Governance, and Key-Person Exposure"
    body: "The company is led by British-Indian entrepreneur and technology investor Prabhu Narasimhan, who serves as Founder and Chief Executive Officer after orchestrating the strategic combination of assets across DNEG, Prime Focus, and Metaphysic. Technology and artificial intelligence research is directed by Co-Founder and Chief Technology Officer Jo Plaete, an established specialist in computer vision and neural synthesis who leads the company's research division. The executive team also incorporates operating leadership from predecessor entities, including Co-Founder and former Chief Operating Officer Martin Adams following the acquisition of Metaphysic. Governance representation includes Renuka Ramnath, Founder and Managing Director of Multiples Alternate Asset Management, who joined following Multiples' $100 million lead investment. Governance dynamics reflect a material structural separation from historical parent Prime Focus Limited, which sees its voting control dilute to approximately 25% while preserving significant economic participation."
    claimRefs: [CO003, CO005, CO006, CO007]
    tableRefs: [TO002]
  - id: "capitalization-and-ownership-structure"
    title: "Capitalization, Valuation, and Stakeholder Distribution"
    body: "In September 2026, Brahma AI completed a $150 million preferred equity financing round led by homegrown Indian private equity firm Multiples Alternate Asset Management, valuing the enterprise at a $2.0 billion post-money valuation. Multiples anchored the financing with a direct $100 million commitment, with additional institutional allocations from financial and strategic investors across Europe, West Asia, and the United States expanding the initial round and positioning total potential proceeds up to $200 million. Pre-existing capitalization reflects Brahma AI's corporate genesis: media conglomerate Prime Focus Limited retains roughly 66% economic ownership through visual effects subsidiary DNEG, while historical shareholders from Metaphysic and Abu Dhabi investment firm United Al Saqer Group hold minority equity stakes. At a $2.0 billion valuation against projected 2026 revenue exceeding $130 million, Brahma AI trades at an estimated 15x forward sales multiple."
    claimRefs: [CO006, CO008, CO009, CO010, CO012]
    tableRefs: [TO003]
  - id: "scale-milestones-and-commercial-traction"
    title: "Commercial Scale, Milestones, and Customer Concentration"
    body: "Brahma AI has exhibited rapid commercial scale following its corporate consolidation, advancing from pro-forma combined revenues of approximately $45 million in 2024 to $74 million in 2025, and tracking forward annualized run-rates in excess of $130 million for fiscal year 2026. Enterprise revenue is highly concentrated, with approximately 80% of top-line billings derived from 24 anchor enterprise accounts operating under multi-year agreements spanning three to five years. Key public commercial references include major entertainment studio Warner Bros, the National Basketball Association (NBA), and healthcare system Mayo Clinic. Commercial distribution is reinforced by strategic ecosystem partnerships with Google Cloud and Tokyo-based advertising conglomerate Hakuhodo Technologies, which co-commercializes ATMAN digital humans across the Asia-Pacific region following high-profile broadcast implementations. The company's proprietary face replacement and performance preservation technology received industry validation through a 2026 Technology & Engineering Emmy Award."
    claimRefs: [CO004, CO011, CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
