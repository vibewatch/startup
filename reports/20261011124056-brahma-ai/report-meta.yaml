companyProfile:
  summary: Brahma AI is an enterprise audiovisual AI platform formed from the consolidation of capabilities and teams across DNEG, Prime Focus Technologies, and Metaphysic. It sells workflow software and generative media infrastructure for asset intelligence, synthetic video, digital humans, voice, and localization, with the strongest evidence coming from media, sports, healthcare, and advertising deployments. The company has achieved rapid pro-forma revenue growth and blue-chip customer validation, but the operating model remains concentrated in a small number of large accounts and depends on a complex ownership structure.
  foundedDate: "2023-01-15"
  founders:
    - name: Prabhu Narasimhan
      role: Founder & Chief Executive Officer
      background: British-Indian entrepreneur and technology investor who orchestrated the combination of DNEG, Prime Focus, and Metaphysic assets.
      claimRefs: [CO003, CO005]
    - name: Jo Plaete
      role: Co-Founder & Chief Technology Officer
      background: Computer vision and synthetic media specialist leading Brahma AI's research and neural synthesis work.
      claimRefs: [CO005, CO007]
