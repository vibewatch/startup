callouts:
  - calloutType: "risk"
    title: "Governance Deadlock and Voting Rights Asymmetry"
    body: "The structural separation between Prime Focus's 66% economic equity and its reduced 25% voting stake introduces severe agency conflict risks. If growth-equity investors and legacy corporate sponsors disagree on strategic M&A, capital calls, or dividend distributions, Brahma AI could face boardroom paralysis that stalls product roadmaps."
    claimRefs:
      - "CR001"
      - "CR003"
  - calloutType: "insight"
    title: "Compute Unit Economics as Primary Operational Margin Gate"
    body: "Unlike traditional SaaS media asset management platforms, Brahma AI's gross margins are directly exposed to GPU inference and cloud transcoding volatility. The proprietary 'Machine Wisdom' chunking architecture is an operational necessity: without aggressive pre-filtering and static frame deduplication, processing thousands of hours of high-resolution video will rapidly erode enterprise contract profitability."
    claimRefs:
      - "CR008"
      - "CR009"
