      - number: '6.4'
        title: Retention Dynamics and Concentration Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Enterprise customer relationships at Brahma AI are underpinned by long-term commitments typically spanning
              three to five years, combining core platform licensing with consumption-based rendering and processing
              tiers. While multi-year contracts provide near-term revenue visibility and stability, the commercial base
              remains exposed to acute customer concentration risk. With 24 customers generating roughly 80% of company
              revenues, the loss or procurement downgrade of any single anchor client could severely impact financial
              performance. Furthermore, public disclosures omit audited net revenue retention (NRR) and gross revenue
              retention (GRR) cohorts, preventing independent verification of expansion velocity. Commercial risk is
              also heightened by corporate restructuring, where Prime Focus has ceded majority voting control of Brahma
              AI Holdings Limited (BHL) from 89.27% down to 24.99%, potentially introducing friction in leveraging
              DNEG's global creative client relationships for cross-selling.
            claimRefs:
              - CU006
