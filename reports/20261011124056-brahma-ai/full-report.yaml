        title: Exhibits
        blocks:
          - type: callout
            title: Do not reconcile incompatible headline estimates
            body: >-
              The company-linked projection exceeds the external AI-generated-content forecast, but absent definitions
              prevent a like-for-like comparison. Valuation work should use scenario ranges and explicit boundary
              assumptions rather than selecting the largest headline.
            calloutType: insight
            claimRefs:
