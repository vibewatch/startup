      - number: '8.4'
        title: Exit Readiness, Thesis-Break Triggers, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Exit feasibility for Brahma AI centers on an initial public offering in the 2028 to 2029 timeframe or a
              strategic acquisition by an enterprise cloud or marketing infrastructure provider such as Adobe, Google,
              or Salesforce. Achieving exit readiness requires resolving critical diligence gaps around unaudited gross
              margins, cash burn rate, and dual-class share covenants. Key thesis-break triggers that would prompt
              immediate downgrade or termination of tracking include annualized revenue decelerating below $120 million,
              the churn of any top-three anchor client, or litigation arising from Prime Focus governance disputes.
              Before committing capital, investors must inspect audited financial statements, cohort retention
              schedules, and the Series A preferred share purchase agreement.
            claimRefs:
              - CV007
