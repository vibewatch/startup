      - number: '8.3'
        title: Comparable Valuation Benchmarks and Return Scenarios
        blocks:
          - type: paragraph
            body: >-
              Brahma AI's 15x forward revenue multiple trades at a marked premium to public SaaS enterprise software
              averages and in line with high-momentum private generative video platforms such as Runway, Synthesia, and
              ElevenLabs. To evaluate risk-adjusted return expectations, we model three distinct 2028 scenarios. Under
              the Bull Case (25% probability), accelerated adoption of interactive digital humans across healthcare and
              advertising drives 2028 revenue above $320 million, yielding a $4.5 billion valuation at a 14x multiple.
              The Base Case (50% probability) anticipates steady expansion to $240 million in revenue with multiple
              normalization to 9x, generating a $2.16 billion valuation. The Bear Case (25% probability) models client
              churn among the top 24 accounts and persistent compute cost inflation, resulting in multiple compression
              to 5x on $150 million revenue and an implied $750 million valuation.
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
          - type: table
