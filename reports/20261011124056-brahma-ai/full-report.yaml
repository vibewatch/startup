  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Corporate Governance, Voting Asymmetry, and Valuation Execution Risks
        blocks:
          - type: paragraph
            body: >-
              Brahma AI's rapid capitalization at a $2.0 billion post-money valuation introduces substantial structural
              and execution risks that demand rigorous investor oversight. Foremost among corporate governance concerns
              is the pronounced divergence between economic equity and voting control. Following the $150 million
              preferred-share growth financing led by Multiples Alternate Asset Management, founding corporate sponsor
              Prime Focus Limited (operating through VFX subsidiary DNEG) retains approximately 66% economic ownership,
              yet its effective voting power is projected to decline to roughly 25%. This asymmetric governance
              architecture creates latent principal-agent friction: majority financial exposure remains with a
              traditional media services conglomerate, while operational and strategic decision-making power shifts
              toward growth-equity financial sponsors. In adverse operating scenarios—such as capital calls, dilutive
              down-rounds, or contested exit timelines—this divergence could trigger boardroom deadlock and impede
              executive execution. Furthermore, Brahma AI's valuation multiple of approximately 15x forward sales
              against $130 million in projected 2026 revenue prices the company as high-growth software infrastructure
              rather than a tech-enabled post-production service. Failing to meet aggressive revenue expansion targets
              across new enterprise verticals would result in severe valuation compression and multiple contraction upon
              subsequent financing events.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
