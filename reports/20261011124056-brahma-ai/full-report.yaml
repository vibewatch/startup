      - number: '5.3'
        title: Technical Architecture, Infrastructure Dependencies, and Engineering Stack
        blocks:
          - type: paragraph
            body: >-
              Brahma AI has engineered its platform architecture natively on Google Cloud to support compute-intensive
              generative rendering and planet-scale media streaming [CE002]. The software stack reflects a hybrid
              enterprise architecture: backend services are implemented in GoLang, Python, and .NET, utilizing
              microservices and micro-frontends built on React [CE003, CE005]. Data persistence and catalog indexing
              leverage a heterogeneous database tier comprising PostgreSQL, SQL Server, MongoDB, and
              Elasticsearch/OpenSearch clusters to query dense metadata across petabyte-scale archives [CE003].
              Generative workloads rely on deep integration with Google Cloud's high-performance AI infrastructure and
              advanced foundation models, including Google Veo for visual generation and Gemini for multimodal reasoning
              and text-to-speech alignment [CE002]. Production tracking and task workflow services capture empirical
              data across globally distributed engineering teams, optimizing GPU compute scheduling, artist hours, and
              operational delivery costs [CE005]. While this cloud-native posture provides rapid elasticity for
              high-volume rendering demands, it introduces substantial operational dependencies on Google Cloud compute
              pricing, TPU/GPU accelerator availability, and third-party foundation model APIs [CE002, CE008].
            claimRefs:
              - CE002
              - CE003
              - CE005
              - CE008
