      - number: '8.2'
        title: Capitalization Structure, Pricing Discipline, and Governance Friction
        blocks:
          - type: paragraph
            body: >-
              The September 2026 growth financing round injected $150 million through the issuance of preferred shares,
              anchored by a $100 million lead commitment from Multiples Alternate Asset Management with Cantor
              Fitzgerald & Co. acting as sole placement agent. The transaction prices Brahma AI at a $2.0 billion
              valuation, reflecting investor enthusiasm for proprietary audiovisual infrastructure and enterprise
              digital human deployment. Nonetheless, the post-financing ownership architecture introduces structural
              governance friction. Prime Focus Limited retains roughly 66% economic ownership through its DNEG operating
              relationship, yet its voting rights compress to approximately 25% post-dilution. This significant wedge
              between economic exposure and governance authority creates potential alignment risks for minority growth
              investors, particularly regarding future capital allocation, intercompany licensing agreements, and
              eventual exit liquidity.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV010
              - CV011
