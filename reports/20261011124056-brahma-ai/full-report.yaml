      - number: '6.2'
        title: Revenue Scale and Adoption Trajectory
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory of Brahma AI demonstrates rapid revenue acceleration, driven by enterprise
              expansion following the consolidation of Prime Focus Technologies, Metaphysic, and DNEG technology assets.
              On a pro-forma basis, the constituent entities generated approximately $45 million in 2024 and expanded by
              64.4% to $74 million in 2025. For 2026, management indicates top-line revenue is tracking in excess of
              $120 million to $130 million, representing roughly 70% year-over-year expansion and supporting its $2
              billion post-money valuation multiple. Platform licensing and usage-based workflows represent the core
              foundation of this revenue base, with managed services constrained to less than 15% of total sales.
              However, approximately 80% of total revenue is concentrated within 24 large enterprise customer accounts,
              reflecting an average annual contract value of $4.0 million to $4.3 million across its key customer
              cohort.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU011
