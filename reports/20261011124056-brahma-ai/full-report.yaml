      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Investment Stance: Neutral / Track with Strict Entry Discipline'
            body: >-
              While Brahma AI demonstrates strong revenue momentum tracking above $130M in 2026 and validation from
              blue-chip anchors (Warner Bros, NBA, Mayo Clinic), its $2.0B post-money valuation (15x forward sales)
              fully prices near-term upside. In combination with an 80% revenue concentration across 24 accounts and
              governance friction where Prime Focus retains 66% economic ownership against 25% voting power, new capital
              should seek a discount or wait for de-risking of enterprise expansion before entering.
            calloutType: recommendation
            claimRefs:
