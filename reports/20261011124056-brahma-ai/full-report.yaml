            title: Severe Enterprise Customer Revenue Concentration
            body: >-
              With 24 enterprise customers accounting for approximately 80% of revenue, Brahma AI faces significant
              revenue concentration risks, where any procurement friction or contract loss among top accounts could
              materially impact growth.
            calloutType: risk
