figures:
  - id: "FM001"
    title: "Evidence hierarchy for market sizing"
    type: "pyramid"
    summary: "Six evidence layers separate broad category estimates and operational scale from the undisclosed Brahma-specific serviceable and obtainable market."
    data:
      items:
        - label: "Company-linked opportunity"
          value: ">USD 130B"
          detail: "2030 projection connected to digital humans and broader enterprise content solutions; methodology undisclosed"
        - label: "External forecast upper bound"
          value: "USD 80.1B"
          detail: "Grand View Research AI-generated-content projection for the early 2030s, as cited by Mint"
        - label: "External forecast lower bound"
          value: "USD 53.8B"
          detail: "Grand View Research AI-generated-content projection for the early 2030s, as cited by Mint"
        - label: "External category baseline"
          value: "USD 12.9B-USD 14.8B"
          detail: "Global AI-generated-content range for 2024, as cited by Mint"
        - label: "Operational relevance"
          value: "100M+ assets; 100 PB archives"
          detail: "Company-reported deployment scale, not a dollar market estimate"
        - label: "Brahma-specific SAM and SOM"
          value: "Undisclosed"
          detail: "Pricing, account counts, attach rates, and deployment volumes are required"
    approximationNotes: "No values were added, divided, annualized, or treated as nested populations. The market estimates have different scopes; operational metrics are shown only as adoption evidence."
    claimRefs:
      - "CM004"
      - "CM005"
      - "CM006"
      - "CM007"
      - "CM008"
      - "CM016"
callouts:
  - calloutType: "insight"
    title: "Do not reconcile incompatible headline estimates"
    body: "The company-linked projection exceeds the external AI-generated-content forecast, but absent definitions prevent a like-for-like comparison. Valuation work should use scenario ranges and explicit boundary assumptions rather than selecting the largest headline."
    claimRefs:
      - "CM006"
      - "CM007"
      - "CM008"
      - "CM016"
  - calloutType: "risk"
    title: "Commercial evidence remains concentrated and private"
    body: "Named anchor customers and multi-year relationships support demand, but customer concentration, undisclosed pricing, and missing deployment economics prevent a reliable bottom-up share estimate."
    claimRefs:
