  summary: "Brahma AI has established enterprise validation across entertainment, sports, and healthcare, securing marquee reference accounts including Warner Bros, NBA, and Mayo Clinic under multi-year contracts, though top-line revenue exhibits heavy concentration among 24 core customers."
sections:
  - id: "customer-segmentation-and-vertical-focus"
    title: "Customer Segmentation and Vertical Focus"
    body: "Brahma AI structures its enterprise commercial go-to-market across four core target verticals: media and entertainment, sports, healthcare, and advertising. The media and entertainment segment represents the company's legacy foundation and primary revenue engine, engaging major Hollywood studios and broadcast networks that require high-fidelity generative visual AI, digital face replacement, and performance preservation. In sports, the company delivers automated content indexing, audiovisual catalog transformation, and personalized digital fan experiences. Healthcare represents a demanding new frontier focused on clinician digital twins and patient communications, where security, verifiable accuracy, and strict governance are paramount. In advertising, Brahma AI commercializes interactive digital humans, known as ATMANs, enabling agencies and global brand owners to deploy localized virtual ambassadors across regional campaigns."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU010"
      - "CU013"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "revenue-scale-and-adoption-trajectory"
    title: "Revenue Scale and Adoption Trajectory"
    body: "The adoption trajectory of Brahma AI demonstrates rapid revenue acceleration, driven by enterprise expansion following the consolidation of Prime Focus Technologies, Metaphysic, and DNEG technology assets. On a pro-forma basis, the constituent entities generated approximately $45 million in 2024 and expanded by 64.4% to $74 million in 2025. For 2026, management indicates top-line revenue is tracking in excess of $120 million to $130 million, representing roughly 70% year-over-year expansion and supporting its $2 billion post-money valuation multiple. Platform licensing and usage-based workflows represent the core foundation of this revenue base, with managed services constrained to less than 15% of total sales. However, approximately 80% of total revenue is concentrated within 24 large enterprise customer accounts, reflecting an average annual contract value of $4.0 million to $4.3 million across its key customer cohort."
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU011"
    tableRefs:
      - "TU002"
  - id: "named-production-deployments-and-reference-quality"
    title: "Named Production Deployments and Reference Quality"
    body: "Brahma AI has validated its enterprise technology stack through production deployments with tier-one global organizations rather than limited research proofs-of-concept. Anchor accounts publicly confirmed in production include Warner Bros and Paramount in media, the National Basketball Association (NBA) and ESPN in professional sports, and the Mayo Clinic in healthcare. In entertainment production, the company's Neural Performance technology achieved industry acclaim by securing a 2026 Technology and Engineering Emmy Award for AI-based face replacement and performance preservation, demonstrated in feature film releases including Toxic and multilingual releases of Ramayana. Deployments within the NBA and ESPN leverage audiovisual intelligence to automate highlight extraction and localized content production. Meanwhile, Mayo Clinic's adoption of digital twin modeling for physicians provides substantial institutional validation for the governance, security, and fidelity of Brahma AI Core."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU012"
    tableRefs:
      - "TU003"
  - id: "retention-dynamics-and-concentration-vulnerabilities"
    title: "Retention Dynamics and Concentration Vulnerabilities"
    body: "Enterprise customer relationships at Brahma AI are underpinned by long-term commitments typically spanning three to five years, combining core platform licensing with consumption-based rendering and processing tiers. While multi-year contracts provide near-term revenue visibility and stability, the commercial base remains exposed to acute customer concentration risk. With 24 customers generating roughly 80% of company revenues, the loss or procurement downgrade of any single anchor client could severely impact financial performance. Furthermore, public disclosures omit audited net revenue retention (NRR) and gross revenue retention (GRR) cohorts, preventing independent verification of expansion velocity. Commercial risk is also heightened by corporate restructuring, where Prime Focus has ceded majority voting control of Brahma AI Holdings Limited (BHL) from 89.27% down to 24.99%, potentially introducing friction in leveraging DNEG's global creative client relationships for cross-selling."
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU014"
