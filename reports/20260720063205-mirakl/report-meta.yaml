  customerFocus: Large retailers, brands, wholesalers, distributors, and B2B enterprises building third-party marketplace ecosystems.
  businessModel: Revenue is anchored in recurring enterprise software contracts for marketplace operations and expands through adjacent modules, seller tooling, retail media, payments, catalog onboarding, and related implementation or integration work.
