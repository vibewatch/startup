companyProfile:
  summary: 'Mirakl is a French enterprise-commerce software company founded in 2012 that helps retailers and B2B companies launch and operate third-party marketplaces, dropship programs, seller payments, supplier-catalog workflows, retail-media programs, and newer agentic-commerce surfaces. Public evidence supports genuine scale rather than a narrow niche: the company reported $218 million of ARR and group-wide profitability in 2025, says it supports 450+ marketplaces and 100,000+ sellers, and still carries a last publicly disclosed private valuation above $3.5 billion. The core diligence question is not whether Mirakl has product-market fit; it is whether the visible private mark still offers upside after public comp compression and in the absence of audited retention, margin, and cap-table data.'
