  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Public board composition, voting rights, reserved matters, and founder ownership percentages.
    whyItMatters: Governance control determines who can force or block financing, acquisitions, and exit timing.
    diligencePath: Request the current board list, shareholder agreement summary, and cap-table waterfall from management.
