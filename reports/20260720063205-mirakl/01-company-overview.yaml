- id: milestones-customers-and-limitations
  title: Milestones, Customer Proof, and Important Caveats
  body: 'Mirakl’s milestone cadence shows a company that kept broadening the product surface after finding fit in marketplace operations. The about page anchors the chronology: first dropship platform in 2013, first B2B marketplace in 2014, U.S. office in 2015, Mirakl Connect launch in 2019, Payout and the Octobat acquisition in 2022, Ads in 2023, Adspert in 2024, and Nexus in 2025. The 2024 and 2025 result releases deepen that picture by quantifying newer engines: Connect reached $11.7 million ARR in under a year; Ads reached $12.7 million ad spend in 2025 after >100% growth in 2024; and a May 2026 trust-and-safety launch connected the roadmap directly to regulatory compliance. The customer proof is strong because it spans multiple retail formats and measurable outcomes, not just logo slides.


    The main caveat is scope creep and platform complexity. Mirakl’s bullish story is that adjacent modules deepen moat and raise wallet share. The skeptical story, represented most clearly by competitor-oriented commentary, is that Mirakl remains a specialist marketplace layer that still requires operators to integrate storefronts, CMS, ERP, and order-management systems elsewhere. That criticism does not negate product-market fit, but it does matter for diligence: Mirakl’s differentiation depends on remaining the best neutral orchestrator for complex marketplaces rather than becoming just another costly integration layer in a composable stack.'
