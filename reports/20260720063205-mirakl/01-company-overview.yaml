  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A precise current employee count by function and geography.
    whyItMatters: Headcount is a key efficiency input for evaluating ARR per employee and support burden.
    diligencePath: Request current HRIS-export headcount by region and function; reconcile with CFO planning materials.
