- id: leadership-and-governance
  title: Leadership, Governance, and Key-Person Dependence
  body: 'The about page shows a fairly mature leadership bench: Marie Best (CFO), Laure Le Gall (CRO), Nagi Letaifa (CTO), Jean-Yves Simon (Chief Product Officer), Sophie Marchessou (Chief Customer Officer), Scott Eckert (CEO Americas), and Tzipi Avioz (CEO APAC & Japan) all appear as current leaders. That matters because Mirakl’s current strategy spans software, financial flows, media monetization, and AI infrastructure; it would be hard to execute that transition without a more specialized executive layer beneath the founders. The board-and-advisor surface visible on the site also includes investment-linked figures from Silver Lake, 83North, Permira, Felix, Bain, and Elaia, which is consistent with a late-stage private company whose governance has broadened with each financing round.


    Even so, founder dependence remains high. Corrot and Nussenbaum are still the public strategic narrators across funding, annual results, and new-product launches, and the company’s identity is closely linked to their long-held platform-economy thesis. There is no public disclosure of detailed board rights, voting control, or succession planning. That is normal for a private SaaS company, but it leaves an underwriting gap around how much practical control sits with the founders versus later-stage investors. For diligence purposes, the leadership bench looks credible; the governance disclosure still does not match what a public-market investor would expect.'
