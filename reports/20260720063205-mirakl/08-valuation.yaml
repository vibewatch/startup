    - High
    - Valuation reset, disclosure gaps, and adjacency execution can all compress returns
    - Treat downside protection as mandatory, not optional
  - - Valuation stance
    - Stretched
    - ~16.1x ARR at the last disclosed $3.5B mark is rich relative to most public commerce comps
    - Require either better evidence or better price
  - - Decision implication
    - Evidence-sensitive entry only
    - Current mark can be defended in a bull case, but not yet as a default base case
    - Do not move to buy until private diligence closes the key gaps
