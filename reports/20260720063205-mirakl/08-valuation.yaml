- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - case
  - assumptions
  - valuation/return logic
  - key risks
  - probability signal
  rows:
  - - Bear
    - Growth slows, adjacencies remain small, and the next price discovery event anchors closer to mid-tier public comps
    - $2.0B-$2.7B; equivalent to roughly 8x-12x ARR and a clear reset below the last mark
    - Renewal weakness, margin disappointment, or adverse financing terms
    - Any tender, round, or sponsor indication below $3.0B
  - - Base
    - Core platform stays profitable, growth remains solid, and private diligence is acceptable but not exceptional
    - $2.6B-$3.3B; about 12x-15x ARR and slightly below the last headline mark
    - Disclosure still not good enough for a public-style premium
    - Most consistent with current public evidence
  - - Bull
    - 20%+ growth persists, adjacencies scale, and audited diligence supports premium software economics
    - $3.3B-$3.9B; about 15x-18x ARR and close to or modestly above the last mark
    - Adjacency monetization and disclosure quality may not improve enough
    - Requires hard evidence, not just category narrative
  notes: Ranges are directional valuation scenarios in USD billions, not a negotiated price opinion.
