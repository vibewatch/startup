- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner / diligence path
  rows:
  - - ARR / revenue bridge
    - Audited bridge from ARR to recognized revenue by product line
    - Determines whether ARR deserves a premium multiple
    - CFO / audit workpapers and monthly board pack
  - - Retention and concentration
    - NRR, GRR, churn, top-20 customers, and cohort behavior
    - Tests durability of enterprise marketplace contracts
    - Revenue-operations data room and sample contract review
  - - Gross margin and cash conversion
    - Gross margin by module, services burden, capex/cloud spend, FCF, and working-capital profile
    - Separates software-quality economics from heavy delivery economics
    - Finance diligence and management Q&A
  - - Debt and liquidity
    - Current RCF draw, covenants, maturity profile, and minimum-liquidity requirements
    - Changes downside risk and the need for new equity
    - Treasury schedules and loan documents
  - - Cap table / preferences
    - Full preference stack, side letters, information rights, and secondary/primary mix
    - Turns headline valuation into real entry economics
    - Counsel review of charter, financing docs, and side letters
  - - Adjacency monetization
    - Paid ARR, attach, renewal, and profitability for Connect, Ads, and Nexus
    - Decides whether the bull case is real or just narrative extension
    - Product / CRO diligence with cohort data
  notes: The asks are prioritized by how directly they could move an investment committee decision at the current mark.
