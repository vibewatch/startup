- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - evidence direction
  - what would change the view
  - decision weight
  rows:
  - - Category leadership
    - 450+ marketplaces, 100k+ sellers, and enterprise B2B/B2C breadth support a premium franchise
    - Evidence of customer concentration or weak renewals would reduce the premium case
    - High
  - - Profitability proof
    - 2024 EBITDA positive core and 2025 group profitability reduce financing urgency
    - If margins are thin or cash conversion is weak, the valuation support falls quickly
    - High
  - - Adjacency upside
    - Connect and Ads show real commercial traction beyond the core platform
    - Bull case weakens if attach rates remain too small to matter economically
    - Medium
  - - Disclosure gap
    - No public NRR, gross margin, FCF, or preference stack makes the headline mark hard to defend
    - Audited data room quality could move the recommendation up materially
    - High
  - - Go-to-market friction
    - Adverse competitor writeups flag high cost and implementation complexity
    - If customer cohorts still expand strongly, stickiness outweighs this friction
    - Medium
  - - Agentic optionality
    - Nexus can expand TAM, but current public monetization proof is limited
    - Demonstrated ARR or retention lift from Nexus could justify upper-end multiples
    - Medium
  notes: The anti-thesis is valuation-led, not a claim that Mirakl lacks product-market fit.
