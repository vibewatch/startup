- id: exit-readiness-and-final-diligence-asks
  title: Exit readiness, kill triggers, and final diligence asks
  body: 'Mirakl is closer to exit readiness than many late-stage private software companies because it already publishes real ARR, GMV, and profitability signals. Even so, it is not ready for a confident buy recommendation from public evidence alone. Public-company and sponsor comps both show the same pattern: investors pay up for quality only when disclosure is good enough to defend margins, growth durability, and cash conversion. Mirakl has not yet provided that level of evidence. The absence of a fresh price-discovery event since 2021 increases the importance of the next financing, tender, or exit process because that will reveal whether outside buyers still support the headline mark.


    For that reason the final recommendation is price-sensitive and evidence-sensitive. A buyer should not underwrite upside mainly on brand, category creation, or AI messaging. The work list in TV005 and TV006 is specific: verify the audited ARR bridge, retention, margin, concentration, debt utilization, and full liquidation-preference stack before treating the last public mark as investable. If those checks are strong, the recommendation can improve; if they disappoint, the downside reset arrives quickly. That asymmetry is the core reason the chapter ends at track, not buy.'
