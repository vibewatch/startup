chapter:
  number: 8
  title: Valuation
  summary: 'Mirakl merits a track recommendation: the company has scaled, profitable enterprise-marketplace leadership, but the last visible $3.5 billion private mark still implies a rich ~16.1x ARR on 2025 results and remains too opaque on retention, margins, and preferences to justify a buy call.'
sections:
- id: current-pricing-context-and-multiple-discipline
  title: Current pricing context and why multiple discipline matters
  body: 'Mirakl enters the valuation chapter with two seemingly contradictory truths. First, the company is clearly real and scaled: it reported $177 million of ARR and positive EBITDA in 2024, then $218 million of ARR and group-wide profitability in 2025, while supporting 450+ marketplaces and more than 100,000 sellers. Second, the only widely visible equity valuation anchor is still the September 2021 Series E that priced the company at more than $3.5 billion. That means the underwriting question is not whether Mirakl is a quality business; it is whether a four-year-old private headline still offers upside after the denominator has grown and public-market commerce multiples have reset.


    The multiple math already answers part of that question. The old mark has compressed from an extreme 2021-era private multiple to about 19.8x 2024 ARR and about 16.1x 2025 ARR, so Mirakl has grown into the price. But growing into a valuation is not the same as creating a new discount. Public evidence still does not disclose the exact quality of that ARR, the gross margin behind it, or the capital-structure terms that determine what a new investor would actually own. TV001 and TV002 therefore set a track recommendation rather than a buy call, while FV001 shows how scale, profitability, and disclosure gaps interact.'
