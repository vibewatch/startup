  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: entry economics
    missingEvidence: Audited ARR-to-revenue bridge, NRR/GRR, top-customer concentration, and gross margin by major product line.
    whyItMatters: These metrics determine whether Mirakl deserves a premium software multiple or only a moderate premium to weaker public commerce platforms.
    diligencePath: Request board package, audit workpapers, and cohort retention analysis in the data room before treating the last public mark as investable.
    relatedQuestionRefs:
    - QV019
    - QV027
  - type: private-evidence-only
    severity: material
    topic: cap table and downside protection
    missingEvidence: Full liquidation-preference stack, side letters, secondary versus primary proceeds, and any investor-specific rights tied to recent financings.
    whyItMatters: Headline valuation can materially overstate the economics available to a new investor if senior preference or information-right overhang exists.
    diligencePath: Obtain charter, financing documents, side letters, and counsel summary before final IC approval.
    relatedQuestionRefs:
    - QV019
    - QV027
    - QV029
  - type: enumeration-incomplete
    severity: minor
    topic: comparable set coverage
    missingEvidence: A fully normalized comp set including additional public commerce, marketplace, and private transaction references with consistent EV/revenue or ARR math.
    whyItMatters: The current chapter uses a decision-relevant sample rather than an exhaustive or perfectly normalized peer set because public pure-play Mirakl analogues are limited.
    diligencePath: Expand the comp sheet during live deal work with banker comps, sponsor indications, and transaction-level adjustments.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV004
