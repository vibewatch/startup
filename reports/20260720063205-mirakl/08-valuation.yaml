- id: TV001
  title: Recommendation summary table
  columns:
  - dimension
  - conclusion
  - supporting evidence
  - decision implication
  rows:
  - - Recommendation
    - Track
    - Scaled profitable category leader, but current public mark is not clearly discounted
    - Monitor and diligence rather than underwrite immediate upside
  - - Confidence
    - Medium
    - Top-line, profitability, and funding history are reasonably visible; cohort economics and cap table are not
