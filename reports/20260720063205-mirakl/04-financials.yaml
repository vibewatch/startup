  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Module-level revenue mix across core marketplace, Ads, Connect, Payout, Catalog Platform, and services.
    whyItMatters: Without mix, investors cannot determine whether the growth base is mostly high-margin software or a broader blended model.
    diligencePath: Request board reporting or management monthly business review showing ARR, revenue, gross profit, and churn by module.
    relatedQuestionRefs:
    - QI004
    - QI022
    - QI025
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: material
    topic: margin-and-cash
    missingEvidence: Gross margin, operating cash flow, cash balance, debt draw, covenant headroom, and free cash flow.
    whyItMatters: These are essential to underwriting runway, financing flexibility, and the durability of reported profitability.
    diligencePath: Review audited FY2025 financial statements, current management accounts, treasury report, and debt documents.
    relatedQuestionRefs:
    - QI009
    - QI016
    - QI017
    - QI022
    relatedTableRefs:
    - TI003
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: retention-and-sales-efficiency
    missingEvidence: NRR, GRR, logo churn, CAC, payback, quota attainment, and services-delivery margin.
    whyItMatters: These fields determine whether Mirakl’s current profitability can compound or is being flattered by mix, timing, or low disclosure.
    diligencePath: Request cohort analyses, sales-ops dashboards, and customer-retention reporting by segment and vintage.
    relatedQuestionRefs:
    - QI012
    - QI021
