- id: TI005
  title: Public financial gaps table
  columns:
  - missing metric
  - impact
  - exact diligence path
  - why it matters
  rows:
  - - Revenue mix by module
    - Cannot tell whether growth is core-platform or adjacency-led
    - Request ARR bridge by core, Ads, Connect, Payout, Catalog, and services
    - Determines durability and gross-margin quality.
  - - Gross margin by stream
    - Cannot underwrite true software quality
    - Request audited gross margin split by stream
    - Determines valuation support.
  - - Retention metrics
    - Cannot distinguish expansion-led from replacement-led growth
    - Request NRR, GRR, logo churn, and cohort curves
    - Central to revenue durability.
  - - Operating cash flow and cash balance
    - Cannot model runway or financing optionality
    - Request latest cash-flow statement and treasury forecast
    - Central to capital adequacy.
  - - Sales efficiency
    - Cannot judge payback or quality of growth
    - Request CAC, payback, quota attainment, and new-logo economics
    - Central to forward scaling discipline.
  notes: These are the core blockers that separate a credible public narrative from a fully investable financial model.
