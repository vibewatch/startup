  - why it matters
  - diligence ask
  rows:
  - - ARR growth 2024→2025
    - $177M to $218M
    - High
    - Shows continued top-line expansion at scale
    - Reconcile ARR bridges by new logo, upsell, and churn.
  - - EBITDA / profitability status
    - EBITDA profitable in 2024; group-wide profitable in 2025
    - High
    - Separates Mirakl from still-lossmaking private peers
    - Request EBITDA margin, operating cash flow, and one-off adjustments.
  - - Gross margin
    - Undisclosed
    - Low
    - Core driver of software quality and valuation
    - Request gross margin by software vs services vs payments-adjacent streams.
  - - CAC payback
    - Undisclosed
    - Low
    - Determines how efficiently Mirakl converts sales spend into growth
    - Request blended and enterprise-segment payback periods.
  - - NRR / GRR
    - Undisclosed
    - Low
    - Critical for judging durable expansion and logo retention
    - Request cohort retention by vintage and segment.
  - - Services-delivery margin
    - Undisclosed
    - Low
    - Important if implementation is meaningful
    - Request services share of revenue and contribution margin.
  notes: Most classic SaaS underwriting inputs remain unavailable publicly even though top-line and profitability proof are better than average.
