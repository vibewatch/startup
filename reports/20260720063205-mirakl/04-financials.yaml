- id: unit-economics-cost-structure-and-peer-benchmarks
  title: Unit economics, cost structure, and peer benchmarks
  body: 'Mirakl’s unit economics are still mostly private. Public materials do not disclose gross margin, services margin, CAC, payback, NRR, GRR, or customer concentration. That means the investment team cannot answer basic underwriting questions such as how much gross profit incremental GMV or module attach creates, whether new logos pay back within a reasonable period, or how dependent the business is on large expansion deals. The best public answer is to use public-commerce peers as directional benchmarks, not as substitutes for company data.


    Those peers show that enterprise commerce can scale into large revenue bases, but that the model remains operationally demanding. Sales, partner ecosystems, product R&D, and global support all matter. For Mirakl, the implication is that reported profitability is meaningful, but still incomplete without mix and margin context. If Ads, Connect, and Catalog Platform are high-attach, software-like expansions, the earnings path is more attractive; if they carry heavy implementation or support costs, the quality of revenue is less compelling than ARR alone suggests.'
