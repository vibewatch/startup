  - - Mirakl (public facts only)
    - ARR, GMV, profitability, and funding milestones
    - Enough to establish quality direction
    - Still too sparse for full underwriting.
  notes: Comparable public filings are directional benchmarks, not substitutes for Mirakl-specific disclosure.
