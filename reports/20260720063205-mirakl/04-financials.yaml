- id: TI004
  title: Capital adequacy table
  columns:
  - field
  - public signal
  - status
  - implication
  - diligence ask
  rows:
  - - Equity capital raised
    - $555M Series E in 2021; roughly $948M+ total raised across history
    - Known
    - Large historic cushion reduced dependency on immediate primary funding
    - Request cap table, preference stack, and remaining primary cash.
  - - Debt / credit facilities
    - €100M revolving credit facility announced in 2023
    - Known
    - Adds flexibility but also refinancing and covenant considerations
    - Request drawn amount, covenants, maturity, and rate terms.
  - - Cash balance
    - Not publicly disclosed
    - Unknown
    - No hard runway or downside liquidity model possible
    - Request latest balance sheet and cash-forecast view.
  - - Burn / free cash flow
    - Not publicly disclosed; profitability improved by 2025
    - Partial
    - Lower risk than a heavy-burn peer but still unverifiable
    - Request monthly burn, cash conversion, and FY25 operating cash flow.
  - - Next-round trigger
    - No obvious urgent trigger visible publicly after profitability claim
    - Estimated
    - Could support patient fundraising timing
    - Request board plan for debt, liquidity, and exit timing.
  notes: Capital adequacy looks materially better after 2025 profitability, but it still cannot be fully proven from public evidence.
