- id: capital-adequacy-and-financial-verdict
  title: Capital adequacy and financial verdict
  body: 'Mirakl’s capital story has improved. The 2021 Series E injected $555 million, and the 2023 revolving credit facility added another €100 million of optional liquidity. By 2025 the company said it had reached group-wide profitability. Taken together, those facts imply Mirakl is less dependent on immediate primary fundraising than many private software companies of similar scale. That is valuable both strategically and in a high-rate environment where private capital is more selective.


    But the capital picture is still not fully underwritten. There is no public cash balance, no draw detail on the revolving line, no free-cash-flow disclosure, and no visibility into liquidation preferences from prior rounds. For a growth-stage investor, that means the current business looks financially credible, but not yet sufficiently transparent to justify paying any price. The right interpretation is “lower financing risk than average, still meaningful information risk.”'
