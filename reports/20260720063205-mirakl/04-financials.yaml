- id: public-traction-and-quality-of-growth
  title: Public traction and quality of growth
  body: 'Mirakl’s public traction is unusually strong for a late-stage private company. The company disclosed $177 million of ARR, $11.2 billion of GMV, and EBITDA profitability for 2024, then $218 million of ARR, $14.6 billion of GMV, and group-wide profitability for 2025. Digital Commerce 360 and Sacra both corroborated the core direction of those numbers. That does not eliminate reporting risk, but it does make Mirakl materially easier to underwrite than private peers that publish only vague customer counts or unattributed “triple-digit growth” statements.


    The deeper question is quality of growth. ARR and GMV moved up together while profitability improved, which is a positive sign. But the pace of growth also shows Mirakl has matured out of the 2021 fundraising environment. That is not a negative by itself; it simply means the investment case now depends more on durable attach, margin, and retention quality than on headline category creation alone.'
