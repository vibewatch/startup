chapter:
  number: 7
  title: Risks
  summary: Mirakl’s biggest risks are not generic “startup” risks but the consequences of operating in increasingly regulated and trust-sensitive commerce workflows while still disclosing relatively little private operating data. The top risk is hidden model opacity around retention, concentration, and module economics. The next tier includes compliance and safety failures tied to seller content, payouts, or agentic-commerce actions, and dependency risk across cloud, integrations, and payment partners. Mirakl appears more institutionally prepared than many peers, but the company is also choosing to expand into riskier adjacencies — which raises the importance of deep diligence on controls, incidents, and commercial concentration.
sections:
- id: regulatory-and-legal-risk
  title: Regulatory and legal risk
  body: 'Mirakl sits directly in the blast radius of platform regulation. Its customers operate marketplaces, seller ecosystems, catalogs, payouts, and increasingly AI-moderated or agentic buying flows — exactly the areas where Europe and other jurisdictions are tightening rules. The Digital Services Act raises diligence expectations around illegal products and platform integrity, DAC7 imposes seller-reporting duties, and payment rules such as PSD2 matter wherever marketplace payouts or agentic transactions cross into regulated payment behavior. Mirakl’s own product roadmap now explicitly references this pressure through Trust & Safety and agentic-commerce governance language.


    The good news is that Mirakl appears more legally mature than an early-stage startup. The privacy policy, legal center, and DPA collectively show a more developed contractual and data-protection posture than many private software companies. The bad news is that legal maturity does not remove the operating burden: product, compliance, moderation, and customer-success teams still have to turn those legal obligations into repeatable workflows in live customer environments.'
