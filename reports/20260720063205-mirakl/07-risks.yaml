- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Hidden retention / concentration risk
    - Renewal performance at top accounts
    - Two or more flagship renewals shrink materially or large customers stall on adjacencies
    - Pause valuation stretch and re-underwrite customer economics.
  - - Compliance / moderation risk
    - Material public incident involving illegal products or content governance
    - Major operator incident, enforcement action, or customer suspension tied to Mirakl workflows
    - Escalate to legal / product review; treat as thesis-break candidate.
  - - Agentic commerce safety risk
    - AI-agent payment or order failure
    - Publicized unauthorized transaction, prompt-injection exploit, or beta rollback
    - Treat Nexus upside as impaired until controls proven.
  - - Dependency risk
    - Partner or cloud disruption with customer impact
    - Extended outage, payment-partner issue, or integration failure affecting flagship customers
    - Reassess resilience claims and SLA exposure.
  - - Execution sprawl
    - Adjacency uptake stalls while complexity rises
    - New modules show weak attach and high support load
    - Refocus thesis on core platform only, with lower valuation tolerance.
  notes: The kill criteria focus on observable events that would change the investment thesis, not just generic software worries.
