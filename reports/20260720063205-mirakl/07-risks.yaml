- id: operational-security-and-ai-risk
  title: Operational, security, and AI risk
  body: 'Mirakl’s core platform looks operationally serious, but that raises rather than lowers the standard it must meet. A company claiming multi-cloud redundancy, 99.997% uptime, and enterprise-grade controls is implicitly promising customers that its software can sit inside critical commerce operations without interruption. Certifications and the CSA STAR listing are helpful trust signals, and the Cyber Week traffic proof is encouraging. But cyber and reliability failures rarely arrive as clean refutations of a marketing claim; they arrive through misconfigurations, identity-policy gaps, SaaS role mistakes, vendor sprawl, and data leakage at the edges of a complex stack.


    AI creates another layer of risk. Adversa’s incident catalog makes clear that prompt injection, unsafe agent behavior, and action-oriented AI failures are already causing real losses. Mirakl’s push into Nexus and Trust & Safety is strategically sensible, but it means the company must manage not just catalog correctness, but also the governance of autonomous or semi-autonomous commerce actions. In other words, Mirakl is moving from marketplace infrastructure into decision-bearing infrastructure.'
