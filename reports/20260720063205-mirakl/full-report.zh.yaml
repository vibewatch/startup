  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界，以及 Mirakl 真正在卖什么
        blocks:
          - type: paragraph
            body: >-
              Mirakl 常被放在巨大的电商或 B2B 交易市场里描述，但这些总量夸大了基础设施供应商能直接变现的收入池。公司向市场平台运营方销售软件和工作流编排；它并不拥有流经这些运营方的
              GMV。因此，最相关的视角是企业级市场平台软件层：卖家接入、品类扩张、目录标准化、打款编排、运营工具，以及越来越多的零售媒体和 AI 分发。更宽泛的电商平台研究适合作为背景，因为企业买家确实会把 Mirakl 与
              VTEX、Adobe、Shopify、Salesforce 和可组合技术栈比较，但 Mirakl 的可服务收入池只是更大平台市场的一个子集。


              市场规模证据同时确认了机会和模糊性。广义电商平台市场如今是一个个位数十亿美元到十几亿美元级别的软件品类，而 B2B 电商交易额估计值达到数十万亿美元。两者之间，才是更直接相关的 B2B
              市场平台软件细分市场——足够大，值得关注，但远小于 GMV 标题数字。正确的承销框架因此不是问 Mirakl 能否以某个固定比例变现所有市场平台交易价值，而是问，当平台运营方采用第三方品类供给时，Mirakl
              能否在企业市场平台软件预算中拿下持久份额。
