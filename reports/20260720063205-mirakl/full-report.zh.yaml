  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与品类结构
        blocks:
          - type: paragraph
            body: >-
              Mirakl
              并不在一条清晰赛道里竞争。公司的原始市场是企业级市场平台赋能，但今天的有效竞争集合至少横跨四类：一体化电商套件（VTEX、Shopify、Adobe、Salesforce）、可组合与无头架构挑战者（commercetools、Spryker）、市场平台专家（Marketplacer），以及大型电商网络或点状解决方案供应商（Rithum、Feedonomics、Topsort）。这个广度很重要，因为买家通常是在选择架构，而不只是功能。零售商在
              Mirakl 与 Shopify 或 Adobe 之间选择时，也是在决定自己想要一个专门的市场平台控制点，还是一个更广的操作系统，再在其中叠加市场平台能力。


              最清晰的定位是：Mirakl 是一个市场平台运营方专家，正在向相邻预算扩张。它仍靠帮助企业治理第三方卖家、执行目录和绩效规则、规模化运行市场平台工作流来取胜。但
              Ads、Connect、Payout、Catalog Platform 和 Nexus
              等产品扩张，意味着公司现在会在更多采购中心碰到更多供应商。结果是，市场中的直接竞争对手不再主要由行业标签区分，而是由它们试图拥有电商技术栈的多少来区分。
