      - number: '6.3'
        title: 评价信号、留存与扩张逻辑
        blocks:
          - type: paragraph
            body: >-
              独立评价信号方向积极，但并非决定性。Gartner Peer Insights 强调稳定性和目录管理优势，G2
              则同时包含对集成的赞扬，以及对可用性或集成痛点的警告。对企业基础设施软件来说，这种组合合理：强运营深度往往伴随流程复杂度。FeaturedCustomers 和评价聚合器进一步显示 Mirakl
              已建立起合理的公开证据基础，但它们不能替代续约数据。


              公开证据在扩张上远强于留存。案例研究显示，运营方会随着时间增加更多品牌、更多卖家、更多 SKU、新品类或更深运营集成。但没有找到公开
              NRR、GRR、客户流失率或合同期限披露。因此，客户故事在理论上看起来粘性强、可扩张，却仍缺少能定量证明耐久性的指标。评价证据适合用来补足满意度和部署复杂度的纹理，但不足以独立量化续约概率或净留存。
