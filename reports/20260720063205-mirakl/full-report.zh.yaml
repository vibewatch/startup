companyProfile:
  summary: >-
    Mirakl 是一家法国企业电商软件公司，由 Philippe Corrot 和 Adrien Nussenbaum 于 2012 年创立，帮助零售商和 B2B
    公司上线并运营第三方市场平台、一件代发项目、卖家支付、供应商目录工作流、零售媒体项目，以及更新的智能体电商入口。公开证据支持的是实打实的规模，而不是狭窄细分市场：公司披露 2025 年 ARR 为 $218
    million，并实现集团层面盈利；公司称其支持 450+ 个市场平台和 100,000+ 名卖家，最近一次公开披露的私营估值仍高于 $3.5 billion。核心尽调问题不是 Mirakl
    是否有产品市场匹配，而是在公开可比公司估值压缩、且缺少经审计留存率、利润率和股权结构数据的情况下，这个可见私营估值是否仍有上行空间。
