  - id: TM001
    title: 市场定义表
    columns:
      - 维度
      - 纳入
      - 排除
      - 重要性
    rows:
      - - 核心市场
        - 企业级交易市场和代发货软件
        - 交易总额本身
        - Mirakl 变现的是软件预算，不是客户流转的全部 GMV。
      - - 主要买方
        - 启动第三方渠道的零售商、分销商、制造商
        - SMB 单店商户
        - 实施复杂度和销售周期会随买方规模显著变化。
      - - 相邻模块
        - 目录接入、分账、零售媒体、卖家分发、AI 发现
        - 没有交易市场工作流所有权的纯支付处理或广告网络
        - 相邻业务扩大钱包份额，也防守核心平台。
      - - 主要替代方案
        - 第一方电商、内部自建、可组合技术栈
        - Amazon 这类消费者交易市场运营商
        - 客户采购前会比较自建与购买、套件与专业工具。
      - - 经济单位
        - 软件 ACV / ARR
        - 全部交易市场 GMV 的百分比
        - 只用 GMV 总量会夸大感知 TAM。
    notes: 把软件预算视角与交易量视角分开，这是做出合理 TAM 判断的关键。
