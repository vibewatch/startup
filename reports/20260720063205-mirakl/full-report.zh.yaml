      - number: '8.3'
        title: 投资逻辑、反向逻辑与情景视角
        blocks:
          - type: paragraph
            body: >-
              正向投资逻辑很直接。Mirakl 是定义品类的企业级交易市场平台，作为私营公司，公开证据异常强：公司已盈利，拥有大型且可识别的客户，超过 35 个客户的年交易市场 GMV 已超过 $100
              million，Connect 和 Ads 等新业务也足够真实，说明公司可以在历史核心之外变现。如果这些相邻业务放大，而且智能体电商 层最终从叙事变成付费基础设施，Mirakl 有理由守住溢价结局。


              反向逻辑同样具体。公开证据仍回答不了溢价私募价格下最决定回报的问题：NRR、流失率、客户集中度、毛利率、自由现金流、债务动用情况，以及真实的优先股堆叠。另一个问题是，最新叙事层——Nexus
              和智能体电商——战略上有意思，但还没有被证明能显著拉动 ARR。上述组合更适合做情景承销，而不是精确估值。TV003 和 FV003
              把重心放在最后一次头条估值之下；只有盈利能力和附加模块渗透率继续提升、披露质量接近上市公司标准，乐观情景才站得住。
