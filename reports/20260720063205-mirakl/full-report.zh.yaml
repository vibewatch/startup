      - number: '8.2'
        title: 上市可比公司区间及其对 Mirakl 的含义
        blocks:
          - type: paragraph
            body: >-
              上市可比公司之所以有用，恰恰因为它让估值显得不舒服。2026 年 7 月，Shopify 的市值 / 收入约 13x，仍享有溢价，因为投资人把它视为大型、高质量且盈利的 电商平台。VTEX 和
              BigCommerce 低得多，分别约 3.1x 和 1.15x；它们的公开披露更容易让市场看到增长放缓、平台宽度更窄，或对长期利润率能力信心更低。因此，Mirakl 最后披露的私募价格约为 16.1x
              ARR，并不只是高于中腰部上市可比公司；它已经落在最强上市电商平台附近，却披露少得多，也没有流动性。


              这不等于 Mirakl 的估值锚点不可能成立。ARR 可以比 GAAP 收入享受溢价，Mirakl 在企业级交易市场
              的领导地位、盈利能力和相邻业务，也让它的定性故事好过最低倍数公司。但可比公司区间让一个结论躲不开：支撑溢价估值的证据负担在 Mirakl 一侧。TV004 和 FV002
              用当前可比公司数据说明，即便倍数只小幅变化，企业价值也会明显波动；因此，这里的入场纪律比泛泛欣赏公司更重要。
