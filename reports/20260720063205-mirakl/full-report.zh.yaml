chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品边界与当前规模
        blocks:
          - type: paragraph
            body: >-
              Mirakl 是一家企业电商基础设施公司，建立在一个简单判断上：大型零售商、分销商和品牌越来越需要用市场平台式的品类扩张扩大供给，但不想自己持有所有库存。公司由 Philippe Corrot 和 Adrien
              Nussenbaum 于 2012 年在 SplitGames 经历之后创立，如今把自己定位为「智能商业的操作系统」。这个叙事已经比最初的市场平台逻辑更宽：Mirakl
              仍以第三方市场平台和一件代发运营为锚，但在核心平台之上叠加了目录接入、卖家打款、零售媒体、多渠道卖家工具，以及智能体电商基础设施。Boston/Paris 双总部和全球化领导层也说明，Mirakl
              按跨大西洋成长期公司运作，而不是一家只服务法国市场的 SaaS 供应商。


              规模主张很重要，也大多来自公司自身。Mirakl 称其服务 450+ 家企业客户，并连接超过 100,000 个品牌和卖家；这些数字在 2025
              年业绩发布、公司简介页和相邻产品页面中保持一致。公开客户证据也显示，该平台已经深度嵌入大型零售商的运营模型：Macy’s 在第一年借助 Mirakl 增加了 220,000+ 个市场平台 SKU，Best
              Buy、Lowe’s 和 Ulta 也都在 2025 年基于 Mirakl 上线或扩张市场平台项目。对后文最重要的结论是，Mirakl
              已不再只是市场平台赋能供应商；它正试图成为企业运营方和卖家的更广义电商控制平面。
