        title: 单位经济、成本结构与同业基准
        blocks:
          - type: paragraph
            body: >-
              Mirakl 的单位经济仍大多是私有信息。公开材料没有披露毛利率、服务毛利率、CAC、回本周期、NRR、GRR 或客户集中度。这意味着投资团队无法回答基本承销问题：增量 GMV
              或模块挂载能创造多少毛利，新客户能否在合理周期内回本，业务对大型扩张合同的依赖有多高。公开条件下，最好的答案是用公开电商同业做方向性基准，而不是把它们当作公司数据的替代品。


              这些同业显示，企业电商可以扩展成很大的收入基数，但模型在运营上仍然吃力。销售、合作伙伴生态、产品 R&D 和全球支持都很重要。对 Mirakl
              来说，含义是：已报告盈利能力很有意义，但如果没有收入结构和利润率背景，仍不完整。如果 Ads、Connect 和 Catalog Platform
              是高挂载、软件化的扩张，盈利路径会更有吸引力；如果它们带有很重的实施或支持成本，收入质量就没有 ARR 单独显示的那么有说服力。
