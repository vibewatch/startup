  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与买方 / 用户图谱
        blocks:
          - type: paragraph
            body: >-
              Mirakl
              卖给企业运营方，而不是终端消费者。经济买家通常是零售商、分销商或其他企业内部的市场平台、电商、商品运营、数字或采购负责人，他们希望不增加库存也能扩展品类或供应商触达。用户图谱随后变宽：市场平台运营团队、卖家接入团队、目录团队、财务团队，以及越来越多通过
              Connect 或 Catalog Platform 接入的供应商和卖家侧用户。这让 Mirakl 不像单席位 SaaS 工具，更像横跨多个内部团队的共享运营基础设施。


              公开客户基础也宽到足以说明问题。Mirakl 官方材料指向 450+ 个市场平台和 100,000+ 名卖家，Landbase 和 Apps Run The World
              等外部数据集则指向数百家公司和许多大型企业名称。这两种视角并不完全可比，但合在一起支持一个结论：Mirakl 在零售和 B2B 分销领域已经拥有真实的企业采用。
