      - number: '1.4'
        title: 里程碑、客户证据与重要保留
        blocks:
          - type: paragraph
            body: >-
              Mirakl 的里程碑节奏显示，公司在市场平台运营找到匹配之后，持续拓宽产品覆盖面。公司简介页给出时间线：2013 年推出首个一件代发平台，2014 年推出首个 B2B 市场平台，2015
              年设立美国办公室，2019 年推出 Mirakl Connect，2022 年推出 Payout 并收购 Octobat，2023 年推出 Ads，2024 年收购 Adspert，2025 年推出
              Nexus。2024 年和 2025 年业绩发布进一步补足了这幅图：Connect 在不到一年内达到 $11.7 million ARR；Ads 在 2024 年增长 >100% 后，2025 年广告花费达到
              $12.7 million；2026 年 5 月 Trust & Safety 上线，也把产品路线图直接连到监管合规。客户证据很强，因为它横跨多种零售业态，并给出可量化结果，而不只是客户标识页。


              主要保留是范围扩张和平台复杂度。Mirakl 的乐观叙事是，相邻模块会加深护城河并提高钱包份额。怀疑叙事——在竞争对手导向评论中最清楚——则认为 Mirakl
              仍是专门的市场平台层，运营方仍要在别处集成前端店面、CMS、ERP 和订单管理系统。这个批评并不推翻产品市场匹配，但对尽调很重要：Mirakl
              的差异化取决于继续成为复杂市场平台的最佳中立编排方，而不是在可组合技术栈里沦为又一个昂贵集成层。
