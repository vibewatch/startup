      - number: '2.2'
        title: 品类为什么在扩张
        blocks:
          - type: paragraph
            body: >-
              需求逻辑建立在渠道经济性和买方行为上。Swell、Accio 以及 Mirakl 相邻研究的独立数据点都指向同一方向：市场平台正在拿走数字商业中更大的份额，B2B
              买家的行为越来越像消费者，运营方也需要更宽的品类，但不想自己背全部库存。如果目前只有一小部分企业在运营市场平台，跑道仍然很长。这对 Mirakl
              尤其重要，因为它最好的客户是那些试图守住搜索可见性、价格广度和长尾品类，以对抗 Amazon、Alibaba 和垂直品类专家的既有企业。


              最强的结构性驱动来自数字自助、移动使用、跨境购物和 AI 驱动的商品运营。B2B
              买家越来越希望即时发现产品、在线获得协商价格，并完成无需销售代表介入的交易。运营方则希望通过第三方卖家实现轻资本增长，并增加零售媒体等新的变现杠杆。Mirakl 的相邻模块正好对应这些需求驱动：Connect
              帮助卖家跨渠道分发，Catalog Platform 解决供应商数据瓶颈，Ads 变现流量，Nexus 和智能体工具则试图让商家在 AI 介导的发现中保持可见。这个市场不只是交易量在增长，功能边界也在变宽。
