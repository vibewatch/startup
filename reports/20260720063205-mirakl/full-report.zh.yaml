        title: 专家、网络与相邻压力
        blocks:
          - type: paragraph
            body: >-
              Mirakl 还面临来自纸面上并不完全相似的供应商压力。Marketplacer 作为市场平台覆盖层竞争，服务那些想扩展品类但不想全面重建平台的运营方。Rithum
              在商品刊登、库存、一件代发和零售媒体上以网络规模竞争，尤其面向已经跨多渠道销售的品牌和零售商。Feedonomics 和 Topsort 竞争的层更窄——分发和变现——但这些层很重要，因为它们正是 Mirakl
              想扩张钱包份额的地方。


              这就是 Mirakl 新模块具有战略意义的原因。如果 Ads、Connect 和智能体电商工具只是有用的附加件，相邻专家可以摘走这些预算，把 Mirakl
              困在增长较慢的核心里。若这些模块深度嵌入运营方工作流，它们会提高切换成本，让 Mirakl 更难被替换。这组权衡是报告后文的核心问题之一。
