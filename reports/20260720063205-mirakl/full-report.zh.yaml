  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: Mirakl 已有真实规模和盈利证明，但披露与价格支撑仍不完整，所以结论落在观察。
    data:
      nodes:
        - id: scale
          label: 规模化业务资产
          detail: 450+ 个市场平台、100k+ 名卖家，以及企业级市场平台领导地位。
        - id: profit
          label: 盈利证明
          detail: 2024 年核心业务 EBITDA 转正，2025 年集团盈利。
        - id: premium
          label: 溢价倍数逻辑
          detail: 业务质量和相邻模块可支撑相对较弱上市可比公司的溢价。
        - id: gap
          label: 披露缺口
          detail: 未公开 NRR、GM、FCF、集中度或优先股堆叠细节。
        - id: price
          label: 当前估值标记
          detail: 上次披露 $3.5B 估值对应 ~16.1x ARR。
        - id: rec
          label: 观察建议
          detail: 公司质量真实，但在可见估值标记下，上行空间不明显。
      edges:
        - from: scale
          to: profit
          label: 支撑质量叙事
        - from: profit
          to: premium
          label: 帮助支撑溢价
        - from: gap
          to: price
          label: 限制确信度
        - from: premium
          to: price
          label: 支撑上沿区间
        - from: price
          to: rec
          label: 看起来偏满
        - from: gap
          to: rec
          label: 维持观察结论
    approximationNotes: 该流程是定性判断；一旦私有指标和条款披露，应由完整 IC 模型替代。
    claimRefs:
      - CV002
      - CV009
      - CV010
      - CV011
      - CV021
      - CV035
      - CV038
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 按当前 ARR 计，倍数小幅变化就会让 Mirakl 隐含股权价值移动数亿美元。
    data:
      items:
        - label: 8x ARR
          value: 1744
          note: 单位为 USD millions，基于 $218M ARR。
        - label: 10x ARR
          value: 2180
          note: 单位为 USD millions，基于 $218M ARR。
        - label: 12x ARR
          value: 2616
          note: 单位为 USD millions，基于 $218M ARR。
        - label: 14x ARR
          value: 3052
          note: 单位为 USD millions，基于 $218M ARR。
        - label: 16x ARR
          value: 3488
          note: USD millions；接近上次公开估值标记。
        - label: 18x ARR
          value: 3924
          note: USD millions；需要相信其软件质量处于上沿。
    approximationNotes: 数值只是以已披露 2025 ARR 为基数的 ARR 倍数输出；不是从 EV 调整到股权价值的计算。
    claimRefs:
      - CV002
      - CV009
      - CV019
      - CV030
      - CV031
      - CV032
      - CV033
      - CV034
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 情景区间中心略低于上次公开估值标记，下行重置风险仍有分量。
    data:
      items:
        - label: 悲观
          low: 2
          mid: 2.35
          high: 2.7
          note: USD billions；增长放缓或价格发现不利。
        - label: 基准
          low: 2.6
          mid: 2.95
          high: 3.3
          note: USD billions；执行稳健，但没有上市公司式披露溢价。
        - label: 乐观
          low: 3.3
          mid: 3.6
          high: 3.9
          note: USD billions；软件质量证明具备溢价，且相邻业务放量。
        - label: 上次披露估值标记
          low: 3.5
          mid: 3.5
          high: 3.5
          note: USD billions；2021 年 9 月公开估值锚。
    approximationNotes: 区间只是基于公开证据的简单情景，不是 DCF，也不是按权利调整的交易模型。
    claimRefs:
      - CV004
      - CV031
      - CV032
      - CV033
      - CV034
      - CV038
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 评分卡最强项是业务资产质量，最弱项是估值吸引力和证据完整度。
    data:
      items:
        - label: 市场证明
          value: High
          note: Mirakl 是企业级市场平台的真实类别领导者。
          score: 8
        - label: 客户证明
          value: High
          note: 庞大的市场平台基础和 35+ 个 $100M-GMV 客户支撑其深度。
          score: 8
        - label: 经济性可见度
          value: Medium
          note: ARR 和盈利能力可见，但留存和毛利率不可见。
          score: 6
        - label: 风险负荷
          value: Medium-low
          note: 晚期私募入场时，估值重置风险和披露风险都不轻。
          score: 4
        - label: 估值吸引力
          value: Low-medium
          note: 按现有公开证据看，公开可见的 $3.5B 估值标记已经偏满。
          score: 4
        - label: 证据质量
          value: Medium
          note: 证据质量好过许多私营同业，但距离买入级定价仍不够。
          score: 5
    approximationNotes: 评分是基于公开证据给出的 1-10 分尽调判断，不是统计输出。
    claimRefs:
      - CV010
      - CV011
      - CV021
      - CV023
      - CV026
      - CV035
      - CV036
      - CV037
      - CV038
