            body: >-
              让 Mirakl 可信的企业聚焦，也制造了盲点。一家向大型运营方销售复杂大部署的公司，合同质量可能很好，但如果少数大客户贡献了大部分 ARR 或 GMV，仍可能存在隐藏集中度风险。公开证据无法为 Mirakl
              回答这个问题。公开证据也无法显示，是否有任何超大型客户正处在续约窗口、强势谈判或延后扩张模块采购。


              正确结论是，Mirakl
              的客户基础真实、企业级，且在运营上有意义。相比许多私营软件公司，它有更好的具名证据。但从承销视角看，本章仍以缺失的账户级留存和集中度数据收尾，而这些只能由内部报告回答。这意味着，投资者可以确信 Mirakl
              有真实客户和真实生产使用，却仍无法判断未来增长是否广泛分布于各队列，还是过度依赖一小组旗舰客户。
