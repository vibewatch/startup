            body: >-
              对一家晚期私营公司来说，Mirakl 的公开牵引力异常强。公司披露 2024 年 ARR 为 $177 million、GMV 为 $11.2 billion，并实现 EBITDA 盈利；随后披露 2025 年
              ARR 为 $218 million、GMV 为 $14.6 billion，并实现集团层面盈利。Digital Commerce 360 和 Sacra
              都佐证了这些数字的核心方向。这并不能消除报告风险，但确实让 Mirakl 比那些只发布模糊客户数或未署名「三位数增长」表述的私营同行更容易承销。


              更深的问题是增长质量。ARR 和 GMV 同步上升，同时盈利能力改善，这是积极信号。但增长节奏也说明，Mirakl 已经走出 2021
              年融资环境下的阶段。这本身不是负面；它只意味着，投资案例现在更依赖持久模块挂载、利润率和留存质量，而不只是标题级品类创造。
