        blocks:
          - type: paragraph
            body: >-
              Mirakl 并非毫无防御地暴露在这些风险之下。Trust & Safety、隐私和 DPA
              框架、安全认证、已发布控制，以及旺季韧性，都提供了有意义的缓释。平台看起来比许多私营同行更具制度化准备。即便如此，最危险的风险是公开证据无法关闭的风险。留存、集中度和模块经济不透明，仍是最清楚的隐藏模型风险；合规和
              AI 智能体安全，仍是最清楚的运营风险；依赖复杂度，则是事故传导到收入或估值损害的最清楚通道。


              这给投资委员会留下的是中高残余风险图景。公司并非大喊「脆弱」，但它正在进入监管更重、对安全更敏感的工作流，同时仍要求外部人接受相当程度的私营信息不对称。实践中，这意味着尽调不应聚焦泛泛的软件风险，而应聚焦会打破投资逻辑的具体事件：重大合规事故、AI
