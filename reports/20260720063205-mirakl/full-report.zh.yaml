  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Mirakl 正位于平台监管的冲击半径内。它的客户运营市场平台、卖家生态、目录、打款，以及越来越多由 AI 审核或智能体驱动的购买流——这些正是欧洲和其他司法辖区收紧规则的区域。Digital Services
              Act 提高了围绕非法商品和平台完整性的尽调预期，DAC7 施加卖家报告义务，PSD2 等支付规则则在市场平台打款或智能体交易进入受监管支付行为时变得重要。Mirakl 自身产品路线图现在也通过 Trust &
              Safety 和智能体电商治理语言，明确回应了这种压力。


              好消息是，Mirakl 看起来比早期创业公司更具法律成熟度。隐私政策、法律中心和 DPA
              合在一起，显示其合同和数据保护姿态比许多私营软件公司更成熟。坏消息是，法律成熟度并不会移除运营负担：产品、合规、审核和客户成功团队仍要把这些法律义务转化为真实客户环境中的可重复工作流。
