  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前定价背景，以及为什么倍数纪律重要
        blocks:
          - type: paragraph
            body: >-
              进入估值章节，Mirakl 同时摆着两个看似矛盾的事实。第一，公司真实且已有规模：2024 年披露 ARR 为 $177 million、EBITDA 转正，2025 年 ARR 升至 $218
              million、集团层面实现盈利，同时支撑 450+ 个交易市场和超过 100,000 名卖家。第二，市场能广泛看到的唯一股权估值锚点，仍是 2021 年 9 月 Series E；当时公司估值超过 $3.5
              billion。因此，承销问题不是 Mirakl 是不是一家优质公司，而是分母变大、上市电商平台倍数重置之后，四年前的私募头条价格还剩多少上行空间。


              倍数本身已经回答了一部分问题。旧估值锚点已从 2021 年极端的私募倍数，压缩到约 19.8x 2024 年 ARR、约 16.1x 2025 年 ARR；Mirakl
              确实用增长消化了价格。但消化估值，不等于创造了新的折价。公开证据仍没有披露 ARR 的真实质量、背后的毛利率，也没有披露决定新投资人实际拿到什么的资本结构条款。因此，TV001 和 TV002
              给出的是观察建议，不是买入判断；FV001 则说明规模、盈利能力和披露缺口如何互相作用。
