  - id: TM004
    title: 增长驱动与约束表
    columns:
      - 因素
      - 驱动因素或约束
      - 证据
      - 对 Mirakl 的含义
    rows:
      - - 交易市场份额提升
        - 驱动因素
        - 平台型电商渠道正贡献越来越多的电商增长和支出。
        - 支撑企业继续关注平台型电商模式。
      - - B2B 自助采购转向
        - 驱动因素
        - 千禧一代采购人偏好少接触销售代表，采购继续线上化。
        - 支撑 B2B 平台型电商扩张，也抬高审批工作流工具需求。
      - - 跨境电商
        - 驱动因素
        - 跨国采购和卖家触达继续增加。
        - 本地化和全球卖家网络能力因此更值钱。
      - - 零售媒体变现
        - 驱动因素
        - 流量变现正变成独立预算项。
        - 支撑 Mirakl Ads，也扩大客户支出份额。
      - - 网络安全与欺诈
        - 制约因素
        - 市场研究把骗局、欺诈和数据风险列为采用障碍。
        - 买家因此要求更高的信任、合规和运营控制。
      - - 遗留系统集成
        - 制约因素
        - 复杂运营方仍难把 ERP/PIM/OMS 接顺。
        - 拉长销售周期，也加重实施工作。
      - - 物流与库存准确性
        - 制约因素
        - 多供应商模式下，履约和库存复杂度会放大。
        - 买家更愿意选跑通过的编排方案，而不是自建。
      - - 套件与专门工具分流
        - 制约因素
        - 买家也可以转向集成电商套件或单点工具。
        - Mirakl 必须证明，额外引入一个平台层值得承受这份复杂度。
    notes: 把结构性需求驱动因素和买家推迟或收窄部署的主要原因并列呈现。
