      - - 乐观
        - 20%+ 增长延续，相邻业务放大，审计尽调支撑优质软件经济性
        - $3.3B-$3.9B；约为 ARR 的 15x-18x，接近或小幅高于上次估值
        - 相邻业务变现和披露质量可能改善不足
        - 需要硬证据，不能只靠品类叙事
    notes: 区间是以十亿美元计的方向性估值情景，不是谈判价格意见。
    claimRefs:
      - CV028
      - CV029
      - CV031
      - CV032
      - CV033
      - CV034
  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: sample
      basis: >-
        Decision-relevant July 2026 sample of public commerce-platform references and Mirakl’s last disclosed private
        mark for underwriting discipline.
    columns:
      - 可比对象
      - 指标基础
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Mirakl 上次披露估值
        - 2025 年 ARR 为 $218M，对比上次披露的 $3.5B 估值
        - ~16.1x ARR
        - 当前私募定价的直接锚点
        - 私募估值偏旧，缺少审计披露
      - - Shopify
        - 2026 年 7 月市值 / TTM 收入
        - ~13.0x
        - 高端上市商业平台质量基准
        - 平台更宽、具备公开市场流动性，披露更充分
      - - VTEX
        - 2026 年 7 月市值 / TTM 收入
        - ~3.1x
        - 方向上最接近的上市企业级商业软件
        - 覆盖面窄于 Mirakl，增长也更慢
      - - BigCommerce
        - 2026 年 7 月市值 / TTM 收入
        - ~1.15x
        - 较弱增长叙事下的下行上市基准
        - 转型修复因素使其成为偏苛刻的可比对象
      - - Mirakl 基准投资测算
        - 基于当前 ARR 的 12x-15x ARR
        - ~$2.6B-$3.3B
        - 若溢价有依据但不能无限外推，这是实际估值区间
        - 仍需对留存、利润率和条款做私下尽调
    notes: 部分样本用于决策；公开市场没有 Mirakl 的纯正可比公司。
    claimRefs:
      - CV009
      - CV012
      - CV014
      - CV016
      - CV019
      - CV020
      - CV030
      - CV032
  - id: TV005
    title: 打破投资逻辑和否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 新价格发现低于上一轮估值
        - 融资轮、要约收购或投资方意向明显低于 $3.0B
        - 表明外部买方不支持当前账面估值
        - 重新定价至悲观 / 基准区间，或避免入场
      - - 留存或集中度不达预期
        - NRR、GRR、流失率或头部客户集中度明显差于预期
        - 溢价倍数支撑立即削弱
        - 将建议转向继续研究 / 回避
      - - 利润率或现金转换不达预期
        - 毛利率、FCF 或债务使用情况差于软件叙事暗示
        - 盈利质量低于溢价情景要求
        - 压低倍数，并延长持有期假设
      - - 优先股堆叠悬顶
        - 高级清算优先权或附函使新资金处于劣后位置
        - 账面估值高估普通股经济性
        - 坚持修正条款或降低价格
      - - 相邻业务变现不达预期
        - Connect、Ads 或 Nexus 附加率太小，无法改变客户经济性
        - 乐观情景消失，上市公司可比上限开始约束估值
        - 只测算核心平台价值
    notes: 选择这些触发因素，是因为它们会影响已实现回报，而不是因为它们容易靠公开来源验证。
    claimRefs:
      - CV025
      - CV027
      - CV028
      - CV029
      - CV037
      - CV039
      - CV042
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - ARR / 收入桥接
        - 按产品线从 ARR 到确认收入的审计桥接
        - 决定 ARR 是否配得上溢价倍数
        - CFO / 审计工作底稿和月度董事会材料
      - - 留存和集中度
        - NRR、GRR、流失率、前 20 大客户和队列表现
        - 检验企业级市场平台合同的耐久性
        - 收入运营数据室和样本合同审阅
      - - 毛利率和现金转换
        - 按模块拆分的毛利率、服务负担、资本开支 / 云支出、FCF 和营运资本画像
        - 区分软件质量经济性和重交付经济性
        - 财务尽调和管理层问答
      - - 债务和流动性
        - 当前 RCF 提款、契约、到期结构和最低流动性要求
        - 改变下行风险和新增股权需求
        - 资金计划表和贷款文件
      - - 股权结构表 / 优先权
        - 完整优先股堆叠、附函、信息权和老股 / 新股比例
        - 将账面估值转化为真实入场经济性
        - 律师审阅章程、融资文件和附函
      - - 相邻业务变现
        - Connect、Ads 和 Nexus 的付费 ARR、附加率、续约和盈利能力
        - 决定乐观情景是真的，还是只是叙事外延
        - 产品 / CRO 尽调，并核对队列数据
    notes: 这些要求按它们对当前估值下投委会决策的直接影响排序。
    claimRefs:
      - CV022
      - CV026
      - CV028
      - CV040
      - CV041
      - CV042
