      - number: '1.3'
        title: 资本形成、估值与财务里程碑
        blocks:
          - type: paragraph
            body: >-
              Mirakl 的融资历程清晰对应了市场平台软件品类的崛起。Tracxn 和 Clay 都显示，公司从 2012 年小规模 Series A 起步，随后是 2015 年 $20 million Series
              B、2019 年 $70 million Series C、2020 年 $300 million Series D、2021 年 $555 million Series E，以及 2023 年 €100
              million 循环信贷额度。Series E 仍是标准估值锚点：估值超过 $3.5 billion，由 Silver Lake 领投，83North、Elaia、Felix Capital 和 Permira
              等既有投资者跟投。仅按已披露股权融资，Mirakl 已融资约 $948 million；若计入 2023 年债务，披露资本总额约为 $1.06–1.1 billion，具体取决于汇率折算和数据供应商取整。


              2021 年融资高峰后，Mirakl 的财务运营叙事明显改善。公司披露 2024 年 ARR 为 $177 million、GMV 为 $11.2 billion，历史核心平台实现 EBITDA
              为正。随后公司披露 2025 年 ARR 为 $218 million、GMV 为 $14.6 billion，并实现集团层面全面盈利。对于一家私营、垂直化企业 SaaS
              平台来说，这些绝对数字很强。它们也意味着，Mirakl 的增长快于许多更宽泛的电商同行，同时仍背着一个更早的估值锚。基本面改善但价格发现陈旧——这个组合正是估值纪律在报告后文成为核心议题的原因。
