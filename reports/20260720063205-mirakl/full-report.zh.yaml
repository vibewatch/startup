        title: 资本充足性与财务判断
        blocks:
          - type: paragraph
            body: >-
              Mirakl 的资本叙事已经改善。2021 年 Series E 注入 $555 million，2023 年循环信贷额度又增加了 €100 million 可选流动性。到 2025
              年，公司称其已实现集团层面盈利。合在一起，这些事实意味着，与许多同等规模的私营软件公司相比，Mirakl 对即时一级市场融资的依赖更低。在高利率、私募资本更挑剔的环境里，这在战略上和财务上都很有价值。


              但资本图景仍未被完全承销。公开信息没有现金余额，没有循环额度提款细节，没有自由现金流披露，也看不到历轮融资的清算优先权。对成长期投资者来说，这意味着当前业务看起来财务上可信，但透明度还不足以支持不计价格地买入。正确解读是：「融资风险低于平均水平，但信息风险仍然显著。」
