      - number: '7.2'
        title: 运营、安全与 AI 风险
        blocks:
          - type: paragraph
            body: >-
              Mirakl 的核心平台看起来在运营上很严肃，但这不是降低标准，而是抬高标准。一家公司宣称多云冗余、99.997% uptime 和企业级控制，实际上是在向客户承诺：其软件可以无中断地嵌入关键电商运营。认证和
              CSA STAR 列名是有用的信任信号，Cyber Week 流量证据也令人鼓舞。但网络安全和可靠性故障很少以干净推翻营销主张的方式出现；它们通常从复杂技术栈边缘的配置错误、身份策略缺口、SaaS
              角色错误、供应商蔓延和数据泄露中冒出来。


              AI 又增加了一层风险。Adversa 的事故目录清楚显示，提示注入、不安全智能体行为和行动导向 AI 失败已经造成真实损失。Mirakl 推进 Nexus 和 Trust & Safety
              在战略上合理，但也意味着公司必须管理的不只是目录正确性，还包括自治或半自治商业动作的治理。换句话说，Mirakl 正从市场平台基础设施进入承载决策的基础设施。
