      - number: '8.4'
        title: 退出准备度、终止触发点与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              相比许多后期私营软件公司，Mirakl 离退出准备更近，因为它已经发布了真实的 ARR、GMV
              和盈利信号。即便如此，仅凭公开证据，还不足以给出有信心的买入建议。上市公司和财务赞助方可比交易都呈现同一模式：只有披露足够支撑利润率、增长耐久性和现金转化时，投资人才愿意为质量付高价。Mirakl
              还没有提供这一级别的证据。2021 年以来缺少新的价格发现事件，也让下一轮融资、老股要约 或退出进程更重要；它会揭示外部买家是否仍支持那个头条估值。


              因此，最终建议对价格和证据都敏感。买方不应主要靠品牌、品类创建或 AI 叙事来承销上行。TV005 和 TV006 的工作清单很具体：在把最后一次公开估值锚点视为可投资之前，先核验经审计的 ARR
              桥接表、留存、利润率、集中度、债务使用情况和完整清算优先权堆叠。如果这些检查结果强，建议可以上调；如果结果令人失望，下行重置会来得很快。这个不对称性，正是本章停在观察而不是买入的核心原因。
