      - number: '3.2'
        title: 一体化套件与可组合挑战者
        blocks:
          - type: paragraph
            body: >-
              套件竞争对手卖的是简化。VTEX 面向全球数千家门店和客户，营销一套覆盖电商、市场平台、OMS 和零售媒体的统一技术栈。Shopify 卖全球铺开、全渠道、批发和 TCO 效率，Adobe 与
              Salesforce 则强调与更广的电商、数据和客户关系系统集成。实际竞争中，这些平台靠减少大型运营方必须协调的供应商数量来取胜。对更在意快速统一，而不是最深市场平台能力的团队来说，这尤其有吸引力。


              可组合挑战者卖的是灵活性。commercetools 和 Spryker 都把未来描绘成模块化、无头架构和 API
              优先。它们的主张是，如果运营方能组装自己想要的精确技术栈，就不该接受僵硬的市场平台模型。当市场平台工作流在客户之间越来越相似，且
              AI、零售媒体和数据编排可以从外部接入时，这些供应商的威胁会增强。反过来，当卖家治理、合规和市场平台特有运营细节成为真正瓶颈时，它们的威胁会降低。
