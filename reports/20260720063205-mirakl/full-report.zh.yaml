              路线图叙事有吸引力，但成熟度不均。Trust & Safety 和 Nexus 都针对真实市场平台问题：在监管收紧下审核越来越大的目录，并让目录和结账流为 AI 智能体驱动的商业做准备。J.P. Morgan
              合作尤其有用，因为它显示 Mirakl 试图解决的不只是发现环节，还包括智能体电商所需的安全交易层。这是产品从运营方工具向未来商业基础设施的雄心扩展。


              同时，这些新产品也提高了依赖复杂度。Mirakl
              依赖云提供商、企业连接器、外部支付基础设施，以及客户采用新工作流的准备度。核心平台看起来强且久经实战。尽调要回答的问题是，新产品叙事中有多少已经可以变现且可重复，又有多少仍是路线图式定位，仍依赖合作伙伴执行和客户实验；这个差别很关键。
