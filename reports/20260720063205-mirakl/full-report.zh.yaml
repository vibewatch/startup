              Mirakl 的风险分散在多重依赖上。公司依赖云提供商、客户系统集成、卖家和供应商数据质量、支付合作伙伴，以及企业客户在其工具之上运行良好治理流程的能力。J.P. Morgan
              关系同时体现了上行和依赖问题：Mirakl 可以通过与全球支付机构合作，加速智能体电商就绪，但也把部分承诺绑定到另一家公司的欺诈控制、交易基础设施和路线图节奏上。


              执行风险还会进一步上升，因为 Mirakl 同时向多个方向扩张。核心市场平台运营已经成熟，但 Ads、Connect、Payout、Trust & Safety 和 Nexus 分别增加了新的
              GTM、产品和支持要求。客户评价显示，该平台可以稳定且功能丰富，同时仍然复杂，难以集成和运营。这种组合让执行风险不再只是代码质量问题，而是 Mirakl 能否在产品覆盖面扩大时保持整个运营模型一致。
