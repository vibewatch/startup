      - number: '2.3'
        title: 谁购买、谁使用，以及他们需要什么
        blocks:
          - type: paragraph
            body: >-
              购买市场平台软件的企业买家，很少是在找通用网店搭建器。典型 Mirakl 客户是零售商、分销商或制造商：它们已经有前端店面，需要增加第三方品类、一件代发或 B2B
              市场平台功能，但不想重建整套技术栈。这解释了为什么 VTEX、Adobe、Shopify、BigCommerce 和 commercetools
              的官方竞争信息都会收敛到类似评估标准：全渠道运营、广泛集成能力、本地化、B2B 能力、性能和 AI 可扩展性。市场越来越由一个问题定义：供应商能否干净地嵌入更大的电商架构。


              这种采购逻辑也塑造了用户画像。市场平台运营、商品运营、供应商接入、支付、财务、卖家成功和零售媒体团队都会接触系统，因此实施不是纯 IT
              决策，而是跨职能决策。预算负责人通常在数字商业或转型职能里，但只有目录、结账、卖家合规和营销工作流都改善，平台才会真正留住。Mirakl
              最适合那些复杂组织：品类广度、卖家治理和多团队工作流的重要性，超过快速搭建基础前端店面。
