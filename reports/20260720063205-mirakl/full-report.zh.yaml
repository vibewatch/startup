      - number: '5.3'
        title: 安全、合规与可靠性控制
        blocks:
          - type: paragraph
            body: >-
              Mirakl 的安全和合规姿态，是产品案例中公开最可验证的部分之一。技术页面现在声称覆盖 SOC 1/2 Type 2、ISO/IEC 27001、ISO/IEC 27018 和 ISO 22301
              认证，同时具备多云冗余、MFA、SSO、基于角色的访问控制，以及活跃的漏洞赏金项目。较早的 Mirakl 安全文章也佐证了其中一些里程碑的推进顺序。Cloud Security Alliance STAR
              列名进一步提供了外部信号：Mirakl 愿意把控制映射到公认的云安全框架。


              限制不在于没有证据，而在于证据深度。公开页面展示了主张和里程碑公告，但没有底层审计材料、当前事故历史，或安全尽调工作流真正需要的详细控制映射。这意味着 Mirakl
              跨过了企业就绪的重要第一道门槛，但任何需要深入评估运营韧性的买家或投资者，仍有大量尽调要做。
