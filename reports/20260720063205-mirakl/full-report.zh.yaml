      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              公司简介页显示，Mirakl 已有相当成熟的管理层：Marie Best（CFO）、Laure Le Gall（CRO）、Nagi Letaifa（CTO）、Jean-Yves
              Simon（首席产品官）、Sophie Marchessou（首席客户官）、Scott Eckert（美洲 CEO），以及 Tzipi Avioz（APAC 与日本 CEO）都列为现任领导者。这一点重要，因为
              Mirakl 眼下的战略横跨软件、资金流、媒体变现和 AI 基础设施；没有创始人之下更专业化的高管层，很难完成这次转型。官网可见的董事会和顾问层还包括来自 Silver
              Lake、83North、Permira、Felix、Bain 和 Elaia 的投资相关人士，这也符合一家晚期私营公司随着每轮融资而扩展治理结构的样子。


              即便如此，创始人依赖仍然偏高。无论融资、年度业绩还是新产品发布，Corrot 和 Nussenbaum
              仍是公开战略叙事的主要讲述者，公司身份也与他们长期坚持的平台经济判断紧密绑定。公司没有公开披露详细董事会权利、投票控制或接班安排。这对私营 SaaS
              公司来说正常，但留下一个承销缺口：实际控制权究竟更多掌握在创始人手中，还是后期投资者手中。尽调视角下，管理层可信；治理披露还达不到公开市场投资者会期待的水平。
