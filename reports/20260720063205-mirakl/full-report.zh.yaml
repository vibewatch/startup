        - ARR $177M；GMV $11.2B；Adspert 于 2024 年 12 月完成交割
        - Mirakl
        - 证明核心平台盈利，并拓宽零售媒体能力。
      - - 2025-02 to 2026-05
        - 2025 年业绩、Nexus、J.P. Morgan 合作、Trust & Safety
        - 产品
        - ARR $218M；集团盈利；新的 AI / 合规产品上线
        - Mirakl 与 J.P. Morgan Payments 合作
        - 显示品类正从交易市场 SaaS 扩展到智能体电商和监管工具。
    notes: 这条时间线是本章唯一记录口径，涵盖公司历史、融资、产品扩展和 AI 时代里程碑。
