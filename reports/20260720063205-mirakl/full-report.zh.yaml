      - number: '2.4'
        title: 约束、替代方案，以及什么会拖慢采用
        blocks:
          - type: paragraph
            body: >-
              创造需求的同一套复杂性，也限制了采用速度。市场研究反复指出，网络安全、欺诈、库存准确性、物流协同、遗留系统集成和获客成本是主要约束。B2B 部署还要叠加合同定价、审批流和协商条款，形成另一层实施摩擦。这对
              Mirakl 很重要，因为它的客单价和部署动作都是企业级；长销售周期和集成工作是产品的一部分，不是例外。买家随时可以推迟市场平台上线，改为扩展自营品类，或在没有专门市场平台专家的情况下组装可组合技术栈。


              第二个约束是价值捕获。即便市场平台渗透率继续上升，预算也可能在核心电商套件、信息流 / 发现供应商、零售媒体专家、支付提供商和内部工程团队之间碎片化。竞争对手导向评论明确指出这一点，批评 Mirakl
              是一个仍然需要相邻系统的专门层。这个批评有自利成分，但并非错误。关键尽调问题是，随着 AI、零售媒体和多渠道分发分别催生自己的软件支出，Mirakl
              的品类专长是否足以支撑它在技术栈里成为一个独立控制点。答案很可能随客户复杂度和垂直行业而变。
