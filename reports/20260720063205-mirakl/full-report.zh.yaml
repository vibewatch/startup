  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与变现边界
        blocks:
          - type: paragraph
            body: >-
              Mirakl 已不再像一家单产品市场平台 SaaS 供应商。公司仍以核心企业市场平台为锚，但已披露的产品组合现在包括 Ads、Connect、Payout、Catalog Platform，以及更新的 AI
              主导计划。财务上，这很重要，因为它应该把变现从单一软件合同拓宽为一组相邻预算：市场平台运营、供应商数据接入、跨渠道卖家赋能、零售媒体和市场平台支付。公开证据足以证明这种广度，但还不足以显示每个模块贡献了多少收入。


              核心公开限制是收入结构披露。Mirakl 报告 ARR 和 GMV，但不披露 ARR
              有多少来自核心订阅软件、交易挂钩变现、服务或新模块。这意味着，高层投资者能看到收入基数很大且还在增长，却还无法判断最近的增长究竟来自持久、高毛利的经常性收入，还是来自服务和实施内容比标题暗示更重的组合。
