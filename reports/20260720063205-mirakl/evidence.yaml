evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Public board composition, voting rights, reserved matters, and founder ownership percentages.
    whyItMatters: Governance control determines who can force or block financing, acquisitions, and exit timing.
    diligencePath: Request the current board list, shareholder agreement summary, and cap-table waterfall from management.
    relatedQuestionRefs:
      - QO009
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A precise current employee count by function and geography.
    whyItMatters: Headcount is a key efficiency input for evaluating ARR per employee and support burden.
    diligencePath: Request current HRIS-export headcount by region and function; reconcile with CFO planning materials.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: minor
    topic: profitability-detail
    missingEvidence: Income statement detail beyond ARR, GMV, and high-level profitability descriptors.
    whyItMatters: >-
      Without margins or cash-flow detail, investors cannot fully separate durable profitability from timing or
      accounting effects.
    diligencePath: Obtain audited or board-level 2024 and 2025 management accounts with revenue mix and EBITDA bridge.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: market-size-dispersion
    missingEvidence: >-
      A reconciled software-market sizing model separating core marketplace infrastructure from broader ecommerce suites
      and from GMV-driven adjacencies.
    whyItMatters: >-
      TAM narratives range from billions to trillions; without normalization they can overstate upside and distort
      valuation.
    diligencePath: >-
      Build a bottom-up market model using enterprise account counts, average contract sizes, and attach rates for
      marketplace, payouts, catalog, and media modules.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM020
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: segment-share
    missingEvidence: Mirakl’s actual revenue mix by retail vs B2B, geography, and product module.
    whyItMatters: Public market growth data does not reveal which slices of the opportunity Mirakl is actually penetrating.
    diligencePath: >-
      Request booked ARR, pipeline, and customer counts by vertical, geography, and module from finance or sales
      operations.
    relatedQuestionRefs:
      - QM016
      - QM025
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: driver-quantification
    missingEvidence: >-
      A clean, independent retail-media TAM source tied specifically to third-party marketplace traffic rather than
      general ad-tech.
    whyItMatters: >-
      Retail media is important to Mirakl’s expansion story but the public evidence is still often blended with broader
      commerce media.
    diligencePath: Request operator-level ads revenue benchmarks or use sector reports with a marketplace-operator cut.
    relatedQuestionRefs:
      - QM015
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: >-
      Mirakl’s actual competitive win/loss data versus VTEX, commercetools, Shopify, Adobe, and internal build
      alternatives.
    whyItMatters: >-
      Public positioning shows narrative competition but not which rivals Mirakl most often beats in live enterprise
      deals.
    diligencePath: Request CRM-coded win/loss records and pipeline stage data by competitor from sales operations.
    relatedQuestionRefs:
      - QP010
      - QP017
      - QP025
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Signed contract economics and attach rates for Mirakl core, Connect, Ads, Payout, and Catalog modules.
    whyItMatters: >-
      Third-party pricing guides are directionally useful but not reliable enough for underwriting gross margin or sales
      efficiency.
    diligencePath: >-
      Review recent master service agreements, order forms, and pricing schedules from a representative sample of
      customers.
    relatedQuestionRefs:
      - QP011
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: thesis-break triggers
    missingEvidence: >-
      Neutral independent research explicitly benchmarking operator-governance workflows across enterprise marketplace
      vendors.
    whyItMatters: >-
      Most public comparisons are vendor-created or competitor-written, so genuine product-depth differences are
      imperfectly verified.
    diligencePath: >-
      Run hands-on demos and reference calls with at least three recent enterprise buyers who evaluated multiple
      vendors.
    relatedQuestionRefs:
      - QP025
      - QP021
      - QP020
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Module-level revenue mix across core marketplace, Ads, Connect, Payout, Catalog Platform, and services.
    whyItMatters: >-
      Without mix, investors cannot determine whether the growth base is mostly high-margin software or a broader
      blended model.
    diligencePath: >-
      Request board reporting or management monthly business review showing ARR, revenue, gross profit, and churn by
      module.
    relatedQuestionRefs:
      - QI004
      - QI022
      - QI025
    relatedTableRefs:
      - TI001
      - TI005
  - type: private-evidence-only
    severity: material
    topic: margin-and-cash
