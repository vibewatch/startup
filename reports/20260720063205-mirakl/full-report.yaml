      - number: '2.4'
        title: Constraints, substitutes, and what could slow adoption
        blocks:
          - type: paragraph
            body: >-
              The same complexity that creates demand also caps adoption speed. Market studies repeatedly flag
              cybersecurity, fraud, inventory accuracy, logistics coordination, legacy integration, and
              customer-acquisition cost as major constraints. For B2B deployments, contract pricing, approval flows, and
              negotiated terms add another layer of implementation friction. That matters for Mirakl because its deal
              sizes and deployment motions are enterprise-grade; long sales cycles and integration work are part of the
              product, not exceptions. Buyers can always decide to postpone a marketplace launch, extend first-party
              assortment instead, or assemble a composable stack without a dedicated marketplace specialist.


              A second constraint is value capture. Even if marketplace penetration keeps rising, the budget can
              fragment across core commerce suites, feed/discovery vendors, retail-media specialists, payments
              providers, and internal engineering teams. Competitor-oriented commentary makes this explicit by
              criticizing Mirakl for being a specialist layer that still requires adjacent systems. That critique is
              self-interested, but not wrong. The key diligence question is whether Mirakl’s category expertise is
              valuable enough to justify a separate control point in the stack as AI, retail media, and multichannel
              distribution each spawn their own software spend. The answer likely varies by customer complexity and by
              vertical.
