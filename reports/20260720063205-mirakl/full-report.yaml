  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and category structure
        blocks:
          - type: paragraph
            body: >-
              Mirakl does not compete in a single clean lane. The company’s original market was enterprise marketplace
              enablement, but the effective competitive set now spans at least four groups: integrated commerce suites
              (VTEX, Shopify, Adobe, Salesforce), composable and headless challengers (commercetools, Spryker),
              marketplace specialists (Marketplacer), and large commerce-network or point-solution vendors (Rithum,
              Feedonomics, Topsort). That breadth matters because buyers are often choosing architecture, not just
              features. A retailer deciding between Mirakl and Shopify or Adobe is partly deciding whether it wants a
              specialist marketplace control point or a broader operating system with marketplace capability layered in.


              The clearest way to frame Mirakl is as a marketplace operator specialist that has been broadening into
              adjacent budgets. It still wins by helping enterprises govern third-party sellers, enforce catalog and
              performance rules, and run marketplace workflows at scale. But its product expansion into Ads, Connect,
              Payout, Catalog Platform, and Nexus means the company now bumps into more vendors in more buying centers.
              The result is a market where direct competitors differ less by industry label than by how much of the
              commerce stack they try to own.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP017
              - CP018
              - CP020
