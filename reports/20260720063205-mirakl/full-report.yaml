  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what Mirakl is really selling
        blocks:
          - type: paragraph
            body: >-
              Mirakl is often described against enormous e-commerce or B2B transaction markets, but those totals
              overstate the revenue pool that an infrastructure vendor can monetize directly. The company sells software
              and workflow orchestration to marketplace operators; it does not own the GMV that moves through those
              operators. The most relevant lens is therefore the enterprise marketplace-platform software layer: seller
              onboarding, assortment expansion, catalog normalization, payout orchestration, operations tooling, and
              increasingly retail media and AI distribution. Broader e-commerce platform studies are useful for context
              because enterprise buyers do compare Mirakl with VTEX, Adobe, Shopify, Salesforce, and composable stacks,
              but Mirakl’s addressable pool is a subset of that larger platform market.


              Sizing evidence confirms both the opportunity and the ambiguity. The broad e-commerce platform market is a
              single-digit-to-teens billions software category today, while B2B e-commerce transaction estimates are in
              the tens of trillions. Between those poles sits the more directly relevant B2B marketplace-platform
              software segment — large enough to matter, but far smaller than the GMV headlines. The right underwriting
              frame is therefore to ask whether Mirakl can capture a durable share of enterprise marketplace-software
              budgets as platform operators adopt third-party assortment, not whether it can somehow monetize a fixed
              percentage of all marketplace transaction value.
            claimRefs:
