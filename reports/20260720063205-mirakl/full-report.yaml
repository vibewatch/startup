      - number: '3.3'
        title: Specialists, networks, and adjacent pressures
        blocks:
          - type: paragraph
            body: >-
              Mirakl also faces pressure from vendors that do not look identical on paper. Marketplacer competes as a
              marketplace overlay for operators that want range expansion without a full replatform. Rithum competes at
              network scale across listings, inventory, dropship, and retail media, especially for brands and retailers
              already selling across many channels. Feedonomics and Topsort compete at even narrower layers —
              distribution and monetization — but those layers matter because they are exactly where Mirakl is trying to
              expand wallet share.


              This is why Mirakl’s newer modules matter strategically. If Ads, Connect, and agentic-commerce tooling are
              merely helpful add-ons, adjacent specialists can cherry-pick those budgets while leaving Mirakl boxed into
              a slower-growth core. If those modules are deeply integrated into operator workflows, they increase
              switching costs and make Mirakl harder to displace. That tradeoff is one of the central questions for the
              rest of the report.
