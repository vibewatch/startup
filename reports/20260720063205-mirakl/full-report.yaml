      - number: '7.4'
        title: Mitigations, kill criteria, and risk verdict
        blocks:
          - type: paragraph
            body: >-
              Mirakl is not exposed to these risks without defenses. Trust & Safety, privacy and DPA scaffolding,
              security certifications, published controls, and peak-season resilience all provide meaningful mitigation.
              The platform looks more institutionally prepared than many private peers. Even so, the most dangerous
              risks are the ones public evidence cannot close. Retention, concentration, and module-economics opacity
              remain the clearest hidden model risks; compliance and AI-agent safety remain the clearest operating
              risks; and dependency complexity remains the clearest transmission channel from incident to revenue or
              valuation damage.


              That leaves the investment committee with a medium-high residual-risk picture. The company is not
              screaming “fragile,” but it is entering more regulated and safety-sensitive workflows while still asking
              outsiders to accept a meaningful amount of private information asymmetry. In practice, that means
              diligence should focus less on generic software risk and more on the specific events that would break the
              thesis: a major compliance incident, a failed AI-adjacency rollout, or evidence that the largest customers
              are not renewing or not buying the newer modules.
