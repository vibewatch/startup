        - Round, tender, or sponsor indication clearly below $3.0B
        - Shows outside buyers do not support the current headline valuation
        - Reprice to bear/base range or avoid entry
      - - Retention or concentration miss
        - NRR, GRR, churn, or top-customer concentration comes in materially worse than expected
        - Premium multiple support weakens immediately
        - Move recommendation toward research-more / avoid
      - - Margin or cash-conversion miss
        - Gross margin, FCF, or debt utilization looks worse than the software narrative suggests
        - Profitability quality falls below the premium case
        - Compress multiple and extend hold-period assumptions
      - - Preference-stack overhang
        - Senior liquidation preferences or side letters subordinate new money
        - Headline valuation overstates common-equity economics
        - Insist on terms repair or lower price
      - - Adjacency monetization miss
        - Connect, Ads, or Nexus attach is too small to change customer economics
        - Bull case disappears and public comp ceiling becomes binding
        - Underwrite only core-platform value
