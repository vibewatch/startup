      - number: '3.2'
        title: Integrated suites and composable challengers
        blocks:
          - type: paragraph
            body: >-
              The suite competitors sell simplification. VTEX markets a unified stack across commerce, marketplace, OMS,
              and retail media for thousands of stores and customers globally. Shopify sells global rollout,
              omnichannel, wholesale, and TCO efficiency, while Adobe and Salesforce emphasize integration with broader
              commerce, data, and customer-relationship systems. In practice, these platforms compete by reducing the
              number of vendors a large operator must coordinate. That is especially attractive to teams that care more
              about fast unification than about best-of-breed marketplace depth.


              The composable challengers sell flexibility. commercetools and Spryker both frame the future as modular,
              headless, and API-first. Their pitch is that operators should not accept a rigid marketplace model if they
              can assemble the exact stack they want. Those vendors become more threatening when marketplace workflows
              look similar across customers and when AI, retail media, and data orchestration can be plugged in from
              outside. They become less threatening when seller-governance, compliance, and marketplace-specific
              operating detail become the real bottlenecks.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
