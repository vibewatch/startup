              to operate good governance processes on top of its tools. The J.P. Morgan relationship illustrates both
              the upside and the dependency problem: Mirakl can accelerate agentic-commerce readiness by partnering with
              a global payments player, but it also ties part of the promise to another company’s fraud controls,
              transaction infrastructure, and roadmap timing.


              Execution risk rises further because Mirakl is expanding on many fronts at once. Core marketplace
              operations are mature, but Ads, Connect, Payout, Trust & Safety, and Nexus each add new GTM, product, and
              support demands. Customer reviews suggest the platform can be stable and feature-rich while still being
              complex to integrate and operate. That combination makes execution risk less about code quality alone and
              more about whether Mirakl can keep the whole operating model coherent as the surface area expands.
