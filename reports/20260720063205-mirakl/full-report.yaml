chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product Scope, and Current Scale
        blocks:
          - type: paragraph
            body: >-
              Mirakl is an enterprise commerce infrastructure company built around a simple thesis: large retailers,
              distributors, and brands increasingly need marketplace-style assortment expansion without owning all of
              the inventory themselves. The company, founded in 2012 by Philippe Corrot and Adrien Nussenbaum after
              their SplitGames experience, now presents itself as the “operating system for intelligent commerce.” That
              framing is broader than the original marketplace thesis: Mirakl still anchors on third-party marketplace
              and dropship operations, but it now layers catalog onboarding, seller payouts, retail media, multichannel
              seller tooling, and agentic-commerce infrastructure on top of the core platform. The company’s dual
              Boston/Paris headquarters and global leadership bench reinforce that Mirakl is run as a cross-Atlantic
              scale-up, not a France-only SaaS vendor.


              Scale claims are material and mostly company-sourced. Mirakl says it serves 450+ enterprise customers and
              a network of more than 100,000 brands and sellers; those numbers appear consistently across the 2025
              results release, the about page, and adjacent product pages. Public customer proof also suggests the
              platform is deeply embedded in the operating models of major retailers: Macy’s used Mirakl to add 220,000+
              marketplace SKUs in year one, while Best Buy, Lowe’s, and Ulta all launched or scaled marketplace programs
              on Mirakl in 2025. The strongest takeaway for later chapters is that Mirakl is no longer just a
              marketplace-enablement vendor; it is trying to become a broader commerce control plane for enterprise
              operators and sellers.
