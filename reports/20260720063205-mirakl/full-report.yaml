      - number: '1.3'
        title: Capital Formation, Valuation, and Financial Milestones
        blocks:
          - type: paragraph
            body: >-
              Mirakl’s funding history maps cleanly onto the rise of the marketplace-software category. Tracxn and Clay
              both show a ladder from a small 2012 Series A through a $20 million Series B in 2015, a $70 million Series
              C in 2019, a $300 million Series D in 2020, a $555 million Series E in 2021, and a €100 million revolving
              credit facility in 2023. The Series E remains the canonical valuation mark: more than $3.5 billion, led by
              Silver Lake with support from existing investors including 83North, Elaia, Felix Capital, and Permira. On
              disclosed equity alone, Mirakl has raised about $948 million; including the 2023 debt, total disclosed
              capital is roughly $1.06–1.1 billion depending on currency translation and data vendor rounding.


              The financial operating story improved materially after the 2021 financing peak. Mirakl reported $177
              million ARR and $11.2 billion GMV in 2024, alongside positive EBITDA for the historical core platform. It
              then reported $218 million ARR, $14.6 billion GMV, and full group-level profitability in 2025. Those are
              strong absolute numbers for a private verticalized enterprise SaaS platform. They also imply that Mirakl
              is growing faster than many broader commerce peers while carrying a much older valuation mark. That
              combination — improving fundamentals but stale price discovery — is why valuation discipline becomes a
              central issue later in the report.
