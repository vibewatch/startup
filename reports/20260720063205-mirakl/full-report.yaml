      - number: '8.2'
        title: Public comp range and what it implies for Mirakl
        blocks:
          - type: paragraph
            body: >-
              The public comp set is useful precisely because it is uncomfortable. Shopify still commands a premium,
              around 13x market-cap-to-revenue in July 2026, because investors view it as a large, high-quality,
              profitable commerce platform. VTEX and BigCommerce sit much lower, around 3.1x and 1.15x respectively,
              because their public disclosures make it easier to see slower growth, narrower platform breadth, or lower
              confidence in long-run margin power. Mirakl’s last disclosed private mark at about 16.1x ARR therefore
              does not merely sit above mid-tier public comps; it lands in the same neighborhood as the strongest public
              commerce platform while offering far less disclosure and no liquidity.


              That does not mean the Mirakl mark is impossible. ARR can deserve a premium to GAAP revenue, and Mirakl’s
              enterprise marketplace leadership, profitability, and adjacencies give it a better qualitative story than
              the lowest multiple names. But the comp spread makes one point unavoidable: the burden of proof is on
              premium valuation support. TV004 and FV002 use the current comp data to show that even modest multiple
              changes move enterprise value materially, which is why entry discipline matters more here than generic
              admiration for the company.
