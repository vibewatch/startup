        title: Revenue model and monetization surface
        blocks:
          - type: paragraph
            body: >-
              Mirakl no longer looks like a single-product marketplace SaaS vendor. The company still anchors around the
              core enterprise marketplace platform, but its disclosed product set now includes Ads, Connect, Payout, and
              Catalog Platform alongside newer AI-led initiatives. Financially, that matters because it should broaden
              monetization from a single software contract into a bundle of adjacent budgets: marketplace operations,
              supplier-data onboarding, cross-channel seller enablement, retail media, and marketplace payments. Public
              evidence is good enough to establish that breadth, but not good enough to show how much revenue each
              module contributes.


              The central public limitation is mix disclosure. Mirakl reports ARR and GMV, but not what share of ARR
              comes from core subscription software, transaction-linked monetization, services, or newer modules. That
              means a high-level investor can see that the revenue base is large and growing, but cannot yet tell
              whether the most recent growth is coming from durable, high-margin recurring revenue or from a mix with
              heavier services and implementation content than the headline implies.
