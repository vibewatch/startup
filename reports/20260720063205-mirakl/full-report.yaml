      - number: '2.3'
        title: Who buys, who uses, and what they require
        blocks:
          - type: paragraph
            body: >-
              The enterprise buyer for marketplace software is rarely looking for a generic web-store builder. The
              classic Mirakl customer is a retailer, distributor, or manufacturer that already has a storefront and
              needs to add third-party assortment, dropship, or B2B marketplace functionality without rebuilding the
              whole stack. That explains why official competitor messaging from VTEX, Adobe, Shopify, BigCommerce, and
              commercetools all converges on similar evaluation criteria: omnichannel operations, broad integration
              capacity, localization, B2B capabilities, performance, and AI extensibility. The market is increasingly
              defined by whether a vendor can sit cleanly inside a larger commerce architecture.


              That purchase logic also shapes user personas. Marketplace operations, merchandising, supplier-onboarding,
              payments, finance, seller-success, and retail-media teams all touch the system, which makes implementation
              a cross-functional rather than purely IT decision. Budget owners usually sit in digital commerce or
              transformation functions, but the platform only sticks if catalog, checkout, seller compliance, and
              marketing workflows all improve. Mirakl’s strongest fit is therefore in complex organizations where
              assortment breadth, seller governance, and multi-team workflows matter more than building a basic
              storefront quickly.
            claimRefs:
              - CM019
              - CM022
              - CM023
              - CM024
              - CM025
