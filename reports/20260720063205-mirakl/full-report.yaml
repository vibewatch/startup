      - number: '8.3'
        title: Thesis, anti-thesis, and scenario view
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is straightforward. Mirakl is a category-defining enterprise marketplace platform with
              unusually strong public proof for a private company: it is profitable, it has large and recognizable
              customers, more than 35 of those customers now exceed $100 million of annual marketplace GMV, and newer
              businesses such as Connect and Ads are real enough to demonstrate that the company can monetize beyond the
              historical core. If those adjacencies scale, and if the agentic-commerce layer eventually becomes paid
              infrastructure rather than only narrative, Mirakl can reasonably defend a premium outcome.


              The anti-thesis is equally concrete. Public evidence still cannot answer the return-determining questions
              that matter most at a premium private price: NRR, churn, customer concentration, gross margin, free cash
              flow, debt draw, and the actual preference stack. In addition, the newest story layer—Nexus and agentic
              commerce—is strategically interesting but not yet shown as a meaningful ARR driver. That combination leads
              to scenario underwriting rather than precision. TV003 and FV003 place the center of gravity below the last
              headline mark, with bull-case support only if profitability and attach continue while disclosure quality
              improves toward public-market standards.
