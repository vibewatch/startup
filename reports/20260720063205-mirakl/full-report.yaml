  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Mirakl sits directly in the blast radius of platform regulation. Its customers operate marketplaces,
              seller ecosystems, catalogs, payouts, and increasingly AI-moderated or agentic buying flows — exactly the
              areas where Europe and other jurisdictions are tightening rules. The Digital Services Act raises diligence
              expectations around illegal products and platform integrity, DAC7 imposes seller-reporting duties, and
              payment rules such as PSD2 matter wherever marketplace payouts or agentic transactions cross into
              regulated payment behavior. Mirakl’s own product roadmap now explicitly references this pressure through
              Trust & Safety and agentic-commerce governance language.


              The good news is that Mirakl appears more legally mature than an early-stage startup. The privacy policy,
              legal center, and DPA collectively show a more developed contractual and data-protection posture than many
              private software companies. The bad news is that legal maturity does not remove the operating burden:
              product, compliance, moderation, and customer-success teams still have to turn those legal obligations
              into repeatable workflows in live customer environments.
            claimRefs:
              - CR001
