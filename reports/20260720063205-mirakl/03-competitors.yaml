  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: Mirakl’s actual competitive win/loss data versus VTEX, commercetools, Shopify, Adobe, and internal build alternatives.
    whyItMatters: Public positioning shows narrative competition but not which rivals Mirakl most often beats in live enterprise deals.
    diligencePath: Request CRM-coded win/loss records and pipeline stage data by competitor from sales operations.
    relatedQuestionRefs:
    - QP010
    - QP017
    - QP025
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Signed contract economics and attach rates for Mirakl core, Connect, Ads, Payout, and Catalog modules.
    whyItMatters: Third-party pricing guides are directionally useful but not reliable enough for underwriting gross margin or sales efficiency.
    diligencePath: Review recent master service agreements, order forms, and pricing schedules from a representative sample of customers.
    relatedQuestionRefs:
    - QP011
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: minor
    topic: thesis-break triggers
