  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-size-dispersion
    missingEvidence: A reconciled software-market sizing model separating core marketplace infrastructure from broader ecommerce suites and from GMV-driven adjacencies.
    whyItMatters: TAM narratives range from billions to trillions; without normalization they can overstate upside and distort valuation.
    diligencePath: Build a bottom-up market model using enterprise account counts, average contract sizes, and attach rates for marketplace, payouts, catalog, and media modules.
    relatedQuestionRefs:
    - QM003
    - QM004
    - QM020
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: segment-share
    missingEvidence: Mirakl’s actual revenue mix by retail vs B2B, geography, and product module.
    whyItMatters: Public market growth data does not reveal which slices of the opportunity Mirakl is actually penetrating.
    diligencePath: Request booked ARR, pipeline, and customer counts by vertical, geography, and module from finance or sales operations.
    relatedQuestionRefs:
    - QM016
    - QM025
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: minor
    topic: driver-quantification
    missingEvidence: A clean, independent retail-media TAM source tied specifically to third-party marketplace traffic rather than general ad-tech.
    whyItMatters: Retail media is important to Mirakl’s expansion story but the public evidence is still often blended with broader commerce media.
    diligencePath: Request operator-level ads revenue benchmarks or use sector reports with a marketplace-operator cut.
    relatedQuestionRefs:
    - QM015
    relatedTableRefs:
    - TM004
