    - Mirakl is strongest where assortment and seller governance matter.
  - - Distributors / wholesalers
    - B2B transformation lead
    - Digitize procurement and long-tail supply without owning all inventory
    - Marketplace model solves breadth and speed problems in B2B.
  - - Manufacturers
    - Channel / marketplace lead
    - Add partners or resellers without building a full new stack
    - Marketplace tooling can support dealer and spare-parts ecosystems.
  - - Brands / sellers
    - Growth or marketplace team
    - Distribute across many channels with less manual catalog work
    - Connect and Catalog expand relevance beyond operators.
  - - Finance / operations
    - CFO, payments, ops owners
    - Reconcile payouts, KYC, compliance, seller performance
    - Adjacencies like Payout and Trust & Safety matter for expansion.
  - - Growth / media teams
    - Retail media or marketing lead
    - Monetize traffic and seller demand
    - Ads makes the category more attractive than pure marketplace management alone.
  notes: The buyer map is functional, not vertical-only, because Mirakl deployments cross operational, finance, seller, and merchandising teams.
