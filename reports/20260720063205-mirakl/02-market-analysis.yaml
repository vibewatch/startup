- id: TM006
  title: Substitute and status-quo stack table
  columns:
  - approach
  - what buyer keeps
  - what buyer gives up
  - Mirakl implication
  rows:
  - - First-party ecommerce only
    - Tight control of owned assortment
    - Long-tail breadth and third-party selection
    - Marketplace logic remains optional but growth is narrower.
  - - Internal build
    - Maximum customization
    - Long implementation cycles and ongoing engineering burden
    - Mirakl must beat internal build on time-to-value and expertise.
  - - Broader commerce suite
    - Storefront + OMS + commerce in one contract
    - Best-of-breed marketplace specialization
    - Integrated suites pressure Mirakl from above.
  - - Composable point stack
    - Vendor choice by function
    - Integration burden and orchestration overhead
    - Mirakl wins only if specialist depth offsets extra stack complexity.
  notes: Summarizes the practical alternatives buyers consider before adopting a specialist marketplace layer.
