- id: TM004
  title: Growth drivers and constraints table
  columns:
  - factor
  - driver or constraint
  - evidence
  - implication for Mirakl
  rows:
  - - Marketplace share gain
    - driver
    - Marketplace channels drive a growing share of ecommerce growth and spend.
    - Supports continued enterprise interest in marketplace models.
  - - B2B self-service shift
    - driver
    - Millennial and rep-free preferences push procurement online.
    - Supports B2B marketplace expansion and approval-workflow tooling.
  - - Cross-border commerce
    - driver
    - International buying and seller access continue to rise.
    - Rewards localization and global seller-network capabilities.
  - - Retail media monetization
    - driver
    - Traffic monetization is becoming a separate budget line.
    - Supports Mirakl Ads and broader wallet-share expansion.
  - - Cybersecurity and fraud
    - constraint
    - Market studies list scams, fraud, and data risk as adoption barriers.
    - Raises the bar for trust, compliance, and operational controls.
  - - Legacy integration
    - constraint
    - ERP/PIM/OMS integration remains difficult for complex operators.
    - Lengthens sales cycles and implementation work.
  - - Logistics and inventory accuracy
    - constraint
    - Fulfillment and stock complexity intensify with multi-vendor models.
    - Pushes buyers toward proven orchestration rather than DIY.
  - - Suite vs specialist fragmentation
    - constraint
    - Buyers can choose integrated commerce suites or point tools instead.
    - Mirakl must prove that a separate marketplace layer is worth the complexity.
  notes: Pairs structural demand drivers with the main reasons buyers delay or narrow deployments.
