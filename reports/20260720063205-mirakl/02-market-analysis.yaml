- id: TM001
  title: Market definition table
  columns:
  - dimension
  - included
  - excluded
  - why it matters
  rows:
  - - Core market
    - Enterprise marketplace and dropship software
    - Gross transaction value itself
    - Mirakl monetizes software budgets, not the full GMV flowing through customers.
  - - Primary buyer
    - Retailers, distributors, manufacturers launching third-party channels
    - SMB one-store merchants
    - Implementation complexity and sales cycle differ sharply by buyer size.
  - - Adjacent modules
    - Catalog onboarding, payouts, retail media, seller distribution, AI discovery
    - Pure payment processing or ad networks without marketplace workflow ownership
    - Adjacencies expand wallet share and defend the core platform.
  - - Primary substitutes
    - First-party ecommerce, internal builds, composable stacks
    - Consumer marketplace operators like Amazon itself
    - Customers compare build-vs-buy and suite-vs-specialist decisions before purchasing.
  - - Economic unit
    - Software ACV / ARR
    - Percentage of all marketplace GMV
    - Using GMV totals alone inflates perceived TAM.
  notes: Separates the software-budget lens from the transaction-volume lens, which is essential for sensible TAM work.
