  topStrengths:
    - Mirakl 已达到真实企业级规模：450+ 个 marketplace、100,000+ 名卖家，且 35+ 家客户的年度 marketplace GMV 超过 $100M。
    - 公开证据显示的不只是增长，还有盈利能力：核心业务 2024 年 EBITDA 转正，集团 2025 年整体盈利。
    - Connect、Ads、catalog AI 和智能体 commerce 工具等相邻业务，为历史 marketplace 核心之外提供了可信扩张路径。
  topRisks:
    - 最后可见的 $3.5B 私募标记，相比多数上市 commerce-platform 可比公司仍隐含偏高倍数。
    - 公开证据未披露 NRR、GRR、客户集中度、毛利率、自由现金流，或当前债务提款情况。
    - 没有更新披露的股权轮验证 2021 年标记，下一次真正价格发现事件可能重置估值。
    - Connect、Ads 尤其是 Nexus 的相邻业务上行可能真实存在，但尚未披露到足以完全支撑溢价情景的规模。
    - 优先股堆叠或 side-letter 遗留条款，可能显著改变新投资人相对 headline 估值可获得的经济利益。
  unresolvedGaps:
    - 经审计 ARR 到收入的桥接，以及按模块拆分的毛利率仍未公开。
    - NRR、GRR、流失和头部客户集中度仍未披露。
    - 当前 RCF 提款、契约和流动性位置没有公开可见。
    - 完整优先股堆叠、side letters，以及二级与新股经济仍不透明。
