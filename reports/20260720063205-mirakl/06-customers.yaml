- id: named-production-proof-and-adoption-trajectory
  title: Named production proof and adoption trajectory
  body: 'The strongest part of the customer story is named production proof. Macy’s, Lowe’s, Best Buy, Best Buy Canada, Ulta, and Graybar all offer current or recent evidence that Mirakl is live inside material commercial workflows. The proof is not just logos: Macy’s disclosed seller, brand, and customer-engagement metrics; Best Buy Canada disclosed SKU and growth metrics; Graybar disclosed workflow-speed gains; Lowe’s described returns, loyalty integration, and verified-seller controls. This is much stronger than a typical late-stage startup logo slide.


    The trajectory evidence also suggests that Mirakl’s best customers use the platform as a growth engine, not a side experiment. Holiday 2025 GMV and API-call figures point to heavy production usage at peak times. That does not automatically prove retention quality, but it does show that Mirakl’s core operator customers are moving meaningful traffic and catalog volume through the platform.'
