- id: review-signals-retention-and-expansion
  title: Review signals, retention, and expansion logic
  body: 'Independent review surfaces are directionally positive but not decisive. Gartner Peer Insights highlights stability and catalog-management strengths, while G2 includes both praise for integration and warnings about usability or integration headaches. That mix is plausible for enterprise infrastructure software: strong operator depth often comes with process complexity. FeaturedCustomers and review aggregators further suggest Mirakl has built a reasonable public proof base, but they cannot substitute for renewal data.


    Public evidence is much better on expansion than on retention. Case studies show operators adding more brands, more sellers, more SKUs, new categories, or deeper operational integration over time. But no public NRR, GRR, logo churn, or contract-length disclosure was found. So the customer story looks sticky and expandable in theory, yet still lacks the metrics that would prove durability quantitatively. The review evidence is therefore useful as a texture layer around satisfaction and deployment complexity, but not sufficient to quantify renewal probability or net retention on its own.'
