- id: concentration-risk-and-customer-verdict
  title: Expansion, concentration risk, and customer verdict
  body: 'The same enterprise focus that makes Mirakl credible also creates blind spots. A company selling large, complex deployments to major operators may have excellent contract quality but still face hidden concentration risk if a few major accounts drive a large share of ARR or GMV. Public evidence cannot resolve that question for Mirakl. Nor can it show whether any very large customers are in renewal windows, aggressively negotiating, or delaying expansion modules.


    The right conclusion is that Mirakl’s customer base is real, enterprise-grade, and operationally meaningful. The company has better named proof than many private software firms. But from an underwriting perspective, the chapter still ends with missing account-level retention and concentration data that only internal reporting can answer. That means an investor can be confident that Mirakl has real customers and real production usage, while still being unable to determine whether future growth is broad-based across cohorts or overly reliant on a smaller flagship group.'
