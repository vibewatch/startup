  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: NRR, GRR, gross logo churn, contract terms, and renewal timing by cohort and segment.
    whyItMatters: Named launches and customer stories do not prove durable renewal or long-term expansion economics.
    diligencePath: Request renewal dashboards, cohort analysis, and top-account contract calendar from customer-success or finance teams.
    relatedQuestionRefs:
    - QU013
    - QU021
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: ARR concentration, GMV concentration, and module penetration by top customer cohorts.
    whyItMatters: Very large logos are validating, but they can also hide renewal or concentration risk.
    diligencePath: Request top-10 and top-20 ARR / GMV concentration tables plus expansion history by account.
    relatedQuestionRefs:
    - QU015
    - QU021
    - QU024
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: customer-durability
    missingEvidence: Reference calls or survey data from recent renewals, churned accounts, and customers that evaluated but did not buy adjacencies.
    whyItMatters: Public case studies and review surfaces skew positive and do not fully represent deployment friction or expansion failure.
    diligencePath: Run at least six customer calls split across new logo, expanding, mature, and churned or stalled accounts.
    relatedQuestionRefs:
    - QU020
    - QU023
    - QU025
    relatedTableRefs:
    - TU006
    - TU003
