chapter:
  number: 6
  title: Customers
  summary: Mirakl has unusually strong named customer proof for a private enterprise software company. Public evidence supports real adoption across large retailers and B2B distributors, with concrete production outcomes at Macy’s, Lowe’s, Best Buy Canada, Graybar, Ulta, and Best Buy. The key weakness in the public customer record is not whether Mirakl has credible logos or production use, but whether those customers renew, expand, and diversify revenue durably over time — because retention and concentration metrics remain undisclosed.
sections:
- id: customer-segments-and-buyer-map
  title: Customer segments and buyer / user map
  body: 'Mirakl sells into enterprise operators, not to end-consumers. The economic buyer is usually a marketplace, ecommerce, merchandising, digital, or procurement leader inside a retailer, distributor, or other enterprise that wants to expand assortment or supplier access without holding more inventory. The user map then broadens: marketplace operations teams, seller-onboarding teams, catalog teams, finance teams, and increasingly supplier- and seller-side users through Connect or Catalog Platform. This makes Mirakl less like a single-seat SaaS tool and more like shared operating infrastructure across several internal teams.


    The public customer base is also broad enough to matter. Mirakl’s official materials point to 450+ marketplaces and 100,000+ sellers, while outside datasets such as Landbase and Apps Run The World point to hundreds of companies and many large enterprise names. These two views are not perfectly comparable, but together they support the conclusion that Mirakl has real enterprise adoption across retail and B2B distribution.'
