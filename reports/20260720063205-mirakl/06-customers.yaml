  rows:
  - - Large retailers
    - 'Buyer: digital / marketplace leadership; User: marketplace ops; Payer: ecommerce budget'
    - Expand assortment through third-party sellers
    - Macy’s, Lowe’s, Best Buy, Ulta
    - Core flagship customer segment and strongest logo set
    - No public segment revenue split.
  - - B2B distributors
    - 'Buyer: procurement / digital commerce; User: supplier & catalog teams; Payer: distribution digital budget'
    - Supplier onboarding, extended catalog, marketplace/distribution
    - Graybar; Conrad; Sysco in third-party datasets
    - Important diversification beyond retail
    - Need quantified penetration of B2B segment.
  - - Global enterprise operators
    - 'Buyer: central digital teams; User: multiple functions'
    - Launch and scale marketplace infrastructure
    - 450+ marketplaces, 100k+ sellers
    - Signals enterprise-grade category leadership
    - No public ARR per operator or region.
  - - Sellers / brands via Connect
    - 'Buyer/User: seller teams; Payer: seller or operator depending commercial model'
    - Cross-channel selling and listing management
    - Official product proof only
    - Potential two-sided network leverage
    - No public adoption metrics.
  - - Supplier data teams via Catalog Platform
    - 'Buyer/User: merchandising and master-data teams'
    - Catalog enrichment and onboarding
    - Graybar proof strongest
    - Deepens workflow stickiness
    - Need module-specific install base.
  notes: Mirakl’s buyer map is multi-stakeholder and enterprise-centric rather than SMB or self-serve.
