  - limitation
  rows:
  - - Launch a third-party marketplace
    - Retailer stitches together storefront, seller ops, and catalog tools
    - Mirakl Platform
    - Faster marketplace launch and operational governance
    - Front-end and surrounding stack still require integration.
  - - Onboard supplier catalogs
    - Manual supplier-data cleanup and PIM mapping
    - Catalog Platform
    - Faster onboarding and data enrichment
    - Public proof is stronger on use case than on pricing.
  - - Distribute sellers across channels
    - Fragmented channel management and catalog formatting
    - Mirakl Connect
    - Unified channel and catalog workflow
    - Attach and monetization detail remain unclear.
  - - Monetize ecommerce traffic
    - Retail media built with extra tooling
    - Mirakl Ads
    - New high-margin media revenue surface
    - Public performance benchmarks are limited.
  - - Pay marketplace sellers
    - Custom payout ops with multiple finance tools
    - Mirakl Payout
    - Centralized payout workflow and existing pay-in compatibility
    - Regulatory / partner dependencies still matter.
  - - Prepare for agentic commerce
    - Catalogs not optimized for LLM or agent flows
    - Mirakl Nexus + J.P. Morgan
    - Potential AI discovery and secure agent checkout
    - Still early in broad commercialization.
  notes: Mirakl’s workflow value is strongest where operator orchestration complexity is high.
