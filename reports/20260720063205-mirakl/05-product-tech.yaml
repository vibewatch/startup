  name: Mirakl
chapter:
  number: 5
  title: Product & Technology
  summary: Mirakl has evolved from a specialist marketplace platform into a broader enterprise commerce operating system spanning marketplace operations, multichannel selling, retail media, payouts, catalog onboarding, trust-and-safety moderation, and agentic-commerce infrastructure. The core platform appears mature, highly integrated, and security-conscious, with concrete public claims around scale, API-first architecture, and certifications. The biggest product-tech question is not whether Mirakl has a robust core, but how quickly newer layers like Nexus and Trust & Safety become repeatable, monetizable parts of the platform rather than announcement-led adjacencies.
sections:
- id: product-scope-and-workflow
  title: Product scope and customer workflow
  body: 'Mirakl’s public product narrative has clearly widened. The company still anchors on enterprise marketplace operations, but it now presents a broader operating system spanning multichannel seller distribution, retail media, catalog onboarding, payouts, trust and safety, and agentic commerce. That breadth matters because Mirakl is no longer just a point solution for third-party seller management; it is trying to own more of the surrounding workflow that determines whether enterprise operators can launch, govern, and monetize large marketplace ecosystems.


    The strongest workflow proof remains in the mature modules. Customer stories for Macy’s, Best Buy Canada, Graybar, Lowe’s, Ulta, and Best Buy all indicate that Mirakl is used in production to expand assortment, onboard suppliers, or stand up marketplace motions. The newer modules like Trust & Safety and Nexus look strategically important, but they are clearly earlier on the maturity curve than the core marketplace stack.'
