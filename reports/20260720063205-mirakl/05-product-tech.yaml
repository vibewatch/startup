- id: security-compliance-and-reliability
  title: Security, compliance, and reliability controls
  body: 'Mirakl’s security and compliance posture is one of the strongest publicly verifiable parts of the product case. The technology page now claims SOC 1/2 Type 2, ISO/IEC 27001, ISO/IEC 27018, and ISO 22301 certification coverage, alongside multi-cloud redundancy, MFA, SSO, role-based access, and active bug bounty programs. Older Mirakl security posts corroborate the sequence of some of those milestones. The Cloud Security Alliance STAR listing adds a further outside signal that Mirakl is willing to map controls into recognized cloud-security frameworks.


    The limitation is depth of proof, not absence of proof. Public pages show claims and milestone announcements, but not the underlying audit artifacts, current incident history, or detailed control mappings that a security diligence workstream would actually want. That means Mirakl clears an important first bar for enterprise readiness, while still leaving meaningful diligence for any buyer or investor that needs to evaluate operational resilience in depth.'
  claimRefs:
  - CE013
