  rows:
  - - SOC 2 Type II
    - Publicly claimed
    - Security, availability, confidentiality controls
    - Current report not public.
  - - ISO/IEC 27001
    - Publicly claimed and blog-corrobated
    - Information security management system
    - Need current certificate scope and renewal status.
  - - ISO/IEC 22301
    - Publicly claimed and blog-corrobated
    - Business continuity and resilience
    - Need current scope and testing cadence.
  - - ISO/IEC 27018
    - Publicly claimed on tech page
    - Privacy controls for cloud processing
    - Need independent corroboration.
  - - CSA STAR / CAIQ listing
    - Public registry listing exists
    - Cloud-security control questionnaire signal
    - Listing is not a substitute for audit evidence.
  - - SSO, MFA, RBAC, rate limiting
    - Publicly claimed feature controls
    - Identity, access, and abuse resistance
    - Need evidence of customer usage and default settings.
  - - Bug bounty
    - Publicly claimed
    - Continuous external security testing
    - Need payout volume, severity distribution, and remediation SLAs.
  notes: Mirakl clears a meaningful public trust bar, but still requires deeper diligence-room evidence for full security underwriting.
