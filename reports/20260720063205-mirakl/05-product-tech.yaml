  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: deep-architecture
    missingEvidence: Detailed current architecture diagrams, service-dependency maps, SLO dashboards, and real incident history for the live production platform.
    whyItMatters: Public technical claims are strong, but they do not let an investor or buyer validate real operational resilience under stress.
    diligencePath: Request architecture review, service maps, status history, load-test summaries, and postmortems from the engineering or SRE team.
    relatedQuestionRefs:
    - QE006
    - QE007
    - QE018
    - QE025
    relatedTableRefs:
    - TE003
    - TE004
  - type: private-evidence-only
    severity: material
    topic: developer-adoption
    missingEvidence: Usage data for APIs, SDK downloads, connector adoption, sandbox accounts, and partner-led implementations.
    whyItMatters: A modest public developer footprint may be harmless in enterprise sales, or it may signal limited ecosystem leverage.
    diligencePath: Request developer-program metrics, connector usage, partner implementation counts, and roadmap prioritization documents.
    relatedQuestionRefs:
    - QE004
    - QE015
    - QE019
    - QE025
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: roadmap-maturity
    missingEvidence: General-availability timing, adoption metrics, and false-positive / operational metrics for Nexus and Trust & Safety.
    whyItMatters: The newest modules are strategically important to Mirakl’s future differentiation, but public evidence is still announcement-heavy.
    diligencePath: Review beta-customer list, pipeline, adoption cohorts, benchmark results, and moderation-quality dashboards.
    relatedQuestionRefs:
    - QE014
    - QE021
    - QE023
    - QE025
    relatedTableRefs:
