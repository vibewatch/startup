- id: roadmap-dependencies-and-technical-verdict
  title: Roadmap, dependencies, and technical verdict
  body: 'The roadmap story is attractive but unevenly mature. Trust & Safety and Nexus both address real marketplace problems: moderating ever-larger catalogs under tightening regulation, and preparing catalogs and checkout flows for AI-agent-driven commerce. The J.P. Morgan partnership is particularly useful because it shows Mirakl trying to solve not just discovery but the secure transactional layer required for agentic commerce. That is an ambitious extension of the product from operator tooling into future commerce infrastructure.


    At the same time, these newer products increase dependency complexity. Mirakl relies on cloud providers, enterprise connectors, outside payment infrastructure, and customer readiness to adopt new workflows. The core platform looks strong and battle-tested. The question for diligence is how much of the newer product narrative is already monetizable and repeatable, versus how much is roadmap-shaped positioning that still depends on partner execution and customer experimentation. materially.'
