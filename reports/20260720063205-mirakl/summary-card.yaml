  topStrengths:
    - >-
      Mirakl has reached real enterprise scale with 450+ marketplaces, 100,000+ sellers, and 35+ customers above $100M
      annual marketplace GMV.
    - >-
      Public evidence shows profitability, not just growth, with EBITDA-positive core operations in 2024 and group-wide
      profitability in 2025.
    - >-
      Adjacencies such as Connect, Ads, catalog AI, and agentic-commerce tooling create credible expansion vectors
      beyond the historical marketplace core.
  topRisks:
    - The last visible $3.5B private mark still implies a rich multiple relative to most public commerce-platform comps.
    - >-
      Public evidence does not disclose NRR, GRR, customer concentration, gross margin, free cash flow, or the current
      debt-draw profile.
    - >-
      The next true price-discovery event could reset valuation because no newer disclosed equity round has tested the
      2021 mark.
    - >-
      Adjacency upside from Connect, Ads, and especially Nexus may be real but is not yet disclosed at a scale that
      fully supports the premium case.
    - >-
      Preference-stack or side-letter overhang could materially change the economics available to new investors versus
      the headline valuation.
  unresolvedGaps:
    - Audited ARR-to-revenue bridge and module-level gross margin are still not public.
    - NRR, GRR, churn, and top-customer concentration remain undisclosed.
    - Current RCF draw, covenants, and liquidity position are not visible publicly.
    - The full preference stack, side letters, and secondary-versus-primary economics are still opaque.
