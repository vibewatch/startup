      - number: '4.2'
        title: 资本结构与融资历史
        blocks:
          - type: paragraph
            body: >
              自 2019 年成立以来，Cohere 已披露融资约 $1.7 billion，横跨五个主要轮次。这条融资轨迹反映出，公司从研究项目孵化体快速成长为企业级 AI
              供应商，并由一个兼具商业分销网络属性的战略投资人联盟支持：NVIDIA（芯片供应）、Oracle（云基础设施）、AMD（NVIDIA 之外的硬件替代）、Salesforce（CRM 渠道）和
              Cisco（企业网络与安全）。每个战略投资方都提供商业联销、分销和基础设施价值，补足财务资本。


              累计融资让 Cohere 按当前烧钱速度估计拥有两到三年现金跑道（推测性，因为实际烧钱速度未披露）。2025 年 9 月 $500M 轮、估值 $6.8–7B，是迄今最大融资，引入 Inovia Capital
              和 PSP Investments 等机构投资者，并有战略伙伴参与。Cohere 的资本需求来自：（1）模型训练 GPU 集群成本（每次前沿级大模型训练估计 $100–300M）；（2）企业销售团队扩张（全球估计
              200–400 名企业销售人员）；（3）服务私有云部署的基础设施。


              按 $7 billion 估值和约 $240M ARR 计算，ARR 收入倍数约 29x。Sacra 2025 年 10 月报告的倍数为 46.7x（按 $150M ARR 和 $7B 估值计算，意味着
              Sacra 的 ARR 估计低于 2026 年 2 月数字）。可比私有 AI 同行交易在 36–50x ARR 倍数区间，说明 Cohere 相对直接可比公司略低估，或体现投资者把开源商品化风险计入定价。毛利率
              70%+ 且增长 100%+ 的上市 SaaS 可比公司交易在 15–25x ARR，确认 Cohere 相比上市 SaaS 估值带有显著私有 AI 溢价。
