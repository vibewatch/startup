      - number: '5.3'
        title: 信任、合规、路线图与技术风险
        blocks:
          - type: paragraph
            body: >
              Cohere 的托管云服务已经取得 SOC 2 Type II 认证，并在扩展合规组合，计划覆盖 ISO 27001 以及面向美国政府账户的 FedRAMP
              Moderate。私有部署架构把数据留在客户基础设施内，天然解决了很多合规要求，但也引入一个依赖：Cohere 的合规姿态，最多只能和客户自身基础设施的合规项目一样强。对需要 FedRAMP High
              的客户（美国国防部、情报机构）来说，Cohere 当前认证还不够——相对已获 FedRAMP High 授权的 Microsoft Azure OpenAI，这仍是产品缺口。


              根据公开表态、博客和投资人报道，产品路线图包括：（1）通过收购 Aleph Alpha 扩大欧盟主权部署（瞄准德国和欧盟政府账户）；（2）把 Command A 下一代的上下文窗口扩到 500k–1M
              tokens；（3）Compass GA 发布，用于自助创建 RAG 流水线；（4）把 Aya 多语言支持扩到 100+ 种语言；（5）为医疗企业客户提供 HIPAA BAA。


              主要技术风险包括：（1）上下文窗口差距——Cohere 的 256k 相比竞争对手 1M，在大文档工作流中是实质劣势；（2）基准可见度——Command A
              尚未提交到全部主流公开基准（MMLU、HumanEval、LMSYS arena），限制了独立质量验证；（3）模型训练算力依赖——Cohere 完全依赖第三方 GPU 供给（通过 Oracle、AWS 获得
              NVIDIA H100 集群访问，以及自有集群投入）；（4）开源替代——Llama 4 和 Mistral 模型可以私有部署，能力可比且授权成本为零，威胁商业模型层溢价；（5）MoE 架构取舍——Command
              A 的 MoE 路线推理成本更低，但相较稠密模型 方案，输出可能更不稳定。
            claimRefs:
              - CE001
