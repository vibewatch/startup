  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与单位经济
        blocks:
          - type: paragraph
            body: >
              Cohere 采用混合收入模式，主要有两条收入流：（1）按年度合同价值（ACV）签订企业协议，为私有和本地部署提供授权；（2）按每百万 tokens 计费的用量型 API 层（Cohere API 和 Coral
              平台）。截至 2025 年，私有部署模型约占 Cohere 已报告收入的 85%，反映公司有意把市场进入动作聚焦在需要数据主权、隔离环境或 VPC 部署的受监管企业客户（金融服务、医疗、政府、国防）上。API
              层虽在增长，但仍是较小的收入部分。


              企业 ACV 合同通常为一到三年的多年期协议，内容包括在客户基础设施或专用 VPC 环境中部署 Cohere 模型，并配套企业支持、SLA 保证和微调服务。大型受监管行业客户的平均合同规模估计在每年
              $500,000 到 $5 million+ 区间，尽管 Cohere 并未披露合同细节。收入从估计 $100M ARR（2024 年中）增至约 $240M（2026 年 2 月），意味着年增长约
              2.4×，符合一家靠企业合同扩张和获取新客户来放大的公司。


              在企业 AI LLM 领域，模型即服务提供商毛利率估计为 70–85%，驱动因素是 GPU 推理成本与客户计费之间的显著差额：规模化使用 H100 时，每百万 tokens 推理成本约
              $0.30–$1.50；API 层向客户收费为每百万 tokens $2–$25，私有部署 ACV 费率则高得多。私有部署中，Cohere 每个客户的边际成本主要是客户成功、部署支持和微调人工，可变成本低于
              API 推理。行业分析师普遍称 Cohere 目标毛利率高于 70%，但考虑到持续模型研发以及销售和市场投入，经营层面盈利最早也不预计早于 2027 年。
