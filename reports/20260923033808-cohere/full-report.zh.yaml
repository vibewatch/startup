      - number: '7.2'
        title: 运营与技术风险
        blocks:
          - type: paragraph
            body: >
              Cohere 的模型训练流水线高度依赖 NVIDIA H100 和 H200 GPU 硬件，而当前配额约束和价格压力仍然较高。考虑到维持接近前沿模型质量所需的研发投入规模，计算 OpEx 估计占 Cohere
              运营成本基数的 30–45%。任何持续数月的 GPU 采购延迟，都会直接威胁 Cohere 的模型发布节奏，以及相对 OpenAI 和 Anthropic 的竞争位置；后两者拥有更优先的 NVIDIA 供给关系。
              [CR017] [CR018] [CR019]

              2026 年初完成的 Aleph Alpha 收购引入整合风险：两个工程组织拥有不同技术栈、招聘文化和客户基础，需要在维持欧洲活跃企业部署的同时合并。Aleph Alpha 的德国 /
              欧盟客户有严格数据主权要求，可能与 Cohere 标准部署架构冲突，从而需要定制工程。 [CR020] [CR021]

              关键人物依赖是 Cohere 最尖锐的组织风险。Aidan Gomez 作为 CEO
              和联合创始人，是企业销售关系、投资者关系和技术可信度的中心人物。如果他离开——无论去竞争对手、创办新公司还是进入学界——都会在关键增长阶段实质动摇公司。联合创始人 Nick Frosst 和 Ivan Zhang
              可以降低但不能消除这项风险。公开来源中没有接班计划披露。安全认证（SOC 2 Type II、ISO 27001）已经到位，但与 NIST AI RMF 对齐的 AI 专项安全认证仍未完成。 [CR022]
              [CR023] [CR024]
            claimRefs:
              - CR008
