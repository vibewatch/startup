      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 建议：以 $7B 有条件投资
            body: >-
              Cohere 值得投资，但投资者需有 5+ 年投资期限，并能承受版权诉讼风险。按概率加权的 1.67x 总回报以 VC
              标准看偏薄，但有强市场位置支撑。承诺投资有两个前置条件：（1）版权诉讼外部律师评估的预期责任低于 $20M；（2）分队列 NRR 披露且高于 100%。缺少这两项，悲观情景概率会上升到
              35–40%，预期回报转为负。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV009
          - type: callout
            title: Oracle 是隐藏退出选项
            body: >-
              最被低估的估值因素，是 Oracle 的股权和战略一致性。如果 Azure OAI 到 2026 年实现主权能力持平，Oracle 的理性反应是以 $10–18B 全资收购 Cohere，以保护自身 OCI 企业
              AI 战略。这个收购情景在最严重悲观情景之外，都为 $7B 进入价提供了底线——让 Oracle 实际上成为投资内嵌的隐含看跌期权。
            calloutType: insight
            claimRefs:
              - CV001
