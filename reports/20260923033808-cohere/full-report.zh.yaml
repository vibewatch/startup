      - number: '8.3'
        title: 退出准备度、最终尽调要求与建议
        blocks:
          - type: paragraph
            body: >
              Cohere 最可能的退出路径包括：（1）2027–2028 年在 ARR 达到 $500M+ 并证明单位经济改善后 IPO；（2）被大型企业软件公司（SAP、Salesforce、Oracle
              或超大规模云厂商）战略收购，以获取企业 AI 能力；（3）通过老股交易和后期轮次继续保持私有公司轨迹。Oracle 的股权既创造了一个优先收购方（Oracle 有动力完全收购 Cohere，以保护其企业 AI
              战略），也带来潜在冲突（Oracle 主导的退出可能以低于少数股东最优的估值完成）。 [CV031] [CV032] [CV033]

              如果 Cohere 在 2027–2028 年 IPO，将面对一个可能仍在从 2024–2025 高倍数压缩中恢复的市场。上市 AI SaaS 公司 IPO 时的估值预计为未来 12 个月收入（NTM）的
              15–25x， 据此，Cohere 需要 $600M+ ARR 才能支撑 $12B+ 公开市场估值。乐观情景下可以做到，但需要持续 50% 以上同比增长并改善毛利率。IPO
              准备度的关键不确定性包括：版权诉讼解决、NRR 轨迹（未披露），以及 North 平台能否把毛利率持续推到 75% 以上。 [CV034] [CV035]

              建议：有条件投资。Cohere 在 $7B 估值下值得投资，但投资者需有 5+ 年投资期限，并能承受版权诉讼风险。基准情景回报（按概率加权 1.67x）属于成长阶段企业 AI
              投资可接受的水平。关键投资前尽调要求包括：（1）分队列 NRR（2022–2025）；（2）版权诉讼外部律师评估和保险覆盖；（3）FedRAMP 授权时间表；（4）Series E
              条款（优先股堆叠、反稀释）；（5）含盈利路径假设的 3 年财务模型。进入价格应较名义估值有 10–15% 折扣，以反映诉讼阴影和倍数压缩风险。 [CV036] [CV037] [CV038] [CV039]
              [CV040]
            claimRefs:
              - CV001
