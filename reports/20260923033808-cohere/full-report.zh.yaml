      - number: '7.4'
        title: 图表
        blocks:
          - type: callout
            title: 版权诉讼：最高概率的不利事件
            body: >-
              Condé Nast 驳回动议在 2025 年 11 月被否，移除了主要法律退出通道。随着证据开示已经启动，2026–2027
              年审判或协商和解是最可能路径。法定赔偿敞口理论上很大，但和解概率远高于判决。更大的风险在于，如果法院要求 Cohere 停止使用网络抓取训练数据，未来模型训练将承担结构性成本。
            calloutType: risk
            claimRefs:
              - CR008
          - type: callout
            title: 开源能力持平：对中端市场是真威胁，对企业平台不是
            body: >-
              Meta Llama 4 和 Mistral Large 2 已经在基准上缩小性能差距。但基准持平 ≠ 部署持平。Cohere 的 North 平台、私有部署、合规姿态和企业 SLA
              构成真实切换成本，开源自托管很难轻易复制。真正风险在 ACV 分布底部——那些每年支付 $50K–$150K ARR、且有工程资源自托管的公司。
            calloutType: insight
            claimRefs:
              - CR033
              - CR034
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与当前估值背景
        blocks:
          - type: paragraph
            body: >
              Cohere 的 $7 billion Series D 估值（2024 年 11 月）相当于约 $240 million ARR 的 29x 过去 12 个月 ARR 倍数。这个水平明显低于 OpenAI 和
              Anthropic 在可比融资轮中对应的 38–42x，反映出 Cohere 规模更小、定位更集中于企业端；但它也形成相对折价，如果企业 LLM 市场继续按预期增长，投资者仍可能获得上行。 [CV001]
              [CV002]

              核心投资逻辑有六根支柱：（1）企业 LLM 市场扩张，预计 2030 年达到 $130–150B；（2）已经跑通企业销售动作，拥有 $240M ARR 和约 400–600 个具名账户；（3）通过 North
              企业平台和主权私有部署形成差异化产品护城河；（4）监管与合规姿态支持其卖进金融服务、医疗和政府垂直，而这些领域是自研云端 AI 难以服务的；（5）通过 Fujitsu 和 LG CNS
              的亚太分销建立非美国收入滩头；（6）收购 Aleph Alpha 扩大欧盟主权 AI 存在。 [CV003] [CV004] [CV005]

              反向逻辑集中在四个风险向量：版权诉讼阴影；Aidan Gomez 关键人物依赖；低 ACV 层的开源模型能力持平；Azure OpenAI 主权云扩张削弱 Cohere 的私有部署护城河。$7B 进入价格对
              ARR 增长实质放缓后的降估值轮融资情景，安全边际有限。版权案是未来 12–24 个月最高概率的重大不利事件。 [CV006] [CV007] [CV008]
            claimRefs:
              - CV001
          - type: table
