            body: >
              Cohere 的主要客户风险是收入集中：在 $240M ARR、估计 400–600 个企业账户的情况下，平均账户每年贡献约 $400K–$600K，但分布几乎肯定倾斜，前 10–20 个账户贡献了不成比例的
              ARR。如果仅有 2–3 个合计 ARR $10M+ 的大账户不续约（原因可能是预算削减、监管变化、转向竞争对手，或版权诉讼对采购造成寒蝉效应），ARR 增长就可能反转或停滞。


              未决版权诉讼（Condé Nast、Forbes、Guardian 等，SDNY）已经成为部分受监管行业买家的采购顾虑，尤其是法律顾问建议谨慎对待仍有未决版权诉讼的 AI 供应商。驳回动议在 2025 年 11
              月被否决，意味着案件将进入证据开示，延长不确定性。这是 Cohere 销售团队必须在企业采购流程中处理的竞争风险。


              客户尽调的关键证据缺口包括：（1）未披露分队列 NRR；（2）实际客户数和收入集中度数据不可得；（3）没有公开赢单 / 输单分析来比较 Cohere 在企业 RFP 中相对 Azure
              OpenAI、Anthropic 和开源替代方案的胜率；（4）客户满意度分数（CSAT/NPS）未公开披露。这些缺口必须通过管理层材料和 NDA 下的数据共享，在 Series E 尽调中补齐。
