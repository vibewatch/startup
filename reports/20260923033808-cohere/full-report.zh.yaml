      - number: '5.4'
        title: 图表
        blocks:
          - type: callout
            title: Embed + Rerank 检索护城河是最耐久的技术差异点
            body: >
              Cohere 的 Embed v3 和 Rerank 模型在 MTEB（Massive Text Embedding
              Benchmark）上持续处于头部，这是文本检索和语义相似度的行业标准基准。检索领先与生成模型质量在技术上是两件事：它需要用检索专用监督数据（例如查询—文档相关性配对）做大规模专门训练，竞争 LLM
              厂商不能只靠放大生成模型就复制。RAG 是企业 LLM 部署的主流模式，因此 Cohere 的检索优势给了它切入企业账户的路径，而且不依赖 Command A 的生成基准表现。
            calloutType: strength
            claimRefs:
              - CE009
          - type: callout
            title: 上下文窗口差距（256k vs 1M）限制大文档用例
            body: >
              Command A 的 256k token 上下文窗口虽然比前代大很多，但仍只有 Anthropic Claude（Opus 和 Sonnet 为 1M tokens）和 Google Gemini 1.5
              Pro（1M tokens）的四分之一。企业客户需要在单一上下文窗口处理完整法律合同（>500 页）、完整财务申报文件、大型代码库分析或长篇研究文档时，这个差距很实际。直到 Cohere 推出 1M+
              上下文模型（尚未确认；非正式说法指向 2026–2027），它仍会在部分大文档企业 RFP 中输给 Anthropic 和 Google。
            calloutType: risk
            claimRefs:
              - CE001
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >
              Cohere 的企业客户基础分成三个主要垂直：金融服务（银行、保险、资产管理）、技术与专业服务、政府与国防（主权 AI 部署）。在这些垂直里，Cohere
              瞄准的是那些因数据主权、多语言能力或监管合规而无法接受公有云 LLM API 的账户——也就是要求最严的企业 AI 买家，同时通常也是 ACV 最高的账户。


              公开点名的客户包括：Oracle（也做了战略投资，并为 Cohere 部署提供 OCI 基础设施）、Fujitsu（日本企业 IT 服务）、LG CNS（韩国企业 IT 服务）、RBC Royal Bank of
              Canada（金融服务）、Dell Technologies、SAP（企业软件集成）、Ensemble Health Partners（美国医疗收入周期管理）以及
              Bosch（德国工业与汽车）。这些账户覆盖北美、欧洲和亚太，反映出 Cohere 早期的国际企业客户版图。


              金融服务垂直看起来是 Cohere 最主要的收入来源：受监管金融机构（银行、保险公司、资产管理公司）面临严格的数据驻留要求，不能使用 OpenAI 或 Anthropic 的公有云 LLM API，因此
              Cohere 的私有部署模式成了它们自建并微调模型之外唯一可行的商业 LLM 选择。这个垂直也是 ACV 最高的板块，大型银行每年在企业 AI 平台上投入 $1M+。
