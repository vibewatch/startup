companyProfile:
  summary: >-
    Cohere 是一家加拿大 AI 公司，2019 年由 Aidan Gomez、Nick Frosst 和 Ivan Zhang 创立。三位创始人的履历可追溯到 Google Brain 2017 年标志性论文《Attention
    Is All You Need》，这篇论文提出了 Transformer。Cohere 构建并商业化企业级大语言模型，重点押注主权式私有部署：客户把 Cohere 模型完全运行在自有基础设施内，满足数据驻留、GDPR
    和行业合规要求，而这些要求是公有云 AI API 难以覆盖的。公司到 2025 年底 ARR 约 $240M，Series A–E 与战略融资累计约 $1.6B，并通过整合 Aleph Alpha 和新增受监管行业合作扩大欧洲版图。
