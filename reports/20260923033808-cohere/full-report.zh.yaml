  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 论点
      - 什么情况会改变判断
    rows:
      - - 正向论点：Cohere 是唯一在商业规模上实现企业级、真正主权化、多司法辖区部署的 LLM 提供商，ARR 达 $240M，并已在 APAC/EU 获得监管认可
        - 若 Azure OAI 主权方案在 12 个月内实现 FedRAMP High 和 EU AI Act 合规，抹平 Cohere 的监管护城河，则判断改变
      - - 正向论点：North 企业平台不止提供基础 API，还形成持久切换成本，可在 400–600 个账户中支撑高 NRR 和多产品扩张
        - 若披露 NRR 低于 100%，或前 10 大账户流失率超过 15%，则判断改变
      - - 正向论点：收购 Aleph Alpha 扩大 EU TAM，并强化主权 AI 可信度，打开 $500M+ ARR 路径，同时分散地域风险
        - 若 Aleph Alpha 整合超过 18 个月，或 EU 客户在过渡期流失，则判断改变
      - - 正向论点：29x ARR 入场倍数相对 OpenAI/Anthropic 有折价；若 Cohere 到 2028 年执行到 $500M+ ARR，仍有风险调整后的上行空间
        - 若企业 LLM 市场倍数普遍收缩到 <20x，导致 29x 入场价无法收回，则判断改变
      - - 反论点：若版权案不利判决要求训练数据授权，年度授权成本可能增加 $15–30M，永久压缩毛利率
        - 若 Cohere 赢得驳回，或以低于 $20M 和解且保住当前训练数据做法，则判断改变
      - - 反论点：开源模型（Llama 4、Mistral）若拿下 $50–150K ACV 档，将在 2027 年前侵蚀 Cohere 30% 客户基数
        - 若 North 平台采用情况显示 >80% 收入来自平台 ACV（而非基础 API），则判断改变
    notes: 论点 / 反论点是基于公开数据的分析立场。IC 应让管理层压力测试反论点情景。
