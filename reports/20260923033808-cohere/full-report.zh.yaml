      - number: '3.2'
        title: 直接竞争者画像
        blocks:
          - type: paragraph
            body: >
              OpenAI 是塑造市场的在位者。其 GPT-4o 模型在文本、代码、视觉和音频多模态上具备最先进表现。企业产品包括 ChatGPT Enterprise（$30/user/month）、OpenAI API 和
              Azure OpenAI Service（Microsoft 合作，提供带 SOC2、HIPAA 资格和 FedRAMP 合规的企业部署）。OpenAI 上下文窗口按模型不同为 128k–200k
              tokens。它在开发者生态宽度、第三方集成和模型能力基准上领先。OpenAI 共享云 API 会引发数据隐私担忧，而 Cohere 的私有部署可解决这一点。不过，Azure OpenAI 通过在企业自有
              Azure 环境托管 OpenAI 模型，部分中和了这一问题。


              Anthropic 是 Cohere 在受监管行业中威胁最高的直接竞争者。其 Claude Opus 模型在长上下文（1M tokens）和安全基准上领先，并越来越受企业合规团队青睐。TechCrunch
              数据显示，2025 年中 Anthropic 企业 LLM 使用份额为 32%，OpenAI 为 25%。除直接 API 访问外，Anthropic 还可通过 AWS Bedrock 和 Google Cloud
              Vertex AI 使用。定价较高（Claude Opus 输入 / 输出每百万 tokens 为 $5/$25）。Anthropic 尚缺少与 Cohere 本地部署同等规模的真正私有 / 主权云部署选项，但
              AWS GovCloud 和 Bedrock 可服务受监管行业。


              Google（Vertex AI / Gemini）是云原生企业 AI 中最强的竞争者。Gemini 1.5 Pro 支持 1M-token 上下文窗口，深度集成 Google Workspace 和
              Google Cloud，定价也具竞争力（每百万 tokens $2.50/$10）。Google 的企业 AI 平台（Vertex AI Agent Builder）覆盖智能体工作流。弱点在于，Google
              被视为主要是其公有云的超大规模云厂商延伸，而不是主权 / 私有部署供应商，尽管 Google 已推出主权云产品。


              Microsoft（Azure OpenAI Service）是最重要的间接竞争者：它把 OpenAI 模型质量、Microsoft 企业客户关系、Azure 主权云产品和 Microsoft 365 中的
              Copilot 集成结合在一起。企业采用 Azure OpenAI 正在加速，Microsoft 企业销售团队的触达能力远超 Cohere 直销团队。


              Mistral AI 是一家欧洲开放权重模型供应商，明确以隐私优先、可部署模型切入主权 AI 市场。Mistral 模型（Mistral 7B、Mixtral 8x7B、Mistral
              Large）可自托管，无需授权费，性能可与 GPT-3.5 级别竞争。Mistral 的欧洲监管适配（GDPR、EU AI Act）让它成为 Cohere 在欧洲受监管企业账户中的直接替代选项。


              Meta（Llama 系列）以开源方式分发 LLM（Llama 3.1、3.2、4 Scout/Maverick），其许可允许多数企业商用。Llama 模型可在私有 GPU 基础设施上自托管，消除了 Cohere
              的许可费。不过，采用 Llama 的企业必须自己搭建微调、部署、安全和运维基础设施——这一门槛正是 Cohere 当前优势所在。
