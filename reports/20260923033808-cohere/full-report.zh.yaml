      - 总回报（以 $7B 入场）
      - 关键风险
      - 概率信号
    rows:
      - - 牛市（25% 概率）
        - $240M→2026 年底 $450M ARR；2028 年 $700M；North 平台溢价支撑 35x ARR 倍数
        - 2026 年 $18.7B；到 2028 年 IPO 为 $24.5B
        - 3.5x 总回报 / IRR 约 50%（持有 3 年）
        - 倍数扩张假设没有版权不利判决；开源未能追平 Command A
        - 2026 年 Q1–Q2 ARR 增长 >75%；Fortune 500 新客户获取加速；North 平台占 ARR >60%
      - - 基准（55% 概率）
        - $240M→2026 年底 $380M ARR；2027 年 $550M；30x ARR 倍数
        - 2027 年 $16.5B；扣除 30% 稀释后约 $11.4B
        - 1.6x 总回报 / IRR 约 20%（持有 3 年）
        - ARR 增长在 2026 年放缓至 55–60%；版权和解 $15–35M；NRR 约 105%
        - 每季度稳定新增 40–60 个账户；North 平台扩张但未占主导
      - - 熊市（20% 概率）
        - 因版权判决 + Azure OAI 达到同等能力，ARR 在 2026–2027 年停滞于 $200–250M；ARR 倍数 15x
        - 2026 年 $3.7B；扣除稀释后约 $2.6B
        - 0.37x 总回报 / -30% 亏损（持有 3 年）
        - 版权赔偿 >$50M；3 个以上 Fortune 500 客户流失至 Azure OAI；NRR <95%
        - 2026 年 Q1 无 Fortune 500 新客户；版权案进入审判且有惩罚性赔偿敞口
    notes: 概率估计是分析师基于公开信息的判断。所有估值数字均为稀释前企业价值估计。
    claimRefs:
      - CV013
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - ARR / 收入
      - 倍数
      - 与 Cohere 的相关性
      - 局限
    rows:
      - - Anthropic（私有，2025）
        - $3.0B ARR（估算）
        - ~20x ARR（$61.5B 估值）
        - 最直接的私有 AI 可比公司；企业与消费者业务；Claude 模型对标 Command
        - Anthropic 消费者使用更广；安全投入更高，降低可比性
      - - Databricks（私有，2024）
        - $1.6B ARR
        - ~27x ARR（$43B 估值）
        - 数据 + AI 平台；仅面向企业；NRR 强；企业销售打法可比
        - Databricks 收入为正，且数据平台护城河更宽；Cohere 阶段更早
      - - Glean（私有，2025 年 6 月）
        - ~$200M ARR
        - ~36x ARR（$7.2B 估值）
        - 估值相同、ARR 相近；企业 AI 搜索邻近 Cohere 的 RAG/North 使用场景
        - 单一产品 vs Cohere 多产品；TAM 更窄；无主权 / 私有部署护城河
      - - Scale AI（私有，2024）
        - ~$750M ARR
        - ~19x ARR（$14B 估值）
        - AI 数据 / 基础设施；聚焦企业；不是 LLM 提供商，但提供数据服务
        - 较低倍数反映数据服务商品化风险；商业模式不同
      - - Palantir（上市，NYSE：PLTR）
        - 2025 年 $2.7B ARR
        - ~26x NTM 收入（$72B 市值）
        - 企业 AI 平台；政府 + 商业；公开市场定价提供估值地板
        - Palantir 已盈利（GAAP）；Cohere 未盈利；政府 TAM 重心不同于 Cohere 的商业侧重点
      - - Snowflake（上市，NYSE：SNOW）
        - 2025 年 $3.5B 产品收入
        - ~16x NTM 收入（$55B 市值）
        - 成熟企业数据 / AI 平台基准；Cohere 达到 $500M+ ARR 后的潜在公开可比公司
        - Snowflake 收入增长已放缓至 25% YoY；更早期的 Cohere 享有溢价
      - - Harvey AI（私有，2025）
        - ~$100M ARR
        - ~30x ARR（$3B 估值）
        - 垂直企业 AI（法律）；ACV 和成长阶段可比；主权要求相似
        - 垂直领域窄（仅法律） vs Cohere 横向企业；TAM 较小限制可比性
    notes: 所有 ARR / 收入数字均基于公开来源估算；私有公司估值来自已披露融资轮。
    claimRefs:
      - CV001
    enumerationScope:
      coverage: partial
      basis: >-
        Comparable set includes the most publicly relevant private and public AI/data platform companies.
        Less-comparable private AI companies (Mistral, Together AI, Perplexity) are excluded for insufficient ARR
        comparability.
  - id: TV005
    title: 论点破裂与止损触发器表
    columns:
      - 触发器
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 版权不利判决
        - 审判赔偿 >$50M，或禁止使用网页抓取训练数据
        - 毛利率永久受损；训练数据授权每年增加 $15–30M opex；企业信任被削弱
        - 退出仓位；若尚未承诺，诉讼解决前不交割
      - - NRR 低于 100%
        - 任一年度客户群披露 NRR 低于 100%
        - 「先落地再扩张」论点破裂；ARR 增长只能靠新客户；论点退回不计代价增长
        - 重新谈入场价；加入棘轮条款；要求 NRR 改善契约
      - - Azure OAI 主权方案达到同等水平
        - Azure 推出 FedRAMP High + 私有主权部署，在 UX 和价格上匹配 Cohere North
        - 美国市场的主要护城河消失；EU AI Act 只能部分缓冲欧洲护城河
        - 提高 APAC 和 EU 收入审查；将退出权重从 IPO 调整为 M&A（Oracle 收购）
      - - Aidan Gomez 离任
        - CEO 辞任、健康事件或实质性角色变化
        - 自动触发论点破裂；机构投资者要求 CEO 稳定性以支持 IPO 准备度
        - 离任公告后 90 天内退出仓位，除非董事会在 30 天内任命可信 CEO
      - - ARR 连续两个季度 YoY 增长低于 30%
        - 公开披露，或由融资活动停滞推断
        - 估值下调轮风险急剧上升；倍数压缩不可避免；$7B 成为上限而非底线
        - 要求 Series E 重新定价；下轮融资前以折价转为二级交易
    notes: 止损触发器是投资委员会阈值，不是运营管理建议。
    claimRefs:
      - CV011
      - CV013
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人 / 尽调路径
    rows:
      - - 按客户群划分的 Net Dollar Retention（2022–2025）
        - NRR 是唯一最重要的未披露指标；公开来源不可得
        - NRR 低于 100% 会摧毁「先落地再扩张」论点；NRR 高于 120% 将显著提高置信度
        - Cohere CFO；IC 承诺前要求 NDA 数据室访问权限
      - - 版权诉讼敞口评估
        - 估计的和解区间、审判概率和 IP 保险覆盖未公开披露
        - 若敞口为 $50–100M 且无保险，IRR 分析会显著改变；可能需要针对投资计提准备
        - 外部 IP 诉讼律师；要求赔偿结构和 D&O 保险覆盖
      - - FedRAMP 授权时间表
        - 未披露公开里程碑；只有「评估中」状态
        - FedRAMP 是 $8–10B 联邦 TAM 的入口；若还需 24+ 个月，ARR 增长预测要下修
        - Cohere 公共部门 VP；要求正式 FedRAMP 项目计划及机构 ATO 合作伙伴
      - - Series E 优先股堆叠和反稀释条款
        - Series E 投资条款书未公开；Series A–D 清算优先权负担未知
        - 清算优先权负担可能在估值下调轮退出中清零普通股价值；必须建模稀释情景
        - 法律顾问在承诺前审查股权结构表和 Series E 投资条款书
      - - Aleph Alpha 整合里程碑计划
        - 收购后未公开披露整合时间表或里程碑
        - 整合失败会扰乱 EU 客户关系，并增加 $20–40M 一次性整合成本
        - Cohere COO；要求包含季度里程碑和 EU 客户留存数据的整合计划
      - - 盈利路径模型
        - 未公开财务模型或盈亏平衡 ARR 目标
        - 若在当前成本结构下盈亏平衡 ARR 为 $600M+，Cohere 在 IPO 前还需要 2+ 轮融资
        - Cohere CFO；要求 3 年财务模型，包含人数、算力与毛利率构建
    notes: 尽调问题按重要性排序。第 1、2 项是门槛条件；第 3–6 项决定最终仓位。
    claimRefs:
      - CV001
