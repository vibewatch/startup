      - number: '2.2'
        title: 市场规模——TAM、SAM 与可捕获份额
        blocks:
          - type: paragraph
            body: >
              企业 LLM 软件的市场规模估算存在较大分析师分歧。2025 年企业 LLM 市场估计从 Future Market Insights 的 $5.9 billion 到 Global Market
              Insights 的 $8.8 billion 不等；Fortune Business Insights 预测 2026 年为 $5.91 billion，意味着 2025
              年市场略小。差异来自范围定义不同：有些口径纳入 AI 基础设施和托管服务，另一些只计入模型层和平台软件。


              展望 2034 年，分析师共识集中在 $48–$91 billion，CAGR 为 26–30%。下限（$48B，Fortune BI）假设基础模型部分商品化，且开源替代激进推进；上限（$91B，Future
              Market Insights）假设自研模型领导力持续，并向垂直行业扩张。


              Gartner 口径更宽：广义 AI 应用软件支出从 2024 年的 $83.7 billion 升至 2025 年的 $172 billion；不过其中包括 AI 嵌入式企业软件（Salesforce
              AI、SAP Joule、Microsoft Copilot），并非 Cohere 直接市场。尽管如此，这一 TAM 仍可作为企业 AI 预算上限，用来衡量纯 AI 产品可替代的支出池。


              Cohere 的 SAM 应聚焦私有部署企业 LLM 子集。基于分析师估计，Cohere 约 85% 收入来自私有部署；再按当前 ARR（$240M）推算 Cohere 已拿下约 8–10% SAM，则 2025
              年 SAM 约为 $2.4–$3.0 billion，并以接近更广义企业 LLM 市场的 CAGR 增长。主权云市场可作为私有 AI 基础设施层的代理，2025 年单独估计为 $117–$154 billion
              且仍在增长，反映政府和企业围绕数据主权的巨额投入，而这正支撑 Cohere 的部署模式。Cohere 的可获取市场（SOM）只是 SAM
              的一部分——即在当前分销、团队规模和竞争位置下，公司现实可赢得的份额——按当前 ARR 轨迹估计，到 2026 年底为 $300–$600 million。
