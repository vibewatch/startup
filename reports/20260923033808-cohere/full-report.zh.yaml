    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与业务概览
        blocks:
          - type: paragraph
            body: >
              Cohere Inc. 是一家私营人工智能公司，在加拿大安大略省多伦多注册并设总部。公司成立于 2019 年，面向金融服务、医疗、制造、能源和公共部门等受监管行业，开发大语言模型（LLMs）和企业 AI
              软件。它的核心价值主张，是让机构在自有基础设施内部署生成式 AI——本地、私有云或主权云——而不是把敏感数据送入共享公有云 API。这套架构给企业买家提供数据驻留、合规和安全保证，受监管行业因此才有条件真正采用
              AI。


              Cohere 主要靠私有部署工作负载的多年期软件许可变现。约 85% 收入来自这些私有部署；由于 Cohere 不承担共享推理基础设施所需的资本开支，也避开负单位经济，相关业务呈现 70–80% 的 SaaS
              式毛利率。其余收入来自 Cohere 托管云上的 API 用量，客户按 token 付费。Cohere 产品组合覆盖生成模型（Command A
              系列）、检索模型（Embed、Rerank）、语音识别（Transcribe）、多语言研究模型（Aya，覆盖 70+ 种语言），以及用于企业工作流自动化的 North 智能体 AI 平台。到 2026 年 2
              月，公司年化收入约 $240 million，高于 2023 年底的 $13 million，相当于 26 个月里复合增长约 10×。
