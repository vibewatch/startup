      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              Cohere 由三位研究员联合创立，他们在 University of Toronto 结识，并曾在 Google Brain 工作。Aidan Gomez 现任 CEO，是 2017
              年里程碑论文《Attention Is All You Need》的最年轻共同作者（当时 20 岁）；该论文提出了支撑几乎所有现代 LLM 的 Transformer 架构。Nick Frosst
              是联合创始人兼研究副总裁，也曾是 Google Brain 研究员和音乐人，以机器学习研究闻名。Ivan Zhang 是联合创始人兼 CTO，在加入 Cohere 前曾与 Gomez 在 FOR.ai
              合作。三人均在 University of Toronto 完成学业。


              2025 年，Cohere 明显加厚了高管层。Martin Kon 于 2022 年 12 月从 YouTube 加入，担任总裁兼 COO，此前他在 YouTube 任 CFO。2025 年 8 月，Cohere
              聘请 Joëlle Pineau 出任首席 AI 官；她曾任 Meta AI Research 副总裁，也是蒙特利尔知名 AI 研究员。同月，公司聘请 Francois Chadwick（前 Uber
              CFO、KPMG US 合伙人）担任首任 CFO。Phil Blunsom 曾在 Google DeepMind 任职，现任首席科学家。董事会和治理结构未公开披露，但 Radical
              Ventures、Inovia Capital、PSP Investments、NVIDIA 和 Salesforce Ventures 等投资方拥有董事会代表权，这是其投资条件之一。Cohere Labs
              是一家非营利开源研究机构，2022 年 6 月成立；Sara Hooker 于 2025 年 9 月离任后，目前由 Marzieh Fadaee 领导。三位创始人仍保有强影响力，公司也没有出现 CEO
              接班压力迹象。
