      - number: '6.4'
        title: 图表
        blocks:
          - type: callout
            title: 具名企业锚点为销售提供可信参考覆盖
            body: >
              Cohere 公开客户名单横跨三大洲和多个垂直：Oracle（技术，美国）、Fujitsu（IT 服务，日本）、LG CNS（韩国）、RBC Royal Bank（金融服务，加拿大）、Ensemble
              Health（医疗，美国）、Bosch（工业，德国）、SAP（企业软件，欧盟）和 Dell（硬件，美国）。这种地域和垂直多样性，让 Cohere 企业销售团队在跨行业、跨区域销售对话中拥有可信参考集。Oracle
              和 SAP 既是客户又是分销伙伴，尤其有价值——Oracle 的 OCI 客户基础和 SAP 的 400K+ 企业客户基础，意味着巨大的潜在 Cohere 分销杠杆，而这一点尚未体现在当前 ARR 运行率里。
            calloutType: strength
            claimRefs:
              - CU001
          - type: callout
            title: 头部账户收入集中与版权诉讼是两项实质客户风险
            body: >
              两个因素叠加，形成两项实质客户风险：（1）估计 40–60% 的 ARR 集中在前 10 个企业账户；（2）正在进行的 Condé Nast 版权诉讼已进入证据开示（2025 年 11
              月驳回动议被否）。收入集中是 Cohere 当前阶段和 ACV 模型的结构性结果——公司需要 3–5
              年扩大客户基础，才能降低这项风险。版权诉讼风险更急迫：受监管金融机构、医疗公司和政府实体的企业法律顾问，对存在未决版权主张的 AI 供应商通常高度规避风险；案件进入证据开示阶段，意味着不确定性至少会持续到
              2026–2027。
            calloutType: risk
            claimRefs:
              - CU019
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律与监管风险
        blocks:
          - type: paragraph
            body: >
              Cohere 近期最尖锐的法律敞口，来自 Condé Nast、Raw Story 及其他出版商 2023 年 12 月在纽约南区法院（SDNY）提起的版权侵权诉讼。驳回动议在 2025 年 11
              月被否决，案件进入证据开示，并可能在 2026–2027 年走向审判。如果判决不利，美国《版权法》下的法定赔偿可能达到每件侵权作品数千万美元。更关键的是，诉讼可能迫使 Cohere
              调整训练数据做法，带来持续授权成本，或限制其访问支撑企业 LLM 的网络抓取语料。 [CR001] [CR002] [CR003]

              监管方面，欧盟《AI 法案》针对通用 AI（GPAI）系统性风险的条款，已于 2025 年 8 月对训练量超过 10^25 FLOPs 门槛的基础模型提供商生效。Cohere 的 Command A
              几乎肯定符合范围。义务包括模型能力评估、对抗性测试、向 EU AI Office 提交透明度报告，以及网络安全事件通报。不合规罚款最高可达全球年营业额的 3% 或 €15 million，以较高者为准。
              [CR004] [CR005] [CR006]

              Cohere 尚未进入 FedRAMP Authorized marketplace——尽管已有初步列名——这是一个战略风险，会限制其进入美国联邦民事机构合同，相关 TAM 估计每年 $8–10
              billion。Cohere 的私有部署架构把客户数据留在本地，对 GDPR 敞口有一定缓释；不过欧盟客户仍需面对 AI Act 的透明度和人工监督要求。加拿大 AIDA（Artificial
              Intelligence and Data Act）于 2022 年提出，截至 2026 年初仍在推进，可能给 Cohere 加拿大业务增加额外合规负担。 [CR007] [CR008] [CR009]
            claimRefs:
              - CR008
          - type: table
            tableRef: TR001
