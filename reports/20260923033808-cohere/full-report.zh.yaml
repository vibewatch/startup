      - number: '1.5'
        title: 展示材料
        blocks:
          - type: callout
            title: Transformer 发明者背景与企业定位
            body: >
              Cohere 创始团队包括 Aidan Gomez；他是提出 Transformer 架构那篇论文的最年轻共同作者，而 Transformer 是几乎所有现代 AI 系统的基础。这一履历给 Cohere
              带来深厚的模型研发可信度。同样重要的是企业优先的商业模式：Cohere 聚焦受监管行业的私有与主权部署，瞄准的是无法、也不愿使用公有云 AI 服务的客户群。相比 OpenAI 和
              Anthropic，这形成了耐久差异化；后两者主要是消费者 / 开发者云业务。多年期合同带来的 70–80% 毛利率，说明 Cohere 的商业位置确实不同。
            calloutType: strength
            claimRefs:
              - CO007
              - CO017
          - type: callout
            title: 活跃版权诉讼带来重大法律敞口
            body: >
              Condé Nast、Forbes、The Guardian、LA Times 等主要出版商在 2024 年 2 月提起诉讼，指控 Cohere
              未经许可使用受版权保护的文章训练模型，并称其模型会逐字复现内容。法院在 2025 年 11 月驳回 Cohere 的撤诉动议，意味着案件将进入证据开示。潜在赔偿可能达到每件侵权作品
              $150,000。若判决不利或大额和解，Cohere 财务会受损，训练数据改造成本会被迫上升，并可能为 LLM 版权责任树立全行业先例。
            calloutType: risk
            claimRefs:
              - CO001
          - type: callout
            title: 平台扩张显示公司正从模型供应商转向企业操作系统
            body: >
              2025 年 1 月 North 智能体平台上线，2026 年 4 月又宣布 Aleph Alpha 收购谈判；两件事都表明 Cohere 正从基础模型 API 供应商，演进为更宽的企业 AI
              操作系统。这条路径类似 Salesforce 从 CRM 走向平台，或 Databricks 从 Spark 走向
              lakehouse。若执行成功，平台宽度会创造切换成本，并打开模型许可之外的新收入流。仍在推进中的 Aleph Alpha 交易，将补上欧洲主权云分销和多语言欧洲语种模型能力。
            calloutType: insight
            claimRefs:
              - CO001
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >
              Cohere 所在市场可按三层颗粒度定义。最宽的框架是企业 AI 应用软件：所有嵌入 AI 或使用基础模型来自动化、增强或辅助企业工作流的软件应用。Gartner 估计该市场 2024 年规模为 $83.7
              billion，2025 年为 $172 billion，一年内接近翻倍，反映 AI 正加速嵌入企业软件栈。这个框架包含由 AI 增强的 CRM、ERP、生产力、HR 和行业软件，范围远超 Cohere
              的核心市场。


              更精确的市场是企业 LLM 软件：服务企业买家的平台、API 和模型，帮助其部署、微调或运行大语言模型，用于知识工作、文档处理、决策支持和工作流自动化。按分析师口径不同，2025 年该市场估计为
              $5.9B–$8.8B。它明确排除消费者 AI 应用（ChatGPT 免费层、面向消费者的 Gemini）、云 AI 基础设施 / IaaS 和 AI 硬件。Cohere 直接竞争的正是这个细分。


              在企业 LLM 软件内，Cohere 的具体子市场是私有部署企业 LLM：企业因无法把敏感数据传至共享公有云 API，必须采用本地、VPC 或主权云托管的 LLM。监管驱动因素——欧洲 GDPR、美国医疗
              HIPAA、银行和国防行业规则，以及 EU AI Act——让这一子市场与一般企业 LLM 市场显著不同。该子市场估计约占更广义企业 LLM 市场的 25–35%，也就是 2025 年 Cohere
              的可服务目标市场约 $1.5–$3.0B。
            claimRefs:
              - CM003
              - CM004
              - CM006
          - type: table
