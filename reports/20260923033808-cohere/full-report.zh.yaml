      - number: '7.3'
        title: 战略风险、财务敞口与缓释
        blocks:
          - type: paragraph
            body: >
              开源模型达到能力持平，是 Cohere 商业模式的生存级战略风险。Meta 的 Llama 4、Mistral Large 2 和 Alibaba 的 Qwen2.5-72B
              已经证明，开放权重模型在许多基准上可以追平甚至超过闭源中端企业模型表现。如果开源模型做到企业级可靠性——包括微调流水线、RAG 和私有部署支持——Cohere 的按 token
              计价溢价会更难维持。真正差异化的护城河仍是 North 企业平台和合规姿态，而不是基础 LLM 本身。 [CR033] [CR034] [CR035]

              伙伴集中风险偏高。Oracle 持有股权，也是关键分销伙伴；Microsoft Azure 一边提供 Azure OpenAI Service（Cohere 的直接竞争对手），一边又为部分 Cohere
              工作负载提供云基础设施。这造成结构性张力：Cohere 最重要的分销伙伴，也在推进竞争产品。AWS Bedrock marketplace 上架带来分销，但也把 LLM 访问商品化，压缩 Cohere 的定价权。
              [CR036] [CR037] [CR038]

              根据披露的研发员工数和算力成本、相对 $500M+ 资产负债表估算，Cohere 每年烧钱约 $80–120 million。在 $240M ARR、平台订阅约 80% 毛利率的情况下，Cohere
              尚未盈利；企业销售周期 6–18 个月，获客成本很高。主要打破投资逻辑的情景包括：（a）版权案不利判决带来 >$50M 责任；（b）两个或更多 Fortune 500 客户因 Azure OpenAI
              主权能力追平而流失；（c）开源模型消灭中端市场定价层；（d）Aidan Gomez 在 Series E+ 退出事件前离开。 [CR039] [CR040] [CR041] [CR042]

              已有缓释包括：私有部署架构降低数据主权敞口；SOC 2 和 ISO 27001 认证支撑受监管行业销售；多司法辖区总部结构（Toronto + London + San
              Francisco）提供监管套利空间；North 企业平台在基础模型访问之外创造切换成本。足以支持提前退出的判据包括：版权赔偿超过保险覆盖、NRR 低于 90%，或 Command API 定价跌破
              $0.50/1M tokens（开源替代信号）。
            claimRefs:
              - CR008
