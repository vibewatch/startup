      - number: '5.2'
        title: 架构、基础设施与技术差异化
        blocks:
          - type: paragraph
            body: >
              Cohere 的技术架构以“私有部署优先”为核心：所有产品都用 Docker 和 Kubernetes 做成容器化形态，部署在客户自己控制的基础设施上（本地 GPU 集群、AWS、Azure、Google
              Cloud 或 Oracle Cloud Infrastructure 上的 VPC），无需把数据传回 Cohere 服务器。私有部署能满足受监管行业的数据驻留和数据主权要求，而公有云 API 部署做不到；这正是
              Cohere 最核心的技术差异点。


              模型训练在大规模 NVIDIA H100 GPU 集群上完成（Command A 这种规模的模型，单次训练估计要消耗数万 GPU 小时）。训练之后，模型会被封装成容器化服务，再通过 Cohere
              的私有部署项目交付给客户。推理优化采用标准 LLM 推理服务技术，包括 KV cache 管理、speculative decoding 和 continuous batching（兼容 vLLM
              的推理服务基础设施）。私有部署把推理基础设施成本转给客户承担，这是 Cohere 高毛利率的关键来源。


              Cohere 最主要的技术护城河在检索：Embed v3 和 Rerank 在 MTEB（Massive Text Embedding
              Benchmark）排行榜上，在检索、语义相似度和分类任务中持续位居第一梯队。这个技术优势更耐久，因为高质量向量嵌入
              模型需要围绕检索专用数据做大规模监督训练——训练目标和数据集都不同于生成模型训练，竞争对手不能只靠放大生成模型就轻易复制。


              North 平台接入企业身份体系（SAML、SSO）、企业数据连接器（通过 REST API 和官方连接器 SDK 提供 100+
              集成）以及企业安全控制（基于角色的访问控制、审计日志、数据防泄漏集成）。平台后端基于 Python/FastAPI，前端基于 React；云环境采用 Kubernetes 原生 部署，自托管企业部署则提供
              Helm chart。
