      - number: '3.4'
        title: 展示材料
        blocks:
          - type: callout
            title: Azure OpenAI 是 Cohere 定位的最大单一竞争威胁
            body: >
              Microsoft 的 Azure OpenAI Service 把前沿 OpenAI 模型质量和企业级 Azure 合规基础设施结合起来，包括 SOC 2、FedRAMP High、HIPAA BAA
              和主权云部署。对已经在 Microsoft 365 和 Azure 生态内的受监管企业——也就是大多数大型企业——Azure OpenAI 是一个有吸引力的 Cohere 替代方案，能缓解 Cohere
              赖以成立的数据主权问题。Microsoft 企业销售团队触达能力远超 Cohere，Azure 主权云足迹覆盖欧盟、美国政府和亚太。若 Azure OpenAI 在 2025–2026
              年成熟其私有部署模型，Cohere 的核心差异化会明显走弱。
            calloutType: risk
            claimRefs:
              - CP019
              - CP022
          - type: callout
            title: 同类最佳检索模型创造黏性的技术护城河
            body: >
              Cohere 的 Embed 和 Rerank 模型被独立认可为市场上最强的企业检索模型之一，这一能力不同于生成模型基准。RAG（retrieval-augmented generation）架构是企业 LLM
              部署的主流模式，意味着不管企业使用哪种生成模型，Cohere 的检索模型都可嵌入企业 AI 管线。这给 Cohere
              打开了进入企业账户的第二条路径，竞争者不容易复制，因为检索模型质量独立于生成模型基准，需要不同的训练数据和优化目标。
            calloutType: strength
            claimRefs:
              - CP016
              - CP017
          - type: callout
            title: 开源替代风险真实存在，但平台层可缓冲
            body: >
              Meta Llama 4 和 Mistral Large 模型已经显著缩小与商业前沿模型的能力差距，两者也都可零授权费自托管，因而成为 Cohere 模型层的可信替代品。不过，自托管开源 LLM
              的企业必须自行搭建微调管线、部署基础设施、安全监控、合规工具和企业支持关系。Cohere 的 North
              平台和企业支持主张，正是为在商品化模型之上的运营层竞争而设计；即便底层基础模型商品被侵蚀，它仍可收取平台溢价。
            calloutType: insight
