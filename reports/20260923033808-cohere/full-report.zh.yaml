  - id: FR001
    title: 风险热力图——可能性与影响
    type: matrix
    summary: 九宫格热力图按可能性和影响严重度定位 Cohere 的主要风险。版权诉讼与关键人物离任处在高影响、中高可能性象限。开源模型追平与 EU AI Act 落在高概率、影响中等至严重的位置。
