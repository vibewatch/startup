      - number: '8.2'
        title: 可比估值与情景分析
        blocks:
          - type: paragraph
            body: >
              Cohere 的 29x ARR 倍数处在成熟私有 AI/SaaS 基准区间内。直接可比公司包括 Anthropic 约 20x ARR（$61.5B 对约 $3B ARR）、Databricks 约 27x
              ARR（$43B 对 $1.6B ARR）、Glean 约 36x ARR（$7.2B 对约 $200M ARR），以及 Scale AI 约 19x ARR（$14B 对约 $750M
              ARR）。公开市场可比公司（Palantir、Snowflake）的估值为未来 12 个月收入（NTM）的 15–26x，为终局倍数假设提供下限。Cohere 的 29x
              位于可比组中段——既不是便宜货，也不是离群高估。 [CV015] [CV016] [CV017] [CV018]

              基准情景假设 Cohere ARR 从 $240M（2025）增长到 $380M（2026E），同比约 58%——相比 2024–2025 年 $140–240M 的增长（71%）已明显降速。如果 2027 年
              ARR 可达 $550M，并采用 30x ARR 倍数，隐含企业价值 $16.5B，相比 $7B 进入估值对应 2.4x 总回报；若持有 3 年并计入未来轮次 20% 稀释，IRR 约 35–40%。乐观情景假设
              2026 年底 ARR 达 $450M，且 North 平台溢价支撑 35x 倍数，对应 $18.7B 估值和 2.7x 回报。悲观情景假设版权和解后 ARR 增速降至 25%，倍数压缩到 15x，则 2026
              年底终值为 $4.5B——进入价亏损 36%。 [CV019] [CV020] [CV021]

              按情景概率加权（乐观 25%、基准 55%、悲观 20%），预期退出价值约为 $11.7B，相当于 $7B 进入价上的 1.67x
              总回报——后期风险投资的预期收益为正，但回报偏薄。回报形态不对称：在当前进入倍数下，按概率加权后的下行大于上行。 [CV022] [CV023]
            claimRefs:
              - CV001
          - type: table
            tableRef: TV002
            claimRefs:
