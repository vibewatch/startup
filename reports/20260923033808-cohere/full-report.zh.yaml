      - number: '4.3'
        title: 财务结论与尽调缺口
        blocks:
          - type: paragraph
            body: >
              Cohere 的财务画像呈现出有吸引力的增长故事，同时伴随显著执行风险。公司在短时间内做到有意义的 ARR 规模（$240M），收入模式以高毛利为主（85% 私有部署 ACV），本质上比纯 API
              消耗更有价值。战略投资人协同降低商业风险：NVIDIA、Oracle、AMD、Salesforce 和 Cisco 合计为 Cohere 提供其独立难以触达的企业账户联销渠道。


              主要财务风险包括：（1）收入集中——前 10 大客户大概率贡献 40–60% ARR（这一阶段企业软件公司的行业常态），若一两个大合同流失，将产生流失风险；（2）模型训练资本强度——Cohere
              必须持续投资前沿模型质量以保持竞争同等水平，需要继续融资或最终实现盈利；（3）商品化压力——如果企业客户迁移到开源替代（Llama 4、Mistral）或 Azure OpenAI
              主权云，收入增长可能显著放缓；（4）缺少公开财务数据，无法独立验证毛利率、净美元留存、CAC 回本周期或运营杠杆。


              参与 Series E、老股交易或成长期投资的 VC，应重点核查：（1）NDA 下取得董事会批准的 ARR、NRR 和毛利率数据；（2）客户合同清单（按 ACV 排名前 20
              的客户、续约日期和留存历史）；（3）每美元收入的全成本算力成本（GPU 集群 CapEx + OpEx 分摊）；（4）烧钱速度以及到下一轮融资或盈利事件的现金跑道；（5）多年期 ACV
              合同的收入确认政策（预收确认 vs 按期确认）。
            claimRefs:
              - CI001
      - number: '4.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 大额私有部署合同收入集中带来流失敞口
            body: >
              Cohere 85% 收入集中在私有部署 ACV 合同上，这对毛利率画像有利，但也带来合同集中风险。ARR 达 $100–300M 规模的企业软件公司，通常前 10 大客户占总 ARR 的 30–60%。如果
              Cohere 私有部署客户基础集中在少数超大合同中（受监管行业聚焦也暗示了这一点），哪怕两三个大账户不续约，也可能实质性影响 ARR 增长。Cohere 未披露 NRR
              或留存指标，这是判断收入质量时最重要的单一未知项。
            calloutType: risk
            claimRefs:
              - CI019
          - type: callout
            title: 高毛利 ACV 模型叠加战略联销伙伴，在 Series E 阶段并不常见
            body: >
              三个因素叠加在 Cohere 这个阶段并不常见：（1）85% 企业 ACV 收入，具备高可预测性和高毛利；（2）战略投资人同时也是分销伙伴（Oracle Cloud、NVIDIA DGX、Salesforce
              CRM、Cisco networking）；（3）差异化私有部署产品，现有巨头不能轻易复制。这一组合意味着，公司在规模化后有更可信的盈利单位经济路径，强于纯 API 消耗模式。联销伙伴结构实际上补贴了
              Cohere 的企业销售，让公司相对自身直销人手，在大型企业账户中能打出更大存在感。
            calloutType: strength
            claimRefs:
              - CI004
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品套件与能力
        blocks:
          - type: paragraph
            body: >
              Cohere 产品线分为两个板块：AI 模型（生成、检索和分类模型层）以及 AI 平台（North 和 Compass，即编排与部署层）。模型层包括：Command A（256k 上下文、111 billion
              参数，针对企业智能体任务和私有部署优化）、Command R+（128k 上下文，专门面向检索增强生成）、Embed v3（用于语义搜索和文档检索的最先进文本 embedding 模型）、Rerank（用于提升
              RAG 管线检索精度的 cross-encoder 模型）、Aya（覆盖 70+ 种语言的多语言生成模型）以及 Transcribe（面向企业语音和呼叫中心用例的音频转文本模型）。


              平台层包括 North 和 Compass。North 是 2025 年 1 月推出的企业智能体 AI 工作流平台，提供预置连接器，接入 100+
              个企业应用（Salesforce、ServiceNow、Google Workspace、Microsoft 365、SAP、Confluence）。Compass 是 AI
              搜索与发现工具，允许企业在内部文档库之上构建 RAG 应用，而无需编写自定义检索管线。平台层合在一起，是 Cohere 应对基础模型 API 商品化的主要答案：Cohere
              试图通过具备企业工作流集成的平台层，在模型本身之外创造切换成本。


              Command A 于 2025 年 3 月发布，代表 Cohere 最新一代基础模型。它值得注意之处，是把部署效率置于原始基准表现之上：111B 参数、混合专家（MoE）架构，使其可在共享 GPU
              集群上服务多个企业租户，单位 token 推理成本低于能力相近的稠密模型。256k 上下文窗口支持长文档企业工作流（法律合同审查、监管合规文档、财务报告分析），但落后于 Anthropic 1M 上下文的
              Claude 和 Google 的 Gemini 1.5 Pro。
            claimRefs:
              - CE001
