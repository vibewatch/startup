  - id: FV002
    title: 估值敏感性——ARR 倍数情景
    type: bar
    summary: >-
      以 $240M ARR（2025）和预计 $380M ARR（2026E）为锚，观察不同 NTM ARR 倍数对 Cohere 隐含企业价值的敏感性。当前 $7B 估值对应 FY2025 ARR 的 29x，或约 2026E
      ARR 的 18x。
    data:
      items:
        - label: FY2025 ARR（$240M）的 15x
          value: 3600
          detail: 悲观情景倍数——版权案判决后、开源模型追平的情景
        - label: FY2025 ARR（$240M）的 20x
          value: 4800
          detail: 降估值融资情景——市场环境压缩倍数
        - label: FY2025 ARR（$240M）的 25x
          value: 6000
          detail: 较可比公司折价——反映诉讼阴影
        - label: FY2025 ARR（$240M）的 29x
          value: 6960
          detail: 当前 Series D 入场倍数（由 $7B 估值隐含）
        - label: 2026E ARR（$380M）的 30x
          value: 11400
          detail: 2026 年基准情景估值——增长按计划推进，但倍数压缩
        - label: 2026E ARR（$380M）的 35x
          value: 13300
          detail: 基准+ 情景——North 平台溢价维持
        - label: 2027E ARR（$550M）的 40x
          value: 22000
          detail: 2027 年乐观情景——达到 IPO 准备规模，并享受溢价倍数
    approximationNotes: ARR 倍数仅用于示意性敏感性分析；2026E 和 2027E ARR 是分析师估计，依据已披露的 2025 年 $240M ARR 以及此前披露的增速推算。
    claimRefs:
      - CV001
  - id: FV003
    title: 估值与回报区间——乐观 / 基准 / 悲观
    type: range
    summary: 各情景的低 / 中 / 高退出估值区间。基准情景下，2027 年退出企业价值约为 $11–14B；相对 $7B 入场价，概率加权预期价值约 $11.7B，毛回报温和，为 1.67x。
    data:
      items:
        - label: 悲观情景退出 EV（$B）
          low: 2.5
          mid: 3.5
          high: 4.5
        - label: 基准情景退出 EV（$B）
          low: 8
          mid: 10.5
          high: 13
        - label: 乐观情景退出 EV（$B）
          low: 13
          mid: 16
          high: 20
        - label: 概率加权预期 EV（$B）
          low: 8.5
          mid: 11.7
          high: 14.5
    approximationNotes: 所有数字均为 $B 企业价值（稀释前）。IRR 计算假设后续轮次带来 20–25% 稀释，但 EV 区间未纳入稀释。概率权重：悲观 20%，基准 55%，乐观 25%。
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV022
  - id: FV004
    title: 投资 KPI——可提交 IC 的评分
    type: kpi
    summary: 八个关键投资维度按 0–10 分打分。Cohere 在市场机会（9）、管理层（8）和产品差异化（8）上得分较强，但受风险画像（5）和估值安全边际（5）拖累。综合评分 6.9/10，支持有条件投资建议。
    data:
      items:
        - label: 市场机会
          value: 9
          detail: 到 2030 年企业 LLM TAM 达 $130–150B；主权 AI 是 $30B+ 细分市场；Cohere 卡位有利
        - label: 产品差异化
          value: 8
          detail: North 平台 + 私有部署护城河；256k 上下文；多语言；真正达到企业级
        - label: 商业验证
          value: 7
          detail: 约 400–600 家企业贡献 $240M ARR；已披露 8+ 个 Fortune 500 具名客户；但 NRR 未披露
        - label: 管理团队
          value: 8
          detail: Aidan Gomez（Attention Is All You Need 共同作者）；联合创始人阵容强；已识别关键人物风险
        - label: 财务效率
          value: 6
          detail: 平台毛利率 80%+；算力消耗高；ARR 达到 $500M 前盈利路径不清晰
        - label: 风险画像
          value: 5
          detail: 版权诉讼（重大）；关键人物；开源替代；Azure OAI 能力追平——4 条并行风险向量
        - label: 估值 / 入场
          value: 5
          detail: 29x ARR——处于可比公司范围内，但安全边际薄；1.67x 概率加权回报低于 VC 目标中位数
        - label: 证据质量
          value: 7
          detail: 产品和融资证据强；财务证据弱（NRR、CAC、烧钱速度未披露）；法律敞口可部分量化
    claimRefs:
      - CV001
