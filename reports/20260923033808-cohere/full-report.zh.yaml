      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 监管顺风把数据隐私合规变成市场强制项
            body: >
              EU AI Act、GDPR 和行业规则（HIPAA、FINRA、MAS）不只是保护消费者；它们正在结构性地迫使受监管企业放弃公有云 AI API，转向私有部署架构。这就是 Cohere
              的长期顺风：原本为通用云计算制定的法规，如今正在套用到 LLM API 上；在许多垂直行业，合规答案就是 Cohere 式私有部署。随着执法成熟、更多司法辖区出台 AI 专属数据驻留规则，Cohere
              模型的可触达市场会扩大，而且不需要 Cohere 额外投入客户教育。
            calloutType: insight
            claimRefs:
              - CM026
          - type: callout
            title: 开源 LLM 商品化威胁商业模型授权费
            body: >
              Meta 的 Llama 3 和 Mistral 的开源模型能力已足够强、可免费获得，并能本地部署——讲的是与 Cohere 相同的架构故事，但基础模型授权成本为零。拥有 ML 工程团队的企业，已经可以以低于
              Cohere 平台许可的 TCO 自托管有竞争力的模型。如果开源质量缩小与前沿商业模型的剩余差距（大概率在 2026–2027 年），Cohere 模型费用的主要正当性会变弱。因此，Cohere
              的平台层（North）、智能体能力、微调工具和企业支持，正越来越成为商品化模型层之上的差异化关键。
            calloutType: risk
            claimRefs:
              - CM003
          - type: callout
            title: 市场时点有利：AI 预算扩张正让企业支出翻倍
            body: >
              按 Gartner，企业 AI 应用软件支出从 2024 年的 $83.7 billion 几乎翻倍至 2025 年的 $172 billion，并预计 2026 年达到 $270
              billion。这一预算扩张具有结构性：大型机构已经承诺多年期 AI 转型计划，无论市场状况如何，都将支撑采购周期。Cohere 位于这轮支出浪潮中的受监管企业板块，因合规要求，该板块增长最快，也最具防御性。
            calloutType: strength
            claimRefs:
              - CM003
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图概览
        blocks:
          - type: paragraph
            body: >
              Cohere 的竞争横跨三层：（1）具备强企业销售能力的前沿模型供应商——OpenAI（通过 Microsoft Azure 和直销）、Anthropic（通过 AWS Bedrock 和直销）以及
              Google（Vertex AI）；（2）位于模型层之上的企业平台供应商——Microsoft Copilot、Salesforce Einstein AI、ServiceNow AI Platform 和
              IBM Watson；（3）开源和可自托管模型提供方——Meta（Llama 系列）、Mistral AI 以及开源社区。第四类新兴竞争者，是 Writer（面向内容工作流的企业 AI）和 Glean（企业 AI
              搜索）等垂直聚焦企业 AI 平台；它们服务相邻用例，但正越来越争夺同一笔 AI 平台预算。


              竞争版图变化很快。TechCrunch 分析显示，2025 年中，Anthropic 以企业 LLM 使用份额约 32% 超过 OpenAI，成为企业使用最多的 LLM 提供商，而 OpenAI 约为
              25%。Google 和 Microsoft / Azure 合计持有剩余份额。Cohere、Writer 和其他专精厂商绝对份额仍小，但在受监管行业细分中增长。


              Cohere 的明确定位是“面向受监管和主权部署的企业 AI”，这创造了一个半受保护的利基市场：OpenAI 和 Anthropic 以公有云为主的部署模式，在这里存在结构性劣势。不过，Azure OpenAI
              Service（Microsoft 在企业 Azure 环境中托管 OpenAI 模型，包括主权云）是对这一定位最清晰的威胁，因为它在 Microsoft 企业生态和合规云基础设施内提供 OpenAI 模型质量。
