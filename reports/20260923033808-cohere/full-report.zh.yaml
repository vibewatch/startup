      - number: '2.3'
        title: 买方分层与采用动态
        blocks:
          - type: paragraph
            body: >
              企业 LLM 买家集中在五个受监管垂直行业：金融服务（银行、保险、财富管理）、医疗和生命科学、政府和公共部门、制造和工业、零售和消费品。其中，金融服务的企业 AI 预算最大，数据主权要求也最严；医疗次之，但面临
              HIPAA 和患者数据隐私约束，要求本地或私有部署。联邦和国家层面的政府买家常受主权云要求约束，分类或敏感工作负载会直接排除美国超大规模公有云。


              企业 LLM 采购预算权主要在首席信息官（CIO）或首席技术官（CTO）手中，他们掌管基础设施和软件预算。CISO 的否决权也在上升，因为 AI
              部署必须满足安全和合规政策。首席数据官（CDO）和首席数字官会从业务侧发起许多 AI 项目。实际采购中，企业 AI 通常要经过多方委员会（IT、安全、法务、业务单元），大型合同销售周期因此拉长到 6–18 个月。


              企业 AI 采用正处在拐点：78% 机构已在至少一个职能中部署 AI（高于 2023 年的 55%），但只有 6% 可算作产生转型影响的“AI 高绩效者”。差距来自从试点走向生产的难度：70–85% 企业 AI
              项目未达预期，主要原因是数据质量、集成复杂度、治理缺口和变革管理不足。这一失败率为 Cohere 的 North 平台层和 Compass 产品创造了耐久市场，因为它们定位于提高部署成功率。2024
              年，单个机构平均企业 AI 支出为 $1.9 million；按已披露客户画像推断，Cohere 多年期合同大概率在每年 $500K–$5M 区间。
