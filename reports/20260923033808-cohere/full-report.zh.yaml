      - number: '1.4'
        title: 增长里程碑与轨迹
        blocks:
          - type: paragraph
            body: >
              Cohere 的发展可分为三个阶段。第一阶段（2019–2022）：创立、早期模型开发，并推出带文本生成、embedding 和分类端点的公开 API。Cohere 覆盖 100+ 种语言的多语言 Embed
              模型，使其有别于 OpenAI 以英语为中心的产品。第二阶段（2023–2024）：转向企业优先的私有部署。ChatGPT 和 Claude 放大了消费者 / 开发者关注后，Cohere
              重新定位于受监管行业企业客户；这些客户不愿把敏感数据送入公有云。公司由此拿下 Oracle、RBC、Fujitsu、LG CNS、Dell、SAP 等多年期合同。ARR 从 2023 年底 $13 million
              增至 2025 年 5 月 $100 million，17 个月约增长 7×。第三阶段（2025 至今）：平台扩张和国际化增长。North 智能体 AI 平台于 2025 年 1 月推出，推动 Cohere
              从基础模型上移到企业工作流自动化。国际收入占比不到一年从约 15% 升至约 45%，主要由日本 Fujitsu 和韩国 LG CNS 拉动。2025 年 5 月，Cohere 收购
              Ottogrid（温哥华，企业市场研究自动化）。公司于 2025 年 6 月与加拿大和英国签署政府 AI 合作。2026 年 4 月，Cohere 宣布正讨论收购德国 Aleph
              Alpha，这将显著扩展其欧洲主权云版图；2026 年 9 月，TD 宣布与 Cohere 建立最高 $25 million 的战略关系，以支持受监管工作负载采用 AI。2024 年 2 月，由 Condé
              Nast、Forbes、The Guardian、LA Times 等主要新闻出版商组成的联盟提起版权侵权诉讼；2025 年 11 月，法院驳回 Cohere 的撤诉动议，该案构成重大持续法律风险。
            claimRefs:
              - CO016
