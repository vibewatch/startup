      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              Cohere 所在市场的首要增长驱动，是监管压力推动私有和主权 AI 部署。EU AI Act（2025–2026 年开始执行）把许多企业 AI
              应用划为“高风险”，要求透明性、可解释性和审计轨迹；这些要求在私有部署架构中更容易满足。若第三方云 AI 提供商导致数据泄露，GDPR 罚款会带来直接财务风险，而私有部署可降低这一风险。美国 HIPAA
              适用实体也面临类似约束。上述监管框架把 Cohere 的私有部署模式从小众选项，变成大块市场的合规必需架构。


              次级增长驱动包括企业 AI 预算周期加速——按 Gartner，AI 应用软件支出从 $83.7B（2024）翻倍至 $172B（2025）——以及企业成功实施 AI 后的 ROI 证明，行业调查称平均每投入
              $1 可带来 $3.70 回报。地缘政治因素也推动主权云投资：欧洲政府（尤其德国、法国、英国）和亚太政府（日本、韩国、新加坡）要求本地 AI 基础设施，而不是依赖美国超大规模云厂商，这利好 Cohere 与
              Fujitsu（日本）、LG CNS（韩国）和英国政府的合作。


              主要采用约束包括：开源 LLM 竞争（Meta 的 Llama、Mistral），让企业可以不付自研模型费用就自托管可用模型；AI 项目失败率高，削弱预算负责人信心；私有部署相较共享云 API
              调用的总体拥有成本更高（算力、维护、升级成本由企业承担）；以及把 LLM 集成进现有企业工作流的切换成本高，这一点双向作用——部署后利好 Cohere，但也阻碍初始采用。人才短缺也是约束：少于 30%
              机构拥有足够 ML 工程师，可在内部成功部署企业 AI；这会创造对 Cohere North 这类交钥匙方案的需求，但也限制市场增长速度。
            claimRefs:
              - CM026
