      - number: '6.2'
        title: 客户采用、扩张与留存
        blocks:
          - type: paragraph
            body: >
              Cohere 的 GTM 主要靠直销企业客户，并由战略渠道伙伴（Oracle、Salesforce、Cisco、AMD、NVIDIA）补强。典型客户路径从针对具体用例（文档搜索、客服、合规报告）部署 Cohere
              Command 或 Embed 做概念验证开始，随后签署生产级 ACV 合同，再扩展到更多用例、更多产品线（Embed + Rerank + Command 组合）或同一企业内更多业务单元。这种先落地再扩张
              模式符合一流企业 SaaS 的商业化经验。


              多产品采用是客户健康度最主要的证据：同时把 Embed + Rerank 用于 RAG、把 Command 用于生成，再叠加 North 做工作流编排的客户，切换成本很高，流失概率低——他们已经把 Cohere
              产品栈接进生产 AI 基础设施。以 Fujitsu 为例，它被引用为已为日本企业客户部署多款 Cohere 产品，说明既有多产品使用，也有经销商 / 系统集成商杠杆。


              据报道，Cohere 企业平台的 DAU/MAU 约为 40%，高于一般企业软件水平（更接近日常使用而非偶尔使用的 SaaS
              工具），说明部署已经进入活跃生产级使用，而不是评估或试点。这个指标虽未正式披露，但分析师报告把它当作真实客户参与度的证据。
