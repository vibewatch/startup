  foundingLocation: Toronto, Ontario, Canada
  headquarters: Toronto, Ontario, Canada (with offices in London, San Francisco, New York, Montreal, Paris, Seoul, and Germany)
  productSummary: >-
    Command A (111B MoE model, 256k token context, multilingual), Embed v3 (multilingual retrieval), Rerank (search
    result relevance), and North (enterprise AI platform with RAG orchestration, access controls, agent workflows, and
    100+ connector integrations). All products support private on-premises deployment.
  customerFocus: >-
    Enterprise accounts (Global 2000) in financial services, healthcare, government, legal, manufacturing, and
    technology sectors; APAC distribution via Fujitsu (Japan) and LG CNS (Korea); EU expansion via Aleph Alpha.
  businessModel: >-
    SaaS subscription (platform ACV $500K–$5M+); per-token API pricing for Command/Embed/Rerank; professional services
    for private deployment. Revenue mix shifting toward North platform subscriptions with higher gross margin.
  stage: Series D / Pre-IPO
  fundingStatus: >-
    Public disclosures and market reporting place Cohere at roughly a $6.8B-$7B valuation after its 2025 financing
    rounds. Investors include PSP Investments, Inovia Capital, Index Ventures, Radical Ventures, Oracle (strategic),
    Salesforce Ventures, NVIDIA (strategic), and other enterprise-aligned backers. Total raised is approximately $1.6B.
  disclosureProfile: private-disclosed
  claimRefs: []
