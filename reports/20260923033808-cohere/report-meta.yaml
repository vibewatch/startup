companyProfile:
  summary: >-
    Cohere is a Canadian AI company founded in 2019 by Aidan Gomez, Nick Frosst, and Ivan Zhang — three researchers
    whose pedigree traces to the landmark 'Attention Is All You Need' Transformer paper (Google Brain, 2017). Cohere
    builds and commercializes enterprise-grade large language models with a distinctive emphasis on sovereign private
    deployment: customers run Cohere models entirely within their own infrastructure, satisfying data residency, GDPR,
    and sector-specific compliance requirements that public cloud AI APIs cannot meet. The company reached roughly $240M
    ARR by end-2025, raised about $1.6B across Series A–E and strategic financing, and is broadening its European
    position via Aleph Alpha integration and new regulated-industry partnerships.
  foundedDate: '2019-01-01'
  founders:
    - name: Aidan Gomez
      role: CEO and Co-founder
      background: Co-author of 'Attention Is All You Need'; former Google Brain researcher
      claimRefs: []
    - name: Nick Frosst
      role: Co-founder
      background: Former Google Brain researcher; machine learning researcher
      claimRefs: []
    - name: Ivan Zhang
