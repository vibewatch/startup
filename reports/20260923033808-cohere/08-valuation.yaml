  evidenceGaps:
  - type: private-evidence-only
    severity: critical
    topic: NRR by annual cohort — the single most important undisclosed Cohere financial metric
    missingEvidence: Cohere has not disclosed net dollar retention by cohort. Without NRR, ARR quality
      and the land-and-expand thesis cannot be independently assessed.
    whyItMatters: NRR below 100% in any annual cohort would fundamentally undermine the base case IRR
      and trigger a downgrade of the commercial proof investment KPI from 7 to 4.
    diligencePath: Request NRR by vintage cohort (2022–2025) and top-10 account retention data from Cohere
      CFO under NDA.
    relatedQuestionRefs:
    - QV008
    relatedTableRefs: []
  - type: private-evidence-only
    severity: major
    topic: Series D liquidation preference structure and cap table — preferred equity overhang undisclosed
    missingEvidence: The exact liquidation preference terms, anti-dilution provisions, and cap table from
      Series A through D are not publicly available.
    whyItMatters: If Series D carries a 2x liquidation preference with anti-dilution, common equity holders
      receive substantially less in down-round or M&A exits; minority investor returns can vary by 30–50%
      depending on preference stack.
    diligencePath: Request cap table and term sheet from legal counsel during Series E negotiation.
    relatedQuestionRefs:
    - QV003
    relatedTableRefs: []
  - type: data-not-public
    severity: major
    topic: Secondary market transaction price for Cohere equity — no disclosed tender or marketplace price
    missingEvidence: No secondary transaction price for Cohere equity is publicly available on Forge,
      Nasdaq Private Market, or similar platforms. The $7B headline is based solely on primary round pricing.
    whyItMatters: Secondary pricing discount to primary round (typically 15–30%) provides the best independent
      valuation validation; absence of secondary data reduces valuation confidence.
    diligencePath: Contact Forge Global, EquityZen, or Nasdaq Private Market for indicated secondary market
      for Cohere shares before IC commitment.
    relatedTableRefs: []
  - type: enumeration-incomplete
    severity: minor
    topic: Total capital committed and cap table — Cohere Series A through D aggregate financing detail
    missingEvidence: Cohere's precise cap table, total shares outstanding, aggregate committed capital
      across all rounds, and per-round dilution percentages are not publicly available. Estimates from
      Crunchbase and Pitchbook are approximate.
    whyItMatters: Accurate dilution modeling requires the full cap table; Series E investors need to know
      the preference stack and total committed capital to model downside scenarios.
    diligencePath: Request audited cap table from Cohere legal counsel during Series E negotiation.
    relatedTableRefs: []
  - type: enumeration-incomplete
    severity: minor
    topic: Comparable valuation table (T804) — less-comparable AI companies excluded
    missingEvidence: Mistral AI (~€6B valuation, limited ARR), Together AI (pre-revenue infrastructure),
      and Perplexity (~$9B valuation, consumer-focused) are excluded for poor comparability.
    whyItMatters: Complete comparable set might shift multiple perception slightly; excluded companies
      generally support a higher multiple for Cohere's commercial scale.
    diligencePath: Update comparable table if additional private AI company ARR/valuation disclosures
      become available.
    relatedTableRefs:
    - TV004
callouts:
- title: 'Recommendation: CONDITIONAL INVEST at $7B'
  body: 'Cohere merits investment for investors with 5+ year horizons and tolerance for copyright litigation
    risk. The probability-weighted 1.67x gross return is thin by VC standards but supported by strong
    market positioning. The two pre-conditions for commitment are: (1) copyright litigation external counsel
    assessment below $20M expected liability, and (2) NRR by cohort disclosed above 100%. Without these,
    the bear case probability rises to 35–40% and the expected return turns negative.'
  calloutType: recommendation
  claimRefs:
  - CV001
  - CV009
- title: Oracle as the Hidden Exit Option
  body: The most underappreciated valuation element is Oracle's equity stake and strategic alignment.
    If Azure OAI achieves sovereign parity by 2026, Oracle's rational response is to fully acquire Cohere
    at $10–18B to protect its OCI enterprise AI strategy. This acquisition scenario provides a floor above
    the $7B entry in all but the most severe bear case — making Oracle effectively an implicit put option
    embedded in the investment.
  calloutType: insight
  claimRefs:
  - CV001
