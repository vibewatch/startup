  - FI002
  claimRefs:
  - CI001
- id: S002
  title: Capital Structure and Funding History
  body: 'Cohere has raised approximately $1.7 billion in disclosed financing since its founding in 2019,
    across five primary rounds. The funding trajectory reflects a company that rapidly grew from research
    spin-out to enterprise-scale AI vendor, backed by a strategic investor syndicate that doubles as a
    commercial distribution network: NVIDIA (chip supply), Oracle (cloud infrastructure), AMD (hardware
    alternative to NVIDIA), Salesforce (CRM channel), and Cisco (enterprise networking and security).
    Each strategic investor provides commercial co-selling, distribution, and infrastructure value that
    supplements the financial capital.


    Total capital raised positions Cohere with an estimated two to three years of runway at current burn
    rates (speculative, as actual burn is not disclosed). The September 2025 $500M round at $6.8–7B valuation
    was the largest to date and brought in institutional investors including Inovia Capital and PSP Investments
    alongside strategic partners. Cohere''s capital requirement is driven by: (1) GPU cluster costs for
    model training (estimated at $100–300M per large-model training run for frontier-class models), (2)
    enterprise sales team scaling (estimated 200–400 enterprise sales staff globally), and (3) infrastructure
    for serving private-cloud deployments.


    At $7 billion valuation and approximately $240M ARR, the ARR revenue multiple is approximately 29x.
    This compares to a 46.7x multiple reported by Sacra in October 2025 (calculated on $150M ARR at $7B
    valuation — implying Sacra''s ARR estimate was lower than the February 2026 figure). Comparable private
    AI peers trade at 36–50x ARR multiples, suggesting Cohere is modestly undervalued relative to direct
    comparables, or reflects investor pricing of open-source commoditisation risk. Public SaaS comps with
    70%+ gross margins and 100%+ growth trade at 15–25x ARR, confirming Cohere carries a significant private-AI
    premium over public SaaS valuations.

    '
  tableRefs:
  - TI004
  - TI005
  figureRefs:
  - FI003
  - FI004
  claimRefs:
  - CI001
- id: S003
  title: Financial Verdict and Diligence Gaps
  body: 'Cohere''s financial profile presents a compelling growth story with significant execution risk.
    The company has achieved meaningful ARR scale ($240M) in a short time, with a high-margin revenue
    model (85% private deployment ACV) that is inherently more valuable than pure API consumption. Strategic
    investor alignment reduces commercial risk: NVIDIA, Oracle, AMD, Salesforce, and Cisco collectively
    provide co-selling channels to enterprise accounts that Cohere could not access independently.


    The primary financial risks are: (1) Revenue concentration — top 10 customers likely represent 40–60%
    of ARR (industry norm for enterprise software companies at this stage), creating churn risk if one
    or two large contracts are lost; (2) Capital intensity for model training — Cohere must continue investing
    in frontier model quality to maintain competitive parity, requiring either ongoing capital raises
    or eventual profitability; (3) Commoditisation pressure — if enterprise customers migrate to open-source
    alternatives (Llama 4, Mistral) or Azure OpenAI sovereign cloud, revenue growth could slow materially;
    (4) The absence of public financial data makes it impossible to independently verify gross margins,
    net dollar retention, CAC payback period, or operational leverage.


    For a VC at Series E or secondary/growth stage, the key financial diligence asks are: (1) Board-approved
    ARR, NRR, and gross margin data under NDA; (2) Customer contract schedule (top 20 customers by ACV,
    renewal dates, and retention history); (3) Fully loaded compute cost per dollar of revenue (GPU cluster
    CapEx + OpEx allocation); (4) Burn rate and runway to next financing or profitability event; (5) Revenue
    recognition policy for multi-year ACV contracts (upfront vs ratable).

    '
  tableRefs: null
  figureRefs: null
  claimRefs:
  - CI001
