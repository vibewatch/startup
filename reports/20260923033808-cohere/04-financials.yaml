  evidenceGaps:
  - type: private-evidence-only
    severity: major
    topic: Cohere gross margin, NRR, and burn rate — no public financial disclosure
    missingEvidence: Cohere has not published gross margins, net dollar retention, burn rate, or profitability
      timeline data. All estimates are based on comparable enterprise AI companies.
    whyItMatters: Without gross margin confirmation, the financial thesis rests on industry comparable
      assumptions; actual margin could be materially different if GPU cost or customer support costs are
      higher than modelled.
    diligencePath: Request audited or management-certified P&L, including gross margin by product line,
      from Cohere under Series E due diligence NDA.
    relatedQuestionRefs:
    - QI004
    relatedTableRefs: []
  - type: private-evidence-only
    severity: major
    topic: Customer count, contract sizes, and NRR — enterprise revenue concentration risk
    missingEvidence: Cohere does not disclose enterprise customer count, top-10 customer revenue concentration,
      NRR by cohort, or average contract duration.
    whyItMatters: If top 5 customers represent >50% of ARR and any fail to renew, ARR trajectory changes
      materially; NRR below 100% would indicate net churn.
    diligencePath: Request customer contract schedule (top 20 customers by ACV), cohort retention data,
      and NRR calculation under NDA from Cohere management.
    relatedQuestionRefs:
    - QI009
    relatedTableRefs: []
  - type: private-evidence-only
    severity: minor
    topic: Burn rate and runway — capital adequacy assessment
    missingEvidence: Burn rate and current cash balance are not disclosed; without these, estimated runway
      range of 18–40 months has extremely wide confidence interval.
    whyItMatters: If burn is higher than typical enterprise SaaS peers due to GPU training spend, cash
      runway could be materially shorter than market assumes, increasing near-term financing risk.
    diligencePath: Request monthly board reporting on cash position, burn rate, and next financing trigger
      under NDA.
    relatedQuestionRefs:
    - QI010
    relatedTableRefs: []
  - type: stale
    severity: minor
    topic: ARR growth rate confirmation — single data point February 2026
    missingEvidence: Only one data point (Bloomberg ~$240M February 2026) is publicly available for recent
      ARR; no quarterly growth data or revenue retention breakdown.
    whyItMatters: A single ARR data point cannot confirm whether growth is accelerating, decelerating,
      or driven by a few large one-time contracts.
    diligencePath: Request monthly ARR schedule for the trailing 12 months under NDA; validate against
      board reporting.
    relatedQuestionRefs:
    - QI007
    relatedTableRefs: []
