company:
  name: Cohere
chapter:
  number: 4
  title: Financials
  summary: 'Cohere''s financial profile is that of a high-growth, enterprise-SaaS AI company in scale-up
    mode. ARR reached approximately $240 million by February 2026, up from an estimated $100 million in
    mid-2024, driven by large ACV private-deployment contracts in regulated industries. Revenue is heavily
    concentrated in the private/on-prem deployment model (~85%), which commands significantly higher gross
    margins than API consumption revenue. Estimated gross margins are 70–80%, consistent with enterprise
    SaaS peers, though Cohere has not disclosed them publicly. The company has raised approximately $1.7
    billion across five rounds at an implied $7 billion valuation (September 2025), suggesting it is well-capitalised
    for its current scale. However, substantial uncertainties remain: burn rate, path to profitability,
    contract renewal data, and exact unit economics are not publicly available. At $7B / ~$240M ARR, Cohere
    trades at approximately 29x forward ARR — a premium relative to public SaaS but a meaningful discount
    to comparable private AI peers (OpenAI ~38x, Anthropic ~37x), reflecting investor uncertainty about
    long-term model commoditisation risk.

    '
sections:
- id: S001
  title: Revenue Model and Unit Economics
  body: 'Cohere operates a hybrid revenue model with two primary streams: (1) private and on-premises
    deployment licensing under annually contracted value (ACV) enterprise agreements, and (2) a consumption-based
    API tier (Cohere API and Coral platform) billed per million tokens. The private deployment model represented
    approximately 85% of Cohere''s reported revenue as of 2025, reflecting the company''s deliberate go-to-market
    focus on regulated enterprise customers (financial services, healthcare, government, defence) who
    require data sovereignty and air-gapped or VPC deployment. The API tier, though growing, remained
    a smaller portion of revenue.


    Enterprise ACV contracts are multi-year agreements (typically one to three years) for access to Cohere
    models deployed on customer infrastructure or dedicated VPC environments, along with enterprise support,
    SLA guarantees, and access to fine-tuning services. The average contract size is estimated in the
    range of $500,000 to $5 million+ annually for large regulated-industry customers, though Cohere does
    not disclose contract specifics. Revenue growth from $100M estimated ARR (mid-2024) to approximately
    $240M (February 2026) implies roughly 2.4x annual growth — consistent with a company scaling through
    enterprise contract expansion and new logo acquisition.


    Gross margins in the enterprise AI LLM space for model-as-a-service providers are estimated at 70–85%,
    driven by the significant difference between GPU inference cost (approximately $0.30–$1.50 per million
    tokens at scale using H100s) and customer billing rates ($2–$25 per million tokens for API tier, or
    much higher ACV rates for private deployment). For private deployment, Cohere''s marginal cost per
    customer is primarily customer success, deployment support, and fine-tuning labour — a lower variable
    cost profile than API inference. Cohere is widely cited by industry analysts as targeting positive
    gross margins above 70%, though profitability at the operating level is not expected before 2027 at
    earliest given ongoing model R&D and GTM investment.

    '
  tableRefs:
  - TI001
  - TI002
  - TI003
  figureRefs:
