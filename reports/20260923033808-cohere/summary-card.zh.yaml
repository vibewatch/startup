  topStrengths:
    - 在 $240M ARR 规模上，Cohere 是少数企业级主权 LLM 供应商；私有部署合规姿态覆盖 GDPR、EU AI Act 和 APAC 数据主权要求。
    - North 企业平台带来真实切换成本——RAG 编排、访问控制、100+ 连接器和审计日志，不是自托管开源模型就能复制。
    - 创始团队很强：Aidan Gomez 是《Attention Is All You Need》共同作者，也跑通过企业销售；Nick Frosst 和 Ivan Zhang 提供技术深度。
    - Fujitsu（日本）和 LG CNS（韩国）构成 APAC 渠道护城河；本地竞争者和超大规模云厂商很难复制这类主权 AI 部署。
    - 收购 Aleph Alpha 让 Cohere 更像欧洲企业主权 AI 标准，同时补进 500 名 EU 员工和高价值监管关系。
    - Command A（111B MoE，256k context）和 Embed v3 具备企业级性能，相比同级 dense model 还有效率优势。
  topRisks:
    - 版权诉讼（Condé Nast 等，SDNY）仍是最大风险：2025 年 11 月驳回动议被否，潜在法定赔偿和训练数据整改要求是概率最高的重大不利事件。
    - 关键人风险：Aidan Gomez 若离职，将触发投资逻辑破裂；公司未披露接班计划。
    - Azure OpenAI Service 扩张主权云，正在压缩 Cohere 在美国市场的私有部署护城河；FedRAMP 认证缺口也挡住 $8–10B 联邦 TAM。
    - 开源模型追平（Meta Llama 4、Mistral Large 2）正在侵蚀 Cohere 在 $50–150K ACV 档位的基础模型差异化。
    - NRR 未公开披露，外部无法独立判断 ARR 质量和 cohort 健康度，这是首要承保风险。
  unresolvedGaps:
    - 2022–2025 年度 cohort 的 Net Dollar Retention：验证 land-and-expand 逻辑和 ARR 耐久性必须拿到。
    - 版权诉讼和解概率与赔偿区间：提交 IC 前需要外部律师评估。
    - FedRAMP 认证时间表：公司未披露公开里程碑，可能还需 12–36 个月。
    - Series D–E 股权结构表，以及清算优先权下的优先股堆叠：准确建模稀释和下行情景回报前必须拿到。
    - Aleph Alpha 整合里程碑：收购后的整合时间表和 EU 客户留存数据都没有公开。
