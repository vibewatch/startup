chapter:
  number: 1
  title: Company Overview
  summary: 'Cohere is a Canadian enterprise AI company founded in 2019 by Aidan Gomez, Nick Frosst, and
    Ivan Zhang — all Google Brain alumni and co-authors (or close collaborators) of the seminal "Attention
    Is All You Need" transformer paper. Headquartered in Toronto with global offices, Cohere builds large
    language models (LLMs) and an enterprise AI platform optimised for private, on-premises, and sovereign-cloud
    deployments in regulated industries. As of late 2026 the company reports approximately $240 million
    in annual recurring revenue, has raised roughly $1.6 billion in capital at a roughly $6.8-7.0 billion
    valuation, and is broadening its enterprise footprint through TD, North, and the Aleph Alpha / Schwarz
    sovereign-AI combination.

    '
sections:
- id: s1
  title: Company Identity and Business Overview
  body: 'Cohere Inc. is a privately held artificial intelligence company incorporated and headquartered
    in Toronto, Ontario, Canada. Founded in 2019, the company develops large language models (LLMs) and
    enterprise AI software for regulated industries including financial services, healthcare, manufacturing,
    energy, and the public sector. Its core value proposition is enabling organisations to deploy generative
    AI within their own infrastructure — on-premises, in a private cloud, or in a sovereign cloud — rather
    than routing sensitive data through shared public-cloud APIs. This architecture gives enterprise buyers
    the data residency, compliance, and security guarantees that make AI adoption viable in regulated
    sectors.


    Cohere monetises primarily through multi-year software licences for private-deployment workloads.
    Approximately 85 percent of revenue comes from these private deployments, which carry SaaS-like gross
    margins of 70–80 percent because Cohere avoids the capital expenditure and negative unit economics
    associated with running shared inference infrastructure. The remainder of revenue comes from API usage
    on Cohere''s managed cloud, where customers pay per token. Cohere''s product portfolio spans generative
    models (Command A family), retrieval models (Embed, Rerank), speech recognition (Transcribe), multilingual
    research models (Aya, covering 70+ languages), and the North agentic AI platform for enterprise workflow
    automation. The company reached approximately $240 million in annualised revenue as of February 2026,
    up from $13 million at the end of 2023, reflecting compound growth of roughly 10× in 26 months.

    '
