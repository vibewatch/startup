- id: s2
  title: Founders, Leadership, and Governance
  body: 'Cohere was co-founded by three researchers who met at the University of Toronto and worked at
    Google Brain. Aidan Gomez, who serves as CEO, was the youngest co-author (age 20) on the 2017 landmark
    "Attention Is All You Need" paper that introduced the transformer architecture underpinning virtually
    all modern LLMs. Nick Frosst, co-founder and VP of Research, was also a Google Brain researcher and
    musician known for his machine-learning work. Ivan Zhang, co-founder and CTO, collaborated with Gomez
    at FOR.ai before joining Cohere. All three completed studies at the University of Toronto.


    The company has significantly strengthened its executive bench in 2025. Martin Kon joined as President
    and COO in December 2022 from YouTube (where he was CFO). In August 2025, Cohere hired Joëlle Pineau
    — formerly VP of AI Research at Meta and a prominent Montreal-based AI researcher — as Chief AI Officer,
    and Francois Chadwick (ex-Uber CFO, KPMG US partner) as its first Chief Financial Officer. Phil Blunsom,
    previously at Google DeepMind, serves as Chief Scientist. The board and governance structure are not
    publicly disclosed, but investors including Radical Ventures, Inovia Capital, PSP Investments, NVIDIA,
    and Salesforce Ventures hold board representation rights as a condition of their investment. Cohere
    Labs, a nonprofit open-source research arm, was launched in June 2022 and is now led by Marzieh Fadaee
    following Sara Hooker''s departure in September 2025. The founder trio retains strong influence and
    the company shows no signs of CEO succession pressure.

    '
