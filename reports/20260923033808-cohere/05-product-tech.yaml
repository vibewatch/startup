- id: S002
  title: Architecture, Infrastructure, and Technical Differentiation
  body: 'Cohere''s technical architecture is built around a private deployment-first model: all products
    are containerised using Docker and Kubernetes and designed to be deployed on customer-controlled infrastructure
    (on-premises GPU clusters, VPCs on AWS, Azure, Google Cloud, or Oracle Cloud Infrastructure) without
    sending data to Cohere''s servers. This architecture is the core technical differentiator for regulated
    industries, as it satisfies data residency and sovereignty requirements that public cloud API deployments
    cannot meet.


    Model training is conducted on NVIDIA H100 GPU clusters at scale (training runs estimated at tens
    of thousands of GPU-hours for models the size of Command A). Post-training, models are packaged as
    containerised services and delivered to customers via Cohere''s private deployment programme. Inference
    optimisation uses standard LLM serving techniques including KV cache management, speculative decoding,
    and continuous batching (vLLM-compatible serving infrastructure). The private deployment model shifts
    inference infrastructure cost to the customer, which is a key driver of Cohere''s high gross margins.


    Cohere''s primary technical moat is in retrieval: Embed v3 and Rerank consistently rank in the top
    tier of the MTEB (Massive Text Embedding Benchmark) leaderboard across retrieval, semantic similarity,
    and classification tasks. This is a durable technical advantage because high-quality embedding models
    require large-scale supervised training on retrieval-specific data — a different training objective
    and dataset than generative model training, which competitors cannot easily replicate by simply scaling
    up their generative models.


    The North platform integrates with enterprise identity (SAML, SSO), enterprise data connectors (100+
    integrations via REST API and official connector SDKs), and enterprise security controls (role-based
    access control, audit logging, data loss prevention integration). The platform is built on a Python/FastAPI
    backend and a React-based front-end, with Kubernetes-native deployment for cloud environments and
    a Helm chart for self-hosted enterprise deployments.

    '
  tableRefs:
  - TE003
  figureRefs:
  - FE002
  - FE003
  claimRefs:
  - CE001
- id: S003
  title: Trust, Compliance, Roadmap, and Technical Risks
  body: 'Cohere holds SOC 2 Type II certification for its managed cloud services and is working to expand
    its compliance portfolio to include ISO 27001 and FedRAMP Moderate for US government accounts. The
    private deployment architecture inherently addresses many compliance requirements by keeping data
    on customer infrastructure, but it also creates a dependency: Cohere''s compliance posture is only
    as strong as the customer''s own infrastructure compliance programme. For customers requiring FedRAMP
    High (US Department of Defence, intelligence community), Cohere''s current certifications are insufficient
    — this remains a product gap relative to Microsoft Azure OpenAI (FedRAMP High-authorised).


    The product roadmap (based on public statements, blog posts, and investor reporting) indicates: (1)
    EU sovereign deployment expansion via the Aleph Alpha acquisition (targeting German and EU government
    accounts), (2) context window expansion to 500k–1M tokens for Command A''s next generation, (3) Compass
    GA release for self-service RAG pipeline creation, (4) expanded Aya multilingual support to 100+ languages,
    and (5) HIPAA BAA availability for healthcare enterprise customers.


    The primary technical risks are: (1) context window gap — Cohere''s 256k vs competitors at 1M represents
    a meaningful disadvantage for large-document workflows; (2) benchmark visibility — Command A has not
    been submitted to all leading public benchmarks (MMLU, HumanEval, LMSYS arena), limiting independent
    quality verification; (3) model training compute dependency — Cohere relies entirely on third-party
    GPU supply (NVIDIA H100 cluster access via Oracle, AWS, and its own cluster investments); (4) open-source
    substitution — Llama 4 and Mistral''s models can be privately deployed with comparable capability
    for zero licensing cost, threatening the commercial model layer premium; (5) MoE architecture trade-offs
    — while Command A''s MoE approach is cost-efficient for inference, it can produce inconsistent outputs
    compared to dense model alternatives.

    '
  tableRefs:
  - TE004
  - TE005
  figureRefs:
  - FE004
  claimRefs:
  - CE001
