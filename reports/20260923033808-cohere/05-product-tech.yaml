company:
  name: Cohere
chapter:
  number: 5
  title: Product and Technology
  summary: 'Cohere''s product suite centres on three capability pillars: generative models (Command A,
    Command R+), retrieval models (Embed v3, Rerank), and platform orchestration (North, Compass). The
    flagship Command A model (256k context, 111B parameters on an efficiency-optimised architecture) is
    designed for enterprise private deployment rather than benchmark maximisation. Cohere''s technical
    differentiation is strongest in retrieval and RAG: its Embed v3 and Rerank models consistently rank
    among the top performers on the MTEB leaderboard, and the combination is the de facto enterprise choice
    for large document corpus search. The North agentic platform, launched January 2025, positions Cohere
    above the model layer with orchestration, workflow automation, and enterprise connector integrations.
    Critical technology dependencies include NVIDIA GPU availability (training), Oracle Cloud Infrastructure
    (inference and private deployment delivery), and Kubernetes for containerised deployment. Product
    risk is centred on context window gap (256k vs 1M for Anthropic/Google) and the possibility that commodity
    model APIs erode the premium for proprietary model access.

    '
sections:
- id: S001
  title: Product Suite and Capabilities
  body: 'Cohere''s product lineup is organised into two segments: AI models (the generation, retrieval,
    and classification model tier) and AI platforms (North and Compass, the orchestration and deployment
    layer). The model tier consists of: Command A (256k context, 111 billion parameters, optimised for
    enterprise agentic tasks and private deployment), Command R+ (128k context, retrieval-augmented generation
    specialised), Embed v3 (state-of-the-art text embedding model for semantic search and document retrieval),
    Rerank (cross-encoder model for improving retrieval precision in RAG pipelines), Aya (multilingual
    generative model covering 70+ languages), and Transcribe (audio-to-text model targeting enterprise
    voice and call-centre use cases).


    The platform tier consists of North, an enterprise agentic AI workflow platform launched in January
    2025 that provides pre-built connectors to 100+ enterprise applications (Salesforce, ServiceNow, Google
    Workspace, Microsoft 365, SAP, Confluence), and Compass, an AI search and discovery tool that allows
    enterprises to build RAG applications over internal document repositories without writing custom retrieval
    pipelines. Together, the platform tier is Cohere''s primary response to the commoditisation of foundation
    model APIs — by building a platform layer with enterprise workflow integrations, Cohere aims to create
    switching costs above and beyond the model itself.


    Command A was released in March 2025 and represents Cohere''s latest generation foundation model.
    It is notable for prioritising deployment efficiency over raw benchmark performance: at 111B parameters
    with a mixture-of-experts (MoE) architecture, it is designed to serve multiple enterprise tenants
    on a shared GPU cluster with lower inference cost per token than dense models of similar capability.
    The 256k context window supports long-document enterprise workflows (legal contract review, regulatory
    compliance documentation, financial report analysis) but trails Anthropic''s 1M context Claude and
    Google''s Gemini 1.5 Pro.

    '
  tableRefs:
