  rows:
  - - Konfío
    - Credit-led SME operating-finance fintech
    - First formal business credit, cards, payments, and management tools for Mexican SMEs
    - Strong first-credit wedge and bundled SME-finance positioning
    - No insured deposit account or full bank treasury stack yet
    - SP001, SP002, SP026, SP027
  - - Clara
    - Spend-management / corporate-card fintech
    - Corporate cards, supplier payments, approvals, policy controls, ERP sync
    - Locally issued LATAM cards plus strong finance-control workflows
    - Less publicly evidenced on SME working-capital depth than Konfío or Covalto
    - SP003, SP004, SP005
  - - Kapital
    - Finance-operations and liquidity platform
    - Cash-flow visibility, transfers, invoicing, payroll, supplier liquidity, factoring
    - All-in-one operations stack with credit/factoring inside workflow
    - Fetched evidence is stronger on operations tooling than on broad payment acceptance or bank depth
    - SP006, SP007, SP008, SP009
  - - Covalto
    - Regulated digital bank for businesses
    - Business account, credit, investments, leasing, factoring
    - Bank charter, account-led relationship, IPAB-backed deposits, credit and treasury adjacency
    - May be less focused than Konfío on first-credit wedge and card-led operating controls
    - SP010, SP011, SP012, SP013
  - - Clip
    - Payments-led merchant platform
    - Card acceptance, payment links, QR, checkout, lightweight commerce software
    - Very strong entry point for collections and simple digital commerce adoption
    - Much weaker evidence of lending breadth or treasury relationship than Konfío/Covalto
    - SP014, SP015, SP016, SP017
  - - Incumbent bank bundle (BBVA example)
    - Traditional bank / universal bank substitute
    - Accounts, treasury, taxes, factoraje, TPV, investments, startup banking
    - Deposit, treasury, and relationship breadth plus brand trust
    - Usually slower, heavier onboarding and weaker fintech-style workflow focus
    - SP018, SP020
  notes: The competitor set is grouped by the job-to-be-done they control first. The most dangerous alternatives are often adjacent platforms that own the initial workflow rather than pure head-to-head SME lenders.
