- id: TP004
  title: Moat Durability / Competitive Risk Register
  columns:
  - Moat claim / risk
  - Threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - First-credit wedge
    - Banks or bank-like platforms can target the same formalizing SME once data is visible
    - High
    - If first-time borrowers can be captured by bank-led channels, Konfío loses its cleanest wedge
    - Request funnel by first-credit vs repeat-credit cohorts and retention after second product
  - - Multi-product attachment
    - Clara, Kapital, and Clip each own different workflow entry points
    - High
    - The first durable workflow often determines future cross-sell rights
    - 'Request cohort data by first product: credit, card, payments, or software'
  - - Non-bank operating model
    - Covalto and incumbents can bundle insured deposits and treasury today
    - High
    - Deposit and treasury depth increase switching costs and daily engagement
    - Track timing and scope of Konfío bank-license process and interim partnership strategy
  - - Credit-centric positioning
    - Payments-led substitutes can acquire merchants before credit need arises
    - Medium-High
    - Transaction ownership can become underwriting and cross-sell advantage later
    - Measure how much origination already comes from payments or software surfaces
  - - Finance-control narrative
    - Clara has a clearer spend-governance proposition for finance teams
    - Medium
    - Could matter in larger SMEs where CFO/control needs dominate
    - Compare approval, policy, ERP, and procurement depth against Clara in product diligence
  - - Incumbent response
    - BBVA and peers can simplify digital SME journeys while keeping trust advantage
    - Medium
    - Fintech differentiation narrows if incumbents improve UX faster than expected
    - Monitor BBVA Spark, digital onboarding, and SME product bundling changes quarterly
  notes: The key competitive question is not whether Konfío has rivals, but which adjacent platforms can capture the relationship before Konfío broadens into full business banking.
