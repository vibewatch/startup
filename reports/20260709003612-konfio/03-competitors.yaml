callouts:
- calloutType: insight
  title: The decisive competitor is whichever product wins the first durable workflow
  body: Public evidence suggests Konfío’s real competitors are not only other lenders. Cards, supplier-pay workflows, merchant checkout, and business accounts are all plausible entry points into the same SME relationship, which is why the field looks convergent rather than cleanly segmented.
  claimRefs:
  - CP006
  - CP011
  - CP021
  - CP024
  - CP048
- calloutType: risk
  title: Covalto and incumbents expose Konfío’s biggest structural gap
  body: Until Konfío can pair credit with a primary business account and treasury tools, regulated bank competitors can argue for relationship consolidation in a way Konfío cannot fully counter with its current licensing perimeter.
  claimRefs:
  - CP003
  - CP016
  - CP019
  - CP026
  - CP038
  - CP039
- calloutType: strength
  title: Konfío still has a credible first-credit wedge
  body: If management’s claim that more than 80% of customers are receiving their first business credit is durable, Konfío remains differentiated in the part of the market that incumbents and finance-control software do not naturally own first.
  claimRefs:
  - CP004
  - CP034
  - CP046
