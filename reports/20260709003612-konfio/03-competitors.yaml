- id: TP003
  title: Pricing / Packaging Comparison
  columns:
  - Company
  - Visible package or contract cue
  - Included capabilities
  - Public pricing cue
  - Implication
  rows:
  - - Konfío
    - Underwriting-led bundled SME-finance offer
    - Credit, cards, payment terminals, business tools
    - Public retail-like pricing not fetched; likely relationship and risk based
    - Packaging breadth is strategic, but public price transparency remains limited for diligence
  - - Clara
    - Software-led card and spend stack
    - Corporate card, spend management, supplier payments, approvals, ERP sync
    - ROI calculator, cashback, and 40-day credit mentioned; no simple list price fetched
    - Stronger control narrative for finance leaders than a credit-only proposition
  - - Kapital
    - All-in-one platform with embedded products
    - Dashboard, transfers, invoices, payroll, Crédito FLEX, factoring
    - No simple public price card fetched
    - Could win buyers who prefer one operating console even before seeking large credit lines
  - - Covalto
    - Bank account and credit bundle
    - Accounts, SPEIs, investments, credit, factoraje, arrendamiento
    - No simple public price card fetched; deposit and investment yields marketed
    - Can displace separate fintech relationships if one bank stack covers daily operations
  - - Clip
    - Transactional merchant pricing
    - Checkout, links, QR, subscriptions, terminals, catalog/inventory
    - 3.6% + IVA per successful online sale on fetched payments pages
    - Highly legible SMB packaging for acceptance, but not a full lending or treasury bundle
  - - BBVA Empresas
    - Relationship banking bundle
    - Taxes, net cash, factoraje, TPV, treasury, investments, Spark
    - Pricing mostly relationship-based / not enumerated on fetched page
    - Incumbent breadth can trump fintech convenience when buyer wants primary-bank consolidation
  notes: Unknown pricing cells are preserved intentionally. The public record is richer on packaging and workflow entry points than on apples-to-apples SME pricing.
