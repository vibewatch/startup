  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal perimeter
        blocks:
          - type: paragraph
            body: >-
              Konfío's regulatory perimeter is the first thing an investor must internalize. Across its about page,
              privacy notice, terms, and UNE page, the company repeatedly identifies Red Amigo DAL as a SOFOM E.N.R.
              under limited CNBV supervision rather than as a licensed bank. That matters because management's own 2026
              messaging says the next strategic step is to become a bank and add deposit accounts and treasury services
              for SMEs. In other words, an important portion of the upside case still depends on a regulatory event that
              had not closed by runDate. The legal file is disciplined in customer-facing terms—product-specific terms,
              formal complaint channels, published collection agencies, payment warnings, and CAT disclosures—but that
              same discipline highlights the gap between current permissions and long-term narrative. If the license is
              delayed, denied, or limited, Konfío would remain a capable lender/cards/ payments platform, but the
              broader SMB-banking thesis would be delayed. That constraint colors every upside assumption.
