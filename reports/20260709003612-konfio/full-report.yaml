  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Set Taxonomy
        blocks:
          - type: paragraph
            body: >-
              Konfío should not be benchmarked only against “other SME lenders.” The buyer can solve the same underlying
              problem through at least five routes: a credit-led fintech platform such as Konfío; a spend-management and
              corporate-card stack such as Clara; a finance-operations and liquidity suite such as Kapital; a regulated
              digital bank such as Covalto; a payments-led merchant platform such as Clip; or a traditional bank
              relationship such as BBVA Empresas. Status quo substitutes matter too: supplier credit, cash, and personal
              cards remain common. This is why the real competitor set changes with the buyer’s entry point. If the
              customer starts with urgent liquidity, Konfío and Covalto look closest. If the customer starts with
              expense controls or procurement policy, Clara becomes the more direct alternative. If the customer starts
              with collections, checkout, or digital catalog needs, Clip can own the relationship before credit is even
              considered. The competitive question is therefore not who has the largest brand, but who controls the
              first durable workflow in the SME finance stack.
