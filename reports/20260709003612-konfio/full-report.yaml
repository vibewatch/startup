  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and user workflows
        blocks:
          - type: paragraph
            body: >-
              Konfío's product is best understood as an SME operating-finance bundle that starts with credit but does
              not stop there. The current public surface supports at least four actively marketed modules. First,
              Crédito Empresarial offers unsecured working- capital financing with public claims of up to MXN10 million,
              48-hour funding, SAT-linked underwriting, and minimum operating and revenue thresholds. Second, Tarjeta
              Empresarial extends the relationship into day-to-day spend, supplier transfers, working-capital
              flexibility, ERP-ready reporting, expense controls, cashback, and app-based installment conversion. Third,
              Konfío Pagos pushes the company into merchant acceptance through terminals, remote payments, MSI, wallet
              acceptance, role-based collection permissions, and live deposit monitoring. Fourth, the mobile app binds
              these products together with analytics, alerts, card controls, and support. That workflow design matters
              because it shows Konfío trying to own the full cycle of SME cash generation, cash deployment, and cash
              visibility rather than merely originate one-off loans. Public inconsistencies still exist—the credit page
              advertises up to MXN10 million while the December 2024 financing note emphasizes up to MXN5 million loans
              and MXN2 million card financing—but the broader pattern is clear: Konfío is a multi-surface financial
              operating system for Mexican SMEs.
