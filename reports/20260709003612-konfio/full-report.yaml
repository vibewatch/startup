      - number: '3.4'
        title: Differentiation Durability and Where Konfío Can Still Win
        blocks:
          - type: paragraph
            body: >-
              The strongest public case for Konfío is not that it has no competitors, but that it occupies a useful
              middle position. It is more credit-native than Clara or Clip, more bundled than a narrow lender, and still
              oriented toward underbanked SMEs that may be receiving formal business credit for the first time. Public
              statements that more than 80% of customers are receiving their first business credit reinforce that wedge.
              But the same evidence also shows what is missing. Without insured deposit accounts or treasury products,
              Konfío cannot yet neutralize Covalto or BBVA on primary-bank relationship depth. Without a best-in-class
              spend-management narrative, it may lose some finance-leader workflows to Clara. Without a stronger
              merchant-acquiring front door, it may cede payment-originated demand to Clip or similar platforms.
              Competitive durability therefore depends less on generic brand awareness and more on whether Konfío can
              keep converting first-credit customers into multi-product operating-finance users before adjacent
              platforms or banks absorb the relationship.
