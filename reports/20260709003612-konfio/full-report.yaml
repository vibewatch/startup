      - number: '3.3'
        title: Adjacent Substitutes and Incumbent Response
        blocks:
          - type: paragraph
            body: >-
              Clip and incumbent banks are critical because they attack the same customers from opposite ends. Clip is
              not a direct equivalent to Konfío on lending breadth, but it is a powerful merchant-entry substitute:
              payment links, QR, checkout, recurring payments, inventory, and digital catalog tools can become the first
              operating-finance surface for small businesses. Once a payments platform owns transaction flow, it can
              influence future credit and software attachment. Incumbents such as BBVA compete in the other direction.
              They can already bundle accounts, treasury, tax payments, factoraje, terminals, investment products, and
              startup-focused banking teams such as BBVA Spark. Konfío cannot yet match that deposit and treasury
              completeness because it still operates as a SOFOM while pursuing a banking license. The strategic
              implication is that Konfío’s flank risk comes from both sides: payment specialists moving upward into
              financial services and bank or bank-like players compressing the need for a separate SME-fintech
              relationship.
