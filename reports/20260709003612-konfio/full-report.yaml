      - number: '3.2'
        title: 'Closest Fintech Peers: Clara, Kapital, and Covalto'
        blocks:
          - type: paragraph
            body: >-
              Among named fintechs, Clara, Kapital, and Covalto matter most because each overlaps with Konfío on at
              least two high-value buying criteria. Clara combines corporate cards, supplier payments, approval
              workflows, and ERP-linked spend management. That makes it a strong substitute when the finance leader
              wants control and employee-spend visibility more than pure working-capital lending. Kapital overlaps
              through its all-in-one operations platform, which covers cash-flow visibility, transfers, invoicing,
              payroll, and liquidity products such as Crédito FLEX and factoring. Covalto is structurally different: it
              competes as a regulated bank for businesses, offering accounts, investments, credit, leasing, and
              factoring under a bank and IPAB-protected deposit stack. That makes Covalto the closest public substitute
              for Konfío when the buyer wants both lending and a primary operating account in one relationship. Konfío
              still wins a distinctive wedge where first-time formal borrowers need quick business credit and adjacent
              tools, but the gap narrows as peers broaden their bundles.
