      - number: '7.3'
        title: Funding, counterparty, and model risk
        blocks:
          - type: paragraph
            body: >-
              Konfío's growth engine is fundamentally balance-sheet and model dependent. The December 2024 financing
              announcement tied MXN7.422 billion of institutional debt from Goldman Sachs, JPMorganChase, and Afore Sura
              directly to additional loan and card capacity. That is supportive, but it also proves that scale still
              depends on capital-provider confidence and refinancing access. On the asset side, the borrower mix is
              inherently riskier than plain-vanilla bank lending: management says more than 80% of financings are the
              first business credit customers have ever received, many customers lack guarantees or conventional bank
              history, and the underwriting story depends on alternative data and machine-learning speed rather than on
              traditional collateral. Public model-governance evidence exists but remains partial. BID Invest says it
              audited the algorithm for gender bias and found identical offers and repayment behavior across men and
              women, while FinDev Gateway says governance changes helped reassure clients, investors, and creditors.
              Those are helpful mitigants, yet investors still lack public vintage loss curves, delinquency buckets, or
              stress-test data.
