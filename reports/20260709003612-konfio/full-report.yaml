        title: Financing context and current price anchor
        blocks:
          - type: paragraph
            body: >-
              Public valuation history is asymmetric. The 2021 Reuters/Yahoo Finance article gives a clean primary
              event: Konfío said it was worth $1.3 billion after a $235 million capital raise. Since then, the strongest
              disclosed financial signal is not a fresh equity round but the December 2024 debt-facility expansion from
              Goldman Sachs, JPMorganChase, and Afore Sura México. That improves growth capacity, but debt is not equity
              and it does not answer whether common shareholders would be investing above, below, or roughly at the 2021
              mark in 2026. Management's 2026 interviews add more ambiguity. They describe a business that is already
              profitable at least on a revenue basis, that serves many first-time business-credit customers, and that
              wants to add deposit and treasury products once the bank license arrives. Those are meaningful signals,
              but they are still not a public revenue bridge, a reserve file, or a fresh post-money valuation. The
              practical result is that investors should treat $1.3 billion as a historical anchor, not as a live fair
              value.
