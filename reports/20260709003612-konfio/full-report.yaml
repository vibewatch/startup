companyProfile:
  summary: >-
    Konfío is a 2013-founded Mexico City fintech led publicly by cofounder-CEO David Arana. It operates today through
    Red Amigo DAL, S.A.P.I. de C.V., SOFOM, E.N.R., and has expanded from unsecured SME working-capital lending into
    business cards, merchant payments, and app-based analytics and servicing. Public evidence supports real scale—more
    than 98,000 businesses using the platform, more than MXN40 billion financed, and meaningful institutional debt
    support—while also showing that deposit and treasury expansion still depend on a pending banking-license process.
