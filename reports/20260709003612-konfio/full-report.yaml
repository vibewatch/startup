  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Target customer profile and segmentation
        blocks:
          - type: paragraph
            body: >-
              Konfío's target customer is not the full Mexican SME universe; it is the subset of formalizing or already
              formalized small and medium businesses that can provide enough operating evidence for fast digital
              underwriting and can benefit from working-capital, spend, and acceptance tools in one relationship. Public
              eligibility thresholds make that clear. Credit applicants are asked for at least three months of
              operations and roughly MXN50,000 in monthly income, while the card product expects at least six months of
              operations and the same monthly-income floor. The industry pages widen the picture by showing horizontal
              reach across manufacturing, construction, retail, wholesale, and professional services. Those segment
              pages repeat sector-specific use cases—continuous production, project financing, inventory timing,
              competitive wholesale pricing, and last-minute service execution—which suggests Konfío organizes
              go-to-market around cash-cycle stress rather than around one narrow vertical. That ICP design fits a
              lender that wants repeat product usage: the same owner-manager can borrow, manage employee spending, pay
              suppliers, and accept customer payments without leaving the Konfío ecosystem.
