            body: >-
              Konfío's best customer proof comes from a mix of public scale claims and named testimonial pages. The
              about page says the platform now has national coverage, has supported more than 90,000 companies, has
              financed more than MXN40 billion for businesses, and has more than 98,000 companies using the platform in
              2026. The December 2024 debt-expansion note adds forward demand evidence by saying the new facility should
              help Konfío reach more than 10,000 additional SMEs over the next 24 months. The five industry pages add
              useful specificity. Earth & Company in manufacturing frames Konfío as the financing push needed to launch
