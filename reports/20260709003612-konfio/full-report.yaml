  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product Scope, and Regulatory Status
        blocks:
          - type: paragraph
            body: >-
              Konfío should be understood as an SME-focused financial operating platform rather than a single-product
              lender. Third-party and company-controlled sources consistently identify the business as founded by David
              Arana and Francisco Padilla in 2013, while the official company timeline marks 2014 as the year it issued
              its first business loan. The legal entity visible on the company site is Red Amigo DAL, S.A.P.I. de C.V.,
              SOFOM, E.N.R., and the same disclosure states that the company does not require a bank charter to operate
              its current business but remains subject to limited CNBV supervision under the SOFOM regime. Product
              surfaces confirm a wider stack than simple term loans: the homepage and app-store listing describe
              business credit, a corporate card, payment terminals or remote payment links, and business-management or
              analytics tools accessed from the same mobile app. That breadth matters for diligence because it supports
              management’s framing that Konfío is trying to own a broader SME operating wallet, not just originate
              one-off loans. It also helps explain why the company’s current banking-license effort centers on adding
              deposit and treasury features to an already multi-product platform rather than reinventing the franchise
              from scratch.
