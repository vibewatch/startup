  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Konfío’s real market is not “all fintech” and not even all SME lending. The relevant boundary is the
              overlap of working-capital credit, business cards, payment acceptance, and business-finance workflows for
              formalizing Mexican micro, small, and medium enterprises. That means the included spend is the SME credit
              book, payment-acceptance economics, and operating-finance software budget that helps small businesses
              manage invoices, cash collection, and treasury. Excluded spend includes consumer BNPL, large-corporate
              treasury systems, pure payroll software, and deposit-gathering economics that Konfío cannot yet access
              until a banking license is granted. The most important substitutes are not always other fintechs. OECD,
              CIAL Dun & Bradstreet, and company interviews all show a status quo where SMEs still rely on owner
              capital, supplier credit, personal cards, and cash-heavy workflows. Those substitutes matter because they
              lower visible demand even when the financing need is real. In other words, Konfío is selling not only
              against incumbent banks and rival fintechs, but also against informality, tax anxiety, and the habit of
              solving business liquidity with non-specialized tools.
