  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Surface
        blocks:
          - type: paragraph
            body: >-
              Konfío’s public product surfaces imply a blended revenue model rather than a single lending spread. The
              credit product monetizes working-capital financing; the business card adds a second financing surface; the
              payments product clearly monetizes merchant acceptance with a visible starting commission; and the broader
              management-tool messaging suggests a software or workflow-attachment strategy, even if the public record
              does not cleanly show whether those tools are paid directly or used primarily to improve acquisition,
              underwriting, or retention. This matters because a blended SME-finance platform can diversify revenue away
              from pure origination and interest income, but only if non-credit products convert into meaningful fee or
              retention economics. Public evidence supports the existence of multiple monetization surfaces, yet does
              not disclose their revenue mix, gross margins, or take rates beyond a small set of list-pricing cues. The
              correct underwriting posture is therefore to treat the revenue architecture as directionally diversified
              but quantitatively opaque.
