              customer-service, and contact-center processes while keeping synchronization with internal databases and
              accelerating development through Lightning Web Components and integrations. That is not deep
              infrastructure disclosure, but it is good evidence that the company runs a layered operating model:
              fiscal-data ingestion and underwriting, product decisioning, mobile/product-control surfaces, payments
