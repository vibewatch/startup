      - number: '7.4'
        title: Execution, mitigants, and thesis-breaks
        blocks:
          - type: paragraph
            body: >-
              The residual decision question is whether Konfío's visible mitigants are enough to absorb these risks
              during a transition from fintech lender to broader SME-bank platform. There are real positives: legal
              disclosures are thorough, support and complaint channels are public, governance-improvement case studies
              exist, bias-control evidence is stronger than at many fintech peers, and institutional funders have
              already extended sizable lines. But the company still asks the market to trust several opaque systems at
              once: credit- loss management, fraud defenses, customer-service quality, collections conduct, aggregator
              resilience, and license timing. The thesis can break in multiple ways before any existential failure
              occurs. A prolonged license delay, a material deterioration in borrower quality, evidence of abusive
              collections or operational incidents, or renewed difficulty rolling warehouse lines would all challenge
              the premium-platform narrative. This is therefore an investable but control-heavy risk profile, not a
              low-volatility fintech story.
