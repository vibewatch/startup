      - number: '8.5'
        title: Final diligence asks, thesis-break triggers, and exit posture
        blocks:
          - type: paragraph
            body: >-
              The final recommendation stays conservative because the missing information sits exactly where valuation
              decisions are won or lost. Investors still need current revenue, take-rate or net-interest economics by
              product, default and reserve behavior, capital-structure terms, facility covenants, and a concrete
              post-license operating plan. Public evidence is strong enough to justify monitoring and continued
              diligence, but not strong enough to justify forcing a fresh lead or paying a confidence premium above the
              last disclosed mark. The cleanest upgrade trigger would be a package of audited economics plus explicit
              bank-license progress that shows Konfío is becoming a higher-multiple SME platform rather than merely a
              larger risk-bearing lender. The cleanest downgrade triggers would be renewed funding dependence,
              credit-quality deterioration, conduct failures, or a delayed licensing path that makes the 2021 unicorn
              label look stale rather than strategic.
