            body: >-
              Konfío’s capital history shows a company that used both venture equity and structured debt to build scale.
              The best-supported venture milestone is the June 2021 Series E round of US$125 million led by Lightrock
              with participation from SoftBank Latin America Fund, Kaszek, QED, IFC, VEF, and Tarsadia; later reporting
