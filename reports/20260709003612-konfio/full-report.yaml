        title: Exhibits
        blocks:
          - type: callout
            title: Konfío’s TAM is large, but its true SAM is the formalization bottleneck
            body: >-
              The biggest mistake in underwriting this market is to equate 5.4 million MSMEs with 5.4 million
              finance-ready customers. The evidence instead says Konfío wins where digital behavior, invoice data, and
              financing need intersect — a smaller but still attractive market that rewards underwriting discipline over
              headline scale.
            calloutType: insight
            claimRefs:
