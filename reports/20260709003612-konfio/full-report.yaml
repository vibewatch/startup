      - number: '4.3'
        title: 'Public Performance Signals and Unit Economics: What We Know vs. What We Do Not'
        blocks:
          - type: paragraph
            body: >-
              There are some promising but incomplete operating signals. VEF and other 2021 sources said Konfío’s loan
              book grew 20% in 2020 while traditional bank credit contracted. Management told El Cronista in 2026 that
              Konfío has crossed the profitability threshold during the last two years, that its risk models support a
              healthier-than-industry-average portfolio, and that the company ranks eighth by SME loan-book size
              compared with banks. Yet these are not audited statements. No public revenue, net income, charge-off,
              delinquency, funding-cost, CAC, payback, or lifetime-value figures were identified. That means the public
              record can support a qualitative unit-economics bridge — customer acquisition, underwriting, funding,
              servicing, and loss absorption — but not a reliable numeric model. The diligence implication is simple:
              public claims suggest Konfío may be a stronger operator than many late-stage fintechs, but they do not
              remove the need for full private-cohort and asset-quality analysis.
