              - CM003
              - CM010
              - CM041
          - type: callout
            title: The market is attractive precisely because it is hard
            body: >-
              High rates, low trust, cash reliance, and tax-formality fears are not temporary bugs; they are the
              structural reasons the gap exists. Any forecast that assumes frictionless migration from cash or supplier
              credit into digital SME finance will overstate both growth and margin durability.
            calloutType: risk
            claimRefs:
              - CM005
              - CM006
              - CM010
              - CM028
              - CM040
          - type: callout
            title: Konfío’s multi-product design matches how Mexican SMEs actually adopt fintech
            body: >-
              The most useful market insight is that adoption often starts with a workflow pain, not with a category
              label. Payments, cards, and business-management tools can lower CAC and improve underwriting, which is why
              a combined platform has more strategic value than a stand-alone lender.
