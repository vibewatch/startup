              most current financing event is the December 2024 debt package totaling MXN7.422 billion from Goldman
              Sachs, JPMorgan Chase, and Afore Sura México. Public 2026 interviews add a notable operating claim: both
              David Arana and Eugenio Fonseca describe the company as profitable, with Arana saying profits started in
              2024 and Fonseca saying the last two years have been above the profitability threshold. The caveat is that
              many scale counters are company-defined and move over time: reviewed sources variously cite about 80,000,
              85,000, 90,000, and 98,000 businesses served, so the prudent read is that Konfío is large and still
              growing, but public disclosure quality remains private-company light.
