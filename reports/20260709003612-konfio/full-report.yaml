      - number: '8.4'
        title: Bull, base, and bear valuation cases
        blocks:
          - type: paragraph
            body: >-
              Scenario work is more supportable than point-estimate precision. A bear case around $500 million to $900
              million assumes the banking license slips materially, credit or conduct concerns rise, and investors start
              valuing Konfío more like a risk-sensitive lender or merchant-finance platform than like a premium digital
              bank. A base case around $900 million to $1.4 billion assumes the current multi-product strategy is real
              and the 2021 mark is still directionally defendable, but that public opacity on revenue, losses, and
              cap-table terms keeps the company from earning a meaningful markup on public evidence alone. A bull case
              around $1.5 billion to $2.0 billion requires several things to go right together: bank-license approval,
              proof that deposits and treasury deepen the platform, continued profitability, stable credit quality, and
              no punitive financing structure. In other words, upside exists, but it is catalyst-heavy and
              disclosure-dependent.
