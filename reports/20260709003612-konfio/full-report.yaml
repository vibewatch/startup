      - number: '2.3'
        title: Buyer, User, Payer, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The buyer map in this market is more operational than in consumer fintech. In micro and small businesses,
              the owner-manager is usually buyer, user, and payer at once. In more mature SMEs, the finance manager,
              accountant, or operations lead becomes the day-to-day user, while the owner or CFO still owns the budget
              and credit decision. This matters because adoption often starts with the easiest workflow pain, not with a
              pure financing product. A merchant may start with payment acceptance, then use digital transaction history
              to qualify for credit, then graduate into cards or treasury tools. Enterprise financial-management
              providers and payment aggregators therefore compete for the same relationship entry point. Konfío’s own
              positioning — credit plus card plus payments plus management tools — fits that path. The friction is that
              digital behavior and trust are uneven. Mexico Business News says only 17% of SME transactions are
              conducted via electronic bank transfers, while cash still dominates much of the economy. The market
              therefore rewards products that collapse setup time and documentation burden, while penalizing offerings
              that require high formality, multiple integrations, or branch-like onboarding.
