      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Valuation Relevance
        blocks:
          - type: paragraph
            body: >-
              The market has real drivers, but each comes with a paired constraint. Digital payments infrastructure is
              improving, with mobile-banking adoption reaching 69% in 2024 and Banxico-linked infrastructure processing
              more than 6 billion transactions in 2025. Plan México and the government-bank agreement to expand SME
              financing also create political momentum behind formal credit growth. The 2026 Finnovista readout says the
              ecosystem is maturing: 77% of fintechs now use AI, 80% collaborate with banks, and infrastructure-oriented
              B2B models are gaining ground. Those are good signs for Konfío because the company already sits at the
              intersection of lending, payments, and SME operating software. But the constraints are equally material.
              OECD still shows a 15.59% average MSME loan rate and a 4.88-point rate premium versus large firms; 27% of
              unfunded MSMEs cite cost as the main obstacle. Mexico Business News also says 80% of transactions remain
              cash and that fraud, cyberattacks, and trust are central barriers. The right valuation takeaway is
              therefore not “the market is huge,” but “the market is large enough to support Konfío if funding costs,
              trust, and regulatory timing improve faster than acquisition friction and credit losses.”
