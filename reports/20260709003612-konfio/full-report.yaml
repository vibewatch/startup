        title: Comparable set, public-market backdrop, and sensitivity
        blocks:
          - type: paragraph
            body: >-
              The best public valuation discipline comes from comparable companies, but the comp set is structurally
              wide because Konfío is not a clean single-category business. Nu and SoFi matter because Konfío aspires to
              a broader digital-banking relationship with SMEs. StoneCo and PagSeguro matter because Konfío already
              touches merchant payments and business-finance workflows. Upstart matters because Konfío's underwriting
              story leans on alternative data and machine-learning speed in credit decisions. Those public businesses
              trade on very different capitalization-to-revenue ratios in July 2026: about 6.08x for Nu, 5.77x for SoFi,
              2.74x for Upstart, 1.02x for StoneCo, and 0.66x for PagSeguro. At a $1.3 billion valuation, Konfío would
              need roughly $214 million of revenue to look like Nu, $225 million to look like SoFi, $474 million to look
              like Upstart, $1.27 billion to look like StoneCo, or nearly $1.97 billion to look like PagSeguro on the
              same simple ratio. That spread does not prove value; it proves how sensitive the answer is to
              business-model interpretation and undisclosed economics.
