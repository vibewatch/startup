              technology-focused, trains employees through Universidad Konfío, and recruits around critical-thinking and
              execution. The Org's engineering map shows dedicated payments, data-engineering, reliability, and
              cybersecurity roles, while the LinkedIn company profile still describes proprietary algorithmic
              underwriting and an ambition to move beyond lending into tools and platforms. The product therefore looks
              commercially mature, but public technical depth remains uneven: there is no openly browsable developer
              documentation set, no public API reference, and no transparent benchmark file showing how the underwriting
