  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and valuation framework
        blocks:
          - type: paragraph
            body: >-
              Konfío clears the quality bar for continued diligence but not the disclosure bar for a firm buy call on
              public evidence alone. The positive case is real: the company has meaningful SME scale, a multi-product
              stack, institutional debt support, and management commentary suggesting profitability and a path toward a
              fuller banking platform. The negative case is equally real: the last clean price anchor is still the
              September 2021 $1.3 billion unicorn valuation, there is no public current revenue or loan-book-loss file,
              and the most important strategic catalyst—the banking license—remained pending in March 2026. That means
              price discipline must do more work than narrative confidence. On a pure company-quality lens, Konfío
              deserves attention. On a price-underwriting lens, the right stance is Track / Research-More with medium
              confidence and high risk until investors can reconcile current economics, current cap-table structure, and
              whether the business is evolving toward a Nu/SoFi-style platform or remaining closer to a thinner-margin
              lender/payments hybrid.
            claimRefs:
