coverageNotes: >-
  Coverage reflects official Konfío materials plus independent news, market-data, legal, app-store, and public-company comparison sources through 2026-07-09.
  The company story is credible on product breadth, scale, funding support, and SME relevance, but the valuation story remains anchored in a 2021 unicorn round and a
  2024 debt expansion rather than in current audited public economics. The most important open variable is whether Konfío successfully converts its pending banking-license
  process into deposit and treasury products without weakening credit quality, conduct, or disclosure discipline.
