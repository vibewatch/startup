companyProfile:
  summary: >-
    Konfío is a 2013-founded Mexico City fintech led publicly by cofounder-CEO David Arana. It operates today through Red Amigo DAL,
    S.A.P.I. de C.V., SOFOM, E.N.R., and has expanded from unsecured SME working-capital lending into business cards, merchant payments,
    and app-based analytics and servicing. Public evidence supports real scale—more than 98,000 businesses using the platform, more than
    MXN40 billion financed, and meaningful institutional debt support—while also showing that deposit and treasury expansion still depend
    on a pending banking-license process.
  foundedDate: '2013-01-01'
  founders:
    - name: David Arana
      role: Co-Founder and CEO
      claimRefs: [CO001, CO005]
    - name: Francisco Padilla
      role: Co-Founder
      claimRefs: [CO001, CO006]
  foundingLocation: Mexico City, Mexico
  headquarters: Mexico City, Mexico
  productSummary: >-
    Crédito Empresarial, Tarjeta Empresarial, Konfío Pagos terminals and remote acceptance, and a mobile app that consolidates credit,
    card, payments, analytics, and support workflows for SMEs.
  customerFocus: >-
    Mexican small and medium-sized businesses needing first-time or repeat working-capital financing, spend controls, supplier liquidity,
    and merchant acceptance tools.
  businessModel: >-
    Balance-sheet SME lending plus business-card economics, merchant-payments monetization, and a longer-term push toward deeper banking
    relationships if the company secures a banking license.
  stage: Late-stage private / unicorn
  fundingStatus: >-
    Last clean public equity anchor is the September 2021 unicorn round at about $1.3B tied to a $235M raise. The strongest newer capital
    signal is a December 2024 MXN7.422B debt package from Goldman Sachs, JPMorganChase, and Afore Sura México rather than a disclosed fresh equity mark.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO004, CO005, CO010, CO014, CO015, CO022, CO026, CO029, CE026]
summary:
  headline: >-
    Konfío looks like a real, scaled SME-finance platform with credible product breadth and institutional support, but unresolved valuation,
    credit-quality, and license-timing questions keep the posture at track rather than buy.
