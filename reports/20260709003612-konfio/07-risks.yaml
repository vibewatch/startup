  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: credit-loss-disclosure
      missingEvidence: Public default, delinquency, restructuring, recovery, reserve, and vintage-loss data for Konfío's credit and card books.
      whyItMatters: The core investment risk is not whether Konfío can originate, but whether it can scale thin-file unsecured credit profitably through a full cycle.
      diligencePath: Request quarterly vintage tables, impairment policy, reserve methodology, delinquency migration, and recoveries by cohort.
      relatedQuestionRefs: [QR021, QR024, QR030]
    - type: private-evidence-only
      severity: material
      topic: security-and-incident-transparency
      missingEvidence: Public or private trust-portal materials, security certifications, incident logs, uptime data, reconciliation error rates, and fraud-loss dashboards.
      whyItMatters: The app and payments stack are core servicing rails, yet the public file offers little externally auditable resilience evidence.
      diligencePath: Request SOC / ISO / PCI evidence, incident reports, uptime history, reconciliation controls, and fraud monitoring dashboards.
      relatedQuestionRefs: [QR012, QR020, QR022, QR030]
    - type: private-evidence-only
      severity: material
      topic: bank-license-execution
      missingEvidence: Regulator correspondence, approval timeline assumptions, operating-plan changes, and deposit-launch readiness documents tied to the banking-license process.
      whyItMatters: The upside case depends materially on a regulatory transition that had not yet been completed publicly by runDate.
      diligencePath: Request CNBV process materials, readiness workstreams, contingency plans, and product-launch sequencing if approval slips.
      relatedQuestionRefs: [QR003, QR004, QR005, QR027]
    - type: biased-source-set
      severity: moderate
      topic: official-risk-surface
      missingEvidence: Independent collections-quality, customer-complaint, or conduct data that validates or challenges Konfío's own legal and support disclosures.
      whyItMatters: The public risk file contains strong company-authored disclosures but limited independent evidence on how those controls perform in practice.
