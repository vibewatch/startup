callouts:
  - calloutType: risk
    title: The banking thesis is not yet inside the legal perimeter
    body: >-
      Konfío can market a broader SME-finance platform today, but deposit and treasury expansion still depend on a banking-license decision
      that was publicly pending in March 2026. Until that changes, the platform upside remains partially contingent.
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR005
  - calloutType: insight
    title: Warehouse funding and underwriting quality are joined at the hip
    body: >-
      Growth depends on institutional lenders keeping confidence in a loan book that is heavily first-credit, often unsecured, and evaluated
      through alternative-data models. That makes transparency on losses and risk governance unusually important.
    claimRefs:
      - CR022
      - CR025
      - CR028
      - CR029
      - CR030
      - CR032
      - CR043
  - calloutType: strength
    title: Konfío is not ignoring governance and conduct questions
    body: >-
      The company does publish formal collection rules, CAT disclosures, complaint channels, governance-improvement case evidence, and a
      third-party bias audit. Those signals do not close the diligence gap, but they are better than a purely opaque fintech file.
    claimRefs:
      - CR008
      - CR010
      - CR012
      - CR034
      - CR035
      - CR036
