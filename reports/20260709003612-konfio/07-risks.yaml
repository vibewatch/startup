  - id: TR006
    title: Mitigation and kill criteria table
    columns:
      - Risk area
      - Current mitigation
      - Monitoring indicator
      - Thesis-break trigger
      - Diligence ask
    rows:
      - - Bank-license execution
        - Management says the application is in final stage and requirements are met
        - Explicit regulatory approval and launch roadmap
        - License delay or denial extends beyond expected planning horizon
        - Request regulator correspondence and implementation plan
      - - Credit / loss quality
        - Alternative-data model, bias audit, and governance-improvement case study
        - Vintage defaults, delinquency buckets, and recovery curves
        - Rising delinquencies or materially weaker post-2024 cohorts
        - Request full loan-book and card-book performance tables
      - - Funding resilience
        - Multiple institutional lenders and extended maturities
        - Headroom, renewal timing, and covenant / facility usage data
        - Renewal stress or reduced capital access before business reaches true deposit funding
        - Request facility summaries and refinancing pipeline
      - - Conduct / collections quality
        - Published agency lists, payment restrictions, and UNE complaint channel
        - Complaint rates, regulator notices, call-frequency rules, and cure performance
        - Pattern of abusive-collections complaints or regulator action
        - Request complaint logs and collections QA dashboards
      - - Security / ops resilience
        - Public support surfaces, CRM stack, and fraud-awareness content
        - Incident rate, uptime, security attestations, and reconciliation accuracy
        - Material servicing outages, payment-sync failures, or unaddressed security incidents
        - Request trust-portal materials, incident logs, and fraud dashboards
    notes: The chapter's main conclusion is not that risk is unmanageable, but that most of the decisive controls are still private rather than externally auditable.
