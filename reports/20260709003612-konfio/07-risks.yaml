      - CR015
    tableRefs:
      - TR001
    figureRefs:
      - FR002
  - id: conduct-operational-and-security-risk
    title: Conduct, operational, and security risk
    body: >-
      The second risk cluster sits in day-to-day customer operations. Konfío increasingly routes credit servicing, card control, payment
      monitoring, statements, and business analytics through a single mobile app surface. That helps stickiness, but it also means service
      reliability becomes central to credit trust. Public app-store evidence already shows some friction: a May 2026 review complained that
      the app and web experience were poor, payment status lagged after repayment, and collections calls became excessive after one late
      day. Official disclosures partly mitigate this by publishing complaint channels and restricting payment collection to Konfío directly,
      yet the public diligence set still lacks uptime reporting, incident disclosures, security-certification pages, or external service-
      level metrics. Operationally, Konfío also depends on external systems: Salesforce for customer operations and Cobra Online for
      payment aggregation. That is not disqualifying, but it creates real failure modes in service continuity, compliance, and customer
      experience.
    claimRefs:
      - CR009
      - CR010
      - CR011
      - CR016
      - CR017
      - CR018
      - CR019
