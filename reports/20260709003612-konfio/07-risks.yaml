        - March 2026 reporting says the CNBV decision was still pending
        - Management says requirements have been satisfied and filing entered in 2024
        - High
        - Deposit-and-treasury expansion can slip without altering current lending legality
      - - Current legal-perimeter mismatch
        - Official pages repeat SOFOM E.N.R. status under limited CNBV supervision
        - Strong disclosure hygiene and formal customer notices
        - Medium-High
        - Investors should underwrite the current business as non-bank until approval is explicit
      - - Product-term complexity
        - Terms say services span applications, websites, and platforms with product-specific conditions
        - Public general terms and product disclosures exist
        - Medium
