summary:
  headline: >-
    Konfío looks like a real, scaled SME-finance platform with credible product breadth and institutional support, but
    unresolved valuation, credit-quality, and license-timing questions keep the posture at track rather than buy.
  overallScore: 6.6
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: fair
