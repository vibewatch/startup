  topStrengths:
    - Real multi-product workflow breadth across credit, cards, payments, analytics, and customer-service rails
    - Meaningful SME scale with 98,000+ businesses on platform and 40B+ MXN financed
    - >-
      Institutional funding support from Goldman Sachs, JPMorganChase, and Afore Sura provides growth capacity and
      external validation
    - Bank-license path, if completed well, could deepen wallet share through deposits and treasury services
    - Public evidence shows Konfío remains relevant across multiple SME sectors rather than one narrow borrower niche
  topRisks:
    - The banking-license process was still pending in March 2026, so part of the upside case remains contingent
    - Public disclosure is still thin on current revenue, reserve quality, defaults, and cap-table structure
    - Valuation is easy to overpay for because the last clean equity mark is still a 2021 unicorn round
    - The borrower base includes many first-time business-credit users, increasing sensitivity to credit-quality drift
    - >-
      Conduct, collections, servicing, and security-transparency gaps could damage trust faster than product breadth can
      offset
  unresolvedGaps:
    - Current revenue, product mix, spread / fee economics, and audited profitability detail
    - Vintage losses, delinquency, recoveries, reserve methodology, and stress performance by cohort
    - Current cap table, preference stack, and any post-2021 financing terms
    - Debt-facility covenants, usage, refinancing schedule, and liquidity headroom
    - >-
      Concrete readiness plan for converting a banking license into deposit and treasury adoption without control
      failures
