            body: >-
              Konfío 的资金基础，是其公开财务画像中最清楚的部分。IDB Invest 披露了 2019 年最高 US$40 million 的授信，以及 2020 年等值 US$54.329 million
              的本币仓储额度，目的是累积微中小企业贷款，用于未来证券化。这强烈表明，Konfío 的规模模型不只依赖股权，还依赖结构化信贷和资本市场循环。2021 年 Series E 被广泛报道为 US$125
              million，尽管一些后续回顾引用了一笔对应独角兽里程碑的 US$110 million 分批融资。对未来产能更重要的是，2024 年末披露显示 Goldman Sachs、JPMorgan Chase 和
              Afore Sura Mexico 提供了 MXN7.422 billion 战略债务额度。这些额度明确支持营运资金贷款和企业卡融资，并把期限延伸到 2027 年和 2028
              年。因此，公司看起来具备信贷驱动型金融科技应有的特定资本强度：成功取决于维持融资渠道、仓储能力和损失表现，让机构贷方持续放心。
