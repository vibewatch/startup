  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手 / 类别
      - 类型
      - 面向的中小企业痛点
      - 差异化
      - 相对 Konfío 或银行的局限
      - 关键来源
    rows:
      - - Konfío
        - 以信贷切入的中小企业经营金融科技公司
        - 面向墨西哥中小企业的首笔正规经营信贷、卡、支付和管理工具
        - 首贷切入点强，中小企业金融打包定位清晰
        - 尚无受保险保护的存款账户，也没有完整银行资金管理栈
        - SP001, SP002, SP026, SP027
      - - Clara
        - 支出管理 / 公司卡金融科技公司
        - 公司卡、供应商付款、审批、政策控制、ERP 同步
        - 拉美本地发行卡叠加强财务管控流程
        - 公开材料对其中小企业营运资金深度的支撑弱于 Konfío 或 Covalto
        - SP003, SP004, SP005
      - - Kapital
        - 财务运营和流动性平台
        - 现金流可视化、转账、开票、发薪、供应商流动性、保理
        - 一体化运营栈，把信贷 / 保理嵌入流程
        - 已获取材料更能支撑运营工具，较少支撑广泛支付收单或银行深度
        - SP006, SP007, SP008, SP009
      - - Covalto
        - 面向企业的受监管数字银行
        - 企业账户、信贷、投资、租赁、保理
        - 银行牌照、账户牵引关系、IPAB 保障存款，以及信贷与资金管理的相邻布局
        - 对首贷切入点和卡牵引的经营控制，可能不如 Konfío 聚焦
        - SP010, SP011, SP012, SP013
      - - Clip
        - 以支付切入的商户平台
        - 收卡、支付链接、二维码、结账、轻量商业软件
        - 收款和简单数字商业采用的入口很强
        - 对放贷广度或资金管理关系的证据远弱于 Konfío / Covalto
        - SP014, SP015, SP016, SP017
      - - 传统银行打包方案（以 BBVA 为例）
        - 传统银行 / 综合银行替代方案
        - 账户、资金管理、税务、保理、TPV、投资、创业企业银行服务
        - 存款、资金管理和客户关系广度，加上品牌信任
        - 通常开户更慢、更重，金融科技式流程聚焦更弱
        - SP018, SP020
    notes: 竞争集合按它们最先控制的客户任务分组。最危险的替代者往往不是纯正面对撞的中小企业贷款机构，而是先掌握初始工作流的相邻平台。
