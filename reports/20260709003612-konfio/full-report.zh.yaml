      - number: '1.3'
        title: 资本基础、盈利能力与规模信号
        blocks:
          - type: paragraph
            body: >-
              Konfío 的资本历史显示，公司同时使用风险股权和结构化债务来做规模。证据最充分的风险投资里程碑，是 2021 年 6 月由 Lightrock 领投、SoftBank Latin America
              Fund、Kaszek、QED、IFC、VEF 和 Tarsadia 参投的 US$125 million Series E；后续报道还称，2021 年 9 月追加的 Series E 以 US$110
              million 交割，并隐含 US$1.3 billion 估值。开发金融支持早于独角兽时刻：IDB Invest 在 2019 年披露 US$40 million 授信，并在 2020 年披露 MXN1.14
