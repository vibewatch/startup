companyProfile:
  summary: >-
    Konfío 是一家 2013 年创立、总部位于 Mexico City 的金融科技公司，公开层面由联合创始人兼 CEO David Arana 领导。公司目前通过 Red Amigo DAL, S.A.P.I. de C.V.,
    SOFOM, E.N.R. 运营，已经从无担保中小企业营运资金贷款，扩展到企业卡、商户收款，以及基于应用的分析和服务。公开证据支持其具备真实规模——超过 98,000 家企业使用平台、融资超过 MXN40
    billion，并获得有意义的机构债务支持——但也显示，存款和资金管理扩张仍取决于尚未落地的银行牌照流程。
