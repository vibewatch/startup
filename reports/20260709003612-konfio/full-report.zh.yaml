            body: >-
              Konfío
              的公开产品界面指向的是混合收入模式，而不是单一贷款利差。信贷产品通过营运资金融资变现；企业卡增加第二个融资界面；支付产品用可见的起始佣金明确变现商户收款；更广的管理工具信息则暗示软件或流程附着策略，尽管公开记录没有清晰说明这些工具是直接收费，还是主要用于改善获客、承保或留存。这一点重要，因为混合型中小企业金融平台可以把收入从纯发起和利息收入中分散出来，但前提是非信贷产品能够转化为有意义的费用或留存经济。公开证据支持多个变现面存在，但除了少量标价线索外，并未披露收入结构、毛利率或抽成率。因此，正确承保姿态是：把收入架构视为方向上多元，但数量上不透明。
