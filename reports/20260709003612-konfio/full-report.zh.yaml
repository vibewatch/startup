  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律边界
        blocks:
          - type: paragraph
            body: >-
              Konfío 的监管边界，是投资人首先要吃透的事。公司在关于页面、隐私通知、条款和 UNE 页面里，反复把 Red Amigo DAL 定义为受 CNBV 有限监督的 SOFOM
              E.N.R.，而不是持牌银行。这一点很关键：管理层 2026 年的信息口径称，下一步战略是拿到银行牌照，为中小企业增加存款账户和资金管理服务。换句话说，上行叙事里相当一部分仍取决于一个到 runDate
              还没有落地的监管事件。面向客户的法律文件做得规整——分产品条款、正式投诉渠道、已公布催收机构、付款警示和 CAT
              披露都有——但这份规整也把当前权限与长期叙事之间的缺口照得更清楚。若牌照延迟、被拒或受限，Konfío 仍会是一家有能力的贷款、卡和支付平台，但更大的中小企业银行论点会被推后。这一约束会影响所有上行情景假设。
