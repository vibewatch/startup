  - id: TV004
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 估值区间（USD B）
      - 核心假设
      - 失效条件
    rows:
      - - 牛市
        - 1.5 - 2.0
        - 银行牌照获批，盈利能力在干净信贷质量下得到确认，平台从信贷延伸到存款 / 资金管理
        - 牌照延误、损失飙升或融资条款恶化
      - - 基准
        - 0.9 - 1.4
        - 当前规模和产品广度真实存在，但不透明度让人无法确信应在 2021 年锚点上加价
        - 证据显示公开经济性远弱于叙事
      - - 熊市
        - 0.5 - 0.9
        - 市场把 Konfío 按带风险贷款机构 / 商户金融混合体定价，同时计入监管和行为合规包袱
        - 如果平台转型失败，或信贷风险显著上升
    notes: 这些区间是方向性、近似股权价值的判断，不是精确企业价值输出，因为当前股权结构和债务细节仍不完整。
    claimRefs:
