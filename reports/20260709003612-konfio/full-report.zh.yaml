  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与估值框架
        blocks:
          - type: paragraph
            body: >-
              Konfío
              达到了继续尽调的质量门槛，但仅凭公开证据，还没达到可以明确买入的披露门槛。正面论点成立：公司有实质性的中小企业规模、多产品栈、机构债务支持，管理层表态也指向盈利能力和更完整银行平台路径。负面论点同样成立：最后一个干净价格锚仍是
              2021 年 9 月 $1.3 billion 独角兽估值，公开材料没有当前收入或贷款账簿损失文件，最重要战略催化剂——银行牌照——到 2026 年 3
              月仍待定。这意味着价格纪律必须承担比叙事信心更多的工作。单看公司质量，Konfío 值得关注。按价格承销看，正确立场是跟踪 / 继续研究，置信度中等、风险高；在投资人厘清当前经济性、当前股权结构，以及业务是在走向
              Nu / SoFi 式平台，还是更接近薄利的贷款 / 支付混合体之前，不宜再进一步。
