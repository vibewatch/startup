      - number: '7.2'
        title: 行为、运营与安全风险
        blocks:
          - type: paragraph
            body: >-
              第二组风险落在日常客户运营上。Konfío 越来越多地把授信服务、卡控、支付监控、对账单和业务分析都收进同一个移动 App
              入口。这样能提高粘性，但也让服务可靠性成为信用信任的核心。公开应用商店证据已经显示摩擦：2026 年 5 月一条评论称，App
              和网页体验都差，付款后状态更新滞后，逾期一天后催收电话变得过多。官方披露公布投诉渠道，并规定只能直接向 Konfío
              收款，部分缓解了这一点；但公开尽调材料仍缺少可用性报告、事故披露、安全认证页面或外部服务级别指标。运营上，Konfío 还依赖外部系统：用 Salesforce 做客户运营，用 Cobra Online
              做支付聚合。这不构成一票否决，但确实在服务连续性、合规和客户体验上留下故障模式。
