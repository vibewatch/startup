      - number: '3.3'
        title: 相邻替代者与现有机构反击
        blocks:
          - type: paragraph
            body: >-
              Clip 和现有银行很关键，因为它们从相反两端攻击同一批客户。按贷款宽度看，Clip 不是 Konfío
              的直接等价物，但它是强大的商户入口替代品：支付链接、QR、结账、经常性付款、库存和数字目录工具，都可能成为小企业接触的第一个运营金融界面。一旦支付平台掌握交易流，它就能影响未来信贷和软件附着。BBVA
              这类现有机构从另一端竞争。它们已经能把账户、资金管理、缴税、factoraje、终端、投资产品，以及 BBVA Spark 这类面向初创企业的银行团队打包。Konfío 仍以 SOFOM
              身份运营、同时追求银行牌照，因此还无法匹配这种存款和资金管理完整性。战略含义是，Konfío 的侧翼风险来自两边：支付专家向上进入金融服务，银行或类银行玩家则压缩客户另建中小企业金融科技关系的必要性。
