      - number: '2.2'
        title: 规模测算口径与可触达需求
        blocks:
          - type: paragraph
            body: >-
              最有力的公开规模测算口径，是先从企业数量入手，再用信贷可得性收窄。OECD 2026 年墨西哥章节称，该国有 5.4 million 家微中小企业，其中 95.5% 为微型企业，2023 年只有 10.7%
              从任何来源获得融资。这比宽泛的“金融科技”标题更扎实，因为它抓住了 Konfío 正在变现的结构性稀缺。供给侧也可见：截至 2024 年末，微中小企业银行贷款组合达到 MXN565.4
              billion，仅占未偿商业贷款的 13.04%。市场定义分歧仍然重要。Trade.gov 引用墨西哥超过 1,104 家金融科技初创公司，而基于 Finnovista 的 2026 年摘要引用 795
              家本地金融科技公司，FinTech México 则提到约 770 个本地项目加 217 个外国项目。这些数字不一定矛盾；它们只是使用不同分母。对 Konfío 来说，实际 SAM
              不是整个生态数量，而是正式运营、想要更快承保、数字支付并最终整合银行服务的中小企业基础。这支撑了一个大机会，但不是无限机会，因为获客和还款行为仍与行业组合、正规化程度和利率敏感性绑定。
