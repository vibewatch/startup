chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品边界与监管状态
        blocks:
          - type: paragraph
            body: >-
              Konfío 不应被理解为单一产品贷款机构，而应被理解为面向中小企业的金融运营平台。第三方和公司控制来源都一致指向：David Arana 和 Francisco Padilla 于 2013
              年创立公司；官方公司时间线则把 2014 年标为发放第一笔企业贷款的年份。公司网站可见的法律实体是 Red Amigo DAL, S.A.P.I. de C.V., SOFOM,
              E.N.R.；同一披露还说明，公司当前业务不需要银行牌照，但在 SOFOM 体系下仍受 CNBV
              有限监管。产品界面证明其栈已经宽于简单定期贷款：首页和应用商店条目描述了企业信贷、企业卡、支付终端或远程支付链接，以及可从同一移动应用进入的企业管理或分析工具。这种宽度对尽调重要，因为它支撑了管理层的说法：Konfío
              想拿下更广的中小企业运营钱包，而不只是发放一次性贷款。它也解释了为什么公司当前的银行牌照努力，重点是在已有多产品平台上加入存款和资金管理功能，而不是从零重建业务。
