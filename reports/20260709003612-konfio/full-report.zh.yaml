    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 单位
      - 当前公开状态
      - 质量
      - 尽调问题
    rows:
      - - 营运资金信贷
        - 中小企业贷款的利息 / 融资收入
        - 未偿还 / 已发放贷款本金
        - 明显是核心，但未公开披露收入结构
        - 中
        - 索取按放款批次、行业和产品拆分的收益率
      - - 企业卡融资
        - 中小企业卡产品上的融资收入和卡相关费用
        - 卡额度、循环使用、融资费用
        - 产品营销清晰；经济性未公开拆分
        - 中
        - 索取交换费、循环率、不良率（NPL）和激活数据
      - - 支付收单
        - 终端和远程收单上的商户扣率 / 单笔交易佣金
        - 交易量和 MDR
        - 公开页面有 1.35% + IVA 的标价线索
        - 存在性高，已实现经济性低
        - 索取 TPV、扣除处理商成本后的净抽佣率，以及打款时点
      - - 企业管理工具
        - 可能直接软件变现，也可能通过留存 / 获客间接创造价值
        - 订阅、打包功能或免费
        - 工具明确存在；付费还是免费未公开
        - 低
        - 索取产品级定价和挂载率
      - - 结构化信贷 / 资本市场循环
        - 不是终端客户收入；提升资产发起和再融资能力
        - 仓储融资、证券化、债务利差
        - 公开证据显示这是扩张机制，不是收入流
        - 资本赋能价值高
        - 索取证券化经济性、预付率和契约条款组合
    notes: 公开材料支持多种变现触点，但没有量化收入结构。信贷很可能仍占主导，支付和工具要么贡献直接费用收入，要么改善漏斗经济性。
