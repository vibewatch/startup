  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合分类
        blocks:
          - type: paragraph
            body: >-
              Konfío 不应只拿来和“其他中小企业贷款机构”对标。买方至少可以用五条路径解决同一个底层问题：像 Konfío 这样的信贷驱动型金融科技平台；像 Clara 这样的支出管理和企业卡栈；像 Kapital
              这样的财务运营和流动性套件；像 Covalto 这样的受监管数字银行；像 Clip 这样的支付驱动商户平台；或者像 BBVA Empresas
              这样的传统银行关系。现状替代品也重要：供应商信用、现金和个人卡仍很常见。因此，真实竞争集合会随买方入口变化。如果客户从紧急流动性开始，Konfío 和 Covalto
              最接近。如果客户从费用控制或采购政策开始，Clara 会成为更直接的替代方案。如果客户从收款、结账或数字目录需求开始，Clip
              可能在信贷被考虑之前就拿下关系。因此，竞争问题不是谁的品牌最大，而是谁控制了中小企业金融栈里的第一个耐久流程。
