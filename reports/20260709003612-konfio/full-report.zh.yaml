              MXN7.422 billion 的债务包。公开的 2026 年访谈还补充了一个值得注意的经营说法：David Arana 和 Eugenio Fonseca 都称公司已经盈利，Arana 称利润从 2024
              年开始，Fonseca 称过去两年都高于盈利门槛。限制在于，许多规模计数由公司定义，且随时间变化：已审阅来源分别引用约 80,000、85,000、90,000 和 98,000
              家服务企业。因此谨慎读法是，Konfío 规模大且仍在增长，但公开披露质量仍是私营公司水准。
