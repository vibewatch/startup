  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Konfío
              的真实市场不是“所有金融科技”，甚至也不是所有中小企业贷款。相关边界是：面向正在正规化的墨西哥微型、小型和中型企业，营运资金信贷、企业卡、收款受理和企业财务流程的交集。这意味着纳入支出包括中小企业信贷账本、收款受理经济，以及帮助小企业管理发票、回款和资金的运营财务软件预算。排除支出包括消费者
              BNPL、大企业资金管理系统、纯薪资软件，以及 Konfío 在获得银行牌照前仍无法进入的揽储经济。最重要的替代品并不总是其他金融科技。OECD、CIAL Dun & Bradstreet
              和公司访谈都显示，现状是中小企业仍依赖业主资本、供应商信用、个人卡和大量现金流程。这些替代品重要，因为即使融资需求真实，它们也会压低可见需求。换句话说，Konfío
              不只是在对抗现有银行和金融科技对手，也是在对抗非正规经营、税务焦虑，以及用非专门工具解决企业流动性的习惯。
