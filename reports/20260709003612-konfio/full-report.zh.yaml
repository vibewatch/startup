  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面与用户流程
        blocks:
          - type: paragraph
            body: >-
              Konfío 的产品最好被理解为中小企业运营金融包：从信贷开始，但不止于信贷。当前公开界面至少支持四个正在主动营销的模块。第一，Crédito Empresarial 提供无担保营运资金融资，公开声称最高
              MXN10 million、48 小时放款、连接 SAT 的承保，以及最低运营和收入门槛。第二，Tarjeta Empresarial 把关系延伸到日常支出、供应商转账、营运资金灵活性、ERP
              就绪报告、费用控制、返现，以及基于应用的分期转换。第三，Konfío Pagos
              通过终端、远程支付、MSI、钱包受理、基于角色的收款权限和实时入账监控，把公司推向商户收款。第四，移动应用用分析、提醒、卡控制和支持，把这些产品绑在一起。这种流程设计重要，因为它显示 Konfío
              想掌握中小企业现金生成、现金部署和现金可见性的完整周期，而不只是发放一次性贷款。公开不一致仍存在——信贷页面宣传最高 MXN10 million，而 2024 年 12 月融资说明强调最高 MXN5
              million 贷款和 MXN2 million 卡融资——但更大的模式很清楚：Konfío 是面向墨西哥中小企业的多界面金融操作系统。
