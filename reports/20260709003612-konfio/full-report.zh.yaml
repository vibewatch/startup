      - number: '4.4'
        title: 财务披露缺口与投委会含义
        blocks:
          - type: paragraph
            body: >-
              最重要的结论不是 Konfío
              缺少财务实质，而是公开证据分布不均。债务额度、产品包装，以及围绕成为银行的战略意图披露充足；实际定价、收入结构、资金成本、损失率和现金生成则少得多。这种不对称会误导投资人，把已融资本身过度当作财务质量代理。这也是银行牌照流程在经济上重要的原因：更便宜的资金、揽储和资金管理关系，会同时改变收入结构和资本效率。在这些数据被披露或通过私下验证之前，最强的公开财务观点只能是受约束的：相对许多同行，Konfío
              看起来资金充足；按管理层说法，似乎已经盈利；并且明显是多产品公司。但它仍未披露足够变量，无法承保可持续 ROE 和下行韧性。这足以支持谨慎的方向性判断，不足以支持干净的投资级预测。
