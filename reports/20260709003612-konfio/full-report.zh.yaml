            title: Konfío 的 TAM 很大，但真实 SAM 是正规化瓶颈
            body: >-
              承保这个市场时，最大的错误是把 5.4 million 家微中小企业等同于 5.4 million 个准备好使用金融服务的客户。证据更准确地说明：Konfío
              在数字行为、发票数据和融资需求交汇处取胜——这是一个更小但仍有吸引力的市场，奖励承保纪律，而不是标题式规模。
