        title: 最终尽调问题、论点破裂触发点与退出姿态
        blocks:
          - type: paragraph
            body: >-
              最终建议保持保守，因为缺失信息恰好落在估值成败的关键处。投资人仍需要当前收入、按产品拆分的收费率或净息差经济性、违约和准备金行为、资本结构条款、授信契约，以及拿牌后的具体运营计划。公开证据足以支持监控和继续尽调，但不足以支持主动领投新一轮，或在最后披露估值之上支付信心溢价。最清晰的上调触发点，是一揽子经审计经济性，加上明确银行牌照进展，证明
              Konfío 正在成为更高倍数的中小企业平台，而不只是更大的风险自持贷款机构。最清晰的下调触发点，是融资依赖再现、信用质量恶化、行为失范，或牌照路径延迟，让 2021 年独角兽标签显得过时而非战略性。
