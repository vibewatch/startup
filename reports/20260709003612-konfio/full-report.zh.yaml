  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 公司
      - 可见套餐或合同线索
      - 包含能力
      - 公开定价线索
      - 含义
    rows:
      - - Konfío
        - 以风控授信牵引的中小企业金融打包方案
        - 信贷、卡、支付终端、企业工具
        - 未获取到类似零售的公开标价；很可能按关系和风险定价
        - 打包广度具备战略价值，但公开价格透明度仍限制尽调
      - - Clara
        - 以软件牵引的卡和支出管理栈
        - 公司卡、支出管理、供应商付款、审批、ERP 同步
        - 提到 ROI 计算器、返现和 40 天信用期；未获取到简单标价
        - 面向财务负责人的管控叙事强于纯信贷主张
      - - Kapital
        - 嵌入产品的一体化平台
        - 仪表盘、转账、发票、发薪、Crédito FLEX、保理
        - 未获取到简单公开价目表
        - 买方尚未寻求大额信贷额度前，可能先被单一运营控制台吸引
      - - Covalto
        - 银行账户与信贷打包
        - 账户、SPEI、投资、信贷、保理、租赁
        - 未获取到简单公开价目表；营销重点包括存款和投资收益率
        - 如果一个银行栈覆盖日常运营，就能挤掉分散的金融科技服务关系
      - - Clip
        - 按交易计价的商户定价
        - 结账、链接、二维码、订阅、终端、目录 / 库存
        - 获取的支付页面显示，每笔成功线上销售收取 3.6% + IVA
        - 面向中小商户收单的打包很清晰，但不是完整信贷或资金管理组合
      - - BBVA Empresas
        - 关系型银行打包
        - 税务、Net Cash、保理、TPV、资金管理、投资、Spark
        - 定价多按关系确定 / 获取页面未列明
        - 当买方想整合主办银行关系时，在位银行的广度可能压过金融科技的便利性
    notes: 有意保留未知定价单元格。公开材料在打包和工作流入口上的信息更丰富，无法充分支撑中小企业定价的横向对比。
