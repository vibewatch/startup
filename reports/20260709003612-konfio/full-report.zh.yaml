      - number: '7.3'
        title: 融资、交易对手与模型风险
        blocks:
          - type: paragraph
            body: >-
              Konfío 的增长引擎本质上依赖资产负债表和模型。2024 年 12 月融资公告把 Goldman Sachs、JPMorganChase 和 Afore Sura 提供的 MXN7.422 billion
              机构债务，直接绑定到新增贷款和卡额度。这是正面信号，但也说明规模仍取决于资金方信心和再融资可得性。资产端，借款人组合天然比普通银行贷款更冒险：管理层称，超过 80%
              融资是客户拿到的第一笔企业信贷，许多客户没有担保或传统银行历史，承保叙事依靠替代数据和机器学习速度，而不是传统抵押品。公开的模型治理证据存在，但仍不完整。BID Invest
              称曾审计算法是否存在性别偏见，并发现男女客户拿到的报价和还款行为一致；FinDev Gateway
              称治理改进帮助安抚了客户、投资人和债权人。这些都是有用缓释项，但投资人仍看不到公开的按放款批次损失曲线、逾期分桶或压力测试数据。
