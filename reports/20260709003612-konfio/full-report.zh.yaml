  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 目标客户画像与分层
        blocks:
          - type: paragraph
            body: >-
              Konfío
              的目标客户不是整个墨西哥中小企业宇宙，而是其中正在正规化或已经正规化的小型和中型企业：它们能提供足够经营证据，支持快速数字承保，也能从同一关系中的营运资金、支出和收款工具受益。公开资格门槛说明了这一点。信贷申请人需要至少三个月运营记录和约
              MXN50,000
              月收入；卡产品要求至少六个月运营记录和同样的月收入底线。行业页面进一步拓宽了图景，显示横向覆盖制造、建筑、零售、批发和专业服务。这些细分页面反复出现行业特定用例——连续生产、项目融资、库存时点、竞争性批发定价和最后一刻服务交付——说明
              Konfío 围绕现金周期压力组织市场拓展，而不是围绕一个狭窄垂直行业。这样的 ICP 设计适合一个想要重复产品使用的贷款机构：同一位业主兼经理可以在不离开 Konfío
              生态的情况下借款、管理员工支出、支付供应商并接受客户付款。
