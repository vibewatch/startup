            body: >-
              公开技术文件不完整，但足够具体，可以勾勒出运营架构。在信贷和卡侧，Konfío 页面及 2026 年访谈称，承保从公司开票和连接 SAT
              的税务数据开始，而不是从重抵押的银行历史开始。应用和卡界面随后把这一决策层延伸到持续支出管理：管理员可以设置基于角色的权限，在应用里把购买转为分期，数字化收据，并在一个地方监控信贷、卡和企业表现数据。支付增加了另一条运营轨道。Konfío
              Pagos 被明确披露为由 Cobra Online, S.A.P.I. de C.V. 管理和提供的服务，后者是授权 Konfío licensiatario 和卡支付聚合商；这意味着 Konfío
              的中小企业钱包已经依赖第三方受监管收单栈，而不是垂直自清算。客户运营也明显产品化。Salesforce 客户故事称，Konfío 从碎片化内部工具迁移到 Salesforce Customer
              360，推出线上销售、线下销售、卡、客服和联络中心流程，同时保持与内部数据库同步，并通过 Lightning Web Components
              和集成加速开发。这不是深层基础设施披露，但它很好地证明公司运行的是分层运营模型：税务数据摄取和承保、产品决策、移动 / 产品控制界面、支付聚合，以及 CRM 驱动的客户运营。
