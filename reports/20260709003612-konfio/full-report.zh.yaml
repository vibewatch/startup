              - CM041
          - type: callout
            title: 市场有吸引力，恰恰因为它难
            body: 高利率、低信任、现金依赖和税务正规化恐惧不是暂时性缺陷；它们正是缺口存在的结构性原因。任何预测若假设客户能无摩擦地从现金或供应商信用迁移到数字中小企业金融，都会高估增长和利润率韧性。
