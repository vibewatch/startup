      - number: '5.4'
        title: 信任控制、合规与依赖
        blocks:
          - type: paragraph
            body: >-
              信任与合规可见，但主要通过面向消费者的披露呈现，而不是现代安全门户。多个官方页面反复说明，Red Amigo DAL 作为 SOFOM E.N.R. 运营，受 CNBV
              有限监管；一般条款则描述了一个横跨应用、网站和平台的生态，并在其上叠加产品特定条款。定价和 CAT 页面增加了监管披露肌肉：它发布信贷和卡的年化平均利率和 CAT
              参考，并警示付款违约、浮动利率敞口和最低还款风险。支付栈有自己的法律边界，因为 Cobra Online 被披露为 Konfío Pagos 背后的持牌聚合商。催收文件也很明确：Konfío
              公布其聘用的催收机构，限制还款只能直接结算给 Konfío，并说明催收窗口为 8:00 至
              21:00。应用商店文本还补充了实际控制功能，例如卡开关、应用内支持，以及隐私通知引用。缺失项和已披露项同样值得注意。已审阅来源集中没有找到公开 SOC 2、ISO 27001、PCI 证明页面、可用性 /
              状态页面、渗透测试摘要或模型风险治理备忘录。对于一家越来越想像金融操作系统一样运转的公司，这个披露缺口是真实尽调问题。
