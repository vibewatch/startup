      - number: '8.3'
        title: 可比公司、公开市场背景与敏感性
        blocks:
          - type: paragraph
            body: >-
              最好的公开估值约束来自可比公司，但 Konfío 不是单一类别业务，可比组天然很宽。Nu 和 SoFi 重要，因为 Konfío 想与中小企业建立更广的数字银行关系。StoneCo 和 PagSeguro
              重要，因为 Konfío 已经接触商户支付和企业金融工作流。Upstart 重要，因为 Konfío 的承保叙事在信贷决策中依赖替代数据和机器学习速度。2026 年 7 月，这些上市公司的市值 /
              收入倍数差异很大：Nu 约 6.08x，SoFi 5.77x，Upstart 2.74x，StoneCo 1.02x，PagSeguro 0.66x。若估值为 $1.3 billion，Konfío 需要约
              $214 million 收入才像 Nu，约 $225 million 才像 SoFi，约 $474 million 才像 Upstart，约 $1.27 billion 才像 StoneCo，或接近 $1.97
              billion 才像 PagSeguro，才能在同一简单倍数上成立。这个跨度不能证明价值，只能证明答案对商业模式解释和未披露经济性有多敏感。
