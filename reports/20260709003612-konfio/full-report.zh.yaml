      - number: '2.4'
        title: 增长驱动、采用约束与估值影响
        blocks:
          - type: paragraph
            body: >-
              市场有真实驱动，但每个驱动都伴随一个约束。数字支付基础设施正在改善，2024 年移动银行采用率达到 69%，与 Banxico 相连的基础设施在 2025 年处理超过 6 billion 笔交易。Plan
              México 以及政府与银行扩大中小企业融资的协议，也为正规信贷增长带来政治动能。2026 年 Finnovista 解读称生态正在成熟：77% 的金融科技公司已经使用 AI，80% 与银行合作，基础设施导向的
              B2B 模式正在抬头。这些都利好 Konfío，因为公司已经站在贷款、支付和中小企业运营软件的交叉点。但约束同样重要。OECD 仍显示，微中小企业平均贷款利率为 15.59%，相对大型企业有 4.88
              个百分点的利率溢价；未获融资的微中小企业中，27% 把成本列为主要障碍。Mexico Business News 还称，80%
              的交易仍为现金，欺诈、网络攻击和信任是核心障碍。因此正确的估值结论不是“市场巨大”，而是“如果资金成本、信任和监管时间表改善速度快于获客摩擦和信贷损失，市场足够大，可以支撑 Konfío”。
