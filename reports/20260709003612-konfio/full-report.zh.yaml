        title: 乐观、基准与悲观估值情景
        blocks:
          - type: paragraph
            body: >-
              情景分析比单点估值更站得住。悲观情景约 $500 million 至 $900 million，假设银行牌照明显后延，信用或行为问题升温，投资人开始把 Konfío
              估得更像一家对风险敏感的贷款机构或商户金融平台，而不是高溢价数字银行。基准情景约 $900 million 至 $1.4 billion，假设当前多产品战略真实，2021
              年估值标记在方向上仍可辩护；但收入、损失和股权结构条款的公开不透明，使公司仅凭公开证据还拿不到有意义的加价。乐观情景约 $1.5 billion 至 $2.0
              billion，需要几件事同时跑通：银行牌照获批，证明存款和资金管理能加深平台，盈利延续，信用质量稳定，且融资结构没有惩罚性条款。换句话说，上行空间存在，但高度依赖催化剂和披露。
