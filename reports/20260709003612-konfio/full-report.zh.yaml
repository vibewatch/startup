            body: >-
              经营信号有一些积极但不完整。VEF 和其他 2021 年来源称，Konfío 的贷款账本在 2020 年增长 20%，而传统银行信贷收缩。管理层在 2026 年告诉 El Cronista，Konfío
              过去两年已经跨过盈利门槛，其风险模型支撑了比行业平均更健康的组合，并且公司按中小企业贷款账本规模与银行相比排名第八。但这些都不是经审计报表。公开资料未识别到收入、净利润、核销、逾期、资金成本、CAC、回本期或生命周期价值数据。这意味着公开记录可以支撑一个定性的单位经济桥——获客、承保、融资、服务和损失吸收——但不能支撑可靠的数字模型。尽调含义很简单：公开说法表明
              Konfío 可能比许多后期金融科技公司运营更强，但它们不能替代完整的私有队列和资产质量分析。
