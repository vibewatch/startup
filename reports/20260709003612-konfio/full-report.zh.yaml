      - number: '1.4'
        title: 里程碑、银行牌照路径与负面背景
        blocks:
          - type: paragraph
            body: >-
              Konfío
              公开记录中的战略主线很清楚：先向服务不足的中小企业快速发放信贷，再叠加支付和运营工具，随后申请完整银行牌照，让这些客户也能在同一生态里持有存款并管理资金。更不清楚的是申请的确切时间。Expansion
              称银行牌照申请可追溯到 2023 年 9 月，而 El Economista 把提交时间放在 2024 年；两种说法在起始日期上冲突，但仍共同指向一个更高层结论：截至 2026 年 3
              月，申请仍在等待。管理层公开表态有信心，称公司已进入最后阶段、正在等待监管机构，但截至 runDate，已审阅来源集中尚未记录到批准。也有真实的下行信号。官方 Buró
              页面强调，用户应比较投诉、处罚和合同问题；债务建议报道称，逾期中小企业借款人可能面临征信上报、密集催收跟进，并在取决于文件的情况下遭遇司法追偿。这些都不能推翻业务基本面，但提醒投资人：Konfío
              仍是监管信贷生态内的杠杆型贷款机构，催收行为、承保质量和牌照时间表都可能快速改变股权故事。
