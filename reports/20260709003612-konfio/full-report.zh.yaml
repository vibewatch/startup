  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张 / 风险
      - 威胁
      - 严重性
      - 为何重要
      - 缓释措施 / 尽调问题
    rows:
      - - 首贷切入点
        - 一旦数据可见，银行或类银行平台就能瞄准同一批正规化中的中小企业
        - 高
        - 如果首次借款人被银行主导渠道截获，Konfío 会失去最清晰的切入点
        - 索取按首贷与复贷客群拆分的漏斗，以及第二个产品后的留存
      - - 多产品附着
        - Clara、Kapital 和 Clip 分别掌握不同工作流入口
        - 高
        - 第一个站稳的工作流往往决定未来交叉销售权
        - 索取按首个产品拆分的客群数据：信贷、卡、支付或软件
      - - 非银行运营模式
        - Covalto 和在位银行今天就能打包受保险保护的存款和资金管理
        - 高
        - 存款和资金管理深度提高切换成本和日常互动
        - 跟踪 Konfío 银行牌照进程的时间和范围，以及过渡期合作策略
      - - 以信贷为中心的定位
        - 以支付切入的替代者能在信贷需求出现前获取商户
        - 中高
        - 交易所有权之后可能转化为授信和交叉销售优势
        - 衡量贷款发起量已有多少来自支付或软件触点
      - - 财务管控叙事
        - Clara 面向财务团队的支出治理主张更清晰
        - 中
        - 在 CFO / 管控需求占主导的较大中小企业中可能重要
        - 在产品尽调中，将审批、政策、ERP 和采购深度与 Clara 对比
      - - 在位银行反击
        - BBVA 及同业可以在保住信任优势的同时，简化中小企业数字旅程
        - 中
        - 如果在位银行 UX 改善快于预期，金融科技差异化会收窄
        - 按季度跟踪 BBVA Spark、数字开户和中小企业产品打包变化
    notes: 关键竞争问题不是 Konfío 是否有对手，而是哪些相邻平台能在 Konfío 扩展到完整企业银行之前，先拿下客户关系。
