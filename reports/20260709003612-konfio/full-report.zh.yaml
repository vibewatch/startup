      - number: '8.2'
        title: 融资背景与当前价格锚
        blocks:
          - type: paragraph
            body: >-
              公开估值历史是不对称的。2021 年 Reuters / Yahoo Finance 文章给出一个干净的一手事件：Konfío 称，在完成 $235 million 融资后，公司估值为 $1.3
              billion。此后，披露出的最强财务信号不是新的股权轮，而是 Goldman Sachs、JPMorganChase 和 Afore Sura México 在 2024 年 12
              月扩大债务额度。它提升了增长能力，但债务不是股权，也回答不了 2026 年普通股股东会是在 2021 年标记之上、之下，还是大致同一水平投资。管理层 2026
              年访谈又增加了模糊性。他们描述的是一家按收入口径至少已经盈利、服务许多首次获得企业信贷客户、并希望银行牌照落地后加入存款和资金管理产品的公司。这些信号有分量，但仍不是公开收入桥、准备金文件或新的投后估值。实际含义是，投资人应把
              $1.3 billion 视为历史锚，而不是当前公允价值。
