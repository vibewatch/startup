            body: >-
              Konfío 最强的公开论点不是它没有竞争者，而是它占据了一个有用的中间位置。它比 Clara 或 Clip
              更信贷原生，比窄口贷款机构更捆绑，并且仍面向可能首次获得正式企业信贷的银行服务不足中小企业。公开声明称，超过 80%
              的客户正在获得自己的第一笔企业信贷，这强化了这一切口。但同一组证据也显示了缺口。没有受保存款账户或资金管理产品，Konfío 还无法在主要银行关系深度上中和 Covalto 或
              BBVA。没有一流的支出管理叙事，它可能把部分财务负责人流程输给 Clara。没有更强的商户收单前门，它可能把支付发起需求让给 Clip 或类似平台。因此，竞争耐久性较少取决于泛品牌认知，更取决于 Konfío
              能否在相邻平台或银行吸收关系之前，持续把首次信贷客户转化为多产品运营金融用户。
