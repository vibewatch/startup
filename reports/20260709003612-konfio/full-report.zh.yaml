  - id: TV005
    title: 投资论点失效与否决触发因素表
    columns:
      - 触发因素
      - 重要性
      - 预警信号
      - 投资人动作
    rows:
      - - 银行牌照延误或被拒
        - 平台银行化上行被推迟或削弱
        - 管理层 2026 年声称进入最终阶段后，仍无批准或可信时间表
        - 重置为仅贷款 / 支付的估值框架
      - - 信贷质量恶化
        - 信用资料薄、首次获贷借款人可能很快重定价整个故事
        - 逾期上升、回收走弱或拨备承压
        - 下调估值区间，并先重新承销下行
      - - 资金依赖恶化
        - 债务额度仍是增长和流动性的关键
        - 续作困难或契约收紧
        - 把债务支持视为风险放大器，而不是验证
      - - 行为合规 / 服务问题升级
        - 催收或支付同步失败会损害信任和监管观感
        - 投诉或服务事件形成模式
        - 提高风险折扣，放慢投资节奏
      - - 透明度仍无改善
        - 不透明持续存在时，投资人无法支付溢价倍数
        - 没有经审计当前经济性，也没有清晰股权结构
        - 建议维持在跟踪或继续研究
    notes: 这些触发因素刻意设得具体，让建议随证据变化，而不是随情绪变化。
    claimRefs:
      - CV003
      - CV006
      - CV014
      - CV015
      - CV038
      - CV039
      - CV040
      - CV044
      - CV045
      - CV047
      - CV050
  - id: TV006
    title: 最终尽调清单
    columns:
      - 尽调问题
      - 重要性
      - 理想答案应显示什么
    rows:
      - - 当前收入和产品结构
        - 需要用它把公开可比倍数转成真实估值区间
        - 在质量调整倍数下，收入基数足以支撑或超过 $1.3B
      - - 信贷和卡损失表现
        - 决定 Konfío 应拿平台溢价，还是贷款机构折价
        - 批次稳定、逾期可控、拨备可信
      - - 股权结构和优先权堆栈
        - 决定名义估值是否惠及普通股投资人
        - 结构更干净，悬而未决负担或惩罚性优先权有限
      - - 融资额度和契约细节
        - 只有再融资风险受控，债务支持才有帮助
        - 额度余量充足、到期安排有序，且没有隐藏压力条款
      - - 银行牌照落地计划
        - 上行不只取决于获批，还取决于执行
        - 在控制不失灵的前提下，走向存款、资金管理和更深钱包份额的可信路径
    notes: Konfío 不需要完美披露才值得关注，但若要支撑激进价格，它必须显著提高披露质量。
    claimRefs:
      - CV008
      - CV009
      - CV014
