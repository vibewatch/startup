        - 展期至 2027 年 5 月
        - 支持 SME 贷款扩张
        - 债务资金提供方更多元
        - 要求提供清偿顺位、抵押品和续期条件
      - - Afore Sura 参与
        - 在 MXN7.422B 总融资包中的份额未披露
        - 参与 2024 年融资包
        - 机构债务资本
        - 增强本土融资可信度
        - 要求提供金额、结构和追索条款
      - - 银行牌照路径
        - 无公开现金金额；战略性资金选项
        - 2024-2026 待批
        - 新增存款和财资资金来源
