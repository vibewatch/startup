              监管审计中的状态。这是重要尽调点：墨西哥金融科技和非银贷款领域在其他公司身上出现过治理爆雷；Konfío 公开材料没有披露当前董事会名单，但 IDB
              记录支持这样一个判断——管理层确实投入了大量时间，把委员会、控制和贷方报告专业化。
