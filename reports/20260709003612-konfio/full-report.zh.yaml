      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              这个市场的买方地图比消费者金融科技更偏运营。在微型和小型企业里，业主兼经理通常同时是买方、用户和付款方。在更成熟的中小企业里，财务经理、会计或运营负责人会成为日常用户，而业主或 CFO
              仍掌握预算和信贷决策。这一点重要，因为采用往往从最容易感知的流程痛点开始，而不是从纯融资产品开始。商户可能先从收款受理入手，再用数字交易历史获得信贷资格，随后升级到卡或资金管理工具。因此，企业财务管理供应商和支付聚合商会争夺同一个关系入口。Konfío
              自身定位——信贷加卡、支付和管理工具——符合这条路径。摩擦在于，数字行为和信任并不均匀。Mexico Business News 称，只有 17%
              的中小企业交易通过电子银行转账完成，现金仍主导经济的大部分。因此，市场奖励能压缩上线时间和文件负担的产品，也惩罚那些要求高正规化、多重集成或类似网点开户流程的产品。
