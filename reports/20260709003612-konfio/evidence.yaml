evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-disclosure-TO002
    missingEvidence: A current public board roster, independent-director names, and committee membership list for Konfío.
    whyItMatters: >-
      The IDB case study confirms governance upgrades, but investors still cannot independently verify who currently
      governs the company or how much founder control remains.
    diligencePath: Request the current board deck, shareholders agreement summary, and committee charter pack from management.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: bank-license-timing
    missingEvidence: >-
      A dated CNBV filing acknowledgment or management chronology that reconciles whether the bank-license application
      began in September 2023 or in 2024.
    whyItMatters: >-
      The discrepancy is small but matters because it affects how long the process has been pending and how management
      describes regulatory progress.
    diligencePath: Request the CNBV submission receipt, first regulator comment letter, and updated licensing workplan.
    relatedQuestionRefs:
      - QO020
  - type: private-evidence-only
    severity: material
    topic: headcount-and-cap-table-TO003
    missingEvidence: >-
      An audited employee count and a current cap table showing common, preferred, option pool, and debt-linked dilution
      rights.
    whyItMatters: >-
      Late-stage valuation and governance underwriting depend on ownership and operating-scale metrics that are not
      fully public.
    diligencePath: Request the latest cap-table export, option schedule, and year-end HR census from the data room.
    relatedQuestionRefs:
      - QO024
      - QO025
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: audited-profitability
    missingEvidence: >-
      Audited 2024 and 2025 standalone financial statements showing revenue, net income, loan-loss provisions, and
      funding costs.
    whyItMatters: >-
      Management says Konfío is profitable, but investors still need audited economics to judge durability, margin
      quality, and funding sensitivity.
    diligencePath: Request audited financial statements plus monthly portfolio and charge-off reporting for 2024-2026.
    relatedQuestionRefs:
      - QO016
      - QO025
  - type: conflicting-data
    severity: material
    topic: fintech-count-methodology
    missingEvidence: >-
      A single authoritative 2026 census that reconciles local fintechs, foreign operators, licensed institutions, and
      total initiatives into one denominator.
    whyItMatters: >-
      Public sources cite 795 local fintechs, roughly 1,000 total initiatives, and 1,104+ start-ups depending on
      methodology. Valuation work should not imply these counts are directly interchangeable.
    diligencePath: >-
      Request the underlying Finnovista methodology table and compare it against FinTech México membership plus CNBV
      authorization lists.
    relatedQuestionRefs:
      - QM017
      - QM018
  - type: missing-source
    severity: material
    topic: konfio-sam-by-revenue-band
    missingEvidence: >-
      A public segmentation of Mexican SMEs by revenue band, digital-payment usage, and credit propensity that isolates
      Konfío’s realistic target cohort.
    whyItMatters: >-
      The enterprise count and financing-access metrics prove demand, but they do not cleanly isolate the subset that
      matches Konfío’s underwriting and funding model.
    diligencePath: >-
      Request management funnel data by sector, revenue band, and approval status; pair it with INEGI and SAT
      segmentation.
    relatedQuestionRefs:
      - QM023
      - QM025
  - type: private-evidence-only
    severity: material
    topic: buyer-journey-conversion
    missingEvidence: >-
      Conversion data showing what share of Konfío customers start with payments, credit, or cards and how many adopt a
      second product within 12 months.
    whyItMatters: >-
      The market thesis assumes multi-product adoption lowers CAC and raises lifetime value, but the public record does
      not quantify that funnel.
    diligencePath: Request cohort conversion tables by entry product, repeat draw, card activation, and treasury adoption pipeline.
    relatedQuestionRefs:
      - QM012
      - QM024
  - type: stale
    severity: minor
    topic: open-finance-rule-completion
    missingEvidence: >-
      A post-Q2 2026 regulatory update confirming whether pending open-finance and interchange reforms were enacted or
      delayed.
    whyItMatters: Several market-structure arguments depend on reforms still described as pending in public legal commentary.
    diligencePath: Refresh Chambers, CNBV, Banxico, and SHCP materials immediately before any investment committee memo.
    relatedQuestionRefs:
      - QM022
  - type: missing-source
    severity: material
    topic: apples-to-apples-pricing
    missingEvidence: Consistent public pricing cards for Konfío, Clara, Kapital, Covalto, and BBVA on the same SME use cases.
    whyItMatters: >-
      Public materials are much richer on product packaging than on directly comparable pricing, making displacement
      risk easy to misjudge.
    diligencePath: >-
      Request price books, fee schedules, APR examples, card economics, and negotiated-discount ranges for matched SME
      profiles.
    relatedQuestionRefs:
      - QP013
      - QP014
      - QP025
  - type: private-evidence-only
    severity: material
    topic: cross-sell-retention
    missingEvidence: >-
      Cohort data showing how many Konfío customers adopt a second product and remain active after their first credit
      cycle.
    whyItMatters: >-
      The strongest differentiation thesis is multi-product attachment after first credit, but the public record does
      not quantify it.
    diligencePath: >-
      Request cohort waterfalls by entry product, repeat draw, card activation, payments attachment, and 12-month
      retention.
    relatedQuestionRefs:
      - QP021
      - QP025
  - type: missing-source
    severity: material
    topic: merchant-originated-credit-competition
    missingEvidence: >-
      Public evidence on how much SME credit demand in Mexico is already being captured from payments-led funnels versus
      direct lending funnels.
    whyItMatters: >-
      Clip-like platforms may become stronger substitutes than they look if transaction ownership converts into
      underwriting advantage.
    diligencePath: Request management estimates and third-party merchant-finance data on payment-led origination channels.
    relatedQuestionRefs:
      - QP012
      - QP017
      - QP025
  - type: stale
    severity: minor
    topic: regulatory-change-timing
    missingEvidence: A post-Q2 2026 update confirming whether open-finance and licensing reforms accelerated or stalled.
    whyItMatters: Several competitive boundaries depend on whether non-bank and bank-like models converge faster under regulation.
    diligencePath: Refresh CNBV, Banxico, SHCP, and Chambers materials before any IC memo.
    relatedQuestionRefs:
      - QP015
      - QP016
  - type: private-evidence-only
    severity: material
    topic: audited-financial-statements
    missingEvidence: Audited income statement, balance sheet, cash-flow statement, and product-level revenue mix.
    whyItMatters: >-
      Without audited statements, public profitability and growth claims cannot be translated into sustainable ROE or
      downside protection.
    diligencePath: Request two to three years of audited financials plus current interim management accounts.
    relatedQuestionRefs:
      - QI012
      - QI013
      - QI023
  - type: missing-source
    severity: material
    topic: credit-cohort-performance
    missingEvidence: >-
      Delinquency, roll-rate, loss, recovery, and restructuring curves by cohort, sector, and first-vs-repeat borrower
      status.
    whyItMatters: Konfío is a credit-led platform; portfolio quality is the core value driver and the core downside risk.
    diligencePath: Request monthly vintage tables and warehouse / lender reporting packs.
    relatedQuestionRefs:
      - QI014
      - QI017
      - QI023
