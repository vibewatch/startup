    title: Named customer-proof table
    enumerationScope:
      coverage: sample
      basis: This table samples every named industry-specific testimonial page located in Konfío's public sitemap at runDate.
    columns:
      - Customer / segment
      - Evidence type
      - Public quote / outcome
      - What it proves
      - Caveat
    rows:
      - - Earth & Company / manufacturing
        - Official testimonial page
        - Konfío gave the financing push needed to start large projects
        - Manufacturing buyers use Konfío for production-expansion financing
        - Company-curated testimony with no independent KPI
      - - ICCISA / construction
        - Official testimonial page
        - Konfío provided the financing push needed to start important projects
        - Construction workflows fit the same fast-working-capital wedge
        - Testimonial is almost identical to the manufacturing quote
      - - Rayito de Luna / retail
        - Official testimonial page
        - Loan confirmation in 24 hours helped cover a first large order
        - Retail inventory timing is a clear use case for fast underwriting
        - Single anecdote, not a cohort statistic
      - - MERQ / wholesale
        - Official testimonial page
        - Same-day funding kept the company operating
        - Working-capital urgency and supply continuity matter for wholesalers
        - Outcome is powerful but unaudited
      - - Digipro / professional services
        - Official testimonial page
        - Konfío offers transparent solutions and delivers what it promises
        - Transparency can be a service differentiator for service firms
        - Satisfaction proof is qualitative only
    notes: The official industry pages are highly valuable as customer-proof sources because they name businesses and operating contexts, but they remain curated references.
    claimRefs:
      - CU018
      - CU019
      - CU020
      - CU021
      - CU022
      - CU023
      - CU024
      - CU025
      - CU026
      - CU027
      - CU038
  - id: TU003
    title: Customer journey and friction table
    columns:
      - Journey stage
      - Positive evidence
      - Negative / open issue
      - Why it matters
    rows:
      - - Discover / apply
        - Credit and industry pages emphasize rapid, low-collateral access
        - No public funnel-conversion data
        - Investors cannot tell whether marketing copy translates into efficient customer acquisition
      - - Receive and use funds
        - Testimonials emphasize fast approval or same-day disbursement for urgent business needs
        - No public average time-to-cash distribution or exception-rate data
        - Timing is core to Konfío's value proposition
      - - Manage relationship in app
        - Google Play says the app covers credit, card, payments, analytics, balances, statements, and card controls
        - One-star May 2026 review says the app and website are hard to use and slow to reflect payment status
        - The all-in-one app is a retention lever, but reliability failures cut directly against trust
      - - Resolve issues / service
        - Salesforce says Konfío centralized data and improved response times and personalized follow-up
        - No public SLA, CSAT, or complaint-resolution metric exists
        - Customer-service quality often determines repeat product usage in SME finance
      - - Collections / delinquency edge case
        - Legal pages publish official collection channels and rules
        - The adverse app review alleges very frequent calls after one day late
        - Collections tone can materially affect reputation and repeat usage
    notes: This table mixes curated company evidence and one adverse public review to show both the promise and the fragility of the customer journey.
    claimRefs:
      - CU020
      - CU028
      - CU029
      - CU030
      - CU031
      - CU032
      - CU033
      - CU034
      - CU038
  - id: TU004
    title: Adoption and transparency scorecard
    columns:
      - Signal
      - Public status
      - Strength
      - Missing companion metric
    rows:
      - - Businesses supported historically
        - More than 90,000 supported, per company
        - Strong scale claim
        - No audited active-customer bridge
      - - Businesses using platform in 2026
        - More than 98,000, per company
        - Strong current-scale claim
        - No active-vs-registered definition
      - - Financing delivered
        - More than MXN40 billion, per company
        - Strong historical usage signal
        - No breakdown by product, cohort, or vintage
      - - Card leadership
        - Most-issued business card in Mexico in 2023, per company
        - Potentially strong card adoption signal
        - No source methodology or issuer comparison table
      - - App engagement
        - 100k+ downloads, 4.7 rating, 9,915 reviews
        - Good surface-level digital adoption signal
        - No MAU, retention, or product-attach data
      - - Future reach
        - 10,000 additional SMEs targeted over 24 months from debt expansion
        - Useful forward demand signal
        - Target is not the same as actual customer conversion
    notes: Konfío discloses enough to prove meaningful usage, but not enough to fully evaluate customer quality or durability.
    claimRefs:
      - CU013
      - CU014
      - CU015
      - CU016
      - CU017
      - CU030
      - CU031
  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Risk / question
      - Current signal
      - Why it matters
      - What is still missing
    rows:
      - - Cross-sell breadth inside existing base
        - App, card, credit, and payments all point to multi-product usage
        - Expansion economics depend on customers taking more than one product
        - No public attach-rate data by cohort
      - - Segment concentration
        - Official pages show five sectors, implying some breadth
        - Sector concentration can change loss and retention behavior materially
        - No customer mix or revenue concentration by industry
      - - Collections experience
        - Legal disclosures exist, but an adverse app review flags heavy calling behavior
        - Collections friction can damage brand and referrals
        - No complaint-rate or cure-rate disclosure by delinquency stage
      - - Merchant adoption depth
        - Payments and terminal pages show merchant ambition and multiple form factors
        - Acceptance products can improve durability if merchants stay active
        - No active-terminal, TPV, or merchant-retention metrics
      - - Future wallet expansion
        - Management wants to add deposits and treasury through a bank license
        - Existing customers could deepen if expansion succeeds
        - No public timeline or conversion estimate from current customer base
    notes: The primary customer risk is not the absence of demand signals but the absence of concentration, retention, and cross-sell depth metrics.
    claimRefs:
      - CU007
      - CU032
      - CU036
      - CU039
      - CU042
      - CU047
      - CU048
      - CU049
      - CU052
