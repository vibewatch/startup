callouts:
  - calloutType: strength
    title: Konfío shows real horizontal SME relevance
    body: >-
      The mix of manufacturing, construction, retail, wholesale, and professional-services pages matters because it shows Konfío solving
      a common cash-cycle problem across multiple sectors rather than relying on one niche borrower class.
    claimRefs:
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
  - calloutType: insight
    title: The customer story is increasingly about workflow consolidation
    body: >-
      Credit still opens the relationship, but the app, card, payments, and service stack suggest Konfío wants customers to stay for
      ongoing operating-finance tasks, not just for a single disbursement.
    claimRefs:
      - CU002
      - CU003
      - CU028
      - CU029
      - CU037
  - calloutType: risk
    title: Customer demand looks real, but customer-quality transparency is thin
    body: >-
      Public scale claims and testimonials are meaningful, yet investors still do not have cohort retention, attach-rate, churn, or
      complaint-quality metrics. The negative app review also shows that service and collections friction can quickly damage trust.
    claimRefs:
