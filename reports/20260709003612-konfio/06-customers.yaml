company:
  name: Konfío
chapter:
  number: 6
  title: Customers
  summary: >-
    Konfío's public customer file is strongest on ICP clarity and curated proof of use. The company clearly targets formalized Mexican SMEs
    that need faster working capital, spend control, and payment acceptance, with public thresholds around operating history and monthly
    revenue. Official evidence also shows broad horizontal reach: manufacturing, construction, retail, wholesale, and professional
    services all have named customer testimonials tied to concrete financing or liquidity moments. Scale claims are meaningful—more than
    98,000 businesses using the platform, more than 90,000 supported historically, and over MXN40 billion financed—but they remain
    company-reported. Customer-experience transparency is weaker. Google Play suggests healthy app engagement and ratings, yet it also
    contains adverse complaints about app reliability and aggressive collections follow-up. The chapter takeaway is that Konfío has real
    SME penetration and credible cross-product relevance, but outside investors still lack retention, cohort, attach-rate, and complaint-
    quality data needed to underwrite customer durability.
sections:
  - id: target-customer-profile-and-segmentation
    title: Target customer profile and segmentation
    body: >-
      Konfío's target customer is not the full Mexican SME universe; it is the subset of formalizing or already formalized small and
      medium businesses that can provide enough operating evidence for fast digital underwriting and can benefit from working-capital,
      spend, and acceptance tools in one relationship. Public eligibility thresholds make that clear. Credit applicants are asked for at
      least three months of operations and roughly MXN50,000 in monthly income, while the card product expects at least six months of
      operations and the same monthly-income floor. The industry pages widen the picture by showing horizontal reach across manufacturing,
      construction, retail, wholesale, and professional services. Those segment pages repeat sector-specific use cases—continuous
      production, project financing, inventory timing, competitive wholesale pricing, and last-minute service execution—which suggests
      Konfío organizes go-to-market around cash-cycle stress rather than around one narrow vertical. That ICP design fits a lender that
      wants repeat product usage: the same owner-manager can borrow, manage employee spending, pay suppliers, and accept customer payments
      without leaving the Konfío ecosystem.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
    tableRefs:
      - TU001
    figureRefs: []
  - id: customer-proof-and-adoption-signals
    title: Customer proof and adoption signals
    body: >-
      Konfío's best customer proof comes from a mix of public scale claims and named testimonial pages. The about page says the platform
      now has national coverage, has supported more than 90,000 companies, has financed more than MXN40 billion for businesses, and has
      more than 98,000 companies using the platform in 2026. The December 2024 debt-expansion note adds forward demand evidence by saying
      the new facility should help Konfío reach more than 10,000 additional SMEs over the next 24 months. The five industry pages add
      useful specificity. Earth & Company in manufacturing frames Konfío as the financing push needed to launch bigger projects; ICCISA in
      construction uses nearly identical language about jump-starting major jobs; Rayito de Luna in retail says Konfío confirmed a loan in
      24 hours so the business could fill its first large order; MERQ in wholesale credits same-day funding with keeping operations alive;
      and Digipro in professional services emphasizes transparency and delivery consistency. These are curated company-owned references, so
      they should not be read as statistical proof, but they do support a real customer base across multiple SME workflows.
    claimRefs:
      - CU013
      - CU014
      - CU015
      - CU016
      - CU017
      - CU018
      - CU019
      - CU020
      - CU021
      - CU022
      - CU023
      - CU024
      - CU025
      - CU026
      - CU027
