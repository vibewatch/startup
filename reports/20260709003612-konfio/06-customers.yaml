      - FU004
  - id: customer-experience-cross-sell-and-service
    title: Customer experience, cross-sell, and service
    body: >-
      The available customer-experience evidence implies that Konfío is trying to create stickier relationships than a one-time loan.
      Google Play describes one app surface for credit, card, payments, and business analytics, which is important because it allows users
      to check balances, payments, statements, card movements, available amounts, deposits, and business-performance reports in one place.
      Salesforce's case study reinforces that service ambition: Konfío centralized customer information, automated sales and support,
      shortened response times, and used the platform for personalized follow-up during the pandemic. That matters for customer durability,
      because response speed and workflow continuity are often what separate a reusable SME-finance platform from a commodity lender.
      Still, the public record stops short of showing cohort retention or cross-sell math. There is no disclosed repeat-borrower rate, no
      card-attach rate among credit customers, no payments attach rate, and no CAC-payback or net-revenue retention style metric for the
      installed base.
    claimRefs:
      - CU028
      - CU029
      - CU030
      - CU031
      - CU032
      - CU033
      - CU034
      - CU035
      - CU036
      - CU037
    tableRefs:
      - TU003
    figureRefs: [FU001]
  - id: customer-friction-and-diligence-gaps
    title: Customer friction and diligence gaps
    body: >-
      The customer file also contains genuine friction. Google Play shows strong aggregate ratings, but the visible review set includes a
      May 30, 2026 one-star complaint saying the app and website are difficult to use and that after a single day of lateness the company
      called roughly 30 times, while the payment system had not yet reflected repayment. Even if that is only one review, it is valuable
      because it points to the precise operational failure modes that matter for SME trust: app reliability, payment-state synchronization,
      and collections behavior. More broadly, nearly all detailed customer proof is curated by Konfío itself. Investors still do not have
      public segment mix, repeat-product penetration, complaints per thousand customers, NPS or CSAT by product, or churn by cohort.
      Customer demand looks real, but customer-quality transparency remains modest.
    claimRefs:
      - CU024
      - CU031
      - CU032
      - CU038
      - CU039
      - CU040
      - CU041
      - CU042
    tableRefs:
      - TU005
    figureRefs:
      - FU003
tables:
  - id: TU001
    title: Customer segment / ICP matrix
    columns:
      - Segment
      - Public need state
      - Qualification / signal
      - Konfío wedge
      - Limits of public proof
    rows:
      - - Formalizing SMB needing first external credit
        - Fast working capital without mortgage collateral
        - Credit page asks for at least 3 months of operations and ~MXN50k monthly income
        - Speed, unsecured credit, SAT-linked underwriting
        - No approval-rate or denial-rate disclosure by customer type
      - - Small business needing spend control and supplier payments
        - Separate business spending from owner cash flow
        - Card page requires at least 6 months of operation and ~MXN50k monthly income
        - Business card, employee roles, transfer-like liquidity, ERP reporting
        - No public spend-per-account or activation-rate data
      - - Merchant accepting cards and remote payments
        - Capture card, wallet, and MSI demand without fixed rent
        - Merchant-facing payments pages emphasize no monthly rent and wallet acceptance
        - Payments terminals, remote links, role-based collections visibility
        - No public merchant-acquiring retention or chargeback metrics
      - - Inventory-heavy retail / wholesale SME
        - Need timing flexibility for large inventory orders
        - Retail and wholesale pages emphasize inventory financing and same-day liquidity
        - Fast credit plus card-based supplier payments
        - No disclosed inventory-sector cohort performance
      - - Project-based construction / professional-services SME
        - Need working capital to start jobs or execute last-minute projects
        - Construction and services pages emphasize rapid funding for projects and transparency
        - Fast credit, transparency, and spending flexibility
        - No public win-rate, repeat-use, or referral data by segment
    notes: Segment design is inferred from product requirements plus the company's industry landing pages; it is directionally useful but not a disclosed formal segmentation model.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
