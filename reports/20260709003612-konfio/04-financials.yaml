  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financial-statements
    missingEvidence: Audited income statement, balance sheet, cash-flow statement, and product-level revenue mix.
    whyItMatters: Without audited statements, public profitability and growth claims cannot be translated into sustainable ROE or downside protection.
    diligencePath: Request two to three years of audited financials plus current interim management accounts.
    relatedQuestionRefs:
    - QI012
    - QI013
    - QI023
  - type: missing-source
    severity: material
    topic: credit-cohort-performance
    missingEvidence: Delinquency, roll-rate, loss, recovery, and restructuring curves by cohort, sector, and first-vs-repeat borrower status.
    whyItMatters: Konfío is a credit-led platform; portfolio quality is the core value driver and the core downside risk.
    diligencePath: Request monthly vintage tables and warehouse / lender reporting packs.
    relatedQuestionRefs:
    - QI014
    - QI017
    - QI023
  - type: conflicting-data
    severity: minor
    topic: 2021-series-e-round-size
    missingEvidence: A definitive cap-table or primary company filing clarifying whether to describe the 2021 unicorn event as US$125 million overall or US$110 million second-tranche financing at the same valuation.
    whyItMatters: The discrepancy does not change the broad funding story but does affect chronology precision and valuation-history cleanliness.
    diligencePath: Request board materials or signed round-close documentation.
    relatedQuestionRefs:
    - QI008
    - QI009
  - type: missing-source
    severity: material
    topic: funding-cost-and-covenants
    missingEvidence: Pricing spreads, advance rates, eligibility tests, borrowing-base triggers, and covenant packages on major debt facilities.
    whyItMatters: The funding stack is public, but the economics of that funding are not. Without them, capital adequacy can be overstated.
    diligencePath: Request debt agreements and current compliance certificates from Goldman, JPMorgan, IDB, and any securitization trusts.
    relatedQuestionRefs:
    - QI006
    - QI010
    - QI017
