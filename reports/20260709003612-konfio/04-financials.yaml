callouts:
- calloutType: insight
  title: Konfío’s public funding story is unusually legible for a private fintech
  body: IDB project disclosures and named institutional debt lines make Konfío’s capital-sourcing model much more visible than its revenue or margin model. That is a positive sign on lender confidence, but it should not be mistaken for proof of durable profitability.
  claimRefs:
  - CI011
  - CI012
  - CI033
  - CI034
  - CI040
- calloutType: risk
  title: The hardest financial questions are still the most important ones
  body: No public source in the fetched set disclosed revenue, charge-offs, CAC, net interest margin, or unrestricted cash. Those missing metrics matter more for underwriting than the size of the latest credit line.
  claimRefs:
  - CI025
  - CI026
  - CI038
  - CI041
- calloutType: strength
  title: Becoming a bank would change economics, not just branding
  body: Public management comments repeatedly frame the bank-license effort as a path to deposits, treasury, and cheaper funding. If true, the upside is not merely broader product breadth, but a structurally better funding stack.
  claimRefs:
  - CI023
  - CI028
  - CI039
