company:
  name: Konfío
chapter:
  number: 4
  title: Financials
  summary: 'The public record suggests Konfío monetizes a blended SME-finance stack — working-capital credit, business cards, payment acceptance, and management tools — but discloses far more about funding capacity than about earnings quality. The clearest hard inputs are its institutional funding lines: a US$40 million IDB-backed 2019 facility, a MXN-denominated 2020 IDB warehousing line equivalent to US$54.3 million, a 2021 Series E widely reported at US$125 million but sometimes cited as US$110 million, and MXN7.422 billion of expanded strategic debt in late 2024 from Goldman Sachs, JPMorgan Chase, and Afore Sura Mexico. Management claims profitability for the last two years and a healthy portfolio, yet no public audited revenue, net interest margin, charge-off, CAC, or cash-balance disclosures were identified. The capital story is therefore stronger than the earnings-transparency story.'
sections:
- id: revenue-model-and-monetization-surface
  title: Revenue Model and Monetization Surface
  body: Konfío’s public product surfaces imply a blended revenue model rather than a single lending spread. The credit product monetizes working-capital financing; the business card adds a second financing surface; the payments product clearly monetizes merchant acceptance with a visible starting commission; and the broader management-tool messaging suggests a software or workflow-attachment strategy, even if the public record does not cleanly show whether those tools are paid directly or used primarily to improve acquisition, underwriting, or retention. This matters because a blended SME-finance platform can diversify revenue away from pure origination and interest income, but only if non-credit products convert into meaningful fee or retention economics. Public evidence supports the existence of multiple monetization surfaces, yet does not disclose their revenue mix, gross margins, or take rates beyond a small set of list-pricing cues. The correct underwriting posture is therefore to treat
    the revenue architecture as directionally diversified but quantitatively opaque.
  claimRefs:
