  rows:
  - - Working-capital credit
    - Interest / financing income on SME loans
    - Loan principal outstanding / disbursed
    - Clearly core, but no public revenue mix disclosed
    - Medium
    - Request yield by vintage, sector, and product
  - - Business-card financing
    - Financing and card-related fees on SME card product
    - Card limits, revolving usage, finance charges
    - Product clearly marketed; economics not publicly broken out
    - Medium
    - Request interchange, revolve rate, NPL, and activation data
  - - Payment acceptance
    - Merchant discount / per-transaction commission on terminals and remote acceptance
    - Transaction volume and MDR
    - Visible list cue from 1.35% + IVA on public page
    - High for existence, low for realized economics
    - Request TPV, take rate net of processor costs, and payout timing
  - - Business-management tools
    - Possible direct software monetization or indirect retention / acquisition value
    - Subscription, bundled feature, or none
    - Tools are clearly present; paid-vs-free model not publicly disclosed
    - Low
    - Request product-level pricing and attach rates
  - - Structured-credit / capital-markets recycling
    - Not end-customer revenue; improves ability to originate and refinance assets
    - Warehouse, securitization, debt spreads
    - Publicly evidenced as a scaling mechanism, not a revenue stream
    - High as capital-enabler
    - Request securitization economics, advance rates, and covenant package
  notes: The public record supports multiple monetization surfaces, but not a quantified revenue mix. Credit likely remains dominant, with payments and tools serving either direct fee income or better funnel economics.
