- id: funding-stack-capital-intensity-and-balance-sheet-scaling
  title: Funding Stack, Capital Intensity, and Balance-Sheet Scaling
  body: 'Konfío’s funding base is the most legible part of its public financial profile. IDB Invest disclosed a 2019 facility of up to US$40 million and a 2020 local-currency warehousing line equivalent to US$54.329 million intended to accumulate MSME loans for future securitization. That is a strong signal that Konfío’s scale model depends not only on equity, but on structured credit and capital-markets recycling. The 2021 Series E was widely reported at US$125 million, though some later recaps cite a US$110 million tranche associated with the unicorn milestone. More importantly for forward capacity, late-2024 disclosures show MXN7.422 billion of strategic debt lines from Goldman Sachs, JPMorgan Chase, and Afore Sura Mexico. Those lines explicitly support working-capital loans and business-card financing, and they extend maturities into 2027 and 2028. The business therefore appears capital intensive in the specific way a credit-led fintech should be: success depends on preserving funding
    access, warehousing capacity, and loss performance well enough to keep institutional lenders comfortable.'
