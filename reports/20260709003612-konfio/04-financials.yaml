- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Audited revenue and gross profit by product
    - Cannot estimate durability of diversification beyond lending
    - Request audited financial statements with product-level revenue bridge
  - - Funding cost and warehouse / credit-line pricing
    - Cannot model net interest margin or sensitivity to rates
    - Request debt agreements, spreads, and lender covenant schedules
  - - Delinquency, NPL, and net loss curves by cohort
    - Cannot price downside risk or expected credit loss accurately
    - Request monthly vintage tables by sector, ticket, and product
  - - CAC, payback, and attach-rate by first product
    - Cannot test whether payments/tools meaningfully improve platform economics
    - Request channel-level acquisition and second-product adoption cohorts
  - - Cash balance, burn, and unrestricted liquidity
    - Cannot evaluate solvency without lender rollovers
    - Request monthly cash waterfall, minimum liquidity covenants, and runway
  - - Regulatory-capital / bank-license pro forma
    - Cannot assess economics of transition from SOFOM to bank
    - Request pro-forma balance sheet and funding-cost assumptions post-license
  notes: These are the minimum financial asks required before a late-stage valuation view can be trusted. The absence of these metrics is the central financial diligence issue, not merely a formatting gap.
