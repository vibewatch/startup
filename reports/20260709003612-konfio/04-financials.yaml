- id: financial-disclosure-gaps-and-investment-committee-implications
  title: Financial Disclosure Gaps and Investment Committee Implications
  body: 'The most important conclusion is not that Konfío lacks financial substance, but that the public evidence is unevenly distributed. There is abundant disclosure on debt lines, product packaging, and strategic intent around becoming a bank. There is much less on realized pricing, revenue mix, funding cost, loss rates, and cash generation. That asymmetry can mislead investors into over-weighting capital raised as a proxy for financial quality. It is also why the bank-license process matters economically: cheaper funding, deposit gathering, and treasury relationships would change both revenue mix and capital efficiency. Until those data are disclosed or verified privately, the strongest public financial view is a constrained one: Konfío looks well-funded relative to many peers, plausibly profitable by management account, and clearly multi-product, but still under-disclosed on the exact variables needed to underwrite sustainable ROE and downside resilience. That is enough for a cautious directional view, not for a clean investment-grade forecast.'
