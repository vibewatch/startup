  - - Goldman Sachs line
    - MXN4.4B
    - Extended to Feb 2028
    - Support SME lending expansion
    - Long-dated institutional lender support
    - Request covenants, pricing spread, and borrowing-base triggers
  - - JPMorgan Chase line
    - MXN3.022B
    - Extended to May 2027
    - Support SME lending expansion
    - Diversified debt-provider base
    - Request ranking, collateral, and renewal conditions
