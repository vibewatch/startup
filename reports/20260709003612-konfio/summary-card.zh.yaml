  topStrengths:
    - 信贷、卡、支付、分析和客户服务轨道上都有真实的多产品工作流广度
    - 中小企业规模有分量：平台服务 98,000+ 家企业，融资额 40B+ MXN
    - Goldman Sachs、JPMorganChase 和 Afore Sura 的机构资金支持，提供增长容量和外部验证
    - 银行牌照路径若执行到位，可能靠存款和 treasury 服务加深钱包份额
    - 公开证据显示，Konfío 在多个中小企业行业仍有相关性，而不是只服务一个狭窄借款人 niche
  topRisks:
    - 银行牌照流程到 2026 年 3 月仍在等待中，因此部分上行情景仍有前置条件
    - 当前收入、准备金质量、违约和股权结构披露仍然很薄
    - 最后一笔干净股权标记仍是 2021 年独角兽轮，估值很容易买贵
    - 借款人基础包含大量首次使用企业信贷的用户，对信用质量漂移更敏感
    - 行为规范、催收、服务和安全透明度缺口，可能比产品广度抵消得更快地伤害信任
  unresolvedGaps:
    - 当前收入、产品组合、利差 / 费用经济性，以及经审计盈利能力细节
    - 按队列拆分的 vintage 损失、逾期、回收、准备金方法和压力表现
    - 当前股权结构表、优先股堆叠，以及 2021 年后任何融资条款
    - 债务融资契约、使用情况、再融资日程和流动性余量
    - 将银行牌照转化为存款和 treasury 采用、同时避免控制失灵的具体准备计划
