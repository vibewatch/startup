  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow pain
      - Konfío solution
      - Measurable public benefit
      - Limitation
    rows:
      - - Need first formal working-capital line
        - Traditional banks require longer history and collateral-heavy processes
        - Crédito Empresarial underwrites from SAT-linked business data and can fund quickly
        - Public page says funding can arrive in 48 hours and 8 of 10 users say it is their first credit
        - Public evidence does not disclose approval rate or long-run cost by risk band
      - - Pay suppliers, payroll, or rent from credit line
        - Working-capital users often need liquidity, not just card-present spend
        - Tarjeta Empresarial converts credit line into transfers and installment flexibility
        - Company page says the line can be used as cash-equivalent for suppliers, payroll, rent, or equipment
        - Realized transfer pricing and card-usage mix are not public
      - - Accept card and remote payments
        - Cash-only merchants lose wallet and MSI demand
        - Konfío Pagos adds terminals, wallets, links, MSI, and app-based monitoring
        - Public pages say Apple Pay, Google Pay, MSI, and live deposit monitoring are available
        - Processor costs, chargeback rates, and conversion uplift are undisclosed
      - - Track business performance and spending in one place
        - SMEs often work across separate loan, card, and collection tools
        - Konfío app consolidates credit, card, payment, and analytics information
        - Google Play description says users can monitor business performance through weekly, monthly, and annual reports
        - No public evidence shows how often customers actually use analytics or reports
      - - Resolve service issues and delinquency processes
        - Financing customers need fast answers and compliant collections handling
        - Dedicated help centers, in-app support, UNE channel, and published collection-agency disclosures
        - App description and legal pages show direct support paths and published collector lists
        - No public SLA, CSAT, or first-response-time disclosure was found
    notes: Use-case evidence comes from live product pages, the Google Play listing, and official legal/help disclosures; quantitative performance data remains sparse.
