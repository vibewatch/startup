callouts:
  - calloutType: strength
    title: Konfío already behaves like a product bundle, not a single loan originator
    body: >-
      The strongest product-tech takeaway is workflow breadth. Credit, card, payments, analytics, and help/compliance rails are all
      visibly present in the public surface, which makes the pending banking-license step an expansion of an existing ecosystem rather
      than a reinvention of the company.
    claimRefs:
      - CE001
      - CE007
      - CE014
      - CE026
      - CE036
  - calloutType: insight
    title: The underwriting edge is framed around fiscal-data speed, not around open developer infrastructure
    body: >-
      Konfío's public differentiation narrative is built on SAT-linked data, machine-learning speed, and business-context workflows.
      It is not built on public APIs, open documentation, or external developer ecosystems. That makes diligence more about decisioning
      quality and operational controls than about classical developer-platform depth.
    claimRefs:
      - CE006
      - CE035
      - CE039
      - CE040
  - calloutType: risk
    title: Trust disclosure still looks like a lender's legal file, not a bank-ready security portal
    body: >-
      The company publishes required terms, CAT disclosures, privacy notices, and collection-agency data, but the reviewed set did not
      surface public security certifications, uptime reporting, penetration-test summaries, or modern model-governance documentation.
      That is an important diligence gap for a fintech that wants to become a broader financial operating system.
    claimRefs:
      - CE021
      - CE041
      - CE042
      - CE043
      - CE047
      - CE048
      - CE049
      - CE050
