  - id: trust-controls-compliance-and-dependencies
    title: Trust controls, compliance, and dependencies
    body: >-
      Trust and compliance are visible, but mostly through consumer-facing disclosures rather than through a modern security portal.
      Multiple official pages repeat that Red Amigo DAL operates as a SOFOM E.N.R. under limited CNBV supervision, while the general
      terms describe an ecosystem spanning applications, websites, and platforms with product-specific terms layered on top. The pricing
      and CAT page adds regulated disclosure muscle: it publishes annualized average interest-rate and CAT references for both credit and
      card, plus warnings on payment default, variable-rate exposure, and minimum-payment risk. The payments stack has its own legal
      perimeter because Cobra Online is disclosed as the licensed aggregator behind Konfío Pagos. The collections file is also explicit:
      Konfío publishes its hired collection agencies, restricts payment settlement to Konfío directly, and states collection windows from
      8:00 to 21:00. App-store text adds practical control features such as card on/off toggles, in-app support, and references to the
      privacy notice. What is missing is as notable as what is present. No public SOC 2, ISO 27001, PCI attestation page, uptime/status
      page, penetration-test summary, or model-risk-governance memo was found in the reviewed set. For a company that increasingly wants
      to behave like a financial operating system, that disclosure gap is a real diligence issue.
    claimRefs:
