  evidenceGaps:
    - type: missing-source
      severity: material
      topic: developer-docs
      missingEvidence: A public API reference, integration guide, or architecture documentation pack for Konfío's app, payments, card, and analytics surfaces.
      whyItMatters: Product breadth is visible, but technical diligence still lacks a clean map of interfaces, dependencies, and implementation burden.
      diligencePath: Request API or integration documentation, third-party connector lists, and architecture diagrams for credit, card, and payments flows.
      relatedQuestionRefs: [QE016, QE025]
    - type: private-evidence-only
      severity: material
      topic: model-governance
      missingEvidence: Model-governance materials covering data lineage, approval-rate drift, fairness testing cadence, override policy, and loss performance by product.
      whyItMatters: Konfío's underwriting edge is central to the product thesis, but the public record does not show how the models are governed in production.
      diligencePath: Request model-risk committee materials, validation memos, challenger-model testing, and default / loss reporting by cohort.
      relatedQuestionRefs: [QE008, QE023, QE025]
    - type: conflicting-data
      severity: material
      topic: product-limit-conflict
      missingEvidence: A reconciled schedule showing why the credit page markets up to MXN10 million while the 2024 financing announcement emphasizes up to MXN5 million loans and up to MXN2 million card financing.
      whyItMatters: Investors need to know whether the different ceilings reflect product vintages, channel segmentation, or outdated marketing copy.
      diligencePath: Request current product terms, maximum ticket by product and risk tier, and the date each public marketing page was last approved.
      relatedQuestionRefs: [QE024]
    - type: missing-source
      severity: material
      topic: trust-portal
      missingEvidence: Public security certifications, uptime reporting, penetration-test summaries, PCI attestations, or incident-response disclosures.
      whyItMatters: Konfío is positioning toward a wider financial operating-system role, so trust disclosure quality matters for enterprise and banking readiness.
      diligencePath: Request SOC / ISO / PCI evidence, uptime data, incident logs, and security-governance documentation before underwriting bank-license readiness.
      relatedQuestionRefs: [QE019, QE022, QE025]
