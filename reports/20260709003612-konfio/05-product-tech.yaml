  - id: maturity-differentiation-and-developer-signal
    title: Maturity, differentiation, and developer signal
    body: >-
      Konfío's strongest product-differentiation signals are operational rather than code-level. The company markets decisions in hours,
      no mortgage collateral on credit, SAT-based underwriting, integrated spend controls, ERP-ready outputs, wallet and MSI acceptance,
      and in-app analytics that summarize sales and spending weekly, monthly, and annually. The about page adds one notable maturity
      signal: management says the business card became the most issued business card in Mexico in 2023 and that more than 98,000
      businesses now use the platform. Independent 2026 interviews extend the differentiation file by describing machine-learning models
      that can underwrite from roughly three months of invoicing data and by framing the banking-license push as a way to add deposits
      and treasury to an already functioning multi-product stack. Developer-signal evidence is thinner but still real. The jobs page says
      Konfío is data-driven and technology-focused, trains employees through Universidad Konfío, and recruits around critical-thinking and
      execution. The Org's engineering map shows dedicated payments, data-engineering, reliability, and cybersecurity roles, while the
      LinkedIn company profile still describes proprietary algorithmic underwriting and an ambition to move beyond lending into tools and
      platforms. The product therefore looks commercially mature, but public technical depth remains uneven: there is no openly browsable
      developer documentation set, no public API reference, and no transparent benchmark file showing how the underwriting or analytics
      engine performs in production.
