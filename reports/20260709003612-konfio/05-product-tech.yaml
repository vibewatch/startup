  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - - SAT-linked fiscal data access
        - Inputs business invoicing and tax identity into underwriting
        - SAT credentials and company billing data from applicants
        - Data-access, consent, and model-quality risk if fiscal inputs are incomplete or stale
      - - Underwriting and decisioning engine
        - Produces offers and credit decisions in minutes to hours
        - Proprietary algorithms and machine-learning models
        - No public model-governance, fairness, or loss-performance file beyond high-level claims
      - - Card and expense-control layer
        - Turns approved credit into employee spend, transfers, and reconciled expense data
        - Card product, app controls, and reporting surface
        - No public card-fraud or authorization-performance metrics
      - - Payments aggregation layer
        - Enables terminal and remote card acceptance
        - Cobra Online as authorized licensiatario and agregador
        - Counterparty, uptime, compliance, and settlement dependence on third-party infrastructure
      - - Mobile app and analytics layer
        - Displays credit, card, payments, business analytics, and security toggles
        - Android app, app analytics, and notification system
        - Public store evidence does not prove feature-usage depth or reliability at scale
      - - CRM and customer-operations stack
        - Centralizes client data, sales, and service workflows
        - Salesforce Customer 360, Sales Cloud, Service Cloud, and integrations to internal databases
        - Operational dependence on third-party CRM plus integration complexity
    notes: The architecture is reconstructed from customer-facing pages and a partner case study; no public engineering architecture diagram was released.
