  - id: operating-model-and-technical-stack
    title: Operating model and technical stack
    body: >-
      The public technical file is partial but specific enough to sketch an operating architecture. On the credit and card side,
      Konfío's pages and 2026 interviews say underwriting starts from company invoicing and SAT-linked fiscal data rather than from
      collateral-heavy bank history. The app and card surfaces then extend that decisioning layer into ongoing spend management:
      administrators can set role-based permissions, convert purchases into installments from the app, digitize receipts, and monitor
      credit, card, and business-performance data in one place. Payments add a separate operational rail. Konfío Pagos is explicitly
      disclosed as a service managed and provided by Cobra Online, S.A.P.I. de C.V., acting as an authorized Konfío licensiatario and
      card-payment aggregator, which means Konfío's SME wallet is already dependent on a third-party regulated acquiring stack rather
      than being vertically self-cleared. Customer operations are also visibly productized. Salesforce's customer story says Konfío moved
      from fragmented internal tooling to Salesforce Customer 360, rolling out online sales, offline sales, card, customer-service, and
      contact-center processes while keeping synchronization with internal databases and accelerating development through Lightning Web
      Components and integrations. That is not deep infrastructure disclosure, but it is good evidence that the company runs a layered
      operating model: fiscal-data ingestion and underwriting, product decisioning, mobile/product-control surfaces, payments aggregation,
      and CRM-driven customer operations.
    claimRefs:
