chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Konfío already sells a real multi-product SME-finance stack rather than a single unsecured-loan SKU. Public pages support five
    concrete surfaces: working-capital credit, a Visa business card, payment terminals and remote collections, a mobile app with
    analytics and card controls, and shared help/compliance rails across the ecosystem. The strongest operating-model evidence is not
    source-code transparency but workflow specificity: SAT-linked underwriting, app-based spend and payment monitoring, ERP-ready
    reporting, Salesforce-backed customer operations, and a separately licensed payments aggregator. The missing pieces are equally
    important: there is still no public API or security-certification file, no uptime disclosure, and no detailed public model-governance
    documentation for the underwriting engine.
sections:
  - id: product-surface-and-user-workflows
    title: Product surface and user workflows
    body: >-
      Konfío's product is best understood as an SME operating-finance bundle that starts with credit but does not stop there. The
      current public surface supports at least four actively marketed modules. First, Crédito Empresarial offers unsecured working-
      capital financing with public claims of up to MXN10 million, 48-hour funding, SAT-linked underwriting, and minimum operating and
      revenue thresholds. Second, Tarjeta Empresarial extends the relationship into day-to-day spend, supplier transfers, working-capital
      flexibility, ERP-ready reporting, expense controls, cashback, and app-based installment conversion. Third, Konfío Pagos pushes the
      company into merchant acceptance through terminals, remote payments, MSI, wallet acceptance, role-based collection permissions, and
      live deposit monitoring. Fourth, the mobile app binds these products together with analytics, alerts, card controls, and support.
      That workflow design matters because it shows Konfío trying to own the full cycle of SME cash generation, cash deployment, and cash
      visibility rather than merely originate one-off loans. Public inconsistencies still exist—the credit page advertises up to MXN10
      million while the December 2024 financing note emphasizes up to MXN5 million loans and MXN2 million card financing—but the broader
      pattern is clear: Konfío is a multi-surface financial operating system for Mexican SMEs.
