  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: current-revenue-and-unit-economics
      missingEvidence: Current annualized revenue, product mix, take-rate or spread economics, gross margin, reserve policy, and product-level profitability.
      whyItMatters: Investors cannot convert the public comp set into a defensible Konfío value without knowing what revenue and margin base they are actually capitalizing.
      diligencePath: Request audited 2025 and year-to-date 2026 financials, product revenue bridge, spread / fee mix, and margin disclosure by major product line.
      relatedQuestionRefs: [QV007, QV016, QV028]
    - type: private-evidence-only
      severity: material
      topic: cap-table-and-preferences
      missingEvidence: Current share count, preferred terms, liquidation preferences, anti-dilution mechanics, and any post-2021 financing structure.
      whyItMatters: A headline valuation can look attractive while still offering weak common-equity outcomes if preference overhang is large.
      diligencePath: Request full capitalization table, preference stack, and terms for every post-2021 financing instrument.
      relatedQuestionRefs: [QV022, QV028]
    - type: private-evidence-only
      severity: material
      topic: credit-quality-and-funding-discipline
      missingEvidence: Vintage losses, delinquency and recovery data, reserve quality, debt-facility covenants, borrowing-base rules, and refinancing schedule.
      whyItMatters: Konfío's valuation is highly sensitive to whether the company deserves platform multiples or lender discounts.
      diligencePath: Request credit performance packs, risk-committee materials, covenant summaries, and facility headroom data.
      relatedQuestionRefs: [QV021, QV027, QV028]
    - type: private-evidence-only
      severity: material
      topic: bank-license-conversion-plan
      missingEvidence: Detailed readiness plan showing how license approval would convert into deposits, treasury usage, and higher-multiple platform economics.
      whyItMatters: The bull case depends on more than approval; it depends on turning approval into durable wallet-share expansion.
      diligencePath: Request regulator-status memo, phased launch plan, expected product attach, and operating-control build-out for the post-license state.
      relatedQuestionRefs: [QV018, QV020, QV030]
