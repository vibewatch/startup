  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Dimension
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Platform breadth
        - Credit, card, payments, and planned deposit/treasury products can support a bank-like multiple path
        - Breadth matters only if cross-sell, loss control, and deposits actually arrive
        - Product-level revenue and attach-rate disclosure after license progress
      - - Scale and demand
        - More than 98,000 businesses and >MXN40B financed show real operating scale
        - Scale does not prove unit economics or equity value
        - Audited economics by product and cohort
      - - Funding support
        - MXN7.422B debt expansion proves institutional confidence and capacity to grow
        - Debt lines are not equity marks and can increase dependency risk
        - Facility usage, covenants, renewal risk, and margin data
      - - Public-market comp upside
        - If Konfío evolves toward a Nu/SoFi-style platform, premium multiples are possible
        - If it behaves more like a lender/payments hybrid with opaque credit losses, lower multiples dominate
        - Clear proof of deposit traction, profitability quality, and loss discipline
      - - Timing
        - 2021 unicorn anchor shows investors once paid a premium for the story
        - 2026 public markets are less forgiving of opaque, balance-sheet-heavy fintechs
        - Fresh equity round terms or audited 2026 financial package
    notes: The anti-thesis is not that Konfío lacks quality; it is that public evidence is still too thin to price quality with precision.
