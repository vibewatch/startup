company:
  name: Konfío
chapter:
  number: 8
  title: Valuation
  summary: >-
    Konfío still has an investable company story but not a tightly underwritable public valuation story. The last clean equity anchor remains
    the September 2021 unicorn round at roughly $1.3 billion, while the strongest post-cutoff evidence is operational and balance-sheet
    oriented: a MXN7.422 billion debt expansion in December 2024, management interviews in March 2026 about a pending bank license and
    profitability, and scale claims of more than 98,000 businesses using the platform. Public-market comparables are directionally useful
    but widen rather than narrow the range. July 2026 capitalization-to-revenue ratios span roughly 0.66x for PagSeguro, 1.02x for
    StoneCo, 2.74x for Upstart, 5.77x for SoFi, and 6.08x for Nu. At Konfío's last disclosed $1.3 billion valuation, that spread implies
    wildly different revenue thresholds depending on which business it most resembles. Because current revenue, loss rates, cap-table
    structure, and bank-license timing are still opaque, the most supportable posture is Track / Research-More with medium confidence and
    high risk. The company may prove more valuable than $1.3 billion, but public evidence does not yet justify paying up aggressively.
sections:
  - id: valuation-framework
    title: Recommendation and valuation framework
    body: >-
      Konfío clears the quality bar for continued diligence but not the disclosure bar for a firm buy call on public evidence alone. The
      positive case is real: the company has meaningful SME scale, a multi-product stack, institutional debt support, and management
      commentary suggesting profitability and a path toward a fuller banking platform. The negative case is equally real: the last clean
      price anchor is still the September 2021 $1.3 billion unicorn valuation, there is no public current revenue or loan-book-loss file,
      and the most important strategic catalyst—the banking license—remained pending in March 2026. That means price discipline must do
      more work than narrative confidence. On a pure company-quality lens, Konfío deserves attention. On a price-underwriting lens, the
      right stance is Track / Research-More with medium confidence and high risk until investors can reconcile current economics, current
      cap-table structure, and whether the business is evolving toward a Nu/SoFi-style platform or remaining closer to a thinner-margin
      lender/payments hybrid.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: financing-context-and-anchor
    title: Financing context and current price anchor
    body: >-
      Public valuation history is asymmetric. The 2021 Reuters/Yahoo Finance article gives a clean primary event: Konfío said it was worth
      $1.3 billion after a $235 million capital raise. Since then, the strongest disclosed financial signal is not a fresh equity round
      but the December 2024 debt-facility expansion from Goldman Sachs, JPMorganChase, and Afore Sura México. That improves growth
      capacity, but debt is not equity and it does not answer whether common shareholders would be investing above, below, or roughly at
      the 2021 mark in 2026. Management's 2026 interviews add more ambiguity. They describe a business that is already profitable at least
      on a revenue basis, that serves many first-time business-credit customers, and that wants to add deposit and treasury products once
      the bank license arrives. Those are meaningful signals, but they are still not a public revenue bridge, a reserve file, or a fresh
      post-money valuation. The practical result is that investors should treat $1.3 billion as a historical anchor, not as a live fair
      value.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV006
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
    tableRefs:
      - TV002
    figureRefs:
      - FV004
  - id: comparable-set-and-sensitivity
    title: Comparable set, public-market backdrop, and sensitivity
    body: >-
      The best public valuation discipline comes from comparable companies, but the comp set is structurally wide because Konfío is not a
      clean single-category business. Nu and SoFi matter because Konfío aspires to a broader digital-banking relationship with SMEs. StoneCo
      and PagSeguro matter because Konfío already touches merchant payments and business-finance workflows. Upstart matters because Konfío's
      underwriting story leans on alternative data and machine-learning speed in credit decisions. Those public businesses trade on very
      different capitalization-to-revenue ratios in July 2026: about 6.08x for Nu, 5.77x for SoFi, 2.74x for Upstart, 1.02x for StoneCo,
      and 0.66x for PagSeguro. At a $1.3 billion valuation, Konfío would need roughly $214 million of revenue to look like Nu, $225
      million to look like SoFi, $474 million to look like Upstart, $1.27 billion to look like StoneCo, or nearly $1.97 billion to look
      like PagSeguro on the same simple ratio. That spread does not prove value; it proves how sensitive the answer is to business-model
      interpretation and undisclosed economics.
    claimRefs:
      - CV017
