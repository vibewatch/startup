  - id: bull-base-and-bear-cases
    title: Bull, base, and bear valuation cases
    body: >-
      Scenario work is more supportable than point-estimate precision. A bear case around $500 million to $900 million assumes the banking
      license slips materially, credit or conduct concerns rise, and investors start valuing Konfío more like a risk-sensitive lender or
      merchant-finance platform than like a premium digital bank. A base case around $900 million to $1.4 billion assumes the current
      multi-product strategy is real and the 2021 mark is still directionally defendable, but that public opacity on revenue, losses, and
      cap-table terms keeps the company from earning a meaningful markup on public evidence alone. A bull case around $1.5 billion to $2.0
      billion requires several things to go right together: bank-license approval, proof that deposits and treasury deepen the platform,
      continued profitability, stable credit quality, and no punitive financing structure. In other words, upside exists, but it is
      catalyst-heavy and disclosure-dependent.
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV009
      - CV033
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
      - CV043
    tableRefs:
      - TV005
    figureRefs:
      - FV003
  - id: final-diligence-and-triggers
    title: Final diligence asks, thesis-break triggers, and exit posture
    body: >-
      The final recommendation stays conservative because the missing information sits exactly where valuation decisions are won or lost.
      Investors still need current revenue, take-rate or net-interest economics by product, default and reserve behavior, capital-structure
      terms, facility covenants, and a concrete post-license operating plan. Public evidence is strong enough to justify monitoring and
      continued diligence, but not strong enough to justify forcing a fresh lead or paying a confidence premium above the last disclosed
      mark. The cleanest upgrade trigger would be a package of audited economics plus explicit bank-license progress that shows Konfío is
      becoming a higher-multiple SME platform rather than merely a larger risk-bearing lender. The cleanest downgrade triggers would be
      renewed funding dependence, credit-quality deterioration, conduct failures, or a delayed licensing path that makes the 2021 unicorn
      label look stale rather than strategic.
    claimRefs:
