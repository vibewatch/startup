  - id: TV006
    title: Final diligence asks table
    columns:
      - Ask
      - Why it matters
      - What a good answer would show
    rows:
      - - Current revenue and product mix
        - Needed to translate public comp multiples into a real valuation band
        - Revenue base large enough to defend or exceed $1.3B on quality-adjusted multiples
      - - Credit and card loss performance
        - Determines whether Konfío deserves platform premiums or lender discounts
        - Stable vintages, manageable delinquencies, and credible reserves
      - - Cap table and preference stack
        - Dictates whether a headline valuation benefits common-equity investors
        - Cleaner structure with limited overhang or punitive preferences
      - - Facility and covenant detail
        - Debt support is helpful only if refinancing risk is controlled
        - Ample headroom, orderly maturities, and no hidden stress conditions
      - - Bank-license implementation plan
        - Upside depends on more than approval; it depends on execution
        - Credible path to deposits, treasury, and deeper wallet share without control failures
    notes: Konfío does not need perfect disclosure to merit interest, but it does need materially better disclosure to justify an aggressive price.
