callouts:
  - calloutType: risk
    title: Konfío may be a good company at a bad or at least unproven price
    body: >-
      The company story is credible, but the valuation story is still mostly anchored in a 2021 unicorn round. Without current revenue,
      losses, and cap-table detail, investors cannot safely assume that quality automatically equals upside at or above that historical mark.
    claimRefs:
      - CV001
      - CV008
      - CV009
      - CV010
      - CV045
  - calloutType: insight
    title: The right comp set depends on what Konfío becomes next
    body: >-
      If the banking license arrives and deposits deepen the platform, Nu and SoFi become more relevant. If balance-sheet credit risk and
      merchant-finance mechanics dominate, Upstart, StoneCo, and PagSeguro become more important anchors.
    claimRefs:
      - CV003
      - CV017
      - CV031
      - CV032
      - CV033
      - CV034
  - calloutType: strength
    title: There is genuine upside if opacity closes in the right direction
    body: >-
      A profitable, license-approved, multi-product SME-bank platform could justify a higher valuation band than a credit-led lender with
      similar surface metrics. The missing link is not possibility but evidence.
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV038
      - CV040
