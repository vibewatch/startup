  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Why it matters
      - Warning signal
      - Investor action
    rows:
      - - Bank-license delay or rejection
        - Platform-banking upside gets pushed out or weakened
        - No approval or credible timeline after management's 2026 final-stage claim
        - Reset to lender/payments-only valuation framework
      - - Credit-quality deterioration
        - Thin-file first-credit borrowers can reprice the whole story quickly
        - Rising delinquencies, weaker recoveries, or reserve stress
        - Cut valuation range and re-underwrite downside first
      - - Funding dependence worsens
        - Debt lines remain crucial to growth and liquidity
        - Renewal difficulty or tighter covenants
        - Treat debt support as a risk amplifier, not a validation
      - - Conduct / servicing issues escalate
        - Collections or payment-sync failures can damage trust and regulator optics
        - Pattern of complaints or service incidents
        - Apply higher risk discount and slow investment pace
      - - Transparency still does not improve
        - Investors cannot pay premium multiples into persistent opacity
        - No audited current economics or cap-table clarity
        - Keep recommendation at track or research-more
    notes: These triggers are intentionally concrete so the recommendation can move with evidence rather than with mood.
