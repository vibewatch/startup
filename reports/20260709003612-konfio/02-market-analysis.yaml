tables:
- id: TM001
  title: Market Definition Table
  columns:
  - Segment / category
  - Included spend or workflow
  - Excluded spend / substitute
  - Buyer / payer
  - Relevance to Konfío
  rows:
  - - SME working-capital credit
    - Short-tenor loans, revolving credit, invoice-linked liquidity, business cards
    - Consumer loans, mortgages, large-corporate revolvers
    - Owner-manager / CFO
    - Core revenue engine and underwriting wedge
  - - Payment acceptance and collection
    - POS terminals, links de pago, card acceptance, reconciliation
    - Cash-only commerce, manual collection, pure gateway software
    - Owner-manager / operations lead
    - Important acquisition and data-exhaust entry point
  - - Business finance management
    - Expense controls, invoice retrieval, analytics, treasury-like workflows
    - Generic accounting suites without credit layer
    - Owner-manager / accountant
    - Drives stickiness and lowers CAC if bundled
  - - Deposit and treasury services
    - Future bank-account, cash-yield, treasury, payroll rails
    - Retail banking products; consumer wallets
    - CFO / owner-manager
    - Currently adjacent, becomes core only if bank license lands
  - - Status-quo substitute
    - Supplier credit, owner capital, personal cards, cash holdings
    - —
    - Owner-manager
    - Largest invisible competitor because it delays formal product adoption
  - - Incumbent bank substitute
    - Traditional SME current accounts and secured loans
    - —
    - CFO / owner-manager
    - Sets pricing floor and trust benchmark for later-stage customers
  notes: The market boundary is defined around the job-to-be-done for formalizing SMEs rather than around the label “fintech.” Konfío competes against informal workflows as much as against other licensed entities.
