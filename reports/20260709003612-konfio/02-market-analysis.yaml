chapter:
  number: 2
  title: Market Analysis
  summary: 'Konfío sells into a very large but highly fragmented Mexican SME-finance opportunity where formal credit access remains low, digital adoption is incomplete, and cash and supplier credit still act as the dominant substitutes. The strongest public sizing lens comes from OECD and Mexico Business News: 5.4 million MSMEs, only 10.7% with financing from any source in 2023, and a banking portfolio of MXN565.4 billion at end-2024. The 2026 fintech ecosystem is more mature and collaborative than the 2021 boom years, but high rates, tax-formality fears, cybersecurity concerns, and unresolved open-finance regulation still constrain adoption and justify a disciplined rather than headline-TAM valuation view.'
sections:
- id: market-boundary-and-status-quo-substitutes
  title: Market Boundary, Included Spend, and Status-Quo Substitutes
  body: Konfío’s real market is not “all fintech” and not even all SME lending. The relevant boundary is the overlap of working-capital credit, business cards, payment acceptance, and business-finance workflows for formalizing Mexican micro, small, and medium enterprises. That means the included spend is the SME credit book, payment-acceptance economics, and operating-finance software budget that helps small businesses manage invoices, cash collection, and treasury. Excluded spend includes consumer BNPL, large-corporate treasury systems, pure payroll software, and deposit-gathering economics that Konfío cannot yet access until a banking license is granted. The most important substitutes are not always other fintechs. OECD, CIAL Dun & Bradstreet, and company interviews all show a status quo where SMEs still rely on owner capital, supplier credit, personal cards, and cash-heavy workflows. Those substitutes matter because they lower visible demand even when the financing need is real. In other
    words, Konfío is selling not only against incumbent banks and rival fintechs, but also against informality, tax anxiety, and the habit of solving business liquidity with non-specialized tools.
