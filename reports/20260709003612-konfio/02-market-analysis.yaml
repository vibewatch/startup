callouts:
- calloutType: insight
  title: Konfío’s TAM is large, but its true SAM is the formalization bottleneck
  body: The biggest mistake in underwriting this market is to equate 5.4 million MSMEs with 5.4 million finance-ready customers. The evidence instead says Konfío wins where digital behavior, invoice data, and financing need intersect — a smaller but still attractive market that rewards underwriting discipline over headline scale.
  claimRefs:
  - CM001
  - CM003
  - CM010
  - CM041
- calloutType: risk
  title: The market is attractive precisely because it is hard
  body: High rates, low trust, cash reliance, and tax-formality fears are not temporary bugs; they are the structural reasons the gap exists. Any forecast that assumes frictionless migration from cash or supplier credit into digital SME finance will overstate both growth and margin durability.
  claimRefs:
  - CM005
  - CM006
  - CM010
  - CM028
  - CM040
- calloutType: strength
  title: Konfío’s multi-product design matches how Mexican SMEs actually adopt fintech
  body: The most useful market insight is that adoption often starts with a workflow pain, not with a category label. Payments, cards, and business-management tools can lower CAC and improve underwriting, which is why a combined platform has more strategic value than a stand-alone lender.
  claimRefs:
  - CM015
  - CM023
  - CM024
  - CM035
  - CM037
