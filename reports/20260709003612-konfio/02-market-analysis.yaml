- id: sizing-lenses-and-addressable-demand
  title: Sizing Lenses and Addressable Demand
  body: 'The strongest public sizing lens begins with enterprise count and then narrows through credit access. OECD’s 2026 Mexico chapter says the country has 5.4 million MSMEs, of which 95.5% are micro, and only 10.7% obtained financing from any source in 2023. That is a more grounded starting point than broad “fintech” headlines because it captures the structural scarcity Konfío is trying to monetize. The supply side is visible too: the banking portfolio for MSMEs reached MXN565.4 billion at end-2024, only 13.04% of outstanding commercial loans. Market-definition disagreements still matter. Trade.gov cites more than 1,104 fintech start-ups in Mexico, while Finnovista-based 2026 summaries cite 795 local fintechs and FinTech México references roughly 770 local plus 217 foreign initiatives. Those are not necessarily contradictory; they simply use different denominators. For Konfío, the practical SAM is not the whole ecosystem count but the formally operating SME base that wants faster underwriting,
    digital payments, and eventually integrated banking. That supports a large opportunity, but not an infinite one, because customer acquisition and repayment behavior remain tied to sector mix, formality, and rate sensitivity.'
