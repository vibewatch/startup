- id: TM004
  title: Growth Drivers and Constraints Table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Large underserved SME base
    - Driver
    - Current / ongoing
    - Creates persistent demand for faster credit and operating-finance tools
    - Measure how much of Konfío’s funnel is first-time formal borrowers versus repeat switchers
  - - Digital payments and mobile banking adoption
    - Driver
    - Current / ongoing
    - Creates data exhaust and lowers onboarding friction for platform lenders
    - Check whether payment data materially improves conversion and loss outcomes
  - - Plan México SME-finance push
    - Driver
    - 2025-2030
    - Policy support can expand formal demand and lower acquisition friction
    - Test whether government momentum changes bank partnership economics or only rhetoric
  - - AI-driven ecosystem maturity
    - Driver
    - 2026 onward
    - Rewards lenders that combine underwriting, fraud controls, and workflow automation
    - Confirm whether Konfío’s AI stack improves CAC and loss rates versus peers
  - - High credit cost for MSMEs
    - Constraint
    - Current / ongoing
    - Makes good demand look unaffordable and compresses take-up
    - Benchmark Konfío APRs and fees against banks and rival fintechs
  - - Cash dependence and tax-formality fears
    - Constraint
    - Current / ongoing
    - Keeps many SMEs outside digital rails and reduces observable underwriting data
    - Quantify how often SAT/fiscalization fears block onboarding or payment adoption
  - - Cybersecurity and trust concerns
    - Constraint
    - Current / ongoing
    - Digital-finance adoption slows if fraud or identity theft fears rise
    - Review complaint ratios, fraud metrics, and outage history across peers
  - - Pending open-finance and regulatory modernization
    - Constraint
    - 2026 onward
    - Can either unlock broader data-sharing or raise compliance cost and licensing delays
    - Map which product features depend on still-unfinished regulatory changes
  notes: Most market drivers are double-edged. The same digitalization trend that improves underwriting also increases fraud and compliance burdens, while policy support does not automatically lower customer trust barriers.
