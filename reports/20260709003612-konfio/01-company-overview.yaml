- calloutType: risk
  title: The banking-license upside is meaningful, but timing and chronology remain unresolved
  body: 'Every recent management interview pushes the same strategic destination: add deposit accounts and treasury services for SMEs. What the public file does not yet provide is a clean timeline or an approval date. The discrepancy between a 2023 filing narrative and a 2024 filing narrative is a small but telling reminder that Konfío still discloses like a private company, not like a bank applicant living on prospectus-level chronology discipline.'
