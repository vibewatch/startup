- id: milestones-bank-license-and-adverse-context
  title: Milestones, Banking-License Path, and Adverse Context
  body: 'The strategic through-line in Konfío’s public record is clear: originate credit fast to underserved SMEs, layer in payments and operating tools, then seek a full bank charter so those customers can also hold deposits and manage treasury in the same ecosystem. What is less clear is the exact timing of the application. Expansion says the banking-license filing dates back to September 2023, while El Economista places the submission in 2024; those accounts contradict each other on the start date but still converge on the higher-level point that the application was pending into March 2026. Management’s public rhetoric is confident, saying the company is in the final stage and waiting on the regulator, yet no approval had been documented in the reviewed source set by runDate. There are also real downside signals. The official Buró page emphasizes that users should compare complaints, sanctions, and contract issues, and debt-advice coverage says delinquent SME borrowers can face bureau
    reporting, intense collection follow-up, and potentially judicial recovery depending on documentation. None of that disproves the franchise, but it does remind investors that Konfío remains a leveraged lender inside a regulated credit ecosystem where collections conduct, underwriting quality, and license timing can all change the equity story quickly.'
