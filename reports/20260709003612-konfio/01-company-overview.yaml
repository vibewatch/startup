  evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-disclosure-TO002
    missingEvidence: A current public board roster, independent-director names, and committee membership list for Konfío.
    whyItMatters: The IDB case study confirms governance upgrades, but investors still cannot independently verify who currently governs the company or how much founder control remains.
    diligencePath: Request the current board deck, shareholders agreement summary, and committee charter pack from management.
    relatedQuestionRefs:
    - QO007
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: material
    topic: bank-license-timing
    missingEvidence: A dated CNBV filing acknowledgment or management chronology that reconciles whether the bank-license application began in September 2023 or in 2024.
    whyItMatters: The discrepancy is small but matters because it affects how long the process has been pending and how management describes regulatory progress.
    diligencePath: Request the CNBV submission receipt, first regulator comment letter, and updated licensing workplan.
    relatedQuestionRefs:
    - QO020
  - type: private-evidence-only
    severity: material
    topic: headcount-and-cap-table-TO003
    missingEvidence: An audited employee count and a current cap table showing common, preferred, option pool, and debt-linked dilution rights.
    whyItMatters: Late-stage valuation and governance underwriting depend on ownership and operating-scale metrics that are not fully public.
    diligencePath: Request the latest cap-table export, option schedule, and year-end HR census from the data room.
    relatedQuestionRefs:
    - QO024
    - QO025
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: audited-profitability
    missingEvidence: Audited 2024 and 2025 standalone financial statements showing revenue, net income, loan-loss provisions, and funding costs.
    whyItMatters: Management says Konfío is profitable, but investors still need audited economics to judge durability, margin quality, and funding sensitivity.
    diligencePath: Request audited financial statements plus monthly portfolio and charge-off reporting for 2024-2026.
