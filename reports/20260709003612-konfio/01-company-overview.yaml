- calloutType: strength
  title: 'Konfío has already solved the hard part of funding an SME lender: repeated access to institutional capital'
  body: The company’s public record is unusual for a LatAm SME lender because it shows both late-stage venture backing and repeated warehouse or debt-line support from IDB Invest, Goldman Sachs, JPMorgan, and Afore Sura. That combination suggests external funders view the underwriting engine and reporting stack as good enough to absorb substantial institutional capital, which is harder to fake than marketing-scale counters.
  claimRefs:
