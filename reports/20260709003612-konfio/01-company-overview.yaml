- id: capital-base-profitability-and-scale-signals
  title: Capital Base, Profitability, and Scale Signals
  body: 'Konfío’s capital history shows a company that used both venture equity and structured debt to build scale. The best-supported venture milestone is the June 2021 Series E round of US$125 million led by Lightrock with participation from SoftBank Latin America Fund, Kaszek, QED, IFC, VEF, and Tarsadia; later reporting also says a September 2021 follow-on Series E closed at US$110 million and implied a US$1.3 billion valuation. Development-finance support predates the unicorn moment: IDB Invest disclosed a US$40 million facility in 2019 and a MXN1.14 billion warehouse line in 2020 to support securitization of MSME loans. The most current financing event is the December 2024 debt package totaling MXN7.422 billion from Goldman Sachs, JPMorgan Chase, and Afore Sura México. Public 2026 interviews add a notable operating claim: both David Arana and Eugenio Fonseca describe the company as profitable, with Arana saying profits started in 2024 and Fonseca saying the last two years have been
    above the profitability threshold. The caveat is that many scale counters are company-defined and move over time: reviewed sources variously cite about 80,000, 85,000, 90,000, and 98,000 businesses served, so the prudent read is that Konfío is large and still growing, but public disclosure quality remains private-company light.'
