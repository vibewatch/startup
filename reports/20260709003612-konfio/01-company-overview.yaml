- calloutType: risk
  title: Scale looks real, but the exact operating denominator is still messy
  body: Konfío appears plainly large, yet public sources variously cite about 80,000, 85,000, 90,000, and 98,000 businesses served, plus financing totals ranging from MXN26 billion to MXN40 billion and even higher management language around “investments.” That does not negate momentum, but it means later valuation work should use conservative externally repeated figures unless management supplies a reconciled data room metric definition.
  claimRefs:
  - CO014
