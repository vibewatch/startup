- id: leadership-governance-and-operating-discipline
  title: Leadership, Governance, and Operating Discipline
  body: The public leadership file is thinner than the funding file, but several named operators do surface clearly enough to matter. David Arana remains the most visible cofounder and strategic voice, Francisco Padilla is still cited as cofounder, Gregorio Tomassi handled the public explanation of the 2024 debt package and the bank-license push, and Eugenio Fonseca León discussed profitability, underwriting discipline, and growth plans in March 2026. The deeper governance signal comes from IDB Invest’s case-study material rather than from a company investor deck. Those documents say Konfío added an audit committee, brought in four independent board members, formalized a monthly risk committee, and hired a Big Four external auditor as it scaled. They also say that this governance buildout improved the company’s posture during an AML-focused regulatory audit. That is an important diligence point because the Mexican fintech and non-bank lender landscape has had governance blowups elsewhere;
    Konfío’s public materials do not disclose a current board roster, but the IDB record does support the claim that management has spent meaningful time professionalizing committees, controls, and lender reporting.
