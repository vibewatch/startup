  - id: milestones-scale-adverse
    title: Growth, Milestones, and Adverse Events
    body: >-
      BigID's revenue trajectory has been strong: from $25M in 2020 to $51.7M in 2021, $78.3M in 2022,
      $105.1M in 2023, and $139.5M in 2024, per Latka estimates. The company's own statement at the March
      2024 funding round cited "almost $100M in recurring revenue," suggesting ARR was approximately $100M
      at that date, with a gap between reported ARR and total revenue that likely reflects one-time or
      professional services components. Headcount has grown from approximately 278 employees in 2020 to
      around 721 globally as of 2025–2026. The customer base is estimated at approximately 116 enterprise
      accounts per Latka, though this figure has not been independently confirmed by BigID. Key milestones
      include: winning the 2018 RSA Innovation Sandbox; attaining unicorn status in December 2020;
      achieving FedRAMP authorization in March 2026 via Knox Systems (enabling US federal agency adoption);
      and being named a Challenger in the 2026 Gartner Magic Quadrant for Data and Analytics Governance
      Platforms. On the adverse side, BigID filed a lawsuit in July 2025 in the US District Court for the
      Southern District of New York (case 1:2025cv05571) against former Senior VP of Sales Nickolas Maxwell,
      alleging submission of more than $700,000 in fraudulent business expenses from 2022 to 2024. BigID
      voluntarily dismissed the case in September 2025 without prejudice. While the company prevailed in
      avoiding a contested adverse judgment, the episode reveals internal controls weaknesses—specifically
      inadequate expense oversight for senior remote employees—that constitute a governance risk. BigID's
      2022 revenue growth rate of 16.6% lagged the data privacy compliance sector average of 27.6%, per
      IDC, a competitive positioning concern noted at the time of the 2024 funding round.
