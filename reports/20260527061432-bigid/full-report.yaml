        - Need ~1.5x-2.0x gross base-case upside from entry
        - Base-case range works from secondary-style pricing, not from stale unicorn pricing
        - Supportable above $550M only with evidence of >$150M revenue, strong NRR, and clean structure
        - Price sensitivity, not admiration, should drive the IC decision
