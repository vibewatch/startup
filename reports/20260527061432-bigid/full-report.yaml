  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Workflow Scope
        blocks:
          - type: paragraph
            body: >-
              BigID operates between an enterprise's distributed data estate—spanning cloud object stores, relational
              databases, SaaS applications, data lakes, on-premises file shares, and AI model pipelines—and the
              security, privacy, compliance, and AI governance decisions that depend on knowing what that data contains
              and who it belongs to. The core customer problem BigID solves is enterprise data blindness: organizations
              cannot manage risk in data they cannot see. BigID's answer is an automated discovery-then-action loop:
              scan data sources at petabyte scale, classify findings with ML and identity intelligence, enrich results
              with access and risk context, and then enable concrete action—deletion, access revocation, DSR
              fulfillment, retention enforcement, or AI pipeline governance.

              In workflow terms, a CISO team uses BigID to discover and prioritize sensitive data risk without manual
              sampling; a privacy team uses it to automate GDPR/CCPA data subject requests across hundreds of connected
              sources; a compliance team uses it to generate audit evidence aligned to HIPAA, PCI DSS, and NIST 800-53;
              and an AI program team uses it to validate that LLM training data is clean of PII, secrets, or toxic data
              before model ingestion. BigID Next, launched in February 2025, packages all of these workflows into a
              single modular platform replacing the need to run separate DSPM, DLP, privacy management, data catalog,
              and AI governance point tools. The platform is marketed as the industry's first cloud-native, AI-powered
              Data Security Platform (DSP) addressing the entirety of data risk across security, compliance, and AI.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
