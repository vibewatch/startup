      - number: '2.3'
        title: Buyer / User / Payer Segmentation and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              BigID’s buyer map is unusually broad. Security-led deals are typically sponsored by the CISO or
              data-security

              organization, where the pain point is multicloud visibility, data exposure, breach reduction, or audit
              response.

              Privacy-led deals sit with privacy, legal, and compliance leaders who need rights management, deletion,
              and

              policy-to-workflow execution across both human and AI-related data. Governance-led evaluations involve
              CDAOs and

              data-governance teams once BigID is compared against catalog- and stewardship-oriented platforms. The
              newest entry

              point is AI governance, where platform, model-risk, and security teams need inventory, runtime oversight,
              and

              evidence tied to NIST and EU AI Act expectations.


              That breadth is strategically attractive because one approved deployment can expand across adjacent
              budgets. It also

              creates friction because no single buyer always owns the full contract. Security can sponsor the initial
              land, but

              privacy may own deletion and rights workflows, data teams may care about metadata and governance, and AI
              teams may

              appear later once generative-AI programs move from experimentation toward controlled production. The
              cross-

              functional nature of the product is therefore both a go-to-market strength and an execution tax.


              Public demand data suggests BigID is primarily an enterprise play. Large organizations account for the
              majority of

              DSPM spending and show higher completed-adoption rates than the mid-market. The most plausible adoption
              path is a

              wedge sale into an urgent security or privacy workflow, followed by a broader platform conversation once
              the

              customer sees value in maintaining one shared inventory of sensitive data, access, policy, and AI-related
              risk.

              That is the right lens for evaluating BigID’s deal velocity, ACV quality, and cross-sell durability.
