      - number: '2.2'
        title: Sizing Lenses, Contradictory Estimates, and an Evidence-Constrained SAM
        blocks:
          - type: paragraph
            body: >-
              Public market data supports BigID’s opportunity only through overlapping lenses. Standalone DSPM is the
              closest

              category, but even there the published range is wide: Palo Alto’s 2026 guide collates estimates as low as
              $415

              million and as high as $2 billion for 2025, while QY Research and Stratistics MRC imply very different
              forward

              paths from roughly $1.8 billion in 2025 or $1.3 billion in 2026. The disagreement is not a rounding error.
              It

              reflects different definitions of whether DSPM is counted narrowly as a standalone data-security product
              or more

              broadly as a capability inside cloud-security and data-platform suites.


              Data governance and AI governance add real adjacency, but they should not simply be summed on top of DSPM.
              Data

              governance is already a $5.38 billion to $6.31 billion 2026 market depending on the publisher, while AI
              governance

              is smaller today at roughly $0.49 billion to $0.61 billion in 2026 but growing quickly under regulatory
              pressure.

              Broader data discovery is much larger again, at $21.95 billion in 2026, but most of that spend is too
              broad to

              treat as BigID’s direct SAM because it includes analytics and metadata use cases that never become
              security or

              governance control systems. Privacy is similar: budget growth is clearly real, yet public evidence is
              stronger for

              rising spend than for a clean, standalone privacy-automation software TAM.


              The underwriting implication is to separate raw adjacency from monetizable scope. A raw 2026 adjacent lens
              can top

              $29 billion if broad data discovery is included, but a more defensible overlap-adjusted BigID SAM is
              roughly $3

              billion to $5 billion after excluding clearly noncompetitive discovery spend and discounting for overlap
              among

              security, privacy, governance, and AI-governance budgets. That still leaves substantial headroom against
              BigID’s

              disclosed recurring-revenue level, but it also preserves the fact that public market estimates remain
              contradictory

              and should not be collapsed into a single false-precision headline.
