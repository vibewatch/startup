chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Overview
        blocks:
          - type: paragraph
            body: >-
              BigID was founded in 2016 by Dimitri Sirota and Nimrod Vax in New York City and Tel Aviv, Israel, with the
              core idea that enterprises needed a data-first approach to privacy, security, and governance—one rooted in
              actually knowing what data they hold, who it belongs to, and how it flows. The company commercially
              launched its platform in 2018, coinciding with rising regulatory urgency around GDPR, and was named Most
              Innovative Startup at the 2018 RSA Innovation Sandbox contest, providing its first major market
              validation. BigID's platform is an AI-augmented data security, privacy, compliance, and AI governance
              solution for cloud-first enterprises. Its core capabilities include data discovery and classification
              across structured, unstructured, and semi-structured data; data security posture management (DSPM); data
              loss prevention; privacy management; access governance; and AI data governance. The platform supports
              cloud, SaaS, on-premise, and hybrid environments, deploying over 1,500 classifiers powered by machine
              learning and identity intelligence. BigID's business model is subscription-based enterprise SaaS. Its
              target customers are large enterprises—particularly in regulated industries such as finance, healthcare,
              and government—that need to manage complex data landscapes for regulatory compliance, breach risk
              reduction, and AI governance. Notable named customers include the US Army and University of Maryland.
              BigID is headquartered in New York City with a major engineering and development presence in Tel Aviv,
              Israel, and maintains offices in the United Kingdom through BIGID UK LTD (incorporated April 2018). As of
              May 2026, BigID remains a private company with unicorn valuation status achieved in December 2020 and
              maintained through its March 2024 growth round, most recently generating $139.5M in total revenue per
              third-party estimates (Latka, October 2024). The company's product has evolved from a GDPR-focused PII
              discovery tool into a unified data and AI governance platform branded as BigID Next, addressing
              enterprises operating in the AI era.
