          - type: callout
            title: FedRAMP Authorization Opens Federal Market
            body: >-
              BigID's FedRAMP authorization (March 2026) via Knox Systems represents a meaningful moat in the federal
              and regulated-sector market. Federal agencies can now deploy BigID for CUI, PII, and PHI discovery under
              the highest federal security standards—a procurement barrier that competitors without FedRAMP
              authorization cannot easily overcome.
            calloutType: strength
            claimRefs:
              - CE035
              - CE036
          - type: callout
            title: Configuration Complexity, False Positives, and Premium Pricing Constrain Adoption
            body: >-
              PeerSpot and G2 user reviews consistently identify three structural friction points: (1) configuration of
              multi-database connections is reported as challenging; (2) false positives in scan output create noise
              that requires dedicated analyst time to triage; (3) pricing is positioned as premium and explicitly
              unfavorable for SMB or resource-constrained teams. These issues are not product-breaking for large
              enterprises, but they create real competitive surface for lower-friction DSPM entrants and constrain
              downmarket expansion.
