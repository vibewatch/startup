            body: >-
              BigID does not look governance-light in a vacuum. The company publishes a code of conduct, anti-bribery
              policy, ESG policy, privacy notice, DPA, and other formal artifacts that many private peers never expose
              publicly. The code explicitly involves the board, legal affairs, and information security; the
              anti-bribery policy references FCPA and UK Bribery Act obligations; the ESG policy says the company
