      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory Tailwind and FedRAMP Authorization
            body: >-
              BigID's founding thesis—that GDPR and emerging privacy regulations would force enterprises to invest in
              data intelligence technology—has been repeatedly validated. FedRAMP authorization achieved in March 2026
              via Knox Systems adds the US federal government as an addressable market, with deployments already
              confirmed at the US Army, significantly expanding the total addressable market and providing defensible
              differentiation against non-authorized competitors.
            calloutType: strength
            claimRefs:
              - CO003
              - CO023
              - CO030
          - type: callout
            title: Governance Risk from Maxwell Expense-Fraud Episode
            body: >-
              BigID's July 2025 lawsuit against former SVP of Sales Nickolas Maxwell, alleging $700,000+ in fraudulent
              business expenses from a remote senior employee over a multi-year period, signals inadequate internal
              financial controls. While the lawsuit was voluntarily dismissed in September 2025 without a court ruling,
              the episode raises questions about expense management oversight and the robustness of controls for remote
              senior executives. Prospective investors and board members should demand an audit of internal controls and
              confirmation that remediation steps have been taken.
            calloutType: risk
            claimRefs:
              - CO025
              - CO026
              - CO044
          - type: callout
            title: Secondary Market Valuation Compression
            body: >-
              While BigID officially maintained a $1B+ valuation in its March 2024 growth round, secondary market data
              implies a valuation closer to $530M as of 2025–2026. This divergence between VC-round pricing and private
              market secondary pricing may reflect investor concerns about growth rate deceleration, prolonged
              time-to-exit, or competitive positioning. Investors should model exit scenarios against the secondary
              market range rather than the last primary round headline.
