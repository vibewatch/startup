  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Growth re-rates down
        - 2025-2026 revenue growth proves sub-15%
        - Moves BigID toward Varonis-like or below-low-end public multiples without transparency premium
        - Re-underwrite toward bear case and avoid premium entry
      - - Retention misses
        - NRR disclosed below ~105% or churn materially elevated
        - Breaks the expansion-story thesis behind platform breadth
        - Pause investment unless price resets materially lower
      - - Structure overhang
        - Cap table shows heavy senior preferences, large option refresh, or debt-like obligations
        - Reduces common-equity upside even if headline valuation looks acceptable
        - Demand better entry terms or pass
      - - New financing clears low
        - Next priced round or tender lands below current secondary range
        - Confirms that the derived mark was not conservative enough
        - Shift to bear-case assumptions
      - - Execution quality slips
        - Renewal friction, product reliability issues, or security incidents start affecting customers
        - Compresses both growth and multiple support
        - Treat as thesis break until remediation is proven
      - - Governance recurrence
        - Additional control failures, litigation, or executive-integrity issues emerge
        - Expands discount rate and weakens exit optionality
        - Escalate risk rating and defer entry
    notes: >-
      These are monitorable triggers rather than predictions. Thresholds are intentionally conservative because current
      public evidence is incomplete and private-company downside can move quickly once structure or quality data
      disappoint.
