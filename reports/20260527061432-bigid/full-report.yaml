      - number: '5.6'
        title: Trust, Security, Privacy, and Compliance Controls
        blocks:
          - type: paragraph
            body: >-
              BigID holds SOC 2 Type II and ISO 27001:2013 certifications, confirming its information security
              management system and operational security controls have been independently audited. In March 2026, BigID
              achieved FedRAMP authorization in partnership with Knox Systems, the largest federal AI-managed cloud
              provider, enabling U.S. federal agencies to use BigID's platform under rigorous federal security
              standards. This authorization covers discovery and classification of CUI, PII, and PHI across federal
              cloud and on-premises environments, alignment to Zero Trust Architecture mandates, and compliance with
              NIST SP 800-53, CMMC, FISMA, and EO 14028. The federal page lists specific certifications—CJIS, IRS 1075,
              HIPAA, OMB mandates—and touts full audit trails and automated evidence collection.

              Privacy controls within the platform include automated DSR (Data Subject Request) fulfillment across
              connected data sources, cookie/consent management, preference portals, and policy-driven data
              minimization. BigID's secure-by-design commitment received a perfect Forrester score. The platform
              supports GDPR, CCPA/CPRA, HIPAA, PCI DSS, ITAR, and emerging AI regulations including the EU AI Act and
              NIST AI RMF. For AI-specific governance, BigID's AI TRiSM module—introduced in 2025—adds AI Security
              Posture Management (detecting unauthorized GenAI use and prompt injection), AI Risk Assessment
              (quantifying exposure across infrastructure, data, usage, and vendors), and AI Data Trust (validating
              training and inference data integrity). A notable gap: BigID does not publicly publish a security status
              page or incident disclosure history, making it difficult to independently verify operational reliability
              SLAs from external sources.
