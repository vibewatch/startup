      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers are measurable and current. Regulation is moving from abstract pressure to
              hard

              timing: the EU AI Act is fully applicable from 2 August 2026 for most obligations, with large penalties
              for

              non-compliance, while NIST AI RMF gives US buyers a practical governance reference model. AI governance is
              no

              longer just a policy topic; Gartner and Research and Markets both show a funded platform category
              emerging. On the

              privacy side, Cisco’s 2026 benchmark confirms that budgets are still rising as AI expands data-governance
              and

              privacy obligations. On the security side, DSPM adoption, multicloud sprawl, and breach economics all
              support a

              durable demand backdrop.


              The constraints are just as important for underwriting. First, bundled DSPM inside CNAPP and broader
              cloud-

              security suites can make buyers reluctant to purchase a separate platform. Second, the category is still
              young:

              contradictory market estimates show that analysts do not agree on what revenue belongs to DSPM,
              governance, or AI

              governance. Third, BigID’s category breadth can slow deals because multiple stakeholders have to align
              before a

              platform purchase closes. Fourth, public evidence is still incomplete for privacy TAM, product-line
              revenue mix,

              and which buyer motion actually lands most efficiently in 2026.


              The net conclusion is constructive but not simplistic. BigID is pointed at real and growing budgets across
              DSPM,

              privacy, governance, and AI controls. But those budgets are overlapping, politically fragmented, and
              increasingly

              contested by large suites. Investors should underwrite market expansion alongside execution discipline:
              which wedge

              closes first, how quickly cross-sell follows, and whether BigID is winning because categories are
              converging or in

              spite of the confusion created by that convergence.
