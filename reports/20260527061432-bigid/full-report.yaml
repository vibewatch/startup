      - number: '8.4'
        title: Diligence Asks and Kill Triggers
        blocks:
          - type: paragraph
            body: >-
              The investment committee path from track to buy is not complicated, but it is evidence-heavy. First, BigID
              has to show current ARR, net retention, gross margin, burn, and cash consistent with at least a mid-band
              public-comp multiple. Without that, the secondary mark may simply be the correct clearing price. Second,
              the structure has to be knowable. SEC history proves BigID has raised through multiple private rounds, yet
              public documents do not show dilution, liquidation preferences, tender mechanics, or any debt-like
              overhang. That means headline valuation could diverge materially from the return a new or junior investor
              actually receives.


              Third, the company has to prove that execution quality is durable enough to carry a premium. The Tackle
              channel proof is encouraging, but review evidence, governance noise, and outside security monitoring show
              that BigID is not de-risked enough to underwrite on narrative alone. The thesis breaks if growth settles
              into mid-teens without clear retention strength, if the next financing clears below the current secondary
              range, if the cap table is stacked with senior paper, or if governance or product-quality problems start
              to affect renewals. Until diligence clears those points, the actionable posture is straightforward: keep
              BigID on the track / research-more list, work only from a sub-$550 million clean-entry case or a
              substantially improved diligence package, and treat the 2024 unicorn price as a ceiling rather than an
              anchor.
