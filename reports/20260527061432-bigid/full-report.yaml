      - number: '3.4'
        title: Moat Durability, Lock-In, and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              BigID's competitive moat rests on four pillars: (1) integration depth with bespoke connectors and scanning
              configurations built across hundreds of enterprise data sources over multi-year deployments; (2)
              regulatory workflow lock-in with DSAR automation, GDPR/CCPA/HIPAA reporting templates, and compliance
              calendars embedded in enterprise operations; (3) ML classifier tuning with custom classifiers and entity
              models developed in-deployment that represent accumulated institutional knowledge; and (4) FedRAMP
              certification (achieved March 2026), which creates a compliance moat in the US federal and
              regulated-government market. Switching costs are high for large enterprises: unwinding custom compliance
              workflows, re-integrating hundreds of data sources, and migrating trained models represents 6-18 months of
              engineering effort at scale. Multi-homing is common but asymmetric: enterprises often deploy BigID for
              privacy and compliance depth alongside Wiz or Cyera for cloud-native posture, meaning BigID is not always
              displaced but risks being relegated to a narrower compliance-only tool. Three structural threats challenge
              the moat: Cyera's rapid growth (from $1.4B valuation in April 2024 to $9B in January 2026) and Fortune 500
              penetration suggest buyers are choosing Cyera as their primary data security platform; Microsoft Purview's
              M365 E5 bundling means decision-makers increasingly ask "why not just use Purview?" for basic
              classification and compliance; and Google's Wiz acquisition creates a platform at scale that can serve
              DSPM and cloud security together.
