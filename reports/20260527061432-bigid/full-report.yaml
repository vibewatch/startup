      - number: '5.2'
        title: Module and SKU Architecture
        blocks:
          - type: paragraph
            body: >-
              BigID Next is organized as a modular, app-driven platform where customers buy capability modules on top of
              a core discovery-classification foundation. The platform does not publicly disclose per-module list prices
              or standard seat pricing; instead, enterprise contracts are negotiated based on data source count, data
              volume, deployed modules, and service/support scope. Core capability groupings—each representing a
              distinct deployable SKU or app—include: Data Discovery and Classification (the foundational engine), Data
              Security Posture Management (DSPM), Cloud DLP and DLP Prism, Data Access Governance, Privacy Management
              (DSR automation, cookie/consent, preference portals), Data Retention and Deletion, AI Governance and AI
              TRiSM (AI Security Posture Management, AI Risk Assessment, AI Data Trust), and Data Lifecycle Management.
              A modular app framework allows on-demand module integration to ensure future-proofed investments and
              streamlined cross-app experiences.

              The classification layer is the foundation on which all other modules depend: without knowing what data
              exists, access governance, retention, and AI risk controls have no signal to act on. BigID markets over
              1,500 pre-trained classifiers covering PII, PHI, PCI, credentials, secrets, intellectual property, and
              document types across more than 100 languages. Each module publishes a dedicated product page and can be
              purchased independently, though BigID's expansion economics favor buying the DSPM foundation first and
              adding privacy, access, and AI modules over time.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
