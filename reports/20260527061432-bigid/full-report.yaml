            title: Absence of Public Status Page and SLA Disclosure Limits Reliability Diligence
            body: >-
              BigID does not publish a public operational status page, uptime SLA, or historical incident disclosure.
              For enterprise buyers in regulated industries, this gap makes independent reliability verification
              impossible. The enterprise trust expectation is increasingly for public transparency on uptime; BigID's
              opacity here is a moderate diligence gap compared to peers like Microsoft Purview or AWS Macie that
              publish service health dashboards.
            calloutType: risk
            claimRefs:
              - CE048
          - type: callout
            title: Identity-Aware Discovery Is the Architectural Moat
            body: >-
              BigID's patented identity correlation—linking data findings to specific individuals across disparate
              systems—is the single hardest capability for competitors to replicate quickly. This moat compounds over
              time: each new enterprise deployment enriches BigID's identity graph accuracy. The identity layer is what
              powers automated DSAR fulfillment at scale, and it connects directly to the AI governance use case
              (knowing whose data an LLM trained on). This architectural bet is the clearest long-term IP
              differentiator.
