      - number: '1.3'
        title: Funding History and Investor Base
        blocks:
          - type: paragraph
            body: >-
              BigID has raised approximately $320 million across six disclosed rounds since its Series A in January
              2018. The Series A ($14M, January 2018) brought in SAP.io Fund, Comcast Ventures, ClearSky, and Boldstart
              Ventures. The Series B ($30M, June 2018) was led by Scale Venture Partners with participation from
              existing investors. The Series C ($50M, September 2019) was led by Bessemer Venture Partners with
              Salesforce Ventures joining as a strategic investor. The Series D ($70M, December 2020) was co-led by
              Tiger Global and Salesforce Ventures and established BigID's unicorn valuation at $1.25 billion. Advent
              International extended the Series D with an additional $30M in April 2021. The most recent financing was a
              $60M growth round in March 2024, led by Riverwood Capital with participation from Silver Lake Waterman and
              Advent International, maintaining a valuation in excess of $1 billion. Secondary market data from Forge
              implies a market-driven valuation closer to $530M as of 2025–2026, suggesting some compression from the
              peak $1.25B VC-round valuation—a divergence that prospective investors should scrutinize. The investor
              base spans strategic enterprise software investors (Salesforce Ventures, SAP.io), growth-stage specialists
              (Tiger Global, Silver Lake Waterman, Riverwood Capital), and early-stage specialists (Boldstart,
              Bessemer). There is no publicly available information on debt financing, secondary transactions involving
              founders, or credit facilities.
