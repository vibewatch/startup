      - number: '1.2'
        title: Leadership, Founders, and Governance
        blocks:
          - type: paragraph
            body: >-
              BigID was co-founded by Dimitri Sirota and Nimrod Vax, both veterans of CA Technologies—a pedigree that
              provided direct domain expertise in enterprise security and identity software. Sirota, who serves as CEO,
              previously co-founded eTunnels and Layer 7 Technologies and held roles at CA Technologies, bringing three
              prior enterprise security company experiences to BigID's founding. Vax, the technical co-founder,
              previously worked at Business Layers, Netegrity, and CA Technologies, focusing on identity and access
              management—directly relevant to BigID's identity-aware data discovery approach. The executive team as of
              2026 includes Avi Aronovitz (CFO), Marc DeGaetano (CRO; previously at Symantec, Tanium, and Rubrik), and
              Sarah Hospelhorn (previously at Varonis and MakerBot). The board and advisory structure reflects a mix of
              strategic investors and domain experts: Alex Ferrara (Bessemer Venture Partners), Ed Sim (Boldstart
              Ventures), Ariel Tseitlin (Scale Venture Partners), Jay Leek (SYN Ventures), Gil Beyda (Genacast
              Ventures), and Sigal Zarmi (Morgan Stanley background). The concentration of executive authority in CEO
              Sirota—who is the public face, primary spokesperson, and strategic driver—represents key-person
              dependency. There are no publicly disclosed material leadership changes beyond the Maxwell adverse event
              (see milestones). Complete board composition including post-2024-round appointees is not fully public,
              representing a governance transparency gap for prospective investors.
