      - number: '5.3'
        title: Technical Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              BigID's classification engine combines multiple AI techniques: regular expression matching, NLP (natural
              language processing), NER (named entity recognition), deep learning, and graph-based analysis for
              relationship discovery. The platform applies fuzzy classification to identify similar, duplicate, and
              redundant data, and uses graph-based analysis to surface relationships between disparate sensitive data
              points across systems. Pattern-based discovery is layered with ML classification and context-aware
              enrichment—adding data lineage, access permissions, and identity context on top of raw classification
              labels to produce actionable risk signals rather than static tags.

              BigID's patented identity-aware discovery technology is the core architectural differentiator: the engine
              correlates data findings back to specific individuals (data subjects) across disparate systems, including
              vector databases and AI training sets, enabling automated DSARs and identity-centric access governance.
              The platform is deployed on Kubernetes-based microservices architecture, enabling horizontal scaling
              across pods for concurrent scanning workloads. Forrester's Q2 2026 evaluation independently validated the
              platform as "engineered for performance and petabyte scale," with "impressive strengths in discovery
              across both cloud and on-premises data sources (including mainframe environments)." BigID holds multiple
              issued patents covering ML-based personal information discovery (US11531931, US11295034), dynamic document
              clustering for classification (US11243990), and identity correlation systems and methods. The platform
              uses LLMs as a classification and query layer—AskBigID GPT allows natural language queries against the
              full data posture—and supports MCP (Model Context Protocol) for external LLM integration via ChatGPT,
              Claude, and similar systems.
