  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, regulatory, and contractual risk is driven more by execution burden than by a visible public case today
        blocks:
          - type: paragraph
            body: >-
              Public sources do not show a smoking-gun BigID enforcement action, but they do show a company whose
              product and contract surface is tightly coupled to privacy, AI, uptime, and policy execution. BigID’s
              legal-resources page exposes an unusually broad stack for a private software vendor: support policy,
              hosted SLA, DPA, privacy notice, anti-bribery policy, ESG policy, code of conduct, and responsible-AI
              materials. That is a positive sign of maturity, yet it also expands the number of promises that can fail
              in production or during an audit. The DPA defines security incidents to include breaches affecting BigID
              or its subprocessors, while the hosted SLA commits only to 99.5% monthly uptime and makes service credits
              ticket-driven. The compliance burden also gets harder in 2026. BigID actively markets consent,
              cross-border transfer intelligence, privacy portals, and AI-governance workflows, and the EU AI Act
              becomes broadly applicable on 2 August 2026 with explicit obligations for high-risk systems. The net legal
              read is therefore not “public lawsuit already found,” but “high operating-commitment density with real
              downside if product delivery lags the promise set.”
