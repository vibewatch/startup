  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              BigID's last true price-setting event is still the March 2024 growth round. Company-linked and independent
              coverage line up on the basics: the company raised $60 million from Riverwood Capital, Silver Lake
              Waterman, and Advent; it said total capital reached $320 million; and management framed the round at more
              than $1 billion in valuation with almost $100 million of recurring revenue. That created a superficially
              respectable low-double-digit ARR multiple for a late-stage private software company, but it also froze
              valuation around a period when private-market software marks were still benefiting from optimism around AI
              and platform expansion.


              The fresher signal is the May 26, 2026 Yahoo / Forge private-market page, which showed BigID at $1.93 per
              share and an estimated valuation of $531.53 million. Against Latka's $139.5 million 2024 revenue estimate,
              that works out to only about 3.8x revenue and implies a roughly 46.8% discount to a $1 billion floor. That
              gap does not mean the lower mark is automatically wrong or automatically cheap. It does mean that current
              public evidence supports two very different price zones: a stale unicorn round that now looks hard to
              defend and a model-derived secondary mark that could be sensible if revenue quality and structure check
              out. The caution is that Yahoo's same page also shows an inconsistent $1.22 billion total-raised field,
              while the SEC history reveals Form D activity but not the preference stack or diluted share count. That is
              why valuation discipline matters more than headline-brand enthusiasm.
