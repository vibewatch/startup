  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              BigID’s market is best understood as a convergence zone, not a single clean analyst category. The
              company’s own

              surfaces span DSPM, broader data security, privacy management, data governance, and AI security. That
              matters

              because each category has a different buyer, a different budget owner, and a different substitute set. In
              BigID’s

              framing, the common denominator is not “all data software,” but software that discovers sensitive data,
              maps it to

              identities and use cases, and then enforces or automates control actions around risk, privacy, compliance,
              and AI.


              Included spend should therefore center on data-centric discovery and classification, exposure assessment,

              remediation workflows, privacy rights and deletion automation, governance controls tied to policy and
              stewardship,

              and AI-governance functions such as inventory, runtime monitoring, and evidence collection. Excluded spend
              should

              include generic CSPM and infrastructure posture products that stop at cloud configuration, network and
              endpoint

              tooling with no data-level context, consulting-only privacy services, and broad data-discovery or BI
              tooling that

              does not become an operational control layer. Those excluded categories still matter because buyers may
              compare

              them during procurement, but they are not the same spend pool as BigID’s direct wedge.


              The substitute set is fragmented. Security buyers can default to bundled DSPM inside CNAPP or large
              data-security

              suites. Privacy teams can keep running manual questionnaires, legal workflows, and rights-request tools.
              Data

              offices can stay with catalog-first governance platforms. AI-governance teams can try to extend GRC or
              policy-only

              processes. BigID’s opportunity is that these motions are converging; its risk is that no single incumbent
              has to be

              displaced in every deal, which can lengthen procurement and blur the denominator used for market sizing.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
