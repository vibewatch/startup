      - number: '4.4'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              The constructive case on BigID is straightforward. Revenue quality looks better than many growth-stage

              software companies because the product sits in compliance and data-security workflows that tend to be
              sticky,

              enterprise-wide, and expandable across modules. The company also appears to be improving channel
              efficiency

              through marketplaces and partner-led procurement motions, which is meaningful in large-enterprise
              software.

              Official product cadence in retention/deletion and unified privacy management suggests there are still new

              attachable SKUs to sell into the installed base rather than only a single discovery product.


              The financial risks are equally clear. Peer review evidence shows the product is premium-priced and not
              free

              of delivery friction: reviewers mention UI issues, intermittent scan errors, and the need for deployment

              flexibility. More importantly, the core underwriting metrics remain absent. There is no public gross
              margin,

              no CAC or payback, no NRR, no services-versus-subscription split, no cash balance, and no authoritative

              customer-count disclosure. Compared with Varonis — a public data-security software benchmark that now runs
              at

              roughly $660 million of revenue and about 78% gross margin — BigID is still subscale and materially less

              transparent. The net verdict is positive on revenue model quality and product monetization breadth, but
              only

              medium confidence on the margin path and capital dependency because the most important unit-economics
              inputs

              are still private and the secondary-market reset shows investors are no longer willing to pay 2024-style

              private-round multiples without more proof.
