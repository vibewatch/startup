  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              BigID operates at the intersection of three adjacent markets: data security posture management (DSPM),
              privacy management and compliance automation, and data governance. Each market has its own dominant
              incumbents and well-funded challengers. Direct DSPM peers include Cyera (the fastest-growing standalone)
              and Varonis (the largest-scale public peer). Privacy management incumbents OneTrust (~$500M ARR) and
              Securiti (acquired by Veeam in 2025) compete on the compliance and consent side. Data-governance
              substitutes are also scaled: Collibra's last disclosed funding round valued it at $5.25B and cited 500+
              global enterprises, while Alation's last disclosed financing valued it above $1.7B after surpassing $100M
              ARR. Microsoft Purview and Informatica remain the most common incumbent governance alternatives in
              Microsoft-centric and legacy-enterprise environments. Rubrik widens the field from cyber resilience into
              adjacent data security with public-company scale, while AWS Macie creates a cheap cloud-native substitute
              for narrow S3-only discovery and classification jobs. BigID therefore has to defend its multi-use-case
              platform breadth against both narrow specialists and cheaper or bundled substitutes.
