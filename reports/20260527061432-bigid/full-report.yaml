  - id: FE001
    title: BigID Next — Product Architecture Stack
    type: stack
    layout: wide
    summary: >-
      BigID Next is layered from data source connectors at the base through classification and enrichment, risk and
      governance logic, to action and integration endpoints at the top.
    data:
      layers:
        - id: l1
          label: Data Source Connector Layer
          detail: >-
            Hundreds of pre-built connectors spanning relational databases, object stores, SaaS apps, NoSQL, messaging,
            and AI pipelines. Custom Connector SDK available for unsupported sources.
        - id: l2
          label: Scanning and Ingestion Engine
          detail: >-
            Kubernetes-deployed microservices ingest data via read-only connections. Scan modes include full scan,
            prioritized sensitive-first, metadata-only, and snapshot (no persistent access).
        - id: l3
          label: Classification and Enrichment Layer
          detail: >-
            1,500+ classifiers combining regex, NLP, NER, deep learning, fuzzy matching, and graph analysis. ML models
            are customer-tunable. Identity correlation links findings to data subjects.
        - id: l4
          label: Risk, Access, and Governance Logic
          detail: >-
            DSPM risk scoring, access privilege analysis (human and AI identities), retention policy engine, AI TRiSM
            risk assessment. Prioritizes alerts by sensitivity, exposure, and context.
        - id: l5
          label: Action and Automation Layer
          detail: >-
            Agentic remediation (delete, revoke, quarantine, retain natively). DSR automation. Workflow delegation.
            Policy enforcement. Audit trail generation. DLP enforcement via DLP Prism.
        - id: l6
          label: Integration and API Surface
          detail: >-
            REST API, Apps framework, MCP/LLM integration (AskBigID GPT, Claude, ChatGPT), Webhooks. Metadata exchange
            to SIEM, SOAR, DLP, IAM, data catalog tools for autonomous workflow triggering.
    approximationNotes: null
    claimRefs:
