      - number: '5.4'
        title: Deployment, Integration, Reliability, and Support
        blocks:
          - type: paragraph
            body: >-
              BigID Next offers four deployment models: multi-tenant cloud (cost-efficient, shared infrastructure
              managed by BigID), single-tenant cloud (dedicated instance for heightened security isolation), hybrid
              cloud (split between on-premises data handling and cloud-based control plane), and secure cloud snapshot
              scans (rapid risk assessment without full data migration or persistent connectivity). This deployment
              flexibility is described by BigID as the "most industry-versatile cloud deployment options" and is a
              stated competitive differentiator against legacy DSPM tools. The platform is available via AWS Marketplace
              in the AI Agents and Tools category as of 2025, enabling procurement through existing AWS accounts and
              streamlining enterprise procurement.

              The integration surface is extensive: BigID supports hundreds of data source connectors spanning
              relational databases (SQL Server, Oracle, PostgreSQL, MySQL, Snowflake, Redshift), unstructured stores
              (S3, Azure Blob, Google Cloud Storage, SharePoint, Box, Google Drive), NoSQL databases (MongoDB,
              Cassandra, DynamoDB, Elasticsearch), SaaS applications (Salesforce, ServiceNow, Slack, Teams, SAP), big
              data platforms (Databricks, Hive, BigQuery), and messaging systems. Third-party documentation—such as
              Nasuni's integration guide—shows that BigID connects to NDS volumes via API in read-only mode,
              illustrating a pattern of zero-copy scanning across partner storage platforms. The developer portal
              (developer.bigid.com) provides REST API for programmatic management, an Apps framework for custom logic
              and external governance tool connections, a Connector SDK for unsupported data sources, and MCP/LLM
              integration for AI-native interactions. There is no public API explorer, sandbox, or free developer tier
              as of May 2026. Support is provided through BigID's BigID Concierge service and standard enterprise
              support tiers; user reviews note that post-sale support quality is inconsistent compared to the pre-sale
              experience.
            claimRefs:
              - CE021
