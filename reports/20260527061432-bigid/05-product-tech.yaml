  - id: roadmap-ai-initiatives
    title: Roadmap and AI-Era Initiatives
    body: >-
      BigID's roadmap is anchored on the autonomous governance engine concept: a platform that
      continuously discovers, classifies, enriches, and enforces data policy without requiring
      human review at every step. The major milestones from 2025–2026 include: BigID Next launch
      (February 2025) as the foundational cloud-native modular platform; AI TRiSM introduction
      (2025) adding unified AI risk, trust, and security posture controls; AWS Marketplace listing
      in the AI Agents and Tools category (2025); FedRAMP authorization (March 2026); and four
      new capabilities announced at RSA Conference 2026 (April 2026)—DLP Prism (AI-powered,
      context-aware DLP), AskBigID GPT (natural language data posture queries), Agentic Access
      Governance (visibility and control over AI agent data access), and Integrated Employee AI
      Governance (monitoring sensitive data in employee AI tool usage).

      Forrester gave BigID perfect scores in the Innovation and Roadmap strategy criteria—together
      accounting for 45% of the total Wave score—describing the platform as having "a solid vision
      of an autonomous governance engine" with "an excellent innovation strategy and well-defined
      roadmap of planned enhancements." Near-term roadmap focus areas based on public evidence
      include: deeper agentic workflow support for enterprises adopting autonomous AI agents;
      further expansion of AI agent access governance (non-human identities and machine clients);
      deeper hyperscaler integrations for streamlined cloud-native DSPM; and continuous compliance
      enhancements tracking new global privacy and AI regulations. The Markdown file scanning
      support added in 2026 (relevant to vibe coding and AI-generated documentation) signals
      responsiveness to developer-era data surface expansion.
    claimRefs:
      - CE040
      - CE041
      - CE042
      - CE043
      - CE044
    tableRefs:
      - TE005

