chapter:
  number: 5
  title: Product & Technology
  summary: >-
    BigID Next is a cloud-native, AI-powered, modular data security and governance platform
    launched in February 2025 that unifies data discovery/classification (1,500+ ML classifiers),
    DSPM, privacy management, access governance, data retention/deletion, and AI governance/AI TRiSM
    under a single Kubernetes-deployable architecture spanning cloud, SaaS, on-prem, and hybrid
    environments. FedRAMP authorization achieved in March 2026, and a Forrester Wave Q2 2026 Leader
    designation with the highest current-offering score among all evaluated vendors confirm platform
    maturity, though user reviews consistently flag high price, configuration complexity, and false
    positives as adoption friction.
sections:
  - id: product-definition-scope
    title: Product Definition and Workflow Scope
    body: >-
      BigID operates between an enterprise's distributed data estate—spanning cloud object stores,
      relational databases, SaaS applications, data lakes, on-premises file shares, and AI model
      pipelines—and the security, privacy, compliance, and AI governance decisions that depend on
      knowing what that data contains and who it belongs to. The core customer problem BigID solves
      is enterprise data blindness: organizations cannot manage risk in data they cannot see. BigID's
      answer is an automated discovery-then-action loop: scan data sources at petabyte scale,
      classify findings with ML and identity intelligence, enrich results with access and risk
      context, and then enable concrete action—deletion, access revocation, DSR fulfillment,
      retention enforcement, or AI pipeline governance.

      In workflow terms, a CISO team uses BigID to discover and prioritize sensitive data risk without
      manual sampling; a privacy team uses it to automate GDPR/CCPA data subject requests across
      hundreds of connected sources; a compliance team uses it to generate audit evidence aligned to
      HIPAA, PCI DSS, and NIST 800-53; and an AI program team uses it to validate that LLM training
      data is clean of PII, secrets, or toxic data before model ingestion. BigID Next, launched in
      February 2025, packages all of these workflows into a single modular platform replacing the
      need to run separate DSPM, DLP, privacy management, data catalog, and AI governance point tools.
      The platform is marketed as the industry's first cloud-native, AI-powered Data Security Platform
      (DSP) addressing the entirety of data risk across security, compliance, and AI.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
    tableRefs:
      - TE002
    figureRefs:
      - FE002

  - id: modules-sku-architecture
    title: Module and SKU Architecture
    body: >-
      BigID Next is organized as a modular, app-driven platform where customers buy capability
      modules on top of a core discovery-classification foundation. The platform does not publicly
      disclose per-module list prices or standard seat pricing; instead, enterprise contracts are
      negotiated based on data source count, data volume, deployed modules, and service/support scope.
      Core capability groupings—each representing a distinct deployable SKU or app—include: Data
      Discovery and Classification (the foundational engine), Data Security Posture Management
      (DSPM), Cloud DLP and DLP Prism, Data Access Governance, Privacy Management (DSR automation,
      cookie/consent, preference portals), Data Retention and Deletion, AI Governance and AI TRiSM
      (AI Security Posture Management, AI Risk Assessment, AI Data Trust), and Data Lifecycle
      Management. A modular app framework allows on-demand module integration to ensure future-proofed
      investments and streamlined cross-app experiences.

      The classification layer is the foundation on which all other modules depend: without knowing
      what data exists, access governance, retention, and AI risk controls have no signal to act on.
      BigID markets over 1,500 pre-trained classifiers covering PII, PHI, PCI, credentials, secrets,
      intellectual property, and document types across more than 100 languages. Each module publishes
      a dedicated product page and can be purchased independently, though BigID's expansion economics
      favor buying the DSPM foundation first and adding privacy, access, and AI modules over time.
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE009
