      - FE003

  - id: differentiation-ip
    title: Differentiation, IP, and Data Moat
    body: >-
      BigID's primary technical differentiators are identity-aware discovery (patented), the scale
      and breadth of its classifier library (1,500+), and its multi-technique classification engine
      combining regex, ML, NLP, and graph analysis. The Intuit Challenge benchmark—a competitive
      classification accuracy test—is cited by BigID as evidence of "proven accuracy" against
      legacy and emerging competitors. Forrester's Q2 2026 independent evaluation placed BigID as a
      Leader with the highest current-offering score, receiving perfect scores in cloud and on-premises
      data source coverage, enrichment for classification, language support, classifier tuning,
      integrations, and secure-by-design commitments. Forrester described BigID as "engineered for
      performance and petabyte scale" with "a solid vision of an autonomous governance engine."

      BigID's IP portfolio includes issued US patents on ML-based personal information discovery
      confidence scoring (US11531931), privacy management platform architecture (US11295034), and
      dynamic document clustering (US11243990). The identity correlation layer—which links data
      findings to real individuals across disparate enterprise systems—is a patented capability
      that competitors typically must replicate without the same filing history. BigID's data moat
      is built on the breadth of connectors (hundreds of sources), the depth of classifier tuning
      accumulated across enterprise deployments, and the network of integrations that embed BigID's
      classification metadata into SIEM, SOAR, DLP, IAM, and data catalog tools. BigID's vision
      of an "autonomous governance engine"—one that continuously discovers, classifies, and enforces
      policy without requiring a human in every loop—represents the strategic direction of the platform.
    claimRefs:
      - CE027
      - CE028
      - CE029
      - CE030
      - CE031
      - CE032
    figureRefs:
      - FE004

  - id: trust-security-compliance
    title: Trust, Security, Privacy, and Compliance Controls
    body: >-
      BigID holds SOC 2 Type II and ISO 27001:2013 certifications, confirming its information
      security management system and operational security controls have been independently audited.
      In March 2026, BigID achieved FedRAMP authorization in partnership with Knox Systems, the
      largest federal AI-managed cloud provider, enabling U.S. federal agencies to use BigID's
      platform under rigorous federal security standards. This authorization covers discovery and
      classification of CUI, PII, and PHI across federal cloud and on-premises environments,
      alignment to Zero Trust Architecture mandates, and compliance with NIST SP 800-53, CMMC,
      FISMA, and EO 14028. The federal page lists specific certifications—CJIS, IRS 1075, HIPAA,
      OMB mandates—and touts full audit trails and automated evidence collection.

      Privacy controls within the platform include automated DSR (Data Subject Request) fulfillment
      across connected data sources, cookie/consent management, preference portals, and policy-driven
      data minimization. BigID's secure-by-design commitment received a perfect Forrester score.
      The platform supports GDPR, CCPA/CPRA, HIPAA, PCI DSS, ITAR, and emerging AI regulations
      including the EU AI Act and NIST AI RMF. For AI-specific governance, BigID's AI TRiSM
      module—introduced in 2025—adds AI Security Posture Management (detecting unauthorized GenAI
      use and prompt injection), AI Risk Assessment (quantifying exposure across infrastructure,
      data, usage, and vendors), and AI Data Trust (validating training and inference data integrity).
      A notable gap: BigID does not publicly publish a security status page or incident disclosure
      history, making it difficult to independently verify operational reliability SLAs from external
      sources.
    claimRefs:
