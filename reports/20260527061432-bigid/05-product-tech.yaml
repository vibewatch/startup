callouts:
  - calloutType: strength
    title: Forrester Wave Leader with Highest Current Offering Score
    body: >-
      In The Forrester Wave™: Sensitive Data Discovery And Classification Solutions, Q2 2026,
      BigID was named a Leader and received the highest current offering score among all ten
      evaluated vendors—with perfect scores in eleven criteria spanning cloud/on-prem coverage,
      enrichment, integrations, language support, tuning, secure-by-design, innovation, roadmap,
      partner ecosystem, and adoption. Forrester specifically described BigID as "engineered for
      performance and petabyte scale" and a "compelling choice for multinationals, large
      organizations, and government entities."
    claimRefs:
      - CE027
      - CE028
      - CE029

  - calloutType: strength
    title: FedRAMP Authorization Opens Federal Market
    body: >-
      BigID's FedRAMP authorization (March 2026) via Knox Systems represents a meaningful
      moat in the federal and regulated-sector market. Federal agencies can now deploy BigID for
      CUI, PII, and PHI discovery under the highest federal security standards—a
      procurement barrier that competitors without FedRAMP authorization cannot easily overcome.
    claimRefs:
      - CE035
      - CE036

  - calloutType: risk
    title: Configuration Complexity, False Positives, and Premium Pricing Constrain Adoption
    body: >-
      PeerSpot and G2 user reviews consistently identify three structural friction points:
      (1) configuration of multi-database connections is reported as challenging; (2) false
      positives in scan output create noise that requires dedicated analyst time to triage;
      (3) pricing is positioned as premium and explicitly unfavorable for SMB or resource-constrained
      teams. These issues are not product-breaking for large enterprises, but they create real
      competitive surface for lower-friction DSPM entrants and constrain downmarket expansion.
    claimRefs:
      - CE045
      - CE046
      - CE047

  - calloutType: risk
    title: Absence of Public Status Page and SLA Disclosure Limits Reliability Diligence
    body: >-
      BigID does not publish a public operational status page, uptime SLA, or historical incident
      disclosure. For enterprise buyers in regulated industries, this gap makes independent
      reliability verification impossible. The enterprise trust expectation is increasingly for
      public transparency on uptime; BigID's opacity here is a moderate diligence gap compared
      to peers like Microsoft Purview or AWS Macie that publish service health dashboards.
    claimRefs:
      - CE048

  - calloutType: insight
    title: Identity-Aware Discovery Is the Architectural Moat
    body: >-
      BigID's patented identity correlation—linking data findings to specific individuals across
      disparate systems—is the single hardest capability for competitors to replicate quickly. This
      moat compounds over time: each new enterprise deployment enriches BigID's identity graph
      accuracy. The identity layer is what powers automated DSAR fulfillment at scale, and it
      connects directly to the AI governance use case (knowing whose data an LLM trained on).
      This architectural bet is the clearest long-term IP differentiator.
    claimRefs:
      - CE014
      - CE015
      - CE031

