  - id: TE003
    title: Technology / Operating Architecture
    columns:
      - Layer / Component
      - Role
      - Technology / Dependency
      - Risk
    rows:
      - - Data Connector Layer
        - Connects to 100s of data sources across cloud, SaaS, on-prem
        - Pre-built connectors (REST, JDBC, cloud APIs); custom Connector SDK
        - Connector maintenance burden grows with source sprawl; unsupported sources require custom builds
      - - Classification Engine
        - Core ML-based identification and tagging of sensitive data
        - Regex, NLP, NER, deep learning, graph-based analysis; 1,500+ classifiers
        - False positive rates reported by users; tuning required for enterprise accuracy
      - - Identity Correlation Layer
        - Correlates data findings to individuals across disparate systems
        - Patented identity graph linking PII across structured and unstructured sources
        - Correlation accuracy degrades when identity attributes are inconsistent across systems
      - - DSPM Risk Engine
        - Prioritizes risk signals; triggers remediation workflows
        - ML-based risk scoring; agentic orchestration for deletion, revocation, quarantine
        - Agentic remediation at scale requires careful policy guardrails
      - - Deployment Runtime
        - Hosts and scales platform workloads
        - Kubernetes microservices; 4 cloud deployment models (multi-tenant/single-tenant/hybrid/snapshot)
        - On-prem/self-managed Kubernetes deployments require customer ops expertise; SLA not public
      - - Developer / Integration API
        - Enables programmatic access, custom apps, and external governance integrations
        - REST API; Apps framework; MCP for LLM integration; Webhooks
        - No public sandbox or free developer tier; API docs gated to customers
      - - AI Governance Layer (AI TRiSM)
        - Governs AI model risk, data trust, and unauthorized AI usage
        - AI SPM, AI Risk Assessment, AI Data Trust modules
        - Coverage of proprietary air-gapped models and fully on-prem AI pipelines unverified
    notes: >-
      Architecture details synthesized from BigID product pages, developer portal, Forrester Wave
