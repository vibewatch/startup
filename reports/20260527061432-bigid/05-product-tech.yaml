  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: accuracy-benchmark
      missingEvidence: >-
        Independent third-party benchmark of BigID's classification accuracy, false positive rates,
        and scan throughput at petabyte scale across diverse enterprise data environments.
      whyItMatters: >-
        BigID claims Forrester-validated petabyte-scale performance and Intuit Challenge accuracy
        leadership, but no publicly accessible independent benchmark with reproducible methodology
        exists. Buyers cannot objectively compare classification accuracy without vendor-controlled
        data.
      diligencePath: >-
        Request a controlled PoC with BigID against a representative enterprise data sample using
        defined ground-truth labels; compare false positive and false negative rates against at
        least one competitor (e.g., Varonis, Cyera).
      relatedQuestionRefs: [QE025]
    - type: missing-source
      severity: material
      topic: reliability-transparency
      missingEvidence: >-
        Public status page, historical uptime metrics, or SLA disclosure for BigID's SaaS
        multi-tenant and single-tenant deployment models.
      whyItMatters: >-
        Enterprise buyers in regulated industries require SLA-backed uptime guarantees.
        Absence of any public operational transparency is a differentiator disadvantage vs.
        cloud-native competitors with published 99.9%+ availability guarantees.
      diligencePath: >-
        Request from BigID: current SLA terms, historical uptime reports, and incident
        postmortem records. Check whether Knox Systems publishes FedRAMP-specific availability SLAs.
      relatedQuestionRefs: []
    - type: private-evidence-only
      severity: minor
      topic: developer-surface
      missingEvidence: >-
        Public GitHub activity metrics for the bigid-oss organization (stars, contributor count,
        recent commits) to assess developer community engagement and open-source health.
      whyItMatters: >-
        Developer-signal assessment is limited because bigid-oss returned a 404 at access time,
        and the developer portal does not expose community engagement metrics publicly.
      diligencePath: >-
        Attempt direct bigid-oss GitHub access at a later date, or request from BigID their
        developer ecosystem metrics (API call volume, active integration partners, connector
        download counts).
      relatedQuestionRefs: []

