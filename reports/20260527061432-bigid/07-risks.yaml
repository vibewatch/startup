  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: litigation-visibility
    missingEvidence: Counsel-confirmed docket search and representation letter covering threatened claims, disputes, and regulatory inquiries.
    whyItMatters: Open-web and SEC visibility do not fully clear private legal risk or customer-specific disputes.
    diligencePath: Request outside-counsel memo, claims schedule, and notice-of-dispute log.
    relatedQuestionRefs:
    - QR002
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: channel-concentration
    missingEvidence: Revenue mix by AWS marketplace, federal channels, and direct sales, plus top-partner dependency metrics.
    whyItMatters: Marketplace growth is visible, but concentration is not; that makes GTM durability hard to underwrite.
    diligencePath: Request channel revenue bridge, win-rate split by route to market, and partner-renewal terms.
    relatedQuestionRefs:
    - QR015
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure-gap
    missingEvidence: Board committee structure, director independence detail, succession plans, and internal-audit / whistleblower reporting.
    whyItMatters: Published policies mitigate risk, but they do not prove governance process quality or bench resilience.
    diligencePath: Request board deck index, committee charters, org chart, and succession materials.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: blocking
    topic: financial-opacity
    missingEvidence: Audited P&L, cash balance, debt, burn, gross margin, and covenant detail.
    whyItMatters: Without cash and margin visibility, investors cannot bound financing risk or downside resilience after the valuation reset.
    diligencePath: Request audited financials, board-approved budget, and monthly cash-burn bridge.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR005
  - type: missing-source
    severity: material
    topic: module-level-reliability
    missingEvidence: Historical uptime by module, incident frequency, support backlog, and scan-failure rates segmented by cloud vs on-prem deployments.
    whyItMatters: A single status-page incident and review complaints are enough to establish risk, but not enough to size it.
    diligencePath: Request reliability dashboards, support SLA attainment, and release-line patch cadence by environment.
    relatedTableRefs:
    - TR002
