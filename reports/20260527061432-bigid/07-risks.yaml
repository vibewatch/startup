- id: product-security-and-service-delivery-risk
  title: Product, security, and service-delivery risk is visible in the public record
  body: 'The strongest adverse evidence in the reviewed pack is operational, not strategic. BigID’s own security-bulletin page documents repeated investigation and remediation work across identity, database, logging, and supply-chain issues, including a 2025 SAMLStorm response that required cloud patches and multiple on-prem release upgrades. The May 19, 2026 status-page incident is even more concrete: some Privacy Portal tenants temporarily lost UI access, even if backend request handling stayed up. Review sources reinforce the same picture. AWS Marketplace evidence shows customers building custom connectors when native support is missing and still reporting intermittent scan errors. PeerSpot adds complaints about file export workarounds, catalog navigation, deployment flexibility, data-connection configuration, and premium pricing. SoftwareReviews is not disastrous, but its public metrics also read as middling rather than world-class. Trust Center and Microsoft certification disclosures
    show that BigID has real controls and real infrastructure discipline; they do not erase the fact that delivery quality still appears variable in public evidence. For a platform selling compliance outcomes, that gap matters more than it would for a lower-consequence workflow tool.'
