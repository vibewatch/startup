callouts:
- calloutType: risk
  title: The cleanest public red flag is the valuation reset, not a known enforcement action
  body: BigID’s public downside is currently easier to prove through 2026 secondary pricing, channel concentration, and product-friction evidence than through a named public lawsuit. That still matters because it narrows financing flexibility while the company is broadening both product scope and compliance promises.
  claimRefs:
  - CR023
  - CR024
  - CR025
  - CR042
  - CR046
- calloutType: recommendation
  title: Diligence should focus on execution proof where public sources are thinnest
  body: The next diligence pass should demand module-level reliability metrics, channel concentration by AWS and government procurement, board and succession materials, and full cash / burn / margin visibility. Those are the missing items most likely to change the risk rating materially.
  claimRefs:
  - CR027
  - CR040
  - CR042
  - CR046
