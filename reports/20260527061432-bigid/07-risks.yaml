- id: governance-mitigations-and-kill-criteria
  title: Governance and people risk is mitigated by published policies, but not fully underwritten publicly
  body: 'BigID does not look governance-light in a vacuum. The company publishes a code of conduct, anti-bribery policy, ESG policy, privacy notice, DPA, and other formal artifacts that many private peers never expose publicly. The code explicitly involves the board, legal affairs, and information security; the anti-bribery policy references FCPA and UK Bribery Act obligations; the ESG policy says the company promotes board independence and diversity. Those are meaningful mitigants, especially given BigID’s exposure to government procurement and regulated-enterprise buyers. The problem is that published policies are not the same thing as full underwriting transparency. Public sources still leave succession depth, committee structure, audited operating quality, concentration by channel, and financing resilience largely unaddressed. Founder and executive concentration also remains visible: the company page centers Dimitri Sirota and Nimrod Vax, while Craft surfaces only a modest public executive
    roster. Investors should therefore credit the existence of governance scaffolding while still treating people depth, board process, and financing durability as live diligence topics. The thesis should break quickly if valuation compression deepens, customer-facing reliability worsens, or channel concentration proves harder to diversify than current public evidence suggests.'
