- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Valuation compression / financing risk
    - Updated Forge or secondary-market marks, next round terms, and any disclosed burn data
    - Secondary implied valuation remains below $600M through the next financing window without offsetting cash or margin disclosure
    - Treat as financing red flag; tighten valuation assumptions and require stronger investor protections
  - - Reliability and product-quality slippage
    - Status-page incidents, review sentiment, support backlog, and scan-failure evidence
    - A second material customer-facing outage or persistent review evidence that scan-error and connector pain are worsening
    - Pause underwriting until module-level reliability and support KPIs are shared
  - - Channel concentration in AWS / marketplace motion
    - Marketplace mix, badge status, procurement win rates, and partner pipeline disclosure
    - Meaningful GTM deceleration after a marketplace-policy change or loss of AWS / partner standing
    - Re-rate growth quality and treat channel concentration as a primary thesis risk
  - - Hyperscaler competitive bundling
    - Win-loss commentary versus Purview, Macie, and Google-sensitive-data tooling
    - Material pricing concessions or attach-rate erosion in Microsoft/AWS-heavy accounts
    - Assume lower long-term gross margin and weaker moat
  - - Governance / key-person disruption
    - Founder departures, board changes, or inability to show succession and committee process
    - Founder departure or inability to produce credible succession, audit, and oversight materials in diligence
    - Escalate to board-risk issue and defer investment
  - - Compliance execution failure
    - AI Act readiness, DSAR / portal uptime, security-incident handling, and public-sector control evidence
    - Missed AI-governance readiness, repeated privacy-portal disruption, or inability to evidence DPA / subprocessor compliance controls
    - Treat as thesis break for regulated-customer expansion
  notes: Kill criteria are monitorable thresholds rather than generic worries; they are designed to convert the chapter’s public evidence into diligence-ready decision triggers.
