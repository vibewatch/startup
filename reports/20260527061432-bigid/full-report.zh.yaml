      - number: '8.3'
        title: 情景区间、可比信号与建议
        blocks:
          - type: paragraph
            body: >-
              近期私人和战略交易显示，数据安全仍有上行空间，但只留给能证明爆发势能或战略不可或缺性的 名字。Cyera 2025 年 6 月以 $6 billion 融资，2026 年 1 月跃升到 $9
              billion，说明投资者 会为 AI 原生数据安全叙事支付高价，但前提是当前增长观感强得多。Salesforce 以 $8 billion 收购 Informatica，以及 Windsor Drake
              引用的溢价 M&A 交易，进一步说明可信数据治理和 AI 控制资产仍具战略价值。关键差异在于，BigID 的公开证据基础目前没有显示 Cyera 式增长，也
              没有显示战略出售确定性，因此用收入倍数承保比用叙事承保更安全。


              基于这一点，悲观情景使用约 $140-$150 million 收入和 3x-4x 倍数，对应 $420-$600 million 价值。基准情景使用 $155-$170 million 收入和 4.5x-6x
              倍数，对应 $700 million-$1.02 billion。乐观情景使用 $180-$200 million 收入和 7x-8.5x 倍数，对应 $1.26-$1.70 billion。
              这些区间给出本章最清晰的建议规则：过时的 >$1 billion 新股估值偏紧，除非私人尽调显示异常 强的 NRR、毛利率和资本效率；2026 年 5 月的老股标记可以成立，但只有在尽调补上结构性缺口
              后才构成买入。在今天的证据水平下，正确动作是观察而不是买入：当前老股标记附近合理到有趣， 但还不足以支持激进部署资本。
