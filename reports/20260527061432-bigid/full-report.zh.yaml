      - number: '4.2'
        title: 收入牵引、渠道效率与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              最强的硬收入数据点来自公司自身：BigID 在 2024 年 3 月称已达到接近 $100M 的经常性收入。 第三方追踪器指向年末更高的总收入数字：Latka 估计 2024 年收入为 $139.5M，高于
              2023 年的 $105.1M；Sacra 则给出更低的 2023 年 $90M 估计，以及更早 2022 年约 $74M 的 ARR。 不同数字方向上一致：BigID
              早已越过种子期规模；但它们无法干净对账，不能当作一条权威口径。 可能问题在于指标混用：经常性收入、总收入，可能还有服务收入或不同更新时间，被不同追踪器混在一起。

              公开证据特别强的地方是渠道效率。 BigID 的 Tackle 案例研究称，公司把云市场 GTM 作为优先路径，FY23 市场相关收入增长 345%、FY24 增长 312%，成交率从 18% 提高到
              34%，交易注册时间从 5–10 分钟压到约 2 分钟。 指标属于渠道层面，不是公司整体单位经济，但仍高度相关：它们说明在采购繁重的企业销售中，GTM 机器正变得更高效。 客户评论证据进一步说明，产品通过减少手工
              DSAR 和发现工作可以创造真实 ROI；而粗略每员工收入约 $193,000 至 $279,000，意味着 BigID 具备生产力，但尚未达到一流上市安全软件的效率水平。 客户数量精度仍弱：公开来源从 116
              个客户到超过 265 家使用公司不等，区间太宽，无法有信心重建 ACV。
