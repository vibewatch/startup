  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 价格背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              BigID 上一次真正定价的事件仍是 2024 年 3 月成长轮。公司关联和独立报道在基本事实上对齐： 公司从 Riverwood Capital、Silver Lake Waterman 和 Advent 融得
              $60 million；公司称累计 融资达到 $320 million；管理层将该轮表述为估值超过 $1 billion、经常性收入接近 $100 million。
              对一家后期私人软件公司来说，这形成了表面上还算体面的低双位数 ARR 倍数，但也把估值冻结在 一个私人市场软件估值仍受 AI 和平台扩张乐观情绪支撑的时期。


              更新的信号是 2026 年 5 月 26 日 Yahoo / Forge 私人市场页面：BigID 每股 $1.93，估计估值 $531.53 million。对照 Latka 的 2024 年 $139.5
              million 收入估计，只相当于约 3.8x 收入， 也意味着相比 $1 billion 底线大约折价 46.8%。这个差距不代表较低标记一定错误，也不代表
              一定便宜。它说明当前公开证据支持两个差异很大的价格区间：一个是现在看起来难以防守的过时 独角兽轮，一个是如果收入质量和结构经核验后可能合理的模型推导老股标记。需要谨慎的是， Yahoo 同一页面还显示一个不一致的
              $1.22 billion 累计融资字段，而 SEC 历史显示 Form D 活动，却没有揭示优先股堆叠或稀释后股数。因此，估值纪律比头部品牌热情更重要。
