      - number: '1.2'
        title: 领导层、创始人与治理
        blocks:
          - type: paragraph
            body: >-
              BigID 由 Dimitri Sirota 和 Nimrod Vax 共同创立，两人都是 CA Technologies 老兵，这一背景直接带来了企业安全和身份软件的领域经验。 Sirota 担任
              CEO，此前共同创办 eTunnels 和 Layer 7 Technologies，并在 CA Technologies 任职，创办 BigID 前已有三段企业安全公司经历。 技术联合创始人 Vax 曾在
              Business Layers、Netegrity 和 CA Technologies 工作，重点是身份与访问管理，与 BigID 以身份感知驱动数据发现的方法直接相关。 截至 2026 年，高管团队包括 Avi
              Aronovitz（CFO）、Marc DeGaetano（CRO；此前在 Symantec、Tanium 和 Rubrik 任职）以及 Sarah Hospelhorn（此前在 Varonis 和
              MakerBot 任职）。 董事会和顾问结构混合了战略投资人和领域专家：Alex Ferrara（Bessemer Venture Partners）、Ed Sim（Boldstart
              Ventures）、Ariel Tseitlin（Scale Venture Partners）、Jay Leek（SYN Ventures）、Gil Beyda（Genacast Ventures）以及有
              Morgan Stanley 背景的 Sigal Zarmi。 CEO Sirota 集中了较多执行权力，他是公司的公开门面、主要发言人和战略驱动者，也带来关键人依赖。 除 Maxwell
              负面事件（见里程碑）外，公开资料没有披露重大领导层变动。 包括 2024 年融资后新任董事在内的完整董事会构成尚未完全公开，这是潜在投资人面前的治理透明度缺口。
