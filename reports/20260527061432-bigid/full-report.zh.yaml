      - number: '6.2'
        title: 具名证据最强的是两个公共部门部署；其他可见客户大多停留在 logo 层级
        blocks:
          - type: paragraph
            body: >-
              最好的公开客户证据不是普通 logo 墙。BigID 的 University of Maryland 案例研究描述了 跨 Google Drive、Office365 和 Box 的 2.5 PB
              云环境；该校称借助 BigID 找到了数万条暴露 的敏感记录，移除了 27,000 多条含 PII 的记录，并把建模暴露降低略高于 $5.14 million。 U.S. Army 客户故事同样偏运营：BigID
              称 Army 团队在 Azure Cloud、Elastic、SQL Server、 Oracle DB、SharePoint 和 Office 365 上使用该平台，发现脆弱数据、识别 ROT 数据、自动化
              留存，并围绕 PII、PHI 和 CUI 支持 Zero Trust 目标。


              过了这两个参考案例，证据质量很快下降。公共目录和客户名单供应商列出更多组织——American Express、Equifax、Paychex、Rackspace、EDF
              Energy、SoftBank、Caesars、Signet Jewelers、 Walmart、MassMutual 等——但没有给出带日期的部署叙事、量化结果或续约证据。这个区分很 重要。BigID 可见
              logo 明显多于可见案例研究。因此，本章把 UMD 和 Army 视为生产级参考， 把云市场和评价来源视为可信但间接的部署证据，把目录式客户名单视为广度指标，而 不是持久生产使用的证明。
