        - AI 优先企业；云原生安全团队
        - AI 原生 DSPM + DLP + 身份融合；DataDNA 分类；面向 GenAI 的 AI Guardian
        - 隐私和合规工作流深度弱于 BigID
      - - Varonis
        - DSPM + 数据治理（直接同业）
        - $745M ARR；2025 年收入 $623.5M；6,400 家客户；上市公司（Nasdaq）
        - 企业安全团队；文件共享和 M365 环境
        - 行为分析；自动化补救；24/7 MDDR；一体化定价
        - 多云和多源覆盖较弱；隐私自动化较少
      - - OneTrust
        - 隐私管理（邻近）
        - ~$500M ARR；14,000+ 企业客户；2,600 名员工
        - CPO 和合规团队；大型企业、Global 2000
        - 同意管理；供应商风险；可规模化隐私工作流；市场领先认知度
        - DSPM 深度有限；数据安全控制弱于 BigID
      - - Microsoft Purview
        - 数据治理 + DLP（捆绑式在位者）
        - 8.8% 认知份额排名第 1；捆绑在 M365 E5 中；Azure 原生
        - 使用 Microsoft 365 和 Azure 的组织
        - 对 M365 E5 客户边际成本为零；原生 M365 / Azure 集成
        - 非 Microsoft 数据源较弱；ML 分类先进度较低
      - - Wiz（现为 Google）
        - CNAPP + DSPM（邻近平台）
        - 2026 年 3 月以 $32B 被 Google 收购；渗透 50% Fortune 100
        - 优先统一安全态势的云优先企业
        - 统一 CNAPP + DSPM + CSPM + CIEM；基于图的风险；Google 背书和分销
        - 隐私和合规工作流深度较弱；数据治理不是核心任务
      - - Informatica
        - 数据治理 / 目录（在位者）
        - 上市公司（Nasdaq）；治理认知份额 ~5.3%
        - 拥有遗留数据资产的大型企业；数据工程团队
        - 企业数据目录；IDMC；数据血缘；治理工作流
        - DSPM 和安全聚焦较弱；云原生数据能力较弱；架构更旧
      - - Collibra
        - 数据治理 / 目录（邻近在位者）
        - 上次披露估值 $5.25B；500+ 全球企业
        - CDO 组织；治理办公室；受监管企业
        - 覆盖企业数据资产的治理、目录、血缘和隐私工作流
        - 不是核心 DSPM 或补救平台
      - - Alation
        - 数据目录 / 治理（邻近替代品）
        - 上次披露估值 >$1.7B；$100M+ ARR；近 450 家企业客户
        - 数据团队、分析组织和业务用户
        - 搜索驱动的数据目录，具备主动元数据、AI 辅助和 120+ 连接器
        - 侧重治理 / 目录，而非 DSPM 或隐私执行
      - - Rubrik
        - 网络韧性 + 数据安全（邻近上市替代品）
        - $1.46B 订阅 ARR；2,805 家 $100K+ ARR 客户；上市公司（NYSE）
        - 标准化采用网络韧性平台的安全和基础设施团队
        - 上市公司规模、恢复 + 威胁分析能力，以及相邻数据安全预算入口
        - 隐私和合规工作流深度不如 BigID；DSPM 不是核心切入点
      - - Securiti（已被收购）
        - 隐私 + DSPM（前直接同业）
        - 2025 年被 Veeam 以约 $1.73B 收购；累计融资 $156M
        - AI 治理 + 隐私合规项目
        - Data Command Graph；统一 AI 治理和隐私运营
        - 不再独立；收购后整合有扰动风险
      - - AWS Macie
        - 云原生替代品
        - 30 天免费试用；每个 S3 存储桶 / 月 $0.10；每检查 1 GB $1
        - AWS 原生团队，有以 S3 为中心的数据发现需求
        - 原生接入 AWS，窄场景入门价格很低
        - 只覆盖云端，隐私工作流和跨来源治理深度有限
    notes: >-
      上市公司和官方披露现在支撑已规模化替代品集合：Rubrik FY2026 业绩、Collibra 最近一次披露估值的融资轮、 Alation 2022 年 Series E 公告，以及 AWS Macie
      公开定价。私营公司行在没有等同申报文件时， 仍混合使用官方新闻稿、公司页面和第三方估计。
