      - number: '3.3'
        title: 定价、打包与 go-to-market 对比
        blocks:
          - type: paragraph
            body: >-
              DSPM 和数据安全市场的定价几乎都是定制化企业报价，没有厂商公开发布单位价格。 已发表的分析师研究和客户报告数字显示，企业 DSPM 合同通常每年 $100K 至 $500K+，复杂部署可超过每年 $700K。
              一个有记录的例子是：Maryland 州以约每年 $698,000 与 BigID 签约，覆盖 5 PB 和 500 个数据源。 BigID
              使用模块化定价架构，权限管理、自动化修复和隐私模块等核心安全能力作为单独附加许可证销售，这会提高总合同价值，但也会在竞争评估中造成标价冲击。 Varonis 把分类、权限管理、威胁检测、自动化修复和 24/7
              MDDR 专家服务纳入单一平台价格，形成有吸引力的一体化价值主张；BigID 的基础平台若不加购，无法匹配。 Cyera 在 2026 年承诺 100% 业务通过渠道社区完成，并重投入合作伙伴赋能，显示其
              channel-first GTM 与 BigID 以直销为主的企业销售方式不同。 Microsoft Purview 对 M365 E5 授权持有者近似免费，使增量合规级用例的切换成本接近零，也让它成为
              BigID 最危险的打包威胁。 AWS Macie（云原生、按量付费）和 GCP DLP 针对狭窄云端用例，价格只是企业 DSPM 的一小部分。 BigID 的主要 GTM
              是直销企业客户，聚焦受监管行业（金融、医疗、政府）。 其渠道和合作伙伴动作包括与 Wiz 的集成（联合销售，co-sell）和主要云提供商，但渠道宽度落后于 Cyera 承诺的 100% 渠道模式，也落后于
              Varonis 已建立的合作伙伴网络。
