  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、监管和合同风险更多来自执行负担，而不是当前可见的公开案件
        blocks:
          - type: paragraph
            body: >-
              公开来源没有显示 BigID 存在确凿的执法行动，但确实显示这家公司产品和合同表面与隐私、AI、 正常运行时间和政策执行紧密绑定。BigID 的法律资源页暴露出一个私人软件供应商少见的宽栈： 支持政策、托管
              SLA、DPA、隐私声明、反贿赂政策、ESG 政策、行为准则和负责任 AI 材料。这是成熟度的正面信号，但也扩大了在生产或审计中可能失效的承诺数量。DPA 将安全事件 定义为包括影响 BigID
              或其子处理方的泄露；托管 SLA 只承诺 99.5% 月度正常运行时间，并且 服务抵免需要通过工单触发。2026 年合规负担也更重。BigID 主动营销同意管理、跨境传输情报、 隐私门户和 AI 治理工作流，而
              EU AI Act 将在 2026 年 8 月 2 日广泛适用，并对高风险系统 提出明确义务。因此，法律层面的净判断不是“已经发现公开诉讼”，而是“运营承诺密度高；如果 产品交付落后于承诺组合，下行真实存在”。
