      - number: '5.3'
        title: 技术架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              BigID 的分类引擎结合多种 AI 技术：正则表达式匹配、NLP（自然语言处理）、NER（命名实体识别）、深度学习，以及用于关系发现的图分析。
              平台用模糊分类识别相似、重复和冗余数据，并用图分析浮现系统之间分散敏感数据点的关系。 基于模式的发现与 ML
              分类、上下文感知丰富叠加在一起，在原始分类标签之上加入数据血缘、访问权限和身份上下文，产出可行动风险信号，而不只是静态标签。

              BigID 获专利的身份感知发现技术是核心架构差异：引擎会把分散系统中的数据发现项关联回具体个人（数据主体），包括向量数据库和 AI 训练集，从而支持自动化 DSAR 和以身份为中心的访问治理。 平台部署在基于
              Kubernetes 的微服务架构上，可在多个 pod 间横向扩展并发扫描工作负载。 Forrester 2026 年 Q2 评估独立验证该平台「为性能和 PB 级规模而工程化」，并在「跨云和本地数据源（包括
              mainframe 环境）发现」方面具备「令人印象深刻的优势」。 BigID 持有多项已授权专利，覆盖基于 ML
              的个人信息发现（US11531931、US11295034）、用于分类的动态文档聚类（US11243990），以及身份关联系统和方法。 平台把 LLM 用作分类和查询层——AskBigID GPT
              允许围绕完整数据态势进行自然语言查询——并通过 MCP（Model Context Protocol）支持与 ChatGPT、Claude 等外部 LLM 集成。
