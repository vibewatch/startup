      - number: '8.4'
        title: 尽调问题与放弃触发条件
        blocks:
          - type: paragraph
            body: >-
              投资委员会从观察转向买入的路径并不复杂，但证据要求很高。第一，BigID 必须展示当前 ARR、 净留存率、毛利率、烧钱速度和现金，与至少中段公开可比公司倍数一致。否则，老股标记可能就
              是正确清算价格。第二，结构必须可知。SEC 历史证明 BigID 通过多轮私人融资募集资金，但公开 文件没有显示稀释、清算优先权、要约机制或任何类债务包袱。这意味着头条估值可能与新进
              或普通股投资者实际收到的回报显著背离。


              第三，公司必须证明执行质量足够持久，能支撑溢价。Tackle 渠道证据令人鼓舞，但评价证据、 治理噪音和外部安全监控显示，BigID 还没有去风险到可以只凭叙事承保。如果增长落到十几个点且
              没有清晰留存强度、下一轮融资低于当前老股区间、股权结构表堆满优先级证券，或治理 / 产品 质量问题开始影响续约，投资逻辑就会失效。在尽调清除这些点之前，可执行姿态很直接：把 BigID 留在观察 /
              继续研究名单上，只按低于 $550 million 的干净入场情景或显著改善的尽调包推进， 并把 2024 年独角兽价格视为天花板，而不是锚点。
