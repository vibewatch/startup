      - number: '2.3'
        title: 买家 / 用户 / 付款方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              BigID 的买方地图异常宽。 安全主导的交易通常由 CISO 或数据安全组织发起，痛点是多云可见性、数据暴露、降低泄露风险或审计响应。 隐私主导的交易由隐私、法务和合规负责人推动，他们需要在人工和 AI
              相关数据上执行权利管理、删除以及从政策到工作流的落地。 治理主导的评估涉及 CDAO 和数据治理团队，尤其是在市场把 BigID 与偏目录和数据管护的平台比较时。 最新入口是 AI
              治理，平台、模型风险和安全团队需要资产清单、运行时监督，以及与 NIST 和 EU AI Act 预期绑定的证据。

              这种宽度在战略上有吸引力，因为一次获批部署可以横向扩展到相邻预算。 它也制造摩擦，因为没有单一买家总是掌握完整合同。 安全团队可以发起最初落地，但隐私团队可能拥有删除和权利工作流，数据团队关心元数据和治理，AI
              团队则可能在生成式 AI 项目从试验走向受控生产后才出现。 因此，产品的跨职能属性既是 go-to-market 强项，也是一笔执行税。

              公开需求数据表明，BigID 主要是企业级产品。 大型组织占 DSPM 支出的大头，完成采用的比例也高于中端市场。 最可能的采用路径，是先切入一个紧急安全或隐私工作流，等客户看到一套共享敏感数据、访问、政策和
              AI 相关风险清单的价值后，再展开更大的平台对话。 这是评估 BigID 交易速度、ACV 质量和交叉销售耐久度的正确视角。
