      - number: '7.3'
        title: 渠道集中、超大规模云厂商捆绑和估值重置是最清晰的战略下行组合
        blocks:
          - type: paragraph
            body: >-
              BigID 的 GTM 动作有效，但越来越由其他平台中介。Tackle 案例研究清楚表明，云市场 主导的销售已经成为增长的重要部分；BigID 自己的 AWS 页面也显示公司正更深进入 AWS 原生
              分销和采购类别。Carahsoft 又在公共部门侧增加了第二个集中度向量。这些渠道帮助增长，但 如果采购规则、云市场排名、徽章状态或联合销售机制变化，也会抬高依赖风险。与此同时， BigID
              面向的客户本来就从超大规模云厂商购买原生重叠工具。Microsoft Purview、Amazon Macie 和 Google Sensitive Data Protection 都营销第一方发现、治理或
              DLP 能力；在部分用例上， 这些工具可能“够用”。这很关键，因为 BigID 已经处在比 2024 年更弱的估值伞下。Yahoo / Forge 将 2026 年 5 月业务估值定在约 $531.5
              million，而 BigID 自己 2024 年 3 月声明的 估值超过 $1 billion。公开收入 / 融资数据仍存在，但烧钱速度、毛利率和现金没有披露。
