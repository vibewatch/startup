      - number: '1.4'
        title: 增长、里程碑与负面事件
        blocks:
          - type: paragraph
            body: >-
              按 Latka 估算，BigID 的收入轨迹较强：2020 年 $25M、2021 年 $51.7M、2022 年 $78.3M、2023 年 $105.1M、2024 年 $139.5M。 公司在 2024 年
              3 月融资时称经常性收入「接近 $100M」，说明当时 ARR 约为 $100M；披露 ARR 与总收入之间的差距可能来自一次性或专业服务收入。 员工数从 2020 年约 278 人，增长到 2025–2026
              年全球约 721 人。 按 Latka 估算，客户基础约为 116 个企业账户，但 BigID 未独立确认这一数字。 关键里程碑包括：赢得 2018 年 RSA Innovation Sandbox；2020 年
              12 月达到独角兽地位；2026 年 3 月通过 Knox Systems 获得 FedRAMP 授权（使美国联邦机构可采用）；并在 2026 年 Gartner Magic Quadrant for Data
              and Analytics Governance Platforms 中被评为 Challenger。 负面方面，BigID 于 2025 年 7 月在美国纽约南区联邦地区法院（案号
              1:2025cv05571）起诉前销售高级副总裁 Nickolas Maxwell，称其在 2022 至 2024 年提交了超过 $700,000 的虚假业务报销。 BigID 于 2025 年 9
              月自愿撤诉且不影响再诉。 虽然公司避免了有争议的负面判决，但这一事件暴露出内部控制薄弱，尤其是对高级远程员工的费用监督不足，构成治理风险。 IDC 数据显示，BigID 2022 年收入增速为
              16.6%，落后数据隐私合规行业 27.6% 的平均水平；这是 2024 年融资时已被注意到的竞争定位问题。
