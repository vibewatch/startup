      - number: '3.2'
        title: 直接同业画像与能力对比
        blocks:
          - type: paragraph
            body: >-
              Cyera 是 BigID 短期内最重要的竞争威胁。 Cyera 于 2021 年成立，总部在纽约，2026 年 1 月以 $9B 估值完成 $400M Series F，累计融资超过 $1.7B，由
              Blackstone 领投，Accel、Coatue、Lightspeed、Sequoia 等参投。 公司进入 2026 年时报告收入同比增长 3.4 倍，客户覆盖 Fortune 500 的 20%，在 15
              个国家拥有超过 1,100 名员工。 Cyera 是首个把 DSPM、DLP 和身份汇入单一平台的厂商；其 AI Guardian 产品处理 AI 驱动的数据风险。 独立分析师认可其无代理架构和 DataDNA
              分类引擎，在云、SaaS 和本地覆盖的准确性上领先；客户评估中，标准数据类型的准确率和召回率均超过 90%。 Varonis（Nasdaq: VRNS）是规模最大的上市同业，2025 年底总 ARR 为
              $745M，客户 6,400 家，同比增长 14%。 Varonis 2025 年收入 $623.5M（增长 13%），并指引 2026 年收入 $722–730M（增长 16–17%）。 Varonis
              以行为分析、自动化修复、深度文件共享和 M365 治理，以及平台价格内包含的 24/7 MDDR（Managed Data Detection and Response）服务形成差异。 Varonis 指引到
              2026 年底实现 100% SaaS，SaaS NRR 为 110%，续约率高于 90%。 Sentra 在 2025 年 4 月完成 $50M Series B，当时 YoY 增长 300%，聚焦云原生
              DSPM，并以强分类准确性和 AI/Copilot 安全作为差异点。 在数据治理平台中，Informatica 的心智份额约为 5.3%，BigID 约为 4.9%，Informatica
              在传统企业数据目录用例上略领先。 Microsoft Purview 背靠 Microsoft 365 E5 授权打包，心智份额为 8.8%。
