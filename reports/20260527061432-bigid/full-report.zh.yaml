      - number: '5.6'
        title: 信任、安全、隐私与合规控制
        blocks:
          - type: paragraph
            body: >-
              BigID 持有 SOC 2 Type II 和 ISO 27001:2013 认证，说明其信息安全管理体系和运营安全 控制已接受独立审计。2026 年 3 月，BigID 与最大的联邦 AI 托管云提供商
              Knox Systems 合作取得 FedRAMP 授权，使美国联邦机构可在严格的联邦安全标准下使用 BigID 平台。该 授权覆盖联邦云端和本地环境中的 CUI、PII 和 PHI 发现与分类，覆盖与 Zero
              Trust Architecture 要求的对齐，以及 NIST SP 800-53、CMMC、FISMA 和 EO 14028 合规。联邦 页面列出 CJIS、IRS 1075、HIPAA、OMB
              要求等具体认证，并强调完整审计追踪和自动证据 收集。

              平台内的隐私控制包括：跨已连接数据源自动履行 DSR（Data Subject Request）、cookie / 同意管理、偏好门户，以及按策略驱动的数据最小化。BigID 的安全内建承诺 在
              Forrester 评分中拿到满分。平台支持 GDPR、CCPA/CPRA、HIPAA、PCI DSS、ITAR，以及 包括 EU AI Act 和 NIST AI RMF 在内的新兴 AI 监管。面向 AI
              专项治理，BigID 于 2025 年推出的 AI TRiSM 模块加入三类能力：AI Security Posture Management（发现未授权 GenAI 使用和提示注入）、AI Risk
              Assessment（量化基础设施、数据、使用和 供应商暴露）以及 AI Data Trust（验证训练和推理数据完整性）。一个值得注意的缺口是： BigID
              没有公开发布安全状态页或事件披露历史，外部来源很难独立核验运营可靠性 SLA。
