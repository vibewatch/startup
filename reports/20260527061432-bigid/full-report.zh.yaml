      - number: '3.5'
        title: 负面与证伪证据
        blocks:
          - type: paragraph
            body: >-
              多个独立来源都给出了 BigID 竞争定位上的负面证据。 Varonis 自家对比页面称，BigID 缺少原生威胁检测、身份驱动分析、自动化修复和 24/7 事件响应，并把 BigID
              的模块定价描述为相对其一体化模式的结构性劣势。 独立定价分析指出，BigID 按数据量和按连接器定价的模式，会激励客户少扫描数据；这与 DSPM 工具价值依赖全面覆盖相冲突。 Cyera
              的增长轨迹是最重要的证伪信号：一个厂商在不到两年内以 9 倍差距跑赢 BigID 的估值轨迹，会让人追问市场是否更看重 Cyera 的纯 DSPM 深度，而不是 BigID 的平台宽度策略。
              尽管运营七年且累计融资 $320M，BigID 在 Gartner 2026 MQ for Data and Analytics Governance Platforms 中仍处于 Challenger 而非
              Leader 位置，这是竞争定位缺口信号。 截至 2026 年 5 月更新的 PeerSpot 对比显示，Varonis 在用户评分上略占优（4.8/5 vs BigID 4.7/5）。 Securiti 以
              23 倍收入被收购，说明战略买家会把该品类价值吸收到更广义安全平台里，而不是继续资助独立增长；由此可见，BigID 作为独立公司面对整合风险。
