  - id: TM001
    title: 市场定义表
    columns:
      - 细分市场 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 重要性
    rows:
      - - DSPM / 以数据为中心的安全
        - 敏感数据发现、分类、暴露评估、补救、访问情报、政策驱动控制
        - 不带数据层上下文的通用 CSPM、CWPP、防火墙、网络监控
        - CISO、数据安全团队、安全平台预算
        - BigID 最清晰的品类切入口，也是增长最快的安全视角
      - - 隐私管理 / PrivacyOps
        - 权利请求、删除、数据使用治理、合规工作流、隐私风险报告
        - 人工问卷、外部律师、纯咨询隐私工作、单点权利请求工具
        - 隐私、法务、合规预算负责人
        - 重要切入动作，因为 AI 将隐私义务从员工和客户数据扩展到更多数据
      - - 数据治理平台
        - 目录、元数据、血缘、数据管护、政策控制、治理工作流
        - BI / 分析工具、存储引擎、只做目录且没有运营控制的工作流
        - CDAO、治理办公室、数据平台预算
        - BigID 已进入治理评估清单，因此这一邻近市场值得关注
      - - AI 治理 / AI 安全
        - AI 资产清单、运行时监控、证据收集、政策执行、围绕 AI 使用的数据控制
        - 只做政策的委员会、通用 GRC、没有治理控制的模型开发工具
        - AI 项目负责人、安全、数据平台、法务
        - 受 EU AI Act 和 NIST 式治理要求推动的新兴增长切入口
      - - 广义数据发现与分类
        - 用于定位和标记企业数据的发现与分类工具
        - 分析优先的发现、BI 准备、从未变成控制层的元数据工作
        - 数据团队和混合 IT 预算
        - 有助于自上而下看邻近市场，但过宽，不能不打折就作为 BigID 直接 SAM
      - - 捆绑式平台替代品
        - 嵌入类 DSPM 功能的 CNAPP、更广义云安全和数据安全套件
        - 单独销售的隐私、治理或 AI 控制
        - 安全平台负责人
        - 主要现状替代方案，因为买方可以把 DSPM 当作捆绑功能
    notes: 纳入支出应跟踪会成为持久数据控制层的软件。广义发现和捆绑安全套件适合对比，但如果不做范围折扣，不应当作同等质量的 SAM。
