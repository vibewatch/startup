  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与工作流范围
        blocks:
          - type: paragraph
            body: >-
              BigID 处在企业分布式数据资产与依赖这些数据作出的安全、隐私、合规和 AI 治理决策之间；前者横跨云对象存储、关系型数据库、SaaS 应用、数据湖、本地文件共享和 AI
              模型管线，后者都必须先知道数据里有什么、属于谁。 BigID 解决的核心客户问题是企业数据盲区：组织看不见的数据，就无法管理其中风险。 BigID 的答案是一套自动化「先发现、再行动」闭环：以 PB
              级规模扫描数据源，用 ML 和身份智能分类发现项，用访问和风险上下文丰富结果，再促成具体动作——删除、撤销访问、履行 DSR、执行留存，或治理 AI 管线。

              从工作流看，CISO 团队用 BigID 在不手工抽样的情况下发现并排序敏感数据风险；隐私团队用它在数百个连接源上自动化 GDPR/CCPA 数据主体请求；合规团队用它生成对齐 HIPAA、PCI DSS 和
              NIST 800-53 的审计证据；AI 项目团队则在模型摄取前，用它验证 LLM 训练数据不含 PII、secret 或有毒数据。 2025 年 2 月推出的 BigID
              Next，把上述所有工作流打包进一个单一模块化平台，替代分别运行 DSPM、DLP、隐私管理、数据目录和 AI 治理点工具的需要。 BigID 将平台营销为行业首个云原生、AI 驱动的 Data Security
              Platform（DSP，数据安全平台），覆盖安全、合规和 AI 下的全部数据风险。
