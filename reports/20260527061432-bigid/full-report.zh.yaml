  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              BigID 的市场更像一个汇合带，而不是单一清晰的分析师品类。 公司自身覆盖的界面横跨 DSPM、更广义的数据安全、隐私管理、数据治理和 AI 安全。 关键在于，每个品类的买家、预算所有者和替代方案都不同。 在
              BigID 的叙事里，共同分母不是「所有数据软件」，而是能发现敏感数据、映射到身份和使用场景，并围绕风险、隐私、合规和 AI 执行或自动化控制动作的软件。

              因此，纳入支出应集中在以数据为中心的发现与分类、暴露评估、修复工作流、隐私权利和删除自动化、与政策和数据管护绑定的治理控制，以及 AI 治理功能，例如资产清单、运行时监控和证据收集。
              排除支出应包括只停留在云配置层面的通用 CSPM 和基础设施态势产品、没有数据层上下文的网络和端点工具、纯咨询型隐私服务，以及无法成为运营控制层的广义数据发现或 BI 工具。
              被排除的品类仍重要，因为买方采购时可能拿来比较，但它们与 BigID 的直接切入点不属于同一个支出池。

              替代方案很碎片化。 安全买家可以默认选择 CNAPP 或大型数据安全套件内置的 DSPM。 隐私团队可以继续跑手工问卷、法律工作流和权利请求工具。 数据办公室可以继续使用以目录为先的治理平台。 AI
              治理团队也可以尝试扩展 GRC 或仅靠政策的流程。 BigID 的机会在于这些动作正在汇合；风险在于每笔交易并不一定都要替换某个单一既有厂商，这会拉长采购，也会模糊市场规模测算的分母。
            claimRefs:
