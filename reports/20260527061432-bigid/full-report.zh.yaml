      - number: '7.4'
        title: 治理和人员风险被已发布政策缓释，但公开资料仍无法完全承保
        blocks:
          - type: paragraph
            body: >-
              单独看，BigID 不像治理轻薄的公司。公司公开了行为准则、反贿赂政策、ESG 政策、隐私声明、 DPA 和其他正式文件，很多私人同业从不公开这些材料。行为准则明确涉及董事会、法律事务和 信息安全；反贿赂政策提到
              FCPA 和 UK Bribery Act 义务；ESG 政策称公司推动董事会独立性 和多元化。这些都是有意义的缓释因素，尤其考虑到 BigID 暴露在政府采购和受监管企业买家面前。
              问题在于，已发布政策不等于完整承保透明度。公开来源仍基本没有回答继任深度、委员会结构、 经审计运营质量、渠道集中度和融资韧性。创始人和高管集中度也仍然可见：公司页面以 Dimitri Sirota 和
              Nimrod Vax 为中心，Craft 只呈现了一个不大的公开高管名单。因此，投资者应当承认 治理脚手架存在，同时继续把人员深度、董事会流程和融资耐久性视为仍需尽调的议题。如果估值
              压缩加深、面向客户的可靠性恶化，或渠道集中度比当前公开证据显示的更难分散，投资逻辑应当 快速失效。
