  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              从财务上看，BigID 更应被理解为一套模块化、只面向企业的订阅软件平台，而不是单一用途的点产品。 公司的官方平台、AI
              安全、留存和数据生命周期页面展示出共同经济模式：客户先购买核心的数据发现与分类层，再追加隐私权利、留存 / 删除、AI 治理和更广义数据安全态势管理等相邻控制。
              关键在于，它支持扩张收入，而不要求公司每次都赢下全新预算；同一份底层数据清单可以随着时间推移证明更多模块的合理性。

              公开定价证据有意保持高层次。 公司未披露自助标价、公开免费层或标准席位表。 相反，评论和市场来源描述的是报价驱动合同模式，定价受数据源、应用 / 连接器、部署模型、服务 / 支持，有时还受容量或数据量影响。
              Sacra 给出一个略不同但兼容的视角：定价似乎随使用软件的团队成员、扫描数据量和高级功能扩展。 实际承销结论是，BigID 几乎肯定通过经谈判确定范围和模块 attach
              的年度企业合同获取收入，但公开证据太薄，无法重建真实价格水平或折扣。 客户评论证据也显示，产品被定位为高端，这支撑 ACV 质量，但在竞争或预算受限交易中增加了更大折扣风险。
