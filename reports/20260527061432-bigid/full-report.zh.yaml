      - number: '5.7'
        title: 路线图与 AI 时代举措
        blocks:
          - type: paragraph
            body: >-
              BigID 的路线图围绕自主治理引擎：平台持续发现、分类、补充元数据并执行数据策略，不需要 每一步都由人工复核。2025–2026 年的主要里程碑包括：BigID Next 于 2025 年 2 月推出，
              成为基础性的云原生模块化平台；2025 年引入 AI TRiSM，加入统一的 AI 风险、信任和安全 态势控制；2025 年上架 AWS Marketplace 的 AI Agents and Tools
              类别；2026 年 3 月取得 FedRAMP 授权；以及 2026 年 4 月 RSA Conference 2026 上发布四项新能力——DLP Prism （AI 驱动、具备上下文感知的
              DLP）、AskBigID GPT（自然语言数据态势查询）、Agentic Access Governance（AI 智能体数据访问的可见性和控制）以及 Integrated Employee AI
              Governance（监控员工 AI 工具使用中的敏感数据）。

              Forrester 在 Innovation 和 Roadmap 两项战略标准上给 BigID 满分；这两项合计占 Wave 总分
              45%。报告称该平台拥有“扎实的自主治理引擎愿景”，创新战略出色，规划中的增强路线图 也定义清晰。公开证据显示，近期路线图重点包括：为采用自主 AI 智能体的企业提供更深的 智能体工作流支持；继续扩展 AI
              智能体访问治理（非人身份和机器客户端）；加深与超大规模 云厂商的集成，简化云原生 DSPM；以及围绕新的全球隐私和 AI 监管持续增强合规。2026 年 新增 Markdown 文件扫描支持（与 vibe
              coding 和 AI 生成文档相关），说明公司能回应开发者 时代数据边界的扩张。
