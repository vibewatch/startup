      - number: '2.4'
        title: 增长驱动、采用约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              最强的需求驱动是可衡量且正在发生的。 监管正从抽象压力变成硬时间表：EU AI Act 的大多数义务将从 2026 年 8 月 2 日起全面适用，违规罚款很高；NIST AI RMF
              则为美国买方提供了实用治理参考模型。 AI 治理不再只是政策话题；Gartner 和 Research and Markets 都显示，一个有预算支持的平台品类正在出现。 隐私侧，Cisco 2026
              benchmark 确认，随着 AI 扩大数据治理和隐私义务，预算仍在上升。 安全侧，DSPM 采用、多云蔓延和泄露经济学共同支撑了持久需求背景。

              承销时，约束同样重要。 第一，CNAPP 和更广义云安全套件内置的 DSPM，可能让买家不愿另购独立平台。 第二，品类仍年轻：相互矛盾的市场估计说明，分析师并未就哪些收入属于 DSPM、治理或 AI
              治理达成一致。 第三，BigID 的品类宽度会拖慢交易，因为平台购买闭环前需要多个利益相关方对齐。 第四，公开证据对隐私 TAM、产品线收入结构，以及 2026 年哪种买方动作最高效落地，仍不完整。

              净结论是建设性但不简单。 BigID 指向 DSPM、隐私、治理和 AI 控制中真实且增长的预算。 但这些预算彼此重叠、内部政治碎片化，也越来越受到大型套件争夺。
              投资人应把市场扩张和执行纪律一起承销：哪个切入点最先成交，交叉销售跟进多快，以及 BigID 是因为品类汇合而赢，还是在品类汇合带来的混乱中仍能赢。
