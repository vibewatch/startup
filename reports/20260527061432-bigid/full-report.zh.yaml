      - number: '5.2'
        title: 模块与 SKU 架构
        blocks:
          - type: paragraph
            body: >-
              BigID Next 采用一套模块化、app 驱动的平台形态，客户在核心发现分类基础之上购买能力模块。 平台不公开披露按模块标价或标准席位价格；企业合同改为根据数据源数量、数据量、部署模块和服务 /
              支持范围谈判。 核心能力组——每组都代表一个独立可部署 SKU 或 app——包括：Data Discovery and Classification（数据发现与分类，基础引擎）、Data Security
              Posture Management（数据安全态势管理，DSPM）、Cloud DLP 和 DLP Prism、Data Access Governance（数据访问治理）、Privacy
              Management（隐私管理：DSR 自动化、cookie / 同意、偏好门户）、Data Retention and Deletion（数据留存与删除）、AI Governance 和 AI TRiSM（AI
              治理和 AI TRiSM：AI Security Posture Management、AI Risk Assessment、AI Data Trust），以及 Data Lifecycle
              Management（数据生命周期管理）。 模块化 app 框架允许按需集成模块，以保证投资面向未来，并让跨 app 体验更顺滑。

              分类层是所有其他模块依赖的基础：如果不知道有哪些数据，访问治理、留存和 AI 风险控制就没有可行动信号。 BigID 宣称有超过 1,500 个预训练分类器，覆盖
              PII、PHI、PCI、凭证、secret、知识产权和文档类型，并支持 100 多种语言。 每个模块都有专门产品页，也可以独立购买；不过 BigID 的扩张经济学更偏向先购买 DSPM
              基础，再逐步追加隐私、访问和 AI 模块。
