chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与业务概览
        blocks:
          - type: paragraph
            body: >-
              BigID 由 Dimitri Sirota 和 Nimrod Vax 于 2016 年在 New York City 和以色列 Tel Aviv
              创立，核心判断是：企业要做好隐私、安全和治理，必须先以数据为中心，真正知道自己持有什么数据、数据属于谁、又如何流动。 公司在 2018 年商业化推出平台，正赶上 GDPR 带来的监管紧迫感上升，并在 2018 年
              RSA Innovation Sandbox 竞赛中获评 Most Innovative Startup，拿到第一轮重要市场验证。 BigID 的平台是一套面向云优先企业的 AI 增强型数据安全、隐私、合规和
              AI 治理方案。 核心能力包括跨结构化、非结构化和半结构化数据的数据发现与分类；数据安全态势管理（DSPM）；数据防泄漏；隐私管理；访问治理；以及 AI 数据治理。 平台支持云、SaaS、本地和混合环境，部署超过
              1,500 个由机器学习和身份智能驱动的分类器。 BigID 的商业模式是订阅制企业 SaaS。
              目标客户是大型企业，尤其是金融、医疗、政府等受监管行业，它们需要管理复杂数据版图，以满足监管合规、降低泄露风险并治理 AI。 已具名的重要客户包括 US Army 和 University of
              Maryland。 BigID 总部位于 New York City，在以色列 Tel Aviv 拥有重要工程和研发团队，并通过 BIGID UK LTD（2018 年 4 月注册）在 United
              Kingdom 设有办公室。 截至 2026 年 5 月，BigID 仍是私营公司，2020 年 12 月达到独角兽估值，并在 2024 年 3 月成长轮后维持这一状态；第三方估算显示，公司最近总收入为
              $139.5M（Latka，2024 年 10 月）。 公司产品已从聚焦 GDPR 的 PII 发现工具，演进为名为 BigID Next 的统一数据与 AI 治理平台，服务于 AI 时代的企业。
