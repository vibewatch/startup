      - number: '5.4'
        title: 部署、集成、可靠性与支持
        blocks:
          - type: paragraph
            body: >-
              BigID Next 提供四种部署模型：多租户云（成本效率更高，由 BigID 管理共享基础设施）、 单租户云（专用实例，提升安全隔离）、混合云（本地处理数据，云端控制平面），以及安全云
              快照扫描（无需完整迁移数据或保持持久连接，即可快速评估风险）。BigID 将这种部署弹性 称为“行业适配最广的云部署选项”，并把它列为相对传统 DSPM 工具的竞争差异化。截至 2025 年，该平台已上架 AWS
              Marketplace 的 AI Agents and Tools 类别，企业可通过现有 AWS 账户采购，从而简化企业采购流程。

              集成面很宽：BigID 支持数百种数据源连接器，覆盖关系型数据库（SQL Server、Oracle、 PostgreSQL、MySQL、Snowflake、Redshift）、非结构化存储（S3、Azure
              Blob、Google Cloud Storage、SharePoint、Box、Google Drive）、NoSQL 数据库（MongoDB、Cassandra、
              DynamoDB、Elasticsearch）、SaaS 应用（Salesforce、ServiceNow、Slack、Teams、SAP）、
              大数据平台（Databricks、Hive、BigQuery）和消息系统。Nasuni 的集成指南等第三方文档 显示，BigID 通过 API 以只读模式连接 NDS 卷，说明它能在合作伙伴存储平台上做零拷贝
              扫描。开发者门户（developer.bigid.com）提供用于程序化管理的 REST API、用于自定义 逻辑和连接外部治理工具的 Apps 框架、面向不受支持数据源的 Connector SDK，以及面向
              AI 原生交互的 MCP/LLM 集成。截至 2026 年 5 月，公开资料中没有 API 浏览器、沙盒或 免费开发者层。支持由 BigID Concierge 服务和标准企业支持层提供；用户评价指出，售后
              支持质量相比售前体验并不稳定。
