            body: >-
              BigID 的公开持久性证据主要来自客户评价表面，而不是管理层披露。AWS Marketplace 评价 描述了复杂企业环境中的生产使用：数据发现、分类、DSAR 自动化、自定义连接器和定期扫描。
              其中几条评价提到多年部署——大约两年半、接近三年、将近五年和五年——这是有意义的重复使用 信号。G2 归档资料显示，17 条评价给出 4.3/5 评分，平均实施时间一个月，平均 ROI 五个月；
              SoftwareReviews 报告 79% 计划续约、70% 情绪正面。


              同一评价语料也包含主要反向客户证据。AWS Marketplace 和 PeerSpot 评价提到间歇性扫描 失败、UI 摩擦、文件查看 / 导出限制、支持升级延迟以及高端模块化定价。G2 还包括一条来自 前
              Illow 客户的具体投诉，称 BigID 收购后没有兑现旧有终身协议。这些问题不能推翻 更广泛的采用叙事，但它们说明客户喜爱并不普遍，部署质量可能并不均衡。最重要的是，已审阅 的公开来源都没有披露
              NRR、GRR、流失率、合同期限或头部客户集中度，因此重复使用只能通过 代理信号看到，而不是通过财务级留存数据确认。
