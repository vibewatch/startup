            body: >-
              公开证据指向两条相互强化的扩张动作。第一条是渠道和采购扩张。Tackle 称 BigID 将云 GTM 设为首选渠道，FY23 云市场收入增长 345%、FY24 增长 312%，成交率从 18% 提升到
