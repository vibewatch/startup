  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图概览
        blocks:
          - type: paragraph
            body: >-
              BigID 位于三个相邻市场的交汇处：数据安全态势管理（DSPM）、隐私管理与合规自动化，以及数据治理。 每个市场都有自己的主导既有厂商和融资充足的挑战者。 直接 DSPM 同业包括
              Cyera（增长最快的独立厂商）和 Varonis（规模最大的上市同业）。 隐私管理既有厂商 OneTrust（约 $500M ARR）和 Securiti（2025 年被 Veeam
              收购）在合规和同意管理侧竞争。 数据治理替代品也已有规模：Collibra 最后一轮披露融资估值 $5.25B，并称服务 500+ 全球企业；Alation 最后一轮披露融资在 ARR 超过 $100M
              后给出超过 $1.7B 估值。 在以 Microsoft 为中心和传统企业环境中，Microsoft Purview 和 Informatica 仍是最常见的既有治理替代方案。 Rubrik
              以上市公司规模从网络韧性延伸到相邻数据安全领域，而 AWS Macie 为狭窄的仅 S3 发现和分类任务提供便宜的云原生替代品。 因此，BigID
              必须用多用例平台宽度，抵住狭窄专家和更便宜或打包替代品的双重压力。
