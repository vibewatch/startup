  - id: TM004
    title: 增长驱动与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - EU AI Act 适用性和处罚
        - 驱动因素
        - 2026 年立即生效
        - 让 AI 治理成为可预算、可审计的事项，而不再是可选政策工作
        - 哪些产品模块已经专门围绕 AI Act 准备度销售？
      - - NIST AI RMF 采用
        - 驱动因素
        - 当前且持续
        - 给美国买方一套实用治理框架，BigID 可将产品控制映射其上
        - 销售材料是否明确把 BigID 模块映射到 NIST AI RMF 功能？
      - - 隐私预算扩张
        - 驱动因素
        - 当前至 2027 年
        - 隐私和数据治理预算上升，扩大隐私驱动切入口
        - 新增 ARR 中有多少来自隐私驱动，多少来自现有安全账户交叉销售？
      - - 多云数据蔓延与数据泄露经济账
        - 驱动因素
        - 结构性
        - 可见性缺口和不断上升的泄露成本，支撑安全驱动的 DSPM 需求
        - 哪些客户证据量化了价值实现时间或泄露风险下降？
      - - 更广套件内捆绑的 DSPM
        - 约束因素
        - 当前存在且可能加剧
        - 独立平台可能把预算输给 CNAPP 或大型套件续约动作
        - 管线中有多少被 Wiz、Palo Alto 或 Microsoft 的捆绑替代方案挤掉？
      - - 品类定义不稳定
        - 约束因素
        - 当前
        - 市场估计互相冲突，定价能力和 TAM 叙事更难做投资测算
        - BigID 内部如何定义自己的 SAM，这一定义随时间有多稳定？
      - - 跨职能预算归属
        - 约束因素
        - 当前
        - 交易可能需要安全、隐私、数据和 AI 利益相关方对齐
        - 哪种买方打法成交最快、扩张最可靠？
      - - 公开的模块级收入数据有限
        - 约束因素
        - 披露前持续存在
        - 投资人无法精准拆分 DSPM、隐私、治理和 AI 安全贡献
        - 索取按模块或购买打法拆分的 ARR 构成、胜率和留存
    notes: 驱动因素有来源支撑且仍属当前；约束结合了有来源支撑的市场结构和公开材料仍未解决的证据缺口。尽调应聚焦哪个切入口先落地，以及能否跨买方重复扩张。
