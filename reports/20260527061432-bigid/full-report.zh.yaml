      - number: '3.4'
        title: 护城河耐久度、锁定与替换风险
        blocks:
          - type: paragraph
            body: >-
              BigID 的竞争护城河建立在四根柱子上：（1）集成深度，围绕数百个企业数据源，在多年部署中沉淀了定制连接器和扫描配置；（2）监管工作流锁定，DSAR 自动化、GDPR/CCPA/HIPAA
              报告模板和合规日历嵌入企业运营；（3）ML 分类器调优，在部署中开发的定制分类器和实体模型积累了机构知识；（4）FedRAMP 认证（2026 年 3 月取得），在美国联邦和受监管政府市场形成合规护城河。
              大型企业切换成本高：拆掉定制合规工作流、重新集成数百个数据源、迁移训练好的模型，在规模化环境中意味着 6–18 个月工程投入。 多栖部署常见但不对称：企业常用 BigID 承担隐私和合规深度，同时用 Wiz 或
              Cyera 做云原生态势；因此 BigID 不一定被替换，但有被压缩成更窄合规工具的风险。 三个结构性威胁挑战这条护城河：Cyera 快速增长（估值从 2024 年 4 月 $1.4B 升到 2026 年 1 月
              $9B）及 Fortune 500 渗透率说明，买家正在选择 Cyera 作为主要数据安全平台；Microsoft Purview 随 M365 E5 打包，使决策者在基础分类和合规上越来越常问「为什么不直接用
              Purview？」；Google 收购 Wiz 则造出一个可在规模上同时服务 DSPM 和云安全的平台。
