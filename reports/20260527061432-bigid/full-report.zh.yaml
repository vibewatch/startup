figures:
  - id: FO001
    title: BigID 公司里程碑时间线
    type: timeline
    layout: wide
    summary: BigID 从创立到 May 2026 的轨迹，涵盖融资轮、产品里程碑、监管成果，以及费用欺诈这一反向事件。
    data:
      items:
        - date: '2016'
          label: 在 New York 和 Tel Aviv 创立
          detail: Sirota 和 Vax 创立 BigID，以数据优先的方法切入企业隐私和安全。
          tone: positive
        - date: 2018-01
          label: A 轮：$14M
          detail: SAP.io、Comcast Ventures、ClearSky 和 Boldstart 支持首轮机构融资。
          tone: positive
        - date: 2018-04
          label: RSA Innovation Sandbox 获奖
          detail: 获 RSA Conference 2018 最具创新力创业公司；GDPR 准备度得到验证。
          tone: positive
        - date: 2018-06
          label: B 轮：$30M
          detail: Scale Venture Partners 领投；公司在不到六个月内累计融资约 $44M。
          tone: positive
        - date: 2019-09
          label: C 轮：$50M
          detail: Bessemer 领投；Salesforce Ventures 作为战略投资方加入。
          tone: positive
        - date: 2020-12
          label: D 轮：$70M，估值 $1.25B
          detail: Tiger Global 和 Salesforce 联合领投；BigID 跻身独角兽。
          tone: positive
        - date: 2021-04
          label: D 轮延伸融资：$30M
          detail: Advent International 延伸该轮融资；累计融资约 $260M。
          tone: positive
        - date: 2024-03
          label: 成长期融资：$60M，估值 $1B+
          detail: Riverwood Capital 领投；AI 数据安全投资逻辑加速。
          tone: positive
        - date: 2025-07
          label: Maxwell 费用欺诈诉讼提交
          detail: 前销售 SVP 因涉嫌 $700K+ 欺诈费用被起诉；内控缺口暴露。
          tone: warning
        - date: 2026-03
          label: 获得 FedRAMP 认证
          detail: Knox Systems 合作帮助进入联邦市场；覆盖零信任和 AI 治理用例。
          tone: positive
        - date: 2026-03
          label: 获 Gartner MQ 挑战者认可
          detail: 在 2026 Gartner 数据与分析治理平台 Magic Quadrant 中被评为挑战者。
          tone: positive
        - date: '2024'
          label: 收入里程碑：$139.5M
          detail: Latka 估计 BigID 2024 年总收入为 $139.5M，高于 2020 年的 $25M。
          tone: positive
        - date: '2026'
          label: 员工数：全球约 721 人
          detail: BigID 员工数从 2020 年的 278 人增至 2025–2026 年约 721 人。
          tone: positive
