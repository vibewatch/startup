  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
      - 决策影响
    rows:
      - - ARR / 收入桥
        - 按季度拆分的 2025-2026 年 ARR、收入和服务占比
        - 判断 BigID 应拿 4x、6x 还是 8x 收入倍数所必需
        - 要求提供董事会材料、队列桥，以及经审计 / 管理层财务
        - 任何投资的核心门槛项
      - - 留存质量
        - 按产品家族拆分的总流失、净留存和队列扩张
        - 区分黏性平台价值和一次性项目收入
        - 要求提供客户队列表和续约分析
        - 会实质改变估值倍数
      - - 利润率和烧钱
        - 毛利率、经营利润率、烧钱速度、现金余额和现金跑道
        - 判断资本效率和融资风险所必需
        - 要求提供最新预算、过去十二个月财务和董事会 KPI
        - 决定下行和融资依赖
      - - 股权结构表 / 优先权
        - 完全摊薄股权结构表、优先股堆叠，以及任何债务或结构化资本
        - 名义估值未必等于投资者回报
        - 要求提供法律版股权结构表、股东分配瀑布和融资文件
        - 即便名义价格看起来不错，也可能改变决策
      - - 客户质量
        - 头部客户集中度、行业组合、平均合同规模和实施周期
        - 用来检验规模是广泛还是集中
        - 要求查看前 20 大客户和流失历史
        - 改变对公开可比公司比较的置信度
      - - 安全与控制
        - Maxwell 事件后的事故历史、整改状态和内控修复
        - 影响折现率和尽调舒适度
        - 要求提供安全审计摘要和控制整改备忘录
        - 若干净，可能下调风险评级
      - - 退出准备度
        - 经审计报表、预测严谨度，以及任何 IPO 准备路线图
        - 决定公开市场倍数上行是否现实，还是只剩战略 M&A 可选性
        - 要求提供财务运营成熟度评估和公开公司准备包
        - 澄清终值假设
    notes: 这些要求是从公开市场框架走向可投资私营公司承销所需的最低材料包。若干项目只存在于私有证据中，无法仅靠网络研究解决。
