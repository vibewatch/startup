  - id: TR005
    title: 缓释措施与否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 决策含义
    rows:
      - - 估值压缩 / 融资风险
        - 更新后的 Forge 或二级市场估值、下一轮条款，以及任何披露的烧钱数据
        - 到下一轮融资窗口时，二级市场隐含估值仍低于 $600M，且没有现金或利润率披露作为抵消
        - 视为融资红旗；收紧估值假设，并要求更强投资者保护
      - - 可靠性和产品质量下滑
        - 状态页事故、评论情绪、支持积压和扫描失败证据
        - 第二次重大客户可见故障，或评论持续显示扫描错误和连接器痛点在恶化
        - 暂停承销，直到公司披露模块级可靠性和支持 KPI
      - - AWS / 市场平台动作的渠道集中度
        - 市场平台占比、徽章状态、采购胜率和合作伙伴管线披露
        - 市场平台政策变化或失去 AWS / 合作伙伴地位后，GTM 明显减速
        - 重新评估增长质量，并把渠道集中度视为核心投资逻辑风险
      - - 超大规模云厂商捆绑竞争
        - 与 Purview、Macie 和 Google 敏感数据工具相比的赢单 / 输单反馈
        - Microsoft/AWS 占比较高的账户出现重大价格让步或挂载率下滑
        - 假设长期毛利率更低、护城河更弱
      - - 治理 / 关键人扰动
        - 创始人离任、董事会变动，或无法展示继任和委员会流程
        - 创始人离任，或尽调中无法拿出可信的继任、审计和监督材料
        - 升级为董事会风险议题，并推迟投资
      - - 合规执行失败
        - AI Act 准备度、DSAR / 门户可用性、安全事件处理，以及公共部门控制证据
        - 未达到 AI 治理准备要求、隐私门户反复中断，或无法证明 DPA / 分包处理方合规控制
        - 视为受监管客户扩张的投资逻辑破裂
    notes: 否决标准是可监测阈值，不是泛泛担忧；设计目的在于把本章公开证据转成可用于尽调决策的触发项。
