      - number: '5.8'
        title: 证据要点
        blocks:
          - type: callout
            title: Forrester Wave Leader，当前产品得分最高
            body: >-
              在 The Forrester Wave™: Sensitive Data Discovery And Classification Solutions, Q2 2026 中，BigID 被评为
              Leader，并在十家被评估供应商中获得最高当前产品得分；十一项标准拿到 满分，覆盖云端 / 本地覆盖、增强、集成、语言支持、调优、安全内建、创新、路线图、 合作伙伴生态和采用度。Forrester 还明确形容
              BigID “为性能和 PB 级规模而设计”，是“跨国 企业、大型组织和政府实体的有吸引力选择”。
            calloutType: strength
            claimRefs:
              - CE027
              - CE028
              - CE029
          - type: callout
            title: FedRAMP 授权打开联邦市场
            body: >-
              BigID 通过 Knox Systems 取得 FedRAMP 授权（2026 年 3 月），在联邦和受监管行业市场 形成有意义的护城河。联邦机构现在可以在最高联邦安全标准下部署 BigID，用于
              CUI、PII 和 PHI 发现；没有 FedRAMP 授权的竞争者很难跨过这道采购门槛。
            calloutType: strength
            claimRefs:
              - CE035
              - CE036
          - type: callout
            title: 配置复杂、误报和高价限制采用
            body: >-
              PeerSpot 和 G2 用户评价持续指出三类结构性摩擦：（1）多数据库连接配置被认为有挑战； （2）扫描输出的误报制造噪声，需要专门分析师投入分拣；（3）定价处于高端，并被明确认为 不利于 SMB
              或资源受限团队。这些问题不会让大型企业弃用产品，但它们确实给低摩擦 DSPM 新进入者留下竞争切口，也限制 BigID 向下市场扩张。
            calloutType: risk
            claimRefs:
              - CE045
              - CE046
              - CE047
          - type: callout
            title: 缺少公开状态页和 SLA 披露，限制可靠性尽调
            body: >-
              BigID 不发布公开运营状态页、正常运行时间 SLA 或历史事件披露。对受监管行业的企业买家 来说，这个缺口让独立可靠性核验无法完成。企业信任越来越要求公开透明的正常运行时间信息； 相比 Microsoft
              Purview 或 AWS Macie 等发布服务健康仪表板的同业，BigID 在这里的不透明 是一个中等尽调缺口。
            calloutType: risk
            claimRefs:
              - CE048
          - type: callout
            title: 身份感知发现是架构护城河
            body: >-
              BigID 已获专利的身份关联能力能把分散系统中的数据发现结果链接到具体个人，是竞争者最难 快速复刻的单项能力。这个护城河会随时间复利：每一次新的企业部署都会提升 BigID 身份图谱
              的准确性。身份层支撑大规模自动 DSAR 履行，也直接连接 AI 治理用例（知道某个 LLM 训练 使用了谁的数据）。这项架构下注是最清晰的长期 IP 差异化。
