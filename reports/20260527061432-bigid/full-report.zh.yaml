      - number: '2.2'
        title: 规模测算视角、相互矛盾的估计与受证据约束的 SAM
        blocks:
          - type: paragraph
            body: >-
              公开市场数据只能通过相互重叠的视角支持 BigID 的机会。 单独 DSPM 是最接近的品类，但即便在这里，公开区间也很宽：Palo Alto 的 2026 年指南汇总了低至 $415M、高至 $2B 的
              2025 年估计，而 QY Research 和 Stratistics MRC 又分别从 2025 年约 $1.8B 或 2026 年约 $1.3B 推出差异很大的前向路径。 分歧不是四舍五入误差。 它反映的是
              DSPM 到底被狭义计为独立数据安全产品，还是被广义计为云安全和数据平台套件内能力，不同机构定义不同。

              数据治理和 AI 治理确实带来真实邻近市场，但不能简单叠加在 DSPM 之上。 取决于发布方，数据治理到 2026 年已是 $5.38B 至 $6.31B 市场；AI 治理今天更小，2026 年约为 $0.49B
              至 $0.61B，但在监管压力下增长很快。 更广义的数据发现规模又大得多，2026 年为 $21.95B，但其中大部分支出过宽，不能视为 BigID 的直接
              SAM，因为它包含永远不会变成安全或治理控制系统的分析和元数据用例。 隐私也类似：预算增长显然真实存在，但公开证据更能证明支出上升，而不是一个清晰、独立的隐私自动化软件 TAM。

              承销含义是把原始邻近空间和可变现范围分开。 如果纳入广义数据发现，2026 年原始邻近视角可以超过 $29B；但排除明显不竞争的发现支出，并对安全、隐私、治理和 AI 治理预算之间的重叠打折后，更可防守的
              BigID 重叠调整后 SAM 约为 $3B 至 $5B。 相对于 BigID 已披露的经常性收入水平，这仍留下可观上行空间；但也保留了一个事实：公开市场估计仍相互矛盾，不应被压成一个带假精确感的标题数字。
