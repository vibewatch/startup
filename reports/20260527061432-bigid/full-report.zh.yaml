      - number: '1.3'
        title: 融资历史与投资人基础
        blocks:
          - type: paragraph
            body: >-
              自 2018 年 1 月 Series A 以来，BigID 已通过六轮披露融资累计筹集约 $320M。 Series A（$14M，2018 年 1 月）引入 SAP.io Fund、Comcast
              Ventures、ClearSky 和 Boldstart Ventures。 Series B（$30M，2018 年 6 月）由 Scale Venture Partners 领投，原有投资人跟投。
              Series C（$50M，2019 年 9 月）由 Bessemer Venture Partners 领投，Salesforce Ventures 作为战略投资人加入。 Series D（$70M，2020
              年 12 月）由 Tiger Global 和 Salesforce Ventures 共同领投，将 BigID 推到 $1.25B 独角兽估值。 Advent International 在 2021 年 4
              月又追加 $30M，延伸了 Series D。 最近一次融资是 2024 年 3 月 $60M 成长轮，由 Riverwood Capital 领投，Silver Lake Waterman 和 Advent
              International 参投，估值维持在超过 $1B。 Forge 的二级市场数据暗示，截至 2025–2026 年，市场驱动估值更接近 $530M，说明相较 $1.25B 的 VC
              轮峰值估值有所压缩——这一偏差值得潜在投资人细查。 投资人基础横跨战略型企业软件投资人（Salesforce Ventures、SAP.io）、成长期专家（Tiger Global、Silver Lake
              Waterman、Riverwood Capital）和早期专家（Boldstart、Bessemer）。 公开资料未披露债务融资、创始人参与的二级交易或信贷额度。
