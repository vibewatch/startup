  - id: FE001
    title: BigID Next — 产品架构栈
    type: stack
    layout: wide
    summary: BigID Next 从底层数据源连接器开始，向上经过分类与增强、风险和治理逻辑，最终到达顶部的动作与集成端点。
    data:
      layers:
        - id: l1
          label: 数据源连接器层
          detail: 数百个预构建连接器覆盖关系型数据库、对象存储、SaaS 应用、NoSQL、消息系统和 AI 管道。不支持的数据源可用自定义连接器 SDK 接入。
        - id: l2
          label: 扫描与摄取引擎
          detail: 部署在 Kubernetes 上的微服务通过只读连接摄取数据。扫描模式包括全量扫描、敏感数据优先、仅元数据和快照（无持久访问）。
        - id: l3
          label: 分类与增强层
          detail: 1,500+ 个分类器结合正则表达式、NLP、NER、深度学习、模糊匹配和图分析。ML 模型可由客户调优；身份关联把发现结果连到数据主体。
        - id: l4
          label: 风险、访问和治理逻辑
          detail: DSPM 风险评分、访问权限分析（人类和 AI 身份）、保留策略引擎、AI TRiSM 风险评估。按敏感度、暴露面和上下文给告警排序。
        - id: l5
          label: 动作与自动化层
          detail: 智能体式修复（删除、撤销、隔离、原生执行保留）。DSR 自动化。工作流委派。策略执行。生成审计轨迹。借助 DLP Prism 执行 DLP。
        - id: l6
          label: 集成与 API 层
          detail: REST API、Apps 框架、MCP / LLM 集成（AskBigID GPT、Claude、ChatGPT）、Webhooks。与 SIEM、SOAR、DLP、IAM、数据目录工具交换元数据，触发自主工作流。
    approximationNotes: null
    claimRefs:
      - CE012
      - CE013
      - CE014
      - CE021
      - CE024
      - CE025
