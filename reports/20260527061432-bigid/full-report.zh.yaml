  - id: TV001
    title: 建议摘要表
    columns:
      - 视角
      - 当前判断
      - 证据基础
      - 哪些因素会改变判断
      - 决策含义
    rows:
      - - 建议
        - 观察 / 继续研究
        - 公司质量信号强，但承销证据不完整
        - 只有价格保持纪律，或尽调补齐私人数据缺口，才转为买入
        - 保持在主动观察名单上，不按过时独角兽价格下注
      - - 置信度
        - 中
        - 估值缺口可见，但当前标记是指示性数据，关键指标仍未公开
        - 只有拿到经审计 / 最新 ARR、NRR、毛利率、现金和股权结构细节，才上调到高
        - 避免在仓位或目标回报上制造虚假精确
      - - 风险评级
        - 高
        - 私营公司不透明、治理杂音、评论摩擦和安全姿态不确定
        - 若留存、控制和安全卫生被证明干净，可降至中
        - 要求下行保护和持续监控
      - - 估值立场
        - 约 $531.5M 二级估值合理；$1B+ 新股偏高
        - 二级标记低于公开可比公司的底部区间，而上一轮新股估值已缺乏足够支撑
        - 更高入场价需要证明 BigID 配得上公开可比公司的溢价
        - 不要锚定 2024 年融资轮
      - - 目标回报 / 纪律
        - 基准情景入场后需要约 1.5x-2.0x 总上行
        - 基准区间来自二级定价思路，不来自过时独角兽定价
        - 只有证明收入 >$150M、NRR 强且结构干净，$550M 以上才站得住
        - IC 决策应由价格敏感度驱动，而不是由欣赏公司驱动
    notes: 该表总结的是可执行的 IC 判断，而非管理层指引。建议和回报纪律来自公开估值信号、公开可比公司区间和已披露证据缺口的推断。
