  - id: TV005
    title: 投资逻辑破裂与否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 决策含义
    rows:
      - - 增长下修重估
        - 2025-2026 年收入增速被证明低于 15%
        - 在没有透明度溢价的情况下，BigID 会转向类似 Varonis 或低于公开低端的倍数
        - 按悲观情景重新承销，并避免溢价入场
      - - 留存不及预期
        - 披露 NRR 低于约 105%，或流失明显升高
        - 打破平台宽度背后的扩张故事
        - 除非价格大幅下调，否则暂停投资
      - - 结构拖累
        - 股权结构表显示沉重的高级优先权、大额期权刷新，或债务式义务
        - 即便名义估值看起来可接受，普通股上行也会被削弱
        - 要求更好入场条款，否则放弃
      - - 新融资低价完成
        - 下一轮定价融资或要约低于当前二级区间
        - 证实推导出的估值标记还不够保守
        - 转向悲观情景假设
      - - 执行质量下滑
        - 续约摩擦、产品可靠性问题或安全事件开始影响客户
        - 同时压缩增长和倍数支撑
        - 在整改被证明前，视为投资逻辑破裂
      - - 治理问题复发
        - 出现更多控制失败、诉讼或高管诚信问题
        - 扩大折现率，并削弱退出可选性
        - 上调风险评级并推迟入场
    notes: 这些是可监测触发项，不是预测。阈值刻意保守，因为当前公开证据不完整；一旦结构或质量数据不及预期，私营公司下行会很快显现。
