companyProfile:
  summary: >-
    BigID 是一家私营数据安全、隐私和 AI 治理软件公司，2016 年由 Dimitri Sirota 和 Nimrod Vax 创立，总部在纽约，产品和工程根基主要在 Tel Aviv。
    公司面向大型企业和公共部门买家销售一套宽平台，覆盖数据发现、分类、DSPM、隐私运营、数据生命周期控制和 AI 治理。 公开证据支持 BigID
    已有可观规模、较宽产品线和部分客户证明，但大多数承销关键运营指标仍未披露，或只能间接估算。
