tables:
- id: TM001
  title: Market definition table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer/payer
  - relevance
  rows:
  - - DSPM / data-centric security
    - Sensitive-data discovery, classification, exposure assessment, remediation, access intelligence, policy-driven controls
    - Generic CSPM, CWPP, firewall, network monitoring without data-layer context
    - CISO, data-security teams, security-platform budget
    - BigID’s clearest category wedge and the fastest-growing security lens
  - - Privacy management / PrivacyOps
    - Rights requests, deletion, data-use governance, compliance workflows, privacy risk reporting
    - Manual questionnaires, outside counsel, consulting-only privacy work, point rights-request tools
    - Privacy, legal, compliance budget owners
    - Important entry motion because AI expands privacy obligations beyond employee and customer data
  - - Data governance platforms
    - Catalog, metadata, lineage, stewardship, policy controls, governance workflows
    - BI/analytics tools, storage engines, catalog-only workflows with no operational controls
    - CDAO, governance office, data-platform budget
    - Relevant adjacency because BigID now appears in governance evaluations
  - - AI governance / AI security
    - AI inventory, runtime monitoring, evidence collection, policy enforcement, data controls around AI use
    - Policy-only committees, generic GRC, model-development tooling without governance controls
    - AI program lead, security, data platform, legal
    - Emerging growth wedge driven by EU AI Act and NIST-style governance requirements
  - - Broad data discovery and classification
    - Discovery and classification tooling used to locate and tag enterprise data
    - Analytics-first discovery, BI preparation, metadata work that never becomes a control layer
    - Data teams and mixed IT budgets
    - Useful top-down adjacency, but too broad to use as BigID’s direct SAM without discounts
  - - Bundled platform substitutes
    - CNAPP, broader cloud-security and data-security suites that embed DSPM-like features
    - Standalone privacy, governance, or AI controls sold separately
    - Security-platform owners
    - Primary status-quo substitute because buyers can treat DSPM as a bundled feature
  notes: Included spend should track software that becomes a persistent data-control layer. Broad discovery and bundled security suites matter for comparison, but they should not be treated as equal-quality SAM without scope discounts.
