- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - EU AI Act applicability and penalties
    - driver
    - Immediate in 2026
    - Makes AI governance budgetable and auditable rather than optional policy work
    - Which product modules are already being sold specifically for AI Act readiness?
  - - NIST AI RMF adoption
    - driver
    - Current and ongoing
    - Gives US buyers a practical governance framework BigID can map product controls against
    - Does sales collateral explicitly map BigID modules to NIST AI RMF functions?
  - - Privacy budget expansion
    - driver
    - Current through 2027
    - Rising privacy and data-governance budgets widen the privacy-led entry wedge
    - How much new ARR is privacy-led versus cross-sell into existing security accounts?
  - - Multicloud data sprawl and breach economics
    - driver
    - Structural
    - Visibility gaps and rising breach costs sustain security-led DSPM demand
    - What customer evidence quantifies time-to-value or breach-risk reduction?
  - - Bundled DSPM inside broader suites
    - constraint
    - Current and likely increasing
    - Standalone platforms can lose budget to CNAPP or large-suite renewal motions
    - What share of pipeline is displaced by bundled alternatives from Wiz, Palo Alto, or Microsoft?
  - - Category-definition instability
    - constraint
    - Current
    - Conflicting market estimates make pricing power and TAM narratives harder to underwrite
    - How does BigID define its own SAM internally, and how stable is that definition over time?
  - - Cross-functional budget ownership
    - constraint
    - Current
    - Deals can require alignment across security, privacy, data, and AI stakeholders
    - Which buyer motion closes fastest and expands most reliably?
  - - Limited public module-level revenue data
    - constraint
    - Persistent until disclosure
    - Investors cannot precisely separate DSPM, privacy, governance, and AI-security contribution
    - Request ARR mix, win rates, and retention by module or buying motion
  notes: Drivers are source-backed and current; constraints combine source-backed market structure with evidence gaps that remain unresolved in public materials. Diligence should focus on which wedge lands first and whether expansion is repeatable across buyers.
