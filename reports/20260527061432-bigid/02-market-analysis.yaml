  evidenceGaps:
  - type: missing-source
    severity: material
    topic: privacy-automation standalone market size
    missingEvidence: Public evidence shows rising privacy and data-governance budgets, but it does not expose a clean standalone privacy-automation software TAM that maps directly to BigID's current product scope.
    whyItMatters: Without a clean privacy-software denominator, privacy should be treated as a buyer wedge and budget signal rather than a precise SAM input.
    diligencePath: Request BigID's internal view of privacy-led ARR, competitive set, and conversion from privacy workflows into broader platform contracts.
    relatedQuestionRefs:
    - QM022
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: bigid module-level revenue mix and landing motion
    missingEvidence: There is no public module-level revenue or pipeline split showing how much BigID generates from DSPM, privacy, governance, or AI-security modules, nor which buyer motion lands most efficiently.
    whyItMatters: Underwriting expansion efficiency requires knowing whether the company wins first through security, privacy, governance, or AI-governance, and whether cross-sell is repeatable.
    diligencePath: Request ARR mix by module, win rates by buyer motion, and cohort data showing how often initial deployments expand into adjacent control areas.
    relatedQuestionRefs:
    - QM006
    - QM010
    - QM021
    - QM022
    relatedTableRefs:
    - TM003
    - TM004
  - type: conflicting-data
    severity: minor
    topic: category-definition instability across dspm governance and ai-governance
    missingEvidence: Public analysts still disagree on what revenue belongs inside standalone DSPM, broader data governance, or AI-governance platforms, especially when bundled features are counted inside larger suites.
    whyItMatters: A single headline TAM would hide real disagreement and could overstate or understate BigID’s realistic serviceable market.
    diligencePath: Use management's internal market model and competitor win/loss analysis to reconcile which suites and modules BigID treats as direct market equivalents.
    relatedQuestionRefs:
    - QM003
    - QM005
    - QM025
    relatedTableRefs:
