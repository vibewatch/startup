  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Vendor
      - Price Model
      - Typical Range (Est.)
      - Core Inclusions
      - Key Implication
    rows:
      - - BigID
        - Per-data-volume + per-connector + per-module add-ons
        - "$150K-$700K+/yr enterprise"
        - Core discovery/classification; security and privacy modules priced separately
        - Modular upsell creates complexity; add-ons required for full value
      - - Varonis
        - Single platform price (all-in)
        - "$100K-$500K+/yr enterprise"
        - Classification, permissions, threat detection, remediation, MDDR services included
        - All-inclusive pricing is a competitive differentiator vs BigID's modular model
      - - Cyera
        - Custom enterprise; 100% channel
        - Not publicly disclosed
        - DSPM + DLP + identity + AI Guardian converged
        - Channel-first GTM may introduce discounts BigID direct-sales cannot match
      - - OneTrust
        - Custom enterprise; modular suite
        - "$100K-$400K+/yr enterprise"
        - Privacy/consent/DSAR management; DSPM as separate module
        - Strong for privacy-led buys; less price pressure on BigID in security-led deals
      - - Microsoft Purview
        - Bundled in M365 E5 or standalone add-on
        - "~$0 incremental cost for M365 E5 customers"
        - Data classification, DLP, compliance center, basic DSPM
        - Free bundling creates floor-price pressure for compliance-first buyers
      - - Sentra
        - Custom enterprise
        - "Est. $80K-$300K/yr (not publicly disclosed)"
        - Cloud-native DSPM; AI and Copilot security
        - Price-competitive challenger; may undercut BigID in cloud-native-only deployments
      - - AWS Macie
        - Pay-per-use on AWS
        - "30-day free trial; $0.10 per S3 bucket/month; $1 per GB inspected"
        - S3 bucket monitoring plus automated and targeted sensitive data discovery
        - Very low-cost substitute for narrow AWS-only discovery versus a full enterprise DSPM roll-out
    notes: >-
      BigID, Varonis, Cyera, and OneTrust commercial ranges remain estimated because list pricing is not
      public. The AWS Macie row uses AWS's official pricing examples, while Microsoft Purview cost logic
      is anchored to Microsoft's public pricing language about E3/E5 entitlements plus pay-as-you-go
      charges for non-M365 sources.
