      - - Wiz (now Google)
        - CNAPP + DSPM (adjacent platform)
        - "$32B acquired by Google Mar 2026; 50% Fortune 100 penetration"
        - Cloud-first enterprises prioritizing unified security posture
        - Unified CNAPP+DSPM+CSPM+CIEM; graph-based risk; Google backing and distribution
        - Less privacy and compliance workflow depth; data governance not primary mission
      - - Informatica
        - Data governance / catalog (incumbent)
        - "Public (Nasdaq); ~5.3% governance mindshare"
        - Large enterprises with legacy data estates; data engineering teams
        - Enterprise data catalog; IDMC; data lineage; governance workflows
        - Less DSPM and security focus; weaker for cloud-native data; older architecture
      - - Collibra
        - Data governance / catalog (adjacent incumbent)
        - "$5.25B last disclosed val; 500+ global enterprises"
        - CDO organizations; governance offices; regulated enterprises
        - Governance, catalog, lineage, and privacy workflows across enterprise data estates
        - Not a core DSPM or remediation platform
      - - Alation
        - Data catalog / governance (adjacent substitute)
        - ">$1.7B last disclosed val; $100M+ ARR; nearly 450 enterprise customers"
        - Data teams, analytics organizations, and business users
        - Search-led data catalog with active metadata, AI assistance, and 120+ connectors
        - Governance/catalog orientation rather than DSPM or privacy enforcement
      - - Rubrik
        - Cyber resilience + data security (adjacent public substitute)
        - "$1.46B subscription ARR; 2,805 $100K+ ARR customers; public (NYSE)"
        - Security and infrastructure teams standardizing on cyber resilience platforms
        - Public-company scale, recovery + threat analytics, and adjacent data-security budget access
        - Less privacy and compliance workflow depth than BigID; DSPM is not the core wedge
      - - Securiti (acquired)
        - Privacy + DSPM (former direct peer)
        - "Acquired by Veeam ~$1.73B in 2025; $156M raised total"
        - AI governance + privacy compliance programs
        - Data Command Graph; unified AI governance and privacy operations
        - No longer independent; post-acquisition integration disruption risk
      - - AWS Macie
        - Cloud-native substitute
        - "30-day free trial; $0.10 per S3 bucket/month; $1 per GB inspected"
        - AWS-native teams with S3-centric discovery needs
        - Native AWS integration and very low entry price for narrow use cases
        - Cloud-only scope with limited privacy workflow and cross-source governance depth
    notes: >-
