  - id: moat-lock-in-displacement
    title: Moat Durability, Lock-In, and Displacement Risk
    body: >-
      BigID's competitive moat rests on four pillars: (1) integration depth with bespoke connectors
      and scanning configurations built across hundreds of enterprise data sources over multi-year
      deployments; (2) regulatory workflow lock-in with DSAR automation, GDPR/CCPA/HIPAA reporting
      templates, and compliance calendars embedded in enterprise operations; (3) ML classifier tuning
      with custom classifiers and entity models developed in-deployment that represent accumulated
      institutional knowledge; and (4) FedRAMP certification (achieved March 2026), which creates a
      compliance moat in the US federal and regulated-government market. Switching costs are high for
      large enterprises: unwinding custom compliance workflows, re-integrating hundreds of data
      sources, and migrating trained models represents 6-18 months of engineering effort at scale.
      Multi-homing is common but asymmetric: enterprises often deploy BigID for privacy and compliance
      depth alongside Wiz or Cyera for cloud-native posture, meaning BigID is not always displaced
      but risks being relegated to a narrower compliance-only tool. Three structural threats challenge
      the moat: Cyera's rapid growth (from $1.4B valuation in April 2024 to $9B in January 2026) and
      Fortune 500 penetration suggest buyers are choosing Cyera as their primary data security
      platform; Microsoft Purview's M365 E5 bundling means decision-makers increasingly ask "why not
      just use Purview?" for basic classification and compliance; and Google's Wiz acquisition creates
      a platform at scale that can serve DSPM and cloud security together.
    claimRefs:
      - CP035
      - CP036
      - CP037
      - CP038
      - CP039
      - CP040
    tableRefs:
      - TP004
    figureRefs:
      - FP003

  - id: adverse-competitive-evidence
    title: Adverse and Disconfirming Evidence
    body: >-
      Adverse evidence on BigID's competitive position comes from multiple independent sources.
      Varonis's own comparison page argues that BigID lacks native threat detection, identity-driven
      analytics, automated remediation, and 24/7 incident response, and frames BigID's module
      pricing as a structural disadvantage versus its all-in-one model. Independent pricing analysis
      notes that BigID's per-data-volume and per-connector pricing model creates incentives for
      customers to scan less data, which is counterproductive in a DSPM tool whose value depends on
      comprehensive coverage. Cyera's growth trajectory is the most material disconfirming signal:
      a vendor that has outpaced BigID's valuation trajectory by a factor of 9x in under two years
      raises the question of whether BigID's platform breadth strategy is less valued by the market
      than Cyera's pure DSPM depth. BigID's Challenger (not Leader) position in Gartner's 2026 MQ
      for Data and Analytics Governance Platforms, despite seven years of operation and $320M raised,
      is a competitive positioning gap signal. PeerSpot comparisons updated through May 2026 show
      Varonis with a slight edge in user ratings (4.8/5 vs BigID's 4.7/5). The Securiti acquisition
      at 23x revenue demonstrates that strategic buyers absorb the category's value into broader
      security platforms rather than funding standalone growth, validating the consolidation risk to
      BigID as an independent company.
    claimRefs:
      - CP041
      - CP042
      - CP043
      - CP044
      - CP045

