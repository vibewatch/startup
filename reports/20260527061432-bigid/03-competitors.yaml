  - id: pricing-gtm-distribution
    title: Pricing, Packaging, and Go-to-Market Comparison
    body: >-
      Pricing in the DSPM and data-security market is universally custom enterprise with no vendor
      publicly posting per-unit rates. Published analyst research and customer-reported figures
      indicate enterprise DSPM contracts generally range from $100K to $500K+ annually, with complex
      deployments exceeding $700K per year. A documented example: the state of Maryland contracted
      BigID at approximately $698,000 per year to cover 5 petabytes and 500 data sources. BigID uses
      a modular pricing architecture where core security capabilities including permission management,
      automated remediation, and privacy modules are sold as separate add-on licenses, increasing
      total contract value but creating sticker shock in competitive evaluations. Varonis includes
      classification, permissions management, threat detection, automated remediation, and 24/7 MDDR
      expert services in a single platform price, a compelling all-in-one value proposition that
      BigID's base platform does not match without add-ons. Cyera committed in 2026 to doing 100% of
      business through the channel community with heavy partner enablement investment, signaling a
      channel-first GTM that differs from BigID's primarily direct enterprise sales approach.
      Microsoft Purview is effectively free for M365 E5 license holders, creating near-zero switching
      cost for the incremental compliance-grade use case and making it BigID's most dangerous packaging
      threat. AWS Macie (cloud-native, pay-per-use) and GCP DLP are available at fractions of
      enterprise DSPM price points for narrow cloud-only use cases. BigID's primary GTM is direct
      enterprise sales focused on regulated industries (finance, healthcare, government). Its channel
      and partner motion includes integration with Wiz (co-sell) and major cloud providers, but
      channel breadth lags Cyera's committed 100% channel model and Varonis's established partner
      network.
