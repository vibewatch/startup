  - id: direct-peer-profiles
    title: Direct Peer Profiles and Capability Comparison
    body: >-
      Cyera is BigID's most consequential near-term competitive threat. Founded in 2021 and based in
      New York, Cyera raised $400M Series F in January 2026 at a $9 billion valuation, totaling more
      than $1.7B raised, led by Blackstone with Accel, Coatue, Lightspeed, Sequoia, and others. The
      company reported 3.4x revenue growth year-over-year entering 2026 and counts 20% of the Fortune
      500 as customers with over 1,100 employees across 15 countries. Cyera was the first vendor to
      converge DSPM, DLP, and identity into a single platform; its AI Guardian product addresses
      AI-driven data risks. Its agentless architecture and DataDNA classification engine are recognized
      by independent analysts as accuracy leaders for cloud, SaaS, and on-prem coverage, with greater
      than 90% precision and recall on standard data types in customer evaluations. Varonis (Nasdaq:
      VRNS) is the largest public-company peer with $745M total ARR at year-end 2025 and 6,400
      customers growing 14% year-over-year. Varonis generated $623.5M revenue in 2025 (13% growth)
      and guided $722-730M for 2026 (16-17% growth). Varonis differentiates on behavioral analytics,
      automated remediation, deep file-share and M365 governance, and 24/7 MDDR (Managed Data
      Detection and Response) services included in platform price. Varonis guided to reach 100% SaaS
      by end of 2026, with SaaS NRR of 110% and renewal rates above 90%. Sentra raised $50M Series B
      in April 2025 amid 300% YoY growth, focusing on cloud-native DSPM with strong classification
      accuracy and AI/Copilot security as differentiators. Informatica holds approximately 5.3%
      mindshare in data governance platforms versus BigID's approximately 4.9%, with a slight lead in
      traditional enterprise data catalog use cases. Microsoft Purview holds 8.8% mindshare backed by
      bundled inclusion in Microsoft 365 E5 licensing.
