  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: competitive-win-loss
      missingEvidence: >-
        Formal win/loss rate data showing which competitors BigID most frequently loses to and in
        which use cases or deal sizes, and the primary stated reasons for loss.
      whyItMatters: >-
        Win/loss data would confirm or contradict the displacement narrative and identify whether
        Cyera, Varonis, or Microsoft Purview poses the largest actual threat to BigID's pipeline.
      diligencePath: >-
        Request competitive win/loss reports from management; interview 5 to 10 former BigID sales
        reps and CISOs who evaluated BigID against named alternatives in the past 12 months.
      relatedQuestionRefs:
        - QP019

    - type: private-evidence-only
      severity: minor
      topic: channel-partner-program
      missingEvidence: >-
        Formal details of BigID's channel partner program size, active partner count, and partner
        revenue share in 2026, comparable to Cyera's publicly stated 100% channel commitment.
      whyItMatters: >-
        Cyera's 100% channel commitment and Varonis's established partner ecosystem materially affect
        distribution reach and competitive deal flow access; BigID's channel position is a GTM risk
        if it lags significantly.
      diligencePath: >-
        Request channel partner program details from management; compare to Cyera and Varonis partner
        program pages and analyst channel assessments.
      relatedQuestionRefs:
        - QP024

    - type: missing-source
      severity: minor
      topic: customer-churn
      missingEvidence: >-
        Direct evidence of customer churn or competitive displacement from customers who publicly
        confirmed migrating from BigID to a named alternative platform.
      whyItMatters: >-
        Evidence of actual churn would make the displacement risk concrete rather than inferred from
        competitor growth trajectories and analyst commentary.
      diligencePath: >-
        Search customer review platforms (G2, TrustRadius, Gartner Peer Insights) for explicit
        migration mentions; request customer retention KPIs and NRR from management.
      relatedQuestionRefs:
        - QP019
