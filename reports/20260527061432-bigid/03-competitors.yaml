callouts:
  - calloutType: strength
    title: Breadth-and-depth platform moat in regulated industries
    body: >-
      BigID's combination of DSPM, privacy automation, data governance, and AI governance in a single
      platform, backed by FedRAMP certification and deep compliance workflow integration, creates a
      defensible moat in regulated industries (financial services, healthcare, US federal government)
      where neither Cyera nor Varonis yet matches BigID's breadth of compliance automation. This
      multi-use-case positioning generates meaningful switching costs for established enterprise customers.
    claimRefs:
      - CP022
      - CP035
      - CP036
      - CP037

  - calloutType: risk
    title: Cyera's momentum and Wiz/Google create structural displacement threats
    body: >-
      Cyera's $9B valuation (9x BigID), 3.4x revenue growth YoY, and 20% Fortune 500 penetration,
      combined with Wiz's Google-backed CNAPP+DSPM platform reaching 50% of Fortune 100, creates a
      credible scenario in which BigID is either replaced at new accounts or relegated to a
      compliance-only tool alongside a primary DSPM platform. Multi-homing (BigID + Wiz) already
      occurs in enterprise deployments, confirming this dynamic is not hypothetical.
