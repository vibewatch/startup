  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - Moat Claim
      - Threat Source
      - Severity
      - Mitigation / Diligence Ask
    rows:
      - - "Integration depth: 500+ data source connectors with enterprise-specific tuning"
        - Cyera agentless API integration matches breadth with less deployment friction
        - Medium
        - Run deployment-time POC comparison; verify connector count advantage vs Cyera
      - - "1,500+ ML classifiers with identity-aware discovery"
        - Cyera DataDNA and Sentra claim >90% accuracy leadership; classifier quality is testable
        - Medium
        - Run side-by-side classification PoC on representative data; measure precision/recall
      - - "Regulatory workflow lock-in (DSAR, GDPR, CCPA automation)"
        - OneTrust matches privacy workflow depth; Microsoft Purview closing gap within M365
        - Medium
        - Survey BigID customers on workflow portability; test DSAR migration cost
      - - "FedRAMP certification (March 2026)"
        - Competitors lack equivalent federal certification; moat in US government segment
        - Low (moat strength)
        - Confirm Varonis/Cyera FedRAMP status; verify federal pipeline and revenue size
      - - "Unified platform breadth (DSPM + privacy + governance + AI)"
        - Platform buyers prefer CNAPP-bundled DSPM (Wiz/Palo Alto); point-solution fatigue
        - High
        - Assess BigID win/loss rate vs CNAPP-bundled DSPM in competitive deals
      - - "Brand trust and 7-year enterprise reference base"
        - Cyera displacing at new accounts; Varonis longer-term incumbent in file/M365 accounts
        - Medium
        - Request customer retention data and competitive win/loss reports from management
    notes: >-
      Severity ratings assess competitive risk to BigID's moat: Low = moat strength (protective),
      Medium = meaningful risk but mitigable, High = structural challenge requiring strategic response.
      All ratings are editorial assessments based on competitive intelligence and should be tested
      through primary customer and management diligence interviews.
    claimRefs:
      - CP035
      - CP036
      - CP037
