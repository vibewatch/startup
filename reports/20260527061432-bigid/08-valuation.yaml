  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cap table and preference stack
    missingEvidence: Fully diluted cap table, liquidation preferences, option pool, any debt-like instruments, and the actual waterfall for new or secondary investors.
    whyItMatters: Headline valuation can materially overstate common-equity upside when senior paper or heavy dilution is present.
    diligencePath: Request legal cap-table export, financing documents, and a management-prepared waterfall model before any term-sheet work.
    relatedQuestionRefs:
    - QV007
    - QV027
    - QV030
  - type: private-evidence-only
    severity: blocking
    topic: revenue quality and unit economics
    missingEvidence: Current ARR, net retention, gross margin, services mix, cash burn, runway, and sales efficiency by channel or cohort.
    whyItMatters: Those metrics determine whether BigID deserves a low-end public multiple, a mid-band multiple, or a premium to public comps.
    diligencePath: Request trailing twelve-month financials, board KPI packs, cohort-retention analysis, and updated operating plan data.
    relatedQuestionRefs:
    - QV008
    - QV025
    - QV030
  - type: missing-source
    severity: material
    topic: customer concentration and deployment quality
    missingEvidence: Top-customer concentration, renewal outcomes, deployment timelines, and implementation-resource intensity by segment.
    whyItMatters: Public review snippets and marketplace wins do not reveal whether revenue is diversified, durable, or costly to service.
    diligencePath: Request top-20 customer view, renewal history, and implementation metrics by cohort.
    relatedQuestionRefs:
    - QV008
    - QV030
  - type: missing-source
    severity: material
    topic: exit readiness and finance maturity
    missingEvidence: Audited statements, forecasting discipline, IPO or strategic-process readiness, and any public-company-control roadmap.
    whyItMatters: The upper end of the valuation range assumes an exit path that could support public-style or strategic multiples.
    diligencePath: Request audited financials, finance-ops maturity memo, and board materials covering exit planning.
    relatedQuestionRefs:
    - QV029
  - type: enumeration-incomplete
    severity: minor
    topic: comparable valuation table representative coverage
    missingEvidence: A broader, fully normalized comp set with enterprise value, growth, margin, and retention data for every adjacent data-security and governance peer.
    whyItMatters: The current comp set is strong enough for directional price discipline but not exhaustive enough for fine-grained precision.
    diligencePath: Expand the comp model with paid databases or management banker materials if the deal advances.
    relatedQuestionRefs:
    - QV018
    - QV019
    - QV021
    relatedTableRefs:
    - TV004
