- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Category positioning
    - Unified data-security / privacy / governance platform can cross-sell into multiple adjacent budgets
    - Broader messaging can also blur category identity and make comp selection harder
    - Show module ARR mix and attach rates by product family
  - - GTM proof
    - Marketplace case study shows faster procurement and better close rates
    - Partner case study is not the same as audited company-wide efficiency
    - Provide direct-vs-marketplace bookings, win rates, and payback by channel
  - - Revenue quality
    - Near-$100M recurring revenue claim and $139.5M 2024 revenue estimate imply real scale
    - NRR, gross margin, services mix, and burn are still private
    - Provide 2025-2026 ARR bridge, churn, NRR, and margin
  - - Pricing power
    - Reviews suggest BigID is premium and capacity-based, which can support ACV depth
    - Premium pricing plus UX/scan complaints can create discounting or slower deployment
    - Show realized discounting, renewals, and time-to-value by cohort
  - - Governance and controls
    - No public evidence of existential legal/regulatory impairment
    - Expense-fraud lawsuit and external security monitoring justify a discount until controls are proven
    - Share internal-controls remediation and incident history
  - - Comparable support
    - Public comps and sector reports show data-security platforms still deserve healthy revenue multiples
    - High-end private/M&A prints belong to faster-growing or strategically clearer assets than BigID
    - Prove why BigID should price above the low/mid public comp range
  notes: Arguments synthesize current public evidence; they are not substitutes for management diligence. The anti-thesis column intentionally emphasizes the evidence needed to avoid paying a narrative premium.
