- id: scenario-ranges-and-recommendation
  title: Scenario Ranges, Comparable Signals, and Recommendation
  body: |-
    Recent private and strategic transactions show that upside still exists in data security, but only for names that can prove breakout momentum or strategic indispensability. Cyera's June 2025 round at $6 billion and January 2026 step-up to $9 billion show what investors will pay for an AI-native data-security story with much stronger current-growth optics. Salesforce's $8 billion Informatica deal and Windsor Drake's cited premium M&A transactions reinforce that trusted data-governance and AI-control assets remain strategically valuable. The key difference is that BigID's public evidence base does not currently show Cyera-like growth or strategic-sale certainty, so revenue-multiple underwriting is safer than narrative underwriting.

    On that basis, the bear case uses roughly $140-$150 million of revenue and a 3x-4x multiple for $420-$600 million of value. The base case uses $155-$170 million of revenue and a 4.5x-6x multiple for $700 million-$1.02 billion. The bull case uses $180-$200 million of revenue and a 7x-8.5x multiple for $1.26-$1.70 billion. Those ranges produce the cleanest recommendation rule in the chapter: the stale >$1 billion primary valuation is stretched unless private diligence shows unusually strong NRR, margin, and capital efficiency; the May 2026 secondary mark can work, but it only produces a buy if diligence closes the structural gaps. At today's evidence level, the right call is track rather than buy: fair to interesting around the secondary mark, but not yet supported enough for aggressive capital deployment.
