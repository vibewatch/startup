tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Lens
  - Current read
  - Evidence basis
  - What changes the view
  - Decision implication
  rows:
  - - Recommendation
    - Track / research-more
    - Strong company-quality signals, but incomplete underwriting evidence
    - Move to buy only if price stays disciplined or diligence closes the private-data gaps
    - Keep active on watchlist, not commit at stale unicorn pricing
  - - Confidence
    - Medium
    - Valuation gap is visible, but current mark is indicative and key metrics remain private
    - Increase to high only with audited/current ARR, NRR, gross margin, cash, and cap-table detail
    - Avoid false precision in sizing or target returns
  - - Risk rating
    - High
    - Private-company opacity, governance noise, review friction, and security-posture uncertainty
    - Could move to medium if retention, controls, and security hygiene are proven clean
    - Require downside protection and monitoring
  - - Valuation stance
    - Fair near ~$531.5M secondary; stretched at $1B+ primary
    - Secondary mark sits below public comp floor, while last primary round no longer looks well supported
    - A higher entry needs proof that BigID deserves a public-comp premium
    - Do not anchor on the 2024 round
  - - Target return / discipline
    - Need ~1.5x-2.0x gross base-case upside from entry
    - Base-case range works from secondary-style pricing, not from stale unicorn pricing
    - Supportable above $550M only with evidence of >$150M revenue, strong NRR, and clean structure
    - Price sensitivity, not admiration, should drive the IC decision
  notes: The table summarizes the actionable IC view rather than management guidance. Recommendation and return discipline are inferred from public valuation signals, public comp bands, and disclosed evidence gaps.
