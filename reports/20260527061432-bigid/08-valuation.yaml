- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  - Decision effect
  rows:
  - - ARR / revenue bridge
    - 2025-2026 ARR, revenue, and services split by quarter
    - Needed to decide whether BigID deserves 4x, 6x, or 8x revenue
    - Request board deck, cohort bridge, and audited / management financials
    - Core gating item for any investment
  - - Retention quality
    - Gross churn, net retention, and cohort expansion by product family
    - Separates sticky platform value from one-time project revenue
    - Request customer cohort tables and renewal analysis
    - Would move valuation multiple materially
  - - Margin and burn
    - Gross margin, operating margin, burn, cash balance, and runway
    - Needed to judge capital efficiency and financing risk
    - Request latest budget, trailing twelve-month financials, and board KPIs
    - Determines downside and financing dependency
  - - Cap table / preferences
    - Fully diluted cap table, preference stack, any debt or structured capital
    - Headline valuation may not equal investor return
    - Request legal cap table, stockholder waterfall, and financing docs
    - Can change the decision even if the headline price looks good
  - - Customer quality
    - Top-customer concentration, sector mix, average contract size, and implementation duration
    - Needed to test whether scale is broad or concentrated
    - Request top-20 customer view and churn history
    - Changes confidence in public-comp comparisons
  - - Security and controls
    - Incident history, remediation status, and internal-controls fixes after the Maxwell episode
    - Important for discount rate and diligence comfort
    - Request security audit summaries and controls remediation memo
    - Could reduce the risk rating if clean
  - - Exit readiness
    - Audited statements, forecasting rigor, and any IPO-readiness roadmap
    - Determines whether public-multiple upside is realistic or only strategic-M&A optionality exists
    - Request finance-ops maturity assessment and public-company readiness pack
    - Clarifies terminal-value assumptions
  notes: These asks are the minimum package needed to move from public-market framing to investable private-company underwriting. Several items are private-evidence-only and cannot be solved from web research alone.
