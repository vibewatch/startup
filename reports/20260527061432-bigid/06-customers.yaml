- id: named-deployments-and-proof-quality
  title: Named proof is strongest in two public-sector deployments; most other visible customers stay
    logo-level
  body: |-
    The best public customer evidence is not a generic logo wall. BigID’s University of Maryland case study describes a 2.5-petabyte cloud environment across Google Drive, Office365, and Box; the university says it used BigID to locate tens of thousands of exposed sensitive records, remove more than 27,000 PII-bearing records, and cut modeled exposure by just over $5.14 million. The U.S. Army customer story is similarly operational: BigID says Army teams used the platform across Azure Cloud, Elastic, SQL Server, Oracle DB, SharePoint, and Office 365 to discover vulnerable data, identify ROT data, automate retention, and support Zero Trust objectives around PII, PHI, and CUI.

    After those two references, proof quality falls off quickly. Public directories and customer-list vendors name many more organizations—American Express, Equifax, Paychex, Rackspace, EDF Energy, SoftBank, Caesars, Signet Jewelers, Walmart, MassMutual, and others—but they do not provide dated deployment narratives, quantified outcomes, or renewal evidence. That distinction matters. BigID clearly has more visible logos than visible case studies. The chapter therefore treats UMD and the Army as production-grade references, treats marketplace and review sources as credible but indirect deployment evidence, and treats directory-style customer lists as breadth indicators rather than as proof of durable production use.
  claimRefs:
