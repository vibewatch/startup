- id: expansion-paths-and-concentration-risk
  title: Expansion paths are visible through procurement channels and module breadth, but concentration
    remains opaque
  body: |-
    Public evidence points to two reinforcing expansion motions. The first is channel and procurement expansion. Tackle says BigID made cloud GTM its preferred channel, grew marketplace revenue 345% in FY23 and 312% in FY24, improved close rates from 18% to 34%, and cut deal-registration time from 5–10 minutes to about 2 minutes. BigID’s AWS materials add the buyer-side reason this matters: Deployed-on-AWS status makes purchases count toward EDP and PPA commitments, routes buying through marketplace procurement, and consolidates billing. Carahsoft contract vehicles and BigID’s federal posture add a second procurement lane for government and education customers.

    The second motion is in-product expansion. BigID’s AWS, AI governance, and Privacy Suite pages show attachable workflows spanning discovery, DSAR, retention, consent, AI asset inventory, Amazon Q governance, Security Hub integration, and automated credential rotation. Reviewers also describe using more than one BigID module at once. What remains unresolved is concentration. No reviewed source discloses top-account share, revenue mix by channel, or how much of the visible footprint is concentrated in public sector and regulated-enterprise accounts. The expansion case is therefore credible, but the dependency and concentration case still needs management-room evidence.
