- id: durability-and-satisfaction-proxies
  title: Durability signals are constructive but indirect, with renewal and quality evidence coming mostly
    from reviews
  body: |-
    BigID’s public durability evidence comes mainly from customer-review surfaces rather than management disclosure. AWS Marketplace reviews describe production usage around data discovery, classification, DSAR automation, custom connectors, and scheduled scans across complex enterprise estates. Several of those reviews reference multi-year deployments—roughly two and a half years, nearly three years, almost five years, and five years—which is a meaningful repeat-usage signal. G2’s archived profile shows a 4.3/5 rating across 17 reviews, one-month average time to implement, and five-month average ROI, while SoftwareReviews reports 79% plan-to-renew and 70% positive sentiment.

    The same review corpus also carries the main adverse customer evidence. AWS Marketplace and PeerSpot reviewers call out intermittent scan failures, UI friction, file-viewing/export limitations, support-escalation delays, and premium modular pricing. G2 includes a specific complaint from a former Illow customer who says BigID did not honor a legacy lifetime deal after acquisition. These do not invalidate the broader adoption story, but they do show that customer love is not universal and that deployment quality can be uneven. Most importantly, none of the reviewed public sources discloses NRR, GRR, churn, contract length, or top-customer concentration, so repeat use is visible only through proxies rather than through finance-grade retention data.
  claimRefs:
