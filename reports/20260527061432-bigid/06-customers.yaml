  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: Named customer proof table public coverage is partial and does not enumerate every active production
      deployment
    missingEvidence: A management-backed customer reference list that separates active production customers,
      pilots, former customers, and logo-only references.
    whyItMatters: Public directories and logo lists inflate visible breadth but do not prove current production
      usage or commercial durability across the full customer base.
    diligencePath: Request a dated customer reference pack with deployment status, go-live date, logo
      approval, and the top 20 current accounts by ARR.
    relatedQuestionRefs:
    - QU004
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: Customer retention metrics
    missingEvidence: NRR, GRR, churn, renewal-rate, contract-length, and cohort-retention data by major
      customer segment.
    whyItMatters: Review proxies suggest repeat use, but they cannot replace finance-grade retention metrics
      when underwriting customer durability and revenue quality.
    diligencePath: Request cohort tables for the last eight quarters showing logo retention, dollar retention,
      downsell, expansion, and average contract term by segment.
    relatedQuestionRefs:
    - QU015
  - type: private-evidence-only
    severity: material
    topic: Customer concentration and channel mix
    missingEvidence: Top-customer ARR share, top-10 customer share, ARR by channel, and ARR by public-sector
      versus commercial cohort.
    whyItMatters: Public proof is skewed toward large regulated and public-sector accounts, so concentration
      risk cannot be assessed without internal revenue distribution data.
    diligencePath: Request the top-20 ARR table, customer concentration schedule, and channel-origin waterfall
      for the last two fiscal years.
    relatedQuestionRefs:
    - QU019
