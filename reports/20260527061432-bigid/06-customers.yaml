chapter:
  number: 6
  title: Customers
  summary: BigID has real production adoption where the public evidence is strongest—most clearly at the
    University of Maryland and the U.S. Army—plus a broader but lower-confidence footprint across regulated
    enterprises surfaced by install-tracking and review sources. Cloud marketplace procurement, federal
    contract vehicles, and modular AI/privacy/security workflows all look like real expansion levers,
    but public durability still relies on review proxies rather than disclosed NRR, churn, or concentration
    data.
sections:
- id: segmentation-and-visible-footprint
  title: Visible customer mix skews toward large, regulated, and public-sector environments
  body: |-
    BigID’s public customer footprint is easiest to see in two very different evidence pools. The first is direct customer proof: the University of Maryland and the U.S. Army both describe concrete data-discovery, remediation, and compliance workflows that fit large, complex, highly regulated environments. The second is indirect install-tracking and logo-list data. 6sense says more than 265 companies had started using BigID in 2026, while ReadyContacts advertises a 285-company customer list updated in March 2026. Those directory-style sources are helpful for segment breadth, but they do not prove production depth, contract value, or current renewal status.

    Even with that caveat, the visible base has a recognizable shape. Named and sample accounts cluster in finance, insurance, payroll, telecom, utilities, hospitality, retail, and government-adjacent institutions—segments where sensitive data discovery, retention, privacy rights, and access governance are operational, not optional. Carahsoft and BigID’s federal materials reinforce that public-sector agencies are a deliberate go-to-market target, while AWS marketplace materials point to cloud-committed enterprise buyers as another important cohort. The right read is that BigID clearly reaches large enterprises and government-related buyers, but most of the broad footprint remains logo-level rather than deployment-level proof.
