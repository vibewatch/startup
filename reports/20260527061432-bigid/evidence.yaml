evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      Audited or company-confirmed post-2024 valuation; term sheet or investor deck disclosing post-money valuation from
      March 2024 growth round.
    whyItMatters: >-
      The $1B+ figure is a company statement, not independently verified; secondary market compression to ~$530M
      suggests the headline may overstate fair value.
    diligencePath: >-
      Request current cap table and term sheet from Riverwood Capital round; cross-reference with secondary market
      transaction data.
    relatedQuestionRefs:
      - QO005
      - QO025
  - type: private-evidence-only
    severity: material
    topic: arr
    missingEvidence: >-
      Audited ARR or independently verified recurring revenue figure for 2025 or 2026; breakdown of ARR vs. professional
      services revenue.
    whyItMatters: >-
      Gap between company ARR claim (~$100M at March 2024) and Latka total revenue estimate ($139.5M for 2024) remains
      unexplained; ARR is the primary SaaS valuation driver.
    diligencePath: >-
      Request current ARR with ARR/NRR/churn metrics directly from BigID in a data room context; validate against
      renewal data.
    relatedQuestionRefs:
      - QO006
      - QO013
  - type: missing-source
    severity: material
    topic: customers
    missingEvidence: >-
      Officially disclosed customer count and named customer list; industry vertical breakdown and average contract
      value.
    whyItMatters: >-
      Customer concentration risk and revenue predictability cannot be assessed without customer count and ACV data.
      Latka estimate of 116 is unconfirmed.
    diligencePath: Request customer list or account-level aggregation under NDA; review published case studies and reference list.
    relatedQuestionRefs:
      - QO017
  - type: missing-source
    severity: minor
    topic: acquisition
    missingEvidence: Public announcement or filing of any acquisition completed or in progress by BigID as of 2026.
    whyItMatters: >-
      The March 2024 round press release explicitly cited M&A as a use of proceeds; no acquisition has been publicly
      announced, leaving the capital deployment thesis open.
    diligencePath: Monitor BigID newsroom and press release feeds; request M&A pipeline update from management.
    relatedQuestionRefs:
      - QO023
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Details of internal control remediation following the Maxwell expense-fraud episode; outcome of any internal audit
      and updated expense approval policies.
    whyItMatters: Without knowing what was fixed, investors cannot assess whether the control failure was isolated or systemic.
    diligencePath: >-
      Request board audit committee report and updated expense policy from management; review any third-party internal
      audit engagement.
