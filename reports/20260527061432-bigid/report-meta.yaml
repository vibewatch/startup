companyProfile:
  summary: >-
    BigID is a private data-security, privacy, and AI-governance software company founded in 2016 by
    Dimitri Sirota and Nimrod Vax, with headquarters in New York and major product and engineering roots
    in Tel Aviv. The company sells a broad platform spanning data discovery, classification, DSPM,
    privacy operations, data lifecycle controls, and AI governance for large enterprises and public-sector
    buyers. Public evidence supports meaningful scale, broad product breadth, and selected customer proof,
    but most underwriting-critical operating metrics remain undisclosed or only indirectly estimated.
  foundedDate: '2016-01-01'
  founders:
    - name: Dimitri Sirota
      role: Co-founder & CEO
      background: Previously co-founded eTunnels and Layer 7 Technologies and worked at CA Technologies.
      claimRefs: [CO001, CO005, CO036]
    - name: Nimrod Vax
      role: Co-founder
      background: Previously worked at Business Layers, Netegrity, and CA Technologies on identity and access management.
      claimRefs: [CO001, CO006, CO037]
  foundingLocation: New York City and Tel Aviv, Israel
  headquarters: New York, NY, USA
  productSummary: >-
    BigID sells a modular enterprise platform for data discovery, classification, DSPM, privacy,
    compliance, retention and deletion, access intelligence, and AI governance across cloud, SaaS,
    hybrid, and on-premises environments.
  customerFocus: >-
    Large enterprises, regulated industries, and public-sector organizations that need sensitive-data
    discovery, privacy automation, security posture management, retention controls, and AI governance
    across complex data estates.
  businessModel: >-
    Quote-based enterprise SaaS sold through modular subscriptions, partner and cloud-marketplace
    channels, and expansion modules across privacy, security, lifecycle, and AI-governance workflows.
  stage: growth
  fundingStatus: >-
