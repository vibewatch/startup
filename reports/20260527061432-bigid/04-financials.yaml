  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current cash on hand, monthly operating burn, and runway months after the March 2024 growth round.
    whyItMatters: Without cash and burn data, investors cannot determine whether BigID is self-funding growth, how much cushion remains before another round, or whether the 2024 raise was sufficient for the current plan.
    diligencePath: Request current balance sheet, trailing-twelve-month cash-flow statement, management burn bridge, and board-approved operating plan.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin
    missingEvidence: Gross margin, cost of goods sold, hosting expense, services margin, and contribution margin by product or customer segment.
    whyItMatters: BigID is clearly a software business, but without gross margin and services mix the margin path cannot be compared credibly against public-security-software benchmarks or used to size burn durability.
    diligencePath: Request audited or management P&L with revenue split between subscription and services, COGS breakout, and cloud/infrastructure expense detail.
    relatedQuestionRefs:
    - QI015
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-recognition
    missingEvidence: Booked ARR, GAAP revenue, subscription-versus-services mix, and deferred-revenue balances for 2024-2026.
    whyItMatters: Public sources mix recurring revenue and total revenue, which makes growth, ACV quality, and valuation-multiple comparisons imprecise.
    diligencePath: Request ARR bridge, annual-recurring-revenue definition, services revenue share, and deferred-revenue schedule from finance leadership.
    relatedQuestionRefs:
    - QI007
    relatedTableRefs:
    - TI001
    - TI003
  - type: conflicting-data
    severity: material
    topic: customer-count
    missingEvidence: Authoritative active-customer count, average contract value, and concentration by top accounts or verticals.
    whyItMatters: Public trackers disagree materially on how many paying customers BigID has, which breaks any attempt to compute ACV, concentration risk, or land-and-expand efficiency from public data.
    diligencePath: Request active-customer count, ARR by customer cohort, top-10-customer concentration, and gross-dollar-retention / NRR schedules.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: debt-obligations
    missingEvidence: Debt schedule, revolving-credit facilities, letters of credit, or any investor side letters that materially alter financing priority.
    whyItMatters: Undisclosed debt or preference structures would affect downside recoveries, future fundraising flexibility, and the interpretation of the secondary-market discount.
    diligencePath: Request debt and preference stack schedules, cap table, investor rights summary, and any credit agreements or security interests.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: minor
    topic: realized-pricing
    missingEvidence: Actual contracted ACVs, average discount rates, proof-of-concept pricing, and marketplace private-offer discount norms.
    whyItMatters: Public review sources confirm quote-based and modular pricing, but not the realized price levels that drive CAC payback and expansion efficiency.
    diligencePath: Request sample order forms, price books, private-offer examples, and win-loss analysis by deal size and channel.
    relatedQuestionRefs:
    - QI002
    - QI003
    - QI004
    relatedTableRefs:
    - TI002
