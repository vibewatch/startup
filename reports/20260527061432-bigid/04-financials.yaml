- id: traction-channel-and-unit-economics
  title: Revenue Traction, Channel Efficiency, and Unit Economics Proxies
  body: |-
    The strongest hard revenue datapoint is company-issued: BigID said in March 2024 that it had reached almost
    $100 million in recurring revenue. Third-party trackers point to a larger total-revenue number by year-end:
    Latka estimates 2024 revenue at $139.5 million after $105.1 million in 2023, while Sacra carries a lower
    $90 million 2023 estimate and earlier 2022 ARR of roughly $74 million. Those figures are directionally
    consistent that BigID is well beyond seed-stage scale, but they do not reconcile cleanly enough to treat as
    one canonical line. The likely issue is metric mixing: recurring revenue, total revenue, and possibly
    services revenue or differing update dates are being blended across trackers.

    Where public evidence is unusually strong is channel efficiency. BigID’s Tackle case study says the company
    made cloud marketplace GTM a preferred route, grew marketplace-related revenue 345% in FY23 and 312% in
    FY24, improved close rates from 18% to 34%, and cut deal-registration time from 5-10 minutes to roughly
    2 minutes. These are channel metrics, not company-wide unit economics, but they are still highly relevant:
    they suggest the GTM machine is getting more efficient in procurement-heavy enterprise sales. Customer-review
    evidence reinforces that the product can create real ROI by reducing manual DSAR and discovery work, while a
    rough revenue-per-employee range of about $193,000 to $279,000 implies BigID is productive but not yet at
    the efficiency level of best-in-class public security software. Customer-count precision remains weak: public
    sources range from 116 customers to more than 265 companies using the product, which is too wide a band for
    confident ACV reconstruction.
