- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing private metric
  - Impact on analysis
  - Exact diligence path
  rows:
  - - Cash on hand, burn, and runway
    - Blocking — cannot assess financing dependency or downside timing without it
    - Request current balance sheet, cash flow statement, monthly burn bridge, and board operating plan
  - - Gross margin and COGS by product / services mix
    - Blocking — margin path cannot be underwritten or compared against public comps
    - Request audited P&L with subscription-versus-services split and cloud / hosting expense breakout
  - - ARR vs GAAP revenue vs services mix
    - Material — public sources mix recurring and total revenue, breaking apples-to-apples growth analysis
    - Request ARR definition, deferred revenue schedule, and services revenue share
  - - Authoritative customer count and ACV
    - Material — conflicting public counts prevent reliable ACV or concentration analysis
    - Request active-customer count, cohort ARR, and top-10-customer concentration
  - - Realized pricing, discounts, and marketplace economics
    - Material — quote-based public pricing does not reveal actual monetization quality
    - Review sample order forms, private offers, price books, and win-loss discounting data
  - - Debt stack and financing rights
    - Material — undisclosed leverage or preference terms would change downside recovery and dilution risk
    - Request debt schedule, cap table, investor rights summary, and side-letter disclosures
  notes: These are the highest-value diligence asks required to move from directional public analysis to investable underwriting confidence.
