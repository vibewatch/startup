company:
  name: BigID
chapter:
  number: 4
  title: Financials
  summary: |-
    BigID monetizes a quote-based, modular enterprise subscription platform spanning core data security, privacy,
    lifecycle, and AI-governance workflows. Public evidence supports nearly $100 million of recurring revenue at the
    March 2024 growth round and a third-party 2024 revenue estimate of about $139.5 million, plus sharply improving
    cloud-marketplace channel metrics; however, gross margin, burn, cash, CAC, and customer-count precision remain
    undisclosed, while Yahoo Finance / Forge secondary pricing around $531.5 million implies material valuation
    compression from the $1 billion-plus 2024 primary round.
sections:
- id: revenue-model-and-pricing
  title: Revenue Model and Pricing Architecture
  body: |-
    BigID is best understood financially as a modular, enterprise-only subscription software platform rather than
    a single-purpose point product. The company’s official platform, AI security, retention, and data-lifecycle
    pages show a common economic pattern: customers buy a core data-discovery and classification layer, then add
    adjacent controls for privacy rights, retention/deletion, AI governance, and broader data-security posture
    management. That matters because it supports expansion revenue without requiring the company to win a totally
    new budget every time; the same underlying data inventory can justify more modules over time.

    Public pricing evidence is intentionally high-level. No self-serve list price, public free tier, or standard
    seat grid is disclosed. Instead, review and marketplace sources describe a quote-led contract model shaped by
    data sources, apps/connectors, deployment model, services/support, and in some cases capacity or data volume.
    Sacra adds a slightly different but compatible lens: pricing appears to scale with team members using the
    software, the amount of data scanned, and advanced features. The practical underwriting takeaway is that
    BigID almost certainly captures revenue through annual enterprise contracts with negotiated scope and module
    attach, but public evidence is too thin to reconstruct realized price levels or discounting. Customer-review
    evidence also suggests the product is positioned as premium, which supports ACV quality but raises the risk
    of heavier discounting in competitive or budget-constrained deals.
