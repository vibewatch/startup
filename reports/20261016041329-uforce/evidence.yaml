evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: commercial-disclosure
    missingEvidence: Exact revenue, ARR, customer count, contract concentration, backlog conversion, and cash-runway data.
    whyItMatters: >-
      The public record is strong on bookings and battlefield proof, but private operating economics drive durability,
      valuation quality, and downside protection.
    diligencePath: >-
      Request current board deck or lender/investor data room materials with revenue bridge, customer concentration,
      collections, and backlog conversion.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: founding-lineage
    missingEvidence: >-
      Legal incorporation date, formal founding entity path, founder list, and merger chronology across the nine-company
      roll-up.
    whyItMatters: >-
      Company identity is good enough for narrative use, but unclear lineage complicates diligence on IP ownership,
      predecessor liabilities, and management attribution.
    diligencePath: >-
      Obtain incorporation records, merger documentation, and an official corporate-history timeline from management
      counsel.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: control-rights
    missingEvidence: Cap table, board seats, protective provisions, secondaries, and any debt or credit facilities.
    whyItMatters: >-
      Public round headlines do not reveal who controls the company or whether financing structure creates hidden senior
      claims on future proceeds.
    diligencePath: Request signed financing documents, updated cap table, board observer rights, and any debt schedule under NDA.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A source-backed TAM, SAM, and SOM breakdown by theater, product family, and buyer segment with explicit
      methodology.
    whyItMatters: >-
      Without a defensible addressable-market model, valuation arguments lean on traction proxies and threat narratives
      instead of budget capture math.
    diligencePath: >-
      Obtain management's sizing methodology, named procurement programs, and an external analyst model that separates
      maritime, aerial, ground, and software layers.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: profitability
    missingEvidence: >-
      Audited revenue, gross margin, bookings definitions, and a reconciliation of profitability claims against public
      non-disclosure statements.
    whyItMatters: >-
      Market quality and conversion efficiency cannot be judged reliably when profitability and revenue disclosure are
      inconsistent across retained sources.
    diligencePath: >-
      Request audited financial statements or management KPI definitions under NDA and reconcile them with the reported
      bookings and funding narrative.
    relatedQuestionRefs:
      - QM002
      - QM008
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-owners
    missingEvidence: >-
      Named non-Ukrainian customers, procurement vehicles, budget owners, and pilot-to-program conversion data by
      geography.
    whyItMatters: >-
      Adoption appears strong in principle, but real market depth depends on whether battlefield interest converts into
      durable funded programs outside wartime Ukraine.
    diligencePath: >-
      Ask management for customer references, contract structures, and program sponsors in the U.S., EU, and Gulf
      regions.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM005
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: peer-benchmark coverage
    missingEvidence: >-
      Independent side-by-side public benchmarks for Quantum Systems, Tekever, Destinus, primes, and internal-build
      substitutes on pricing, support model, and procurement traction.
    whyItMatters: >-
      Without a neutral peer benchmark, the chapter can identify the competitive set but cannot underwrite exact
      relative share or performance economics.
    diligencePath: >-
      Collect independent product reviews, tender results, or customer references for the named peers and compare them
      against the same buying criteria used here.
    relatedQuestionRefs:
      - QP002
      - QP008
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: pricing transparency
    missingEvidence: Contract-level pricing, discounting, sustainment, and support terms for UForce and its named peers.
    whyItMatters: >-
      Public marketing comparisons do not show whether UForce actually wins procurement on total cost of ownership or
      support burden.
    diligencePath: >-
      Request current price sheets, pilot proposals, or procurement paperwork under NDA from UForce and comparable
      vendors.
    relatedQuestionRefs:
      - QP004
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: pricing-and-unit-economics
    missingEvidence: >-
      Product and software price books, realized contract prices, discounting, revenue mix, gross margin by product,
      CAC, sales-cycle duration, win rate, support cost, and payback.
    whyItMatters: >-
      These inputs determine whether reported growth converts into durable contribution margin and whether international
      expansion creates or consumes economic value.
    diligencePath: >-
      Obtain audited management accounts, the contract register, representative domestic and export contracts, SKU-level
      margin schedules, and bid-and-proposal cohort analysis.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash and restricted cash, monthly burn, working-capital schedule, customer advances, capex plan, debt and
      liens, project-finance obligations, downside runway, and next-round trigger.
    whyItMatters: >-
      Funding raised is not cash available, and distributed manufacturing can consume capital before contract delivery,
      acceptance, and collection.
    diligencePath: >-
      Review the latest balance sheet and cash-flow statement, 24-month monthly forecast, financing agreements, covenant
      schedule, capex commitments, and contract milestone terms.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: architecture-transparency
    missingEvidence: >-
      Module-level interface documentation, software-boundary detail, and integration pack material for SICH/C2 and how
      the maritime, aerial, and ground products interoperate.
    whyItMatters: >-
      Without inspectable architecture evidence, it is hard to underwrite integration cost, vendor lock-in, upgrade
      risk, or operational interoperability outside company narratives.
    diligencePath: Request redacted technical architecture diagrams, interface-control documents, and product briefs under NDA.
  - type: private-evidence-only
    severity: material
    topic: security-compliance
    missingEvidence: >-
      Independent evidence of cybersecurity controls, export-control approvals, allied certification pathways, incident
      history, and reliability or support KPIs.
    whyItMatters: >-
      Trust, safety, security, privacy, compliance, and quality controls are part of the chapter brief, but the retained
      public evidence stops at high-level QA and OpSec descriptions.
    diligencePath: >-
      Request security documentation, audit or certification records, incident logs, and customer support metrics by
      product family.
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A public developer-signal or practitioner-community proxy validating software adoption, release cadence, APIs, or
      operator-community engagement.
    whyItMatters: >-
