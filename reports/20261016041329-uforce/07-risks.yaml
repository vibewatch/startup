callouts:
  - calloutType: "risk"
    title: "Top investment risk"
    body: >-
      The thesis can fail even if the products remain tactically relevant: the
      company still must clear export, certification, and partner-execution hurdles
      quickly enough to justify a unicorn valuation without audited commercial proof.
    claimRefs: ["CR002", "CR006", "CR007", "CR012", "CR013"]
  - calloutType: "assumption"
    title: "Most important diligence discriminator"
    body: >-
      The key diligence test is whether current orders and battlefield credibility are
      already converting into signed allied programs with visible acceptance,
      compliance, and cash-collection milestones, rather than remaining mostly
      narrative and booking signals.
    claimRefs: ["CR004", "CR009", "CR011", "CR012"]
