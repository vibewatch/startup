      - "Severity"
      - "Mitigation"
      - "Residual exposure"
    rows:
      - ["Allied government buyers", "Ministries of Defense and military programs", "Primary end customers", "Business model explicitly centers direct government contracts.", "Long procurement cycles or policy shifts slow bookings-to-revenue conversion.", "High", "Battle-proven products and multiple allied geographies.", "High"]
      - ["Industrial scale-out partners", "EU-Ukraine Drone Alliance members and ReconCraft", "Manufacturing and market-entry channel", "Current public scale-out narrative depends on a small number of visible programs.", "JV or localization delays block export capacity and US entry.", "High", "15-location footprint and sovereign-production pitch.", "Medium-High"]
      - ["Capital-markets and valuation support", "Shield Capital, Lakestar, and broader Western investor interest", "Funding and validation channel", "$1B+ valuation was set early relative to disclosed economics.", "Next financing or strategic demand weakens if revenue proof lags.", "High", "Battlefield demand narrative and investor syndicate.", "High"]
    notes: "Counterparties and channels are drawn from current public disclosures; concentration cannot be fully measured without customer, contract, and cap-table detail."
    claimRefs: ["CR002", "CR004", "CR005", "CR011", "CR013"]
