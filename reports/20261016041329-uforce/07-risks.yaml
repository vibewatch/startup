    notes: "Residual ratings emphasize public proof gaps, not a claim that failures have already occurred."
    claimRefs: ["CR007", "CR008", "CR009", "CR010", "CR012"]
  - id: "TR003"
    title: "Partner / dependency risk register"
    columns:
