  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Argument
      - What would change the view
    rows:
      - - Thesis
        - The company has a real price anchor and investor validation after a $50 million unicorn-level round.
        - Audited or lender-grade economics that confirm the headline round did not get ahead of fundamentals.
      - - Thesis
        - EU alliance participation and the ReconCraft path suggest the company can industrialize outside Ukraine.
        - Binding procurement milestones or disclosed follow-on contracts would strengthen channel credibility.
      - - Anti-thesis
        - Public growth and profitability claims remain management- or investor-mediated rather than independently filed.
        - Verified revenue conversion, margin, and cash-collection evidence would reduce this discount.
      - - Anti-thesis
        - Independent commentary still highlights export, corruption, war-zone, and geopolitical risk despite diversification.
        - Evidence that financing, licensing, and scaling frictions are operationally contained would soften compression risk.
    notes: >-
      This table mixes headline facts with interpretive weighting; it is a
      valuation lens, not a substitute for primary financial diligence.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV006
      - CV007
      - CV008
      - CV009
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - EU and US channels convert into sizeable allied procurement, while cost and deployment claims hold in export markets.
        - The round can compound if today’s price proves early versus a large export platform with repeat procurement.
        - Procurement cycles slip, export friction persists, or mission economics fail to travel outside wartime Ukraine.
        - Possible, but needs evidence beyond current public marketing and investor narratives.
      - - Base
        - Strategic relevance is real, but public economics remain incomplete and commercialization proof is still forming.
        - Current valuation is supportable only with tighter terms or deeper diligence, so upside is not yet mispriced in public evidence.
        - Hidden preference stack, weak bookings conversion, or slower-than-expected international scaling.
        - Most consistent with the assigned pool.
      - - Bear
        - Headline demand exists, but revenue quality, financing friction, or governance risk disappoint relative to price.
        - A later round or structured financing resets effective valuation even if the company remains strategically important.
        - Compression can come from terms, timing, or exportability rather than product irrelevance alone.
        - Also plausible because downside evidence is already visible in public coverage.
    notes: >-
      Scenario logic is qualitative because the assigned pool does not include
      audited financials, cap-table terms, or direct valuation comparables.
    claimRefs:
      - CV007
      - CV008
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Public valuation evidence moves from battlefield proof and channel
      expansion to a stretched-but-credible price anchor, then stops at an
      economics-verification gap.
    data:
      nodes:
        - label: Battlefield proof and integrated stack
          detail: Nine-company platform narrative and combat-tested systems create strategic relevance.
        - label: Headline price anchor
          detail: March 2026 funding created a public unicorn-level valuation reference.
        - label: Channel expansion evidence
          detail: EU alliance participation and the ReconCraft path show commercialization routes beyond Ukraine.
        - label: Public economics still thin
          detail: Orders, profitability, and revenue scale are mostly management or investor mediated in the assigned pool.
        - label: Compression risk remains
          detail: Export, governance, geopolitical, and execution friction can erode effective entry value.
        - label: Recommendation
          detail: Keep the company in scope, but require deeper economic and term diligence before underwriting the known price.
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV007
      - CV010
      - CV011
      - CV013
    approximationNotes: null
callouts:
  - calloutType: recommendation
    title: Public-evidence call
    body: >-
      Research more at the known price: the strategic asset is credible, but
      the public record still does not justify treating the March 2026 valuation
      as obviously attractive.
    claimRefs:
      - CV001
      - CV010
      - CV011
      - CV013
  - calloutType: risk
    title: What most threatens the entry case
    body: >-
      The most important open risk is not whether UForce has battlefield demand;
      it is whether reported demand converts into auditable economics and
      investor-friendly round terms quickly enough to defend a unicorn entry.
    claimRefs:
      - CV003
      - CV004
      - CV008
      - CV010
      - CV014
