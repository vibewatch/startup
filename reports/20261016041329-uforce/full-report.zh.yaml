        title: 变现似乎由合同驱动，但经济性藏在采购之后
        blocks:
          - type: paragraph
            body: >-
              UFORCE 将自主系统和指挥控制能力销售或交付给政府及盟军采购渠道，但现有来源没有披露产品价格、软件费、合同期限、折扣安排或收入结构。CEO
              称乌克兰供应受限的采购模式是在生产成本之上支付利润并购买可用产量；UFORCE 官网则声称效率高 两点五倍、任务成本比替代方案低 十倍。前者未必适用于乌克兰以外，后者是未经审计且未披露分母的公司比较。EUR1
              billion 采购拨款是市场池，不是 UFORCE 收入。要确认实际定价、付款里程碑、验收风险和渠道经济性，仍需合同样本。
