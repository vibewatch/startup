  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 欧盟和美国渠道转化为规模可观的盟友采购，同时成本和部署方面的说法在出口市场站得住脚。
        - 如果今天的价格相对于一个能持续获得采购的大型出口平台仍显早期，这轮融资的价值有望继续复利。
        - 采购周期推迟、出口阻力持续，或任务经济性无法从战时乌克兰复制到其他市场。
        - 有可能，但需要超出当前公开营销材料和投资者叙事的证据。
      - - 基准
        - 战略价值确实存在，但公开披露的经济数据仍不完整，商业化证据也还在形成。
        - 当前估值只有在条款更严或尽调更深入时才站得住，因此公开证据尚未显示上行空间被错误定价。
        - 隐性的优先股堆叠、订单转化偏弱，或国际扩张慢于预期。
        - 与本次分配到的证据池最一致。
      - - 悲观
        - 头部需求确实存在，但相对于当前价格，收入质量、融资阻力或治理风险可能令人失望。
        - 即使公司仍具战略重要性，后续融资或结构化融资也可能重置实际估值。
        - 估值压缩可能来自条款、时点或可出口性，而不只是产品失去相关性。
        - 这同样合理，因为公开报道中已经能看到下行证据。
    notes: 情景逻辑是定性的，因为本次分配到的证据池不包含经审计财务报表、股权结构条款或直接估值可比项。
