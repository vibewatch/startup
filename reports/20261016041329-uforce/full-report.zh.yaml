  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与可比公司
        blocks:
          - type: paragraph
            body: >-
              公开记录指向广泛的竞争集合，而不是一份干净的可比公司名单。多份 2026 年来源称 UForce 由覆盖空、海、陆的 9 家乌克兰国防公司整合而成；BattlePolicy 则称公司在伦敦把 MAGURA
              战绩包装成面向西方的销售故事。因此替代方案包括具名的西方战场同业、传统海军和反无人机项目、内部自研或部队改装团队，以及能把自主软件、制造和指挥控制打包成采购友好方案的邻近集成商。现有证据中最直接的具名同业是
              Quantum Systems、Tekever 和 Destinus，但名单来自 CEO 访谈而非独立基准，更适合视为方向性可比集合，而非完整市场地图。
            claimRefs:
              - CP001
              - CP003
              - CP009
              - CP013
