  summary: >-
    UForce 是一家总部位于伦敦的国防科技公司，把经实战验证的乌克兰无人系统整合成覆盖多域的盟军解决方案。公开记录显示，这家公司由并购整合而来，由 Oleg Rogynskyy 领导，管理层包括 Oleksiy Honcharuk
