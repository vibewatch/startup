      - number: '2.3'
        title: 买方拉力真实存在，但转化取决于战区需求和采购摩擦
        blocks:
          - type: paragraph
            body: >-
              采用动力似乎更多来自具体战区的运营紧迫性，而不是抽象的 AI 或机器人预算。Shield Capital 访谈称有 4 个活跃需求战区：买方需要海上拒止、反无人机、ISR 和远程载荷投送时，海事 Magura
              系列最重要；军方期待 20–50 km 陆上打击效果时，Nemesis 需求上升。Tectonic 对 ReconCraft
              的报道显示，美国市场路径是先本地化工业能力，再扩大项目采用。相同来源也暴露出主要约束：乌克兰以外的买方仍需把战场紧迫性转化为正式采购周期、认证和预算归属，而西方流程明显慢于 UForce
              归因于乌克兰产品市场匹配的战时迭代速度。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
