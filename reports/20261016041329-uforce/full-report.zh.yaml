              - CO014
              - CO015
      - number: '1.2'
        title: 管理层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              公开披露中最明确的运营负责人是 CEO Oleg Rogynskyy。他既是主要对外发言人，也是连接乌克兰战场产品与西方资本市场扩张逻辑的桥梁。公开材料将他与董事长 Oleksiy
              Honcharuk、英国前国防大臣 Ben Wallace 并列，为这家仍然不透明的私营企业带来罕见的高层政治与国防网络背书。UForce 还成立了由 Sean Plankey
              领导的美国扩张部门，其经历集中在美国国土安全、关键基础设施和华盛顿关系。优势是横跨乌克兰、英国和美国的可信度；风险则是对少数具名管理者的依赖明显，而董事会构成、投票控制、经济利益和继任安排公开有限。
            claimRefs:
              - CO009
              - CO010
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO009
              - CO010
              - CO011
      - number: '1.3'
        title: 融资、规模与里程碑解读
        blocks:
          - type: paragraph
            body: >-
              最强的公开融资数据点是 2026 年 3 月融资：UForce 官方材料披露首轮融资由 Shield Capital 和 Lakestar 领投、Ballistic Ventures 参与；独立报道则称融资约为
              $50 million，估值超过 $1B（10 亿美元）。规模披露方向明确但不够精确。公司和媒体来源都指向截至 2026 年 3 月在 6 个盟国设有超过 15 个地点、员工至少 1,000
              人；之后一场保留的投资人访谈则称员工数已达到约 1,300–1,400 人。订单证据同样有支持力，但还不能替代收入：公开来源称订单额达到 9 位数或数亿美元，2025 年增速约在 450% 至接近 500%
              之间，但现有来源没有一家提供经审计收入、ARR、客户数或集中度数据。里程碑证据仍显示，公司正通过欧盟—乌克兰无人机联盟、围绕 MAGURA 的美国制造合作，以及 UForce USA
              的专门管理层，从乌克兰走向欧盟和美国工业渠道。公开记录的主要不利因素是，独角兽叙事仍处于受出口管制、腐败担忧和战时运营不稳定影响的行业中。
