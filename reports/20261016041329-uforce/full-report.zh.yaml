  - id: FV001
    title: 投资建议逻辑
    type: flow
    summary: 公开估值证据从战场证明和渠道扩张，推到偏高但仍可信的价格锚点，随后止步于经济性验证缺口。
    data:
      nodes:
        - label: 战场证明与整合技术栈
          detail: 九家公司平台叙事和经过实战检验的系统，构成了战略相关性。
        - label: 头部价格锚点
          detail: 2026 年 3 月融资形成了公开的独角兽级估值参考。
        - label: 渠道扩张证据
          detail: 参与欧盟联盟以及 ReconCraft 路径，显示出乌克兰之外的商业化路线。
        - label: 公开经济数据仍薄弱
          detail: 在本次分配证据池中，订单、盈利能力和收入规模主要依赖管理层或投资者口径。
        - label: 压缩风险仍在
          detail: 出口、治理、地缘政治和执行阻力可能侵蚀实际入场价值。
        - label: 投资建议
          detail: 保留对公司的关注，但在按已知价格做投资判断前，要求更深入地核查经济性和融资条款。
