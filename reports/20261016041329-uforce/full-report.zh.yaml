      - number: '3.2'
        title: 能力、定价与渠道比较
        blocks:
          - type: paragraph
            body: >-
              UForce 的比较优势叙事围绕战场验证、模块化维修和扩大的盟军分销，而不是透明的公开价格。官网称海上拒止效果只需传统成本的一小部分；Tectonic 则提供本资料池唯一具体的公开单价信号：一架 MAGURA
              可作为单程攻击艇使用，价格低于 $500,000。同样重要的是渠道正在变化：ReconCraft
              合作协议创造了美国生产路径，欧盟—乌克兰无人机联盟则提供进入联合生产和技术转让项目的正式通道。这些动作缓解了战时乌克兰供应商的典型劣势：可出口性有限、盟军采购体系中的本地支持薄弱。
