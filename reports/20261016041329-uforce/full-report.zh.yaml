        title: 图表
        blocks:
          - type: callout
            title: UForce 以工业化方案竞争，而不只是无人机供应商
            body: 现有证据最清晰的共同点是：UForce 把经战场验证的硬件、自主软件、指挥控制、美国制造和欧盟联盟渠道打包成一套采购故事，使可比范围超出纯 UAV 或 USV 供应商。
            calloutType: insight
