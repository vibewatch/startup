            - 与 Unit 412 Nemesis 配对开发
            - 操作员规模描述为 100 → 1,000 → 5,000
        - label: 订单额与供应扩张
          actor: 管理层和投资者
          detail: 订单额增长和盟友生产布局显示需求，但不能证明客户已实现多元化。
          touchpoints:
            - 2025 年订单额增长 450%
            - 覆盖 6 个欧洲盟友国家的 15 个地点
        - label: 进入欧盟工业体系
          actor: 联盟与联合生产渠道
          detail: 欧盟—乌克兰无人机联盟扩大了市场准入，但联盟本身不能证明已获得订单。
          touchpoints:
            - 18 个创始成员
            - 技术转让和联合生产框架
        - label: 美国本地化
          actor: ReconCraft 以及美国测试 / 采购相关方
          detail: ReconCraft 增加了一条本地化路径，但终端客户转化在公开材料中仍未得到验证。
          touchpoints:
            - 在俄勒冈州和南卡罗来纳州达成 MAGURA 团队合作协议
            - Tectonic 提到的出口至测试路径
        - label: 盟友持续采购
          actor: 已点名的北约和美国终端客户
          detail: 这是缺失的证明环节：公开材料尚未披露持久的西方采购胜果。
          touchpoints:
            - 未披露 NRR、GRR 或续约
            - 没有点名的西方生产客户名单
    approximationNotes: 阶段体现的是公开证明漏斗，而非已披露的内部销售流程。
