  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 公开增长势头强，但指标体系尚无法对账
        blocks:
          - type: paragraph
            body: >-
              公开记录有多个强劲但定义不同的增长信号。UFORCE 告诉 UK Defence Journal，其 2025 年订单簿已达 9 位数。Dealroom 和 The Defender
              分别报道订单额达数亿美元、2025 年收入增长 450%，Dealroom 还称公司已盈利。2026 年 6 月投资人播客中，CEO Oleg Rogynskyy 称自己在公司成立两年半后加入时，收入已超过
              $100 million。这些指标不能互换：订单簿和订单额先于收入确认，收入门槛没有给出期间或会计口径，盈利也没有经审计定义。因此证据支持公司已具备相当规模，但不能建立从签约需求到确认收入、回款或毛利的清晰桥梁。
            claimRefs:
              - CI003
