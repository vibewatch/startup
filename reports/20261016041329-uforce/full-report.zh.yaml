      - number: '4.3'
        title: 分布式制造提升韧性，但增加资本复杂度
        blocks:
          - type: paragraph
            body: >-
              运营模式高度依赖硬件和生产。第三方报道称，公司在 6 个盟国的 15 个地点制造；CEO 称供应链遭定向打击后，UFORCE 已把电机、摄像头、云台、电池包、机架、船体和电路板内制。纵向整合可能保护供给并支持
              NDAA
              合规，但也把库存、劳动力、工装、质量和营运资金集中在公司内部。公开来源没有量化物料清单、人工吸收、保修或现场支持成本、利用率、库存周转、资本开支或按产品划分的毛利率。因此，公司声称的盈利能力和较低任务成本主张尚不能转化为可持续的利润率画像。
