  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界是多域国防自主系统，而非全部国防支出
        blocks:
          - type: paragraph
            body: >-
              现有证据支持的市场边界比“国防科技”整体更窄。UForce
              被定位为横跨空、陆、海的经实战验证自主系统供应商，邻近支出包括反无人机、指挥控制和遥控武器层，而不是泛化的软件预算。官网和第三方公司简介都将其描述为面向盟军的国防自主系统组合；官网还明确把成本与传统海事资产比较。因此相关市场包括战术无人平台、自主
              / C2 软件，以及本国组装和培训等本地化服务，但不包括大多数不依赖自主或反无人机流程的传统国防采购。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 需求体现于采购和增长代理指标，而非完整 TAM 体系
        blocks:
          - type: paragraph
            body: >-
              公开证据更支持需求代理视角，而非经典 TAM / SAM / SOM 模型。最清晰的预算信号是联盟宣布为乌克兰无人机采购追加 EUR 1 billion；媒体和后续摘要称 UForce 已实现盈利，2025
              年订单额大幅增长至数亿美元。这些都能证明买方已经为该品类拨款，但不能替代经审计的收入质量、可服务市场方法或逐项目份额模型。报道中的美国生产计划和潜在融资谈判扩大了机会想象，但潜在的 $5 billion
              估值仍只是未完成的讨论。因此本章用采购、订单和产能三个视角叠加判断市场规模，而不是给出完整的自上而下模型。
