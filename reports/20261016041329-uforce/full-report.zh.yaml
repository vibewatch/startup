chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与组建
        blocks:
          - type: paragraph
            body: >-
              UForce
              将自己定位为一家英国国防科技公司，把经实战验证的乌克兰无人系统和自主软件提供给覆盖空、海、陆的盟军。它更像平台集成商和出口商，而不是单一产品初创公司：官方材料强调快速采用并将经过战场验证的能力投入运营，官网则突出主权生产、开放式指挥控制架构和低成本威慑。公开组建证据指向整合，而非白手起家的创立。独立来源和合作方来源称
              UForce 由 9 家乌克兰国防公司合并而成；CEO 后来表示，自己加入时这项并购整合已经启动，企业也已在运营。因此当前身份基本清晰，但在现有证据中，确切注册日期、法律组建顺序和创始人归属仍不完整。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO009
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO005
