      - number: '3.3'
        title: 持续性与替代风险
        blocks:
          - type: paragraph
            body: >-
              护城河真实存在，值得关注，但现有证据也解释了它为何可能随时间收窄。投资人访谈称 UForce 胜在系统简单、可在现场改装且经战场验证；管理层称公司已把关键部件内制，以满足 NDAA
              合规并降低对定向供应链的脆弱性。即便如此，独立报道仍指出出口限制、腐败担忧和地缘政治不稳定；任务量披露也从多篇报道中的超过 150,000 漂移到 CEO 后续访谈中的 220,000。买方可能重视 UForce
              的战绩，但资金更充足的西方竞争者或主承包商仍可凭借渠道、更清晰的文档、可重复的支持模型和独立验证的绩效经济性缩小差距。
            claimRefs:
              - CP006
              - CP007
              - CP010
              - CP011
              - CP014
