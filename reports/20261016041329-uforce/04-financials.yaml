schemaVersion: "report-v2"
artifact: financials
slug: uforce
runDate: 2026-10-16
company:
  name: UForce
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence indicates substantial commercial activity: UFORCE has reported a nine-figure
    2025 order book, third parties reported hundreds of millions of dollars of bookings and 450%
    revenue growth in 2025, and the CEO described revenue above $100 million before he joined.
    However, the evidence set does not disclose audited revenue, pricing, gross margin, cash,
    burn, runway, or contract-level conversion, so capital adequacy and revenue quality remain
    material underwriting gaps.
sections:
  - id: revenue-quality
    title: Public traction is substantial, but the metric stack is not yet reconcilable
    body: >-
      The public record contains several strong but differently defined traction signals. UFORCE
      told UK Defence Journal that its 2025 order book had reached nine figures. Dealroom and The
      Defender separately reported bookings in the hundreds of millions of dollars and 450%
      revenue growth in 2025, while Dealroom also described the company as profitable. In a June
      2026 investor podcast, CEO Oleg Rogynskyy said the business was already above $100 million
      of revenue when he joined two and a half years after formation. These are not interchangeable
      measures: order book and bookings precede recognition, the revenue threshold has no stated
      period or accounting basis, and reported profitability lacks an audited definition. The
      evidence therefore supports meaningful scale, but not a clean bridge from signed demand to
      recognized revenue, collected cash, or gross profit.
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI016
    tableRefs:
      - TI001
  - id: monetization-and-gtm
    title: Monetization appears contract-led, with economics hidden behind procurement
    body: >-
      UFORCE sells or delivers autonomous systems and command-and-control capabilities into
      government and allied procurement channels, but no retained source publishes a product
      price, software fee, contract duration, discount schedule, or revenue mix. The clearest
      economics disclosed publicly are contextual rather than contractual: the CEO described
      Ukraine's supply-constrained procurement model as paying a margin over production cost and
      buying available output, while UFORCE's website claims 2.5 times greater efficiency at ten
      times lower mission cost than alternatives. The first statement may not apply outside
      Ukraine, and the second is an unaudited company comparison without a disclosed denominator.
      EU-Ukraine industrial programs expand the opportunity set, but the announced EUR1 billion
      procurement allocation is a market pool, not UFORCE revenue. Contract samples are required
      to establish realized pricing, payment milestones, acceptance risk, and channel economics.
    claimRefs:
      - CI010
      - CI011
      - CI012
      - CI016
    tableRefs:
      - TI002
    figureRefs:
      - FI001
  - id: cost-structure
    title: Distributed manufacturing improves resilience while increasing capital complexity
    body: >-
      The operating model is hardware- and production-intensive. Third-party reports describe
      manufacturing across 15 locations in six allied countries, and the CEO said UFORCE
      internalized motors, cameras, gimbals, battery packs, frames, hulls, and circuit boards after
      supply chains were targeted. That vertical integration may protect availability and support
      NDAA compliance, but it also concentrates inventory, labor, tooling, quality, and working
      capital inside the company. The CEO separately described early difficulty obtaining bank
      working capital, although he said that was no longer an issue. Public sources do not quantify
      bill of materials, labor absorption, warranty or field-support cost, utilization, inventory
      turns, capex, or gross margin by product. Accordingly, claims of profitability and lower
      mission cost cannot yet be translated into a durable margin profile.
    claimRefs:
      - CI009
      - CI013
      - CI014
      - CI016
    tableRefs:
      - TI003
  - id: capital-adequacy
    title: The $50 million seed round funds expansion, not a demonstrated runway
    body: >-
      Multiple publications reported a $50 million seed financing at a valuation above $1 billion,
      led by Lakestar and Shield Capital with additional named investors. Vestbee reported that
      proceeds would expand manufacturing across allied countries and increase output. The
      round-by-round chronology is covered in Company Overview; financially, the disclosed raise
      is an inflow, not evidence of current cash, because acquisition consideration, working-capital
      consumption, capex, and post-close spending are not public. Expansion into distributed
      production and participation in EU-Ukraine industrial programs may support demand and
      capacity, yet Dealroom's adverse discussion highlights export restrictions, corruption
      concerns, war-zone instability, and persistent geopolitical risk. Without a current balance
      sheet, monthly cash burn, debt and project-finance obligations, customer advances, or
      milestone-payment terms, runway and the next financing trigger cannot be underwritten.
    claimRefs:
      - CI001
      - CI002
      - CI008
      - CI011
      - CI014
      - CI015
      - CI016
callouts:
  - calloutType: insight
    title: Traction is real enough to diligence, but not yet comparable
    body: >-
      Bookings, order book, revenue growth, a historical revenue threshold, and reported
      profitability point in the same direction, but their periods and accounting bases do not
      reconcile. Management should provide a bookings-to-revenue-to-cash bridge before these
      figures are used in valuation.
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI016
  - calloutType: risk
    title: Financing raised is not cash available
    body: >-
      The $50 million seed round supports manufacturing expansion, but public evidence does not
      establish closing cash, acquisition uses, current liquidity, burn, or debt. The capital
      adequacy conclusion therefore remains open.
    claimRefs:
      - CI001
      - CI008
      - CI016
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns:
      - Stream
      - Mechanism and unit
      - Public value or status
      - Evidence quality
      - Diligence ask
    rows:
      - - Autonomous air, land, and sea systems
        - Government or allied procurement; platform and contract units
        - Nine-figure 2025 order book was company-reported
        - Directionally strong; no customer, price, duration, or acceptance detail
        - Contract register with booked value, delivery schedule, acceptance terms, and collected cash
      - - Command-and-control software
        - Software capability delivered with multi-domain systems
        - No standalone software pricing or revenue mix disclosed
        - Product existence is public; monetization is not
        - SKU-level recurring, license, support, and bundled-revenue schedule
      - - Manufacturing and localization
        - Production and assembly across allied-country locations
        - Expansion is a stated use of the seed proceeds
        - Capacity footprint is reported; commercial terms and utilization are absent
        - Site capacity, utilization, capex, labor, and transfer-pricing schedule
      - - Ukrainian capacity procurement
        - CEO-described cost-plus margin on available production
        - Scope is the Ukrainian supply-constrained procurement context
        - Useful mechanism proxy; not proven for UFORCE's international contracts
        - Representative domestic and export contracts showing pricing and margin mechanics
    notes: >-
      Partial public-source map as of 2026-10-16; order book and bookings are not revenue, and
      undisclosed values are shown as gaps rather than estimates.
    claimRefs:
      - CI003
      - CI008
      - CI009
      - CI012
      - CI016
  - id: TI002
    title: Pricing and monetization evidence
    columns:
      - Item
      - Public price or unit
      - List versus realized status
      - Qualification
      - Diligence ask
    rows:
      - - Autonomous platforms
        - Not disclosed
        - Neither list nor realized price is public
        - Product breadth is visible, but pricing and discounts are unavailable
        - Price book and realized average selling price by platform and geography
      - - Command-and-control software
        - Not disclosed
        - Bundling versus standalone licensing is unknown
        - No recurring revenue, support, or maintenance split is public
        - Software attach rate, license term, support fee, and renewal data
      - - Ukrainian production procurement
        - Margin over production cost, according to the CEO
        - Procurement-system description, not a disclosed UFORCE contract
        - Country-specific mechanism may not transfer to allied tenders
        - Contract sample reconciling allowable cost, margin, milestones, and cash timing
      - - Claimed mission economics
        - 2.5x more efficient and 10x lower cost per mission
        - Company comparison; no list price or source denominator
        - Operational-cost claim is not realized company revenue or gross margin
        - Buyer-validated total-cost benchmark with mission definition and comparator set
      - - EU-Ukraine procurement support
        - EUR1 billion additional allocation for Ukrainian drone procurement
        - Addressable program funding, not UFORCE revenue
        - UFORCE's share, award timing, and contract terms are undisclosed
        - Award notices, framework position, committed value, and delivery milestones
    notes: >-
      Public values mix a procurement mechanism, a company cost comparison, and program-level
      funding; none is treated as realized UFORCE pricing.
    claimRefs:
      - CI010
      - CI011
      - CI012
      - CI016
  - id: TI003
    title: Unit economics and capital adequacy scorecard
    columns:
      - Metric
      - Public value or status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Revenue
        - CEO said revenue was above $100 million when he joined; period and currency were not stated
        - Medium
        - Establishes scale but not current recognized revenue
        - Audited monthly revenue by product, geography, and recognition policy
      - - 2025 order book
        - Nine figures, according to the company
        - Medium
        - Indicates demand but not delivery, acceptance, or collection
        - Opening-to-closing order-book bridge with cancellations and deliveries
      - - Bookings
        - Hundreds of millions of dollars, third-party reported
        - Medium
        - Supports pipeline scale but may overlap the order-book claim
        - Signed booking ledger with customer, value, funding source, and termination rights
      - - 2025 revenue growth
        - 450%, third-party reported
        - Medium
        - Growth rate lacks disclosed base, currency, and recognition policy
        - Audited 2024 and 2025 revenue bridge on a consistent basis
      - - Profitability
        - Reported as profitable by Dealroom
        - Low
        - EBITDA, operating profit, and cash generation can diverge materially
        - Audited income statement and definition of the profitability measure
      - - Gross margin
        - Not publicly disclosed
        - Unavailable
        - Determines whether scale absorbs manufacturing and support costs
        - Gross margin by platform, software, geography, and contract type
      - - CAC and payback
        - Not publicly disclosed
        - Unavailable
        - Government pursuit cost and tender timing can consume growth capital
        - Bid-and-proposal spend, sales cycle, win rate, and contribution payback by market
      - - Cash, burn, and runway
        - Not publicly disclosed
        - Unavailable
        - The seed raise does not establish remaining liquidity
        - Current cash, restricted cash, monthly net burn, and downside runway
      - - Debt and project finance
        - Not publicly disclosed
        - Unavailable
        - Financing obligations can subordinate equity and constrain production
        - Debt schedule, liens, covenants, customer advances, and project-finance commitments
    notes: >-
      No private estimates are inserted. Reported metrics retain their original labels and periods;
      null fields require management evidence rather than modelled precision.
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI014
      - CI016
figures:
  - id: FI001
    title: Public-evidence revenue-to-cash diligence flow
    type: flow
    summary: >-
      An ordered underwriting framework showing where public evidence exists and where contract
      economics remain unavailable; it is not a verified conversion funnel.
    data:
      nodes:
        - id: opportunity
          label: Procurement opportunity
          detail: EU-Ukraine programs and allied demand expand the opportunity pool, but allocations are not company revenue.
        - id: booking
          label: Booking or order
          detail: Nine-figure order book and hundreds of millions of bookings are reported without a contract ledger.
        - id: financing
          label: Working-capital funding
          detail: Advance payments, debt, project finance, and milestone financing are not disclosed.
        - id: production
          label: Production and in-sourced components
          detail: Distributed sites and vertical integration imply inventory, labor, and capex requirements.
        - id: acceptance
          label: Delivery and acceptance
          detail: Acceptance criteria, cancellation rights, and timing are not disclosed.
        - id: recognition
          label: Recognized revenue
          detail: A historical revenue threshold is public, but period and recognition policy are not.
        - id: cash-profit
          label: Cash collection and gross profit
          detail: Collection timing, gross margin, burn, and runway remain private-evidence gaps.
    approximationNotes: >-
      Ordered diligence framework only; node order does not assert actual contract timing,
      conversion rates, or value-proportional magnitude.
    claimRefs:
      - CI007
      - CI008
      - CI011
      - CI012
      - CI013
      - CI016
