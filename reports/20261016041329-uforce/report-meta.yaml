companyProfile:
  summary: >-
    UForce is a London-headquartered defense technology company that consolidates combat-proven Ukrainian unmanned
    systems into a multi-domain allied offering. The public record shows a company built through merger, led by Oleg
    Rogynskyy with Oleksiy Honcharuk and Ben Wallace on the leadership bench, and extending through a U.S. expansion
    layer under Sean Plankey. Its portfolio spans sea, air, ground, and C2/autonomy products, but the public evidence
    still leaves exact incorporation history, ownership, and operating economics materially underdisclosed.
