      - number: '2.3'
        title: Buyer pull is real, but conversion depends on theater needs and procurement friction
        blocks:
          - type: paragraph
            body: >-
              Adoption appears to be driven by theater-specific operational urgency more than by abstract AI or robotics
              budgets. In the Shield Capital interview, management describes four active demand theaters and says the
              maritime Magura family matters most where buyers need sea denial, counter-UAS, ISR, and long-range payload
              delivery, while Nemesis demand rises where militaries expect 20-50 km land effects. Tectonic's ReconCraft
              story suggests the U.S. go-to-market path is industrial localization first and scaled program uptake
              second. The same sources also surface the principal constraints: buyers outside Ukraine still have to
              translate battlefield urgency into formal procurement cycles, certification, and budget ownership, and
              those Western processes move materially slower than the wartime iteration loop UForce credits for
              product-market fit in Ukraine.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Proxy-rich, TAM-poor market evidence
            body: >-
              Public evidence is strong enough to show multi-theater buyer pull, but not strong enough to close a
              classical TAM/SAM/SOM exercise without management or program-level disclosure.
            calloutType: insight
            claimRefs:
