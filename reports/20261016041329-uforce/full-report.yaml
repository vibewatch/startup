        title: Exhibits
        blocks:
          - type: callout
            title: UForce competes as an industrial package, not just a drone vendor
            body: >-
              The strongest pattern across the assigned evidence is that UForce is packaging battlefield-validated
              hardware, autonomy software, command-and-control, US manufacturing, and EU alliance access into one
              procurement story, widening the comparison set beyond pure UAV or USV vendors.
            calloutType: insight
            claimRefs:
