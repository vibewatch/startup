  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary is multi-domain defense autonomy, not all defense spend
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports a narrower market boundary than "defense technology" overall. UForce is
              positioned as a supplier of combat-proven autonomous systems across air, land, and sea, with adjacent
              spend in counter-drone, command-and-control, and remote-weapon layers rather than a generic software
              budget. The official homepage and third-party company profile both frame the offer as a bundled
              defense-autonomy stack for allied militaries, while the homepage's cost language explicitly compares the
              offer with conventional maritime assets. That means the relevant market includes tactical unmanned
              platforms, autonomy/C2 software, and localization services such as in-country assembly and training, but
              excludes most conventional defense procurement that does not depend on autonomous or counter-UAS
              workflows.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Demand is visible through procurement and traction proxies, not a full TAM stack
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a demand-proxy view rather than a classical TAM/SAM/SOM model. The clearest
              budget signal is the alliance announcement tied to an additional EUR 1 billion for Ukrainian drone
              procurement, while media coverage and follow-on summaries say UForce became profitable and grew bookings
              sharply in 2025 to hundreds of millions of dollars. Those are useful proof points that buyers are already
              allocating money to the category, but they are not substitutes for audited revenue quality,
              addressable-market methodology, or a program-by-program share model. Reported U.S. production ambitions
              and prospective financing talks expand the perceived opportunity, yet the prospective $5 billion valuation
              was still described as an unclosed discussion. The chapter therefore treats market size as a stack of
              procurement, bookings, and capacity lenses rather than a completed top-down market model.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
