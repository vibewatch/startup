  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and peer set
        blocks:
          - type: paragraph
            body: >-
              The public record in this worker pool points to a broad competitive set rather than one clean peer list.
              Multiple 2026 sources describe UForce as a consolidation of nine Ukrainian defense companies spanning air,
              sea, and land, while BattlePolicy characterizes the company as turning the MAGURA record into a Western
              sales pitch from London. That means the alternatives include named Western battlefield peers, conventional
              naval and counter-UAS programs, internal build or unit-modification teams, and adjacent integrators that
              can package autonomy software, manufacturing, and command-and-control into a procurement-friendly bundle.
              The most direct named peers in the assigned evidence are Quantum Systems, Tekever, and Destinus, but that
              list comes from CEO commentary rather than an independent benchmark, so it is better treated as a
              directional peer set than a complete market map.
