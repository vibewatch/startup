chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and formation
        blocks:
          - type: paragraph
            body: >-
              UForce describes itself as a UK-based defense technology company packaging battle-proven Ukrainian
              unmanned systems and autonomy software for allied militaries across air, sea, and land. The business model
              is closer to a platform integrator and exporter than a single-product startup: official materials
              emphasize rapid adoption and operationalization of existing combat-tested capabilities, while the public
              website foregrounds sovereign production, open command-and-control architecture, and lower-cost
              deterrence. Public formation evidence points to consolidation rather than a clean-sheet founding event.
              Independent and partner-linked sources describe UForce as the combination of nine Ukrainian defense
              companies, while the CEO later said he joined an already-operating business after the merger path had
              started. That makes the present identity legible, but leaves exact incorporation date, legal formation
              sequence, and founder attribution incomplete in the assigned evidence set.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO009
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO014
              - CO015
      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              The clearest disclosed operator is CEO Oleg Rogynskyy, who is both the primary external spokesperson and
              the bridge between Ukrainian battlefield products and Western capital-market scaling logic. Public
              materials pair him with chairman Oleksiy Honcharuk and former UK Defence Secretary Ben Wallace, giving the
              company unusually senior political and defense-network signaling for a still-opaque private business.
              UForce has also stood up a US expansion arm led by Sean Plankey, whose background sits squarely in US
              homeland security, critical infrastructure, and Washington relationships. The upside is credibility across
              Ukraine, the UK, and the US; the downside is visible concentration around a small bench of named
              operators, with limited public disclosure on board composition, voting control, economics, or succession.
            claimRefs:
              - CO009
              - CO010
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO009
              - CO010
              - CO011
      - number: '1.3'
        title: Funding, scale, and milestone read-through
        blocks:
          - type: paragraph
            body: >-
              The strongest public financing datapoint is the March 2026 round: official UForce materials disclosed an
              initial funding close led by Shield Capital and Lakestar with Ballistic Ventures participating, while
              independent coverage translated that round into roughly $50 million at a valuation above $1 billion. Scale
              disclosures are directionally strong but imprecise. Company and media sources align on more than 15
              locations across six allied countries and at least 1,000 personnel by March 2026, while a later retained
              investor-hosted interview suggested headcount had already moved into the roughly 1,300-1,400 range.
              Bookings evidence is similarly supportive but not clean enough to stand in for revenue: public sources
              point to nine-figure or hundreds-of-millions bookings with 2025 growth somewhere between about 450% and
              close to 500%, yet none of the assigned sources provides audited revenue, ARR, customer count, or
              concentration data. Milestone evidence nonetheless shows a company pushing outward from Ukraine into EU
              and US industrial channels through the EU-Ukraine Drone Alliance, a US manufacturing partnership around
              MAGURA, and a dedicated UForce USA leadership layer. The main adverse note in the public record is that
              the unicorn narrative still sits inside a sector exposed to export controls, corruption concerns, and
              wartime operating instability.
            claimRefs:
