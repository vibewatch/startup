  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Public traction is substantial, but the metric stack is not yet reconcilable
        blocks:
          - type: paragraph
            body: >-
              The public record contains several strong but differently defined traction signals. UFORCE told UK Defence
              Journal that its 2025 order book had reached nine figures. Dealroom and The Defender separately reported
              bookings in the hundreds of millions of dollars and 450% revenue growth in 2025, while Dealroom also
              described the company as profitable. In a June 2026 investor podcast, CEO Oleg Rogynskyy said the business
              was already above $100 million of revenue when he joined two and a half years after formation. These are
              not interchangeable measures: order book and bookings precede recognition, the revenue threshold has no
              stated period or accounting basis, and reported profitability lacks an audited definition. The evidence
              therefore supports meaningful scale, but not a clean bridge from signed demand to recognized revenue,
              collected cash, or gross profit.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI016
          - type: table
            tableRef: TI001
            claimRefs:
              - CI003
              - CI008
              - CI009
              - CI012
              - CI016
      - number: '4.2'
        title: Monetization appears contract-led, with economics hidden behind procurement
        blocks:
          - type: paragraph
            body: >-
              UFORCE sells or delivers autonomous systems and command-and-control capabilities into government and
              allied procurement channels, but no retained source publishes a product price, software fee, contract
              duration, discount schedule, or revenue mix. The clearest economics disclosed publicly are contextual
              rather than contractual: the CEO described Ukraine's supply-constrained procurement model as paying a
              margin over production cost and buying available output, while UFORCE's website claims 2.5 times greater
              efficiency at ten times lower mission cost than alternatives. The first statement may not apply outside
              Ukraine, and the second is an unaudited company comparison without a disclosed denominator. EU-Ukraine
              industrial programs expand the opportunity set, but the announced EUR1 billion procurement allocation is a
              market pool, not UFORCE revenue. Contract samples are required to establish realized pricing, payment
              milestones, acceptance risk, and channel economics.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI016
          - type: table
            tableRef: TI002
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI007
              - CI008
              - CI011
              - CI012
              - CI013
              - CI016
      - number: '4.3'
        title: Distributed manufacturing improves resilience while increasing capital complexity
        blocks:
          - type: paragraph
            body: >-
              The operating model is hardware- and production-intensive. Third-party reports describe manufacturing
              across 15 locations in six allied countries, and the CEO said UFORCE internalized motors, cameras,
              gimbals, battery packs, frames, hulls, and circuit boards after supply chains were targeted. That vertical
              integration may protect availability and support NDAA compliance, but it also concentrates inventory,
              labor, tooling, quality, and working capital inside the company. The CEO separately described early
              difficulty obtaining bank working capital, although he said that was no longer an issue. Public sources do
              not quantify bill of materials, labor absorption, warranty or field-support cost, utilization, inventory
              turns, capex, or gross margin by product. Accordingly, claims of profitability and lower mission cost
              cannot yet be translated into a durable margin profile.
            claimRefs:
              - CI009
              - CI013
              - CI014
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
