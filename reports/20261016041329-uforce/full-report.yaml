      - number: '3.2'
        title: Capability, pricing, and channel comparison
        blocks:
          - type: paragraph
            body: >-
              UForce's comparative story is built around battlefield validation, modular repairability, and widening
              allied distribution rather than transparent public pricing. The official site claims sea-denial outcomes
              at a fraction of conventional cost, while Tectonic adds the only concrete public unit-price signal in this
              pool by saying a MAGURA can be used as a one-way attack vessel for less than $500,000. Just as important,
              the channel picture is changing: the ReconCraft teaming agreement creates a US production path, and the
              EU-Ukraine Drone Alliance gives UForce a formal route into joint production and technology-transfer
              programs. Those moves matter because they reduce one of the classic disadvantages of wartime Ukrainian
              suppliers: limited exportability and thin local support in allied procurement systems.
