      - number: '3.3'
        title: Durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat is real enough to merit attention, but the assigned evidence also shows why it may compress over
              time. Investor-hosted commentary argues UForce wins because its systems are simple, field-modifiable, and
              battle proven, and management says the company has insourced key components to become NDAA-compliant and
              less vulnerable to targeted supply chains. Even so, independent coverage still flags export restrictions,
              corruption concerns, and geopolitical instability, while mission-volume disclosures drift from
              150,000-plus missions in several writeups to 220,000 in a later CEO interview. That combination implies
              buyers may value UForce's combat record, but better-capitalized Western rivals or primes can still narrow
              the gap if they combine channel access with clearer documentation, repeatable support models, and
              independently verified performance economics.
            claimRefs:
              - CP006
              - CP007
              - CP010
              - CP011
              - CP014
