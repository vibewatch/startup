  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base is defense-first, with battlefield users carrying most of the proof
        blocks:
          - type: paragraph
            body: >-
              UForce's public customer story is not a broad commercial SaaS motion; it is a defense procurement and
              operator-adoption story centered on governments, military units, and allied industrial channels. The
              strongest disclosed evidence still points back to Ukraine-based end users: company and investor materials
              describe deployment across land, sea, and air, while Shield Capital's transcript gives the clearest named
              usage proof via Unit 412 Nemesis and other Ukrainian operator workflows. That is meaningful because it
              demonstrates real use rather than logo-only marketing, but it also means the public record is much richer
              on wartime usage than on diversified paying customers outside Ukraine. Expansion signals into NATO and
              U.S. channels are real, yet they remain a step earlier in the funnel than disclosed, recurring, named
              allied buyers.
            claimRefs:
