      - number: '5.3'
        title: Trust, compliance, and support capacity remain the main product-tech diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The product-tech risk is not whether UForce can name platforms; it is whether outsiders can underwrite how
              durable, supportable, and certifiable the stack really is outside wartime conditions. Bavovna's
              manufacturer profile adds some evidence of production structure and quality controls, but the retained
              pool still does not expose interfaces, security tooling, incident history, or formal allied certification
              pathways. Public workforce disclosures are also inconsistent: Dealroom's public headcount snippet is
              materially below the 1,000-plus workforce described elsewhere, which weakens confidence in current
              support-capacity claims. As a result, the chapter can defend breadth, localization intent, and product
              categories, but not yet full architecture assurance or export-ready reliability.
            claimRefs:
