      - number: '5.2'
        title: The operating model points to a shared C2 layer and expanding allied production
        blocks:
          - type: paragraph
            body: >-
              Public evidence paints UForce as an integrated operating model built around a common control layer,
              distributed manufacturing, and rapid battlefield feedback. The strongest direct architecture evidence is
              still descriptive rather than inspectable: partner interview material says the company consolidated
              multiple teams that were already sharing a C2 system, while official and catalog surfaces emphasize open
              or NATO-compatible control. Fresh 2026 signals strengthen the deployment side of the story more than the
              software side: the EU–Ukraine Drone Alliance membership supports industrial integration in Europe, and the
              ReconCraft agreement supports U.S. localization for MAGURA. Shield Capital's transcript also provides
              unusually specific workflow evidence for how Magura, Nemesis, and Liut are meant to be used in real
              operations.
