      - ["Multi-domain scope", "Air, sea, land, autonomy software, and C2 are all described in assigned sources", "Unknown from assigned pool", "Varies by program; not benchmarked here", "Usually mission-specific rather than multi-domain"]
      - ["Field repair / modification posture", "Management frames systems as modular, repairable, and not dependent on vendor technicians", "Unknown in assigned pool", "Management argues many Western offerings still need vendor support or return-to-HQ updates", "Potentially strong for local doctrine fit, but scale and sustainment vary"]
      - ["Industrial / channel reach", "EU Drone Alliance access, six-country manufacturing footprint, and US ReconCraft path", "Unknown in assigned pool", "Established procurement channels likely stronger, but not demonstrated in assigned evidence", "Local reach can be strong; cross-border scaling is uncertain"]
    notes: >-
      This matrix uses only properties stated or explicitly left unknown in the assigned source pool; it is not a
      complete market benchmark.
    claimRefs: [CP002, CP004, CP005, CP007, CP010, CP011, CP013]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Offer / competitor class
      - Price / unit / contract signal
      - Included capabilities
      - Unknowns
      - Implication
    rows:
      - ["MAGURA USV", "Less than $500,000 for one-way attack use according to Tectonic", "One-way attack, drone launch platform, or maritime ISR", "Support, training, and non-attack package pricing are undisclosed", "Only concrete unit-price signal in assigned pool"]
      - ["UForce official comparative pitch", "\"less than the cost of one frigate\" and \"2.5× more efficient at 10× lower cost per mission\"", "Sea-denial framing plus open C2 and sovereign production messaging", "Comparator set, methodology, and contract terms are not disclosed", "Useful as sales thesis, not as underwritten benchmark"]
      - ["US industrialization package", "No public price disclosed", "ReconCraft teaming agreement to provide supplies, equipment, and workers in US production", "Revenue share, volume commitments, and support economics are undisclosed", "Packaging may reduce procurement friction even without transparent list pricing"]
      - ["Named Western battlefield peers", "No public price disclosed in assigned pool", "Battlefield-effect status in Ukraine per CEO commentary", "No packaging, discounting, or support model detail in assigned evidence", "Benchmarking remains an open diligence item"]
    notes: >-
      Public pricing evidence is sparse; this table separates concrete unit signals from broader marketing or packaging
      claims and keeps unknowns explicit.
    claimRefs: [CP004, CP008, CP012]
figures:
