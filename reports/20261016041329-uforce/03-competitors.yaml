    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal scores reflect only what the assigned evidence publicly discloses about battlefield validation and
      industrial/channel reach; they are not market-share or procurement-volume measures.
    data:
      xAxis:
        label: Publicly disclosed battlefield validation
        min: 1
        max: 5
        lowLabel: thin public validation
        highLabel: extensive public validation
        scale: ordinal 1-5 based on combat-use evidence in assigned sources
      yAxis:
        label: Publicly disclosed channel / industrial reach
        min: 1
        max: 5
        lowLabel: narrow disclosed reach
        highLabel: broad disclosed reach
        scale: ordinal 1-5 based on alliances, manufacturing footprint, and channel signals in assigned sources
      points:
        - label: UForce
          x: 5
          y: 5
          detail: Repeated mission-scale claims plus EU alliance and US production signals
        - label: Quantum Systems
          x: 4
          y: 1
          detail: Named by UForce CEO as a real battlefield-effect Western peer, but no channel detail appears in this pool
        - label: Tekever
          x: 4
          y: 1
          detail: Same evidence pattern as Quantum Systems in assigned sources
        - label: Destinus
          x: 4
          y: 1
          detail: Included in the CEO peer set, with no additional channel disclosure here
        - label: Conventional primes / status quo
          x: 1
          y: 4
          detail: Procurement familiarity is likely strong, but assigned evidence gives no direct battlefield-validation proof
        - label: Internal build / local integration
          x: 2
          y: 2
          detail: Adaptable for local doctrine, but public evidence in this pool does not show scaled combat proof or industrial breadth
    approximationNotes: >-
      Scores are ordinal synthesis from the assigned evidence only. They emphasize disclosed combat validation and
      disclosed channel breadth, not actual revenue, procurement wins, or full market coverage.
    claimRefs: [CP004, CP005, CP009, CP010, CP012, CP013]
