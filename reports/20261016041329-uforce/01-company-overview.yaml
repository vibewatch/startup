figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: Public milestones show a fast shift from wartime consolidation into EU and US industrial channels during 2025-2026.
    data:
      items:
        - label: Wartime thesis takes shape
          year: 2022
          detail: Ukraine's full-scale war became the proving ground that UForce later said justified institutionalizing and scaling combat-proven systems for allied militaries.
          claimRefs: [CO003]
        - label: Merger path starts
          period: Source-relative "early last year"
          detail: Tectonic uses the source-relative phrase "early last year," while the CEO describes a path that pulled together initially two companies, then a shared C2 provider and other teams, ultimately reaching nine companies; the fetched texts do not supply a calendar date for the merger.
          claimRefs: [CO002]
        - label: Bookings inflect
          year: 2025
          detail: Public evidence places bookings in nine figures or hundreds of millions, with reported growth between about 450% and close to 500%.
          claimRefs: [CO014, CO015]
        - label: Stealth exit and round announcement
          date: 2026-03-05
          detail: UForce announced an initial funding round led by Shield Capital and Lakestar with Ballistic Ventures participating.
          claimRefs: [CO004]
        - label: Unicorn coverage lands
          period: March 2026
          detail: Independent coverage translated the round into about $50M at a valuation above $1B.
          claimRefs: [CO005]
        - label: US expansion layer disclosed
          period: By the 2026-10-16 access date
          detail: Public materials identified Sean Plankey as CEO of UForce USA for US and Asia-Pacific expansion.
          claimRefs: [CO011]
        - label: MAGURA US production bridge
          period: By the 2026-10-16 access date
          detail: Tectonic reported a teaming agreement with ReconCraft to build MAGURA uncrewed surface vessels in the United States.
          claimRefs: [CO013]
        - label: EU-Ukraine Drone Alliance membership
          date: 2026-07-20
          detail: UForce said it became a founding member of the EU-Ukraine Drone Alliance.
          claimRefs: [CO012]
    approximationNotes: >-
      Exact dates are retained only where the fetched text states them. The merger keeps Tectonic's
      source-relative wording, and the US leadership and production entries are bounded only by access date.
    claimRefs: [CO003, CO004, CO005, CO011, CO012, CO013, CO014, CO015]
