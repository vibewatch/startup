chapter:
  number: 6
  title: "Customers"
  summary: >-
    Public customer proof is strongest for Ukrainian battlefield users and
    operator cohorts, where UForce can point to multi-domain deployments,
    mission scale, and a named feedback loop with Unit 412 Nemesis. The 2026
    evidence also shows credible expansion routes into EU and U.S. defense
    channels, but public materials still stop short of disclosing named Western
    end-customer contracts, retention metrics, or concentration by revenue.
sections:
  - id: "customer-base-and-proof-surfaces"
    title: "Customer base is defense-first, with battlefield users carrying most of the proof"
    body: >-
      UForce's public customer story is not a broad commercial SaaS motion; it
      is a defense procurement and operator-adoption story centered on
      governments, military units, and allied industrial channels. The
      strongest disclosed evidence still points back to Ukraine-based end users:
      company and investor materials describe deployment across land, sea, and
      air, while Shield Capital's transcript gives the clearest named usage
      proof via Unit 412 Nemesis and other Ukrainian operator workflows. That
      is meaningful because it demonstrates real use rather than logo-only
      marketing, but it also means the public record is much richer on wartime
      usage than on diversified paying customers outside Ukraine. Expansion
      signals into NATO and U.S. channels are real, yet they remain a step
      earlier in the funnel than disclosed, recurring, named allied buyers.
    claimRefs: ["CU001", "CU002", "CU006", "CU007", "CU011", "CU012"]
    tableRefs: ["TU001"]
    figureRefs: ["FU001"]
  - id: "adoption-trajectory-and-expansion"
    title: "Adoption trajectory is visible through bookings, operator scale, and channel build-out"
    body: >-
      The best public adoption signals are proxies rather than classic customer
      metrics. Resilience Media reports that UForce was already profitable on
      bookings in the hundreds of millions of dollars and that bookings grew
      450% in 2025, while the Shield Capital interview describes a scaling
      operator base around Unit 412 Nemesis from roughly 100 to 1,000 to 5,000
      operators, with management describing a path to much larger numbers. The
      company also ties its 2026 expansion narrative to manufacturing and
      sourcing across six allied European countries, membership in the
      EU-Ukraine Drone Alliance, and a U.S. teaming agreement with ReconCraft.
      Together, those indicators suggest real demand and organizational scale,
      but they do not disclose how much of that demand has converted into named,
      durable Western procurement programs.
    claimRefs: ["CU003", "CU004", "CU005", "CU008", "CU009", "CU013"]
    tableRefs: ["TU002"]
  - id: "named-proof-and-durability"
    title: "Named proof exists, but durability evidence is still thin"
    body: >-
      UForce does have more adoption proof than a pre-revenue concept company:
      Ukrainian forces are named as live users, Unit 412 Nemesis provides a
      specific operator anchor, and the U.S. and EU moves show concrete routes
      for internationalization. Even so, the public evidence does not yet show
      the customer-quality markers an investor would want for durability:
      renewals, contract length, NRR or GRR, churn, procurement conversion by
      country, or concentration by customer. The difference matters. Battlefield
      validation and partner enthusiasm help prove product relevance, but they
      do not by themselves prove repeatable, diversified revenue or long-term
      retention outside the wartime core.
    claimRefs: ["CU007", "CU008", "CU010", "CU011", "CU012"]
    tableRefs: ["TU003"]
  - id: "concentration-and-diligence-gaps"
    title: "The main customer risk is concentration in the strongest proof surface"
    body: >-
      The current public record still implies a concentration risk: the most
      credible usage and outcome evidence comes from Ukraine-linked battlefield
      customers and users, while the non-Ukrainian pipeline is described mainly
      through alliance memberships, investor interviews, and partner-led market
      entry. That does not mean UForce lacks international demand, but it does
      mean the external evidence base is not yet showing the diversified roster
      of named, paying, production Western customers that would de-risk a
      unicorn valuation. Until management discloses customer concentration,
      procurement conversion, and retention mechanics under NDA or in future
      filings, this chapter should treat international expansion as credible but
      still partially unproven.
    claimRefs: ["CU009", "CU010", "CU012", "CU014"]
