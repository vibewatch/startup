          claimRefs: [CM005]
        - label: 2025 bookings proxy
          value: "Hundreds of millions"
          note: "Reported bookings indicate buyer pull, but they are not audited revenue."
          claimRefs: [CM007, CM016]
        - label: 2025 bookings growth
          value: "450%"
          note: "Reported year-on-year bookings expansion signals rapid demand acceleration."
          claimRefs: [CM007]
        - label: U.S. production target
          value: "Hundreds to thousands/year"
          note: "ReconCraft target for Magura output in Oregon and South Carolina."
          claimRefs: [CM009]
        - label: European industrial footprint
          value: "15 locations / 6 countries"
          note: "Manufacturing and sourcing footprint used to mitigate export and war-zone concentration risk."
          claimRefs: [CM010]
    approximationNotes: >-
      Ordered layers show sequence and narrowing relevance, not a summed market;
      numeric values are source-stated procurement, traction, or capacity
      proxies carried directly from the retained evidence.
    claimRefs: [CM005, CM007, CM009, CM010, CM011]
callouts:
  - calloutType: insight
    title: Proxy-rich, TAM-poor market evidence
    body: >-
      Public evidence is strong enough to show multi-theater buyer pull, but not
      strong enough to close a classical TAM/SAM/SOM exercise without management
      or program-level disclosure.
    claimRefs: [CM005, CM007, CM015, CM016]
