  evidenceGaps:
    - type: missing-source
      severity: material
      topic: architecture-transparency
      missingEvidence: Module-level interface documentation, software-boundary detail, and integration pack material for SICH/C2 and how the maritime, aerial, and ground products interoperate.
      whyItMatters: Without inspectable architecture evidence, it is hard to underwrite integration cost, vendor lock-in, upgrade risk, or operational interoperability outside company narratives.
      diligencePath: Request redacted technical architecture diagrams, interface-control documents, and product briefs under NDA.
    - type: private-evidence-only
      severity: material
      topic: security-compliance
      missingEvidence: Independent evidence of cybersecurity controls, export-control approvals, allied certification pathways, incident history, and reliability or support KPIs.
      whyItMatters: Trust, safety, security, privacy, compliance, and quality controls are part of the chapter brief, but the retained public evidence stops at high-level QA and OpSec descriptions.
      diligencePath: Request security documentation, audit or certification records, incident logs, and customer support metrics by product family.
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: A public developer-signal or practitioner-community proxy validating software adoption, release cadence, APIs, or operator-community engagement.
      whyItMatters: The chapter brief explicitly calls for developer-signal coverage, and the assigned pool does not supply a convincing public proxy for software adoption.
      diligencePath: Request public repos or package feeds, or identify public operator forums, integration-partner engineering posts, talks, or recruiting materials that demonstrate software usage.
      relatedQuestionRefs: [QE009]
    - type: conflicting-data
