company:
  name: Feedzai
chapter:
  number: 1
  title: Company Overview
  summary: Feedzai is an enterprise AI-native financial crime and RiskOps platform founded in Portugal and headquartered in New York, protecting over 1 billion consumers and $9 trillion in annual transactions for tier-1 financial institutions. Following an October 2025 Series E financing round of approximately $75 million, the company attained a $2.0 billion post-money valuation and secured a high-profile European Central Bank digital euro fraud defense selection. However, key financial metrics including current annual recurring revenue, gross margin, and cash burn remain private, while enterprise onboarding complexity presents ongoing implementation friction.
sections:
  - id: corporate-identity-and-mission
    title: Corporate Identity and Core Mission
    body: Feedzai was incorporated in 2011 in Coimbra, Portugal, establishing its early technical reputation by developing high-throughput streaming analytics and real-time machine learning infrastructure designed specifically to combat payment fraud [CO001]. Over the past decade, the organization has expanded its operational footprint globally, maintaining executive leadership and commercial operations in New York City alongside vital research and software development hubs in Lisbon and Coimbra [CO002]. Operating at late-stage maturity, Feedzai positions its flagship RiskOps software platform as an end-to-end defense system that consolidates anti-money laundering, fraud prevention, and behavioral biometrics across complex institutional transaction workflows [CO010]. Today, the company secures over $9 trillion in annual payments across 120 billion transactions, safeguarding more than one billion individual banking consumers worldwide [CO010].
    claimRefs:
      - CO001
      - CO002
      - CO010
    tableRefs:
      - TO001
  - id: executive-leadership-and-governance
    title: Executive Leadership and Corporate Governance
    body: Feedzai continues to be led by its founding technical leadership team, spearheaded by Chief Executive Officer and Chairman Nuno Sebastião, who previously engineered real-time distributed systems for the European Space Agency [CO001, CO003]. Sebastião is flanked by co-founders Pedro Bizarro, serving as Chief Science Officer, and Paulo Marques, serving as Chief Technology Officer, both former computer science faculty at the University of Coimbra with extensive backgrounds in machine learning algorithms and fault-tolerant computing [CO001, CO003]. To prepare the company for mature governance, capital planning, and financial reporting ahead of potential strategic liquidity events, Feedzai appointed software veteran David Larson as Chief Financial Officer in May 2024 [CO004]. Despite this executive broadening, technical decision-making and product direction remain heavily concentrated among the founding team [CO003].
    claimRefs:
      - CO001
      - CO003
      - CO004
    tableRefs:
      - TO002
  - id: capitalization-and-investor-structure
    title: Capitalization, Valuation, and Investor Structure
    body: Feedzai has raised approximately $431 million in cumulative equity financing since its inception across Series A through Series E rounds [CO006]. In October 2025, Feedzai closed an investment round of approximately $75 million that officially expanded its post-money corporate valuation to $2.0 billion [CO005]. The syndicate introduced institutional investors Lince Capital, Iberis Capital, and Explorer Investments, while securing renewed financial backing from long-standing private equity sponsors Oxy Capital and Buenavista Equity Partners [CO007]. While this funding establishes substantial balance sheet stability, Feedzai does not publicly release audited financial statements, retaining complete opacity over annual recurring revenue, gross margin performance, net retention rates, and cash burn profiles [CO015].
    claimRefs:
      - CO005
      - CO006
      - CO007
      - CO015
    tableRefs:
      - TO003
  - id: operational-milestones-and-risk-evolution
    title: Operational Milestones, Scale, and Risk Evolution
    body: Feedzai has achieved several pivotal operational and commercial milestones over the preceding eighteen months, including a multi-year global partnership with Mastercard in February 2025 to scale Consumer Fraud Risk scoring across worldwide payment networks [CO008]. In April 2025, the company completed the strategic acquisition of DemystData for an estimated $157 million, integrating external data fabric pipelines directly into its decisioning architecture [CO009]. In October 2025, Feedzai was chosen by the European Central Bank as the first-ranked tenderer to design fraud prevention frameworks for the proposed digital euro [CO013]. Continuing its product acceleration into 2026, Feedzai unveiled RiskFM, a tabular foundation model for risk classification, in March 2026, followed by Farol in September 2026 to bring agentic AI reasoning directly into operational fraud workflows [CO011, CO012]. However, competitor analyses emphasize that Feedzai tier-1 enterprise implementations demand prolonged onboarding runways, while bespoke pricing contracts limit accessibility for smaller institutions [CO014].
    claimRefs:
      - CO008
      - CO009
      - CO011
      - CO012
      - CO013
      - CO014
    figureRefs:
      - FO001
