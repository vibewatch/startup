  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked Risk View and Investment Implications
        blocks:
          - type: paragraph
            body: >
              The highest residual risk is evidence quality around mission-critical performance, not proof of a known
              failure. Feedzai says its platform processes 90 billion events and secures $8 trillion in payments
              annually on LinkedIn, while March and June 2026 product materials use $9 trillion and, in one case, 120
              billion events. Those figures may reflect growth or different definitions, but the public materials do not
              reconcile the periods or denominators. At that stated scale, model drift, false positives, latency, and
              availability deserve critical diligence even though the assigned evidence contains no verified outage or
              enforcement record.


              The next tier combines regulatory assurance and integration execution. Feedzai describes
              privacy-preserving federated intelligence, lightweight API delivery, and broad compliance tooling, but
              those are company claims rather than independent audits. The investment implication is therefore
              conditional: require customer-level validation, uptime and model-governance evidence, and quantified
              financial exposure before treating the public mitigation narrative as proven.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR008
              - CR012
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, Legal, Privacy, and Model-Governance Exposure
        blocks:
          - type: paragraph
            body: >
              Feedzai's products sit inside regulated fraud and financial-crime workflows, but the assigned public
              record supports architectural descriptions rather than a complete legal posture. The company says Feedzai
              IQ uses federated learning on anonymized, distributed information and that IQ Score transmits network
              intelligence without raw customer data. It also historically described RiskOps as supporting policies
              including PSD2, GDPR, and TILA. These disclosures are relevant mitigations, but they do not establish how
              controls perform in each customer deployment, whether every cross-border signal is treated consistently,
              or whether regulators and customers have independently validated the controls.


              A second governance risk is performance substantiation. The claimed four-times detection improvement and
              50% alert reduction come from company-issued releases. Before underwriting those gains, diligence should
              obtain model cards, validation cohorts, false-positive and false-negative distributions, fairness testing,
              override controls, and incident records. The legal register is deliberately a sample of evidenced risk
              areas, not a representation that no litigation or enforcement exists.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR010
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR010
              - CR015
      - number: '7.3'
        title: Operational, Partner, and Financial-Model Dependencies
        blocks:
          - type: paragraph
            body: >
              Feedzai itself describes fraud as an adversarial domain in which behavior and attack modes change
              continuously. RiskFM is still being validated with early adopters, so production generalization across
              institutions and geographies remains a monitorable execution risk rather than a settled capability. The
              product strategy also depends on collective network signals, customer participation, API integration, and
              distribution through AWS Marketplace. Those dependencies may accelerate deployment, but they create
              diligence questions about data continuity, integration support, commercial terms, and the effect of losing
              a material contributing institution.


              Public evidence does not quantify revenue concentration, renewal exposure, burn, runway, loss-sharing,
              service-level penalties, or the cost of operating and validating customer-specific models. The correct
              response is not to manufacture a probability or cash-loss estimate. The thesis should instead break if
              independent tests show persistent model degradation, material customer exits reduce network coverage,
              privacy controls fail review, or management cannot provide audited availability, concentration, and
              financial-risk schedules.
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR009
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR007
              - CR009
              - CR011
              - CR012
              - CR013
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break triggers
            body: >-
              Pause or reject the investment if independent validation shows sustained model degradation, privacy
              controls fail customer or regulator review, audited availability misses contractual thresholds, material
              customer exits reduce network breadth, or management cannot provide concentration, SLA, loss-exposure,
              burn, and runway schedules.
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Strategic Posture
        blocks:
          - type: paragraph
            body: >-
              Feedzai presents a compelling institutional thesis anchored in mission-critical financial crime
              infrastructure. By processing over $9 trillion in annual payments and analyzing 120 billion events, the
              company has established deep operational entrenchment across global Tier-1 banks, payment processors, and
              regulatory bodies. The launch of pioneering technological solutions—notably its tabular foundation model
              RiskFM and the Feedzai IQ network intelligence engine—differentiates Feedzai from legacy rules-based
              vendors and narrow point-solution providers. However, the investment anti-thesis centers on extreme
              commercial opacity and competitive substitution. While Feedzai excels in unifying fraud and anti-money
              laundering workflows within an integrated RiskOps framework, specialized providers like BioCatch match or
              surpass individual biometric capabilities, and modern cloud competitors threaten mid-market expansion.
              Furthermore, Feedzai's focus on Fortune 500 banks creates enterprise concentration, leaving revenue
              conversion vulnerable to extended sales cycles and multi-year procurement delays.
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
      - number: '8.2'
        title: Valuation Context, Capital Structure, and Multiple Assessment
        blocks:
          - type: paragraph
            body: >-
              In October 2025, Feedzai announced an investment round of approximately $75 million at a valuation
              exceeding $2.0 billion, bringing cumulative funding to approximately $346.8 million across nine
              institutional rounds. While reaching cash flow positive operations in fiscal 2024 validated the company's
              operational sustainability, underwriting the current valuation remains challenging. Feedzai discloses no
              revenue figures, annual recurring revenue (ARR), net revenue retention (NRR), or gross margin percentages.
              Assuming an estimated revenue range of $150 million to $200 million based on enterprise contract scales,
              the $2.0 billion valuation reflects a revenue multiple of 10x to 13x. This multiple commands a notable
              premium relative to mature public RegTech and cybersecurity peers, demanding robust organic growth and
              steady cross-sell expansion to sustain its valuation benchmark without dilution overhang.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV009
              - CV010
      - number: '8.3'
        title: 'Scenario Analysis: Bull, Base, and Bear Cases'
        blocks:
          - type: paragraph
            body: >-
              Evaluating Feedzai across probabilistic operating scenarios highlights clear asymmetry between optimistic
              expansion and downside risk. In a bull scenario (25% probability), accelerated adoption of agentic AI
              workflows, widespread monetization of Feedzai IQ network scores, and central bank infrastructure
              partnerships propel ARR past $200 million with 30%+ annual growth, unlocking an exit valuation of $3.0
              billion to $3.5B via initial public offering or strategic acquisition. In the base case (55% probability),
              steady enterprise expansion drives revenue to $140 million - $160 million, supporting a fair value band
              between $1.8 billion and $2.2 billion at 12x to 14x ARR. Conversely, the bear case (20% probability)
              underscores vulnerabilities where IT budget freezes, customer churn among major payment processors, and
              margin pressure compress valuation multiples to 5x - 7x ARR, driving enterprise value down toward $1.0
              billion to $1.2 billion and increasing down-round recapitalization exposure.
            claimRefs:
              - CV004
              - CV009
              - CV010
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV009
              - CV010
              - CV014
      - number: '8.4'
        title: Recommendation, Downside Triggers, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Synthesizing market strength against financial opacity yields an overall recommendation of research-more,
              accompanied by a medium confidence score, high risk rating, and stretched valuation stance. Feedzai's
              foundational market footprint and cash-generative operations establish strong commercial viability, yet
              allocating growth capital at a $2.0 billion valuation without verifiable ARR, growth velocity, and cohort
              retention metrics violates disciplined underwriting standards. Immediate investment should be deferred
              until confirmatory diligence clarifies audited revenue schedules, customer retention cohorts, and senior
              liquidation preferences. Key thesis-break triggers include deceleration in Tier-1 contract renewals,
              competitive pricing erosion from agile SaaS vendors, or any disclosure of negative gross margin trajectory
              in custom enterprise deployments.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV009
              - CV011
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV009
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV009
              - CV011
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Underwriting Stance: Maintain Research-More Rating'
            body: >-
              Given Feedzai's undisclosed ARR, customer retention, and unit margins, an investment at a $2.0 billion
              valuation cannot be underwritten with high confidence without confirmatory access to private financial
              records.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV009
          - type: callout
            title: 'Downside Exposure: Multiple Compression and Opaque Growth'
            body: >-
              Without verified top-line growth rates, entry at $2.0 billion exposes investors to severe down-round risk
              if enterprise procurement cycles lengthen or ARR multiples contract.
            calloutType: risk
            claimRefs:
              - CV004
              - CV009
              - CV010
