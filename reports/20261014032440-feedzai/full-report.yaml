        title: Executive Leadership and Corporate Governance
        blocks:
          - type: paragraph
            body: >-
              Feedzai continues to be led by its founding technical leadership team, spearheaded by Chief Executive
              Officer and Chairman Nuno Sebastião, who previously engineered real-time distributed systems for the
              European Space Agency [CO001, CO003]. Sebastião is flanked by co-founders Pedro Bizarro, serving as Chief
              Science Officer, and Paulo Marques, serving as Chief Technology Officer, both former computer science
              faculty at the University of Coimbra with extensive backgrounds in machine learning algorithms and
              fault-tolerant computing [CO001, CO003]. To prepare the company for mature governance, capital planning,
              and financial reporting ahead of potential strategic liquidity events, Feedzai appointed software veteran
              David Larson as Chief Financial Officer in May 2024 [CO004]. Despite this executive broadening, technical
              decision-making and product direction remain heavily concentrated among the founding team [CO003].
            claimRefs:
              - CO001
              - CO003
              - CO004
