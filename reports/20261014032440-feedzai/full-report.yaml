chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Core Mission
        blocks:
          - type: paragraph
            body: >-
              Feedzai was incorporated in 2011 in Coimbra, Portugal, establishing its early technical reputation by
              developing high-throughput streaming analytics and real-time machine learning infrastructure designed
              specifically to combat payment fraud [CO001]. Over the past decade, the organization has expanded its
              operational footprint globally, maintaining executive leadership and commercial operations in New York
              City alongside vital research and software development hubs in Lisbon and Coimbra [CO002]. Operating at
              late-stage maturity, Feedzai positions its flagship RiskOps software platform as an end-to-end defense
              system that consolidates anti-money laundering, fraud prevention, and behavioral biometrics across complex
              institutional transaction workflows [CO010]. Today, the company secures over $9 trillion in annual
              payments across 120 billion transactions, safeguarding more than one billion individual banking consumers
              worldwide [CO010].
            claimRefs:
              - CO001
              - CO002
              - CO010
