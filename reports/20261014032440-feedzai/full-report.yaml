  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Profiles
        blocks:
          - type: paragraph
            body: >-
              Feedzai segments its commercial footprint across three primary institutional tiers: global payment
              networks, tier-1 retail and commercial banks, and regional financial institutions. The core buyer persona
              centers on Chief Risk Officers (CROs), heads of financial crime compliance, and fraud operations
              executives who face escalating AI-driven fraud and authorized push payment scam volumes. While large
              payment networks and tier-1 banks engage Feedzai for end-to-end RiskOps unification across card payments,
              real-time transfers, and anti-money laundering monitoring, regional and mid-market institutions
              increasingly access Feedzai via modular network intelligence layers like Feedzai IQ Score on AWS
              Marketplace. However, independent competitor evaluations emphasize that Feedzai remains heavily skewed
              toward large enterprise buyers with sophisticated IT capabilities, as smaller institutions find the
              platform cost-prohibitive and operationally complex without substantial vendor integration support.
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU009
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU004
              - CU009
              - CU011
      - number: '6.2'
        title: Adoption Trajectory and Network Scale
        blocks:
          - type: paragraph
            body: >-
              Over its fifteen-year operational history, Feedzai has expanded its operational footprint from initial
              transaction scoring models to a global network assessing $9 trillion in annual payment volume across 120
              billion events worldwide. The company claims its unified platform protects over 1 billion consumers across
              more than 90 countries, leveraging real-time behavioral profiles and federated machine learning models.
              Commercial traction accelerated notably through network-level product rollouts, including the June 2025
              launch of Feedzai IQ—aggregating risk intelligence from hundreds of financial institutions across four
              continents—and the subsequent general availability of Feedzai IQ Score in June 2026. These network
              offerings demonstrate substantial transaction scale, yet absolute commercial adoption figures—specifically
              active paying customer logo counts, Annual Recurring Revenue, and net revenue retention—remain closely
              guarded private metrics not disclosed in audited disclosures.
            claimRefs:
              - CU002
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU004
              - CU007
              - CU008
      - number: '6.3'
        title: Named Customer Deployments and Institutional Reference Proof
        blocks:
          - type: paragraph
            body: >-
              Feedzai's commercial viability is corroborated by high-profile production deployments and institutional
              partnerships. In February 2025, Mastercard announced a global strategic partnership with Feedzai to deploy
              its Consumer Fraud Risk scam detection scoring to banks in over 90 countries, integrating Feedzai's
              real-time risk platform across global payment rails. In Europe, Portuguese banking leader Novobanco
              operationalized Feedzai TrustScore, reporting enhanced fraud pattern detection without increasing alert
              fatigue or operational overhead. In North America, Canadian financial institution Peoples Group selected
              Feedzai in September 2026 to secure 24/7 instant payments in advance of Canada's Real-Time Rail rollout.
              Furthermore, directory and regulatory records confirm that the European Central Bank selected Feedzai as
              its first-ranked tenderer for digital euro fraud prevention. These named references validate Feedzai's
              ability to win highly competitive public and private institutional procurement mandates.
            claimRefs:
              - CU004
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Durability, Expansion Loops, and Procurement Friction
        blocks:
          - type: paragraph
            body: >-
              Account durability and expansion at Feedzai rely on a land-and-expand trajectory transitioning
              institutions from single-use-case fraud detection to unified multi-rail RiskOps and cross-institutional
              intelligence. Once integrated, high switching costs and mission-critical payment rail positioning provide
              durable account stickiness. To mitigate integration friction and accelerate onboarding, Feedzai
              established a global partnership with systems integrator Matrix USA in January 2026, jointly operating a
              Center of Excellence for client deployment. Nevertheless, independent evaluations by market competitors
              highlight significant procurement friction: Feedzai does not publish standardized pricing, requires
              bespoke enterprise sales contracts, and involves onboarding timelines spanning multiple months. This
              lengthy runway creates commercial dependency on large enterprise contract expansions while limiting
              self-service mid-market penetration.
            claimRefs:
              - CU003
              - CU013
              - CU014
              - CU015
          - type: figure
