        blocks:
          - type: paragraph
            body: >-
              Feedzai has achieved several pivotal operational and commercial milestones over the preceding eighteen
              months, including a multi-year global partnership with Mastercard in February 2025 to scale Consumer Fraud
              Risk scoring across worldwide payment networks [CO008]. In April 2025, the company completed the strategic
              acquisition of DemystData for an estimated $157 million, integrating external data fabric pipelines
              directly into its decisioning architecture [CO009]. In October 2025, Feedzai was chosen by the European
