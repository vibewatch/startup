  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Investment Thesis (Bull Driver)
      - Anti-Thesis (Downside Risk)
      - What Would Change View
    rows:
      - - Scale & Network Effects
        - Analyzes $9T+ in payments and 120B events, providing unmatched data breadth for RiskOps
        - Data scale does not guarantee pricing power if banking buyers treat fraud tools as commoditized infrastructure
        - Confirmation of sustained NRR above 120% and expanding contract sizes across Tier-1 banks
      - - Product & AI Moat
        - Pioneering tabular foundation model RiskFM and Feedzai IQ deliver superior detection with fewer false alerts
        - >-
          Point competitors like BioCatch match specialized biometric capabilities while LLM tooling lowers barrier to
          entry
        - Independent benchmark proof showing sustained win rates exceeding 70% against point solution stacks
      - - Financial Viability
        - Achieved positive cash flow in fiscal 2024 and secured $75M growth capital to scale
        - Total disclosure opacity on revenue, ARR, gross margins, and burn masks true underlying capital efficiency
        - Confidential review of audited revenue exceeding $150M ARR with gross margins above 75%
      - - Regulatory Alignment
        - Digital euro fraud prevention partnership and central bank trust create high switching costs
        - Multi-year enterprise implementation runways and regulatory compliance overhead slow revenue conversion
        - Accelerated commercial rollout of central bank rails yielding recurring SaaS royalty streams
    notes: Core investment drivers versus downside risks and data opacity, with explicit falsification triggers.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV006
      - CV007
      - CV008
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating & Growth Assumptions
      - Implied Valuation / Multiple
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          ARR accelerates past $200M (30%+ YoY); NRR reaches 125%; Farol and RiskFM drive cross-sell; cash flow margins
          expand above 20%
        - $3.0B - $3.5B (15x - 17.5x ARR multiple upon public market listing or strategic takeout by payment rail)
        - Execution stumbles in agentic AI; regulatory backlash against automated credit/fraud decisions
        - 25%
      - - Base Case
        - >-
          ARR grows steadily to $140M - $160M (15-20% YoY); NRR stabilizes at 110%; sustainable self-funding with
          breakeven cash flow
        - $1.8B - $2.2B (12x - 14x ARR multiple reflecting premium enterprise RegTech market standing)
        - Sales cycle lengthening at Tier-1 banks; slower uptake of network intelligence products
        - 55%
      - - Bear Case
        - >-
          Growth decelerates below 10% YoY; Tier-1 customer churn occurs; competitors erode pricing power; cash flow
          turns negative
        - $1.0B - $1.2B (5x - 7x ARR multiple, triggering down-round dilution or distressed recapitalization)
        - >-
          Macro IT spending freezes; loss of major payment processor accounts; aggressive price discounting by
          competitors
        - 20%
    notes: Forward-looking scenario assumptions, implied valuation ranges, exit multiples, and probability signals.
    claimRefs:
      - CV001
      - CV004
      - CV009
      - CV010
      - CV014
