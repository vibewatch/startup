        title: Capitalization, Valuation, and Investor Structure
        blocks:
          - type: paragraph
            body: >-
              Feedzai has raised approximately $431 million in cumulative equity financing since its inception across
              Series A through Series E rounds [CO006]. In October 2025, Feedzai closed an investment round of
              approximately $75 million that officially expanded its post-money corporate valuation to $2.0 billion
              [CO005]. The syndicate introduced institutional investors Lince Capital, Iberis Capital, and Explorer
              Investments, while securing renewed financial backing from long-standing private equity sponsors Oxy
              Capital and Buenavista Equity Partners [CO007]. While this funding establishes substantial balance sheet
              stability, Feedzai does not publicly release audited financial statements, retaining complete opacity over
              annual recurring revenue, gross margin performance, net retention rates, and cash burn profiles [CO015].
