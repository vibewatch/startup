              - CE004
              - CE006
              - CE008
              - CE009
              - CE010
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
              - CE009
              - CE010
              - CE012
      - number: '5.3'
        title: 'AI Innovation: RiskFM, Feedzai IQ, and Farol'
        blocks:
          - type: paragraph
            body: >-
              In 2025 and 2026, Feedzai expanded beyond supervised gradient boosting into frontier AI paradigms for
              financial crime prevention. In March 2026, the company unveiled RiskFM, the industry's first tabular
              foundation model purpose-built for financial data and multi-stage risk decisioning across card payments,
              real-time rails, and AML. Complementing this foundation layer is Feedzai IQ, launched in 2025, which
              leverages federated learning to extract collaborative network intelligence across participating banks
              without sharing sensitive customer data. Furthermore, in September 2026, Feedzai introduced Farol, an
              embedded agentic AI assistant designed to eliminate analyst case review bottlenecks by autonomously
              reasoning over complex fraud investigation workflows.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
      - number: '5.4'
        title: Deployment, Partner Ecosystem, and Operational Risks
        blocks:
          - type: paragraph
            body: >-
              Feedzai supports flexible enterprise delivery models, offering managed Software-as-a-Service (SaaS)
              through AWS Marketplace alongside hybrid and on-premises deployments for institutions with strict
              regulatory data residency constraints. To streamline delivery, Feedzai partners with systems integrators
              such as IT Smart Systems, embedding real-time fraud decisioning directly into digital banking
              architectures, SEPA payment rails, and European instant payment infrastructures. However, integrating
              modern AI risk scoring into legacy mainframe core banking environments introduces potential latency
              overhead, protocol mismatches, and data synchronization hurdles that represent a key technical diligence
              focus for prospective enterprise buyers.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE007
              - CE011
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: AI-Native Architecture and High-Throughput Execution
            body: >-
              Feedzai's unified RiskOps platform distinguishes itself from legacy siloed financial crime architectures
              by combining deterministic rules with machine learning scoring in the sub-second Pulse Risk Engine,
              capable of processing over 3,000 transactions per second.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: callout
            title: Core Banking Integration and Private Tail-Latency Gaps
            body: >-
              While Feedzai provides standardized AWS Marketplace SaaS deployments and RESTful adapters, integrating
              real-time risk decisioning into legacy on-premise core banking mainframes poses integration friction and
              tail-latency risks that require empirical verification.
            calloutType: risk
            claimRefs:
