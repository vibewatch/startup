              - CE007
      - number: '5.2'
        title: Platform Architecture and the Pulse Risk Engine
        blocks:
          - type: paragraph
            body: >-
              At the technological core of Feedzai's platform is the Pulse Risk Engine, a proprietary scoring engine
              that executes hybrid decisioning in milliseconds. The engine blends deterministic business rules with
              state-of-the-art machine learning models to assess incoming events at an enterprise scale exceeding 3,000
              transactions per second. Feedzai's stack is built on top of Amazon Web Services (AWS) cloud
              infrastructure, utilizing out-of-the-box REST APIs and data adapters to integrate reference data and
              third-party feeds. The company also maintains open-source developer assets on GitHub, including TimeSHAP
              for recurrent neural network explainability, FairGBM for responsible machine learning fairness, and
              PulseDB for transparent database mapping.
            claimRefs:
              - CE002
              - CE003
              - CE008
              - CE009
              - CE010
              - CE012
          - type: table
            tableRef: TE003
