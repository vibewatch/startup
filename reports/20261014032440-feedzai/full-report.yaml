  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Workflow Integration
        blocks:
          - type: paragraph
            body: >-
              Feedzai delivers an end-to-end AI-native platform designed to prevent financial crime across the entire
              customer lifecycle. Rather than deploying fragmented point solutions for fraud, AML, and identity
              verification, Feedzai consolidates risk decisioning into a single RiskOps platform. The system operates
              across omnichannel touchpoints, securing inbound and outbound payments, new account opening, digital
              onboarding, account takeover (ATO), and authorized push payment (APP) scams. By unifying behavioral
              biometrics, device intelligence, and transactional telemetry into cohesive customer risk profiles, Feedzai
              enables financial institutions to detect emerging threats without introducing customer friction or false
              positive alert fatigue.
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE004
