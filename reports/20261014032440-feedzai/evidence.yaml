evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: >-
      Audited financial statements detailing current ARR, gross margin percentage, net revenue retention, and cash
      runway.
    whyItMatters: >-
      Without audited private financial metrics, Feedzai's $2.0B post-money valuation multiple and cash generation
      profile cannot be independently verified.
    diligencePath: >-
      Request confidential investor data room access for audited GAAP/IFRS financial statements and board-approved 2026
      budget projections.
    relatedQuestionRefs:
      - QO007
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-governance
    missingEvidence: Comprehensive listing of Feedzai's complete Board of Directors, voting agreements, and committee assignments.
    whyItMatters: >-
      Governance rights, protective provisions, and sponsor vetoes cannot be evaluated without complete board
      representation details.
    diligencePath: >-
      Obtain Feedzai's certificate of incorporation, investor rights agreement, and voting agreement disclosures via
      formal diligence query.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Audited institutional breakdown of Feedzai exact Serviceable Obtainable Market (SOM) share and customer net
      retention rates within tier-1 banks.
    whyItMatters: >-
      Without private customer-level ARR disclosures and cohort expansion data, estimating Feedzai exact market
      penetration and customer lifetime value requires reliance on high-level contract estimates.
    diligencePath: >-
      Request confidential investor presentation or management discussion showing tier-1 bank logos, annual contract
      values, and historical net retention by segment.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Itemized list pricing, implementation service rates, and outcome-based pricing schedules across enterprise fraud
      vendors are kept under NDA.
    whyItMatters: >-
      Direct total cost of ownership comparisons cannot be independently audited without private contract schedules and
      multi-year licensing data.
    diligencePath: >-
      Request customer procurement schedules, RFP scorecards, and implementation service work orders under
      confidentiality.
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: independent-benchmarks
    missingEvidence: >-
      Audited side-by-side performance benchmarks on real-time transaction latency and false-positive rates on common
      datasets are not published by vendors.
    whyItMatters: >-
      Published detection rate claims (e.g. 62% detection improvement, 4x more fraud detected) are vendor-reported
      rather than independently audited on identical transaction streams.
    diligencePath: Review proof-of-concept run logs and third-party benchmark evaluations conducted by shared banking clients.
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: arr-and-retention-metrics
    missingEvidence: >-
      Audited financial disclosure of Annual Recurring Revenue (ARR), Net Revenue Retention (NRR), and Gross Revenue
      Retention (GRR).
    whyItMatters: >-
      Without verified ARR and net retention, underwriting Feedzai's $2.0B enterprise valuation requires uncorroborated
      assumptions regarding underlying recurring software revenue and cohort expansion.
    diligencePath: >-
      Request confidential management financial package, trailing-twelve-month revenue cohort breakdown, and historical
      churn analysis during confirmatory diligence.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: gross-margin-and-hosting-cost
    missingEvidence: >-
      Detailed breakdown of cost of goods sold, cloud compute consumption for real-time model scoring, and professional
      services gross margins.
    whyItMatters: >-
      High-throughput machine learning inference over $9T in transaction volume can compress gross margins if cloud
      infrastructure costs scale linearly with processed payment volume.
    diligencePath: >-
      Obtain AWS and cloud hosting cost schedule, model inference unit costs, and professional services delivery margin
      accounting.
    relatedQuestionRefs:
      - QI004
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: minor
    topic: net-cash-burn-and-runway
    missingEvidence: >-
      Current cash balance on hand, debt or credit facility obligations, and monthly operating cash burn schedule
      following the October 2025 Series E round.
    whyItMatters: Determines forward capital runway, self-funding capability, and sensitivity to future equity financing conditions.
    diligencePath: Request balance sheet schedule of cash equivalents, short-term debt, and forward pro-forma cash flow forecasts.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: latency-and-integration-friction
    missingEvidence: >-
      Independent benchmark data on end-to-end transaction latency and API throughput overhead when Feedzai's Pulse Risk
      Engine is integrated with on-premises mainframe or legacy core banking systems.
    whyItMatters: >-
      Financial institutions evaluating sub-100ms real-time payment SLAs (such as FedNow or SEPA Instant) need verified
      empirical evidence that AI risk scoring does not induce processing timeouts or failover bottlenecks.
    diligencePath: >-
      Request production performance telemetry, tail-latency metrics (p99/p99.9), and architecture runbooks from
      reference enterprise deployments operating under high concurrency.
    relatedQuestionRefs:
      - QE003
    relatedTableRefs:
      - TE003
  - type: conflicting-data
    severity: material
    topic: customer-retention-metrics
    missingEvidence: >-
      Audited institutional customer count, Annual Recurring Revenue (ARR), Gross Revenue Retention (GRR), Net Revenue
      Retention (NRR), and annual logo churn rates.
    whyItMatters: >-
      Feedzai highlights aggregate transaction volume ($9T) and consumer reach (1B+), but the absence of verified paying
      customer logo counts and net retention rates prevents underwriting organic expansion vs churn dynamics.
    diligencePath: >-
      Request private revenue cohort data, customer logo bridge for the trailing 24 months, and ARR concentration across
      top 20 enterprise accounts during confirmatory diligence.
    relatedQuestionRefs:
      - QU001
      - QU002
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-contracts
    missingEvidence: >-
      Full contract roster specifying committed ACV, contract duration, renewal milestones, and SLA guarantees across
      named deployments.
    whyItMatters: >-
      Public case studies (Novobanco, Peoples Group, Mastercard) confirm production deployment but omit commercial
      contract sizes, recurring software vs professional service fee splits, and termination rights.
    diligencePath: Review master service agreements and statement of work schedules for top 10 accounts under NDA.
    relatedQuestionRefs:
      - QU003
      - QU007
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: private-evidence-gaps
    missingEvidence: >-
      Audited revenue concentration, cash burn, runway, loss-sharing, indemnity, service-level penalties, and
      contingent-liability schedules.
    whyItMatters: >-
      These data determine whether customer, operational, and financial risks are survivable and whether any single
      contract can impair the investment.
    diligencePath: >-
      Request audited financials, top-10 customer and contributor concentration, renewal cohorts, material contracts,
      SLA credits, indemnities, claims history, and board-approved liquidity forecasts.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: model-validation
    missingEvidence: >-
      Independent, cohort-defined validation of detection lift, false-positive reduction, model drift, fairness,
      overrides, latency, and availability.
    whyItMatters: >-
      Company-issued performance claims do not establish generalization across fraud types, institutions, geographies,
      or production conditions.
    diligencePath: >-
      Commission reproducible testing on representative customer cohorts and inspect model cards, monitoring reports,
      incident logs, override records, and p95/p99 service metrics.
    relatedTableRefs:
      - TR002
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      A complete regulator, court, license, enforcement, privacy, intellectual-property, and customer-dispute record for
      Feedzai and its deployed products.
    whyItMatters: >-
      The assigned pool contains company product disclosures but no primary regulator or legal records, so the
      legal-risk population cannot be treated as exhaustive.
    diligencePath: >-
      Run jurisdiction-specific regulator, court, privacy authority, patent, sanctions, and customer-dispute searches,
      then reconcile results with management representations.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: >-
      Audited financial statements verifying annualized recurring revenue (ARR), net revenue retention (NRR), and GAAP
      gross margins.
    whyItMatters: >-
      Without verified ARR or cohort retention data, underwriting Feedzai's $2.0 billion post-money enterprise valuation
      relies on implied estimates rather than audited fundamentals.
    diligencePath: >-
      Obtain confidential management presentation and audited financial schedules detailing revenue breakdown by product
      line and customer retention cohorts.
    relatedQuestionRefs:
      - QV008
