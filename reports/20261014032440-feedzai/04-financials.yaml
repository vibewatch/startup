company:
  name: Feedzai
chapter:
  number: 4
  title: Financials
  summary: >-
    Feedzai operates an enterprise-grade commercial model characterized by multi-year RiskOps software licenses and high
    switching costs across tier-one banks safeguarding $9T+ in annual payments. While the company achieved cash-flow
    positive operations in FY2024 and secured $75M at a $2.0B valuation in late 2025, underwriting the business remains
    constrained by opaque disclosures regarding ARR, gross margins, net retention, and capital consumption.
sections:
  - id: commercial-model-and-revenue-streams
    title: Commercial Model & Revenue Streams
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI007
    tableRefs:
      - TI001
    figureRefs:
      - FI001
    body: >-
      Feedzai generates commercial revenue primarily through annual recurring platform subscriptions, volume-tiered
      transaction monitoring fees, and dedicated professional services. The core offering unifies fraud detection,
      anti-money laundering (AML) compliance, and customer lifecycle risk analytics within its proprietary RiskOps
      architecture. Deployed predominantly across tier-one global financial institutions, retail banks, and major
      payment processing networks, the platform safeguards more than one billion consumers worldwide and evaluates
      transaction risk across over $9 trillion in annual payment volume spanning 120 billion events.


      Commercial contracts are structured around high-assurance mission-critical deployments where software failure
      directly risks regulatory non-compliance and catastrophic fraud losses. In addition to core software licensing,
      Feedzai monetizes through specialized platform modules, including Feedzai IQ for network-level cross-bank
      intelligence and the RiskFM tabular foundation model. Professional services and systems integration fees represent
      an essential initial component of commercial engagements, compensating for the extensive technical integration
      required to embed Feedzai's scoring engine into core banking ledgers and payment rails.
  - id: gtm-motion-and-contract-mechanics
    title: Go-to-Market Motion & Contract Mechanics
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI013
    tableRefs:
      - TI002
    figureRefs: []
    body: >-
      Feedzai's go-to-market motion relies on high-touch direct enterprise sales supplemented by strategic technology
      and integration partnerships with ecosystem players such as PwC and core processing platforms. Pricing is entirely
      bespoke, negotiated on an institution-by-institution basis without published list prices. Standard commercial
      agreements mandate multi-year commitments with substantial annual spend minimums, implementation charges, and
      custom configuration fees.


      While this enterprise contract structure delivers strong gross dollar retention and predictable multi-year
      visibility, independent competitor reviews indicate that it introduces significant commercial friction. Enterprise
      deployment cycles routinely extend from 5 to 12 months, requiring deep technical involvement from both Feedzai and
      client engineering teams. Furthermore, this heavy pricing and implementation burden effectively prices out
      high-growth fintechs, payment facilitators, and mid-market acquiring banks, focusing Feedzai's commercial pipeline
      almost exclusively on large incumbents capable of absorbing multi-million-dollar commitments.
  - id: cost-structure-and-unit-economics-gaps
    title: Cost Structure & Unit Economics Underwriting Gaps
    claimRefs:
      - CI004
      - CI005
      - CI013
      - CI014
    tableRefs:
      - TI003
    figureRefs: []
    body: >-
      Feedzai's operational cost structure is driven by high-throughput cloud compute infrastructure, specialized AI
      research talent, and global enterprise support personnel. Real-time inference across 120 billion annual events
      imposes substantial computational demands, particularly as institutions adopt complex machine learning ensembles
      and foundation models like RiskFM. In April 2024, Feedzai announced that fiscal year 2024 concluded with
      record-breaking operational momentum, delivering cash-flow positive performance led by 88% growth in behavioral
      biometrics solutions, followed by the appointment of Thomson Reuters veteran David Larson as Chief Financial
      Officer.


      Despite these reported operational milestones, Feedzai maintains strict confidentiality regarding its audited
      financial statements and underlying unit economics. Key operating indicators—including precise Annual Recurring
      Revenue (ARR), gross margin percentages, net revenue retention (NRR), customer acquisition costs (CAC), and
      customer payback periods—are completely absent from public disclosures. Consequently, institutional underwriting
      requires access to private company ledgers to verify whether compute costs compress software margins at scale and
      to evaluate the organic expansion efficiency of mature banking cohorts.
  - id: capital-adequacy-and-financial-verdict
    title: Capital Adequacy & Forward Financial Verdict
    claimRefs:
      - CI004
      - CI008
      - CI009
      - CI010
      - CI011
      - CI012
      - CI014
    tableRefs: []
    figureRefs: []
    body: >-
      Feedzai possesses substantial balance sheet capitalization following its October 2025 Series E funding round,
      which raised approximately $75 million at a post-money valuation exceeding $2.0 billion. Backed by institutional
      investors including Lince Capital, Iberis Capital, Explorer Investments, Oxy Capital, and Buenavista Equity
      Partners, Feedzai's cumulative capital raised stands at $347 million to $352 million across seven funding rounds.
      This liquidity cushion, paired with company-claimed cash-flow positivity since fiscal year 2024, provides
      comfortable operating runway without imminent financing dependency.


      Capital allocation has increasingly targeted strategic inorganic expansion and sovereign-scale institutional
      mandates. In April 2025, Feedzai deployed capital to acquire financial data management specialist DemystData in a
      transaction valued at $157 million, expanding its data ingestion and identity enrichment capabilities.
      Commercially, Feedzai was selected by the European Central Bank as the first-ranked tenderer in a central fraud
      management framework agreement for the digital euro valued between €79.1 million and €237.3 million, with
      implementation supported by subcontractor PwC. Feedzai's financial profile presents premier tier-one banking
      traction, but a final investment underwriting remains blocked until confidential ARR, retention, and gross margin
      disclosures are provided.
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Revenue Stream
      - Monetization Mechanism
      - Pricing Unit
      - Current Status & Scale
      - Revenue Quality
      - Diligence Underwriting Ask
    rows:
      - - RiskOps Platform License
        - Annual recurring platform software license
        - Per core / deployment instance
        - Core production revenue across global tier-1 banks
        - High recurring quality with multi-year commitments
        - Contract duration, minimum commit levels, and renewal rates
      - - Transaction Scoring Tier Fees
        - Tiered volume-based processing fee
        - Per event / per transaction scored
        - Assesses $9T+ volume and 120B+ events annually
        - Usage-based recurring with volume step-downs
        - Overage pricing terms, floor commitments, and volume elasticity
      - - Professional & Integration Services
        - Fixed-fee and time-and-materials deployment
        - Per implementation project / milestone
        - Essential for complex 5-12 month bank integrations
        - Low margin, non-recurring deployment revenue
        - Services revenue share, utilization rate, and margin contribution
      - - Consortium & Value-Add Intelligence
        - Subscription add-on (Feedzai IQ / Farol AI)
        - Per active identity / cross-bank risk signal
        - Emerging commercial stream launched in 2025-2026
        - High potential software margin expansion
        - Standalone attach rates and incremental ACV contribution
    notes: >-
      Revenue stream categorization based on Feedzai product documentation, enterprise contract patterns, and competitor
      pricing comparisons; private commercial mix percentages are not publicly disclosed.
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI007
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Product Line / Component
      - Contract & Unit Model
      - List vs. Realized Structure
      - Discounts & Unverified Terms
      - Primary Source Evidence
    rows:
      - - Core RiskOps Enterprise Suite
        - Multi-year enterprise contract with annual commitments
        - Custom quoted only; no public list price published
        - Discounts tied to multi-year term commitments and volume tiers
        - Fraudio competitor analysis (SI001) and Tracxn profile (SI002)
      - - Real-Time Fraud Detection (PFD)
        - Tiered annual volume bands with per-transaction overages
        - Enterprise negotiation based on institution asset size
        - Minimum annual spend floors required; specific tier thresholds private
        - Industry peer reviews (SI001) and company releases (SI003)
      - - Feedzai IQ & Network Intelligence
        - Add-on annual subscription to core platform
        - Packaged per covered account / monitored volume
        - Bundled discounts during new enterprise rollouts unknown
        - Official product announcements (SI007) and Newsroom (SI008)
      - - Implementation & Advisory Services
        - Milestone-based professional services statement of work
        - Mandatory custom scoping based on legacy bank architecture
        - Subcontractor margin sharing with partners like PwC undisclosed
        - Finovate deal reporting (SI009) and competitor reviews (SI001)
    notes: >-
      Pricing figures reflect custom enterprise procurement conventions; Feedzai does not publish standardized list
      prices or discount matrices.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI011
  - id: TI003
    title: Unit economics table
    columns:
      - Financial & Unit Metric
      - Reported / Estimated Value
      - Confidence Level
      - Analytical Significance
      - Diligence Underwriting Ask
    rows:
      - - Annual Recurring Revenue (ARR)
        - null
        - Low (Undisclosed)
        - Defines true recurring baseline and revenue multiple valuation
        - Request verified trailing-twelve-month ARR by customer cohort
      - - Gross Margin Percentage
        - null
        - Low (Undisclosed)
        - Measures software gross profitability versus cloud scoring overhead
        - Obtain gross margin bridge separating software and professional services
      - - Net Revenue Retention (NRR)
        - null
        - Low (Undisclosed)
        - Demonstrates expansion within enterprise accounts and churn defense
        - Review historical net retention and logo churn over past 36 months
      - - Implementation Runway
        - 5 to 12 months
        - Medium
        - Indicates sales cycle friction, working capital drag, and time to value
        - Audit average historical implementation time from signature to go-live
      - - Operating Cash Flow Status
        - Cash-flow positive (FY2024)
        - Medium
        - Establishes baseline operational sustainability without near-term dilution
        - Examine audited cash flow statements for FY2024 and FY2025
    notes: >-
      Private financial metrics are undisclosed by Feedzai management; null values represent critical information gaps
      requiring access to confidential diligence materials.
    claimRefs:
      - CI003
      - CI004
      - CI013
      - CI014
