callouts:
  - calloutType: insight
    title: Enterprise Contract Density vs. Pricing Inflexibility
    body: >-
      Feedzai's commercial positioning is anchored in multi-year enterprise contracts with tier-one banking institutions
      processing massive payment volumes. While this procurement structure creates durable, sticky revenue relationships
      with high switching costs, competitor intelligence reveals that high upfront commitments and 5-to-12-month
      implementation cycles effectively exclude mid-market fintechs and fast-growing payment facilitators.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI013
  - calloutType: risk
    title: Underwriting Blocker from Undisclosed Core Financial Metrics
    body: >-
      Despite public milestones including a $2.0B post-money valuation, $347M+ in cumulative funding, and reported
      cash-flow positivity in fiscal year 2024, Feedzai maintains strict confidentiality around its fundamental
      financial performance. Key indicators such as current ARR, gross margin percentage, net revenue retention, and
      monthly cash burn remain completely private, representing material diligence blockers for prospective investors.
    claimRefs:
      - CI004
      - CI008
      - CI010
      - CI014
