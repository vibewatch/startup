chapter:
  number: 7
  title: "Risks"
  summary: "Feedzai's largest underwritable risks are model performance under adversarial change, privacy and governance assurance for cross-institution intelligence, and execution at the scale claimed in company materials. The public evidence describes mitigations, but it is predominantly company-issued and does not disclose audited uptime, customer concentration, contractual exposure, or financial downside."
sections:
  - id: "ranked-risk-view"
    title: "Ranked Risk View and Investment Implications"
    body: |
      The highest residual risk is evidence quality around mission-critical performance, not proof of a known failure. Feedzai says its platform processes 90 billion events and secures $8 trillion in payments annually on LinkedIn, while March and June 2026 product materials use $9 trillion and, in one case, 120 billion events. Those figures may reflect growth or different definitions, but the public materials do not reconcile the periods or denominators. At that stated scale, model drift, false positives, latency, and availability deserve critical diligence even though the assigned evidence contains no verified outage or enforcement record.

      The next tier combines regulatory assurance and integration execution. Feedzai describes privacy-preserving federated intelligence, lightweight API delivery, and broad compliance tooling, but those are company claims rather than independent audits. The investment implication is therefore conditional: require customer-level validation, uptime and model-governance evidence, and quantified financial exposure before treating the public mitigation narrative as proven.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR008"
      - "CR016"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "regulatory-legal-model-governance"
    title: "Regulatory, Legal, Privacy, and Model-Governance Exposure"
    body: |
      Feedzai's products sit inside regulated fraud and financial-crime workflows, but the assigned public record supports architectural descriptions rather than a complete legal posture. The company says Feedzai IQ uses federated learning on anonymized, distributed information and that IQ Score transmits network intelligence without raw customer data. It also historically described RiskOps as supporting policies including PSD2, GDPR, and TILA. These disclosures are relevant mitigations, but they do not establish how controls perform in each customer deployment, whether every cross-border signal is treated consistently, or whether regulators and customers have independently validated the controls.

      A second governance risk is performance substantiation. The claimed four-times detection improvement and 50% alert reduction come from company-issued releases. Before underwriting those gains, diligence should obtain model cards, validation cohorts, false-positive and false-negative distributions, fairness testing, override controls, and incident records. The legal register is deliberately a sample of evidenced risk areas, not a representation that no litigation or enforcement exists.
    claimRefs:
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR010"
      - "CR015"
    tableRefs:
      - "TR001"
  - id: "operational-partner-financial-dependencies"
    title: "Operational, Partner, and Financial-Model Dependencies"
    body: |
      Feedzai itself describes fraud as an adversarial domain in which behavior and attack modes change continuously. RiskFM is still being validated with early adopters, so production generalization across institutions and geographies remains a monitorable execution risk rather than a settled capability. The product strategy also depends on collective network signals, customer participation, API integration, and distribution through AWS Marketplace. Those dependencies may accelerate deployment, but they create diligence questions about data continuity, integration support, commercial terms, and the effect of losing a material contributing institution.

      Public evidence does not quantify revenue concentration, renewal exposure, burn, runway, loss-sharing, service-level penalties, or the cost of operating and validating customer-specific models. The correct response is not to manufacture a probability or cash-loss estimate. The thesis should instead break if independent tests show persistent model degradation, material customer exits reduce network coverage, privacy controls fail review, or management cannot provide audited availability, concentration, and financial-risk schedules.
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR007"
      - "CR009"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR016"
    tableRefs:
      - "TR003"
