figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Institutional customer adoption lifecycle spanning sandbox API evaluation, enterprise integration, production multi-rail rollout, and federated network intelligence expansion.
    data:
      items:
        - label: 1. Evaluation & Sandbox
          stage: Evaluation
          touchpoints:
            - API evaluation
            - AWS Marketplace trial
            - Historical data sample
          summary: Prospective institution evaluates Feedzai IQ Score via API or AWS Marketplace to test fraud detection lift.
        - label: 2. Pilot & Benchmark
          stage: Pilot
          touchpoints:
            - Parallel testing
            - Bespoke supervised models
            - RiskOps Studio demo
          summary: Customer benchmarks TrustScore and model accuracy against existing rule engines and incumbent fraud tools.
        - label: 3. Procurement & Contracting
          stage: Procurement
          touchpoints:
            - Security review
            - Compliance audit
            - Enterprise contract negotiation
          summary: Procurement involves intensive security vetting, compliance alignment, and custom enterprise licensing.
        - label: 4. Production Integration
          stage: Integration
          touchpoints:
            - Center of Excellence onboarding
            - Matrix USA integration
            - Cloud or on-prem deployment
          summary: Integration spans months, connecting real-time payment rails, card transactions, and AML workflows.
        - label: 5. Multi-Rail Operationalization
          stage: Production
          touchpoints:
            - RTP and instant payments
            - Account-to-account CFR score
            - Automated alert triage
          summary: Customer operates Feedzai across real-time rails, integrating partner defenses like Mastercard CFR.
        - label: 6. Network Intelligence Expansion
          stage: Expansion
          touchpoints:
            - Feedzai IQ network
            - Cross-institution fraud signals
            - RiskFM foundation model
          summary: Account expands into cross-institution federated fraud intelligence and multi-product RiskOps unification.
    approximationNotes: Illustrates typical tier-1 institutional onboarding and expansion stages synthesized from product releases and competitor integration benchmarks.
