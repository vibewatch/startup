callouts:
  - calloutType: strength
    title: Global Network Scale and Tier-1 Institutional Validation
    body: Feedzai secures $9 trillion in annual transaction volume across 120 billion events worldwide, anchored by marquee institutional engagements with Mastercard, Peoples Group, Novobanco, and the European Central Bank. This vast transactional footprint provides an unmatched data advantage for training tabular risk models and generating privacy-preserving network intelligence.
    claimRefs:
      - CU002
      - CU004
      - CU011
      - CU012
  - calloutType: risk
    title: Procurement Friction, Long Onboarding Cycles, and Private Revenue Metrics
    body: While Feedzai exhibits strong retention among major enterprise customers, independent competitor analysis indicates that onboarding runs to months, pricing lacks public transparency, and implementation overhead presents substantial barriers for mid-market and smaller financial institutions. Crucially, private operating metrics including ARR, net revenue retention, and customer concentration remain undisclosed.
    claimRefs:
      - CU013
      - CU014
      - CU015
