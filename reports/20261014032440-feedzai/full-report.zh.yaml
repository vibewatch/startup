              - CR015
      - number: '7.3'
        title: 运营、伙伴与财务模型依赖
        blocks:
          - type: paragraph
            body: >
              Feedzai 自身把欺诈描述为一个对抗性领域：行为和攻击模式持续变化。RiskFM
              仍在早期采用者中验证，因此其跨机构、跨地域的生产泛化仍是需要监测的执行风险，而不是已经确定的能力。产品战略还依赖集体网络信号、客户参与、API 集成和 AWS Marketplace
              分发。这些依赖可能加快部署，但也带来关于数据连续性、集成支持、商业条款以及失去重要贡献机构后影响的尽调问题。


              公开证据没有量化收入集中度、续约暴露、现金消耗、现金续航、损失分担、服务级别罚金，或运营和验证客户专属模型的成本。正确做法不是制造概率或现金损失估算。只有在独立测试显示模型持续退化、重要客户退出导致网络覆盖收缩、隐私控制未通过审查，或管理层无法提供经审计的可用性、集中度和财务风险明细时，投资论点才应被打破。
            claimRefs:
