        title: 高管团队与公司治理
        blocks:
          - type: paragraph
            body: >-
              Feedzai 仍由创始技术团队领导，CEO 兼董事长 Nuno Sebastião 担任核心负责人；他此前曾为欧洲航天局设计实时分布式系统 [CO001, CO003]。联合创始人 Pedro Bizarro
              任首席科学官，Paulo Marques 任首席技术官；两人此前都是科英布拉大学计算机科学系教师，长期专注于机器学习算法和容错计算 [CO001,
              CO003]。为在潜在战略流动性事件前完善成熟治理、资本规划和财务报告，Feedzai 于 2024 年 5 月任命软件行业资深人士 David Larson 为首席财务官
              [CO004]。尽管高管阵容有所扩充，技术决策和产品方向仍高度集中在创始团队手中 [CO003]。
            claimRefs:
