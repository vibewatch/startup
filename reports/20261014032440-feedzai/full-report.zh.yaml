    sections:
      - number: '1.1'
        title: 公司身份与核心使命
        blocks:
          - type: paragraph
            body: >-
              Feedzai 于 2011 年在葡萄牙科英布拉注册成立，早期通过开发专为支付欺诈防控设计的高吞吐流式分析和实时机器学习基础设施，建立了技术声誉
              [CO001]。过去十年，公司将运营版图扩展至全球，在纽约市保留高管团队和商业运营，同时在里斯本和科英布拉设有重要的研究与软件开发中心 [CO002]。Feedzai 已进入后期成熟阶段，将旗舰 RiskOps
              软件平台定位为端到端防线，把反洗钱、欺诈防控和行为生物识别整合进复杂的机构交易流程 [CO010]。如今，公司每年保护超过 $9T 的支付交易额和 120B 笔交易，为全球银行消费者提供保障 [CO010]。
