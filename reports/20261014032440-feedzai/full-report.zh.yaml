              过去 18 个月，Feedzai 达成多个关键运营和商业里程碑，包括 2025 年 2 月与 Mastercard 建立多年期全球合作，将 Consumer Fraud Risk 评分推广至全球支付网络
              [CO008]。2025 年 4 月，公司以预计 $157M 完成对 DemystData 的战略收购，将外部数据织物管道直接整合进决策架构 [CO009]。2025 年 10 月，Feedzai
