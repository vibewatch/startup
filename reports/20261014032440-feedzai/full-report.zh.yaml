      - number: '3.4'
        title: 采购壁垒、定价动态与替代风险
        blocks:
          - type: paragraph
            body: >-
              一级银行欺诈防控的客户留存，受到极高切换成本和集成摩擦的强化。部署 Feedzai 需要深度集成核心银行交换机、实时支付轨道和机构合规数据库，并在 SR 26-2
              等监管框架下严格验证模型。此外，企业销售周期受到高度保护：供应商不公布目录价格，并要求签署严格的保密协议后才会提供 API 规格或商业条款。不过，Feedzai 依赖定制化企业部署也带来脆弱性。标准企业 ERP
              连接器缺失，限制了其在银行支付轨道以外的用途；与此同时，中型银行越来越青睐开箱即用的智能代理平台或 AWS Marketplace 上的 Feedzai IQ Score 这类自助 API
