        title: 资本结构、估值与投资者构成
        blocks:
          - type: paragraph
            body: >-
              自成立以来，Feedzai 通过 A 至 E 轮累计融资约 $431M [CO006]。2025 年 10 月，公司完成约 $75M 的投资轮，投后公司估值正式升至 $2.0B [CO005]。本轮引入
              Lince Capital、Iberis Capital 和 Explorer Investments 等机构投资者，同时获得长期私募股权赞助方 Oxy Capital 和 Buenavista Equity
              Partners 的追加支持 [CO007]。这轮融资增强了资产负债表稳定性，但 Feedzai 不公开发布经审计财报，因此年经常性收入、毛利率表现、净收入留存率和现金消耗情况仍完全不透明 [CO015]。
