              在大型企业客户中展现出较强留存，但独立竞争者分析显示，上线需要数月，定价缺乏公开透明度，实施负担给中型和小型金融机构造成很高门槛。更关键的是，ARR、净收入留存率和客户集中度等私有运营指标仍未披露。
            calloutType: risk
            claimRefs:
              - CU013
              - CU014
              - CU015
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与投资含义
        blocks:
          - type: paragraph
            body: >
              最高的剩余风险是任务关键型性能的证据质量，而不是已有已知失败的证明。Feedzai 在 LinkedIn 上称其平台每年处理 90B 个事件、保护 $8T 的支付交易额，但 2026 年 3 月和 6
              月的产品材料使用了 $9T，其中一份还写到 120B
              个事件。这些数字可能反映增长或不同口径，但公开材料没有调和各期间和分母。在这一声明规模下，即使指定证据中没有经核实的宕机或监管执法记录，模型漂移、误报、延迟和可用性仍值得重点尽调。


              下一层风险结合了监管保障和集成执行。Feedzai 描述了保护隐私的联邦智能、轻量级 API
              交付和广泛的合规工具，但这些属于公司口径，而非独立审计。因此，投资含义是有条件的：在把公开缓解叙事视为已证实之前，必须取得客户层面的验证、正常运行时间和模型治理证据，以及量化的财务暴露。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR016
