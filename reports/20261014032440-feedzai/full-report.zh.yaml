  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义、分类与边界条件
        blocks:
          - type: paragraph
            body: >-
              企业金融犯罪防控市场属于监管科技（RegTech）和金融服务基础设施中的专业细分领域。核心类别包括用于实时检测、防止和调查欺诈交易、金融诈骗及非法资金流的软件解决方案。可计入支出包括金融机构部署的软件许可、软件即服务订阅、风险评分
              API
              和自动化监管报告引擎。相反，通用企业网络安全、面向企业员工的身份访问管理以及非金融数据合规，不属于当前直接可服务市场。企业金融犯罪防控平台专门把行为画像、欺诈检测和反洗钱监控整合到银行渠道的统一风险管理层。过去，金融机构为交易欺诈和事后
              AML 合规维护彼此隔离的规则架构。如今，买方越来越需要覆盖欺诈检测、AML 和风险决策的表格型 AI 基础模型，贯穿整个金融犯罪生命周期，而不是孤立的点工具。Feedzai 专注于部署在 AWS
              云基础设施上的实时欺诈防控和反洗钱方案，技术正处于高交易量处理与合规风险的交汇点。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 市场规模视角与可服务支出层
        blocks:
          - type: paragraph
            body: >-
              估算金融犯罪防控软件市场时，必须区分金融犯罪损失总额、整体合规预算和可服务软件支出。2024 年，全球消费者和商业欺诈损失超过 $1T，欺诈者越来越多地使用 AI
              技术，凸显金融机构投资现代防御基础设施的宏观必要性。在这一宏观损失环境下，全球企业在专业欺诈检测和 AML
              合规上的软件支出，构成一个目标明确且价值较高的支出池。英国部署账户到账户诈骗检测方案后，授权推送支付诈骗金额下降超过 12%，说明可量化的损失缓解能直接支撑企业软件预算。从运营规模看，Feedzai
              平台基础设施覆盖全球 90 多个国家的交易和消费者保护。此外，Feedzai 网络智能平台在四大洲数百家金融机构中分析超过 $8T 的年支付交易额。Feedzai TrustScore
              等协作式网络风险评分，最多可将欺诈检测能力提高 4x，同时将审核告警减少 50%，为企业级多租户风险评分建立较高 ROI。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM008
      - number: '2.3'
        title: 买方分层、预算归属与采购路径
        blocks:
          - type: paragraph
            body: >-
              金融犯罪解决方案的可服务买方市场，按机构规模、监管要求和交易吞吐量明显分层。Feedzai
              的核心商业重点是一级银行、支付处理商和拥有企业级交易量的大型支付网络。与数字金融科技公司和中型区域银行相比，这些一级买方有不同的技术要求，更看重亚秒级延迟、高可用性、全渠道覆盖和私有云部署。一级机构的企业金融犯罪解决方案通常对应
              $500,000 至超过 $2,000,000 的年度合同额，反映其任务关键地位以及与核心银行系统的深度集成。一级银行金融犯罪部署的采购、安全评估和概念验证（PoC）周期通常为 9 至 18
              个月，对新兴厂商构成较高的市场进入门槛。这些机构的预算通常集中在首席风险官、首席合规官或欺诈运营负责人组织，技术签核则需要首席信息安全官和企业 IT 采购委员会参与。
            claimRefs:
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: 增长驱动、技术变化与采用瓶颈
        blocks:
          - type: paragraph
            body: >-
              现代金融犯罪软件的采用受到复合型威胁和支付基础设施演进的推动。超过 50% 的复杂欺诈攻击会武器化生成式 AI
              工具和非法取得的凭证，使静态规则引擎和传统启发式模型越来越失效。与此同时，实时支付轨道在全球扩张，例如美国 FedNow
              和加拿大即将推出的实时支付轨道，将决策窗口压缩到毫秒级，迫使机构转向流式机器学习和表格型基础模型。然而，显著的组织摩擦抑制了企业快速采用。金融机构表示 AI
              工具支出很高，却仍受割裂的数据架构和人工调查瓶颈限制。传统核心银行系统往往缺少现代 API 集成，因此需要更长的专业服务和变更管理。为突破部署瓶颈，Feedzai 与系统咨询公司 Matrix USA
              合作运营卓越中心，协助银行现代化欺诈和 AML 基础设施，这说明平台采用高度依赖企业服务配合。
            claimRefs:
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 风险与合规部门掌握企业预算
            body: 金融犯罪防控预算越来越集中在首席风险官和首席信息安全官的联合职责下，逐渐脱离分散的部门级欺诈工具。企业买方优先选择能接入全渠道数据、在欺诈和 AML 合规之间共享风险情报的统一平台。
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
              - CM009
          - type: callout
            title: 销售周期长与系统集成瓶颈
            body: 一级银行部署需要严格的采购、安全审查和集成流程，周期为 9 至 18 个月。必须与 Matrix USA 等咨询公司合作，凸显了在不扰乱核心支付处理的前提下部署实时表格型风险模型所需的高服务门槛。
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
              - CM014
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与市场分层
        blocks:
          - type: paragraph
            body: >-
              金融犯罪防控和监管科技生态高度按机构规模、技术架构和核心买方角色分层。在高端市场，Feedzai 直接对标 NICE Actimize 等传统企业欺诈套件，以及 Featurespace（Visa 旗下方案）和
              BioCatch 等专业行为分析平台。传统供应商在一级和二级银行拥有广泛全球覆盖，但其架构往往存在代码库割裂和总拥有成本偏高的问题。相比之下，Feedzai 将统一的 RiskOps 平台
              定位为单一云原生引擎，整合交易欺诈筛查、AML 交易监控和账户开户。同时，Sardine、Hawk AI 和 FluxForce
              等新兴平台瞄准快速增长的金融科技公司和中型机构，满足其快速部署、降低运营复杂度且无需多年企业集成周期的需求。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: 竞争者规模、分类与直接替代方案
        blocks:
          - type: paragraph
            body: >-
              金融犯罪防控的替代方案可分为三类同类产品：成熟企业套件、专业行为与身份点工具，以及灵活的合规优先平台。企业老牌厂商在全球系统重要性银行中保持主导渗透，但其传统规则引擎若没有大量定制工程，难以匹配现代实时延迟阈值。BioCatch
              等专业供应商聚焦会话生物识别和账户接管检测，通常作为补充层运行，而非覆盖全生命周期的平台。Feedzai 通过将实时支付评分与原生行为生物识别结合，并借助与 Mastercard 和 Matrix USA
              的联盟实现全球网络分发，从这些点工具中脱颖而出。新兴监管科技竞争者虽然获得大量风险资本支持，但主要集中在赞助银行和金融科技账户，而不是一级核心银行基础设施。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP007
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.3'
        title: 能力比较、架构护城河与定位
        blocks:
          - type: paragraph
            body: >-
              金融犯罪防控的技术差异化已从静态规则演进到基础模型、联邦学习和自主智能代理工作流。Feedzai 通过 Digital Trust 行为生物识别引擎和 Feedzai IQ
              联邦智能建立了持久的架构护城河：在不暴露底层敏感客户记录的情况下，汇总参与银行的匿名风险信号。此外，其专有的 RiskFM 表格型基础模型试图用通用的预训练交易智能，替代逐客户调参。相反，FluxForce 等
              智能代理式挑战者的差异化重点不是纯粹的原始吞吐量，而是工作流自动化；它们提供原生可疑活动报告（SAR）叙事生成和可审计决策轨迹，直接缓解中型机构合规人员积压严重的问题。
            claimRefs:
              - CP005
              - CP006
              - CP013
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP013
          - type: figure
            figureRef: FP001
