    title: 产品架构图
    type: stack
    summary: Feedzai RiskOps 平台的多层架构，覆盖基础设施、数据摄取、核心决策、智能模型和分析师体验。
    data:
      layers:
        - label: 分析师体验与案件管理层
          modules:
            - Farol 代理式 AI 助手
            - RiskOps 统一案件管理器
            - 告警优先级排序与分流控制台
        - label: 应用与解决方案套件层
          modules:
            - 卡与支付反欺诈
            - 账户接管（ATO）防护
            - AML 交易监控与观察名单筛查
        - label: 网络智能与基础模型
          modules:
            - Feedzai IQ TrustScore 与 TrustSignals
            - RiskFM 表格基础模型
            - 联邦式隐私保护协同防御
        - label: 实时评分与推理引擎
          modules:
            - Pulse 风险评分引擎
            - 确定性规则执行
            - 白盒解释与模型治理
        - label: 全渠道数据摄取与集成
          modules:
            - RESTful 摄取 API
            - 第三方参考数据适配器
            - 行为生物识别与设备指纹采集器
        - label: 云基础设施与部署平台
