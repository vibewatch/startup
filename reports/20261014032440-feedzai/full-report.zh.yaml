        title: 展示项
        blocks:
          - type: callout
            title: 打破投资论点的触发条件
            body: 如果独立验证显示模型持续退化，隐私控制未通过客户或监管机构审查，经审计的可用性未达到合同阈值，重要客户退出导致网络覆盖收窄，或管理层无法提供集中度、SLA、损失暴露、现金消耗和现金续航明细，则应暂停或拒绝投资。
