  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 机构客户采用生命周期涵盖沙盒 API 评估、企业集成、生产环境多支付轨道上线以及联邦网络智能扩展。
    data:
      items:
        - label: 1. 评估与沙盒
          stage: Evaluation
          touchpoints:
            - API 评估
            - AWS Marketplace 试用
            - 历史数据样本
          summary: Prospective institution evaluates Feedzai IQ Score via API or AWS Marketplace to test fraud detection lift.
        - label: 2. 试点与基准测试
          stage: Pilot
          touchpoints:
            - 并行测试
            - 定制监督模型
            - RiskOps Studio 演示
          summary: Customer benchmarks TrustScore and model accuracy against existing rule engines and incumbent fraud tools.
        - label: 3. 采购与签约
          stage: Procurement
          touchpoints:
            - 安全审查
            - 合规审计
            - 企业合同谈判
          summary: Procurement involves intensive security vetting, compliance alignment, and custom enterprise licensing.
        - label: 4. 生产集成
          stage: Integration
          touchpoints:
            - 卓越中心上线
            - Matrix USA 集成
            - 云端或本地部署
          summary: Integration spans months, connecting real-time payment rails, card transactions, and AML workflows.
        - label: 5. 多支付轨道运营化
          stage: Production
          touchpoints:
            - RTP 与即时支付
            - 账户到账户 CFR 评分
            - 自动化告警分流
          summary: Customer operates Feedzai across real-time rails, integrating partner defenses like Mastercard CFR.
        - label: 6. 网络智能扩展
          stage: Expansion
          touchpoints:
            - Feedzai IQ 网络
            - 跨机构欺诈信号
            - RiskFM 基础模型
          summary: Account expands into cross-institution federated fraud intelligence and multi-product RiskOps unification.
    approximationNotes: 展示典型一级机构的上线和扩展阶段，综合自产品发布和竞争对手集成基准。
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU008
      - CU011
      - CU013
