      - number: '7.2'
        title: 监管、法律、隐私与模型治理暴露
        blocks:
          - type: paragraph
            body: >
              Feedzai 的产品嵌入受监管的欺诈和金融犯罪工作流，但指定公开记录支持的是架构描述，而非完整法律状况。公司称 Feedzai IQ 使用基于匿名化、分布式信息的联邦学习，IQ Score
              在不传输原始客户数据的情况下传输网络智能。公司过去还称 RiskOps 支持 PSD2、GDPR 和 TILA
              等政策。这些披露属于相关缓解因素，但不能证明控制措施在每个客户部署中的表现，也不能证明所有跨境信号都得到一致处理，更不能证明监管机构和客户已独立验证这些控制措施。


              第二项治理风险是性能证明。所谓告警减少
              50%，来自公司发布的材料。在把这些收益纳入投资判断前，尽调应取得模型卡、验证客户群、误报和漏报分布、公平性测试、人工覆写控制及事故记录。法律登记册刻意只列出有证据支持的风险领域样本，并不代表不存在其他诉讼或监管执法。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR010
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR007
