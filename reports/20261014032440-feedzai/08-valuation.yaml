  - calloutType: risk
    title: 'Downside Exposure: Multiple Compression and Opaque Growth'
    body: Without verified top-line growth rates, entry at $2.0 billion exposes investors to severe down-round risk if enterprise procurement cycles lengthen or ARR multiples contract.
    claimRefs:
      - CV004
      - CV009
      - CV010
