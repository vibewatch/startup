callouts:
  - calloutType: recommendation
    title: 'Underwriting Stance: Maintain Research-More Rating'
    body: Given Feedzai's undisclosed ARR, customer retention, and unit margins, an investment at a $2.0 billion valuation cannot be underwritten with high confidence without confirmatory access to private financial records.
    claimRefs:
