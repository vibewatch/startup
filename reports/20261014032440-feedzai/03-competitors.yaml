callouts:
  - calloutType: "insight"
    title: "Network Intelligence as a Compounding Structural Moat"
    body: "Feedzai's rollout of Feedzai IQ and RiskFM leverages collective transaction intelligence across a reported $9 trillion payment volume, creating a compounding data advantage that pure-play software vendors and single-institution models cannot match without shared consortium data."
    claimRefs:
      - "CP004"
      - "CP006"
      - "CP014"
  - calloutType: "risk"
    title: "Mid-Market Vulnerability to Specialized Agentic Platforms"
    body: "While Feedzai maintains dominance in tier-1 financial institutions with high-throughput card fraud engines, newer agentic competitors such as FluxForce are gaining traction in mid-market banks by automating labor-intensive workflows like Suspicious Activity Report drafting and offering rapid onboarding without enterprise sales friction."
    claimRefs:
      - "CP010"
      - "CP013"
      - "CP015"
