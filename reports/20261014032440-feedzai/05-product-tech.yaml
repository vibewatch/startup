chapter:
  number: 5
  title: "Product & Technology"
  summary: "Feedzai provides an end-to-end, AI-native financial crime prevention platform that unifies fraud detection, identity verification, and anti-money laundering (AML) transaction monitoring within a single RiskOps architecture. Powered by the proprietary Pulse Risk Engine capable of evaluating over 3,000 transactions per second in real time with sub-second latency, recent 2025-2026 innovations include RiskFM—the industry's first tabular foundation model—the Farol embedded agentic AI assistant, and privacy-preserving network intelligence via Feedzai IQ."
sections:
  - id: "product-overview-and-workflow"
    title: "Product Definition and Workflow Integration"
    body: "Feedzai delivers an end-to-end AI-native platform designed to prevent financial crime across the entire customer lifecycle. Rather than deploying fragmented point solutions for fraud, AML, and identity verification, Feedzai consolidates risk decisioning into a single RiskOps platform. The system operates across omnichannel touchpoints, securing inbound and outbound payments, new account opening, digital onboarding, account takeover (ATO), and authorized push payment (APP) scams. By unifying behavioral biometrics, device intelligence, and transactional telemetry into cohesive customer risk profiles, Feedzai enables financial institutions to detect emerging threats without introducing customer friction or false positive alert fatigue."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE007"
      - "CE014"
    tableRefs:
      - "TE001"
  - id: "platform-architecture-and-technology"
    title: "Platform Architecture and the Pulse Risk Engine"
    body: "At the technological core of Feedzai's platform is the Pulse Risk Engine, a proprietary scoring engine that executes hybrid decisioning in milliseconds. The engine blends deterministic business rules with state-of-the-art machine learning models to assess incoming events at an enterprise scale exceeding 3,000 transactions per second. Feedzai's stack is built on top of Amazon Web Services (AWS) cloud infrastructure, utilizing out-of-the-box REST APIs and data adapters to integrate reference data and third-party feeds. The company also maintains open-source developer assets on GitHub, including TimeSHAP for recurrent neural network explainability, FairGBM for responsible machine learning fairness, and PulseDB for transparent database mapping."
    claimRefs:
      - "CE002"
      - "CE003"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE012"
    figureRefs:
      - "FE001"
    tableRefs:
      - "TE003"
  - id: "ai-advancements-and-network-intelligence"
    title: "AI Innovation: RiskFM, Feedzai IQ, and Farol"
    body: "In 2025 and 2026, Feedzai expanded beyond supervised gradient boosting into frontier AI paradigms for financial crime prevention. In March 2026, the company unveiled RiskFM, the industry's first tabular foundation model purpose-built for financial data and multi-stage risk decisioning across card payments, real-time rails, and AML. Complementing this foundation layer is Feedzai IQ, launched in 2025, which leverages federated learning to extract collaborative network intelligence across participating banks without sharing sensitive customer data. Furthermore, in September 2026, Feedzai introduced Farol, an embedded agentic AI assistant designed to eliminate analyst case review bottlenecks by autonomously reasoning over complex fraud investigation workflows."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE007"
  - id: "deployment-integration-and-technical-risks"
    title: "Deployment, Partner Ecosystem, and Operational Risks"
    body: "Feedzai supports flexible enterprise delivery models, offering managed Software-as-a-Service (SaaS) through AWS Marketplace alongside hybrid and on-premises deployments for institutions with strict regulatory data residency constraints. To streamline delivery, Feedzai partners with systems integrators such as IT Smart Systems, embedding real-time fraud decisioning directly into digital banking architectures, SEPA payment rails, and European instant payment infrastructures. However, integrating modern AI risk scoring into legacy mainframe core banking environments introduces potential latency overhead, protocol mismatches, and data synchronization hurdles that represent a key technical diligence focus for prospective enterprise buyers."
    claimRefs:
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE013"
    tableRefs:
      - "TE002"
