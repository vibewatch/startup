- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - mitigation / diligence ask
  rows:
  - - Domestic manufacturing plus Blue UAS trust
    - >-
      Skydio, Red Cat, and Anduril all sell into the same trust narrative, so compliance is a gate but not a monopoly moat
    - high
    - >-
      Confirm where PDW has sole-source or sole-qualified status instead of mere parity on trust credentials
  - - 74-minute endurance and 15-pound payload
    - >-
      Some buyers may not pay for excess capability when the real job is short-duration room entry, DFR, or lightweight squad ISR
    - high
    - >-
      Segment recent wins by mission type and test whether payload headroom actually changed the purchase outcome
  - - One stack across ISR, relay, and strike adjacency
    - >-
      Anduril, Shield, and Red Cat are all moving toward broader autonomy or strike narratives with larger capital bases
    - high
    - >-
      Map which mission bundles are truly unique to PDW versus reproducible by higher-capital rivals within 12-24 months
  - - Open architecture and partner ecosystem
    - >-
      Shared domestic suppliers make PDW faster to field but also easier for competitors to imitate
    - medium
    - >-
      Request an integration roadmap showing which payloads or radios are contract-exclusive, proprietary, or already commoditized
  - - Public-safety expansion from defense-bred hardware
    - >-
      BRINC/Motorola and Skydio already sit closer to dispatch, 911, and DFR operating systems than PDW does
    - high
    - >-
      Measure whether PDW has any recurring RTCC, 911, or public-safety software wedge beyond the airframe itself
  - - Federal tailwind from Chinese-drone restrictions
    - >-
      The restriction does not apply to all local or private work, so substitutes remain viable in part of the market
    - medium
    - >-
      Quantify PDW exposure to federally funded versus purely local buyers before attributing too much share tailwind to regulation
  notes: >-
    The register focuses on underwriting issues that could change long-term share assumptions. It intentionally separates trust-gate advantages from actual workflow control and realized commercial performance.
