callouts:
- calloutType: strength
  title: PDW has a real mission-breadth wedge, not just a better brochure
  body: >-
    The C100 plus Attritable Multirotor plus PDW CORE stack gives PDW a more complete operator package than most room-entry or single-mission specialists. That matters most when the buyer wants one domestic system to cover ISR, relay, payload growth, and strike-adjacent missions rather than buying several narrower tools.
  claimRefs:
  - CP001
  - CP008
  - CP009
  - CP037
- calloutType: risk
  title: >-
    BRINC and Skydio attack the workflow, which is more dangerous than matching raw airframe specs
  body: >-
    BRINC can ride Motorola into 911 and dispatch systems, while Skydio shows up with contract vehicles and a multi-budget software-and-hardware family. If PDW cannot insert itself into the same operational workflows, a technical edge on endurance or payload may not be enough to win the account.
  claimRefs:
  - CP013
  - CP018
  - CP033
  - CP038
- calloutType: risk
  title: >-
    Blue UAS helps PDW in federal channels, but does not eliminate cheaper substitutes everywhere else
  body: >-
    The domestic-procurement story is strongest on federal work, where covered foreign entities are now restricted. But private and purely local projects can still use those fleets, so PDW should not be underwritten as if trust-gate regulation alone guarantees local-market conversion.
