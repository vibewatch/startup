- id: direct-product-competition
  title: >-
    Direct product pressure: PDW’s endurance and payload lead face stronger autonomy, dispatch, and night-operations rivals
  body: >-
    PDW’s best technical argument is that the C100 occupies a mission class above most compact U.S. alternatives. A 74-minute ISR endurance envelope and 15-pound payload ceiling create real flexibility for relay, sensing, EW, or strike-adjacent payloads. That is a useful edge against Teal 2, which is lighter and easier to carry but optimized for shorter missions, and against BRINC Lemur 2, which is designed for room entry, two-way communications, and glass-breaking rather than long-endurance overwatch. But the spec lead does not end the competitive conversation. Skydio X10D answers with stronger autonomy, zero-light navigation, and procurement convenience through Blue UAS plus GSA and DLA access. Red Cat’s Teal 2 answers with a “good enough” tactical ISR package that is lighter, night-focused, and now attached to a fast-scaling public-company manufacturing story. BRINC answers by solving a narrower but economically sticky job inside public-safety response workflows. Shield’s V-BAT and Anduril’s
    Ghost family are less like-for-like on airframe geometry, yet they expand the comparison set for expeditionary or contested-environment buyers who may trade portability for stack depth or program backing. The result is that PDW wins if the buyer values mission breadth per operator; it loses if the buyer prizes autonomy, dispatch integration, or an already institutionalized procurement path more than payload headroom.
