- id: adverse-evidence-and-gaps
  title: >-
    Adverse evidence and diligence gaps: channel squeeze and local-market substitutes remain the main reasons to doubt durability
  body: >-
    The adverse case is not that PDW lacks a credible product. The adverse case is that better-financed rivals may capture the highest-value workflow positions before PDW’s recent funding and Army wins turn into durable market share. BRINC can make drones part of the emergency-response operating system through Motorola. Skydio can sell into public safety, infrastructure, and national security from a single autonomy brand with much larger manufacturing commitments. Red Cat is now scaling from a much smaller base but is doing so with strong growth, allied orders, and a clear “night tactical ISR” message. Anduril and Shield AI can widen the aperture of competition by persuading buyers to standardize on broader autonomy stacks rather than single-platform bundles. Even the federal trust tailwind has limits: the Chinese-drone restrictions clearly help domestic vendors on federal work, but DroneDeploy’s guide makes clear that non-federal and purely local projects can still use those substitutes.
    That means PDW’s easiest-growth story is narrower than a generic “American drones win” narrative suggests. The key missing diligence is commercial, not technical: realized prices, renewal cohorts, named competitive losses, and actual public-safety deployment counts. Until those numbers are available, PDW should be treated as a promising but still unproven scaler in a market where channel power may compound faster than airframe differentiation.
