  topStrengths:
    - >-
      Blue UAS approval, Army TiC contracts, and a first Air Force award indicate real procurement traction beyond
      prototype-stage defense tech.
    - >-
      Drone Factory 01 gives PDW a tangible domestic production asset and a clearer scaling story than many
      venture-backed drone peers.
    - >-
      The product stack spans aircraft, software, training, payload integration, and communications resilience,
      supporting a more durable platform thesis.
    - >-
      Series B backing from Ondas and other defense-adjacent investors improved governance, supply-chain credibility,
      and capital access.
  topRisks:
    - >-
      Public valuation evidence is limited to a single secondary estimate while revenue, backlog, gross margin, and
      preference terms remain undisclosed.
    - >-
      Conflicting cumulative-funding figures across company, SEC-adjacent, and market-data sources make dilution and
      downside seniority hard to underwrite.
    - >-
      Demand visibility is still concentrated in defense procurement events, which can re-time quickly with budget
      shifts, testing cycles, and program priorities.
    - >-
      Drone Factory 01 capacity claims are ambitious and still require proof on sustained throughput, yield, working
      capital, and supplier resilience.
    - >-
      An open NLRB case filed in November 2025 adds organizational, legal, and reputational risk during a rapid scaling
      period.
  unresolvedGaps:
    - Current revenue, backlog, gross margin, and burn-rate disclosure remain absent from public sources.
    - Headcount, organizational structure, and post-CEO-transition operating accountability are not publicly reconciled.
    - Official and third-party funding histories conflict, leaving cap-table and preference-stack analysis incomplete.
    - >-
      Customer concentration and repeat-order quality are not yet visible enough to separate program momentum from
      durable platform adoption.
    - >-
      Factory economics, supplier bottlenecks, and actual monthly output conversion have not been independently
      verified.
