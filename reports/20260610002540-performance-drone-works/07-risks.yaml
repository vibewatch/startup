- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Procurement eligibility
    - Blue UAS / FCC status change
    - Loss of exemption, lapsed listing, or unresolved remediation item
    - Pause underwriting until component-origin and authorization path are re-proven.
  - - Supply-chain integrity
    - Qualified alternate-vendor coverage
    - No second-source plan for mission-critical radio or payload elements by next diligence update
    - Haircut volume assumptions and require inventory / sourcing covenants.
  - - Manufacturing reliability
    - Fleet quality metrics
    - No credible MTBF, return-rate, or failure-reporting package despite scale claims
    - Treat scale story as unproven and move recommendation toward research-more.
  - - Program concentration
    - Backlog diversification
    - No meaningful non-Army or multi-program booked revenue visibility into 2027
    - Discount capacity narrative and assume lower utilization.
  - - Labor / governance discipline
    - Case and turnover trend
    - NLRB escalation, repeat employee claims, or further unplanned leadership churn
    - Escalate governance risk rating and require board-level remediation evidence.
  - - Public-market expansion
    - FAA and commercial compliance path
    - No waiver / approval plan for non-federal deployments despite public-safety positioning
    - Model public-safety as option value rather than near-term revenue.
  notes: Kill criteria focus on external signals investors can monitor between refreshes instead of internal aspirational milestones.
