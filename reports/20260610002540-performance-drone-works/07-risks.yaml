- id: mitigations-kill-criteria
  title: Mitigations, Monitoring Indicators, and Kill Criteria
  body: 'PDW does have real mitigants. The company is already inside the Blue UAS and NDAA-centered procurement ecosystem, has raised enough capital to build manufacturing and governance capacity, and has public evidence of operational testing rather than slideware alone. The board has become deeper, the factory is real, and the firm has won repeat Army work instead of a single pilot. Those facts argue against an immediate “avoid” view.


    The problem is that many of the hardest risks can only be monitored, not assumed away. The single best leading indicator is procurement eligibility. Investors should treat any loss of Blue-list momentum, any inability to document domestic content at the subsystem level, or any widening reliance on exemption windows as a thesis-break precursor. The second leading indicator is conversion quality: disclosed capacity should begin to show up as diversified awards, stable spec sheets, and evidence that quality and service processes are keeping pace with output claims. The third is organizational maturity. If the labor matter worsens, leadership churn continues, or customers begin reporting integration or support issues, PDW’s scale narrative weakens quickly.


    In practical diligence terms, the company remains financeable only if evidence supports three propositions over the next 6 to 12 months: first, PDW can remain procurement-eligible after current FCC and Blue UAS transition rules tighten; second, it can scale without hidden reliability or supplier bottlenecks; and third, it can broaden demand beyond a small cluster of urgent defense opportunities. If those propositions fail, the appropriate IC action is not incremental caution but a hard reset on underwriting assumptions.'
