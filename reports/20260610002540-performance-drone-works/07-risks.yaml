  evidenceGaps:
  - type: missing-source
    severity: material
    topic: export-classification
    missingEvidence: Current ECCN / licensing memos for C100, Blackwave, payloads, and related software by destination market.
    whyItMatters: Export-control scope affects allied growth, supplier choices, and the risk of sudden compliance bottlenecks.
    diligencePath: Request outside export-counsel classifications, licensing history, and any denied or conditioned export requests.
    relatedQuestionRefs:
    - QR006
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: post-2026-component-origin-proof
    missingEvidence: BOM-level country-of-origin and alternate-vendor evidence for mission-critical radios, sensors, controllers, and batteries, plus the company’s post-2026 FCC / Blue UAS continuity plan.
    whyItMatters: The FCC exemption window is temporary and procurement eligibility can fail at the critical-component level.
    diligencePath: Review sourcing files, supplier declarations, FCC certifications, and internal contingency planning for the January 2027 deadline.
    relatedQuestionRefs:
    - QR016
    - QR032
    relatedTableRefs:
    - TR001
    - TR003
  - type: private-evidence-only
    severity: material
    topic: backlog-and-demand-visibility
    missingEvidence: Booked backlog, option values, customer or branch concentration, and program funding visibility through March 2027 and beyond.
    whyItMatters: PDW’s scale case depends on converting factory capacity into diversified revenue rather than a narrow set of urgent defense awards.
    diligencePath: Request board materials or finance packs showing awarded backlog, pipeline by customer, and downside scenarios if Army demand slips.
    relatedQuestionRefs:
    - QR020
    relatedTableRefs:
    - TR003
    - TR005
  - type: missing-source
    severity: material
    topic: fleet-reliability
    missingEvidence: MTBF, field-loss, mission-abort, warranty-return, and repair-cycle data by configuration and theater.
    whyItMatters: Public demo evidence does not show whether DF01-scale output can sustain battlefield reliability and support economics.
    diligencePath: Request reliability dashboards, failure-mode-and-effects analysis, and cohort data from deployed fleets.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR002
  - type: conflicting-data
    severity: material
    topic: payload-spec
    missingEvidence: A current, configuration-specific payload-and-endurance spec sheet that reconciles 10 lb, 15 lb, and 15+ lb public figures.
    whyItMatters: Inconsistent payload marketing can distort mission utility assumptions, procurement comparables, and reliability expectations.
    diligencePath: Request controlled test data and the latest approved product specification by payload configuration.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR002
