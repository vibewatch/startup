company:
  name: Performance Drone Works
chapter:
  number: 7
  title: Risks
  summary: 'Performance Drone Works’ risk profile is dominated by procurement-eligibility dependence: Blue UAS, FCC component rules,

    and domestic-content proof now sit directly in the path between product performance and purchasability. Operationally, the

    company shows credible factory, testing, and contract momentum, but public evidence is still far stronger on demonstrations and

    capacity claims than on fleet reliability, supplier redundancy, and diversified backlog. The investment case holds only if PDW can

    preserve qualification continuity while scaling without quality, labor, or concentration shocks.'
sections:
- id: regulatory-legal-risk
  title: Regulatory, Legal, and Procurement-Eligibility Risks
  body: 'PDW’s most important risk is not whether the C100 is technically useful, but whether the company can stay inside the moving gates that make the product buyable by U.S. government users. The Army’s company-level directed requirement explicitly selected PDW only after the platform had been vetted for FY20 NDAA compliance and Blue UAS eligibility, and DIU’s own 2025 refresh materials framed the Blue list as a bridge while normal acquisition still lags battlefield need by years. That means a material share of PDW’s current momentum sits on qualification regimes that are still evolving rather than on permanently settled procurement rails.


    The FCC adds a second layer of fragility. Its 2026 Covered List regime now blocks new equipment authorization for foreign-produced UAS and critical components, while temporarily exempting Blue UAS-cleared and Buy American-compliant systems only until January 1, 2027. Because the FCC defines critical components broadly to include radios, controllers, sensors, batteries, and motors, PDW’s compliance exposure extends beyond the airframe to the full subsystem stack. If any key component origin, documentation, or list status slips, PDW could lose commercial and public-safety equipment-authorization headroom even if its defense sales continue.


    Legal risk is also no longer hypothetical. PDW has an open NLRB matter alleging coercive rules and changes in employment terms, which is not existential by itself but shows that the company has already entered the zone where internal-process disputes can become public litigation or regulatory records. Terms-and-warranty language further shows a company trying to contractually narrow liability and shift field-use risk outward. For investors, the core takeaway is that PDW’s regulatory moat is real but conditional: list status, domestic-content evidence, and labor-process discipline now matter almost as much as product performance.'
