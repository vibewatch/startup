  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: Audited revenue, recognized revenue by period, and any backlog-to-revenue bridge.
    whyItMatters: >-
      Without audited top-line disclosure, contract announcements cannot be translated into actual scale,
      growth, or revenue quality.
    diligencePath: >-
      Request audited trailing-12-month revenue, quarterly recognized revenue, and booked backlog with
      expected conversion timing.
    relatedQuestionRefs: [QI015]
    relatedTableRefs: [TI003, TI005]
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin-burn
    missingEvidence: Gross margin by hardware, software, and services plus current burn and cash runway.
    whyItMatters: >-
      The central financial question is whether PDW is scaling into attractive contribution economics
      or simply expanding a capital-intensive manufacturing and service operation.
    diligencePath: >-
      Request management P&L by product line, current cash balance, trailing monthly burn, and a
      base/downside runway model.
    relatedQuestionRefs: [QI016]
    relatedTableRefs: [TI003, TI005]
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-backlog
    missingEvidence: Top-customer concentration, funded backlog by program, receivable aging, and renewal exposure.
    whyItMatters: >-
      Defense suppliers can appear diversified in headlines while remaining concentrated in a handful
      of programs that determine cash conversion.
    diligencePath: >-
      Request top-10 customer revenue share, funded backlog by program, receivable aging, and any
      cancellation or deferral history.
    relatedQuestionRefs: [QI017]
    relatedTableRefs: [TI003, TI005]
  - type: private-evidence-only
    severity: material
    topic: debt-structure
    missingEvidence: Debt schedule, credit facilities, covenants, and any off-balance-sheet obligations.
    whyItMatters: >-
      Unseen leverage or supplier-finance obligations would materially alter the capital-adequacy view
      and could pressure cash generation during the production ramp.
    diligencePath: >-
      Request complete debt and covenant package, supplier-finance arrangements, and any guarantees or
      project-finance commitments.
    relatedQuestionRefs: [QI018]
    relatedTableRefs: [TI004, TI005]
  - type: conflicting-data
    severity: material
    topic: series-b-reconciliation
    missingEvidence: Management explanation reconciling the official over $110M round language with the SEC's $162.37M sold amendment.
    whyItMatters: >-
      Investors need a clean cap table and proceeds bridge before treating the disclosed financing as
      a reliable proxy for liquidity or valuation inflection.
    diligencePath: >-
      Request the post-money cap table, financing closing schedule, and explanation of what securities
      are included in the amended sold amount.
    relatedQuestionRefs: [QI004, QI025]
    relatedTableRefs: [TI004]
