  - FI004
- id: financial-verdict-and-diligence-blockers
  title: Financial verdict and diligence blockers
  body: >-
    PDW's public financial picture is compelling on momentum and weak on underwriteability. The
    positive evidence is meaningful: large disclosed financing, multiple named Army award events,
    a newly expanded production base, and a product stack broad enough to support payload, software,
    and training attach revenue. This is not a prototype-only company. The problem is that the same
    public record says very little about revenue quality. Audited revenue and ARR are undisclosed;
    gross margin, burn, backlog, customer concentration, and runway are undisclosed; and even the
    2026 round-size language is directionally positive but numerically messy because the official
    “over $110M” statement and the SEC's $162.37M sold figure are not explicitly reconciled.
    Independent analysis adds additional caution: capacity claims and implied revenue potential are
    still aspirational until output and backlog are verified, while concentration and appropriations
    timing remain real risks for a defense supplier. The practical conclusion is that PDW currently
    looks fundable as a defense-production ramp with demonstrated procurement relevance, but not yet
    bankable on the basis of disclosed cash economics. Any investment view should be conditioned on
    management producing audited revenue, gross margin, backlog, concentration, and runway data,
    plus a clean explanation of the 2026 financing mechanics.
  claimRefs:
  - CI006
  - CI019
  - CI026
  - CI027
  - CI028
  - CI031
  - CI032
  - CI033
  - CI034
  - CI035
