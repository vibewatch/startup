callouts:
- calloutType: strength
  title: Capital and procurement signals are both real
  body: >-
    PDW has more than one public proof point: substantial disclosed financing, multiple named Army
    award events, and a newly expanded production base. That is materially stronger than a defense
    startup that only has prototypes and pilots.
  claimRefs:
  - CI001
  - CI002
  - CI013
  - CI014
  - CI030
- calloutType: risk
  title: Round-size reconciliation is still messy
  body: >-
    Investors should not accept the official over $110M language at face value without reconciling
    it to the SEC amendment showing $162.37M sold. The round is clearly large, but the exact number
    still needs a cap-table bridge.
  claimRefs:
  - CI001
  - CI002
  - CI006
- calloutType: risk
  title: Capacity claims are not the same as output or margin
  body: >-
    PDW's factory and product breadth are promising, but independent analysis stresses that
    throughput, backlog, and concentration remain unverified. The business is easier to believe in
    than to underwrite from public evidence alone.
  claimRefs:
  - CI024
  - CI026
  - CI027
  - CI035
