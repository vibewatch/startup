  rows:
  - - Defense C100 mission bundles
    - Fixed-price government contracts for airframes, payloads, and support equipment
    - Multiple named Army/C100 award disclosures from 2024-2026
    - Medium-High; genuine procurement demand is visible
    - Hardware plus support and payload integration likely carry material COGS
    - Provide shipped units, realized ASP, and gross margin by program
  - - Multi-mission payloads and accessories
    - Attach revenue sold with C100 programs
    - 2025 Transformation in Contact award explicitly included Multi-Mission Payloads
    - Medium; expands contract value per deployment
    - Payload BOM and support complexity may compress margin
    - Disclose payload attach rate and payload gross margin
  - - Mission software (PDW CORE)
    - Software attach to planning and execution workflow
    - Official product page markets mapping, real-time data, and tactical overlays
    - Medium; software can improve account value but pricing is undisclosed
    - Software margins could be attractive if sold with limited services
    - Disclose whether CORE is bundled or separately priced
  - - Training and certification
    - Operator enablement and OEM trainer certification
    - Training page advertises prerequisite equipment training and a trainer course
    - Medium-Low; visible as service line but no pricing disclosure
    - Labor-intensive delivery could dilute blended margins
    - Disclose training attach rate, pricing, and utilization
  - - Attritable Multirotor strike systems
    - Additional platform revenue for strike missions
    - Production-ready status announced in March 2026
    - Medium; expands TAM but commercial ramp is early
    - Could require inventory, field support, and rapid iteration expense
    - Disclose booked orders, production rate, and product-level margin
  notes: >-
    Rows reflect publicly visible monetization mechanisms only. No reviewed source disclosed list
    pricing, revenue mix, or realized ASP by product line.
