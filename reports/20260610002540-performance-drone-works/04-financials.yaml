- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Public status
  - Why it matters
  - Closest proxy
  - Diligence path
  rows:
  - - Audited revenue / ARR
    - Not disclosed
    - Contract announcements cannot be translated into actual scale or growth without audited top-line data
    - Named awards and financing disclosures only
    - Request audited trailing-12-month revenue and a backlog conversion bridge
  - - Gross margin by product and blended
    - Not disclosed
    - Determines whether PDW is a high-value defense manufacturer or a low-margin integrator
    - Product mix suggests hardware, software, and services all contribute
    - Request BOM, direct labor, service delivery cost, and gross margin by line
  - - Cash balance, burn, and runway
    - Not disclosed
    - Investors cannot judge whether the latest round fully funds the scale-up
    - Large financing and factory expansion are visible, cash consumption is not
    - Request current cash, monthly burn, and base/downside runway model
  - - Funded backlog and customer concentration
    - Not disclosed
    - Defense suppliers can appear diversified in headlines while remaining concentrated in a few programs
    - Multiple award events are named but backlog and top-customer exposure are absent
    - Request backlog by program, top-customer revenue share, and receivable aging
  - - Unit pricing / realized ASP by bundle
    - Not disclosed
    - Bundle-level awards do not reveal economics of airframes, payloads, software, or support
    - Mar 2026 award provides bundle composition but not component economics
    - Request realized ASP and contribution margin by major bundle type
  - - Debt, credit facilities, or project finance
    - Not disclosed
    - Hidden leverage or restrictive covenants would change the capital-adequacy view
    - No reviewed source identified debt facilities
    - Request complete debt schedule, covenants, and off-balance-sheet obligations
  notes: >-
    Each row is an actual underwriting blocker rather than a cosmetic disclosure wish list.
