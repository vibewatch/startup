company:
  name: Performance Drone Works
chapter:
  number: 4
  title: Financials
  summary: >-
    PDW has credible public evidence of financing depth, manufacturing expansion, and Army procurement
    traction, but very little public disclosure on the underlying cash economics. The company looks
    financeable as a defense-production ramp and not yet fully underwriteable as a cash-generating
    business, because audited revenue, gross margin, backlog, concentration, burn, and runway remain
    undisclosed while even the 2026 round-size disclosures need reconciliation.
sections:
- id: revenue-model-and-monetization
  title: Revenue model and monetization
  body: >-
    PDW is not presenting itself as a pure-software company with seat pricing, transparent ARR, or
    a visible renewal model. The public footprint instead points to a bundled defense-program
    business in which airframes, payloads, mission software, and training are sold together through
    negotiated government procurement. The homepage and product stack show revenue exposure across
    core C100 drone platforms, mission-specific payloads, PDW CORE mission-planning software,
    training and certification, and the newer Attritable Multirotor strike system. That mix matters
    because public contract values should be read as integrated mission-system economics, not as a
    clean per-drone or per-seat price. The company also says it serves every branch of the U.S.
    military plus federal, local, and international public-safety entities, which suggests broader
    end-market reach than a single-program defense supplier. What is missing is equally important:
    no reviewed source disclosed public list pricing, realized ASPs, discounting, attach rates, or
    revenue mix by hardware versus software versus services. The evidence therefore supports a
    bundled-capability revenue model with multiple attach points, but not a high-confidence view of
    how much of each contract is recurring software, how much is hardware, and how much is labor or
    support.
  claimRefs:
  - CI010
  - CI011
  - CI016
  - CI017
  - CI018
  - CI025
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: traction-and-unit-economics-proxies
  title: Public traction and unit-economics proxies
  body: >-
    The public traction story is stronger than the public unit-economics story. Between late 2024
    and March 2026, open sources document multiple named Army or C100-related award events: PDW's
    own statement of more than $15.3 million in Army sales and contracts in December 2024, a
    September 2025 company announcement of a $20.9 million Transformation in Contact award, and a
    March 2026 Army contract reported at $15.26 million for mission bundles, sensors, and ground
    control stations. DVIDS and ExecutiveBiz add a shared 2024 Tranche 1 directed-requirement award
    valued at $14.417 million, but the public record does not disclose how much of that total value
    belonged to PDW. Those facts confirm real procurement traction and Blue UAS/NDAA contractability,
    but they still do not produce clean unit economics. Contract values are bundled, list pricing is
    absent, and the company offers hardware, software, payloads, and training together. Open sources
    also do not disclose audited revenue, ARR, backlog, customer concentration, gross margin, or
    cash conversion. Investors can therefore see demand signals and procurement relevance, yet still
    cannot determine whether those signals convert into attractive margins or durable free cash flow.
  claimRefs:
  - CI012
  - CI013
  - CI014
  - CI015
  - CI016
  - CI017
  - CI022
  - CI023
  - CI029
  - CI030
