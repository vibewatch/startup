evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding-date
    missingEvidence: >-
      Authoritative incorporation or formation records that establish whether PDW should be treated as a 2018 or 2019
      founding.
    whyItMatters: >-
      The founding date is a basic anchor fact reused across the whole report and currently conflicts across retained
      public sources.
    diligencePath: >-
      Request certificate of formation, original operating agreement, and earliest payroll or contract records from
      management.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: governance-gap
    missingEvidence: Current cap table, board-rights schedule, liquidation preferences, and founder or investor control mechanics.
    whyItMatters: Board names are public, but economic control and downside protections cannot be assessed from retained sources.
    diligencePath: Request the latest cap table, board consents, investor-rights agreement, and board-observer matrix.
    relatedQuestionRefs:
      - QO010
      - QO024
    relatedTableRefs:
      - TO003
      - TO002
  - type: private-evidence-only
    severity: material
    topic: disclosure-gap
    missingEvidence: Current revenue run-rate, booked backlog, customer count, and actual headcount.
    whyItMatters: >-
      Capital raised and factory capacity are visible, but investability depends on whether demand and staffing support
      those scale claims.
    diligencePath: >-
      Request monthly KPI packs, current employee census, bookings by program, and customer roster by agency or
      integrator.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: debt-and-credit
    missingEvidence: Any public or provided evidence of debt facilities, asset-backed lending, or other credit support.
    whyItMatters: Leverage and covenant risk can materially change the risk profile of a production-scaling hardware company.
    diligencePath: Ask management and counsel for debt schedules, lien searches, and any credit agreement summary.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: pdw-sam
    missingEvidence: >-
      A bottoms-up serviceable available market that isolates PDW’s small-UAS wedge by mission, geography, and buyer
      type.
    whyItMatters: >-
      Public market reports stop at broad defense or public safety categories, so valuation can be distorted if a global
      TAM is used as a proxy for PDW’s reachable market.
    diligencePath: >-
      Request PDW pipeline, program-level unit economics, and a bottoms-up model split by Army programs, allied defense
      buyers, and public safety agencies.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Current revenue split between defense, public safety, software, training, and payload attachments.
    whyItMatters: >-
      Without mix disclosure, it is impossible to know whether public safety is a real second engine or primarily a
      strategic adjacency.
    diligencePath: Request audited revenue mix, backlog mix, and customer concentration by end-market for the last twelve months.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: status-quo-substitutes
    missingEvidence: >-
      Independent win-loss evidence that quantifies how often PDW displaces incumbent domestic providers or
      non-compliant foreign alternatives.
    whyItMatters: >-
      Substitutes shape switching costs and pricing power, but public sources still describe categories better than
      actual displacement rates.
    diligencePath: >-
      Interview Army PM UAS, public safety customers, and channel partners on incumbent replacement patterns and
      lost-deal reasons.
    relatedQuestionRefs:
      - QM019
    relatedTableRefs:
      - TM001
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Customer-level pricing sheets, average selling price ranges by mission bundle, and discounting terms for PDW and
      named competitors.
    whyItMatters: >-
      Without realized pricing data, the pricing table can only describe contract structure and public procurement
      paths, not actual cost competitiveness or gross-margin durability.
    diligencePath: >-
      Request anonymized quotes, reseller schedules, and recent awarded statements of work from PDW, Skydio, BRINC, and
      Red Cat; reconcile against any public procurement portals.
    relatedQuestionRefs:
      - QP018
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: public-safety-adoption
    missingEvidence: >-
      A verifiable count of PDW’s live public-safety customers, departments, or cities using the C100 or AM-FPV in
      recurring operations.
    whyItMatters: >-
      PDW markets a public-safety motion, but without deployment counts it is hard to judge whether the segment is a
      real channel or mainly an adjacency narrative beside defense traction.
    diligencePath: >-
      Ask PDW for a customer list or deployment count, then cross-check named agencies through procurement records,
      press releases, or public meeting materials.
    relatedQuestionRefs:
      - QP023
  - type: private-evidence-only
    severity: blocking
    topic: competitive-win-rate
    missingEvidence: >-
      Win-loss data, renewal rates, churn drivers, and competitive displacement examples across defense and
      public-safety bids.
    whyItMatters: >-
      The chapter can identify credible rivals and capabilities, but it cannot underwrite moat durability without
      knowing whether PDW is actually winning, expanding, or getting displaced in live procurements.
    diligencePath: >-
      Review CRM export or board materials covering pipeline stage progression, renewal cohorts, named losses, and
      post-award expansion by account.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: Audited revenue, recognized revenue by period, and any backlog-to-revenue bridge.
    whyItMatters: >-
      Without audited top-line disclosure, contract announcements cannot be translated into actual scale, growth, or
      revenue quality.
    diligencePath: >-
      Request audited trailing-12-month revenue, quarterly recognized revenue, and booked backlog with expected
      conversion timing.
    relatedQuestionRefs:
      - QI015
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin-burn
