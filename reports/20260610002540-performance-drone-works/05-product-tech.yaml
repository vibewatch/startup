- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User Job
  - Current Workflow
  - Company Solution
  - Measurable Benefit
  - Limitation
  rows:
  - - Small-unit ISR / overwatch
    - Operator selects airframe, payload, and comms package before launch into a contested area
    - C100 with modular payload bay and CORE mission planning
    - 74-minute endurance claim and TAK-linked planning create a longer dwell / shared-picture workflow
    - Independent mission-effectiveness data is limited to company and partner narratives
  - - GPS-denied recon mission
    - Traditional small drones lose utility when GPS is jammed or spoofed
    - CORE 1.4 plus PDW Vision Payload provide VBN “cold start” and GPS-free autonomy
    - 11 autonomous GPS-denied flights reported in the March 2026 test campaign
    - No third-party validation of accuracy, drift, or repeatability
  - - JTAC / laser targeting support
    - Teams normally rely on manned aviation or separate designator systems
    - C100 integrates laser-designation and battle-damage-assessment workflows
    - Crimson Tomahawk and Iron Lance posts show JTAC support, lasing, and follow-on autonomy plans
    - Evidence is entirely company-issued and exercise-based
  - - Operator readiness / mission rehearsal
    - Live flight training is airspace-constrained and expensive
    - PDWSIM plus formal training classes move rehearsal onto a software surface
    - PDW claims 50% lower training time and 88% lower cost
    - No public independent benchmark of learning outcomes or conversion to live readiness
  - - Army ISR mission bundle procurement
    - Programs buy airframe, EO/IR, and controller as an integrated kit
    - C100X MRD mission bundle paired with Next Vision payloads and UXV SROC controller
    - Military+Aerospace shows the Army buying complete ISR stacks rather than a bare airframe
    - Public sources do not detail delivered operational results after award
  notes: Benefits mix official claims and independent contract coverage; none of the listed outcome claims
    should be treated as independently audited operational performance.
