- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / Component
  - Role
  - Dependency
  - Risk
  rows:
  - - C100 airframe + payload bus
    - Carries ISR, comms, logistics, or strike payloads on one modular platform
    - PDW airframe design plus payload vendors
    - Open architecture helps flexibility, but exact payload qualification matrix is not public
  - - PDW CORE / TAK workflow
    - Mission planning, operator UI, shared mission picture, hot-swap continuity on SROC
    - PDW software plus TAK/ATAK ecosystem
    - Closed documentation surface limits external diligence on interfaces and code quality
  - - Vision-Based Navigation stack
    - GPS-denied mission start and autonomous completion with PDW Vision Payload
    - CORE 1.4, PVP, onboard compute
    - Public evidence is test-campaign based; robustness under varied terrain and weather is not independently
      published
  - - Mesh radio / resilient comms layer
    - Encrypted telemetry, video, and command/control in contested environments
    - Doodle Labs radio partner and related comms hardware
    - Communications advantage depends partly on partner hardware rather than only PDW-owned IP
  - - SROC / ground-control layer
    - Flight control, payload control, and ISR exploitation node
    - UXV controller integration and operator peripherals
    - Ground-control reliability and interface maturity are not publicly benchmarked
  - - PDWSIM + training environment
    - Builds muscle memory and scenario rehearsal before live deployment
    - PDW instructors, simulator software, and mapping content
    - No public evidence on enterprise LMS integration or long-term retention metrics
  notes: Architecture is assembled from official product pages, partner case studies, and contract coverage;
    public evidence is specific enough to map dependencies but not deep enough to inspect interfaces.
