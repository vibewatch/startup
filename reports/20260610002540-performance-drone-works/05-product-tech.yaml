callouts:
- calloutType: strength
  title: PDW Sells a Workflow, Not Just a Drone
  body: The clearest strength in this chapter is integration breadth. PDW owns the airframe story, the
    mission-planning surface, the simulator, the training loop, and the manufacturing narrative. That
    lowers adoption friction for buyers who want a working tactical stack rather than a parts-integration
    project.
  claimRefs:
  - CE001
  - CE011
  - CE020
  - CE023
  - CE025
- calloutType: risk
  title: Factory Scale Is Better Documented Than Factory Throughput
  body: PDW has convincing public evidence for factory footprint and ambitious capacity claims, but still
    lacks public delivery, yield, or output data that would prove those lines are producing at the rates
    implied by the marketing narrative. That is the main product-tech diligence gap.
  claimRefs:
  - CE025
  - CE026
  - CE032
  - CE039
- calloutType: insight
  title: Developer Signal Comes From Hiring, Releases, and Training—Not Open Tooling
  body: This is not an open-source or API-led platform. The visible developer signal comes from who PDW
    is hiring, how often it ships software releases, and how much operator training it wraps around CORE
    and PDWSIM. That is consistent with a defense workflow product, but it reduces outside inspectability.
  claimRefs:
  - CE014
  - CE017
  - CE023
  - CE024
  - CE038
