- id: deployment-scale-roadmap
  title: Deployment Maturity, Manufacturing Readiness, and Roadmap
  body: 'PDW’s maturity argument rests on field use plus factory capacity. On field evidence, the company
    has multiple public proof points: Army Transformation in Contact support, the March 2026 9-Mile validation
    campaign, Crimson Tomahawk JTAC demonstrations, and January 2026 laser-designation trials. These are
    all company-issued sources, so they establish what PDW is willing to stand behind publicly, but not
    the same thing as independent mission-effectiveness validation. On production, the evidence is stronger
    on physical footprint than on output. Drone Factory 01 and the August 2025 launch post consistently
    describe a 90,000-square-foot Huntsville facility with co-located engineering and production teams;
    official surfaces also repeat peak monthly capacity of 350 C100s and 5,000 AM-FPVs, while Ondas stretches
    the narrative to 100,000 units annually. That supports the claim that PDW is building for industrial
    scale, yet robotics.press correctly flags throughput as the unresolved variable because public shipment
    or acceptance numbers still do not exist. The 2025–2026 roadmap is active rather than conceptual:
    PDW SIM launched in March 2025, the Blue UAS milestone dates back to December 2023, CORE 1.4 shipped
    in March 2026, the attritable multirotor entered production in March 2026, and the Vanteon transaction
    in June 2026 points to deeper RF and communications ambitions. The roadmap is therefore credible on
    cadence, but still light on independently measured outcomes.'
  claimRefs:
  - CE015
  - CE016
  - CE025
  - CE026
  - CE027
  - CE028
  - CE029
  - CE030
  - CE031
  - CE032
  - CE039
