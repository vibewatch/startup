- id: architecture-and-modularity
  title: Architecture, Software Stack, and Technical Differentiation
  body: 'The public record supports a specific architecture story. The C100 is presented as a modular
    airframe with hot-swappable payload capacity, while CORE acts as the operator-facing mission planner
    and TAK-linked control layer. The Multi-Mission Payload suite adds a clearer technical breakdown than
    the homepage does: PDW is pushing spectrum awareness, resilient comms relay, and vision-based navigation
    as plug-in capabilities that travel with the platform. CORE 1.4 matters because it is the clearest
    current software signal in the public domain. The release notes describe GPS-denied “cold start” navigation,
    Doodle Labs Sense support, hot-swappable battery continuity on SROC, and a richer simulation environment,
    suggesting PDW is deliberately integrating communications resiliency, autonomy, and training into
    one control stack. Justia’s patent surface reinforces that the company is not only packaging third-party
    parts; it has filed around adaptive control, signal-intelligence payloads, and plug-and-play aircraft
    interfaces. Still, the stack is not fully proprietary end to end. Doodle Labs and UXV case studies
    show meaningful dependence on partner radios and controllers, and no public API, SDK, or code repository
    surfaced in this run. So the differentiation appears to be system integration, operator workflow,
    and modular packaging, not an open software ecosystem or publicly inspectable developer platform.'
  claimRefs:
  - CE006
  - CE009
  - CE010
  - CE011
  - CE012
  - CE013
