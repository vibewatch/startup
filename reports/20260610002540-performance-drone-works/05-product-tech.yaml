    - Fielded; Blue UAS-cleared; current product page live
    - 74-minute endurance claim, modular payloads, low-signature airframe, TAK-linked workflow
    - Independent sortie-rate, failure-rate, and sustainment data not public
  - - C100 Public Safety
    - Law enforcement / first responder
    - Current product page live; positioned for first-response deployment
    - Dispatch-to-deploy under 3 minutes, 10 lb payload flexibility, MIL-STD positioning
    - Named production public-safety fleet counts and utilization metrics not public
  - - PDW CORE
    - Operators using SROC / QGC / TAK workflows
    - Current mission-planning software; CORE 1.4 released Mar 2026
    - TAK CoT sharing, hot-swappable battery continuity, native training environment
    - No public API, SDK, or external integration docs surfaced
  - - PDW SIM
    - Operators and instructors
    - Launched Mar 2025; current product page and training references live
    - Identical C100 physics, 3D mission rehearsal, 50% training-time reduction claim
    - No third-party validation of claimed training savings
  - - Multi-Mission Payload suite
    - Defense operators in GPS/EW-contested missions
    - Current product page live; enabled by CORE 1.4
    - Spectrum awareness, MANET relay, and vision-based navigation on one airframe
    - No public payload-level spec sheets or interoperability matrix
  - - Attritable Multirotor (AM-FPV)
    - Strike / forward-deployed military teams
    - Entered production Mar 2026
