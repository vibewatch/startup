  evidenceGaps:
  - type: missing-source
    severity: material
    topic: throughput-risk
    missingEvidence: Quarterly delivery counts, shipped unit totals, or customer-accepted output data
      from Drone Factory 01.
    whyItMatters: Factory capacity is central to the product-tech thesis, but public sources still show
      claimed capacity rather than verified throughput.
    diligencePath: Request monthly production, yield, and delivery metrics by program plus any customer
      acceptance data.
    relatedQuestionRefs:
    - QE024
  - type: private-evidence-only
    severity: material
    topic: developer-surface-gap
    missingEvidence: Public API, SDK, integration docs, or partner-developer documentation for CORE, PDWSIM,
      and payload/control interfaces.
    whyItMatters: Without an inspectable technical surface, diligence on extensibility and software quality
      relies on marketing and partner anecdotes.
    diligencePath: Ask for API docs, integration architecture, sample message formats, and a product demo
      showing TAK, SROC, and payload interfaces.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: reliability-gap
    missingEvidence: Published uptime SLAs, MTBF, maintenance burden, and field failure rates for C100,
      CORE, or PDWSIM.
    whyItMatters: Field reliability is essential for defense and public-safety adoption, but public evidence
      focuses on capabilities rather than sustained operating performance.
    diligencePath: Request service-level commitments, maintenance logs, replacement-part rates, and fleet-readiness
      metrics by customer cohort.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: cyber-assurance-gap
    missingEvidence: Independent cybersecurity or quality audits such as CMMC, SOC 2, ISO 27001, or a
      public package behind Blue UAS and privacy claims.
    whyItMatters: Public trust controls currently rest on Blue UAS inclusion, privacy terms, and warranty
      language; deeper assurance evidence is not public.
    diligencePath: Request third-party audit reports, internal quality certifications, and any government
      security assessment artifacts available for diligence.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE004
