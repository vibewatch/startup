- id: scenario-framework-and-kill-triggers
  title: Scenario Framework and Kill Triggers
  body: >-
    Because PDW has not published current revenue, the scenario framework has to be milestone-based rather than spreadsheet-precise. The bull case assumes the company converts current validation into repeatable procurement: Drone Factory 01 ramps as advertised, the Army and Air Force awards expand into broader programs of record, and the Vanteon integration meaningfully strengthens communications resilience. Under that path, a valuation north of $900 million can be justified, but only if management later shows revenue, backlog, and margin profiles that look closer to premium public comps than to opaque venture marks.


    The base case is more conservative and, on current evidence, more believable. It assumes the observed secondary indication is directionally correct, that PDW continues winning defense work, but that scaling manufacturing, integrating acquisitions, and converting tests into recurring orders takes time. That framework supports a current underwriting range of roughly $550-750 million, which is close enough to the secondary mark to justify tracking the name but not close enough to justify paying through it without private disclosure.


    The bear case matters because the downside is easy to sketch. An open NLRB matter, one-bid contract concentration, and the possibility of budget timing or multiple compression can all push private valuations lower quickly. If labor friction persists, budgets slip, or listed drone comps re-rate toward lower multiples, a $250-400 million outcome becomes plausible. That is why kill triggers must focus on disclosure failure, order conversion, and organizational execution—not just on headline funding.
  claimRefs:
