company:
  name: Performance Drone Works
chapter:
  number: 8
  title: Valuation
  summary: >-
    Performance Drone Works has real product-market pull in defense drones: a March 2026 Series B, repeated Army and Air Force awards, Blue UAS status, and a 90,000-square-foot factory with meaningful published capacity all support a credible scale thesis. The problem is price discovery, not capability discovery: PDW has not publicly disclosed current revenue, backlog, margin, or post-money terms, and the only observable valuation signal is a lower-confidence $730 million secondary mark from Premier Alternatives while public drone comparables span roughly low-single-digit to mid-30x revenue multiples. The evidence therefore supports a research-more stance with medium confidence and high risk; valuation should be treated as unknown-to-stretched above the observed secondary mark until management provides financial disclosure and reconciles cumulative funding data.
sections:
- id: recommendation-and-price-discipline
  title: Recommendation and Price Discipline
  body: >-
    PDW deserves credit for capability momentum. Publicly available evidence shows a company that has moved beyond concept-stage storytelling: the C100 is Blue UAS-approved, the platform has logged a new Air Force win on top of Army demand, and PDW has opened Drone Factory 01 with stated monthly output of 350 C100s and 5,000 AM-FPVs. The board has also been strengthened with senior finance and enterprise-software operators, while the Vanteon acquisition points to deeper in-house RF and communications capability. Taken together, those facts support a genuine upside thesis that PDW can become a scaled U.S. tactical-drone supplier rather than a one-program niche contractor.


    The valuation problem is that capability proof is materially ahead of financial disclosure. PDW’s own March 2026 announcement disclosed that the Series B brought total funded capital to over $110 million, but it did not disclose a post-money valuation or current revenue. The only public mark we found is Premier Alternatives’ March 26, 2026 estimate of $730 million, and even that source conflicts with PDW’s official cumulative-funding figure. Without verified revenue, gross margin, order backlog, or liquidation-preference detail, the right investment conclusion is research-more, not buy. A disciplined investor can watch PDW closely, but should avoid underwriting a premium valuation above the observed secondary mark until management closes the disclosure gap.
