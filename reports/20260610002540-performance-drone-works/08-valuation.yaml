- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Argument
  - Direction
  - What would change the view
  rows:
  - - Blue UAS approval, Army wins, Air Force expansion, and published factory capacity show real program traction.
    - Thesis
    - Independent disclosure of repeat-order backlog and customer concentration would strengthen this from medium to high conviction.
  - - Board additions and the Vanteon deal show management is scaling governance and RF capability, not just marketing the story.
    - Thesis
    - Proof that these moves improve conversion, margins, or program capture would justify higher underwriting confidence.
  - - Defense and public-safety drone markets are growing, with North America already the largest defense-drone region.
    - Thesis
    - Stronger evidence of PDW share gains or buyer diversification would make market growth more actionable.
  - - No primary source discloses post-money valuation, current revenue, or margin profile for PDW.
    - Anti-thesis
    - A management KPI deck or audited statements would materially reduce valuation uncertainty.
  - - Official and secondary sources disagree on cumulative funding, making dilution and preference analysis unreliable.
    - Anti-thesis
    - A reconciled cap-table history would remove a key blocker to pricing the round.
  - - An open NLRB case and one-bid Army order show that organizational and concentration risks remain real even alongside product traction.
    - Anti-thesis
    - Resolution of the labor matter and broader multi-bid / multi-buyer procurement evidence would lower downside risk.
  notes: >-
    The anti-thesis is driven less by disbelief in the product and more by disbelief that public evidence is currently sufficient to price the product company with precision.
