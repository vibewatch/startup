- id: TV005
  title: Thesis-Break and Kill Triggers Table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Disclosure failure persists
    - Management still cannot produce current revenue, backlog, and margin data in diligence
    - Prevents any defensible premium to the secondary mark and keeps valuation opaque
    - Do not price or lead a round
  - - Factory utilization disappoints
    - New facility does not translate into broader repeat orders within the next budgeting cycle
    - Breaks the core scale narrative that justifies premium optionality
    - Cut bull-case assumptions and move to bear-case range
  - - Labor / governance issues widen
    - NLRB case worsens or additional people-process disputes emerge
    - Raises execution risk exactly when the company is trying to scale manufacturing and absorb an acquisition
    - Require governance remediation before underwriting
  - - Budget timing slips
    - Army / Air Force procurement cadence slows or programs fail to expand beyond current initial awards
    - Undermines demand conversion and exposes the company to fixed-cost absorption risk
    - Re-rate toward the lower end of the base or bear range
  - - Public comp multiples compress
    - Drone / defense peers move toward low-single-digit revenue multiples
    - Tightens any private-market premium that PDW could claim without audited financial strength
    - Re-underwrite private value using downside comparable set
  notes: >-
    These triggers are designed to be monitorable using diligence outputs and public signals; they focus on whether PDW converts capability proof into durable commercial proof.
