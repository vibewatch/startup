- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current financials
    - Revenue, gross margin, EBITDA burn, backlog, and cash runway
    - These determine whether PDW is a premium growth asset or a capital-intensive manufacturer still in proof mode
    - Request management KPI deck or audited statements from CFO
  - - Round terms and cap table
    - Post-money valuation, share price, instrument type, liquidation preferences, and historical reconciliation of total capital raised
    - Without terms, investors cannot assess dilution, downside seniority, or whether the secondary mark is conservative or aggressive
    - Request financing documents from company counsel
  - - Order quality
    - Program-by-program backlog, renewal cadence, and evidence that initial awards convert into broader procurement
    - Valuation depends on repeatability, not on isolated contract headlines
    - Request bookings and backlog bridge from operations and finance
  - - Customer concentration
    - Exposure by branch, program office, and any single customer or contract line
    - One-bid or narrow buyer concentration amplifies execution and budget risk
    - Ask for concentration heat map and contract aging analysis
  - - People and process risk
    - Status and likely resolution path for the open NLRB case plus any related policy remediation
    - Scaling a factory and integrating Vanteon requires stable operations and workforce processes
    - Obtain labor counsel memo and HR remediation plan
  - - Exit preparation
    - Evidence of banker dialogue, strategic inbound interest, or board-approved financing / exit workstreams
    - Board additions and acquisitions hint at maturity, but there is no public proof of true exit readiness yet
    - Ask CEO and board observers for current process map and advisor roster
  notes: >-
    Items one and two are hard blockers for price setting; the remaining asks determine whether PDW deserves a premium private multiple or only a watch-list position.
