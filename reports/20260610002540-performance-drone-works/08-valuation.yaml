  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: primary-valuation-disclosure
    missingEvidence: Primary-source post-money valuation, share price, and round structure for the March 2026 financing.
    whyItMatters: Without round price and security terms, the chapter cannot determine whether the observed secondary mark is above or below the actual primary valuation or what preference seniority a new investor would face.
    diligencePath: Request executed financing documents or management-confirmed term sheet with post-money valuation, instrument type, and liquidation-preference stack.
    relatedQuestionRefs:
    - QV002
    - QV004
  - type: private-evidence-only
    severity: blocking
    topic: current-financials
    missingEvidence: Current revenue, gross margin, EBITDA burn, backlog, and cash runway as of 2026.
    whyItMatters: Public evidence shows demand and product proof but does not reveal whether PDW deserves premium private-market pricing or still requires heavy capital to fill its factory.
    diligencePath: Obtain management KPI deck or audited financial statements covering revenue quality, margins, backlog, and cash consumption.
    relatedQuestionRefs:
    - QV028
  - type: conflicting-data
    severity: material
    topic: capital-raised-conflict
    missingEvidence: Reconciled cumulative funding history and cap-table chronology.
    whyItMatters: Official PDW financing disclosure and secondary-market databases do not agree on total capital raised, which undermines confidence in dilution and preference-overhang analysis.
    diligencePath: Request cap-table summary from finance counsel and reconcile every historical financing round against secondary databases.
    relatedQuestionRefs:
    - QV004
  - type: private-evidence-only
    severity: material
    topic: exit-readiness
    missingEvidence: Evidence of banker engagement, board-approved exit planning, or strategic-buyer dialogue.
    whyItMatters: Board additions and acquisitions signal maturation, but there is not yet enough public evidence to underwrite IPO readiness or near-term strategic sale probability.
    diligencePath: Ask management whether it has formal financing or exit process workstreams, named advisors, or strategic partnership discussions beyond the Vanteon deal.
    relatedQuestionRefs:
    - QV029
    - QV030
  - type: enumeration-incomplete
    severity: material
    topic: comparable-set-completeness
    missingEvidence: Private-round and M&A comparables with disclosed revenue, valuation, and terms for directly comparable U.S. defense-drone companies.
    whyItMatters: The public comp set is informative but noisy, and private defense-drone transactions remain under-disclosed, limiting confidence in any precise valuation multiple.
    diligencePath: Expand diligence to private-market databases, banker comps, and management-provided transaction references covering U.S. defense-drone rounds and strategic deals.
    relatedQuestionRefs:
    - QV013
    - QV023
    - QV024
    - QV025
    relatedTableRefs:
    - TV004
