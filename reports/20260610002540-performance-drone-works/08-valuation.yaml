  - - Confidence
    - medium
    - Evidence on capability and demand is strong, but valuation relies on one secondary estimate and conflicting funding figures.
  - - Risk rating
    - high
    - Execution, labor/legal, and procurement-timing risks can all move a private mark quickly when financial disclosure is thin.
  - - Valuation stance
    - unknown-to-stretched above $730M
    - The observed secondary mark is the only public price signal; paying materially above it is not supportable from public evidence today.
  - - Decision implication
    - Track closely; price only after diligence
    - Upgrade requires current KPIs and cap-table detail; downgrade occurs if contract conversion or organizational execution deteriorates.
  notes: >-
    Observed valuation evidence is limited to one March 2026 secondary-market indication from Premier Alternatives, so the recommendation is intentionally price-sensitive and evidence-sensitive rather than a blanket company-quality score.
