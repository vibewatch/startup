- id: TV004
  title: Comparable Valuation Table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - PDW (secondary indication)
    - March 2026 Premier Alternatives mark
    - $730M valuation; $235.8M total funding claimed
    - Only public PDW-specific price signal located in this chapter
    - Secondary source, not a disclosed primary round price, and it conflicts with company-stated cumulative funding
  - - AeroVironment (AVAV)
    - $1.61B TTM revenue; $9.13B EV
    - ~5.7x EV/revenue; public, profitable scale and backlog visibility
    - Best anchor for scaled U.S. defense-drone manufacturing and program discipline
    - Much larger, diversified, and more transparent than PDW
  - - Red Cat (RCAT)
    - $54.57M TTM revenue; $1.61B EV
    - ~29.5x EV/revenue; public tactical-drone comp with 2026 10-K
    - Closer in size to a growth-stage drone specialist and useful for premium-multiple ceiling checks
    - Highly volatile and influenced by public-market sentiment
  - - Ondas (ONDS)
    - $96.60M TTM revenue; $3.32B EV
    - ~34.4x EV/revenue; public defense-communications / drone adjacency
    - Useful evidence that defense-drone-adjacent names can still command frothy valuations
    - Business mix is broader than PDW and still highly speculative
  - - EHang (EH)
    - 417.55M CNY TTM revenue; $506.65M market cap
    - Low implied revenue multiple; market cap down 59.38% YoY
    - Good downside reference showing how drone valuations can compress sharply
    - Commercial eVTOL exposure is structurally different from PDW’s U.S. defense focus
