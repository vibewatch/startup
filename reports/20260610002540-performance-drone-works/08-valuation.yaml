    coverage: partial
    basis: Public comps with currently accessible revenue and market-value data plus the lone PDW-specific secondary mark; excludes undisclosed private drone rounds and private M&A transactions with no public valuation detail.
  notes: >-
    Comparable evidence is intentionally partial because the most relevant private defense-drone transactions remain under-disclosed; public comps are therefore used as range-setters, not as single-point pricing formulas.
