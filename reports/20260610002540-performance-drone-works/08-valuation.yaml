- id: TV003
  title: Bull / Base / Bear Scenario Table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Factory capacity converts into repeatable Army/Air Force orders; Vanteon integration improves RF edge; financial disclosure later resembles premium public comps.
    - $900M-$1.2B range; requires premium multiple support and verified revenue/backlog to justify paying above the current secondary mark.
    - Execution ramp, working capital, and procurement timing still matter.
    - Possible, but contingent on data that is not public today.
  - - Base
    - PDW keeps winning defense work, but disclosure remains limited and public comp dispersion stays wide.
    - $550M-$750M range; anchored on the observed $730M secondary mark and a discount for opaque revenue, margin, and preference terms.
    - Cap-table opacity and limited KPI disclosure cap conviction.
    - Most supportable current case from public evidence.
  - - Bear
    - Labor friction, budget timing, or order conversion shortfalls expose the company to multiple compression before factory utilization is proven.
    - $250M-$400M range; assumes valuation migrates toward lower public-comp outcomes and that hidden seniority or burn weakens common-equity returns.
    - Down-round risk, organization strain, and procurement concentration.
    - Material tail risk because public evidence still lacks financial quality-of-revenue proof.
  notes: >-
    Scenario ranges are analytical estimates rather than observed transaction prices; they are anchored on the March 2026 secondary indication, public-comp dispersion, and milestone-based assumptions rather than on disclosed PDW revenue.
