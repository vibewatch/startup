- id: exit-readiness-and-final-diligence-asks
  title: Exit Readiness and Final Diligence Asks
  body: >-
    There are early signs that PDW wants to become exit-ready: the board has been upgraded, the company is acquiring enabling RF talent, and it is increasingly presenting itself as a vertically integrated American industrial platform rather than a single-drone startup. Those are useful signals for a future strategic sale, and they also improve the credibility of later-stage private financing. But they are still signals, not proof. No public source shows banker engagement, a formal IPO preparation process, revenue durability, or the kind of audited metrics that public-market investors would require. Even for a strategic sale, the most relevant buyers would care about the same missing information: revenue concentration, margin profile, working-capital requirements, backlog quality, and the actual economics of the new factory footprint.


    That means final diligence asks are straightforward and non-negotiable. First, management has to disclose the current financial picture: revenue, gross margin, EBITDA burn, backlog, and cash runway. Second, the company needs to reconcile funding history and preference stack so investors understand dilution and downside seniority. Third, the investment case needs customer and contract detail showing how much current demand is repeatable rather than opportunistic. Fourth, the open NLRB matter and broader people-process risk need to be addressed directly. Until those asks are answered, PDW remains an attractive company to follow but not a price that can be underwritten confidently from public evidence alone.
