- id: market-sizing
  title: Sizing Lenses, Demand Signals, and What the Public Numbers Really Mean
  body: >-
    The public sizing evidence supports a large and expanding category, but it does not support a single clean TAM for PDW without adjustment. The Business Research Company and Research and Markets both describe a defense-drone market around $13.73 billion in 2026, while Fortune Business Insights sizes the broader military-drone market at $20.80 billion in 2026 and a $6.51 billion U.S. market. Those estimates are directionally supportive but not interchangeable. The narrower studies appear closer to “defense drones” as purchased systems and components, while the broader Fortune framing spans more of the military UAV universe. For diligence purposes, that spread is a warning label: market size depends heavily on what is included.


    The sharper demand signal for PDW is not the global TAM headline but the public procurement path already visible in U.S. programs. CRS says the Army wants 107 company-level systems in FY2026 and is requesting about $803.9 million across the small-UAS portfolio. Congress also appropriated $1.4 billion to expand the small-UAS industrial base. Drone Dominance adds a second official signal: a two-year, $1 billion purchase program targeting more than 200,000 lethal drones by 2027. Put differently, the market is being pulled not only by abstract analyst forecasts but by budgeted U.S. government demand and explicit industrial-policy support. The public-safety adjacency is smaller but still meaningful: MarketsandMarkets puts that market at $1.1 billion in 2023 growing to $2.0 billion by 2028, which is enough to matter as a second go-to-market lane without changing the conclusion that defense is the core market today.
