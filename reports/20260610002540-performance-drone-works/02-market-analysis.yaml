  - type: private-evidence-only
    severity: material
    topic: pdw-sam
    missingEvidence: A bottoms-up serviceable available market that isolates PDW’s small-UAS wedge by mission, geography, and buyer type.
    whyItMatters: Public market reports stop at broad defense or public safety categories, so valuation can be distorted if a global TAM is used as a proxy for PDW’s reachable market.
    diligencePath: Request PDW pipeline, program-level unit economics, and a bottoms-up model split by Army programs, allied defense buyers, and public safety agencies.
