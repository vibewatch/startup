              that PDW was shifting from product promise toward production economics. The main adverse development
              visible in public records is not product failure but labor risk: the National Labor Relations Board shows
              an open case filed on November 20, 2025 alleging changes in terms and conditions of employment and
              coercive rules. That does not prove a final violation, but it is a real legal and reputational issue that
              should be carried forward into later diligence. By spring 2026, the milestone sequence culminated in the
              Series B financing and the addition of Greenberg and Welch to the board, suggesting PDW is moving from
              founder-heavy startup governance toward a more institutional defense-manufacturing profile while still
              carrying unresolved labor, disclosure, and concentration risks.
