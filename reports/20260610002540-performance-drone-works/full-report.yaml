  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: PDW competes across tactical defense, public safety response, and substitute drone stacks'
        blocks:
          - type: paragraph
            body: >-
              Performance Drone Works does not sit in a neat one-product peer set. The company sells a heavier-lift Blue
              UAS quadcopter, a strike-adjacent attritable multirotor, mission-planning software, training, and a
              public-safety package derived from defense hardware. That means the relevant rival map spans several
              categories at once. Skydio and Red Cat are the closest U.S.-made tactical ISR rivals because they pair
              portable airframes with night-capable sensors and federal-trust credentials. BRINC is the most direct
              public-safety workflow threat because it pushes emergency-response drones into 911 and CAD systems rather
              than treating drones as stand-alone pilot programs. Anduril and Shield AI sit one layer above PDW: they
              are not simple C100 replacements, but they compete for the same future budgets when customers want a
              broader autonomy stack, Army program-office access, or maritime and expeditionary capabilities.
              AeroVironment matters as an incumbent prime with revenue scale that PDW cannot match. Finally, Chinese
              fleets such as DJI remain a status-quo substitute in non-federal or purely local work, which means PDW’s
              Blue UAS moat is real in federal channels but incomplete elsewhere. The right underwriting frame is
              therefore not “Who builds a similar drone?” but “Which vendor can solve the same operational job with a
              stronger procurement path, workflow wedge, or capital base?”
