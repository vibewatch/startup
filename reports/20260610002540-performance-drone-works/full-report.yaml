      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-More Until Price Discovery Improves
            body: >-
              PDW looks increasingly real as a defense-drone platform, but investors still cannot see the numbers needed
              to price it. The combination of strong capability evidence and weak financial disclosure is exactly the
              setup where disciplined investors should track the company aggressively while refusing to underwrite a
              premium valuation above the lone observed secondary mark.
            calloutType: recommendation
            claimRefs:
              - CV021
              - CV045
              - CV050
          - type: callout
            title: Opacity, Not Product Quality, Is the Main Valuation Risk
            body: >-
              The hardest problem in this chapter is not whether PDW can build or sell tactical drones. It is that the
              public record does not reconcile total capital raised, does not disclose revenue or margin, and includes
              an open NLRB case while the company is trying to scale manufacturing and integrate an acquisition.
            calloutType: risk
            claimRefs:
              - CV023
              - CV024
              - CV046
          - type: callout
            title: Public Comps Set a Range, Not a Formula
            body: >-
              AeroVironment, Red Cat, Ondas, and EHang show that drone valuations can range from low-single-digit
              revenue multiples to frothy 30x-plus outcomes. That spread is too wide to justify a single shortcut
              multiple for PDW, so the only defensible answer today is a cautious range around the observed secondary
              mark and a demand for private disclosure before pricing.
            calloutType: insight
            claimRefs:
              - CV043
              - CV044
              - CV047
