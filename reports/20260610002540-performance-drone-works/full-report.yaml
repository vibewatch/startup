companyProfile:
  summary: >-
    Performance Drone Works is a private Huntsville, Alabama defense-drone manufacturer building an integrated tactical
    robotics stack for defense, government, and public-safety buyers. Public evidence supports a product family centered
    on the C100 quadcopter, the Attritable Multirotor strike platform, CORE mission-control software, SIM training
    software, and Drone Factory 01 manufacturing capacity. The company has translated that stack into visible
    procurement traction, including multiple Army Transformation in Contact awards, an initial U.S. Air Force contract,
    and company claims of support across every branch of the U.S. military. Governance has matured since 2024 with a CEO
    transition to James Slider, addition of outside directors, and a March 2026 Series B led by Ondas. The main
    unresolved diligence issues are valuation opacity, conflicting cumulative-funding figures, absent public revenue
    disclosure, and an open NLRB matter filed in late 2025.
