  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: >-
      How PDW moves a defense or public-safety prospect from mission need to training, fielding, and potential payload
      expansion.
    data:
      items:
        - label: Mission Need
          value: Defense or public-safety operator identifies ISR, EW, strike-support, or rapid-response gap
          note: Discovery is mission-led rather than consumer-led; procurement starts from an operational problem.
        - label: Technical Evaluation
          value: Buyer reviews Blue UAS status, payload fit, control stack, and partner integrations
          note: Security and interoperability markers are critical proof points for government customers.
        - label: Award / Demo
          value: Program office or end user issues a contract, funded demonstration, or exercise invitation
          note: Army, Air Force, UK MOD, and allied demo evidence all sit at this stage.
        - label: Training & Integration
          value: PDW instructors train operators and integrate payloads, controllers, radios, and software
          note: NTC support and formal training courses suggest implementation support is part of the relationship.
        - label: Fielding / Exercise Use
          value: Systems are deployed in formations, exercises, or funded demonstrations
          note: This is where proof quality diverges between Army fielding, Air Force contract, and allied demos.
        - label: Expansion
          value: Customer adds payloads, theaters, formations, or repeat awards
          note: Payload suite launches and repeat Army awards are the clearest public expansion signals.
    approximationNotes: null
    claimRefs:
      - CU004
      - CU009
      - CU018
      - CU022
      - CU024
      - CU035
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: standard
    summary: >-
      Publicly visible customer-conversion path from marketed end markets to fielded programs and repeat expansion
      loops.
    data:
      nodes:
        - id: segments
          label: Marketed Segments
          detail: Defense and public safety are both marketed, but proof quality differs sharply.
          type: input
        - id: gates
          label: Procurement Gates
          detail: Blue UAS status, payload modularity, partner interoperability, and training readiness.
          type: process
        - id: awards
          label: Contracts / Demos
          detail: Army TiC awards, Air Force contract, UK MOD demonstration, allied showcase events.
          type: process
        - id: fielding
          label: Fielding / Exercise Use
          detail: Army formations, NTC support, Crimson Tomahawk JTAC use, partner-enabled deployments.
          type: process
        - id: support
          label: Enablement Loop
          detail: Formal training, troubleshooting, payload updates, and partner integration.
          type: process
        - id: expansion
          label: Repeat Program Growth
          detail: Follow-on awards, new payload adoption, and additional formations or buyers.
          type: output
      edges:
        - from: segments
          to: gates
          label: Targeted by PDW surfaces
        - from: gates
          to: awards
          label: Security and fit qualify buyer
        - from: awards
          to: fielding
          label: Contract or demo becomes operational use
        - from: fielding
          to: support
          label: Operators train and iterate
        - from: support
          to: expansion
          label: Programs deepen if performance holds
    approximationNotes: >-
      The flow is a public-evidence synthesis, not a disclosed internal sales process. It maps how visible proof points
      connect rather than quoting conversion rates.
