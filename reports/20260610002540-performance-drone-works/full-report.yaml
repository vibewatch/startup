      - number: '2.3'
        title: Buyer, User, Payer, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is more complex than “the military” or “government.” On the defense side, the user is the
              operational unit that needs reconnaissance, communications relay, EW support, or attritable strike
              effects. The buyer is usually a program office or acquisition authority, while the payer is an
              appropriated budget line or a specific initiative such as Replicator, Transformation in Contact, or Drone
              Dominance. CRS makes that segmentation explicit by mapping capability to squad, platoon, company, and
              battalion echelons. Performance Drone Works matters most at the company-level medium-range reconnaissance
              tier and in adjacent special-operations and mission-specific deployments. Breaking Defense and Military
              Aerospace reinforce that this market is still tranche-based, competitive, and evaluation-heavy rather than
              a static winner-take-all catalog purchase.


              On the public-safety side, the user is a police, fire, rescue, or emergency-response team; the buyer is an
              agency head or procurement function; and the payer can be a city, county, state, or grant-supported
              budget. That matters because adoption triggers differ. Military programs are driven by doctrine,
              survivability, range, compliance, and unit-level mission outcomes. Public-safety agencies care more about
              deployment speed, maneuverability, thermal or ISR payloads, and cost-effective airborne support in
              dangerous or time-sensitive incidents. PDW’s product suite is built to bridge those workflows with the
              same airframe family plus software, payload, and training attachments. The practical adoption sequence is
              therefore capability validation, compliance and security clearance, competitive evaluation, contract
              award, fielding, and operator enablement—not a simple hardware transaction.
