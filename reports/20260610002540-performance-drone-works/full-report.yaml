      - number: '7.2'
        title: Operational, Quality, and Reliability Risks
        blocks:
          - type: paragraph
            body: >-
              PDW’s disclosed operating story is ambitious: a modular Group 2 platform, multiple payload classes,
              GPS-denied autonomy, long-range command-and-control extensions, and a new factory positioned for full-rate
              production. The risk is that the public evidence base remains much stronger on demonstrations than on
              durable fleet reliability. PDW disclosed 114 flights in its March 2026 test series, including 20-kilometer
              command-and-control and 11 autonomous GPS-denied flights, but it has not publicly disclosed MTBF,
              field-loss rates, warranty-return trends, or mission-abort statistics. That gap matters because military
              buyers are not purchasing a single aircraft; they are underwriting a production-and-support system that
              must survive repeated use in harsh electromagnetic and climatic conditions.


              The company’s own legal documents reinforce this execution risk. PDW’s limited warranty excludes operator
              misuse, missing licenses or training, and any guarantee that services will be uninterrupted or that radios
              will achieve a given usable range. It also requires customers to preserve logs, diagnostics, photos, and
              video to support claims. Those provisions are commercially rational, but they also signal how many failure
              modes can arise at the edge between hardware, software, training, and environment.


              Public-spec consistency is another small but telling issue. PDW’s 2026 product page markets a 10-pound
              maximum payload, while older official and partner materials reference 15 pounds or even 15-plus. That
              inconsistency does not prove the aircraft underperforms; it does prove investors need configuration-level
              spec sheets by payload, battery, and mission profile. In a business selling modular battlefield systems,
              sloppy or drifting public specs are themselves an execution warning.
