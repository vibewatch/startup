  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Price Discipline
        blocks:
          - type: paragraph
            body: >-
              PDW deserves credit for capability momentum. Publicly available evidence shows a company that has moved
              beyond concept-stage storytelling: the C100 is Blue UAS-approved, the platform has logged a new Air Force
              win on top of Army demand, and PDW has opened Drone Factory 01 with stated monthly output of 350 C100s and
              5,000 AM-FPVs. The board has also been strengthened with senior finance and enterprise-software operators,
              while the Vanteon acquisition points to deeper in-house RF and communications capability. Taken together,
              those facts support a genuine upside thesis that PDW can become a scaled U.S. tactical-drone supplier
              rather than a one-program niche contractor.


              The valuation problem is that capability proof is materially ahead of financial disclosure. PDW’s own
              March 2026 announcement disclosed that the Series B brought total funded capital to over $110 million, but
              it did not disclose a post-money valuation or current revenue. The only public mark we found is Premier
              Alternatives’ March 26, 2026 estimate of $730 million, and even that source conflicts with PDW’s official
              cumulative-funding figure. Without verified revenue, gross margin, order backlog, or
              liquidation-preference detail, the right investment conclusion is research-more, not buy. A disciplined
              investor can watch PDW closely, but should avoid underwriting a premium valuation above the observed
              secondary mark until management closes the disclosure gap.
