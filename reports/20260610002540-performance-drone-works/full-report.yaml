      - CU018
      - CU022
      - CU024
      - CU035
      - CU038
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: Relative evidence quality across PDW's best-publicly-documented customer or end-user surfaces.
    data:
      columns:
        - Evidence Quality
        - Deployment Maturity
        - Outcome Specificity
        - Repeat Visibility
      rows:
        - label: Army TiC / PM UAS
          values:
            - High — official + independent corroboration
            - Fielded in many formations
            - Medium — contracts, theaters, and support are named
            - Medium — repeat awards visible but portfolio retention is not
          note: Best proof set in the chapter because it combines contracts, field support, and customer-side corroboration.
        - label: 93rd AGOW / Air Force
          values:
            - High — official + multiple trade publications
            - Early production contract
            - Low-Medium — mission fit is described but fleet metrics are absent
            - Low — no public repeat-order data
          note: Useful diversification proof but still first-order rather than renewal-grade.
        - label: UK MOD
          values:
            - Medium — company-authored case study
            - Pilot / demonstration
            - Medium — specific live-fire and range outcomes are disclosed
            - Low — no follow-on procurement disclosed
          note: Strong demo evidence, weaker commercialization evidence.
        - label: UXV / DALO showcase
          values:
            - Medium — partner-authored case study
            - Demo / integration showcase
            - Low — integration worked, but no mission metrics
            - Low — no disclosed conversion to orders
          note: Helpful interoperability proof for allied customers, not purchase proof.
        - label: Public safety
          values:
            - Low — product and segment marketing only
            - Marketed adjacency
            - Low — capability claims only
            - Low — no named agencies or renewals
          note: This is the biggest evidence-quality gap in the chapter.
    approximationNotes: >-
      Matrix cells score the public evidence base, not PDW's actual internal customer quality. A lower score usually
      reflects disclosure limits rather than product weakness.
    claimRefs:
      - CU002
      - CU003
      - CU010
      - CU011
      - CU013
      - CU015
      - CU031
      - CU032
      - CU036
      - CU037
