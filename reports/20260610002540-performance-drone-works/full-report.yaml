  - id: FE004
    title: Product Maturity / Capability Map
    type: matrix
    layout: wide
    summary: >-
      Relative maturity and evidence quality by module, highlighting where public validation is strong and where it
      remains promotional.
    data:
      columns:
        - Status / maturity
        - Evidence strength
        - Differentiation
        - Main gap
      rows:
        - label: C100 airframe
          values:
            - Fielded / mature public surface
            - High
            - Modular payload bus plus Blue UAS procurement path
            - Independent uptime and sustainment metrics not public
        - label: PDW CORE
          values:
            - Current software surface; CORE 1.4 shipped Mar 2026
            - Medium-high
            - TAK-linked planning plus GPS-denied workflow additions
            - No public API / SDK / code surface
        - label: Multi-Mission Payloads
          values:
            - Current payload suite; enabled by latest software release
            - Medium
            - One-airframe path to SIGINT, comms relay, and VBN
            - No detailed public interoperability matrix
        - label: PDWSIM + training
          values:
            - Launch complete and still promoted
            - Medium-high
            - Owns rehearsal and operator enablement instead of leaving it to customers
            - Savings claims lack independent validation
        - label: AM-FPV + factory scale
          values:
            - Production-ready narrative, but newer than C100
            - Medium
            - Pairs modular strike line with a purpose-built factory
            - Public throughput and delivery evidence remains thin
    approximationNotes: >-
