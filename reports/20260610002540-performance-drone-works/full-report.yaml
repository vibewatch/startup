      - number: '3.3'
        title: 'Pricing, procurement, and distribution: the fight is more about workflow access than public list price'
        blocks:
          - type: paragraph
            body: >-
              The reviewed public record does not disclose enough list pricing to build a clean apples-to-apples cost
              table, and that absence is itself informative. Across PDW, Skydio, BRINC, Anduril, Shield, and Red Cat,
              the visible pattern is quote-led enterprise selling, contract vehicles, or program awards rather than
              posted price cards. In other words, the competitive issue is less “Who is cheapest on a website?” and more
              “Who can be bought fastest, from the budget already in motion, with the least internal friction?” Skydio
              has a clear advantage here because Blue UAS status is paired with GSA and DLA access and a product family
              that touches public safety, security, inspection, and defense. BRINC’s Motorola alliance is even more
              structurally powerful in municipal response because it turns drone deployment into a button inside APX
              radios, VESTA 911, CAD, and RTCC software. Red Cat is building a defense-oriented path through
              public-company visibility, allied orders, and programmatic growth guidance. PDW’s counter is its domestic
              manufacturing story, Army traction, and a broader mission stack than most public-safety specialists. But
              without transparent ASPs, the real underwriting questions are win rate, renewals, and bundle economics.
              Until diligence gets those private numbers, distribution power and workflow insertion deserve more weight
              than any unsupported claim of lower cost per system.
