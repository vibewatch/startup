      - number: '6.3'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Durability is where the evidence set becomes much thinner. There is enough public material to support a
              positive view on adoption momentum—repeat Army awards, embedded field support, new payload releases for
              existing customers, and manufacturing scale-up—but not enough to underwrite customer quality with normal
              SaaS or defense-program rigor. No retained source discloses customer count, NRR, GRR, churn, renewal rate,
              backlog, or top-customer concentration. As a result, the chapter can show that PDW has repeat government
              demand, but it cannot prove whether revenue is concentrated in one or two programs, whether early awards
              are converting into repeat purchases at the same unit, or whether public-safety demand is becoming a
              durable second leg.


              The most plausible expansion path is deeper defense adoption rather than immediate vertical
              diversification. Payload upgrades, training, partner integrations, and manufacturing capacity all support
              a land-and-expand motion inside Department of War and allied workflows. At the same time, the risk surface
              is real. Army demand appears central to the thesis, the Army is now running a five-system portfolio rather
              than a sole-vendor lane, and PDW’s warranty terms explicitly place meaningful limitations on remedies,
              coverage expectations, and service continuity. None of those items negate the customer story, but they do
              change how it should be scored: PDW has authentic defense adoption proof and credible expansion levers,
              yet customer durability and concentration remain diligence-dependent because the public record still stops
              short of portfolio-level economics.
