      - number: '1.2'
        title: Leadership, governance, and key-person risk
        blocks:
          - type: paragraph
            body: >-
              The current public leadership picture shows a company that is no longer presented as purely founder-led,
              even though founders still hold important operating influence. PDW’s June 2026 leadership page lists James
              Slider as chief executive officer, Ryan Gury as co-founder and chief innovation officer, and Matt Higgins
              as co-founder and executive chairman. That is a meaningful change from 2024 and 2025 official
              announcements, where Gury was still quoted as chief executive officer, while Slider appeared as president
              and COO in the August 2025 factory opening release. The retained record therefore supports a real
              executive transition between late 2025 and March 2026, but not the internal board process or ownership
              logic behind it. Public executive coverage is otherwise reasonably strong for a private defense company:
              Dylan Hamm runs technology, Alok Gupta finance, Kristie Rodenbush people, Abigail Stock marketing, Gustav
              Bahn legal, and Greg Farmer operations. Governance also matured materially. Tony Thomas joined as chairman
              in June 2024, and Samantha Greenberg and Bill Welch joined the board in May 2026 to chair the audit and
              compensation committees. Even so, there is still no public disclosure of voting control, liquidation
              preferences, founder ownership, or investor board rights. That leaves meaningful key-person and governance
              diligence open around Slider, Gury, Hamm, and the board’s true independence from capital providers and
              mission-network insiders.
