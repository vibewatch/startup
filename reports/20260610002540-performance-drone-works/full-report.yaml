              revenue potential are still aspirational until output and backlog are verified, while concentration and
              appropriations timing remain real risks for a defense supplier. The practical conclusion is that PDW
              currently looks fundable as a defense-production ramp with demonstrated procurement relevance, but not yet
              bankable on the basis of disclosed cash economics. Any investment view should be conditioned on management
