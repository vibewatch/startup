      - number: '1.4'
        title: Milestones and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The best chapter-level chronology starts with a disputed 2018 versus 2019 founding date, then quickly
              becomes clearer around product, governance, and scale milestones. PDW had its C100 approved for the DIU
              Blue UAS program in December 2023, promoted Dylan Hamm to CTO and announced a $6.9 million USSOCOM
