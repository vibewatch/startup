            body: >-
              The capital story is directionally strong but not perfectly reconciled. SEC filings for PDW Holdings, Inc.
              show a visible funding progression: roughly $8.6 million sold in March 2024, $16.4 million sold on a $30
              million offering in March 2025, and then a much larger late-2025 to 2026 financing sequence that moved
              from a December 2025 Form D showing $99.1 million sold on a $118.5 million offering to an April 1, 2026
              amendment reporting $162.37 million sold and zero remaining. By contrast, PDW's March 25, 2026 press
              release described the same broader financing as more than $110 million. Ondas separately announced a $35
              million strategic investment in November 2025 and tied the use of proceeds to production scale-up,
              engineering headcount, and domestic component supply. Company sources also connect financing directly to
              factory expansion: PDW has opened a 90,000-square-foot manufacturing site and claimed peak monthly output
              of 350 C100s and 5,000 AM-FPVs. That pattern implies a company funding ahead of expected manufacturing
              volume, which is sensible in defense hardware but still leaves a key gap. No reviewed source discloses the
              current cash balance, monthly burn, or runway. Public evidence therefore supports a substantial capital
              base for scale-up, but not a precise estimate of how much liquidity remains after the factory and hiring
              ramp.
