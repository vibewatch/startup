              DoD-oriented procurement path and narrows supply-chain and security concerns more than a generic marketing
              claim would. The warranty and privacy documents also add non-trivial detail: PDW publishes a one-year
              warranty framework, explicitly limits support for misuse and unauthorized training, and says third-party
              components fall back to original manufacturers; the privacy notice discloses third-party analytics,
              transaction-data collection, and potential sharing with agents, affiliates, and authorities under legal
              process. Those are useful control disclosures because they define what PDW is actually willing to promise.
              At the same time, several diligence-critical items stay outside the public record. I did not find public
              uptime commitments, MTBF data, service-level metrics, independent quality audits, or widely inspectable
              cyber-assurance artifacts such as SOC 2, ISO 27001, or CMMC disclosures. Likewise, there is no public API
              or developer-doc surface that would let an investor inspect software maturity from the outside. The result
              is a mixed trust picture: good evidence of procurement-aware productization, training discipline, and
              published legal terms, but limited independent evidence on software reliability, operating resilience, and
