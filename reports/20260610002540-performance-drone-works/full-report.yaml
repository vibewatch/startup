      - number: '7.3'
        title: Partner, Component, and Supply-Chain Dependency Risks
        blocks:
          - type: paragraph
            body: >-
              PDW’s modularity is commercially attractive, but it also creates a dense dependency map. The C100 value
              proposition depends on external radios, payloads, sensors, controllers, and software interfaces that must
              remain compatible, available, and compliant. Public materials tie the platform to Doodle Labs radios, Next
              Vision EO/IR payloads, UXV ground-control stations, TAK networking, and a long list of third-party payload
              options. PDW’s own warranty sharpens the point by explicitly excluding many third-party products from PDW
              warranty coverage. In practice, that means some of the most mission-critical parts of the deployed system
              may fail outside PDW’s direct warranty umbrella.


              The radio link is the clearest example. Doodle Labs presents itself as a strong partner, and its scale
              claims are directionally reassuring, but PDW still depends on an outside supplier for an important
              contested-environment capability. Doodle’s own supply-chain commentary is useful adverse evidence because
              it emphasizes exactly the failure modes investors should worry about: single-source bottlenecks, overseas
              dependencies, and inability to deliver at program volumes. Those are not abstract market risks; they are
              the specific pressures that could turn a seemingly qualified platform into a delayed or non-compliant one.


              FCC policy makes the dependency risk sharper. Because the regulator now treats radios, sensors,
              controllers, batteries, and motors as critical components, procurement eligibility can fail at the
              subsystem level. PDW may be domestically anchored, but its exemption durability after January 1, 2027
              still depends on component-origin evidence that is not public today. Until investors review BOM-level
              sourcing and alternate-vendor qualification, PDW’s modularity should be read as both a feature and a
              concentrated integration risk.
