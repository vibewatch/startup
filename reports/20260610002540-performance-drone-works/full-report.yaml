        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              PDW is not presenting itself as a pure-software company with seat pricing, transparent ARR, or a visible
              renewal model. The public footprint instead points to a bundled defense-program business in which
              airframes, payloads, mission software, and training are sold together through negotiated government
              procurement. The homepage and product stack show revenue exposure across core C100 drone platforms,
              mission-specific payloads, PDW CORE mission-planning software, training and certification, and the newer
              Attritable Multirotor strike system. That mix matters because public contract values should be read as
              integrated mission-system economics, not as a clean per-drone or per-seat price. The company also says it
              serves every branch of the U.S. military plus federal, local, and international public-safety entities,
              which suggests broader end-market reach than a single-program defense supplier. What is missing is equally
              important: no reviewed source disclosed public list pricing, realized ASPs, discounting, attach rates, or
              revenue mix by hardware versus software versus services. The evidence therefore supports a
              bundled-capability revenue model with multiple attach points, but not a high-confidence view of how much
              of each contract is recurring software, how much is hardware, and how much is labor or support.
