      - number: '6.2'
        title: Adoption proof and trajectory
        blocks:
          - type: paragraph
            body: >-
              The strongest named-customer evidence sits inside U.S. defense programs. Army proof is deepest: PDW says
              the first two Transformation in Contact awards fielded C100 systems to seven Army PM UAS units, a
              September 2025 award added a $20.9 million follow-on program for C100 systems and Multi-Mission Payloads,
              and an Army statement from May 2026 says PDW C-100 systems are already fielded in many formations. That is
              meaningfully better than logo-only evidence because it shows not just a contract announcement but also
              continued operational presence in Army formations and support activity at the National Training Center.
              The Air Force proof is narrower but still credible: multiple sources corroborate that the 93rd Air Ground
              Operations Wing awarded PDW its first Air Force contract for the C100 in October 2025.


              International proof exists but is earlier-stage. PDW’s UK Ministry of Defence case study documents a
              funded demonstration with successful target designation and long-range flight, while UXV’s Denmark case
              study shows the C100 integrated with a Soldier Robotic Controller during DALO Industry Days. These are
              useful signals of allied interest and interoperability, but they do not yet equal published production
              procurement. Independent partner proof also helps validate that the platform is doing real work in the
              field: Doodle Labs says the C100 has been deployed for ISR, comms relay, and light payload delivery and is
              already interoperating with defense command-and-control infrastructure. Taken together, the adoption story
              is credible and improving, but still concentrated around defense programs rather than a broad,
              multi-vertical installed base.
