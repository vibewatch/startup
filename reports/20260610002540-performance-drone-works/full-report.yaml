        title: Product Definition and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Performance Drone Works sells a tightly linked operating stack rather than a stand-alone quadcopter. At
              the front end is the C100, which PDW markets in both defense and public-safety configurations; around it
              sit the CORE mission-planning and control software, the PDW SIM rehearsal environment, the Multi-Mission
              Payload suite, and a growing attritable-strike line. In customer workflow terms, that means PDW is trying
              to own the sequence from mission planning to operator training to aircraft launch to payload execution.
              The defense workflow starts with a small team selecting payloads for ISR, EW, communications relay,
              targeting, or strike, planning the mission in CORE, and then handing operators a C100 or AM-FPV that is
              built around modular payload swaps rather than a single mission profile. The public-safety workflow uses
              the same airframe logic for first-response ISR, rapid overwatch, and cargo or sensor carriage. PDW SIM and
              the training catalogue are important because they show PDW treating readiness as part of the product, not
              a downstream service. That is strategically attractive for mission customers because it reduces
              integration burden, but it also means diligence must evaluate airframe, software, and training claims
              together rather than as isolated products.
