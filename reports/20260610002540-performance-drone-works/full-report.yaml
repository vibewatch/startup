              production base, and a product stack broad enough to support payload, software, and training attach
              revenue. This is not a prototype-only company. The problem is that the same public record says very little
              about revenue quality. Audited revenue and ARR are undisclosed; gross margin, burn, backlog, customer
              concentration, and runway are undisclosed; and even the 2026 round-size language is directionally positive
              but numerically messy because the official “over $110M” statement and the SEC's $162.37M sold figure are
