chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Performance Drone Works, now commonly branded as PDW, presents itself as a Huntsville, Alabama
              defense-technology company developing multi-mission aerial robotic systems for defense, government, and
              public safety customers. The company’s current official materials frame PDW less as a single-aircraft
              vendor and more as an integrated tactical robotics stack: the C100 multi-mission quadcopter, the AM
              Defense attritable strike platform, PDW CORE mission-planning and control software, PDW SIM training
              software, and a growing manufacturing layer built around Drone Factory 01. Product pages emphasize
              domestic design and production, NDAA-compliant hardware, and mission performance in contested
              environments, which is consistent with the company’s positioning as an American alternative to foreign
              small-UAS supply chains. The Huntsville location matters strategically because PDW repeatedly ties its
              operating identity to Redstone Arsenal, local engineering talent, and defense-manufacturing
              infrastructure. The only notable identity conflict in public records is the founding date: some retained
              sources describe PDW as founded in 2018, while Crunchbase lists 2019. That discrepancy is not fatal to the
              chapter, but it means later chapters should avoid stating one exact year without qualification. Overall,
              the supportable one-line description is that PDW is a private Huntsville-based defense drone company
              selling hardware, software, training, and scaled production capability to U.S.-aligned defense and
              public-safety buyers.
