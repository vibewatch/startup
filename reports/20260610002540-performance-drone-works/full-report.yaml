      - number: '1.3'
        title: Capital base, demand signals, and scale
        blocks:
          - type: paragraph
            body: >-
              The most important capital event in retained evidence is PDW’s March 25, 2026 Series B financing. Official
              company materials say the round brought total capital funded to more than $110 million and was led by
              Ondas with participation from Hood River, Cedar Pine, Hanwha Asset Management’s venture fund, Booz Allen
              Hamilton, and other existing and new investors. The company says proceeds will expand product offerings,
              fund growth initiatives, and ramp drone production. Independent market-data pages broadly corroborate that
              a Series B closed in March 2026, but their exact valuation and total-funding figures should be treated as
              useful estimates rather than audited ground truth. Premier Alternatives, for example, lists a $730 million
              valuation and $235.8 million total funding as of late March 2026, but its free page also admits that full
              funding history is incomplete. On operating scale, PDW has unusually tangible public demand evidence for a
              private startup: an official December 2024 statement about more than $15.3 million in Army C100 sales and
              contracts, a February 2024 $6.9 million USSOCOM Blackwave contract, and independent local coverage of a
              March 2026 Army award for C100 bundles and support equipment. Scale claims accelerate further with Drone
              Factory 01, where PDW says it can eventually produce 350 C100s and 5,000 AM-FPVs per month. What remains
              missing is equally important: no audited revenue, current headcount, debt facilities, or customer-count
              disclosure is public in retained sources.
