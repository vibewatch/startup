  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Adjacent Categories
        blocks:
          - type: paragraph
            body: >-
              Performance Drone Works should be analyzed inside a narrow defense-and-government drone systems market,
              not against every dollar labeled “military aerospace” or “commercial drones.” The included spend most
              relevant to PDW is small multirotor reconnaissance and attritable strike systems, plus the attached
              payloads, mission software, ground control, and training required to field them. That is the consistent
              through-line across PDW’s defense pages, C100 and AM Defense product materials, PDW CORE mission-planning
              software, PDW SIM training environment, and multi-mission payload catalog. In other words, the company is
              not just selling a quadcopter; it is selling a fieldable capability stack for contested operations and
              rapid-response government missions.


              The excluded spend is equally important. Broad market reports include fixed-wing systems, large-payload
              aircraft, strategic ISR platforms, and other categories that are real drone spend but not obviously
              addressable for PDW’s current product line. On the civilian side, broad commercial drone market statistics
              include agriculture, delivery, inspection, media, and mapping, which again are relevant for technology
              diffusion but not the right near-term revenue lens for this company. The cleanest adjacency is public
              safety. PDW explicitly carries a public-safety product line, but the messaging still inherits
              defense-style requirements: fast deployment, modular payloads, secure operations, and operator training.
              That means public safety is an adjacent wedge with overlapping technology and buyers, not a completely
              separate market motion.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM038
              - CM039
