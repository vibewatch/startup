    {
      "id": "milestones-and-adverse-signals",
      "title": "Milestones and adverse signals",
      "body": "The best chapter-level chronology starts with a disputed 2018 versus 2019 founding date, then quickly becomes clearer around product, governance, and scale milestones. PDW had its C100 approved for the DIU Blue UAS program in December 2023, promoted Dylan Hamm to CTO and announced a $6.9 million USSOCOM Blackwave contract in February 2024, appointed Tony Thomas as board chair in June 2024, elevated Chuck McGraw to CRO in August 2024, and disclosed more than $15.3 million in Army C100 contracts in December 2024. In August 2025 the company opened its 90,000-square-foot Drone Factory 01 in Huntsville, a signal that PDW was shifting from product promise toward production economics. The main adverse development visible in public records is not product failure but labor risk: the National Labor Relations Board shows an open case filed on November 20, 2025 alleging changes in terms and conditions of employment and coercive rules. That does not prove a final violation, but it is a real legal and reputational issue that should be carried forward into later diligence. By spring 2026, the milestone sequence culminated in the Series B financing and the addition of Greenberg and Welch to the board, suggesting PDW is moving from founder-heavy startup governance toward a more institutional defense-manufacturing profile while still carrying unresolved labor, disclosure, and concentration risks.",
