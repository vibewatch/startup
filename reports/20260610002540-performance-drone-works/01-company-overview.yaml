  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Performance Drone Works is a Huntsville, Alabama-based private defense-drone manufacturer building a modular stack of aircraft, software, training, and manufacturing capacity around the C100 and AM platforms. By June 2026, the clearest public picture is a company that materially upgraded governance and capital access with a March 2026 Series B, but still leaves investors with unresolved questions on exact founding date, current headcount, audited revenue, debt, and cap-table control. The highest-salience adverse signal in retained evidence is an open NLRB case filed in November 2025, which introduces labor-practice risk into an otherwise fast-scaling defense-manufacturing story."
  },
  "sections": [
    {
      "id": "identity-platform-and-operating-footprint",
      "title": "Identity, platform, and operating footprint",
      "body": "Performance Drone Works, now commonly branded as PDW, presents itself as a Huntsville, Alabama defense-technology company developing multi-mission aerial robotic systems for defense, government, and public safety customers. The company’s current official materials frame PDW less as a single-aircraft vendor and more as an integrated tactical robotics stack: the C100 multi-mission quadcopter, the AM Defense attritable strike platform, PDW CORE mission-planning and control software, PDW SIM training software, and a growing manufacturing layer built around Drone Factory 01. Product pages emphasize domestic design and production, NDAA-compliant hardware, and mission performance in contested environments, which is consistent with the company’s positioning as an American alternative to foreign small-UAS supply chains. The Huntsville location matters strategically because PDW repeatedly ties its operating identity to Redstone Arsenal, local engineering talent, and defense-manufacturing infrastructure. The only notable identity conflict in public records is the founding date: some retained sources describe PDW as founded in 2018, while Crunchbase lists 2019. That discrepancy is not fatal to the chapter, but it means later chapters should avoid stating one exact year without qualification. Overall, the supportable one-line description is that PDW is a private Huntsville-based defense drone company selling hardware, software, training, and scaled production capability to U.S.-aligned defense and public-safety buyers.",
