callouts:
- calloutType: strength
  title: Army repeat procurement is the clearest proof of real adoption
  body: PDW's strongest customer signal is not a logo wall or a single demo. It is the combination of repeat Army awards, disclosed fielding into units and formations, and ongoing hands-on support at the National Training Center. That combination suggests the C100 is solving a live operational problem for Army users and that PDW is staying close enough to operators to improve the system after delivery. For a defense startup, that is a higher-quality proof point than a standalone product announcement because it shows program continuity and customer engagement at the edge.
  claimRefs:
  - CU004
  - CU005
  - CU007
  - CU009
  - CU035
- calloutType: risk
  title: Public-safety upside is visible, but proof is not
  body: PDW clearly wants investors and buyers to believe public safety can be a second vertical, and the company has built the marketing and product surfaces to support that claim. The problem is that the retained evidence still stops before a named agency, procurement record, or after-action reference. Until management produces that proof, public safety should be modeled as pipeline optionality rather than diversified installed base. That distinction matters because it affects both concentration risk and the durability score for the overall customer portfolio.
  claimRefs:
  - CU003
  - CU025
  - CU032
- calloutType: insight
  title: The land-and-expand thesis is real, but it is tied to defense workflows
  body: The most credible expansion mechanism in public evidence is not simple new-logo growth. It is deeper penetration of existing defense relationships through payload upgrades, partner integrations, training, and manufacturing readiness. That is a rational path for PDW because defense customers buy systems, support, and interoperability together. The implication for diligence is that customer quality will depend less on top-of-funnel narrative and more on whether current Army and Air Force programs are converting into larger fleets, more payload attach, and repeat budget lines. The company may already be on that path, but the public record still needs account-level economics to prove it.
  claimRefs:
  - CU021
  - CU023
  - CU024
  - CU035
  - CU038
  - CU039
