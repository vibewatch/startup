chapter:
  number: 6
  title: Customers
  summary: PDW has credible named adoption proof with Army programs, a first Air Force contract, and allied demonstration evidence, but the public record is still concentrated in defense rather than diversified across public safety or commercial buyers. The chapter scores customer traction positively for real military fielding while treating retention, concentration, and public-safety durability as material diligence gaps.
sections:
- id: customer-base-and-segmentation
  title: Customer base and segmentation
  body: |-
    PDW’s customer story is easiest to understand by separating what the company markets from what the evidence actually proves. The official surface clearly targets two payer groups: defense organizations and public-safety agencies. Defense is described in concrete buyer terms—Army units, Air Force tactical operators, allied ministries, JTAC teams, and government operators that need ISR, electronic warfare, strike support, communications relay, or GPS-denied navigation. Public safety is also a visible segment, but the evidence quality is materially lower. PDW has a dedicated public-safety page and a public-safety configuration of the C100, yet the retained source set does not identify a named police, fire, or emergency-management customer using the system in production. That means the public-safety narrative should be treated as pipeline or adjacency, not as verified installed base.

    The better-substantiated part of the customer mix is the defense channel wrapped around the C100, its training stack, and its partner ecosystem. PDW publishes structured training, shows a broad roster of optics, communications, EW, and control-system partners, and markets a platform architecture that is designed to support different missions without redesigning the airframe. Those inputs matter for customer analysis because they lower deployment friction for military users who care about interoperability, training throughput, and payload flexibility. In practical terms, PDW looks less like a one-SKU drone seller and more like a growing defense-program supplier whose current proof is strongest where procurement can point to exercises, fielding, and named organizations.
