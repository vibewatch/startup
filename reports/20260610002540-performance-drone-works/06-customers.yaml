- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / User / Payer
  - Use Case
  - Scale / Evidence
  - Revenue / Strategic Value
  - Gap
  rows:
  - - U.S. Army TiC / PM UAS formations
    - PM UAS / Soldiers and commanders / Department of War budget
    - ISR, EW, comms relay, GPS-denied navigation, organic fires support
    - Strongest named segment; seven units fielded under first two awards; many formations still fielded in May 2026
    - Highest-confidence current customer surface; repeat-program evidence visible
    - No disclosed installed-base count, renewal rate, or revenue concentration by command
  - - U.S. Air Force tactical users
    - 93rd AGOW / tactical operators and JTAC teams / Air Force budget
    - Rapidly deployable multi-mission aerial support, ISR, targeting, battle damage assessment
    - First Air Force contract in Oct 2025 plus Crimson Tomahawk 25 exercise support
    - Important second anchor that broadens proof beyond Army
    - Fleet size, follow-on orders, and contract duration not disclosed
  - - Allied defense ministries and evaluation audiences
    - MoD program offices / operators / allied defense budgets
    - Target designation, long-range ISR, controller integration
    - UK MOD-funded live-fire demo and Denmark DALO Industry Days integration showcase
    - Supports international expansion narrative and interoperability proof
    - No retained source confirms a repeat overseas production contract
  - - Defense integrators and payload partners
    - Program managers / operators / government end buyers
    - Ground control, comms, optics, EW payloads, training stack
    - Partner roster spans UXV, Doodle Labs, Silvus, Mastodon, NextVision, Trillium and others
    - Improves deployability and cross-sell options for existing defense customers
    - Partner ecosystem depth does not itself prove end-customer revenue
  - - Public safety / first responders
    - Agency leadership / operators / municipal or grant budgets
    - Reconnaissance, signal detection, instant interdiction, crisis response
    - Dedicated public-safety product surface and mission messaging only
    - Could become a second vertical if named agencies convert
    - No named police, fire, or emergency-management customer found in retained sources
  notes: Segmentation is based on publicly retained evidence only; public-safety is treated as marketed adjacency unless a named deployment appears.
