      - number: '3.5'
        title: 反向证据与尽调缺口：渠道挤压和地方市场替代品仍是质疑耐久度的主要理由
        blocks:
          - type: paragraph
            body: >-
              反向逻辑不是 PDW 没有可信产品。反向逻辑是：资金更充足的对手可能在 PDW 近期融资和 Army 胜单转化为持久市场份额前，先占据价值最高的工作流位置。BRINC 可以借 Motorola
              把无人机变成应急响应操作系统的一部分。Skydio 可以用一个更大制造投入支撑的自主品牌，同时卖入公共安全、基础设施和国家安全。Red Cat 目前从小得多的基数扩张，但增长强劲、有盟友订单，也有清晰的“夜间战术
              ISR”信息。Anduril 和 Shield AI 可以通过说服买家标准化在更宽自主栈上，而不是单平台套装上，来扩大竞争口径。即便联邦信任顺风也有限：对中国无人机的限制显然帮助本土厂商拿联邦业务，但
              DroneDeploy 指南明确显示，非联邦和纯地方项目仍可使用这些替代品。这意味着 PDW
              最容易讲的增长故事，比泛泛的“美国无人机会赢”叙事更窄。关键缺失尽调不是技术，而是商业：实际成交价格、续约队列、具名竞争失利，以及真实公共安全部署数量。在这些数字可得之前，PDW
              应被视为一个有前景但仍未证明可规模化的公司，所处市场里渠道力量可能比机体差异化更快复利。
