  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与邻近品类
        blocks:
          - type: paragraph
            body: >-
              分析 Performance Drone Works 时，应把它放进较窄的国防和政府无人机系统市场，而不是拿所有标着“军用航空航天”或“商用无人机”的美元支出作对照。与 PDW
              最相关的纳入支出，是小型多旋翼侦察和可消耗打击系统，以及部署这些系统所需的挂载载荷、任务软件、地面控制和训练。PDW 的国防页面、C100 和 AM Defense 产品材料、PDW CORE
              任务规划软件、PDW SIM 训练环境以及多任务载荷目录，都贯穿这一条线。换句话说，公司卖的不只是一架四旋翼无人机；它销售的是一套可在受干扰作战和快速响应政府任务中部署的能力栈。


              排除支出同样重要。宽口径市场报告包含固定翼系统、大载荷飞行器、战略 ISR 平台及其他类别；这些确实属于无人机支出，但并不明显落在 PDW
              当前产品线的可服务范围内。民用侧，宽口径商用无人机市场统计包含农业、配送、巡检、媒体和测绘，这些对技术扩散有关系，却不是观察公司近期收入的正确镜头。最清晰的邻近市场是公共安全。PDW
              明确设有公共安全产品线，但其信息表达仍继承国防式要求：快速部署、模块化载荷、安全作业和操作员训练。因此，公共安全是一个技术和买家有重叠的邻近切入点，而不是完全独立的市场动作。
