      - number: '3.2'
        title: 直接产品压力：PDW 的续航和载荷优势，面对更强自主、调度和夜间作业对手
        blocks:
          - type: paragraph
            body: >-
              PDW 最强的技术论点，是 C100 占据了高于多数紧凑型美国替代方案的任务等级。74 分钟 ISR 续航包络和 15 磅载荷上限，为中继、传感、EW 或近打击载荷带来真实灵活性。相较 Teal
              2，这是有用优势：Teal 2 更轻、更易携带，但针对较短任务优化；相较 BRINC Lemur 2 也是如此，后者为室内进入、双向通信和破窗设计，而不是长续航监视。但规格领先并不会结束竞争讨论。Skydio
              X10D 用更强自主、零光导航，以及 Blue UAS 加 GSA、DLA 入口带来的采购便利回应。Red Cat 的 Teal 2 用“足够好”的战术 ISR
              套装回应：更轻、聚焦夜间，如今还绑定一家制造故事快速放大的上市公司。BRINC 则在公共安全响应工作流内部解决一个更窄但经济粘性很强的任务。Shield 的 V-BAT 和 Anduril 的 Ghost
              系列在机体形态上不完全可比，但会扩大远征或受干扰环境买家的比较集；这些买家可能愿意用便携性换取栈深度或项目背书。结果是：如果买家看重每名操作员可覆盖的任务广度，PDW
              会赢；如果买家把自主能力、调度集成或已经制度化的采购路径看得比载荷余量更重，PDW 会输。
