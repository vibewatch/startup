      - number: '1.3'
        title: 资本基础、需求信号与规模
        blocks:
          - type: paragraph
            body: >-
              保留证据中最重要的资本事件，是 PDW 在 2026 年 3 月 25 日完成的 Series B 融资。公司官方材料称，本轮使累计已获资金超过 $110 million，由 Ondas 领投，Hood
              River、Cedar Pine、Hanwha Asset Management 的创投基金、Booz Allen Hamilton
              以及其他新老投资者参投。公司称资金将用于扩展产品、资助增长举措并提升无人机产量。独立市场数据页面大体印证 2026 年 3 月有一轮 Series B
              完成，但其中的具体估值和累计融资数字应视作有用估计，而不是经审计的事实。例如 Premier Alternatives 列出截至 2026 年 3 月底的估值为 $730 million、累计融资为 $235.8
              million，但其免费页面也承认完整融资历史并不完整。在运营规模上，PDW 对一家私营初创公司而言有异常具体的公开需求证据：2024 年 12 月官方声明称 Army C100 销售和合同超过 $15.3
              million，2024 年 2 月获得 $6.9 million USSOCOM Blackwave 合同，以及地方独立报道提到 2026 年 3 月 Army 授予 C100 套件和支持设备合同。Drone
              Factory 01 进一步放大了规模叙事，PDW 称该工厂最终可每月生产 350 架 C100 和 5,000 架
              AM-FPV。同样重要的是仍缺失的内容：保留来源中没有公开的经审计收入、当前员工数、债务安排或客户数披露。
