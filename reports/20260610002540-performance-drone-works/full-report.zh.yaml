      - number: '7.2'
        title: 运营、质量与可靠性风险
        blocks:
          - type: paragraph
            body: >-
              PDW 披露的运营故事很有野心：模块化 Group 2 平台、多类载荷、GPS
              拒止环境自主、远距离指挥控制扩展，以及一座定位为全速率生产的新工厂。风险在于，公开证据基础在演示上强得多，在长期机队可靠性上弱得多。PDW 披露了 2026 年 3 月测试系列中的 114 次飞行，包括 20
              公里指挥控制和 11 次 GPS 拒止环境自主飞行，但没有公开披露
              MTBF、现场损失率、保修退回趋势或任务中止统计。这个缺口重要，因为军事买方不是在买一架飞机；他们是在押注一套生产和支持系统，而这套系统必须经受恶劣电磁和气候条件下的重复使用。


              公司自己的法律文件强化了这种执行风险。PDW
              的有限保修排除操作员误用、缺少许可证或培训，也不保证服务不中断，或无线电达到某个可用距离。它还要求客户保留日志、诊断、照片和视频来支持索赔。这些条款在商业上合理，但也提示了硬件、软件、培训和环境交界处可能出现多少失效模式。


              公开规格一致性是另一个小但有提示意义的问题。PDW 的 2026 年产品页面宣传最大载荷 10 磅，而更早的官方和伙伴材料提到 15 磅，甚至 15
              磅以上。这种不一致不能证明飞机表现不达标；它确实证明，投资者需要按载荷、电池和任务剖面拿到配置级规格表。一个销售模块化战场系统的业务，如果公开规格粗糙或漂移，本身就是执行警示。
