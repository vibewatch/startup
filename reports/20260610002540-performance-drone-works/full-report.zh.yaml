      - number: '5.2'
        title: 架构、软件栈与技术差异化
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一个具体架构故事。C100 被呈现为具有热插拔载荷能力的模块化机体，而 CORE 是面向操作员的任务规划器和与 TAK 相连的控制层。Multi-Mission Payload
              套件给出的技术拆解比首页更清楚：PDW 正把频谱感知、韧性通信中继和基于视觉的导航，作为随平台移动的插件能力推进。CORE 1.4 重要，因为它是当前公开领域最清晰的软件信号。发布说明描述了 GPS
              拒止环境下的“冷启动”导航、Doodle Labs Sense 支持、SROC 上的热插拔电池连续性，以及更丰富的仿真环境，说明 PDW 有意把通信韧性、自主能力和训练集成进一个控制栈。Justia
              的专利表面也强化了这一点：公司不只是包装第三方部件；它围绕自适应控制、信号情报载荷和即插即用飞行器接口提交了专利。尽管如此，这套栈并非端到端完全专有。Doodle Labs 和 UXV
              案例研究显示，公司对合作伙伴无线电和控制器有实质依赖，本轮也没有发现公开 API、SDK 或代码仓库。因此，差异化似乎来自系统集成、操作员工作流和模块化包装，而不是开放软件生态或可由外部检查的开发者平台。
