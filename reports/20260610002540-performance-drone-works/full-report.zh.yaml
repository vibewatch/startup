      - number: '3.4'
        title: 护城河耐久度：PDW 的信任与任务广度真实存在，但对手已在复制同一套采购叙事
        blocks:
          - type: paragraph
            body: >-
              PDW 的护城河论点有三根支柱：可信本土制造、比轻量公共安全无人机更宽的任务包络，以及可快速吸收新传感器和无线电的开放架构。三者都有意义，但没有哪一项看起来永久专有。Blue UAS 和 NDAA 合规重要，但
              Skydio、Red Cat 和 Anduril 也在这个信任边界内竞争。开放架构帮助 PDW
              更快部署新载荷，但伙伴密集的架构也会削弱差异性，因为底层光学器件、无线电和软件钩子越来越在同一个本土生态中流动。载重更高的 C100 和可消耗打击邻近能力，确实把 PDW 与 BRINC
              以及许多室内进入或巡检导向替代方案区分开来；但对实际任务只是短时公共安全响应的买家来说，这些特性也可能过度配置。高端市场上，Anduril 和 Shield
              可以把自主、海上入口或更宽的国防软件叙事包进系统，从而压过单一机体推介。低端市场上，只要资金来源不是联邦，DJI 式替代品仍然可用。最佳解读是：PDW
              有一个可防守切入点，但不是垄断护城河。它能赢下那些希望用一个本土栈覆盖 ISR、中继和近打击任务的买家，但仍需证明这个切入点能转化为更好的续约和份额提升，而不是临时规格优势。
