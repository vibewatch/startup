      - number: '1.2'
        title: 领导层、治理与关键人风险
        blocks:
          - type: paragraph
            body: >-
              当前公开领导层画像显示，公司已经不再完全以创始人主导的方式呈现，尽管创始人仍保有重要运营影响力。PDW 的 2026 年 6 月领导层页面列 James Slider 为首席执行官，Ryan Gury
              为联合创始人兼首席创新官，Matt Higgins 为联合创始人兼执行董事长。这与 2024 年和 2025 年官方公告相比是实质变化：当时 Gury 仍以首席执行官身份被引用，而 Slider 在 2025 年
              8 月工厂开业新闻稿中是总裁兼 COO。因此，保留记录支持公司在 2025 年底至 2026 年 3
              月之间确实发生了高管交接，但不能说明背后的内部董事会流程或所有权逻辑。对一家私营国防公司而言，公开高管覆盖度其余部分相当扎实：Dylan Hamm 负责技术，Alok Gupta 负责财务，Kristie
              Rodenbush 负责人事，Abigail Stock 负责市场，Gustav Bahn 负责法务，Greg Farmer 负责运营。治理也明显成熟。Tony Thomas 于 2024 年 6
              月出任董事长，Samantha Greenberg 和 Bill Welch 于 2026 年 5
              月加入董事会，分别主持审计和薪酬委员会。即便如此，投票控制权、清算优先权、创始人持股或投资方董事权利仍没有公开披露。这使围绕 Slider、Gury、Hamm
              以及董事会是否真正独立于资本方和任务网络内部人士的关键人和治理尽调仍然重要。
