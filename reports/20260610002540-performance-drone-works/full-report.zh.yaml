      - number: '7.6'
        title: 缓释因素、监测指标与否决标准
        blocks:
          - type: paragraph
            body: >-
              PDW 确实有真实缓释因素。公司已经进入以 Blue UAS 和 NDAA
              为中心的采购生态，筹得足够资本来建设制造和治理能力，也有公开证据显示其做的是运营测试，而不只是幻灯片叙事。董事会更深了，工厂是真实的，公司也赢得了重复陆军工作，而不是单个试点。这些事实不支持立即“避开”的判断。


              问题是，许多最难的风险只能监测，不能凭假设抹掉。最好的单一前瞻指标是采购资格。投资者应把 Blue-list
              动能的任何丧失、子系统层面国内含量无法证明、或对豁免窗口依赖扩大，都视为投资论点破裂前兆。第二个前瞻指标是转化质量：已披露产能应开始体现为多元化授标、稳定规格表，以及质量和服务流程跟上产出主张的证据。第三个是组织成熟度。如果劳动事项恶化、领导层继续流动，或客户开始报告集成或支持问题，PDW
              的规模叙事会很快变弱。


              落到实际尽调，公司只有在未来 6 到 12 个月内用证据支撑三项命题时，才仍可融资：第一，当前 FCC 和 Blue UAS 过渡规则收紧后，PDW
              仍能保持采购资格；第二，它能扩产而不暴露隐藏可靠性或供应商瓶颈；第三，它能把需求拓宽到一小簇紧急防务机会之外。如果这些命题失败，合适的 IC 动作不是增量谨慎，而是硬性重置承销假设。
