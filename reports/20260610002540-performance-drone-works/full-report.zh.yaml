chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、平台与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Performance Drone Works 现在通常以 PDW 品牌示人，自称是一家位于 Alabama 州 Huntsville
              的国防科技公司，为国防、政府和公共安全客户开发多任务空中机器人系统。公司当前官方材料不再把 PDW 定位为单一飞行器供应商，而是一个一体化战术机器人栈：C100 多任务四旋翼无人机、AM Defense
              可消耗打击平台、PDW CORE 任务规划和控制软件、PDW SIM 训练软件，以及围绕 Drone Factory 01 搭起且还在扩张的制造层。产品页面强调本土设计和生产、符合 NDAA
              的硬件，以及在受干扰环境中的任务表现，这与公司作为美国替代海外小型 UAS 供应链的定位一致。Huntsville 位置有战略意义，因为 PDW 反复把自身运营身份与 Redstone
              Arsenal、当地工程人才和国防制造基础设施绑定。公开记录里唯一值得注意的身份冲突是成立日期：部分保留来源称 PDW 创立于 2018 年，而 Crunchbase 列为 2019
              年。这个差异不影响本章结论，但意味着后续章节不应无条件写死某一个年份。总体看，可支撑的一句话描述是：PDW 是一家位于 Huntsville
              的私营国防无人机公司，向美国盟友体系内的国防和公共安全买家销售硬件、软件、训练和规模化生产能力。
