      - number: '5.4'
        title: 信任、质量、隐私与技术风险
        blocks:
          - type: paragraph
            body: >-
              PDW 的信任表面比许多国防无人机初创公司更具体，但对尽调而言仍不完整。最强官方信任标记是进入 Blue UAS，这很重要，因为它验证了一条面向 DoD
              的采购路径，也比一般营销说法更能收窄供应链和安全担忧。保修和隐私文件也提供了非平凡细节：PDW
              发布一年保修框架，明确限制对误用和未经授权训练的支持，并称第三方部件回归原制造商；隐私通知披露第三方分析、交易数据收集，以及在法律程序下可能与代理、关联方和主管机关共享。这些是有用的控制披露，因为它们界定了
              PDW 实际愿意承诺什么。与此同时，多项尽调关键事项仍留在公开记录之外。我没有找到公开正常运行时间承诺、MTBF 数据、服务级指标、独立质量审计，或 SOC 2、ISO 27001、CMMC
              披露等可广泛检查的网络保障材料。同样，也没有公开 API 或开发者文档表面，让投资者从外部检查软件成熟度。结果是一幅混合信任图景：采购导向产品化、训练纪律和已发布法律条款有不错证据，但除 Blue UAS
              和公司撰写政策外，在软件可靠性、运营韧性和网络控制上，独立证据有限。
