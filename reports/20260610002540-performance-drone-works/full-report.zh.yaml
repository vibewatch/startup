      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              资本故事方向强，但并未完全对齐。PDW Holdings, Inc. 的 SEC 文件显示出一条可见融资递进：2024 年 3 月大约售出 $8.6 million；2025 年 3 月一项 $30
              million 发行中售出 $16.4 million；随后是规模大得多的 2025 年底至 2026 年融资序列，从 2025 年 12 月 Form D 显示一项 $118.5 million 发行中已售出
              $99.1 million，到 2026 年 4 月 1 日修正文件报告已售出 $162.37 million、剩余额度为零。相比之下，PDW 2026 年 3 月 25 日新闻稿把同一更宽融资描述为超过
              $110 million。Ondas 另在 2025 年 11 月宣布 $35 million 战略投资，并把资金用途连到产能爬坡、工程员工扩张和本土部件供应。公司来源也把融资直接连到工厂扩张：PDW 已开设
              90,000 平方英尺制造基地，并宣称峰值月产 350 架 C100 和 5,000 架
              AM-FPV。这一模式意味着公司在预期制造量之前先投入资金；这对国防硬件是合理的，但仍留下一个关键缺口。没有已审阅来源披露当前现金余额、月烧钱速度或现金跑道。因此，公开证据支持其拥有可用于规模化的可观资本基础，但无法精确估计工厂和招聘爬坡之后还剩多少流动性。
