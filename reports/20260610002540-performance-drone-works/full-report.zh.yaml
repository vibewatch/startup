      - number: '6.4'
        title: 图表材料
        blocks:
          - type: callout
            title: 陆军重复采购是实际采用最清晰的证据
            body: >-
              PDW 最强的客户信号不是标识墙，也不是单次演示，而是陆军重复授标、已披露向单位和编队列装、以及在 National Training Center 持续手把手支持的组合。这一组合说明，C100
              正在为陆军用户解决真实作战问题，并且 PDW 离操作员足够近，能在交付后继续改进系统。对防务初创公司来说，这比单独的产品公告质量更高，因为它显示项目连续性，也显示公司在一线与客户互动。
            calloutType: strength
