      - number: '4.2'
        title: 公开牵引与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              公开牵引故事强于公开单位经济故事。2024 年底到 2026 年 3 月之间，公开来源记录了多个具名 Army 或 C100 相关授予事件：PDW 自身在 2024 年 12 月声明 Army 销售和合同超过
              $15.3 million；2025 年 9 月公司宣布获得 $20.9 million Transformation in Contact 奖项；2026 年 3 月 Army 合同据报道金额为 $15.26
              million，用于任务套件、传感器和地面控制站。DVIDS 和 ExecutiveBiz 又补充了一项 2024 年 Tranche 1 定向需求共享授予，价值 $14.417
              million，但公开记录没有披露其中多少归属 PDW。这些事实确认了真实采购牵引和 Blue UAS/NDAA
              可签约性，但仍不能产出干净的单位经济。合同金额是打包的，标价缺失，公司又把硬件、软件、载荷和训练一起提供。公开来源也没有披露经审计收入、ARR、订单积压、客户集中度、毛利率或现金转化。投资者因此能看到需求信号和采购相关性，却仍无法判断这些信号能否转化为有吸引力的利润率或持久自由现金流。
