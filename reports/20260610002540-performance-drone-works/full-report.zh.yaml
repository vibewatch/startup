companyProfile:
  summary: >-
    Performance Drone Works 是一家位于 Alabama 州 Huntsville 的私营国防无人机制造商，面向国防、政府和公共安全买家打造一体化战术机器人栈。公开证据显示，公司的产品族以 C100
    四旋翼无人机、Attritable Multirotor 打击平台、CORE 任务控制软件、SIM 训练软件和 Drone Factory 01 制造能力为核心。公司已经把这套产品栈转化为可见的采购牵引，包括多个 Army
    Transformation in Contact 奖项、一份初始 U.S. Air Force 合同，以及公司声称已支持美国军方所有军种。2024 年以来，公司治理更成熟：CEO 交接给 James
    Slider，引入外部董事，并在 2026 年 3 月完成由 Ondas 领投的 Series B。主要未决尽调问题包括估值不透明、累计融资数字冲突、缺少公开收入披露，以及 2025 年底提交且仍未结案的 NLRB 事项。
