  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              PDW 的能力动能值得肯定。公开可得证据显示，这家公司已经越过概念阶段叙事：C100 获得 Blue UAS 批准，平台在陆军需求之上又拿到新的空军订单，PDW 也已开设 Drone Factory
              01，并称月产能为 350 架 C100 和 5,000 架 AM-FPV。董事会也引入了资深金融和企业软件运营者，Vanteon 收购则指向更深的内部 RF
              和通信能力。合在一起，这些事实支撑一个真实上行论点：PDW 可能成为规模化美国战术无人机供应商，而不是单一项目利基承包商。


              估值问题在于，能力证明明显走在财务披露前面。PDW 自己 2026 年 3 月公告披露，Series B 后总融资超过 $110 million，但没有披露投后估值或当前收入。我们找到的唯一公开标记，是
              Premier Alternatives 2026 年 3 月 26 日估计的 $730 million；即便这个来源，也与 PDW
              官方累计融资数字冲突。没有经验证收入、毛利率、订单积压或清算优先权细节，正确投资结论是继续研究，而不是买入。有纪律的投资者可以密切跟踪
              PDW，但在管理层补上披露缺口之前，不应以高于已观察二级市场标记的溢价估值承销。
