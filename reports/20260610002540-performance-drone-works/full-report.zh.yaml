  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：PDW 横跨战术国防、公共安全响应和替代无人机栈竞争
        blocks:
          - type: paragraph
            body: >-
              Performance Drone Works 不属于整齐的单产品同业集合。公司销售载重更高的 Blue UAS
              四旋翼无人机、靠近打击场景的可消耗多旋翼、任务规划软件、训练，以及由国防硬件衍生出的公共安全套装。因此，相关对手地图同时横跨多个品类。Skydio 和 Red Cat 是最接近的美国制造战术 ISR
              对手，因为二者把便携机体、夜间传感器和联邦信任资质结合起来。BRINC 是最直接的公共安全工作流威胁，因为它把应急响应无人机推进 911 和 CAD 系统，而不是把无人机当成独立飞手项目。Anduril 和
              Shield AI 位于 PDW 上一层：它们不是简单的 C100 替代品，但当客户想要更宽的自主栈、Army 项目办公室入口，或海上和远征能力时，它们会争夺同一批未来预算。AeroVironment
              作为有收入规模的现任主承包商也重要，PDW 无法匹配这种规模。最后，DJI 等中国机队在非联邦或纯地方工作中仍是现状替代品，这意味着 PDW 的 Blue UAS
              护城河在联邦渠道真实存在，但在其他地方并不完整。因此，正确的承销框架不是“谁造了类似无人机？”，而是“哪家供应商能用更强采购路径、工作流切入点或资本基础，解决同一项作战任务？”
