  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              PDW 并没有把自己呈现为一家有席位定价、透明 ARR 或可见续约模型的纯软件公司。公开足迹反而指向一种打包式国防项目业务：机体、载荷、任务软件和训练通过谈判式政府采购一起销售。首页和产品栈显示，收入暴露在核心
              C100 无人机平台、任务特定载荷、PDW CORE 任务规划软件、训练和认证，以及较新的 Attritable Multirotor
              打击系统上。这种组合很重要，因为公开合同金额应被解读为一体化任务系统经济性，而不是干净的单机或单席价格。公司还称其服务美国军方所有军种，以及联邦、地方和国际公共安全实体，说明终端市场触达范围比单一项目国防供应商更宽。缺失内容同样重要：没有任何已审阅来源披露公开标价、实际
              ASP、折扣、附加率，或硬件、软件、服务之间的收入组合。因此，证据支持一个有多个附加点的打包能力收入模式，但不能高置信判断每份合同中有多少是经常性软件、多少是硬件、多少是人工或支持。
