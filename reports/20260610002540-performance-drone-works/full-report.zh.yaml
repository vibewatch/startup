      - number: '2.2'
        title: 规模测算口径、需求信号与公开数字真正说明什么
        blocks:
          - type: paragraph
            body: >-
              公开规模证据支持这是一个大且扩张中的品类，但如果不调整口径，无法为 PDW 给出一个干净单一的总可用市场（TAM）。The Business Research Company 和 Research and
              Markets 都把 2026 年国防无人机市场描述在约 $13.73 billion，而 Fortune Business Insights 把更宽口径的军用无人机市场定在 2026 年 $20.80
              billion，美国市场为 $6.51 billion。这些估计在方向上有支撑，但不能互换。较窄研究似乎更接近作为采购系统和部件的“defense drones”，而 Fortune 的宽口径框架覆盖了更多军用
              UAV 宇宙。尽调时，这个差距就是警示标签：市场规模高度取决于纳入了什么。


              对 PDW 更尖锐的需求信号，不是全球 TAM 标题，而是美国项目中已经可见的公开采购路径。CRS 称 Army 希望在 FY2026 获得 107 套连级系统，并在小型 UAS 组合中申请约 $803.9
              million。Congress 还拨款 $1.4 billion 扩大小型 UAS 工业基础。Drone Dominance 又增加了第二个官方信号：一个两年期、$1 billion 的采购计划，目标是在
              2027 年前采购超过 200,000 架致命无人机。换句话说，市场不只被抽象分析师预测拉动，也被已有预算的美国政府需求和明确产业政策支持拉动。公共安全邻近市场较小但仍有意义：MarketsandMarkets
              估计该市场从 2023 年的 $1.1 billion 增长到 2028 年的 $2.0 billion，足以作为第二条 GTM 通道，但不改变国防目前是核心市场的结论。
