  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 从需求和能力证明，经由估值不透明，推导到最终继续研究建议的链条。
    data:
      nodes:
        - id: n1
          label: |-
            需求
            Army + Air Force 中标
        - id: n2
          label: |-
            能力证明
            Blue UAS + 测试数据
        - id: n3
          label: |-
            规模选项
            Drone Factory 01
        - id: n4
          label: |-
            治理 / RF 深度
            董事会 + Vanteon
        - id: n5
          label: |-
            估值不透明
            未披露收入或投后估值
        - id: n6
          label: |-
            建议
            继续研究 / 高风险
      edges:
        - from: n1
          to: n6
          label: 支撑上行
        - from: n2
          to: n6
          label: 支撑上行
        - from: n3
          to: n6
          label: 需要转化
        - from: n4
          to: n6
          label: 提升备勤
        - from: n5
          to: n6
          label: 压低确信度
    claimRefs:
      - CV007
      - CV014
      - CV015
      - CV019
      - CV021
      - CV045
      - CV050
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在悲观、基准、乐观和已观察老股框架下，以 USD millions 表示的示意性当前估值区间。
    data:
      items:
        - label: 悲观下限
          value: 250
        - label: 悲观上限
          value: 400
        - label: 基准中点
          value: 650
        - label: 已观察老股标记
          value: 730
        - label: 乐观下限
          value: 900
        - label: 乐观上限
          value: 1200
    approximationNotes: 这些是分析区间，不是交易观察值；锚定 Premier Alternatives 的 2026 年 3 月标记，以及公开无人机和防务可比公司的离散度。
    claimRefs:
      - CV021
      - CV043
      - CV047
      - CV048
      - CV049
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 低 / 基准 / 高估值区间，对比已观察老股指示。
    data:
      items:
        - label: 悲观情景
          low: 250
          mid: 325
          high: 400
        - label: 基准情景
          low: 550
          mid: 650
          high: 750
        - label: 乐观情景
          low: 900
          mid: 1050
          high: 1200
        - label: 已观察老股
          low: 730
          mid: 730
          high: 730
    approximationNotes: 已观察老股指示被视为参考点，而非已验证的新股轮价格。
    claimRefs:
      - CV021
      - CV047
      - CV048
      - CV049
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: IC 风格评分：按 1-5 分评估 PDW 的市场、证明和估值就绪度维度。
    data:
      items:
        - label: 市场顺风
          value: 4
          note: 防务和公共安全无人机市场在增长。
        - label: 产品证明
          value: 4
          note: Blue UAS、合同中标和测试支撑可信度。
        - label: 制造规模选项
          value: 4
          note: 工厂足迹和公布产能创造上行选择权。
        - label: 治理成熟度
          value: 3
          note: 董事会新增成员和 Vanteon 有帮助，但数据披露仍滞后。
        - label: 财务透明度
          value: 1
          note: 未公开收入、利润率或投后估值。
        - label: 估值支撑
          value: 2
          note: 只有一个老股标记，且尚未完全对齐。
        - label: 执行 / 法律风险
          value: 2
          note: 未结 NLRB 案件和采购集中度仍然重大。
        - label: 投资就绪度
          value: 2
          note: 公司有意思，但公开证据还不足以支撑定价。
    claimRefs:
      - CV024
      - CV029
      - CV031
      - CV045
      - CV046
      - CV050
