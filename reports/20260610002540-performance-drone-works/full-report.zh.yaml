        - Teal 2 和更广的全域无人机家族
        - 政府和盟国订单模式；保留来源没有公开标价
        - 夜间 ISR、Blue UAS 信任、国防制造扩张
        - 上市公司指引显示增长，但不显示合同级定价
        - 即便定价不透明，Teal 仍可在战术 ISR 上激进竞争
      - - Anduril
        - Ghost 和更广的自主栈
        - 项目制国防销售，而非标价；Blue UAS 和 Army 通道支持高端企业销售动作
        - 围绕飞机的更广自主叙事
        - 保留材料中没有公开可比单价
        - Anduril 可以把购买框架从无人机价格改写为系统栈价值
      - - Shield AI
        - V-BAT 和自主栈
        - 项目制国防销售；保留来源没有公开标价信号
        - 海事部署足迹和 ViDAR 支持的广域感知
        - 每套系统经济性的公开证据很少
        - Shield 在能力和已部署验证比标价更重要的场景竞争
      - - DJI / 受管制外国实体机队
        - 通用商用无人机机队
        - 通常是更低成本的商用替代品，但按现行规则无联邦资格
        - 廉价航拍和地方 / 私人既有装机基础
        - 2025 年 12 月 22 日后不能用于联邦工作
        - 即便联邦需求转向国内供应，PDW 在地方 / 私人工作中仍面临价格压力
    notes: 保留公开来源在融资、中标、采购路径和工作流集成上信息充足，但实际飞机定价很少。因此，本表聚焦合同模式和打包透明度，而不是没有支撑的单价估计。
