          - type: callout
            title: 先落地再扩张的论点成立，但绑定在防务流程上
            body: >-
              公开证据里最可信的扩张机制，不是简单的新标识增长，而是靠载荷升级、伙伴集成、培训和制造准备度，更深打入现有防务关系。这条路径对 PDW
              合理，因为防务客户一起购买系统、支持和互操作性。尽调上的含义是，客户质量不太取决于漏斗顶部叙事，而更取决于当前陆军和空军项目能否转化为更大机队、更高载荷配售率，以及重复预算线。公司可能已经走在这条路上，但公开记录仍需要账户层面的经济性来证明。
