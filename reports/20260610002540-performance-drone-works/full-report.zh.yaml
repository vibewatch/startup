      - number: '6.2'
        title: 采用证据与轨迹
        blocks:
          - type: paragraph
            body: >-
              最强的具名客户证据在美国防务项目里。陆军证据最深：PDW 称，前两项 Transformation in Contact 授标已向 7 个陆军 PM UAS 单位列装 C100 系统；2025 年 9
              月的一项授标又追加了 $20.9 million 的 C100 系统和 Multi-Mission Payloads 后续项目；2026 年 5 月的陆军声明还称，PDW C-100
              系统已在许多编队中列装。这比只有标识的证据强得多，因为它不只是合同公告，还显示 C100 在陆军编队中持续存在，并在 National Training Center
              获得支持活动。空军证据更窄，但仍可信：多项来源相互印证，93rd Air Ground Operations Wing 于 2025 年 10 月授予 PDW 第一份 C100 空军合同。


              国际证据存在，但阶段更早。PDW 的 UK Ministry of Defence 案例研究记录了一次获资助演示，其中目标指示和远距离飞行成功完成；UXV 的 Denmark 案例研究则显示，C100 在
              DALO Industry Days 期间与 Soldier Robotic Controller
              完成集成。这些是盟友兴趣和互操作性的有用信号，但还不等于已公布的生产采购。独立伙伴证据也有助于验证平台确实在现场做事：Doodle Labs 称 C100 已部署用于
              ISR、通信中继和轻载荷投送，并且已经能与防务指挥控制基础设施互操作。合在一起，采用故事可信且在改善，但仍集中在防务项目周围，而不是一个宽泛、多垂直行业的装机基础。
