      - number: '4.4'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              PDW 的公开财务画像在动量上有吸引力，在可承销性上偏弱。正向证据有分量：大额已披露融资、多个具名 Army
              授予事件、新扩建的生产基地，以及足够宽、可支撑载荷、软件和训练附加收入的产品栈。这不是一家只有原型的公司。问题在于，同一公开记录对收入质量说得很少。经审计收入和 ARR
              未披露；毛利率、烧钱速度、订单积压、客户集中度和现金跑道未披露；即便 2026 年融资规模语言方向积极，数字上也混乱，因为官方“超过 $110M”的说法和 SEC 的 $162.37M
              已售出数字没有明确对账。独立分析又增加了谨慎点：在产出和订单积压被验证前，产能声明和隐含收入潜力仍是愿景；对一家国防供应商来说，集中度和拨款时间也是真实风险。实际结论是：PDW
              目前看起来可作为一场有明确采购相关性的国防生产爬坡来融资，但还不能基于已披露现金经济性来承销。任何投资判断都应以管理层提供经审计收入、毛利率、订单积压、集中度和现金跑道数据，以及清晰解释 2026
              年融资机制为前提。
