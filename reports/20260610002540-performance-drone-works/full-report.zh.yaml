        title: 图表材料
        blocks:
          - type: callout
            title: 价格发现改善前继续研究
            body: PDW 作为防务无人机平台越来越像真的，但投资者仍看不到定价所需数字。强能力证据叠加弱财务披露，正是有纪律投资者应积极跟踪公司、同时拒绝以高于唯一已观察二级标记的溢价估值承销的典型场景。
            calloutType: recommendation
            claimRefs:
              - CV021
              - CV045
              - CV050
          - type: callout
            title: 主要估值风险是不透明，而不是产品质量
            body: 本章最难的问题，不是 PDW 能否制造或销售战术无人机，而是公开记录无法对齐总融资额，没有披露收入或利润率，并且在公司试图扩大制造、整合收购的同时，还存在一桩未结 NLRB 案件。
            calloutType: risk
            claimRefs:
              - CV023
              - CV024
              - CV046
          - type: callout
            title: 公开可比公司给出区间，而不是公式
            body: >-
              AeroVironment、Red Cat、Ondas 和 EHang 表明，无人机估值可以从低个位数收入倍数到泡沫化的 30x 以上结果。这个跨度太宽，无法为 PDW
              支撑单一快捷倍数；因此，今天唯一站得住的答案，是围绕已观察二级标记给出谨慎区间，并在定价前要求私下披露。
            calloutType: insight
            claimRefs:
