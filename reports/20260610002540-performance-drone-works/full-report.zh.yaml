      - number: '7.4'
        title: 财务模型与项目集中度风险
        blocks:
          - type: paragraph
            body: >-
              PDW 的融资和合同节奏显示出真实商业牵引力，但风险画像仍集中且资本密集。公司在 2026 年 3 月筹集超过 $110
              million，明确用于扩展产品、提升产量并建立美国锚定供应链。这是投资者支持的正面信号，但也确认 PDW 仍处在规模投资阶段：制造、营运资本、供应商导入和团队扩张，都必须先于完全可见的长期收入上升。Drone
              Factory 01 宣布的产能很亮眼，但在产能利用率和毛利率数据可见之前，产能既是上行抓手，也是成本承诺。


              需求集中是第二个大问题。PDW 称其支持美国军方每一个分支以及公共安全客户，但公开合同证据仍压倒性地与防务相关，尤其绑定在 Army TiC、MRR 相关工作和相邻任务集上。2026 年陆军授标只运行到 2027
              年 3 月，TiC 叙事也反复强调列装、学习和需求细化。这说明 PDW 仍在受益于桥接项目的紧迫性，而不是深度多元化的经常性收入基础。


              即便 2026 年 4
              月的陆军授标也包含一个细微信号：据报道只收到一份投标。这可能说明能力差异化，也可能反映一个绑定特定采购假设的狭窄利基。如果陆军优先级变化、另一家供应商拿下下一个正式列装项目，或非联邦市场因为 FAA 和 FCC
              摩擦推进更慢，PDW 可能发现自己拥有世界级产能，却追逐一个比预期更窄的需求池。因此，投资案例取决于把今天的紧迫性转化为耐久、项目化、多客户收入。
