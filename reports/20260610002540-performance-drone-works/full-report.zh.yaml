  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与采购资格风险
        blocks:
          - type: paragraph
            body: >-
              PDW 最重要的风险，不是 C100 在技术上是否有用，而是公司能否一直留在不断移动的门槛之内，让美国政府用户可以买这个产品。陆军的公司级定向需求明确表示，只有在平台通过 FY20 NDAA 合规和 Blue
              UAS 资格审查之后，才选择 PDW；DIU 自己的 2025 年刷新材料也把 Blue list 定位成一座桥，因为常规采购仍落后战场需求多年。这意味着，PDW
              当前动能中有相当一部分依附在仍在演化的资格制度上，而不是永久稳定的采购轨道上。


              FCC 又增加了一层脆弱性。其 2026 年 Covered List 规则现在阻止外国生产 UAS 和关键部件获得新的设备授权，同时只把 Blue UAS 已清单通过、且符合 Buy American
              的系统临时豁免到 2027 年 1 月 1 日。由于 FCC 对关键部件的定义很宽，涵盖无线电、控制器、传感器、电池和电机，PDW
              的合规暴露不只在机身，而是延伸到整个子系统堆栈。如果任何关键部件的来源、文件或清单状态出问题，即便防务销售继续，PDW 也可能失去商业和公共安全设备授权余量。


              法律风险也不再是假设。PDW 有一起未结 NLRB
              事项，指称公司存在胁迫性规则和雇佣条款变更；这本身并非生死问题，但说明公司已经进入一个阶段：内部流程争议可能变成公开诉讼或监管记录。条款和保修语言进一步显示，公司正试图用合同缩窄责任，并把现场使用风险向外转移。对投资者来说，核心结论是：PDW
              的监管护城河真实但有条件；清单状态、国内含量证据和劳动流程纪律，现在几乎和产品表现一样重要。
