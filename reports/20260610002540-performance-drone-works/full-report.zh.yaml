      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图比“军方”或“政府”复杂得多。国防侧，用户是需要侦察、通信中继、EW 支持或可消耗打击效果的作战单位。买方通常是项目办公室或采购权限主体，付款方则是拨款预算线，或
              Replicator、Transformation in Contact、Drone Dominance 等特定计划。CRS 通过把能力映射到班、排、连、营梯队，把这种分层讲得很明确。Performance
              Drone Works 在连级中程侦察层，以及相邻的特种作战和任务特定部署中最有相关性。Breaking Defense 和 Military Aerospace
              也强化了这一点：这个市场仍然按批次推进、竞争强、评估重，而不是静态的赢家通吃目录采购。


              公共安全侧，用户是警察、消防、救援或应急响应团队；买方是机构负责人或采购职能；付款方可以是市、县、州或有拨款支持的预算。这一点重要，因为采用触发因素不同。军事项目由条令、生存性、航程、合规和单位级任务结果驱动。公共安全机构更看重部署速度、机动性、热成像或
              ISR 载荷，以及在危险或时间敏感事件中以划算成本获得空中支援。PDW
              的产品套件试图用同一机体家族，加上软件、载荷和训练附件，把这些工作流连起来。因此，实际采用顺序是能力验证、合规和安全许可、竞争性评估、合同授予、部署和操作员赋能——不是一笔简单的硬件交易。
