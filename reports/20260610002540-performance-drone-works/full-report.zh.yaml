      - number: '2.4'
        title: 增长驱动、约束与仍然重要的缺口
        blocks:
          - type: paragraph
            body: >-
              最强的增长驱动异常具体。SIPRI 的 2024 年军事开支事实表显示，全球国防预算为 $2.718 trillion，同比增长
              9.4%；分析师报告则把自主能力、传感器融合、加固载荷集成和长续航任务列为主要产品层面顺风。PDW 自身的工厂扩建和融资轮说明，买家现在奖励本土生产就绪度，而不只是技术性能。官方项目放大了这一逻辑：Army
              的小型 UAS 需求、国会工业基础拨款和 Drone Dominance，都为可规模化、合规的本土供应商创造了直接需求信号。


              约束也同样真实。Fortune 提到规则和限制，包括围绕网络安全和中国无人机暴露的担忧；CRS 称 Congress 仍担心国内小型 UAS 制造基础的脆弱性。Breaking Defense
              展示了另一个约束：即便平台被选中，具体资金和数量仍可能未定，因此采购确定性滞后于任务紧迫性。市场定义也仍有问题。公开来源没有拆出 PDW
              的实际可服务市场，也没有拆出国防与公共安全之间的收入组合，这意味着任何自下而上的估值都需要管理层数据，而不能靠辛迪加 TAM
              幻灯片。正确结论不是市场小；而是市场很大、有政策支持，但如果没有私有运营数据，仍很难精确测算 PDW 可触达的细分市场。
