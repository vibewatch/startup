  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Performance Drone Works 销售的是一套紧密连接的操作栈，而不是一架独立四旋翼无人机。前端是 C100，PDW 同时以国防和公共安全配置销售；围绕它的是 CORE 任务规划和控制软件、PDW
              SIM 演练环境、Multi-Mission Payload 套件，以及正在扩张的可消耗打击产品线。放到客户工作流里，这意味着 PDW
              试图拥有从任务规划、操作员训练、飞行器起飞到载荷执行的完整顺序。国防工作流从小团队为 ISR、EW、通信中继、目标指示或打击选择载荷开始，在 CORE 中规划任务，然后把一架围绕模块化载荷更换设计的 C100 或
              AM-FPV 交给操作员，而不是围绕单一任务画像设计。公共安全工作流使用同样的机体逻辑，服务第一响应 ISR、快速监视以及货物或传感器携带。PDW SIM 和训练目录重要，因为它们说明 PDW
              把战备状态当成产品的一部分，而不是下游服务。对任务客户来说，这在战略上有吸引力，因为它降低了集成负担；但这也意味着尽调必须把机体、软件和训练主张放在一起评估，而不能当成孤立产品。
