      - number: '3.3'
        title: 定价、采购与分销：竞争更关乎工作流入口，而不是公开标价
        blocks:
          - type: paragraph
            body: >-
              已审阅公开记录没有披露足够的标价，无法搭出干净的同口径成本表，这种缺失本身就有信息量。横跨 PDW、Skydio、BRINC、Anduril、Shield 和 Red
              Cat，可见模式是以报价驱动的企业销售、合同工具或项目授予，而不是公布价目表。换句话说，竞争问题不是“谁的网站价格最低？”，而是“谁能最快从已经动起来的预算里、以最少内部摩擦被买走？”Skydio
              在这里有明确优势，因为 Blue UAS 状态与 GSA、DLA 入口配套，产品家族又覆盖公共安全、安防、巡检和国防。BRINC 与 Motorola 的联盟在市政响应中更具结构性力量，因为它把无人机部署变成
              APX 无线电、VESTA 911、CAD 和 RTCC 软件里的一个按钮。Red Cat 正通过上市公司可见度、盟友订单和项目化增长指引，搭建偏国防的路径。PDW 的反击点是本土制造叙事、Army
              牵引，以及比多数公共安全专业厂商更宽的任务栈。但如果没有透明 ASP，真正的承销问题是胜率、续约和打包经济性。在尽调拿到这些私有数字前，分销力量和工作流嵌入应比任何没有支撑的单系统更低成本说法权重更高。
