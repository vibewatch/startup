      - number: '8.2'
        title: 融资背景与可比公司组
        blocks:
          - type: paragraph
            body: >-
              PDW 的融资背景方向积极，但数字不透明。公司官方披露确认，2026 年 3 月 Series B 由 Ondas 领投，Hood River、Cedar Pine、Hanwha Asset Management
              和 Booz Allen Hamilton 参与；PDW 和 GovCon Wire 都把这轮描述为用于生产的扩张资本。但公司没有披露价格、股份类别、优先权条款或当前经营指标。Premier
              Alternatives 添加了 $730 million 的二级估值和 $235.8 million 的累计融资数字，但这组数据无法与公司官方“总融资超过 $110
              million”表述对齐。结果是，投资者能看到融资动能，却还不能判断市场是在把 PDW 定价为高溢价成长资产、适度加价的私营制造商，还是介于两者之间。


              公开可比公司进一步说明需要谦逊。AeroVironment 交易在约 5.7x 过去 12 个月收入，且披露积压订单、EBITDA 指引和多元化制造规模。Red Cat 和 Ondas 更接近 30-34x 过去
              12 个月收入，但两者都是上市公司、波动大、且每天都被明确定价；EHang 在一年急剧压缩后，以低得多的市值 / 收入比交易。这些数字不能给出一个干净的单一行业倍数。它们反而表明，PDW
              的价值高度取决于管理层最终会披露什么：收入质量、订单可见性，以及新工厂中有多少实际转化为可重复需求。在此之前，可比组只支持谨慎区间，不支持精确目标价。
