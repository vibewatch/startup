        title: 部署成熟度、制造就绪度与路线图
        blocks:
          - type: paragraph
            body: >-
              PDW 的成熟度论点建立在现场使用加工厂产能之上。现场证据方面，公司有多个公开证明点：Army Transformation in Contact 支持、2026 年 3 月 9-Mile
              验证活动、Crimson Tomahawk JTAC 演示，以及 2026 年 1 月激光指示试验。这些都是公司发布来源，因此它们能说明 PDW
              愿意公开背书什么，但不等同于独立任务效能验证。生产方面，证据对物理足迹的支撑强于对产出的支撑。Drone Factory 01 和 2025 年 8 月发布帖一致描述了一座位于 Huntsville、90,000
              平方英尺、工程和生产团队共址的设施；官方页面也反复提到峰值月产能为 350 架 C100 和 5,000 架 AM-FPV，而 Ondas 把叙事拉到年产 100,000 台。这支撑了 PDW
              正在为工业规模建设的说法，但 robotics.press 正确指出，吞吐仍是未解变量，因为公开出货或验收数字仍不存在。2025–2026 年路线图是活跃的，而不是概念性的：PDW SIM 于 2025 年 3
              月发布，Blue UAS 里程碑可追溯到 2023 年 12 月，CORE 1.4 于 2026 年 3 月推出，attritable multirotor 于 2026 年 3 月投产，2026 年 6 月
              Vanteon 交易指向更深的 RF 和通信雄心。因此，路线图在节奏上可信，但在独立测量结果上仍偏薄。
