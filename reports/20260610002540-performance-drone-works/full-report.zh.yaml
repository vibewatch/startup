      - number: '1.4'
        title: 里程碑与反向信号
        blocks:
          - type: paragraph
            body: >-
              本章层面的最佳时间线以 2018 年还是 2019 年成立这一分歧开头，随后围绕产品、治理和规模的里程碑很快变得清晰。PDW 的 C100 于 2023 年 12 月获准进入 DIU Blue UAS
              计划；2024 年 2 月，Dylan Hamm 晋升 CTO，公司宣布 $6.9 million USSOCOM Blackwave 合同；2024 年 6 月，Tony Thomas 出任董事会主席；2024
              年 8 月，Chuck McGraw 升任 CRO；2024 年 12 月，公司披露 Army C100 合同超过 $15.3 million。2025 年 8 月，公司在 Huntsville 开设
              90,000 平方英尺的 Drone Factory 01，表明 PDW 正从产品承诺转向生产经济性。公开记录里最主要的反向进展不是产品失败，而是劳工风险：National Labor Relations
              Board 显示，2025 年 11 月 20 日提交的一起案件仍未结案，指控涉及雇佣条款和条件变更以及胁迫性规则。这并不证明最终违规成立，但确实是一个法律和声誉问题，应带入后续尽调。到 2026
              年春，里程碑序列以 Series B 融资以及 Greenberg、Welch 加入董事会告一段落，说明 PDW 正从创始人色彩浓厚的初创治理，走向更制度化的国防制造公司形态，同时仍背负劳工、披露和集中度风险。
