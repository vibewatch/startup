          - type: callout
            title: 公共安全上行可见，但证据还没有
            body: >-
              PDW
              显然希望投资者和买方相信，公共安全可以成为第二个垂直市场；公司也已经搭好了支撑这一主张的营销和产品表面。问题是，保留证据仍停在具名机构、采购记录或行动后复盘之前。管理层拿出这些证据之前，公共安全应按管线可选项建模，而不是多元化装机基础。这个区分很重要，因为它会影响集中度风险，也会影响整体客户组合的耐久性评分。
