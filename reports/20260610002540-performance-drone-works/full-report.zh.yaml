      - number: '7.3'
        title: 伙伴、部件与供应链依赖风险
        blocks:
          - type: paragraph
            body: >-
              PDW 的模块化在商业上有吸引力，但也带来一张密集的依赖地图。C100 的价值主张依赖外部无线电、载荷、传感器、控制器和软件接口，它们必须保持兼容、可获得且合规。公开材料把平台连接到 Doodle Labs
              无线电、Next Vision EO/IR 载荷、UXV 地面控制站、TAK 网络，以及一长串第三方载荷选项。PDW 自己的保修进一步点明问题：许多第三方产品被明确排除在 PDW
              保修覆盖之外。实际结果是，已部署系统中一些最关键任务部件，可能在 PDW 直接保修伞之外失效。


              无线电链路是最清楚的例子。Doodle Labs 把自己呈现为强伙伴，其规模主张在方向上令人安心，但 PDW 仍依赖外部供应商提供一项重要的争夺环境能力。Doodle
              自己的供应链评论是有用的反向证据，因为它强调的正是投资者应担心的失效模式：单一来源瓶颈、海外依赖、以及无法按项目规模交付。这些不是抽象市场风险，而是能把一个看似合格的平台变成延误或不合规平台的具体压力。


              FCC 政策让依赖风险更尖锐。监管机构现在把无线电、传感器、控制器、电池和电机视为关键部件，因此采购资格可能在子系统层面失效。PDW 可能扎根美国国内，但 2027 年 1 月 1
              日之后豁免是否耐久，仍取决于今天并不公开的部件来源证据。投资者审查 BOM 级采购来源和备选供应商资格之前，PDW 的模块化既应被视为功能，也应被视为集中的集成风险。
