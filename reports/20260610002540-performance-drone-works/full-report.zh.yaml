  - id: TV005
    title: 打破投资逻辑与止损触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 披露缺口持续
        - 管理层在尽调中仍无法提供当前收入、积压订单和利润率数据
        - 任何高于老股交易标记价的溢价都缺乏可辩护依据，估值继续不透明
        - 不定价，也不领投
      - - 工厂利用率不及预期
        - 新设施在下一个预算周期内未转化为更广泛的重复订单
        - 支撑溢价可选性的核心规模化叙事被打破
        - 下调乐观情景假设，转向悲观情景区间
      - - 劳工 / 治理问题扩大
        - NLRB 案件恶化，或出现更多人员流程纠纷
        - 公司正试图扩大制造并消化收购，此时执行风险被抬高
        - 承销前要求完成治理整改
      - - 预算节奏滑坡
        - Army / Air Force 采购节奏放慢，或项目未能超出当前初始授予规模
        - 削弱需求转化，也让公司暴露在固定成本吸收风险下
        - 重新定价至基准或悲观区间低端
      - - 公开可比公司倍数压缩
        - 无人机 / 国防同业走向低个位数收入倍数
        - 如果没有经审计财务实力支撑，PDW 可声称的私募市场溢价会收窄
        - 用下行可比公司组重新承销私募价值
    notes: 这些触发因素设计为可用尽调输出和公开信号监测；重点看 PDW 能否把能力证明转化为持久商业证明。
    claimRefs:
      - CV021
      - CV024
      - CV027
      - CV029
      - CV042
      - CV046
      - CV048
      - CV049
      - CV050
  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前财务
        - 收入、毛利率、EBITDA 烧钱、积压订单和现金跑道
        - 这些指标决定 PDW 是高溢价成长资产，还是仍处证明阶段的资本密集型制造商
        - 向 CFO 索取管理层 KPI 材料或经审计报表
      - - 轮次条款与股权结构表
        - 投后估值、股价、工具类型、清算优先权，以及累计融资总额的历史对账
        - 没有条款，投资者无法评估稀释、下行情境下的优先级，或老股交易标记价到底保守还是激进
        - 向公司法律顾问索取融资文件
      - - 订单质量
        - 按项目拆分的积压订单、续约节奏，以及初始授予转化为更广泛采购的证据
        - 估值取决于可重复性，而不是孤立的合同标题
        - 向运营和财务索取预订订单与积压订单桥表
      - - 客户集中度
        - 按军种、项目办公室，以及单一客户或合同线拆分的风险暴露
        - 单一投标或狭窄买方集中会放大执行和预算风险
        - 要求提供集中度热力图和合同账龄分析
      - - 人员与流程风险
        - 未结 NLRB 案件的状态和可能解决路径，以及任何相关政策整改
        - 扩大工厂并整合 Vanteon，需要稳定运营和劳动力流程
        - 获取劳工法律顾问备忘录和 HR 整改计划
      - - 退出准备
        - 投行对话、战略方主动接触，或董事会批准的融资 / 退出工作流证据
        - 董事会新增成员和收购动作暗示公司更成熟，但目前还没有公开证据证明真正具备退出准备
        - 向 CEO 和董事会观察员索取当前流程图和顾问名单
    notes: 第一和第二项是定价硬性阻断项；其余索取项决定 PDW 是否配得上私募溢价倍数，还是只能留在观察名单。
    claimRefs:
      - CV003
      - CV019
      - CV021
      - CV023
      - CV024
      - CV027
      - CV045
      - CV050
