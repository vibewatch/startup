        - label: 公共安全
          values:
            - 低 — 只有产品和细分市场营销
            - 营销相邻市场
            - 低 — 只有能力主张
            - 低 — 无具名机构或续约
          note: 这是本章最大的证据质量缺口。
    approximationNotes: 矩阵单元格评估公开证据基础，不评估 PDW 真实内部客户质量。较低分数通常反映披露限制，而不是产品弱。
    claimRefs:
      - CU002
      - CU003
      - CU010
      - CU011
      - CU013
      - CU015
      - CU031
      - CU032
      - CU036
      - CU037
  - id: FR001
    title: 风险热力图 — Performance Drone Works
    type: matrix
    layout: standard
    summary: PDW 主要风险簇的剩余严重性与发生可能性；采购资格和组件合规风险落在最高严重性区域。
    data:
      columns:
        - 低可能性
        - 中可能性
        - 高可能性
      rows:
        - label: 高严重性
          values:
            - 出口分类意外变化
            - 劳动力成本上升；质量逃逸
            - FCC / Blue UAS 资格滑坡；Army 集中度
        - label: 中严重性
          values:
            - 载荷规格混淆
            - 第三方载荷保修缺口；BVLOS 摩擦
            - 无线电供应商依赖；工厂爬坡复杂度
        - label: 较低严重性
          values:
            - 网站隐私合规漂移
            - 董事会委员会成熟
            - 常规公共安全审批仍待完成
    approximationNotes: 可能性和严重性是投资者定性判断，锚定已获取的监管、法律、合同和供应商证据，而不是精算损失数据。
    claimRefs:
      - CR007
      - CR010
      - CR011
      - CR018
      - CR020
      - CR036
      - CR040
      - CR043
  - id: FR002
    title: 风险传导图 — 从资质到估值
    type: dag
    layout: wide
    summary: 有向图展示合规与规模风险如何通过订单、工厂利用率和估值支撑传导。
    data:
      nodes:
        - id: fcc-blue
          label: FCC / Blue UAS 摩擦
        - id: supplier
          label: 供应商瓶颈
        - id: army
          label: Army 集中度
        - id: quality
          label: 质量 / 可靠性缺口
        - id: orderflow
          label: 订单流放缓
        - id: factory
          label: 工厂利用不足
        - id: margin
          label: 利润率压力
        - id: valuation
          label: 估值支撑走弱
        - id: governance
          label: 治理信心下降
      edges:
        - from: fcc-blue
          to: orderflow
        - from: supplier
          to: orderflow
        - from: quality
          to: orderflow
        - from: army
          to: orderflow
        - from: orderflow
          to: factory
        - from: factory
          to: margin
        - from: margin
          to: valuation
        - from: quality
          to: governance
        - from: governance
          to: valuation
    approximationNotes: 边只编码定性因果流，不分配概率或现金流敏感度权重。
    claimRefs:
      - CR005
      - CR007
      - CR018
      - CR020
      - CR029
      - CR036
      - CR040
  - id: FR003
    title: 依赖图 — 任务关键外部依赖
