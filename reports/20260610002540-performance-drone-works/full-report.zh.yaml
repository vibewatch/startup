      - number: '8.3'
        title: 情景框架与否决触发器
        blocks:
          - type: paragraph
            body: >-
              由于 PDW 没有发布当前收入，情景框架必须基于里程碑，而不是精确电子表格。牛市情景假设，公司把当前验证转化为可重复采购：Drone Factory 01
              按宣传爬坡，陆军和空军授标扩展为更广的正式列装项目，Vanteon 集成也显著加强通信韧性。在这条路径下，超过 $900 million
              的估值可以成立，但前提是管理层之后展示的收入、积压订单和利润率画像，更接近高溢价上市可比公司，而不是不透明风投标记。


              基准情景更保守，也更符合当前证据。它假设已观察到的二级市场指示在方向上正确，PDW 继续赢得防务工作，但制造扩产、整合收购、以及把测试转化为经常性订单都需要时间。这个框架支持约 $550-750 million
              的当前承销区间；它足够接近二级标记，可以支持继续跟踪这个名字，但在没有私下披露的情况下，还不足以支持穿透该标记付款。


              熊市情景重要，因为下行很容易勾勒。未结 NLRB 事项、一份投标的合同集中，以及预算节奏或倍数压缩的可能性，都可能迅速压低私营估值。如果劳动摩擦持续、预算延后，或上市无人机可比公司向更低倍数重估，$250-400
              million 的结果就变得合理。因此，否决触发器必须聚焦披露失败、订单转化和组织执行，而不只是头条融资。
