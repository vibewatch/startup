        - $730M 估值；声称累计融资 $235.8M
        - 本章找到的唯一公开 PDW 专属价格信号
        - 二级来源，不是已披露的一手轮次价格，且与公司所称累计融资冲突
      - - AeroVironment (AVAV)
        - $1.61B TTM 收入；$9.13B EV
        - ~5.7x EV/revenue；上市、盈利规模和积压订单可见度
        - 美国国防无人机制造规模化和项目纪律的最佳锚点
        - 比 PDW 大得多、更多元，也更透明
      - - Red Cat (RCAT)
        - $54.57M TTM 收入；$1.61B EV
        - ~29.5x EV/revenue；有 2026 10-K 的上市战术无人机可比公司
        - 规模更接近成长阶段无人机专业公司，可用于检查高溢价倍数上限
        - 波动很大，受公开市场情绪影响
      - - Ondas (ONDS)
        - $96.60M TTM 收入；$3.32B EV
        - ~34.4x EV/revenue；上市国防通信 / 无人机邻近公司
        - 证明国防无人机邻近标的仍可能获得泡沫化估值的有用证据
        - 业务组合比 PDW 更宽，且仍高度投机
