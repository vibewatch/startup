      - number: '8.4'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              有早期迹象显示，PDW 想变得更适合退出：董事会升级，公司收购了能增强 RF
              能力的人才，并且越来越把自己呈现为一个垂直整合的美国工业平台，而不是单架无人机初创公司。这些对未来战略出售是有用信号，也提高了后期私募融资的可信度。但它们仍只是信号，不是证明。没有公开来源显示银行家参与、正式
              IPO 准备流程、收入耐久性，或公开市场投资者会要求的审计指标。即便是战略出售，最相关买方也会关心同样缺失的信息：收入集中度、利润率画像、营运资本需求、积压订单质量，以及新工厂足迹的真实经济性。


              因此，最终尽调要求直接且不可谈判。第一，管理层必须披露当前财务图景：收入、毛利率、EBITDA
              消耗、积压订单和现金续航期。第二，公司需要对齐融资历史和优先权结构，让投资者理解稀释和下行优先级。第三，投资案例需要客户和合同细节，说明当前需求中有多少可重复，而不是机会主义。第四，未结 NLRB
              事项和更广泛的人事流程风险需要被直接处理。在这些要求得到回答之前，PDW 仍是一家值得关注的有吸引力公司，但不是一个能仅凭公开证据自信承销的价格。
