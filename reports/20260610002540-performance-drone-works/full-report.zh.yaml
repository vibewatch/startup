      - number: '7.5'
        title: 人员、治理与执行风险
        blocks:
          - type: paragraph
            body: >-
              PDW 仍离创始故事足够近，因此领导层集中度重要。公司公开材料持续把业务呈现为由退伍军人、无人机飞手和操作员打造，并受战场使用场景塑造；这种操作员优先身份显然是商业化优势的一部分。同时，公开记录显示 2025
              年末到 2026 年之间出现了实质性的高管角色转换：Ryan Gury 在官方合同公告中从 CEO，转为 2026 年领导层页面上的 Chief Innovation Officer；James Slider
              则成为 CEO。领导层交接可能健康，尤其当公司从产品创造转向工业执行时，但在公司同时筹集大额增长资本并开设大型工厂的背景下，投资者不应把它当成噪音。


              治理深度在改善，但仍显年轻。2026 年 5
              月新增董事带来了真实的金融和软件运营经验，领导层页面现在也包括总法律顾问和比早期公司材料更宽的职能班底。话虽如此，关于继任规划、内部控制和合规运营节奏的公开证据仍然薄弱。未结 NLRB
              事项进一步说明，人员规模和管理纪律扩张时，流程完全成熟之前就可能产生摩擦。


              招聘页面显示，PDW
              仍在硬件、软件、AI、制造和运营等多个领域扩张。快速招聘可以解决瓶颈，但也会提高流程采用不均、文件漂移和质量漏网的概率。对一家销售战场系统并承诺快速迭代的公司来说，执行错误的容忍度很低：单个质量问题、供应商失误或治理失足，都可能迅速变成采购叙事，而不是孤立的运营问题。
