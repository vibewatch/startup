  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              要看懂 PDW 的客户故事，先要把公司对外卖的叙事和证据真正证明的东西拆开。官方页面清楚指向两类付费方：防务组织和公共安全机构。防务端的买方画像很具体——陆军部队、空军战术操作员、盟国部委、JTAC
              小组，以及需要 ISR、电子战、打击支援、通信中继或 GPS 拒止环境导航的政府操作员。公共安全也是一个可见板块，但证据质量明显弱一些。PDW 有专门的公共安全页面，也有 C100
              的公共安全配置；不过保留的来源并没有点名任何警察、消防或应急管理客户已经在生产环境中使用该系统。因此，公共安全叙事应当按管线或相邻机会处理，不能视为已经验证的装机基础。


              客户组合里证据更扎实的部分，是围绕 C100、培训体系和合作伙伴生态搭起来的防务渠道。PDW 发布了结构化培训，展示了覆盖光学、通信、EW
              和控制系统的广泛合作伙伴名单，并营销一种平台架构：它可以支持不同任务，而不必重新设计机身。这些因素会影响客户分析，因为军事用户关心互操作性、培训吞吐量和载荷灵活性，而这些因素能降低部署摩擦。实际来看，PDW
              不像单一 SKU 的无人机卖家，更像一家正在成长的防务项目供应商；目前最强的证明，来自采购方能够指向演训、列装和具名组织的场景。
