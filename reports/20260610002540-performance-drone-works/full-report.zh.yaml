      - number: '6.3'
        title: 耐久性、扩张与集中度
        blocks:
          - type: paragraph
            body: >-
              到耐久性这里，证据集就薄得多。公开材料足以支持对采用动能的正面判断——陆军重复授标、嵌入式现场支持、面向现有客户的新载荷发布、制造扩产——但不足以用正常 SaaS
              或防务项目严谨度为客户质量背书。保留来源没有披露客户数量、NRR、GRR、流失率、续约率、积压订单或头部客户集中度。因此，本章可以说明 PDW
              有重复政府需求，但不能证明收入是否集中在一两个项目里、早期授标是否在同一单位转化为重复采购，或公共安全需求是否正在成为耐久的第二增长腿。


              最可能的扩张路径，是在防务端更深采用，而不是立即做垂直行业多元化。载荷升级、培训、伙伴集成和制造产能，都支撑 PDW 在 Department of War
              与盟友流程里先落地、再扩张。同时，风险面也真实存在。陆军需求似乎是投资判断的核心，陆军现在跑的是五系统组合而非单一供应商通道，PDW
              的保修条款也明确限制补救、覆盖预期和服务连续性。上述因素并不推翻客户故事，但会改变评分方式：PDW 有真实的防务采用证据和可信扩张抓手；只是客户耐久性和集中度仍取决于尽调，因为公开记录还没有给出组合层面的经济性。
