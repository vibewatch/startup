chapter:
  number: 6
  title: Customers
  summary: "Kairos Power already has unusually strong named customer proof for a pre-commercial reactor company: Google is the anchor end customer, TVA is the first disclosed utility offtaker, and the first regional use case is tied to specific data-center loads in Tennessee and Alabama. The weakest parts of the public record are not customer quality but customer breadth and monetization visibility. Later plants remain milestone-gated, Duke\u2019s framework is adjacent rather than plant-specific, and public economics are sparse. Net: strong strategic validation, still incomplete durability and diversification proof."
