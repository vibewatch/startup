  rows:
  - - Google data-center load
    - Google / Google data-center operations / Google through utility-linked procurement
    - 24/7 carbon-free power and clean-energy attributes for hyperscale computing loads
    - 500 MWe master agreement; specific TN and AL facilities named
    - Anchor demand source with repeat-deployment potential
    - No public pricing, duration, or take-or-pay detail
  - - TVA utility offtake
    - TVA / TVA grid + Google end load / TVA settlement layer
    - Buy Hermes 2 electricity and route attributes through TVA system
    - Up to 50 MW Hermes 2 PPA; first U.S. utility Gen IV PPA
    - Provides bankable utility counterparty and grid-integration path
    - Only one disclosed plant-specific contract so far
  - - Carolinas large-load tariff participants
    - Google, Amazon, Microsoft, Nucor / large C&I loads / each participant under Duke tariff framework
    - Support clean-firm-power additions via tariff innovation
    - Signed MOUs with Duke Energy in 2024
    - Shows adjacent buyer appetite outside TVA service territory
    - Not a Kairos-specific purchase agreement
  - - Future hyperscaler buyers
    - Likely large tech buyers / data centers / corporate or utility-mediated payment
    - Replicable clean-firm-power procurement if Hermes 2 succeeds
    - No named non-Google buyers in retained public sources
    - Large TAM if model proves repeatable
    - No public conversion evidence yet
  - - Future industrial or public-power buyers
    - Utility or industrial buyers / power-intensive operations / TBD
    - Potential clean-firm-power or industrial-energy use cases
    - Only implied in public materials, not named as Kairos customers
    - Could diversify beyond one hyperscaler
    - No public named contracts or pilots beyond Google-TVA
  notes: "Segments are defined by buyer-user-payer structure because Kairos\u2019 first commercial pathway splits demand, utility offtake, and reactor operation across separate entities."
