  evidenceGaps:
  - type: missing-source
    severity: material
    topic: contract-economics
    missingEvidence: Public sources do not disclose contract duration, price formula, collateral, termination rights, or take-or-pay structure for the Google-TVA-Kairos agreements.
    whyItMatters: Without economics, strong named customer proof cannot be converted into fully underwritten revenue quality or project-finance confidence.
    diligencePath: Request the Hermes 2 PPA summary, key commercial terms from the master development agreement, and any milestone-payment or option schedule for later reactors.
    relatedQuestionRefs:
    - QU009
    - QU021
    relatedTableRefs:
    - TU003
    - TU004
  - type: missing-source
    severity: material
    topic: retention-and-durability
    missingEvidence: No public source shows churn, renewals, customer satisfaction, or any delivered-power cohort data because commercial operations have not started.
    whyItMatters: The difference between strategic validation and durable customer economics is one of the biggest remaining gaps in the Kairos underwriting case.
    diligencePath: Request customer-governance cadence, performance thresholds, renewal or option mechanics, and any steering-committee materials with Google or TVA.
    relatedQuestionRefs:
    - QU008
    - QU019
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: medium
    topic: customer-diversification
    missingEvidence: Public materials identify Google and TVA clearly but do not show a broader roster of independent Kairos buyers by region, sector, or utility partner.
    whyItMatters: Google concentration is manageable only if Kairos can convert the first template into additional named customers before capital needs outrun demand certainty.
    diligencePath: Review the business-development pipeline by utility, hyperscaler, industrial customer, and geography, including probability-weighted conversion timing.
    relatedQuestionRefs:
    - QU023
    - QU025
    relatedTableRefs:
    - TU001
    - TU005
  - type: conflicting-data
    severity: medium
    topic: tariff-led-expansion-path
    missingEvidence: Duke and Google show adjacent procurement innovation, but public evidence does not prove that tariff experiments in other service territories will convert into Kairos deployments.
    whyItMatters: Investors could overread general large-load tariff experimentation as direct Kairos customer diversification.
    diligencePath: Track regulator approvals, identify any technology-specific clauses, and ask management which non-TVA procurement pathways are truly active for Kairos plants.
    relatedQuestionRefs:
