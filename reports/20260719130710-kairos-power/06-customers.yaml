- id: adoption-trajectory-and-named-proof
  title: Adoption trajectory and named customer proof
  body: "The adoption trajectory is credible because it steps from a broad framework to a plant-specific contract. In October 2024, Google and Kairos signed a 500 MWe master development agreement through 2035. In August 2025, that broad framework narrowed into a disclosed, binding Hermes 2 pathway through TVA for up to 50 MW and a 2030 operating target. That sequence is important: it shows that Kairos has moved from conceptual corporate interest to a named utility offtake arrangement tied to a specific plant, a specific region, and specific end-use loads.\n\nAt the same time, the named proof set is still narrow. Google and TVA are real and unusually high-quality counterparties, but later fleet units remain milestone-gated and Duke\u2019s 2024 collaboration is better read as evidence of future procurement architecture than as a Kairos customer conversion. The chapter therefore supports a strong conclusion on customer quality and a weaker one on customer breadth. Kairos has one of the best\
    \ public named-customer proof packages in advanced nuclear, but it does not yet have a diversified public roster."
  claimRefs:
  - CU003
  - CU004
  - CU005
  - CU008
  - CU014
  - CU015
  - CU017
  - CU018
  - CU019
