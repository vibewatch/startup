- id: retention-durability-and-monetization-visibility
  title: Retention, durability, and monetization visibility
  body: "Public retention evidence is almost entirely structural, not empirical. Nuclear power contracts should be sticky if they reach operation: the assets are long lived, site specific, and deeply integrated with utility and customer planning. Google\u2019s orderbook concept and TVA\u2019s role as a public-power utility also support a plausible repeat-purchase case. But public sources still do not show contract duration, renewal mechanics, churn, NRR, minimum-take obligations, or termination rights. That means the retention case remains an inference from market structure and counterparties rather than a measured cohort history.\n\nMonetization transparency is similarly incomplete. POWER reported time-of-day fixed market pricing for the TVA deal, but neither the public pricing stack nor the risk-sharing waterfall is visible. Investors therefore have to separate two ideas that are often blurred together: Kairos has already won very strong strategic customer validation, but it has not yet\
    \ provided enough public disclosure to treat that validation as fully underwritten revenue quality. The right reading is that customer durability could be excellent, but the public record cannot prove it yet."
  claimRefs:
  - CU016
  - CU021
  - CU022
  - CU024
  - CU025
  - CU035
  - CU036
  tableRefs:
  - TU004
  figureRefs: []
- id: expansion-loops-and-concentration-risk
  title: Expansion loops and concentration risk
  body: "Kairos\u2019 best expansion argument is that its first customer is exactly the kind of buyer who can justify repeated deployments. Google keeps reporting rising AI-driven electricity demand and record clean-energy procurement, and it has already backed both a fleet-style agreement with Kairos and tariff innovation with Duke in another region. TVA\u2019s participation adds a second important ingredient: a utility-mediated way to deliver clean firm power into the grid rather than relying solely on exotic behind-the-meter structures. If Hermes 2 works, the commercialization loop could become self-reinforcing\u2014better economics, more utility willingness, and more hyperscale interest.\n\nThe main public risk is concentration. Google is still the only named end customer for the Kairos fleet, and Duke is only a framework partner. DOE\u2019s own writing on nuclear-powered data centers also warns that new reactors take time, cost a lot, and face metering and fuel-chain hurdles. So the\
    \ upside is real, but the path is neither diversified nor de-risked enough to treat as broad-based customer adoption today. Kairos has crossed the proof-of-serious-interest line; it has not yet crossed the proof-of-broad-market-conversion line."
