sections:
- id: anchor-customers-and-buyer-logic
  title: Anchor customers, buyer logic, and geography
  body: "Kairos\u2019 customer story is unusually concrete for a pre-commercial reactor company, but it is not a normal one-customer-one-contract utility sale. The first visible commercial structure has three layers. Google is the demand anchor: it wants firm, carbon-free electricity and clean-energy attributes for specific data-center operations. Kairos is the developer-operator that will build and run the plants. TVA is the utility offtaker and grid-delivery layer that will buy Hermes 2 output and move those attributes through its system. That separation matters because it makes Kairos look less like a merchant reactor vendor and more like a utility-enabled procurement platform for hyperscale loads.\n\nPublic geography is also more specific than in most advanced-nuclear customer stories. The 2025 collaboration does not just mention data centers in the abstract; it points to Google operations in Montgomery County, Tennessee, and Jackson County, Alabama. That specificity strengthens the\
    \ buyer-user-payer mapping and reduces the risk that the customer narrative is purely aspirational. The weakest point is breadth, not clarity. Public evidence shows one extremely strong end customer and one extremely important utility intermediary, but not yet a broad portfolio of independent paying buyers across regions or use cases."
  claimRefs:
  - CU001
  - CU002
  - CU006
  - CU007
  - CU009
  - CU010
  - CU013
  - CU031
  - CU032
  tableRefs:
