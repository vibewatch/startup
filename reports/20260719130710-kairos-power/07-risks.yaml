  evidenceGaps:
  - type: missing-source
    severity: material
    topic: project-cost-and-contingency
    missingEvidence: Public sources do not disclose the revised Hermes 1 and Hermes 2 budget, contingency draw, or cost-to-complete after the schedule extension.
    whyItMatters: Schedule slips are much easier to contextualize when investors can see whether they are being absorbed inside contingency or creating new capital needs.
    diligencePath: Request the latest integrated project budget, contingency register, monthly earned-value reporting, and variance explanations since the extension filing.
    relatedQuestionRefs:
    - QR004
    - QR028
    relatedTableRefs:
    - TR001
    - TR005
  - type: missing-source
    severity: material
    topic: fleet-scale-fuel-bridge
    missingEvidence: The public record explains Hermes 1 fuel allocation and some commercial HALEU ambitions, but not a dated bridge to fleet-scale HALEU and TRISO throughput for multiple commercial units.
    whyItMatters: A company can win customers and permits yet still slip materially if fuel timing is not synchronized with plant deployment.
    diligencePath: Obtain fuel-volume assumptions by plant, Centrus/BWXT/Kairos responsibilities, qualification milestones, and fallback options if commercial HALEU timing moves right.
    relatedQuestionRefs:
    - QR008
    - QR024
    relatedTableRefs:
    - TR002
    - TR003
  - type: missing-source
    severity: medium
    topic: counterparty-commitment-depth
    missingEvidence: Public customer disclosures do not show option mechanics, termination rights, or stress-sharing obligations among Google, TVA, and Kairos if milestones move.
    whyItMatters: With concentration this high, counterparty flexibility matters almost as much as counterparty prestige.
    diligencePath: Review the master development agreement, Hermes 2 PPA summary, steering-committee rights, and any commercial triggers for later-unit conversion.
    relatedQuestionRefs:
    - QR018
    - QR020
    relatedTableRefs:
    - TR003
    - TR005
  - type: conflicting-data
    severity: medium
    topic: future-regulatory-path-efficiency
    missingEvidence: "The part 53 framework is a clear structural positive for the sector, but public sources do not show how much it will shorten or simplify Kairos\u2019 actual future licensing path relative to existing frameworks."
    whyItMatters: Investors may over-credit a new rule as immediate de-risking when practical licensing still turns on project-specific reviews and amendments.
    diligencePath: Ask management which future applications would use part 53, what workload it actually avoids, and where case-by-case uncertainty remains.
    relatedQuestionRefs:
    - QR002
    - QR023
    relatedTableRefs:
    - TR001
