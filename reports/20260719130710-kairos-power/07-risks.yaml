  plannedFigures:
  - name: Risk heatmap
    requirement: Impact, likelihood, mitigation maturity, or residual severity.
    acceptedTypes:
    - matrix
  - name: Risk transmission map
    requirement: How risks flow into revenue, customers, margin, financing, operations, and valuation.
    acceptedTypes:
    - dag
  - name: Dependency map
    requirement: Critical partners, suppliers, platforms, regulators, facilities, or financing dependencies.
    acceptedTypes:
    - dag
  evidenceStrategy:
  - Adverse/disconfirming research is mandatory.
  - "Official \u2014 trust/security/privacy/terms/DPA/compliance/status/incident pages, certifications, recall and safety pages."
  - "Primary sources \u2014 regulators, court records, clinical/regulatory databases, patent/IP offices, environmental agencies, sanctions/export-control sources."
  - "Independent \u2014 adverse reporting, security incident coverage, customer complaints, analyst risk notes, comparable risk factors."
  qualityBar:
  - Cite evidence and mitigation for every top risk; never assign severity from intuition.
  - Define monitorable kill criteria or diligence paths for unresolved risks.
  - When litigation, regulatory posture, certifications, incidents, safety, or concentration cannot be confirmed, record exact diligence path.
  - Include thesis-break triggers tied to measurable operating, regulatory, customer, financial, or management events.
sections:
- id: regulatory-and-legal-risk
  title: Regulatory and legal risk is already realized in the schedule, not merely hypothetical in principle
  body: "The highest-confidence risk in the public record is regulatory schedule slippage. Kairos did not merely warn that first-of-a-kind reactor construction could be slow; it already had to obtain an NRC amendment extending the Hermes 1 completion deadline from the end of 2026 to April 2029. The NRC\u2019s own safety evaluation makes the reason plain: developmental problems attributable to the first-of-a-kind nature of the facility, plus more complex site-preparation work than expected. That matters because it converts a generic startup risk into a timestamped precedent. The company can point to strong regulatory engagement, but it can no longer claim an unslipped path to first operations.\n\nThe mitigating side is also real. The same NRC package says the amendment did not authorize new activities, found no significant hazards implication, and carried a finding of no significant environmental impact. Hermes 2 also has a construction permit and a transparent document trail. So the legal\
    \ and regulatory picture is not one of denial or hostile posture; it is one of cooperative but exacting oversight. That distinction matters for underwriting. Kairos looks better than companies stalled by licensing opacity, but worse than a clean on-time development story. Additional date slippage would now be a major negative signal because the \u201Cfirst delay\u201D has already happened."
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  - CR009
  - CR037
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: fuel-construction-and-operational-risk
  title: 'Fuel, construction, and operational risk cluster around the same bottleneck: too many first-of-a-kind systems must mature together'
  body: "The core operational risk is not one isolated engineering question but the simultaneous maturation of reactor construction, fuel supply, fuel fabrication, and grid-integration timing. Hermes uses HALEU-bearing TRISO pebbles, and DOE explicitly says domestic HALEU is not yet available from suppliers at the scale advanced-reactor developers ultimately need. Kairos has sensibly reduced near-term risk by securing DOE-sourced HALEU for Hermes 1, but that is a bridging move rather than proof of a broad commercial market. ANS and DOE materials make clear that the allocation program exists precisely because the supply chain is incomplete.\n\nThis is where execution complexity compounds. Centrus is aiming to move to larger-scale HALEU production by 2029, BWXT is only now exploring commercial TRISO manufacturing with Kairos, and DOE still frames allocation as an ongoing process. Those facts do not mean Kairos will fail; they do mean that timing mismatches remain plausible. Add DOE\u2019s\
    \ own warning that first-of-a-kind data-center reactors are expensive and slow to build, and the operational risk stack becomes clear: even if reactor physics works, the commercial path can still slow on fuel, fabrication, or construction-learning loops."
  claimRefs:
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR018
  - CR019
