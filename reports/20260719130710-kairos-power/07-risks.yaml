  - - Fuel timing mismatch
    - HALEU and TRISO readiness
    - DOE allocation disruption, Centrus commercial delay beyond 2029, or missing fuel-fabrication milestones
    - Assume fleet expansion delays and higher financing needs.
  - - Customer concentration
    - Google / TVA commitment strength
    - No conversion of later units, visible contract retrenchment, or deterioration in regional delivery economics
    - Treat customer proof as single-project validation rather than fleet validation.
  - - FOAK cost blowout
    - Public or diligence cost evidence
    - Capex escalation or oversight failures that begin to resemble NuScale/UAMPS precedent
