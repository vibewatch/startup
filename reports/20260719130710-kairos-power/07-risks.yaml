company:
  name: Kairos Power
chapter:
  number: 7
  title: Risks
  summary: "Kairos Power\u2019s risk profile is not dominated by one fatal flaw; it is dominated by the need to keep several first-of-a-kind systems synchronized. The most important public risk is already realized schedule delay at Hermes 1. The next tier is fuel and supply-chain timing, especially HALEU and TRISO scale-up. Customer concentration is also real because Google and TVA carry most of the public commercial signal. NuScale\u2019s UAMPS failure provides the clearest external precedent for what happens when FOAK nuclear commercialization outruns cost, subscription, and oversight discipline. Net: high residual risk, tempered by unusually strong regulatory progress and named counterparties."
  contentRequirements:
  - Severity-ranked risks with likelihood, impact, mitigation maturity, residual exposure, and investment implication.
  - "Regulatory/legal risk \u2014 licenses, approvals, litigation, enforcement, IP, privacy, environmental/safety."
  - "Operational risk \u2014 supply chain, manufacturing, logistics, reliability, outages, recalls, safety, facilities, labor."
  - "Partner/dependency risk \u2014 supplier, distributor, cloud/platform, capital provider, regulator, key customer concentration."
  - "Financial/model risk \u2014 burn, capital intensity, credit/loss exposure, fraud, working capital, margin compression."
  - Mitigations, monitoring indicators, thesis-break triggers, and diligence asks.
  plannedTables:
  - name: Regulatory / legal risk register
    requirement: rule/license/case, jurisdiction, status, likelihood, severity, mitigation, residual exposure, diligence path; rows ordered by severity.
    enumeration: true
    expectedMinRows: 3
  - name: Operational / quality / security risk register
    requirement: failure mode, likelihood, severity, mitigation maturity, residual exposure, unresolved gap; rows ordered by severity.
  - name: Partner / dependency risk register
    requirement: dependency, counterparty, role, concentration, failure scenario, severity, mitigation, residual exposure; rows ordered by severity.
  - name: People / execution risk register
    requirement: role/function, dependency or gap, likelihood, severity, mitigation, diligence path; rows ordered by severity.
  - name: Mitigation and kill criteria table
