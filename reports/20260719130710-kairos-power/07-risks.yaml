  - - Tariff and market-structure backlash
    - Ratepayer / regulator response
    - Evidence that future large-load nuclear procurement models cannot isolate costs or win approvals
    - Reduce expectations for replication beyond TVA territory.
  notes: The table emphasizes triggers that can be observed before full commercial operation, which is critical for a late-stage but still pre-revenue reactor company.
