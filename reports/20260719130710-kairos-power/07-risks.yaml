  - TR003
  figureRefs:
  - FR002
- id: financial-model-people-and-kill-criteria
  title: The most important downside precedent is NuScale, and the most important mitigation is disciplined milestone-gating
  body: "The best external stress test for Kairos\u2019 risk profile is not a generic nuclear cautionary tale but the documented failure path of NuScale\u2019s Carbon Free Power Project. DOE\u2019s inspector general says critical risks were not effectively evaluated or monitored, front-loaded public cost share put taxpayer money at risk, and the program still failed to reach its core objective. UAMPS and CATF add the commercial lesson: subscription weakness and poor first-customer fit can sink a reactor program even after years of regulatory progress. This is highly relevant to Kairos because it, too, is attempting to bridge demonstration learning into commercial offtake while relying on strong counterparties and public-private support.\n\nKairos\u2019 mitigation case is that it is trying to learn before scaling. Hermes 1, Hermes 2, DOE fuel support, BWXT collaboration, and the Google/TVA rollout all fit an iterative, milestone-gated strategy. That is directionally better than leaping directly\
    \ into a large FOAK commercial plant. But it is also capital intensive and time consuming, and it increases the importance of people, supply, and sequence discipline. The right diligence posture is therefore to monitor a short kill-criteria list very closely: further schedule slip, fuel timing mismatch, deterioration in customer commitment, or evidence that cost and complexity are tracking the NuScale playbook more than the Kairos learning-playbook."
  claimRefs:
