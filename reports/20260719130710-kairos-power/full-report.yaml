  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Kairos’ highest residual exposure clusters where schedule, fuel supply, and counterparties meet first-of-a-kind
      commercialization timing.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Hermes schedule slippage
          values:
            - label: high
              tone: negative
              detail: A major date extension has already occurred.
            - label: high
              tone: negative
              detail: Further slip delays customer revenue and confidence.
            - label: medium
              tone: warning
              detail: Iterative development helps learning but not speed.
            - label: high
              tone: negative
              detail: Already-realized delay keeps residual risk elevated.
        - label: HALEU / TRISO fuel chain
          values:
            - label: high
              tone: negative
              detail: Domestic supply remains incomplete and commercial scale is still forming.
            - label: high
              tone: negative
              detail: Fuel timing can gate both Hermes and later fleet units.
            - label: medium
              tone: warning
              detail: DOE allocations and partnerships help near-term needs.
            - label: high
              tone: negative
              detail: Bridging measures do not equal a mature market.
        - label: Customer / utility concentration
          values:
            - label: medium-high
              tone: warning
              detail: Google and TVA are strong but few in number.
            - label: high
              tone: negative
              detail: A small number of counterparties carry outsized signaling weight.
            - label: medium
              tone: warning
              detail: Named proof is strong but diversification is thin.
            - label: medium-high
              tone: warning
              detail: Residual exposure falls only when more buyers are public.
        - label: FOAK cost and commercialization precedent
          values:
            - label: medium
              tone: warning
              detail: NuScale shows the failure mode clearly.
            - label: critical
              tone: negative
              detail: Cost blowouts can destroy project bankability before operation.
            - label: medium
              tone: warning
              detail: Milestone gating is better than full leap, but not sufficient alone.
            - label: high
              tone: negative
              detail: Capital intensity remains a core thesis risk.
        - label: Tariff / market-structure backlash
          values:
            - label: medium
              tone: warning
              detail: Data-center load debates are intensifying.
            - label: moderate
              tone: warning
              detail: Future replication could be slowed even if TVA works.
            - label: low-medium
              tone: neutral
              detail: Utility-mediated structures may still solve some issues.
            - label: medium
              tone: warning
              detail: Residual risk is meaningful outside the TVA-specific pathway.
