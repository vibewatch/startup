      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              At the core of Kairos’ public architecture is the KP-FHR: a fluoride-salt-cooled high-temperature reactor
              using TRISO annular pebble fuel, disclosed as a 150 MWe commercial plant made of two 75 MWe units. The
              company’s public materials and NRC records show that this front-end specification is paired with a
              back-end operating model built around iterative design-build-test cycles, vertical integration, and
              smaller learning assets. Hermes 1 provides non-electric demonstration of the core technology, while Hermes
              2 adds a power-producing bridge asset with two 35 MWth reactors and a shared power-conversion system.


              The technology story is therefore legible in a way many advanced-reactor stories are not. Buyers and
              investors can see how reactor design, module fabrication, site construction, and power conversion connect.
              Even so, the strongest evidence is still architectural and programmatic, not operational. Public materials
              describe what Kairos plans to build and how it intends to build it; they do not yet provide runtime fleet
              data, achieved uptime, or long-duration operating proof.
