      - number: '1.4'
        title: Milestones, Capital Signals, and Execution Context
        blocks:
          - type: paragraph
            body: >-
              Kairos has moved well beyond concept-stage signaling. The milestone chain is unusually concrete for a
              private advanced-reactor company: Hermes permit approval in December 2023; DOE’s milestone-based
              Technology Investment Agreement in February 2024; Hermes construction start in July 2024; the Google 500
              MW agreement in October 2024; Hermes 2 permits in November 2024; nuclear safety-related construction in
              2025; ORNL fuel-and-materials collaboration in early 2026; and Hermes 2 groundbreaking in April 2026. The
              later Google-Kairos-TVA arrangement is especially important because it converts a generic future orderbook
              into a defined first deployment on the TVA grid at up to 50 MW, directly linked to Google data-center
              demand in Tennessee and Alabama.


              Those milestones materially de-risk the company compared with an advanced-reactor developer that has only
              paper designs or policy support. Even so, the public record also preserves the key caveat: first-of-a-kind
              advanced-nuclear projects still face uncertain preconstruction costs, long timelines, and sponsor
              hesitation. TechCrunch explicitly notes that a 2030 first reactor and 2035 fleet schedule is aggressive in
              nuclear terms, while Utility Dive’s NIA coverage underscores that early project sponsors still want more
              backstops before fully committing. Public-company-style capital transparency is not yet present either.
              Retained market-data pages reveal investor names and round chronology, but not a verifiable current
              post-money valuation, revenue run rate, or full cap table. The company has momentum; it does not yet have
              full public financial visibility.
