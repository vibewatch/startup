  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case for Kairos is stronger than the average advanced-nuclear story because the company
              already has three things that matter a great deal in this sector: a named hyperscale buyer, a named
              utility offtaker, and a visible first-plant path. Google’s multi-unit orderbook, TVA’s Hermes 2 PPA, DOE’s
              fuel support, and Kairos’ iterative development model collectively create a commercialization narrative
              that is unusually legible for a private reactor company. The customer demand backdrop is also real. Google
              continues to report large and growing clean-power needs tied to AI and data-center scale, which means
              Kairos is not trying to sell into an imaginary future market.


              The anti-thesis is not that the market is fake or that the technology lacks interest. It is that the
              company remains hard to price precisely from public evidence. The schedule has already slipped at Hermes
              1, the fuel bridge to fleet scale is incomplete, contract economics are private, and the downside
              precedent from NuScale/UAMPS is too relevant to ignore. In other words, Kairos may be one of the strongest
              private advanced-nuclear franchises, but the public record still supports a milestone-sensitive
              optionality story more than a clean value-underwriting story.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
