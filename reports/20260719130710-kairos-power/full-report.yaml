      - number: '6.3'
        title: Retention, durability, and monetization visibility
        blocks:
          - type: paragraph
            body: >-
              Public retention evidence is almost entirely structural, not empirical. Nuclear power contracts should be
              sticky if they reach operation: the assets are long lived, site specific, and deeply integrated with
              utility and customer planning. Google’s orderbook concept and TVA’s role as a public-power utility also
              support a plausible repeat-purchase case. But public sources still do not show contract duration, renewal
              mechanics, churn, NRR, minimum-take obligations, or termination rights. That means the retention case
              remains an inference from market structure and counterparties rather than a measured cohort history.


              Monetization transparency is similarly incomplete. POWER reported time-of-day fixed market pricing for the
              TVA deal, but neither the public pricing stack nor the risk-sharing waterfall is visible. Investors
              therefore have to separate two ideas that are often blurred together: Kairos has already won very strong
              strategic customer validation, but it has not yet provided enough public disclosure to treat that
              validation as fully underwritten revenue quality. The right reading is that customer durability could be
              excellent, but the public record cannot prove it yet.
