      - number: '6.4'
        title: Expansion loops and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Kairos’ best expansion argument is that its first customer is exactly the kind of buyer who can justify
              repeated deployments. Google keeps reporting rising AI-driven electricity demand and record clean-energy
              procurement, and it has already backed both a fleet-style agreement with Kairos and tariff innovation with
              Duke in another region. TVA’s participation adds a second important ingredient: a utility-mediated way to
              deliver clean firm power into the grid rather than relying solely on exotic behind-the-meter structures.
              If Hermes 2 works, the commercialization loop could become self-reinforcing—better economics, more utility
              willingness, and more hyperscale interest.


              The main public risk is concentration. Google is still the only named end customer for the Kairos fleet,
              and Duke is only a framework partner. DOE’s own writing on nuclear-powered data centers also warns that
              new reactors take time, cost a lot, and face metering and fuel-chain hurdles. So the upside is real, but
              the path is neither diversified nor de-risked enough to treat as broad-based customer adoption today.
              Kairos has crossed the proof-of-serious-interest line; it has not yet crossed the
              proof-of-broad-market-conversion line.
