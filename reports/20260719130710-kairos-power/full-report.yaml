      - number: '7.3'
        title: >-
          Partner, customer, and market-structure risk could turn a strong proof point into a concentrated
          commercialization funnel
        blocks:
          - type: paragraph
            body: >-
              Kairos’ named-counterparty quality is excellent, but that quality creates its own concentration risk
              because the roster is still short. Google is the only named end customer for the fleet and TVA is the only
              named utility offtaker. That does not undermine the importance of the customer proof—few advanced-reactor
              startups have anything comparable—but it does mean that the company’s commercial narrative is unusually
              exposed to the behavior of a small number of counterparties. If either the Google demand case or the TVA
              delivery path weakens, the signaling damage would be outsized.


              The second market-structure risk is that commercialization depends on utility and tariff architecture, not
              just on hardware readiness. DOE and Latitude both highlight that data-center-oriented nuclear models face
              cost-allocation, metering, and rate-design questions. Duke’s large-load tariff debate is therefore
              relevant even though it is not a Kairos contract. It shows how future clean-firm-power pathways can
              generate backlash over who bears grid-upgrade costs, how much collateral large loads must post, and
              whether data-center customers are subsidized or isolated properly. Kairos needs more than a working
              reactor; it needs procurement structures that remain politically and economically durable.
            claimRefs:
