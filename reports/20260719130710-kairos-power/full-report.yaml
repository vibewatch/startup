              At the same time, the named proof set is still narrow. Google and TVA are real and unusually high-quality
              counterparties, but later fleet units remain milestone-gated and Duke’s 2024 collaboration is better read
              as evidence of future procurement architecture than as a Kairos customer conversion. The chapter therefore
              supports a strong conclusion on customer quality and a weaker one on customer breadth. Kairos has one of
