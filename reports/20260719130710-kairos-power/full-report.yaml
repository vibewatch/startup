companyProfile:
  summary: >-
    Kairos Power is a US private advanced-nuclear company developing the KP-FHR, a fluoride salt-cooled high-temperature
    reactor that uses TRISO annular pebble fuel and is designed as a 150 MWe commercial plant. The company is
    progressing through an iterative test-to-learn model centered on the Hermes demonstration pathway in Tennessee while
    building manufacturing and fuel capabilities across Alameda, Albuquerque, and Oak Ridge. Public commercial proof is
    unusually strong for the category: Google signed a master agreement targeting up to 500 MWe by 2035 and TVA became
    the first disclosed utility offtaker for Hermes 2. Even so, Kairos remains pre-revenue on public evidence and does
    not disclose the valuation, cap table, or contract economics investors would need for tight underwriting.
  foundedDate: '2016-01-01'
  founders:
