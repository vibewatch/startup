              Peer evidence matters here. X-energy’s $700 million Series D and NuScale’s public-company risk disclosures
              both suggest that advanced nuclear still consumes very large amounts of capital before durable customer
              cash flow arrives. In that context, DOE support lowers but does not solve the underwriting problem. The
              next meaningful financial de-risking event is not another headline announcement; it is project-level
