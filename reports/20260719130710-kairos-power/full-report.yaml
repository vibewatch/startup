        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Kairos’ financial model is still better understood as a development-stage bridge than as an operating
              nuclear-utility P&L. No retained public source shows commercial reactor revenue today. Instead, the
              near-term economic story combines DOE milestone payments, private capital, partner-backed development
              work, and the gradual conversion of prototypes and permits into future project revenue. The Google
              announcement is especially important because it clarifies what Kairos eventually expects to monetize: not
              just reactor delivery, but energy, ancillary services, and environmental attributes under PPAs. The TVA
              collaboration adds a second clue that the eventual business model is service-territory and
              project-structure heavy rather than a simple hardware sale.


              That said, public monetization quality remains low today. The company and its partners disclose capacity
              targets and strategic logic, but they do not disclose tariff levels, project ASPs, EPC margin, fuel
              pricing, or revenue-recognition mechanics. Investors should therefore treat the Google backlog as future
              demand validation rather than current revenue quality. The key question is not whether monetization logic
              exists—it does—but when that logic becomes invoiced, repeated, and margin-bearing.
