  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: Publicly evidenced layers of Kairos’ product stack from customer outcome through sites, demos, and fuel chain.
    data:
      layers:
        - label: Customer / clean-firm-power outcome
          detail: Service-territory-aligned, 24/7 clean electricity for large-load customers such as data centers.
        - label: KP-FHR commercial plant
          detail: 150 MWe [2 x 75 MWe] fluoride-salt-cooled high-temperature reactor.
        - label: Hermes demonstration ladder
          detail: >-
            Hermes 1 proves low-power technology and licensing; Hermes 2 adds power-producing commercial-scale
            demonstration.
        - label: Site and construction-learning layer
          detail: Oak Ridge Heritage Center plus modular construction methods validate buildability and cost-down paths.
        - label: Manufacturing and salt layer
          detail: >-
            Albuquerque campus and molten-salt assets support module fabrication, salt production, and non-nuclear
            testing.
        - label: Fuel and materials layer
          detail: TRISO pebble capability, BWXT collaboration, and DOE HALEU pathways support reactor fueling.
        - label: Engineering and prototyping layer
          detail: Alameda engineering, rapid prototyping, and iterative testing anchor the design loop.
    approximationNotes: >-
