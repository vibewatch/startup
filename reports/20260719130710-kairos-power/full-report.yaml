            body: >-
              For Kairos, the relevant unit of analysis is not a software subscription or a component sale; it is a
              financed plant or plant program. The public commercial unit is 150 MWe, while the power-producing learning
              assets remain smaller. That mismatch matters because the demonstration stack can validate reactor physics
              and construction learning while still leaving the economics of the commercial unit largely unpriced in
              public. EIA’s capital-cost benchmark for advanced nuclear and Lazard’s warning about limited new-nuclear
              data both reinforce the same point: small errors in cost, financing, or schedule assumptions can dominate
              the entire margin case.


              A simple capex proxy makes the stakes tangible. If Kairos’ 150 MWe plant were to track EIA’s published
              advanced-nuclear capital-intensity benchmark, the overnight cost envelope would already be very large
              before owner costs and interest during construction. Public sources do not say Kairos will land anywhere
              near that benchmark—its whole thesis is that modular learning and lower-pressure architecture should
              improve the economics—but the benchmark is still useful because it defines how hard the company must push
