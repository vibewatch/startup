  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape segmentation: peers, incumbents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Kairos is not competing in one undifferentiated “SMR market.” The real landscape splits by buyer job.
              Direct advanced-reactor peers include X-energy, TerraPower, NuScale, Holtec, GE Hitachi, Westinghouse,
              Terrestrial Energy, and smaller packaging entrants such as Last Energy. Adjacent narratives include
              microreactors and fusion. Status-quo substitutes still matter too: larger or more conventional nuclear
              pathways can win when the buyer prioritizes regulatory familiarity, bigger power blocks, or visible
              construction references over a more novel architecture.


              That segmentation matters because procurement teams do not buy reactor categories in the abstract. They
              buy a specific combination of megawatt block, site fit, licensing path, fuel tolerance, commercial
              counterparties, and schedule confidence. In some of those categories Kairos is genuinely differentiated,
              especially where staged deployment and named hyperscaler demand matter. In others it is only one credible
              option among several. The right competitive question is therefore not whether Kairos is “best,” but for
              which customer jobs its combination of scale, thermodynamics, and commercialization path is most credible
              relative to alternatives.
            claimRefs:
              - CP001
              - CP002
              - CP014
              - CP017
              - CP033
