  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Kairos moves from strategically compelling to merely trackable once pricing opacity, schedule slip, and fuel
      timing are applied as gates.
    data:
      nodes:
        - id: n1
          label: Strong named counterparties
          detail: Google orderbook + TVA first PPA
          tone: positive
        - id: n2
          label: Large market tailwind
          detail: AI-linked clean-firm-power demand keeps expanding
          tone: positive
        - id: n3
          label: Execution gate
          detail: Hermes schedule slip shows timeline risk is real
          tone: warning
        - id: n4
          label: Fuel gate
          detail: DOE allocation helps, but fleet-scale HALEU/TRISO is still incomplete
          tone: warning
        - id: n5
          label: Pricing-opacity gate
          detail: No public current valuation mark, cap table, or full contract economics
          tone: warning
        - id: n6
          label: 'Current call: TRACK / CONDITIONAL'
          detail: Monitor closely, but do not underwrite aggressively from public evidence alone
          tone: warning
      edges:
        - from: n1
          to: n2
          label: Supports upside
        - from: n2
          to: n3
          label: Still needs delivery
        - from: n3
          to: n4
          label: Timing matters
        - from: n4
          to: n5
          label: Terms matter
        - from: n5
          to: n6
          label: Result
