      - number: '3.2'
        title: Capability and packaging comparison
        blocks:
          - type: paragraph
            body: >-
              Kairos’ public package is distinctive but not dominant across every use case. Its 150 MWe two-unit
              commercial configuration, fluoride-salt cooling, TRISO pebble fuel, and iterative development model make
              it easier to tell a staged commercialization story than some larger peers can. That supports buyers who
              want service-territory-sized increments or a named 24/7 clean-power contract before betting on
              multi-gigawatt fleet buildout. It also pairs naturally with Google’s multi-unit orderbook and the later
              TVA-linked framing.


              But competitors are differently strong. X-energy is more explicit on industrial steam and high-temperature
              heat. TerraPower, Holtec, GE Hitachi, Westinghouse AP300, and Rolls-Royce all present larger utility-scale
              packages or more familiar water-reactor pedigrees. NuScale keeps the strongest formal licensing credential
              but carries more visible commercial-adoption scars. Public pricing is sparse across all of them, so
              capability comparison has to lean on size class, heat/output profile, customer proof, and regulatory
              posture rather than pretending that cost-per-megawatt-hour tables are available. That opacity is itself a
              diligence finding.
