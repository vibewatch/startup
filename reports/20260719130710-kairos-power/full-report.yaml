      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Why Kairos stays investable despite the opacity
            body: >-
              The company has a far better public proof stack than most private advanced-nuclear peers: Google demand,
              TVA offtake, DOE fuel support, and a visible first-plant path. That is enough to keep Kairos in the top
              tier of companies worth following closely.
            calloutType: strength
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV041
          - type: callout
            title: Why the public record still does not support aggressive pricing
            body: >-
              The schedule has already slipped, commercial fuel scale-up is still incomplete, and public sources do not
              reveal the current valuation mark, cap table, or contract economics. The company may be strong; the price
              may still be wrong.
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV008
              - CV027
          - type: callout
            title: The right mental model is platform optionality with a disclosure discount
            body: >-
              Kairos is not a generic pre-revenue climate startup and not a fully underwritten utility-equipment
              company. It is a high-quality advanced-nuclear platform whose valuation should move with milestones,
              counterparties, and transparency.
            calloutType: insight
