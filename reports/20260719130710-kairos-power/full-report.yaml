      - number: '7.2'
        title: >-
          Fuel, construction, and operational risk cluster around the same bottleneck: too many first-of-a-kind systems
          must mature together
        blocks:
          - type: paragraph
            body: >-
              The core operational risk is not one isolated engineering question but the simultaneous maturation of
              reactor construction, fuel supply, fuel fabrication, and grid-integration timing. Hermes uses
              HALEU-bearing TRISO pebbles, and DOE explicitly says domestic HALEU is not yet available from suppliers at
              the scale advanced-reactor developers ultimately need. Kairos has sensibly reduced near-term risk by
              securing DOE-sourced HALEU for Hermes 1, but that is a bridging move rather than proof of a broad
              commercial market. ANS and DOE materials make clear that the allocation program exists precisely because
              the supply chain is incomplete.


              This is where execution complexity compounds. Centrus is aiming to move to larger-scale HALEU production
              by 2029, BWXT is only now exploring commercial TRISO manufacturing with Kairos, and DOE still frames
              allocation as an ongoing process. Those facts do not mean Kairos will fail; they do mean that timing
              mismatches remain plausible. Add DOE’s own warning that first-of-a-kind data-center reactors are expensive
              and slow to build, and the operational risk stack becomes clear: even if reactor physics works, the
              commercial path can still slow on fuel, fabrication, or construction-learning loops.
            claimRefs:
