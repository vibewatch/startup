      - number: '1.2'
        title: Founders, Leadership, and Governance Dependence
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a founder story rooted in UC Berkeley’s advanced-reactor research ecosystem.
              Berkeley sources tie Kairos Power’s origins to Mike Laufer, Ed Blandford, and Per Peterson, while current
              Kairos materials identify Laufer as CEO and co-founder and Blandford as CTO. That combination matters for
              diligence because the company’s public identity is still highly founder-technical: leadership credibility
              rests on deep reactor physics, licensing, and technology-development expertise rather than on the long
              operating history or regulated-utility balance sheet that would anchor an incumbent nuclear developer.
              Jeff Olson’s prominence in commercial announcements also shows that Kairos has added a visible
              business-development voice as customer contracting becomes more central.


              The governance picture is only partially public. Kairos provides a current operating leadership list, but
              retained sources do not provide the kind of detailed board, ownership, or committee transparency that
              investors would expect from a public issuer or project-financed utility affiliate. That opacity does not
              mean governance is weak, but it does create key-person concentration risk: Laufer and Blandford remain
              central to technical credibility, regulatory trust, partner confidence, and capital formation. The upside
              is coherence—one reactor family, one operating model, one message. The downside is that public diligence
              cannot fully test succession depth, independent board leverage, or how much strategic control sits with
              founders versus investors and government-linked funding partners.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO035
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.3'
        title: Technology Platform and Commercialization Model
        blocks:
          - type: paragraph
            body: >-
              Kairos Power’s commercial story is inseparable from its technical architecture. The KP-FHR combines molten
              fluoride salt coolant with TRISO pebble fuel in a high-temperature, low-pressure design that the company
              argues can deliver both inherent safety and lower-cost construction than large water-cooled reactors.
              Current technology pages show a minimum commercial plant of two 75 MWe units, or 150 MWe total, while
              Hermes and Hermes 2 function as progressive demonstrations of licensing, construction, fuel handling, and
              supply-chain execution. In other words, Kairos is not only proving that the reactor physics work; it is
              also proving that the development process, manufacturing stack, and project-delivery model can work
              repeatedly enough to satisfy future customers.


              That is why iterative development and vertical integration recur across almost every retained company
              source. Kairos uses ETUs, salt production, fuel-development labs, and in-house fabrication not as side
              projects but as the operating backbone of its cost-down strategy. This is a sophisticated answer to the
              classic advanced-nuclear challenge: the first plant is expensive, and the second only gets cheaper if the
              developer controls enough of the learning loop to capture schedule, manufacturing, and regulatory lessons.
              The business model therefore mixes public cost-share, internally controlled manufacturing capability, and
              later PPAs with large power buyers. The model is plausible, but it is also capital intensive and
              vulnerable to delays if any one part of the learning chain stalls.
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO027
              - CO029
              - CO032
