  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk is already realized in the schedule, not merely hypothetical in principle
        blocks:
          - type: paragraph
            body: >-
              The highest-confidence risk in the public record is regulatory schedule slippage. Kairos did not merely
              warn that first-of-a-kind reactor construction could be slow; it already had to obtain an NRC amendment
              extending the Hermes 1 completion deadline from the end of 2026 to April 2029. The NRC’s own safety
              evaluation makes the reason plain: developmental problems attributable to the first-of-a-kind nature of
              the facility, plus more complex site-preparation work than expected. That matters because it converts a
              generic startup risk into a timestamped precedent. The company can point to strong regulatory engagement,
              but it can no longer claim an unslipped path to first operations.


              The mitigating side is also real. The same NRC package says the amendment did not authorize new
              activities, found no significant hazards implication, and carried a finding of no significant
              environmental impact. Hermes 2 also has a construction permit and a transparent document trail. So the
              legal and regulatory picture is not one of denial or hostile posture; it is one of cooperative but
              exacting oversight. That distinction matters for underwriting. Kairos looks better than companies stalled
              by licensing opacity, but worse than a clean on-time development story. Additional date slippage would now
              be a major negative signal because the “first delay” has already happened.
            claimRefs:
