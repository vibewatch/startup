      - number: '5.3'
        title: Deployment, dependencies, and differentiation
        blocks:
          - type: paragraph
            body: >-
              Kairos’ differentiation is not just a reactor physics claim. It also includes a manufacturing and
              deployment thesis: module fabrication in Albuquerque, brownfield reuse in Alameda and Oak Ridge, modular
              construction methods at Hermes 2, and a fuel pathway that blends internal capability with external
              partners and DOE support. That combination is central to the company’s case that it can shrink timelines
              and lower costs versus traditional nuclear build patterns. The customer-facing versions of this argument
              are visible in the Google and TVA path, where the company is presenting a service-territory,
              data-center-adjacent commercialization model rather than a generic baseload plant narrative.


              The flip side is dependency concentration. Fuel remains the clearest example. DOE’s HALEU materials,
              BWXT’s TRISO collaboration, and Kairos’ first-fuel allocation all show real progress, but they also
              confirm that the product cannot be separated from fuel-chain readiness. Similar logic applies to salt
              production, construction methods, and regulatorily accepted materials work. Kairos is differentiated
              precisely because it is trying to coordinate these layers at once; that also means delays in any one layer
              can limit the pace of deployment.
