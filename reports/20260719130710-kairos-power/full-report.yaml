            body: >-
              The adoption trajectory is credible because it steps from a broad framework to a plant-specific contract.
              In October 2024, Google and Kairos signed a 500 MWe master development agreement through 2035. In August
              2025, that broad framework narrowed into a disclosed, binding Hermes 2 pathway through TVA for up to 50 MW
              and a 2030 operating target. That sequence is important: it shows that Kairos has moved from conceptual
