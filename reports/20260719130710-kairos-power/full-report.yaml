      - number: '8.4'
        title: Exit readiness, thesis-break triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The most plausible next capital path looks private rather than public. Kairos appears better positioned
              for another private financing, project-level capital formation, or strategic capital tied to customers and
              fuel-chain buildout than for a near-term IPO. Public-market advanced nuclear investors do exist, but the
              companies that tap them still face intense volatility and disclose far more than Kairos does today. Until
              Kairos can produce a cleaner budget bridge, contract economics, cap-table transparency, and fuel timing
              evidence, an IPO-style valuation conversation is premature.


              The diligence list is correspondingly concrete. Investors need the current common-equity mark and
              preference stack, the economic summary of the Google/TVA agreements, the revised Hermes budget and
              contingency usage after the schedule extension, and a dated bridge from DOE HALEU allocation to
              commercial-scale fuel supply. If those items come in cleanly, the recommendation could improve. If they
              deteriorate—or if schedule and fuel timing slip again—the public evidence would support moving from
              conditional interest toward a harder wait posture.
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV039
