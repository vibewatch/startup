  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and asset map
        blocks:
          - type: paragraph
            body: >-
              Kairos’ product is easiest to understand as a delivery stack rather than a single reactor module. For
              customers, the company is not only selling a reactor design; it is selling a path to clean firm power
              built around the KP-FHR commercial plant, a progression of Hermes demonstration assets, and the supporting
              manufacturing, salt, and fuel capabilities required to make that path repeatable. The public record is
              unusually strong for a startup on this point: location pages and project updates make clear that Alameda,
              Albuquerque, and Oak Ridge each play distinct roles in the product system.


              That matters because advanced-reactor underwriting often fails when a company has a compelling core design
              but weak evidence on manufacturing, site-readiness, or fuel-chain execution. Kairos has at least partial
              public answers for all three. Alameda is the engineering and prototyping layer, Albuquerque is the
              manufacturing and salt/fuel-development layer, and Oak Ridge is the construction-learning and
              operational-demonstration layer. The product, therefore, is not just a reactor that might someday be sold;
              it is a multi-site operating model already being assembled in public.
