  topStrengths:
    - >-
      First-of-a-kind commercial validation with Google’s up-to-500 MWe master agreement and a plant-specific TVA
      pathway for Hermes 2.
    - >-
      Unusually strong public-private de-risking stack spanning NRC construction progress, DOE milestone support, and a
      visible fuel/manufacturing ecosystem.
    - >-
      Differentiated KP-FHR architecture and iterative test-to-learn development model create a credible path to cost
      and safety advantages if milestones hold.
  topRisks:
    - >-
      Further Hermes schedule or budget slippage could compress valuation quickly because the thesis is
      milestone-dependent.
    - >-
      Commercial HALEU and TRISO supply is improving but still not fully mature, leaving fuel-chain timing as a real
      bottleneck.
    - >-
      Public evidence does not disclose the current valuation, cap table, contract pricing, or cash runway, making entry
      price hard to underwrite.
  unresolvedGaps:
    - Current common-equity valuation mark, preference stack, dilution terms, and any structured downside protections.
    - Full Google/TVA contract economics, duration, risk allocation, collateral, and termination rights.
    - Updated Hermes budget, contingency usage, and revised schedule after the disclosed project extension.
    - Bridge from DOE HALEU allocation to scalable commercial TRISO fuel supply for later units.
