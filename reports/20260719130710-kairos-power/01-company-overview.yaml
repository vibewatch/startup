  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-opacity
    missingEvidence: Exact latest post-money valuation, last primary share price, and secondary clearing range for Kairos Power.
    whyItMatters: The company clearly has commercialization momentum, but public sources do not allow investors to benchmark current equity value against reactor milestones or future dilution risk.
    diligencePath: Request the most recent board-approved 409A, lead-investor pricing memo, and any recent secondary-trade indications from management or existing investors.
    relatedQuestionRefs:
    - QO024
  - type: private-evidence-only
    severity: material
    topic: undisclosed-metrics
    missingEvidence: Current revenue, non-dilutive cash receipts recognized to date, burn rate, and committed customer pipeline beyond Google.
    whyItMatters: Without operating metrics, outside investors cannot independently assess how much of Kairos' value comes from contracted demand versus future capital requirements.
    diligencePath: Request monthly cash burn, contracted milestone receipts, backlog, and customer-pipeline materials from the finance team.
    relatedQuestionRefs:
    - QO025
  - type: missing-source
    severity: material
    topic: governance-transparency
    missingEvidence: A full current board list, governance committee structure, and investor control-right summary.
    whyItMatters: The company remains founder-technical and capital intensive, so governance quality will matter as much as reactor physics in future financing and project-delivery decisions.
    diligencePath: Obtain the latest board deck, cap table, investor-rights agreement, and any project-level governance documentation tied to Google, TVA, or DOE milestones.
    relatedQuestionRefs:
    - QO005
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: minor
    topic: funding-summary
    missingEvidence: A single primary-source ledger that cleanly separates DOE cost-share, project budget, private equity raised, and partnership-linked development capital.
    whyItMatters: Third-party pages summarize funding differently, and some blur total project cost with government support or cumulative company financing.
    diligencePath: Reconcile management's internal financing history against public announcements, DOE contract value, and any private-round closing documents.
    relatedQuestionRefs:
    - QO020
    - QO024
    relatedTableRefs:
    - TO001
