  - TO002
- id: technology-platform-and-commercial-model
  title: Technology Platform and Commercialization Model
  body: 'Kairos Power’s commercial story is inseparable from its technical architecture. The KP-FHR combines molten fluoride salt coolant with TRISO pebble fuel in a high-temperature, low-pressure design that the company argues can deliver both inherent safety and lower-cost construction than large water-cooled reactors. Current technology pages show a minimum commercial plant of two 75 MWe units, or 150 MWe total, while Hermes and Hermes 2 function as progressive demonstrations of licensing, construction, fuel handling, and supply-chain execution. In other words, Kairos is not only proving that the reactor physics work; it is also proving that the development process, manufacturing stack, and project-delivery model can work repeatedly enough to satisfy future customers.


    That is why iterative development and vertical integration recur across almost every retained company source. Kairos uses ETUs, salt production, fuel-development labs, and in-house fabrication not as side projects but as the operating backbone of its cost-down strategy. This is a sophisticated answer to the classic advanced-nuclear challenge: the first plant is expensive, and the second only gets cheaper if the developer controls enough of the learning loop to capture schedule, manufacturing, and regulatory lessons. The business model therefore mixes public cost-share, internally controlled manufacturing capability, and later PPAs with large power buyers. The model is plausible, but it is also capital intensive and vulnerable to delays if any one part of the learning chain stalls.'
  claimRefs:
  - CO010
  - CO011
