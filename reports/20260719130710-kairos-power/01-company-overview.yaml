callouts:
- calloutType: strength
  title: Google Turns Kairos from a Demo Story into an Orderbook Story
  body: The October 2024 Google agreement is more than a branding win. It gives Kairos Power a named anchor customer, a 500 MW fleet target through 2035, and a contractual structure that explicitly extends the company’s iterative development model into early commercial deployment. Few advanced-reactor startups have both NRC-permitted hardware and a hyperscaler-backed orderbook.
  claimRefs:
  - CO020
  - CO021
  - CO022
  - CO031
- calloutType: strength
  title: Hermes and Hermes 2 Create a Rarely Concrete Advanced-Nuclear Execution Path
  body: Kairos is not asking investors to underwrite only a concept. The retained evidence shows a sequence of permit, funding, construction, and partnership milestones spanning Hermes, Hermes 2, DOE milestone support, and ORNL technical work. That does not eliminate risk, but it materially distinguishes Kairos from paper-reactor peers.
  claimRefs:
  - CO015
  - CO018
  - CO019
  - CO025
  - CO026
- calloutType: risk
  title: Execution Credibility Has Improved Faster Than Public Financial Transparency
  body: Public evidence is strong on reactor design, licensing progress, and counterparties, but weak on current valuation, revenue, customer concentration, and cap-table specifics. At the same time, adverse industry commentary still says first-of-a-kind advanced nuclear projects face uncertain costs and long timelines. That combination means Kairos looks more de-risked operationally than it does financially.
  claimRefs:
  - CO033
  - CO034
  - CO037
  - CO038
