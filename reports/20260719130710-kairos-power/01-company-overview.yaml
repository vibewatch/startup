- id: founders-leadership-and-governance
  title: Founders, Leadership, and Governance Dependence
  body: 'Public evidence supports a founder story rooted in UC Berkeley’s advanced-reactor research ecosystem. Berkeley sources tie Kairos Power’s origins to Mike Laufer, Ed Blandford, and Per Peterson, while current Kairos materials identify Laufer as CEO and co-founder and Blandford as CTO. That combination matters for diligence because the company’s public identity is still highly founder-technical: leadership credibility rests on deep reactor physics, licensing, and technology-development expertise rather than on the long operating history or regulated-utility balance sheet that would anchor an incumbent nuclear developer. Jeff Olson’s prominence in commercial announcements also shows that Kairos has added a visible business-development voice as customer contracting becomes more central.


    The governance picture is only partially public. Kairos provides a current operating leadership list, but retained sources do not provide the kind of detailed board, ownership, or committee transparency that investors would expect from a public issuer or project-financed utility affiliate. That opacity does not mean governance is weak, but it does create key-person concentration risk: Laufer and Blandford remain central to technical credibility, regulatory trust, partner confidence, and capital formation. The upside is coherence—one reactor family, one operating model, one message. The downside is that public diligence cannot fully test succession depth, independent board leverage, or how much strategic control sits with founders versus investors and government-linked funding partners.'
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO008
  - CO035
