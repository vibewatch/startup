sections:
- id: identity-mission-and-footprint
  title: Identity, Mission, and National Footprint
  body: 'Kairos Power positions itself as a mission-driven nuclear technology, engineering, and manufacturing company focused on commercializing one reactor family rather than running a diversified generation portfolio. Retained official materials consistently place the company’s headquarters in Alameda, California, and show a three-node operating footprint: design, prototyping, and salt-lab work in Alameda; manufacturing, salt-production, and fuel-development work in Albuquerque; and the Hermes reactor demonstration campus in Oak Ridge, Tennessee. The company’s current stage is therefore best understood as late-stage commercialization rather than mature utility operation: it is building hardware, proving a construction and licensing model, and signing future output contracts before it has an operating revenue-scale fleet.


    Kairos says its mission is to deliver clean, affordable, reliable firm power by commercializing its KP-FHR design. The company repeatedly frames the market opening around aging gas capacity, the need for dispatchable carbon-free generation, and rising electricity demand from digital infrastructure. That framing matters because it explains why Kairos is pairing reactor development with customer-facing commercialization structures early, instead of treating the first customer contract as a post-licensing event. The footprint, siting choices, and mission language all point to the same operating thesis: concentrate learning in a few controlled locations, own key manufacturing steps, and move from demonstrations to repeatable fleet deployment as quickly as regulators and counterparties will allow.'
  claimRefs:
  - CO001
  - CO002
  - CO003
