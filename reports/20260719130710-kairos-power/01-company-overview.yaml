company:
  name: Kairos Power
chapter:
  number: 1
  title: Company Overview
  summary: Kairos Power is an Alameda-based late-stage advanced nuclear startup founded in 2016 out of UC Berkeley-linked molten-salt and high-temperature reactor research. The company is commercializing its fluoride salt-cooled high-temperature reactor (KP-FHR) through an iterative, vertically integrated development model that has already produced the first U.S. non-water-cooled reactor construction permit in more than 50 years for Hermes, a follow-on Hermes 2 power-producing project in Oak Ridge, and a landmark 500 MW Google-led orderbook through 2035. Public evidence also shows a credible DOE-backed commercialization path, including a $303 million milestone contract and a 2026 ORNL fuel-and-materials partnership, but exact valuation, revenue, ARR, and cap-table detail remain undisclosed while the 2030/2035 delivery schedule remains ambitious by nuclear-industry standards.
  contentRequirements:
  - Identity, headquarters, founding date, current stage, and one-line product/business model.
  - Founders, leadership, board/governance, key-person dependence, and material leadership changes.
  - Funding history, valuation, total raised, investors, secondaries, debt/credit when supportable.
  - Cover metrics (valuation, raised, revenue/run-rate, customers, headcount, locations) with explicit gaps for unsupported numbers.
  - Milestones across founding, financing, product, scale, regulatory, partnerships, and adverse events.
  plannedTables:
