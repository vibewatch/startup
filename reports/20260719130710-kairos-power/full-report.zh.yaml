  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              Kairos 的财务模型现在更适合看作开发阶段桥梁，而不是运营中的核电公用事业 P&L。留存公开来源没有显示公司今天已有商业反应堆收入。相反，近期经济故事由 DOE
              里程碑付款、私人资本、合作伙伴背书的开发工作，以及把原型和许可逐步转成未来项目收入组成。Google 公告尤其重要，因为它说明 Kairos 最终想变现的不只是交付反应堆，还包括 PPA
              下的能源、辅助服务和环境属性。TVA 合作又给出第二条线索：最终商业模式更像服务区域和项目结构驱动，而不是简单硬件销售。


              不过，今天的公开变现质量仍然不高。公司和合作伙伴披露容量目标和战略逻辑，但没有披露电价水平、项目 ASP、EPC 利润率、燃料定价或收入确认机制。因此，投资人应把 Google
              订单储备视为未来需求验证，而不是当前收入质量。关键问题不是变现逻辑是否存在——它存在——而是这套逻辑何时变成可开票、可重复、能贡献利润率的收入。
