  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 锚定客户、买方逻辑与地理位置
        blocks:
          - type: paragraph
            body: >-
              对一家商业化前反应堆公司来说，Kairos 的客户故事异常具体，但它不是常规的一客户一合同公用事业销售。首个可见商业结构有三层。Google
              是需求锚：它需要面向特定数据中心运营的稳定无碳电力和清洁能源属性。Kairos 是开发运营方，负责建设并运营电站。TVA 是公用事业承购方和电网交付层，将购买 Hermes 2
              出力，并通过自己的系统转移这些属性。这种分工很重要，因为它让 Kairos 看起来不像一个商用反应堆卖方，更像是一个为超大规模负荷服务、由公用事业赋能的采购平台。


              公开地理也比大多数先进核能客户故事更具体。2025 年合作并不只是抽象提到数据中心，而是指向 Google 在 Tennessee 的 Montgomery County 和 Alabama 的 Jackson
              County
              的运营。这种具体性强化了买方-用户-付款方映射，也降低了客户叙事纯属愿景的风险。最弱点在广度，而不是清晰度。公开证据显示一个极强的终端客户和一个极重要的公用事业中介，但还没有显示跨区域、跨用例的独立付费买方组合。
