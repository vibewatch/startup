  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 状态 / 指标
      - 重要性
      - 对 Kairos 的参照价值
      - 主要限制
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the most decision-useful advanced-nuclear comparators actually fetched in this run: one private ARDP
        heavyweight, one newly public reactor-and-fuel platform, one public optionality-driven reactor platform, and one
        downside public precedent.
    rows:
      - - TerraPower
        - 私人公司；2025 年宣布融资 $650M；首座 Natrium 电站获得 DOE 大额成本分摊支持
        - 显示私人资本仍愿意大规模支持长周期先进核能
        - 对资本强度和战略溢价语境参照价值高
        - 反应堆技术不同，公私资本堆叠规模也大得多
      - - X-energy
        - 2026 年上市；IPO 净筹资约 $1.1B；2026 年 Q1 收入和补助收入 $43M
        - 最接近的同行，显示市场如何奖励反应堆 + 燃料可见度和里程碑
        - 对商业化和燃料链比较参照价值高
        - 反应堆类型不同，公开财务披露也多于 Kairos
      - - Oklo
        - 上市先进核能公司；尽管商业证明有限，仍披露 2025 年业绩和大量风险
        - 显示在广泛运营收入出现前，期权价值也可能很高
        - 对公开市场热情和风险感知语境参照价值中等
        - 规模、燃料回收角度和接近微反应堆的叙事不同
      - - NuScale
        - 上市 SMR 公司；2025 年有收入和 $1.3B 现金，但也有 CFPP 下行先例
        - 同时界定商业化潜力和 FOAK 下行压缩
        - 作为压力测试可比公司，参照价值高
        - 轻水 SMR 路径，客户和资本结构历史也非常不同
    notes: Kairos 没有完美的一一对应上市可比公司，因此这组可比混合了溢价、证明和失败参照。
    claimRefs:
      - CV013
      - CV015
      - CV017
      - CV019
      - CV020
      - CV021
      - CV035
  - id: TV005
    title: 投资逻辑破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - Hermes 进度进一步滑坡
        - 任何新的期限延期请求，或较更新计划出现可见的跨季度延误
        - 把执行折价变成核心商业化损伤
        - 从观察 / 有条件转向明确等待
      - - 燃料桥恶化
        - 商业 HALEU 或 TRISO 时间较反应堆进度走弱
        - 削弱从示范走向可复制机组群部署的路径
        - 扩大估值折价，并向下重测乐观 / 基准区间
      - - 客户转化停滞
        - 首座电站之外没有实质进展，或 Google/TVA 姿态走弱
        - 把订单簿从平台证明压缩成单项目证明
        - 削减附着在战略验证上的溢价
      - - 融资条款不透明或不利
        - 新资本附带严苛优先权、棘轮条款，或沉重项目负担
        - 普通股价值可能远弱于头部战略叙事
        - 推进前要求完整股权瀑布分析
      - - FOAK 成本失控信号
        - 预算或应急储备恶化开始接近 NuScale 式教训
        - 叙事从纪律化迭代转向失控的资本强度
        - 除非价格大幅重置，否则从观察转为回避
    notes: 这些是当前估值逻辑最快可能破裂的公开或尽调可见路径。
    claimRefs:
      - CV003
      - CV008
      - CV020
      - CV040
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前估值和股权结构表
        - 当前普通股估值标记、清算优先权、认股权证和特殊权利
        - 没有这些，投资者无法把战略强度转化为真实普通股价值支撑
        - 索取最新融资文件和股权结构瀑布表
      - - 客户合同经济性
        - PPA 定价机制、期限、下行保护、里程碑和选择权转化逻辑
        - 只有理解经济性和义务，具名交易对手才有价值
        - 索取 Google/TVA 协议的商业摘要
      - - 项目预算和应急储备
        - 延期后的 Hermes 1 和 Hermes 2 最新预算、完工尚需成本和应急储备消耗
        - 判断延误能否消化，还是会毁掉价值
        - 审阅最新预算包和挣值报告
      - - 燃料衔接到机组群规模
        - 从 DOE HALEU 配额到商业供应和 TRISO 产能的数量 / 时间衔接
        - 如果燃料节奏赶不上电厂节奏，平台故事就站不住
        - 索取包含交易对手和缓冲的整合燃料供应计划
      - - 复制项目管线
        - 按概率加权列出 Google / TVA 之外的新增公用事业、地区或客户
        - 只有它能解释为何按平台价值、而不是单项目价值给溢价
        - 审阅业务拓展漏斗和 NDA 覆盖的交易对手
    notes: 这些尽调要求是把当前公开投资逻辑转成真实定价决策所需的最低集合。
    claimRefs:
      - CV038
      - CV039
