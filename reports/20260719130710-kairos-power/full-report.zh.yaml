      - number: '4.4'
        title: 公开缺口与反向信号
        blocks:
          - type: paragraph
            body: >-
              财务尽调最大的阻塞点是披露。公开来源没有给出现金余额、烧钱速度、现金跑道、债务契约、客户预付款、项目级 EPC 或有项、已实现模块成本，或任何可被银行接受的电价数据。Caplight 的公开输出确认 Kairos
              有可见融资轮和投资人，但即便在那里，抓取到的信息也太不完整，无法用于精确估值或融资轮承销。这迫使判断回到保守立场：官方 DOE 承诺、燃料里程碑和具名客户合同，比第三方估值页面权重高得多。


              反向证据也真实存在。TechCrunch 明确把 2030 年时间表视为乐观，整个行业也有 NuScale 10-K 和同行资本需求这些清晰的警示可比项。这些都不能否定 Kairos
              最终的财务上行空间，只说明公开数据结论仍是继续研究。在承销收入质量、利润率或估值前，投资人需要私人预算、合同经济性、现金数据，以及更清楚的视角，看到里程碑节奏如何转化成流动性和项目融资。
