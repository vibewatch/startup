        title: 产品定义与资产地图
        blocks:
          - type: paragraph
            body: >-
              Kairos 的产品最容易理解为一套交付栈，而不是单个反应堆模块。对客户来说，公司卖的不只是反应堆设计；它卖的是一条通往清洁稳定电力的路径，这条路径围绕 KP-FHR 商业电站、逐级推进的 Hermes
              示范资产，以及让路径可复制所需的制造、盐和燃料能力搭建。就初创公司而言，公开记录在这一点上异常扎实：地点页面和项目更新清楚说明 Alameda、Albuquerque 和 Oak Ridge
              在产品系统里各自承担不同角色。


              这很重要，因为先进反应堆承销常常卡在一个点：核心设计很有吸引力，但制造、场址就绪或燃料链执行证据很弱。Kairos 至少对三者都给出了部分公开答案。Alameda 是工程和原型层，Albuquerque
              是制造和盐 / 燃料开发层，Oak Ridge 是建设学习和运营示范层。因此，这个产品不只是一座未来也许能卖出去的反应堆，而是一套已经在公开视野里被组装起来的多场址运营模式。
