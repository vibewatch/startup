            body: >-
              采用轨迹可信，是因为它从宽泛框架走向了具体电站合同。2024 年 10 月，Google 与 Kairos 签署到 2035 年的 500 MWe 主开发协议。2025 年 8
              月，这个宽框架收窄为一个已披露、有约束力的 Hermes 2 路径：通过 TVA 实现最高 50 MW，并以 2030 年运行为目标。这个顺序很重要：它说明 Kairos
              已从概念性的企业兴趣，推进到一个具名公用事业承购安排，并且绑定具体电站、具体区域和具体终端负荷。


              与此同时，具名验证集仍然很窄。Google 和 TVA 都是真实且质量异常高的交易对手，但后续舰队机组仍受里程碑约束；Duke 2024 年合作更适合解读为未来采购架构证据，而不是 Kairos
              客户转化。因此，本章支持一个强结论：客户质量高；也支持一个弱结论：客户广度仍不足。Kairos 拥有先进核能领域最好的公开具名客户验证包之一，但还没有多元化的公开客户名单。
