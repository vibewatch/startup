      - number: '1.4'
        title: 里程碑、资本信号与执行背景
        blocks:
          - type: paragraph
            body: >-
              Kairos 已远远不只是概念阶段信号。对一家私营先进反应堆公司来说，它的里程碑链条异常具体：2023 年 12 月 Hermes 获得许可批准；2024 年 2 月 DOE 签下基于里程碑的
              Technology Investment Agreement；2024 年 7 月 Hermes 开工；2024 年 10 月达成 Google 500 MW 协议；2024 年 11 月 Hermes 2
              获得许可；2025 年启动核安全相关建设；2026 年初与 ORNL 展开燃料和材料合作；2026 年 4 月 Hermes 2 破土动工。随后 Google-Kairos-TVA
              的安排尤其关键，因为它把泛泛的未来订单储备转成一个明确的首个部署：最高 50 MW 接入 TVA 电网，并直接服务 Google 在 Tennessee 和 Alabama 的数据中心需求。


              这些里程碑显著降低了公司风险，尤其是相较于只有纸面设计或政策支持的先进反应堆开发商。即便如此，公开记录也保留了关键限定：首堆先进核能项目仍面对不确定的前期建设成本、漫长周期和赞助方犹豫。TechCrunch
              明确指出，在核能语境下，2030 年首座反应堆和 2035 年舰队时间表都很激进；Utility Dive 对 NIA
              的报道也强调，早期项目赞助方在完全承诺前仍需要更多兜底。上市公司式资本透明度也还没有出现。留存的市场数据页面披露了投资人名称和融资轮次时间线，但没有可验证的当前投后估值、收入运行率或完整股权结构表。公司有势能，但还没有完整的公开财务可见度。
