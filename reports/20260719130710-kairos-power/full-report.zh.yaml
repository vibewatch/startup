        title: 扩张循环与集中风险
        blocks:
          - type: paragraph
            body: >-
              Kairos 最好的扩张论点是，它的第一位客户正是那种能够支撑重复部署的买方。Google 持续报告 AI 驱动电力需求上升和创纪录清洁能源采购，并且已经同时支持 Kairos 的舰队式协议，以及在另一区域与
              Duke 的电价创新。TVA 的参与加入了第二个重要条件：通过公用事业居中，把清洁稳定电力送入电网，而不是只依赖复杂的表后结构。如果 Hermes 2
              跑通，商业化循环可能自我强化——经济性更好，公用事业意愿更强，超大规模云厂商兴趣更高。


              主要公开风险是集中度。Google 仍是 Kairos 舰队唯一具名终端客户，Duke 只是框架伙伴。DOE
              关于核能数据中心的材料也提醒，新反应堆需要时间、成本高，并面临计量和燃料链障碍。所以，上行空间真实存在，但路径还不够多元，也没有足够去风险，不能把它视为今天已经形成广泛客户采用。Kairos
              已跨过“严肃购买兴趣验证”这条线；还没有跨过“广泛市场转化验证”这条线。
