      - number: '8.3'
        title: 乐观 / 基准 / 悲观情景分析与可比公司框架
        blocks:
          - type: paragraph
            body: >-
              这里唯一站得住脚的估值方法是情景分析。乐观情景假设 Hermes 里程碑守住、燃料桥按时推进，Google/TVA 开始像可复制订单簿的前端，而不是一次性项目。在那个世界里，Kairos
              相比普通商业化前能源创业公司，可能值得一个有意义的战略溢价，因为它同时拥有客户验证、监管进展和重复部署的可见路径。基准情景让 Kairos
              维持在私营独角兽区间，但在公司披露更多预算、股权结构表和合同经济性证据之前，不给重大重估。悲观情景假设进一步延期或燃料错配，把故事拖成一个漫长、昂贵且近期可复制性有限的示范项目。


              可比集合支持这种宽区间框架。TerraPower 证明大型私营资本仍支持先进核能；X-energy 显示，当里程碑可见时，公开市场可以奖励“反应堆 + 燃料”平台；Oklo
              显示，即便尚未商业化的标的也能吸引公开市场热情；NuScale 则提醒投资者，一旦结构和客户匹配破裂，首台套商业化会多快压缩价值。没有单一可比公司能干净给 Kairos
              定价，但同业集合有助于框定战略上行与下行的边界。
