  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 仅基于公开证据的 Kairos 投委会式评分。
    data:
      items:
        - label: 市场机会
          score: 8/10
          note: AI 和公用事业对清洁稳定电力的需求强且持久
        - label: 商业证据
          score: 7/10
          note: 以这一阶段看，Google + TVA 作为具名对手方异常强
        - label: 燃料 / 供应准备度
          score: 5/10
          note: 首台机组有过渡桥接，但机队规模 HALEU 和 TRISO 时点仍不完整
        - label: 披露质量
          score: 3/10
          note: 当前估值、股权结构表、预算和合同经济性大多仍未公开
        - label: 竞争位置
          score: 7/10
          note: Kairos 把客户证据、公用事业整合和迭代开发结合得比许多同行更好
        - label: 估值支撑
          score: 4/10
          note: 战略价值清晰，但公开来源下价格可见度弱
        - label: 退出准备度
          score: 4/10
          note: 更适合后续私募融资，而非近期 IPO
        - label: 证据质量
          score: 5/10
          note: 强于很多创业公司，但仍不足以精准承销
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV027
      - CV036
      - CV041
