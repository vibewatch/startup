  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 一旦把定价不透明、进度延期和燃料时点纳入门槛，Kairos 就会从战略吸引力很强降为仅值得跟踪。
    data:
      nodes:
        - id: n1
          label: 强具名对手方
          detail: Google 订单簿 + TVA 首份 PPA
          tone: positive
        - id: n2
          label: 大市场顺风
          detail: AI 拉动的清洁稳定电力需求持续扩张
          tone: positive
        - id: n3
          label: 执行闸门
          detail: Hermes 进度延期表明时间线风险已经落地
          tone: warning
        - id: n4
          label: 燃料闸门
          detail: DOE 配额有帮助，但机队规模 HALEU/TRISO 仍不完整
          tone: warning
        - id: n5
          label: 定价不透明闸门
          detail: 当前估值标记、股权结构表或完整合同经济性均未公开
          tone: warning
        - id: n6
          label: 当前判断：观察 / 有条件
          detail: 密切跟踪，但不要只凭公开证据激进承销
          tone: warning
      edges:
        - from: n1
          to: n2
          label: 支撑上行
        - from: n2
          to: n3
          label: 仍需交付
        - from: n3
          to: n4
          label: 时点关键
        - from: n4
          to: n5
          label: 条款关键
        - from: n5
          to: n6
          label: 结果
    approximationNotes: 该图是决策框架，不是机械财务模型。
