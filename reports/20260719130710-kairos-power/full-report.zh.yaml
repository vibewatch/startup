      - number: '8.2'
        title: 建议、信心、风险评级与估值立场
        blocks:
          - type: paragraph
            body: >-
              当前合适姿态是观察 / 条件性，而不是买入。这并不是否定 Kairos 的战略位置。就公开证据看，Kairos
              是一家严肃公司，客户验证优于许多同业，去风险步骤也比概念阶段气候科技创业公司更可见。需要谨慎的原因在价格，而不在质量。投资者不知道当前普通股估值、当前客户经济性、股权结构表的优先权安排，或已披露进度延期后的修订项目预算。缺少这些，公开来源不足以支持一个强判断：当前私营价格——无论是多少——显然有吸引力。


              因此，信心为低到中，风险仍高。公司已有足够证据值得持续主动跟踪，也可能足以支持进一步尽调，但公开透明度还不足以支撑激进承销。正确的估值立场是“披露不足，但战略价值高”：如果执行守得住，这个类别显然有值得持有的资产；但缺失变量太重要，不能靠行业热情一笔带过。
