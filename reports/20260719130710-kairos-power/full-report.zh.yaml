      - - 核电和煤电场址再利用机会
        - 利用既有场址、基础设施和过往许可熟悉度的项目
        - 没有本地电网或社区逻辑的绿地囤地
        - 开发商，加上东道社区和公用事业
        - 重要的供给侧市场筛选器，因为选址可行性决定哪些需求真正能被服务
      - - 现状替代方案
        - 燃气电厂、可再生能源 + 储能、需求响应，以及解决同一可靠性任务的既有核电延寿
        - 电力可靠性之外的不相关气候科技类别
        - 同上终端买方
