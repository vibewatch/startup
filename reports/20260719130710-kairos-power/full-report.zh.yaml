  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Kairos 的正向案例强过普通先进核能故事，因为公司已经拥有这个行业里极其重要的三件事：具名超大规模买方、具名公用事业承购方，以及可见的首座电厂路径。Google 的多机组订单、TVA 的 Hermes 2
              PPA、DOE 燃料支持，以及 Kairos 的迭代开发模型，合在一起构成了商业化叙事；对一家私营反应堆公司来说，这个叙事异常清晰。客户需求背景也真实存在。Google 持续披露因 AI
              和数据中心规模带来的大量且增长的清洁电力需求，这意味着 Kairos 并不是在向一个想象中的未来市场销售。


              反向逻辑不是市场虚假，也不是技术缺乏吸引力，而是公开证据仍难以给公司精确定价。Hermes 1 进度已经滑坡，通往机队规模的燃料桥仍不完整，合同经济性未公开，NuScale/UAMPS
              的下行先例又太切题，不能忽略。换句话说，Kairos 也许是最强的私营先进核能平台之一，但公开记录支持的仍是依赖里程碑兑现的可选性故事，而不是可以干净承销的价值故事。
