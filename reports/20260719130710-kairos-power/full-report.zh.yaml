      - number: '5.3'
        title: 部署、依赖与差异化
        blocks:
          - type: paragraph
            body: >-
              Kairos 的差异化不只是一个反应堆物理主张，还包括一套制造和部署逻辑：Albuquerque 的模块制造，Alameda 和 Oak Ridge 的棕地复用，Hermes 2
              的模块化施工方法，以及一条把内部能力、外部伙伴和 DOE 支持混合起来的燃料路径。这个组合支撑了公司的核心论点：相较传统核电建设模式，它可以压缩周期、降低成本。面向客户的版本已经出现在 Google 和 TVA
              路径里，公司呈现的是服务区域、数据中心邻近的商业化模式，而不是泛泛的基荷电站叙事。


              反面是依赖集中。燃料是最清楚的例子。DOE 的 HALEU 材料、BWXT 的 TRISO 合作，以及 Kairos
              的首批燃料分配都显示出真实进展，但也确认产品无法脱离燃料链就绪度。盐生产、施工方法和被监管接受的材料工作也适用同样逻辑。Kairos
              之所以差异化，正因为它试图同时协调这些层；这也意味着任何一层延迟，都可能限制部署速度。
