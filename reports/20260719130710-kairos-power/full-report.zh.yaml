      - number: '1.2'
        title: 创始人、领导层与治理依赖
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个扎根 UC Berkeley 先进反应堆研究生态的创始故事。Berkeley 来源把 Kairos Power 的起源与 Mike Laufer、Ed Blandford 和 Per
              Peterson 关联起来；当前 Kairos 材料则把 Laufer 列为 CEO 兼联合创始人，把 Blandford 列为
              CTO。这个组合对尽调很重要，因为公司的公开身份仍高度依赖创始人技术背书：领导层可信度来自深厚的反应堆物理、许可和技术开发能力，而不是既有核电开发商常见的长期运营历史或受监管公用事业资产负债表。Jeff
              Olson 在商业公告中也很突出，说明随着客户签约变得更核心，Kairos 已补上一个可见的商务拓展声音。


              治理图景只公开了一部分。Kairos
              提供当前运营领导层名单，但留存来源没有给出公开发行人或项目融资型公用事业关联方通常会披露的董事会、所有权或委员会透明度。这种不透明不等于治理薄弱，但确实带来关键人物集中风险：Laufer 和 Blandford
              仍然支撑技术可信度、监管信任、合作伙伴信心和资本形成。好处是叙事一致——一个反应堆家族、一个运营模式、一套信息。代价是公开尽调无法充分测试接班梯队、独立董事会约束力，或创始人与投资人、政府相关资金伙伴之间的战略控制权分配。
