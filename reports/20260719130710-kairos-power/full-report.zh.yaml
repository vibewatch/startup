            title: 即便 Kairos 解决了首批需求，燃料仍是行业瓶颈
            body: DOE 配给和 Hermes 1 合同降低了近期风险，但公开来源仍称美国国内 HALEU 供应不完整，商业规模浓缩也只是正在迈向 2029 年节点。
