      - number: '7.3'
        title: 合作伙伴、客户与市场结构风险可能把强验证点变成集中的商业化漏斗
        blocks:
          - type: paragraph
            body: >-
              Kairos 的具名交易对手质量很高，但名单仍短，这种质量本身也带来集中度风险。Google 是机组组合唯一具名终端客户，TVA
              是唯一具名公用事业承购方。这不削弱客户验证的重要性——很少有先进反应堆创业公司拿得出类似证据——但意味着公司的商业叙事异常暴露于少数交易对手的行为。如果 Google 需求情景或 TVA
              交付路径任一走弱，信号损伤都会被放大。


              第二个市场结构风险是，商业化不仅取决于硬件准备度，还取决于公用事业和电价架构。DOE 与 Latitude 都强调，面向数据中心的核电模式会遇到成本分摊、计量和费率设计问题。因此，Duke
              的大负荷电价争议即便不是 Kairos 合同，也有参考意义。它展示了未来清洁稳定电力路径可能如何围绕谁承担电网升级成本、大负荷需要缴纳多少抵押品、以及数据中心客户是否得到补贴或被恰当隔离而引发反弹。Kairos
              需要的不只是一台能跑的反应堆；还需要采购结构在政治和经济上都扛得住。
