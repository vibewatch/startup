  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Kairos 位于一张紧密依赖网的中心，网络横跨监管机构、DOE 燃料支持、商业浓缩、燃料制造、公用事业交付和锚定客户。
    data:
      nodes:
        - id: core
          label: Kairos 开发核心
          description: Hermes 1、Hermes 2、工程和商业化执行。
        - id: nrc
          label: NRC
          description: 许可、修订、监督以及未来最终许可步骤。
        - id: doe
          label: DOE / HALEU 项目
          description: 燃料分配、ARDP 支持和政策支架。
        - id: cen
          label: Centrus
          description: 为后续 HALEU 供应推进商业浓缩扩产。
        - id: bwxt
          label: BWXT
          description: 探索商业 TRISO 制造。
        - id: tva
          label: TVA
          description: 首个公用事业购电方和交付体系。
        - id: goo
          label: Google
          description: 锚定终端客户和需求信号。
        - id: grid
