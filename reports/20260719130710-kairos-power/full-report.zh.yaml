      - number: '3.3'
        title: 切换成本、供应姿态与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              Kairos 的护城河不是单一反应堆特征，而是一个组合：迭代测试学习模式、Hermes 的先发许可进展、具名 Google 订单储备，以及与 TVA
              相连的电网伙伴故事。对想分阶段部署先进核能、而不是直接跳到超大型电站的买方来说，这个组合可能很有价值。但护城河并不排他。X-energy 现在有 Amazon 和 Energy
              Northwest；TerraPower 有 PacifiCorp 和 DOE 背书的大型参考路径；GE Hitachi 有 Darlington 和 TVA 势能；LWR 同行保留了标准燃料的熟悉度。


              在买方承诺具体场址和许可路径前，多栖下注仍是真实威胁。一旦交易对手选定场址、公用事业伙伴、监管路线和燃料假设，切换成本会急剧上升。但在那之前，大型电力买方可以并行比较多条核能路径。这也是为什么整个品类获得客户验证，反而会削弱泛泛“核能服务数据中心”定位的价值。Kairos
              的竞争耐久性来自把当前组合转成可复制部署，而不是假定竞争对手无法触达同一批客户。
