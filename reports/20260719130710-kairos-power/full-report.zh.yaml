      - number: '8.4'
        title: 退出准备度、投资逻辑破裂触发点和最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              下一条最可能的资本路径更像私募，而不是公开上市。相比近期 IPO，Kairos
              更适合再做一轮私募融资、项目层面资本筹集，或引入与客户和燃料链建设绑定的战略资本。公开市场确实有先进核能投资者，但能进入这些市场的公司仍要承受剧烈波动，并且披露远多于今天的 Kairos。在 Kairos
              给出更清晰的预算桥、合同经济性、股权结构表透明度和燃料时点证据之前，IPO 式估值讨论还太早。


              尽调清单也相应具体。投资者需要当前普通股估值和优先权堆叠、Google/TVA 协议的经济性摘要、延期后修订的 Hermes 预算和应急资金使用情况，以及一条从 DOE HALEU
              配给通向商业规模燃料供应、带日期的桥。如果这些事项干净落地，建议可能上调。如果它们恶化——或者进度和燃料时点再次滑坡——公开证据将支持从有条件兴趣转向更强硬的等待姿态。
