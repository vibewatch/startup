            body: >-
              2024 年 10 月的 Google 协议不只是一次品牌背书。它给了 Kairos Power 一个具名锚定客户、一个到 2035 年 500 MW
              的舰队目标，以及一套把公司迭代开发模式明确延伸到早期商业部署的合同结构。很少有先进反应堆初创公司同时拥有 NRC 许可硬件和超大规模云厂商背书的订单储备。
