        title: 图表
        blocks:
          - type: callout
            title: 最大公开风险不是“核能可能很难”——而是第一次延误已经发生
            body: 到 2026 年中，Hermes 1 已经需要 NRC 修正案，把建设完工日期延到 2029 年。这让时间线风险从理论问题变成了具体、可监控的问题。
