companyProfile:
  summary: >-
    Kairos Power 是一家美国私营先进核能公司，正在开发 KP-FHR：一种氟盐冷却高温反应堆，使用 TRISO 环形球燃料，并按 150 MWe 商业电站设计。公司围绕田纳西州 Hermes
    示范路线推进“测试中学习”模式，同时在 Alameda、Albuquerque 和 Oak Ridge 搭建制造与燃料能力。放在这个品类里，它的公开商业验证异常强：Google 签署主协议，目标到 2035 年最高 500
    MWe；TVA 成为 Hermes 2 首个已披露的公用事业承购方。即便如此，公开证据显示 Kairos 仍未产生收入，也没有披露投资人做严谨判断所需的估值、股权结构表或合同经济性。
