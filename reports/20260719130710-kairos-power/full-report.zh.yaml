      - CV006
      - CV008
      - CV024
      - CV027
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 不同里程碑证明与披露质量组合下的示例估值输出。
    data:
      items:
        - label: 里程碑按时 + 披露改善 + 燃料同步
          value: 2.1
        - label: 里程碑按时 + 条款持续不透明
          value: 1.5
        - label: 仅当前公开事实
          value: 1.1
        - label: 进一步延期 + 无新增客户转化
          value: 0.7
        - label: NuScale 式 FOAK 压力结果
          value: 0.4
