            title: NuScale 是切题的警示先例，不是因为 Kairos 完全一样，而是因为首台套商业化失败的路径常常相似
            body: DOE OIG 与 UAMPS 记录显示，成本、监督和首个客户匹配问题如何在项目取得实质监管进展之后摧毁一个先进反应堆项目。Kairos 的迭代路径更好，但仍必须证明自己能避开同一条失败路径。
