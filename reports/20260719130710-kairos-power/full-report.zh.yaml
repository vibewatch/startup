      - number: '5.2'
        title: 架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              Kairos 公开架构的核心是 KP-FHR：一种氟盐冷却高温反应堆，使用 TRISO 环形球燃料；披露的商业电站为 150 MWe，由两个 75 MWe 机组组成。公司公开材料和 NRC
              记录显示，这套前端规格搭配的是一个后端运营模式，围绕迭代式设计-建造-测试循环、垂直整合和更小的学习资产展开。Hermes 1 对核心技术做非发电示范，Hermes 2 则加入发电桥接资产：两个 35 MWth
              反应堆，共用一套能量转换系统。


              因此，技术故事比许多先进反应堆叙事更容易读懂。买方和投资人能看见反应堆设计、模块制造、场址建设和能量转换如何连接。即便如此，最强证据仍是架构和项目层面的，而不是运营层面的。公开材料描述 Kairos
              计划建什么、打算怎么建；它们还没有提供舰队运行数据、已实现可用率或长期运行验证。
