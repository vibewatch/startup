      - number: '3.4'
        title: 竞争定位的尽调结论
        blocks:
          - type: paragraph
            body: >-
              不应把 Kairos 按先进核能赛道的通吃赢家来承销。更强的投资逻辑要窄一些：在具名大负荷客户、监管上可见的示范路径和可管理电站规模，比单一场址最大输出更重要的服务区域里，Kairos
              是最可信的分阶段清洁稳定电力供应商之一。这个楔子可能非常有吸引力，尤其适合数据中心邻近或区域公用事业场景。


              反面同样重要。对工业蒸汽买方、大型公用事业块状电力采购，或主要看重标准燃料和熟悉水堆谱系的客户来说，Kairos 并不显然是最佳答案。聚变也会争夺想象力和资本，哪怕它不争夺同样的近期部署。实际尽调任务是把
              Kairos 放到买方具体替代方案旁边测试——热需求看 X-energy，规模看 TerraPower 或 Rolls-Royce，熟悉度看 GE Hitachi 或 Holtec，现场封装看 Last
              Energy 或 eVinci——而不是拿它对比一个泛化核能 TAM。这个框架既保留 Kairos 的强项，也保留它的竞争边界。
            claimRefs:
              - CP017
