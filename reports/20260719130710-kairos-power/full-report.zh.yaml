      - number: '3.2'
        title: 能力与封装比较
        blocks:
          - type: paragraph
            body: >-
              Kairos 的公开方案很有辨识度，但并不在所有用例上占优。150 MWe 双机组商业配置、氟盐冷却、TRISO
              球燃料和迭代开发模式，让它比部分更大型同行更容易讲清楚分阶段商业化故事。这支撑了那些想先下注服务区域级增量、或想在多 GW 舰队建设前拿到具名 24/7 清洁电力合同的买方。它也天然匹配 Google
              多机组订单储备，以及随后与 TVA 关联的叙事。


              但竞争对手各有强项。X-energy 在工业蒸汽和高温热上表述更明确。TerraPower、Holtec、GE Hitachi、Westinghouse AP300 和 Rolls-Royce
              都呈现更大的公用事业级方案，或更熟悉的水堆血统。NuScale 仍保有最强的正式许可资质，但也背着更可见的商业采用伤痕。所有公司公开定价都很稀疏，所以能力比较只能靠规模级别、热 /
              电输出特征、客户验证和监管姿态，而不能假装有可用的每兆瓦时成本表。这种不透明本身就是尽调结论。
