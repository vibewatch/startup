      - number: '7.4'
        title: 最重要的下行先例是 NuScale，最重要的缓释手段是严守里程碑闸门
        blocks:
          - type: paragraph
            body: >-
              检验 Kairos 风险画像的最佳外部压力测试，不是泛泛的核能警示故事，而是 NuScale 的 Carbon Free Power Project 已记录的失败路径。DOE
              监察长称，关键风险没有得到有效评估或监控，前置的公共成本分担让纳税人资金暴露在风险中，项目最终仍未达成核心目标。UAMPS 与 CATF
              补上商业层面的教训：订购疲弱、首个客户匹配不佳，即使项目已经取得多年监管进展，也足以拖垮反应堆项目。这对 Kairos 高度切题，因为 Kairos
              同样在试图把示范学习接到商业承购上，同时依赖强交易对手和公私支持。


              Kairos 的缓释逻辑是先学习再放大。Hermes 1、Hermes 2、DOE 燃料支持、BWXT 合作，以及 Google/TVA
              推出路径，都符合迭代式、里程碑闸门管理的策略。方向上，这比直接跳进大型首台套商业电厂更好。但这条路同样耗资本、耗时间，也更依赖人才、供应和顺序纪律。因此，尽调应紧盯一份简短的止损条件清单：进度进一步滑坡、燃料节奏错配、客户承诺恶化，或成本与复杂度更像
              NuScale 剧本而不是 Kairos 的学习剧本。
