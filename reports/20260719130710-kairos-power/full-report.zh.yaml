        - 没有锚定需求的纯商用电站、传统大型反应堆替代项目
        - 公用事业 IRP、发电规划和公共电力采购团队
        - 关键在于 Kairos 部署必须落在可操作的服务区域里，而不是抽象的全国市场
      - - 工业供热与供电园区
        - 先进反应堆可替代化石燃料热并提供稳定电力的供电 + 工艺热场景
        - 纯住宅零售供电和无关制造资本开支
