      - number: '2.2'
        title: 规模测算视角：从广义 TAM 到 Kairos SAM
        blocks:
          - type: paragraph
            body: >-
              最宽但仍有用的市场视角，是 DOE 估计美国到 2050 年可能需要新增 550-770 GW 清洁稳定电力；如果先进核能在 2030 年前开始部署并快速扩张，可能贡献约 200 GW。这就是行业级 TAM
              逻辑：可靠性缺口很大，先进核能可以填上一部分。IEA 和 EIA 数据强化了需求侧，因为它们显示数据中心负荷增长已经不再只是猜想。IEA 预计 2030 年全球数据中心需求将达到 945
              TWh，并称美国数据中心到 2030 年可能贡献近一半电力需求增长；这有力说明，关键地区新增稳定发电不是可选项。


              但 Kairos 自己的 SAM 更窄。公开证据显示，公司瞄准的是超大规模云厂商或公用事业需求能够长期锚定多机组电站的服务区域；起点是 2030 年前后的首个商业部署，以及到 2035 年最高 500 MW 的
              Google 订单储备。场址复用会扩大漏斗——DOE 认为现有核电场址有 60-95 GW，煤电场址有 128-174 GW——但这些只是技术包络，不是已签需求。因此，Kairos 真正的 SOM
              仍应按少数可融资的早期项目衡量，而不是按完整 200 GW 先进核能雄心衡量。
