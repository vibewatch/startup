      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              最重要的客户分层洞察是，使用 Kairos 电力的一方和为 Kairos 项目付费的一方并不总是同一方。在 Google
              协议里，超大规模云厂商是经济需求赞助方和关键承购方，但项目仍需要反应堆开发商、承载公用事业公司或服务区域伙伴，以及可行的并网地理位置。随后的 Google-Kairos-TVA
              合作进一步说明了这一点：采用路径不是简单“卖一座反应堆”，而是“组装一个项目栈”，其中每个利益相关方都控制着不同的门槛资源。


              这种结构形成了一张分层买方地图。超大规模云厂商带来迫切的负荷增长，并愿意签署长期清洁能源协议；公用事业公司和公共电力主体带来选址、电网整合和地方许可关系；工业客户是合乎逻辑的邻近市场，因为 DOE
              自身的先进反应堆材料强调工艺热和负荷匹配。对 Kairos 来说，早期市场按项目推进、重关系。赢单靠的是对齐预算所有者、场址承载方、监管者、燃料来源和终端负荷，而不是往一个抽象电力市场里报一个平准化成本数字。
