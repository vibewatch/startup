        title: 增长驱动、瓶颈与采用节奏
        blocks:
          - type: paragraph
            body: >-
              市场顺风是真实的。数据中心需求在上升，公用事业公司在修正负荷假设，DOE 正在发布明确的先进核能商业化路径，Google 这类买方也证明先进核能可以进入 24/7
              清洁能源采购。这些因素构成了该行业多年来最强的需求环境。它们也利好 Kairos 的迭代商业化模式，因为公司可以指向具体承购逻辑，而不是泛泛的脱碳口号。


              但卡点仍然很硬。HALEU 供应有限，NRC 人手依然是有文件记录的许可瓶颈，同行反向证据——尤其是 NuScale 失败的 UAMPS
              项目——说明即便政策支持很强，第一波经济性和承购结构也可能断裂。公开来源也没有披露 Kairos 具体 PPA 定价，或经过验证的首批舰队成本曲线。因此，核心不确定性已经不再是需求是否存在；而是 Kairos
              和整个行业能否在客户公告写入的 2030-2035 时间表内，把需求转成可复制、可融资的项目。
