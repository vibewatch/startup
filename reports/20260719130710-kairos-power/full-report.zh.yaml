chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、使命与全国布局
        blocks:
          - type: paragraph
            body: >-
              Kairos Power 把自己定位成一家使命驱动的核技术、工程和制造公司，重点是商业化一个反应堆家族，而不是运营多元化发电资产组合。留存的官方材料一致显示，公司总部在 California 的
              Alameda，并形成三点运营布局：Alameda 负责设计、原型和盐实验室工作；Albuquerque 负责制造、盐生产和燃料开发；Tennessee 的 Oak Ridge 承载 Hermes
              反应堆示范园区。因此，公司当前阶段更适合理解为后期商业化，而不是成熟公用事业运营：它在造硬件、验证建设和许可模式，并在拥有可产生收入规模的运营机组前签下未来产出合同。


              Kairos 称，公司的使命是通过商业化 KP-FHR
              设计，交付清洁、可负担、可靠的稳定电力。公司反复把市场窗口放在老化燃气机组、可调度无碳发电需求，以及数字基础设施带来的电力需求增长上。这个叙事很关键，因为它解释了为什么 Kairos
              早早把反应堆开发和面向客户的商业化结构绑在一起，而不是把第一份客户合同当成许可之后的事件。布局、选址和使命表述指向同一个运营判断：把学习集中在少数可控地点，掌握关键制造环节，并在监管和交易对手允许的速度内，尽快从示范走向可复制的舰队式部署。
