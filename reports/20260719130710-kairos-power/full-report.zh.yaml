  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险已经体现在进度里，不只是原则上的假设
        blocks:
          - type: paragraph
            body: >-
              公开记录里，置信度最高的风险是监管排期继续滑坡。Kairos 不是泛泛提醒首台套反应堆建设可能很慢；Hermes 1 已经需要拿到 NRC 修正案，把完工期限从 2026 年底延到 2029 年 4 月。NRC
              自己的安全评估把原因说得很清楚：设施首台套属性带来的开发问题，加上比预期更复杂的场地准备工作。这个点关键，因为它把泛泛的创业风险变成了带时间戳的先例。公司可以拿强监管互动来说明自己在推进，但已经不能再讲一条没有滑坡的首次运行路径。


              缓释因素也真实存在。同一份 NRC 文件称，修正案没有授权新活动，认定不存在重大危害影响，并给出无重大环境影响结论。Hermes 2
              也已经拿到建设许可，文件链条透明。所以法律与监管图景不是被拒或遭敌视，而是合作但严苛的监管。承销时这个差别很重要。Kairos
              比陷在许可不透明里的公司更好，但不如一条干净准时的开发故事。后续日期如果再滑坡，会是重大负面信号，因为“第一次延误”已经发生。
