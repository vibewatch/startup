  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: Kairos 是私营公司，当前公开估值标记未披露，因此采用宽情景区间更合适。
    data:
      items:
        - label: 乐观情景（$B）
          low: 1.6
          high: 2.4
        - label: 基准情景（$B）
          low: 0.9
          high: 1.4
        - label: 悲观情景（$B）
          low: 0.25
          high: 0.75
    approximationNotes: 这些区间是情景输出，依据里程碑转化、燃料时点和披露质量，而非观察到的市场定价。
