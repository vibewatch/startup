      - number: '1.3'
        title: 技术平台与商业化模式
        blocks:
          - type: paragraph
            body: >-
              Kairos Power 的商业故事离不开它的技术架构。KP-FHR 把熔融氟盐冷却剂和 TRISO
              球燃料结合在一个高温、低压设计里；公司认为，这套设计既能带来固有安全性，也能比大型水冷反应堆降低建设成本。当前技术页面显示，最小商业电站由两个 75 MWe 机组组成，总计 150 MWe；Hermes 和
              Hermes 2 则逐级示范许可、建设、燃料处理和供应链执行。换句话说，Kairos 不只是在证明反应堆物理可行，也在证明开发流程、制造栈和项目交付模式能足够重复，进而让未来客户放心。


              这也是为什么迭代开发和垂直整合几乎贯穿所有留存的公司来源。Kairos 使用
              ETUs、盐生产、燃料开发实验室和内部制造，不是把它们当副项目，而是把它们当作降本策略的运营骨架。这是对先进核能经典难题的成熟回答：首座电站很贵，第二座只有在开发商掌握足够多的学习回路、能吸收进度、制造和监管经验时才会变便宜。因此，商业模式混合了公共成本分摊、内部控制的制造能力，以及后续面向大型电力买家的
              PPA。这套模式说得通，但资本开支也很重；学习链条上任何一环卡住，进度都会受拖累。
