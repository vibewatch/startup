  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              分析 Kairos
              Power，不能停在模糊的“全球核能市场”大标题上。公司卖进的是一个更窄的清洁稳定电力问题：特定公用事业公司、超大规模云厂商，以及最终的工业场址，需要可靠的无碳电力，有时还要搭配辅助服务或工艺热，而且这些地区的电网供给正在收紧。EIA
              的 2026 年展望在这里很重要，因为它显示美国电力需求在长期平台期后重新增长，数据中心被列为主要驱动因素。负荷重新加速，先进核能才从政策概念变成采购议题。


              这个边界也说明哪些东西应该排除在外。Kairos
              还不是在竞争所有传统核电替代、所有商用批发电力新建项目，或每一条泛气候科技预算线。它的实际竞争对手，是同一服务区域内能完成相同可靠性任务的技术组合：天然气、可再生能源加储能、需求响应、现有核电延寿或增容，以及其他清洁稳定电力选项。尽调的正确问题不是“核能市场大不大”，而是“在哪些场景里，150
              MWe 级 Kairos 部署最像一个紧迫电力问题的可信解法”。
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM027
              - CM032
