      - number: '4.2'
        title: 单位经济性与项目融资
        blocks:
          - type: paragraph
            body: >-
              对 Kairos 来说，分析单位不是软件订阅或零部件销售，而是一座融资后的电站或一组电站项目。公开商业单元是 150
              MWe，而正在产出学习的发电资产更小。这个错配很关键，因为示范栈可以验证反应堆物理和建设学习，但商业单元经济性在公开信息里仍大多没有定价。EIA 对先进核能资本成本的基准，以及 Lazard
              对新核能数据有限的提醒，都强化同一个判断：成本、融资或进度假设的小错误，都可能吞掉整个利润率逻辑。


              一个简单资本开支代理能把赌注具体化。如果 Kairos 的 150 MWe 电站贴近 EIA 公布的先进核能资本强度基准，那么在业主成本和建设期利息之前，隔夜成本区间已经会很大。公开来源并没有说 Kairos
              会落在那个基准附近——它的整套逻辑正是模块化学习和较低压力架构应改善经济性——但这个基准仍有用，因为它定义了公司必须把成本和进度改善推到什么程度，股权回报才跑得通。
