        title: 留存、耐久性与变现可见度
        blocks:
          - type: paragraph
            body: >-
              公开留存证据几乎全部来自结构，而不是经验数据。核电合同如果进入运行，粘性应当很强：资产寿命长、场址特定，并深度嵌入公用事业和客户规划。Google 的订单储备概念，以及 TVA
              作为公共电力公用事业公司的角色，也支撑一个合理的复购判断。但公开来源仍没有显示合同期限、续约机制、流失、NRR、最低购买义务或终止权。因此，留存逻辑仍是从市场结构和交易对手推断出来的，而不是经过衡量的队列历史。


              变现透明度同样不完整。POWER 报道了 TVA 交易的分时固定市场定价，但公开定价栈和风险分担瀑布都不可见。因此，投资人必须把两个常被混在一起的概念拆开：Kairos
              已经赢得很强的战略客户验证，但公开披露还不足以把这份验证当成充分承销过的收入质量。正确解读是，客户耐久性可能非常好，但公开记录还不能证明。
