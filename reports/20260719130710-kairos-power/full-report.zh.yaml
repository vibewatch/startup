      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              在私营核能初创公司里，Kairos 获得的支持异常充足，但业务仍依赖融资。最强公开证据是 DOE 合同架构：在 $629 million、七年期 Hermes 奖励内，通过基于里程碑的协议最高获得 $303
              million。这份支持很实质，固定价格结构也能提升纪律性和可信度。但它没有消除资本依赖。公司仍在经常性收入出现前，把钱投向制造基础设施、原型机组、许可和燃料路径。公开来源也没有披露手头现金、债务、烧钱速度或现金跑道，所以外部投资人无法判断，如果里程碑后移或舰队经济性成熟更慢，Kairos
              有多少回旋余地。


              同行证据在这里很重要。X-energy 的 $700 million Series D 和 NuScale 的上市公司风险披露都显示，先进核能在稳定客户现金流到来前仍会吃掉巨额资本。在这个背景下，DOE
              支持降低了却没有解决承销问题。下一个有意义的财务去风险事件，不是另一条头条公告，而是项目级预算、资本结构、风险转移和现金节奏证据。
