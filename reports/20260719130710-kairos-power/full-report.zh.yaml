  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局分层：同行、既有厂商与替代方案
        blocks:
          - type: paragraph
            body: >-
              Kairos 并不是在一个没有差异的“SMR 市场”里竞争。真实格局按买方任务拆开。直接先进反应堆同行包括 X-energy、TerraPower、NuScale、Holtec、GE
              Hitachi、Westinghouse、Terrestrial Energy，以及 Last Energy
              这类更小的封装型进入者。邻近叙事包括微反应堆和聚变。现状替代方案同样重要：当买方更看重监管熟悉度、更大的电力块，或可见的建设案例，而不是更新颖的架构时，更大或更传统的核能路径也能赢。


              这套分层很重要，因为采购团队买的不是抽象的反应堆类别，而是一组具体组合：兆瓦级电力块、场址匹配、许可路径、燃料容忍度、商业交易对手和进度信心。在部分维度上，Kairos
              确实差异化明显，尤其是在分阶段部署和具名超大规模云厂商需求重要的场景里。在另一些维度上，它只是多个可信选项之一。因此，正确的竞争问题不是 Kairos
              是否“最好”，而是相对于替代方案，它的规模、热力学和商业化路径组合最适合哪些客户任务。
