      - number: '7.2'
        title: 燃料、建设与运营风险都卡在同一个瓶颈：太多首台套系统必须一起成熟
        blocks:
          - type: paragraph
            body: >-
              核心运营风险不是某个孤立工程问题，而是反应堆建设、燃料供应、燃料制造和并网节奏要同时成熟。Hermes 使用含 HALEU 的 TRISO 球形燃料，DOE 明确称，国内 HALEU
              供应商还无法提供先进反应堆开发商最终所需的规模。Kairos 为 Hermes 1 锁定 DOE 来源的 HALEU，合理压低了近期风险，但这只是过桥安排，不是广泛商业市场已经成型的证明。ANS 和 DOE
              材料说得很清楚，配给项目存在，正是因为供应链还不完整。


              执行复杂度会在这里叠加。Centrus 目标是在 2029 年转向更大规模 HALEU 生产；BWXT 现在才开始与 Kairos 探索商业 TRISO 制造；DOE 仍把配给描述为持续流程。这些事实不意味着
              Kairos 会失败，但意味着时间错配仍然可能。再加上 DOE 自己提醒，首台套数据中心反应堆造价高、建设慢，运营风险栈就很清楚：即便反应堆物理可行，商业路径仍可能在燃料、制造或建设学习曲线上放慢。
