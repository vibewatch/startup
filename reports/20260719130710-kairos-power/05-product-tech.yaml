- id: TE002
  title: Workflow / use-case table
  columns:
  - user job
  - current workflow pain
  - Kairos product / asset
  - disclosed benefit
  - current limitation
  rows:
  - - Need 24/7 clean power for data-center-heavy load growth
    - Clean firm power is scarce and generic grid energy may not meet carbon-free goals
    - KP-FHR commercial plant plus Google / TVA deployment path
    - Service-territory-aligned clean power, ancillary services, and environmental attributes
    - No public tariff or full operating proof yet
  - - Need to de-risk a novel reactor before fleet deployment
    - Utilities and buyers resist first-of-a-kind full-scale jumps
    - Hermes 1 then Hermes 2 demo ladder
    - Progressive validation of licensing, construction, fuel, and operations
    - Learning assets do not equal full fleet economics
  - - Need lower-cost construction path than conventional bespoke nuclear
    - Traditional nuclear projects are slow and highly site-custom
    - Modular construction and off-site fabrication via Albuquerque + Oak Ridge
    - Precast, modular, and factory-leaning methods intended to lower cost and timeline
    - No public realized cost-down curve yet
  - - Need fuel and materials readiness for advanced reactor deployment
    - HALEU and TRISO supply are sector bottlenecks
    - DOE HALEU process plus BWXT TRISO pathway
    - Visible first-fuel and manufacturing path for demos and fleet ambitions
    - Fleet-scale volume and cost remain uncertain
  - - Need engineering iteration before nuclear operations
    - Novel systems are risky to change late in project
    - Alameda design/prototyping and ETU non-nuclear test units
    - Iterative testing before nuclear deployment
    - Public runtime test metrics are sparse
  notes: The workflow emphasizes why Kairos built a ladder of assets rather than jumping directly to a first commercial plant.
