chapter:
  number: 5
  title: Product & Technology
  summary: 'Kairos Power’s public product is best understood as a commercialization system built around the KP-FHR reactor, the Hermes demonstration ladder, and a visibly assembled manufacturing, salt, and fuel backbone across Alameda, Albuquerque, and Oak Ridge. The evidence is strong on reactor architecture, site roles, construction-learning methods, and regulatory detail—especially for Hermes and Hermes 2. It is also increasingly strong on the fuel path, with BWXT collaboration and DOE HALEU processes. The weakest areas remain operating proof, fleet-scale fuel throughput, and digital-control disclosure. In short: the technical stack is unusually legible for a startup, but commercial-runtime confidence still lies ahead.'
  contentRequirements:
