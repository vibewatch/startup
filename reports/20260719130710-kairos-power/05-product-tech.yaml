    topic: operating-performance-data
    missingEvidence: No public uptime, availability, heat-balance, or maintenance data for Hermes or a commercial Kairos reactor.
    whyItMatters: Runtime performance is required to move from design confidence to bankable technology confidence.
    diligencePath: Request prototype and test-unit operating data, reliability results, maintenance plans, and expected commercial availability assumptions.
