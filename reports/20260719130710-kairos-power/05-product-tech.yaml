- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer
  - publicly disclosed design
  - operating role
  - strength
  - open technical question
  rows:
  - - Core reactor design
    - Fluoride salt-cooled high-temperature reactor with TRISO annular pebble fuel
    - Generate steady heat for conversion to clean power
    - Low-pressure, high-temperature architecture differentiated from conventional water-cooled systems
    - No public long-duration operating data
  - - Fuel system
    - TRISO pebbles using HALEU
    - Provide robust fuel form and functional containment contribution
    - NRC materials explicitly describe fuel and containment role
    - Fleet-scale fuel cost and qualification cadence are not public
  - - Power conversion
    - Shared steam-powered Rankine cycle in Hermes 2; commercial plant at 150 MWe
    - Convert reactor heat into grid electricity
    - Makes product legible as power-producing plant rather than only test reactor
    - Commercial turbine and balance-of-plant performance still unproven
  - - Construction model
    - Modular construction, precast concrete, seismically isolated foundation, off-site fabrication
    - Reduce schedule and cost, improve repeatability
    - Concrete public construction-method disclosure for a startup reactor company
    - No realized time-or-cost savings reported yet
  - - Manufacturing / salt / fuel backbone
    - Albuquerque campus plus molten salt facility and BWXT collaboration
    - Support repeatable reactor production and fuel readiness
    - Visible enabling infrastructure rather than abstract supply claims
    - Actual throughput and yield data are absent
  - - Support / controls / cyber
    - Public sources focus on physical and regulatory layers
    - Run plant safely and reliably in operation
    - Regulatory process gives some trust surface
    - OT cyber architecture and named control vendors remain under-disclosed
  notes: The table separates visible architecture from the least-disclosed digital and runtime layers.
