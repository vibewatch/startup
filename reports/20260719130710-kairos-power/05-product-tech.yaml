- id: trust-quality-and-open-technical-gaps
  title: Trust, quality, and open technical gaps
  body: |-
    The trust case around Kairos is strongest on physical safety logic and regulatory engagement. NRC pages for Hermes and Hermes 2 give unusually specific descriptions of the fuel, power level, and containment approach, including the role of TRISO fuel in functional containment. Public DOE and company materials also give visibility into prototype assets, construction techniques, and site choices. That is stronger quality evidence than many early-stage energy companies can show.

    But the public record still stops short of a full operating diligence room. No retained source gives achieved uptime, fleet maintenance metrics, control-system vendor detail, or OT cybersecurity architecture. For a nuclear product, those omissions do not invalidate the technology case, but they do shape the diligence posture. The result is a chapter with strong confidence in the visible physical and regulatory stack, combined with clear acknowledgement that commercial operating proof and digital-control assurance are still future work rather than public fact.
