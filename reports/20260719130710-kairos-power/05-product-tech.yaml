  claims:
  - id: CE001
    statement: 'Kairos’ product is best understood as a commercialization stack that sells clean firm power outcomes, not a standalone reactor SKU: the public surface spans a commercial KP-FHR plant, demonstration reactors, fuel and salt capabilities, and site-specific deployment infrastructure.'
    type: inferred
    topic: product-definition
    sourceRefs:
