    severity: material
    topic: digital-controls-and-cyber
    missingEvidence: Named control-system vendors, OT cybersecurity architecture, and software-boundary details are not visible in retained public sources.
    whyItMatters: Control and cyber posture are critical parts of nuclear trust and operational resilience.
