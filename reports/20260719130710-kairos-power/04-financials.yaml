    - Request fleet fuel-procurement schedule and cost assumptions
  - - Future project finance
    - No public debt, lender, or project-finance commitments retained
    - Unknown / undisclosed
    - Determines whether backlog converts into buildable plants
    - Request financing strategy for first commercial plants
  notes: Capital adequacy is directionally credible but quantitatively under-disclosed in public evidence.
