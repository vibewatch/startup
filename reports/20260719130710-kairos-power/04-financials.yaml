- id: public-gaps-and-adverse-signals
  title: Public gaps and adverse signals
  body: |-
    The dominant financial diligence blocker is disclosure. Public sources do not provide cash balances, burn, runway, debt covenants, customer prepayments, project-level EPC contingencies, realized module cost, or any bankable tariff data. Caplight’s public output confirms that Kairos has visible funding rounds and investors, but even there the fetched information is too incomplete to rely on for exact valuation or round underwriting. That forces a conservative stance: official DOE commitments, fuel milestones, and named customer contracts carry far more weight than tertiary valuation pages.

    Adverse evidence is also real. TechCrunch explicitly treated the 2030 timeline as optimistic, and the broader sector has clear cautionary comparables in NuScale’s 10-K and capital needs across peers. None of this disproves Kairos’ eventual financial upside. It means only that the public-data verdict remains research-more. Before underwriting revenue quality, margin, or valuation, investors need private budgets, contract economics, cash data, and a clearer view of how milestone timing converts into liquidity and project finance.
