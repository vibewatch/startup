- id: capital-adequacy-and-financing-dependency
  title: Capital adequacy and financing dependency
  body: |-
    Kairos is unusually well supported for a private nuclear startup, but the business remains financing-dependent. The strongest public evidence is the DOE contract architecture: up to $303 million under a milestone-based agreement inside a $629 million, seven-year Hermes award. That support is material, and the fixed-price structure can improve discipline and credibility. But it does not remove capital dependency. The company is still spending on manufacturing infrastructure, prototype units, licensing, and fuel pathways before recurring revenue exists. Public sources also do not disclose cash on hand, debt, burn, or runway, so outside investors cannot tell how much flexibility Kairos has if milestones move or fleet economics take longer to mature.

    Peer evidence matters here. X-energy’s $700 million Series D and NuScale’s public-company risk disclosures both suggest that advanced nuclear still consumes very large amounts of capital before durable customer cash flow arrives. In that context, DOE support lowers but does not solve the underwriting problem. The next meaningful financial de-risking event is not another headline announcement; it is project-level evidence on budgets, capital stack, risk transfer, and cash timing.
