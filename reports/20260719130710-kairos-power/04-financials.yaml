- id: TI001
  title: Revenue streams table
  columns:
  - stream
  - mechanism
  - unit
  - current value/status
  - revenue quality
  - diligence ask
  rows:
  - - DOE milestone payments
    - Performance-based, fixed-price milestone contract tied to Hermes deliverables
    - milestone / reimbursable program payment
    - Up to $303M DOE support inside a $629M seven-year award
    - Non-dilutive but conditional and milestone-dependent
    - Obtain payment schedule, milestone gating, and working-capital assumptions
  - - Reactor project delivery
    - Develop, construct, and operate reactor plants for counterparties
    - plant / site / program
    - Future-facing only; no operating commercial fleet disclosed
    - Future project revenue; not current recurring revenue
    - Review EPC scope, completion guarantees, and milestone invoicing
  - - Energy sales under PPAs
    - Electricity sold under long-term agreements
    - MWh / capacity / plant output
    - Google contract discloses capacity targets, not realized energy sales
    - Potential high-quality revenue if operating; currently backlog-like
    - Request tariff structure, capacity payments, escalation, and settlement mechanics
  - - Ancillary services and environmental attributes
    - Sale of non-energy grid value and clean-energy attributes
    - services / credits / attributes
    - Mentioned in Kairos official materials, but unpriced publicly
    - Plausible monetization tail; currently unpriced
    - Request contract definitions, market assumptions, and revenue-recognition treatment
  - - Lifecycle engineering / replacement parts / services
    - Support, maintenance, part replacement, and fleet services
    - service contract / outage / component
    - Implied by platform logic and Berkeley lifecycle discussion, not priced publicly
    - Potential recurring tail; highly speculative publicly
    - Obtain service attach-rate assumptions and replacement-part margin model
  notes: Public sources support the monetization logic but not realized revenue, ASPs, or margin.
