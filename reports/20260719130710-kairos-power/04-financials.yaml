company:
  name: Kairos Power
chapter:
  number: 4
  title: Financials
  summary: 'Kairos Power is not yet underwriteable on public operating revenue: no commercial reactor fleet is running, project pricing is undisclosed, and most visible capital comes from DOE milestone support plus private funding rather than recurring electricity sales. The strongest public financial anchor is the Hermes ARDP structure—$629 million total over seven years with up to $303 million from DOE under a fixed-price milestone contract—but that still leaves a large private-capital and execution burden. Public evidence supports a plausible future model spanning plant delivery, PPAs, ancillary services, and lifecycle value, yet cash, burn, debt, capex, and tariff terms remain private. The right verdict is therefore research-more with capital intensity at the center.'
  contentRequirements:
  - Revenue streams, pricing model, revenue mix, and recognition issues where supportable.
  - GTM motion and sales efficiency proxies (cycle, CAC/payback or proxy, channel economics).
  - Cost structure, gross margin drivers, working capital, capex, and service-delivery costs.
  - Public traction (revenue, ARR, GMV, units, locations, utilization, active users) versus private-metric gaps.
  - Capital adequacy and financing dependency — cash on hand, burn, runway, planned use of funds, next-round trigger, and debt/project-finance obligations. Historical round-by-round chronology lives in Company Overview; refer to that chronology in prose, but do not copy Company Overview claim ids; if Financials needs a funding fact, mint a local Financials claim with its own sourceRefs.
  - Financial verdict on revenue quality, margin path, capital intensity, and diligence blockers.
  plannedTables:
  - name: Revenue streams table
    requirement: stream, mechanism, unit, current value/status, quality, diligence ask.
  - name: Pricing / monetization table
    requirement: price/unit/contract, list vs realized pricing, discounts/unknowns, source.
  - name: Unit economics table
    requirement: metric, value/null, confidence, why it matters, diligence ask.
  - name: Capital adequacy table
    requirement: cash on hand, monthly burn, runway months, planned use of funds, next-round trigger, debt/project-finance obligations; refer to the Company Overview funding chronology without copying its claim ids, and mint local Financials claims only for financing facts needed in this table.
  - name: Public financial gaps table
    requirement: missing private metrics, impact, exact diligence path.
  plannedFigures:
  - name: Revenue model bridge
    requirement: How customer activity converts into revenue and gross profit.
    acceptedTypes:
    - flow
    - waterfall
  - name: Unit economics bridge
    requirement: Use inputs when available; otherwise qualitative nodes with approximationNotes.
    acceptedTypes:
    - flow
  - name: Financial estimate range
    requirement: Revenue, burn, runway, margin, or valuation-input ranges with source-backed bounds.
    acceptedTypes:
    - range
  - name: Capital intensity / cash-flow map
    requirement: Capex, inventory, project finance, manufacturing scale-up, or credit exposure.
    acceptedTypes:
    - flow
    - matrix
    - waterfall
  evidenceStrategy:
  - Revenue/pricing from official pricing, customer contracts/examples, filings, investor announcements, channel data.
  - Capital adequacy from latest reported cash position, burn signals, hiring/layoffs, debt/credit facilities, and credible investor coverage. Use Company Overview as background for the funding chronology, but do not copy its claim ids across chapters.
  - Unit economics from public-company comps, customer case studies, cost benchmarks, partner terms, channel fees.
  - Adverse checks for burn, margin compression, pricing pressure, defaults, inventory issues, customer concentration.
  qualityBar:
  - Separate list pricing, company-claimed traction, corroborated metrics, estimates, and unavailable private data.
  - Do not force SaaS, marketplace, or hardware metrics unless the revenue mechanism supports them.
  - Do not restate the historical funding chronology; reference it from Company Overview and focus on forward capital adequacy.
  - Official pricing is list pricing, not realized revenue or margin.
  - Every null unit-economics field needs a specific diligence request.
  - Scenario inputs must be labeled public, estimated, or unavailable.
sections:
- id: revenue-model-and-monetization
  title: Revenue model and monetization
  body: |-
    Kairos’ financial model is still better understood as a development-stage bridge than as an operating nuclear-utility P&L. No retained public source shows commercial reactor revenue today. Instead, the near-term economic story combines DOE milestone payments, private capital, partner-backed development work, and the gradual conversion of prototypes and permits into future project revenue. The Google announcement is especially important because it clarifies what Kairos eventually expects to monetize: not just reactor delivery, but energy, ancillary services, and environmental attributes under PPAs. The TVA collaboration adds a second clue that the eventual business model is service-territory and project-structure heavy rather than a simple hardware sale.

    That said, public monetization quality remains low today. The company and its partners disclose capacity targets and strategic logic, but they do not disclose tariff levels, project ASPs, EPC margin, fuel pricing, or revenue-recognition mechanics. Investors should therefore treat the Google backlog as future demand validation rather than current revenue quality. The key question is not whether monetization logic exists—it does—but when that logic becomes invoiced, repeated, and margin-bearing.
