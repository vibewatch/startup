  headquarters: Alameda, California, USA
  productSummary: >-
    KP-FHR advanced reactors using fluoride-salt cooling, high-temperature operation, and TRISO
    annular pebble fuel; Kairos is developing demonstration assets first and plans commercial
    two-unit plants totaling about 150 MWe.
  customerFocus: >-
    Hyperscale data centers, public utilities, and eventually other large clean-firm-power buyers
    that need long-duration carbon-free electricity and may value industrial-heat optionality.
  businessModel: >-
