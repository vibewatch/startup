tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Hyperscaler clean firm power
    - Long-term PPAs for 24/7 carbon-free electricity, ancillary services, and project development tied to specific data-center loads
    - Generic REC purchases, short-duration backup, non-firm wholesale energy
    - Hyperscaler energy and infrastructure teams
    - Most visible proof point today via Google; best evidence of urgent willingness to sign for new advanced nuclear supply
  - - Utility or public-power service territories
    - Grid-connected reactor projects, resource planning, interconnection, siting, and reliability capacity in regions with load growth
    - Merchant-only builds without anchor demand, conventional large-reactor replacement programs
    - Utility IRP, generation-planning, and public-power procurement teams
    - Critical because Kairos deployments must sit in workable service territories rather than abstract national markets
  - - Industrial heat and power campuses
    - Power plus process-heat use cases where advanced reactors can displace fossil heat and provide firm electricity
    - Purely residential retail supply and unrelated manufacturing capex
    - Industrial energy, operations, and decarbonization budgets
    - Adjacency supported by DOE program materials, but not yet Kairos’ primary public beachhead
  - - Site-reuse opportunities at nuclear and coal locations
    - Projects that leverage existing sites, infrastructure, and prior licensing familiarity
    - Greenfield land banking with no local grid or community logic
    - Developer plus host community and utility
    - Important supply-side market filter because siting practicality shapes which demand can actually be served
  - - Status-quo substitutes
    - Gas plants, renewables-plus-storage, demand response, and existing-nuclear life extension solving the same reliability job
    - Irrelevant climate-tech categories outside electricity reliability
    - Same end buyers as above
    - Defines real competition for Kairos more accurately than broad nuclear TAM marketing
  notes: Defines the investable market around clean firm power procurement rather than total global nuclear spend.
