- id: buyer-user-payer-segmentation
  title: Buyer, User, and Payer Segmentation
  body: |-
    The most important customer segmentation insight is that the user of Kairos power and the payer for Kairos projects are not always the same party. In the Google agreement, the hyperscaler is the economic demand sponsor and key offtaker, but the project still needs a reactor developer, a host utility or service-territory partner, and a workable interconnection geography. The later Google-Kairos-TVA collaboration underscores that point: the adoption path is less ‘sell a reactor’ and more ‘assemble a project stack’ in which each stakeholder controls a different gating resource.

    That structure creates a tiered buyer map. Hyperscalers bring urgent load growth and willingness to sign long-dated clean-energy agreements; utilities and public-power actors bring siting, grid integration, and local permitting relationships; industrial customers are a logical adjacency because DOE’s own advanced-reactor materials emphasize process heat and load matching. For Kairos, this means the early market is project-by-project and relationship-heavy. Winning requires aligning budget owner, site host, regulator, fuel source, and end-use load—not simply quoting a levelized cost number into an abstract power market.
