- id: growth-drivers-bottlenecks-and-adoption-timing
  title: Growth Drivers, Bottlenecks, and Adoption Timing
  body: |-
    The market tailwinds are real. Data-center demand is rising, utilities are revising load assumptions, DOE is publishing explicit advanced-nuclear commercialization pathways, and buyers like Google are proving that advanced nuclear can fit into 24/7 clean-energy procurement. These factors create the strongest demand environment the sector has had in years. They also favor Kairos’ iterative commercialization model because the company can point to specific offtake logic rather than general decarbonization rhetoric.

    Still, the gating constraints remain severe. HALEU availability is limited, NRC staffing is still a documented licensing bottleneck, and adverse peer evidence—especially NuScale’s failed UAMPS project—shows that first-wave economics and offtake structures can break even when policy support is strong. Public sources also do not reveal Kairos-specific PPA pricing or a validated first-fleet cost curve. As a result, the central uncertainty is no longer whether demand exists; it is whether Kairos and the sector can convert demand into repeatable, financeable projects on the 2030-2035 timeline now embedded in customer announcements.
