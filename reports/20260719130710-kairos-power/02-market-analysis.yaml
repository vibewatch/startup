  - TM001
  figureRefs: []
- id: sizing-lenses-from-broad-tam-to-kairos-sam
  title: 'Sizing Lenses: From Broad TAM to Kairos SAM'
  body: |-
    The broadest useful market lens is DOE’s estimate that the United States may need 550-770 GW of additional clean firm power by 2050, with advanced nuclear supplying roughly 200 GW if deployment starts by 2030 and scales quickly. That is the sector-wide TAM logic: a large reliability gap exists, and advanced nuclear could fill part of it. The IEA and EIA data strengthen the demand side of that case by showing that data-center load growth is no longer speculative. The IEA’s 945-TWh global data-center-demand projection by 2030, plus its claim that U.S. data centers could drive nearly half of electricity-demand growth through 2030, makes a strong case that new firm generation is not optional in key regions.

    But Kairos’ own SAM is tighter. Public evidence suggests the company is targeting service territories where hyperscaler or utility demand can anchor multi-unit plants over time, starting from a first commercial deployment by 2030 and an up-to-500-MW Google orderbook through 2035. Site reuse expands the funnel—DOE sees 60-95 GW at existing nuclear sites and 128-174 GW at coal sites—but those are technical envelopes, not booked demand. Kairos’ true SOM therefore remains measured in a handful of financeable early projects rather than in the full 200-GW advanced-nuclear ambition.
