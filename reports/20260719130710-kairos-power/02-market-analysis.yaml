chapter:
  number: 2
  title: Market Analysis
  summary: 'Kairos Power’s market is best understood as the emerging clean-firm-power wedge where hyperscalers, utilities, and selected industrial users need reliable low-carbon electricity in specific service territories—not as a generic share of global nuclear spend. Public evidence is now strong on demand pull: EIA sees renewed U.S. load growth, the IEA says data-center electricity demand could reach about 945 TWh globally by 2030, and DOE sees 550-770 GW of additional U.S. clean firm power need with advanced nuclear potentially supplying about 200 GW. But Kairos’ practical SAM remains much narrower and conversion still depends on HALEU, licensing throughput, siting, and first-fleet economics that are not yet publicly bankable.'
  contentRequirements:
  - Market boundary, included/excluded spend, adjacencies, and status-quo substitutes.
  - TAM/SAM/SOM or evidence-constrained sizing using multiple lenses, not one broad estimate.
  - Buyer/user/payer segmentation with budget ownership and adoption path.
  - Growth drivers and adoption constraints (regulation, switching cost, ROI, trust, capital intensity).
  - Sizing/adoption diligence gaps and contradictory estimates preserved.
