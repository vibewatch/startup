    - QM002
  - id: CM002
    statement: EIA says that after roughly 15 years of nearly flat U.S. electricity consumption, demand increased by 2.1% per year on average over the prior five years and is projected to keep growing through 2050 at 0.9% to 1.6% annually, with data-center server energy use a major factor.
    type: observed
    topic: demand-growth
    sourceRefs:
    - SM003
    - SM004
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QM003
    - QM017
  - id: CM003
    statement: The IEA projects global electricity demand from data centers will more than double by 2030 to around 945 TWh, creating a materially larger pool of power demand than existed when many first-wave SMR market decks were written.
    type: third-party-reported
    topic: data-center-demand
    sourceRefs:
    - SM002
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QM004
    - QM017
  - id: CM004
    statement: The IEA further says electricity demand from AI-optimized data centers is projected to more than quadruple by 2030, making AI a specific demand accelerator rather than generic digital-load growth.
    type: third-party-reported
    topic: ai-demand
    sourceRefs:
    - SM002
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QM004
    - QM017
  - id: CM005
    statement: In the United States, the IEA expects data centers to account for almost half of electricity-demand growth through 2030, which strengthens the commercial case for new clean firm generation located near large-load campuses.
