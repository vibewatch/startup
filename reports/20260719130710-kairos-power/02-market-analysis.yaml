sections:
- id: market-boundary-and-status-quo-substitutes
  title: Market Boundary and Status-Quo Substitutes
  body: |-
    Kairos Power should not be analyzed against a vague ‘global nuclear market’ headline. The company is selling into a narrower clean-firm-power problem: specific utilities, hyperscalers, and eventually industrial sites need reliable carbon-free electricity, sometimes paired with ancillary services or process heat, in geographies where grid supply is tightening. EIA’s 2026 outlook matters here because it shows U.S. electricity demand is growing again after a long plateau, with data centers identified as a major driver. That re-accelerating load is what turns advanced nuclear from a policy concept into a procurement conversation.

    The boundary logic also clarifies what should be excluded. Kairos is not yet competing for every conventional nuclear replacement, every merchant wholesale-power build, or every generic climate-tech budget line. Its practical competition is the set of technologies that can satisfy the same reliability job in the same service territories: gas, renewables-plus-storage, demand response, life-extension or uprate of existing nuclear, and other clean-firm options. This matters for diligence because the right question is not ‘is nuclear a big market?’ but ‘where is a 150-MWe-class Kairos deployment the most credible solution to an urgent power problem?’
  claimRefs:
  - CM001
  - CM002
  - CM008
  - CM027
  - CM032
  - CM037
