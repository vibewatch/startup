  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: first-fleet economics
    missingEvidence: Kairos-specific PPA pricing, target LCOE, owner-cost assumptions, and contingency structure for first commercial projects are not public.
    whyItMatters: Demand proof is only investable if the first fleet can clear customer budgets and project-finance scrutiny at an acceptable cost of power.
    diligencePath: Request the Google commercial term sheet, internal P50/P90 capex model, EPC assumptions, and any lender-grade economics used for the first commercial site.
    relatedQuestionRefs:
    - QM023
    - QM025
    relatedTableRefs:
    - TM002
    - TM004
  - type: missing-source
    severity: material
    topic: customer diversification beyond Google
    missingEvidence: No retained public source names additional non-Google Kairos offtakers with binding capacity commitments.
    whyItMatters: A one-customer public pipeline can validate demand direction while still leaving concentration risk high.
    diligencePath: Ask management for signed LOIs, term sheets, or active pipeline summaries for additional hyperscaler, utility, and industrial prospects.
    relatedQuestionRefs:
    - QM022
    - QM023
    relatedTableRefs:
    - TM003
    - TM004
  - type: conflicting-data
    severity: medium
    topic: market-sizing translation from sector need to Kairos SAM
    missingEvidence: Public sources provide strong sector-wide demand and siting estimates but do not isolate the portion accessible to Kairos by region, service territory, or buyer class.
    whyItMatters: Without a disciplined SAM filter, investors can over-read a 200-GW sector outlook as company-specific addressable demand.
    diligencePath: Build a bottoms-up SAM using named utilities, hyperscaler campuses, service territories, siting candidates, and interconnection feasibility instead of global or national TAM headlines.
    relatedQuestionRefs:
    - QM010
    - QM024
    - QM025
    relatedTableRefs:
    - TM001
    - TM002
  - type: missing-source
    severity: medium
    topic: post-Hermes HALEU coverage
    missingEvidence: Public evidence confirms HALEU for Hermes’ first fuel load but does not show secure fuel supply for follow-on commercial deployments.
    whyItMatters: Fuel access could become the pacing item for any orderbook beyond the first demonstration reactor.
    diligencePath: Obtain DOE allocation detail, fuel-manufacturing plans, commercial supply contracts, and a project-by-project HALEU coverage schedule.
    relatedQuestionRefs:
    - QM019
    - QM022
    relatedTableRefs:
    - TM004
