  claims:
  - id: CM001
    statement: Kairos Power’s relevant market is the sale of clean firm electricity and related grid services into specific U.S. load pockets—especially hyperscaler data centers, utility service territories, and selected industrial campuses—rather than the entire global nuclear sector or all power-generation capex.
    type: inferred
    topic: market-boundary
    sourceRefs:
