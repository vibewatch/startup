- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Renewed U.S. electricity-demand growth
    - positive
    - Current through 2050 outlook
    - Improves willingness to procure new firm generation rather than rely only on efficiency or flat-load assumptions
    - Which specific service territories in Kairos pipeline show the tightest reserve margins and data-center growth?
  - - AI and data-center load expansion
    - positive
    - Current through 2030
    - Creates urgent large-load buyers that value 24/7 clean power and may sign long-dated agreements
    - How many hyperscaler prospects beyond Google are in live discussions, and at what load sizes?
  - - DOE commercialization and siting support
    - positive
    - Current
    - Provides policy credibility, demand aggregation logic, and practical siting pathways
    - Which DOE programs directly de-risk Kairos’ first five projects versus only sector optics?
  - - Load-matching and process-heat versatility
    - positive
    - Medium term
    - Broadens addressable use cases beyond generic baseload electricity
    - Which non-data-center segments are genuinely near-term versus only strategic adjacency?
  - - HALEU supply limitation
    - negative
    - Current through early fleet buildout
    - Could slow deployments even when customer demand exists
    - What fuel allocations or supply contracts cover projects after Hermes 1?
  - - NRC staffing and licensing throughput
    - negative
    - Current
    - Can delay sector scaling irrespective of customer appetite
    - What queue position and review-resourcing assumptions underpin Kairos’ 2030 target?
  - - FOAK capital-cost and financing risk
    - negative
    - Current through first commercial plants
    - Can break utility-offtake structures, as NuScale demonstrated
    - What fixed-price EPC, contingency, and owner-cost assumptions support Kairos’ first commercial site?
  - - Orderbook concentration around one flagship buyer
    - negative
    - Near term
    - Makes public demand proof strong but narrow
    - How diversified is the customer pipeline beyond Google / TVA-linked work?
  notes: The binding question is conversion of demand into financeable, fuelable, licensable projects on schedule.
