      description: Midpoint of DOE’s 550-770 GW clean-firm-power requirement for a net-zero-compatible grid.
    - label: 'SAM proxy: U.S. advanced nuclear capacity potential by 2050'
      value: 200
      description: DOE pathway estimate for additional advanced-nuclear capacity if deployment begins by 2030 and scales rapidly.
    - label: 'SOM proxy: Publicly named Kairos anchor orderbook through 2035'
      value: 0.5
      description: Google agreement covering up to 500 MW of new capacity; meaningful demand proof but far below total SAM.
  approximationNotes: Values are expressed in GW for comparability. The TAM uses the midpoint of a DOE range. The SOM proxy is not total Kairos market share; it is the currently named public anchor orderbook.
