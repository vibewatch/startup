  claims:
  - id: CP001
    statement: Kairos competes inside a crowded clean-firm-power landscape that includes direct advanced-reactor peers (X-energy, TerraPower, NuScale, Holtec, GE Hitachi, Westinghouse, Terrestrial Energy, Last Energy), adjacent microreactor and fusion narratives, and status-quo substitutes such as larger reactor projects and other dispatchable power options.
    type: observed
    topic: landscape
    sourceRefs:
    - SP003
    - SP006
    - SP008
    - SP011
    - SP013
    - SP019
    - SP021
    - SP026
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QP001
    - QP002
  - id: CP002
    statement: For buyers, the sharper competitive cut is by job-to-be-done—utility-scale replacement, staged service-territory deployment, industrial heat, on-site modular power, or long-dated fusion optionality—rather than by the generic label “SMR.”
    type: inferred
    topic: segmentation
    sourceRefs:
    - SP001
    - SP003
    - SP008
    - SP018
    - SP026
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP002
    - QP025
  - id: CP003
    statement: Kairos’ public technical differentiation is a fluoride-salt-cooled high-temperature reactor using TRISO annular pebble fuel, packaged as a 150 MWe commercial plant in a two-over-one, two-by-75-MWe configuration and developed through an iterative test-to-learn model.
    type: observed
    topic: kairos-differentiation
    sourceRefs:
    - SP001
    - SP002
    - SP028
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QP003
    - QP009
  - id: CP004
    statement: 'Kairos’ commercial differentiation is not only its reactor architecture but its staged commercialization path: Hermes licensing, a named Google orderbook, and a later TVA-linked service-territory collaboration.'
    type: observed
    topic: kairos-differentiation
    sourceRefs:
    - SP028
    - SP029
    - SP030
    - SP031
    confidence: high
    freshness: recent
    answersQuestionRefs:
    - QP004
    - QP013
  - id: CP005
    statement: X-energy positions the Xe-100 as an 80 MWe, 200 MWt high-temperature gas-cooled reactor that can deliver approximately 565°C steam, use TRISO-X fuel, and scale to four-to-twelve units per site.
    type: observed
    topic: x-energy-profile
    sourceRefs:
    - SP003
    - SP004
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QP005
    - QP009
  - id: CP006
    statement: 'Amazon and Energy Northwest give X-energy unusually strong customer proof: the Washington project is described as four SMRs for about 320 MW initially with an option to scale to 960 MW, and Amazon says its investment supports more than five gigawatts of X-energy equipment manufacturing capacity.'
    type: observed
    topic: x-energy-customer-proof
    sourceRefs:
    - SP005
    - SP022
    confidence: high
    freshness: recent
    answersQuestionRefs:
    - QP007
    - QP013
  - id: CP007
    statement: TerraPower’s Natrium sits in a larger near-term scale class than Kairos, with NRC materials describing a 345 MWe sodium fast reactor and TerraPower highlighting DOE’s 50/50 ARDP cost share with up to $2 billion authorized for the project.
    type: observed
    topic: terrapower-profile
    sourceRefs:
    - SP008
    - SP027
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QP006
    - QP009
  - id: CP008
    statement: 'TerraPower’s utility-grade signal is strengthened by PacifiCorp planning work: TerraPower says the 2023 IRP includes two additional Natrium systems, for 1,500 MW of advanced nuclear across three total Natrium reactors.'
    type: observed
    topic: terrapower-customer-proof
    sourceRefs:
    - SP009
    - SP023
    confidence: high
    freshness: historical
    answersQuestionRefs:
    - QP006
    - QP012
  - id: CP009
    statement: NuScale retains the strongest formal regulatory credential in this peer set because its official product page says the NuScale Power Module is the first and only SMR to receive NRC design approval.
    type: observed
    topic: nuscale-profile
    sourceRefs:
    - SP006
    - SP007
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QP008
    - QP009
  - id: CP010
    statement: NuScale markets a 77 MWe light-water module using standard LWR fuel, with a 12-module plant configuration capable of up to 924 MWe and use cases spanning data centers, process heat, hydrogen, and microgrids.
    type: observed
    topic: nuscale-profile
    sourceRefs:
    - SP006
    - SP007
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QP009
    - QP011
  - id: CP011
    statement: NuScale’s 2025 10-K discloses that it has not yet entered into a binding customer contract to deliver modules and warns that cost competitiveness, commercialization, and future funding remain material risks; adverse reporting on the CFPP termination reinforces those concerns.
    type: observed
    topic: nuscale-adverse
    sourceRefs:
    - SP007
    - SP020
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QP015
    - QP024
  - id: CP012
    statement: 'GE Hitachi and OPG provide one of the clearest western utility-led LWR-SMR reference paths: GE Hitachi says TVA has submitted the first U.S. construction permit application for a BWRX-300 and OPG’s Darlington materials describe a 300 MW SMR at Darlington by the end of the decade, pending approvals.'
    type: observed
    topic: lwr-incumbents
    sourceRefs:
    - SP011
    - SP012
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QP008
    - QP017
  - id: CP013
    statement: 'Holtec and Westinghouse both compete with more familiar water-reactor lineages: Holtec emphasizes an advanced PWR with approximately 600 MW in a dual-unit envelope, while Westinghouse presents AP300 as a proven and readily deployable SMR solution.'
    type: observed
    topic: lwr-incumbents
    sourceRefs:
    - SP013
    - SP024
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QP009
    - QP017
  - id: CP014
    statement: Westinghouse eVinci and Last Energy represent a different packaging challenge from Kairos because they target decentralized or on-site power with factory-built, smaller-scale offerings rather than a 150-MWe-class grid-connected clean-firm-power wedge.
    type: observed
    topic: microreactor-packaging
    sourceRefs:
    - SP025
    - SP026
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QP001
    - QP016
  - id: CP015
    statement: 'Rolls-Royce SMR is aimed at a much larger grid block than Kairos: Rolls says each plant will generate 470 MW of low-carbon energy and power about one million homes for at least 60 years.'
    type: observed
    topic: rolls-profile
    sourceRefs:
    - SP001
    - SP021
    confidence: high
    freshness: current
    answersQuestionRefs:
