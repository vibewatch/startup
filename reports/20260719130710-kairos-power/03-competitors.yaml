- id: diligence-verdict
  title: Diligence verdict on competitive positioning
  body: |-
    Kairos should not be underwritten as a blanket winner across advanced nuclear. The stronger thesis is narrower: Kairos is one of the most credible vendors for staged clean-firm-power deployment in service territories where a named large-load customer, regulatorily visible demonstration path, and manageable plant size matter more than maximum single-site output. That can be a very attractive wedge, especially for data-center-adjacent or regional utility cases.

    The counterpoint is equally important. Kairos is not obviously the best answer for industrial steam buyers, large utility block-power procurements, or customers who primarily value standard fuel and familiar water-reactor lineages. Fusion also competes for imagination and capital, even if not for the same near-term deployments. The practical diligence task is therefore to test Kairos against buyer-specific alternatives—X-energy for heat, TerraPower or Rolls-Royce for scale, GE Hitachi or Holtec for familiarity, Last Energy or eVinci for on-site packaging—rather than against a generic nuclear TAM. That framing preserves both Kairos’ strengths and its competitive limits.
  claimRefs:
  - CP017
  - CP019
  - CP021
  - CP027
  - CP038
  - CP039
