- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - mitigation / diligence ask
  rows:
  - - Google-led demand proof
    - Buyers multi-home across nuclear vendors
    - high
    - Test whether Kairos has exclusive customer workflow or only category validation
  - - Iterative development and Hermes learning path
    - Peers build stronger utility-scale reference projects first
    - high
    - Compare Hermes-to-fleet learning curve against Darlington, Natrium, and X-energy deployment milestones
  - - High-temperature architecture
    - X-energy owns the clearest industrial-steam messaging
    - medium
    - Determine which customer jobs require Kairos thermodynamics versus X-energy steam specifications
  - - Staged plant size
    - Larger peers win when buyers want 300-470 MW blocks
    - medium
    - Map target pipeline by site load and reserve-margin need
  - - Novel-fuel / coolant differentiation
    - Standard-fuel LWR peers appear simpler to risk committees
    - high
    - Assess buyer tolerance for advanced fuel and novel coolant in each target account
  - - Service-territory utility collaboration
    - Utility incumbents may have stronger brownfield or IRP leverage
    - high
    - Review grid-partner depth, interconnection queue status, and local political support
  - - Category enthusiasm for nuclear and AI loads
    - Adverse base-rate from CFPP shows economics can still break
    - high
    - Request delivered-cost, escalation, and contingency assumptions for first commercial sites
  - - Fusion and microreactor adjacency
    - Capital and narrative attention can fragment buyer/investor focus
    - medium
    - Separate near-term customer alternatives from long-dated narrative competitors
  notes: Moat durability depends on converting current proof points into repeatable project delivery, not on category rhetoric alone.
