tables:
- id: TP001
  title: Competitor profile table
  columns:
  - competitor
  - category
  - public scale / capital signal
  - target buyer
  - differentiation
  - current public limitation
  rows:
  - - Kairos Power
    - direct subject / advanced high-temperature peer
    - 150 MWe [2 x 75 MWe] commercial plant; Google up to 500 MW through 2035; Hermes permit
    - hyperscalers, service-territory utilities, staged early adopters
    - fluoride-salt high-temperature design plus iterative commercialization and named hyperscaler proof
    - commercial-fleet economics and repeatability still unproven publicly
  - - X-energy Xe-100
    - direct peer / HTGR
    - 80 MWe module, 320 MW four-pack, Amazon and Energy Northwest proof
    - industrial heat, large campuses, utilities
    - 565°C steam, TRISO-X, high-temperature industrial positioning
    - first-wave commercial delivery still ahead
  - - TerraPower Natrium
    - direct peer / sodium fast reactor
    - 345 MWe design, DOE 50/50 cost share up to $2B, PacifiCorp follow-on study
    - regulated utilities, coal-site replacement, large clean-load growth
    - larger utility-scale block and visible public-private deployment lane
    - HALEU and FOAK complexity remain material
  - - NuScale NPM
    - licensed LWR-SMR peer
    - 77 MWe module, 924 MWe 12-module configuration, public 10-K disclosure
    - utilities, data centers, process heat, hydrogen
    - strongest formal NRC design-approval signal and standard fuel
    - CFPP termination and no binding customer-delivery contract disclosed
  - - GE Hitachi BWRX-300
    - incumbent LWR-SMR peer
    - 300 MW class with Darlington and TVA reference path
    - utilities and regulated projects
    - western utility reference path and boiling-water lineage
    - less differentiated on heat and smaller staged deployment
  - - Holtec SMR-300
    - incumbent LWR-SMR peer
    - dual-unit ~600 MW plant envelope
    - utilities, repowering sites, large off-takers
    - PWR familiarity, passive features, 24/7 clean electricity positioning
    - larger block less tailored to Kairos-sized regional increments
  - - Rolls-Royce SMR
    - utility-scale adjacent peer
    - 470 MW per plant; UK competition win messaging
    - national utilities and large grid planners
    - large single-site output and strong regulatory-progress marketing
    - size and deployment style differ materially from Kairos’ current wedge
  - - Last Energy / eVinci
    - micro / on-site packaging entrants
    - PWR-20 on-site model or 5 MWe microreactor
    - remote, industrial, and behind-the-meter buyers
    - factory-built delivery and smaller on-site packaging
    - different buyer job from Kairos grid-connected 150-MWe-class plant
  notes: Rows mix product size, capital signal, and customer proof because comparable realized pricing is not publicly disclosed across the peer set.
