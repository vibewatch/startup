  - id: CP017
    statement: Fusion firms such as Commonwealth Fusion Systems and TAE are narrative competitors for capital and future clean-energy mindshare, but they are not equivalent near-term commercial power substitutes for Kairos’ 2030-oriented deployment plan.
    type: inferred
    topic: fusion-adjacency
