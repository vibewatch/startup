- id: TP003
  title: Pricing / packaging comparison
  columns:
  - competitor
  - public pricing visibility
  - commercial packaging signal
  - counterparty proof
  - buyer risk transfer clue
  - diligence implication
  rows:
  - - Kairos
    - No public PPA price or LCOE
    - Developer-led multi-unit PPA and service-territory collaboration
    - Google + TVA-linked public signals
    - Unknown construction-delay allocation in public sources
    - Need term sheets, capex model, and who bears schedule risk
  - - X-energy
    - No public delivered-price disclosure
    - Vendor plus partner projects and industrial/utility development path
    - Amazon, Energy Northwest, Dominion exploration
    - Unknown escalation and EPC risk transfer
    - Need project economics beyond MW and module counts
  - - TerraPower
    - No public power-price disclosure
    - Large DOE-backed demonstration plus utility planning lane
    - PacifiCorp and public-private financing signal
    - Some policy de-risking visible, contract economics not
    - Need utility-grade economics and fuel-risk assumptions
  - - NuScale
    - Public-company risk disclosure, no customer price sheet
    - Modular LWR offering with public filings
    - No binding customer-delivery contract disclosed in 10-K
    - Commercial viability still under pressure after CFPP
    - Treat regulatory strength separately from customer conversion
  - - GEH / OPG
    - No public price sheet in reviewed pack
    - Utility-led construction reference path
    - Darlington and TVA path
    - Reference-project credibility stronger than price transparency
    - Need commercial contracting detail for customer-side economics
  - - Holtec / Westinghouse AP300
    - No public project-level price in reviewed pages
    - Large-offtaker utility packaging
    - Brand and technology credibility, limited named customer detail here
    - Unknown owner-cost and EPC terms
    - Need actual counterparties and financing structure
  - - Last Energy / eVinci
    - No direct apples-to-apples energy price
    - On-site or micro-packaged power models
    - Commercial model itself is part of differentiation
    - Potentially lower buyer burden but economics undisclosed
    - Need behind-the-meter pricing and ownership terms
  notes: The absence of comparable public pricing is itself a central competitive finding.
