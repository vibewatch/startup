    - QP017
  - id: CP016
    statement: Terrestrial Energy remains visible as a molten-salt-adjacent entrant, but the current public evidence pack is materially thinner than the disclosures available for Kairos, TerraPower, X-energy, or NuScale.
    type: inferred
    topic: terrestrial-opacity
    sourceRefs:
