  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: peer economics comparability
    missingEvidence: Comparable delivered-cost, PPA-price, EPC-risk-transfer, and owner-cost disclosures across Kairos, X-energy, TerraPower, NuScale, GE Hitachi, Holtec, and Rolls-Royce.
    whyItMatters: Without normalized economics, competitive ranking remains architecture-heavy and cannot cleanly answer buyer value underwrite questions.
    diligencePath: Request project-level pricing decks, capex models, schedule contingencies, and delay-allocation terms for Kairos and the most relevant peers.
    relatedQuestionRefs:
    - QP010
    - QP024
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: kairos-exclusive customer workflow
    missingEvidence: Public sources validate Google and TVA-linked demand but do not show how exclusive or repeatable Kairos’ customer workflow is relative to peers.
    whyItMatters: If customer interest is mostly category validation rather than Kairos-specific lock-in, moat durability is lower than headline announcements imply.
    diligencePath: Review CRM pipeline, exclusivity terms, joint development agreements, and conversion data from lead to signed project.
    relatedQuestionRefs:
    - QP013
    - QP020
    - QP023
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: medium
    topic: terrestrial-and-adjacent-peer-underwriting
    missingEvidence: Current financing scale, milestone schedule, and named counterparties for Terrestrial Energy and other thinner-disclosed peers remain unclear.
    whyItMatters: Opaque peers are hard to score accurately and may either be underrated threats or noise in the landscape.
    diligencePath: Gather current financing, regulatory, and project materials for Terrestrial Energy and any other peer management flags as active in target accounts.
    relatedQuestionRefs:
    - QP021
    relatedTableRefs:
    - TP001
  - type: conflicting-data
    severity: medium
    topic: reference-path versus commercial-conversion risk
    missingEvidence: Public readiness signals (permits, IRPs, construction references) do not cleanly translate into customer conversion, as NuScale’s adverse evidence shows.
    whyItMatters: Investors can over-weight regulatory milestones and under-weight buyer subscription, financing, and project-packaging failure modes.
    diligencePath: Test each peer’s visible milestones against contract bindingness, financing status, and who carries escalation or delay risk.
    relatedQuestionRefs:
    - QP015
    - QP024
    - QP025
    relatedTableRefs:
    - TP003
    - TP004
