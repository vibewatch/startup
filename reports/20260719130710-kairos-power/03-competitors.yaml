- id: switching-costs-supply-and-moat
  title: Switching costs, supply posture, and moat durability
  body: |-
    Kairos’ moat is not a single reactor feature. It is the bundle formed by its iterative test-to-learn model, its first-mover licensing progress on Hermes, its named Google orderbook, and its TVA-linked grid-partner story. That bundle can matter a great deal for buyers who want staged advanced-nuclear deployment rather than a leap straight to a very large plant. However, the moat is not exclusive. X-energy now has Amazon and Energy Northwest; TerraPower has PacifiCorp and a large DOE-backed reference path; GE Hitachi has Darlington and TVA momentum; LWR peers retain standard-fuel familiarity.

    Multi-homing remains a real threat before a buyer commits to a specific site and licensing path. Once a counterparty chooses a site, utility partner, regulatory route, and fuel assumptions, switching costs rise sharply. Until then, however, large power buyers can compare multiple nuclear pathways in parallel. That is why customer proof across the category reduces the value of generic “nuclear for data centers” positioning. Kairos’ competitive durability will come from converting its current bundle into repeatable deployment, not from assuming competitors cannot reach the same customers.
  claimRefs:
