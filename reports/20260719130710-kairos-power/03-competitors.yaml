company:
  name: Kairos Power
chapter:
  number: 3
  title: Competitors
  summary: Kairos Power is not competing to be the universal SMR winner; it is competing to be the most credible vendor for particular clean-firm-power jobs where staged deployment, a named hyperscaler anchor, and a service-territory delivery path matter. Public evidence suggests X-energy is the sharpest industrial-heat rival, TerraPower and large LWR-SMR peers are stronger for bigger utility blocks, NuScale retains the strongest formal licensing credential despite adverse commercial proof, and microreactor or fusion entrants compete more on packaging or narrative than on the same near-term project. Kairos therefore looks differentiated, but its moat depends on turning Hermes, Google, and TVA into a repeatable system faster than peers turn their own public proof into financeable projects.
  contentRequirements:
  - Landscape covering direct peers, incumbents, adjacents, substitutes, status quo, internal build, and likely entrants.
  - Competitor profiles with scale, funding, target customer, product scope, pricing, and strategic direction.
  - Comparisons on capability, pricing, GTM/distribution, and trust/regulatory posture.
  - Switching cost, lock-in, multi-homing, distribution power, and supply/partner access.
  - Moat durability, commoditization or displacement risk, and adverse competitor evidence.
  plannedTables:
  - name: Competitor profile table
    requirement: competitor, category, scale/funding, target segment, differentiation, limitation.
  - name: Feature / capability matrix
    requirement: buying criteria, company, competitors, unsupported cells marked clearly.
  - name: Pricing / packaging comparison
    requirement: price/unit/contract model, included capabilities, discount or unknowns, implication.
  - name: Moat durability / competitive risk register
    requirement: moat claim, threat, severity, mitigation/diligence ask.
  plannedFigures:
  - name: Competitive positioning map
    requirement: Numeric axes only when source-backed; otherwise evidence-backed ordinal scoring with rationale.
    acceptedTypes:
    - quadrant
  - name: Feature breadth / capability map
    requirement: Capability coverage and strength by competitor.
    acceptedTypes:
    - matrix
  - name: Moat / readiness KPIs
    requirement: Compact competitive durability summary.
    acceptedTypes:
    - kpi
  evidenceStrategy:
  - Competitor official surfaces — product, pricing, docs, case studies, security/compliance, integrations, channel pages, changelog.
  - Independent proof — benchmarks, reviews, filings, market reports, customer references, procurement pages, adverse reporting.
  - Never treat vendor-authored comparison pages as independent proof.
  qualityBar:
  - Compare every material way the buyer can solve the same job, including status quo and internal build.
  - Mark unsupported matrix cells as unknown or evidence gaps; never guess.
  - Include adverse/disconfirming evidence on displacement, commoditization, channel power, or incumbent response.
  - Query by competitor class; do not build the matrix from one generic comparison source.
sections:
- id: landscape-segmentation
  title: 'Landscape segmentation: peers, incumbents, and substitutes'
  body: |-
    Kairos is not competing in one undifferentiated “SMR market.” The real landscape splits by buyer job. Direct advanced-reactor peers include X-energy, TerraPower, NuScale, Holtec, GE Hitachi, Westinghouse, Terrestrial Energy, and smaller packaging entrants such as Last Energy. Adjacent narratives include microreactors and fusion. Status-quo substitutes still matter too: larger or more conventional nuclear pathways can win when the buyer prioritizes regulatory familiarity, bigger power blocks, or visible construction references over a more novel architecture.

    That segmentation matters because procurement teams do not buy reactor categories in the abstract. They buy a specific combination of megawatt block, site fit, licensing path, fuel tolerance, commercial counterparties, and schedule confidence. In some of those categories Kairos is genuinely differentiated, especially where staged deployment and named hyperscaler demand matter. In others it is only one credible option among several. The right competitive question is therefore not whether Kairos is “best,” but for which customer jobs its combination of scale, thermodynamics, and commercialization path is most credible relative to alternatives.
  claimRefs:
  - CP001
  - CP002
  - CP014
  - CP017
  - CP033
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: capability-and-packaging-comparison
  title: Capability and packaging comparison
  body: |-
    Kairos’ public package is distinctive but not dominant across every use case. Its 150 MWe two-unit commercial configuration, fluoride-salt cooling, TRISO pebble fuel, and iterative development model make it easier to tell a staged commercialization story than some larger peers can. That supports buyers who want service-territory-sized increments or a named 24/7 clean-power contract before betting on multi-gigawatt fleet buildout. It also pairs naturally with Google’s multi-unit orderbook and the later TVA-linked framing.

    But competitors are differently strong. X-energy is more explicit on industrial steam and high-temperature heat. TerraPower, Holtec, GE Hitachi, Westinghouse AP300, and Rolls-Royce all present larger utility-scale packages or more familiar water-reactor pedigrees. NuScale keeps the strongest formal licensing credential but carries more visible commercial-adoption scars. Public pricing is sparse across all of them, so capability comparison has to lean on size class, heat/output profile, customer proof, and regulatory posture rather than pretending that cost-per-megawatt-hour tables are available. That opacity is itself a diligence finding.
