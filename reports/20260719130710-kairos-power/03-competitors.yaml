  - id: CP018
    statement: CFS explicitly positions SPARC to achieve Q>1 in 2027 and describes ARC as the successor grid-scale fusion power plant, keeping fusion relevant to long-duration investor narratives even if it does not solve Kairos’ immediate buyer job.
    type: company-claimed
    topic: fusion-adjacency
