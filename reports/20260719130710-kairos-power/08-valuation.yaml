- id: scenario-analysis-and-comparables
  title: Bull / base / bear scenario analysis and comparable framing
  body: |-
    Scenario analysis is the only defensible valuation method here. The bull case assumes Hermes milestones hold, the fuel bridge stays on time, and Google/TVA begin to look like the front edge of a repeatable orderbook rather than a one-off project. In that world, Kairos could deserve a meaningful strategic premium to generic pre-commercial energy startups because it would combine customer proof, regulatory progress, and a visible path to repeated deployment. The base case keeps Kairos in the private-unicorn neighborhood but refuses a major re-rating until the company publishes more proof on budget, cap table, and contract economics. The bear case assumes further slippage or fuel mismatches turn the story into a long, expensive demonstration program with limited near-term repeatability.

    The comparable set supports this wide-band framing. TerraPower proves large private capital still backs advanced nuclear; X-energy shows public markets can reward reactor-plus-fuel platforms when milestones are visible; Oklo shows even pre-commercial names can attract public enthusiasm; and NuScale reminds investors how quickly FOAK commercialization can compress value when structure and customer fit break. No single comp prices Kairos cleanly, but the peer set helps bound what strategic upside and downside can look like.
