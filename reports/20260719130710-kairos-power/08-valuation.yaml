    - Kairos stays investable to monitor, but not obviously cheap without private diligence
  - - Bear
    - Material downside tail
    - Further slippage, fuel delays, or weak customer conversion push the story toward prolonged demonstration economics
    - $0.25B-$0.75B
    - Equity value can compress sharply even if the technology story is still alive
