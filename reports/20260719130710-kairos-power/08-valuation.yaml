    expectedMinRows: 4
  - name: Thesis-break and kill triggers table
    requirement: trigger, threshold, transmission to thesis, action implication.
  - name: Final diligence asks table
    requirement: topic, missing evidence, why it matters, owner or diligence path.
  plannedFigures:
  - name: Recommendation logic
    requirement: Chain from scale/proof/risks/valuation to recommendation.
    acceptedTypes:
    - flow
  - name: Valuation sensitivity
    requirement: Sensitivity to revenue, margin, multiple, milestone probability, utilization, or other driver.
    acceptedTypes:
    - bar
  - name: Valuation / return range
    requirement: Low/base/high valuation, exit, dilution, or return outcomes with explicit assumptions.
    acceptedTypes:
    - range
  - name: Investment KPIs
    requirement: IC-ready scoring across market, proof, moat, economics, risk, valuation, and evidence quality.
    acceptedTypes:
    - kpi
  evidenceStrategy:
  - Use prior chapter evidence first, then gather recommendation-critical financing/valuation/comp data directly.
  - "Valuation/financing \u2014 latest rounds, valuation marks, cap-table/preference clues, debt/project finance, public/private comps, M&A, secondary marks."
  - "Scenario drivers \u2014 growth, margin, retention, unit economics, approvals, milestones, loss rates, multiples, exit window."
  - "Adverse/downside \u2014 overvaluation, down-round risk, multiple compression, regulatory blockers, customer concentration, failed commercialization."
  qualityBar:
  - Recommendation is price-sensitive and evidence-sensitive, not a generic company-quality score.
  - Use a valuation method matching business model and stage; show what diligence or price change would move the call.
  - Do not issue buy unless thesis and anti-thesis are evidence-supported and valuation has sufficient support.
  - If valuation inputs are missing, prefer research-more or track over false precision.
  - Include adverse searches on overvaluation, down-round risk, governance, liquidity, or commercialization failure.
sections:
- id: investment-thesis-and-anti-thesis
  title: Investment thesis and anti-thesis
  body: "The positive case for Kairos is stronger than the average advanced-nuclear story because the company already has three things that matter a great deal in this sector: a named hyperscale buyer, a named utility offtaker, and a visible first-plant path. Google\u2019s multi-unit orderbook, TVA\u2019s Hermes 2 PPA, DOE\u2019s fuel support, and Kairos\u2019 iterative development model collectively create a commercialization narrative that is unusually legible for a private reactor company. The customer demand backdrop is also real. Google continues to report large and growing clean-power needs tied to AI and data-center scale, which means Kairos is not trying to sell into an imaginary future market.\n\nThe anti-thesis is not that the market is fake or that the technology lacks interest. It is that the company remains hard to price precisely from public evidence. The schedule has already slipped at Hermes 1, the fuel bridge to fleet scale is incomplete, contract economics are private,\
    \ and the downside precedent from NuScale/UAMPS is too relevant to ignore. In other words, Kairos may be one of the strongest private advanced-nuclear franchises, but the public record still supports a milestone-sensitive optionality story more than a clean value-underwriting story."
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV007
