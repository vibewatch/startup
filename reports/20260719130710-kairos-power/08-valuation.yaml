company:
  name: Kairos Power
chapter:
  number: 8
  title: Valuation
  summary: "Kairos Power looks strategically stronger than most private advanced-nuclear peers, but its public valuation support still trails its strategic validation. The company has an unusually good proof stack\u2014Google demand, TVA offtake, DOE fuel support, and a visible first-plant path. The public record is weaker on what investors ultimately need to price risk: current common-equity valuation, cap-table terms, contract economics, and revised budgets after schedule slippage. The right call is TRACK / CONDITIONAL with low-to-medium confidence, a high risk rating, and wide milestone-sensitive scenario bands rather than point precision."
  contentRequirements:
  - Investment thesis and anti-thesis tied to market, product, customers, financials, competition, and risks.
  - Recommendation, confidence, risk rating, valuation stance, and target return/hold/exit where supportable.
  - Current financing/valuation context, entry discipline, dilution/preference overhang, and whether public evidence supports the price.
  - Bull/base/bear cases with explicit assumptions, valuation ranges, probability signals, and downside triggers.
  - "Comparable set \u2014 public companies, private rounds, M&A, milestone or model-appropriate references."
  - Exit readiness and final diligence asks plus thesis-break triggers.
