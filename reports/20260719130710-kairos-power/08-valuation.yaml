  evidenceGaps:
  - type: missing-source
    severity: material
    topic: current-common-equity-mark
    missingEvidence: Current common-equity valuation, preference stack, warrant overhang, and any special investor protections are not public in retained sources.
    whyItMatters: A company can be strategically strong while still offering weak common-equity value if the private financing stack is aggressive.
    diligencePath: Request the latest financing documents, cap table, liquidation waterfall, and any side letters that affect common-equity outcomes.
    relatedQuestionRefs:
    - QV002
    - QV015
    relatedTableRefs:
    - TV001
    - TV006
  - type: missing-source
    severity: material
    topic: customer-economics
    missingEvidence: Public sources do not disclose pricing mechanics, duration, downside protections, milestone payments, or option-conversion logic for the Google/TVA/Kairos commercial framework.
    whyItMatters: Named counterparties only create valuation support when the investor can understand the economics and obligations behind the headline.
    diligencePath: Review commercial summaries of the master development agreement and the Hermes 2 PPA, including who bears delay, fuel, and performance risk.
    relatedQuestionRefs:
    - QV002
    - QV018
    relatedTableRefs:
    - TV002
    - TV006
  - type: missing-source
    severity: material
    topic: updated-project-budget
    missingEvidence: There is no public revised budget or cost-to-complete package tying the Hermes schedule extension to capital requirements or contingency usage.
    whyItMatters: Without a budget bridge, investors cannot distinguish an absorbable timing slip from a value-destructive cost spiral.
    diligencePath: Request updated project budgets for Hermes 1 and Hermes 2, contingency draw history, and milestone-based capital planning.
    relatedQuestionRefs:
    - QV006
    - QV023
    relatedTableRefs:
    - TV005
    - TV006
  - type: conflicting-data
    severity: medium
    topic: peer-premium-transferability
    missingEvidence: "Public peers demonstrate that advanced nuclear can attract capital, but they do not prove that their market premiums transfer cleanly to Kairos\u2019 private structure and different disclosure posture."
    whyItMatters: Investors can over-read sector enthusiasm and underweight company-specific disclosure, contract, and financing differences.
    diligencePath: Stress-test Kairos against peers using matched milestones, disclosure depth, and common-equity protections rather than headline sector sentiment.
    relatedQuestionRefs:
    - QV009
    - QV027
    relatedTableRefs:
    - TV004
