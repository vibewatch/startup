- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Status / metric
  - Why it matters
  - Relevance to Kairos
  - Key limitation
  enumerationScope:
    coverage: partial
    basis: 'Rows cover the most decision-useful advanced-nuclear comparators actually fetched in this run: one private ARDP heavyweight, one newly public reactor-and-fuel platform, one public optionality-driven reactor platform, and one downside public precedent.'
  rows:
  - - TerraPower
    - Private; announced $650M fundraise in 2025; first Natrium plant backed by large DOE cost share
    - Shows private capital still funds long-horizon advanced nuclear at scale
    - High for capital-intensity and strategic-premium context
    - Different reactor technology and far larger public-private capital stack
  - - X-energy
    - Public in 2026; about $1.1B IPO net proceeds; $43M Q1 2026 revenues and grant income
    - Closest peer showing how markets reward reactor-plus-fuel visibility and milestones
    - High for commercialization and fuel-stack comparison
    - Different reactor type and more public financial disclosure than Kairos
  - - Oklo
    - Public advanced-nuclear company with 2025 results and extensive risk disclosures despite limited commercial proof
    - Shows optionality value can be high before broad operating revenue exists
    - Moderate for public-market enthusiasm and risk-perception context
    - Different scale, fuel-recycling angle, and microreactor-adjacent narrative
  - - NuScale
    - Public SMR company with 2025 revenue and $1.3B cash, but also CFPP downside precedent
    - Defines both commercialization potential and FOAK downside compression
    - High as a stress-test comparator
    - Light-water SMR path and a very different customer and capital-structure history
  notes: No perfect like-for-like public Kairos comparator exists, so the set mixes premium, proof, and failure references.
  claimRefs:
  - CV013
  - CV015
  - CV017
  - CV019
  - CV020
  - CV021
  - CV035
- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Further Hermes schedule slippage
    - Any new deadline-extension request or visible multi-quarter slip versus updated plan
    - Turns execution discount into a core commercialization impairment
    - Move from track/conditional toward hard wait
  - - Fuel bridge deterioration
    - Commercial HALEU or TRISO timing weakens versus reactor schedule
    - Undermines the path from demonstration to repeat fleet deployment
    - Widen valuation discount and re-test bull/base ranges downward
  - - Customer conversion stagnation
    - No meaningful progress beyond first plant or weakening Google/TVA posture
    - Reduces the orderbook from platform proof to one-project proof
    - Cut premium attached to strategic validation
  - - Opaque or adverse financing terms
    - New capital comes with severe preferences, ratchets, or heavy project burdens
    - Common-equity value may be much weaker than headline strategic narrative
    - Require full waterfall analysis before proceeding
  - - FOAK cost blowout signals
    - Budget or contingency deterioration starts to resemble NuScale-style lessons
    - Narrative shifts from disciplined iteration to uncontrolled capital intensity
    - Rotate from monitor to avoid unless price resets materially
  notes: These are the fastest public or diligence-visible ways the current valuation thesis could break.
  claimRefs:
  - CV003
  - CV008
  - CV020
  - CV040
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current valuation and cap table
    - Current common-equity mark, liquidation preferences, warrants, and special rights
    - Without this, no investor can translate strategic strength into real common-value support
    - Request latest financing documents and cap-table waterfall
  - - Customer contract economics
    - PPA pricing mechanics, term, downside protections, milestones, and option conversion logic
    - Named counterparties are valuable only if economics and obligations are understood
    - Request commercial summaries of Google/TVA agreements
  - - Project budget and contingency
    - Updated Hermes 1 and Hermes 2 budget, cost-to-complete, and contingency consumption after schedule extension
    - Determines whether delay is absorbable or value-destructive
    - Review latest budget pack and earned-value reporting
  - - Fuel bridge to fleet scale
    - Volume and timing bridge from DOE HALEU allocation to commercial supply and TRISO throughput
    - A platform story fails if fuel timing misses plant timing
    - Request integrated fuel-supply plan with counterparties and buffers
  - - Replication pipeline
    - Probability-weighted list of additional utilities, regions, or customers beyond Google/TVA
    - Needed to justify premium for platform value instead of one-project value
    - Review business-development funnel and counterparties under NDA
  notes: These asks are the minimum set required to convert the current public thesis into a real pricing decision.
  claimRefs:
  - CV038
  - CV039
