- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Probability signal
  - Key assumptions
  - Valuation range
  - Implication
  rows:
  - - Bull
    - Lower-probability upside
    - Hermes milestones hold, fuel timing synchronizes, customer conversion broadens, and disclosure discount narrows materially
    - $1.6B-$2.4B
    - Kairos begins to look like a repeatable commercial platform rather than just a well-backed demonstration program
  - - Base
    - Core case
    - Strategic position remains strong, but schedule/fuel risk and opacity discount persist while milestones advance only incrementally
