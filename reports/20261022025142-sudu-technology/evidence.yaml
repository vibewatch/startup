evidenceGaps:
  - type: missing-source
    severity: material
    topic: leadership-governance
    missingEvidence: A verified founder, executive, board, control-rights, and succession record for Sudu Technology.
    whyItMatters: >-
      Leadership quality, technical key-person dependence, and governance cannot be assessed from financing
      announcements.
    diligencePath: Request signed executive and board rosters, biographies, employment terms, reserved matters, and succession plans.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: funding-reconciliation
    missingEvidence: >-
      Primary documents reconciling the May and October 2026 financing records, amounts, instruments, valuations, and
      proceeds.
    whyItMatters: Treating the records as additive could overstate total capital raised, ownership dilution, and cash available.
    diligencePath: >-
      Obtain signed term sheets, closing notices, wire schedules, investor confirmations, and the post-close
      capitalization table.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-scale
    missingEvidence: Revenue, ARR, customer count, production deployments, headcount, cash balance, and runway.
    whyItMatters: Capital raised and stated validation plans do not establish commercial adoption or financial sustainability.
    diligencePath: >-
      Request audited accounts, management reporting, customer contracts, deployment acceptance data, workforce records,
      and cash forecasts.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-timeline
    missingEvidence: >-
      Sourced founding, product-launch, partnership, regulatory, and adverse-event dates sufficient for an eight-entry
      company chronology.
    whyItMatters: The assigned pool supports two company financing events but not a complete operating history.
    diligencePath: >-
      Obtain official company history, registry records, dated product releases, partnership contracts, and legal or
      regulatory search results.
    relatedQuestionRefs:
      - QO006
      - QO007
  - type: private-evidence-only
    severity: material
    topic: market-size
    missingEvidence: Sudu-specific pricing, customer pipeline, deployment count, contract value, and bottom-up SAM/SOM model.
    whyItMatters: >-
      External category funding and competitor revenue do not establish the company's obtainable revenue or valuation
      support.
    diligencePath: >-
      Request a customer and pipeline schedule, pricing or contract bands, deployment funnel, and a geography-by-segment
      bottom-up market model.
    relatedQuestionRefs:
      - QM004
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyers
    missingEvidence: Named customer references and documented pilot-to-production conversion evidence.
    whyItMatters: >-
      Industrial robotics adoption depends on measurable workflow ROI and operational reliability, which remain
      unverified for Sudu.
    diligencePath: >-
      Obtain reference calls, pilot acceptance criteria, uptime and task metrics, renewal or expansion evidence, and
      budget-owner confirmation.
    relatedQuestionRefs:
      - QM005
      - QM006
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: conflicting-data
    missingEvidence: A clean primary disclosure for the May 2026 financing amount reported by S&P Capital IQ.
    whyItMatters: The malformed amount token cannot support company scale, market sizing, or capital-intensity analysis.
    diligencePath: >-
      Obtain the financing announcement or transaction record that S&P Capital IQ used and reconcile its currency and
      amount.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable realized pricing, contract structure, implementation cost, and gross-margin evidence for Sudu and its
      closest software-layer peers.
    whyItMatters: Without buyer economics, capability comparisons cannot show whether Sudu wins on total cost or monetization.
    diligencePath: >-
      Request anonymized order forms, API or platform pricing, implementation statements of work, and cohort-level
      realized price data.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: moat
    missingEvidence: >-
      Independent production-scale sim-to-real benchmarks, customer references, retention, and task-level comparisons
      against competing models.
    whyItMatters: Generalization and switching-cost claims are central to whether a robot-brain position is durable.
    diligencePath: >-
      Obtain reproducible benchmark protocols, customer site references, failure-rate logs, and longitudinal deployment
      data.
    relatedQuestionRefs:
      - QP006
      - QP007
    relatedTableRefs:
      - TP002
  - type: conflicting-data
    severity: minor
    topic: competitor-scale
    missingEvidence: >-
      A harmonized source set using common definitions for funding, shipments, revenue, deployment, and date across
      competitors.
    whyItMatters: >-
      The assigned sources mix company announcements, prospectus reporting, secondary trackers, and partner claims with
      different denominators.
    diligencePath: >-
      Reconcile each competitor's latest filing, audited or regulated disclosure, and customer deployment evidence
      before using a league-table ranking.
    relatedQuestionRefs:
      - QP002
      - QP008
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: Audited or management-prepared revenue by stream, contract type, period, and recognition policy.
    whyItMatters: Without recognized revenue and denominators, revenue quality, growth, and valuation multiples cannot be tested.
    diligencePath: >-
