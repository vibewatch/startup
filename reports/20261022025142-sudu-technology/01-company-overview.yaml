callouts:
  - calloutType: strength
    title: Financing is tied to an operating objective
    body: The October report links proceeds to full-stack development and large-scale validation on industrial production lines and workstations, providing a concrete stated use of funds.
    claimRefs: [CO003, CO004]
  - calloutType: risk
    title: Financing records are not additive without reconciliation
    body: The October amount and the May financing title may represent separate, overlapping, or differently described capital events; primary closing documents are required before calculating total raised.
    claimRefs: [CO003, CO005, CO007]
  - calloutType: assumption
    title: Public disclosure is too thin for an operating-scale judgment
    body: Leadership, governance, revenue, customer count, headcount, cash, and validated deployment metrics remain unsupported in the assigned evidence and should not be inferred from investor participation.
    claimRefs: [CO008, CO009]
