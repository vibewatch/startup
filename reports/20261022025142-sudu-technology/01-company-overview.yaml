company:
  name: Sudu Technology
chapter:
  number: 1
  title: Company Overview
  summary: Sudu Technology is described in current reporting as a Chinese general-purpose embodied-AI company financing full-stack development and industrial validation. Two 2026 financing records establish substantial capital activity, but their relationship is unreconciled and the assigned evidence does not establish leadership, governance, revenue, customers, or headcount.
sections:
  - id: identity-and-stage
    title: Identity, scope, and operating stage
    body: >-
      Current reporting identifies Sudu Technology as a Chinese general-purpose embodied-AI
      company, while an S&P Capital IQ item names the legal entity as Shanghai Sudu Technology
      Co., Ltd. The October financing report says proceeds are intended for full-stack technology
      development and large-scale validation at industrial production lines and workstations.
      That evidence supports describing Sudu as moving from laboratory prototypes toward
      industrial validation, not as a proven commercial-scale operator. The assigned sources do
      not establish a founding date, headquarters address, product pricing, recurring business
      model, or production deployment count. Those fields remain explicit gaps rather than facts
      inferred from the company's financing profile.
    claimRefs: [CO001, CO002, CO004, CO009]
    tableRefs: [TO001]
  - id: financing-and-stakeholders
    title: Financing record and stakeholder map
    body: >-
      RobotHot reports an October 2026 round of more than 1 billion yuan, translated by that
      source as $140 million. A separate S&P Capital IQ item is titled as a $500 million financing
      and records convertible preferred shares plus participation by strategic and financial
      investors. Its fetched body contains malformed dollar formatting, so the title amount
      should be confirmed from primary closing documents. The two records must not be added
      together: the evidence does not reconcile whether they are separate rounds, overlapping
      closes, or differently described transactions. It also does not disclose ownership
      percentages, board rights, debt, secondary proceeds, or cash available after either event.
    claimRefs: [CO003, CO005, CO006, CO007]
    tableRefs: [TO003]
  - id: leadership-and-governance
    title: Leadership and governance visibility
    body: >-
      Neither retained Sudu-specific financing text identifies founders, executives, directors,
      or the board structure. This is a disclosure limitation, not evidence that the roles are
      absent or that leadership has changed. It prevents assessment of founder-market fit,
      technical key-person dependence, capital-allocation authority, and succession depth at a
      stage when the company says it is expanding real-world industrial validation. Named
      investors provide a starting point for governance diligence, but investment participation
      does not prove current ownership or control. Management should provide a signed leadership
      roster, biographies, the current capitalization table, board composition, reserved matters,
      and retention arrangements before governance quality is scored.
    claimRefs: [CO006, CO008]
    tableRefs: [TO002]
  - id: milestones-and-context
    title: Milestones, capital intensity, and validation risk
    body: >-
      The retained evidence supports only two dated Sudu financing milestones, so the timeline
      also labels sector events as context rather than company achievements. Category financing
      is substantial: an independent tracker reports $13.8 billion of global robotics startup
      funding in 2025, while Tether announced up to $1.4 billion for NEURA Robotics and TechNode
      reported Unitree's planned 4.202 billion yuan IPO raise. Capital availability does not
      validate Sudu's economics or technical performance. IFR-linked reporting cautions that
      real-world humanoid production capabilities remain largely demonstrators or pilots, and
      independent Unitree analysis shows how public filings can overturn earlier private-company
      narratives. Sudu therefore needs primary operating evidence, not valuation-by-comparable.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
