      - number: '4.2'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              No retained source provides Sudu Technology's bill of materials, compute spend, simulation cost per useful
              training hour, data-collection expense, manufacturing commitments, support burden, gross margin, CAC,
              sales cycle, payback, or working-capital profile. The financing structure therefore matters: a convertible
              preferred round can fund engineering and manufacturing scale, but even a verified amount raised would not
              equal cash currently available after fees, prior obligations, or planned deployment.

              Comparable sector evidence shows why operating proof is material. An industry funding overview describes
              Figure's use of capital for AI training, robot manufacturing, engineering headcount, and commercial
              deployment; BMW's report on Figure 02 documents a production trial but does not establish Sudu's
              economics. Unitree's later public financial disclosure provides a benchmark for what useful hardware
              underwriting can eventually look like—revenue, profit, mix, gross margin, and customer composition—but
              those secondary figures belong to Unitree and are peer context rather than an independent benchmark for
              Sudu. Sudu should therefore be underwritten on measured unit economics only after management supplies
              company-specific denominators.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI009
              - CI010
              - CI011
              - CI014
      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              The strongest current financial fact is the reported May 2026 financing event, with GL Ventures, BlueRun,
              Tencent's investment arm, Ant Group, CATL, Alibaba, and IDG Capital listed as participants. The source
              says the securities were convertible preferred shares, but its amount field is malformed and is not
              treated here as a verified $500 million figure. The record does not disclose post-money valuation, cash
              balance, burn rate, runway, debt, liquidation preferences, use of proceeds, or the next-round trigger.
              Financing dependency therefore cannot be quantified: without a cash-flow statement and deployment plan,
              the round cannot be translated into months of runway.

              Sector capital is abundant but selective. The retained 2026 overview reports $13.8 billion raised by
              robotics startups globally in 2025 and describes capital concentrating in companies with deployments,
              corporate partnerships, and defensible software. Those are market-context observations, not Sudu metrics.
              The financial verdict is research-more: the financing event may provide capacity to build, but the
              unverified amount and absence of revenue, margin, cash, and contract evidence prevent a credible return or
              solvency assessment. Priority diligence is a reconciled cash bridge from the financing close to current
              cash, monthly burn by function, committed capex, debt and preferred-share terms, and signed commercial
              obligations.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Evidence gaps that block underwriting
        blocks:
          - type: paragraph
            body: >-
              The open questions are not cosmetic. Revenue recognition cannot be assessed without contracts and delivery
              evidence; unit economics cannot be assessed without the unit, customer, and period denominators; and
              capital adequacy cannot be assessed without current cash, burn, liabilities, and financing terms. A
              financing headline can coexist with rapid cash consumption during model training, robot prototyping,
              facility buildout, or customer integration. Until those records are produced, a valuation comparison to
              better-disclosed robotics peers would conflate capital raised with enterprise value and conflate market
              enthusiasm with operating performance.
            claimRefs:
              - CI004
              - CI006
              - CI010
              - CI014
