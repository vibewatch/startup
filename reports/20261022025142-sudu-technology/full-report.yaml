        title: Leadership and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Neither retained Sudu-specific financing text identifies founders, executives, directors, or the board
              structure. This is a disclosure limitation, not evidence that the roles are absent or that leadership has
              changed. It prevents assessment of founder-market fit, technical key-person dependence, capital-allocation
              authority, and succession depth at a stage when the company says it is expanding real-world industrial
              validation. Named investors provide a starting point for governance diligence, but investment
              participation does not prove current ownership or control. Management should provide a signed leadership
              roster, biographies, the current capitalization table, board composition, reserved matters, and retention
