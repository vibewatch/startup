      - number: '5.3'
        title: Differentiation and deployment path
        blocks:
          - type: paragraph
            body: >-
              Sudu's proposed differentiation is the ability to scale policy learning through simulation rather than
              relying primarily on expensive teleoperation and real-robot data. That could lower marginal
              data-collection cost and make a common policy more portable across workcells, but the public evidence does
              not establish that the claimed advantage survives changes in robot embodiment, sensors, latency, contact
              dynamics, or factory safety constraints. The company-linked account says the system is being developed for
              multiple manufacturing and logistics workstations and that a developer center and toolchain are being
              built. These statements show a roadmap and intended ecosystem, not measured production uptime, integration
              time, customer conversion, or support burden. MarketResearchFuture provides sector context that AI,
              computer vision, machine learning, sensors, and actuators are competitive layers in China's humanoid
              market; it does not validate Sudu's implementation.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Trust, reliability, and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The available sources do not document a security model, privacy impact assessment, safety case,
              certification, incident history, uptime commitment, software update process, or formal quality system for
              Sudo R1. The simulation-first approach may reduce the need to collect sensitive customer demonstrations,
              as claimed in the Chinese report, but it does not by itself demonstrate that customer data, teleoperation
              channels, model artifacts, or robot control interfaces are protected. Nor does a successful manipulation
              demo establish safe behavior under sensor degradation, novel contact forces, network interruption, or
              adversarial inputs. IDG Capital's own site warns about impersonation and says official information is
              released only through its official website; that notice is not evidence about Sudu's product, but it
              reinforces the need to verify partner and investor claims through primary records. The diligence priority
              is a reproducible benchmark and deployment evidence with safety, security, and reliability controls.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Simulation-first technical thesis
            body: >-
              The clearest product thesis is to scale embodied-policy learning through simulation and general
              manipulation rather than task-by-task real-world data collection.
            calloutType: strength
            claimRefs:
              - CE005
              - CE009
          - type: callout
            title: Sim-to-real proof is the gating risk
            body: >-
              Reported zero-shot and object-generalization results lack the benchmark definitions, denominators,
              hardware details, and independent replication needed to underwrite production maturity.
            calloutType: risk
            claimRefs:
              - CE006
              - CE007
              - CE008
          - type: callout
            title: Request reproducible deployment evidence
            body: >-
              Before treating Sudo R1 as production-ready, request a held-out task suite, failure and safety logs,
              embodiment details, security controls, uptime data, and named customer acceptance criteria.
            calloutType: recommendation
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and use cases
        blocks:
          - type: paragraph
            body: >-
              The strongest customer-facing evidence is a company-linked report describing Sudo R1 for industrial
              sorting and warehouse depalletizing. It says the system can adapt across transparent, flexible,
              reflective, and other unknown objects and that deployment does not require collecting sensitive production
              data. Those claims point to industrial operators whose buying criteria include rapid integration, data
              governance, and tolerance for unstructured objects, rather than to a general consumer product. The same
              report names sorting and palletizing as commercial scenarios, but it does not identify a paying customer,
              contract, site, purchase order, or production acceptance test. Broader sector evidence places initial
              humanoid adoption in factories, logistics centers, and other semi-structured environments; this is a
              market context, not proof of Sudu adoption.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU013
          - type: table
