      - number: '6.2'
        title: Adoption proof and trajectory
        blocks:
          - type: paragraph
            body: >-
              Sudu's public adoption proof is a product demonstration rather than a customer deployment record. The
              reported test ran continuously for 60 minutes and involved grasping multiple classes of unknown objects,
              with a claimed near-100% zero-shot success rate. That is relevant to technical feasibility and a
              prospective buyer's evaluation, but it lacks the denominator definition, task-by-task log, independent
              witness, site name, paid-versus-pilot status, utilization history, and post-deployment outcome needed to
              infer active accounts or repeat usage. The adjacent robotics market has clearer public examples of factory
              and warehouse deployments, which raises the evidentiary bar for Sudu: a demo should not be presented as
              production traction. No source in this assigned pool discloses Sudu customer count, revenue by customer,
              renewal, churn, NRR, GRR, or contract duration.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU014
