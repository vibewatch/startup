  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adoption context
        blocks:
          - type: paragraph
            body: >-
              The relevant market is the software, robot systems, and deployment services required to make physical work
              adaptable across tasks and environments. It includes embodied-intelligence models, robot bodies, sensing
              and control systems, simulation and training infrastructure, integration, and recurring support for
              industrial or service deployments. It excludes conventional fixed industrial automation that performs a
              single repetitive task without a general physical-intelligence layer, as well as speculative household
              demand that has not reached a repeatable purchasing workflow. Sudu's available descriptions position it as
              a general-purpose embodied intelligent robot-platform developer, while its October 2026 financing report
              says its proceeds will support scaled verification in real industrial scenarios. That wording makes
              industrial deployment evidence more decision-relevant than a broad humanoid-robot headline market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM011
      - number: '2.2'
        title: Multiple sizing lenses and comparability limits
        blocks:
          - type: paragraph
            body: >-
              The evidence supports several non-equivalent lenses rather than one company-specific TAM. A sector tracker
              reports $13.8 billion of global robotics-startup funding in 2025 and cites a $38 billion 2035 humanoid
              robotics projection from Goldman Sachs, but those figures represent capital formation and an external
              category forecast, not Sudu revenue or an addressable serviceable market. RoboticsTomorrow, summarizing
              IFR material, reports that China accounted for 54% of annual industrial-robot installations and says near-
              and medium-term universal humanoid adoption is unlikely; industrial automation therefore remains a
              substitute and timing constraint. Unitree's IPO disclosure provides an operating-market reference point,
              with 2025 revenue of 1.699 billion yuan and more than 5,500 humanoid robots shipped. A separate Unitree
              analysis says 73.6% of humanoid revenue came from research and education and roughly 9% from industrial
              deployment, illustrating that shipped units do not yet prove factory-scale adoption. Unitree is a
              competitor, so its figures cannot be transferred to Sudu. A fetched S&P Capital IQ item also renders a
              reported Sudu funding amount with malformed comma placement, making it unusable as a sizing input. The
              available sources do not isolate Sudu's SAM, SOM, pricing, deployment count, or customer budget, so those
              values remain diligence gaps.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
