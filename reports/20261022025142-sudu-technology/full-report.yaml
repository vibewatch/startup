      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Clear industrial wedge
            body: >-
              Sudu has articulated use cases where flexible grasping and limited customer-data transfer could matter to
              industrial buyers.
            calloutType: strength
            claimRefs:
              - CU001
