      - number: '6.3'
        title: Expansion, procurement, and concentration
        blocks:
          - type: paragraph
            body: >-
              The proposed expansion path is from a first industrial manipulation workflow into adjacent sorting,
              warehousing, and palletizing tasks. A simulation-first approach could reduce the need for sensitive
              customer data during onboarding, but the evidence does not establish implementation time, integration
              cost, safety acceptance, service levels, or whether one buyer can expand across sites. Funding and
              investor disclosures show capital participation, not customer concentration or commercial durability. The
              practical diligence priority is therefore a customer-level evidence pack: signed referenceable accounts,
              production-versus-pilot status, paid deployment dates, task-level uptime and success logs, expansion
              economics, and the share of revenue attributable to the largest account or channel.
            claimRefs:
