              - CM008
              - CM015
      - number: '2.3'
        title: Buyer segmentation, drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The most supportable initial buyer path is enterprise and industrial: factories, logistics operators, and
              other sites where a general physical intelligence layer can be verified against a defined workflow. The
              buyer, user, and payer may differ: operations or plant leadership owns the productivity problem,
              engineering and safety teams validate the system, and a corporate capital or automation budget funds
              deployment. The October 2026 financing account explicitly names real industrial scenarios and scaled
              verification, while the China policy coverage describes demonstrators and pilot projects as the current
              state of many humanoid deployments. This implies a staged adoption path from pilot to repeatable
              multi-site deployment, with ROI, safety, integration, data control, and reliability as gating criteria.
              Switching from established industrial robots is constrained by precision and speed requirements; switching
              from manual work is constrained by trust, training, and operational risk. Sudu's public evidence does not
              identify a named paying customer, contract value, conversion rate, or budget owner, so the segment map is
              a diligence hypothesis anchored to the reported industrial verification use case.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
