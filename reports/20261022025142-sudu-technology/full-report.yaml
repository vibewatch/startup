  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and observable traction
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not disclose Sudu Technology revenue, ARR, GMV, recognized units, utilization,
              realized pricing, gross margin, or customer concentration. The May 2026 S&P Capital IQ record identifies a
              financing event and says the company issued convertible preferred shares, but its amount is rendered as
              "$500,0000,000" and cannot be normalized without another source. The Chinese announcement page in the pool
              is not usable for a transaction or operating claim because its fetched body contains only the text “看横店”
              and “不喜欢,” rather than an auditable disclosure. Accordingly, the public record cannot classify Sudu as
              pre-revenue, early-commercial, or scaled; absence of a disclosed metric is not evidence that its value is
              zero.

              The commercial mechanism is also not public enough to classify confidently as SaaS, robotics-as-a-service,
              hardware sales, licensing, or a blended model. For a simulation- trained robot-brain company, revenue
              quality will depend on whether customers pay for robot deployments, software access, integration, data, or
              services, and whether those receipts recur. The current record supports a diligence request for contracts,
              invoices, backlog, deferred revenue, shipment records, and a revenue-recognition policy before any
              run-rate or growth multiple is used.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI015
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
