chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, scope, and operating stage
        blocks:
          - type: paragraph
            body: >-
              Current reporting identifies Sudu Technology as a Chinese general-purpose embodied-AI company, while an
              S&P Capital IQ item names the legal entity as Shanghai Sudu Technology Co., Ltd. The October financing
              report says proceeds are intended for full-stack technology development and large-scale validation at
              industrial production lines and workstations. That evidence supports describing Sudu as moving from
              laboratory prototypes toward industrial validation, not as a proven commercial-scale operator. The
              assigned sources do not establish a founding date, headquarters address, product pricing, recurring
              business model, or production deployment count. Those fields remain explicit gaps rather than facts
              inferred from the company's financing profile.
