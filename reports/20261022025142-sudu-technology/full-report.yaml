        title: Exhibits
        blocks:
          - type: callout
            title: A documented financing event signals investor access
            body: >-
              The May 2026 record identifies convertible preferred shares and multiple strategic and institutional
              participants, but its malformed amount field prevents quantifying the capital raised.
            calloutType: strength
            claimRefs:
              - CI002
              - CI003
              - CI009
          - type: callout
            title: Capital raised cannot substitute for cash-flow evidence
            body: >-
              No retained source reports current cash, burn, runway, debt, preferred terms, or use of proceeds, so
