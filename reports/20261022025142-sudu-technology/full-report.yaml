        title: Financing record and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              RobotHot reports an October 2026 round of more than 1 billion yuan, translated by that source as $140
              million. A separate S&P Capital IQ item is titled as a $500 million financing and records convertible
